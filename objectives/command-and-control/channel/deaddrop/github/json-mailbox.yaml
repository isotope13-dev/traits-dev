# GitHub repository contents used as a per-bot command mailbox: cmd.json for
# tasking, result.json for output, beacon.json for heartbeat. Scoped away from
# the JS/TS Controllers mailbox atoms so matcher types do not collide.
defaults:
  platforms: [windows, unix]
  for: [rust, python, go]
  attack: T1102.001
  mbc: C0002

traits:
  - id: github-cmd-json-mailbox
    desc: GitHub C2 cmd.json mailbox file
    crit: notable
    conf: 0.92
    if:
      type: string_literal
      exact: cmd.json

  # A bare `result.json` is the one name in this trio that ordinary code
  # writes on its own -- any tool that saves a run's output picks it, and a
  # pytest case writing `tmp_path / "result.json"` is not a C2 mailbox. The
  # literal is a fragment of the mailbox signature, not an observation about
  # the file, so it carries no standalone claim; the composite below supplies
  # the GitHub contents-API context that makes the trio mean something.
  - id: result-json-filename-literal
    desc: result.json filename literal
    crit: component
    conf: 0.92
    if:
      type: string_literal
      exact: result.json
    unless:
      - id: well-known/app/ai/usage/docent::docent-harbor-integration-context
      - id: well-known/app/development/callflow-tracer::module-path
      - type: text
        substr: is_harbor_trial_dir

  - id: github-beacon-json-mailbox
    desc: GitHub C2 beacon.json mailbox file
    crit: notable
    conf: 0.92
    if:
      type: string_literal
      exact: beacon.json

composite_rules:
  - id: github-cmd-result-beacon-mailbox
    desc: GitHub cmd/result/beacon JSON mailbox trio
    crit: suspicious
    conf: 0.96
    all:
      - id: github-cmd-json-mailbox
      - id: result-json-filename-literal
      - id: github-beacon-json-mailbox
    near_bytes: 4096

  - id: github-contents-json-mailbox-c2
    desc: GitHub contents API drives JSON C2 mailbox
    crit: hostile
    conf: 0.98
    all:
      - id: github-cmd-result-beacon-mailbox
      - id: micro-behaviors/communications/http/services/github::github-contents-api-endpoint
    near_bytes: 8192

  - id: github-mailbox-shell-tasking
    desc: GitHub JSON mailbox executes shell commands
    crit: hostile
    conf: 0.99
    attack: T1102.001,T1059.003
    all:
      - id: github-contents-json-mailbox-c2
      - id: micro-behaviors/process/create/exec::cmd-exe-reference
    near_bytes: 8192
