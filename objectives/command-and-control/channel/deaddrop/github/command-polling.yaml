# GitHub raw files can act as a mutable command mailbox.  The signal is the
# complete loader shape: a raw script endpoint, a recurring poll, and execution
# of the returned command.  A raw GitHub URL alone remains a neutral capability.
defaults:
  platforms: [unix, windows]
  for: [python, shell, javascript, typescript, powershell]
  attack: "T1102,T1059"

# The raw-script URL leg is the neutral capability
# micro-behaviors/communications/http/url/github::raw-githubusercontent-script-file;
# this file's former `github-raw-command-script-url` duplicated it and named a
# plain script URL a "command" URL.

composite_rules:
- id: github-raw-polled-command-execution
  for: [python]
  desc: GitHub raw command polling and execution
  crit: hostile
  conf: 0.98
  near_bytes: 4096
  all:
  - id: micro-behaviors/communications/http/url/github::raw-githubusercontent-script-file
  - id: micro-behaviors/time/sleep/interval::numeric-delay-call
  - id: micro-behaviors/process/create/subprocess::variable-command-argument
  any:
  - id: micro-behaviors/communications/http/download/github::github-raw-fetch
  - id: micro-behaviors/communications/http/request/client::request-python
  - id: micro-behaviors/communications/http/request/client::js-fetch-call

- id: github-raw-command-channel-with-systemd-persistence
  for: [python]
  desc: GitHub raw command channel with systemd persistence
  crit: hostile
  conf: 0.995
  attack: "T1102,T1059,T1543.002"
  near_bytes: 12000
  all:
  - id: github-raw-polled-command-execution
  - id: micro-behaviors/os/service/control::systemctl-enable-on-line
  - id: micro-behaviors/os/service/config::systemd-etc-unit-path
