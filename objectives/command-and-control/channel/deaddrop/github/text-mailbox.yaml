# GitHub Contents API command mailboxes recovered from source or binary string
# tables. Requiring separate command, result, and liveness roles distinguishes
# bidirectional tasking from ordinary repository automation and asset uploads.
defaults:
  platforms: [windows, unix]
  for: [scripts, source, binaries]
  attack: T1102.002
  mbc: C0002

composite_rules:
  - id: text-command-result-heartbeat-mailbox
    desc: Command, result, and heartbeat text mailbox files
    crit: suspicious
    conf: 0.97
    all:
      - id: micro-behaviors/fs/path/reference::command-mailbox-text-filename
      - id: micro-behaviors/fs/path/reference::result-mailbox-text-filename
      - id: micro-behaviors/fs/path/reference::heartbeat-mailbox-text-filename
    near_bytes: 8192

  - id: github-contents-text-mailbox-c2
    desc: GitHub Contents API drives a text command mailbox
    crit: hostile
    conf: 0.99
    all:
      - id: text-command-result-heartbeat-mailbox
      - id: micro-behaviors/communications/http/services/github::github-contents-api-endpoint
      - id: micro-behaviors/communications/http/authorization-header/
    near_bytes: 8192

  - id: github-text-mailbox-command-execution
    desc: GitHub text mailbox tasking drives process execution
    crit: hostile
    conf: 0.995
    attack: T1102.002,T1059
    all:
      - id: github-contents-text-mailbox-c2
      - id: micro-behaviors/process/create/
    near_bytes: 8192

  - id: github-text-mailbox-encrypted-c2
    desc: GitHub text mailbox uses AES-encrypted tasking
    crit: hostile
    conf: 0.995
    all:
      - id: github-contents-text-mailbox-c2
      - id: micro-behaviors/crypto/symmetric/aes/
    near_bytes: 8192
