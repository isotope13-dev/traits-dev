defaults:
  platforms:
  - windows
  - unix
  for:
  - scripts
  - source
  - binaries
  attack: T1102.002
  mbc: C0002
composite_rules:
- id: text-command-result-heartbeat-mailbox
  desc: Command, result, and heartbeat text mailbox files
  crit: notable
  conf: 0.97
  all:
  - id: micro-behaviors/fs/path/reference::command-mailbox-text-filename
  - id: micro-behaviors/fs/path/reference::result-mailbox-text-filename
  - id: micro-behaviors/fs/path/reference::heartbeat-mailbox-text-filename
  near_bytes: 8192
- id: github-contents-polled-mailbox-c2
  desc: GitHub Contents read-write loop drives command tasking
  crit: hostile
  conf: 0.99
  all:
  - id: micro-behaviors/communications/http/services/github/repository::github-contents-api-endpoint
  - id: micro-behaviors/communications/http/services/github/repository::github-contents-api-write-flow
  - id: micro-behaviors/communications/http/authorization-header/
  - id: micro-behaviors/communications/http/lib/reqwest::rust-reqwest
  - id: micro-behaviors/data/control-flow/loop/unconditional::block-unbounded-loop-header
  any:
  - id: text-command-result-heartbeat-mailbox
  - id: micro-behaviors/crypto/symmetric/aes/
  - id: micro-behaviors/crypto/provider/webcrypto::webcrypto-aes-gcm-decrypt
  - id: micro-behaviors/process/create
  - id: metadata/lang/natural/diagnostic::pyc-shell-command-description
  - id: micro-behaviors/process/replace/
  needs: 2
  near_bytes: 8192
