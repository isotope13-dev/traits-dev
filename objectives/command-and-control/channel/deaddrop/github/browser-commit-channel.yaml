# Browser command channels that use GitHub commit search as a dead drop.
# GitHub is not inherently malicious; the hostile rule requires the API to be
# paired with encrypted command decoding and a JavaScript execution sink.
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
  attack: T1102

composite_rules:
  - id: github-commit-encrypted-browser-command
    desc: GitHub commit-search dead drop decrypts and evaluates browser commands
    crit: hostile
    conf: 0.99
    attack: "T1102,T1059.007,T1027"
    near_bytes: 8192
    all:
      - id: objectives/command-and-control/channel/deaddrop/github::github-commit-search-api
      - id: micro-behaviors/process/interpreter/eval/direct::js-eval-call-expression-arg
    any:
      - id: micro-behaviors/crypto/symmetric/decrypt::js-decrypt-helper-call
      - id: micro-behaviors/crypto/symmetric/aes/ctr::aes-ctr-algorithm-marker
