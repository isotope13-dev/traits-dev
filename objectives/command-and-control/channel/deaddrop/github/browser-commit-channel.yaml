# Browser command channels that use GitHub commit search as a dead drop.
# GitHub is not inherently malicious; the hostile rule requires the API to be
# paired with encrypted command decoding and a JavaScript execution sink.
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
  attack: T1102

traits:
  - id: browser-decrypt-call
    desc: Browser JavaScript decrypts a value
    crit: notable
    conf: 0.94
    if:
      type: text
      # Media pipelines use decryptChunk/decryptSegment helpers; dead-drop
      # decryptors use decryptData/decryptPayload-style entry points.
      regex: '(?i)\bdecrypt(?!Chunk|Segment|Stream)[A-Za-z_$][A-Za-z0-9_$]*\s*\('

  - id: browser-aes-ctr-cipher
    desc: Browser JavaScript references AES-CTR
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: '(?i)\baes-(128|192|256)-ctr\b'

composite_rules:
  - id: github-commit-encrypted-browser-command
    desc: GitHub commit-search dead drop decrypts and evaluates browser commands
    crit: hostile
    conf: 0.99
    attack: "T1102,T1059.007,T1027"
    near_bytes: 8192
    all:
      - id: objectives/command-and-control/channel/deaddrop/github::github-commit-search-api
      - id: micro-behaviors/process/interpreter/eval::js-eval-call-expression-arg
    any:
      - id: browser-decrypt-call
      - id: browser-aes-ctr-cipher
