defaults:
  platforms:
  - windows
  - unix
  crit: suspicious
  attack: T1102
  for:
  - scripts
  - binaries
traits:
- id: official-flamegraph-script-url
  desc: Official FlameGraph script URL
  crit: notable
  conf: 0.95
  if:
    type: text
    substr: raw.githubusercontent.com/brendangregg/FlameGraph/master/flamegraph.pl
- id: github-commit-search-api
  desc: GitHub commit search API
  crit: notable
  conf: 0.86
  for:
  - python
  - javascript
  - typescript
  - shell
  if:
    type: string_literal
    substr: api.github.com/search/commits
- id: github-commit-search-preview
  desc: GitHub commit search preview media type
  crit: notable
  conf: 0.84
  for:
  - python
  - javascript
  - typescript
  - shell
  if:
    type: string_literal
    exact: application/vnd.github.cloak-preview+json
- id: github-contents-put-fetch
  desc: GitHub contents write fetch
  crit: notable
  conf: 0.9
  for:
  - javascript
  - typescript
  if:
    type: text
    substr: fetch(this.buildUrl(path)
- id: github-contents-put-method
  desc: GitHub contents PUT method
  crit: notable
  conf: 0.9
  for:
  - javascript
  - typescript
  if:
    type: text
    regex: fetch\s*\(\s*this\.buildUrl\(\s*path\s*\)[\s\S]{0,900}method\s*:\s*["']PUT["']
- id: github-contents-json-body
  desc: GitHub contents JSON body
  crit: notable
  conf: 0.88
  for:
  - javascript
  - typescript
  if:
    type: text
    substr: 'content: toBase64Json(value)'
- id: github-contents-get-json-function
  desc: GitHub contents JSON reader
  crit: notable
  conf: 0.86
  for:
  - javascript
  - typescript
  if:
    type: text
    substr: async getJson(path)
- id: github-contents-base64-json-read
  desc: GitHub contents base64 JSON decode
  crit: notable
  conf: 0.86
  for:
  - javascript
  - typescript
  if:
    type: text
    substr: fromBase64Json(file.content
- id: github-cmd-json-file
  desc: GitHub C2 cmd.json filename marker
  crit: component
  conf: 0.9
  for:
  - javascript
  - typescript
  if:
    type: string_literal
    exact: cmd.json
- id: github-data-json-file
  desc: GitHub C2 data.json filename marker
  crit: component
  conf: 0.9
  for:
  - javascript
  - typescript
  if:
    type: string_literal
    exact: data.json
- id: github-handshake-json-file
  desc: GitHub C2 handshake.json filename marker
  crit: component
  conf: 0.9
  for:
  - javascript
  - typescript
  if:
    type: string_literal
    exact: handshake.json
- id: encrypted-command-decrypt-call
  desc: Encrypted command decrypt call
  crit: notable
  conf: 0.9
  for:
  - javascript
  - typescript
  if:
    type: symbol
    exact: decryptPayload
- id: encrypted-command-result-call
  desc: Encrypted command result call
  crit: notable
  conf: 0.9
  for:
  - javascript
  - typescript
  if:
    type: symbol
    exact: encryptPayload
- id: shell-action-execasync
  desc: Shell action executed asynchronously
  crit: suspicious
  conf: 0.92
  for:
  - javascript
  - typescript
  if:
    type: text
    regex: cmd\.type === ['"]shell['"][\s\S]{0,500}execAsync\(cmd\.action\)
- id: github-c2-client-boot-marker
  desc: GitHub C2 client boot field marker
  crit: component
  conf: 0.94
  for:
  - javascript
  - typescript
  if:
    type: text
    substr: client_boot_id
- id: github-c2-command-sequence-marker
  desc: GitHub C2 sequence field marker
  crit: component
  conf: 0.94
  for:
  - javascript
  - typescript
  if:
    type: text
    substr: cmd_seq
- id: python-rsa-sha256-verify-helper-symbol
  desc: Python RSA SHA256 verify helper symbol
  crit: notable
  conf: 0.9
  for:
  - python
  if:
    type: symbol
    regex: (?i)(rsa.*verify.*sha256|verify.*rsa.*sha256)
- id: raw-github-doc-url
  desc: GitHub raw documentation URL
  crit: baseline
  conf: 0.9
  if:
    type: text
    regex: raw\.githubusercontent\.com/.{1,100}/docs?/.{0,100}\.(html|txt|php)
composite_rules:
- id: github-contents-put-json
  desc: GitHub contents JSON write
  crit: suspicious
  conf: 0.9
  for:
  - javascript
  - typescript
  near_bytes: 900
  all:
  - id: github-contents-put-fetch
  - id: github-contents-put-method
  - id: github-contents-json-body
- id: github-contents-get-json
  desc: GitHub contents JSON read
  crit: suspicious
  conf: 0.88
  for:
  - javascript
  - typescript
  near_bytes: 900
  all:
  - id: github-contents-get-json-function
  - id: github-contents-base64-json-read
- id: github-c2-state-files
  desc: GitHub C2 command state files
  crit: suspicious
  conf: 0.94
  for:
  - javascript
  - typescript
  all:
  - id: micro-behaviors/communications/http/services/github::github-contents-template-api
  - id: github-contents-get-json-function
  - id: github-contents-base64-json-read
  needs: 2
  any:
  - id: github-cmd-json-file
  - id: github-data-json-file
  - id: github-handshake-json-file
  - id: github-c2-client-boot-marker
  - id: github-c2-command-sequence-marker
- id: github-encrypted-command-result
  desc: GitHub encrypted command result
  crit: suspicious
  conf: 0.94
  for:
  - javascript
  - typescript
  all:
  - id: encrypted-command-decrypt-call
  - id: encrypted-command-result-call
  - id: shell-action-execasync
- id: github-gist-api-eval-deaddrop
  desc: GitHub Gist API content executed with eval
  crit: hostile
  conf: 0.97
  attack: T1102.003,T1059.007
  mbc: C0002,B0009.016
  for:
  - javascript
  - typescript
  - npm
  - tar
  - zip
  - vsix
  - crx
  - xpi
  - asar
  near_bytes: 512
  all:
  - id: micro-behaviors/communications/http/services/github::github-gist-api-url
  - id: micro-behaviors/data/serialize/envelope::files-map-content-field-read
  - id: micro-behaviors/communications/http/request/client::js-fetch-call
  - id: micro-behaviors/process/interpreter/eval/direct::js-eval-raw
  any:
  - id: objectives/command-and-control/dropper/script-eval/remote-code::eval-json-content-field
  - id: objectives/command-and-control/dropper/script-eval/remote-code::eval-direct-json-content
  - id: micro-behaviors/process/interpreter/eval/direct::js-eval-variable-argument
  unless:
  - id: metadata/package/testing/
  - id: "metadata/file/naming::test-directory-component"
- id: github-gist-command-mailbox
  desc: GitHub Gist bidirectional command mailbox
  crit: hostile
  conf: 0.995
  attack: T1102.002,T1059
  mbc: C0002
  near_lines: 35
  all:
  - id: micro-behaviors/communications/http/services/github::github-gist-api-url
  - id: micro-behaviors/data/serialize/envelope::files-map-content-field-read
  - id: micro-behaviors/communications/http/services/github::github-gist-file-write-api
  any:
  - id: micro-behaviors/communications/http/lib/requests::requests-get
  - id: micro-behaviors/communications/http/request/client::js-fetch-call
  - id: micro-behaviors/communications/http/get::http-get
- id: github-gist-command-execution
  desc: GitHub Gist command mailbox drives process execution
  crit: hostile
  conf: 0.995
  attack: T1102.002,T1059
  mbc: C0002
  near_lines: 45
  all:
  - id: github-gist-command-mailbox
  any:
  - id: "micro-behaviors/process/create"
- id: github-contents-command-channel
  desc: GitHub contents command channel
  crit: hostile
  conf: 0.97
  attack: T1102.002,T1059
  mbc: C0002
  for:
  - javascript
  - typescript
  all:
  - id: micro-behaviors/communications/http/services/github::github-contents-template-api
  - id: github-contents-put-json
  - id: github-c2-state-files
  - id: github-encrypted-command-result
  any:
  - id: github-contents-get-json
  - id: micro-behaviors/process/create/shell/bridge::child-process-exec
  - id: micro-behaviors/os/module/require::child-process-require
- id: github-contents-command-channel-package
  desc: Multi-file package uses GitHub contents as command channel
  crit: hostile
  conf: 0.97
  attack: T1102.002,T1059
  mbc: C0002
  for:
  - npm
  - tar
  - javascript
  scope: archive
  all:
  - id: micro-behaviors/communications/http/services/github::github-contents-template-api
  - id: github-contents-put-json
  - id: github-c2-state-files
  - id: github-encrypted-command-result
  any:
  - id: github-contents-get-json
  - id: micro-behaviors/process/create/shell/bridge::child-process-exec
  - id: micro-behaviors/os/module/require::child-process-require
- id: npm-postinstall-github-contents-c2
  desc: npm postinstall launches GitHub contents C2 client
  crit: hostile
  conf: 0.98
  attack: T1195.002,T1102.002,T1059
  mbc: C0002,B0024
  for:
  - npm
  - tar
  - javascript
  scope: archive
  all:
  - id: github-contents-command-channel-package
  - id: objectives/supply-chain/install-hook/scripts/hook-file::install-hook-detached-child-launch
- id: github-signed-payload-verify
  desc: Base64 payload verified with RSA SHA256
  crit: component
  conf: 0.92
  for:
  - python
  all:
  - id: micro-behaviors/data/decode/base64::b64decode-call
  any:
  - id: python-rsa-sha256-verify-helper-symbol
  - id: micro-behaviors/crypto/asymmetric/rsa::rsa-sha256-public-verify
- id: github-signed-commit-deaddrop
  desc: GitHub commit search deaddrop with signed payload verification
  crit: hostile
  conf: 0.97
  for:
  - python
  near_lines: 90
  all:
  - id: github-commit-search-api
  - id: github-signed-payload-verify
  any:
  - id: github-commit-search-preview
  - id: micro-behaviors/communications/http/lib/urllib::urllib-request-object
  - id: micro-behaviors/communications/http/lib/requests::requests-get
- id: github-signed-commit-exec-deaddrop
  desc: GitHub signed commit deaddrop executes payload
  crit: hostile
  conf: 0.98
  for:
  - python
  near_lines: 140
  all:
  - id: github-commit-search-api
  - id: github-signed-payload-verify
  - id: objectives/command-and-control/dropper/delivery/http::download-and-execute-func-1
  any:
  - id: micro-behaviors/process/create/subprocess::run-content
  - id: micro-behaviors/process/create/subprocess::popen-content
- id: github-token-backed-exfil-fallback
  desc: Harvested GitHub token used for repository contents exfiltration
  crit: hostile
  conf: 0.98
  for:
  - python
  - whl
  - python-sdist
  - zip
  scope: archive
  all:
  - id: micro-behaviors/communications/http/services/github::github-contents-api-endpoint
  - id: github-pat-pattern-literal
  - id: objectives/exfiltration/stealer/cloud::python-hybrid-encrypted-secret-exfil
- id: github-pat-pattern-literal
  desc: GitHub personal access token pattern literal
  crit: component
  conf: 0.9
  any:
  - id: objectives/credential-access/cloud/token/files::github-classic-pat
  - id: micro-behaviors/os/security/auth/secret::github-fine-grained-pat
- id: github-deaddrop-detached-shell-loader
  desc: GitHub dead-drop resolves C2 for hidden shell
  crit: hostile
  conf: 0.95
  attack: T1102, T1059.004
  for:
  - scripts
  - source
  unless:
  - id: raw-github-doc-url
  all:
  - id: micro-behaviors/communications/http/url/github::raw-githubusercontent-web-file
  - id: "micro-behaviors/process/create"
  any:
  - id: micro-behaviors/process/daemonize/detach::background-ampersand-hidden
  - id: micro-behaviors/process/create/shell/command-flag::go-starts-variable-shell
- id: github-deaddrop-reverse-shell
  desc: GitHub dead-drop resolves C2 for reverse shell
  crit: hostile
  conf: 0.98
  attack: T1102.001,T1059.006
  mbc: B0030.002,C0002
  unless:
  - id: raw-github-doc-url
  - id: metadata/package/testing/corpus::ran-bundled-adversary-templates
  - id: well-known/tool/offensive/
  all:
  - id: micro-behaviors/communications/http/url/github::raw-githubusercontent-any
  any:
  - id: objectives/command-and-control/reverse-shell/fd-redirect::inline-python-reverse-shell
  - id: objectives/command-and-control/reverse-shell/stream-bridge::python-popen-socket-stream-relay
  - id: objectives/command-and-control/reverse-shell/stream-bridge::js-reverse-shell-spawn
  - id: objectives/command-and-control/reverse-shell/stream-bridge::go-revshell


