defaults:
  platforms:
    - unix
    - windows
  crit: suspicious
  attack: T1102.001
  for: [binaries]
traits:
  - id: steam-profile-url
    desc: steamcommunity.com profile URL
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: steamcommunity\.com/(profiles|id)/
    unless:
      - id: metadata/package/manifest/ecosystem/
  - id: steam-profile-fetch
    desc: HTTP request to fetch Steam community profile
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: (?i)\b(get|fetch|request)\b.{0,60}steamcommunity\.com
    unless:
      - id: metadata/package/manifest/ecosystem/
composite_rules:
  - id: steam-deaddrop
    desc: Steam community profile used as C2 dead drop
    crit: hostile
    conf: 0.9
    mbc: C0002
    any:
      - id: steam-profile-url
      - id: steam-profile-fetch
    unless:
      - id: well-known/game/steamtools::member
    downgrade:
      any:
        - id: metadata/package/manifest/ecosystem/
        - id: well-known/game/steamtools::gameaccount-plugin
        - id: well-known/lib/network/steamkit2::library
