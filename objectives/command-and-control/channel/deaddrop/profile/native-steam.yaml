defaults:
  platforms: [windows]
  for: [pe]
composite_rules:
  # RE: 0x140013770 fetches steamcommunity.com using WinHTTP, extracts
  # og:title into the caller's destination buffer, and keeps a fallback.
  # Credential theft supplies hostile context; a Steam client alone does not.
  - id: browser-stealer-steam-title-resolver
    desc: Browser stealer parses Steam profile titles
    crit: hostile
    conf: 0.98
    attack: T1102.001
    all:
      - id: micro-behaviors/communications/http/services/steam::steam-profile-title-extraction-pattern
      - id: micro-behaviors/communications/http/client/winhttp::winhttp-request-flow
      - id: objectives/credential-access/browser/recovery::multi-browser-store-decryption
