# Public profile pages used as dead-drop resolver candidates. The pair is
# intentionally provider-specific because the article describes Telegram and
# Steam profiles, while handles and profile IDs rotate between campaigns.
defaults:
  platforms: [windows, unix]
  for: [pe, dll, c, cpp, csharp, rust, go, python]
  attack: T1102.001
  mbc: C0002

traits:
  - id: telegram-me-profile-url
    desc: Telegram profile URL embedded in code
    crit: notable
    conf: 0.92
    if:
      type: text
      regex: '(?i)https?://(telegram\.me|t\.me)/[A-Za-z0-9_-]{3,80}'

  - id: steam-community-profile-url
    desc: Steam community profile URL in code
    crit: notable
    conf: 0.92
    if:
      type: text
      regex: '(?i)https?://steamcommunity\.com/(profiles|id)/[A-Za-z0-9_-]{3,80}'

composite_rules:
  - id: telegram-steam-profile-url-pair
    desc: Telegram and Steam profile URL pair
    crit: notable
    conf: 0.95
    needs: 2
    any:
      - id: telegram-me-profile-url
      - id: steam-community-profile-url

  - id: browser-stealer-profile-dead-drop
    desc: Browser ABE stealer paired with Telegram and Steam profile dead drops
    crit: hostile
    conf: 0.99
    attack: T1102.001,T1555.003
    all:
      - id: objectives/credential-access/browser/chromium::chromium-abe-memory-apc-bypass
      - id: telegram-steam-profile-url-pair
    near_lines: 220
