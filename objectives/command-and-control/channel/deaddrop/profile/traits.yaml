# Public profile pages used as dead-drop resolver candidates. The pair is
# intentionally provider-specific because the article describes Telegram and
# Steam profiles, while handles and profile IDs rotate between campaigns.
defaults:
  platforms: [windows, unix]
  for: [pe, dll, c, cpp, csharp, rust, go, python]
  attack: T1102.001
  mbc: C0002

traits:
  - id: telegram-me-profile-url
    desc: Telegram profile URL embedded in code
    crit: notable
    conf: 0.92
    unless:
      - id: well-known/lib/network/go-telegram-bot-api::library-source-context
    if:
      type: text
      regex: '(?i)https?://(telegram\.me|t\.me)/[A-Za-z0-9_-]{3,80}'

  - id: steam-community-profile-url
    desc: Steam community profile URL in code
    crit: notable
    conf: 0.92
    if:
      type: text
      regex: '(?i)https?://steamcommunity\.com/(profiles|id)/[A-Za-z0-9_-]{3,80}'

composite_rules:
  - id: telegram-steam-profile-url-pair
    desc: Telegram and Steam profile URL pair
    crit: notable
    conf: 0.95
    needs: 2
    any:
      - id: telegram-me-profile-url
      - id: steam-community-profile-url

  - id: browser-stealer-profile-dead-drop
    desc: Browser ABE stealer paired with Telegram and Steam profile dead drops
    crit: hostile
    conf: 0.99
    attack: T1102.001,T1555.003
    all:
      - id: objectives/credential-access/browser/chromium::chromium-abe-memory-apc-bypass
      - id: telegram-steam-profile-url-pair
    near_lines: 220

  - id: telegram-profile-elevated-remote-loader
    desc: Telegram profile paired with an elevated temporary remote loader
    crit: hostile
    conf: 0.98
    attack: T1102.001,T1105,T1129
    all:
      - id: telegram-me-profile-url
      - id: micro-behaviors/communications/http/client/winhttp::winhttp-downloader-flow
      - id: micro-behaviors/fs/path/temp::windows-temp-executable-path
      - id: metadata/build/manifest::pe-requires-admin
    any:
      - id: micro-behaviors/process/create/shell/spawn::win-shellexecute
      - id: micro-behaviors/os/module/load::get-proc-address-import
    needs: 1
    unless:
      - id: metadata/signed/platform/
      - id: well-known/app/
