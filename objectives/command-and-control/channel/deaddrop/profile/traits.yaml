# Public profile pages used as dead-drop resolver candidates. Providers are
# explicit, while handles and profile IDs remain unconstrained so campaigns
# can rotate accounts without losing the technique signal.
defaults:
  platforms: [windows, unix]
  for: [binaries, scripts, source, -class, -pyc, -beam, -wasm, -staticlib]
  attack: T1102.001
  mbc: C0002

traits:
  # `telegram-me-profile-url` moved to
  # micro-behaviors/communications/http/services/telegram/: the matcher finds a
  # t.me handle URL, which is what every project that documents its bot or
  # support channel contains ("message @BotFather at https://t.me/BotFather").
  # The dead-drop reading comes from pairing it with the other profile hosts and
  # the stealer legs below, so those reference it cross-directory.
  # Pinterest profile URLs are likewise defined under the neutral Pinterest
  # service capability; ordinary Pin-sharing endpoints are a separate trait.

  - id: steam-community-profile-url
    desc: Steam community profile URL in code
    crit: notable
    conf: 0.92
    if:
      type: text
      regex: '(?i)https?://steamcommunity\.com/(profiles|id)/[A-Za-z0-9_-]{3,80}'

composite_rules:
  - id: multi-service-profile-url-set
    desc: Multiple public-service profile URLs
    crit: notable
    conf: 0.95
    needs: 2
    any:
      - id: micro-behaviors/communications/http/services/telegram::telegram-profile-url
      - id: micro-behaviors/communications/http/services/pinterest::pinterest-profile-url
      - id: steam-community-profile-url

  - id: browser-stealer-profile-dead-drop
    desc: Multi-store credential stealer resolves C2 through public profiles
    crit: hostile
    conf: 0.99
    attack: T1102.001,T1555.003,T1552.001,T1041
    all:
      - id: multi-service-profile-url-set
      - id: objectives/credential-access/theft/multi-store::browser-ftp-credential-targeting
      - id: micro-behaviors/communications/http/upload::multipart-http-upload
    any:
      - id: micro-behaviors/communications/http/url/build::python-urllib-response-url-extraction
      - id: objectives/command-and-control/channel/deaddrop/url::url-deaddrop
      - id: objectives/command-and-control/channel/deaddrop/url::wsh-response-text-followup-get

  - id: telegram-profile-elevated-remote-loader
    desc: Telegram profile paired with an elevated temporary remote loader
    crit: hostile
    conf: 0.98
    attack: T1102.001,T1105,T1129
    all:
      - id: micro-behaviors/communications/http/services/telegram::telegram-profile-url
      - id: micro-behaviors/communications/http/client/winhttp::winhttp-downloader-flow
      - id: micro-behaviors/fs/path/temp::windows-temp-executable-path
      - id: metadata/build/manifest::pe-requires-admin
    any:
      - id: micro-behaviors/process/create/shell/spawn::win-shellexecute
      - id: micro-behaviors/os/module/load::get-proc-address-import
    needs: 1
    unless:
      - id: metadata/signed/platform/
      - id: well-known/app/
