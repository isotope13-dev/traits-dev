defaults:
  platforms:
    - windows
    - unix
  for:
    - binaries
    - scripts
    - source
    - -class
    - -pyc
    - -beam
    - -wasm
    - -staticlib
  attack: T1102.001
  mbc: C0002
traits:
  - id: steam-community-profile-url
    desc: Steam community profile URL in code
    crit: notable
    conf: 0.92
    if:
      type: text
      regex: (?i)https?://steamcommunity\.com/(profiles|id)/[A-Za-z0-9_-]{3,80}
composite_rules:
  - id: multi-service-profile-url-set
    desc: Multiple public-service profile URLs
    crit: notable
    conf: 0.95
    needs: 2
    any:
      - id: micro-behaviors/communications/http/services/telegram::telegram-profile-url
      - id: micro-behaviors/communications/http/services/pinterest::pinterest-profile-url
      - id: steam-community-profile-url
  - id: browser-stealer-profile-dead-drop
    for:
      - scripts
      - '!jcl'
      - elf
      - macho
      - pe
    desc: Multi-store credential stealer resolves C2 through public profiles
    crit: hostile
    conf: 0.99
    attack: T1102.001,T1555.003,T1552.001,T1041
    all:
      - id: multi-service-profile-url-set
      - id: micro-behaviors/fs/path/credential::browser-ftp-credential-paths
      - id: micro-behaviors/communications/http/upload/multipart::multipart-http-upload
    any:
      - id: micro-behaviors/communications/url/construction/build-http::python-urllib-response-url-extraction
      - id: objectives/command-and-control/channel/deaddrop/url::url-deaddrop
      - id: objectives/command-and-control/channel/deaddrop/url::wsh-response-text-followup-get
  - id: telegram-profile-elevated-remote-loader
    for:
      - pe
    desc: Telegram profile paired with an elevated temporary remote loader
    crit: hostile
    conf: 0.98
    attack: T1102.001,T1105,T1129
    all:
      - id: micro-behaviors/communications/http/services/telegram::telegram-profile-url
      - id: micro-behaviors/communications/http/client/winhttp::winhttp-request-response-flow
      - id: micro-behaviors/fs/path/temporary-artifact::windows-temp-executable-path
      - id: metadata/build/manifest::pe-requires-admin
    any:
      - id: micro-behaviors/os/handler/open::win-shellexecute
      - id: micro-behaviors/dylib/lookup::get-proc-address-import
    needs: 1
  - id: telegram-profile-dead-drop-dropper
    desc: Telegram profile dead drop runs payload
    crit: hostile
    conf: 0.98
    attack: T1102.001,T1105
    for: [javascript, typescript]
    all:
      - id: micro-behaviors/communications/http/services/telegram::telegram-profile-url
      - id: micro-behaviors/fs/write/file/content::js-file-write
      - id: objectives/command-and-control/channel/dns::node-dga-doh-tasking-channel
    any:
      - id: objectives/execution/staging/transfer::fetch-write-exec
      - id: micro-behaviors/process/create/shell/interpreter::node-powershell-launch
      - id: micro-behaviors/process/create/variable::spawn-variable-program
