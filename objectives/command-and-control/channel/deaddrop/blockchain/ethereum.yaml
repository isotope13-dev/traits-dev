# Ethereum recipient-address dead-drop C2.
# The resolver queries recent chain activity, reads an otherwise meaningless
# recipient address, converts its first four bytes to an IPv4 string, and then
# uses that result as a network endpoint. This detects the technique rather
# than any wallet, package name, RPC provider, or decoded address.
defaults:
  attack: T1102,T1071.001
  platforms: [windows, unix]
  for: [javascript, typescript, python, go]

traits:
  - id: decoded-result-endpoint-assignment
    desc: Assigns an endpoint from a decoded result
    crit: component
    conf: 0.94
    for: [javascript, typescript]
    if:
      type: text
      regex: '(const|let|var)\s+endpoint\s*=\s*[A-Za-z_$][A-Za-z0-9_$]*\([^)]{0,80}\bresult\b'
    unless:
      - type: text
        regex: '(const|let|var)\s+endpoint\s*=\s*[^(]+\([^)]*\.\s*result'
  - id: decoded-output-url-assignment
    desc: Assigns a URL from decoded output
    crit: component
    conf: 0.9
    for: [javascript, typescript]
    if:
      type: text
      regex: '(const|let|var)\s+url\s*=\s*[A-Za-z_$][A-Za-z0-9_$]*\([^)]{0,80}\boutput\b'
    unless:
      - type: text
        regex: '(const|let|var)\s+url\s*=\s*[^(]+\([^)]*\.\s*output'

composite_rules:
  - id: ethereum-recipient-http-client
    desc: Uses an HTTP client in an Ethereum recipient resolver
    crit: notable
    conf: 0.9
    for: [javascript, typescript]
    near_bytes: 600
    all:
      - id: micro-behaviors/crypto/library/blockchain/client::ethereum-transaction-recipient-field
    any:
      - id: micro-behaviors/communications/http/request/client::https-request
      - id: micro-behaviors/communications/http/request/client::js-fetch-call

  - id: ethereum-eth-call-c2-routing
    desc: Resolves an HTTP C2 endpoint through Ethereum eth_call
    crit: hostile
    conf: 0.99
    for: [javascript, typescript]
    # Keep the contract request, result-to-endpoint assignment, and HTTP client
    # in one compact routine. Bundled loaders often initialize another client
    # earlier in the same function, so 1200 bytes incorrectly anchored the
    # shared client finding outside otherwise adjacent resolver code.
    near_bytes: 2400
    all:
      - id: micro-behaviors/communications/http/url/rpc::eth-call-method-field
      - id: micro-behaviors/communications/http/url/rpc::eth-call-contract-address
      - id: micro-behaviors/communications/http/request/client::http-client-usage
    any:
      - id: decoded-result-endpoint-assignment
      - id: decoded-output-url-assignment
  - id: ethereum-recipient-address-c2-resolution-javascript
    desc: JavaScript Ethereum recipient resolves C2
    crit: hostile
    conf: 0.99
    for: [javascript, typescript]
    all:
      - id: micro-behaviors/communications/ipc/rpc::jsonrpc-2-protocol-object
      - id: micro-behaviors/crypto/library/blockchain/client::ethereum-jsonrpc-method
      - id: micro-behaviors/crypto/library/blockchain/client::ethereum-transaction-recipient-field
      - id: micro-behaviors/crypto/library/blockchain/client::ethereum-recipient-ipv4-byte-slice
      - id: micro-behaviors/crypto/library/blockchain/client::ethereum-hex-octets-dot-join-javascript
    any:
      - id: micro-behaviors/communications/http/request/client::https-request
      - id: micro-behaviors/communications/http/request/client::js-fetch-call

  - id: ethereum-recipient-byte-c2-resolution-javascript
    desc: JavaScript recipient bytes resolve C2
    crit: hostile
    conf: 0.99
    for: [javascript, typescript]
    near_bytes: 12000
    all:
      - id: micro-behaviors/crypto/library/blockchain/client::ethereum-transaction-recipient-field
      - id: micro-behaviors/crypto/library/blockchain/client::ethereum-recipient-byte-ip-assembly
      - id: micro-behaviors/communications/http/request/configuration::node-http-request-configured
    any:
      - id: micro-behaviors/communications/ipc/rpc::jsonrpc-2-protocol-object
      - id: micro-behaviors/crypto/library/blockchain/client::blockscout-account-transaction-list

  - id: ethereum-recipient-blockscout-c2-resolution-javascript
    desc: JavaScript resolves recipient-derived C2 through Blockscout
    crit: hostile
    conf: 0.99
    for: [javascript, typescript]
    near_bytes: 12000
    all:
      - id: micro-behaviors/crypto/library/blockchain/query::blockscout-ethereum-api-endpoint
      - id: micro-behaviors/crypto/library/blockchain/query::ethereum-transaction-recipient-reference
      - id: ethereum-recipient-http-client
    any:
      - id: micro-behaviors/crypto/library/blockchain/client::ethereum-recipient-byte-ip-assembly
      - id: micro-behaviors/crypto/library/blockchain/client::ethereum-recipient-hex-ip-assembly

  - id: ethereum-recipient-rpc-fanout-c2-resolution-javascript
    desc: JavaScript fans out Ethereum RPC lookups before resolving recipient C2
    crit: hostile
    conf: 0.99
    for: [javascript, typescript]
    near_bytes: 12000
    all:
      - id: micro-behaviors/crypto/library/blockchain/query::ethereum-rpc-provider-list
      - id: micro-behaviors/crypto/library/blockchain/query::ethereum-rpc-provider-fanout
      - id: micro-behaviors/crypto/library/blockchain/query::ethereum-transaction-recipient-reference
      - id: ethereum-recipient-http-client
    any:
      - id: micro-behaviors/crypto/library/blockchain/client::ethereum-recipient-byte-ip-assembly
      - id: micro-behaviors/crypto/library/blockchain/client::ethereum-recipient-hex-ip-assembly

  - id: ethereum-blank-transfer-c2-resolution-javascript
    desc: JavaScript blank Ethereum transfer C2
    crit: hostile
    conf: 0.99
    for: [javascript, typescript]
    all:
      - id: micro-behaviors/communications/ipc/rpc::jsonrpc-2-protocol-object
      - id: micro-behaviors/crypto/library/blockchain/client::ethereum-jsonrpc-method
      - id: micro-behaviors/crypto/library/blockchain/client::ethereum-transaction-recipient-field
      - id: micro-behaviors/crypto/library/blockchain/client::ethereum-recipient-ipv4-byte-slice
      - id: micro-behaviors/crypto/library/blockchain/client::ethereum-hex-octets-dot-join-javascript
      - id: micro-behaviors/crypto/library/blockchain/client::ethereum-zero-value-field
      - id: micro-behaviors/crypto/library/blockchain/client::ethereum-empty-input-field
    any:
      - id: micro-behaviors/communications/http/request/client::https-request
      - id: micro-behaviors/communications/http/request/client::js-fetch-call

  - id: ethereum-recipient-address-c2-resolution-python
    desc: Python Ethereum recipient resolves C2
    crit: hostile
    conf: 0.99
    for: [python]
    all:
      - id: micro-behaviors/communications/ipc/rpc::jsonrpc-2-protocol-object
      - id: micro-behaviors/crypto/library/blockchain/client::ethereum-jsonrpc-method
      - id: micro-behaviors/crypto/library/blockchain/client::ethereum-transaction-recipient-field
      - id: micro-behaviors/crypto/library/blockchain/client::ethereum-recipient-ipv4-slice-python
      - id: micro-behaviors/crypto/library/blockchain/client::ethereum-recipient-ipv4-range-python
      - id: micro-behaviors/crypto/library/blockchain/client::ethereum-hex-octets-dot-join-python
      - id: micro-behaviors/communications/http/lib/urllib::urlopen-variable-argument

  - id: ethereum-blank-transfer-c2-resolution-python
    desc: Python blank Ethereum transfer C2
    crit: hostile
    conf: 0.99
    for: [python]
    all:
      - id: micro-behaviors/communications/ipc/rpc::jsonrpc-2-protocol-object
      - id: micro-behaviors/crypto/library/blockchain/client::ethereum-jsonrpc-method
      - id: micro-behaviors/crypto/library/blockchain/client::ethereum-transaction-recipient-field
      - id: micro-behaviors/crypto/library/blockchain/client::ethereum-recipient-ipv4-slice-python
      - id: micro-behaviors/crypto/library/blockchain/client::ethereum-recipient-ipv4-range-python
      - id: micro-behaviors/crypto/library/blockchain/client::ethereum-hex-octets-dot-join-python
      - id: micro-behaviors/crypto/library/blockchain/client::ethereum-zero-value-field
      - id: micro-behaviors/crypto/library/blockchain/client::ethereum-empty-input-field
      - id: micro-behaviors/communications/http/lib/urllib::urlopen-variable-argument

  - id: ethereum-recipient-address-c2-resolution-go
    desc: Go resolves C2 from Ethereum recipient bytes
    crit: hostile
    conf: 0.99
    for: [go]
    near_bytes: 8192
    all:
      - id: micro-behaviors/communications/ipc/rpc::jsonrpc-2-protocol-object
      - id: micro-behaviors/crypto/library/blockchain/client::ethereum-jsonrpc-block-number-method
      - id: micro-behaviors/crypto/library/blockchain/client::ethereum-jsonrpc-block-by-number-method
      - id: micro-behaviors/crypto/library/blockchain/query::go-ethereum-recipient-ipv4-reconstruction
      - id: micro-behaviors/communications/socket/connect::go-dial-methods

  - id: ethereum-blank-transfer-c2-resolution-go
    desc: Go resolves C2 from a blank Ethereum transfer recipient
    crit: hostile
    conf: 0.99
    for: [go]
    near_bytes: 8192
    all:
      - id: ethereum-recipient-address-c2-resolution-go
      - id: micro-behaviors/crypto/library/blockchain/query::go-ethereum-zero-value-test
      - id: micro-behaviors/crypto/library/blockchain/query::go-ethereum-empty-input-test
