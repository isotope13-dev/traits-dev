# Ethereum recipient-address dead-drop C2.
# The resolver queries recent chain activity, reads an otherwise meaningless
# recipient address, converts its first four bytes to an IPv4 string, and then
# uses that result as a network endpoint. This detects the technique rather
# than any wallet, package name, RPC provider, or decoded address.
defaults:
  attack: T1102,T1071.001
  platforms: [windows, unix]
  for: [javascript, typescript, python, go]

traits:
  # Obfuscated npm stagers often split JSON-RPC method names across base64
  # string-array chunks; the joined fragment still decodes to eth_getBlock*.
  - id: base64-ethereum-jsonrpc-method-fragment
    desc: Base64 fragment encodes eth_getBlock RPC
    crit: notable
    conf: 0.96
    for: [javascript, typescript]
    if:
      type: text
      substr: ZXRoX2dldEJsb2Nr
  - id: base64-blockscout-ethereum-api-fragment
    desc: Base64 fragment encodes Blockscout API URL
    crit: notable
    conf: 0.96
    for: [javascript, typescript]
    if:
      type: text
      substr: ZXRoLmJsb2Nrc2Nvd
  - id: decoded-result-endpoint-assignment
    desc: Assigns an endpoint from a decoded result
    crit: notable
    conf: 0.94
    for: [javascript, typescript]
    if:
      type: text
      regex: '(const|let|var)\s+endpoint\s*=\s*[A-Za-z_$][A-Za-z0-9_$]*\([^)]{0,80}\bresult\b'
    unless:
      - type: text
        regex: '(const|let|var)\s+endpoint\s*=\s*[^(]+\([^)]*\.\s*result'
  - id: decoded-output-url-assignment
    desc: Assigns a URL from decoded output
    crit: notable
    conf: 0.9
    for: [javascript, typescript]
    if:
      type: text
      regex: '(const|let|var)\s+url\s*=\s*[A-Za-z_$][A-Za-z0-9_$]*\([^)]{0,80}\boutput\b'
    unless:
      - type: text
        regex: '(const|let|var)\s+url\s*=\s*[^(]+\([^)]*\.\s*output'

composite_rules:
  # Obfuscated npm stagers split the dead-drop resolver across base64 chunks
  # (eth_getBlock*, Blockscout indexer URL) and bootstrap with atob+eval before
  # the copied library body. Plain-source ethereum composites never see the RPC
  # calls; the base64 fragments plus eval are the durable signal.
  - id: javascript-obfuscated-blockscout-ethereum-deaddrop-loader
    desc: Obfuscated JavaScript loads Blockscout Ethereum dead-drop stager
    crit: hostile
    conf: 0.98
    attack: T1102,T1059.007,T1195.002
    for: [javascript, typescript]
    scope: file
    all:
      - id: micro-behaviors/data/decode/base64::base64-decode-call-text
      - id: micro-behaviors/process/interpreter/eval/direct::js-eval-raw
      - id: base64-ethereum-jsonrpc-method-fragment
      - id: base64-blockscout-ethereum-api-fragment
    unless:
      - id: well-known/lib/format/pdfjs/
      - id: well-known/tool/offensive/payload-corpus::xss-alert-probe-corpus
      - id: micro-behaviors/process/interpreter/eval/direct::eval-parenthesized-expression

  - id: ethereum-eth-call-c2-routing
    desc: Resolves an HTTP C2 endpoint through Ethereum eth_call
    crit: hostile
    conf: 0.99
    for: [javascript, typescript]
    # Require the decoded endpoint to be used as the target of a JSON POST.
    # A generic HTTP client beside eth_call is normal dApp code and does not
    # establish dead-drop routing.
    near_bytes: 2400
    all:
      - id: micro-behaviors/communications/http/url/rpc::eth-call-method-field
      - id: micro-behaviors/communications/http/url/rpc::eth-call-contract-address
      - id: micro-behaviors/communications/http/request/payload::fetch-endpoint-post-json-body
    any:
      - id: decoded-result-endpoint-assignment
      - id: decoded-output-url-assignment
  - id: ethereum-recipient-address-c2-resolution-javascript
    desc: JavaScript Ethereum recipient resolves C2
    crit: hostile
    conf: 0.99
    for: [javascript, typescript]
    all:
      - id: micro-behaviors/communications/rpc::jsonrpc-2-protocol-object
      - id: micro-behaviors/communications/rpc::ethereum-jsonrpc-method
      - id: micro-behaviors/data/transaction/query::ethereum-transaction-recipient-field
      - id: micro-behaviors/data/transaction/query::ethereum-recipient-ipv4-byte-slice
      - id: micro-behaviors/data/transaction/query::ethereum-hex-octets-dot-join-javascript
      - id: micro-behaviors/communications/http/url/build::js-fetch-derived-url-authority
    unless:
      - id: ethereum-blank-transfer-c2-resolution-javascript

  - id: ethereum-recipient-byte-c2-resolution-javascript
    desc: JavaScript recipient bytes resolve C2
    crit: hostile
    conf: 0.99
    for: [javascript, typescript]
    near_bytes: 12000
    all:
      - id: micro-behaviors/data/transaction/query::ethereum-transaction-recipient-field
      - id: micro-behaviors/data/transaction/query::ethereum-recipient-byte-ip-assembly
      - id: micro-behaviors/communications/http/request/configuration::node-http-request-configured
    any:
      - id: micro-behaviors/communications/rpc::jsonrpc-2-protocol-object
      - id: micro-behaviors/communications/http/url/rpc::blockscout-account-transaction-list

  # Every sibling composite above assumes the resolved recipient bytes feed an
  # outbound HTTP(S) request (node-http-request-configured or a fetch-derived
  # URL authority). ghappier's second payload -- the one that ties this repo's
  # sample to the published NullReceiver/PolinRider indicator set -- decodes
  # the recipient into a raw IP:port pair and hands it straight to a socket
  # dialer instead of building a URL from it: there is no HTTP leg to match.
  # Same decode, different transport; the hostile reading needs its own leg.
  - id: ethereum-recipient-socket-c2-resolution-javascript
    desc: JavaScript recipient bytes resolve a raw socket C2
    crit: hostile
    conf: 0.98
    for: [javascript, typescript]
    near_bytes: 12000
    all:
      - id: micro-behaviors/data/transaction/query::ethereum-transaction-recipient-field
      - id: micro-behaviors/data/transaction/query::ethereum-recipient-hex-buffer
      - id: micro-behaviors/data/transaction/query::ethereum-recipient-four-byte-slices
      - id: micro-behaviors/data/collection/array::js-mapped-values-dot-join
      - id: micro-behaviors/communications/socket/connect::socket-connect-port-host
    any:
      - id: micro-behaviors/communications/rpc::jsonrpc-2-protocol-object
      - id: micro-behaviors/communications/http/url/rpc::blockscout-account-transaction-list
    unless:
      # Chain queries against RFC 2606 reserved endpoints cannot resolve, so
      # no recipient bytes ever arrive to feed the dialer.
      - id: micro-behaviors/communications/http/url/tld::reserved-documentation-tld-url

  # Dead-drop txs are blank transfers: zero value and empty calldata, with the
  # C2 bytes in the recipient. Same filter as the HTTP blank-transfer family,
  # but the sink is a raw socket dial rather than a fetch URL.
  - id: ethereum-blank-transfer-socket-c2-javascript
    desc: Blank transfer recipient feeds socket C2
    crit: hostile
    conf: 0.98
    for: [javascript, typescript]
    near_bytes: 12000
    all:
      - id: micro-behaviors/data/transaction/query::ethereum-zero-value-field
      - id: micro-behaviors/data/transaction/query::ethereum-empty-input-field
      - id: micro-behaviors/data/transaction/query::ethereum-transaction-recipient-field
      - id: micro-behaviors/communications/socket/connect::socket-connect-port-host
    unless:
      # Chain queries against RFC 2606 reserved endpoints cannot resolve, so
      # no recipient bytes ever arrive to feed the dialer.
      - id: micro-behaviors/communications/http/url/tld::reserved-documentation-tld-url

  - id: ethereum-recipient-blockscout-c2-resolution-javascript
    desc: JavaScript resolves recipient-derived C2 through Blockscout
    crit: hostile
    conf: 0.99
    for: [javascript, typescript]
    near_bytes: 12000
    all:
      - id: micro-behaviors/communications/http/url/rpc::blockscout-ethereum-api-endpoint
      - id: micro-behaviors/data/transaction/query::ethereum-transaction-recipient-reference
      - id: micro-behaviors/communications/http/url/build::js-fetch-derived-url-authority
    any:
      - id: micro-behaviors/data/transaction/query::ethereum-recipient-byte-ip-assembly
      - id: micro-behaviors/data/transaction/query::ethereum-recipient-hex-ip-assembly

  - id: ethereum-recipient-rpc-fanout-c2-resolution-javascript
    desc: JavaScript fans out Ethereum RPC lookups before resolving recipient C2
    crit: hostile
    conf: 0.99
    for: [javascript, typescript]
    near_bytes: 12000
    all:
      - id: micro-behaviors/communications/rpc::ethereum-rpc-provider-list
      - id: micro-behaviors/communications/http/request/failover::promise-any-fetch-race
      - id: micro-behaviors/data/transaction/query::ethereum-transaction-recipient-reference
      - id: micro-behaviors/communications/http/url/build::js-fetch-derived-url-authority
    any:
      - id: micro-behaviors/data/transaction/query::ethereum-recipient-byte-ip-assembly
      - id: micro-behaviors/data/transaction/query::ethereum-recipient-hex-ip-assembly

  - id: ethereum-blank-transfer-c2-resolution-javascript
    desc: JavaScript blank Ethereum transfer C2
    crit: hostile
    conf: 0.99
    for: [javascript, typescript]
    all:
      - id: micro-behaviors/communications/rpc::jsonrpc-2-protocol-object
      - id: micro-behaviors/communications/rpc::ethereum-jsonrpc-method
      - id: micro-behaviors/data/transaction/query::ethereum-transaction-recipient-field
      - id: micro-behaviors/data/transaction/query::ethereum-recipient-ipv4-byte-slice
      - id: micro-behaviors/data/transaction/query::ethereum-hex-octets-dot-join-javascript
      - id: micro-behaviors/data/transaction/query::ethereum-zero-value-field
      - id: micro-behaviors/data/transaction/query::ethereum-empty-input-field
      - id: micro-behaviors/communications/http/url/build::js-fetch-derived-url-authority

  - id: ethereum-recipient-address-c2-resolution-python
    desc: Python Ethereum recipient resolves C2
    crit: hostile
    conf: 0.99
    for: [python]
    all:
      - id: micro-behaviors/communications/rpc::jsonrpc-2-protocol-object
      - id: micro-behaviors/communications/rpc::ethereum-jsonrpc-method
      - id: micro-behaviors/data/transaction/query::ethereum-transaction-recipient-field
      - id: micro-behaviors/data/transaction/query::ethereum-recipient-ipv4-slice-python
      - id: micro-behaviors/data/transaction/query::ethereum-recipient-ipv4-range-python
      - id: micro-behaviors/data/transaction/query::ethereum-hex-octets-dot-join-python
      - id: micro-behaviors/communications/http/lib/urllib::urlopen-variable-argument

  - id: ethereum-blank-transfer-c2-resolution-python
    desc: Python blank Ethereum transfer C2
    crit: hostile
    conf: 0.99
    for: [python]
    all:
      - id: micro-behaviors/communications/rpc::jsonrpc-2-protocol-object
      - id: micro-behaviors/communications/rpc::ethereum-jsonrpc-method
      - id: micro-behaviors/data/transaction/query::ethereum-transaction-recipient-field
      - id: micro-behaviors/data/transaction/query::ethereum-recipient-ipv4-slice-python
      - id: micro-behaviors/data/transaction/query::ethereum-recipient-ipv4-range-python
      - id: micro-behaviors/data/transaction/query::ethereum-hex-octets-dot-join-python
      - id: micro-behaviors/data/transaction/query::ethereum-zero-value-field
      - id: micro-behaviors/data/transaction/query::ethereum-empty-input-field
      - id: micro-behaviors/communications/http/lib/urllib::urlopen-variable-argument

  - id: ethereum-recipient-address-c2-resolution-go
    desc: Go resolves C2 from Ethereum recipient bytes
    crit: hostile
    conf: 0.99
    for: [go]
    near_bytes: 8192
    all:
      - id: micro-behaviors/communications/rpc::jsonrpc-2-protocol-object
      - id: micro-behaviors/communications/rpc::ethereum-jsonrpc-block-number-method
      - id: micro-behaviors/communications/rpc::ethereum-jsonrpc-block-by-number-method
      - id: micro-behaviors/data/transaction/query::go-ethereum-recipient-ipv4-reconstruction
      - id: micro-behaviors/communications/socket/connect::go-dial-methods

  - id: ethereum-blank-transfer-c2-resolution-go
    desc: Go resolves C2 from a blank Ethereum transfer recipient
    crit: hostile
    conf: 0.99
    for: [go]
    near_bytes: 8192
    all:
      - id: ethereum-recipient-address-c2-resolution-go
      - id: micro-behaviors/data/transaction/query::go-ethereum-zero-value-test
      - id: micro-behaviors/data/transaction/query::go-ethereum-empty-input-test
