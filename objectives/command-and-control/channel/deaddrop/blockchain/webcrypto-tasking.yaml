defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  attack: T1102,T1059.007

composite_rules:
  - id: webcrypto-contract-code-tasking
    desc: Ethereum RPC with decrypted HTTP code evaluation
    crit: hostile
    conf: 0.97
    all:
      - id: micro-behaviors/communications/http/url/rpc::eth-call-method-field
      - id: objectives/execution/payload/script-eval::webcrypto-http-plaintext-eval
      - id: micro-behaviors/data/control-flow/loop::infinite-loop-header
