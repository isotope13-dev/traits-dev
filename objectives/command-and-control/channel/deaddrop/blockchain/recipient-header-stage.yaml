defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
composite_rules:
  - id: ethereum-recipient-payload-header-rendezvous
    desc: Ethereum recipient splitting accompanies XOR-decoded HTTP header staging
    crit: hostile
    conf: 0.98
    attack: T1102,T1105,T1027
    # Replace the wallet/path-gated delivery rule with the rendezvous behavior:
    # chain history, IPv4-sized recipient slices, configured HTTP requests and
    # an encoded payload response. No chosen wallet or URL path is required.
    near_bytes: 12000
    all:
      - id: micro-behaviors/communications/blockchain/client::ethereum-blockchain-history-query
      - id: micro-behaviors/data/transaction/query::ethereum-transaction-recipient-ip-split
      - id: micro-behaviors/communications/http/request/configuration::node-http-request-configured
      - id: micro-behaviors/communications/http/response::response-payload-base64-header
      - id: micro-behaviors/data/decode/base64/unspecified::buffer-from-base64
      - id: micro-behaviors/data/decode/xor/repeating-key::js-repeating-key-buffer-xor-loop

  # The same rendezvous without the header fallback: the stage arrives in the
  # response body. Chain history narrows to one sender's transaction, the
  # recipient is cut into IPv4-sized halves, and the configured HTTP response
  # is unmasked with a repeating key. Wallet, ports and paths are not required.
  - id: ethereum-recipient-ip-split-xor-http-stage
    desc: Ethereum recipient resolves XOR-masked HTTP stage
    crit: hostile
    conf: 0.97
    attack: T1102.001,T1105,T1027
    near_bytes: 12000
    all:
      - id: micro-behaviors/communications/blockchain/client::ethereum-blockchain-history-query
      - id: micro-behaviors/data/transaction/query::ethereum-transaction-recipient-ip-split
      - id: micro-behaviors/communications/http/request/configuration::node-http-request-configured
      - id: micro-behaviors/data/decode/xor/repeating-key::js-repeating-key-buffer-xor-loop
    unless:
      - id: ethereum-recipient-payload-header-rendezvous
