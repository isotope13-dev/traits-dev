defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
composite_rules:
  # Execution can be removed from a research copy while the dead-drop and
  # payload retrieval remain. Obfuscated indices also hide the four-byte
  # slice bounds, so use the recipient read and dotted-byte construction
  # beside chain history and encoded HTTP staging. This is file-level
  # corroboration, not proof of a value-flow edge or stage execution.
  - id: obfuscated-recipient-encoded-http-rendezvous
    desc: Ethereum recipient and dotted bytes accompany XOR HTTP staging
    crit: hostile
    conf: 0.96
    attack: T1102,T1105,T1140
    all:
      - id: micro-behaviors/communications/blockchain/client::ethereum-blockchain-history-query
      - id: micro-behaviors/data/transaction/query::nested-transaction-recipient-field
      - id: micro-behaviors/data/string/concat/join::indexed-values-period-separators
      - id: micro-behaviors/communications/http/request/computed::js-computed-http-object-call
      - id: micro-behaviors/communications/http/header/custom::x-payload-header-prefix
      - id: micro-behaviors/data/bitwise/xor-forms/indexed::js-bytewise-xor-loop
    unless:
      - id: ethereum-recipient-payload-header-rendezvous

  - id: ethereum-recipient-payload-header-rendezvous
    desc: Recipient-derived C2 with XOR header staging
    crit: hostile
    conf: 0.98
    attack: T1102,T1105,T1027
    # Replace the wallet/path-gated delivery rule with the rendezvous behavior:
    # chain history, IPv4-sized recipient slices, configured HTTP requests and
    # an encoded payload response. No chosen wallet or URL path is required.
    near_bytes: 12000
    all:
      - id: micro-behaviors/communications/blockchain/client::ethereum-blockchain-history-query
      - id: micro-behaviors/data/transaction/query::ethereum-transaction-recipient-ip-split
      - id: micro-behaviors/communications/http/request/configuration::node-http-request-configured
      - id: micro-behaviors/communications/http/response/call::response-payload-base64-header
      - id: micro-behaviors/data/decode/base64/call::buffer-from-base64
      - id: micro-behaviors/data/decode/xor/repeating-key::js-repeating-key-buffer-xor-loop

  # The same rendezvous without the header fallback: the stage arrives in the
  # response body. Chain history narrows to one sender's transaction, the
  # recipient is cut into IPv4-sized halves, and the configured HTTP response
  # is unmasked with a repeating key. Wallet, ports and paths are not required.
  - id: ethereum-recipient-ip-split-xor-http-stage
    desc: Ethereum recipient resolves XOR-masked HTTP stage
    crit: hostile
    conf: 0.97
    attack: T1102.001,T1105,T1027
    near_bytes: 12000
    all:
      - id: micro-behaviors/communications/blockchain/client::ethereum-blockchain-history-query
      - id: micro-behaviors/data/transaction/query::ethereum-transaction-recipient-ip-split
      - id: micro-behaviors/communications/http/request/configuration::node-http-request-configured
      - id: micro-behaviors/data/decode/xor/repeating-key::js-repeating-key-buffer-xor-loop
    unless:
      - id: ethereum-recipient-payload-header-rendezvous

  # PolinRider stage 1 reads a sender's block transaction, cuts the recipient
  # into IPv4 halves and feeds the fetched stage to a detached `node -i`
  # process over stdin. Request details and XOR keys vary per build.
  - id: ethereum-recipient-ip-split-node-repl-stage
    desc: Ethereum recipient IP feeds detached Node REPL stage
    crit: hostile
    conf: 0.96
    attack: T1102.001,T1105,T1059.007
    near_bytes: 12000
    all:
      - id: micro-behaviors/communications/blockchain/ethereum::ethereum-jsonrpc-block-by-number-method
      - id: micro-behaviors/data/transaction/query::ethereum-transaction-recipient-ip-split
      - id: micro-behaviors/process/create/exec::node-repl-stdin-spawn
      - id: micro-behaviors/process/create/hidden::detached-hidden-spawn
