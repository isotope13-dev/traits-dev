defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
composite_rules:
  - id: ethereum-recipient-payload-header-rendezvous
    desc: Ethereum recipient splitting accompanies XOR HTTP header staging
    crit: hostile
    conf: 0.98
    attack: T1102,T1105,T1027
    # Replace the wallet/path-gated delivery rule with the rendezvous behavior:
    # chain history, IPv4-sized recipient slices, configured HTTP requests and
    # an encoded payload response. No chosen wallet or URL path is required.
    near_bytes: 12000
    all:
      - id: micro-behaviors/communications/blockchain/client::ethereum-blockchain-history-query
      - id: micro-behaviors/data/transaction/query::ethereum-transaction-recipient-ip-split
      - id: micro-behaviors/communications/http/request/configuration::node-http-request-configured
      - id: micro-behaviors/communications/http/response::response-payload-base64-header
      - id: micro-behaviors/data/decode/base64::buffer-from-base64
      - id: micro-behaviors/data/decode/xor::js-repeating-key-buffer-xor-loop
