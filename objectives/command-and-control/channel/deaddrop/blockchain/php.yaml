# PHP implants that treat an EVM contract response as mutable encrypted C2
# configuration. The contract address, selector, RPC provider and server names
# are deliberately absent: those are replaceable campaign indicators.
defaults:
  platforms: [unix, windows]
  for: [php]
  attack: T1102,T1071.001,T1027

composite_rules:
  - id: php-bitcoin-opreturn-relay-resolution
    desc: PHP defines a Blockstream-backed Bitcoin OP_RETURN data reader
    crit: suspicious
    conf: 0.98
    all:
      - id: micro-behaviors/communications/http/services/blockchain::blockstream-explorer-endpoint
      - id: micro-behaviors/data/format/bitcoin-script::bitcoin-opreturn-source
      - id: micro-behaviors/communications/http/client/file-read::file-get-contents-url

  - id: php-blockchain-c2-stage-execution
    desc: PHP executes a downloaded stage using a blockchain-resolved relay
    crit: hostile
    conf: 0.99
    for: [php, composer, zip, tar]
    scope: archive
    all:
      - id: php-bitcoin-opreturn-relay-resolution
      - id: objectives/execution/payload/file-exec/command/fetch::php-curl-chmod-variable-path-execution

  - id: php-evm-result-hex-json-decode
    desc: Hex-decodes an EVM result before JSON parsing
    crit: notable
    conf: 0.96
    near_bytes: 1200
    all:
      - id: micro-behaviors/communications/blockchain/ethereum::evm-jsonrpc-contract-call
      - id: micro-behaviors/data/property/access::result-member-read
      - id: micro-behaviors/data/decode/hex::php-hex-byte-decode
      - id: micro-behaviors/data/parse/json::php-json-decode

  - id: php-evm-contract-c2-bootstrap
    desc: Uses decoded Ethereum contract data as encrypted server configuration
    crit: hostile
    conf: 0.99
    near_bytes: 5000
    all:
      - id: php-evm-result-hex-json-decode
      - id: micro-behaviors/crypto/key/representation/reference::php-server-key-config-field
      - id: micro-behaviors/data/property/access::php-url-server-endpoint-key-reference
      - id: micro-behaviors/crypto/encrypt/transform::php-openssl-encrypt-call
