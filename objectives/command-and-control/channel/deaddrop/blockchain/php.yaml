# PHP implants that treat an EVM contract response as mutable encrypted C2
# configuration. The contract address, selector, RPC provider and server names
# are deliberately absent: those are replaceable campaign indicators.
defaults:
  platforms: [unix, windows]
  for: [php]
  attack: T1102,T1071.001,T1027

composite_rules:
  - id: php-evm-result-hex-json-decode
    desc: Hex-decodes an EVM result before JSON parsing
    crit: notable
    conf: 0.96
    near_bytes: 1200
    all:
      - id: objectives/command-and-control/channel/deaddrop/blockchain::evm-jsonrpc-contract-call
      - id: micro-behaviors/data/source/property/read::result-member-read
      - id: micro-behaviors/data/decode/hex::php-hex-byte-decode
      - id: micro-behaviors/data/serialize/json::php-json-decode

  - id: php-evm-contract-c2-bootstrap
    desc: Uses decoded Ethereum contract data as encrypted server configuration
    crit: hostile
    conf: 0.99
    near_bytes: 5000
    all:
      - id: php-evm-result-hex-json-decode
      - id: micro-behaviors/data/source/property/read::php-server-key-config-field
      - id: micro-behaviors/data/source/property/read::php-server-list-config-field
      - id: micro-behaviors/crypto/symmetric/encrypt::php-openssl-encrypt-call
