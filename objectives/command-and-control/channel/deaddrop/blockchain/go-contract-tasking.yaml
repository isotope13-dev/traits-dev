# Ethereum contract reads with GCM decryption and a linked Open-result-to-Node
# source argument. No operator-selected ABI method or contract address gates
# this observation. Go JSON decoder out-parameters are not modeled as flow;
# the description deliberately states the supported co-occurrence.
defaults:
  platforms: [unix, windows]
  for: [go]
  attack: T1102,T1059.007
  mbc: B0030

composite_rules:
  - id: go-contract-storage-command-execution
    desc: Ethereum reads with decrypted Node source
    crit: hostile
    conf: 0.97
    all:
      - id: micro-behaviors/communications/http/url/rpc::eth-call-method-field
      - id: micro-behaviors/communications/http/post::http-post
      - id: micro-behaviors/data/serialize/json::go-json-new-decoder
      - id: micro-behaviors/crypto/decrypt::go-gcm-open
      - id: micro-behaviors/process/create/eval::go-open-result-node-code
