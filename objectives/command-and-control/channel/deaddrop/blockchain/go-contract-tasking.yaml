# Go implants tasked through an Ethereum smart-contract dead drop. The
# operator hardcodes a contract address, polls it with eth_call, decrypts
# the returned storage or service-data blob, and executes the plaintext as
# code (Go via `go run`, JavaScript via `node`). Unlike recipient-address
# routing, nothing is decoded into an IP: the chain carries the task
# itself, so the conviction pairs the contract call with decryption and
# execution in the same file.
defaults:
  platforms: [unix, windows]
  for: [go]
  attack: T1102
  mbc: B0030

traits:
  # Contract entry points multiplexed for tasking: service-data readers and
  # a caller-key publisher. The names are the operator's ABI, shared across
  # samples of the family, so the trait keys on the set rather than one
  # literal and stays useful when the operator renames a single method.
  - id: contract-task-method-name
    desc: Contract C2 task method name
    crit: notable
    conf: 0.93
    if:
      type: text
      regex: '\b(setCPubKey|serviceData[12])\b'

composite_rules:
  - id: go-contract-storage-command-execution
    desc: Go executes commands fetched from an Ethereum contract
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/communications/http/url/rpc::eth-call-method-literal
      - id: micro-behaviors/communications/http/url/rpc::eth-call-contract-address
      - id: micro-behaviors/crypto/symmetric/aes/gcm::go-cipher-new-gcm
      - id: micro-behaviors/process/create/direct::exec-command

  # Method-multiplexed variant: the operator polls named entry points
  # (service-data readers, caller-key publisher) instead of raw storage
  # slots, then executes the returned task with node or self-deletes. No
  # AES leg is required here: this family's tasks arrive plaintext behind
  # the per-client encryption of the transport.
  - id: go-contract-method-tasking-exec
    desc: Go executes contract-method tasking payload
    crit: hostile
    conf: 0.97
    all:
      - id: contract-task-method-name
      - id: micro-behaviors/process/create/direct::exec-command
    any:
      - id: micro-behaviors/process/create/eval::go-interpreter-process-call
      - id: micro-behaviors/fs/delete/file/library::os-Remove
      - id: micro-behaviors/communications/http/url/rpc::eth-call-method-literal
