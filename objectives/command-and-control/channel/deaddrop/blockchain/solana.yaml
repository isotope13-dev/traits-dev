defaults:
  platforms:
  - windows
  - unix
  for:
  - binaries
  - source
  attack: T1102,T1071.001,T1140
composite_rules:
  # GlassWorm-style tasking: poll an address's signatures, take the newest
  # memo as the next-stage pointer, fetch that stage, and execute the
  # decoded body in a vm context. Signature polling alone is wallet
  # plumbing; joined to vm/eval execution of fetched content it is C2.
- id: solana-memo-dead-drop-vm-eval
  desc: Solana memo dead drop feeds VM eval execution
  crit: hostile
  conf: 0.98
  for: [javascript, typescript, source, binaries]
  near_bytes: 8192
  all:
  - id: micro-behaviors/communications/http/url/rpc::solana-get-signatures-for-address
  - id: micro-behaviors/communications/blockchain/client::solana-signature-provider-fragments
  - id: micro-behaviors/process/interpreter/vm::vm-runInContext
  - id: objectives/supply-chain/hidden-payload/encoding::eval-atob
- id: solana-account-data-c2-resolution
  desc: Resolves C2 from decoded Solana account data
  crit: hostile
  conf: 0.995
  near_bytes: 8192
  all:
  - id: micro-behaviors/communications/http/url/rpc::solana-wallet-rpc-observation
  - id: micro-behaviors/communications/http/url/build::native-decoded-response-authority
  - id: micro-behaviors/process/deploy/module-load::http-coff-rwx-symbol-entry-call
  - id: micro-behaviors/communications/rpc::jsonrpc-2-protocol-object
  - id: micro-behaviors/data/arithmetic::source-xor-modulo-or-indexed-loop
  - id: micro-behaviors/communications/http/url/build::request-to-variable-authority
  any:
  - id: micro-behaviors/data/decode/base64::atob-decode
  - id: micro-behaviors/data/decode/base64::b64decode-call
  - id: micro-behaviors/data/decode/base64::buffer-from-base64
  - id: micro-behaviors/data/decode/base64::buffer-from-base64-literal-to-text
  - id: micro-behaviors/data/decode/base64::clojure-jvm-base64-decoder-accessor
  - id: micro-behaviors/data/decode/base64::codecs-decode-base64
  - id: micro-behaviors/data/decode/base64::decode-base64-call
  - id: micro-behaviors/data/decode/base64::decodestring-call
  - id: micro-behaviors/data/decode/base64::go-base64-decode
  - id: micro-behaviors/data/decode/base64::go-base64-decode-method
  - id: micro-behaviors/data/decode/base64::multiple-b64decode-calls
  - id: micro-behaviors/data/decode/base64::native-base64-decode-call
  - id: micro-behaviors/data/decode/base64::new-decoder
  - id: micro-behaviors/data/decode/base64::nsdata-base64-decode
  - id: micro-behaviors/data/decode/base64::php-base64-decode-call
