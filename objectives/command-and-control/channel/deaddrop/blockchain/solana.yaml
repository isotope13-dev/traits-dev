# Solana account data used as a mutable C2 endpoint dead drop. The protocol
# mechanics are ordinary blockchain-client behavior; conviction requires the
# account response to be Base64-decoded, XOR-transformed, and then used as the
# authority for a subsequent network request.
defaults:
  platforms: [windows, unix]
  for: [binaries, source]
  attack: T1102,T1071.001,T1140
  mbc: B0025

composite_rules:
  - id: solana-account-data-c2-resolution
    desc: Resolves C2 from decoded Solana account data
    crit: hostile
    conf: 0.995
    near_bytes: 8192
    all:
      - id: micro-behaviors/communications/http/url/rpc::solana-wallet-rpc-observation
      - id: micro-behaviors/communications/rpc::jsonrpc-2-protocol-object
      - id: micro-behaviors/data/decode/symbol-base64
      - id: micro-behaviors/crypto/symmetric/xor/loop::source-xor-modulo-or-indexed-loop
      - id: micro-behaviors/communications/http/url/build::request-to-variable-authority
