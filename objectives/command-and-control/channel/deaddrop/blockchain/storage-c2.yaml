# Resilient C2 endpoint resolution through Ethereum contract storage. The
# contract is a mutable dead drop: an implant reads eth_getStorageAt, decodes
# the returned hex value as an IP address, and uses it only when its primary
# endpoint is unavailable. No provider, contract, wallet, or family IOC is
# required, so equivalent deployments survive infrastructure rotation.
defaults:
  platforms: [windows, unix]
  for: [go, python, javascript, typescript]
  attack: T1102
  mbc: B0030

composite_rules:
  - id: python-ethereum-storage-shell-command
    desc: Python decodes Ethereum storage into a shell command
    crit: hostile
    conf: 0.99
    for: [python]
    scope: archive
    all:
      - id: micro-behaviors/communications/http/url/rpc::eth-get-storage-at-method
      - id: micro-behaviors/communications/http/url/rpc::ethereum-cloudflare-provider
      - id: micro-behaviors/data/encode/base32::python-b32decode-call
      - id: micro-behaviors/process/create/subprocess::process-execution
      - id: micro-behaviors/process/interpreter/shell::bin-sh

  - id: ethereum-storage-ip-resolver
    desc: Decodes an IP address from Ethereum contract storage
    crit: suspicious
    conf: 0.98
    near_bytes: 1800
    all:
      - id: micro-behaviors/communications/http/url/rpc::eth-get-storage-at-method
      - id: micro-behaviors/communications/rpc::jsonrpc-2-protocol-object
    any:
      - id: micro-behaviors/communications/ip/parse::go-hex-decoded-ip-address
      - id: micro-behaviors/communications/ip/parse::python-hex-decoded-ip-address
      - id: micro-behaviors/communications/ip/parse::node-hex-decoded-ip-address

  - id: ethereum-storage-derived-socket-c2
    desc: Ethereum contract storage supplies an outbound socket address
    crit: suspicious
    conf: 0.99
    near_bytes: 2200
    all:
      - id: ethereum-storage-ip-resolver
    any:
      - id: micro-behaviors/communications/socket/dial::go-dial
      - id: micro-behaviors/communications/socket/dial::python-dial
      - id: micro-behaviors/communications/socket/dial::javascript-dial

  - id: ethereum-storage-derived-shell-c2
    desc: Ethereum contract storage supplies a remote-shell C2 address
    crit: hostile
    conf: 0.995
    near_bytes: 2600
    all:
      - id: ethereum-storage-derived-socket-c2
    any:
      - id: objectives/command-and-control/reverse-shell/dup::go-reverse-shell-comp
      - id: objectives/command-and-control/reverse-shell/stdio::python-generic-socket-popen-revshell
      - id: objectives/command-and-control/reverse-shell/stdio::js-reverse-shell-spawn

  - id: ethereum-storage-failover-shell-c2
    desc: Hardcoded primary C2 fails over to Ethereum storage for a remote shell
    crit: hostile
    conf: 0.995
    near_bytes: 3000
    all:
      - id: ethereum-storage-derived-shell-c2
      - id: micro-behaviors/communications/socket/connect::multiple-go-dial-call-sites
      - id: micro-behaviors/communications/ip/literal::external-ipv4-script

  - id: zig-ethereum-storage-shell-command
    desc: Zig runs shell command from Ethereum storage
    crit: hostile
    conf: 0.99
    for: [zig]
    scope: file
    all:
      - id: micro-behaviors/communications/http/url/rpc::eth-get-storage-at-method-literal
      - id: micro-behaviors/process/create/direct::zig-child-init
      - id: objectives/command-and-control/dropper/staging/temp::zig-bin-sh-c

  - id: source-ethereum-block-beacon-persistence
    desc: Package beacon schedules task from Ethereum block
    crit: hostile
    conf: 0.98
    for: [source, class, java_class, jar, csharp, java, kotlin, elixir, powershell]
    scope: archive
    all:
      - id: micro-behaviors/communications/http/url/rpc::eth-get-block-by-number-method-literal
    any:
      - id: micro-behaviors/os/autorun/scheduled::schtasks-utility-token
      - id: micro-behaviors/process/create/shell/lang::powershell-keyword
      - id: micro-behaviors/communications/http/download/curl::curl
      - id: micro-behaviors/communications/http/url/rpc::ethereum-cloudflare-provider
    needs: 2

  - id: source-ethereum-provider-scheduled-beacon
    desc: Package schedules a task after Ethereum lookup
    crit: hostile
    conf: 0.96
    for: [source, class, java_class, jar, csharp, java, kotlin, elixir, ruby, javascript, typescript, php, python, swift, zig]
    scope: file
    all:
      - id: micro-behaviors/communications/http/url/rpc::ethereum-cloudflare-provider
      - id: micro-behaviors/os/autorun/scheduled::schtasks-utility-token
    any:
      - id: micro-behaviors/process/create/shell/lang::powershell-keyword
      - id: micro-behaviors/process/create/system::elixir-system-cmd
      - id: micro-behaviors/process/create/direct::ruby-spawn
      - id: micro-behaviors/process/create/spawn::start
      - id: micro-behaviors/process/create/system::js-execfile-call

  - id: python-ethereum-scheduled-beacon
    desc: Python package schedules after Ethereum lookup
    crit: hostile
    conf: 0.98
    for: [python]
    scope: archive
    all:
      - id: micro-behaviors/communications/http/url/rpc::ethereum-cloudflare-provider
      - id: micro-behaviors/os/autorun/scheduled::python-schtasks-command-token
      - id: micro-behaviors/os/autorun/scheduled::python-schtasks-create-command
      - id: micro-behaviors/process/create/subprocess::process-execution
