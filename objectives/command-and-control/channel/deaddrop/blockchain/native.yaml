# Native C2 resolution through Ethereum JSON-RPC/ENS.  Provider redundancy is
# only suspicious when paired with code that turns an eth_call result into a
# socket destination; wallets and RPC clients otherwise remain neutral.
defaults:
  platforms: [unix, android]
  for: [source]
  attack: T1102,T1071.001
  mbc: B0025

traits:
  # This is a protocol-specific fragment used only as one leg of the
  # encrypted tasking composite below.  The exact helper name is intentionally
  # not treated as a malware identity on its own.
  - id: go-contract-event-listener
    desc: Go listens for Ethereum contract events
    crit: component
    conf: 0.96
    for: [go]
    if:
      type: symbol
      kind: call
      exact: helper.ListenForContractEvents

composite_rules:
  - id: native-ethereum-ens-c2-resolver
    desc: Native C2 resolved through Ethereum RPC
    crit: hostile
    conf: 0.99
    all:
      - id: micro-behaviors/communications/http/url/rpc::rpc-provider-url-cluster
      - id: micro-behaviors/communications/http/url/rpc::eth-call-method-literal
      - id: micro-behaviors/communications/http/url/rpc::ethereum-call-result-processing
    any:
      - id: micro-behaviors/communications/socket/connect::native-socket-connect-call
      - id: micro-behaviors/communications/socket/send::sendto-symbol
      - id: micro-behaviors/communications/ip/resolve::resolve-getaddrinfo

  # Three-tier C2 resilience seen in Kimwolf v7 and peers: resolve operators
  # through a redundant public Ethereum RPC pool (ENS / eth_call), keep a Tor
  # .onion backup, and front all outbound C2 through a loopback proxy port so
  # the transport can flip clearnet/Tor without rebundling the bot.
  - id: ethereum-ens-tor-local-proxy-c2
    desc: ENS C2 with Tor backup and local proxy front
    crit: hostile
    conf: 0.97
    attack: T1102,T1090,T1573.002
    all:
      - id: micro-behaviors/communications/http/url/rpc::rpc-provider-url-cluster
      - id: micro-behaviors/communications/proxy/tor::onion-domain-source-literal
      - id: micro-behaviors/communications/socket/port::loopback-endpoint-with-port
    near_bytes: 8192

  - id: go-ethereum-encrypted-contract-tasking
    desc: Go receives encrypted contract data and executes resulting files
    crit: hostile
    conf: 0.99
    scope: archive
    for: [go]
    attack: T1102,T1059,T1105
    all:
      - id: micro-behaviors/communications/http/url/rpc::eth-call-method-literal
      - id: micro-behaviors/communications/http/url/rpc::ethereum-call-result-processing
      - id: go-contract-event-listener
      - id: micro-behaviors/crypto/symmetric/aes/gcm::go-cipher-new-gcm
      - id: micro-behaviors/fs/file/write/direct::go-os-writefile
      - id: micro-behaviors/process/create/direct::exec-command

  - id: vibenet-ethereum-c2-discovery
    desc: IoT bot resolves C2 through Ethereum eth_call
    crit: hostile
    conf: 0.995
    for: [elf]
    all:
      - id: micro-behaviors/communications/http/url/rpc::ethereum-binary-eth-call-request
      - id: micro-behaviors/communications/http/url/rpc::ethereum-binary-result-hex-parser
      - id: micro-behaviors/communications/http/fingerprint::native-browser-user-agent-pool
      - id: micro-behaviors/communications/http/fingerprint::synthetic-browser-tracking-cookie
