defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
composite_rules:
  - id: transaction-xor-input-node-eval
    desc: XOR-decoded blockchain transaction input becomes Node code
    crit: hostile
    conf: 0.99
    attack: T1102,T1059.007,T1140
    # The parsed property token begins two bytes after the bracket/quote
    # prefix used by the supporting inline-spawn observation.
    near_bytes: 2
    all:
      - id: micro-behaviors/process/deploy/script-eval/input::transaction-xor-node-inline-source
      - id: micro-behaviors/process/create/eval::spawn-node-eval-computed-access
