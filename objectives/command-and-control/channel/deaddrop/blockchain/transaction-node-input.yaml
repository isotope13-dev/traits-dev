defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
composite_rules:
  - id: transaction-xor-input-node-eval
    desc: XOR-decoded blockchain transaction input becomes Node code
    crit: hostile
    conf: 0.99
    attack: T1102,T1059.007,T1140
    # The bound observation already connects transaction decoding to Node;
    # the call-syntax match has a wider span than its former text match.
    all:
      - id: micro-behaviors/process/deploy/script-eval/input::transaction-xor-node-inline-source
      - id: micro-behaviors/process/deploy/interpreter-command::spawn-node-eval-computed-access
