defaults:
  platforms: [windows]
  for: [pe, dll]
composite_rules:
  - id: concealed-blockchain-python-rendezvous
    desc: Concealed blockchain rendezvous for Python bootstrap
    crit: hostile
    conf: 0.97
    # The decoder, not a plaintext copy or fixed C2, establishes every hidden
    # input. Combine blockchain rendezvous with disguised per-user runtime staging
    # and a concealed virtual-CPU hardware check. Do not convict a generic
    # encrypted string or a hardware query by itself.
    all:
      - id: micro-behaviors/communications/http/request/json::xor16-ethereum-call-template
      - id: micro-behaviors/communications/http/download/helper::xor16-official-python-release-url
      - id: micro-behaviors/fs/path/application/interpreter::xor16-python-executable-name
      - id: micro-behaviors/os/env/read::xor16-localappdata-name
      - id: micro-behaviors/fs/path/os/identity::xor16-microsoft-windows-relative-path
      - id: objectives/anti-analysis/environment-detect/check::xor-virtual-cpu-model-with-hardware-queries
