# EtherHiding-style event mailbox: implants poll a contract with eth_call,
# pull command payloads via eth_getLogs, decrypt with AES-GCM, then dispatch
# colon-prefixed verbs. Commands ride in event calldata, not contract storage.
defaults:
  platforms: [unix, windows]
  for: [python, javascript, typescript]
  attack: T1102,T1573.001,T1059
  mbc: B0024,B0025

composite_rules:
  - id: evm-event-log-command-channel
    desc: AES-GCM commands retrieved from EVM event logs
    crit: hostile
    conf: 0.98
    near_bytes: 8192
    all:
      - id: micro-behaviors/communications/http/url/rpc::eth-get-logs-method-literal
      - id: objectives/command-and-control/remote-command/dispatch::prefix-colon-command-set
    any:
      - id: micro-behaviors/crypto/symmetric/aes/library::cryptography-aesgcm-api
      - id: micro-behaviors/crypto/symmetric/aes/runtime-library::aes-256-gcm

  - id: evm-event-log-fetch-execute
    desc: EVM event-log commands execute or fetch payloads
    crit: hostile
    conf: 0.99
    attack: T1102,T1105,T1059
    mbc: B0024,C0002
    near_bytes: 8192
    all:
      - id: evm-event-log-command-channel
    any:
      - id: micro-behaviors/process/create/subprocess::import-subprocess
      - id: micro-behaviors/process/create/shell/bridge::js-execsync
      - id: evm-task-process-launch
