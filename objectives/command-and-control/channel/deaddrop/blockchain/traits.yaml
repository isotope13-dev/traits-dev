# Blockchain Dead-Drop C2
# MBC: B0025 (Remote Command Execution)
# ATT&CK: T1102 (Web Service)
defaults:
  attack: T1102
  platforms: [windows, unix]
  for: [scripts, binaries]
traits:
  - id: canisterworm-canister-id
    desc: CanisterWorm C2 canister ID
    crit: suspicious
    conf: 0.99
    if:
      type: text
      substr: "tdtqy-oyaaa-aaaae-af2dq-cai"

    unless:
      - id: well-known/tool/detection/malcontent::malcontent-defensive-scanner-context
  - id: ton-blockchain-reference--named
    desc: Named TON network reference
    crit: component
    conf: 0.72
    if:
      type: text
      regex: "(?i)\\b(The Open Network|toncenter|tonapi)\\b"

  - id: ton-blockchain-reference--qualified
    desc: Qualified TON blockchain reference
    crit: component
    conf: 0.72
    if:
      type: text
      regex: "(?i)\\bTON\\s+(API|blockchain|network|wallet)\\b"

  - id: ton-smart-contract-reference
    desc: TON smart-contract reference
    crit: component
    conf: 0.78
    if:
      type: text
      regex: "(?i)(ton.{0,32}smart.?contract|smart.?contract.{0,32}ton)"

  # EtherHiding Node implants configure TONAPI host + smart-contract account
  # via these env vars (LevelBlue/SpiderLabs hospitality campaign and variants).
  - id: tonapi-domain-prefix-env
    desc: Reads TONAPI_DOMAIN_PREFIX environment variable
    crit: suspicious
    conf: 0.97
    for: [javascript, typescript]
    if:
      type: text
      substr: "process.env.TONAPI_DOMAIN_PREFIX"

  - id: contract-account-id-env
    desc: Reads CONTRACT_ACCOUNT_ID environment variable
    crit: suspicious
    conf: 0.97
    for: [javascript, typescript]
    if:
      type: text
      substr: "process.env.CONTRACT_ACCOUNT_ID"

  # TONResolver/SalatStealer-class: REST get_domain against tonapi/toncenter
  # returns a mutable C2 hostname from a TON smart contract.
  - id: tonapi-get-domain-path
    desc: tonapi.io get_domain method path
    crit: notable
    conf: 0.96
    for: [python, javascript, typescript, go, shell, pe, elf]
    if:
      type: text
      regex: '(?i)tonapi\.io[^''"\s]{0,160}/methods/get_domain\b'

  - id: toncenter-get-domain-query
    desc: toncenter get_domain method query
    crit: notable
    conf: 0.95
    for: [python, javascript, typescript, go, shell, pe, elf]
    if:
      type: text
      regex: '(?i)toncenter\.(com|io)[^''"\s]{0,120}get_domain\b'

  - id: ton-get-domain-method
    desc: TON smart-contract get_domain method
    crit: notable
    conf: 0.9
    for: [python, javascript, typescript, go, shell, pe, elf]
    if:
      type: text
      regex: '(?i)(/methods/get_domain\b|method=get_domain\b|["'']get_domain["''])'

  - id: ton-decoded-domain-field
    desc: Reads decoded.domain from TON API response
    crit: notable
    conf: 0.94
    for: [python, javascript, typescript, go, shell]
    if:
      type: text
      regex: '(?is)\b(tonapi|toncenter|get_domain)\b.{0,800}\b(decoded|result)\s*\.\s*domain\b'

  # EVM contract dead drops are protocol-shaped rather than family-shaped.
  # Keep these atoms small and assemble the request with proximity below so
  # the matcher remains usable across Python, JavaScript, and native variants.
  # The file-type set folds in the `binaries` group so JVM bytecode is covered:
  # Java loaders carry the same eth_call body as a constant-pool string, and the
  # previous hand list omitted `class`, leaving every JVM EtherHiding stager
  # invisible to these atoms.
  #
  # Only the atoms below carry actual EVM evidence.  The three legs that do
  # not — the `"jsonrpc":"2.0"` version marker, the `params:[` argument-list
  # field, and Node's `Buffer.from(x,"hex")` decode — used to live here under
  # EVM names.  Their matchers describe generic JSON-RPC, JSON and hex
  # mechanics, so an MCP/LSP transport or any hex-decoding module acquired a
  # blockchain-C2 finding (and, through directory references such as
  # `objectives/command-and-control/channel`, a suspicious composite verdict).
  # They now live at their canonical homes and are referenced cross-directory:
  #   micro-behaviors/communications/ipc/rpc::jsonrpc-2-protocol-object
  #   micro-behaviors/data/decode/hex::buffer-from-hex-call
  # The `params:[` leg was dropped outright: an `eth_call` method field, a
  # 20-byte `to:` address and an ABI-sized `data:` value inside one kilobyte
  # already identify the request, and a bare `params: [` identifies nothing.
  - id: evm-eth-call-method
    desc: EVM eth_call method field
    crit: component
    conf: 0.95
    for: [binaries, python, javascript, typescript, c, cpp, csharp]
    if:
      type: text
      regex: '\\?["'']?method\\?["'']?\s*:\s*\\?["'']eth_call\\?["'']'

  - id: evm-contract-target-field
    desc: EVM contract target field
    crit: component
    conf: 0.9
    for: [binaries, python, javascript, typescript, c, cpp, csharp]
    if:
      type: text
      regex: '(?i)\\?["'']to\\?["'']\s*:\s*\\?["''](0x[a-f0-9]{40}|%s|contract|address|target)\\?["'']'

  - id: evm-contract-data-field
    desc: Quoted EVM hex calldata field
    crit: component
    conf: 0.9
    for: [binaries, python, javascript, typescript, c, cpp, csharp]
    if:
      type: text
      # Python annotations such as `data: dict` are not serialized RPC
      # fields. Require an ABI-sized hexadecimal value as well as the quoted
      # JSON/object key used by the EVM request, so documentation examples do
      # not look like contract calldata.
      regex: '(?i)\\?["'']data\\?["'']\s*:\s*\\?["'']0x[0-9a-f]{8,}\\?["'']'

  - id: evm-contract-data-encoder
    desc: Quoted EVM data field uses an encoder
    crit: component
    conf: 0.9
    for: [binaries, python, javascript, typescript, c, cpp, csharp]
    if:
      type: text
      regex: '(?i)\\?["'']data\\?["'']\s*:\s*(encode|abi|pack|hexlify)\b'

  - id: evm-abi-decoder-call
    desc: Calls an EVM ABI decoder
    crit: notable
    conf: 0.94
    # type: symbol carries a much tighter file-type cap than text, so this one
    # keeps its hand-picked list; the decoder-name shape is JS/Python-flavoured
    # anyway and the JVM path is covered by the request atoms above.
    for: [python, javascript, typescript, c, cpp, csharp, pe, dll]
    if:
      type: symbol
      kind: call
      # `abi` must END the name (optionally followed by the viem-style
      # `Parameters`/`Params` suffix). The former trailing `[A-Za-z0-9_]*`
      # let any word continue after it, so libcxxabi's Itanium demangler
      # `parseAbiTags()` — C++ ABI tags, no EVM anywhere — matched.
      regex: '(?i)^(decode|deserialize|parse|unpack)_?abi(_?param[a-z]{0,6})?$'

  # The json/result/config decoder-name matchers carry no EVM evidence at all
  # (`parseJsonc`, `parse_result`, `parseConfig` are ordinary code), so they are
  # baseline atoms in micro-behaviors/data/serialize/envelope/ and are pulled in
  # by the composites below, which require the eth_call request alongside them.
  # Generic `value.split(` is ordinary JS (e.g. npm/node-semver makeSafeRegex);
  # only task/command(-url) identifiers are attack-context fragments here.
  - id: evm-result-task-url-parser
    desc: Splits task or command identifier
    crit: component
    conf: 0.94
    attack: T1102,T1059
    for: [binaries, python, javascript, typescript, c, cpp, csharp]
    if:
      type: text
      regex: '\b(task|command|task_url|taskUrl)\s*\.\s*(split|rsplit|partition)\s*\('

  - id: evm-task-url-delimiter
    desc: EVM task URL delimiter
    crit: component
    conf: 0.9
    for: [binaries, python, javascript, typescript, c, cpp, csharp]
    if:
      type: text
      substr: ':url:'

  # The fetch argument has to be the decoded tasking value. `url` was dropped
  # first — `fetch(url)` is the most ordinary HTTP call in JavaScript — and
  # `target` for the same reason: it is one of the most common variable names
  # in any client, so every AI/web SDK that fetched a `target` URL picked up a
  # blockchain-tasking component and leaked into composites that reference this
  # directory by name. Only the decoded-tasking names are attack context; the
  # composite that consumes this atom requires the eth_call request alongside it.
  - id: evm-task-download-call
    desc: Downloads URL from EVM tasking
    crit: component
    conf: 0.92
    attack: T1105
    for: [binaries, python, javascript, typescript, c, cpp, csharp]
    if:
      type: text
      regex: '(?i)\b(requests\.get|httpx\.get|fetch)\s*\(\s*(task_url|taskUrl)\b'

  - id: evm-task-process-launch
    desc: Launches EVM-delivered task
    crit: component
    conf: 0.92
    attack: T1059
    for: [binaries, python, javascript, typescript, c, cpp, csharp]
    if:
      type: text
      regex: '(?i)\b(subprocess\.(Popen|run|call)|execFile|CreateProcess[A-W]?|ShellExecute[A-W]?)\s*\('


composite_rules:
  - id: ton-blockchain-reference
    desc: TON blockchain reference
    crit: component
    conf: 0.72
    any:
      - id: ton-blockchain-reference--named
      - id: ton-blockchain-reference--qualified

  - id: python-web3-contract-c2-read
    desc: Reads encoded C2 config from a contract
    crit: suspicious
    conf: 0.98
    for: [python]
    all:
      - id: micro-behaviors/crypto/library/blockchain/client::web3-import
      - id: micro-behaviors/crypto/library/blockchain/client::web3-contract-read-call
      - id: micro-behaviors/data/decode/base64::base64-decoding
    near_bytes: 4096

  - id: python-blockchain-dns-dead-drop
    desc: Python resolves C2 from a smart contract before DNS tasking
    crit: hostile
    conf: 0.99
    attack: T1071.004,T1102,T1059
    for: [python]
    all:
      - id: python-web3-contract-c2-read
      - id: objectives/command-and-control/dns/tunneling::dns-txt-command-tasking
    near_bytes: 8192

  - id: blockchain-dead-drop-c2
    desc: Blockchain-based command retrieval dead drop
    crit: suspicious
    conf: 0.9
    any:
      - id: canisterworm-canister-id
      - id: ton-c2-fallback-over-doh

  - id: evm-contract-data-value
    desc: EVM contract call data value
    crit: component
    conf: 0.9
    any:
      - id: evm-contract-data-field
      - id: evm-contract-data-encoder

  - id: evm-jsonrpc-contract-call
    desc: EVM contract eth_call request
    crit: notable
    conf: 0.97
    for: [binaries, python, javascript, typescript, c, cpp, csharp]
    near_bytes: 1024
    all:
      - id: micro-behaviors/communications/ipc/rpc::jsonrpc-2-protocol-object
      - id: evm-eth-call-method
      - id: evm-contract-target-field
      - id: evm-contract-data-value

  - id: evm-response-decoder-call
    desc: Decodes an EVM RPC response
    crit: notable
    conf: 0.94
    near_bytes: 4096
    all:
      - id: evm-jsonrpc-contract-call
    any:
      - id: evm-abi-decoder-call
      - id: micro-behaviors/data/serialize/envelope::json-decoder-name-call
      - id: micro-behaviors/data/serialize/envelope::result-decoder-name-call
      - id: micro-behaviors/data/serialize/envelope::config-decoder-name-call

  - id: evm-response-config-decode
    desc: Decodes configuration returned by an EVM contract call
    crit: suspicious
    conf: 0.96
    for: [scripts, source, binaries, python, javascript, typescript, c, cpp, csharp, pe, dll]
    near_bytes: 4096
    all:
      - id: evm-jsonrpc-contract-call
    any:
      - id: evm-abi-decoder-call
      - id: micro-behaviors/data/serialize/envelope::json-decoder-name-call
      - id: micro-behaviors/data/serialize/envelope::result-decoder-name-call
      - id: micro-behaviors/data/serialize/envelope::config-decoder-name-call
      - id: micro-behaviors/data/decode/base64::b64decode-call
      - id: micro-behaviors/data/decode/hex::python-fromhex
      - id: micro-behaviors/data/decode/hex::python-unhexlify

  - id: evm-contract-config-read
    desc: Reads decoded configuration from an EVM contract
    crit: suspicious
    conf: 0.97
    for: [scripts, source, binaries, python, javascript, typescript, c, cpp, csharp, pe, dll]
    near_bytes: 4096
    all:
      - id: evm-response-config-decode
      - id: evm-jsonrpc-contract-call

  - id: evm-contract-command-channel
    desc: EVM contract response becomes tasking
    crit: hostile
    conf: 0.98
    attack: T1102,T1027,T1140
    mbc: B0024
    for: [scripts, source, binaries, python, javascript, typescript, c, cpp, csharp, pe, dll]
    near_bytes: 4096
    all:
      - id: evm-jsonrpc-contract-call
      - id: micro-behaviors/data/source/property/read::result-member-read
      - id: evm-result-task-url-parser
      - id: evm-task-url-delimiter
    any:
      - id: micro-behaviors/data/decode/base64::b64decode-call
      - id: micro-behaviors/data/decode/hex::python-fromhex
      - id: micro-behaviors/data/decode/hex::python-unhexlify
      - id: micro-behaviors/data/decode/hex::buffer-from-hex-call

  - id: evm-contract-fetch-execute
    desc: EVM tasking downloads and executes payload
    crit: hostile
    conf: 0.99
    attack: T1102,T1105,T1059
    mbc: B0024,C0002
    for: [scripts, source, binaries, python, javascript, typescript, c, cpp, csharp, pe, dll]
    near_bytes: 4096
    all:
      - id: evm-contract-command-channel
      - id: evm-task-download-call
      - id: evm-task-process-launch

  - id: ton-c2-fallback-over-doh
    desc: TON smart-contract C2 fallback over DNS-over-HTTPS
    crit: suspicious
    conf: 0.88
    all:
      - id: ton-blockchain-reference
      - id: micro-behaviors/communications/dns/doh::doh-cloudflare-ip-1-1-1-1
    any:
      - id: ton-smart-contract-reference
      - id: micro-behaviors/communications/dns/doh::doh-query-path
    needs: 1

  # Obfuscated Node WebSocket implants that resolve C2 via TONAPI + contract
  # account env config (EtherHiding). Catches future family variants even when
  # string tables change; the env names are the stable C2 wiring surface.
  - id: ton-etherhiding-websocket-c2
    desc: TON EtherHiding WebSocket C2 implant
    crit: hostile
    conf: 0.99
    for: [javascript, typescript]
    attack: T1102,T1071.001,T1027
    mbc: B0030
    all:
      - id: tonapi-domain-prefix-env
      - id: contract-account-id-env
      - id: micro-behaviors/communications/http/websocket::websocket-class
    any:
      - id: objectives/anti-static/obfuscation/obfuscator/js-obfuscator::push-shift-bracket-pattern
      - id: micro-behaviors/data/encode/payload::large-encoded-blob-literal
    needs: 1

  - id: ton-get-domain-resolver
    desc: Resolves hostname via TON get_domain API
    crit: suspicious
    conf: 0.96
    for: [scripts, source]
    near_lines: 40
    all:
      - id: ton-decoded-domain-field
    any:
      - id: tonapi-get-domain-path
      - id: toncenter-get-domain-query
      - id: ton-get-domain-method

  - id: ton-get-domain-deaddrop-c2
    desc: TON get_domain dead drop drives outbound C2
    crit: hostile
    conf: 0.98
    for: [javascript, typescript, python]
    attack: T1102,T1071.001
    mbc: B0024
    near_lines: 80
    all:
      - id: ton-get-domain-resolver
    any:
      - id: micro-behaviors/communications/http/url/build::post-to-variable-authority
      - id: micro-behaviors/communications/http/request/client::fetch-post-pattern
      - id: micro-behaviors/communications/http/request/client::js-fetch-call

  - id: ton-dns-deaddrop-exfil
    desc: Exfiltrates to host from TON blockchain DNS
    crit: hostile
    conf: 0.97
    for: [javascript, typescript, python]
    attack: T1102,T1041
    near_lines: 100
    all:
      - id: tonapi-get-domain-path
      - id: ton-decoded-domain-field
    any:
      - id: micro-behaviors/communications/http/url/build::js-post-to-variable-authority
      - id: micro-behaviors/communications/http/request/client::http-post-json
