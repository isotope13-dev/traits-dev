defaults:
  platforms: [linux, macos, windows]
  for: [source, class, java_class, csharp, java, kotlin, elixir, ruby, zig]
  attack: T1102
  conf: 0.97

composite_rules:
  - id: python-blockstream-opreturn-stage
    desc: Python package stages data from Bitcoin OP_RETURN
    crit: hostile
    conf: 0.98
    for: [python]
    scope: archive
    all:
      - id: micro-behaviors/communications/http/services/blockchain::blockstream-explorer-endpoint
      - id: micro-behaviors/data/decode/hex::python-fromhex
      - id: micro-behaviors/process/create/subprocess::process-execution
      - id: micro-behaviors/communications/http/lib/urllib::urllib-urlopen

  - id: source-bitcoin-opreturn-command-stage
    desc: Source stages commands from Bitcoin OP_RETURN
    crit: hostile
    scope: file
    all:
      - id: micro-behaviors/communications/http/services/blockchain::bitcoin-opreturn-source
      - id: micro-behaviors/communications/http/download/curl::curl
    unless:
      # A Bitcoin implementation has to name its own opcodes, and its tests
      # exercise them next to whatever fetch helper the harness uses. Bitcoin
      # Core's src/test/rpc_tests.cpp matched on exactly that pairing. The
      # deaddrop claim needs a consumer of the retrieved data, which a test
      # asserting on an RPC response is not.
      - id: metadata/package/testing/
    any:
      - id: objectives/command-and-control/dropper/staging/temp::zig-bin-sh-c
      - id: micro-behaviors/process/create/spawn::java-processbuilder-start-bytecode
      - id: micro-behaviors/process/create/system::elixir-system-cmd
      - id: micro-behaviors/process/create/shell/lang::ruby-system-download-command
      - id: micro-behaviors/process/create/shell/native::c-popen-variable-input
      - id: micro-behaviors/process/create/shell/bridge::js-exec
      - id: micro-behaviors/process/create/spawn::start

  - id: source-bitcoin-opreturn-command-stage-text
    desc: Source stages commands from OP_RETURN text
    crit: hostile
    conf: 0.97
    for: [source, class, java_class, csharp, java, kotlin, elixir, ruby, zig, javascript, typescript, php, python, perl, swift]
    scope: file
    all:
      - id: micro-behaviors/communications/http/services/blockchain::bitcoin-opreturn-source-text
      - id: micro-behaviors/communications/http/download/curl::curl
    any:
      - id: objectives/command-and-control/dropper/staging/temp::zig-bin-sh-c
      - id: micro-behaviors/process/create/spawn::java-processbuilder-start-bytecode
      - id: micro-behaviors/process/create/system::elixir-system-cmd
      - id: micro-behaviors/process/create/shell/lang::ruby-system-download-command
      - id: micro-behaviors/process/create/shell/bridge::js-exec
      - id: micro-behaviors/process/create/spawn::start

  - id: source-bitcoin-opreturn-download
    desc: Source downloads data after OP_RETURN lookup
    crit: hostile
    conf: 0.96
    for: [source, class, java_class, csharp, java, kotlin, elixir, ruby, zig, javascript, typescript, php, python, perl, swift]
    scope: file
    all:
      - id: micro-behaviors/communications/http/services/blockchain::bitcoin-opreturn-source
      - id: micro-behaviors/communications/http/download/curl::curl
    unless:
      # A Bitcoin implementation's own test suite names OP_RETURN and shows a
      # curl invocation against the RPC endpoint in the same file --
      # bitcoin-31.0/src/test/rpc_tests.cpp.
      - id: metadata/package/testing/
