defaults:
  platforms:
    - linux
    - macos
    - windows
  for:
    - source
    - class
    - java_class
    - csharp
    - java
    - kotlin
    - elixir
    - ruby
    - zig
  attack: T1102
  conf: 0.97
  crit: hostile
composite_rules:
  - id: npm-blockstream-opreturn-stage
    desc: npm package fetches OP_RETURN staged data
    conf: 0.98
    for:
      - javascript
      - typescript
      - npm
      - tar
    scope: archive
    all:
      - id: micro-behaviors/communications/http/services/blockchain::blockstream-explorer-endpoint
      - id: micro-behaviors/data/format/bitcoin-script::bitcoin-opreturn-source
    any:
      - id: micro-behaviors/process/daemonize/detach::detached-ignored-unref-spawn
      - id: micro-behaviors/fs/chmod/modify::node-chmod-owner-only-700
      - id: micro-behaviors/communications/http/download/cli/curl-wget::curl-wget-argv
    needs: 1
  - id: python-blockstream-opreturn-stage
    desc: Python package fetches OP_RETURN staged data
    conf: 0.98
    for:
      - python
      - whl
      - python-sdist
    scope: archive
    all:
      - id: micro-behaviors/communications/http/services/blockchain::blockstream-explorer-endpoint
      - id: micro-behaviors/data/format/bitcoin-script::bitcoin-opreturn-source
      - id: micro-behaviors/data/decode/hex::python-fromhex
      - id: micro-behaviors/process/create/subprocess/launch::process-execution
      - id: micro-behaviors/communications/http/client/exchange::urllib-urlopen
    unless:
      - id: well-known/app/ai/coding-agent/yana-ai::yana-ai-security-audit-product-context
      - id: well-known/app/ai/agent-runtime/flywheel/
  - id: source-bitcoin-opreturn-command-stage
    desc: Source fetches commands staged in Bitcoin OP_RETURN
    scope: file
    all:
      - id: micro-behaviors/data/format/bitcoin-script::bitcoin-opreturn-source
      - id: micro-behaviors/communications/http/client/reference::curl-client-reference
    unless:
      - id: metadata/path/directory::test-directory-component
    any:
      - id: micro-behaviors/process/create/shell/reference::zig-bin-sh-c
      - id: micro-behaviors/process/create/subprocess/launch::java-processbuilder-start-bytecode
      - id: micro-behaviors/process/create/exec::elixir-system-cmd
      - id: micro-behaviors/communications/http/download/cli/curl-wget::ruby-system-download-command
      - id: micro-behaviors/process/create/shell/variable-command::c-popen-variable-input
      - id: micro-behaviors/process/create/shell/command-string::js-exec
      - id: micro-behaviors/process/create/subprocess/launch::dotnet-process-start
  - id: source-bitcoin-opreturn-command-stage-text
    desc: Source fetches commands staged in OP_RETURN text
    conf: 0.97
    for:
      - source
      - class
      - java_class
      - csharp
      - java
      - kotlin
      - elixir
      - ruby
      - zig
      - javascript
      - typescript
      - php
      - python
      - perl
      - swift
    scope: file
    all:
      - id: micro-behaviors/data/format/bitcoin-script::bitcoin-opreturn-source-text
      - id: micro-behaviors/communications/http/client/reference::curl-client-reference
    any:
      - id: micro-behaviors/process/create/shell/reference::zig-bin-sh-c
      - id: micro-behaviors/process/create/subprocess/launch::java-processbuilder-start-bytecode
      - id: micro-behaviors/process/create/exec::elixir-system-cmd
      - id: micro-behaviors/communications/http/download/cli/curl-wget::ruby-system-download-command
      - id: micro-behaviors/process/create/shell/command-string::js-exec
      - id: micro-behaviors/process/create/subprocess/launch::dotnet-process-start
  - id: source-bitcoin-opreturn-data-retrieval
    desc: Source retrieves marked data from Bitcoin OP_RETURN records
    conf: 0.96
    for:
      - source
      - class
      - java_class
      - csharp
      - java
      - kotlin
      - elixir
      - ruby
      - zig
      - javascript
      - typescript
      - php
      - python
      - perl
      - swift
    scope: file
    all:
      - id: micro-behaviors/data/format/bitcoin-script::bitcoin-opreturn-source
      - id: micro-behaviors/communications/http/client/reference::curl-client-reference
    unless:
      - id: well-known/app/finance/pyblock::pyblock-source-tree-member
