defaults:
  platforms: [linux, macos, windows]
  for: [source, class, java_class, csharp, java, kotlin, elixir, ruby, zig]
  attack: T1102
  conf: 0.97

composite_rules:
  - id: source-bitcoin-opreturn-command-stage
    desc: Source stages commands from Bitcoin OP_RETURN
    crit: hostile
    scope: file
    all:
      - id: micro-behaviors/communications/http/services/blockchain::bitcoin-opreturn-source
      - id: micro-behaviors/communications/http/download/curl::curl
    any:
      - id: objectives/command-and-control/dropper/staging/temp::zig-bin-sh-c
      - id: micro-behaviors/process/create/spawn::java-processbuilder-start-bytecode
      - id: micro-behaviors/process/create/system::elixir-system-cmd
      - id: micro-behaviors/process/create/shell/lang::ruby-system-download-command
      - id: micro-behaviors/process/create/shell/native::c-popen-variable-input
      - id: micro-behaviors/process/create/shell/bridge::js-exec
      - id: micro-behaviors/process/create/spawn::start
