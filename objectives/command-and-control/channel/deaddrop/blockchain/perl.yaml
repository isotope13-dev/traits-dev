# Perl dead-drop resolvers over public blockchain infrastructure. The same
# file that decodes WHOIS contact hex into an IPv4 relay also pulls tasking
# out of a Bitcoin OP_RETURN output and an Ethereum storage slot, each over
# plain HTTPS with result parsing. The provider hostnames and wallet or
# contract identifiers rotate freely; the durable signal is the pairing of a
# chain-data marker with an HTTP fetch and result extraction in one file.
defaults:
  platforms: [linux, macos, windows]
  for: [perl]
  attack: T1102
  conf: 0.97
  crit: hostile

composite_rules:
  - id: perl-bitcoin-opreturn-stage
    desc: Perl stages data from Bitcoin OP_RETURN
    scope: file
    all:
      - id: micro-behaviors/communications/http/services/blockchain::blockstream-explorer-endpoint
      - id: micro-behaviors/data/format/bitcoin-script::bitcoin-opreturn-source
      - id: micro-behaviors/communications/http/curl/command::curl-command-remote-url
      - id: micro-behaviors/data/string/substring::perl-index-marker-substring

  - id: perl-ethereum-storage-stage
    desc: Perl reads Ethereum storage slot over HTTP
    scope: file
    all:
      - id: micro-behaviors/communications/blockchain/ethereum::eth-get-storage-at-method-field
      - id: micro-behaviors/communications/http/curl/body::curl-json-post-command
      - id: micro-behaviors/data/format/json::json-result-output-field

  # Provider-agnostic fallback: the fetch host rotates freely (blockstream,
  # mempool, self-hosted esplora) and nothing obliges the implant to name the
  # OP_RETURN opcode. A scriptPubKey parse paired with a marker carve and an
  # HTTP fetch is worth a look wherever it appears, but without the opcode
  # marker or a known explorer it stays suspicious rather than hostile.
  - id: perl-bitcoin-script-carve-fetch
    desc: Perl carves fetched Bitcoin script data
    crit: suspicious
    conf: 0.9
    scope: file
    all:
      - id: micro-behaviors/data/format/bitcoin-script::bitcoin-scriptpubkey-reference
      - id: micro-behaviors/data/string/substring::perl-index-marker-substring
      - id: micro-behaviors/communications/http/curl/command::curl-command-remote-url
