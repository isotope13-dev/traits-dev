defaults:
  platforms: [windows, unix]
  for: [wasm]
  attack: T1102,T1059,T1105

composite_rules:
  - id: solana-memo-wasm-shell-loader
    desc: Concealed WASM combines Solana Memo lookup with host shell download templates
    crit: hostile
    conf: 0.99
    scope: file
    all:
      - id: micro-behaviors/data/decode/xor::wasm-constant-xor-data-loops
      - id: micro-behaviors/communications/blockchain/client::solana-get-signatures-for-address
      - id: metadata/file/profile/operation-reference::get-transaction-method-binary
      - id: micro-behaviors/communications/blockchain/client::solana-memo-program-id
      - id: micro-behaviors/process/interpreter/wasm::go-wasm-host-value-call
      - id: micro-behaviors/process/interpreter/wasm::go-wasm-host-value-invoke
      - id: metadata/import/builtin::encoded-child-process-reference
      - id: metadata/lang/source/naming/function/runtime::wasm-execsync-method-reference
      - id: micro-behaviors/communications/http/download/shell::wasm-powershell-http-template-prefix
      - id: metadata/lang/source/syntax/command/pipeline::wasm-iex-pipeline-reference
