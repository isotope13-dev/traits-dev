# A model-serving registry doubles as a dead drop: tasking hides in registry
# record names, the client lists them over HTTP, reassembles and decodes the
# payload, and executes it. The registry path alone is neutral; fetching it
# plus decoding plus a shell or eval/exec sink is the channel.
defaults:
  platforms: [unix, windows]
  for: [python]
  attack: T1102,T1059

composite_rules:
- id: model-registry-command-deaddrop-exec
  desc: Model registry listing decoded and executed as command
  crit: hostile
  conf: 0.97
  scope: file
  near_lines: 60
  all:
  - id: micro-behaviors/communications/http/url/api-path/route::model-registrations-api-path
  - id: micro-behaviors/data/decode/base64/unspecified::b64decode-call
  any:
  - id: micro-behaviors/process/create/shell/command-string::python-subprocess-shell-true
  - id: micro-behaviors/process/create/shell/command-mode::python-os-system
  - id: micro-behaviors/process/create/shell/command-mode::python-os-popen-call
  - id: micro-behaviors/process/create/shell/variable-command::python-subprocess-sh-c-runtime-command
  - id: micro-behaviors/process/create/shell/variable-command::python-aliased-subprocess-sh-c-runtime-command
  - id: micro-behaviors/process/interpreter/eval/python-builtins::exec-builtin
  - id: micro-behaviors/process/interpreter/eval/python-builtins::eval-builtin
