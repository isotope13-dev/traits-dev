# HTTP dead-drop resolver with a plaintext host handoff.
#
# PrivateLoader's resolver response was a small `HOST:<address>` record from a
# public or operator-controlled URL, followed by a request to the returned C2.
# The endpoint names are represented as a path shape rather than as a family
# IOC so future resolver variants remain in scope.
defaults:
  platforms: [windows, unix]
  for: [python, c, cpp, go, rust, javascript]
  attack: T1102.001
  mbc: B0030

traits:
  - id: dead-drop-server-list-path
    desc: Dead-drop server/proxy list path
    crit: suspicious
    conf: 0.91
    if:
      type: string_literal
      regex: '(?i)https?://[^/\s"'']+/(servers?|proxies)\.txt([?#][^\s"'']*)?$'

  - id: python-two-http-get-calls
    desc: Python performs two HTTP GET calls
    crit: notable
    conf: 0.9
    for: [python]
    if:
      type: text
      regex: 'requests\.get\([^)]{0,140}\)[\s\S]{0,180}HOST\s*:\s*[\s\S]{0,180}requests\.get\('

  - id: go-two-http-get-calls
    desc: Go performs two HTTP GET calls
    crit: notable
    conf: 0.9
    for: [go]
    if:
      type: text
      regex: 'http\.Get\([^)]{0,140}\)[\s\S]{0,180}HOST\s*:\s*[\s\S]{0,180}http\.Get\('

  - id: javascript-two-fetch-calls
    desc: JavaScript performs two fetch calls
    crit: notable
    conf: 0.9
    for: [javascript, typescript]
    if:
      type: text
      regex: 'fetch\([^)]{0,140}\)[\s\S]{0,180}HOST\s*:\s*[\s\S]{0,180}fetch\('

composite_rules:
  - id: go-response-body-endpoint-resolver
    desc: Go resolves a QUIC endpoint from HTTP
    crit: suspicious
    conf: 0.96
    for: [go]
    all:
      - id: micro-behaviors/communications/http/url/build::go-response-body-url-construction
      - id: micro-behaviors/communications/http/client/library::go-http3-client-transport

  - id: go-response-resolved-encrypted-backdoor
    desc: HTTP-resolved encrypted Go backdoor
    crit: hostile
    conf: 0.99
    for: [go]
    attack: T1059,T1102.001,T1573.001
    all:
      - id: go-response-body-endpoint-resolver
      - id: objectives/command-and-control/backdoor/tasking/json-http::go-shell-file-tasking-roster
      - id: micro-behaviors/crypto/symmetric/stream::go-rc4-new-cipher
  - id: response-host-followup-http-request
    desc: Response host follow-up request
    crit: suspicious
    conf: 0.93
    any:
      - id: python-two-http-get-calls
      - id: go-two-http-get-calls
      - id: javascript-two-fetch-calls

  - id: http-dead-drop-resolver
    desc: HTTP dead-drop resolves a C2 host
    crit: hostile
    conf: 0.98
    attack: T1102.001,T1071.001
    all:
      - id: dead-drop-server-list-path
      - id: micro-behaviors/communications/http/message::host-header-line-token
      - id: response-host-followup-http-request

  - id: xor-obfuscated-remote-response
    desc: XOR transforms a remote response
    crit: suspicious
    conf: 0.95
    attack: T1071.001,T1573.001,T1132
    all:
      - id: objectives/command-and-control/channel/deaddrop/public-service::remote-response-body
      - id: micro-behaviors/data/decode/custom::bytewise-xor-buffer-transform
    near_bytes: 512
    unless:
      # A 512-byte proximity window carries no meaning inside a multi-megabyte
      # bundle whose minifier packs unrelated modules onto one 50,000-character
      # line: an HTTP response handler and any library's XOR loop land adjacent
      # by construction. Small payloads, which is what this rule targets, do not
      # meet the bundle threshold.
      - id: metadata/library/structure::js-large-minified-bundle
