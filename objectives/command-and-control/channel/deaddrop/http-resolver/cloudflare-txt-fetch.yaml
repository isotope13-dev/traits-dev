# A Cloudflare DNS TXT read through the API is a dead-drop lookup when the same
# PE also fetches over the network: the record supplies a rendezvous address.
# A DNS-management tool reads TXT records too, so the download leg is required
# and the claim stays at suspicious.
defaults:
  for: [pe]
  platforms: [windows]
  attack: T1102.001
  mbc: B0030

composite_rules:
  - id: cloudflare-txt-record-deaddrop-fetch
    desc: Cloudflare TXT lookup and WinINet read in one PE
    crit: suspicious
    conf: 0.85
    scope: file
    all:
      - id: micro-behaviors/communications/http/services/cloudflare::cloudflare-dns-txt-records
      - id: micro-behaviors/communications/http/client/wininet::internet-read-file
