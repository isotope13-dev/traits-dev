# PowerShell dead-drop resolver.
#
# The panel address is never embedded in the script. It is published on a
# public anonymous-publishing or paste host, fetched at runtime, and the value
# recovered from that page becomes the target of the next request. Only the
# dead-drop URL is static, so operators rotate infrastructure by re-publishing
# a page rather than by rebuilding the implant, and the first outbound request
# resolves to a legitimate CDN.
#
# The service leg is a directory reference on purpose: the durable shape is
# "fetch a page from a public anonymous host, then request whatever it named",
# so a campaign that moves between publishing services stays in scope. The
# request leg keys on the target being interpolated rather than literal, which
# is what separates a resolver from a script with a hardcoded endpoint.
defaults:
  platforms: [windows]
  for: [powershell]
  attack: T1102.001
  mbc: B0030

composite_rules:
  - id: interpolated-request-target
    desc: Request target built at runtime
    crit: notable
    conf: 0.9
    any:
      - id: micro-behaviors/communications/http/url/build::webclient-interpolated-target
      - id: micro-behaviors/communications/http/url/build::web-cmdlet-interpolated-uri

  - id: paste-host-c2-resolution
    desc: C2 host resolved from a public paste page
    crit: suspicious
    conf: 0.94
    all:
      - id: objectives/command-and-control/infrastructure/paste/
      - id: micro-behaviors/communications/http/client/managed::downloadstring
      - id: interpolated-request-target
    near_lines: 40

  - id: paste-host-resolved-c2-tasking
    desc: Paste-resolved C2 returns code that is run
    crit: hostile
    conf: 0.97
    attack: T1102.001,T1059.001
    all:
      - id: paste-host-c2-resolution
    any:
      - id: micro-behaviors/process/interpreter/eval/direct::powershell-iex-call
      - id: micro-behaviors/process/interpreter/eval/direct::embedded-powershell-iex
      - id: micro-behaviors/process/interpreter/eval/direct::embedded-powershell-iex-alias
    near_lines: 60
