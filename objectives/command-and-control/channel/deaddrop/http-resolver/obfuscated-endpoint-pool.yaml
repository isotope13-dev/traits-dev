# Dead-drop resolver whose rendezvous endpoints are hidden in the binary.
#
# The resolver pattern here is: keep several interchangeable endpoints as
# hex-encoded blobs, rebuild them to text at run time, then race them so the
# first one still reachable wins. The redundancy keeps the channel alive when a
# host is taken down; the encoding keeps the host names out of string dumps,
# scanners, and registry review of the published artifact.
#
# Clients that legitimately fail over between mirrors do the same racing with
# their URLs in plain text -- it is the concealment of the pool, not the
# failover, that makes this a resolver.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  attack: T1102.001
  mbc: B0030

composite_rules:
  - id: hex-obfuscated-endpoint-pool-resolver
    desc: Hex-obfuscated endpoint pool decoded and raced
    crit: hostile
    conf: 0.95
    unless:
      - id: micro-behaviors/communications/http/services/synology::synology-nas-cli-uploader
    all:
      - id: micro-behaviors/data/encode/hex::hex-encoded-https-list
      - id: micro-behaviors/data/decode/hex::js-hex-charcode-decoder
      - id: micro-behaviors/communications/http/request/failover::promise-any-fetch-race
