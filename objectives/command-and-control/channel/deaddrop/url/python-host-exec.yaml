# The first response supplies the URL authority, and the second response is
# executed. Bind both names and require adjacent statements: a fixed-host
# request, an overwritten host/body, and unrelated evals must not qualify.
# The bounded RHS predicate checks an HTTP operation, never prose. Tree shape
# is needed for URL authority and assignment identity; call provenance alone
# cannot require both HTTP hops in order.
defaults:
  platforms: [unix, windows]
  for: [python]
  crit: suspicious
  conf: 0.98
  attack: T1102.001,T1059.006
traits:
  - id: python-response-host-code-exec
    desc: Response host directs Python execution
    if:
      type: tree-sitter
      language: python
      query: |
        ((_
          (expression_statement (assignment
            left: (identifier) @host
            right: (_) @resolved))
          . (expression_statement (assignment
            left: (identifier) @source
            right: (attribute
              object: (call
                function: (attribute object: (identifier) @client
                  attribute: (identifier) @get)
                arguments: (argument_list . [
                  (binary_operator
                    left: (binary_operator left: (string) @scheme
                      operator: "+" right: (identifier) @used_host)
                    operator: "+" right: (string))
                  (binary_operator left: (string) @scheme
                    operator: "+" right: (identifier) @used_host)
                  (string (string_start) (string_content) @scheme
                    . (interpolation expression: (identifier) @used_host))
                ]))
              attribute: (identifier) @text)))
          . (expression_statement (call function: (identifier) @exec
            arguments: (argument_list . (identifier) @executed))))
          (#match? @resolved "^(requests|httpx)\\.get\\([\\s\\S]{1,200}\\)\\.text(\\.strip\\(\\))?$")
          (#match? @client "^(requests|httpx)$")
          (#eq? @get "get")
          (#eq? @text "text")
          (#match? @scheme "^['\"]?https?://['\"]?$")
          (#eq? @host @used_host)
          (#eq? @exec "exec")
          (#eq? @source @executed))
    unless:
      - id: metadata/lang/source/origin::plain-source-layer-path
