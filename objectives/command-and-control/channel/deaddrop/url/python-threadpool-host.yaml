# Bind the hostname selected from fetched text through the second fetch and
# compiled-code executor, including the shared helper names and polling call.
# A builder or HTTP/eval co-occurrence cannot establish this control channel.
defaults:
  platforms: [unix, windows]
  for: [python]
  attack: T1102.001,T1071.001,T1059.006
traits:
  - id: python-response-host-threadpool-poll
    desc: HTTP response selects polled Python code host
    crit: suspicious
    conf: 0.99
    if:
      type: tree-sitter
      language: python
      query: |
        ((module
          (function_definition
            name: (identifier) @fetch
            parameters: (parameters . (identifier) @url .)
            body: (block
              . (expression_statement (assignment
                left: (identifier) @response
                right: (call function: (attribute
                  object: (identifier) @client attribute: (identifier) @get)
                  arguments: (argument_list . (identifier) @requested))))
              . (expression_statement (call))?
              . (return_statement (attribute
                object: (identifier) @returned attribute: (identifier) @text)) .))
          (function_definition
            name: (identifier) @async_fetch
            parameters: (parameters . (identifier) @async_url .)
            body: (block
              (for_statement body: (block
                (try_statement body: (block
                  (return_statement (await (call
                    function: (attribute attribute: (identifier) @fetch_executor)
                    arguments: (argument_list
                      . (_) . (identifier) @callback . (identifier) @forwarded .))))))))))
          (function_definition
            name: (identifier) @execute
            parameters: (parameters . (identifier) @source .)
            body: (block
              (expression_statement (await (call
                function: (attribute attribute: (identifier) @exec_executor)
                arguments: (argument_list
                  . (_) . (lambda body: (call
                    function: (identifier) @exec
                    arguments: (argument_list . (call
                      function: (identifier) @compile
                      arguments: (argument_list
                        . (identifier) @compiled . (string) . (string) @mode)))))))))))
          (function_definition
            name: (identifier) @step
            body: (block
              . (expression_statement (assignment
                left: (identifier) @routing_text
                right: (await (call function: (identifier) @routing_reader))))
              . (expression_statement (assignment
                left: (identifier) @host
                right: (call function: (identifier) @next
                  arguments: (argument_list
                    (generator_expression
                      body: (call function: (attribute
                        object: (identifier) @stripped_line
                        attribute: (identifier) @strip))
                      (for_in_clause
                        left: (identifier) @line
                        right: (call function: (attribute
                          object: (identifier) @split_text
                          attribute: (identifier) @splitlines))))))))
              . (if_statement
                condition: (not_operator argument: (identifier) @guard_host)
                consequence: (block . (return_statement) .))
              . (expression_statement (await (call)))?
              . (expression_statement (assignment
                left: (identifier) @received
                right: (await (call function: (identifier) @fetch_call
                  arguments: (argument_list . (call
                    function: (attribute object: (string) @template
                      attribute: (identifier) @format)
                    arguments: (argument_list . (identifier) @used_host)))))))
              . (expression_statement (await (call
                function: (identifier) @exec_call
                arguments: (argument_list . (identifier) @submitted .))))))
          (function_definition body: (block
            (while_statement condition: (true) body: (block
              (try_statement body: (block
                (expression_statement (call
                  function: (attribute object: (identifier) @asyncio
                    attribute: (identifier) @run)
                  arguments: (argument_list . (call
                    function: (identifier) @step_call
                    arguments: (argument_list)) .))))))))))
          (#match? @client "^(requests|httpx)$")
          (#eq? @get "get")
          (#eq? @text "text")
          (#eq? @url @requested)
          (#eq? @response @returned)
          (#eq? @fetch_executor "run_in_executor")
          (#eq? @fetch @callback)
          (#eq? @async_url @forwarded)
          (#eq? @exec_executor "run_in_executor")
          (#eq? @exec "exec")
          (#eq? @compile "compile")
          (#match? @mode "^['\"]exec['\"]$")
          (#eq? @source @compiled)
          (#eq? @async_fetch @fetch_call)
          (#eq? @execute @exec_call)
          (#eq? @received @submitted)
          (#eq? @asyncio "asyncio")
          (#eq? @run "run")
          (#eq? @step @step_call)
          (#eq? @routing_reader @async_fetch)
          (#eq? @next "next")
          (#eq? @strip "strip")
          (#eq? @line @stripped_line)
          (#eq? @split_text @routing_text)
          (#eq? @splitlines "splitlines")
          (#eq? @host @used_host)
          (#eq? @host @guard_host)
          (#eq? @format "format")
          (#match? @template "^['\"]http[s]?://\\{\\}\\{\\}['\"]$"))
    unless:
      - id: metadata/lang/source/origin::plain-source-layer-path
composite_rules:
  - id: python-detached-response-host-tasking
    desc: Detached code daemon uses response-selected host
    crit: hostile
    conf: 0.99
    platforms: [linux, macos]
    all:
      - id: python-response-host-threadpool-poll
      - id: objectives/command-and-control/remote-command/http-poll::python-threadpool-http-exec-daemon
