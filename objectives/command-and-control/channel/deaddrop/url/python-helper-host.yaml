defaults:
  platforms: [linux, macos]
  for: [python]
composite_rules:
  - id: python-detached-helper-response-host-tasking
    desc: Detached code daemon uses response-selected host
    crit: hostile
    conf: 0.99
    attack: T1102.001,T1071.001,T1059.006
    all:
      - id: micro-behaviors/communications/http/url/build::python-helper-response-selects-host
      - id: objectives/command-and-control/remote-command/http-poll::python-detached-helper-exec-poll
