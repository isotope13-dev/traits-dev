# VBScript URL dead-drop resolution.
# The durable signal is response content becoming a second request target,
# especially when the script can execute the returned source.  Resolver
# services, task names, and endpoint strings are intentionally not required.
defaults:
  platforms: [windows]
  for: [vbs]
  attack: T1102.001,T1059.005
  mbc: C0002

traits:
  - id: wsh-response-text-followup-get
    desc: WSH reuses response text as follow-up URL
    crit: suspicious
    conf: 0.95
    if:
      type: text
      regex: '(?is)\.ResponseText[\s\S]{0,320}\.Open\s+["'']GET["'']\s*,\s*[A-Za-z_]\w*'

  - id: wsh-registry-c2-cache
    desc: WSH caches an HTTP endpoint in HKCU
    crit: suspicious
    conf: 0.94
    if:
      type: text
      regex: '(?is)Reg(Read|Write)\s*\(\s*["'']HKCU\\Console\\[^"'']{0,80}["'']'

composite_rules:
  - id: url-deaddrop-vbscript
    desc: VBScript follows a response-supplied URL and executes returned code
    crit: hostile
    conf: 0.98
    all:
      - id: wsh-response-text-followup-get
      - id: micro-behaviors/communications/http/client/vba::http-open-send
      - id: objectives/execution/interpreter/vbscript/loader::executeglobal-variable

  - id: registry-cached-vbscript-deaddrop
    desc: VBScript registry-cached dead-drop loader
    crit: hostile
    conf: 0.98
    all:
      - id: wsh-registry-c2-cache
      - id: micro-behaviors/communications/http/client/vba::http-open-send
      - id: objectives/execution/interpreter/vbscript/loader::executeglobal-variable
