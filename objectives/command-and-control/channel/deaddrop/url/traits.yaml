defaults:
  platforms:
  - windows
  - unix
  crit: suspicious
  attack: T1102.001
traits:
- id: go-http-get-readall-post
  desc: HTTP body passed to a Post call
  crit: suspicious
  conf: 0.9
  for:
  - go
  if:
    type: symbol
    kind: call
    regex: '(^|[.])Post$'
    arg:
      index: 0
      from:
        call: '^net/http[.]Get$'
        through:
          - call: '^(io|io/ioutil)[.]ReadAll$'
            arguments: [0]
          - call: '^string$'
            arguments: [0]
- id: go-get-then-get
  desc: HTTP GET result used in second GET
  crit: notable
  conf: 0.75
  for:
  - go
  if:
    type: text
    regex: (http|\w+[Cc]lient)\.Get\s*\(\s*[^,\n()]{1,120}\s*\)\.String\s*\(\)[\s\S]{0,250}\.Get\s*\(
- id: py-requests-url-chain
  desc: URL variable reused after requests GET
  crit: suspicious
  conf: 0.8
  for:
  - python
  if:
    type: text
    regex: (?i)\burl\s*=\s*requests\.get\(.{0,50}\)\.text[\s\S]{0,40}requests\.(get|post)\(\s*url\b
- id: py-requests-endpoint-chain
  desc: Endpoint variable reused after requests GET
  crit: suspicious
  conf: 0.8
  for:
  - python
  if:
    type: text
    regex: (?i)endpoint\s*=\s*requests\.get\(.{0,10}\)\.text[\s\S]{0,9}requests\.(get|post)\(endpoint
- id: py-requests-host-chain
  desc: Host variable reused after requests GET
  crit: suspicious
  conf: 0.8
  for:
  - python
  if:
    type: text
    regex: (?i)\bhost\s*=\s*requests\.get\(.{0,20}\)\.text[\s\S]{0,20}requests\.(get|post)\(\s*host\b
- id: py-urllib-chain
  desc: Python urllib fetch-chain pattern
  crit: suspicious
  conf: 0.8
  for:
  - python
  if:
    type: text
    regex: (?i)\burl\s*=\s*[\w.]*urlopen\(.{0,60}\)\.read\(\)[\s\S]{0,60}urlopen\(\s*url\b
  unless:
  - id: well-known/lib/ui/pygments::source-tree
- id: py-urllib-nested-chain
  desc: Nested urllib urlopen calls
  crit: suspicious
  conf: 0.85
  for:
  - python
  if:
    type: text
    regex: urlopen\(\s*[\w.]*urlopen\(.{0,60}\)\.read\(\)
  unless:
  - id: metadata/package/testing/presence/fixture::test-filename-pattern
- id: js-fetch-chain
  desc: Inline fetch text chained into fetch
  crit: suspicious
  conf: 0.8
  for:
  - javascript
  - typescript
  if:
    type: text
    regex: fetch\([^)]{1,50}\)\.then\([^)]{1,40}\.text\(\)\)\.then\(\w+\s*=>\s*fetch\(\w+
  not:
  - substr: fetch("config.json").text()
  unless:
  - id: metadata/package/documentation/security-exercise::assessment-playbook-examples
- id: js-axios-chain
  desc: Axios response data passed as URL
  crit: suspicious
  conf: 0.8
  for:
  - javascript
  - typescript
  if:
    type: text
    regex: axios\.get\([^)]{1,40}\)[\s\S]{0,40}\.data[\s\S]{0,30}axios\.(get|post)\(\w+\.data
  not:
  - regex: \.data\}\s*async\s+
  unless:
  - id: micro-behaviors/os/env/config/service::vite-api-url-reference
  - id: well-known/lib/development/vscode::vscode-extension-marker
  - id: metadata/package/runtime::vscode-extension
- id: js-axios-app-api-marker
  desc: Axios application API marker
  crit: baseline
  conf: 0.8
  for:
  - javascript
  - typescript
  if:
    type: text
    regex: (API_URL|apiUrl|baseURL).{0,120}axios\.
- id: shell-curl-to-shell
  desc: curl output passed to shell invocation
  crit: suspicious
  conf: 0.85
  for:
  - shell
  if:
    type: text
    regex: \$\(curl[^\r\n)]{1,120}\)[ \t]*\|[ \t]*(bash|sh)\b
  unless:
  - id: metadata/lang/source/syntax/key-value::security-rule-runtime-script-floating-url
  - id: well-known/app/system/brev-cli::source-tree-marker
- id: shell-curl-to-python
  desc: curl output piped to Python
  crit: suspicious
  conf: 0.85
  for:
  - shell
  if:
    type: text
    regex: \$\(curl[^\r\n)]{1,120}\)[ \t]*\|[ \t]*(python|perl|ruby)\b
- id: shell-curl-to-script-host
  desc: curl output piped to script host
  crit: suspicious
  conf: 0.85
  for:
  - shell
  if:
    type: text
    regex: \$\(curl[^\r\n)]{1,120}\)[ \t]*\|[ \t]*(php|powershell|cmd|nc)\b
- id: shell-backtick-curl-chain
  desc: backtick curl output reused
  crit: suspicious
  conf: 0.8
  for:
  - shell
  - go
  if:
    type: text
    regex: '`curl[^`\r\n]{1,120}`[ \t]*\|[ \t]*(bash|sh|python)\b'
  downgrade:
    any:
      - id: well-known/tool/detection/agent/skillspector::skillspector-regression-corpus
      - id: metadata/path/directory::test-directory-component
  unless:
  - id: metadata/lang/source/syntax/key-value::security-rule-runtime-script-floating-url
  - id: well-known/tool/detection/security-scanner-identity::ks-aur-test-or-crate-member
  - id: metadata/package/testing/harness/unit::go-test-source-file
- id: shell-wget-to-interpreter
  desc: wget result piped to interpreter
  crit: suspicious
  conf: 0.85
  for:
  - shell
  if:
    type: text
    regex: '`wget[^`\r\n]{1,80}`[ \t]*\|[ \t]*(bash|sh|python)\b'
  unless:
  - id: metadata/lang/source/syntax/key-value::security-rule-runtime-script-floating-url
- id: ruby-http-uri-from-response-body
  desc: Net::HTTP URI built from a response body
  crit: notable
  conf: 0.8
  for:
  - ruby
  if:
    type: text
    regex: Net::HTTP\.(get|post)\s*\(\s*URI\(\s*[a-z_]\w*\.(body|strip|chomp)
composite_rules:
- id: url-deaddrop-go
  desc: Go URL dead drop pattern
  crit: suspicious
  conf: 0.9
  mbc: C0002
  any:
  - id: go-http-get-readall-post
  - id: go-get-then-get
  unless:
  - id: metadata/package/testing/presence/harness::go-test-file
- id: url-deaddrop-python
  desc: Python URL dead drop pattern
  crit: suspicious
  conf: 0.9
  any:
  - id: py-requests-url-chain
  - id: py-requests-endpoint-chain
  - id: py-requests-host-chain
  - id: py-urllib-chain
  - id: py-urllib-nested-chain
  scope: leaf
  unless:
  - id: metadata/package/testing/presence/fixture::test-filename-pattern
- id: url-deaddrop-javascript
  desc: JavaScript URL dead drop pattern
  crit: suspicious
  conf: 0.9
  any:
  - id: js-fetch-chain
  - id: js-axios-chain
  unless:
  - id: metadata/path/directory::test-directory-component
- id: url-deaddrop-shell
  desc: Shell URL dead drop pattern
  crit: suspicious
  conf: 0.9
  any:
  - id: shell-curl-to-shell
  - id: shell-curl-to-python
  - id: shell-curl-to-script-host
  - id: shell-backtick-curl-chain
  - id: shell-wget-to-interpreter
  downgrade:
    any:
    - id: well-known/tool/detection/agent/skillspector::skillspector-regression-corpus
    - id: metadata/path/directory::test-directory-component
  unless:
  - id: metadata/lang/source/syntax/key-value::security-rule-runtime-script-floating-url
- id: ruby-http-chain
  desc: Ruby fetches a URL taken from an HTTP response body
  crit: suspicious
  conf: 0.8
  for:
  - ruby
  all:
  - id: micro-behaviors/communications/http/get::ruby-http-get-assign
  - id: ruby-http-uri-from-response-body
- id: url-deaddrop
  desc: URL dead drop / indirection pattern
  crit: suspicious
  conf: 0.95
  mbc: C0002
  any:
  - id: url-deaddrop-go
  - id: url-deaddrop-python
  - id: url-deaddrop-javascript
  - id: url-deaddrop-shell
  - id: ruby-http-chain
  unless:
  - id: metadata/lang/source/syntax/key-value::security-rule-runtime-script-floating-url
  - id: metadata/path/directory::test-directory-component
