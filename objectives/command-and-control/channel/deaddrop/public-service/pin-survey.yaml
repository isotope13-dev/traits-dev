# Public pin and survey URLs used as dead-drop resolvers. The path shapes
# belong to those services; pairing them with an NTFS stream config store
# is the C2-resolution technique, not a particular pin or survey id.
defaults:
  platforms: [windows]
  for: [powershell, javascript, csharp, go]
  attack: T1102.001
  mbc: B0030

traits:
  - id: pinterest-pin-url
    desc: Pinterest pin URL
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)https?://([a-z]{2}\.)?pinterest\.com/pin/[0-9]{6,}'

  - id: surveymonkey-response-url
    desc: SurveyMonkey response URL
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)https?://(www\.)?surveymonkey\.com/r/[A-Za-z0-9]{4,}'

composite_rules:
  - id: ads-stored-pin-survey-dead-drop
    desc: NTFS stream stores a pin or survey dead-drop URL
    crit: hostile
    conf: 0.99
    all:
      - id: micro-behaviors/fs/path/stream::ntfs-ads-path-source
    any:
      - id: pinterest-pin-url
      - id: surveymonkey-response-url
    near_lines: 40
