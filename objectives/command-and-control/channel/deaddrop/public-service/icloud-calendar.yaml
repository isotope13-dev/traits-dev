# Public iCloud CalDAV calendars abused as a dead-drop resolver. MacSync's
# downloader fetches a published iCloud calendar and feeds it to a shell,
# running the commands hidden after the event DESCRIPTION field. The durable
# technique is a published-calendar URL paired with a shell execution sink --
# any Apple-infra calendar subscription that then interprets its own body.
# The published-calendar path shape belongs to iCloud; the malicious signal is
# executing what it returns.
defaults:
  platforms: [unix]
  for: [shell, applescript, macho, python]
  attack: T1102.001
  mbc: B0030

traits:
  - id: icloud-published-calendar-url
    desc: Public iCloud CalDAV published calendar URL
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)https?://([a-z0-9-]+\.)?caldav\.icloud\.com/published/'

composite_rules:
  # Fetching a published iCloud calendar and running its body through a shell
  # interpreter or eval is the dead-drop-to-execution bridge; a benign calendar
  # subscription never pipes the feed into zsh -s or eval "$(...)".
  - id: icloud-calendar-shell-deaddrop
    desc: iCloud calendar dead-drop fed to a shell
    crit: hostile
    conf: 0.95
    attack: T1102.001,T1059.004,T1105
    scope: file
    all:
      - id: icloud-published-calendar-url
    any:
      - id: micro-behaviors/process/create/shell/pipeline::shell-stdin-interpreter-pipe
      - id: micro-behaviors/process/create/shell/pipeline::curl-pipe-shell-text
      - id: micro-behaviors/process/interpreter/eval/direct::shell-eval
      - id: objectives/anti-static/obfuscation/eval/interpreter::eval-decode-command-substitution
