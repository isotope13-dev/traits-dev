# Pinata pinning service as a command relay: the implant pins files through the
# authenticated API (host identifier, command results) and pulls operator text
# from the public gateway. Pinata and IPFS are ordinary developer services, so
# the API host alone is only a capability; the relay needs the API, the gateway
# fetch, and a polling loop in one script.
defaults:
  platforms: [windows, unix]
  for: [powershell]
  attack: T1102.002

composite_rules:
  - id: powershell-pinata-api-gateway-poll-loop
    desc: Loop pins via Pinata API and fetches from gateway
    crit: hostile
    conf: 0.88
    near_lines: 30
    all:
      - id: micro-behaviors/communications/http/services/ipfs::pinata-api-host
      - id: micro-behaviors/communications/http/authorization-header::bearer-header-from-variable
      - id: micro-behaviors/data/control-flow/loop/unconditional::powershell-unconditional-loop
    any:
      - id: micro-behaviors/communications/http/services/ipfs::ipfs-gateway--rx-11
      - id: micro-behaviors/communications/http/services/ipfs::ipfs-gateway--rx-15
