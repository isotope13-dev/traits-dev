defaults:
  platforms:
  - unix
  - windows
  for:
  - scripts
  attack: T1102,T1105,T1140
  mbc: B0030
traits:
- id: public-profile-url
  desc: Public user-profile URL embedded in source
  crit: notable
  conf: 0.92
  platforms:
  - android
  - unix
  - windows
  for:
  - java
  - kotlin
  - python
  - javascript
  - typescript
  - go
  - ruby
  - php
  if:
    type: literal
    regex: (?i)https?://[a-z0-9.-]{3,80}/(user|profile)/[a-z0-9_.-]{2,64}/(about|profile)
- id: published-google-document-url
  desc: Published Google document URL embedded in source
  crit: notable
  conf: 0.92
  for:
  - python
  - javascript
  - typescript
  - go
  - ruby
  - php
  - powershell
  - shell
  if:
    type: literal
    regex: (?i)https?://docs\.google\.com/document/d/e/[A-Za-z0-9_-]{8,}/pub([/?#]|$)
- id: profile-request-client
  desc: Source requests a remote profile
  crit: notable
  conf: 0.9
  platforms:
  - android
  - unix
  - windows
  for:
  - java
  - kotlin
  - python
  - javascript
  - typescript
  - go
  - ruby
  - php
  if:
    type: text
    regex: (?is)/(user|profile)/[^/]{1,64}/(about|profile).{0,120}requests?\.(get|post)\(
- id: profile-request-client-alt
  desc: Alternate client requests a remote profile
  crit: notable
  conf: 0.9
  platforms:
  - android
  - unix
  - windows
  for:
  - java
  - kotlin
  - python
  - javascript
  - typescript
  - go
  - ruby
  - php
  if:
    type: text
    regex: (?is)/(user|profile)/[^/]{1,64}/(about|profile).{0,120}(fetch\(|openConnection\()
- id: profile-request-client-network
  desc: Profile request via alternate HTTP client
  crit: notable
  conf: 0.9
  platforms:
  - android
  - unix
  - windows
  for:
  - java
  - kotlin
  - python
  - javascript
  - typescript
  - go
  - ruby
  - php
  if:
    type: text
    regex: (?is)/(user|profile)/[^/]{1,64}/(about|profile).{0,120}(urlopen\(|http\.Get\()
- id: profile-response-reader
  desc: Source reads a profile response body
  crit: notable
  conf: 0.9
  platforms:
  - android
  - unix
  - windows
  for:
  - java
  - kotlin
  - python
  - javascript
  - typescript
  - go
  - ruby
  - php
  if:
    type: text
    regex: (?is)/(user|profile)/[^/]{1,64}/(about|profile).{0,160}(readAllBytes\(|readLine\()
- id: profile-response-reader-alt
  desc: Alternate source response body reader
  crit: notable
  conf: 0.9
  platforms:
  - android
  - unix
  - windows
  for:
  - java
  - kotlin
  - python
  - javascript
  - typescript
  - go
  - ruby
  - php
  if:
    type: text
    regex: (?is)/(user|profile)/[^/]{1,64}/(about|profile).{0,160}(\.content\b|\.read\s*\()
- id: profile-response-reader-promise
  desc: Public profile path near a Promise callback
  crit: component
  conf: 0.9
  platforms:
  - android
  - unix
  - windows
  for:
  - java
  - kotlin
  - python
  - javascript
  - typescript
  - go
  - ruby
  - php
  if:
    type: text
    regex: (?is)/(user|profile)/[^/]{1,64}/(about|profile).{0,160}\.then\s*\(
- id: decoded-profile-endpoint-java
  desc: Java decrypts data before opening a socket
  crit: suspicious
  conf: 0.94
  platforms:
  - android
  - unix
  - windows
  for:
  - java
  - kotlin
  if:
    type: text
    regex: (?i)doFinal\s*\([^)]{0,80}\)[\s\S]{0,180}new\s+Socket\s*\(
- id: decoded-profile-endpoint-node
  desc: Node decrypts data before network connection
  crit: suspicious
  conf: 0.94
  platforms:
  - android
  - unix
  - windows
  for:
  - javascript
  - typescript
  if:
    type: text
    regex: (?i)(decrypt|decode)\s*\([^)]{0,80}\)[\s\S]{0,180}net\.connect\s*\(
composite_rules:
- id: public-service-packed-stage
  desc: Remote packed stage executes dynamically
  crit: hostile
  conf: 0.995
  attack: T1102,T1105,T1140,T1059
  all:
  - id: micro-behaviors/communications/http/client/response-body::remote-response-body-read
  - id: micro-behaviors/data/decompress/combined::base64-compressed-transform
  any:
  - id: micro-behaviors/process/interpreter/eval/direct::exec-builtin
  - id: micro-behaviors/process/interpreter/eval/direct::eval-builtin
  - id: micro-behaviors/process/create/subprocess::process-execution
  - id: micro-behaviors/process/create/shell/command-mode::python-os-system
  - id: micro-behaviors/process/create/system::system-process-call
  - id: micro-behaviors/process/create/exec::js-child-process
  near_lines: 20
- id: published-document-stage-execution
  desc: Published document delivers an encoded Python stage for execution
  crit: hostile
  conf: 0.995
  attack: T1102,T1105,T1140,T1059.006
  for:
  - python
  all:
  - id: published-google-document-url
  - id: micro-behaviors/communications/http/client/response-body::remote-response-body-read
  - id: micro-behaviors/data/decode/base64::b64decode-call
  - id: micro-behaviors/data/decompress/zlib::zlib-decompress-symbol
  - id: micro-behaviors/process/interpreter/eval/direct::exec-variable
  near_lines: 48
- id: google-document-xor-stage-execution
  desc: Google Docs text export delivers a Base64/XOR-decoded executable stage
  crit: hostile
  conf: 0.995
  attack: T1102.001,T1105,T1140,T1059
  for:
  - python
  - javascript
  - typescript
  - go
  - ruby
  - php
  - powershell
  - shell
  all:
  - id: micro-behaviors/communications/http/services/google::google-docs-text-export-url
  - id: micro-behaviors/communications/http/client/response-body::remote-response-body-read
  - id: micro-behaviors/data/decode/base64
  - id: micro-behaviors/data/encode/xor
  any:
  - id: micro-behaviors/process/interpreter/eval/direct::exec-variable
  - id: micro-behaviors/process/interpreter/eval/direct::js-eval-variable-argument
  - id: micro-behaviors/process/interpreter/eval/direct::powershell-iex-call
  - id: micro-behaviors/process/create/exec::js-child-process
  - id: micro-behaviors/process/create/system::system-process-call
  near_lines: 80
- id: public-service-packed-environment-exfil
  desc: Packed stage exfiltrates process environment
  crit: hostile
  conf: 0.99
  attack: T1102,T1041,T1552.007
  all:
  - id: public-service-packed-stage
  - id: micro-behaviors/communications/socket/send/
  any:
  - id: micro-behaviors/fs/proc/info/path::process-self-environ
  - id: micro-behaviors/fs/path/token::serviceaccount-token-path
  near_lines: 40
- id: profile-fetch-client
  desc: Source fetches a public profile
  crit: notable
  conf: 0.92
  platforms:
  - android
  - unix
  - windows
  for:
  - java
  - kotlin
  - python
  - javascript
  - typescript
  - go
  - ruby
  - php
  any:
  - id: profile-request-client
  - id: profile-request-client-alt
  - id: profile-request-client-network
- id: profile-response-body-reader
