# Public-service dead-drop staging technique.
# The service name is intentionally unconstrained: the durable technique is a
# remote response body followed by packed decoding and dynamic execution.
defaults:
  platforms: [unix, windows]
  for: [scripts]
  attack: "T1102,T1105,T1140"
  mbc: "B0030"

# Reading a response body is a neutral HTTP-client capability, so the atoms
# for it live at micro-behaviors/communications/http/client/response-body::
# (fetch-response-body-read, go-http-get-response-body-read, and the
# remote-response-body-read union).  They were defined locally here until they
# started handing a dead-drop C2 finding to every module that reads a fetch
# body; the staging intent comes from the composites below, which pair the
# body read with packed decoding and an execution sink.

traits:
  # base64-compressed-transform lives under
  # micro-behaviors/data/compress/library:: — Base64+decompress is a neutral
  # capability (archives, caches, protocol clients). Elevating that matcher to
  # suspicious under C2/deaddrop mislabeled Wallaby/Quokka server bundles and
  # other legitimate tooling. Staging intent comes from the hostile composites
  # below, which combine the micro-behavior with a remote body and an execution
  # sink.

  # A public user-profile URL is the durable dead-drop shape. The provider
  # and account are intentionally unconstrained so later campaigns can rotate
  # services and profiles without losing the technique signal.
  - id: public-profile-url
    desc: Public user-profile URL embedded in source
    crit: notable
    conf: 0.92
    platforms: [android, unix, windows]
    for: [java, kotlin, python, javascript, typescript, go, ruby, php]
    if:
      type: literal
      regex: '(?i)https?://[a-z0-9.-]{3,80}/(user|profile)/[a-z0-9_.-]{2,64}/(about|profile)'

  # Google Docs' published form is a public document body, not an API endpoint
  # tied to a particular campaign. Match the provider's publish path while
  # leaving the document id unconstrained so rotated dead drops remain visible.
  - id: published-google-document-url
    desc: Published Google document URL embedded in source
    crit: notable
    conf: 0.92
    for: [python, javascript, typescript, go, ruby, php, powershell, shell]
    if:
      type: literal
      regex: '(?i)https?://docs\.google\.com/document/d/e/[A-Za-z0-9_-]{8,}/pub([/?#]|$)'

  - id: profile-request-client
    desc: Source requests a remote profile
    crit: notable
    conf: 0.9
    platforms: [android, unix, windows]
    for: [java, kotlin, python, javascript, typescript, go, ruby, php]
    if:
      type: text
      regex: '(?is)/(user|profile)/[^/]{1,64}/(about|profile).{0,120}requests?\.(get|post)\('

  - id: profile-request-client-alt
    desc: Alternate client requests a remote profile
    crit: notable
    conf: 0.9
    platforms: [android, unix, windows]
    for: [java, kotlin, python, javascript, typescript, go, ruby, php]
    if:
      type: text
      regex: '(?is)/(user|profile)/[^/]{1,64}/(about|profile).{0,120}(fetch\(|openConnection\()'

  - id: profile-request-client-network
    desc: Profile request via alternate HTTP client
    crit: notable
    conf: 0.9
    platforms: [android, unix, windows]
    for: [java, kotlin, python, javascript, typescript, go, ruby, php]
    if:
      type: text
      regex: '(?is)/(user|profile)/[^/]{1,64}/(about|profile).{0,120}(urlopen\(|http\.Get\()'

  - id: profile-response-reader
    desc: Source reads a profile response body
    crit: notable
    conf: 0.9
    platforms: [android, unix, windows]
    for: [java, kotlin, python, javascript, typescript, go, ruby, php]
    if:
      type: text
      regex: '(?is)/(user|profile)/[^/]{1,64}/(about|profile).{0,160}(readAllBytes\(|readLine\()'

  - id: profile-response-reader-alt
    desc: Alternate source response body reader
    crit: notable
    conf: 0.9
    platforms: [android, unix, windows]
    for: [java, kotlin, python, javascript, typescript, go, ruby, php]
    if:
      type: text
      regex: '(?is)/(user|profile)/[^/]{1,64}/(about|profile).{0,160}(\.content\b|\.read\s*\()'

  - id: profile-response-reader-promise
    desc: Promise reads a public profile response
    crit: notable
    conf: 0.9
    platforms: [android, unix, windows]
    for: [java, kotlin, python, javascript, typescript, go, ruby, php]
    if:
      type: text
      regex: '(?is)/(user|profile)/[^/]{1,64}/(about|profile).{0,160}\.then\s*\('

  - id: decoded-profile-endpoint-java
    desc: Java decrypts data before opening a socket
    crit: suspicious
    conf: 0.94
    platforms: [android, unix, windows]
    for: [java, kotlin]
    if:
      type: text
      regex: '(?i)doFinal\s*\([^)]{0,80}\)[\s\S]{0,180}new\s+Socket\s*\('

  - id: decoded-profile-endpoint-node
    desc: Node decrypts data before network connection
    crit: suspicious
    conf: 0.94
    platforms: [android, unix, windows]
    for: [javascript, typescript]
    if:
      type: text
      regex: '(?i)(decrypt|decode)\s*\([^)]{0,80}\)[\s\S]{0,180}net\.connect\s*\('

composite_rules:
  - id: decoded-profile-endpoint-python
    desc: Python decrypt method and socket connection used together
    crit: suspicious
    conf: 0.94
    platforms: [android, unix, windows]
    for: [python]
    all:
      - id: micro-behaviors/crypto/symmetric/decrypt::python-decrypt-method-call
      - id: micro-behaviors/communications/socket/connect::socket-create-connection-call
    near_lines: 30

  - id: public-service-packed-stage
    desc: Remote packed stage executes dynamically
    crit: hostile
    conf: 0.995
    attack: "T1102,T1105,T1140,T1059"
    all:
      - id: micro-behaviors/communications/http/client/response-body::remote-response-body-read
      - id: micro-behaviors/data/compress/library::base64-compressed-transform
    any:
      - id: micro-behaviors/process/interpreter/python::exec-builtin
      - id: micro-behaviors/process/interpreter/python::eval-builtin
      - id: micro-behaviors/process/create/subprocess::process-execution
      - id: micro-behaviors/process/create/system::python-os-system
      - id: micro-behaviors/process/create/system::ruby-system
      - id: micro-behaviors/process/create/exec::js-child-process
    near_lines: 20

  - id: published-document-stage-execution
    desc: Published document delivers an encoded Python stage for execution
    crit: hostile
    conf: 0.995
    attack: "T1102,T1105,T1140,T1059.006"
    for: [python]
    all:
      - id: published-google-document-url
      - id: micro-behaviors/communications/http/client/response-body::remote-response-body-read
      - id: micro-behaviors/data/decode/base64::b64decode-call
      - id: micro-behaviors/data/compress/library::zlib-decompress-symbol
      - id: micro-behaviors/process/interpreter/python::exec-variable
    near_lines: 48

  # Google Docs' text-export endpoint is also used by ordinary automation, so
  # the URL remains a neutral service capability. It becomes a dead-drop C2
  # technique only when the fetched body is Base64-decoded, XOR-transformed,
  # and handed to a dynamic execution sink. Directory references keep this
  # composite applicable to equivalent implementations in other languages.
  - id: google-document-xor-stage-execution
    desc: Google Docs text export delivers a Base64/XOR-decoded executable stage
    crit: hostile
    conf: 0.995
    attack: "T1102.001,T1105,T1140,T1059"
    for: [python, javascript, typescript, go, ruby, php, powershell, shell]
    all:
      - id: micro-behaviors/communications/http/services/google::google-docs-text-export-url
      - id: micro-behaviors/communications/http/client/response-body::remote-response-body-read
      - id: micro-behaviors/data/decode/base64
      - id: micro-behaviors/data/encode/xor
    any:
      - id: micro-behaviors/process/interpreter/python::exec-variable
      - id: micro-behaviors/process/interpreter/eval::js-eval-variable-argument
      - id: micro-behaviors/process/interpreter/eval::powershell-iex-call
      - id: micro-behaviors/process/create/exec::js-child-process
      - id: micro-behaviors/process/create/system::ruby-system
    near_lines: 80

  - id: public-service-packed-environment-exfil
    desc: Packed stage exfiltrates process environment
    crit: hostile
    conf: 0.99
    attack: "T1102,T1041,T1552.007"
    all:
      - id: public-service-packed-stage
      - id: micro-behaviors/communications/socket/send/
    any:
      - id: micro-behaviors/fs/proc/info/path::process-self-environ
      - id: micro-behaviors/os/container/runtime::serviceaccount-files
    near_lines: 40

  - id: profile-fetch-client
    desc: Source fetches a public profile
    crit: notable
    conf: 0.92
    platforms: [android, unix, windows]
    for: [java, kotlin, python, javascript, typescript, go, ruby, php]
    any:
      - id: profile-request-client
      - id: profile-request-client-alt
      - id: profile-request-client-network

  - id: profile-response-body-reader
    desc: Source reads a fetched public profile body
    crit: notable
    conf: 0.92
    platforms: [android, unix, windows]
    for: [java, kotlin, python, javascript, typescript, go, ruby, php]
    any:
      - id: profile-response-reader
      - id: profile-response-reader-alt
      - id: profile-response-reader-promise

  - id: public-profile-response-body
    desc: Reads content returned by a public profile URL
    crit: suspicious
    conf: 0.95
    platforms: [android, unix, windows]
    for: [java, kotlin, python, javascript, typescript, go, ruby, php]
    all:
      - id: public-profile-url
      - id: profile-fetch-client
      - id: profile-response-body-reader
    near_lines: 40

  - id: profile-url-safe-decoding
    desc: Decodes data retrieved from a public profile
    crit: suspicious
    conf: 0.95
    platforms: [android, unix, windows]
    for: [java, kotlin, python, javascript, typescript, go, ruby, php]
    all:
      - id: public-profile-response-body
      - id: micro-behaviors/data/decode/base64
    near_lines: 80

  - id: decoded-endpoint-connection
    desc: Uses a decrypted value to create a network connection
    crit: suspicious
    conf: 0.96
    platforms: [android, unix, windows]
    for: [java, kotlin, python, javascript, typescript, go, ruby, php]
    any:
      - id: decoded-profile-endpoint-java
      - id: decoded-profile-endpoint-python
      - id: decoded-profile-endpoint-node

  - id: public-profile-encrypted-c2-resolver
    desc: Public-profile dead drop resolves encrypted C2 before connection
    crit: hostile
    conf: 0.995
    platforms: [android, unix, windows]
    for: [java, kotlin, python, javascript, typescript, go, ruby, php]
    attack: "T1102.001,T1573.001,T1105"
    mbc: B0030,C0027
    all:
      - id: public-profile-response-body
      - id: profile-url-safe-decoding
      - id: micro-behaviors/crypto/symmetric/des::des-cbc-api
      - id: decoded-endpoint-connection
    near_lines: 120
