# Dead-drop resolver that keeps its pointer in a public anonymous key-value
# store. The page fetches a stored value by key and decrypts it client-side
# with an embedded AES key, so the real destination never appears in the
# published artifact and can be rotated by rewriting the stored value.
defaults:
  platforms: [unix, windows]
  for: [html, javascript]
  attack: T1102.001,T1140
  mbc: B0030

composite_rules:
  - id: kv-store-aes-decrypted-pointer
    desc: Public KV store value is fetched and AES-decrypted client-side
    crit: hostile
    conf: 0.92
    near_lines: 120
    all:
      - id: micro-behaviors/communications/http/services/file-hosting::keyval-api-host
      - id: micro-behaviors/crypto/provider/webcrypto::webcrypto-decrypt-source-call
      - id: micro-behaviors/crypto/symmetric/aes/mode::aes-ctr-algorithm-marker
