# Compact ELF bots announce their implant with a "Bot running on %s"
# status line rather than a family name.
defaults:
  platforms: [unix]
  for: [elf]
  attack: T1071
traits:
  - id: trading-bot-market-status
    desc: Market-maker bot status message
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)(no bot running on|bot running on (the )?market)'
  - id: bot-running-on-banner
    desc: Bot running-on status banner
    crit: suspicious
    conf: 0.96
    if:
      type: text
      regex: '(?i)Bot running on'
    unless:
      # Exchange market-maker bots report their market status with the
      # same words ("no bot running on market"); that is trading
      # telemetry, not a drone announcing itself.
      - id: trading-bot-market-status
composite_rules:
  - id: static-bot-running-banner
    desc: Static ELF with a bot-running banner
    crit: hostile
    conf: 0.95
    all:
      - id: bot-running-on-banner
      - id: "metadata/binary/linking/records::elf-dynamic-linker-metadata-absent"
  - id: bot-running-socket-banner
    desc: Bot-running banner with a socket import
    crit: hostile
    conf: 0.93
    all:
      - id: bot-running-on-banner
      - id: micro-behaviors/communications/socket/create::posix-socket-import

