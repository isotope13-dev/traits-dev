# Small unsigned PEs that link MFC CAsyncSocket are socket backdoors, not
# GUI apps that happen to mention Winsock.
defaults:
  platforms: [windows]
  for: [pe, dll]
  attack: T1071.001
  crit: hostile
  conf: 0.93

composite_rules:
  - id: mfc-async-csocket
    desc: PE links MFC CAsyncSocket and CSocket
    all:
      - id: micro-behaviors/communications/socket/mfc::mfc-casyncsocket-class
      - id: micro-behaviors/communications/socket/mfc::mfc-csocket-class
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/installer/family/

  - id: mfc-async-wsock32
    desc: MFC CAsyncSocket PE also loads WSOCK32
    all:
      - id: micro-behaviors/communications/socket/mfc::mfc-casyncsocket-class
      - id: micro-behaviors/communications/socket/init::wsock32-dll-marker
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/installer/family/

  - id: mfc-async-socket-init
    desc: MFC CAsyncSocket with AfxSocketInit
    all:
      - id: micro-behaviors/communications/socket/mfc::mfc-casyncsocket-class
      - id: micro-behaviors/dylib/library/legacy::afx-socket-init
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/installer/family/

  - id: mfc42u-wsock32
    desc: Unicode MFC42 PE also loads WSOCK32
    scope: file
    all:
      - id: micro-behaviors/communications/socket/mfc::mfc42u-dll
      - id: micro-behaviors/communications/socket/init::wsock32-dll-marker
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/installer/family/
      # The stock MFC42u runtime includes the MFC socket classes and WSOCK32.
      # Its version resource plus normal Microsoft import surface identify the
      # runtime; those two library markers alone do not establish a backdoor.
      - id: objectives/anti-static/obfuscation/binary-metrics/shape::legitimate-microsoft-versioned-pe

  - id: mfc42u-small-wsock32
    desc: Small Unicode MFC42 PE loads WSOCK32
    all:
      - id: micro-behaviors/communications/socket/mfc::mfc42u-dll
      - id: micro-behaviors/communications/socket/init::wsock32-dll-marker
      - id: metadata/binary/layout/size::small-pe
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/installer/family/
