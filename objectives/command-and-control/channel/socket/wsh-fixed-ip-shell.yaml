# A script opens a raw TCP socket to a hard-coded public IPv4 address and
# holds an interactive shell's streams: the operator's host is fixed in the
# file and the session carries shell traffic rather than an application
# protocol.
defaults:
  platforms: [windows]
  for: [vbs, html]
  attack: T1095,T1059.003

composite_rules:
  - id: wsh-fixed-public-ip-shell-session
    desc: Links fixed public IP socket and shell
    crit: hostile
    conf: 0.95
    all:
      - id: micro-behaviors/communications/socket/connect/endpoint::wsh-socket-connect-ipv4-literal
      - id: micro-behaviors/process/stdio/configure::wsh-exec-interactive-shell-streams
