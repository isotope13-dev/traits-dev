# Packed static ARM IoT bots often keep socket/connect syscall numbers in
# the literal pool while stripping almost all strings.
defaults:
  platforms: [linux]
  for: [elf]
  arch: [arm]
  attack: T1071
composite_rules:
  - id: static-arm-lowstring-socket
    desc: Static ARM ELF with socket syscalls
    crit: hostile
    conf: 0.93
    all:
      - id: metadata/binary/linking/static::static-linked-heuristic
      - id: micro-behaviors/communications/socket/syscall::arm-socket-syscall-number
      - id: micro-behaviors/communications/socket/syscall::arm-connect-syscall-number
      - id: objectives/anti-static/obfuscation/imports::very-low-strings
  - id: static-arm-lowstring-socket-only
    desc: Static ARM ELF with a socket syscall
    crit: hostile
    conf: 0.9
    all:
      - id: metadata/binary/linking/static::static-linked-heuristic
      - id: micro-behaviors/communications/socket/syscall::arm-socket-syscall-number
      - id: objectives/anti-static/obfuscation/imports::very-low-strings
  - id: static-arm-lowstring-connect
    desc: Static ARM ELF with a connect syscall
    crit: hostile
    conf: 0.9
    all:
      - id: metadata/binary/linking/static::static-linked-heuristic
      - id: micro-behaviors/communications/socket/syscall::arm-connect-syscall-number
      - id: objectives/anti-static/obfuscation/imports::very-low-strings
