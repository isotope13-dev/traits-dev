# Python packages that expose a bind/listen/accept channel plus public-IP
# discovery (ipify) and outbound connect — a reusable reverse/bind C2 kit
# often smuggled inside "utility" PyPI modules.
defaults:
  platforms: [windows, unix]
  for: [python]
  attack: T1090,T1105,T1571
  mbc: B0030

composite_rules:
  - id: python-bind-public-ip-channel
    desc: Bind-all socket channel with public IP connect
    crit: hostile
    conf: 0.97
    all:
      - id: micro-behaviors/communications/socket/bind/address::bind-all-interfaces
      - id: micro-behaviors/communications/socket/connect::socket-accept-call
      - id: micro-behaviors/communications/http/ip-discovery::ipify-api
      - id: objectives/command-and-control/backdoor/shell/socket::python-connect-call
    any:
      - id: micro-behaviors/communications/socket/listen::python-server-socket-listen-method
      - id: objectives/command-and-control/backdoor/shell/socket::python-listen-call
    # Keep public-IP discovery, bind/listen, and accept/connect in one local
    # flow; a utility module may contain each capability independently.
    near_lines: 120
