# The registration literals describe a hostname/OS/architecture TCP shell
# agent. The shell-tasking leg prevents ordinary Go management clients from
# being classified from AGENT or linux strings alone. This is a co-occurrence
# detector, not a claim that a static flow query proved the hostname transfer.
defaults:
  platforms: [linux]
  for: [elf]
composite_rules:
  - id: go-shell-agent-host-registration
    desc: TCP shell agent with host registration markers
    crit: suspicious
    conf: 0.93
    all:
      - id: objectives/command-and-control/backdoor/tasking/socket::go-line-agent-shell-tasking
      - id: micro-behaviors/os/sysinfo/hostname::go-compiled-hostname-reference
      - id: micro-behaviors/data/format/host-profile::agent-architecture-registration-literals
