# The framing capability is neutral; this rule adds the execution context.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  attack: T1573.001
  mbc: B0031
composite_rules:
  - id: encrypted-envelope-command-channel
    desc: Encrypted HTTP envelope carries executed commands
    crit: hostile
    conf: 0.95
    attack: T1573.001,T1071.001,T1059.007
    all:
      - id: micro-behaviors/crypto/cipher::aes-gcm-http-envelope-references
      - id: micro-behaviors/crypto/symmetric/aes/runtime-library::gcm-iv-ciphertext-tag-envelope
      - id: micro-behaviors/crypto/decrypt::auth-tag-sliced-from-buffer
    any:
      - id: micro-behaviors/metaprogramming/generation::js-new-function-constructor
      - id: micro-behaviors/process/create/exec::js-execfile-call
