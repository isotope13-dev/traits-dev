defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
composite_rules:
  - id: node-doh-ecdh-gcm-c2-channel
    desc: DoH-resolved C2 channel with ECDH and AES-GCM
    crit: hostile
    conf: 0.97
    attack: T1573.001,T1071.004
    all:
      - id: micro-behaviors/crypto/provider/library::ecdh-create
      - id: metadata/lang/source/literal/string/cryptography::aes-256-gcm-dash
      - id: micro-behaviors/communications/dns/doh::doh-json-content-type
      - id: micro-behaviors/communications/tls/verify/disable::reject-unauthorized-false
