# Encrypted C2 channels that transport the per-message symmetric key inline:
# a short header of sequence/size fields concatenated with the key and nonce
# that decrypt the attached body (AtlasRAT's 56-byte ChaCha20 header), sent
# over a socket channel. Shipping the key with every packet is vanishingly
# rare in legitimate protocols and marks a custom RAT wire format even when
# the family constants rotate.
defaults:
  platforms: [windows, unix]
  for: [python]
  attack: T1573
composite_rules:
  - id: chacha-key-transport-c2-channel
    desc: ChaCha20 C2 channel with inline key transport
    crit: hostile
    conf: 0.95
    all:
      - id: micro-behaviors/crypto/symmetric/stream/chacha::chacha20-api-operation
      - id: micro-behaviors/communications/socket/framing::sequence-size-header-pack
      - id: micro-behaviors/communications/socket/framing::key-nonce-header-append
      - id: micro-behaviors/communications/socket/connect::socket-create-connection-call
      - id: micro-behaviors/communications/socket/receive::socket-recv-call
