defaults:
  platforms: [windows, unix]
  for: [python]
  attack: T1573
traits:
  # Message-type names only count as C2 framing tokens when they appear as
  # wire literals (quoted in the framed message). Matched as bare identifiers
  # they collided with ordinary method names — pypsexec's OutputPipe.get_output
  # drains a local stdout queue and has nothing to do with agent tasking.
  - id: encrypted-c2-message-types--file-data
    desc: Agent message-type literal (file_data)
    crit: notable
    conf: 0.92
    if:
      type: literal
      kind: string
      word: file_data
  - id: encrypted-c2-message-types--output
    desc: Agent message-type literal (get_output)
    crit: notable
    conf: 0.92
    if:
      type: literal
      kind: string
      word: get_output
composite_rules:
  - id: encrypted-c2-message-types
    desc: Agent message-type tokens
    crit: component
    conf: 0.92
    any:
      - id: objectives/command-and-control/backdoor/rat/modular::module-command-handler--module-cmd
      - id: encrypted-c2-message-types--file-data
      - id: encrypted-c2-message-types--output
  - id: encrypted-json-c2-framing
    desc: Potential encrypted JSON command channel
    crit: suspicious
    conf: 0.9
    all:
      - id: micro-behaviors/communications/socket/framing::big-endian-length-prefix-json
      - id: encrypted-c2-message-types
      - id: micro-behaviors/communications/socket/connect::socket-connect-call
      - id: micro-behaviors/communications/socket/receive::socket-recv-call
    any:
      - id: micro-behaviors/communications/socket/framing::aesgcm-length-prefixed-socket
