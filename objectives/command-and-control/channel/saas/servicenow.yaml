# Command and control hosted in a SaaS tenant: ServiceNow tasking channel.
#
# SnowFall (MDSec, "When it Snows it Pours", 2026) turns a ServiceNow
# scheduled job into a fileless C2 implant: every few minutes the job GETs
# a Glide script from a redirector, evals the response body, and POSTs the
# output back. Nothing touches an endpoint, and all execution lives in the
# SaaS layer. Any periodic tenant job that pulls a script over HTTP and
# evaluates it — regardless of the operator tooling behind it — is a C2
# channel by construction.
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript, json, text, data]
  attack: T1059.007

composite_rules:
  - id: servicenow-restmessage-eval-execution
    desc: Script fetched via ServiceNow REST message is eval'd
    crit: hostile
    conf: 0.95
    all:
      - id: micro-behaviors/communications/http/client/service::servicenow-restmessagev2-request
      - id: micro-behaviors/process/interpreter/eval/direct::js-eval-variable-argument
    near_bytes: 1500

  - id: servicenow-scheduled-job-c2
    desc: Periodic ServiceNow job pulls and evals remote script
    crit: hostile
    conf: 0.96
    attack: T1059.007,T1053
    all:
      - id: objectives/persistence/system/saas::servicenow-scheduled-job-create
      - id: micro-behaviors/communications/http/client/service::servicenow-restmessagev2-request
      - id: micro-behaviors/process/interpreter/eval/direct::js-eval-variable-argument
    near_bytes: 2500
