# Loader check-in / beacon URI shapes seen in multi-stage Windows loaders
# that disguise C2 as mundane API paths (reverse-spelled verbs, opaque
# tokens, versioned "facade" routes).
defaults:
  platforms: [windows]
  for: [c, cpp, pe, dll]
  crit: notable
  conf: 0.93
  attack: T1071.001
  mbc: B0030

traits:
  # "check" spelled backwards — distinctive check-in path class.
  - id: reverse-check-api-path
    desc: Reverse-spelled check API path
    crit: suspicious
    conf: 0.97
    if:
      type: text
      regex: '(?i)/api/kcehc\b'

  # Long consonant-heavy opaque path used as a beacon sink.
  - id: opaque-lowercase-api-path
    desc: Long lowercase opaque API path
    crit: suspicious
    conf: 0.96
    if:
      type: text
      regex: '/api/[a-z]{24,48}\b'
    unless:
    - id: well-known/lib/electron::electron-chromium-runtime-strong

  - id: facade-api-path
    desc: Versioned facade API path
    crit: suspicious
    conf: 0.94
    if:
      type: text
      regex: '(?i)/api/v2/facade\b'

  - id: init-api-v2-path
    desc: Versioned init API path
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)/api/v2/init\b'

  # Delivery-tier pair: register then login (short paths in HttpOpenRequest).
  - id: http-reg-path
    desc: HTTP register route path
    crit: component
    conf: 0.88
    if:
      type: text
      regex: '(?i)HttpOpenRequest[AW]?\s*\([^)]{0,120}"/reg"'

  - id: http-login-path
    desc: HTTP login route path
    crit: component
    conf: 0.88
    if:
      type: text
      regex: '(?i)HttpOpenRequest[AW]?\s*\([^)]{0,120}"/login"'
