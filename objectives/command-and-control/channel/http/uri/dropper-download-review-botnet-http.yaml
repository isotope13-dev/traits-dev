defaults:
  platforms: [linux]
  for: [elf]
  attack: T1105
  mbc: C0002


composite_rules:
  - id: tiny-elf-botnet-http-clues
    desc: Tiny ELF HTTP GET with botnet clues
    crit: hostile
    conf: 0.97
    size_max: 8192
    all:
      - id: micro-behaviors/communications/http/request/route::get-botnet-path
      - id: micro-behaviors/communications/http/get::get
      - id: micro-behaviors/data/parse/keywords::botnet-term-reference
      - id: metadata/binary/layout/size::small-elf-binary
    any:
      - id: "metadata/binary/linking/dynamic::elf-needed-libs-zero"
      - id: "metadata/binary/symbols/table::full-symbol-table-absent-or-empty"
