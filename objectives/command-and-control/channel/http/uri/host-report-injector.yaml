defaults:
  platforms: [windows]
  for: [pe, dll]
  attack: T1071.001
  mbc: C0002
composite_rules:
  # The report profile alone is telemetry. Require the native write/inject
  # surface and a protected-system-process target; an embedded PE alone
  # may be an ordinary watchdog library and supplies no attack admission.
  - id: host-report-system-process-injector
    desc: Host reporting with Winlogon injection APIs
    crit: hostile
    conf: 0.97
    attack: "T1071.001,T1055"
    all:
      - id: micro-behaviors/communications/http/request/report::wininet-host-profile-api-profile
      - id: micro-behaviors/process/inject/runtime/call::remote-thread-resource-api-profile
      - id: micro-behaviors/process/inject/runtime/call::write-process-memory-dup
      - id: micro-behaviors/process/info/name::winlogon-executable-reference
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/installer/family/
      - id: well-known/tool/reverse-engineering/

  - id: doh-host-report-injector
    desc: Host-report injector and AliDNS resolver profile
    crit: hostile
    conf: 0.98
    all:
      - id: host-report-system-process-injector
      - id: micro-behaviors/communications/dns/doh::doh-alidns-resolve-format
