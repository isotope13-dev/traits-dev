defaults:
  platforms: [windows]
  for: [pe, dll]
  attack: T1071.001
  mbc: C0002
composite_rules:
  # A carrier that both phones home with this bot-status protocol and ships a
  # full CreateRemoteThread/VirtualAllocEx/OpenProcess API set around an
  # embedded PE resource is staging a second-stage injection, not just
  # reporting telemetry - the two legs together are the loader-and-inject
  # pattern used by Amadey/SmokeLoader-style downloaders.
  - id: host-profile-report-with-embedded-injector
    desc: Host-report protocol with embedded PE injector
    crit: hostile
    conf: 0.97
    attack: "T1071.001,T1055"
    mbc: C0002,B0030
    all:
      - id: micro-behaviors/communications/http/request/report::wininet-host-profile-api-profile
      - id: micro-behaviors/process/inject/runtime/call::remote-thread-resource-api-profile
      - id: metadata/binary/layout/embedded::pe-embedded
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/installer/family/
      - id: well-known/tool/reverse-engineering/

  - id: doh-host-report-injector
    desc: Host-report injector and AliDNS resolver profile
    crit: hostile
    conf: 0.98
    all:
      - id: host-profile-report-with-embedded-injector
      - id: micro-behaviors/communications/dns/doh::doh-alidns-resolve-format
