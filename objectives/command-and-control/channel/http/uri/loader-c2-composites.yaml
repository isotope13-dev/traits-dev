# Composites for multi-stage loader HTTP C2: reverse-check / facade paths,
# custom Base64 bodies, and WinINet transport.
defaults:
  platforms: [windows]
  for: [c, cpp, pe, dll]
  attack: T1071.001,T1132.001
  mbc: B0030

composite_rules:
  - id: reverse-check-wininet-c2
    desc: Reverse-check path over WinINet
    crit: hostile
    conf: 0.98
    all:
      - id: objectives/command-and-control/channel/http/uri::reverse-check-api-path
      - id: micro-behaviors/communications/http/get::wininet-http-client-src
    near_bytes: 8192

  - id: facade-custom-b64-c2
    desc: Facade path with shuffled Base64
    crit: hostile
    conf: 0.98
    all:
      - id: objectives/command-and-control/channel/http/uri::facade-api-path
      - id: objectives/anti-static/obfuscation/encoding/base64::mid-equals-b64-alphabet
    any:
      - id: micro-behaviors/communications/http/get::wininet-http-client-src
      - id: objectives/command-and-control/channel/http/uri::reverse-check-api-path
    near_bytes: 8192

  - id: dual-ua-reg-login-delivery
    desc: Dual User-Agent reg/login delivery
    crit: hostile
    conf: 0.97
    all:
      - id: objectives/command-and-control/channel/http/uri::http-reg-path
      - id: objectives/command-and-control/channel/http/uri::http-login-path
      - id: objectives/command-and-control/channel/http/message::ua-wordpress-agent
      - id: objectives/command-and-control/channel/http/message::ua-fingerprint-token
    near_bytes: 8192

  - id: cloudfront-id-bot-header
    desc: CloudFront id used as bot header
    crit: suspicious
    conf: 0.94
    all:
      - id: objectives/command-and-control/channel/http/message::header-x-amz-cf-id
    any:
      - id: objectives/command-and-control/channel/http/message::ua-wordpress-agent
      - id: objectives/command-and-control/channel/http/uri::http-reg-path
    near_bytes: 4096
