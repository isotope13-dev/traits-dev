defaults:
  for: [pe]
  platforms: [windows]
composite_rules:
  - id: native-winhttp-analytics-cookie-image-loader
    desc: WinHTTP image mapper with user/analytics cookies
    crit: hostile
    conf: 0.95
    attack: T1071.001,T1620
    all:
      - id: micro-behaviors/process/deploy/image-map::x64-private-section-image-entry-call
      - id: micro-behaviors/communications/http/header::wide-analytics-user-cookie-fields
      - id: micro-behaviors/communications/http/client/winhttp::winhttp-read-data
      - id: micro-behaviors/communications/http/client/winhttp::winhttp-send-request
