defaults:
  for: [shell]
  platforms: [macos]
composite_rules:
  # A finite paste/stager status report establishes no recurring beacon.
  - id: hidden-stager-paste-status-post
    desc: Hidden stager with paste-status HTTP POST
    crit: hostile
    conf: 0.99
    attack: T1071.001
    all:
      - id: objectives/evasion/anti-av/platform/gatekeeper::encoded-stager-clears-attributes
      - id: micro-behaviors/communications/http/request/verb::post-command-line-option
      - id: micro-behaviors/communications/http/header/custom::build-id-header
      - id: micro-behaviors/process/daemonize/detach::background-ampersand-hidden
    any:
      - id: micro-behaviors/communications/url/http-encoded::printf-pasted-event-query-format
      - id: micro-behaviors/communications/url/http-encoded::printf-pasted-event-query-percent-b
