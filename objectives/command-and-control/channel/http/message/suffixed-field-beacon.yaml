# PlugX USB-worm reporting describes a distinctive HTTP check-in shape:
# four coordinated custom fields whose names end in -se, -st, -si and -sn,
# plus an eight-hexadecimal URI.  The prefix is intentionally variable so
# variants that rename the header family remain covered.
defaults:
  platforms: [unix, windows]
  # The source group spans the supported source languages without enumerating
  # a brittle per-language allowlist.
  for: [source]
  attack: T1071.001
  mbc: B0030

traits:
  - id: custom-se-http-field
    desc: Custom HTTP header with se suffix
    crit: component
    conf: 0.9
    if:
      type: text
      regex: '(?im)\b[A-Za-z][A-Za-z0-9_-]{0,15}-se\s*:\s*[0-9]+\b'

  - id: custom-st-http-field
    desc: Custom HTTP header with st suffix
    crit: component
    conf: 0.9
    if:
      type: text
      regex: '(?im)\b[A-Za-z][A-Za-z0-9_-]{0,15}-st\s*:\s*[0-9]+\b'

  - id: custom-si-http-field
    desc: Custom HTTP header with si suffix
    crit: component
    conf: 0.9
    if:
      type: text
      regex: '(?im)\b[A-Za-z][A-Za-z0-9_-]{0,15}-si\s*:\s*[0-9]+\b'

  - id: custom-sn-http-field
    desc: Custom HTTP header with sn suffix
    crit: component
    conf: 0.9
    if:
      type: text
      regex: '(?im)\b[A-Za-z][A-Za-z0-9_-]{0,15}-sn\s*:\s*[0-9]+\b'

  - id: eight-hex-post-uri
    desc: HTTP POST to eight-hexadecimal URI
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: '(?i)\bPOST\s+/[0-9a-f]{8}\s+HTTP/1\.[01]\b'

  - id: zero-length-http-body
    desc: HTTP request with zero content length
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?im)\bContent-Length\s*:\s*0\b'

  - id: sixteen-byte-frame-buffer
    desc: Fixed sixteen-byte frame buffer
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)\b(unsigned\s+char|uint8_t|byte|bytes?)\s+[A-Za-z_]\w*\s*\[\s*16\s*\]'

composite_rules:
  - id: partial-suffixed-field-beacon
    desc: HTTP beacon with three coordinated suffix fields
    crit: suspicious
    conf: 0.97
    near_bytes: 512
    all:
      - id: eight-hex-post-uri
    any:
      - id: custom-se-http-field
      - id: custom-st-http-field
      - id: custom-si-http-field
      - id: custom-sn-http-field
    needs: 3

  - id: encrypted-suffixed-field-beacon
    desc: Encrypted framed beacon with coordinated suffix fields
    crit: suspicious
    conf: 0.98
    near_bytes: 512
    all:
      - id: partial-suffixed-field-beacon
      - id: sixteen-byte-frame-buffer
    any:
      - id: micro-behaviors/crypto/symmetric/stream::source-rc4-implementation
      - id: micro-behaviors/crypto/symmetric/stream::python-rc4-like-stream-cipher
      - id: micro-behaviors/crypto/symmetric/stream::rc4-bytecode

  - id: suffixed-field-http-command-channel
    desc: Four-field HTTP command beacon
    crit: hostile
    conf: 0.99
    near_bytes: 512
    all:
      - id: custom-se-http-field
      - id: custom-st-http-field
      - id: custom-si-http-field
      - id: custom-sn-http-field
      - id: eight-hex-post-uri
      - id: zero-length-http-body

  - id: encrypted-suffixed-field-command-channel
    desc: Encrypted fixed-frame HTTP command channel
    crit: hostile
    conf: 0.995
    attack: T1071.001,T1573.001
    near_bytes: 2048
    all:
      - id: suffixed-field-http-command-channel
      - id: sixteen-byte-frame-buffer
    any:
      - id: micro-behaviors/crypto/symmetric/stream::source-rc4-implementation
      - id: micro-behaviors/crypto/symmetric/stream::python-rc4-like-stream-cipher
      - id: micro-behaviors/crypto/symmetric/stream::rc4-bytecode

  - id: removable-media-suffixed-field-worm
    desc: Removable-media worm with suffixed-field C2
    crit: hostile
    conf: 0.995
    attack: T1071.001,T1091
    all:
      - id: suffixed-field-http-command-channel
      - id: objectives/lateral-movement/usb-worm/autorun::native-removable-drive-enum
      - id: micro-behaviors/fs/file/write/direct::write-file-source
      - id: micro-behaviors/fs/file/attributes::set-file-attributes-source
