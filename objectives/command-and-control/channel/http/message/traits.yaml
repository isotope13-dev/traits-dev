defaults:
  platforms:
    - linux
    - macos
    - windows
  for: [binaries]
  attack: T1071.001
  crit: suspicious
traits:
  # http-content-type moved to micro-behaviors/data/format/mime::content-type-header
  - id: http-beacon-counter
    desc: HTTP request with counter/sequence parameter
    crit: suspicious
    conf: 0.88
    if:
      type: text
      regex: (GET|POST) %s\?[a-z]{1,4}=%d HTTP/1\.
  - id: shifted-http-get-template
    desc: Shifted HTTP GET template
    crit: notable
    conf: 0.96
    platforms: [windows]
    for: [pe, dll]
    if:
      type: text
      exact: FFS &r ISSQ.0/0
  - id: shifted-http-accept-header
    desc: Shifted HTTP Accept header
    crit: notable
    conf: 0.94
    platforms: [windows]
    for: [pe, dll]
    if:
      type: text
      exact: "@bddou9 +.)"
  - id: fixed-193-ip-format
    desc: Fixed-octet IP format string
    crit: suspicious
    conf: 0.92
    platforms: [windows]
    for: [pe, dll]
    if:
      type: text
      exact: "%u.193.%d.%d"
  - id: yii-site-gcd-route
    desc: Yii site GCD command route
    crit: notable
    conf: 0.95
    platforms: [windows]
    for: [pe, dll]
    if:
      type: text
      exact: /?r=site/GCD
  - id: yii-site-gce-route
    desc: Yii site GCE command route
    crit: notable
    conf: 0.95
    platforms: [windows]
    for: [pe, dll]
    if:
      type: text
      exact: /?r=site/GCE
composite_rules:
  - id: shifted-http-winsock-c2
    desc: Shift-encoded HTTP Winsock C2
    crit: suspicious
    conf: 0.96
    platforms: [windows]
    for: [pe, dll]
    all:
      - id: shifted-http-get-template
      - id: shifted-http-accept-header
      - id: fixed-193-ip-format
      - id: micro-behaviors/communications/socket/create::socket-api-ordinal
      - id: micro-behaviors/communications/socket/connect::connect-api-ordinal
      - id: micro-behaviors/communications/socket/init::winsock-startup-ordinal
    unless:
      - id: metadata/signed/platform/
  - id: raw-winsock-yii-command-channel
    desc: Raw Winsock HTTP command channel
    crit: hostile
    conf: 0.97
    platforms: [windows]
    for: [pe, dll]
    all:
      - id: yii-site-gcd-route
      - id: yii-site-gce-route
      - id: micro-behaviors/communications/http/message::split-http10-get-template
      - id: micro-behaviors/communications/ip/literal::external-ipv4-binary
    any:
      - id: micro-behaviors/communications/socket/connect::winsock-client-api-name-set
      - id: micro-behaviors/fs/path/library::ws2-32-dll-marker
    unless:
      - id: metadata/signed/platform/

  # A pinned HTTP counter request is not enough to call a client hostile. Pair
  # it with the reusable native DDoS-mode vocabulary and ARM IoT profile so
  # future stripped botnets with a different endpoint still expose their C2
  # tasking without misclassifying ordinary HTTP load-test tools.
  - id: native-iot-ddos-http-command-channel
    for: [elf]
    desc: HTTP C2 channel carrying IoT DDoS tasking
    crit: hostile
    conf: 0.99
    attack: T1071.001,T1498.001
    mbc: B0030
    all:
      - id: objectives/impact/dos/attack/flood::native-ddos-mode-vocabulary
      - id: http-beacon-counter
      - id: metadata/arch/arm::arm
      - id: micro-behaviors/communications/ip/literal::external-ipv4-shaped-text-binary
