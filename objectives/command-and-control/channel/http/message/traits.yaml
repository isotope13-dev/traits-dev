defaults:
  platforms:
    - linux
    - macos
    - windows
  for: [binaries]
  attack: T1071.001
  crit: suspicious
traits:
  # http-content-type moved to micro-behaviors/communications/http/header/content-type::content-type-header
  - id: node-http-example-request-line
    desc: Node HTTP example request line comment
    crit: notable
    conf: 0.7
    if:
      type: text
      regex: '(firstLine in the case of request is: ''GET /index\.html HTTP/1\.1)'
  - id: generic-index-request-line-raw
    desc: Generic index example request in raw data
    crit: notable
    conf: 0.7
    if:
      type: text
      regex: '(GET /index\.html HTTP/1\.1)'
  # uWebSockets/Bun ships this explanatory comment in every compiled binary; the
  # request line it quotes is documentation, not a request the program sends.
  - id: fetch-header-example-request-line
    desc: Fetch header example request line comment
    crit: notable
    conf: 0.7
    if:
      type: text
      regex: '(must send HTTP headers \(e\.g\., "POST / HTTP/1\.1"\))'
  # A request line whose CRLF is written out as backslash-r backslash-n text
  # is source code, not wire bytes: doc comments, tutorial strings and test
  # literals show the escapes, while a request actually put on the wire (or
  # built for one) carries real 0x0d 0x0a or a %s format template. Go
  # binaries are the recurring case -- the net and crypto/tls package docs
  # (fmt.Fprintf(conn, "GET / HTTP/1.0\r\n\r\n")) ship in every build that
  # keeps them.
  - id: escaped-crlf-request-line
    desc: Request line with escaped CRLF text
    crit: notable
    conf: 0.85
    if:
      type: text
      regex: '\b(GET|POST)\s+\S{1,140}\s+HTTP/1\.[01]\\r\\n'
  - id: http-beacon-counter
    desc: HTTP request with counter/sequence parameter
    crit: suspicious
    conf: 0.88
    if:
      type: text
      regex: (GET|POST) %s\?[a-z]{1,4}=%d HTTP/1\.
  - id: shifted-http-get-template
    desc: Shifted HTTP GET template
    crit: notable
    conf: 0.96
    platforms: [windows]
    for: [pe, dll]
    if:
      type: text
      exact: FFS &r ISSQ.0/0
  - id: shifted-http-accept-header
    desc: Shifted HTTP Accept header
    crit: notable
    conf: 0.94
    platforms: [windows]
    for: [pe, dll]
    if:
      type: text
      exact: "@bddou9 +.)"
  - id: fixed-193-ip-format
    desc: Fixed-octet IP format string
    crit: suspicious
    conf: 0.92
    platforms: [windows]
    for: [pe, dll]
    if:
      type: text
      exact: "%u.193.%d.%d"
  - id: yii-site-gcd-route
    desc: Yii site GCD command route
    crit: notable
    conf: 0.95
    platforms: [windows]
    for: [pe, dll]
    if:
      type: text
      exact: /?r=site/GCD
  - id: yii-site-gce-route
    desc: Yii site GCE command route
    crit: notable
    conf: 0.95
    platforms: [windows]
    for: [pe, dll]
    if:
      type: text
      exact: /?r=site/GCE
composite_rules:
  - id: http-protocol
    desc: HTTP or HTTPS protocol marker
    crit: notable
    conf: 0.6
    any:
      - id: micro-behaviors/communications/http/message::http-prefix
      - id: micro-behaviors/communications/http/message::https-prefix
    unless:
      - id: well-known/tool/detection/malcontent::malcontent-defensive-scanner-context
  - id: http-documentation-request-line
    desc: HTTP request line found in documentation text
    crit: component
    conf: 0.7
    any:
      - id: generic-index-request-line-raw
      - id: node-http-example-request-line
      - id: fetch-header-example-request-line
      - id: escaped-crlf-request-line
  - id: hardcoded-request
    desc: Hardcoded HTTP request in binary
    crit: suspicious
    conf: 0.7
    for: [pe, elf, macho]
    all:
      - id: http-protocol
    any:
      - id: micro-behaviors/communications/http/get::get
      - id: micro-behaviors/communications/http/post::post-request-line
    unless:
      - id: http-documentation-request-line
      - id: hardcoded-request-known-benign-context
      - id: well-known/app/storage/syncback/
      - id: well-known/app/ai/coding-agent/factory-droid/
    downgrade:
      any:
        - id: micro-behaviors/communications/ip/resolve::resolve-getaddrinfo
        - id: micro-behaviors/communications/dns/lookup::in-addr-arpa
  # Recognized software that embeds literal HTTP request lines: media
  # streaming stacks, the Electron runtime, an IDE agent's debugging guide and
  # a defensive scanner's signature data.
  - id: hardcoded-request-known-benign-context
    desc: Recognized software embedding HTTP request lines
    crit: exception
    conf: 0.9
    for: [pe, elf, macho]
    any:
      - id: well-known/app/media/vlc::windows-nsis-bundle
      - id: well-known/lib/media/videolan::videolan-codec-lib
      - id: well-known/lib/runtime/scripted/electron::electron-windows-runtime-pdb
      - id: well-known/tool/development/vscode-extension/marscode::marscode-agent-debug-guide-websocket-context
      - id: well-known/tool/detection/malcontent::malcontent-defensive-scanner-context
      - id: well-known/lib/runtime/scripted/bun-runtime/
  - id: custom-client
    desc: Custom HTTP client implementation
    crit: notable
    conf: 0.65
    all:
      - id: http-protocol
      - id: micro-behaviors/communications/http/message::http-header-field-delimiter
    any:
      - id: micro-behaviors/communications/http/user-agent::user-agent-header
      - id: micro-behaviors/communications/http/header/content-type::content-type-header
    unless:
      - id: micro-behaviors/communications/http/header/content-type::ocsp-request-content-type
    downgrade:
      any:
        - id: micro-behaviors/communications/ip/resolve::resolve-getaddrinfo
        - id: micro-behaviors/communications/dns/lookup::in-addr-arpa
        - id: micro-behaviors/dylib/library/family::libcurl-ref
  - id: shifted-http-winsock-c2
    desc: Shift-encoded HTTP Winsock C2
    crit: suspicious
    conf: 0.96
    platforms: [windows]
    for: [pe, dll]
    all:
      - id: shifted-http-get-template
      - id: shifted-http-accept-header
      - id: fixed-193-ip-format
      - id: micro-behaviors/communications/socket/init::socket-api-ordinal
      - id: micro-behaviors/communications/socket/init::connect-api-ordinal
      - id: micro-behaviors/communications/socket/init::winsock-startup-ordinal
    unless:
      - id: metadata/signed/platform/
  - id: raw-winsock-yii-command-channel
    desc: Raw Winsock HTTP command channel
    crit: hostile
    conf: 0.97
    platforms: [windows]
    for: [pe, dll]
    all:
      - id: yii-site-gcd-route
      - id: yii-site-gce-route
      - id: micro-behaviors/communications/http/message::split-http10-get-template
      - id: micro-behaviors/communications/ip/literal::external-ipv4-binary
    any:
      - id: micro-behaviors/communications/socket/init::winsock-runtime-client-api-table
      - id: micro-behaviors/communications/socket/init::ws2-32-dll-marker
    unless:
      - id: metadata/signed/platform/

  # A pinned HTTP counter request is not enough to call a client hostile. Pair
  # it with the reusable native DDoS-mode vocabulary and ARM IoT profile so
  # future stripped botnets with a different endpoint still expose their C2
  # tasking without misclassifying ordinary HTTP load-test tools.
  - id: native-iot-ddos-http-command-channel
    for: [elf]
    desc: HTTP C2 channel carrying IoT DDoS tasking
    crit: hostile
    conf: 0.99
    attack: T1071.001,T1498.001
    mbc: B0030
    all:
      - id: objectives/impact/dos/attack/flood::native-ddos-mode-vocabulary
      - id: http-beacon-counter
      - id: metadata/arch/iot::arm
      - id: micro-behaviors/communications/ip/literal::external-ipv4-host-literal-binary
