# HTTP Cookie / ETag response headers used as a covert C2 tasking channel.
# CookiETagRAT-style implants hide commands in cache-validation headers
# (Cookie and ETag) instead of the response body. Pairing both header query
# constants with process creation is the durable structural signal.
defaults:
  platforms: [windows]
  for: [c, cpp, pe, dll]
  attack: T1071.001,T1059
  mbc: B0030

composite_rules:
  - id: cookie-and-etag-header-pair
    desc: Cookie and ETag header names together
    crit: suspicious
    conf: 0.9
    all:
      - id: micro-behaviors/communications/http/header/cache::winhttp-query-cookie-constant
      - id: micro-behaviors/communications/http/header/cache::winhttp-query-etag-constant
    any:
      - id: micro-behaviors/communications/http/header/cache::etag-header-line
      - id: micro-behaviors/communications/http/header/cache::if-none-match-cache-header
    near_bytes: 2048

  - id: cookie-etag-header-c2-channel
    desc: Cookie/ETag header C2 with process launch
    crit: hostile
    conf: 0.98
    for: [python, c, cpp, pe, dll]
    platforms: [unix, windows]
    all:
      - id: micro-behaviors/communications/http/header/cache::cookie-etag-response-header-clues
    any:
      - id: metadata/binary/symbols/name/process::create-process-a
      - id: micro-behaviors/process/create/exec::child-process-creation-evidence
      - id: metadata/binary/symbols/name/process::create-process-w
      - id: micro-behaviors/process/create/subprocess/configure::go-exec-command-call
      - id: micro-behaviors/process/create/subprocess/launch::process-execution
    near_bytes: 8192

  - id: cookie-etag-encrypted-tasking-channel
    desc: Encrypted Cookie/ETag response-header tasking channel
    crit: hostile
    conf: 0.99
    for: [pe, python]
    platforms: [unix, windows]
    all:
      - id: micro-behaviors/communications/http/header/cache::cookie-etag-response-header-clues
      - id: micro-behaviors/data/decode/base64/unspecified::base64-decoding
    any:
      - id: micro-behaviors/crypto/symmetric/stream/chacha::chacha20-api-operation
      - id: micro-behaviors/crypto/symmetric/stream/chacha::chacha20-cipher-call
    near_lines: 40

  - id: cookie-etag-cache-validation-c2
    desc: WinHTTP Cookie and ETag cache-validation references
    crit: notable
    conf: 0.97
    attack: T1071.001
    all:
      - id: micro-behaviors/communications/http/header/cache::winhttp-cookie-etag-header-queries
      - id: micro-behaviors/communications/http/header/cache::if-none-match-cache-header
    any:
      - id: micro-behaviors/communications/http/client/winhttp::winhttp-query-headers
      - id: micro-behaviors/communications/http/client/winhttp::winhttp-request-flow
      - id: micro-behaviors/communications/http/header/cache::etag-header-line
    near_bytes: 8192
