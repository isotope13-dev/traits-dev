# Native backdoors can build an HTTP upload around a server-issued session
# value.  The POST diagnostic template is unusual but not independently
# hostile; coupling it to the upload header and its retry-window state machine
# identifies a persistent session-bound C2 uploader.
defaults:
  platforms: [macos]
  for: [macho]
  attack: T1071.001,T1041

traits:
  - id: session-multipart-post-template
    desc: Session-bound multipart POST template
    crit: suspicious
    conf: 0.98
    if:
      type: text
      exact: POST boundary=%s %s?session=%s

  - id: failed-attempts-state-label
    desc: Failed-attempt counter state label
    crit: component
    conf: 0.9
    if:
      type: text
      exact: FailedAttempts

  - id: end-start-waiting-state-label
    desc: Retry-window end state label
    crit: component
    conf: 0.9
    if:
      type: text
      exact: EndStartWaiting

composite_rules:
  - id: session-multipart-c2-uploader
    desc: Session-bound HTTP C2 file uploader
    crit: hostile
    conf: 0.99
    all:
      - id: session-multipart-post-template
      - id: failed-attempts-state-label
      - id: end-start-waiting-state-label
      - id: micro-behaviors/communications/http/headers::form-data-header
