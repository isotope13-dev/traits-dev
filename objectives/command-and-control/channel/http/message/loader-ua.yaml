# Spoofed or mid-session-switched User-Agent strings used by loaders to blend
# C2 traffic with CMS/fingerprinting noise.
defaults:
  platforms: [windows]
  for: [c, cpp, pe, dll]
  crit: notable
  conf: 0.92
  attack: T1071.001

traits:
  - id: ua-wordpress-agent
    desc: WordPressAgent InternetOpen User-Agent
    crit: suspicious
    conf: 0.96
    if:
      type: text
      regex: '(?i)InternetOpen[AW]?\s*\(\s*["'']WordPressAgent["'']'

  - id: ua-fingerprint-token
    desc: FingerPrint InternetOpen User-Agent
    crit: suspicious
    conf: 0.95
    if:
      type: text
      regex: '(?i)InternetOpen[AW]?\s*\(\s*["'']FingerPrint["'']'

  # Real Chrome UAs use Mozilla/5.0; Mozilla/6.0 is a loader tell.
  - id: ua-mozilla-six
    desc: Nonstandard Mozilla/6.0 User-Agent
    crit: suspicious
    conf: 0.94
    if:
      type: text
      regex: '(?i)\bMozilla/6\.0\b'

  - id: header-x-amz-cf-id
    desc: x-amz-cf-id request header
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)\bx-amz-cf-id\b'
