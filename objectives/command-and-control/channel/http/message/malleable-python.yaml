# Python generators for Cobalt Strike-style malleable HTTP GET profiles:
# metadata transforms, Cookie-header stashing, and random URI/file-type
# camouflage. Distinct from compiled beacon profiles in well-known/.
defaults:
  platforms: [windows, linux]
  for: [python]
  attack: T1071.001,T1027
  mbc: B0030

traits:
  - id: malleable-cookie-header-transform
    desc: Malleable profile stores metadata in Cookie
    crit: notable
    conf: 0.94
    if:
      type: text
      substr: 'header "Cookie"'
  - id: malleable-metadata-base64
    desc: Malleable metadata transform uses base64
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: "metadata\\.append\\(\\s*['\"]base64['\"]"
  - id: malleable-prepend-transform
    desc: Malleable prepend transform for a cookie
    crit: notable
    conf: 0.9
    if:
      type: text
      substr: 'prepend "'

composite_rules:
  - id: python-malleable-cookie-c2
    desc: Malleable C2 stashes metadata in Cookie
    crit: hostile
    conf: 0.97
    all:
      - id: malleable-cookie-header-transform
      - id: malleable-metadata-base64
    unless:
      # Unit tests assert generated launchers contain these profile strings;
      # quoted expectations are not a deployed C2 channel.
      - id: metadata/package/testing/presence/harness::pytest-module
  - id: python-malleable-prepend-cookie
    desc: Malleable prepend plus Cookie header
    crit: hostile
    conf: 0.96
    all:
      - id: malleable-cookie-header-transform
      - id: malleable-prepend-transform
    unless:
      # Same pytest carve-out: quoted profile expectations, not a live channel.
      - id: metadata/package/testing/presence/harness::pytest-module
  - id: python-malleable-prepend-base64
    desc: Malleable prepend plus base64 metadata
    crit: hostile
    conf: 0.95
    all:
      - id: malleable-metadata-base64
      - id: malleable-prepend-transform
    unless:
      # Same pytest carve-out: quoted profile expectations, not a live channel.
      - id: metadata/package/testing/presence/harness::pytest-module
