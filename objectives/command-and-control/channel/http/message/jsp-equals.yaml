# Object.equals is an abnormal entry point for a server payload. Requiring
# request access, session state, cipher output, response writes and removal of
# the JSP buffer distinguishes this encrypted control protocol from an ordinary
# servlet using encryption. Names, cipher choice and session-key names vary.
defaults:
  for: [class]
  platforms: [unix, windows]
  attack: T1505.003,T1573

traits:
  - id: jsp-newinstance-equals-context-dispatch
    desc: JSP invokes newInstance().equals on context
    crit: suspicious
    conf: 0.97
    for: [jsp]
    attack: T1505.003
    if:
      type: text
      regex: '\.newInstance\s*\(\s*\)\s*\.\s*equals\s*\(\s*(pageContext|request|session|response)'

composite_rules:
  - id: jsp-classloader-equals-pagecontext-shell
    desc: JSP reads request and calls equals on a new instance with servlet context
    crit: hostile
    conf: 0.99
    for: [jsp]
    attack: T1505.003,T1071.001
    all:
      - id: jsp-newinstance-equals-context-dispatch
      - id: micro-behaviors/communications/http/server/request::jsp-request-reader-source
      - id: micro-behaviors/process/interpreter/runtime/jvm::java-classloader

  - id: jvm-encrypted-jsp-equals-channel
    desc: JSP equals payload returns encrypted control replies
    crit: hostile
    conf: 0.97
    all:
      - id: metadata/binary/symbols/name/function::jvm-equals-method
      - id: micro-behaviors/communications/http/server/request::jvm-jsp-request-accessor
      - id: micro-behaviors/communications/http/server/request::jvm-session-attribute-read
      - id: micro-behaviors/crypto/cipher/unspecified::cipher-finalization-references
      - id: micro-behaviors/communications/http/server/response::jvm-servlet-output-write
      - id: micro-behaviors/communications/http/server/response::jvm-jsp-writer-clear
    any:
      - id: metadata/import/jvm::java-runtime-exec-bytecode-reference
      - id: micro-behaviors/process/create/subprocess/launch::java-processbuilder-start-bytecode
      - id: metadata/import/jvm::jvm-fileoutputstream-bytecode
      - id: micro-behaviors/process/interpreter/runtime/jvm::java-defineclass-name-constant
    # A recognized Echo payload returns supplied content; its copied RunCMD
    # helper is never invoked. The exception stops applying when it is called
    # or another active payload API is present. Keep dormant APIs as notable.
    unless:
      - id: well-known/tool/offensive/behinder::echo-response-helper-context
