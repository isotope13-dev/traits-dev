defaults:
  platforms:
  - unix
  - windows
  for:
  - csharp
  - pe
  - dll
composite_rules:
- id: dotnet-xor-http-control-channel
  desc: XOR decoding with beacon and exfil calls
  crit: hostile
  conf: 0.97
  for:
  - csharp
  all:
  - id: metadata/lang/source/naming/variable::dotnet-xor-key-constant-reference
  - id: micro-behaviors/data/bitwise/xor-forms/indexed::dotnet-named-key-byte-xor-loop
  - id: metadata/lang/source/naming/action/network::dotnet-beacon-exfil-url-name-text
  - id: micro-behaviors/communications/http/client/managed::dotnet-beacon-exfil-named-http-calls
  any:
  - id: objectives/anti-analysis/self-terminate::dotnet-debugger-exit
  - id: micro-behaviors/process/config/launch::dotnet-process-start-info
  - id: micro-behaviors/process/fd/stdio::dotnet-stdout-redirection-reference
  attack: T1071.001,T1027
