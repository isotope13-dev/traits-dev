defaults:
  platforms: [unix, windows]
  for: [class, java_class]
  attack: "T1071.001,T1105,T1573.002"
  mbc: B0030

composite_rules:
  # Raw TLS/HTTP transport is already hostile when it disables certificate
  # validation. Requiring the separate HTTP-fetch correlation makes this a
  # channel rule rather than a verdict on custom TLS code alone.
  - id: java-raw-tls-http-stager-channel
    desc: Java raw TLS HTTP stager channel
    # Wrapper over raw-socket TLS fetch — keep suspicious so PureDecoder's
    # hostile transport is counted once while still flagging the channel.
    crit: suspicious
    conf: 0.98
    all:
      - id: objectives/evasion/security-bypass/tls::java-raw-socket-fetch-without-cert-validation
      - id: objectives/evasion/security-bypass/tls::java-anonymous-trustmanager-http-fetch
