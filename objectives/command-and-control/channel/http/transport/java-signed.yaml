defaults:
  platforms: [unix, windows]
  for: [class, java_class]
  attack: T1071.001,T1573.002
  mbc: B0030

composite_rules:
  - id: java-rsa-verified-custom-http-response
    desc: Java accepts an RSA-signed response from custom HTTP transport
    crit: hostile
    conf: 0.99
    attack: T1071.001,T1102,T1573.002
    mbc: B0030,B0032
    all:
      - id: objectives/command-and-control/infrastructure/config::java-fieldworker-extension46-call
      - id: micro-behaviors/data/decode/hex::java-long-hex-constant-table
      - id: micro-behaviors/data/decode/base64::java-base64-decoding-bytecode
      - id: micro-behaviors/crypto/asymmetric/signature::java-rsa-public-verify

  # NOTE: "HttpClient POST + java.security.Signature verify" is deliberately NOT
  # a rule here. That trio is the ordinary shape of a licensing check, a signed
  # update manifest or an RS256 webhook validator, so on its own it says nothing
  # about intent. Response authentication only becomes an attacker signal once
  # the endpoints it talks to are hidden -- that rule lives with the other
  # config-resolution rules in
  # objectives/command-and-control/infrastructure/config::java-int-array-signed-config-fetch.

  - id: java-obfuscated-http-post-channel
    desc: HTTP POST channel uses int-array string decrypt
    crit: hostile
    conf: 0.97
    attack: T1071.001,T1027
    # Subsumed by the session-exfil and signed-config composites that add the
    # credential or RSA-verify intent legs; keep this for the bare channel.
    unless:
      - id: objectives/exfiltration/stealer/credential/token::minecraft-session-obfuscated-http-post
      - id: objectives/exfiltration/stealer/credential/token::minecraft-session-http-post-exfil
      - id: objectives/command-and-control/infrastructure/config::java-int-array-signed-config-fetch
    all:
      - id: micro-behaviors/communications/http/lib/httpclient::java-httpclient-send
      - id: micro-behaviors/communications/http/lib/httpclient::java-http-request-post-bytecode
      - id: objectives/anti-static/obfuscation/string/encoding::java-int-array-string-decrypt-descriptor
      - id: micro-behaviors/data/decode/base64::java-base64-decoding-bytecode
