defaults:
  platforms: [windows]
  for: [pe]
  attack: T1071.001,T1105
composite_rules:
  - id: native-direct-ip-http-channel-with-hidden-powershell-fetch
    desc: Native PE with raw-IP HTTP channel, hidden PowerShell
    crit: hostile
    conf: 0.85
    all:
      - id: objectives/command-and-control/channel/http/transport::direct-ip-http-channel
      - id: micro-behaviors/communications/http/url/external-ip::url-external-ip-port-binary
      - id: micro-behaviors/process/create/hidden::powershell-windowstyle-hidden
      - id: micro-behaviors/communications/http/download/cli::iwr-outfile-download
