# Disassembly ties the profile fields to an HTTP response dispatcher and
# reports, and the supplied profile to taskkill/relaunch operations.
# The exact files and mutations are server-selected; no credential claim.
defaults:
  for: [pe]
  platforms: [windows]
  arch: [x86-64]
composite_rules:
  - id: concealed-browser-profile-control
    desc: Concealed HTTP browser profile control channel
    crit: hostile
    conf: 0.97
    attack: T1071.001
    all:
      - id: micro-behaviors/data/codec::x64-progressive-add-byte-decoder
      - id: micro-behaviors/data/codec::x64-feedback-xor-rotate-buffer
      - id: micro-behaviors/data/serialize/schema-object::compiled-app-profile-file-fields
      - id: micro-behaviors/data/serialize/schema-object::compiled-profile-control-offset-fields
      - id: micro-behaviors/communications/http/lib/crate::reqwest-crate
      - id: micro-behaviors/process/terminate/command::compiled-taskkill-pid-force-arguments
      - id: micro-behaviors/process/create/flags::chromium-user-data-native-bytes
