defaults:
  platforms: [windows]
  for: [pe]

composite_rules:
  # A self-image upload requires more than generic form-post strings: the
  # sample reads its own module, writes a mutated executable clone, and sends
  # that clone as a file to a fixed remote upload endpoint.
  - id: self-mutating-pe-clone-http-submission
    desc: Self-mutating PE clone submitted to remote server
    crit: hostile
    conf: 0.97
    attack: T1071.001
    all:
      - id: micro-behaviors/data/string/mutate::unique-mutation-slot-marker-rdata
      - id: micro-behaviors/fs/read/file/handle::pe-module-path-crt-file-io
      - id: micro-behaviors/fs/write/file/handle::write--fwrite
      - id: micro-behaviors/communications/http/client/library::curl-easy-perform-diagnostic-prefix
      - id: micro-behaviors/communications/http/form::multipart-file-array-field
      - id: micro-behaviors/communications/http/url/domain::wecan-hasthe-upload-endpoint
