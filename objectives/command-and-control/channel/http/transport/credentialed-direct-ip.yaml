# A direct-IP HTTP channel (transport::direct-ip-http-channel) is only
# `suspicious` on its own — a bare `any: needs 1` composite, filtered from
# default scan output as low-value. Pairing it with evidence that the same
# client attaches an access/API token to its requests turns "some code
# talks straight to an IP" into "the credentialed API client also has an
# undeclared channel to a raw IP" — the shape of a backdoored CLI that
# authenticates against its real vendor domain while quietly shipping a
# second, off-domain sink for the same session's credentials or payloads.
# Seen in eprolo-cli@1.0.99 (Aikido-flagged): the tool's real API lives at
# wixtest.eprolo.com and is guarded by an apiKey/accessToken credential
# file, but `addOrder()` posts arbitrary caller-supplied JSON to a
# hardcoded `http://<raw-ip>:3000/addInfo` through the same credentialed
# request helper that attaches the stored apiKey/sign to every call.
defaults:
  platforms: [unix, windows]
  for: [binaries, scripts, source]
  attack: T1071.001,T1041

composite_rules:
  - id: credentialed-client-has-direct-ip-channel
    desc: Credentialed API client also has direct-IP channel
    crit: hostile
    conf: 0.9
    near_lines: 200
    all:
      - id: objectives/command-and-control/channel/http/transport::direct-ip-http-channel
    any:
      - id: micro-behaviors/communications/http/token-auth::access-token-field-source
      - id: micro-behaviors/communications/http/auth::access-token-field-reference
      - id: micro-behaviors/communications/http/auth::access-token-camel-field
    unless:
      - id: metadata/package/testing/presence/fixture::test-filename-pattern
