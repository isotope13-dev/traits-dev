# Auto-open macro drops a batch file that runs a hidden headless browser
# against webhook.site, using the browser as an HTTP fetch/post relay.
defaults:
  platforms: [windows]
  for: [oledoc, ooxml, scripts]
  attack: T1102.002,T1071.001
composite_rules:
  - id: vba-macro-hidden-browser-webhook-relay
    desc: Auto-open macro drops hidden-browser webhook.site relay
    crit: hostile
    conf: 0.95
    all:
      - id: micro-behaviors/process/create/macro/autoexec::auto-open-sub-decl
      - id: micro-behaviors/ui/window/control::chromium-far-offscreen-position
      - id: micro-behaviors/ui/window/control::chromium-tiny-window-size
      - id: micro-behaviors/communications/url/host/oob::webhook-site-reference
