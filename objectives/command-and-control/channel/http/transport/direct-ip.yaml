# Direct-to-IP communication bypasses hostname/DNS policy enforcement. Static
# analysis cannot prove whether a DNS query occurred at runtime, so these
# traits describe the hardcoded transport endpoint rather than claiming a
# runtime "no-DNS" event.
defaults:
  platforms: [unix, windows]
  for: [binaries, scripts, source]
  attack: T1071.001
  mbc: C0002

composite_rules:
  # A direct-IP managed download with a browser-shaped header and Reactor
  # metadata is a loader transport profile, not merely endpoint configuration.
  - id: dotnet-direct-ip-browser-loader-channel
    desc: Managed loader channel uses direct IP and browser User-Agent
    crit: hostile
    conf: 0.97
    attack: "T1071.001,T1105"
    for: [pe]
    all:
      - id: metadata/binary/framework::dotnet-assembly
      - id: objectives/anti-static/obfuscation/obfuscator/managed::reactor-module-guid
      - id: micro-behaviors/communications/http/client/managed::httpclient-bytearray-download
      - id: micro-behaviors/communications/http/client/managed::custom-user-agent-headers
      - id: micro-behaviors/communications/http/user-agent::browser-mozilla-5-0
      - id: micro-behaviors/communications/http/url/external-ip::url-external-ip-binary

  - id: direct-ip-http-channel
    desc: Direct-IP HTTP communication channel
    crit: suspicious
    conf: 0.93
    any:
      - id: micro-behaviors/communications/ip/direct::external-ipv4-http-endpoint
      - id: micro-behaviors/communications/ip/literal::http-ip-url

  - id: direct-ip-websocket-channel
    desc: Direct-IP WebSocket communication channel
    crit: suspicious
    conf: 0.95
    all:
      - id: micro-behaviors/communications/ip/direct::external-ipv4-websocket-url
    any:
      - id: micro-behaviors/communications/websocket/library::python-websocket-client
      - id: micro-behaviors/communications/websocket/library::go-websocket-library
      - id: micro-behaviors/communications/http/websocket::websocket-constructor-call
      - id: micro-behaviors/communications/http/websocket::websocket-http-upgrade-headers
