# A native program that posts URL-encoded forms through WinINet to a literal
# external IPv4 address, enumerates network adapters and the service
# control manager first, is a host-recon beacon: the adapter and service
# lists are the data it reports. A legitimate updater names a host, not a
# bare address, and does not list services.
defaults:
  platforms: [windows]
  for: [pe]
  attack: T1071.001,T1016,T1007
composite_rules:
  - id: wininet-form-post-to-ip-with-adapter-and-service-recon
    desc: WinINet form POST to IP with adapter and service recon
    crit: hostile
    conf: 0.85
    # The form POST, the address, and the adapter and service queries are
    # one beacon. A bundle can import WinINet in one image and carry an
    # address list in another.
    near_bytes: 16384
    all:
      - id: micro-behaviors/communications/http/post::native-post-method-token
      - id: micro-behaviors/communications/http/header/content-type::form-urlencoded-header-pe
      - id: micro-behaviors/communications/ip/literal::external-ipv4-shaped-text-binary
      - id: micro-behaviors/network/interface::get-adapters-info
      - id: micro-behaviors/os/service/control::open-sc-manager
    unless:
      - id: metadata/signed/platform/
