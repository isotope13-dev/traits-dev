defaults:
  for: [powershell, text]
  platforms: [windows]
  attack: "T1071.001"
traits:
  - id: ps-seeded-work-url-generation
    desc: PowerShell seeded work URL
    crit: suspicious
    conf: 0.95
    if:
      type: text
      substr: "function generateWorkUrl"
  - id: ps-dateparam-dga
    desc: PowerShell dateparam DGA
    crit: suspicious
    conf: 0.94
    if:
      type: text
      substr: "function getDateParam"
  - id: ps-random-setseed-hostparts
    desc: PowerShell seeded host parts
    crit: suspicious
    conf: 0.92
    if:
      type: text
      substr: "Get-Random -SetSeed ($dateparam"
  - id: ps-addtype-embedded-crypto
    desc: Add-Type embedded crypto class
    crit: suspicious
    conf: 0.93
    if:
      type: text
      substr: "Add-Type -TypeDefinition $vCsLib"
  - id: ps-rsa-aes-hybrid-crypto
    desc: PowerShell RSA AES hybrid crypto
    crit: suspicious
    conf: 0.94
    if:
      type: text
      substr: "RSACryptoServiceProvider prov"
composite_rules:
  # Redundant launch beacon: after launching a file, the script reports
  # the launch over a managed HttpWebRequest and again over a hidden
  # curl.exe, so the report survives either channel being blocked. Two
  # independent HTTP stacks aimed at reporting one event is the signal;
  # either client alone is ordinary telemetry.
  - id: powershell-dual-channel-launch-beacon
    desc: PowerShell reports launch over two HTTP channels
    crit: suspicious
    conf: 0.9
    for: [powershell]
    all:
      - id: micro-behaviors/communications/http/client/managed::httpwebrequest
      - id: micro-behaviors/communications/http/curl/command::curl-command-remote-url
      - id: micro-behaviors/process/create/cmdlet::start-process-filepath-text
      - id: micro-behaviors/process/create/hidden::start-process-windowstyle-hidden
  - id: powershell-seeded-http-beacon
    desc: PowerShell seeded HTTP beacon
    crit: hostile
    conf: 0.98
    all:
      - id: ps-seeded-work-url-generation
      - id: ps-dateparam-dga
    any:
      - id: ps-random-setseed-hostparts
      - id: micro-behaviors/communications/http/cookies::powershell-webclient-cookie-header
      - id: micro-behaviors/communications/http/user-agent::powershell-webclient-header-add
      - id: ps-addtype-embedded-crypto
      - id: ps-rsa-aes-hybrid-crypto
    needs: 3
