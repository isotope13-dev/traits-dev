# A Windows Script Host JScript implant that polls its server over
# WinHttp.WinHttpRequest, runs the reply through WScript.Shell (cmd.exe /c or
# hidden PowerShell), stages the output in a file, reads it back, deletes it
# and posts it to the server. The shell run, the file round-trip and the
# endless loop together are a command-and-control tasking loop; any one of
# them is ordinary script automation.
defaults:
  platforms: [windows]
  for: [javascript]
  attack: T1071.001,T1059.007,T1059.003

composite_rules:
  - id: js-winhttp-poll-shell-exec-output-file
    desc: JScript polls HTTP, runs shell commands, returns file output
    crit: hostile
    conf: 0.95
    near_bytes: 3000
    all:
      - id: micro-behaviors/communications/http/client/winhttp::winhttp-request-com
      - id: micro-behaviors/os/com/instantiation::wscript-shell-activex-constructor
      - id: micro-behaviors/data/control-flow/loop/unconditional::infinite-loop-header
    any:
      - id: micro-behaviors/process/create/shell/command-mode::cmd-exe-c-command-text
      - id: micro-behaviors/process/argument/visibility::embedded-powershell-hidden-option
      - id: micro-behaviors/fs/read/file/content/characters::readall-text-file
      - id: micro-behaviors/fs/delete/file/self::fso-deletefile-call
    needs: 2
