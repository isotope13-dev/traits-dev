# VBScript implants that report to an HTTP server and run whatever code the
# server returns. Two shapes:
#  - the host MAC address is read through WMI and sent as the victim id,
#    and the reply is executed: a check-in that receives its next stage;
#  - an unconditional loop sleeps, re-requests the server and executes the
#    reply each round: a polling tasking channel.
# Inventory scripts post MAC addresses and services poll endpoints, but none
# evaluate the server reply as VBScript.
defaults:
  platforms: [windows]
  for: [vbs]
  attack: T1071.001,T1059.005

composite_rules:
  - id: vbs-mac-keyed-checkin-executes-reply
    desc: Sends MAC address, executes the reply
    crit: hostile
    conf: 0.96
    attack: T1071.001,T1059.005,T1016
    all:
      - id: micro-behaviors/os/wmi/query::query-network-adapters
      - id: micro-behaviors/network/interface/identity::wmi-adapter-mac-address-read
      - id: objectives/execution/payload/script-eval/network/response-body::vbs-http-response-execute
  - id: vbs-polling-loop-executes-reply
    desc: Polls a server and executes each reply
    crit: hostile
    conf: 0.95
    near_bytes: 1600
    all:
      - id: micro-behaviors/data/control-flow/loop/unconditional::vbs-while-true-loop
      - id: micro-behaviors/time/sleep/interval::wscript-sleep-call
      - id: objectives/execution/payload/script-eval/network/response-body::vbs-http-response-execute
