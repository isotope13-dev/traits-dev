# Panel enrollment channel: an agent phones home to an operator panel to
# enroll itself, sending host identity (public-IP discovery) and a credential
# in the registration payload. This is the enrollment half of a managed-proxy
# control plane; the relay half lives at
# channel/proxy::python-panel-registered-socks-beacon and requires the SOCKS
# handshake, so panel-tasked agents converge from two composites in different
# subdirectories rather than one.
defaults:
  platforms: [unix, windows]
  for: [python, javascript, typescript]
  attack: T1071.001
  mbc: C0002

composite_rules:
  - id: credentialed-panel-enrollment
    desc: Agent enrolls with panel, sending credential and host identity
    crit: hostile
    conf: 0.95
    scope: file
    all:
      - id: micro-behaviors/communications/http/url/api-path::http-api-register-path
      - id: micro-behaviors/communications/http/ip-discovery::ipify-api
      - id: micro-behaviors/communications/http/post::post-method-detection
    any:
      - id: micro-behaviors/data/parse/vocabulary::password-key-value-pair
      - id: micro-behaviors/data/serialize/object::python-password-variable-object-field

