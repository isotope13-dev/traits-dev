defaults:
  platforms: [windows]
  for: [pe, dll, c, cpp, csharp]
  attack: T1071.001
  mbc: B0030

traits:
  - id: api-init-route
    desc: API initialization route path
    crit: notable
    conf: 0.86
    if:
      type: text
      regex: '(?i)/api/(init|checkin|register)/'
  - id: uuid-format-route-segment
    desc: UUID-shaped URL-path segment
    crit: notable
    conf: 0.86
    if:
      type: text
      regex: '(?i)(^|[^/])/[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}(/|[?"''\s]|$)'
composite_rules:
  - id: api-init-uuid-route
    desc: API init route with UUID
    crit: suspicious
    conf: 0.92
    all:
      - id: api-init-route
    any:
      - id: uuid-format-route-segment
      - id: micro-behaviors/communications/http/url/path::api-path-printf-placeholder
  - id: jfif-http-c2-transport
    desc: JFIF image C2 transport
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/communications/http/header/content-type::jpeg-content-type-header
      - id: api-init-uuid-route
    any:
      - id: micro-behaviors/communications/http/header/content-type::jpeg-mime-list-entry
      - id: micro-behaviors/data/format/string::uuid-from-string-api
      - id: micro-behaviors/crypto/library/encoding::crypt-binary-to-string
      - id: micro-behaviors/communications/http/client/winhttp::winhttp-write-data
    needs: 2
