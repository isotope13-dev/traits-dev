# Icon/stego delivery: HTTP claims an icon content-type, then a trailer marker
# delimits an RC4-wrapped PE. Common in multi-stage loaders that hide the next
# stage inside a plausible image response.
defaults:
  platforms: [windows]
  for: [c, cpp, pe, dll]
  attack: T1027.003,T1140,T1071.001
  mbc: B0030

traits:
  - id: image-x-icon-accept
    desc: Accepts image/x-icon content
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)\b(Accept|Content-Type)\s*:\s*image/x-icon\b'

  - id: endico-stego-marker
    desc: endico stego trailer marker
    crit: suspicious
    conf: 0.97
    if:
      type: text
      regex: '["'']endico["'']'

composite_rules:
  - id: icon-stego-rc4-payload
    desc: Icon response hides RC4 PE payload
    crit: hostile
    conf: 0.98
    all:
      - id: image-x-icon-accept
      - id: endico-stego-marker
      - id: micro-behaviors/crypto/symmetric/stream::source-rc4-implementation
    near_bytes: 8192
