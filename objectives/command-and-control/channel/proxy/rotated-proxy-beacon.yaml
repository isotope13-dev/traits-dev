# C2 beacons that rotate outbound posts through an operator proxy list.
# A single corporate egress proxy is ordinary; a configured proxy list
# paired with a proxy-agent client and a hand-built post (explicit
# Content-Length) is failover transport for collection, not egress config.
#
# Worked example: sra-testing-test index.js, which tries each configured
# proxy via HttpsProxyAgent and falls back to a direct post of host,
# environment, and DNS recon to its CloudFront collector.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  attack: T1090,T1041
  mbc: E1041
composite_rules:
  - id: proxy-rotated-beacon-post
    desc: Beacon rotates posts through proxy list
    crit: hostile
    conf: 0.97
    scope: file
    all:
      - id: micro-behaviors/communications/proxy/library::https-proxy-agent-instantiation
      - id: micro-behaviors/communications/proxy/config::proxy-list-config-key
      - id: micro-behaviors/communications/http/content-length::raw-content-length-header
      - id: objectives/anti-static/obfuscation/obfuscator/js-obfuscator::javascript-obfuscator-string-array-runtime
    unless:
      - id: metadata/package/testing/harness/runtime/
