# Hosts rewriting plus an installed TCP forward can redirect a relay name.
# Neither ordinary port forwarding nor a standalone hosts edit convicts.
defaults:
  platforms: [windows]
  for: [batch, powershell]
  crit: suspicious
  conf: 0.94
  attack: T1090,T1565.001

composite_rules:
  - id: hosts-loopback-portproxy-redirect
    desc: Hosts loopback rewrite near TCP port forwarding
    near_lines: 3
    all:
      - id: micro-behaviors/network/forward::netsh-portproxy-add
      - id: micro-behaviors/fs/write/file/hosts::hosts-file-write
      - id: micro-behaviors/network/dns::loopback-hosts-name-entry
