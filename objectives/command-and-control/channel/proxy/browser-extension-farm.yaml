# Extensions in the reported fake-VPN farm route browser traffic to its
# operator-controlled SOCKS5 relay fleet. The campaign's documented relay
# domains and working fixed-proxy configuration together distinguish it from
# a generic VPN extension or a domain reference alone.
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
  attack: T1090.003
  mbc: B0030

composite_rules:
  - id: fake-vpn-farm-browser-traffic-relay
    for: [javascript, typescript, chrome-manifest, crx, xpi, zip]
    desc: Fake VPN farm routes browser traffic through operator SOCKS5 relays
    crit: hostile
    conf: 0.99
    scope: archive
    all:
      - id: micro-behaviors/os/network/webextension::extension-fixed-socks5-browser-relay
      - id: well-known/dual-use/tunnel/browser-relay-cluster::fixed-socks5-proxy-farm-relay
      - id: micro-behaviors/os/network/webextension::extension-raw-ip-proxy-relay
