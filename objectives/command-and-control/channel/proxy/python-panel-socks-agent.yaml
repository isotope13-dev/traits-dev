# Residential-proxy botnets register each infected host with an operator panel,
# heartbeat for tasking, and expose a SOCKS5 relay on all interfaces. A local-
# only SOCKS helper that the user starts manually lacks the remote control
# plane and public bind together.
defaults:
  platforms: [unix, windows]
  for: [python]
  attack: T1090.002,T1071.001,T1195.002

composite_rules:
  - id: python-panel-registered-open-socks-agent
    desc: Python agent registers open SOCKS5 relay with panel
    crit: hostile
    conf: 0.97
    scope: file
    all:
      - id: micro-behaviors/communications/proxy/socks::socks5-proto
      - id: micro-behaviors/communications/http/url/api-path::http-api-register-path
      - id: micro-behaviors/communications/http/server/route::python-heartbeat-route
    any:
      - id: micro-behaviors/communications/proxy/socks::python-socks-all-interfaces-constructor
      - id: micro-behaviors/communications/proxy/socks::python-socks-proxy-server-class

  # Panel registration without a heartbeat loop: localhost-bound SOCKS agents
  # that POST /api/register still turn the host into an operator-controlled
  # relay (prosocks-class PyPI trojans).
  - id: python-panel-registered-socks-relay-agent
    desc: Python SOCKS relay registers with operator panel
    crit: hostile
    conf: 0.96
    scope: file
    all:
      - id: micro-behaviors/communications/proxy/socks::socks5-proto
      - id: micro-behaviors/communications/http/url/api-path::http-api-register-path
      - id: micro-behaviors/communications/proxy/socks::python-socks-proxy-server-class
