defaults:
  platforms: [android]
  for: [apk, zip]
  attack: T1090

composite_rules:
  - id: android-nfc-relay-channel
    desc: Android NFC data relay through a remote web channel
    crit: hostile
    conf: 0.995
    all:
      - id: micro-behaviors/hardware/smartcard/access::android-nfc-card-reader-reference
      - id: micro-behaviors/hardware/smartcard/access::android-nfc-tech-discovered-intent
      - id: objectives/command-and-control/channel/deaddrop/cloud-storage::android-okhttp-client-reference
      - id: micro-behaviors/process/interpreter/webview::webview-remote-content-shell
      - id: objectives/credential-access/phishing/credential::android-remote-credential-step
