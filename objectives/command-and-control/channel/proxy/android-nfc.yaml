# An NFC relay ("ghost tap") campaign ships two APKs and this file covers both
# ends of the wire. The victim's phone runs the READER half below: it reads the
# tapped card over ISO-DEP and streams the card's APDUs out. The mule's phone,
# standing at a real POS terminal, runs the EMULATOR half: it registers a Host
# Card Emulation service and answers the terminal's command APDUs with replies
# arriving from the same socket.
defaults:
  platforms: [android]
  for: [apk, zip]
  attack: T1090

composite_rules:
  - id: android-nfc-relay-channel
    desc: Android ISO-DEP APDU relay through an encrypted WebSocket
    crit: hostile
    conf: 0.995
    all:
      - id: micro-behaviors/hardware/smartcard/access::android-nfc-adapter-reference
      - id: micro-behaviors/hardware/smartcard/access::android-nfc-tech-discovered-intent
      - id: micro-behaviors/hardware/smartcard/access::android-isodep-technology-reference
      - id: micro-behaviors/hardware/smartcard/access::android-nfc-transceive-reference
      - id: micro-behaviors/communications/http/websocket::android-okhttp-websocket-client
      - id: micro-behaviors/communications/websocket/endpoints::android-wss-endpoint

  # The mule half. Card emulation on its own is ordinary (transit, badges,
  # wallets), and so is a WebSocket; what is not ordinary is an emulator that
  # registers the AID table of several competing payment schemes at once. A
  # wallet emulates the cards its owner provisioned, so it registers its own
  # issuer AIDs — enumerating Visa AND Mastercard AND Amex/JCB/Discover/UnionPay
  # means standing ready to present whatever card the far end names, which with
  # a live socket behind it is the relay. Suspicious rather than hostile: no
  # emulator-side sample has been through here yet, so the reading is inferred
  # from the reader-side variants rather than observed. A mule APK that also
  # carries the EMV tamper atoms will clear the bar on its own evidence.
  #
  # scope: archive because Android splits this evidence across APK entries by
  # construction — the AIDs an HCE service claims live in the res/xml
  # apduservice.xml the OS reads to route APDUs, not necessarily in the dex —
  # so the default per-leaf-file scope would never assemble the set. `archive`
  # pools within the one APK (and degrades to the input itself when a bare
  # classes.dex is scanned), unlike `outer`, which would pool across every APK
  # in a scanned directory.
  - id: android-hce-apdu-relay-channel
    desc: Card emulation answers a terminal from a remote socket
    crit: suspicious
    conf: 0.94
    scope: archive
    all:
      - id: micro-behaviors/hardware/smartcard/access::android-host-card-emulation-service
      - id: micro-behaviors/hardware/smartcard/access::android-process-command-apdu-handler
      - id: micro-behaviors/hardware/smartcard/access::android-emv-payment-scheme-aid
      - id: micro-behaviors/communications/http/websocket::android-okhttp-websocket-client
      - id: micro-behaviors/communications/websocket/endpoints::android-wss-endpoint
