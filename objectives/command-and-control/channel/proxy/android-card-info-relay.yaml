defaults:
  platforms: [android]
  for: [dex]
  attack: T1090,T1646
traits:
  - id: dex-card-info-string-call
    desc: DEX calls card information serialization
    crit: notable
    conf: 0.95
    if:
      type: symbol
      kind: call
      regex: '/CardInfo;->toString$'
  - id: dex-isodep-transceive-call
    desc: DEX calls ISO-DEP transceive
    crit: notable
    conf: 0.99
    if:
      type: symbol
      kind: call
      exact: 'Landroid/nfc/tech/IsoDep;->transceive'
  - id: dex-nfc-info-constructor-call
    desc: DEX constructs NFC information object
    crit: notable
    conf: 0.95
    if:
      type: symbol
      kind: call
      regex: '/NfcInfo;-><init>$'
  - id: dex-ws-message-constructor-call
    desc: DEX constructs WebSocket message object
    crit: notable
    conf: 0.95
    if:
      type: symbol
      kind: call
      regex: '/WSMessage;-><init>$'
composite_rules:
  # Nearby call sites describe a structural cluster, not proven data flow.
  - id: dex-card-info-isodep-cluster
    desc: Card serialization and ISO-DEP calls in DEX cluster
    crit: notable
    conf: 0.95
    near_bytes: 256
    all:
      - id: dex-card-info-string-call
      - id: dex-isodep-transceive-call
  - id: dex-nfc-websocket-message-cluster
    desc: NFC information and WebSocket message constructor cluster
    crit: notable
    conf: 0.95
    near_bytes: 256
    all:
      - id: dex-nfc-info-constructor-call
      - id: dex-ws-message-constructor-call
  - id: android-card-info-websocket-relay
    desc: NFC card information and WebSocket relay code
    crit: hostile
    conf: 0.97
    all:
      - id: dex-card-info-isodep-cluster
      - id: dex-nfc-websocket-message-cluster
      - id: metadata/lang/source/literal/string/property::android-nfc-card-info-channel
      - id: micro-behaviors/hardware/smartcard/access::android-host-card-emulation-service
      - id: micro-behaviors/communications/socket/create::java-socket-bytecode-reference
