# An open proxy that terminates whatever process holds its listen port, then
# binds every interface and walks a list of accounts until one works. A service
# restart does not shop for a working account.
defaults:
  for: [pe, dll]
  platforms: [windows]
  attack: T1090
  mbc: B0030

composite_rules:
  - id: port-seizing-open-proxy
    desc: Open proxy kills the process holding its port
    crit: hostile
    conf: 0.97
    all:
      - id: micro-behaviors/communications/proxy/auth::account-list-rotation-diagnostic
      - id: micro-behaviors/communications/socket/bind/address::listening-all-interfaces-text
      - id: micro-behaviors/communications/socket/listen::winsock-listener-imports
      - id: micro-behaviors/process/terminate/kill::terminate-process
    any:
      - id: micro-behaviors/process/terminate/kill::port-busy-killing-owner
      - id: micro-behaviors/process/terminate/kill::killed-pid-holding-port
      - id: micro-behaviors/os/network/connections::get-tcp-table-ex
      - id: micro-behaviors/os/network/connections::get-extended-tcp-table-name
    needs: 2
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/installer/family/
      - id: well-known/app/
      - id: well-known/tool/

  # Product identity does not excuse a hash-rotating proxy that cycles
  # upstream accounts and forcibly takes another process's listening port.
  # Require each role explicitly; ordinary updaters and kill-port helpers
  # do not establish this combination. Cite the hash-rotation diagnostics
  # themselves: self-hash-rotation-relaunch is suppressed for a recognized
  # product, and that suppression must not hide this combination.
  - id: hash-rotating-port-seizing-proxy
    desc: Hash-rotating proxy cycles accounts and kills port owner
    crit: hostile
    conf: 0.98
    all:
      - id: objectives/anti-analysis/self-modify/runtime::executable-hash-padding-diagnostic
      - id: objectives/anti-analysis/self-modify/runtime::exit-to-change-hash-diagnostic
      - id: micro-behaviors/communications/proxy/auth::account-list-rotation-diagnostic
      - id: micro-behaviors/communications/socket/bind/address::listening-all-interfaces-text
      - id: micro-behaviors/communications/socket/listen::winsock-listener-imports
      - id: micro-behaviors/process/terminate/kill::terminate-process
      - id: micro-behaviors/process/terminate/kill::port-busy-killing-owner
      - id: micro-behaviors/process/terminate/kill::killed-pid-holding-port
