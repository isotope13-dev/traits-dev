# An open proxy that terminates whatever process holds its listen port, then
# binds every interface and walks a list of accounts until one works. A service
# restart does not shop for a working account.
defaults:
  for: [pe, dll]
  platforms: [windows]
  attack: T1090
  mbc: B0030

composite_rules:
  - id: port-seizing-open-proxy
    desc: Open proxy kills the process holding its port
    crit: hostile
    conf: 0.97
    all:
      - id: micro-behaviors/communications/proxy/auth::account-list-rotation-diagnostic
      - id: micro-behaviors/communications/socket/bind/address::listening-all-interfaces-text
      - id: micro-behaviors/communications/socket/listen::winsock-listener-imports
      - id: micro-behaviors/process/terminate/kill::terminate-process
    any:
      - id: micro-behaviors/process/terminate/kill::port-busy-killing-owner
      - id: micro-behaviors/process/terminate/kill::killed-pid-holding-port
      - id: micro-behaviors/os/network/connections::get-tcp-table-ex
      - id: micro-behaviors/os/network/connections::get-extended-tcp-table-name
    needs: 2
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/installer/family/
      - id: well-known/app/
      - id: well-known/tool/

  # Require each role explicitly; each leg is content-derived behavior.
  # ESET update mirrors also use this chain for account rotation and service
  # restart. Their content-based application identity excludes this inference;
  # hash rotation remains visible independently as a suspicious capability.
  - id: hash-rotating-port-seizing-proxy
    desc: Persistent hash-rotating proxy cycles accounts and kills port owner
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/fs/write/file/executable::executable-hash-padding-diagnostic
      - id: micro-behaviors/fs/write/file/executable::exit-to-change-hash-diagnostic
      - id: micro-behaviors/communications/proxy/auth::account-list-rotation-diagnostic
      - id: micro-behaviors/communications/socket/bind/address::listening-all-interfaces-text
      - id: micro-behaviors/communications/socket/listen::winsock-listener-imports
      - id: micro-behaviors/process/terminate/kill::terminate-process
      - id: micro-behaviors/process/terminate/kill::port-busy-killing-owner
      - id: micro-behaviors/process/terminate/kill::killed-pid-holding-port
      - id: micro-behaviors/os/registry/manipulate::run-key-file-operation-api-profile
    unless:
      - id: well-known/app/security/eupdate-helper::eupdate-helper-binary
