# Port takeover and account rotation also occur in fixed update mirrors.
# Require a general-purpose proxy-server role before claiming proxy abuse.
defaults:
  for: [pe, dll]
  platforms: [windows]
  attack: T1090
  mbc: B0030

composite_rules:
  - id: port-seizing-rotating-proxy
    desc: Account-rotating proxy server kills port owner
    crit: hostile
    conf: 0.97
    all:
      - id: micro-behaviors/communications/proxy/auth::account-list-rotation-diagnostic
      - id: micro-behaviors/communications/socket/bind/address::listening-all-interfaces-text
      - id: micro-behaviors/communications/socket/listen::winsock-listener-imports
      - id: micro-behaviors/process/terminate/kill::terminate-process
      - id: micro-behaviors/process/terminate/kill::listener-port-owner-termination
    any:
      - id: micro-behaviors/communications/proxy/socks::socks-server-ref
      - id: micro-behaviors/communications/proxy/socks::socks5-server-symbol
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/installer/family/
      # Product identity does not authorize credential cycling and port takeover.
      - id: well-known/tool/
    # The hash-rotating family composite covers these same roles plus hash
    # mutation; step down when it fires so one behavior is not convicted twice.
    downgrade:
      any:
        - id: hash-rotating-port-seizing-proxy

  # Require each role explicitly; each leg is content-derived behavior.
  # Account rotation and a listener can also serve a fixed update mirror.
  # Require SOCKS-server, HTTP CONNECT tunnel, or a concrete ESET manifest
  # relay profile before interpreting hash mutation and port takeover as a
  # proxy abuse chain. The relay profile alone is neutral; the required hash
  # mutation, account cycling, listener port takeover, and Run-key behavior
  # provide the hostile context for this alternative.
  # 502/503 gateway error text is not enough: a fixed-upstream mirror that
  # relays one vendor's update server emits the same pair.
  - id: hash-rotating-port-seizing-proxy
    desc: Persistent hash-rotating proxy cycles accounts and kills port owner
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/fs/write/file/executable::executable-hash-padding-diagnostic
      - id: micro-behaviors/fs/write/file/executable::exit-to-change-hash-diagnostic
      - id: micro-behaviors/communications/proxy/auth::account-list-rotation-diagnostic
      - id: micro-behaviors/communications/socket/bind/address::listening-all-interfaces-text
      - id: micro-behaviors/communications/socket/listen::winsock-listener-imports
      - id: micro-behaviors/process/terminate/kill::terminate-process
      - id: micro-behaviors/process/terminate/kill::port-busy-killing-owner
      - id: micro-behaviors/process/terminate/kill::killed-pid-holding-port
      - id: micro-behaviors/os/registry/manipulate::run-key-file-operation-api-profile
    any:
      - id: micro-behaviors/communications/proxy/socks::socks-server-ref
      - id: micro-behaviors/communications/proxy/socks::socks5-server-symbol
      - id: micro-behaviors/communications/proxy/tunnel::http-connect-host-tunnel
      - id: micro-behaviors/communications/proxy/relay::eset-manifest-filtering-relay-profile
