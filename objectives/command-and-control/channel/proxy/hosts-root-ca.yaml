# Local TLS intercept: install a root CA and pin a name to loopback
# so HTTPS clients hit a local proxy.
defaults:
  platforms: [windows]
  for: [powershell, batch]
  attack: T1553.004,T1565.001
  mbc: F0016

traits:
  - id: loopback-hosts-name-redirect
    desc: Loopback hosts entry for a DNS name
    crit: suspicious
    conf: 0.93
    if:
      type: text
      regex: '127\.0\.0\.1\s+[A-Za-z0-9.-]+\.[A-Za-z]{2,24}'

composite_rules:
  - id: root-cert-hosts-loopback
    desc: Root CA install with loopback hosts redirect
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/crypto/certificate/install::cert-install-cmd
      - id: micro-behaviors/fs/path/config/system::windows-hosts-file
      - id: loopback-hosts-name-redirect
