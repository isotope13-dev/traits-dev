# Local traffic intercept: pin a name somewhere it does not belong, and make
# the redirect stick — by installing a root CA so the substituted server can
# still speak HTTPS, or by seizing the hosts file so the entry cannot be
# removed. The victim's browser follows the attacker's server under the real
# domain, which is what makes this worth a hostile rating rather than the
# "config file was edited" reading a hosts write gets on its own.
defaults:
  platforms: [windows]
  for: [powershell, batch]
  attack: T1553.004,T1565.001
  mbc: F0016

traits:
  - id: hosts-command-permission-policy
    desc: Classifies hosts commands for permission prompts
    crit: notable
    conf: 0.96
    for: [javascript, typescript]
    if:
      type: text
      regex: '(?s)allowedWithoutPermission.{0,700}/etc/hosts.{0,700}t.{0,80}(chown|takeown)'

composite_rules:
  - id: root-cert-hosts-loopback
    desc: Root CA install with loopback hosts redirect
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/crypto/certificate/install::cert-install-cmd
      - id: micro-behaviors/fs/path/config/system::windows-hosts-file
      - id: micro-behaviors/network/dns::loopback-hosts-name-entry

  # The intercept aimed at the verdict channel specifically: a security-
  # scanning domain (threat-intel service, AV vendor, update server) pinned to
  # loopback while a certificate is installed. Pinning the scanner's name and
  # minting trust for the local proxy that answers lets the operator block or
  # fabricate lookups — the VirusTotal redirect of the post-DEF CON Google Doc
  # campaign's TLS-intercepting proxy payload. Blocking a scanner is never a
  # configuration a user or admin would choose for themselves.
  - id: scanning-service-loopback-intercept
    desc: Scanning service pinned to loopback with certificate install
    crit: hostile
    conf: 0.96
    attack: T1553.004,T1565.001,T1562.001
    all:
      - id: micro-behaviors/crypto/certificate/install::cert-install-cmd
      - id: micro-behaviors/network/dns::loopback-hosts-name-entry
      - id: micro-behaviors/communications/url/host/name::security-update-telemetry-service-references

  # The same intercept written in native code instead of a shell one-liner.
  # Compiled implants build the hosts line from a format string and hold the
  # redirect target as a separate constant, so `loopback-hosts-name-redirect`
  # never sees a complete line and the redirect need not point at loopback at
  # all — pinning the victim's names to an attacker-run host works just as
  # well. What survives compilation is the pairing of a hosts *rewrite* with
  # the Win32 calls that push a certificate into a trust store.
  #
  # This used to be "native-hosts-redirect-with-root-ca" / "Hosts redirect plus
  # root CA installation" over just `hosts-file-path` + `cert-store-population-
  # api`, and reported two things it had not observed. Neither half carries its
  # claim alone: `hosts-file-path` is a bare path string that every tool which
  # merely *displays* the hosts file holds, and CertAddCertificateContextToStore
  # / PFXImportCertStore populate a caller-selected store — for an Authenticode
  # verifier that store is a temporary in-memory one, never the machine root.
  # SIW, a signed system-information utility that shows the hosts file and
  # checks driver signatures, scored hostile on exactly that pair.
  #
  # So the hosts half must show a rewrite rather than a mention: file-modifying
  # APIs alongside the path, a resolver-cache flush (how a rewrite is made to
  # take effect), or ownership seizure of the file. A program that rewrites
  # name resolution *and* pushes its own certificate into a store is setting up
  # to read the victim's TLS traffic.
  - id: native-hosts-rewrite-with-cert-store-install
    desc: Hosts file rewrite with certificate-store install
    crit: hostile
    conf: 0.95
    for: [binaries]
    all:
      - id: micro-behaviors/crypto/certificate/store::cert-store-population-api
    any:
      - id: micro-behaviors/fs/path/config/system::hosts-file-modification-api-set
      - id: hosts-rewrite-with-dns-flush
      - id: hosts-file-ownership-seizure
    unless:
      - id: well-known/app/storage/syncback::syncback-backup-benign-context

  # Widening Firefox's trust to the OS root store right where a certificate is
  # being pushed into that store closes the last gap in a Windows intercept:
  # Chrome and Edge follow the machine store already, Firefox does not until
  # this policy is set. Enterprise management tooling legitimately does both,
  # so this stays out of `hostile` only when it is the whole story — paired
  # with a hosts rewrite it lands in the composite above as well.
  - id: root-ca-install-with-firefox-trust-widening
    desc: Root CA install widens Firefox trust
    crit: hostile
    conf: 0.95
    for: [binaries, scripts]
    all:
      - id: micro-behaviors/crypto/certificate/install::firefox-enterprise-roots-policy
      - id: micro-behaviors/crypto/certificate/store::cert-store-population-api

  - id: hosts-file-ownership-seizure
    desc: Seizes ownership and ACLs of hosts file
    crit: hostile
    conf: 0.94
    for: [scripts, binaries]
    attack: T1222.001,T1565.001
    # The takeown must be aimed at *this* file. `takeown /f <hosts>` puts them
    # in one command string, and a compiled routine pools them together; what
    # this excludes is a general-purpose "take ownership of a protected object"
    # utility that also happens to carry the hosts path somewhere else in its
    # resources. ContextMenuManager is that utility -- it needs
    # SeTakeOwnershipPrivilege to edit protected shell keys, and its hosts
    # string sits 160 KB away from its takeown string.
    near_bytes: 2048
    all:
      - id: micro-behaviors/fs/path/config/system::hosts-file-path
      - id: micro-behaviors/fs/chown::takeown-file-command
    any:
      - id: micro-behaviors/fs/chmod/get::get-icacls
      - id: micro-behaviors/os/privilege/check::trustedinstaller-sid-literal
      - id: micro-behaviors/os/privilege/token::high-risk-take-ownership-privilege-name
    unless:
      - id: hosts-command-permission-policy

  # Flushing the resolver cache is how a hosts rewrite is made to take effect
  # immediately. Ad blockers and hosts-based filtering tools do this too, so on
  # its own it is only suspicious — but it is the reliable native tell that the
  # hosts path was *written*, not merely referenced.
  - id: hosts-rewrite-with-dns-flush
    desc: Rewrites hosts then flushes DNS cache
    crit: suspicious
    conf: 0.9
    for: [pe]
    all:
      - id: micro-behaviors/fs/path/config/system::hosts-file-path
      - id: micro-behaviors/communications/dns/flush::dns-flush-resolver-cache
    unless:
      - id: well-known/dual-use/tunnel/sing-box/
