defaults:
  platforms: [windows]
  for: [pe]

composite_rules:
  - id: vb6-obfuscated-hosts-redirect
    desc: VB6 obfuscated runtime with hosts redirect
    crit: hostile
    conf: 0.96
    attack: T1565.001,T1027
    all:
      - id: objectives/anti-static/obfuscation/imports/concealment::vb6-obfuscated-runtime-dispatch
      - id: hosts-redirect-to-external-host
    unless:
      - id: metadata/signed/platform/
