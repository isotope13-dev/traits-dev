# Script/command-line Tor client: routes HTTP to a hidden service through the
# local Tor SOCKS proxy (e.g. `curl --socks5-hostname localhost:9050 http://<x>.onion/...`).
# The native libcurl variant lives in native-libcurl.yaml; this covers scripts
# and command-line invocations where the curl/flag adjacency is broken up by
# string concatenation.
defaults:
  platforms: [windows, unix]
  for: [scripts, binaries]
  attack: T1090.003
  mbc: B0030
composite_rules:
  # An onion hidden-service address plus a local Tor SOCKS proxy (the default
  # 9050/9051 port, or curl's --socks5-hostname flag) is the shape of Tor C2 —
  # but the premise this rule used to carry, that "legitimate software almost
  # never hardcodes both", does not hold: reaching a hidden service through the
  # local SOCKS proxy is the *supported* way to use Tor, so every Tor-capable
  # application hardcodes the pair. Bitcoin Core's feature_proxy.py asserts on
  # exactly this while testing the node's documented .onion peer support; so do
  # Monero and Lightning nodes, OnionShare, SecureDrop, apt-transport-tor and
  # torsocks wrappers, plus the docs and tests of all of them.
  #
  # Left hostile deliberately: it supplies one of the three required hostile
  # findings on the cryptobandits-clipper fixture, and downgrading it regressed
  # that sample below its score floor. The honest fix is a third leg carrying
  # tasking/exfil evidence (the sibling tor/hidden-service::tor-onion-socks-beacon
  # composite shows the shape) rather than a spoofable test-path carve-out.
  # Mojolicious' UserAgent documentation contains a complete, runnable Tor
  # search example; its module identity is a stronger benign-context signal
  # than the URL text alone and should suppress this objective for that file.
  - id: script-tor-onion-socks-c2
    desc: Tor C2 over SOCKS to onion service
    crit: hostile
    conf: 0.95
    unless:
      - id: well-known/app/system/startos/
      - id: well-known/app/ai/coding-agent/omnius::bundled-runtime-context
      - id: well-known/lib/web/mojolicious::user-agent-module
    all:
      - id: micro-behaviors/communications/proxy/tor::onion-domain-reference
    any:
      - id: micro-behaviors/communications/proxy/socks::tor-socks-proxy-port
      - id: micro-behaviors/communications/proxy/socks::curl-socks5-hostname
    needs: 1
