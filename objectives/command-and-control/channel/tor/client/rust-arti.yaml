# An unsigned executable that links Arti's onion-service client talks to a
# hidden service from inside its own process, with no tor.exe to spot.
# Ordinary software that needs Tor ships or drives the Tor daemon; Arti's own
# CLI is excluded by its crate path.
defaults:
  platforms: [windows]
  for: [pe]
  attack: T1090.003
  mbc: B0030

composite_rules:
  - id: unsigned-pe-arti-onion-client
    desc: Unsigned PE embeds Arti onion-service client
    crit: suspicious
    conf: 0.9
    all:
      - id: micro-behaviors/communications/proxy/tor::arti-client-crate-path
      - id: micro-behaviors/communications/proxy/tor::arti-onion-service-client-crate-path
      - id: metadata/signature/absent::unsigned-no-certificate-directory
    unless:
      - id: micro-behaviors/communications/proxy/tor::arti-cli-crate-path

  # The SocGholish Rust backdoor polls an onion C2 through embedded Arti and
  # falls back to DGA domains or scraped bridges when Tor is blocked. A
  # fallback channel beside an in-process onion client is C2 resilience,
  # not anything a privacy tool needs.
  - id: arti-onion-c2-with-fallback
    desc: Arti onion client with DGA or bridge fallback
    crit: hostile
    conf: 0.93
    ref: https://adamnet.works/blog/socgholish-trojanized-figma-rust-tor-backdoor/
    attack: T1090.003,T1568.002
    all:
      - id: unsigned-pe-arti-onion-client
    any:
      - id: micro-behaviors/communications/dns/domain::rust-dga-module-path
      - id: micro-behaviors/communications/proxy/tor::bridgedb-bridge-request-url
