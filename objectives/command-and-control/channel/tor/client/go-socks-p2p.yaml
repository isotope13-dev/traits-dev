defaults:
  platforms: [linux]
  for: [elf]

composite_rules:
  - id: go-tor-socks5-p2p-exec-agent
    desc: Go binary combines Tor SOCKS5 proxy, X25519 crypto, and os/exec
    crit: suspicious
    conf: 0.90
    attack: T1090.003,T1573.001,T1059
    all:
      - id: micro-behaviors/communications/proxy/socks/client::go-x-net-socks-package
      - id: micro-behaviors/crypto/asymmetric/curve25519::x25519-key-exchange-term
      - id: micro-behaviors/process/create/runtime-symbol::go-os-exec-package-reference
    any:
      - id: micro-behaviors/communications/socket/port::tor-default-loopback-port
      - id: micro-behaviors/communications/socket/port::tor-default-loopback-port-elf
    unless:
      - id: well-known/dual-use/tunnel/sing-box::sagernet-sing-box-go-dep-elf
      - id: well-known/dual-use/tunnel/sing-box::sagernet-sing-box-go-module-elf
