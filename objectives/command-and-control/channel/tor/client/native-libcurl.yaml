# Native libcurl client routing HTTP/C2 through the local Tor SOCKS proxy
# to a hidden service (.onion).
defaults:
  platforms: [windows]
  for: [pe, dll]
  attack: T1090.003
  mbc: B0030

composite_rules:
  - id: native-libcurl-tor-onion-c2
    desc: Native libcurl Tor onion C2 channel
    crit: hostile
    conf: 0.96
    unless:
      - id: well-known/app/system/startos/
      - id: well-known/app/ai/coding-agent/omnius::bundled-runtime-context
    all:
      - id: well-known/lib/network/curl::native-libcurl-onion-socks
      - id: micro-behaviors/communications/socket/port::tor-default-loopback-port
    any:
      - id: micro-behaviors/communications/http/request/reference::native-post-method-token
      - id: micro-behaviors/communications/url/resource-path/file::url-php-endpoint-binary
      - id: micro-behaviors/communications/proxy/socks/unspecified::socks5h-proto
    needs: 1
