# WebSocket C2 Patterns - JavaScript/Node.js
# Detects socket.io-client and WebSocket C2 patterns
# ATT&CK: T1071.001 (Web Protocols)
# MBC: B0030 (C2 Communication)
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
composite_rules:
  - id: socketio-c2-pattern
    desc: Socket.IO channel with remote command execution
    crit: suspicious
    conf: 0.92
    mbc: "B0030"
    attack: "T1071.001"
    all:
      - id: micro-behaviors/os/module/require::socketio-client-require
      - id: socketio-remote-command-handler
    any:
      - id: micro-behaviors/communications/websocket/library::socketio-reconnect-attempts
      - id: micro-behaviors/communications/websocket/library::socketio-reconnect-delay
    unless:
      - id: metadata/package/testing/harness/runtime/
      - id: metadata/package/testing/presence/fixture::test-filename-pattern
  - id: socketio-remote-command-handler
    desc: Socket.IO remote command handler
    crit: notable
    conf: 0.88
    all:
      - id: micro-behaviors/data/control-flow/event-callback::js-exec-event-registration
    any:
      - id: micro-behaviors/os/module/require::child-process-require
      - id: micro-behaviors/process/create/shell/bridge::child-process-exec
