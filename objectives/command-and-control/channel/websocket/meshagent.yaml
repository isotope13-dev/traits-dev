defaults:
  platforms: [windows]
  for: [pe]
  attack: T1219,T1071.001
composite_rules:
  - id: browser-disguised-meshagent-controller
    desc: Browser-disguised MeshAgent declares WebSocket controller
    crit: hostile
    conf: 0.98
    # Deceptive product identity supplies admission; the config key binds the
    # endpoint to the management channel. Stock RMM endpoints do not qualify.
    all:
      - id: objectives/evasion/masquerade/version-resource/claim::meshagent-edge-version-masquerade
      - id: micro-behaviors/communications/http/websocket::meshagent-configured-server
