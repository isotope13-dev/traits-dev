# reconnection framing its operator messages in hand-rolled repeating-key
# XOR. Client libraries reconnect by themselves; hand-rolled XOR framing
# over that channel is implant-grade message obfuscation.
# ATT&CK: T1071.001 (Application Layer Protocol: Web Protocols),
#         T1132.001 (Data Encoding)
defaults:
  platforms: [windows, unix]
  for: [python, cab, zip, tar]

composite_rules:
