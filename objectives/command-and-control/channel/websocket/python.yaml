  # (managers/socket_manager.py) live in different modules of the same
  # package, so the channel claim binds at archive scope.
  - id: python-socketio-xor-implant-relay
    desc: Python socket.io client relays repeating-key XOR ops
    crit: hostile
    conf: 0.93
    scope: archive
    attack: T1071.001,T1132.001
    all:
      - id: micro-behaviors/communications/websocket/library::python-socketio-client-build
      - id: micro-behaviors/communications/websocket/library::python-socketio-unlimited-reconnections
      - id: metadata/lang/source/naming/module::python-xor-suffixed-module-import
      - id: metadata/lang/source/syntax/expansion::python-length-bounded-repetition-syntax
