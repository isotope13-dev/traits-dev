# A stripped static Go ELF built with garble that carries a literal external
# IPv4 address in a ws:// URL and issues raw socket syscalls hides both its
# code and its command server; legitimate Go tools rarely garble and hardcode a
# raw-IP WebSocket endpoint.
defaults:
  platforms: [linux]
  for: [elf]
  attack: T1071.001,T1027.002
composite_rules:
  - id: garbled-go-elf-with-raw-ip-websocket-endpoint
    desc: Garbled Go ELF with raw-IP WebSocket endpoint
    crit: hostile
    conf: 0.8
    all:
      - id: objectives/anti-static/obfuscation/obfuscator/garble::go-garble-indicators
      - id: micro-behaviors/communications/ip/direct::external-ipv4-websocket-url
      - id: micro-behaviors/communications/ip/literal::static-stripped-elf-external-ip-literal
      - id: micro-behaviors/communications/socket/connect::socket-connect
