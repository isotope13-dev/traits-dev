defaults:
  platforms:
  - unix
  - android
  - ios
  for:
  - elf
  - macho
  size_max: 5000000
traits:
- id: suspicious-c2
  size_min: 512
  size_max: 500000000
  desc: Suspicious NodeJS C2 endpoint
  crit: suspicious
  conf: 1.0
  attack: T1071
  if:
    type: text
    substr: ws://securitytrails.pro:2052
    section: ".text"
# behavior-mix pairs pkg-marker with JS behaviour, and pkg-marker only ever
# fires on the packed binary -- so the behaviour has to be read out of the
# bundled snapshot, which pkg stores in .text next to the `/snapshot/` marker.
# The shared micro-behaviors atoms for these two are source-scoped and carry
# `node_modules/*.js` basename carve-outs that mean nothing in a binary, so the
# packed spelling lives here beside the other snapshot-string traits.
