# StreamRat-class Android RATs open their C2 as a WebSocket upgraded from an
# HTTP GET that carries bespoke device-fingerprint headers (X-Device-Id,
# X-Device-Model, X-Api-Level). Ordinary apps identify devices with standard
# SDK telemetry, not a hand-rolled header trio on a socket upgrade, so pairing
# the headers with a WebSocket client marks a device-identified bot channel;
# adding Accessibility or screen-capture capability marks a remote-control
# trojan. Neither leg depends on a family name or hardcoded C2 address.
defaults:
  platforms: [android]
  for: [java, kotlin]
  attack: T1071.001
  mbc: B0030

composite_rules:
  - id: android-websocket-device-fingerprint-checkin
    desc: WebSocket channel opened with Android device-fingerprint headers
    crit: suspicious
    conf: 0.95
    all:
      - id: micro-behaviors/communications/http/websocket::android-source-okhttp-websocket-client
    any:
      - id: micro-behaviors/communications/http/header/custom::android-x-device-id-header
      - id: micro-behaviors/communications/http/header/custom::android-x-device-model-header
      - id: micro-behaviors/communications/http/header/custom::android-x-api-level-header
    needs: 2

  - id: android-websocket-device-fingerprint-checkin-bytecode
    desc: WebSocket bytecode channel with Android device-fingerprint headers
    crit: suspicious
    conf: 0.95
    for: [apk, dex, zip]
    all:
      - id: micro-behaviors/communications/http/websocket::android-okhttp-websocket-client
    any:
      - id: micro-behaviors/communications/http/header/custom::android-x-device-id-header
      - id: micro-behaviors/communications/http/header/custom::android-x-device-model-header
      - id: micro-behaviors/communications/http/header/custom::android-x-api-level-header
    needs: 2

  - id: android-websocket-device-fingerprint-rat
    desc: Remote-control trojan identified by device-fingerprint WebSocket check-in
    crit: hostile
    conf: 0.97
    attack: T1071.001,T1417.001
    all:
      - id: android-websocket-device-fingerprint-checkin
    any:
      - id: micro-behaviors/hardware/input/accessibility::android-accessibility-service-source
      - id: micro-behaviors/hardware/display/screenshot::android-source-media-projection-screen-capture
      - id: micro-behaviors/hardware/display/screenshot::android-source-screenshot-call
      - id: micro-behaviors/hardware/input/accessibility::android-accessibility-gesture-dispatch
    needs: 1

  - id: android-websocket-device-fingerprint-rat-bytecode
    desc: Remote-control trojan bytecode with device-fingerprint WebSocket check-in
    crit: hostile
    conf: 0.97
    attack: T1071.001,T1417.001
    for: [apk, dex, zip]
    all:
      - id: android-websocket-device-fingerprint-checkin-bytecode
    any:
      - id: micro-behaviors/hardware/input/accessibility::android-accessibility-service-class
      - id: micro-behaviors/hardware/display/screen::android-media-projection-screen-capture
      - id: micro-behaviors/hardware/display/screen::android-screen-capture-capability
      - id: micro-behaviors/hardware/input/accessibility::android-accessibility-gesture-api
    needs: 1
