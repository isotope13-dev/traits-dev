# StreamRat-class Android RATs open their C2 as a WebSocket upgraded from an
# HTTP GET that carries bespoke device-fingerprint headers (X-Device-Id,
# X-Device-Model, X-Api-Level). Ordinary apps identify devices with standard
# SDK telemetry, not a hand-rolled header trio on a socket upgrade, so pairing
# the headers with a WebSocket client marks a device-identified bot channel;
# adding Accessibility or screen-capture capability marks a remote-control
# trojan. Neither leg depends on a family name or hardcoded C2 address.
defaults:
  platforms: [android]
  for: [java, kotlin]
  attack: T1071.001
  mbc: B0030

composite_rules:
  - id: android-websocket-device-fingerprint-checkin
    desc: WebSocket channel opened with Android device-fingerprint headers
    crit: suspicious
    conf: 0.95
    all:
      - id: micro-behaviors/communications/http/websocket::android-source-okhttp-websocket-client
    any:
      - id: micro-behaviors/communications/http/header/custom::android-x-device-id-header
      - id: micro-behaviors/communications/http/header/custom::android-x-device-model-header
      - id: micro-behaviors/communications/http/header/custom::android-x-api-level-header
    needs: 2

  - id: android-websocket-device-fingerprint-checkin-bytecode
    desc: WebSocket bytecode channel with Android device-fingerprint headers
    crit: suspicious
    conf: 0.95
    for: [android_apk, dex, zip]
    all:
      - id: micro-behaviors/communications/http/websocket::android-okhttp-websocket-client
    any:
      - id: micro-behaviors/communications/http/header/custom::android-x-device-id-header
      - id: micro-behaviors/communications/http/header/custom::android-x-device-model-header
      - id: micro-behaviors/communications/http/header/custom::android-x-api-level-header
    needs: 2

  - id: android-websocket-device-fingerprint-rat
    desc: Remote-control trojan identified by device-fingerprint WebSocket check-in
    crit: hostile
    conf: 0.97
    attack: T1071.001,T1417.001
    all:
      - id: android-websocket-device-fingerprint-checkin
    any:
      - id: micro-behaviors/hardware/input/accessibility::android-accessibility-service-source
      - id: micro-behaviors/hardware/display/screenshot::android-source-media-projection-screen-capture
      - id: micro-behaviors/hardware/display/screenshot::android-source-screenshot-call
      - id: micro-behaviors/hardware/input/accessibility::android-accessibility-gesture-dispatch
    needs: 1

  - id: android-websocket-device-fingerprint-rat-bytecode
    desc: Remote-control trojan bytecode with device-fingerprint WebSocket check-in
    crit: hostile
    conf: 0.97
    attack: T1071.001,T1417.001
    for: [android_apk, dex, zip]
    all:
      - id: android-websocket-device-fingerprint-checkin-bytecode
    any:
      - id: micro-behaviors/hardware/input/accessibility::android-accessibility-service-class
      - id: micro-behaviors/hardware/display/screenshot::android-media-projection-screen-capture
      - id: micro-behaviors/hardware/display/screenshot::android-screen-capture-capability
      - id: micro-behaviors/hardware/input/accessibility::android-accessibility-gesture-api
    needs: 1

  # Two or more verb groups mark a command vocabulary, not a stray string.
  - id: android-banking-rat-command-verbs
    desc: Banking RAT command vocabulary
    crit: suspicious
    conf: 0.96
    any:
      - id: android-banking-overlay-verbs
      - id: android-banking-screen-verbs
      - id: android-banking-event-log-verbs
      - id: android-banking-input-gesture-verbs
      - id: android-banking-input-entry-verbs
      - id: android-banking-provision-verbs
      - id: android-banking-device-control-verbs
      - id: android-banking-checkin-verbs
    needs: 2

  # Socket client plus the envelope plus the verb vocabulary: a
  # single-file banking implant that can be retasked (new overlays),
  # watched (screen streaming), and driven (input injection) remotely.
  - id: android-websocket-banking-command-channel
    desc: WebSocket banking RAT command channel with overlay verbs
    crit: hostile
    conf: 0.98
    attack: T1071.001,T1411,T1417.001
    all:
      - id: micro-behaviors/communications/http/websocket::android-source-okhttp-websocket-client
      - id: android-banking-command-envelope
      - id: android-banking-rat-command-verbs

traits:
  # Banking RATs multiplex overlay tasking, screen streaming, and remote
  # input over one socket with a fixed JSON envelope carrying cmd, udid,
  # rid, and data fields. The field trio is the shape RemControl, Medusa,
  # and their MaaS offshoots share; ordinary telemetry uses one device id,
  # not a command plus two routing ids.
  - id: android-banking-command-envelope
    desc: Banking RAT WebSocket command envelope fields
    crit: suspicious
    conf: 0.94
    if:
      type: text
      regex: '"cmd"[\s\S]{0,160}"udid"[\s\S]{0,160}"rid"'

  # Command verbs grouped by RAT function so each matcher stays small.
  # Two or more distinct groups mark a command vocabulary, not a stray
  # string; the suspicious composite below joins them with needs: 2.
  - id: android-banking-overlay-verbs
    desc: Banking RAT overlay command verbs
    crit: suspicious
    conf: 0.94
    if:
      type: text
      regex: '"(start_overlay|stop_overlay|start_blank_overlay)"'
  - id: android-banking-screen-verbs
    desc: Banking RAT screen command verbs
    crit: suspicious
    conf: 0.94
    if:
      type: text
      regex: '"(screen_start|screen_stop|screen_set_modes)"'
  - id: android-banking-event-log-verbs
    desc: Banking RAT event-log command verbs
    crit: suspicious
    conf: 0.94
    if:
      type: text
      regex: '"(start_event_log|stop_event_log|flush_event_log)"'
  - id: android-banking-input-gesture-verbs
    desc: Banking RAT input gesture verbs
    crit: suspicious
    conf: 0.94
    if:
      type: text
      regex: '"(input_tap|input_long_press|input_scroll|input_swipe)"'
  - id: android-banking-input-entry-verbs
    desc: Banking RAT input entry verbs
    crit: suspicious
    conf: 0.94
    if:
      type: text
      regex: '"(input_gesture|input_text|input_fill_id)"'
      not:
        - regex: '"type":\s*"input_text"'
  - id: android-banking-provision-verbs
    desc: Banking RAT provisioning verbs
    crit: suspicious
    conf: 0.94
    if:
      type: text
      regex: '"(update_apps|apps_report)"'
  - id: android-banking-device-control-verbs
    desc: Banking RAT device-control verbs
    crit: suspicious
    conf: 0.94
    if:
      type: text
      regex: '"(run_app|set_app_blocklist|set_tamper_guard)"'
  # First-contact verbs bound to envelope construction: reg on connect,
  # log to re-authenticate. Code-shaped to the put("cmd", ...) call so
  # stray "reg"/"log" strings cannot match.
  - id: android-banking-checkin-verbs
    desc: Banking RAT check-in verbs
    crit: suspicious
    conf: 0.95
    if:
      type: text
      regex: '\.put\(\s*"cmd"\s*,\s*"(reg|log)"\s*\)'
