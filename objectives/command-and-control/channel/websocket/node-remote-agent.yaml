# WebSocket agent clues: control, file-transfer handlers, and process creation.
defaults:
  crit: hostile
  conf: 0.99
  platforms: [unix, windows]
  for: [javascript, typescript]
  attack: T1105

composite_rules:
  - id: node-websocket-control-transfer-profile
    desc: WebSocket control with file-transfer handlers
    mbc: B0030
    all:
      - id: micro-behaviors/data/config/schema::javascript-relay-control-config-key
      - id: micro-behaviors/data/config/schema::javascript-admin-secret-config-key
      - id: micro-behaviors/communications/http/download/handler::js-download-handler-name
      - id: micro-behaviors/communications/http/download/handler::js-upload-handler-name
      - id: micro-behaviors/data/config/schema::javascript-privilege-state-config-key
      - id: micro-behaviors/communications/http/websocket::websocket-class
      - id: micro-behaviors/process/create/exec::node-spawnsync-call
