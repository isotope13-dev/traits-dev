defaults:
  platforms:
  - windows
  - unix
  for:
  - scripts
  - binaries
  - csharp
  attack: T1102
  mbc: B0030
traits:
- id: mqtt-remoteadmin-commands-topic
  desc: MQTT remoteadmin command topic
  crit: notable
  conf: 0.94
  if:
    type: text
    regex: \bremoteadmin/commands(/|$)
- id: mqtt-remoteadmin-results-topic
  desc: MQTT remoteadmin results topic
  crit: notable
  conf: 0.94
  if:
    type: text
    regex: \bremoteadmin/results(/|$)
- id: mqtt-remoteadmin-status-topic
  desc: MQTT remoteadmin status topic
  crit: notable
  conf: 0.9
  if:
    type: text
    regex: \bremoteadmin/(status|heartbeat|logs)(/|$)
- id: mqtt-ra-agent-client-id
  desc: MQTT RAT agent client ID
  crit: suspicious
  conf: 0.9
  if:
    type: text
    regex: \bra-agent-[A-Za-z0-9_.-]*\{?(MachineName|short-guid|MachineGuid)?\}?
composite_rules:
- id: broker-cluster-task-protocol
  desc: Broker cluster exposes structured remote command tasks
  crit: suspicious
  conf: 0.98
  all:
  - id: micro-behaviors/communications/http/request/route::command-request-route
  - id: micro-behaviors/data/serialize/schema-object::command-field-key
  - id: micro-behaviors/communications/http/request/tasking::structured-task-id-field
  - id: metadata/lang/source/naming/setting::timeout-setting-name-token
  any:
  - id: micro-behaviors/communications/messaging/mqtt::hivemq-broker-endpoint
  - id: micro-behaviors/communications/http/request/route::paired-status-metrics-routes
- id: broker-cluster-polled-command-backdoor
  desc: Broker-backed command channel executes polled tasks and returns output
  crit: hostile
  conf: 0.995
  attack: T1059,T1071.001,T1102
  scope: file
  all:
  - id: broker-cluster-task-protocol
  - id: objectives/command-and-control/backdoor/tasking/command-http::http-polled-command-output-backdoor
- id: machine-bound-broker-command-agent
  desc: Broker command agent seals its configuration to a Windows host identity
  crit: hostile
  conf: 0.995
  attack: T1059,T1027,T1071.001,T1102
  scope: file
  all:
  - id: broker-cluster-task-protocol
  - id: micro-behaviors/os/sysinfo/machine-id::cryptography-machineguid-path
  - id: micro-behaviors/crypto/symmetric/stream/chacha::chacha20-poly1305-identifier
  - id: micro-behaviors/communications/http/request/result::process-stream-result-post
  any:
  - id: micro-behaviors/process/create
  - id: metadata/lang/natural/diagnostic::pyc-shell-command-description
  - id: micro-behaviors/process/replace/
  needs: 1
- id: mqtt-status-identity-envelope
  desc: Online status and identity-field clues
  crit: component
  conf: 0.98
  scope: file
  near_bytes: 200
  all:
  - id: metadata/lang/source/syntax/key-value::online-status-object-field
  - id: metadata/lang/source/naming/identity::identity-object-field-text
- id: mqtt-host-scoped-remote-tasking
  desc: Host-scoped MQTT channel exposes remote tasks
  crit: hostile
  conf: 0.99
  for:
  - python
  scope: file
  all:
  - id: micro-behaviors/communications/messaging/mqtt::paho-mqtt-subscriber
  - id: mqtt-status-identity-envelope
  - id: objectives/command-and-control/backdoor/tasking/filesystem::mqtt-file-upload-download-topic-pair
  - id: micro-behaviors/os/sysinfo/hostname/query::python-socket-gethostname
- id: mqtt-remoteadmin-tasking-channel
  desc: MQTT remoteadmin tasking channel
  crit: suspicious
  conf: 0.96
  all:
  - id: mqtt-remoteadmin-commands-topic
  - id: mqtt-remoteadmin-results-topic
  any:
  - id: mqtt-remoteadmin-status-topic
  - id: mqtt-ra-agent-client-id
  - id: micro-behaviors/communications/messaging/mqtt::hivemq-broker-endpoint
  - id: micro-behaviors/os/sysinfo/machine-id::machineguid
- id: mqtt-public-broker-rat-channel
  desc: MQTT public broker RAT channel
  crit: hostile
  conf: 0.98
  all:
  - id: mqtt-remoteadmin-tasking-channel
  - id: micro-behaviors/communications/messaging/mqtt::hivemq-broker-endpoint
  any:
  - id: mqtt-ra-agent-client-id
  - id: micro-behaviors/os/sysinfo/machine-id::machineguid
- id: mcp-shell-and-mqtt-tasking
  desc: MCP arbitrary shell tool combined with MQTT tasking
  crit: hostile
  conf: 0.98
  for:
  - python
  scope: file
  all:
  - id: micro-behaviors/process/create/shell/command-string::python-mcp-cwd-shell-execution
  - id: micro-behaviors/communications/messaging/mqtt::paho-mqtt-subscriber
