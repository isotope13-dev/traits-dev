---
defaults:
  for:
  - pe
  - dll
  platforms:
  - windows
composite_rules:
- id: wininet-mac-fingerprint-beacon
  desc: WinInet beacon with MAC fingerprint parameter
  crit: suspicious
  conf: 0.92
  attack: T1071.001
  all:
  - id: micro-behaviors/communications/http/get::internet-open
  - id: micro-behaviors/os/network/interface::get-adapters-info
  - id: micro-behaviors/communications/http/url/query::mac-query-param-format
- id: mpress-wininet-adapter-fingerprint-loader
  desc: MPRESS WinInet adapter-fingerprint loader
  crit: hostile
  conf: 0.98
  attack: T1027.002,T1071.001,T1016
  size_max: 262144
  all:
  - id: objectives/anti-static/pack/mpress::mpress-sparse-dynamic-loader
  - id: micro-behaviors/communications/http/get::internet-open
  - id: micro-behaviors/os/network/interface::get-adapters-info
  - id: metadata/binary/symbols/imports::pe-imports-max-six
  - id: metadata/binary/layout::pe-no-signature-record
  unless:
  - id: metadata/binary/installer/family/
  - id: metadata/signed/platform/
  - id: metadata/signed/developer/
