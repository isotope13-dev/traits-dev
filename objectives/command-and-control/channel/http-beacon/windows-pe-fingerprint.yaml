---
defaults:
  for:
  - pe
  - dll
  platforms:
  - windows
  # Labels do not prove packing; MAC lookup is not a host survey.
  attack: T1071.001
composite_rules:
- id: wininet-mac-fingerprint-beacon
  desc: WinInet beacon with MAC fingerprint parameter
  crit: suspicious
  conf: 0.92
  all:
  - id: micro-behaviors/communications/http/client/wininet::internet-open
  - id: micro-behaviors/network/interface::get-adapters-info
  - id: micro-behaviors/communications/http/url/query::mac-query-param-format
- id: mpress-mac-command-client
  desc: MPRESS MAC beacon with command-record checks
  crit: hostile
  conf: 0.98
  size_max: 262144
  all:
  - id: metadata/binary/section/layout::mpress-two-section-layout
  - id: micro-behaviors/communications/http/url/query::mpress-fragmented-mac-format
  - id: mpress-command-record-header-check
  - id: micro-behaviors/communications/http/client/wininet::internet-open
  - id: micro-behaviors/network/interface::get-adapters-info
  - id: metadata/signed/trust-level::unsigned-missing-signature-record
  unless:
  - id: metadata/binary/installer/family/
  - id: metadata/signed/platform/
  - id: metadata/signed/developer/
- id: mpress-mac-beacon-path-padding
  desc: MPRESS MAC beacon padded with sandbox paths
  crit: hostile
  conf: 0.97
  size_max: 262144
  all:
  - id: mpress-mac-command-client
  - id: objectives/anti-static/obfuscation/string/junking::sandbox-path-family-corpus
  unless:
  - id: metadata/signed/platform/
- id: mpress-mac-beacon-overlay-padding
  desc: MPRESS PE beacons MAC address with padded sandbox overlay
  crit: hostile
  conf: 0.98
  all:
  - id: metadata/binary/section/layout::mpress-two-section-layout
  - id: micro-behaviors/communications/http/url/query::mpress-fragmented-mac-format
  - id: micro-behaviors/network/interface::get-adapters-info
  - id: objectives/anti-static/obfuscation/string/junking::sandbox-execution-path-padding
  unless:
  - id: metadata/signed/platform/
  - id: metadata/signed/developer/
