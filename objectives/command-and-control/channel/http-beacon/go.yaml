defaults:
  crit: hostile
  conf: 0.98
  platforms: [windows, unix]
  for: [go]
  attack: T1071.001,T1573.001
  mbc: B0030,C0021.001

traits:
  - id: go-c2-client-profiles
    desc: Go C2 framework client profiles
    crit: notable
    conf: 0.95
    for: [pe]
    platforms: [windows]
    if:
      type: text
      regex: 'profiles\.\(\*(CobaltStrike|Metasploit|Sliver)\)|meterpreter_reverse_http_INITM_CHECKIN'

  - id: go-c2-profile-endpoints
    desc: C2 framework profile endpoints in Go
    crit: notable
    conf: 0.92
    for: [pe]
    platforms: [windows]
    if:
      type: text
      regex: '(?i)(/login\.aspx|/api/v1/(getsystem|session))'

  - id: go-inventory-c2-beacon
    desc: Go inventory reporting to C2 endpoint
    crit: notable
    conf: 0.92
    for: [pe]
    platforms: [windows]
    if:
      type: text
      regex: 'main\.(sendInventory|polyFingerprint)'

composite_rules:
  - id: go-multi-profile-c2-beacon
    desc: Go multi-profile C2 beaconing implant
    crit: hostile
    conf: 0.98
    for: [pe]
    platforms: [windows]
    attack: T1071.001,T1082,T1041
    mbc: B0030,C0021
    all:
      - id: go-c2-client-profiles
      - id: go-inventory-c2-beacon
    any:
      - id: go-c2-profile-endpoints
      - id: micro-behaviors/communications/http/lib/netlib::go-http-client-do-string

  - id: go-pe-http-c2-with-abused-certificate
    desc: Go PE combines HTTP C2 and ECDH with an abused certificate
    for: [pe]
    platforms: [windows]
    all:
      - id: objectives/anti-static/obfuscation/obfuscator/garble::go-pe-loader-abused-tls-cert
      - id: micro-behaviors/communications/http/server/listener::go-http-server
      - id: micro-behaviors/communications/http/lib/netlib::go-http-client-do-string
      - id: micro-behaviors/crypto/asymmetric/ecdh::ecdh-api-reference
  - id: go-ecdh-http-surveillance-c2
    desc: Go surveillance malware derives an ECDH session key for JSON-over-HTTP C2
    all:
      - id: micro-behaviors/crypto/asymmetric/ecdh::go-ecdh-session-key-derivation
      - id: micro-behaviors/communications/http/post::go-http-post-method
      - id: micro-behaviors/data/serialize/json::go-json-marshal
      - id: objectives/collection/multi-source::go-multi-sensor-surveillance-collection
    near_bytes: 4096
