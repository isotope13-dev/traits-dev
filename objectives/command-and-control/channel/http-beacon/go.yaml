defaults:
  platforms: [windows, unix]
  for: [go]
  attack: T1071.001,T1573.001
  mbc: B0030,C0021.001

composite_rules:
  - id: go-ecdh-http-surveillance-c2
    desc: Go surveillance malware derives an ECDH session key for JSON-over-HTTP C2
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/crypto/asymmetric/ecdh::go-ecdh-session-key-derivation
      - id: micro-behaviors/communications/http/post::go-http-post-method
      - id: micro-behaviors/data/serialize/json::go-json-marshal
      - id: objectives/collection/monitor/capture::go-multi-sensor-surveillance-collection
    near_bytes: 4096
