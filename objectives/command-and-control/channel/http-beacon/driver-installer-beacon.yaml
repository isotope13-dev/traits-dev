defaults:
  platforms: [windows]
  for: [pe]

composite_rules:
  # An unsigned kernel-driver loader that also reports the machine's
  # hardware address to a cleartext HTTP endpoint is phoning home its
  # install base: legitimate driver installers do not beacon MAC/OS
  # inventory to a bare tracking script.
  - id: unsigned-driver-loader-hardware-beacon
    desc: Unsigned driver loader beacons hardware address over HTTP
    crit: hostile
    conf: 0.96
    attack: T1071.001,T1041
    all:
      - id: micro-behaviors/communications/http/url/scheme::cleartext-http-url
      - id: micro-behaviors/communications/http/telemetry::hardware-address-report-parameter
      - id: micro-behaviors/os/kernel/module::zwload-driver-api-reference
      - id: metadata/signed/trust-level::unsigned-missing-signature-record
    unless:
      - id: metadata/signed/platform/
      - id: well-known/app/
