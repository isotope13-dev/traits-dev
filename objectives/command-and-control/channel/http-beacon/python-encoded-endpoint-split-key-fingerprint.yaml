# A Python module that hides its server URL as a base64 literal, assembles a
# signing key from hex fragments with bytes.fromhex, and reports the host's
# platform, machine and Python details is the configuration half of a
# beacon: the encoded URL is the server, the split key authenticates the
# check-in, and the fingerprint tells the server which payload to send.
defaults:
  platforms: [windows, linux, macos]
  for: [python]
  attack: T1132.001,T1071.001,T1082
composite_rules:
  - id: python-encoded-https-endpoint-with-split-key-and-fingerprint
    desc: Python encoded server URL, split key and host profile
    crit: hostile
    conf: 0.8
    all:
      - id: micro-behaviors/communications/url/http-encoded::base64-decoded-http-url
      - id: micro-behaviors/data/decode/hex::python-fromhex
      - id: micro-behaviors/data/serialize/schema-object::python-platform-object-fields
      - id: micro-behaviors/os/sysinfo/platform/host::python-platform-machine
    unless:
      - id: metadata/signed/platform/
