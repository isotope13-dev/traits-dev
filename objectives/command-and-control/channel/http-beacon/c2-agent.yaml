defaults:
  platforms: [windows]
  for: [pe, dll]
  attack: T1071.001
  mbc: B0030
traits:
# The browser User-Agent fragments that lived here as
# chrome-spoof-user-agent-pe--rx-1/-rx-2/-rx-4 (`like Gecko) Chrome`,
# `) AppleWebKit`, `(KHTML`) are present in every browser UA string and every
# web bundle; they now live in micro-behaviors/communications/http/user-agent.
- id: rest-telemetry-endpoint--rx-10
  desc: "Matches 'heartbeat'"
  crit: notable
  conf: 0.85
  size_max: 5242880
  if:
    type: text
    regex: '/api/v[0-9]+/(check[-_]?in|heartbeat)'
- id: rest-telemetry-endpoint--rx-11
  desc: "Matches '/api/v'"
  crit: notable
  conf: 0.85
  size_max: 5242880
  if:
    type: text
    regex: '/api/v[0-9]+/(tasks?|cmd)'
- id: rest-telemetry-endpoint--rx-12
  desc: "Matches 'command'"
  crit: notable
  conf: 0.85
  size_max: 5242880
  if:
    type: text
    regex: '/api/v[0-9]+/(command)'
- id: rest-telemetry-endpoint--rx-13
  desc: 'Matches ''/api/urls?url='''
  crit: notable
  conf: 0.85
  for: [javascript, typescript, powershell, python, shell]
  platforms: [linux, macos, windows]
  size_max: 5242880
  if:
    type: literal
    kind: string
    substr: /api/urls?url=
- id: spaced-chrome-user-agent-pe--rx-1
  desc: Spaced Mozilla Chrome User-Agent prefix
  crit: notable
  conf: 0.9
  size_max: 5242880
  if:
    type: text
    substr: 'Mozilla / 5.0'
- id: spaced-chrome-user-agent-pe--rx-2
  desc: Spaced Chrome User-Agent token
  crit: notable
  conf: 0.9
  size_max: 5242880
  if:
    type: text
    substr: 'Chrome / '
composite_rules:
- id: native-doh-tasking-agent
  desc: Native DoH tasking agent with shell execution
  crit: hostile
  conf: 0.98
  attack: T1071.004,T1059.003,T1105
  all:
  - id: micro-behaviors/communications/http/request/tasking::command-id-field-name
  - id: micro-behaviors/data/serialize/schema-object::structured-sequence-field
  - id: micro-behaviors/fs/path/application/executable::cmd-exe-image-name
  - id: micro-behaviors/communications/http/client/winhttp::winhttp-request-flow
  - id: micro-behaviors/communications/dns/doh::doh-content-type
  unless:
  - id: metadata/signed/platform/
- id: c2-http-beacon-pattern
  desc: Custom C2 HTTP beacon over raw Winsock
  crit: hostile
  conf: 0.95
  arch: [x86-64]
  size_max: 5242880
  # JSON plus Connection: close is an ordinary HTTP server or client. A beacon
  # still needs a tasking path or a spoofed browser User-Agent.
  all:
  - id: micro-behaviors/communications/http/direct-socket::winsock-json-close-header-references
  any:
  - id: micro-behaviors/communications/http/url/telemetry::versioned-telemetry-route
  - id: rest-telemetry-endpoint--rx-10
  - id: rest-telemetry-endpoint--rx-11
  - id: rest-telemetry-endpoint--rx-12
  - id: chrome-spoof-user-agent-pe
  - id: spaced-chrome-spoof-user-agent-pe
  needs: 1
  unless:
  - id: metadata/binary/framework/
- id: loopback-c2-test-deployment
  desc: Loopback-targeted C2 (operational test deployment)
  crit: hostile
  conf: 0.92
  arch: [x86-64]
  size_max: 5242880
  # 127.0.0.1 next to ordinary HTTP headers is a local bind, not a C2 test.
  # The loopback target still has to carry a beacon path or a spoofed UA.
  all:
  - id: micro-behaviors/communications/ip/literal::loopback-ipv4-binary
  - id: micro-behaviors/communications/http/direct-socket::winsock-json-close-header-references
  any:
  - id: micro-behaviors/communications/http/url/telemetry::versioned-telemetry-route
  - id: rest-telemetry-endpoint--rx-10
  - id: rest-telemetry-endpoint--rx-11
  - id: rest-telemetry-endpoint--rx-12
  - id: chrome-spoof-user-agent-pe
  - id: spaced-chrome-spoof-user-agent-pe
  needs: 1
  unless:
  - id: metadata/binary/framework/
  - id: metadata/binary/installer/family/
- id: spaced-chrome-spoof-user-agent-pe
  desc: Spaced Chrome User-Agent in non-Chrome PE
  crit: suspicious
  conf: 0.9
  size_max: 5242880
  all:
  - id: spaced-chrome-user-agent-pe--rx-1
  - id: spaced-chrome-user-agent-pe--rx-2
  - id: micro-behaviors/communications/http/user-agent::chrome-gecko-ua-fragment
  - id: micro-behaviors/communications/http/user-agent::khtml-ua-fragment
  near_bytes: 4096
  unless:
  - id: metadata/binary/framework::dotnet-metadata
  - id: metadata/signed/unknown::google-llc
  - id: metadata/binary/resource/identity::chrome-name-resource-string
  - id: well-known/tool/media/youtube-dl/
- id: http-post-cookie-referer-pe
  desc: PE HTTP POST with Cookie and Referer headers
  crit: suspicious
  conf: 0.9
  size_max: 5242880
  all:
  - id: micro-behaviors/communications/http/post::native-post-method-token
  - id: micro-behaviors/communications/http/cookies::utf16-cookie-header-pe
  - id: micro-behaviors/communications/http/header/custom::utf16-referer-header-pe
  any:
  - id: chrome-spoof-user-agent-pe
  - id: spaced-chrome-spoof-user-agent-pe
  unless:
  - id: metadata/binary/installer/family/
- id: chrome-spoof-user-agent-pe
  desc: Chrome User-Agent used by a WinInet PE client
  crit: notable
  conf: 0.9
  size_max: 5242880
  all:
  - id: micro-behaviors/communications/http/user-agent::chrome-gecko-ua-fragment
  - id: micro-behaviors/communications/http/user-agent::applewebkit-ua-fragment
  - id: micro-behaviors/communications/http/user-agent::browser-mozilla-5-0
  - id: micro-behaviors/communications/http/user-agent::khtml-ua-fragment
  - id: micro-behaviors/communications/http/client/wininet::internet-open
  near_bytes: 4096
  unless:
  - id: metadata/binary/framework::dotnet-metadata
  - id: metadata/signed/unknown::google-llc
  - id: metadata/binary/resource/identity::chrome-name-resource-string
  - id: well-known/tool/media/youtube-dl/
- id: js-hardcoded-ip-post-telemetry
  desc: Hardcoded IP POST telemetry endpoint
  crit: suspicious
  conf: 0.92
  for: [javascript, typescript]
  platforms: [linux, macos, windows]
  near_bytes: 768
  all:
  - id: objectives/command-and-control/infrastructure/ip-port::hardcoded-js-ip-port-endpoint
  - id: rest-telemetry-endpoint
  - id: micro-behaviors/communications/http/request/verb::post-method-text
- id: rest-telemetry-endpoint
  desc: Generic REST telemetry/beacon endpoint path
  crit: component
  conf: 0.85
  for: [pe, dll, javascript, typescript, powershell, python, shell]
  platforms: [linux, macos, windows]
  size_max: 5242880
  any:
  - id: micro-behaviors/communications/http/url/telemetry::versioned-telemetry-route
  - id: rest-telemetry-endpoint--rx-10
  - id: rest-telemetry-endpoint--rx-11
  - id: rest-telemetry-endpoint--rx-12
  - id: rest-telemetry-endpoint--rx-13
