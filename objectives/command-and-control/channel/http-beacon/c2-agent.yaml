defaults:
  platforms: [windows]
  for: [pe, dll]
  attack: T1071.001
  mbc: B0030
traits:
- id: native-command-id-field
  desc: Native agent command identifier field
  crit: notable
  conf: 0.94
  if:
    type: text
    exact: command_id
- id: native-job-id-field
  desc: Native agent job identifier field
  crit: notable
  conf: 0.94
  if:
    type: text
    exact: job_id
- id: chrome-spoof-user-agent-pe--rx-1
  desc: Chrome compatibility User-Agent fragment
  crit: notable
  conf: 0.9
  size_max: 5242880
  # Plain text substring, not PE-specific; widened beyond the file default
  # so chrome-spoof-user-agent-script (a script-source sibling below) can
  # require it too.
  for: [pe, dll, powershell, python, javascript, vbs, batch]
  if:
    type: text
    substr: like Gecko) Chrome
- id: chrome-spoof-user-agent-pe--rx-2
  desc: WebKit compatibility User-Agent fragment
  crit: notable
  conf: 0.9
  size_max: 5242880
  for: [pe, dll, powershell, python, javascript, vbs, batch]
  if:
    type: text
    substr: ) AppleWebKit
- id: chrome-spoof-user-agent-pe--rx-4
  desc: Regex component marker
  crit: component
  conf: 0.9
  size_max: 5242880
  for: [pe, dll, powershell, python, javascript, vbs, batch]
  if:
    type: text
    substr: (KHTML
- id: rest-telemetry-endpoint--rx-9
  desc: "Matches 'telemetry'"
  crit: notable
  conf: 0.85
  size_max: 5242880
  if:
    type: text
    regex: '/api/v[0-9]+/(telemetry|beacon)'
- id: rest-telemetry-endpoint--rx-10
  desc: "Matches 'heartbeat'"
  crit: notable
  conf: 0.85
  size_max: 5242880
  if:
    type: text
    regex: '/api/v[0-9]+/(check[-_]?in|heartbeat)'
- id: rest-telemetry-endpoint--rx-11
  desc: "Matches '/api/v'"
  crit: notable
  conf: 0.85
  size_max: 5242880
  if:
    type: text
    regex: '/api/v[0-9]+/(tasks?|cmd)'
- id: rest-telemetry-endpoint--rx-12
  desc: "Matches 'command'"
  crit: notable
  conf: 0.85
  size_max: 5242880
  if:
    type: text
    regex: '/api/v[0-9]+/(command)'
- id: rest-telemetry-endpoint--rx-13
  desc: 'Matches ''/api/urls?url='''
  crit: notable
  conf: 0.85
  for: [javascript, typescript, powershell, python, shell]
  platforms: [linux, macos, windows]
  size_max: 5242880
  if:
    type: literal
    kind: string
    substr: /api/urls?url=
- id: http-content-type-json
  desc: HTTP Content-Type application/json
  crit: notable
  conf: 0.7
  size_max: 5242880
  if:
    type: text
    substr: 'Content-Type: application/json'
- id: http-connection-close-header
  desc: HTTP Connection close header
  crit: notable
  conf: 0.6
  size_max: 5242880
  if:
    type: text
    exact: 'Connection: close'
- id: spaced-chrome-user-agent-pe--rx-1
  desc: Spaced Mozilla Chrome User-Agent prefix
  crit: notable
  conf: 0.9
  size_max: 5242880
  if:
    type: text
    substr: 'Mozilla / 5.0'
- id: spaced-chrome-user-agent-pe--rx-2
  desc: Spaced Chrome User-Agent token
  crit: notable
  conf: 0.9
  size_max: 5242880
  if:
    type: text
    substr: 'Chrome / '
- id: chrome-spoof-user-agent-pe-cond-2--inline-10717
  desc: "Matches 'chrome.exe'"
  crit: notable
  conf: 0.9
  size_max: 5242880
  if:
    type: text
    regex: '(?i)\b(google ?chrome|chromium|chrome\.exe)\b'
    section: .rsrc
composite_rules:
- id: native-doh-tasking-agent
  desc: Native DoH tasking agent with shell execution
  crit: hostile
  conf: 0.98
  attack: T1071.004,T1059.003,T1105
  all:
  - id: native-command-id-field
  - id: native-job-id-field
  - id: micro-behaviors/process/create/exec::cmd-exe-reference
  - id: micro-behaviors/communications/http/client/winhttp::winhttp-request-flow
  - id: micro-behaviors/communications/dns/doh::doh-content-type
  unless:
  - id: metadata/signed/platform/
- id: raw-tcp-http-cluster
  desc: Raw Winsock HTTP marker cluster
  crit: notable
  conf: 0.92
  needs: 2
  all:
  - id: micro-behaviors/communications/socket/init::ws2-connect-api-string
  any:
  - id: http-content-type-json
  - id: http-connection-close-header
  - id: rest-telemetry-endpoint
  - id: chrome-spoof-user-agent-pe
  - id: chrome-spoof-user-agent-script
  unless:
  - id: metadata/binary/framework/
  - id: well-known/tool/media/youtube-dl/
- id: c2-http-beacon-pattern
  desc: Custom C2 HTTP beacon over raw Winsock
  crit: hostile
  conf: 0.95
  arch: [x86-64]
  size_max: 5242880
  all:
  - id: micro-behaviors/communications/socket/init::ws2-connect-api-string
  - id: raw-tcp-http-cluster
  unless:
  - id: metadata/binary/framework/
- id: loopback-c2-test-deployment
  desc: Loopback-targeted C2 (operational test deployment)
  crit: hostile
  conf: 0.92
  arch: [x86-64]
  size_max: 5242880
  all:
  - id: micro-behaviors/communications/ip/literal::loopback-ipv4-binary
  - id: raw-tcp-http-cluster
  - id: micro-behaviors/communications/socket/init::ws2-connect-api-string
  unless:
  - id: metadata/binary/framework/
  - id: metadata/binary/installer/family/
- id: spaced-chrome-spoof-user-agent-pe
  desc: Spaced Chrome User-Agent in non-Chrome PE
  crit: suspicious
  conf: 0.9
  size_max: 5242880
  all:
  - id: spaced-chrome-user-agent-pe--rx-1
  - id: spaced-chrome-user-agent-pe--rx-2
  - id: chrome-spoof-user-agent-pe--rx-1
  - id: chrome-spoof-user-agent-pe--rx-4
  near_bytes: 4096
  unless:
  - id: metadata/binary/framework::dotnet-metadata
  - id: metadata/signed/developer::google-llc
  - id: chrome-spoof-user-agent-pe-cond-2--inline-10717
  - id: well-known/tool/media/youtube-dl/
- id: http-post-cookie-referer-pe
  desc: PE HTTP POST with Cookie and Referer headers
  crit: suspicious
  conf: 0.9
  size_max: 5242880
  all:
  - id: micro-behaviors/communications/http/post::post-string-pe
  - id: micro-behaviors/communications/http/cookies::utf16-cookie-header-pe
  - id: micro-behaviors/communications/http/header/custom::utf16-referer-header-pe
  any:
  - id: chrome-spoof-user-agent-pe
  - id: spaced-chrome-spoof-user-agent-pe
  unless:
  - id: metadata/binary/installer/family/
- id: chrome-spoof-user-agent-pe
  desc: Chrome User-Agent used by a WinInet PE client
  crit: notable
  conf: 0.9
  size_max: 5242880
  all:
  - id: chrome-spoof-user-agent-pe--rx-1
  - id: chrome-spoof-user-agent-pe--rx-2
  - id: micro-behaviors/communications/http/user-agent::browser-mozilla-5-0
  - id: chrome-spoof-user-agent-pe--rx-4
  - id: micro-behaviors/communications/http/client/wininet::internet-open
  near_bytes: 4096
  unless:
  - id: metadata/binary/framework::dotnet-metadata
  - id: metadata/signed/developer::google-llc
  - id: chrome-spoof-user-agent-pe-cond-2--inline-10717
  - id: well-known/tool/media/youtube-dl/
- id: chrome-spoof-user-agent-script
  desc: Chrome User-Agent in script source
  crit: notable
  conf: 0.75
  for: [powershell, python, javascript, vbs, batch]
  platforms: [linux, macos, windows]
  all:
  - id: objectives/command-and-control/channel/http-beacon::chrome-spoof-user-agent-pe--rx-1
  - id: objectives/command-and-control/channel/http-beacon::chrome-spoof-user-agent-pe--rx-2
  - id: micro-behaviors/communications/http/user-agent::browser-mozilla-5-0
  - id: objectives/command-and-control/channel/http-beacon::chrome-spoof-user-agent-pe--rx-4
  near_bytes: 4096
  unless:
  - id: well-known/app/media/svtplay-dl
- id: js-hardcoded-ip-post-telemetry
  desc: Hardcoded IP POST telemetry endpoint
  crit: suspicious
  conf: 0.92
  for: [javascript, typescript]
  platforms: [linux, macos, windows]
  near_bytes: 768
  all:
  - id: objectives/command-and-control/infrastructure/ip-port::hardcoded-js-ip-port-endpoint
  - id: rest-telemetry-endpoint
  - id: micro-behaviors/communications/http/request/client::post-method-text
- id: rest-telemetry-endpoint
  desc: Generic REST telemetry/beacon endpoint path
  crit: component
  conf: 0.85
  for: [pe, dll, javascript, typescript, powershell, python, shell]
  platforms: [linux, macos, windows]
  size_max: 5242880
  any:
  - id: rest-telemetry-endpoint--rx-9
  - id: rest-telemetry-endpoint--rx-10
  - id: rest-telemetry-endpoint--rx-11
  - id: rest-telemetry-endpoint--rx-12
  - id: rest-telemetry-endpoint--rx-13
