defaults:
  attack: T1567.002
  platforms:
    - unix
    - windows
  for: [scripts, binaries]
composite_rules:
  - id: telegram-file-exfil
    for: [javascript]
    desc: Telegram Bot API file upload with token
    crit: hostile
    conf: 0.95
    all:
      - id: micro-behaviors/communications/http/services/telegram::telegram-send-document-url
      - id: micro-behaviors/communications/messaging/send::telegram-bot-api-token
