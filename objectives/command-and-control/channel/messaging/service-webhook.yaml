defaults:
  attack: T1567.002
  platforms:
    - unix
    - windows
  for: [scripts, binaries]
traits:
  - id: telegram-bot-api-token
    desc: Telegram Bot API usage with token
    crit: suspicious
    conf: 1.0
    if:
      type: literal
      regex: (?i)api\.telegram\.org/bot\d+:[a-zA-Z0-9_-]+/
    unless:
      - id: metadata/package/testing/
    not:
      - substr: alphanumeric_characters
  - id: telegram-bot-token-sendmessage-path
    desc: Telegram bot token sendMessage path
    crit: suspicious
    conf: 0.96
    if:
      type: text
      regex: '/bot\d{8,12}:[A-Za-z0-9_-]{30,60}/sendMessage'
composite_rules:
  - id: telegram-file-exfil
    desc: Telegram Bot API file upload with token
    crit: hostile
    conf: 0.95
    all:
      - id: micro-behaviors/communications/http/services/telegram::telegram-send-document-url
      - id: telegram-bot-api-token
