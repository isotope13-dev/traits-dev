defaults:
  platforms: [unix, windows]
  for: [python]
  attack: T1102
traits:
  - id: telegram-stealth-shell-alias-map
    desc: Stealth map aliases Telegram shell commands
    crit: suspicious
    conf: 0.94
    if:
      type: text
      regex: '(?s)STEALTH\s*=\s*\{.{0,400}["'']\.?s["'']\s*:\s*["'']\.sh["'']'

  - id: telegram-printenv-command-literal
    desc: Telegram bot .printenv command literal
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '["'']\.printenv["'']'

  - id: telegram-get-all-exfil-literal
    desc: Telegram bot get-all backup command
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '["'']get all["'']'

composite_rules:
  - id: telegram-bot-shell-command
    desc: Telegram bot executes shell commands
    crit: hostile
    conf: 0.99
    all:
      - id: micro-behaviors/communications/http/services/telegram::py-telebot-handler
      - id: micro-behaviors/communications/http/services/telegram::py-telebot-polling
      - id: micro-behaviors/process/create/subprocess::check-output
      - id: micro-behaviors/process/create/shell/command-string::python-subprocess-shell-true

  # PTB ApplicationBuilder bots that shell out on inbound messages. The
  # shell legs must sit in the same file as the bot: check_output and
  # shell=True are everywhere in a shipped package, so an archive-wide join
  # read an allowlist-gated messaging adapter as a remote shell because
  # unrelated members happened to call subprocess.
  - id: ptb-telegram-remote-shell
    desc: PTB Telegram bot runs shell=True commands
    crit: hostile
    conf: 0.98
    attack: T1059.004,T1102
    scope: file
    for: [python, whl, zip, python-sdist]
    all:
      - id: micro-behaviors/communications/http/services/telegram::python-telegram-ext-application-builder
      - id: micro-behaviors/communications/http/services/telegram::python-telegram-ext-run-polling
      - id: micro-behaviors/process/create/subprocess::check-output
    any:
      - id: micro-behaviors/process/create/shell/command-string::python-subprocess-shell-true
      - id: micro-behaviors/process/create/shell-subprocess::check-output-shell-true
    needs: 1

  # Polling configuration is neutral; desktop interference supplies intent.
  - id: python-telegram-desktop-lockdown-rat
    desc: Telegram polling bot locks desktop input and kills Explorer
    crit: hostile
    conf: 0.99
    attack: T1102,T1565.001,T1489
    for: [python, whl, zip, python-sdist]
    scope: archive
    all:
      - id: micro-behaviors/communications/http/services/telegram::python-telegram-hardcoded-polling-config
      - id: micro-behaviors/process/terminate/command::taskkill-explorer-force
    any:
      - id: micro-behaviors/hardware/input/block::keyboard-block-key-call
      - id: micro-behaviors/hardware/input/keyboard/listener::pynput-suppress-event-call

  - id: python-telegram-session-theft-c2
    desc: Telegram polling bot remotely tasks session harvesting
    crit: hostile
    conf: 0.995
    attack: T1102,T1539,T1041
    for: [python, whl, zip, python-sdist]
    scope: archive
    all:
      - id: micro-behaviors/communications/http/services/telegram::python-telegram-ext-run-polling
      - id: micro-behaviors/communications/http/services/telegram::python-telegram-command-handler-import
      - id: micro-behaviors/communications/http/auth::python-hardcoded-bot-token
      - id: objectives/credential-access/messaging/telegram::python-telegram-session-artifact-harvest
