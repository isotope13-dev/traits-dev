defaults:
  platforms: [unix, windows]
  for: [python]
  attack: T1102
traits:
  - id: py-telebot-handler
    desc: Python telebot message handler
    crit: suspicious
    conf: 0.9
    unless:
      - id: well-known/lib/network/pyTelegramBotAPI::telebot-package-path
      - id: well-known/lib/network/pyTelegramBotAPI::pytelegrambotapi-package-archive
    if:
      type: text
      substr: "@bot.message_handler"
  - id: py-telebot-polling
    desc: Python telebot polling loop
    crit: suspicious
    conf: 0.9
    unless:
      - id: well-known/lib/network/pyTelegramBotAPI::telebot-package-path
      - id: well-known/lib/network/pyTelegramBotAPI::pytelegrambotapi-package-archive
    if:
      type: text
      regex: '\b(bot|telebot)\.infinity_polling\s*\('

  # Stealth short aliases that remap to shell/exfil commands (infogram-style RATs).
  - id: telegram-stealth-shell-alias-map
    desc: Stealth map aliases Telegram shell commands
    crit: suspicious
    conf: 0.94
    if:
      type: text
      regex: '(?s)STEALTH\s*=\s*\{.{0,400}["'']\.?s["'']\s*:\s*["'']\.sh["'']'

  - id: telegram-printenv-command-literal
    desc: Telegram bot .printenv command literal
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '["'']\.printenv["'']'

  - id: telegram-get-all-exfil-literal
    desc: Telegram bot get-all backup command
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '["'']get all["'']'

  - id: python-base64-decoded-bot-token-assignment
    desc: Python bot token from base64 decode helper
    crit: suspicious
    conf: 0.96
    if:
      type: text
      regex: 'BOT_TOKEN\s*=\s*d\(["''][A-Za-z0-9+/=]{16,}["'']\)'

composite_rules:
  - id: telegram-bot-shell-command
    desc: Telegram bot executes shell commands
    crit: hostile
    conf: 0.99
    all:
      - id: py-telebot-handler
      - id: py-telebot-polling
      - id: micro-behaviors/process/create/subprocess::check-output
      - id: micro-behaviors/process/create/subprocess::shell-true

  # PTB ApplicationBuilder bots that shell out on inbound messages.
  - id: ptb-telegram-remote-shell
    desc: PTB Telegram bot runs shell=True commands
    crit: hostile
    conf: 0.98
    attack: T1059.004,T1102
    scope: archive
    for: [python, whl, zip, archives]
    all:
      - id: micro-behaviors/communications/http/services/telegram::python-telegram-ext-application-builder
      - id: micro-behaviors/communications/http/services/telegram::python-telegram-ext-run-polling
      - id: micro-behaviors/process/create/subprocess::check-output
    any:
      - id: micro-behaviors/process/create/subprocess::shell-true
      - id: micro-behaviors/process/create/subprocess-shell::check-output-shell-true
    needs: 1

  - id: python-telegram-requests-polling-c2
    desc: Python polls Telegram getUpdates with hardcoded bot config
    crit: hostile
    conf: 0.98
    attack: T1102,T1059.004
    for: [python, whl, zip, archives]
    scope: archive
    all:
      - id: micro-behaviors/communications/http/services/telegram::python-telegram-get-updates
      - id: micro-behaviors/communications/http/services/telegram::python-telegram-api-url-template
    any:
      - id: objectives/exfiltration/messaging/telegram::python-hardcoded-bot-token
      - id: python-base64-decoded-bot-token-assignment

  - id: python-telegram-desktop-lockdown-rat
    desc: Telegram polling bot locks desktop input and kills Explorer
    crit: hostile
    conf: 0.99
    attack: T1102,T1565.001,T1489
    for: [python, whl, zip, archives]
    scope: archive
    all:
      - id: python-telegram-requests-polling-c2
      - id: micro-behaviors/process/terminate/kill::python-subprocess-taskkill-explorer
    any:
      - id: objectives/collection/keylog/capture::keyboard-block-key-call
      - id: micro-behaviors/hardware/input/keyboard/listener::pynput-suppress-event-call
