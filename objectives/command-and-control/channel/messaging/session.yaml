# Session decentralized messenger — ransom/C2 contact channel.
#
# Session is an end-to-end-encrypted messenger whose account IDs are a
# 66-char hex string with a 05 prefix (operator-public, like a TOX ID).
# Malware/ransomware operators embed a Session account ID so victims can
# contact them with no provider to subpoena. The ID *format* is generic
# (any Session ID matches) — it's a contact-channel indicator, not a
# specific IOC — so family composites gate it with their own markers.
defaults:
  platforms: [linux, macos, windows]
  for: [binaries]
  attack: T1219
  mbc: B0030
traits:
  - id: session-messenger-account-id
    desc: Session messenger 05-prefix account ID
    crit: notable
    conf: 0.85
    if:
      type: text
      regex: '\b05[0-9a-f]{64}\b'
      section: rdata

  # Victim-facing notes and scripts carry the same 05-prefix ID as plain
  # text, where no PE section constraint applies. The Session label on
  # the same line distinguishes the account ID from a bare hex digest.
  - id: session-messenger-account-id-text
    desc: Labeled Session messenger account ID
    crit: notable
    conf: 0.9
    for: [scripts, text, html]
    if:
      type: text
      regex: '(?i)session[^\n]{0,40}05[0-9a-f]{64}\b'

  # Ransom notes that omit the account ID still direct the victim to
  # install Session from its official download page (as qTox notes do).
  - id: session-download-url
    desc: Session messenger download URL
    crit: notable
    conf: 0.9
    for: [binaries, scripts, text, html]
    if:
      type: text
      substr: 'getsession.org/download'

composite_rules:
  - id: session-contact-channel
    desc: Session messenger contact channel
    crit: notable
    conf: 0.9
    for: [binaries, scripts, text, html]
    any:
      - id: session-messenger-account-id
      - id: session-messenger-account-id-text
      - id: session-download-url
