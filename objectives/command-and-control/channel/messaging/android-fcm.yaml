# FCM message handlers become a surveillance channel when they dispatch
# remote commands into SMS and other sensitive device-control functions.
defaults:
  platforms: [android]
  for: [android_apk, zip, dex]
  attack: T1624.001,T1636.004,T1071.001
  mbc: F0004,B0030

traits:
  - id: android-dex-firebase-messaging-handler
    desc: DEX subclasses Firebase messaging service
    crit: notable
    conf: 0.96
    for: [dex]
    if:
      type: text
      substr: FirebaseMessagingService

  - id: android-dex-remote-command-dispatcher
    desc: DEX dispatches received commands to an executor
    crit: notable
    conf: 0.95
    for: [dex]
    if:
      type: text
      exact: processReceivedCommand

  - id: android-dex-command-executor
    desc: DEX executes dispatched commands
    crit: notable
    conf: 0.95
    for: [dex]
    if:
      type: text
      exact: executeCommand

  - id: android-dex-bank-command-tokens
    desc: DEX names banking control commands
    crit: suspicious
    conf: 0.96
    for: [dex]
    if:
      type: text
      regex: '\b(GET_ALL_BANK_SMS|GET_CARDS|GET_BALANCES)\b'

  - id: android-dex-sms-command-tokens
    desc: DEX names SMS control commands
    crit: suspicious
    conf: 0.96
    for: [dex]
    if:
      type: text
      regex: '\b(SEND_SMS|GET_USSD|SEND_ALL_SMS_REALTIME)\b'

  - id: android-dex-surveillance-command-tokens
    desc: DEX names surveillance commands
    crit: suspicious
    conf: 0.96
    for: [dex]
    if:
      type: text
      regex: '\b(GET_CONTACTS|GET_GALLERY|GET_SCREENSHOTS|HIDE)\b'

composite_rules:
  - id: android-dex-sensitive-command-family
    desc: DEX names sensitive device commands
    crit: suspicious
    conf: 0.97
    for: [dex]
    needs: 2
    any:
      - id: android-dex-bank-command-tokens
      - id: android-dex-sms-command-tokens
      - id: android-dex-surveillance-command-tokens

  - id: android-fcm-banking-surveillance-rat
    desc: FCM remotely controls Android SMS and surveillance functions
    crit: hostile
    conf: 0.99
    scope: archive
    all:
      - id: android-dex-firebase-messaging-handler
      - id: android-dex-remote-command-dispatcher
      - id: android-dex-command-executor
      - id: android-dex-sensitive-command-family
      - id: objectives/collection/messaging/sms::android-dex-sms-inbox-file-upload
