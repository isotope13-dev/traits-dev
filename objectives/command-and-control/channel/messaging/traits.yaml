defaults:
  platforms: [windows, linux, macos]
  for: [elf, macho, pe]
traits:
  - id: telegram-session-store
    desc: Telegram local session store
    crit: notable
    conf: 0.88
    platforms: [windows]
    for: [pe]
    if:
      type: text
      substr: telegram.session
      section: .rdata
  - id: telegram-auth-request-code
    desc: Telegram auth request code command
    crit: suspicious
    conf: 0.95
    platforms: [windows]
    for: [pe]
    if:
      type: text
      substr: cmd_auth_request_code
      section: .rdata
  - id: telegram-auth-login-commands
    desc: Telegram sign-in and password commands
    crit: suspicious
    conf: 0.95
    platforms: [windows]
    for: [pe]
    if:
      type: text
      regex: 'cmd_auth_(sign_in|check_password)'
      section: .rdata
  # Bare MTProto method names are not an intent signal: Go-Enry's language
  # frequency corpus embeds the same names in ordinary Go applications.
  - id: telegram-list-command
    desc: Telegram remote file listing command
    crit: suspicious
    conf: 0.94
    platforms: [windows]
    for: [pe]
    if:
      type: text
      substr: cmd_get_files
      section: .rdata
  - id: telegram-download-command
    desc: Telegram remote file download command
    crit: suspicious
    conf: 0.95
    platforms: [windows]
    for: [pe]
    if:
      type: text
      substr: cmd_download_fil
      section: .rdata
  - id: telegram-upload-move-command-set
    desc: Telegram upload and move commands
    crit: suspicious
    conf: 0.95
    platforms: [windows]
    for: [pe]
    if:
      type: text
      regex: 'cmd_(upload_file|move_files)'
      section: .rdata
  - id: telegram-folder-command-set
    desc: Telegram create and delete folder commands
    crit: suspicious
    conf: 0.96
    platforms: [windows]
    for: [pe]
    if:
      type: text
      regex: 'cmd_(create_folde|delete_folde)'
      section: .rdata
  - id: telegram-drive-folder-tag
    desc: Telegram drive folder workflow tag
    crit: component
    conf: 0.92
    platforms: [windows]
    for: [pe]
    if:
      type: text
      substr: "[telegram-drive-folder]"
      section: .rdata
  - id: telegram-state-command
    desc: Telegram state command handler
    crit: component
    conf: 0.9
    platforms: [windows]
    for: [pe]
    if:
      type: text
      substr: app_lib::commands::TelegramState
      section: .rdata
composite_rules:
  - id: rust-telegram-command-c2
    desc: Rust Telegram command-and-control bot
    crit: hostile
    conf: 0.98
    attack: T1059,T1102
    for: [rust]
    all:
      - id: micro-behaviors/communications/http/services/telegram::rust-telegram-bot-api-client
      - id: micro-behaviors/data/control-flow/dispatch::rust-command-handler-reference
    near_bytes: 8192

  - id: telegram-remote-file-command-matrix
    desc: Telegram remote file command matrix
    crit: suspicious
    conf: 0.96
    platforms: [windows]
    for: [pe]
    any:
      - id: telegram-list-command
      - id: telegram-download-command
      - id: telegram-upload-move-command-set
      - id: telegram-folder-command-set
    needs: 3
  - id: telegram-mtproto-remote-file-workflow
    desc: Telegram MTProto remote file workflow
    crit: suspicious
    conf: 0.96
    platforms: [windows]
    for: [pe]
    all:
      - id: telegram-remote-file-command-matrix
      - id: telegram-folder-command-set
    any:
      - id: telegram-auth-request-code
      - id: telegram-auth-login-commands
  - id: telegram-mtproto-file-c2
    desc: Telegram MTProto remote file C2
    crit: hostile
    conf: 0.98
    platforms: [windows]
    for: [pe]
    all:
      - id: telegram-mtproto-remote-file-workflow
    any:
      - id: telegram-session-store
      - id: telegram-state-command
      - id: telegram-drive-folder-tag
      - id: micro-behaviors/process/create/exec::tauri-shell-open-plugin
    needs: 2
  - id: telegram-mtproto-surveillance-c2
    desc: Telegram remote file and surveillance C2
    crit: hostile
    conf: 0.98
    platforms: [windows]
    for: [pe]
    all:
      - id: telegram-mtproto-file-c2
    any:
      - id: micro-behaviors/hardware/input/raw::windows-raw-input
      - id: micro-behaviors/hardware/display/screen::gdi-dib-bitmap-transfer-primitives
      - id: micro-behaviors/process/create/shell/lang::powershell-keyword
