defaults:
  platforms:
  - windows
  for:
  - c
  - cpp
composite_rules:
- id: host-gated-telegram-command-dispatch
  desc: Host-gated Telegram response command dispatch
  crit: hostile
  conf: 0.98
  attack: T1102.002,T1480.001
  all:
  - id: objectives/execution/trigger/host-identity::hostname-crypto-digest-execution-gate
  - id: micro-behaviors/communications/http/services/telegram::telegram-api-host
  - id: micro-behaviors/communications/http/services/telegram::telegram-get-updates-path
  - id: micro-behaviors/communications/http/client/winhttp::winhttp-proxy-aware-resolution
  - id: micro-behaviors/os/user/lookup::get-user-name
  - id: micro-behaviors/data/control-flow/branch::native-update-response-string-test
  - id: micro-behaviors/os/privilege/elevation::uac-policy-self-runas-profile
