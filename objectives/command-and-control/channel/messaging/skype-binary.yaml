defaults:
  platforms:
  - windows
  for:
  - pe
  - dll
  crit: notable
  conf: 0.96
  attack: T1102.002
traits:
- id: skype-control-api-attach-name
  desc: Skype Control API attach message name
  if:
    type: text
    exact: SkypeControlAPIAttach
- id: skype-control-api-discover-name
  desc: Skype Control API discover message name
  if:
    type: text
    exact: SkypeControlAPIDiscover
- id: skype-chat-create-command-text
  desc: Skype CHAT CREATE command template
  if:
    type: text
    regex: ^CHAT CREATE %s
- id: skype-chatmessage-command-text
  desc: Skype CHATMESSAGE send command template
  if:
    type: text
    regex: ^CHATMESSAGE %s
- id: skype-search-friends-command
  desc: Skype SEARCH FRIENDS contact list command
  if:
    type: text
    exact: SEARCH FRIENDS
- id: skype-get-user-property-command
  desc: Skype GET USER profile property commands
  conf: 0.97
  count_min: 6
  if:
    type: text
    regex: ^GET USER %s [A-Z_]{3,24}$
- id: skype-get-profile-property-command
  desc: Skype GET PROFILE property commands
  conf: 0.97
  count_min: 6
  if:
    type: text
    regex: ^GET PROFILE [A-Z_]{3,24}$
- id: skype-set-userstatus-command
  desc: Skype SET USERSTATUS presence command
  if:
    type: text
    regex: ^SET USERSTATUS [A-Z]{2,12}$
- id: skype-api-confirm-form-class
  desc: Skype API access confirmation form class
  conf: 0.97
  if:
    type: text
    regex: ^[tT][sS]kConfirmForm\.
composite_rules:
- id: skype-control-api-client-binary
  desc: Compiled Skype Control API client
  crit: suspicious
  conf: 0.95
  all:
  - id: skype-control-api-attach-name
  - id: skype-control-api-discover-name
  unless:
  - id: metadata/signed/platform/
  - id: well-known/app
  - id: well-known/lib
  - id: well-known/tool
- id: skype-api-presence-concealment
  desc: Skype API self-authorises and hides presence
  crit: suspicious
  conf: 0.95
  attack: T1562.006
  all:
  - id: skype-control-api-client-binary
  any:
  - id: skype-api-confirm-form-class
  - id: skype-set-userstatus-command
  unless:
  - id: metadata/signed/platform/
  - id: well-known/app
- id: skype-contact-profile-harvest
  desc: Skype API harvests account and contact profiles
  crit: suspicious
  conf: 0.96
  attack: T1087.003
  all:
  - id: skype-control-api-client-binary
  any:
  - id: skype-get-user-property-command
  - id: skype-get-profile-property-command
  unless:
  - id: metadata/signed/platform/
  - id: well-known/app
