# A messaging-connected agent that runs local shell commands unattended is a
# remote command channel. The model/vendor is intentionally not part of the
# matcher; the same shape can be implemented through Telegram, another chat
# service, or a future agent gateway.
defaults:
  platforms: [windows, unix]
  for: [python, javascript, typescript]
  attack: T1059,T1102

composite_rules:
  - id: unattended-agent-messaging-shell
    desc: Unattended agent accepts messaging and runs shell
    crit: hostile
    conf: 0.96
    all:
      - id: objectives/execution/automation/agent::agent-unattended-execution-mode
      - id: micro-behaviors/communications/http/services/telegram::telegram-api-host
      - id: micro-behaviors/communications/http/services/telegram::telegram-get-updates-endpoint
    any:
      - id: micro-behaviors/process/create/subprocess::process-execution
      - id: micro-behaviors/process/create/shell/bridge::js-exec
      - id: micro-behaviors/process/create/shell/bridge::js-execsync
    near_lines: 80
