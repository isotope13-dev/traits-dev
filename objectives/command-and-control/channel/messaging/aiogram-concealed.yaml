# Split credentials plus suppressed logging distinguish this from normal bots.
# Polling alone does not establish remote execution or theft.
defaults:
  for: [python]
  platforms: [unix, windows]
composite_rules:
  - id: concealed-threaded-telegram-polling
    for: [python, whl, zip, python-sdist]
    desc: Concealed threaded Telegram polling
    crit: suspicious
    conf: 0.98
    all:
      - id: metadata/import/python/aiogram
      - id: micro-behaviors/communications/messaging/receive::python-dispatcher-start-polling
      - id: micro-behaviors/os/telemetry/logging/configure::python-above-critical-log-level
      - id: objectives/anti-static/obfuscation/string/fragmentation::split-telegram-token-assignment
    any:
      - id: micro-behaviors/process/create/thread::python-daemon-thread
      - id: micro-behaviors/process/create/thread::python-nondaemon-thread-explicit
