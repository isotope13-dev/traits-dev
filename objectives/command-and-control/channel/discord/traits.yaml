defaults:
  platforms:
  - unix
  - windows
  for:
  - scripts
  - binaries
  - csharp
traits:
- id: discord-fake-email
  desc: Discord URL masquerading as email
  crit: suspicious
  conf: 0.9
  if:
    type: text
    regex: (^|[\s"'`<])(discord\.gg|discord(app)?\.com\b)[^\s@]{0,12}@[a-z0-9.-]+\.[a-z]{2,}
    case_insensitive: true
- id: discord-gateway-message-content-intent
  desc: Discord bot reads message content
  crit: notable
  conf: 0.86
  if:
    type: text
    regex: \bGatewayIntents\.MessageContent\b|\bMessageContent\b.{0,80}\bGuildMessages\b
- id: discord-gateway-guild-messages-intent
  desc: Discord bot reads guild messages
  crit: notable
  conf: 0.84
  if:
    type: text
    regex: \bGatewayIntents\.GuildMessages\b|\bGuildMessages\b.{0,80}\bMessageContent\b
- id: discord-restore-manifest-marker
  desc: restore_manifest token in payload restore
  crit: component
  conf: 0.9
  if:
    type: text
    word: restore_manifest
- id: discord-restore-chunk-marker
  desc: restore_chunk token in payload restore
  crit: component
  conf: 0.9
  if:
    type: text
    word: restore_chunk
- id: discord-restore-complete-marker
  desc: restore_complete token in payload restore
  crit: component
  conf: 0.9
  if:
    type: text
    word: restore_complete
- id: discord-agent-relay-manager
  desc: Discord agent relay manager
  crit: suspicious
  conf: 0.92
  if:
    type: text
    word: AgentRelayManager
- id: discord-bot-token-literal
  desc: Hardcoded Discord bot token
  crit: suspicious
  conf: 0.96
  for:
  - python
  - javascript
  - typescript
  if:
    type: string_literal
    regex: ^(mfa\.[A-Za-z0-9_-]{80,}|[MN][A-Za-z0-9_-]{23,25}\.[A-Za-z0-9_-]{6}\.[A-Za-z0-9_-]{27,})$
  not:
  - regex: ^eyJ
  unless:
  - id: metadata/package/testing/presence/secret-fixture::secret-detector-fixture-context
  - id: metadata/package/testing/presence/detector::secret-detector-unit-assertion
- id: discord-bot-start-token
  desc: Discord bot starts with token
  crit: suspicious
  conf: 0.94
  for:
  - python
  if:
    type: text
    regex: \bbot\.start\s*\(\s*TOKEN\s*\)|\bbot\.run\s*\(\s*TOKEN\s*\)
- id: python-z85-lzma-marshal-exec-loader
  desc: Decodes a Z85 marshal payload
  crit: suspicious
  conf: 0.98
  for:
  - python
  if:
    type: text
    regex: base64\.z85decode[\s\S]{0,700}marshal\.loads
- id: python-package-import-starts-helper-main
  desc: Initializer calls pyhelperd.main()
  crit: suspicious
  conf: 0.92
  for:
  - python
  if:
    type: text
    regex: (?s)import\s+pyhelperd[\s\S]{0,250}pyhelperd\.main\(\)
- id: python-discord-placeholder-token-assignment
  desc: Python Discord helper has token placeholder
  crit: component
  conf: 0.94
  for:
  - python
  if:
    type: text
    substr: YOUR_TOKEN_HERE
- id: discord-rat-channel-create
  desc: Discord RAT victim channel creation routine
  crit: suspicious
  conf: 0.98
  for:
  - binaries
  - csharp
  if:
    type: text
    substr: CreateHostingChannel
composite_rules:
- id: discord-chunked-payload-restore
  desc: Discord chunked payload restore
  crit: hostile
  conf: 0.98
  all:
  - id: discord-restore-manifest-marker
  - id: discord-restore-chunk-marker
  - id: discord-restore-complete-marker
  any:
  - id: micro-behaviors/communications/http/services/discord::api-url
  - id: well-known/app/communication/discord::discord-cdn-download-url
  - id: discord-gateway-message-content-intent
  - id: discord-gateway-guild-messages-intent
- id: discord-python-bot-c2
  desc: Python Discord bot C2 channel
  crit: suspicious
  conf: 0.96
  for:
  - python
  all:
  - id: micro-behaviors/communications/http/services/discord::python-bot-framework-import
  any:
  - id: discord-bot-token-literal
  - id: discord-bot-start-token
  - id: micro-behaviors/communications/http/services/discord::python-command-decorator
  needs: 2
- id: python-discord-bot-shell
  desc: Discord client shells out a variable
  crit: hostile
  conf: 0.96
  for:
  - python
  scope: file
  near_lines: 180
  all:
  - id: micro-behaviors/process/create/shell/variable-command::python-popen-variable-shell
  - id: micro-behaviors/communications/http/services/discord::python-discord-client-call
- id: python-install-starts-discord-shell
  desc: Install hook starts a Discord shell bot
  crit: hostile
  conf: 0.96
  scope: archive
  for:
  - python
  - python-sdist
  - whl
  - zip
  all:
  - id: python-discord-bot-shell
  - id: metadata/build/package/recipe/setup-hooks::setuptools-install-class
- id: discord-hardcoded-bot-token-c2
  desc: Hardcoded Discord bot token C2
  crit: suspicious
  conf: 0.97
  for:
  - python
  all:
  - id: micro-behaviors/communications/http/services/discord::python-bot-framework-import
  - id: discord-bot-token-literal
  - id: discord-bot-start-token
- id: discord-token-shaped-embedded-dropper
  desc: Discord-token decoy paired with an embedded Python dropper
  crit: hostile
  conf: 0.99
  attack: T1027,T1140,T1059.006,T1195.002
  for:
  - python
  scope: file
  all:
  - id: discord-bot-token-literal
  - id: objectives/execution/payload/file-exec/command/shell::python-encoded-carrier-write-exec-dropper
- id: python-import-starts-detached-discord-marshal-bot
  desc: Package import attempts to start an encoded Discord helper
  crit: hostile
  conf: 0.99
  attack: T1059.006,T1105,T1219,T1195.002
  scope: outer
  for:
  - python
  - python-sdist
  - whl
  - zip
  - tar
  all:
  - id: python-z85-lzma-marshal-exec-loader
  - id: micro-behaviors/data/compression::python-module-decompress-call
  - id: micro-behaviors/data/serialize/unsafe::marshal-loads-symbol
  - id: micro-behaviors/process/interpreter/eval/python-builtins::exec-builtin
  - id: micro-behaviors/process/daemonize/spawn::python-popen-detached-process
  - id: python-package-import-starts-helper-main
  - id: discord-bot-token-literal
- id: python-encoded-discord-spyware-helper
  desc: Encoded Discord helper carries spyware capabilities
  crit: hostile
  conf: 0.99
  attack: T1056.001,T1115,T1113,T1105,T1219,T1195.002
  scope: file
  for:
  - python
  all:
  - id: python-z85-lzma-marshal-exec-loader
  - id: micro-behaviors/process/daemonize/spawn::python-popen-detached-process
  - id: python-discord-placeholder-token-assignment
  - id: metadata/package/dependencies/declaration::python-source-discord-client-dependency
  - id: metadata/package/dependencies/declaration::python-source-keyboard-monitor-dependency
  - id: metadata/package/dependencies/declaration::python-source-clipboard-dependency
  - id: metadata/package/dependencies/declaration::python-source-screenshot-dependency
- id: dotnet-discord-c2-rat
  desc: .NET RAT uses Discord bot for remote administration and tasking
  crit: hostile
  conf: 0.99
  attack: T1071.001,T1219
  for:
  - binaries
  - csharp
  all:
  - id: micro-behaviors/communications/websocket/client::dotnet-client-websocket
  - id: discord-rat-channel-create
