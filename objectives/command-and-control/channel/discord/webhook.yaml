# Discord C2 Communications
# Composed objectives for Discord-based C2
defaults:
  platforms: [linux, macos, windows, unix, android, ios]
  for: [javascript, typescript]
composite_rules:
  - id: discord-webhook-activation
    desc: Discord webhook activation/kill-switch check
    crit: hostile
    conf: 0.95
    attack: T1071.001
    all:
      - id: micro-behaviors/communications/http/webhook::discord-webhook-path
      - id: micro-behaviors/communications/http/webhook::webhook-name-check
      - id: micro-behaviors/communications/http/get::get
  - id: discord-permanent-invite-webhook-exfiltration
    desc: Sends permanent Discord guild invites to a webhook
    crit: hostile
    conf: 0.99
    attack: T1041,T1534,T1567.002
    mbc: E1041
    all:
      - id: micro-behaviors/communications/http/webhook::discord-webhook-path
      - id: micro-behaviors/communications/http/webhook::discord-guild-invite-creation-source
      - id: micro-behaviors/communications/http/webhook::discord-permanent-invite-options
      - id: micro-behaviors/communications/http/webhook::discord-guild-collection-source
      - id: micro-behaviors/communications/http/post::axios-post-source
    near_lines: 120
