# PowerShell exfiltration through a Discord-schema webhook endpoint.
# Discord webhook messages post a JSON object with username/content keys and
# accept multipart file uploads against the same endpoint URL. Stealers hold
# that URL in a variable (so no discord.com literal appears) and pair the
# JSON status post with a file attach. The username+content key pair is what
# attributes the schema: Slack's equivalent key is text, not content.
defaults:
  crit: hostile
  conf: 0.97
  platforms: [windows, unix]
  for: [powershell]
  attack: T1041,T1071.001
  mbc: E1041
composite_rules:
  - id: powershell-discord-schema-webhook-exfil
    desc: PowerShell posts Discord-schema JSON and file to a webhook
    all:
      - id: micro-behaviors/data/serialize/object::quoted-username-field-key
      - id: micro-behaviors/data/serialize/object::powershell-content-field-key
      - id: micro-behaviors/data/serialize/json::convertto-json
      - id: micro-behaviors/communications/http/lib/invoke-webrequest::ps-post
    any:
      - id: micro-behaviors/communications/http/upload::curl-form-file-attachment
    needs: 1
