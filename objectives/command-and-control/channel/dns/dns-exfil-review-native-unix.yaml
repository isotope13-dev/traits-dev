defaults:
  platforms: [unix]
  for: [c, cpp, objc, elf]
  attack: T1048.003

composite_rules:
  - id: native-dns-beacon-c2
    desc: Native DNS beacon C2
    crit: hostile
    conf: 0.97
    all:
      - id: micro-behaviors/communications/dns/label::native-dns-beacon-label-template
      - id: micro-behaviors/communications/ip/resolve::resolve-gethostbyname
    any:
      - id: metadata/lang/natural/vocabulary/dns::dns-c2
      - id: metadata/lang/natural/vocabulary/dns::dns-beacon
