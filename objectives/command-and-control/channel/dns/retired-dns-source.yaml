# Cross-language source rules for DNS TXT tasking.  These rules model the
# behavior described in the KATA article rather than any one tunnel domain:
# encoded data in changing left-most labels under a stable suffix, followed by
# command data returned in TXT records.
defaults:
  platforms: [windows, unix]
  for: [python, powershell, javascript, typescript, go]
  attack: T1071.004
  mbc: C0011

composite_rules:
  - id: node-dns-txt-callback-code-exec
    desc: Node DNS TXT callback executes tasking
    crit: hostile
    conf: 0.98
    for: [javascript, typescript]
    scope: file
    near_lines: 80
    all:
      - id: micro-behaviors/communications/dns/txt::node-resolve-txt-callback-response
      - id: micro-behaviors/process/interpreter/eval/javascript::js-eval-variable-argument
      - id: micro-behaviors/communications/dns/txt::resolve-txt-reference

  - id: dns-txt-command-tasking
    desc: DNS TXT response used for command tasking
    crit: hostile
    conf: 0.98
    attack: T1059
    near_lines: 80
    all:
      - id: micro-behaviors/communications/dns/txt::source-txt-response
      - id: objectives/command-and-control/backdoor/tasking/dns::dns-txt-response-exec-chain

