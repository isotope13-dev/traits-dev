defaults:
  platforms: [windows]
  for: [java, class, java_class, jar]
  attack: T1071.004

composite_rules:
  - id: java-dns-c2-subdomain-beacon
    desc: Java DNS C2 subdomain beacon
    crit: hostile
    conf: 0.98
    for: [java]
    all:
      - id: metadata/lang/source/literal/string/shape::java-dns-beacon-label
      - id: objectives/command-and-control/channel/dns::java-dns-task-label
      - id: objectives/command-and-control/channel/dns::java-dns-data-label
    any:
      - id: micro-behaviors/communications/dns/resolver::jvm-inetaddress-getbyname-source
      - id: micro-behaviors/communications/dns/resolver::jvm-inetaddress-getallbyname-source

  - id: java-raw-dns-c2-socket
    desc: Java raw DNS C2 socket
    crit: hostile
    conf: 0.98
    for: [java]
    all:
      - id: micro-behaviors/communications/socket/connect/attempt::java-raw-dns-tcp-port
      - id: metadata/lang/source/literal/string/shape::java-dns-beacon-label
      - id: objectives/command-and-control/channel/dns::java-dns-task-label
      - id: objectives/command-and-control/channel/dns::java-dns-data-label

  - id: jvm-bytecode-dns-c2-beacon
    desc: JVM bytecode DNS C2 beacon
    crit: hostile
    conf: 0.97
    for: [class, java_class, jar]
    all:
      - id: objectives/command-and-control/channel/dns::jvm-dns-c2-label-set
    any:
      - id: micro-behaviors/communications/dns/resolver::jvm-inetaddress-getbyname-bytecode
      - id: micro-behaviors/communications/dns/resolver::jvm-inetaddress-getallbyname-bytecode
      - id: metadata/binary/symbols/name/dns::jvm-build-dns-query-method
