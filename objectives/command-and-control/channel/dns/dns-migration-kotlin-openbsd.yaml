defaults:
  platforms: [openbsd, bsd, unix]
  for: [kotlin, class]
  attack: T1071.004

composite_rules:
  - id: kotlin-dns-txt-command-channel
    desc: Kotlin DNS TXT command channel
    crit: hostile
    conf: 0.98
    all:
      - id: metadata/lang/source/naming/function/communication::kotlin-dns-txt-query
      - id: metadata/lang/source/naming/interface/network::kotlin-dns-command-exec
    any:
      - id: micro-behaviors/fs/path/config/network::config-resolv
      - id: micro-behaviors/fs/path/config/network::kotlin-resolv-conf-reference
    unless:
      # Files with an unknown source extension can be heuristically parsed as
      # Kotlin by the generic source walker. A Nix module is not Kotlin.
      - id: metadata/file/extension/identity::nix-source-extension
