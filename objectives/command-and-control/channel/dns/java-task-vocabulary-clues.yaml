defaults:
  platforms: [windows]
  for: [java, class, java_class, jar]

traits:
  - id: jvm-dns-c2-label-set
    desc: JVM beacon, command and data text
    crit: suspicious
    conf: 0.92
    for: [class]
    if:
      type: raw
      regex: 'beacon[\s\S]{0,120}(cmd|tasks)[\s\S]{0,120}data'

composite_rules:
  - id: java-dns-task-label
    desc: Java command or tasks literal
    crit: component
    conf: 0.9
    any:
      - id: metadata/lang/source/literal/string/command::java-dns-cmd-label
      - id: metadata/lang/source/literal/string/label::jvm-tasks-string-literal

  - id: java-dns-data-label
    desc: Java data and task vocabulary clues
    crit: component
    conf: 0.9
    near_bytes: 200
    all:
      - id: metadata/lang/source/naming/resource::java-task-data-vocabulary
    any:
      - id: metadata/lang/source/literal/string/shape::java-dns-beacon-label
      - id: objectives/command-and-control/channel/dns::java-dns-task-label
    needs: 1

