# Python source that carries a DNS-tunnel beacon as template text: chunks are
# base32-encoded into labels under an operator domain, looked up to carry data
# out, a TXT answer is read back as the task, and the task runs through a
# shell in an endless loop. A resolver client, a TXT lookup and a shell call
# each have benign uses; all four in one loop are the shape of an implant.
defaults:
  platforms: [unix, windows]
  for: [python]
  attack: T1071.004,T1059.004
  mbc: B0030

traits:
  - id: python-base32-label-chunk-encode
    desc: Base32-encodes a chunk as a lowercase label
    crit: notable
    conf: 0.85
    if:
      type: text
      regex: 'b32encode\([^)]{1,40}\)\.decode\(\)\.rstrip\(["'']=["'']\)\.lower\(\)'
  - id: python-dns-lookup-of-formatted-label
    desc: Resolves a formatted label under a domain
    crit: notable
    conf: 0.85
    if:
      type: text
      regex: '(getaddrinfo|gethostbyname)\(f["'']\{+\w{1,20}\}+\.\{+\w{1,20}\}+["'']'
  - id: python-dns-txt-resolve-of-formatted-label
    desc: Resolves TXT record of formatted label
    crit: notable
    conf: 0.85
    if:
      type: text
      regex: 'resolve\(f["'']\{+\w{1,20}\}+\.\{+\w{1,20}\}+["''],\s*["'']TXT["'']'

composite_rules:
  - id: python-dns-tunnel-beacon-implant
    desc: Python source carries DNS-tunnel shell-command beacon loop
    crit: hostile
    conf: 0.9
    near_lines: 90
    all:
      - id: python-base32-label-chunk-encode
      - id: python-dns-lookup-of-formatted-label
      - id: python-dns-txt-resolve-of-formatted-label
      - id: micro-behaviors/data/control-flow/loop/unconditional::python-unconditional-while-header
      - id: micro-behaviors/process/create/shell/command-mode::check-output-shell-true
