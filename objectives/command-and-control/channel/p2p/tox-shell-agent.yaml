defaults:
  platforms: [linux]
  for: [go]
traits:
- id: go-tox-message-callback
  desc: Registers a Tox peer message callback
  crit: component
  if:
    type: text
    regex: 'tox_callback_friend_message\s*\(.{0,100}friend_message_cb'
- id: go-tox-peer-shell-command
  desc: Tox callback sends commands to shell
  crit: notable
  if:
    type: text
    regex: '(?s)friend_message_cb.{0,950}popen\s*\(\s*cmd\s*,\s*"r"\s*\)'
- id: go-tox-shell-output-message
  desc: Shell output returns through Tox peer messages
  crit: notable
  if:
    type: text
    regex: '(?s)popen\s*\(\s*cmd\s*,\s*"r"\s*\).{0,950}tox_friend_send_message'
- id: go-tox-peer-key-gate
  desc: Tox commands require a configured peer key
  crit: notable
  if:
    type: text
    regex: '(?s)tox_friend_get_public_key.{0,500}strcmp\s*\(\s*\w+\s*,\s*\w+\s*\)'
- id: go-tox-client-bootstrap-loop
  desc: Tox bootstrap and client event loop
  crit: component
  if:
    type: text
    regex: '(?s)tox_bootstrap\s*\(.{0,950}tox_friend_add\s*\(.{0,950}tox_iterate\s*\('
composite_rules:
- id: go-tox-peer-shell-command-execution
  desc: Tox peer callback executes remote shell commands
  crit: hostile
  conf: 0.99
  attack: T1059.004
  all:
  - id: objectives/command-and-control/channel/p2p::go-tox-message-callback
  - id: objectives/command-and-control/channel/p2p::go-tox-peer-shell-command
  - id: objectives/command-and-control/channel/p2p::go-tox-peer-key-gate
- id: go-tox-peer-shell-output-return
  desc: Returns remote shell output over Tox
  crit: hostile
  conf: 0.99
  attack: T1041
  all:
  - id: objectives/command-and-control/channel/p2p::go-tox-peer-shell-command
  - id: objectives/command-and-control/channel/p2p::go-tox-shell-output-message
- id: go-tox-p2p-shell-agent-loop
  desc: Tox bootstraps a peer-gated shell loop
  crit: hostile
  conf: 0.99
  attack: T1095
  all:
  - id: objectives/command-and-control/channel/p2p::go-tox-message-callback
  - id: objectives/command-and-control/channel/p2p::go-tox-peer-key-gate
  - id: objectives/command-and-control/channel/p2p::go-tox-client-bootstrap-loop
  - id: objectives/command-and-control/channel/p2p::go-tox-peer-shell-command
