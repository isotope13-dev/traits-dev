defaults:
  platforms: [linux, macos, windows]
  for: [binaries]
  attack: T1090.003
  mbc: B0030
composite_rules:
  - id: agent-mesh-router
    desc: Implant relays C2 via peer-to-peer
    crit: hostile
    conf: 0.96
    needs: 2
    any:
      - id: micro-behaviors/communications/socket/mesh-diagnostic
    unless:
      # A vendor mesh agent (zero-trust access, VPN) reports peers and routes
      # as a matter of course.
      - id: well-known/app/network/netzilo/
