# A mesh-range URL is harmless alone. This requires the independently admitted
# command agent, and does not depend on one operator's IPv6 address or UUID.
defaults:
  platforms: [unix, windows]
  for: [source, scripts]

composite_rules:
  - id: mesh-http-tasking-agent
    desc: HTTP shell-tasking agent includes a Yggdrasil-range endpoint
    crit: hostile
    conf: 0.98
    attack: T1071.001,T1090
    near_bytes: 8192
    all:
      - id: objectives/command-and-control/remote-command/tasking::polling-json-file-shell-agent
    any:
      - id: micro-behaviors/communications/ip/literal::overlay-ipv6-http-url
      - id: micro-behaviors/communications/ip/literal::encoded-overlay-ipv6-http-url
