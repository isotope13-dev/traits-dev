# Application-config C2 via torrent-client settings. Observed in Deluge
# DownloadHelper: move_completed_path carries DLHELPER_CMD:/DLHELPER_OUT:
# framed shell tasking instead of a network listener. Match the config key
# and CMD/OUT framing so renamed prefixes still surface when both legs exist.
defaults:
  platforms: [unix, windows]
  for: [python, shell]
  attack: "T1071,T1059,T1496"
  mbc: B0030

traits:
  - id: torrent-move-completed-path
    desc: Torrent move_completed_path config key
    crit: notable
    conf: 0.92
    if:
      type: text
      substr: move_completed_path

  - id: config-channel-cmd-prefix
    desc: Config-channel CMD protocol prefix
    crit: suspicious
    conf: 0.95
    if:
      type: text
      # Build templates commonly declare an empty FORCE_DO_CMD: sentinel.
      # A protocol prefix must carry a same-line value to be useful evidence.
      # Reject bash default-expansion tails (PRIV_CMD:-sudo) after the colon.
      regex: '["''][A-Z][A-Z0-9_]{2,24}_CMD:[^"''\r\n]{1,160}["'']'

  - id: config-channel-out-prefix
    unless:
      - id: well-known/lib/ai/unsloth::unsloth-package-context
    desc: Config-channel OUT protocol prefix
    crit: suspicious
    conf: 0.95
    if:
      type: text
      # Require a same-line value for the same reason as the CMD leg.
      regex: '["''][A-Z][A-Z0-9_]{2,24}_OUT:[^"''\r\n]{1,160}["'']'

  - id: deluge-corepluginbase-import
    desc: Deluge CorePluginBase import path
    crit: notable
    conf: 0.94
    for: [python]
    if:
      type: text
      substr: deluge.plugins.corepluginbase

  - id: deluge-corepluginbase-class
    desc: Deluge CorePluginBase class name
    crit: notable
    conf: 0.9
    for: [python]
    if:
      type: text
      substr: CorePluginBase

  - id: deluge-plugin-enable-toggle
    desc: Deluge plugin enable or disable call
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)\b(enable_plugin|disable_plugin)\s*\(\s*["''][^"'']{1,64}["'']'

composite_rules:
  - id: deluge-core-plugin-base
    desc: Deluge CorePluginBase plugin binding
    crit: notable
    conf: 0.95
    near_bytes: 256
    all:
      - id: deluge-corepluginbase-import
      - id: deluge-corepluginbase-class

  - id: torrent-config-cmd-out-channel
    desc: Torrent config used as CMD/OUT command channel
    crit: hostile
    conf: 0.98
    near_bytes: 4096
    all:
      - id: torrent-move-completed-path
      - id: config-channel-cmd-prefix
      - id: config-channel-out-prefix

  - id: torrent-config-channel-shell-exec
    desc: Torrent config channel executes shell commands
    crit: hostile
    conf: 0.99
    near_bytes: 8192
    all:
      - id: torrent-config-cmd-out-channel
      - id: deluge-core-plugin-base
    any:
      - id: micro-behaviors/process/create/subprocess::shell-true
      - id: micro-behaviors/process/create/subprocess::popen-shell-true
      - id: micro-behaviors/process/create/subprocess::shell-true

  - id: torrent-config-channel-plugin-tasker
    desc: Deluge plugin toggled around config-channel tasking
    crit: hostile
    conf: 0.97
    near_bytes: 4096
    all:
      - id: torrent-move-completed-path
      - id: config-channel-cmd-prefix
      - id: deluge-plugin-enable-toggle
    any:
      - id: config-channel-out-prefix
