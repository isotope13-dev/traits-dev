defaults:
  platforms: [unix, windows, macos]
  for: [vsix-archive, javascript, typescript, package.json]
composite_rules:
- id: vscode-dns-txt-beacon-url-failover
  desc: VS Code extension recovers beacon URL from _beacon DNS TXT
  crit: hostile
  conf: 0.98
  attack: "T1071.004,T1102,T1195.002"
  all:
  - id: well-known/lib/development/vscode::vscode-extension-marker
  - id: micro-behaviors/communications/dns/txt::node-txt-lookup
  - id: micro-behaviors/communications/dns/label::dns-txt-beacon-label-prefix
  - id: micro-behaviors/communications/url/reference::base-https-assignment-fragment
  any:
  - id: micro-behaviors/communications/http/request/client::https-request
  - id: micro-behaviors/communications/http/get::node-https-get-reference
  - id: micro-behaviors/communications/http/request/body/construction::node-http-request-stream-body

