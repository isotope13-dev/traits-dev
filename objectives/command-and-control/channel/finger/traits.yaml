defaults:
  platforms: [windows]
  for: [batch, powershell, javascript, html]
  attack: T1071
  mbc: B0030

traits:
  - id: for-f-finger-loop
    desc: Captures remote Finger output in for /f
    crit: suspicious
    conf: 0.94
    if:
      # Preserve cmd.exe caret escapes in the executable token. Require the
      # Finger user@host query shape so prose mentioning finger.exe cannot
      # satisfy the matcher.
      type: text
      regex: '(?i)\bfor\s+/f\b[^\r\n]{0,200}\bf\^*i\^*n\^*g\^*e\^*r(\.exe)?\s+[A-Za-z0-9._-]{2,64}@'
  - id: call-for-variable-line
    desc: Invokes each batch loop line as command
    crit: suspicious
    conf: 0.92
    if:
      type: text
      regex: '(?i)\bdo\s+call\s+%{1,2}[A-Za-z]\b'
  - id: minimized-finger-start
    desc: minimized finger retrieval window
    crit: suspicious
    conf: 0.9
    if:
      type: text
      regex: '(?i)\bstart\s+(""\s+)?/min\b.{0,220}\bfinger(\.exe)?\b'
  - id: verify-human-echo-prompt
    desc: Prints fake human-verification command prompt
    crit: notable
    conf: 0.88
    if:
      type: text
      regex: '(?i)echo\s+["'']?\s*-{2,}\s*Verify\s+you\s+are\s+human.{0,80}press\s+ENTER'
  - id: cmd-k-minimized-finger-loop
    desc: cmd-k minimized finger loop
    crit: suspicious
    conf: 0.92
    if:
      type: text
      regex: '(?i)\bcmd\s+/k\b.{0,120}\bstart\b.{0,80}/min\b.{0,180}\bfinger(\.exe)?\b'
  - id: finger-pipe-cmd
    desc: Finger query piped into cmd
    crit: suspicious
    conf: 0.96
    if:
      type: text
      regex: '(?i)\bfinger(\.exe)?\s+[^\n]{0,80}\|\s*cmd\b'

composite_rules:
  - id: finger-output-command-execution
    desc: Executes remote commands returned by Finger
    crit: hostile
    conf: 0.98
    all:
      - id: for-f-finger-loop
      - id: call-for-variable-line
  - id: clickfix-finger-lolbin-command
    desc: ClickFix runs Finger-delivered remote commands
    crit: hostile
    conf: 0.99
    all:
      - id: finger-output-command-execution
    any:
      - id: verify-human-echo-prompt
      - id: objectives/execution/lure/clipboard::browser-clipboard-write
      - id: objectives/execution/lure/clipboard::encoded-browser-clipboard-write
      - id: objectives/execution/lure/clipboard::generic-windows-command-clipboard-lure
  - id: finger-output-piped-to-cmd
    desc: Finger output is piped into cmd
    crit: hostile
    conf: 0.98
    all:
      - id: finger-pipe-cmd
    any:
      - id: minimized-finger-start
      - id: objectives/command-and-control/dropper/execution/browser::clickfix-renamed-finger-command
