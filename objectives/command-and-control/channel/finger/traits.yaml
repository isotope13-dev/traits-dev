defaults:
  platforms: [windows]
  for: [batch, powershell, javascript, html]
  attack: T1071
  mbc: B0030

traits:
  - id: cmd-k-minimized-finger-loop
    desc: cmd-k minimized finger loop
    crit: suspicious
    conf: 0.92
    if:
      type: text
      regex: '(?i)\bcmd\s+/k\b.{0,120}\bstart\b.{0,80}/min\b.{0,180}\bfinger(\.exe)?\b'
  - id: finger-pipe-cmd
    desc: Finger query piped into cmd
    crit: suspicious
    conf: 0.96
    if:
      type: text
      regex: '(?i)\bfinger(\.exe)?\s+[^\n]{0,80}\|\s*cmd\b'

composite_rules:

  - id: finger-output-command-execution
    desc: Executes remote commands returned by Finger
    crit: hostile
    conf: 0.98
    attack: T1059.003,T1105
    all:
      - id: micro-behaviors/process/create/shell/spawn::for-f-finger-loop
      - id: micro-behaviors/process/create/shell/command-mode::finger-input-variable-command
      - id: micro-behaviors/communications/socket/tcp::finger-command-query
    near_bytes: 256
  - id: clickfix-finger-lolbin-command
    desc: ClickFix runs Finger-delivered remote commands
    crit: hostile
    conf: 0.99
    all:
      - id: finger-output-command-execution
    any:
      - id: micro-behaviors/ui/dialog/prompt::verify-human-echo-prompt
      - id: objectives/execution/lure/clipboard/write::browser-clipboard-write
      - id: objectives/execution/lure/clipboard/write::encoded-browser-clipboard-write
      - id: objectives/execution/lure/clipboard/page::generic-windows-command-clipboard-lure
  - id: finger-output-piped-to-cmd
    desc: Finger output is piped into cmd
    crit: hostile
    conf: 0.98
    all:
      - id: finger-pipe-cmd
    any:
      - id: micro-behaviors/process/create/hidden::minimized-finger-query-reference
      - id: objectives/command-and-control/dropper/delivery/clickfix/clipboard::clickfix-renamed-finger-command

  - id: minimized-finger-output-execution
    desc: Minimized launcher executes Finger output
    crit: hostile
    conf: 0.98
    attack: T1059.003,T1105,T1564.003
    near_bytes: 512
    all:
      - id: finger-output-command-execution
      - id: micro-behaviors/process/create/hidden::minimized-finger-query-reference
