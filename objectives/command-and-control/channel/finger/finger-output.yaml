# CMD variables are case-sensitive. Each atom binds one language-defined
# variable letter on both sides; the union handles all variable renamings.
# Optional backslashes accept quotes escaped in embedded JavaScript strings.
# These match the input/body syntax. The objective additionally requires
# FOR /F command-output parsing, excluding usebackq literal-input forms.
defaults:
  platforms: [windows]
  for: [batch, powershell, javascript, html]
  crit: component
  attack: T1059.003
traits:
  - id: finger-input-variable-command-a
    desc: Finger loop variable a command text
    conf: 0.95
    if:
      type: text
      regex: '%%?a in \(\\?'',?f\^*i\^*n\^*g\^*e\^*r[^''\n]{1,99}@[^''\n]{1,99}\\?''\) do (call )?%%?a\b'
