# A port relay alone is dual use. Updater-disguised AppData DLL injection
# supplies admission; hidden process creation describes the relay launch.
# No connection success, shell dispatch or encryption implementation is implied.
defaults:
  platforms: [windows]
  for: [c, cpp]
  attack: T1572

composite_rules:
  - id: hidden-peer-relay-dll-injector
    desc: Hidden peer-forwarding launch alongside DLL injection
    crit: hostile
    conf: 0.97
    all:
      - id: micro-behaviors/communications/proxy/relay::tailcat-source-forward-peer
      - id: micro-behaviors/process/create/flags::create-process-no-window-argument
      - id: objectives/evasion/process/injection/dll::appdata-updater-remote-dll-injector
