# Operator-controlled cross-network shell relayed over an existing command
# channel. RC2TUN framing and the complete lifecycle grammar make this much
# narrower than generic /bin/bash or pipe creation.
defaults:
  platforms: [linux]
  for: [elf]
  attack: "T1572,T1059.004"
  mbc: B0030

traits:
  - id: native-rc2-tunnel-frame
    desc: RC2TUN relay protocol frame
    crit: suspicious
    conf: 0.99
    if:
      type: text
      regex: 'RC2TUN\|(OUT|FWD|BACK|ERR)\|%s\|'
      section: .rodata

  - id: native-reverse-shell-tunnel-menu
    desc: Reverse-shell tunnel command lifecycle
    crit: suspicious
    conf: 0.999
    if:
      type: text
      regex: 'Usage: /tunnel open\|relay\|close\|in\|out\|drain <tid> \[b64\]'

composite_rules:
  - id: native-commanded-reverse-shell-tunnel
    desc: Native agent relays a commanded Bash shell
    crit: hostile
    conf: 0.999
    all:
      - id: native-reverse-shell-tunnel-menu
      - id: native-rc2-tunnel-frame
      - id: micro-behaviors/process/create/shell/native::bash-binary-name
      - id: micro-behaviors/process/create/direct::fork-execl-piped-stdio
