# A program that carries its own Cloudflare Quick Tunnel client -- it asks
# api.trycloudflare.com for an anonymous tunnel and dials the Argo edge
# itself instead of shipping cloudflared -- and serves an interactive shell.
# The host's shell becomes reachable from a random public hostname through
# any NAT or firewall, with no account and no binary to notice.
defaults:
  platforms: [windows, linux, macos]
  for: [scripts, source]
  attack: T1572,T1219,T1059

composite_rules:
  - id: embedded-quick-tunnel-remote-shell
    desc: Serves a shell through its own Cloudflare tunnel
    crit: suspicious
    conf: 0.92
    all:
      - id: objectives/command-and-control/infrastructure/domain/tunnel::cloudflare-quick-tunnel-api
      - id: objectives/command-and-control/infrastructure/domain/tunnel::argotunnel-edge-host
    any:
      - id: micro-behaviors/process/tty/pty/
      - id: micro-behaviors/process/create/shell-subprocess::asyncio-create-subprocess-shell
      - id: micro-behaviors/process/create/shell-subprocess::shell-true
