defaults:
  platforms: [windows, linux]
  for: [scripts, systemd-service]
  attack: "T1090.001,T1543.003,T1543.002"
  mbc: "B0022,B0011.003"

composite_rules:
  - id: persistent-tunnel-user-documents-service
    desc: Persistent tunnel uses user Documents payload
    crit: hostile
    conf: 0.99
    all:
      - id: micro-behaviors/communications/proxy/tunnel::persistent-tunnel-service
      - id: micro-behaviors/fs/path/location::system-process-in-user-documents
      - id: micro-behaviors/os/service/control::service-auto-start-setting
    for: [scripts]
    unless:
      - id: metadata/package/testing/presence/harness/

  - id: persistent-tunnel-service-masquerade
    desc: Persistent tunnel service masquerades as svchost
    crit: hostile
    conf: 0.99
    all:
      - id: micro-behaviors/communications/proxy/tunnel::persistent-tunnel-service
      - id: micro-behaviors/fs/path/location::system-process-in-user-documents
    for: [scripts]
    unless:
      - id: metadata/package/testing/presence/harness/

  - id: restarting-tunnel-service
    desc: Persistent tunnel service restarts automatically
    crit: suspicious
    conf: 0.95
    for: [systemd-service]
    platforms: [linux]
    all:
      - id: micro-behaviors/communications/proxy/tunnel::persistent-tunnel-service
      - id: objectives/persistence/system/service/systemd::restart-always-text
