defaults:
  platforms: [windows, linux]
  for: [scripts, systemd-service]
  attack: "T1090.001,T1543.003,T1543.002"
  mbc: "B0022,B0011.003"

composite_rules:
  - id: persistent-tunnel-auto-start-masquerade-service
    desc: Auto-start tunnel service masquerading as a Windows system process
    crit: hostile
    conf: 0.99
    all:
      - id: micro-behaviors/communications/proxy/tunnel::persistent-tunnel-service
      - id: objectives/evasion/masquerade/process/path::windows-system-process-path-masquerade
      - id: micro-behaviors/os/service/control::service-auto-start-setting
    for: [scripts]
    unless:
      - id: metadata/package/testing/presence/harness/

  - id: persistent-tunnel-service-masquerade
    desc: Persistent tunnel service masquerades as a Windows system process
    crit: hostile
    conf: 0.99
    all:
      - id: micro-behaviors/communications/proxy/tunnel::persistent-tunnel-service
      - id: objectives/evasion/masquerade/process/path::windows-system-process-path-masquerade
    for: [scripts]
    unless:
      - id: metadata/package/testing/presence/harness/

  - id: persistent-tunnel-service-updater-masquerade
    desc: Auto-start tunnel service wears a vendor auto-updater name
    # The updater-name variant of the two composites above. Operators rename
    # the connector to MicrosoftEdgeUpdate*.exe or GoogleUpdate.exe far more
    # often than to a System32 process name, because an updater running
    # unattended and reaching the internet on a schedule is exactly what a
    # baseline expects — and unlike svchost.exe it draws no attention when it
    # is not in System32.
    crit: hostile
    conf: 0.96
    platforms: [windows]
    for: [scripts]
    attack: T1572,T1543.003,T1036.005
    all:
      - id: micro-behaviors/communications/proxy/tunnel::persistent-tunnel-service
      - id: objectives/evasion/masquerade/process/name::vendor-updater-exe-name
    unless:
      - id: metadata/package/testing/presence/harness/

  - id: restarting-tunnel-service
    desc: Persistent tunnel service restarts automatically
    crit: suspicious
    conf: 0.95
    for: [systemd-service]
    platforms: [linux]
    all:
      - id: micro-behaviors/communications/proxy/tunnel::persistent-tunnel-service
      - id: micro-behaviors/os/service/restart-policy::restart-always-text
