defaults:
  platforms: [windows, linux]
  for: [scripts, systemd-service]
  attack: "T1090.001,T1543.003,T1543.002"
  mbc: "B0022,B0011.003"

traits:
  # The article's Windows IoC is the registered service name, not necessarily
  # the connector filename: the latter was observed as svchost.exe. Match the
  # service-registration syntax around the name so a prose mention of
  # Cloudflared cannot satisfy these atoms.
  - id: cloudflared-sc-service-registration
    desc: sc registers Cloudflared service
    crit: notable
    conf: 0.93
    platforms: [windows]
    for: [batch, powershell, csharp]
    if:
      type: text
      regex: '(?i)\bsc(\.exe)?\s+create\s+Cloudflared\b'

  - id: cloudflared-powershell-service-registration
    desc: PowerShell registers Cloudflared service
    crit: notable
    conf: 0.93
    platforms: [windows]
    for: [powershell]
    if:
      type: text
      regex: '(?i)\bNew-Service\b[^\r\n]{0,100}-Name\s+[''"`]?Cloudflared\b'

  - id: cloudflared-native-service-registration
    desc: Native code registers Cloudflared service
    crit: notable
    conf: 0.93
    platforms: [windows]
    for: [c, cpp, go]
    if:
      type: text
      regex: '(?i)\bCreateService[AW]?\b[\s\S]{0,120}["'']Cloudflared["'']'

composite_rules:
  - id: cloudflared-service-masquerade-persistence
    desc: Cloudflared service uses a system-process name in a user folder
    crit: hostile
    conf: 0.98
    platforms: [windows]
    for: [scripts, c, cpp, csharp, go, pe, dll]
    attack: "T1572,T1543.003,T1036.005"
    all:
      - id: objectives/evasion/masquerade/process/path::windows-system-process-path-masquerade
    any:
      - id: cloudflared-sc-service-registration
      - id: cloudflared-powershell-service-registration
      - id: cloudflared-native-service-registration
    unless:
      - id: metadata/package/testing/presence/harness/

  - id: persistent-tunnel-auto-start-masquerade-service
    desc: Auto-start tunnel service masquerading as a Windows system process
    crit: hostile
    conf: 0.99
    all:
      - id: micro-behaviors/communications/proxy/tunnel::persistent-tunnel-service
      - id: objectives/evasion/masquerade/process/path::windows-system-process-path-masquerade
      - id: micro-behaviors/os/service/control::service-auto-start-setting
    for: [scripts]
    unless:
      - id: metadata/package/testing/presence/harness/

  - id: persistent-tunnel-service-masquerade
    desc: Persistent tunnel service masquerades as a Windows system process
    crit: hostile
    conf: 0.99
    all:
      - id: micro-behaviors/communications/proxy/tunnel::persistent-tunnel-service
      - id: objectives/evasion/masquerade/process/path::windows-system-process-path-masquerade
    for: [scripts]
    unless:
      - id: metadata/package/testing/presence/harness/

  - id: persistent-tunnel-service-updater-masquerade
    desc: Auto-start tunnel service wears a vendor auto-updater name
    # The updater-name variant of the two composites above. Operators rename
    # the connector to MicrosoftEdgeUpdate*.exe or GoogleUpdate.exe far more
    # often than to a System32 process name, because an updater running
    # unattended and reaching the internet on a schedule is exactly what a
    # baseline expects — and unlike svchost.exe it draws no attention when it
    # is not in System32.
    crit: hostile
    conf: 0.96
    platforms: [windows]
    for: [scripts]
    attack: T1572,T1543.003,T1036.005
    all:
      - id: micro-behaviors/communications/proxy/tunnel::persistent-tunnel-service
      - id: objectives/evasion/masquerade/process/name::vendor-updater-exe-name
    unless:
      - id: metadata/package/testing/presence/harness/

  - id: restarting-tunnel-service
    desc: Persistent tunnel service restarts automatically
    crit: suspicious
    conf: 0.95
    for: [systemd-service]
    platforms: [linux]
    all:
      - id: micro-behaviors/communications/proxy/tunnel::persistent-tunnel-service
      - id: objectives/persistence/system/service/systemd::restart-always-text
