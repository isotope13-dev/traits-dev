# Node code that launches a Cloudflare tunnel connector with a credential
# shipped inside the package, and writes the connector binary itself.
#
# A tunnel token is the connector's whole identity: whoever holds it can
# publish services behind that tunnel's hostname, and every installer of the
# package shares the same one. Remote-control plugins ship this on purpose
# ("works right after install"), which is why the evidence is graduated:
# the token or the file write alone is a notable fact, the pairing of either
# with a connector launch is suspicious.
#
# ATT&CK: T1572 (Protocol Tunneling), T1105 (Ingress Tool Transfer)
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
  attack: T1572
  mbc: B0030

traits:
  - id: node-cloudflared-run-token-spawn
    desc: Node spawns cloudflared tunnel run with --token
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '[''"]tunnel[''"]\s*,[^\]]{0,60}[''"]run[''"]\s*,\s*[''"]--token[''"]'

composite_rules:
  - id: node-cloudflared-embedded-token-launch
    desc: Node launches cloudflared with a bundled tunnel token
    crit: suspicious
    conf: 0.9
    scope: file
    all:
      - id: node-cloudflared-run-token-spawn
      - id: micro-behaviors/communications/proxy/tunnel::cloudflare-tunnel-token-credential
    unless:
      - id: metadata/package/testing/harness/runtime/
      - id: metadata/path::test-directory-component

  - id: node-cloudflared-download-and-chmod
    desc: Node streams cloudflared to disk and makes it executable
    crit: suspicious
    conf: 0.88
    attack: T1105
    scope: file
    all:
      - id: micro-behaviors/communications/proxy/tunnel::cloudflared-binary-name
      - id: micro-behaviors/fs/write/file/stream::node-pipeline-write-stream
      - id: micro-behaviors/fs/chmod/executable/mode::node-chmod-exec-mode-755
    unless:
      - id: metadata/package/testing/harness/runtime/
      - id: metadata/path::test-directory-component
