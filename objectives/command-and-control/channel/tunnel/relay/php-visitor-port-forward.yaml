# A PHP script uploaded to a web host that dials a fixed internal target and
# the visiting client's own address (REMOTE_ADDR), then copies bytes between
# the two sockets. It exposes an internal service such as RDP back to the
# requester, the classic web-server port-forward used after a compromise.
# Also matches copies stored UTF-16 or under a non-.php extension.
defaults:
  platforms: [linux, macos, windows]
  for: [php, text]
  attack: T1090.001,T1572

traits:
  - id: php-remote-addr-server-variable
    desc: Reads visiting client address in PHP
    crit: component
    conf: 0.8
    if:
      type: text
      regex: '\$_SERVER\[.REMOTE_ADDR.\]'
      exclude_comments: true
  - id: php-fsockopen-text-call
    desc: PHP fsockopen call in source text
    crit: component
    conf: 0.8
    if:
      type: text
      regex: '@?fsockopen\s*\(\s*\$\w{1,16}\s*,\s*\$\w{1,16}'
      exclude_comments: true
  - id: php-socket-blocking-toggle
    desc: PHP socket blocking mode toggled
    crit: component
    conf: 0.8
    if:
      type: text
      regex: '(stream|socket)_set_blocking\s*\(|set_socket_blocking\s*\('
      exclude_comments: true
  - id: php-socket-chunk-copy-loop
    desc: PHP reads fixed-size socket chunk
    crit: component
    conf: 0.8
    if:
      type: text
      regex: '\$data\s*=\s*@?fread\(\$\w{1,16}\s*,\s*\d{2,5}\)'
      exclude_comments: true

composite_rules:
  - id: php-two-socket-relay-primitives
    desc: PHP opens sockets and copies chunks with blocking toggles
    crit: notable
    conf: 0.85
    all:
      - id: php-fsockopen-text-call
      - id: php-socket-blocking-toggle
      - id: php-socket-chunk-copy-loop
  - id: php-dials-visiting-client
    desc: PHP socket target is the visiting client address
    crit: notable
    conf: 0.8
    all:
      - id: php-remote-addr-server-variable
      - id: php-fsockopen-text-call
  - id: php-visitor-port-forward
    desc: PHP relay bridges internal target to the visiting client
    crit: hostile
    conf: 0.9
    all:
      - id: php-two-socket-relay-primitives
      - id: php-dials-visiting-client
