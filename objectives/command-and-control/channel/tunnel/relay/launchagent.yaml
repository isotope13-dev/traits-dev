# A public ingress tunnel is dual-use. The objective signal is the chain
# that publishes it, submits credentials to the published login surface, and
# installs a recurring user LaunchAgent to keep the access path alive.
defaults:
  platforms: [macos]
  for: [scripts, source]
  attack: "T1572,T1543.004,T1071.001"
  mbc: "B0022,B0028"

composite_rules:
  - id: macos-public-tunnel-login-credentials
    desc: Credentials sent to public tunnel login
    crit: suspicious
    conf: 0.94
    all:
      - id: objectives/command-and-control/infrastructure/domain/tunnel::public-tunnel-endpoint
      - id: micro-behaviors/communications/http/login::http-login-credential-post

  - id: macos-public-tunnel-launchagent-persistence
    desc: Public tunnel kept alive by LaunchAgent
    crit: suspicious
    conf: 0.94
    attack: "T1572,T1543.004"
    all:
      - id: objectives/command-and-control/infrastructure/domain/tunnel::public-tunnel-endpoint
      - id: objectives/persistence/system/launchd/source::macos-launchagent-install-surface
      - id: objectives/persistence/system/launchd/source::macos-launchagent-recurring-config

  - id: macos-public-tunnel-persistent-admin-access
    desc: Credentialed public tunnel kept alive persistently
    crit: suspicious
    conf: 0.96
    all:
      - id: macos-public-tunnel-login-credentials
      - id: objectives/persistence/system/launchd/source::macos-launchagent-install-surface
      - id: objectives/persistence/system/launchd/source::macos-launchagent-recurring-config
