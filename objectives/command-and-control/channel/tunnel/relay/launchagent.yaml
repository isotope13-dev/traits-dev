# A public ingress tunnel is dual-use. The objective signal is the chain
# that publishes it, submits credentials to the published login surface, and
# installs a recurring user LaunchAgent to keep the access path alive.
defaults:
  platforms: [macos]
  for: [scripts, source]
  attack: "T1572,T1543.004,T1071.001"
  mbc: "B0022,B0028"

composite_rules:
  - id: macos-launchagent-install-surface
    desc: LaunchAgent is written or loaded
    crit: notable
    conf: 0.92
    all:
      - id: micro-behaviors/os/service/launchagent::launchagent-path-reference
    any:
      - id: micro-behaviors/os/service/control::launchctl-bootstrap-subcommand
      - id: micro-behaviors/os/service/control::launchctl-bootstrap-gui
      - id: micro-behaviors/os/service/control::python-launchctl-argv
      - id: micro-behaviors/os/service/config::shell-launchagent-plist-write
      - id: micro-behaviors/os/service/config::shell-launchd-plist-write
      - id: micro-behaviors/os/service/launchagent::plistbuddy-start-interval-edit
      - id: micro-behaviors/fs/write/file/direct::python-pathlib-write-text

  - id: macos-launchagent-recurring-config
    desc: LaunchAgent has recurring execution settings
    crit: notable
    conf: 0.92
    all:
      - id: micro-behaviors/os/service/launchagent::launchagent-path-reference
    any:
      - id: micro-behaviors/os/service/config::launchagent-run-at-load
      - id: micro-behaviors/os/service/launchagent::launchagent-keepalive-key
      - id: objectives/persistence/system/launchd/core::start-interval
      - id: objectives/persistence/system/launchd/core::keep-alive

  - id: macos-public-tunnel-login-credentials
    desc: Credentials sent to public tunnel login
    crit: suspicious
    conf: 0.94
    all:
      - id: objectives/command-and-control/infrastructure/domain/tunnel::public-tunnel-endpoint
      - id: micro-behaviors/communications/http/login::http-login-credential-post

  - id: macos-public-tunnel-launchagent-persistence
    desc: Public tunnel kept alive by LaunchAgent
    crit: suspicious
    conf: 0.94
    attack: "T1572,T1543.004"
    all:
      - id: objectives/command-and-control/infrastructure/domain/tunnel::public-tunnel-endpoint
      - id: macos-launchagent-install-surface
      - id: macos-launchagent-recurring-config

  - id: macos-public-tunnel-persistent-admin-access
    desc: Credentialed public tunnel kept alive persistently
    crit: suspicious
    conf: 0.96
    all:
      - id: macos-public-tunnel-login-credentials
      - id: macos-launchagent-install-surface
      - id: macos-launchagent-recurring-config
