# IRC clone kits of the early 2000s rarely connected from the operator's own
# address. They opened a socket to port 23 of a router from a scanned list,
# typed the factory `cisco` VTY password, then typed `<server> <port>` so the
# router's telnet client carried the clone onward. Every clone arrives from a
# different hijacked router, which is what defeats per-host bans. The
# password alone could be a lab script; followed by a host and an IRC port
# on the same socket, it is a relay through someone else's device.
defaults:
  platforms: [unix, windows]
  for: [mirc, ircii, scripts, data]
  attack: T1090
composite_rules:
  - id: mirc-default-cred-router-relay
    desc: Relays IRC through default-cred routers
    crit: hostile
    conf: 0.94
    attack: T1090,T1078.001
    all:
      - id: micro-behaviors/communications/socket/connect::mirc-sockopen
      - id: objectives/command-and-control/channel/irc/client::mirc-sockwrite-cisco-password
      - id: objectives/command-and-control/channel/irc/client::mirc-sockwrite-onward-irc-port
