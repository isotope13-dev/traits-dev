defaults:
  platforms: [windows]
composite_rules:
  - id: remote-msi-and-vscode-tunnel-service
    desc: Remote MSI install with persistent IDE tunnel
    crit: suspicious
    conf: 0.94
    for: [batch, powershell, python, javascript, typescript, vbs, csharp]
    attack: T1218.007,T1543.003,T1572
    all:
      - id: objectives/execution/lolbin/os::msiexec-remote-url-install
      - id: micro-behaviors/communications/proxy/tunnel::vscode-tunnel-service-install
    near_lines: 12

  - id: sysvol-transfer-and-vscode-tunnel-service
    desc: SYSVOL transfer with persistent IDE tunnel
    crit: suspicious
    conf: 0.94
    for: [batch, powershell, python, javascript, typescript, vbs]
    attack: T1570,T1543.003,T1572
    all:
      - id: micro-behaviors/fs/file/copy::sysvol-script-file-transfer
      - id: micro-behaviors/communications/proxy/tunnel::vscode-tunnel-service-install
    near_lines: 12
