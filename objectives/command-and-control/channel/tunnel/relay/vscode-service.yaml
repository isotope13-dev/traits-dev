defaults:
  platforms: [windows]
composite_rules:
  - id: remote-msi-and-vscode-tunnel-service
    desc: Remote MSI with debug-directory IDE tunnel
    crit: suspicious
    conf: 0.94
    for: [batch, powershell, python, javascript, typescript, vbs, csharp]
    attack: T1218.007,T1543.003,T1572
    all:
      - id: micro-behaviors/process/create/installer::msiexec-remote-url-install
      - id: micro-behaviors/communications/proxy/tunnel::vscode-tunnel-service-system-debug-path
    near_lines: 12

  - id: sysvol-transfer-and-vscode-tunnel-service
    desc: SYSVOL Public launch with debug IDE tunnel
    crit: suspicious
    conf: 0.94
    for: [batch, powershell, python, javascript, typescript, vbs]
    attack: T1570,T1543.003,T1572
    all:
      - id: micro-behaviors/process/deploy::sysvol-public-shell-launch
      - id: micro-behaviors/communications/proxy/tunnel::vscode-tunnel-service-system-debug-path
    near_lines: 12

  - id: privileged-sysvol-execution-and-tunnel-service
    desc: Privileged SYSVOL payload launch with persistent IDE tunnel
    crit: suspicious
    conf: 0.97
    for: [batch, powershell, python, javascript, typescript, vbs]
    attack: T1098,T1570,T1543.003,T1572
    all:
      - id: objectives/lateral-movement/delivery/gpo::privileged-group-sysvol-staging
      - id: micro-behaviors/process/deploy::sysvol-public-shell-launch
      - id: micro-behaviors/communications/proxy/tunnel::vscode-tunnel-service-install
    near_lines: 12
