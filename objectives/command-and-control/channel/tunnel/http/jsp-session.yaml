defaults:
  platforms:
    - unix
    - windows
  for:
    - jsp
composite_rules:
  - id: jsp-request-target-session-tunnel
    desc: JSP request-controlled session socket tunnel
    crit: hostile
    conf: 0.99
    attack: T1090
    all:
      - id: metadata/lang/scripted::jsp-server-page
      - id: micro-behaviors/communications/http/request/params::java-servlet-get-parameter
      - id: micro-behaviors/communications/socket/connect/tcp::java-address-socket-connect
      - id: metadata/file/profile/relay-implementation::jsp-session-socket-buffer-bridge
