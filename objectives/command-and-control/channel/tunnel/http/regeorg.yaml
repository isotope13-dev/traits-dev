defaults:
  platforms: [linux, macos, windows]
  for: [shell, python, javascript, php, powershell, go]
  attack: T1572
traits:
- id: tunna-name
  desc: Tunna tool name
  crit: notable
  conf: 0.8
  if:
    type: text
    substr: Tunna
- id: neo-regeorg
  desc: neo-reGeorg tool name
  crit: suspicious
  conf: 0.9
  if:
    type: text
    substr: neo-reGeorg
- id: xcmd-header
  desc: Web tunnel X-CMD header
  crit: suspicious
  conf: 0.85
  if:
    type: text
    substr: X-CMD
- id: regeorg-aspx-page
  desc: reGeorg ASPX page marker
  crit: notable
  conf: 0.85
  for: [csharp, html]
  if:
    type: text
    substr: '<%@ Page Language="C#"'
- id: regeorg-strtr-token
  desc: reGeorg StrTr token
  crit: component
  conf: 0.85
  for: [csharp, html]
  if:
    type: text
    substr: StrTr
- id: regeorg-target-str
  desc: reGeorg target string parameter
  crit: notable
  conf: 0.85
  for: [csharp, html]
  if:
    type: text
    substr: target_str
- id: regeorg-ipeendpoint
  desc: reGeorg IPEndPoint socket use
  crit: notable
  conf: 0.85
  for: [csharp, html]
  if:
    type: text
    substr: System.Net.IPEndPoint
- id: regeorg-response-addheader
  desc: reGeorg response header control
  crit: notable
  conf: 0.85
  for: [csharp, html]
  if:
    type: text
    substr: Response.AddHeader
- id: regeorg-socket-token
  desc: reGeorg socket token
  crit: component
  conf: 0.75
  for: [csharp, html]
  if:
    type: text
    word: Socket
composite_rules:
- id: regeorg
  desc: reGeorg/Tunna web tunneling
  crit: notable
  conf: 0.9
  any:
  - id: well-known/tool/offensive/regeorg::tool-name
  - id: tunna-name
  - id: neo-regeorg
  - id: xcmd-header
- id: regeorg-variant-webshell
  desc: reGeorg variant web tunnel shell
  crit: hostile
  conf: 0.99
  for: [csharp, html]
  any:
  - id: regeorg-aspx-page
  - id: regeorg-strtr-token
  - id: regeorg-target-str
  - id: regeorg-ipeendpoint
  - id: regeorg-response-addheader
  - id: regeorg-socket-token
  needs: 5
