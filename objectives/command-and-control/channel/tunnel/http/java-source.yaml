# Java server handlers that turn an HTTP request body into an arbitrary TCP
# connection or a second HTTP forward. These require the hidden header gate and
# both sides of the relay; socket use alone is not a tunnel verdict.
defaults:
  platforms: [unix, windows]
  for: [java]
  attack: T1090
  mbc: B0030

traits:
  - id: java-handler-reads-configured-header
    desc: Reads configured request header
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: 'getHeader\s*\(\s*headerName\s*\)|getMethod\s*\(\s*["'']getHeader'
  - id: java-handler-tests-configured-header-value
    desc: Checks configured request header value
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: 'contains\s*\(\s*headerValue\s*\)'
  - id: java-handler-body-target-host
    desc: Request body supplies a socket target host
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: 'dataMap\s*\.\s*get\s*\(\s*["'']h["'']\s*\)'
  - id: java-handler-body-target-port
    desc: Request body supplies a socket target port
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: 'dataMap\s*\.\s*get\s*\(\s*["'']p["'']\s*\)'
  - id: java-handler-connects-request-target
    desc: Java socket connects to request target
    crit: notable
    conf: 0.92
    if:
      type: text
      regex: 'sc\s*\.\s*connect\s*\(\s*new\s+InetSocketAddress\s*\(\s*host\s*,\s*port\s*\)'
  - id: java-handler-forwards-request-data-to-socket
    desc: Handler forwards request data to socket
    crit: notable
    conf: 0.92
    if:
      type: text
      regex: 'readReq\s*\(\s*reqInputStream\s*,\s*scOutStream\s*\)'
  - id: java-handler-returns-socket-data-in-response
    desc: Handler returns socket data in HTTP response
    crit: notable
    conf: 0.92
    if:
      type: text
      regex: 'new\s+\w+\s*\(\s*scInStream\s*,\s*respOutStream\s*\)'
  - id: java-handler-body-http-redirect-url
    desc: Request body supplies an HTTP redirect URL
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: 'redirectData\s*=\s*\(byte\[\]\)\s*dataMap\s*\.\s*get\s*\(\s*["'']r["'']\s*\)'
  - id: java-handler-opens-forward-url
    desc: Java handler opens a supplied forwarding URL
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: 'new\s+URL\s*\(\s*rUrl\s*\)'
  - id: java-handler-forwards-request-headers
    desc: Enumerates inbound request headers
    crit: notable
    conf: 0.88
    if:
      type: text
      regex: 'getHeaderNames\s*\(\s*\)|getMethod\s*\(\s*["'']getHeaderNames'
  - id: java-handler-sets-forwarded-http-headers
    desc: Sets forwarded HTTP headers
    crit: notable
    conf: 0.88
    if:
      type: symbol
      kind: call
      exact: setRequestProperty

composite_rules:
  - id: java-header-tasked-arbitrary-tcp-forwarder
    desc: Java handler tunnels to arbitrary TCP targets
    crit: hostile
    conf: 0.99
    all:
      - id: java-handler-reads-configured-header
      - id: java-handler-tests-configured-header-value
      - id: java-handler-body-target-host
      - id: java-handler-body-target-port
      - id: java-handler-connects-request-target
      - id: java-handler-forwards-request-data-to-socket
      - id: java-handler-returns-socket-data-in-response

  - id: java-header-tasked-http-forward-proxy
    desc: Java handler forwards through supplied URL
    crit: hostile
    conf: 0.98
    attack: T1090,T1071.001
    all:
      - id: java-handler-reads-configured-header
      - id: java-handler-tests-configured-header-value
      - id: java-handler-body-http-redirect-url
      - id: java-handler-opens-forward-url
      - id: java-handler-forwards-request-headers
      - id: java-handler-sets-forwarded-http-headers
