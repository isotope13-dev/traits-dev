# JspSpy-style port map: the request names both ends and the page binds a
# ServerSocket, then connects onward. That is a tunnel, not a listen-only demo.
defaults:
  platforms: [unix, windows]
  for: [jsp, java, html, javascript, python]
  attack: T1090
  mbc: B0030
traits:
  - id: jsp-proxy-command-header
    desc: JSP reads the X-CMD header
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: 'getHeader\s*\(\s*["'']X-CMD["'']\s*\)'
  - id: jsp-proxy-socketchannel-connect
    desc: JSP opens a SocketChannel
    crit: notable
    conf: 0.92
    if:
      type: text
      substr: SocketChannel.open()
  - id: jsp-proxy-socketchannel-connect-call
    desc: JSP connects its SocketChannel to a target
    crit: notable
    conf: 0.92
    for: [jsp]
    if:
      type: text
      substr: .connect(new InetSocketAddress
  - id: jsp-proxy-socketchannel-forward
    desc: JSP forwards request bytes into a SocketChannel
    crit: notable
    conf: 0.92
    if:
      type: text
      regex: '(?s)request\s*\.\s*getInputStream\s*\(\)[\s\S]{0,700}socketChannel\s*\.\s*write\s*\('
  - id: jsp-proxy-socketchannel-return
    desc: JSP returns channel bytes in its response
    crit: notable
    conf: 0.92
    if:
      type: text
      regex: '(?s)socketChannel\s*\.\s*read\s*\([\s\S]{0,700}response\s*\.\s*getOutputStream\s*\(\)'
  - id: jsp-websocket-async-socket-channel
    desc: JSP combines WebSocket and async sockets
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: '(?s)extends\s+Endpoint[\s\S]{0,500}AsynchronousSocketChannel'
  - id: jsp-local-port-parameter
    desc: JSP reads a local port
    crit: notable
    conf: 0.8
    if:
      type: text
      substr: 'getParameter("localPort")'
  - id: jsp-remote-port-parameter
    desc: JSP reads a remote port
    crit: notable
    conf: 0.84
    if:
      type: text
      substr: 'getParameter("remotePort")'
  - id: jsp-server-socket-construct
    unless:
      - id: metadata/package/testing/corpus::inert-security-input-module
    desc: JSP constructs a server socket
    crit: notable
    conf: 0.8
    if:
      type: text
      regex: 'new\s+ServerSocket\s*\('
  - id: jsp-socket-accept-call
    desc: JSP accepts a socket connection
    crit: notable
    conf: 0.8
    # Scoped to server-page file types: the bare `.accept()` matcher also
    # fires on Python's `socket.accept()`, where a "JSP accepts" label is a
    # false positive (plain socket listeners already have the canonical
    # micro-behaviors/communications/socket/listen::socket-accept-call).
    for: [jsp, html]
    if:
      type: text
      regex: '\.accept\s*\(\s*\)'
composite_rules:
  - id: jsp-header-tasked-socket-tunnel
    for: [jsp]
    desc: JSP HTTP headers task a bidirectional TCP tunnel
    crit: hostile
    conf: 0.99
    all:
      - id: metadata/lang/scripted::jsp-server-page
      - id: jsp-proxy-command-header
      - id: jsp-proxy-socketchannel-connect
      - id: jsp-proxy-socketchannel-connect-call
      - id: jsp-proxy-socketchannel-forward
      - id: jsp-proxy-socketchannel-return
  - id: jsp-websocket-async-socket-tunnel
    for: [jsp]
    desc: JSP WebSocket endpoint tunnels binary messages to a TCP socket
    crit: hostile
    conf: 0.99
    all:
      - id: metadata/lang/scripted::jsp-server-page
      - id: jsp-websocket-async-socket-channel
      - id: micro-behaviors/communications/websocket/server::java-websocket-endpoint-registration
      - id: micro-behaviors/communications/websocket/server::session-send-binary
      - id: micro-behaviors/communications/websocket/server::add-message-handler
  - id: jsp-request-port-tunnel
    desc: JSP tunnels through a server socket
    crit: hostile
    conf: 0.96
    all:
      - id: metadata/lang/scripted::jsp-server-page
      - id: jsp-local-port-parameter
      - id: jsp-remote-port-parameter
      - id: jsp-server-socket-construct
  # Fixed-port proxy: `new ServerSocket(n)` and `accept()`, with no
  # request-supplied endpoints. The parameter tunnel above is the same
  # behavior when the page names both ends, so it suppresses this one.
  - id: jsp-listening-socket-proxy
    desc: JSP accepts connections on a server socket
    crit: hostile
    conf: 0.95
    for: [jsp, html]
    unless:
      - id: jsp-request-port-tunnel
      - id: micro-behaviors/process/create/shell/selection::java-shell-executable-path-source
    all:
      - id: metadata/lang/scripted::jsp-server-page
      - id: jsp-server-socket-construct
      - id: jsp-socket-accept-call
