defaults:
  platforms: [linux, macos, windows]
  for: [php]
  attack: T1090.001

traits:
  - id: php-connect-case
    desc: PHP CONNECT dispatch case
    crit: component
    if:
      type: text
      regex: '\bcase\s+["'']CONNECT["'']\s*:'
      exclude_comments: true
  - id: php-forward-case
    desc: PHP FORWARD dispatch case
    crit: component
    if:
      type: text
      regex: '\bcase\s+["'']FORWARD["'']\s*:'
      exclude_comments: true

composite_rules:
  # The conjunction describes a tunnel implementation, including renamed
  # Neo-reGeorg copies. Authorized HTTP-to-TCP pivots remain possible.
  - id: php-session-tcp-relay
    desc: PHP tunnel dispatch with HTTP input, session state and TCP I/O
    crit: suspicious
    conf: 0.97
    all:
      - id: php-connect-case
      - id: php-forward-case
      - id: micro-behaviors/communications/http/request/form-input::php-input-stream-reference
      - id: micro-behaviors/communications/http/request/superglobal::session
      - id: micro-behaviors/communications/socket/connect/attempt::fsockopen-call
      - id: micro-behaviors/fs/write/file/handle/call::php-fwrite
      - id: micro-behaviors/fs/read/stream::php-fgets-call
      - id: micro-behaviors/data/stream/configure::php-stream-nonblocking
