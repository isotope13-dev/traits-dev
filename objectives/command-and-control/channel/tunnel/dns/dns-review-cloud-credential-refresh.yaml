# DNS-delivered cloud credential refresh. The durable behavior is a paired
# length/data label protocol over AAAA answers followed by credential-bearing
# configuration persistence, independent of the service or family name.
defaults:
  platforms: [windows, unix]
  for: [csharp, python, javascript, typescript, powershell, go, pe, dll]
  attack: T1071.004
  mbc: B0030

composite_rules:
  - id: dns-cloud-credential-refresh
    for: [pe]
    desc: DNS AAAA cloud credential refresh tunnel
    crit: hostile
    conf: 0.99
    attack: T1071.004,T1552.001
    all:
      - id: micro-behaviors/communications/dns/lookup::aaaa-record-lookup
      - id: metadata/lang/source/literal/string/shape::dns-length-data-label-pair
      - id: metadata/lang/source/syntax/credential-field::entra-credential-field-set
      - id: micro-behaviors/fs/write/file/full/string::dotnet-writealltext-token
