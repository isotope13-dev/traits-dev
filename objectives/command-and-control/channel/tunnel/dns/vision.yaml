defaults:
  platforms: [linux]
  for: [elf]
  attack: T1071.004
  mbc: B0030

traits:
  - id: vision-dns-query-encoder
    desc: Vision DNS C2 query encoder symbol
    crit: notable
    conf: 0.98
    if:
      type: text
      substr: main.encodeDNSQuery
      section: .gopclntab
  - id: vision-dns-txt-response-parser
    desc: Vision DNS TXT response parser symbol
    crit: notable
    conf: 0.98
    if:
      type: text
      substr: main.parseDNSTXTResponse
      section: .gopclntab
  - id: vision-dns-c2-resolver
    desc: Vision DNS C2 resolver symbol
    crit: notable
    conf: 0.98
    if:
      type: text
      substr: main.dialga
      section: .gopclntab

composite_rules:
  - id: vision-dns-c2-channel
    desc: Vision DNS and DoH C2 channel
    crit: hostile
    conf: 0.99
    all:
      - id: vision-dns-query-encoder
      - id: vision-dns-txt-response-parser
      - id: vision-dns-c2-resolver
