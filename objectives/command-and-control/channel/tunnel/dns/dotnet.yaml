defaults:
  platforms: [android, windows]
  for: [csharp, pe]
  attack: T1071.004

traits:
  - id: dotnet-dns-txt-record
    desc: .NET DNS TXT record handling
    crit: suspicious
    conf: 0.92
    # Anchor BOTH the numeric (16) and symbolic (TXT) query-type tokens to the
    # queryType context; a bare "TXT" alternative matched ASN.1/text substrings
    # in unrelated native libraries (e.g. OpenSSL libcrypto).
    if:
      type: text
      regex: 'queryType.{0,40}(16|TXT)'

  - id: dns-label-before-base64
    desc: DNS label marker before .NET Base64 encoding
    crit: component
    conf: 0.93
    if:
      type: text
      regex: '(?is)(dns|subdomain)[\s\S]{0,120}ToBase64String'

  - id: base64-before-dns-label
    desc: .NET Base64 encoding before DNS label marker
    crit: component
    conf: 0.93
    if:
      type: text
      regex: '(?is)ToBase64String[\s\S]{0,120}(dns|subdomain)'

  - id: dotnet-dns-task-labels
    desc: .NET DNS task labels
    crit: component
    conf: 0.93
    if:
      type: text
      regex: '"(auth|cmd|report)"'

  - id: dotnet-msiv2demo-prototype-source
    desc: MsiV2DemoApp prototype source
    crit: component
    if:
      type: path
      regex: 'prototype[\\/]MsiV2DemoApp[\\/]Program\.cs$'

composite_rules:
  - id: dotnet-base64-subdomain
    desc: .NET Base64 value used in DNS subdomain context
    crit: suspicious
    conf: 0.93
    any:
      - id: dns-label-before-base64
      - id: base64-before-dns-label
    unless:
      - id: dotnet-msiv2demo-prototype-source

  - id: dotnet-dns-c2-channel
    desc: .NET DNS C2 channel
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/communications/dns/client::dotnet-udp-dns-client
      - id: dotnet-dns-txt-record
    any:
      - id: dotnet-base64-subdomain
      - id: dotnet-dns-task-labels

  - id: dotnet-dns-login-tasking
    desc: .NET DNS login tasking
    crit: hostile
    conf: 0.98
    all:
      - id: dotnet-dns-c2-channel
      - id: dotnet-dns-task-labels
