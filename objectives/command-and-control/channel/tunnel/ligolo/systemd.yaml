defaults:
  platforms:
  - linux
  for:
  - shell
  - systemd
  - scripts
  attack: T1090,T1572,T1543.002
traits:
- id: ligolo-hidden-systemd-helper--rx-3
  desc: Ligolo binary variable near marker
  crit: notable
  conf: 0.99
  if:
    type: text
    regex: (?i)BINARY_NAME.{0,80}(ligolo|proxy)|(ligolo|proxy).{0,80}BINARY_NAME
- id: ligolo-hidden-systemd-helper--rx-5
  desc: Regex component marker
  crit: component
  conf: 0.99
  if:
    type: text
    substr: INSTALL_DIR
- id: ligolo-hidden-systemd-helper--rx-7
  desc: Matches 'connect.'
  crit: notable
  conf: 0.99
  if:
    type: text
    regex: (?i)ligolo.{0,120}connect|connect.{0,120}ligolo
- id: tun-to-ligolo-forwarding
  desc: TUN interface forwards Ligolo traffic
  crit: suspicious
  conf: 0.97
  if:
    type: text
    regex: ip\s+tuntap\s+add[\s\S]{0,240}ligolo[0-9A-Za-z_-]*[\s\S]{0,600}iptables\s+-I\s+FORWARD
# The agent binary keeps github.com/nicocha30/ligolo-ng after UPX unpack.
- id: ligolo-ng-module-path
  desc: Ligolo-ng Go module path
  crit: notable
  conf: 0.98
  for: [elf, macho]
  platforms: [linux, windows, macos]
  if:
    type: text
    substr: github.com/nicocha30/ligolo-ng
composite_rules:
- id: ligolo-persistent-pivot-service
  desc: Ligolo installs persistent pivot service
  crit: hostile
  conf: 0.99
  all:
  - id: ligolo-hidden-systemd-helper
  - id: tun-to-ligolo-forwarding
- id: ligolo-hidden-systemd-helper
  desc: Hidden Ligolo systemd helper service
  crit: suspicious
  conf: 0.99
  all:
  - id: ligolo-hidden-systemd-helper--rx-7
  any:
  - id: micro-behaviors/fs/path/binary::usr-local-bin-dir
  - id: ligolo-hidden-systemd-helper--rx-3
  - id: micro-behaviors/communications/tls/verify/disable::ignore-cert-option-reference
  - id: ligolo-hidden-systemd-helper--rx-5
  - id: micro-behaviors/os/service/unit-field::exec-start-text
  unless:
  - id: metadata/lang/source/shape::javascript-literal-tables-pure-helpers
  - id: metadata/file/profile/markup::assessment-playbook-examples
- id: ligolo-ng-socks-websocket-agent
  desc: Ligolo-ng agent tunnels SOCKS over WebSocket
  crit: hostile
  conf: 0.97
  attack: T1090,T1572
  for: [elf, macho]
  platforms: [linux, windows, macos]
  all:
  - id: ligolo-ng-module-path
  - id: micro-behaviors/communications/proxy/socks::go-x-net-socks-package
  - id: micro-behaviors/communications/proxy/tunnel::go-yamux-multiplexed-transport
  - id: metadata/import/package::nhooyr-websocket-module-reference
