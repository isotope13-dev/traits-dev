# Unix scheduled reverse-SSH access. A reverse_ssh client can be used for
# support, so the scheduled combination is suspicious; exploit context is
# required for the hostile chain in the network-service objective.
defaults:
  platforms: [unix]
  for: [scripts, source, shell, python, javascript, typescript, go, ruby, perl, rust, java, c, cpp, php]
  attack: T1572,T1053.003

composite_rules:
  - id: unix-cron-entry
    desc: Unix cron schedule entry
    crit: notable
    conf: 0.92
    any:
      - id: micro-behaviors/os/autorun/scheduled::shell-cron-schedule-entry
      - id: micro-behaviors/os/autorun/scheduled::source-cron-schedule-entry

  - id: reverse-ssh-channel-client
    desc: Outbound reverse SSH client
    crit: suspicious
    conf: 0.92
    any:
      - id: micro-behaviors/communications/ssh/connect::reverse-ssh-client-command
      - id: micro-behaviors/communications/ssh/connect::ssh-remote-forward-command

  - id: cron-reverse-ssh-persistence
    desc: Cron persistence launches outbound reverse SSH access
    crit: suspicious
    conf: 0.98
    attack: T1053.003,T1572,T1021.004
    mbc: B0030
    all:
      - id: unix-cron-entry
      - id: reverse-ssh-channel-client
    near_lines: 2
