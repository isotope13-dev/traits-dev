# A scheduled reverse SSH tunnel can be legitimate administration, so the
# tunnel/persistence combination is suspicious.  Secure deletion of staging
# material adds the anti-forensic context needed for a hostile finding.
defaults:
  platforms: [windows]
  for: [powershell, batch]
  attack: T1572,T1053.005

composite_rules:
  - id: scheduled-reverse-ssh-tunnel
    desc: Scheduled task establishes reverse SSH tunnel
    crit: suspicious
    conf: 0.98
    all:
      - id: micro-behaviors/os/autorun/scheduled::scheduled-task-registration
      - id: micro-behaviors/communications/ssh/connect::ssh-remote-forward-command
    near_lines: 100

  - id: scheduled-reverse-ssh-tunnel-cleanup
    desc: Scheduled reverse tunnel with secure cleanup
    crit: hostile
    conf: 0.99
    attack: T1070.004,T1572,T1053.005
    all:
      - id: scheduled-reverse-ssh-tunnel
      - id: micro-behaviors/fs/delete/secure::sdelete-command-reference
    near_lines: 120
