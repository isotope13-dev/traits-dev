defaults:
  for:
    - shell
  platforms:
    - unix
traits:
  - id: socat-tcp4-forward
    desc: Socat TCP port forwarding
    crit: notable
    conf: 0.75
    attack: T1572
    if:
      type: text
      regex: "tcp4:(127\\.0\\.0\\.1|localhost):\\d+"
  - id: socat-tcp4-listen
    desc: Socat TCP listen port forwarder
    crit: notable
    conf: 0.75
    attack: T1572
    if:
      type: text
      substr: "tcp4-listen:"
  - id: socat-mutual-tls
    desc: Socat mutual TLS authentication
    crit: notable
    conf: 0.8
    attack: T1573.002
    if:
      type: text
      regex: "(?i)cert=.{1,40}cafile="
composite_rules:
  - id: socat-ssl-tunnel
    desc: Socat encrypted tunnel pattern
    crit: suspicious
    conf: 0.95
    attack: T1572
    any:
      - id: micro-behaviors/communications/socket/connect::socat-openssl-connect
      - id: micro-behaviors/communications/socket/listen::socat-openssl-listen
    all:
      - id: socat-mutual-tls
    unless:
      - id: well-known/tool/sysadmin/network::socat-upstream-test-suite
      - id: well-known/app/mariadb::mariadb-wsrep-sst-helper-context
