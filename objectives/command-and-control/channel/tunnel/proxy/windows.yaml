defaults:
  crit: suspicious
  attack: T1090
  mbc: B0022
  platforms: [windows]
  for: [pe, dll]
composite_rules:
  - id: service-proxy-backdoor
    desc: Windows service proxy backdoor
    conf: 0.95
    all:
      - id: objectives/persistence/system/service/install::service-install-and-start
      - id: micro-behaviors/communications/socket/init::wsa-startup
      # `micro-behaviors/communications/socket/listen::listen` is for: [elf,
      # macho] (POSIX socket() + listen()); the Windows equivalent lives in
      # listen/windows.yaml.
      - id: micro-behaviors/communications/socket/listen::winsock-listener-imports
      # `micro-behaviors/communications/socket/connect::connect` is for: [elf,
      # macho, c, cpp] (POSIX connect()); use the Winsock text-import sibling
      # already defined alongside `wsa-startup`.
      - id: micro-behaviors/communications/socket/init::ws2-connect-api-string
    any:
      - id: micro-behaviors/process/create/exec::firewall-allowedprogram-cli
      - id: micro-behaviors/fs/file/copy::copyfile-a
      - id: micro-behaviors/os/service/dispatch::service-control-dispatch
  - id: firefox-proxy-aware-c2
    desc: C2 reuses Firefox proxy configuration
    conf: 0.94
    all:
      - id: micro-behaviors/fs/path/application/browser::firefox-proxy-config-reference
    any:
      - id: objectives/command-and-control/channel/http/message::hardcoded-request
      - id: micro-behaviors/communications/http/user-agent::user-agent-header
      - id: objectives/command-and-control/channel/http/message::google-ad-cookie-c2-camouflage
    needs: 2
