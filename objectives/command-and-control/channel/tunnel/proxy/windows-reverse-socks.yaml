# Batch command facts exclude REM comments. Bind the reverse remote to the
# quoted task action itself; a separate client command must not qualify.
# The remote grammar survives task, executable, address, and port renaming.
defaults:
  platforms: [windows]
  for: [batch]
  attack: T1053.005,T1572

traits:
  - id: batch-reverse-socks-task-arguments
    desc: Task action requests reverse SOCKS tunnel
    crit: suspicious
    conf: 0.96
    ref: https://huntback.io/blog/ai-pentest-console-south-korean-university-global-admin
    if:
      type: value
      path: source.batch.command_sites[*].text
      regex: '^schtasks(\.exe)?\s+/create\b.{1,180}/tr\s+"[^"\r\n]{1,180} R(:[0-9]{1,5})?:socks\b'
      case_insensitive: true
