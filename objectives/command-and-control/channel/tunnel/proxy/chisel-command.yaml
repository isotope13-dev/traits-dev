# An invoked Chisel subcommand is usage, not identity of the scanned artifact.
defaults:
  platforms: [linux, macos, windows]
  for: [scripts, source, systemd-service]
  crit: notable
  conf: 0.95
traits:
  - id: chisel-mode-command
    desc: Chisel client or server subcommand
    if:
      type: text
      regex: '(?i)\bchisel(\.exe)?\s+(client|server)\b'
