# Require mode and remote mapping on the same shell invocation.
defaults:
  platforms: [unix]
  for: [shell]
traits:
  - id: chisel-reverse-socks-call
    desc: Chisel client requests reverse SOCKS
    crit: suspicious
    attack: T1572
    if:
      type: symbol
      kind: call
      regex: '(^|/)chisel$'
      args:
        - index: 0
          name: client
        - name_regex: '^R(:[0-9]{1,5})?:socks$'
