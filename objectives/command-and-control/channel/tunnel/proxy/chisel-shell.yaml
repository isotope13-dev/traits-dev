# Require mode and remote mapping on the same shell invocation.
defaults:
  platforms: [unix]
  for: [shell]
traits:
  - id: chisel-reverse-socks-call
    desc: Chisel client requests reverse SOCKS
    crit: suspicious
    attack: T1572
    if:
      type: symbol
      kind: call
      regex: '(^|/)chisel$'
      args:
        - index: 0
          name: client
        - name_regex: '^R(:[0-9]{1,5})?:socks$'

# A single shell script that scans a host, guesses or injects its way in, and
# opens a reverse SOCKS tunnel out is an intrusion chain, not a tool that
# happens to be installed. Each stage is a distinct tool, so the chain needs
# all three roles in one file; any one stage alone stays at its own level.
composite_rules:
  - id: intrusion-recon-stage
    desc: Shell runs a network scanner against a target
    crit: component
    conf: 0.9
    any:
      - id: micro-behaviors/communications/socket/probe::nmap-shell-scan-mode
      - id: micro-behaviors/communications/socket/probe::nuclei-shell-target
      - id: well-known/tool/offensive/reconnaissance/masscan::masscan-command-reference
  - id: intrusion-access-stage
    desc: Shell guesses logins or injects SQL at a target
    crit: component
    conf: 0.9
    any:
      - id: objectives/credential-access/cracking/password::hydra-wordlist-online-guessing
      - id: objectives/execution/exploit/sql-injection/tool-invocation::sqlmap-target-assessment-call
  - id: intrusion-scan-access-tunnel-chain
    desc: Shell chains scan, access attack, and reverse SOCKS tunnel
    crit: hostile
    conf: 0.96
    attack: T1572,T1110.001,T1190
    scope: file
    all:
      - id: intrusion-recon-stage
      - id: intrusion-access-stage
      - id: chisel-reverse-socks-call
