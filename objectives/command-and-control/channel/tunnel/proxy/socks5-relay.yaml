# SOCKS stream relay service.
#
# A SOCKS implementation that accepts a client, opens an upstream connection,
# and copies bytes between the two sockets is the reusable technique described
# by the article. The composite deliberately uses protocol and socket
# structure rather than a malware-family name or an invented control frame.
defaults:
  platforms: [unix, windows, android]
  for: [source]
  attack: T1090.001,T1572
  mbc: B0030

composite_rules:
  - id: socks5-stream-relay-service
    desc: SOCKS5 stream relay service
    crit: suspicious
    conf: 0.95
    all:
      - id: micro-behaviors/communications/proxy/relay::transparent-stream-forwarder
    any:
      - id: micro-behaviors/communications/proxy/socks::socks5-proto
      - id: micro-behaviors/communications/proxy/socks::socks5-protocol-source
      - id: micro-behaviors/communications/proxy/socks::socks5-proxy-implementation
