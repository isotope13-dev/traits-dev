# ASP.NET HTTP-to-TCP tunnel page (reGeorg, Neo-reGeorg and their clones): the
# page opens a raw TCP socket, parks it in session state between requests, and
# pipes each request body into it and each socket read back into the response.
# A web page carrying arbitrary TCP streams for its caller is a pivot tunnel.
defaults:
  platforms: [windows]
  for: [asp, csharp]
  attack: T1090.001
  mbc: B0030
traits:
  - id: aspnet-application-session-socket-key
    desc: ASP.NET stores socket by session key
    crit: component
    conf: 0.96
    if:
      type: text
      substr: SessionSocket
  - id: aspnet-application-session-socket-relay-source
    desc: ASP.NET stores a socket in application state
    crit: component
    conf: 0.96
    if:
      type: text
      regex: '(?i)Application\s*\[\s*["'']SessionSocket'
  - id: aspnet-application-socket-send
    desc: ASP.NET sends bytes through a socket
    crit: component
    conf: 0.94
    if:
      type: text
      regex: '(?i)\.Send\s*\('
  - id: aspnet-application-socket-receive
    desc: ASP.NET receives bytes through a socket
    crit: component
    conf: 0.94
    if:
      type: text
      regex: '(?i)\.Receive\s*\('
  - id: aspnet-application-socket-response
    desc: ASP.NET returns socket bytes in its response
    crit: component
    conf: 0.95
    if:
      type: text
      regex: '(?i)Response\s*\.\s*BinaryWrite\s*\('
composite_rules:
  - id: aspnet-session-socket-relay
    desc: ASP.NET page relays HTTP bodies over a session TCP socket
    crit: hostile
    conf: 0.96
    all:
      - id: micro-behaviors/communications/http/server/managed::aspnet-page-directive
      - id: micro-behaviors/communications/socket/create::socket-stream-tcp
      - id: micro-behaviors/communications/http/server/managed::aspnet-session-held-socket
      - id: micro-behaviors/communications/http/server/managed::aspnet-request-input-stream-read
      - id: micro-behaviors/communications/http/server/managed::aspnet-response-binary-write
  - id: aspnet-application-held-socket-tunnel
    desc: ASP.NET relays request bytes over an application-held TCP socket
    crit: hostile
    conf: 0.98
    for: [asp]
    all:
      - id: micro-behaviors/communications/http/server/managed::aspnet-page-directive
      - id: micro-behaviors/communications/socket/create::socket-stream-tcp
      - id: micro-behaviors/communications/http/request/superglobal::classic-asp-request-binaryread
      - id: aspnet-application-session-socket-key
      - id: micro-behaviors/communications/http/server/managed::aspnet-response-binary-write
