# Open-HTTP-Puncher / HTTP proxy tunneling
defaults:
  platforms: [linux, windows, macos]
  for: [elf, pe, macho, go]
  attack: T1572
  mbc: B0030

traits:
  - id: open-http-puncher-reference
    desc: References Open HTTP Puncher proxy tunnel
    crit: suspicious
    conf: 0.95
    if:
      type: text
      substr: "Open HTTP Puncher"

composite_rules:
  - id: http-puncher-proxy-tunnel
    desc: HTTP proxy tunnel puncher proxy forwarding
    crit: hostile
    conf: 0.98
    # net.Dial is read out of a built Go binary's string table, so the chain
    # only ever completes on the compiled artifact, never on Go source.
    for: [elf, pe, macho]
    all:
      - id: objectives/command-and-control/channel/tunnel/proxy::open-http-puncher-reference
      - id: micro-behaviors/communications/socket/dial::net-dial-text
