# JspSpy-style port map: the request names both ends and the page binds a
# ServerSocket, then connects onward. That is a tunnel, not a listen-only demo.
defaults:
  platforms: [unix, windows]
  for: [jsp, java, html, javascript, python]
  attack: T1090
  mbc: B0030
traits:
  - id: jsp-local-port-parameter
    desc: JSP reads a local port
    crit: notable
    conf: 0.8
    if:
      type: text
      substr: 'getParameter("localPort")'
  - id: jsp-remote-port-parameter
    desc: JSP reads a remote port
    crit: notable
    conf: 0.84
    if:
      type: text
      substr: 'getParameter("remotePort")'
  - id: jsp-server-socket-construct
    desc: JSP constructs a server socket
    crit: notable
    conf: 0.8
    if:
      type: text
      regex: 'new\s+ServerSocket\s*\('
  - id: jsp-socket-accept-call
    desc: JSP accepts a socket connection
    crit: notable
    conf: 0.8
    # Scoped to server-page file types: the bare `.accept()` matcher also
    # fires on Python's `socket.accept()`, where a "JSP accepts" label is a
    # false positive (plain socket listeners already have the canonical
    # micro-behaviors/communications/socket/listen::socket-accept-call).
    for: [jsp, html]
    if:
      type: text
      regex: '\.accept\s*\(\s*\)'
composite_rules:
  - id: jsp-request-port-tunnel
    desc: JSP tunnels through a server socket
    crit: hostile
    conf: 0.96
    all:
      - id: metadata/lang/scripted::jsp-server-page
      - id: jsp-local-port-parameter
      - id: jsp-remote-port-parameter
      - id: jsp-server-socket-construct
  # Fixed-port proxy: `new ServerSocket(n)` and `accept()`, with no
  # request-supplied endpoints. The parameter tunnel above is the same
  # behavior when the page names both ends, so it suppresses this one.
  - id: jsp-listening-socket-proxy
    desc: JSP accepts connections on a server socket
    crit: hostile
    conf: 0.95
    for: [jsp, html]
    unless:
      - id: jsp-request-port-tunnel
    all:
      - id: metadata/lang/scripted::jsp-server-page
      - id: jsp-server-socket-construct
      - id: jsp-socket-accept-call
