# Distinct from merely controlling a webshell: this also provisions a SOCKS
# listener and exposes a local TCP endpoint using reverse forwarding. This is
# suspicious because authorized assessment remains a plausible use.
defaults:
  platforms: [unix, windows]
  for: [python]
  attack: T1090,T1572
composite_rules:
  - id: webshell-socks-reverse-pivot-client
    desc: Webshell client provisions reverse SOCKS access
    crit: suspicious
    conf: 0.94
    all:
      - id: objectives/command-and-control/backdoor/webshell/client::quoted-query-shell-command-client
      - id: micro-behaviors/communications/proxy/socks::socks-listener-url-option
      - id: micro-behaviors/communications/proxy/reverse::reverse-local-port-mapping
