# A command handler that accepts a target host and port for direct TCP
# forwarding.  The case-handler shape avoids matching configuration objects
# that merely contain host and port fields.
defaults:
  platforms: [unix, windows, fortios]
  for: [javascript, typescript]
  attack: T1090.001,T1572
  mbc: B0030

traits:
  - id: node-direct-forward-command-handler
    desc: Remote command accepts TCP forward target
    crit: suspicious
    conf: 0.97
    if:
      type: text
      regex: '(?s)case\s+["''](direct|forward)["'']\s*:.{0,240}\w+\(.{0,160}\.host.{0,120}\.port'
