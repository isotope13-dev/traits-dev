# A command handler that accepts a target host and port for direct TCP
# forwarding.  The case-dispatch and forward-call legs are neutral
# capabilities (a webhook-replay CLI also dispatches a `forward` command
# and threads loopback-defaulted host/port options through URL builders);
# only their combination in one handler establishes the forward target.
defaults:
  platforms: [unix, windows, fortios]
  for: [javascript, typescript]
  attack: T1090.001,T1572
  mbc: B0030

composite_rules:
  - id: node-direct-forward-command-handler
    desc: Remote command accepts TCP forward target
    crit: suspicious
    conf: 0.97
    near_bytes: 512
    all:
      - id: micro-behaviors/communications/proxy/tunnel::node-forward-command-case
      - id: micro-behaviors/communications/proxy/tunnel::node-forward-target-call
