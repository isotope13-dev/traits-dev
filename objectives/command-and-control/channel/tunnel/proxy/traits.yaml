defaults:
  platforms: [linux, macos, windows]
  for: [shell, python, javascript, php, powershell, go]
  attack: T1572
traits:
- id: ew-ssocksd
  desc: Earthworm ssocksd component
  crit: notable
  conf: 0.7
  for: [c, cpp, go, elf, pe, macho]
  if:
    type: text
    substr: ssocksd
- id: ew-rcsocks
  desc: Earthworm rcsocks component
  crit: notable
  conf: 0.7
  for: [c, cpp, go, elf, pe, macho]
  if:
    type: text
    substr: rcsocks
- id: ew-rssocks
  desc: Earthworm rssocks component
  crit: notable
  conf: 0.7
  for: [c, cpp, go, elf, pe, macho]
  if:
    type: text
    word: rssocks
- id: ew-lcx-listen
  desc: Earthworm lcx_listen function
  crit: notable
  conf: 0.8
  for: [c, cpp, go, elf, pe, macho]
  if:
    type: text
    substr: lcx_listen
- id: ew-lcx-tran
  desc: Earthworm lcx_tran function
  crit: notable
  conf: 0.8
  for: [c, cpp, go, elf, pe, macho]
  if:
    type: text
    substr: lcx_tran
- id: ew-lcx-slave
  desc: Earthworm lcx_slave function
  crit: notable
  conf: 0.8
  for: [c, cpp, go, elf, pe, macho]
  if:
    type: text
    substr: lcx_slave
- id: ew-rootkiter
  desc: Earthworm author domain
  crit: suspicious
  conf: 0.95
  for: [c, cpp, go, elf, pe, macho]
  if:
    type: text
    substr: rootkiter.com
- id: lcx-tran-func
  desc: LCX lcx_tran with -tran flag
  crit: notable
  conf: 0.7
  for: [c, cpp, go, elf, pe, macho]
  if:
    type: text
    regex: (lcx_tran|-tran.{0,20}lcx|lcx.{0,20}-tran)
- id: lcx-slave-func
  desc: LCX lcx_slave with -slave flag
  crit: notable
  conf: 0.7
  for: [c, cpp, go, elf, pe, macho]
  if:
    type: text
    regex: (lcx_slave|-slave.{0,20}lcx|lcx.{0,20}-slave)
- id: lcx-listen-func
  desc: LCX lcx_listen with -listen flag
  crit: notable
  conf: 0.7
  for: [c, cpp, go, elf, pe, macho]
  if:
    type: text
    regex: (lcx_listen|-listen.{0,20}lcx|lcx.{0,20}-listen)
- id: listen-port
  desc: Port forwarding listenport config
  crit: component
  conf: 0.5
  if:
    type: text
    regex: (?i)\blistenport\b\s*["']?\s*[:=]
- id: conn-port
  desc: Port forwarding connport config
  crit: component
  conf: 0.5
  if:
    type: text
    regex: (?i)\bconnport\b\s*["']?\s*[:=]
- id: chisel-client
  desc: Chisel client mode
  crit: notable
  conf: 0.7
  for: [go, elf, pe, macho]
  if:
    type: text
    substr: chisel client
- id: chisel-server
  desc: Chisel server mode
  crit: notable
  conf: 0.7
  for: [go, elf, pe, macho]
  if:
    type: text
    substr: chisel server
- id: source-rportfwd-command
  desc: Reverse port forwarding command in source
  crit: notable
  conf: 0.93
  platforms: [windows]
  for: [c, cpp]
  if:
    type: text
    regex: \brportfwd\b|reverse port forwarding
- id: source-pivot-agent-command
  desc: Pivoting agent command module in source
  crit: notable
  conf: 0.92
  platforms: [windows]
  for: [c, cpp]
  if:
    type: text
    regex: pivoting module|connect to a pivoting agent
- id: gost-name
  desc: GOST tunnel tool string
  crit: component
  conf: 0.78
  for: [shell, python, javascript, php, powershell]
  if:
    type: text
    word: gost
  not:
  - substr: August
  - substr: GOST28147
  - substr: GOST R
  - substr: Hashing Engines
  - substr: gost-crypto
  unless:
  - type: text
    substr: Hashing Engines
  - type: text
    substr: gost-crypto
- id: gost-listener-flag
  desc: GOST listener flag syntax
  crit: suspicious
  conf: 0.86
  for: [shell, python, javascript, php, powershell]
  unless:
  - id: well-known/app/
  if:
    type: text
    regex: \bgost\b.{0,80}\s-L\s+\S+
- id: gost-forward-flag
  desc: GOST forward flag syntax
  crit: suspicious
  conf: 0.85
  for: [shell, python, javascript, php, powershell]
  unless:
  - id: well-known/app/
  if:
    type: text
    regex: \bgost\b.{0,80}\s-F\s+\S+
- id: gost-scheme--rx-2
  desc: http2:// proxy URL scheme
  crit: notable
  conf: 0.5
  for: [shell, python, javascript, php, powershell]
  if:
    type: string_literal
    substr: http2://
# gost-scheme--rx-3 (`grpc://` literal) moved to
# micro-behaviors/communications/grpc::url-scheme-reference: gRPC's own URL
# scheme is neutral protocol use (Arrow Flight, Envoy, every RPC client), not
# GOST tunnel evidence.

- id: gost-scheme--rx-4
  desc: quic:// proxy URL scheme
  crit: notable
  conf: 0.5
  for: [shell, python, javascript, php, powershell]
  if:
    type: string_literal
    substr: quic://
- id: gost-scheme--rx-6
  desc: rudp:// proxy URL scheme
  crit: notable
  conf: 0.5
  for: [shell, python, javascript, php, powershell]
  if:
    type: string_literal
    substr: rudp://
- id: ngrok-authtoken-config
  desc: Ngrok auth token configured
  crit: suspicious
  conf: 0.94
  for: [batch, shell, powershell]
  if:
    type: text
    # Match an executed command, not the documented command in a setup
    # comment or heredoc.
    regex: '(?im)(^|[;&|]\s*)(sudo\s+)?ngrok\s+config\s+add-authtoken\b'
- id: ngrok-rdp-tcp-tunnel
  desc: Ngrok TCP tunnel to RDP
  crit: suspicious
  conf: 0.96
  for: [batch, shell, powershell]
  if:
    type: text
    regex: (?i)\bngrok\s+tcp\s+3389\b
- id: devtunnels-rdp-forwarding
  desc: Dev Tunnel endpoint paired with RDP
  crit: suspicious
  conf: 0.97
  platforms: [windows]
  for: [batch, powershell, csharp, python, javascript, go, pe, dll]
  if:
    type: text
    regex: '(?is)(devtunnels\.ms.{0,320}\b3389\b|\b3389\b.{0,320}devtunnels\.ms)'
composite_rules:
- id: earthworm
  desc: Earthworm tunneling tool (APT lateral
  crit: suspicious
  conf: 0.95
  for: [c, cpp, go, elf, pe, macho]
  any:
  - id: ew-rootkiter
  - id: ew-ssocksd
  - id: ew-rcsocks
  - id: ew-rssocks
  - id: ew-lcx-listen
  - id: ew-lcx-tran
  - id: ew-lcx-slave
  needs: 3
- id: lcx
  desc: LCX-style port forwarding tool
  crit: suspicious
  conf: 0.85
  for: [c, cpp, go, elf, pe, macho]
  needs: 2
  any:
  - id: ew-lcx-listen
  - id: ew-lcx-tran
  - id: ew-lcx-slave
  - id: lcx-tran-func
  - id: lcx-slave-func
  - id: lcx-listen-func
- id: lcx-config
  desc: LCX-style port forwarding configuration
  crit: notable
  conf: 0.8
  all:
  - id: listen-port
  - id: conn-port
  downgrade:
    any:
    - id: objectives/anti-static/obfuscation/code-metrics/structure/
    - id: metadata/build/bundler/asset::js-large-module-bundle
- id: chisel
  desc: Chisel HTTP tunneling tool
  crit: notable
  conf: 0.9
  any:
  - id: chisel-client
  - id: chisel-server
  needs: 2
- id: frp
  desc: FRP client/server source references
  crit: notable
  conf: 0.9
  for: [shell, python, javascript, php, powershell]
  any:
  - id: well-known/dual-use/tunnel/frp::frp-server-source-name
  - id: well-known/dual-use/tunnel/frp::frp-client-source-name
  needs: 2
- id: gost
  desc: GOST proxy tunneling tool
  crit: suspicious
  conf: 0.92
  for: [shell, python, javascript, php, powershell]
  unless:
  - id: well-known/lib/ai/lmcache::wheel-member-context
  - id: well-known/app/
  any:
  - id: gost-listener-flag
  - id: gost-forward-flag
  - id: gost-name
  - id: gost-scheme
  needs: 2
- id: ngrok-rdp-tunnel-script
  desc: Ngrok RDP tunnel script
  crit: hostile
  conf: 0.98
  for: [batch, shell, powershell]
  all:
  - id: well-known/dual-use/tunnel/ngrok::cli-invocation
  - id: ngrok-authtoken-config
  - id: ngrok-rdp-tcp-tunnel
- id: source-pivot-proxy-tasking
  desc: Source code implements pivot, SOCKS, and reverse forwarding
  crit: suspicious
  conf: 0.96
  attack: T1090
  platforms: [windows]
  for: [c, cpp]
  all:
  - id: source-pivot-agent-command
  any:
  - id: source-rportfwd-command
  - id: micro-behaviors/communications/proxy/socks::source-socks5-proxy-command
  needs: 2
- id: gost-scheme
  desc: GOST protocol scheme
  crit: component
  conf: 0.5
  for: [shell, python, javascript, php, powershell]
  any:
  - id: micro-behaviors/communications/proxy/socks::socks5-string
  - id: gost-scheme--rx-2
  - id: micro-behaviors/communications/grpc::url-scheme-reference
  - id: gost-scheme--rx-4
  - id: micro-behaviors/communications/proxy/reverse::remote-tcp-url-scheme
  - id: gost-scheme--rx-6
