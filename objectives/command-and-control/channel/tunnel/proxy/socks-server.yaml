defaults:
  platforms: [linux, macos, windows]
  for: [elf, macho, pe]
  attack: T1090
  mbc: B0030
traits:
  - id: ftp-client-basename
    desc: FTP-named executable
    crit: component
    conf: 0.98
    for: [elf]
    if:
      type: basename
      exact: ftp
  - id: socks-server-label
    desc: SOCKS proxy server status label
    crit: notable
    conf: 0.7
    if:
      type: text
      # Keep lifecycle words on the same printable string.  APT's FTP method
      # contains client-side SOCKS error text and socket APIs, but does not
      # report a SOCKS listener being started or bound.
      regex: '(?i)\bSOCKS[ \t]+(server|proxy)[ \t]+(started|listening|bound)\b'
  - id: socks-port-forward-command-menu
    desc: SOCKS and port-forward command menu
    crit: suspicious
    conf: 0.99
    if:
      type: text
      regex: '/redshell socks start <port>[\s\S]{0,320}/redshell portfwd start <lp> <rh> <rp>'
composite_rules:
  - id: socket-server-api
    desc: Socket server API lifecycle
    crit: component
    conf: 0.88
    any:
      - id: micro-behaviors/communications/socket/listen::listen
      - id: micro-behaviors/communications/socket/syscall::server-comp
      - id: micro-behaviors/communications/socket/init::winsock-server-symbol-lifecycle
  # A single six-byte greeting can occur as unreferenced data in unrelated
  # native text or in a SOCKS client library.  Require an explicit server
  # marker/symbol, or two distinct wire patterns, to retain custom SOCKS
  # servers while avoiding proxy-capable network tools and RE toolkits.
  - id: socks5-wire-pattern-cluster
    desc: Multiple SOCKS5 request byte patterns
    crit: component
    conf: 0.9
    needs: 2
    any:
      - id: micro-behaviors/communications/proxy/socks::socks5-version-greeting-bytes
      - id: micro-behaviors/communications/proxy/socks::socks5-bind-command-byte
      - id: micro-behaviors/communications/proxy/socks::socks5-udp-associate-byte
  - id: socks-server-implementation
    desc: SOCKS proxy server with listener and protocol evidence
    crit: hostile
    conf: 0.94
    all:
      - id: socket-server-api
    any:
      - id: socks-server-label
      - id: socks-port-forward-command-menu
      - id: micro-behaviors/communications/proxy/socks::socks5-server-symbol
      - id: socks5-wire-pattern-cluster
    unless:
      - id: objectives/command-and-control/channel/tunnel/proxy::ftp-client-basename
