# Reverse SSH that forwards the victim's local SSH service and survives
# disconnects provides an interactive operator access channel.
defaults:
  platforms: [linux, macos, windows]
  for: [javascript, typescript]
  attack: T1572,T1021.004,T1059.007

composite_rules:
  - id: node-retrying-reverse-ssh-access
    desc: Retries reverse SSH with host verification disabled
    crit: hostile
    conf: 0.99
    near_bytes: 1800
    all:
      - id: micro-behaviors/communications/ssh/connect::node-source-ssh-reverse-forward
      - id: micro-behaviors/communications/ssh/client::strict-host-disable
      - id: micro-behaviors/communications/ssh/connect::node-source-ssh-retry-loop

