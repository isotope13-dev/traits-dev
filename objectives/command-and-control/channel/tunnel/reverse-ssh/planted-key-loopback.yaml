# The script installs its own login key, then publishes a host-local
# listener on an operator's SSH server without verifying that server's
# identity. The local port is often a variable, so the forward is matched by
# its loopback target rather than port 22.
defaults:
  platforms: [unix]
  for: [shell]
  attack: T1572,T1098.004,T1021.004

composite_rules:
  - id: planted-key-unverified-loopback-reverse-tunnel
    desc: Plants SSH login key and reverse-forwards a loopback service unverified
    crit: hostile
    conf: 0.97
    near_bytes: 8192
    all:
      - id: micro-behaviors/communications/ssh/keys::authorized-keys-write-operation
      - id: micro-behaviors/communications/ssh/connect::remote-forward-to-loopback-service
      - id: micro-behaviors/communications/ssh/connect::ssh-remote-forward-command
      - id: micro-behaviors/communications/ssh/client::strict-host-disable
