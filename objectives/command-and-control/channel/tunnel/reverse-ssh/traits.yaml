# Reverse SSH gives an operator an outbound SSH channel into a host that may
# not accept inbound connections.  The protocol fields are neutral mechanics;
# the combinations below identify a reverse-access channel or persistence.
defaults:
  platforms: [linux, macos, windows]
  for: [elf, pe, macho, go, binaries, source, scripts, python, javascript, typescript, systemd-service]
  attack: T1572,T1021.004

traits:
  - id: native-system-reverse-ssh
    desc: C executes reverse SSH forwarding
    crit: suspicious
    conf: 0.98
    for: [c, cpp]
    if:
      type: text
      regex: '(?s)\bssh\b.{0,160}\s-R\s+.{0,320}\bsystem\s*\('

composite_rules:
  - id: nhas-reverse-ssh-remote-access
    desc: NHAS reverse_ssh client with remote SSH forwarding
    crit: suspicious
    conf: 0.97
    all:
      - id: well-known/dual-use/tunnel/nhas-reverse-ssh::nhas-reverse-ssh-client
      - id: well-known/dual-use/tunnel/nhas-reverse-ssh::nhas-remote-forward-handler

  - id: nhas-reverse-ssh-pty-access
    desc: NHAS reverse_ssh client with pseudo-terminal access
    crit: suspicious
    conf: 0.96
    all:
      - id: well-known/dual-use/tunnel/nhas-reverse-ssh::nhas-reverse-ssh-client
      - id: micro-behaviors/process/tty/pty::pty-open-call

  - id: reverse-ssh-restarting-service
    desc: Reverse SSH tunnel service configured to restart indefinitely
    crit: suspicious
    conf: 0.96
    all:
      - id: micro-behaviors/communications/ssh/connect::ssh-remote-forward-command
      - id: micro-behaviors/os/service/restart-policy::restart-always-text
    near_bytes: 4096

  - id: reverse-ssh-boot-service
    desc: Reverse SSH tunnel enrolled for automatic service startup
    crit: suspicious
    conf: 0.96
    all:
      - id: micro-behaviors/communications/ssh/connect::ssh-remote-forward-command
      - id: objectives/persistence/system/service/systemd::wanted-by-target
    near_bytes: 4096

  - id: password-reverse-forward-to-powershell-webshell
    desc: Passworded reverse tunnel exposes a local PowerShell webshell
    crit: hostile
    conf: 0.995
    for: [powershell]
    attack: T1572,T1021.004,T1505.003
    all:
      - id: micro-behaviors/communications/ssh/connect::putty-password-remote-forward-command
      - id: micro-behaviors/communications/http/server/managed::powershell-loopback-httplistener
      - id: objectives/command-and-control/backdoor/webshell/exec::powershell-httplistener-command-webshell

  - id: unverified-root-web-port-reverse-ssh
    desc: Root reverse SSH channel on port 443 disables host verification
    crit: hostile
    conf: 0.995
    attack: T1572,T1021.004,T1078
    near_bytes: 1024
    all:
      - id: micro-behaviors/communications/ssh/connect::ssh-remote-forward-command
      - id: micro-behaviors/communications/ssh/connect::ssh-port-443-command
      - id: micro-behaviors/communications/ssh/connect::ssh-root-login-command
      - id: micro-behaviors/communications/ssh/client::strict-host-disable
      - id: micro-behaviors/communications/ssh/client::null-known-hosts-file

  - id: system-profile-key-reverse-ssh
    desc: Native implant opens a reverse SSH channel with a system-profile key
    crit: hostile
    conf: 0.995
    attack: T1572,T1021.004,T1059
    near_bytes: 1024
    all:
      - id: micro-behaviors/communications/ssh/connect::ssh-remote-forward-command
      - id: micro-behaviors/communications/ssh/client::windows-systemprofile-identity-file
      - id: micro-behaviors/process/create/launch::create-process-api-name

  - id: native-unverified-reverse-ssh-implant
    desc: Native implant launches reverse SSH without retaining host keys
    crit: hostile
    conf: 0.99
    attack: T1572,T1021.004,T1059
    near_bytes: 1024
    all:
      - id: micro-behaviors/communications/ssh/connect::ssh-remote-forward-command
      - id: micro-behaviors/communications/ssh/client::strict-host-disable
      - id: micro-behaviors/communications/ssh/client::null-known-hosts-file
      - id: micro-behaviors/process/create/launch::create-process-api-name
