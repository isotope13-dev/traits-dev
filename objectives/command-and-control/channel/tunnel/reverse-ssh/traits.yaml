# Reverse SSH gives an operator an outbound SSH channel into a host that may
# not accept inbound connections.  The protocol fields are neutral mechanics;
# the combinations below identify a reverse-access channel or persistence.
defaults:
  platforms: [linux, macos, windows]
  for: [elf, pe, macho, go, binaries, source, scripts, python, javascript, typescript, systemd-service]
  attack: T1572,T1021.004

composite_rules:
  - id: ssh-reverse-forwarding-client
    desc: SSH endpoint implements remote forwarding channels
    crit: suspicious
    conf: 0.95
    # A native library under a Python package's conventional .dylibs/.libs
    # directory implements protocol fields as a dependency, not as the app's
    # reverse-SSH client or tunnel configuration.
    unless:
      - id: metadata/package/files/wheel-sdist::python-wheel-vendored-shlib-dir
      - id: well-known/lib/network/libssh2::windows-runtime-library
      - id: well-known/dual-use/transfer/aria2::aria2-downloader-context
      - id: well-known/app/infrastructure/minikube::minikube-release-binary-context
      # sing-box embeds Go's SSH protocol implementation for its ordinary
      # outbound proxy. Its forwarding strings are library protocol fields,
      # not a reverse-access endpoint.
      - id: well-known/dual-use/tunnel/sing-box::sagernet-sing-box-go-module-elf
      - id: well-known/dual-use/tunnel/sing-box::sagernet-sing-box-go-module-pe
      - id: well-known/dual-use/tunnel/sing-box::sing-box-package-context
      - id: well-known/app/infrastructure/circleci-cli::official-cli-binary
    all:
      - id: micro-behaviors/communications/ssh/connect::connect-comp
      - id: micro-behaviors/communications/ssh/connect::ssh-remote-forward-request-field
      - id: micro-behaviors/communications/ssh/connect::ssh-forwarded-tcpip-channel-field

  - id: nhas-reverse-ssh-remote-access
    desc: NHAS reverse_ssh client with remote SSH forwarding
    crit: suspicious
    conf: 0.97
    all:
      - id: well-known/dual-use/tunnel/nhas-reverse-ssh::nhas-reverse-ssh-client
      - id: well-known/dual-use/tunnel/nhas-reverse-ssh::nhas-remote-forward-handler

  - id: nhas-reverse-ssh-pty-access
    desc: NHAS reverse_ssh client with pseudo-terminal access
    crit: suspicious
    conf: 0.96
    all:
      - id: well-known/dual-use/tunnel/nhas-reverse-ssh::nhas-reverse-ssh-client
      - id: micro-behaviors/process/tty/pty::pty-open-call

  - id: reverse-ssh-restarting-service
    desc: Reverse SSH tunnel service configured to restart indefinitely
    crit: suspicious
    conf: 0.96
    all:
      - id: micro-behaviors/communications/ssh/connect::ssh-remote-forward-command
      - id: micro-behaviors/os/service/restart-policy::restart-always-text
    near_bytes: 4096

  - id: reverse-ssh-boot-service
    desc: Reverse SSH tunnel enrolled for automatic service startup
    crit: suspicious
    conf: 0.96
    all:
      - id: micro-behaviors/communications/ssh/connect::ssh-remote-forward-command
      - id: objectives/persistence/system/service/systemd::wanted-by-target
    near_bytes: 4096
