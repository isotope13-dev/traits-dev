defaults:
  platforms: [unix, windows]
  for: [scripts, source, binaries]
  conf: 0.98
  attack: T1572,T1021.004

composite_rules:
  - id: embedded-key-unverified-local-ssh-tunnel
    desc: Embedded-key tunnel bypasses SSH host verification
    crit: suspicious
    near_bytes: 8192
    all:
      - id: micro-behaviors/communications/ssh/connect::remote-forward-to-local-sshd-option
      - id: micro-behaviors/communications/ssh/client::strict-host-disable
      - id: micro-behaviors/communications/ssh/client::null-known-hosts-file
      - id: micro-behaviors/crypto/key/representation::embedded-openssh-private-key

  - id: authorized-key-reverse-ssh-access
    desc: Planted SSH key exposed through reverse tunnel
    crit: hostile
    for: [scripts, source]
    attack: T1098.004,T1572
    near_bytes: 8192
    all:
      - id: micro-behaviors/crypto/asymmetric/ssh::hardcoded-public-key
      - id: micro-behaviors/communications/ssh/keys::authorized-keys-write-operation
      # The login key and exposed local sshd establish retained access. The
      # outbound client's identity can come from an agent or a generated key;
      # embedding a private key is incidental to the access mechanism.
      - id: micro-behaviors/communications/ssh/connect::remote-forward-to-local-sshd-option
      - id: micro-behaviors/communications/ssh/client::strict-host-disable
      - id: micro-behaviors/communications/ssh/client::null-known-hosts-file
