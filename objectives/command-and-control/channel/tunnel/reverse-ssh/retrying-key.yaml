# Retrying SSH is ordinary administration. Require the planted authorized key
# and embedded-identity reverse tunnel before inferring retained attacker access.
defaults:
  platforms: [linux, macos, windows]
  for: [scripts, source]
  attack: T1572,T1021.004,T1098.004

composite_rules:
  - id: reverse-tunnel-retry-mechanism
    desc: Reverse tunnel retry or restart mechanism
    crit: notable
    conf: 0.96
    any:
      - id: micro-behaviors/communications/ssh/connect::ssh-retry-loop
      - id: reverse-ssh-restarting-service
      - id: micro-behaviors/os/autorun/cron/unspecified::crontab-append-pipeline

  - id: retrying-key-reverse-ssh-access
    desc: Retrying reverse tunnel exposes planted SSH key
    crit: hostile
    conf: 0.99
    near_bytes: 8192
    all:
      - id: reverse-tunnel-retry-mechanism
    any:
      - id: authorized-key-reverse-ssh-access
      - id: authorized-key-local-sshd-reverse-forward
