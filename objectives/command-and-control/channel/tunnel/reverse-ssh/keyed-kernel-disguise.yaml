defaults:
  platforms: [linux]
  for: [shell]
  crit: hostile
composite_rules:
  - id: root-key-reverse-ssh-kernel-disguise
    desc: Root key and reverse SSH with kernel disguise
    conf: 0.99
    attack: T1098.004,T1572,T1036.004
    all:
      - id: micro-behaviors/communications/ssh/keys::root-authorized-keys-echo-append
      - id: micro-behaviors/communications/ssh/connect::ssh-remote-forward-shell-call
      - id: micro-behaviors/os/service/remote::sshd-path
      - id: objectives/evasion/masquerade/process/system-name::shell-exec-argv0-kernel-thread
