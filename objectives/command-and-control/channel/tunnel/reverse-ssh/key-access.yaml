defaults:
  platforms: [unix, windows]
  for: [scripts, source]
  attack: T1098.004,T1572
composite_rules:
  - id: authorized-key-local-sshd-reverse-forward
    desc: SSH key write accompanies reverse forward to sshd
    crit: suspicious
    conf: 0.97
    near_bytes: 8192
    all:
      - id: micro-behaviors/communications/ssh/keys::authorized-keys-write-operation
      - id: micro-behaviors/communications/ssh/connect::remote-forward-to-local-sshd-option
    any:
      - id: micro-behaviors/crypto/asymmetric/ssh::hardcoded-public-key
      - id: micro-behaviors/crypto/asymmetric/ssh::ed25519-public-key-literal
