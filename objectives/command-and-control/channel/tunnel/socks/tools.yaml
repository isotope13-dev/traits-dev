defaults:
  platforms: [linux, macos, windows]
  for: [shell, python, javascript, php, powershell, go]
  attack: T1572
traits:
- id: socks-server-mode
  desc: SOCKS server mode with a port option
  crit: notable
  conf: 0.94
  for: [scripts, shell, powershell, batch, python, javascript, go]
  if:
    type: text
    # Require an explicit SOCKS mode on the same command line.  A generic
    # application server such as `server --port 8181` is not a tunnel.
    regex: '(?i)\bserver\b[^\r\n]{0,80}\bsocks(4|5)?\b[^\r\n]{0,80}\s-{1,2}(p|port)\s+\d{2,5}\b'
composite_rules:
- id: socks-tunnel-server-command
  desc: SOCKS tunnel server command
  crit: suspicious
  conf: 0.95
  all:
  - id: socks-server-mode
  - id: micro-behaviors/communications/proxy/socks::socks-server-proxy-mode
  near_lines: 2

- id: binary-socks-listener
  desc: Binary SOCKS proxy listener
  crit: suspicious
  conf: 0.9
  for: [elf, macho]
  all:
  - id: micro-behaviors/communications/proxy/socks::socks5-server-symbol
  - id: micro-behaviors/communications/socket/listen::listen
  unless:
  - id: metadata/signed/platform::apple
