defaults:
  platforms: [windows, unix]
  for: [python]
  attack: T1572

traits:
- id: python-websocket-tunnel-verbs
  desc: WebSocket tunnel open data close protocol
  crit: notable
  conf: 0.94
  if:
    type: text
    regex: 'tunnel_open[\s\S]{0,160}tunnel_data[\s\S]{0,160}tunnel_close'
- id: python-socks-data-message
  desc: Python SOCKS data message
  crit: notable
  conf: 0.88
  # Only the `socks_<verb>` handler names: a bare "SOCKS5" mention is the
  # canonical micro-behaviors/communications/proxy/socks::socks5-proto atom,
  # and matching it here double-counted every SOCKS docstring as a tunnel
  # building block.
  if:
    type: text
    regex: '\bsocks_(connect|data|close)\b'

composite_rules:
- id: python-websocket-socks-tunnel
  desc: Python WebSocket SOCKS tunnel
  crit: suspicious
  conf: 0.95
  unless:
  - id: metadata/package/testing/
  - id: well-known/tool/detection/security-scanner/
  - id: metadata/path::test-directory-component
  # A SOCKS5 mention beside a WebSocket client is two independent features.
  # The tunnel claim needs the socks_<verb> handlers or the
  # tunnel_open/tunnel_data/tunnel_close sequence.
  all:
  - id: python-websocket-json-base64
  any:
  - id: python-socks-data-message
  - id: python-websocket-tunnel-verbs
- id: python-websocket-json-base64
  desc: Python WebSocket JSON base64 use
  crit: component
  conf: 0.9
  all:
  - id: micro-behaviors/communications/http/websocket::websockets-python-lib
  any:
  - id: metadata/lang/source/naming/resource::b64decode-string
  - id: micro-behaviors/data/encode/base64::b64encode-call
  - id: micro-behaviors/data/codec::base64-helper-invocation
  - id: micro-behaviors/data/serialize/json::python-json-parse-and-serialize
