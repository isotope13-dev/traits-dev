# Tailscale is a dual-use tunnel. Enrollment is a neutral capability; the
# objective composites below require the wider access pattern.
defaults:
  platforms: [unix, windows]
  for: [python, shell, scripts]
  attack: "T1090.001,T1021"

traits:
  - id: userspace-networking-mode
    desc: Tailscale userspace networking mode
    crit: notable
    conf: 0.96
    if:
      type: text
      regex: '(?i)\b(tailscale|tailscaled)\b[^\n]{0,180}--tun[= ]userspace-networking'

  - id: local-socks-egress-proxy
    desc: Tailscale local SOCKS egress proxy
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: '(?is)\btailscale(d)?\b.{0,360}--socks5-server(=|\s+)127\.0\.0\.1:[0-9]+'

  - id: memory-only-node-state
    desc: Tailscale keeps node identity only in memory
    crit: notable
    conf: 0.97
    if:
      type: text
      regex: '(?is)\btailscaled\b.{0,300}--state(=|\s+)mem:'

  - id: client-telemetry-suppression
    desc: Tailscale disables client telemetry
    crit: notable
    conf: 0.98
    if:
      type: text
      regex: '(?is)\btailscaled\b.{0,300}--no-logs-no-support\b'

  - id: accept-routes
    desc: Tailscale accepts remote routes
    crit: notable
    conf: 0.92
    if:
      type: text
      regex: '(?is)\b(tailscale|tailscaled)\b.{0,220}--accept-routes\b'

composite_rules:
  - id: ephemeral-mesh-egress-enrollment
    desc: Authenticated userspace mesh enrollment with SOCKS egress
    crit: suspicious
    conf: 0.98
    all:
      - id: userspace-networking-mode
      - id: micro-behaviors/network/tunnel::auth-key-enrollment
      - id: local-socks-egress-proxy
    any:
      - id: accept-routes
      - id: well-known/dual-use/tunnel/tailscale::tailscale-source-token
    near_lines: 12

  - id: memory-only-telemetry-suppressed-egress
    desc: Memory-only Tailscale SOCKS relay suppresses logs
    crit: suspicious
    conf: 0.98
    all:
      - id: memory-only-node-state
      - id: client-telemetry-suppression
      - id: local-socks-egress-proxy
    near_lines: 8
