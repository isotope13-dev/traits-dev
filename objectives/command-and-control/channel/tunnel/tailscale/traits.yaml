# Tailscale userspace enrollment can turn a short-lived sandbox into a routed
# internal-network client.  The product is dual-use; severity comes from the
# combination of an auth-key enrollment, userspace mode, and a local SOCKS
# egress proxy rather than from the product name alone.
defaults:
  platforms: [unix, windows]
  for: [shell, scripts]
  attack: "T1090.001,T1021"

traits:
  - id: userspace-networking-mode
    desc: Tailscale userspace networking mode
    crit: notable
    conf: 0.96
    if:
      type: text
      regex: '(?i)\b(tailscale|tailscaled)\b[^\n]{0,180}--tun[= ]userspace-networking'

  - id: auth-key-enrollment
    desc: Tailscale auth-key device enrollment
    crit: suspicious
    conf: 0.94
    if:
      type: text
      regex: '(?i)\b(tailscale|tailscaled)\b[^\n]{0,220}--auth-key[= ]\S+'

  - id: local-socks-egress-proxy
    desc: Tailscale local SOCKS egress proxy
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: '(?is)\b(tailscale|tailscaled)\b.{0,220}--socks5-server=127\.0\.0\.1:[0-9]+'

  - id: accept-routes
    desc: Tailscale accepts remote routes
    crit: notable
    conf: 0.92
    if:
      type: text
      regex: '(?is)\b(tailscale|tailscaled)\b.{0,220}--accept-routes\b'

composite_rules:
  - id: ephemeral-mesh-egress-enrollment
    desc: Authenticated userspace mesh enrollment with SOCKS egress
    crit: suspicious
    conf: 0.98
    all:
      - id: userspace-networking-mode
      - id: auth-key-enrollment
      - id: local-socks-egress-proxy
    any:
      - id: accept-routes
      - id: well-known/dual-use/tunnel/tailscale::tailscale-source-token
    near_lines: 12
