# Commodity WSH downloaders hardcode dozens of throwaway C2 hosts and pick
# one with Math.random() on each run, so blocking any single domain fails.
defaults:
  platforms: [windows]
  for: [javascript]
  attack: T1008,T1568
traits:
  - id: js-hardcoded-random-label-http-host-pool
    desc: Many hardcoded random-label HTTP hosts
    crit: notable
    conf: 0.9
    count_min: 10
    if:
      type: text
      regex: '(?m)^\s*[\w$]+\s*=\s*"http://[a-z0-9]{5,8}\.[a-z]{5,20}\.[a-z]{2,10}/";'
composite_rules:
  - id: wsh-random-c2-host-pool-selection
    desc: WSH script picks random host from C2 pool
    crit: hostile
    conf: 0.95
    all:
      - id: js-hardcoded-random-label-http-host-pool
      - id: micro-behaviors/os/random/prng/stdlib::math-random-call
      - id: micro-behaviors/os/com/instantiation::wscript-shell-activex-constructor
