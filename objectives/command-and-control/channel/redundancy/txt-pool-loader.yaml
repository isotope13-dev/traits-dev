defaults:
  platforms: [windows, unix]
  for: [javascript]
  crit: suspicious
  conf: 0.95
  attack: T1071.004
composite_rules:
  - id: doh-txt-remote-module-loader
    desc: Raced DoH TXT + module import co-occurrence
    near_bytes: 2400
    all:
      - id: micro-behaviors/data/control-flow/async::promise-first-fulfilled
      - id: micro-behaviors/communications/dns/txt::doh-txt-query-parameter
      - id: micro-behaviors/communications/dns/txt::json-answer-txt-filter
      - id: micro-behaviors/communications/dns/doh::doh-json-content-type
      - id: micro-behaviors/os/module/require::computed-https-import
  - id: doh-txt-transparent-viewport-frame
    desc: Raced DoH TXT + transparent frame co-occurrence
    near_bytes: 2400
    all:
      - id: micro-behaviors/data/control-flow/async::promise-first-fulfilled
      - id: micro-behaviors/communications/dns/txt::doh-txt-query-parameter
      - id: micro-behaviors/communications/dns/txt::json-answer-txt-filter
      - id: micro-behaviors/communications/dns/doh::doh-json-content-type
      - id: micro-behaviors/ui/window/visibility::iframe-create
      - id: micro-behaviors/ui/window/style::viewport-width-css
      - id: micro-behaviors/ui/window/style::viewport-height-css
      - id: micro-behaviors/ui/window/style::transparent-background-css
