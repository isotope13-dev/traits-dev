defaults:
  platforms: [windows]
  for: [pe]

traits:
  - id: native-pastebin-cnc-fallback-status
    desc: Pastebin C2 fallback status text
    crit: notable
    if:
      type: text
      substr: 'Both IP and Domain failed. Fetching CNC from Pastebin'

composite_rules:
  - id: native-c2-pastebin-fallback
    desc: Native attack client reports Pastebin C2 fallback
    crit: hostile
    conf: 0.99
    attack: T1008
    all:
      - id: native-pastebin-cnc-fallback-status
      - id: objectives/command-and-control/beacon/network/tcp::native-c2-attack-command-client
