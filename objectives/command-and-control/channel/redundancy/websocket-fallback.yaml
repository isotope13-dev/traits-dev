# A second, different transport for the same collected data, reached when the
# first one errors.
#
# Redundancy here is not about two addresses (that is
# `redundant-c2-infrastructure` in multi-channel.yaml) but about two
# *protocols*: the host profile goes out over HTTP, and the failure handler
# hands the identical serialized object to a WebSocket. An operator does this
# so that egress filtering or a blocked host does not cost them the victim;
# the same redundancy is what makes the pair recognizable, because ordinary
# code that supports several transports negotiates one up front instead of
# re-sending after a transport error.
#
# PhantomRaven (CrowdStrike Counter Adversary Operations, September 2026)
# carried this as `sendViaWebSocket(data)` in the `req.on("error", ...)`
# handler of its HTTP exfiltration path -- CrowdStrike mapped it to T1104,
# Multi-Stage Channels. The WebSocket URL in the analyzed sample was still the
# generator's placeholder, so the matcher keys on the two-transport structure
# and the profile being sent, never on a host.
defaults:
  platforms: [unix, windows]
  attack: "T1104,T1041,T1071.001"
  mbc: "B0030"

composite_rules:
  - id: js-host-profile-http-websocket-failover
    desc: Host profile re-sent over WebSocket when HTTP exfil fails
    crit: hostile
    conf: 0.96
    for: [javascript, typescript]
    scope: file
    all:
      # What is being shipped: the install-time host and CI fingerprint, not
      # arbitrary application data on a resilient socket.
      - id: objectives/supply-chain/recon-exfil/install-hook::js-install-host-profile
      - id: micro-behaviors/communications/http/request/client::node-http-post-json-body
      - id: micro-behaviors/communications/websocket/send::websocket-instance-send-call
      # The failover itself: the transport error is swallowed rather than
      # surfaced, which is what lets the second channel run unnoticed.
      - id: micro-behaviors/data/control-flow/error-handling::silent-error-handler
    unless:
      - id: well-known/tool/detection/
      - id: metadata/package/testing/presence/harness::test-directory-path
