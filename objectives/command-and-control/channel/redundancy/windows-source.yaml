defaults:
  platforms: [windows]
  for: [c, cpp]
  attack: T1071
  mbc: B0030

traits:
  - id: http-transport-selector-token
    desc: HTTP transport selector token
    crit: notable
    conf: 0.88
    if:
      type: text
      regex: (?i)\b(TRANSPORT|PROTO|CHANNEL)_(HTTPS?|WEB)\b
  - id: tcp-transport-selector-token
    desc: TCP transport selector token
    crit: notable
    conf: 0.88
    if:
      type: text
      regex: (?i)\b(TRANSPORT|PROTO|CHANNEL)_TCP\b
  - id: udp-transport-selector-token
    desc: UDP transport selector token
    crit: notable
    conf: 0.86
    if:
      type: text
      regex: (?i)\b(TRANSPORT|PROTO|CHANNEL)_UDP\b
  - id: c2-command-file-token
    desc: C2 file command token
    crit: notable
    conf: 0.88
    if:
      type: text
      regex: (?i)\bCMD_(UPLOAD|DOWNLOAD)\b
  - id: c2-command-beacon-token
    desc: C2 beacon command token
    crit: notable
    conf: 0.86
    if:
      type: text
      regex: (?i)\bCMD_(SLEEP|BEACON)\b

composite_rules:
  - id: c2-command-enum-token
    desc: C2 command enum token
    crit: component
    conf: 0.9
    any:
      - id: metadata/lang/source/naming/action/token::cmd-shell-exec-identifier
      - id: c2-command-file-token
      - id: c2-command-beacon-token
  - id: c2-multi-transport-selectors
    desc: Command and transport selector names
    crit: notable
    conf: 0.9
    all:
      - id: c2-command-enum-token
    any:
      - id: http-transport-selector-token
      - id: tcp-transport-selector-token
      - id: udp-transport-selector-token
    needs: 2
  - id: multi-transport-backdoor-source
    desc: Multi-transport command backdoor source
    crit: hostile
    conf: 0.98
    all:
      - id: c2-multi-transport-selectors
      - id: c2-command-enum-token
      - id: micro-behaviors/communications/http/client/wininet::wininet-http-client-src
      - id: micro-behaviors/communications/socket/create::tcp-connect-socket-source
      - id: micro-behaviors/communications/socket/connect/attempt::connect-symbol
    any:
      - id: micro-behaviors/communications/socket/send/reference::send-symbol
      - id: micro-behaviors/communications/socket/receive::recv-symbol
