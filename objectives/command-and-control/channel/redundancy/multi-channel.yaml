defaults:
  platforms:
    - unix
    - windows
  attack: T1071
  mbc: B0030
composite_rules:
  - id: go-dns-icmp-https-channel-suite
    desc: Go C2 uses DNS ICMP HTTPS
    crit: hostile
    conf: 0.97
    for:
      - go
    all:
      - id: micro-behaviors/communications/dns/client::dns-channel-constructor
      - id: micro-behaviors/communications/icmp::icmp-channel-constructor
      - id: micro-behaviors/communications/http/channel::http-channel-constructor
