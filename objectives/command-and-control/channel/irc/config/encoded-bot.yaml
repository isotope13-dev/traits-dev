defaults:
  for: [text, c]
  platforms: [windows]
  crit: notable

traits:
  - id: encoded-irc-bot-config
    desc: IRC bot configuration label
    if:
      type: text
      substr: '#define s_ircorderprefix'
  - id: encoded-irc-orders
    desc: Download command label
    if:
      type: text
      substr: '#define s_order_dl'
  - id: encoded-usb-autorun-config
    desc: USB autorun configuration label
    if:
      type: text
      substr: '#define s_usb_autorundata1'
  - id: encoded-ddos-orders
    desc: DDoS command label
    if:
      type: text
      substr: '#define s_order_ddos_udp'
  - id: escaped-byte-sequence
    desc: Escaped byte string sequence
    if:
      type: text
      regex: '(\\x[0-9A-Fa-f]{2}){4}'
  - id: encoded-bot-string-table
    desc: Bot string table declaration
    if:
      type: text
      substr: 'strings_s strings[]'

composite_rules:
  - id: encoded-irc-bot-attack-config
    desc: Encoded IRC bot configuration with DDoS and USB autorun labels
    crit: hostile
    all:
      - id: encoded-irc-bot-config
      - id: encoded-irc-orders
      - id: encoded-usb-autorun-config
      - id: encoded-ddos-orders
      - id: encoded-bot-string-table
      - id: escaped-byte-sequence
