defaults:
  crit: notable
  attack: T1095
  for:
    - perl
  platforms:
    - unix
    - windows
traits:
  - id: perl-irc-nick-line
    desc: Sends an IRC NICK command
    crit: suspicious
    conf: 0.92
    if:
      type: text
      substr: '"NICK $'
  - id: perl-irc-join-line
    desc: Sends an IRC JOIN command
    crit: notable
    conf: 0.9
    if:
      type: text
      substr: '"JOIN $'
  - id: perl-irc-privmsg-line
    desc: Sends an IRC PRIVMSG command
    crit: notable
    conf: 0.9
    if:
      type: text
      substr: '"PRIVMSG $'
composite_rules:
  - id: perl-irc-session-bot
    desc: Perl bot joins an IRC channel
    crit: hostile
    conf: 0.97
    all:
      - id: perl-irc-nick-line
      - id: perl-irc-join-line
      - id: perl-irc-privmsg-line
    unless:
      - id: metadata/package/testing/presence/harness::perl-test-file
