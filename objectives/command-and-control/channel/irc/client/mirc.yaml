defaults:
  attack: T1546
  platforms:
    - unix
    - windows
  # mIRC scripts are frequently mislabeled with a `.m` suffix, which the
  # file-identification layer quite reasonably treats as Objective-C.  Keep
  # the additional scope narrow: these predicates require mIRC syntax and do
  # not classify ordinary Objective-C merely because it mentions IRC.
  for: [scripts, binaries, objectivec]
traits:
  - id: mirc-script-event-join
    desc: Detects mIRC JOIN event
    crit: suspicious
    if:
      type: text
      regex: 'ON ([*]|1):JOIN:'
      case_insensitive: true
    unless:
      - id: metadata/lang/encoded/xor::highlightjs-resource
  - id: mirc-script-event-join-bang
    desc: mIRC join event with a level mark
    crit: suspicious
    if:
      type: text
      case_insensitive: true
      substr: '!:JOIN:'
  - id: mirc-script-event-text
    desc: Detects mIRC TEXT event
    crit: suspicious
    if:
      type: text
      case_insensitive: true
      substr: ':TEXT:'
  - id: mirc-script-event-part
    desc: Detects mIRC PART event
    crit: suspicious
    if:
      type: text
      regex: 'ON ([*]|1):PART:'
      case_insensitive: true
  - id: mirc-script-event-quit
    desc: Detects mIRC QUIT event
    crit: suspicious
    if:
      type: text
      regex: 'ON ([*]|1):QUIT:'
      case_insensitive: true
  - id: mirc-script-cmd-dcc-send
    desc: Detects mIRC dcc send command
    crit: suspicious
    if:
      type: text
      case_insensitive: true
      substr: /dcc send
  - id: mirc-script-cmd-dot-dcc-send
    desc: mIRC dot-form dcc send command
    crit: suspicious
    if:
      type: text
      case_insensitive: true
      substr: .dcc send
  - id: mirc-script-cmd-dcc-send-bare
    desc: Bare mIRC dcc send command
    crit: suspicious
    for: [scripts]
    if:
      type: text
      case_insensitive: true
      # Bare protocol prose such as "DCC SEND" is common in IRC libraries.
      # mIRC commands occur after a script delimiter and may begin with '/'.
      regex: '(^|[;{|\r\n])\s*/?dcc\s+send\b'
  - id: mirc-script-cmd-msg-chan
    desc: Detects mIRC channel message command
    crit: suspicious
    if:
      type: text
      case_insensitive: true
      substr: /msg $chan
  - id: mirc-script-cmd-ignore-nick
    desc: Detects mIRC ignore nickname command
    crit: suspicious
    if:
      type: text
      case_insensitive: true
      substr: /ignore $nick
  - id: mirc-script-cmd-writeini
    desc: Detects mIRC writeini command
    crit: suspicious
    if:
      type: text
      case_insensitive: true
      substr: /writeini
  - id: mirc-command-targets-nick
    desc: mIRC command targets nickname variable
    crit: notable
    if:
      type: text
      case_insensitive: true
      regex: '(/(msg|notice|query|ignore|kick|ban|dcc)\s+\$nick\b|\.privmsg\s+\$nick\b)'

  - id: mirc-script-cmd-fserve
    desc: Detects mIRC file-server command
    crit: suspicious
    for: [objectivec]
    if:
      type: text
      case_insensitive: true
      regex: '(^|[;{|\r\n])\s*/?fserve\s+\$nick\b'

  - id: mirc-script-cmd-clone
    desc: Detects mIRC clone-control command
    crit: suspicious
    for: [objectivec]
    if:
      type: text
      case_insensitive: true
      regex: '(^|[;{|\r\n])\s*/?clone\s+(all|connect|join|kill|msg|notice|part|ping|quit|time)\b'

  - id: mirc-script-cmd-sockwrite
    desc: Detects mIRC socket-write command
    crit: suspicious
    for: [objectivec]
    if:
      type: text
      case_insensitive: true
      regex: '\bsockwrite\s+-[a-z]+\s+\$sock\('

  - id: mirc-script-cmd-dcc-send-phrase
    desc: Detects mIRC DCC transfer command
    crit: suspicious
    for: [objectivec]
    if:
      type: text
      case_insensitive: true
      regex: '\bDCC\s+SEND\b'
composite_rules:
  - id: mirc-script-event
    desc: Detects mIRC scripting events used by worms
    crit: suspicious
    any:
      - id: mirc-script-event-join
      - id: mirc-script-event-text
      - id: mirc-script-event-part
      - id: mirc-script-event-quit
  - id: mirc-script-cmd
    desc: Detects mIRC scripting commands used by worms
    crit: suspicious
    any:
      - id: mirc-script-cmd-dcc-send
      - id: mirc-script-cmd-dcc-send-bare
      - id: mirc-script-cmd-msg-chan
      - id: mirc-script-cmd-ignore-nick
      - id: mirc-script-cmd-writeini
      - id: mirc-command-targets-nick
      - id: mirc-script-cmd-fserve
      - id: mirc-script-cmd-clone
      - id: mirc-script-cmd-sockwrite
      - id: mirc-script-cmd-dcc-send-phrase

  # A remote TEXT handler that exposes a file server and clone/socket
  # controls is an operator-controlled IRC bot surface.  Keep this at
  # suspicious: the rule identifies a hostile-capable control surface, not
  # successful delivery or execution.
  - id: mirc-remote-bot-control-surface
    desc: mIRC remote bot control surface
    crit: suspicious
    all:
      - id: mirc-script-event-text
    any:
      - id: mirc-script-cmd-fserve
      - id: mirc-script-cmd-clone
      - id: mirc-script-cmd-sockwrite
      - id: mirc-script-cmd-dcc-send-phrase
  - id: mirc-join-dcc-spread
    desc: Joins a channel and DCC-sends a file
    crit: hostile
    conf: 0.96
    all:
      - id: mirc-script-event-join
    any:
      - id: mirc-script-cmd-dcc-send
      - id: mirc-script-cmd-dcc-send-bare
      - id: mirc-script-cmd-dcc-send-phrase
      - id: mirc-script-cmd-dot-dcc-send
  - id: mirc-marked-join-dcc-spread
    desc: Marked join event DCC-sends a file
    crit: hostile
    conf: 0.96
    all:
      - id: mirc-script-event-join-bang
      - id: mirc-script-cmd-dot-dcc-send
  - id: mirc-text-dcc-spread
    desc: Text handler also DCC-sends a file
    crit: hostile
    conf: 0.95
    all:
      - id: mirc-script-event-text
      - id: mirc-script-cmd-dot-dcc-send
  - id: mirc-multi-command-bot
    desc: mIRC bot exposes several remote commands
    crit: hostile
    conf: 0.95
    all:
      - id: mirc-script-event-text
    any:
      - id: mirc-script-cmd-fserve
      - id: mirc-script-cmd-clone
      - id: mirc-script-cmd-sockwrite
      - id: mirc-script-cmd-dcc-send-phrase
    needs: 2
