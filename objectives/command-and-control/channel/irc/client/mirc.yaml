defaults:
  attack: T1546
  platforms:
    - unix
    - windows
  # mIRC scripts are frequently mislabeled with a `.m` suffix, which the
  # file-identification layer quite reasonably treats as Objective-C.  Keep
  # the additional scope narrow: these predicates require mIRC syntax and do
  # not classify ordinary Objective-C merely because it mentions IRC.
  for: [mirc, ircii, scripts, binaries, objectivec, lua, data]
traits:
  - id: mirc-script-event-join
    desc: Detects mIRC JOIN event
    crit: suspicious
    if:
      type: text
      regex: 'ON\s*([*]|1):JOIN:'
      case_insensitive: true
    unless:
      - id: metadata/lang/encoded/xor::highlightjs-resource
  - id: mirc-script-event-join-bang
    desc: mIRC join event with a level mark
    crit: suspicious
    if:
      type: text
      case_insensitive: true
      substr: '!:JOIN:'
  - id: mirc-script-event-text
    desc: Detects mIRC TEXT event
    crit: suspicious
    if:
      type: text
      case_insensitive: true
      # Bare `:TEXT:` also sits in ODF namespace URNs (`xmlns:text:`)
      # embedded in Qt binaries such as cmake-gui.exe.
      regex: 'ON\s*([*]|[0-9]+):TEXT:'
  - id: mirc-script-event-part
    desc: Detects mIRC PART event
    crit: suspicious
    if:
      type: text
      regex: 'ON\s*([*]|1):PART:'
      case_insensitive: true
  - id: mirc-script-event-quit
    desc: Detects mIRC QUIT event
    crit: suspicious
    if:
      type: text
      regex: 'ON\s*([*]|1):QUIT:'
      case_insensitive: true
  - id: mirc-script-event-start
    desc: Detects mIRC START event
    crit: suspicious
    if:
      type: text
      regex: 'ON\s*([*]|1):START:'
      case_insensitive: true
  - id: mirc-script-event-connect
    desc: Detects mIRC CONNECT event
    crit: suspicious
    if:
      type: text
      regex: 'ON\s*([*]|1):CONNECT:'
      case_insensitive: true
  - id: mirc-script-event-input
    desc: Detects mIRC INPUT event
    crit: suspicious
    if:
      type: text
      regex: 'ON\s*([*]|1):INPUT:'
      case_insensitive: true
  - id: mirc-script-cmd-dcc-send
    desc: Detects mIRC dcc send command
    crit: suspicious
    if:
      type: text
      case_insensitive: true
      substr: /dcc send
  - id: mirc-script-cmd-dot-dcc-send
    desc: mIRC dot-form dcc send command
    crit: suspicious
    if:
      type: text
      case_insensitive: true
      regex: '\.dcc\s*send\b'
  - id: mirc-script-cmd-dcc-send-bare
    desc: Bare mIRC dcc send command
    crit: suspicious
    for: [mirc, ircii, scripts]
    if:
      type: text
      case_insensitive: true
      # Bare protocol prose such as "DCC SEND" is common in IRC libraries.
      # mIRC commands occur after a script delimiter and may begin with '/'.
      # Remotes stored in mirc.ini number each line ("n2=<command>"), so the
      # numbered-line '=' delimits a command too; remote handlers take bare
      # commands without a leading slash.
      regex: '(^|[;{|\r\n=])\s*/?dcc\s+send\b'
  - id: mirc-script-cmd-msg-chan
    desc: Detects mIRC channel message command
    crit: suspicious
    if:
      type: text
      case_insensitive: true
      substr: /msg $chan
  - id: mirc-script-cmd-ignore-nick
    desc: Detects mIRC ignore nickname command
    crit: suspicious
    if:
      type: text
      case_insensitive: true
      substr: /ignore $nick
  - id: mirc-script-cmd-writeini
    desc: Detects mIRC writeini command
    crit: suspicious
    if:
      type: text
      case_insensitive: true
      substr: /writeini
  - id: mirc-command-targets-nick
    desc: mIRC command targets nickname variable
    crit: notable
    if:
      type: text
      case_insensitive: true
      # Both the slash form (/msg) and the silent dot form (.msg, which
      # suppresses local echo) address a command at $nick; backdoors prefer
      # the dot form so the victim never sees the reply.
      regex: '([/.](msg|notice|query|ignore|kick|ban|dcc)\s+\$nick\b|\.privmsg\s+\$nick\b)'
  - id: mirc-script-event-ctcp
    desc: mIRC CTCP event handler
    crit: suspicious
    conf: 0.93
    for: [mirc, ircii, scripts]
    if:
      type: text
      case_insensitive: true
      # A remote CTCP definition: `ctcp <level>:<matchtext>:{` at line start.
      # Ordinary prose never opens a brace after two colon fields.
      regex: '(?m)^\s*ctcp\s+.{1,24}:\s*\{'
  - id: mirc-exec-sender-text-command
    desc: mIRC executes sender text as command
    crit: suspicious
    conf: 0.94
    for: [mirc, ircii, scripts]
    if:
      type: text
      case_insensitive: true
      # Executes the sender-controlled message parameters ($N-) as a command:
      # `.$+ $2-` (silent concat-exec) or `/$2-` (direct exec). Legitimate
      # scripts echo or forward $N-, never execute it.
      regex: '[./]\$(\+\s+\$)?[0-9]-'
  - id: mirc-controller-nick-gate
    desc: mIRC handler gated on hardcoded nickname
    crit: suspicious
    conf: 0.9
    for: [mirc, ircii, scripts]
    if:
      type: text
      case_insensitive: true
      # `$nick != hacker` / `$nick == boss`: the handler only answers a fixed
      # operator nick. The gated name must start with a nick character, which
      # also excludes self-comparisons (`$nick != $me`) — those are ordinary.
      regex: '\$nick\s*(!=|==)\s*[A-Za-z0-9_\-\[\]{}^`|\\]{1,32}'
  - id: mirc-suppress-event-halt
    desc: mIRC handler suppresses default reply
    crit: notable
    conf: 0.9
    for: [mirc, ircii, scripts]
    if:
      type: text
      case_insensitive: true
      # `| halt` ends remote processing and swallows the default event reply
      # (e.g. the CTCP response), so the trigger leaves no visible trace.
      regex: '\|\s*halt\b'

  - id: mirc-script-cmd-fserve
    desc: Detects mIRC file-server command
    crit: suspicious
    for: [objectivec]
    if:
      type: text
      case_insensitive: true
      regex: '(^|[;{|\r\n])\s*/?fserve\s+\$nick\b'

  - id: mirc-script-cmd-clone
    desc: Detects mIRC clone-control command
    crit: suspicious
    for: [objectivec]
    if:
      type: text
      case_insensitive: true
      regex: '(^|[;{|\r\n])\s*/?clone\s+(all|connect|join|kill|msg|notice|part|ping|quit|time)\b'

  - id: mirc-script-cmd-sockwrite
    desc: Detects mIRC socket-write command
    crit: suspicious
    for: [objectivec]
    if:
      type: text
      case_insensitive: true
      regex: '\bsockwrite\s+-[a-z]+\s+\$sock\('

  - id: mirc-script-cmd-dcc-send-phrase
    desc: Detects mIRC DCC transfer command
    crit: suspicious
    for: [objectivec]
    if:
      type: text
      case_insensitive: true
      regex: '\bDCC\s+SEND\b'
  - id: mirc-socklisten-event
    desc: Listens with an mIRC socket
    crit: suspicious
    conf: 0.94
    if:
      type: text
      case_insensitive: true
      substr: '*:socklisten:'
  - id: mirc-sockread-event
    desc: Reads an mIRC socket line
    crit: notable
    conf: 0.9
    if:
      type: text
      case_insensitive: true
      substr: '*:sockread:'
  - id: mirc-run-command-com
    desc: Runs command.com from mIRC
    crit: suspicious
    conf: 0.94
    if:
      type: text
      case_insensitive: true
      substr: 'command.com /c'
  - id: mirc-run-ping-flood
    desc: mIRC run launches a sized ping
    crit: suspicious
    conf: 0.9
    if:
      type: text
      case_insensitive: true
      # `run <launcher> ... "ping <ip> -l <size>"` - bots pass the target
      # and packet size from IRC parameters ($2, $3) to ping.exe.
      regex: '\brun\s+[^|}]{0,40}"ping(\.exe)?\s[^"]{0,40}-l\s+(\$\d|\d{4,5})'
  - id: mirc-run-exe
    desc: Launches an exe from mIRC
    crit: suspicious
    conf: 0.92
    if:
      type: text
      case_insensitive: true
      # mIRC commands use the slash form (/run); bare "run X.exe" is
      # ordinary prose in help text (e.g. "or run gpstill.exe"), and a
      # hyphenated "re-run" is prose too (e.g. vim's vimtutor.bat).
      regex: '/run\s+[A-Za-z0-9_.\\-]{1,40}\.exe\b'
    unless:
      # gyp's win_tool.py shells out to a compiler; a "run … .exe" line is
      # the build helper, not an mIRC /run command.
      - id: well-known/tool/development/cli/dev-cli/node-gyp::vendored-path
  # Handlers and commands of the mIRC scripting language only. The file-wide
  # `for:` reaches batch, Objective-C and data because filefacts used to type
  # mIRC samples by their vxheaven variant letter (`.a`, `.m`); these atoms
  # were written after it types them by content. Reaching `scripts` let
  # `run … .bat` fire on Go's run.bat.
  - id: mirc-on-numbered-text
    desc: mIRC numbered TEXT event
    crit: suspicious
    conf: 0.9
    for: [mirc]
    if:
      type: text
      substr: 'on 1:TEXT:'
  - id: mirc-enables-group
    desc: mIRC enables a named group
    crit: suspicious
    conf: 0.9
    for: [mirc, ircii, scripts, static-lib]
    if:
      type: text
      regex: '(?i)(^|[;{|\r\n=])[ \t]*[/.!]?enable[ \t]+#[A-Za-z0-9_]'
  - id: mirc-privmsg-client-address
    desc: mIRC privmsg reports client address
    crit: suspicious
    conf: 0.92
    for: [mirc, ircii, scripts, static-lib]
    if:
      type: text
      regex: '(?i)\bprivmsg\b[^\r\n]{0,80}\$(ip|host)\b'
  - id: mirc-write-net-view-bat
    desc: mIRC writes a net view batch
    crit: notable
    conf: 0.9
    for: [mirc]
    if:
      type: text
      regex: '(?i)\.write\s+\S+\.bat\s+net view'
  - id: mirc-run-written-bat
    desc: mIRC runs a batch file
    crit: notable
    conf: 0.88
    for: [mirc]
    if:
      type: text
      regex: '(?i)\brun\b[^\r\n]{0,60}\.bat'
  - id: mirc-on-numbered-join
    desc: mIRC numbered JOIN event
    crit: suspicious
    conf: 0.9
    for: [mirc, static-lib]
    if:
      type: text
      substr: 'on 1:JOIN:'
  - id: mirc-dot-copy
    desc: mIRC dot-form copy command
    crit: notable
    conf: 0.86
    for: [mirc]
    if:
      type: text
      substr: '.copy '
  - id: mirc-sockopen-call
    desc: Opens an mIRC client socket
    crit: suspicious
    conf: 0.9
    for: [mirc]
    if:
      type: text
      regex: '(?i)\bsockopen\b'
  - id: mirc-ping-pong-reply
    desc: Replies to an IRC PING
    crit: suspicious
    conf: 0.92
    for: [mirc]
    if:
      # Hyphen/dot-joined tokens are identifiers, not protocol verbs: libuv
      # ships test/test-ping-pong.c and its file lists matched as a PING reply.
      type: text
      regex: '(?i)(^|[^\w.-])PING[^\w.-].{0,80}[^\w.-]PONG\b'
  # Socket-driven clone kits (e.g. clonez payloads stored as `.drv` data
  # files) share these atoms with the relay, harvest and flood composites.
  - id: mirc-sockwrite-cisco-password
    desc: mIRC socket types the cisco password
    crit: suspicious
    conf: 0.9
    for: [mirc, ircii, scripts, data]
    if:
      type: text
      # The factory VTY password as the whole line written to the socket.
      regex: '(?i)\bsockwrite\s+(-[a-z]+\s+)?\S+\s+cisco\s*($|[|}\r\n])'
  - id: mirc-sockwrite-onward-irc-port
    desc: mIRC socket sends host and IRC port
    crit: notable
    conf: 0.88
    for: [mirc, ircii, scripts, data]
    if:
      type: text
      # `sockwrite -n <sock> <server> 6667`: the telnet target typed into
      # the relaying router's prompt.
      regex: '(?i)\bsockwrite\s+(-[a-z]+\s+)?\S+\s+\S+\s+(666[0-9]|7000|%\w*port)\b'
  - id: mirc-list-reply-numeric-compare
    desc: mIRC compares channel LIST numerics
    crit: notable
    conf: 0.86
    for: [mirc, ircii, scripts, data]
    if:
      type: text
      # RPL_LIST (322) / RPL_LISTEND (323) tested in a raw socket parser.
      regex: '(?i)(==\s*32[23]\b|\b32[23]\s*==)'
  - id: mirc-persists-parsed-socket-token
    desc: mIRC saves a parsed token to file
    crit: notable
    conf: 0.86
    for: [mirc, ircii, scripts, data]
    if:
      type: text
      regex: '(?i)(^|[\s;{|=./])write\s+(-[a-z]+\s+)?\S+\s+\$gettok\('
  - id: mirc-sockwrite-all-privmsg
    desc: mIRC writes PRIVMSG to all clone sockets
    crit: suspicious
    conf: 0.9
    for: [mirc, ircii, scripts, data]
    if:
      type: text
      # A wildcard socket name (`clone*`) broadcasts to every connection.
      regex: '(?i)\bsockwrite\s+(-[a-z]+\s+)?[\w.]*\*\s+PRIVMSG\b'
  - id: mirc-text-flood-command
    desc: mIRC trigger names a flood command
    crit: suspicious
    conf: 0.9
    for: [mirc, ircii, scripts, data]
    if:
      type: text
      # `on *:TEXT:!msgflood1*:` or `if ($1 == !ctcpflood)`.
      regex: '(?i)(:TEXT:|==\s*)[!.@]\w{0,12}flood'
composite_rules:
  - id: mirc-script-event
    desc: Detects mIRC scripting events used by worms
    crit: suspicious
    any:
      - id: mirc-script-event-join
      - id: mirc-script-event-text
      - id: mirc-script-event-part
      - id: mirc-script-event-quit
      - id: mirc-script-event-start
      - id: mirc-script-event-connect
      - id: mirc-script-event-input
  - id: mirc-script-cmd
    desc: Detects mIRC scripting commands used by worms
    crit: suspicious
    any:
      - id: mirc-script-cmd-dcc-send
      - id: mirc-script-cmd-dot-dcc-send
      - id: mirc-script-cmd-dcc-send-bare
      - id: mirc-script-cmd-msg-chan
      - id: mirc-script-cmd-ignore-nick
      - id: mirc-script-cmd-writeini
      - id: mirc-command-targets-nick
      - id: mirc-script-cmd-fserve
      - id: mirc-script-cmd-clone
      - id: mirc-script-cmd-sockwrite
      - id: mirc-script-cmd-dcc-send-phrase

  # A remote TEXT handler that exposes a file server and clone/socket
  # controls is an operator-controlled IRC bot surface.  Keep this at
  # suspicious: the rule identifies a hostile-capable control surface, not
  # successful delivery or execution.
  - id: mirc-remote-bot-control-surface
    desc: mIRC remote bot control surface
    crit: suspicious
    all:
      - id: mirc-script-event-text
    any:
      - id: mirc-script-cmd-fserve
      - id: mirc-script-cmd-clone
      - id: mirc-script-cmd-sockwrite
      - id: mirc-script-cmd-dcc-send-phrase
  - id: mirc-join-dcc-spread
    desc: Joins a channel and DCC-sends a file
    crit: hostile
    conf: 0.96
    all:
      - id: mirc-script-event-join
    any:
      - id: mirc-script-cmd-dcc-send
      - id: mirc-script-cmd-dcc-send-bare
      - id: mirc-script-cmd-dcc-send-phrase
      - id: mirc-script-cmd-dot-dcc-send
  - id: mirc-marked-join-dcc-spread
    desc: Marked join event DCC-sends a file
    crit: hostile
    conf: 0.96
    all:
      - id: mirc-script-event-join-bang
      - id: mirc-script-cmd-dot-dcc-send
  - id: mirc-text-dcc-spread
    desc: Text handler also DCC-sends a file
    crit: hostile
    conf: 0.95
    all:
      - id: mirc-script-event-text
      - id: mirc-script-cmd-dot-dcc-send
  - id: mirc-multi-command-bot
    desc: mIRC bot exposes several remote commands
    crit: hostile
    conf: 0.95
    all:
      - id: mirc-script-event-text
    any:
      - id: mirc-script-cmd-fserve
      - id: mirc-script-cmd-clone
      - id: mirc-script-cmd-sockwrite
      - id: mirc-script-cmd-dcc-send-phrase
    needs: 2
  - id: mirc-text-runs-exe
    desc: mIRC text handler launches an exe
    crit: hostile
    conf: 0.96
    all:
      - id: mirc-script-event-text
      - id: mirc-run-exe
  - id: mirc-socket-ping-client
    desc: Socket client answers IRC PING
    crit: hostile
    conf: 0.94
    for: [mirc]
    all:
      - id: mirc-sockopen-call
      - id: mirc-ping-pong-reply
  - id: mirc-socket-command-backdoor
    desc: mIRC socket runs shell commands
    crit: hostile
    conf: 0.97
    all:
      - id: mirc-socklisten-event
      - id: mirc-sockread-event
      - id: mirc-run-command-com
  # A channel TEXT handler that shells out to ping with an attacker-chosen
  # packet size is an IRC-commanded ICMP flood.
  - id: mirc-text-ping-flood
    desc: mIRC text command launches ping flood
    crit: hostile
    conf: 0.95
    attack: T1498
    all:
      - id: mirc-script-event-text
      - id: mirc-run-ping-flood
  # A CTCP handler that runs the sender's message text as a command and then
  # halts is arbitrary remote command execution: anyone who can CTCP the
  # victim runs mIRC commands (file, process, DCC) with no visible reply.
  - id: mirc-ctcp-remote-exec-backdoor
    desc: mIRC CTCP handler executes remote text
    crit: hostile
    conf: 0.96
    attack: T1059
    # An actual remote: droppers that merely quote these lines are covered by
    # the source-side worm traits, not by this execution verdict.
    for: [mirc, ircii]
    all:
      - id: mirc-script-event-ctcp
      - id: mirc-exec-sender-text-command
      - id: mirc-suppress-event-halt

  - id: mirc-numbered-join-dcc
    desc: Numbered JOIN event DCC-sends a file
    crit: hostile
    conf: 0.94
    for: [mirc, static-lib]
    all:
      - id: mirc-on-numbered-join
      - id: mirc-script-cmd-dot-dcc-send
  - id: mirc-copy-then-dcc
    desc: mIRC copies a file then DCC-sends it
    crit: hostile
    conf: 0.94
    for: [mirc]
    all:
      - id: mirc-dot-copy
      - id: mirc-script-cmd-dot-dcc-send
  - id: mirc-numbered-text-dcc
    desc: Numbered TEXT event DCC-sends a file
    crit: hostile
    conf: 0.94
    for: [mirc]
    all:
      - id: mirc-on-numbered-text
      - id: mirc-script-cmd-dot-dcc-send
  - id: mirc-group-reports-client
    desc: Enabled group reports the client address
    crit: hostile
    conf: 0.94
    for: [mirc, ircii, scripts, static-lib]
    all:
      - id: mirc-enables-group
      - id: mirc-privmsg-client-address
  - id: mirc-lan-view-batch
    desc: mIRC writes a batch and runs it
    crit: hostile
    conf: 0.94
    for: [mirc]
    all:
      - id: mirc-write-net-view-bat
      - id: mirc-run-written-bat
