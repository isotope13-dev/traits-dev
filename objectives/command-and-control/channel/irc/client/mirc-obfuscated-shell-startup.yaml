defaults:
  platforms: [windows]
  for: [mirc]
composite_rules:
  - id: mirc-obfuscated-server-system-shell-persistence
    desc: Encoded IRC server with shell persistence
    crit: hostile
    conf: 0.98
    near_bytes: 512
    all:
      - id: micro-behaviors/communications/irc/client::mirc-character-built-server-command
      - id: micro-behaviors/fs/config/system::mirc-write-system-ini-boot-shell
      - id: micro-behaviors/fs/config/system::mirc-explorer-client-shell-value
