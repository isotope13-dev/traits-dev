defaults:
  for: [text]
  platforms: [windows]
  crit: notable

traits:
  - id: mirc-click-hide-fakenick
    desc: mIRC click handler hides and changes nick
    if:
      type: text
      regex: '(?im)^\[clicks\][^\[]{0,900}\n[a-z]{1,12}=\.hide\s*\|\s*\.fakenick\b'

  - id: mirc-click-bot-notify
    desc: mIRC click handler reports bot interaction
    if:
      type: text
      regex: '(?im)^\[clicks\][^\[]{0,900}\n[a-z]{1,12}=[^\r\n]{1,150}bot clicked'

composite_rules:
  - id: mirc-click-conceal-bot
    desc: mIRC click handler conceals bot and reports user interaction
    crit: hostile
    all:
      - id: mirc-click-hide-fakenick
      - id: mirc-click-bot-notify
      - id: metadata/file/format/structured::mirc-client-config-section
