defaults:
  platforms: [linux]
  for: [elf]

traits:
  # Go's pclntab and embedded source paths can keep capability names available
  # in stripped binaries even when command and controller strings are encoded.
  # A single path is only a clue; the hostile rule requires the full cluster.
  - id: go-irc-channel-message-handler
    desc: Go IRC channel message handler
    crit: notable
    conf: 0.97
    if:
      type: text
      substr: 'internal/bot.(*MessageHandler).handleChannelMessage'

  - id: go-irc-private-message-handler
    desc: Go IRC private message handler
    crit: notable
    conf: 0.97
    if:
      type: text
      substr: 'internal/bot.(*MessageHandler).handlePrivateMessage'

  - id: go-irc-shell-command-module
    desc: Go IRC agent shell command module
    crit: suspicious
    conf: 0.97
    if:
      type: text
      substr: 'internal/bot/commands/shell.go'

  - id: go-irc-download-command-module
    desc: Go IRC agent file download command module
    crit: suspicious
    conf: 0.97
    if:
      type: text
      substr: 'internal/bot/commands/download.go'

  - id: go-irc-cron-persistence-module
    desc: Go IRC agent cron persistence module
    crit: notable
    conf: 0.97
    if:
      type: text
      substr: 'internal/persis/cron_manager.go'

  - id: go-irc-systemd-persistence-module
    desc: Go IRC agent systemd persistence module
    crit: notable
    conf: 0.97
    if:
      type: text
      substr: 'internal/persis/systemd_manager.go'

  - id: go-irc-process-hider-module
    desc: Go IRC agent process-hiding module
    crit: suspicious
    conf: 0.98
    if:
      type: text
      substr: 'internal/persis/process_hider.go'

  - id: go-irc-replication-module
    desc: Go IRC agent replication persistence module
    crit: notable
    conf: 0.97
    if:
      type: text
      substr: 'internal/persis/replication_manager.go'

  - id: go-irc-enable-persistence-method
    desc: Go IRC persistence activation method
    crit: notable
    conf: 0.97
    if:
      type: text
      exact: EnablePersistence

  - id: go-irc-monitor-persistence-method
    desc: Go IRC persistence monitor method
    crit: notable
    conf: 0.97
    if:
      type: text
      exact: MonitorPersistence

  - id: go-irc-enable-process-hiding-method
    desc: Go IRC process-hiding activation method
    crit: suspicious
    conf: 0.98
    if:
      type: text
      exact: EnableProcessHiding

  - id: go-irc-install-user-cron-method
    desc: Go IRC user cron installation method
    crit: notable
    conf: 0.97
    if:
      type: text
      exact: installUserCron

  - id: go-irc-enable-watchdog-method
    desc: Go IRC watchdog activation method
    crit: notable
    conf: 0.97
    if:
      type: text
      exact: EnableWatchdog

composite_rules:
  - id: go-irc-persistence-module-cluster
    desc: Go IRC agent has several persistence modules
    crit: suspicious
    conf: 0.98
    any:
      - id: go-irc-cron-persistence-module
      - id: go-irc-systemd-persistence-module
      - id: go-irc-process-hider-module
      - id: go-irc-replication-module
    needs: 3

  - id: go-irc-persistence-method-cluster
    desc: Go IRC agent exposes persistence controls
    crit: suspicious
    conf: 0.98
    any:
      - id: go-irc-enable-persistence-method
      - id: go-irc-monitor-persistence-method
      - id: go-irc-enable-process-hiding-method
      - id: go-irc-install-user-cron-method
      - id: go-irc-enable-watchdog-method
    needs: 3

  - id: go-irc-persistent-hidden-shell-agent
    desc: Go IRC command agent with persistence and process hiding
    crit: hostile
    conf: 0.99
    attack: T1071,T1059.004,T1053.003,T1564
    all:
      - id: go-irc-channel-message-handler
      - id: go-irc-private-message-handler
      - id: go-irc-shell-command-module
      - id: go-irc-download-command-module
      - id: go-irc-persistence-module-cluster
      - id: go-irc-persistence-method-cluster
