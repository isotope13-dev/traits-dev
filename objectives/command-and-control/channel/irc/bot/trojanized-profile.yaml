# A trojanized client profile: the INI hides its auto-loaded scripts behind
# DLL suffixes, preconfigures an IRC server rendezvous, and wires
# drag-and-drop to DCC send. Each leg is ordinary alone (stock bindings, one
# oddly named helper, a saved server); together they assemble a ready-to-run
# kit configuration with no benign use. The rendezvous leg is required: the
# retired remote-dragdrop kit convicted single-helper profiles on scripts
# plus bindings alone, so mirc-profile.ini and the server-less fixtures stay
# out, as do server-only (irc-settings.ini) and script-only
# (custom/default/disabled-dde-dll.ini) fixtures.
defaults:
  for: [text]
  platforms: [windows]
composite_rules:
  - id: mirc-concealed-scripts-server-send-kit
    desc: mIRC profile hides auto-load scripts and pairs a server with DCC send
    crit: hostile
    conf: 0.95
    attack: T1071
    scope: file
    all:
      - id: objectives/evasion/masquerade/extension-mismatch::mirc-dll-suffixed-script-config
      - id: micro-behaviors/communications/irc/configure::mirc-server-endpoint-declaration
      - id: micro-behaviors/communications/transfer::mirc-config-dragdrop-dcc-send
