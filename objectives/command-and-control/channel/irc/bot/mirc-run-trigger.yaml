defaults:
  for: [mirc]
  platforms: [windows]
  attack: T1059,T1071.001

traits:
  - id: mirc-remote-text-run-trigger
    desc: IRC text command runs supplied arguments
    crit: notable
    conf: 0.98
    if:
      type: text
      regex: '(?i)if\s*\(\s*\$1\s*==\s*!run\s*\)\s*\{\s*\.?run\s+\$2-'

composite_rules:
  - id: mirc-text-trigger-runs-sender-command
    desc: IRC text command runs supplied arguments
    crit: hostile
    conf: 0.98
    all:
      - id: mirc-remote-text-run-trigger
      - id: micro-behaviors/communications/irc/handler::mirc-on-text-handler
