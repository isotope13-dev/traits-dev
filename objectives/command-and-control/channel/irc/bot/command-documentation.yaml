defaults:
  for: [text]
  platforms: [windows]
  size_max: 50000

traits:
  - id: documented-irc-bot-control
    desc: Documented IRC bot control commands
    crit: notable
    if:
      type: text
      substr: sends a raw to the irc server
  - id: documented-bot-hidden-download
    desc: Documented bot download and hidden run
    crit: notable
    if:
      type: text
      substr: 'downloads a file (r: run, h: run hidden)'
  - id: documented-bot-exploit-server
    desc: Documented bot exploit FTP server
    crit: notable
    if:
      type: text
      substr: '.exploitftpd/.eftpd'

  - id: documented-bot-password-dump
    desc: Documented bot password dump to IRC
    crit: notable
    if:
      type: text
      substr: 'This dumps all passwords to you on irc'
      case_insensitive: true
  - id: documented-bot-syn-flood
    desc: DDoS SYN command token
    crit: notable
    if:
      type: text
      substr: '.ddos.syn'
  - id: documented-bot-update
    desc: Documented bot update command
    crit: notable
    if:
      type: text
      substr: 'this will update all your bots to new ones'
      case_insensitive: true


composite_rules:
  - id: irc-bot-operator-command-list
    desc: IRC bot command list documents an exploit FTP server and hidden downloads
    crit: hostile
    all:
      - id: documented-irc-bot-control
      - id: documented-bot-hidden-download
      - id: documented-bot-exploit-server

  - id: irc-bot-password-flood-command-list
    desc: Bot operator reference documents password theft and SYN flooding
    crit: hostile
    all:
      - id: documented-bot-password-dump
      - id: documented-bot-syn-flood
      - id: documented-bot-update
