defaults:
  platforms:
    - windows
    - unix
  for:
    - c
    - cpp
traits:
  - id: privmsg
    desc: IRC PRIVMSG command string
    crit: notable
    conf: 0.9
    if:
      type: string_literal
      exact: PRIVMSG
    unless:
      - id: well-known/app/communication/hexchat::source-tree
      - id: well-known/game/openlierox/
  - id: nick-user
    desc: IRC NICK USER registration format
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: NICK %s\\r\\n"\s*"USER %s [^\\r\\n"]{1,32}:[^\\r\\n"]{1,32}\\r\\n
  - id: nick-format
    desc: IRC NICK registration command
    crit: notable
    conf: 0.85
    if:
      type: string_literal
      substr: NICK %s
  - id: user-registration
    desc: IRC USER registration command
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: 'USER %s\s+[^"\r\n]{1,64}\s+[^"\r\n]{1,64}\s*:'
  - id: join-channel
    desc: IRC JOIN with channel key
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: JOIN %s\s+:?%s\\r\\n
  - id: join-simple
    desc: IRC JOIN channel command
    crit: notable
    conf: 0.85
    if:
      type: string_literal
      substr: JOIN %s
  - id: pong-keepalive
    desc: IRC PONG keepalive format
    crit: notable
    conf: 0.9
    if:
      type: string_literal
      substr: PONG %s
  - id: userhost-lookup
    desc: IRC USERHOST lookup command
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: USERHOST %s\\r\\n
  - id: kick-command
    desc: IRC KICK command in source
    crit: notable
    conf: 0.9
    if:
      type: string_literal
      substr: KICK %s
  - id: mode-command
    desc: IRC MODE command in source
    crit: notable
    conf: 0.85
    if:
      type: text
      regex: 'MODE %s\s+[+-][A-Za-z]+'
  - id: topic-command
    desc: IRC TOPIC command in source
    crit: notable
    conf: 0.85
    if:
      type: string_literal
      substr: TOPIC %s
  - id: notice-command
    desc: IRC NOTICE command in source
    crit: notable
    conf: 0.85
    if:
      type: string_literal
      substr: NOTICE %s
  - id: irc-port-6667
    desc: Default IRC port 6667
    crit: component
    conf: 0.8
    if:
      type: string_literal
      substr: '6667'
  - id: svbot-cmd-get-file
    desc: SvBot download command
    crit: suspicious
    conf: 0.96
    attack: T1105
    if:
      type: string_literal
      exact: "@get.file"
  - id: svbot-cmd-kill-bot
    desc: SvBot removal command
    crit: suspicious
    conf: 0.96
    if:
      type: string_literal
      exact: "@kill.bot"
  - id: svbot-cmd-flood-host
    desc: SvBot flood command
    crit: suspicious
    conf: 0.97
    attack: T1498
    if:
      type: string_literal
      exact: "@flood.host"
  - id: svbot-cmd-im-spread
    desc: SvBot messenger spread command
    crit: suspicious
    conf: 0.97
    attack: T1105
    if:
      type: string_literal
      exact: "@im.spread"
  - id: svbot-cmd-honeypot-on
    desc: SvBot honeypot listener command
    crit: suspicious
    conf: 0.95
    if:
      type: string_literal
      exact: "@honeypot.on"
  - id: svbot-cmd-bot-raw
    desc: SvBot raw IRC command
    crit: suspicious
    conf: 0.95
    if:
      type: string_literal
      exact: "@bot.cmd"
  - id: operator-shell-command-help
    desc: IRC operator command executes a shell command
    crit: suspicious
    conf: 0.94
    attack: T1059.004
    if:
      type: literal
      kind: string
      # EXEC <command> is Git rebase help text, not an IRC operator verb.
      regex: '(?i)\b(SH|CMD|SHELL)\s+<command>'
    unless:
      - id: metadata/package/testing/presence/harness::test-directory-path
      - id: metadata/package/testing/presence/harness::git-tests-directory
      - id: well-known/lib/development/modernc-ccorpus2::package-context
      - id: well-known/lib/development/modernc-ccorpus2::source-archive-path
composite_rules:
  - id: irc-protocol-source
    desc: IRC protocol implementation in C source
    crit: suspicious
    conf: 0.97
    all:
      - id: privmsg
    needs: 2
    any:
      - id: nick-user
      - id: nick-format
      - id: user-registration
      - id: join-channel
      - id: join-simple
      - id: pong-keepalive
      - id: userhost-lookup
  - id: irc-channel-management
    desc: IRC channel management commands
    crit: suspicious
    conf: 0.9
    all:
      - id: privmsg
    needs: 2
    any:
      - id: kick-command
      - id: mode-command
      - id: topic-command
      - id: notice-command
      - id: irc-port-6667
    unless:
      # HexChat is a full IRC client; these protocol strings are its normal
      # encrypted-message and channel-management implementation, not a bot.
      - id: well-known/app/communication/hexchat::source-tree
      # OpenLieroX embeds a game-chat IRC client (PRIVMSG to channel/user).
      - id: well-known/game/openlierox/
  - id: irc-remote-shell-backdoor
    desc: IRC bot executes operator-supplied shell commands
    crit: hostile
    conf: 0.98
    attack: T1059.004,T1071.001
    all:
      - id: irc-protocol-source
      - id: operator-shell-command-help
      - id: micro-behaviors/process/create/shell/native::c-popen-variable-input
  - id: svbot-operator-command-set
    desc: SvBot IRC operator command set
    crit: hostile
    conf: 0.98
    attack: T1071.001,T1105,T1498
    all:
      - id: svbot-cmd-get-file
      - id: svbot-cmd-kill-bot
    needs: 2
    any:
      - id: svbot-cmd-flood-host
      - id: svbot-cmd-im-spread
      - id: svbot-cmd-honeypot-on
      - id: svbot-cmd-bot-raw
