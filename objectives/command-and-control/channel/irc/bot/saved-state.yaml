defaults:
  for: [text, mirc]
  platforms: [windows]
composite_rules:
  # This config does not include the remote script bodies, so require several
  # independent indicators of an installed operator-controlled bot: mIRC's
  # remote-script loader, a disguised DLL script, bot administration strings,
  # an enabled DDE command server, and disabled DCC warnings.
  - id: mirc-operator-controlled-backdoor-config
    desc: mIRC config combines bot administration with concealed remote scripts
    crit: hostile
    conf: 0.94
    for: [text]
    all:
      - id: metadata/file/format/structured::mirc-client-config-section
      - id: metadata/file/format/structured::mirc-remote-script-list
      - id: objectives/evasion/masquerade/extension-mismatch::mirc-dll-suffixed-script-config
      - id: micro-behaviors/data/config/schema::mirc-findtext-bot-operator-marker
      - id: micro-behaviors/data/config/schema::mirc-dde-server-enabled
      - id: micro-behaviors/data/config/schema::mirc-dcc-warnings-disabled
  - id: mirc-bot-subseven-saved-state
    desc: mIRC bot state records SubSeven connection
    crit: suspicious
    conf: 0.98
    all:
      - id: micro-behaviors/data/config/schema::mirc-bot-server-variable
      - id: micro-behaviors/data/config/schema::mirc-bot-channel-variable
      - id: micro-behaviors/data/config/schema::mirc-subseven-connection-state
  - id: mirc-authenticated-takeover-bot-state
    desc: Authenticated IRC bot with takeover state
    crit: suspicious
    conf: 0.96
    all:
      - id: micro-behaviors/data/config/schema::mirc-bot-server-variable
      - id: micro-behaviors/data/config/schema::mirc-authentication-state-variable
      - id: micro-behaviors/data/config/schema::mirc-channel-takeover-count-variable
      - id: micro-behaviors/data/config/schema::mirc-clone-channel-variable
