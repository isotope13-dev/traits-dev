defaults:
  for: [text, mirc]
  platforms: [windows]
composite_rules:
  - id: mirc-bot-subseven-saved-state
    desc: mIRC bot state records SubSeven connection
    crit: suspicious
    conf: 0.98
    all:
      - id: micro-behaviors/data/config/schema::mirc-bot-server-variable
      - id: micro-behaviors/data/config/schema::mirc-bot-channel-variable
      - id: micro-behaviors/data/config/schema::mirc-subseven-connection-state
  - id: mirc-authenticated-takeover-bot-state
    desc: Authenticated IRC bot with takeover state
    crit: suspicious
    conf: 0.96
    all:
      - id: micro-behaviors/data/config/schema::mirc-bot-server-variable
      - id: micro-behaviors/data/config/schema::mirc-authentication-state-variable
      - id: micro-behaviors/data/config/schema::mirc-channel-takeover-count-variable
      - id: micro-behaviors/data/config/schema::mirc-clone-channel-variable
