defaults:
  for: [mirc]
  platforms: [windows]
  attack: T1498,T1059,T1071.001

traits:
  - id: mirc-operator-udp-flood-menu
    desc: IRC bot menu submits UDP flood parameters
    crit: notable
    conf: 0.96
    if:
      type: text
      regex: '(?i)\bsay\s+%[A-Za-z0-9_.]+\s+\$\+\s+udp\s+\$\$\?'
  - id: mirc-operator-download-execute-menu
    desc: IRC bot menu offers download and execute
    crit: notable
    conf: 0.96
    if:
      type: text
      regex: '(?i)download and execute\s*\{\s*say\s+%'
  - id: mirc-operator-invisible-execute-menu
    desc: IRC bot menu requests invisible execution
    crit: notable
    conf: 0.96
    if:
      type: text
      regex: '(?i)invisible\s*\{\s*say\s+%[A-Za-z0-9_.]+\s+\$\+\s+execute\s+0'

composite_rules:
  - id: mirc-bot-flood-and-execution-console
    desc: IRC bot console controls floods and hidden execution
    crit: hostile
    conf: 0.98
    all:
      - id: mirc-operator-udp-flood-menu
      - id: mirc-operator-download-execute-menu
      - id: mirc-operator-invisible-execute-menu
