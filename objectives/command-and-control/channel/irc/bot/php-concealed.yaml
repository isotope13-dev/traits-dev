defaults:
  for: [html]
  platforms: [unix, windows]
composite_rules:
  - id: encoded-irc-php-eval-backdoor
    desc: Encoded IRC commands with PHP tail eval
    crit: hostile
    conf: 0.99
    attack: T1095
    all:
      - id: micro-behaviors/communications/irc/command::base64-privmsg-command
      - id: micro-behaviors/communications/irc/command::base64-join-command
      - id: micro-behaviors/communications/irc/command::base64-pong-command
      - id: micro-behaviors/communications/socket/connect::php-var-fsockopen
      - id: micro-behaviors/data/string/access::php-command-prefix-slice
      - id: micro-behaviors/process/interpreter/eval/direct::eval-call-text
      - id: micro-behaviors/data/decode/base64::php-base64-decode-text
