defaults:
  platforms:
    - unix
    - windows
  for: [binaries, scripts]
  attack: T1071.001
traits:
  - id: cmd-login
    desc: Bot login command
    crit: notable
    conf: 0.6
    if:
      type: text
      # Require at least one argument. A bare `.login` line is the classic csh
      # startup filename embedded in language/tooling tables, not an IRC bot
      # login command.
      regex: (?i)^\.login\s+\S+
    unless:
      - type: text
        substr: ftplib
      - type: text
        substr: urllib
      - id: well-known/tool/sysadmin/ripgrep::ripgrep-tool
      - type: text
        substr: BurntSushi/ripgrep
      - type: text
        substr: RIPGREP_CONFIG_PATH
  - id: cmd-udp
    desc: Bot UDP attack command
    for: [scripts]
    crit: notable
    conf: 0.8
    if:
      type: text
      regex: (?i)^\.udp(\s+\S+)?$
  - id: cmd-tcp
    desc: TCP bot attack command with target/port
    crit: notable
    conf: 0.8
    if:
      type: text
      regex: '(?i)[.]tcp\s+[A-Za-z0-9_.:/-]{3,80}\s+[0-9]{1,5}'
  - id: cmd-shell
    desc: IRC bot shell command with argument
    crit: notable
    conf: 0.8
    if:
      type: text
      regex: '(?i)^\s*\.shell\s+[A-Za-z0-9_./:-]{1,80}\s*$'
  - id: tsunami-name
    desc: Tsunami bot-name keyword fragment
    crit: component
    conf: 0.7
    count_min: 2
    if:
      type: text
      word: tsunami
      case_insensitive: true
    unless:
      - id: metadata/file/profile/identity::static-html-shell
      # Random English-word comment padding can repeat family names without
      # identifying the program or participating in executable code.
      - id: objectives/evasion/anti-av/code-padding::prose-comment-padding
      # Icon sets are noun dictionaries: Material Design Icons ships a
      # `tsunami` glyph, so any bundle embedding an Iconify pack (the Mermaid
      # VS Code extension carries mdi plus the AWS/Azure/GCP sets) repeats the
      # word often enough to clear count_min. An Iconify record — `"body":"<path
      # …"` — is data no IRC flood bot carries.
      - type: text
        regex: '"body"\s*:\s*"<(path|g|svg)\b'
  - id: kaiten-name
    desc: Kaiten bot-name keyword fragment
    crit: component
    conf: 0.7
    if:
      type: text
      word: kaiten
      case_insensitive: true
  - id: attack-pan
    desc: PAN attack type indicator
    crit: notable
    conf: 0.5
    if:
      type: text
      regex: (?i)(pan[_-]?(attack|flood)|\bpan[_-]?ddos)
  - id: attack-udp
    desc: UDP attack type indicator
    crit: notable
    conf: 0.5
    if:
      type: text
      regex: \bUDP[_-]?ATTACK\b|\bUDP[_-]?FLOOD\b
      case_insensitive: true
    unless:
      - id: metadata/package/manifest/vendor::bitdefender-ecnet-telemetry
composite_rules:
  - id: ddos-attack-terms
    desc: DDoS attack terminology
    any:
      - id: attack-pan
      - id: attack-udp
      - id: objectives/impact/dos/attack/flood::flood-types
      - id: objectives/impact/dos/attack/flood::ddos-attack-terminology
    crit: suspicious
  - id: tsunami-artifact
    desc: Tsunami/Kaiten bot-name keyword cluster
    crit: component
    conf: 0.7
    any:
      - id: tsunami-name
      - id: kaiten-name
  - id: bot-logic
    desc: IRC-based command and control logic
    crit: suspicious
    conf: 0.8
    all:
      - id: micro-behaviors/communications/ipc/irc::irc-protocol
    needs: 2
    any:
      - id: cmd-login
      - id: cmd-udp
      - id: cmd-tcp
      - id: cmd-shell
      - id: micro-behaviors/communications/ipc/irc::irc-dcc-send-literal
  - id: irc-ddos
    desc: IRC-controlled DDoS attack logic
    crit: suspicious
    conf: 0.9
    all:
      - id: micro-behaviors/communications/ipc/irc::irc-protocol
      - id: ddos-attack-terms
  - id: tsunami-irc-bot
    desc: Tsunami/Kaiten IRC bot with C2
    crit: suspicious
    conf: 0.85
    all:
      - id: objectives/command-and-control/channel/irc/bot::tsunami-artifact
      - id: bot-logic
  - id: tsunami-ddos-bot
    desc: Tsunami/Kaiten IRC bot with DDoS
    crit: suspicious
    conf: 0.9
    all:
      - id: objectives/command-and-control/channel/irc/bot::tsunami-artifact
      - id: objectives/command-and-control/channel/irc/bot::irc-ddos
  - id: irc-bot-ddos
    desc: IRC bot with DDoS attack
    crit: suspicious
    conf: 0.85
    all:
      - id: bot-logic
      - id: objectives/command-and-control/channel/irc/bot::irc-ddos
