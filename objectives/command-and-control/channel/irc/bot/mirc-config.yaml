# An mIRC configuration that loads remote scripts, connects to a configured
# IRC endpoint under a generated identity, and exposes DCC sending through
# drag-and-drop is a configured IRC bot surface. The individual settings can
# occur in ordinary clients; their conjunction identifies a remotely
# script-driven file-transfer bot configuration.
defaults:
  for: [text]
  platforms: [windows]
composite_rules:
  - id: mirc-configured-dcc-bot
    desc: mIRC bot config loads scripts and sends files
    crit: hostile
    conf: 0.94
    all:
      - id: metadata/file/format/structured::mirc-client-config-section
      - id: micro-behaviors/communications/irc/configure::mirc-server-endpoint-declaration
      - id: micro-behaviors/data/config/schema::mirc-random-identity-expression
      - id: metadata/file/format/structured::mirc-remote-script-list
      - id: micro-behaviors/communications/transfer::mirc-config-dragdrop-dcc-send
