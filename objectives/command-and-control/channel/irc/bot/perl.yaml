defaults:
  platforms:
  - unix
  - windows
  for:
  - perl
  attack: T1071.001
traits:
- id: cmd-back-down-eval
  desc: Bot reverse shell, download, or eval command
  crit: suspicious
  conf: 0.8
  if:
    type: text
    regex: '\^(back\\s\+\(\.\*\)\\s\+\(\\d\+\)|down\\s\+\(\.\*\)\\s\+\(\.\*\)|eval\\s\+\(\.\*\))'
- id: cmd-portscan
  desc: Bot port scan command
  crit: suspicious
  conf: 0.75
  if:
    type: text
    regex: \^(ps|nmap)\\s
- id: cmd-raw
  desc: Bot raw IRC relay command
  crit: suspicious
  conf: 0.7
  if:
    type: text
    substr: ^raw\s+(.*)
- id: cmd-scan
  desc: Bot scan command
  crit: suspicious
  conf: 0.8
  if:
    type: text
    regex: '(?i)PRIVMSG\s+\S+\s+:.{0,100}!(scan|info|google)'

- id: perl-irc-bot-search-query
  desc: Perl IRC bot search query URL
  crit: notable
  conf: 0.9
  if:
    type: text
    regex: '(?i)http://(it\.)?ask\.com/web\?q='



- id: version-client-forward
  desc: IRC version response names a client
  crit: notable
  conf: 0.8
  if:
    type: text
    regex: '(?i)\b(VERSION|CTCP)\b.{0,80}\b(mIRC|BitchX|xchat|HydraIRC|irssi)\b'
- id: version-client-reverse
  desc: IRC client name precedes version response
  crit: notable
  conf: 0.8
  if:
    type: text
    regex: '\b(mIRC|BitchX|xchat|HydraIRC|irssi)\b.{0,80}\b(VERSION|CTCP)\b'
- id: operator-nick-darkness
  desc: IRC operator nick darkness
  crit: suspicious
  conf: 0.8
  if:
    type: string_literal
    exact: darkness
- id: operator-nick-quad
  desc: IRC operator nick QuaD
  crit: suspicious
  conf: 0.8
  if:
    type: string_literal
    exact: QuaD
composite_rules:
- id: irc-protocol-perl
  desc: Perl IRC protocol commands
  crit: notable
  conf: 0.8
  any:
  - id: micro-behaviors/communications/irc/command::irc-privmsg-literal
  - id: micro-behaviors/communications/irc/command::irc-registration-literal
  - id: micro-behaviors/communications/irc/command::irc-keepalive-literal
- id: bot-logic-perl
  desc: Perl IRC command and control logic
  crit: suspicious
  conf: 0.9
  all:
  - id: irc-protocol-perl
  any:
  - id: micro-behaviors/communications/irc/command::irc-dcc-send-literal
  - id: cmd-back-down-eval
  - id: cmd-portscan
  - id: cmd-raw
- id: operator-controlled-bot-perl
  desc: Perl operator gated IRC bot
  crit: suspicious
  conf: 0.9
  all:
  - id: irc-protocol-perl
  - id: operator-nick-pair
  any:
  - id: version-client-forward
  - id: version-client-reverse
- id: operator-nick-pair
  desc: IRC operator nickname pair
  crit: suspicious
  conf: 0.9
  all:
  - id: operator-nick-darkness
  - id: operator-nick-quad
- id: perl-irc-remote-shell-backdoor
  desc: Perl IRC bot executes shell commands
  crit: hostile
  conf: 0.98
  attack: T1059.004,T1071.001
  all:
  - id: irc-protocol-perl
  - id: objectives/command-and-control/channel/irc/client::perl-irc-privmsg-line
  any:
  - id: micro-behaviors/process/create/shell/substitution::backticks-exec
  - id: micro-behaviors/process/create/shell/variable-command::system-dollar-variable
  unless:
  - id: metadata/package/testing/presence/harness::perl-test-file

- id: perl-irc-bot-hostile
  desc: Perl IRC bot malicious command and control
  crit: hostile
  conf: 0.99
  all:
  - id: irc-protocol-perl
  - id: objectives/command-and-control/channel/irc/client::perl-irc-privmsg-line
  any:
  - id: cmd-back-down-eval
  - id: cmd-portscan
  - id: cmd-scan
  - id: perl-irc-bot-search-query

