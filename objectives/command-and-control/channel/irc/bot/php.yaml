---
defaults:
  platforms:
  - windows
  - unix
  for:
  - php
traits:
- id: php-irc-command-set--rx-21
  desc: Quoted USER or PASS word
  crit: component
  conf: 0.88
  if:
    type: text
    regex: "(?i)[\"'](USER|PASS)\\s+"
- id: php-irc-command-set--rx-22
  desc: Quoted PRIVMSG or MODE word
  crit: component
  conf: 0.88
  if:
    type: text
    regex: "(?i)[\"'](PRIVMSG|MODE)\\s+"
- id: php-irc-command-set--rx-23
  desc: Quoted PING or PONG word
  crit: component
  conf: 0.88
  if:
    type: text
    regex: "(?i)[\"'](PING|PONG)(\\s+|:)"
- id: php-irc-command-set--rx-24
  desc: Quoted channel JOIN or PART text
  crit: component
  conf: 0.88
  if:
    type: text
    regex: "(?i)[\"'](JOIN|PART)\\s+[#&]"
- id: irc-eval-command-loop
  desc: IRC socket loop that evals received commands
  crit: suspicious
  conf: 0.95
  attack: T1095
  if:
    type: text
    regex: fsockopen[\s\S]{0,500}(PRIVMSG|PING|PONG)[\s\S]{0,500}eval\s*\(
composite_rules:
- id: php-irc-command-set
  desc: Quoted words used in IRC commands
  crit: notable
  conf: 0.88
  needs: 3
  any:
  - id: php-irc-command-set--rx-21
  - id: php-irc-command-set--rx-22
  - id: php-irc-command-set--rx-23
  - id: php-irc-command-set--rx-24
