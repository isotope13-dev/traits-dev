---
defaults:
  platforms:
  - windows
  - unix
  for:
  - php
  mbc: B0030
  attack: T1505.003
traits:
- id: php-irc-command-set--rx-21
  desc: Quoted IRC USER or PASS command
  crit: component
  conf: 0.88
  if:
    type: text
    regex: "(?i)[\"'](USER|PASS)\\s+"
  count_max: 1016592
- id: php-irc-command-set--rx-22
  desc: Quoted IRC PRIVMSG or MODE command
  crit: component
  conf: 0.88
  if:
    type: text
    regex: "(?i)[\"'](PRIVMSG|MODE)\\s+"
  count_max: 1016593
- id: php-irc-command-set--rx-23
  desc: Quoted IRC PING or PONG command
  crit: component
  conf: 0.88
  if:
    type: text
    regex: "(?i)[\"'](PING|PONG)(\\s+|:)"
  count_max: 1016594
- id: php-irc-command-set--rx-24
  desc: Quoted IRC channel join or part command
  crit: component
  conf: 0.88
  if:
    type: text
    regex: "(?i)[\"'](JOIN|PART)\\s+[#&]"
  count_max: 1016595
- id: irc-eval-command-loop
  desc: IRC socket loop that evals received commands
  crit: suspicious
  conf: 0.95
  if:
    type: text
    regex: fsockopen[\s\S]{0,500}(PRIVMSG|PING|PONG)[\s\S]{0,500}eval\s*\(
composite_rules:
- id: php-irc-command-set
  desc: PHP IRC bot command set
  crit: suspicious
  conf: 0.88
  attack: T1095
  needs: 3
  any:
  - id: php-irc-command-set--rx-21
  - id: php-irc-command-set--rx-22
  - id: php-irc-command-set--rx-23
  - id: php-irc-command-set--rx-24
