defaults:
  platforms: [linux]
  for: [elf]
  attack: T1071

composite_rules:
  # Flood task syntax supplies admission. Encryption context comes from a
  # handshake diagnostic or a CRYPT token next to directional cipher labels.
  - id: encrypted-irc-multivector-flood-tasking
    desc: Flood dispatcher with encrypted IRC vocabulary
    crit: hostile
    conf: 0.98
    all:
      - id: objectives/impact/dos/attack/flood::start-flood-dispatcher-usage
      - id: objectives/impact/dos/attack/flood::start-flood-mode-name-cluster
      - id: micro-behaviors/communications/irc/command::privmsg-command-bytes
      - id: micro-behaviors/communications/irc/command::user-registration-template
    any:
      - id: micro-behaviors/crypto/cipher::encrypted-handshake-diagnostic
      - id: micro-behaviors/communications/irc/command::crypt-directional-channel-labels

  - id: irc-start-flood-commanded-bot-elf
    desc: IRC-registered ELF bot with start_flood multi-vector dispatcher
    crit: hostile
    conf: 0.98
    attack: T1071,T1498.001
    all:
      - id: objectives/impact/dos/attack/flood::start-flood-dispatcher-usage
      - id: objectives/impact/dos/attack/flood::start-flood-mode-name-cluster
      - id: micro-behaviors/communications/irc/command::privmsg-command-bytes
      - id: micro-behaviors/communications/irc/command::user-registration-template
    unless:
      - id: encrypted-irc-multivector-flood-tasking
