defaults:
  platforms: [windows, unix]
  for: [java, class]
  attack: T1071.001

traits:
  - id: java-irc-nick-config
    desc: Java IRC persistent nick config
    crit: notable
    conf: 0.86
    if:
      type: literal
      exact: PERM_NICK
  - id: java-irc-socket-class
    desc: Java IRC socket class
    crit: notable
    conf: 0.86
    if:
      type: symbol
      kind: function
      exact: IRCSocket
  - id: java-irc-sendraw-method
    desc: Java IRC raw-send wrapper source
    crit: notable
    conf: 0.86
    if:
      type: symbol
      kind: function
      exact: sendRaw
  - id: java-irc-socket-accessor
    desc: Java IRC socket accessor source
    crit: notable
    conf: 0.84
    if:
      type: symbol
      kind: call
      exact: getSocket

composite_rules:
  - id: java-irc-bot-transport
    for: [java]
    desc: Java IRC bot transport
    crit: suspicious
    conf: 0.93
    all:
      - id: micro-behaviors/communications/socket/create::java-socket-create
      - id: java-irc-nick-config
    any:
      - id: java-irc-socket-class
      - id: metadata/lang/source/literal/string/command::java-irc-or-keepalive-literals
    needs: 2
  - id: java-irc-protocol-wrapper
    desc: Java IRC protocol wrapper
    crit: suspicious
    conf: 0.9
    all:
      - id: metadata/lang/source/literal/string/command::java-irc-or-keepalive-literals
      - id: java-irc-sendraw-method
      - id: java-irc-socket-accessor
