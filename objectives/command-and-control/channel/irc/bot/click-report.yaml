defaults:
  for: [text, mirc]
  platforms: [windows]
traits:
  - id: mirc-click-run-report-chain
    desc: mIRC click launches exe and reports activity
    crit: suspicious
    conf: 0.96
    if:
      type: text
      regex: '//run [^\r\n|]{1,60}\.exe[^\r\n|]{0,40}\| //msg %\w+ DoubleClicked:'

composite_rules:
  - id: mirc-persistent-client-click-reporting
    desc: Persistent IRC client reports user click events
    crit: hostile
    conf: 0.98
    for: [mirc]
    all:
      - id: objectives/persistence/login/registry/run-key::mirc-concealed-or-reporting-run-autorun
      - id: micro-behaviors/process/create/exec::mirc-config-click-run-executable
      - id: micro-behaviors/communications/messaging/send::mirc-multiple-click-run-message-hooks
