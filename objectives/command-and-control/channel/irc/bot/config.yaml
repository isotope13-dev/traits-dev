# mirc.ini numbered variable lines (`n5=%flserv <host>`): the config half
# of mIRC flood bots, stored beside the remotes. A benign client's own
# variables share the shape, so each stays notable until bot-role legs join
# it in a composite.
defaults:
  platforms: [unix, windows]
  for: [mirc, text, data]
traits:
  - id: mirc-numbered-variable-assign
    desc: mIRC numbered variable assignment
    crit: notable
    conf: 0.88
    if:
      type: text
      regex: '(?m)^n\d+=%[A-Za-z][\w.]{0,24} '
  # Flood-server triple: where the botnet meets (%flserv), on which port
  # (%flport), down which channel (%flchan).
  - id: mirc-flood-server-var
    desc: mIRC flood-server variable
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)%flserv\s+\S+'
  - id: mirc-flood-port-var
    desc: mIRC flood-port variable
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '%flport\s+\d+'
  - id: mirc-flood-channel-var
    desc: mIRC flood-channel variable
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)%flchan\s+#\S+'
  # Staged-fetch pair: the page and file of the proxy/target list the bot
  # downloads before a flood shift (%dlpage %dlfile).
  - id: mirc-proxy-download-var
    desc: mIRC download-path variable
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)%dl(page|file)\s+\S+'
  # Target ranges kept as integer IPs (`%range0 2897543168`): the sweep space
  # the scanner walks with $longip arithmetic.
  - id: mirc-scan-range-var
    desc: mIRC integer IP-range variable
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '%range\d+\s+\d{9,10}'
  # The registry script the install drops for next-boot persistence
  # (`%filetoboot 546.reg`).
  - id: mirc-reg-bootfile-var
    desc: mIRC registry boot-file variable
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)%filetoboot\s+\S+\.reg\b'
  # The system drop path the payload copies itself to
  # (`%mircdir C:\WINDOWS\SYSTEM\...`).
  - id: mirc-system-dropdir-var
    desc: mIRC system drop-path variable
    crit: notable
    conf: 0.88
    if:
      type: text
      regex: '(?i)%mircdir\s+[A-Za-z]:\\[^\r\n]{0,80}system'
