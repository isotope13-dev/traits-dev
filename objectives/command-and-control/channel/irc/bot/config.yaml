# PLACEMENT HOLD: these legacy predicates match author-chosen variable labels,
# not operations. Do not add rules or infer flood/download/scan capabilities.
# Retained at their original IDs pending a supported context-predicate home;
# see triage-reports/gauntlet-missed-deep-review-2026-10-19.json.
defaults:
  platforms: [unix, windows]
  for: [mirc, text, data]
traits:
  - id: mirc-flood-server-var
    desc: mIRC variable named flserv has a value
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)%flserv\s+\S+'
  - id: mirc-flood-port-var
    desc: mIRC flport variable has a numeric value
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '%flport\s+\d+'
  - id: mirc-flood-channel-var
    desc: mIRC flchan variable has a hash-prefixed value
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)%flchan\s+#\S+'
  - id: mirc-proxy-download-var
    desc: mIRC dlpage/dlfile variable has a value
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)%dl(page|file)\s+\S+'
  - id: mirc-scan-range-var
    desc: mIRC range variable has a large integer
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '%range\d+\s+\d{9,10}'
