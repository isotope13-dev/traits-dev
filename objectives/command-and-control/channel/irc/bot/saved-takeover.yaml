# State evidence only: no remote handler or executable script is supplied.
defaults:
  for: [text, mirc]
  platforms: [windows]
composite_rules:
  - id: mirc-authenticated-bot-takeover-state
    desc: Saved authenticated IRC bot channel-takeover count
    crit: suspicious
    conf: 0.95
    all:
      - id: micro-behaviors/data/config/schema::mirc-bot-server-variable
      - id: micro-behaviors/data/config/schema::mirc-authentication-state-variable
      - id: micro-behaviors/data/config/schema::mirc-channel-takeover-count-variable
