# Inspect staged heredoc code: the shell literal projection omits its body.
defaults:
  platforms: [unix]
  for: [shell]
  attack: T1071,T1059.004
traits:
  - id: irc-task-shell-response-code
    desc: IRC task branch executes shell and replies
    crit: suspicious
    conf: 0.97
    if:
      type: text
      regex: '=~\s*["'']PRIVMSG["''][\s\S]{0,900}bash -c "\$\w+"[\s\S]{0,80}PRIVMSG'
composite_rules:
  - id: signed-shell-command-response
    desc: IRC replies with signed-command shell output
    crit: hostile
    conf: 0.98
    all:
      - id: irc-task-shell-response-code
      - id: micro-behaviors/communications/socket/tcp::dev-tcp-fd-redirect
      - id: micro-behaviors/data/decode/base64::base64-local-pipeline-input
      - id: micro-behaviors/crypto/asymmetric/rsa::openssl-rsautl-verify
      - id: micro-behaviors/process/create/shell/command-string::variable-command-base64-output
