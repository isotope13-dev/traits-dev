defaults:
  for: [mirc]
  platforms: [windows]
  attack: T1498,T1071.001

traits:
  - id: mirc-send-portflood-command
    desc: Sends port-flood command to IRC channel
    crit: notable
    conf: 0.96
    if:
      type: text
      regex: '(?i)\bmsg\s+%[A-Za-z0-9_.]+\s+!portflood\s+%'
  - id: mirc-send-udp-flood-command
    desc: Sends UDP-flood command to IRC channel
    crit: notable
    conf: 0.96
    if:
      type: text
      regex: '(?i)\bmsg\s+%[A-Za-z0-9_.]+\s+!udp\s+%'
  - id: mirc-authenticated-text-dispatch
    desc: IRC command handler checks authentication
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: '(?is)on\s+\*:text:[^\n]{0,40}\{[\s\S]{0,120}%auth'

composite_rules:
  - id: mirc-authenticated-flood-controller
    desc: IRC command handler orchestrates packet floods
    crit: hostile
    conf: 0.98
    all:
      - id: mirc-send-portflood-command
      - id: mirc-send-udp-flood-command
      - id: mirc-authenticated-text-dispatch
