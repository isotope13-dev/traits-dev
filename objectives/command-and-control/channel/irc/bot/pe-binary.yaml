# IRC bot/backdoor traits for PE binaries (Delphi, C++, etc.)
# Detects bare IRC command strings and bot remote-control commands
# commonly found in compiled IRC backdoors/trojans
defaults:
  for: [pe, dll]
  platforms: [windows]

traits:
  # These command/status words are weak fragments on their own: benign PE
  # resources can contain most of the set. Keep the vocabulary in this IRC
  # objective, where it is only one required leg alongside IRC protocol and
  # an independent process/download/registry/delete capability.
  - id: irc-command-killprocess-token
    desc: KILLPROCESS command token
    crit: component
    conf: 0.9
    if:
      type: text
      exact: KILLPROCESS

  - id: irc-command-execute-token
    desc: EXECUTE command token
    crit: component
    conf: 0.6
    if:
      type: text
      exact: EXECUTE

  - id: irc-command-download-token
    desc: DOWNLOAD command token
    crit: component
    conf: 0.55
    if:
      type: text
      exact: DOWNLOAD

  - id: irc-command-disconnect-token
    desc: DISCONNECT command token
    crit: component
    conf: 0.7
    if:
      type: text
      exact: DISCONNECT

  - id: irc-command-httpserver-token
    desc: HTTPSERVER command token
    crit: component
    conf: 0.9
    if:
      type: text
      exact: HTTPSERVER

  - id: irc-command-dot-udp-text
    desc: UDP command text
    crit: component
    conf: 0.8
    if:
      type: text
      regex: (?i)^\.udp(\s+\S+)?$
      section: .rdata

  - id: irc-command-download-finished
    desc: Download completion status
    crit: component
    conf: 0.8
    if:
      type: text
      substr: Download finished

  - id: irc-command-execute-completed
    desc: Execution completion status
    crit: component
    conf: 0.8
    if:
      type: text
      substr: Execute completed

  - id: pe-irc-privmsg
    desc: IRC PRIVMSG command in binary
    crit: notable
    conf: 0.8
    attack: T1071.001
    if:
      type: text
      exact: PRIVMSG

  - id: pe-irc-nick
    desc: IRC NICK command in binary
    crit: component
    conf: 0.7
    if:
      type: text
      exact: NICK

  - id: pe-irc-join
    desc: IRC channel JOIN command
    crit: component
    conf: 0.65
    if:
      type: text
      regex: '\bJOIN\s+[#&+!][^\s,]{1,50}'

  - id: pe-irc-quit
    desc: IRC QUIT command in binary
    crit: component
    conf: 0.5
    if:
      type: text
      exact: QUIT

  - id: pe-irc-motd
    desc: IRC MOTD command in binary
    crit: component
    conf: 0.6
    if:
      type: text
      exact: MOTD

  - id: pe-irc-nick-collision
    desc: IRC nickname collision error string
    crit: notable
    conf: 0.95
    attack: T1071.001
    if:
      type: text
      substr: Nickname is already in use

  - id: irc-netbios-infection-report
    desc: IRC message reports a NetBIOS infection
    crit: suspicious
    conf: 0.99
    attack: T1071.001
    if:
      type: text
      regex: '(?i)PRIVMSG\s+#[^\s:]{1,50}\s+:NetBios infected\b'

composite_rules:
  - id: irc-command-status-vocabulary
    desc: IRC command/status vocabulary
    crit: component
    conf: 0.93
    needs: 3
    any:
      - id: irc-command-killprocess-token
      - id: irc-command-execute-token
      - id: irc-command-download-token
      - id: irc-command-disconnect-token
      - id: irc-command-httpserver-token
      - id: irc-command-dot-udp-text
      - id: irc-command-download-finished
      - id: irc-command-execute-completed

  - id: pe-irc-protocol
    desc: IRC protocol commands in PE binary
    crit: suspicious
    conf: 0.92
    attack: T1071.001
    all:
      - id: pe-irc-privmsg
    needs: 2
    any:
      - id: pe-irc-nick
      - id: pe-irc-join
      - id: micro-behaviors/communications/socket/tcp::pong-keepalive-token
      - id: pe-irc-quit
      - id: pe-irc-motd
      - id: pe-irc-nick-collision

  - id: irc-backdoor-trojan
    desc: IRC C2 backdoor with remote commands
    crit: hostile
    conf: 0.95
    attack: T1071.001
    all:
      - id: pe-irc-protocol
      - id: irc-command-status-vocabulary
    any:
      - id: micro-behaviors/process/create/exec::create-process-a
      - id: micro-behaviors/communications/http/client/urlmon::url-download-to-file-str
      - id: micro-behaviors/os/registry/access::registry-write-api-chain
      - id: micro-behaviors/fs/delete/file/library::deletefile-a
    downgrade:
      any:
        - id: metadata/signed/platform/
        - id: metadata/binary/vendor::microsoft-corp-versioninfo

  - id: irc-bot-downloader-startup
    desc: IRC bot stages payload and persists at startup
    crit: hostile
    conf: 0.99
    attack: T1071.001,T1105,T1547.001
    all:
      - id: pe-irc-protocol
      - id: micro-behaviors/communications/http/client/wininet::wininet-file-process-api-profile
      - id: micro-behaviors/fs/path/autostart::windows-startup-reference
    any:
      - id: micro-behaviors/process/create/spawn::create-process-w
      - id: micro-behaviors/process/create/exec::create-process-a

  - id: irc-netbios-worm-report
    desc: NetBIOS worm reports infection over IRC
    crit: hostile
    conf: 0.99
    attack: T1071.001
    all:
      - id: irc-netbios-infection-report
      - id: pe-irc-protocol
      - id: micro-behaviors/os/network/share::wnet-add-connection

  - id: tiny-pe-irc-privmsg
    desc: Tiny PE embeds an IRC PRIVMSG command
    crit: hostile
    conf: 0.94
    attack: T1071.001
    all:
      - id: metadata/binary/layout/size::tiny-pe
      - id: pe-irc-privmsg
    unless:
      - id: metadata/signed/platform/
      - id: well-known/lib/

  - id: irc-privmsg-copyfile-worm
    desc: IRC PRIVMSG binary copies files
    crit: hostile
    conf: 0.94
    attack: T1071.001,T1091
    all:
      - id: pe-irc-privmsg
      - id: micro-behaviors/fs/file/copy::copyfile-a
    unless:
      - id: metadata/signed/platform/
      - id: well-known/lib/
