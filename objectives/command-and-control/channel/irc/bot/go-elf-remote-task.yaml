# IRC and os/exec alone also occur in legitimate clients. Require the
# process-directory concealment code and shell/output capabilities.
defaults:
  platforms: [linux]
  for: [elf]
composite_rules:
  - id: go-irc-shell-download-socks-agent
    desc: Go IRC agent executes commands and relays SOCKS
    crit: hostile
    conf: 0.98
    attack: T1071,T1059.004,T1105,T1090
    all:
      - id: micro-behaviors/communications/irc/command::privmsg-command-bytes
      - id: micro-behaviors/communications/irc/command::user-registration-realname-template
      - id: metadata/binary/symbols/name/qualified::go-native-exec-command-reference
      - id: micro-behaviors/process/create/shell/command-mode::native-shell-command-invocation
      - id: micro-behaviors/communications/proxy/tunnel::go-socks-handler
      - id: micro-behaviors/process/create/spawn::go-cmd-start-pclntab
    any:
      - id: micro-behaviors/communications/http/get::go-native-http-get-reference
      - id: micro-behaviors/communications/irc/command::user-registration-template

  - id: go-elf-irc-socks-tasking-bot
    desc: Concealed Go IRC shell-command agent
    crit: hostile
    conf: 0.97
    attack: T1071,T1059.004
    all:
      - id: micro-behaviors/communications/irc/command::privmsg-command-bytes
      - id: micro-behaviors/process/create/shell/command-mode::native-shell-command-invocation
      - id: micro-behaviors/process/fd/stdio::go-binary-combined-output-reference
      - id: objectives/evasion/process/hidden/procfs::go-irc-procfs-bind-concealment
    any:
      - id: micro-behaviors/communications/proxy/socks::socks5-proto
      - id: micro-behaviors/communications/proxy/tunnel::go-socks-handler

