# Go IRC bots keep registration templates and PRIVMSG dispatch in rodata while
# tasking (exec, SOCKS relay) lives in pclntab symbol names.
defaults:
  platforms: [linux]
  for: [elf]
  attack: T1071.001,T1090

composite_rules:
  - id: go-elf-irc-socks-tasking-bot
    desc: Go ELF IRC client with exec and SOCKS relay tasking
    crit: hostile
    conf: 0.97
    all:
      - id: metadata/lang/compiler/systems::go-binary
      - id: micro-behaviors/communications/irc/command::privmsg-command-bytes
      - id: micro-behaviors/communications/irc/command::user-registration-template
      - id: metadata/binary/symbols/name::go-os-exec-package-reference
    any:
      - id: micro-behaviors/communications/proxy/socks::socks5-proto
      - id: micro-behaviors/communications/proxy/tunnel::go-socks-handler
    needs: 1
    unless:
      - id: well-known/tool/sysadmin/unix-benign/
      - id: metadata/package/testing/
