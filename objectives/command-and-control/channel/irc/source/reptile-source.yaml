defaults:
  attack: T1071.001
  for: [c, cpp]
  platforms: [windows]
traits:
  - id: exploit-channel
    desc: Reptile exploit IRC channel
    crit: suspicious
    conf: 0.96
    if:
      type: string_literal
      exact: '#exp'
  - id: sniffer-channel
    desc: Reptile sniffer IRC channel
    crit: suspicious
    conf: 0.96
    if:
      type: string_literal
      exact: '#sniff'
composite_rules:
  - id: reptile-source-botnet
    desc: Win32.Reptile source botnet family
    crit: hostile
    conf: 0.99
    all:
      - id: exploit-channel
      - id: sniffer-channel
    any:
      - id: objectives/persistence/system/service/install::default-service-name
      - id: objectives/persistence/system/service/install::default-display-name
      - id: objectives/evasion/kernel-hide/rootkit::windows-process-hiding-rootkit
