defaults:
  platforms: [windows, unix]
  for: [c, cpp]
traits:
  - id: privmsg
    desc: IRC PRIVMSG command string
    crit: notable
    conf: 0.9
    if:
      type: string_literal
      exact: PRIVMSG
  - id: nick-user
    desc: IRC NICK USER registration format
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: NICK %s\\r\\n"\s*"USER %s [^\\r\\n"]{1,32}:[^\\r\\n"]{1,32}\\r\\n
  - id: join-channel
    desc: IRC JOIN with channel key
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: JOIN %s\s+:?%s\\r\\n
  - id: join-simple
    desc: IRC JOIN channel command
    crit: notable
    conf: 0.85
    if:
      type: string_literal
      regex: '^JOIN %s(\\r\\n)?$'
  - id: pong-keepalive
    desc: IRC PONG keepalive format
    crit: notable
    conf: 0.9
    if:
      type: string_literal
      substr: PONG %s
  - id: userhost-lookup
    desc: IRC USERHOST lookup command
    crit: notable
    conf: 0.9
    if:
      type: text
      substr: 'USERHOST %s\r\n'
  - id: kick-command
    desc: IRC KICK command in source
    crit: notable
    conf: 0.9
    if:
      type: string_literal
      substr: KICK %s
  - id: mode-command
    desc: IRC MODE command in source
    crit: notable
    conf: 0.85
    if:
      type: text
      regex: 'MODE %s\s+[+-][A-Za-z]+'
  - id: topic-command
    desc: IRC TOPIC command in source
    crit: notable
    conf: 0.85
    if:
      type: string_literal
      substr: TOPIC %s
  - id: notice-command
    desc: IRC NOTICE command in source
    crit: notable
    conf: 0.85
    if:
      type: string_literal
      substr: NOTICE %s
  - id: irc-port-6667
    desc: Default IRC port 6667
    crit: component
    conf: 0.8
    if:
      type: string_literal
      substr: '6667'
  - id: svbot-cmd-get-file
    desc: SvBot download command
    crit: suspicious
    conf: 0.96
    attack: T1105
    if:
      type: string_literal
      exact: "@get.file"
  - id: svbot-cmd-kill-bot
    desc: SvBot removal command
    crit: suspicious
    conf: 0.96
    if:
      type: string_literal
      exact: "@kill.bot"
  - id: svbot-cmd-flood-host
    desc: SvBot flood command
    crit: suspicious
    conf: 0.97
    attack: T1498
    if:
      type: string_literal
      exact: "@flood.host"
  - id: svbot-cmd-im-spread
    desc: SvBot messenger spread command
    crit: suspicious
    conf: 0.97
    attack: T1105
    if:
      type: string_literal
      exact: "@im.spread"
  - id: svbot-cmd-honeypot-on
    desc: SvBot honeypot listener command
    crit: suspicious
    conf: 0.95
    if:
      type: string_literal
      exact: "@honeypot.on"
  - id: svbot-cmd-bot-raw
    desc: SvBot raw IRC command
    crit: suspicious
    conf: 0.95
    if:
      type: string_literal
      exact: "@bot.cmd"
  - id: operator-shell-command-help
    desc: Shell-command usage text
    crit: notable
    conf: 0.94
    attack: T1059.004
    if:
      type: literal
      kind: string
      # EXEC <command> is Git rebase help text, not an IRC operator verb.
      regex: '(?i)(^|[^A-Za-z0-9_-])(SH|CMD|SHELL)\s+<command>'
  - id: irc-bot-control-prototype
    desc: IRC bot control function prototype
    crit: notable
    conf: 0.9
    if:
      type: text
      # Bot-control entry points: connect, server output, ident responder,
      # clone callback, and privilege parser. Names alone do not prove tasking.
      regex: '\b(connectbot|serverout|identactive|closeid|privpar|clonecallback)\s{0,2}\('
  # Operator identity is a parameter of the line parser: a master (or an array
  # of masters, as SdBot declares it) and a host that the bot compares with the
  # sender before it acts on a command line.
  - id: irc-operator-line-parser
    desc: IRC line parser takes masters and host
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '\bchar\s*(\*\s*master\b|masters\s*\[)[^;]{0,200}\bchar\s*\*\s*host\b'
      exclude_comments: true
  - id: irc-receive-loop-prototype
    desc: IRC receive loop function prototype
    crit: notable
    conf: 0.9
    if:
      type: symbol
      kind: identifier
      regex: '^irc_receive_?loop$'
  - id: irc-random-nick-prototype
    desc: IRC random nick generator prototype
    crit: notable
    conf: 0.85
    if:
      type: symbol
      kind: identifier
      regex: '^rnd_?nick$'
  # A command parser that takes a file-option struct: the verbs arrive as
  # switches on one command line. The struct type alone is not IRC evidence.
  - id: irc-command-switch-parser
    desc: IRC command parser takes file switch struct
    crit: notable
    conf: 0.88
    if:
      type: text
      regex: '\bint\s+IRC_\w+\s*\([^;]{0,240}\bSWITCHES\s+\w+'
composite_rules:
  - id: irc-protocol-source
    desc: IRC protocol implementation in C source
    crit: notable
    conf: 0.97
    all:
      - id: privmsg
    needs: 2
    any:
      - id: nick-user
      - id: micro-behaviors/communications/irc/command::nick-format
      - id: micro-behaviors/communications/irc/command::user-registration
      - id: join-channel
      - id: join-simple
      - id: pong-keepalive
      - id: userhost-lookup
  - id: irc-channel-management
    desc: IRC channel management commands
    crit: notable
    conf: 0.9
    all:
      - id: privmsg
    needs: 2
    any:
      - id: kick-command
      - id: mode-command
      - id: topic-command
      - id: notice-command
      - id: irc-port-6667
  - id: irc-remote-shell-backdoor
    desc: IRC bot executes operator-supplied shell commands
    crit: hostile
    conf: 0.98
    attack: T1059.004,T1071.001
    all:
      - id: irc-protocol-source
      - id: operator-shell-command-help
      - id: micro-behaviors/process/create/shell/variable-command::c-popen-variable-input
  - id: svbot-operator-command-set
    desc: SvBot IRC operator command set
    crit: hostile
    conf: 0.98
    attack: T1071.001,T1105,T1498
    all:
      - id: svbot-cmd-get-file
      - id: svbot-cmd-kill-bot
    needs: 2
    any:
      - id: svbot-cmd-flood-host
      - id: svbot-cmd-im-spread
      - id: svbot-cmd-honeypot-on
      - id: svbot-cmd-bot-raw
  # A bot's control entry points in the same source file as a wingate relay
  # listener: the bot offers an operator-reachable proxy relay. Each leg is
  # independent evidence, so the composite is file-scoped and needs both.
  - id: irc-bot-wingate-relay-source
    desc: C header pairs IRC bot control with a wingate relay listener
    crit: hostile
    conf: 0.94
    attack: T1090,T1071.001
    all:
      - id: irc-bot-control-prototype
      - id: micro-behaviors/communications/proxy/relay::wingate-gateway-listener-define
  # The receive loop reads server lines and the line parser gates each command
  # on an operator master and host. Both legs are required; neither alone is a
  # bot, since IRC clients also read lines and some parse a host argument.
  - id: irc-bot-operator-command-loop
    desc: IRC receive loop dispatches master-gated command lines
    crit: hostile
    conf: 0.95
    attack: T1071.001
    all:
      - id: irc-operator-line-parser
      - id: irc-receive-loop-prototype
  # The command parser takes a file-option struct whose hidden switch hides
  # the files it writes. Each leg is separate evidence, so both are required.
  - id: irc-command-hidden-file-switches
    desc: IRC command parser with hidden-attribute file switch
    crit: hostile
    conf: 0.9
    attack: T1071.001,T1564.001
    all:
      - id: irc-command-switch-parser
      - id: micro-behaviors/fs/attributes/flags::file-attribute-hidden-switch-field
