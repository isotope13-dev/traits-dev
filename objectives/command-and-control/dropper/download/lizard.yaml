# Compact ARM downloaders identify as LIZRD/lzrd and pull a
# architecture-suffixed payload over a raw HTTP/1.0 GET.
defaults:
  platforms: [linux, android]
  for: [elf]
  attack: T1105
  mbc: B0032
  size_max: 8192

traits:
  - id: lizrd-family-tag
    desc: LIZRD family downloader tag
    crit: notable
    conf: 0.97
    size_max: 8192
    if:
      type: text
      word: LIZRD
  - id: lzrd-family-tag
    desc: lzrd family downloader tag
    crit: notable
    conf: 0.94
    size_max: 8192
    if:
      type: text
      word: lzrd

composite_rules:
  - id: lizrd-http-get
    desc: LIZRD tag with an HTTP GET path
    crit: hostile
    conf: 0.97
    size_max: 8192
    all:
      - id: lizrd-family-tag
      - id: micro-behaviors/communications/http/get::binary-get-path
  - id: lizrd-tiny-static
    desc: Tiny static ELF with a LIZRD tag
    crit: hostile
    conf: 0.95
    size_max: 8192
    all:
      - id: lizrd-family-tag
      - id: metadata/binary/layout/size::tiny-elf
  - id: lzrd-http-get
    desc: lzrd tag with an HTTP GET path
    crit: hostile
    conf: 0.96
    size_max: 8192
    all:
      - id: lzrd-family-tag
      - id: micro-behaviors/communications/http/get::binary-get-path
