defaults:
  platforms: [windows, unix]
  for: [html]
  attack: T1105
composite_rules:
  - id: html-refresh-only-archive-downloader
    desc: Empty HTML page forces archive download
    crit: hostile
    conf: 0.93
    all:
      - id: micro-behaviors/ui/window/navigation::browser-meta-refresh-archive-download
      - id: metadata/document/html::empty-html-body
