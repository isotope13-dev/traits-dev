# Python packages that retrieve content from public IPFS gateways and execute
# source read from disk with compile()+exec(). The individual mechanics are
# legitimate; their package-wide combination establishes a remote loader.
defaults:
  platforms: [unix, windows]
  for: [python, whl, python-sdist]
  attack: T1105,T1059.006,T1027
  mbc: B0032,E1105

composite_rules:
  - id: python-ipfs-remote-module-exec-dropper
    desc: Python retrieves IPFS content then executes source modules
    crit: hostile
    conf: 0.97
    scope: archive
    all:
      - id: micro-behaviors/communications/http/lib/requests::requests-get
      - id: objectives/execution/interpreter/runtime/dynamic::python-read-compile-exec-chain
      - id: micro-behaviors/process/create/thread::python-thread-create
      - id: micro-behaviors/data/control-flow/loop::python-while-true
      - id: micro-behaviors/time/sleep/interval::python-long-sleep-call
    any:
      - id: micro-behaviors/communications/http/services/ipfs::public-ipfs-gateway-literal
      - id: micro-behaviors/communications/http/services/ipfs::alt-ipfs-gateway-literal
