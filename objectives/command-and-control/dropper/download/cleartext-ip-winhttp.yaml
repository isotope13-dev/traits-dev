# Co-occurrence of a WinHTTP request/response stack and a bare-IP
# cleartext HTTP URL. No dataflow is claimed: the same binary can carry
# both facts on different channels (for example a TLS upstream relay on
# WinHTTP plus a raw-socket cleartext updater), so the name describes
# the two observations, not a WinHTTP download from the bare IP. The
# combined picture is still a channel with no endpoint authentication
# (some builds additionally relax TLS certificate checks, which only
# sharpens the same point). Self-updaters with pinned infrastructure do
# this too, so the claim stays suspicious; payload execution after a
# download is claimed by the dropper composites.
defaults:
  platforms: [windows]
  for: [pe]
  attack: T1071.001,T1105

composite_rules:
  - id: unverified-winhttp-stack-and-bare-ip-url
    desc: Unverified WinHTTP stack alongside a bare-IP cleartext HTTP URL
    crit: suspicious
    conf: 0.88
    all:
      - id: micro-behaviors/communications/http/client/winhttp::winhttp-runtime-text-download-flow
      - id: micro-behaviors/communications/url/host/oob-http::url-external-ip-port-binary
    unless:
      - id: metadata/signed/platform/

  # This co-occurrence cluster combines an unsigned binary's unverified
  # bare-IP WinHTTP download path with self-mutation diagnostics, Run-key
  # registration, and executable launch. Those roles together describe a
  # persistent, unauthenticated updater pattern rather than the transport
  # capability alone.
  - id: unsigned-persistent-cleartext-ip-self-updater
    desc: Unsigned downloader mutates and persists
    crit: hostile
    conf: 0.97
    attack: T1105,T1547.001
    all:
      - id: unverified-winhttp-stack-and-bare-ip-url
      - id: metadata/signed/trust-level::unsigned-missing-signature-record
      - id: micro-behaviors/fs/write/file/executable::self-hash-rotation-relaunch
      - id: micro-behaviors/os/autorun/login-items::hklm-run-set-diagnostic
      - id: micro-behaviors/process/create/shellexec::shell-execute-call
    unless:
      - id: metadata/signed/platform/
