# A WinHTTP client that downloads from a bare-IP cleartext URL while
# its TLS certificate checks are relaxed fetches code or data over a
# channel with no endpoint authentication. Self-updaters with pinned
# infrastructure do this too, so the claim stays suspicious; payload
# execution after the download is claimed by the dropper composites.
defaults:
  platforms: [windows]
  for: [pe]
  attack: T1071.001,T1105

composite_rules:
  - id: cleartext-ip-winhttp-download-no-verify
    desc: Bare-IP cleartext WinHTTP download with TLS checks relaxed
    crit: suspicious
    conf: 0.9
    all:
      - id: micro-behaviors/communications/http/client/winhttp::winhttp-runtime-text-download-flow
      - id: micro-behaviors/communications/http/url/external-ip::url-external-ip-port-binary
      - id: micro-behaviors/communications/tls/verify/disable::x86-winhttp-ignore-certificate-errors
    unless:
      - id: metadata/signed/platform/

  # This co-occurrence cluster combines an unsigned binary's unverified
  # bare-IP WinHTTP download path with self-mutation diagnostics, Run-key
  # registration, and executable launch. Those roles together describe a
  # persistent, unauthenticated updater pattern rather than the transport
  # capability alone.
  - id: unsigned-persistent-cleartext-ip-self-updater
    desc: Unsigned downloader mutates and persists
    crit: hostile
    conf: 0.97
    attack: T1105,T1547.001
    all:
      - id: cleartext-ip-winhttp-download-no-verify
      - id: metadata/signed/trust-level::unsigned-missing-signature-record
      - id: micro-behaviors/fs/write/file/executable::self-hash-rotation-relaunch
      - id: micro-behaviors/os/autorun/login-items::hklm-run-set-diagnostic
      - id: micro-behaviors/process/create/shellexec::shell-execute-call
    unless:
      - id: metadata/signed/platform/
