# A downloader that pads its own image to change its hash, relaunches a
# standby copy, executes a server-directed executable URL and persists via
# the Run key is not updating itself: the hash rotation exists to dodge
# file-signature detection between downloads. Legitimate updaters verify
# publisher signatures instead of mutating their own bytes, and the rotation
# composite alone stays suspicious; the download-plus-persistence pair is
# what makes the rotation hostile here.
defaults:
  platforms: [windows]
  for: [pe]
  attack: T1105,T1547.001,T1027.002
composite_rules:
  - id: hash-mutating-persistent-downloader
    desc: Downloader mutates own hash and persists via Run
    crit: hostile
    conf: 0.93
    all:
      - id: micro-behaviors/fs/write/file/executable::self-hash-rotation-relaunch
      - id: micro-behaviors/data/config/schema::download-url-field-name
      - id: micro-behaviors/os/registry/manipulate::run-key-file-operation-api-profile
      - id: micro-behaviors/fs/file/copy::self-copy-relaunch-api-set
      - id: metadata/signed/trust-level::unsigned-missing-signature-record
    unless:
      - id: metadata/signed/platform/
