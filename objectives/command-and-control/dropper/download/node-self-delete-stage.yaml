# Staged Node downloader with anti-forensics: remote bytes are streamed to
# disk, chmodded executable, launched detached and windowless, and the loader
# then deletes its own source file. Updaters may download and relaunch, but
# never unlink their own script as the final step — the conjunction is a
# dropper covering its tracks.
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
  attack: T1105,T1070.004
composite_rules:
  - id: node-download-chmod-self-delete-stage
    desc: Downloaded payload executed hidden, loader self-deleted
    crit: hostile
    conf: 0.99
    near_bytes: 8192
    all:
      - id: micro-behaviors/communications/http/download/handler::node-http-stream-to-file-text
      - id: micro-behaviors/fs/chmod/executable/mode::node-chmod-exec-mode-string-755
      - id: micro-behaviors/fs/delete/file/self::unlink-filename
      - id: micro-behaviors/process/create/hidden::detached-silent-hidden-spawn
