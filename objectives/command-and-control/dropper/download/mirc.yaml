# Retained mIRC observations describe the network request and socket bytes
# written to a file. Those actions establish a downloader capability, not
# hostile intent by themselves.
defaults:
  platforms: [unix, windows]
  for: [mirc, text, data]
traits:
  - id: mirc-http-get-sockwrite
    desc: mIRC socket sends a GET request
    crit: notable
    conf: 0.9
    if:
      type: text
      # Named download sockets (`%WWW.Temp`, `wwwGet`) and versionless GET
      # lines are the same fetch behavior as the `$sockname` form: the
      # downloader composite pairs this with the socket-to-file write.
      regex: '(?i)\bsockwrite\s+(-[a-z]+\s+)?(\$sockname|%?[A-Za-z][\w.]*)\s+GET\s+\S+(\s+HTTP/1\.[01])?'
  - id: mirc-bwrite-socket-binary
    desc: mIRC writes socket binary to file
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)\bbwrite\s+\S+[^\r\n]{0,40}&[A-Za-z]+'
  - id: mirc-unload-remote-ini
    desc: mIRC unloads a remote script
    crit: notable
    conf: 0.88
    if:
      type: text
      regex: '(?i)\.unload\s+-rs\s+\S+\.ini\b'
