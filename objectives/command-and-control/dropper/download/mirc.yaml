# Script-driven HTTP fetch to disk: the remote opens a socket, speaks a GET
# request at it, and writes the reply's binary chunks with bwrite. Either
# half alone is ordinary scripting; the socket-to-file pipeline is a
# downloader, and an unloaded script swapped for the fresh bytes is a
# self-update.
defaults:
  platforms: [unix, windows]
  for: [mirc, text, data]
traits:
  - id: mirc-http-get-sockwrite
    desc: mIRC socket sends an HTTP GET
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)\bsockwrite\s+(-[a-z]+\s+)?\$sockname\s+GET\s+\S+\s+HTTP/1\.[01]'
  - id: mirc-bwrite-socket-binary
    desc: mIRC writes socket binary to file
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)\bbwrite\s+\S+[^\r\n]{0,40}&[A-Za-z]+'
  - id: mirc-unload-remote-ini
    desc: mIRC unloads a remote script
    crit: notable
    conf: 0.88
    if:
      type: text
      regex: '(?i)\.unload\s+-rs\s+\S+\.ini\b'
composite_rules:
  - id: mirc-http-download-to-disk
    desc: mIRC RAT downloads and writes payload to disk
    crit: hostile
    conf: 0.96
    attack: T1105
    all:
      - id: mirc-http-get-sockwrite
      - id: mirc-bwrite-socket-binary
    any:
      - id: mirc-unload-remote-ini
      - id: objectives/command-and-control/channel/irc/client::mirc-sockopen-call
