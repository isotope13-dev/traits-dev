# Script-driven HTTP fetch to disk: the remote opens a socket, speaks a GET
# request at it, and writes the reply's binary chunks with bwrite. Either
# half alone is ordinary scripting; the socket-to-file pipeline is a
# downloader. Unloading a remote script alongside the fresh bytes is a
# suspicious module-replacement sequence.
defaults:
  platforms: [unix, windows]
  for: [mirc, text, data]
traits:
  - id: mirc-http-get-sockwrite
    desc: mIRC socket sends a GET request
    crit: notable
    conf: 0.9
    if:
      type: text
      # Named download sockets (`%WWW.Temp`, `wwwGet`) and versionless GET
      # lines are the same fetch behavior as the `$sockname` form: the
      # downloader composite pairs this with the socket-to-file write.
      regex: '(?i)\bsockwrite\s+(-[a-z]+\s+)?(\$sockname|%?[A-Za-z][\w.]*)\s+GET\s+\S+(\s+HTTP/1\.[01])?'
  - id: mirc-bwrite-socket-binary
    desc: mIRC writes socket binary to file
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)\bbwrite\s+\S+[^\r\n]{0,40}&[A-Za-z]+'
  - id: mirc-unload-remote-ini
    desc: mIRC unloads a remote script
    crit: notable
    conf: 0.88
    if:
      type: text
      regex: '(?i)\.unload\s+-rs\s+\S+\.ini\b'
composite_rules:
  - id: mirc-http-download-to-disk
    desc: mIRC RAT downloads and writes payload to disk
    crit: hostile
    conf: 0.96
    attack: T1105
    all:
      - id: mirc-http-get-sockwrite
      - id: mirc-bwrite-socket-binary
    any:
      - id: mirc-unload-remote-ini
      - id: micro-behaviors/communications/socket/connect::mirc-sockopen
