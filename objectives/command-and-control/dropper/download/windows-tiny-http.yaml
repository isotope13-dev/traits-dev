# Tiny unsigned Windows PE downloaders that resolve APIs at runtime and stage
# HTTP GET traffic through split request-string fragments.
defaults:
  platforms: [windows]
  for: [pe]
  attack: T1105,T1027.010
  mbc: B0030

composite_rules:
  - id: tiny-pe-peb-http-get-stager
    desc: Tiny PE dynamically resolves APIs for HTTP GET staging
    crit: hostile
    conf: 0.95
    size_max: 8192
    all:
      - id: objectives/anti-static/obfuscation/imports::string-based-api-resolution
      - id: micro-behaviors/communications/http/get::pe-http-get-request-fragments

  - id: unsigned-pe-split-http-get-stager
    desc: Unsigned tiny PE builds split HTTP GET download request
    crit: hostile
    conf: 0.93
    size_max: 8192
    all:
      - id: metadata/binary/layout::pe-no-signature-record
      - id: micro-behaviors/communications/http/get::pe-http-get-request-fragments
