# Tiny unsigned Windows PE downloaders that resolve APIs at runtime and stage
# HTTP GET traffic through split request-string fragments.
defaults:
  crit: hostile
  platforms: [windows]
  for: [pe]
  attack: T1105,T1027.010
  mbc: B0030

composite_rules:
  - id: tiny-pe-peb-http-get-stager
    desc: Tiny PE dynamically resolves APIs for HTTP GET staging
    conf: 0.95
    size_max: 8192
    all:
      - id: micro-behaviors/communications/http/get::pe-http-get-request-fragments
    any:
      - id: objectives/anti-static/obfuscation/imports/api-hashing::string-based-api-resolution
      - id: micro-behaviors/os/api-resolution/manual::peb-access-x64

  - id: unsigned-pe-split-http-get-stager
    desc: Unsigned tiny PE builds split HTTP GET download request
    conf: 0.93
    size_max: 8192
    all:
      - id: metadata/signed/trust-level::unsigned-missing-signature-record
      - id: micro-behaviors/communications/http/get::pe-http-get-request-fragments

  - id: tiny-pe-http-get-rwx-stager
    desc: Tiny PE stages HTTP GET payload into RWX memory
    conf: 0.98
    size_max: 8192
    all:
      - id: micro-behaviors/communications/http/get::pe-http-get-request-fragments
      - id: micro-behaviors/mem/alloc/executable::rwx-allocation
