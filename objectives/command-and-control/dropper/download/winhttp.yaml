defaults:
  platforms: [windows]
  for: [pe]

composite_rules:
  - id: xor-winhttp-rundll32-download-exec
    desc: XOR-obfuscated WinHTTP payload download launched through rundll32
    crit: hostile
    conf: 0.99
    attack: T1105,T1218.011
    mbc: B0024
    all:
      - id: micro-behaviors/communications/http/client/winhttp::xor-decoded-winhttp-request-flow
      - id: micro-behaviors/communications/http/url/domain::xor-decoded-http-url
      - id: objectives/anti-static/obfuscation/decoders::xor-decoded-createprocess-api
      - id: objectives/anti-static/obfuscation/decoders::xor-decoded-rundll32-host
    any:
      - id: micro-behaviors/mem/alloc/virtual::xor-decoded-virtual-alloc-api
      - id: micro-behaviors/mem/alloc/executable::executable-allocation-indicator
    downgrade:
      any:
        - id: metadata/signed/platform/
        - id: metadata/binary/installer/family/

  - id: xor-winhttp-memory-stage-dropper
    desc: XOR-obfuscated WinHTTP stage allocates memory and creates a process
    crit: hostile
    conf: 0.98
    attack: T1105,T1055,T1027.002
    mbc: B0023
    for: [pe, dll]
    all:
      - id: micro-behaviors/communications/http/client/winhttp::xor-decoded-winhttp-request-flow
      - id: objectives/anti-static/obfuscation/decoders::xor-decoded-createprocess-api
      - id: micro-behaviors/mem/alloc/virtual::xor-decoded-virtual-alloc-api
      - id: micro-behaviors/fs/delete/file/library::delete-win
  - id: winhttp-temp-powershell-loader
    desc: WinHTTP temp dropper launches PowerShell loader
    crit: hostile
    conf: 0.96
    all:
      - id: micro-behaviors/communications/http/client/winhttp::winhttp-temp-write-api-cluster
      - id: objectives/evasion/security-bypass/policy/execution::bypass-execution-policy
      - id: micro-behaviors/process/create/spawn::create-process-w
    any:
      - id: objectives/command-and-control/dropper/staging/archive::winhttp-zip-temp-execute
      - id: micro-behaviors/data/archive/extract/zip::powershell-expand-archive
      - id: objectives/command-and-control/beacon/network/http::direct-http-c2-binary-ip
    downgrade:
      any:
        - id: metadata/signed/platform/
        - id: metadata/binary/installer/family/

  - id: unsigned-winhttp-shell-execute-dropper
    desc: Unsigned WinHTTP downloader uses ShellExecute
    crit: hostile
    conf: 0.97
    attack: T1105,T1071.001
    mbc: B0024
    size_max: 524288
    all:
      - id: micro-behaviors/communications/http/client/winhttp::winhttp-request-flow
      - id: metadata/signed/trust-level::unsigned-missing-signature-record
    any:
      - id: micro-behaviors/process/create/shellexec::shell-execute-a
      - id: micro-behaviors/process/create/shellexec::shell-execute-call
    needs: 1
    # No family-identity suppression: identity never blanket-suppresses an
    # entity's behaviors, and the Eupdate Helper identity now lives under
    # well-known/malware/, which objectives/ must not reference.
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/installer/family/
      - id: metadata/binary/installer/script/
      - id: well-known/lib/ui/dear-imgui/
      # A local chat server downloads weights and ShellExecutes its own UI URL.
      - id: micro-behaviors/communications/http/llm-proxy::local-chat-server-weight-fetch

  - id: unsigned-winhttp-file-io-shell-dropper
    desc: Unsigned WinHTTP dropper writes payload then ShellExecutes
    crit: hostile
    conf: 0.96
    attack: T1105,T1071.001,T1027
    mbc: B0024
    size_max: 524288
    all:
      - id: micro-behaviors/communications/http/client/winhttp::winhttp-request-flow
      - id: micro-behaviors/fs/file/binary::seek-and-descriptor-io
      - id: metadata/signed/trust-level::unsigned-missing-signature-record
    any:
      - id: micro-behaviors/process/create/shellexec::shell-execute-a
      - id: micro-behaviors/process/create/shellexec::shell-execute-call
    needs: 1
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/installer/family/
      - id: metadata/binary/installer/script/
      - id: well-known/lib/ui/dear-imgui/

  - id: wininet-temp-shell-execute-dropper
    desc: WinINet HTTP downloader writes temp payload and ShellExecutes
    crit: hostile
    conf: 0.96
    attack: T1105,T1071.001
    mbc: B0024
    size_max: 524288
    all:
      - id: micro-behaviors/communications/http/client/wininet::wininet-http-flow
      - id: micro-behaviors/os/sysinfo/directories::win32-temp-path-import
      - id: micro-behaviors/fs/write/file/handle::write-file
      - id: micro-behaviors/process/create/shellexec::shell-execute
    any:
      - id: micro-behaviors/fs/delete/file/library::deletefile-w
      - id: micro-behaviors/communications/http/client/wininet::internet-read-file
    needs: 1
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/installer/family/
      - id: metadata/binary/resource/identity::pe-version-resource
      - id: metadata/binary/installer/script/

  - id: fnv-resolved-winhttp-encrypted-c2
    desc: FNV-resolved WinHTTP client with an encoded endpoint and decrypt API
    crit: hostile
    conf: 0.98
    attack: T1071.001,T1027.007,T1140
    for: [pe, dll]
    all:
      - id: micro-behaviors/data/checksum::fnv1a-byte-hash-loop-x64
      - id: micro-behaviors/communications/url/encoded::binary-base64-http-url
      - id: micro-behaviors/crypto/library/cryptoapi::crypt-decrypt-api-name-text
      - id: micro-behaviors/communications/http/client/winhttp::winhttp-open-api-name
      - id: micro-behaviors/communications/http/client/winhttp::winhttp-connect-api-name
      - id: micro-behaviors/communications/http/client/winhttp::winhttp-open-request-api-name
      - id: micro-behaviors/communications/http/client/winhttp::winhttp-send-request-text
      - id: micro-behaviors/communications/http/client/winhttp::winhttp-receive-response-text
      - id: micro-behaviors/communications/http/client/winhttp::winhttp-read-data-api-name
