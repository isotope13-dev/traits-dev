# A VB6 program that downloads files with URLDownloadToFile, enables
# SeDebugPrivilege, walks the process list with run-time-resolved Toolhelp
# calls and writes registry values is a loader that inspects other
# processes before it installs. Each part is common alone; the chain is not.
defaults:
  platforms: [windows]
  for: [pe]
  attack: T1105,T1134,T1057
composite_rules:
  - id: vb6-urlmon-debug-privilege-process-scan
    desc: VB6 downloader with debug privilege and process scan
    crit: hostile
    conf: 0.8
    all:
      - id: metadata/binary/framework::vb6-application-framework
      - id: micro-behaviors/communications/http/client/urlmon::url-download-to-file-str
      - id: micro-behaviors/os/privilege/token::sedebug-privilege-name
      - id: micro-behaviors/process/enumerate/snapshot::dynamic-process32-next
      - id: micro-behaviors/os/registry/access::registry-write-api-chain
    unless:
      - id: metadata/signed/platform/
