defaults:
  platforms: [windows]
  for: [pe]
  attack: T1102.001,T1105
composite_rules:
  # A Go program that references a Pastebin dead drop, performs HTTP fetches
  # through net/http and embeds os/exec process execution combines the three
  # halves of a paste-driven downloader: dead-drop rendezvous, retrieval and
  # launch. Each leg alone is common in benign Go tools, so the coincidence
  # is the signal and the confidence stays below the tighter single-purpose
  # stager composites.
  - id: go-pastebin-fetch-execute
    desc: Go program pairs Pastebin reference with HTTP fetch and execution
    crit: hostile
    conf: 0.91
    all:
      - id: micro-behaviors/communications/http/services/file-hosting::pastebin
      - id: micro-behaviors/communications/http/client/library::go-http-client-do-string
      - id: metadata/binary/symbols/name::go-os-exec-package-reference
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/installer/family/
