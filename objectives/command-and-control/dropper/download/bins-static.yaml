# Tiny static ELF bots fetch the next architecture-named stage with
# a literal GET /bins/<name>.<arch> HTTP/1.0 request and nothing else.
defaults:
  platforms: [linux, android]
  for: [elf]
  attack: T1105
  mbc: B0032
  size_max: 8192

composite_rules:
  - id: tiny-bins-http-get
    desc: Tiny ELF GETs a /bins payload
    crit: hostile
    conf: 0.97
    all:
      - id: micro-behaviors/communications/http/get::binary-bins-payload-get-path
      - id: metadata/binary/layout/size::tiny-elf
  - id: static-bins-http-get
    desc: Static ELF GETs a /bins payload
    crit: hostile
    conf: 0.96
    all:
      - id: micro-behaviors/communications/http/get::binary-bins-payload-get-path
      - id: metadata/binary/linking/static::static-linked
  - id: tiny-static-bins-http-get
    desc: Tiny static ELF GETs a /bins payload
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/communications/http/get::binary-bins-payload-get-path
      - id: metadata/binary/layout/size::tiny-elf
      - id: metadata/binary/linking/static::static-linked
