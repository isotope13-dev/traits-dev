defaults:
  platforms: [windows]
  for: [javascript]

composite_rules:
  # RC4/base64 string-obfuscated WSH droppers hide every ProgID and URL
  # behind a decoder loop, then fetch over cleartext HTTP through split
  # ActiveX objects. Each leg is dual-use alone; together they are a
  # download cradle whose payload and destination are deliberately
  # concealed from static inspection.
  - id: wsh-rc4-obfuscated-cleartext-activex-download
    desc: RC4-obfuscated WSH script downloads via split ActiveX over HTTP
    crit: hostile
    conf: 0.97
    attack: T1105,T1027,T1106
    all:
      - id: micro-behaviors/os/com/automation::activex-concatenated-progid
      - id: micro-behaviors/communications/url/http-scheme::cleartext-http-url-code-literal
      - id: micro-behaviors/fs/write/stream::js-split-adodb-stream-progid
      - id: micro-behaviors/data/arithmetic::xor-modulo-loop-observation
