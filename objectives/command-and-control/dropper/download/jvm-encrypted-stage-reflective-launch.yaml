# A JVM class that reports the local host name over HTTP, fetches bytes from
# a URL, decrypts them with a raw AES key, writes them to disk and then
# starts a class through reflection is a staged downloader. Hostile mod
# loaders use it behind an obfuscated, unrelated-looking helper class.
defaults:
  platforms: [unix, windows]
  for: [class, java_class, jar]
  attack: T1105,T1027,T1620
composite_rules:
  - id: jvm-http-fetch-decrypt-write-reflective-launch
    desc: JVM fetches, decrypts, writes and reflectively starts code
    crit: hostile
    conf: 0.9
    all:
      - id: micro-behaviors/communications/http/lib/urlconnection::jvm-http-urlconnection-inputstream
      - id: micro-behaviors/fs/read/file/full::java-readallbytes
      - id: micro-behaviors/crypto/cipher::java-raw-key-cipher-use
      - id: micro-behaviors/fs/write/file/full::jvm-files-write-bytecode
      - id: micro-behaviors/metaprogramming/reflection::java-class-forname-bytecode
      - id: micro-behaviors/metaprogramming/reflection::java-constructor-newinstance-bytecode
      - id: micro-behaviors/os/sysinfo/hostname::jvm-local-host-name
