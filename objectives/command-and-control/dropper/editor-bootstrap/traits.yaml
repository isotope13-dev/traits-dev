defaults:
  platforms: [unix]
  for: [shell]
  attack: T1105,T1059.004
  mbc: B0024

traits:
  - id: script-download
    desc: Downloads script into editor config
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)curl.{0,160}-o.{0,80}\$HOME/[.]?(vscode|cursor|windsurf).{0,80}\.sh'
  - id: script-chmod
    desc: Makes editor config script executable
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)chmod\s+\+x.{0,120}\$HOME/[.]?(vscode|cursor|windsurf).{0,80}\.sh'
  - id: script-nohup
    desc: Backgrounds editor config script
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)nohup\s+(ba)?sh.{0,120}\$HOME/[.]?(vscode|cursor|windsurf).{0,80}\.sh'

composite_rules:
  - id: bootstrap-download-exec
    desc: Editor config script download execution
    crit: hostile
    conf: 0.99
    near_lines: 20
    all:
      - id: script-download
      - id: script-chmod
      - id: script-nohup
