defaults:
  platforms: [unix]
  for: [shell]
  attack: T1105,T1059.004
  mbc: B0024

traits:
  - id: script-download
    desc: Downloads script into editor config
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)curl.{0,160}-o.{0,80}\$HOME/[.]?(vscode|cursor|windsurf).{0,80}\.sh'
  - id: script-chmod
    desc: Makes editor config script executable
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)chmod\s+\+x.{0,120}\$HOME/[.]?(vscode|cursor|windsurf).{0,80}\.sh'
  - id: script-nohup
    desc: Backgrounds editor config script
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)nohup\s+(ba)?sh.{0,120}\$HOME/[.]?(vscode|cursor|windsurf).{0,80}\.sh'
  # The same stager often names the editor dir once (`TARGET_DIR="$HOME/.vscode"`)
  # and then works through the variable, which the inline atoms above never see.
  - id: editor-dir-var
    desc: Variable holds a home editor config dir
    crit: notable
    conf: 0.85
    if:
      type: text
      regex: '(?im)^\s*(export\s+)?\w+=["'']?\$\{?HOME\}?/[.]?(vscode|cursor|windsurf)["'']?\s*$'
  # Final stage: a JavaScript payload lands in the editor dir and a Node
  # binary (often a portable one the stager just unpacked) runs it.
  - id: js-download
    desc: Downloads JavaScript into editor config dir
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)(curl|wget)\b.{0,160}-o\s*"?\$HOME/[.]?(vscode|cursor|windsurf)/[\w.-]{1,60}\.[cm]?js'
  - id: node-run-js
    desc: Runs JavaScript from editor config dir
    crit: notable
    conf: 0.85
    if:
      type: text
      regex: '(?im)^\s*("?\$\S{1,30}|node)\s+"?\$HOME/[.]?(vscode|cursor|windsurf)/[\w.-]{1,60}\.[cm]?js'

composite_rules:
  - id: bootstrap-download-exec
    desc: Editor config script download execution
    crit: hostile
    conf: 0.99
    near_lines: 20
    all:
      - id: script-download
      - id: script-chmod
      - id: script-nohup
  # Variable form of the stager above: the editor dir is assigned once and the
  # download, chmod and background launch all go through that variable.
  - id: bootstrap-var-download-exec
    desc: Runs script fetched into editor dir variable
    crit: hostile
    conf: 0.97
    near_lines: 20
    all:
      - id: editor-dir-var
      - id: micro-behaviors/communications/http/download/shell::fetch-output-to-var
      - id: micro-behaviors/fs/chmod/executable/mode::chmod-exec-var-target
      - id: micro-behaviors/process/create/script/file::nohup-shell-script-execution
  - id: node-payload-download-exec
    desc: Node runs JS fetched into editor dir
    crit: hostile
    conf: 0.96
    attack: T1105,T1059.007
    near_lines: 60
    all:
      - id: js-download
      - id: node-run-js
