# Windows leg of the editor-config stager: a batch file downloads a second
# batch script into %USERPROFILE%\.vscode (or .cursor/.windsurf), where a
# hidden dot-dir that developers expect to exist draws no attention, and runs it.
defaults:
  platforms: [windows]
  for: [batch]
  attack: T1105,T1059.003
  mbc: B0024

traits:
  - id: batch-editor-dir
    desc: Batch names a user editor config dir
    crit: notable
    conf: 0.85
    if:
      type: text
      regex: '(?i)%USERPROFILE%\\[.]?(vscode|cursor|windsurf)\b'
  - id: batch-script-download
    desc: curl saves batch script into variable dir
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)\bcurl(\.exe)?\s.{0,120}-o\s+"?%\w+%\\[\w.-]{1,60}\.(cmd|bat)\b'
  - id: batch-script-run
    desc: Runs batch script from a variable dir
    crit: notable
    conf: 0.85
    if:
      type: text
      regex: '(?im)^\s*(call\s+|start\s+(".{0,40}"\s+)?)?"%\w+%\\[\w.-]{1,60}\.(cmd|bat)"\s*$'

composite_rules:
  - id: batch-bootstrap-download-exec
    desc: Batch fetches and runs editor config script
    crit: hostile
    conf: 0.97
    near_lines: 20
    all:
      - id: batch-editor-dir
      - id: batch-script-download
      - id: batch-script-run
