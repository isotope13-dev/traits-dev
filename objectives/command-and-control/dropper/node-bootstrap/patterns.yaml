defaults:
  platforms:
  - unix
  - windows
  for:
  - scripts
  - binaries
traits:
- id: dash-flag-single
  desc: dash flag for stdin (single quote)
  crit: notable
  for:
  - javascript
  - typescript
  if:
    type: text
    regex: '[(,=:\s]\s*\[''-''\]'
- id: dash-flag-double
  desc: dash flag for stdin (double quote)
  crit: notable
  for:
  - javascript
  - typescript
  if:
    type: text
    regex: '[(,=:\s]\s*\["-"\]'
- id: comma-dash-flag-single
  desc: comma dash flag (single quote)
  crit: notable
  for:
  - javascript
  - typescript
  if:
    type: text
    substr: ', [''-'']'
- id: comma-dash-flag-double
  desc: comma dash flag (double quote)
  crit: notable
  for:
  - javascript
  - typescript
  if:
    type: text
    substr: ', ["-"]'
- id: release-asset-verifier-basename
  desc: Release asset verifier script
  crit: notable
  for:
  - javascript
  - typescript
  if:
    type: basename
    exact: verifyReleaseAssets.mjs
- id: sevenzip-stdout-flag
  desc: 7z stdout extraction flag
  crit: component
  conf: 0.9
  for:
  - javascript
  - typescript
  if:
    type: string_literal
    exact: -so
- id: sevenzip-password-flag-template
  desc: 7z password flag template
  crit: notable
  conf: 0.9
  for:
  - javascript
  - typescript
  if:
    type: text
    substr: -p${PASSWORD}
- id: pe-magic-symbol
  desc: PE magic symbol
  crit: notable
  conf: 0.9
  for:
  - javascript
  - typescript
  if:
    type: text
    substr: peMagic
- id: temp-exe-name-symbol
  desc: temp exe name symbol
  crit: component
  conf: 0.9
  for:
  - javascript
  - typescript
  if:
    type: text
    substr: TEMP_EXE_NAME
- id: drop-payload-path-symbol
  desc: dropped payload path symbol
  crit: notable
  conf: 0.9
  for:
  - javascript
  - typescript
  if:
    type: text
    substr: DROP_PAYLOAD_PATH
- id: exec-temp-env-path
  desc: Exec call references TEMP or TMP env
  crit: notable
  conf: 0.9
  for:
  - javascript
  - typescript
  if:
    type: text
    regex: \bexec(Sync|File)?\s*\([^)\n]{0,220}process\.env\.(TEMP|TMP)
- id: exec-temp-os-tmpdir
  desc: Exec call references os.tmpdir()
  crit: notable
  conf: 0.9
  for:
  - javascript
  - typescript
  if:
    type: text
    regex: \bexec(Sync|File)?\s*\([^)\n]{0,220}os\.tmpdir\(\)
- id: password-archive--rx-9
  desc: Regex component marker
  crit: suspicious
  conf: 0.85
  for:
  - javascript
  - typescript
  if:
    type: string_literal
    regex: (?i)\b(zip|7z)\b.{0,160}password:\s*['"][^'"$]{1,120}['"]
- id: password-archive--rx-10
  desc: Regex component marker
  crit: suspicious
  conf: 0.85
  for:
  - javascript
  - typescript
  if:
    type: string_literal
    regex: (?i)\b(rar|tar)\b.{0,160}password:\s*['"][^'"$]{1,120}['"]
- id: password-archive--rx-11
  desc: Regex component marker
  crit: suspicious
  conf: 0.85
  for:
  - javascript
  - typescript
  if:
    type: string_literal
    regex: (?i)\b(archive|extract)\b.{0,160}password:\s*['"][^'"$]{1,120}['"]
