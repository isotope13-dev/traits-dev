# Obfuscated Node.js Dropper Patterns
# ATT&CK: T1105 (Ingress Tool Transfer) / T1027 (Obfuscated Files or Information)
defaults:
  platforms: [linux, macos, windows, unix, android, ios]
  for: [javascript, typescript]
  mbc: B0024
  attack: T1105
traits:
composite_rules:
  - id: node-exec-dropped-file
    desc: Writes a file to local directory and executes it
    crit: component
    conf: 0.75
    not:
      - regex: "execSync\\s*\\(\\s*`?['\"]?plutil\\s+-convert\\s+xml1"
    all:
      - id: micro-behaviors/fs/write/file/direct::write-file-sync
      - id: micro-behaviors/fs/path/construct::javascript-local-path
    any:
      - id: micro-behaviors/process/create/shell/bridge::js-exec
      - id: micro-behaviors/process/create/shell/bridge::execSync-call
      - id: micro-behaviors/process/create/spawn::spawn-call
    near_lines: 80
    downgrade:
      any:
        - id: metadata/library/prettier
    unless:
      - id: metadata/file/policy/config/xcode::plutil-xml-convert-command
      - id: metadata/file/policy/config/xcode/
  - id: obfuscated-node-dropper
    desc: Highly obfuscated Node.js file dropper and executor
    crit: hostile
    conf: 0.95
    all:
      - id: node-exec-dropped-file
    any:
      - id: micro-behaviors/data/decode/buffer::mixed-buffer-encodings
      - id: objectives/anti-static/obfuscation/payload/encoded::large-hex-string-dup
      - id: metadata/file/encoded::large-base64-like-string
