# The stager half of an npm loader: importing the package is enough to leave a
# hidden background process running.
#
# A published library runs its work when the caller invokes it. This shape does
# the opposite -- module scope calls an initializer, that initializer spawns the
# Node interpreter on a second file with `detached: true`, every stdio stream
# set to `ignore`, and `unref()` so the child outlives the parent. Nothing is
# returned to the importer and nothing is logged, so an application that merely
# added the dependency to package.json now hosts a daemon it never started and
# cannot see. That daemon is where the remote fetch and eval live, which keeps
# the package's own files free of the behavior a reviewer looks for.
#
# Kept separate from micro-behaviors/process/create/spawn::detached-ignored-unref-spawn:
# that atom describes daemonizing, which CLIs and dev servers legitimately do on
# an explicit user command. The objective here is the *import-time* trigger --
# the caller never asked.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  attack: T1059.007
  mbc: B0009

composite_rules:
  - id: import-time-detached-interpreter-daemon
    for: [javascript, typescript, package.json, npm]
    desc: Package contains module-scope detached Node startup
    crit: suspicious
    conf: 0.96
    # Archive scope: the module-scope trigger sits in the package entrypoint
    # while the spawn lives in the initializer it imports, which is the whole
    # point of the split. Both legs stay inside one published package.
    scope: archive
    all:
      # Anchor the archive scope to the archive's OWN published manifest, so
      # "one published package" is enforced rather than assumed. Without it the
      # scope pools every package under a bundled node_modules: Tabby's Electron
      # .deb supplied the three legs from three unrelated dependencies --
      # `direct-zero-arg-call` from glasstron/binding.js,
      # `detached-ignored-unref-spawn` from electron-updater (which detaches to
      # relaunch after an update, by design), and `node-interpreter-target` from
      # winston's *test* helpers -- and was called a hostile import-time daemon.
      - id: metadata/package/files/included::npm-publish-root-manifest
      - id: micro-behaviors/data/control-flow/module-exec::direct-zero-arg-call
      - id: micro-behaviors/process/daemonize/spawn::detached-node-interpreter-child
    unless:
      - id: metadata/package/description/function::description-claude-code-agent-tool
      - id: metadata/package/description/function::description-ai-coding-orchestrator
      - id: micro-behaviors/process/create/launch::node-detached-os-default-handler-spawn
      - id: well-known/app/ai/coding-agent/
      - id: well-known/app/ai/gateway/
      - id: well-known/app/ai/browser-agent/agent-webbridge::archive-context
      - id: micro-behaviors/process/daemonize/background::node-detached-lifecycle-context


  - id: detached-node-interpreter-child
    desc: Module-scope startup spawns a detached Node interpreter
    crit: suspicious
    conf: 0.95
    scope: file
    near_bytes: 2048
    all:
      - id: micro-behaviors/data/control-flow/module-exec::direct-zero-arg-call
      - id: micro-behaviors/process/create/spawn::detached-ignored-unref-spawn
      - id: micro-behaviors/process/create/spawn::node-interpreter-target
    unless:
      - id: metadata/package/testing/
      - id: objectives/supply-chain/trojanized/library/remote-eval::detached-http-response-loader
      - id: objectives/supply-chain/hidden-payload/runtime::pino-clone-obfuscated-lib-config-loader
      - id: micro-behaviors/process/create/spawn::node-spawn-initialize-caller-context
      # A file implementing the agent-hook protocol (reads its JSON event
      # from stdin) is a hook integration whose evaluator spawn is
      # advisory, not a dropper.
      - id: micro-behaviors/process/fd/stdio::stdin-read-or-reference
      # A server daemon with socket listening or PID/log lifecycle files is a
      # managed local service, not a hidden interpreter drop.
      - id: micro-behaviors/process/daemonize/background::node-detached-lifecycle-context
      - id: "metadata/file/naming::test-directory-component"
