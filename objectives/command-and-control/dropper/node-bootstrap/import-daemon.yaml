defaults:
  platforms:
    - unix
    - windows
  for:
    - javascript
    - typescript
  attack: T1059.007
  mbc: B0009
  crit: suspicious
composite_rules:
  - id: import-time-detached-interpreter-daemon
    for:
      - javascript
      - typescript
      - package.json
      - npm
    desc: Package contains a module call and detached Node child
    conf: 0.96
    scope: archive
    all:
      - id: metadata/package/files/included::npm-publish-root-manifest
      - id: micro-behaviors/data/control-flow/module-exec::direct-zero-arg-call
      - id: micro-behaviors/process/daemonize/spawn::detached-node-interpreter-child
  - id: detached-node-interpreter-child
    desc: Module call near detached Node interpreter spawn
    conf: 0.95
    scope: file
    near_bytes: 2048
    all:
      - id: micro-behaviors/data/control-flow/module-exec::direct-zero-arg-call
      - id: metadata/file/profile/execution-api::detached-ignored-unref-spawn
      - id: metadata/file/profile/execution-api::node-interpreter-target
