defaults:
  platforms: [macos]
  for: [javascript, typescript]

composite_rules:
  - id: xcode-white-label-project-context
    desc: React Native White Label Xcode configuration references
    crit: exception
    conf: 0.95
    all:
      - id: well-known/tool/development/mobile/react-native-white-label::react-native-white-label-title
      - id: metadata/file/profile/mobile-config::xcode-scheme-configuration-references
