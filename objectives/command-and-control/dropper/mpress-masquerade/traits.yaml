# MPRESS-packed PE droppers that masquerade as legitimate installers
# and contain hardcoded C2 endpoints in their resource sections.
# Common pattern: Virus.Infector.ATA and similar infector/dropper families.
defaults:
  platforms: [windows]
  for: [pe]
  attack: T1105
  mbc: B0023

composite_rules:
  - id: mpress-masquerade-c2-dropper
    desc: MPRESS-packed masquerading PE with C2 endpoint
    crit: hostile
    conf: 0.96
    all:
      - id: metadata/binary/section/layout::mpress-two-section-layout
      - id: micro-behaviors/communications/ip/endpoint::external-ipv4-port-pe
    any:
      - id: metadata/binary/provenance/version-info::adobe-bootstrapper-versioninfo
    unless:
      - id: metadata/signed/platform/

  # Unsigned MPRESS stubs wear a 360.cn module identity while appending megabytes
  # of certificate-chain padding past the mapped image (zeroed cert checksum,
  # overlay >90%). Real Qihoo components ship Authenticode; this shape is a
  # Farfli-style cert-stuffed carrier, not LSPFix.
  - id: mpress-360-cert-stuffed-dropper
    desc: MPRESS PE mimics 360 tool with cert-stuffed overlay
    crit: hostile
    conf: 0.96
    attack: T1027.002,T1036.005
    size_min: 1048576
    all:
      - id: metadata/binary/section/layout::mpress-two-section-layout
      - id: well-known/app/utility/360-file-guard::360-company-field
      - id: metadata/binary/layout/ratio::overlay-over-90pct
      - id: metadata/binary/layout/checksum::cert-data-zeroed-checksum
      - id: metadata/binary/layout/overlay::large-overlay-1mb
    unless:
      - id: metadata/signed/platform/
      - id: metadata/signed/trust-level::signer-evidence-present
      - id: well-known/app/utility/360-file-guard::360-file-guard-identity

  - id: mpress-cert-stuffed-runtime-unpack-stub
    desc: MPRESS unsigned stub with cert-stuffed overlay and unpack APIs
    crit: hostile
    conf: 0.94
    attack: T1027.002,T1620
    size_min: 1048576
    all:
      - id: metadata/binary/section/layout::mpress-two-section-layout
      - id: metadata/binary/layout/ratio::overlay-over-90pct
      - id: metadata/binary/layout/checksum::cert-data-zeroed-checksum
      - id: micro-behaviors/dylib/lookup::module-export-resolution-imports
      - id: micro-behaviors/mem/protect/modify::virtual-protect
    unless:
      - id: metadata/signed/platform/
      - id: metadata/signed/trust-level::signer-evidence-present
      - id: metadata/binary/installer/family/
