# Payload builders that splice C2 fields into a C++ template and compile
# it with g++ to a Windows EXE. The temp .cpp plus -o .exe is the durable
# shape, not the menu chrome around it.
defaults:
  platforms: [windows]
  for: [python]
  attack: T1027,T1059.003

traits:
  # gpp-temp-exe-compile relocated to
  # micro-behaviors/process/create/compile::gpp-exe-output-command — a g++
  # command line producing an .exe is a neutral compiler invocation.
  - id: creating-payload-banner
    desc: Creating-payload builder status banner
    crit: notable
    conf: 0.92
    if:
      type: text
      substr: CREATING PAYLOAD
  - id: python-windows-h-template
    desc: Python embeds a windows.h C++ template
    crit: notable
    conf: 0.93
    if:
      type: text
      substr: '#include <windows.h>'

composite_rules:
  - id: python-gpp-temp-exe-builder
    desc: Python g++ builder writes a temp EXE
    crit: hostile
    conf: 0.97
    all:
      - id: micro-behaviors/process/create/compile::gpp-exe-output-command
      - id: creating-payload-banner
  - id: python-windows-template-gpp-builder
    desc: windows.h template compiled with g++
    crit: hostile
    conf: 0.96
    all:
      - id: python-windows-h-template
      - id: micro-behaviors/process/create/compile::gpp-exe-output-command
  - id: python-windows-payload-banner-builder
    desc: windows.h template with a payload banner
    crit: hostile
    conf: 0.95
    all:
      - id: python-windows-h-template
      - id: creating-payload-banner
