# Go-based crypter-as-a-service builders. These function names describe a
# complete server-side workflow rather than ordinary compiler or HTTP use.
defaults:
  platforms: [linux, windows]
  for: [elf, pe]
  attack: T1587.001

traits:
  - id: go-staged-upload-handler
    desc: Go staged payload-upload handler
    crit: suspicious
    conf: 0.96
    if:
      type: text
      substr: .StagedUploadHandler

  - id: go-build-staged-stub
    desc: Go code defines a staged loader-stub builder
    crit: suspicious
    conf: 0.97
    if:
      type: text
      substr: .BuildStagedStub

  - id: go-compile-stub
    desc: Go loader-stub compiler function
    crit: suspicious
    conf: 0.96
    if:
      type: text
      substr: .CompileStub

composite_rules:
  - id: go-http-crypter-builder-service
    desc: Go HTTP service encrypts uploads and compiles staged loader stubs
    crit: hostile
    conf: 0.99
    all:
      - id: go-staged-upload-handler
      - id: go-build-staged-stub
      - id: go-compile-stub
      - id: objectives/command-and-control/dropper/staging/encrypted::go-encrypt-payload-function
      - id: micro-behaviors/crypto/symmetric/aes/library::go-cbc-encrypter-string
      - id: micro-behaviors/communications/http/server/listener::listenandservetls-call
