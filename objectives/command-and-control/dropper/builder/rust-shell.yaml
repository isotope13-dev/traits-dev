# Rust dropper builders commonly convert a compiled PE to printable hex, feed
# that material through an encryption step into a Rust byte array, and compile
# a second executable whose own build path is explicitly named "dropper".
defaults:
  platforms: [unix]
  for: [shell]
  attack: T1587.001

traits:
  - id: release-dropper-executable-path
    desc: References release-built dropper executable
    crit: suspicious
    conf: 0.98
    if:
      type: text
      regex: '(?i)target/\S{1,100}/release/dropper\.exe'

  - id: documented-hex-encryption-to-rust-array
    desc: Script documents encrypting hex into Rust array
    crit: suspicious
    conf: 0.95
    if:
      type: text
      regex: '(?is)encrypt(ing)?.{0,40}hex.{0,40}Rust array'

composite_rules:
  - id: rust-encrypted-dropper-builder
    desc: Builds Rust dropper around encrypted executable
    crit: hostile
    conf: 0.99
    all:
      - id: release-dropper-executable-path
      - id: documented-hex-encryption-to-rust-array
      - id: micro-behaviors/data/encode/hex::hex-encode-xxd
      - id: micro-behaviors/process/create/compile::cargo-build-command
