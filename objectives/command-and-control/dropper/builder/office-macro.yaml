# VBA payload-decoder template emission by macro-building tools. Scripting
# sources that embed a decoder routine plus ADODB stream machinery are
# assembling the classic macro dropper: decode an embedded base64 payload and
# write it to disk when the document opens.
defaults:
  platforms: [windows]
  for: [oledoc, ooxml, scripts]
  attack: T1587.001,T1204.002
  mbc: B0023

traits:
  - id: embedded-vba-payload-decoder
    desc: Embeds a VBA base64 payload-decoder template
    crit: notable
    conf: 0.85
    if:
      type: text
      regex: '(?i)\b(decodeBase64|bin\.base64)\b'

  # ShellExecute handed a .csproj path launches msbuild.exe on it (Trusted
  # Developer Utilities Proxy Execution). Build automation invokes MSBuild
  # directly; a document macro executing a build project is the LOLBin form.
  # The project path is usually staged in a variable first, so either order.
  - id: macro-shellexecute-csproj-exec
    desc: Macro ShellExecutes a .csproj build project
    crit: notable
    conf: 0.9
    attack: T1127.001
    if:
      type: text
      regex: '(?i)ShellExecute[\s\S]{0,400}\.csproj|\.csproj[\s\S]{0,400}ShellExecute'

composite_rules:
  - id: vba-macro-dropper-builder
    desc: Builds an auto-open VBA macro that decodes and drops a payload
    crit: hostile
    conf: 0.96
    all:
      - id: micro-behaviors/process/create/macro/autoexec::auto-open-sub-decl
      - id: embedded-vba-payload-decoder
      - id: micro-behaviors/fs/write/stream::adodb-stream-progid

  - id: vba-macro-msbuild-lolbin-exec
    desc: Auto-open macro executes a .csproj via ShellExecute
    crit: hostile
    conf: 0.95
    attack: T1127.001,T1204.002
    all:
      - id: micro-behaviors/process/create/macro/autoexec::auto-open-sub-decl
      - id: macro-shellexecute-csproj-exec
    near_bytes: 4000
