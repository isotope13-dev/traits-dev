# LNK file-on-disk execution patterns from Unit 42: the shortcut itself is
# a launcher for a nearby or user-directory payload, often with a lure-like
# filename or a script host executing data under a non-script extension.
defaults:
  platforms: [windows]
  for: [lnk]
  attack: T1204.002
traits:
  - id: lnk-target-desktop-ini-exe
    desc: LNK targets desktop.ini.exe
    crit: suspicious
    conf: 0.96
    if:
      type: value
      path: lnk.target_path
      regex: '(?i)(^|[\\/])desktop\.ini\.exe$'
  - id: lnk-target-downloads-exe
    desc: LNK targets executable in user Downloads
    crit: suspicious
    conf: 0.88
    if:
      type: value
      path: lnk.target_path
      regex: '(?i)\\Users\\[^\\]+\\Downloads\\[^\\]+\.exe$'
  - id: lnk-args-data-extension
    desc: LNK arguments reference data extension
    crit: suspicious
    conf: 0.9
    if:
      type: value
      path: lnk.arguments
      regex: '(?i)\S+\.(3gp|txt|log|dat)\b'
  - id: lnk-args-media-extension
    desc: LNK arguments reference media extension
    crit: suspicious
    conf: 0.88
    if:
      type: value
      path: lnk.arguments
      regex: '(?i)\S+\.(jpg|jpeg|png)\b'
  - id: lnk-args-document-extension
    desc: LNK arguments reference document extension
    crit: suspicious
    conf: 0.88
    if:
      type: value
      path: lnk.arguments
      regex: '(?i)\S+\.(pdf|docx?|xlsx?)\b'
  # Notable rather than component: a shortcut that names a `.log`, `.dat` or
  # `.3gp` is a clear fact, not a fragment. Double-clicking one opens nothing
  # useful, so the shell has little reason to have written it -- unlike the
  # `.pdf`/`.docx` shortcuts Recent Documents is full of, which is why the
  # document sibling below stays a component.
  - id: lnk-relative-data-extension
    desc: LNK relative path uses data extension
    crit: notable
    conf: 0.85
    if:
      type: value
      path: lnk.relative_path
      regex: '(?i)\.(3gp|txt|log|dat)$'
  - id: lnk-relative-media-extension
    desc: LNK relative path uses media extension
    crit: component
    conf: 0.85
    if:
      type: value
      path: lnk.relative_path
      regex: '(?i)\.(jpg|jpeg|png)$'
  - id: lnk-relative-document-extension
    desc: LNK relative path uses document extension
    crit: component
    conf: 0.85
    if:
      type: value
      path: lnk.relative_path
      regex: '(?i)\.(pdf|docx?|xlsx?)$'
  - id: lnk-relative-user-staging-dir
    desc: LNK relative path enters user staging dir
    crit: component
    conf: 0.88
    if:
      type: value
      path: lnk.relative_path
      regex: '(?i)[\\/](Desktop|Downloads|Local[\\/]Temp)[\\/]'
  - id: lnk-target-user-staging-exe
    desc: LNK target is user-staging EXE
    crit: suspicious
    conf: 0.92
    if:
      type: value
      path: lnk.target_path
      regex: '(?i)\\Users\\[^\\]+\\(Downloads|AppData\\Local\\Temp)\\[^\\]+\.exe$'
  # The archive-delivery shape. A shortcut whose relative target is `.\name.exe`
  # resolves against its own directory, which is what makes it work inside a zip:
  # the victim extracts two files, sees one, and runs the other. A shortcut
  # Windows made for an installed program points somewhere on the machine, not
  # at its own neighbour.
  - id: lnk-relative-sibling-executable
    desc: LNK targets an executable beside itself
    crit: notable
    conf: 0.92
    if:
      type: value
      path: lnk.relative_path
      regex: '(?i)^\.[\\/][^\\/]{1,60}\.(exe|scr|com|pif|bat|cmd)$'

  # `D:\ico`, `E:\faq` -- a one-word directory on a non-system drive, left in
  # the shortcut because that is where the builder assembled the payload. A
  # shortcut a user made points at a path that exists on the user's machine;
  # this one preserves the author's.
  - id: lnk-workingdir-builder-staging-dir
    desc: LNK working dir is a staging dir
    crit: notable
    conf: 0.85
    if:
      type: value
      path: lnk.working_directory
      regex: '(?i)^[D-Z]:\\[a-z0-9]{1,8}\\?$'

  # A screensaver is a PE with a different extension, and Windows runs it the
  # same way. Nothing ships a `.scr` any more except a program that wants the
  # word "exe" not to appear.
  - id: lnk-screensaver-target
    desc: LNK target is a screensaver executable
    crit: suspicious
    conf: 0.93
    if:
      type: value
      path: lnk.relative_path
      regex: '(?i)\.scr$'

  # An executable in the root of a drive. Installers write to Program Files,
  # users to their profile; nothing legitimate puts a program at `C:\boot.exe`
  # and then points a shortcut at it.
  - id: lnk-drive-root-executable-target
    desc: LNK target is a drive-root executable
    crit: suspicious
    conf: 0.9
    if:
      type: value
      path: lnk.target_path
      regex: '(?i)^[A-Z]:\\[^\\]{1,40}\.(exe|scr|com|pif)$'

  # "Random" was a claim the matcher did not make: the old pattern was purely
  # a length test, so `SteamTools.exe`, `MongoDBCompass.exe` and
  # `GoogleChromePortable.exe` all read as random-named and were reported
  # suspicious. A generated name is long *and* carries digits -- a sha256
  # stem, `0ClbVtSDR9RrPjA`, `g5SGtNOXYDJqACG` -- where a product name
  # almost never does. The two alternatives place the digit anywhere in a
  # twelve-character-or-longer stem, which is the closest a regex gets to the
  # question without a lookahead.
  #
  # Notable, not suspicious: `vcredist2019x64.exe` satisfies this too. The
  # hostile composites below add where the file sits, which is what makes the
  # name mean something.
  # The complement to the digit test below. `is: random_like` scores a whole
  # value against an English bigram model, so it only answers usefully when the
  # value *is* the name -- a sibling path, `.\name.exe`, is that; a path with
  # `..\Downloads\` in front of it is not, and the surrounding words pull the
  # score back to plausible. So the model is used where it applies and the
  # digit-and-length pattern covers the rest.
  - id: lnk-relative-random-like-sibling-exe
    desc: LNK sibling EXE name looks generated
    crit: notable
    conf: 0.9
    if:
      type: value
      path: lnk.relative_path
      is: random_like

  - id: lnk-relative-random-sibling-exe
    desc: LNK targets long alnum sibling EXE
    crit: notable
    conf: 0.9
    if:
      type: value
      path: lnk.relative_path
      regex: '(?i)^\.[\\/]([a-z0-9]{11,}[0-9][a-z0-9]*|[a-z0-9]*[0-9][a-z0-9]{11,})\.exe$'
  # A shortcut whose working directory is the root of a drive. Installed
  # programs run from their own folder and user files from a profile; a
  # shortcut that sets `C:\\` as the working directory is pointing at
  # something dropped where nothing is supposed to live.
  - id: lnk-workingdir-drive-root
    desc: LNK working directory is a drive root
    crit: notable
    conf: 0.88
    if:
      type: value
      path: lnk.working_directory
      regex: '(?i)^[A-Z]:\\?$'

  - id: lnk-workingdir-user-desktop
    desc: LNK working directory is user Desktop
    crit: notable
    conf: 0.84
    if:
      type: value
      path: lnk.working_directory
      regex: '(?i)^C:\\Users\\[^\\]+\\Desktop$'
  - id: lnk-workingdir-user-downloads
    desc: LNK working directory is user Downloads
    crit: notable
    conf: 0.84
    if:
      type: value
      path: lnk.working_directory
      regex: '(?i)^C:\\Users\\[^\\]+\\Downloads$'
  - id: lnk-relative-downloads-exe
    desc: LNK relative path is Downloads EXE
    crit: suspicious
    conf: 0.9
    if:
      type: value
      path: lnk.relative_path
      regex: '(?i)[\\/]Downloads[\\/][^\\/]+\.exe$'
  # Same correction as the sibling form above: length alone convicted product
  # names, so the stem must now also carry a digit.
  - id: lnk-relative-random-named-exe
    desc: LNK relative path is long alnum EXE
    crit: notable
    conf: 0.9
    if:
      type: value
      path: lnk.relative_path
      regex: '(?i)[\\/]([a-z0-9]{11,}[0-9][a-z0-9]*|[a-z0-9]*[0-9][a-z0-9]{11,})\.exe$'
  - id: lnk-relative-data-extension-exe
    desc: LNK targets data-extension EXE
    crit: suspicious
    conf: 0.94
    if:
      type: value
      path: lnk.relative_path
      regex: '(?i)\.(csv|etl|mst)\.exe$'
  - id: lnk-relative-config-extension-exe
    desc: LNK targets config-extension EXE
    crit: suspicious
    conf: 0.94
    if:
      type: value
      path: lnk.relative_path
      regex: '(?i)\.(inf|ini|xml)\.exe$'
  - id: lnk-relative-log-extension-exe
    desc: LNK targets log-extension EXE
    crit: suspicious
    conf: 0.94
    if:
      type: value
      path: lnk.relative_path
      regex: '(?i)\.log\.exe$'
  - id: lnk-relative-installer-extension-exe
    desc: LNK targets installer-extension EXE
    crit: suspicious
    conf: 0.94
    if:
      type: value
      path: lnk.relative_path
      regex: '(?i)\.(msp|msi|exe)\.exe$'
  - id: lnk-relative-installer-copy-payload
    desc: LNK targets installer copy payload
    crit: suspicious
    conf: 0.92
    if:
      type: value
      path: lnk.relative_path
      regex: '(?i)\.(msi|mst)-copy$'
  - id: lnk-relative-config-copy-payload
    desc: LNK targets config copy payload
    crit: suspicious
    conf: 0.92
    if:
      type: value
      path: lnk.relative_path
      regex: '(?i)\.(ini|xml)-copy$'
  - id: lnk-relative-log-copy-payload
    desc: LNK targets log copy payload
    crit: suspicious
    conf: 0.92
    if:
      type: value
      path: lnk.relative_path
      regex: '(?i)\.(log|etl)-copy$'
  - id: lnk-relative-virus-payload
    desc: LNK targets virus-extension payload
    crit: suspicious
    conf: 0.92
    if:
      type: value
      path: lnk.relative_path
      regex: '(?i)\.virus$'
  - id: lnk-relative-temp-short-name
    desc: LNK targets short Temp payload name
    crit: component
    conf: 0.84
    if:
      type: value
      path: lnk.relative_path
      regex: '(?i)[\\/]Local[\\/]Temp[\\/][^\\/.]{1,3}$'
  - id: lnk-target-local-temp-path
    desc: LNK target path is Local Temp
    crit: notable
    conf: 0.86
    if:
      type: value
      path: lnk.target_path
      regex: '(?i)^Local[\\/]Temp[\\/]'
  - id: lnk-text-local-temp-path
    desc: LNK text contains Local Temp path
    crit: component
    conf: 0.84
    if:
      type: text
      regex: '(?i)Local.{0,80}Temp'
  - id: lnk-target-roaming-exe-path
    desc: LNK target path is Roaming EXE
    crit: notable
    conf: 0.86
    if:
      type: value
      path: lnk.target_path
      regex: '(?i)^Roaming[\\/][^\\/]+[\\/][^\\/]+\.exe$'
  - id: lnk-arg-calc-command
    desc: LNK argument invokes calculator
    crit: suspicious
    conf: 0.88
    if:
      type: value
      path: lnk.arguments
      regex: '(?i)(^|\s)-c\s+calc\b'
  - id: lnk-text-powershell-system32
    desc: LNK text references System32 PowerShell
    crit: notable
    conf: 0.86
    if:
      type: text
      regex: '(?i)WindowsPowerShell\\\\v1\.0\\\\powershell\.exe|powershell\.exe'
  - id: lnk-text-hta-url-concat
    desc: LNK text builds HTA URL
    crit: suspicious
    conf: 0.92
    if:
      type: text
      regex: '(?i)https?://[^/\n]{1,160}''\s*\+\s*''\.h''\s*\+\s*''ta''|https?://\S{1,180}\.hta\b'
composite_rules:
  - id: lnk-downloads-desktop-ini-exe
    desc: LNK executes desktop.ini.exe from Downloads
    crit: hostile
    conf: 0.97
    all:
      - id: lnk-target-desktop-ini-exe
      - id: lnk-target-downloads-exe
  - id: lnk-script-host-nonscript-input
    desc: LNK script host runs non-script extension input
    crit: hostile
    conf: 0.96
    attack: T1059.005
    all:
      - id: micro-behaviors/process/create/shortcut::lnk-script-host-target
    any:
      - id: lnk-args-data-extension
      - id: lnk-args-media-extension
      - id: lnk-args-document-extension
  - id: lnk-document-lure-script-host
    desc: Document-named LNK launches a script host
    crit: hostile
    conf: 0.97
    attack: T1059.005,T1204.002
    all:
      - id: micro-behaviors/process/create/shortcut::lnk-script-host-target
      - id: objectives/evasion/masquerade/extension/double::lnk-name-pdf-double
      - id: micro-behaviors/process/create/shortcut::lnk-has-arguments
  - id: lnk-relative-lure-script-host
    desc: LNK script host uses lure-like relative path
    crit: suspicious
    conf: 0.94
    all:
      - id: micro-behaviors/process/create/shortcut::lnk-script-host-target
    any:
      - id: lnk-relative-data-extension
      - id: lnk-relative-media-extension
      - id: lnk-relative-document-extension
  - id: lnk-relative-double-extension-exe
    desc: LNK targets double-extension EXE
    crit: suspicious
    conf: 0.94
    any:
      - id: lnk-relative-data-extension-exe
      - id: lnk-relative-config-extension-exe
      - id: lnk-relative-log-extension-exe
      - id: lnk-relative-installer-extension-exe
  - id: lnk-relative-copy-payload
    desc: LNK targets copied payload extension
    crit: suspicious
    conf: 0.92
    any:
      - id: lnk-relative-installer-copy-payload
      - id: lnk-relative-config-copy-payload
      - id: lnk-relative-log-copy-payload
  - id: lnk-masqueraded-payload-shortcut
    desc: LNK launches masqueraded local payload
    crit: hostile
    conf: 0.96
    all:
      - id: micro-behaviors/fs/traversal/parent::lnk-relative-deep-parent-chain
      - id: lnk-relative-user-staging-dir
    any:
      - id: lnk-relative-double-extension-exe
      - id: lnk-relative-copy-payload
      - id: lnk-relative-virus-payload
      - id: lnk-relative-temp-short-name
    needs: 1
  - id: lnk-userdir-exe-shortcut
    desc: LNK launches user-directory EXE
    crit: suspicious
    conf: 0.91
    all:
      - id: micro-behaviors/fs/traversal/parent::lnk-relative-deep-parent-chain
      - id: lnk-target-user-staging-exe
    unless:
      - id: well-known/app/storage/peazip::peazip-shortcut-target
  - id: lnk-desktop-random-exe-shortcut
    desc: LNK launches random sibling EXE from Desktop
    crit: hostile
    conf: 0.94
    all:
      - id: lnk-workingdir-user-desktop
    needs: 1
    any:
      - id: lnk-relative-random-sibling-exe
      - id: lnk-relative-random-like-sibling-exe
  - id: lnk-downloads-random-exe-shortcut
    desc: LNK launches random EXE from Downloads
    crit: hostile
    conf: 0.94
    all:
      - id: lnk-workingdir-user-downloads
      - id: lnk-relative-random-named-exe
      - id: lnk-relative-downloads-exe
  - id: lnk-local-temp-payload-shortcut
    desc: LNK launches Local Temp payload
    crit: suspicious
    conf: 0.91
    all:
      - id: micro-behaviors/fs/traversal/parent::lnk-relative-deep-parent-chain
    any:
      - id: lnk-target-local-temp-path
      - id: lnk-text-local-temp-path
    needs: 1
  - id: lnk-roaming-exe-payload
    desc: LNK launches Roaming EXE payload
    crit: suspicious
    conf: 0.91
    all:
      - id: micro-behaviors/fs/traversal/parent::lnk-relative-deep-parent-chain
      - id: lnk-target-roaming-exe-path
  - id: lnk-powershell-hta-command-text
    desc: LNK contains PowerShell HTA downloader
    crit: hostile
    conf: 0.95
    all:
      - id: lnk-text-powershell-system32
      - id: lnk-text-hta-url-concat
  - id: lnk-root-dll-update-lure
    desc: LNK targets volume-root dll.dll payload
    crit: hostile
    conf: 0.97
    attack: T1204.002,T1036.005
    all:
      - id: micro-behaviors/fs/traversal/parent::utf16-drive-root-dll
      - id: objectives/evasion/masquerade/identity/mimicry::french-auto-update-lure

  # A shortcut chain wearing a data file's name. The relative path says the
  # victim is opening `FRUNLOG.TXT`; the target is a second `.lnk`, which the
  # shell will follow to somewhere neither name mentions. Three claims that
  # cannot all be true of an honest shortcut: it points at a shortcut, its own
  # relative path names a text or log file, and the two disagree.
  - id: lnk-chained-shortcut-data-lure
    desc: Data-named shortcut chains to another shortcut
    crit: hostile
    conf: 0.95
    attack: T1204.002,T1036.008
    all:
      - id: metadata/file/format/structured::lnk-target-is-a-shortcut
      - id: lnk-relative-data-extension

  # Both halves of "the payload was dropped at the top of the drive": the
  # target is an executable sitting in the volume root, and the shortcut runs
  # it from there. Nothing installs to `C:\\`, so a shortcut built to launch
  # something that lives there was written by whatever put it there.
  - id: lnk-drive-root-payload-shortcut
    desc: Shortcut runs an executable from a drive root
    crit: hostile
    conf: 0.94
    all:
      - id: lnk-drive-root-executable-target
      - id: lnk-workingdir-drive-root

