defaults:
  platforms: [windows]
  for: [lnk]

traits:
  # The sibling above reads `lnk.arguments`. These two read the other two
  # places a shortcut can name a remote host, neither of which any trait
  # touched: the expandable-environment-string block, and the parsed network
  # share. A shortcut whose *target* is a UNC path resolves on open -- Windows
  # authenticates to the host before the user does anything -- so an IP there
  # is a forced-authentication or remote-payload primitive, not a file path.
  #
  # RFC1918 and loopback are excluded here (unlike the argument sibling): a
  # shortcut to `\\10.x` or `\\192.168.x` is what an ordinary corporate file
  # share looks like. A routable address is not.
  - id: unc-ipv4-environment-target
    desc: Shortcut environment target is an IP UNC
    crit: suspicious
    conf: 0.93
    attack: T1021.002
    if:
      type: value
      path: lnk.environment_target
      regex: '^\\\\[0-9]{1,3}(\.[0-9]{1,3}){3}'
    not:
      - regex: '^\\\\(10|127|0)\.'
      - regex: '^\\\\192\.168\.'
      - regex: '^\\\\172\.(1[6-9]|2[0-9]|3[01])\.'
  - id: unc-ipv4-network-share
    desc: Shortcut network share is an IP UNC
    crit: suspicious
    conf: 0.93
    attack: T1021.002
    if:
      type: value
      path: lnk.network.share
      regex: '^\\\\[0-9]{1,3}(\.[0-9]{1,3}){3}'
    not:
      - regex: '^\\\\(10|127|0)\.'
      - regex: '^\\\\192\.168\.'
      - regex: '^\\\\172\.(1[6-9]|2[0-9]|3[01])\.'
  - id: unc-ipv4-share-argument
    desc: LNK argument uses an IPv4 UNC share
    crit: suspicious
    conf: 0.95
    attack: T1021.002
    if:
      type: value
      path: lnk.arguments
      regex: '(?i)\\\\[0-9]{1,3}(\.[0-9]{1,3}){3}\\'
  - id: unc-executable-argument
    desc: LNK argument launches an UNC executable
    crit: suspicious
    conf: 0.97
    attack: T1021.002
    if:
      type: value
      path: lnk.arguments
      regex: '(?i)\\\\[0-9]{1,3}(\.[0-9]{1,3}){3}\\[^"&\r\n]{1,240}\.exe\b'
  - id: unc-launch-chain
    desc: LNK chains launches from multiple UNC shares
    crit: suspicious
    conf: 0.98
    attack: T1021.002
    if:
      type: value
      path: lnk.arguments
      regex: '(?i)\\\\\d{1,3}(\.\d{1,3}){3}\\[^&]*&\s*start\b[^&]*\\\\\d{1,3}(\.\d{1,3}){3}\\'

composite_rules:
  - id: cmd-remote-executable-launch
    desc: Minimized cmd launches an executable from a UNC share
    crit: hostile
    conf: 0.99
    attack: T1021.002,T1202
    all:
      - id: objectives/execution/lnk/proxy::command-c-argument
      - id: micro-behaviors/process/create/shortcut::lnk-cmd-target
      - id: micro-behaviors/process/create/shortcut::lnk-minimized-window
      - id: unc-executable-argument
  - id: cmd-remote-share-launch-chain
    desc: Cmd LNK chains launches from remote shares
    crit: hostile
    conf: 0.99
    attack: T1021.002,T1202
    all:
      - id: objectives/execution/lnk/proxy::command-c-argument
      - id: micro-behaviors/process/create/shortcut::lnk-cmd-target
      - id: unc-launch-chain
