# LNK arguments that build and chain script payloads — the canonical
# pattern is "echo <script> > %TEMP%\X.vbs && cscript //b %TEMP%\X.vbs
# && powershell -ExecutionPolicy Bypass -W Hidden -File ...". Each
# stage individually is interesting; chained inside a .lnk's
# argument field they are essentially never legitimate.
defaults:
  platforms: [windows]
  for: [lnk]
  attack: T1059.005
  mbc: F0007
traits:
  - id: lnk-arg-echo-redirect
    desc: LNK arg echoes content to temp file
    crit: suspicious
    conf: 0.93
    if:
      type: value
      path: lnk.arguments
      regex: '\becho\b[^"\n]{0,400}>\s*%TEMP%'
      case_insensitive: true
  - id: lnk-arg-cscript-batch
    desc: LNK arg invokes cscript //b
    crit: suspicious
    conf: 0.95
    if:
      type: value
      path: lnk.arguments
      regex: 'cscript\s+(//[Bb]|/b)\b'
  - id: lnk-arg-wscript-batch
    desc: LNK arg invokes wscript //b
    crit: suspicious
    conf: 0.95
    if:
      type: value
      path: lnk.arguments
      regex: 'wscript\s+(//[Bb]|/b)\b'
  - id: lnk-arg-temp-script-drop-ps
    desc: LNK arg drops .ps1/.vbs/.js to TEMP
    crit: suspicious
    conf: 0.95
    if:
      type: value
      path: lnk.arguments
      regex: '%TEMP%\\\\?\S{1,40}\.(ps1|vbs|js)'
      case_insensitive: true
  - id: lnk-arg-script-chain-amp
    desc: LNK arg chains commands with &&
    crit: suspicious
    conf: 0.85
    if:
      type: value
      path: lnk.arguments
      regex: '&&\s*\S{0,20}\s*&&'
  - id: lnk-arg-self-delete-script
    desc: LNK arg deletes dropped script after use
    crit: suspicious
    conf: 0.93
    if:
      type: value
      path: lnk.arguments
      regex: '\bdel\s+\S{0,40}%TEMP%\\\\?\S{1,40}\.(vbs|ps1|js)'
      case_insensitive: true
  - id: lnk-arg-self-delete-bat
    desc: LNK arg deletes dropped batch after use
    crit: suspicious
    conf: 0.93
    if:
      type: value
      path: lnk.arguments
      regex: '\bdel\s+\S{0,40}%TEMP%\\\\?\S{1,40}\.(bat|cmd|hta)'
      case_insensitive: true
  - id: lnk-arg-cmd-c-txt
    desc: LNK arg runs .txt via cmd /c
    crit: suspicious
    conf: 0.97
    if:
      type: value
      path: lnk.arguments
      regex: '\bcmd(\.exe)?\s+/c\s+\S{1,80}\.(txt|log|dat)'
      case_insensitive: true
  - id: lnk-arg-cmd-c-doc
    desc: LNK arg runs document via cmd /c
    crit: suspicious
    conf: 0.97
    if:
      type: value
      path: lnk.arguments
      regex: '\bcmd(\.exe)?\s+/c\s+\S{1,80}\.(docx?|pdf)'
      case_insensitive: true
  - id: lnk-arg-delayed-expansion-assembled-names
    desc: LNK arg builds command names from variables
    crit: suspicious
    conf: 0.94
    if:
      type: value
      path: lnk.arguments
      regex: '/v:on\s+/c\s+"?set\s+\w+=\w{1,8}&set\s+\w+=\w{1,8}'
      case_insensitive: true
  - id: lnk-arg-fetch-to-temp
    desc: LNK arg downloads a URL into TEMP
    crit: suspicious
    conf: 0.94
    if:
      type: value
      path: lnk.arguments
      regex: '\s-[a-z]{0,4}o\s+%TEMP%\\?\S{1,40}\s+https?://'
      case_insensitive: true
  - id: lnk-arg-script-engine-switch-temp
    desc: LNK runs TEMP file in script host
    crit: suspicious
    conf: 0.95
    if:
      type: value
      path: lnk.arguments
      regex: '//E:\S{1,24}\s+//B\s+%TEMP%'
      case_insensitive: true
composite_rules:
  # A shortcut that runs a batch file through cmd with a minimized window,
  # where the batch stage launches the next script stage minimized with
  # variable-supplied arguments, is a staged delivery chain (the classic
  # disk-image LNK -> CMD -> payload layout), not an application shortcut.
  - id: lnk-minimized-batch-stage-chain
    desc: Shortcut chains minimized batch stages
    crit: hostile
    conf: 0.96
    scope: outer
    for: [lnk, batch, vhd]
    all:
      - id: micro-behaviors/process/create/shortcut::lnk-cmd-with-args
      - id: micro-behaviors/process/argument/file::lnk-batch-file-argument
      - id: micro-behaviors/process/create/shortcut::minimized-interpreter-window
      - id: metadata/lang/source/syntax/command::start-variable-command-text
  - id: lnk-extension-mismatch-execution
    desc: LNK invokes data-extension path through cmd
    crit: suspicious
    conf: 0.97
    any:
      - id: lnk-arg-cmd-c-txt
      - id: lnk-arg-cmd-c-doc
