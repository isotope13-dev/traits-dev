defaults:
  platforms:
  - windows
  for:
  - lnk
  attack: T1071.001
  mbc: B0030
traits:
- id: lnk-arg-fake-useragent
  desc: LNK arg sets fake UA WindowsPowerShell
  crit: suspicious
  conf: 0.97
  if:
    type: value
    path: lnk.arguments
    regex: User-Agent[^"]{0,80}UA\s+WindowsPowerShell
    case_insensitive: true
- id: lnk-arg-set-useragent
  desc: LNK arg sets HTTP User-Agent
  crit: suspicious
  conf: 0.92
  if:
    type: value
    path: lnk.arguments
    regex: setRequestHeader[^"]{0,40}User-Agent
    case_insensitive: true
