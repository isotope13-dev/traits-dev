defaults:
  platforms:
  - windows
  for:
  - lnk
  attack: T1071.001
  mbc: B0030
traits:
- id: lnk-arg-fake-useragent
  desc: LNK arg sets fake UA WindowsPowerShell
  crit: suspicious
  conf: 0.97
  if:
    type: value
    path: lnk.arguments
    regex: User-Agent[^"]{0,80}UA\s+WindowsPowerShell
    case_insensitive: true
- id: lnk-arg-set-useragent
  desc: LNK arg sets HTTP User-Agent
  crit: suspicious
  conf: 0.92
  if:
    type: value
    path: lnk.arguments
    regex: setRequestHeader[^"]{0,40}User-Agent
    case_insensitive: true
composite_rules:
  # A shortcut that boots PowerShell hidden, fetches a remote string over
  # HTTP(S), and runs it through a constructed ScriptBlock is a staged
  # downloader. Each leg is dual-use on its own, but no benign shortcut
  # combines all four: hidden execution, a network fetch, a code-construction
  # primitive, and the URL it pulls from.
  - id: lnk-powershell-download-scriptblock-exec
    desc: Hidden shortcut runs a ScriptBlock over downloaded content
    crit: hostile
    conf: 0.96
    attack: T1059.001,T1105,T1204.002
    all:
      - id: micro-behaviors/process/create/shortcut::minimized-interpreter-window
      - id: micro-behaviors/metaprogramming/generation::lnk-powershell-scriptblock-constructor
      - id: micro-behaviors/process/create/shortcut::lnk-dotnet-string-fetch
    any:
      - id: micro-behaviors/communications/http/url/scheme::lnk-https-argument
      - id: micro-behaviors/communications/http/url/scheme::lnk-http-url-reference
