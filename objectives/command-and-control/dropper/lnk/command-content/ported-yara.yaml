# LNK Detection Rules (Ported from YARA)
# Sources:
#   - RustyNoob-619/SUS_WIN_LNK_Downloader_Network_Parameters_Mar25
#   - RustyNoob-619/Actor_APT_DPRK_Konni_MAL_WIN_LNK__Mar25
#   - bartblaze/LNK_Ruleset.yar
#
# ATT&CK: T1204.002 (User Execution: Malicious File)
defaults:
  platforms: [windows]
  attack: "T1204.002"
  for: [lnk]
traits:
  # === PowerShell indicators (from PS_in_LNK) ===
- id: lnk-invoke-expression
  desc: LNK PowerShell invokes an expression
  crit: suspicious
  conf: 0.92
  if:
    type: value
    path: lnk.arguments
    regex: '(?i)\bInvoke-Expression\b'
- id: lnk-base64-convert
  desc: LNK PowerShell decodes Base64
  crit: suspicious
  conf: 0.94
  if:
    type: value
    path: lnk.arguments
    regex: '(?i)\bFromBase64String\s*\(|\[Convert\]::FromBase64String\b'
- id: lnk-exec-bypass-flags
  desc: LNK contains execution bypass flags
  crit: suspicious
  conf: 0.85
  if:
    type: text
    regex: '(-exec|-nop|-noni)'
    case_insensitive: true
- id: lnk-certutil-decode
  desc: LNK invokes certutil to decode a file
  crit: suspicious
  conf: 0.94
  attack: T1140
  if:
    type: text
    regex: '(?i)\bcertutil(\.exe)?\s+-decode\b'
- id: lnk-hidden-window-flag
  desc: LNK PowerShell hides its window
  crit: suspicious
  conf: 0.92
  if:
    type: value
    path: lnk.arguments
    regex: '(?i)(^|\s)-(WindowStyle|w)\s+Hidden\b'
- id: lnk-encoded-command-flag
  desc: LNK contains -enc or -decode flag
  crit: suspicious
  conf: 0.85
  if:
    type: text
    regex: '(-enc|-decode)'
    case_insensitive: true
      # === Script indicators (from Script_in_LNK) ===
- id: lnk-javascript-ref
  desc: LNK references JavaScript
  crit: suspicious
  conf: 0.85
  if:
    type: text
    substr: 'javascript'
    case_insensitive: true
- id: lnk-script-ext-wsh
  desc: LNK references .wsh/.wsf/.sct extension
  crit: suspicious
  conf: 0.8
  if:
    type: text
    regex: '\.(wsh|wsf|sct)\b'
    case_insensitive: true
- id: lnk-hta-extension
  desc: LNK references .hta extension
  crit: suspicious
  conf: 0.85
  if:
    type: text
    regex: '\.hta\b'
    case_insensitive: true
      # === Embedded executable (from EXE_in_LNK) ===
- id: lnk-embedded-mz
  desc: LNK contains embedded PE header (base64)
  crit: suspicious
  conf: 0.95
  if:
    type: text
    substr: 'TVqQAA'
      # === Archive indicators (from Archive_in_LNK) ===
      # Note: Generic archive extension patterns removed - covered by micro-behaviors
- id: lnk-cmd-echo
  desc: LNK uses cmd /c echo pattern
  crit: suspicious
  conf: 0.85
  if:
    type: text
    regex: '/c\s+echo'
    case_insensitive: true
- id: lnk-cmd-start
  desc: LNK uses cmd /c start pattern
  crit: suspicious
  conf: 0.85
  if:
    type: text
    regex: '/c\s+start'
    case_insensitive: true
- id: lnk-cmd-set
  desc: LNK uses cmd /c set pattern
  crit: suspicious
  conf: 0.8
  if:
    type: text
    regex: '/c\s+set'
    case_insensitive: true
- id: lnk-assembly-load
  desc: LNK contains Assembly.Load reflection
  crit: suspicious
  conf: 0.9
  if:
    type: text
    regex: 'Assembly\.Load'
    case_insensitive: true
- id: lnk-reflection-assembly
  desc: LNK contains Reflection.Assembly load
  crit: suspicious
  conf: 0.9
  if:
    type: text
    regex: '\[Reflection\.Assembly\]'
    case_insensitive: true
- id: lnk-wmi-process
  desc: LNK uses WMI process call
  crit: suspicious
  conf: 0.9
  if:
    type: text
    regex: 'process\s+call'
    case_insensitive: true
      # === Download indicators (from Download_in_LNK) ===
- id: lnk-serverxmlhttp
  desc: LNK uses ServerXMLHTTP
  crit: suspicious
  conf: 0.9
  if:
    type: text
    substr: 'ServerXMLHTTP'
    case_insensitive: true
- id: lnk-ftp-reference
  desc: LNK contains FTP reference
  crit: suspicious
  conf: 0.75
  if:
    type: text
    regex: '\bftp://'
    case_insensitive: true
      # === CDN abuse patterns removed - covered by micro-behaviors/communications ===
      # === SMB paths (from SMB_in_LNK) ===
- id: lnk-smb-share
  desc: LNK references SMB admin share
  crit: suspicious
  conf: 0.9
  if:
    type: text
    regex: '\\\\c\$\\\\'
    case_insensitive: true
      # === WebDAV (from WebDAV_in_LNK) ===
- id: lnk-webdav-path
  desc: LNK references WebDAV path
  crit: suspicious
  conf: 0.85
  if:
    type: text
    regex: '(DavWWWRoot|\\\\webdav\\\\)'
    case_insensitive: true
- id: lnk-webdav-unc-ip-port
  desc: LNK WebDAV UNC path with raw IP:port
  crit: suspicious
  conf: 0.92
  attack: T1187
  if:
    type: raw
    regex: '\\\\[0-9.]+@[0-9]+\\'
- id: lnk-webclient-service
  desc: LNK references WebDAV client service name
  crit: suspicious
  conf: 0.8
  attack: T1187
  if:
    type: text
    substr: 'Web Client Network'
- id: lnk-js-extension
  desc: LNK references JavaScript file extension
  crit: suspicious
  conf: 0.8
  attack: T1059.007
  if:
    type: raw
    regex: '\.js\b'
    case_insensitive: true
      # === Office macro documents (from MSOffice_in_LNK) - split ===
- id: lnk-macro-doc-word
  desc: LNK references macro Word document
  crit: suspicious
  conf: 0.85
  if:
    type: text
    regex: '\.(docm|dotm)\b'
    case_insensitive: true
- id: lnk-macro-doc-excel
  desc: LNK references macro Excel document
  crit: suspicious
  conf: 0.85
  if:
    type: text
    regex: '\.(xlsm|xltm|xlam)\b'
    case_insensitive: true
- id: lnk-macro-doc-ppt
  desc: LNK references macro PowerPoint document
  crit: suspicious
  conf: 0.85
  if:
    type: text
    regex: '\.(potm|ppsm|pptm)\b'
    case_insensitive: true
      # === Konni APT pattern (from Actor_APT_DPRK_Konni_MAL_WIN_LNK) ===
- id: lnk-konni-shell-object
  desc: LNK uses JavaScript with Shell object
  crit: suspicious
  conf: 0.9
  if:
    type: text
    regex: '\.Shell'
    case_insensitive: true
      # === Download/execute patterns (KV-based) ===
- id: kv-curl-in-args
  desc: LNK arguments contain curl
  crit: suspicious
  conf: 0.85
  if:
    type: value
    path: lnk.arguments
    regex: '(?i)\bcurl\b'
- id: kv-wget-in-args
  desc: LNK arguments contain wget
  crit: suspicious
  conf: 0.85
  if:
    type: value
    path: lnk.arguments
    regex: '(?i)\bwget\b'
- id: kv-https-in-args
  desc: LNK arguments contain HTTPS URL
  crit: suspicious
  conf: 0.75
  if:
    type: value
    path: lnk.arguments
    regex: 'https://'
- id: kv-http-in-args
  desc: LNK arguments contain HTTP URL
  crit: suspicious
  conf: 0.8
  if:
    type: value
    path: lnk.arguments
    regex: 'http://'
- id: kv-encoding-flag
  desc: LNK arguments contain encoding flag
  crit: suspicious
  conf: 0.85
  if:
    type: value
    path: lnk.arguments
    regex: '(?i)-Encoding'
- id: kv-ep-bypass
  desc: LNK arguments contain execution policy bypass
  crit: suspicious
  conf: 0.9
  if:
    type: value
    path: lnk.arguments
    regex: '(?i)-ep\s+bypass'
- id: lnk-empty-string-obfuscation
  desc: LNK uses empty-string command splitting
  crit: suspicious
  conf: 0.9
  attack: T1027
  if:
    type: value
    path: lnk.arguments
    regex: "[a-z]''[a-z]"
- id: kv-schtasks-in-args
  desc: LNK arguments create scheduled task
  crit: suspicious
  conf: 0.9
  attack: T1053.005
  if:
    type: value
    path: lnk.arguments
    substr: schtasks
    case_insensitive: true
- id: kv-erase-in-args
  desc: LNK arguments erase files
  crit: suspicious
  conf: 0.8
  attack: T1070.004
  if:
    type: value
    path: lnk.arguments
    regex: '\berase\b'
    case_insensitive: true
- id: kv-outfile-in-args
  desc: LNK arguments download to file
  crit: suspicious
  conf: 0.8
  attack: T1105
  if:
    type: value
    path: lnk.arguments
    substr: '-OutFile'
    case_insensitive: true
- id: kv-progress-suppress
  desc: LNK suppresses PowerShell progress output
  crit: suspicious
  conf: 0.85
  if:
    type: value
    path: lnk.arguments
    substr: 'SilentlyContinue'
- id: kv-powershell-download-command
  desc: LNK PowerShell arguments invoke a web downloader
  crit: suspicious
  conf: 0.9
  attack: T1105
  if:
    type: value
    path: lnk.arguments
    regex: '(^|[\s;&|])(iwr|invoke-webrequest)\b'
    case_insensitive: true
- id: kv-powershell-pipeline-evaluator
  desc: PowerShell LNK pipes to evaluator
  crit: suspicious
  conf: 0.95
  attack: T1059.001
  if:
    type: value
    path: lnk.arguments
    regex: '\|\s*(iex|invoke-expression)\b'
    case_insensitive: true
- id: kv-powershell-obfuscated-join
  desc: PowerShell LNK reorders joined fragments
  crit: suspicious
  conf: 0.85
  attack: T1027
  if:
    type: value
    path: lnk.arguments
    regex: '@\(\s*["''][^"'']{1,64}["'']\s*,\s*["''][^"'']{1,64}["'']\s*\)[^\r\n]{0,48}-join\b'
    case_insensitive: true
  # === MSHTML/htmlfile LNK smuggling (2024-2026 technique) ===
- id: lnk-htmlfile-activex
  desc: LNK embeds htmlfile ActiveX COM object
  crit: suspicious
  conf: 0.92
  attack: T1059.007
  if:
    type: text
    regex: ActiveXObject.{0,5}htmlfile
- id: lnk-createobject-htmlfile
  desc: LNK CreateObject htmlfile COM
  crit: suspicious
  conf: 0.92
  attack: T1059.007
  if:
    type: text
    regex: CreateObject\s*\(\s*["']htmlfile["']
    case_insensitive: true
- id: lnk-execscript-call
  desc: LNK uses IE-only execScript execution
  crit: suspicious
  conf: 0.9
  attack: T1059.007
  if:
    type: text
    regex: execScript\s*\(
- id: lnk-mshta-mshtml-protocol
  desc: "LNK mshta mshtml: inline handler"
  crit: suspicious
  conf: 0.93
  attack: T1218.005
  if:
    type: text
    substr: "mshtml:"
    case_insensitive: true
- id: lnk-jscript-vbscript--jscript
  desc: LNK references JScript or VBScript (jscript)
  crit: suspicious
  conf: 0.85
  if:
    type: text
    case_insensitive: true
    word: jscript
- id: lnk-jscript-vbscript--vbscript
  desc: LNK references JScript or VBScript (vbscript)
  crit: suspicious
  conf: 0.85
  if:
    type: text
    case_insensitive: true
    word: vbscript
- id: lnk-archive-b64-magic--uesdba
  desc: LNK contains base64-encoded archive (UEsDBA)
  crit: suspicious
  conf: 0.9
  if:
    type: text
      # UEsDBA = ZIP, TVNDRg = CAB
    word: UEsDBA
- id: lnk-archive-b64-magic--tvndrg
  desc: LNK contains base64-encoded archive (TVNDRg)
  crit: suspicious
  conf: 0.9
  if:
    type: text
      # UEsDBA = ZIP, TVNDRg = CAB
    word: TVNDRg
composite_rules:
- id: lnk-powershell-obfuscated-stage
  desc: LNK hides PowerShell Base64 stage execution
  crit: hostile
  conf: 0.99
  attack: T1027,T1059.001,T1105,T1564.003
  mbc: B0030
  all:
  - id: micro-behaviors/process/create/shortcut::lnk-powershell-target
  - id: objectives/command-and-control/dropper/lnk/script-chain::lnk-arg-powershell-noprofile
  - id: lnk-invoke-expression
  - id: lnk-base64-convert
  - id: lnk-hidden-window-flag
- id: lnk-certutil-hidden-powershell-stage
  desc: LNK decodes a file before hidden PowerShell execution
  crit: hostile
  conf: 0.98
  attack: T1140,T1059.001,T1564.003
  mbc: B0030
  all:
  - id: lnk-certutil-decode
  - id: micro-behaviors/process/create/hidden::lnk-powershell-windowstyle-hidden-argument
  - id: lnk-exec-bypass-flags
  # === PowerShell composite (PS_in_LNK equivalent) ===
- id: lnk-jscript-vbscript
  desc: LNK references JScript or VBScript
  crit: suspicious
  conf: 0.85
  any:
  - id: lnk-jscript-vbscript--jscript
  - id: lnk-jscript-vbscript--vbscript
- id: lnk-archive-b64-magic
  desc: LNK contains base64-encoded archive magic
  crit: suspicious
  conf: 0.9
  any:
  - id: lnk-archive-b64-magic--uesdba
  - id: lnk-archive-b64-magic--tvndrg
- id: powershell-indicators
  desc: Multiple PowerShell indicators in LNK
  crit: suspicious
  conf: 0.9
  any:
  - id: lnk-invoke-expression
  - id: lnk-base64-convert
  - id: lnk-exec-bypass-flags
  - id: lnk-hidden-window-flag
  - id: lnk-encoded-command-flag
        # === Script composite (Script_in_LNK equivalent) ===
- id: script-indicators
  desc: Script language indicators in LNK
  crit: suspicious
  conf: 0.85
  any:
  - id: lnk-javascript-ref
  - id: lnk-jscript-vbscript
  - id: lnk-script-ext-wsh
        # === Execution composite (Execution_in_LNK equivalent) ===
- id: execution-indicators
  desc: Command execution indicators in LNK
  crit: suspicious
  conf: 0.85
  any:
  - id: lnk-cmd-echo
  - id: lnk-cmd-start
  - id: micro-behaviors/process/create/exec::lnk-comspec-environment-reference
  - id: lnk-assembly-load
  - id: lnk-reflection-assembly
  - id: lnk-wmi-process
        # === Download composite (Download_in_LNK equivalent) ===
- id: download-indicators
  desc: Download indicators in LNK
  crit: suspicious
  conf: 0.85
  any:
  - id: lnk-serverxmlhttp
  - id: kv-curl-in-args
  - id: kv-wget-in-args
        # === Macro document composite ===
- id: macro-document-ref
  desc: LNK references macro document
  crit: suspicious
  conf: 0.85
  any:
  - id: lnk-macro-doc-word
  - id: lnk-macro-doc-excel
  - id: lnk-macro-doc-ppt
        # === Konni APT composite ===
- id: konni-apt-pattern
  desc: Konni APT LNK pattern (mshta + javascript + bypass)
  crit: hostile
  conf: 0.95
  all:
  - id: lnk-javascript-ref
  - id: kv-ep-bypass
  - id: kv-encoding-flag
  - id: lnk-konni-shell-object
        # === Downloader composite (RustyNoob pattern) ===
- id: cmd-curl-mshta-downloader
  desc: LNK cmd.exe downloads via curl and executes HTA
  crit: hostile
  conf: 0.95
  all:
  - id: kv-curl-in-args
  - id: kv-https-in-args
  - id: lnk-hta-extension
- id: lnk-cmd-curl-output-download
  desc: LNK cmd curl output download
  crit: hostile
  conf: 0.96
  attack: T1105,T1204.002
  all:
  - id: kv-curl-in-args
  - id: kv-https-in-args
  - id: objectives/command-and-control/dropper/lnk/chm::lnk-arg-curl-output-download
  - id: objectives/execution/lnk/proxy::command-c-argument
  any:
  - id: objectives/command-and-control/dropper/lnk/target::hidden-or-minimized-window
  - id: micro-behaviors/process/create/shortcut::lnk-conhost-target
- id: lnk-conhost-curl-userdir-dropper
  desc: LNK curl user-directory dropper
  crit: hostile
  conf: 0.97
  attack: T1105,T1204.002
  all:
  - id: lnk-cmd-curl-output-download
  - id: objectives/command-and-control/dropper/lnk/file-on-disk::lnk-userdir-exe-shortcut
- id: lnk-conhost-curl-command-proxy
  desc: LNK conhost curl command proxy
  crit: hostile
  conf: 0.97
  attack: T1105,T1202
  all:
  - id: lnk-cmd-curl-output-download
  - id: micro-behaviors/process/create/shortcut::lnk-conhost-target
        # === Network download + execution ===
- id: download-and-execute-comp
  desc: LNK downloads and executes content
  crit: hostile
  conf: 0.9
  all:
  - id: download-indicators
  - id: execution-indicators
- id: powershell-download-execute
  desc: LNK PowerShell downloads and evaluates remote content
  crit: hostile
  conf: 0.98
  attack: T1059.001,T1105
  all:
  - id: micro-behaviors/process/create/shortcut::lnk-powershell-family
  - id: kv-powershell-download-command
  - id: kv-powershell-pipeline-evaluator
- id: lnk-hidden-powershell-remote-stager
  desc: LNK hidden PowerShell fetches and executes script
  crit: hostile
  conf: 0.99
  attack: T1059.001,T1105,T1564.003
  mbc: B0030
  all:
  - id: micro-behaviors/process/create/hidden::lnk-powershell-windowstyle-hidden-argument
  - id: micro-behaviors/process/create/exec::lnk-comspec-environment-reference
  - id: objectives/execution/lnk/proxy::command-c-argument
  - id: micro-behaviors/communications/http/lib/invoke-webrequest::lnk-irm-alias-argument
  - id: micro-behaviors/process/interpreter/eval::lnk-powershell-scriptblock-call-operator
        # === Evasion composite ===
- id: evasion-indicators
  desc: LNK uses evasion techniques
  crit: suspicious
  conf: 0.85
  any:
  - id: lnk-webdav-path
  - id: lnk-smb-share
  - id: lnk-webdav-unc-ip-port
        # === WebDAV IP@port JS dropper ===
- id: lnk-obfuscated-dropper
  desc: LNK downloads and persists with obfuscation
  crit: hostile
  conf: 0.95
  all:
  - id: lnk-empty-string-obfuscation
  - id: kv-https-in-args
  any:
  - id: kv-schtasks-in-args
  - id: kv-outfile-in-args
- id: lnk-download-and-persist
  desc: LNK downloads payload and creates persistence
  crit: hostile
  conf: 0.95
  attack: T1053.005
  all:
  - id: kv-https-in-args
  - id: kv-schtasks-in-args
  - id: micro-behaviors/process/create/shortcut::lnk-has-arguments
- id: webdav-ip-port-js-dropper
  desc: LNK fetches remote JS via WebDAV with raw IP
  crit: hostile
  conf: 0.95
  attack: T1105
  all:
  - id: lnk-webdav-unc-ip-port
  - id: lnk-js-extension
- id: mshtml-lnk-script-injector
  desc: LNK exploits MSHTML via htmlfile COM and scripted execution
  crit: hostile
  conf: 0.95
  attack: T1059.007
  all:
  - id: lnk-execscript-call
  any:
  - id: lnk-htmlfile-activex
  - id: lnk-createobject-htmlfile
- id: lnk-mshta-inline-html
  desc: "LNK runs inline HTML payload via mshta mshtml: protocol handler"
  crit: hostile
  conf: 0.95
  attack: T1218.005
  all:
  - id: lnk-mshta-mshtml-protocol
  any:
  - id: lnk-execscript-call
  - id: lnk-javascript-ref
  - id: lnk-createobject-htmlfile
  - id: lnk-jscript-vbscript
- id: lnk-msiexec-quiet-install-chain
  desc: LNK combines remote transfer with quiet MSI install
  crit: hostile
  conf: 0.99
  attack: T1105,T1218.007
  all:
  - id: micro-behaviors/communications/http/download/manager::lnk-bitsadmin-transfer-download
  - id: micro-behaviors/process/create/exec::lnk-msiexec-quiet-install
  - id: micro-behaviors/process/create/shortcut::lnk-cmd-with-args
