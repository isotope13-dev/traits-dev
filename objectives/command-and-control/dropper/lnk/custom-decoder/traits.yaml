defaults:
  platforms: [windows]
  for: [lnk]
  attack: T1027,T1059.001,T1105

traits:
  - id: lnk-custom-base64-alphabet
    desc: LNK embeds Base64 alphabet table
    crit: suspicious
    conf: 0.92
    if:
      type: value
      path: lnk.arguments
      regex: 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789\+/'

  - id: lnk-custom-base64-bitwise-reconstruction
    desc: LNK rebuilds Base64 bytes with shifts
    crit: suspicious
    conf: 0.95
    if:
      type: value
      path: lnk.arguments
      regex: '(?i)-(shl|shr)\s*[246][^\r\n]{0,180}-bor[^\r\n]{0,180}-(shl|shr)\s*[246]'

  - id: lnk-raw-githubusercontent-url
    desc: LNK references raw GitHub content
    crit: notable
    conf: 0.9
    if:
      type: value
      path: lnk.arguments
      regex: '(?i)https?://raw\.githubusercontent\.com/'

composite_rules:
  - id: lnk-custom-base64-decoder
    desc: LNK arguments implement a custom Base64 decoder
    crit: suspicious
    conf: 0.97
    all:
      - id: lnk-custom-base64-alphabet
      - id: lnk-custom-base64-bitwise-reconstruction
    near_bytes: 4096

  - id: lnk-custom-base64-hidden-powershell
    desc: LNK custom decoder launches hidden PowerShell
    crit: hostile
    conf: 0.99
    all:
      - id: lnk-custom-base64-decoder
      - id: objectives/command-and-control/dropper/lnk/deflatestream::lnk-kv-powershell-argument
      - id: objectives/command-and-control/dropper/lnk/command-content::lnk-hidden-window-flag
    near_bytes: 4096
