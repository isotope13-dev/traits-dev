defaults:
  platforms: [windows]
  for: [pe, dll]
  attack: T1105,T1027,T1204.002

composite_rules:
  # Pay-per-install style dropper: the list of third-party setup programs to
  # fetch and their silent-install flags are kept XOR-masked in the binary,
  # the downloads go through a runtime-named URLDownloadToFile, and the
  # dropper erases itself or persists afterwards. An installer bootstrapper
  # states its package URLs in the clear; masking them hides the bundle.
  - id: xor-config-silent-installer-downloader
    desc: XOR-masked installer URLs fetched and run silently
    crit: hostile
    conf: 0.95
    all:
      - id: micro-behaviors/communications/http/download/url::xor-decoded-executable-url
      - id: micro-behaviors/process/create/installer::xor-decoded-silent-installer-flags
      - id: micro-behaviors/communications/http/client/urlmon::url-download-to-file-str
    any:
      - id: objectives/evasion/self-delete/file/script::comspec-shortpath-self-delete
      - id: objectives/command-and-control/dropper/staging/stager::registry-runonce-or-run-write
    needs: 1
    unless:
      - id: metadata/signed/platform/
