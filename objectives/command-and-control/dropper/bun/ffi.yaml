defaults:
  platforms: [windows]
  for: [pe, javascript]
  attack: T1106

traits:
  # Timestamped single-file Bun payload entry (malware packaging, not the
  # stock Bun CLI which has no B:/~BUN/root/loader_* VFS root).
  - id: bun-vfs-loader-entry
    desc: Bun VFS timestamped loader entry path
    crit: suspicious
    conf: 0.97
    if:
      type: text
      regex: 'B:/~BUN/root/loader_[0-9]{8}_'

  - id: bun-sysreq-module-marker
    desc: Bun embedded sysreq module marker
    crit: component
    conf: 0.94
    if:
      type: text
      substr: 'sysreq.js'

  # Obfuscated NWHStealer-style Bun payloads embed a minified host-and-desktop
  # recon object (screen geometry, process count, browser tally, path harvest).
  - id: js-pe-desktop-recon-report-object
    desc: Embedded script desktop recon report object
    crit: notable
    conf: 0.97
    if:
      type: text
      regex: 'screenW:\s*\w+\s*,\s*screenH:\s*\w+\s*,\s*user:\s*\w+\s*,\s*procCount:'

composite_rules:
  - id: bun-ffi-self-injection-loader
    for: [pe]
    desc: Bun FFI self injection loader
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/dylib/load/runtime::bun-ffi-module
      - id: micro-behaviors/dylib/load/runtime::bun-ffi-native-loader-api-set
      # Stock Bun CLI carries bun:ffi + Win32 API imports; gate on malware VFS root.
      - id: bun-vfs-loader-entry
    any:
      - id: metadata/binary/section/name::bun-section-name
      - id: objectives/command-and-control/dropper/delivery/http::bun-loader-api-protocol
      - id: js-pe-desktop-recon-report-object

  - id: bun-vfs-obfuscated-recon-stealer
    for: [pe]
    desc: Bun VFS loader obfuscated desktop recon stealer
    crit: hostile
    conf: 0.98
    attack: T1082,T1041,T1105
    all:
      - id: bun-vfs-loader-entry
      - id: micro-behaviors/dylib/load/runtime::bun-ffi-module
      - id: js-pe-desktop-recon-report-object

  - id: bun-singlefile-sysreq-ffi-loader
    for: [pe]
    desc: Bun single-file obfuscated sysreq FFI loader
    crit: hostile
    conf: 0.98
    attack: T1106,T1027
    all:
      - id: metadata/binary/section/name::bun-section-name
      - id: micro-behaviors/dylib/load/runtime::bun-ffi-module
      - id: bun-vfs-loader-entry
      - id: bun-sysreq-module-marker
    unless:
      - id: metadata/signed/platform/
      - id: metadata/signed/developer/
