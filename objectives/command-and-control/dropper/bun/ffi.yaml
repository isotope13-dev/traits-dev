defaults:
  platforms: [windows]
  for: [pe, javascript]
  attack: T1106

traits:
  # Timestamped single-file Bun payload entry (malware packaging, not the
  # stock Bun CLI which has no B:/~BUN/root/loader_* VFS root).
  - id: bun-vfs-loader-entry
    desc: Bun VFS timestamped loader entry path
    crit: suspicious
    conf: 0.97
    if:
      type: text
      regex: 'B:/~BUN/root/loader_[0-9]{8}_'

  - id: bun-sysreq-module-marker
    desc: Bun embedded sysreq module marker
    crit: component
    conf: 0.94
    if:
      type: text
      substr: 'sysreq.js'

  # Obfuscated NWHStealer-style Bun payloads embed a minified host-and-desktop
  # recon object (screen geometry, process count, browser tally, path harvest).
  - id: js-pe-desktop-recon-report-object
    desc: Embedded script desktop recon report object
    crit: notable
    conf: 0.97
    if:
      type: text
      regex: 'screenW:\s*\w+\s*,\s*screenH:\s*\w+\s*,\s*user:\s*\w+\s*,\s*procCount:'

  - id: timestamped-loader-report-object
    desc: Timestamped loader status report object
    crit: notable
    conf: 0.96
    if:
      type: text
      regex: '\bvar\s+\w+\s*=\s*\{\s*success\s*:\s*\w+\s*,\s*ts\s*:'

  - id: bun-http-stage-unwrapper
    desc: Bun HTTP stage unwrap call
    crit: notable
    conf: 0.95
    if:
      type: text
      substr: '_unwrapAsset('

  - id: bun-http-get-source-call
    desc: Bun HTTP GET source call
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: '\bhttpGet\('

composite_rules:
  - id: bun-vfs-ffi-native-api-loader
    for: [pe]
    desc: Bun VFS native FFI loader
    crit: hostile
    conf: 0.98
    all:
      - id: bun-vfs-loader-entry
      - id: micro-behaviors/dylib/load/runtime::bun-ffi-module
      - id: micro-behaviors/os/exception/register::rtl-add-function-table
      - id: micro-behaviors/fs/path/construct::search-path-api
      - id: micro-behaviors/mem/alloc/virtual::virtual-alloc
      - id: micro-behaviors/mem/protect/modify::virtual-protect
    any:
      - id: metadata/binary/section/name::bun-section-name
      - id: objectives/command-and-control/dropper/delivery/http::bun-loader-api-protocol
      - id: js-pe-desktop-recon-report-object

  - id: bun-vfs-obfuscated-recon-stealer
    for: [pe]
    desc: Bun VFS loader obfuscated desktop recon stealer
    crit: hostile
    conf: 0.98
    attack: T1082,T1041,T1105
    all:
      - id: bun-vfs-loader-entry
      - id: micro-behaviors/dylib/load/runtime::bun-ffi-module
      - id: js-pe-desktop-recon-report-object
      - id: timestamped-loader-report-object
      - id: micro-behaviors/communications/http/post::client-wrapper-post-call

  - id: bun-vfs-http-stage-loader
    for: [pe]
    desc: Bun VFS loader retrieves and unwraps remote stage
    crit: hostile
    conf: 0.97
    attack: T1105,T1027
    all:
      - id: bun-vfs-loader-entry
      - id: micro-behaviors/dylib/load/runtime::bun-ffi-module
      - id: bun-http-stage-unwrapper
      - id: bun-http-get-source-call

  - id: bun-singlefile-sysreq-ffi-loader
    for: [pe]
    desc: Bun single-file obfuscated sysreq FFI loader
    crit: hostile
    conf: 0.98
    attack: T1106,T1027
    all:
      - id: metadata/binary/section/name::bun-section-name
      - id: micro-behaviors/dylib/load/runtime::bun-ffi-module
      - id: bun-vfs-loader-entry
      - id: bun-sysreq-module-marker
    unless:
      - id: metadata/signed/platform/
      - id: metadata/signed/developer/
