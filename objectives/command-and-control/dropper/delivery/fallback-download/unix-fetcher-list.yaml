# A list of download utilities iterated until one works, and whatever it
# fetched is then run as a shell script.
#
# The idiom is unmistakable because the *set of tool names is data*: an
# attacker who cannot know whether the victim has wget, lynx or fetch writes
# them into a variable and loops. The 2002 tcpdump/libpcap trojan put
# `ARGS="wget -q -O -,lynx --source,fetch -q -o -"` in the shipped `configure`,
# ran each in turn against a hardcoded URL, and `sh`'d the first successful
# download -- all inside a backgrounded subshell with both streams discarded,
# so `./configure` looked normal.
#
# Portable install scripts do probe for a fetcher, which is why the download
# alone is not the finding: what convicts is handing the downloaded file
# straight to a shell. A variant that swaps in curl, aria2 or busybox wget
# still needs the same two halves.
defaults:
  platforms: [unix]
  for: [shell, text]
  attack: T1105,T1059.004
  mbc: B0024

traits:
  - id: fetcher-name-list-value
    desc: Assigns a list of download tools
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: '=\s*"[^"\n]{0,40}\b(wget|curl|fetch)\b[^"\n]{0,60},[^"\n]{0,60}\b(lynx|curl|wget|fetch)\b'

  - id: shell-runs-downloaded-file
    desc: Runs a just-downloaded file with sh
    crit: notable
    conf: 0.9
    # `if [ -f $CNF ]; then sh $CNF` -- the existence test names the same
    # variable the fetch wrote, and the interpreter runs it in place.
    if:
      type: text
      regex: '\[\s*-f\s+"?\$\w{1,20}"?\s*\][^\n]{0,40};?\s*then\s+(\.|source|sh|bash)\s+"?\$\w{1,20}'

composite_rules:
  - id: fetcher-fallback-chain-to-shell
    desc: Tool-list download chain feeds a shell
    crit: hostile
    conf: 0.97
    all:
      - id: fetcher-name-list-value
      - id: shell-runs-downloaded-file

# A build recipe that fetches a helper over cleartext HTTP at configure time
# and marks it executable in the build tree. The build-recipe rules under
# supply-chain convict the trojanized recipe; this one states the transfer --
# a configure script has no business fetching anything, and cleartext HTTP
# plus chmod is a dropper wearing autoconf clothes.
#
# The three legs must be one sequence. Without proximity this matched any
# autoconf `configure`: the generated boilerplate carries a GNU URL, the
# gettext macros reference wget, and the body chmods conftest binaries
# throughout. Measured against the clean corpus it convicted the pristine
# irssi 0.8.4 release script and nothing malicious at all.
#
# The earlier comment here named the trojanized irssi configure as its worked
# example. That was wrong on the facts: irssi's injected payload is a socket
# reverse shell inside an autoconf conftest program, with no fetch of any
# kind -- it is covered by build-recipe's socket-backdoor rule, not by this
# one.
  - id: configure-cleartext-fetch-chmod
    desc: Configure fetches helper over cleartext HTTP
    crit: hostile
    conf: 0.96
    attack: T1105
    mbc: E1105
    near_lines: 10
    all:
      - id: micro-behaviors/communications/http/download/shell::wget-http-literal-download
      - id: micro-behaviors/communications/http/url/scheme::cleartext-http-url
      - id: micro-behaviors/fs/chmod/executable/mode::chmod-exec-var-target
