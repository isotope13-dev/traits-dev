# BITS with IWR fallback, then IEX of the staged file and immediate delete.
defaults:
  platforms: [windows]
  for: [powershell, html, javascript]
  attack: T1105,T1059.001,T1197
  mbc: B0030

traits:
  - id: iex-getcontent-raw-cleanup
    desc: IEX runs Get-Content then deletes
    crit: suspicious
    conf: 0.96
    if:
      type: text
      regex: '(?i)iex\s*\(\s*(gc|Get-Content)\s+\$\w+\s+-Raw\s*\)\s*;\s*ri\s+\$'

composite_rules:
  - id: powershell-bits-iex-temp-cleanup
    for: [powershell]
    desc: BITS IWR stage IEX then deleted
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/communications/http/download/manager::bits-transfer-cmdlet
      - id: micro-behaviors/communications/http/lib/invoke-webrequest::invoke-webrequest
      - id: iex-getcontent-raw-cleanup

  # A separate file-transfer branch stages executables under a user-writable
  # application path, then launches them hidden and requests UAC elevation.
  # Requiring both BITS and IWR captures the same fallback routine rather than
  # treating either download primitive as hostile by itself.
  - id: powershell-fallback-download-hidden-elevated-executable
    for: [powershell]
    desc: Fallback downloader launches a hidden executable with UAC elevation
    crit: hostile
    conf: 0.98
    attack: T1105,T1548.002
    all:
      - id: micro-behaviors/communications/http/download/manager::bits-transfer-cmdlet
      - id: micro-behaviors/communications/http/download/cli::iwr-outfile-call
      - id: micro-behaviors/fs/path/app-data::localappdata-env-var-reference
      - id: micro-behaviors/process/create/exec::start-process-filepath-text
      - id: micro-behaviors/process/create/hidden::start-process-hidden-window-option
      - id: micro-behaviors/os/privilege/elevation::powershell-start-process-runas
    near_lines: 80
