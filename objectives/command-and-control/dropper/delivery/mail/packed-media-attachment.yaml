defaults:
  for: [text, zip, pe]
  platforms: [unix, windows]
composite_rules:
  - id: mail-packed-media-executable-attachment
    desc: Mail disguises packed executable as photo article
    crit: hostile
    conf: 0.98
    scope: outer
    attack: T1566.001,T1036
    all:
      - id: micro-behaviors/communications/email/mime::eml-multipart-mixed
      - id: objectives/evasion/masquerade/file/document::media-article-executable-name
      - id: metadata/binary/section/header::small-pe-writable-entry-profile
