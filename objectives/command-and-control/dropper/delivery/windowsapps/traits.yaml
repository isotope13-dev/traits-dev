# Drop-and-execute into the per-user WindowsApps directory.
#
# An implant writes a follow-on executable into
# %LocalAppData%\Microsoft\WindowsApps and launches it. The directory is on the
# default PATH, so the payload can later be started by bare name, and a per-user
# write needs no elevation. QuickFox's Assist.dll plugin used this staging step;
# the shape generalizes to any dropper that targets this alias directory.
defaults:
  platforms: [windows]
  for: [csharp, powershell, pe, dll]
  attack: T1105,T1036
  mbc: B0023

composite_rules:
  - id: windowsapps-drop-execute
    desc: Writes an executable to WindowsApps and runs it
    crit: hostile
    conf: 0.95
    scope: file
    near_lines: 40
    all:
      - id: micro-behaviors/fs/path/application/windowsapps::windowsapps-user-path
      - id: micro-behaviors/fs/write/file/direct::writeallbytes-call
      - id: micro-behaviors/process/create/spawn::start

  - id: windowsapps-powershell-drop-execute
    desc: PowerShell launches a svchost impostor from WindowsApps
    crit: hostile
    conf: 0.98
    for: [powershell]
    scope: file
    near_lines: 40
    all:
      - id: micro-behaviors/fs/path/application/windowsapps::windowsapps-user-path
      - id: micro-behaviors/fs/write/file/direct::write-all-bytes
      - id: micro-behaviors/process/create/shell/script-host::cmd-exe-c-start-launch
    any:
      - id: objectives/evasion/masquerade/process/name::numeric-svchost-executable-name
      - id: objectives/evasion/masquerade/process/name::variable-suffixed-svchost-executable-name
    needs: 1
