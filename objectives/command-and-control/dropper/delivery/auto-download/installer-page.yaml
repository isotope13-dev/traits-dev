# Web pages that hand the visitor an installer they did not ask for.
#
# The fake-update lure — a page dressed as a Zoom/Adobe/Chrome update notice
# that starts the "update" download the moment it renders — is the standard
# front end for RMM-abuse and loader campaigns.  The deception itself is text
# and branding, which is not something a matcher should chase.  What is
# structural is where the payload lives and how the fetch is started:
#
#   * a Windows/macOS installer served straight off a bare public IPv4.
#     Vendors ship installers from their own domains and CDNs, behind TLS and
#     a hostname; an operator's staging box has no name, so the URL carries a
#     raw address.  This one holds on its own.
#   * the download fired from script on load rather than from a user gesture.
#
# ATT&CK: T1189 (Drive-by Compromise), T1105 (Ingress Tool Transfer)
defaults:
  platforms: [windows, unix]
  for: [html, javascript, typescript, scripts]
  attack: T1189,T1105
  mbc: B0011

traits:
  # The `not:` clauses reject RFC1918, loopback and link-local, so lab and
  # intranet build scripts pointing at 10.x/192.168.x staging hosts do not
  # match — only genuinely public, unnamed hosts do.
  - id: bare-ip-installer-download-url
    desc: Installer served from a bare public IP
    crit: suspicious
    conf: 0.93
    if:
      type: text
      regex: '(?i)https?://(\d{1,3}\.){3}\d{1,3}(:\d{2,5})?/[^\s"''<>]{0,120}\.(msi|exe|pkg|dmg)\b'
    not:
      - regex: '//(10|127|0|169)\.'
      - regex: '//192\.168\.'
      - regex: '//172\.(1[6-9]|2[0-9]|3[01])\.'

composite_rules:
  # Auto-started fetch of an installer: no click, and the payload comes off an
  # unnamed host.  A vendor's "your download will begin automatically" page is
  # the same mechanism, which is why the bare-IP origin is required.
  - id: auto-download-installer-from-bare-ip
    desc: Page auto-downloads an installer from a bare IP
    crit: hostile
    conf: 0.95
    all:
      - id: bare-ip-installer-download-url
    any:
      - id: micro-behaviors/communications/http/download/browser::js-scripted-anchor-download
      - id: micro-behaviors/ui/window/manage/dom::browser-location-href-assign
    needs: 1
    near_bytes: 4096
    unless:
      - id: well-known/tool/detection/

  # The other end of the same lure.  Remote-management vendors personalise the
  # agent download per account, so a copy handed out with somebody's account
  # identifier already baked into the filename enrols the machine when it runs.
  # A vendor portal does that too — for a tenant who asked for it, under the
  # vendor's own product name.  Requiring the file to be presented as some
  # consumer application instead is what makes this a malicious delivery page.
  - id: account-bound-agent-installer-delivery-page
    desc: Page delivers account-bound app-lure installer
    crit: hostile
    conf: 0.96
    attack: T1105,T1219
    mbc: B0030
    all:
      - id: objectives/evasion/masquerade/file/lure::branded-app-account-bound-installer-reference
    any:
      - id: micro-behaviors/communications/http/download/browser::js-scripted-anchor-download
      - id: micro-behaviors/ui/window/manage/dom::browser-location-href-assign
      - id: objectives/credential-access/phishing/captive-portal::download-executable-link
    needs: 1
    near_bytes: 4096
    unless:
      - id: well-known/tool/detection/

# An extension whose activation downloads executables from bare IP hosts
# over cleartext HTTP and runs them as services. The auto-download rules
# above convict the fetch; this states the pair -- a marketplace extension
# that fetches a named .exe/.dll from a raw IP and spawns it is a dropper
# wearing an extension ID.
#
# Worked example: the GitlensPro.aicode-companion VSIX, whose "AI Copilot"
# activation pulls timetoplay.exe and Lightshot.dll from
# http://91.92.242.133/dl/ and executes them from the temp directory.
  - id: extension-bare-ip-exe-service-drop
    desc: Extension drops bare-IP executables as service
    crit: hostile
    conf: 0.97
    attack: T1204.002,T1105
    scope: archive
    all:
      - id: bare-ip-installer-download-url
      - id: micro-behaviors/process/create/exec::node-child-process-capability
