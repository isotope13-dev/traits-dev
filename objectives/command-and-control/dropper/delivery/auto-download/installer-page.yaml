# Scripted installer delivery. URL observations are neutral references;
# composites require additional delivery or deception context.
defaults:
  platforms: [windows, unix]
  for: [html, javascript, typescript, scripts]
  attack: T1189,T1105
  mbc: B0011

composite_rules:
  # Browser mockups are common in product pages and documentation. They do not
  # place an executable installer behind a download control inside the mock
  # address bar. This is the payload-delivery variant of BiTB: the page draws
  # the trust indicator and then hands the visitor native code to run.
  - id: browser-in-browser-installer-delivery
    for: [javascript, html]
    desc: Fake browser window delivers an installer
    crit: hostile
    conf: 0.97
    attack: T1036,T1189,T1105,T1204.002
    all:
      - id: micro-behaviors/ui/window/markup::synthetic-browser-window-chrome
      - id: objectives/credential-access/phishing/captive-portal::installer-download-link
    near_bytes: 8192
    unless:
      - id: well-known/tool/detection/
      - id: metadata/package/testing/presence/fixture/

  # Auto-started fetch of an installer: no click, and the payload comes off an
  # unnamed host.  A vendor's "your download will begin automatically" page is
  # the same mechanism, which is why the bare-IP origin is required.
  - id: auto-download-installer-from-bare-ip
    desc: Page auto-downloads an installer from a bare IP
    crit: hostile
    conf: 0.95
    all:
      - id: micro-behaviors/communications/http/url/path::public-ip-installer-url-reference
    any:
      - id: micro-behaviors/communications/http/download/browser::js-scripted-anchor-download
      - id: micro-behaviors/ui/window/navigation::browser-location-href-assign
    needs: 1
    near_bytes: 4096
    unless:
      - id: well-known/tool/detection/

  # The other end of the same lure.  Remote-management vendors personalise the
  # agent download per account, so a copy handed out with somebody's account
  # identifier already baked into the filename enrols the machine when it runs.
  # A vendor portal does that too — for a tenant who asked for it, under the
  # vendor's own product name.  Requiring the file to be presented as some
  # consumer application instead is what makes this a malicious delivery page.
  - id: account-bound-agent-installer-delivery-page
    desc: Page delivers account-bound app-lure installer
    crit: hostile
    conf: 0.96
    attack: T1105,T1219
    mbc: B0030
    all:
      - id: objectives/evasion/masquerade/file/lure::branded-app-account-bound-installer-reference
    any:
      - id: micro-behaviors/communications/http/download/browser::js-scripted-anchor-download
      - id: micro-behaviors/ui/window/navigation::browser-location-href-assign
      - id: objectives/credential-access/phishing/captive-portal::download-executable-link
    needs: 1
    near_bytes: 4096
    unless:
      - id: well-known/tool/detection/

# An extension whose activation downloads executables from bare IP hosts over
# cleartext HTTP and starts them. Archive-format legs keep this from turning
# every Node downloader with child_process imported into an extension verdict.
#
# Worked example: the GitlensPro.aicode-companion VSIX, whose "AI Copilot"
# activation pulls timetoplay.exe and Lightshot.dll from
# http://91.92.242.133/dl/ and executes them from the temp directory.
  - id: extension-bare-ip-executable-dropper
    desc: Extension downloads and starts bare-IP executable
    crit: hostile
    conf: 0.97
    attack: T1204.002,T1105
    # Container types listed so the pooled scope has a node to run on (cleave archive for: gate, 2026-09).
    scope: archive
    for: [html, javascript, typescript, scripts, crx, xpi]
    all:
      - id: micro-behaviors/communications/http/url/path::public-ip-installer-url-reference
      - id: micro-behaviors/process/create/exec::node-process-launch-call
      - id: metadata/package/files/included::vsix-manifest-entry
      - id: metadata/package/files/included::vsix-package-json-entry
