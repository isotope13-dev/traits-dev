# PHP web payloads can carry a complete OpenSSH credential and use SCP as a
# quieter primary delivery channel before falling back to an HTTP cradle.
defaults:
  platforms: [unix]
  for: [php]
  attack: T1105,T1059.004

composite_rules:
  - id: php-embedded-key-scp-stage-exec
    desc: PHP uses embedded-key SCP stage execution
    crit: hostile
    conf: 0.99
    all:
      - id: micro-behaviors/process/create/shell/spawn::php-shell-exec
      - id: micro-behaviors/crypto/asymmetric/key::embedded-openssh-private-key
      - id: micro-behaviors/communications/ssh/transfer::scp-remote-source-operand
      - id: micro-behaviors/communications/ssh/client::null-known-hosts-file
      - id: micro-behaviors/process/create/local-exec::chmod-then-local-execute-command
