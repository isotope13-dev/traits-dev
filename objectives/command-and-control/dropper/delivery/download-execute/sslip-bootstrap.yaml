# Native agents that embed an sslip.io (IP-in-hostname) control endpoint and
# also install Windows persistence are almost never legitimate MDM products.
# sslip.io is free wildcard DNS for raw VPS IPs; combining it with Run-key and
# CreateService staging is the ordinary shape of a Go downloader/agent bootstrap.
defaults:
  platforms: [windows]
  for: [pe, dll]
  attack: T1071.001,T1547.001,T1543.003,T1105
  mbc: B0030

composite_rules:
  - id: sslip-io-runkey-service-bootstrap
    desc: sslip.io agent persists via Run key and service
    crit: hostile
    conf: 0.97
    attack: T1071.001,T1547.001,T1543.003
    all:
      - id: micro-behaviors/communications/http/url/domain::sslip-io-ip-hostname
      - id: objectives/persistence/login/startup/registry::software-run-key
      - id: micro-behaviors/os/service/control::create-service-w-reference
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/installer/family/
