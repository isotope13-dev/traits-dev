defaults:
  platforms: [windows]
  for: [pe]
  attack: T1105,T1059.003,T1059.005

composite_rules:
  - id: pe-embedded-wsh-download-command-dropper
    desc: Native PE carries obfuscated WSH download and shell execution
    crit: hostile
    conf: 0.98
    all:
      - id: objectives/anti-static/obfuscation/payload/fragmentation::pe-script-obfuscated-helper-functions
      - id: objectives/execution/interpreter/vbscript/interpreter::wscript-host-exec
      - id: micro-behaviors/communications/http/download/wsh::pe-embedded-downloadfile-helper
      - id: micro-behaviors/process/create/shell/script-host::cmd-exe-c-command

