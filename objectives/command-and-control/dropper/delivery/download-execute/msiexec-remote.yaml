defaults:
  platforms: [windows]
  for: [batch, powershell, vbs, javascript, python, scripts, lnk]
  attack: T1105,T1218.007

composite_rules:
  - id: remote-msiexec-command
    desc: Windows script or shortcut invokes msiexec with a remote package
    crit: suspicious
    conf: 0.96
    near_lines: 4
    all:
      - id: micro-behaviors/process/create/installer::remote-msi-package-url
    any:
      - id: micro-behaviors/process/create/installer::msiexec-package-verb
      - id: micro-behaviors/process/create/installer::lnk-remote-msiexec-url
    downgrade:
      any:
        - id: well-known/app/development/github-cli::official-release-installer-url
    unless:
      - id: metadata/build/ci/agent::ci-build-dependency-install-context

  - id: remote-msiexec-rundll32-dropper
    desc: Remote MSI installer is followed by rundll32 DLL execution
    crit: hostile
    conf: 0.98
    near_lines: 12
    attack: T1105,T1218.007,T1218.011
    all:
      - id: remote-msiexec-command
      - id: micro-behaviors/process/create/shell/script-host::rundll32-exec-with-args

  - id: remote-msiexec-onion-dropper
    desc: Remote MSI installer is paired with an onion-service endpoint
    crit: hostile
    conf: 0.97
    near_lines: 12
    attack: T1105,T1218.007,T1090.003
    all:
      - id: remote-msiexec-command
      - id: micro-behaviors/communications/proxy/tor::onion-domain-reference

  - id: lnk-remote-msiexec-dropper
    desc: Shortcut retrieves an installer through msiexec
    crit: hostile
    conf: 0.98
    attack: T1105,T1218.007,T1204.002
    all:
      - id: micro-behaviors/process/create/installer::lnk-remote-msiexec-url
      - id: micro-behaviors/process/create/shortcut::lnk-has-arguments
