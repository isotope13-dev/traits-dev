# .NET downloaders that stage remote executables through hidden shells.
defaults:
  for: [pe, dll, csharp]
  platforms: [windows]
  attack: T1105
  mbc: B0030

composite_rules:
  - id: dotnet-hidden-shell-launch-style
    desc: Hidden shell or windowless process launch
    crit: suspicious
    conf: 0.9
    any:
      - id: micro-behaviors/process/create/hidden::powershell-windowstyle-hidden-option
      - id: micro-behaviors/process/create/shell/remote-powershell::powershell-hidden-window
      - id: micro-behaviors/process/create/hidden::dotnet-create-no-window

  - id: dotnet-shell-interpreter-invocation
    desc: Invokes cmd.exe or PowerShell interpreter
    crit: notable
    conf: 0.9
    any:
      - id: micro-behaviors/process/create/exec::powershell-exe-reference
      - id: micro-behaviors/process/create/shell/interpreter::powershell-executable-token
      - id: micro-behaviors/process/create/exec::cmd-exe-reference

  - id: dotnet-github-hidden-shell-exe-dropper
    desc: .NET fetches GitHub release EXE via hidden shell
    crit: hostile
    conf: 0.98
    attack: "T1105,T1059.001,T1564.003"
    all:
      - id: micro-behaviors/communications/url/external/github::github-release-download
      - id: micro-behaviors/process/create/shell/spawn::shell-execution-comp
      - id: dotnet-hidden-shell-launch-style
      - id: dotnet-shell-interpreter-invocation
    unless:
      - id: metadata/signed/platform/

  - id: dotnet-remote-exe-download-hidden-launch
    desc: .NET downloads remote EXE and launches hidden
    crit: hostile
    conf: 0.97
    attack: "T1105,T1059.001,T1564.003"
    all:
      - id: micro-behaviors/communications/http/client/managed::httpclient
      - id: micro-behaviors/process/create/shell/spawn::shell-execution-comp
      - id: dotnet-hidden-shell-launch-style
    any:
      - id: micro-behaviors/communications/url/external/github::github-release-download
      - id: micro-behaviors/communications/http/url/domain::workers-dev-url
      - id: micro-behaviors/communications/http/url/domain::http-url-binary
    unless:
      - id: metadata/signed/platform/
      - id: metadata/library/ai::openai-dotnet-official-library
