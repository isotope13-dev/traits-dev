defaults:
  for: [pe]
  platforms: [windows]
  attack: T1105
  mbc: E1105

traits:
- id: c2-healthcheck-query-path
  desc: Hardcoded healthcheck C2 path
  crit: component
  conf: 0.92
  if:
    type: text
    regex: ^/good\?[a-z]=[A-Za-z0-9_-]{4,32}&substr=[A-Za-z0-9_-]{4,32}$

composite_rules:
- id: dynamic-winhttp-downloader
  desc: Dynamic WinHTTP downloader flow
  crit: suspicious
  conf: 0.92
  for: [pe, dll]
  all:
  - id: micro-behaviors/communications/http/client/winhttp::winhttp-downloader-flow-text
  any:
  - id: metadata/signed/trust-level::unsigned
  - id: micro-behaviors/os/module/load::dynamic-self-resolution-imports
  - id: micro-behaviors/fs/temp/directory::get-temp-path-dup
  - id: micro-behaviors/process/create/spawn::create-process-w
  needs: 2
  unless:
  # Wine's `qmgr.dll` is its BITS implementation: transferring files over
  # WinHTTP into a temp staging path is the service's documented job.
  - id: well-known/lib/platform/wine::wine-builtin-dll-marker
  - id: metadata/signed/platform/
  - id: well-known/tool/browser/
  - id: metadata/binary/installer/family/
  - id: metadata/binary/installer/script/
  # Was `well-known/app/` plus three individually-named applications
  # (vovsoft, Process Explorer, Sandboxie) and libgit2; the two directories
  # cover all of them and leave room for the Wine leg above without pushing
  # the rule over the suppression budget.
  - id: well-known/app/
  - id: well-known/tool/
  - id: well-known/lib/
- id: winhttp-cloud-stage-with-c2
  desc: WinHTTP cloud stage with hardcoded C2
  crit: suspicious
  conf: 0.95
  size_max: 524288
  all:
  - id: micro-behaviors/communications/http/client/winhttp::winhttp-downloader-flow-text
  - id: micro-behaviors/communications/http/url/cloud::gdrive-download-url
  - id: micro-behaviors/communications/ip/literal::external-ipv4-binary
  any:
  - id: c2-healthcheck-query-path
  - id: micro-behaviors/process/create/spawn::create-process-w
  - id: micro-behaviors/fs/temp/directory::get-temp-path-dup
  - id: micro-behaviors/os/module/load::dynamic-self-resolution-imports
  needs: 2
  unless:
  - id: metadata/signed/platform/
  - id: metadata/binary/installer/family/
  - id: metadata/binary/installer/script/
- id: api-hashed-winhttp-stage-loader
  desc: API-hashed WinHTTP staged loader
  crit: hostile
  conf: 0.96
  size_max: 524288
  all:
  - id: winhttp-cloud-stage-with-c2
  - id: objectives/anti-static/obfuscation/imports::pe-api-hashing-indicator-single
  - id: metadata/signed/trust-level::unsigned
  any:
  - id: micro-behaviors/mem/protect/modify::virtual-alloc
  - id: micro-behaviors/process/create/spawn::create-process-w
  - id: micro-behaviors/fs/temp/directory::get-temp-path-dup
  - id: micro-behaviors/os/module/load::dynamic-self-resolution-imports
  needs: 3
  unless:
  - id: metadata/signed/platform/
  - id: metadata/binary/installer/family/
  - id: metadata/binary/installer/script/
- id: raw-ip-winhttp-memory-stager
  desc: Raw-IP WinHTTP memory stager
  crit: hostile
  conf: 0.97
  ref: sha256:8a710cccc278dc81e3fda6081c71cfac7bcfa0099821d7d0a7fab7f415cfd411
  size_max: 524288
  all:
  - id: dynamic-winhttp-downloader
  - id: micro-behaviors/communications/http/url/external-ip::url-external-ip-port-binary
  - id: micro-behaviors/mem/protect/modify::rw-to-rx-protection-with-thread-start
  any:
  - id: micro-behaviors/process/create/spawn::create-process-a
  - id: micro-behaviors/process/create/spawn::create-process-w
  - id: micro-behaviors/fs/temp/directory::get-temp-path-dup
  - id: micro-behaviors/os/module/load::dynamic-self-resolution-imports
  needs: 2
  unless:
  - id: metadata/signed/platform/
  - id: metadata/binary/installer/family/
  - id: metadata/binary/installer/script/
- id: unsigned-winhttp-remote-memory-stager
  desc: Unsigned WinHTTP stager with remote-process memory APIs
  crit: hostile
  conf: 0.99
  attack: "T1055,T1105,T1622"
  for: [pe, dll]
  all:
  - id: dynamic-winhttp-downloader
  - id: metadata/binary/layout::pe-no-signature-record
  - id: micro-behaviors/process/inject/runtime/call::remote-process-memory-api-cluster
  - id: objectives/command-and-control/dropper/execution/windows-loader::temp-copy-shell-handoff
  unless:
  - id: metadata/signed/platform/
  - id: metadata/binary/installer/family/
  - id: metadata/binary/installer/script/
- id: unsigned-winhttp-remote-thread-stager
  desc: Unsigned WinHTTP downloader that executes a remote memory stage
  crit: hostile
  conf: 0.995
  attack: "T1055,T1055.001,T1105"
  for: [pe, dll]
  size_max: 524288
  all:
  - id: micro-behaviors/communications/http/client/winhttp::winhttp-downloader-flow
  - id: metadata/binary/layout::pe-no-signature-record
  - id: micro-behaviors/process/inject/runtime/call::remote-process-memory-api-cluster
  - id: micro-behaviors/process/inject/runtime/call::create-remote-thread-dup
  unless:
  - id: metadata/signed/platform/
  - id: metadata/binary/installer/family/
  - id: metadata/binary/installer/script/
