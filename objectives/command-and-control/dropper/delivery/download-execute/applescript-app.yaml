# AppleScript stages an application archive and launches the extracted bundle.
# The concrete campaign used this as the first stage of a fake PDF viewer; the
# rule deliberately keys on the reusable download/extract/launch chain.
defaults:
  platforms: [macos]
  for: [applescript]
  attack: T1105,T1204.002
  mbc: E1105

composite_rules:
  - id: applescript-download-extract-stage
    desc: AppleScript downloads and extracts an application archive
    crit: hostile
    conf: 0.98
    attack: T1059.004,T1105
    all:
      - id: micro-behaviors/process/create/script/apple-event::shell-dup-cmd
      - id: micro-behaviors/communications/http/download/curl::curl-zip-output
      - id: micro-behaviors/data/archive/extract/zip::unzip-extraction

  - id: applescript-download-launch-stage
    desc: AppleScript downloads and launches an application bundle
    crit: hostile
    conf: 0.98
    attack: T1059.004,T1105,T1204.002
    all:
      - id: micro-behaviors/process/create/script/apple-event::shell-dup-cmd
      - id: micro-behaviors/communications/http/download/curl::curl-zip-output
      - id: micro-behaviors/process/create/launch::applescript-open-app
