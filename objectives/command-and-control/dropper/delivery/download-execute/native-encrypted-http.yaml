defaults:
  platforms: [linux]
  for: [elf]
  attack: "T1105,T1059.004"
  mbc: B0024

composite_rules:
  - id: encrypted-native-http-download-execute
    desc: Encrypted native client downloads, permits, and executes a payload
    crit: hostile
    conf: 0.99
    all:
      - id: objectives/anti-static/obfuscation/payload/encrypted::native-chacha-runtime-string-table
      - id: micro-behaviors/communications/http/header/content-length::content-length-header
      - id: micro-behaviors/communications/socket/create::posix-socket-import
      - id: micro-behaviors/communications/socket/connect::connect-symbol
      - id: micro-behaviors/fs/file/write/direct::write--fwrite
      - id: micro-behaviors/fs/chmod/modify::syscall-chmod
      - id: micro-behaviors/process/create/execv::c-exec-variants
      - id: micro-behaviors/fs/file/delete::remove
