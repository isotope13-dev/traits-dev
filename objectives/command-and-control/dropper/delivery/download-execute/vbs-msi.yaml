defaults:
  platforms: [windows]
  for: [vbs]
  attack: T1059.003,T1105,T1218.007

composite_rules:
  - id: vbs-curl-msi-dropper
    desc: VBScript downloads and silently installs an MSI
    crit: hostile
    conf: 0.99
    all:
      - id: micro-behaviors/communications/http/download/curl::curl-cmd
      - id: micro-behaviors/communications/http/download/curl::curl-output-file
      - id: micro-behaviors/process/create/exec::vbs-msiexec-quiet-install
      - id: micro-behaviors/process/create/shell/script-host::cmd-exe-c-command
      - id: objectives/execution/interpreter/vbscript/interpreter::vbs-hidden-async-run
  - id: vbs-hidden-ps-unattended-rmm
    desc: Hidden VBScript PowerShell fetches an unattended RMM MSI
    crit: hostile
    conf: 0.98
    attack: T1059.001,T1059.005,T1105,T1219
    all:
      - id: objectives/execution/interpreter/vbscript/interpreter::vbs-hidden-async-powershell-launcher
    any:
      - id: well-known/dual-use/remote-admin/rmm::logmein-agent-name
      - id: well-known/dual-use/remote-admin/rmm::gotoresolve-agent-name

  - id: vbs-delayed-powershell-msi-dropper
    desc: Hidden VBScript delays, downloads, and silently installs an MSI
    crit: hostile
    conf: 0.99
    attack: T1059.001,T1059.005,T1105,T1218.007,T1497.003,T1564.003
    all:
      - id: micro-behaviors/communications/http/download/cli::embedded-iwr-outfile-download
      - id: micro-behaviors/time/sleep/interval::embedded-sleep-before-web-request
      - id: micro-behaviors/process/create/exec::vbs-msiexec-quiet-install
      - id: micro-behaviors/process/create/shell/wsh::hidden-window-run
      - id: micro-behaviors/process/create/shell/command-flag::powershell-flagged-command-line
    near_bytes: 4096

  - id: vbs-delayed-powershell-rmm-dropper
    desc: Delayed VBScript stages hidden RMM MSI
    crit: hostile
    conf: 0.99
    attack: T1059.001,T1059.005,T1105,T1219,T1564.003
    all:
      - id: vbs-delayed-powershell-msi-dropper
      - id: well-known/dual-use/remote-admin/rmm/
    near_bytes: 4096
