# PHP fetch -> write to temp -> run through the php CLI. A library that needs
# remote data reads it and uses it in-process; writing the response into the
# system temp directory and then spawning a second interpreter on that file
# is how a stager runs a payload it does not want in its own source.
defaults:
  platforms: [windows, unix]
  for: [php]
  attack: T1105,T1059.006
  mbc: B0024

composite_rules:
  - id: php-remote-stage-temp-interpreter-exec
    desc: PHP fetches a remote stage to temp and runs it through php
    crit: hostile
    conf: 0.97
    all:
      - id: micro-behaviors/fs/file/write/direct::php-file-put-contents
      - id: micro-behaviors/fs/temp/directory::sys-get-temp-dir
      - id: micro-behaviors/process/create/shell/spawn::php-cli-shell-command
      - id: micro-behaviors/process/create/shell/spawn::shell-execution-comp
    any:
      - id: micro-behaviors/communications/http/client/file-read::php-http-file-request
      - id: micro-behaviors/communications/http/curl::php-curl-request
      - id: micro-behaviors/communications/socket/options::php-stream-context-create
    unless:
      - id: metadata/package/testing/harness/unit/
      - id: well-known/lib/runtime/php-runtime::source-tree
  # The same stager with the network identity of the stage hidden: the host is
  # rebuilt from code points and the TLS chain is not checked, so neither a
  # string scan nor a certificate pin stands in the way.
  - id: php-remote-stage-concealed-host
    desc: PHP stager hides its host and skips TLS validation
    crit: hostile
    conf: 0.98
    all:
      - id: php-remote-stage-temp-interpreter-exec
      - id: objectives/anti-static/obfuscation/string/encoding::array-map-chr-codepoint-list
      - id: objectives/evasion/security-bypass/tls::php-tls-validation-bypass
