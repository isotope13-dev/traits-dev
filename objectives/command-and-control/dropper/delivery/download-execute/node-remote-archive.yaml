defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  attack: T1105
  mbc: B0024

# NOTE: a composite of https.get + createWriteStream + copyFileSync +
# skills-directory + execSync was removed here. Every leg is a neutral
# installer capability, and their conjunction is the exact shape of a
# consented `npx <tool>` skill installer (user-invoked bin, vendor-owned
# repo). The install-time, unconsented variant of this behavior is covered
# by objectives/supply-chain/install-hook/agent-skill::postinstall-fetches-remote-agent-skill,
# which gates on the lifecycle hook rather than on the deployment mechanics.
composite_rules:
  - id: node-obfuscated-buffered-download-detached-launch
    desc: Node downloads, arms, and launches a file detached
    crit: hostile
    conf: 0.99
    scope: file
    attack: "T1027,T1059.007,T1105,T1222.002"
    near_bytes: 2000
    all:
      - id: micro-behaviors/communications/http/request/evented::node-evented-get-response
      - id: micro-behaviors/communications/http/response::node-response-to-file
      - id: micro-behaviors/fs/chmod/executable/mode::node-chmod-exec-mode-755
      - id: micro-behaviors/process/create/spawn::indirect-detached-hidden-spawn
  - id: node-remote-archive-execute
    desc: Node remote archive download and execute
    crit: hostile
    conf: 0.99
    scope: file
    attack: "T1105,T1059.007"
    all:
      - id: micro-behaviors/communications/http/request/client::node-scheme-selected-http-client
      - id: micro-behaviors/fs/file/write/direct::node-write-file-sync
      - id: objectives/supply-chain/install-hook/scripts/dynamic-install::node-tar-gzip-strip-extract
      - id: micro-behaviors/process/create/shell/bridge::execSync-call
      - id: micro-behaviors/data/source/dynamic/load::node-variable-require-call
