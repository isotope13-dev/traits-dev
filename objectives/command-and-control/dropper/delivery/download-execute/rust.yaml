# Hostname-unverified Rust remote executable staging. Normal native dependency installers
# may download and run tools, but they validate TLS hostnames and keep the child
# attached so failures reach the build. This chain skips hostname validation,
# writes into temporary storage, suppresses output, and either marks the file
# executable or conceals/detaches its launch.
defaults:
  platforms: [unix, windows]
  for: [rust]
  attack: T1105,T1059,T1553,T1564.003
  mbc: B0024

composite_rules:
  # A downloaded response is written as PowerShell beside a VBScript launcher,
  # then started through WScript with no window and deliberately detached. The
  # script names are unconstrained so variants cannot evade by renaming the
  # stage; the path extensions and process chain carry the behavioral meaning.
  - id: rust-hidden-wscript-temp-powershell-stage
    desc: Rust stages remote PowerShell behind a hidden WScript launcher
    crit: suspicious
    conf: 0.99
    attack: T1105,T1059.001,T1059.005,T1564.003
    near_bytes: 10000
    all:
      - id: micro-behaviors/communications/http/download/handler::rust-http-response-materialized
      - id: micro-behaviors/fs/path/temp::rust-temp-windows-script-launcher-pair
      - id: micro-behaviors/process/create/shell/script-host::rust-wscript-command
      - id: micro-behaviors/process/create/flags::rust-create-no-window-call
    any:
      - id: micro-behaviors/process/fd/stdio::rust-child-output-discarded
      - id: micro-behaviors/process/daemonize/spawn::rust-forgets-spawned-child
    needs: 1

  # Endpoint fragmentation supplies the concealment evidence that lets this
  # variant remain precise without requiring disabled certificate validation.
  # The response must still be materialized under temporary storage, marked or
  # launched as an executable, and spawned with its output hidden. This catches
  # the same dropper structure when a future variant keeps normal
  # TLS validation or switches certificate handling libraries.
  - id: rust-obfuscated-endpoint-temp-executable-dropper
    desc: Rust stealth-launches a temporary payload fetched from an obfuscated endpoint
    crit: hostile
    conf: 0.99
    attack: T1027.001,T1105,T1059,T1564.003
    near_bytes: 10000
    all:
      - id: objectives/anti-static/obfuscation/encoding/base64::rust-base64-fragmented-endpoint
      - id: micro-behaviors/communications/http/download/handler::rust-http-response-materialized
      - id: micro-behaviors/fs/path/temp::rust-temp-path
      - id: micro-behaviors/process/create/direct::rust-spawn
      - id: micro-behaviors/process/fd/stdio::rust-child-output-discarded
    any:
      - id: micro-behaviors/fs/chmod/executable/mode::rust-executable-permissions
      - id: micro-behaviors/fs/chmod/executable/mode::rust-command-chmod-plus-x
      - id: micro-behaviors/process/create/flags::rust-create-no-window-call
      - id: micro-behaviors/process/daemonize/spawn::rust-forgets-spawned-child
    needs: 1

  - id: rust-hostname-unverified-temp-executable-dropper
    desc: Rust stealth-launches hostname-unverified temporary payload
    crit: hostile
    conf: 0.99
    near_bytes: 10000
    all:
      - id: micro-behaviors/communications/http/download/handler::rust-http-response-materialized
      - id: micro-behaviors/communications/socket/ssl::rustls-no-hostname-verification
      - id: micro-behaviors/fs/path/temp::rust-temp-path
      - id: micro-behaviors/process/create/direct::rust-spawn
      - id: micro-behaviors/process/fd/stdio::rust-child-output-discarded
    any:
      - id: micro-behaviors/fs/chmod/executable/mode::rust-executable-permissions
      - id: micro-behaviors/fs/chmod/executable/mode::rust-command-chmod-plus-x
      - id: micro-behaviors/process/create/flags::rust-create-no-window-call
      - id: micro-behaviors/process/daemonize/spawn::rust-forgets-spawned-child
    needs: 1
