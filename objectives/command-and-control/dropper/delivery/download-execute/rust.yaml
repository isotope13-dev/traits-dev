# TLS-blind Rust remote executable staging. Normal native dependency installers
# may download and run tools, but they validate TLS and keep the child attached
# so failures reach the build. This chain instead accepts every certificate,
# writes into temporary storage, suppresses output, and abandons the child
# handle after launch.
defaults:
  platforms: [unix, windows]
  for: [rust]
  attack: T1105,T1059,T1553,T1564.003
  mbc: B0024

composite_rules:
  - id: rust-tls-blind-temp-executable-dropper
    desc: Rust stealth-launches TLS-unverified temporary payload
    crit: hostile
    conf: 0.99
    near_bytes: 10000
    all:
      - id: micro-behaviors/communications/http/download/handler::rust-ureq-response-to-file
      - id: objectives/evasion/security-bypass/tls::rustls-accept-all-server-verifier
      - id: micro-behaviors/fs/path/temp::rust-temp-dir
      - id: micro-behaviors/process/create/direct::rust-spawn
      - id: micro-behaviors/process/fd/stdio::rust-child-output-discarded
      - id: micro-behaviors/process/daemonize/spawn::rust-forgets-spawned-child
    any:
      - id: micro-behaviors/fs/chmod/executable/mode::rust-executable-permissions
      - id: micro-behaviors/process/create/flags::rust-create-no-window-call
    needs: 1
