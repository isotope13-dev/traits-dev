# Obfuscated Electron bundles that materialize and launch native stages.
defaults:
  platforms: [windows]
  for: [javascript, typescript]
  attack: T1105,T1059.007
  mbc: B0024

composite_rules:
  - id: electron-obfuscated-download-execute-stager
    desc: Electron bundle downloads and executes a native payload
    crit: hostile
    conf: 0.98
    all:
      - id: objectives/exfiltration/messaging/telegram::electron-payload-materialization-routines
      - id: objectives/evasion/anti-av/blinding::electron-anti-vm-routine
    unless:
      - id: metadata/signed/platform/
      - id: metadata/package/testing/
