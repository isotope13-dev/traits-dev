defaults:
  platforms: [windows]
  for: [batch]
  attack: T1105,T1059.001
  mbc: B0030

composite_rules:
  - id: batch-powershell-remote-script-stage
    desc: Raw-IP hidden PowerShell script stage
    crit: hostile
    conf: 0.99
    attack: T1105,T1059.001,T1564.003
    all:
      - id: objectives/command-and-control/dropper/execution/batch::download-file-ps
      - id: micro-behaviors/process/create/script/file::powershell-script-execution
      - id: objectives/command-and-control/dropper/execution/batch::temp-ps1-stage-path
      - id: micro-behaviors/process/create/flags::powershell-policy-bypass-flag
      - id: micro-behaviors/communications/ip/literal::batch-public-ip-literal
    any:
      - id: micro-behaviors/process/create/hidden::powershell-windowstyle-hidden-option
      - id: micro-behaviors/process/create/hidden::powershell-windowstyle-hidden

  - id: batch-raw-ip-script-stager
    desc: Batch stages a remote script from a raw IP
    crit: hostile
    conf: 0.98
    near_lines: 1
    all:
      - id: micro-behaviors/communications/http/download/curl::batch-curl-call
      - id: micro-behaviors/communications/http/download/curl::batch-curl-output-temp
      - id: micro-behaviors/communications/http/download/curl::batch-curl-http-url
      - id: micro-behaviors/communications/ip/literal::external-ipv4-http-url
      - id: micro-behaviors/os/env/vars/access::temp-env-var
