# Edge-appliance loaders that retrieve an archive over a minimal BusyBox
# userland, arm a staged executable, and launch it from temporary storage.
defaults:
  platforms: [unix, appliance]
  for: [scripts, binaries, source]
  attack: "T1105,T1059.004,T1222.002"
  mbc: B0024

composite_rules:
  - id: busybox-archive-payload-loader
    desc: BusyBox archive download and payload execution
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/communications/ftp/download/busybox::ftpget-archive
      - id: micro-behaviors/data/archive/extract/tar::tar-gzip-extract
      - id: micro-behaviors/fs/chmod/executable/mode::chmod-exec-absolute-path
      - id: micro-behaviors/process/create/local-exec::background-tmp-execution

  - id: edge-appliance-startup-payload
    desc: Edge appliance startup persistence for staged payload
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/fs/file/copy::copy-to-system-executable-path
      - id: micro-behaviors/fs/write/system-paths::system-startup-file-write
      - id: micro-behaviors/fs/chmod/executable/mode::chmod-exec-absolute-path
    any:
      - id: micro-behaviors/process/create/local-exec::background-tmp-execution
      - id: micro-behaviors/process/create/background::sh-background-subshell
      - id: micro-behaviors/data/control-flow/loop::infinite-loop-header
