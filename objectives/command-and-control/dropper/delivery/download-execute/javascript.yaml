# JScript Download-Execute Dropper
# Detects JScript/WSH droppers using obfuscated COM objects
defaults:
  platforms: [linux, macos, windows, unix, android, ios]
  crit: hostile
  conf: 0.95
  for: [javascript, xml]
traits:
- id: wsf-charcode-webdav-bat-path
  desc: WSF charcode WebDAV batch path
  crit: suspicious
  conf: 0.96
  for: [xml]
  platforms: [windows]
  if:
    type: symbol
    exact: Array
- id: wsf-fso-copyfile-stage
  desc: WSF copies staged payload file
  crit: suspicious
  conf: 0.92
  platforms: [windows]
  for: [xml]
  if:
    type: text
    regex: '(?is)CreateObject.{0,80}FileSystemObject.{0,700}\.CopyFile\s+e\s*,\s*h\s*,\s*True'
- id: wsf-hidden-cmd-bat-run
  desc: WSF hidden cmd batch execution
  crit: suspicious
  conf: 0.94
  platforms: [windows]
  for: [xml]
  if:
    type: text
    regex: '(?is)\.Run\s*"c"&"m"&"d"&"\."&"e"&"x"&"e".{0,180},\s*0\s*,\s*False'
- id: node-run-interpreter
  desc: Node wrapper runs a script interpreter
  crit: notable
  conf: 0.92
  platforms: [unix, windows]
  for: [javascript, typescript]
  if:
    type: text
    regex: 'run\s*\(\s*["''](bash|powershell)["'']'
- id: js-process-env-temp-reference
  desc: References process.env.TEMP
  crit: component
  conf: 0.9
  platforms: [windows, unix]
  for: [javascript, typescript]
  if:
    type: text
    substr: process.env.TEMP
composite_rules:
- id: wsf-webdav-hidden-bat-dropper
  desc: WSF WebDAV hidden batch dropper
  platforms: [windows]
  for: [xml]
  attack: "T1059.005, T1105"
  all:
  - id: wsf-charcode-webdav-bat-path
  - id: wsf-fso-copyfile-stage
  - id: wsf-hidden-cmd-bat-run
- id: wsf-webdav-copy-run-chain
  desc: WSF WebDAV copy run chain
  platforms: [windows]
  for: [xml]
  crit: hostile
  conf: 0.98
  attack: "T1059.005, T1105"
  all:
  - id: wsf-webdav-hidden-bat-dropper
  - id: wsf-fso-copyfile-stage
- id: js-wsh-webdav-temp-batch-stage
  desc: JScript WebDAV temp batch stage
  platforms: [windows]
  crit: suspicious
  conf: 0.94
  attack: "T1105"
  all:
  - id: micro-behaviors/communications/http/webdav::windows-webdav-unc
  - id: micro-behaviors/fs/file/copy::fso-copyfile
  - id: micro-behaviors/fs/path/temp::win-temp-env
  - id: micro-behaviors/fs/path/extension::bat-dup
- id: js-wsh-webdav-bat-dropper
  desc: JScript WebDAV batch dropper
  platforms: [windows]
  attack: "T1059.007, T1105"
  all:
  - id: js-wsh-webdav-temp-batch-stage
  - id: micro-behaviors/process/create/shell/wsh::wscript-shell-hidden-run
- id: js-hex-concat-xmlhttp-adodb-dropper
  desc: Hex-concat JScript XMLHTTP ADODB dropper
  crit: hostile
  conf: 0.97
  attack: T1059.007, T1105, T1027
  mbc: B0023, B0032
  platforms: [windows]
  for: [javascript]
  size_min: 512
  size_max: 20000
  all:
  - id: micro-behaviors/process/interpreter/scripting/jscript::jscript-cc-on
  - id: micro-behaviors/os/com/object::clsid-xmlhttp-generic
  - id: micro-behaviors/fs/write/file/stream::adodb-hex-stream-any
  - id: micro-behaviors/fs/write/file/stream::savetofile-hex-tofi-any
  - id: micro-behaviors/fs/write/file/stream::savetofile-hex-save-any
  - id: objectives/anti-static/obfuscation/syntax::js-wscript-dynamic-property-ast
- id: js-obfuscated-dropper-combo
  desc: "Obfuscated JScript Download-Execute Combo"
  mbc: "B0032.001"
  attack: "T1059.007"
  all:
  - id: objectives/execution/interpreter/scripting/host::activex-object-obfuscated
  - id: objectives/execution/interpreter/scripting/host::xmlhttp-obfuscated-fragment
  - id: objectives/execution/interpreter/scripting/host::adodb-stream-obfuscated
  any:
  - id: micro-behaviors/data/format/executable/header::mz-header-check
  - id: objectives/anti-static/obfuscation/syntax::js-property-concatenation-obfuscation
  - id: micro-behaviors/communications/http/url/query::dropper-common-params
- id: js-wsh-responsebody-save-dropper
  desc: "Obfuscated WSH ResponseBody dropper"
  platforms: [windows]
  attack: "T1059.007, T1105"
  all:
  - id: objectives/execution/interpreter/scripting/host::wscript-shell-obfuscated-dup
  - id: objectives/execution/interpreter/scripting/host::adodb-stream-obfuscated
  - id: objectives/execution/interpreter/script/wsh::wsh-response-body
  - id: objectives/execution/interpreter/script/wsh::wsh-save-to-file
  any:
  - id: objectives/execution/interpreter/script/wsh::wsh-expand-env-strings
  - id: micro-behaviors/process/create/shell/wsh::wscript-shell-run-indirect
- id: node-curl-chmod-spawn-native-launcher
  desc: Node downloads and launches a native binary
  crit: hostile
  conf: 0.99
  attack: "T1105,T1059.007,T1222.002"
  all:
  - id: micro-behaviors/communications/http/download/cli::fetch-output-flag-script
  - id: micro-behaviors/fs/chmod/executable/mode::node-chmod-exec-mode-755
  - id: micro-behaviors/process/create/spawn::spawn-call
- id: node-https-materialize-detached-launch
  desc: Node downloads, makes executable, and detaches a file
  crit: hostile
  conf: 0.99
  attack: "T1105,T1059.007,T1222.002"
  mbc: "B0024,E1222"
  for: [javascript, typescript]
  scope: file
  near_bytes: 16384
  all:
  - id: micro-behaviors/communications/http/request/client::https-get
  - id: micro-behaviors/fs/file/write/direct::node-write-file-sync
  - id: micro-behaviors/fs/chmod/executable/mode::node-computed-chmod-exec-mode-755
  - id: micro-behaviors/process/create/spawn::detached-ignored-unref-spawn
- id: node-obfuscated-self-cleaning-loader
  desc: Node decodes and executes a self-cleaning loader
  crit: hostile
  conf: 0.99
  attack: "T1027,T1059.007,T1105"
  for: [javascript, typescript]
  near_lines: 24
  all:
  - id: micro-behaviors/data/decode/custom::fromcharcode-apply-array
  - id: micro-behaviors/process/create/shell/bridge::execSync-dynamic-command
  - id: micro-behaviors/data/source/dynamic/load::node-variable-require-call
  - id: micro-behaviors/fs/file/delete::fs-unlinkSync
- id: node-https-stream-chmod-detached-native-launcher
  desc: Node streams remote executable into detached launch
  crit: hostile
  conf: 0.99
  attack: "T1105,T1059.007,T1222.002"
  for: [javascript]
  near_lines: 80
  all:
  - id: micro-behaviors/communications/http/request/client::node-https-get-destructured
  - id: micro-behaviors/communications/http/response::node-response-pipe
  - id: micro-behaviors/fs/write/file/direct::create-write-stream
  - id: micro-behaviors/fs/chmod/executable/mode::node-chmod-exec-mode-755
  - id: micro-behaviors/process/create/spawn::detached-ignored-unref-spawn
- id: node-https-stream-chmod-background-launcher
  desc: Node downloads, arms, and backgrounds remote file
  crit: hostile
  conf: 0.99
  attack: "T1105,T1059.007,T1222.002"
  mbc: "B0024,E1222"
  for: [javascript, typescript]
  near_lines: 80
  all:
  - id: micro-behaviors/communications/http/download/handler::node-http-stream-to-file
  - id: micro-behaviors/fs/chmod/executable/mode::node-chmod-make-executable
  - id: micro-behaviors/process/create/shell/bridge::js-execsync-backgrounds-variable-command

- id: node-windows-temp-exe-hidden-download-launch
  desc: Node downloads and hides a TEMP executable launch
  crit: hostile
  conf: 0.99
  attack: T1105,T1059.007,T1564.003
  for: [javascript, typescript]
  platforms: [windows]
  near_lines: 80
  all:
  - id: micro-behaviors/communications/http/request/client::https-get
  - id: micro-behaviors/communications/http/download/handler::node-http-stream-to-file
  - id: micro-behaviors/fs/path/temp::node-temp-env-executable-path
  - id: micro-behaviors/process/create/spawn::detached-ignored-unref-spawn
  - id: micro-behaviors/process/create/spawn::windowshide-option

- id: node-python-runtime-bootstrap-exec
  desc: Node downloads Python runtime content and executes its pip bootstrap
  crit: hostile
  conf: 0.99
  attack: "T1105,T1059.006,T1059.007"
  for: [javascript, typescript]
  scope: file
  all:
  - id: micro-behaviors/communications/http/url/path::js-interpreter-runtime-download-url
  - id: objectives/command-and-control/dropper/standalone::get-pip-script-fetch
  - id: micro-behaviors/fs/write/file/direct::create-write-stream
  - id: micro-behaviors/process/create/shell/bridge::execSync-call

- id: node-remote-script-interpreter-launcher
  desc: Node downloads a file and launches a script interpreter
  crit: hostile
  conf: 0.97
  attack: "T1105,T1059"
  for: [javascript, typescript]
  near_lines: 320
  all:
  - id: node-script-interpreter-launch
  - id: micro-behaviors/communications/http/request/client::https-get
  - id: node-remote-file-materialization
  unless:
  - id: well-known/app/ai/pi-studio::pi-studio-archive-context
  - id: well-known/app/ai/pi-studio::pi-studio-fetch-pi-context
  # The three legs never establish that the interpreter runs what was
  # downloaded, and a 320-line window spans a whole module.  Every
  # prebuilt-binary installer fetches an archive and shells out to an extractor
  # -- Microsoft's own vscode-test runs `powershell -Command Expand-Archive` on
  # the VS Code zip it just fetched -- so unpacking the download is not
  # executing it.  Extraction is data handling; the payload-execution shape is
  # covered by the native-binary and eval droppers.
  - id: micro-behaviors/data/archive/extract/zip::powershell-expand-archive-text
  - id: micro-behaviors/data/archive/extract/zip::node-spawn-unzip-extract
  - id: micro-behaviors/data/archive/extract/tar::node-spawn-tar-extract
- id: node-script-interpreter-launch
  desc: Node launches a shell or script interpreter
  crit: notable
  conf: 0.94
  for: [javascript, typescript]
  any:
  - id: micro-behaviors/process/create/shell/bridge::js-spawnsync-interpreter
  - id: micro-behaviors/process/create/shell/interpreter::node-spawn-posix-interpreter
  - id: node-run-interpreter
- id: node-remote-file-materialization
  desc: Node materializes an HTTP response into a file
  crit: notable
  conf: 0.94
  for: [javascript, typescript]
  any:
  - id: micro-behaviors/communications/http/download/handler::node-http-stream-to-file
  - id: micro-behaviors/communications/http/response::node-response-to-file
- id: obfuscated-node-curl-exe-download-exec
  desc: Obfuscated Node curl downloads and executes remote EXE
  crit: hostile
  conf: 0.98
  attack: T1105,T1059.007,T1027
  platforms: [windows, macos, linux]
  for: [javascript, typescript]
  near_lines: 3
  all:
  - id: objectives/anti-static/obfuscation/obfuscator/js-obfuscator::hex-name-mangling-with-string-table-rotation
  - id: micro-behaviors/communications/http/download/curl::js-obfuscator-curl-output-literal
  - id: micro-behaviors/process/create/shell/bridge::js-exec-callback-reexec
  any:
  - id: micro-behaviors/fs/path/temp::node-temp-env-executable-path
  - id: js-process-env-temp-reference
