# Unsigned PE that talks to a PHP gate and also creates a thread or writes
# registry persistence is a downloader, not a leftover URL in a document.
defaults:
  platforms: [windows]
  for: [pe]
  attack: T1105,T1071.001
  crit: hostile
  conf: 0.94

composite_rules:
  - id: php-gate-thread-downloader
    desc: PHP gate downloader creates a thread
    all:
      - id: micro-behaviors/communications/http/url/php-endpoint::php-gate-path
      - id: micro-behaviors/process/create/thread::create-thread
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/installer/family/
      - id: well-known/lib/

  - id: php-gate-registry-downloader
    desc: PHP gate downloader writes registry keys
    all:
      - id: micro-behaviors/communications/http/url/php-endpoint::php-gate-path
      - id: micro-behaviors/os/registry/manipulate::registry-write-api-chain
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/installer/family/
      - id: well-known/lib/

  - id: php-gate-explorer-run-dropper
    desc: PHP gate dropper uses Explorer Run policy
    all:
      - id: micro-behaviors/communications/http/url/php-endpoint::php-gate-path
      - id: objectives/persistence/login/multi-technique::policies-explorer-run-key-path
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/installer/family/
      - id: well-known/lib/

  # Clickers and compact downloaders talk to a PHP URL over WinInet without
  # also writing a Run key. The PHP endpoint plus the fetch APIs is the dropper.
