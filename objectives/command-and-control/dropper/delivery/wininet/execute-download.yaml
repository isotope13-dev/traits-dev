defaults:
  attack: T1105
  mbc: E1105
  platforms: [unix, windows]
  for: [pe, dll]

composite_rules:
- id: hostile-downloader-wininet
  desc: Hostile Downloader (Network -> Memory -> Process)
  crit: hostile
  conf: 0.9
  size_max: 524288
  unless:
  - id: well-known/game/steam/
  - id: metadata/binary/installer/script/
  all:
  - id: micro-behaviors/communications/http/client/wininet::internet-read-file
  - id: micro-behaviors/mem/alloc/virtual::virtual-alloc
  - id: micro-behaviors/process/create/spawn::create-process-w
  - id: metadata/binary/symbols/imports::pe-imports-max-80
- id: unsigned-wininet-vm-evasion-client
  desc: Unsigned WinInet client with VM or analyst evasion
  crit: hostile
  conf: 0.95
  attack: T1105,T1497,T1622
  platforms: [windows]
  all:
  - id: micro-behaviors/communications/http/client/wininet::wininet-http-flow
  - id: metadata/signed/trust-level::unsigned-missing-signature-record
  - id: micro-behaviors/os/virtualization/hypervisor::multiple-hypervisor-indicators
  any:
  - id: micro-behaviors/process/debug/tool-markers::analyst-tool-name-cluster
  - id: micro-behaviors/communications/http/authorization-header::bearer-prefix
  needs: 1
  unless:
  - id: metadata/signed/platform/
  - id: metadata/binary/installer/family/
  - id: well-known/tool/
- id: autoit-admin-wininet-injector
  desc: Elevated AutoIt injector with WinInet staging
  crit: hostile
  conf: 0.97
  platforms: [windows]
  attack: T1055,T1071.001
  all:
  - id: metadata/lang/compiled::autoit-compiled-script
  - id: metadata/build/manifest::pe-requires-admin
  - id: micro-behaviors/communications/http/client/wininet::wininet-http-flow
  - id: micro-behaviors/mem/write/arbitrary::write-process-memory-dup
  any:
  - id: micro-behaviors/mem/alloc/remote::virtual-alloc-ex
  - id: micro-behaviors/process/info/thread::resume-thread-import
  - id: micro-behaviors/process/create/spawn::create-process-w
  needs: 2
  unless:
  - id: metadata/signed/platform/
  - id: metadata/signed/developer/
  - id: well-known/app/utility/sordum::bluelife-hosts-editor
  # Sordum AutoIt tools (PowerRun, DNS Jumper) ship the interpreter's
  # WriteProcessMemory, VirtualAllocEx, and WinInet imports. The script
  # elevates or edits DNS; it does not inject a staged payload.
  - id: well-known/app/utility/sordum::sordum-utility
  - id: well-known/app/utility/sordum::sordum-dnsjumper
  - id: well-known/app/utility/sordum::bluelife-hosts-editor-company
  - id: well-known/tool/sysadmin/autoit::official-autoit-interpreter-runtime
- id: autoit-wininet-injector
  desc: AutoIt injector with WinInet staging
  # Non-elevated sibling of autoit-admin-wininet-injector. Require the
  # remote allocation, memory write, and remote-thread APIs: AutoIt runtime
  # imports can otherwise make WinInet and generic process APIs look like an
  # injector even when the embedded script does not use them that way.
  crit: hostile
  conf: 0.95
  platforms: [windows]
  attack: T1055,T1071.001
  all:
  - id: metadata/lang/compiled::autoit-compiled-script
  - id: micro-behaviors/communications/http/client/wininet::wininet-http-flow
  - id: micro-behaviors/mem/write/arbitrary::write-process-memory-dup
  - id: micro-behaviors/mem/alloc/remote::virtual-alloc-ex
  - id: micro-behaviors/process/inject/remote-thread::create-remote-thread
  unless:
  - id: metadata/signed/platform/
  - id: metadata/signed/developer/
  - id: well-known/app/utility/sordum::bluelife-hosts-editor
  - id: well-known/tool/sysadmin/autoit::official-autoit-interpreter-runtime
- id: packed-autoit-wininet-runpe-dropper
  desc: Packed AutoIt WinInet RunPE dropper
  crit: hostile
  conf: 0.97
  platforms: [windows]
  size_min: 900000
  size_max: 1800000
  all:
  - id: objectives/evasion/process/injection/hollowing/process::packed-autoit-runpe-primitives
  - id: micro-behaviors/communications/http/client/wininet::wininet-http-request-strings
  - id: micro-behaviors/hardware/input/block::block-input-import
  any:
  - id: micro-behaviors/hardware/input/keyboard/poll::get-keyboard-state-str
  - id: micro-behaviors/hardware/input/event::synthetic-user-input
  - id: micro-behaviors/hardware/display/screen::gdi-getdibits
  - id: micro-behaviors/os/autorun/keyword::startup-keyword
  needs: 2

- id: wininet-raw-ip-pe-download-runner
  desc: WinInet fetches remote PE over raw IP
  crit: hostile
  conf: 0.98
  platforms: [windows]
  size_max: 65536
  all:
  - id: micro-behaviors/communications/ip/literal::http-ip-url
  - id: micro-behaviors/communications/http/client/wininet::wininet-http-flow
  - id: micro-behaviors/communications/http/download/url::executable-url-reference-pe
  - id: micro-behaviors/communications/http/client/wininet::internet-read-file
  any:
  - id: micro-behaviors/process/create/exec::create-process-a
  - id: micro-behaviors/process/create/spawn::create-process-w
  - id: micro-behaviors/mem/protect/modify::virtual-protect
  unless:
  - id: metadata/signed/platform/
  - id: metadata/binary/installer/family/
- id: wininet-staged-agent-enc-downloader
  desc: WinInet downloads staged agent.enc implant
  crit: hostile
  conf: 0.97
  attack: T1105,T1027.002
  platforms: [windows]
  size_max: 65536
  all:
  - id: micro-behaviors/communications/http/client/wininet::wininet-http-flow
  - id: micro-behaviors/communications/http/client/wininet::internet-read-file
  - id: micro-behaviors/communications/http/download/url::staged-agent-enc-url-reference-pe
  any:
  - id: micro-behaviors/process/create/exec::create-process-a
  - id: micro-behaviors/mem/protect/modify::virtual-protect
  - id: micro-behaviors/mem/alloc/virtual::virtual-alloc
  unless:
  - id: metadata/signed/platform/
  - id: metadata/binary/installer/family/
- id: wininet-raw-ip-staged-agent-download-loader
  desc: WinInet downloads encrypted agent.enc payload over raw IP
  crit: hostile
  conf: 0.98
  attack: T1105,T1027.002
  platforms: [windows]
  size_max: 65536
  all:
  - id: wininet-staged-agent-enc-downloader
  - id: micro-behaviors/communications/ip/literal::http-ip-url
  unless:
  - id: metadata/signed/platform/
  - id: metadata/binary/installer/family/
- id: wininet-temp-executable-dropper
  desc: WinInet stages downloaded EXE under GetTempPath
  crit: hostile
  conf: 0.97
  platforms: [windows]
  size_max: 65536
  all:
  - id: micro-behaviors/communications/http/client/wininet::wininet-http-flow
  - id: micro-behaviors/communications/http/download/url::executable-url-reference-pe
  - id: micro-behaviors/os/sysinfo/directories::win32-temp-path-import
  - id: micro-behaviors/process/create/exec::create-process-a
  unless:
  - id: metadata/signed/platform/
  - id: metadata/binary/installer/family/
- id: xor-wininet-download-exec
  desc: XOR-obfuscated WinInet downloader executes process
  crit: hostile
  conf: 0.98
  attack: T1105,T1059.003,T1027.002
  platforms: [windows]
  size_max: 524288
  all:
  - id: micro-behaviors/communications/http/url/domain::xor-decoded-http-url
  - id: objectives/anti-static/obfuscation/decoders::xor-decoded-http-api
  any:
  - id: micro-behaviors/process/create/exec::create-process-a
  - id: micro-behaviors/process/create/spawn::create-process-w
  - id: micro-behaviors/process/create/shellexec::shell-execute
  unless:
  - id: metadata/signed/platform/
  - id: metadata/binary/installer/family/

- id: wininet-decompress-shellexec-dropper
  desc: WinInet client decompresses payload and ShellExecutes it
  crit: hostile
  conf: 0.98
  attack: T1105,T1140,T1059.003
  platforms: [windows]
  size_max: 524288
  all:
  - id: micro-behaviors/fs/path/library::wininet-dll-name-reference
  - id: micro-behaviors/data/codec::rtl-decompress-buffer
  - id: micro-behaviors/process/create/shellexec::shell-execute-call
  any:
  - id: micro-behaviors/communications/ip/literal::external-ipv4-shaped-text-binary
  - id: micro-behaviors/communications/http/client/wininet::internet-close-handle-str
  - id: micro-behaviors/data/format/mime::wildcard-application-mime
  needs: 1
  unless:
  - id: metadata/signed/platform/
  - id: metadata/binary/installer/family/
