# BITS with IWR fallback, then IEX of the staged file and immediate delete.
defaults:
  platforms: [windows]
  for: [powershell, html, javascript]
  attack: T1105,T1059.001,T1197
  mbc: B0030

traits:
  - id: iex-getcontent-raw-cleanup
    desc: IEX runs Get-Content then deletes
    crit: suspicious
    conf: 0.96
    if:
      type: text
      regex: '(?i)iex\s*\(\s*(gc|Get-Content)\s+\$\w+\s+-Raw\s*\)\s*;\s*ri\s+\$'

composite_rules:
  - id: powershell-bits-iex-temp-cleanup
    desc: BITS IWR stage IEX then deleted
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/communications/http/download/manager::bits-transfer-cmdlet
      - id: micro-behaviors/communications/http/lib/invoke-webrequest::invoke-webrequest
      - id: iex-getcontent-raw-cleanup
