# Payload fetched through the GitHub *API* rather than a raw URL.
#
# The Contents API answers with a JSON object carrying the blob's 40-hex `sha`,
# and a caller that opts into that path sets a `gitApi` switch. Neither fact
# names a campaign: they describe a delivery route that survives the repository,
# the branch and the filename changing, which is why they belong here rather
# than under the family they were first written for.
#
# Relocated from `well-known/malware/supply-chain/ultralytics`, where the same
# two matchers sat beside that campaign's Monero wallet and `safe_run` helper.
# The family rule now references these; its own traits stayed with it.
defaults:
  platforms: [unix, windows]
  for: [python]
  attack: T1105
  mbc: B0024

traits:
  - id: git-blob-sha
    desc: GitHub API blob sha field
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '"sha"\s*:\s*"[a-f0-9]{40}"'
  - id: gitapi-param
    desc: GitHub API delivery switch
    crit: notable
    conf: 0.9
    if:
      type: text
      substr: gitApi=True

composite_rules:
  # Both halves of the API route: the switch that selects it and the blob
  # response it returns. Component because a payload still has to be done
  # something with -- the family rules supply that.
  - id: github-api-blob-fetch
    desc: Payload fetched through the GitHub blob API
    crit: component
    conf: 0.9
    all:
      - id: git-blob-sha
      - id: gitapi-param
