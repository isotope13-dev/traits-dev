defaults:
  platforms: [windows, unix]
  for: [scripts, binaries]
traits: []
composite_rules:
  - id: execute-comp
    for: [shell, python, javascript]
    desc: GitHub blob endpoint used with local execution
    conf: 0.95
    crit: suspicious
    mbc: B0024
    attack: T1195.002
    near_bytes: 768
    all:
      - id: micro-behaviors/communications/http/services/github::github-git-blob-api-endpoint
    any:
      - id: micro-behaviors/fs/chmod/modify::python-os-chmod
      - id: micro-behaviors/process/create/subprocess/
      - id: metadata/binary/symbols/name/token::pyc-subprocess-name-reference
      - id: metadata/lang/source/syntax/call/arguments::urlencoded-groovy-processbuilder
    unless:
      - id: metadata/path::test-directory-component
