defaults:
  # These are shell command strings. The file previously declared `for: [scala]`
  # alone, which left `curl-insecure-hidden-stage-background` dead: its
  # `chmod-hidden-stage` leg has no Scala spelling, so no declared type could
  # satisfy the rule.
  for: [scripts]
  platforms: [linux, macos, windows]
  attack: T1105
  mbc: B0024
traits:
- id: github-latest-release-asset-url
  desc: GitHub latest-release asset URL
  crit: notable
  conf: 0.88
  if:
    type: text
    regex: 'github\.com/[A-Za-z0-9._-]+/[A-Za-z0-9._-]+/releases/latest/download/'
- id: curl-insecure-silent-follow
  desc: curl ignores TLS and follows redirects silently
  crit: notable
  conf: 0.9
  if:
    type: text
    regex: '\bcurl\s+-[A-Za-z]*s[A-Za-z]*k[A-Za-z]*L|curl\s+-[A-Za-z]*s[A-Za-z]*L[A-Za-z]*k'
composite_rules:
- id: github-latest-hidden-sshd-stage
  desc: GitHub latest release drops hidden /tmp/.sshd stage
  crit: hostile
  conf: 0.97
  all:
  # The canonical hidden-sshd path atom. A local `substr: /tmp/.sshd` trait
  # stood here and was covered verbatim by this regex and four others.
  - id: objectives/credential-access/pam/intercept::sshd-credential-log-path
  - id: github-latest-release-asset-url
  unless:
  - id: metadata/build/archive::source-archive-member
- id: curl-insecure-hidden-stage-background
  desc: curl drops hidden stage and backgrounds execution
  crit: hostile
  conf: 0.96
  near_lines: 1
  all:
  - id: curl-insecure-silent-follow
  - id: micro-behaviors/process/create/shell/tmp-exec::hidden-stage-background-exec
  - id: objectives/command-and-control/dropper/delivery/execute-download::chmod-hidden-stage
  unless:
  - id: metadata/build/archive::source-archive-member
