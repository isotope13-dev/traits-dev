# One-file cabinets that wrap a packed, managed, or VB6 executable are
# droppers: the cabinet exists to move that one payload past filters.
defaults:
  platforms: [windows]
  for: [cab, pe]
  attack: T1027.013,T1204.002
  crit: hostile
  conf: 0.94

composite_rules:
  - id: cab-packed-exe-dropper
    desc: One-file cabinet wraps a packed executable
    scope: archive
    all:
      - id: objectives/command-and-control/dropper/delivery/cab::cab-container-format
      - id: metadata/file/archive::archive-misplaced-executable-member
      - id: metadata/binary/code/entropy::high-code-entropy
    unless:
      - id: metadata/signed/platform/

  - id: cab-dotnet-exe-dropper
    desc: One-file cabinet wraps a managed executable
    scope: archive
    all:
      - id: objectives/command-and-control/dropper/delivery/cab::cab-container-format
      - id: metadata/file/archive::archive-misplaced-executable-member
      - id: metadata/lang/compiler/managed::mscorlib
    unless:
      - id: metadata/signed/platform/

  - id: cab-vb6-exe-dropper
    desc: One-file cabinet wraps a VB6 executable
    scope: archive
    all:
      - id: objectives/command-and-control/dropper/delivery/cab::cab-container-format
      - id: metadata/file/archive::archive-misplaced-executable-member
      - id: metadata/binary/framework::vb6-runtime-core-helper
    unless:
      - id: metadata/signed/platform/

  - id: cab-stub-exe-dropper
    desc: One-file cabinet wraps a single-import stub
    scope: archive
    all:
      - id: objectives/command-and-control/dropper/delivery/cab::cab-container-format
      - id: metadata/file/archive::archive-misplaced-executable-member
      - id: metadata/binary/symbols/imports::single-import-count
    unless:
      - id: metadata/signed/platform/

  - id: cab-double-ext-dropper
    desc: One-file cabinet wraps a double-extension exe
    scope: archive
    all:
      - id: objectives/command-and-control/dropper/delivery/cab::cab-container-format
      - id: metadata/file/archive::archive-misplaced-executable-member
      - id: objectives/evasion/masquerade/file/double-ext::basename-is-doc-double-exe
    unless:
      - id: metadata/signed/platform/

  - id: cab-script-obfuscated-dropper
    desc: One-file cabinet wraps obfuscated VBS
    scope: archive
    for: [cab, vbs, pe]
    all:
      - id: objectives/command-and-control/dropper/delivery/cab::cab-script-member-entry
      - id: objectives/anti-static/obfuscation/name-mangling/variables::vbs-generated-identifiers

  - id: cab-png-resource-dropper
    desc: One-file cabinet wraps a PNG-in-resource exe
    scope: archive
    all:
      - id: objectives/command-and-control/dropper/delivery/cab::cab-container-format
      - id: metadata/file/archive::archive-misplaced-executable-member
      - id: metadata/binary/resource/embedded-media::png-magic-in-text
    unless:
      - id: metadata/signed/platform/

  - id: cab-future-stamp-dropper
    desc: One-file cabinet wraps a post-2030 PE
    scope: archive
    all:
      - id: objectives/command-and-control/dropper/delivery/cab::cab-container-format
      - id: metadata/file/archive::archive-misplaced-executable-member
      - id: objectives/evasion/indicator-removal/timestamps::header-timestamp-post-2030
    unless:
      - id: metadata/signed/platform/

  - id: cab-clr-entropy-dropper
    desc: One-file cabinet wraps a packed CLR resource
    scope: archive
    all:
      - id: objectives/command-and-control/dropper/delivery/cab::cab-container-format
      - id: metadata/file/archive::archive-misplaced-executable-member
      - id: metadata/binary/resource/size::clr-resource-high-entropy
    unless:
      - id: metadata/signed/platform/

  - id: cab-template-manifest-dropper
    desc: One-file cabinet wraps a stock VS manifest
    scope: archive
    all:
      - id: objectives/command-and-control/dropper/delivery/cab::cab-container-format
      - id: metadata/file/archive::archive-misplaced-executable-member
      - id: metadata/build/manifest::pe-manifest-myapplication-template
    unless:
      - id: metadata/signed/platform/

  - id: cab-vb6-concealed-dropper
    desc: One-file cabinet wraps concealed VB6 dispatch
    scope: archive
    all:
      - id: objectives/command-and-control/dropper/delivery/cab::cab-container-format
      - id: metadata/file/archive::archive-misplaced-executable-member
      - id: objectives/anti-static/obfuscation/payload/encrypted::vb6-concealed-high-entropy-dispatch
    unless:
      - id: metadata/signed/platform/

  - id: cab-script-wsh-dropper
    desc: One-file cabinet wraps late-bound WSH VBS
    scope: archive
    for: [cab, vbs, pe]
    all:
      - id: objectives/command-and-control/dropper/delivery/cab::cab-script-member-entry
      - id: objectives/anti-static/obfuscation/wsh::vbs-createobject-variable-arg

  - id: cab-minimal-load-dropper
    desc: One-file cabinet wraps a dynamic-load stub
    scope: archive
    all:
      - id: objectives/command-and-control/dropper/delivery/cab::cab-container-format
      - id: metadata/file/archive::archive-misplaced-executable-member
      - id: objectives/anti-static/obfuscation/payload/import::minimal-pe-dynamic-load
    unless:
      - id: metadata/signed/platform/
