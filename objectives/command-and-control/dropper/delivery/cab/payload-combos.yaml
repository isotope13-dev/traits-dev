# Extra cabinet-dropper pairings: lure names, COM stubs, scripts, and
# listing-only shapes that packed-dropper.yaml does not already cover.
defaults:
  platforms: [windows]
  for: [cab, pe]
  attack: T1027.013,T1204.002
  crit: hostile
  conf: 0.94

composite_rules:
  - id: cab-lure-order-dropper
    desc: Cabinet wraps an order-lure executable
    scope: archive
    all:
      - id: objectives/command-and-control/dropper/delivery/cab::cab-container-format
      - id: metadata/file/archive::archive-misplaced-executable-member
      - id: objectives/evasion/masquerade/file/lure::order-exe-lure
    unless:
      - id: metadata/signed/platform/

  - id: cab-lure-quote-dropper
