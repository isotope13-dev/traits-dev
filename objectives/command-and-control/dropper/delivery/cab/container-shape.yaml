# Cabinet files as a delivery container.
#
# CAB is a mail-attachment carrier: Windows opens it natively, it survives
# gateways that strip .exe, and until recently nothing read its member table at
# all. The rules here work purely on the member listing, which the CFHEADER
# walk exposes even when the payload cannot be decompressed.
#
# The shape that matters is the one-file cabinet. A genuine cabinet carries a
# set -- an update package, a driver, a trust list with its metadata. A
# cabinet built to hold exactly one executable was built to move that
# executable, and the sample set bears this out: the multi-member cabinets are
# Microsoft's signed update packages, and the single-executable ones are
# invoice, remittance and SWIFT-message lures.
# Each rule below requires the MSCF magic explicitly. `for: [cab]` is not
# enough on its own: at archive scope the declared file type is not enforced
# against the member the evidence comes from, so "cabinet carries a single
# script member" was landing on ordinary single-entry .zip files -- HandBrake's
# zipped Photoshop asset, Homebrew's AppWithBinary.zip test fixture, a zipped
# __init__.py. The legs themselves (`archive-sole-member`,
# `archive-contains-script-member`) are generic archive facts and say nothing
# about cabinets.
defaults:
  platforms: [windows]
  for: [cab]
  attack: T1027.013,T1204.002
  mbc: B0024

traits:
  # Business-document lure names on cabinet members. The engine exposes the
  # CAB member table through archive.members[*].path but never computes the
  # archive.file_count / executable_count metrics the shape composites below
  # need, so a lure-named executable member is the evidence that survives.
  # Microsoft's own single-member cabinets are trust lists and updates, never
  # invoice / remittance / SWIFT executables.
  - id: cab-business-lure-exe-member
    desc: Business-lure executable cabinet member
    crit: suspicious
    conf: 0.93
    if:
      type: value
      path: "archive.members[*].path"
      regex: '(?i)\b(remittance|invoice|payment|purchase[ _-]*order|statement|swift|receipt)\b.*\.exe$'

composite_rules:
  # A cabinet whose executable member wears an invoice / remittance / SWIFT
  # lure name is the malspam delivery shape described above. No legitimate
  # cabinet names an executable this way, so the pairing is hostile rather
  # than merely suspicious containment.
  - id: cab-business-lure-exe-payload
    desc: Cabinet delivers business-lure executable
    crit: hostile
    conf: 0.96
    all:
      - id: metadata/build/archive::archive-windows-executable-entry
      - id: cab-business-lure-exe-member
    unless:
      - id: metadata/signed/platform/

  - id: cab-sole-executable-payload
    desc: Cabinet carries a single executable member
    crit: suspicious
    conf: 0.93
    all:
      - id: metadata/file/magic/identity::cab-mscf
      - id: metadata/file/archive::archive-sole-member
      - id: metadata/file/archive::archive-contains-executable-member
    unless:
      # A signed cabinet is a real distribution artifact; Microsoft's own
      # single-member trust lists are the case this must not fire on, and
      # platform trust is how they say so.
      - id: metadata/signed/platform/

  - id: cab-sole-script-payload
    desc: Cabinet carries a single script member
    crit: suspicious
    conf: 0.93
    all:
      - id: metadata/file/magic/identity::cab-mscf
      - id: metadata/file/archive::archive-sole-member
      - id: metadata/file/archive::archive-contains-script-member
    unless:
      - id: metadata/signed/platform/
