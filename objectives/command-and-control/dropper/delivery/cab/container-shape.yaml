# Cabinet files as a delivery container.
#
# CAB is a mail-attachment carrier: Windows opens it natively, it survives
# gateways that strip .exe, and until recently nothing read its member table at
# all. The rules here work purely on the member listing, which the CFHEADER
# walk exposes even when the payload cannot be decompressed.
#
# The shape that matters is the one-file cabinet. A genuine cabinet carries a
# set -- an update package, a driver, a trust list with its metadata. A
# cabinet built to hold exactly one executable was built to move that
# executable, and the sample set bears this out: the multi-member cabinets are
# Microsoft's signed update packages, and the single-executable ones are
# invoice, remittance and SWIFT-message lures.
# Each rule below requires the cabinet container-format leg explicitly.
# `for: [cab]` is not enough on its own: at archive scope the declared file
# type is not enforced against the member the evidence comes from, so
# "cabinet carries a single script member" was landing on ordinary
# single-entry .zip files -- HandBrake's zipped Photoshop asset, Homebrew's
# AppWithBinary.zip test fixture, a zipped __init__.py. The legs themselves
# (`archive-sole-member`, `archive-contains-script-member`) are generic
# archive facts and say nothing about cabinets.
defaults:
  platforms: [windows]
  for: [cab, msi, oledoc]
  attack: T1027.013,T1204.002
  mbc: B0024

traits:
  # Member-path fragments are component-only: without the container-format leg
  # they also match other archives. The composites below pair each path with
  # metadata/file/archive::cab-container-format. The neutral cabinet shape
  # facts (container format, script/DLL/CSV/OneNote members, member count)
  # moved to metadata/file/archive/cabinet.yaml in 2026-09.
  - id: cab-business-lure-exe-member-path
    for: [cab]
    desc: Business-lure executable member path
    crit: component
    conf: 0.93
    if:
      type: value
      path: "archive.members[*].path"
      regex: '(?i)\b(remittance|invoice|payment|purchase[ _-]*order|statement|swift|receipt)\b.*\.exe$'
  - id: cab-business-lure-member-name-path
    for: [cab]
    desc: Business-lure member name path
    crit: component
    conf: 0.93
    if:
      type: value
      path: "archive.members[*].path"
      regex: '(?i)(^|[\W_])(remittance|invoice|payment|purchase.?order|statement|swift|receipt)([\W_]|$)'
  # Business-lure stem AND Windows-script suffix in one member path
  # (`Ziraat_Bankasi_Swift_Messaji.cmd`, `invoice_payment.cmd`). The two
  # component atoms above split the evidence apart; neither can stand alone
  # (bare suffixes match zip fixtures, bare stems match `swift.js`), but the
  # pairing -- a lure-named executable script inside an archive -- is rare in
  # legitimate software and analyst-relevant on its own, so it is notable.
  # `js`/`jse` stay out of the suffix set: language-syntax files (`swift.js`)
  # and locale bundles (`receipt.js`) would otherwise match. `receipts.cmd`
  # and `myreceipt.cmd` do not match: the stem must end at a separator.
  # Split into three stem groups only to stay under the 90-byte matcher cap;
  # the hostile below ORs them with a sibling `any:` so every leg stays
  # atomic (a composite roll-up would not resolve as a leg at scan time).
  - id: cab-lure-script-member-a
    for: [cab]
    desc: Lure-named script member (invoice group)
    crit: notable
    conf: 0.9
    if:
      type: value
      path: "archive.members[*].path"
      regex: '(?i)(^|[\W_])(invoice|payment|swift)([\W_].*)?\.(bat|cmd|vbs|vbe|wsf|wsh|ps1|hta)$'
  - id: cab-lure-script-member-b
    for: [cab]
    desc: Lure-named script member (receipt group)
    crit: notable
    conf: 0.9
    if:
      type: value
      path: "archive.members[*].path"
      regex: '(?i)(^|[\W_])(receipt|statement)([\W_].*)?\.(bat|cmd|vbs|vbe|wsf|wsh|ps1|hta)$'
  - id: cab-lure-script-member-c
    for: [cab]
    desc: Lure-named script member (remittance group)
    crit: notable
    conf: 0.9
    if:
      type: value
      path: "archive.members[*].path"
      regex: '(?i)(^|[\W_])(remittance|purchase.?order)([\W_].*)?\.(bat|cmd|vbs|vbe|wsf|wsh|ps1|hta)$'
  - id: cab-system-dll-member-path
    for: [cab]
    desc: System-DLL-named member path
    crit: component
    conf: 0.9
    if:
      type: value
      path: "archive.members[*].path"
      regex: '(?i)(^|/)(winmm|version|dbghelp|wtsapi32|uxtheme|msimg32|secur32|dwmapi|d3d9)\.dll$'
composite_rules:
  - id: cab-business-lure-exe-member
    desc: Business-lure executable cabinet member
    crit: suspicious
    conf: 0.93
    # `cab-container-format` keeps this cabinet-specific: the member-path
    # legs alone would also match single-entry .zip files.
    for: [cab, data, msi, oledoc]
    all:
      - id: metadata/file/archive::cab-container-format
      - id: cab-business-lure-exe-member-path
  - id: cab-business-lure-member-name
    desc: Business-lure cabinet member name
    crit: notable
    conf: 0.93
    # `cab-container-format` keeps this cabinet-specific: the member-path
    # legs alone would also match single-entry .zip files.
    for: [cab, data, msi, oledoc]
    all:
      - id: metadata/file/archive::cab-container-format
      - id: cab-business-lure-member-name-path
  - id: cab-system-dll-member
    desc: System-DLL-named cabinet member
    crit: suspicious
    conf: 0.9
    # `cab-container-format` keeps this cabinet-specific: the member-path
    # legs alone would also match single-entry .zip files.
    for: [cab, data, msi, oledoc]
    all:
      - id: metadata/file/archive::cab-container-format
      - id: cab-system-dll-member-path
  # The business-lure executable conviction for this shape lives in
  # business-lure-exe.yaml: it must not carry a file-type list (see the note
  # there), and `defaults:` in this file would supply one.
  # A cabinet whose sole member is a script wearing an invoice / remittance /
  # SWIFT lure name is the script variant of the malspam delivery shape above:
  # a one-file cabinet built to move one lure-named script. No legitimate
  # cabinet names a script this way, so the pairing is hostile rather than
  # merely suspicious containment. All legs are atomic on purpose: the
  # container-format leg keeps this cabinet-specific (the member-path legs
  # alone would also match single-script zips), and the lure-script atoms are
  # the
  # social-engineering evidence, ORed as a sibling `any:` so no intermediate
  # composite sits between the conviction and its evidence.
  - id: cab-business-lure-script-payload
    desc: Cabinet delivers business-lure script
    crit: hostile
    conf: 0.96
    platforms: [windows, macos, android]
    for: [cab, binaries, zip, xpi, apk, data, msi, oledoc]
    all:
      - id: metadata/file/archive::cab-container-format
      - id: metadata/file/archive::archive-sole-member
    any:
      - id: cab-lure-script-member-a
      - id: cab-lure-script-member-b
      - id: cab-lure-script-member-c
    unless:
      - id: metadata/signed/platform/
      - id: well-known/dual-use/remote-admin/screenconnect::msi-screenconnect-installer
      - id: metadata/file/archive::archive-uncompressed-size-zero

  # A cabinet whose sole member is an unsigned executable wearing a Windows
  # system-DLL basename is side-loading delivery: the payload borrows an OS
  # component name (WINMM.dll) so a susceptible host loads it from the
  # application directory instead of System32, while the single-member shape
  # shows the cabinet was built to move exactly that implant -- no legitimate
  # cabinet moves an unsigned OS-named DLL alone, so the pairing is hostile
  # rather than merely suspicious containment. All legs are atomic on purpose:
  # a composite roll-up would not resolve as a leg at scan time, so the
  # system-DLL evidence enters as its container-format + member-path atoms
  # directly, and
  # the implant evidence enters as member-measured atoms (misplaced shape plus
  # one loader-malice signal: wiped export timestamp, hidden memory-protection
  # string, or stub-few imports). `scope: outer` pools the container shape
  # with the member implant signals; the default file scope would keep the two
  # leaves apart and the rule would never fire. Signed distribution cabinets
  # stay excluded below.
  - id: cab-system-dll-sideload-payload
    desc: Cabinet delivers system-DLL side-loading payload
    crit: hostile
    conf: 0.95
    attack: T1036,T1574.002
    platforms: [windows, macos, android]
    for: [cab, binaries, zip, xpi, apk, data, msi, oledoc]
    scope: outer
    all:
      - id: metadata/file/archive::cab-container-format
      - id: metadata/file/archive::archive-sole-member
      - id: metadata/file/archive::archive-misplaced-executable-member
      - id: cab-system-dll-member-path
    any:
      - id: metadata/binary/provenance/build::pe-export-timestamp-all-ones
      - id: micro-behaviors/mem/protect/modify::virtual-protect-text-pe
      - id: metadata/binary/symbols/count::imported-functions-under-10
    unless:
      - id: metadata/signed/platform/
      - id: well-known/dual-use/remote-admin/screenconnect::msi-screenconnect-installer
      - id: metadata/file/archive::archive-uncompressed-size-zero

  - id: cab-sole-executable-payload
    desc: Cabinet carries a single executable member
    crit: suspicious
    conf: 0.93
    platforms: [windows, macos, android]
    for: [cab, binaries, zip, xpi, apk, data, msi, oledoc]
    all:
      - id: metadata/file/archive::cab-container-format
      - id: metadata/file/archive::archive-sole-member
      - id: metadata/file/archive::archive-contains-executable-member
    downgrade:
      # Verbatim EICAR elsewhere in the same archive marks AV/scanner test
      # material (real malware never ships it): de-emphasize one level, keep
      # the finding visible. The hostile business-lure composite still convicts.
      scope: outer
      any:
        - id: well-known/tool/detection/security-scanner::eicar-test-string-reference
    unless:
      # A signed cabinet is a real distribution artifact; Microsoft's own
      # single-member trust lists are the case this must not fire on, and
      # platform trust is how they say so.
      - id: metadata/signed/platform/
      - id: well-known/dual-use/remote-admin/screenconnect::msi-screenconnect-installer
      - id: metadata/package/testing/
      - id: metadata/file/archive::archive-uncompressed-size-zero

  - id: cab-sole-script-payload
    desc: Cabinet carries a single script member
    crit: suspicious
    conf: 0.93
    platforms: [windows, macos, android]
    for: [cab, binaries, zip, xpi, apk, data, msi, oledoc]
    all:
      - id: metadata/file/archive::cab-container-format
      - id: metadata/file/archive::archive-sole-member
      - id: metadata/file/archive::archive-contains-script-member
    unless:
      - id: metadata/signed/platform/
      - id: well-known/dual-use/remote-admin/screenconnect::msi-screenconnect-installer
      - id: metadata/package/testing/
      - id: metadata/file/archive::archive-uncompressed-size-zero
