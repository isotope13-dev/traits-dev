defaults:
  platforms:
  - windows
  - macos
  - android
  crit: hostile
composite_rules:
- id: cab-business-lure-exe-payload
  desc: Cabinet delivers business-lure executable
  conf: 0.96
  attack: T1027.013,T1204.002
  mbc: B0024
  all:
  - id: metadata/file/format/structured::cab-container-format
  - id: metadata/archive/member/extension::archive-windows-executable-entry
  - id: metadata/archive/layout::archive-misplaced-executable-member
  - id: cab-business-lure-exe-member-path
  unless:
  - id: metadata/signed/platform/
  - id: well-known/dual-use/remote-admin/screenconnect::msi-screenconnect-installer
  - id: metadata/archive/layout::archive-uncompressed-size-zero
- id: cab-empty-business-lure-exe
  desc: Cabinet presents empty business-lure executable
  conf: 0.93
  attack: T1036,T1204.002
  all:
  - id: metadata/file/format/structured::cab-container-format
  - id: metadata/archive/layout::archive-sole-member
  - id: metadata/archive/member/extension::archive-windows-executable-entry
  - id: metadata/archive/layout::archive-uncompressed-size-zero
  any:
  - id: cab-business-lure-exe-member
  unless:
  - id: metadata/signed/platform/
  - id: well-known/dual-use/remote-admin/screenconnect::msi-screenconnect-installer
