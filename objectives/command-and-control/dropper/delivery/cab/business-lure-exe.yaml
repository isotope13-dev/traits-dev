# A cabinet whose executable member wears an invoice / remittance / SWIFT lure
# name is the malspam delivery shape: a cabinet built to move one lure-named
# executable past a gateway that strips .exe. No legitimate cabinet names an
# executable this way, so the pairing is hostile rather than merely suspicious
# containment. The lure evidence enters as its container-format + member-path
# atoms; the misplaced-executable atom is the second notable leg and
# corroborates the dropper shape (lure executable at an atypical path).
#
# No `for:` and no file-level `defaults:` on purpose -- that is why this rule
# is not in container-shape.yaml, whose defaults would supply one. The
# composite file-type gate never matches a cabinet the walker typed but did
# not size up (the header-only cabinets this family ships as mail
# attachments: a CFHEADER declaring the lure-named payload with no CFDATA
# behind it), so any explicit type list silently drops exactly those samples
# while the member-table evidence is fully present. The rule needs no type
# gate anyway: `cab-container-format` reads the parsed container kind, so only
# cabinets can satisfy it.
composite_rules:
  - id: cab-business-lure-exe-payload
    desc: Cabinet delivers business-lure executable
    crit: hostile
    conf: 0.96
    attack: T1027.013,T1204.002
    mbc: B0024
    platforms: [windows, macos, android]
    all:
      - id: cab-container-format
      - id: metadata/build/archive::archive-windows-executable-entry
      - id: metadata/file/archive::archive-misplaced-executable-member
      - id: cab-business-lure-exe-member-path
    unless:
      - id: metadata/signed/platform/
