# A cabinet whose executable member wears an invoice / remittance / SWIFT lure
# name is the malspam delivery shape: a cabinet built to move one lure-named
# executable past a gateway that strips .exe. No legitimate cabinet names an
# executable this way, so the pairing is hostile rather than merely suspicious
# containment when the member declares payload bytes. The lure evidence enters
# as its container-format + member-path atoms; the misplaced-executable atom is
# the second notable leg and corroborates the dropper shape (lure executable at
# an atypical path). A zero-byte member is only a filename lure, not a delivered
# executable.
#
# No `for:` default on purpose -- that is why this rule
# is not in container-shape.yaml, whose defaults would supply one. The
# composite file-type gate never matches a cabinet the walker typed but did
# not size up (header-only attachments can declare nonzero member sizes without
# carrying any CFDATA blocks), so any explicit type list silently drops those
# samples while the member-table evidence is fully present. The rule needs no
# type gate anyway: `cab-container-format` reads the parsed container kind, so
# only cabinets can satisfy it.
defaults:
  platforms: [windows, macos, android]

composite_rules:
  - id: cab-business-lure-exe-payload
    desc: Cabinet delivers business-lure executable
    crit: hostile
    conf: 0.96
    attack: T1027.013,T1204.002
    mbc: B0024
    all:
      - id: metadata/file/archive::cab-container-format
      - id: metadata/build/archive::archive-windows-executable-entry
      - id: metadata/file/archive::archive-misplaced-executable-member
      - id: cab-business-lure-exe-member-path
    unless:
      - id: metadata/signed/platform/
      - id: well-known/dual-use/remote-admin/screenconnect::msi-screenconnect-installer
      - id: metadata/file/archive::archive-uncompressed-size-zero

  # An empty member cannot establish payload delivery. It can still establish
  # the social-engineering construction: a sole Windows executable presented
  # as a business document inside a cabinet. Keep this separate from the
  # payload rule so the finding does not imply executable bytes were recovered.
  # The lure vocabulary describes a naming behavior, not a campaign filename.
  - id: cab-empty-business-lure-exe
    desc: Cabinet presents empty business-lure executable
    crit: hostile
    conf: 0.93
    attack: T1036,T1204.002
    all:
      - id: metadata/file/archive::cab-container-format
      - id: metadata/file/archive::archive-sole-member
      - id: metadata/build/archive::archive-windows-executable-entry
      - id: metadata/file/archive::archive-uncompressed-size-zero
    any:
      - id: cab-business-lure-exe-member
    unless:
      - id: metadata/signed/platform/
      - id: well-known/dual-use/remote-admin/screenconnect::msi-screenconnect-installer
