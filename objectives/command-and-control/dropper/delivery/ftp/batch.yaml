defaults:
  platforms: [windows]
  for: [batch]
  attack: T1105,T1059.003
  mbc: B0024

composite_rules:
  - id: batch-scripted-ftp-exec-dropper
    desc: Batch script runs scripted FTP and launches dropped executable
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/communications/ftp/client::windows-ftp-script-command
      - id: micro-behaviors/process/create/shell/command-mode::start-unquoted-executable-command
