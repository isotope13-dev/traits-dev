defaults:
  platforms: [windows]
  for: [html, javascript, vbs]
  attack: T1105
  mbc: B0024

composite_rules:
  # An encoded VBScript body that writes out an FTP command file
  # (CreateTextFile staging the open/user/bin/get/bye sequence), invokes
  # ftp.exe with that command file, and runs hidden (window-style 0) leaves
  # no legitimate use: it is a staged FTP download-and-execute dropper.
  - id: encoded-vbscript-ftp-download-execute
    desc: Encoded VBScript stages an FTP download script and runs it hidden
    crit: hostile
    conf: 0.97
    all:
      - id: objectives/anti-static/obfuscation/syntax::html-vbscript-encode-payload
      - id: micro-behaviors/communications/ftp/client::windows-ftp-script-command
      - id: micro-behaviors/fs/write/content::fso-text-file-write-api
      - id: micro-behaviors/data/control-flow/dispatch/named::run-zero-style-argument
