# A Windows ftp.exe command file whose transfer is a program. The script
# does not launch the download; execution would be a separate file-exec
# claim. Legitimate distribution scripts share the shape, so this stays
# suspicious. Prompt login lines are often shorter than the string minimum
# and are spanned by the session pattern rather than matched alone.
defaults:
  platforms: [windows]
  for: [text, batch]
  attack: T1105
  mbc: B0024

traits:
  - id: ftp-command-script-executable-session
    desc: FTP command script binary-gets a program
    crit: suspicious
    conf: 0.94
    if:
      type: text
      regex: '(?is)open \S+.{0,60}binary\s+get \S+\.(exe|dll|scr).{0,24}(quit|bye)'
  # Throwaway login: a single-character username and password (`user 1 1`),
  # the credential shape downloader scripts use against attacker-controlled
  # FTP servers. Real distribution credentials name an account.
  - id: ftp-script-throwaway-login
    desc: FTP script uses single-character credentials
    crit: notable
    conf: 0.93
    if:
      type: text
      regex: '(?im)^user\s+\S{1,2}\s+\S{1,2}\s*$'
  # An explicit nonstandard port: ordinary distribution points at a named
  # host and leaves the control port at 21 (usually omitted entirely).
  - id: ftp-script-ephemeral-port
    desc: FTP script opens an explicit nonstandard port
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?im)^open\s+\S+\s+\d{3,6}\s*$'

composite_rules:
  - id: ftp-script-external-executable-fetch
    desc: FTP script fetches executable from external IPv4
    crit: suspicious
    conf: 0.95
    near_lines: 12
    all:
      - id: micro-behaviors/communications/ftp/client::ftp-script-open-external-ipv4
      - id: micro-behaviors/communications/ftp/client::ftp-script-get-executable
  # The executable fetch with throwaway credentials: retrieval of a program
  # from a server the script's operator does not even bother naming an
  # account on. Distribution scripts authenticate; dropper scripts don't.
  - id: ftp-throwaway-credential-executable-fetch
    desc: FTP script fetches executable with throwaway login
    crit: hostile
    conf: 0.95
    near_lines: 12
    all:
      - id: ftp-script-external-executable-fetch
      - id: ftp-script-throwaway-login
  # The executable fetch from a raw address on an ephemeral port: the
  # server has no name to resolve and no standard service port to find,
  # so the script must carry both.
  - id: ftp-ephemeral-port-executable-fetch
    desc: FTP script pulls executable from raw IP ephemeral port
    crit: hostile
    conf: 0.95
    near_lines: 12
    all:
      - id: micro-behaviors/communications/ftp/client::ftp-script-open-external-ipv4
      - id: micro-behaviors/communications/ftp/client::ftp-script-get-executable
      - id: ftp-script-ephemeral-port
  # Same retrieval when the local name is under C:\Windows. The script still
  # does not launch the file; the hostile claim is the system-directory plant.
  - id: ftp-windows-dir-executable-fetch
    desc: FTP script plants an executable in Windows
    crit: hostile
    conf: 0.95
    near_lines: 12
    all:
      - id: micro-behaviors/communications/ftp/client::ftp-script-open-host
      - id: micro-behaviors/communications/ftp/client::ftp-script-save-exe-windows
