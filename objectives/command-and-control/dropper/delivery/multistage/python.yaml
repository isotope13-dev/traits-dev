defaults:
  platforms:
  - windows
  - unix
  for:
  - python
  attack: T1105
  mbc: B0023
traits:
- id: stage-config-endpoint-retrieve--data-path
  desc: data_url JSON key
  crit: notable
  conf: 0.85
  if:
    type: string_literal
    regex: '"data_url"|''data_url'''
- id: stage-config-endpoint-retrieve--init-path
  desc: init_url JSON key
  crit: notable
  conf: 0.85
  if:
    type: string_literal
    regex: '"init_url"|''init_url'''
- id: pil-image-bit-extract
  desc: PIL bit-level extraction from image
  crit: suspicious
  conf: 0.93
  if:
    type: text
    regex: Image\.open\s*\([^)\n]{0,160}\)\.getdata\s*\(\s*\)
- id: pil-lsb-loop--lsb-bit-mask-a
  desc: Bit & 1 LSB extraction mask
  crit: component
  conf: 0.85
  if:
    type: text
    regex: \b(pixel|byte|val)\s*&\s*1\b
- id: pil-lsb-loop--lsb-bit-mask-b
  desc: Short variable LSB extraction mask
  crit: component
  conf: 0.85
  if:
    type: text
    regex: \b(p|b)\s*&\s*1\b
- id: exif-comment-retrieve
  desc: EXIF comment field retrieved as payload
  crit: notable
  conf: 0.86
  if:
    type: text
    regex: _getexif\s*\(\s*\)\s*\.\s*get\s*\(\s*0x9286
- id: hastebin-raw-url
  desc: Hastebin raw URL marker
  crit: notable
  conf: 0.92
  if:
    type: text
    substr: hastebin.com/raw
- id: pastebin-service-raw-url
  desc: Pastebin raw URL marker
  crit: notable
  conf: 0.92
  if:
    type: text
    substr: pastebin.com/raw
- id: controlc-raw-url
  desc: ControlC raw URL marker
  crit: notable
  conf: 0.92
  if:
    type: text
    substr: controlc.com
- id: pasteee-raw-url
  desc: Paste.ee raw URL marker
  crit: notable
  conf: 0.92
  if:
    type: text
    substr: paste.ee/r
- id: pastebin-raw-fetch
  desc: Raw Pastebin URL passed to Requests GET
  crit: suspicious
  conf: 0.92
  if:
    type: symbol
    kind: call
    exact: requests.get
    arg:
      index: 0
      from:
        value: (?i)^https?://pastebin\.com/raw/
  unless:
  - id: metadata/file/profile/source-indications/
- id: image-url-payload-retrieval
  desc: Image URL response decoded as Base64/ZIP
  crit: suspicious
  conf: 0.92
  if:
    type: symbol
    kind: call
    regex: (^|\.)(b64decode|urlsafe_b64decode|ZipFile)$
    arg:
      index: 0
      from:
        call: (^|\.)(urlopen|get)$
        argument: 0
        literal: (?i)^https?://[^\s?#]{1,220}\.(jpe?g|png|gif|webp)([?#]|$)
        through:
        - call: (^|\.)(read|decode)$
          receiver: true
        - call: (^|\.)BytesIO$
          arguments:
          - 0
  unless:
  - id: micro-behaviors/data/format/media/raster::python-imaging-library-import
  - id: metadata/package/testing/
  - id: well-known/app/ai/gateway/litellm::litellm-package-path
  - id: well-known/app/ai/gateway/litellm::litellm-sdk-wheel-context
  - id: well-known/lib/ai/litellm::litellm-codebase
  - id: well-known/lib/ai/litellm::litellm-root-import
  - id: well-known/app/ai/usage/mlflow/
  - id: well-known/lib/ai/lightning::lightning-python-server-context
  - id: metadata/path::test-directory-component
composite_rules:
- id: dns-txt-query
  desc: Python DNS TXT lookup
  crit: component
  conf: 0.92
  any:
  - id: micro-behaviors/communications/dns/txt::python-dnspython-query-txt
  - id: micro-behaviors/communications/dns/txt::python-dnspython-resolve-txt
- id: dns-txt-response-decode
  desc: Decodes DNS TXT response
  crit: component
  conf: 0.86
  any:
  - id: micro-behaviors/data/decode/base64::base64-decoding
  - id: micro-behaviors/data/decode/hex::python-fromhex
  - id: micro-behaviors/data/decode/hex::python-unhexlify
- id: dns-txt-config-retrieve
  desc: Stage-2 config decoded from DNS TXT record
  crit: suspicious
  conf: 0.93
  near_lines: 80
  all:
  - id: dns-txt-query
  - id: dns-txt-response-decode
  unless:
  - id: well-known/app/system/anthropic-cybersecurity-skills::defensive-cybersecurity-skills-repository
  - id: well-known/app/system/remotepower::documented-rmm-release-context
  - id: well-known/lib/network/shapeshifter-uftp::shapeshifter-uftp-context
- id: multi-stage-delivery
  desc: Multi-stage payload delivery (any form)
  crit: suspicious
  conf: 0.94
  unless:
  - id: well-known/app/system/anthropic-cybersecurity-skills::defensive-cybersecurity-skills-repository
  any:
  - id: dns-txt-config-retrieve
  - id: stage-config-endpoint-retrieve
  - id: pil-image-bit-extract
  - id: pil-lsb-loop
  - id: exif-comment-retrieve
  - id: pastebin-raw-fetch
  - id: image-url-payload-retrieval
- id: two-stage-fetch-and-exec
  desc: Stage-2 retrieved then executed
  crit: hostile
  conf: 0.96
  all:
  - id: multi-stage-delivery
  any:
  - id: micro-behaviors/process/create/subprocess::process-execution
  - id: micro-behaviors/process/interpreter/eval/direct::exec-builtin
  - id: micro-behaviors/process/interpreter/eval/direct::eval-builtin
  - id: micro-behaviors/process/create/launch::startfile-exe-text
  near_lines: 80
  downgrade:
    any:
    - id: metadata/package/testing/presence/harness/
    - id: metadata/path::test-directory-component
  unless:
  - id: well-known/lib/ai/scikit-learn
  - id: well-known/lib/platform/psutil
  - id: well-known/tool/development/testing/piglit
  - id: well-known/app/system/anthropic-cybersecurity-skills::defensive-cybersecurity-skills-repository
  - id: well-known/app/system/remotepower::documented-rmm-release-context
- id: stage-config-endpoint-retrieve
  desc: Remote stage URL selected from configuration
  crit: suspicious
  conf: 0.85
  near_lines: 80
  all:
  - id: stage-config-endpoint-retrieve--stage-control
  any:
  - id: metadata/import/python/urllib/request
  - id: micro-behaviors/communications/http/request/client::urllib-url-literal
  - id: micro-behaviors/communications/http/request/client::requests-get-url-literal
  - id: micro-behaviors/communications/http/post::python-post-url-literal
  unless:
  - id: well-known/app/infrastructure/pulumi::pulumi-python-provider-generated
- id: stage-config-endpoint-retrieve--stage-control
  desc: Remote stage URL key
  crit: component
  any:
  - id: metadata/lang/source/literal::quoted-stage-url-token
  - id: stage-config-endpoint-retrieve--data-path
  - id: stage-config-endpoint-retrieve--init-path
- id: pil-lsb-loop
  desc: PIL LSB extraction loop
  crit: suspicious
  conf: 0.94
  near_lines: 30
  all:
  - id: pil-lsb-loop--lsb-bit-mask
  any:
  - id: micro-behaviors/ui/graphics/image::python-image-getdata
  - id: micro-behaviors/ui/graphics/image::python-image-getpixel
- id: pil-lsb-loop--lsb-bit-mask
  desc: Bit & 1 LSB extraction mask
  crit: component
  conf: 0.85
  any:
  - id: pil-lsb-loop--lsb-bit-mask-a
  - id: pil-lsb-loop--lsb-bit-mask-b
- id: image-url-png-chunk-fetch-exec
  desc: Remote PNG chunks feed dynamic code
  crit: hostile
  conf: 0.99
  for:
  - python
  - python-sdist
  - tar
  attack: T1105,T1027.003,T1059.006
  mbc: B0032
  near_lines: 100
  all:
  - id: micro-behaviors/communications/http/url/media::image-file-url
  - id: micro-behaviors/data/format/media/raster::png-chunk-parser
  - id: micro-behaviors/process/interpreter/eval/direct::exec-builtin
  any:
  - id: micro-behaviors/communications/http/request/client/
  - id: micro-behaviors/communications/http/client/response-body::response-stream-python
  - id: micro-behaviors/communications/http/lib/
  - id: micro-behaviors/communications/http/client/exchange::urllib-word
  - id: micro-behaviors/communications/http/client/exchange::urllib-urlopen
  - id: micro-behaviors/communications/http/client/exchange::urllib-urlopen-call-symbol
  - id: micro-behaviors/communications/http/client/initialize::urllib-request-symbol
  - id: micro-behaviors/communications/http/client/initialize::urllib-request-data-body
  - id: micro-behaviors/communications/http/client/response-body::urlopen-response-body-read
  - id: micro-behaviors/communications/http/client/exchange::urllib-urlopen-call
  - id: micro-behaviors/communications/http/response::raise-for-status
  - id: micro-behaviors/communications/http/get::requests-get
  unless:
  - id: micro-behaviors/data/format/media/raster::python-imaging-library-import
  - id: metadata/package/testing/
  - id: metadata/path::test-directory-component
- id: png-chunk-archive-extract-launch
  desc: PNG chunk inflates to an archive that is launched
  crit: hostile
  conf: 0.97
  attack: T1027.003,T1105,T1059.006
  mbc: B0032
  near_lines: 120
  all:
  - id: micro-behaviors/data/format/media/raster::png-signature-chunk-walker
  - id: micro-behaviors/data/decompress/zlib::zlib-decompress-symbol
  - id: micro-behaviors/data/archive/extract/zip::python-zipfile-extractall
  - id: micro-behaviors/process/create/subprocess::process-execution
  unless:
  - id: micro-behaviors/data/format/media/raster::python-imaging-library-import
  - id: metadata/package/testing/
  - id: metadata/path::test-directory-component
- id: embedded-python-staged-loader
  desc: PE hides Python and an external stage
  crit: hostile
  conf: 0.99
  for:
  - pe
  platforms:
  - windows
  attack: T1105,T1027,T1059.006
  all:
  - id: objectives/anti-static/obfuscation/payload/python-embedded::embedded-python-stage-url
  - id: objectives/anti-static/obfuscation/payload/python-embedded::zlib-python-exec
  - id: objectives/anti-static/obfuscation/payload/python-embedded::embedded-python-runtime
