# Unsigned WinInet or WebBrowser PEs that embed a PHP endpoint are
# clickers/gates, not leftover URLs in a document.
defaults:
  platforms: [windows]
  for: [pe, dll]
  attack: T1105,T1071.001
  crit: hostile
  conf: 0.94

composite_rules:
  - id: wininet-php-endpoint
    desc: WinInet client talks to a PHP endpoint
    scope: file
    all:
      - id: micro-behaviors/communications/http/client/wininet::internet-open-url
      - id: micro-behaviors/communications/http/url/php-endpoint::url-php-endpoint-binary
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/installer/family/
      # 360 Safe embeds its first-party uninstall/report endpoint; it is
      # telemetry context, not an operator-controlled PHP gate.
      - id: micro-behaviors/communications/http/request/report::qihoo-report-endpoint-url
      # StartIsBack and StartAllBack open the vendor license endpoints
      # startisback.com/activate.php, upgrade.php, and sibsab.php with
      # InternetOpenUrl. That is product activation, not a PHP clicker gate.
      - id: well-known/app/utility/startallback::startallback-component

  - id: webbrowser-php-clicker
    desc: WebBrowser control opens a PHP clicker URL
    scope: file
    all:
      - id: micro-behaviors/os/com/automation::webbrowser-activex-clsid
      - id: micro-behaviors/communications/http/url/php-endpoint::url-php-endpoint-binary
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/installer/family/
      # The PHP URL is an add-comment page opened from the process-library UI
      # via ShellExecuteA, not an automated browser click.
      - id: well-known/app/system/winutilities::winutilities-process-security-identity

  - id: wininet-php-mutex-stage-loader
    desc: WinInet PHP gate with mutex staging
    crit: hostile
    conf: 0.95
    all:
      - id: wininet-php-endpoint
      - id: micro-behaviors/process/sync/mutex::create-mutex
      - id: micro-behaviors/process/create/exec::create-process-a
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/installer/family/

  # The PHP fetch alone is the click. The installer also writes
  # HKCU\...\Run and pulls the package through URLDownloadToCacheFile.
  - id: wininet-php-run-key-cached-download
    desc: WinInet PHP client persists a cached download via Run
    crit: hostile
    conf: 0.93
    attack: T1071.001,T1105,T1547.001
    all:
      - id: wininet-php-endpoint
      - id: micro-behaviors/os/registry/keys/autostart::currentversion-run
      - id: micro-behaviors/os/registry/write::reg-set-value-ex-a
      - id: micro-behaviors/communications/http/client/urlmon::url-download-to-cache-str
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/installer/family/
