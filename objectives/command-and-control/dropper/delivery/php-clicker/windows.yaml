# Unsigned WinInet or WebBrowser PEs that embed a PHP endpoint are
# clickers/gates, not leftover URLs in a document.
defaults:
  platforms: [windows]
  for: [pe, dll]
  attack: T1105,T1071.001
  crit: hostile
  conf: 0.94

composite_rules:
  - id: wininet-php-endpoint
    desc: WinInet client talks to a PHP endpoint
    scope: file
    all:
      - id: micro-behaviors/communications/http/client/wininet::internet-open-url
      - id: micro-behaviors/communications/http/url/php-endpoint::url-php-endpoint-binary
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/installer/family/

  - id: webbrowser-php-clicker
    desc: WebBrowser control opens a PHP clicker URL
    scope: file
    all:
      - id: micro-behaviors/os/com/automation::webbrowser-activex-clsid
      - id: micro-behaviors/communications/http/url/php-endpoint::url-php-endpoint-binary
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/installer/family/
      # The PHP URL is an add-comment page opened from the process-library UI
      # via ShellExecuteA, not an automated browser click.
      - id: well-known/app/system/winutilities::winutilities-process-security-identity
