defaults:
  platforms: [unix]
  for: [rust]
  attack: T1105,T1059.004

traits:
  - id: rust-curl-pipe-shell-literal
    desc: Curl pipe-shell command string literal
    crit: notable
    conf: 0.96
    if:
      type: literal
      kind: string
      regex: 'curl\s[^|\r\n]{0,80}(https?://|\$|\{\w)[^|\r\n]{0,50}\|\s*(sh|bash|cmd)\b'
    not:
      - regex: '(?i)nixos\.org/nix/install'
      - regex: '(?i)sh\.rustup\.rs'
      - regex: '(?i)install\.julialang\.org'

  - id: rust-wget-pipe-shell-literal
    desc: Wget pipe-shell command string literal
    crit: notable
    conf: 0.96
    if:
      type: literal
      kind: string
      regex: 'wget\s[^|\r\n]{0,80}(https?://|\$|\{\w)[^|\r\n]{0,50}\|\s*(sh|bash|cmd)\b'

composite_rules:
  - id: rust-curl-pipe-shell-rce
    desc: Rust runs remote curl pipe shell
    crit: hostile
    conf: 0.98
    near_lines: 20
    all:
      - id: rust-curl-pipe-shell-literal
      - id: micro-behaviors/process/create/direct::rust-command-output
    unless:
      - id: recognized-official-install-script

  - id: rust-wget-pipe-shell-rce
    desc: Rust runs remote wget pipe shell
    crit: hostile
    conf: 0.98
    near_lines: 20
    all:
      - id: micro-behaviors/process/create/direct::rust-process-command-import
      - id: micro-behaviors/process/create/direct::rust-command-output
      - id: rust-wget-pipe-shell-literal
