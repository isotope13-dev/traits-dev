# Fetching remote content and feeding it into a shell interpreter on stdin
# (`... | zsh -s`) is fileless execution: the payload never lands on disk as a
# script. MacSync's loader pulls a public iCloud calendar and pipes it into
# `zsh -s`, where everything but the DESCRIPTION payload is ignored as invalid
# input. Pair the fetch + stdin-interpreter with a macOS Gatekeeper-bypass step
# (quarantine strip or ad-hoc re-sign) to keep this off benign curl|sh setups.
defaults:
  platforms: [macos, unix]
  for: [shell]
composite_rules:
  - id: macos-remote-fed-stdin-interpreter
    desc: Remote-fetched content piped into a stdin shell interpreter
    crit: hostile
    conf: 0.92
    attack: T1059.004,T1105
    all:
      - id: micro-behaviors/communications/http/download/curl::curl-output-file
      - id: micro-behaviors/process/create/shell/pipeline::shell-stdin-interpreter-pipe
    any:
      - id: micro-behaviors/fs/attributes/xattr::xattr-clear
      - id: micro-behaviors/os/security/gatekeeper::codesign-ad-hoc-signing
      - id: micro-behaviors/os/security/gatekeeper::codesign-force-adhoc
    needs: 1
