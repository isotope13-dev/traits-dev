      - id: micro-behaviors/communications/http/curl::curl-silent-fail-flags-text
      - id: opaque-dropper-url

  - id: embedded-iot-password-dropper
    desc: IoT password injection pipes downloaded shell stage
    crit: hostile
    conf: 0.99
    attack: T1059.004,T1105,T1210
    near_bytes: 260
    for: [shell]
    all:
      - id: objectives/lateral-movement/exploit/network-device/http::iot-password-wget-command
      - id: wget-pipe-shell

  # The pipeline's own URL is a link shortener: the shell runs whatever the
  # short link points at today, and the operator can retarget it after
  # publication without touching the code. Same-line proximity ties the short
  # link to the pipe, so a README badge elsewhere in the file does not count.
  - id: shortened-url-shell-pipeline
    desc: Shell runs a shortened URL's response
    crit: hostile
    conf: 0.95
    attack: T1059,T1105
    near_bytes: 512
    platforms: [windows, unix]
    for: [scripts, source, javascript, typescript]
    all:
      - id: micro-behaviors/communications/url/shortener/
    any:
      - id: micro-behaviors/process/create/shell/pipeline::curl-pipe-shell-literal
      - id: micro-behaviors/process/create/shell/pipeline::curl-pipe-cmd-literal
      - id: micro-behaviors/process/create/shell/pipeline::curl-pipe-shell-text
      - id: micro-behaviors/process/create/shell/pipeline::curl-pipe-shell-in-code
    unless:
      - id: well-known/tool/detection/
      - id: metadata/file/naming::test-directory-component
      - id: metadata/package/testing/
      # A status export quotes the post. The short link and the pipe are text
      # the author wrote, not a shell this file runs.
      - id: metadata/file/format/structured::twitter-status-created-at

  # Node/Ruby/Python spawn plus a bit.ly (etc.) curl|bash one-liner is the
  # catladder-class npm trojan: a plausible CLI subcommand that runs whatever
  # the short link serves today.
  - id: spawned-shortened-url-shell-pipeline
    desc: Spawns a shell on a shortened URL pipeline
    crit: hostile
    conf: 0.97
    attack: T1059,T1105
    near_bytes: 768
    for: [javascript, typescript]
    all:
      - id: shortened-url-shell-pipeline
    any:
      - id: micro-behaviors/process/create/spawn::bare-spawn-call
      - id: micro-behaviors/process/create/spawn::spawn-call
