      - { id: curl-pipe-shell-word }
      - { id: micro-behaviors/process/create/shell/pipeline::curl-pipe-zsh }
      - { id: curl-pipe-ksh }
      - { id: curl-pipe-dash }
      - { id: micro-behaviors/process/create/shell/spawn::curl-pipe-exec-python-shell }
      - { id: curl-pipe-perl }
      - { id: micro-behaviors/process/deploy/interpreter-stdin::curl-pipe-node-stdin }
      - { id: curl-pipe-ruby }
      - { id: wget-pipe-sh }
      - { id: wget-pipe-shell-word }
      - { id: wget-pipe-zsh }
      - { id: wget-pipe-ksh }
