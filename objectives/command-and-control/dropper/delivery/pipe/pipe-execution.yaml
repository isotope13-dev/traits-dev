defaults:
  platforms: [windows, linux, macos]
  for: [shell, python, javascript, ruby, perl, applescript]
traits:
  - id: curl-pipe-sh
    desc: curl piped to sh
    crit: notable
    conf: 0.7
    attack: T1059.004
    unless:
      - id: metadata/package/testing/harness/runtime/
      - id: well-known/tool/detection/security-scanner/
      - id: objectives/command-and-control/channel/deaddrop/url::security-rule-runtime-script-floating-url
      - id: metadata/build/
      - type: basename
        regex: '^(METADATA|PKG-INFO)$'
      - id: metadata/file/extension/identity::markdown-file-basename
      - id: well-known/lib/runtime/compiled/wasmer::wasmer-installer-prompt
      # Rust source commonly stores install commands as UI/help text. The
      # Rust process rules cover actual subprocess execution separately.
      - id: metadata/file/extension/identity::rust-source-extension
      - id: well-known/tool/packaging/uv::uv-install-sh-bootstrap-url
    if:
      type: text
      # Require a shell command line.  API example JSON may document a
      # malicious-looking command without executing it.
      regex: '(?m)^[[:space:]]*(/bin/sh\s+-c\s+)?curl\s+.{0,160}\|\s*sh\b'
    not:
      - regex: curl\s+.{0,200}npmjs\.org/install\.sh.{0,200}\|\s*sh\b
      - regex: curl\s+.{0,200}npmjs\.com/install\.sh.{0,200}\|\s*sh\b
      - regex: curl\s+.{0,200}rustwasm\.github\.io/wasm-pack/installer/init\.sh.{0,200}\|\s*sh\b
      - regex: curl\s+.{0,200}install\.fuel\.sh.{0,200}\|\s*sh\b
      - regex: curl\s+.{0,200}install\.fuel\.network.{0,200}\|\s*sh\b
      - regex: curl\s+.{0,200}golangci-lint\.run/install\.sh.{0,200}\|\s*sh\b
      - regex: curl\s+.{0,200}raw\.githubusercontent\.com/golangci/golangci-lint/.{0,80}/install\.sh.{0,200}\|\s*sh\b
      - regex: curl\s+.{0,200}raw\.githubusercontent\.com/securego/gosec/.{0,80}/install\.sh.{0,200}\|\s*sh\b
      - regex: curl\s+.{0,200}raw\.githubusercontent\.com/anchore/syft/.{0,80}/install\.sh.{0,200}\|\s*sh\b
      - regex: curl\s+.{0,200}aka\.ms/apm-unix.{0,200}\|\s*sh\b
      - regex: curl\s+.{0,200}astral\.sh.{0,200}\|\s*sh\b
      - regex: curl\s+.{0,200}raw\.githubusercontent\.com/fredericrous/amont/.{0,80}/install\.sh.{0,200}\|\s*sh\b
      - regex: curl\s+.{0,200}raw\.githubusercontent\.com/(creationix|nvm-sh)/nvm/.{0,80}/install\.sh.{0,200}\|\s*sh\b
      - regex: curl\s+.{0,200}yarnpkg\.com/install\.sh.{0,200}\|\s*sh\b
      # Docstring / template forms of the Astral uv installer (URL held in UV_INSTALL_URL)
      - regex: curl\s+-LsSf\s+\.\.\.\s*\|\s*sh\b
      - regex: curl\s+.{0,80}\{UV_INSTALL_URL\}\s*\|\s*sh\b
      - regex: curl\s+.{0,200}ollama\.com.{0,200}\|\s*sh\b
      - regex: curl\s+.{0,200}rustup\.rs.{0,200}\|\s*sh\b
      - regex: curl\s+.{0,200}get\.docker\.com.{0,200}\|\s*sh\b
      - regex: curl\s+.{0,200}get\.k3s\.io.{0,200}\|\s*sh\b
      - regex: curl\s+.{0,200}docs\.chainloop\.dev/install\.sh.{0,200}\|\s*sh\b
      - regex: curl\s+.{0,200}dl\.chainloop\.dev/cli/install\.sh.{0,200}\|\s*sh\b
      - regex: curl\s+.{0,200}tailscale\.com/install\.sh.{0,200}\|\s*sh\b
      - regex: curl\s+.{0,200}install\.julialang\.org.{0,200}\|\s*sh\b
      - regex: curl\s+.{0,200}nixos\.org/nix/install.{0,200}\|\s*sh\b
      - regex: curl\s+.{0,200}mise\.(run|jdx\.dev).{0,200}\|\s*sh\b
      - regex: curl\s+.{0,200}create-awesome-vlang-app\.vercel\.app.{0,200}\|\s*sh\b
      - regex: curl\s+.{0,200}karajancode\.com/install\.sh.{0,200}\|\s*sh\b
      - regex: curl\s+.{0,200}raw\.githubusercontent\.com/manufosela/karajan-code/.{0,80}/scripts/install-binary\.sh.{0,200}\|\s*sh\b
      - regex: curl\s+.{0,200}opencode\.ai/install.{0,200}\|\s*(sh|bash)\b
      # The Studio UI renders this installer command for the user; it does
      # not execute the command in the browser process.
      - regex: 'window\.location\.origin[^\n]{0,80}install\.sh\s*\|\s*sh\b'
  - id: curl-pipe-shell-word
    desc: curl piped to shell
    crit: suspicious
    conf: 0.7
    attack: T1059.004
    unless:
      - id: metadata/build/
      - id: objectives/command-and-control/channel/deaddrop/url::security-rule-runtime-script-floating-url
      - id: well-known/tool/detection/
    if:
      type: text
      regex: curl\s+.{0,200}\|\s*shell\b
  - id: curl-pipe-ksh
    desc: curl piped to ksh
    crit: suspicious
    conf: 0.7
    attack: T1059.004
    unless:
      - id: well-known/tool/detection/
      - id: objectives/command-and-control/channel/deaddrop/url::security-rule-runtime-script-floating-url
      - type: basename
        regex: (?i)(^|[\\/!])(METADATA|PKG-INFO|README(\..*)?)$
      - id: metadata/package/freeform::pkg-description-content-type-markdown
      - id: metadata/package/files/dependency::vsix-bundled-output-path
      - id: metadata/build/docker::dockerfile-basename
      - id: metadata/package/testing/
      - id: "metadata/file/naming::test-directory-component"
    if:
      type: text
      regex: curl\s+.{0,200}\|\s*ksh\b
  - id: curl-pipe-dash
    desc: curl piped to dash
    crit: suspicious
    conf: 0.7
    attack: T1059.004
    unless:
      - id: metadata/file/format/source-map::sourcemap-sources-content
      - id: well-known/tool/detection/
      - id: objectives/command-and-control/channel/deaddrop/url::security-rule-runtime-script-floating-url
      - type: basename
        regex: (?i)(^|[\\/!])(METADATA|PKG-INFO|README(\..*)?)$
      - id: metadata/package/freeform::pkg-description-content-type-markdown
      - id: metadata/package/files/dependency::vsix-bundled-output-path
      - id: metadata/build/docker::dockerfile-basename
      - id: metadata/package/testing/
      - id: "metadata/file/naming::test-directory-component"
    if:
      type: text
      regex: curl\s+.{0,200}\|\s*dash\b
  - id: wget-pipe-sh
    for: [shell]
    desc: wget piped to sh
    crit: suspicious
    conf: 0.7
    attack: T1059.004
    unless:
      - id: well-known/tool/detection/
      - id: objectives/command-and-control/channel/deaddrop/url::security-rule-runtime-script-floating-url
      - type: basename
        regex: (?i)(^|[\\/!])(METADATA|PKG-INFO|README(\..*)?)$
      - id: metadata/package/freeform::pkg-description-content-type-markdown
      - id: metadata/package/files/dependency::vsix-bundled-output-path
      - id: well-known/tool/sysadmin/alpine-packages/binary::alpine-docker-machine-binary
      - id: metadata/build/docker/
      - id: metadata/file/profile/test-indications/
      - id: well-known/tool/packaging/uv::uv-install-sh-bootstrap-url
    if:
      type: tree-sitter
      # One capture, the pipeline, so evidence is the whole command.
      # `not:` does not filter tree-sitter captures (a bare "sh" capture
      # also used to survive the rustup `not:` regex), so the official
      # installer bootstraps below are carved out as #not-match? predicates
      # on the capture itself:
      # - rustup's documented bootstrap (subsumes the old sh.rustup.rs-only
      #   predicate), Go tooling's own published bootstraps served from the
      #   tool's own repository (the line every Go project's CI copies out
      #   of the installation docs: golangci-lint, golang/dep and gosec),
      #   the official NVM and Anchore Syft bootstraps, Docker's official
      #   Engine installer (get.docker.com), the yarn installer,
      #   and an elided URL (documentation,
      #   not a command: nothing is downloaded by `wget ... | sh`).
      # A Dockerfile `RUN` step needs no carve-out: cleave maps those
      # descriptors to Unknown for `for:` purposes, so this shell-scoped
      # rule never fires on them.
      query: '((pipeline) @pipe (#match? @pipe "^wget\\s[^|\\n]*\\|\\s*sh\\b") (#not-match? @pipe "rustup\\.rs|get\\.docker\\.com|apt\\.u\\.doover\\.com/install\\.sh|githubusercontent\\.com/(golangci/golangci-lint|golang/dep|securego/gosec)/(main|master)/install\\.sh|githubusercontent\\.com/((creationix|nvm-sh)/nvm|anchore/syft)/[^|\\n]{0,80}/install\\.sh|yarnpkg\\.com/install\\.sh|wget\\s+\\.\\.\\.\\s*\\|\\s*sh"))'
  - id: wget-pipe-shell-word
    desc: wget piped to shell
    crit: suspicious
    conf: 0.7
    attack: T1059.004
    unless:
      - id: well-known/tool/detection/
      - id: objectives/command-and-control/channel/deaddrop/url::security-rule-runtime-script-floating-url
      - type: basename
        regex: (?i)(^|[\\/!])(METADATA|PKG-INFO|README(\..*)?)$
      - id: metadata/package/freeform::pkg-description-content-type-markdown
      - id: metadata/package/files/dependency::vsix-bundled-output-path
      - id: metadata/build/docker::dockerfile-basename
      - id: metadata/package/testing/
      - id: "metadata/file/naming::test-directory-component"
    if:
      type: text
      regex: '(?m)^[[:space:]]*(wget\b|[^#[:space:]][^\n]{0,220}\bwget\s+)[^|\n]{1,200}\|\s*shell\b'
    not:
      - substr: apt.u.doover.com/install.sh
  - id: wget-pipe-zsh
    desc: wget piped to zsh
    crit: suspicious
    conf: 0.7
    attack: T1059.004
    # Same carve-outs as wget-pipe-{bash,shell-word,dash}: defensive scanners and
    # their test harnesses quote wget|zsh as DENY fixtures, not as droppers.
    unless:
      - id: well-known/tool/detection/
      - id: objectives/command-and-control/channel/deaddrop/url::security-rule-runtime-script-floating-url
      - type: basename
        regex: (?i)(^|[\\/!])(METADATA|PKG-INFO|README(\..*)?)$
      - id: metadata/package/freeform::pkg-description-content-type-markdown
      - id: metadata/package/files/dependency::vsix-bundled-output-path
      - id: metadata/build/docker::dockerfile-basename
      - id: metadata/package/testing/
      - id: "metadata/file/naming::test-directory-component"
    if:
      type: text
      regex: '(?m)^[[:space:]]*(wget\b|[^#[:space:]][^\n]{0,220}\bwget\s+)[^|\n]{1,200}\|\s*zsh\b'
  - id: wget-pipe-ksh
    desc: wget piped to ksh
    crit: suspicious
    conf: 0.7
    attack: T1059.004
    unless:
      - id: well-known/tool/detection/
      - id: objectives/command-and-control/channel/deaddrop/url::security-rule-runtime-script-floating-url
      - type: basename
        regex: (?i)(^|[\\/!])(METADATA|PKG-INFO|README(\..*)?)$
      - id: metadata/package/freeform::pkg-description-content-type-markdown
      - id: metadata/package/files/dependency::vsix-bundled-output-path
      - id: metadata/build/docker::dockerfile-basename
      - id: metadata/package/testing/
      - id: "metadata/file/naming::test-directory-component"
    if:
      type: text
      regex: '(?m)^[[:space:]]*(wget\b|[^#[:space:]][^\n]{0,220}\bwget\s+)[^|\n]{1,200}\|\s*ksh\b'
  - id: wget-pipe-dash
    unless:
      - id: well-known/tool/detection/
      - id: well-known/tool/sysadmin/alpine-packages/binary::alpine-docker-machine-binary
      - id: metadata/build/docker::dockerfile-basename
      - id: metadata/package/testing/
      - id: "metadata/file/naming::test-directory-component"
    desc: wget piped to dash
    crit: suspicious
    conf: 0.7
    attack: T1059.004
    if:
      type: text
      regex: '(?m)^[[:space:]]*(wget\b|[^#[:space:]][^\n]{0,220}\bwget\s+)[^|\n]{1,200}\|\s*dash\b'
  - id: wget-pipe-python
    desc: wget output piped directly to Python stdin
    crit: suspicious
    conf: 0.75
    attack: T1059.006
    if:
      type: text
      # Require Python to consume stdin directly. wget | python file.py
      # downloads data for a local parser; it does not execute the download.
      regex: '(?m)^[ \t]*wget\b[^\n|]{0,200}\|[ \t]*python3?[ \t]*(-[ \t]*)?($|[;&|])'
    not:
      - substr: GET_PIP_URL
      - substr: get-pip.py
      - substr: bootstrap.pypa.io
    unless:
      - id: well-known/tool/development/vscode-extension/vscode-marketplace::bwat-dev-vsix
      - id: well-known/tool/development/vscode-extension/vscode-marketplace::bwat-dev-member-path
      - id: well-known/lib/data/apache-beam::beam-package-context
      - id: metadata/package/testing/
      - id: well-known/tool/detection/
  - id: python-c-wget-command-substitution
    desc: python -c executes wget command substitution
    crit: suspicious
    conf: 0.9
    platforms: [unix, windows]
    for: [shell, python]
    attack: T1059.006
    if:
      type: text
      regex: 'python3?\s+-c\s+"\$\(wget\s+-q\s+-O-\s+http://'
  - id: curl-pipe-perl
    desc: Direct curl-to-Perl execution
    crit: suspicious
    conf: 0.75
    for: [shell]
    attack: T1059.005
    if:
      type: text
      regex: 'curl\s+.{0,200}\|\s*perl\s*(-|\s*)?(\n|$)'
    # example.com is the documentation host, including Semgrep rule samples.
    not:
      - substr: example.com
    unless:
      - id: metadata/package/testing/presence/path::git-tests-directory
      - id: well-known/tool/offensive/nmap::nmap-source-tree
  - id: wget-pipe-perl
    desc: wget piped to perl
    crit: suspicious
    conf: 0.75
    attack: T1059.005
    if:
      type: text
      regex: '(?m)^[[:space:]]*(wget\b|[^#[:space:]][^\n]{0,220}\bwget\s+).{0,200}\|\s*perl'
    unless:
      # cpanminus comments that its $0 assignment lets `curl/wget | perl` work.
      # fatscript.pm is that same installer, fat-packed.
      - type: path
        regex: App/cpanminus/
      - id: well-known/tool/development/vscode-extension/vscode-marketplace::bwat-dev-vsix
      - id: well-known/tool/development/vscode-extension/vscode-marketplace::bwat-dev-member-path
      - id: metadata/package/testing/
      - id: well-known/tool/detection/
  - id: wget-pipe-node
    desc: wget piped to node
    crit: suspicious
    conf: 0.75
    attack: T1059.007
    if:
      type: text
      regex: '(?m)^[[:space:]]*(wget\b|[^#[:space:]][^\n]{0,220}\bwget\s+)[^|\n]{1,200}\|\s*node\b'
    unless:
      - id: well-known/tool/development/vscode-extension/vscode-marketplace::bwat-dev-vsix
      - id: well-known/tool/development/vscode-extension/vscode-marketplace::bwat-dev-member-path
      - id: metadata/package/testing/
      - id: well-known/tool/detection/
  - id: curl-pipe-ruby
    desc: curl piped to ruby
    crit: suspicious
    conf: 0.75
    attack: T1059
    unless:
      - id: well-known/lib/runtime/scripted/jruby::archive-basename
      - id: well-known/lib/runtime/scripted/jruby::embedded-runtime-member
      - id: well-known/lib/runtime/scripted/jruby::embedded-runtime-path
      - id: well-known/lib/runtime/scripted/jruby::jruby-home-path
      - id: well-known/lib/runtime/scripted/jruby::module-marker
      - id: well-known/lib/runtime/scripted/jruby::stdlib-archive-marker
      - id: metadata/package/testing/
      - id: well-known/tool/detection/
    if:
      type: text
      regex: curl\s+.{0,200}\|\s*ruby
    not:
      - substr: encoding.spec.whatwg.org/encodings.json
      - substr: example.com
  - id: wget-pipe-ruby
    desc: wget piped to ruby
    crit: suspicious
    conf: 0.75
    attack: T1059
    if:
      type: text
      regex: '(?m)^[[:space:]]*(wget\b|[^#[:space:]][^\n]{0,220}\bwget\s+).{0,200}\|\s*ruby'
    unless:
      - id: well-known/tool/development/vscode-extension/vscode-marketplace::bwat-dev-vsix
      - id: well-known/tool/development/vscode-extension/vscode-marketplace::bwat-dev-member-path
      - id: metadata/package/testing/
      - id: well-known/tool/detection/
  - id: curl-pipe-shell-exception-ollama
    desc: Ollama install script reference
    crit: notable
    conf: 0.92
    unless:
      - type: path
        regex: '(?i)(^|[/\\])scripts/ollama\.py$'
      - id: well-known/lib/development/vscode::vscode-extension-marker
      - id: well-known/tool/detection/cert-x-gen::scanner-source-member-context
    if:
      type: text
      substr: ollama.com/install.sh
  - id: curl-pipe-shell-exception-evil-sh
    desc: Literal curl evil.sh pipe-to-bash reference
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(curl evil\.sh \| bash)'
  - id: curl-pipe-shell-exception-phone-bridge
    desc: Phone bridge installer reference
    crit: notable
    conf: 0.9
    if:
      type: text
      substr: install-phone-bridge.sh
  - id: curl-pipe-shell-exception-into-bash
    desc: curl-into-bash reference
    crit: notable
    conf: 0.9
    if:
      type: text
      substr: curl-into-bash
  - id: hosted-reverse-shell-service
    desc: hosted reverse shell service URL
    crit: suspicious
    conf: 0.96
    attack: T1105
    if:
      type: text
      # Anchor to the hostname position right after the scheme. A bare
      # `reverse-shell.` substring also matches deep inside unrelated dotted
      # identifiers -- e.g. a captured SAST report quoting a Semgrep rule
      # helpUri like ".../r/generic.ci.security.bash-reverse-shell.bash_
      # reverse_shell" -- where "reverse-shell." sits in a URL *path*, not a
      # hostname; the hostname charset class (no "/") excludes that shape.
      regex: 'https?://[a-z0-9.-]*reverse-shell\.[a-z]{2,10}\b'

  - id: opaque-dropper-url
    desc: Opaque dropper download URL
    crit: notable
    conf: 0.8
    for: [shell]
    if:
      type: text
      regex: 'https?://[a-z0-9-]{24,}\.[a-z0-9.-]+/[A-Za-z0-9_-]{40,}'

composite_rules:
  # A download piped into a shell where the source is a bare IPv4 address.
  #
  # The atoms in this file are all notable and the objectives-level ones anchor
  # the command at the start of a line -- deliberately, so documentation and API
  # examples that quote an install one-liner do not fire. The cost is that the
  # *executing* form is missed: in `system("curl -s http://<ip>/a.sh | sh")`,
  # `qx{...}`, `os.system(...)` or `execSync(...)` the command sits after a quote,
  # never at a line start. A Perl script doing exactly that scored risk 3 with
  # nothing above notable, while the same line in a shell file scores heavily.
  #
  # This composite recovers those cases from the other side -- the micro-behaviour
  # pipe atoms do fire on the embedded form -- and takes the *source address* as
  # the discriminator rather than the command shape. Vendor installers
  # (rustup.rs, get.docker.com, tailscale.com, astral.sh, ollama.com -- the
  # fifteen `not:` carve-outs on curl-pipe-sh) are all served from domains; an
  # implant staging from a hardcoded external IPv4 is not a distribution channel.
  # Measured over 108,671 text files under /usr/bin, /usr/share, /etc, /usr/lib,
  # /usr/sbin and /opt: zero files contain both a curl/wget pipe-to-shell and an
  # http://<ip> URL. `external-ipv4-http-url` also keeps RFC1918 out, so an
  # internal mirror at 10.x piping an install script is not a match.
  - id: raw-ip-wget-stdout-shell
    desc: Raw-IP wget stdout is piped into sh
    crit: hostile
    conf: 0.99
    attack: "T1105,T1059.004"
    for: [shell, python, javascript, ruby, perl]
    unless:
      - id: well-known/tool/detection/
    all:
      - id: micro-behaviors/communications/ip/literal::external-ipv4-http-url
      - id: micro-behaviors/communications/http/download/wget::wget-cmd
      - id: micro-behaviors/communications/http/download/cli::wget-q-flag
      - id: micro-behaviors/communications/http/download/cli::wget-stdout-flag
      - id: micro-behaviors/data/runtime/keywords::pipe-to-shell
  - id: raw-ip-curl-stdout-shell
    desc: Raw-IP curl stdout is piped into shell
    crit: hostile
    conf: 0.99
    attack: "T1105,T1059.004"
    for: [shell, python, javascript, ruby, perl]
    # Keep the IP URL and pipe-to-shell evidence in one local command span.
    # A package can document a trusted curl installer and separately configure
    # an API endpoint by raw IP; file-wide co-occurrence is not a raw-IP dropper.
    scope: file
    near_bytes: 256
    unless:
      - id: well-known/tool/detection/
    all:
      - id: micro-behaviors/communications/ip/literal::external-ipv4-http-url
    any:
      - id: micro-behaviors/process/create/shell/pipeline::curl-pipe-shell-literal
      - id: micro-behaviors/process/create/shell/pipeline::curl-pipe-bash-execution
  - id: curl-pipe-shell-carveouts
    desc: Known recognized usages of curl-pipe-shell
    crit: notable
    conf: 0.9
    any:
      - id: well-known/dual-use/tunnel/tailscale::install-script-url
      - id: curl-pipe-shell-exception-ollama
      - id: curl-pipe-shell-exception-evil-sh
      - id: metadata/file/string/identity::abbreviated-curl-bash-reference
      - id: curl-pipe-shell-exception-phone-bridge
      - id: curl-pipe-shell-exception-into-bash
  - id: node-curl-pipe-shell-exec
    desc: Node.js executes curl pipe shell
    crit: hostile
    conf: 0.94
    attack: "T1105, T1059.004"
    mbc: "B0032.001"
    for: [javascript]
    all:
      - id: micro-behaviors/process/create/shell/bridge::child-process-exec
      - id: micro-behaviors/process/create/shell/pipeline::curl-pipe-shell-text
    any:
      - id: micro-behaviors/communications/ip/literal::http-ip-url
      - id: micro-behaviors/communications/ip/literal::malformed-http-ip-url
      - id: hosted-reverse-shell-service
  - id: node-hosted-reverse-shell-pipe
    desc: Node executes hosted reverse shell
    crit: hostile
    conf: 0.96
    attack: "T1105, T1059.004"
    mbc: "B0032.001"
    for: [javascript]
    all:
      - id: micro-behaviors/os/module/require::child-process-require
      - id: curl-pipe-shell
      - id: hosted-reverse-shell-service
  - id: node-hosted-reverse-shell-curl-pipe
    desc: Node executes hosted reverse shell service
    crit: hostile
    conf: 0.97
    # The JavaScript-specific curl-pipe atom is also the complete branch that
    # was separately classified as a reverse shell. Keep one canonical
    # dropper-delivery finding and retain both JavaScript and shell execution
    # ATT&CK facets across the alternatives.
    attack: "T1105, T1059.004, T1059.007"
    mbc: "B0032.001"
    for: [javascript]
    all:
      - id: micro-behaviors/os/module/require::child-process-require
      - id: hosted-reverse-shell-service
    any:
      - id: curl-pipe-sh
      - id: micro-behaviors/process/create/shell/pipeline::curl-pipe-bash-execution
      - id: curl-pipe-shell-word
      - id: micro-behaviors/process/create/shell/pipeline::curl-pipe-zsh
      - id: curl-pipe-ksh
      - id: curl-pipe-dash
      - id: micro-behaviors/communications/http/download/curl::curl-pipe-shell-in-js-exec
  - id: npm-curl-pipe-shell-stage
    desc: NPM package code executes a remote curl stage through a POSIX shell
    # Native-package installers also use curl-to-shell bootstraps. This is a
    # strong supply-chain review signal, but it becomes hostile only when the
    # source or surrounding package context establishes attacker intent.
    crit: suspicious
    conf: 0.995
    for: [npm, javascript]
    attack: "T1195.002,T1105,T1059.004"
    mbc: "B0032.001"
    all:
      - id: metadata/import/builtin::child-process-api-destructure
      - id: micro-behaviors/communications/http/download/curl::curl-pipe-shell-in-js-exec
  # A plain download-to-interpreter pipeline is neutral installer behavior.
  # Attack judgements stay in composites that add execution context or intent,
  # while the canonical capability lives under process/create/shell/pipeline.
  - id: curl-pipe-shell
    desc: Curl output piped to shell
    crit: notable
    conf: 0.95
    attack: T1059.004
    any:
      - id: curl-pipe-sh
      - id: micro-behaviors/process/create/shell/pipeline::curl-pipe-bash-execution
      - id: curl-pipe-shell-word
      - id: micro-behaviors/process/create/shell/pipeline::curl-pipe-zsh
      - id: curl-pipe-ksh
    unless:
