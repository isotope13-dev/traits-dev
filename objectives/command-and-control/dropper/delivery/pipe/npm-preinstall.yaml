defaults:
  platforms: [unix, windows]
  for: [package.json]
traits:
  - id: preinstall-http-pipe-node
    desc: Preinstall pipes HTTP script into Node
    crit: suspicious
    conf: 0.98
    if:
      type: value
      path: scripts.preinstall
      regex: '^\s*(curl|wget)\s+[^|;\n]{0,160}https?://[^|;\s]{1,220}\s*\|\s*node\s*$'
    unless:
      # RFC 2606 documentation domains are non-routable: no remote code can be fetched.
      - id: micro-behaviors/communications/url/host::reserved-docs-domain-npm-script
composite_rules:
  - id: angular-lookalike-preinstall-loader
    desc: Angular lookalike executes remote preinstall payload
    crit: hostile
    conf: 0.99
    all:
      - id: preinstall-http-pipe-node
      - id: metadata/package/name/vocabulary::npm-scope-angular-lookalike
