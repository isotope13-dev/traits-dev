# An Android package whose stub dex only loads a native library that
# decrypts an opaque asset into dex bytecode and executes it through
# InMemoryDexClassLoader never exposes its real code to the package
# scanner. Market apps ship their code as dex in the clear; a native
# decrypt-and-load stage over a multi-megabyte opaque asset is a RAT
# loader, whatever brand the icon imitates.
defaults:
  platforms: [android]
  for: [apk, zip, dex, elf, xml]
  attack: T1027.007,T1105
  mbc: B0024

composite_rules:
  - id: android-native-decrypted-inmemory-dex-loader
    desc: Native stage decrypts opaque asset into in-memory dex
    crit: hostile
    conf: 0.96
    all:
      - id: micro-behaviors/process/create/loader::memory-dex-classloader-fragment
      - id: micro-behaviors/process/create/loader::dex-classloader-jni-ctor
      - id: objectives/command-and-control/dropper/delivery/download::android-opaque-asset-bundle

  - id: android-loader-requests-package-install
    desc: Loader app requests package install beside dex loading
    crit: hostile
    conf: 0.94
    all:
      - id: metadata/permission/management::android-request-install-packages-request
      - id: micro-behaviors/process/lifecycle/runtime-init::attach-base-context
      - id: objectives/anti-static/pack/dalvik::dex-load-library-reference
