defaults:
  platforms: [android]
  for: [elf]
  attack: "T1105, T1059"
  mbc: "B0024"

composite_rules:
  - id: android-native-http-hidden-tmp-stage
    desc: Android native HTTP hidden tmp stage
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/communications/http/get::manual-http10-dynamic-get
      - id: micro-behaviors/fs/path/temp::android-hidden-local-tmp-dotfile
      - id: micro-behaviors/fs/path/reference::new-file-suffix-format
      - id: micro-behaviors/process/info/name::android-app-process-name
