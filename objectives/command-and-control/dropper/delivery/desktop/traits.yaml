# Linux Desktop Entry droppers that use the Exec= field as a one-line shell
# staging surface. Neutral shell command-mode detection lives in the process
# tree; these composites add attack-specific download/decode/execute context.
defaults:
  conf: 0.99
  platforms: [linux]
  for: [desktop-entry]
  attack: T1059.004,T1105,T1140
  mbc: B0023

composite_rules:
  - id: desktop-entry-staged-executable-dropper
    desc: Desktop Entry downloads decodes and runs payload
    crit: hostile
    all:
      - id: micro-behaviors/process/create/shell/command-mode::desktop-exec-shell-command-mode
      - id: micro-behaviors/communications/http/download/cli::desktop-exec-download-tool
      - id: objectives/anti-static/obfuscation/eval/desktop::desktop-exec-decode-stage
      - id: objectives/anti-static/obfuscation/eval/desktop::desktop-exec-drop-path
      - id: micro-behaviors/fs/chmod/modify::desktop-exec-chmod
      - id: metadata/package/entrypoint::desktop-entry-chmod-variable-launch

  - id: desktop-entry-native-download-execute
    desc: Desktop Entry downloads and launches executable
    # Some legitimate launchers self-update this way; hostile consumers add
    # either a document lure or persistence evidence.
    crit: suspicious
    attack: T1105,T1204.002
    all:
      - id: micro-behaviors/process/create/shell/command-mode::desktop-exec-shell-command-mode
      - id: micro-behaviors/communications/http/download/cli::desktop-exec-download-tool
      - id: micro-behaviors/fs/chmod/modify::desktop-exec-chmod
    any:
      - id: metadata/file/profile/text-shape::desktop-entry-user-data-executable-launch
      - id: metadata/package/entrypoint::desktop-entry-hidden-temp-executable-launch
      - id: metadata/package/entrypoint::desktop-entry-chmod-variable-launch
      - id: metadata/package/entrypoint::desktop-entry-chmod-relative-launch

  - id: desktop-entry-decoy-document-dropper
    desc: Desktop stager and document URL references
    # The Exec value names a browser and URL, but does not bind either to
    # activation or prove the document is a decoy.
    crit: suspicious
    all:
      - id: desktop-entry-staged-executable-dropper
      - id: metadata/package/entrypoint::desktop-entry-browser-remote-document

  - id: desktop-elf-header-rebuild-dropper
    desc: Desktop stamps ELF magic then runs
    crit: hostile
    conf: 0.96
    attack: T1027,T1105,T1204.002
    all:
      - id: micro-behaviors/communications/http/download/cli::desktop-exec-download-tool
      - id: metadata/package/entrypoint::desktop-exec-elf-magic-stamp
    any:
      - id: metadata/package/entrypoint::desktop-entry-chmod-relative-launch
      - id: metadata/package/entrypoint::desktop-entry-chmod-variable-launch

  - id: desktop-entry-document-icon-stager
    desc: Staged desktop dropper hides behind a document icon
    crit: hostile
    attack: T1036.008,T1105,T1204.002
    all:
      - id: desktop-entry-staged-executable-dropper
      - id: objectives/evasion/masquerade/document::document-icon-shell-exec
