# Linux Desktop Entry droppers that use the Exec= field as a one-line shell
# staging surface. Neutral shell command-mode detection lives in the process
# tree; these composites add attack-specific download/decode/execute context.
defaults:
  platforms: [linux]
  for: [desktop-entry]
  attack: T1059.004,T1105,T1140
  mbc: B0023

composite_rules:
  - id: desktop-entry-staged-executable-dropper
    desc: Desktop Entry downloads decodes and runs payload
    crit: hostile
    conf: 0.99
    all:
      - id: micro-behaviors/process/create/shell/command-mode::desktop-exec-shell-command-mode
      - id: objectives/anti-static/obfuscation/eval/desktop::desktop-exec-download-tool
      - id: objectives/anti-static/obfuscation/eval/desktop::desktop-exec-decode-stage
      - id: objectives/anti-static/obfuscation/eval/desktop::desktop-exec-drop-path
      - id: objectives/anti-static/obfuscation/eval/desktop::desktop-exec-chmod

  - id: desktop-entry-decoy-document-dropper
    desc: Desktop Entry drops payload and opens decoy document
    crit: hostile
    conf: 0.99
    all:
      - id: desktop-entry-staged-executable-dropper
      - id: micro-behaviors/process/create/launch::desktop-entry-remote-document-launch
