# Archives that deliver an obfuscated VBScript dropper.
defaults:
  platforms: [windows]
  for: [rar, zip, 7z, vbs]
  attack: T1204.002,T1059.005,T1105
  mbc: B0030

composite_rules:
  - id: archive-vbs-obfuscated-dropper-carrier
    desc: Archive delivers an obfuscated VBScript dropper
    crit: hostile
    conf: 0.98
    scope: archive
    all:
      - id: metadata/archive/member/extension::archive-vbs-member
    any:
      - id: objectives/anti-static/obfuscation/string/concat::vbs-fragmented-powershell-evaluation
      - id: objectives/anti-static/obfuscation/string/junking::junk-padded-stride-loader
      - id: objectives/anti-static/obfuscation/string/junking::junk-padded-stride-execute-loader
      - id: objectives/anti-static/obfuscation/string/junking::vbs-powershell-env-staged-execute-loader
      - id: objectives/anti-static/obfuscation/string/junking::junk-padded-powershell-hidden-shell-run
      - id: objectives/anti-static/obfuscation/string/junking::junk-padded-staged-script-dropper
      - id: objectives/anti-static/obfuscation/eval/loader::vbs-stride-powershell-fragment-decryptor
      - id: objectives/command-and-control/dropper/staging/encoded/carrier::vbs-obfuscated-stage-launch-cleanup
      - id: objectives/command-and-control/dropper/staging/encoded/script::xor-decoded-vbs-execute-stage
      - id: objectives/command-and-control/dropper/staging/encoded/script::xor-decoded-vbs-executeglobal-stage
      - id: objectives/command-and-control/dropper/staging/encoded/script::split-decoded-vbs-execute-stage
