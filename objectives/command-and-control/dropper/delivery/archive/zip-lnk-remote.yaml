# ZIP archives that contain only (or primarily) a weaponized .lnk member.
# Member-level shortcut droppers are evaluated on the nested LNK; these
# composites surface the same intent on the outer ZIP for triage.
defaults:
  platforms: [windows]
  for: [zip]
  attack: T1204.002,T1105,T1564.003

composite_rules:
  - id: zip-lnk-remote-stage-carrier
    desc: ZIP delivers a minimized remote-stage shortcut
    crit: hostile
    conf: 0.98
    for: [zip, lnk]
    scope: archive
    all:
      - id: metadata/package/files/archive-member::archive-shortcut-member
      - id: objectives/execution/interpreter/script/mshta::lnk-minimized-split-mshta-remote-stage

  - id: zip-lnk-browser-icon-remote-carrier
    desc: ZIP delivers Edge-icon remote-stage shortcut
    crit: hostile
    conf: 0.99
    for: [zip, lnk]
    scope: archive
    all:
      - id: metadata/package/files/archive-member::archive-shortcut-member
      - id: objectives/evasion/masquerade/file/lure::lnk-browser-icon-remote-command-lure
