# ZIP archives that deliver a purchase-order-numbered Windows executable lure
# (often a .scr screensaver) at an atypical member path.
defaults:
  platforms: [windows]
  for: [zip]
  attack: T1204.002,T1036.005

composite_rules:
  - id: zip-po-numbered-executable-lure-carrier
    desc: ZIP delivers a numbered purchase-order executable lure
    crit: hostile
    conf: 0.96
    for: [zip, pe]
    scope: archive
    all:
      - id: metadata/file/archive::archive-misplaced-executable-member
      - id: objectives/evasion/masquerade/file/payment::purchase-order-number-exe-lure
    unless:
      - id: metadata/signed/platform/
