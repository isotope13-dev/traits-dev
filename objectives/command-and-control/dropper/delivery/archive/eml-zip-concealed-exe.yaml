# A lure email delivering a ZIP archive payload with worm tooling signs.
#
# The message is multipart with a base64 part that opens with ZIP magic and
# a .zip attachment, written in a foreign charset (KOI8-R lure), composed
# with Outlook Express, and carrying a self-asserted spam-negative header.
# No single leg convicts; the six-way conjunction is the worm shape.
defaults:
  platforms: [windows, unix]
  for: [text, makefile]
composite_rules:
  - id: eml-zip-lure-payload
    desc: Lure email delivers ZIP archive payload
    crit: hostile
    conf: 0.93
    all:
      - id: micro-behaviors/communications/email/mime::eml-multipart-mixed
      - id: micro-behaviors/communications/email/mime::mime-base64-attachment
      - id: micro-behaviors/communications/email/mime::eml-zip-attachment
      - id: micro-behaviors/communications/email/mime::eml-base64-zip-magic
      - id: micro-behaviors/communications/email/mime::eml-koi8r-charset
      - id: micro-behaviors/communications/email/mime::eml-fake-spam-negative
