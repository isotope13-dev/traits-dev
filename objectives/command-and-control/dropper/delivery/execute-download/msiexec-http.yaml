defaults:
  platforms: [windows]
  for: [powershell, batch, scripts]
  attack: T1218.007,T1105

traits:
  - id: msiexec-nonascii-switch
    desc: msiexec switch uses non-ASCII letters
    crit: notable
    conf: 0.93
    if:
      type: text
      regex: '(?i)\bmsiexec(\.exe)?\b[^\r\n]{0,48}[-/][A-Za-z]*[\U00000100-\U0000FFFF]'

composite_rules:
  - id: msiexec-quiet-ipv4-http-install
    desc: Quiet msiexec install from a raw IPv4 URL
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/process/create/installer::msiexec-ipv4-http
      - id: micro-behaviors/process/create/installer::msiexec-quiet-switch
  - id: msiexec-homoglyph-ipv4-install
    desc: Homoglyph msiexec IPv4 URL install
    crit: hostile
    conf: 0.98
    all:
      - id: msiexec-nonascii-switch
      - id: micro-behaviors/process/create/installer::msiexec-ipv4-http
  - id: msiexec-homoglyph-quiet-install
    desc: Homoglyph msiexec quiet remote install
    crit: hostile
    conf: 0.97
    all:
      - id: msiexec-nonascii-switch
      - id: micro-behaviors/process/create/installer::msiexec-quiet-switch
