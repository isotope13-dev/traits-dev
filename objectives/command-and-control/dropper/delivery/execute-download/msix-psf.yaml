# A sideloaded MSIX whose Package Support Framework config starts a hidden
# PowerShell script, and whose PowerShell fetches from the network: the
# installer-as-stager pattern of the 2023-24 malicious MSIX waves, where the
# signed package's decoy app is incidental and the start script is the
# payload. Structural, so it holds when the script's own download/execute
# logic is obfuscated past the per-cmdlet rules.
defaults:
  platforms: [windows]
  attack: T1204.002,T1059.001,T1105

composite_rules:
  - id: msix-psf-hidden-script-network-fetch
    desc: MSIX runs a hidden PowerShell that fetches
    crit: suspicious
    conf: 0.88
    for: [zip, json, powershell]
    scope: archive
    all:
      - id: metadata/file/format/appx::appx-manifest-member
      - id: metadata/file/format/appx::psf-start-script-ps1
      - id: metadata/file/format/appx::psf-start-script-hidden
    any:
      - id: micro-behaviors/communications/http/lib/invoke-webrequest::invoke-webrequest
      - id: micro-behaviors/communications/http/lib/invoke-webrequest::invoke-restmethod
      - id: micro-behaviors/communications/http/lib/invoke-webrequest::webclient-download
      - id: micro-behaviors/communications/http/client/managed::downloadstring
