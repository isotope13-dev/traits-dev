defaults:
  for: [vbs]
  platforms: [windows]
  attack: T1105,T1059.007
composite_rules:
  - id: remote-wsh-webdav-tunnel
    desc: WSH stages a script through an SSL WebDAV tunnel
    crit: hostile
    conf: 0.99
    all:
    - id: micro-behaviors/communications/http/webdav::webdav-ssl-unc-path
    - id: objectives/command-and-control/infrastructure/domain/tunnel::cloudflare-tunnel
    - id: micro-behaviors/os/wsh/file::wsh-windows-interpreter-option

  # WSH (including .wsf jobs, typed xml) launching a command straight off an
  # SSL WebDAV UNC share: the trycloudflare/WebDAV loader chain that runs a
  # remote .bat/.vbs stage without writing it locally first.
  - id: wsh-shell-run-webdav-unc
    desc: WSH shell runs a payload from SSL WebDAV
    crit: hostile
    conf: 0.97
    for: [vbs, xml]
    attack: T1105,T1059.005
    all:
    - id: micro-behaviors/os/com/automation::wscript-shell-literal
    - id: micro-behaviors/process/create/shell/wsh::wscript-shell-run-statement
    - id: micro-behaviors/communications/http/webdav::webdav-ssl-unc-path
    near_bytes: 400
