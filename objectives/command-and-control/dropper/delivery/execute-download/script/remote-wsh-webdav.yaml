defaults:
  for: [vbs]
  platforms: [windows]
  attack: T1105,T1059.007
traits:
  # A WSH settings stub whose declared script lives on a network share:
  # opening the stub hands the remote file to Windows Script Host. Local
  # script settings name a local path; a UNC target makes the stub a
  # one-click remote loader. The SSL-WebDAV and quick-tunnel transports have
  # their own hostile composites built on the shared atoms below; this is
  # the transport-agnostic form, plain SMB included.
  - id: script-stub-remote-script-target
    desc: Script settings stub targets a remote script
    crit: suspicious
    conf: 0.92
    for: [text]
    attack: T1105,T1204.002
    if:
      type: text
      regex: '(?i)\[ScriptFile\]\s*Path\s*=[ \t]*[\\/]{2}\S{1,99}\.(wsf|vbs|js|hta)'

composite_rules:
  - id: remote-wsh-webdav-tunnel
    desc: WSH stages a script through an SSL WebDAV tunnel
    crit: hostile
    conf: 0.99
    all:
    - id: micro-behaviors/communications/http/webdav::webdav-ssl-unc-path
    - id: micro-behaviors/communications/url/host/name::cloudflare-tunnel-host-reference
    any:
    - id: micro-behaviors/process/interpreter/scripting::wsh-windows-interpreter-option
    - id: micro-behaviors/process/create/shell/wsh::wscript-shell-run-statement
    - id: micro-behaviors/os/com/automation::wscript-shell-literal

  # WSH (including .wsf jobs, typed xml) launching a command straight off an
  # SSL WebDAV UNC share: the trycloudflare/WebDAV loader chain that runs a
  # remote .bat/.vbs stage without writing it locally first.
  - id: wsh-shell-run-webdav-unc
    desc: WSH shell runs a payload from SSL WebDAV
    crit: hostile
    conf: 0.97
    for: [vbs, xml]
    attack: T1105,T1059.005
    all:
    - id: micro-behaviors/os/com/automation::wscript-shell-literal
    - id: micro-behaviors/process/create/shell/wsh::wscript-shell-run-statement
    - id: micro-behaviors/communications/http/webdav::webdav-ssl-unc-path
    near_bytes: 400

  # The settings-stub form of the same chain: a Windows Script Host settings
  # file (.wsh) whose [ScriptFile] Path= names a script on an SSL WebDAV
  # share. Opening the stub makes WSH fetch and run that script through the
  # WebDAV redirector -- the delivered stage never touches disk as a
  # download, and the loader is a few dozen bytes of INI. Loader campaigns
  # host the share on ephemeral tunnels precisely so the stub outlives the
  # infrastructure; the tunnel-host form has its own composite under
  # command-and-control/infrastructure/domain/tunnel.
  - id: wsh-settings-stub-webdav-script
    desc: Script settings stub opens a WebDAV script
    crit: hostile
    conf: 0.96
    for: [text]
    attack: T1105,T1204.002
    all:
    - id: metadata/file/format/structured::wsh-settings-script-header
    - id: micro-behaviors/communications/http/webdav::webdav-ssl-unc-path
