# Go source that spawns hidden PowerShell to download a file, certutil-decode
# it into a .ps1 and Start-Process that script: the full download -> decode ->
# run chain. The neutral evidence bundle is the micro-behaviors context
# composite; this rule carries the dropper conviction it lost in the
# Linnaeus move (was dropper/execution/source::go-powershell-certutil-stage).
defaults:
  platforms: [windows]
  for: [go]
  attack: T1105,T1140,T1059.001,T1564.003
  mbc: B0030,C0026

composite_rules:
  - id: go-powershell-certutil-stage
    desc: Go PowerShell stager decodes, runs script
    crit: hostile
    conf: 0.99
    all:
      - id: micro-behaviors/process/create/hidden::go-powershell-certutil-decode-context
      # The Start-Process that runs the decoded script is itself hidden.
      - id: micro-behaviors/process/create/hidden::start-process-windowstyle-hidden
