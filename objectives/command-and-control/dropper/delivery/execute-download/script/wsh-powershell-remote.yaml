defaults:
  platforms:
  - windows
  for:
  - vbs
  - javascript
  attack: T1059.001,T1059.005,T1105
  mbc: B0030
  crit: hostile
  conf: 0.98
composite_rules:
- id: wsh-exec-powershell-remote-script
  desc: WSH runs PowerShell fetching remote script
  all:
  - id: micro-behaviors/process/create/shell/wsh::wscript-shell-run-statement
  any:
  - id: micro-behaviors/process/deploy/script-eval::powershell-downloadstring-iex-inline
  - id: micro-behaviors/process/deploy/script-eval::embedded-powershell-webclient-script-eval
  - id: micro-behaviors/communications/http/download/cli::embedded-powershell-irm-iex-command
  - id: micro-behaviors/communications/http/download/cli::embedded-iwr-pipe-iex
- id: wsh-hidden-powershell-webclient-download
  for:
  - vbs
  desc: WSH runs hidden PowerShell WebClient download
  all:
  - id: micro-behaviors/process/create/shell/wsh::wscript-shell-run-statement
  - id: micro-behaviors/communications/http/client/managed::webclient-download-operation-text
  - id: micro-behaviors/process/argument/option::powershell-flagged-command-line
  any:
  - id: micro-behaviors/process/create/hidden::wsh-run-hidden-wait-statement
  - id: micro-behaviors/process/create/flags::wsh-hidden-async-run
  - id: micro-behaviors/process/create/hidden::wsh-run-hidden-statement
- id: wsh-encoded-powershell-defender-exclusion-executable-downloader
  for:
  - vbs
  desc: WSH stages an executable with an encoded PowerShell Defender exclusion
  attack: T1059.001,T1105,T1562.001
  all:
  - id: metadata/lang/source/syntax/command/invocation::encoded-command-line
  - id: micro-behaviors/communications/http/download/cli::encoded-iwr-outfile-command
  - id: micro-behaviors/communications/http/url/script::http-executable-url-reference
  - id: micro-behaviors/os/security/defender::defender-exclusion-command
  - id: micro-behaviors/os/security/policy::execution-policy-bypass
  - id: micro-behaviors/process/create/hidden::powershell-hidden-window
