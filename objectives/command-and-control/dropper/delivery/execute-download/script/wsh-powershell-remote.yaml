# A WSH (VBScript or JScript) script that hands the download-and-execute work
# to PowerShell.
#
# The carrier is a WSH script launching PowerShell with a WebClient download
# cradle (DownloadString / irm / iwr evaluated via IEX). Paired with execution
# policy bypass or hidden-window execution, this is an unauthenticated remote
# script fetch-and-execute dropper.
defaults:
  platforms: [windows]
  for: [vbs, javascript]
  attack: T1059.001,T1059.005,T1105
  mbc: B0030

composite_rules:
  - id: wsh-exec-powershell-remote-script
    desc: WSH runs PowerShell fetching remote script
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/process/create/shell/wsh::wscript-shell-run-statement
    any:
      - id: micro-behaviors/process/deploy/script-eval::powershell-downloadstring-iex-inline
      - id: micro-behaviors/process/interpreter/eval/direct::embedded-powershell-webclient-script-eval
      - id: micro-behaviors/communications/http/download/cli::embedded-powershell-irm-iex-command
      - id: micro-behaviors/communications/http/download/cli::embedded-iwr-pipe-iex

  - id: js-startup-batch-powershell-webclient-dropper
    for: [javascript, typescript]
    desc: JScript plants Startup batch with hidden WebClient cradle
    crit: hostile
    conf: 0.97
    attack: T1059.001,T1105,T1547.001
    all:
      - id: micro-behaviors/fs/path/autostart::wsh-special-folders-startup
      - id: micro-behaviors/fs/write/content::create-batch-from-bound-path
      - id: micro-behaviors/process/interpreter/eval/direct::embedded-powershell-webclient-script-eval

  - id: wsh-hidden-powershell-webclient-download
    for: [vbs]
    desc: WSH runs hidden PowerShell WebClient download
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/process/create/shell/wsh::wscript-shell-run-statement
      - id: micro-behaviors/communications/http/download/webclient::webclient-download-call
      - id: micro-behaviors/process/argument/option::powershell-flagged-command-line
    any:
      - id: micro-behaviors/process/create/hidden::wsh-run-hidden-wait-statement
      - id: micro-behaviors/process/create/flags::wsh-hidden-async-run
      - id: micro-behaviors/process/create/hidden::wsh-run-hidden-statement
