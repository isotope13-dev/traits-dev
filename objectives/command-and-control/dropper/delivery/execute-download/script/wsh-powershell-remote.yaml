# A WSH (VBScript or JScript) script that hands the download-and-execute work
# to PowerShell.
#
# The carrier is a WSH script launching PowerShell with a WebClient download
# cradle (DownloadString / irm / iwr evaluated via IEX). Paired with execution
# policy bypass or hidden-window execution, this is an unauthenticated remote
# script fetch-and-execute dropper.
defaults:
  platforms: [windows]
  for: [vbs, javascript]
  attack: T1059.001,T1059.005,T1105
  mbc: B0030

composite_rules:
  - id: wsh-exec-powershell-remote-script
    desc: WSH runs PowerShell fetching remote script
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/process/create/shell/wsh::wscript-shell-run-statement
    any:
      - id: micro-behaviors/process/create/shell/pipeline::powershell-downloadstring-iex-inline
      - id: micro-behaviors/process/interpreter/eval/direct::embedded-powershell-webclient-script-eval
      - id: micro-behaviors/communications/http/download/cli::embedded-powershell-irm-iex-command
      - id: micro-behaviors/communications/http/download/cli::embedded-iwr-pipe-iex
