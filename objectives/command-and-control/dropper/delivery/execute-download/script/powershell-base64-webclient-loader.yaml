# Base64-wrapped PowerShell stage that fetches a second script and evaluates it.
defaults:
  platforms: [windows]
  for: [powershell]
  attack: T1027,T1059.001,T1105
  mbc: B0030,B0032

composite_rules:
  - id: powershell-base64-webclient-loader
    desc: PowerShell decodes a WebClient download-and-evaluate loader
    crit: hostile
    conf: 0.98
    near_lines: 5
    all:
      - id: micro-behaviors/data/decode/base64::powershell-frombase64string
      - id: micro-behaviors/communications/http/client/managed::webclient
      - id: micro-behaviors/communications/http/client/managed::downloadstring
      - id: micro-behaviors/process/interpreter/eval/direct::powershell-iex-text
