# .NET downloaders that stage remote executables through hidden shells.
defaults:
  for: [pe, dll, csharp]
  platforms: [windows]
  attack: T1105
  mbc: B0030

composite_rules:
  - id: dotnet-powershell-hidden-remote-script-dropper
    for: [pe]
    desc: .NET downloads and launches a remote PowerShell script hidden
    crit: hostile
    conf: 0.99
    attack: "T1105,T1059.001,T1564.003"
    all:
      - id: metadata/binary/framework::dotnet-assembly
      - id: micro-behaviors/fs/path/application/executable::powershell-executable-token
      - id: micro-behaviors/communications/http/client/library::iwr-uri
      - id: micro-behaviors/process/create/hidden::start-process-windowstyle-hidden
      - id: micro-behaviors/communications/http/url/github::raw-githubusercontent-web-file

  - id: dotnet-github-hidden-shell-exe-dropper
    for: [pe]
    desc: .NET fetches GitHub release EXE via hidden shell
    crit: hostile
    conf: 0.98
    attack: "T1105,T1059.001,T1564.003"
    all:
      - id: micro-behaviors/communications/url/external/github::github-release-download
      - id: micro-behaviors/process/create/shell/spawn::shell-execution-comp
      - id: micro-behaviors/process/create/hidden::powershell-windowstyle-hidden-option
      - id: micro-behaviors/process/create/exec::dotnet-shell-interpreter-reference
    unless:
      - id: metadata/signed/platform/

  - id: dotnet-remote-exe-download-hidden-launch
    for: [pe]
    desc: .NET downloads remote EXE and launches hidden
    crit: hostile
    conf: 0.97
    attack: "T1105,T1059.001,T1564.003"
    all:
      - id: metadata/binary/framework::dotnet-assembly
      - id: micro-behaviors/communications/http/client/managed::httpclient
      - id: micro-behaviors/process/create/shell/spawn::shell-execution-comp
      - id: micro-behaviors/process/create/hidden::powershell-windowstyle-hidden-option
    any:
      - id: micro-behaviors/communications/url/external/github::github-release-download
      - id: micro-behaviors/communications/http/url/domain::workers-dev-url
      - id: micro-behaviors/communications/http/url/domain::http-url-binary
    unless:
      - id: metadata/signed/platform/
      - id: well-known/lib/ai/openai::openai-dotnet-official-library
