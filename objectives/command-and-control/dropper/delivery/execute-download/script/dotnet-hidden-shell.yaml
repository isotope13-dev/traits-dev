# .NET downloaders that stage remote executables through hidden shells.
defaults:
  for: [pe, dll, csharp]
  platforms: [windows]
  attack: T1105
  mbc: B0030

composite_rules:
  - id: dotnet-powershell-hidden-remote-script-dropper
    for: [pe]
    desc: .NET downloads and launches a remote PowerShell script hidden
    crit: hostile
    conf: 0.99
    attack: "T1105,T1059.001,T1564.003"
    all:
      - id: metadata/binary/framework::dotnet-assembly
      - id: micro-behaviors/fs/path/application/executable::powershell-executable-token
      - id: micro-behaviors/communications/http/client/library::iwr-uri
      - id: micro-behaviors/process/create/hidden::start-process-windowstyle-hidden
      - id: micro-behaviors/communications/http/url/github::raw-githubusercontent-web-file
