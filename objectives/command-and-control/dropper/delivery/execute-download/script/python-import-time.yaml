# A package module that downloads a payload and runs it when it is imported.
#
# The compromised guardrails-ai 0.10.1 wheel appended nine lines to
# `guardrails/__init__.py`: a platform check, a hardcoded URL on a typosquatted
# host, a urllib download into `/tmp/transformers.pyz`, and
# `subprocess.run(["python3", PATH])`. Nothing calls it -- `import guardrails`
# is the trigger, so the payload runs during a test suite, an IDE's import
# resolution, or any dependency that happens to load the package.
#
# The whole chain is at module scope, which is what separates it from a
# library that downloads a model or a dataset inside a function the caller
# chooses to invoke.
defaults:
  platforms: [unix, windows]
  for: [python]
  attack: T1195.002,T1105,T1059.006
  mbc: B0024

composite_rules:
  - id: import-time-download-and-interpret
    desc: Import-time download runs through an interpreter
    crit: hostile
    conf: 0.96
    all:
      # Fetch, and the response written to a file rather than used in memory.
      - id: micro-behaviors/fs/write/file/response-body::python-write-response-read
      - id: micro-behaviors/process/create/subprocess::python-interpreter-runs-variable-path
      # Module scope: the code runs on import, not on call.
      - id: micro-behaviors/data/control-flow/module-exec::module-level-execution
    any:
      - id: micro-behaviors/communications/http/lib/urllib::urllib-urlopen-call
      - id: micro-behaviors/communications/http/lib/requests::requests-get
      - id: micro-behaviors/communications/http/request/client::request-python
    unless:
      - id: metadata/package/testing/
      - id: metadata/build/recognized-contexts::benign-build-tooling-context
      - id: "metadata/file/naming::test-directory-component"

  - id: import-time-urlretrieve-silent-launch
    desc: Import-time urlretrieve silently launches downloaded payload
    crit: hostile
    conf: 0.97
    all:
      - id: micro-behaviors/communications/http/lib/urllib::urllib-urlretrieve-dup
      - id: micro-behaviors/process/interpreter/python::pythonw-subprocess-no-window-profile
      - id: micro-behaviors/data/control-flow/module-exec::module-level-execution
    unless:
      - id: metadata/package/testing/
      - id: metadata/build/recognized-contexts::benign-build-tooling-context
      - id: "metadata/file/naming::test-directory-component"


  # urlretrieve writes the response straight to a file, so the write leg of
  # import-time-download-and-interpret never appears. This is the exact
  # guardrails-ai shape: urlretrieve to a path, then an interpreter run on it.
  - id: import-time-urlretrieve-and-interpret
    desc: Import-time urlretrieve runs through an interpreter
    crit: hostile
    conf: 0.96
    all:
      - id: micro-behaviors/communications/http/lib/urllib::urllib-urlretrieve-dup
      - id: micro-behaviors/process/create/subprocess::python-interpreter-runs-variable-path
      - id: micro-behaviors/data/control-flow/module-exec::module-level-execution
    unless:
      - id: metadata/package/testing/
      - id: metadata/build/recognized-contexts::benign-build-tooling-context
      - id: "metadata/file/naming::test-directory-component"
    # The windowless pythonw sibling above restates this chain with more
    # evidence; step down when it fires so one chain is not convicted twice.
    downgrade:
      any:
        - id: import-time-urlretrieve-silent-launch
