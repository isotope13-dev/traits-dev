# A PowerShell script that fetches remote script content with
# WebClient.DownloadString and evaluates it with Invoke-Expression in a later
# statement. Unlike the single-line IEX(DownloadString(...)) cradle, the fetch
# and the eval are staged apart (download to a variable, then IEX the
# variable), which is the Cobalt Strike PowerShell stager shape. Either half
# alone is ordinary scripting; fetching remote code and executing it in one
# script is a remote-code stager.
defaults:
  platforms: [windows]
  for: [powershell]
  attack: T1059.001,T1105
  mbc: B0030

composite_rules:
  - id: powershell-staged-download-iex-eval
    desc: PowerShell evaluates a staged web download with IEX
    crit: suspicious
    conf: 0.95
    scope: file
    all:
      - id: micro-behaviors/communications/http/client/managed::downloadstring
      - id: micro-behaviors/process/interpreter/eval/direct::powershell-iex-text
    near_bytes: 2000
  # The staged download above, launched hidden with TLS verification
  # disabled: a download cradle that hides its window and blinds itself to
  # MITM is a payload stager, not an updater.
  - id: powershell-hidden-cradle-launch
    desc: Hidden download cradle with certificate bypass
    crit: hostile
    conf: 0.97
    scope: file
    all:
      - id: powershell-staged-download-iex-eval
      - id: micro-behaviors/process/create/managed::powershell-processstartinfo-hidden-window
      - id: micro-behaviors/communications/tls/verify/callback::powershell-callback-accepts-all-certificates
  - id: powershell-empire-cradle-module
    desc: Empire stages a hidden download cradle
    crit: hostile
    conf: 0.98
    scope: file
    all:
      - id: powershell-hidden-cradle-launch
      - id: well-known/tool/offensive/powershell-empire::extra-exec-module-functions-b
