# Minimal WSH stager: one-line VBScript that runs the first script argument as a
# child process with a hidden window and without waiting. Campaign droppers pair
# this helper with a second-stage executable path passed on the command line.
defaults:
  platforms: [windows]
  for: [vbs]
  attack: T1204.002,T1059.005,T1564.003
  mbc: B0023

composite_rules:
  - id: vbs-hidden-first-argument-path-launcher
    desc: VBScript hidden launcher runs first argument path
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/process/create/exec::vbs-inline-shell-first-argument
      - id: micro-behaviors/process/create/flags::wsh-hidden-async-run
