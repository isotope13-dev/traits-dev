# PHP server-side dropper patterns.
# The combination below is a complete download/chmod/execute chain, not a
# generic curl or chmod capability.  It covers web-plugin backdoors that fetch
# a binary and launch it from the application user's home directory.
defaults:
  crit: hostile
  conf: 0.99
  platforms: [unix, windows]
  for: [php]
  attack: T1105,T1059.004

composite_rules:
  - id: php-remote-stage-temp-interpreter-exec
    desc: PHP fetches a temp stage and executes it
    all:
      - id: micro-behaviors/communications/http/client/file-read::php-http-file-request
      - id: micro-behaviors/fs/path/temp::hidden-tmp-path
      - id: micro-behaviors/process/create/shell/spawn::php-shell-exec
    any:
      - id: micro-behaviors/communications/http/curl::php-curl-request
      - id: micro-behaviors/communications/http/client/file-read::php-http-file-request
  - id: php-request-payload-drop-chmod-executable
    desc: PHP drops request payload and marks executable
    crit: hostile
    conf: 0.98
    attack: T1105,T1222.002
    all:
      - id: micro-behaviors/fs/write/file/full::php-file-put-contents
      - id: micro-behaviors/fs/chmod/executable/mode::chmod-0755-mode
      - id: micro-behaviors/communications/http/request/superglobal::post-dup
    any:
      - id: micro-behaviors/data/decode/base64::php-base64-request-param
      - id: micro-behaviors/communications/http/client/file-read::php-http-variable-source-read
      - id: micro-behaviors/communications/http/request/superglobal::php-request-selected-resource-open
