# A Java class or JAR that hands download-and-execute work to PowerShell.
#
# The carrier is a Java class or JAR executing PowerShell with a download cradle
# (such as irm/Invoke-RestMethod or iwr/Invoke-WebRequest evaluated via iex).
# Paired with process creation primitives (ProcessBuilder or Runtime.exec),
# this fetches and executes an unauthenticated remote script.
defaults:
  platforms: [windows]
  for: [class, jar, java]
  attack: T1059.001,T1105
  mbc: B0030

composite_rules:
  - id: java-process-execution-primitive
    desc: Java process execution primitive
    crit: component
    conf: 0.95
    any:
      - id: micro-behaviors/process/create/subprocess::java-processbuilder-bytecode
      - id: micro-behaviors/process/create/subprocess::java-processbuilder-source
      - id: micro-behaviors/process/create/exec::java-runtime-exec-bytecode-reference
      - id: micro-behaviors/process/create/spawn::java-processbuilder-cmd-start

  - id: java-exec-powershell-remote-script
    desc: Java execution runs PowerShell fetching remote script
    crit: hostile
    conf: 0.98
    all:
      - id: java-process-execution-primitive
      - id: micro-behaviors/fs/path/application/executable::powershell-executable-token
    any:
      - id: micro-behaviors/communications/http/lib/invoke-webrequest::embedded-irm-iex-pipeline
      - id: micro-behaviors/communications/http/lib/invoke-webrequest::embedded-iex-irm-call
      - id: micro-behaviors/communications/http/download/cli::embedded-powershell-irm-iex-command
      - id: micro-behaviors/communications/http/download/cli::embedded-iwr-pipe-iex
