# WSH scripts that use a shell command to fetch a remote batch stage and then
# launch the saved batch file. The combination of remote transfer, an explicit
# batch-file execution, and a raw-IP endpoint establishes a downloader rather
# than merely documenting curl or starting a local helper.
defaults:
  platforms: [windows]
  for: [vbs]
  attack: T1105,T1059.005,T1059.003
  mbc: B0030

composite_rules:
  - id: wsh-raw-ip-curl-batch-download-execution
    desc: WSH fetches and runs batch scripts from a raw-IP endpoint
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/os/com/automation::wscript-shell-createobject
      - id: micro-behaviors/process/create/shell/wsh::wscript-shell-run-statement
      - id: micro-behaviors/communications/ip/literal::external-ipv4-http-url
      - id: micro-behaviors/communications/http/download/cli::fetch-output-flag-script
      - id: micro-behaviors/process/create/script/file::batch-script-exec-wscript
