# TFTP remains common on embedded and network appliances. A reference or
# ordinary transfer is only a network capability; retrieving a file to a
# local absolute path and immediately passing that same file to a shell is a
# payload-staging sequence.
defaults:
  platforms: [unix, appliance]
  for: [scripts, source, binaries]
  attack: T1105,T1059.004
  mbc: B0024

composite_rules:
  - id: tftp-fetch-shell-execute
    desc: TFTP fetch followed by shell execution
    crit: suspicious
    conf: 0.98
    all:
      - id: micro-behaviors/communications/ftp/download/tftp::command
      - id: micro-behaviors/communications/ftp/download/tftp::client-local-file
      - id: micro-behaviors/process/create/shell/target::shell-exec-script-path
    # Keep the retrieval and execution in one command block. Requiring all
    # three mechanics distinguishes a transfer from payload staging without
    # relying on an attacker-chosen filename.
    near_lines: 1
