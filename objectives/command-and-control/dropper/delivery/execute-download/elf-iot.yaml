defaults:
  platforms: [linux]
  for: [elf]
  attack: "T1105,T1059.004"
  mbc: E1105

traits:
  - id: native-download-then-chmod
    desc: Native binary embeds download then chmod
    crit: suspicious
    conf: 0.98
    attack: "T1105,T1222.002"
    platforms: [linux, android]
    if:
      type: text
      regex: '(?i)(wget|curl)[^\n]{0,120}chmod\s+(\+x|777)'
    unless:
      - id: well-known/tool/detection/ascan::ascan-defensive-scanner-context
      - id: well-known/tool/detection/ascan::ascan-package-context
      - id: well-known/tool/detection/ascan::ascan-package-path
  - id: native-download-pipe-shell
    desc: Native binary embeds download piped to shell
    crit: suspicious
    conf: 0.98
    platforms: [linux, android]
    if:
      type: text
      # A command needs whitespace between the client and its arguments.
      # Without it, embedded guardrail regexes such as
      # `curl_bash_execution(curl|wget)\s+...` look like commands themselves.
      regex: '(?i)(wget|curl)\s+[^\n]{0,120}\|\s*(ba|da)?sh\b'
    unless:
      - id: well-known/tool/detection/ascan::ascan-defensive-scanner-context
      - id: well-known/tool/detection/ascan::ascan-package-context
      - id: well-known/tool/detection/ascan::ascan-package-path
      # Runtimes document their own installer one-liner in help/upgrade text
      # (Bun embeds `curl ... bun.com/install | bash`); that publication is
      # not a download-and-execute implant. The canonical Bun runtime
      # identity context lives with the other Bun runtime signatures.
      - id: well-known/lib/runtime/scripted/bun-runtime::unix-runtime-context
      - id: well-known/tool/development/cli/swytchcode::swytchcode-cli-context

composite_rules:
  - id: download-permission-execute-chain
    desc: Native binary embeds a download, chmod, and execute chain
    crit: suspicious
    conf: 0.98
    attack: "T1105,T1222.002,T1059.004"
    platforms: [linux, android]
    all:
      - id: native-download-then-chmod
      - id: micro-behaviors/process/create/local-exec::chmod-then-local-execute-command

  - id: hex-encoded-iot-shell-stager
    desc: IoT botnet with NVMS targeting and shell stager
    crit: hostile
    conf: 0.99
    attack: "T1105,T1059.004,T1210"
    all:
      - id: micro-behaviors/data/encode/hex::hex-encoded-wget-pipe-shell
      - id: micro-behaviors/fs/proc/info/path::proc-net-tcp
      - id: micro-behaviors/communications/http/message::nvms-9000-ip-filter-request
  # shell-777 parses a shell AST `chmod` call and can never fire on this
  # ELF's raw bytes; native-chmod-0777-command is the elf/macho text-regex
  # sibling that matches the same command as a literal embedded string.
  - id: raw-ip-download-chmod-relative-exec
    desc: ELF raw-IP download chmod and execute chain
    crit: hostile
    conf: 0.99
    attack: "T1105,T1059.004,T1222.002"
    all:
      - id: micro-behaviors/communications/ip/literal::external-ipv4-http-url
      - id: micro-behaviors/process/create/shell/spawn::system-fn
      - id: micro-behaviors/fs/chmod/executable/dangerous::native-chmod-0777-command
      - id: micro-behaviors/process/create/local-exec::native-relative-executable-string

  # A compiled implant carrying its own raw-IP wget/curl/TFTP fallback chain
  # is materially different from an installer that invokes one named client.
  # Requiring the complete local chmod-and-launch command keeps ordinary URL
  # and downloader references out of this verdict.
  - id: raw-ip-multi-client-download-execute
    desc: ELF downloads and executes a raw-IP payload through fallback clients
    crit: hostile
    conf: 0.99
    attack: "T1105,T1059.004,T1222.002"
    all:
      - id: micro-behaviors/communications/ip/literal::http-ip-url
      - id: micro-behaviors/communications/http/download/fallback::multi-client-download-fallback
      - id: micro-behaviors/process/create/local-exec::chmod-then-local-execute-command

  # The three-way combination is specific to an IoT bot dropper: a raw-IP
  # download, an executable-mode change, and a Mirai credential table. Each
  # leg is neutral or suspicious on its own, but together they describe the
  # payload-delivery behavior.
  # shell-plus-x is a shell AST match; chmod-make-executable is the
  # text-regex sibling (matches both `+x` and octal forms) that can see the
  # same command as a literal string embedded in this ELF's bytes.
  - id: raw-ip-iot-download-chmod-exec
    desc: IoT bot downloads and executes raw-IP payload
    crit: hostile
    conf: 0.99
    all:
      - id: micro-behaviors/communications/ip/literal::http-ip-url
      - id: micro-behaviors/fs/chmod/executable/mode::chmod-make-executable
      - id: micro-behaviors/process/create/shell/spawn::system-fn
      - id: objectives/lateral-movement/brute-force/iot-creds::mirai-credential-access
  - id: raw-ip-iot-download-pipe-exec
    desc: IoT bot downloads raw-IP payload and pipes to shell
    crit: hostile
    conf: 0.99
    all:
      - id: micro-behaviors/communications/ip/literal::http-ip-url
      - id: native-download-pipe-shell
      - id: objectives/lateral-movement/brute-force/iot-creds::mirai-credential-access
  - id: static-iot-helper-process-control
    desc: Static IoT download-helper bot with process termination
    crit: hostile
    conf: 0.99
    attack: T1105,T1562
    mbc: B0030
    all:
      - id: micro-behaviors/communications/http/download/helper::echo-wget-curl-path-table
      - id: micro-behaviors/communications/ip/literal::external-ipv4-host-literal-binary
      - id: metadata/binary/linking/static::elf-needed-libs-zero
      - id: micro-behaviors/fs/proc/exe::procfs-process-exe-fragment-cluster
      - id: micro-behaviors/process/terminate/signal::x86-64-kill-syscall

  - id: static-iot-hidden-staging-downloader
    desc: Static IoT downloader with hidden temporary payload staging
    crit: hostile
    conf: 0.98
    attack: T1105
    mbc: B0030
    all:
      - id: micro-behaviors/communications/http/download/helper::echo-wget-curl-path-table
      - id: micro-behaviors/communications/ip/literal::external-ipv4-host-literal-binary
      - id: micro-behaviors/fs/path/temp::hidden-tmp-state-file
      - id: metadata/binary/linking/static::elf-needed-libs-zero
      - id: metadata/hardening/missing::stripped-binary
  # The architecture is a narrowing signal here, not a verdict by itself:
  # OpenRISC plus the complete static helper/C2/procfs profile is an embedded
  # bot payload pattern, while ordinary OpenRISC utilities remain clean.
  - id: static-openrisc-helper-c2-stager
    desc: Static OpenRISC IoT bot stages payloads from pinned C2
    crit: hostile
    conf: 0.99
    attack: T1071,T1105
    mbc: B0030
    all:
      - id: metadata/arch/iot::openrisc
      - id: micro-behaviors/communications/http/download/helper::echo-wget-curl-path-table
      - id: micro-behaviors/communications/ip/literal::external-ipv4-host-literal-binary
      - id: metadata/binary/linking/static::elf-needed-libs-zero
      - id: metadata/hardening/missing::stripped-binary
      - id: micro-behaviors/fs/proc/exe::procfs-process-exe-fragment-cluster
  - id: static-microblaze-helper-c2-stager
    desc: Static MicroBlaze IoT bot stages payloads from pinned C2
    crit: hostile
    conf: 0.99
    attack: T1071,T1105
    mbc: B0030
    all:
      - id: metadata/arch/iot::microblaze
      - id: micro-behaviors/communications/http/download/helper::echo-wget-curl-path-table
      - id: micro-behaviors/communications/ip/literal::external-ipv4-host-literal-binary
      - id: metadata/binary/linking/static::elf-needed-libs-zero
      - id: metadata/hardening/missing::stripped-binary
      - id: micro-behaviors/fs/proc/exe::procfs-process-exe-fragment-cluster
