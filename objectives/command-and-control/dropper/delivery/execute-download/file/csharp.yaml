# C# download-and-execute patterns
defaults:
  for: [csharp]
  platforms: [windows]
  attack: "T1105"
traits:
  - id: kingspy-wudfhost-payload-url
    desc: Kingspy WUDFHost payload URL
    crit: suspicious
    conf: 0.99
    for: [pe]
    if:
      type: text
      exact: http://dosya.kingspy.info/WUDFhost.exe
  - id: relative-taskhost-drop-path
    desc: Relative taskhost drop path
    crit: notable
    conf: 0.9
    for: [pe]
    if:
      type: text
      exact: \taskhost.exe
  - id: dotnet-getenvironmentvariable-token
    desc: .NET environment variable token
    crit: component
    conf: 0.75
    for: [pe]
    if:
      type: text
      exact: GetEnvironmentVariable
  - id: raw-github-svchost-zowner-url
    desc: GitHub raw svchost.zowner stage URL
    crit: suspicious
    conf: 0.99
    for: [pe]
    if:
      type: text
      exact: https://raw.githubusercontent.com/inqcode/skq12kjj3jj1/main/svchost.zowner
  - id: svchost-zowner-stage-name
    desc: svchost.zowner stage filename
    crit: suspicious
    conf: 0.95
    for: [pe]
    if:
      type: text
      word: svchost.zowner
  - id: managed-update-loader-method-cluster--execute-update
    desc: Update loader method (ExecuteUpdateProcess)
    crit: suspicious
    conf: 0.98
    for: [pe]
    if:
      type: text
      word: ExecuteUpdateProcess
  - id: managed-update-loader-method-cluster--download-resource
    desc: Update loader method (DownloadResourceFile)
    crit: suspicious
    conf: 0.98
    for: [pe]
    if:
      type: text
      word: DownloadResourceFile
  - id: managed-update-loader-method-cluster--process-items
    desc: Update loader method (ProcessDownloadedItems)
    crit: suspicious
    conf: 0.98
    for: [pe]
    if:
      type: text
      word: ProcessDownloadedItems
  - id: managed-update-loader-method-cluster--launch-executable
    desc: Update loader method (LaunchExecutable)
    crit: suspicious
    conf: 0.98
    for: [pe]
    if:
      type: text
      word: LaunchExecutable
composite_rules:
  - id: managed-update-loader-method-cluster
    desc: Managed update-launch method cluster
    crit: suspicious
    conf: 0.98
    for: [pe]
    any:
      - id: managed-update-loader-method-cluster--execute-update
      - id: managed-update-loader-method-cluster--download-resource
      - id: managed-update-loader-method-cluster--process-items
      - id: managed-update-loader-method-cluster--launch-executable
  - id: dotnet-remote-script-byte-download
    desc: .NET HttpClient downloads a remote Windows script as bytes
    crit: notable
    conf: 0.97
    for: [pe]
    all:
      - id: micro-behaviors/communications/http/client/managed::httpclient-bytearray-download
      - id: micro-behaviors/communications/http/download/url::script-url-reference-pe
  - id: dotnet-remote-script-file-stage
    desc: .NET downloads a remote Windows script and writes it to disk
    crit: notable
    conf: 0.98
    for: [pe]
    all:
      - id: dotnet-remote-script-byte-download
      - id: micro-behaviors/fs/write/file/full::dotnet-writeallbytes-token
