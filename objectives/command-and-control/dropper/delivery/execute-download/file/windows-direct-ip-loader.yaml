defaults:
  platforms: [windows]
  for: [pe, dll]
  attack: T1105,T1059.003

composite_rules:
  - id: direct-ip-memory-staging-loader
    desc: Windows direct-IP memory-staging loader
    crit: hostile
    conf: 0.98
    attack: T1105,T1620
    # Download, PE-header staging, and memory protection must belong to this
    # executable rather than being assembled from sibling archive members.
    scope: leaf
    all:
      - id: micro-behaviors/communications/http/url/external-ip::url-external-ip-port-binary
      - id: micro-behaviors/communications/http/client/urlmon::url-download-to-file-str
      - id: micro-behaviors/mem/protect/modify::virtual-protect
      - id: micro-behaviors/data/embedded/payload/header::inline-pe-header-validation-sequence
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/installer/family/
  - id: wininet-form-post-ip-injector
    desc: WinINet form POST to a raw IP alongside remote injection
    crit: hostile
    conf: 0.97
    attack: T1055,T1071.001
    # The URL, the form body, and the injection APIs have to sit in the same
    # image. Sibling members must not assemble the profile.
    scope: leaf
    all:
      - id: micro-behaviors/process/inject/runtime/call::remote-process-injection-api-set
      - id: micro-behaviors/communications/http/url/external-ip::url-external-ip-port-binary
      - id: micro-behaviors/communications/http/header/content-type::form-urlencoded-header-pe
      - id: micro-behaviors/communications/http/client/wininet::wininet-http-api-cluster
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/installer/family/
      - id: well-known/tool/
