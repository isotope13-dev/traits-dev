defaults:
  platforms: [windows]
  for: [pe, dll]
  attack: T1105,T1059.003

composite_rules:
  - id: direct-ip-memory-staging-loader
    desc: Windows direct-IP memory-staging loader
    crit: hostile
    conf: 0.98
    attack: T1105,T1620
    # Download, PE-header staging, and memory protection must belong to this
    # executable rather than being assembled from sibling archive members.
    scope: leaf
    all:
      - id: micro-behaviors/communications/http/url/external-ip::url-external-ip-port-binary
      - id: micro-behaviors/communications/http/client/urlmon::url-download-to-file-str
      - id: micro-behaviors/mem/protect/modify::virtual-protect
      - id: micro-behaviors/data/embedded/payload/header::inline-pe-header-validation-sequence
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/installer/family/

  # A self-updater that pins its update source to a raw external IP, installs
  # itself under a Run key, relaunches the downloaded replacement, and pads its
  # own image to change its hash. Each acquisition installs the next stage of
  # code from an endpoint that survives DNS takedowns, and the hash rotation
  # keeps the autostart entry ahead of hash blocklists. Cite the rotation
  # diagnostics directly. Eupdate Helper's compound identity — product name,
  # single-instance mutex, and ESET update.ver path — is the legitimate update
  # mirror already excluded from the hash-rotation and port-seize claims, and
  # the same mirror also fetches by raw IP, installs its autostart entry, and
  # relaunches the replacement image.
  - id: direct-ip-hash-rotating-autostart-updater
    desc: Direct-IP fetch swaps autostart image and rotates hash
    crit: hostile
    conf: 0.96
    attack: T1105,T1547.001,T1027.001
    size_max: 5242880
    all:
      - id: micro-behaviors/communications/http/url/external-ip::url-external-ip-port-binary
      - id: objectives/persistence/login/registry/run-key::pe-registry-self-install
      - id: objectives/anti-analysis/self-modify/runtime::executable-hash-padding-diagnostic
      - id: objectives/anti-analysis/self-modify/runtime::exit-to-change-hash-diagnostic
    any:
      - id: micro-behaviors/process/create/spawn::create-process-w
      - id: micro-behaviors/process/create/shellexec::shell-execute-call
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/installer/family/
      - id: well-known/app/security/eupdate-helper::eupdate-helper-binary
      - id: objectives/command-and-control/dropper/delivery/winhttp::trojanized-eupdate-winhttp-shell-dropper
      - id: objectives/command-and-control/dropper/delivery/winhttp::trojanized-eupdate-upx-winhttp-dropper
