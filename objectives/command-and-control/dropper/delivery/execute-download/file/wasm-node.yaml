defaults:
  platforms: [windows, unix]
  for: [wasm]
  attack: T1105,T1059

composite_rules:
  - id: xor-wasm-node-download-execute
    desc: XOR-concealed WASM host shell APIs accompany HTTP execution templates
    crit: hostile
    conf: 0.98
    scope: file
    all:
      - id: micro-behaviors/data/decode/xor::wasm-constant-xor-data-loops
      - id: micro-behaviors/process/interpreter/wasm::go-wasm-host-value-call
      - id: micro-behaviors/process/interpreter/wasm::go-wasm-host-value-invoke
      - id: metadata/import/builtin::encoded-child-process-reference
      - id: micro-behaviors/process/create/shell/bridge::wasm-execsync-method-reference
      - id: micro-behaviors/process/create/shell/command-string::wasm-powershell-http-template-prefix
      - id: micro-behaviors/process/create/shell/pipeline::wasm-iex-pipeline-reference
