# The fetch -> chmod -> detached-launch chain against a PLAIN temp path.
#
# The sibling curl-tmp-implant.yaml in this directory covers the same idiom but
# every one of its legs requires a *hidden* stage (a leading dot: /tmp/.x,
# /dev/shm/.x). That gate was there to keep ordinary installers -- which do
# fetch helpers into /tmp -- from lighting up, and it works, but it means a
# dropper that simply writes /tmp/java is invisible: no dot, no finding.
#
# What separates this from a legitimate installer is not the dot, it is the
# full three-step sequence. An installer fetches an archive and unpacks it, or
# fetches a binary and runs it in the foreground so its exit status is checked.
# Fetching an opaque file into a world-writable directory, arming it with the
# executable bit, and then detaching it with nohup/setsid so it outlives the
# installing process is a persistence-minded implant launch, whatever the file
# is named.
defaults:
  platforms: [linux, macos]
  for: [scripts, source, manifests]
  attack: T1105,T1059.004
  mbc: B0024

composite_rules:
  - id: fetch-arm-launch-temp-stage
    desc: Fetch, chmod and detached launch from temp
    crit: hostile
    conf: 0.97
    all:
      - id: micro-behaviors/fs/chmod/executable/mode::chmod-exec-tmp-file
      - id: micro-behaviors/process/create/local-exec::detached-temp-path-launch
    any:
      - id: micro-behaviors/communications/http/download/cli::fetch-output-flag-script
      - id: micro-behaviors/communications/http/download/cli::fetch-output-flag-embedded-command
      - id: micro-behaviors/communications/http/url/external-ip::curl-schemeless-external-ip-request
      - id: micro-behaviors/communications/http/url/external-ip::curl-external-ip-request
    # `test-directory-path`, not the `test-directory` umbrella: that umbrella
    # also accepts filename conventions (test_*.py, *.test.ts), and a filename
    # is chosen by whoever ships the file. Gating on it meant identical dropper
    # bytes were caught as `dropper.py` and silently suppressed as
    # `test_dropper.py`. A tests/ directory is repo structure and still
    # suppresses the security-fixture case this exception exists for.
    unless:
      - id: metadata/build/archive::source-archive-member
      - id: metadata/package/testing/presence/harness::test-directory-path
