defaults:
  platforms: [windows]
  for: [pe]
  attack: T1105,T1059,T1564.003
  mbc: B0024

traits:
  - id: go-download-payload-url-format
    desc: Formats payload URL for HTTP retrieval
    crit: notable
    conf: 0.95
    if:
      type: text
      exact: "payload url=%s"

  - id: go-started-pid-format
    desc: Logs started child process ID
    crit: notable
    conf: 0.92
    if:
      type: text
      exact: "started pid=%d"

  - id: go-run-hidden-function
    desc: Go function launches child process hidden
    crit: suspicious
    conf: 0.92
    if:
      type: text
      exact: main.runHidden

composite_rules:
  - id: go-windows-payload-downloader-exec
    desc: Go downloader fetches payload and executes hidden child process
    crit: hostile
    conf: 0.98
    all:
      - id: go-run-hidden-function
      - id: micro-behaviors/process/create/system::go-os-exec-pclntab
    any:
      - id: go-download-payload-url-format
      - id: go-started-pid-format
      - id: objectives/anti-analysis/sandbox-detect/environment/function::go-issandbox-func
