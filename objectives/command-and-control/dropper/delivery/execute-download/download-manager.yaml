defaults:
  for: [pe, batch, powershell, javascript, vbs, python, csharp, cpp]
  platforms: [windows]
  attack: T1105
  mbc: E1105

composite_rules:
  - id: download-manager-runafter-fetch
    desc: Download manager fetch then execute
    crit: suspicious
    conf: 0.94
    all:
      - id: micro-behaviors/communications/http/download/manager::url-intake-and-extraction
      - id: micro-behaviors/process/create/launch::downloader-run-after-fetch
    any:
      - id: micro-behaviors/communications/socket/init::ws2-32-dll-marker
      - id: micro-behaviors/communications/socket/init::connect-api
      - id: micro-behaviors/communications/socket/init::socket-api
      - id: micro-behaviors/communications/ftp/client/
    # A recognized GetRightToGo downloader already has a product-specific
    # suspicious signal; avoid duplicating its expected fetch/launch flow.
    unless:
      - id: well-known/unwanted/download-manager::getrighttogo-runafterdownloader

  - id: softonic-offercore-download-execute
    desc: Softonic OfferCore manager can download and launch payloads
    crit: suspicious
    conf: 0.97
    all:
      - id: well-known/unwanted/offercore::plooto-star-softonic-inno-bundle-installer
      - id: metadata/binary/installer/runtime::winhttp-system32-manifest
      - id: micro-behaviors/process/create/spawn::create-process-w

  # This family gate is essential: WinHTTP and CreateProcessW are ordinary
  # installer primitives. The identified carrier embeds affiliate downloaders
  # behind preselected offer pages, then invokes the selected stages silently.
  - id: driverpack-offer-download-execute
    desc: DriverPack offer bundler can download and launch affiliate payloads
    crit: hostile
    conf: 0.99
    all:
      - id: well-known/unwanted/driverpack::maombi-multi-offer-bundle-installer
      - id: metadata/binary/installer/runtime::winhttp-system32-manifest
      - id: micro-behaviors/process/create/spawn::create-process-w
