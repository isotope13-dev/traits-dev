composite_rules:
  - id: squiblydoo
    desc: Squiblydoo (Regsvr32 bypass) technique detected
    conf: 0.95
    attack: T1218.010
    any:
      - id: objectives/command-and-control/dropper/delivery/execute-download::squiblydoo-plain
      - id: objectives/command-and-control/dropper/delivery/execute-download::squiblydoo-encoded
      - id: objectives/command-and-control/dropper/delivery/execute-download::squiblydoo-raw-hex
  - id: squiblydoo-plain
    desc: Squiblydoo pattern (plain text)
    conf: 0.8
    all:
      - id: micro-behaviors/process/create/launch::regsvr32
      - id: micro-behaviors/dylib/library/com::scrobj
      - id: objectives/command-and-control/dropper/delivery/execute-download::url-arg
    unless:
      - id: well-known/tool/offensive/bingo/
      - id: metadata/package/testing/
  - id: squiblydoo-encoded
    for: [pe, batch, javascript, powershell, vbs]
    desc: Squiblydoo pattern (encoded)
    conf: 0.8
    all:
      - id: micro-behaviors/process/create/launch::regsvr32-encoded
      - id: micro-behaviors/dylib/library/com::scrobj-encoded
      - id: objectives/command-and-control/dropper/delivery/execute-download::url-arg-encoded
  - id: squiblydoo-raw-hex
    desc: Squiblydoo pattern (hex encoded)
    conf: 0.8
    all:
      - id: micro-behaviors/process/create/launch::regsvr32-raw-hex
      - id: micro-behaviors/dylib/library/com::scrobj-raw-hex
      - id: objectives/command-and-control/dropper/delivery/execute-download::url-arg-raw-hex
defaults:
  crit: suspicious
  platforms: [windows, unix]
  for: [scripts, binaries]
traits:
  - id: url-arg
    desc: Regsvr32 /i:URL argument
    if:
      type: text
      regex: /i:https?://
      case_insensitive: true
    unless:
      - id: well-known/tool/offensive/bingo/
      - id: metadata/package/testing/
  - id: url-arg-encoded
    for: [powershell, batch, vbs, javascript, html, pe]
    desc: Regsvr32 /i:URL argument (encoded)
    if:
      type: encoded
      encoding:
        - base64
        - hex
      regex: /i:https?://
      case_insensitive: true
  - id: url-arg-raw-hex
    desc: Regsvr32 /i:URL argument (hex encoded)
    if:
      type: text
      substr: 2f693a68747470
      case_insensitive: true
