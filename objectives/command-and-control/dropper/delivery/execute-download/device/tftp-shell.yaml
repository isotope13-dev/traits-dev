# TFTP remains common on embedded and network appliances. A reference or
# ordinary transfer is only a network capability; retrieving a file to a
# local absolute path and immediately passing that same file to a shell is a
# payload-staging sequence.
defaults:
  platforms: [unix, appliance]
  for: [scripts, source, binaries]
  attack: T1105,T1059.004
  mbc: B0024
