defaults:
  platforms: [linux]
  for: [elf]
  attack: "T1105,T1059.004"
  mbc: E1105

composite_rules:
  - id: static-iot-helper-process-control
    desc: Static IoT download-helper bot with process termination
    crit: hostile
    conf: 0.99
    attack: T1105,T1562
    mbc: B0030
    all:
      - id: micro-behaviors/communications/http/download/helper::echo-wget-curl-path-table
      - id: micro-behaviors/communications/ip/literal::external-ipv4-host-literal-binary
      - id: "metadata/binary/linking/dynamic::elf-needed-libs-zero"
      - id: micro-behaviors/fs/proc/exe::procfs-process-exe-fragment-cluster
      - id: micro-behaviors/process/terminate/signal::x86-64-kill-syscall

  - id: static-iot-hidden-staging-downloader
    desc: Static IoT downloader with hidden temporary payload staging
    crit: hostile
    conf: 0.98
    attack: T1105
    mbc: B0030
    all:
      - id: micro-behaviors/communications/http/download/helper::echo-wget-curl-path-table
      - id: micro-behaviors/communications/ip/literal::external-ipv4-host-literal-binary
      - id: "micro-behaviors/fs/path/temp::hidden-tmp-dotfile-path"
      - id: "metadata/binary/linking/dynamic::elf-needed-libs-zero"
      - id: "metadata/binary/symbols/table::full-symbol-table-absent-or-empty"
  # The architecture is a narrowing signal here, not a verdict by itself:
  # OpenRISC plus the complete static helper/C2/procfs profile is an embedded
  # bot payload pattern, while ordinary OpenRISC utilities remain clean.
  - id: static-openrisc-helper-c2-stager
    desc: Static OpenRISC IoT bot stages payloads from pinned C2
    crit: hostile
    conf: 0.99
    attack: T1071,T1105
    mbc: B0030
    all:
      - id: metadata/arch/iot::openrisc
      - id: micro-behaviors/communications/http/download/helper::echo-wget-curl-path-table
      - id: micro-behaviors/communications/ip/literal::external-ipv4-host-literal-binary
      - id: "metadata/binary/linking/dynamic::elf-needed-libs-zero"
      - id: "metadata/binary/symbols/table::full-symbol-table-absent-or-empty"
      - id: micro-behaviors/fs/proc/exe::procfs-process-exe-fragment-cluster
  - id: static-microblaze-helper-c2-stager
    desc: Static MicroBlaze IoT bot stages payloads from pinned C2
    crit: hostile
    conf: 0.99
    attack: T1071,T1105
    mbc: B0030
    all:
      - id: metadata/arch/iot::microblaze
      - id: micro-behaviors/communications/http/download/helper::echo-wget-curl-path-table
      - id: micro-behaviors/communications/ip/literal::external-ipv4-host-literal-binary
      - id: "metadata/binary/linking/dynamic::elf-needed-libs-zero"
      - id: "metadata/binary/symbols/table::full-symbol-table-absent-or-empty"
      - id: micro-behaviors/fs/proc/exe::procfs-process-exe-fragment-cluster
