# TFTP is a documented delivery path for the embedded-router malware in the
# article.  The composite requires a download into writable temp storage and
# an executable-mode change, rather than flagging TFTP references alone.
defaults:
  platforms: [unix, appliance]
  for: [shell]
  attack: T1105,T1222.002
  mbc: E1105

composite_rules:
  - id: embedded-router-tftp-stage
    desc: TFTP stages a temporary executable
    crit: suspicious
    conf: 0.96
    all:
      - id: micro-behaviors/communications/ftp/download/tftp::command
      - id: micro-behaviors/communications/ftp/download/tftp::tftp-download-to-temp
      - id: micro-behaviors/fs/chmod/executable/mode::chmod-exec-absolute-path
    near_lines: 8
