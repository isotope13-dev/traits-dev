# Managed viewer stages can use a trusted DLL host after selecting a running
# process.  This detects the reusable execution shape without naming a vendor,
# DLL, campaign, or security product.
defaults:
  platforms: [windows]
  for: [csharp]
  attack: T1218.011,T1057,T1106
  mbc: E1057

composite_rules:
  - id: dotnet-explorer-rundll32-stage
    desc: .NET targets explorer and launches a DLL export through rundll32
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/process/create/managed::rundll32-start
      - id: micro-behaviors/process/create/managed::rundll32-export-argument
      - id: micro-behaviors/process/enumerate/managed::get-processes-by-name
      - id: micro-behaviors/process/create/spawn::open-process
    near_bytes: 1800
