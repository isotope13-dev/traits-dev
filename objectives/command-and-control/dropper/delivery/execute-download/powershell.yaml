defaults:
  platforms: [windows]
  for: [powershell, batch, pe]
  attack: T1105
  mbc: B0030

traits:
  - id: webclient-downloadfile-exe-url
    desc: WebClient fetches EXE URL
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: (?is)DownloadFile\s*\(\s*['"]https?://[^'"]{1,220}\.exe['"]
  - id: webclient-downloads-js-to-exe
    desc: WebClient writes JS as EXE
    crit: suspicious
    conf: 0.96
    if:
      type: text
      regex: (?is)DownloadFile\s*\(\s*['"]https?://[^'"]{1,220}\.js['"]\s*,\s*['"][^'"]{1,220}\.exe['"]
  - id: msiexec-programdata-msi
    desc: msiexec installs ProgramData MSI
    crit: suspicious
    conf: 0.95
    if:
      type: text
      regex: (?i)msiexec(\.exe)?.{0,80}(C:\\ProgramData|%ProgramData%).{0,80}\.msi
  - id: dated-product-msi-name
    desc: Dated product MSI filename
    crit: component
    conf: 0.85
    if:
      type: text
      regex: (?i)\b[a-z]{4,24}[0-1][0-9][0-3][0-9]\.msi\b
  - id: github-raw-msi-url
    desc: GitHub raw MSI payload URL
    crit: suspicious
    conf: 0.92
    if:
      type: text
      regex: 'https://github\.com/.{1,40}/.{1,40}/raw/.{1,40}/.{1,80}\.msi'
  - id: msiexec-norestart-arg
    desc: msiexec no-restart argument
    crit: notable
    conf: 0.9
    if:
      type: text
      word: /norestart
  - id: powershell-hidden-bypass-encoded-command
    desc: PowerShell hidden bypass encoded command
    crit: suspicious
    conf: 0.99
    attack: T1059.001,T1027,T1564.003
    for: [source, scripts, documents, binaries, zip, tar, jar, whl, python-sdist, gem, deb, rpm, npm, nupkg, crate, conda, egg, pkg, dmg, crx, chm, cab, iso, oci_image, xbps, gentoo_binpkg, asar, vsix-archive, xpi, rar, 7z, cpio, apk, alpine_apk, ipa]
    unless:
      - id: well-known/tool/offensive/reconprobe/
      - id: well-known/tool/offensive/impacket::source-tree-member
    if:
      type: text
      regex: '(?i)powershell.{0,560}-W\s+Hidden.{0,320}-Exec\s+Bypass.{0,320}-Enc\b'
  - id: typename-webclient
    desc: Constructs Net.WebClient by TypeName
    crit: notable
    conf: 0.9
    for: [powershell, text]
    if:
      type: text
      regex: '(?i)-TypeName\s+Net\.WebClient'
composite_rules:
  - id: powershell-hidden-encoded-webclient-downloader
    desc: Hidden bypassed encoded PowerShell downloads a script
    crit: hostile
    conf: 0.99
    attack: T1027,T1059.001,T1105,T1564.003
    for: [scripts, documents, binaries, zip, tar, jar, whl, python-sdist, gem, deb, rpm, npm, nupkg, crate, conda, egg, pkg, dmg, crx, chm, cab, iso, oci_image, xbps, gentoo_binpkg, asar, vsix-archive, xpi, rar, 7z, cpio, apk, alpine_apk, ipa]
    all:
      - id: powershell-hidden-bypass-encoded-command
      - id: micro-behaviors/communications/http/lib/invoke-webrequest::webclient-downloadstring
    near_bytes: 4096

  # The three legs must belong to ONE fetch-and-run chain, which is what the
  # description claims and what a dropper one-liner looks like. Without a
  # proximity bound this stitched unrelated occurrences together across a whole
  # script: the NousResearch hermes-agent installer downloads uv at line 759
  # and launches its own gateway daemon with -WindowStyle Hidden at line 1481,
  # 700 lines apart, and scored hostile. The sibling
  # powershell-hidden-bypass-download above already bounds itself this way.
  - id: powershell-hidden-network-stage
    for: [powershell]
    desc: Hidden PowerShell retrieves and launches a stage
    crit: hostile
    conf: 0.99
    attack: T1059.001,T1105,T1564.003
    # 4096 bytes still stitched unrelated occurrences together in installer
    # scripts that are themselves a few hundred lines dense with unrelated
    # setup steps: clawmetry's install.ps1 does a 127.0.0.1-only dashboard
    # health-check (Invoke-WebRequest) ~65 lines from an unrelated
    # Start-Process -WindowStyle Hidden that launches its OWN already
    # pip-installed local daemon module -- no data from the web request
    # feeds the launched process. Tighten to a true one-chain distance and
    # exclude a localhost-only probe, which is a self health-check, not
    # network stage retrieval.
    near_bytes: 512
    all:
      - id: micro-behaviors/process/create/hidden::powershell-windowstyle-hidden-option
      - id: micro-behaviors/communications/http/lib/invoke-webrequest::invoke-webrequest
      - id: micro-behaviors/process/create/start-process::start-process-call
    unless:
      - id: metadata/package/testing/presence/harness/
      - id: well-known/app/ai/media/comfy-test::generated-vm-template
      - id: well-known/tool/sysadmin/kubernetes/bootstrap::kubernetes-windows-gce-ssh-installer-exception
      - id: micro-behaviors/crypto/hash/file::hash-pinned-download-context
      - id: micro-behaviors/communications/http/lib/invoke-webrequest::iwr-localhost-uri
      # A file-backed IWR download is handled by the sibling rule that binds
      # OutFile, an executable URL, and the launched path.  This looser rule
      # cannot prove that an arbitrary web request feeds Start-Process.
      - id: micro-behaviors/communications/http/download/cli::iwr-outfile-download

  - id: powershell-streamed-archive-msi-dropper
    desc: Hidden PowerShell streams archive and launches MSI
    crit: hostile
    conf: 0.99
    attack: T1059.001,T1105,T1204.002,T1564.003
    for: [powershell]
    near_bytes: 8192
    all:
      - id: micro-behaviors/communications/http/client/managed::httpwebrequest
      - id: micro-behaviors/communications/http/client/managed::getresponse
      - id: micro-behaviors/communications/http/client/managed::getresponsestream
      - id: micro-behaviors/communications/http/url/scheme::cleartext-http-url-code-literal
      - id: micro-behaviors/process/io/stream::stream-write-buffer-arg
      - id: micro-behaviors/data/archive/extract/tar::tar-extract
      - id: micro-behaviors/process/create/start-process::start-process-msi-path
      - id: micro-behaviors/process/create/hidden::start-process-windowstyle-hidden
      - id: micro-behaviors/process/create/flags::powershell-policy-bypass-argument

  - id: webclient-downloadfile-exe
    desc: WebClient stages EXE in writable path
    crit: suspicious
    conf: 0.94
    near_lines: 3
    all:
      - id: webclient-downloadfile-exe-url
    any:
      - id: micro-behaviors/fs/path/temp::win-temp-env
      - id: micro-behaviors/fs/path/temp::win-temp-path
      - id: micro-behaviors/fs/path/location/
      - id: micro-behaviors/fs/write/file/target::users-public-path
  - id: powershell-download-exe-execute
    for: [powershell]
    desc: PowerShell downloads and runs EXE
    crit: hostile
    conf: 0.97
    all:
      - id: webclient-downloadfile-exe
      - id: micro-behaviors/process/create/start-process::start-process-call
  - id: powershell-country-gated-download-execute
    for: [powershell]
    desc: PowerShell country-gated executable dropper
    crit: hostile
    conf: 0.99
    attack: T1480,T1105,T1204.002
    mbc: B0027,B0030
    all:
      - id: objectives/anti-analysis/geofencing/target-gating::powershell-country-selected-execution
      - id: micro-behaviors/communications/http/client/webclient::net-webclient-object
      - id: micro-behaviors/communications/http/download/url::executable-url-reference-a
      - id: micro-behaviors/process/create/start-process::start-process-call
    unless:
      - id: metadata/signed/platform/
  - id: powershell-js-to-exe-masquerade
    for: [powershell]
    desc: PowerShell downloads JS as EXE
    crit: hostile
    conf: 0.98
    all:
      - id: webclient-downloads-js-to-exe
      - id: micro-behaviors/process/create/start-process::start-process-call
  - id: powershell-msi-programdata-install
    for: [pe]
    desc: PowerShell stages ProgramData MSI
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/communications/http/download/webclient::webclient-downloadfile-msi-url
      - id: msiexec-programdata-msi
    any:
      - id: dated-product-msi-name
      - id: micro-behaviors/process/create/installer::msiexec-package-verb
  - id: powershell-temp-msi-install
    for: [powershell]
    desc: PowerShell stages and installs TEMP MSI
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/communications/http/download/cli::iwr-outfile-download
      - id: micro-behaviors/fs/path/temp::temp-msi-staging
      - id: micro-behaviors/process/create/installer::powershell-variable-msi-quiet-install
    any:
      - id: micro-behaviors/process/create/hidden::start-process-windowstyle-hidden
      - id: msiexec-norestart-arg
      - id: micro-behaviors/communications/http/lib/invoke-webrequest::useb-flag
  - id: powershell-unattended-rmm-msi
    desc: PowerShell stages a quiet unattended RMM MSI
    crit: hostile
    conf: 0.98
    attack: T1105,T1219,T1218.007
    for: [powershell]
    all:
      - id: powershell-temp-msi-install
    any:
      - id: well-known/dual-use/remote-admin/rmm::logmein-agent-name
      - id: well-known/dual-use/remote-admin/rmm::gotoresolve-agent-name
  - id: github-raw-msi-dropper
    for: [powershell]
    desc: GitHub raw MSI PowerShell dropper
    crit: hostile
    conf: 0.99
    all:
      - id: github-raw-msi-url
      - id: objectives/command-and-control/dropper/delivery/execute-download::powershell-temp-msi-install

  # Phishing droppers commonly use an embedded PowerShell WebClient from a
  # batch wrapper rather than a standalone .ps1. A raw GitHub MSI, a named
  # remote-access agent, and a quiet msiexec invocation bind the fetch and
  # install into the same operator-staged RMM chain without campaign IOCs.
  - id: batch-github-raw-quiet-rmm-dropper
    for: [batch]
    desc: Batch silently installs a raw-GitHub remote-access MSI
    crit: hostile
    conf: 0.99
    attack: T1105,T1218.007,T1219
    near_bytes: 2048
    all:
      - id: github-raw-msi-url
      - id: micro-behaviors/communications/http/download/webclient::webclient-downloadfile-msi-url
      - id: micro-behaviors/process/create/installer::msiexec-package-verb
      - id: micro-behaviors/process/create/installer::msiexec-quiet-switch
      - id: objectives/command-and-control/backdoor/control/rmm::remote-access-agent-reference
  - id: powershell-cert-bypass-archive-download-execute
    for: [powershell]
    desc: PowerShell disables TLS checks while staging and launching an archive
    crit: hostile
    conf: 0.99
    attack: T1105,T1204.002,T1553
    all:
      - id: micro-behaviors/communications/http/client/managed::httpclient
      - id: micro-behaviors/communications/http/client/managed::getasync
      - id: micro-behaviors/communications/http/client/managed::readasbytearrayasync
      - id: micro-behaviors/communications/http/client/managed::server-certificate-validation-callback-accept-all
      - id: micro-behaviors/fs/write/file/full::write-all-bytes
      - id: micro-behaviors/data/archive/extract/zip::powershell-expand-archive
      - id: micro-behaviors/process/create/start-process::start-process-call
    near_lines: 120
  - id: powershell-unblocked-archive-hidden-launch
    desc: PowerShell downloads, unblocks, extracts, and hides payload launch
    crit: hostile
    conf: 0.99
    attack: T1105,T1204.002,T1553.005,T1564.003
    mbc: B0030,B0032,E1059
    for: [powershell]
    near_bytes: 8192
    all:
      - id: micro-behaviors/communications/http/client/managed::webrequest-create
      - id: micro-behaviors/communications/http/client/managed::getresponse
      - id: micro-behaviors/data/archive/extract/zip::powershell-expand-archive
      - id: objectives/evasion/indicator-removal/cleanup::unblock-file
      - id: micro-behaviors/process/create/start-process::start-process-call
      - id: micro-behaviors/process/create/hidden::start-process-windowstyle-hidden

  # Multiline WebClient.DownloadFile( + URL ) often splits across statement
  # strings, so the single-regex EXE-URL atom misses. Compose the legs that
  # already fire independently — catches future PS EXE download-and-run
  # stagers that stage outside TEMP/ProgramData as well.
  - id: powershell-webclient-remote-exe-launch
    desc: WebClient downloads executable and launches it
    crit: hostile
    conf: 0.97
    attack: T1105,T1204.002
    for: [powershell]
    unless:
      - id: well-known/lib/platform/browser-automation/automation-context::playwright-core-chrome-reinstall-helper
      - id: well-known/app/infrastructure/docker::source-tree
    all:
      - id: micro-behaviors/communications/http/client/webclient::system-net-webclient
      - id: micro-behaviors/communications/http/download/webclient::webclient-downloadfile-call
      - id: micro-behaviors/communications/http/download/url::executable-url-reference-a
      - id: micro-behaviors/process/create/start-process::start-process-call
    near_bytes: 8192

  # GitHub Releases is a common disposable hosting path for EXE droppers
  # (throwaway repos). Distinct from vendor bootstrap that uses raw.githubusercontent
  # source archives without launching a downloaded EXE.
  - id: powershell-github-release-exe-launch
    desc: PowerShell downloads GitHub release EXE and launches it
    crit: hostile
    conf: 0.98
    attack: T1105,T1204.002
    for: [powershell]
    all:
      - id: micro-behaviors/communications/url/external/github::github-release-download
      - id: micro-behaviors/communications/http/client/webclient::net-webclient-object
      - id: micro-behaviors/communications/http/download/url::executable-url-reference-a
      - id: micro-behaviors/process/create/start-process::start-process-call

  - id: webclient-downloadstring-http
    desc: WebClient DownloadString of a cleartext HTTP URL
    crit: hostile
    conf: 0.94
    for: [powershell, text]
    all:
      - id: micro-behaviors/communications/http/lib/invoke-webrequest::webclient-downloadstring
      - id: micro-behaviors/communications/http/lib/invoke-webrequest::downloadstring-cleartext-http-url
    unless:
      - id: metadata/package/testing/presence/harness/

  - id: typename-downloadstring-http
    desc: TypeName WebClient DownloadString cleartext HTTP
    crit: hostile
    conf: 0.94
    for: [powershell, text]
    all:
      - id: typename-webclient
      - id: micro-behaviors/communications/http/lib/invoke-webrequest::downloadstring-cleartext-http-url
    unless:
      - id: metadata/package/testing/presence/harness/

  - id: typename-webclient-downloadstring
    desc: TypeName WebClient DownloadString call
    crit: hostile
    conf: 0.93
    for: [powershell, text]
    all:
      - id: typename-webclient
      - id: micro-behaviors/communications/http/lib/invoke-webrequest::webclient-downloadstring
    unless:
      - id: metadata/package/testing/presence/harness/
