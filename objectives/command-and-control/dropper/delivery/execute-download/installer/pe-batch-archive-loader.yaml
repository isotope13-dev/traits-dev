defaults:
  platforms: [windows]
  for: [pe]
  attack: "T1105,T1059.003"

traits:
  - id: pe-delayed-shell-remote-archive
    desc: PE delayed shell references remote archive
    crit: suspicious
    conf: 0.94
    if:
      type: text
      regex: '(?is)/v:on\s+/c\b.{0,240}https?://.{4,120}\.(zip|7z|rar|cab)\b'
  - id: pe-delayed-shell-batch-target
    desc: PE delayed shell targets variable batch path
    crit: suspicious
    conf: 0.9
    if:
      type: text
      regex: '(?is)/v:on\s+/c\b.{0,500}![A-Za-z0-9_]+!\\.{1,80}\.bat'

composite_rules:
  - id: pe-hidden-remote-archive-batch-launch
    desc: Hidden PE launches remote archive batch
    crit: hostile
    conf: 0.97
    all:
      - id: pe-delayed-shell-remote-archive
      - id: pe-delayed-shell-batch-target
      - id: micro-behaviors/fs/file/attributes::pe-hidden-system-attribute-flags
      - id: micro-behaviors/process/create/exec::winexec
