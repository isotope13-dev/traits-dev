defaults:
  platforms:
  - unix
  - windows
  for:
  - javascript
  - typescript
  attack: T1059.007
  mbc: B0024
traits:
- id: require-uppercase-const
  desc: require with uppercase const identifier
  crit: notable
  conf: 0.88
  if:
    type: text
    regex: \brequire\(\s*[A-Z][A-Z0-9_]{2,}\s*\)
composite_rules:
- id: npm-install-then-load-chain
  desc: npm install completion triggers decoded require
  crit: hostile
  conf: 0.97
  attack: T1195.002,T1027,T1059.007
  near_bytes: 2200
  all:
  - id: micro-behaviors/process/fd/stdio::child-stdio-ignore-option
  - id: micro-behaviors/process/create/spawn::windowshide-option
  - id: micro-behaviors/data/decode/base64::buffer-from-base64-literal-to-text
  - id: micro-behaviors/data/control-flow/event-callback::close-event-zero-arg-callback
  - id: require-uppercase-const
