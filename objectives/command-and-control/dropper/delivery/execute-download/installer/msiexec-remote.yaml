defaults:
  crit: hostile
  platforms: [windows]
  for: [batch, powershell, vbs, javascript, python, scripts, lnk]
  attack: T1105,T1218.007

composite_rules:
  - id: remote-msiexec-rundll32-dropper
    for: [batch, javascript, powershell, vbs]
    desc: Remote MSI installer is followed by rundll32 DLL execution
    conf: 0.98
    near_lines: 12
    attack: T1105,T1218.007,T1218.011
    all:
      - id: micro-behaviors/process/create/installer::remote-msi-download-install
      - id: metadata/lang/source/syntax/command/invocation::rundll32-command-syntax-reference

  - id: remote-msiexec-onion-dropper
    for: [batch, javascript, powershell, vbs]
    desc: Remote MSI installer is paired with an onion-service endpoint
    conf: 0.97
    near_lines: 12
    attack: T1105,T1218.007,T1090.003
    all:
      - id: micro-behaviors/process/create/installer::remote-msi-download-install
      - id: micro-behaviors/communications/proxy/tor::onion-domain-reference

  - id: lnk-remote-msiexec-dropper
    for: [lnk]
    desc: Shortcut retrieves an installer through msiexec
    conf: 0.98
    attack: T1105,T1218.007,T1204.002
    all:
      - id: micro-behaviors/process/create/installer::lnk-remote-msiexec-url
      - id: metadata/file/profile/field-presence::lnk-has-arguments

  # The rundll32 and onion siblings above pin specific follow-ons. Scripts
  # that fetch a remote MSI and install it silently with elevation need no
  # follow-on: quiet plus hidden plus runas on a download-and-invoke chain
  # is the concealment. No proximity bound: camouflage padding can separate
  # the download line from the install line by hundreds of thousands of lines.
  - id: remote-msiexec-silent-elevated-dropper
    for: [batch, javascript, powershell, vbs]
    desc: Remote MSI installer runs silent with elevation
    conf: 0.97
    all:
      - id: micro-behaviors/process/create/installer::remote-msi-download-install
      - id: micro-behaviors/process/create/installer::msiexec-quiet-switch
    any:
      - id: micro-behaviors/os/privilege/elevation::shellexecute-quoted-runas-verb
      - id: micro-behaviors/os/privilege/elevation::wsh-shellexecute-runas
      - id: micro-behaviors/process/create/shellexec::shellexecute-hidden-showcmd
    needs: 1
