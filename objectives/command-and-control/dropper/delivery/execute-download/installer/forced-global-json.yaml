defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
  attack: T1195.002,T1059

composite_rules:
  # Proven source-to-shell relationship, with a literal consent bypass and
  # forced global package replacement. Ordinary HTTP/updater co-occurrence
  # cannot satisfy the provenance leg.
  - id: remote-json-forced-global-shell-update
    desc: Remote JSON reaches forced global install with hardcoded consent
    crit: hostile
    conf: 0.97
    all:
      - id: micro-behaviors/process/create/shell/input-source::remote-response-reaches-shell-command
      - id: micro-behaviors/process/create/shell/guard::constant-yes-install-branch
      - id: micro-behaviors/os/package-manager/runtime-install::npm-force-install
      - id: micro-behaviors/communications/http/url/archive::remote-tgz-url
