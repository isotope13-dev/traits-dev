defaults:
  crit: hostile
  platforms: [windows]
  for: [vbs]
  attack: T1059.003,T1105,T1218.007

composite_rules:
  - id: vbs-hidden-ps-unattended-rmm
    desc: Hidden VBScript PowerShell fetches an unattended RMM MSI
    conf: 0.98
    attack: T1059.001,T1059.005,T1105,T1219
    all:
      - id: objectives/execution/interpreter/vbscript/interpreter::vbs-hidden-async-powershell-launcher
    any:
      - id: well-known/dual-use/remote-admin/rmm::logmein-agent-name
      - id: well-known/dual-use/remote-admin/rmm::gotoresolve-agent-name

  - id: vbs-xmlhttp-fso-execute-dropper
    desc: VBScript downloads via XMLHTTP, writes with FileSystemObject, and executes
    conf: 0.99
    attack: T1059.005,T1105
    all:
      - id: micro-behaviors/communications/http/client/xmlhttp::activex-http-progid
      - id: micro-behaviors/communications/http/client/vba::http-open-send
      - id: micro-behaviors/fs/write/content::create-text-file-api
      - id: micro-behaviors/os/com/automation::wscript-shell-literal
    any:
      - id: micro-behaviors/data/control-flow/dispatch::run-zero-style-argument
      - id: micro-behaviors/process/create/hidden::wscript-shell-hidden-run
      - id: micro-behaviors/process/argument/option::powershell-flagged-command-line
