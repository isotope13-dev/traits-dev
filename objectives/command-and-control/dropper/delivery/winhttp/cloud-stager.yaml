defaults:
  for: [pe]
  platforms: [windows]
  attack: T1105
  mbc: E1105

traits:
- id: c2-healthcheck-query-path
  desc: Hardcoded healthcheck C2 path
  crit: notable
  conf: 0.92
  if:
    type: text
    regex: ^/good\?[a-z]=[A-Za-z0-9_-]{4,32}&substr=[A-Za-z0-9_-]{4,32}$

composite_rules:
- id: winhttp-cloud-stage-with-c2
  desc: WinHTTP cloud stage with hardcoded C2
  crit: suspicious
  conf: 0.95
  size_max: 524288
  all:
  - id: micro-behaviors/communications/http/client/winhttp::winhttp-downloader-flow-text
  - id: micro-behaviors/communications/http/url/cloud::gdrive-download-url
  - id: micro-behaviors/communications/ip/literal::external-ipv4-binary
  any:
  - id: c2-healthcheck-query-path
  - id: micro-behaviors/process/create/spawn::create-process-w
  - id: micro-behaviors/fs/temp/directory::get-temp-path-name
  - id: micro-behaviors/os/module/load::dynamic-self-resolution-imports
  needs: 2
  unless:
  - id: metadata/signed/platform/
  - id: metadata/binary/installer/family/
  - id: metadata/binary/installer/script/
- id: api-hashed-winhttp-stage-loader
  desc: API-hashed WinHTTP staged loader
  crit: hostile
  conf: 0.96
  size_max: 524288
  all:
  - id: winhttp-cloud-stage-with-c2
  - id: objectives/anti-static/obfuscation/imports/api-hashing::pe-api-hashing-indicator-single
  - id: metadata/signed/trust-level::unsigned
  any:
  - id: micro-behaviors/mem/protect/modify::virtual-alloc
  - id: micro-behaviors/process/create/spawn::create-process-w
  - id: micro-behaviors/fs/temp/directory::get-temp-path-name
  - id: micro-behaviors/os/module/load::dynamic-self-resolution-imports
  needs: 3
  unless:
  - id: metadata/signed/platform/
  - id: metadata/binary/installer/family/
  - id: metadata/binary/installer/script/
- id: raw-ip-winhttp-memory-stager
  desc: Raw-IP WinHTTP memory stager
  crit: hostile
  conf: 0.97
  ref: sha256:8a710cccc278dc81e3fda6081c71cfac7bcfa0099821d7d0a7fab7f415cfd411
  size_max: 524288
  all:
  - id: micro-behaviors/communications/http/client/winhttp::winhttp-download-context
  - id: micro-behaviors/communications/http/url/external-ip::url-external-ip-port-binary
  - id: micro-behaviors/mem/protect/modify::rw-to-rx-protection-with-thread-start
  any:
  - id: micro-behaviors/process/create/spawn::create-process-a
  - id: micro-behaviors/process/create/spawn::create-process-w
  - id: micro-behaviors/fs/temp/directory::get-temp-path-name
  - id: micro-behaviors/os/module/load::dynamic-self-resolution-imports
  needs: 2
  unless:
  - id: metadata/signed/platform/
  - id: metadata/binary/installer/family/
  - id: metadata/binary/installer/script/
- id: raw-ip-winhttp-persisted-file-stager
  desc: Raw-IP WinHTTP file stager with Run-key persistence
  crit: hostile
  conf: 0.97
  attack: "T1105,T1547.001"
  size_max: 524288
  all:
  - id: micro-behaviors/communications/http/client/winhttp::winhttp-download-context
  - id: micro-behaviors/communications/http/url/external-ip::url-external-ip-port-binary
  - id: objectives/persistence/login/registry/run-key::pe-registry-self-install
  any:
  - id: micro-behaviors/process/create/spawn::create-process-a
  - id: micro-behaviors/process/create/spawn::create-process-w
  - id: micro-behaviors/process/create/shellexec::shell-execute-call
  unless:
  - id: metadata/signed/platform/
  - id: metadata/binary/installer/family/
  - id: metadata/binary/installer/script/
  # Versioned self-updaters also combine downloads, autostart and launch.
  # Keep the persistence dependency's version-resource qualification here.
  - id: metadata/package/versioning/scheme::pe-version-resource
- id: raw-ip-runtime-winhttp-autostart-stager
  desc: Raw-IP autostart stager with runtime-resolved WinHTTP APIs
  crit: hostile
  conf: 0.97
  attack: "T1105,T1547.001,T1071.001"
  size_max: 524288
  all:
  - id: micro-behaviors/communications/http/url/external-ip::url-external-ip-port-binary
  - id: objectives/persistence/login/registry/run-key::pe-registry-self-install
  - id: micro-behaviors/communications/http/client/winhttp::winhttp-dll-name-text
  - id: micro-behaviors/communications/http/client/winhttp::winhttp-open-api-name
  - id: micro-behaviors/communications/http/client/winhttp::winhttp-connect-api-name
  - id: micro-behaviors/communications/http/client/winhttp::winhttp-read-data-api-name
  - id: metadata/signed/trust-level::unsigned-missing-signature-record
  unless:
  - id: metadata/signed/platform/
  - id: metadata/binary/installer/family/
  - id: metadata/binary/installer/script/
- id: unsigned-winhttp-remote-memory-stager
  desc: Unsigned WinHTTP stager with remote-process memory APIs
  crit: hostile
  conf: 0.99
  attack: "T1055,T1105,T1622"
  for: [pe, dll]
  all:
  - id: micro-behaviors/communications/http/client/winhttp::winhttp-download-context
  - id: metadata/signed/trust-level::unsigned-missing-signature-record
  - id: micro-behaviors/process/inject/runtime/call::remote-process-memory-api-cluster
  - id: objectives/command-and-control/dropper/staging/native/loader::temp-copy-shell-handoff
  unless:
  - id: metadata/signed/platform/
  - id: metadata/binary/installer/family/
  - id: metadata/binary/installer/script/
