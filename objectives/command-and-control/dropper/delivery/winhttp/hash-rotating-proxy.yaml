defaults:
  for: [pe]
  platforms: [windows]
  attack: T1105,T1059
composite_rules:
  - id: hash-rotating-proxy-direct-ip-stage
    desc: Hash-rotating proxy has direct-IP stage launcher
    crit: hostile
    conf: 0.98
    all:
      - id: objectives/command-and-control/channel/proxy::hash-rotating-port-seizing-proxy
      - id: micro-behaviors/communications/http/client/winhttp::winhttp-runtime-api-table
      - id: micro-behaviors/communications/http/url/external-ip::url-external-ip-port-binary
      - id: micro-behaviors/process/create/spawn::create-process-w

  # A fixed-upstream update mirror can filter manifests, so that behavior
  # alone stays notable. This conjunction requires the same binary to combine
  # that update-channel control with image replacement, self-mutation,
  # autostart and port-owner termination.
  - id: self-mutating-update-proxy-port-eviction
    desc: Update proxy replaces itself, persists, and evicts a listener
    crit: hostile
    conf: 0.98
    attack: T1105,T1071.001,T1547.001
    all:
      - id: micro-behaviors/communications/proxy/relay::eset-manifest-filtering-relay-profile
      - id: micro-behaviors/process/deploy::native-image-swap-network-download-profile
      - id: micro-behaviors/os/autorun/login-items::native-standby-self-mutation-run-key
      - id: micro-behaviors/process/terminate/kill::listener-port-owner-termination
