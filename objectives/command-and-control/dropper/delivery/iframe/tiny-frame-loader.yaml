# Static concealed-frame loaders: the whole page is a shell whose only
# content is a minimal-size frame pointing at a third-party document. This
# is the Trojan-Clicker / drive-by loader shape: no visible content, no
# user interaction, just a hidden document load. The two composites below
# convict on different third legs. Legitimate hidden frames conceal
# differently (SSO renewal uses display:none, cookie sync uses
# visibility:hidden with collector query strings), so neither fires here.
defaults:
  platforms: [windows, unix]
  for: [html]
  attack: T1189
composite_rules:
  - id: content-free-tiny-frame-remote-loader
    desc: Content-free loader page with remote tiny frame
    crit: hostile
    conf: 0.96
    near_bytes: 700
    all:
      - id: metadata/document/html::body-opens-with-iframe
      - id: micro-behaviors/ui/window/visibility::tiny-iframe-unquoted-small
      - id: micro-behaviors/communications/http/client/resource::external-iframe-element-load
    unless:
      - id: micro-behaviors/communications/http/url/tld::reserved-documentation-tld-url
  # Injected variant: a full content page (not a content-free shell)
  # carries a single one-pixel frame at both dimensions, so the frame
  # was added to the page rather than designed into it.
  - id: injected-tiny-frame-remote-loader
    desc: Content page carries an injected one-pixel remote frame
    crit: hostile
    conf: 0.95
    near_bytes: 300
    all:
      - id: micro-behaviors/ui/window/visibility::iframe-width-at-most-one
      - id: micro-behaviors/ui/window/visibility::iframe-height-at-most-one
      - id: micro-behaviors/communications/http/client/resource::external-iframe-element-load
    unless:
      - id: metadata/document/html::body-opens-with-iframe
      - id: micro-behaviors/communications/http/url/tld::reserved-documentation-tld-url
  - id: concealed-frame-numeric-document-loader
    desc: Concealed tiny frame loads a numeric-path document
    crit: hostile
    conf: 0.95
    near_bytes: 700
    all:
      - id: micro-behaviors/ui/window/visibility::tiny-iframe-unquoted-small
      - id: micro-behaviors/communications/http/client/resource::external-iframe-element-load
      - id: micro-behaviors/communications/url/path::bare-numeric-html-document-url
    unless:
      - id: micro-behaviors/communications/http/url/tld::reserved-documentation-tld-url
