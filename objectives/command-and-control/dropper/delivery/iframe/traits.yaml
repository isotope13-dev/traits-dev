# Compromised-site drive-by: a script block appended to an otherwise normal page
# builds an iframe, parks it off the canvas with a large negative offset, points
# it at a third-party URL, and appends it on load. The frame renders and runs the
# remote document while staying invisible to the visitor.
#
# Off-screen parking is the discriminator, not concealment in general. The two
# legitimate hidden-iframe idioms conceal differently and were checked against
# this rule: silent-SSO token renewal uses `display:none`, and ad-tech cookie
# sync uses `visibility:hidden` with 1x1 sizing. Neither parks a frame at
# -999em/-9999px, because neither needs the frame to lay out -- an injector does,
# which is exactly why it reaches for the offset instead.
defaults:
  platforms: [unix, windows, ios]
  for: [html, javascript, elixir, scala]
  attack: T1189
  mbc: B0031

composite_rules:
  - id: hidden-iframe-executable-query-delivery
    desc: Hidden iframe carries a nested executable payload URL
    crit: hostile
    conf: 0.99
    attack: T1189,T1105
    for: [html, javascript, typescript]
    near_bytes: 4096
    all:
      - id: micro-behaviors/data/format/html::hidden-iframe
      - id: micro-behaviors/communications/http/url/query::nested-executable-url-value

  - id: inert-worker-executable-payload-delivery
    desc: Inert script Worker launches executable payload delivery
    crit: hostile
    conf: 0.99
    attack: T1189,T1059.007,T1105
    for: [html]
    near_bytes: 4096
    all:
      - id: micro-behaviors/process/create/workers::inert-script-worker-source
      - id: micro-behaviors/communications/http/url/query::nested-executable-url-value

  - id: browser-gated-tiny-iframe-delivery
    for: [html]
    desc: Browser-targeted minimal-size iframe loads a remote document
    crit: hostile
    conf: 0.97
    all:
      - id: micro-behaviors/communications/http/user-agent::navigator-useragent-conditional
      - id: micro-behaviors/data/format/html::tiny-iframe
      - id: micro-behaviors/communications/http/client/resource::external-iframe-element-load
    near_bytes: 700
  # `width=0 height=0` with an unquoted remote `src` is not the 1x1 ad pixel.
  # Both zeros sit on the same tag as the URL, so the window stays on that tag.
  - id: zero-size-iframe-remote-delivery
    for: [html, scala, elixir]
    desc: Zero-size iframe loads a remote document
    crit: hostile
    conf: 0.96
    all:
      - id: micro-behaviors/data/format/html::tiny-iframe-unquoted-zero
      - id: micro-behaviors/communications/http/client/resource::external-iframe-element-load
    near_bytes: 400
  - id: offscreen-parked-iframe-remote-delivery
    for: [javascript]
    desc: Off-screen iframe loads a remote document
    crit: hostile
    conf: 0.97
    all:
      - id: micro-behaviors/data/format/html::iframe-create
      - id: micro-behaviors/data/format/html::offscreen-negative-offset-style
      - id: micro-behaviors/communications/http/url/domain::js-remote-host-url
    # The whole injected block is one script tag a few hundred bytes long; the
    # window keeps the URL tied to THIS frame rather than to any remote URL
    # elsewhere on the page.
    near_bytes: 400
  - id: full-viewport-iframe-overlay-delivery
    desc: Full-viewport iframe overlay loads a remote page
    crit: hostile
    conf: 0.99
    attack: T1189,T1105
    for: [html, javascript, typescript]
    near_bytes: 2400
    all:
      - id: micro-behaviors/ui/window/insert-html::browser-create-iframe-element
      - id: micro-behaviors/ui/window/insert-html::browser-iframe-src-variable
      - id: micro-behaviors/ui/window/overlay::remote-url-near-element-src-assignment
      - id: micro-behaviors/ui/window/style::element-viewport-width-assignment
      - id: micro-behaviors/ui/window/style::element-viewport-height-assignment
      - id: micro-behaviors/ui/window/style::element-high-z-index-assignment
      - id: micro-behaviors/ui/window/style::element-absolute-position-assignment

  # A browser-targeted stage loader requires a response read plus a sink that
  # can execute or inject the fetched content. Synchronous XHR alone is also a
  # legitimate way to load packaged application resources.
  - id: browser-targeted-remote-stage
    desc: Browser-targeted synchronous remote JavaScript stage loader
    crit: suspicious
    conf: 0.97
    attack: T1189,T1105
    for: [javascript]
    unless:
      - id: well-known/app/productivity/vditor::package-context
    near_bytes: 4096
    all:
      - id: micro-behaviors/communications/http/user-agent::navigator-useragent-conditional
      - id: micro-behaviors/communications/http/client/xmlhttp::xhr-sync-response-text
    any:
      - id: micro-behaviors/process/interpreter/eval/direct::js-eval-response-text
      - id: micro-behaviors/process/create/workers::browser-worker-constructor
      - id: micro-behaviors/ui/window/insert-html::browser-create-script-element

  - id: browser-targeted-worker-stage
    desc: Browser-targeted remote stage executes from a JavaScript Worker Blob
    crit: hostile
    conf: 0.99
    attack: T1189,T1059.007,T1105
    for: [javascript]
    near_bytes: 4096
    all:
      - id: browser-targeted-remote-stage
      - id: micro-behaviors/process/create/workers::browser-worker-constructor
      - id: micro-behaviors/data/format/blob::browser-javascript-blob
      - id: micro-behaviors/communications/url/object::browser-object-url

  - id: browser-targeted-remote-eval
    desc: Browser-targeted remote response is evaluated as JavaScript
    crit: hostile
    conf: 0.99
    attack: T1189,T1059.007,T1105
    for: [javascript]
    near_bytes: 4096
    all:
      - id: browser-targeted-remote-stage
      - id: micro-behaviors/process/interpreter/eval/direct::js-eval-variable-argument

  # Hex-pair fromCharCode decoder writes a concealed iframe. The iframe tag is
  # often only present as ASCII hex (`3c696672616d65`) so HTML iframe atoms
  # never see it; vxheaven packaged these as `.sc` (typed Scala).
  - id: hex-decoded-hidden-iframe-document-write
    desc: Hex decoder writes a hidden iframe into the document
    crit: hostile
    conf: 0.97
    attack: T1189,T1027,T1059.007
    for: [html, scala, elixir]
    all:
      - id: micro-behaviors/data/decode/hex::js-parseint-radix-16
      - id: objectives/anti-static/obfuscation/syntax::html-fromcharcode-decode
      - id: micro-behaviors/ui/window/insert-html::browser-document-write
      - id: micro-behaviors/data/decode/hex::hex-encoded-iframe-tag
    near_bytes: 2000
  - id: hex-decoded-script-document-write
    desc: Hex decoder writes a script tag into the document
    crit: hostile
    conf: 0.96
    attack: T1189,T1027,T1059.007
    for: [html, scala, elixir]
    all:
      - id: micro-behaviors/data/decode/hex::js-parseint-radix-16
      - id: objectives/anti-static/obfuscation/syntax::html-fromcharcode-decode
      - id: micro-behaviors/ui/window/insert-html::browser-document-write
      - id: micro-behaviors/data/decode/hex::hex-encoded-script-tag
    near_bytes: 2000
  - id: hex-decoded-concealed-iframe-style
    desc: Hex decoder conceals injected iframe with display none
    crit: hostile
    conf: 0.96
    attack: T1189,T1027
    for: [html, scala, elixir]
    all:
      - id: micro-behaviors/data/decode/hex::hex-encoded-iframe-tag
      - id: micro-behaviors/data/decode/hex::hex-encoded-display-none
      - id: micro-behaviors/ui/window/insert-html::browser-document-write
    near_bytes: 2000
