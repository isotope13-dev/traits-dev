# msi2exe wraps an MSI (often with a tiny CAB of .ps1/.cmd) into a PE stub that
# extracts and runs the package. Visible table strings name Ps1File/CmdFile and
# a Run-style sysupdate key even when the script bodies stay compressed.
defaults:
  platforms: [windows]
  for: [pe]
  attack: T1204.002,T1059.001,T1547.001

traits:
  - id: msi2exe-stub-pdb
    desc: msi2exe converter stub PDB path
    crit: notable
    conf: 0.98
    if:
      type: text
      regex: '(?i)msi2exe(stub)?\.pdb'

  - id: msi2exe-tool-token
    desc: msi2exe tool identity token
    crit: component
    conf: 0.9
    if:
      type: text
      substr: msi2exe

  - id: installer-table-ps1file-entry
    desc: Installer table names a Ps1File payload
    crit: notable
    conf: 0.95
    if:
      type: text
      substr: Ps1File

  # Word-bounded: as a bare substring the token also falls out of concatenated
  # identifier tables in compiled binaries (Go's debug/macho names spell
  # ...RawDysymtabCmd|File... in cmd/vet), which is not an installer table.
  - id: installer-table-cmdfile-entry
    desc: Installer table names a CmdFile payload
    crit: notable
    conf: 0.95
    if:
      type: text
      word: CmdFile

  - id: sysupdate-registry-path
    desc: Software hive sysupdate persistence path
    crit: suspicious
    conf: 0.92
    if:
      type: text
      regex: '(?i)Software\\[^\\\r\n]{1,64}\\sysupdate'

composite_rules:
  - id: msi2exe-ps1-cmd-dropper
    desc: msi2exe stub stages paired Ps1File and CmdFile
    crit: hostile
    conf: 0.97
    attack: T1204.002,T1059.001,T1105
    all:
      - id: msi2exe-stub-pdb
      - id: installer-table-ps1file-entry
      - id: installer-table-cmdfile-entry
      - id: micro-behaviors/process/create/spawn::create-process-a
    unless:
      - id: metadata/signed/platform/

  - id: msi2exe-sysupdate-script-dropper
    desc: msi2exe stub persists via sysupdate with script payloads
    crit: hostile
    conf: 0.96
    attack: T1547.001,T1059.001,T1204.002
    all:
      - id: msi2exe-tool-token
      - id: sysupdate-registry-path
      - id: installer-table-ps1file-entry
      - id: installer-table-cmdfile-entry
    unless:
      - id: metadata/signed/platform/
