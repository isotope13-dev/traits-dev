defaults:
  platforms: [windows]
  for: [oledoc]

traits:
  - id: ai-enforced-embedded-exe-elevation
    desc: MSI forces embedded EXE elevation
    crit: suspicious
    conf: 0.97
    if:
      id: metadata/file/profile/identity::msi-bytes-enforced-runasadmin
    unless:
      - id: metadata/signed/platform/
      - id: well-known/lib/platform/advanced-installer::advanced-installer-helper-context
      - id: well-known/app/storage/cloud-drive-mapper::cloud-drive-mapper-msi-context
      - id: metadata/package/files/msi::cloud-drive-mapper-msi-context

composite_rules:
  - id: ai-file-download-dropper
    desc: Advanced Installer MSI downloads remote payload at install time
    crit: suspicious
    conf: 0.95
    scope: outer
    all:
      - id: metadata/package/files/msi::ole2-installer-kind
      - id: well-known/lib/platform/advanced-installer::ai-file-download-action
      - id: metadata/file/profile/identity::msi-bytes-advanced-installer-product

  - id: ai-dropper-with-extract
    desc: Advanced Installer MSI downloads and expands an archive
    crit: suspicious
    conf: 0.9
    scope: outer
    all:
      - id: ai-file-download-dropper
      - id: well-known/lib/platform/advanced-installer::ai-expand-archive-action

  - id: ai-powershell-download-helper
    desc: Advanced Installer MSI embeds PowerShell download helper
    crit: suspicious
    conf: 0.94
    attack: T1059.001,T1105
    scope: outer
    all:
      - id: metadata/package/files/msi::ole2-installer-kind
      - id: well-known/lib/platform/advanced-installer::ai-powershell-script-launcher
      - id: well-known/lib/platform/advanced-installer::ai-file-download-action
      - id: micro-behaviors/process/create/exec::powershell-exe-reference
