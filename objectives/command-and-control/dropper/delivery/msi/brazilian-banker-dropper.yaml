# Remote archive delivery via Advanced Installer FileDownload, plus a capability
# cluster for an embedded payload.
defaults:
  platforms: [windows]
  for: [oledoc]

composite_rules:
  - id: brazilian-banker-msi-dropper
    desc: pt-BR Advanced Installer MSI with remote FileDownload stage
    crit: hostile
    conf: 0.93
    attack: T1105,T1204.002
    scope: outer
    all:
      - id: objectives/command-and-control/dropper/delivery/msi::ai-file-download-dropper
      - id: metadata/package/files/msi::msi-ptbr-product-language
      - id: metadata/package/files/msi::msi-nonstandard-subject-identity
      - id: metadata/package/files/msi::msi-nonstandard-creator-identity
      - id: well-known/lib/platform/advanced-installer::ai-expand-archive-action

  # Banker payload capability cluster on the embedded PE:
  # certificate-store population (TLS-MITM enabler) + WinInet HTTP transport +
  # SC Manager service control + SQL keywords or screen capture or Toolhelp
  # process enumeration. The conjunction is rare outside Brazilian banker
  # payloads regardless of the MSI cover identity.
  - id: banker-payload-cluster-pe
    desc: Banker capability cluster in embedded PE
    crit: suspicious
    conf: 0.9
    for: [pe, dll]
    all:
      - id: micro-behaviors/crypto/certificate/store::pfx-import
      - id: micro-behaviors/crypto/certificate/store::cert-add-to-store
      - id: micro-behaviors/communications/http/post::wininet-post
      - id: micro-behaviors/os/service/control::start-service
    any:
      - id: micro-behaviors/data/db/sql::sql-keywords
      - id: micro-behaviors/hardware/display/screen::gdi-bitmap-transfer-primitives
      - id: micro-behaviors/process/enumerate/snapshot::toolhelp-process-enumeration-symbol
