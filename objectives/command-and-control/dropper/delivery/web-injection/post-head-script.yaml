# Mass site-compromise kits inject a loader script immediately following
# </head> before <body>. Valid HTML documents do not place script tags
# between the head and body elements; an external script tag in this position
# is a characteristic mark of an injected web page.
defaults:
  platforms: [windows, unix]
  for: [html]
  attack: T1189,T1105

traits:
  - id: post-head-injected-remote-script
    desc: Remote script injected between head and body
    crit: suspicious
    conf: 0.95
    if:
      type: text
      regex: '(?is)</head>\s*<script\b[^>]{0,300}?\bsrc\s*=\s*["'']?https?://'
      exclude_html_comments: true

composite_rules:
  - id: post-head-script-injection
    desc: Script injected between head and body
    crit: hostile
    conf: 0.98
    all:
      - id: post-head-injected-remote-script
      - id: micro-behaviors/communications/http/client/resource::external-script-element-load

  - id: treewalk-decoded-script-injection
    desc: Treewalk decoded injection with remote script
    crit: hostile
    conf: 0.98
    attack: T1189,T1027,T1059.007
    all:
      - id: objectives/anti-static/obfuscation/encoding/numeric::treewalk-charcode-document-write
      - id: micro-behaviors/communications/http/client/resource::external-script-element-load
