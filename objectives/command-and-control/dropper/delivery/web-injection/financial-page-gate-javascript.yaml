defaults:
  platforms: [windows, unix]
  for: [javascript, typescript, html]
  attack: "T1539"

traits:
# Location gate on financial pages: the script reads the page URL and only
# proceeds on account/withdraw/crypto paths. Skimmers stay silent everywhere
# else so the injected collector only runs where money moves. Two spellings:
# decoded source (`location...indexOf('myaccount...`) and packer keyword
# tables (`location|if|indexOf|myaccount|...`, token order preserved). No
# merchant, domain, or campaign string is assumed.
- id: location-indexof-financial-page
  desc: Location checked for financial page marker
  crit: notable
  conf: 0.9
  if:
    type: literal
    regex: 'location.{0,40}indexOf\(.(myaccount|withdraw|BTC|checkout|payment)'
- id: document-location-financial-page-alias
  desc: Document location copied before page gate
  crit: notable
  conf: 0.9
  if:
    type: text
    regex: 'document\.location.{0,120}indexOf\s*\([''"''][^''"'']{0,24}(withdraw|checkout|payment|BTC)'
- id: packed-financial-page-table
  desc: Packer table gates on financial page marker
  crit: component
  conf: 0.9
  if:
    type: literal
    regex: 'location\|[a-z]+\|indexOf\|(myaccount|withdraw|BTC)'
  unless:
  - id: metadata/lang/scripted::dts-declaration-file
  - id: well-known/lib/development/vscode-webview::acquire-vscode-api
  - id: micro-behaviors/process/interpreter/vm/

composite_rules:
# Either spelling of the same gate (decoded source or packer table).
- id: financial-page-gate
  desc: Execution gated on financial page marker
  crit: component
  conf: 0.9
  any:
    - id: location-indexof-financial-page
    - id: document-location-financial-page-alias
    - id: packed-financial-page-table
# Targeted injector: the script only fires on financial pages (location gate
# above) and pulls a remote script there. A generic loader has no page gate;
# a gated loader that only runs where money moves is a skimmer injector.
- id: financial-page-gated-script-inject
  for: [javascript]
  desc: Script injection gated on financial pages
  crit: hostile
  conf: 0.97
  near_bytes: 8192
  all:
    - id: financial-page-gate
    - id: micro-behaviors/communications/http/client/resource::js-remote-src-assignment
