defaults:
  platforms: [windows, unix]
  attack: T1105

traits:
  # `for:` listed the `source` group, which does not contain `javascript` --
  # so this whole family was inert on the .js files it is injected into, the
  # only place it has ever been seen. `javascript` is named explicitly here
  # and on every sibling below.
  #
  # The guard flag is renamed per build (`ndsw`, `ndsx`, `ndsj` observed) and
  # newer builds spell the check `typeof X==="undefined"`, so both spellings
  # and the whole `nds<letter>` family are accepted.
  - id: ndsw-guard-block
    desc: NDSW-family injected script guard block
    crit: suspicious
    conf: 0.96
    for: [javascript, source, html, text]
    if:
      type: text
      regex: 'if\(\s*(typeof\s+)?nds[a-z]\s*===\s*"?undefined"?\s*\)'

  - id: ndsw-eval-response-callback
    desc: NDSW-family JavaScript response eval callback
    crit: suspicious
    conf: 0.96
    for: [javascript, source, html, text]
    if:
      type: text
      regex: 'function\(E\)[\s\S]{0,80}\beval\b'

  # The matcher is the eight-character substring `,'eval',` -- any JavaScript
  # that lists `eval` in an array or argument list, which a bundler's globals
  # table or a tokenizer's keyword list does routinely (Zencoder's webpack
  # output, extension.js and indexer.worker.js, both do). That is one token of
  # the NDSW array, not the family: it cannot carry a family name on its own, so
  # it is a leg for `ndsw-web-injected-loader` below, which supplies the rest.
  - id: ndsw-tokenized-eval-string
    desc: Quoted eval token inside a list
    crit: component
    conf: 0.94
    for: [javascript, source, html, text]
    if:
      type: text
      substr: ",'eval',"

  - id: stat-js-clock-include
    desc: Injected stat.js clock loader
    crit: suspicious
    conf: 0.94
    for: [source, html, text]
    if:
      type: text
      regex: '<script[^>]{0,120}src=[''"]https?://.{1,160}/stat\.js\?v=clock[''"]'

  - id: travelfornamewalking-loader
    desc: Travelfornamewalking injected loader domain
    crit: suspicious
    conf: 0.98
    for: [source, html, text]
    if:
      type: text
      substr: travelfornamewalking.ga/stat.js?v=clock

composite_rules:
  - id: extension-contextual-remote-script-loader
    desc: Extension assembles and injects a remote script
    crit: hostile
    conf: 0.98
    attack: T1105,T1059.001
    for: [javascript, typescript]
    all:
      - id: micro-behaviors/process/create/load/remote-code::js-contextual-script-markup-injection
      - id: micro-behaviors/communications/url/construction/fragment::js-split-http-url-construction
      - id: micro-behaviors/browser-extension/lifecycle::chrome-runtime-api
      - id: micro-behaviors/data/db/web-storage::chrome-storage-local-get
    near_bytes: 4096

  - id: browser-cookie-remote-script-loader
    desc: Browser loader reads cookies while pulling remote script code
    crit: hostile
    conf: 0.95
    attack: T1105,T1539
    for: [javascript, typescript, html]
    all:
      - id: micro-behaviors/communications/http/cookies::document-cookie-read
      - id: micro-behaviors/process/create/load/remote-code::js-remote-script-element
      - id: micro-behaviors/communications/http/url/domain::js-remote-host-url
      - id: micro-behaviors/ui/window/manage/dom::browser-create-script-element
    unless:
      - id: metadata/package/testing/
      - id: metadata/signed/platform/
      # A page that gates the canonical gtag.js endpoint on a consent cookie is
      # implementing analytics consent, not fetching an attacker-controlled
      # script stage.
      - id: micro-behaviors/communications/http/url/query::gtag-js-measurement-id-query
      # Bundled auth clients load the fixed, documented Google Identity
      # Services SDK endpoint next to their own first-party cookie handling
      # (One Tap / "Sign in with Google"); that is a vendor SDK fetch, not a
      # cookie-adjacent script stage.
      - id: micro-behaviors/communications/http/url/domain::google-gsi-client-script-url

  - id: remote-miner-script-injection
    desc: Obfuscated browser code injects a remote CoinHive miner
    crit: hostile
    conf: 0.96
    attack: T1105,T1496
    for: [javascript, typescript]
    all:
      - id: objectives/impact/cryptojacking/miner/signatures::coinhive-escaped-library-url
      - id: objectives/impact/cryptojacking/miner/signatures::coinhive-escaped-cpu-sizing
      - id: objectives/impact/cryptojacking/miner/signatures::coinhive-escaped-concurrency
      - id: objectives/anti-static/obfuscation/string/dynamic::hex-escaped-bracket-property
      - id: micro-behaviors/communications/url/encoded::encoded-https-url

  - id: financial-page-remote-loader
    desc: Financial-page gate delivers a remote script stage
    crit: hostile
    conf: 0.96
    attack: T1105,T1189
    for: [javascript, typescript, html]
    all:
      - id: objectives/collection/stealer/browser::financial-page-gate
      - id: micro-behaviors/process/create/load/remote-code::js-remote-script-element
      - id: micro-behaviors/communications/http/url/domain::js-remote-host-url
    unless:
      - id: metadata/package/testing/
      - id: metadata/signed/platform/

  # Packed page-script dropper: a packed eval beside a remote script-src
  # assignment in the same script. Legitimate pages rarely pack scripts with
  # Dean Edwards anymore; a packed script that pulls remote code has no
  # legitimate use.
  - id: packed-page-script-external-inject
    desc: Packed page script injects external script
    crit: hostile
    conf: 0.97
    for: [javascript, typescript]
    near_bytes: 2048
    all:
      - id: objectives/anti-static/pack/detect::dean-edwards
      - id: micro-behaviors/communications/http/client/resource::js-remote-src-assignment
  - id: via-middlebox-redirect
    desc: HTTP 307 redirect through middlebox
    crit: suspicious
    conf: 0.97
    all:
      - id: micro-behaviors/communications/http/response::http-307-temporary-redirect-status
      - id: micro-behaviors/communications/http/response::via-middlebox-response-header
      - id: micro-behaviors/communications/http/response::http-absolute-location-header
    near_bytes: 1024

  - id: crafted-reset-after-http-redirect
    desc: Sends TCP reset with HTTP redirect
    crit: hostile
    conf: 0.99
    attack: T1189,T1105,T1071.001
    for: [python]
    all:
      - id: via-middlebox-redirect
      - id: micro-behaviors/communications/socket/raw::scapy-crafted-packet-send
      - id: micro-behaviors/communications/socket/raw::scapy-tcp-reset-packet
    near_bytes: 4096

  - id: host-targeted-middlebox-redirect
    desc: Host- and User-Agent-gated HTTP redirect injection
    crit: hostile
    conf: 0.99
    attack: T1189,T1105,T1071.001
    for: [python]
    all:
      - id: micro-behaviors/communications/http/message::host-user-agent-header-pair
      - id: via-middlebox-redirect
    near_bytes: 4096

  - id: middlebox-redirect-with-reset
    desc: Middlebox HTTP redirect injection also resets the server connection
    crit: hostile
    conf: 0.99
    attack: T1189,T1105,T1071.001
    for: [python]
    all:
      - id: micro-behaviors/communications/http/message::host-user-agent-header-pair
      - id: via-middlebox-redirect
      - id: micro-behaviors/communications/socket/raw::scapy-crafted-packet-send
      - id: micro-behaviors/communications/socket/raw::scapy-tcp-reset-packet
    near_bytes: 4096

  # The guard flag names this injector and the wrapper leg supplies its
  # transport; the `any:` leg establishes that the fetched response is then
  # executed. Newer builds run the template through a string-array obfuscator,
  # which hides the literal `eval` the two original legs read, so the rotating
  # string table stands in for it there.
  - id: ndsw-web-injected-loader
    desc: NDSW-family injected web loader
    crit: hostile
    conf: 0.98
    for: [javascript, source, html, text]
    all:
      - id: ndsw-guard-block
      - id: micro-behaviors/communications/http/client/xmlhttp::httpclient-wrapper-over-xmlhttprequest
    any:
      - id: ndsw-eval-response-callback
      - id: ndsw-tokenized-eval-string
      - id: objectives/anti-static/obfuscation/obfuscator/js-obfuscator::push-shift-bracket-pattern

  - id: stat-js-clock-web-injected-loader
    desc: Stat.js clock web injected loader
    crit: hostile
    conf: 0.97
    all:
      - id: stat-js-clock-include
      - id: travelfornamewalking-loader

  # Obfuscated browser injectors hide createElement/src/appendChild behind
  # computed properties. The atoms stay neutral; these composites require an
  # actual external HTTP(S) script source before inferring hostility. Same-
  # origin vendor assets are ordinary application resource loading.
  - id: obfuscated-remote-script-loader
    desc: Obfuscated remote script injection
    crit: hostile
    conf: 0.98
    for: [javascript, typescript]
    all:
      - id: micro-behaviors/process/create/load/remote-code::js-external-script-loader
      - id: micro-behaviors/process/create/load/remote-code::js-computed-document-member-call
    any:
      - id: objectives/anti-static/obfuscation/obfuscator/js-obfuscator::push-shift-bracket-pattern
      - id: objectives/anti-static/obfuscation/obfuscator/js-obfuscator::cfg-flatten-state-list
      - id: objectives/anti-static/obfuscation/obfuscator/js-obfuscator::hex-name-mangling
    needs: 1
    near_bytes: 1800

  - id: host-targeted-obfuscated-script-loader
    desc: Host-targeted obfuscated script injection
    crit: hostile
    conf: 0.97
    for: [javascript, typescript]
    all:
      - id: micro-behaviors/communications/http/url/path::browser-location-bracket-member-read
    any:
      - id: obfuscated-remote-script-loader
      - id: obfuscated-chained-remote-script-loader

  # A poisoned trusted page commonly keeps the first-stage script remote and
  # only presents the social-engineering prompt to selected browsers.  The
  # delivery mechanism is the combination, not any brand, hostname, or
  # payload string.
  - id: browser-targeted-clickfix-loader
    desc: Browser-targeted remote script feeds a verification paste lure
    crit: hostile
    conf: 0.98
    attack: T1105,T1204.001,T1059.001
    for: [html, javascript, typescript]
    all:
      - id: micro-behaviors/process/create/load/script::external-script-element-load
      - id: micro-behaviors/communications/http/user-agent::navigator-useragent-conditional
      - id: objectives/execution/lure/clipboard::fake-captcha-winr-paste-instructions
  - id: timestamped-remote-script-injection
    desc: Cache-busted remote script injected into a page
    crit: suspicious
    conf: 0.96
    attack: T1105,T1059.001
    for: [javascript, typescript]
    all:
      - id: micro-behaviors/process/create/load/script::dynamic-script-element-load
      - id: micro-behaviors/communications/http/client/resource::unix-timestamp-src-cache-bust
      - id: micro-behaviors/ui/window/manage/dom::browser-insert-before
    near_bytes: 2048
  - id: browser-gated-timestamped-loader
    desc: Browser-targeted cache-busted remote script injection
    crit: suspicious
    conf: 0.97
    attack: T1105,T1189
    for: [javascript, typescript]
    all:
      - id: timestamped-remote-script-injection
      - id: micro-behaviors/communications/http/user-agent::navigator-useragent-conditional
    near_bytes: 2048
  - id: obfuscated-chained-remote-script-loader
    desc: Obfuscated chained-document script injection
    crit: hostile
    conf: 0.98
    for: [javascript, typescript]
    all:
      - id: micro-behaviors/process/create/load/remote-code::js-computed-external-script-loader
      - id: micro-behaviors/process/create/load/remote-code::js-computed-document-member-call
    any:
      - id: objectives/anti-static/obfuscation/obfuscator/js-obfuscator::push-shift-bracket-pattern
      - id: objectives/anti-static/obfuscation/obfuscator/js-obfuscator::cfg-flatten-state-list
      - id: objectives/anti-static/obfuscation/obfuscator/js-obfuscator::hex-name-mangling
    needs: 1
