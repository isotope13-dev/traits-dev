defaults:
  platforms: [windows, unix]
  attack: T1105

traits:
  - id: ndsw-guard-block
    desc: NDSW injected JavaScript guard block
    crit: suspicious
    conf: 0.96
    for: [source, html, text]
    if:
      type: text
      substr: if(ndsw===undefined)

  - id: ndsw-xhr-client
    desc: NDSW JavaScript XMLHttpRequest client
    crit: suspicious
    conf: 0.96
    for: [source, html, text]
    if:
      type: text
      regex: 'HttpClient=function[\s\S]{0,260}new XMLHttpRequest\('

  - id: ndsw-eval-response-callback
    desc: NDSW JavaScript response eval callback
    crit: suspicious
    conf: 0.96
    for: [source, html, text]
    if:
      type: text
      regex: 'function\(E\)[\s\S]{0,80}\beval\b'

  - id: ndsw-tokenized-eval-string
    desc: NDSW tokenized eval string
    crit: suspicious
    conf: 0.94
    for: [source, html, text]
    if:
      type: text
      substr: ",'eval',"

  - id: stat-js-clock-include
    desc: Injected stat.js clock loader
    crit: suspicious
    conf: 0.94
    for: [source, html, text]
    if:
      type: text
      regex: '<script[^>]{0,120}src=[''"]https?://.{1,160}/stat\.js\?v=clock[''"]'

  - id: travelfornamewalking-loader
    desc: Travelfornamewalking injected loader domain
    crit: suspicious
    conf: 0.98
    for: [source, html, text]
    if:
      type: text
      substr: travelfornamewalking.ga/stat.js?v=clock

composite_rules:
  # Packed page-script dropper: a packed eval beside a remote script-src
  # assignment in the same script. Legitimate pages rarely pack scripts with
  # Dean Edwards anymore; a packed script that pulls remote code has no
  # legitimate use.
  - id: packed-page-script-external-inject
    desc: Packed page script injects external script
    crit: hostile
    conf: 0.97
    for: [javascript, typescript]
    near_bytes: 2048
    all:
      - id: objectives/anti-static/pack/detect::dean-edwards
      - id: micro-behaviors/process/create/load/remote-code::js-remote-src-assignment
  - id: via-middlebox-redirect
    desc: HTTP 307 redirect through middlebox
    crit: suspicious
    conf: 0.97
    all:
      - id: micro-behaviors/communications/http/response::http-307-temporary-redirect-status
      - id: micro-behaviors/communications/http/response::via-middlebox-response-header
      - id: micro-behaviors/communications/http/response::http-external-location-header
    near_bytes: 1024

  - id: crafted-reset-after-http-redirect
    desc: Sends TCP reset with HTTP redirect
    crit: hostile
    conf: 0.99
    attack: T1189,T1105,T1071.001
    for: [python]
    all:
      - id: via-middlebox-redirect
      - id: micro-behaviors/communications/socket/raw::scapy-crafted-packet-send
      - id: micro-behaviors/communications/socket/raw::scapy-tcp-reset-packet
    near_bytes: 4096

  - id: host-targeted-middlebox-redirect
    desc: Host- and User-Agent-gated HTTP redirect injection
    crit: hostile
    conf: 0.99
    attack: T1189,T1105,T1071.001
    for: [python]
    all:
      - id: micro-behaviors/communications/http/message::host-user-agent-header-pair
      - id: via-middlebox-redirect
    near_bytes: 4096

  - id: middlebox-redirect-with-reset
    desc: Middlebox HTTP redirect injection also resets the server connection
    crit: hostile
    conf: 0.99
    attack: T1189,T1105,T1071.001
    for: [python]
    all:
      - id: micro-behaviors/communications/http/message::host-user-agent-header-pair
      - id: via-middlebox-redirect
      - id: micro-behaviors/communications/socket/raw::scapy-crafted-packet-send
      - id: micro-behaviors/communications/socket/raw::scapy-tcp-reset-packet
    near_bytes: 4096

  - id: ndsw-web-injected-loader
    desc: NDSW injected web loader
    crit: hostile
    conf: 0.98
    all:
      - id: ndsw-guard-block
      - id: ndsw-xhr-client
    any:
      - id: ndsw-eval-response-callback
      - id: ndsw-tokenized-eval-string

  - id: stat-js-clock-web-injected-loader
    desc: Stat.js clock web injected loader
    crit: hostile
    conf: 0.97
    all:
      - id: stat-js-clock-include
      - id: travelfornamewalking-loader

  # Obfuscated browser injectors hide createElement/src/appendChild behind
  # computed properties. The atoms stay neutral; these composites require an
  # actual external HTTP(S) script source before inferring hostility. Same-
  # origin vendor assets are ordinary application resource loading.
  - id: obfuscated-remote-script-loader
    desc: Obfuscated remote script injection
    crit: hostile
    conf: 0.98
    for: [javascript, typescript]
    all:
      - id: micro-behaviors/process/create/load/remote-code::js-external-script-loader
      - id: micro-behaviors/process/create/load/remote-code::js-computed-document-member-call
    any:
      - id: objectives/anti-static/obfuscation/obfuscator/js-obfuscator::push-shift-bracket-pattern
      - id: objectives/anti-static/obfuscation/obfuscator/js-obfuscator::cfg-flatten-state-list
      - id: objectives/anti-static/obfuscation/obfuscator/js-obfuscator::hex-name-mangling
    needs: 1
    near_bytes: 1800

  - id: host-targeted-obfuscated-script-loader
    desc: Host-targeted obfuscated script injection
    crit: hostile
    conf: 0.97
    for: [javascript, typescript]
    all:
      - id: micro-behaviors/communications/http/url/path::browser-location-bracket-member-read
    any:
      - id: obfuscated-remote-script-loader
      - id: obfuscated-chained-remote-script-loader

  # A poisoned trusted page commonly keeps the first-stage script remote and
  # only presents the social-engineering prompt to selected browsers.  The
  # delivery mechanism is the combination, not any brand, hostname, or
  # payload string.
  - id: browser-targeted-clickfix-loader
    desc: Browser-targeted remote script feeds a verification paste lure
    crit: hostile
    conf: 0.98
    attack: T1105,T1204.001,T1059.001
    for: [html, javascript, typescript]
    all:
      - id: micro-behaviors/communications/http/client/resource::external-script-element-load
      - id: micro-behaviors/communications/http/user-agent::navigator-useragent-conditional
      - id: objectives/execution/lure/clipboard::fake-captcha-winr-paste-instructions
  - id: timestamped-remote-script-injection
    desc: Cache-busted remote script injected into a page
    crit: suspicious
    conf: 0.96
    attack: T1105,T1059.001
    for: [javascript, typescript]
    all:
      - id: micro-behaviors/communications/http/client/resource::dynamic-script-element-load
      - id: micro-behaviors/communications/http/client/resource::unix-timestamp-src-cache-bust
      - id: micro-behaviors/ui/window/manage/dom::browser-insert-before
    near_bytes: 2048
  - id: browser-gated-timestamped-loader
    desc: Browser-targeted cache-busted remote script injection
    crit: suspicious
    conf: 0.97
    attack: T1105,T1189
    for: [javascript, typescript]
    all:
      - id: timestamped-remote-script-injection
      - id: micro-behaviors/communications/http/user-agent::navigator-useragent-conditional
    near_bytes: 2048
  - id: obfuscated-chained-remote-script-loader
    desc: Obfuscated chained-document script injection
    crit: hostile
    conf: 0.98
    for: [javascript, typescript]
    all:
      - id: micro-behaviors/process/create/load/remote-code::js-computed-external-script-loader
      - id: micro-behaviors/process/create/load/remote-code::js-computed-document-member-call
    any:
      - id: objectives/anti-static/obfuscation/obfuscator/js-obfuscator::push-shift-bracket-pattern
      - id: objectives/anti-static/obfuscation/obfuscator/js-obfuscator::cfg-flatten-state-list
      - id: objectives/anti-static/obfuscation/obfuscator/js-obfuscator::hex-name-mangling
    needs: 1
