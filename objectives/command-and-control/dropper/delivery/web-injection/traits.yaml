defaults:
  platforms: [windows, unix]
  attack: T1105

traits:
  # These three markup fragments are only meaningful together: a six-character
  # comment sentinel brackets a remote PHP script request carrying a numeric
  # site identifier. Injectors commonly use this wrapper to hide their loader
  # among otherwise ordinary page markup.
  - id: comment-sentinel-before-script
    desc: Pre-script comment sentinel
    crit: component
    conf: 0.92
    for: [html]
    if:
      type: text
      regex: '<!--[a-z0-9]{6}-->\s*<script\b'

  - id: remote-php-script-numeric-id
    desc: Remote PHP script URL with numeric id
    crit: component
    conf: 0.93
    for: [html]
    if:
      type: text
      regex: '(?i)https?://[^"''\s]{1,180}/[a-z0-9]{8}\.php\?id=\d+'

  - id: comment-sentinel-after-script
    desc: Post-script comment sentinel
    crit: component
    conf: 0.92
    for: [html]
    if:
      type: text
      regex: '</script>\s*<!--/[a-z0-9]{6}-->'

  - id: stat-js-clock-include
    desc: Injected stat.js clock loader
    crit: suspicious
    conf: 0.94
    for: [source, html, text]
    if:
      type: text
      regex: '<script[^>]{0,120}src=[''"]https?://.{1,160}/stat\.js\?v=clock[''"]'

  - id: travelfornamewalking-loader
    desc: Travelfornamewalking injected loader domain
    crit: suspicious
    conf: 0.98
    for: [source, html, text]
    if:
      type: text
      substr: travelfornamewalking.ga/stat.js?v=clock

  # The host rotates rapidly, while the injected tag's path and site token are
  # stable across the kit. Match that protocol shape rather than a campaign
  # hostname, analytics-looking element id, or one observed site identifier.
  - id: site-token-tjs-script-loader
    desc: External t.js loader with 32-hex site token
    crit: suspicious
    conf: 0.98
    attack: T1105,T1189
    for: [html, javascript, typescript]
    if:
      type: text
      regex: '<script[^>]{0,240}\bsrc=["'']https?://[^/"'']{1,253}/t\.js\?site=[0-9a-fA-F]{32}["'']'

  # The same zero-size iframe written from two or more separate script sites
  # is an injection footprint: an author embeds a widget once, while a
  # compromised page carries the injected block wherever the injector landed
  # (head, body and after </html> are the common sites). Zero sizing keeps
  # the written iframe out of ordinary layout markup.
  - id: repeated-concealed-iframe-write
    desc: Writes zero-size iframes at many script sites
    crit: notable
    conf: 0.9
    for: [html]
    count_min: 2
    if:
      type: text
      regex: 'document\.write\s*\(\s*[''"][^''"]{0,80}<iframe[^>]{0,240}\bwidth=0\b[^>]{0,200}\bheight=0\b'

composite_rules:
  # A remote script element is common on legitimate sites. The paired
  # sentinels around an opaque PHP endpoint with a numeric site id identify
  # the injected loader structure while keeping the individual observations
  # neutral outside this conjunction.
  - id: comment-sentinel-remote-php-script-injection
    desc: Sentinel-wrapped remote PHP loader
    crit: hostile
    conf: 0.98
    for: [html]
    attack: T1189,T1105
    near_bytes: 300
    all:
      - id: comment-sentinel-before-script
      - id: remote-php-script-numeric-id
      - id: comment-sentinel-after-script
      - id: micro-behaviors/process/deploy::external-script-element-load
      - id: micro-behaviors/communications/http/client/resource::remote-script-element-source

  - id: extension-contextual-remote-script-loader
    desc: Extension assembles and injects a remote script
    crit: hostile
    conf: 0.98
    attack: T1105,T1059.001
    for: [javascript, typescript]
    all:
      - id: micro-behaviors/process/create/load/remote-code::js-contextual-script-markup-injection
      - id: micro-behaviors/communications/url/construction/fragment::js-split-http-url-construction
      - id: micro-behaviors/browser-extension/lifecycle::chrome-runtime-api
      - id: micro-behaviors/data/db/web-storage::chrome-storage-local-get
    near_bytes: 4096

  - id: financial-page-remote-loader
    desc: Financial-page gate delivers a remote script stage
    crit: hostile
    conf: 0.96
    attack: T1105,T1189
    for: [javascript]
    all:
      - id: financial-page-gate
      - id: micro-behaviors/process/create/load/remote-code::js-remote-script-element
      - id: micro-behaviors/communications/http/url/domain::js-remote-host-url
    unless:
      - id: metadata/package/testing/
      - id: metadata/signed/platform/

  # Packed page-script dropper: a packed eval beside a remote script-src
  # assignment in the same script. Legitimate pages rarely pack scripts with
  # Dean Edwards anymore; a packed script that pulls remote code has no
  # legitimate use.
      - id: "metadata/file/naming::test-directory-component"
  - id: packed-page-script-external-inject
    desc: Packed page script injects external script
    crit: hostile
    conf: 0.97
    for: [javascript, typescript]
    near_bytes: 2048
    all:
      - id: objectives/anti-static/pack/detect::dean-edwards
      - id: micro-behaviors/communications/http/client/resource::js-remote-src-assignment
  - id: via-middlebox-redirect
    desc: HTTP 307 redirect through middlebox
    crit: suspicious
    conf: 0.97
    all:
      - id: micro-behaviors/communications/http/response::http-307-temporary-redirect-status
      - id: micro-behaviors/communications/http/response::via-middlebox-response-header
      - id: micro-behaviors/communications/http/response::http-absolute-location-header
    near_bytes: 1024

  - id: crafted-reset-after-http-redirect
    desc: Sends TCP reset with HTTP redirect
    crit: hostile
    conf: 0.99
    attack: T1189,T1105,T1071.001
    for: [python]
    all:
      - id: via-middlebox-redirect
      - id: micro-behaviors/communications/socket/raw::scapy-crafted-packet-send
      - id: micro-behaviors/communications/socket/raw::scapy-tcp-reset-packet
    near_bytes: 4096

  - id: host-targeted-middlebox-redirect
    desc: Host- and User-Agent-gated HTTP redirect injection
    crit: hostile
    conf: 0.99
    attack: T1189,T1105,T1071.001
    for: [python]
    all:
      - id: micro-behaviors/communications/http/message::host-user-agent-header-pair
      - id: via-middlebox-redirect
    near_bytes: 4096

  - id: middlebox-redirect-with-reset
    desc: Middlebox HTTP redirect injection also resets the server connection
    crit: hostile
    conf: 0.99
    attack: T1189,T1105,T1071.001
    for: [python]
    all:
      - id: micro-behaviors/communications/http/message::host-user-agent-header-pair
      - id: via-middlebox-redirect
      - id: micro-behaviors/communications/socket/raw::scapy-crafted-packet-send
      - id: micro-behaviors/communications/socket/raw::scapy-tcp-reset-packet
    near_bytes: 4096

  - id: stat-js-clock-web-injected-loader
    desc: Stat.js clock web injected loader
    crit: hostile
    conf: 0.97
    all:
      - id: stat-js-clock-include
      - id: travelfornamewalking-loader

  # Obfuscated browser injectors hide createElement/src/appendChild behind
  # computed properties. The atoms stay neutral; these composites require an
  # actual external HTTP(S) script source before inferring hostility. Same-
  # origin vendor assets are ordinary application resource loading.
  - id: obfuscated-remote-script-loader
    desc: Obfuscated remote script injection
    crit: hostile
    conf: 0.98
    for: [javascript, typescript]
    all:
      - id: micro-behaviors/process/create/load/remote-code::js-external-script-loader
      - id: micro-behaviors/ui/window/dom-access::computed-document-member-call
    any:
      - id: objectives/anti-static/obfuscation/obfuscator/js-obfuscator::push-shift-bracket-pattern
      - id: objectives/anti-static/obfuscation/obfuscator/js-obfuscator::cfg-flatten-state-list
      - id: objectives/anti-static/obfuscation/obfuscator/js-obfuscator::hex-name-mangling
    needs: 1
    near_bytes: 1800

  - id: host-targeted-obfuscated-script-loader
    desc: Host-targeted obfuscated script injection
    crit: hostile
    conf: 0.97
    for: [javascript, typescript]
    all:
      - id: micro-behaviors/communications/http/url/navigation::browser-location-bracket-member-read
    any:
      - id: obfuscated-remote-script-loader
      - id: obfuscated-chained-remote-script-loader

  # A poisoned trusted page commonly keeps the first-stage script remote and
  # only presents the social-engineering prompt to selected browsers.  The
  # delivery mechanism is the combination, not any brand, hostname, or
  # payload string.
  - id: browser-targeted-clickfix-loader
    desc: Browser-targeted remote script feeds a verification paste lure
    crit: hostile
    conf: 0.98
    attack: T1105,T1204.001,T1059.001
    for: [html]
    all:
      - id: micro-behaviors/process/deploy::external-script-element-load
      - id: micro-behaviors/communications/http/user-agent::navigator-useragent-conditional
      - id: objectives/execution/lure/clipboard/instruction::fake-captcha-winr-paste-instructions
  - id: timestamped-remote-script-injection
    desc: Cache-busted remote script injected into a page
    crit: suspicious
    conf: 0.96
    attack: T1105,T1059.001
    for: [javascript, typescript]
    all:
      - id: micro-behaviors/process/deploy::dynamic-script-element-load
      - id: micro-behaviors/communications/http/client/resource::unix-timestamp-src-cache-bust
      - id: micro-behaviors/data/collection/dom::insert-before-call
    near_bytes: 2048
  - id: browser-gated-timestamped-loader
    desc: Browser-targeted cache-busted remote script injection
    crit: suspicious
    conf: 0.97
    attack: T1105,T1189
    for: [javascript, typescript]
    all:
      - id: timestamped-remote-script-injection
      - id: micro-behaviors/communications/http/user-agent::navigator-useragent-conditional
    near_bytes: 2048
  - id: obfuscated-chained-remote-script-loader
    desc: Obfuscated chained-document script injection
    crit: hostile
    conf: 0.98
    for: [javascript, typescript]
    all:
      - id: micro-behaviors/process/create/load/remote-code::js-computed-external-script-loader
      - id: micro-behaviors/ui/window/dom-access::computed-document-member-call
    any:
      - id: objectives/anti-static/obfuscation/obfuscator/js-obfuscator::push-shift-bracket-pattern
      - id: objectives/anti-static/obfuscation/obfuscator/js-obfuscator::cfg-flatten-state-list
      - id: objectives/anti-static/obfuscation/obfuscator/js-obfuscator::hex-name-mangling
    needs: 1

  - id: repeated-concealed-iframe-write-injection
    desc: Remote iframe written into page at multiple sites
    crit: hostile
    conf: 0.95
    attack: T1189,T1105
    for: [html]
    near_bytes: 800
    all:
      - id: repeated-concealed-iframe-write
      - id: micro-behaviors/communications/http/client/resource::external-iframe-element-load
  # Miner loader behind a blocklist-evasive host: the page pulls its script
  # from a root-dotted domain while an AuthedMine constructor and throttle
  # option name the payload. The dotted host alone is only presentation
  # evasion; the miner API legs convict the use.
  - id: dotted-host-miner-loader-injection
    desc: Root-dotted host delivers a throttled miner bootstrap
    crit: hostile
    conf: 0.97
    attack: T1496,T1105
    for: [html]
    all:
      - id: micro-behaviors/communications/http/client/resource::dotted-root-script-src
      - id: objectives/impact/cryptojacking/miner/signatures::authedmine-anonymous-construct
      - id: objectives/impact/cryptojacking/miner/signatures::miner-throttle-option
  # Stored attribute breakout: a script element smuggled inside an alt/title
  # value breaks out with closers and loads a remote script. The smuggled
  # tag plus the external load name the injection; hand-written markup
  # never nests elements inside attribute values.
  - id: attribute-breakout-script-injection
    desc: Attribute-smuggled script loads remotely
    crit: hostile
    conf: 0.97
    attack: T1189,T1105
    for: [html]
    all:
      - id: micro-behaviors/communications/http/client/resource::attribute-value-script-tag
      - id: micro-behaviors/process/deploy::external-script-element-load
  # External CoinHive loader delivers started browser miner: the page loads
  # CoinHive from an external script source beside the Anonymous constructor
  # and start call. Loading and starting the miner delivers in-browser
  # cryptojacking via external script injection.
  - id: coinhive-script-miner-loader-injection
    desc: External script delivers started CoinHive browser miner
    crit: hostile
    conf: 0.97
    attack: T1496,T1105
    for: [html]
    near_bytes: 4096
    all:
      - id: micro-behaviors/process/deploy::external-script-element-load
      - id: objectives/impact/cryptojacking/miner/signatures::coinhive-library-url
      - id: objectives/impact/cryptojacking/miner/signatures::coinhive-miner-construct
      - id: objectives/impact/cryptojacking/miner/signatures::miner-start-invocation
  # Encoded twin of the loader above: the miner bootstrap arrives
  # percent-encoded inside document.write(unescape(...)) rather than as a
  # named library URL, so the library leg cannot see it. Decoding markup
  # that constructs and starts a CoinHive miner is the same delivery act
  # through concealment (T1027) rather than a remote script element.
  - id: coinhive-unescape-loader-injection
    desc: Encoded document write injects started CoinHive miner
    crit: hostile
    conf: 0.96
    attack: T1496,T1105,T1027
    for: [html]
    near_bytes: 4096
    all:
      - id: micro-behaviors/ui/window/insert-html::browser-document-write-unescape
      - id: objectives/impact/cryptojacking/miner/signatures::coinhive-miner-construct
      - id: objectives/impact/cryptojacking/miner/signatures::miner-start-invocation
  # Mass-repeated loader tags: the injector splices the same remote script
  # element hundreds of times into page content, so consecutive script tags
  # pile up far beyond any authored head block. Either leg alone is
  # ordinary (sites load remote scripts); the massed repetition beside the
  # remote loads is the injection footprint.
  - id: repeated-remote-script-injection
    desc: Mass-repeated remote script tags injected in page
    crit: hostile
    conf: 0.96
    attack: T1189,T1105
    for: [html]
    all:
      - id: micro-behaviors/process/deploy::massed-remote-script-tags
      - id: micro-behaviors/process/deploy::external-script-element-load
      - id: micro-behaviors/communications/http/client/resource::remote-script-element-source
    unless:
      - id: well-known/app/media/pinterest::pinterest-web-context
      - id: well-known/tool/development/vcs/github-web::github-web-context
