# Mass web-injection loaders that append a colon-delimited hex payload to a
# decoy page and decode it character-wise in the browser: the blob is split
# on colons, each token prefixed for eval, and the resulting string is run
# through an eval alias (typically revealing a hidden iframe). No legitimate
# page carries a kilobyte-scale colon-hex blob beside a character-wise
# fromCharCode(eval()) decoder; the three facets below each bind a pair of
# the loader's literal mechanics.
defaults:
  platforms: [windows, unix]
  for: [html]
  attack: T1027,T1105

traits:
  - id: offset-hex-http-token
    desc: Offset-hex payload contains an HTTP token
    crit: component
    conf: 0.9
    if:
      type: text
      substr: '74_80_80_7c_46_3b_3b'
      exclude_html_comments: true

  - id: offset-hex-script-token
    desc: Offset-hex payload contains a script token
    crit: component
    conf: 0.9
    if:
      type: text
      substr: '7f_6f_7e_75_7c_80'
      exclude_html_comments: true

  - id: offset-hex-element-token
    desc: Offset-hex payload contains an element method
    crit: component
    conf: 0.9
    if:
      type: text
      substr: '6f_7e_71_6d_80_71_51_78_71_79_71_7a_80'
      exclude_html_comments: true

  - id: colon-hex-payload-blob
    desc: Colon-delimited hex payload blob
    crit: suspicious
    conf: 0.92
    if:
      type: text
      regex: '(:[0-9a-f]{1,3}){40,}'
      exclude_html_comments: true

  - id: fromcharcode-eval-decode-loop
    desc: Character decoder feeds eval in a loop
    crit: suspicious
    conf: 0.93
    if:
      type: text
      substr: 'fromCharCode(eval('
      exclude_html_comments: true

  - id: eval-alias-call
    desc: Eval aliased for indirect invocation
    crit: suspicious
    conf: 0.9
    if:
      type: text
      # jQuery globalEval uses a comma declarator (`var b,c=eval`). A
      # statement alias has a non-comma boundary before the name.
      regex: '(^|[^,\w])[A-Za-z_$][A-Za-z0-9_$]{0,40}\s*=\s*eval\s*;'
      exclude_html_comments: true

composite_rules:
  - id: offset-hex-evaluated-remote-script-loader
    desc: Offset-hex JavaScript decodes and evaluates a remote script loader
    crit: hostile
    conf: 0.96
    attack: T1027,T1059.007,T1105,T1189
    mbc: B0032
    near_bytes: 6000
    all:
      - id: micro-behaviors/data/decode/custom::js-fromcharcode-hex-offset-rebuild
      - id: micro-behaviors/process/interpreter/eval/indirect::eval-assigned-to-variable
      - id: offset-hex-http-token
      - id: offset-hex-script-token
      - id: offset-hex-element-token

  - id: hex-offset-script-decoder
    desc: Colon-hex payload decoded character-wise by eval
    crit: hostile
    conf: 0.96
    near_bytes: 6000
    all:
      - id: colon-hex-payload-blob
      - id: fromcharcode-eval-decode-loop

  - id: decoded-payload-eval-execution
    desc: Decoded payload executed through eval alias
    crit: hostile
    conf: 0.95
    near_bytes: 400
    all:
      - id: fromcharcode-eval-decode-loop
      - id: eval-alias-call
