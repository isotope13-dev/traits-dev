# Mass site-compromise kits prepend their payload to every template file, so
# the injected <script> lands above the page's own <!DOCTYPE>. Authors never
# put markup there (it forces quirks mode), which makes a script block ahead
# of the doctype a reliable injection mark regardless of what it loads.
defaults:
  platforms: [windows, unix]
  for: [html]
  attack: T1189
traits:
  - id: script-block-before-doctype
    desc: Script block injected above page DOCTYPE
    crit: suspicious
    conf: 0.85
    if:
      type: text
      regex: '(?is)\A\s*<script\b[^\x00]{0,900}?</script>\s*<!DOCTYPE\s+html'
    unless:
      # Uncompiled template source, not a served page; the server block is
      # removed at render time.
      - id: metadata/file/format/markup::stx-server-script-template
      - type: text
        substr: '<script server>'

  - id: element-nested-doctype-declaration
    desc: Element contains nested DOCTYPE declaration
    crit: suspicious
    conf: 0.95
    if:
      type: text
      regex: '(?is)<(td|div|table|body|span)\b[^>]{0,120}>\s*<!DOCTYPE\s+html'

composite_rules:
  - id: miner-library-injected-above-doctype
    desc: Miner library injected ahead of page markup
    crit: hostile
    conf: 0.95
    attack: T1189,T1496
    all:
      - id: script-block-before-doctype
      - id: micro-behaviors/communications/blockchain/mining::coinhive-script-reference

  - id: element-nested-document-miner-injection
    desc: Element-nested document injects web miner
    crit: hostile
    conf: 0.98
    attack: T1189,T1496
    all:
      - id: element-nested-doctype-declaration
      - id: objectives/impact/cryptojacking/miner/runtime::coinimp-inline-autostart
