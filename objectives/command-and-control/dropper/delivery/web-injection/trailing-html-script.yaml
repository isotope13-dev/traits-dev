# A script tag placed after </html> is outside the document. Pairing
# that tag with a remote src, or with a punycode host over cleartext
# HTTP, is how a compromised page pulls in a second-stage script.
defaults:
  platforms: [windows, unix]
  for: [html]
  attack: T1105
traits:
  - id: script-src-after-html-close
    desc: Script source follows the closing html tag
    crit: notable
    conf: 0.92
    if:
      type: text
      regex: '(?i)</html>\s{0,80}<script\b[^>]{0,40}\bsrc\s*=\s*["'']https?://'
      exclude_html_comments: true
  - id: punycode-script-src
    desc: Script source uses a punycode host
    crit: notable
    conf: 0.93
    if:
      type: text
      regex: '(?i)<script\b[^>]{0,40}\bsrc\s*=\s*["'']https?://[^"'']{0,40}xn--'
      exclude_html_comments: true
composite_rules:
  - id: trailing-html-remote-script
    desc: Page loads a script after closing html
    crit: hostile
    conf: 0.96
    near_bytes: 400
    unless:
      # Payment/SDK vendor example pages ship the trailing integration block
      # as the documented layout (ECPay WebJS samples and friends): authored
      # vendor scripts, not injected content.
      - id: metadata/file/naming::example-directory-component
    all:
      - id: script-src-after-html-close
      - id: micro-behaviors/communications/http/client/resource::remote-script-element-source
  - id: punycode-plaintext-script-src
    desc: Cleartext script loads a punycode host
    crit: hostile
    conf: 0.96
    near_bytes: 200
    all:
      - id: punycode-script-src
      - id: micro-behaviors/communications/http/client/resource::plaintext-http-script-element-source
