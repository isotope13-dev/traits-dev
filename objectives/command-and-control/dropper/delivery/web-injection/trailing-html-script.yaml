# Punycode script hosts over cleartext HTTP, and hidden remote frames appended
# after the document, can deliver content from infrastructure disguised by
# an internationalized hostname or kept out of the visible page.
defaults:
  platforms: [windows, unix]
  for: [html]
  attack: T1105
traits:
  - id: punycode-script-src
    desc: Script source uses a punycode host
    crit: notable
    conf: 0.93
    if:
      type: text
      regex: '(?i)<script\b[^>]{0,40}\bsrc\s*=\s*["'']https?://[^"'']{0,40}xn--'
      exclude_html_comments: true
  # Same outside-the-document placement as the script atom, for a frame.
  # A remote iframe after </html> is not a layout choice inside the page.
  - id: iframe-src-after-html-close
    desc: Iframe source follows closing html
    crit: notable
    conf: 0.92
    if:
      type: text
      regex: '(?i)</html>\s{0,80}<iframe\b[^>]{0,40}\bsrc\s*=\s*["'']https?://'
      exclude_html_comments: true
composite_rules:
  - id: punycode-plaintext-script-src
    desc: Cleartext script loads a punycode host
    crit: hostile
    conf: 0.96
    near_bytes: 200
    all:
      - id: punycode-script-src
      - id: micro-behaviors/communications/http/client/resource::plaintext-http-script-element-source
  # The frame sits outside the document and is visibility:hidden, so the
  # visitor never sees the remote document the browser still loads.
  - id: trailing-html-hidden-iframe
    desc: Hidden iframe follows closing html
    crit: hostile
    conf: 0.96
    near_bytes: 400
    unless:
      - id: metadata/file/naming::example-directory-component
    all:
      - id: iframe-src-after-html-close
      - id: micro-behaviors/ui/window/style::css-visibility-hidden
