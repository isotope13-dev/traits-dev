defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
composite_rules:
  - id: emoji-frontend-cookie-gated-data-script
    desc: Emoji frontend carries a clock-gated encoded script
    crit: hostile
    conf: 0.97
    scope: file
    all:
      - id: well-known/lib/web/wordpress/emoji::frontend-settings
      - id: micro-behaviors/ui/window/insert-html::clock-gated-nested-remote-script-write
