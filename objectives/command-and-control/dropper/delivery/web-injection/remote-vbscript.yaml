# A script tag that both declares VBScript and points src at a remote
# URL pulls that script into IE or mshta. CDN and app bundles use
# JavaScript, so this pair is the remote VBScript loader.
defaults:
  platforms: [windows, unix]
  for: [html]
  attack: T1105
composite_rules:
  - id: remote-vbscript-script-src
    desc: Page loads a remote VBScript source
    crit: hostile
    conf: 0.96
    near_bytes: 400
    all:
      - id: micro-behaviors/process/interpreter/scripting::html-vbscript-block
      - id: micro-behaviors/communications/http/client/resource::remote-script-element-source
    unless:
      - id: metadata/path::test-directory-component
      - id: metadata/path::example-directory-component
