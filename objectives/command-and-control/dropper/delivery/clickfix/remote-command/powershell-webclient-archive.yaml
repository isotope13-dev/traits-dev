# ClickFix follow-on PowerShell stages that WebClient-download a ZIP (or other
# archive), Expand-Archive under a user profile path, and Start-Process a nested
# executable. Distinct from clipboard IEX cradles and from direct .exe URL drops.
defaults:
  platforms: [windows]
  for: [powershell]
  attack: T1105,T1204.002
  mbc: B0030

traits:
  - id: clickfix-delivery-url-path
    desc: HTTP URL uses ClickFix delivery path segment
    crit: suspicious
    conf: 0.97
    for: [powershell, batch, javascript, html, scripts]
    if:
      type: literal
      regex: '(?i)https?://[^''"\s]{1,240}/clickfix/'

composite_rules:
  - id: clickfix-powershell-webclient-archive-launcher
    desc: ClickFix WebClient archive stager launches nested EXE
    crit: hostile
    conf: 0.99
    all:
      - id: clickfix-delivery-url-path
      - id: micro-behaviors/communications/http/download/webclient::webclient-downloadfile-call
      - id: micro-behaviors/data/archive/extract/capability::powershell-expand-archive-command
      - id: micro-behaviors/process/create/start-process::start-process-call
    near_bytes: 8192
