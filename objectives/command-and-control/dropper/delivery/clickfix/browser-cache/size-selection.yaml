# Direct cache-file copying complements the findstr/certutil carving variant.
# No campaign-specific size, filename, browser vendor or endpoint is required.
defaults:
  for: [batch, html, javascript, powershell]
  platforms: [windows]
composite_rules:
  - id: size-selected-profile-script-loader
    desc: Browser profile size selection accompanies script copying and execution
    crit: hostile
    conf: 0.98
    attack: T1059.003,T1059.005,T1105
    all:
      - id: micro-behaviors/fs/path/application/browser::browser-localappdata-userdata-root
      - id: micro-behaviors/fs/enumerate/directory::batch-recursive-for-loop
      - id: micro-behaviors/fs/file/attributes::batch-file-size-equality
      - id: micro-behaviors/fs/file/copy::batch-for-file-to-temp-script
    any:
      - id: micro-behaviors/process/create/shell/script-host::temp-script-host-path
      - id: micro-behaviors/process/create/shell/script-host::tmp-script-host-command
    near_bytes: 512
  - id: clipboard-size-selected-profile-loader
    desc: Clipboard write accompanies a size-selected browser-profile script loader
    crit: hostile
    conf: 0.99
    for: [html, javascript]
    attack: T1204.002,T1059.003,T1059.005
    all:
      - id: size-selected-profile-script-loader
      - id: micro-behaviors/os/clipboard/write::browser-clipboard-write
    near_bytes: 2048
