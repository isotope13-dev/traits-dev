# Direct cache-entry reuse, distinct from marker carving and Certutil decoding.
# File size and output basename deliberately remain unconstrained.
defaults:
  for: [batch, html, javascript, powershell]
  platforms: [windows]
  attack: T1059.003,T1059.005,T1036
composite_rules:
  - id: browser-cache-entry-script-launch
    desc: Browser profile entry copied to a temporary script and launched
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/fs/enumerate/directory::batch-recursive-for-loop
      - id: micro-behaviors/fs/path/application/browser::firefox-profile-directory
      - id: micro-behaviors/fs/write/file/copy::batch-loop-copy-to-script
    any:
      - id: micro-behaviors/process/create/shell/script-host::localappdata-temp-script-host-path
      - id: micro-behaviors/process/create/shell/script-host::temp-script-host-path
    near_bytes: 512
  - id: browser-cache-size-selected-script-launch
    desc: Size-selected browser cache entry copied to a script and launched
    crit: hostile
    conf: 0.99
    all:
      - id: browser-cache-entry-script-launch
      - id: micro-behaviors/fs/file/attributes::batch-file-size-equality
    near_bytes: 512
