# The MSHTA command behind a ClickFix / fake-verification lure: the victim pastes
# an mshta https://... command to "verify", which downloads and launches a
# remote payload, followed by a verification approval message ("You're Approved
# to Continue") to reassure the victim while the payload runs in the background.
defaults:
  platforms: [windows]
  for: [text, batch, powershell]
  attack: T1204.004,T1218.005,T1105
  mbc: B0030,E1218.005

composite_rules:
  - id: mshta-verification-theater-command
    desc: Runs remote MSHTA behind verification approval message
    crit: hostile
    conf: 0.98
    all:
      - id: metadata/lang/source/syntax/command/invocation::mshta-remote-url-command
      - id: micro-behaviors/ui/keywords::approved-to-continue-wording
