defaults:
  platforms: [windows, unix]
  for: [javascript]
traits:
  - id: createelement-fragment-teel
    desc: JavaScript createElement teEl fragment
    crit: component
    conf: 0.86
    if:
      type: string_literal
      exact: teEl
composite_rules:
  # Encoded stage URL built either as literal fromCharCode args or a XOR loop
  - id: obfuscated-cloudfront-dom-script-loader
    desc: Obfuscated CloudFront DOM script loader
    crit: hostile
    conf: 0.96
    attack: T1105
    all:
      - id: micro-behaviors/communications/http/url/cdn::cloudfront-asset-url
      - id: createelement-fragment-teel
      - id: micro-behaviors/process/create/load/remote-code::js-dom-script-literal
      - id: metadata/lang/source/literal/value::src-string-literal
      - id: "metadata/lang/source/literal/value::append-child-literal"
      - id: micro-behaviors/crypto/symmetric/xor/loop::js-xor-charcode-assignment
  - id: targeted-encoded-script-html-stage
    desc: Targeted HTML page stages encoded script element
    crit: hostile
    conf: 0.96
    attack: T1105,T1027
    for: [html]
    all:
      - id: micro-behaviors/ui/controls/input::email-assigned-variable
      - id: micro-behaviors/communications/http/client/resource::base64-encoded-script-element

  - id: svg-fromcharcode-script-dropper
    desc: SVG onload injects character-coded remote script
    crit: hostile
    conf: 0.99
    attack: T1105,T1027,T1059.007
    mbc: B0024
    for: [html, text]
    all:
      - id: micro-behaviors/ui/window/event::html-svg-onload-handler
      - id: micro-behaviors/data/collection/dom::script-create-near-src-assignment
      - id: micro-behaviors/data/string/conversion::fromcharcode-numeric-sequence
    near_bytes: 1024

  - id: targeted-phishing-script-dropper
    desc: Dropper stages targeted credential phishing payload
    crit: hostile
    conf: 0.99
    attack: T1566.002,T1056.002,T1105
    mbc: B0030
    for: [html, text]
    all:
      - id: micro-behaviors/ui/window/event::html-svg-onload-handler
      - id: micro-behaviors/ui/controls/input::html-hidden-input-tag
      - id: micro-behaviors/data/string/conversion::fromcharcode-numeric-sequence
    near_bytes: 1024
