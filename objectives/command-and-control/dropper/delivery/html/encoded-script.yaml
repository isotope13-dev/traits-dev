defaults:
  platforms: [windows, unix]
  for: [javascript]
traits:
  - id: dom-script-src-charcode-assign
    desc: JavaScript assigns encoded URL to script src
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '\.src\s*=\s*String\.fromCharCode\s*\('
  - id: dom-head-charcode-target
    desc: Encoded document head string
    crit: notable
    conf: 0.88
    if:
      type: text
      regex: 'fromCharCode\s*\(104,101,97,100\)'
  - id: createelement-fragment-teel
    desc: JavaScript createElement teEl fragment
    crit: component
    conf: 0.86
    if:
      type: string_literal
      exact: teEl
  - id: dom-script-text-body-assign
    desc: Assigns script-like text into a DOM element
    crit: component
    conf: 0.8
    if:
      type: text
      regex: '(?i)createElement\s*\(\s*[''\"]script[''\"]\).{0,200}(textContent|innerHTML)\s*='
composite_rules:
  # Encoded stage URL built either as literal fromCharCode args or a XOR loop
  - id: encoded-stage-url-construction
    desc: Encoded URL reconstruction near DOM sink
    crit: suspicious
    conf: 0.9
    near_bytes: 2048
    unless:
      - id: well-known/lib/format/pdfjs/
      - id: well-known/app/productivity/web-to-epub::wte-extension-context
      - id: metadata/build/
    all:
      - id: dom-script-content-sink
      - id: micro-behaviors/data/collection/dom::document-create-element
    any:
      - id: micro-behaviors/data/encode/char-code::fromcharcode-https-prefix
      - id: micro-behaviors/data/encode/char-code::fromcharcode-xor-rebuild
  # Remote script body landed via src binding or a text/innerHTML assignment
  - id: dom-script-content-sink
    desc: DOM script content sink
    crit: component
    conf: 0.85
    any:
      - id: micro-behaviors/communications/http/client/resource::elem-src-member-access
      - id: dom-script-src-charcode-assign
      - id: dom-script-text-body-assign
  - id: encoded-remote-dom-script-loader
    desc: Encoded remote DOM script loader
    crit: hostile
    conf: 0.95
    near_bytes: 1024
    all:
      - id: micro-behaviors/data/collection/dom::document-create-element
      - id: micro-behaviors/data/decode/charset::fromcharcode-call
      - id: encoded-stage-url-construction
      - id: dom-script-content-sink
      - id: micro-behaviors/data/collection/dom::append-child-reference
    attack: T1105
    unless:
      - id: metadata/build/
      - id: well-known/app/productivity/web-to-epub::wte-extension-context
      - id: well-known/tool/sysadmin/alpine-packages/package::alpine-langfuse-package
      - id: well-known/tool/sysadmin/alpine-packages/binary::alpine-langfuse-next-app-path

  # Build-context suppression above protects ordinary generated assets from
  # broad URL and DOM traits. An encoded remote URL assigned to a newly-created
  # script and appended into the document remains an active loader in a bundle,
  # so this rule carries no build-context leg or exclusion: the legs below are
  # the evidence wherever they occur. (A `metadata/build/` leg here only added
  # build-artifact file names, which the collector, not the attacker, chooses.)
  - id: bundled-encoded-remote-dom-script-loader
    desc: JavaScript injects an encoded remote script
    crit: hostile
    conf: 0.96
    attack: T1105,T1027
    all:
      - id: micro-behaviors/data/collection/dom::document-create-element
      - id: micro-behaviors/communications/url/encoded::javascript-charcode-http-scheme
      - id: dom-script-content-sink
      - id: micro-behaviors/data/collection/dom::append-child-reference

  - id: charcode-https-dom-tag
    desc: fromCharCode HTTPS URL plus DOM tag
    crit: hostile
    conf: 0.95
    attack: T1105,T1027
    all:
      - id: micro-behaviors/data/encode/char-code::fromcharcode-https-prefix
      - id: objectives/anti-static/obfuscation/string/reconstruct::charcode-built-dom-tag-name
    unless:
      - id: metadata/build/
  - id: charcode-https-stage-url
    desc: fromCharCode HTTPS URL near a DOM sink
    crit: hostile
    conf: 0.95
    attack: T1105,T1027
    all:
      - id: micro-behaviors/data/encode/char-code::fromcharcode-https-prefix
      - id: encoded-stage-url-construction
    unless:
      - id: metadata/build/
  - id: charcode-dom-tag-stage-url
    desc: CharCode DOM tag as stage URL
    crit: hostile
    conf: 0.94
    attack: T1105,T1027
    all:
      - id: objectives/anti-static/obfuscation/string/reconstruct::charcode-built-dom-tag-name
      - id: encoded-stage-url-construction
    unless:
      - id: metadata/build/
  - id: encoded-dom-head-script-injection
    desc: Encoded DOM head script injection
    crit: hostile
    conf: 0.94
    all:
      - id: micro-behaviors/data/decode/charset::fromcharcode-call
      - id: dom-script-src-charcode-assign
      - id: dom-head-charcode-target
      - id: micro-behaviors/data/collection/dom::append-child-reference
    attack: T1105
    unless:
      - id: metadata/build/
      - id: well-known/app/productivity/web-to-epub::wte-extension-context
  - id: obfuscated-cloudfront-dom-script-loader
    desc: Obfuscated CloudFront DOM script loader
    crit: hostile
    conf: 0.96
    attack: T1105
    all:
      - id: micro-behaviors/communications/http/url/cdn::cloudfront-asset-url
      - id: createelement-fragment-teel
      - id: micro-behaviors/process/create/load/remote-code::js-dom-script-literal
      - id: micro-behaviors/process/create/load/remote-code::js-dom-script-src-literal
      - id: micro-behaviors/process/create/load/remote-code::js-dom-appendchild-literal
      - id: micro-behaviors/crypto/symmetric/xor/loop::js-xor-charcode-assignment
