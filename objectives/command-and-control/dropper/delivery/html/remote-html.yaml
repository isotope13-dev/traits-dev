defaults:
  crit: hostile
  conf: 0.99
  platforms: [windows, unix]
  for: [html, javascript]
  attack: T1105

composite_rules:
  # Encoded HTTP/response/write names plus a document call consuming a
  # decoded property establish the staging shape, rather than convicting
  # solely on obfuscation or a hidden HTA window.
  - id: hidden-hta-charcode-remote-html-stage
    desc: Hidden HTA stages char-code remote HTML
    platforms: [windows]
    for: [html]
    conf: 0.97
    attack: T1105,T1218.005,T1027
    all:
      - id: objectives/anti-static/obfuscation/syntax::hta-charcode-activex-profile
      - id: micro-behaviors/ui/window/control::hta-taskbar-hidden
      - id: micro-behaviors/communications/http/client/xmlhttp::charcode-xmlhttp-name
      - id: micro-behaviors/communications/http/client/response-body::charcode-response-text-name
      - id: micro-behaviors/ui/window/insert-html::charcode-write-name
      - id: micro-behaviors/ui/window/dom-access::computed-document-call-computed-input

  - id: mutable-branch-remote-html-execution
    for: [javascript]
    desc: Auto-executes remote scripts from mutable branch
    attack: T1105,T1059.007
    all:
      - id: micro-behaviors/process/create/load/remote-code::remote-html-script-rehydration
      - id: micro-behaviors/communications/http/url/path::mutable-raw-branch-path
      - id: micro-behaviors/data/control-flow/module-exec::js-async-iife-import-hook
    near_bytes: 4096

  - id: decoy-mirrored-remote-html-stage
    desc: Decoy page stages remote HTML through redundant CDN mirrors
    all:
      - id: objectives/evasion/decoy/lure::explicit-decoy-ui-comment
      - id: micro-behaviors/communications/http/url/cdn::jsdelivr-mirror-host-set
      - id: micro-behaviors/communications/http/client/response-body::fetch-html-document-write

  # A page whose navigation replaces the location with a remote HTA hands
  # execution to mshta when the target opens: the replace (no history entry)
  # plus the external .hta target is the redirector half of HTA delivery.
  # Ordinary links to local .hta admin tools lack the external navigation.
  - id: hta-redirector-remote-payload
    desc: Redirector navigates to a remote HTA
    attack: T1105,T1218.005
    all:
      - id: micro-behaviors/ui/window/navigation::browser-location-replace
      - id: micro-behaviors/ui/window/navigation::browser-external-redirect
      - id: micro-behaviors/fs/path/extension::remote-hta-url

  # The session tag makes the redirect a per-victim delivery URL: the gate
  # mints `?sid=<uuid>` per visitor (bot replays get a fresh tag or none),
  # so the location replacement is no longer a static link.
  - id: session-tracked-hta-redirect
    desc: Session-tracked redirect fetches remote HTA
    attack: T1105,T1218.005
    all:
      - id: micro-behaviors/ui/window/navigation::browser-external-redirect
      - id: micro-behaviors/fs/path/extension::remote-hta-url
      - id: micro-behaviors/communications/http/url/browser-param::session-id-query-param

  # Non-blocking loader repetition: the massed script tags carry async, so
  # the injected loaders never stall the page render. Async remote loads
  # alone are ordinary performance practice; massed repetition of
  # non-blocking remote loads is injector staging.
  - id: massed-async-script-stage
    desc: Massed async remote scripts staged in page
    attack: T1189,T1105
    for: [html]
    all:
      - id: micro-behaviors/process/deploy::massed-remote-script-tags
      - id: micro-behaviors/communications/http/client/resource::remote-script-element-source
      - id: micro-behaviors/process/create/load/script::async-after-src-script-element
    unless:
      - id: well-known/app/media/pinterest::pinterest-web-context
