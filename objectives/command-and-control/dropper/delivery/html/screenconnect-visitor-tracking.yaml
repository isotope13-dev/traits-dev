# The article's page clicks an existing download anchor on load, after sending
# visitor details to Telegram. Do not infer credential theft or a trojanized
# installer from that combination. No title, brand, tenant or ISP name gates it.
defaults:
  platforms: [windows, unix]
  for: [html]
composite_rules:
  - id: telegram-tracked-screenconnect-auto-download
    desc: Guest-client page pairs Telegram reporting with load-time download clues
    crit: suspicious
    conf: 0.95
    attack: T1105,T1219
    all:
      - id: well-known/dual-use/remote-admin/screenconnect::screenconnect-clientsetup-name-script
      - id: well-known/dual-use/remote-admin/screenconnect::screenconnect-access-guest-parameters
      - id: micro-behaviors/communications/messaging/send::telegram-bot-send-message
      - id: micro-behaviors/communications/http/download/browser::html-anchor-download-attribute
      - id: micro-behaviors/ui/window/event::window-onload-handler-assignment
      - id: micro-behaviors/ui/window/click::element-id-programmatic-click
