# HTA VBScript download-and-execute stagers. Unlike standalone .vbs
# droppers, these carriers arrive as HTML Applications: the VBScript block
# runs under mshta with the same WSH surface, but every classic VBS-only
# composite misses them on file type alone. The legs below are all
# html-capable: an HTTP response read, a writable text-file stage, a shell
# launch primitive, and dynamic evaluation of the staged bytes. Each is
# ordinary alone (updaters read responses, installers write files); a single
# HTA page doing all four at once is a download-and-execute chain with no
# benign producer.
defaults:
  platforms: [windows]
  for: [html]
  attack: T1105,T1059.005
  mbc: B0023

composite_rules:
  - id: hta-response-stage-write-execute
    desc: HTA stages an HTTP response to disk and executes it
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/communications/http/client/response-body::javascript-response-body
      - id: micro-behaviors/fs/write/content::fso-text-file-write-api
      - id: micro-behaviors/process/create/shellexec::shellexecute-method-call
      - id: micro-behaviors/process/interpreter/eval/direct::vbs-execute-statement
