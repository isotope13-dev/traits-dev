# A web page that builds a password-protected ZIP in the browser and hands it
# to the user as a download.
#
# 2026-09 Colombian judicial-lure chain, stage 2 (a fake Fiscalia page
# smuggled inside an SVG email attachment): the page implements ZipCrypto,
# writes the local/central headers itself through a DataView with a
# randomised timestamp, wraps a .wsf named after a court filing, and saves it
# through a Blob link while showing the password on screen. The archive never
# crosses the mail or web gateway, and when it lands on disk it is encrypted,
# so neither can scan the script inside. A page that only lets users download
# a file does not need to encrypt it; a zip library ships the cipher but not
# the forced download of an archive it just assembled.
defaults:
  platforms: [windows, unix]
  for: [html, svg]
  attack: T1027.006,T1027.013,T1204.002
  mbc: F0007
composite_rules:
  - id: page-builds-encrypted-zip-download
    desc: Page builds a password-protected ZIP to download
    crit: hostile
    conf: 0.92
    all:
      - id: micro-behaviors/data/archive/zip::zipcrypto-key-schedule
      - id: micro-behaviors/data/archive/create/zip::dataview-zip-local-header-write
    any:
      - id: micro-behaviors/ui/window/dom/tree::dom-blob-download-link
      - id: micro-behaviors/communications/http/download/handler::browser-forced-download
