# HTML pages that funnel visitors to an off-origin file host for a native
# program download, often paired with injected CDN scripts. Legitimate vendor
# download pages link to their own domain or a known CDN mirror they control.
defaults:
  platforms: [windows, unix]
  for: [html]
  attack: T1189,T1204.002,T1105

traits:
  - id: roblox-executor-page-title
    desc: Title advertises Roblox executor download
    crit: suspicious
    conf: 0.92
    if:
      type: text
      case_insensitive: true
      regex: '(?i)<title>[^<]{0,64}executor[^<]{0,64}download'

  - id: primary-mirror-near-external-href
    desc: Primary mirror near external HTTPS href
    crit: notable
    conf: 0.9
    if:
      type: text
      case_insensitive: true
      regex: '(?i)primary\s+mirror[\s\S]{0,450}href="https://'

  - id: cloudfront-query-param-script-src
    desc: Script src is tracked CloudFront URL
    crit: notable
    conf: 0.92
    if:
      type: text
      case_insensitive: true
      regex: '(?i)<script[^>]{0,120}src\s*=\s*["'']?//[^"''>\s]{0,80}cloudfront\.net/\?[^"''>\s]{1,80}["'']'

  - id: cracked-product-download-title
    desc: Title advertises cracked software download
    crit: suspicious
    conf: 0.93
    if:
      type: text
      case_insensitive: true
      regex: '<title>[^<]{0,80}(crack|keygen)[^<]{0,80}download'

  - id: remote-script-crack-download-button
    desc: Remote script precedes a crack download button
    crit: suspicious
    conf: 0.95
    if:
      type: text
      case_insensitive: true
      regex: 'src=.{1,200}</script>.{0,80}<button.{0,80}>download crack'

composite_rules:
  - id: tracked-cloudfront-remote-script-page
    desc: Tracked CloudFront remote script in page
    crit: hostile
    conf: 0.94
    attack: T1189,T1105
    all:
      - id: cloudfront-query-param-script-src
      - id: micro-behaviors/communications/http/client/resource::external-script-element-load
    unless:
      - id: metadata/file/format/markup::hta-application-element

  - id: roblox-executor-offsite-download-delivery
    desc: Roblox executor lure with off-site download
    crit: hostile
    conf: 0.96
    attack: T1189,T1204.002,T1036
    all:
      - id: roblox-executor-page-title
      - id: primary-mirror-near-external-href

  - id: scripted-cracked-software-download-lure
    desc: Cracked-software page delegates its download button to a remote script
    crit: hostile
    conf: 0.97
    all:
      - id: cracked-product-download-title
      - id: remote-script-crack-download-button
      - id: micro-behaviors/communications/http/client/resource::external-script-element-load
