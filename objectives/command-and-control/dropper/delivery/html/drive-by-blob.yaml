# HTML drive-by-download via fetch + Blob + URL.createObjectURL +
# programmatic <a download> click chain. Each fragment is a generic
# browser API used by legitimate file-download UIs; only the chain
# (multiple fragments in proximity) supplies delivery context;
# filename extensions alone remain neutral capabilities. Sibling
# script-file-download.yaml covers .wsf/.cmd-specific cases; this
# file extends coverage to general document/archive/PE filenames.
defaults:
  platforms: [windows, unix]
  for: [html, javascript]
  attack: T1204.002
  mbc: F0007
traits:
- id: drive-by-download-attribute-appref
  desc: a.download attribute set to appref-ms
  crit: suspicious
  conf: 0.96
  if:
    type: text
    regex: '\.download\s*=\s*[''"][^''"]{1,80}\.appref-ms[''"]'
    case_insensitive: true
- id: drive-by-download-attribute-doc
  desc: Document download filename marker
  # A user-visible PDF/DOC download is not a drive-by dropper by itself.  The
  # blob/anchor/click composite below supplies the delivery context.
  crit: notable
  conf: 0.85
  if:
    type: text
    regex: '\.download\s*=\s*[''"][^''"]{1,80}\.(pdf|docx?|xlsx?|pptx?)[''"]'
    case_insensitive: true
  unless:
    - id: metadata/package/agent-skill::agent-skill-directory-member
    - id: metadata/package/agent-skill::agent-skill-md-basename
    - id: metadata/package/documentation/source::readme-markdown-basename
    - id: "metadata/file/naming::readme-requirements-install-basename"
- id: drive-by-download-attribute-shortcut
  desc: a.download attribute set to shortcut
  crit: suspicious
  conf: 0.97
  if:
    type: text
    regex: '\.download\s*=\s*[''"][^''"]{1,80}\.lnk[''"]'
    case_insensitive: true
- id: drive-by-iso-blob-mime
  desc: Disk-image MIME marker in browser Blob
  # A MIME registry or file-extension table is not a delivery behavior. Keep
  # this as a component; the hostile rules require an actual Blob/download
  # chain around it.
  crit: notable
  conf: 0.96
  unless:
  - id: well-known/tool/development/vscode-extension/salesforce-vscode::salesforce-vscode-extension-context
  - id: well-known/tool/packaging/yarn::yarn-cli-bundle-marker
  - id: well-known/app/communication/slack::slack-app-context
  if:
    type: text
    regex: '(?is)new\s+Blob\s*\([\s\S]{0,700}application/(x-cd-image|x-iso9660-image)'
- id: drive-by-download-attribute-iso
  desc: Browser download filename ends in ISO
  crit: suspicious
  conf: 0.96
  if:
    type: text
    regex: (?i)\.download\s*=\s*["'][^"']{1,100}\.iso["']
  unless:
  - id: metadata/file/profile/markup::assessment-playbook-examples
- id: html-error-handler-mshta-stage
  desc: HTML error handler stages an mshta command
  crit: suspicious
  conf: 0.96
  attack: T1218.005,T1059.007
  if:
    type: text
    regex: '(?is)\bonerror\b[\s\S]{0,420}\bmshta(\.exe)?\b'
composite_rules:
- id: html-fetch-blob-download-chain
  for:
  - javascript
  desc: HTML fetches remote content into a programmatic download chain
  crit: suspicious
  conf: 0.9
  unless:
  - id: metadata/lang/scripted::dts-declaration-file
  - id: well-known/app/browser-extension/fireshot::native-install-context
  - id: metadata/file/profile/markup::assessment-playbook-examples
  all:
  - id: micro-behaviors/communications/http/download/browser::fetch-response-blob
  - id: micro-behaviors/ui/window/dom/create::dom-anchor-element-creation
  - id: micro-behaviors/ui/window/click::programmatic-element-click
  any:
  - id: micro-behaviors/communications/http/download/browser::browser-archive-download-name
  - id: micro-behaviors/communications/http/download/browser::js-executable-download-filename
  - id: drive-by-download-attribute-appref
  - id: drive-by-download-attribute-doc
  - id: drive-by-download-attribute-shortcut
- id: html-appref-ms-blob-dropper
  desc: HTML drops ClickOnce appref-ms launcher
  crit: hostile
  conf: 0.98
  all:
  - id: drive-by-download-attribute-appref
  - id: micro-behaviors/ui/window/click::programmatic-element-click
  - id: micro-behaviors/communications/http/download/handler::browser-forced-download
  - id: micro-behaviors/data/decode/base64::base64-decode-call-text
- id: html-base64-iso-smuggling
  desc: HTML smuggles a Base64 disk image
  crit: hostile
  conf: 0.99
  attack: T1027.006,T1204.002
  all:
  - id: micro-behaviors/data/decode/base64::base64-typed-array-reconstruction
  - id: drive-by-iso-blob-mime
  - id: micro-behaviors/communications/http/download/browser::js-scripted-anchor-download
- id: html-iso-blob-auto-download
  desc: HTML auto-downloads a disk-image Blob
  crit: hostile
  conf: 0.99
  attack: T1027.006,T1204.002
  all:
  - id: drive-by-iso-blob-mime
  - id: drive-by-download-attribute-iso
  - id: micro-behaviors/communications/url/object::browser-object-url
  - id: micro-behaviors/ui/window/click::programmatic-element-click
- id: html-error-mshta-archive-delivery
  desc: HTML smuggles an archive and stages mshta from an error handler
  crit: hostile
  conf: 0.99
  attack: T1027,T1059.007,T1218.005,T1204.002
  all:
  - id: micro-behaviors/communications/http/download/browser::base64-archive-download-cooccurrence
  - id: html-error-handler-mshta-stage
- id: html-base64-zip-smuggling
  desc: HTML smuggles a Base64 ZIP archive
  crit: hostile
  conf: 0.98
  attack: T1027.006,T1204.002
  all:
  - id: metadata/file/encoding::base64-zip-string-assignment
  - id: micro-behaviors/data/decode/base64::base64-to-blob-text-sequence
  - id: micro-behaviors/data/buffer/alloc::blob-construction
  any:
  - id: micro-behaviors/communications/http/download/handler::browser-forced-download
  - id: micro-behaviors/communications/http/download/handler::browser-ms-save-or-open-blob
  - id: micro-behaviors/ui/window/dom/tree::dom-blob-object-url-download
  - id: micro-behaviors/data/buffer/alloc::zip-file-construction
# File-sink variant of the smuggler above: the same Base64 ZIP + Blob chain,
# but the staged bytes leave the page as a ZIP-typed File object
# (`new File([blob], name, {type: 'application/zip'})` navigated via a blob
# URL, often from an embedded SVG carrier) instead of an anchor download or
# msSaveOrOpenBlob call, which is how string-table decoders in postMessage-
# gated loaders emit the sink. The rule above accepts the File sink among
# others; this one requires it and names the shape, so a File-sink sample
# fires both, the same established overlap as a sample carrying both dot-
# form and bracketed sinks.
- id: html-base64-zip-file-smuggling
  desc: HTML smuggles a Base64 ZIP via File object
  crit: hostile
  conf: 0.98
  attack: T1027.006,T1204.002
  all:
  - id: metadata/file/encoding::base64-zip-string-assignment
  - id: micro-behaviors/data/decode/base64::base64-to-blob-text-sequence
  - id: micro-behaviors/data/buffer/alloc::blob-construction
  - id: micro-behaviors/data/buffer/alloc::zip-file-construction
# Bracketed-member variant of the ZIP smuggler above: the same Base64 ZIP +
# Blob chain, but the download sink arrives as string-literal member lookups
# (`navigator['msSaveOrOpenBlob']`, `a['download']`/`a['click']()`), which is
# how string-table decoders in obfuscated loaders emit DOM and navigator
# sinks. Dot-form sinks stay with the rule above; this one owns the bracket
# form so each sink shape reports once.
- id: html-base64-zip-bracket-smuggling
  desc: HTML smuggles a Base64 ZIP via bracketed sinks
  crit: hostile
  conf: 0.98
  attack: T1027.006,T1204.002
  all:
  - id: metadata/file/encoding::base64-zip-string-assignment
  - id: micro-behaviors/data/decode/base64::base64-to-blob-text-sequence
  - id: micro-behaviors/data/buffer/alloc::blob-construction
  any:
  - id: micro-behaviors/communications/http/download/handler::browser-ms-save-or-open-blob-bracket
  - id: micro-behaviors/ui/window/click::dom-computed-click-call
# The bracketed smuggler above running under a string-table decoder: the
# hex-indexed decoder calls place the payload reconstruction behind
# javascript-obfuscator output, so a static reader sees neither the sinks
# nor the filename until the table decodes.
- id: html-obfuscated-zip-smuggling
  desc: Obfuscated HTML smuggles a Base64 ZIP archive
  crit: hostile
  conf: 0.97
  attack: T1027.002,T1027.006,T1204.002
  # HTML only. None of the three legs names a ZIP or a payload, so in a script
  # file they describe any javascript-obfuscator build with a "download as
  # file" helper: a protected npm UI bundle has `new Blob` for its clipboard
  # and export code and a computed `['click']()` for its download anchor
  # hundreds of KB apart. A smuggler is a page.
  for: [html]
  all:
  - id: objectives/anti-static/obfuscation/obfuscator/js-obfuscator::hex-table-indexed-decoder-call
  - id: micro-behaviors/data/buffer/alloc::blob-construction
  - id: micro-behaviors/ui/window/click::dom-computed-click-call
# The rotating-table twin of the smuggler above for pages that hide the
# staging URL rather than the payload bytes: a self-rotating string table
# feeds a Base64 URL decoder, and the decoded URL lands on an executable
# download name. The concealment legs (hidden anchor, computed dispatch)
# confirm the download is staged rather than offered.
- id: html-rotating-url-exe-dropper
  desc: Rotating decoder hides an executable download URL
  crit: hostile
  conf: 0.95
  attack: T1027.002,T1204.002
  all:
  - id: objectives/anti-static/obfuscation/obfuscator/js-obfuscator::push-shift-bracket-pattern
  - id: micro-behaviors/data/decode/base64::base64-decode-call-text
  - id: objectives/credential-access/phishing/captive-portal::download-executable-link
  any:
  - id: micro-behaviors/data/control-flow/dispatch::js-computed-property-call
  - id: micro-behaviors/ui/window/style::css-display-none
# Obfuscated HTML page stages an archive download URL in a DOM data attribute
# and triggers an automated programmatic download. The data attribute conceals
# the delivery URL from basic scrapers while a self-rotating string-array
# decoder dynamically retrieves it and invokes click on a synthesized anchor.
- id: html-obfuscated-dom-staged-archive-dropper
  desc: Obfuscated HTML stages DOM archive dropper
  crit: hostile
  conf: 0.96
  attack: T1027.002,T1189,T1204.002
  for: [html]
  all:
  - id: objectives/anti-static/obfuscation/obfuscator/js-obfuscator::push-shift-bracket-pattern
  - id: micro-behaviors/communications/http/download/browser::html-element-data-archive-download-url
  any:
  - id: micro-behaviors/data/control-flow/dispatch::js-computed-document-call
  - id: micro-behaviors/data/control-flow/dispatch::js-computed-property-call
