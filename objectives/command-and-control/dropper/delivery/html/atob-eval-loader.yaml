# atob-decoded payload executed in-page. The carrier is an HTML page whose
# script decodes a large Base64 literal with atob() and runs the result
# through eval -- either of a bare variable holding the decoded stage or a
# direct call. Either sink alone is ordinary (feature checks, deferred
# bootstraps); a page-scale blob decoded and executed in the same file is
# concealed payload delivery with no benign producer.
defaults:
  platforms: [windows, unix]
  for: [html]
  attack: T1105,T1059.007
  mbc: B0024
composite_rules:
  - id: atob-blob-variable-eval-delivery
    desc: Decoded Base64 blob executed via variable eval
    crit: hostile
    conf: 0.97
    all:
      - id: micro-behaviors/data/decode/base64::large-base64-atob-decode
      - id: micro-behaviors/process/interpreter/eval/direct::eval-identifier-call-text
      - id: micro-behaviors/process/interpreter/eval/direct::eval-call-text
