# A lure page that shows a document-extraction password, stages an
# encrypted payload in a non-rendered element, and pulls its decrypting
# loader from a remote script: the password-gated smuggled-document kit.
# No one leg convicts on its own — password labels appear on legitimate
# encrypted-file sharing pages, hidden blobs can carry state, and external
# scripts are ordinary — but a page that needs all three at once is not
# sharing a file, it is gating a concealed payload behind a displayed key
# while its activation logic arrives off-page.
defaults:
  platforms: [windows, unix]
  for: [html]
  attack: T1027.006,T1204.002

composite_rules:
  - id: password-gated-concealed-blob-delivery
    desc: Password-gated hidden blob with remote loader
    crit: hostile
    conf: 0.97
    all:
      - id: micro-behaviors/data/format/html::concealed-bulk-encoded-blob
      - id: micro-behaviors/ui/window/display::password-label-text
      - id: micro-behaviors/communications/http/client/resource::external-script-element-load

  - id: password-gated-encrypted-executable-iframe-delivery
    desc: Password-gated encrypted executable iframe delivery
    crit: hostile
    conf: 0.98
    near_bytes: 1024
    all:
      - id: metadata/document/html::encrypted-zip-iframe
      - id: metadata/document/html::base64-exe-suffix-marker
      - id: micro-behaviors/ui/window/display::password-label-text

  - id: password-gated-svg-embed-delivery
    desc: Password-gated page mounts SVG embed delivery carrier
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/data/collection/dom::dom-create-embed-element
      - id: micro-behaviors/data/collection/dom::set-attribute-src-data-uri
    any:
      - id: micro-behaviors/ui/window/markup::displayed-document-password
      - id: micro-behaviors/ui/window/display::password-label-text
