# Store- or meeting-themed web lures that gate an installer by platform and
# use a delayed modal/hidden frame to make the download look like an update.
# The matchers describe DOM/API structure rather than page copy or branding.
# ATT&CK: T1189 (Drive-by Compromise), T1105 (Ingress Tool Transfer)
defaults:
  platforms: [windows, unix]
  for: [html, javascript, typescript]
  attack: T1189,T1105
  mbc: F0007

traits:
  - id: timed-dom-install-state
    desc: Delays an install or progress state
    crit: component
    conf: 0.92
    if:
      type: text
      regex: '(?is)\bsetTimeout\s*\(.{0,180}\b(install|progress)[A-Za-z]*\b'
  - id: timed-dom-update-navigation
    desc: Navigates to an update page
    crit: component
    conf: 0.92
    if:
      type: text
      regex: '(?i)\blocation\.(href|assign)\s*=\s*["''][^"'']{0,80}\bupdate(\.html)?\b'

composite_rules:
  - id: os-gated-hidden-installer-lure
    desc: User-Agent-gated page loads a hidden executable installer
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/communications/http/user-agent::navigator-useragent-conditional
      - id: micro-behaviors/data/format/html::hidden-iframe
      - id: micro-behaviors/communications/http/download/browser::browser-iframe-installer-source
    near_bytes: 4096

  - id: timed-update-modal-navigation
    desc: Timed modal reaches update page
    crit: notable
    conf: 0.96
    all:
      - id: micro-behaviors/ui/window/manage/state::browser-dom-class-state-addition
      - id: timed-dom-install-state
      - id: timed-dom-update-navigation
    near_bytes: 1200

  - id: timed-update-hidden-installer-lure
    desc: Timed update modal hides an executable installer download
    crit: hostile
    conf: 0.98
    all:
      - id: timed-update-modal-navigation
      - id: micro-behaviors/data/format/html::hidden-iframe
      - id: micro-behaviors/communications/http/download/browser::browser-iframe-installer-source
    near_bytes: 4096
