# Phishing kits (Mirage2FA and lookalikes) stage harvesting logic from a remote
# path shaped like /<3-letter>/xls/<token>.js — often /api/xls/a1p2i.js with
# optional c2v/cpt suffixes. The path is not a normal Office document route; it
# is a kit loader endpoint. Pairing it with a browser script load or SVG
# navigation marks an attachment stager.
defaults:
  platforms: [windows, unix]
  for: [html, javascript, typescript, svg]
  attack: T1105,T1566.001
  mbc: F0001

traits:
  - id: triple-code-xls-js-loader-path
    desc: URL path uses /xxx/xls/*.js loader shape
    crit: suspicious
    conf: 0.96
    if:
      type: text
      regex: '/[a-z]{3}/xls/[a-z0-9]+(c2v|cpt)?\.js\b'

composite_rules:
  - id: browser-remote-xls-js-stager
    desc: Browser loads remote /xls/*.js harvest script
    crit: hostile
    conf: 0.97
    attack: T1105,T1566.001,T1059.007
    all:
      - id: triple-code-xls-js-loader-path
    any:
      - id: micro-behaviors/communications/http/client/resource::dynamic-script-element-load
      - id: micro-behaviors/process/create/load/remote-code::js-remote-src-assignment
      - id: micro-behaviors/communications/http/client/resource::external-script-element-load
      - id: micro-behaviors/process/create/load/remote-code::js-remote-script-element
    near_bytes: 1200

  - id: svg-xls-js-location-redirect
    desc: SVG script redirects to remote /xls/*.js
    crit: hostile
    conf: 0.97
    attack: T1105,T1566.001,T1204.002
    for: [svg]
    all:
      - id: triple-code-xls-js-loader-path
      - id: micro-behaviors/communications/http/url/navigation::svg-location-external-assignment
    near_bytes: 800
