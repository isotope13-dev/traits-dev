# Paired hex markers around a remote PHP script URL with a numeric id are
# consistent with a tracked, injected loader. They do not establish what the
# remote response contains, so classify the combination as suspicious.
defaults:
  platforms: [windows, unix]
  for: [html]
  attack: T1189,T1105

composite_rules:
  - id: marker-bracketed-tracked-php-script
    desc: Marker-bracketed page loads tracked PHP script
    crit: suspicious
    conf: 0.95
    near_bytes: 1024
    all:
      - id: objectives/command-and-control/dropper/delivery/web-injection::hex-comment-framed-script-block
      - id: objectives/command-and-control/dropper/delivery/web-injection::tracked-php-remote-script-src
      - id: micro-behaviors/process/deploy::external-script-element-load
