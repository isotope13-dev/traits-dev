# A compromised page staging a per-visitor tracked loader: the remote
# script element pulls code from a server-side endpoint (.php) carrying a
# numeric visitor id, and the tag sits inside the injector's paired hex
# comment markers. The markers prove the tag was planted rather than
# authored; the id-bearing endpoint makes the load a tracked delivery
# rather than a versioned library include. No campaign hostname, endpoint
# spelling, or marker token is assumed.
defaults:
  platforms: [windows, unix]
  for: [html]
  attack: T1189,T1105

composite_rules:
  - id: marker-staged-tracked-php-loader
    desc: Marker-staged page loads tracked PHP script
    crit: hostile
    conf: 0.95
    near_bytes: 1024
    all:
      - id: objectives/command-and-control/dropper/delivery/web-injection::hex-comment-framed-script-block
      - id: objectives/command-and-control/dropper/delivery/web-injection::tracked-php-remote-script-src
      - id: micro-behaviors/process/deploy::external-script-element-load
