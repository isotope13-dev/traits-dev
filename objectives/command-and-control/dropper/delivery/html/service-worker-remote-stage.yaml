# Service worker staging: importScripts() with a dynamically built remote URL.
# Legitimate workers import same-origin helpers; reversing a CDN hostname in
# the bootstrap and then importScripts(getAsset(...)) is a remote second-stage
# load (T1105) executed in worker scope (T1059.007).
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
  attack: T1059.007, T1105, T1027

composite_rules:
  - id: obfuscated-service-worker-remote-import
    desc: Service worker imports obfuscated remote script
    crit: hostile
    conf: 0.96
    all:
      - id: micro-behaviors/process/interpreter/scripting::worker-importscripts-call
      - id: micro-behaviors/data/string/reverse::split-reverse-join-string
