defaults:
  platforms: [windows]
  for: [html]
  attack: T1204.002

traits:
  - id: html-downloads-wsf
    desc: HTML downloads WSF script
    crit: suspicious
    conf: 0.96
    if:
      type: text
      # The `.download =` spelling covers script-assigned filenames; the bare
      # `download=` attribute covers smuggler pages that stage the name in
      # markup (`<a download="invoice.wsf" href="data:...">`). Same claim.
      regex: '(^|[^\w])download\s*=\s*["''][^"'']{0,60}\.wsf["'']'
  - id: html-downloads-cmd
    desc: HTML downloads CMD script
    crit: suspicious
    conf: 0.96
    if:
      type: text
      # Same markup spelling as the WSF atom above.
      regex: '(^|[^\w])download\s*=\s*["''][^"'']{0,60}\.cmd["'']'
  - id: html-downloads-js
    desc: HTML downloads JS script
    crit: suspicious
    conf: 0.96
    if:
      type: text
      # Same markup spelling as the WSF atom above; smuggler pages stage a
      # WSH-executable .js filename the same way (`<a download="x.js">`).
      regex: '(^|[^\w])download\s*=\s*["''][^"'']{0,60}\.js["'']'

composite_rules:
  - id: html-script-download-file
    desc: HTML downloads script file
    crit: suspicious
    conf: 0.96
    any:
      - id: html-downloads-wsf
      - id: html-downloads-cmd
      - id: html-downloads-js
  - id: html-generated-script-dropper
    desc: HTML generates script dropper
    crit: hostile
    conf: 0.98
    mbc: "B0023"
    all:
      - id: micro-behaviors/communications/http/download/handler::browser-forced-download
      - id: html-script-download-file
    any:
      - id: micro-behaviors/data/decode/base64::base64-decode-call-text
      - id: micro-behaviors/process/argument/option::powershell-policy-bypass-flag
      - id: micro-behaviors/ui/help::html-double-click-script-instruction
  # The markup-staged twin of the dropper above for smuggler pages with no
  # script at all: the payload rides a data: application/octet-stream href
  # and the anchor names a script file, so clicking downloads it straight
  # from the page. No fetch, Blob construction, or decoder call is needed.
  - id: html-smuggled-wsf-download
    desc: Page smuggles a WSF download via data URI
    crit: hostile
    conf: 0.97
    attack: T1027.006,T1204.002
    all:
      - id: html-downloads-wsf
      - id: micro-behaviors/communications/url/encoded::inline-application-or-font-data-uri
  # The JS twin of the WSF smuggler above: the anchor names a .js file, which
  # Windows executes with WSH on double-click just like a .wsf. Same claim.
  - id: html-smuggled-js-download
    desc: Page smuggles a JS download via data URI
    crit: hostile
    conf: 0.97
    attack: T1027.006,T1204.002
    all:
      - id: html-downloads-js
      - id: micro-behaviors/communications/url/encoded::inline-application-or-font-data-uri
