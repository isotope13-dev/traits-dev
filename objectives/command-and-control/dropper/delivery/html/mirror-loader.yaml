# A resilient remote-script stager in SVG-embedded code: the same fetch is
# issued against each URL of an iterated mirror roster and a response that
# validates is injected as a live script element (first-success-wins across
# a dozen CDN mirrors). A micro-frontend loader fetches one or two known
# URLs; rotating through a mirror roster until one serves is how an
# operator keeps code delivery alive after individual mirrors are taken
# down. The fetch, the rotation and the injection are three required roles:
# a feed reader rotates fetches but injects no script, and a plugin host
# injects scripts without mirror rotation.
defaults:
  platforms: [windows, unix]
  for: [svg]
  attack: T1105,T1059.007
composite_rules:
  - id: svg-mirror-list-script-inject
    desc: SVG fetches remote script from mirror list and injects it
    crit: hostile
    conf: 0.97
    scope: file
    all:
      - id: micro-behaviors/communications/http/client/resource::svg-fetch-call
      - id: micro-behaviors/data/control-flow/iteration::iterated-list-fetch-loop
      - id: micro-behaviors/data/collection/dom::svg-script-element-create
