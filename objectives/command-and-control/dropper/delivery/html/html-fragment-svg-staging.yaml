# Fragmented SVG staging. The carrier never appears as one encoded blob:
# payload shards sit in hidden elements' data-store attributes, some stored
# reversed, and page script reverses, concatenates and loads them through a
# dynamically created embed element. Each operation is ordinary alone
# (reversal loops, dataset reads, embed creation); a single page doing all
# three at once is reassembling a concealed carrier, not content.
defaults:
  platforms: [windows, unix]
  for: [html]
  attack: T1027.006
  mbc: F0007

composite_rules:
  - id: html-reversed-fragment-svg-staging
    desc: Reversed fragments stage an SVG embed carrier
    crit: hostile
    conf: 0.97
    all:
      - id: micro-behaviors/data/string/reverse::descending-character-loop
      - id: micro-behaviors/data/property/access::dom-dataset-store-read
      - id: micro-behaviors/data/collection/dom::dom-create-embed-element
  - id: html-reversed-svg-embed-staging
    desc: Reversed hidden data URI stages an SVG embed carrier
    crit: hostile
    conf: 0.97
    all:
      - id: micro-behaviors/data/string/reverse::descending-character-loop
      - id: micro-behaviors/data/string/reverse::reversed-svg-data-uri-text
      - id: micro-behaviors/communications/http/client/resource::element-src-reversed-value-assignment
