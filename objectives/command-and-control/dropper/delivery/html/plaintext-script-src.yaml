# A script element whose source is fetched over plaintext HTTP executes
# code without transport integrity: anyone on the path can substitute the
# payload. Legacy and intranet sites still serve code this way, so the
# observation alone stays suspicious; injection composites supply the
# hostile delivery context.
defaults:
  platforms: [windows, unix]
  for: [html]
  attack: T1105
traits:
  - id: plaintext-remote-script-src
    desc: Remote script loads over plaintext HTTP
    crit: suspicious
    conf: 0.85
    if:
      type: text
      regex: "<script[^>]{0,240}\\bsrc\\s*=\\s*[\"']http://[^\\s\"'<>]{1,80}"
    not:
      # A loopback bridge script (desktop frameworks serve their IPC shim
      # from localhost) has no network path to intercept: there is no
      # remote party, so it is not remote delivery.
      - regex: 'http://localhost\b'
      - regex: 'http://127\.'
      - regex: 'http://\[::1\]'
