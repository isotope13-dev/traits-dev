# HTTP file-share APIs that map PE MIME types and password-gate
# downloads. Operator C2 panels use this to stage implant binaries.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  attack: T1105

composite_rules:
  - id: pe-mime-file-share-delivery
    desc: File-share API delivers PE payloads
    crit: hostile
    conf: 0.96
    all:
      - id: micro-behaviors/communications/http/header/content-type::pe-portable-executable-media-type
      - id: micro-behaviors/communications/http/download/handler::api-file-share-upload-route
      - id: micro-behaviors/communications/http/download/handler::api-file-share-download-route
      - id: micro-behaviors/communications/http/header/custom::x-download-password-header
