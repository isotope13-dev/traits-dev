# Installer stubs that stage their real payload over WinHTTP. Inno Setup
# fetches components over WinInet when it downloads at all; a full WinHTTP
# request flow with corporate-proxy resolution inside a convicted
# blank-section carrier is a downloader stage fetching the next payload,
# not installer housekeeping.
defaults:
  platforms: [windows]
  for: [pe, dll]
  attack: T1105
  mbc: B0024

composite_rules:
  - id: inno-blank-section-winhttp-stage
    desc: Inno blank-section carrier with WinHTTP download stage
    crit: hostile
    conf: 0.95
    all:
      - id: objectives/anti-static/obfuscation/payload/encrypted::inno-blank-exec-opaque-payload
      - id: micro-behaviors/communications/http/client/winhttp::winhttp-downloader-flow
      - id: micro-behaviors/communications/http/client/winhttp::winhttp-get-proxy-for-url
    unless:
      - id: metadata/signed/platform/
