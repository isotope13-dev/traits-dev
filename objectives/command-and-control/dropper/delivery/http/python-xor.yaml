defaults:
  platforms: [windows, unix]
  for: [python]
  attack: T1105
  mbc: B0024
composite_rules:
  - id: python-c2-xor-download-exec
    desc: Downloads XOR-encoded payload from IP and executes
    crit: hostile
    conf: 0.95
    all:
      - id: micro-behaviors/communications/http/url/external-ip::python-http-ip-port-url
      - id: micro-behaviors/data/arithmetic::xor-modulo-loop-observation
    any:
      - id: micro-behaviors/process/create/subprocess::popen-content
      - id: micro-behaviors/process/create/subprocess::sys-executable-popen
      - id: micro-behaviors/process/interpreter/eval/direct::exec-builtin
    unless:
      - id: metadata/package/testing/
      - id: "metadata/file/naming::test-directory-component"
