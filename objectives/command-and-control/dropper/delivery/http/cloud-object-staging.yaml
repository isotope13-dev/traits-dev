defaults:
  platforms: [unix, windows]
  for: [scripts, html]
  attack: T1105
  mbc: B0024
traits:
# aliyun-oss-object-url relocated to
# micro-behaviors/communications/http/services/cloud::aliyun-oss-object-url — a bare
# Aliyun OSS URL is a neutral cloud-storage endpoint; the stego-staging
# composite references it cross-tier.
# The Google Cloud Storage and Azure Blob host atoms that lived here were
# duplicates of the neutral cloud-storage URL capabilities; the composite
# below references those canonical atoms instead.
- id: short-numeric-image-object
  desc: Short numeric image object name
  crit: component
  conf: 0.8
  if:
    type: text
    regex: '(?i)/[0-9]{4,8}\.(png|jpe?g|gif|webp)\b'
composite_rules:
- id: aliyun-cloud-image-stager
  # A cloud image URL is common application content. Treat it as staging
  # only when the image also carries an explicit payload marker; a short
  # numeric object name is an ordinary CDN convention and is not evidence of
  # a hidden payload.
  desc: Alibaba OSS image object with an embedded payload marker
  crit: suspicious
  conf: 0.9
  all:
  - id: micro-behaviors/communications/http/services/cloud::aliyun-oss-object-url
  - id: suspicious-cloud-image-object
  any:
  - id: objectives/command-and-control/dropper/delivery/stego::marker-after-image-eof
  - id: objectives/command-and-control/dropper/delivery/stego::reversed-pe-base64-marker
- id: cloud-image-stager
  desc: Cloud image object used for staging
  crit: suspicious
  conf: 0.9
  all:
  - id: suspicious-cloud-image-object
  any:
  - id: objectives/command-and-control/dropper/delivery/stego::marker-after-image-eof
  - id: objectives/command-and-control/dropper/delivery/stego::reversed-pe-base64-marker
- id: suspicious-cloud-image-object
  desc: Cloud-hosted image object
  crit: component
  conf: 0.86
  any:
  - id: micro-behaviors/communications/http/url/cloud::gcs-url
  - id: micro-behaviors/communications/http/services/blob-azure::storage-url
  - id: micro-behaviors/communications/http/services/cloud::aws-api-endpoint
  - id: micro-behaviors/communications/http/url/cloud::third-party-object-storage-url
