defaults:
  platforms: [unix, windows]
  for: [php]

composite_rules:
  - id: multipart-php-webshell-delivery
    desc: Multipart HTTP request uploads a command webshell
    crit: hostile
    conf: 0.99
    attack: T1105,T1505.003
    mbc: B0023
    all:
      - id: micro-behaviors/communications/http/message::raw-http-body-request-line
      - id: micro-behaviors/communications/http/post::multipart-form
      - id: micro-behaviors/communications/http/upload::multipart-php-script-filename
      - id: objectives/command-and-control/backdoor/webshell/exec::php-command-webshell
    near_bytes: 4096
