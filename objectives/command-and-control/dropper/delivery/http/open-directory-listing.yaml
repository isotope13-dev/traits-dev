# Open web-server directory listings used as malware staging. A listing is
# ordinary; a listing of dozens of loose .exe files whose names carry
# stealer or RAT builder names, or crypter and stub vocabulary, is the
# staging area of an operator. The link text is the evidence, so no host or
# path is matched.
defaults:
  platforms: [unix, windows]
  for: [html]
  attack: T1608.001

traits:
  - id: autoindex-page-title
    desc: Web server directory index page
    crit: notable
    conf: 0.8
    if:
      type: text
      regex: '(?i)<title>Index of /'

  - id: directory-index-exe-links
    desc: Directory index links ten or more EXEs
    crit: notable
    conf: 0.85
    count_min: 10
    if:
      type: text
      regex: '(?i)<a href="[^"?/]{1,60}\.exe">'

  - id: index-malware-family-link-names
    desc: Index links named for stealers or RATs
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)<a href="[^"]{0,30}(LummaC2|DCRat|Meduza|RedLine|AsyncRAT|njRAT|Vidar)[^"]{0,30}\.exe"'

  - id: index-crypter-stub-link-names
    desc: Index links named for crypters or stubs
    crit: notable
    conf: 0.85
    if:
      type: text
      regex: '(?i)<a href="[^"]{0,30}(crypted?|fud|stub)[^"]{0,30}\.exe"'

composite_rules:
  - id: open-directory-malware-staging-listing
    desc: Open directory lists EXEs named for stealers and RATs
    crit: hostile
    conf: 0.93
    all:
      - id: autoindex-page-title
      - id: directory-index-exe-links
      - id: index-malware-family-link-names
