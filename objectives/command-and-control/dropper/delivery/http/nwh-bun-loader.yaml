defaults:
  platforms: [windows]
  for: [pe, javascript]
  attack: T1105

traits:
  # NOTE: the generic /api/report and /api/status path atoms used to live
  # here under family names; they are neutral URL observations and now live
  # at micro-behaviors/communications/http/url/api-path::api-report-path
  # and ::api-status-path, referenced by the protocol composite below.
  # Only the family-specific domains remain here.
  - id: bun-loader-silent-harvester-domain
    desc: Bun loader silent harvester domain
    crit: notable
    conf: 0.99
    if:
      type: text
      regex: '(?i)\bsilent-harvester\.cc\b'
  - id: bun-loader-silent-orbit-domain
    desc: Bun loader silent orbit domain
    crit: notable
    conf: 0.99
    if:
      type: text
      regex: '(?i)\bsilent-orbit\.cc\b'
  - id: bun-loader-support-onion-domain
    desc: Bun loader support onion domain
    crit: notable
    conf: 0.99
    if:
      type: text
      regex: '(?i)\bsupport-onion\.club\b'
  - id: nwhstealer-cosmic-nebula-domain
    desc: NWHStealer cosmic nebula domain
    crit: notable
    conf: 0.99
    if:
      type: text
      regex: '(?i)\bcosmic-nebula\.cc\b'
  - id: nwhstealer-whale-ether-domain
    desc: NWHStealer whale ether domain
    crit: notable
    conf: 0.99
    if:
      type: text
      regex: '(?i)\bwhale-ether\.pro\b'

composite_rules:
  - id: bun-loader-api-protocol
    desc: Bun loader report status update protocol
    crit: suspicious
    conf: 0.96
    all:
      - id: micro-behaviors/communications/http/url/api-path::api-report-path
      - id: micro-behaviors/communications/http/url/api-path::api-status-path
      - id: micro-behaviors/communications/url/http-path::api-update-path-reference
    any:
      - id: metadata/build/config::build-id-identifier
      - id: micro-behaviors/communications/http/ip-discovery::ipify-api
      - id: micro-behaviors/crypto/symmetric/aes/mode::aes-256-cbc-dash
      - id: micro-behaviors/crypto/symmetric/aes/runtime-library::aes256cbc-nodash
  - id: nwh-bun-loader-c2-profile
    desc: NWHStealer Bun loader C2 profile
    crit: hostile
    conf: 0.98
    all:
      - id: bun-loader-api-protocol
    any:
      - id: bun-loader-silent-harvester-domain
      - id: bun-loader-silent-orbit-domain
      - id: bun-loader-support-onion-domain
      - id: nwhstealer-cosmic-nebula-domain
      - id: nwhstealer-whale-ether-domain
