defaults:
  platforms: [windows]
  for: [pe, javascript]
  attack: T1105

traits:
  - id: bun-loader-report-endpoint
    desc: Bun loader report endpoint
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: '(/|%2f)api(/|%2f)report\b'
  - id: bun-loader-status-endpoint
    desc: Bun loader status endpoint
    crit: notable
    conf: 0.94
    unless:
      - id: well-known/tool/development/agent/agent-relay::agent-relay-harness-package
      - id: well-known/lib/ai/lmcache::wheel-member-context
    if:
      type: text
      regex: '(/|%2f)api(/|%2f)status\b'
  - id: bun-loader-update-endpoint
    unless:
      - id: metadata/package/testing/corpus::inert-security-input-module
    desc: Bun loader update endpoint
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: '(/|%2f)api(/|%2f)update\b'
  # bun-loader-aes-cbc removed: its matcher was the generic cipher name
  # AES-256-CBC, which every crypto library (crypto-browserify, node's crypto)
  # carries -- not an NWHStealer/Bun-loader-specific marker. The neutral cipher
  # atoms in micro-behaviors/crypto/symmetric/aes/ already detect it, and the
  # two composites below now reference them cross-tier so the family conviction
  # still needs a family-specific endpoint or domain, not a bare cipher string.
  - id: bun-loader-silent-harvester-domain
    desc: Bun loader silent harvester domain
    crit: notable
    conf: 0.99
    if:
      type: text
      regex: '(?i)\bsilent-harvester\.cc\b'
  - id: bun-loader-silent-orbit-domain
    desc: Bun loader silent orbit domain
    crit: notable
    conf: 0.99
    if:
      type: text
      regex: '(?i)\bsilent-orbit\.cc\b'
  - id: bun-loader-support-onion-domain
    desc: Bun loader support onion domain
    crit: notable
    conf: 0.99
    if:
      type: text
      regex: '(?i)\bsupport-onion\.club\b'
  - id: nwhstealer-cosmic-nebula-domain
    desc: NWHStealer cosmic nebula domain
    crit: notable
    conf: 0.99
    if:
      type: text
      regex: '(?i)\bcosmic-nebula\.cc\b'
  - id: nwhstealer-whale-ether-domain
    desc: NWHStealer whale ether domain
    crit: notable
    conf: 0.99
    if:
      type: text
      regex: '(?i)\bwhale-ether\.pro\b'

composite_rules:
  - id: bun-loader-api-protocol
    desc: Bun loader report status update protocol
    crit: suspicious
    conf: 0.96
    all:
      - id: bun-loader-report-endpoint
      - id: bun-loader-status-endpoint
      - id: bun-loader-update-endpoint
    any:
      - id: metadata/build/config::build-id-identifier
      - id: micro-behaviors/communications/http/ip-discovery::ipify-api
      - id: micro-behaviors/crypto/symmetric/aes/runtime-library::aes-256-cbc-dash
      - id: micro-behaviors/crypto/symmetric/aes/runtime-library::aes256cbc-nodash
  - id: nwh-bun-loader-c2-profile
    desc: NWHStealer Bun loader C2 profile
    crit: hostile
    conf: 0.98
    all:
      - id: bun-loader-api-protocol
    any:
      - id: bun-loader-silent-harvester-domain
      - id: bun-loader-silent-orbit-domain
      - id: bun-loader-support-onion-domain
      - id: nwhstealer-cosmic-nebula-domain
      - id: nwhstealer-whale-ether-domain
