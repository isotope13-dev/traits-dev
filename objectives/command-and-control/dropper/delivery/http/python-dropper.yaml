defaults:
  platforms: [windows, unix]
  for:
    - python
  mbc: B0024
  attack: T1105
traits:
  - id: download-and-execute-func-1
    desc: download_and_execute function (snake_case)
    crit: suspicious
    conf: 0.9
    if:
      type: symbol
      substr: download_and_execute
  - id: download-and-execute-func-2
    desc: download_execute function (snake_case)
    crit: suspicious
    conf: 0.9
    if:
      type: symbol
      # Anchor the trailing boundary so this matches download_execute /
      # download_execute_payload but NOT download_executer / download_executor
      # (a benign "download executor" dispatch function, common in launchers).
      regex: 'download_execute([^a-zA-Z]|$)'
  - id: download-and-execute-func-3
    desc: downloadAndExecute function (camelCase)
    crit: suspicious
    conf: 0.9
    if:
      type: symbol
      substr: downloadAndExecute
  - id: download-and-execute-func-4
    desc: downloadExecute function (camelCase)
    crit: suspicious
    conf: 0.9
    if:
      type: symbol
      # Trailing boundary excludes downloadExecuter / downloadExecutor.
      regex: 'downloadExecute([^a-zA-Z]|$)'
  - id: kill-process-md5
    desc: MD5-based process termination
    crit: suspicious
    conf: 0.95
    if:
      type: string_literal
      regex: kill_process.{0,30}md5|md5.{0,30}kill.{0,30}process
  - id: kill-process-mismatch
    desc: Kill process if mismatch
    crit: suspicious
    conf: 0.9
    if:
      type: string_literal
      # Require process terminology: prose such as "mismatch that killed the
      # glyph" does not describe terminating a process.
      regex: '\bkill.{0,8}process\b.{0,20}mismatch|mismatch.{0,20}\bkill.{0,8}process\b'
    unless:
      - id: well-known/tool/detection/
  - id: bin-endpoint-path
    desc: Binary download endpoint path
    crit: suspicious
    conf: 0.85
    if:
      type: string_literal
      # A URL that *ends* at `/bin` is a toolchain/directory index
      # (kernel.org crosstool `.../files/bin`). Dropper endpoints fetch a
      # named payload under `/bin/`.
      regex: 'https?://[^\s''"<>|`\\]{1,80}/bin/[A-Za-z0-9._-]{1,64}'
    not:
      - regex: '/local/bin/'
      - regex: 'dl\.k8s\.io\b'
      # Official Julia distribution mirror: language-toolchain provisioners
      # fetch compilers from julialang-s3.julialang.org/bin/<platform>/,
      # which is release infrastructure, not a payload endpoint.
      - regex: 'julialang-s3\.julialang\.org'
      # Source-file view pages (github blob URLs) serve HTML, never a
      # fetchable payload: a `/bin/` source directory cited in a docstring
      # or comment is documentation, not a download endpoint.
      - regex: 'github\.com/[^/''"\s]+/[^/''"\s]+/blob/'
    unless:
      - id: metadata/package/testing/terminology::test-code-declaration-text
      - id: metadata/package/testing/presence/harness/
      - id: well-known/app/infrastructure/ansible::ansible-module-source-context
      - id: "metadata/file/naming::test-directory-component"
composite_rules:
  - id: download-and-execute-func
    desc: download_and_execute function patterns
    crit: suspicious
    conf: 0.9
    any:
      - id: download-and-execute-func-1
      - id: download-and-execute-func-2
      - id: download-and-execute-func-3
      - id: download-and-execute-func-4
  - id: anti-duplicate-infection
    desc: Anti-duplicate infection pattern
    crit: suspicious
    conf: 0.9
    any:
      - id: kill-process-md5
      - id: kill-process-mismatch
  - id: arch-payload-selection
    desc: Architecture-based payload selection
    crit: suspicious
    conf: 0.85
    all:
      - id: micro-behaviors/os/sysinfo/platform/arch::python-platform-architecture-call
      - id: metadata/file/string/identity::arch-64bit-string
    any:
      - id: micro-behaviors/communications/http/url/external-ip::python-http-ip-port-url
      - id: download-and-execute-func
