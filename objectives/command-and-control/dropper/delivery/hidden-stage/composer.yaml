# The flow binds download, chmod and hidden background invocation to one
# literal path; the separate event fact establishes executable lifecycle scope.
composite_rules:
  - id: composer-linked-hidden-background-stage
    desc: Composer fetches and launches hidden stage
    crit: hostile
    conf: 0.98
    for: [composer.json]
    platforms: [windows, unix]
    attack: T1105,T1564.001
    all:
      - id: metadata/build/package/recipe/setup-hooks::composer-lifecycle-flow-event
      - id: micro-behaviors/process/create/local-exec::composer-linked-hidden-background-invocation
