# The lifecycle script itself binds download, chmod and hidden background
# invocation into one && chain; the chain legs are matched on the declared
# script values (the composer.install_hook_flows block an attacker can forge
# is not a fact and is deliberately not consulted).
composite_rules:
  - id: composer-linked-hidden-background-stage
    desc: Composer fetches and launches hidden stage
    crit: hostile
    conf: 0.96
    for: [composer.json]
    platforms: [windows, unix]
    attack: T1105,T1564.001
    all:
      - id: micro-behaviors/process/create/local-exec::composer-linked-hidden-background-invocation
      - id: micro-behaviors/fs/chmod/executable/mode::composer-chmod-make-executable
