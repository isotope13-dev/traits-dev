defaults:
  for:
  - scripts
  - manifests
  - html
  - xml
  - dockerfile
  - package-lock.json
  - groovy
  platforms:
  - linux
  - macos
  - windows
  attack: T1105
  mbc: B0024
traits:
- id: workflow-hidden-download-stage
  desc: Workflow downloads hidden script stage
  crit: notable
  conf: 0.94
  for:
  - github-actions
  unless:
  - id: metadata/build/ci/github-actions::action-testdata-path
  if:
    type: text
    regex: \bcurl\b[^\n]{0,120}-o\s+/tmp/\.
composite_rules:
- id: hidden-stage-chmod-execute-source
  desc: C source arms and launches a hidden stage
  crit: hostile
  conf: 0.97
  for:
  - c
  - cpp
  near_lines: 3
  all:
  - id: micro-behaviors/fs/chmod/executable/mode::chmod-hidden-path-source
  - id: micro-behaviors/process/create/local-exec/
- id: stealth-fetch-hidden-stage-source
  desc: C source fetches then arms a hidden stage
  crit: hostile
  conf: 0.96
  for:
  - c
  - cpp
  near_lines: 20
  all:
  - id: micro-behaviors/communications/http/download/cli::hidden-output-download-context
  - id: micro-behaviors/fs/chmod/executable/mode::chmod-hidden-path-source
- id: external-ip-fetch-hidden-stage
  desc: external IP fetch hidden stage
  crit: hostile
  conf: 0.98
  near_lines: 20
  all:
  - id: micro-behaviors/communications/http/url/external-ip::curl-external-ip-request
  - id: micro-behaviors/fs/chmod/executable/mode::chmod-hidden-path-command-container
- id: hidden-download-shell-execution
  desc: Downloads and runs a hidden temporary script
  crit: hostile
  conf: 0.97
  platforms:
  - unix
  near_bytes: 0
  all:
  - id: micro-behaviors/communications/http/download/curl::shell-curl-hidden-output
  - id: micro-behaviors/process/create/script/file::shell-downloaded-file-invocation
- id: structured-download-chmod-background-hidden-stage
  desc: Structured command downloads and backgrounds hidden stage
  crit: hostile
  conf: 0.98
  for:
  - vbs
  - package-lock.json
  - plist
  near_lines: 3
  all:
  - id: micro-behaviors/communications/http/download/cli::hidden-output-download-context
  - id: micro-behaviors/fs/chmod/executable/mode::chmod-hidden-path-command-container
  - id: micro-behaviors/process/create/local-exec::structured-hidden-tmp-background-exec
- id: dockerfile-fetch-hidden-stage-output
  desc: Dockerfile fetch writes hidden stage
  crit: hostile
  conf: 0.97
  for:
  - dockerfile
  near_lines: 1
  all:
  - id: micro-behaviors/fs/path/temp::tmp-hidden-file
  any:
  - id: micro-behaviors/communications/http/download/cli::fetch-output-flag-script
  - id: micro-behaviors/communications/http/download/cli::fetch-output-flag-structured-file
  unless:
  - id: metadata/build/archive::source-archive-member
- id: dockerfile-chmod-hidden-stage
  desc: Dockerfile chmod arms hidden stage
  crit: hostile
  conf: 0.97
  for:
  - dockerfile
  near_lines: 1
  all:
  - id: micro-behaviors/fs/chmod/executable/mode::chmod-make-executable
  - id: micro-behaviors/fs/path/temp::tmp-hidden-file
  unless:
  - id: metadata/build/archive::source-archive-member
- id: dockerfile-stealth-fetch-hidden-stage
  desc: Dockerfile fetch then chmod hidden stage
  crit: hostile
  conf: 0.97
  for:
  - dockerfile
  near_lines: 20
  all:
  - id: dockerfile-fetch-hidden-stage-output
  - id: dockerfile-chmod-hidden-stage
- id: hidden-home-script-background-launch
  desc: Arms and backgrounds a hidden home-dir script
  crit: hostile
  conf: 0.98
  for:
  - shell
  attack: T1105,T1059.004
  all:
  - id: micro-behaviors/fs/path/location::env-home-hidden-path
  - id: micro-behaviors/fs/chmod/executable/mode::chmod-hidden-home-executable
  - id: micro-behaviors/process/create/script/file::nohup-shell-script-execution
- id: silent-fetch-hidden-executable-stage
  desc: Silent download arms a hidden executable stage
  crit: suspicious
  conf: 0.96
  for:
  - shell
  platforms:
  - linux
  - macos
  attack: T1105,T1564.001,T1222.002
  near_bytes: 256
  all:
  - id: micro-behaviors/communications/http/download/curl::curl-silent-output
  - id: micro-behaviors/communications/http/download/cli::fetch-output-hidden-path-script
  - id: micro-behaviors/fs/chmod/executable/mode::chmod-hidden-home-executable
