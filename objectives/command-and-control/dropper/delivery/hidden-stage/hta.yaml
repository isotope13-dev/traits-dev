defaults:
  platforms: [windows]
  for: [html, scripts, documents]

traits:
# powershell.exe / powershell -flags, then Invoke-Expression $env:NAME.
# The gap may be flags, but it must be a command: a syntax-highlight class
# named powershell on the same HTML line as a documented profile snippet
# (GitHub's `powershell notranslate ... data-snippet-clipboard-copy-content`)
# is not a launch.
- id: powershell-iex-env-command
  desc: PowerShell Invoke-Expression of env var
  crit: suspicious
  conf: 0.98
  if:
    type: text
    regex: '(?i)powershell(\.exe)?[ \t]+(-[^\r\n]{0,140})?"?Invoke-Expression\s+\$env:\w+'

composite_rules:
  - id: hta-environment-item-assignment
    desc: HTA WSH environment item assignment
    crit: suspicious
    conf: 0.96
    all:
      - id: metadata/file/format/markup::hta-application-element
    any:
      - id: micro-behaviors/os/env/modify::wsh-environment-item-assignment
      - id: micro-behaviors/os/env/modify::wsh-environment-assignment-call

  - id: hta-wscript-user-environment-stage
    for: [javascript, vbs, html]
    desc: HTA stages a WSH environment command
    crit: suspicious
    conf: 0.98
    all:
      - id: micro-behaviors/os/com/automation::wscript-shell-literal
      - id: micro-behaviors/os/env/read::wsh-environment-object
      - id: hta-environment-item-assignment

  - id: hta-appdomain-reflected-load
    for: [javascript, powershell, vbs, html, text]
    desc: HTA reflectively loads a .NET assembly
    crit: suspicious
    conf: 0.98
    attack: T1620,T1140
    near_bytes: 4096
    all:
      - id: metadata/file/format/markup::hta-application-element
      - id: micro-behaviors/process/interpreter/reflection/runtime::powershell-appdomain-token
      - id: micro-behaviors/process/interpreter/reflection/runtime::powershell-split-currentdomain
      - id: micro-behaviors/process/interpreter/reflection/runtime::powershell-split-load-method
      - id: micro-behaviors/process/interpreter/reflection/runtime::powershell-assembly-method-invoke

  - id: hta-hidden-wmi-powershell-loader
    for: [javascript, vbs, html]
    desc: Hidden HTA stages and launches PowerShell through WMI
    crit: hostile
    conf: 0.99
    attack: T1047,T1059.001,T1564.003
    all:
      - id: micro-behaviors/process/create/exec::wmi-hidden-startup-create-sequence
      - id: hta-wscript-user-environment-stage
      - id: powershell-iex-env-command

  - id: hta-remote-reflective-memory-loader
    for: [javascript, vbs, html]
    desc: HTA downloads bytes and reflectively loads a .NET assembly in memory
    crit: hostile
    conf: 0.99
    attack: T1047,T1059.001,T1105,T1140,T1620,T1564.003
    all:
      - id: hta-wscript-user-environment-stage
      - id: powershell-iex-env-command
      - id: micro-behaviors/communications/http/client/webclient::net-webclient-object
      - id: micro-behaviors/communications/http/client/webclient::webclient-download-data
      - id: micro-behaviors/data/decode/base64::dotnet-frombase64string-text
      - id: hta-appdomain-reflected-load

  - id: obfuscated-wsh-file-write-and-execute
    desc: Obfuscated WSH writes and executes a payload
    crit: hostile
    conf: 0.99
    attack: T1027,T1059.007,T1105
    for: [javascript]
    all:
      - id: micro-behaviors/process/create/shellexec::shellexecute-method-call
      - id: micro-behaviors/os/com/automation::filesystemobject-progid
      - id: micro-behaviors/process/interpreter/eval/direct::js-eval-raw
      - id: metadata/lang/natural::repeated-consonant-vowel-token

  - id: hta-dynamic-vbscript-eval-loader
    desc: HTA dynamically decodes and evaluates VBScript payload
    crit: hostile
    conf: 0.98
    attack: T1218.005,T1059.005,T1027
    for: [html, documents, vbs]
    all:
      - id: metadata/file/format/markup::hta-application-element
      - id: objectives/anti-static/obfuscation/eval/scripting/host::wsh-reconstructed-payload-exec
# The element-gated loader above misses extension-only HTA files whose
# payload arrives encoded: no HTA:APPLICATION element, no plaintext
# VBScript for the reconstructed-payload leg to find. This variant convicts
# the staging act instead — an .hta that evals concatenated strings to
# write a concatenation-split script element next to an encoded block.
  - id: hta-eval-launched-hidden-stage
    desc: HTA evals built strings to stage a hidden script
    crit: hostile
    conf: 0.98
    attack: T1218.005,T1059.007
    all:
      - id: metadata/file/extension/identity::hta-html-application-extension
      - id: micro-behaviors/process/interpreter/eval/direct::eval-call-text
      - id: micro-behaviors/process/interpreter/eval/direct::js-eval-concat-string
      - id: micro-behaviors/ui/window/insert-html::split-tag-document-write
    near_bytes: 2048
# The element-gated loaders above miss the Chr-concatenated carrier: no
# HTA:APPLICATION element, no eval, no staged file write. The concealment
# is the ProgID and command spelled as Chr() codes (dozens of them) and the
# launch is ShellExecute on the resulting object. An .hta that resolves its
# automation object from character codes and executes through it is a
# concealed launcher with no benign producer.
  - id: hta-chr-concealed-shell-launch
    desc: HTA launches Chr-concealed command via ShellExecute
    crit: hostile
    conf: 0.98
    attack: T1218.005,T1027
    for: [html]
    all:
      - id: metadata/file/extension/identity::hta-html-application-extension
      - id: micro-behaviors/process/create/shellexec::shellexecute-method-call
      - id: micro-behaviors/data/encode/char-code::dense-chr-construction
      - id: micro-behaviors/os/com/automation::vbs-createobject-call-result

  - id: hta-chr-reconstructed-eval-stage
    desc: HTA dynamically evaluates Chr-reconstructed script
    crit: hostile
    conf: 0.98
    attack: T1218.005,T1059.005,T1027
    for: [html]
    all:
      - id: micro-behaviors/process/interpreter/eval/direct::vbs-execute-statement
      - id: micro-behaviors/data/encode/char-code::dense-chr-construction
    any:
      - id: metadata/file/extension/identity::hta-html-application-extension
      - id: metadata/file/format/markup::hta-application-element

