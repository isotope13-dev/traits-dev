defaults:
  platforms: [windows]
  # Junk-padded .hta often classifies as unknown (analyzer skipped). These
  # raw fallbacks target types GenericAnalyzer still runs — e.g. the same
  # dropper shipped as .txt/.dat or without a leading pad block.
  # Raw matcher file-type cap is 3; keep html/text/data (not vbs).
  for: [html, text, data]

# Bounded raw fallbacks catch WMI/WSH staging when junk padding empties
# text extraction (customs-document HTA droppers).
traits:
- id: hta-raw-hidden-wmi-process-stage
  desc: Raw HTA creates hidden WMI process
  crit: notable
  conf: 0.97
  attack: T1047,T1564.003
  mbc: E1043
  if:
    type: raw
    regex: '(?is)SpawnInstance_\s*\(\s*\).{0,700}ShowWindow\s*=\s*0.{0,700}Create\s*\('

- id: hta-raw-wscript-shell
  desc: Raw HTA creates WScript Shell object
  crit: notable
  conf: 0.96
  if:
    type: raw
    regex: '(?is)ActiveXObject.{0,100}WScript\.Shell'

- id: hta-raw-user-environment
  desc: Raw HTA accesses user environment
  crit: notable
  conf: 0.96
  if:
    type: raw
    regex: '(?is)Environment\s*\(\s*["'']User["'']\s*\)'

- id: encoded-remote-url-fragment
  desc: Encoded HTTP URL fragment
  crit: component
  conf: 0.94
  if:
    type: encoded
    regex: '(?i)https?://'
  unless:
    - id: metadata/package/quality/source::openjfx-source-tree
    - id: metadata/package/quality/source::openjfx-tooling-tree

  # PowerShell Unicode.GetString(FromBase64String(...)) of "https://"
- id: utf16le-b64-https-prefix
  desc: UTF-16LE Base64 encodes an https URL
  crit: notable
  conf: 0.95
  attack: T1105,T1140
  if:
    type: raw
    regex: 'aAB0AHQAcABzADoALwAv[A-Za-z0-9+/]{24,}'

- id: hta-raw-offscreen-marker
  desc: Raw HTA hides its window
  crit: suspicious
  conf: 0.94
  if:
    type: raw
    regex: '(?is)window\.(resizeTo|moveTo)\s*\(.{0,120}(-\d+|0\s*,\s*0)'

- id: hta-raw-nonascii-padding
  desc: Non-ASCII HTA padding
  crit: suspicious
  conf: 0.96
  if:
    type: raw
    regex: '(?is)<hta:application\b.{0,900}[^\x00-\x7f]{8,}'

- id: hta-raw-split-join-cleanup
  desc: Raw HTA strips marker via split-join
  crit: suspicious
  conf: 0.95
  attack: T1027.002
  if:
    type: raw
    regex: '(?is)\.split\s*\(\s*["''][^"'']{4,80}["'']\s*\)\s*\.join\s*\(\s*["'']{2}\s*\)'

composite_rules:
# Hidden WMI stage plus an encoded https carrier (UTF-16LE Base64 prefix or
# decoded URL). Catches the next customs-doc HTA that stages a remote PS
# download without hardcoding hostnames.
- id: hta-raw-hidden-encoded-wmi-loader
  desc: HTA hides WMI behind encoded stage
  crit: hostile
  conf: 0.99
  attack: T1027,T1047,T1105,T1564.003
  all:
  - id: hta-raw-wscript-shell
  - id: hta-raw-hidden-wmi-process-stage
  - id: hta-raw-user-environment
  any:
  - id: encoded-remote-url-fragment
  - id: utf16le-b64-https-prefix

- id: hta-raw-wsh-user-environment
  desc: HTA stages through WSH user environment
  crit: suspicious
  conf: 0.97
  all:
  - id: hta-raw-wscript-shell
  - id: hta-raw-user-environment

# Off-screen window + env Item + split-join cleanup around hidden WMI —
# durable shape for pad-junked HTA→PS stagers; kept suspicious so it does
# not stack with the existing for:* unicode-padded hostile on data/text.
- id: hta-raw-offscreen-env-wmi-loader
  desc: Off-screen HTA stages env then hidden WMI
  crit: suspicious
  conf: 0.98
  attack: T1027.002,T1047,T1059.001,T1564.003
  all:
  - id: hta-raw-wscript-shell
  - id: hta-raw-hidden-wmi-process-stage
  - id: hta-raw-offscreen-marker
  - id: hta-raw-user-environment
  # Canonical text matcher — do not duplicate as raw (cross-type dedup).
  - id: hta-environment-item-write
  - id: hta-raw-split-join-cleanup
