defaults:
  platforms: [windows]
  # Junk-padded .hta often classifies as unknown (analyzer skipped — cannot
  # target unknown in for:). Raw fallbacks cover the same dropper when typed
  # as html/text/data (clean HTA, .txt/.dat carriers). Raw filetype cap is 3.
  for: [html, text, data]

# Bounded raw fallbacks catch WMI/WSH staging when junk padding empties
# text extraction (customs-document HTA droppers).
traits:
- id: hta-raw-hidden-wmi-process-stage
  desc: Raw HTA creates hidden WMI process
  crit: notable
  conf: 0.97
  attack: T1047,T1564.003
  mbc: E1043
  if:
    type: raw
    regex: '(?is)SpawnInstance_\s*\(\s*\).{0,700}ShowWindow\s*=\s*0.{0,700}Create\s*\('

- id: hta-raw-user-environment
  desc: Raw HTA accesses user environment
  crit: notable
  conf: 0.96
  if:
    type: raw
    regex: '(?is)Environment\s*\(\s*["'']User["'']\s*\)'

- id: hta-raw-offscreen-marker
  desc: Raw HTA hides its window
  crit: suspicious
  conf: 0.94
  if:
    type: raw
    regex: '(?is)window\.(resizeTo|moveTo)\s*\(.{0,120}(-\d+|0\s*,\s*0)'

# Non-ASCII pad after HTA applicationname — bounded class + literal prefix
# (re-nested / re-perf). Tag identity stays on metadata text trait (dedup).
- id: hta-raw-nonascii-run
  desc: Non-ASCII run near HTA applicationname
  crit: component
  conf: 0.9
  if:
    type: raw
    regex: '(?is)applicationname.{0,800}[^\x00-\x7f]{8,64}'

- id: hta-raw-split-join-cleanup
  desc: Raw HTA strips marker via split-join
  crit: suspicious
  conf: 0.95
  attack: T1027.002
  if:
    type: raw
    regex: '(?is)\.split\s*\(\s*["''][^"'']{4,80}["'']\s*\)\s*\.join\s*\(\s*["'']{2}\s*\)'

# Text Item() writes miss when junk padding empties string extraction.
- id: hta-raw-environment-item-write
  desc: Raw HTA writes a WSH environment item
  crit: suspicious
  conf: 0.97
  if:
    type: raw
    regex: '(?is)\.Item\s*\(\s*["''][A-Za-z_][A-Za-z0-9_]{2,32}["'']\s*\)\s*='

composite_rules:
# Non-ASCII pad near HTA markup. Same id as the former raw regex so
# unicode-padded WMI hostiles keep wiring.
- id: hta-raw-nonascii-padding
  desc: Non-ASCII HTA padding
  crit: suspicious
  conf: 0.96
  all:
  - id: metadata/file/format/markup::hta-application-element
  - id: hta-raw-nonascii-run

# Hidden WMI stage plus an encoded https carrier (UTF-16LE Base64 prefix or
# decoded URL). Catches the next customs-doc HTA that stages a remote PS
# download without hardcoding hostnames.
- id: hta-raw-hidden-encoded-wmi-loader
  desc: HTA hides WMI behind encoded stage
  crit: hostile
  conf: 0.99
  attack: T1027,T1047,T1105,T1564.003
  all:
  - id: micro-behaviors/os/com/object::wscript-shell-activex-constructor
  - id: hta-raw-hidden-wmi-process-stage
  - id: hta-raw-user-environment
  any:
  - id: micro-behaviors/communications/url/encoded::encoded-http-url
  - id: metadata/file/encoded::utf16le-b64-https-prefix

- id: hta-raw-wsh-user-environment
  desc: HTA stages through WSH user environment
  crit: suspicious
  conf: 0.97
  all:
  - id: micro-behaviors/os/com/object::wscript-shell-activex-constructor
  - id: hta-raw-user-environment

# Off-screen window + env Item + split-join cleanup around hidden WMI —
# durable shape for pad-junked HTA→PS stagers; kept suspicious so it does
# not stack with the existing for:* unicode-padded hostile on data/text.
- id: hta-raw-offscreen-env-wmi-loader
  desc: Off-screen HTA stages env then hidden WMI
  crit: suspicious
  conf: 0.98
  attack: T1027.002,T1047,T1059.001,T1564.003
  all:
  - id: micro-behaviors/os/com/object::wscript-shell-activex-constructor
  - id: hta-raw-hidden-wmi-process-stage
  - id: hta-raw-offscreen-marker
  - id: hta-raw-user-environment
  - id: hta-raw-split-join-cleanup
  any:
  - id: hta-raw-environment-item-write
