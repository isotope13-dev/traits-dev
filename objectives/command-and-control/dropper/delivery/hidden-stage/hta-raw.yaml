defaults:
  platforms: [windows]
  for: [html, text, data]

# HTA is not a recognized file type. These bounded raw fallbacks cover HTA
# content when an analyzer cannot classify it, while remaining limited to
# text-like inputs.
traits:
- id: hta-raw-hidden-wmi-process-stage
  desc: Raw HTA creates hidden WMI process
  crit: notable
  conf: 0.97
  attack: T1047,T1564.003
  mbc: E1043
  if:
    type: raw
    regex: '(?is)SpawnInstance_\s*\(\s*\).{0,700}ShowWindow\s*=\s*0.{0,700}(\.\s*)?Create\s*\('

- id: hta-raw-wscript-shell
  desc: Raw HTA creates WScript Shell object
  crit: notable
  conf: 0.96
  if:
    type: raw
    regex: '(?is)ActiveXObject.{0,100}WScript\.Shell'

- id: hta-raw-user-environment
  desc: Raw HTA accesses user environment
  crit: notable
  conf: 0.96
  if:
    type: raw
    regex: '(?is)Environment\s*\(\s*["'']User["'']\s*\)'

- id: hta-encoded-remote-url
  desc: HTA contains encoded remote URL
  crit: notable
  conf: 0.94
  if:
    type: encoded
    regex: '(?i)https?://'

- id: hta-raw-offscreen-marker
  desc: Raw HTA hides its window
  crit: suspicious
  conf: 0.94
  if:
    type: raw
    regex: '(?is)window\.(resizeTo|moveTo)\s*\(.{0,120}(-\d+|0\s*,\s*0)'

composite_rules:
- id: hta-raw-hidden-encoded-wmi-loader
  desc: HTA hides WMI behind encoded stage
  crit: hostile
  conf: 0.99
  attack: T1027,T1047,T1105,T1564.003
  all:
  - id: metadata/file/format::hta-application-element
  - id: hta-raw-hidden-wmi-process-stage
  - id: hta-raw-wsh-user-environment
  - id: hta-encoded-remote-url

- id: hta-raw-wsh-user-environment
  desc: HTA stages through WSH user environment
  crit: suspicious
  conf: 0.97
  all:
  - id: hta-raw-wscript-shell
  - id: hta-raw-user-environment

- id: hta-raw-offscreen-encoded-wmi-loader
  desc: Off-screen HTA launches encoded WMI stage
  crit: hostile
  conf: 0.99
  attack: T1027,T1047,T1105,T1564.003
  all:
  - id: metadata/file/format::hta-application-element
  - id: hta-raw-hidden-wmi-process-stage
  - id: hta-raw-offscreen-marker
  - id: hta-encoded-remote-url
