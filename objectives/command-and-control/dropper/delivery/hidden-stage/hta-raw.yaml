defaults:
  platforms:
  - windows
  for:
  - html
  - text
  - data
traits:
- id: hta-raw-nonascii-run
  desc: Non-ASCII run near HTA applicationname
  crit: notable
  conf: 0.9
  if:
    type: raw
    regex: (?is)applicationname.{0,800}[^\x00-\x7f]{8,64}
composite_rules:
- id: hta-raw-nonascii-padding
  for:
  - html
  - text
  desc: Non-ASCII HTA padding
  crit: suspicious
  conf: 0.96
  all:
  - id: metadata/file/format/markup::hta-application-element
  - id: hta-raw-nonascii-run
- id: hta-padded-hidden-computed-activex-stage
  desc: Junk-padded hidden HTA resolves ActiveX objects at runtime
  crit: hostile
  conf: 0.97
  attack: T1027,T1218.005,T1564.003
  for:
  - html
  all:
  - id: hta-raw-nonascii-padding
  - id: micro-behaviors/ui/window/control::hta-hidden-or-minimized-window-request
  - id: micro-behaviors/os/com/automation::script-computed-activex-object
- id: hta-raw-hidden-encoded-wmi-loader
  desc: HTA hides WMI behind encoded stage
  crit: hostile
  conf: 0.99
  attack: T1027,T1047,T1105,T1564.003
  all:
  - id: micro-behaviors/os/com/automation::wscript-shell-activex-constructor
  - id: micro-behaviors/process/create/exec::wmi-hidden-startup-create-sequence
  - id: micro-behaviors/os/env/read::user-environment-call
  any:
  - id: micro-behaviors/communications/url/encoded::encoded-http-url
  - id: metadata/file/encoded::utf16le-b64-https-prefix
  for:
  - html
  - text
- id: hta-raw-offscreen-env-wmi-loader
  desc: Off-screen HTA stages env then hidden WMI
  crit: suspicious
  conf: 0.98
  attack: T1027.002,T1047,T1059.001,T1564.003
  all:
  - id: micro-behaviors/os/com/automation::wscript-shell-activex-constructor
  - id: micro-behaviors/process/create/exec::wmi-hidden-startup-create-sequence
  - id: micro-behaviors/ui/window/control::script-window-zero-negative-coordinates
  - id: micro-behaviors/os/env/read::user-environment-call
  - id: objectives/anti-static/obfuscation/string/delimiter::registry-encoded-command-substring-cleanup
  any:
  - id: micro-behaviors/data/property/assign::script-item-assignment
  for:
  - html
