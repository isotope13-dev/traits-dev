# RAR listing pairings for ADS-traversal, tiny encrypted carriers, and
# ISO-wrapped CLR droppers. Member content is often typed unknown, so these
# stay on archive-scope facts that already fire on the container.
defaults:
  platforms: [unix, windows]
  for: [rar]
  attack: T1027.002,T1204.002,T1564.004
  crit: hostile
  conf: 0.94

composite_rules:
  - id: rar-ads-startup-dropper
    desc: RAR NTFS stream targets Startup
    scope: file
    all:
      - id: micro-behaviors/data/archive/rar::rar-ntfs-stream-member
      - id: micro-behaviors/data/archive/rar::startup-member-path

  - id: rar-ads-tiny-member
    desc: Tiny RAR uses ADS parent traversal
    scope: file
    all:
      - id: micro-behaviors/data/archive/rar::rar-ntfs-stream-member
      - id: metadata/archive/member/size::archive-member-under-10kb

  - id: rar-startup-tiny-member
    desc: Tiny RAR member targets Startup
    scope: file
    all:
      - id: micro-behaviors/data/archive/rar::startup-member-path
      - id: metadata/archive/member/size::archive-member-under-10kb

  - id: rar-tiny-html-dropper
    desc: Tiny high-entropy RAR ships HTML
    scope: file
    all:
      - id: metadata/file/entropy::tiny-high-entropy-rar
      - id: metadata/archive/member/extension::archive-html-member

  - id: rar-iso-clr-dropper
    desc: RAR wraps a high-entropy CLR image
    scope: file
    all:
      - id: metadata/archive/layout::archive-disk-image-member
      - id: metadata/binary/resource/entropy::clr-resource-high-entropy
    unless:
      - id: metadata/signed/platform/

  - id: rar-iso-high-entropy
    desc: RAR wraps a high-entropy disk image
    scope: file
    all:
      - id: metadata/archive/layout::archive-disk-image-member
      - id: metadata/file/entropy::high-overall-entropy-70
    unless:
      - id: metadata/signed/platform/

  - id: rar-hash-fat-member
    desc: Hash-named RAR wraps a large member
    scope: file
    all:
      - id: metadata/file/entropy::sha256-named-high-entropy-file
      - id: metadata/archive/member/size::archive-member-over-200kb

  - id: rar-ads-tiny-entropy
    desc: Tiny high-entropy RAR uses ADS traversal
    scope: file
    all:
      - id: micro-behaviors/data/archive/rar::ads-parent-traversal
      - id: metadata/file/entropy::tiny-high-entropy-rar

  - id: rar-startup-tiny-entropy
    desc: Tiny high-entropy RAR targets Startup
    scope: file
    all:
      - id: micro-behaviors/data/archive/rar::startup-member-path
      - id: metadata/file/entropy::tiny-high-entropy-rar

  - id: rar-ads-hash-name
    desc: Hash-named RAR uses ADS traversal
    scope: file
    all:
      - id: micro-behaviors/data/archive/rar::ads-parent-traversal
      - id: metadata/file/entropy::sha256-named-high-entropy-file

  - id: rar-ads-traversal-burst-dropper
    desc: RAR ADS name repeats parent traversal
    scope: file
    all:
      - id: micro-behaviors/data/archive/rar::ads-parent-traversal
      - id: micro-behaviors/data/archive/rar::rar-ads-traversal-burst

  - id: rar-startup-traversal-burst
    desc: RAR Startup path repeats parent traversal
    scope: file
    all:
      - id: micro-behaviors/data/archive/rar::startup-member-path
      - id: micro-behaviors/data/archive/rar::rar-ads-traversal-burst

  - id: rar-hash-bat-member
    desc: Hash-named RAR wraps a batch member
    scope: file
    all:
      - id: metadata/file/entropy::sha256-named-high-entropy-file
      - id: metadata/archive/member/extension::archive-bat-member

  - id: rar-iso-template-stub
    desc: RAR image wraps a template PE stub
    scope: file
    all:
      - id: metadata/archive/layout::archive-disk-image-member
      - id: metadata/build/manifest::pe-manifest-myapplication-template
    unless:
      - id: metadata/signed/platform/

  - id: rar-hash-msi-member
    desc: Hash-named RAR wraps a Windows installer
    scope: file
    all:
      - id: metadata/file/entropy::sha256-named-high-entropy-file
      - id: metadata/archive/member/extension::archive-msi-member

  - id: rar-hash-exe-member
    desc: Hash-named RAR wraps a Windows executable
    scope: file
    all:
      - id: metadata/file/entropy::sha256-named-high-entropy-file
      - id: metadata/archive/member/extension::archive-windows-executable-entry

  - id: rar-lure-unsigned-exe
    desc: RAR unsigned business-lure executable
    scope: archive
    for: [rar, pe]
    all:
      - id: micro-behaviors/data/archive/rar::lure-exe-member-name
      - id: metadata/signed/trust-level::unsigned-missing-signature-record

  - id: rar-rtlo-unsigned-exe
    desc: RAR RTLO-named unsigned executable
    scope: archive
    for: [rar, pe]
    all:
      - id: objectives/anti-static/pack/archive::apk-rtlo-member-name
      - id: metadata/archive/member/extension::archive-windows-executable-entry
      - id: metadata/signed/trust-level::unsigned-missing-signature-record

  - id: rar-hash-nested-rar
    desc: Hash-named RAR wraps a nested RAR
    scope: file
    all:
      - id: metadata/file/entropy::sha256-named-high-entropy-file
      - id: metadata/archive/member/extension::archive-nested-rar-member

  - id: rar-hash-html-member
    desc: Hash-named RAR wraps an HTML member
    scope: file
    all:
      - id: metadata/file/entropy::sha256-named-high-entropy-file
      - id: metadata/archive/member/extension::archive-html-member

  - id: rar-hash-tiny-member
    desc: Hash-named RAR has a small member
    scope: file
    all:
      - id: metadata/file/entropy::sha256-named-high-entropy-file
      - id: metadata/archive/member/size::archive-member-under-10kb

  - id: rar-fat-batch-destructive-cleaner
    desc: RAR ships destructive batch disk and log cleanup
    scope: archive
    for: [rar, batch]
    attack: T1204.002,T1485,T1070.001
    all:
      - id: metadata/archive/layout::rar-large-member-with-code-member
      - id: metadata/archive/member/extension::archive-bat-member
      - id: objectives/impact/degrade/system/desktop::batch-mass-rd-eventlog-wipe
    unless:
      - id: metadata/path::test-directory-component
      - id: metadata/archive/layout::archive-readme-with-web-members

  - id: rar-tiny-lure-exe
    desc: Tiny high-entropy RAR names a business-lure executable
    scope: file
    all:
      - id: metadata/file/entropy::tiny-high-entropy-rar
      - id: metadata/build/archive::archive-business-lure-exe-member

  - id: rar-tiny-lure-png
    desc: Tiny high-entropy RAR4 ships a lure-named PNG
    scope: file
    all:
      - id: metadata/file/entropy::tiny-high-entropy-rar4
      - id: metadata/archive/member/filename::archive-invoice-named-png-member

  - id: rar-tiny-shell-pipe-member
    desc: Tiny RAR member name is a pipeline
    scope: file
    all:
      - id: metadata/file/entropy::tiny-high-entropy-rar
      - id: metadata/archive/member/filename::archive-shell-pipe-member

  - id: rar-irc-bot-source
    desc: RAR ships an IRC-bot source tree
    scope: file
    all:
      - id: metadata/archive/member/path::archive-irc-bot-source-member
      - id: metadata/archive/layout::archive-at-least-10-members

  - id: rar-msi-header-hash
    desc: Hash-named RAR header names an MSI
    scope: file
    all:
      - id: metadata/file/entropy::sha256-named-high-entropy-file
      - id: micro-behaviors/data/archive/rar::msi-member-extension

  - id: rar-tiny-lure-exe-header
    desc: Tiny RAR header names a lure executable
    scope: file
    all:
      - id: metadata/file/entropy::tiny-high-entropy-rar
      - id: micro-behaviors/data/archive/rar::lure-exe-member-name

  - id: rar-stub-lure-exe
    desc: Tiny RAR5 stub names a lure executable
    scope: file
    all:
      - id: "metadata/file/size::tiny-rar5-container"
      - id: micro-behaviors/data/archive/rar::lure-exe-member-name

  - id: rar4-stub-lure-exe
    desc: Tiny RAR4 stub names a lure executable
    scope: file
    all:
      - id: "metadata/file/size::tiny-rar4-container"
      - id: micro-behaviors/data/archive/rar::lure-exe-member-name

  - id: rar-hash-setup-exe
    desc: Hash-named RAR names a setup executable
    scope: file
    all:
      - id: metadata/file/entropy::sha256-named-high-entropy-file
      - id: micro-behaviors/data/archive/rar::setup-exe-member-name

  - id: rar-hash-setup-msi
    desc: Hash-named RAR names a setup MSI
    scope: file
    all:
      - id: metadata/file/entropy::sha256-named-high-entropy-file
      - id: micro-behaviors/data/archive/rar::installer-msi-member-name

  - id: rar-hash-html-header
    desc: Hash-named RAR header names HTML
    scope: file
    all:
      - id: metadata/file/entropy::sha256-named-high-entropy-file
      - id: micro-behaviors/data/archive/rar::html-member-extension

  - id: rar-tiny-hidden-run
    desc: Tiny high-entropy RAR hides a windowed run
    scope: file
    all:
      - id: metadata/file/entropy::tiny-high-entropy-rar
      - id: micro-behaviors/data/control-flow/dispatch::run-zero-style-argument

  - id: rar-tiny-mshta
    desc: Tiny high-entropy RAR invokes mshta
    scope: file
    all:
      - id: metadata/file/entropy::tiny-high-entropy-rar
      - id: micro-behaviors/fs/path/application/executable::mshta-name-reference

  - id: rar-tiny-pdf-header
    desc: Tiny high-entropy RAR header names a PDF
    scope: file
    all:
      - id: metadata/file/entropy::tiny-high-entropy-rar
      - id: micro-behaviors/data/archive/rar::pdf-member-extension

  - id: rar-hash-cheat-exe
    desc: Hash-named RAR names a game cheat
    scope: file
    all:
      - id: metadata/file/entropy::sha256-named-high-entropy-file
      - id: micro-behaviors/data/archive/rar::game-cheat-member-name

  - id: rar-encrypted-windows-executable
    desc: Encrypted RAR conceals a Windows executable
    # Encryption plus an executable member is meaningful delivery evidence,
    # but password-protected software and AV regression fixtures are legitimate
    # uses.  The sole-member variant below retains the more precise shape.
    crit: suspicious
    scope: file
    all:
      - id: metadata/archive/encryption::archive-encrypted-member
      - id: metadata/archive/member/extension::archive-windows-executable-entry
    unless:
      - id: metadata/archive/layout::archive-sole-member

  - id: rar-encrypted-windows-installer
    desc: Encrypted RAR conceals a Windows installer
    scope: file
    all:
      - id: metadata/archive/encryption::archive-encrypted-member
      - id: metadata/archive/member/extension::archive-msi-member

  - id: rar-encrypted-nested-archive
    desc: Encrypted RAR nests another archive
    scope: file
    all:
      - id: metadata/archive/encryption::archive-encrypted-member
      - id: metadata/archive/member/extension::archive-nested-rar-member

  - id: rar-encrypted-sole-executable
    desc: Encrypted RAR hides a lone executable
    crit: suspicious
    scope: file
    all:
      - id: metadata/archive/encryption::archive-encrypted-member
      - id: metadata/archive/layout::archive-sole-member
      - id: metadata/archive/member/extension::archive-windows-executable-entry

  - id: rar-ads-vbs-startup
    desc: RAR ADS drops VBS into Startup
    scope: file
    all:
      - id: micro-behaviors/data/archive/rar::rar-ntfs-stream-member
      - id: micro-behaviors/data/archive/rar::vbs-script-member-extension

  - id: rar-encrypted-paired-executable
    desc: Encrypted RAR conceals paired executables
    scope: file
    # A full application archive can password-protect the program and a
    # second executable. The dropper shape is a small carrier.
    size_max: 67108864
    all:
      - id: metadata/archive/encryption::archive-encrypted-member
      - id: metadata/archive/layout::archive-paired-executable-members

  - id: rar-hash-png-member
    desc: Hash-named RAR ships a PNG member
    scope: file
    all:
      - id: metadata/file/entropy::sha256-named-high-entropy-file
      - id: micro-behaviors/data/archive/rar::png-member-extension

  - id: rar-hash-busy-archive
    desc: Hash-named RAR contains many members
    scope: file
    all:
      - id: metadata/file/entropy::sha256-named-high-entropy-file
      - id: metadata/archive/layout::archive-at-least-10-members

  - id: rar-ads-busy-archive
    desc: RAR NTFS stream sits in a busy archive
    scope: file
    all:
      - id: micro-behaviors/data/archive/rar::rar-ntfs-stream-member
      - id: metadata/archive/layout::archive-at-least-10-members

  - id: rar-stub-misplaced-exe
    desc: Tiny RAR stub names a misplaced executable
    scope: file
    unless:
      # Zero-byte executables cannot be launched from this archive.
      - id: metadata/archive/layout::archive-uncompressed-size-zero
    all:
      - id: "metadata/file/size::tiny-rar5-container"
      - id: metadata/archive/layout::archive-misplaced-executable-member

  - id: rar4-stub-misplaced-exe
    desc: Tiny RAR4 stub names a misplaced executable
    scope: file
    all:
      - id: "metadata/file/size::tiny-rar4-container"
      - id: metadata/archive/layout::archive-misplaced-executable-member

  - id: rar-encrypted-irc-bot
    desc: Encrypted RAR ships IRC-bot sources
    scope: file
    all:
      - id: metadata/archive/encryption::archive-encrypted-member
      - id: metadata/archive/member/path::archive-irc-bot-source-member

  - id: rar-encrypted-rat-payload
    desc: Encrypted RAR conceals a RAT executable
    scope: outer
    all:
      - id: metadata/archive/encryption::archive-encrypted-member
      - id: metadata/archive/member/filename::archive-rat-named-member

  - id: rar-tiny-encrypted-batch
    desc: Tiny encrypted RAR ships a batch launcher
    scope: file
    all:
      - id: metadata/file/entropy::tiny-high-entropy-rar
      - id: metadata/archive/encryption::archive-encrypted-member

  - id: rar-png-batch-launcher
    desc: RAR pairs a PNG lure with a batch launcher
    scope: file
    crit: notable
    all:
      - id: micro-behaviors/data/archive/rar::png-member-extension
      - id: metadata/archive/member/extension::archive-bat-member

  - id: rar-hash-huge-member
    desc: Hash-named RAR hides a 10MB-plus member
    scope: file
    all:
      - id: metadata/file/entropy::sha256-named-high-entropy-file
      - id: metadata/archive/member/size::member-at-least-10mb

  - id: rar-ads-office-lure
    desc: RAR NTFS stream rides an Office lure
    scope: file
    all:
      - id: micro-behaviors/data/archive/rar::rar-ntfs-stream-member
      - id: metadata/document/office/properties::office-application-microsoft-office

  - id: rar-hash-cab-lure-script
    desc: Hash-named RAR uses a CAB-style script lure
    scope: file
    all:
      - id: metadata/file/entropy::sha256-named-high-entropy-file
      - id: objectives/command-and-control/dropper/delivery/cab::cab-lure-script-member-a

  - id: rar-tiny-batch-member
    desc: Tiny high-entropy RAR ships a batch member
    scope: file
    crit: notable
    all:
      - id: metadata/file/entropy::tiny-high-entropy-rar
      - id: metadata/archive/member/extension::archive-bat-member

  - id: rar-tiny-js-member
    desc: Tiny high-entropy RAR ships JavaScript
    scope: file
    all:
      - id: metadata/file/entropy::tiny-high-entropy-rar
      - id: metadata/archive/member/extension::archive-js-member

  - id: rar4-tiny-nonascii-exe
    desc: Tiny RAR4 names a non-ASCII executable
    scope: file
    all:
      - id: metadata/file/entropy::tiny-high-entropy-rar4
      - id: metadata/build/archive::archive-nonascii-exe-member

  - id: rar-hash-audio-member
    desc: Hash-named RAR ships an audio member
    scope: file
    all:
      - id: metadata/file/entropy::sha256-named-high-entropy-file
      - id: metadata/archive/member/extension::archive-audio-member

  - id: rar-hash-stego-image
    desc: Hash-named RAR ships a stego-tailed image
    scope: file
    all:
      - id: metadata/file/entropy::sha256-named-high-entropy-file
      - id: objectives/command-and-control/dropper/delivery/stego::image-tail-payload-marker
