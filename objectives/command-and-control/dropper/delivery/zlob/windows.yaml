defaults:
  platforms: [windows]
  for: [pe]
  arch: [x86]
  size_min: 50000
  size_max: 150000
  attack: T1105

composite_rules:
  - id: zlob-policies-run-dynamic-wininet-dropper
    desc: Zlob Policies Explorer Run dynamic WinInet dropper
    crit: hostile
    conf: 0.97
    attack: T1105,T1547.001
    all:
      - id: objectives/persistence/login/multi-technique::policies-explorer-run-key-path
      - id: micro-behaviors/communications/http/dynamic::dynamic-wininet-http-api-cluster
      - id: metadata/signed/trust-level::unsigned-missing-signature-record
      - id: micro-behaviors/process/create/spawn::child-process-creation-api

  - id: zlob-security-dir-embedded-carrier
    desc: Zlob certificate-region embedded PE with WinInet staging
    crit: hostile
    conf: 0.96
    attack: T1553.002,T1105
    all:
      - id: metadata/binary/layout/embedded::embedded-dos-header-tail
      - id: metadata/binary/layout/embedded::pe-embedded
      - id: metadata/signed/trust-level::unsigned-missing-signature-record
      - id: micro-behaviors/communications/http/dynamic::dynamic-wininet-http-api-cluster
