# Traffic-direction-system (TDS) gateway delivery. A TDS sits between the
# compromised page and the payload: the visitor's frame or script hits the
# gateway (`in.cgi?<campaign>` is the canonical entry-script path), and the
# gateway decides whether and which exploit or download to serve. Chaining a
# browser frame at the gateway is drive-by delivery infrastructure, not
# analytics: content and tracking endpoints do not use campaign-keyed CGI
# gate scripts.
defaults:
  platforms: [windows, unix]
  for: [html]
  attack: T1189

composite_rules:
  - id: tds-gateway-iframe-delivery
    desc: Hidden iframe delivers through in.cgi TDS gateway
    crit: hostile
    conf: 0.96
    attack: T1189,T1105
    near_bytes: 400
    all:
      - id: micro-behaviors/communications/http/url/path::in-cgi-gateway-script-url
      - id: micro-behaviors/communications/http/client/resource::external-iframe-element-load
      - id: micro-behaviors/ui/window/visibility::tiny-iframe-unquoted-zero
