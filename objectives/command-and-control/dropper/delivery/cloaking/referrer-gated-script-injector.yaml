  # The three-character table below uses a different tokenization from the
  # older packed-search profile above. These fragments jointly recover a
  # search-provider referrer test, a remote Ajax script request, and evaluation
  # of that request's callback value. Individual fragments remain components.
  - id: table-google-open-quote
    desc: Token table has Google opening fragment
    crit: component
    conf: 0.95
    if: { type: text, regex: '[A-Za-z_$][A-Za-z0-9_$]*\["[A-Za-z0-9]{3}"\]\s*=\s*"(\\")?go"' }
