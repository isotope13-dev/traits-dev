      - id: table-http-host-open

  - id: table-search-referrer-response-eval
    desc: Search-referrer gate evaluates a remote Ajax script response
    crit: hostile
    conf: 0.97
    attack: T1189,T1105,T1059.007,T1027.002
    near_bytes: 6000
    all:
