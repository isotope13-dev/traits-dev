# Referrer-gated obfuscated script injection on compromised pages: the
# injector reads document.referrer and only proceeds for off-site visitors,
# decodes its payload identifiers through an atob wrapper, then builds a
# remote script element and inserts it before the first script. The
# once-per-victim localStorage flag and the Windows-not-Android userAgent
# check are common refinements; the required legs above already name the
# cloaked remote-script delivery, so refinements corroborate rather than gate.
defaults:
  platforms: [windows, unix]
  for: [html, javascript]
  attack: T1189,T1105,T1027
  mbc: B0024
traits:
  # These short fragments only make sense together as the hidden program
  # recovered from the indexed token dictionary. Keep them as components;
  # the hostile rule also requires that this dictionary feed eval.
  - id: token-ref-fragment
    desc: Token table contains referrer fragment
    crit: component
    conf: 0.95
    if:
      type: text
      regex: 'z\["[A-Za-z0-9]{3}"\]\s*=\s*"ref"'
  - id: token-err-fragment
    desc: Token table contains referrer suffix fragment
    crit: component
    conf: 0.95
    if:
      type: text
      regex: 'z\["[A-Za-z0-9]{3}"\]\s*=\s*"err"'
  - id: token-goo-fragment
    desc: Token table contains search-engine name fragment
    crit: component
    conf: 0.95
    if:
      type: text
      regex: 'z\["[A-Za-z0-9]{3}"\]\s*=\s*"goo"'
  - id: token-gle-fragment
    desc: Token table contains search-engine name fragment
    crit: component
    conf: 0.95
    if:
      type: text
      regex: 'z\["[A-Za-z0-9]{3}"\]\s*=\s*"gle"'
  - id: token-aja-fragment
    desc: Token table contains Ajax request fragment
    crit: component
    conf: 0.95
    if:
      type: text
      regex: 'z\["[A-Za-z0-9]{3}"\]\s*=\s*"aja"'
  - id: token-jax-fragment
    desc: Token table contains Ajax request fragment
    crit: component
    conf: 0.95
    if:
      type: text
      regex: 'z\["[A-Za-z0-9]{3}"\]\s*=\s*"jax"'
  - id: token-dat-fragment
    desc: Token table contains data option fragment
    crit: component
    conf: 0.95
    if:
      type: text
      regex: 'z\["[A-Za-z0-9]{3}"\]\s*=\s*"Dat"'
  - id: token-typ-fragment
    desc: Token table contains type option fragment
    crit: component
    conf: 0.95
    if:
      type: text
      regex: 'z\["[A-Za-z0-9]{3}"\]\s*=\s*"typ"'
  - id: token-scr-fragment
    desc: Token table contains script response fragment
    crit: component
    conf: 0.95
    if:
      type: text
      regex: 'z\["[A-Za-z0-9]{3}"\]\s*=\s*"scr"'
  - id: token-ipt-fragment
    desc: Token table contains script response fragment
    crit: component
    conf: 0.95
    if:
      type: text
      regex: 'z\["[A-Za-z0-9]{3}"\]\s*=\s*"ipt"'
  - id: token-ucc-fragment
    desc: Token table contains callback fragment
    crit: component
    conf: 0.95
    if:
      type: text
      regex: 'z\["[A-Za-z0-9]{3}"\]\s*=\s*"ucc"'
  - id: token-ess-fragment
    desc: Token table contains callback fragment
    crit: component
    conf: 0.95
    if:
      type: text
      regex: 'z\["[A-Za-z0-9]{3}"\]\s*=\s*"ess"'
  - id: token-e-data-fragment
    desc: Token table contains response variable fragment
    crit: component
    conf: 0.95
    if:
      type: text
      regex: 'z\["[A-Za-z0-9]{3}"\]\s*=\s*"eDa"'
  - id: token-nse-fragment
    desc: Token table contains response variable fragment
    crit: component
    conf: 0.95
    if:
      type: text
      regex: 'z\["[A-Za-z0-9]{3}"\]\s*=\s*"nse"'
  - id: token-eva-fragment
    desc: Token table contains eval fragment
    crit: component
    conf: 0.95
    if:
      type: text
      regex: 'z\["[A-Za-z0-9]{3}"\]\s*=\s*"eva"'
  - id: token-root-path-fragment
    desc: Token table contains root-relative request path
    crit: component
    conf: 0.95
    if:
      type: text
      regex: 'z\["[A-Za-z0-9]{3}"\]\s*=\s*"///"'
composite_rules:
  - id: referrer-gated-encoded-script-injector
    desc: Referrer-gated decode drives remote script injection
    crit: hostile
    conf: 0.97
    all:
      - id: micro-behaviors/communications/http/url/navigation::browser-document-referrer-conditional
      - id: micro-behaviors/data/decode/base64::base64-decode-call-text
      - id: micro-behaviors/data/collection/dom::script-create-near-src-assignment
    any:
      - id: micro-behaviors/data/collection/dom::insert-before-call
      - id: micro-behaviors/communications/http/url/encoded::base64-decoded-http-url
    # Bind the gate to the delivery: without proximity, unrelated utilities
    # co-occurring in one large bundle (analytics referrer checks, a generic
    # base64 helper, a JS/CSS loader, a stylesheet insertBefore) convict.
    near_bytes: 2400

  # Packed legacy injectors may fetch executable JavaScript through jQuery's
  # `dataType: 'script'` success callback instead of inserting a script node.
  # The token table is the input to eval, and this profile requires fragments
  # for the search-referrer gate, script response, callback eval, and the
  # unusual same-origin request path in that same compact packed stage.
  - id: packed-search-referrer-response-eval-markers
    desc: Packed table contains search-referrer response-eval markers
    crit: component
    conf: 0.96
    all:
      - id: token-ref-fragment
      - id: token-err-fragment
      - id: token-goo-fragment
      - id: token-gle-fragment
      - id: token-aja-fragment
      - id: token-jax-fragment
      - id: token-dat-fragment
      - id: token-typ-fragment
      - id: token-scr-fragment
      - id: token-ipt-fragment
      - id: token-ucc-fragment
      - id: token-ess-fragment
      - id: token-e-data-fragment
      - id: token-nse-fragment
      - id: token-eva-fragment
      - id: token-root-path-fragment
    near_bytes: 6000

  - id: packed-search-referrer-response-eval
    desc: Search-referrer gate evals Ajax callback value
    crit: hostile
    conf: 0.97
    attack: T1189,T1105,T1059.007,T1027.002
    near_bytes: 6000
    all:
      - id: objectives/anti-static/obfuscation/eval/browser::dictionary-fed-eval-obfuscation
      - id: packed-search-referrer-response-eval-markers
