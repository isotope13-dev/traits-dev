# Referrer-gated obfuscated script injection on compromised pages: the
# injector reads document.referrer and only proceeds for off-site visitors,
# decodes its payload identifiers through an atob wrapper, then builds a
# remote script element and inserts it before the first script. The
# once-per-victim localStorage flag and the Windows-not-Android userAgent
# check are common refinements; the required legs above already name the
# cloaked remote-script delivery, so refinements corroborate rather than gate.
defaults:
  platforms: [windows, unix]
  for: [html, javascript]
  attack: T1189,T1105,T1027
  mbc: B0024
composite_rules:
  - id: referrer-gated-encoded-script-injector
    desc: Referrer-gated decode drives remote script injection
    crit: hostile
    conf: 0.97
    all:
      - id: micro-behaviors/communications/http/url/navigation::browser-document-referrer-conditional
      - id: micro-behaviors/data/decode/base64::base64-decode-call-text
      - id: micro-behaviors/process/deploy::dynamic-script-element-load
    any:
      - id: micro-behaviors/data/collection/dom::insert-before-call
      - id: micro-behaviors/communications/http/url/encoded::base64-decoded-http-url
    # Bind the gate to the delivery: without proximity, unrelated utilities
    # co-occurring in one large bundle (analytics referrer checks, a generic
    # base64 helper, a JS/CSS loader, a stylesheet insertBefore) convict.
    near_bytes: 2400
