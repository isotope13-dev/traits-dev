composite_rules:
  - id: referrer-gated-encoded-script-injector
    desc: Referrer-gated decode drives remote script injection
    crit: hostile
    conf: 0.97
    all:
      - id: micro-behaviors/communications/url/navigation-http::browser-document-referrer-conditional
      - id: micro-behaviors/data/decode/base64::base64-decode-call-text
      - id: micro-behaviors/data/collection/dom::script-create-near-src-assignment
    any:
      - id: micro-behaviors/data/collection/dom::insert-before-call
      - id: micro-behaviors/communications/url/http-encoded::base64-decoded-http-url
    # Bind the gate to the delivery: without proximity, unrelated utilities
    # co-occurring in one large bundle (analytics referrer checks, a generic
    # base64 helper, a JS/CSS loader, a stylesheet insertBefore) convict.
    near_bytes: 2400

  # Packed legacy injectors may fetch executable JavaScript through jQuery's
  # `dataType: 'script'` success callback instead of inserting a script node.
  # The token table is the input to eval, and this profile requires fragments
  # for the search-referrer gate, script response, callback eval, and the
  # unusual same-origin request path in that same compact packed stage.
  - id: packed-search-referrer-response-eval-markers
    desc: Packed table contains search-referrer response-eval markers
    crit: component
    conf: 0.96
    all:
      - id: token-ref-fragment
      - id: token-err-fragment
      - id: token-goo-fragment
      - id: token-gle-fragment
      - id: token-aja-fragment
      - id: token-jax-fragment
      - id: token-dat-fragment
      - id: token-typ-fragment
      - id: token-scr-fragment
      - id: token-ipt-fragment
      - id: token-ucc-fragment
      - id: token-ess-fragment
      - id: token-e-data-fragment
      - id: token-nse-fragment
      - id: token-eva-fragment
      - id: token-root-path-fragment
    near_bytes: 6000

  - id: packed-search-referrer-response-eval
    desc: Search-referrer gate evals Ajax callback value
    crit: hostile
    conf: 0.97
    attack: T1189,T1105,T1059.007,T1027.002
    near_bytes: 6000
    all:
      - id: objectives/anti-static/obfuscation/eval/browser::dictionary-fed-eval-obfuscation
      - id: packed-search-referrer-response-eval-markers

  # Two-character packed tables cannot satisfy the three-character marker
  # profile. Require fragments covering document.referrer, a search-engine
  # branch, jQuery's script dataType/success callback, the callback response,
  # and eval sink in the same compact table-fed stage.
  - id: pair-table-search-referrer-response-eval-markers
    desc: Packed two-character response-eval markers
    crit: component
    conf: 0.96
    near_bytes: 6000
    all:
      - id: micro-behaviors/data/string/concat::js-indexed-token-table
      - id: pair-value-oc
      - id: pair-value-um
      - id: pair-value-en
      - id: pair-value-t-dot
      - id: pair-value-re
      - id: pair-value-fe
      - id: pair-value-rr
      - id: pair-value-er
      - id: pair-value-oo
      - id: pair-value-gl
      - id: pair-value-le
      - id: pair-value-dot-a
      - id: pair-value-ja
      - id: pair-value-x-paren
      - id: pair-value-da
      - id: pair-value-Ty
      - id: pair-value-pe
      - id: pair-value-sc
      - id: pair-value-ri
      - id: pair-value-pt
      - id: pair-value-uc
      - id: pair-value-ce
      - id: pair-value-ss
      - id: pair-value-sp
      - id: pair-value-on
      - id: pair-value-se
      - id: pair-value-va
      - id: pair-value-l-paren

  - id: pair-table-search-referrer-response-eval
    desc: Two-character packed search-referrer gate evals Ajax response
    crit: hostile
    conf: 0.97
    attack: T1189,T1105,T1059.007,T1027.002
    near_bytes: 6000
    all:
      - id: objectives/anti-static/obfuscation/eval/browser::dictionary-fed-eval-obfuscation
      - id: pair-table-search-referrer-response-eval-markers

  # A second three-character table layout may split Google, Ajax, script,
  # responseData, and eval differently from the older token profile. Requiring
  # each semantic fragment plus a table-fed eval links the concealed gate to
  # the remote JavaScript response sink without depending on the chosen host.
  - id: table-search-referrer-response-eval-markers
    desc: Three-character table contains search-gated remote response-eval markers
    crit: component
    conf: 0.96
    near_bytes: 6000
    all:
