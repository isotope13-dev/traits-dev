defaults:
  platforms: [windows, unix]
  for: [javascript]
  attack: T1189,T1105,T1027

composite_rules:
  # Literal-table decoding supplies a separate source layer. Require both the
  # concealment mechanism and the recovered callback's actual response-to-eval
  # binding. A remote script tag, referrer read or token vocabulary alone is
  # insufficient; generated table names, chunk sizes and hosts are not gates.
  - id: dictionary-concealed-referrer-ajax-eval
    desc: Concealed referrer script evaluates remote Ajax response
    crit: hostile
    conf: 0.97
    size_max: 200000
    all:
      - id: metadata/lang/encoded/javascript-literal-program
      - id: micro-behaviors/communications/http/url/navigation::browser-document-referrer-read
      - id: micro-behaviors/process/deploy/script-eval::jquery-script-success-response-eval
