# Obfuscator.io npm cover: string-table EtherHiding stage that queries a
# public Ethereum RPC/explorer dead-drop, then fetches XOR-wrapped JS from
# `:443/0x/ls` / `:443/0x/cl` (NullReceiver / @wizloft 0.1.1-alpha.3 class).
- id: obfuscated-etherhiding-hex-stage-dropper
  desc: Obfuscated EtherHiding hex-path stage dropper
  crit: hostile
  conf: 0.97
  attack: "T1102,T1105,T1027,T1059.007"
  mbc: "B0024,B0032"
  for: [javascript, typescript]
  all:
    - id: objectives/anti-static/obfuscation/obfuscator/js-obfuscator::global-alias-obfuscation
    - id: etherhiding-hex-stage-path
  any:
    - id: objectives/command-and-control/infrastructure/blockchain/ethereum::etherhiding-campaign-wallet-prefix
    - id: objectives/command-and-control/infrastructure/blockchain/ethereum::etherhiding-campaign-wallet-prefix-unicode
    - id: micro-behaviors/communications/http/url/rpc::ethereum-drpc-host-fragment
    - id: micro-behaviors/communications/http/url/rpc::ethereum-1rpc-path-fragment
    - id: micro-behaviors/crypto/library/blockchain/client::blockscout-host-fragment

# Compiled and source implementations may retain the dead-drop path and
# wallet/RPC marker without JavaScript obfuscator or Node-specific evidence.
# Pair those transport markers with a platform child-process capability so a
# PE/ELF/source loader can be caught even when no URL is reconstructed in AST.
- id: blockchain-hex-dead-drop-process-stage
  desc: Blockchain hex dead drop paired with child-process staging
  crit: hostile
  conf: 0.97
  attack: T1102,T1105,T1106
  for: [binaries, scripts, source]
  all:
    - id: etherhiding-hex-stage-path
    - id: micro-behaviors/process/create/spawn::child-process-creation-api
  any:
    - id: objectives/command-and-control/infrastructure/blockchain/ethereum::etherhiding-campaign-wallet-prefix
    - id: micro-behaviors/communications/http/url/rpc::ethereum-drpc-host-fragment
    - id: micro-behaviors/communications/http/url/rpc::ethereum-1rpc-path-fragment
    - id: micro-behaviors/crypto/library/blockchain/client::blockscout-host-fragment

- id: etherhiding-wallet-stage-payload-header
  desc: EtherHiding wallet dead-drop with x-payload stage header
  crit: hostile
  conf: 0.96
  attack: "T1102,T1105,T1027"
  mbc: "B0024"
  for: [javascript, typescript]
  all:
    - id: etherhiding-hex-stage-path
    - id: micro-behaviors/communications/http/response::x-payload-header-prefix
  any:
    - id: objectives/command-and-control/infrastructure/blockchain/ethereum::etherhiding-campaign-wallet-prefix
    - id: objectives/command-and-control/infrastructure/blockchain/ethereum::etherhiding-campaign-wallet-prefix-unicode
  unless:
    - id: obfuscated-etherhiding-hex-stage-dropper
