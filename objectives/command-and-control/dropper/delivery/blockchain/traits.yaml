defaults:
  platforms:
  - windows
  - unix
  for:
  - javascript
  - python
  - shell
traits:
- id: blockchain-explorer-link--rx-1
  desc: Matches 'tronscan.org'
  crit: notable
  conf: 0.75
  unless:
  - id: metadata/file/format/source-map::sourcemap
  - id: metadata/file/naming::js-distribution-output-path
  if:
    type: text
    regex: (?i)(tronscan\.org|bscscan\.com)
- id: blockchain-explorer-link--rx-2
  desc: Matches 'polygonscan.com'
  crit: notable
  conf: 0.75
  unless:
  - id: metadata/file/format/source-map::sourcemap
  - id: metadata/file/naming::js-distribution-output-path
  if:
    type: text
    regex: (?i)(etherscan\.io|polygonscan\.com)
- id: blockchain-explorer-link--rx-3
  desc: Solscan or Aptos explorer hostname
  crit: notable
  conf: 0.75
  if:
    type: text
    regex: (?i)(solscan\.io|aptoslabs\.com)
- id: blockchain-explorer-link--rx-5
  desc: Matches 'etherscan-api'
  crit: notable
  conf: 0.75
  if:
    type: text
    regex: (?i)(etherscan-api|bscscan-api)
- id: blockchain-hex-stage-path
  desc: Blockchain C2 hex-prefixed stage path
  crit: suspicious
  conf: 0.96
  attack: T1105
  for:
  - scripts
  - typescript
  - binaries
  if:
    type: text
    regex: (?i)(:?443)?/0x/(c?ls|cl)\b
- id: blockchain-transaction-payload-source
  desc: Source names blockchain transaction payload
  crit: notable
  conf: 0.95
  for:
  - javascript
  if:
    type: text
    substr: blockchain transaction
  unless:
    - id: well-known/tool/detection/pattern-catalog::js-threat-data-catalog
    # Crypto payment plugins name blockchain transactions throughout their
    # docs and messages as ordinary product vocabulary; a dead-drop loader
    # needs the RPC/eval/spawn legs, never this substring alone.
    - id: well-known/app/publishing/wordpress-plugins/commerce::wordpress-plugin-path-payments
    - id: well-known/lib/cloud/aws-sdk-js/

