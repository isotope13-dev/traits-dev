# Blockchain-Staged Payload Delivery
# Detects retrieval of payloads from blockchain explorers or smart contracts.
# ATT&CK: T1105 (Ingress Tool Transfer)
defaults:
  platforms: [windows, unix]
  for: [javascript, python, shell]
traits:
- id: blockchain-explorer-link--rx-1
  desc: Regex component marker
  crit: component
  conf: 0.75
  if:
    type: text
    regex: '(?i)(tronscan\.org|bscscan\.com)'

  count_max: 1007389
- id: blockchain-explorer-link--rx-2
  desc: Regex component marker
  crit: component
  conf: 0.75
  if:
    type: text
    regex: '(?i)(etherscan\.io|polygonscan\.com)'

  count_max: 1007390
- id: blockchain-explorer-link--rx-3
  desc: Regex component marker
  crit: component
  conf: 0.75
  if:
    type: text
    regex: '(?i)(solscan\.io|aptoslabs\.com)'

  count_max: 1007391
- id: blockchain-explorer-link--rx-4
  desc: Regex component marker
  crit: component
  conf: 0.75
  if:
    type: text
    regex: '(?i)(trongrid\.io|api\.blockcypher\.com)'

  count_max: 1007392
- id: blockchain-explorer-link--rx-5
  desc: Regex component marker
  crit: component
  conf: 0.75
  if:
    type: text
    regex: '(?i)(etherscan-api|bscscan-api)'
  count_max: 1007393

# NullReceiver / EtherHiding stages fetch XOR-wrapped JavaScript from an
# attacker-derived host on :443 using this campaign route. The route is an
# attack-specific delivery indicator, not a neutral HTTP capability.
- id: etherhiding-hex-stage-path
  desc: EtherHiding hex-prefixed second-stage HTTP path
  crit: suspicious
  conf: 0.96
  attack: T1105
  for: [scripts, typescript, binaries]
  if:
    type: text
    # Campaign variants use /0x/ls and /0x/cls (or truncated /0x/cl).
    # Prefer longer alternatives first.
    regex: '(?i):?443/0x/(ls|cls|cl)\b|/0x/(ls|cls|cl)\b'

composite_rules:
- id: etherhiding-rpc-account-stage-loader
  desc: Obfuscated EtherHiding RPC account stage loader
  crit: hostile
  conf: 0.98
  attack: "T1102,T1105,T1059.007"
  mbc: "B0024,B0032"
  for: [javascript, typescript]
  near_lines: 80
  all:
    - id: objectives/anti-static/obfuscation/obfuscator/js-obfuscator::global-require-module-aliasing
    - id: micro-behaviors/communications/http/services/blockchain::eth-drpc-host-fragment
    - id: micro-behaviors/communications/http/services/blockchain::explorer-module-account-fragment

- id: ethereum-blockchain-derived-node-stage
  desc: Ethereum history lookup derives network addresses for a remote Node stage
  crit: suspicious
  conf: 0.995
  attack: "T1102,T1105,T1027,T1059.007"
  mbc: "B0024,B0032"
  for: [javascript, typescript]
  near_bytes: 12000
  all:
    - id: micro-behaviors/crypto/library/blockchain/client::ethereum-blockchain-history-lookup
    - id: micro-behaviors/crypto/library/blockchain/client::ethereum-jsonrpc-block-by-number-method
    - id: micro-behaviors/crypto/library/blockchain/client::ethereum-transaction-recipient-ip-split
    - id: micro-behaviors/communications/http/request/configuration::node-http-request-configured
    - id: micro-behaviors/data/decode/base64::buffer-from-base64
    - id: micro-behaviors/data/decode/xor::js-repeating-key-buffer-xor-loop
    - id: micro-behaviors/process/interpreter/eval::js-eval-raw
    - id: micro-behaviors/process/create/inline-script::spawn-node-eval
  unless:
    - id: obfuscated-etherhiding-hex-stage-dropper

- id: ethereum-recipient-dead-drop-stage-loader
  desc: Ethereum recipient dead drop feeds Node stage
  crit: hostile
  conf: 0.995
  attack: "T1102,T1105,T1140,T1027,T1059.007"
  mbc: "B0024,B0032"
  for: [javascript, typescript]
  near_bytes: 12000
  all:
    - id: objectives/command-and-control/channel/deaddrop/blockchain::ethereum-recipient-byte-c2-resolution-javascript
    - id: micro-behaviors/communications/http/response::response-payload-base64-header
    - id: micro-behaviors/data/decode/base64::buffer-from-base64
    - id: micro-behaviors/crypto/symmetric/xor/loop::xor-modulo-key-loop
    - id: micro-behaviors/process/interpreter/eval::js-eval-call-expression-arg
    - id: micro-behaviors/process/create/inline-script::spawn-node-eval

- id: ethereum-recipient-address-stage-loader
  desc: Recipient-derived Ethereum C2 feeds and executes a Node stage
  crit: hostile
  conf: 0.995
  attack: "T1102,T1105,T1140,T1027,T1059.007"
  mbc: "B0024,B0032"
  for: [javascript, typescript]
  near_bytes: 12000
