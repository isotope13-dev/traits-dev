- id: ipfs-hidden-native-payload
  desc: Downloads IPFS payload and launches it hidden
  crit: hostile
  conf: 0.97
  attack: T1105
  mbc: B0024
  for: [javascript, typescript]
  near_bytes: 8192
  all:
