defaults:
  conf: 0.99
  platforms: [windows]
  for: [pe]
  attack: T1105,T1204.002
  mbc: B0030

composite_rules:
- id: powershell-webclient-download-invoke-sequence
  desc: WebClient download followed by Invoke-Item
  crit: notable
  conf: 0.99
  near_bytes: 1600
  all:
  - id: micro-behaviors/communications/http/download/webclient::webclient-downloadfile-call
  - id: micro-behaviors/process/create/exec::powershell-invoke-item
- id: pe-embedded-powershell-download-execute
  desc: PE overlay embeds PowerShell download-and-run
  crit: suspicious
  conf: 0.99
  all:
  - id: metadata/binary/layout/overlay::large-overlay-64k
  - id: powershell-webclient-download-invoke-sequence

- id: pe-embedded-powershell-programdata-dropper
  desc: PE embeds PowerShell download to ProgramData
  crit: hostile
  conf: 0.98
  attack: T1105,T1059.001
  all:
    - id: micro-behaviors/communications/http/download/cli::iwr-outfile-download
    - id: micro-behaviors/fs/path/system::windows-common-data-tree-path
    - id: micro-behaviors/fs/temp/directory::get-temp-path-import

- id: pe-drive-walker-powershell-dropper
  desc: PE drive walker embeds PowerShell downloader
  crit: hostile
  conf: 0.97
  attack: T1105,T1059.001,T1083,T1091
  all:
    - id: micro-behaviors/communications/http/download/cli::iwr-outfile-download
    - id: micro-behaviors/fs/traversal/drives::get-logical-drives-text
    - id: objectives/lateral-movement/infection/file::skip-program-files-dir
    - id: micro-behaviors/fs/write/file/handle::write-file
