defaults:
  conf: 0.99
  platforms: [windows]
  for: [pe]
  attack: T1105,T1204.002
  mbc: B0030

composite_rules:
- id: pe-embedded-powershell-programdata-dropper
  desc: PE embeds PowerShell download to ProgramData
  crit: hostile
  conf: 0.98
  attack: T1105,T1059.001
  near_bytes: 1024
  all:
    - id: micro-behaviors/communications/http/download/cli::iwr-outfile-download
    - id: micro-behaviors/fs/path/system::windows-common-data-tree-path
    - id: micro-behaviors/fs/temp/directory::get-temp-path-import

- id: pe-drive-walker-powershell-dropper
  desc: PE drive walker embeds PowerShell downloader
  crit: hostile
  conf: 0.97
  attack: T1105,T1059.001,T1083,T1091
  all:
    - id: micro-behaviors/communications/http/download/cli::iwr-outfile-download
    - id: micro-behaviors/fs/traversal/drives::get-logical-drives-text
    - id: micro-behaviors/fs/path/system::program-files-dir-path
    - id: micro-behaviors/fs/write/file/handle::write-file

- id: pe-urldownload-hidden-startprocess-dropper
  desc: PE downloads payload, launches via hidden PowerShell
  crit: hostile
  conf: 0.97
  attack: T1105,T1059.001
  # URLMon download plus a hidden Start-Process of a remote executable is
  # the loader shape; prerequisite installers and hash-pinned updaters are
  # the documented benign look-alikes.
  all:
    - id: micro-behaviors/communications/http/client/urlmon::url-download-to-file
    - id: micro-behaviors/process/create/hidden::powershell-windowstyle-hidden-option
    - id: micro-behaviors/process/create/start-process::start-process-filepath
    - id: micro-behaviors/communications/http/download/url::executable-url-reference-pe
  unless:
    - id: metadata/build/recognized-contexts::sysmanage-prerequisite-installer-context
    - id: micro-behaviors/crypto/hash/file::hash-pinned-download-context
