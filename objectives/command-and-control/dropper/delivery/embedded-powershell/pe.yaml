defaults:
  platforms: [windows]
  for: [pe]
  attack: T1105,T1204.002
  mbc: B0030

traits:
- id: powershell-net-webclient-text
  desc: PowerShell Net.WebClient construction
  crit: component
  conf: 0.97
  if:
    type: text
    regex: '(?i)new-object\s+(system\.)?net\.webclient'
- id: powershell-downloadfile-method-text
  desc: PowerShell DownloadFile method
  crit: notable
  conf: 0.98
  if:
    type: text
    regex: '(?i)\.downloadfile\s*\('
- id: powershell-invoke-item-text
  desc: PowerShell Invoke-Item command
  crit: notable
  conf: 0.98
  if:
    type: text
    word: Invoke-Item
    case_insensitive: true

composite_rules:
- id: powershell-webclient-download-invoke-sequence
  desc: WebClient download followed by Invoke-Item
  crit: notable
  conf: 0.99
  near_bytes: 1600
  all:
  - id: powershell-net-webclient-text
  - id: powershell-downloadfile-method-text
  - id: powershell-invoke-item-text
- id: pe-embedded-powershell-download-execute
  desc: PE with a large overlay embeds a PowerShell download-and-run stage
  crit: hostile
  conf: 0.99
  all:
  - id: metadata/binary/layout::large-overlay-64k
  - id: powershell-webclient-download-invoke-sequence
