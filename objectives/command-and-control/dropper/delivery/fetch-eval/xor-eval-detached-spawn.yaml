# Obfuscated fetch-XOR-eval-detached-spawn stager. The second stage arrives
# over HTTP, is XOR-decoded in memory, and is then BOTH evaled in-process and
# spawned as a detached, hidden background interpreter — so killing the parent
# or blocking one sink still leaves the payload running. Seen in a
# VS Code folderOpen task payload disguised as a web font, where every URL
# and method name hid behind a rotated string table: the only cleartext is
# the option keys ('detached', 'windowsHide'), the XOR loop, and the sinks.
# Each leg alone is ordinary; the five together in one delivery unit are a
# stager with no legitimate use.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  attack: T1105,T1059.007,T1027
  mbc: B0024,B0032
composite_rules:
  - id: fetch-xor-eval-detached-spawn-stage
    desc: Fetched payload decoded, evaled, and background-spawned
    crit: hostile
    conf: 0.97
    near_bytes: 12000
    all:
      - id: micro-behaviors/communications/http/request/client::http-request-func
      - id: micro-behaviors/crypto/symmetric/xor/loop::xor-modulo-key-loop
      - id: micro-behaviors/process/interpreter/eval/direct::js-eval-raw
      - id: micro-behaviors/process/create/minified-spawn::detached-double-bang-array-true
      - id: micro-behaviors/process/create/spawn::windowshide-obfuscated-true
    # No testing-tree unless: unlike broader fetch-eval loaders, this shape
    # needs all five of fetch, XOR-decode, eval, detached spawn, AND hidden
    # spawn in one file, which no benign test helper assembles — and the
    # unless would blind the hostile fixture that pins this rule.
