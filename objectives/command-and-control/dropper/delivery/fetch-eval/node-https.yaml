# Node.js https.request → eval(<dynamic>) loader pattern.
# The fetch-to-eval composites in fetch-to-eval.yaml require fetch();
# packages that use Node's built-in https module to deliver remote
# JavaScript also belong to this attack class.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  attack: T1105
traits:
- id: response-end-then-eval
  desc: Response end handler then eval
  crit: suspicious
  conf: 0.9
  if:
    type: text
    regex: 'on\s*\(\s*["'']end["''][^;]{0,400}eval\s*\('
  unless:
  - id: metadata/package/testing/
  - id: metadata/package/testing/presence/manifest::test-fixtures
composite_rules:
- id: node-https-eval-loader
  desc: Node https.request response evaluated
  crit: hostile
  conf: 0.96
  attack: T1059.007
  mbc: B0009.016
  all:
  - id: micro-behaviors/communications/http/request/client::https-request
  # NOTE (2026-07): `eval-variable` matches with `type: string_literal`, so its
  # code-shaped regex only ever sees quoted strings -- this leg is close to dead
  # on ordinary source, and widening it is NOT a free win. Converting it to
  # `type: text` was measured against 7,902 .js/.cjs/.mjs files of an npm/
  # node-gyp/wrangler/gemini-cli install tree: 9 files contain `eval(ident)` and
  # 7 of them (gemini-cli bundles, miniflare) also satisfy this rule's other
  # legs, because `os-platform-call` in the `any:` below is nearly free evidence.
  # Reviving the leg therefore needs that `any:` tightened first.
  - id: objectives/execution/interpreter/eval/dynamic::eval-variable
  any:
  - id: response-end-then-eval
  - id: micro-behaviors/communications/http/request/client::request-write-call
  - id: micro-behaviors/os/sysinfo/platform/runtime::os-platform-call
  unless:
  - id: metadata/package/testing/
  - id: metadata/package/testing/presence/manifest::test-fixtures
