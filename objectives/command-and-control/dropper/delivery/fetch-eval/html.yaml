# Browser pages that fetch a JSON config, decode a URL, and navigate.
# The GitHub-themed "preparing your download" interstitial is the usual
# wrapper; the fetch/atob/location chain is the loader.
defaults:
  platforms: [windows, unix]
  for: [html, javascript]
  attack: T1105,T1566.002

traits:
  - id: html-fetch-https-url
    desc: Fetches an HTTPS URL
    crit: notable
    conf: 0.88
    if:
      type: text
      regex: '\bfetch\s*\(\s*["'']https?://'

  - id: fetch-json-field-atob
    desc: JSON response field decoded with atob
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '\.json\s*\(\s*\)[\s\S]{0,240}atob\s*\('

composite_rules:
  - id: fetch-json-atob-redirect
    desc: Fetched JSON decodes into a redirect
    crit: hostile
    conf: 0.97
    all:
      - id: html-fetch-https-url
      - id: fetch-json-field-atob
      - id: micro-behaviors/ui/window/navigation::browser-location-href-assign
    near_bytes: 900
