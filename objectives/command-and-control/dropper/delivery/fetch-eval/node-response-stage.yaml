# A Node package that fingerprints the host, decrypts a remote response, and
# writes and executes that response is a staged dropper.  The individual
# network, crypto, filesystem, and process capabilities remain neutral atoms;
# this composite is the intent inference for their complete chain.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  attack: T1105,T1059.007,T1027.013
  mbc: B0024,B0032

composite_rules:
  - id: node-encrypted-http-response-stage
    desc: Node decrypts and executes an HTTP response stage
    crit: hostile
    conf: 0.995
    near_lines: 120
    all:
      - id: micro-behaviors/communications/http/request/client::fetch-post-pattern
      - id: micro-behaviors/os/sysinfo/platform/runtime::os-platform-call
      - id: micro-behaviors/os/sysinfo/platform/runtime::os-release-call
      - id: micro-behaviors/crypto/symmetric/aes/runtime-library::createDecipheriv
      - id: micro-behaviors/fs/file/write/async::node-write-file-promise
      - id: micro-behaviors/process/create/shell/bridge::js-exec
    unless:
      - id: metadata/package/testing/
