defaults:
  platforms:
  - windows
  for: [html]
  attack: T1204.002

traits:
  - id: search-ms-remote-unc-location
    desc: search-ms opens remote UNC location
    crit: suspicious
    conf: 0.98
    if:
      type: text
      regex: '(?i)search-ms:[^"'']{0,80}crumb=location:\\\\'
  - id: search-ms-query-invoice
    desc: search-ms invoice query parameter
    crit: notable
    conf: 0.92
    if:
      type: text
      substr: search-ms:query=Invoice
  - id: search-ms-displayname-onedrive
    desc: search-ms OneDrive displayname text
    crit: notable
    conf: 0.95
    if:
      type: text
      substr: displayname=OneDrive%20-%20Invoices
  - id: search-ms-auto-redirect
    desc: HTML auto-redirects to search-ms
    crit: suspicious
    conf: 0.95
    if:
      type: text
      substr: 'setTimeout(function(){location.href="search-ms:'


composite_rules:
  - id: search-ms-remote-share-lure
    desc: search-ms remote share lure
    crit: hostile
    conf: 0.99
    all:
      - id: objectives/command-and-control/dropper/delivery/search-connector::search-ms-remote-unc-location
    any:
      - id: objectives/command-and-control/dropper/delivery/search-connector::search-ms-auto-redirect
      - id: objectives/command-and-control/dropper/delivery/search-connector::search-ms-displayname-onedrive
      - id: metadata/document/html::invoice-portal-onedrive-title
      - id: metadata/document/html::shared-invoice-documents-instruction

  - id: search-ms-onedrive-brand-lure
    desc: search-ms OneDrive brand lure
    crit: hostile
    conf: 0.98
    all:
      - id: objectives/command-and-control/dropper/delivery/search-connector::search-ms-remote-unc-location
    any:
      - id: objectives/command-and-control/dropper/delivery/search-connector::search-ms-displayname-onedrive
      - id: metadata/document/html::invoice-portal-onedrive-title
      - id: metadata/document/html::onedrive-shared-note

  - id: search-ms-invoice-document-lure
    desc: search-ms invoice document lure
    crit: hostile
    conf: 0.98
    all:
      - id: objectives/command-and-control/dropper/delivery/search-connector::search-ms-remote-unc-location
    any:
      - id: objectives/command-and-control/dropper/delivery/search-connector::search-ms-query-invoice
      - id: metadata/document/html::invoice-documents-heading
      - id: metadata/document/html::shared-invoice-documents-instruction

