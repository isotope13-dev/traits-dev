# CHM dropper-shape composites.
#
# All atoms — container ratios, presence flags, locale checks,
# `#SYSTEM` consistency markers — live in
# `metadata/document/chm/structure.yaml` because they are neutral
# observations about the file. This file holds *only* the composites
# that combine those atoms into intent inference (dropper shape,
# foreign-locale-dropper). Per the project rule, behavioral / intent
# detection lives in `objectives/`; the underlying observations live
# in `metadata/`.
#
# Cross-tier references resolve via cleave's tier-dependency policy:
# `objectives/` may reference any `metadata/` atom.
defaults:
  platforms: [windows]
  for: [chm]
  attack: "T1218.001"
  mbc: "E1218"

composite_rules:
  # Tiny single-page CHM = dropper shape regardless of locale or
  # active content. Marked `notable` so it stays a triage hint
  # rather than a trigger on its own.
  - id: chm-tiny-payload
    desc: CHM with a single small HTML payload
    crit: notable
    conf: 0.85
    all:
      - id: metadata/document/chm::chm-small-entry-count
      - id: metadata/document/chm::chm-small-user-entry

  - id: chm-sparse-single-topic
    desc: CHM sparse single-topic shape
    crit: notable
    conf: 0.86
    all:
      - id: chm-tiny-payload
      - id: metadata/document/chm::chm-single-user-entry

  # Single-page, mostly-overhead CHM that includes active content.
  # The combination is the dropper *shape* — the actual ShortCut+cmd
  # patterns live in `htmlhelp-shortcut-active.yaml` and fire on the
  # nested HTML.
  - id: chm-dropper-shape
    desc: CHM small active overhead shape
    crit: notable
    conf: 0.92
    all:
      - id: chm-tiny-payload
      - id: metadata/document/chm::chm-mostly-overhead
      - id: metadata/document/chm::chm-has-objinst
    unless:
      - id: metadata/document/chm::chm-data-basename

  - id: chm-tiny-active-container
    desc: Tiny CHM active-content container
    crit: notable
    conf: 0.93
    all:
      - id: chm-tiny-payload
      - id: metadata/document/chm::chm-has-objinst
    unless:
      - id: metadata/document/chm::chm-data-basename

  - id: chm-single-entry-active-container
    desc: Single-entry CHM active container
    crit: notable
    conf: 0.91
    all:
      - id: metadata/document/chm::chm-single-user-entry
      - id: metadata/document/chm::chm-has-objinst
    unless:
      - id: metadata/document/chm::chm-data-basename

  # Both of this rule's hostile spellings used to require
  # `metadata/file/naming::hash-hex-basename` -- a sixty-four-hex filename.
  # That is the *collector's* name, not the attacker's: abuse.ch stores by
  # content hash, so the rule convicted this repository's storage convention
  # and would miss the identical dropper delivered as `invoice.chm`. The
  # sibling rule that asked the same question twice
  # (`chm-hash-named-single-html-dropper`) is gone with it.
  #
  # Replaced with evidence the author controls: what the single page actually
  # contains. Measured over the sixteen CHM samples in the triage corpus --
  # thirteen reconstruct their script through `String.fromCharCode`, one
  # writes a file through ADODB.Stream, one calls `eval` on an XOR-decoded
  # string.
  #
  # `scope: archive` because the legs live at two levels: the entry count and
  # the OBJINST flag describe the container, the obfuscation finding belongs
  # to the page inside it. Ordinarily that scope risks pooling legs from
  # unrelated members -- here `chm-single-user-entry` is a required leg, so
  # there is exactly one page to pool with.
  - id: chm-single-html-objinst-dropper
    for: [chm, html, javascript]
    desc: Single-page CHM OBJINST dropper
    crit: hostile
    conf: 0.96
    scope: archive
    all:
      - id: metadata/document/chm::chm-single-user-entry
      - id: metadata/document/chm::chm-has-objinst
    any:
      - id: micro-behaviors/data/string/conversion::fromcharcode-text-reference
      - id: micro-behaviors/os/com/automation::html-adodb-stream-progid-reference
      - id: micro-behaviors/process/interpreter/eval/direct::js-eval-raw
    unless:
      - id: metadata/document/chm::chm-data-basename

  # Some multi-page CHMs use the same active-content delivery path, but
  # rebuild the actual downloader through an encoded JavaScript decoder.
  # The custom decoder is analyzed in a nested HTML entry; OBJINST and the
  # small-entry shape keep this from treating an arbitrary HTML decoder as
  # a CHM dropper.
  - id: chm-objinst-encoded-html-dropper
    desc: CHM ActiveX container rebuilds an encoded HTML payload
    crit: hostile
    conf: 0.97
    scope: archive
    for: [chm, html, javascript]
    all:
      - id: metadata/document/chm::chm-has-objinst
      - id: metadata/document/chm::chm-small-entry-count
      - id: objectives/anti-static/obfuscation/syntax::html-eval-encoded-decoder-document-writer
    unless:
      - id: metadata/document/chm::chm-data-basename

  # Some obfuscator-generated CHM pages decrypt strings with an inline RC4
  # implementation, then call document.write through a computed string-table
  # key. The decoder and writer are neutral in isolation; together with a
  # single-topic CHM OBJINST active-content container they expose the hidden
  # page-reconstruction path even when the decoded Shortcut command is not
  # present as readable source text.
  - id: chm-objinst-rc4-document-writer
    desc: CHM ActiveX container rebuilds content through an RC4 decoder
    crit: hostile
    conf: 0.97
    scope: archive
    for: [chm, html]
    all:
      - id: metadata/document/chm::chm-single-user-entry
      - id: metadata/document/chm::chm-has-objinst
      - id: micro-behaviors/crypto/symmetric/stream/rc4::js-rc4-implementation
      - id: micro-behaviors/ui/controls/widget::html-computed-document-method-call
      - id: micro-behaviors/data/string/conversion::fromcharcode-text-reference
    unless:
      - id: metadata/document/chm::chm-data-basename

  # CHM topics can start embedded PEs through HTML OBJECT CODEBASE. The tiny
  # launch pages in these specimens fall below nested source-scan limits, so
  # connect the CHM's active single-topic container to strong PE evidence.
  - id: chm-activex-packed-pe-dropper
    desc: Active single-topic CHM carries a packed PE
    crit: hostile
    conf: 0.96
    scope: archive
    for: [chm, pe]
    all:
      - id: objectives/command-and-control/dropper/delivery/chm::chm-single-entry-active-container
      - id: metadata/document/chm::chm-contains-executable
      - id: objectives/anti-static/pack/detect::upx-marker
    unless:
      - id: metadata/document/chm::chm-data-basename

  - id: chm-activex-network-loader-dropper
    desc: Active single-topic CHM carries a network loader
    crit: hostile
    conf: 0.97
    scope: archive
    for: [chm, pe]
    all:
      - id: objectives/command-and-control/dropper/delivery/chm::chm-single-entry-active-container
      - id: metadata/document/chm::chm-contains-executable
      - id: micro-behaviors/communications/http/client/winhttp::has-internet-communication-apis
      - id: micro-behaviors/process/create/shellexec::shell-execute-a
    unless:
      - id: metadata/document/chm::chm-data-basename

  - id: chm-tiny-foreign-container
    desc: Tiny foreign-locale CHM container
    crit: suspicious
    conf: 0.9
    all:
      - id: chm-tiny-payload
    any:
      - id: metadata/document/chm::chm-russian-lcid
      - id: metadata/document/chm::chm-korean-lcid
      - id: metadata/document/chm::chm-chinese-lcid

  # Classic foreign-locale dropper shape: tiny payload with an LCID
  # the file name doesn't advertise. Treats the locale as
  # corroborating evidence on top of the dropper shape.
  - id: chm-foreign-lcid-dropper
    desc: CHM foreign-locale dropper shape
    crit: hostile
    conf: 0.95
    all:
      - id: chm-dropper-shape
    any:
      - id: metadata/document/chm::chm-russian-lcid
      - id: metadata/document/chm::chm-korean-lcid
      - id: metadata/document/chm::chm-chinese-lcid
