defaults:
  platforms: [windows]
  for: [text]
  attack: T1105
traits:
  - id: url-shortcut-archive-target
    desc: URL shortcut downloads archive
    crit: suspicious
    conf: 0.94
    if:
      type: text
      # The URL= key only means a shortcut target inside [InternetShortcut].
      # A pin or properties file can assign url= to a release zip.
      regex: '(?i)\[InternetShortcut\][\s\S]{0,300}^URL=https?://\S{1,40}\.(zip|7z|rar)$'
  - id: url-shortcut-zip-icon
    desc: URL shortcut uses ZIP icon
    crit: suspicious
    conf: 0.9
    if:
      type: text
      regex: '(?i)^IconFile=.{0,160}zipfldr\.dll$'
  - id: url-shortcut-document-lure-name
    desc: URL shortcut document lure name
    crit: suspicious
    conf: 0.9
    if:
      type: path
      basename: true
      regex: '(?i)\.(pdf|docx?|xlsx?|rtf)\.url$'
  - id: url-shortcut-remote-share-ip-target
    desc: URL shortcut targets an IP file share
    crit: suspicious
    conf: 0.95
    attack: T1187,T1105
    if:
      # `URL=file://62.173.138.109\Agenzia\entrat.exe`, or the WebDAV form
      # `URL=file:\\193.124.33.71@80\Downloads\...` where the `@80` suffix
      # tells the Windows redirector to reach the host over HTTP rather than
      # SMB, so the fetch works from outside a network that blocks 445.
      # Either slash flavor after `file:` matches: in the wild the scheme is
      # written `file://` as often as `file:\\`. A shortcut to a file server
      # names a server; this names an address on the internet and,
      # optionally, the port to use. `is: external_ip` keeps out intranet
      # shares (`file://192.168.x.x/...`), which are ordinary IT links.
      type: text
      regex: '(?i)^URL=file:[\\/]{2}[0-9]{1,3}(\.[0-9]{1,3}){3}(@[0-9]{1,5})?[\\/]'
      is: external_ip

  - id: url-shortcut-executable-target
    desc: URL shortcut points at an executable
    crit: suspicious
    conf: 0.93
    if:
      # A `.url` whose target is itself a program: double-clicking runs it
      # (after, at most, an Open-File warning). Archive and LNK targets have
      # their own atoms; this is the direct remote-executable form.
      type: text
      regex: '(?i)^URL=[^\r\n]{1,220}\.(exe|scr|msi)\s*$'
    not:
      # TXLib's developer tools included this direct link to Microsoft's
      # Sysinternals DbgView download; it is a manually opened utility link.
      - regex: '(?i)^URL=https?://live\.sysinternals\.com/Dbgview\.exe\s*$'

  - id: url-shortcut-remote-script-target
    desc: URL shortcut points at a remote script
    crit: suspicious
    conf: 0.92
    attack: T1105,T1204.002
    if:
      # A `.url` whose target is a code/script resource rather than a web page:
      # opening it hands the file to the script host or downloads and runs it.
      # Shortcuts normally open HTML; one that points at a `.js`/`.hta`/`.ps1`
      # (even disguised as a `.min.js` CDN bundle with a cache-bust query, as in
      # the Midnight Blizzard-linked lures) is a delivery stub. The executable,
      # archive and LNK target forms have their own atoms; this covers the
      # script forms, with or without a trailing query string.
      type: text
      regex: '(?im)^URL=https?://\S{1,200}\.(js|mjs|hta|vbs|wsf|ps1|jar|bat|cmd|py)(\?\S{0,120})?\s*$'

  - id: url-shortcut-file-script-target
    desc: URL shortcut points at remote file script
    crit: suspicious
    conf: 0.94
    attack: T1105,T1204.002
    if:
      type: text
      regex: '(?im)^URL=file:/{2}\S{1,240}\.(vbs|js|jse|wsf|wsh|hta|bat|cmd|ps1)\s*$'

  - id: url-shortcut-http-ip-target
    desc: URL shortcut targets a raw-IP web resource
    crit: suspicious
    conf: 0.9
    attack: T1105,T1204.002
    if:
      # `URL=https://<public-IP>/...`. A web shortcut a user is meant to open
      # names a site by hostname; one hardcoded to a bare public IP points at
      # operator infrastructure with no DNS record, the delivery form the
      # Midnight Blizzard-linked lures used (a .url to a staging IP). Intranet
      # addresses are excluded by the external-IP check.
      type: text
      regex: '(?im)^URL=https?://\d{1,3}(\.\d{1,3}){3}(:\d{1,5})?[/?]'
      is: external_ip
    not:
      - regex: '(?i)^URL=https?://(10|127|169\.254|192\.168)\.'
      - regex: '(?i)^URL=https?://172\.(1[6-9]|2\d|3[0-1])\.'

  - id: url-shortcut-lnk-target
    desc: URL shortcut points at a shortcut
    crit: suspicious
    conf: 0.94
    if:
      # A `.url` that resolves to a `.lnk`. Neither file is content: the first
      # fetches the second, the second runs something. The indirection exists
      # because each hop is a different format, and a scanner that understands
      # one of them is not looking at the other.
      type: text
      regex: '(?i)^URL=[^\r\n]{1,200}\.lnk\s*$'

  # file://host@SSL/DavWWWRoot/name.wsh is a WebDAV mount of a script. Opening
  # the shortcut hands that script to the Windows script host.
  - id: url-shortcut-webdav-script-target
    desc: URL shortcut opens a WebDAV script
    crit: suspicious
    conf: 0.95
    attack: T1105,T1204.002
    if:
      type: text
      regex: '(?i)^URL=file://\S{1,160}/DavWWWRoot/\S{0,60}\.(wsh|js|vbs|hta)\s*$'

  - id: url-shortcut-webdav-ssl-root
    desc: URL shortcut uses SSL WebDAV root
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: '(?i)^URL=file://\S{1,180}@SSL/DavWWWRoot/'

  # The matcher is sixteen NUL bytes in a file over 64 KB, which is true of
  # most binary data -- nothing in it is about URL shortcuts. GDAL ships
  # ogr/ogrsf_frmts/sxf/data/default.rsc, an SXF classifier table, and it
  # scored suspicious for being a padded URL shortcut. A component: the
  # padding only means anything next to the InternetShortcut header, which
  # is what `url-shortcut-padded-document-lure` below requires.
  - id: url-shortcut-nul-padded
    desc: URL shortcut is padded with NUL bytes
    crit: component
    conf: 0.93
    size_min: 65536
    if:
      # A URL shortcut is a few hundred bytes. This one is 346 KB, the rest
      # NULs -- padding a file past a scanner's size limit costs the attacker
      # nothing and is invisible to the shell, which stops reading at the end
      # of the INI section.
      type: hex
      pattern: "00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00"

composite_rules:
  - id: url-shortcut-archive-download-lure
    desc: URL shortcut archive download lure
    crit: suspicious
    conf: 0.96
    all:
      - id: metadata/file/format/structured::windows-internet-shortcut-header
      - id: metadata/file/extension/identity::url-shortcut-extension
      - id: url-shortcut-archive-target
    any:
      - id: url-shortcut-zip-icon
      - id: url-shortcut-document-lure-name

  # The whole delivery, in one file: a shortcut that fetches a shortcut from an
  # address on the internet over a remote share (plain SMB or WebDAV).
  #
  # `url-shortcut-archive-download-lure` above reads the HTTP form -- a `.url`
  # pointing at a zip. This is the form that does not use HTTP at all: the
  # redirector mounts the share (`file://<ip>\` or `file:\\<ip>@80\`), so the
  # second stage arrives as a file on a mounted share rather than as a
  # download, and the thing that arrives is another shortcut rather than
  # anything a content scanner would inspect.
  - id: url-shortcut-remote-share-lnk-chain
    desc: Remote-share URL shortcut chains to a LNK
    crit: hostile
    conf: 0.97
    attack: T1187,T1105,T1204.002
    all:
      - id: metadata/file/format/structured::windows-internet-shortcut-header
      - id: url-shortcut-remote-share-ip-target
      - id: url-shortcut-lnk-target

  # The direct form of the same delivery: the shortcut does not fetch a
  # second stage, it names the payload itself -- an executable on an
  # internet-reachable file share. Opening the file makes Windows
  # authenticate to the attacker's host (forced authentication) and asks the
  # shell to open the hosted program, so the header plus the two suspicious
  # legs together have no benign reading: intranet shares are excluded by
  # the external-IP check, and ordinary web links never use the `file:`
  # scheme. This is the merged delivery and remote-share reading -- one
  # fact set, one finding.
  - id: url-shortcut-remote-executable-lure
    desc: URL shortcut delivers remote-share executable
    crit: hostile
    conf: 0.97
    attack: T1187,T1105,T1204.002
    all:
      - id: metadata/file/format/structured::windows-internet-shortcut-header
      - id: url-shortcut-remote-share-ip-target
      - id: url-shortcut-executable-target

  # The same file wearing a document's name and padded past a size limit.
  # Two independent choices about how it is delivered rather than what it does,
  # which is why they are stated apart from the chain above.
  - id: url-shortcut-document-lure-padded
    desc: Document-named URL shortcut padded with NULs
    crit: hostile
    conf: 0.95
    attack: T1036.008,T1027.001
    all:
      - id: metadata/file/format/structured::windows-internet-shortcut-header
      - id: url-shortcut-document-lure-name
      - id: url-shortcut-nul-padded

  - id: url-shortcut-webdav-script-lure
    desc: Shortcut opens a remote WebDAV script
    crit: hostile
    conf: 0.97
    attack: T1105,T1204.002
    all:
      - id: metadata/file/format/structured::windows-internet-shortcut-header
      - id: url-shortcut-webdav-script-target

  - id: url-shortcut-remote-file-script-lure
    desc: Shortcut opens script from remote file share
    crit: hostile
    conf: 0.97
    attack: T1105,T1204.002
    all:
      - id: metadata/file/format/structured::windows-internet-shortcut-header
      - id: url-shortcut-file-script-target

  - id: url-shortcut-ssl-webdav-script-lure
    desc: Shortcut opens an SSL WebDAV script
    crit: hostile
    conf: 0.97
    attack: T1105,T1204.002
    all:
      - id: url-shortcut-webdav-script-target
      - id: url-shortcut-webdav-ssl-root
