defaults:
  platforms: [windows]
  for: [text, lnk]
  attack: T1105
traits:
  - id: internet-shortcut-header
    desc: Windows InternetShortcut file
    crit: notable
    conf: 0.95
    if:
      type: text
      substr: "[InternetShortcut]"
  - id: url-shortcut-basename
    desc: URL shortcut file extension
    crit: notable
    conf: 0.95
    if:
      type: path
      basename: true
      regex: '(?i)\.url$'
  - id: url-shortcut-http-target
    desc: URL shortcut HTTP target
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)^URL=https?://.{1,180}$'
  - id: url-shortcut-archive-target
    desc: URL shortcut downloads archive
    crit: suspicious
    conf: 0.94
    if:
      type: text
      regex: '(?i)^URL=https?://.{1,160}\.(zip|7z|rar)$'
  - id: url-shortcut-zip-icon
    desc: URL shortcut uses ZIP icon
    crit: suspicious
    conf: 0.9
    if:
      type: text
      regex: '(?i)^IconFile=.{0,160}zipfldr\.dll$'
  - id: url-shortcut-document-lure-name
    desc: URL shortcut document lure name
    crit: suspicious
    conf: 0.9
    if:
      type: path
      basename: true
      regex: '(?i)\.(pdf|docx?|xlsx?|rtf)\.url$'
  - id: url-shortcut-webdav-ip-target
    desc: URL shortcut targets a WebDAV IP share
    crit: suspicious
    conf: 0.95
    attack: T1187,T1105
    if:
      # `URL=file:\\\\193.124.33.71@80\\Downloads\\...`. The `@80` suffix is the
      # instruction: it tells the Windows redirector to reach the host over
      # HTTP rather than SMB, so the fetch works from outside a network that
      # blocks 445. A shortcut to a file server names a server; this names an
      # address on the internet and the port to use.
      type: text
      regex: '(?i)^URL=file:\\\\[0-9]{1,3}(\.[0-9]{1,3}){3}(@[0-9]{1,5})?\\'

  - id: url-shortcut-lnk-target
    desc: URL shortcut points at a shortcut
    crit: suspicious
    conf: 0.94
    if:
      # A `.url` that resolves to a `.lnk`. Neither file is content: the first
      # fetches the second, the second runs something. The indirection exists
      # because each hop is a different format, and a scanner that understands
      # one of them is not looking at the other.
      type: text
      regex: '(?i)^URL=[^\r\n]{1,200}\.lnk\s*$'

  - id: url-shortcut-nul-padded
    desc: URL shortcut is padded with NUL bytes
    crit: suspicious
    conf: 0.93
    size_min: 65536
    if:
      # A URL shortcut is a few hundred bytes. This one is 346 KB, the rest
      # NULs -- padding a file past a scanner's size limit costs the attacker
      # nothing and is invisible to the shell, which stops reading at the end
      # of the INI section.
      type: hex
      pattern: "00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00"

composite_rules:
  - id: url-shortcut-archive-download-lure
    desc: URL shortcut archive download lure
    crit: suspicious
    conf: 0.96
    all:
      - id: internet-shortcut-header
      - id: url-shortcut-basename
      - id: url-shortcut-archive-target
    any:
      - id: url-shortcut-zip-icon
      - id: url-shortcut-document-lure-name

  # The whole delivery, in one file: a shortcut that fetches a shortcut from an
  # address on the internet over WebDAV.
  #
  # `url-shortcut-archive-download-lure` above reads the HTTP form -- a `.url`
  # pointing at a zip. This is the form that does not use HTTP at all: the
  # redirector mounts `file:\\<ip>@80\`, so the second stage arrives as a file
  # on a mounted share rather than as a download, and the thing that arrives is
  # another shortcut rather than anything a content scanner would inspect.
  - id: url-shortcut-webdav-lnk-chain
    desc: URL shortcut chains to a LNK over WebDAV
    crit: hostile
    conf: 0.97
    attack: T1187,T1105,T1204.002
    all:
      - id: internet-shortcut-header
      - id: url-shortcut-webdav-ip-target
      - id: url-shortcut-lnk-target

  # The same file wearing a document's name and padded past a size limit.
  # Two independent choices about how it is delivered rather than what it does,
  # which is why they are stated apart from the chain above.
  - id: url-shortcut-document-lure-padded
    desc: Document-named URL shortcut padded with NULs
    crit: hostile
    conf: 0.95
    attack: T1036.008,T1027.001
    all:
      - id: internet-shortcut-header
      - id: url-shortcut-document-lure-name
      - id: url-shortcut-nul-padded

