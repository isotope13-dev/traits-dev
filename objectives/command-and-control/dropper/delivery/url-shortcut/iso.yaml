defaults:
  platforms: [windows]
  for: [iso]
  attack: T1027,T1059.001,T1204.002

composite_rules:
  - id: iso-lnk-password-arithmetic-stager
    desc: ISO LNK pairs password lure with arithmetic PowerShell
    crit: hostile
    conf: 0.99
    all:
      - id: metadata/file/format/iso/structure::primary-volume-descriptor
      - id: micro-behaviors/process/create/shell/interpreter::powershell-executable-token
      - id: metadata/file/format/iso/payload::iso-lnk-arithmetic-obfuscation
      - id: metadata/file/format/iso/member::iso-password-disclosure-lure

  - id: udf-lnk-dll-ordinal-carrier
    desc: UDF image delivers LNK-driven DLL ordinal payload
    crit: hostile
    conf: 0.99
    attack: T1059.003,T1218.011,T1204.002
    scope: outer
    all:
      - id: metadata/file/format/iso/payload::udf-lnk-cmd-rundll32-ordinal
      - id: metadata/file/format/iso/payload::udf-lnk-dll-payload-marker
