# ISO order-themed lure that stages a WSH + DAT ordinal loader via l32 suffix.
defaults:
  platforms: [windows]
  for: [all]
  attack: T1027,T1059.007,T1218.011

composite_rules:
  - id: iso-wsh-l32-dat-ordinal-dropper
    desc: ISO WSH reconstructs rundll32 DAT ordinal loader
    crit: hostile
    conf: 0.99
    all:
      - id: metadata/file/format/structured::primary-volume-descriptor
      - id: metadata/file/format/iso::iso-wsh-l32-suffix
      - id: metadata/file/format/iso::iso-wsh-shell-run
      - id: metadata/file/format/iso::iso-wsh-rundll-prefix
      - id: metadata/file/format/iso::iso-wsh-dat-ordinal-launch
