# VB6 URLMon downloaders that also embed a cleartext HTTP URL are staged
# droppers, not document helpers.
defaults:
  platforms: [windows]
  for: [pe]
  attack: T1105
  crit: hostile
  conf: 0.94

composite_rules:
  - id: vb6-urlmon-http-url
    desc: VB6 URLMon downloader embeds a cleartext HTTP URL
    all:
      - id: micro-behaviors/communications/http/client/urlmon::url-download-to-file-str
      - id: micro-behaviors/communications/http/url/scheme::cleartext-http-url
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/installer/family/
      - id: well-known/lib/runtime/native-platform/vb-richclient::vb-richclient-runtime-library

  - id: vb6-urlmon-http-host
    desc: VB6 URLMon downloader embeds an HTTP host string
    all:
      - id: micro-behaviors/communications/http/client/urlmon::url-download-to-file-str
      - id: micro-behaviors/communications/http/url/domain::http-url-binary
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/installer/family/
      - id: well-known/lib/runtime/native-platform/vb-richclient::vb-richclient-runtime-library

  - id: vb6-http-url-shell
    desc: VB6 shell dropper embeds a cleartext HTTP URL
    all:
      - id: micro-behaviors/process/create/macro/office::vb6-shell-execution
      - id: micro-behaviors/communications/http/url/scheme::cleartext-http-url
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/installer/family/
      - id: well-known/lib/runtime/native-platform/vb-richclient::vb-richclient-runtime-library

  - id: vb6-exe-url-drop
    desc: VB6 dropper fetches an executable URL
    all:
      - id: micro-behaviors/communications/http/download/url::executable-url-reference-pe
      - id: micro-behaviors/fs/path/extension::utf16-exe-suffix-token
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/installer/family/
      - id: well-known/lib/runtime/native-platform/vb-richclient::vb-richclient-runtime-library
