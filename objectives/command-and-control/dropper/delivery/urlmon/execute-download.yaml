defaults:
  attack: T1105
  mbc: E1105
  platforms: [unix, windows]
  for: [pe, dll]

composite_rules:
- id: decoded-urlmon-hooked-executable-dropper
  desc: Decoded URLMon payload downloader installs hook
  crit: hostile
  conf: 0.99
  attack: T1105,T1027,T1574
  platforms: [windows]
  size_max: 131072
  all:
  - id: micro-behaviors/communications/http/download/url::executable-url-reference-pe
  - id: micro-behaviors/communications/http/url/domain::xor-decoded-http-url
  - id: micro-behaviors/communications/http/client/urlmon::decoded-urlmon-dll-reference
  - id: micro-behaviors/process/hook/interception::x86-absolute-push-ret-hook-builder
  - id: micro-behaviors/fs/delete/file/library::deletefile-a
  - id: metadata/signed/trust-level::unsigned-missing-signature-record
  unless:
  - id: metadata/signed/platform/
  - id: metadata/binary/installer/family/
  - id: well-known/app/
  - id: well-known/tool/
- id: urlmon-memory-exec
  desc: "URLDownloadToFile with memory execution"
  crit: suspicious
  conf: 0.9
  platforms: [windows]
  size_max: 524288
  unless:
  - id: well-known/tool/sysadmin/logapi::logapi-pipe-marker
  - id: metadata/binary/installer/family/
  all:
  - id: micro-behaviors/communications/http/client/urlmon::urlmon-dynamic-load
  any:
  - id: micro-behaviors/mem/alloc/virtual::virtual-alloc
  - id: micro-behaviors/mem/protect/modify::virtual-protect
  - id: objectives/evasion/fileless/memory::alloc-or-protect
- id: hostile-urlmon-dropper
  desc: "URLDownloadToFile dropper with PEB API resolution"
  crit: hostile
  conf: 0.92
  platforms: [windows]
  size_max: 524288
  all:
  - id: urlmon-memory-exec
  any:
  - id: micro-behaviors/os/api-resolution/manual::peb-export-resolver-x64
  - id: objectives/anti-static/obfuscation/imports/api-hashing::export-walk-with-hash-arithmetic
- id: unsigned-elevated-embedded-urlmon-loader
  desc: Unsigned elevated URLMon embedded-payload loader
  crit: hostile
  conf: 0.98
  attack: T1105,T1129,T1548.002
  platforms: [windows]
  size_max: 1048576
  all:
  - id: micro-behaviors/communications/http/client/urlmon::url-download-to-file
  - id: metadata/binary/layout/embedded::pe-embedded
  - id: micro-behaviors/os/privilege/manifest::require-administrator
  - id: micro-behaviors/process/create/launch::create-process-api-name
  - id: micro-behaviors/dylib/load/runtime::load-library-ex-a
  unless:
  - id: metadata/signed/platform/
  - id: metadata/binary/installer/family/
  - id: metadata/binary/installer/script/
- id: remcos-packed-urlmon-winsock-stage
  desc: Remcos packed URLMon and Winsock download stage
  crit: hostile
  conf: 0.99
  platforms: [windows]
  size_max: 524288
  all:
  - id: metadata/binary/resource/identity::wide-settings-resource-name
  - id: objectives/anti-static/pack/mpress::mpress-sparse-dynamic-loader
  - id: micro-behaviors/communications/http/client/urlmon::url-download-to-file
  - id: micro-behaviors/communications/http/client/wininet::internet-open
  - id: micro-behaviors/communications/socket/init::winsock-startup-ordinal
- id: unsigned-urlmon-registry-loader
  desc: Unsigned PE with URLMon and autorun indicators
  # Unsigned self-updaters can legitimately combine these capabilities.
  crit: suspicious
  conf: 0.98
  platforms: [windows]
  attack: "T1059.003,T1105,T1112,T1547.001"
  all:
  - id: objectives/persistence/login/registry/run-key::pe-registry-self-install
  - id: micro-behaviors/communications/http/client/urlmon::url-download-to-file
  - id: micro-behaviors/process/create/system::shell-execute-ex-a
  - id: metadata/signed/trust-level::unsigned-missing-signature-record
  unless:
  - id: metadata/signed/platform/
  - id: metadata/binary/installer/family/
  - id: metadata/binary/installer/script/
