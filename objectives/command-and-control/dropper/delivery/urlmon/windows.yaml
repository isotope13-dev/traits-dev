# Sparse URLMon downloader with obfuscated payload strings.
defaults:
  platforms: [windows]
  for: [pe, dll]
  attack: T1105
  crit: hostile
  conf: 0.94

composite_rules:
  - id: urlmon-sparse-dropper
    desc: Sparse URLMon downloader fetches a payload
    all:
      - id: micro-behaviors/communications/http/client/urlmon::url-download-to-file-import
      - id: objectives/anti-static/obfuscation/payload/string-sparse::low-string-count
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/installer/family/
