# Unsigned URLMon downloaders that stage into %TEMP% and delete the fetch
# are droppers, not document helpers.
defaults:
  platforms: [windows]
  for: [pe, dll]
  attack: T1105
  crit: hostile
  conf: 0.94

composite_rules:
  - id: urlmon-temp-dropper
    desc: URLMon downloader stages into the temp path
    all:
      - id: micro-behaviors/communications/http/client/urlmon::url-download-to-file-import
      - id: micro-behaviors/fs/temp/directory::get-temp-path-import
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/installer/family/

  - id: urlmon-delete-dropper
    desc: URLMon downloader deletes the staged file
    all:
      - id: micro-behaviors/communications/http/client/urlmon::url-download-to-file-import
      - id: micro-behaviors/fs/delete/file/library::deletefile-a
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/installer/family/

  - id: urlmon-sparse-dropper
    desc: Sparse URLMon downloader fetches a payload
    all:
      - id: micro-behaviors/communications/http/client/urlmon::url-download-to-file-import
      - id: objectives/anti-static/obfuscation/payload/string-sparse::low-string-count-vb6
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/installer/family/
