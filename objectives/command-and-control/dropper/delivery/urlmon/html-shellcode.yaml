defaults:
  platforms: [windows]
  for: [html, javascript, text, data]
  attack: T1105

composite_rules:
  - id: x86-urlmon-shellcode-download-exec
    desc: URLMon shellcode downloads and launches EXE
    crit: hostile
    conf: 0.98
    attack: T1105,T1106
    all:
      - id: micro-behaviors/communications/http/client/urlmon::x86-urlmon-hash-fetch-executable
      - id: micro-behaviors/process/create/spawn::x86-winexec-hash-launch
    near_bytes: 1200
