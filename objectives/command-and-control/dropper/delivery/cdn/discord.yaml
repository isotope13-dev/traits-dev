defaults:
  platforms: [unix, windows]
  for: [python]
  attack: "T1105"
# Discord-based dropper behaviors
# ATT&CK: T1105 (Ingress Tool Transfer), T1071.001 (Web Protocols)
composite_rules:
  # Main Hostile Rule: Discord Dropper (Loose Correlation)
  # Uses loose correlation of traits because specific regex traits are sometimes suppressed/deduplicated.
  # Logic: Has "Discord" string + Binary File Drop + Execution Capability
  - id: discord-dropper-generic
    desc: Discord CDN dropper behavior (generic download + execute)
    crit: suspicious
    conf: 0.9
    # The invite-URL alternative excludes Python; the webhook is the effective
    # endpoint requirement. Keep the endpoint and HTTP-client roles separate.
    all:
      - id: micro-behaviors/communications/http/webhook::discord-webhook-short-id-url
      - id: micro-behaviors/communications/http/post::requests-post
      - id: metadata/import/python/requests
      - id: objectives/command-and-control/dropper/lifecycle::python-write-capability
      - id: objectives/command-and-control/dropper/lifecycle::python-exec-capability
    any:
      - id: micro-behaviors/communications/http/lib/requests
      - id: micro-behaviors/communications/http/response::raise-for-status
      - id: micro-behaviors/communications/http/get::requests-get
