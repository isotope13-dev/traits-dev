# WinRAR SFX script directives embedded in the SFX comment block.
# Short tokens like Silent=1 fall under the PE string min-length filter,
# so pair them with neighboring Overwrite=/Setup= lines via raw bytes.
# Catches silent ProgramData+cmd droppers without lure-specific names.
defaults:
  platforms: [windows]
  for: [pe]
  attack: T1204.002,T1059.003

traits:
  - id: sfx-silent-overwrite-pair
    desc: SFX Silent and Overwrite script pair
    crit: notable
    conf: 0.95
    if:
      type: raw
      regex: '(?i)Silent=1\r?\nOverwrite=1'

  - id: sfx-programdata-path
    desc: SFX extracts into ProgramData path
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: '(?i)Path=c:\\ProgramData\\?'

  - id: sfx-setup-cmd-script
    desc: SFX Setup directive runs a CMD script
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: '(?i)Setup=[^\r\n]{1,80}\.cmd'

  # Dual Setup=*.exe is a common silent SFX pattern for staged stealers
  # (bootstrapper + packed payload). Single Setup= alone is normal for
  # legitimate WinRAR SFX installers.
  - id: sfx-dual-setup-exe
    desc: SFX script runs two EXE Setup payloads
    crit: notable
    conf: 0.95
    count_min: 2
    if:
      type: text
      regex: '(?i)Setup=[A-Za-z0-9_.-]+\.exe'

  - id: sfx-path-temp
    desc: SFX extracts into %Temp% path
    crit: notable
    conf: 0.92
    if:
      type: raw
      regex: '(?i)Path=%Temp%'

  - id: sfx-setup-batch-script
    desc: SFX Setup directive runs a batch script
    crit: notable
    conf: 0.93
    if:
      type: text
      regex: '(?i)Setup=[^\r\n]{1,80}\.bat'

  # Silent=1 is too short for the PE string filter, so match the SFX
  # comment line in raw bytes.
  - id: sfx-silent-raw-directive
    desc: SFX Silent directive line in raw comment
    crit: notable
    conf: 0.95
    if:
      type: raw
      regex: '(?im)^Silent=1\r?$'

  # Zip member names sit between a header control byte and compressed bytes,
  # so a prose mention of report.xlsx does not qualify.
  - id: sfx-office-member-name
    desc: Nontext-bounded office document filename
    crit: notable
    conf: 0.9
    if:
      type: raw
      regex: '(?i)[\x00-\x1f][A-Za-z0-9_.-]{1,40}\.(xlsx|xls|docx|doc|pdf)[\x80-\xff]'

  - id: sfx-exe-member-name
    desc: Nontext-bounded executable filename
    crit: notable
    conf: 0.9
    if:
      type: raw
      regex: '(?i)[\x00-\x1f][A-Za-z0-9_.-]{1,40}\.exe[\x80-\xff]'

composite_rules:
  - id: winrar-sfx-silent-batch-cryptominer
    desc: Silent WinRAR SFX batch launches miner with pooled wallet
    crit: hostile
    conf: 0.97
    scope: outer
    attack: T1204.002,T1496
    all:
      - id: metadata/binary/installer/sfx::winrar-sfx
      - id: sfx-silent-raw-directive
      - id: sfx-setup-batch-script
      - id: micro-behaviors/data/format/crypto-address::hardcoded-monero-address
      - id: micro-behaviors/process/argument/option::miner-pool-endpoint-option
    unless:
      - id: metadata/signed/platform/

  - id: winrar-sfx-silent-programdata-cmd
    desc: Silent WinRAR SFX drops CMD into ProgramData
    crit: hostile
    conf: 0.98
    attack: T1204.002,T1059.003,T1036
    all:
      - id: metadata/binary/installer/sfx::winrar-sfx
      - id: sfx-programdata-path
      - id: sfx-setup-cmd-script
      - id: sfx-silent-overwrite-pair

  - id: winrar-sfx-silent-dual-exe-dropper
    desc: Silent WinRAR SFX runs two EXE Setup payloads
    crit: hostile
    conf: 0.97
    attack: T1204.002,T1036
    all:
      - id: metadata/binary/installer/sfx::winrar-sfx
      - id: sfx-silent-overwrite-pair
      - id: sfx-dual-setup-exe
    unless:
      - id: metadata/signed/platform/

  # Orthogonal to dual-Setup: silent overwrite into %Temp% is the usual
  # stealer-SFX staging path (no ProgramData/CMD required).
  - id: winrar-sfx-silent-temp-dropper
    desc: Silent WinRAR SFX extracts payloads into %Temp%
    crit: hostile
    conf: 0.96
    attack: T1204.002,T1036
    all:
      - id: metadata/binary/installer/sfx::winrar-sfx
      - id: sfx-silent-overwrite-pair
      - id: sfx-path-temp
    unless:
      - id: metadata/signed/platform/

  - id: winrar-sfx-bat-document-exe
    desc: Silent SFX batch with document and exe
    crit: hostile
    conf: 0.96
    attack: T1204.002,T1036
    all:
      - id: metadata/binary/installer/sfx::winrar-sfx
      - id: sfx-setup-batch-script
      - id: sfx-office-member-name
      - id: sfx-exe-member-name
      - id: sfx-silent-overwrite-pair
      - id: sfx-path-temp
    unless:
      - id: metadata/signed/platform/
