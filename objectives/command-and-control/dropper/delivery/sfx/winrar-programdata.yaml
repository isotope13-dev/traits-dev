# WinRAR SFX script directives embedded in the SFX comment block.
# Short tokens like Silent=1 fall under the PE string min-length filter,
# so pair them with neighboring Overwrite=/Setup= lines via raw bytes.
# Catches silent ProgramData+cmd droppers without lure-specific names.
defaults:
  platforms: [windows]
  for: [pe]
  attack: T1204.002,T1059.003

traits:
  - id: sfx-silent-overwrite-pair
    desc: SFX Silent and Overwrite script pair
    crit: notable
    conf: 0.95
    if:
      type: raw
      regex: '(?i)Silent=1\r?\nOverwrite=1'

  - id: sfx-programdata-path
    desc: SFX extracts into ProgramData path
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: '(?i)Path=c:\\ProgramData\\?'

  - id: sfx-setup-cmd-script
    desc: SFX Setup directive runs a CMD script
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: '(?i)Setup=[^\r\n]{1,80}\.cmd'

  # Dual Setup=*.exe is a common silent SFX pattern for staged stealers
  # (bootstrapper + packed payload). Single Setup= alone is normal for
  # legitimate WinRAR SFX installers.
  - id: sfx-dual-setup-exe
    desc: SFX script runs two EXE Setup payloads
    crit: notable
    conf: 0.95
    count_min: 2
    if:
      type: text
      regex: '(?i)Setup=[A-Za-z0-9_.-]+\.exe'

  - id: sfx-path-temp
    desc: SFX extracts into %Temp% path
    crit: notable
    conf: 0.92
    if:
      type: raw
      regex: '(?i)Path=%Temp%'

composite_rules:
  - id: winrar-sfx-silent-programdata-cmd
    desc: Silent WinRAR SFX drops CMD into ProgramData
    crit: hostile
    conf: 0.98
    attack: T1204.002,T1059.003,T1036
    all:
      - id: metadata/binary/installer/sfx::winrar-sfx
      - id: sfx-programdata-path
      - id: sfx-setup-cmd-script
      - id: sfx-silent-overwrite-pair

  - id: winrar-sfx-silent-dual-exe-dropper
    desc: Silent WinRAR SFX runs two EXE Setup payloads
    crit: hostile
    conf: 0.97
    attack: T1204.002,T1036
    all:
      - id: metadata/binary/installer/sfx::winrar-sfx
      - id: sfx-silent-overwrite-pair
      - id: sfx-dual-setup-exe
    unless:
      - id: metadata/signed/platform/

  # Orthogonal to dual-Setup: silent overwrite into %Temp% is the usual
  # stealer-SFX staging path (no ProgramData/CMD required).
  - id: winrar-sfx-silent-temp-dropper
    desc: Silent WinRAR SFX extracts payloads into %Temp%
    crit: hostile
    conf: 0.96
    attack: T1204.002,T1036
    all:
      - id: metadata/binary/installer/sfx::winrar-sfx
      - id: sfx-silent-overwrite-pair
      - id: sfx-path-temp
    unless:
      - id: metadata/signed/platform/
