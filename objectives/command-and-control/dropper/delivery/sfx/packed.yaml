defaults:
  platforms: [windows]
  for: [pe]
traits:
  - id: sfx-runprogram-directive
    desc: SFX RunProgram directive
    crit: notable
    conf: 0.9
    if:
      type: text
      substr: RunProgram=
  # `SelfDelete` is not in the stock 7-Zip SFX module; it comes from the
  # extended 7zSD builders, and it makes the stub erase itself once the
  # extracted stage is running. An installer has no reason to destroy the thing
  # the user just downloaded -- keeping it is what lets them reinstall or check
  # a hash -- so this is an anti-forensics directive: after execution the only
  # artefact left on disk is whatever came out of the archive.
  - id: sfx-self-delete-directive
    desc: SFX stub deletes itself after running
    crit: notable
    conf: 0.95
    attack: T1070.004
    if:
      type: text
      regex: 'SelfDelete\s*=\s*"?1"?'
  # Read from raw bytes, not from the extracted-string corpus. 7-Zip SFX writes
  # a quoted command as `RunProgram="\"%%T\\stage.exe\""`, and the string
  # extractor drops those lines while keeping every neighbouring directive --
  # `Progress`, `SelfDelete` and `InstallPath` all survive, the three
  # `RunProgram` lines between them do not. Any `type: text` rule aimed at the
  # directive is therefore blind to the escaped spelling, which is the one the
  # tool emits whenever the command contains a path.
  - id: sfx-runprogram-escaped-quote-value
    desc: SFX RunProgram value is an escaped path
    crit: notable
    conf: 0.94
    attack: T1204.002
    if:
      # Anchored on the CRLF that ends the previous directive, so this is the
      # start of a config line rather than the token appearing inside some
      # unrelated string.
      type: raw
      regex: '\r\nRunProgram\s*=\s*"\\"'
  - id: sfx-hidden-cmd-stdin
    desc: SFX hidden cmd stdin execution
    crit: suspicious
    conf: 0.96
    attack: T1204.002
    mbc: B0023
    if:
      type: text
      substr: 'hidcon:cmd /c cmd <'
  - id: sfx-video-extension-stdin
    desc: SFX command reads video file
    crit: component
    conf: 0.9
    if:
      type: text
      regex: '\.(mpg|mpeg|avi|mp4)"'
  - id: sfx-media-named-entry
    desc: SFX media-named payload entry
    crit: component
    conf: 0.9
    if:
      type: text
      regex: '(?i)[A-Za-z0-9_. -]{1,80}\.(mpg|mpeg|avi|mp4),'
  - id: sfx-temp-path-directive
    desc: SFX extracts to temp directory
    crit: notable
    conf: 0.9
    if:
      type: text
      exact: Path=%temp%
  - id: sfx-silent-directive
    desc: SFX silent execution directive
    crit: component
    conf: 0.9
    if:
      type: text
      substr: Silent=1
  - id: sfx-temp-mode-directive
    desc: WinRAR SFX extracts payloads to temp
    crit: notable
    conf: 0.98
    if:
      # Byte boundaries distinguish the config directive from the SFX stub's
      # own localized TempMode resource string.
      type: hex
      pattern: "0D 0A 54 65 6D 70 4D 6F 64 65 0D 0A"
      offset_range: [131072, null]
  - id: sfx-setup-rat-executable
    desc: WinRAR SFX Setup directive launches rat.exe
    crit: notable
    conf: 0.99
    attack: T1204.002
    if:
      type: raw
      regex: '(?im)^Setup\s*=\s*"?rat\.exe"?\s*$'
  - id: sfx-setup-legacy-pif-scr-com
    desc: SFX Setup uses PIF, SCR, or COM
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: '(?i)\bSetup=[^\r\n]{1,120}\.(pif|scr|com)(\s|$)'
  - id: sfx-setup-legacy-cpl-hta
    desc: SFX Setup uses CPL or HTA
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: '(?i)\bSetup=[^\r\n]{1,120}\.(cpl|hta)(\s|$)'
  - id: sfx-setup-encoded-vbs
    desc: SFX Setup launches encoded VBScript
    crit: notable
    conf: 0.96
    attack: T1204.002,T1059.005
    if:
      type: text
      regex: '(?i)\bSetup=[^\r\n]{1,120}\.(vbe|vbs)\b'
  - id: sfx-xeno-injector-payload
    desc: SFX contains Xeno injector payload
    crit: suspicious
    conf: 0.96
    attack: T1204.002
    if:
      type: text
      exact: xenoinjector.exe
  - id: sfx-xeno-tool-payload
    desc: SFX contains Xeno injector tool
    crit: suspicious
    conf: 0.96
    attack: T1204.002
    if:
      type: text
      regex: '(?i)Xeno-v[0-9][A-Za-z0-9_.-]*\.exe'
  - id: sfx-presetup-executable
    desc: SFX presetup names an executable
    crit: suspicious
    conf: 0.93
    for: [pe, static-lib, text]
    if:
      type: text
      regex: '(?i)\bPresetup\s*=\s*[^\r\n]{0,80}\.exe\b'

  - id: sfx-overwrite-enabled
    desc: SFX overwrites existing files
    crit: suspicious
    conf: 0.9
    for: [pe, static-lib, text]
    if:
      type: text
      regex: '(?i)\bOverwrite\s*=\s*"?1"?\b'

  - id: sfx-silent-install
    desc: SFX installs without prompts
    crit: suspicious
    conf: 0.9
    for: [pe, static-lib, text]
    if:
      # Anchor the directive to its own CRLF-terminated line. SFX config
      # blocks are line-based (`...=\r\nSilent=1\r\n...`); a bare "Silent=1"
      # token inside a bundled app's data or minified JS is not an SFX
      # directive, and multi-megabyte bundles embed those constantly.
      type: raw
      regex: '(?i)\r\nSilent[ \t]*=[ \t]*"?1"?\r?(\n|$)'

  - id: sfx-presetup-exe-utf16
    desc: UTF-16 SFX presetup names an executable
    crit: suspicious
    conf: 0.93
    if:
      # The SFX config is part of the archive appended after the stub.
      type: hex
      section: overlay
      pattern: "50 00 72 00 65 00 73 00 65 00 74 00 75 00 70 00 3D 00 [0-24] 2E 00 65 00 78 00 65 00"

  - id: sfx-silent-utf16
    desc: UTF-16 SFX silent install flag
    crit: suspicious
    conf: 0.9
    if:
      # The SFX config is part of the archive appended after the stub.
      type: hex
      section: overlay
      pattern: "53 00 69 00 6C 00 65 00 6E 00 74 00 3D 00 31 00"

  - id: sfx-overwrite-utf16
    desc: UTF-16 SFX overwrite flag
    crit: suspicious
    conf: 0.9
    if:
      # The SFX config is part of the archive appended after the stub.
      type: hex
      section: overlay
      pattern: "4F 00 76 00 65 00 72 00 77 00 72 00 69 00 74 00 65 00 3D 00 31 00"

  # The same UTF-16 SFX script also travels on its own as an extracted RAR
  # archive comment (no PE stub, typed `data`). Each directive starts its own
  # CRLF-terminated line, so these variants anchor on the preceding CRLF.
  - id: sfx-comment-presetup-exe-utf16
    desc: UTF-16 SFX comment presetup runs exe
    crit: suspicious
    conf: 0.93
    for: [data]
    if:
      type: hex
      pattern: "0D 00 0A 00 50 00 72 00 65 00 73 00 65 00 74 00 75 00 70 00 3D 00 [0-24] 2E 00 65 00 78 00 65 00"

  - id: sfx-comment-silent-utf16
    desc: UTF-16 SFX comment silent flag
    crit: suspicious
    conf: 0.9
    for: [data]
    if:
      type: hex
      pattern: "0D 00 0A 00 53 00 69 00 6C 00 65 00 6E 00 74 00 3D 00 31 00 0D 00"

  - id: sfx-comment-overwrite-utf16
    desc: UTF-16 SFX comment overwrite flag
    crit: suspicious
    conf: 0.9
    for: [data]
    if:
      type: hex
      pattern: "0D 00 0A 00 4F 00 76 00 65 00 72 00 77 00 72 00 69 00 74 00 65 00 3D 00 31 00"

composite_rules:
  - id: sfx-comment-silent-presetup-utf16
    desc: UTF-16 SFX comment runs exe silently
    crit: hostile
    conf: 0.94
    attack: T1204.002
    for: [data]
    all:
      - id: sfx-comment-presetup-exe-utf16
      - id: sfx-comment-silent-utf16
      - id: sfx-comment-overwrite-utf16

  - id: sfx-silent-presetup-overwrite
    desc: SFX presetup runs silently and overwrites
    crit: hostile
    conf: 0.94
    attack: T1204.002
    for: [pe, static-lib, text]
    all:
      - id: sfx-presetup-executable
      - id: sfx-silent-install
      - id: sfx-overwrite-enabled

  - id: sfx-silent-presetup-overwrite-utf16
    desc: UTF-16 SFX presetup runs silently
    crit: hostile
    conf: 0.94
    attack: T1204.002
    all:
      - id: sfx-presetup-exe-utf16
      - id: sfx-silent-utf16
      - id: sfx-overwrite-utf16

  - id: sfx-setup-legacy-executable
    desc: Legacy executable SFX Setup
    crit: notable
    conf: 0.95
    any:
      - id: sfx-setup-legacy-pif-scr-com
      - id: sfx-setup-legacy-cpl-hta

  - id: alzip-sfx-upx-wrapped
    desc: ALZip self-extractor wrapped in UPX packer
    crit: suspicious
    conf: 0.93
    mbc: B0032
    attack: T1027.002
    all:
      - id: metadata/binary/installer/sfx::alzip-sfx
      - id: metadata/binary/section/label::upx-section-pair
  - id: sfx-hidden-cmd-media-dropper
    desc: SFX hidden command executes media-named payload
    crit: hostile
    conf: 0.99
    attack: "T1204.002, T1059.003, T1036.008"
    mbc: "B0023, E1059"
    all:
      - id: sfx-runprogram-directive
      - id: micro-behaviors/process/create/hidden::sfx-hidcon-prefix
      - id: micro-behaviors/process/create/exec::cmd-shell-via-createprocess
      - id: sfx-hidden-cmd-stdin
      - id: sfx-video-extension-stdin
      - id: sfx-media-named-entry
  - id: winrar-sfx-xeno-injector-dropper
    desc: WinRAR SFX silently drops Xeno injector
    crit: hostile
    conf: 0.98
    attack: "T1204.002, T1055"
    mbc: "B0023, E1055"
    all:
      - id: sfx-temp-path-directive
      - id: sfx-silent-directive
      - id: sfx-xeno-injector-payload
      - id: sfx-xeno-tool-payload
    any:
      - id: metadata/binary/installer/sfx::winrar-sfx
      - id: metadata/binary/installer/sfx::dialog-start
      - id: metadata/binary/installer/sfx::registry-key
    unless:
      - id: metadata/signed/platform/
  - id: winrar-sfx-silent-legacy-executable
    desc: WinRAR SFX silently runs a legacy executable payload
    crit: hostile
    conf: 0.97
    attack: T1204.002,T1036.007
    all:
      - id: metadata/binary/installer/sfx::winrar-sfx
      - id: sfx-silent-directive
      - id: sfx-setup-legacy-executable
    unless:
      - id: metadata/signed/platform/
  - id: winrar-sfx-temp-rat-dropper
    desc: WinRAR SFX extracts and launches a RAT-named payload from temp
    crit: hostile
    conf: 0.995
    attack: T1204.002,T1027.009
    all:
      - id: metadata/binary/installer/sfx::winrar-sfx
      - id: sfx-temp-mode-directive
      - id: sfx-setup-rat-executable
    unless:
      - id: metadata/signed/platform/
  - id: iso-winrar-silent-legacy-executable-dropper
    desc: ISO carries a silent WinRAR SFX for a legacy executable payload
    crit: hostile
    conf: 0.98
    for: [iso, data]
    attack: T1204.002,T1036.007
    all:
      - id: metadata/file/format/iso/structure::primary-volume-descriptor
      - id: metadata/file/format/iso/member::iso-winrar-sfx-module
      - id: metadata/file/format/iso/payload::iso-sfx-setup-silent-pif

  # Read entirely off the SFX config, with no floor on how big the archive is.
  # Every other silent-SFX composite in this tree hangs off
  # `large-high-entropy-overlay`, which needs a megabyte of payload, so a small
  # dropper -- a 167 KB stub carrying a 60 KB archive -- satisfied the semantics
  # of those rules and was scored clean because the payload was too small.
  #
  # Extraction-time behaviour is the whole of the evidence and it is coherent:
  # run the extracted binary, show the user nothing while doing it, then erase
  # the stub. An installer does the first, sometimes the second, and has no
  # reason for the third.
  - id: silent-self-deleting-sfx-dropper
    desc: Silent SFX runs payload then self-deletes
    crit: hostile
    conf: 0.97
    attack: T1204.002,T1070.004
    mbc: B0023
    all:
      - id: sfx-self-delete-directive
      - id: sfx-runprogram-escaped-quote-value
      - id: objectives/command-and-control/dropper/execution/installer::sfx-progress-disabled
      - id: metadata/signed/trust-level::unsigned-missing-signature-record
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/installer/family/

  # The SFX and the AutoIt payload are separate leaves in the extraction tree.
  # Correlate them only at the outer-input scope so an ordinary AutoIt program
  # or an ordinary SFX does not match by itself.
  # Stock WinRAR SFX installers exist, but a stub whose overlay is most of the
  # file and whose body is packing-grade entropy is a dropper carrier, not a
  # product installer: the UI module is a few hundred KB and the rest is the
  # packed stage.
  - id: winrar-sfx-dominant-overlay-dropper
    desc: WinRAR SFX stub carries a dominant high-entropy overlay
    crit: hostile
    conf: 0.96
    attack: T1204.002,T1027.009
    mbc: B0023
    all:
      - id: metadata/binary/installer/sfx::winrar-sfx
      - id: metadata/binary/layout/overlay::overlay-dominates-80pct
      - id: metadata/binary/layout/overlay::large-overlay-1mb
      - id: metadata/binary/layout/entropy::very-high-overall-entropy-75
    unless:
      - id: metadata/signed/platform/

  - id: winrar-sfx-temp-overlay-dropper
    desc: WinRAR SFX temp extract with overlay
    crit: hostile
    conf: 0.96
    attack: T1204.002,T1027.002
    all:
      - id: metadata/binary/installer/sfx::winrar-sfx
      - id: sfx-temp-mode-directive
      - id: metadata/binary/layout/overlay::overlay-at-least-half
    unless:
      - id: metadata/signed/platform/

  - id: winrar-sfx-wscript-temp-dropper
    desc: WinRAR SFX temp extract launches WScript
    crit: hostile
    conf: 0.96
    attack: T1204.002,T1059.005
    all:
      - id: metadata/binary/installer/sfx::winrar-sfx
      - id: sfx-temp-mode-directive
      - id: micro-behaviors/os/com/automation::wscript-shell-literal
    unless:
      - id: metadata/signed/platform/

  - id: winrar-sfx-overlay-peb-stub
    desc: WinRAR SFX overlay stub walks the PEB
    crit: hostile
    conf: 0.96
    attack: T1204.002,T1027.002
    all:
      - id: metadata/binary/installer/sfx::winrar-sfx
      - id: metadata/binary/layout/overlay::overlay-at-least-half
      - id: objectives/anti-static/obfuscation/imports::peb-ldr-access
    unless:
      - id: metadata/signed/platform/

  - id: winrar-sfx-temp-encoded-vbs-dropper
    desc: WinRAR SFX temp extract launches encoded VBScript
    crit: hostile
    conf: 0.97
    attack: T1204.002,T1059.005
    all:
      - id: metadata/binary/installer/sfx::winrar-sfx
      - id: sfx-temp-mode-directive
      - id: sfx-setup-encoded-vbs
    unless:
      - id: metadata/signed/platform/

  - id: winrar-sfx-silent-autoit-injector
    desc: Silent WinRAR SFX carries an AutoIt process-injection payload
    crit: hostile
    conf: 0.99
    scope: outer
    attack: T1055,T1204.002,T1036.007
    all:
      - id: metadata/binary/installer/sfx::winrar-sfx
      - id: sfx-silent-directive
      - id: sfx-setup-legacy-executable
      - id: objectives/evasion/process/injection/native::autoit-remote-memory-injector
