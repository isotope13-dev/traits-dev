defaults:
  platforms: [windows]
  for: [pe]
traits:
  - id: sfx-runprogram-directive
    desc: SFX RunProgram directive
    crit: component
    conf: 0.9
    if:
      type: text
      substr: RunProgram=
  # `SelfDelete` is not in the stock 7-Zip SFX module; it comes from the
  # extended 7zSD builders, and it makes the stub erase itself once the
  # extracted stage is running. An installer has no reason to destroy the thing
  # the user just downloaded -- keeping it is what lets them reinstall or check
  # a hash -- so this is an anti-forensics directive: after execution the only
  # artefact left on disk is whatever came out of the archive.
  - id: sfx-self-delete-directive
    desc: SFX stub deletes itself after running
    crit: notable
    conf: 0.95
    attack: T1070.004
    if:
      type: text
      regex: 'SelfDelete\s*=\s*"?1"?'
  # Read from raw bytes, not from the extracted-string corpus. 7-Zip SFX writes
  # a quoted command as `RunProgram="\"%%T\\stage.exe\""`, and the string
  # extractor drops those lines while keeping every neighbouring directive --
  # `Progress`, `SelfDelete` and `InstallPath` all survive, the three
  # `RunProgram` lines between them do not. Any `type: text` rule aimed at the
  # directive is therefore blind to the escaped spelling, which is the one the
  # tool emits whenever the command contains a path.
  - id: sfx-runprogram-escaped-quote-value
    desc: SFX RunProgram value is an escaped path
    crit: notable
    conf: 0.94
    attack: T1204.002
    if:
      # Anchored on the CRLF that ends the previous directive, so this is the
      # start of a config line rather than the token appearing inside some
      # unrelated string.
      type: raw
      regex: '\r\nRunProgram\s*=\s*"\\"'
  - id: sfx-hidden-cmd-stdin
    desc: SFX hidden cmd stdin execution
    crit: suspicious
    conf: 0.96
    attack: T1204.002
    mbc: B0023
    if:
      type: text
      substr: 'hidcon:cmd /c cmd <'
  - id: sfx-video-extension-stdin
    desc: SFX command reads video file
    crit: component
    conf: 0.9
    if:
      type: text
      regex: '\.(mpg|mpeg|avi|mp4)"'
  - id: sfx-media-named-entry
    desc: SFX media-named payload entry
    crit: component
    conf: 0.9
    if:
      type: text
      regex: '(?i)[A-Za-z0-9_. -]{1,80}\.(mpg|mpeg|avi|mp4),'
  - id: sfx-temp-path-directive
    desc: SFX extracts to temp directory
    crit: component
    conf: 0.9
    if:
      type: text
      exact: Path=%temp%
  - id: sfx-silent-directive
    desc: SFX silent execution directive
    crit: component
    conf: 0.9
    if:
      type: text
      substr: Silent=1
  - id: sfx-temp-mode-directive
    desc: WinRAR SFX extracts payloads to temp
    crit: component
    conf: 0.98
    if:
      # Byte boundaries distinguish the config directive from the SFX stub's
      # own localized TempMode resource string.
      type: hex
      pattern: "0D 0A 54 65 6D 70 4D 6F 64 65 0D 0A"
      offset_range: [131072, null]
  - id: sfx-setup-rat-executable
    desc: WinRAR SFX Setup directive launches rat.exe
    crit: notable
    conf: 0.99
    attack: T1204.002
    if:
      type: raw
      regex: '(?im)^Setup\s*=\s*"?rat\.exe"?\s*$'
  - id: sfx-setup-legacy-pif-scr-com
    desc: SFX Setup uses PIF, SCR, or COM
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: '(?i)\bSetup=[^\r\n]{1,120}\.(pif|scr|com)(\s|$)'
  - id: sfx-setup-legacy-cpl-hta
    desc: SFX Setup uses CPL or HTA
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: '(?i)\bSetup=[^\r\n]{1,120}\.(cpl|hta)(\s|$)'
  - id: sfx-xeno-injector-payload
    desc: SFX contains Xeno injector payload
    crit: suspicious
    conf: 0.96
    attack: T1204.002
    if:
      type: text
      exact: xenoinjector.exe
  - id: sfx-xeno-tool-payload
    desc: SFX contains Xeno injector tool
    crit: suspicious
    conf: 0.96
    attack: T1204.002
    if:
      type: text
      regex: '(?i)Xeno-v[0-9][A-Za-z0-9_.-]*\.exe'
composite_rules:
  - id: sfx-setup-legacy-executable
    desc: Legacy executable SFX Setup
    crit: notable
    conf: 0.95
    any:
      - id: sfx-setup-legacy-pif-scr-com
      - id: sfx-setup-legacy-cpl-hta

  - id: alzip-sfx-upx-wrapped
    desc: ALZip self-extractor wrapped in UPX packer
    crit: suspicious
    conf: 0.93
    mbc: B0032
    attack: T1027.002
    all:
      - id: metadata/binary/installer/sfx::alzip-sfx
      - id: metadata/binary/section/names::upx-section-pair
  - id: sfx-hidden-cmd-media-dropper
    desc: SFX hidden command executes media-named payload
    crit: hostile
    conf: 0.99
    attack: "T1204.002, T1059.003, T1036.008"
    mbc: "B0023, E1059"
    all:
      - id: sfx-runprogram-directive
      - id: micro-behaviors/process/create/hidden::sfx-hidcon-prefix
      - id: micro-behaviors/process/create/exec::cmd-shell-via-createprocess
      - id: sfx-hidden-cmd-stdin
      - id: sfx-video-extension-stdin
      - id: sfx-media-named-entry
  - id: winrar-sfx-xeno-injector-dropper
    desc: WinRAR SFX silently drops Xeno injector
    crit: hostile
    conf: 0.98
    attack: "T1204.002, T1055"
    mbc: "B0023, E1055"
    all:
      - id: sfx-temp-path-directive
      - id: sfx-silent-directive
      - id: sfx-xeno-injector-payload
      - id: sfx-xeno-tool-payload
    any:
      - id: metadata/binary/installer/sfx::winrar-sfx
      - id: metadata/binary/installer/sfx::dialog-start
      - id: metadata/binary/installer/sfx::registry-key
    unless:
      - id: metadata/signed/platform/
  - id: winrar-sfx-silent-legacy-executable
    desc: WinRAR SFX silently runs a legacy executable payload
    crit: hostile
    conf: 0.97
    attack: T1204.002,T1036.007
    all:
      - id: metadata/binary/installer/sfx::winrar-sfx
      - id: sfx-silent-directive
      - id: sfx-setup-legacy-executable
    unless:
      - id: metadata/signed/platform/
  - id: winrar-sfx-temp-rat-dropper
    desc: WinRAR SFX extracts and launches a RAT-named payload from temp
    crit: hostile
    conf: 0.995
    attack: T1204.002,T1027.009
    all:
      - id: metadata/binary/installer/sfx::winrar-sfx
      - id: sfx-temp-mode-directive
      - id: sfx-setup-rat-executable
    unless:
      - id: metadata/signed/platform/
  - id: iso-winrar-silent-legacy-executable-dropper
    desc: ISO carries a silent WinRAR SFX for a legacy executable payload
    crit: hostile
    conf: 0.98
    for: [iso]
    attack: T1204.002,T1036.007
    all:
      - id: metadata/file/format/structured::primary-volume-descriptor
      - id: metadata/file/format/iso::iso-winrar-sfx-module
      - id: metadata/file/format/iso::iso-sfx-setup-silent-pif

  # Read entirely off the SFX config, with no floor on how big the archive is.
  # Every other silent-SFX composite in this tree hangs off
  # `large-high-entropy-overlay`, which needs a megabyte of payload, so a small
  # dropper -- a 167 KB stub carrying a 60 KB archive -- satisfied the semantics
  # of those rules and was scored clean because the payload was too small.
  #
  # Extraction-time behaviour is the whole of the evidence and it is coherent:
  # run the extracted binary, show the user nothing while doing it, then erase
  # the stub. An installer does the first, sometimes the second, and has no
  # reason for the third.
  - id: silent-self-deleting-sfx-dropper
    desc: Silent SFX runs payload then self-deletes
    crit: hostile
    conf: 0.97
    attack: T1204.002,T1070.004
    mbc: B0023
    all:
      - id: sfx-self-delete-directive
      - id: sfx-runprogram-escaped-quote-value
      - id: objectives/command-and-control/dropper/execution/installer::sfx-progress-disabled
      - id: metadata/binary/layout::pe-no-signature-record
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/installer/family/

  # The SFX and the AutoIt payload are separate leaves in the extraction tree.
  # Correlate them only at the outer-input scope so an ordinary AutoIt program
  # or an ordinary SFX does not match by itself.
  - id: winrar-sfx-silent-autoit-injector
    desc: Silent WinRAR SFX carries an AutoIt process-injection payload
    crit: hostile
    conf: 0.99
    scope: outer
    attack: T1055,T1204.002,T1036.007
    all:
      - id: metadata/binary/installer/sfx::winrar-sfx
      - id: sfx-silent-directive
      - id: sfx-setup-legacy-executable
      - id: objectives/evasion/process/injection/native::autoit-remote-memory-injector
