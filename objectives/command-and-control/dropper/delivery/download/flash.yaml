defaults:
  for: [data]
  platforms: [windows, unix]
  attack: T1105
  mbc: E1105

composite_rules:
  - id: flash-version-keyed-remote-stage
    desc: Flash version probe selects remote SWF stage
    crit: hostile
    conf: 0.99
    all:
      - id: micro-behaviors/os/sysinfo/platform/version::flash-player-version-query
      - id: micro-behaviors/communications/http/download/url::flash-geturl2-http-stage
