defaults:
  for:
    - pe
    - dll
  platforms:
    - windows
traits:
  - id: form-urlencoded-header
    desc: Form URL encoded HTTP payload header
    crit: notable
    conf: 0.75
    attack: T1071.001
    if:
      type: text
      exact: Content-Type:application/x-www-form-urlencoded
  - id: uid-file-telemetry-query
    desc: UID file telemetry query format string
    crit: suspicious
    conf: 0.85
    attack: T1071.001
    if:
      type: text
      regex: '\?uid=%s&ft=\d+&st=%d&fn=%s&fl=%d'
composite_rules:
  - id: unsigned-wininet-runkey-dropper
    desc: Unsigned WinInet downloader writes a Run key
    crit: hostile
    conf: 0.95
    attack: T1105,T1547.001
    all:
      - id: micro-behaviors/communications/http/client/wininet::unsigned-wininet-file-process-api-profile
      - id: micro-behaviors/os/registry/keys::currentversion-run
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/installer/family/
      - id: metadata/binary/framework/
  - id: unsigned-wininet-create-process-stage
    desc: Unsigned WinInet downloader creates a process
    crit: hostile
    conf: 0.95
    attack: T1105,T1059
    all:
      - id: micro-behaviors/communications/http/client/wininet::unsigned-wininet-file-process-api-profile
      - id: micro-behaviors/process/create/spawn::create-process-a
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/installer/family/
      - id: metadata/binary/framework/

  - id: wininet-uid-beacon-telemetry
    desc: WinInet UID beacon and telemetry reporting
    crit: suspicious
    conf: 0.9
    attack: T1071.001
    all:
      - id: micro-behaviors/communications/http/client/wininet::internet-open
      - id: micro-behaviors/communications/http/client/wininet::internet-read-file
      - id: micro-behaviors/communications/http/message::http-prefix
    any:
      - id: uid-file-telemetry-query
      - id: form-urlencoded-header
      - id: micro-behaviors/os/registry/access::internet-settings-autodial-tamper
