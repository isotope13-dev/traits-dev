# Nemucod JScript Downloader Behavior
# Detects Nemucod family variants based on behavioral patterns
defaults:
  crit: hostile
  platforms: [linux, macos, windows, unix, android, ios]
  for: [javascript]
composite_rules:
- id: js-nemucod-downloader-jitter
  desc: Nemucod JScript downloader with timing jitter check
  crit: hostile
  all:
  - id: objectives/anti-analysis/timing/nemucod::nemucod-jitter-check
  - id: micro-behaviors/fs/write/file/stream::adodb-fragment-adod
# The WSH root-object leg only scopes this to a Windows Script Host script; it
# carries no intent on its own. The conviction comes from the split "ADODB" and
# "SaveToFile" literals, so the `any:` group below names the remaining halves of
# that same reconstruction -- a real Nemucod dropper splits both strings, and
# requiring a second fragmentation witness keeps a lone "ADOD" literal from
# reaching hostile.
- id: js-nemucod-fragmented-drop
  desc: Nemucod fragmented ADODB.Stream drop and execute
  crit: hostile
  all:
  - id: micro-behaviors/os/com/object::wscript-host-object
  - id: micro-behaviors/fs/write/file/stream::adodb-fragment-adod
  - id: objectives/anti-static/obfuscation/string/conceal::save-to-file-fragment-oFil
  any:
  - id: micro-behaviors/fs/write/file/stream::adodb-savetofile-split-literal-any
  - id: objectives/anti-static/obfuscation/syntax::js-fragmented-property-access
  needs: 1
