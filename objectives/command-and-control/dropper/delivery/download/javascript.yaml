defaults:
  for: [javascript]
  platforms: [windows]
composite_rules:
- id: js-downloader-wsh-classic
  crit: hostile
  conf: 0.95
  desc: JavaScript WSH downloader with file drop and execute
  all:
  - id: objectives/execution/interpreter/script/wsh::wscript-shell
  - id: micro-behaviors/communications/http/client/xmlhttp::http-client-msxml-serverxmlhttp-progid
  - id: micro-behaviors/process/create/exec::file-execution
  - id: objectives/command-and-control/dropper/execution/loader::file-write
- id: js-downloader-wsh-obfuscated
  crit: hostile
  conf: 0.95
  desc: Obfuscated JavaScript WSH downloader execution chain
  all:
  - id: objectives/execution/interpreter/script/wsh::wscript-shell
  - id: micro-behaviors/process/create/exec::file-execution

# Obfuscator.io-packed JScript that fetches a remote .ps1 (or talks XMLHTTP),
# stages via FileSystemObject under Temp, then launches PowerShell with
# -nop -ep bypass -file. WScript.Shell is often fully string-encrypted.
- id: obfuscated-js-activex-ps1-http-stager
  crit: hostile
  conf: 0.98
  desc: Obfuscated ActiveX JS stages remote PS1
  attack: T1027,T1059.001,T1059.007,T1105,T1562.001
  all:
  - id: micro-behaviors/process/interpreter/jscript::activex-object
  - id: micro-behaviors/os/com/object::filesystemobject-progid
  - id: micro-behaviors/fs/write/content::create-text-file-api
  - id: micro-behaviors/process/create/flags::powershell-nop-ep-bypass-file-command
  - id: objectives/anti-static/obfuscation/obfuscator/js-obfuscator::any-name-mangling
  any:
  - id: micro-behaviors/communications/http/download/url::executable-url-reference-b
  - id: micro-behaviors/communications/http/client/xmlhttp::js-xmlhttp-progid
  - id: micro-behaviors/communications/ip/literal::javascript-external-http-ip-url
  needs: 1
