defaults:
  crit: hostile
  for: [javascript]
  platforms: [windows]
composite_rules:
- id: js-downloader-wsh-classic
  crit: hostile
  conf: 0.95
  desc: JavaScript WSH downloader with file drop and execute
  all:
  - id: micro-behaviors/os/com/automation::wscript-shell-literal
  - id: micro-behaviors/communications/http/client/xmlhttp::http-client-msxml-serverxmlhttp-progid
  - id: micro-behaviors/process/create/exec::file-execution
  - id: micro-behaviors/fs/write/file/handle::file-write
- id: js-downloader-wsh-obfuscated
  crit: hostile
  conf: 0.95
  desc: Obfuscated JavaScript WSH downloader execution chain
  all:
  - id: micro-behaviors/os/com/automation::wscript-shell-literal
  - id: micro-behaviors/process/create/exec::file-execution
  # WScript.Shell plus a hidden Run is also used by legitimate Windows
  # autostart wrappers.  This branch is specifically named obfuscated, so it
  # needs an actual name-mangling signal before it can describe a dropper.
  any:
  - id: objectives/anti-static/obfuscation/obfuscator/js-obfuscator::any-name-mangling
  needs: 1

# Obfuscator.io-packed JScript that fetches a remote .ps1 (or talks XMLHTTP),
# stages via FileSystemObject under Temp, then launches PowerShell with
# -nop -ep bypass -file. WScript.Shell is often fully string-encrypted.
- id: obfuscated-js-activex-ps1-http-stager
  crit: hostile
  conf: 0.98
  desc: Obfuscated ActiveX JS stages remote PS1
  attack: T1027,T1059.001,T1059.007,T1105,T1562.001
  all:
  - id: micro-behaviors/process/interpreter/jscript::activex-object
  - id: micro-behaviors/os/com/automation::filesystemobject-progid
  - id: micro-behaviors/fs/write/content::create-text-file-api
  - id: micro-behaviors/process/create/flags::powershell-nop-ep-bypass-file-command
  - id: objectives/anti-static/obfuscation/obfuscator/js-obfuscator::any-name-mangling
  any:
  - id: micro-behaviors/communications/http/download/url::executable-url-reference-b
  - id: micro-behaviors/communications/http/client/xmlhttp::js-xmlhttp-progid
  - id: micro-behaviors/communications/ip/literal::javascript-external-http-ip-url
  needs: 1

# Same staging chain as above when the obfuscated script embeds a remote .ps1
# URL and launches it with -nop -ep bypass -file, without requiring an
# FileSystemObject save path to be visible in strings.
- id: obfuscated-js-activex-remote-ps1-bypass
  crit: hostile
  conf: 0.98
  desc: Obfuscated ActiveX JS launches remote PowerShell script URL
  attack: T1027,T1059.001,T1059.007,T1105,T1562.001
  all:
  - id: micro-behaviors/process/interpreter/jscript::activex-object
  - id: micro-behaviors/process/create/flags::powershell-nop-ep-bypass-file-command
  - id: micro-behaviors/process/create/flags::execution-policy-bypass
  - id: objectives/anti-static/obfuscation/obfuscator/js-obfuscator::any-name-mangling
  - id: micro-behaviors/communications/http/download/url::executable-url-reference-b
  unless:
  - id: obfuscated-js-activex-ps1-http-stager

# Obfuscated JScript/WSH that pulls a remote .ps1 via ActiveX XMLHTTP and
# stages execution through WScript.Shell or a temp write, without requiring
# -ep bypass literals to survive obfuscation.
- id: obfuscated-js-activex-xmlhttp-remote-ps1
  crit: hostile
  conf: 0.98
  desc: Obfuscated ActiveX JScript XMLHTTP remote PS1 fetcher
  attack: T1027,T1059.007,T1105
  all:
  - id: micro-behaviors/process/interpreter/jscript::activex-object
  - id: micro-behaviors/communications/http/client/xmlhttp::js-xmlhttp-progid
  - id: micro-behaviors/communications/http/download/url::executable-url-reference-b
  - id: objectives/anti-static/obfuscation/obfuscator/js-obfuscator::any-name-mangling
  any:
  - id: micro-behaviors/os/com/automation::wscript-shell-literal
  - id: micro-behaviors/fs/write/content::create-text-file-api
  needs: 1
  unless:
  - id: obfuscated-js-activex-ps1-http-stager
- id: obfuscated-js-activex-remote-ps-wscript-stager
  crit: hostile
  conf: 0.98
  desc: Obfuscated ActiveX stages remote PowerShell via WScript
  attack: T1027,T1059.001,T1059.007,T1105
  all:
  - id: micro-behaviors/process/interpreter/jscript::activex-object
  - id: objectives/anti-static/obfuscation/obfuscator/js-obfuscator::any-name-mangling
  - id: micro-behaviors/communications/http/download/url::executable-url-reference-b
  - id: micro-behaviors/process/create/script/wsh::wscript-marker

