defaults:
  crit: hostile
  for: [javascript]
  platforms: [windows]
composite_rules:
- id: js-downloader-wsh-classic
  crit: hostile
  conf: 0.95
  desc: JavaScript WSH downloader with file drop and execute
  all:
  - id: micro-behaviors/os/com/automation::wscript-shell-literal
  - id: micro-behaviors/communications/http/client/xmlhttp::http-client-msxml-serverxmlhttp-progid
  - id: micro-behaviors/process/create/exec::wsh-progid-near-run
  - id: micro-behaviors/fs/write/file/handle::file-write
- id: js-downloader-wsh-obfuscated
  crit: hostile
  conf: 0.95
  desc: Obfuscated JavaScript WSH downloader execution chain
  all:
  - id: micro-behaviors/os/com/automation::wscript-shell-literal
  - id: micro-behaviors/process/create/exec::wsh-progid-near-run
  # WScript.Shell plus a hidden Run is also used by legitimate Windows
  # autostart wrappers.  This branch is specifically named obfuscated, so it
  # needs an actual name-mangling signal before it can describe a dropper.
  any:
  - id: metadata/lang/javascript-features::generated-name-or-state-syntax
  needs: 1

# Obfuscated JScript/WSH with XMLHTTP and remote script URL clues.
- id: obfuscated-js-activex-xmlhttp-remote-ps1
  crit: hostile
  conf: 0.98
  desc: Obfuscated ActiveX JScript XMLHTTP remote PS1 fetcher
  attack: T1027,T1059.007,T1105
  all:
  - id: micro-behaviors/os/com/automation::activex-constructor-call
  - id: micro-behaviors/communications/http/client/xmlhttp::js-xmlhttp-progid
  - id: micro-behaviors/communications/http/url/path::executable-url-reference-b
  - id: metadata/lang/javascript-features::generated-name-or-state-syntax
  any:
  - id: micro-behaviors/os/com/automation::wscript-shell-literal
  - id: micro-behaviors/fs/write/content::fso-text-file-write-api
  needs: 1
  unless:
  - id: objectives/execution/interpreter/powershell::obfuscated-com-http-powershell-file-launch
- id: obfuscated-js-activex-remote-ps-wscript-stager
  crit: hostile
  conf: 0.98
  desc: Obfuscated ActiveX stages remote PowerShell via WScript
  attack: T1027,T1059.001,T1059.007,T1105
  all:
  - id: micro-behaviors/os/com/automation::activex-constructor-call
  - id: metadata/lang/javascript-features::generated-name-or-state-syntax
  - id: micro-behaviors/communications/http/url/path::executable-url-reference-b
  - id: metadata/lang/runtime::wscript-host-reference
  unless:
  - id: objectives/execution/interpreter/powershell::obfuscated-com-http-powershell-file-launch

# The PowerShell "-nop -ep bypass -file" argv and the XMLHTTP ProgID stay
# inside the RC4 string table. What remains in clear text is the remote .ps1
# URL, ActiveXObject around a decoder call, WScript.Shell, and a bracketed Run.
- id: obfuscated-js-rc4-remote-ps1-wsh-stager
  crit: hostile
  conf: 0.97
  desc: RC4-obfuscated WSH fetches a remote PS1 and runs it
  attack: T1027,T1059.001,T1059.007,T1105
  all:
  - id: micro-behaviors/crypto/symmetric/stream/rc4::js-rc4-implementation
  - id: objectives/anti-static/obfuscation/name-mangling/function-name::hex-named-hex-argument-call
  - id: micro-behaviors/os/com/automation::activex-constructor-call
  - id: micro-behaviors/os/com/automation::activex-obfuscated-progid
  - id: micro-behaviors/process/create/exec::wsh-progid-near-run
  - id: objectives/command-and-control/dropper/staging/encoded/script::http-ps1-url-reference
  - id: micro-behaviors/os/com/automation::filesystemobject-progid
  - id: micro-behaviors/fs/path/temp::js-escaped-c-temp-path

