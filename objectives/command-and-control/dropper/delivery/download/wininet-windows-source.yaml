defaults:
  for:
    - c
    - cpp
  platforms:
    - windows
traits:
  - id: update-command
    desc: Update command handler string
    crit: component
    conf: 0.95
    if:
      type: string_literal
      exact: update
  - id: download-command
    desc: Download command handler string
    crit: component
    conf: 0.95
    if:
      type: string_literal
      exact: download
  - id: xor-buffer-routine
    desc: XOR buffer decode routine
    crit: suspicious
    conf: 0.9
    if:
      type: text
      word: Xorbuff
composite_rules:
  - id: wininet-download-execute-source
    desc: WinInet download and execute flow
    crit: suspicious
    conf: 0.98
    attack: T1105
    # Open-URL, read and run are one download routine. Across a 3000-line GUI
    # unit the URL fetch and an unrelated ShellExecute (open a folder, a link)
    # are hundreds of lines apart.
    near_lines: 120
    all:
      - id: micro-behaviors/communications/http/client/wininet::wininet-open-url-src
    any:
      - id: micro-behaviors/process/create/spawn::create-process-source
      - id: micro-behaviors/process/create/shellexec::shell-execute-source
      - id: micro-behaviors/communications/http/client/wininet::wininet-read-file-src
      - id: xor-buffer-routine
    needs: 2
  - id: authenticated-download-command-surface
    desc: Download and update command surface
    crit: suspicious
    conf: 0.96
    all:
      - id: micro-behaviors/communications/irc/command::irc-protocol
    any:
      - id: update-command
      - id: download-command
      - id: wininet-download-execute-source
    needs: 2
