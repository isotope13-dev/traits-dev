defaults:
  platforms: [android, unix, windows]
  for: [android_apk, zip]
  crit: suspicious
  conf: 0.9
  attack: "T1105"
  mbc: "E1105"

traits:
- id: android-packageinstaller-session
  desc: Android PackageInstaller session API
  crit: notable
  conf: 0.9
  if:
    type: text
    substr: "Landroid/content/pm/PackageInstaller$Session;"

- id: android-install-receiver-class
  desc: Android install receiver class
  crit: notable
  conf: 0.86
  if:
    type: text
    substr: "InstallReceiver"

- id: android-install-activity-class
  desc: Android install activity class
  crit: notable
  conf: 0.86
  if:
    type: text
    substr: "InstallingActivity"

- id: android-install-telemetry-event
  desc: Android app installation telemetry
  crit: notable
  conf: 0.84
  if:
    type: text
    substr: "app_installation"


composite_rules:
- id: android-remote-apk-installer
  desc: Android remote APK installer
  crit: hostile
  conf: 0.97
  for: [android_apk, zip, dex]
  all:
  - id: objectives/command-and-control/channel/http/uri::android-support-c2-workflow
  - id: micro-behaviors/os/package-manager/sideload::android-apk-mime-type
  - id: micro-behaviors/os/package-manager/sideload::package-installer-service-class

- id: android-apk-install-telemetry
  desc: Android APK install telemetry
  crit: suspicious
  conf: 0.94
  for: [android_apk, zip, dex]
  all:
  - id: micro-behaviors/os/package-manager/sideload::android-apk-mime-type
  - id: objectives/command-and-control/channel/http/uri::android-support-install-status
  any:
  - id: objectives/command-and-control/channel/http/uri::android-support-success-status
  - id: objectives/command-and-control/channel/http/uri::android-support-activity-status
  - id: objectives/command-and-control/channel/http/uri::android-support-client-checkin

- id: android-opaque-package-installer
  desc: Android opaque package installer
  crit: suspicious
  conf: 0.94
  all:
  - id: android-packageinstaller-session
  - id: metadata/archive/member/path::archive-root-alphanumeric-asset-name
  any:
  - id: android-install-receiver-class
  - id: android-install-activity-class
  - id: android-install-telemetry-event

- id: android-packageinstaller-with-opaque-asset
  desc: PackageInstaller APIs and install permission coexist with opaque APK assets
  crit: suspicious
  conf: 0.99
  # `outer`, not `archive`: the asset-name legs are value facts on the APK
  # node itself, while the install-session legs land on its classes.dex
  # member. Under `archive` the two never shared a key and this rule could
  # not fire on any real APK.
  scope: outer
  for: [android_apk, zip, xml, dex]
  all:
  - id: micro-behaviors/os/package-manager/sideload::android-packageinstaller-session-params
  - id: micro-behaviors/os/package-manager/sideload::android-packageinstaller-create-session
  - id: micro-behaviors/os/package-manager/sideload::android-packageinstaller-open-write
  - id: metadata/permission/management::android-request-install-packages-request
  # The payload name is whatever the builder generated: `.dat`/`.bin`
  # suffixes, long runs, or a bare 8+ character token at the assets/ root
  # (the Saison-lure dropper ships `assets/78r8x6G5o`). Extensionless payload
  # blobs are typed Unknown by the engine and never reach the entropy rules,
  # so the name shape is the only asset evidence available; the install
  # session and install permission carry the install-capability signal. This
  # combination is suspicious but does not alone establish hostile delivery:
  # virtual Android environments legitimately stage ROM/plugin assets and
  # install apps into guest users.
  any:
  - id: metadata/package/files/mobile-package::apk-assets-data-member
  - id: metadata/package/files/mobile-package::apk-opaque-extensionless-asset
  - id: metadata/package/files/mobile-package::apk-opaque-shortext-asset
  - id: metadata/archive/member/path::archive-root-alphanumeric-asset-name

# nmmp replaces every protected method with a native stub, so an installer
# built on it shows only the PackageInstaller vocabulary in its DEX and none
# of the logic around it. Store and updater apps have nothing to hide from
# bytecode review; virtualizing the code that writes an install session is
# concealment of the drop itself.
- id: android-virtualized-packageinstaller-dropper
  desc: DEX-virtualized APK writes a PackageInstaller session
  crit: hostile
  conf: 0.95
  attack: "T1027.002,T1406,T1631"
  scope: archive
  for: [android_apk, zip, xml, dex, elf, so]
  all:
  - id: objectives/anti-static/pack/nmmp::native-util-class
  - id: objectives/anti-static/pack/nmmp::native-bridge-library
  - id: micro-behaviors/os/package-manager/sideload::android-packageinstaller-create-session
  - id: micro-behaviors/os/package-manager/sideload::android-packageinstaller-open-write
  any:
  - id: metadata/permission/management::android-install-packages-request-source
  - id: metadata/permission/management::android-request-install-packages-request
  - id: micro-behaviors/os/package-manager/sideload::android-can-request-package-installs

- id: android-intent-apk-sideload-dropper
  desc: Compact DEX writes an APK and prompts sideload install
  crit: hostile
  conf: 0.98
  attack: "T1105,T1631"
  mbc: "B0023,E1105"
  for: [dex]
  # The six legs are generic install-flow APIs; in a first-party dropper's
  # compact dex their co-occurrence is the install flow itself. Media
  # players (ijkplayer ships the package-archive MIME in its type table) and
  # Play Core (startInstallPermissionSettingActivity) seed the same
  # vocabulary into multidex blobs tens of megabytes wide, where the cluster
  # is library boilerplate -- those files match the vocabulary rule below
  # instead.
  size_max: 1000000
  all:
  - id: micro-behaviors/os/package-manager/sideload::android-apk-mime-type
  - id: micro-behaviors/os/message/intent::android-action-view-string
  - id: micro-behaviors/os/message/intent::android-intent-set-data-and-type
  - id: micro-behaviors/os/message/intent::android-start-activity
  - id: micro-behaviors/fs/write/file/stream::dalvik-file-output-stream-class
  - id: micro-behaviors/fs/path/storage::android-external-storage-directory-reference
  unless:
  - id: well-known/tool/reverse-engineering/xposed::xposed-installer-dex-identity

- id: android-device-admin-apk-dropper
  desc: APK dropper requests device admin control
  crit: hostile
  conf: 0.98
  attack: "T1105,T1624,T1631"
  for: [dex]
  all:
  - id: android-intent-apk-sideload-dropper
  - id: micro-behaviors/os/privilege/manifest::device-admin-receiver-class
  - id: micro-behaviors/os/privilege/manifest::add-device-admin-action

- id: android-intent-apk-sideload-vocabulary
  desc: Sideload install-flow API vocabulary co-occurs in DEX
  crit: suspicious
  conf: 0.8
  for: [dex]
  # Same cluster without the size gate: in library-laden multidex blobs this
  # is co-occurrence, not conviction (ijkplayer's MIME table and Play Core's
  # deferred-install helpers supply the vocabulary in benign apps).
  all:
  - id: micro-behaviors/os/package-manager/sideload::android-apk-mime-type
  - id: micro-behaviors/os/message/intent::android-action-view-string
  - id: micro-behaviors/os/message/intent::android-intent-set-data-and-type
  - id: micro-behaviors/os/message/intent::android-start-activity
  - id: micro-behaviors/fs/write/file/stream::dalvik-file-output-stream-class
  - id: micro-behaviors/fs/path/storage::android-external-storage-directory-reference
  unless:
  - id: android-intent-apk-sideload-dropper
  - id: well-known/app/communication/mobilego::mobilego-dex-identity
  - id: well-known/tool/reverse-engineering/xposed::xposed-installer-dex-identity
  - id: well-known/app/productivity/ticktick::ticktick-dex-identity
