# JScript Counter-Dropper Composite Rule
# Detects the specific obfuscation and C2 pattern of the Counter-Dropper family
defaults:
  platforms: [unix, windows, macos]
  crit: hostile
  conf: 0.95
composite_rules:
  - id: js-counter-dropper-params
    desc: Counter Dropper URL parameters
    crit: suspicious
    any:
      - id: objectives/command-and-control/channel/http/uri::uri-fragment-counter-id-param
      - id: objectives/command-and-control/channel/http/uri::uri-fragment-counter-rnd-param
    # Either fragment alone is a 4-5 character coincidence in minified JS
    # (vendored doc bundles hit `tr+"` in ordinary string concatenation).
    # The family builds one URL carrying both ?id= and &rnd=, so require both
    # fragments before calling the pair a dropper parameter set.
    needs: 2
  - id: js-counter-dropper-behavior
    desc: JScript Counter-Dropper behavior (obfuscated + C2 fragments)
    all:
      - id: objectives/command-and-control/channel/http/uri::uri-fragment-counter-path-unte
      - id: objectives/command-and-control/dropper/delivery/download::js-counter-dropper-params
      - id: objectives/execution/interpreter/script/wsh/
