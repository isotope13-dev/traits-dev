defaults:
  platforms: [windows]
  for: [pe]
  attack: T1105

composite_rules:
  - id: mpress-wininet-com-import-profile
    desc: MPRESS WinInet COM import profile
    crit: suspicious
    conf: 0.96
    size_min: 32768
    size_max: 49152
    all:
      - id: micro-behaviors/os/module/load::get-proc-address-import
      - id: micro-behaviors/communications/http/get::internet-open
      - id: micro-behaviors/os/com/invoke::co-initialize
    any:
      - id: micro-behaviors/os/module/load::get-module-handle-ansi
      - id: micro-behaviors/os/registry/manipulate::reg-close-key
      - id: micro-behaviors/fs/shell-ops::shell-get-folder-path
      - id: micro-behaviors/ui/window/manage/control::set-parent-api
    needs: 3
    unless:
      - id: metadata/binary/metrics/threshold::many-imports-20
  - id: packed-wininet-network-loader
    desc: Packed WinInet network loader
    crit: suspicious
    conf: 0.94
    size_max: 262144
    all:
      - id: objectives/anti-static/pack/mpress::mpress-section-one
      - id: objectives/anti-static/pack/mpress::mpress-section-two
      - id: mpress-wininet-com-import-profile
      - id: micro-behaviors/communications/http/get::internet-open
      - id: micro-behaviors/os/module/load::get-proc-address-import
    any:
      - id: micro-behaviors/os/module/load::get-module-handle-ansi
      - id: micro-behaviors/os/com/invoke::co-initialize
      - id: micro-behaviors/fs/shell-ops::shell-get-folder-path
      - id: metadata/hardening/memory::wx-section
    needs: 2
    unless:
      - id: metadata/signed/platform/

  # This import surface is substantially narrower than an ordinary packed
  # updater: the stub exposes only dynamic resolution, WinInet, SID cleanup,
  # and Shell32's ordinal-only IsUserAnAdmin check.  Together with MPRESS's
  # concealed payload and an absent signature, it is an admin-gated network
  # loader rather than a generic use of the packer.
  - id: mpress-wininet-admin-gated-loader
    desc: MPRESS WinInet loader conceals an admin-gated payload
    crit: hostile
    conf: 0.98
    attack: T1027.002,T1105,T1548
    size_max: 262144
    all:
      - id: objectives/anti-static/pack/mpress::mpress-sparse-dynamic-loader
      - id: micro-behaviors/communications/http/get::internet-open
      - id: micro-behaviors/os/privilege/check::shell32-ordinal-680
      - id: metadata/binary/symbols/imports::freesid-import
      - id: metadata/binary/symbols/imports::pe-imports-max-six
      - id: metadata/binary/layout::pe-no-signature-record
      - id: metadata/binary/metrics/threshold::high-overall-entropy-70
    unless:
      - id: metadata/signed/platform/
      - id: metadata/signed/developer/
