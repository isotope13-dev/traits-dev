defaults:
  platforms: [windows]
  for: [pe]
  attack: T1105
  mbc: E1105

composite_rules:
  - id: packed-pe-executable-url-dropper
    desc: Packed PE dropper carries executable URL
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/communications/http/download/url::executable-url-reference-pe
    any:
      - id: objectives/anti-static/pack/fsg::fsg-packed-pe
      - id: metadata/binary/section/ratio::pe-no-executable-sections
    unless:
      - id: metadata/signed/platform/
      - id: metadata/signed/developer/
  - id: go-pe-cleartext-executable-url-downloader
    desc: Go PE embeds cleartext HTTP URL to download an executable
    crit: hostile
    conf: 0.98
    attack: T1105,T1071.001
    all:
      - id: micro-behaviors/communications/http/download/url::executable-url-reference-pe
      - id: micro-behaviors/communications/http/url/scheme::cleartext-http-url
      - id: micro-behaviors/process/create/system::go-os-exec-pclntab
    any:
      - id: micro-behaviors/communications/ip/literal::external-ipv4-host-literal-binary
      - id: micro-behaviors/communications/ip/literal::http-ip-url-text
    needs: 1
    unless:
      - id: metadata/signed/platform/
  - id: go-pe-modern-http-tls-agent
    desc: Go PE couples HTTP client with ChaCha and Curve25519 session crypto
    crit: hostile
    conf: 0.97
    attack: T1071.001,T1573.001
    all:
      - id: micro-behaviors/communications/http/lib/netlib::go-http-client-do-string
      - id: micro-behaviors/crypto/symmetric/stream/chacha::chacha20-poly1305-identifier
      - id: micro-behaviors/crypto/asymmetric/curve25519::x25519-key-exchange-term
      - id: micro-behaviors/process/create/system::go-os-exec-pclntab
    unless:
      - id: metadata/signed/platform/
