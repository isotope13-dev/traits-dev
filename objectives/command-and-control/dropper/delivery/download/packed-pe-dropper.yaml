defaults:
  platforms: [windows]
  for: [pe]
  attack: T1105
  mbc: E1105

composite_rules:
  - id: packed-pe-executable-url-dropper
    desc: Packed PE dropper carries executable URL
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/communications/http/download/url::executable-url-reference-pe
    any:
      - id: objectives/anti-static/pack/fsg::fsg-packed-pe
      - id: metadata/binary/section/ratio::pe-no-executable-sections
    unless:
      - id: metadata/signed/platform/
      - id: metadata/signed/developer/
