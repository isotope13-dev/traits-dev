# A stub Flash movie whose only job is to pull another SWF. The compressed
# form is `CWS` plus zlib; the strings live in the inflated movie, not in the
# wrapper. A full movie that happens to mention a URL is larger than this.
defaults:
  platforms: [unix, windows]
  for: [data]
  attack: T1105
  mbc: B0023

traits:
  - id: compressed-swf-header
    desc: Compressed Flash movie header
    crit: notable
    conf: 0.95
    size_max: 2048
    if:
      type: hex
      pattern: "43 57 53"
      offset: 0
  - id: swf-http-url
    desc: Flash movie carries an HTTP URL
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: 'https?://[^\s\x00]{4,120}'
    unless:
      - id: metadata/file/format/structured::sourcemap-context
  - id: swf-movie-filename
    desc: Flash movie names another SWF
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)[\w./-]{1,80}\.swf'

composite_rules:
  - id: tiny-swf-remote-movie-loader
    desc: Tiny Flash movie loads a remote SWF
    crit: hostile
    conf: 0.96
    all:
      - id: compressed-swf-header
      - id: swf-http-url
      - id: swf-movie-filename
