# Flash URLs and movie names are evidence only inside a file whose content
# starts with an SWF signature. Bundled source libraries commonly contain URLs
# and `.swf` format strings, so text alone is not a Flash observation.
defaults:
  platforms: [unix, windows]
  for: [data]
  attack: T1105
  mbc: B0023

traits:
  - id: swf-fws-header
    desc: Uncompressed SWF file signature
    crit: component
    conf: 0.99
    if:
      type: hex
      pattern: "46 57 53"
      offset: 0
  - id: swf-cws-header
    desc: Zlib-compressed SWF file signature
    crit: component
    conf: 0.99
    if:
      type: hex
      pattern: "43 57 53"
      offset: 0
  - id: swf-zws-header
    desc: LZMA-compressed SWF file signature
    crit: component
    conf: 0.99
    if:
      type: hex
      pattern: "5A 57 53"
      offset: 0
  - id: compressed-swf-header
    desc: Compressed Flash movie header
    crit: notable
    conf: 0.95
    size_max: 2048
    if:
      type: hex
      pattern: "43 57 53"
      offset: 0
  - id: swf-http-url-text
    desc: Contains an HTTP URL string
    crit: component
    conf: 0.9
    if:
      type: text
      regex: 'https?://[^\s\x00]{4,120}'
    unless:
      - id: metadata/file/format/source-map::sourcemap-context
  - id: swf-movie-filename-text
    desc: Contains a filename ending in SWF
    crit: component
    conf: 0.9
    if:
      type: text
      regex: '(?i)[\w./-]{1,80}\.swf'

composite_rules:
  - id: swf-movie-header
    desc: File starts with a recognized SWF signature
    crit: component
    conf: 0.99
    any:
      - id: swf-fws-header
      - id: swf-cws-header
      - id: swf-zws-header
  - id: swf-http-url
    desc: Flash movie carries an HTTP URL
    crit: notable
    conf: 0.9
    all:
      - id: swf-movie-header
      - id: swf-http-url-text
  - id: swf-movie-filename
    desc: Flash movie names another SWF
    crit: notable
    conf: 0.9
    all:
      - id: swf-movie-header
      - id: swf-movie-filename-text
  - id: tiny-swf-remote-movie-loader
    desc: Tiny Flash movie loads a remote SWF
    crit: hostile
    conf: 0.96
    all:
      - id: compressed-swf-header
      - id: swf-http-url
      - id: swf-movie-filename
