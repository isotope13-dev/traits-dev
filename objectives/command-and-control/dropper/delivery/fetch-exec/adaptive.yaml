defaults:
  platforms: [unix, windows]
  for: [scripts]
  attack: T1105

traits:
  - id: architecture-parameterized-fetch
    desc: Selects a payload by host architecture
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: '(?is)(uname\s+-m|platform\.machine\(\)).{0,220}(arch=|architecture)'
