defaults:
  for: [shell]
  platforms: [unix]
composite_rules:
  - id: printf-hidden-payload-execution
    desc: Encoded downloader launches hidden temp file
    crit: hostile
    conf: 0.98
    attack: T1105,T1059.004,T1027
    all:
      - id: micro-behaviors/data/decode/char-code/escape-sequence::shell-printf-escape-decoder
      - id: micro-behaviors/communications/http/download/curl::printf-curl-name
      - id: micro-behaviors/fs/chmod/modify::printf-chmod-name
      - id: micro-behaviors/communications/http/url/encoded::printf-http-url
      - id: micro-behaviors/fs/path/temp::printf-hidden-temp-path
      - id: micro-behaviors/process/create/shell/spawn::sh-dynamic-command-target
    any:
      - id: micro-behaviors/process/create/local-exec::variable-output-mode-launch-chain
      - id: micro-behaviors/process/create/local-exec::variable-output-clear-mode-launch-chain
