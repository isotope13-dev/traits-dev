  - text
  near_bytes: 256
  all:
  - id: micro-behaviors/communications/ip/literal::external-ipv4-http-url
  - id: micro-behaviors/communications/http/curl::curl-command-remote-url
  - id: micro-behaviors/fs/chmod/executable/mode::chmod-exec-literal-target
  any:
  - id: metadata/lang/source/syntax/command/invocation::relative-executable-command-text
  - id: micro-behaviors/process/create/local-exec::execute-dot-slash-literal
  - id: micro-behaviors/process/create/local-exec::chmod-then-local-execute-command
  unless:
  - id: metadata/package/testing/
  - id: metadata/path::test-directory-component
  - id: well-known/tool/detection/
- id: raw-ip-curl-text-fetch-execute
  desc: Raw-IP text loader curls and executes payload
  conf: 0.99
  for:
  - text
  near_bytes: 256
  all:
  - id: micro-behaviors/communications/ip/literal::external-ipv4-http-url
  - id: micro-behaviors/communications/http/curl::curl-command-remote-url
  - id: micro-behaviors/fs/chmod/executable/mode::chmod-exec-literal-target
  - id: metadata/lang/source/syntax/command/invocation::relative-executable-command-text
  unless:
