# A raw-IP fetch followed by world-writable executable permissions and launch
# is the IoT delivery shape shown in the article. It is intentionally
# independent of Mozi, Boatnet, filenames, and the listed IP indicators.
defaults:
  platforms: [unix]
  attack: T1105,T1059.004,T1222.002
  mbc: B0030

composite_rules:
  - id: raw-ip-wget-world-writable-fetch-execute
    desc: Raw-IP wget world-writable fetch execute
    crit: hostile
    conf: 0.99
    near_bytes: 256
    all:
      - id: micro-behaviors/communications/ip/literal::external-ipv4-http-url
      - id: micro-behaviors/communications/http/download/shell::wget-http-literal-download
      - id: micro-behaviors/fs/chmod/executable/dangerous::shell-777
    any:
      - id: micro-behaviors/process/create/local-exec::execute-dot-slash-literal
      - id: micro-behaviors/process/create/local-exec::shell-interpreter-local-script
    unless:
      - id: objectives/command-and-control/dropper/delivery/fetch-exec::raw-ip-repeated-download-exec-cleanup
      - id: objectives/command-and-control/dropper/delivery/fetch-exec::raw-ip-repeated-download-chmod-exec
      - id: objectives/command-and-control/botnet/iot::raw-ip-multiarch-protocol-dropper
  - id: raw-ip-wget-text-world-writable-fetch-execute
    desc: Raw-IP text loader fetches and executes
    crit: hostile
    conf: 0.99
    for: [text]
    near_bytes: 256
    all:
      - id: micro-behaviors/communications/ip/literal::external-ipv4-http-url
      - id: micro-behaviors/communications/http/download/shell::wget-http-literal-download
      - id: micro-behaviors/fs/chmod/executable/dangerous::text-777-literal
      - id: micro-behaviors/process/create/local-exec::text-local-relative-executable
  - id: raw-ip-text-multiarch-loader
    desc: Raw-IP text loader targets multiple architectures
    crit: hostile
    conf: 0.99
    for: [text]
    near_bytes: 256
    all:
      - id: raw-ip-wget-text-world-writable-fetch-execute
      - id: micro-behaviors/os/sysinfo/platform/arch::text-multiarch-payload-suffix
  - id: raw-ip-text-payload-replacement
    desc: Raw-IP loader replaces local payloads
    crit: hostile
    conf: 0.98
    for: [text]
    attack: T1070.004,T1105,T1059.004
    near_bytes: 256
    all:
      - id: raw-ip-wget-text-world-writable-fetch-execute
      - id: micro-behaviors/fs/delete/file/command::rm-local-named-file
      - id: micro-behaviors/os/sysinfo/platform/arch::text-multiarch-payload-suffix
