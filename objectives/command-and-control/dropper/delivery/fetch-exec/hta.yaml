# Concealed WSH download/launch plus an unnamed public payload origin.
# Neither ordinary installer downloads nor window hiding alone establish this.
composite_rules:
  - id: offscreen-wsh-bare-ip-fetch-execute
    desc: Off-screen WSH downloads and launches public-IP executable
    crit: hostile
    conf: 0.98
    for: [html]
    platforms: [windows]
    attack: T1105,T1218.005,T1564.003
    near_bytes: 1024
    all:
      - id: objectives/evasion/process/hidden/execution::offscreen-wscript-download-process-profile
      - id: objectives/command-and-control/dropper/delivery/auto-download::bare-ip-installer-download-url
