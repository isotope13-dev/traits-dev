defaults:
  platforms:
  - windows
  for:
  - html
  crit: hostile
composite_rules:
- id: offscreen-wsh-bare-ip-fetch-execute
  desc: Off-screen WSH downloads and launches public-IP executable
  conf: 0.98
  attack: T1105,T1218.005,T1564.003
  near_bytes: 1024
  all:
  - id: objectives/evasion/process/hidden/execution::offscreen-wscript-download-process-profile
  - id: micro-behaviors/communications/http/url/script::public-ip-installer-url-reference
- id: hta-powershell-webclient-download-exec
  desc: HTA downloads and runs payload via PowerShell
  conf: 0.98
  attack: T1105,T1218.005,T1059.001
  all:
  - id: metadata/file/format/markup::hta-application-element
  - id: micro-behaviors/os/com/automation::wscript-shell-literal
  - id: micro-behaviors/communications/http/download/webclient::webclient-downloadfile-call
  - id: micro-behaviors/data/control-flow/dispatch/named::run-zero-style-argument
- id: offscreen-hta-direct-remote-script
  desc: Off-screen HTA loads a remote script
  conf: 0.97
  attack: T1105,T1218.005,T1564.003
  near_bytes: 800
  all:
  - id: metadata/file/extension/identity::hta-html-application-extension
  - id: micro-behaviors/ui/window/control::window-moveto-large-coordinate
  - id: micro-behaviors/communications/http/client/resource::remote-script-element-source
- id: hta-empty-body-remote-script-loader
  desc: Empty-body HTA loads a remote script
  conf: 0.97
  attack: T1105,T1218.005,T1564.003
  near_bytes: 800
  all:
  - id: metadata/file/extension/identity::hta-html-application-extension
  - id: metadata/document/html::empty-html-body
  - id: micro-behaviors/communications/http/client/resource::remote-script-element-source
- id: offscreen-hta-remote-script-loader
  desc: Off-screen HTA dynamically loads and appends remote script
  conf: 0.98
  attack: T1105,T1218.005,T1564.003
  all:
  - id: metadata/file/extension/identity::hta-html-application-extension
  - id: micro-behaviors/ui/window/control::window-offscreen-or-trivial-resize
  - id: objectives/anti-static/obfuscation/string/fragmentation::split-scheme-separator-fragment
  any:
  - id: micro-behaviors/data/collection/dom::source-append-child-call
  - id: micro-behaviors/data/collection/dom::html-text-append-child-call
- id: hta-scriptlet-getobject-dropper
  desc: HTA downloads and executes remote scriptlet via GetObject
  conf: 0.98
  attack: T1105,T1218.005,T1059.007
  all:
  - id: metadata/file/extension/identity::hta-html-application-extension
  - id: micro-behaviors/os/com/automation::getobject-concat-url-clue
  - id: metadata/lang/source/syntax/call/invocation::window-or-unqualified-close-call-text
