# The variable-indirected form of the raw-IP dropper: the C2 address is
# assigned to a shell variable (`server_ip="103.188.82.218"`) and the fetch
# URLs interpolate it (`http://$server_ip/$arch`), so no literal-URL atom
# ever names the endpoint. The fallback clients, the 777 arming, and the
# local execution prove the download-and-run chain; the variable holding a
# literal external IP proves where it phones home.
- id: variable-host-fallback-dropper-exec
  desc: Variable-host fallback download executes payload
  crit: hostile
  conf: 0.98
  attack: T1105,T1059.004,T1222.002
  all:
