- id: shell-download-chmod-exec
  desc: "curl or wget downloads, makes executable, and executes a payload"
  crit: suspicious
  conf: 0.9
  # Keep the three capabilities in one local command sequence. A file-wide
  # conjunction makes ordinary test scripts look like droppers when an
  # unrelated curl and chmod occur in different phases of the test.
  near_bytes: 176
  unless:
  - id: micro-behaviors/communications/url/external/github::shadowsocks-build-deb-bootstrap
  - id: well-known/tool/sysadmin/kubernetes
  - id: metadata/package/files/archive-member::openshift-release-ci-step-context
  - id: micro-behaviors/os/package-manager/installer-script::installer-script
  - id: micro-behaviors/os/package-manager/installer-script::verified-github-release-installer
