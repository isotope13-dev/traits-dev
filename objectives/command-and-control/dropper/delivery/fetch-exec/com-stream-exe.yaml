defaults:
  platforms: [windows]
  for: [html, javascript]
  attack: T1105,T1059.007

composite_rules:
  - id: xmlhttp-stream-concatenated-exe-shellexecute
    desc: XMLHTTP stream saves and launches EXE
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/communications/http/client/xmlhttp::xhr-sync-get
      - id: micro-behaviors/communications/http/client/response-body::javascript-response-body
      - id: micro-behaviors/fs/file/read-write::js-concatenated-adodb-stream-progid
      - id: micro-behaviors/fs/path/construct::js-concatenated-exe-path
      - id: micro-behaviors/fs/write/file/stream::js-savetofile-dynamic-path-mode-2
      - id: micro-behaviors/process/create/shellexec::shell-application-execute-context
