defaults:
  platforms:
  - unix
  - windows
  for:
  - javascript
  - typescript
  attack: T1105,T1059.007,T1027
  mbc: B0024
  crit: hostile
composite_rules:
- id: hex-decoded-http-stream-exe-dropper
  desc: Hex-decoded HTTP URL downloaded and executed hidden
  conf: 0.99
  near_lines: 50
  all:
  - id: micro-behaviors/data/encode/hex::hex-encoded-http
  - id: micro-behaviors/data/decode/hex::buffer-from-hex-to-utf8
  - id: micro-behaviors/communications/http/get::axios-get-call
  - id: micro-behaviors/communications/http/get::axios-stream-response-download
  - id: micro-behaviors/fs/write/file/stream::create-write-stream
  - id: micro-behaviors/process/create/shell/bridge::js-exec
  - id: micro-behaviors/process/create/spawn::windowshide-option
  unless:
  - id: metadata/package/testing/
  - id: metadata/path::test-directory-component
- id: npm-lifecycle-hex-stream-exe-dropper
  desc: NPM install lifecycle runs hex-decoded exe dropper
  conf: 0.995
  attack: T1195.002,T1105,T1059.007
  scope: archive
  for:
  - npm
  - javascript
  - typescript
  - package.json
  all:
  - id: micro-behaviors/os/env/package-manager::npm-lifecycle
  - id: hex-decoded-http-stream-exe-dropper
  unless:
  - id: metadata/package/testing/
  - id: well-known/tool/detection/
  - id: metadata/path::test-directory-component
- id: npm-postinstall-hex-stream-exe-dropper
  desc: NPM archive combines postinstall with hex exe dropper
  conf: 0.995
  attack: T1195.002,T1105,T1059.007
  scope: archive
  for:
  - npm
  - package.json
  - javascript
  - typescript
  all:
  - id: metadata/package/scripts/lifecycle::postinstall-hook-declaration
  - id: hex-decoded-http-stream-exe-dropper
  unless:
  - id: metadata/package/testing/
  - id: metadata/path::test-directory-component
- id: axios-stream-write-exec-hidden-dropper
  desc: Axios streams download to disk and execs hidden
  conf: 0.99
  near_lines: 80
  all:
  - id: micro-behaviors/fs/write/file/stream::create-write-stream
  - id: micro-behaviors/process/create/shell/bridge::js-exec
  - id: micro-behaviors/process/create/spawn::windowshide-option
  any:
  - id: micro-behaviors/communications/http/get::axios-stream-response-download
  - id: micro-behaviors/communications/http/get::axios-config-stream-response
- id: axios-stream-appdata-hidden-exe-dropper
  desc: Axios streams exe into APPDATA and runs hidden
  conf: 0.995
  attack: T1105,T1059.007
  all:
  - id: axios-stream-write-exec-hidden-dropper
  - id: micro-behaviors/os/env/user-paths::node-appdata-access
  unless:
  - id: metadata/package/testing/
  - id: metadata/path::test-directory-component
