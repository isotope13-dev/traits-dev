# macOS stagers may select a payload by architecture and place it under an
# Apple-namespaced cache path. The path is masquerading evidence, not ClickFix
# or proof of user interaction.
defaults:
  platforms: [macos]
  for: [shell, javascript, typescript, go, python, macho]
  attack: T1105

traits:
  - id: macos-apple-cache-payload
    desc: Uses an Apple-looking cache payload name
    crit: suspicious
    conf: 0.97
    if:
      type: text
      regex: '(?i)(com\.apple\.(verified|homeenergyd)|/com\.apple\.softwareupdate/SoftwareUpdate)\b'
composite_rules:
  - id: macos-apple-cache-quarantine-stage
    for: [shell]
    desc: Makes an Apple-named cache payload executable after clearing quarantine
    crit: hostile
    conf: 0.99
    attack: T1105,T1222.002,T1553.001
    all:
      - id: micro-behaviors/fs/path/cache::macos-apple-cache-directory
      - id: macos-apple-cache-payload
      - id: micro-behaviors/fs/attributes/xattr::xattr-quarantine-remove
    any:
      - id: micro-behaviors/fs/chmod/executable/mode::chmod-exec-var-target
      - id: micro-behaviors/fs/chmod/executable/mode::chmod-exec-absolute-path
      - id: micro-behaviors/fs/chmod/executable/mode::chmod-exec-literal-target
    near_lines: 8
  - id: macos-arch-cache-stage
    for: [shell]
    desc: Selects and stages an architecture-specific payload in an Apple-named cache
    crit: hostile
    conf: 0.99
    attack: T1082,T1105,T1036.005
    all:
      - id: micro-behaviors/os/sysinfo/platform/arch::arch-aware-curl-download
      - id: micro-behaviors/fs/path/cache::macos-apple-cache-directory
      - id: macos-apple-cache-payload
    near_bytes: 4096
  - id: macos-signed-apple-cache-stage
    for: [shell]
    desc: Ad-hoc signs and launches a payload from an Apple-looking cache path
    crit: hostile
    conf: 0.99
    attack: T1105,T1553.001,T1036.005,T1564.003
    all:
      - id: micro-behaviors/fs/path/cache::macos-apple-cache-directory
      - id: macos-apple-cache-payload
      - id: micro-behaviors/fs/attributes/xattr::xattr-quarantine-remove
      - id: micro-behaviors/crypto/sign::codesign-ad-hoc-signing
      - id: micro-behaviors/process/daemonize/detach::nohup-shell-launch
    near_lines: 12
