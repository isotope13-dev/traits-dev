defaults:
  for: [ruby]
  platforms: [unix]
traits:
  - id: ruby-http-body-executable-file-launch
    desc: HTTP body written executable then launched
    crit: suspicious
    conf: 0.99
    if:
      type: tree-sitter
      query: |
        ((_ (assignment left: (identifier) @response
             right: (call receiver: (scope_resolution) @http method: (identifier) @get))
            (call receiver: (constant) @file method: (identifier) @open
              arguments: (argument_list (string (string_content) @path) (string (string_content) @mode))
              block: (do_block parameters: (block_parameters (identifier) @stream)
                body: (body_statement
                  (call receiver: (identifier) @writer method: (identifier) @write
                    arguments: (argument_list (call receiver: (identifier) @source method: (identifier) @body)))
                  (call receiver: (identifier) @chmod_owner method: (identifier) @chmod
                    arguments: (argument_list (integer) @permissions)))))
            (call method: (identifier) @system arguments: (argument_list (string (string_content) @executed))))
          (#eq? @http "Net::HTTP") (#eq? @get "get_response")
          (#eq? @file "File") (#eq? @open "open") (#match? @mode "^wb[+]?$" )
          (#eq? @stream @writer) (#eq? @write "write") (#eq? @response @source) (#eq? @body "body")
          (#eq? @stream @chmod_owner) (#eq? @chmod "chmod") (#match? @permissions "^0?7(5|7)(5|7)$")
          (#eq? @system "system") (#eq? @path @executed) (#match? @path "^/(var/)?tmp/"))
composite_rules:
  - id: ruby-temporary-executable-http-dropper
    desc: Launches executable HTTP download from temp
    crit: hostile
    conf: 0.99
    all:
      - id: ruby-http-body-executable-file-launch
      - id: micro-behaviors/communications/http/lib/netlib::request-ruby
