# Scriptlet fetch-and-execute droppers: scripts invoking GetObject with a
# remote scriptlet moniker/URL to download and execute remote payloads.
defaults:
  platforms: [windows]
  for: [vbs, javascript, html, text, data]

  attack: T1105,T1059.005,T1059.007
  mbc: B0024

composite_rules:
  - id: script-scriptlet-getobject-dropper
    desc: Script fetches remote scriptlet via GetObject
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/os/com/automation::getobject-concat-url-clue
    any:
      - id: metadata/lang/source/syntax/call/invocation::window-or-unqualified-close-call-text
      - id: objectives/anti-static/obfuscation/string/fragmentation::split-scheme-separator-fragment
