defaults:
  platforms: [unix, windows]
  for: [pkginfo]
  attack: T1195.002

composite_rules:
  - id: empty-wheel-remote-loader-claim
    desc: Empty wheel claims remote loader
    crit: suspicious
    conf: 0.92
    for: [whl, pkginfo]
    scope: archive
    all:
      - id: metadata/package/documentation/claims::pypi-metadata-remote-fetch-run-claim
      - id: metadata/package/files/archive-shape::tiny-wheel-archive-content
