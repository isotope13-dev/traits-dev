# Ruby unverified download-and-execute: an HTTP response body fetched with TLS
# certificate verification disabled is handed to a subprocess for execution.
# Disabling verification removes the only check that the bytes came from the
# expected server; legitimate updaters pin or verify, they do not combine
# VERIFY_NONE with executing the fetched bytes. Keep the URL and transport
# mechanics neutral; this composite supplies the dropper intent.
defaults:
  platforms: [unix, windows]
  for: [ruby]
  attack: T1105
  mbc: B0030
composite_rules:
  - id: ruby-unverified-http-body-subprocess-exec
    desc: Executes TLS-unverified HTTP response body
    crit: hostile
    conf: 0.97
    all:
      - id: micro-behaviors/communications/http/client/response-body::ruby-http-response-body
      - id: micro-behaviors/process/create/subprocess::ruby-open3-capture3
      - id: micro-behaviors/communications/tls/verify/disable::openssl-verify-none
    unless:
      - id: metadata/package/testing/
      - id: "metadata/file/naming::test-directory-component"
