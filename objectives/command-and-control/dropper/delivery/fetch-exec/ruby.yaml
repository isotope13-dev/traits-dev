# The response must reach a temporary-script executor. TLS bypass is an
# additional same-file observation; this does not assert that the caller ran.
defaults:
  platforms: [unix, windows]
  for: [ruby]
composite_rules:
  - id: ruby-unverified-http-body-subprocess-exec
    desc: Downloaded-script runner with TLS bypass
    crit: suspicious
    conf: 0.97
    all:
      - id: micro-behaviors/process/create/subprocess::ruby-http-body-script-subprocess-flow
      - id: micro-behaviors/communications/tls/verify/disable::openssl-verify-none
    unless:
      - id: metadata/package/testing/
      - id: metadata/path::test-directory-component
