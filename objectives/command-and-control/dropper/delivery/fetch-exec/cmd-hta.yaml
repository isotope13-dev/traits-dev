# A split-token downloader and a FOR-variable launch in the same command.
# This describes a staging profile; proximity alone does not prove data flow.
composite_rules:
  - id: obfuscated-curl-hta-for-launch
    desc: Obfuscated curl HTA staging with a FOR-variable launch
    crit: suspicious
    conf: 0.96
    platforms: [windows]
    for: [batch, powershell, javascript, html, vbs]
    attack: T1027,T1059.003,T1105,T1218.005
    near_bytes: 512
    all:
      - id: objectives/anti-static/obfuscation/string/delimiter::cmd-delayed-curl-fragment-pair
      - id: micro-behaviors/fs/path/extension::hta-extension
      - id: micro-behaviors/process/create/shell/command-mode::cmd-start-for-variable
      - id: micro-behaviors/process/argument/option::windows-interpreter-command-syntax
