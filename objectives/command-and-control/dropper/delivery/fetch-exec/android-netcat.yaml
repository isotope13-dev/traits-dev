defaults:
  platforms: [unix, android]
  for: [shell]
composite_rules:
  - id: android-netcat-unverified-apk-deployment
    desc: Network APK deployment disables package verification
    crit: hostile
    conf: 0.98
    attack: T1105,T1553
    all:
      - id: micro-behaviors/communications/socket/receive::shell-netcat-apk-output
      - id: micro-behaviors/os/security/policy::shell-android-disables-package-verifier
      - id: micro-behaviors/os/package-manager/sideload::android-pm-install-auto-grant
      - id: micro-behaviors/communications/ip/literal::external-ipv4-shell-literal
