# Python release-bootstrap objective: a remote archive is unpacked, its native
# payload is made executable, and the payload is launched in one nearby flow.
# This is suspicious supply-chain/download-execute behavior, not proof of C2;
# legitimate CLI wrappers can use the same installation pattern.
# MBC: B0030 (Dropper)
# ATT&CK: T1059.006, T1105
defaults:
  platforms: [linux, macos, windows, unix, android, ios]
  mbc: "B0030"

traits:
  - id: percent-encoded-shell-download-chmod-exec
    desc: Percent-encoded fetch chmod execute chain
    crit: suspicious
    conf: 0.995
    attack: T1059,T1105
    for: [python]
    platforms: [unix]
    if:
      type: literal
      kind: string
      regex: '(?i)%24%28(wget|curl).{1,96}%3bchmod%20(777|%2bx)%20%2ftmp.{1,48}%3b%2ftmp'

composite_rules:
  # Executing a requests response body during module import is not an updater
  # or installer workflow: the remote server supplies Python code that runs as
  # soon as this file is imported. Keep the URL and response mechanics neutral;
  # this composite supplies the dropper intent.
  - id: python-http-response-import-exec
    desc: Python executes fetched HTTP response at import
    crit: hostile
    conf: 0.99
    attack: T1105,T1059.006
    for: [python]
    near_bytes: 192
    all:
      - id: micro-behaviors/communications/http/lib/requests::requests-get
      - id: micro-behaviors/communications/http/client/response-body::requests-response-body-access
      - id: micro-behaviors/process/interpreter/python::exec-text-attribute
      - id: micro-behaviors/process/interpreter/python::module-scope-exec-builtin
    unless:
      - id: metadata/package/testing/

  # Hidden /tmp placement, a world-writable executable mode, response-body use,
  # and immediate shell launch distinguish this from a normal Python binary
  # installer. The rule intentionally does not key on a filename, host, or
  # payload extension.
  - id: python-hidden-temp-world-writable-payload
    desc: Python launches hidden temporary payload after HTTP fetch
    crit: hostile
    conf: 0.99
    attack: T1105,T1222.002,T1059.006,T1564.001
    for: [python]
    platforms: [unix]
    near_bytes: 320
    all:
      - id: micro-behaviors/communications/http/client/response-body::requests-response-body-access
      - id: micro-behaviors/fs/path/temp::hidden-tmp-state-file
      - id: micro-behaviors/fs/chmod/modify::chmod-call-with-octal-777
      - id: micro-behaviors/process/create/system::python-os-system
    unless:
      - id: metadata/package/testing/

  - id: http-encoded-shell-download-chmod-exec
    desc: HTTP sends encoded fetch-chmod-execute chain
    crit: hostile
    conf: 0.995
    attack: T1059,T1105
    for: [python]
    platforms: [unix]
    all:
      - id: percent-encoded-shell-download-chmod-exec
    any:
      - id: micro-behaviors/communications/http/request/client::http-client
      - id: micro-behaviors/communications/http/get::http-get
    near_bytes: 1024

  - id: shell-download-python-exec-delete
    desc: Shell downloads, runs, and removes Python script
    crit: suspicious
    conf: 0.96
    attack: "T1059.006,T1105,T1070.004"
    for: [shell]
    near_bytes: 192
    all:
      - id: micro-behaviors/communications/http/download/shell::shell-curl-wget-url-fetch
      - id: micro-behaviors/process/interpreter/python::python-local-script
      - id: micro-behaviors/fs/file/delete::delete-rm-hardcoded
    unless:
      - id: metadata/package/testing/
      - id: micro-behaviors/os/service/legitimate::installer-script
      - id: micro-behaviors/os/service/legitimate::verified-github-release-installer
  - id: unverified-python-release-bootstrap
    desc: Python downloads and launches an unverified release archive
    crit: suspicious
    conf: 0.92
    attack: "T1059.006,T1105,T1222.002"
    for: [python]
    near_lines: 48
    all:
      - id: micro-behaviors/communications/url/external/github::github-release-download
      - id: micro-behaviors/data/archive/open/tar::python-tarfile-open
      - id: micro-behaviors/fs/chmod/executable/mode::python-executable
      - id: micro-behaviors/process/create/subprocess::run-ast
    unless:
      - id: well-known/tool/development/rumdl::cold-start-benchmark-context
