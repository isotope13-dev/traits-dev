# Python fetch-execute-cleanup objective: downloaded code is made executable,
# launched, and removed in a nearby operation.
# MBC: B0030 (Dropper)
# ATT&CK: T1059.006, T1105
defaults:
  platforms: [linux, macos, windows, unix, android, ios]
  mbc: "B0030"
composite_rules:
  - id: shell-download-python-exec-delete
    desc: Shell downloads, runs, and removes Python script
    crit: suspicious
    conf: 0.96
    attack: "T1059.006,T1105,T1070.004"
    for: [shell]
    near_bytes: 192
    all:
      - id: micro-behaviors/communications/http/download/shell::shell-curl-wget-url-fetch
      - id: micro-behaviors/process/interpreter/python::python-local-script
      - id: micro-behaviors/fs/file/delete::delete-rm-hardcoded
    unless:
      - id: metadata/package/testing/
      - id: micro-behaviors/os/service/legitimate::installer-script
      - id: micro-behaviors/os/service/legitimate::verified-github-release-installer
  - id: stealth-dropper
    desc: Nearby Python download, executable chmod, subprocess launch, and cleanup
    crit: suspicious
    conf: 0.95
    attack: "T1059.006"
    for: [python]
    near_lines: 40
    all:
      - id: micro-behaviors/fs/chmod/executable/mode::python-executable
      - id: micro-behaviors/fs/file/delete::py-remove
      - id: micro-behaviors/process/create/subprocess/
    any:
      - id: micro-behaviors/communications/http/download/
      - id: objectives/command-and-control/dropper/download/
