defaults:
  platforms:
    - windows
  for:
    - pe
    - dll
  attack: T1027.003
traits:
  - id: acquire-image-bytes
    desc: AcquireImageBytes method (stego extraction)
    crit: suspicious
    conf: 0.95
    if:
      type: text
      substr: AcquireImageBytes
  - id: harvest-image-data-method
    desc: HarvestImageData stego extraction method
    crit: suspicious
    conf: 0.96
    if:
      type: text
      substr: HarvestImageData
  - id: sbytetypein-resource-accessor
    desc: SByteTypeIn resource accessor
    crit: suspicious
    conf: 0.98
    if:
      type: text
      exact: get_SByteTypeIn
  - id: sbytetypein-resource-key-hex
    desc: Hex-encoded SByteTypeIn key
    crit: notable
    conf: 0.99
    if:
      type: text
      exact: "534279746554797065496E"
  - id: stego-secondary-key-hex
    desc: Hex-encoded stego key
    crit: notable
    conf: 0.98
    if:
      type: text
      exact: "3556777067494B55"
composite_rules:
  - id: dotnet-stego-loader
    desc: .NET bitmap/resource steganography indicators
    crit: suspicious
    conf: 0.82
    mbc: E1027.m02
    all:
      - id: micro-behaviors/ui/graphics/image::pixel-operation-or-layout-references
    any:
      - id: micro-behaviors/metaprogramming/reflection/resolve::dotnet-load-invoke-api-references
      - id: objectives/anti-static/obfuscation/reflection/class::dotnet-reflection
      - id: sbytetypein-resource-accessor
      - id: sbytetypein-resource-key-hex
    unless:
      - id: metadata/binary/layout/size::large-file-1mb
      - id: metadata/signed/platform/
  - id: dotnet-stego-acquire
    desc: .NET steganography byte extraction
    crit: suspicious
    conf: 0.92
    all:
      - id: acquire-image-bytes
    any:
      - id: micro-behaviors/ui/graphics/image::getpixel-api-name
      - id: micro-behaviors/ui/graphics/image::dotnet-bitmap-type-token
  - id: dotnet-harvestimage-pixel-extract
    desc: .NET pixel harvest byte extraction
    crit: suspicious
    conf: 0.94
    all:
      - id: harvest-image-data-method
      - id: micro-behaviors/ui/graphics/image::getpixel-api-name
      - id: micro-behaviors/ui/graphics/image::dotnet-bitmap-type-token
  - id: dotnet-stego-resource-reflection-loader
    desc: .NET bitmap stego reflection loader
    crit: hostile
    conf: 0.98
    mbc: E1027.m02
    all:
      - id: metadata/binary/framework::dotnet-assembly
      - id: micro-behaviors/ui/graphics/image::dotnet-bitmap-resource-pixel-api-references
      - id: harvest-image-data-method
    any:
      - id: micro-behaviors/metaprogramming/reflection/inspect/class::load-member-token
      - id: micro-behaviors/metaprogramming/reflection/inspect/class::get-exported-types-token
      - id: micro-behaviors/metaprogramming/reflection/inspect/class::getdomain-member-token
    needs: 3
  - id: dotnet-stego-keyed-resource-loader
    desc: .NET keyed stego resource loader
    crit: hostile
    conf: 0.99
    mbc: E1027.m02
    all:
      - id: metadata/binary/framework::dotnet-assembly
      - id: micro-behaviors/ui/graphics/image::getpixel-api-name
      - id: sbytetypein-resource-accessor
    any:
      - id: sbytetypein-resource-key-hex
      - id: stego-secondary-key-hex
      - id: micro-behaviors/process/create/hidden::dotnet-hidden-process-launch-setup
      - id: micro-behaviors/process/create/spawn::dotnet-redirected-stdio
      - id: micro-behaviors/ui/window/hook::windows-hook-lifecycle
      - id: micro-behaviors/hardware/display/screen::gdi-bitmap-transfer-primitives
    needs: 2
    unless:
      - id: metadata/binary/layout/size::large-file-1mb
  - id: dotnet-stego-surveillance-loader
    desc: .NET stego loader with surveillance APIs
    crit: hostile
    conf: 0.98
    mbc: E1027.m02
    all:
      - id: metadata/binary/framework::dotnet-assembly
      - id: micro-behaviors/ui/graphics/image::getpixel-api-name
      - id: sbytetypein-resource-accessor
    any:
      - id: micro-behaviors/ui/window/hook::windows-hook-lifecycle
      - id: micro-behaviors/hardware/display/screen::gdi-bitmap-transfer-primitives
      - id: micro-behaviors/process/create/spawn::dotnet-redirected-stdio
    needs: 2
    unless:
      - id: metadata/binary/layout/size::large-file-1mb
