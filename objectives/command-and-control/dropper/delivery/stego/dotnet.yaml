defaults:
  platforms: [unix, windows, macos]
composite_rules:
  - id: dotnet-bitmap-aes-dropper
    desc: .NET dropper hides an AES payload in bitmap pixels
    crit: hostile
    conf: 0.9
    mbc: "B0027"
    attack: "T1027.003"
    all:
      - id: micro-behaviors/data/encode/image/pixel::pixel-access
      - id: micro-behaviors/crypto/symmetric/aes/library::dotnet-rijndael
      - id: micro-behaviors/data/decode/base64::dotnet-frombase64string-text
    any:
      - id: micro-behaviors/communications/http/client/
    unless:
      - id: objectives/anti-static/obfuscation/obfuscator/managed/
      # GDI pixel access + AES + base64 + HTTP is ScreenConnect's screen
      # transport, not stego payload delivery, when the product identity is
      # otherwise established.
      - id: well-known/dual-use/remote-admin/screenconnect::screenconnect-family
      # Watt Toolkit's accelerator bundles the WinForms/GDI surface alongside
      # its own AES and base64 helpers; pixel access here is UI, not stego.
      - id: well-known/game/steamtools/
