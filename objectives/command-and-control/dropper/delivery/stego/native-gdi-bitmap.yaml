# Native PE loaders that stage payload bytes through GDI bitmap APIs and
# WinMM waveOut — a steganography channel unrelated to legitimate signed demos.
defaults:
  platforms: [windows]
  for: [pe]
  attack: T1027.003

composite_rules:
  - id: gdi-bitmap-waveout-stego-channel
    desc: GDI bitmap readback paired with WinMM waveOut playback
    crit: suspicious
    conf: 0.93
    all:
      - id: micro-behaviors/hardware/display/screen::gdi-getdibits
      - id: micro-behaviors/hardware/input/audio::wave-out-open
    unless:
      - id: metadata/signed/platform/
      # SDL's native multimedia runtime legitimately combines GDI bitmap
      # handling with waveOut audio support.
      - id: well-known/lib/media/sdl::sdl-runtime-component
      # Electron's Chromium runtime independently contains GDI display and
      # waveOut audio backends; their coexistence is not a stego channel.
      - id: well-known/lib/runtime/electron::electron-app-runtime

  - id: unsigned-gdi-bitmap-waveout-stager
    desc: Unsigned native PE staging via GDI bitmap and WinMM wave channel
    crit: hostile
    conf: 0.95
    attack: T1027.003,T1620
    size_max: 262144
    all:
      - id: gdi-bitmap-waveout-stego-channel
      - id: metadata/binary/layout::pe-no-signature-record
      - id: micro-behaviors/process/debug/detect::is-debugger-present-import
      - id: micro-behaviors/mem/protect/modify::virtual-protect
      - id: micro-behaviors/os/module/load::get-proc-address-import
    unless:
      - id: metadata/signed/platform/
