# Small unsigned native PE loaders that stage payload bytes through GDI bitmap
# readback and WinMM waveOut buffers instead of a file or a socket.
#
# GetDIBits plus waveOutOpen on their own describe an ordinary multimedia
# program — screen capture with audio playback is what conferencing clients,
# recorders, media players and game runtimes do — so the pair is not scored by
# itself. The staging inference comes from the surrounding shape: a tiny
# unsigned image that also resolves its own imports, flips page protections
# and watches for a debugger.
defaults:
  platforms: [windows]
  for: [pe]
  attack: T1027.003

composite_rules:
  - id: unsigned-gdi-bitmap-waveout-stager
    desc: Unsigned PE with GDI bitmap, audio, and memory-protection APIs
    crit: suspicious
    conf: 0.95
    attack: T1027.003,T1620
    size_max: 262144
    all:
      - id: metadata/file/profile/graphics/reference::gdi-getdibits
      - id: micro-behaviors/hardware/input/audio::wave-out-open
      - id: metadata/signed/trust-level::unsigned-missing-signature-record
      - id: micro-behaviors/process/debug/detect::is-debugger-present-import
      - id: metadata/file/profile/memory-protection-api::virtual-protect
      - id: micro-behaviors/dylib/lookup::get-proc-address-import
