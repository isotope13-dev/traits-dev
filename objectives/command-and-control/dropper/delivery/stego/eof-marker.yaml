defaults:
  platforms: [unix, windows]
  for: [media, scripts]
  attack: T1027.003
  mbc: E1027.m02
traits:
- id: image-tail-payload-marker
  # Carrier families can vary the closing delimiter while retaining the
  # distinctive start marker and opaque body; the carrier composites pair it
  # with a large post-EOI region rather than treating ordinary image text as
  # a carrier finding.
  desc: Image payload carrier framing marker
  crit: notable
  conf: 0.92
  if:
    type: text
    regex: '(IN-[#A-Za-z0-9/]{20,}|INICIO)'
# `QqVT` is not a campaign marker — it is `TVqQ` (base64 of `MZ\x90`) read
# backwards, so it is the structural signature of a *reversed* base64 PE and
# survives any renaming of the carrier's framing delimiters. Requiring a
# non-base64 byte (or EOF) right after it asserts the reversed stream ends
# there, which is where a reversed PE's DOS header lands; that anchor keeps
# the four characters from matching by chance inside a long base64 blob.
- id: reversed-base64-pe-header
  desc: Reversed base64 PE header signature
  crit: suspicious
  conf: 0.9
  if:
    type: text
    regex: 'QqVT([^A-Za-z0-9+/=]|$)'
# Forward-direction twin of reversed-base64-pe-header, matched over raw bytes.
# The string extractor recovers nothing from a JPEG whose appended blob is
# plain base64 (no decoded layer is built), so a `type: text` spelling — and
# micro-behaviors/data/encoded::raw-base64-pe-header, which is scoped
# `for: [text, scripts]` — never sees an image carrier at all.
- id: image-raw-base64-pe-header
  desc: Base64 PE header in image file bytes
  crit: suspicious
  conf: 0.92
  # Named explicitly rather than via `media`, which now spans audio, video and
  # fonts too: a `raw` matcher is capped at three file types, and this one was
  # written for raster carriers. Widening it to every container is a separate
  # question about raw-scan cost, not a rename.
  for: [jpeg, png]
  if:
    type: raw
    regex: 'TVqQAA[A-Za-z0-9+/]{30,}'
- id: textual-stego-tail-marker
  desc: Stego tail marker string
  crit: notable
  conf: 0.88
  if:
    type: text
    regex: '\b(IN-/-in1|INICIO)\b'
- id: reversed-pe-base64-marker
  desc: Reversed PE base64 marker
  crit: component
  conf: 0.86
  if:
    type: text
    substr: VFZA
- id: bmp-wsh-fso-object
  desc: BMP has a script FSO constructor
  crit: notable
  conf: 0.98
  for: [bmp]
  if:
    type: text
    regex: "(?i)ActiveXObject\\(['\"]Scripting\\.FileSystemObject['\"]\\)"
- id: bmp-charcode-pe-array
  desc: BMP builds a PE from numeric characters
  crit: suspicious
  conf: 0.97
  for: [bmp]
  if:
    type: text
    regex: '(?is)var\s+data\s*=\s*\[.{0,80}65535'
- id: bmp-fromcharcode-conversion
  desc: BMP uses fromCharCode conversion
  crit: notable
  conf: 0.94
  for: [bmp]
  if:
    type: text
    substr: fromCharCode
- id: bmp-hidden-com-run
  desc: BMP script launches a target hidden
  crit: suspicious
  conf: 0.98
  for: [bmp]
  if:
    type: text
    regex: "(?is)\\[['\"]Run['\"]\\]\\s*\\(\\s*[A-Za-z_$][\\w$]*\\s*,\\s*0x0\\s*\\)"
- id: bmp-public-download-exe-path
  desc: BMP targets a Public Downloads executable
  crit: notable
  conf: 0.98
  for: [bmp]
  if:
    type: text
    substr: "C:/U'+'sers/Publi'+'c/Download'+'s/Win'+'voke.e'+'xe"
- id: bmp-interleaved-pe-pixel-channel
  desc: PE header interleaved in BMP pixel channel
  crit: suspicious
  conf: 0.99
  for: [bmp]
  # In a 32-bit BMP, a byte stream stored in one color channel is interleaved
  # with three bytes per pixel. Match the common 54-byte bitmap header, MZ in
  # that channel, then PE at the DOS header's conventional e_lfanew (0x80).
  if:
    type: raw
    offset_range: [0, 590]
    regex: '(?s)^BM[\s\S]{52}M[\s\S]{3}Z[\s\S]{507}P[\s\S]{3}E[\s\S]{3}\x00[\s\S]{3}\x00'
composite_rules:
- id: bmp-wsh-hidden-executable-dropper
  desc: BMP script drops and hides executable
  crit: hostile
  conf: 0.99
  attack: T1027.003,T1059.007,T1105
  for: [bmp]
  all:
  - id: micro-behaviors/os/com/automation::wscript-shell-activex-constructor
  - id: bmp-wsh-fso-object
  - id: bmp-charcode-pe-array
  - id: bmp-fromcharcode-conversion
  - id: bmp-hidden-com-run
  - id: bmp-public-download-exe-path
  - id: metadata/file/format/media::media-container-recognized
- id: marker-after-image-eof
  for: [jpeg]
  desc: Payload marker after image EOF
  crit: suspicious
  conf: 0.92
  all:
  - id: metadata/image/trailing::jpeg-large-appended-data
  - id: image-tail-payload-marker
- id: appended-image-payload-marker
  for: [jpeg]
  desc: Image with appended payload markers
  crit: hostile
  conf: 0.96
  all:
  - id: marker-after-image-eof
  any:
  - id: reversed-pe-base64-marker
  - id: reversed-base64-pe-header
  - id: micro-behaviors/data/decode/base64::dotnet-frombase64string-text
  - id: objectives/command-and-control/dropper/delivery/http::cloud-image-stager
# Marker-independent carrier detection: an image with a blob appended past
# EOI whose content is the base64 of a PE, in either direction. The framing
# delimiters these families use (`IN-`/`-in1`, `INICIO`, `<<START>>`, …) get
# renamed per campaign; the encoded DOS header does not. jpeg-large-appended-data
# already excludes the benign appended-data classes (Google MotionPhoto,
# HDR gain maps), so the pairing carries no legitimate case.
- id: jpeg-appended-base64-pe-carrier
  for: [jpeg]
  desc: JPEG carrier with appended base64 PE
  crit: hostile
  conf: 0.96
  all:
  - id: metadata/image/trailing::jpeg-large-appended-data
  any:
  - id: reversed-base64-pe-header
  - id: image-raw-base64-pe-header
  - id: micro-behaviors/data/encoded::raw-base64-pe-header
  needs: 1
- id: text-described-stego-payload
  desc: Scripted image stego payload extraction
  crit: hostile
  conf: 0.9
  all:
  - id: textual-stego-tail-marker
  - id: reversed-pe-base64-marker
  any:
  - id: micro-behaviors/data/decode/base64/
  - id: objectives/anti-static/obfuscation/encoding/
- id: cloud-image-pe-lolbin-stager
  for: [scripts, '!applescript', '!jcl', '!shell']
  desc: Cloud image PE LOLBin stager
  crit: hostile
  conf: 0.96
  all:
  - id: objectives/command-and-control/dropper/delivery/http::cloud-image-stager
  - id: objectives/anti-static/obfuscation/payload/encoded/carrier::base64-pe-header
  any:
  - id: micro-behaviors/process/create/launch::mshta-execution
  - id: micro-behaviors/process/interpreter/eval/direct::powershell-iex-call
