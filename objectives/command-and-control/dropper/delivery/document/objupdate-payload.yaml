defaults:
  attack: T1203
  platforms: [linux, macos, windows, unix, android, ios]
  for: [rtf]
composite_rules:
- id: rtf-objupdate-embedded-payload
  desc: RTF document with objupdate trigger and embedded payload
  crit: hostile
  conf: 0.95
  mbc: "B0009.029"
  all:
  - id: objectives/execution/trigger/rtf::objupdate
  any:
  - id: objectives/anti-static/obfuscation/payload/encoded::large-hex-string-dup
  - id: objectives/anti-static/obfuscation/document/rtf::suspicious-hex-escape
  - id: objectives/anti-static/obfuscation/document/rtf::nested-objdata-in-data
- id: rtf-objupdate-ole-exploit
  desc: RTF document with objupdate trigger and OLE object embedding
  crit: hostile
  conf: 0.95
  mbc: "B0009.029"
  all:
  - id: objectives/execution/trigger/rtf::objupdate
  - id: metadata/document/rtf/ole::embedded-object-feature
  any:
  - id: objectives/anti-static/obfuscation/document/rtf::suspicious-hex-escape
  - id: objectives/anti-static/obfuscation/payload/encoded::large-hex-string-dup
  - id: micro-behaviors/data/encode/hex::hex-encoded-http
- id: rtf-exploit-mathtype-objclass
  desc: RTF with MathType objclass and exploit indicators
  crit: hostile
  conf: 0.98
  all:
  - id: metadata/document/rtf/ole::mathtype-object
  any:
  - id: objectives/execution/trigger/rtf::objupdate
  - id: objectives/anti-static/obfuscation/payload/encoded::large-hex-string-dup
  - id: micro-behaviors/data/encode/hex::hex-encoded-http
- id: rtf-exploit-mathtype-section
  desc: RTF with MathType OLE section and exploit indicators
  crit: hostile
  conf: 0.98
  all:
  - id: metadata/document/rtf/ole::mathtype-section
  any:
  - id: objectives/execution/trigger/rtf::objupdate
  - id: objectives/anti-static/obfuscation/payload/encoded::large-hex-string-dup
  - id: micro-behaviors/data/encode/hex::hex-encoded-http
# A control word Word cannot mean what it says -- an object number two
# hundred digits long, or the update directive tucked into hidden text --
# next to the directive that makes Word refresh the embedded object as soon
# as the file opens. The malformation is what carries the document past a
# reader; the trigger is what makes opening it enough.
- id: rtf-parser-confusion-object-trigger
  desc: RTF hides auto-update in malformed object controls
  crit: hostile
  conf: 0.96
  platforms: [windows]
  mbc: "B0009.029"
  all:
  - id: objectives/execution/trigger/rtf::objupdate
  - id: objectives/anti-static/obfuscation/document/rtf::rtf-object-parameter-overflow
  - id: objectives/anti-static/obfuscation/document/rtf::rtf-hidden-text-object-trigger
