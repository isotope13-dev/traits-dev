defaults:
  platforms: [windows]
  for: [pe]
  attack: T1204.002

composite_rules:
  - id: business-document-lure-basename
    desc: Business-document lure executable basename
    crit: component
    conf: 0.9
    any:
      - id: objectives/evasion/masquerade/file/lure::business-document-exe-name
      - id: objectives/evasion/masquerade/file/lure::spare-part-exe-name
      - id: objectives/evasion/masquerade/file/lure::quotation-exe-name
  - id: business-document-packed-dotnet-loader
    desc: Business document lure with a .NET payload decoding or loading chain
    crit: hostile
    conf: 0.97
    all:
      - id: business-document-lure-basename
      - id: metadata/binary/framework::dotnet-assembly
    any:
      - id: objectives/command-and-control/dropper/staging/memory::dotnet-template-resource-section-loader
      - id: objectives/command-and-control/dropper/staging/memory::stego-bitmap-minimal-import-packed-stub
      - id: objectives/command-and-control/dropper/staging/memory::dotnet-packed-vb-resource-loader
      - id: objectives/anti-static/pack/runtime::dotnet-packed-loader
      - id: objectives/anti-static/obfuscation/reflection/invoke::dotnet-assembly-load-invoke
      - id: objectives/anti-static/obfuscation/reflection/invoke::dotnet-reversed-resource-assembly-loader
      - id: micro-behaviors/data/decode/base64::dotnet-frombase64string-text
      - id: micro-behaviors/crypto/symmetric/decrypt::dotnet-create-decryptor
      - id: micro-behaviors/process/create/launch::create-process-api-name
      - id: micro-behaviors/communications/http/client/managed::downloadstring
    needs: 1
    unless:
      - id: metadata/signed/platform/
      - id: well-known/app/system/black-lightning::black-lightning-identity-context

  # Invoice/quote-named .NET droppers that fetch a string payload and write it
  # under the user temp directory (Phonzy-style WebClient + WriteAllText).
  - id: business-document-webclient-temp-writer
    desc: Business-document .NET lure downloads a string and writes temp files
    crit: hostile
    conf: 0.98
    attack: T1204.002,T1105,T1059
    all:
      - id: business-document-lure-basename
      - id: metadata/binary/framework::dotnet-assembly
      - id: micro-behaviors/communications/http/client/managed::downloadstring
      - id: micro-behaviors/fs/write/file/direct::dotnet-writealltext-token
    any:
      - id: micro-behaviors/fs/temp/directory::get-temp-path-dup
      - id: micro-behaviors/communications/http/client/managed::webclient
    unless:
      - id: metadata/signed/platform/
