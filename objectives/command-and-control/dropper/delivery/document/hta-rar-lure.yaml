# Tiny RAR carriers that ship a customs-document .hta (EUR1 / HS naming).
# Member analysis is skipped when the HTA pad classifies as unknown; these
# archive-scope hex traits still catch the delivery shape from member names.
defaults:
  platforms: [windows]
  for: [rar]
  attack: T1204.002,T1027.002

composite_rules:
  - id: rar-customs-hta-document-lure
    desc: RAR ships customs-document HTA lure
    crit: hostile
    conf: 0.98
    all:
      - id: metadata/file/magic/identity::rar-v5
      - id: micro-behaviors/data/archive/rar::hta-member-extension
    any:
      - id: micro-behaviors/data/archive/rar::customs-eur1-hta-member
      - id: micro-behaviors/data/archive/rar::customs-hs-hta-member
