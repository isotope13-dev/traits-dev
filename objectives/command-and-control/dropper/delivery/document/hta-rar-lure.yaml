# Tiny RAR carriers that ship a customs-document .hta (EUR1 / HS naming).
# Member analysis is skipped when the HTA pad classifies as unknown; these
# archive-scope hex traits still catch the delivery shape from member names.
defaults:
  platforms: [windows]
  for: [rar]
  attack: T1204.002,T1027.002

composite_rules:
  # CVE-2025-8088: WinRAR follows `..\` inside an NTFS alternate-data-stream
  # member name, so the archive writes wherever the stream name points instead
  # of into the extraction directory. The sibling rule in
  # objectives/persistence/login/startup/shortcut/ convicts the Startup-folder
  # destination; this one convicts the delivery itself, so the far commoner
  # variants that traverse into %TEMP%, %PROGRAMDATA% or a share -- where no
  # auto-run path appears anywhere in the archive -- are still caught.
  #
  # An ADS member name is already rare, and one that starts with parent
  # traversal is the exploit primitive rather than anything an archiver emits;
  # requiring the smuggled stream to also carry a script-host extension is what
  # separates exploitation from a merely malformed archive.
  - id: rar-ads-traversal-script-delivery
    desc: RAR ADS traversal smuggles a script payload
    crit: hostile
    conf: 0.97
    attack: T1204.002,T1564.004
    all:
      - id: metadata/file/magic/identity::rar-v5
      - id: micro-behaviors/data/archive/rar::ads-parent-traversal
    any:
      - id: micro-behaviors/data/archive/rar::hta-member-extension
      - id: micro-behaviors/data/archive/rar::wsh-script-member-extension
      - id: micro-behaviors/data/archive/rar::shell-script-member-extension

  - id: rar-customs-hta-document-lure
    desc: RAR ships customs-document HTA lure
    crit: hostile
    conf: 0.98
    all:
      - id: metadata/file/magic/identity::rar-v5
      - id: micro-behaviors/data/archive/rar::hta-member-extension
    any:
      - id: micro-behaviors/data/archive/rar::customs-eur1-hta-member
      - id: micro-behaviors/data/archive/rar::customs-hs-hta-member

  - id: rar-shipping-awb-html-lure
    desc: RAR ships shipping-AWB HTML lure
    crit: hostile
    conf: 0.97
    all:
      - id: metadata/file/magic/identity::rar-v5
      - id: micro-behaviors/data/archive/rar::html-member-extension
      - id: micro-behaviors/data/archive/rar::shipping-awb-html-member
