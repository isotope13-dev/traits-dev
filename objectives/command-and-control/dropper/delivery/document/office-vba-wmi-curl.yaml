# Word/Office VBA that uses WMI Win32_Process.Create to spawn a hidden
# cmd/curl chain that downloads a remote script and runs it from %TEMP%.
defaults:
  platforms: [windows]
  for: [documents, vbs, ooxml, oledoc]
  attack: T1204.002,T1047,T1105,T1059.003
  mbc: C0002,E1043

traits:
  - id: curl-temp-output-and-execute
    desc: curl saves TEMP file then executes it
    crit: notable
    conf: 0.97
    if:
      type: text
      regex: 'curl(\.exe)?.{0,160}-o\s+%TEMP%\\.{0,80}&&\s*%TEMP%'
  - id: vba-wmi-proc-create-invocation
    desc: VBA WMI process object Create call
    crit: notable
    conf: 0.95
    if:
      type: text
      substr: proc.Create

composite_rules:
  - id: office-vba-wmi-curl-download-execute
    desc: Office macro WMI curl download-and-run
    crit: hostile
    conf: 0.99
    scope: outer
    all:
      - id: micro-behaviors/process/create/macro/office::document-open-handler
      - id: micro-behaviors/os/wmi/query::wmi-moniker-string
      - id: curl-temp-output-and-execute
      - id: micro-behaviors/communications/http/curl::curl-command-remote-url
      - id: micro-behaviors/os/wmi/query::win32-process-class-fragment
      - id: vba-wmi-proc-create-invocation
  - id: office-vba-wmi-curl-stager-chain
    desc: Document-open WMI remote curl staging chain
    crit: hostile
    conf: 0.98
    scope: outer
    all:
      - id: micro-behaviors/process/create/macro/office::document-open-handler
      - id: micro-behaviors/os/wmi/query::wmi-moniker-string
      - id: micro-behaviors/communications/http/download/curl::script-shell-curl-file-download
      - id: vba-wmi-proc-create-invocation
