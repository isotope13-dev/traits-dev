defaults:
  platforms: [windows]
  for: [oledoc, ooxml]
  attack: "T1105,T1059.005"
  mbc: B0032

composite_rules:
  # This is the delivery interpretation of the same narrow chain: a macro
  # starts on document open, opens a remote macro-enabled Office document, and
  # wires a CommandBar action to that document's macro before executing it.
  - id: office-vba-remote-macro-dispatch-dropper
    desc: Office VBA delivers and dispatches a remote macro document
    crit: hostile
    conf: 0.99
    all:
      - id: micro-behaviors/process/create/macro/office::raw-auto-open-entrypoint
      - id: micro-behaviors/communications/http/client/vba::vba-remote-office-macro-url
      - id: micro-behaviors/ui/window/manage/activation::vba-commandbar-reference
      - id: micro-behaviors/ui/window/manage/activation::vba-commandbar-controls
      - id: micro-behaviors/ui/window/manage/activation::vba-commandbar-onaction
      - id: micro-behaviors/ui/window/manage/activation::vba-office-macro-action-target
      - id: micro-behaviors/ui/window/manage/activation::vba-commandbar-execute
