defaults:
  for:
  - vbs
  platforms:
  - windows
  crit: suspicious
  conf: 0.92
traits:
- id: mz-header-string
  desc: MZ PE header string in VB-family script
  conf: 0.95
  if:
    type: string_literal
    exact: 4D5A
composite_rules:
# The ".exe path" leg is a neutral path reference
# (micro-behaviors/fs/path/extension::windows-exe-path-reference) and the write
# leg is a generic file copy/save. Pooled across a whole file they co-occur in
# any large Windows admin script: Microsoft's OffScrub10.vbs was reported as a
# PE dropper purely because it names %windir%\notepad.exe on line 155, copies
# an .msi on line 547 and mentions cscript.exe on line 4573. `near_lines`
# restores the claim the description makes — the executable path, the write and
# the script-host launch have to be part of one drop-and-run block.
- id: vba-drop-and-execute-pe
  desc: VB-family script drops and executes PE file
  crit: hostile
  conf: 0.98
  all:
  - id: micro-behaviors/fs/path/extension::windows-exe-path-reference
  - id: micro-behaviors/process/create/shell/script-host::wscript-host-exec
  any:
  - id: micro-behaviors/fs/write/stream::adodb-save-to-file
  - id: micro-behaviors/fs/write/stream::adodb-save-to-file-unicode
  - id: micro-behaviors/fs/file/copy::fso-copyfile-text
  - id: micro-behaviors/fs/write/vba::vba-open-for-output
  near_lines: 40
  unless:
- id: obfuscated-vbs-drop-and-hidden-run-pe
  desc: Obfuscated VBScript drops PE and runs it hidden
  crit: hostile
  conf: 0.97
  all:
  - id: vba-drop-and-execute-pe
  - id: micro-behaviors/process/create/shell/wsh::hidden-window-run
  any:
  - id: micro-behaviors/process/create/shell/wsh::wscript-shell-process-run
  - id: objectives/anti-static/obfuscation/string/anomaly::script-host-line-bloat
- id: vba-hardcoded-pe-payload
  desc: VB-family script with hardcoded PE payload data
  crit: hostile
  conf: 0.97
  all:
  - id: mz-header-string
  - id: micro-behaviors/data/encode/char-code::array-payload-reconstruction
