defaults:
  platforms: [windows]
  for: [oledoc, ooxml]
  attack: T1105

composite_rules:
  - id: auto-open-vba-stream-dropper
    desc: Auto-open VBA stream file dropper
    crit: hostile
    conf: 0.99
    attack: T1059.005
    all:
      - id: micro-behaviors/process/create/macro/office::raw-auto-open-entrypoint
      - id: micro-behaviors/fs/write/file/stream::vba-adodb-stream-file-write
      - id: micro-behaviors/process/create/shell/lang::vba-windows-shell-run
  - id: concealed-ooxml-vba-container
    desc: Concealed OOXML VBA container
    crit: suspicious
    conf: 0.98
    attack: T1027
    all:
      - id: objectives/anti-static/obfuscation/document/macro::ooxml-vba-sparse-content-concealment
      - id: metadata/document/office/markup::ooxml-embedded-native-executable
      - id: metadata/document/office/macro::office-vba-project-value
  - id: ooxml-vba-veryhidden-compressed-stage
    desc: Macro workbook stages compressed data in a hidden worksheet
    crit: hostile
    conf: 0.98
    attack: "T1027,T1059.005,T1204.002"
    all:
      - id: objectives/anti-static/obfuscation/document/macro::ooxml-vba-veryhidden-worksheet
      - id: metadata/document/office/markup::excel-sharedstrings-part
      - id: metadata/document/office/markup::ooxml-embedded-native-executable
      - id: metadata/document/office/markup::ooxml-eightfold-compression-expansion
  - id: word-vba-activex-native-payload
    desc: Word VBA document carries a native ActiveX payload
    crit: hostile
    conf: 0.98
    attack: T1059.005
    all:
      - id: metadata/document/office/macro::word-vba-project-value
      - id: metadata/document/office/macro::word-activex-binary-control
      - id: metadata/document/office/markup::ooxml-embedded-native-executable
      - id: metadata/document/office/macro::word-vba-multiple-executable-members
  - id: vba-binary-startup-payload-dropper
    desc: VBA reconstructs an executable into the Startup folder
    crit: hostile
    conf: 0.99
    attack: T1547.001
    all:
      - id: metadata/document/office/macro::word-vba-project-value
      - id: micro-behaviors/process/create/macro/office::auto-close-trigger
      - id: micro-behaviors/fs/write/file/stream::vba-binary-file-write
      - id: micro-behaviors/fs/path/location::path-suspicious-startup
      - id: micro-behaviors/data/encode/char-code::vba-byte-array-allocation
      - id: micro-behaviors/data/encode/char-code::vba-delimited-byte-payload
  - id: fragmented-office-vba-wscript-url-dropper
    desc: Fragmented VBA WScript URL dropper
    crit: hostile
    conf: 0.99
    attack: T1105,T1059.005,T1204.002
    for: [oledoc]
    all:
      - id: micro-behaviors/process/create/macro/compressed-vba::fragmented-vba-auto-open-entrypoint
      - id: micro-behaviors/process/create/macro/compressed-vba::fragmented-vba-urlmon-download-api
      - id: micro-behaviors/process/create/macro/compressed-vba::fragmented-vba-wscript-shell-object
