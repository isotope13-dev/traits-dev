# Sibling .xlsm delivery via a VBS Excel.Application launcher. Complements
# dropper/execution/script::vbs-excel-xlsm-workbook-launcher with the
# document-delivery objective (MalwareBazaar Launch_ESD.vbs class).
defaults:
  platforms: [windows]
  for: [vbs]
  attack: T1566.001,T1204.002
  mbc: B0030

composite_rules:
  - id: vbs-sibling-xlsm-document-delivery
    desc: VBS delivers sibling XLSM via Excel.Application
    crit: hostile
    conf: 0.97
    near_bytes: 2048
    all:
      - id: objectives/command-and-control/dropper/execution/script::createobject-excel-application-text
      - id: objectives/command-and-control/dropper/execution/script::xlsm-sibling-path
      - id: micro-behaviors/os/com/object::filesystemobject-constructor
    any:
      - id: objectives/command-and-control/dropper/execution/script::excel-workbooks-open-call
      - id: objectives/command-and-control/dropper/execution/script::excel-display-fullscreen
