defaults:
  platforms: [windows]
  for: [pe]

composite_rules:
  - id: dotnet-managed-resource-appdomain-stager
    desc: Unsigned .NET loader executes an opaque managed resource in memory
    crit: hostile
    conf: 0.99
    attack: "T1027.009,T1620"
    mbc: B0009.014
    all:
      - id: metadata/binary/framework::dotnet-assembly
      - id: metadata/signed/trust-level::unsigned-missing-signature-record
      - id: metadata/binary/resource/entropy::clr-resource-size-and-entropy
      - id: micro-behaviors/data/embedded/payload/resource::dotnet-managed-resource-access
      - id: objectives/anti-static/obfuscation/reflection/invoke::dotnet-currentdomain-type-invokemember
    unless:
      - id: metadata/signed/platform/
      - id: micro-behaviors/data/embedded/payload/resource::costura-bundle-marker

  # Removed dotnet-resource-appdomain-reflective-loader: resource and
  # reflection references do not bind a payload to execution or prove abuse.
  # The existing neutral resource, CLR and reflection traits retain these facts.
  # Removed dynamic-module/resource co-occurrence: Reflection.Emit and
  # process-module lookup do not link a resource to execution or establish C2.

  # Removed SOAP/decryptor/reflection co-occurrence: VB's generated
  # MyWebServices template includes SoapHttpClientProtocol without any
  # network execution. It cannot establish a network payload chain.

  # An embedded resource that is decrypted and decompressed by the same
  # assembly that fingerprints its host (MAC address, public IP lookup) and then
  # starts a hidden process. The fingerprint is what a stage-two server keys on;
  # ordinary resource readers neither decrypt nor profile the machine. Costura
  # bundles and signed products are excluded.
  - id: dotnet-decrypted-resource-host-profile-hidden-launch
    desc: .NET decrypts a resource, profiles the host, launches hidden
    crit: hostile
    conf: 0.9
    attack: "T1027.009,T1082,T1564.003"
    all:
      - id: metadata/binary/framework::dotnet-assembly
      - id: micro-behaviors/data/embedded/payload/resource::dotnet-getmanifestresourcestream
      - id: micro-behaviors/crypto/decrypt::dotnet-create-decryptor
      - id: micro-behaviors/data/codec::gzipstream-dotnet
      - id: micro-behaviors/network/interface::dotnet-network-interface-mac-query
      - id: micro-behaviors/communications/http/ip-discovery::ip-api-com
      - id: micro-behaviors/process/create/hidden::dotnet-create-no-window
    unless:
      - id: metadata/signed/platform/
      - id: micro-behaviors/data/embedded/payload/resource::costura-bundle-marker

