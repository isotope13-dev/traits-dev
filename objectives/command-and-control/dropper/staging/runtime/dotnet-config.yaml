defaults:
  platforms:
    - windows
  for:
    - pe
  attack: T1027
traits:
  - id: arrow-delimited-config
    desc: Arrow-delimited dropper config pattern
    crit: suspicious
    conf: 0.9
    if:
      type: text
      regex: \.exe-=>(True|False)

composite_rules:
  - id: dotnet-arrow-config-multi-stage-dropper
    desc: .NET dropper extracts and stages multiple payloads via arrow-delimited config
    crit: hostile
    conf: 0.98
    attack: T1027,T1140,T1105
    all:
      - id: arrow-delimited-config
      - id: micro-behaviors/data/embedded/payload/resource::dotnet-resource-reader-access
      - id: micro-behaviors/fs/write/file/full::dotnet-writeallbytes-token
    any:
      - id: micro-behaviors/crypto/decrypt::dotnet-rijndael-decryptor
      - id: micro-behaviors/os/env/path::appdata-path-lookup
      - id: micro-behaviors/process/sync/mutex::create-mutex
    unless:
      - id: metadata/signed/platform/


