    type: text
    word: SevenZip.Compression.LZMA
- id: io-file-openwrite
  desc: System.IO.File OpenWrite call
  crit: notable
  conf: 0.72
  if:
    type: text
    regex: System\.IO\.File\.OpenWrite|\[System\.IO\.File\]::OpenWrite
- id: io-file-append
  desc: System.IO.File append call
  crit: notable
  conf: 0.68
  if:
    type: text
    regex: System\.IO\.File\.Append(All(Lines|Text)?|Text)?
- id: io-file-create
  desc: System.IO.File create call
  crit: notable
  conf: 0.66
  if:
    type: text
    regex: System\.IO\.File\.Create(Text)?
- id: vbs-file-delete-text
  desc: Command text deletes a VBS file
  crit: suspicious
  conf: 0.85
  for:
  - pe
  if:
    type: text
    regex: (?i)del\s.{0,50}\.vbs|Remove-Item.{0,50}\.vbs|DeleteFile.{0,50}\.vbs
  not:
  - regex: (?i)getadmin\.vbs
