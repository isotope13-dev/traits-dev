defaults:
  platforms:
  - linux
  - macos
  - windows
  - unix
  - android
  - ios
  for:
  - python
  attack: T1059.006
  mbc: E1059
composite_rules:
- id: base64-pe-dropper
  desc: Base64-decoded PE written and executed
  crit: hostile
  conf: 0.95
  all:
  - id: objectives/anti-static/obfuscation/payload/encoded/carrier::base64-pe-header
  - id: micro-behaviors/data/decode/base64::b64decode-call
  any:
  - id: micro-behaviors/process/create/launch::os-startfile-call
  - id: micro-behaviors/process/create/subprocess::process-execution
  - id: micro-behaviors/fs/chmod/executable/mode
