defaults:
  platforms:
  - unix
  - windows
  for:
  - javascript
  - typescript
  attack: T1105,T1059.007,T1222.002
  mbc: E1105,C0017
composite_rules:
- id: node-drop-executable-and-detach
  desc: Node writes an executable file and launches it detached
  crit: suspicious
  conf: 0.94
  scope: file
  near_bytes: 2048
  needs: 2
  all:
  - id: micro-behaviors/fs/write/file/full::node-write-file-sync-call
  - id: micro-behaviors/fs/chmod/executable/mode::node-chmod-make-executable
  - id: micro-behaviors/process/create/variable-spawn::spawn-variable-program
  any:
  - id: micro-behaviors/process/create/spawn::detached-true
  - id: micro-behaviors/process/create/spawn::stdio-ignore
  - id: micro-behaviors/process/daemonize/detach::node-spawn-result-unref
  unless:
  - id: metadata/package/testing/harness/runtime/
  - id: metadata/package/testing/presence/fixture::test-filename-pattern
  - id: metadata/lang/scripted::dts-declaration-file
  - id: micro-behaviors/process/lifecycle/respawn::node-self-daemon-cli-benign-context
- id: npm-import-time-embedded-payload-dropper
  for:
  - javascript
  - typescript
  - npm
  desc: Package drops and runs an embedded payload on import
  crit: hostile
  conf: 0.97
  scope: archive
  needs: 2
  all:
  - id: node-drop-executable-and-detach
  - id: micro-behaviors/data/control-flow/module-exec::js-import-time-or-first-touch-init
  any:
  - id: micro-behaviors/data/decode/base64::base64-chunk-array-buffer-concat
  - id: micro-behaviors/data/decode/base64::buffer-from-base64
  - id: micro-behaviors/fs/path/location::node-env-home-hidden-entry
  - id: micro-behaviors/fs/path/location::node-homedir-hidden-entry
  - id: micro-behaviors/os/module/require::node-lazy-builtin-capability-import
  unless:
  - id: metadata/package/testing/harness/runtime/
  - id: metadata/package/testing/presence/fixture::test-filename-pattern


