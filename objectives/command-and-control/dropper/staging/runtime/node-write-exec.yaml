defaults:
  platforms:
  - unix
  - windows
  for:
  - javascript
  - typescript
  attack: T1105,T1059.007,T1222.002
  mbc: E1105,C0017
composite_rules:
- id: npm-import-time-embedded-payload-dropper
  for:
  - javascript
  - typescript
  - npm
  desc: Package drops and runs an embedded payload on import
  crit: hostile
  conf: 0.97
  # One module: the drop-and-run profile and the import-time trigger have to
  # be the same code. Pooled across a package, a remote-agent client's
  # `process.on('exit')` logger, its ~/.cortex data-dir helper and its
  # hash-checked self-updater (write, chmod, respawn the running node) add up
  # to a "dropper" that no single file is.
  scope: file
  needs: 2
  all:
  - id: micro-behaviors/process/create/variable-spawn::node-write-chmod-detached-spawn-profile
  - id: micro-behaviors/data/control-flow/module-exec::js-import-time-or-first-touch-init
  any:
  - id: micro-behaviors/data/decode/base64::base64-chunk-array-buffer-concat
  - id: micro-behaviors/data/decode/base64::buffer-from-base64
  - id: micro-behaviors/fs/path/location::node-env-home-hidden-entry
  - id: micro-behaviors/fs/path/location::node-homedir-hidden-entry
  - id: micro-behaviors/os/module/require::node-lazy-builtin-capability-import
  unless:
  - id: metadata/package/testing/harness/runtime/
  - id: metadata/package/testing/presence/fixture::test-filename-pattern
  - id: well-known/app/ai/coding-agent/
  - id: well-known/app/ai/agent-runtime/


