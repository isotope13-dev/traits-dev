# A JVM class that carries its next stage as an encoded ZIP inside its own
# constant pool: Base64-decode, walk the ZIP entries to disk, then start the
# unpacked program with ProcessBuilder. 2026-09 trojanized Luminex Fabric mod
# (com/github/ucokcifwValue.class, 142 KB) hid its payload this way.
defaults:
  platforms: [windows, unix]
  for: [class, java_class]
  attack: T1027,T1140,T1059
  mbc: B0023
composite_rules:
  - id: jvm-embedded-base64-zip-launch
    desc: Class unpacks embedded ZIP and launches it
    crit: hostile
    conf: 0.96
    all:
      - id: micro-behaviors/data/decode/base64::java-base64-decoding-bytecode
      - id: metadata/file/encoded::java-control-prefixed-long-string
      - id: micro-behaviors/data/archive/extract/zip::jvm-zip-entry-extraction-to-file
      - id: micro-behaviors/process/create/spawn::java-processbuilder-start-bytecode


