# A Node.js application frozen into an executable with pkg keeps its scripts
# in a virtual C:\snapshot filesystem. When the bundle also carries a
# PowerShell command line with no profile and a hidden window, writes files
# with writeFileSync, and is padded to over a hundred megabytes with an
# opaque overlay, it is worth triage: the hidden PowerShell is how the Node
# code reaches Windows, and the padding defeats size limits. A legitimate
# desktop tool can show a PowerShell-built dialog, so this stays suspicious.
defaults:
  platforms: [windows]
  for: [pe]
  attack: T1059.001,T1027.001,T1564.003
composite_rules:
  - id: pkg-node-bundle-with-hidden-powershell-and-padding
    desc: pkg Node bundle with hidden PowerShell and padding
    crit: suspicious
    conf: 0.72
    all:
      - id: micro-behaviors/data/runtime/library::pkg-snapshot-entrypoint-path
      - id: micro-behaviors/process/create/hidden::powershell-windowstyle-hidden
      - id: micro-behaviors/process/create/flags::powershell-no-profile-flag
      - id: micro-behaviors/fs/write/file/full::node-write-file-sync-statement
      - id: metadata/binary/layout/size::massive-executable
    unless:
      - id: metadata/signed/platform/
