defaults:
  platforms: [windows]
  for: [pe, dll]
composite_rules:
  - id: concealed-python-runtime-user-dropper
    desc: Concealed native dropper stages embedded Python runtime in user directory
    crit: hostile
    conf: 0.98
    attack: T1105,T1059.006
    all:
      - id: micro-behaviors/communications/http/download/helper::xor16-official-python-release-url
      - id: micro-behaviors/fs/path/application/interpreter::xor16-python-executable-name
      - id: micro-behaviors/os/env/read::xor16-localappdata-name
      - id: micro-behaviors/process/create/spawn::create-process-w
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/installer/family/
