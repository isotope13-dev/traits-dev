# DEBUG.EXE stagers: the script assembles an executable out of DEBUG
# memory-edit commands, launches it, and deletes the staging. The e-line
# staging leg distinguishes this from hex/char-code droppers, which have
# their own composites; the hidden Run plus DeleteFile legs are the
# execution and cleanup all script droppers share.
defaults:
  platforms: [windows]
  for: [html]
  attack: T1059.007,T1105
composite_rules:
  - id: debug-staged-hidden-launch-cleanup
    desc: DEBUG-staged payload launches hidden with cleanup
    crit: hostile
    conf: 0.97
    all:
      - id: micro-behaviors/fs/write/content::debug-script-memory-edit
      - id: micro-behaviors/data/control-flow/dispatch/named::run-zero-style-argument
      - id: micro-behaviors/fs/delete/file/self::html-deletefile-call
