defaults:
  platforms: [windows]
  for: [batch]
composite_rules:
  - id: batch-hidden-vbs-download-persistence
    desc: Hidden VBS download stage with Run-key write
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/communications/http/download/cli::iwr-outfile-download
      - id: micro-behaviors/process/create/flags::wscript-shell-run-hidden-window
      - id: objectives/persistence/login/startup/registry::run-key-wscript-vbs-launcher
      - id: micro-behaviors/fs/file/attributes::attrib-hidden-system
      - id: micro-behaviors/fs/delete/file/self::batch-self-delete
      - id: micro-behaviors/process/create/shell/script-host::cscript-batch-mode
