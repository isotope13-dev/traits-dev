# Packaged Node or JavaScript dropper decrypts embedded payload and writes to disk.
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript, pe]
  attack: T1027,T1140,T1105
  mbc: B0032,B0024

composite_rules:
  - id: node-xor-payload-dropper
    desc: Node dropper decrypts XOR payload to disk
    crit: hostile
    conf: 0.98
    # A webpack bundle holds Blowfish/RC4, writeFileSync, and a powershell
    # process query in unrelated modules. The dropper keeps those three in
    # one small script; megabytes of bundle distance is not a dropper.
    near_bytes: 8192
    all:
      - id: micro-behaviors/crypto/symmetric/xor/loop::js-buffer-xor-loop
      - id: micro-behaviors/fs/write/file/full::synchronous-file-write-call-or-embedded-text
    any:
      - id: micro-behaviors/process/create/spawn::node-jar-launch-argument
      - id: micro-behaviors/process/create/exec::node-powershell-launch
    unless:
      - id: micro-behaviors/data/serialize/json::json-stringify-call
      - id: "metadata/file/naming::test-directory-component"
