defaults:
  for: [javascript]
  platforms: [unix, windows]
composite_rules:
  - id: transformed-response-helper-staging
    desc: Transformed response, executable write and launch
    crit: suspicious
    conf: 0.95
    all:
      - id: metadata/file/profile/cryptography::transformed-response-returned
      - id: metadata/file/profile/staging::awaited-data-executable-write
      - id: metadata/file/profile/execution-api::launched-helper-path-from-setup
      - id: micro-behaviors/communications/tls/verify/disable::reject-unauthorized-false
      - id: micro-behaviors/data/parse/json::json-parse-data-identifier
