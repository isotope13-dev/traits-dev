# A JScript file for the Windows Script Host that rebuilds its COM class names
# and paths from XOR-ed number arrays, reaches the host object only through
# bracketed member names and carries a large Base64-like blob next to a
# decrypt routine is a stager: the blob is decrypted and run as the next stage.
defaults:
  platforms: [windows]
  for: [javascript]
  attack: T1059.007,T1027,T1140
composite_rules:
  - id: wsh-js-xor-built-strings-with-decrypt-routine-and-packed-blob
    desc: WSH JScript with XOR strings, decrypt routine, blob
    crit: hostile
    conf: 0.88
    all:
      - id: metadata/lang/runtime::wscript-host-reference
      - id: micro-behaviors/data/property/access::wscript-bracket-member-access
      - id: micro-behaviors/data/decode/xor::js-array-xor-character-reconstruction
      - id: metadata/file/function::decrypt-named-function-declaration
      - id: metadata/file/encoded::large-base64-like-literal
