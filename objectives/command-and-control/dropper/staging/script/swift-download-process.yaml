# Classified by required operations; references do not establish data flow.
defaults:
  platforms: [windows]
  for: [scripts, source, class, java_class]
composite_rules:
  - id: swift-powershell-download-stage
    desc: Swift script download with PowerShell flags
    crit: suspicious
    conf: 0.99
    platforms: [windows, macos]
    for: [swift, shell, zip, tar]
    scope: archive
    all:
      - id: micro-behaviors/communications/http/download/curl::source-curl-script-url
      - id: micro-behaviors/communications/http/download/cli::fetch-output-option-script
      - id: micro-behaviors/process/create/flags::code-powershell-noninteractive-options
      - id: micro-behaviors/process/create/direct::swift-source-process-run

