defaults:
  platforms: [unix]
  for: [shell]

traits:
- id: shell-appended-payload-extract
  desc: Shell extracts an appended payload
  crit: suspicious
  conf: 0.95
  if:
    type: text
    # A hash on the same line is a comment, as in `sed -n "2p") # tail -n 1`.
    # Appended payload extraction uses `tail -n +<N>` or `tail +<N>`, not `tail -n 1`.
    # The sed has to read the script itself ("$0" / BASH_SOURCE): a build
    # script that slices a section out of captured CLI help output with the
    # same pipeline extracts nothing appended to itself.
    regex: '(?m)sed\s+-n[^\n#]{0,180}\$\{?(0|BASH_SOURCE)[^\n#]{0,120}tail\s+(-n\s*)?\+'

