defaults:
  platforms: [windows]
  for: [pe]
  attack: T1027.009

composite_rules:
  # The overlay is the stage. URLMon and concealed dispatch do not establish
  # that a downloaded file or the overlay itself reaches an execution sink.
  - id: vb6-concealed-overlay-urlmon
    desc: VB6 overlay stub with URLMon and concealed APIs
    crit: hostile
    conf: 0.98
    all:
      - id: metadata/binary/framework::vb6-application-framework
      - id: metadata/binary/layout/embedded::pe-embedded
      - id: micro-behaviors/communications/http/client/urlmon::url-download-to-file-str
      - id: objectives/anti-static/obfuscation/imports/concealment::vb6-obfuscated-runtime-dispatch
      - id: overlay-body-stub-executable
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/installer/family/
      - id: well-known/tool/

  - id: vb6-overlay-stub-shell-marker
    desc: VB6 overlay stub with shell capability
    crit: suspicious
    conf: 0.95
    all:
      - id: micro-behaviors/process/create/macro/office::vb6-shell-execution
      - id: overlay-body-stub-executable
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/installer/family/
