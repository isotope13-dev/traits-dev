defaults:
  platforms: [windows]
  for: [pe]
  attack: T1027.009

composite_rules:
  # The overlay is the stage. URLMon and concealed dispatch do not establish
  # that a downloaded file or the overlay itself reaches an execution sink.
  - id: vb6-overlay-stub-shell-marker
    desc: VB6 overlay stub with shell capability
    crit: suspicious
    conf: 0.95
    all:
      - id: micro-behaviors/process/create/exec::vb6-shell-execution
      - id: overlay-body-stub-executable
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/installer/family/
