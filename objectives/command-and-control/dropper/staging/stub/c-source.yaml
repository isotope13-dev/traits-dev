defaults:
  platforms: [windows]
  for: [c, cpp]
  attack: T1059.004
  mbc: E1059

traits:
- id: back-orifice-installer-comment
  desc: Back Orifice installer wrapper
  crit: suspicious
  conf: 0.99
  if:
    type: text
    regex: 'Back Orifice.{0,24}installer'
- id: fixed-offset-self-extract
  desc: Fixed-offset self-extracting stub
  crit: suspicious
  conf: 0.94
  if:
    type: text
    regex: 'fseek\s*\(\s*input\s*,\s*FIRST_OFFSET\s*,\s*SEEK_SET\s*\)'
- id: second-payload-seek
  desc: Second embedded payload seek
  crit: suspicious
  conf: 0.91
  if:
    type: text
    regex: 'fileNumber==1|fseek\s*\(\s*input\s*,\s*len\s*,\s*SEEK_CUR\s*\)'
# detached-process-flag relocated to
# micro-behaviors/process/create/flags::detached-process-source-token.

composite_rules:
- id: fixed-offset-self-extract-stub
  desc: Fixed-offset self-extracting stub
  crit: suspicious
  conf: 0.96
  all:
  - id: micro-behaviors/fs/read/self::commandline-self-read
  - id: fixed-offset-self-extract
  any:
  - id: second-payload-seek
  - id: back-orifice-installer-comment
- id: hidden-installer-decoy-stage
  desc: Hidden self-extraction installer stage
  crit: suspicious
  conf: 0.95
  all:
  - id: fixed-offset-self-extract-stub
  - id: micro-behaviors/process/create/hidden::sw-hide-create-process-source
  - id: micro-behaviors/process/create/flags::detached-process-source-token
  any:
  - id: back-orifice-installer-comment
  - id: micro-behaviors/process/create/flags::sw-showdefault-token
