defaults:
  platforms: [windows]
  for: [pe, dll]
  attack: T1027.009
  mbc: E1027

composite_rules:
  - id: sfx-numbered-exe-part-dropper
    desc: SFX carries numbered executable parts
    crit: hostile
    conf: 0.96
    all:
      - id: metadata/binary/installer/sfx::winrar-sfx
      - id: metadata/binary/installer/sfx::numbered-exe-part-names
  - id: overlay-stub-temp-exe
    desc: Overlay stub writes a temp executable
    crit: hostile
    conf: 0.94
    all:
      - id: metadata/binary/layout/overlay::unsigned-dominant-overlay-small-sections
      - id: micro-behaviors/fs/path/temp::windows-temp-executable-path
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/installer/family/

  - id: overlay-stub-watchdog
    desc: Overlay stub plants a watchdog loader
    crit: hostile
    conf: 0.94
    all:
      - id: metadata/binary/layout/overlay::unsigned-dominant-overlay-small-sections
      - id: micro-behaviors/fs/path/basename::loader-executable-reference
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/installer/family/
