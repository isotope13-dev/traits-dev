# A PE whose executable part is a stub and whose content is appended after it.
#
# Every section is small, the overlay is most of the file, and the checksum in
# the header no longer matches the bytes on disk — the payload was appended
# after linking, by something other than the compiler. That is the shape of a
# self-extracting dropper: the code that runs is only big enough to find,
# decode and hand off the blob behind it, and the blob is what an analyst
# actually needs to see.
#
# Real self-extracting installers are built this way on purpose, so the rule
# leans on the parts they do not share: they are signed, they identify their
# builder (NSIS, 7-Zip, Inno — already excluded by the overlay atom itself),
# and their headers are consistent because the builder wrote the whole file.
defaults:
  platforms: [windows]
  for: [pe, dll]
  attack: T1027.009
  mbc: E1027

composite_rules:
  - id: winrar-sfx-overlay-body-stub
    desc: WinRAR SFX executable is a stub with an overlay payload
    crit: hostile
    conf: 0.95
    all:
      - id: metadata/binary/installer/sfx::winrar-sfx
      - id: metadata/binary/layout/overlay::overlay-dominates-80pct
      - id: metadata/binary/layout/overlay::overlay-at-least-half
    unless:
      - id: metadata/signed/platform/
  - id: overlay-body-stub-executable
    desc: PE is a stub with its payload appended
    crit: suspicious
    conf: 0.92
    all:
      - id: metadata/binary/layout/overlay::overlay-dominates-80pct
      - id: metadata/binary/section/ratio::pe-largest-section-under-ten-percent
      - id: metadata/binary/layout/checksum::pe-checksum-mismatch
      - id: metadata/signed/trust-level::unsigned-missing-signature-record
    unless:
      - id: metadata/binary/installer/family/
      - id: metadata/binary/installer/script/
      - id: well-known/tool/
      - id: micro-behaviors/fs/temp/pyinstaller/

  - id: overlay-stub-temp-exe
    desc: Overlay stub writes a temp executable
    crit: hostile
    conf: 0.94
    all:
      - id: overlay-body-stub-executable
      - id: micro-behaviors/fs/path/temp::windows-temp-executable-path
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/installer/family/

  - id: overlay-stub-watchdog
    desc: Overlay stub plants a watchdog loader
    crit: hostile
    conf: 0.94
    all:
      - id: overlay-body-stub-executable
      - id: micro-behaviors/process/lifecycle/supervise::watchdog-loader-reference
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/installer/family/
