# A batch file that starts a bundled pythonw.exe with an inline -c program which
# Base64-decodes and decompresses its next stage before exec()ing it keeps the
# real loader out of the file, and the hidden interpreter shows no console.
defaults:
  platforms: [windows]
  for: [batch]
  attack: T1059.006,T1027.010,T1140
composite_rules:
  - id: batch-starts-pythonw-with-inline-decompress-exec
    desc: Batch runs pythonw inline decode-and-exec stage
    crit: hostile
    conf: 0.9
    all:
      - id: micro-behaviors/process/create/shell/command-mode::start-unquoted-executable-command
      - id: micro-behaviors/fs/path/basename::pythonw-executable-reference
      - id: objectives/anti-static/obfuscation/payload/code-in-data::exec-of-decompressed
      - id: metadata/file/line::batch-has-long-token
