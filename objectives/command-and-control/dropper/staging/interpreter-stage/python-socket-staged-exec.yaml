# Raw-socket receive and Python exec co-occurrence. This is a staging lead,
# not proof that the received value reaches exec. Connection and uint32
# decoding alone are neutral protocol observations in socket/framing.
defaults:
  platforms: [unix, windows]
  for: [python, text, makefile]
  attack: T1105
composite_rules:
  # Legitimate remote-admin frameworks can receive and execute code, so
  # bounded co-occurrence alone stays suspicious.
  - id: python-socket-staged-exec
    desc: Socket receive near Python namespace exec
    # Use the canonical parsed exec call, so prose/Makefile text alone cannot
    # claim interpreter execution.
    for: [python]
    crit: suspicious
    conf: 0.88
    near_lines: 40
    all:
      - id: micro-behaviors/communications/socket/receive::python-socket-named-recv-assignment
      - id: micro-behaviors/process/interpreter/eval/direct::exec-variable-namespace
