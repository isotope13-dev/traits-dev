defaults:
  platforms: [windows]
  for: [batch]
  attack: T1059.006,T1105

composite_rules:
  - id: ironpython-network-stage
    desc: IronPython script with remote stage download
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/process/interpreter/embedded-python::ironpython-script-launch
      - id: micro-behaviors/communications/http/lib/invoke-webrequest::batch-powershell-iwr-alias
    any:
      - id: micro-behaviors/process/interpreter/embedded-python::ironpython-path-environment
      - id: micro-behaviors/process/interpreter/embedded-python::ironpython-runtime-executable
