# Malicious virtual-disk staging on Windows. The reusable behavior is the
# combination of mounting a VHD/VHDX-like container and executing a shortcut
# that masquerades as a document from the mounted volume. Download and cleanup
# variants strengthen the same technique without depending on one campaign,
# CVE number, filename, server, or implementation language.
defaults:
  platforms: [windows]
  for: [scripts, source, binaries]
  attack: T1105,T1204.002

composite_rules:
  - id: virtual-disk-document-lnk-execution
    desc: Mounted virtual disk stages a document-masquerading shortcut for execution
    crit: hostile
    conf: 0.99
    all:
      - id: micro-behaviors/fs/volume/mount::virtual-disk-attach
      - id: objectives/evasion/masquerade/extension/double::document-named-lnk-execution

  - id: downloaded-virtual-disk-document-lnk-execution
    desc: Downloaded virtual disk stages a document-masquerading shortcut for execution
    crit: hostile
    conf: 0.99
    all:
      - id: micro-behaviors/communications/http/download/cli::iwr-outfile-download
      - id: micro-behaviors/fs/volume/mount::virtual-disk-attach
      - id: objectives/evasion/masquerade/extension/double::document-named-lnk-execution

  - id: virtual-disk-document-lnk-cleanup
    desc: Virtual-disk shortcut execution chain detaches and deletes its staging image
    crit: hostile
    conf: 0.99
    all:
      - id: micro-behaviors/fs/volume/mount::virtual-disk-attach
      - id: micro-behaviors/fs/volume/mount::virtual-disk-detach
      - id: objectives/evasion/masquerade/extension/double::document-named-lnk-execution
    any:
      - id: micro-behaviors/fs/file/delete::powershell-remove-item-force
      - id: micro-behaviors/fs/file/delete::cmd-del-force-quiet
