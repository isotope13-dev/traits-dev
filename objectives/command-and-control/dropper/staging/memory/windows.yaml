defaults:
  platforms: [windows]
  for: [pe, dll]
  attack: T1105,T1027,T1620
  mbc: E1105

traits:
  # micro-behaviors/crypto/symmetric/aes/runtime-library::createDecipheriv is
  # `type: symbol` (a parsed JS call-table fact), `for: [javascript,
  # typescript]` only -- a pe/dll node never gets that AST-level fact even
  # when a bundled Node/Bun SEA executable embeds the raw JS as text (as
  # custom-memory-loader-module's plain `memload` substring already does
  # reach below). Use a text-mode substring instead, same as that sibling leg.
  - id: pe-createdecipheriv-text
    desc: Embedded createDecipheriv reference
    crit: notable
    conf: 0.85
    if:
      type: text
      substr: createDecipheriv

composite_rules:
  - id: embedded-encrypted-memory-loader
    desc: Embedded source decrypts staged data before invoking a memory loader
    crit: hostile
    conf: 0.98
    attack: T1027,T1105,T1620
    for: [dll]
    all:
      - id: micro-behaviors/mem/create/fileless::custom-memory-loader-module
      - id: pe-createdecipheriv-text
      - id: objectives/evasion/security-bypass/tls::reject-unauthorized-false-native
      - id: micro-behaviors/communications/http/content-length::raw-content-length-header
    unless:
      # Bun's single-file runtime embeds AES + custom loaders for its own PE.
      - id: well-known/lib/runtime/scripted/bun-runtime::runtime-context
