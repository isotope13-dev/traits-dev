# Native Linux loaders that retrieve an encoded stage over a raw socket and
# execute it from an anonymous file descriptor.  The evidence is deliberately
# composed from APIs, protocol bytes, and code structure so compiler and family
# changes do not require a new family signature.
defaults:
  crit: hostile
  conf: 0.99
  platforms: [linux]
  for: [elf]
  attack: "T1105,T1140,T1620"
  mbc: "B0024,C0002"

composite_rules:
  - id: raw-socket-anonymous-stage-execution
    desc: Raw-socket payload written to memfd and executed without a disk file
    all:
      - id: micro-behaviors/communications/socket/create::create
      - id: micro-behaviors/communications/socket/connect::connect
      - id: micro-behaviors/communications/socket/send::send
      - id: micro-behaviors/communications/socket/receive::receive
      - id: micro-behaviors/fs/write/file/descriptor::write--write
      - id: micro-behaviors/process/create/direct::fexecve-import
    any:
      - id: micro-behaviors/mem/anonymous/create::memfd-create
      - id: micro-behaviors/mem/anonymous/create::memfd-create-syscall-number-x86
      - id: micro-behaviors/mem/anonymous/create::memfd-create-syscall-number-aarch64
    needs: 1
    unless:
      # CPython imports these APIs for its socket, tempfile, and execution
      # modules; its interpreter identity is not an anonymous stage loader.
      - id: well-known/lib/runtime/scripted/cpython::cpython-interpreter-binary
      # The same argument the liblxc note below makes, reaching the case the
      # export-count downgrade cannot: an OCI runtime EXECUTABLE. Copying
      # itself to a memfd and fexecve-ing is the documented CVE-2019-5736
      # mitigation, not fileless staging.
      - id: well-known/app/infrastructure/runc::oci-runtime-lifecycle-binary
      - id: metadata/package/tooling::lxc-runtime
    downgrade:
      any:
        # Every leg here is an *import*, and a general-purpose shared library
        # imports the union of what its callers need. liblxc genuinely calls
        # memfd_create and fexecve -- that is how `lxc-attach` execs inside a
        # namespace -- alongside its socket API. A 200+ export table says the
        # binary is a library offering these as documented entry points, not a
        # stager whose whole program is this one chain.
        - id: metadata/binary/header/identity::elf-shared-library-with-exports

  - id: xor-anonymous-stage-loader
    desc: Bytewise XOR decoded anonymous stage loader
    all:
      - id: raw-socket-anonymous-stage-execution
    any:
      - id: micro-behaviors/data/decode/xor::elf-bytewise-xor-loop
      - id: micro-behaviors/data/decode/xor::x86-bytewise-xor-loop
      - id: micro-behaviors/data/decode/xor::aarch64-bytewise-xor-loop
    needs: 1
