# ISO-specific evidence for a managed dropper that materializes a reflected
# stage only in memory. Standalone ISO images are opaque to cleave, so the
# container and managed-loader markers are deliberately required together.
defaults:
  platforms: [windows]
  for: [all]

composite_rules:
  - id: iso-dotnet-in-memory-managed-stage
    desc: ISO in-memory managed stage handoff
    crit: hostile
    conf: 0.99
    attack: T1027,T1140,T1620
    mbc: B0032,E1059
    all:
      - id: metadata/file/format/structured::primary-volume-descriptor
      - id: metadata/file/format/iso::iso-dotnet-metadata-sig
      - id: metadata/file/format/iso::iso-dotnet-hex-slice
      - id: metadata/file/format/iso::iso-dotnet-hex-byte-conversion
      - id: metadata/file/format/managed-runtime::embedded-dotnet-reflection-marker
      - id: metadata/file/format/managed-runtime::embedded-dotnet-activator-reference
