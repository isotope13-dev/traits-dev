defaults:
  platforms:
    - linux
    - macos
    - windows
  for:
    - elf
    - macho
  mbc: B0030
  attack: T1027.009
traits:
  - id: go-main-decrypt-symbol
    desc: Go main.decrypt stage-decryption routine
    crit: notable
    conf: 0.95
    for: [pe]
    platforms: [windows]
    if:
      type: text
      exact: main.decrypt
  - id: go-main-execute-symbol
    desc: Go main.execute in-memory stage runner
    crit: notable
    conf: 0.95
    for: [pe]
    platforms: [windows]
    if:
      type: text
      exact: main.execute
  - id: run-from-memory
    desc: Run-from-memory execution pattern
    crit: notable
    conf: 0.9
    if:
      type: text
      substr: runFromMemory
    unless:
      - id: well-known/tool/detection/malcontent::malcontent-defensive-scanner-context
composite_rules:
  - id: go-decrypt-execute-embedded-stage
    desc: Go decrypt-then-execute embedded stage loader
    crit: hostile
    conf: 0.97
    attack: T1027.009,T1620
    platforms: [windows]
    for: [pe]
    all:
      - id: metadata/lang/compiler/systems::go-pe-symtab
      - id: go-main-decrypt-symbol
      - id: go-main-execute-symbol
    unless:
      - id: metadata/signed/platform/
  - id: memory-dropper
    desc: Go memory dropper (decrypt+memexec)
    crit: hostile
    conf: 0.95
    attack: T1620
    all:
      - id: run-from-memory
      - id: micro-behaviors/process/create/exec::execve-import
    any:
      - id: micro-behaviors/crypto/symmetric/aes/library::go-cfb-decrypter-string
      - id: micro-behaviors/crypto/symmetric/aes/initialize::go-new-cipher-string
      - id: micro-behaviors/crypto/symmetric/aes/constant::aes-sbox-bytes
