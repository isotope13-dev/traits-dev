# Native source equivalent of encoded AutoIt/CryptoAPI memory loaders.
# Required API evidence describes co-occurrence, not proven data flow.
defaults:
  for: [c, cpp]
  platforms: [windows]
  conf: 0.94
  attack: T1140,T1620
composite_rules:
  - id: encoded-capi-executable-memory-staging-source
    desc: CryptoAPI decoding and decryption beside executable allocation
    crit: suspicious
    all:
      - id: micro-behaviors/crypto/library/encoding::crypt-string-to-binary
      - id: micro-behaviors/crypto/library/cryptoapi::crypt-import-key
      - id: micro-behaviors/crypto/library/cryptoapi::crypt-decrypt
      - id: micro-behaviors/mem/protect/modify::source-execute-memory-request
