defaults:
  platforms: [windows]
  for: [pe]
  attack: "T1027.003,T1036.007,T1620"

composite_rules:
  - id: document-lure-dotnet-bitmap-memory-stage
    desc: Document-lure executable reflectively stages code reconstructed from a bitmap
    crit: hostile
    conf: 0.995
    all:
      - id: metadata/file/extension/executable::document-double-exe-suffix
      - id: metadata/build/manifest::pe-manifest-myapplication-template
      - id: metadata/signed/trust-level::unsigned-missing-signature-record
      - id: micro-behaviors/ui/graphics/image::dotnet-bitmap-resource-pixel-api-references
      - id: micro-behaviors/metaprogramming/reflection::activator
      - id: micro-behaviors/process/interpreter/reflection/runtime::get-exported-types-token
    unless:
      - id: metadata/signed/platform/

  - id: document-double-ext-bitmap-vb-loader
    desc: Document double-extension bitmap VB loader
    crit: hostile
    conf: 0.99
    attack: T1036.007,T1027.003,T1620
    all:
      - id: metadata/file/extension/executable::document-double-exe-suffix
      - id: metadata/signed/trust-level::unsigned-missing-signature-record
      - id: micro-behaviors/data/embedded/payload/image::bmp-rgb-column-pe-header
      - id: micro-behaviors/process/interpreter/reflection/vb::vb-latecall-token
      - id: micro-behaviors/process/interpreter/reflection/runtime::getdomain-member-token
    unless:
      - id: metadata/signed/platform/

  - id: document-lure-fake-microsoft-bitmap-stager
    desc: Fake Microsoft document lure bitmap stager
    crit: hostile
    conf: 0.98
    attack: T1036.001,T1036.007,T1620
    all:
      - id: metadata/file/extension/executable::document-double-exe-suffix
      - id: metadata/signed/trust-level::unsigned-missing-signature-record
      - id: metadata/binary/provenance/version-info::company-microsoft-corporation
      - id: micro-behaviors/data/embedded/payload/image::bmp-rgb-column-pe-header
    unless:
      - id: metadata/signed/platform/
