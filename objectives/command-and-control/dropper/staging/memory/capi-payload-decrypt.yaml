defaults:
  for: [pe, dll]
  platforms: [windows]
  attack: T1140
  mbc: B0023
composite_rules:
  - id: capi-file-payload-decrypt-loader
    desc: CryptoAPI file decryption with executable memory staging
    crit: suspicious
    conf: 0.85
    all:
      - id: micro-behaviors/crypto/provider/cryptoapi::crypt-acquire-context
      - id: micro-behaviors/crypto/provider/cryptoapi::crypt-import-key
      - id: micro-behaviors/crypto/decrypt::crypt-decrypt
      - id: micro-behaviors/fs/file/open::file-create-win
      - id: micro-behaviors/fs/read/file/handle::read-file
      - id: micro-behaviors/mem/protect/modify::executable-page-protection-evidence
      - id: micro-behaviors/process/thread/create::create-thread
    downgrade:
      any:
        - id: metadata/binary/installer/family/
        - id: metadata/binary/vendor::is-microsoft-named
        # Endpoint-security vendors legitimately ship CryptoAPI-based
        # signed-payload decrypt loaders (downloaded definition/module files).
        - id: metadata/signed/leaf::nortonlifelock-inc.
    unless:
      - id: metadata/signed/platform/

  # A large, unsigned RWX relocation payload alongside this decrypt-to-memory
  # path and x86 PEB access identifies a concealed native payload stager.
  - id: capi-rwx-reloc-payload-stager
    desc: CryptoAPI decryptor stages an RWX relocation payload
    crit: hostile
    conf: 0.97
    attack: T1027.002,T1140,T1620
    size_min: 131072
    all:
      - id: capi-file-payload-decrypt-loader
      - id: metadata/binary/section/entropy::large-high-entropy-rwx-reloc
      - id: micro-behaviors/process/info/query::peb-access-x86
      - id: metadata/signed/trust-level::unsigned-missing-signature-record
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/installer/family/
      - id: metadata/binary/framework::dotnet-metadata
      - id: well-known/tool/reverse-engineering/frida/
      # SAP HANA's native client uses CryptoAPI for normal database/TLS
      # support; it is not a staged payload loader.
      - id: well-known/lib/data/sap-hana/
      - id: well-known/lib/runtime/scripted/php-runtime::runtime-binary-context
      # AtHocAFRC decrypts signed application/config data with its own legacy
      # CryptoAPI helper; it is not a staged payload loader.
      - id: well-known/app/enterprise/athoc::athocafrc-legacy-module-context
      # osquery is an open-source endpoint monitoring agent that uses OpenSSL/CryptoAPI and thread pools.
      - id: well-known/tool/sysadmin/osquery::osquery-tool-context

  - id: capi-inline-pe-memory-loader
    desc: CryptoAPI-decrypted PE staged in executable memory
    crit: hostile
    conf: 0.98
    attack: T1140,T1620
    all:
      - id: micro-behaviors/crypto/provider/cryptoapi::capi-keyed-buffer-crypto-chain
      - id: micro-behaviors/mem/protect/modify::executable-page-protection-evidence
      - id: micro-behaviors/data/embedded/payload/header::inline-pe-header-validation-sequence
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/installer/family/
      - id: well-known/lib/platform/advanced-installer::advanced-installer-helper-context

  # Some native loaders derive a CryptoAPI key rather than import one. Keep
  # the full hash/decrypt cluster explicit because high-export decoy DLLs can
  # intentionally suppress the generic key-derivation aggregate.
