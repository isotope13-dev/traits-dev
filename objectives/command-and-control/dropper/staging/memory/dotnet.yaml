      - id: micro-behaviors/communications/http/client/managed::readasbytearrayasync
      - id: micro-behaviors/data/decode/base64::dotnet-frombase64string-text
      - id: micro-behaviors/crypto/symmetric/decrypt::dotnet-create-decryptor
      - id: metadata/lang/compiler/managed::reflection-emit
      - id: metadata/lang/compiler/managed::assembly-builder-token
      - id: micro-behaviors/process/interpreter/reflection/runtime::invoke-member-token
      - id: micro-behaviors/os/api-resolution/dynamic::managed-function-pointer-delegate

  - id: dotnet-unsigned-http-reflective-loader
    desc: Unsigned .NET HTTP reflective payload loader
