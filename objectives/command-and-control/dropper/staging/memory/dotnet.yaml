  # HOSTILE (T1140 Deobfuscate/Decode + in-memory execution): a .NET assembly
  # whose body is a large random high-entropy section (the encrypted payload)
  # which it decodes at runtime and runs via the reflective load+instantiate
  # chain — the payload never touches disk in cleartext. This is the
  # SnakeKeyLogger / commodity MSIL-crypter in-memory delivery shape.
  - id: dotnet-inmemory-staged-encrypted-payload
    desc: .NET decodes an embedded encrypted payload and runs it in memory
    crit: hostile
    conf: 0.88
    attack: T1140
    all:
      - id: metadata/binary/framework::dotnet-assembly
      - id: objectives/anti-static/obfuscation/reflection/invoke::dotnet-reflective-loader-chain
      - id: metadata/binary/section/metrics::random-exec-payload-section
    unless:
      - id: metadata/signed/platform::microsoft-corporation
  - id: dotnet-packed-encrypted-resource-stager
    desc: .NET packed encrypted resource stager
    crit: hostile
    conf: 0.94
    attack: T1620
    mbc: E1059
    all:
      - id: objectives/anti-static/obfuscation/payload/resource::dotnet-managed-resource-decryptor
      - id: micro-behaviors/process/interpreter/reflection/runtime::managed-resource-reflection-activation
      - id: objectives/anti-static/pack/runtime::dotnet-packed-stub
    unless:
      - id: metadata/signed/platform::microsoft-windows
      - id: metadata/binary/resource/

  # The `all:` legs are all name-presence facts that an ordinary unsigned WPF
  # application satisfies on its own: a localized app has a large managed
  # resource and reads it, `Convert.FromBase64String` is everywhere, and the
  # bare word `Activator` is in the typeref table of anything that uses XAML or
  # a DI container. Without a leg that shows the decoded bytes are *loaded as
  # code*, this rule was "unsigned .NET app with resources", and the `unless:`
  # list below was growing one shipping product at a time.
  #
  # The `any:` group supplies that missing half. In a compiled assembly the
  # loader is visible as the `Assembly\0Load\0GetType\0GetMethod` run in the
  # #Strings heap (there is no `Assembly.Load` substring to find in a PE); the
  # source-level chain and the load-from-bytes form cover the other carriers.
  - id: dotnet-base64-activator-resource-loader
    desc: Unsigned .NET reflectively loads decoded resource
    crit: hostile
    conf: 0.96
    attack: T1027.009,T1140,T1620
    all:
      - id: metadata/binary/framework::dotnet-assembly
      - id: metadata/binary/layout::pe-no-signature-record
      - id: metadata/binary/resource::dotnet-large-high-entropy-managed-resource
      - id: micro-behaviors/data/embedded/payload/resource::dotnet-managed-resource-access
      - id: micro-behaviors/data/decode/base64::dotnet-frombase64string-text
      - id: micro-behaviors/process/interpreter/reflection/runtime::activator
    any:
      - id: micro-behaviors/os/api-resolution/dynamic::assembly-load-type-method-marker-cluster
      - id: micro-behaviors/os/api-resolution/dynamic::assembly-load-getmethod-chain
      - id: micro-behaviors/process/interpreter/reflection/resolve::assembly-load-buffer
    needs: 1
    unless:
      - id: metadata/signed/platform/
      - id: micro-behaviors/data/embedded/payload/resource::costura-bundle-marker
      - id: well-known/app/system/stresstimulus::logicnp-cryptolicensing
      - id: well-known/app/productivity/thebrain::thebrain-known-app-context
      - id: well-known/app/media/handbrake::handbrake-known-release-context

  # A download/decode/decrypt chain paired with Reflection.Emit and native
  # delegate resolution is an execution path, not merely crypto or HTTP use.
  - id: dotnet-http-download-decrypt-emit-cluster
    desc: .NET HTTP decrypt-and-dynamic-code cluster
    crit: component
    conf: 0.99
    near_bytes: 8192
    all:
