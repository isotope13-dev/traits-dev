defaults:
  platforms:
  - windows
  for:
  - html
  attack: T1140,T1218.005,T1620
  crit: hostile
  conf: 0.99
composite_rules:
- id: hta-binaryformatter-memory-loader
  desc: Hidden HTA deserializes an encoded .NET object in memory
  mbc: C0026,E1059
  all:
  - id: metadata/file/format/markup::hta-application-element
  - id: micro-behaviors/ui/window/control::hta-hidden-or-minimized-window-request
  - id: micro-behaviors/data/serialize/unsafe::binary-formatter-deserialize-call
  - id: metadata/lang/source/naming/resource::dotnet-frombase64transform-text
- id: hta-base64-reflective-assembly-loader
  desc: HTA decodes and reflectively activates a .NET assembly in memory
  mbc: E1059
  all:
  - id: metadata/file/format/markup::hta-application-element
  - id: metadata/lang/source/naming/resource::dotnet-frombase64string-text
  - id: micro-behaviors/process/interpreter/reflection/resolve::assembly-load-variable-argument
  - id: micro-behaviors/process/interpreter/reflection/runtime::script-activator-createinstance-call
  - id: micro-behaviors/process/interpreter/reflection/runtime::dotnet-reflected-method-invoke
