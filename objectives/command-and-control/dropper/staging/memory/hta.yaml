# HTA loaders that turn an embedded encoded object into executable managed
# code without writing the final assembly to disk. The API names are platform
# structure, not campaign identifiers, so these rules cover renamed and
# reimplemented variants of the same deserialization/reflection chain.
defaults:
  platforms: [windows]
  for: [html]
  attack: T1140,T1218.005,T1620

composite_rules:
  - id: hta-binaryformatter-memory-loader
    desc: Hidden HTA deserializes an encoded .NET object in memory
    crit: hostile
    conf: 0.99
    mbc: C0026,E1059
    all:
      - id: metadata/file/format/markup::hta-application-element
      - id: objectives/evasion/process/hidden/execution::hidden-hta-window
      - id: micro-behaviors/data/serialize/unsafe::binary-formatter-deserialize-call
      - id: micro-behaviors/data/decode/base64::dotnet-frombase64transform-text

  - id: hta-base64-reflective-assembly-loader
    desc: HTA decodes and reflectively activates a .NET assembly in memory
    crit: hostile
    conf: 0.99
    mbc: E1059
    all:
      - id: metadata/file/format/markup::hta-application-element
      - id: micro-behaviors/data/decode/base64::dotnet-frombase64string-text
      - id: micro-behaviors/process/interpreter/reflection/resolve::assembly-load-buffer
      - id: micro-behaviors/process/interpreter/reflection/runtime::script-activator-createinstance-call
      - id: micro-behaviors/process/interpreter/reflection/runtime::csharp-reflection-invoke-call
