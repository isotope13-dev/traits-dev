# In-memory execution of a PE recovered from a custom image container
# (PXK2/RC4 mosaic carriers). Complements delivery/stego container detection
# with the VirtualProtect + thread-start exec path used after decode.
defaults:
  platforms: [windows]
  for: [pe, dll]
  attack: T1027.003,T1620,T1055
  mbc: E1027.m02

composite_rules:
  - id: pxk2-rc4-image-memory-exec
    desc: PXK2 image payload via VirtualProtect thread
    crit: hostile
    conf: 0.97
    all:
      - id: objectives/command-and-control/dropper/delivery/stego::pxk2-payload-container
      - id: micro-behaviors/mem/protect/modify::virtual-protect
      - id: micro-behaviors/process/threading/create::create-thread-text
    any:
      - id: objectives/command-and-control/dropper/delivery/stego::winapi-virtual-alloc-symbol
      - id: micro-behaviors/fs/file/pe-inspect::inline-pe-signature-check
