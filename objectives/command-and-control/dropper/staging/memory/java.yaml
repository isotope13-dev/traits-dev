defaults:
  platforms: [unix, windows]
  for: [class, java_class]
  attack: "T1027,T1129,T1620"
  mbc: B0032

composite_rules:
  # A memory JAR loader is suspicious for plugin hosts, but obfuscated class
  # constants plus explicit class loading and instantiation identify the
  # hidden stage used by this loader.
  - id: java-obfuscated-jar-memory-instantiation
    desc: Obfuscated Java JAR memory instantiation
    # Pairs with obfuscated-in-memory-jar-loader; avoid double count.
    crit: suspicious
    conf: 0.98
    all:
      - id: objectives/command-and-control/backdoor/loader/classloader::in-memory-jar-entry-classload
      - id: metadata/file/encoded::multiple-hex-class-literals
      - id: micro-behaviors/data/source/dynamic/reflect::java-loadclass
      - id: micro-behaviors/data/source/dynamic/reflect::java-newinstance
