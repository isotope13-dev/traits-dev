# Hostile composite linking AES/cipher decryption with immediate
# dynamic execution of the decrypted output. This is the canonical
# JavaScript "encrypted payload loader" tradecraft: ship a ciphertext
# in a constant, AES-decrypt it at runtime, then feed it to a
# `new Function(require, decoded)(require)` invocation so the payload
# runs with full Node `require()` capability — even though the package
# itself contains no visible install-hook.
defaults:
  crit: hostile
  platforms: [unix, windows]
  for: [javascript, typescript]
  attack: T1027.013
  mbc: B0024
composite_rules:
  - id: encrypted-local-stage-detached-launch
    desc: Decrypts bundled data, writes a restricted stage, and launches it detached
    conf: 0.98
    attack: T1027.013, T1059.007, T1195.002
    mbc: B0024, F0011
    near_bytes: 2048
    all:
      - id: micro-behaviors/crypto/symmetric/aes/runtime-library::createDecipheriv
      - id: micro-behaviors/data/decode/multiple-encoding::multiple-node-hex-base64-decodes
      - id: micro-behaviors/fs/write/file/full::node-write-file-sync
      - id: micro-behaviors/fs/chmod/modify::node-create-restricted-mode
      - id: micro-behaviors/process/create/spawn::detached-ignored-unref-spawn

  - id: decrypt-then-new-function-require
    desc: Decrypts a payload then evals via new Function
    conf: 0.97
    near_lines: 80
    all:
      - id: micro-behaviors/crypto/symmetric/aes/runtime-library::createDecipheriv
      - id: objectives/anti-static/obfuscation/eval/require::function-constructor-require-arg
    unless:
      - id: metadata/package/testing/harness/runtime/
      - id: metadata/build/bundler/asset::js-large-module-bundle
  # A multi-megabyte ciphertext literal keeps tree-sitter from emitting
  # createDecipheriv as a symbol, so the rule above never starts. The
  # same call and the new Function(require)(require) site are still
  # visible as text, a handful of lines apart around that one literal.
  - id: aes-gcm-text-then-function-require
    desc: Decrypts AES-GCM then runs new Function
    conf: 0.97
    near_lines: 80
    all:
      - id: objectives/anti-static/obfuscation/multi-layer::aes-gcm-decrypt-in-decoded-layer
      - id: micro-behaviors/process/interpreter/eval/compile::js-function-constructor-require-invocation
    unless:
      - id: metadata/package/testing/harness/runtime/
      - id: metadata/build/bundler/asset::js-large-module-bundle
  # A multi-megabyte ciphertext literal on globalThis keeps createDecipheriv
  # and _compile out of symbol facts, but the assignment, the globalThis
  # decrypt lookup, and the computed Module invocation still co-locate in text.
  - id: global-ciphertext-module-compile-loader
    desc: Decrypts globalThis ciphertext into Module._compile
    conf: 0.98
    attack: T1027.013,T1059.007,T1195.002
    all:
      - id: metadata/file/encoded::globalthis-string-ciphertext-assignment
      - id: micro-behaviors/data/source/property/computed::globalthis-computed-property-call
      - id: micro-behaviors/process/interpreter/eval/compile::node-new-module-computed-invocation
    unless:
      - id: metadata/package/testing/harness/runtime/
  - id: package-level-decrypt-eval-loader
    desc: Package decrypts and evals an embedded payload
    conf: 0.98
    attack: T1027.013, T1059.007
    for: [javascript, typescript, package.json, npm, tar]
    scope: archive
    all:
      - id: objectives/anti-static/obfuscation/payload/encrypted::hardcoded-key-with-large-blob
      - id: objectives/anti-static/obfuscation/eval/require::function-constructor-require-arg
    any:
      - id: micro-behaviors/crypto/symmetric/aes/runtime-library::createDecipheriv
      - id: micro-behaviors/crypto/library/provider::node-memory-hard-kdf
    unless:
      - id: metadata/package/testing/harness/runtime/
  - id: encrypted-remote-function-loader
    desc: Decrypts a remote endpoint then executes fetched code
    conf: 0.98
    attack: T1027.013, T1105, T1059.007
    near_lines: 40
    all:
      - id: micro-behaviors/crypto/symmetric/aes/runtime-library::createDecipheriv
      - id: micro-behaviors/communications/http/request/client::node-https-get-dynamic
      - id: objectives/anti-static/obfuscation/eval/require::function-constructor-require-arg
      - id: objectives/command-and-control/dropper/delivery/fetch-eval::function-result-invoked-require
    unless:
      - id: metadata/package/testing/harness/runtime/
      - id: metadata/build/bundler/asset::js-large-module-bundle
  - id: zero-iv-aes-cbc-detached-launch
    desc: Zero-IV AES-CBC decrypt then detached launch
    conf: 0.97
    attack: T1027.013,T1105,T1059.007
    all:
      - id: js-aes256-cbc-zero-iv
      - id: micro-behaviors/fs/write/file/full::node-write-file-sync
      - id: micro-behaviors/process/create/spawn::detached-true
  # Bracket calls hide createDecipheriv and detached:true. The zero
  # 16-byte buffer is still passed into a computed crypto call, and
  # the fallback launch detaches with a bracket unref.
  - id: bracket-zero-iv-unref-launch
    desc: Bracket zero-IV decrypt then unref launch
    conf: 0.96
    attack: T1027.013,T1105,T1059.007
    all:
      - id: js-bracket-zero-iv-crypto
      - id: js-bracket-unref-call
traits:
  - id: js-aes256-cbc-zero-iv
    desc: AES-256-CBC decipher uses a zero IV
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: 'Buffer\.alloc\(\s*16\s*,\s*0\s*\)[\s\S]{0,160}createDecipheriv\(\s*["'']aes-256-cbc["'']'
  - id: js-bracket-zero-iv-crypto
    desc: Zero-IV buffer feeds computed crypto
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: "Buffer\\[['\"]alloc['\"]\\]\\(0x10,0x0\\)[\\s\\S]{0,160}crypto\\["
  - id: js-bracket-unref-call
    desc: Bracket unref detaches a handle
    crit: notable
    conf: 0.93
    if:
      type: text
      regex: "\\[['\"]unref['\"]\\]\\(\\)"
