defaults:
  for: [elf]
  platforms: [linux]

traits:
  - id: hidden-temp-stage-file-trio
    desc: Three compact hidden temp stage paths
    crit: suspicious
    conf: 0.96
    attack: T1027,T1564.001
    if:
      type: raw
      regex: '(?s)(/tmp/\.\w{1,4}\x00.{0,32}){3}'

composite_rules:
  - id: hidden-temp-stage-made-executable
    desc: Hidden temp stage is made executable
    crit: hostile
    conf: 0.99
    attack: T1027,T1105,T1059.004
    all:
      - id: hidden-temp-stage-file-trio
      - id: micro-behaviors/fs/chmod/modify::static-chmod-symbol-text
      - id: micro-behaviors/process/create/execv::static-execl-symbol-text
      - id: metadata/binary/linking/static::static-linked
