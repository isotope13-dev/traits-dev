# Source-level form of the same loader technique described in the BumbleBee
# report: an RC4-protected configuration/payload, environment gating, and a
# trusted Windows host used to invoke a DLL export. Keep this separate from
# the PE-only section rule so source implementations in other languages remain
# visible without pretending they have PE section facts.
defaults:
  platforms: [windows]
  for: [python, csharp]
  attack: T1027,T1140,T1218.011,T1497.001
  mbc: B0030

composite_rules:
  - id: python-rc4-rundll32-vm-loader
    desc: Python loader gates VM checks before RC4 and Rundll32
    crit: hostile
    conf: 0.98
    for: [python]
    all:
      - id: micro-behaviors/crypto/symmetric/stream::python-rc4-like-stream-cipher
      - id: micro-behaviors/process/create/shell/script-host::rundll32-exec-with-args
      - id: objectives/anti-analysis/sandbox-detect/script::python-anti-analysis-fingerprint-exit

  - id: dotnet-rc4-rundll32-vm-loader
    desc: .NET loader gates VM checks before RC4 and Rundll32
    crit: hostile
    conf: 0.98
    for: [csharp]
    all:
      - id: micro-behaviors/crypto/symmetric/stream::source-rc4-managed-implementation
      - id: micro-behaviors/process/create/managed::rundll32-start
      - id: micro-behaviors/process/create/managed::rundll32-export-argument
      - id: objectives/anti-analysis/emulator-detect/hardware::dotnet-emulator-detection-suite
