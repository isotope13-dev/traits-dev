# Encrypted 7z/ZIP used as a one-file payload stage. A vendor installer is a
# tree; a mail-attachment dropper is a passworded archive whose only member
# is the thing the victim is meant to run, or a nested container that wraps
# it. Encryption is what keeps the inner bytes off the wire inspection path.
defaults:
  platforms: [unix, windows]
  for: [7z, zip]
  attack: T1027.002,T1204.002
  mbc: B0024

composite_rules:
  # One encrypted member, and it is a Windows executable. The same shape as
  # the hostile single-exe cabinet lure: nothing else is in the archive
  # because nothing else needs to be. A password-protected SDK zip has many
  # members; a password-protected remittance.exe has one.
  - id: encrypted-archive-sole-windows-executable
    desc: Encrypted archive with a lone Windows executable
    crit: hostile
    conf: 0.95
    all:
      - id: micro-behaviors/data/archive/member::archive-encrypted-member
      - id: metadata/file/archive::archive-sole-member
      - id: metadata/build/archive::archive-windows-executable-entry

  - id: encrypted-archive-quote-lure-executable
    desc: Encrypted archive stages a quote-order executable
    crit: hostile
    conf: 0.95
    all:
      - id: micro-behaviors/data/archive/member::archive-encrypted-member
      - id: metadata/build/archive::archive-quote-lure-exe-member

  - id: encrypted-archive-business-lure-executable
    desc: Encrypted archive stages a business-lure executable
    crit: hostile
    conf: 0.95
    all:
      - id: micro-behaviors/data/archive/member::archive-encrypted-member
      - id: metadata/build/archive::archive-business-lure-exe-member

  # Disk image inside an archive is a MotW-bypass stage. Encryption on the
  # outer archive is optional: some waves skip it and rely on the image
  # wrapping the PE. The image member is the technique.
  - id: archive-disk-image-executable-stage
    desc: Archive stages a disk image with an executable
    crit: hostile
    conf: 0.94
    attack: T1027.002,T1553.005,T1204.002
    for: [7z, zip, iso, data, pe]
    scope: outer
    all:
      - id: metadata/file/archive::archive-disk-image-member
    any:
      - id: metadata/build/archive::archive-windows-executable-entry
      - id: metadata/file/format/iso/structure::contains-executable-member
      - id: metadata/file/archive::archive-contains-executable-member

  - id: encrypted-archive-disk-image-stage
    desc: Encrypted archive stages a disk image payload
    crit: hostile
    conf: 0.95
    all:
      - id: micro-behaviors/data/archive/member::archive-encrypted-member
      - id: metadata/file/archive::archive-disk-image-member

  - id: encrypted-archive-nested-zip-stage
    desc: Encrypted archive nests a ZIP payload
    crit: hostile
    conf: 0.93
    all:
      - id: micro-behaviors/data/archive/member::archive-encrypted-member
      - id: metadata/file/archive::archive-sole-member
      - id: metadata/file/archive::archive-nested-zip-member

  - id: encrypted-archive-nested-rar-stage
    desc: Encrypted archive nests a RAR payload
    crit: hostile
    conf: 0.94
    all:
      - id: micro-behaviors/data/archive/member::archive-encrypted-member
      - id: metadata/file/archive::archive-sole-member
      - id: metadata/file/archive::archive-nested-rar-member

  - id: encrypted-archive-password-labeled-nested
    desc: Encrypted archive nests a password-labeled member
    crit: hostile
    conf: 0.95
    all:
      - id: micro-behaviors/data/archive/member::archive-encrypted-member
      - id: metadata/file/archive::archive-password-labeled-member

  - id: encrypted-archive-virus-named-member
    desc: Encrypted archive conceals a virus-named member
    crit: hostile
    conf: 0.94
    all:
      - id: micro-behaviors/data/archive/member::archive-encrypted-member
      - id: metadata/file/archive::archive-virus-named-member

  - id: encrypted-archive-full-setup-stage
    desc: Encrypted archive stages a Full Setup tree
    crit: hostile
    conf: 0.94
    all:
      - id: micro-behaviors/data/archive/member::archive-encrypted-member
      - id: metadata/file/archive::archive-full-setup-dir
      - id: metadata/build/archive::archive-windows-library-entry

  - id: archive-order-lure-disk-image
    desc: Archive stages an order-themed disk image
    crit: hostile
    conf: 0.94
    all:
      - id: metadata/file/archive::archive-order-disk-image-member
      - id: micro-behaviors/data/archive/member::archive-encrypted-member

  # Both header-locked shapes below carry a size floor. A 7zAES container that
  # is only a few hundred bytes is signature + encoded header + one or two AES
  # blocks: there is no staged payload for the locked header to conceal, which
  # is exactly what archive-library encryption fixtures look like. A real stage
  # has to hold the thing the victim runs.
  - id: encrypted-header-only-7z-stage
    desc: Header-encrypted 7z conceals its payload
    crit: hostile
    conf: 0.95
    size_min: 4096
    all:
      - id: micro-behaviors/data/archive/7z::7z-header-locked
      - id: micro-behaviors/data/archive/7z::7z-single-aes-coder-folder
      - id: metadata/file/archive::archive-parse-error

  - id: encrypted-header-locked-7zaes-stage
    desc: Header-locked 7zAES conceals its payload
    crit: hostile
    conf: 0.94
    size_min: 4096
    all:
      - id: micro-behaviors/data/archive/7z::7z-header-locked
      - id: micro-behaviors/data/archive/7z::7z-aes-without-members
      - id: metadata/file/archive::archive-parse-error

  - id: encrypted-archive-homoglyph-exe
    desc: Encrypted archive has a homoglyph executable
    crit: hostile
    conf: 0.95
    all:
      - id: micro-behaviors/data/archive/member::archive-encrypted-member
      - id: metadata/build/archive::archive-nonascii-exe-member

  - id: encrypted-archive-lnx-payload
    desc: Encrypted archive hides a .lnx member
    crit: hostile
    conf: 0.93
    all:
      - id: micro-behaviors/data/archive/member::archive-encrypted-member
      - id: metadata/file/archive::archive-lnx-member

  - id: archive-order-image-unsigned-pe
    desc: Order disk image carries an unsigned PE
    crit: hostile
    conf: 0.94
    attack: T1027.002,T1553.005,T1036
    for: [7z, zip, iso, data, pe]
    scope: outer
    all:
      - id: metadata/file/archive::archive-order-disk-image-member
      - id: metadata/signed/trust-level::unsigned-missing-signature-record

  - id: encrypted-archive-setup-stage
    desc: Encrypted archive stages a Setup.exe
    crit: hostile
