# Encrypted archive used as a payload stage for a Windows executable.
defaults:
  platforms: [unix, windows]
  for: [7z]
  attack: T1027.002,T1204.002
  mbc: B0024

composite_rules:
  - id: aes-encrypted-7z-exe-stage
    desc: 7zAES-encrypted archive staging a Windows executable
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/data/archive/7z::7z-aes-codec
      - id: metadata/file/metrics::near-maximum-entropy-file
      - id: metadata/build/archive::archive-windows-executable-entry
      - id: objectives/anti-static/pack/archive::high-entropy-7z-executable-payload
