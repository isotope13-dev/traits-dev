defaults:
  platforms: [windows, unix]
  for:
    - python
  mbc: B0024
  attack: T1027.002
traits:
  - id: hardcoded-aes-key
    desc: Hardcoded AES key in base64
    crit: suspicious
    conf: 0.85
    if:
      type: string_literal
      regex: b64decode\(['"][A-Za-z0-9+/]{43}=['"]\)
  - id: hardcoded-aes-iv
    desc: Hardcoded AES IV in base64
    crit: suspicious
    conf: 0.85
    if:
      type: string_literal
      regex: b64decode\(['"][A-Za-z0-9+/]{20,24}[=]{0,2}['"]\)
  - id: aes-file-extension
    desc: AES encrypted file reference
    crit: suspicious
    conf: 0.8
    if:
      type: string_literal
      regex: \\.aes['"]
  - id: decrypt-function-def
    desc: Decrypt function definition
    crit: suspicious
    conf: 0.75
    if:
      type: text
      exact: 'decrypt'
composite_rules:
  - id: encrypted-loader
    desc: Decrypts and loads code from encrypted file
    crit: suspicious
    conf: 0.95
    all:
      - id: micro-behaviors/crypto/symmetric/aes/
    any:
      - id: micro-behaviors/process/interpreter/python::zipimporter-module-load
      - id: micro-behaviors/data/decode/base64::b64decode-string
      - id: micro-behaviors/fs/temp/pyinstaller::pyinstaller-meipass
      - id: hardcoded-aes-key
      - id: aes-file-extension
    needs: 2
  - id: embedded-zlib-base64-exec-loader
    desc: Embedded Python payload decoded with base64 and zlib then exec'd
    crit: hostile
    conf: 0.97
    all:
      - id: micro-behaviors/process/interpreter/python::exec-builtin
      - id: micro-behaviors/data/compress/library::zlib-decompress-dynamic
      - id: micro-behaviors/data/decode/base64::b64decode-string
      - id: micro-behaviors/data/encode/payload::large-base64-string-literals
    any:
      - id: micro-behaviors/process/interpreter/python::dunder-import-call
      - id: objectives/anti-static/obfuscation/reflection/class::python-import-chain
  - id: embedded-python-bytecode-dropper
    desc: Embedded Python bytecode loader writes a staged pyc payload
    crit: hostile
    conf: 0.98
    attack: T1027,T1140,T1059.006
    all:
      - id: objectives/anti-static/obfuscation/multi-layer::python-marshal-bytecode-loader
      - id: micro-behaviors/fs/write/file/bytecode::python-pyc-output-write
    near_bytes: 4096
  # Packaged stub: gate on IsDebuggerPresent, AES-CTR decrypt, write tmp_*.exe
  # under TEMP, then launch via `start ""`. Seen in PyInstaller Salat-style loaders.
  - id: aes-ctr-antidebug-temp-exe-dropper
    desc: Anti-debug AES-CTR decrypt drops TEMP executable
    crit: hostile
    conf: 0.99
    attack: T1622,T1140,T1105,T1059
    mbc: B0032
    for: [python, pyc]
    platforms: [windows]
    all:
      - id: micro-behaviors/process/debug/detect::is-debugger-present-python-text
      - id: micro-behaviors/crypto/library/keyword::aead-mode-keyword--mode-ctr
      - id: micro-behaviors/crypto/symmetric/aes/library::pycrypto-cipher-module-ref
      - id: micro-behaviors/fs/temp/directory::tmp-prefix-token
      - id: micro-behaviors/os/env/vars/access::temp-var
      - id: micro-behaviors/process/create/system::win-start-empty-title
