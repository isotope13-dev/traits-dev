# RC4 Payload Decryption Pattern
# Loader reads encrypted file from disk, decrypts with RC4, executes in memory.
# SloppyLemming: mscorsvc.dll reads system32.dll, RC4 decrypts via SystemFunction033.
# Generic pattern applicable to many loaders.
defaults:
  crit: hostile
  for: [pe, dll]
  platforms: [windows]
  mbc: B0023
  attack: T1140
composite_rules:
  - id: native-rc4-rwx-vm-loader
    desc: Native loader combines RC4, RWX payload, and VM checks
    conf: 0.98
    attack: T1027,T1140,T1497.001,T1620
    all:
      - id: micro-behaviors/crypto/symmetric/stream/rc4::rc4-bytecode
      - id: metadata/hardening/memory::wx-section
      - id: objectives/anti-analysis/vm-detect/
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/framework/

  - id: systemfunction033-payload-loader
    desc: SystemFunction033 RC4 payload decryption and execution
    conf: 0.95
    all:
      - id: micro-behaviors/crypto/symmetric/stream/rc4::systemfunction033-symbol
      - id: "micro-behaviors/mem/combined::memory-management-api-evidence"
    any:
      - id: objectives/anti-static/obfuscation/imports/api-hashing::api-hash-resolution
      - id: objectives/anti-static/obfuscation/imports/api-hashing::export-walk-with-hash-arithmetic
    unless:
      - id: metadata/binary/vendor/

