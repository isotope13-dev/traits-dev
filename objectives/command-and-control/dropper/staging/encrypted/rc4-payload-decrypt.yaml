# RC4 Payload Decryption Pattern
# Loader reads encrypted file from disk, decrypts with RC4, executes in memory.
# SloppyLemming: mscorsvc.dll reads system32.dll, RC4 decrypts via SystemFunction033.
# Generic pattern applicable to many loaders.
defaults:
  crit: hostile
  for: [pe, dll]
  platforms: [windows]
  mbc: B0023
  attack: T1140
composite_rules:
  - id: native-rc4-rwx-vm-loader
    desc: Native loader combines RC4, RWX payload, and VM checks
    conf: 0.98
    attack: T1027,T1140,T1497.001,T1620
    all:
      - id: micro-behaviors/crypto/symmetric/stream/rc4::rc4-bytecode
      - id: metadata/hardening/memory::wx-section
      - id: objectives/anti-analysis/vm-detect/
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/framework/

  - id: systemfunction033-payload-loader
    desc: SystemFunction033 RC4 payload decryption and execution
    conf: 0.95
    all:
      - id: micro-behaviors/crypto/symmetric/stream/rc4::systemfunction033-symbol
      - type: trait_set
        ids:
          - "micro-behaviors/mem/alloc/bios::bios-mem-size-reduce"
          - "micro-behaviors/mem/alloc/bios::bios-mem-steal-asm"
          - "micro-behaviors/mem/alloc/executable::executable-allocation-indicator"
          - "micro-behaviors/mem/alloc/executable::go-abi-rwx-call-x64-reordered"
          - "micro-behaviors/mem/alloc/executable::go-abi-rwx-reserve-commit-call-x64"
          - "micro-behaviors/mem/alloc/executable::go-abi-rwx-reserve-commit-call-x64-any"
          - "micro-behaviors/mem/alloc/executable::go-abi-rwx-reserve-commit-call-x64-no-slice"
          - "micro-behaviors/mem/alloc/executable::javascript-virtualalloc-rwx-call"
          - "micro-behaviors/mem/alloc/executable::jit-executable-memory"
          - "micro-behaviors/mem/alloc/executable::jit-runtime-reference"
          - "micro-behaviors/mem/alloc/executable::kernel-pool-alloc"
          - "micro-behaviors/mem/alloc/executable::mem-commit-java-ref"
          - "micro-behaviors/mem/alloc/executable::non-runtime-executable-allocation"
          - "micro-behaviors/mem/alloc/executable::nonpaged-pool"
          - "micro-behaviors/mem/alloc/executable::page-execute-read-arg-x64"
          - "micro-behaviors/mem/alloc/executable::page-execute-read-commit-source"
          - "micro-behaviors/mem/alloc/executable::page-execute-read-push"
          - "micro-behaviors/mem/alloc/executable::page-execute-readwrite"
          - "micro-behaviors/mem/alloc/executable::page-execute-readwrite-arg-x64"
          - "micro-behaviors/mem/alloc/executable::page-execute-readwrite-java-ref"
          - "micro-behaviors/mem/alloc/executable::page-execute-readwrite-push"
          - "micro-behaviors/mem/alloc/executable::page-readwrite-arg-x64"
          - "micro-behaviors/mem/alloc/executable::page-readwrite-push"
          - "micro-behaviors/mem/alloc/executable::powershell-fragmented-virtualalloc"
          - "micro-behaviors/mem/alloc/executable::powershell-memory-delegate-invoke"
          - "micro-behaviors/mem/alloc/executable::powershell-rwx-protection-flag"
