defaults:
  platforms: [windows]
  for: [pe, dll, csharp]
  attack: T1027
  mbc: C0025
traits:
  - id: dotnet-decryptdata-method
    desc: .NET DecryptData method
    crit: notable
    conf: 0.9
    if:
      type: text
      word: DecryptData
  - id: dotnet-injection-persistence-token
    desc: Injection persistence config token
    crit: notable
    conf: 0.94
    if:
      type: text
      substr: "%InjectionPersist%"
  - id: dotnet-startup-persistence-token
    desc: Startup persistence config token
    crit: notable
    conf: 0.9
    if:
      type: text
      substr: "%StartupPersist%"
  - id: dotnet-loader-host-process-list
    desc: .NET host process target list
    crit: notable
    conf: 0.92
    if:
      type: text
      regex: 'RegAsm\.exe|InstallUtil\.exe|mscorsvw\.exe|AddInProcess32\.exe'
  - id: dotnet-msbuild-host-token
    desc: MSBuild host process token
    crit: notable
    conf: 0.8
    if:
      type: text
      word: MSBuild.exe
  - id: dotnet-aspnet-host-process-list
    desc: ASP.NET host process list
    crit: notable
    conf: 0.86
    if:
      type: text
      regex: 'aspnet_(compiler|regiis|state|wp)\.exe'
  - id: dotnet-complus-host-env
    desc: COMPLUS host environment tokens
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: 'COMPLUS_(INSTALLROOT|VERSION)'
composite_rules:
  - id: dotnet-resource-extract-command-stager
    for: [pe]
    desc: .NET decrypts a resource, extracts an archive, and starts cmd.exe
    crit: hostile
    conf: 0.98
    attack: "T1027.009,T1140,T1059.001"
    mbc: B0009.014
    all:
      - id: metadata/binary/framework::dotnet-assembly
      - id: metadata/binary/resource/size::dotnet-large-high-entropy-managed-resource
      - id: micro-behaviors/data/embedded/payload/resource::dotnet-managed-resource-access
      - id: micro-behaviors/crypto/symmetric/decrypt::dotnet-create-decryptor
      - id: micro-behaviors/data/archive/extract/zip::extract-to-directory
      - id: micro-behaviors/process/create/exec::cmd-exe-reference
    any:
      - id: micro-behaviors/process/interpreter/reflection/runtime::activator
      - id: micro-behaviors/process/create/spawn::process-token-dotnet
    unless:
      - id: metadata/signed/platform/
      - id: micro-behaviors/data/embedded/payload/resource::costura-bundle-marker
  - id: dotnet-injection-persistent-loader-config
    for: [pe]
    desc: Persistent .NET injection loader config
    crit: hostile
    conf: 0.98
    attack: T1055
    all:
      - id: objectives/command-and-control/dropper/module-load::dotnet-encrypted-reflection-loader
      - id: dotnet-injection-persistence-token
      - id: dotnet-loader-host-process-list
    any:
      - id: dotnet-startup-persistence-token
      - id: dotnet-msbuild-host-token
      - id: dotnet-aspnet-host-process-list
      - id: dotnet-complus-host-env
    needs: 2
    unless:
      - id: metadata/signed/platform/
  - id: clr-metadata-stripped-overlay-dropper
    for: [pe]
    desc: Metadata-stripped CLR stub decrypts an encrypted overlay payload
    crit: hostile
    conf: 0.97
    attack: T1027.009,T1140,T1620
    mbc: B0030,B0040
    all:
      - id: metadata/binary/framework::clr-runtime-header
      - id: metadata/binary/section/header::pe-il-only-without-clr-metadata
      - id: metadata/signed/trust-level::unsigned-missing-signature-record
      - id: metadata/binary/layout/overlay::overlay-dominates-80pct
      - id: objectives/anti-static/obfuscation/binary-metrics/shape::high-entropy-overlay
      - id: micro-behaviors/fs/read/file/full::dotnet-readallbytes-token
      - id: micro-behaviors/crypto/symmetric/decrypt::dotnet-create-decryptor
    unless:
      - id: metadata/binary/framework::dotnet-metadata
      - id: metadata/signed/platform/
      - id: metadata/binary/installer/family/

  - id: dotnet-encrypted-resource-hidden-process-stager
    for: [pe]
    desc: Unsigned .NET resource stager prepares a hidden child-process launch
    crit: hostile
    conf: 0.98
    attack: T1027.009,T1140,T1059
    mbc: B0009.014
    # Keep the hidden process launch bound to the resource/decrypt/write chain.
    # Large application frameworks commonly contain all of these capabilities
    # in separate subsystems without staging a child-process payload.
    near_bytes: 8192
    all:
      - id: metadata/binary/framework::dotnet-assembly
      - id: metadata/signed/trust-level::unsigned-missing-signature-record
      - id: metadata/binary/resource/size::dotnet-large-high-entropy-managed-resource
      - id: micro-behaviors/data/embedded/payload/resource::dotnet-managed-resource-access
      - id: micro-behaviors/crypto/symmetric/decrypt::dotnet-create-decryptor
      - id: micro-behaviors/fs/write/file/full::dotnet-writeallbytes-token
      - id: micro-behaviors/process/create/spawn::process-token-dotnet
      - id: micro-behaviors/process/create/hidden::dotnet-create-no-window
    unless:
      - id: metadata/signed/platform/
      - id: micro-behaviors/data/embedded/payload/resource::costura-bundle-marker
      - id: well-known/app/system/stresstimulus::logicnp-cryptolicensing
