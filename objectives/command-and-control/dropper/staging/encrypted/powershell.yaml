defaults:
  # Batch droppers often embed the AES stage as a PowerShell here-string /
  # labeled region; keep these atoms on both so invoice/Rechnung-style
  # multi-stage bats are not invisible to encrypted-stage composites.
  for: [powershell, batch]
  platforms: [windows]
  attack: T1027
  mbc: C0025
traits:
- id: rijndael-managed-create
  desc: RijndaelManaged decryptor object
  crit: suspicious
  conf: 0.92
  if:
    type: text
    substr: System.Security.Cryptography.RijndaelManaged
- id: multiple-base64-literals
  desc: Multiple embedded base64 literals
  crit: component
  conf: 0.86
  count_min: 3
  if:
    type: string_literal
    regex: '^[A-Za-z0-9+/]{20,}={0,2}$'
- id: decrypt-aes-function
  desc: Decrypt-AES helper function
  crit: suspicious
  conf: 0.86
  if:
    type: text
    regex: '(?i)function\s+Decrypt-AES\b'
- id: decrypt-aes-chunk-accumulator
  desc: Repeated AES chunk accumulation
  crit: suspicious
  conf: 0.94
  count_min: 8
  if:
    type: text
    substr: Decrypt-AES
- id: iex-finalscript
  desc: "Invoke-Expression on reconstructed final"
  crit: suspicious
  conf: 0.93
  if:
    type: text
    # Match reconstructed stage vars ($finalScript, $payload, …). Do not match
    # bare $cmd — that is ordinary automation Invoke-Expression.
    regex: 'Invoke-Expression\s+\$(final\w*|payload\w*|decrypted\w*)'
- id: encoded-powershell-bxor
  desc: Encoded PowerShell XOR operation
  crit: suspicious
  conf: 0.9
  for: [powershell, javascript, vbs, html, batch, lnk]
  if:
    type: encoded
    encoding: base64
    regex: '(?i)[\$\w\]\)]\s*-bxor\s*[\$\w\(\[]'
- id: encoded-powershell-modulo-rotation
  desc: Encoded PowerShell modulo rotation update
  crit: suspicious
  conf: 0.86
  for: [powershell, vbs, html, batch, lnk]
  if:
    type: encoded
    encoding: base64
    regex: '(?i)rotation\w*.{0,80}%\s*\d+'
composite_rules:
# micro-behaviors/data/decode/base64::powershell-base64-symmetric-decrypt is
# `for: [powershell]` only, so it can never fire on a batch leaf even though
# its own legs (dotnet-frombase64string-text, dotnet-create-decryptor) are
# both batch-compatible. Mirror it here for batch ONLY (not the union --
# overlapping the original's powershell scope would make the pair fire twice
# from identical evidence) so ps-aes-chunked-stage-loader below can reach the
# invoice/Rechnung-style multi-stage .bat this file's header comment
# describes, via an any: alternation with the original.
- id: base64-symmetric-decrypt-stage-batch
  desc: Batch Base64-decodes and symmetrically decrypts
  crit: suspicious
  conf: 0.95
  for: [batch]
  all:
  - id: micro-behaviors/data/decode/base64::dotnet-frombase64string-text
  - id: micro-behaviors/crypto/symmetric/decrypt::dotnet-create-decryptor
  near_lines: 40
  unless:
  - id: well-known/app/infrastructure/watchmaker::package-context
- id: decrypted-string-join
  desc: Joins chunks after PowerShell decryption
  crit: suspicious
  conf: 0.9
  all:
  - id: micro-behaviors/data/string/concat::powershell-empty-delimiter-join
  any:
  - id: decrypt-aes-function
  - id: micro-behaviors/crypto/symmetric/aes/library::crypto-stream-read
  - id: micro-behaviors/crypto/symmetric/decrypt::dotnet-create-decryptor
  - id: micro-behaviors/data/decode/base64::dotnet-frombase64string-text
  near_bytes: 1000
- id: ps-base32-aes-embedded-stage
  desc: Base32 and AES embedded PowerShell stage
  crit: suspicious
  conf: 0.96
  for: [powershell]
  all:
  - id: micro-behaviors/data/decode/base32::ps-custom-base32-decoder
  - id: micro-behaviors/crypto/symmetric/aes/library::dotnet-aes-create
  - id: micro-behaviors/crypto/symmetric/decrypt::dotnet-create-decryptor
  any:
  - id: metadata/binary/layout/embedded::large-embedded-b64-blob
  - id: multiple-base64-literals

# BAT→PS stagers that AES-CBC decrypt a hex blob, WriteAllBytes a temp
# payload, and start it Hidden. Catches MulDrop / invoice-lure families that
# keep the decryptor in an embedded PowerShell region of a .bat.
- id: batch-aes-hex-decrypt-dropper
  desc: Batch AES-decrypts hex blob and drops it
  crit: hostile
  conf: 0.98
  attack: T1027,T1059.001,T1059.003
  mbc: C0025,B0030
  for: [batch]
  all:
  - id: micro-behaviors/crypto/symmetric/aes/library::dotnet-aes-create
  - id: micro-behaviors/crypto/symmetric/decrypt::dotnet-create-decryptor
  - id: micro-behaviors/fs/write/file/full::write-all-bytes
  - id: micro-behaviors/process/create/hidden::windowstyle-hidden

- id: batch-xor-decrypt-dropper
  desc: Batch XOR-decrypts encoded payload and drops executable
  crit: hostile
  conf: 0.98
  attack: T1027.005,T1059.001,T1059.003
  mbc: C0025,B0030
  for: [batch]
  all:
  - id: encoded-powershell-bxor
  - id: micro-behaviors/fs/write/file/full::write-all-bytes
  - id: micro-behaviors/process/create/hidden::powershell-hidden-window

- id: batch-aes-decrypt-staged-payload
  desc: Batch stages encrypted payload and executes AES-decrypted code
  crit: hostile
  conf: 0.98
  attack: T1027,T1059.001,T1059.003
  mbc: C0025,B0030
  for: [batch]
  all:
  - id: base64-symmetric-decrypt-stage-batch
  - id: micro-behaviors/crypto/cipher::dotnet-transform-final-block
  any:
  - id: micro-behaviors/fs/read/file/full::powershell-file-readallbytes
  - id: micro-behaviors/process/create/hidden::powershell-windowstyle-hidden


