# MinGW-compiled dropper with encrypted payload, TLS callbacks,
# and API hashing. These loaders decrypt embedded payloads at runtime
# via RC4 or similar XOR loops, then execute via process hollowing
# or reflective loading. The combination of encryption + anti-analysis
# + injection in a cross-compiled PE is a strong dropper signal.
defaults:
  platforms: [windows]
  for: [pe, dll]
  attack: T1027.007, T1055.012
  mbc: E1105

traits:
  - id: hashcat-archive-exe-path
    desc: Hashcat archive executable path
    crit: notable
    conf: 0.98
    if:
      type: path
      regex: '(?i)hashcat[^\\/]*[\\/]hashcat\.exe$'

composite_rules:
  - id: cross-compiled-encrypted-loader
    desc: Cross-compiled loader with payload encryption and API hashing
    crit: suspicious
    conf: 0.92
    size_min: 65536
    all:
      - id: metadata/lang/compiler/native::mingw-built-pe
      - id: micro-behaviors/crypto/symmetric/xor/loop::x86-byte-xor-terminator-loop
      - id: objectives/anti-static/obfuscation/imports/api-hashing::pe-api-hashing-indicator-single
    any:
      - id: metadata/binary/layout/tls::pe-multiple-tls-callbacks
      - id: micro-behaviors/process/create/spawn::create-process-a
      - id: micro-behaviors/process/info/thread::get-thread-context-import
    needs: 1
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/symbols/count::many-exports
      - id: well-known/lib/media/ffmpeg/
      - id: well-known/lib/media/videolan::vlc-plugin-dll-path
      - id: well-known/lib/media/videolan::vlc-known-plugin-dll-name
