defaults:
  platforms: [linux]
  for: [elf]
  attack: T1027.009,T1059
  mbc: B0032,E1059

traits:
  - id: staged-payload-name
    desc: Embedded encrypted payload filename
    crit: component
    conf: 0.98
    if:
      type: text
      exact: payload.enc

  - id: go-encrypt-payload-function
    desc: Go code defines a payload-encryption function
    crit: notable
    conf: 0.94
    attack: T1027.013
    if:
      type: text
      substr: .EncryptPayload

  - id: go-payload-download-handler
    desc: Go code defines an HTTP payload-download handler
    crit: notable
    conf: 0.94
    attack: T1105
    if:
      type: text
      substr: .PayloadDownloadHandler

composite_rules:
  - id: go-crypter-encrypted-payload-staging
    desc: Go crypter service accepts, encrypts, and serves staged payloads
    crit: hostile
    conf: 0.99
    attack: T1027.013,T1105
    all:
      - id: go-encrypt-payload-function
      - id: go-payload-download-handler
      - id: objectives/command-and-control/dropper/builder::go-staged-upload-handler
      - id: objectives/command-and-control/dropper/builder::go-build-staged-stub
      - id: micro-behaviors/crypto/symmetric/aes/library::go-cbc-encrypter-string
      - id: micro-behaviors/communications/http/server/listener::listenandservetls-call

  - id: go-encrypted-embedded-payload
    desc: Go binary embeds encrypted payload
    crit: suspicious
    conf: 0.95
    all:
      - id: staged-payload-name
      - id: metadata/binary/section/metrics::go-large-noptrdata
    any:
      - id: micro-behaviors/crypto/symmetric/aes/library::go-newgcm-error-string
      - id: micro-behaviors/crypto/symmetric/aes/library::go-new-cipher-string

  - id: go-gcm-temp-payload-launcher
    desc: Go temp-file payload launcher
    crit: hostile
    conf: 0.98
    all:
      - id: go-encrypted-embedded-payload
      - id: micro-behaviors/process/create/system::go-os-exec-pclntab
    any:
      - id: micro-behaviors/os/env/vars/access::tmpdir-var
      - id: micro-behaviors/fs/temp/mktemp::create-temp-runtime-string
      - id: micro-behaviors/fs/proc/info/path::process-self-exe-path
    needs: 2
