defaults:
  platforms: [android]
  for: [android_apk]
  mbc: B0024
  attack: T1027.002
traits: []
composite_rules:
  - id: apk-encrypted-core-dropper
    desc: APK encrypts core runtime and stages payload blobs behind obfuscated resources
    crit: hostile
    conf: 0.995
    all:
      - id: objectives/anti-static/pack/archive::encrypted-apk-core
      - id: objectives/command-and-control/dropper/staging/archive::apk-guid-asset-stage-bundle
      - id: objectives/anti-static/pack/archive::apk-obfuscated-resource-pack
      - id: metadata/package/files/mobile-package::apk-libsys-core-runtime
