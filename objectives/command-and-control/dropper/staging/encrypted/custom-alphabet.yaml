# A command payload carried under a private Base64 alphabet.
#
# Replacing the RFC 4648 table with a per-build ordering is a cheap way to
# keep a tasking blob out of reach of the analyst's tooling: the blob still
# looks like base64 in `strings` output, but every off-the-shelf decoder
# returns garbage, so triage sees an opaque token instead of the command it
# carries. Pairing it with an AEAD seal means the alphabet is not the secret,
# only the speed bump.
#
# UAC-0145's trojanized WireGuard client did exactly this: a build-specific
# alphabet in front of an AES-256-GCM blob that decrypted to PowerShell and
# went straight to the tunnel's script-hook runner (CERT-UA, August 2026).
# The composites here are about the shape — private alphabet, symmetric
# decryption, process creation in one file — not about that client.
defaults:
  platforms: [windows, linux, macos]
  attack: T1027,T1140,T1059
  mbc: C0026,C0027

composite_rules:
  - id: go-custom-alphabet-sealed-payload-exec
    desc: Custom alphabet unseals an executed payload
    crit: hostile
    conf: 0.92
    for: [go]
    all:
      - id: micro-behaviors/data/decode/table::go-base64-custom-alphabet-codec
      - id: micro-behaviors/data/decode/table::nonstandard-base64-alphabet
      - id: micro-behaviors/process/create/direct::exec-command
    any:
      - id: micro-behaviors/crypto/symmetric/aes/gcm::go-cipher-new-gcm
      - id: micro-behaviors/crypto/symmetric/key::symmetric-key-from-private-key-field
      - id: micro-behaviors/crypto/library/provider::aes-new-cipher
      - id: micro-behaviors/crypto/library/provider::aes-cbc-encrypter
    needs: 1

  - id: python-custom-alphabet-sealed-payload-exec
    desc: Custom alphabet unseals an executed payload
    crit: hostile
    conf: 0.92
    for: [python]
    all:
      - id: micro-behaviors/data/decode/table::python-alphabet-substitution-decode
      - id: micro-behaviors/data/decode/table::nonstandard-base64-alphabet
      - id: micro-behaviors/process/create/subprocess::process-execution
    any:
      - id: micro-behaviors/crypto/symmetric/aes/library::cryptography-aesgcm-api
      - id: micro-behaviors/crypto/symmetric/aes/library::cryptography-gcm-mode
      - id: micro-behaviors/crypto/symmetric/decrypt::python-decrypt-method-call
    needs: 1

  - id: go-dynamic-alphabet-sealed-payload-exec
    desc: Dynamic alphabet unseals an executed payload
    crit: hostile
    conf: 0.94
    for: [go]
    all:
      - id: micro-behaviors/data/decode/table::go-dynamic-base64-alphabet
      - id: micro-behaviors/process/create/direct::exec-command
    any:
      - id: micro-behaviors/crypto/symmetric/aes/gcm::go-cipher-new-gcm
      - id: micro-behaviors/crypto/symmetric/key::symmetric-key-from-private-key-field
      - id: micro-behaviors/crypto/library/provider::aes-new-cipher
      - id: micro-behaviors/crypto/library/provider::aes-cbc-encrypter
    needs: 1
