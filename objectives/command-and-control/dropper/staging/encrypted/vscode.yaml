---
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  attack: T1105,T1027,T1059.007,T1497.001

# The conclusions below reuse canonical capability traits and require their
# proximity. Only the Python path remains local because it is stage-specific.
traits:
  - id: vscode-python-stage-path
    desc: References a Python stage path
    crit: component
    conf: 0.9
    if:
      type: text
      regex: '\.py["''`]'

composite_rules:

  - id: vscode-ci-delayed-stage
    desc: CI-gated delayed stage
    crit: hostile
    conf: 0.97
    attack: T1497.001,T1105
    near_lines: 80
    all:
      - id: well-known/lib/development/vscode::vscode-extension-marker
      - id: micro-behaviors/communications/http/request/client::https-get
      - id: micro-behaviors/time/schedule/delay::settimeout-random-delay
    any:
      - id: micro-behaviors/os/env/cicd
