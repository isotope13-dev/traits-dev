# Decrypt-then-decompress loader pattern
# Characteristic of staged payload loaders that use XXTEA-family code to
# decrypt an embedded payload, then zlib to decompress it before mapping it.
# The canonical 0x9E3779B9 constant alone is excluded: it also appears in
# non-cryptographic hashes such as the one in MongoDB/libbson.
#
# Tier: objectives — these atomics individually are neutral; their combination
# infers a specific loading intent that belongs here, not in micro-behaviors.
defaults:
  for: [pe, dll]
  platforms: [windows]
  attack: T1140
  mbc: B0003

composite_rules:
  # XXTEA phi^-2 variant + embedded zlib in a compact PE — strong signal.
  # The phi^-2 delta (0x61C88647) is obscure outside malware; its presence
  # alongside inline zlib almost exclusively indicates a self-contained loader.
  - id: xxtea-zlib-compact-loader
    desc: XXTEA phi^-2 + zlib in compact PE
    crit: suspicious
    conf: 0.9
    size_max: 2097152
    all:
      - id: micro-behaviors/data/compress/zlib::zlib-adler32-binary
    any:
      - id: micro-behaviors/crypto/symmetric/xxtea::xxtea-phi2-delta
      - id: micro-behaviors/crypto/symmetric/xxtea::xxtea-phi2-delta-mov
    unless:
      - id: metadata/binary/symbols/count::many-imports
      - id: metadata/signed/platform/

  # Highest confidence: TEA-family + zlib + dynamic API resolution.
  # A loader that hides its Windows API calls AND decrypts a payload AND
  # decompresses it has no plausible legitimate explanation.
  - id: xxtea-zlib-hidden-api-loader
    desc: XXTEA-family cipher + zlib + hidden API in PE
    crit: hostile
    conf: 0.93
    size_max: 2097152
    all:
      - id: micro-behaviors/data/compress/zlib::zlib
      - id: objectives/anti-static/obfuscation/imports/api-hashing::pe-export-walk-primitive
      - id: objectives/anti-static/obfuscation/imports/api-hashing::ror14-hash-loop-x64
    any:
      - id: micro-behaviors/crypto/symmetric/xxtea::xxtea-phi2-delta
      - id: micro-behaviors/crypto/symmetric/xxtea::xxtea-phi2-delta-mov
    unless:
      - id: metadata/binary/symbols/count::many-imports
      - id: metadata/signed/platform/
