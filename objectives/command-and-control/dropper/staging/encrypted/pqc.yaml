# A loader that uses a post-quantum KEM and more than one symmetric layer to
# unwrap a stage directly into executable memory.  The crypto primitives are
# neutral capabilities; this combination is a payload-delivery objective and
# intentionally does not depend on a malware-family name or cloud provider.
defaults:
  platforms: [linux, macos, windows]
  for: [c, cpp, rust, go, python, javascript, typescript, csharp, java, pe, dll, elf, macho, binaries, source]
  attack: T1027,T1105,T1140,T1620
  mbc: B0032

traits: []

composite_rules:
  - id: pq-stage-symmetric-decrypt
    desc: Symmetric decrypt layer for a staged payload
    crit: component
    conf: 0.9
    any:
      - id: micro-behaviors/crypto/symmetric/aes/decrypt::native-aes-decrypt
      - id: micro-behaviors/crypto/symmetric/aes/cng::bcrypt-symmetric-crypto-source

  - id: pq-stage-memory-protect
    desc: Executable-memory protect for a staged payload
    crit: component
    conf: 0.9
    any:
      - id: micro-behaviors/mem/protect/modify::virtual-protect
      - id: objectives/command-and-control/backdoor/loader/native-reflect::source-virtual-protect-call
      - id: micro-behaviors/mem/protect/modify::virtual-protect-ex

  - id: post-quantum-layered-memory-stage
    desc: Post-quantum layered payload decrypted into executable memory
    crit: hostile
    conf: 0.99
    all:
      - id: micro-behaviors/crypto/asymmetric/kem::kyber-kem-usage
      - id: micro-behaviors/crypto/symmetric/gost/cbc::gost-cbc-usage
      - id: pq-stage-symmetric-decrypt
      - id: micro-behaviors/mem/alloc/virtual::virtual-alloc-source
      - id: pq-stage-memory-protect
      - id: micro-behaviors/process/thread/create::create-thread-source
