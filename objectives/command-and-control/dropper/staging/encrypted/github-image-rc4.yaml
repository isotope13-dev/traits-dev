# GitHub Raw objects named like images that are encrypted .NET payloads.
defaults:
  platforms: [windows]
  for: [powershell]
  attack: T1102.001,T1027.003
  mbc: C0002,E1027

traits:
  # Notable, not suspicious: a raw.githubusercontent URL ending in .png is
  # nearly always an image -- a README badge, a doc screenshot, the comment at
  # the top of ImportExcel's Examples/Styles/NewExcelStyle.ps1 pointing at its
  # own screenshot. What makes it a staged payload is what the script then does
  # with the bytes, which both composites below require.
  - id: ps-raw-github-image-extension
    desc: GitHub Raw URL ends in image ext
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: '(?i)raw\.githubusercontent\.com/[^\s"''`]{1,120}\.(png|jpe?g|gif)\b'
    unless:
      - type: text
        regex: '(?i)\bIconUri\s*='
      - type: text
        regex: '(?i)<iconUrl>'

composite_rules:
  - id: ps-github-image-rc4-assembly-load
    desc: Image-named GitHub payload reflectively loaded
    crit: hostile
    conf: 0.99
    attack: T1102.001,T1027.003,T1620
    all:
      - id: ps-raw-github-image-extension
      - id: micro-behaviors/process/interpreter/reflection/resolve::powershell-assembly-load
      - id: micro-behaviors/communications/http/lib/invoke-webrequest::webclient-download
    near_bytes: 4096

  - id: ps-github-image-stream-cipher-load
    desc: Stream-cipher decrypt into Assembly.Load
    crit: hostile
    conf: 0.98
    all:
      - id: ps-raw-github-image-extension
      - id: micro-behaviors/crypto/symmetric/stream/rc4::rc4-source-state-table-powershell
      - id: micro-behaviors/process/interpreter/reflection/resolve::powershell-assembly-load
    near_bytes: 4096
