defaults:
  platforms: [windows]
  for: [pe]
  attack: T1027.013
  mbc: B0032

composite_rules:
  - id: strictor-encrypted-resource-stager
    desc: Strictor loader stages encrypted IMAGE and REGINST resources
    crit: hostile
    conf: 0.99
    all:
      - id: metadata/binary/resource/identity::reginst-resource-label
      - id: metadata/binary/resource/identity::image-resource-label
      - id: micro-behaviors/ui/dialog/error::loader-error-caption
      - id: metadata/binary/section/label::vr-writable-section
      - id: metadata/binary/section/label::mmym-small-executable-section
      - id: metadata/binary/symbols/imports::mfc42-ccmdtarget-interface-map-import
      - id: micro-behaviors/communications/socket/options::setsockopt-windows
      - id: micro-behaviors/mem/combined::virtual-memory-api-name-triad
    unless:
      - id: metadata/signed/platform/
