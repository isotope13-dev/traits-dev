defaults:
  platforms: [windows]
  for: [pe]
  attack: T1027.013
  mbc: B0032

composite_rules:
  - id: strictor-encrypted-resource-stager
    desc: Strictor loader stages encrypted IMAGE and REGINST resources
    crit: hostile
    conf: 0.99
    all:
      - id: metadata/binary/resource::reginst-resource-label
      - id: metadata/binary/resource::image-resource-label
      - id: micro-behaviors/data/encode/rl::loader-error-caption
      - id: metadata/binary/section/names::vr-writable-unpacker-section
      - id: metadata/binary/section/names::mmym-executable-entry-section
      - id: micro-behaviors/dylib/library/legacy::mfc42-ccmdtarget-interface-map-import
      - id: micro-behaviors/communications/socket/options::setsockopt-windows
      - id: micro-behaviors/mem/protect/modify::virtual-memory-api-string-triad
    unless:
      - id: metadata/signed/platform/
