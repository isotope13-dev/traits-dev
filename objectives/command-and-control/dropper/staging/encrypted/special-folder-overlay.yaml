# Small host PE carrying a dominant high-entropy overlay, resolving a
# special folder, creating a drop directory, writing a payload, and
# launching it via ShellExecute — classic encrypted overlay dropper.
defaults:
  platforms: [windows]
  for: [pe]
  attack: T1027.009,T1105,T1204.002
  size_min: 1048576

composite_rules:
  - id: special-folder-encrypted-overlay-dropper
    desc: Special-folder drop from encrypted PE overlay
    crit: hostile
    conf: 0.97
    all:
      - id: metadata/binary/layout::large-high-entropy-overlay
      - id: micro-behaviors/fs/shell-ops::shell-get-folder-path-a
      - id: micro-behaviors/fs/directory/mkdir::create-directory-a
      - id: micro-behaviors/fs/file/open::file-create-win
      - id: micro-behaviors/fs/file/write/direct::write-file
      - id: micro-behaviors/process/create/exec::shell-execute
    any:
      - id: objectives/evasion/masquerade/path::microsoft-windowshelper-dir
      - id: objectives/evasion/masquerade/path::helper-exe-format-path
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/installer/family/
      # Do not use metadata/binary/framework/: mscoree-name false-hits
      # native PEs that merely mention CLR strings in overlays.
