# Small host PE carrying a dominant high-entropy overlay, resolving a
# special folder, creating a drop directory, writing a payload, and
# launching it via ShellExecute — classic encrypted overlay dropper.
defaults:
  platforms: [windows]
  for: [pe]
  attack: T1027.009,T1105,T1204.002
  size_min: 1048576

composite_rules: []
