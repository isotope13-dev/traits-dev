defaults:
  platforms: [windows]
  for: [powershell]
  attack: T1027,T1059.001,T1140
  mbc: B0032,C0043

traits:
  # A leading block comment is used by the reported stage as a script marker;
  # it is only meaningful when paired with the decoder and ScriptBlock legs.
composite_rules:
  - id: powershell-hex-xor-decoder
    desc: PowerShell hex-pair XOR decoder
    crit: suspicious
    conf: 0.97
    all:
      - id: micro-behaviors/crypto/symmetric/xor/loop::hex-pair-bxor-charcode
      - id: micro-behaviors/data/control-flow/loop::powershell-length-bounded-for-loop
    near_bytes: 2048

  - id: powershell-scalar-hex-xor-decoder
    desc: PowerShell hex bytes pass through a scalar XOR pipeline
    crit: suspicious
    conf: 0.97
    all:
      - id: micro-behaviors/crypto/symmetric/xor/loop::powershell-pipeline-scalar-bxor-char
      - id: micro-behaviors/data/decode/hex::powershell-convert-tobyte-radix16
      - id: micro-behaviors/data/control-flow/loop::powershell-length-bounded-for-loop
    near_bytes: 2048

  - id: powershell-hex-xor-command-loader
    desc: PowerShell executes a command recovered by hex and XOR decoding
    crit: hostile
    conf: 0.99
    all:
      - id: powershell-scalar-hex-xor-decoder
      - id: micro-behaviors/process/create/shell/command-mode::windows-command-shell-invocation
    near_bytes: 4096

  - id: powershell-regex-hex-xor-decoder
    desc: Regex-split hex pairs XOR to text
    crit: hostile
    conf: 0.96
    for: [powershell, python, text]
    all:
      - id: micro-behaviors/data/encode/char-code::powershell-regex-hex-pair-split
      - id: micro-behaviors/data/encode/char-code::powershell-hex-pair-bxor

  - id: padded-powershell-hex-xor-stager
    desc: Identifier padding hides a hex XOR stage
    crit: hostile
    conf: 0.96
    for: [powershell, python, text]
    attack: T1027,T1059.001
    all:
      - id: "metadata/file/profile/identifier-population::very-long-average-identifiers"
      - id: micro-behaviors/data/encode/char-code::powershell-hex-pair-bxor
