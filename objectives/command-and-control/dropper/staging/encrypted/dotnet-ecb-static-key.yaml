# AES-ECB payload decryptor with an embedded (non-derived) key.
#
# ECB mode plus a key taken straight from a string literal is the shipped-key
# stage decryptor pattern: no KDF, no IV, the same key across builds. QuickFox's
# FDMTP loader decrypted update.bin with AES-128-ECB and a hardcoded key; the
# class is any .NET decryptor combining ECB with a string-derived key.
defaults:
  platforms: [windows]
  for: [csharp, pe, dll]
  attack: T1027,T1140
  mbc: B0032

composite_rules:
  - id: dotnet-ecb-static-key-decrypt
    desc: AES-ECB decryptor with a string-derived key
    crit: suspicious
    conf: 0.9
    scope: file
    near_lines: 40
    all:
      - id: objectives/command-and-control/dropper/staging/encrypted::dotnet-ecb-mode-config
      - id: micro-behaviors/crypto/symmetric/key::dotnet-symmetric-key-from-string-bytes
      - id: micro-behaviors/crypto/symmetric/decrypt::dotnet-create-decryptor
