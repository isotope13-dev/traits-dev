# Native PE profile for a transform-staged payload hidden in .reloc.
# The byte pattern is kept in anti-static/ so other packer traits can reuse it;
# this composite adds the staging intent from the section geometry and loader
# capability.
defaults:
  platforms: [windows]
  for: [pe, dll]
  attack: T1027,T1140

composite_rules:
  - id: rwx-reloc-decoder-stage-loader
    desc: RWX .reloc payload with position-independent decoder stub
    crit: hostile
    conf: 0.99
    all:
      - id: objectives/anti-static/obfuscation/payload/section::x86-unrolled-dword-decoder-in-reloc
      - id: objectives/anti-static/pack/section-anomaly::reloc-rwx-payload-section
      - id: objectives/anti-static/pack/section-anomaly::reloc-dominates-image
      - id: metadata/file/metrics::low-entropy-binary-with-dense-region
    any:
      - id: micro-behaviors/process/debug/detect::is-debugger-present-import
      - id: micro-behaviors/os/module/load::get-proc-address-import
    needs: 1
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/installer/family/
      - id: well-known/tool/reverse-engineering/
