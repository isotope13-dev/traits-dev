# Standalone encrypted .a3x/.a3e files must be content-routed as `data` (like
# .bin) before these composites run; cleave still types opaque .a3x as Unknown.
defaults:
  platforms: [windows]
  for: [data]
  attack: T1027,T1059
  mbc: B0032

composite_rules:
  - id: encrypted-autoit-ea06-high-entropy-file
    desc: High-entropy encrypted AutoIt EA06 script file
    crit: hostile
    conf: 0.96
    all:
      - id: metadata/lang/compiled::autoit-ea06-encrypted-script-blob
      - id: metadata/file/data-blob::very-high-entropy-data-file

  - id: autoit-a3x-encrypted-script-drop-stage
    desc: Encrypted AutoIt A3X script drop stage
    crit: hostile
    conf: 0.97
    attack: T1027,T1204.002
    size_min: 65536
    all:
      - id: metadata/lang/compiled::autoit-ea06-encrypted-script-blob
      - id: metadata/file/extension/identity::autoit-compiled-script-extension
