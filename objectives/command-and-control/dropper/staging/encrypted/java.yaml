defaults:
  platforms: [unix]
  for: [java, class, jar, zip]
  attack: T1027.009,T1059
  mbc: B0032,E1059

traits:
  - id: java-payload-endpoint
    desc: Java payload retrieval endpoint
    crit: component
    conf: 0.9
    if:
      type: text
      substr: /payload
  - id: java-xor-decode-method
    desc: Java XOR decode method
    crit: component
    conf: 0.9
    if:
      type: text
      substr: xorDecode
  - id: java-temp-shell-payload-name
    desc: Java temporary payload prefix
    crit: component
    conf: 0.92
    if:
      type: text
      substr: payload_
composite_rules:
  # Encrypted self-extractors exist in legitimate software, so the generic
  # chain is suspicious rather than hostile. More specific objectives promote
  # it only when the surrounding context establishes abuse.
  - id: java-indexed-xor-resource-stager
    desc: Java decrypts bundled resource, writes, and executes
    crit: suspicious
    conf: 0.97
    platforms: [unix, windows]
    for: [class, jar, zip]
    all:
      - id: micro-behaviors/data/embedded/payload/resource::java-classpath-resource-stream
      - id: micro-behaviors/crypto/symmetric/xor/loop::jvm-indexed-additive-key-xor-loop
      - id: micro-behaviors/fs/write/file/direct::jvm-files-write-bytecode
      - id: micro-behaviors/process/create/spawn::java-runtime-exec-bytecode-symbol

  # A JVM stage that unwraps a Fernet-packed payload, writes it out, installs
  # its Python dependencies, and runs it.  Fernet is a Python-only token format
  # (`cryptography.fernet`), so a JVM class implementing it is decrypting
  # something the operator packed with Python tooling; pip-installing the
  # requirements of a payload that arrived encrypted is not a build step or a
  # plugin bootstrap, it is second-stage delivery of an interpreted payload.
  - id: java-fernet-python-stage-dropper
    desc: Java decrypts a Fernet payload before launching a staged process
    crit: hostile
    conf: 0.97
    platforms: [unix, windows]
    for: [class, java_class, jar, java]
    attack: T1027,T1059.006
    all:
      - id: micro-behaviors/crypto/symmetric/fernet::jvm-fernet-token-handling
      - id: micro-behaviors/os/package-manager/install::jvm-pip-install-command
      - id: micro-behaviors/fs/write/file/direct::jvm-files-write-bytecode
      - id: micro-behaviors/process/create/spawn::java-processbuilder-start-bytecode

  - id: java-encrypted-temp-shell-dropper
    desc: Java encrypted temporary shell dropper
    crit: hostile
    conf: 0.99
    all:
      - id: java-payload-endpoint
      - id: java-xor-decode-method
      - id: java-temp-shell-payload-name
      - id: micro-behaviors/fs/write/file/direct::java-owner-execute-permission
    any:
      - id: micro-behaviors/process/create/spawn::java-processbuilder-source
      - id: micro-behaviors/process/create/spawn::java-processbuilder-bytecode
