defaults:
  platforms: [unix]
  for: [java, class, jar, zip]
  attack: T1027.009,T1059
  mbc: B0032,E1059

traits:
  - id: java-payload-endpoint
    desc: Java payload retrieval endpoint
    crit: component
    conf: 0.9
    for: [java, class]
    if:
      type: text
      substr: /payload
  - id: java-xor-decode-method
    desc: Java XOR decode method
    crit: notable
    conf: 0.9
    for: [java, class]
    if:
      type: text
      substr: xorDecode
  - id: java-temp-shell-payload-name
    desc: Java temporary payload prefix
    crit: component
    conf: 0.92
    for: [java, class]
    if:
      type: text
      substr: payload_
composite_rules: []
