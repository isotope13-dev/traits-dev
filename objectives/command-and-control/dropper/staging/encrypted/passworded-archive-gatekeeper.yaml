# Password-protected archive used to smuggle a macOS payload past scanners,
# then unwrapped and launched with its download provenance stripped.
#
# This is the stage-1 shape of the ClickFix macOS stealer campaigns
# (AmnesiaStealer, and the Atomic/MacSync lures that share its template): the
# victim pastes a one-liner into Terminal, which fetches an encrypted ZIP,
# extracts it with a password baked into the script, removes
# com.apple.quarantine so Gatekeeper never evaluates the binary, marks it
# executable and runs it.
#
# Each half is separately defensible and separately weak. Encrypting an archive
# is legitimate; stripping quarantine is something developers do to their own
# build output. What has no benign form is doing both to the *same* fetched
# payload: an encrypted container exists so nothing between the server and the
# disk can read the payload, and the quarantine strip exists so nothing on the
# disk gets to evaluate it either. A real installer either ships signed and
# notarized (no quarantine problem) or ships a plain archive (no password).
#
# Language-neutral by construction: the legs are the archive tool, the xattr
# operation and the exec-bit change, so a Go/Python/Rust reimplementation of
# the same chain matches as readily as the shell original.
#
# ATT&CK: T1027.002 (software packing/encrypted payload), T1553.001
# (Gatekeeper bypass), T1204.004 (malicious copy-paste), T1222.002.
defaults:
  platforms: [macos]
  for: [scripts, source, macho]
  attack: T1553.001
  mbc: B0024

traits:
  # AmnesiaStealer / Atomic-style loaders hide the Mach-O under a Developer
  # Tools-looking name in /tmp. The numeric suffix is a per-fetch token.
  - id: tmp-apple-devtools-masquerade-path
    desc: Hides payload under /tmp/.com.apple.dt name
    crit: suspicious
    conf: 0.96
    attack: T1036.005
    for: [shell, scripts, source]
    if:
      type: text
      regex: '(?i)/tmp/\.com\.apple\.dt\.[0-9]{3,12}\b'

composite_rules:
  - id: passworded-archive-gatekeeper-bypass-stage
    desc: Passworded archive run past Gatekeeper
    crit: hostile
    conf: 0.97
    attack: T1027.002,T1553.001,T1222.002
    all:
      - id: micro-behaviors/data/archive/extract/password::cli-passworded-archive-extraction
      - id: micro-behaviors/fs/chmod/executable/mode
    any:
      - id: micro-behaviors/fs/attributes/xattr::xattr-quarantine-remove
      - id: micro-behaviors/fs/attributes/xattr::xattr-clear-all-attrs
      - id: micro-behaviors/fs/attributes/xattr::xattr-recursive-quarantine-remove

  - id: remote-passworded-archive-payload-fetch
    desc: Fetches a passworded archive payload
    # Narrower question than the rule above: where did the container come
    # from. A downloader that pulls an encrypted archive and already holds the
    # password is staging a payload it does not want inspected in transit —
    # the password cannot be a user secret if the fetching code knows it.
    crit: suspicious
    conf: 0.93
    attack: T1027.002,T1105
    all:
      - id: micro-behaviors/data/archive/extract/password::cli-passworded-archive-extraction
      - id: micro-behaviors/communications/http/download/cli::curl-wget-command
    unless:
      # A security-eval corpus ships the technique as the subject under test.
      - id: well-known/lib/ai/inspect-evals::eval-corpus-context

  # Variant that clears all xattrs (`xattr -c`/`-cr`) and re-signs ad-hoc
  # instead of deleting com.apple.quarantine by name. Same ClickFix loader
  # shape; the Gatekeeper bypass is the ad-hoc signature on a passworded
  # download rather than an explicit quarantine delete.
  - id: passworded-archive-adhoc-codesign-stage
    desc: Passworded archive ad-hoc resigned in /tmp
    crit: hostile
    conf: 0.98
    attack: T1027.002,T1553.001,T1036.005
    for: [shell, scripts]
    all:
      - id: micro-behaviors/data/archive/extract/password::cli-passworded-archive-extraction
      - id: micro-behaviors/os/security/gatekeeper::codesign-force-adhoc
      - id: micro-behaviors/fs/chmod/executable/mode
      - id: micro-behaviors/communications/http/download/cli::curl-wget-command
    any:
      - id: tmp-apple-devtools-masquerade-path
      - id: micro-behaviors/fs/path/temp::unix-temp
    near_lines: 40
