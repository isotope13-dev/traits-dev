# A source loader that implements RC4 itself and decrypts embedded PE
# resources is a reusable staging pattern. The hostile interpretation needs
# an additional driver, registry-payload, or injection action so ordinary
# applications that unpack an embedded resource are not treated as malware.
defaults:
  platforms: [windows]
  for: [c, cpp, csharp, go, rust, python, powershell]
  attack: T1027,T1027.009,T1140
  mbc: B0023

composite_rules:
  - id: source-decrypt-to-executable-memory
    desc: Decrypts a buffer into executable memory
    crit: suspicious
    conf: 0.94
    attack: T1027,T1140,T1620
    for: [c, cpp, rust]
    all:
      - id: micro-behaviors/mem/alloc/virtual::virtual-alloc-source
      - id: micro-behaviors/mem/protect/modify::virtual-protect
    any:
      # Equivalent spellings of the same in-place cipher loop; which one
      # survives evidence dedup varies, so the leg names the whole family.
      - id: micro-behaviors/data/arithmetic::indexed-xor-array-assignment
      - id: micro-behaviors/data/encoding/xor::c-xor-assign-modulo-operand
      - id: micro-behaviors/data/arithmetic::native-xor-modulo-arithmetic
      - id: micro-behaviors/crypto/symmetric/stream/rc4::source-rc4-implementation

  - id: source-rc4-embedded-security-stage
    desc: Custom RC4 decrypts embedded resources for driver or payload staging
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/crypto/symmetric/stream/rc4::source-rc4-implementation
      - id: micro-behaviors/data/embedded/payload/resource::source-pe-resource-extraction
    any:
      - id: micro-behaviors/os/kernel/driver::kernel-driver-service-configuration
      - id: micro-behaviors/os/registry/access::registry-binary-value-write-source
      - id: objectives/evasion/process/injection/thread-hijacking::source-thread-context-hijack
