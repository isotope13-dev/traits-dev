# Rust/native loaders that fetch over Winsock, decrypt with XChaCha20,
# then map the stage via NtCreateSection/NtMapViewOfSection (T1027/T1620).
defaults:
  platforms: [windows]
  for: [pe]
  attack: T1027.002,T1105,T1620
  size_max: 10485760

composite_rules:
  - id: xchacha-nt-section-map-loader
    desc: XChaCha20 decrypt into Nt section map
    crit: hostile
    conf: 0.97
    all:
      - id: micro-behaviors/crypto/symmetric/stream::xchacha20-keyword
      - id: micro-behaviors/mem/create/shared::nt-section-map-dynamic-apis
      - id: micro-behaviors/mem/protect/modify::virtual-protect
      - id: micro-behaviors/communications/socket/init::wsa-startup
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/installer/family/
