defaults:
  platforms: [windows, unix]
  for:
    - javascript
    - typescript
  attack: T1027
  mbc: C0025
traits:
  - id: js-staged-generator
    desc: Generator function yielding eval
    crit: suspicious
    conf: 0.9
    if:
      type: string_literal
      regex: function\*.{0,50}yield\s+eval\(
composite_rules:
  - id: decryption-methods
    desc: Decryption method calls
    any:
      - id: micro-behaviors/crypto/symmetric/aes/runtime-library::create-decipher-call
      - id: micro-behaviors/crypto/symmetric/aes/runtime-library::createDecipheriv
      - id: micro-behaviors/crypto/symmetric/decrypt::javascript-decrypt-method-call
  - id: code-execution-methods
    desc: Dynamic code execution methods
    crit: component
    conf: 0.9
    any:
      - id: micro-behaviors/process/interpreter/eval/direct::js-eval-raw
      - id: micro-behaviors/process/interpreter/eval/compile::js-new-function-constructor
    unless:
      - id: metadata/library/structure::js-large-module-bundle
      - id: metadata/library/runtime/
      - id: metadata/build/recognized-contexts::benign-build-tooling-context
      - id: metadata/library/structure/
  - id: encoded-data
    desc: Encoded data (blobs or buffer decoding)
    any:
      - id: micro-behaviors/data/encode/embedded::large-encoded-blob
      - id: micro-behaviors/data/decode/buffer::buffer-decoding
  - id: js-decrypt-eval
    desc: Decrypts hardcoded payload and executes it
    crit: suspicious
    conf: 0.95
    all:
      - id: micro-behaviors/crypto/library/provider::crypto-module-import
      - id: decryption-methods
      - id: code-execution-methods
      - id: encoded-data
  - id: js-custom-base64-xor-eval-stage
    desc: Custom Base64 decoder decrypts and evaluates an embedded stage
    crit: hostile
    conf: 0.99
    attack: T1027,T1059.007,T1140
    near_lines: 48
    all:
      - id: micro-behaviors/data/decode/base64-quartet::custom-base64-quartet-byte-decoder
      - id: micro-behaviors/crypto/symmetric/xor/loop::js-byte-array-xor-modulo-key-loop
      - id: micro-behaviors/data/decode/custom::fromcharcode-indexed-array
      - id: micro-behaviors/process/interpreter/eval/direct::js-eval-variable-argument
    unless:
      - id: metadata/package/testing/
      - id: well-known/tool/detection/security-scanner/
  - id: js-marker-stripped-xor-eval-stage
    desc: Marker-padded JavaScript carrier is XOR-decoded into eval
    crit: hostile
    conf: 0.99
    attack: T1027,T1059.007,T1140
    near_lines: 96
    all:
      - id: objectives/anti-static/obfuscation/code-metrics/structure::large-digit-heavy-obfuscator-bundle
      - id: micro-behaviors/data/string/replace::chained-replace-calls
      - id: micro-behaviors/crypto/symmetric/xor/loop::js-byte-array-xor-modulo-key-loop
      - id: micro-behaviors/process/interpreter/eval/direct::js-eval-variable-argument
    unless:
      - id: metadata/package/testing/
  - id: js-giant-carrier-xor-eval-stage
    desc: Enormous encoded JavaScript carrier is XOR-decoded into eval
    crit: hostile
    conf: 0.99
    attack: T1027,T1059.007,T1140
    near_lines: 96
    all:
      - id: metadata/file/profile/metrics::js-max-string-over-128k
      - id: micro-behaviors/data/decode/base64::standard-base64-alphabet-table
      - id: micro-behaviors/crypto/symmetric/xor/loop::js-byte-array-xor-modulo-key-loop
      - id: micro-behaviors/process/interpreter/eval/direct::js-eval-variable-argument
    unless:
      - id: metadata/package/testing/
      - id: metadata/file/format/structured::sourcemap-sources-content
