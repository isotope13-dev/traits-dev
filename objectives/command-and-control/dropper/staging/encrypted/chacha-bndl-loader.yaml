defaults:
  platforms: [windows]
  for: [pe]
  attack: T1027
  mbc: B0003

composite_rules:
- id: chacha-bndl-payload-bundle
  desc: ChaCha-encrypted BNDL executable bundle
  crit: suspicious
  conf: 0.96
  size_max: 1048576
  all:
  - id: micro-behaviors/crypto/symmetric/stream/chacha::chacha-salsa-constant
  - id: micro-behaviors/data/archive/custom::bndl-exe-archive
  - id: metadata/binary/section/entropy::high-entropy-rdata-section
  unless:
  - id: metadata/binary/symbols/count::many-imports
  - id: metadata/signed/platform/
  - id: metadata/binary/installer/family/

- id: chacha-bndl-c2-payload-config
  desc: Encrypted bundle carries C2 endpoints
  crit: suspicious
  conf: 0.94
  attack: T1105
  mbc: B0034
  all:
  - id: chacha-bndl-payload-bundle
  - id: micro-behaviors/communications/ip/endpoint::external-ipv4-port-rdata-pair
