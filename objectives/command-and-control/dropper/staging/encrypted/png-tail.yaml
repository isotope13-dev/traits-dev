# A decoded image tail is staged as an executable, without an execution sink.
# Test-directory names cannot make this content-level staging chain benign.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
composite_rules:
- id: javascript-png-tail-aes-exe-dropper
  desc: Decrypts a PNG tail into an AppData executable
  crit: hostile
  conf: 0.99
  attack: T1027.003,T1140
  near_lines: 80
  all:
  - id: objectives/anti-static/obfuscation/steganography/image::javascript-png-tail-base64-extraction
  - id: micro-behaviors/crypto/symmetric/aes/runtime-library::createDecipheriv
  - id: micro-behaviors/fs/path/application/executable::appdata-exe-path
  - id: micro-behaviors/fs/write/file/full::node-write-file-sync-call
