# A decoded image tail is staged as an executable, without an execution sink.
# Test-directory names cannot make this content-level staging chain benign.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
composite_rules:
- id: javascript-png-tail-aes-exe-dropper
  desc: PNG-tail decode/AES/write with AppData EXE path
  crit: hostile
  conf: 0.99
  attack: T1027.003,T1140
  near_lines: 80
  all:
  - id: objectives/anti-static/obfuscation/steganography/image::javascript-png-tail-base64-extraction
  - id: micro-behaviors/crypto/symmetric/decrypt::createDecipheriv
  - id: micro-behaviors/fs/path/construct::node-appdata-near-executable-path-join
  - id: micro-behaviors/fs/write/file/full::node-write-file-sync-call
  - id: micro-behaviors/crypto/symmetric/aes/runtime-library::aes-256-cbc-dash
  unless:
  - id: micro-behaviors/communications/http/url/tld::single-nonexistent-fetch-example

# A PNG end marker plus a tail carve and decoder supplies carrier evidence.
# Detached execution distinguishes the encrypted stage from an image utility;
# neither a campaign key nor a Windows-only output directory is required.
- id: javascript-png-tail-aes-detached-execution
  desc: PNG-tail decode/AES/write/detached-spawn pattern
  crit: hostile
  conf: 0.98
  attack: T1027.003,T1140,T1106
  near_lines: 80
  all:
  - id: objectives/anti-static/obfuscation/steganography/image::javascript-png-tail-base64-extraction
  - id: micro-behaviors/crypto/symmetric/decrypt::createDecipheriv
  - id: micro-behaviors/fs/write/file/full::node-write-file-sync-call
  - id: micro-behaviors/process/create/spawn::detached-ignored-unref-spawn
  - id: micro-behaviors/crypto/symmetric/aes/runtime-library::aes-256-cbc-dash
  unless:
  - id: micro-behaviors/communications/http/url/tld::single-nonexistent-fetch-example
  any:
  - id: micro-behaviors/process/create/spawn::spawn-call
  - id: micro-behaviors/process/create/spawn::child-process-member-spawn
