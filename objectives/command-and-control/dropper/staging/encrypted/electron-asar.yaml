defaults:
  platforms: [windows]
  for: [javascript]
  attack: T1027
  mbc: B0022

traits:
- id: electron-asar-aes-exe-decrypt
  desc: Electron ASAR decrypts EXE
  crit: suspicious
  conf: 0.96
  if:
    type: text
    regex: '63726561746544656369706865726976.{0,160}6165732d3235362d636263'
- id: electron-asar-temp-exe-write
  desc: Electron writes temp EXE
  crit: suspicious
  conf: 0.95
  if:
    type: text
    regex: 'tmpdir.{0,360}2e657865.{0,520}writeFileSync'
- id: electron-asar-hidden-exe-spawn
  desc: Electron spawns hidden EXE
  crit: suspicious
  conf: 0.96
  if:
    type: text
    regex: '737061776e.{0,900}77696e646f777348696465.{0,160}6465746163686564'

composite_rules:
- id: electron-asar-decrypt-drop-execute
  desc: Electron decrypts drops executes EXE
  crit: hostile
  conf: 0.99
  attack: T1105
  all:
  - id: electron-asar-aes-exe-decrypt
  - id: electron-asar-temp-exe-write
  - id: electron-asar-hidden-exe-spawn
  unless:
  - id: metadata/package/testing/

# Compact Electron main.js pattern: read an adjacent ciphertext sidecar,
# AES-256-CBC decrypt with a hardcoded hex key, then Module._compile the
# plaintext. Seen in Kingston-branded NSIS Electron stealers that ship
# runtime*.dat next to a one-line loader instead of an ASAR.
- id: electron-aes-sidecar-module-compile
  desc: AES-decrypts sidecar into Module._compile
  crit: hostile
  conf: 0.99
  attack: T1027.013,T1059.007,T1140
  for: [javascript, pe, archives]
  scope: outer
  near_bytes: 1024
  all:
  - id: micro-behaviors/crypto/symmetric/aes/runtime-library::createDecipheriv
  - id: micro-behaviors/crypto/symmetric/aes/runtime-library::aes-256-cbc
  - id: micro-behaviors/fs/file/read::readfilesync-call
  - id: micro-behaviors/data/decode/hex::buffer-from-hex-string
  - id: micro-behaviors/process/interpreter/eval::module-compile-marker
  - id: micro-behaviors/os/module/load::node-module-builtin-require
  unless:
  - id: metadata/package/testing/
  - id: well-known/tool/detection/security-scanner/
