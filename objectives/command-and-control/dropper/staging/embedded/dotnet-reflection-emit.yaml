defaults:
  platforms: [windows]
  for: [pe, dll]
  attack: T1027.009,T1140,T1620
  mbc: B0030

composite_rules:
  # Dynamic IL generation plus encrypted/compressed resource handling and an
  # anti-decompiler marker is a staged loader shape, not ordinary reflection.
  # The complete conjunction keeps each neutral API atom useful without
  # turning a framework reference into a malware verdict.
  - id: dotnet-encrypted-reflection-emit-loader
    desc: .NET encrypted Reflection.Emit payload loader
    crit: hostile
    conf: 0.99
    all:
      - id: metadata/binary/framework::dotnet-assembly
      - id: objectives/anti-static/obfuscation/anti-decompile::suppress-ildasm-managed-pe-string
      - id: metadata/lang/compiler/managed::reflection-emit
      - id: micro-behaviors/crypto/symmetric/decrypt::dotnet-create-decryptor
      - id: micro-behaviors/data/compress/library::dotnet-gzip-compression
      - id: micro-behaviors/data/embedded/payload/resource::dotnet-getmanifestresourcestream
      - id: micro-behaviors/process/interpreter/reflection/runtime::invoke-member-token
    unless:
      - id: well-known/lib/runtime/dotnet-runtime::framework-reference-assembly-context
      - id: metadata/file/extension/identity::netstandard-dll-basename
      - id: well-known/lib/runtime/dotnet-runtime::msbuild-runtime-assembly-context
      - id: well-known/lib/runtime/dotnet-runtime::source-built-artifacts-pkg-path
      - id: metadata/signed/leaf::microsoft-corporation
      - id: metadata/signed/platform::microsoft
      - id: well-known/lib/ai/argutrack-dnn::official-runtime-binary
