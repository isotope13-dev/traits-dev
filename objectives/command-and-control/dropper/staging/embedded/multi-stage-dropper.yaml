# Multi-stage Dropper
defaults:
  for: [pe, dll]
  platforms: [windows]
  attack: T1105
traits:
  - id: has-high-entropy-regions
    desc: Binary contains high-entropy data regions
    crit: component
    if:
      type: metrics
      field: binary.peak_region_bytes
      min: 65536
    unless:
      - type: metrics
        field: binary.peak_region_entropy
        max: 7.0
composite_rules:
  - id: recognized-benign-multi-pe-products
    desc: Recognized products that bundle multiple PE files
    crit: exception
    conf: 0.98
    any:
      - id: well-known/lib/native/sharpshell::sharpshell-framework
      - id: well-known/app/system/ipodme::ipodme-media-converter
      - id: well-known/dual-use/tunnel/connectify::connectify-signer
      - id: well-known/app/development/logitech::logitech-ghub-installer-bundle

  # Embedded headers and entropy establish a packed carrier, not a dropper.
  # Require evidence that the carrier can load or execute a staged image before
  # assigning the dropper objective.
  - id: embedded-pe-loader-capability
    desc: Embedded PE loader or execution capability
    crit: component
    conf: 0.96
    any:
      - id: objectives/anti-static/obfuscation/eval/loader::packed-binary-process-execution
      - id: objectives/anti-static/obfuscation/payload/import::minimal-pe-dynamic-load
      - id: objectives/anti-static/obfuscation/payload/self-read::pe-overlay-self-extractor
      - id: objectives/evasion/process/injection/memory::embedded-remote-thread-injector

  - id: persistent-multi-stage-remote-thread-carrier
    desc: Multi-stage PE carrier persists a remote-thread injector as SYSTEM
    crit: hostile
    conf: 0.99
    attack: T1027.009,T1055,T1053.005
    scope: outer
    all:
      - id: multi-stage-pe-dropper
      - id: objectives/evasion/process/injection/memory::embedded-remote-thread-injector
      - id: objectives/persistence/login/scheduled-task/masquerade::microsoft-namespace-repeating-system-task
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/installer/family/

  - id: multi-stage-pe-dropper
    desc: PE loader carries 3+ high-entropy PE payloads
    crit: suspicious
    conf: 0.98
    unless:
      - id: well-known/tool/sysadmin/chocolatey::official-library-pe-context
      - id: well-known/dual-use/remote-admin/screenconnect::screenconnect-component-detected
    all:
      - id: micro-behaviors/data/embedded/payload/header::pe-magic-embedded-multiple
      - id: embedded-pe-loader-capability
    any:
      - id: metadata/binary/metrics/threshold::high-overall-entropy-binary
      - id: has-high-entropy-regions
    downgrade:
      any:
        - id: metadata/signed/platform/
        - id: recognized-benign-multi-pe-products
        - id: well-known/lib/media/ffmpeg/
        - id: well-known/lib/media/gpac/
        - id: metadata/binary/metrics/structural::many-imports
