defaults:
  for: [macho]
  platforms: [macos]
  crit: hostile
  conf: 0.98
  attack: T1027,T1059.004

composite_rules:
  - id: embedded-encoded-shell-stage
    desc: Embedded encoded stage invokes shell commands
    all:
      - id: metadata/file/encoded::large-base64-like-string
      - id: metadata/binary/layout/overlay::overlay-at-least-80k
      - id: micro-behaviors/process/create/shell/spawn::system-fn
      - id: objectives/anti-static/obfuscation/payload/import::minimal-imports
