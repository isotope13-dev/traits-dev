defaults:
  for: [pe]
  platforms: [windows]
  crit: component
  conf: 0.96
  attack: T1027.009,T1106

traits:
  - id: resource-main-executable-member
    desc: PE resource archive contains Main.exe
    if:
      type: text
      exact: Main.exe
      section: .rsrc

  - id: resource-hijack-library-member
    desc: PE resource archive contains HiJack.dll
    if:
      type: text
      exact: HiJack.dll
      section: .rsrc

  - id: resource-kernel-library-member
    desc: PE resource archive contains Kernel.dll
    if:
      type: text
      exact: Kernel.dll
      section: .rsrc

composite_rules:
  - id: pe-resource-hidead-injector-dropper
    desc: PE extracts and launches the embedded HideAd injector bundle
    crit: hostile
    conf: 0.995
    all:
      - id: resource-main-executable-member
      - id: resource-hijack-library-member
      - id: resource-kernel-library-member
      - id: micro-behaviors/data/embedded/payload/resource::find-resource-any
      - id: micro-behaviors/data/embedded/payload/resource::load-resource
      - id: micro-behaviors/data/embedded/payload/resource::sizeof-resource
      - id: micro-behaviors/process/create/spawn::create-process-a
