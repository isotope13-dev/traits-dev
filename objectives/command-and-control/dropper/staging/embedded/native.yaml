# A custom Delphi crypter: the file's bulk is a high-entropy overlay, a PE
# resource is read out whole, a key is derived and a stream cipher applied,
# page protection is flipped and a process is launched.
#
# Every leg of that list is also stock Inno Setup 6.4+, which is written in
# Delphi, ships Components\ChaCha20.pas + PBKDF2 in *every* build whether or
# not the installer uses encryption, keeps its setup data in PE resources,
# carries its compressed payload as the overlay, and calls CreateProcessW /
# AdjustTokenPrivileges to run the installed app and request the shutdown
# privilege. Without the installer-family exclusion this convicts every
# third-party setup built with Inno 6.4.0 (Nov 2024) or later — the default
# for new installers — so the family gate is what keeps the rule about a
# hand-rolled crypter rather than about the installer framework. The sibling
# composites in this file gate on the same directory.
- id: delphi-crypto-resource-process-stager
  desc: Delphi resource stager combines crypto markers and process launch
  crit: hostile
  conf: 0.98
  attack: T1027.009,T1106,T1134
  all:
  - id: metadata/lang/compiler/managed::delphi
  - id: metadata/binary/layout::overlay-over-90pct
  - id: micro-behaviors/data/embedded/payload/resource::pe-resource-full-extraction
  - id: micro-behaviors/crypto/symmetric/stream::chacha20-keyword
  - id: micro-behaviors/crypto/kdf/algorithm::pbkdf2
  - id: micro-behaviors/mem/protect/modify::virtual-protect
  - id: micro-behaviors/process/create/spawn::create-process-w
  - id: micro-behaviors/os/privilege/token::adjust-token-privileges-any
  unless:
  - id: metadata/binary/installer/family/
  - id: metadata/signed/platform/
  - id: well-known/tool/reverse-engineering/
- id: unsigned-elevated-inline-pe-network-loader
  desc: Unsigned elevated loader validates an embedded PE and downloads a payload
