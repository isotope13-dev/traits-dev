# A packed, unsigned carrier holding both halves of a delivery: an executable
# payload in its resources, and the address to phone once it runs.
#
# The literal IPv4 is the part worth naming. Software that legitimately talks to
# a server names it — a hostname, resolved at run time, changeable without a
# rebuild. A dotted quad compiled into a packed binary is the opposite choice:
# it survives DNS takedown and leaves nothing to seize, which only matters to
# whoever is expecting the takedown. `external-ipv4-host-literal-binary` already
# carried this signal for ARM/PowerPC/IoT backdoors and for native RATs; nothing
# paired it with a packed Windows carrier, so a Windows dropper with its C2
# baked in had no composite to land on.
#
# Packed + unsigned + high-entropy code on their own are a protected commercial
# build. Adding an executable resource section and a hardcoded address is the
# combination a shipped product does not produce.
- id: packed-carrier-resource-payload-literal-c2
  desc: Packed carrier holds a payload and literal C2
  crit: hostile
  conf: 0.96
  attack: T1027.002,T1105,T1071
  mbc: F0001,B0030
  all:
  - id: metadata/binary/resource::executable-rsrc-section
  - id: micro-behaviors/communications/ip/literal::external-ipv4-host-literal-binary
  - id: metadata/binary/layout::pe-no-signature-record
  - id: metadata/binary/metrics/structural::high-code-entropy
  # The concrete markers, not `pack/detect::detect`: that umbrella is an
  # `any:`-only composite, which validation flags as low-value and filters
  # from scan output, so it is not dependable as a leg.
  any:
  - id: objectives/anti-static/pack/detect::aspack-marker
  - id: objectives/anti-static/pack/detect::themida-marker
  - id: micro-behaviors/data/encode/pecompact::pec2no-section-token
  unless:
  - id: metadata/signed/platform/
  - id: metadata/binary/installer/family/
  - id: metadata/binary/installer/script/
  - id: well-known/tool/reverse-engineering/
  # `metadata/binary/vendor/` is deliberately NOT here. That directory holds
  # `common-fp-context`, a baseline catch-all satisfied by any Delphi/Borland
  # build — which this carrier is — so the directory reference would have
  # silenced the rule on exactly the samples it is for. Being unsigned is
  # already required above, and that is the gate that matters.
