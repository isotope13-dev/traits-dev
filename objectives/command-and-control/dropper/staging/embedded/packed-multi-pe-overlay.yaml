# Packed PE overlays carrying several executable stages.
# This is a staging/dropper shape, not a claim that every self-extracting
# archive is malicious; installer and signed-platform exceptions are retained.
defaults:
  platforms: [windows]
  for: [pe]
  attack: T1027.009
  mbc: B0024

composite_rules:
  - id: packed-multi-pe-overlay-stager
    desc: Packed PE overlay carrying multiple executable stages
    crit: hostile
    conf: 0.97
    all:
      - id: metadata/binary/metrics/structural::embedded-pe-three-plus
      - id: metadata/binary/layout::overlay-over-90pct
      - id: objectives/anti-static/pack/detect::aspack-marker
      - id: micro-behaviors/dylib/load/runtime::load-library-a
    unless:
      - id: metadata/binary/installer/sfx/
      - id: metadata/binary/installer/family/
      - id: metadata/signed/platform/

  # 7zG.exe is 7-Zip's *GUI* extractor, identified here by the manifest assembly
  # name `7-Zip.7-Zip.7zG` that only that binary carries. It is not one of the
  # self-extracting stubs (`7z.sfx`, `7zCon.sfx`, `7zS.sfx`), it has no code
  # path that reads bytes appended to itself, and a released 7-Zip build has no
  # overlay at all. So a 7zG.exe with a third of the file appended after its
  # last section is not a 7-Zip archive being extracted -- it is a carrier that
  # happens to run as a familiar, trusted-looking utility if the victim
  # double-clicks it, while other complete PE images ride along behind it.
  #
  # The SFX stubs keep their own identity strings, so gating on the GUI
  # manifest keeps genuine self-extracting archives out. Suspicious rather than
  # hostile: the concatenation is the finding, and nothing in the carrier acts
  # on what it carries.
  - id: sevenzip-gui-executable-payload-overlay
    desc: 7-Zip GUI binary carries an executable overlay
    crit: suspicious
    conf: 0.93
    attack: T1027.009,T1105
    all:
      - id: metadata/file/string/identity::7zip-gui-official-manifest
      - id: metadata/binary/layout::multiple-pe-embedded
      - id: metadata/binary/layout::overlay-dominates-third
      - id: metadata/binary/layout::pe-no-signature-record
    # No `metadata/binary/installer/sfx/` suppressor here: that directory holds
    # 7-Zip's own registry-key marker, which any 7-Zip build carries, so it
    # would cancel this rule's own gate. The GUI manifest already separates
    # 7zG.exe from the `*.sfx` self-extracting stubs.
    unless:
      - id: metadata/binary/installer/family/
      - id: metadata/signed/platform/
