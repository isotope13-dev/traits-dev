defaults:
  platforms: [windows, unix]
  for:
    - javascript
    - typescript
traits:
  # Filename suffix checks are neutral path classification, not staging, and
  # live under micro-behaviors/fs/path/extension/. The former find-* atomics
  # were removed rather than relocated: `find(x => x.cmd)` is ordinary object
  # lookup and does not even establish a filename-extension check.
  - id: exepath-var
    desc: exePath string literal
    crit: component
    conf: 0.5
    if:
      type: string_literal
      word: exePath
