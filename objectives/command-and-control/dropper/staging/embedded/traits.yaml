defaults:
  platforms: [windows, unix]
  for:
    - javascript
    - typescript
traits:
  # NOTE: the endsWith('.bat'|'.cmd'|'.ps1'|'.sh'|'.elf'|'.bin') suffix checks
  # that used to live here are filename tests, not payload staging, and stood
  # alone as `suspicious` on ordinary extension-dispatching Node code. They now
  # live beside their canonical .exe sibling in
  # micro-behaviors/fs/path/extension/ and are referenced from the composites
  # that supply the dropper context.
  - id: find-exe-pattern
    desc: find() with .exe pattern
    crit: suspicious
    conf: 0.6
    attack: T1105
    if:
      type: string_literal
      regex: find\([^)]{0,120}\.exe
    unless:
      - id: metadata/file/format/structured::sourcemap
  - id: find-bat-pattern
    desc: find() with .bat pattern
    crit: suspicious
    conf: 0.6
    attack: T1105
    if:
      type: string_literal
      regex: find\([^)]{0,120}\.bat
    unless:
      - id: metadata/file/format/structured::sourcemap
  - id: find-cmd-pattern
    desc: find() with .cmd pattern
    crit: suspicious
    conf: 0.6
    attack: T1105
    if:
      type: string_literal
      regex: find\([^)]{0,120}\.cmd
    unless:
      - id: metadata/file/format/structured::sourcemap
      - id: well-known/app/github-desktop/
  - id: exepath-var
    desc: exePath string literal
    crit: component
    conf: 0.5
    if:
      type: string_literal
      word: exePath
