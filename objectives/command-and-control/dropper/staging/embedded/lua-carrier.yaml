defaults:
  platforms: [windows, unix]
  for: [binaries, c, cpp]
  attack: T1027.009
traits:
- id: lua-wormlet-config--rx-1
  desc: Regex component marker
  crit: suspicious
  conf: 0.96
  count_min: 3
  if:
    type: text
    word: build_wormlet_table
- id: lua-wormlet-config--rx-1--alt-2
  desc: Regex component marker
  crit: suspicious
  conf: 0.96
  count_min: 3
  if:
    type: text
    word: scm_wormlet_propagate_system
- id: lua-wormlet-config--rx-1--alt-3
  desc: Regex component marker
  crit: suspicious
  conf: 0.96
  count_min: 3
