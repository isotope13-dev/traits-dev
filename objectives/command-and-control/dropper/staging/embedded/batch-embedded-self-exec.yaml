# Batch-embedded payloads staged for self-execution. The carrier sits in an
# overlong trailing line of the batch itself and the launch target derives
# from the batch's own path, so the package runs wherever it is dropped
# with no external fetch and no literal payload path.
defaults:
  platforms: [windows]
  for: [batch]
  attack: T1027,T1059.003,T1620
composite_rules:
  - id: batch-embedded-gzip-self-exec
    desc: Batch stages embedded gzip payload for self-execution
    crit: hostile
    conf: 0.96
    all:
      - id: micro-behaviors/process/create/script/file::batch-self-derived-filename
      - id: micro-behaviors/data/encode/payload::batch-gzip-base64-carrier
      - id: objectives/anti-static/obfuscation/code-metrics/structure::last-line-over-1000
