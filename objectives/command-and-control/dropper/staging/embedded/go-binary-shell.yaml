defaults:
  # Every leg here is a Unix shell idiom (/bin/sh, chmod, rm -f); a Windows
  # PE never carries these, so `pe` was dead weight.
  platforms: [unix]
  for: [elf, macho]
  attack: T1059.004,T1564.001
  mbc: B0023

composite_rules:
  - id: native-hidden-temp-shell-exec-chain
    desc: Native binary embeds hidden temp shell staging
    crit: suspicious
    conf: 0.94
    all:
      # printf, echo, or dd — droppers stage via any of these redirects.
      - id: micro-behaviors/fs/write/file/redirect::shell-file-write-command
      - id: micro-behaviors/fs/chmod/executable/mode::chmod-exec-var-target
      - id: micro-behaviors/process/interpreter/shell::bin-sh
      - id: micro-behaviors/fs/delete/file/command::rm-force-variable-target
    any:
      - id: micro-behaviors/fs/path/temp::tmp-hidden-file
      - id: micro-behaviors/fs/path/temp::var-tmp-hidden
      - id: micro-behaviors/fs/path/temp::dev-shm-hidden--rx-1
    # Keep every step in one embedded command. Global Go package symbols do
    # not establish that a binary stages or executes the referenced script.
    near_bytes: 512
    unless:
      - id: well-known/tool/detection/
      # Capability probe, not staging: printf/echo of a no-op `exit 0`/`true`
      # shebang script (e.g. agent-deck's `.agent_deck_exec_probe.sh`). Real
      # droppers write a payload body instead.
      - id: micro-behaviors/fs/write/file/redirect::noop-exit-shebang-script-write
