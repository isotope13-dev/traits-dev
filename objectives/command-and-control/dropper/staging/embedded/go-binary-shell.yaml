defaults:
  platforms: [unix, windows]
  for: [elf, macho, pe]
  attack: T1059.004,T1564.001
  mbc: B0023

composite_rules:
  - id: native-hidden-temp-shell-exec-chain
    desc: Native binary embeds a hidden temporary shell execution chain
    crit: suspicious
    conf: 0.94
    all:
      - id: micro-behaviors/communications/http/download/cli::hidden-writable-output-path-script--temporary
      - id: micro-behaviors/fs/file/write/redirect::shell-printf-file-write
      - id: micro-behaviors/fs/chmod/executable/mode::chmod-exec-var-target
      - id: micro-behaviors/process/create/shell/spawn::bin-sh
      - id: micro-behaviors/fs/file/delete::rm-force-variable-target
    # Keep every step in one embedded command. Global Go package symbols do
    # not establish that a binary stages or executes the referenced script.
    near_bytes: 512
    unless:
      - id: well-known/tool/detection/
