defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
composite_rules:
  - id: js-base64-source-carrier
    desc: JavaScript hides code in Base64-like identifiers
    crit: hostile
    conf: 0.98
    attack: T1027.009
    for: [javascript]
    # Socket.dev CLI vendors large @inquirer bundles under @socketsecurity/registry;
    # those hit base64-like identifier metrics without being payload carriers.
    unless:
      - id: well-known/tool/development/socket-cli::socket-dev-cli-bundle
      - id: well-known/tool/development/socket-cli::socket-dev-cli-vendored-path
    all:
      - id: objectives/anti-static/obfuscation/payload/data-file::javascript-standalone-base64-carrier
      - id: metadata/file/metrics::javascript-base64-like-identifier-count

  - id: js-base64-comment-carrier
    desc: JavaScript hides a Base64 carrier as comment text
    crit: hostile
    conf: 0.97
    attack: T1027.009
    for: [javascript]
    all:
      - id: objectives/anti-static/obfuscation/payload/data-file::javascript-standalone-base64-carrier
      - id: micro-behaviors/data/encode/embedded::base64-like-comment-content

  - id: js-base64-opaque-identifier-carrier
    desc: JavaScript hides a carrier behind opaque identifiers
    crit: hostile
    conf: 0.98
    attack: T1027
    for: [javascript]
    all:
      - id: objectives/anti-static/obfuscation/payload/data-file::javascript-standalone-base64-carrier
      - id: metadata/file/metrics::high-entropy-identifier-ratio

  - id: js-base64-powershell-delegate-carrier
    desc: JavaScript carries an encoded PowerShell delegate stage
    crit: hostile
    conf: 0.99
    attack: "T1027,T1059.001"
    for: [javascript]
    all:
      - id: objectives/anti-static/obfuscation/payload/data-file::javascript-standalone-base64-carrier
      - id: objectives/anti-static/obfuscation/payload/data-file::encoded-powershell-delegate

  - id: js-reversed-base64-pe-dropper
    desc: JavaScript reversed base64 PE dropper
    crit: hostile
    conf: 0.96
    attack: T1027.013
    for: [javascript]
    all:
      - id: micro-behaviors/data/encode/embedded::reversed-pe-base64-header
      - id: micro-behaviors/data/string/concat::massive-concatenation-chain
  - id: js-reversed-base64-pe-carrier
    desc: JavaScript carries a reversed Base64-encoded PE stage
    crit: hostile
    conf: 0.98
    attack: T1027.009
    for: [javascript]
    all:
      - id: micro-behaviors/data/encode/embedded::reversed-pe-base64-header
      - id: metadata/file/metrics::single-long-line
      - id: micro-behaviors/data/encode/embedded::large-encoded-blob
      - id: micro-behaviors/data/encode/embedded::base64-like-comment-content
  - id: js-bun-dropper
    desc: JavaScript Bun runtime download and execution
    crit: suspicious
    conf: 0.95
    attack: T1105
    # Both legs must occur in the same JavaScript file. Archive-wide scope
    # combines unrelated installer documentation and test corpus entries.
    scope: file
    for:
      - javascript
    unless:
      - id: metadata/package/quality/benign-context::benign-app-fp-context
      - id: well-known/app/system/vellum::cli-package-context
      - id: well-known/lib/format/stacksjs-stacks::stacks-package-context
      - id: well-known/lib/format/stacksjs-stacks::fetched-dependency-path
      - id: well-known/lib/format/stacksjs-ts-cloud::ts-cloud-runtime-source-context
      - id: metadata/package/testing/
      - id: metadata/package/testing/presence/harness::test-fixture-directory-path
    all:
      - id: micro-behaviors/process/create/shell/bridge::js-bun-exec
    any:
      - id: micro-behaviors/os/package-manager/install::bun-installer-url
      - id: micro-behaviors/os/package-manager/install::bun-powershell-piped-installer-command
