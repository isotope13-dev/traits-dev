defaults:
  platforms: [macos]
  attack: "T1105"
traits: []
composite_rules:
  - id: macos-installer-stub
    desc: Generic macOS installer stub with auto-download
    crit: suspicious
    conf: 0.8
    all:
      - id: micro-behaviors/os/package-manager/install::download-config-url
      - id: micro-behaviors/os/package-manager/install::auto-download-launch
  - id: macos-installer-keychain-password
    desc: Installer stub reads keychain passwords
    crit: hostile
    conf: 0.96
    for: [dmg, macho, plist]
    scope: archive
    all:
      - id: micro-behaviors/os/security/keychain::seckeychain-find-generic-password-api
      - id: micro-behaviors/data/parse/vocabulary::password-key-value-pair
      - id: macos-installer-stub
  - id: macos-keychain-item-lifecycle
    desc: Adds modifies and deletes keychain items
    crit: hostile
    conf: 0.96
    for: [macho]
    all:
      - id: micro-behaviors/os/security/keychain::seckeychain-add-generic-password-api
      - id: micro-behaviors/os/security/keychain::seckeychain-item-modify-api
      - id: micro-behaviors/os/security/keychain::seckeychain-item-delete-api
  - id: macos-installer-login-keychain-delete
    desc: Installer deletes keychain at login path
    crit: hostile
    conf: 0.95
    for: [dmg, macho, plist, shell]
    scope: archive
    all:
      - id: micro-behaviors/communications/http/login::http-login-path
      - id: objectives/evasion/masquerade/brand/product::installer-named-bundle-executable
      - id: micro-behaviors/os/security/keychain::seckeychain-item-delete-api
