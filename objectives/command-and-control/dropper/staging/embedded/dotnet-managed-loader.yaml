defaults:
  platforms: [windows]
  for: [pe]

composite_rules:
  - id: dotnet-managed-resource-appdomain-stager
    desc: Unsigned .NET loader executes an opaque managed resource in memory
    crit: hostile
    conf: 0.99
    attack: "T1027.009,T1620"
    mbc: B0009.014
    all:
      - id: metadata/binary/framework::dotnet-assembly
      - id: metadata/binary/layout::pe-no-signature-record
      - id: metadata/binary/resource::dotnet-large-high-entropy-managed-resource
      - id: micro-behaviors/data/embedded/payload/resource::dotnet-managed-resource-access
      - id: objectives/anti-static/obfuscation/reflection/invoke::dotnet-currentdomain-type-invokemember
    unless:
      - id: metadata/signed/platform/
      - id: micro-behaviors/data/embedded/payload/resource::costura-bundle-marker

  - id: dotnet-dynamic-module-resource-stager
    desc: .NET resource stager dynamically resolves process modules
    crit: hostile
    conf: 0.97
    attack: "T1027.009,T1620"
    all:
      - id: metadata/binary/framework::dotnet-assembly
      - id: metadata/binary/resource::dotnet-large-high-entropy-managed-resource
      - id: micro-behaviors/data/embedded/payload/resource::dotnet-managed-resource-access
      - id: metadata/lang/compiler/managed::reflection-emit
      - id: micro-behaviors/process/interpreter/reflection/runtime::delegate-invocation-chain
      - id: micro-behaviors/os/api-resolution/dynamic::managed-module-base-address
      - id: micro-behaviors/os/api-resolution/dynamic::managed-process-module-reference
    unless:
      # The stock Microsoft NuGet client uses Reflection.Emit, embedded
      # resources, and Process-module APIs.  The engine's canonical signed
      # identity is the verified Microsoft platform composite; the old IDs
      # did not resolve to the emitted identity and therefore failed to exempt
      # this legitimate .NET tool.
      - id: metadata/signed/platform::microsoft
      - id: metadata/signed/leaf::microsoft-corporation
      - id: micro-behaviors/data/embedded/payload/resource::costura-bundle-marker
      - id: well-known/app/security/adguard-vpn::benign-context

  # Keep the network client in the same loader region as the decrypt and
  # dispatch APIs. Large VB applications can otherwise contribute a SOAP
  # client from unrelated decoy code and falsely turn a local resource
  # loader into a network loader. Structural file facts belong in the outer
  # rule because their synthetic spans cannot participate in code proximity.
  - id: encrypted-reflective-network-loader-api-cluster
    desc: Nearby VB.NET SOAP, decryptor, and reflective dispatch APIs
    crit: component
    conf: 0.95
    near_bytes: 32768
    all:
      - id: micro-behaviors/crypto/symmetric/decrypt::dotnet-create-decryptor
      - id: micro-behaviors/process/interpreter/reflection/runtime::activator
      - id: micro-behaviors/communications/http/client/managed::soap-http-client-protocol
      - id: micro-behaviors/process/interpreter/reflection/vb::vb-newlatebinding

  - id: encrypted-reflective-network-loader
    desc: Encrypted reflective .NET network loader
    crit: hostile
    conf: 0.99
    attack: T1027.009
    all:
      - id: metadata/binary/framework::dotnet-assembly
      - id: metadata/binary/resource::dotnet-large-high-entropy-managed-resource
      - id: encrypted-reflective-network-loader-api-cluster
    unless:
      - id: well-known/lib/core/baiqisoft::barcode-control-library-context
      - id: well-known/lib/core/baiqisoft::barcode-control-package-context
      - id: objectives/command-and-control/backdoor/control/desktop::dotnet-rat-controller-attack-suite
