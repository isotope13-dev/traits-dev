defaults:
  platforms: [windows]
  for: [pe]
  attack: T1027.009
  mbc: B0030
traits:
  - id: temp-exe-config-pair
    desc: Multiple temp EXE dropper configs
    crit: component
    conf: 0.96
    if:
      type: text
      regex: '\.exe\|True\|False\|False\|%Temp%\|False\|False\|False'

composite_rules:
  - id: dotnet-gzip-resource-temp-exec
    desc: .NET GZip resource temp execution dropper
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/data/embedded/payload/resource::dotnet-resource-reader-access
      - id: micro-behaviors/data/compress/library::dotnet-gzip-compression
      - id: micro-behaviors/fs/write/file/direct::dotnet-writeallbytes-token
      - id: micro-behaviors/process/create/spawn::dotnet-process-start-split-tokens
      - id: micro-behaviors/fs/path/temp::win-temp-env
      - id: temp-exe-config-pair
    unless:
      - id: metadata/signed/platform::microsoft-windows

  - id: dotnet-gzip-resource-reflective-stager
    desc: Unsigned .NET resource GZip stager writes and reflectively invokes a payload
    crit: hostile
    conf: 0.99
    attack: T1027.009,T1059,T1620
    all:
      - id: metadata/binary/framework::dotnet-assembly
      - id: metadata/binary/resource::clr-resource-high-entropy
      - id: metadata/binary/resource::clr-resource-large
      - id: micro-behaviors/data/embedded/payload/resource::dotnet-resource-reader-access
      - id: micro-behaviors/data/compress/library::dotnet-gzip-compression
      - id: micro-behaviors/fs/write/file/direct::dotnet-writeallbytes-token
      - id: micro-behaviors/process/interpreter/reflection/runtime::activator
      - id: micro-behaviors/process/interpreter/reflection/vb::vb-newlatebinding
      - id: temp-exe-config-pair
    unless:
      - id: metadata/signed/platform::microsoft-windows
      - id: micro-behaviors/data/embedded/payload/resource::costura-bundle-marker
