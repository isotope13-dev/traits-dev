# A native library that is really a self-contained stager: the payload it will
# run is compiled into it as an xxd-style byte array, it opens a file and
# fwrite()s that array back out to disk, and it then starts an interpreter on a
# pseudo-terminal (forkpty + exec*) so the dropped script gets an interactive
# session rather than a one-shot command.
#
# A library that only carries compiled-in data does not need forkpty; a library
# that only spawns helpers does not need a compiled-in script. Together with the
# file-write pair they describe unpack-and-run with an attached terminal, which
# is the shape of a bundled remote-shell host rather than of a helper library.
defaults:
  platforms: [unix, android]
  for: [elf, macho, so, dylib]
  attack: T1027.009,T1105,T1059.004
  mbc: B0023

composite_rules:
  - id: embedded-script-blob-pty-runner
    desc: Library drops an embedded script and runs it on a PTY
    crit: hostile
    conf: 0.96
    all:
      - id: micro-behaviors/data/embedded/payload/array::embedded-script-blob-export
      - id: micro-behaviors/fs/file/open::fopen
      - id: micro-behaviors/fs/file/write/direct::write--fwrite
      - id: micro-behaviors/process/tty/pty::forkpty
      - id: micro-behaviors/process/create/execv::c-exec-variants
