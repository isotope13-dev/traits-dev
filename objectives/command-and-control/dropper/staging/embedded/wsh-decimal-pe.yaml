# A script that carries a Windows PE as a decimal byte array and streams it to
# disk. The array spelling (77,90,144,0,...) needs no decoder, so the whole
# dropper is one ADODB.Stream write away from a file on disk -- no download, no
# base64, nothing for a network control to see.
#
# Written for the script hosts that reach ADODB.Stream, so the same rule covers
# the VBScript, JScript and HTA spellings of the technique.
defaults:
  platforms: [windows]
  for: [vbs, javascript, html, powershell, batch]
  attack: T1027,T1105
  mbc: C0045

composite_rules:
  - id: script-decimal-pe-stream-drop
    for: [batch, javascript, powershell, vbs]
    desc: Script streams a decimal-array PE to disk
    crit: hostile
    conf: 0.96
    all:
      - id: micro-behaviors/data/embedded/payload/array::decimal-mz-dos-header-array
    any:
      - id: micro-behaviors/fs/write/stream::wsh-savetofile
      - id: micro-behaviors/fs/write/file/stream::adodb-stream
      - id: micro-behaviors/fs/write/file/stream::vba-adodb-savetofile-call
    needs: 2

  # Dropping the payload onto a stock Windows utility is binary replacement:
  # the next time anything opens Notepad it runs the payload instead, and the
  # file keeps a path every allowlist already trusts.
  - id: script-pe-drop-over-system-binary
    for: [batch, javascript, powershell, vbs]
    desc: Script overwrites a System32 executable
    crit: hostile
    conf: 0.97
    attack: T1027,T1546
    all:
      - id: script-decimal-pe-stream-drop
      - id: micro-behaviors/fs/path/system::system32-executable-path
