defaults:
  platforms: [windows]
  for: [all]

composite_rules:
  - id: iso-wsh-script-stager
    desc: ISO stages a WSH script payload
    crit: hostile
    conf: 0.99
    attack: T1059.007,T1140,T1105
    all:
      - id: metadata/file/format/structured::primary-volume-descriptor
      - id: metadata/file/format/iso::iso-wsh-com-stream-marker
      - id: metadata/file/format/iso::iso-msxml-base64-marker
      - id: metadata/file/format/iso::iso-stream-text-eval-marker

  - id: iso-dotnet-resource-stager
    desc: ISO stages a .NET resource payload
    crit: hostile
    conf: 0.99
    attack: T1027,T1140,T1620
    all:
      - id: metadata/file/format/structured::primary-volume-descriptor
      - id: metadata/file/format/managed-runtime::embedded-dotnet-metadata-signature
      - id: metadata/file/format/managed-runtime::embedded-dotnet-resource-loader
      - id: metadata/file/format/managed-runtime::embedded-dotnet-reflection-marker
      - id: metadata/file/format/managed-runtime::embedded-dotnet-assembly-company-attribute

  - id: iso-dotnet-base64-resource-loader
    desc: ISO stages a Base64-decoded reflective .NET resource loader
    crit: hostile
    conf: 0.99
    attack: T1027,T1140,T1620
    all:
      - id: metadata/file/format/structured::primary-volume-descriptor
      - id: metadata/file/format/iso::iso-document-exe-lure
      - id: micro-behaviors/data/decode/base64::dotnet-frombase64string-text
      - id: metadata/file/format/managed-runtime::embedded-dotnet-resource-loader
      - id: metadata/file/format/managed-runtime::embedded-dotnet-reflection-marker

  - id: iso-vb6-helper-stager
    desc: ISO stages a document lure with VB6 dispatch helpers
    crit: hostile
    conf: 0.98
    attack: T1027,T1204.002
    all:
      - id: metadata/file/format/structured::primary-volume-descriptor
      - id: metadata/file/format/iso::iso-document-exe-lure
      - id: metadata/file/format/iso::iso-vb6-runtime-identity
      - id: metadata/file/format/iso::iso-vb6-runtime-helper-cluster
