defaults:
  crit: hostile
  platforms: [windows]
  for: [iso, data]

composite_rules:
  # A UDF image with this complete chain is a delivery container: the LNK
  # invokes a DLL export through cmd/rundll32 and the DLL is carried beside it.
  # Requiring both the parsed LNK behavior and the UDF member relationship
  # avoids upgrading a standalone administrative LNK or an ordinary DLL.
  - id: udf-lnk-bundled-dll-ordinal-loader
    desc: UDF image bundles LNK DLL ordinal loader
    conf: 0.99
    attack: T1059.003,T1218.011,T1204.002
    # Opaque UDF carriers are typed as data (not walked as ISO9660 archives),
    # so keep this on the outer image rather than archive-member scope.
    scope: outer
    all:
      - id: metadata/file/format/iso/payload::iso-lnk-cmd-prefix-utf16
      - id: metadata/file/format/iso/payload::udf-lnk-rundll32-utf16
      - id: metadata/file/format/iso/payload::iso-lnk-dll-ordinal-utf16

  - id: udf-lnk-shell32-icon-ordinal-loader
    desc: UDF LNK SHELL32 icon covers rundll32 ordinal launch
    conf: 0.99
    attack: T1059.003,T1218.011,T1036.007,T1204.002
    scope: outer
    all:
      - id: metadata/file/format/iso/payload::iso-lnk-cmd-prefix-utf16
      - id: metadata/file/format/iso/payload::udf-lnk-rundll32-utf16
      - id: metadata/file/format/iso/payload::iso-lnk-dll-ordinal-utf16
      - id: metadata/file/format/iso/payload::iso-lnk-shell32-icon-utf16

  - id: iso-wsh-script-stager
    desc: ISO stages a WSH script payload
    conf: 0.99
    attack: T1059.007,T1140,T1105
    all:
      - id: metadata/file/format/iso/structure::primary-volume-descriptor
      - id: metadata/file/format/iso/payload::iso-wsh-com-stream-marker
      - id: metadata/file/format/iso/payload::iso-msxml-base64-marker
      - id: metadata/file/format/iso/payload::iso-stream-text-eval-marker

  - id: iso-dotnet-resource-stager
    desc: ISO stages a .NET resource payload
    conf: 0.99
    attack: T1027,T1140,T1620
    all:
      - id: metadata/file/format/iso/structure::primary-volume-descriptor
      - id: metadata/file/format/managed-runtime::embedded-dotnet-metadata-signature
      - id: metadata/file/format/managed-runtime::embedded-dotnet-resource-loader
      - id: metadata/file/format/managed-runtime::embedded-dotnet-reflection-marker
      - id: metadata/file/format/managed-runtime::embedded-dotnet-assembly-company-attribute

  - id: iso-dotnet-base64-resource-loader
    desc: ISO stages a Base64-decoded reflective .NET resource loader
    for: [iso, data, pe]
    conf: 0.99
    attack: T1027,T1140,T1620
    all:
      - id: metadata/file/format/iso/structure::primary-volume-descriptor
      - id: metadata/file/format/iso/member::iso-document-exe-lure
      - id: micro-behaviors/data/decode/base64::dotnet-frombase64string-text
      - id: metadata/file/format/managed-runtime::embedded-dotnet-resource-loader
      - id: metadata/file/format/managed-runtime::embedded-dotnet-reflection-marker

  - id: iso-vb6-helper-stager
    desc: ISO stages a document lure with VB6 dispatch helpers
    conf: 0.98
    attack: T1027,T1204.002
    all:
      - id: metadata/file/format/iso/structure::primary-volume-descriptor
      - id: metadata/file/format/iso/member::iso-document-exe-lure
      - id: metadata/file/format/iso/payload::iso-vb6-runtime-identity
      - id: metadata/file/format/iso/payload::iso-vb6-runtime-helper-cluster

  # MotW-bypass delivery: a sparse image whose only payload is a PDF-named
  # executable. Kept under dropper/staging rather than lure/ so the naming
  # lure and the container staging signal live in different subdirectories.
  - id: iso-single-pdf-executable-lure
    desc: ISO delivers a single PDF-named executable lure
    conf: 0.97
    attack: T1036.007,T1204.002,T1553.005
    all:
      - id: metadata/file/format/iso/structure::primary-volume-descriptor
      - id: metadata/file/format/iso/member::iso-pdf-exe-member
      - id: metadata/file/format/iso/structure::single-payload-image
      - id: metadata/file/format/iso/structure::sparse-file-tree
      - id: metadata/file/format/iso/structure::contains-executable-member
