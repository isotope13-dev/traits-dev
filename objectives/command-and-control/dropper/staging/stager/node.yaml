# Node.js staging chain. JS equivalent of the Python staging composite:
# remote-fetched bytes are validated against an executable magic, written
# to a disposable temp file, executed hidden via spawn, then erased.
defaults:
  crit: hostile
  platforms: [windows]
  for: [javascript, typescript]
  attack: T1105
  mbc: B0023

composite_rules:
  # The write+rename+unlink + hidden-spawn shape is also exactly how a
  # well-behaved daemon does atomic state writes (tmp + rename), lock-file
  # cleanup, and detached self-respawn. The discriminator MUST be genuine
  # executable-payload evidence (PE/MZ magic check, .exe rename target, or
  # artifact-prefix masquerade) — `windowsHide`/`stdio:ignore` alone are
  # daemon-generic and were removed from the `any:` set.
  - id: node-pe-stager-chain
    desc: Node writes, renames, executes, and deletes an EXE payload
    conf: 0.97
    all:
      - id: micro-behaviors/fs/write/file/full/unspecified::write-file-sync
      - id: micro-behaviors/fs/file/rename::fs-rename-sync
      - id: micro-behaviors/process/fd/stdio::child-stdio-ignore-option
      - id: micro-behaviors/fs/delete/file/library::fs-unlinkSync
    any:
      - id: micro-behaviors/fs/file/rename::rename-target-exe-js
      - id: objectives/evasion/masquerade/file/prefix::artifact-prefix-masquerade
      - id: micro-behaviors/data/format/executable/header::js-pe-mz-check
    downgrade:
      any:
        - id: metadata/file/profile/execution-api::node-self-respawn
        - id: metadata/path/directory::test-directory-component
  - id: node-pe-magic-validated-stager
    desc: Node validates exec-format magic before staging payload
    conf: 0.97
    near_lines: 120
    all:
      - id: micro-behaviors/process/create/spawn
      - id: micro-behaviors/data/format/executable/header::js-pe-mz-check
    any:
      - id: metadata/file/profile/command-options::node-windowshide-true-option
      - id: micro-behaviors/process/fd/stdio::child-stdio-ignore-option
      - id: metadata/file/profile/command-options::detached-true
    downgrade:
      any:
        - id: metadata/path/directory::test-directory-component
  - id: node-artifact-masquerade-execution
    desc: Node artifact-prefix masqueraded temp file executed
    conf: 0.96
    all:
      - id: objectives/evasion/masquerade/file/prefix::artifact-prefix-masquerade
      - id: micro-behaviors/process/create/spawn
    downgrade:
      any:
        - id: metadata/path/directory::test-directory-component

  # Obfuscated launcher: a base64-concealed recon command is decoded and
  # executed while the same script respawns a staged child interpreter.
  # Decoding a command only to execute it establishes concealment; pairing
  # it with host recon and a staged relaunch establishes the stager role.
  - id: node-obfuscated-recon-exec-launch
    desc: Node executes obfuscated recon command and launches staged child
    conf: 0.98
    attack: T1033,T1059.007,T1027
    near_bytes: 2048
    all:
      - id: micro-behaviors/process/create/shell/command-string::js-exec
      - id: micro-behaviors/data/decode/base64::atob-decode
      - id: objectives/anti-static/obfuscation/encoding/base64::whoami-base64
      - id: metadata/file/profile/execution-api::node-interpreter-target
    downgrade:
      any:
        - id: metadata/path/directory::test-directory-component
