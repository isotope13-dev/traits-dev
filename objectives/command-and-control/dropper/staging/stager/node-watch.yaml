# Watch-gated Node.js stagers. Both shapes wait for a staged file to appear
# under a watched directory, read it, and execute its bytes — one through a
# Koffi-resolved RWX thread, the other through a silently loaded native
# addon. Ordinary file watchers (dev servers, test runners) reload or rebuild
# on change; they never combine arrival-gated reads with shellcode injection
# or silent native-addon loading.
defaults:
  platforms: [windows]
  for: [javascript, typescript]
  attack: T1055,T1105

composite_rules:
  # runhelper shape: the Koffi RWX-thread injection chain from
  # objectives/evasion/process/injection/shellcode plus a filesystem watch
  # that fires when the staged payload lands, plus deletion of the payload
  # once it has run.
  - id: node-watch-gated-ffi-shellcode-stager
    desc: Filesystem watch gates FFI shellcode staging
    crit: hostile
    conf: 0.98
    all:
      - id: objectives/evasion/process/injection/shellcode::koffi-rwx-thread-shellcode-loader
      - id: micro-behaviors/fs/watch::node-fs-watch-call
      - id: micro-behaviors/fs/delete/file/library::fs-unlinkSync
  # imgdecode shape: the file watches a staging directory, reads the staged
  # file, silently loads a platform prebuild addon (load failure swallowed),
  # and invokes required-module methods at top level. The silent prebuild
  # load is the discriminator: legitimate native consumers fail loudly when
  # their addon is missing.
  - id: node-watch-gated-native-addon-stager
    desc: Silently loaded native addon consumes watch-staged files
    crit: hostile
    conf: 0.97
    near_lines: 60
    all:
      - id: micro-behaviors/fs/watch::node-fs-watch-call
      - id: micro-behaviors/fs/read/file/full::readfilesync-call
      - id: micro-behaviors/os/module/require::prebuilds-silent-native-addon-loader
      - id: micro-behaviors/data/control-flow/module-exec::module-level-imported-method-call
