# PE dropper stubs that leave mustache install-path placeholders in .rdata
# ({{REG_PATH}}, {{BASE_VAR}}, …) instead of baking final persistence paths.
# Seen in packed GUI stubs that also carry a dominant high-entropy overlay and
# resolve Winsock/registry APIs at runtime.
defaults:
  platforms: [windows]
  for: [pe, dll]
  attack: T1027,T1547.001
  mbc: B0023

traits:
  - id: mustache-reg-path-placeholder
    desc: Mustache REG_PATH install template placeholder
    crit: suspicious
    conf: 0.95
    if:
      type: text
      exact: '{{REG_PATH}}'
  - id: mustache-reg-name-placeholder
    desc: Mustache REG_NAME install template placeholder
    crit: suspicious
    conf: 0.95
    if:
      type: text
      exact: '{{REG_NAME}}'
  - id: mustache-base-var-placeholder
    desc: Mustache BASE_VAR install template placeholder
    crit: suspicious
    conf: 0.94
    if:
      type: text
      exact: '{{BASE_VAR}}'
  - id: mustache-sub-fld-placeholder
    desc: Mustache SUB_FLD install template placeholder
    crit: suspicious
    conf: 0.94
    if:
      type: text
      exact: '{{SUB_FLD}}'
  - id: mustache-sub-nam-placeholder
    desc: Mustache SUB_NAM install template placeholder
    crit: suspicious
    conf: 0.94
    if:
      type: text
      exact: '{{SUB_NAM}}'
  - id: global-shard-mutex-v1
    desc: Global ShardMutex_v1 single-instance mutex name
    crit: notable
    conf: 0.92
    if:
      type: text
      exact: 'Global\ShardMutex_v1'

composite_rules:
  - id: pe-mustache-install-template-cluster
    desc: PE embeds clustered mustache install-path templates
    crit: suspicious
    conf: 0.96
    needs: 2
    any:
      - id: mustache-reg-path-placeholder
      - id: mustache-reg-name-placeholder
      - id: mustache-base-var-placeholder
      - id: mustache-sub-fld-placeholder
      - id: mustache-sub-nam-placeholder

  # Builder stub: unresolved mustache install paths plus a dominant opaque
  # overlay and process creation — the packed second-stage carrier shape.
  - id: mustache-templated-opaque-overlay-stub
    desc: Mustache-templated stub with opaque overlay payload
    crit: hostile
    conf: 0.97
    attack: T1027.009,T1547.001,T1106
    all:
      - id: pe-mustache-install-template-cluster
      - id: metadata/binary/layout::large-high-entropy-overlay
      - id: metadata/binary/layout::overlay-over-90pct
      - id: metadata/binary/layout::pe-no-signature-record
      - id: micro-behaviors/process/create/spawn::create-process-a
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/installer/

  # Same stub family when Winsock is held as a GetProcAddress string table
  # beside the mustache install templates (C2 after unpack).
  - id: mustache-templated-winsock-overlay-stub
    desc: Mustache stub resolves Winsock beside opaque overlay
    crit: hostile
    conf: 0.97
    attack: T1027.009,T1071.001,T1547.001
    all:
      - id: pe-mustache-install-template-cluster
      - id: micro-behaviors/communications/socket/init::ws2-startup-api-string
      - id: metadata/binary/layout::large-high-entropy-overlay
      - id: metadata/binary/layout::overlay-over-90pct
      - id: metadata/binary/layout::pe-no-signature-record
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/installer/
      - id: mustache-templated-opaque-overlay-stub
