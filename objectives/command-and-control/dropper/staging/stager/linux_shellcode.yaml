defaults:
  platforms: [unix, windows, macos]
composite_rules:
  - id: linux-shellcode-stager
    desc: Linux shellcode stager using FPU GetPC or WX mmap
    crit: hostile
    conf: 0.95
    attack: T1055
    mbc: B0004
    all:
      - id: objectives/anti-static/obfuscation/control-flow/getpc::fpu-getpc
      - id: micro-behaviors/mem/alloc/executable::mmap-exec
