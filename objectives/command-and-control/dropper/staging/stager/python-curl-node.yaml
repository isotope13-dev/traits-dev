defaults:
  platforms: [unix, windows]
  for: [python, whl]
  attack: T1105,T1059.007
  mbc: B0024,B0032

composite_rules:
  - id: silent-curl-node-loader
    desc: Silent handler masks a curl-to-Node loader
    crit: hostile
    conf: 0.97
    scope: archive
    all:
      - id: micro-behaviors/process/create/eval::python-curl-node-eval-proximity
      - id: micro-behaviors/data/control-flow/error-handling::silent-exception-pass
      - id: micro-behaviors/communications/http/services/cloud::github-pages
