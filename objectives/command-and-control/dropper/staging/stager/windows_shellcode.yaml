# Metasploit-style reverse_tcp stager: a ROR13 block_api resolver loads
# ws2_32, connects out, then allocates RWX memory for the stage it receives
# and jumps into it. Each leg is a code sequence, not a name or a metric, so
# the rule follows any template or loader that carries the stager bytes.
defaults:
  platforms: [windows]
  for: [pe, dll]
  arch: [x86]

composite_rules:
  - id: ror13-reverse-tcp-rwx-stager-x86
    desc: ROR13 TCP stager into RWX memory
    crit: hostile
    conf: 0.99
    attack: T1095,T1105,T1620
    mbc: B0032.014
    all:
      - id: objectives/anti-static/obfuscation/imports::ror13-peb-export-resolver-x86
      - id: micro-behaviors/communications/socket/init::ws2-32-stack-load-ror13-x86
      - id: micro-behaviors/communications/socket/connect::connect-ror13-hash-call-x86
      - id: micro-behaviors/mem/alloc/executable::virtualalloc-rwx-commit-ror13-x86
    unless:
      - id: metadata/signed/platform/
