# Producing raw opcode bytes at the command line: a short instruction sequence
# is piped into the assembler, disassembled to read back its encoding, and the
# object file deleted. The output is not a program anyone runs -- it is the
# byte string that gets pasted into a loader or a hook as `\x48\xb8...`.
#
# This is the authoring step for shellcode and for inline-hook trampolines,
# and it is what distinguishes it from ordinary compilation: a build produces
# an artifact and keeps it, while this produces a *listing* and throws the
# artifact away.
defaults:
  platforms: [unix]
  for: [shell]
  attack: T1027
  mbc: B0032

traits:
  - id: assembly-piped-to-assembler
    desc: Pipes inline assembly into the assembler
    crit: suspicious
    conf: 0.9
    if:
      # `printf '%s\n' 'movq $0x..., %rax; jmpq *%rax' | as` -- the assembly
      # never exists as a source file, so there is nothing to review. The
      # `(?s)` span covers the pipe-at-end-of-line continuation this idiom
      # is usually written with.
      type: text
      regex: '(?s)printf[^|]{0,120}\|\s{0,12}as\b'

  - id: disassemble-to-read-encoding
    desc: Disassembles freshly assembled output
    crit: notable
    conf: 0.85
    if:
      # `objdump -d a.out -Mintel` immediately after assembling: the point of
      # the exercise is the encoding column, not the program.
      type: text
      regex: '(?i)\bobjdump\s+-d\b'

composite_rules:
  - id: runtime-shellcode-byte-extraction
    desc: Assembles and disassembles to extract opcodes
    crit: suspicious
    conf: 0.93
    all:
      - id: assembly-piped-to-assembler
      - id: disassemble-to-read-encoding
