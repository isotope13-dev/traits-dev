defaults:
  platforms: [openbsd, bsd, unix]
  for: [python, pyc]
  attack: T1105

traits:
  - id: python-stage-fetch-execute
    desc: Python stage fetch execute
    crit: suspicious
    conf: 0.94
    if:
      type: text
      substr: fetch_and_execute_stages

composite_rules:
  - id: python-openbsd-fetch-exec-stage
    for: [python]
    desc: Python fetch exec stage
    crit: hostile
    conf: 0.98
    all:
      - id: python-stage-fetch-execute
      - id: micro-behaviors/communications/http/request/client::python-urlopen-agent-endpoint
