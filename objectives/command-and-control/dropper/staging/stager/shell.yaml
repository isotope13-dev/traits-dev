# Shell Stager Patterns
# Detects command substitution and inline execution for download-execute
# ATT&CK: T1059.004 (Unix Shell)
defaults:
  platforms: [unix, android, ios]
  for: [shell]
  attack: T1059.004
traits:
  - id: architecture-payload-to-variable
    desc: Architecture payload copied into variable file
    crit: suspicious
    conf: 0.96
    if:
      type: text
      regex: '\bcat\s+[A-Za-z0-9._/-]+\.\$[A-Za-z_][A-Za-z0-9_]*\s*>\s*\$[A-Za-z_][A-Za-z0-9_]*'
  - id: directory-write-test-before-copy
    desc: Tests directory writes before payload copy
    crit: suspicious
    conf: 0.92
    if:
      type: text
      regex: '(?m)^\s*if\s+cd\s+.{0,120}&&\s+touch\b.{0,120}(dd\s+if=/dev/zero|truncate\b)'
  - id: shell-c-curl-subshell
    desc: 'shell c curl subshell'
    crit: suspicious
    conf: 0.85
    if:
      type: text
      regex: 'shell\s+-c\s+.{0,10}\$\(curl'
  - id: sh-c-curl-subshell
    desc: 'sh c curl subshell'
    crit: notable
    conf: 0.85
    if:
      type: text
      regex: 'sh\s+-c\s+.{0,10}\$\(curl'
    unless:
      - id: metadata/build/recognized-contexts::benign-build-tooling-context
      - id: micro-behaviors/os/service/legitimate::installer-script
  - id: shell-c-wget-subshell
    desc: 'shell c wget subshell'
    crit: suspicious
    conf: 0.85
    if:
      type: text
      regex: 'shell\s+-c\s+.{0,10}\$\(wget'
  # --- Payload-generator scripts ------------------------------------------
  #
  # A generator script does not connect anywhere itself; it writes the program
  # that will. What gives it away is that the emitted program's callback
  # address is spliced in from the generator's own arguments -- the operator
  # runs `gen.sh <lhost> <lport> <outfile>` and gets a ready implant. The
  # `$1`/`${2}` inside a `connect()` argument list is the join between the two
  # programs and does not occur in a hand-written client, where the address is
  # either a literal or a variable with a name.
  - id: shell-emitted-payload-connect-target
    desc: Emitted payload connects to a script argument
    crit: suspicious
    conf: 0.93
    if:
      type: text
      # `.{0,2}` spans the optional quote in `connect(('$1', $2))` without
      # needing a quote character inside the pattern.
      regex: '\.connect\(\(.{0,2}\$\{?[0-9]'
  - id: shell-appends-payload-module
    desc: Shell appends a payload module to output
    crit: notable
    conf: 0.9
    if:
      # `cat modules/payload >> $3` -- the second half of a generator, bolting
      # a stored payload body onto the header it just wrote.
      type: text
      regex: '(?im)^\s*cat\s[^\n]{0,60}payload[^\n]{0,20}>>'
  - id: embedded-go-program-source
    desc: Shell script embeds a Go program
    crit: notable
    conf: 0.9
    if:
      # A `package main` / `func main()` pair inside a shell script is a whole
      # second program the script is carrying, not shell.
      type: text
      regex: '(?ms)^\s*package main\b[\s\S]{0,400}func main\('
  - id: generated-exec-shell-variable
    desc: Emitted program executes a shell variable
    crit: suspicious
    conf: 0.92
    if:
      # `exec.Command('${com}')` written out by the script: whatever the shell
      # read into `com` becomes the command the generated program runs. The
      # generator is building a command runner around operator input.
      type: text
      regex: 'exec\.Command\(.{0,2}\$\{?[A-Za-z_]'
composite_rules:
  # A program stashed under a configuration file's name and extension. Neither
  # half is odd alone -- scripts write config, and scripts embed helper
  # programs -- but writing a compilable program to /etc/*.conf is choosing a
  # location for concealment.
  - id: code-payload-staged-as-config-file
    desc: Stages program source under a config file path
    crit: suspicious
    conf: 0.92
    attack: T1036
    all:
      - id: micro-behaviors/fs/file/write/redirect::shell-heredoc-system-config-write
      - id: embedded-go-program-source
  # The generator asks the operator for a command and emits a program that
  # runs it -- the same generator shape as the reverse-shell rules above, with
  # a local command runner as the product instead of a socket client.
  - id: generated-command-runner-payload
    desc: Generates a program that runs a supplied command
    crit: suspicious
    conf: 0.9
    all:
      - id: generated-exec-shell-variable
      - id: micro-behaviors/process/create/eval::shell-heredoc
  # The generator emits a Python program that opens a socket and can run
  # commands. Writing that pair into a file is building a remote-shell
  # payload; nothing else assembles a socket client and `subprocess` into a
  # file it does not then run itself.
  - id: python-reverse-shell-payload-emitter
    desc: Shell script writes a Python remote-shell payload
    crit: hostile
    conf: 0.95
    mbc: B0030
    attack: T1059.004,T1059.006
    all:
      - id: micro-behaviors/fs/file/write/redirect::shell-echo-file-write
      - id: micro-behaviors/communications/socket/connect::socket-socket-call
      - id: micro-behaviors/communications/socket/connect::socket-connect-method
      - id: micro-behaviors/process/create/subprocess::import-subprocess
  # The same conclusion by a different route: the callback address is taken
  # from the generator's arguments, so the file being written is an implant
  # template rather than an ordinary script this one happens to create.
  - id: parameterized-reverse-shell-generator
    desc: Generates a remote shell with operator-supplied callback
    crit: hostile
    conf: 0.95
    mbc: B0030
    all:
      - id: shell-emitted-payload-connect-target
      - id: micro-behaviors/fs/file/write/redirect::shell-echo-file-write
    any:
      - id: micro-behaviors/process/create/subprocess::import-subprocess
      - id: shell-appends-payload-module
  - id: architecture-variable-payload-loader
    desc: Architecture-selected payload made executable and run
    crit: hostile
    conf: 0.99
    attack: T1059.004,T1222.002
    all:
      - id: architecture-payload-to-variable
      - id: micro-behaviors/fs/chmod/executable/mode::chmod-exec-var-target
      - id: micro-behaviors/process/create/local-exec::local-execution
      - id: micro-behaviors/fs/directory/delete::rm-rf
    near_lines: 20
  - id: writable-dir-payload-staging-loader
    desc: Writable-directory payload staging and execution
    crit: hostile
    conf: 0.99
    attack: T1059.004,T1222.002
    all:
      - id: micro-behaviors/fs/proc/mounts::noexec-mount-enumeration
      - id: micro-behaviors/fs/path/temp::temporary-directory-candidate-loop
      - id: directory-write-test-before-copy
      - id: micro-behaviors/fs/shell-ops::recursive-copy-variable-destination-portable
      - id: micro-behaviors/process/create/local-exec::local-execution
      - id: micro-behaviors/fs/directory/delete::rm-rf
  - id: shell-subshell-stager
    desc: Shell stager via command substitution
    crit: suspicious
    conf: 0.9
    any:
      - id: shell-c-curl-subshell
      - id: sh-c-curl-subshell
      - id: shell-c-wget-subshell
  - id: shell-ip-curl-subshell-loader
    desc: Shell executes IP curl payload
    crit: hostile
    conf: 0.98
    all:
      - id: sh-c-curl-subshell
      - id: micro-behaviors/communications/ip/literal::http-ip-url
      - id: micro-behaviors/communications/http/download/curl::curl-silent
  - id: bash-c-curl-ip-loader
    desc: Bash command loads IP payload
    crit: hostile
    conf: 0.98
    all:
      - id: sh-c-curl-subshell
      - id: micro-behaviors/process/create/shell/command-string::sh-c-exec
      - id: objectives/command-and-control/infrastructure/ip::ip-address-url
