defaults:
  platforms: [unix, windows]
  for: [makefile]
  attack: "T1105, T1620"
  mbc: "B0024, B0030"

traits:
  - id: remote-stage-host-setting
    desc: Makefile sets remote payload host
    crit: notable
    conf: 0.96
    if:
      type: text
      regex: '(?m)^DOWNLOAD_HOST\s*\?='
  - id: remote-stage-port-setting
    desc: Makefile sets remote payload port
    crit: notable
    conf: 0.96
    if:
      type: text
      regex: '(?m)^DOWNLOAD_PORT\s*\?='
  - id: remote-stage-path-setting
    desc: Makefile sets remote payload path
    crit: notable
    conf: 0.96
    if:
      type: text
      regex: '(?m)^DOWNLOAD_PATH\s*\?='
  - id: remote-stage-key-setting
    desc: Makefile sets remote payload key
    crit: notable
    conf: 0.96
    if:
      type: text
      regex: '(?m)^DOWNLOAD_KEY\s*\?='
  - id: downloader-stage-source
    desc: Makefile names downloader source stage
    crit: notable
    conf: 0.98
    if:
      type: text
      regex: '(?m)^STAGE0_SRCS\s*=.{0,120}\bdownloader\.c\b'
  - id: elf-loader-source-stage
    desc: Makefile names ELF loader source stage
    crit: notable
    conf: 0.98
    if:
      type: text
      regex: '(?m)^STAGE1_SRCS\s*=.{0,120}\belf_loader\.c\b'
  - id: shellcode-stager-target
    desc: Makefile names stager target
    crit: notable
    conf: 0.98
    if:
      type: text
      regex: '(?m)^STAGE0_TARGET\s*=\s*stager\b'
  - id: loader-target
    desc: Makefile names loader target
    crit: notable
    conf: 0.98
    if:
      type: text
      regex: '(?m)^STAGE1_TARGET\s*=\s*loader\b'
  - id: shellcode-output-target
    desc: Makefile emits shellcode binary
    crit: notable
    conf: 0.98
    if:
      type: text
      regex: '(?m)^SHELLCODE\s*=\s*stager\.bin\b'
  - id: random-xor-key-build
    desc: Makefile defines random XOR key
    crit: suspicious
    conf: 0.98
    if:
      type: text
      regex: 'XOR_KEY_VALUE\s*:=\s*\$\(shell python3 -c .{0,90}random\.randint'
  - id: xor-config-expression
    desc: Makefile encodes config with XOR
    crit: suspicious
    conf: 0.98
    if:
      type: text
      regex: 'hex\(ord\(c\)\^k\)'
  - id: encoded-host-define
    desc: Makefile passes encoded host to compiler
    crit: suspicious
    conf: 0.96
    if:
      type: text
      regex: 'ENCODED_HOST="\$\(XOR_HOST\)"'
  - id: config-xor-key-define
    desc: Makefile passes XOR key to compiler
    crit: suspicious
    conf: 0.96
    if:
      type: text
      regex: 'CONFIG_XOR_KEY=\$\(XOR_KEY_VALUE\)'

composite_rules:
  - id: makefile-remote-shellcode-stager
    desc: Makefile builds remote shellcode stager
    crit: hostile
    conf: 0.99
    all:
      - id: remote-stage-host-setting
      - id: remote-stage-port-setting
      - id: remote-stage-path-setting
      - id: remote-stage-key-setting
      - id: downloader-stage-source
      - id: elf-loader-source-stage
      - id: shellcode-stager-target
      - id: loader-target
      - id: shellcode-output-target
      - id: random-xor-key-build
      - id: xor-config-expression
      - id: encoded-host-define
      - id: config-xor-key-define
  - id: makefile-stripped-loader-artifact
    desc: Makefile emits stripped loader artifacts
    crit: hostile
    conf: 0.98
    all:
      - id: downloader-stage-source
      - id: elf-loader-source-stage
      - id: shellcode-stager-target
      - id: loader-target
      - id: metadata/build/make::strip-all-symbols-flag
      - id: metadata/build/make::objcopy-strip-debug-command
      - id: metadata/build/make::static-link-flag
