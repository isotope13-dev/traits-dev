# A dropper that runs its fetch through the shell: `cmd /c` launches the
# system rundll32 binary at a cleartext HTTP URL via WinExec. Each leg is
# ordinary alone -- shells launch, rundll32 runs applets, HTTP fetches -- but
# the four together in one unsigned PE describe the commodity
# download-staging chain (Elex burns sandbox time first with a loopback ping,
# then stages follow-on payloads from private-IP fallback URLs exactly this
# way), not administration. Family strings never gate here, so the next
# family reusing the chain trips the same verdict.
defaults:
  platforms: [windows]
  for: [pe, dll]
  attack: T1105,T1059
  conf: 0.93

composite_rules:
  - id: shell-rundll32-http-winexec-stager
    desc: Shell stages rundll32 HTTP payload
    crit: hostile
    all:
      - id: micro-behaviors/process/create/shell/command-mode::cmd-exe-c-command-text
      - id: micro-behaviors/process/create/launch::rundll32-exe-literal
      - id: micro-behaviors/communications/http/url/scheme::cleartext-http-url
      - id: micro-behaviors/process/create/exec::winexec
    unless:
      - id: metadata/signed/platform/
