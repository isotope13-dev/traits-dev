defaults:
  platforms:
  - unix
  - windows
  for:
  - zip
  - 7z
  attack: T1204.002,T1027
  mbc: B0024
  crit: hostile
composite_rules:
- id: zip-sole-macro-workbook
  desc: Sole archive member is a macro workbook
  conf: 0.95
  all:
  - id: metadata/archive/member/extension::archive-xlsm-member
  - id: metadata/archive/member/filename::archive-numeric-labeled-spreadsheet
  - id: metadata/archive/layout::archive-sole-member
- id: zip-ticket-macro-workbook
  desc: Ticket-numbered archive stages a macro workbook
  conf: 0.95
  all:
  - id: metadata/archive/member/extension::archive-xlsm-member
  - id: metadata/archive/member/filename::archive-ticket-labeled-spreadsheet
- id: zip-sole-ticket-macro
  desc: Sole member is a ticket-numbered macro workbook
  conf: 0.96
  all:
  - id: metadata/archive/member/extension::archive-xlsm-member
  - id: metadata/archive/member/filename::archive-ticket-labeled-spreadsheet
  - id: metadata/archive/layout::archive-sole-member
- id: zip-xlsm-vba-capable
  desc: Zip stages a VBA-capable XLSM workbook
  conf: 0.96
  scope: outer
  for:
  - zip
  - ooxml
  all:
  - id: metadata/archive/member/extension::archive-xlsm-member
  - id: metadata/document/office/macro::raw-excel-macro-capable-document
  unless:
  - id: metadata/archive/layout::archive-at-least-10-members
- id: zip-numeric-labeled-macro
  desc: Catalog-numbered archive stages a macro workbook
  conf: 0.95
  all:
  - id: metadata/archive/member/filename::archive-numeric-labeled-spreadsheet
  - id: metadata/archive/member/extension::archive-ooxml-macro-member
- id: zip-numeric-labeled-sole
  desc: Sole member is a catalog-numbered workbook
  conf: 0.94
  all:
  - id: metadata/archive/member/filename::archive-numeric-labeled-spreadsheet
  - id: metadata/archive/member/extension::archive-ooxml-macro-member
  - id: metadata/archive/layout::archive-sole-member
- id: zip-vba-macro-workbook
  desc: Archive stages a workbook with hidden VBA
  conf: 0.95
  scope: outer
  for:
  - zip
  - xlsx
  - ooxml
  unless:
  - id: metadata/archive/layout::archive-at-least-10-members
  all:
  - id: metadata/archive/member/extension::archive-xlsm-member
  - id: metadata/document/office/macro::ooxml-vba-nonstandard-part
- id: zip-vba-macro-lure
  desc: Macro workbook archive uses an Adobe lure
  conf: 0.94
  scope: outer
  for:
  - zip
  - xlsx
  all:
  - id: metadata/archive/member/extension::archive-ooxml-macro-member
  - id: objectives/evasion/decoy/document::lure-adobe-brand
  unless:
  - id: metadata/archive/layout::archive-at-least-10-members
- id: zip-sole-xlsx-stage
  desc: Sole archive member is an Excel workbook
  conf: 0.93
  all:
  - id: metadata/archive/member/extension::archive-xlsx-member
  - id: metadata/archive/layout::archive-sole-member
  any:
  - id: metadata/archive/encryption::archive-encrypted-member
  - id: metadata/archive/member/filename::archive-order-spreadsheet-member
  unless:
  - id: metadata/archive/layout::archive-at-least-10-members
  - id: metadata/package/testing/
  - id: metadata/path::test-directory-component
- id: encrypted-zip-xlsx-stage
  desc: Encrypted archive hides an Excel workbook
  conf: 0.95
  all:
  - id: metadata/archive/encryption::archive-encrypted-member
  - id: metadata/archive/member/extension::archive-xlsx-member
  unless:
  - id: metadata/archive/layout::archive-at-least-10-members
  - id: metadata/package/testing/
  - id: metadata/path::test-directory-component
- id: encrypted-zip-hashed-xlsx
  desc: Encrypted archive hides a hash-named workbook
  conf: 0.95
  all:
  - id: metadata/archive/encryption::archive-encrypted-member
  - id: metadata/archive/member/filename::archive-hashed-xlsx-member
  unless:
  - id: metadata/archive/layout::archive-at-least-10-members
  - id: metadata/package/testing/
  - id: metadata/path::test-directory-component
- id: zip-order-spreadsheet-lure
  desc: Archive stages an order-themed spreadsheet
  conf: 0.94
  all:
  - id: metadata/archive/member/filename::archive-order-spreadsheet-member
  - id: metadata/archive/member/extension::archive-ooxml-macro-member
  unless:
  - id: metadata/archive/layout::archive-at-least-10-members
  - id: metadata/package/testing/
  - id: metadata/path::test-directory-component
- id: zip-sole-order-spreadsheet
  desc: Sole member is an order-themed spreadsheet
  conf: 0.94
  all:
  - id: metadata/archive/member/filename::archive-order-spreadsheet-member
  - id: metadata/archive/member/extension::archive-xlsx-member
  - id: metadata/archive/layout::archive-sole-member
  unless:
  - id: metadata/archive/layout::archive-at-least-10-members
  - id: metadata/package/testing/
  - id: metadata/path::test-directory-component
- id: zip-numeric-labeled-xlsb
  desc: Catalog-numbered archive stages a binary workbook
  conf: 0.94
  all:
  - id: metadata/archive/member/filename::archive-numeric-labeled-spreadsheet
  - id: metadata/archive/member/extension::archive-xlsb-member
- id: zip-sole-xlsb-stage
  desc: Sole archive member is a binary workbook
  conf: 0.93
  all:
  - id: metadata/archive/member/extension::archive-xlsb-member
  - id: metadata/archive/member/filename::archive-numeric-labeled-spreadsheet
  - id: metadata/archive/layout::archive-sole-member
- id: zip-sole-numeric-bat
  desc: Sole archive member is a numeric batch
  conf: 0.95
  scope: outer
  for:
  - zip
  - batch
  all:
  - id: metadata/archive/member/filename::archive-numeric-bat-member
  - id: objectives/anti-static/obfuscation/string/fragmentation::batch-long-random-envvar-reassembly
  - id: metadata/archive/layout::archive-sole-member
- id: zip-obfuscated-numeric-bat
  desc: Numeric batch dropper rebuilds commands
  conf: 0.95
  scope: outer
  for:
  - zip
  - batch
  all:
  - id: metadata/archive/member/filename::archive-numeric-bat-member
  - id: objectives/anti-static/obfuscation/string/fragmentation::batch-long-random-envvar-reassembly
- id: zip-asm-bin-kit
  desc: Archive ships assembly with a .bin payload
  conf: 0.93
  all:
  - id: metadata/archive/member/extension::archive-asm-member
  - id: metadata/archive/member/extension::archive-bin-member
  unless:
  - id: well-known/app/ai/media/comfyui::comfyui-portable-archive-basename
  - id: metadata/package/manager::go-module-source-archive
  - id: metadata/package/testing/
  - id: metadata/path::test-directory-component
- id: zip-asm-bin-cluster
  desc: Archive ships assembly with several .bin files
  conf: 0.94
  all:
  - id: metadata/archive/member/extension::archive-asm-member
  - id: metadata/archive/member/extension::archive-bin-cluster
  unless:
  - id: metadata/package/manager::go-module-source-archive
  - id: metadata/package/testing/
  - id: metadata/path::test-directory-component
- id: zip-asm-boot-sector
  desc: Archive stages assembler boot-sector payloads
  conf: 0.95
  scope: outer
  for:
  - zip
  - 7z
  - data
  all:
  - id: metadata/archive/member/extension::archive-asm-member
  - id: metadata/file/format/native-executable::dos-boot-sector-ending-signature
  unless:
  - id: metadata/package/manager::go-module-source-archive
  - id: metadata/package/testing/
  - id: metadata/path::test-directory-component
- id: zip-asm-misplaced-payload
  desc: Archive hides assembler payloads off typical paths
  conf: 0.93
  all:
  - id: metadata/archive/member/extension::archive-asm-member
  - id: metadata/archive/layout::archive-misplaced-executable-member
  unless:
  - id: metadata/package/manager::go-module-source-archive
  - id: metadata/archive/layout::recognized-package-executable-context
  - id: metadata/package/testing/
  - id: metadata/path::test-directory-component
- id: truncated-xapk-manifest
  desc: XAPK zip holds only the split manifest
  conf: 0.94
  for:
  - zip
  all:
  - id: metadata/package/files/mobile-package::archive-android-apk-member
  - id: metadata/package/files/mobile-package::archive-android-config-split-apk
  - id: metadata/archive/layout::archive-sole-member
- id: truncated-xapk-version
  desc: Sole XAPK member declares split APK names
  conf: 0.94
  scope: outer
  for:
  - zip
  - json
  all:
  - id: metadata/package/files/mobile-package::xapk-version-json
  - id: metadata/package/files/mobile-package::archive-android-apk-member
  - id: metadata/archive/layout::archive-sole-member
- id: truncated-xapk-config
  desc: Sole XAPK member names a config split
  conf: 0.93
  scope: outer
  for:
  - zip
  - json
  all:
  - id: metadata/package/files/mobile-package::xapk-version-json
  - id: metadata/package/files/mobile-package::archive-android-config-split-apk
  - id: metadata/archive/layout::archive-sole-member
