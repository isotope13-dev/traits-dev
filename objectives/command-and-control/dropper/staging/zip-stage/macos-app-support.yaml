# A script pulls an executable out of a downloaded zip, copies it into the
# user's Application Support tree and runs it from there. Apps keep data in
# Application Support; a shell script placing and starting a fresh binary in
# it is choosing a location users rarely inspect.
defaults:
  platforms: [macos]
  for: [shell]
  attack: T1105,T1074.001,T1059.004

composite_rules:
  - id: macos-zip-binary-app-support-launch
    desc: Runs a zip-extracted binary from Application Support
    crit: suspicious
    conf: 0.9
    # The fetch, extract, chmod and launch are one short sequence. Without a
    # window the five legs matched anywhere in a 9,000-line installer script.
    near_bytes: 3000
    all:
      - id: micro-behaviors/fs/path/app-data::user-application-support-path
      - id: micro-behaviors/communications/http/curl::curl-command-call
      - id: micro-behaviors/fs/chmod/executable/mode::chmod-exec-var-target
      - id: micro-behaviors/process/create/local-exec::execute-quoted-var
    any:
      - id: micro-behaviors/data/archive/extract/zip::unzip-member-to-stdout
      - id: micro-behaviors/data/archive/extract/zip::unzip-archive-to-directory--rx-1
      - id: micro-behaviors/data/archive/extract/zip::unzip-command
