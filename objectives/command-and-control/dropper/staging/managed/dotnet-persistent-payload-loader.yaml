# A managed loader that decrypts and decompresses payload data before writing
# it, launching it without a window, and adding a logon Run-key reference.
defaults:
  platforms: [windows]
  for: [pe]

composite_rules:
- id: dotnet-encrypted-payload-hidden-runkey-loader
  desc: .NET decrypts, writes and hides a payload with Run-key persistence
  crit: hostile
  conf: 0.97
  attack: T1027,T1140,T1059.003,T1547.001
  all:
  - id: metadata/binary/framework::dotnet-metadata
  - id: micro-behaviors/communications/http/client/managed::webclient
  - id: micro-behaviors/data/decode/base64::dotnet-frombase64string-text
  - id: micro-behaviors/crypto/decrypt::dotnet-create-decryptor-text
  - id: micro-behaviors/data/codec::gzipstream-dotnet
  - id: micro-behaviors/fs/write/file/full::dotnet-writeallbytes-token
  - id: micro-behaviors/process/create/hidden::dotnet-create-no-window
  - id: micro-behaviors/os/registry/keys/autostart::currentversion-run-key-path
  - id: metadata/signed/trust-level::unsigned-missing-signature-record
  any:
  - id: metadata/binary/provenance/version-info::company-microsoft-corporation
  - id: micro-behaviors/process/enumerate/managed::get-processes-by-name
