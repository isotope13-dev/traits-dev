# A managed downloader fetches a Base64-encoded payload over HTTP, decodes it,
# writes the bytes to disk and launches the result without a console window.
# Each leg is ordinary alone; together in one unsigned binary they are a
# covert first-stage installer: the download never lands on disk in runnable
# form, the drop evades static inspection, and the hidden launch keeps the
# payload off the visible desktop.
defaults:
  platforms: [windows]
  for: [pe, dll]
  attack: T1105,T1027.009
composite_rules:
  - id: dotnet-fetch-decode-drop-hidden-exec
    desc: Managed fetch, decode, file drop and hidden launch
    crit: hostile
    conf: 0.93
    all:
      - id: micro-behaviors/communications/http/client/managed::downloadstring
      - id: micro-behaviors/data/decode/base64::dotnet-frombase64string-text
      - id: micro-behaviors/fs/write/file/full::dotnet-writeallbytes-token
      - id: micro-behaviors/process/create/hidden::dotnet-hidden-process-launch-setup
    unless:
      - id: metadata/signed/platform/
      - id: well-known/app/
      - id: well-known/lib/
