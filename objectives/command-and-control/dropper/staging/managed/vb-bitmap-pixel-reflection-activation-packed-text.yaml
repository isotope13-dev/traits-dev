defaults:
  platforms: [windows]
  for: [pe]
  attack: T1027.003,T1620
composite_rules:
  - id: vb-bitmap-pixel-reader-with-reflection-activation-and-packed-text
    desc: VB.NET bitmap pixels, reflection activation, packed text
    crit: hostile
    conf: 0.82
    all:
      - id: micro-behaviors/ui/graphics/image::dotnet-bitmap-resource-pixel-api-references
      - id: micro-behaviors/metaprogramming/reflection::get-assembly-token
      - id: metadata/binary/symbols/name::dotnet-create-instance-method-name
      - id: micro-behaviors/process/interpreter/reflection/vb::vb-latecall-token
      - id: objectives/anti-static/pack/entropy::dotnet-large-packed-text
    unless:
      - id: metadata/signed/platform/
