defaults:
  platforms: [windows]
  for: [pe]
  attack: T1027.003,T1620
composite_rules:
  - id: dotnet-bitmap-pixel-reader-with-reflection-activation-and-packed-text
    desc: .NET bitmap pixels, reflection activation, packed text
    crit: hostile
    conf: 0.96
    all:
      - id: micro-behaviors/ui/graphics/image::dotnet-bitmap-resource-pixel-api-references
      - id: micro-behaviors/metaprogramming/reflection::get-assembly-token
      - id: metadata/binary/symbols/name/token::dotnet-create-instance-method-name
      - id: micro-behaviors/metaprogramming/reflection::activator
      - id: metadata/binary/section/entropy::dotnet-large-high-entropy-text
    unless:
      - id: metadata/signed/platform/
