# A VB.NET stub that carries one very large, near-random managed resource,
# inflates it with GZipStream, writes the result to disk with WriteAllBytes
# and starts it through late-bound reflection (AppDomain, Activator). The
# resource is the real program; the stub only unwraps and runs it, and the
# file name it writes is what the lure advertises.
defaults:
  platforms: [windows]
  for: [pe]
  attack: T1027.009,T1140,T1204.002
composite_rules:
  - id: vbnet-large-encrypted-resource-gzip-writer
    desc: VB.NET stub inflates a huge encrypted resource to disk
    crit: hostile
    conf: 0.9
    all:
      - id: metadata/binary/resource/size::dotnet-large-high-entropy-managed-resource
      - id: micro-behaviors/data/codec::gzipstream-dotnet
      - id: micro-behaviors/fs/write/file/full::dotnet-writeallbytes-token
      - id: micro-behaviors/process/interpreter/reflection/vb::vb-newlatebinding
      - id: micro-behaviors/process/interpreter/runtime/clr::appdomain-currentdomain
    unless:
      - id: metadata/signed/platform/
      - id: metadata/package/testing/
