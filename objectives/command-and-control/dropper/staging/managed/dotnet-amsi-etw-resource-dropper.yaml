# .NET droppers that blind AMSI/ETW then decrypt an embedded manifest resource.
defaults:
  platforms: [windows]
  for: [pe, dll]
  attack: T1027,T1562.001,T1562.006
  crit: hostile
  conf: 0.98

traits:
  - id: dotnet-patch-amsi-method-name
    desc: Managed PatchAmsi method name
    crit: notable
    conf: 0.95
    if:
      type: text
      word: PatchAmsi

  - id: dotnet-patch-etw-method-name
    desc: Managed PatchEtw method name
    crit: notable
    conf: 0.95
    if:
      type: text
      word: PatchEtw

  - id: dotnet-encrypted-payload-resource-name
    desc: Encrypted payload.enc resource name
    crit: notable
    conf: 0.94
    if:
      type: text
      exact: payload.enc

composite_rules:
  - id: dotnet-managed-amsi-etw-blinding
    desc: .NET implements AMSI and ETW memory blinding
    all:
      - id: metadata/binary/framework::dotnet-assembly
      - id: micro-behaviors/os/security/amsi::dll-reference
      - id: micro-behaviors/os/telemetry/logging/etw::etw-event-write-str
    any:
      - id: dotnet-patch-amsi-method-name
      - id: micro-behaviors/mem/protect/modify::virtual-protect-text-pe
    unless:
      - id: metadata/signed/platform/

  - id: dotnet-amsi-etw-encrypted-resource-dropper
    desc: .NET blinds AMSI and ETW then decrypts embedded payload
    all:
      - id: metadata/binary/framework::dotnet-assembly
      - id: metadata/binary/resource/entropy::clr-resource-high-entropy
      - id: micro-behaviors/os/security/amsi::amsi-library-reference
      - id: micro-behaviors/os/security/amsi::amsi-scan-buffer-reference
      - id: micro-behaviors/os/telemetry/logging/etw::etw-event-write-str
      - id: micro-behaviors/data/embedded/payload/resource::dotnet-managed-resource-access
      - id: dotnet-patch-amsi-method-name
      - id: dotnet-patch-etw-method-name
      - id: dotnet-encrypted-payload-resource-name
    unless:
      - id: metadata/signed/platform/
