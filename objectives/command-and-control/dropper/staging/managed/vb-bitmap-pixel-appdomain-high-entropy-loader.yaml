# A Visual Basic .NET program with very high code entropy that reads pixels
# from a resource bitmap and loads assemblies through AppDomain reflection
# unpacks a payload hidden in an image; the high-entropy body is the packed
# payload and the VB late-binding helpers hide the final call.
defaults:
  platforms: [windows]
  for: [pe]
  attack: T1027.003,T1620
composite_rules:
  - id: vb-bitmap-pixel-reader-with-appdomain-load-and-packed-body
    desc: VB.NET bitmap pixel loader with packed body
    crit: hostile
    conf: 0.85
    all:
      - id: micro-behaviors/data/embedded/payload/image::dotnet-resource-bitmap-pixel-readback
      - id: micro-behaviors/process/interpreter/reflection/runtime::appdomain-currentdomain
      - id: micro-behaviors/process/interpreter/reflection/vb::vb-latecall-token
      - id: metadata/binary/code/entropy::code-entropy-over-7p4
    unless:
      - id: metadata/signed/platform/
