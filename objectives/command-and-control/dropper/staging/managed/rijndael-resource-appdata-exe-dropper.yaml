# A .NET dropper keeps its payload as a large high-entropy managed resource,
# decrypts it with Rijndael, writes the bytes to a file under the user's
# AppData or its own folder, and records the install choices in an
# arrow-delimited "name.exe-=>True-=>False" config string. Legitimate
# programs do not hide an executable in an encrypted resource and write it
# back out.
defaults:
  platforms: [windows]
  for: [pe]
  attack: T1027.009,T1140,T1204.002
composite_rules:
  - id: dotnet-rijndael-resource-appdata-exe-dropper
    desc: .NET decrypts resource and writes exe config to AppData
    crit: hostile
    conf: 0.88
    all:
      - id: micro-behaviors/data/embedded/payload/resource::dotnet-resource-reader-access
      - id: micro-behaviors/crypto/decrypt::dotnet-rijndael-decryptor
      - id: micro-behaviors/fs/write/file/full::dotnet-writeallbytes-token
      - id: micro-behaviors/os/env/user-paths::appdata-path-lookup
      - id: objectives/command-and-control/dropper/staging/runtime::arrow-delimited-config
    unless:
      - id: metadata/signed/platform/
