# A VB.NET stub that reads a manifest resource, decodes it from base64,
# inflates it with GZipStream and then locates the entry point of the
# resulting assembly is a layered loader: the real program never exists as a
# file or as plain bytes in the stub. Legitimate resource use does not
# invoke the entry point of what it unpacks.
defaults:
  platforms: [windows]
  for: [pe]
  attack: T1027.009,T1140,T1620
composite_rules:
  - id: dotnet-base64-gzip-resource-entrypoint-invoke
    desc: .NET base64 and gzip resource run by entry point
    crit: hostile
    conf: 0.88
    all:
      - id: micro-behaviors/data/embedded/payload/resource::dotnet-getmanifestresourcestream
      - id: micro-behaviors/data/decode/base64::dotnet-frombase64string-text
      - id: micro-behaviors/data/codec::gzipstream-dotnet
      - id: micro-behaviors/process/interpreter/reflection/runtime::get-entrypoint-token
    unless:
      - id: metadata/signed/platform/
      # Squirrel.Windows updaters embed compressed managed resources and
      # bootstrap them through the entry point as their normal update
      # function; the vendor assembly identity names that context.
      - id: well-known/lib/platform/squirrel::squirrel-vendor-binary-context
      # A large decompiler assembly names these APIs in unrelated members.
      - id: well-known/tool/reverse-engineering/corvus::corvus-reverse-engineering-tool
      # .NET single-file bundles: GetManifestResourceStream, FromBase64String,
      # GZipStream and GetEntryPoint appear across the dozens of embedded
      # assemblies (resource loaders, compression libs, the runtime itself),
      # so the cluster is library co-occurrence there, not one stub's loader
      # chain. The bundle startup entry is the layout marker.
      - id: micro-behaviors/process/interpreter/runtime/clr::hostfxr-startup-entrypoint-reference
      # A mod scanner's rule text names these APIs together; that catalog is
      # not one stub decoding a resource and calling its entry point.
      - id: well-known/tool/detection/defensive-scanner-context::mod-assembly-malware-scanner
