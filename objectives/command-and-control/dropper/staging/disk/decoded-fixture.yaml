# An embedded, codec-encoded payload dropped to a file and executed through
# a shell. The test-fixture rules under supply-chain convict the trojanized
# test harness; this one states the dropper mechanics from the C2 side -- a
# decode macro, an overwrite-mode file write, and system() on the result is
# an embedded-payload drop regardless of which source file carries it.
#
# Worked example: the trojanized sendmail libsm `t-shm.c` fixture, whose
# six-bit `SM_decode()` writes `./test` and runs `system("sh ./test ...")`.
defaults:
  platforms: [linux, unix]
  for: [c, cpp]
  attack: T1105,T1027
  mbc: E1105,B0032

composite_rules:
  - id: decoded-blob-dropped-and-shelled
    desc: Decoded blob written to disk and shelled
    crit: hostile
    conf: 0.96
    all:
      - id: objectives/supply-chain/hidden-payload/test-fixture::six-bit-codec-macro
      - id: micro-behaviors/fs/file/write/direct::c-fopen-overwrite-mode
      - id: micro-behaviors/process/create/shell/spawn::system-fn
