# Payload staging into a bare hex-named ProgramData subdirectory. Legitimate
# installers name their ProgramData directories after the product; a hex blob
# with no vendor prefix is the camouflage shape used by ClickFix/TerminalFix
# stagers and payload-only families that want a permanent, hidden-looking
# slot outside TEMP.
defaults:
  platforms: [windows]
  for: [powershell, batch, pe, dll, python, c, cpp, csharp, rust, go]
  attack: T1105,T1074.001

traits:
  - id: programdata-hex-staging-dir
    desc: Hex-named ProgramData staging directory
    crit: notable
    conf: 0.85
    if:
      type: text
      regex: '(?i)(\\ProgramData\\|%ProgramData%\\)[0-9a-f]{8,32}\b'
