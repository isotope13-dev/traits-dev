# Node.js AES stagers that resolve another package's directory, decrypt an
# encrypted blob staged there with AES-256-CBC, write the plaintext to
# disk, and delete the encrypted source. Crypto providers call ciphers and
# installers resolve module paths, but no legitimate asset step combines
# cross-package path resolution, AES-CBC decryption, a staged write, and
# removal of the encrypted original within one routine.
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
  attack: T1027,T1140,T1070.004
  mbc: B0024

composite_rules:
  - id: node-cross-package-aes-stage-cleanup
    desc: Cross-package AES-decrypted file staged with source removal
    crit: hostile
    conf: 0.97
    scope: file
    near_lines: 40
    all:
      - id: micro-behaviors/crypto/symmetric/decrypt::createDecipheriv
      - id: micro-behaviors/crypto/symmetric/aes/runtime-library::aes-256-cbc-dash
      - id: micro-behaviors/fs/write/file/full::node-write-file-sync-call
      - id: micro-behaviors/os/module/require::node-require-resolve-call
      - id: micro-behaviors/fs/delete/file/library::fs-unlinkSync
    unless:
      - id: metadata/package/testing/
      - id: "metadata/file/naming::test-directory-component"
