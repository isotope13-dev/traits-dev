# Windows Node stager: Base64-decoded bytes are written under the browser
# cache and then run by a selected Python interpreter with no visible window,
# attached stdio, or parent-process lifetime. The cache path plus hidden,
# detached interpreter launch distinguishes this from application-managed
# Python environments and ordinary downloaded-script installers.
defaults:
  platforms: [windows]
  for: [javascript, typescript]
  attack: "T1059.006,T1140,T1564.003"

composite_rules:
  - id: node-base64-inetcache-hidden-python-stage
    desc: Node stages Base64 in INetCache for hidden Python execution
    crit: hostile
    conf: 0.995
    scope: file
    near_lines: 100
    all:
      - id: micro-behaviors/data/decode/base64::buffer-from-base64
      - id: micro-behaviors/fs/file/write/direct::node-write-file-sync
      - id: micro-behaviors/fs/path/cache::windows-inetcache-path-text
      - id: micro-behaviors/process/interpreter/embedded-python::node-spawn-python-identifier
      - id: micro-behaviors/process/create/spawn::detached-true
      - id: micro-behaviors/process/create/spawn::stdio-ignore
      - id: micro-behaviors/process/create/spawn::windowshide-option
