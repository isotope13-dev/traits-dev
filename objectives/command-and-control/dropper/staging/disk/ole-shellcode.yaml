defaults:
  platforms: [windows]
  for: [oledoc]
  attack: T1204.002
  conf: 0.98
composite_rules:
  - id: ole-embedded-pe-file-dropper
    desc: OLE shellcode drops embedded executable
    crit: hostile
    all:
      - id: metadata/document/ole::ole-embedded-pe
    any:
      - id: micro-behaviors/process/create/embedded::ole-shellcode-file-drop-exec
      - id: micro-behaviors/process/create/embedded::ole-shellcode-decoder-loop
      - id: micro-behaviors/process/create/embedded::ole-shellcode-cmd-exec
      - id: micro-behaviors/os/api-resolution/hash-based::ole-export-hash-resolver

