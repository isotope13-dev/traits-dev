# Native payload staged under the WinInet cache directory and launched via
# ProcessBuilder with stdout discarded — a common Java dropper camouflage path.
defaults:
  platforms: [windows]
  for: [class, java_class, jar, zip]
  attack: T1059,T1105,T1036.005

composite_rules:
  - id: java-inetcache-silent-exe-stager
    desc: Java writes exe to INetCache and starts it silently
    crit: hostile
    conf: 0.97
    all:
      - id: micro-behaviors/fs/path/cache::windows-inetcache-path
      - id: micro-behaviors/fs/path/extension::java-executable-reference
      - id: metadata/import/jvm::jvm-fileoutputstream-bytecode
      - id: metadata/file/profile/process::java-processbuilder-start-bytecode
      - id: metadata/import/jvm::java-processbuilder-redirect-output
    unless:
      - id: metadata/package/testing/
      - id: metadata/file/profile/security-scanner/
      - id: metadata/path/directory::test-directory-component
