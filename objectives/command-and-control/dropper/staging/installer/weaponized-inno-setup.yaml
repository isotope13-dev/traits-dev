defaults:
  platforms: [windows]
  for: [pe]
  crit: hostile
  conf: 0.95

composite_rules:
- id: generated-inno-offer-loader
  desc: Generated Inno offer-loader lure wrapper
  crit: hostile
  conf: 0.99
  attack: T1036.005,T1105,T1204.002
  size_min: 1800000
  size_max: 2400000
  all:
  - id: objectives/evasion/masquerade/keywords/spoof::inno-pirated-executable-lure-wrapper
  - id: metadata/binary/installer/family::inno-670-stock-loader-imphash
  - id: metadata/binary/resource/identity::pe-description-equals-product-name
  - id: metadata/binary/installer/family::inno-delphi-installer-foundation
- id: weaponized-inno-setup-dropper
  desc: Weaponized Inno Setup dropper with COM automation
  crit: hostile
  conf: 0.99
  all:
  - id: metadata/binary/installer/script::inno-setup
  - id: micro-behaviors/crypto/kdf/algorithm::inno-pbkdf2-safearray-context
  any:
  - id: metadata/binary/section/entropy::reloc-entropy-at-least-6p8
  - id: metadata/binary/layout/checksum::pe-checksum-zeroed
# The Python-payload twin of the COM dropper above for installers that stage
# a runtime instead of automating one: an Inno host whose dominant payload
# region embeds a Python bytecode ZIP that no tool can open (headers without
# a central directory), so the staged code cannot be listed or extracted.
- id: inno-setup-truncated-python-staging
  desc: Inno stages unopenable Python archive
  crit: hostile
  conf: 0.95
  attack: T1027.009,T1204.002
  all:
  - id: well-known/tool/packaging/inno-setup::inno-setup-installer-context
  - id: micro-behaviors/data/embedded/payload/installer::truncated-embedded-zip
  - id: metadata/package/files/name::zipimport-bytecode-member
  - id: metadata/binary/layout/overlay::overlay-dominates-80pct
- id: self-issued-chrome-opaque-inno-dropper
  desc: Self-issued Chrome-branded Inno opaque dropper
  crit: hostile
  conf: 0.99
  attack: T1027.009,T1036.005,T1106
  mbc: B0032
  all:
  - id: metadata/package/versioning/scheme::pe-product-name-chrome
  - id: metadata/package/versioning/scheme::pe-file-description-chrome-setup
  - id: metadata/binary/installer/family::inno-delphi-installer-foundation
  - id: metadata/signed/certificate/chain::pe-cert-leaf-self-issued
  - id: metadata/binary/layout/overlay::high-entropy-overlay
  - id: metadata/binary/layout/overlay::large-overlay-1mb
  - id: micro-behaviors/os/com/array::safearray-data-manipulation-cluster
  - id: micro-behaviors/process/create/spawn::create-process-w
