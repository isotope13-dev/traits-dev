# The NSIS script of this homepage-hijacker build (a hidden "Internat
# Explorer" folder, a tt265.net shortcut, a self-deleting batch file) is
# LZMA-compressed, so no string in it can be scanned. The first header does
# carry the script and archive sizes in the clear; every build from this
# generator shares them, with the same solid-LZMA properties that follow.
defaults:
  platforms: [windows]
  for: [pe]
  attack: T1176,T1547
traits:
  - id: nsis-first-header-hijacker-build-sizes
    desc: NSIS first header with hijacker build sizes
    crit: suspicious
    conf: 0.85
    if:
      type: hex
      section: overlay
      pattern: 'EF BE AD DE 4E 75 6C 6C 73 6F 66 74 49 6E 73 74 75 11 00 00 18 27 00 00 5D 00 00 80'
