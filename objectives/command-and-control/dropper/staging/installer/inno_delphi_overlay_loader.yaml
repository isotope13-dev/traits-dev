defaults:
  platforms: [windows]
  for: [pe]
  crit: notable
  conf: 0.9

traits:
- id: nvidia-driver-loader-banner
  desc: Driver-themed loader banner
  crit: suspicious
  conf: 0.94
  if:
    type: text
    regex: (?i)Nvidia driver loader,\s+version
composite_rules:
- id: inno-blank-section-process-stager
  desc: Inno blank-section payload with process and thread staging
  crit: hostile
  conf: 0.98
  attack: T1027.009,T1106,T1055.003
  all:
  - id: objectives/anti-static/obfuscation/payload/encrypted::inno-blank-exec-opaque-payload
  - id: micro-behaviors/process/create/spawn::create-process-w
  - id: micro-behaviors/process/info/thread::suspend-thread-import
  - id: micro-behaviors/process/info/thread::resume-thread-import
  unless:
  - id: metadata/signed/platform/

- id: inno-driver-themed-loader
  desc: Driver-themed Inno/Delphi loader profile
  crit: suspicious
  conf: 0.95
  all:
  - id: metadata/binary/installer/family::inno-delphi-installer-foundation
  - id: nvidia-driver-loader-banner
  any:
  - id: metadata/binary/installer/runtime::winhttp-system32-manifest
  - id: metadata/lang/compiler/managed::embarcadero-delphi-compiler-banner
- id: inno-fake-system-service-stage-loader
  desc: Inno overlay stages payload behind a fake Windows service identity
  crit: hostile
  conf: 0.995
  ref: sha256:f7a110efa09467da041b7abbd4a0cbbe67e804e78630af22fa8564038576a856
  attack: T1036.005,T1027.009,T1106
  all:
  - id: objectives/evasion/masquerade/identity/app::pim-index-maintenance-description-claim
  - id: metadata/binary/installer/family::inno-delphi-installer-foundation
  - id: metadata/binary/layout/ratio::overlay-over-90pct
  - id: metadata/signed/trust-level::unsigned-missing-signature-record
  - id: metadata/binary/layout/checksum::pe-checksum-zeroed
  - id: micro-behaviors/os/com/array::safearray-data-manipulation-cluster
  - id: micro-behaviors/crypto/kdf/algorithm::pbkdf2
  - id: micro-behaviors/process/create/spawn::create-process-w
  unless:
  - id: metadata/signed/platform/
  - id: metadata/signed/certificate/identity::open-source-developer-leaf-subject
  - id: metadata/signed/leaf::johannes-schindelin
