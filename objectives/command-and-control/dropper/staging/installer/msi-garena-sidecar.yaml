defaults:
  platforms: [windows]
  for: [oledoc]
  attack: T1204.002,T1027.009

composite_rules:
  - id: renamed-garena-loader-with-opaque-sidecars
    desc: MSI launches renamed Garena loader with opaque payload sidecars
    crit: hostile
    conf: 0.995
    all:
      - id: metadata/file/profile/installer-layout::msi-garena-voice-library-layout
      - id: metadata/file/profile/installer-layout::msi-garena-loader-opaque-sidecars
      - id: metadata/file/profile/installer-layout::msi-termina-random-source-alias
      - id: metadata/binary/installer/database::msi-localappdata-install-root
      - id: micro-behaviors/process/create/installer::msi-launchfile-custom-action
