defaults:
  platforms: [windows]
  for: [pe]
  attack: T1218
  mbc: B0024
traits:
- id: cmd-comspec-pipe-launch
  desc: Cmd pipes staged file to shell interpreter
  crit: suspicious
  conf: 0.99
  for: [pe, batch, cmd]
  if:
    type: text
    regex: '(?i)\bcmd\s+/c\s+\w{3,16}\s*&\s*type\s+\S+\.\w{2,6}\s*\|\s*(%comspec%|cmd)\b'
- id: dropped-aiff-stage
  desc: Dropped AIFF stage filename
  crit: notable
  conf: 0.96
  if:
    type: text
    exact: Dropped.aiff
- id: advpack-delnode-rundll32
  desc: Rundll32 advpack DelNode cleanup
  crit: suspicious
  conf: 0.95
  count_min: 2
  if:
    type: text
    exact: rundll32.exe %sadvpack.dll,DelNodeRunDLL32 "%s"
- id: rundll32-inf-install
  desc: Rundll32 InstallHinfSection launcher
  crit: suspicious
  conf: 0.97
  count_min: 2
  if:
    type: text
    exact: rundll32.exe %s,InstallHinfSection %s 128 %s
- id: inf-install-entrypoint
  desc: InstallHinfSection entrypoint string
  crit: notable
  conf: 0.94
  if:
    type: text
    exact: InstallHinfSection
- id: do-inf-install
  desc: DoInfInstall helper string
  crit: notable
  conf: 0.92
  count_min: 2
  if:
    type: text
    exact: DoInfInstall
composite_rules:
- id: iexpress-command-pipe-dropper
  desc: IExpress installer executes piped dropped payload
  crit: hostile
  conf: 0.99
  all:
  - id: metadata/binary/installer/sfx::iexpress-config-directives
  - id: objectives/command-and-control/dropper/staging/installer::cmd-comspec-pipe-launch
  - id: micro-behaviors/process/create/exec::create-process-a
  any:
  - id: metadata/binary/installer/sfx::iexpress
  - id: metadata/binary/installer/sfx::wextract-tool
- id: iexpress-inf-install-dropper
  desc: IExpress installer launches INF payload stage
  crit: hostile
  conf: 0.98
  all:
  - id: metadata/binary/installer/sfx::iexpress
  - id: metadata/binary/installer/sfx::iexpress-config-directives
  - id: metadata/binary/installer/sfx::cabinet-fdi-extraction
  - id: micro-behaviors/process/create/exec::create-process-a
  any:
  - id: objectives/command-and-control/dropper/staging/installer::rundll32-inf-install
  - id: objectives/command-and-control/dropper/staging/installer::inf-install-entrypoint
  - id: objectives/command-and-control/dropper/staging/installer::do-inf-install
- id: iexpress-legacy-installer-tradecraft
  desc: IExpress dropper with legacy cleanup commands
  crit: suspicious
  conf: 0.97
  all:
  - id: metadata/binary/installer/sfx::iexpress-resource-heavy-sfx
  any:
  - id: objectives/command-and-control/dropper/staging/installer::advpack-delnode-rundll32
  - id: objectives/command-and-control/dropper/staging/installer::dropped-aiff-stage
  - id: micro-behaviors/os/msdos/internal::check-command-com
  needs: 2
- id: aspack-sfx-opaque-cabinet-dropper
  desc: ASPack SFX stages opaque cabinet payload
  crit: hostile
  conf: 0.93
  attack: T1027.002,T1105
  # Packed unsigned stub with a minimal import table whose oversized,
  # high-entropy resources carry IExpress directive names over a cabinet
  # that is not a readable cabinet: staged-payload tradecraft, not a
  # working installer.
  all:
  - id: metadata/build/protector::aspack-name-reference
  - id: metadata/binary/resource/entropy::high-entropy-rsrc
  - id: metadata/binary/resource/size::oversized-rsrc
  - id: metadata/binary/symbols/count::imported-functions-under-10
  - id: metadata/binary/installer/sfx::iexpress-extractopt
  unless:
  - id: metadata/signed/platform/
  - id: metadata/binary/installer/family/
