defaults:
  platforms: [windows]
  for: [oledoc]
  attack: T1027.009
composite_rules:
  - id: scandisp-delphi-sidecar-loader
    desc: MSI launches ScanDisp with Delphi runtimes plus log and RTF sidecars
    crit: hostile
    conf: 0.96
    all:
      - id: metadata/binary/installer/database::msi-localappdata-install-root
      - id: micro-behaviors/process/create/installer::msi-launchfile-custom-action
      - id: metadata/package/files/msi::msi-scandisp-executable
      - id: metadata/package/files/msi::msi-delphi-runtime-bundle
      - id: metadata/package/files/msi::msi-madcollection-runtime-bundle
    any:
      - id: metadata/package/files/msi::msi-disguised-backup-component
      - id: metadata/package/files/msi::msi-log-rich-text-sidecar-pair
    needs: 1
