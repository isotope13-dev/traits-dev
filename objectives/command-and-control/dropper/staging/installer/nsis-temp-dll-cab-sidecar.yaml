# Commodity NSIS crypters: a small unsigned NSIS stub whose overlay is almost
# all ciphertext extracts a lone DLL straight into $TEMP (not $PLUGINSDIR,
# where real plugins live) together with an encrypted blob given a cabinet
# name. The DLL names that .cab, allocates executable memory and decrypts the
# blob into the next stage. Real installers ship plugins in $PLUGINSDIR and
# genuine cabinets carry MSCF headers that extract as archives.
defaults:
  platforms: [windows]
  for: [pe]
  attack: T1027.013,T1140,T1105
composite_rules:
  - id: nsis-temp-dll-decrypts-cab-named-blob
    desc: NSIS $TEMP DLL loads .cab-named blob
    crit: hostile
    conf: 0.92
    scope: outer
    all:
      - id: objectives/command-and-control/dropper/staging/installer::nsis-system-plugin-minimal-unsigned-installer
      - id: objectives/anti-static/pack/overlay::nsis-dominant-opaque-overlay
      - id: micro-behaviors/fs/path/temp::nsis-temp-destination-entry
      - id: micro-behaviors/fs/path/archive::bare-cab-filename-string
      - id: micro-behaviors/mem/alloc/virtual::virtual-alloc
    unless:
      - id: metadata/signed/platform/
