defaults:
  platforms: [windows]
  for: [msi, oledoc, pe]
  attack: T1036.005,T1195.002,T1204.002

composite_rules:
  - id: msi-defender-update-wix-cab-agent-dropper
    desc: Fake DefenderUpdate WiX MSI stages unsigned C2 agent
    crit: hostile
    conf: 0.98
    scope: outer
    all:
      - id: metadata/binary/installer/database::msi-localappdata-install-root
      - id: metadata/package/files/msi::msi-launchfile-custom-action
      - id: metadata/package/files/msi::msi-runtime-launch-action
      - id: metadata/package/files/msi::msi-wix-toolset-branding
      - id: metadata/document/office/properties::office-subject-two-to-five-ascii-letters
      - id: metadata/package/files/msi::msi-defender-update-basename
      - id: metadata/binary/provenance/build::pe-pdb-c2-agent-filename
    any:
      - id: metadata/signed/trust-level::digital-signature-stream
      - id: metadata/package/files/msi::ole-security-flag
    needs: 1
