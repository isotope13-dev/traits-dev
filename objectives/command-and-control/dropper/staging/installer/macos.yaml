defaults:
  platforms: [macos]
  for: [macho, objc, swift, shell, applescript]
  attack: T1105
traits:
  - id: macos-b64-osascript-on-run
    desc: Base64 wraps an osascript launcher
    crit: suspicious
    conf: 0.96
    for: [shell]
    if:
      type: text
      substr: b3Nhc2NyaXB0IC1lICdvbiBydW4
composite_rules:
  - id: pkg-payload-reference
    desc: Downloaded pkg payload reference
    crit: notable
    conf: 0.8
    all:
      - id: micro-behaviors/fs/path/archive::pkg-filename-reference
    any:
      - id: micro-behaviors/fs/path/temp::macos-package-archive-path
      - id: micro-behaviors/fs/path/temp::unix-temp
      - id: micro-behaviors/fs/path/temp::unix-var-temp
    unless:
      - id: well-known/tool/detection/proxy-sandbox
      - id: metadata/lang/compiler/systems::go-binary
      - id: metadata/package/files/dependency::vsix-bundled-native-tool-path
      - id: well-known/tool/reverse-engineering/radare2::radare2-go-module-source-path
      - id: well-known/lib/platform/browser-automation/automation-context::playwright-core-browser-reinstall-mac-script
  - id: macos-pkg-dropper
    for: [macho, swift, objectivec, applescript]
    desc: macOS package-installing dropper
    crit: suspicious
    conf: 0.93
    all:
      - id: micro-behaviors/process/create/installer::macos-pkg-root-command-reference
      - id: pkg-payload-reference
    any:
      - id: micro-behaviors/process/create/installer::installer-target-root-flag
      - id: micro-behaviors/communications/http/url/endpoint::macos-interface-api-url
      - id: micro-behaviors/communications/http/url/endpoint::ppdserver-failure-endpoint
      - id: micro-behaviors/fs/path/temp::macos-package-archive-path
      - id: micro-behaviors/process/create/shellexec::usr-bin-open-command
  - id: elevated-macos-pkg-dropper
    for: [macho]
    desc: Elevated macOS package dropper
    crit: suspicious
    conf: 0.95
    all:
      - id: macos-pkg-dropper
      - id: "micro-behaviors/os/privilege/elevation::applescript-shell-admin-request-embedded"
    any:
      - id: micro-behaviors/process/create/script/osascript::background-shell-launch
      - id: micro-behaviors/process/create/shellexec::usr-bin-open-command
  - id: flat-pkg-preinstall-download-exec
    desc: macOS pkg preinstall download exec
    crit: hostile
    conf: 0.96
    for: [pkg, shell]
    scope: archive
    all:
      - id: micro-behaviors/os/package-manager/installer-script::pkg-scripts-hook-path
      - id: micro-behaviors/communications/http/download/curl::shell-silent-ip-download
      - id: micro-behaviors/fs/chmod/executable/mode::shell-numeric-mode
      - id: micro-behaviors/process/daemonize/detach::nohup-command

  - id: macos-b64-osascript-exec
    desc: Decodes base64 into a shell
    crit: hostile
    conf: 0.97
    for: [shell]
    all:
      - id: macos-b64-osascript-on-run
      - id: micro-behaviors/process/create/shell/command-string::shell-direct-sh-c
    any:
      - id: micro-behaviors/data/decode/base64::base64-d-cmd
      - id: micro-behaviors/data/decode/base64::base64-decode-cmd

  - id: macos-hidden-dot-payload-image
    desc: Hidden payload rides a disk image
    crit: hostile
    conf: 0.96
    for: [dmg, shell, macho]
    scope: archive
    all:
      - id: metadata/file/naming::hidden-dot-executable-member
      - id: macos-b64-osascript-on-run
      - id: micro-behaviors/process/create/api-system::few-imports-system-reference

  - id: openssl-pass-blob-decrypt
    desc: Decrypts an OpenSSL passphrase blob
    crit: hostile
    conf: 0.97
    for: [shell]
    all:
      - id: objectives/credential-access/files/openssl::openssl-hardcoded-pass
      - id: micro-behaviors/crypto/symmetric/aes/openssl::openssl-enc-aes
      - id: micro-behaviors/process/create/shell/pipeline::base64-blob-piped-onward

  - id: hdiutil-download-mount
    desc: Mounts a downloaded disk image
    crit: hostile
    conf: 0.96
    for: [shell]
    near_lines: 40
    all:
      - id: micro-behaviors/fs/volume/mount::hdiutil-attach
      - id: micro-behaviors/communications/http/download/curl::curl-silent-output
      - id: micro-behaviors/process/create/shellexec::open-file-command

  - id: perl-packed-xor-decode
    desc: Perl decrypts a packed payload
    crit: hostile
    conf: 0.96
    for: [shell]
    all:
      - id: objectives/anti-static/obfuscation/eval/dropper::perl-e-pack-decode
      - id: micro-behaviors/process/interpreter/perl::perl-code-execute
      - id: objectives/anti-static/obfuscation/payload/encoded/exec::shell-eval-base64-decode

  - id: perl-script-packed-macho
    desc: Packed adhoc payload beside script
    crit: hostile
    conf: 0.95
    for: [dmg, shell, macho]
    scope: archive
    all:
      - id: objectives/anti-static/obfuscation/eval/interpreter::shell-base64-perl-xor-eval
      - id: metadata/binary/code/entropy::large-macho-sparse-high-code-entropy
      - id: metadata/signed/trust-level::adhoc

  - id: macos-quarantine-copy-launch
    desc: Clears quarantine and copies payload
    crit: hostile
    conf: 0.96
    for: [shell]
    all:
      - id: micro-behaviors/fs/attributes/xattr::xattr-clear
      - id: micro-behaviors/fs/file/copy::cp-command-text
      - id: micro-behaviors/fs/traversal/drives::applescript-list-disks

  - id: macos-hidden-adhoc-overlay
    desc: Hidden adhoc binary carries overlay
    crit: hostile
    conf: 0.95
    for: [dmg, macho]
    scope: archive
    all:
      - id: metadata/file/naming::hidden-dot-executable-member
      - id: metadata/signed/trust-level::adhoc
      - id: metadata/binary/layout/overlay::overlay-at-least-half

  - id: dmg-silent-curl-pipe-bash
    desc: Silent curl piped into bash
    crit: hostile
    conf: 0.96
    attack: T1105,T1059.004
    for: [dmg]
    scope: archive
    all:
      - id: micro-behaviors/communications/http/download/cli::dmg-nohup-silent-curl
      - id: micro-behaviors/process/create/shell/pipeline::dmg-curl-piped-bash
