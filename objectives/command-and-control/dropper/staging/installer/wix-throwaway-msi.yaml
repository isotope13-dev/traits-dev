defaults:
  platforms: [windows]
  for: [oledoc]
  attack: T1204.002,T1036.005,T1195.002

composite_rules:
  # Disposable WiX MSI dropper identity under MSI routing (summary
  # values only): nonstandard publisher, single-token product, default WiX
  # install description, and a multi-megabyte opaque OLE container.
  - id: wix-token-product-heavy-dropper
    desc: Heavy WiX MSI dropper with token product identity
    crit: hostile
    conf: 0.96
    size_min: 5000000
    all:
      - id: metadata/package/files/msi::ole2-installer-kind
      - id: metadata/package/files/msi::msi-wix-toolset-application-metadata
      - id: metadata/package/files/msi::msi-nonstandard-creator-identity
      - id: metadata/package/files/msi::msi-single-token-subject
      - id: metadata/package/files/msi::msi-wix-boilerplate-token-description
      - id: metadata/package/files/msi::msi-opaque-stream-cluster
      - id: metadata/package/files/msi::ole-security-flag
    unless:
      - id: metadata/package/files/msi::personal-product-wix-msi-context
