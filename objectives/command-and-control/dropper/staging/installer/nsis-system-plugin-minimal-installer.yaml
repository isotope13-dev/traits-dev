# The NSIS script (and any strings in it) is LZMA-compressed, so a scan sees
# only the stub and the plugin. What remains is the shape: an unsigned
# installer under 100 KB that ships the System plugin, which lets a script
# call any DLL export, and that carries no version resource. Legitimate
# installers usually identify their publisher; this one does not.
defaults:
  platforms: [windows]
  for: [pe]
  attack: T1105,T1106
composite_rules:
  - id: nsis-system-plugin-minimal-unsigned-installer
    desc: Unsigned tiny NSIS installer with System plugin
    crit: suspicious
    conf: 0.7
    all:
      - id: metadata/binary/installer/plugin::nsis-system-plugin
      - id: metadata/binary/layout/size::small-pe
      - id: metadata/signed/trust-level::unsigned-pe-executable
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/resource/identity::pe-version-resource
