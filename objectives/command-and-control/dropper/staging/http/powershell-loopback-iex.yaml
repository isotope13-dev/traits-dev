# A binary carrying a PowerShell one-liner that evaluates a download from a
# loopback address, e.g. a staged Beacon's
# `IEX (New-Object Net.Webclient).DownloadString('http://127.0.0.1:%u/')`
# template: the same machine serves the next stage over a local HTTP listener
# and executes it in the same step. No legitimate program fetches code from
# 127.0.0.1 and hands it straight to Invoke-Expression; installer and updater
# download cradles point at remote infrastructure, and local test harnesses do
# not ship their fixtures inside a packed PE.
defaults:
  for: [pe, dll]
  platforms: [windows]
  attack: T1059.001,T1105
traits:
  - id: ps-iex-webclient-downloadstring
    desc: PowerShell IEX evaluates WebClient download
    crit: notable
    conf: 0.93
    size_min: 512
    size_max: 50000000
    if:
      type: text
      regex: '(?i)(iex|invoke-expression)\s*\(\s*\(?\s*new-object\s+net\.webclient'
  - id: loopback-downloadstring-url
    desc: DownloadString of loopback HTTP URL
    crit: notable
    conf: 0.94
    size_min: 512
    size_max: 50000000
    if:
      type: text
      regex: '(?i)downloadstring\s*\(\s*[''"]https?://(127\.0\.0\.1|localhost)\b'
composite_rules:
  - id: powershell-loopback-download-iex-stage
    desc: PowerShell evaluates loopback download in binary
    crit: hostile
    conf: 0.97
    size_min: 512
    size_max: 50000000
    all:
      - id: ps-iex-webclient-downloadstring
      - id: loopback-downloadstring-url
    any:
      - id: micro-behaviors/process/interpreter/powershell/command::encoded-command-line
      - id: micro-behaviors/process/create/flags::execution-policy-bypass-abbrev-flag
