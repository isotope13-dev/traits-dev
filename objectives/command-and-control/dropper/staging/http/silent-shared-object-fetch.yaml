# A silent curl that saves a native library from a host whose URL path is a
# one- or two-character token. Package installs name the release and version in
# the URL; an opaque short path is a dropper's staging endpoint, and a library
# fetched that way is code the next process to load it will run.
defaults:
  platforms: [unix]
  for: [shell]
  attack: T1105

composite_rules:
  - id: silent-shared-object-short-url-fetch
    desc: Silent fetch of library from opaque short URL
    crit: hostile
    conf: 0.9
    near_lines: 1
    all:
      - id: micro-behaviors/communications/http/download/curl::curl-silent-shared-object-output
      - id: micro-behaviors/communications/http/url/endpoint::bare-host-short-url-path
    unless:
      - id: metadata/package/testing/
      - id: "metadata/file/naming::test-directory-component"
