# A staged payload that arrives over HTTP and is decrypted with AES-CBC via
# Windows CNG, with the source URL concealed behind single-byte XOR so no
# plaintext URL survives for a scanner or reviewer to find.
#
# Worked example: the imgdecode 1.0.1/1.0.2 npm native addons, whose Win32
# .node binaries download a fake `banner.jpg` (raw.githubusercontent.com,
# single-byte-XOR-concealed `cavecrew` path) over WinINet, AES-CBC-decrypt
# it with BCrypt, and stage it with runtime-resolved VirtualAlloc (RW) /
# VirtualProtect (RX) calls plus in-memory MZ/PE header parsing. No
# legitimate updater hides its source URL this way: update endpoints are
# configuration, not contraband.
defaults:
  for: [pe, dll]
  platforms: [windows]
  attack: T1105,T1140,T1027
  mbc: B0023

composite_rules:
  - id: xor-url-wininet-cng-stager
    desc: HTTP-downloaded payload decrypted via CNG from concealed URL
    crit: hostile
    conf: 0.97
    all:
      - id: micro-behaviors/communications/http/client/wininet::internet-open-url
      - id: micro-behaviors/communications/http/client/wininet::internet-read-file
      - id: micro-behaviors/crypto/library/cryptoapi::bcrypt-decrypt-api
      - id: micro-behaviors/crypto/cipher::bcrypt-cbc-mode-references
      - id: micro-behaviors/communications/url/encoded::binary-xor-http-url
    unless:
      - id: metadata/signed/platform/
