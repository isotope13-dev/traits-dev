defaults:
  platforms: [windows]
  for: [iso]
  attack: T1027,T1059.001,T1105

composite_rules:
  - id: iso-hidden-powershell-dynamic-stager
    desc: ISO stages hidden PowerShell through a dynamic string decoder
    crit: hostile
    conf: 0.99
    attack: T1027,T1059.001,T1105,T1564.003
    all:
      - id: metadata/file/format/structured::primary-volume-descriptor
      - id: metadata/file/format/iso::iso-powershell-stride-decoder
      - id: metadata/file/format/iso::iso-powershell-command-line
      - id: metadata/file/format/iso::iso-powershell-dynamic-call
