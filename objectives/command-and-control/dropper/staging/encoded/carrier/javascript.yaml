defaults:
  platforms: [windows, unix]
  for: [javascript, html, static-lib]
  attack: T1059.007

traits:
  - id: js-unescape-mz-percent-u
    desc: Unescapes a percent-u PE header
    crit: suspicious
    conf: 0.93
    if:
      type: text
      regex: '(?i)unescape\s*\(\\?["'']MZ%u'

  - id: js-fragmented-fromcharcode
    desc: Builds fromCharCode from fragments
    crit: suspicious
    conf: 0.92
    if:
      type: text
      regex: '(?i)String\s*\[\s*["'']from["'']\s*\+\s*["'']Char["'']'

composite_rules:
  - id: js-eval-fragmented-decoder
    desc: Evals a fragmented character decoder
    crit: hostile
    conf: 0.94
    all:
      - id: js-fragmented-fromcharcode
      - id: micro-behaviors/process/interpreter/eval/direct::js-eval-concat-string

  - id: js-writes-unescaped-pe
    desc: Writes an unescaped PE to a file
    crit: hostile
    conf: 0.95
    all:
      - id: js-unescape-mz-percent-u
      - id: micro-behaviors/fs/write/file/stream::mozilla-file-output-stream

  - id: js-wsh-carrier-wmi-powershell-dropper
    desc: Fragmented WSH carrier runs WMI PowerShell dropper
    crit: hostile
    conf: 0.97
    attack: T1027,T1047,T1059.005,T1105
    for: [javascript]
    all:
      - id: js-fragmented-fromcharcode
      - id: objectives/execution/wmi::obfuscated-wsh-numeric-xor-wmi-powershell-dropper

  - id: obfuscated-wsh-xor-carrier
    desc: Obfuscated WSH code reconstructs an opaque image carrier
    crit: suspicious
    conf: 0.96
    for: [javascript]
    attack: T1027,T1027.003,T1059.007
    all:
      - id: js-fragmented-fromcharcode
      - id: metadata/lang/runtime::wscript-host-reference
      - id: micro-behaviors/data/decode/xor::js-numeric-array-index-xor-loop
      - id: objectives/command-and-control/dropper/delivery/stego::image-tail-payload-marker
