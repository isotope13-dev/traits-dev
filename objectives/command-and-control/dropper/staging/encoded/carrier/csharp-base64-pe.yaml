defaults:
  platforms: [windows]
  for: [csharp]
  attack: T1027.009

traits:
  - id: base64-pe-file-write-source
    desc: Base64 PE bytes written with File.WriteAllBytes
    crit: suspicious
    conf: 0.97
    if:
      type: text
      substr: File.WriteAllBytes(path, Convert.FromBase64String("TVqQ

composite_rules:
  - id: base64-pe-write-kdf-assemblyload-profile
    desc: Base64 PE write with KDF and Assembly.Load
    crit: suspicious
    conf: 0.98
    all:
      - id: micro-behaviors/os/module/load::assembly-load-method-result
      - id: base64-pe-file-write-source
      - id: micro-behaviors/crypto/kdf/password::dotnet-password-kdf
    any:
      - id: micro-behaviors/fs/path/app-data::commonappdata-exe-path-expression
      - id: micro-behaviors/process/interpreter/reflection/runtime::methodinfo-getmethod-assignment
      - id: micro-behaviors/crypto/symmetric/aes/library::aes-decrypt-csharp
      - id: micro-behaviors/process/interpreter/reflection/dispatch::methodinfo-invoke-text
