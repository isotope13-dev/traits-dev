defaults:
  for: [vbs]
  platforms: [windows]
  crit: suspicious
  conf: 0.92

traits:
  - id: mz-header-string
    desc: MZ PE header string in VB-family script
    conf: 0.95
    if:
      type: string_literal
      exact: 4D5A

composite_rules:
  - id: vba-hardcoded-pe-payload
    desc: VB-family script with hardcoded PE payload data
    crit: hostile
    conf: 0.97
    all:
      - id: mz-header-string
      - id: micro-behaviors/data/encode/char-code::array-payload-reconstruction

  - id: vbs-hex-pe-dropper
    desc: VBScript decodes hex-encoded PE payload and writes or executes it
    crit: hostile
    conf: 0.98
    attack: T1027,T1059.005,T1105
    all:
      - id: metadata/file/encoded::hex-pe-dos-header
      - id: objectives/anti-static/obfuscation/string/delimiter::hex-loop-step-two
      - id: micro-behaviors/fs/write/content::create-text-file-api
    any:
      - id: micro-behaviors/process/create/shell/script-host::wscript-shell-run-create
      - id: micro-behaviors/process/create/shell/wsh::wsh-run-method-call
