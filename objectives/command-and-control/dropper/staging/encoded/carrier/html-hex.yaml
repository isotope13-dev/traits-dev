defaults:
  platforms: [windows]
  for: [csharp]
composite_rules:
  - id: html-hex-decoded-file-stage
    desc: HTTP HTML extraction, hex decode, file staging
    crit: suspicious
    conf: 0.95
    attack: T1105
    all:
      - id: micro-behaviors/communications/http/client/managed::downloadstring
      - id: micro-behaviors/data/parse/html::regex-script-tag-content
      - id: micro-behaviors/data/decode/hex::dotnet-hexstring-conversion
      - id: micro-behaviors/fs/write/file/full::writeallbytes-any
