defaults:
  platforms: [windows]
  for: [batch]
traits:
- id: cert-fragment-var
  desc: Variable assigned cert fragment
  crit: component
  conf: 0.88
  if:
    type: text
    regex: '[A-Za-z0-9_]{4,}=cert\b'
- id: util-fragment-var
  desc: Variable assigned util fragment
  crit: component
  conf: 0.88
  if:
    type: text
    regex: '[A-Za-z0-9_]{4,}=util\b'
- id: cscript-fragment-var
  desc: Variable assigned cscript fragment
  crit: notable
  conf: 0.9
  if:
    type: text
    regex: '[A-Za-z0-9_]{4,}=cscript /'
- id: nologo-fragment-var
  desc: Variable assigned nologo fragment
  crit: notable
  conf: 0.9
  if:
    type: text
    regex: '[A-Za-z0-9_]{4,}=/nologo /'
- id: vbscript-engine-fragment-var
  desc: Variable assigned VBScript engine fragment
  crit: notable
  conf: 0.9
  if:
    type: text
    regex: '[A-Za-z0-9_]{4,}=/e:vbscri'
- id: vbscript-engine-tail-var
  desc: Variable assigned VBScript engine tail
  crit: component
  conf: 0.86
  if:
    type: text
    regex: '[A-Za-z0-9_]{4,}=pt\b'
- id: decode-option-in-batch
  desc: Batch contains a decoder option literal
  # The option is only a component of the certutil/VBScript stager below.  A
  # text-word match is too broad: it also matches ordinary names such as
  # "decode-audio-data" in unrelated archives.
  crit: notable
  conf: 0.86
  if:
    type: literal
    word: -decode
- id: del-fragment-d-var
  desc: Variable assigned d fragment
  crit: component
  conf: 0.84
  if:
    type: text
    regex: '[A-Za-z0-9_]{4,}=d\b'
- id: del-fragment-e-var
  desc: Variable assigned e fragment
  crit: component
  conf: 0.84
  if:
    type: text
    regex: '[A-Za-z0-9_]{4,}=e\b'
- id: del-fragment-l-var
  desc: Variable assigned l fragment
  crit: component
  conf: 0.84
  if:
    type: text
    regex: '[A-Za-z0-9_]{4,}=l\b'
- id: batch-chr-construction
  desc: Batch contains dense Chr reconstruction
  crit: suspicious
  conf: 0.88
  count_min: 6
  if:
    type: text
    regex: 'Chr\([0-9]{2,3}\)'
- id: cscript-vbscript-engine
  desc: cscript explicit VBScript engine launch
  crit: suspicious
  conf: 0.92
  if:
    type: text
    regex: (?i)\bcscript(\.exe)?\b[^\n]{0,120}/e:vbscript\b
- id: batch-wscript-invisible-vbs
  desc: Batch launches invisible VBS
  crit: suspicious
  conf: 0.92
  if:
    type: text
    regex: '(?i)\bwscript(\.exe)?\s+"?invisible\.vbs"?'
- id: batch-max-explorer-documents
  desc: Batch maximizes Documents explorer
  crit: notable
  conf: 0.86
  if:
    type: text
    regex: '(?i)\bstart\s+/max\s+explorer\s+Documents\b'
# micro-behaviors/time/sleep/interval::wscript-sleep-literal is scoped
# `for: [javascript, vbs]` and never fires on Batch. Its matcher is a plain
# literal substring search, so mirror it locally for the embedded-VBScript
# text this file already scans out of batch sources (see
# metadata/lang/source/syntax/assignment/name::batch-vbscript-object-factory-assignment).
- id: batch-wscript-sleep-literal
  desc: Batch contains embedded WScript.Sleep literal
  crit: notable
  conf: 0.5
  if:
    type: text
    substr: WScript.Sleep
composite_rules:
- id: batch-hidden-vbs-document-decoy
  desc: Batch hidden VBS document decoy
  crit: suspicious
  conf: 0.95
  all:
  - id: batch-wscript-invisible-vbs
  - id: batch-max-explorer-documents
- id: batch-certutil-vbscript-stager
  desc: Batch decodes embedded payload then launches VBScript
  crit: hostile
  conf: 0.97
  attack: T1059.005
  all:
  - id: cert-fragment-var
  - id: util-fragment-var
  - id: decode-option-in-batch
  - id: cscript-fragment-var
  - id: nologo-fragment-var
  - id: vbscript-engine-fragment-var
  - id: vbscript-engine-tail-var
- id: batch-decoder-cleanup-stager
  desc: Batch decoder launches staged script then self-deletes
  crit: hostile
  conf: 0.98
  attack: T1070.004
  all:
  - id: batch-certutil-vbscript-stager
  - id: del-fragment-d-var
  - id: del-fragment-e-var
  - id: del-fragment-l-var
  - id: micro-behaviors/process/info/selfpath::self-path-fragment
  any:
  - id: micro-behaviors/os/console/io::output-suppression
  - id: micro-behaviors/process/interpreter/scripting::delayed-expansion
  - id: micro-behaviors/data/encode/char-code::dense-chr-construction
- id: batch-obfuscated-vbscript-loader
  desc: Obfuscated batch embedded VBScript loader
  crit: hostile
  conf: 0.97
  attack: T1059.005
  all:
  - id: objectives/anti-static/obfuscation/string/fragmentation::batch-fragmentation-metrics
  - id: metadata/lang/source/syntax/assignment/name::batch-vbscript-object-factory-assignment
  - id: batch-wscript-sleep-literal
  any:
  - id: batch-chr-construction
  - id: micro-behaviors/os/console/io::output-suppression
- id: batch-slice-built-certutil-temp-stager
  desc: Slice-rebuilt batch certutil stager, hidden launch, self-delete
  crit: hostile
  conf: 0.97
  attack: T1027,T1059.003,T1070.004,T1105
  all:
  - id: objectives/command-and-control/dropper/delivery/clickfix/browser-cache::cache-certutil-script-decode
  - id: micro-behaviors/process/create/shell/script-host::temp-script-host-path
  - id: objectives/evasion/self-delete/file/batch::batch-ping-delay-delete
  - id: objectives/anti-static/obfuscation/string/fragmentation::batch-percent-substring-slicing
  any:
  - id: micro-behaviors/process/create/flags::wscript-shell-run-hidden-window
  - id: micro-behaviors/data/control-flow/dispatch/named::run-zero-boolean-arguments
  - id: micro-behaviors/process/daemonize/spawn::start-no-new-window
  needs: 1
- id: batch-slice-built-certutil-exe-stager
  desc: Slice-built batch certutil TEMP-exe stager
  crit: hostile
  conf: 0.96
  attack: T1027,T1059.003,T1105
  all:
  - id: objectives/command-and-control/dropper/delivery/clickfix/browser-cache::certutil-decode-temp
  - id: micro-behaviors/fs/path/temp::batch-exe-path-reference
  - id: objectives/anti-static/obfuscation/string/fragmentation::batch-percent-substring-slicing
  any:
  - id: micro-behaviors/process/create/flags::wscript-shell-run-hidden-window
  - id: micro-behaviors/data/control-flow/dispatch/named::run-zero-boolean-arguments
  - id: micro-behaviors/process/daemonize/spawn::start-no-new-window
  needs: 1
- id: batch-self-sliced-certutil-hex-exe-loader
  desc: Batch hex-decodes a self-sliced payload and launches an executable
  crit: hostile
  conf: 0.98
  attack: T1027.009,T1059.003,T1140
  all:
  - id: micro-behaviors/fs/read/self::batch-more-current-script-slice
  - id: micro-behaviors/data/decode/command::batch-certutil-decodehex-command
  - id: metadata/file/encoding/hex::hex-pe-dos-stub
  - id: micro-behaviors/fs/path/temp::batch-exe-path-reference
  - id: micro-behaviors/process/create/shell/batch::batch-launches-staged-executable
