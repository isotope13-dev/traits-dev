defaults:
  platforms: [windows]
  for: [vbs]
  attack: T1027,T1059.001,T1059.005,T1564.003
  mbc: B0023

# Staging observations for standalone VBScript carriers.  These rules use
# behavior combinations; the encoded body itself is intentionally not matched
# by sample-specific names or payload bytes.
traits:
  - id: vbs-hex-ascw-word
    desc: Encodes a character as a hex word
    crit: suspicious
    conf: 0.92
    for: [vbs, text, static-lib]
    if:
      type: text
      regex: '(?i)Hex\s*\(\s*AscW\s*\('
composite_rules:
  - id: vbs-hex-word-file-drop
    desc: Writes hex-word encoded file contents
    crit: hostile
    conf: 0.94
    for: [vbs, text, static-lib]
    all:
      - id: vbs-hex-ascw-word
      - id: micro-behaviors/fs/write/content::fso-text-file-write-api

  - id: vbs-adodb-encoded-stream-stager
    desc: VBScript stages a decoded payload through ADODB and cleans up
    crit: hostile
    conf: 0.99
    all:
      - id: micro-behaviors/os/com/automation::wscript-shell-literal
      - id: micro-behaviors/os/com/automation::filesystemobject-constructor
      - id: micro-behaviors/fs/write/stream::adodb-save-to-file
      - id: micro-behaviors/data/decode/base64::powershell-frombase64string
      - id: micro-behaviors/fs/delete/file/self::fso-deletefile-call
      - id: metadata/file/line::vbs-long-average-lines
      - id: micro-behaviors/data/control-flow/dispatch::run-zero-style-argument

  - id: vbs-token-substituted-base64-powershell-loader
    desc: VBScript decodes token-obfuscated Base64 into hidden PowerShell
    crit: hostile
    conf: 0.99
    attack: T1027,T1059.001,T1059.005,T1140,T1564.003
    all:
      - id: micro-behaviors/os/com/automation::wscript-shell-literal
      - id: micro-behaviors/data/control-flow/dispatch::run-zero-style-argument
      - id: objectives/anti-static/obfuscation/string/recovery::vbs-fragmented-frombase64string
      - id: objectives/anti-static/obfuscation/string/recovery::vbs-long-token-character-substitution-chain
      - id: metadata/file/line::vbs-long-average-lines

  - id: vbs-base64-adodb-stream-dropper
    desc: VBScript decodes Base64 payload, writes to stream and executes
    crit: hostile
    conf: 0.98
    attack: T1059.005,T1027,T1140
    mbc: B0017,B0018,B0032
    all:
      - id: micro-behaviors/data/property/access::msxml-node-typed-value
      - id: micro-behaviors/process/create/shell/script-host::wscript-shell-run
      - id: micro-behaviors/fs/write/file/stream::savetofile-method-token
    any:
      - id: micro-behaviors/data/encode/payload::vbs-appended-large-base64-payload
      - id: micro-behaviors/os/com/automation::vbs-createobject-variable-progid
      - id: objectives/execution/interpreter/vbscript/loader::vbs-amp-fragment-concat
      - id: objectives/anti-static/obfuscation/name-mangling/variables::vbs-generated-identifiers
