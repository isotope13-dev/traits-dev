defaults:
  platforms: [unix, windows]
  for: [go]
  crit: suspicious
  conf: 0.92
composite_rules:
  - id: go-gzip-temporary-stage-exec
    desc: Go decodes gzip data beside temporary execution
    all:
      - id: micro-behaviors/data/compression::go-base64-gzip-decode
      - id: micro-behaviors/fs/write/file/full::go-os-writefile
      - id: metadata/file/profile/execution-api::go-command-temporary-path
