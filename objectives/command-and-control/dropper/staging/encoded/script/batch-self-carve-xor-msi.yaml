# A batch file that reads itself, carves a fenced base64 blob, XOR-decodes it
# in a hidden PowerShell and writes the bytes out, then hands the result to a
# silent msiexec. The payload never exists as a file until the script runs.
defaults:
  platforms: [windows]
  for: [batch]
  attack: T1027.009,T1140,T1218.007
  mbc: B0032

composite_rules:
  - id: batch-self-carve-xor-payload-silent-install
    desc: Batch carves XOR payload and silent-installs it
    crit: hostile
    conf: 0.95
    all:
      - id: micro-behaviors/data/buffer/carve::batch-self-carve-decode-write
      - id: micro-behaviors/data/arithmetic::powershell-byte-converter-xor
      - id: micro-behaviors/process/create/hidden::powershell-windowstyle-hidden
      - id: micro-behaviors/process/create/installer::msiexec-quiet-switch
