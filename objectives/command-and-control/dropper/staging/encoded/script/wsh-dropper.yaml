  if:
    type: text
    substr: 'aHRmeredith0cDmeredithovLw='
- id: meredith-encoded-run-method
  desc: Meredith encoded WScript Run
  crit: notable
  conf: 0.95
  size_max: 50000
  if:
    type: text
    substr: '"UnVu".forego4()'
- id: token-array-powershell-exe
  desc: Token-array PowerShell executable fragments
  crit: component
  conf: 0.94
  size_max: 50000
  if:
    type: text
    substr: "'powersh'"
- id: token-array-powershell-exe-suffix
  desc: Token-array PowerShell exe suffix
  crit: notable
  conf: 0.94
  size_max: 50000
  if:
    type: text
    substr: "'ell.exe'"
- id: token-array-powershell-nop
  desc: Token-array PowerShell NoProfile flag
  crit: notable
  conf: 0.95
  size_max: 50000
  if:
    type: text
    substr: "'-nop'"
- id: token-array-powershell-ep
  desc: Token-array PowerShell execution policy flag
  crit: component
  conf: 0.95
  size_max: 50000
  if:
    type: text
    substr: "'-ep'"
- id: token-array-powershell-bypass
  desc: Token-array PowerShell bypass token
  crit: component
  conf: 0.95
  size_max: 50000
  if:
    type: text
    substr: "'bypass'"
- id: token-array-powershell-file
  desc: Token-array PowerShell file flag
  crit: notable
  conf: 0.95
  size_max: 50000
  if:
    type: text
    substr: "'-file'"
- id: token-array-msxml-xmlhttp
  desc: Token-array MSXML2 XMLHTTP fragments
  crit: notable
  conf: 0.93
  size_max: 50000
  if:
    type: text
    substr: "'MSXML2.'"
- id: token-array-xmlhttp-suffix
  desc: Token-array XMLHTTP suffix
  crit: component
  conf: 0.93
  size_max: 50000
  if:
    type: text
    substr: "'XMLHTTP'"
- id: http-ps1-url-reference
  desc: HTTP URL references a remote PowerShell script
  crit: notable
  conf: 0.96
  size_max: 50000
  if:
    type: text
    regex: (?i)http://[-A-Za-z0-9./_]{1,160}\.ps1\b
- id: token-array-response-text-fragment
  desc: Uses responseText in string reconstruction
  # XHR libraries read responseText routinely; the WSH token-array composite
  # requires the surrounding PowerShell/ActiveX reconstruction shape.
  crit: component
  conf: 0.94
  if:
    type: text
    substr: responseTe
composite_rules:
- id: xmlhttp-status-200-check
  desc: XMLHTTP status 200 check
  crit: component
