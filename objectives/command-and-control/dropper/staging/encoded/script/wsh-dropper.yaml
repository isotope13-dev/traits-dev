# The HTTP client, WScript shell, and PowerShell command can all live behind
# one RC4 string table. A hidden HTA that combines that decoder with a computed
# ActiveX object and a literal external-IP .ps1 URL is a remote script dropper
# even when the ProgIDs and command line are not visible as source strings.
- id: hta-rc4-external-ip-ps1-stager
  for: [html]
  desc: HTA uses RC4-obfuscated ActiveX to stage a remote PowerShell script
  crit: hostile
  conf: 0.99
  attack: T1027,T1059.007,T1105,T1218.005,T1564.003
  mbc: B0017,B0032
  all:
  - id: metadata/file/format/markup::hta-application-element
  - id: micro-behaviors/ui/window/control::hta-hidden-or-minimized-window-request
  - id: micro-behaviors/crypto/symmetric/stream/rc4::js-rc4-implementation
  - id: micro-behaviors/crypto/symmetric/stream/rc4::js-rc4-prga-output
  - id: micro-behaviors/os/com/automation::script-computed-activex-object
  - id: micro-behaviors/communications/ip/literal::http-ip-url-filtered-text
  - id: http-ps1-url-reference
