# PHP that builds IE %uXXXX unicode shellcode blobs, typically handed to
# an unescape()/exploit kit landing page.
defaults:
  platforms: [windows]
  for: [php]
  attack: T1055,T1027.002

traits:
  - id: php-unicode-shellcode-run
    desc: Dense %uXXXX unicode shellcode blob
    crit: notable
    conf: 0.93
    if:
      type: text
      regex: '(%u[0-9A-Fa-f]{4}){8,24}'
  - id: php-percent-u-unescape
    desc: Builds %u-encoded unescape output
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)%u[''"\s.]*substr'

composite_rules:
  - id: php-unicode-unescape-shellcode
    desc: PHP builds %u shellcode via unescape
    crit: hostile
    conf: 0.96
    all:
      - id: php-unicode-shellcode-run
      - id: php-percent-u-unescape
  - id: php-bin2hex-unicode-shellcode
    desc: PHP bin2hex-encodes unicode shellcode
    crit: hostile
    conf: 0.95
    all:
      - id: php-unicode-shellcode-run
      - id: micro-behaviors/data/encode/hex::php-bin2hex-call
  - id: php-bin2hex-percent-u
    desc: PHP bin2hex builds %u unescape output
    crit: hostile
    conf: 0.94
    all:
      - id: php-percent-u-unescape
      - id: micro-behaviors/data/encode/hex::php-bin2hex-call
