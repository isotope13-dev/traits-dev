defaults:
  platforms: [windows]
  for: [dll]
  attack: T1620
  mbc: B0023

traits:
  - id: rundll32-export-name
    desc: DLL exports rundll32 entrypoint
    crit: component
    conf: 0.9
    attack: T1218.011
    if:
      type: export
      exact: rundll32
composite_rules:
  - id: minimal-dll-dynamic-loader
    desc: Minimal DLL dynamic loader imports
    crit: suspicious
    conf: 0.9
    size_max: 65536
    all:
      - id: micro-behaviors/mem/protect/modify::virtual-alloc-string
      - id: micro-behaviors/dylib/load/runtime::load-library-w
      - id: micro-behaviors/os/module/load::get-proc-address-import
    # NSIS System/UAC/etc. plugins are tiny DLLs that resolve APIs at runtime.
    unless:
      - id: metadata/binary/installer/plugin::known-nsis-plugin-basename
      - id: metadata/binary/installer/plugin::nsis-system-plugin
      - id: metadata/binary/installer/plugin::nsis-plugin
      - id: well-known/app/system/iobit::iobit-signed-component-context
  - id: rundll32-custom-encoded-loader
    desc: rundll32 DLL loads custom encoded payload
    crit: hostile
    conf: 0.97
    attack: T1027,T1218.011,T1620
    all:
      - id: rundll32-export-name
      - id: micro-behaviors/mem/protect/modify::virtual-alloc-string
      - id: micro-behaviors/dylib/load/runtime::load-library-w
      - id: micro-behaviors/os/module/load::get-proc-address-import
      - id: objectives/anti-static/obfuscation/encoding/custom::tiny-dll-low-alphabet-overlay
      - id: metadata/binary/layout::overlay-dominates-third
  # Debris/Fragtor-class rundll32 DLLs hide ShellExecute/CreateFile/ReadFile/
  # VirtualAlloc behind a ROT1 blob, XOR-decode a desktop.ini sidecar, and
  # resolve APIs through LoadLibraryW/GetProcAddress — without shipping the
  # later ADGINPX alphabet overlay.
  - id: rundll32-rot1-xor-desktop-ini-loader
    desc: rundll32 DLL XOR-decodes desktop.ini via ROT1-hidden APIs
    crit: hostile
    conf: 0.97
    attack: T1027,T1218.011,T1620
    all:
      - id: rundll32-export-name
      - id: objectives/anti-static/obfuscation/string/broken-api::rot1-reversed-winapi-blob
      - id: micro-behaviors/data/encode/xor::x86-xor-add-0x42-decode-loop
      - id: metadata/file/string/file::desktop-ini-filename
      - id: micro-behaviors/dylib/load/runtime::load-library-w
      - id: micro-behaviors/os/module/load::get-proc-address-import
