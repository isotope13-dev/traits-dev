defaults:
  platforms: [windows, unix]
  for: [javascript, html, static-lib]
  attack: T1059.007

traits:
  - id: js-unescape-mz-percent-u
    desc: Unescapes a percent-u PE header
    crit: suspicious
    conf: 0.93
    if:
      type: text
      regex: '(?i)unescape\s*\(\\?["'']MZ%u'

  - id: double-encoded-script-tag
    desc: Unescape argument starts with a tag
    crit: suspicious
    conf: 0.9
    if:
      type: text
      regex: 'document\.write\s*\(\s*unescape\s*\(\s*"%3C'

  - id: js-fragmented-fromcharcode
    desc: Builds fromCharCode from fragments
    crit: suspicious
    conf: 0.92
    if:
      type: text
      regex: '(?i)String\s*\[\s*["'']from["'']\s*\+\s*["'']Char["'']'

  - id: js-eval-concat-string
    desc: Eval of a concatenated string
    crit: suspicious
    conf: 0.9
    unless:
      - id: micro-behaviors/data/parse/json::eval-parenthesized-json-deserializer
      - id: well-known/tool/development/ci/github-actions/docker-build-push-action::dist-tree
    if:
      type: text
      regex: '(?i)\beval\s*\(\s*["''][^"'']{0,40}["'']\s*\+'
      # Puppet's rdoc template builds `document.all.` for old IE help pages.
      not:
        - substr: document.all

composite_rules:
  - id: js-eval-fragmented-decoder
    desc: Evals a fragmented character decoder
    crit: hostile
    conf: 0.94
    all:
      - id: js-fragmented-fromcharcode
      - id: js-eval-concat-string

  - id: js-writes-nested-encoded-script
    desc: Writes a double-encoded script
    crit: hostile
    conf: 0.94
    all:
      - id: micro-behaviors/ui/window/insert-html::browser-document-write-unescape
      - id: double-encoded-script-tag

  - id: js-writes-unescaped-pe
    desc: Writes an unescaped PE to a file
    crit: hostile
    conf: 0.95
    all:
      - id: js-unescape-mz-percent-u
      - id: micro-behaviors/fs/write/file/stream::mozilla-file-output-stream
