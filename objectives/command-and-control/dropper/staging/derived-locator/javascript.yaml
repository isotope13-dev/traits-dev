# Stage locators computed at runtime instead of written down.
#
# A dropper that hashes something -- a hostname, a file it fetched, a bundled
# constant -- and builds its next-stage address out of the digest never carries
# that address as a string, so no amount of reading the source recovers it.
#
# These are notable, not fragments: a package that did not previously derive a
# decryption key or a GitHub URL from a digest and now does is exactly the
# change a reviewer wants surfaced in a version diff. They live here rather
# than under a malware family because the matchers name no family -- filed
# under one, every match labelled unrelated software with that family's name,
# and the criticality was lowered to compensate. Relocating fixes the label, so
# the evidence can carry its honest weight again.
#
# The benign-context exclusions sit on each leg rather than on a roll-up above
# them, so they guard what a reader actually sees: digest-algorithm name lists,
# the stock `createHash(...).digest("hex")` helper, and the macOS/Windows
# identifier splits that ordinary machine-id code performs.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  attack: T1027
  crit: notable
  conf: 0.9
traits:
- id: hash-to-hostname-stage
  desc: sha256 hash combined with hostname
  not:
  - substr: sha256sum","sha384sum","sha512sum
  - substr: sha256","sha384","sha512","md5"
  - substr: createHash("sha256").update(e).digest("hex")
  - substr: sha256 shellescape shiftwidth
  if:
    type: text
    regex: sha256\s*\([^)]{1,120}\).{0,200}(hostname|host)
- id: hash-to-split-concat-stage
  desc: sha256 hash split or concatenated
  not:
  - substr: sha256sum","sha384sum","sha512sum
  - substr: sha256","sha384","sha512","md5"
  - substr: createHash("sha256").update(e).digest("hex")
  - substr: sha256 shellescape shiftwidth
  # Machine-id plumbing: both split a platform identifier, never a stage address.
  - substr: split("IOPlatformUUID")
  - substr: split("REG_SZ")
  if:
    type: text
    regex: sha256\s*\([^)]{1,120}\).{0,200}(split|concat)
- id: hash-to-decrypt-stage
  desc: sha256 hash feeds decrypt routine
  not:
  - substr: sha256sum","sha384sum","sha512sum
  - substr: sha256","sha384","sha512","md5"
  - substr: createHash("sha256").update(e).digest("hex")
  - substr: sha256 shellescape shiftwidth
  if:
    type: text
    regex: sha256\s*\([^)]{1,120}\).{0,200}(decrypt)
- id: hash-to-github-url-stage
  desc: sha256 hash combined with GitHub URL
  not:
  - substr: sha256sum","sha384sum","sha512sum
  - substr: sha256","sha384","sha512","md5"
  - substr: createHash("sha256").update(e).digest("hex")
  - substr: sha256 shellescape shiftwidth
  if:
    type: text
    regex: createHash\(["']sha256["']\).{0,200}(https?|raw\.githubusercontent)
