# PowerShell gzip-packs a nearby EXE into a sidecar blob (MoonPeak-style
# rc.bin staging) rather than shipping the PE in the clear.
defaults:
  platforms: [windows]
  for: [powershell]
  attack: T1027.002
traits:
  - id: gzip-write-bin-sidecar
    desc: Writes gzip output to a .bin sidecar
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)(DstPath|WriteAllBytes).{0,80}\.bin'
  - id: gzip-write-rtf-sidecar
    desc: Writes gzip output to an RTF path
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)(DstPath|WriteAllBytes).{0,80}\.rtf'
  - id: gzip-rtf-magic-stomp
    desc: Stomps gzip bytes with RTF magic
    crit: notable
    conf: 0.93
    if:
      type: text
      regex: '(?i)0x7B.{0,80}0x5C.{0,80}0x72.{0,80}0x74.{0,80}0x66'
composite_rules:
  - id: powershell-gzip-pack-bin
    desc: Gzip-packs a payload into a .bin sidecar
    crit: hostile
    conf: 0.94
    all:
      - id: micro-behaviors/data/compress/gzip::powershell-gzipstream-compress
      - id: gzip-write-bin-sidecar
    near_lines: 32
  - id: powershell-gzip-pack-exe-bin
    desc: Gzip-packs an EXE into a .bin sidecar
    crit: hostile
    conf: 0.97
    all:
      - id: micro-behaviors/data/compress/gzip::powershell-gzipstream-compress
      - id: micro-behaviors/fs/path/extension::windows-exe-path-reference
      - id: gzip-write-bin-sidecar
    near_lines: 32
  - id: powershell-gzip-pack-rtf
    desc: Gzip-packs a payload into an RTF decoy
    crit: hostile
    conf: 0.96
    all:
      - id: micro-behaviors/data/compress/gzip::powershell-gzipstream-compress
      - id: gzip-write-rtf-sidecar
    near_lines: 32
  - id: powershell-gzip-exe-rtf
    desc: Gzip-packs an EXE into an RTF decoy
    crit: hostile
    conf: 0.97
    all:
      - id: micro-behaviors/data/compress/gzip::powershell-gzipstream-compress
      - id: micro-behaviors/fs/path/extension::windows-exe-path-reference
      - id: gzip-write-rtf-sidecar
    near_lines: 32
  - id: powershell-gzip-rtf-stomp
    desc: Gzip-packs then stomps RTF magic
    crit: hostile
    conf: 0.97
    all:
      - id: micro-behaviors/data/compress/gzip::powershell-gzipstream-compress
      - id: gzip-rtf-magic-stomp
      - id: gzip-write-rtf-sidecar
    near_lines: 32
