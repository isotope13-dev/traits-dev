# A payload that carries staging paths for platforms it was not built for.
#
# `/data/local/tmp` is Android's world-writable drop directory; a hidden dotfile
# under `/tmp` is the Linux equivalent. A binary that names both, alongside a
# list of candidate shell interpreters, is not configured for the machine it is
# on — it is one build of a codebase compiled for every architecture the
# operator can reach, carrying every drop location any of those targets might
# offer. The PowerPC64 sample this was written for names an Android directory
# it can never use, because the same source is also shipped as an ARM build
# that can.
#
# Suspicious rather than hostile: cross-platform installers and device-flashing
# tools legitimately carry both, which is why the interpreter-probe leg is
# required — a real installer knows which shell it needs.
defaults:
  platforms: [linux, android]
  for: [elf]
  attack: T1074.001

composite_rules:
  - id: cross-platform-drop-path-set
    desc: Carries drop paths for several platforms
    crit: suspicious
    conf: 0.93
    all:
      - id: micro-behaviors/fs/path/temp::android-local-tmp-path
      - id: micro-behaviors/fs/path/temp::hidden-tmp-state-file
      - id: micro-behaviors/process/create/shell/native::multi-shell-path-probe-set
