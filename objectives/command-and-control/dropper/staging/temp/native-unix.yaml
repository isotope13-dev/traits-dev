defaults:
  platforms: [unix]
  for: [elf]
  attack: T1059.004

composite_rules:
  - id: native-hidden-shell-stager
    desc: Native binary stages a hidden numeric file through /bin/sh
    crit: hostile
    conf: 0.97
    attack: T1059.004,T1564.001
    mbc: B0028,F0005
    all:
      - id: micro-behaviors/fs/path/temp::native-hidden-numeric-file-template
      - id: micro-behaviors/fs/proc/exe::process-self-exe-path
      - id: micro-behaviors/process/create/shell/spawn::bin-sh-binary-text
    near_bytes: 128

  # Static loader stub for a staged payload: it names a set of hidden /tmp
  # files (key, ciphertext, output), then chmods the output, unlinks the inputs
  # and execs the result. Static linking keeps the stub portable across the
  # architectures the operator drops it on; nothing here is configurable, so
  # the only thing it can run is whatever an earlier stage left in /tmp.
  - id: static-hidden-tmp-payload-exec-stub
    desc: Static stub chmods and execs hidden /tmp payload
    crit: hostile
    conf: 0.9
    platforms: [linux]
    attack: T1027,T1564.001,T1070.004
    all:
      - id: metadata/binary/linking/static::static-linked
      - id: micro-behaviors/fs/path/temp::hidden-tmp-file-cluster
      - id: micro-behaviors/process/create/execv::static-execl-symbol-text
      - id: micro-behaviors/fs/chmod/modify::static-chmod-symbol-text
      - id: micro-behaviors/fs/delete/file/library::static-unlink-symbol-text
