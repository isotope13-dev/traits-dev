defaults:
  platforms: [unix]
  for: [elf]
  attack: T1059.004

composite_rules:
  - id: native-hidden-shell-stager
    desc: Native binary stages a hidden numeric file through /bin/sh
    crit: hostile
    conf: 0.97
    attack: T1059.004,T1564.001
    mbc: B0028,F0005
    all:
      - id: micro-behaviors/fs/path/hidden::native-hidden-numeric-file-template
      - id: micro-behaviors/fs/proc/exe::process-self-exe-path
      - id: micro-behaviors/fs/path/application/interpreter::bin-sh-path-reference
    near_bytes: 128
