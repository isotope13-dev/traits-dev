# Installer staging: a separate opaque data file is placed in a user temp
# directory beside a loader. The blob is not executable or parseable on its own,
# so the rule correlates the extraction destination with its byte shape rather
# than claiming to know what the blob decrypts to.
#
# Both legs are neutral on their own: installers legitimately stage helper files
# in $TEMP, and encrypted or compressed data can look opaque. The pair is
# unusual enough to report as suspicious, but the blob alone does not prove an
# executable payload.
defaults:
  platforms: [windows]
  for: [data]
  attack: T1027.009
  mbc: F0001

composite_rules:
  - id: installer-temp-high-entropy-data-stage
    desc: Installer stages opaque high-entropy data in user Temp
    crit: suspicious
    conf: 0.9
    all:
      - id: micro-behaviors/fs/path/temp::nsis-temp-destination-entry
      - id: metadata/file/profile/metrics::opaque-high-entropy-data-file
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/installer/family/
