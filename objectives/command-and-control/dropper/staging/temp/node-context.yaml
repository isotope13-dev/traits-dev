defaults:
  platforms:
  - unix
  - windows
  for:
  - javascript
  - typescript
traits:
- id: random-temp-filename
  desc: Random/unusual temp filename
  crit: component
  conf: 0.8
  if:
    type: string_literal
    regex: '\b(tmppppp|temp[0-9a-f]{8}|rand[0-9]+)\.js\b'
composite_rules:
- id: temp-js-stage-and-run
  desc: JavaScript temp write and launch context
  crit: suspicious
  conf: 0.8
  near_bytes: 2048
  all:
  - id: micro-behaviors/fs/path/temp::js-path-under-tmp
  - id: micro-behaviors/fs/write/file/full::js-file-write
  any:
  - id: random-temp-filename
  - id: micro-behaviors/process/create/exec::node-process-launch-call
  unless:
  - id: well-known/app/ai/gateway/neurolink::benign-archive-context
  - id: well-known/tool/development/agent/anthropic-claude-agent/
  - id: well-known/app/infrastructure/pulumi::pulumi-source-tree
  - id: well-known/lib/web/stx::stacksjs-stx-framework-context

