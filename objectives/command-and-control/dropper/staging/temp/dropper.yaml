defaults:
  platforms:
  - windows
  for:
  - pe
traits:
- id: temp-dropper-dummy
  desc: dummy
  crit: notable
  if:
    type: text
    exact: dummy_not_found_ever_temp
# The command line is a sprintf template: the first %s is a temp directory
# and the second is the file the dropper just wrote for Notepad to show.
- id: temp-notepad-quoted-launch-format
  desc: Quoted temp notepad launch format
  crit: notable
  conf: 0.95
  if:
    type: text
    exact: '"%s\notepad.exe" "%s"'
- id: dmd-msvcr120-runtime-dll
  desc: DMD bundled Microsoft CRT runtime DLL
  crit: notable
  conf: 0.96
  if:
    type: path
    substr: bin64/msvcr120.dll
composite_rules:
- id: self-copying-temp-pe-dropper
  desc: Self-copies PE to Temp and launches it
  crit: hostile
  conf: 0.99
  attack: "T1027.009"
  all:
  - id: micro-behaviors/process/info/current::get-module-filename-wide
  - id: micro-behaviors/fs/file/open::file-create-win
  - id: micro-behaviors/fs/read/file/handle::read-file
  - id: micro-behaviors/os/sysinfo/directories::win32-temp-path-name
  - id: micro-behaviors/fs/write/file/handle::write-file
  - id: micro-behaviors/process/create/shellexec::shell-execute
  - id: micro-behaviors/fs/file/pe-inspect::inline-pe-signature-check
  unless:
  - id: metadata/binary/installer/
  - id: metadata/signed/platform/
# Retired encoded-temp-command-stager: Base64-alphabet data, Temp APIs,
# cmd.exe and process APIs can be unrelated (including in OpenCV native
# support libraries). These facts do not bind decoded bytes to a staged file
# or process argument. Keep the four neutral observations at their own homes.
# Fragment reconstruction with user-path ballast does not establish file staging.
# Retained as concealment and executable-memory observations in their own homes.
- id: mingw-temp-exec-ping-beacon-dropper
  desc: MinGW temp dropper builds ping -t beacon process commands
  crit: hostile
  conf: 0.92
  attack: T1105,T1059
  all:
  - id: metadata/lang/compiler/native::mingw-built-pe
  - id: micro-behaviors/fs/temp/file::temp-path-file-api-primitives
  - id: micro-behaviors/process/create/exec::create-process-a
  - id: micro-behaviors/process/argument/executable::ping-continuous-host-command-format
  any:
  - id: metadata/binary/layout/tls::pe-multiple-tls-callbacks
  - id: micro-behaviors/data/parse/portable-executable::pe-header-walk-x64
  - id: micro-behaviors/fs/file/pe-inspect::inline-pe-signature-check
  needs: 1
  unless:
  - id: metadata/signed/platform/
  - id: metadata/binary/installer/family/
- id: mingw-temp-notepad-ping-beacon-dropper
  desc: Temp dropper launches notepad and ping
  crit: hostile
  conf: 0.94
  attack: T1105,T1059
  all:
  - id: metadata/lang/compiler/native::mingw-built-pe
  - id: micro-behaviors/fs/temp/file::temp-path-file-api-primitives
  - id: micro-behaviors/process/create/exec::create-process-a
  - id: temp-notepad-quoted-launch-format
  - id: micro-behaviors/process/argument/executable::ping-continuous-host-command-format
  unless:
  - id: metadata/signed/platform/
  - id: metadata/binary/installer/family/
- id: temp-staged-process-execution-cleanup
  desc: Stages temp executable, launches process, and deletes file
  crit: hostile
  conf: 0.98
  attack: T1105,T1027.009,T1070.004
  all:
  - id: micro-behaviors/os/sysinfo/directories::win32-temp-path-import
  - id: micro-behaviors/process/create/spawn::create-process-w
  - id: micro-behaviors/fs/delete/file/library::deletefile-w
  - id: metadata/binary/section/entropy::high-entropy-rdata-section
  - id: metadata/signed/trust-level::unsigned-missing-signature-record
  unless:
  - id: metadata/signed/platform/
  - id: metadata/binary/installer/family/
  - id: metadata/binary/installer/sfx/
  - id: metadata/binary/installer/script/
