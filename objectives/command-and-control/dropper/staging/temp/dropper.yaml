defaults:
  platforms:
  - windows
  for:
  - pe
traits:
- id: temp-dropper-dummy
  desc: dummy
  crit: notable
  if:
    type: text
    exact: dummy_not_found_ever_temp
- id: dmd-msvcr120-runtime-dll
  desc: DMD bundled Microsoft CRT runtime DLL
  crit: notable
  conf: 0.96
  if:
    type: path
    substr: bin64/msvcr120.dll
composite_rules:
- id: self-copying-temp-pe-dropper
  desc: Self-copies PE to Temp and launches it
  crit: hostile
  conf: 0.99
  attack: "T1027.009"
  all:
  - id: micro-behaviors/os/module/load::get-module-filename-dup
  - id: micro-behaviors/fs/file/open::file-create-win
  - id: micro-behaviors/fs/file/read::read-file
  - id: micro-behaviors/fs/temp/directory::get-temp-path-dup
  - id: micro-behaviors/fs/file/write/direct::write-file
  - id: micro-behaviors/process/create/exec::shell-execute
  - id: micro-behaviors/fs/file/pe-inspect::inline-pe-signature-check
  unless:
  - id: metadata/binary/installer/
  - id: metadata/signed/platform/
- id: encoded-temp-command-stager
  desc: Large encoded data with Temp staging and command execution
  crit: suspicious
  conf: 0.9
  all:
  - id: objectives/anti-static/obfuscation/payload/encoded::large-base64-string-dup
  - id: micro-behaviors/fs/temp/directory::temp-file-staging-primitives
  - id: micro-behaviors/process/create/exec::cmd-exe-reference
  - id: micro-behaviors/process/create/spawn::child-process-creation-api
  unless:
  - id: metadata/binary/installer/
  - id: metadata/binary/framework/
  - id: well-known/app/
  - id: well-known/tool/
- id: temp-dropper
  desc: Writes file to Temp directory and executes it
  # Temp creation plus a process-launch API is common installer/runtime work.
  # The explicit self-copying and encoded-command composites above provide the
  # hostile stager verdict when payload evidence is present.
  crit: notable
  conf: 0.8
  size_max: 10485760
  all:
  - id: micro-behaviors/fs/temp/directory::get-temp-path-dup
  - id: micro-behaviors/fs/file/open::fopen
  any:
  - id: micro-behaviors/process/create/spawn::create-process-a
  - id: micro-behaviors/process/create/exec::shell-execute-a
