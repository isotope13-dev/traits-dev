defaults:
  platforms: [windows]
  for: [c, cpp, pe, dll]
  attack: T1105

traits:
  - id: native-base64-temp-driver-drop
    desc: Native base64 temp driver drop
    crit: suspicious
    conf: 0.93
    if:
      type: text
      regex: 'CryptStringToBinaryA[\s\S]{0,480}GetTempPathA[\s\S]{0,300}\.sys'

composite_rules:
  - id: mapped-temp-payload-execute-cleanup
    desc: Unsigned DLL writes, maps, executes, waits for, and deletes a temp payload
    crit: hostile
    conf: 0.99
    size_max: 65536
    attack: T1027.009,T1070.004
    all:
      - id: metadata/binary/metrics/pe-details::pe-dll-characteristics
      - id: metadata/binary/layout::pe-no-signature-record
      - id: objectives/anti-static/obfuscation/string/encoding::db-substitution-browser-target-set
      - id: micro-behaviors/fs/temp/directory::temp-file-staging-primitives
      - id: micro-behaviors/fs/file/write/direct::write-file
      - id: micro-behaviors/fs/memory/mmap::create-file-mapping-w
      - id: micro-behaviors/fs/memory/mmap::map-view-of-file
      - id: micro-behaviors/process/create/spawn::create-process-w
      - id: micro-behaviors/process/control/wait::wait-for-single-object-api
      - id: micro-behaviors/fs/file/delete::deletefile-w
    unless:
      - id: metadata/signed/platform/
  - id: native-temp-driver-service-dropper
    desc: Native temp driver service dropper
    crit: hostile
    conf: 0.98
    all:
      - id: native-base64-temp-driver-drop
      - id: micro-behaviors/os/service/config::kernel-driver-service-registration
    any:
      - id: micro-behaviors/os/service/control::create-service
      - id: micro-behaviors/crypto/library/encoding::crypt-string-to-binary
