defaults:
  platforms: [openwrt, unix]
  for: [zig]
  attack: T1059.004
  mbc: B0023

traits:
  - id: zig-hidden-temp-shell-path
    desc: Zig hidden temp shell path
    crit: suspicious
    conf: 0.9
    if:
      type: text
      regex: '/tmp/\.[A-Za-z0-9_.-]{3,64}\.sh'
  - id: zig-shell-payload-commands
    desc: Zig shell payload commands
    crit: suspicious
    conf: 0.88
    if:
      type: text
      substr: 'id\nuname -a\nwhoami'
  - id: zig-bin-sh-c
    desc: Zig /bin/sh -c execution
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '"/bin/sh"[\s\S]{0,80}"-c"'
  - id: zig-hidden-tmp-lure
    desc: Zig hidden /tmp lure path
    crit: suspicious
    conf: 0.9
    if:
      type: text
      substr: /tmp/.syshealthd
  - id: zig-b64-hidden-tmp-shell
    desc: Zig decodes hidden temp shell
    crit: suspicious
    conf: 0.94
    if:
      type: text
      regex: 'base64_decode[\s\S]{0,500}/tmp/\.[A-Za-z0-9._-]+\.sh'

composite_rules:
  - id: openwrt-zig-temp-shell-stage
    desc: OpenWrt Zig temp shell stage
    crit: hostile
    conf: 0.97
    all:
      - id: zig-hidden-temp-shell-path
      - id: zig-shell-payload-commands
      - id: micro-behaviors/process/create/direct::zig-child-init
      - id: zig-bin-sh-c
  - id: zig-hidden-b64-tmp-stage
    desc: Zig base64 hidden temp shell
    crit: hostile
    conf: 0.97
    all:
      - id: zig-b64-hidden-tmp-shell
      - id: zig-hidden-temp-shell-path
  - id: zig-syshealth-lure-stage
    desc: Zig syshealth hidden lure
    crit: hostile
    conf: 0.96
    all:
      - id: zig-hidden-tmp-lure
      - id: objectives/exfiltration/stealer/system-info::native-netscaler-http-beacon
