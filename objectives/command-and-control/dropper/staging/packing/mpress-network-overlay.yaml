# A packed stub with a dominant opaque overlay and a network import is a
# concealed payload stage. This is intentionally narrower than the neutral
# MPRESS and Winsock capability traits it composes.
defaults:
  platforms: [windows]
  for: [pe]
  attack: T1027.002,T1620
  mbc: B0032,B0030

composite_rules:
  - id: mpress-concealed-network-overlay-loader
    desc: MPRESS loader with concealed network-capable overlay
    crit: hostile
    conf: 0.97
    all:
      - id: objectives/anti-static/pack/mpress::mpress-sparse-dynamic-loader
      - id: metadata/binary/layout::overlay-dominates-80pct
      - id: metadata/binary/section/metrics::pe-entry-in-writable-section
      - id: micro-behaviors/communications/socket/init::htons-api-ordinal
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/installer/family/
      - id: metadata/binary/framework/

  # A 68% overlay is below the 80% threshold used by the narrower rule above,
  # but this sample has the stronger combination of an MPRESS dynamic-import
  # stub, a high-entropy overlay, and an actual Winsock send import.
  - id: mpress-packed-winsock-overlay-loader
    desc: MPRESS loader hides a Winsock-capable payload in its overlay
    crit: hostile
    conf: 0.97
    attack: T1027.002,T1027.009,T1071.001,T1105
    all:
      - id: objectives/anti-static/pack/mpress::mpress-sparse-dynamic-loader
      - id: metadata/binary/layout::high-entropy-overlay
      - id: micro-behaviors/communications/socket/init::send-api
      - id: metadata/binary/section/metrics::pe-entry-in-writable-section
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/installer/family/
      - id: metadata/binary/framework/
