defaults:
  platforms: [windows]
  for: [pe]
  attack: T1105
  mbc: B0024
composite_rules:
  - id: microsoft-nsis-injector-bundle
    desc: Microsoft signed NSIS injector bundle
    crit: hostile
    conf: 0.99
    all:
      - id: metadata/signed/platform::microsoft
      - id: metadata/binary/layout/ratio::multiple-pe-embedded
      - id: metadata/binary/layout/ratio::many-pe-embedded
      - id: metadata/binary/layout/overlay::large-overlay-1mb
      - id: metadata/binary/installer/script::nsis
      - id: metadata/binary/installer/script::nsis-plugin-bundle
      - id: micro-behaviors/process/inject/runtime/call::write-process-memory-dup
      - id: micro-behaviors/process/inject/remote-thread::remote-thread-api-reference
      - id: micro-behaviors/mem/alloc/remote::virtual-alloc-ex
    any:
      - id: micro-behaviors/process/debug/detect::local-and-remote-debugger-api-references
      - id: metadata/binary/layout/ratio::mavinject32-name
      - id: metadata/binary/layout/ratio::tnameserv-name
      - id: metadata/binary/installer/script::nsis-uac-bridge
    needs: 2

  - id: signed-overlay-stage-bundle
    desc: Signed overlay multistage PE bundle
    crit: suspicious
    conf: 0.97
    all:
      - id: metadata/signed/platform::microsoft
      - id: metadata/binary/layout/ratio::multiple-pe-embedded
      - id: metadata/binary/layout/overlay::large-overlay-1mb
      - id: metadata/binary/layout/ratio::overlay-over-35pct
    any:
      - id: metadata/binary/layout/ratio::mavinject32-name
      - id: metadata/binary/layout/ratio::tnameserv-name
      - id: metadata/binary/installer/script::nsis
      - id: objectives/anti-static/polyglot/format::pe-multi-embedded-payload-container
    needs: 2

  - id: nsis-sideload-runonce-stage-bundle
    desc: NSIS sideload bundle with RunOnce persistence
    crit: hostile
    conf: 0.995
    attack: T1574.002,T1027.009
    all:
      - id: metadata/binary/installer/script::nsis
      - id: metadata/binary/layout/ratio::multiple-pe-embedded
      - id: micro-behaviors/fs/path/library::multiple-windows-dll-name-references
    any:
      - id: "micro-behaviors/os/registry/keys/autostart::windows-run-key-path"
      - id: micro-behaviors/process/info/name::trustedinstaller-label-reference
      - id: metadata/binary/layout/overlay::low-entropy-large-overlay
      - id: micro-behaviors/os/privilege/token::shutdown-privilege-name
    needs: 3
