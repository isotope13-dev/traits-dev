defaults:
  platforms: [windows]
  for: [pe]
composite_rules:
  - id: test-brand-overlay-loader
    desc: Test-branded loader with opaque PE overlay
    crit: suspicious
    conf: 0.99
    all:
      - id: metadata/binary/resource/identity::test-branding-cluster
      - id: micro-behaviors/fs/read/file/handle::pe-module-path-file-io-overlay
      - id: metadata/binary/layout/overlay::overlay-80kb-high-entropy
      - id: metadata/binary/layout/overlay::overlay-dominates-third
    any:
      - id: micro-behaviors/ui/window/station::window-station-query-chain
      - id: micro-behaviors/ui/window/probe::ansi-gui-probe
      - id: objectives/anti-static/obfuscation/string/recovery::xor-getuserobject-text-burst
      - id: objectives/anti-analysis/debugger-detect/combined-checks::debugger-check-with-guards
      - id: objectives/anti-analysis/timing/evasion::timing-anti-debug
      - id: micro-behaviors/process/debug/detect::is-debugger-present-import
      - id: micro-behaviors/process/debug/detect::is-debugger-present-string
    needs: 2
  - id: pecompact-encoded-api-remote-injector
    desc: PECompact injector with encoded API references
    crit: hostile
    conf: 0.97
    all:
      - id: objectives/anti-static/obfuscation/string/recovery::xor-getuserobject-text-burst
      - id: well-known/dual-use/packaging/pecompact
      - id: metadata/binary/section/permission::executable-rsrc-section
      - id: micro-behaviors/communications/ip/literal::external-ipv4-binary
      - id: micro-behaviors/mem/alloc/remote::virtual-alloc-ex-text
      - id: micro-behaviors/mem/write/arbitrary::write-process-memory-dup
  - id: ip-temp-process-loader-profile
    desc: Native loader with IP, temp-write and process clues
    crit: hostile
    conf: 0.99
    all:
      - id: micro-behaviors/communications/ip/literal::external-ipv4-binary
      - id: micro-behaviors/ui/window/station::getuserobject-info-text-burst
      - id: metadata/binary/section/ratio::few-sections
      - id: micro-behaviors/fs/write/file/handle::pe-temp-write-process-api-profile
      - id: micro-behaviors/process/enumerate/snapshot::toolhelp-enumeration-with-access
    any:
      - id: micro-behaviors/os/registry/access::registry-write-api-chain
      - id: objectives/anti-analysis/debugger-detect/combined-checks::debugger-check-with-guards
      - id: micro-behaviors/ui/window/station::window-station-query-chain
    needs: 2
