# Reflective shellcode entry-point loader in native PE binaries
# A position-independent stub walks the PEB loader order list, resolves
# routines through a modulebase+RVA table, and dispatches them with
# indirect calls: importless execution from an appended entry section.
# Ordinary packers keep an import table and a named code section; this
# combination describes staged shellcode, not a packed program.
defaults:
  for: [pe]
  platforms: [windows]
  attack: T1105,T1027,T1620
composite_rules:
  - id: reflective-shellcode-entry-loader
    desc: Shellcode entry with PEB API resolution
    crit: hostile
    conf: 0.93
    all:
      - id: micro-behaviors/os/api-resolution/manual::x64-teb-peb-ldr-order-walk
      - id: micro-behaviors/os/api-resolution/manual::x64-modulebase-rva-table-dispatch
    any:
      - id: micro-behaviors/process/info/query::peb-access-x64
    needs: 1

  - id: importless-pe-shellcode-loader
    desc: Importless PE with high-entropy code and TEB self-pointer query
    crit: hostile
    conf: 0.95
    all:
      - id: metadata/binary/header/malformed::pe-no-data-directories
      - id: metadata/binary/symbols/count::no-imports
      - id: micro-behaviors/os/sysinfo/process::teb-self-pointer-x86
    any:
      - id: metadata/binary/section/entropy::near-maximum-code-section-entropy
      - id: metadata/binary/code/entropy::high-code-entropy
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/framework/
