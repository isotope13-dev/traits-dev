# Opaque packed PE stubs: empty .text, decoy IAT, entry in a nonstandard
# high-entropy section, and no version resource — the common shape of
# VMProtect/Themida-style malware droppers once import protection is applied.
defaults:
  for: [pe, dll]
  platforms: [windows]
  attack: T1027.002,T1105
  mbc: F0001

composite_rules:
  - id: opaque-packed-dropper-stub
    desc: Opaque packed dropper stub with sparse timing imports
    crit: hostile
    conf: 0.98
    all:
      - id: objectives/anti-static/pack/detect::empty-text-minimal-import-packed-pe
      - id: metadata/binary/resource/identity::pe-no-version-info-resource
      - id: micro-behaviors/time/query::query-performance-frequency
      - id: micro-behaviors/ui/window/message::get-message-time
      - id: metadata/binary/symbols/imports::few-import-count
      - id: metadata/binary/section/label::multiple-nonstandard-section-names
    any:
      - id: metadata/binary/section/header::pe-entry-in-punctuated-section
      - id: metadata/binary/section/header::pe-entry-in-short-dotted-section
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/installer/family/

  - id: opaque-dual-pack-profile-dropper-stub
    desc: Empty-text PE matching both opaque pack detector profiles
    crit: hostile
    conf: 0.97
    all:
      - id: objectives/anti-static/pack/detect::empty-text-minimal-import-packed-pe
      - id: objectives/anti-static/pack/detect::empty-text-opaque-near-total-packed-pe
      - id: metadata/binary/resource/identity::pe-no-version-info-resource
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/installer/family/

  - id: opaque-plus-section-entry-packed-stub
    desc: Opaque near-total pack with entry in plus-named section
    crit: hostile
    conf: 0.97
    all:
      - id: objectives/anti-static/pack/detect::empty-text-opaque-near-total-packed-pe
      - id: metadata/binary/section/header::pe-entry-in-plus-section-name
      - id: metadata/binary/resource/identity::pe-no-version-info-resource
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/installer/family/
