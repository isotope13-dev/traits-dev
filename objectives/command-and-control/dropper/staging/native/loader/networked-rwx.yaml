defaults:
  for: [pe, dll]
  platforms: [windows]

composite_rules:
  - id: unsigned-rwx-registry-temp-profile
    desc: Unsigned RWX, registry and TEMP process clues
    crit: suspicious
    conf: 0.995
    attack: T1027,T1105,T1112,T1620
    all:
      - id: micro-behaviors/dylib/lookup::unsigned-writable-entry-api-lookup-debugger-imports
      - id: micro-behaviors/os/registry/access::registry-write-api-chain
      - id: micro-behaviors/fs/write/file/handle::pe-temp-write-process-api-profile
      - id: micro-behaviors/communications/ip/literal::external-ipv4-host-literal-binary
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/installer/family/
      - id: well-known/tool/reverse-engineering/

  - id: unsigned-rwx-reloc-wininet-stage-loader
    desc: Unsigned RWX reloc blob stages WinInet download
    crit: hostile
    conf: 0.97
    attack: T1105,T1027,T1620
    all:
      - id: metadata/binary/section/entropy::large-high-entropy-rwx-reloc
      - id: micro-behaviors/communications/http/client/wininet::wininet-http-flow
      - id: metadata/signed/trust-level::unsigned-missing-signature-record
      - id: micro-behaviors/process/debug/detect::is-debugger-present-import
    any:
      - id: metadata/binary/section/header::pe-entry-in-writable-section
      - id: metadata/binary/layout/overlay::high-entropy-overlay
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/installer/family/
      - id: well-known/tool/reverse-engineering/

  - id: unsigned-reloc-wininet-mapped-download-stub
    desc: Unsigned reloc maps image and WinInet downloads
    crit: hostile
    conf: 0.96
    attack: T1105,T1027,T1620
    all:
      - id: metadata/binary/section/entropy::large-high-entropy-rwx-reloc
      - id: micro-behaviors/communications/http/client/wininet::wininet-http-flow
      - id: micro-behaviors/fs/memory/mmap::win32-file-mapping
      - id: metadata/binary/section/header::unsigned-writable-entry-multi-rwx-high-code-entropy
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/installer/family/
      - id: well-known/tool/reverse-engineering/
