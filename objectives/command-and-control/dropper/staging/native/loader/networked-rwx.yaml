defaults:
  for: [pe, dll]
  platforms: [windows]

composite_rules:
  - id: unsigned-rwx-registry-temp-profile
    desc: Unsigned RWX, registry and TEMP process clues
    crit: suspicious
    conf: 0.995
    attack: T1027,T1105,T1112,T1620
    all:
      - id: micro-behaviors/dylib/lookup::unsigned-writable-entry-api-lookup-debugger-imports
      - id: micro-behaviors/os/registry/access::registry-write-api-chain
      - id: micro-behaviors/fs/write/file/handle::pe-temp-write-process-api-profile
      - id: micro-behaviors/communications/ip/literal::external-ipv4-host-literal-binary
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/installer/family/
      - id: well-known/tool/reverse-engineering/
