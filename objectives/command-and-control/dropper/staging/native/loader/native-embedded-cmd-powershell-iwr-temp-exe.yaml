# A native executable carrying a `cmd /c powershell -WindowStyle Hidden`
# command line that downloads with Invoke-WebRequest into a Temp executable and
# starts it hidden is a launcher for a second stage hosted on the web.
defaults:
  platforms: [windows]
  for: [pe]
  attack: T1105,T1059.001,T1564.003
composite_rules:
  - id: native-embeds-hidden-powershell-download-temp-exe-launch
    desc: Native PE embeds hidden PowerShell download and launch
    crit: hostile
    conf: 0.92
    all:
      - id: micro-behaviors/communications/http/download/cli::iwr-outfile-download
      - id: micro-behaviors/process/create/start-process::embedded-powershell-temp-exe
      - id: micro-behaviors/process/create/shell/command-mode::cmd-powershell-direct-launch
      - id: micro-behaviors/process/create/spawn::create-process-w
