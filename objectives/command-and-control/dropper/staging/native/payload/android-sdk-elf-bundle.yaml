# JNI exports, shell APIs and an ELF-like header are a staging indicator;
# the header bytes alone do not prove a complete executable was embedded.
defaults:
  platforms: [android]
  for: [elf]
  attack: T1105,T1620
  mbc: B0024

composite_rules:
  - id: jni-staged-elf-shell-bundle
    desc: JNI, shell APIs and embedded ELF32 header
    crit: suspicious
    conf: 0.97
    all:
      - id: metadata/binary/layout/embedded::elf32-header-after-start
      - id: metadata/binary/symbols/plugin::jni-native-method-exports
      - id: micro-behaviors/process/create/shell/native::c-system-import
      - id: micro-behaviors/process/create/shell/native::c-popen
