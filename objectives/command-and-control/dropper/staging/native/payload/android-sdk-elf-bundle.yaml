# Android .so files that ship staged native payloads: a coherent second ELF
# image inside the carrier, a Java-called entry point to reach it, and libc
# shell execution to launch what gets dropped. Asset-bundling SDKs embed
# data, but not executable ELF images next to shell executors.
defaults:
  platforms: [android]
  for: [elf]
  attack: T1105,T1620
  mbc: B0024

composite_rules:
  - id: jni-staged-elf-shell-bundle
    desc: JNI library stages embedded ELF for shell
    crit: hostile
    conf: 0.97
    all:
      - id: objectives/anti-static/polyglot/format::appended-elf32-le-binary
      - id: metadata/binary/symbols/plugin::jni-native-method-exports
      - id: micro-behaviors/process/create/shell/native::c-system-import
      - id: micro-behaviors/process/create/shell/native::c-popen
