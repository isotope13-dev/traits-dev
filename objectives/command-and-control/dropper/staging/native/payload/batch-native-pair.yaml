defaults:
  platforms: [windows]
  for: [batch]
composite_rules:
  - id: batch-temp-native-pair-background-stage
    desc: EXE/DLL URLs accompany temporary background download staging
    crit: suspicious
    conf: 0.95
    attack: T1105,T1574.002
    all:
      - id: micro-behaviors/communications/http/url/path::batch-assigned-exe-http-url
      - id: micro-behaviors/communications/http/url/path::batch-assigned-dll-http-url
      - id: micro-behaviors/communications/http/download/curl::batch-curl-output-flag
      - id: micro-behaviors/fs/path/temp::windows-temp-path
      - id: micro-behaviors/process/create/shell/batch::batch-background-variable-command
