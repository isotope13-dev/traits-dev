defaults:
  platforms: [linux, android]
  for: [elf]
  attack: T1027.009,T1105

composite_rules:
  # A minimal syscall-interface ELF carrying an encrypted blob past its
  # section table is the canonical IoT stager shape: a loader that decrypts
  # an appended second stage and executes it without touching named libc
  # entry points. Benign appended data (certificates, debug info, assets)
  # is low entropy and arrives in binaries with ordinary import tables.
  - id: elf-syscall-only-overlay-stager
    desc: Syscall-only ELF carries encrypted overlay payload
    crit: suspicious
    conf: 0.93
    attack: T1027.009,T1105,T1132
    all:
      - id: metadata/binary/layout/overlay::elf-has-overlay
      - id: micro-behaviors/os/syscall/invoke::syscall-wrapper-import
      - id: metadata/binary/layout/overlay::elf-overlay-entropy-over-75
      - id: metadata/binary/symbols/count::elf-12-or-fewer-imports
  # The stream cipher bytecode welds the transport to the payload: the
  # overlay is not merely compressed data, it is RC4-encrypted stage that
  # this binary is equipped to decrypt.
  - id: rc4-encrypted-overlay-stager
    desc: RC4 stager decrypts embedded overlay payload
    crit: hostile
    conf: 0.96
    attack: T1027.009,T1027.013,T1140,T1105
    all:
      - id: elf-syscall-only-overlay-stager
      - id: micro-behaviors/crypto/symmetric/stream/rc4::rc4-bytecode
  # The stager hands control to the decrypted stage: an execve issued through
  # a raw syscall interface (wrapper or immediate) next to the encrypted
  # overlay is the execution half of the pattern.
  - id: overlay-stager-execve
    desc: Encrypted overlay stager executes payload
    crit: hostile
    conf: 0.96
    attack: T1027.009,T1105,T1059
    all:
      - id: elf-syscall-only-overlay-stager
    any:
      - id: micro-behaviors/os/syscall/invoke::execve-syscall-wrapper-thumb
      - id: micro-behaviors/os/syscall/raw::x64-mov-execve-syscall
      - id: micro-behaviors/os/syscall/raw::mips-o32-execve-syscall
  - id: mips-encrypted-stage-file-exec-loader
    desc: MIPS loader writes and executes an encrypted second stage
    crit: hostile
    conf: 0.995
    attack: T1027.009,T1106,T1140
    all:
      - id: objectives/anti-static/obfuscation/payload/section/layout::mips-encrypted-payload-blob
      - id: micro-behaviors/os/syscall/raw::mips-o32-execve-syscall
      - id: micro-behaviors/os/syscall/raw::mips-o32-open-syscall
      - id: micro-behaviors/os/syscall/raw::mips-o32-write-syscall
    any:
      - id: micro-behaviors/fs/path/temp::native-transient-staging-directory
      - id: metadata/binary/header/program::elf-executable-stack
  - id: static-encrypted-embedded-elf-loader
    desc: Static encrypted embedded ELF loader
    crit: hostile
    conf: 0.98
    all:
      - id: "metadata/binary/linking/records::elf-dynamic-linker-metadata-and-needed-libs-absent"
      - id: metadata/binary/code/complexity::single-complex-function
      - id: objectives/anti-static/polyglot/format::appended-elf-binary
      - id: metadata/binary/section/entropy::very-high-entropy-elf-data-section
    any:
      - id: micro-behaviors/crypto/symmetric/stream/rc4::rc4-stack-key-bytecode
      - id: micro-behaviors/os/syscall/raw::x64-raw-syscall-wrapper
      - id: micro-behaviors/os/syscall/raw::x86-int80-wrapper
  - id: rc4-embedded-elf-loader
    desc: RC4 embedded ELF loader
    crit: hostile
    conf: 0.98
    all:
      - id: objectives/anti-static/polyglot/format::appended-elf-binary
      - id: metadata/binary/section/entropy::very-high-entropy-elf-data-section
      - id: micro-behaviors/crypto/symmetric/stream/rc4::rc4-stack-key-bytecode
    any:
      - id: "metadata/binary/linking/records::elf-dynamic-linker-metadata-and-needed-libs-absent"
      - id: metadata/binary/code/complexity::single-complex-function
