defaults:
  for: [pe, dll]
  platforms: [windows]
  attack: T1027,T1140,T1055.012

composite_rules:
  - id: compressed-reloc-runpe-stage
    desc: Compressed stage executed by a .reloc-entry RunPE loader
    crit: hostile
    conf: 0.99
    all:
      - id: objectives/evasion/process/injection/hollowing/process::reloc-entry-compressed-process-hollowing
      - id: metadata/binary/section/header::pe-entry-in-writable-section
    unless:
      - id: metadata/signed/platform/
      - id: well-known/tool/reverse-engineering/
  - id: compressed-writable-entry-runpe-stage
    desc: Compressed payload staged by a writable-entry RunPE loader
    crit: hostile
    conf: 0.99
    all:
      - id: objectives/evasion/process/injection/hollowing/process::writable-entry-compressed-process-hollowing
      - id: metadata/binary/section/header::pe-entry-in-writable-section
    unless:
      - id: metadata/signed/platform/
      - id: well-known/tool/reverse-engineering/
