# Exact path/response/writer/child bindings plus a direct activation edge.
# The staged image is written directly into the editor's extension root,
# then launched detached with ignored stdio and a hidden window on finish.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
traits:
  - id: editor-root-hidden-native-stage-flow
    desc: Activation hides staged editor-root executable
    crit: suspicious
    conf: 0.99
    attack: T1105,T1564.003
    if:
      type: tree-sitter
      query: |
        ((program
        (lexical_declaration
        (variable_declarator
        name: (identifier) @root_image
        value: (call_expression
        function: (member_expression property: (property_identifier) @join)
        arguments: (arguments
         (call_expression function: (member_expression property: (property_identifier) @home))
         (string (string_fragment) @editor_dir)
         (string (string_fragment) @extensions_dir)
         (string (string_fragment) @image)))))
        (function_declaration
        name: (identifier) @installer
        body: (statement_block
        (try_statement
        body: (statement_block
        (return_statement
        (new_expression
        constructor: (identifier) @promise
        arguments: (arguments
        (arrow_function
        body: (statement_block
        (expression_statement
        (call_expression
        function: (member_expression
        object: (call_expression
         function: (member_expression property: (property_identifier) @get)
         arguments: (arguments (_)
          (arrow_function parameters: (formal_parameters (identifier) @response)
           body: (statement_block
            (lexical_declaration (variable_declarator
             name: (identifier) @writer
             value: (call_expression function: (member_expression property: (property_identifier) @write)
              arguments: (arguments (identifier) @stored))))
            (expression_statement (call_expression
             function: (member_expression object: (identifier) @response_pipe property: (property_identifier) @pipe)
             arguments: (arguments (identifier) @piped_writer)))
            (expression_statement (call_expression
             function: (member_expression object: (identifier) @finished_writer property: (property_identifier) @on)
             arguments: (arguments (string (string_fragment) @event)
              (arrow_function body: (statement_block
               (if_statement consequence: (statement_block
                (expression_statement (call_expression
                 function: (member_expression
                  object: (call_expression
                   function: (member_expression property: (property_identifier) @spawn)
                   arguments: (arguments (identifier) @launched (array)
         (object
          (pair key: (property_identifier) @detached value: (true))
          (pair key: (property_identifier) @stdio value: (string (string_fragment) @ignored))
          (pair key: (property_identifier) @hidden value: (true)))))
                  property: (property_identifier) @unref))))))))))))))
        property: (property_identifier)))))))))))))
        (function_declaration
        name: (identifier) @activation
        body: (statement_block
        (if_statement
        consequence: (statement_block
        (expression_statement
        (await_expression
        (call_expression
        function: (identifier) @autoload))))))))
        (#eq? @get "get") (#eq? @write "createWriteStream")
         (#eq? @pipe "pipe") (#eq? @on "on") (#eq? @event "finish")
         (#eq? @spawn "spawn") (#eq? @unref "unref")
         (#eq? @response @response_pipe)
         (#eq? @writer @piped_writer) (#eq? @writer @finished_writer)
         (#eq? @stored @launched)
         (#eq? @promise "Promise") (#eq? @join "join") (#eq? @home "homedir")
         (#eq? @editor_dir ".vscode") (#eq? @extensions_dir "extensions")
         (#match? @image "[.]exe$") (#eq? @root_image @stored)
         (#eq? @detached "detached") (#eq? @stdio "stdio") (#eq? @ignored "ignore")
         (#eq? @hidden "windowsHide") (#eq? @activation "activate")
         (#eq? @installer @autoload)
        )

composite_rules:
  - id: activation-editor-root-native-bootstrap
    desc: Extension activation stages hidden native image
    crit: hostile
    conf: 0.99
    all:
      - id: editor-root-hidden-native-stage-flow
      - id: well-known/lib/development/vscode::activate-export
    any:
      - id: metadata/import/builtin::require-http
      - id: metadata/import/builtin::require-https
