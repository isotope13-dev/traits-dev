defaults:
  platforms: [windows]
  for: [pe]
  attack: T1059.001,T1105,T1562.001

composite_rules:
  # WinINet plus an embedded Expand-Archive command is a native dropper
  # staging pattern: the PE fetches payloads and unpacks them via PowerShell
  # rather than using its own archive APIs.
  - id: native-pe-powershell-expand-archive-wininet-stager
    desc: Native PE embeds PowerShell archive extraction with WinINet C2
    crit: hostile
    conf: 0.96
    attack: T1105,T1059.001,T1204.002
    all:
      - id: micro-behaviors/process/create/shell/command-flag::powershell-command-text
      - id: micro-behaviors/data/archive/extract/zip::powershell-expand-archive-text
      - id: micro-behaviors/communications/http/client/wininet::internet-connect
    unless:
      - id: metadata/signed/platform/
  # A native executable that carries a base64 PowerShell stage: it disables
  # AMSI through the AmsiUtils reflection trick, then downloads with
  # WebClient and runs the result with Invoke-Item. Native programs have no
  # reason to embed a PowerShell scanner-bypass plus fetch-and-run chain.
  - id: native-embedded-amsi-bypass-webclient-invoke-loader
    desc: Native PE embeds AMSI bypass, WebClient fetch and run
    crit: hostile
    conf: 0.95
    all:
      - id: objectives/evasion/anti-av/amsi::base64-amsi-init-failed-field
      - id: micro-behaviors/communications/http/download/webclient::webclient-downloadfile-call
      - id: micro-behaviors/process/create/shellexec::powershell-invoke-item
      - id: micro-behaviors/communications/http/url/scheme::cleartext-http-url
    unless:
      - id: metadata/signed/platform/
      - id: metadata/package/testing/presence/corpus::binary-test-fixture-member
    downgrade:
      scope: archive
      any:
        - id: metadata/package/testing/presence/corpus::binary-test-fixture-member
