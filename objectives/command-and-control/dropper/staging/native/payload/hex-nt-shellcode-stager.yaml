defaults:
  platforms: [windows]
  for: [pe, dll]
  crit: hostile
  attack: T1027.007,T1055,T1620

composite_rules:
  - id: contoso-runtime-hex-nt-shellcode-stager
    desc: Contoso runtime masquerade hex NT shellcode
    conf: 0.96
    arch: [x86-64]
    attack: T1027.007,T1055,T1071.001
    size_max: 65536
    all:
      - id: objectives/evasion/masquerade/version-resource/claim::windows-runtime-suite-x-product-claim
      - id: metadata/file/encoded::long-hex-text-run
      - id: micro-behaviors/process/info/query::peb-access-x64
      - id: micro-behaviors/mem/alloc/virtual::alloc-memory-sym--ntallocatevirtualmemory
    any:
      - id: micro-behaviors/fs/path/library::wininet-dll-name-reference
      - id: micro-behaviors/communications/http/dynamic::http-send-request-ansi-string
    needs: 1
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/installer/family/
  - id: hex-nt-peb-embedded-shellcode-loader-x64
    desc: Hex shellcode via PEB walk and NT alloc
    conf: 0.95
    arch: [x86-64]
    size_max: 65536
    all:
      - id: metadata/file/encoded::long-hex-text-run
      - id: micro-behaviors/process/info/query::peb-access-x64
      - id: micro-behaviors/mem/alloc/virtual::alloc-memory-sym--ntallocatevirtualmemory
      - id: micro-behaviors/mem/protect/modify::nt-protect-virtual-memory-name
    any:
      - id: micro-behaviors/mem/sync/cache::nt-flush-instruction-cache
      - id: micro-behaviors/fs/path/library::wininet-dll-name-reference
    needs: 1
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/installer/family/
      - id: metadata/binary/symbols/count::many-imports-20
