defaults:
  platforms: [windows]
  for: [pe]
  mbc: B0024
  attack: T1105

traits:
  - id: invoke-webrequest-tls12-chain
    desc: Invoke-WebRequest with forced TLS12
    crit: suspicious
    conf: 0.94
    if:
      type: raw
      regex: 'SecurityProtocolType\]::Tls12.{0,120}Invoke-WebRequest -Uri '
      case_insensitive: true

  - id: download-log-artifact
    desc: Download log artifact name
    crit: suspicious
    conf: 0.9
    if:
      type: text
      exact: download_log.txt

  - id: task-system-xml-name
    desc: System task XML artifact
    crit: suspicious
    conf: 0.9
    if:
      type: text
      exact: client_task_system.xml

  - id: task-user-xml-name
    desc: User task XML artifact
    crit: suspicious
    conf: 0.9
    if:
      type: text
      exact: client_task_user.xml

  - id: public-libraries-drop-path
    desc: Public Libraries drop path
    crit: suspicious
    conf: 0.9
    if:
      type: text
      exact: C:\Users\Public\Libraries

  - id: decoy-vcruntime-error
    desc: Decoy missing VCRUNTIME error text
    crit: suspicious
    conf: 0.95
    if:
      type: text
      exact: The code execution cannot be continued because VCRUNTIME140.dll was not found. Reinstalling the program may fix this problem.

composite_rules:
  - id: powershell-staged-dropper
    desc: Resource dropper with PowerShell staging
    crit: suspicious
    conf: 0.95
    all:
      - id: objectives/command-and-control/dropper/staging/native/payload::pe-resource-extraction-to-temp
    any:
      - id: micro-behaviors/process/argument/option::powershell-hidden-command-line
      - id: micro-behaviors/os/privilege/elevation::powershell-start-process-runas
      - id: invoke-webrequest-tls12-chain
      - id: micro-behaviors/os/security/defender::defender-exclusion-command
    needs: 3

  - id: windows-tasked-powershell-dropper
    desc: PowerShell dropper with scheduled task persistence
    crit: hostile
    conf: 0.98
    all:
      - id: powershell-staged-dropper
      - id: objectives/persistence/login/scheduled-task/masquerade::schtask-elevated
    any:
      - id: public-libraries-drop-path
      - id: task-system-xml-name
      - id: task-user-xml-name
      - id: download-log-artifact
      - id: metadata/binary/symbols/compat::wrapper-main-export-pair
    needs: 2

  - id: decoy-error-dropper
    desc: Dropper with deceptive failure dialog
    crit: suspicious
    conf: 0.95
    all:
      - id: decoy-vcruntime-error
      - id: micro-behaviors/ui/dialog/prompt::message-box-w
    any:
      - id: powershell-staged-dropper
      - id: objectives/anti-analysis/debugger-detect/check::is-debugger-present-symbol
      - id: objectives/evasion/masquerade/version-resource/claim::fake-windows-update-service-versioninfo
    needs: 2

  # An unsigned binary that requires administrator privilege, fetches remote
  # files over HTTP (URLMon download capability), and carries a launcher that
  # hides its PowerShell window while overriding the execution policy stages
  # remote code with concealment at every step: the download, the launch and
  # the privilege are each ordinary alone, but co-occurring in one unsigned
  # admin binary they describe a dropper, not an updater. Installer
  # bootstrapper runtimes (Advanced Installer, platform-signed) ship the same
  # launcher strings and are carved out.
  - id: privileged-concealed-downloader
    desc: Unsigned admin downloader with concealed policy-bypass launcher
    crit: hostile
    conf: 0.95
    attack: T1105,T1059.001
    all:
      - id: objectives/evasion/security-bypass/policy/execution::pe-concealed-policy-override-profile
      - id: micro-behaviors/communications/http/client/urlmon::url-download-to-file
      - id: micro-behaviors/os/privilege/manifest::require-administrator
      - id: metadata/signed/trust-level::unsigned-missing-signature-record
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/installer/family/
      - id: metadata/binary/installer/builder::advanced-installer-bootstrapper
      - id: well-known/tool/

  # A version resource claiming updater identity wrapped around a hidden
  # PowerShell downloader that fetches a remote payload and immediately
  # executes it: the updater label is the lure, the concealed
  # download-and-launch chain is the payload. Legitimate updaters move
  # files with BITS or WinHTTP, never with a hidden powershell.exe
  # download-and-Start-Process chain, and an abused-TLD endpoint confirms
  # the infrastructure is not the vendor's.
  - id: fake-updater-powershell-downloader
    desc: Fake updater with hidden PowerShell download
    crit: hostile
    conf: 0.95
    attack: T1105,T1036
    all:
      - id: micro-behaviors/process/deploy::powershell-outfile-start-process-chain
    any:
      - id: metadata/binary/provenance/version-info::pe-version-description-updater-claim
      - id: objectives/command-and-control/infrastructure/domain/abused-tlds::tld-cyou
      - id: micro-behaviors/communications/http/download/cli::iwr-outfile-download
    needs: 1
