defaults:
  for: [pe]
  platforms: [windows]
  attack: T1105
composite_rules:
  - id: fake-gui-peb-registry-downloader
    desc: Fake GUI imports with PEB walk and registry reads
    crit: hostile
    conf: 0.96
    attack: T1105,T1027,T1082
    size_max: 131072
    all:
      - id: micro-behaviors/ui/graphics/draw::begin-paint-symbol
      - id: micro-behaviors/os/api-resolution/hash-based::peb-ldr-list-access-x86
      - id: micro-behaviors/os/registry/access::registry-read-api-chain
      - id: metadata/binary/code/entropy::high-code-entropy
      - id: metadata/signed/trust-level::unsigned-missing-signature-record
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/installer/family/
      - id: well-known/app/
      - id: well-known/tool/

  - id: unsigned-small-fake-gui-dynapi-downloader
    desc: Small fake-GUI PE dynamically resolves APIs in obfuscated code
    crit: hostile
    conf: 0.95
    attack: T1105,T1027
    size_max: 131072
    all:
      - id: micro-behaviors/ui/graphics/draw::begin-paint-symbol
      - id: micro-behaviors/ui/window/probe::get-active-window
      - id: micro-behaviors/dylib/load/runtime::load-library-a
      - id: micro-behaviors/dylib/lookup::get-proc-address-import
      - id: metadata/binary/code/entropy::code-entropy-over-7p4
      - id: metadata/signed/trust-level::unsigned-missing-signature-record
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/installer/family/
      - id: well-known/app/
      - id: well-known/tool/
