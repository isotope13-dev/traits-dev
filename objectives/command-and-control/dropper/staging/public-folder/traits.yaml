defaults:
  platforms:
    - windows
  for:
    - javascript
    - powershell
    - batch
traits:
  - id: public-folder-short-random
    desc: Short staged executable name in Users Public
    crit: suspicious
    conf: 0.8
    attack: T1564.001
    if:
      type: text
      regex: '(?i)Users[\\/]+Public[\\/]+[a-z0-9_-]{5,8}\.(exe|dll|bin)\b'
  # An executable nested one random-named directory deep under Users\Public:
  # C:\Users\Public\<rand>\<rand>.exe. Legitimate installers never stage under
  # the Public folder, and a world-writable drop location with two randomized
  # name components is generated staging — the directory is created per victim
  # run so the path never repeats between samples.
  - id: public-folder-randomized-nested-drop
    desc: Random-dir staged exe under Users Public
    crit: suspicious
    conf: 0.85
    attack: T1564.001
    if:
      type: text
      regex: '(?i)Users[\\/]+Public[\\/]+[a-z0-9_-]{3,12}[\\/]+[a-z0-9_-]{3,12}\.exe\b'
    unless:
      # The named subfolders of the Public profile are Windows shell folders;
      # only randomized directory names count as generated staging.
      - type: text
        regex: '(?i)Users[\\/]+Public[\\/]+(Desktop|Documents|Downloads)[\\/]'
      - type: text
        regex: '(?i)Users[\\/]+Public[\\/]+(Libraries|Music|Pictures|Videos)[\\/]'
  - id: public-folder-staging-pattern
    desc: Public-folder path near staging operation
    crit: suspicious
    conf: 0.8
    if:
      type: text
      regex: '(?is)(copy|download|write).{0,240}Users[\\/]+Public'
  - id: public-folder-script-fragment
    desc: Public-folder script staging path fragment
    crit: component
    conf: 0.9
    for: [javascript]
    if:
      type: text
      regex: '(?i)Users.{0,40}Public.{0,40}[a-z0-9_-]{4,16}'
