defaults:
  platforms: [unix]
  for: [shell]
  crit: suspicious
  attack: T1036.005

composite_rules:
  - id: transient-system-binary-staging
    desc: Stages executable system binaries alongside delayed removal
    conf: 0.96
    near_lines: 6
    all:
      - id: micro-behaviors/fs/file/copy::shell-copy-system-binary
      - id: micro-behaviors/fs/chmod/executable/mode::chmod-system-path-executable
      - id: objectives/evasion/indicator-removal/cleanup::background-system-binary-delayed-removal
