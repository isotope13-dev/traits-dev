defaults:
  attack: T1105
  mbc: B0030
  platforms: [unix]
  for: [shell]
composite_rules:
- id: shell-wget-tmp-chmod-exec
  desc: Shell downloads to /tmp, chmods and executes it
  crit: hostile
  conf: 0.97
  attack: "T1105,T1222.002"
  near_lines: 20
  unless:
  - id: metadata/file/extension/identity::python-artifact-extension
  all:
  - id: micro-behaviors/communications/http/download/wget::wget-http-url-reference
  - id: micro-behaviors/fs/chmod/executable/mode::chmod-exec-tmp-file
  - id: micro-behaviors/process/create/local-exec::tmp-path-execution
  downgrade:
    scope: archive
    any:
    - id: well-known/tool/detection/cc-audit::cc-audit-source-package-identity
- id: external-ip-wildcard-chmod-stage
  desc: External-IP payload download with wildcard executable staging
  crit: hostile
  conf: 0.98
  attack: "T1105,T1222.002"
  near_lines: 20
  all:
  - id: micro-behaviors/communications/http/download/shell::shell-curl-wget-url-fetch
  - id: micro-behaviors/fs/chmod/executable/mode::shell-plus-x-wildcard
  - id: micro-behaviors/communications/ip/literal::external-ipv4-http-url
  # Same single-vs-repeated prologue split as the execution-side twin: the
  # canonical stub carries the five-directory chain once.
  any:
  - id: micro-behaviors/fs/directory/chdir::writable-dir-fallback-exact-chain
  - id: micro-behaviors/fs/directory/chdir::writable-dir-fallback-chain
  # No `unless:` pointing at external-ip-multiarch-wildcard-stage: that
  # composite takes this one as a required leg, so suppressing this rule
  # whenever the stronger one matches starves the stronger one of its leg
  # and both vanish. Both findings are accurate; they stay.
- id: external-ip-multiarch-wildcard-stage
  desc: Multi-architecture external payload staging
  crit: hostile
  conf: 0.98
  attack: "T1105,T1222.002"
  near_lines: 20
  all:
  - id: objectives/command-and-control/dropper/staging/file::external-ip-wildcard-chmod-stage
  - id: "micro-behaviors/os/sysinfo/platform/string::multi-arch-runtime-wordlist"
