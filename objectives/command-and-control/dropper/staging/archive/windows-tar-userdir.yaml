defaults:
  platforms: [windows]
  for: [batch, powershell, text]
  attack: T1105

traits:
  - id: tar-extract-to-appdata
    desc: tar extracts archive into AppData
    crit: suspicious
    conf: 0.92
    if:
      type: text
      regex: '(?i)\btar(\.exe)?\s+-C\s+%APPDATA%\s+-x[a-z]*f\s+\S{1,80}'

  # Carve-out below: the per-user Python Scripts directory is where pip
  # --user installs console-script launchers, so installer documentation
  # that references an AppData exe there is not a staged-payload launch.
  - id: appdata-exe-launch
    desc: Launches executable from AppData
    crit: suspicious
    conf: 0.9
    if:
      type: text
      regex: '(?i)%APPDATA%\\[^"''\s&|]{1,80}\\[^"''\s&|]{1,80}\.exe\b'
    unless:
      - id: micro-behaviors/fs/path/app-data::pip-user-scripts-exe-path

  - id: explorer-decoy-office-document-open
    desc: Opens office decoy document with Explorer
    crit: suspicious
    conf: 0.86
    if:
      type: text
      regex: '(?i)\bexplorer(\.exe)?\s+"?[^"&|]{1,120}\.(pdf|docx?|xlsx?|pptx?)"?'

  # The argument is one path token. Prose such as "variable explorer icon"
  # followed by a markdown image URL is not `explorer.exe` opening a decoy.
  - id: explorer-decoy-image-open
    desc: Opens image decoy with Explorer
    crit: suspicious
    conf: 0.84
    if:
      type: text
      regex: '(?i)\bexplorer(\.exe)?\s+"?[^"\s&|]{1,120}\.(jpg|jpeg|png)\b'

composite_rules:
  - id: explorer-decoy-document-open
    desc: Opens decoy document with Explorer
    crit: suspicious
    conf: 0.88
    any:
      - id: explorer-decoy-office-document-open
      - id: explorer-decoy-image-open

  - id: appdata-tar-decoy-installer
    desc: AppData tar extraction with decoy launch
    crit: hostile
    conf: 0.97
    all:
      - id: tar-extract-to-appdata
      - id: appdata-exe-launch
    any:
      - id: explorer-decoy-document-open
      - id: objectives/evasion/masquerade/extension/double

  - id: batch-curl-tar-appdata-dropper
    desc: Batch downloads archive via curl, extracts with tar, and executes from AppData
    crit: hostile
    conf: 0.98
    attack: T1105,T1059.003
    for: [batch]
    all:
      - id: micro-behaviors/communications/http/download/curl::batch-curl-output-flag
      - id: micro-behaviors/data/archive/extract/tar::tar-extract
      - id: micro-behaviors/fs/path/app-data::windows-appdata-directory-path
      - id: micro-behaviors/communications/ip/literal::batch-public-ip-literal
    any:
      - id: micro-behaviors/fs/path/application/executable::appdata-exe-path
      - id: micro-behaviors/process/create/shell/command-mode::start-empty-window-title
      - id: micro-behaviors/process/create/shell/command-mode::start-quoted-executable-command

