defaults:
  platforms: [windows]
  for: [powershell, scripts, binaries]
  attack: T1204.002
traits:
  - id: recursive-lure-zip-search
    desc: Recursive lure archive search
    crit: suspicious
    conf: 0.88
    if:
      type: text
      regex: (?is)where(\.exe)?\s+/r\s+\$env:USERPROFILE.{0,160}\.zip
  - id: recycle-bin-zip-stage
    desc: Recycle Bin ZIP staging
    crit: suspicious
    conf: 0.9
    if:
      type: text
      regex: (?is)\$RECYCLE\.BIN.{0,160}Rename-Item.{0,160}\.zip
  # ProgramData must be the extraction destination, so keep the match on the
  # Expand-Archive command line itself. A 260-byte any-character window also
  # swallowed unrelated later statements (e.g. a Chocolatey installer appending
  # C:\ProgramData\chocolatey\bin to PATH three lines below an unrelated
  # Expand-Archive), which the description never claimed to detect.
  - id: powershell-expand-archive-programdata
    desc: PowerShell expands archive into ProgramData
    crit: suspicious
    conf: 0.9
    if:
      type: text
      regex: (?i)Expand-Archive[^\r\n]{0,120}ProgramData
  - id: powershell-download-archive-tool
    desc: PowerShell archive download command reference
    crit: component
    conf: 0.9
    for: [powershell, batch]
    if:
      type: text
      regex: '(?i)\b(DownloadFile|Invoke-WebRequest|iwr|curl)\b'
  - id: powershell-expand-archive-command
    desc: PowerShell Expand-Archive command reference
    crit: component
    conf: 0.9
    for: [powershell, batch]
    if:
      type: text
      regex: '(?i)\bExpand-Archive\b'
  - id: powershell-tar-extract-command
    desc: PowerShell tar extraction command reference
    crit: component
    conf: 0.9
    for: [powershell, batch]
    if:
      type: text
      regex: '(?i)\btar\s+-[A-Za-z]*x\b'
  - id: powershell-7zip-extract-command
    desc: PowerShell 7-Zip extraction command reference
    crit: component
    conf: 0.9
    for: [powershell, batch]
    if:
      type: text
      regex: '(?i)\b7z(\.exe)?\s+[xet]\b'
composite_rules:
  - id: embedded-powershell-hidden-archive-exe-stager
    desc: Hidden PowerShell downloads and launches a TEMP archive executable
    crit: hostile
    conf: 0.99
    attack: T1059.001,T1105,T1140,T1564.003
    for: [javascript, typescript]
    all:
      - id: micro-behaviors/process/daemonize/spawn::powershell-hidden
      - id: micro-behaviors/communications/http/download/cli::iwr-archive-url-download
      - id: micro-behaviors/data/archive/extract/zip::powershell-expand-archive
      - id: micro-behaviors/process/create/start-process::embedded-powershell-temp-exe
    near_bytes: 512

  - id: powershell-archive-extract
    desc: PowerShell archive extraction command reference
    crit: component
    conf: 0.9
    for: [powershell, batch]
    any:
      - id: powershell-expand-archive-command
      - id: powershell-tar-extract-command
      - id: powershell-7zip-extract-command

  - id: powershell-download-archive-execute
    desc: PowerShell downloads archive then executes
    crit: suspicious
    conf: 0.92
    all:
      - id: powershell-download-archive-tool
      - id: powershell-archive-extract
    # Keep generic invocation mechanics in the capability tier. The archive
    # objective comes from combining one of these with download + archive +
    # extraction evidence, not from the invocation primitive by itself.
    any:
      - id: micro-behaviors/process/create/start-process::start-process-call
      - id: micro-behaviors/process/create/exec::powershell-invoke-item
      - id: micro-behaviors/process/create/exec::powershell-call-exe
    near_lines: 40
    unless:
      - id: well-known/tool/sysadmin/microsoft-powershell::powershell-download-archive-known-installer-context
      - id: well-known/lib/data/adios2::adios2-windows-ci-setup-context
      - id: well-known/app/system/aptl/
      - id: well-known/tool/sysadmin/kubernetes/bootstrap::kubernetes-windows-gce-ssh-installer-exception
    downgrade:
      any:
        - id: micro-behaviors/crypto/hash/file::powershell-file-hash-compare

  # A passworded archive is a delivery concealment measure, not archive
  # collection.  Pair it with the documented Defender-disable and payload
  # launch sequence before inferring a hostile stealer delivery workflow.
  - id: powershell-defender-disabled-passworded-archive-launch
    desc: Defender bypassed before passworded archive payload launch
    crit: hostile
    conf: 0.99
    attack: T1105,T1204.002,T1562.001
    mbc: B0030,E1562
    for: [powershell, batch]
    all:
      - id: objectives/evasion/anti-av/platform/defender::defender-disable-realtime
      - id: powershell-download-archive-execute
      - id: micro-behaviors/data/archive/extract/password::cli-passworded-archive-extraction
      - id: micro-behaviors/os/privilege/elevation::runas-verb
    near_lines: 40

  # ClickFix fake-CAPTCHA stages commonly fetch a remote instruction stream,
  # evaluate it with IEX, then download and extract a payload under TEMP.
  # Requiring the full sequence keeps the hostile inference separate from
  # ordinary archive handling and from ordinary PowerShell web requests.
  - id: powershell-remote-instruction-temp-archive-execute
    desc: PowerShell evaluates remote instructions before executing a TEMP archive payload
    crit: hostile
    conf: 0.98
    attack: T1059.001,T1105,T1204.002
    for: [powershell]
    all:
      - id: powershell-download-archive-execute
      - id: micro-behaviors/process/interpreter/eval/direct::powershell-iex-call
      - id: micro-behaviors/fs/path/temp::env-temp
    near_lines: 40

  - id: powershell-hidden-remote-instruction-launch
    desc: Hidden PowerShell launches a remotely supplied instruction
    crit: hostile
    conf: 0.98
    attack: T1059.001,T1105,T1564.003
    for: [powershell]
    all:
      - id: micro-behaviors/process/interpreter/eval/direct::powershell-iex-call
      - id: micro-behaviors/communications/http/lib/invoke-webrequest::invoke-webrequest
      - id: micro-behaviors/process/create/hidden::powershell-hidden-window
      - id: micro-behaviors/process/create/start-process::start-process-call
    near_lines: 40

  - id: archive-lnk-hidden-powershell-stage
    desc: Archive LNK hidden PowerShell stage
    crit: hostile
    conf: 0.97
    needs: 2
    any:
      - id: recursive-lure-zip-search
      - id: recycle-bin-zip-stage
      - id: micro-behaviors/process/create/hidden::start-process-windowstyle-hidden
  - id: powershell-cloud-archive-programdata-exec
    desc: PowerShell cloud archive ProgramData execution
    crit: hostile
    conf: 0.96
    attack: T1105
    all:
      - id: powershell-expand-archive-programdata
      - id: powershell-download-archive-execute
    any:
      - id: objectives/command-and-control/infrastructure/cloud
