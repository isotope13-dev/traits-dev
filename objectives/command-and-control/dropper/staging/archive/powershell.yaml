defaults:
  platforms: [windows]
  for: [powershell, scripts, binaries]
  attack: T1204.002
traits:
  - id: recursive-lure-zip-search
    desc: Recursive lure archive search
    crit: suspicious
    conf: 0.88
    if:
      type: text
      regex: (?is)where(\.exe)?\s+/r\s+\$env:USERPROFILE.{0,160}\.zip
  - id: recycle-bin-zip-stage
    desc: Recycle Bin ZIP staging
    crit: suspicious
    conf: 0.9
    if:
      type: text
      regex: (?is)\$RECYCLE\.BIN.{0,160}Rename-Item.{0,160}\.zip
  # ProgramData must be the extraction destination, so keep the match on the
  # Expand-Archive command line itself. A 260-byte any-character window also
  # swallowed unrelated later statements (e.g. a Chocolatey installer appending
  # C:\ProgramData\chocolatey\bin to PATH three lines below an unrelated
  # Expand-Archive), which the description never claimed to detect.
  - id: powershell-expand-archive-programdata
    desc: PowerShell expands archive into ProgramData
    crit: suspicious
    conf: 0.9
    if:
      type: text
      regex: (?i)Expand-Archive[^\r\n]{0,120}ProgramData
  - id: powershell-expand-archive-command
    desc: PowerShell Expand-Archive command reference
    crit: notable
    conf: 0.9
    for: [powershell, batch]
    if:
      type: text
      regex: '(?i)\bExpand-Archive\b'
  - id: powershell-tar-extract-command
    desc: PowerShell tar extraction command reference
    crit: component
    conf: 0.9
    for: [powershell, batch]
    if:
      type: text
      regex: '(?i)\btar\s+-[A-Za-z]*x\b'
  - id: powershell-7zip-extract-command
    desc: PowerShell 7-Zip extraction command reference
    crit: component
    conf: 0.9
    for: [powershell, batch]
    if:
      type: text
      regex: '(?i)\b7z(\.exe)?\s+[xet]\b'
  - id: powershell-start-process-7z-extract-args
    desc: PowerShell Start-Process 7-Zip extract arguments
    crit: notable
    conf: 0.92
    for: [powershell]
    if:
      type: text
      regex: (?i)Start-Process[^\n]{0,240}ArgumentList[^\n]{0,160}'x'
composite_rules:
  - id: powershell-archive-extract
    desc: PowerShell archive extraction command reference
    crit: component
    conf: 0.9
    for: [powershell, batch]
    any:
      - id: powershell-expand-archive-command
      - id: powershell-tar-extract-command
      - id: powershell-7zip-extract-command

  - id: archive-lnk-hidden-powershell-stage
    desc: Archive LNK hidden PowerShell stage
    crit: hostile
    conf: 0.97
    needs: 2
    any:
      - id: recursive-lure-zip-search
      - id: recycle-bin-zip-stage
      - id: micro-behaviors/process/create/hidden::start-process-windowstyle-hidden
