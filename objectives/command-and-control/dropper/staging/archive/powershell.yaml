defaults:
  platforms: [windows]
  for: [powershell, scripts, binaries]
  attack: T1204.002
traits:
  - id: recursive-lure-zip-search
    desc: Recursive lure archive search
    crit: suspicious
    conf: 0.88
    if:
      type: text
      regex: (?is)where(\.exe)?\s+/r\s+\$env:USERPROFILE.{0,160}\.zip
  - id: recycle-bin-zip-stage
    desc: Recycle Bin ZIP staging
    crit: suspicious
    conf: 0.9
    if:
      type: text
      regex: (?is)\$RECYCLE\.BIN.{0,160}Rename-Item.{0,160}\.zip
  # ProgramData must be the extraction destination, so keep the match on the
  # Expand-Archive command line itself. A 260-byte any-character window also
  # swallowed unrelated later statements (e.g. a Chocolatey installer appending
  # C:\ProgramData\chocolatey\bin to PATH three lines below an unrelated
  # Expand-Archive), which the description never claimed to detect.
  - id: powershell-expand-archive-programdata
    desc: PowerShell expands archive into ProgramData
    crit: suspicious
    conf: 0.9
    if:
      type: text
      regex: (?i)Expand-Archive[^\r\n]{0,120}ProgramData
    unless:
      - id: metadata/package/testing/
      - id: "metadata/file/naming::test-directory-component"
  - id: powershell-start-process-7z-extract-args
    desc: PowerShell Start-Process 7-Zip extract arguments
    crit: notable
    conf: 0.92
    for: [powershell]
    if:
      type: text
      regex: (?i)Start-Process[^\n]{0,240}ArgumentList[^\n]{0,160}'x'
composite_rules:
  - id: archive-lnk-hidden-powershell-stage
    desc: Archive LNK hidden PowerShell stage
    crit: hostile
    conf: 0.97
    needs: 2
    any:
      - id: recursive-lure-zip-search
      - id: recycle-bin-zip-stage
      - id: micro-behaviors/process/create/hidden::start-process-windowstyle-hidden
  # WebClient ZIP stagers fetch a non-.exe URL, Expand-Archive locally, then
  # Start-Process a nested executable — outside the EXE-URL legs used by
  # micro-behaviors/process/create/spawn::powershell-webclient-executable-url-start-context.
  - id: powershell-webclient-expand-archive-launch
    desc: WebClient extracts downloaded archive and launches payload
    crit: hostile
    conf: 0.98
    attack: T1105,T1204.002
    mbc: B0030
    for: [powershell]
    near_bytes: 2048
    all:
      - id: micro-behaviors/communications/http/download/webclient::webclient-downloadfile-call
      - id: micro-behaviors/data/archive/extract/capability::powershell-expand-archive-command
      - id: micro-behaviors/process/create/exec::start-process-call
    unless:
      - id: well-known/tool/sysadmin/microsoft-powershell::powershell-download-archive-known-installer-context
      - id: well-known/lib/data/adios2::adios2-windows-ci-setup-context
      - id: well-known/app/system/aptl/
      - id: well-known/tool/sysadmin/kubernetes/bootstrap::kubernetes-windows-gce-ssh-installer-exception
      - id: well-known/lib/runtime/scripted/nvidia-cuda::cuda-toolkit-installer-script

  # Stagers fetch an archive over HTTP, Expand-Archive locally, and establish
  # scheduled task persistence for the extracted payload.
  - id: powershell-archive-download-task-persistence
    desc: PowerShell downloads archive and establishes scheduled task persistence
    crit: hostile
    conf: 0.98
    attack: T1105,T1053.005
    mbc: B0030,F0012
    for: [powershell]
    near_bytes: 2048
    all:
      - id: micro-behaviors/data/archive/extract/capability::powershell-expand-archive-command
      - id: micro-behaviors/os/autorun/scheduled::schtasks-create-cmd
    any:
      - id: micro-behaviors/communications/http/download/cli::iwr-archive-url-download
      - id: micro-behaviors/communications/http/download/cli::iwr-outfile-download
      - id: micro-behaviors/communications/http/download/webclient::webclient-downloadfile-call
    unless:
      - id: well-known/tool/sysadmin/microsoft-powershell::powershell-download-archive-known-installer-context
      - id: well-known/lib/data/adios2::adios2-windows-ci-setup-context
      - id: well-known/app/system/aptl/
      - id: well-known/tool/sysadmin/kubernetes/bootstrap::kubernetes-windows-gce-ssh-installer-exception
      - id: well-known/lib/runtime/scripted/nvidia-cuda::cuda-toolkit-installer-script
