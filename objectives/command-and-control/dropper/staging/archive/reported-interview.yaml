defaults:
  platforms: [unix, windows]
  for: [python]
  size_max: 5000000
composite_rules:
  # The host and archive-shape clues may be unrelated in the same file.
  - id: reported-host-and-archive-stage-clues
    desc: Reported host and archive-stage clues
    crit: suspicious
    conf: 0.98
    all:
      - id: objectives/command-and-control/dropper/staging/archive::staged-archive-platform-loader
    any:
      - id: micro-behaviors/communications/url/host/name::apachelicense-vercel-host-reference
      - id: micro-behaviors/communications/url/host/name::logkit-vercel-host-reference
      - id: micro-behaviors/communications/url/host/name::logkit-onrender-host-reference
      - id: micro-behaviors/communications/url/host/name::ngrok-free-vercel-host-reference
