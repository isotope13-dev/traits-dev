defaults:
  platforms: [unix, appliance]
  for: [shell]
  attack: T1059.004,T1105,T1222.002,T1070.004
  mbc: B0024,B0030,F0007

composite_rules:
  - id: network-appliance-relay-stager
    desc: Router relay stager with archive payload
    crit: hostile
    conf: 0.99
    all:
      - id: micro-behaviors/os/firewall/firewalld::add-port-rule
      - id: micro-behaviors/data/archive/extract/tar::appended-tar-archive
      - id: micro-behaviors/process/create/local-exec::multi-local-executable-launch

  - id: self-deleting-network-appliance-relay-stager
    desc: Relay stager self-deletes after launch
    crit: hostile
    conf: 0.99
    all:
      - id: micro-behaviors/data/archive/extract/tar::appended-tar-archive
      - id: micro-behaviors/process/create/local-exec::multi-local-executable-launch
      - id: objectives/evasion/self-delete/cleanup/remove::rm-self-dollar-zero
      - id: micro-behaviors/fs/file/delete::rm-force-variable-target
    near_lines: 80
