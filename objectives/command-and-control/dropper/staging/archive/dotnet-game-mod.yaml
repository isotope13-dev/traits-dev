# Packed .NET game-mod / cheat installers: self-signed publisher stub that
# carries a high-entropy XOR stage, extracts ZIP payloads to disk, and gates
# on IsDebuggerPresent. SAE-mods MiniPack is the seed; the behavior legs are
# reusable for similar WoT/WarThunder pack installers.
defaults:
  platforms: [windows]
  for: [pe]
  attack: T1027.002,T1105,T1497.001
  mbc: B0010,B0001

composite_rules:
  - id: packed-dotnet-zip-mod-installer
    desc: Packed .NET stub extracts ZIP game-mod stage
    crit: hostile
    conf: 0.96
    attack: T1027.002,T1105
    all:
      - id: well-known/unwanted/sae-mods::sae-mods-minipack-identity
      - id: micro-behaviors/data/archive/extract/zip::dotnet-zip-entry-extract
      - id: metadata/binary/metrics/threshold::very-high-overall-entropy-75
    any:
      - id: micro-behaviors/process/debug/detect::is-debugger-present-import
      - id: micro-behaviors/process/debug/detect::is-debugger-present-string
      - id: metadata/signed/certificate/identity::pe-cert-leaf-self-issued-kv
