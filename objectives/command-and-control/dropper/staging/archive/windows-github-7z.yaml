defaults:
  platforms: [windows]
  for: [pe, batch, powershell]
  attack: T1105
  mbc: B0030

composite_rules:
  - id: github-passworded-7z-stager
    desc: GitHub passworded 7z stager
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/communications/url/external/github::github-release-7z-archive-download
      - id: micro-behaviors/communications/url/external/github::github-release-7zr-asset-download
      - id: micro-behaviors/data/archive/extract/password::sevenzip-password-option-pair
    any:
      - id: micro-behaviors/communications/http/get::url-download-to-file-str
      - id: micro-behaviors/communications/http/lib/invoke-webrequest::download
      - id: micro-behaviors/process/create/spawn::create-process-a
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/installer/family/
