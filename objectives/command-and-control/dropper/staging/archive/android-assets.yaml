defaults:
  platforms: [android]
  for: [apk, zip]
  mbc: B0024
  attack: T1027.002

traits:
  - id: apk-dex-drawable-apk-path
    desc: DEX references a drawable-hidden APK
    crit: notable
    conf: 0.94
    for: [dex]
    if:
      type: text
      regex: 'res/drawable[^/]{1,24}/[A-Za-z0-9._-]{1,40}\.apk'

  - id: apk-dex-telephony-sms
    desc: DEX references telephony SMS provider
    crit: notable
    conf: 0.9
    for: [dex]
    if:
      type: text
      substr: "Landroid/provider/Telephony$Sms;"

composite_rules:
  - id: apk-lcg-encrypted-package-stager
    desc: APK decrypts and writes a hidden package from a .pak asset
    crit: hostile
    conf: 0.995
    attack: T1027,T1631
    scope: outer
    for: [android_apk, dex]
    all:
      - id: metadata/package/files/mobile-package::apk-pak-asset-member
      - id: micro-behaviors/data/decode/xor::dalvik-lcg-byte-xor-decode-loop
      - id: micro-behaviors/process/create/loader::dalvik-asset-manager-class
      - id: micro-behaviors/process/create/loader::dalvik-file-output-stream-class
      - id: micro-behaviors/os/package-manager/management::android-package-archive-inspection

  - id: apk-b4a-firebase-stager
    desc: APK combines Firebase/GMS client modules with Basic4Android asset staging
    crit: suspicious
    conf: 0.94
    all:
      - id: metadata/package/files/mobile-package::android-apk-archive-layout
      - id: metadata/package/files/mobile-package::apk-b4a-bal-asset
      - id: metadata/package/files/mobile-package::apk-okhttp-publicsuffix-data

  - id: apk-hoal-opaque-asset-stager
    desc: APK combines the opaque assets/hoal/even location with another opaque asset name
    crit: suspicious
    conf: 0.94
    all:
      - id: metadata/package/files/mobile-package::android-apk-archive-layout
      - id: metadata/package/files/mobile-package::apk-hoal-even-asset
      - id: metadata/package/files/mobile-package::apk-opaque-extensionless-asset

  - id: apk-mbm-opaque-asset-stager
    desc: APK combines an MBM-named asset with another opaque extensionless asset name
    crit: suspicious
    conf: 0.92
    all:
      - id: metadata/package/files/mobile-package::android-apk-archive-layout
      - id: metadata/package/files/mobile-package::apk-mbm-opaque-assets
      - id: metadata/package/files/mobile-package::apk-opaque-extensionless-asset

  - id: apk-okhttp-opaque-asset-stager
    desc: APK combines OkHttp with opaque asset staging
    crit: suspicious
    conf: 0.93
    all:
      - id: metadata/package/files/mobile-package::android-apk-archive-layout
      - id: metadata/package/files/mobile-package::apk-okhttp-publicsuffix-data
      - id: metadata/file/archive::archive-misplaced-executable-member
    any:
      - id: metadata/package/files/mobile-package::apk-opaque-extensionless-asset
      - id: metadata/package/files/mobile-package::apk-opaque-shortext-asset
  - id: apk-high-entropy-okhttp-asset-stager
    desc: APK high-entropy OkHttp opaque asset stager
    crit: suspicious
    conf: 0.94
    all:
      - id: metadata/package/files/mobile-package::android-apk-archive-layout
      - id: metadata/package/files/mobile-package::apk-okhttp-publicsuffix-data
      - id: metadata/file/archive::high-entropy-archive
      - id: metadata/file/archive::archive-misplaced-executable-member
    any:
      - id: metadata/package/files/mobile-package::apk-opaque-extensionless-asset
      - id: metadata/package/files/mobile-package::apk-opaque-shortext-asset
  - id: apk-obfuscated-client-cert-asset-stager
    desc: APK obfuscated assets with client cert stores
    crit: hostile
    conf: 0.97
    attack: T1406
    all:
      - id: metadata/package/files/mobile-package::android-apk-archive-layout
      - id: objectives/anti-static/pack/archive::apk-obfuscated-member-table-payload
      - id: metadata/package/files/mobile-package::apk-opaque-extensionless-asset
      - id: metadata/package/files/mobile-package::apk-client-bks-asset
      - id: metadata/package/files/mobile-package::apk-client-p12-asset
  - id: apk-encrypted-native-http-stager
    for: [android_apk, zip, class]
    desc: APK encrypted native payload with HTTP bytecode stager
    crit: hostile
    conf: 0.98
    attack: T1406
    all:
      - id: objectives/anti-static/pack/archive::encrypted-apk-native-payload-anomaly
      - id: micro-behaviors/communications/http/lib/urlconnection::request-java-bytecode
  - id: apk-reflective-opaque-asset-loader
    for: [android_apk, apk, zip, dex]
    scope: outer
    desc: APK reflectively loads an opaque staged asset
    crit: hostile
    conf: 0.97
    attack: T1406
    all:
      - id: metadata/package/files/mobile-package::android-apk-archive-layout
      - id: micro-behaviors/process/lifecycle/runtime-init::attach-base-context
      - id: metadata/file/archive::high-entropy-archive
      - id: micro-behaviors/process/create/loader::reflective-access-bypass
      - id: micro-behaviors/process/create/loader::reflective-method-access
    any:
      - id: metadata/package/files/mobile-package::apk-opaque-extensionless-asset
      - id: metadata/package/files/mobile-package::apk-opaque-shortext-asset
  - id: apk-dalvik-surveillance-loader
    desc: APK reflective loader paired with multi-sensor surveillance
    for: [apk, zip, java, kotlin]
    crit: hostile
    conf: 0.995
    attack: T1406
    all:
      - id: objectives/command-and-control/dropper/module-load::apk-dalvik-reflection-stager
      - id: micro-behaviors/process/create/loader::system-load-library-call
    any:
      - id: micro-behaviors/hardware/display/camera::android-camera-capture-capability
      - id: micro-behaviors/hardware/display/screenshot::android-media-projection-screen-capture
      - id: micro-behaviors/os/message/intent::android-sms-originating-address-read
      - id: micro-behaviors/os/message/intent::android-sms-message-body-read
    needs: 2
  - id: apk-empty-dex-install-png-stager
    for: [apk, zip, java, kotlin, xml, dex]
    desc: APK empty DEX drawable PNG stager
    crit: hostile
    conf: 0.94
    all:
      - id: metadata/package/files/mobile-package::android-apk-archive-layout
      - id: objectives/anti-static/pack/archive::apk-empty-primary-dex-member
      - id: metadata/package/files/mobile-package::apk-large-drawable-png-asset
    any:
      - id: micro-behaviors/os/package-manager/sideload::android-request-install-packages-permission
      - id: micro-behaviors/os/package-manager/sideload::android-request-delete-packages-permission
      - id: micro-behaviors/os/service/daemon::android-foreground-service-permission
      - id: micro-behaviors/os/service/daemon::android-boot-completed-action
  - id: apk-nested-base-apk-dat-stager
    for: [apk, zip, java, kotlin, xml, dex]
    desc: APK carries nested base.apk with classes.dex.dat staging asset
    crit: suspicious
    conf: 0.96
    attack: T1406
    all:
      - id: metadata/package/files/mobile-package::android-apk-archive-layout
      - id: metadata/package/files/mobile-package::apk-nested-base-apk-asset
      - id: metadata/package/files/mobile-package::apk-classes-dex-dat-asset
    any:
      - id: micro-behaviors/os/package-manager/sideload::android-request-install-packages-permission
      - id: micro-behaviors/os/service/daemon::android-boot-completed-action
      - id: micro-behaviors/os/service/daemon::android-foreground-service-permission
  - id: apk-unicode-nested-apk-stager
    desc: APK carries nested APK behind Unicode archive names
    crit: hostile
    conf: 0.97
    attack: T1406
    all:
      - id: objectives/anti-static/pack/archive::apk-unicode-nested-archive-packer
      - id: metadata/package/files/mobile-package::apk-nested-apk-asset

  - id: apk-drawable-nested-apk-sms-stager
    desc: Drawable-hidden APK plus extra DEX stage
    crit: hostile
    conf: 0.96
    attack: T1406
    all:
      - id: metadata/package/files/mobile-package::apk-nested-apk-drawable
      - id: metadata/package/files/mobile-package::apk-secondary-dex

  - id: apk-drawable-nested-apk-multidex
    desc: Drawable-hidden APK uses a fourth DEX
    crit: hostile
    conf: 0.94
    attack: T1406
    all:
      - id: metadata/package/files/mobile-package::apk-nested-apk-drawable
      - id: metadata/package/files/mobile-package::apk-classes4-dex-member

  - id: apk-drawable-nested-apk-loader
    desc: Drawable-hidden APK uses a fifth DEX
    crit: hostile
    conf: 0.95
    attack: T1406
    all:
      - id: metadata/package/files/mobile-package::apk-nested-apk-drawable
      - id: metadata/package/files/mobile-package::apk-classes5-dex-member

  - id: apk-guid-asset-stage-bundle
    for: [android_apk]
    desc: APK stages payload data in many GUID-named assets
    crit: suspicious
    conf: 0.96
    all:
      - id: metadata/package/files/mobile-package::apk-guid-asset-filenames
      - id: metadata/package/files/mobile-package::apk-large-metadata-dat
  - id: apk-obfuscated-asset-payload-stage
    for: [android_apk]
    desc: APK stages opaque assets behind obfuscated resources
    crit: suspicious
    conf: 0.95
    any:
      - id: metadata/package/files/mobile-package::apk-numeric-asset-filename
      - id: metadata/package/files/mobile-package::apk-guid-asset-filenames
    all:
      - id: objectives/anti-static/pack/archive::apk-obfuscated-resource-pack
