defaults:
  platforms: [android]
  for: [apk, zip]
  mbc: B0024
  attack: T1027.002

traits:
  - id: apk-b4a-bal-asset
    desc: APK bundles Basic4Android BAL screen assets
    crit: component
    conf: 0.86
    if:
      type: value
      path: "archive.members[*].path"
      regex: "^assets/[^/]{1,32}\\.bal$"

  - id: apk-hoal-even-asset
    desc: APK hides opaque payload under assets/hoal/even
    crit: component
    conf: 0.9
    if:
      type: value
      path: "archive.members[*].path"
      exact: assets/hoal/even

  - id: apk-mbm-opaque-assets
    desc: APK carries an MBM-named opaque asset
    crit: component
    conf: 0.84
    if:
      type: value
      path: "archive.members[*].path"
      regex: "^assets/[^/]+\\.mbm$"

  - id: apk-opaque-extensionless-asset
    desc: APK carries an opaque extensionless asset name
    crit: component
    conf: 0.84
    if:
      type: value
      path: "archive.members[*].path"
      regex: '^assets/([A-Za-z0-9]{20,}|[^/]+/[A-Za-z0-9]{8,})$'

  - id: apk-client-bks-asset
    desc: APK bundles BKS client keystore
    crit: component
    conf: 0.88
    if:
      type: value
      path: "archive.members[*].path"
      exact: assets/client.bks

  - id: apk-client-p12-asset
    desc: APK bundles PKCS12 client cert
    crit: component
    conf: 0.88
    if:
      type: value
      path: "archive.members[*].path"
      exact: assets/client.p12

  - id: apk-opaque-shortext-asset
    desc: APK carries an opaque short-extension asset name
    crit: component
    conf: 0.86
    if:
      type: value
      path: "archive.members[*].path"
      regex: "^assets/[A-Za-z]{8,18}\\.[A-Za-z]$"

  - id: apk-opaque-data-asset
    desc: APK carries an opaque data payload asset
    crit: component
    conf: 0.88
    if:
      type: value
      path: "archive.members[*].path"
      regex: "^assets/[A-Za-z0-9_-]{8,32}\\.(dat|bin|payload)$"

  - id: apk-device-admin-resource
    desc: APK declares device-admin resource XML
    crit: component
    conf: 0.88
    if:
      type: value
      path: "archive.members[*].path"
      exact: res/xml/device_admin_sample.xml

  - id: apk-lock-screen-layout
    desc: APK includes lock-screen UI layout
    crit: component
    conf: 0.86
    if:
      type: value
      path: "archive.members[*].path"
      regex: "^res/layout/(lock_screen|main_uninstall_admin_device)\\.xml$"

  - id: apk-large-drawable-png-asset
    desc: APK carries drawable PNG asset
    crit: component
    conf: 0.86
    if:
      type: value
      path: "archive.members[*].path"
      regex: "^res/drawable[^/]*/[^/]+\\.png$"

  - id: apk-nested-base-apk-asset
    desc: APK carries nested base.apk asset
    crit: component
    conf: 0.9
    if:
      type: raw
      regex: "assets/base\\.apk"

  - id: apk-nested-apk-asset
    desc: APK carries nested APK asset
    crit: component
    conf: 0.9
    if:
      type: value
      path: "archive.members[*].path"
      regex: "^assets/[^/]+\\.apk$"

  - id: apk-classes-dex-dat-asset
    desc: APK carries classes.dex.dat asset
    crit: component
    conf: 0.9
    if:
      type: raw
      regex: "assets/classes\\.dex\\.dat"

composite_rules:
  - id: apk-lcg-encrypted-package-stager
    desc: APK decrypts and writes a hidden package from a .pak asset
    crit: hostile
    conf: 0.995
    attack: T1027,T1631
    scope: outer
    for: [apk]
    all:
      - id: metadata/package/files/mobile-package::apk-pak-asset-member
      - id: micro-behaviors/data/decode/xor::dalvik-lcg-byte-xor-decode-loop
      - id: micro-behaviors/process/create/loader::dalvik-asset-manager-class
      - id: micro-behaviors/process/create/loader::dalvik-file-output-stream-class
      - id: micro-behaviors/os/package-manager/management::android-package-archive-inspection

  - id: apk-b4a-firebase-stager
    desc: APK combines Firebase/GMS client modules with Basic4Android asset staging
    crit: suspicious
    conf: 0.94
    all:
      - id: metadata/package/files/mobile-package::android-apk-archive-layout
      - id: apk-b4a-bal-asset
      - id: objectives/command-and-control/dropper/staging/encrypted::apk-okhttp-publicsuffix-data

  - id: apk-hoal-opaque-asset-stager
    desc: APK combines the opaque assets/hoal/even location with another opaque asset name
    crit: suspicious
    conf: 0.94
    all:
      - id: metadata/package/files/mobile-package::android-apk-archive-layout
      - id: apk-hoal-even-asset
      - id: apk-opaque-extensionless-asset

  - id: apk-mbm-opaque-asset-stager
    desc: APK combines an MBM-named asset with another opaque extensionless asset name
    crit: suspicious
    conf: 0.92
    all:
      - id: metadata/package/files/mobile-package::android-apk-archive-layout
      - id: apk-mbm-opaque-assets
      - id: apk-opaque-extensionless-asset

  - id: apk-device-admin-lockscreen
    desc: APK packages device-admin and lock-screen UI resources
    crit: suspicious
    conf: 0.94
    all:
      - id: metadata/package/files/mobile-package::android-apk-archive-layout
      - id: apk-device-admin-resource
      - id: apk-lock-screen-layout

  - id: apk-okhttp-opaque-asset-stager
    desc: APK combines OkHttp with opaque asset staging
    crit: suspicious
    conf: 0.93
    all:
      - id: metadata/package/files/mobile-package::android-apk-archive-layout
      - id: objectives/command-and-control/dropper/staging/encrypted::apk-okhttp-publicsuffix-data
      - id: metadata/file/metrics::archive-misplaced-executable-member
    any:
      - id: apk-opaque-extensionless-asset
      - id: apk-opaque-shortext-asset
  - id: apk-high-entropy-okhttp-asset-stager
    desc: APK high-entropy OkHttp opaque asset stager
    crit: suspicious
    conf: 0.94
    all:
      - id: metadata/package/files/mobile-package::android-apk-archive-layout
      - id: objectives/command-and-control/dropper/staging/encrypted::apk-okhttp-publicsuffix-data
      - id: metadata/file/metrics::high-entropy-archive
      - id: metadata/file/metrics::archive-misplaced-executable-member
    any:
      - id: apk-opaque-extensionless-asset
      - id: apk-opaque-shortext-asset
  - id: apk-obfuscated-client-cert-asset-stager
    desc: APK obfuscated assets with client cert stores
    crit: hostile
    conf: 0.97
    attack: T1406
    all:
      - id: metadata/package/files/mobile-package::android-apk-archive-layout
      - id: objectives/anti-static/pack/archive::apk-obfuscated-member-table-payload
      - id: apk-opaque-extensionless-asset
      - id: apk-client-bks-asset
      - id: apk-client-p12-asset
  - id: apk-encrypted-native-http-stager
    desc: APK encrypted native payload with HTTP bytecode stager
    crit: hostile
    conf: 0.98
    attack: T1406
    all:
      - id: objectives/anti-static/pack/archive::encrypted-apk-native-payload-anomaly
      - id: micro-behaviors/communications/http/lib/urlconnection::request-java-bytecode
  - id: apk-reflective-opaque-asset-loader
    desc: APK reflectively loads an opaque staged asset
    crit: hostile
    conf: 0.97
    attack: T1406
    all:
      - id: metadata/package/files/mobile-package::android-apk-archive-layout
      - id: micro-behaviors/process/lifecycle/runtime-init::attach-base-context
      - id: metadata/file/metrics::high-entropy-archive
      - id: micro-behaviors/process/create/loader::reflective-access-bypass
      - id: micro-behaviors/process/create/loader::reflective-method-access
    any:
      - id: apk-opaque-extensionless-asset
      - id: apk-opaque-shortext-asset
  - id: apk-dalvik-reflection-stager
    desc: APK stages code through Dalvik reflection
    crit: notable
    conf: 0.97
    attack: T1406
    all:
      - id: metadata/package/files/mobile-package::android-apk-archive-layout
      - id: micro-behaviors/process/lifecycle/runtime-init::attach-base-context
      - id: micro-behaviors/process/create/loader::dalvik-classloader-descriptor
      - id: micro-behaviors/process/create/loader::dalvik-get-method-call
      - id: micro-behaviors/process/create/loader::dalvik-invoke-call
    any:
      - id: metadata/package/files/mobile-package::apk-asset-dex-member
      - id: apk-opaque-extensionless-asset
      - id: apk-opaque-shortext-asset
    unless:
      - id: metadata/package/testing/presence/fixture::android-apk-test-resources-path

  - id: apk-dalvik-surveillance-loader
    desc: APK reflective loader paired with multi-sensor surveillance
    crit: hostile
    conf: 0.995
    attack: T1406
    all:
      - id: apk-dalvik-reflection-stager
      - id: micro-behaviors/process/create/loader::system-load-library-call
    any:
      - id: micro-behaviors/hardware/display/camera::android-camera-capture-capability
      - id: micro-behaviors/hardware/display/screen::android-media-projection-screen-capture
      - id: micro-behaviors/os/message/intent::android-sms-originating-address-read
      - id: micro-behaviors/os/message/intent::android-sms-message-body-read
    needs: 2
  - id: apk-empty-dex-install-png-stager
    desc: APK empty DEX drawable PNG stager
    crit: hostile
    conf: 0.94
    all:
      - id: metadata/package/files/mobile-package::android-apk-archive-layout
      - id: objectives/anti-static/pack/archive::apk-empty-primary-dex-member
      - id: apk-large-drawable-png-asset
    any:
      - id: micro-behaviors/os/package-manager/install::android-request-install-packages-permission
      - id: micro-behaviors/os/package-manager/install::android-request-delete-packages-permission
      - id: micro-behaviors/os/service/daemon::android-foreground-service-permission
      - id: micro-behaviors/os/service/daemon::android-boot-completed-action
  - id: apk-nested-base-apk-dat-stager
    desc: APK carries nested base.apk with classes.dex.dat staging asset
    crit: suspicious
    conf: 0.96
    attack: T1406
    all:
      - id: metadata/package/files/mobile-package::android-apk-archive-layout
      - id: apk-nested-base-apk-asset
      - id: apk-classes-dex-dat-asset
    any:
      - id: micro-behaviors/os/package-manager/install::android-request-install-packages-permission
      - id: micro-behaviors/os/service/daemon::android-boot-completed-action
      - id: micro-behaviors/os/service/daemon::android-foreground-service-permission
  - id: apk-unicode-nested-apk-stager
    desc: APK carries nested APK behind Unicode archive names
    crit: hostile
    conf: 0.97
    attack: T1406
    all:
      - id: objectives/anti-static/pack/archive::apk-unicode-nested-archive-packer
      - id: apk-nested-apk-asset
