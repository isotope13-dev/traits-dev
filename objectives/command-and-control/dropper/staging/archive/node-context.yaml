defaults:
  platforms:
  - unix
  - windows
  for:
  - javascript
  - typescript

composite_rules:
- id: admzip-extract-spawn-exit
  desc: Archive extraction and process-exit context
  crit: suspicious
  conf: 0.92
  all:
  - id: micro-behaviors/data/archive/library::dynamic-new-archive
  - id: objectives/anti-static/obfuscation/syntax::obfuscated-true-call-argument
  - id: micro-behaviors/process/exit/terminate::process-exit
  - id: micro-behaviors/data/archive/library::adm-zip-lib
- id: zip-extract-walk-detached-exe
  desc: Archive extraction and detached executable context
  crit: suspicious
  conf: 0.96
  attack: T1105,T1059.007
  near_bytes: 4096
  all:
  - id: micro-behaviors/data/archive/extract/zip::js-zip-extract-all-to
  - id: micro-behaviors/fs/enumerate/directory::node-extname-exe-walk
  - id: micro-behaviors/process/create/spawn::detached-true
- id: obfuscated-node-archive-downloader-installer
  desc: Obfuscated archive and process context
  crit: suspicious
  conf: 0.98
  attack: T1105,T1059.007,T1027
  all:
  - id: micro-behaviors/process/create/shell/bridge::child-process-destructure-require
  - id: micro-behaviors/data/control-flow/dispatch::date-temp-write-delete
  - id: admzip-extract-spawn-exit
  unless:
  - id: metadata/package/testing/
  - id: metadata/build/bundler/asset::js-large-module-bundle
