defaults:
  platforms:
  - unix
  - windows
  for:
  - javascript
  - typescript

composite_rules:
- id: admzip-extract-spawn-exit
  desc: Archive extraction and process-exit context
  crit: suspicious
  conf: 0.92
  all:
  - id: micro-behaviors/data/archive/create/zip::dynamic-new-archive
  - id: metadata/lang/source/syntax/call/arguments::hex-zero-negation-call-argument
  - id: micro-behaviors/process/exit/terminate::process-exit
  - id: metadata/import/npm/adm-zip
- id: zip-extract-walk-detached-exe
  desc: Archive extraction and detached executable context
  crit: suspicious
  conf: 0.96
  attack: T1105,T1059.007
  near_bytes: 4096
  all:
  - id: micro-behaviors/data/archive/extract/zip::js-zip-extract-all-to
  - id: micro-behaviors/fs/directory/readdir/language::node-extname-exe-walk
  - id: metadata/file/profile/command-options::detached-true
- id: fetch-decrypt-extract-detached-exec
  desc: Fetched payload decrypted, extracted from archive, and executed detached
  crit: hostile
  conf: 0.97
  attack: T1105,T1140,T1059.007
  all:
  - id: zip-extract-walk-detached-exe
  - id: micro-behaviors/communications/http/request/client::http-client-usage
  any:
  - id: metadata/import/module::local-decrypt-helper-import
  - id: micro-behaviors/crypto/decrypt::js-decrypt-helper-call
  - id: micro-behaviors/crypto/decrypt::javascript-decrypt-method-call
- id: obfuscated-node-archive-downloader-installer
  desc: Obfuscated archive and process context
  crit: suspicious
  conf: 0.98
  attack: T1105,T1059.007,T1027
  all:
  - id: metadata/import/builtin::child-process-api-destructure
  - id: metadata/file/profile/file-write-context::temp-write-date-timeout-context
  - id: admzip-extract-spawn-exit
  unless:
  - id: metadata/package/testing/
  - id: metadata/build/bundler/asset::js-large-module-bundle
  - id: metadata/path/directory::test-directory-component
