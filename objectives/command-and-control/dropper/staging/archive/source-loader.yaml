defaults:
  platforms: [unix, windows]
  for: [python, go, rust, php]
  attack: T1105
  mbc: E1105
traits:
- id: staged-zip-archive-name
  desc: Text names reported ZIP archives
  crit: suspicious
  conf: 0.93
  if:
    type: text
    regex: "(ecw_update|logbundle_tmp)\\.zip"
- id: contagious-temp-extract-dir
  desc: Text names reported extraction directory
  crit: suspicious
  conf: 0.98
  if:
    type: text
    substr: 410BB449A-72C6-4500-9765-ACD04JBV827V32V
- id: google-drive-direct-rewrite
  desc: Text pairs Drive file and download URLs
  crit: suspicious
  conf: 0.95
  if:
    type: text
    regex: "drive\\.google\\.com/file/d/[\\s\\S]{0,260}drive\\.usercontent\\.google\\.com/download"
composite_rules:
- id: staged-archive-platform-loader
  desc: Archive, platform and download-name indicators
  crit: suspicious
  conf: 0.98
  all:
  - id: metadata/lang/source/naming/target::downloadurl-identifier-text
  - id: staged-zip-archive-name
  any:
  - id: contagious-temp-extract-dir
  - id: metadata/file/catalog/service::platform-service-name-reference
  - id: google-drive-direct-rewrite
  - id: micro-behaviors/communications/url/query/profile::platform-query-parameter
  needs: 2
- id: google-drive-archive-loader
  desc: Google Drive archive loader
  crit: hostile
  conf: 0.97
  all:
  - id: google-drive-direct-rewrite
  - id: staged-zip-archive-name
  any:
  - id: metadata/lang/source/naming/target::downloadurl-identifier-text
  - id: metadata/file/catalog/service::platform-service-name-reference
  - id: contagious-temp-extract-dir
