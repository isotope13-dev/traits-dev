defaults:
  platforms: [windows]
  for: [pe]
  attack: T1027.009
  mbc: B0032
composite_rules:
  - id: self-reading-data-zip-stager
    desc: Self-reading embedded ZIP payload stager
    crit: hostile
    conf: 0.97
    size_min: 200000
    size_max: 2000000
    all:
      - id: micro-behaviors/data/embedded/payload/archive::zip-locals-in-data-pe
      - id: metadata/binary/layout/overlay::overlay-size-256
      - id: micro-behaviors/fs/read/file/handle::pe-module-path-file-io-imports
    any:
      - id: metadata/binary/section/entropy::writable-data-section-entropy-over-7
      - id: micro-behaviors/dylib/lookup::module-export-resolution-imports
      - id: objectives/anti-analysis/debugger-detect/check::win-debugger-detect
      - id: micro-behaviors/os/exception/error-handling::exception-filter-pair-imports
    needs: 2
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/framework::dotnet-metadata
      - id: metadata/binary/installer/family/

  - id: vmp-appended-zip-payload-dropper
    desc: Unsigned VMProtect PE with appended ZIP payload
    crit: hostile
    conf: 0.98
    attack: T1027.002,T1027.009
    all:
      - id: metadata/signed/trust-level::unsigned-missing-signature-record
      - id: metadata/binary/layout/padding::noncertificate-unclaimed-bytes-512
      - id: objectives/anti-static/polyglot/format::appended-zip-trailer
    any:
      - id: metadata/binary/section/label::vmp-section-name
      - id: objectives/anti-static/pack/section-anomaly::large-rwx-vmp-encrypted-section
      - id: metadata/build/protector::vmprotect-section-reference
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/installer/family/


