defaults:
  crit: suspicious
  for:
    - pe
  platforms:
    - windows
  attack: T1105
traits:
  - id: hardcoded-http-zip-url
    desc: Hardcoded HTTP ZIP payload URL
    conf: 0.88
    if:
      type: text
      regex: (?i)^https?://[^\\s]{4,220}\\.zip$
  - id: branded-application-zip-url
    desc: Branded application ZIP delivery URL
    conf: 0.84
    if:
      type: text
      regex: (?i)^https?://.{0,180}(application|setup|update).{0,180}\\.zip$
  - id: remote-png-lure-url
    desc: Remote PNG lure or branding URL
    conf: 0.78
    if:
      type: text
      regex: (?i)^https?://[^\\s]{4,220}\\.png$
composite_rules:
  - id: upx-unsigned-winhttp-runtime-downloader
    desc: UPX-packed unsigned PE uses runtime-resolved WinHTTP download APIs
    crit: hostile
    conf: 0.96
    attack: T1027,T1105
    size_max: 5242880
    all:
      - id: metadata/binary/section/label::upx-section-pair
      - id: micro-behaviors/communications/http/client/winhttp::winhttp-runtime-text-download-flow
      - id: metadata/signed/trust-level::unsigned-missing-signature-record
    unless:
      - id: metadata/binary/installer/family/

  - id: winhttp-zip-temp-execute
    desc: WinHTTP ZIP downloader stages and executes payload
    conf: 0.97
    mbc: B0024
    size_max: 5242880
    unless:
      - id: metadata/binary/installer/family/
      - id: metadata/signed/platform/
      - id: well-known/lib/platform/wine/
    all:
      - id: micro-behaviors/communications/http/client/winhttp::winhttp-request-response-flow
      - id: micro-behaviors/fs/temp/directory::get-temp-path-name
      - id: micro-behaviors/fs/file/open::file-create-win
      - id: micro-behaviors/fs/write/file/handle::write-file
    any:
      - id: micro-behaviors/process/create/shellexec::shell-execute
      - id: micro-behaviors/process/create/shellexec::shell-execute-ex
      - id: micro-behaviors/fs/file/move::move-file-ex
      - id: micro-behaviors/fs/temp/directory::get-temp-file-name
      - id: hardcoded-http-zip-url
      - id: branded-application-zip-url
      - id: remote-png-lure-url
      - id: micro-behaviors/os/sysinfo/platform/locale::windows-locale-api-set
    needs: 2
    downgrade:
      any:
        - id: metadata/binary/symbols/count::many-imports

  # This profile combines a complete response read, file creation, special
  # folder lookup, and COM activation. It describes the behavior visible in
  # native loaders that hide the target CLSID and destination path at runtime.
  - id: winhttp-user-profile-com-stage
    desc: WinHTTP payload staged under a user profile with COM activation
    crit: hostile
    conf: 0.96
    mbc: B0024
    attack: T1105,T1053.005
    size_max: 5242880
    unless:
      - id: metadata/binary/installer/family/
      - id: metadata/signed/platform/
      - id: well-known/lib/platform/wine/
      - id: well-known/app/
    all:
      - id: micro-behaviors/communications/http/client/winhttp::winhttp-request-response-flow
      - id: micro-behaviors/fs/file/open::file-create-win
      - id: micro-behaviors/fs/write/file/handle::write-file
      - id: micro-behaviors/fs/shell-ops::shell-get-folder-path-a
      - id: micro-behaviors/os/com/invoke::co-create-instance
