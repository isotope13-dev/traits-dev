defaults:
  platforms: [windows, unix]
  for:
    - javascript
    - typescript
traits:
  - id: archive-password-option
    desc: Archive password option in extraction call
    crit: notable
    conf: 0.5
    unless:
      - id: well-known/lib/
      - id: metadata/build/bundler/asset::has-sourcemap
      - id: metadata/build/bundler/vscode::javascript-source-map-file
    if:
      type: tree-sitter
      kind: call
      regex: '(?is)\b(extract(Full|AllTo)|unzip)\b[^)]{0,240}\bpassword\s*:'
composite_rules:
  - id: passworded-archive-parameter
    desc: Password-protected archive extraction
    crit: suspicious
    conf: 0.65
    near_bytes: 4096
    all:
      - id: archive-password-option
      - id: micro-behaviors/data/archive/extract/capability::archive-extraction-context
    unless:
      - id: well-known/app/ai/coding-agent/opencode-swarm/
