defaults:
  platforms:
  - unix
  - windows
  for:
  - 7z
  - zip
  - iso
  - data
  - pe
  mbc: B0024
  crit: hostile
  conf: 0.94
composite_rules:
- id: archive-disk-image-executable-stage
  desc: Archive stages a disk image with an executable
  attack: T1027.002,T1553.005,T1204.002
  scope: outer
  all:
  - id: metadata/archive/layout::archive-disk-image-member
  any:
  - id: metadata/archive/member/extension::archive-windows-executable-entry
  - id: metadata/file/format/iso/structure::contains-executable-member
  - id: metadata/archive/layout::archive-contains-executable-member
  unless:
  - id: metadata/package/manager::go-module-source-archive
  - id: metadata/package/testing/
  - id: metadata/archive/layout::recognized-package-executable-context
  - id: well-known/app/productivity/winmerge::winmerge-full-source-archive-path
  - id: metadata/path::test-directory-component
  downgrade:
    scope: archive
    any:
    - id: metadata/lang/source/declaration::vhdl-design-unit-marker
- id: archive-fat-disk-image-stage
  desc: Archive ships a large disk-image member
  attack: T1027.002,T1204.002
  scope: outer
  all:
  - id: metadata/archive/layout::archive-disk-image-member
  - id: metadata/archive/member/size::member-at-least-10mb
  unless:
  - id: archive-disk-image-executable-stage
  - id: metadata/package/manager::go-module-source-archive
  - id: metadata/package/testing/
  - id: metadata/archive/layout::recognized-package-executable-context
  - id: well-known/app/productivity/winmerge::winmerge-full-source-archive-path
  - id: metadata/path::test-directory-component
  downgrade:
    scope: archive
    any:
    - id: metadata/lang/source/declaration::vhdl-design-unit-marker
- id: archive-order-image-unsigned-pe
  desc: Order disk image carries unsigned PE
  attack: T1027.002,T1553.005,T1036
  scope: outer
  all:
  - id: metadata/archive/member/filename::archive-order-disk-image-member
  - id: metadata/signed/trust-level::unsigned-missing-signature-record
