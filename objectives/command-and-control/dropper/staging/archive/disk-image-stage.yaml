defaults:
  platforms: [unix, windows]
  for: [7z, zip, iso, data, pe]
  mbc: B0024

composite_rules:
  # Encryption on the outer archive is optional: some campaigns rely on the
  # image wrapping the executable instead.
  - id: archive-disk-image-executable-stage
    desc: Archive stages a disk image with an executable
    crit: hostile
    conf: 0.94
    attack: T1027.002,T1553.005,T1204.002
    scope: outer
    all:
      - id: metadata/package/files/archive-member::archive-disk-image-member
    any:
      - id: metadata/build/archive::archive-windows-executable-entry
      - id: metadata/file/format/iso/structure::contains-executable-member
      - id: metadata/file/archive::archive-contains-executable-member
    unless:
      - id: metadata/package/manager::go-module-source-archive
      - id: metadata/package/testing/
      - id: metadata/file/archive::recognized-package-executable-context
      - id: well-known/app/productivity/winmerge::winmerge-full-source-archive-path

      - id: "metadata/file/naming::test-directory-component"
  - id: archive-order-image-unsigned-pe
    desc: Order disk image carries unsigned PE
    crit: hostile
    conf: 0.94
    attack: T1027.002,T1553.005,T1036
    scope: outer
    all:
      - id: metadata/package/files/archive-member::archive-order-disk-image-member
      - id: metadata/signed/trust-level::unsigned-missing-signature-record
