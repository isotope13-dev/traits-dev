defaults:
  platforms:
    - windows
  for:
    - pe
    - dll
traits:
  - id: temp-zip-name
    desc: Temporary ZIP filename
    crit: component
    conf: 0.8
    if:
      type: text
      exact: temp.zip
composite_rules:
  - id: com-textfile-dropper
    desc: COM text file staging behavior
    crit: suspicious
    conf: 0.88
    attack: T1105
    all:
      - id: micro-behaviors/os/com/object::filesystemobject-progid
      - id: micro-behaviors/fs/write/content::create-text-file-api
    unless:
      # NSIS stubs embed Scripting.FileSystemObject helpers for installer
      # bookkeeping; that is packaging, not COM payload staging.
      - id: metadata/binary/installer/script::nsis
  - id: com-zip-extraction
    desc: COM ZIP extraction behavior
    crit: suspicious
    conf: 0.9
    attack: T1105
    all:
      - id: micro-behaviors/os/com/object::shell-application-progid
      - id: micro-behaviors/os/com/object::shell-namespace-copyhere
    any:
      - id: temp-zip-name
      - id: micro-behaviors/data/archive/extension::zip-extension
  - id: powershell-com-archive-staging
    desc: PowerShell archive extraction via Shell COM
    crit: suspicious
    conf: 0.96
    attack: T1105
    for: [powershell]
    all:
      - id: micro-behaviors/communications/http/lib/invoke-webrequest::webclient-download
      - id: micro-behaviors/os/com/object::shell-namespace-copyhere
    near_lines: 12
  - id: powershell-encoded-file-launch
    desc: PowerShell writes and launches decoded payload
    crit: suspicious
    conf: 0.97
    attack: T1027,T1059.001
    for: [powershell]
    all:
      - id: micro-behaviors/data/decode/base64::powershell-frombase64string
      - id: micro-behaviors/fs/write/file/direct::write-all-bytes
      - id: micro-behaviors/process/create/start-process::saps-alias
    near_lines: 8
  - id: powershell-archive-encoded-payload-stage
    desc: PowerShell archive payload staging
    crit: hostile
    conf: 0.99
    attack: T1105,T1027,T1059.001
    for: [powershell]
    all:
      - id: powershell-com-archive-staging
      - id: powershell-encoded-file-launch
    near_lines: 80
  # WSH flavour of com-zip-extraction: obfuscated JScript/VBS string tables
  # reference 'Shell.Application', 'NameSpace' and 'CopyHere' as standalone
  # strings invoked through computed bracket access, defeating the
  # member-call syntax the COM traits match. Requiring the download legs
  # (XMLHTTP ProgID + archive URL) alongside the extraction legs keeps this
  # on the fetch-and-stage chain rather than any mention of Shell COM.
  - id: wsh-http-zip-shellcom-stage
    desc: WSH fetches a remote archive and stages Shell COM extraction
    crit: suspicious
    conf: 0.94
    attack: T1105
    for: [javascript, vbs]
    all:
      - id: micro-behaviors/communications/http/client/xmlhttp::js-xmlhttp-progid
      - id: micro-behaviors/communications/http/download/url::archive-url-reference-a
      - id: micro-behaviors/os/com/object::shell-application-progid
      - id: micro-behaviors/os/com/object::copyhere-method-token
