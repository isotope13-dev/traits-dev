# A loader that unpacks its payload from a cabinet through SETUPAPI.
#
# The 2021 `coa`/`rc` npm takeover shipped `sdd.dll` -- a 1.9 MB PE launched
# from a `preinstall` hook -- and it is a clean example of the shape. Its whole
# import table is kernel32 plus setupapi: no network, no process creation, no
# registry. The payload is unpacked with `SetupIterateCabinetW` and copied into
# place with the setupapi file queue, so the binary needs no decompressor and
# no shell, and its imports read as device-installation code. The APIs it
# actually uses are resolved with `GetProcAddress` at run time and executed out
# of memory it allocates and re-protects itself.
#
# A real driver installer does the cabinet half. What it does not do is hide
# its API set behind runtime resolution, stage its own executable pages, ship
# unsigned, and carry a build path assembled from unrelated dictionary words.
defaults:
  platforms: [windows]
  for: [pe, dll]
  attack: T1027.002
  mbc: B0023

composite_rules:
  - id: setupapi-cabinet-runtime-loader
    desc: Cabinet unpacker resolves APIs at runtime
    crit: suspicious
    conf: 0.9
    all:
      - id: micro-behaviors/data/archive/extract/cab::setupapi-cabinet-iterate
      - id: micro-behaviors/os/module/load::get-proc-address-import
      - id: micro-behaviors/mem/protect/modify::virtual-memory-allocation-protection-api-pair

  # Add the two provenance facts a genuine driver package cannot have: it is
  # unsigned, and its debug path names no project, configuration or version.
  - id: unsigned-randomised-cabinet-loader
    desc: Unsigned cabinet loader with random build path
    crit: hostile
    conf: 0.95
    all:
      - id: setupapi-cabinet-runtime-loader
      - id: metadata/binary/debug::pdb-unstructured-word-path
      - id: metadata/binary/layout::pe-no-signature-record
