# Sub-8KB unsigned PE that embeds a cleartext HTTP URL and ShellExecuteEx is
# a stager, not a helper: there is no room left for a real program.
#
# Size paired with a bare count (strings, imports) has no content-derived
# behavior and remains represented by its metadata atoms. A conviction needs
# the behavior legs below. A writable entry point in a tiny PE is covered by
# objectives/anti-static/pack/overlay::small-pe-writable-ep.
#
# Tiers: size or an opaque basename plus a fact every ordinary DLL or .NET
# assembly has (one export, mscorlib, the FNV prime C# emits for string
# switches) is notable. Plus one anomaly or one API is suspicious: plugins,
# no_std DLLs and small launchers share those shapes. Hostile is reserved for
# an attack sequence or concealment (download-then-execute, ROT13 paths,
# bitmap stego). The basename is chosen by whoever saved the file, so it
# never carries a conviction on its own.
defaults:
  platforms: [windows]
  for: [pe, dll]
  attack: T1105,T1059
  crit: hostile
  conf: 0.94

composite_rules:
  - id: tiny-pe-http-shellexec-stager
    desc: Tiny PE downloads then ShellExecuteEx
    all:
      - id: metadata/binary/layout/size::tiny-pe
      - id: micro-behaviors/communications/http/url/scheme::cleartext-http-url
      - id: micro-behaviors/process/create/system::shell-execute-ex-a
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/installer/family/
      - id: well-known/lib/

  - id: tiny-pe-http-url-stager
    desc: Tiny PE embeds a cleartext HTTP URL
    crit: suspicious
    all:
      - id: metadata/binary/layout/size::tiny-pe
      - id: micro-behaviors/communications/http/url/domain::http-url-binary
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/installer/family/
      - id: well-known/lib/
      - id: well-known/app/utility/watt-toolkit/
      - id: metadata/package/testing/

  - id: tiny-pe-winsock-http-stager
    desc: Tiny PE starts Winsock then fetches HTTP
    crit: suspicious
    all:
      - id: metadata/binary/layout/size::tiny-pe
      - id: micro-behaviors/communications/socket/init::winsock-startup-ordinal
      - id: micro-behaviors/communications/http/url/scheme::cleartext-http-url
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/installer/family/
      - id: well-known/lib/

  - id: tiny-pe-overlay-stub
    desc: Tiny PE is mostly overlay payload
    crit: suspicious
    all:
      - id: metadata/binary/layout/size::tiny-pe
      - id: metadata/binary/layout/overlay::overlay-over-30pct
      - id: metadata/binary/layout/overlay::noncertificate-overlay-512
    unless:
      - id: metadata/signed/platform/
      - id: well-known/lib/

  - id: tiny-pe-single-export
    desc: Tiny PE exposes a single export
    crit: notable
    all:
      - id: metadata/binary/layout/size::tiny-pe
      - id: metadata/binary/symbols/exports::single-export
    unless:
      - id: metadata/signed/platform/
      - id: well-known/lib/
      # Minimal fixture DLLs shipped under a package's own tests/ tree (the
      # libloading crate's nagisa32/64.dll load targets) are single-export by
      # design; the path proves the test tree, not a filename convention.
      - id: metadata/package/testing/presence/harness::test-directory-path
      - id: metadata/binary/installer/family::nsis-plugin-dir-member

  - id: tiny-pe-com-register
    desc: Tiny PE exports DllRegisterServer
    crit: notable
    all:
      - id: metadata/binary/layout/size::tiny-pe
      - id: metadata/binary/symbols/exports::export-dll-register-server
    unless:
      - id: metadata/signed/platform/
      - id: well-known/lib/

  - id: tiny-pe-no-imports
    desc: Tiny PE has no import table
    crit: suspicious
    all:
      - id: metadata/binary/layout/size::tiny-pe
      - id: metadata/binary/symbols/count::no-imports
    unless:
      - id: metadata/signed/platform/
      - id: well-known/lib/
      - id: well-known/tool/detection/security-scanner-identity::clamav-test-file-section
      # Importless fixture DLLs shipped under a package's own tests/ tree (the
      # libloading crate's nagisa32/64.dll load targets) have no imports by
      # design; the path proves the test tree, not a filename convention.
      - id: metadata/package/testing/presence/harness::test-directory-path
      - id: metadata/package/testing/presence/path::pe-adversarial-test-path
      - id: metadata/file/extension/typelib::winmd-basename
      # Resource-only DLLs have no executable code and no imports by construction.
      - id: metadata/binary/section/ratio::pe-no-executable-sections

  - id: tiny-pe-blank-section
    desc: Tiny PE uses a blank-named section
    # Suspicious, not hostile: size plus a section name is a shape pair with
    # no content leg (see file header), and hand-built test binaries such as
    # ordinal-import fixtures are blank-named by construction. A conviction
    # needs a behavior leg, which the sibling stager rules above carry.
    crit: suspicious
    all:
      - id: metadata/binary/layout/size::tiny-pe
      - id: metadata/binary/section/label::blank-named-section
    unless:
      - id: metadata/signed/platform/
      - id: well-known/lib/

  - id: tiny-pe-efi-header
    desc: Tiny PE claims an EFI subsystem
    crit: suspicious
    all:
      - id: metadata/binary/layout/size::tiny-pe
      - id: metadata/binary/header/malformed::efi-pe-subsystem
    unless:
      - id: metadata/signed/platform/
      - id: well-known/lib/
      - id: metadata/package/testing/

  - id: tiny-pe-create-process
    desc: Tiny PE creates a child process
    crit: suspicious
    all:
      - id: metadata/binary/layout/size::tiny-pe
      - id: micro-behaviors/process/create/spawn::create-process-a
    unless:
      - id: metadata/signed/platform/
      - id: well-known/lib/

  - id: tiny-pe-rot13-path
    desc: Tiny PE hides Windows paths with ROT13
    all:
      - id: metadata/binary/layout/size::tiny-pe
      - id: micro-behaviors/data/encode/rot13::rot13-windows-path-fragment
    unless:
      - id: metadata/signed/platform/
      - id: well-known/lib/

  - id: tiny-pe-drive-walker
    desc: Tiny PE walks directories via Win32 find APIs
    crit: suspicious
    all:
      - id: metadata/binary/layout/size::tiny-pe
      - id: micro-behaviors/fs/enumerate/directory::find-file-walker
    unless:
      - id: metadata/signed/platform/
      - id: well-known/lib/

  - id: tiny-pe-opaque-name
    desc: Tiny PE uses an opaque generated filename
    crit: notable
    all:
      - id: metadata/binary/layout/size::tiny-pe
      - id: metadata/file/naming::opaque-identifier-pe-basename
    unless:
      - id: metadata/signed/platform/
      - id: well-known/lib/

  - id: tiny-pe-low-strings
    desc: Tiny PE has almost no strings
    crit: notable
    all:
      - id: metadata/binary/layout/size::tiny-pe
      - id: metadata/binary/section/prose::strings-at-most-40
    unless:
      - id: metadata/signed/platform/
      - id: well-known/lib/
      - id: well-known/tool/detection/security-scanner-identity::clamav-test-file-section
      # Near-stringless fixture DLLs shipped under a package's own tests/ tree
      # (the libloading crate's nagisa32/64.dll load targets) are minimal by
      # design; the path proves the test tree, not a filename convention.
      - id: metadata/package/testing/presence/harness::test-directory-path
      - id: metadata/binary/installer/plugin::known-nsis-plugin-basename
      # Type-library artifacts (.winmd/.tlb metadata, the com0com setup stub),
      # one directory reference.
      - id: metadata/file/extension/typelib/
      # A minimal managed assembly is stringless by format, not by packing:
      # .NET literals live in the #US heap, so a hello-world test fixture
      # (e.g. GNU gettext's vendored csharpexec-test.exe) extracts almost
      # nothing. The neutral import-count metadata remains available beside
      # this string-count observation.
      - id: metadata/binary/framework::dotnet-metadata
      - id: metadata/binary/framework::dotnet-assembly
      - id: well-known/tool/packaging/inno-setup/

  - id: tiny-pe-quotation-lure
    desc: Tiny PE uses a quotation-document lure
    crit: suspicious
    all:
      - id: metadata/binary/layout/size::tiny-pe
      - id: objectives/evasion/masquerade/file/lure::quotation-exe-name
    unless:
      - id: metadata/signed/platform/
      - id: well-known/lib/

  - id: tiny-pe-virtual-alloc
    desc: Tiny PE allocates executable memory
    crit: suspicious
    all:
      - id: metadata/binary/layout/size::tiny-pe
      - id: micro-behaviors/mem/protect/modify::virtual-alloc-string
    unless:
      - id: metadata/signed/platform/
      - id: well-known/lib/

  - id: tiny-dotnet-opaque
    desc: Tiny .NET module uses an opaque filename
    crit: notable
    all:
      - id: metadata/binary/layout/size::tiny-dotnet
      - id: metadata/file/naming::opaque-identifier-pe-basename
    unless:
      - id: metadata/signed/platform/
      - id: well-known/lib/

  - id: opaque-mscorlib-stub
    desc: Opaque-named PE is a tiny mscorlib stub
    crit: notable
    all:
      - id: metadata/file/naming::opaque-identifier-pe-basename
      - id: metadata/lang/compiler/managed::mscorlib
    unless:
      - id: metadata/signed/platform/
      - id: well-known/lib/
      - id: metadata/lang/compiler/generated::dotnet-generated-xmlserializer

  - id: tiny-pe-minimal-shell
    desc: Tiny PE has a minimal ShellExecute import set
    crit: suspicious
    all:
      - id: metadata/binary/layout/size::tiny-pe
      - id: objectives/anti-static/obfuscation/payload/import::shell-exec-minimal-imports
    unless:
      - id: metadata/signed/platform/
      - id: well-known/lib/

  - id: opaque-single-import
    desc: Opaque-named PE has a single import
    crit: suspicious
    all:
      - id: metadata/file/naming::opaque-identifier-pe-basename
      - id: metadata/binary/symbols/imports::single-import-count
    unless:
      - id: metadata/signed/platform/
      - id: well-known/lib/
      - id: metadata/binary/framework::dotnet-metadata
      - id: metadata/binary/framework::dotnet-assembly

  - id: tiny-pe-winexec
    desc: Tiny PE launches a payload via WinExec
    crit: suspicious
    all:
      - id: metadata/binary/layout/size::tiny-pe
      - id: micro-behaviors/process/create/exec::winexec
    unless:
      - id: metadata/signed/platform/
      - id: well-known/lib/

  - id: tiny-pe-wsock32
    desc: Tiny PE talks over WSOCK32
    crit: suspicious
    all:
      - id: metadata/binary/layout/size::tiny-pe
      - id: micro-behaviors/communications/socket/init::wsock32-dll-marker
    unless:
      - id: metadata/signed/platform/
      - id: well-known/lib/

  - id: opaque-vb-runtime
    desc: Opaque-named PE is a VB.NET runtime stub
    crit: notable
    all:
      - id: metadata/file/naming::opaque-identifier-pe-basename
      - id: metadata/lang/compiler/managed::visual-basic-runtime
    unless:
      - id: metadata/signed/platform/
      - id: well-known/lib/
      - id: metadata/lang/compiler/generated::dotnet-generated-xmlserializer

  - id: opaque-suppress-ildasm
    desc: Opaque-named PE suppresses ILDASM
    crit: suspicious
    all:
      - id: metadata/file/naming::opaque-identifier-pe-basename
      - id: objectives/anti-static/obfuscation/anti-decompile::suppress-ildasm-managed-pe-string
    unless:
      - id: metadata/signed/platform/
      - id: well-known/lib/

  - id: opaque-appdomain-stub
    desc: Opaque-named PE reflects into the AppDomain
    crit: notable
    all:
      - id: metadata/file/naming::opaque-identifier-pe-basename
      - id: micro-behaviors/process/interpreter/reflection/runtime::appdomain-currentdomain
    unless:
      - id: metadata/signed/platform/

  - id: opaque-fnv-stub
    desc: Opaque-named PE embeds an FNV-1a prime
    crit: notable
    all:
      - id: metadata/file/naming::opaque-identifier-pe-basename
      - id: micro-behaviors/crypto/hash/fnv::fnv1a-prime-32bit-literal
    unless:
      - id: metadata/signed/platform/

  - id: opaque-assemblyresolve-stub
    desc: Opaque PE hooks AssemblyResolve
    crit: suspicious
    all:
      - id: metadata/file/naming::opaque-identifier-pe-basename
      - id: micro-behaviors/data/embedded/payload/resource::assemblyresolve-hook
    unless:
      - id: metadata/signed/platform/

  - id: opaque-rijndael-appdomain-stub
    desc: Opaque PE decrypts via AppDomain
    crit: suspicious
    all:
      - id: metadata/file/naming::opaque-identifier-pe-basename
      - id: micro-behaviors/crypto/symmetric/aes/library::dotnet-rijndael-decryptor
      - id: micro-behaviors/process/interpreter/reflection/runtime::appdomain-currentdomain
    unless:
      - id: metadata/signed/platform/

  - id: opaque-dotnet-b64-stub
    desc: Opaque PE Base64-decodes a payload
    crit: notable
    all:
      - id: metadata/file/naming::opaque-identifier-pe-basename
      - id: micro-behaviors/data/decode/base64::dotnet-frombase64string-text
    unless:
      - id: metadata/signed/platform/

  - id: opaque-dotnet-stego-stub
    desc: Opaque PE hides a bitmap-stego payload
    all:
      - id: metadata/file/naming::opaque-identifier-pe-basename
      - id: micro-behaviors/data/embedded/payload/image::dotnet-resource-bitmap-pixel-readback
      - id: metadata/build/manifest::pe-manifest-myapplication-template
    unless:
      - id: metadata/signed/platform/

  - id: opaque-appdomain-class-stub
    desc: Opaque PE names the AppDomain class
    crit: notable
    all:
      - id: metadata/file/naming::opaque-identifier-pe-basename
      - id: objectives/anti-static/obfuscation/reflection/invoke::appdomain-class-token
    unless:
      - id: metadata/signed/platform/

  - id: opaque-dotnet-resource-stub
    desc: Opaque PE hides a packed managed resource
    crit: suspicious
    all:
      - id: metadata/file/naming::opaque-identifier-pe-basename
      - id: metadata/binary/resource/size::dotnet-large-high-entropy-managed-resource
    unless:
      - id: metadata/signed/platform/
      - id: micro-behaviors/data/embedded/payload/resource::costura-bundle-marker

  - id: opaque-dotnet-decryptor-stub
    desc: Opaque PE constructs a .NET decryptor
    crit: suspicious
    all:
      - id: metadata/file/naming::opaque-identifier-pe-basename
      - id: micro-behaviors/crypto/symmetric/decrypt::dotnet-create-decryptor
    unless:
      - id: metadata/signed/platform/

  - id: opaque-dominant-overlay-stub
    desc: Opaque PE is almost entirely overlay
    crit: suspicious
    all:
      - id: metadata/file/naming::opaque-identifier-pe-basename
      - id: metadata/binary/layout/ratio::overlay-over-90pct
      - id: metadata/binary/layout/entropy::overall-entropy-78
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/installer/family/

  - id: opaque-version-mismatch-stub
    desc: Opaque PE version info does not match its name
    crit: notable
    all:
      - id: metadata/file/naming::opaque-identifier-pe-basename
      - id: metadata/binary/provenance/version-info::pe-non-architecture-filename-mismatch
    unless:
      - id: metadata/signed/platform/

  - id: opaque-virtual-alloc-stub
    desc: Opaque PE allocates virtual memory
    crit: notable
    all:
      - id: metadata/file/naming::opaque-identifier-pe-basename
      - id: micro-behaviors/mem/protect/modify::virtual-alloc
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/installer/family/

  - id: opaque-mixed-export-stub
    desc: Opaque PE exports mixed-case dummy names
    crit: suspicious
    all:
      - id: metadata/file/naming::opaque-identifier-pe-basename
      - id: objectives/anti-static/obfuscation/name-mangling/export-name::mixed-case-opaque-export-name
    unless:
      - id: metadata/signed/platform/

  - id: opaque-writable-ep-stub
    desc: Opaque PE enters in a writable executable section
    crit: suspicious
    all:
      - id: metadata/file/naming::opaque-identifier-pe-basename
      - id: metadata/binary/section/header::pe-entry-in-writable-section
      - id: metadata/hardening/memory::wx-section
    unless:
      - id: metadata/signed/platform/
