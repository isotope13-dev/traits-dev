defaults:
  platforms:
  - windows
  for:
  - pe
  - dll
  attack: T1105,T1059
  crit: hostile
  conf: 0.94
composite_rules:
- id: tiny-pe-http-shellexec-stager
  desc: Tiny PE downloads then ShellExecuteEx
  all:
  - id: metadata/binary/layout/size::tiny-pe
  - id: micro-behaviors/communications/http/url/scheme::http-url-shaped-text
  - id: micro-behaviors/process/create/shellexec::shell-execute-ex-a
  unless:
  - id: metadata/signed/platform/
  - id: metadata/binary/installer/family/
  - id: well-known/lib
- id: tiny-pe-winsock-http-stager
  desc: Tiny PE starts Winsock then fetches HTTP
  crit: suspicious
  all:
  - id: metadata/binary/layout/size::tiny-pe
  - id: micro-behaviors/communications/socket/init::winsock-startup-ordinal
  - id: micro-behaviors/communications/http/url/scheme::http-url-shaped-text
  unless:
  - id: metadata/signed/platform/
  - id: metadata/binary/installer/family/
  - id: well-known/lib
- id: tiny-pe-overlay-stub
  desc: Tiny PE carries a large non-certificate overlay
  crit: suspicious
  all:
  - id: metadata/binary/layout/size::tiny-pe
  - id: metadata/binary/layout/overlay::overlay-over-30pct
  - id: metadata/binary/layout/size::noncertificate-unclaimed-bytes-512
  unless:
  - id: metadata/signed/platform/
  - id: well-known/lib
  - id: metadata/path::test-directory-component
  - id: metadata/package/testing/presence/harness::binary-test-directory
  - id: metadata/package/testing/presence/path::pe-adversarial-test-path
  - id: metadata/binary/code/entropy::code-entropy-near-zero
- id: tiny-pe-com-register
  desc: Tiny PE exports DllRegisterServer
  crit: notable
  all:
  - id: metadata/binary/layout/size::tiny-pe
  - id: metadata/binary/symbols/exports::export-dll-register-server
  unless:
  - id: metadata/signed/platform/
  - id: well-known/lib
- id: tiny-pe-efi-header
  desc: Tiny PE claims an EFI subsystem
  crit: suspicious
  all:
  - id: metadata/binary/layout/size::tiny-pe
  - id: metadata/binary/header/characteristics::efi-pe-subsystem
  unless:
  - id: metadata/signed/platform/
  - id: well-known/lib
  - id: metadata/package/testing/
  - id: well-known/app
  - id: metadata/path::test-directory-component
- id: tiny-pe-copyfile-stager
  desc: Tiny PE copies files to spread
  crit: hostile
  conf: 0.93
  attack: T1105
  all:
  - id: metadata/binary/layout/size::tiny-pe
  - id: micro-behaviors/fs/file/copy::copyfile-a
  unless:
  - id: metadata/signed/platform/
  - id: well-known/lib
  - id: well-known/tool/packaging/nsis-nsexec::nsis-nsexec-plugin
  - id: metadata/binary/code/control-transfer::pe-text-immediate-return
- id: tiny-pe-rot13-path
  desc: Tiny PE hides Windows paths with ROT13
  all:
  - id: metadata/binary/layout/size::tiny-pe
  - id: micro-behaviors/data/encode/rot13::rot13-windows-path-fragment
  unless:
  - id: metadata/signed/platform/
  - id: well-known/lib
# Size plus directory enumeration does not establish a dropper. NSIS's small
# StartMenu plugins have exactly these imports. The canonical size and Win32
# enumeration findings remain metadata/binary/layout/size::tiny-pe and
# micro-behaviors/fs/directory/readdir::find-file-walker.
- id: tiny-pe-opaque-name
  desc: Tiny PE uses an opaque generated filename
  crit: notable
  all:
  - id: metadata/binary/layout/size::tiny-pe
  - id: metadata/filename/name-form::opaque-identifier-pe-basename
  unless:
  - id: metadata/signed/platform/
  - id: well-known/lib
- id: tiny-pe-quotation-lure
  desc: Tiny PE uses a quotation-document lure
  crit: suspicious
  all:
  - id: metadata/binary/layout/size::tiny-pe
  - id: metadata/filename/name-form::quotation-exe-name
  unless:
  - id: metadata/signed/platform/
  - id: well-known/lib
- id: tiny-pe-virtual-alloc
  desc: Tiny PE allocates executable memory
  crit: suspicious
  all:
  - id: metadata/binary/layout/size::tiny-pe
  - id: micro-behaviors/mem/alloc/virtual::virtual-alloc-string
  unless:
  - id: metadata/signed/platform/
  - id: well-known/lib
  - id: metadata/path::test-directory-component
  - id: metadata/package/testing/presence/harness::binary-test-directory
  - id: metadata/package/testing/presence/path::pe-adversarial-test-path
- id: tiny-dotnet-opaque
  desc: Tiny .NET module uses an opaque filename
  crit: notable
  all:
  - id: metadata/binary/layout/size::tiny-dotnet
  - id: metadata/filename/name-form::opaque-identifier-pe-basename
  unless:
  - id: metadata/signed/platform/
  - id: well-known/lib
- id: tiny-pe-minimal-shell
  desc: Tiny PE has a minimal ShellExecute import set
  crit: suspicious
  all:
  - id: metadata/binary/layout/size::tiny-pe
  - id: metadata/binary/symbols/imports::pe-sparse-execution-api-profile
  unless:
  - id: metadata/signed/platform/
  - id: well-known/lib
  - id: well-known/tool/development/build/buck::dotslash-windows-shim
- id: opaque-single-import
  desc: Opaque-named PE has a single import
  crit: suspicious
  all:
  - id: metadata/filename/name-form::opaque-identifier-pe-basename
  - id: metadata/binary/symbols/imports::single-import-count
  unless:
  - id: metadata/signed/platform/
  - id: well-known/lib
  - id: metadata/binary/framework::dotnet-metadata
  - id: metadata/binary/framework::dotnet-assembly
- id: tiny-pe-wsock32
  desc: Tiny PE talks over WSOCK32
  crit: suspicious
  all:
  - id: metadata/binary/layout/size::tiny-pe
  - id: micro-behaviors/communications/socket/init::wsock32-dll-marker
  unless:
  - id: metadata/signed/platform/
  - id: well-known/lib
- id: opaque-dotnet-b64-stub
  desc: Opaque PE Base64-decodes a payload
  crit: notable
  all:
  - id: metadata/filename/name-form::opaque-identifier-pe-basename
  - id: micro-behaviors/data/decode/base64::dotnet-frombase64string-text
  unless:
  - id: metadata/signed/platform/
- id: opaque-dotnet-stego-stub
  desc: Opaque PE hides a bitmap-stego payload
  all:
  - id: metadata/filename/name-form::opaque-identifier-pe-basename
  - id: micro-behaviors/ui/graphics/image::dotnet-bitmap-resource-pixel-api-references
  - id: metadata/build/manifest::pe-manifest-myapplication-template
  unless:
  - id: metadata/signed/platform/
- id: opaque-dotnet-reflective-resource-stub
  desc: Opaque .NET PE stages high-entropy embedded resources via reflection
  crit: hostile
  conf: 0.96
  attack: T1027.009,T1620
  all:
  - id: metadata/filename/name-form::opaque-identifier-pe-basename
  - id: metadata/binary/resource/entropy::clr-resource-size-and-entropy
  - id: micro-behaviors/data/embedded/payload/resource::dotnet-managed-resource-access
  - id: micro-behaviors/metaprogramming/reflection::invoke-member-token
  - id: metadata/signed/trust-level::unsigned-missing-signature-record
  - id: metadata/binary/provenance/version-info::pe-basename-differs-from-original-filename
  unless:
  - id: metadata/signed/platform/
  - id: micro-behaviors/data/embedded/payload/resource::costura-bundle-marker
  - id: objectives/evasion/masquerade/binary/loader::dotnet-template-resource-application-context
  - id: well-known/tool/detection/security-scanner::eicar-test-string-reference
- id: opaque-dominant-overlay-stub
  desc: Opaque PE is almost entirely overlay
  crit: suspicious
  all:
  - id: metadata/filename/name-form::opaque-identifier-pe-basename
  - id: metadata/binary/layout/ratio::overlay-over-90pct
  - id: metadata/file/entropy::overall-entropy-78
  unless:
  - id: metadata/signed/platform/
  - id: metadata/binary/installer/family/
- id: opaque-virtual-alloc-stub
  desc: Opaque PE allocates virtual memory
  crit: notable
  all:
  - id: metadata/filename/name-form::opaque-identifier-pe-basename
  - id: micro-behaviors/mem/alloc/virtual::virtual-alloc
  unless:
  - id: metadata/signed/platform/
  - id: metadata/binary/installer/family/
- id: opaque-mixed-export-stub
  desc: Opaque PE exports mixed-case dummy names
  crit: suspicious
  all:
  - id: metadata/filename/name-form::opaque-identifier-pe-basename
  - id: metadata/binary/symbols/export-name-pattern::short-mixed-case-export-name
  unless:
  - id: metadata/signed/platform/
- id: opaque-writable-ep-stub
  desc: Opaque PE enters in a writable executable section
  crit: suspicious
  all:
  - id: metadata/filename/name-form::opaque-identifier-pe-basename
  - id: metadata/binary/section/header::pe-entry-in-writable-section
  - id: metadata/binary/section/permission::wx-section
  unless:
  - id: metadata/signed/platform/
  # A standard UPX decompressor starts in a writable packed section; the
  # filename and section permissions alone do not establish a dropper.
  - id: well-known/dual-use/packaging/upx::upx-entry-stub-packer-context
