# Sub-8KB unsigned PE that embeds a cleartext HTTP URL and ShellExecuteEx is
# a stager, not a helper: there is no room left for a real program.
defaults:
  platforms: [windows]
  for: [pe, dll]
  attack: T1105,T1059
  crit: hostile
  conf: 0.94

composite_rules:
  - id: tiny-pe-http-shellexec-stager
    desc: Tiny PE downloads then ShellExecuteEx
    all:
      - id: metadata/binary/layout/size::tiny-pe
      - id: micro-behaviors/communications/http/url/scheme::cleartext-http-url
      - id: micro-behaviors/process/create/system::shell-execute-ex-a
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/installer/family/
      - id: well-known/lib/

  - id: tiny-pe-http-url-stager
    desc: Tiny PE embeds a cleartext HTTP URL
    all:
      - id: metadata/binary/layout/size::tiny-pe
      - id: micro-behaviors/communications/http/url/domain::http-url-binary
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/installer/family/
      - id: well-known/lib/

  - id: tiny-pe-winsock-http-stager
    desc: Tiny PE starts Winsock then fetches HTTP
    all:
      - id: metadata/binary/layout/size::tiny-pe
      - id: micro-behaviors/communications/socket/init::winsock-startup-ordinal
      - id: micro-behaviors/communications/http/url/scheme::cleartext-http-url
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/installer/family/
      - id: well-known/lib/

  - id: tiny-pe-writable-ep
    desc: Tiny PE entry point is in a writable section
    all:
      - id: metadata/binary/layout/size::tiny-pe
      - id: metadata/binary/section/header::pe-entry-in-writable-section
    unless:
      - id: metadata/signed/platform/
      - id: well-known/lib/

  - id: tiny-pe-overlay-stub
    desc: Tiny PE is mostly overlay payload
    all:
      - id: metadata/binary/layout/size::tiny-pe
      - id: metadata/binary/layout/overlay::overlay-over-30pct
    unless:
      - id: metadata/signed/platform/
      - id: well-known/lib/

  - id: tiny-pe-single-export
    desc: Tiny PE exposes a single export
    all:
      - id: metadata/binary/layout/size::tiny-pe
      - id: metadata/binary/symbols/exports::single-export
    unless:
      - id: metadata/signed/platform/
      - id: well-known/lib/

  - id: tiny-pe-com-register
    desc: Tiny PE exports DllRegisterServer
    all:
      - id: metadata/binary/layout/size::tiny-pe
      - id: metadata/binary/symbols/exports::export-dll-register-server
    unless:
      - id: metadata/signed/platform/
      - id: well-known/lib/

  - id: tiny-pe-no-imports
    desc: Tiny PE has no import table
    all:
      - id: metadata/binary/layout/size::tiny-pe
      - id: metadata/binary/symbols/count::no-imports
    unless:
      - id: metadata/signed/platform/
      - id: well-known/lib/

  - id: tiny-pe-blank-section
    desc: Tiny PE uses a blank-named section
    all:
      - id: metadata/binary/layout/size::tiny-pe
      - id: metadata/binary/section/label::blank-named-section
    unless:
      - id: metadata/signed/platform/
      - id: well-known/lib/

  - id: tiny-pe-efi-header
    desc: Tiny PE claims an EFI subsystem
    all:
      - id: metadata/binary/layout/size::tiny-pe
      - id: metadata/binary/header/malformed::efi-pe-subsystem
    unless:
      - id: metadata/signed/platform/
      - id: well-known/lib/

  - id: tiny-pe-create-process
    desc: Tiny PE creates a child process
    all:
      - id: metadata/binary/layout/size::tiny-pe
      - id: micro-behaviors/process/create/spawn::create-process-a
    unless:
      - id: metadata/signed/platform/
      - id: well-known/lib/

  - id: tiny-pe-rot13-path
    desc: Tiny PE hides Windows paths with ROT13
    all:
      - id: metadata/binary/layout/size::tiny-pe
      - id: micro-behaviors/data/encode/rot13::rot13-windows-path-fragment
    unless:
      - id: metadata/signed/platform/
      - id: well-known/lib/

  - id: tiny-pe-drive-walker
    desc: Tiny PE walks drives then creates a process
    all:
      - id: metadata/binary/layout/size::tiny-pe
      - id: micro-behaviors/fs/enumerate/directory::find-file-walker
    unless:
      - id: metadata/signed/platform/
      - id: well-known/lib/

  - id: tiny-pe-opaque-name
    desc: Tiny PE uses an opaque generated filename
    all:
      - id: metadata/binary/layout/size::tiny-pe
      - id: metadata/file/naming::opaque-identifier-pe-basename
    unless:
      - id: metadata/signed/platform/
      - id: well-known/lib/

  - id: tiny-pe-sparse-imports
    desc: Tiny PE has under ten imports
    all:
      - id: metadata/binary/layout/size::tiny-pe
      - id: objectives/anti-static/pack/runtime::pe-import-count-under-10
    unless:
      - id: metadata/signed/platform/
      - id: well-known/lib/

  - id: tiny-pe-low-strings
    desc: Tiny PE has almost no strings
    all:
      - id: metadata/binary/layout/size::tiny-pe
      - id: objectives/anti-static/obfuscation/payload/string-sparse::low-string-count-vb6
    unless:
      - id: metadata/signed/platform/
      - id: well-known/lib/

  - id: tiny-pe-quotation-lure
    desc: Tiny PE uses a quotation-document lure
    all:
      - id: metadata/binary/layout/size::tiny-pe
      - id: objectives/evasion/masquerade/file/lure::quotation-exe-name
    unless:
      - id: metadata/signed/platform/
      - id: well-known/lib/

  - id: tiny-pe-virtual-alloc
    desc: Tiny PE allocates executable memory
    all:
      - id: metadata/binary/layout/size::tiny-pe
      - id: micro-behaviors/mem/protect/modify::virtual-alloc-string
    unless:
      - id: metadata/signed/platform/
      - id: well-known/lib/

  - id: tiny-pe-single-import
    desc: Tiny PE has a single import
    all:
      - id: metadata/binary/layout/size::tiny-pe
      - id: metadata/binary/symbols/imports::single-import-count
    unless:
      - id: metadata/signed/platform/
      - id: well-known/lib/

  - id: tiny-dotnet-opaque
    desc: Tiny .NET module uses an opaque filename
    all:
      - id: metadata/binary/layout/size::tiny-dotnet
      - id: metadata/file/naming::opaque-identifier-pe-basename
    unless:
      - id: metadata/signed/platform/
      - id: well-known/lib/

  - id: opaque-mscorlib-stub
    desc: Opaque-named PE is a tiny mscorlib stub
    all:
      - id: metadata/file/naming::opaque-identifier-pe-basename
      - id: metadata/lang/compiler/managed::mscorlib
    unless:
      - id: metadata/signed/platform/
      - id: well-known/lib/
      - id: metadata/lang/compiler/generated::dotnet-generated-xmlserializer

  - id: tiny-pe-minimal-shell
    desc: Tiny PE has a minimal ShellExecute import set
    all:
      - id: metadata/binary/layout/size::tiny-pe
      - id: objectives/anti-static/obfuscation/payload/import::shell-exec-minimal-imports
    unless:
      - id: metadata/signed/platform/
      - id: well-known/lib/

  - id: opaque-single-import
    desc: Opaque-named PE has a single import
    all:
      - id: metadata/file/naming::opaque-identifier-pe-basename
      - id: metadata/binary/symbols/imports::single-import-count
    unless:
      - id: metadata/signed/platform/
      - id: well-known/lib/

  - id: tiny-pe-winexec
    desc: Tiny PE launches a payload via WinExec
    all:
      - id: metadata/binary/layout/size::tiny-pe
      - id: micro-behaviors/process/create/exec::winexec
    unless:
      - id: metadata/signed/platform/
      - id: well-known/lib/

  - id: tiny-pe-wsock32
    desc: Tiny PE talks over WSOCK32
    all:
      - id: metadata/binary/layout/size::tiny-pe
      - id: micro-behaviors/communications/socket/init::wsock32-dll-marker
    unless:
      - id: metadata/signed/platform/
      - id: well-known/lib/

  - id: opaque-vb-runtime
    desc: Opaque-named PE is a VB.NET runtime stub
    all:
      - id: metadata/file/naming::opaque-identifier-pe-basename
      - id: metadata/lang/compiler/managed::visual-basic-runtime
    unless:
      - id: metadata/signed/platform/
      - id: well-known/lib/
      - id: metadata/lang/compiler/generated::dotnet-generated-xmlserializer

  - id: opaque-suppress-ildasm
    desc: Opaque-named PE suppresses ILDASM
    all:
      - id: metadata/file/naming::opaque-identifier-pe-basename
      - id: objectives/anti-static/obfuscation/anti-decompile::suppress-ildasm-managed-pe-string
    unless:
      - id: metadata/signed/platform/
      - id: well-known/lib/

  - id: opaque-appdomain-stub
    desc: Opaque-named PE reflects into the AppDomain
    all:
      - id: metadata/file/naming::opaque-identifier-pe-basename
      - id: micro-behaviors/process/interpreter/reflection/runtime::appdomain-currentdomain
    unless:
      - id: metadata/signed/platform/

  - id: opaque-fnv-stub
    desc: Opaque-named PE embeds an FNV-1a prime
    all:
      - id: metadata/file/naming::opaque-identifier-pe-basename
      - id: micro-behaviors/crypto/hash/fnv::fnv1a-prime-32bit-literal
    unless:
      - id: metadata/signed/platform/

  - id: opaque-assemblyresolve-stub
    desc: Opaque PE hooks AssemblyResolve
    all:
      - id: metadata/file/naming::opaque-identifier-pe-basename
      - id: micro-behaviors/data/embedded/payload/resource::assemblyresolve-hook
    unless:
      - id: metadata/signed/platform/

  - id: opaque-rijndael-appdomain-stub
    desc: Opaque PE decrypts via AppDomain
    all:
      - id: metadata/file/naming::opaque-identifier-pe-basename
      - id: micro-behaviors/crypto/symmetric/aes/library::dotnet-rijndael-decryptor
      - id: micro-behaviors/process/interpreter/reflection/runtime::appdomain-currentdomain
    unless:
      - id: metadata/signed/platform/

  - id: opaque-dotnet-b64-stub
    desc: Opaque PE Base64-decodes a payload
    all:
      - id: metadata/file/naming::opaque-identifier-pe-basename
      - id: micro-behaviors/data/decode/base64::dotnet-frombase64string-text
    unless:
      - id: metadata/signed/platform/

  - id: opaque-dotnet-stego-stub
    desc: Opaque PE hides a bitmap-stego payload
    all:
      - id: metadata/file/naming::opaque-identifier-pe-basename
      - id: micro-behaviors/data/embedded/payload/image::dotnet-resource-bitmap-pixel-readback
      - id: metadata/build/manifest::pe-manifest-myapplication-template
    unless:
      - id: metadata/signed/platform/
