# A native loader that finds exports inside an opaque resource module,
# validates MZ and PE header constants in its own code, names the CLR host
# library and the URL moniker library, and carries a cipher-entropy resource
# section stages a hidden module and can fetch more. Installers do not look
# up exports in their own encrypted resources.
defaults:
  platforms: [windows]
  for: [pe]
  attack: T1204.002,T1620,T1105
composite_rules:
  - id: opaque-module-lookup-loader-with-clr-and-urlmon
    desc: Opaque module loader with CLR host and urlmon
    crit: hostile
    conf: 0.82
    all:
      - id: micro-behaviors/data/embedded/payload/resource::opaque-resource-module-export-lookup
      - id: micro-behaviors/data/format/pe-parser::pe-header-compare-immediate-multiple
      - id: micro-behaviors/data/format/pe-parser::inline-mz-magic-check
      - id: micro-behaviors/dylib/library/family::mscoree-dll-name
      - id: micro-behaviors/communications/http/client/urlmon::urlmon-dll-reference
      - id: metadata/binary/resource/entropy::large-high-entropy-rsrc-section
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/installer/family/
