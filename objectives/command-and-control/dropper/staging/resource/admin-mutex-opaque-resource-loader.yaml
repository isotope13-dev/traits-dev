# An installer-style program that demands administrator rights, takes a
# single-instance mutex, carries a multi-megabyte cipher-entropy resource,
# stages files under the temp directory and starts a process is a loader for
# that resource. Real installers carry readable archives, not random data.
defaults:
  platforms: [windows]
  for: [pe]
  attack: T1204.002,T1027.009,T1106
composite_rules:
  - id: admin-mutex-loader-for-opaque-resource
    desc: Admin loader with mutex and opaque resource payload
    crit: hostile
    conf: 0.82
    all:
      - id: metadata/build/manifest::require-administrator-large-pe-raw
      - id: metadata/binary/resource/entropy::dominant-high-entropy-resources
      - id: micro-behaviors/data/embedded/payload/resource::pe-resource-full-extraction
      - id: micro-behaviors/process/sync/mutex::create-mutex
      - id: micro-behaviors/fs/temp/file::temp-path-file-api-primitives
      - id: micro-behaviors/process/create/spawn::create-process-w
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/installer/family/
