# A 64-bit program that enumerates its own resource types and names, stages
# a file under the temp directory, walks PE headers in code and starts the
# staged file with ShellExecuteEx, deleting leftovers afterward, is a
# self-extracting dropper. Enumerating (rather than naming) the resource
# keeps the payload's resource ID out of the file.
defaults:
  platforms: [windows]
  for: [pe]
  attack: T1204.002,T1027.009,T1070.004
composite_rules:
  - id: resource-enumerating-temp-stager-with-pe-walk
    desc: Resource-enumerating temp stager with PE walk
    crit: hostile
    conf: 0.8
    all:
      - id: micro-behaviors/os/module/resource::enum-resource-types
      - id: micro-behaviors/os/module/resource::enum-resource-names
      - id: micro-behaviors/fs/temp/directory::temp-file-staging-primitives
      - id: micro-behaviors/process/create/shellexec::shell-execute-ex
      - id: micro-behaviors/data/format/pe-parser::pe-header-walk-x64
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/installer/family/
