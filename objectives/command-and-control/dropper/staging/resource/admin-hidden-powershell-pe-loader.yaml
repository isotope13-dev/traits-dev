# A loader that asks for administrator rights, fetches data over WinHTTP,
# decrypts it with BCrypt, keeps several PE images in its resources and
# starts hidden PowerShell. Fetch, decrypt, unpack and run is the staging
# chain of a downloader; the embedded images are what it stages.
defaults:
  platforms: [windows]
  for: [pe]
  attack: T1027.009,T1105,T1059.001
composite_rules:
  - id: admin-resource-pe-winhttp-bcrypt-hidden-powershell
    desc: Admin loader with resource PEs, WinHTTP, BCrypt, PowerShell
    crit: hostile
    conf: 0.88
    all:
      - id: micro-behaviors/data/embedded/payload/resource::pe-magic-in-rsrc-multiple
      - id: micro-behaviors/communications/http/client/winhttp::winhttp-request-flow
      - id: micro-behaviors/crypto/library/cryptoapi::bcrypt-decrypt-api
      - id: micro-behaviors/process/create/hidden::powershell-windowstyle-hidden
      - id: micro-behaviors/os/privilege/manifest::require-administrator
    unless:
      - id: metadata/signed/platform/
      - id: metadata/package/testing/
