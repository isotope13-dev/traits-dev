# A program whose resource section dwarfs its code, is mostly low-entropy
# filler, and which imports RtlDecompressBuffer under custom section names
# unpacks a payload from that resource with the native NT decompressor
# instead of a zlib or LZ library. Legitimate installers name their sections
# normally and ship real resources.
defaults:
  platforms: [windows]
  for: [pe]
  attack: T1027.002,T1140
composite_rules:
  - id: giant-rsrc-native-decompress-stub
    desc: Giant resource section with native decompression
    crit: suspicious
    conf: 0.75
    all:
      - id: metadata/binary/resource/size::giant-rsrc
      - id: metadata/binary/resource/size::oversized-low-entropy-rsrc
      - id: micro-behaviors/data/codec::rtl-decompress-buffer
      - id: metadata/binary/section/label::multiple-nonstandard-section-names
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/installer/family/
