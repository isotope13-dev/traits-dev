# A 64-bit program that enumerates its own resource types and names, stages
# a file under the temp directory, reads resource contents, writes data, and
# starts the staged file with ShellExecuteEx, is a self-extracting dropper.
# Enumerating names (rather than naming the resource) keeps the payload's
# resource ID out of the file.
defaults:
  platforms: [windows]
  for: [pe]
  attack: T1204.002,T1027.009,T1070.004
composite_rules:
  - id: resource-enumerating-temp-stager
    desc: Resource-enumerating temp stager with payload file write
    crit: hostile
    conf: 0.8
    all:
      - id: micro-behaviors/os/module/resource::enum-resource-names
      - id: micro-behaviors/fs/temp/directory::temp-file-staging-primitives
      - id: micro-behaviors/process/create/shellexec::shell-execute-ex
      - id: micro-behaviors/data/embedded/payload/resource::find-resource-any
      - id: micro-behaviors/data/embedded/payload/resource::load-resource
      - id: micro-behaviors/data/embedded/payload/resource::sizeof-resource
      - id: micro-behaviors/fs/write/file/handle::write-file
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/installer/family/
