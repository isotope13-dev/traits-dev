# The required AES resource-stage profile is supported; Pastebin/download or
# hidden-process clues do not show that this stage reaches an activation sink.
defaults:
  platforms: [windows]
  for: [pe, dll]

composite_rules:
  - id: dotnet-aes-resource-paste-profile
    desc: .NET AES resource stage with Pastebin and DownloadString clues
    crit: suspicious
    conf: 0.99
    all:
      - id: micro-behaviors/data/embedded/payload/resource::opaque-resource-crypto-write-api-surface
      - id: micro-behaviors/communications/http/services/file-hosting::pastebin
      - id: micro-behaviors/communications/http/client/managed::downloadstring
    unless:
      - id: objectives/command-and-control/backdoor/control/desktop::dotnet-rat-controller-attack-suite

  - id: dotnet-aes-resource-hidden-process-profile
    desc: .NET AES resource stage and hidden redirected-process clues
    crit: suspicious
    conf: 0.98
    all:
      - id: micro-behaviors/data/embedded/payload/resource::opaque-resource-crypto-write-api-surface
      - id: micro-behaviors/process/create/hidden::dotnet-create-no-window
      - id: micro-behaviors/process/create/spawn::dotnet-redirected-stdio
      - id: micro-behaviors/process/terminate/kill::dotnet-kill-member-reference

  # The paste profile above stops at the download and decrypt clues. These two
  # add the sinks: reflective entry-point invoke, and a hidden-window launch.
  - id: dotnet-aes-paste-entrypoint-loader
    desc: Pastebin AES stage invokes assembly entry
    crit: hostile
    conf: 0.98
    attack: T1105,T1140,T1620
    all:
      - id: dotnet-aes-resource-paste-profile
      - id: micro-behaviors/metaprogramming/reflection::dotnet-entrypoint-reflection
    unless:
      - id: objectives/command-and-control/backdoor/control/desktop::dotnet-rat-controller-attack-suite

  - id: dotnet-aes-paste-hidden-launch
    desc: Pastebin AES stage hides process window
    crit: hostile
    conf: 0.97
    attack: T1105,T1059
    all:
      - id: dotnet-aes-resource-paste-profile
      - id: micro-behaviors/process/create/start-process::dotnet-hidden-process-launch
    unless:
      - id: objectives/command-and-control/backdoor/control/desktop::dotnet-rat-controller-attack-suite
