defaults:
  platforms: [windows]
  for: [pe]
  attack: T1543.003,T1105,T1027.009
composite_rules:
  - id: resource-multi-pe-drive-scan-with-url-download
    desc: Resource-wrapper infector with drive and download APIs
    crit: hostile
    conf: 0.8
    all:
      # Embedded installers and USB utilities can carry every API below.
      # The linked host-wrapper overwrite supplies independent abuse evidence.
      - id: objectives/impact/infect/resource::resource-host-wrapper-overwrite
      - id: metadata/binary/resource/identity::dos-header-prefix-in-large-resource
      - id: micro-behaviors/fs/traversal/drives::logical-drive-type-enumeration
      - id: micro-behaviors/communications/http/client/urlmon::url-download-to-file-str
      - id: micro-behaviors/process/terminate/kill::terminate-process
    unless:
      - id: metadata/signed/platform/
