defaults:
  platforms: [windows]
  for: [pe]
traits:
  - id: wnet-add-connection-2-w-import
    desc: WNetAddConnection2W import
    crit: notable
    size_min: 1000000
    size_max: 1200000
    if:
      type: import
      exact: WNetAddConnection2W
  - id: net-share-get-info-import
    desc: NetShareGetInfo import
    crit: notable
    size_min: 1000000
    size_max: 1200000
    if:
      type: import
      exact: NetShareGetInfo
  - id: offeradw-ui-token
    desc: OfferAdw installer UI token
    crit: notable
    conf: 0.96
    size_min: 300000
    size_max: 900000
    if:
      type: text
      exact: OfferAdw
composite_rules:
  - id: vm-aware-resource-service-loader
    desc: VM-aware resource loader with service control and child launch
    crit: hostile
    conf: 0.96
    attack: T1027.009,T1543.003,T1106,T1497.001
    all:
      - id: metadata/binary/layout/checksum::cert-table-truncated
      - id: micro-behaviors/data/embedded/payload/resource::pe-resource-full-extraction
      - id: micro-behaviors/os/service/configure::service-reconfiguration-control-api-set
      - id: micro-behaviors/os/virtualization/detect::vmware-version-port-query
      - id: micro-behaviors/process/create/spawn::create-process-w
      - id: metadata/binary/resource/entropy::large-high-entropy-rsrc-section
    any:
      - id: micro-behaviors/process/debug/detect::is-debugger-present-import
      - id: micro-behaviors/os/privilege/token::debug-privilege-process-access
    unless:
      - id: metadata/signed/platform/
  - id: unsigned-office-vm-aware-resource-service-loader
    desc: Unsigned Word-masquerading VM-aware resource and service loader
    crit: hostile
    conf: 0.98
    attack: T1036.005,T1027.009,T1543.003,T1497.001
    all:
      - id: metadata/signed/trust-level::unsigned-missing-signature-record
      - id: objectives/evasion/masquerade/version-resource/office-suite::microsoft-office-word-string
      - id: objectives/evasion/masquerade/version-resource/office-suite::winword-internal-name-string
      - id: micro-behaviors/data/embedded/payload/resource::pe-resource-full-extraction
      - id: micro-behaviors/os/service/configure::service-reconfiguration-control-api-set
      - id: micro-behaviors/os/virtualization/detect::vmware-version-port-query
      - id: micro-behaviors/process/create/spawn::create-process-w
      - id: metadata/binary/resource/entropy::large-high-entropy-rsrc-section
    any:
      - id: micro-behaviors/process/debug/detect::is-debugger-present-import
      - id: micro-behaviors/os/privilege/token::debug-privilege-process-access
    unless:
      - id: metadata/signed/platform/
  - id: resource-temp-import-cluster
    desc: Resource temp loader imports
    crit: suspicious
    conf: 0.98
    size_min: 500000
    size_max: 700000
    all:
      - id: micro-behaviors/data/embedded/payload/resource::find-resource-w
      - id: micro-behaviors/data/embedded/payload/resource::load-resource
      - id: micro-behaviors/os/sysinfo/directories::win32-temp-path-import
    any:
      - id: micro-behaviors/process/create/spawn::create-process-w
      - id: micro-behaviors/fs/temp/file::get-temp-file-name
      - id: micro-behaviors/data/embedded/payload/resource::find-resource-ex-w
      - id: micro-behaviors/fs/file/move::move-file-ex
    needs: 2
    unless:
      - id: metadata/binary/symbols/count::many-imports-100
      - id: well-known/lib/platform/wine/
  - id: share-temp-exec-import-cluster
    desc: Network share execution imports
    crit: suspicious
    conf: 0.98
    size_min: 1000000
    size_max: 1200000
    all:
      - id: micro-behaviors/process/create/shellexec::shell-execute-a
      - id: wnet-add-connection-2-w-import
      - id: net-share-get-info-import
    any:
      - id: micro-behaviors/os/registry/write::reg-set-value-ex-w
      - id: micro-behaviors/process/debug/detect::local-and-remote-debugger-api-references
      - id: micro-behaviors/communications/http/dynamic::internet-connect-a-import
      - id: micro-behaviors/communications/http/dynamic::internet-open-a-import
    needs: 2
    unless:
      - id: metadata/binary/symbols/count::many-imports-100
  - id: resource-service-imports
    desc: Resource service staging imports
    crit: suspicious
    conf: 0.995
    size_min: 2600000
    size_max: 2900000
    all:
      - id: micro-behaviors/os/sysinfo/hostname::get-computer-name
      - id: micro-behaviors/fs/temp/file::get-temp-file-name
      - id: micro-behaviors/process/create/spawn::create-process-w
    any:
      - id: micro-behaviors/data/embedded/payload/resource::find-resource-w
      - id: micro-behaviors/data/embedded/payload/resource::load-resource
      - id: micro-behaviors/mem/read/cross-process::read-process-memory
      - id: micro-behaviors/os/service/create::create-service-w-import
      - id: micro-behaviors/os/privilege/token::adjust-token-privileges
    needs: 3
    unless:
      - id: metadata/binary/symbols/count::many-imports-100
