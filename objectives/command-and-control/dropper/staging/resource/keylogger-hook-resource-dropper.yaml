# A loader that carries its payload as a PE resource, extracts it, and also
# installs a global keyboard hook with UrlDownloadToFile available is a
# loader and keylogger in one binary: the resource is the next stage, the
# hook is the spyware, and the downloader refreshes the stage from a server.
defaults:
  platforms: [windows]
  for: [pe]
  attack: T1204.002,T1056.001,T1105
composite_rules:
  - id: resource-extractor-with-keyboard-hook-and-wininet
    desc: Resource extractor with keyboard hook and WinINet
    crit: hostile
    conf: 0.85
    all:
      - id: micro-behaviors/data/embedded/payload/resource::pe-resource-full-extraction
      - id: micro-behaviors/ui/window/hook::set-windows-hook
      - id: micro-behaviors/communications/http/client/wininet::internet-read-file
      - id: micro-behaviors/os/registry/keys/autostart::currentversion-run-key-path
    unless:
      - id: metadata/signed/platform/
