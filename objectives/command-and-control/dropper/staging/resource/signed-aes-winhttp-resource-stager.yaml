# A code-signed stager: it unpacks a resource, decrypts with BCrypt, reaches
# out over WinHTTP and loads the result in memory. An intact signature from a
# commercial CA says nothing about intent; EV certificates are bought by
# operators of this chain. The signature only keeps it out of the platform
# exception, it does not clear it.
defaults:
  platforms: [windows]
  for: [pe]
  attack: T1027.009,T1105,T1620,T1553.002
composite_rules:
  - id: ca-signed-resource-aes-winhttp-memory-loader
    desc: CA-signed AES/WinHTTP resource memory loader
    crit: hostile
    conf: 0.88
    all:
      - id: metadata/signed/certificate/chain::ca-issued-intact-signature
      - id: micro-behaviors/data/embedded/payload/resource::pe-resource-full-extraction
      - id: micro-behaviors/crypto/library/cryptoapi::bcrypt-decrypt-api
      - id: micro-behaviors/communications/http/client/winhttp::winhttp-request-flow
      - id: objectives/command-and-control/backdoor/loader/native-reflect::in-memory-pe-loader-with-decryption
    unless:
      - id: metadata/signed/platform/
      - id: metadata/package/testing/
