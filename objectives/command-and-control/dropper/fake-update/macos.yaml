# Tokenized product-update URLs used to retrieve a macOS ClickFix payload.
# The brand segment rotates (google, jetbrains, Vert, …); the durable shape is
# a long opaque path token followed by /<product>/update or /updateAll.
defaults:
  platforms: [macos]
  for: [shell]
  attack: T1105,T1036.005
  mbc: B0011

traits:
  - id: tokenized-product-update-path
    desc: Long-token product-update payload path
    crit: notable
    conf: 0.93
    if:
      type: text
      regex: '/[A-Za-z0-9_-]{20,}/[A-Za-z][A-Za-z0-9_-]{2,32}/update(All)?\b'

composite_rules:
  - id: tokenized-update-payload-fetch
    desc: Fetches a tokenized product-update payload
    crit: hostile
    conf: 0.96
    near_bytes: 400
    all:
      - id: tokenized-product-update-path
      - id: micro-behaviors/communications/http/download/curl::curl-output-file
      - id: micro-behaviors/fs/path/temp::unix-temp
