defaults:
  for: [pe]
  platforms: [windows]
  attack: T1105
  mbc: B0011
traits:
  - id: programdata-update-dir
    desc: ProgramData Update staging dir
    crit: suspicious
    conf: 0.93
    if:
      type: text
      exact: 'C:\ProgramData\Update'
  - id: commonfiles-update-dir
    desc: Common Files Update dir
    crit: suspicious
    conf: 0.91
    if:
      type: text
      exact: 'C:\Program Files\Common Files\Update'
  - id: wwansvc-drop-path
    desc: WwanSvc fake updater path
    crit: suspicious
    conf: 0.96
    if:
      type: text
      regex: '(?i)\\Update\\WwanSvc\.exe$'
  - id: wwansvc-run-launch
    desc: WwanSvc run launcher command
    crit: suspicious
    conf: 0.96
    if:
      type: text
      regex: '(?i)^"C:\\.{0,120}\\Update\\WwanSvc\.exe" /run$'
  - id: window-update-lure
    desc: Window Update lure string
    crit: suspicious
    conf: 0.88
    if:
      type: text
      exact: 'Window Update'
  - id: cmd-processed-log
    desc: Command processed audit string
    crit: suspicious
    conf: 0.92
    if:
      type: text
      exact: 'CMD:%s PROCESSED AT'
  - id: staged-download-status
    desc: Download status telemetry strings
    crit: component
    conf: 0.9
    if:
      type: text
      regex: 'Download (success|failure)'
  - id: staged-exec-status
    desc: Execution status telemetry strings
    crit: component
    conf: 0.9
    if:
      type: text
      regex: 'Execution (success|failure)'
  - id: native-update-version-download-endpoints
    desc: Native updater version/download endpoints
    crit: notable
    conf: 0.9
    for: [pe, dll]
    if:
      type: encoded
      encoding: wide
      regex: '^/update/(version|download)$'
  - id: native-update-batch-move-command
    desc: Batch move command replaces executable
    crit: notable
    conf: 0.94
    for: [pe, dll, batch]
    if:
      # This command is embedded in a mixed ASCII/UTF-16 updater string and
      # is not present in Cleave's ordinary extracted-string corpus.
      type: hex
      pattern: 6d 6f 76 65 20 2f 59
      section: .rdata
  - id: native-update-batch-self-delete
    desc: Batch updater self-delete command
    crit: notable
    conf: 0.94
    for: [pe, dll, batch]
    if:
      type: text
      substr: 'del "%~f0"'
composite_rules:
  - id: fake-update-install-cluster
    desc: Fake updater dual install paths
    crit: suspicious
    conf: 0.95
    all:
      - id: wwansvc-drop-path
    any:
      - id: programdata-update-dir
      - id: commonfiles-update-dir
      - id: wwansvc-run-launch
      - id: window-update-lure
    needs: 2
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/vendor::microsoft-corp-versioninfo
  - id: runkey-fake-update-stager
    desc: Run-key fake update download stager
    crit: hostile
    conf: 0.97
    all:
      - id: fake-update-install-cluster
      - id: micro-behaviors/os/registry/keys::currentversion-run
    any:
      - id: cmd-processed-log
      - id: staged-download-status
      - id: staged-exec-status
      - id: micro-behaviors/communications/http/get::urlmon-dynamic-load
      - id: micro-behaviors/communications/ip/literal::external-ipv4-binary
      - id: micro-behaviors/process/sync/mutex::mutex-instance-check
      - id: micro-behaviors/process/create/exec::winexec
      - id: micro-behaviors/process/create/spawn::create-process-a
    needs: 4
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/vendor::microsoft-corp-versioninfo
  - id: native-update-batch-self-replacement
    desc: Batch self-replacement command sequence
    crit: notable
    conf: 0.95
    for: [pe, dll, batch]
    all:
      - id: native-update-batch-move-command
      - id: native-update-batch-self-delete
  - id: native-self-replacing-remote-update-agent
    desc: Unsigned native agent downloads and self-replaces from a remote channel
    crit: hostile
    conf: 0.97
    attack: T1105,T1071.001,T1036.005
    for: [pe, dll]
    all:
      - id: native-update-version-download-endpoints
      - id: native-update-batch-move-command
      - id: native-update-batch-self-delete
      - id: micro-behaviors/communications/http/websocket::wss-scheme
      - id: micro-behaviors/communications/http/client/winhttp::winhttp-runtime-api-table
      - id: micro-behaviors/fs/file/move::move-file-ex
      - id: micro-behaviors/fs/file/delete::deletefile-w
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/installer/family/
      - id: metadata/binary/vendor/
