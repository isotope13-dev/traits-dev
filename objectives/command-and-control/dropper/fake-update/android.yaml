defaults:
  platforms: [android]
  for: [java, kotlin]
  attack: T1631,T1105
  mbc: B0011

composite_rules:
  # A tap-to-install update notice, a remote fetch, and a PackageInstaller
  # session that declares no user action are three halves of one lure: the
  # prompt promises the user a choice that the install session then skips.
  # Store-delivered apps do not install their own updates this way.
  - id: fake-update-prompt-silent-apk-install
    desc: Fake update prompt with silent APK install
    crit: hostile
    conf: 0.93
    all:
      - id: micro-behaviors/ui/dialog/prompt::tap-to-install-update-prompt
      - id: micro-behaviors/communications/http/client/library::java-http-url-connection
      - id: micro-behaviors/os/package-manager/sideload::android-silent-apk-install
