defaults:
  platforms: [unix, windows]
  for: [ruby]
traits:
  - id: ruby-data-section-eval
    desc: Evaluates substituted Ruby DATA section
    crit: suspicious
    conf: 0.98
    if:
      type: tree-sitter
      query: |
        ((_ (assignment left: (identifier) @source
             right: (call receiver: (call receiver: (constant) @data method: (identifier) @read)
               method: (identifier) @replace))
            (call method: (identifier) @eval arguments: (argument_list (identifier) @executed)))
          (#eq? @data "DATA") (#eq? @read "read")
          (#match? @replace "^(gsub|sub)$")
          (#eq? @eval "eval") (#eq? @source @executed))
