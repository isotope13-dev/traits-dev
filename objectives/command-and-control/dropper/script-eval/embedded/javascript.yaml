  crit: hostile
  conf: 0.99
  attack: T1027,T1140,T1059.007
  mbc: B0032
  scope: file
  all:
  - id: metadata/build/minifier::js-large-minified-bundle
  - id: micro-behaviors/data/decode/custom::js-alphabet-coded-decoder-source
  - id: micro-behaviors/data/decode/custom::js-charcode-byte-mask
  - id: micro-behaviors/process/interpreter/eval/indirect::js-eval-alias-assignment
  unless:
  - id: metadata/package/testing/
  - id: "metadata/file/naming::test-directory-component"
- id: custom-decoder-function-constructor-dropper
  desc: Large JavaScript decoder feeds Function constructor
  crit: hostile
  conf: 0.99
  attack: T1027,T1140,T1059.007
  mbc: B0032
  scope: file
  # Without proximity, a decoder loop, unicode set iteration, and a Function
  # constructor across distant bundled libraries (e.g. in Bokeh compiler) compose.
  near_bytes: 2048
  all:
  - id: metadata/file/data-blob::js-many-very-long-strings
  - id: micro-behaviors/data/decode/custom::js-indexof-charat-lookup
  - id: micro-behaviors/data/control-flow/loop::js-two-step-loop
  - id: micro-behaviors/process/interpreter/eval/compile::js-new-function-variable-argument
  unless:
  - id: well-known/lib/web/client-side/mermaid::mermaid-bundle-marker
  - id: well-known/app/publishing/wordpress-plugins/catalog::known-wordpress-plugin
  - id: well-known/lib/vendor-sdk/freemius::freemius-js-ref
  - id: well-known/lib/web/client-side/vue::library-comp
- id: custom-alphabet-decoder-function-dropper
  desc: Alphabet and octal decoders execute Function
  crit: hostile
  conf: 0.99
  attack: T1027,T1140,T1059.007
  mbc: B0032
  scope: file
  all:
  - id: micro-behaviors/data/decode/custom::js-indexof-charcode-shift-decoder
  - id: micro-behaviors/data/decode/custom::js-octal-charcode-loop
  - id: micro-behaviors/data/encode/string::decimal-string-blob
  - id: micro-behaviors/process/interpreter/eval/compile::js-new-function-variable-argument
  unless:
  - id: well-known/lib/web/client-side/mermaid::mermaid-bundle-marker
  - id: metadata/package/testing/
  - id: "metadata/file/naming::test-directory-component"
- id: activex-serverxmlhttp-sync-eval-dropper
  desc: ActiveX ServerXMLHTTP synchronous fetch and eval dropper
  crit: hostile
  conf: 0.99
  attack: T1105,T1059.007
  # Same reserved-TLD inertness as activex-xmlhttp-remote-eval above.
  unless:
  - id: micro-behaviors/communications/http/url/tld::reserved-documentation-tld-url
  all:
  - id: micro-behaviors/os/com/automation::activex-constructor-call
  - id: micro-behaviors/communications/http/client/xmlhttp::http-client-msxml-serverxmlhttp-progid
  - id: micro-behaviors/communications/http/client/xmlhttp::xhr-sync-get
  - id: micro-behaviors/process/interpreter/eval/direct::js-eval-response-text
- id: activex-xmlhttp-marker-remote-eval
  desc: ActiveX XMLHTTP marker-rewritten remote eval
  crit: hostile
  conf: 0.99
  all:
  - id: micro-behaviors/process/deploy/script-eval::activex-http-response-eval
  - id: objectives/anti-static/obfuscation/string/fragmentation::js-response-split-join-marker
  - id: objectives/anti-static/obfuscation/string/fragmentation::js-join-substring-char
- id: wscript-xmlhttp-download-eval
  desc: WScript XMLHTTP download and eval execution
  crit: hostile
  conf: 0.95
  unless:
  - id: well-known/lib/web/client-side/jquery::license-url
  # Reserved-TLD fetches cannot resolve, so the eval has no payload to run.
  - id: micro-behaviors/communications/http/url/tld::reserved-documentation-tld-url
  all:
  - id: objectives/execution/interpreter/script/wsh::wscript-createobject
  - id: micro-behaviors/communications/http/client/response-body::response-text
  any:
  - id: micro-behaviors/process/interpreter/eval/direct::js-eval-raw
- id: html-title-dead-drop-eval
  desc: Page title points at an eval payload
  crit: hostile
  conf: 0.96
  attack: T1105,T1059.007
  near_bytes: 4096
  all:
  - id: html-data-title-next-url
  - id: objectives/supply-chain/hidden-payload/encoding::eval-atob
  # Staging claim for the XOR-encrypted inline stage: the page carries its
  # own key (Base64) and ciphertext and evaluates the rebuild. The
  # concealment half convicts in encoding/xor::atob-keyed-xor-eval-loader;
  # this names the embedded-stage execution.
- id: xor-keyed-stage-eval-dropper
  desc: Base64-keyed XOR stage evaluated in page
  crit: hostile
  conf: 0.97
  attack: T1027,T1059.007
  for: [html, javascript]
  platforms: [windows, unix]
  near_lines: 40
  all:
  - id: micro-behaviors/data/decode/base64::atob-embedded-base64-literal
  - id: micro-behaviors/data/string/conversion::js-fromcharcode-xor-result
  - id: micro-behaviors/process/interpreter/eval/direct::eval-call-text
  # Staging claim for the token-table stage: the page carries a machine
  # concealment table and evaluates its concatenation. The concealment half
  # convicts in concat::token-table-eval-loader; this names the embedded
  # stage execution, required adjacent because the eval consumes the table.
- id: token-table-stage-eval-dropper
  desc: Token-table stage concatenated and evaluated in page
  crit: hostile
  conf: 0.97
  attack: T1027,T1059.007
  for: [html, javascript]
  platforms: [windows, unix]
  near_bytes: 2048
  all:
  - id: micro-behaviors/data/string/concat::js-indexed-token-table
  - id: micro-behaviors/process/interpreter/eval/direct::eval-call-text
  # A rotating server-side gate (bare random-token PHP script source) on a
  # page that also injects third-party scripts at runtime: the gate hides
  # the staged payload while the injector pulls the live one. Either half
  # alone is weaker; together they name the staged drop.
- id: random-php-gate-runtime-inject-dropper
  desc: Random PHP gate with runtime script injection
  crit: hostile
  conf: 0.94
  attack: T1105,T1059.007
  for: [html, javascript]
  platforms: [windows, unix]
  all:
  - id: micro-behaviors/communications/http/client/resource::random-php-script-src
  - id: micro-behaviors/data/collection/dom::script-create-near-src-assignment
# Hacked-page script injection that hides the payload element by reversing it:
# `document.write('>tpircs/<>...'.split("").reverse().join(""))` rebuilds
# `<script src="https://...">` at runtime. Reversal plus a script write is
# never page construction; the reversed tag proves the concealed element.
- id: reversed-document-write-script-injector
  desc: Reversed string feeds document.write script injection
  crit: hostile
  conf: 0.97
  attack: T1189,T1105,T1027
  for: [html]
  platforms: [windows, unix]
  all:
  - id: micro-behaviors/ui/window/insert-html::browser-document-write
  - id: micro-behaviors/data/string/reverse::html-split-reverse-join-string
  - id: micro-behaviors/data/string/reverse::reversed-script-tag-text
# Execution twin of the obfuscator loader above: the decoder derives the
# Function constructor's head letter ("f" from the false-string) beside a
# substitution alphabet under massed coercion. Alphabet plus constructor
# head plus coercion mass name the constructed-code stager from its
# execution shape rather than its concealment.
- id: attribute-smuggled-directory-script-execution
  desc: Smuggled script tag executes from a directory endpoint
  crit: hostile
  conf: 0.96
  attack: T1189,T1105
  for: [html]
  platforms: [windows, unix]
  all:
  - id: micro-behaviors/communications/http/client/resource::attribute-value-script-tag
  - id: micro-behaviors/communications/http/client/resource::directory-endpoint-script-src
# Hex-table concealed iframe: a hex-escaped string array holds iframe
# markup, a computed document member (`document[name](...)`) performs the
# write without naming it, and the element renders at most one pixel.
# Table plus computed write plus tiny frame name the concealed load.
- id: hex-table-computed-write-tiny-iframe
  desc: Hex table feeds computed write of a tiny iframe
  crit: hostile
  conf: 0.96
  attack: T1189,T1027
  for: [html]
  platforms: [windows, unix]
  all:
  - id: metadata/lang/encoding::javascript-hex-escape-string-table
  - id: micro-behaviors/data/control-flow/dispatch::js-computed-document-call
  - id: micro-behaviors/ui/window/visibility::tiny-iframe-at-most-one
- id: registry-reversed-base64-assembly-load
  desc: Script loads reversed Base64 assembly from registry
  crit: hostile
  conf: 0.97
  attack: T1027,T1620,T1112
  all:
  - id: micro-behaviors/metaprogramming/reflection::powershell-appdomain-currentdomain
  - id: micro-behaviors/data/decode/base64::dotnet-frombase64string-text
  - id: micro-behaviors/data/string/reverse::split-reverse-join-string
  - id: micro-behaviors/os/registry/write::wscript-regwrite
