  conf: 0.95
  attack: T1027,T1140
  mbc: B0032
  scope: file
  near_bytes: 2048
  all:
  - id: micro-behaviors/data/decode/custom::js-indexof-charat-lookup
  - id: micro-behaviors/data/control-flow/loop::js-two-step-loop
  - id: micro-behaviors/process/interpreter/eval/indirect::js-indirect-eval-variable
  unless:
  - id: well-known/lib/web/mermaid::mermaid-bundle-marker
  - id: well-known/lib/web/google-closure-library::closure-compiled-global-eval
  - id: well-known/lib/web/google-closure-library::closure-library-copyright
- id: packed-custom-decoder-eval-dropper
  desc: Large JavaScript custom decoder feeds an indirect eval sink
  crit: hostile
  conf: 0.97
  attack: T1027,T1059.007
  mbc: B0032
  scope: file
  all:
  - id: metadata/build/minifier::js-large-minified-bundle
