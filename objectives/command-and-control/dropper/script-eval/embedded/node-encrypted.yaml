defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  attack: T1059.007
  mbc: B0024

composite_rules:
  - id: node-codec-chain-require-eval-dropper
    desc: Node codec chain require eval dropper
    crit: hostile
    conf: 0.98
    attack: T1105, T1027.013, T1059.007
    all:
      - id: micro-behaviors/metaprogramming/generation::js-function-constructor-require-parameter
      - id: micro-behaviors/process/interpreter/eval/constructed::js-function-constructor-require-invocation
      - id: micro-behaviors/crypto/decrypt::named-gcm-decrypt-helper-reference
      - id: micro-behaviors/data/decode/custom::named-codec-decoder-helper-reference
      - id: micro-behaviors/data/decode/custom::named-position-decoder-helper-reference
    unless:
      - id: metadata/package/testing/harness/runtime/
      - id: metadata/build/bundler/asset::js-large-module-bundle
