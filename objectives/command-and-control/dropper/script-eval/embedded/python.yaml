defaults:
  platforms:
  - windows
  - unix
  for:
  - python
  attack: T1027.002
  mbc: B0024
  crit: hostile
composite_rules:
- id: embedded-zlib-base64-exec-loader
  desc: Embedded Python payload decoded with base64 and zlib then exec'd
  conf: 0.97
  all:
  - id: micro-behaviors/process/interpreter/eval/direct::exec-builtin
  - id: micro-behaviors/data/decompress/zlib::zlib-decompress-symbol
  - id: metadata/lang/source/naming/resource::b64decode-string
  - id: metadata/file/encoding::multiple-long-base64-literals
  any:
  - id: micro-behaviors/os/module/load::dunder-import-call
  - id: objectives/anti-static/obfuscation/reflection/class::python-import-chain
- id: embedded-base64-yaml-unsafe-loader
  desc: Decodes and parses embedded YAML payload with unsafe loader
  conf: 0.98
  attack: T1027,T1059.006,T1203
  near_lines: 15
  all:
  - id: micro-behaviors/data/serialize/yaml::yaml-load-call
  - id: micro-behaviors/data/decode/base64::b64decode-call
  - id: micro-behaviors/data/control-flow/module-exec::module-level-side-effect-call
  any:
  - id: micro-behaviors/data/serialize/yaml::yaml-loader-unsafe
  - id: micro-behaviors/data/serialize/yaml::yaml-unsafe-load
  unless:
  - id: metadata/package/testing/
  - id: well-known/tool/detection/
  - id: metadata/path::test-directory-component
