# Hex-XOR-decoded PowerShell source evaluated through IEX; embedded-source evaluation.
defaults:
  platforms: [windows]
  for: [powershell]
  attack: T1027,T1059.001,T1140
  mbc: B0032,C0043
composite_rules:
  - id: powershell-hex-xor-iex-loader
    desc: PowerShell hex-XOR decoder evaluates via IEX
    crit: hostile
    conf: 0.98
    all:
      - id: objectives/command-and-control/dropper/staging/encrypted::powershell-hex-xor-decoder
      - id: metadata/lang/scripted::powershell-leading-block-comment
    any:
      - id: micro-behaviors/process/interpreter/eval/direct::powershell-iex-call
    near_bytes: 4096
