defaults:
  platforms: [windows, unix]
  for: [powershell, batch]
  attack: T1027,T1140,T1059.001
composite_rules:
  - id: powershell-negative-offset-scriptblock-loader
    desc: Offset-decoded array with ScriptBlock invocation
    crit: hostile
    conf: 0.98
    near_lines: 8
    all:
      - id: micro-behaviors/data/decode/custom::powershell-negative-offset-character-decoder
      - id: micro-behaviors/process/interpreter/eval/compile::powershell-scriptblock-constructor-text
      - id: micro-behaviors/process/interpreter/eval/compile::powershell-created-scriptblock-call
