# Completed encrypted payload chain classified by its activation sink; embedded-source evaluation.
defaults:
  platforms: [windows]
  for: [powershell]
  attack: T1027,T1059.001,T1140
  mbc: B0032,C0043

composite_rules:

  - id: powershell-hex-xor-scriptblock-loader
    desc: PowerShell hex-XOR decoder materializes a ScriptBlock
    crit: hostile
    conf: 0.98
    all:
      - id: objectives/command-and-control/dropper/staging/encrypted::powershell-hex-xor-decoder
      - id: metadata/lang/scripted::powershell-leading-block-comment
      - id: micro-behaviors/process/interpreter/eval/compile::powershell-scriptblock-constructor-text
    near_bytes: 4096

  - id: errtraffic-code-verification-xor-loader
    desc: ErrTraffic Code Verification XOR ClickFix loader
    crit: hostile
    conf: 0.995
    attack: T1027,T1059.001,T1140,T1204.004
    all:
      - id: objectives/command-and-control/dropper/script-eval/response-pipeline::clickfix-code-verification-comment
      - id: objectives/command-and-control/dropper/staging/encrypted::powershell-hex-xor-decoder
    any:
      - id: micro-behaviors/process/interpreter/eval/direct::powershell-iex-call
      - id: micro-behaviors/communications/http/lib/invoke-webrequest::embedded-iex-irm-call
    near_bytes: 4096
