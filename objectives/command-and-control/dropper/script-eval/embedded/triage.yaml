composite_rules:
- id: wsh-obfuscated-script-stager
  platforms:
  - windows
  for:
  - vbs
  attack: T1027,T1059.001,T1059.005,T1564.003
  desc: VBScript stages encoded content for hidden script evaluation
  crit: hostile
  conf: 0.99
  mbc: B0023
  all:
  - id: micro-behaviors/data/decode/xor::vbs-numeric-code-xor
  - id: micro-behaviors/os/com/automation::vbs-computed-createobject
  - id: micro-behaviors/fs/write/stream::wsh-savetofile
  - id: micro-behaviors/process/create/hidden::wsh-run-hidden-statement
  - id: metadata/file/line::vbs-long-average-lines
  - id: micro-behaviors/process/interpreter/eval/direct::embedded-powershell-delete-then-eval
  any:
  - id: micro-behaviors/fs/write/content::create-text-file-api
  - id: micro-behaviors/fs/write/stream::adodb-save-to-file-observed

