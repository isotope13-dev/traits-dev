defaults:
  for:
  - vbs
  platforms:
  - windows
  crit: hostile
  conf: 0.99
composite_rules:
- id: hidden-file-read-delete-eval-stage
  desc: Hidden encoded script stage is read, deleted, and evaluated
  all:
