  - id: micro-behaviors/process/interpreter/eval/direct::embedded-powershell-delete-then-eval
  - id: micro-behaviors/process/create/exec::wsh-run-hidden-async-statement
  - id: micro-behaviors/data/format/xml::msxml-datatype-bin-base64
