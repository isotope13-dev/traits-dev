defaults:
  platforms: [windows]
  for: [javascript]

composite_rules:
  # The execution half of the obfuscated WSH dropper: a base64 alphabet
  # plus an XOR/RC4 modulo decoder loop resolves every string at run
  # time, split Shell.Application gives an elevated shell, and a Run
  # call executes the assembled command. No leg names the payload,
  # which is the point of the construction.
  - id: wsh-rc4-string-decoder-shell-run
    desc: RC4-decoded WSH strings reach a shell Run execution
    crit: hostile
    conf: 0.96
    attack: T1027,T1059.005,T1106
    all:
      - id: metadata/file/encoding/base64::long-base64-alphabet-literal-js
      - id: micro-behaviors/data/arithmetic::xor-modulo-loop-observation
      - id: micro-behaviors/os/com/automation::activex-constructor-call
      - id: micro-behaviors/os/com/automation::js-split-shell-application-progid
      - id: micro-behaviors/data/control-flow/dispatch/named::script-run-method-call
