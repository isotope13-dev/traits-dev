# Remote JavaScript fetch-to-evaluation chains; grouped under the script-eval remote-code mechanism.
defaults:
  platforms:
  - windows
  - unix
  for:
  - javascript
  - typescript
  crit: notable
  conf: 0.8
  attack: T1105
traits:
- id: json-to-function-constructor-chain
  desc: JSON response reaches Function constructor
  crit: notable
  conf: 0.9
  if:
    type: text
    regex: \.json\s*\([^)]{0,8}\)[\s\S]{0,128}new\s+Function\s*\(\s*[A-Za-z_$]
- id: fetch-atob-json-callback
  desc: fetch decodes URL then parses JSON
  crit: notable
  conf: 0.92
  if:
    type: text
    regex: fetch\s*\(\s*atob\s*\(.{1,80}\)\s*\)[\s\S]{0,160}\.json\s*\(
- id: eval-json-content-field
  desc: Assigns .content then immediately evals
  crit: suspicious
  conf: 0.96
  attack: T1059.007
  if:
    type: text
    regex: =[^\n;=]{0,120}\.content\s*;\s*eval\s*\(
- id: eval-direct-json-content
  desc: eval directly executes JSON content
  crit: suspicious
  conf: 0.98
  attack: T1059.007
  unless:
  - id: metadata/file/catalog/github-issue::github-issue-intel-catalog
  - id: well-known/tool/offensive/wirelessxpl::authorized-framework-context
  if:
    type: text
    regex: \beval\s*\(\s*[A-Za-z_$][\w$]*\.content\s*\)
- id: eval-response-data-content
  desc: eval executes response data content
  crit: suspicious
  conf: 0.98
  attack: T1059.007
  if:
    type: text
    regex: \beval\s*\(\s*(response|resp|res|r)\.data\.content(_[A-Za-z0-9_$]+)?\s*\)
- id: function-result-invoked-require
  desc: Generated function invoked with require
  crit: notable
  conf: 0.92
  attack: T1059.007
  if:
    type: text
    regex: \b[A-Za-z_$][\w$]*\(\s*require\s*\)
  unless:
  - id: metadata/package/testing/
  - id: "metadata/file/naming::test-directory-component"
- id: function-require-response-data-ast
  desc: Function executes HTTP response data
  crit: suspicious
  conf: 0.98
  attack: T1059.007
  if:
    type: text
    regex: new\s+Function\s*\(\s*['"]require['"][\s\S]{0,80}\.data\b
- id: request-callback-b-param
  desc: Request callback exposes body parameter
  crit: notable
  conf: 0.9
  if:
    type: text
    regex: \breq\s*\([^)]{1,80},\s*\([^)]{0,30},\s*[^)]{0,30},\s*b\s*\)\s*=>
- id: function-constructor-require-b
  desc: Function constructor uses body variable
  crit: suspicious
  conf: 0.96
  attack: T1059.007
  if:
    type: text
    regex: Function\.constructor\)?\s*\(\s*['"]require['"]\s*,\s*b\s*\)
- id: json-message-base64-decode
  desc: Decodes JSON message payload
  crit: notable
  conf: 0.96
  attack: T1140
  if:
    type: text
    regex: 'Buffer\.from\s*\([^)]{0,60}\.message\b[^)]{0,30}[''"]base64[''"]'
  not:
    # SMTP AUTH PLAIN/LOGIN handlers base64-decode credentials beside
    # message plumbing (`handleAuthPlain`, `504 Unrecognized authentication
    # mechanism`); that is mail transport, not a dropper payload.
    - regex: '(?i)(handleAuth(Plain|Login)|AUTH\s+(PLAIN|LOGIN)|Unrecognized authentication)'
  unless:
  - id: micro-behaviors/process/interpreter/vm/
  - id: well-known/lib/development/vscode-webview::acquire-vscode-api
  # SMTP servers base64-decode AUTH credentials beside message handling
  # (AUTH PLAIN/LOGIN); that is mail transport, not a dropper payload.
  - id: micro-behaviors/communications/email/send/smtp::smtp-mail-context-reference
- id: object-values-to-validation-handler
  desc: JSON object values routed to handler
  crit: notable
  conf: 0.86
  if:
    type: text
    regex: Object\.keys\(\w+\)\.forEach\(\w+\s*=>\s*\w+\(\w+\[\w+\]\)\)
- id: await-fetch-text-eval
  desc: eval awaits fetched response text
  crit: suspicious
  conf: 0.98
  attack: T1059.007
  if:
    type: text
    regex: eval\s*\(\s*await\s*\(\s*await\s+fetch\(.{1,120}\)\)\.text\(\)\s*\)
  unless:
  - id: use-m-unpkg-fetch-eval-bootstrap
  - id: use-m-jsdelivr-fetch-eval-bootstrap
- id: use-m-unpkg-fetch-eval-bootstrap
  desc: Evaluated fetch targets use-m on unpkg
  crit: notable
  conf: 0.95
  attack: T1059.007
  if:
    type: text
    regex: eval[\s\S]{0,32}fetch[\s\S]{0,8}https://unpkg\.com/use-m/
- id: use-m-jsdelivr-fetch-eval-bootstrap
  desc: Evaluated fetch targets use-m on jsDelivr
  crit: notable
  conf: 0.95
  attack: T1059.007
  if:
    type: text
    regex: eval[\s\S]{0,32}fetch[\s\S]{0,8}https://cdn\.jsdelivr\.net/npm/use-m/
- id: encoded-eval-await-fetch
  desc: Base64 payload evals an awaited fetch response
  crit: suspicious
  conf: 0.98
  attack: T1059.007,T1105
  if:
    type: encoded
    encoding: base64
    regex: eval\s*\(\s*await\s+fetch\s*\(
- id: remote-https-get-tls-bypass
  desc: HTTPS GET disables certificate verification
  crit: suspicious
  conf: 0.98
  attack: T1573
  if:
    type: text
    regex: \.get\s*\(\s*\{[\s\S]{0,240}?rejectUnauthorized\s*:\s*false
  # A loopback health check of a local proxy often skips cert verification
  # because the certificate is self-signed. That is not a remote dropper.
  # `not:` applies to the matched get() span; a different get() to a public
  # host in the same file still matches.
  not:
  - regex: 'hostname:\s*["'']127\.0\.0\.1["'']'
  - regex: 'hostname:\s*["'']localhost["'']'
  - regex: 'hostname:\s*["'']::1["'']'
  unless:
  - type: text
    regex: hostname:\s*["']localhost["']
  - id: well-known/tool/development/toolchain/deno::source-archive-context
  - id: metadata/package/testing/
  - id: "metadata/file/naming::test-directory-component"
- id: then-eval-pointfree
  desc: Promise resolution piped into eval
  crit: suspicious
  conf: 0.92
  attack: T1059.007
  if:
    type: text
    regex: \.then\s*\(\s*eval\s*\)
  unless:
  - id: well-known/lib/runtime/scripted/node-runtime::source-tree
  - type: text
    regex: (?m)\(\s*\.\.\.\s*\)\s*\.then\s*\(\s*eval\s*\)|^\s*(//|\*).{0,120}\.then\s*\(\s*eval\s*\)
  - id: well-known/app/communication/thunderbird::firefox-source-tree-path
  - id: metadata/package/testing/presence/fixture::defanged-disabled-effect-context
- id: then-eval-ident-callback
  desc: Promise then() callback evaluates its argument
  crit: suspicious
  conf: 0.93
  attack: T1059.007
  if:
    type: text
    regex: \.then\s*\(\s*\(?\s*[A-Za-z_$][\w$]*\s*\)?\s*=>\s*\{?\s*eval\s*\(\s*[A-Za-z_$][\w$]*\s*\)
  unless:
  - id: metadata/package/testing/
  - id: well-known/lib/data/duckdb::javascript-worker-path
  - id: "metadata/file/naming::test-directory-component"
  - id: metadata/build/bundler/runtime::js-emscripten-generated-bundle
- id: userjs-endpoint
  desc: User JavaScript endpoint path
  crit: notable
  conf: 0.9
  if:
    type: string_literal
    substr: /api/userjs/
- id: fetch-text-function-code
  desc: Fetched text executed as Function
  crit: notable
  conf: 0.96
  attack: T1059.007
  if:
    type: text
    regex: \.text\(\)[\s\S]{0,240}new\s+Function\s*\(\s*(["']require["']|[A-Za-z_$][\w$]*\s*\))
  unless:
  - id: well-known/lib/ui/monaco-editor/
  - id: metadata/package/testing/
  - id: "metadata/file/naming::test-directory-component"
- id: fetch-random-query-cachebuster
  desc: Fetch URL carries a random query cachebuster
  crit: notable
  conf: 0.92
  if:
    type: text
    regex: \+\s*["']\?["']\s*\+\s*\(?\s*Math\.random\s*\(
- id: computed-async-response-callback
  desc: Computed Promise then callback fragment
  crit: notable
  conf: 0.96
  if:
