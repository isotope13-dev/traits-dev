  - id: "metadata/file/naming::test-directory-component"
- id: computed-response-method-field
  desc: Computed response method and field access
  crit: notable
  conf: 0.94
  if:
    type: text
    regex: await\s+\w+\[[^\]]{1,80}\]\(\)\)\[[^\]]{1,80}\]
- id: recursive-retry-pattern
  desc: Recursive function retry on failure
  crit: notable
  conf: 0.7
