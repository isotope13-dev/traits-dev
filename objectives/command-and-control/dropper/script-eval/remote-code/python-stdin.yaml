defaults:
  for: [python]
  platforms: [unix, windows]

composite_rules:
  - id: encoded-url-detached-python-stdin-loader
    desc: Concealed HTTP payload executes in detached Python
    crit: hostile
    conf: 0.98
    attack: T1059.006,T1105
    all:
      - id: micro-behaviors/process/fd/stdio::python-http-body-to-child-stdin
      - id: micro-behaviors/process/create/subprocess::python-detached-stdin-interpreter-spawn
      - id: micro-behaviors/communications/http/url/encoded::base64-decoded-http-url
