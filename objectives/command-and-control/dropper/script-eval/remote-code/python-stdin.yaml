defaults:
  for: [python]
  platforms: [unix, windows]

composite_rules:
  - id: python-http-body-stdin-with-encoded-url
    desc: HTTP body to Python stdin with encoded URL
    crit: hostile
    conf: 0.98
    attack: T1059.006,T1105
    all:
      - id: micro-behaviors/process/fd/stdio::python-http-body-to-child-stdin
      - id: micro-behaviors/process/create/subprocess::sys-executable-stdin-subprocess
      - id: micro-behaviors/process/daemonize/detach::python-subprocess-new-session-option
      - id: micro-behaviors/process/fd/stdio::python-subprocess-near-devnull-stdio-assignment
      - id: micro-behaviors/communications/url/http-encoded::base64-decoded-http-url
