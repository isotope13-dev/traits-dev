# Remote script and authentication evidence distinguish this from daemon APIs.
defaults:
  crit: hostile
  for:
  - macho
  platforms:
  - macos
  attack: T1059.002,T1105
composite_rules:
- id: daemonized-remote-script-loader
  desc: Detached authenticated remote script loader
  conf: 0.95
  all:
  - id: micro-behaviors/process/daemonize/detach::fork-new-session
  - id: micro-behaviors/process/create/shell/
  - id: objectives/command-and-control/dropper/staging/memory::curl-osascript
  - id: micro-behaviors/communications/http/curl::curl-api-key-header
  any:
  - id: metadata/binary/section/prose::tiny-cstring-section
  - id: micro-behaviors/process/create/shell/timing::excessive-popen
  - id: metadata/binary/section/entropy::moderate-entropy-data-section
  unless:
  - id: metadata/signed/platform::apple
  - id: metadata/lang/compiler/systems::go-version-string
  - id: metadata/lang/compiler/systems::go-binary
  downgrade:
    any:
    - id: metadata/binary/symbols/count::many-imports
    - id: metadata/lang/compiler/systems/
- id: encoded-daemon-script-loader
  desc: Encoded detached remote script loader
  conf: 0.98
  all:
  - id: objectives/command-and-control/dropper/script-eval/remote-code::daemonized-remote-script-loader
  any:
  - id: objectives/anti-static/obfuscation/encoding/xor::xor-decode-loop
  - id: objectives/anti-static/obfuscation/encoding/xor::string-decrypt
  - id: objectives/anti-static/obfuscation/payload/section/content::encrypted-payload-section
  - id: metadata/binary/section/entropy::moderate-entropy-data-section
  - id: micro-behaviors/crypto/symmetric/xor/loop::repeating-key-buffer-decode
  unless:
  - id: metadata/signed/platform::apple
  - id: metadata/signed/developer
  - id: metadata/lang/compiler/systems/
  - id: well-known/tool/reverse-engineering/frida/
  - id: well-known/lib/runtime/native-platform/slint/
  downgrade:
    any:
    - id: metadata/binary/symbols/count::many-imports
- id: encoded-shell-daemon-loader
  desc: Detached loader with encoded shell content
  conf: 0.99
  all:
  - id: objectives/command-and-control/dropper/script-eval/remote-code::daemonized-remote-script-loader
  any:
  - id: objectives/anti-static/obfuscation/encoding/shell::encoded-shell-pattern
  - id: objectives/anti-static/obfuscation/payload/section/content::encrypted-payload-section
- id: generic-named-daemon-script-loader
  desc: Generic-named detached remote script loader
  conf: 0.99
  all:
  - id: objectives/command-and-control/dropper/script-eval/remote-code::daemonized-remote-script-loader
  - id: objectives/evasion/masquerade/naming/placeholder::suspicious-generic-naming
