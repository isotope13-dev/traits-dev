defaults:
  platforms: [windows, unix]
  for: [javascript, typescript, crx, xpi, zip, chrome-manifest]
  crit: hostile
  attack: T1059.007,T1105,T1176

composite_rules:
  - id: extension-message-controlled-main-world-eval
    desc: Extension evaluates message code in page main world
    conf: 0.995
    for: [javascript, typescript]
    near_lines: 60
    all:
      - id: micro-behaviors/communications/ipc/message::chrome-runtime-on-message
      - id: micro-behaviors/process/inject/webextension::webextension-scripting-execute
      - id: micro-behaviors/process/inject/webextension::chrome-scripting-main-world
      - id: micro-behaviors/process/interpreter/eval/compile::js-new-function-variable-argument

  - id: extension-remote-config-code-execution
    desc: Extension fetches config scripts for page execution
    conf: 0.995
    scope: archive
    all:
      - id: extension-message-controlled-main-world-eval
      - id: micro-behaviors/communications/http/request/client::js-fetch-call
      - id: micro-behaviors/communications/http/url/endpoint::rest-admin-config-user-endpoints
      - id: micro-behaviors/communications/ipc/message::chrome-runtime-send-message

  - id: broad-host-extension-remote-code-injection
    desc: Broad-host extension injects remotely supplied page code
    conf: 0.995
    scope: archive
    all:
      - id: micro-behaviors/communications/ipc/message::chrome-runtime-on-message
      - id: micro-behaviors/process/inject/webextension::webextension-scripting-execute
      - id: micro-behaviors/process/inject/webextension::chrome-scripting-main-world
      - id: micro-behaviors/process/interpreter/eval/compile::js-new-function-variable-argument
      - id: micro-behaviors/communications/http/request/client::js-fetch-call
      - id: micro-behaviors/communications/http/url/endpoint::rest-admin-config-user-endpoints
      - id: micro-behaviors/communications/ipc/message::chrome-runtime-send-message
      - id: metadata/permission/host::broad-host-access
      - id: micro-behaviors/process/inject/webextension::broad-content-script-injection
