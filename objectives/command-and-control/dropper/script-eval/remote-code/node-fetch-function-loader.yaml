defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]

composite_rules:
  - id: node-fetch-function-require-polling-loader
    desc: Node fetch loop executes fetched source with require
    crit: hostile
    conf: 0.99
    attack: T1059.007,T1105,T1071.001
    mbc: B0009.016
    scope: file
    all:
      - id: micro-behaviors/communications/http/request/client::js-fetch-call
      - id: micro-behaviors/communications/http/request/json::fetch-json-body
      - id: micro-behaviors/metaprogramming/generation::js-new-function-constructor
      - id: micro-behaviors/os/module/dynamic-load::node-dynamic-require-call
      - id: micro-behaviors/data/control-flow/loop::source-infinite-loop-metric
    unless:
      - id: metadata/package/testing/
