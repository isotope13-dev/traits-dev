defaults:
  platforms: [windows]
  for: [python]
  attack: T1059.001,T1105,T1053.005
composite_rules:
  - id: python-scheduled-hidden-powershell-remote-eval
    desc: Python attempts scheduled hidden PowerShell remote evaluation
    crit: hostile
    conf: 0.99
    scope: file
    near_bytes: 1200
    all:
      - id: micro-behaviors/communications/http/download/cli::python-iex-pipe-argument
      - id: micro-behaviors/process/argument/option::powershell-hidden-command-text
      - id: micro-behaviors/os/autorun/scheduled::python-schtasks-create-command
      - id: micro-behaviors/os/autorun/scheduled::schtasks-action-argument
      - id: micro-behaviors/process/create/subprocess::run-ast
    any:
      - id: micro-behaviors/communications/http/download/cli::python-powershell-iwr-url
