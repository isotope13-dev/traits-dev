defaults:
  attack: "T1027, T1059.001, T1105"
  platforms: [windows]
  for: [batch]

traits:
  - id: batch-codepage-remapped-systemroot-payload
    desc: Codepage remap builds SystemRoot PS path
    crit: suspicious
    conf: 0.97
    if:
      type: text
      regex: '(?m):¡\s*\r?\n%SystemRoot%(%%[^%\r\n]{1,3}){16,}'

composite_rules:
  - id: batch-webclient-iex-plain-ip
    desc: Batch WebClient eval with public IP context
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/communications/http/lib/invoke-webrequest::webclient-eval-followon
      - id: micro-behaviors/process/create/hidden::powershell-windowstyle-hidden-option
      - id: micro-behaviors/process/create/flags::powershell-policy-bypass-flag
      - id: micro-behaviors/communications/ip/literal::batch-public-ip-literal
  - id: batch-webclient-iex-plain-download
    desc: Batch WebClient eval with cleartext download
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/communications/http/lib/invoke-webrequest::webclient-eval-followon
      - id: micro-behaviors/process/create/hidden::powershell-windowstyle-hidden-option
      - id: micro-behaviors/process/create/flags::powershell-policy-bypass-flag
      - id: micro-behaviors/communications/http/lib/invoke-webrequest::downloadstring-cleartext-http-url
  - id: batch-webclient-iex-codepage
    desc: Codepage obfuscated batch WebClient stage
    crit: hostile
    conf: 0.98
    all:
      - id: objectives/anti-static/obfuscation/obfuscator/signature::batch-codepage-remap-obfuscator
      - id: batch-codepage-remapped-systemroot-payload
      - id: metadata/file/data-blob::high-byte-script-text
  - id: batch-hidden-policy-bypass-webclient-iex
    desc: Batch runs a hidden policy-bypassed PowerShell web response
    crit: hostile
    conf: 0.98
    attack: T1059.001,T1105,T1564.003
    all:
      - id: metadata/file/extension/executable::bat
    any:
      - id: batch-webclient-iex-plain-ip
      - id: batch-webclient-iex-plain-download
      - id: batch-webclient-iex-codepage
    needs: 1
