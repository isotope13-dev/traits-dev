defaults:
  platforms:
  - unix
  crit: suspicious
  attack: T1105
  mbc: B0030
  for:
  - shell
traits:
- id: eval-curl-subshell
  desc: eval "$(curl ..."
  crit: suspicious
  conf: 0.7
  attack: T1059.004 - '*'
  if:
    type: text
    regex: eval\s*"\$\(curl
  unless:
  - id: well-known/tool/packaging/gimme::gimme-bootstrap-context
  - id: well-known/lib/development/elastic-apm::jenkins-script-context
  - id: well-known/lib/development/elastic-apm::source-archive-context
- id: eval-curl-backtick
  desc: eval `curl ...`
  crit: suspicious
  conf: 0.7
  attack: T1059.004 - '*'
  if:
    type: text
    regex: eval\s*`curl
- id: eval-wget-subshell
  desc: eval "$(wget ..."
  crit: suspicious
  conf: 0.7
  attack: T1059.004 - '*'
  if:
    type: text
    regex: eval\s*"\$\(wget
  unless:
  - id: metadata/package/testing/presence/path::pkgbuild-test-fixture-path
- id: eval-wget-backtick
  desc: eval `wget ...`
  crit: suspicious
  conf: 0.7
  attack: T1059.004 - '*'
  if:
    type: text
    regex: eval\s*`wget
- id: curl-pipe-eval
  desc: curl output piped to eval
  crit: suspicious
  conf: 0.9
  attack: T1059.004 - '*'
  if:
    type: text
    regex: \bcurl\b[^|\n]{0,120}\|\s*\beval\b
  unless:
  - id: well-known/tool/detection/clawker::adversarial-payload-fixture
  - id: metadata/file/format/source-map::sourcemap-sources-content
- id: wget-pipe-eval
  desc: wget output piped to eval
  crit: suspicious
  conf: 0.9
  attack: T1059.004 - '*'
  if:
    type: text
    regex: \bwget\b[^|\n]{0,120}\|\s*\beval\b
  unless:
  - id: metadata/file/format/source-map::sourcemap-sources-content
- id: eval-openssl-subshell
  desc: eval "$(openssl ..."
  crit: suspicious
  conf: 0.8
  attack: T1059.004 - '*'
  for:
  - shell
  - macho
  if:
    type: text
    regex: eval\s*"\$\(openssl
- id: curl-cmd-variable-eval
  desc: curl output assigned to cmd then evaluated
  crit: suspicious
  conf: 0.92
  attack: T1059.004
  for:
  - shell
  - macho
  if:
    type: text
    regex: (?s)\bcmd=\$\(curl\b.{0,400}\).*?eval\s+"\$cmd"
- id: curl-script-variable-eval
  desc: curl output assigned to script then evaluated
  crit: suspicious
  conf: 0.92
  attack: T1059.004
  for:
  - shell
  - macho
  if:
    type: text
    regex: (?s)\bscript=\$\(curl\b.{0,400}\).*?eval\s+"\$script"
- id: curl-payload-variable-eval
  desc: curl output assigned to payload then evaluated
  crit: suspicious
  conf: 0.92
  attack: T1059.004
  for:
  - shell
  - macho
  if:
    type: text
    regex: (?s)\bpayload=\$\(curl\b.{0,400}\).*?eval\s+"\$payload"
- id: shell-curl-process-sub
  desc: shell <(curl ...)
  crit: suspicious
  conf: 0.7
  attack: T1059.004 - '*'
  if:
    type: text
    regex: shell\s+<\(curl
- id: sh-curl-process-sub
  desc: sh <(curl ...) process substitution
  crit: notable
  conf: 0.7
  attack: T1059.004 - '*'
  if:
    type: text
    regex: (^|[^A-Za-z])sh\s+<\(curl
  not:
  - substr: raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash
  - substr: bash <(curl https://raw.githubusercontent.com/rhysd/actionlint
- id: source-curl-process-sub
  desc: source <(curl ...)
  crit: notable
  conf: 0.7
  attack: T1059.004 - '*'
  if:
    type: text
    regex: source\s+<\(curl
- id: source-wget-process-sub
  desc: source <(wget ...)
  crit: notable
  conf: 0.7
  attack: T1059.004 - '*'
  if:
    type: text
    regex: source\s+<\(wget
composite_rules:
- id: fetch-eval
  desc: Remote script fetch and eval
  crit: suspicious
  conf: 0.9
  attack: T1059.004
  for:
  - shell
  - macho
  any:
  - id: eval-curl-subshell
  - id: eval-curl-backtick
  - id: eval-wget-subshell
  - id: eval-wget-backtick
  - id: eval-openssl-subshell
  - id: curl-variable-eval
- id: curl-variable-eval
  desc: curl response variable eval
  crit: suspicious
  conf: 0.97
  attack: T1059.004
  for:
  - shell
  - macho
  any:
  - id: curl-cmd-variable-eval
  - id: curl-script-variable-eval
  - id: curl-payload-variable-eval
- id: process-substitution
  desc: Shell process substitution with remote content
  crit: notable
  conf: 0.85
  attack: T1059.004
  any:
  - id: shell-curl-process-sub
  - id: sh-curl-process-sub
  - id: source-curl-process-sub
  - id: source-wget-process-sub
