# Hidden PowerShell evaluates a remotely supplied instruction; this is the remote script-eval leaf. (general response-evaluation profile)
defaults:
  platforms: [windows]
  for: [powershell]
  crit: hostile
  conf: 0.98
composite_rules:
  - id: powershell-hidden-remote-instruction-launch
    desc: Hidden PowerShell launches a remotely supplied instruction
    attack: T1059.001,T1105,T1564.003
    all:
      - id: micro-behaviors/process/interpreter/eval/direct::powershell-iex-call
      - id: micro-behaviors/communications/http/lib/invoke-webrequest::invoke-webrequest
      - id: micro-behaviors/process/create/hidden::powershell-hidden-window
      - id: micro-behaviors/process/create/exec::start-process-call
    near_lines: 40
  # Legitimate vendor bootstrap cradles (Chocolatey, Scoop) use HTTPS and DNS
  # hostnames. Fetching cleartext HTTP from a raw external IPv4 host via
  # WebClient.DownloadString and passing it to Invoke-Expression is a direct
  # C2 stager cradle.
  - id: powershell-webclient-external-ip-eval
    desc: PowerShell evaluates cleartext WebClient response from IPv4
    attack: T1059.001,T1105
    mbc: B0030,E1059
    near_lines: 20
    all:
      - id: micro-behaviors/communications/http/lib/invoke-webrequest::webclient-downloadstring
      - id: micro-behaviors/communications/http/lib/invoke-webrequest::downloadstring-cleartext-http-url
      - id: micro-behaviors/communications/ip/literal::external-ipv4-url-script
      - id: micro-behaviors/process/interpreter/eval/direct::powershell-iex-call
  - id: powershell-webclient-script-download-cradle
    desc: PowerShell downloads and evaluates remote script
    attack: T1059.001,T1105
    mbc: B0030,E1059
    all:
      - id: micro-behaviors/process/interpreter/eval/direct::powershell-iex-near-downloadstring
      - id: micro-behaviors/communications/http/url/script::executable-url-reference-b
