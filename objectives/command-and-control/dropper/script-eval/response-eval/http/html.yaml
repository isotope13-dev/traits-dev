# Browser pages that fetch a JSON config, decode a URL, and navigate; remote script-eval context. (general response-evaluation profile)
# The GitHub-themed "preparing your download" interstitial is the usual
# wrapper; the fetch/atob/location chain is the loader.
defaults:
  platforms: [windows, unix]
  for: [html, javascript]
  attack: T1105,T1566.002

composite_rules:
  - id: fetch-json-atob-redirect
    desc: Fetched JSON decodes into a redirect
    crit: hostile
    conf: 0.97
    all:
      - id: micro-behaviors/communications/http/request/client::fetch-literal-https-url
      - id: micro-behaviors/data/decode/base64::json-call-atob-proximity
      - id: micro-behaviors/ui/window/navigation::browser-location-href-assign
    near_bytes: 900
