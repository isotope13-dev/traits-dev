defaults:
  platforms:
  - unix
  - windows
  for:
  - javascript
  - typescript
  attack: T1105
  crit: hostile
composite_rules:
- id: node-https-eval-loader
  desc: Node https.request response evaluated
  conf: 0.96
  attack: T1059.007
  mbc: E1105.016
  all:
  - id: micro-behaviors/communications/http/request/client::https-request
  - id: micro-behaviors/metaprogramming/generation::embedded-eval-variable-source
  any:
  - id: metadata/lang/source/syntax/call/relationship::end-handler-eval-pattern
  - id: micro-behaviors/communications/http/request/body/construction::request-write-call
  - id: micro-behaviors/os/sysinfo/platform/runtime::os-platform-call
  unless:
  - id: metadata/package/testing/
  - id: metadata/path::test-directory-component
- id: node-https-php-rc4-decrypt-stager
  desc: HTTPS PHP endpoint response decrypted with RC4
  conf: 0.97
  attack: T1105,T1573,T1071.001
  mbc: B0024,C0027
  scope: file
  near_lines: 80
  all:
  - id: micro-behaviors/communications/http/request/verb::post-method-text
  - id: micro-behaviors/communications/http/request/body/construction::node-http-request-stream-body
  - id: micro-behaviors/communications/http/url/php-endpoint::url-php-endpoint-script
  - id: micro-behaviors/crypto/symmetric/stream/rc4::js-rc4-two-arg-call
  unless:
  - id: metadata/package/testing/
  - id: metadata/path::test-directory-component
