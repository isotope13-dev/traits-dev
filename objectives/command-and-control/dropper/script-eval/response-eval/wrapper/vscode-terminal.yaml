# Remote terminal-supplied evaluation; grouped under the remote script-eval mechanism. (general response-evaluation profile)
defaults:
  for: [javascript]
  platforms: [windows]

composite_rules:
  - id: vscode-hidden-terminal-remote-eval
    desc: Concealed terminal remote-evaluation attempt
    crit: hostile
    conf: 0.99
    attack: T1059.001,T1564.003,T1105
    all:
      - id: metadata/import/builtin::const-vscode-require-binding
      - id: micro-behaviors/process/create/shell/terminal::terminal-hidden-powershell-eval-submit
