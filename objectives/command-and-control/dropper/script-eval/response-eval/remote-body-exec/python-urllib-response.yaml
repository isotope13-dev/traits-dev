# The atomic pattern directly nests urlopen(...).read() inside exec(...); this is remote script evaluation. (general response-evaluation profile)
# Its stricter composite retains the setuptools bootstrap exclusion.
defaults:
  platforms: [windows, unix]
  for: [python]
  attack: T1105,T1059.006
  mbc: B0030

traits:
  - id: python-urllib-response-exec
    desc: Python execs urllib response
    crit: suspicious
    conf: 0.98
    if:
      type: text
      regex: '(?is)exec\s*\(\s*[A-Za-z0-9_.]{0,50}urlopen\s*\([^)]{0,120}\)\.read\s*\(\s*\)'

composite_rules:
  - id: python-urllib-remote-exec
    desc: Python executes a remote urllib stage
    crit: hostile
    conf: 0.99
    all:
      - id: micro-behaviors/communications/http/lib/urllib::urlopen-response-body-read
      - id: python-urllib-response-exec
    unless:
      - id: well-known/lib/development/setuptools-bootstrap::ez-setup-bootstrap-url
