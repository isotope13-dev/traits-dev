defaults:
  platforms:
  - windows
  - unix
  for:
  - python
traits:
- id: exec-get-text
  desc: exec() on HTTP response .text
  crit: suspicious
  conf: 0.95
  attack: T1105
  mbc: E1059
  if:
    type: text
    regex: exec\s*\(.{0,50}\.get\s*\(.{0,50}\)\.text\s*\)
  unless:
  - id: well-known/tool/detection/agentskillmap/
- id: exec-get-content
  desc: exec() on HTTP response .content
  crit: suspicious
  conf: 0.95
  attack: T1105
  mbc: E1059
  if:
    type: text
    regex: exec\s*\(.{0,50}\.get\s*\(.{0,50}\)\.content\s*\)
  unless:
  - id: well-known/tool/detection/agentskillmap/
- id: eval-get-text
  desc: eval() on HTTP response .text
  crit: suspicious
  conf: 0.95
  attack: T1105
  mbc: E1059
  if:
    type: text
    regex: eval\s*\(.{0,50}\.get\s*\(.{0,50}\)\.text\s*\)
  unless:
  - id: well-known/tool/detection/agentskillmap/
- id: urllib-module-code-read
  desc: urllib response assigned module code
  crit: notable
  conf: 0.92
  size_max: 120000
  if:
    type: text
    regex: \bmodule_code\s*=\s*[A-Za-z_][A-Za-z0-9_]*\.read\(\)\.decode\(
- id: exec-module-code
  desc: exec called on module code
  crit: notable
  conf: 0.94
  if:
    type: text
    regex: \bexec\s*\(\s*module_code\s*,
- id: connexion-schema-resolver
  desc: Connexion OpenAPI schema resolver
  crit: notable
  conf: 0.95
  if:
    type: path
    regex: (^|[\\/])connexion[\\/]json_schema\.py$
composite_rules:
- id: remote-transform-service-code-execution
  for:
  - python
  - whl
  - python-sdist
  desc: Executes code obtained from a remote encode or decode service
  crit: hostile
  conf: 0.99
  attack: T1105,T1059.006,T1027
  mbc: B0024,B0032
  scope: archive
  all:
  - id: micro-behaviors/communications/http/post::requests-post
  - id: micro-behaviors/communications/http/url/domain::workers-dev-domain
  - id: micro-behaviors/communications/http/url/path::code-transform-endpoint-path
  - id: micro-behaviors/communications/http/lib/requests::response-json-code-field
  - id: micro-behaviors/process/interpreter/eval/direct::exec-variable
- id: urllib-module-code-exec
  desc: urllib-fetched Python module execution
  crit: hostile
  conf: 0.98
  attack: T1105, T1059.006
  mbc: B0024, B0032
  all:
  - id: micro-behaviors/communications/http/lib/urllib::urllib-urlopen-call
  - id: urllib-module-code-read
  - id: exec-module-code
  - id: micro-behaviors/communications/http/url/path::module-py-url-path
  any:
  - id: micro-behaviors/communications/socket/ssl::tls-validation-fully-disabled
  - id: micro-behaviors/data/parse/json::json-loads-call
  - id: micro-behaviors/data/decode/base64::b64decode-call
- id: obfuscated-remote-exec
  desc: Executes code from obfuscated URL
  crit: hostile
  conf: 0.99
  attack: T1105
  mbc: B0024
  any:
  - id: exec-get-text
  - id: exec-get-content
  - id: eval-get-text
  all:
  - id: micro-behaviors/process/interpreter/eval/direct::exec-builtin
  - id: objectives/anti-static/obfuscation/string/encoding::join-chr-comprehension
- id: bitshift-obfuscated-exec
  desc: Executes code with bitshift-obfuscated URL
  crit: hostile
  conf: 0.98
  attack: T1105
  mbc: B0024
  any:
  - id: exec-get-text
  - id: exec-get-content
  - id: eval-get-text
  all:
  - id: micro-behaviors/data/arithmetic::bitshift-array
  - id: objectives/anti-static/obfuscation/string/encoding::join-chr-comprehension
- id: remote-yaml-deserialization
  desc: Remote YAML body parsed with unsafe loader (RCE)
  crit: hostile
  conf: 0.95
  attack: T1203
  mbc: B0024
  all:
  - id: micro-behaviors/data/serialize/yaml::yaml-load-network-response
  any:
  - id: micro-behaviors/data/serialize/yaml::yaml-loader-unsafe
  - id: micro-behaviors/data/serialize/yaml::yaml-unsafe-load
  unless:
  - id: well-known/lib/ai/unsloth::unsloth-package-context
  - id: well-known/tool/detection/security-scanner::code-pattern-catalog
  - id: well-known/tool/detection/pattern-catalog::python-taint-sink-map
- id: yaml-load-near-http-fetch
  desc: Parses remote YAML with unsafe loader
  crit: suspicious
  conf: 0.9
  attack: T1203
  near_lines: 10
  all:
  - id: micro-behaviors/communications/http/request/client::request-python
  any:
  - id: micro-behaviors/data/serialize/yaml::yaml-loader-unsafe
  - id: micro-behaviors/data/serialize/yaml::yaml-unsafe-load
  unless:
  - id: well-known/lib/ai/unsloth::unsloth-package-context
  - id: well-known/tool/detection/security-scanner::code-pattern-catalog
  - id: well-known/tool/detection/pattern-catalog::python-taint-sink-map
- id: urllib-encoded-pythonw-remote-loader
  desc: urllib remote code execution staged through an encoded pythonw loader
  crit: hostile
  conf: 0.99
  attack: T1027,T1105,T1059.006
  mbc: B0032,B0024
  all:
  - id: micro-behaviors/process/deploy::python-urllib-response-exec
  - id: objectives/anti-static/obfuscation/encoding/content::encoded-python-exec
  - id: objectives/anti-static/obfuscation/eval/scripting/host::pythonw-exe-replace-trick
  unless:
  - id: metadata/signed/platform/
  - id: metadata/package/testing/
  - id: "metadata/file/naming::test-directory-component"
- id: init-urlopen-exec-stage
  desc: Import-time exec of a urlopen download
  crit: hostile
  conf: 0.97
  attack: T1105,T1059.006
  mbc: B0024,E1059
  all:
  - id: metadata/file/size::init-py-file
  - id: micro-behaviors/process/deploy::urlopen-before-exec
  - id: micro-behaviors/data/control-flow/error-handling::silent-exception-pass
- id: init-direct-ip-urlopen-exec
  desc: Import-time exec from a literal IP URL
  crit: hostile
  conf: 0.97
  attack: T1105,T1059.006
  mbc: B0024,E1059
  all:
  - id: metadata/file/size::init-py-file
  - id: micro-behaviors/communications/http/lib/urllib::urllib-urlopen-call
  - id: micro-behaviors/process/interpreter/eval/direct::exec-variable
  - id: micro-behaviors/communications/ip/literal::external-ipv4-http-url
- id: init-alt-port-urlopen-exec
  desc: Import-time exec from an alternate HTTP port
  crit: hostile
  conf: 0.96
  attack: T1105,T1059.006
  all:
  - id: micro-behaviors/process/deploy::urlopen-before-exec
  - id: micro-behaviors/communications/http/url/port::http-alt-port-8080
  - id: micro-behaviors/data/control-flow/error-handling::silent-exception-pass
- id: exec-subprocess-getoutput
  desc: exec() runs command output as Python
  crit: hostile
  conf: 0.97
  attack: T1059.006,T1105
  near_bytes: 512
  all:
  - id: micro-behaviors/process/interpreter/eval/direct::exec-builtin
  - id: micro-behaviors/process/create/shell/lang::getoutput-content
