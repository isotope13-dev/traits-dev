# Requires shared awaited source, XOR decoding, HTTP, eval and a hidden child.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  attack: T1105,T1059.007,T1027
  mbc: B0032
composite_rules:
  - id: fetch-xor-eval-detached-spawn-stage
    desc: Concealed HTTP stage feeds eval and child
    crit: hostile
    conf: 0.97
    near_bytes: 12000

    all:
      - id: micro-behaviors/process/create/eval::awaited-source-eval-and-child-reuse
      - id: micro-behaviors/communications/http/request/client::http-request-func
      - id: micro-behaviors/crypto/symmetric/xor/loop::xor-modulo-key-loop
      - id: micro-behaviors/process/interpreter/eval/direct::js-eval-raw
      - id: micro-behaviors/process/daemonize/detach::detached-obfuscated-true
      - id: micro-behaviors/process/create/spawn::windowshide-obfuscated-true
