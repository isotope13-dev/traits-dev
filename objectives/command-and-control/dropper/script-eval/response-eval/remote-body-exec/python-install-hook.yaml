# Packaging trigger with a required remote-response evaluation sink.
# Kept in the admitted script-eval leaf during the payload taxonomy migration.
defaults:
  platforms: [unix, windows]
  for: [python]
  attack: T1059.006,T1105
composite_rules:
  # Network access alone is ordinary packaging. Require evaluation of a
  # response body before describing a downloaded payload.
  - id: install-hook-remote-response-eval
    desc: Build/install hook with remote code evaluation
    crit: suspicious
    conf: 0.95
    near_bytes: 4096
    all:
      - id: metadata/build/package/recipe/setup-hooks::cmdclass-install-phase-override
    any:
      - id: micro-behaviors/process/deploy::python-urllib-response-exec
      - id: objectives/command-and-control/dropper/script-eval/response-eval/remote-body-exec::exec-get-text
      - id: objectives/command-and-control/dropper/script-eval/response-eval/remote-body-exec::exec-get-content
      - id: objectives/command-and-control/dropper/script-eval/response-eval/remote-body-exec::eval-get-text
