# One-shot response evaluation is a loader, not evidence of ongoing C2.
# Suspicious rather than hostile: the pattern also occurs in demonstrators.
defaults:
  platforms: [windows]
  for: [batch, powershell, javascript, html]
  attack: T1105,T1059.003
  mbc: B0030
composite_rules:
  - id: finger-output-command-execution
    desc: Finger output variable becomes a command
    crit: suspicious
    conf: 0.96
    near_lines: 1
    all:
      - id: micro-behaviors/communications/socket/tcp::for-f-finger-command-output
      - id: micro-behaviors/process/create/shell/command-mode::finger-input-variable-command
  - id: finger-output-piped-to-cmd
    desc: Finger response is evaluated by cmd
    crit: suspicious
    conf: 0.96
    all:
      - id: micro-behaviors/communications/socket/tcp::finger-output-cmd-pipeline
      - id: micro-behaviors/communications/socket/tcp::finger-command-query
  - id: clickfix-finger-lolbin-command
    desc: Verification lure runs Finger-delivered commands
    crit: hostile
    conf: 0.99
    near_bytes: 1600
    all:
      - id: finger-output-command-execution
    any:
      - id: objectives/execution/lure/clipboard/instruction::verify-human-echo-prompt
      - id: objectives/execution/lure/clipboard/page::clickfix-clipboard-finger-remote-query
