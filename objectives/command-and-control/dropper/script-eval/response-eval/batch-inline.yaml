# Remote script retrieval and evaluation; grouped under the remote script-eval mechanism. (general response-evaluation profile)
defaults:
  platforms: [windows]
  for: [batch]

traits:
- id: batch-powershell-long-irm-iex
  desc: Batch PowerShell command reaches irm
  crit: notable
  conf: 0.93
  attack: T1059.001
  if:
    type: text
    regex: '(?i)powershell\b.{0,500}\birm\b[^\r\n|]{0,240}\|\s*iex\b'
- id: batch-python-remote-base64-exec
  desc: Batch Python fetches base64
  crit: suspicious
  conf: 0.96
  attack: T1059.006
  if:
    type: text
    regex: '(?i)requests,base64;\s*exec\(base64\.b64decode\(requests\.get\('
- id: batch-python-remote-base64-exec-bytes
  desc: Batch Python executes base64 bytes
  crit: suspicious
  conf: 0.96
  attack: T1059.006
  if:
    type: hex
    pattern: "72 65 71 75 65 73 74 73 2c 62 61 73 65 36 34 3b 20 65 78 65 63 28 62 61 73 65 36 34 2e 62 36 34 64 65 63 6f 64 65 28 72 65 71 75 65 73 74 73 2e 67 65 74 28"
