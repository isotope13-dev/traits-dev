    desc: Contract lookup with staged Base64 module
    crit: hostile
    conf: 0.99
    attack: T1105,T1059.007
    near_bytes: 2048
    all:
      - id: micro-behaviors/communications/http/url/rpc::eth-call-fetch-hex-decode
      - id: micro-behaviors/communications/http/request/json::fetch-call-near-json-parse
      - id: micro-behaviors/fs/temp/directory::node-mkdtemp-os-tmpdir
      - id: micro-behaviors/fs/write/file/full::node-write-base64-decoded-data
      - id: micro-behaviors/process/create/load/script::dynamic-base64-data-module-import
