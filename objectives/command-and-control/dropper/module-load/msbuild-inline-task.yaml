# MSBuild inline-task dropper (.csproj / .xml LOLBAS).
#
# `<UsingTask TaskFactory="CodeTaskFactory">` with an embedded `<Code
# Language="cs">...</Code>` block tells msbuild.exe to compile and execute the
# enclosed C# code — a well-known living-off-the-land pattern (ATT&CK
# T1127.001, Trusted Developer Utilities Proxy Execution: MSBuild). The
# .csproj / .xml file itself IS the stager; msbuild acts as the loader.
#
# Atoms here query the parsed XML (kv paths rooted at `Project.*`) plus the
# embedded C# source text to surface common dropper behaviors.
defaults:
  platforms: [windows]
  for: [xml]
  attack: T1127.001

traits:
- id: msbuild-code-download-string
  desc: MSBuild inline-code download token
  crit: notable
  conf: 0.9
  if:
    # This trait is specifically evidence from an inline task body. A normal
    # MSBuild DownloadFile task is a build-time fetch, not inline code.
    type: value
    path: Project.UsingTask.Task.Code
    regex: '\bDownload(String|Data|File)\b'

- id: msbuild-code-marshal-delegate
  desc: MSBuild inline-code delegate token
  crit: notable
  conf: 0.9
  if:
    type: text
    regex: '\bMarshal\.GetDelegateForFunctionPointer\b'

- id: msbuild-code-reflection-invoke
  desc: MSBuild inline-code reflection token
  crit: notable
  conf: 0.85
  if:
    type: text
    regex: '\bAssembly\.Load\b|\bAssembly\.Reflection'

- id: msbuild-build-packaging-freeswitch
  desc: FreeSWITCH build cache token
  crit: notable
  conf: 0.85
  if:
    type: text
    regex: '\b(FreeSWITCHBuildCachePath|7za1701\.exe)\b'

- id: msbuild-code-webclient-in-code-block
  desc: MSBuild code block references WebClient
  crit: notable
  conf: 0.9
  if:
    type: text
    regex: '(?i)<Code.{0,80}>.{0,512}\bWebClient\b'
- id: msbuild-code-httpclient-in-code-block
  desc: MSBuild code block references HttpClient
  crit: notable
  conf: 0.9
  if:
    type: text
    regex: '(?i)<Code.{0,80}>.{0,512}\bHttpClient\b'
- id: msbuild-build-packaging-task-name--buildpackagestask
  desc: MSBuild custom packaging (BuildPackagesTask)
  crit: notable
  conf: 0.85
  if:
    type: text
    word: BuildPackagesTask
- id: msbuild-build-packaging-task-name--downloadpackagetask
  desc: MSBuild custom packaging (DownloadPackageTask)
  crit: notable
  conf: 0.85
  if:
    type: text
    word: DownloadPackageTask
composite_rules:
- id: msbuild-code-webclient
  desc: MSBuild inline-code WebClient token
  crit: component
  conf: 0.9
  any:
  - id: msbuild-code-webclient-in-code-block
  - id: msbuild-code-httpclient-in-code-block
- id: msbuild-build-packaging-task-name
  desc: MSBuild custom packaging task name
  crit: notable
  conf: 0.85
  any:
  - id: msbuild-build-packaging-task-name--buildpackagestask
  - id: msbuild-build-packaging-task-name--downloadpackagetask
- id: msbuild-build-packaging-fs-helper
  desc: MSBuild filesystem packaging helper
  crit: notable
  conf: 0.85
  all:
  - id: metadata/build/manifest::msbuild-project-root
  any:
  - id: micro-behaviors/data/archive/create/zip::dotnet-create-from-directory
  - id: metadata/lang/source/naming/function::copy-files-recursively-token
- id: msbuild-inline-dropper
  desc: MSBuild inline task downloads and runs
  crit: hostile
  conf: 0.95
  all:
  - id: metadata/build/manifest::msbuild-inline-task-declaration
  - id: msbuild-code-webclient
  any:
  - id: msbuild-code-download-string
  - id: metadata/lang/source/naming/function::xml-process-start-api-text
  # Preserve exclusions formerly inherited through msbuild-inline-task.
  unless:
  - id: well-known/lib/runtime/scripted/python-runtime::cpython-msbuild-source-property
  - id: well-known/tool/sysadmin/oneget::oneget-msbuild-build-context
  - id: metadata/package/manager::nuget-restore-targets
  - id: well-known/app/finance/bitcoin-core::bitcoin-core-msbuild-context
  - id: well-known/lib/network/applicationinsights::dotnet-msbuild-context

# Early-bird APC injection staged through an MSBuild inline task: shellcode is
# written into a sacrificial process and queued as an APC. The QueueUserAPC +
# WriteProcessMemory combination inside build-time code has no legitimate
# build use. Those two legs reuse the canonical micro-behavior text atoms,
# whose scopes cover xml; the task leg is the msbuild-local composite above.
- id: msbuild-early-bird-apc-injection
  desc: MSBuild inline task stages early-bird APC injection
  crit: hostile
  conf: 0.96
  all:
  - id: metadata/build/manifest::msbuild-inline-task-declaration
  - id: micro-behaviors/os/callback/apc::queue-user-apc
  - id: micro-behaviors/mem/write/arbitrary::write-process-memory-text
  unless:
  - id: well-known/lib/runtime/scripted/python-runtime::cpython-msbuild-source-property
  - id: well-known/tool/sysadmin/oneget::oneget-msbuild-build-context
  # Visual Studio's .nuget/NuGet.targets bootstrap: a real inline-code task
  # that downloads nuget.exe from nuget.org, vendored into a very large
  # number of source trees.
  - id: metadata/package/manager::nuget-restore-targets
  - id: well-known/app/finance/bitcoin-core::bitcoin-core-msbuild-context
  - id: well-known/lib/network/applicationinsights::dotnet-msbuild-context
