defaults:
  platforms: [windows]
  for: [powershell]
composite_rules:
  - id: powershell-download-reverse-decode-assembly-profile
    desc: Downloader combines reverse slicing and assembly loading
    crit: suspicious
    conf: 0.96
    attack: T1105,T1140,T1620
    near_bytes: 2048
    # Operations co-occur nearby; this does not bind downloaded bytes to
    # the reversal, decoder, or assembly argument.
    all:
      - id: micro-behaviors/communications/http/client/managed::downloadstring
      - id: micro-behaviors/data/collection/array::powershell-descending-index-slice
      - id: micro-behaviors/data/decode/base64::powershell-frombase64string
      - id: micro-behaviors/process/interpreter/runtime/clr::powershell-assembly-load
      - id: micro-behaviors/metaprogramming/reflection/inspect/class::powershell-assembly-method-invoke
