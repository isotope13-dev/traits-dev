defaults:
  platforms:
  - windows
  for:
  - powershell
  attack: T1027.002,T1620
  mbc: E1027.014
composite_rules:
- id: powershell-inmemory-reflective-dotnet-loader
  desc: PowerShell loads staged .NET assembly
  crit: hostile
  conf: 0.97
  all:
  - id: micro-behaviors/mem/copy::marshal-copy-powershell
  - id: micro-behaviors/process/interpreter/runtime/clr::powershell-assembly-load-call
  any:
  - id: micro-behaviors/process/interpreter/reflection/runtime::powershell-assembly-method-invoke
  - id: micro-behaviors/process/interpreter/reflection/runtime::powershell-entrypoint-then-invoke
  needs: 1
  unless:
  - id: well-known/tool/development
  - id: well-known/dual-use/remote-admin/
