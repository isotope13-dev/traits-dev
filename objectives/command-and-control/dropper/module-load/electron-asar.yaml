composite_rules:
  - id: electron-aes-sidecar-module-compile
    desc: AES sidecar loaded through Module._compile
    crit: hostile
    conf: 0.99
    attack: T1027.013,T1059.007,T1140
    mbc: B0022
    platforms: [windows]
    for: [javascript, pe, asar]
    scope: outer
    near_bytes: 1024
    all:
      - id: micro-behaviors/crypto/symmetric/decrypt::createDecipheriv
      - id: micro-behaviors/crypto/symmetric/aes/runtime-library::aes-256-cbc
      - id: micro-behaviors/fs/read/file/full::readfilesync-call
      - id: micro-behaviors/data/decode/hex::buffer-from-hex-string
      - id: micro-behaviors/process/interpreter/eval/compile::module-compile-marker
      - id: micro-behaviors/os/module/require::node-module-builtin-require
    unless:
      - id: metadata/package/testing/
      - id: well-known/tool/detection/security-scanner/
      - id: "metadata/file/naming::test-directory-component"
