defaults:
  platforms: [windows]
  for: [pe]
  attack: T1620
  mbc: E1059
composite_rules:
  - id: dotnet-hex-xor-payload-loader
    desc: .NET XOR-decoded payload loaded as an assembly
    crit: suspicious
    conf: 0.90
    all:
      - id: metadata/binary/framework::dotnet-assembly
      - id: micro-behaviors/data/decode/hex::dotnet-stringbuilder-hex-decoding-references
      - id: micro-behaviors/crypto/symmetric/xor/term::dotnet-xor-key-context
    any:
      - id: micro-behaviors/process/interpreter/reflection/resolve::assembly-load-text
    unless:
      - id: well-known/app/media/subtitleedit/
