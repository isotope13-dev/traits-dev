defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
  attack: T1027
  mbc: C0025

composite_rules:
- id: node-local-file-decrypt-dynamic-load
  desc: Decrypts local file into loaded Node module
  crit: suspicious
  conf: 0.96
  attack: T1027.013,T1059.007,T1140
  mbc: B0024,B0032
  near_bytes: 4096
  all:
  - id: micro-behaviors/data/decode/base64::buffer-from-base64
  - id: micro-behaviors/crypto/library/provider::node-memory-hard-kdf
  - id: micro-behaviors/crypto/symmetric/decrypt::createDecipheriv
  - id: micro-behaviors/crypto/symmetric/aes/runtime-library::aes-256-gcm-dash
  - id: micro-behaviors/crypto/symmetric/aes/runtime-library::set-auth-tag
  - id: micro-behaviors/fs/read/file/full::readfilesync-call
  - id: micro-behaviors/fs/write/file/full::node-write-file-sync-call
  - id: micro-behaviors/os/module/dynamic-load::node-dynamic-require-call
  unless:
  - id: well-known/tool/detection/
