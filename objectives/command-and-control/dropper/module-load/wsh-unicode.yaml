composite_rules:
- id: wsh-unicode-padded-hidden-wmi-reflective-loader
  desc: Unicode-padded WSH loader launches a reflective payload through hidden WMI
  crit: hostile
  conf: 0.995
  all:
  - id: micro-behaviors/process/create/hidden::wmi-hidden-four-argument-process-create
  - id: micro-behaviors/os/com/automation::wscript-shell-activex-constructor
  - id: objectives/anti-static/obfuscation/steganography/unicode::unicode-delimited-managed-loader-tokens
  attack: T1027,T1047,T1059.001,T1140,T1620

- id: js-unicode-delimited-hidden-appdomain-loader
  desc: Unicode-delimited AppDomain loader executes through hidden WMI
  crit: hostile
  conf: 0.995
  attack: T1027.002,T1047,T1059.001,T1140,T1564.003,T1620
  all:
  - id: objectives/anti-static/obfuscation/steganography/unicode::js-unicode-delimited-appdomain-fragment
  - id: objectives/anti-static/obfuscation/steganography/unicode::js-unicode-delimited-base64-fragment
  - id: micro-behaviors/process/create/hidden::wmi-hidden-four-argument-process-create
  near_bytes: 65536
traits: []
defaults:
  platforms:
  - windows
  for:
  - javascript
