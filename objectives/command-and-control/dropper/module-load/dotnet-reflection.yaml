# Decrypted .NET assemblies activated through reflection use the module-load sink.
defaults:
  platforms: [windows]
  for: [pe]
  attack: T1620
  mbc: E1059
composite_rules:
  - id: dotnet-encrypted-reflection-loader
    desc: Encrypted .NET reflection loader
    crit: hostile
    conf: 0.97
    all:
      - id: metadata/binary/framework::dotnet-assembly
      - id: objectives/command-and-control/dropper/staging/encrypted::dotnet-decryptdata-method
      - id: micro-behaviors/crypto/symmetric/aes/library::dotnet-rijndael-any
      - id: micro-behaviors/process/interpreter/reflection/runtime::invoke-member-token
    any:
      - id: objectives/anti-static/obfuscation/reflection/invoke::get-exported-types-token
      - id: micro-behaviors/process/interpreter/reflection/runtime::get-methods-token
      - id: objectives/anti-static/obfuscation/reflection/class::dotnet-assembly-load
      - id: micro-behaviors/data/encode/base64::dotnet-to-base64string
    needs: 2
    unless:
      - id: metadata/signed/platform/
      - id: metadata/lang/compiler/managed/
      # A self-contained single-file publish bundles the whole BCL (AES/Rijndael
      # type names, reflection InvokeMember, GetExportedTypes, Convert.ToBase64String)
      # as metadata string tables inside the native host stub -- that is the
      # runtime library's own API surface, not application code chaining decrypt
      # and reflective invoke.
      - id: metadata/binary/framework::dotnet-singlefilehost-runtime
