defaults:
  crit: hostile
  platforms: [unix, windows]
  for: [javascript, typescript]
  attack: T1027.013
  mbc: B0024

# A multi-megabyte ciphertext literal on globalThis keeps createDecipheriv
# and _compile out of symbol facts, but the assignment, the globalThis
# decrypt lookup, and the computed Module invocation still co-locate in text.
composite_rules:
  - id: global-ciphertext-module-compile-loader
    desc: Decrypts globalThis ciphertext into Module._compile
    conf: 0.98
    attack: T1027.013,T1059.007,T1195.002
    all:
      - id: metadata/file/encoded::globalthis-string-ciphertext-assignment
      - id: micro-behaviors/data/control-flow/dispatch::globalthis-computed-property-call
      - id: micro-behaviors/process/interpreter/eval/compile::node-new-module-computed-invocation
    unless:
      - id: metadata/package/testing/harness/runtime/
