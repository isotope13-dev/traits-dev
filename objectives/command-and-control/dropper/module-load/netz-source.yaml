defaults:
  platforms:
  - windows
  for:
  - csharp
composite_rules:
- id: dotnet-netz-resource-assembly-invoke
  desc: Netz resource assembly load and invoke
  crit: suspicious
  conf: 0.98
  all:
  - id: micro-behaviors/process/interpreter/runtime/clr::assembly-load-from-bytes
  - id: micro-behaviors/process/interpreter/runtime/clr::entrypoint-invoke
  - id: micro-behaviors/process/interpreter/runtime/clr::invoke-embedded-app
  any:
  - id: micro-behaviors/data/decompress/zlib::sharpziplib-inflaterinputstream
  - id: micro-behaviors/data/embedded/payload/resource::netz-resource-loader-primitives
- id: dotnet-netz-resource-loader-with-fallback
  desc: Netz resource load with fallback clues
  crit: suspicious
  conf: 0.99
  all:
  - id: objectives/command-and-control/dropper/module-load::dotnet-netz-resource-assembly-invoke
  - id: micro-behaviors/data/embedded/payload/resource::netz-resource-loader-primitives
  any:
  - id: micro-behaviors/data/embedded/payload/resource::netz-dll-probe-fallback
  - id: micro-behaviors/data/decompress/zlib::sharpziplib-inflaterinputstream
