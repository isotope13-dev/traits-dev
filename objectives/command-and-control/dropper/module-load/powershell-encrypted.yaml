# Completed encrypted payload chain classified by its activation sink.
defaults:
  # Batch droppers often embed the AES stage as a PowerShell here-string /
  # labeled region; keep these atoms on both so invoice/Rechnung-style
  # multi-stage bats are not invisible to encrypted-stage composites.
  for: [powershell, batch]
  platforms: [windows]
  attack: T1027
  mbc: C0025

composite_rules:
- id: ps-encrypted-gzip-managed-memory-loader
  desc: PowerShell decrypts and reflectively loads a compressed assembly
  crit: hostile
  conf: 0.99
  attack: T1027,T1140,T1620
  mbc: C0025,B0024
  for: [powershell]
  all:
  - id: micro-behaviors/crypto/decrypt::powershell-base64-decryption-cooccurrence
  - id: micro-behaviors/data/decompress/gzip::gzip-decompression-stream
  - id: micro-behaviors/process/interpreter/reflection/resolve::powershell-assembly-load
  - id: metadata/file/line::very-long-source-line

# A remote byte array that is decrypted by a hand-written stream cipher and
# passed directly to AppDomain.Load is a fileless managed stage, independent
# of the endpoint, key, or variable names used by the loader.
- id: ps-remote-rc4-appdomain-loader
  desc: PowerShell remotely stages an RC4-decrypted .NET assembly
  crit: hostile
  conf: 0.99
  attack: T1105,T1140,T1620
  mbc: B0030,B0024
  for: [powershell]
  all:
    - id: micro-behaviors/communications/http/client/webclient::webclient-download-data
    - id: micro-behaviors/crypto/symmetric/stream/rc4::source-rc4-managed-implementation
    - id: micro-behaviors/process/interpreter/reflection/runtime::powershell-appdomain-currentdomain-load
