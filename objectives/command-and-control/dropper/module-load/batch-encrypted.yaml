defaults:
  platforms: [windows]
  for: [batch]
composite_rules:
- id: batch-aes-gzip-reflective-entrypoint
  desc: Encrypted batch loads .NET entry point
  crit: hostile
  conf: 0.99
  all:
  - id: micro-behaviors/crypto/symmetric/aes/initialize::dotnet-aes-create
  - id: micro-behaviors/data/decompress/gzip::gzip-decompression-stream
  - id: micro-behaviors/metaprogramming/reflection/resolve::dotnet-assembly-type-reference
  - id: micro-behaviors/metaprogramming/reflection/invoke::batch-obfuscated-entrypoint-name
  - id: micro-behaviors/metaprogramming/reflection/invoke::batch-null-reflection-invocation
