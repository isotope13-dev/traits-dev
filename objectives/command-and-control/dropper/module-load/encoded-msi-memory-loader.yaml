defaults:
  for: [msi, oledoc, powershell]
  platforms: [windows]
composite_rules:
  - id: encoded-msi-powershell-native-memory-loader
    desc: Encoded MSI script maps native code into memory
    crit: hostile
    conf: 0.98
    scope: outer
    attack: T1620,T1027
    all:
      - id: objectives/anti-static/obfuscation/string/numeric::powershell-nibble-table-script-dispatch
      - id: micro-behaviors/os/com/installer::powershell-msi-record-read-stream
      - id: objectives/evasion/process/injection/memory::powershell-native-memory-entry-thread
