defaults:
  crit: hostile
  platforms: [unix, windows]
  for: [javascript, typescript]
  attack: T1105
  mbc: B0024

composite_rules:
  - id: node-remote-archive-execute
    desc: Node remote archive download and execute
    conf: 0.99
    scope: file
    attack: "T1105,T1059.007"
    all:
      - id: micro-behaviors/communications/http/request/client::node-scheme-selected-http-client
      - id: micro-behaviors/fs/write/file/full::node-write-file-sync
      - id: micro-behaviors/data/archive/extract/tar::gzip-extract-strip-one-component
      - id: micro-behaviors/process/create/shell/bridge::execSync-call
      - id: micro-behaviors/os/module/dynamic-load::node-variable-require-call

