# GitHub Raw image-suffix references used in staged assembly-load chains.
defaults:
  platforms: [windows]
  for: [powershell]
  attack: T1102.001,T1027.003
  mbc: C0002,E1027

composite_rules:
  - id: ps-github-image-rc4-assembly-load
    desc: Image-named GitHub payload reflectively loaded
    crit: hostile
    conf: 0.99
    attack: T1102.001,T1027.003,T1620
    all:
      - id: micro-behaviors/communications/http/url/github::raw-githubusercontent-image-suffix
      - id: micro-behaviors/process/interpreter/reflection/resolve::powershell-assembly-load
      - id: micro-behaviors/communications/http/lib/invoke-webrequest::webclient-download
    near_bytes: 4096
