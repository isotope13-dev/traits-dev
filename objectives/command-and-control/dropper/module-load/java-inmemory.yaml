defaults:
  platforms: [windows, unix]
  for: [jar, class]

composite_rules:
  # A jar that streams a remote archive over HttpURLConnection, walks
  # its entries with JarInputStream, defines classes from the bytes in
  # memory and invokes an entry point reflectively never writes the
  # second stage to disk: the remote jar is the payload.
  - id: java-remote-jar-inmemory-classload
    desc: Java loads and defines classes from a remote jar in memory
    crit: hostile
    conf: 0.97
    attack: T1105,T1620
    scope: archive
    all:
      - id: micro-behaviors/communications/http/lib/urlconnection::jvm-http-urlconnection-inputstream
      - id: micro-behaviors/data/archive/library::jarinputstream-entry-iteration
      - id: micro-behaviors/process/interpreter/runtime/jvm::java-defineclass-name-constant
      - id: micro-behaviors/process/interpreter/runtime/jvm::java-loadclass
      - id: micro-behaviors/metaprogramming/reflection::java-method-invoke-bytecode
