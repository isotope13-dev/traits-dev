defaults:
  for: [batch]
  platforms: [windows]
  attack: T1059.001

traits:
  - id: powershell-char-array-stage
    desc: PowerShell char array stage
    crit: suspicious
    conf: 0.9
    if:
      type: text
      substr: '[char[]]('

  - id: powershell-char-array-join
    desc: PowerShell char array string reconstruction
    crit: suspicious
    conf: 0.9
    if:
      type: text
      regex: '(?i)\[char\[\]\]\([0-9,\s]{80,}\)\s*-join'

  - id: powershell-empty-join
    desc: PowerShell empty-string join reconstruction
    crit: suspicious
    conf: 0.84
    unless:
      - id: metadata/package/manager::maven-wrapper-script
    if:
      type: text
      # Anchor to a batch PowerShell command; support one caret continuation.
      regex: '(?im)^[ \t]*@?(powershell|pwsh)(\.exe)?.{0,128}(\^[ \t]*\r?\n.{0,128})?-join\s*(''''|"")'

  - id: decoded-scriptblock-create
    desc: Decoded PowerShell ScriptBlock.Create
    crit: suspicious
    conf: 0.94
    if:
      type: encoded
      encoding: script
      substr: '[ScriptBlock]::Create'

  - id: decoded-webclient-downloadstring
    desc: Decoded WebClient DownloadString
    crit: suspicious
    conf: 0.94
    attack: T1105
    if:
      type: encoded
      encoding: script
      regex: 'Net\.WebClient.{0,80}DownloadString'

  - id: powershell-iex-variable
    desc: PowerShell iex variable call
    crit: suspicious
    conf: 0.9
    if:
      type: text
      regex: '(?i)\biex\s*\(\s*\$[A-Za-z_]\w*\s*\)'

  # `[char]($byte -bxor $key[$i])` appended in a loop: each blob byte is XORed
  # with a repeating key and turned into a character, which is how a
  # PowerShell stage rebuilds its script text at run time.
  - id: powershell-xor-char-decode-loop
    desc: PowerShell XOR-decodes bytes into characters
    crit: suspicious
    conf: 0.93
    attack: T1140,T1027
    for: [batch, powershell]
    if:
      type: text
      regex: '(?i)\[char\]\(\$\w+\s*-bxor\s*\$\w+\[\$\w+\]\)'

  # `iex` spelled as character codes so the cmdlet name never appears in the
  # script: `&([char[]](105,101,120)-join '')`.
  - id: powershell-iex-char-codes
    desc: PowerShell iex spelled with character codes
    crit: suspicious
    conf: 0.95
    attack: T1027
    for: [batch, powershell]
    if:
      type: text
      regex: '(?i)\[char\[\]\]\(\s*105\s*,\s*101\s*,\s*120\s*\)'

composite_rules:
  - id: batch-decoded-powershell-webclient
    desc: Batch decoded PowerShell WebClient
    crit: hostile
    conf: 0.97
    all:
      - id: micro-behaviors/process/create/shell/lang::powershell-invocation
      - id: powershell-char-array-stage
      - id: powershell-char-array-join
      - id: decoded-scriptblock-create
      - id: decoded-webclient-downloadstring
    any:
      - id: powershell-empty-join
      - id: powershell-iex-variable
      - id: micro-behaviors/process/interpreter/eval/direct::powershell-iex-call
  # The Formbook-style batch launcher: a hidden PowerShell rebuilds its script
  # from XOR-encoded blobs and runs the result through an `iex` that was never
  # written out. Each leg is explainable alone; decoding into a command whose
  # name is itself hidden has no administrative purpose.
  - id: hidden-powershell-xor-blob-char-iex
    desc: Hidden PowerShell decodes XOR blob into iex
    crit: hostile
    conf: 0.97
    attack: T1059.001,T1140,T1027
    for: [batch, powershell]
    all:
      - id: micro-behaviors/process/create/hidden::powershell-windowstyle-hidden
      - id: powershell-xor-char-decode-loop
      - id: powershell-iex-char-codes
