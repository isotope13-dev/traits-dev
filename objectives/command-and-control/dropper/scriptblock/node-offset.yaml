# A Node script whose command is an offset-decoded PowerShell ScriptBlock
# is handing execution to a concealed stage. The integer array and the
# ScriptBlock invocation are the stage; child_process is what runs it.
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
  attack: T1059.001,T1027,T1140
  crit: hostile
  conf: 0.96

composite_rules:
  - id: node-offset-decoded-scriptblock-loader
    desc: Node runs offset-decoded PowerShell script
    near_bytes: 8192
    all:
      - id: micro-behaviors/process/create/spawn::node-spawn-powershell-process
      - id: objectives/anti-static/obfuscation/encoding/arithmetic::powershell-offset-integer-array-script-eval

  - id: node-offset-scriptblock-path-stager
    desc: Node loader records path and decodes
    near_bytes: 8192
    all:
      - id: node-offset-decoded-scriptblock-loader
      - id: micro-behaviors/process/info/selfpath::powershell-script-path-stored-env
