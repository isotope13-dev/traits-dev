# Hidden installer chain with quarantine removal and off-screen UI.
defaults:
  crit: hostile
  platforms: [windows]
  for: [html, javascript, vbs]
  attack: T1059.003,T1553.005,T1218.007

composite_rules:
  - id: script-host-quiet-msi-install
    desc: Concealed script host strips MOTW and quietly installs MSI
    conf: 0.97
    all:
      - id: objectives/evasion/indicator-removal/cleanup::cmd-motw-removal
      - id: objectives/evasion/process/hidden/execution::window-offscreen-resize
      - id: micro-behaviors/process/create/installer::quiet-package-install-args
      - id: micro-behaviors/process/create/hidden::wsh-hidden-shell-run
    any:
      - id: micro-behaviors/process/create/installer::html-split-msiexec-literal
      - id: micro-behaviors/process/create/installer::msiexec-package-verb
      - id: micro-behaviors/process/create/installer::vbs-msiexec-quiet-install
      - id: micro-behaviors/process/create/shell/wsh::shellexecute-hidden-showcmd
