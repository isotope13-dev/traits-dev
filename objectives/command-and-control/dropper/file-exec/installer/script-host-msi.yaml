# Script-host silent MSI installers.
#
# The VBS form is covered by vbs-curl-msi-dropper in vbscript-msi.yaml. This
# file covers the same behavior from HTA/JScript carriers, which split the
# executable name across string literals ("msiexec" + ".exe") so no one line
# names msiexec.exe, while the /package /quiet argument string stays intact.
# A hidden script host that quietly installs an MSI package is a silent
# software push with no user interaction -- the install leg of a fake-invoice
# (RFQ) lure that also strips MOTW and relaunches itself elevated.
defaults:
  crit: hostile
  platforms: [windows]
  for: [html, javascript, vbs]
  attack: T1059.003,T1105,T1218.007

composite_rules:
  - id: script-host-quiet-msi-install
    desc: Script host silently installs an MSI package
    conf: 0.97
    all:
      - id: micro-behaviors/process/create/installer::quiet-package-install-args
      - id: objectives/command-and-control/dropper/file-exec/command/script-host-download::wsh-hidden-run-shell-command
    any:
      - id: micro-behaviors/process/create/installer::html-split-msiexec-literal
      - id: micro-behaviors/process/create/installer::msiexec-package-verb
      - id: micro-behaviors/process/create/installer::vbs-msiexec-quiet-install
      - id: micro-behaviors/process/create/shell/wsh::shellexecute-hidden-showcmd
