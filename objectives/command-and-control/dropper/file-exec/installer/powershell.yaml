defaults:
  platforms: [windows]
  for: [powershell]
  attack: T1105
  mbc: B0030

composite_rules:
  - id: powershell-streamed-archive-msi-dropper
    desc: Hidden PowerShell streams archive and launches MSI
    crit: hostile
    conf: 0.99
    attack: T1059.001,T1105,T1204.002,T1564.003
    near_bytes: 8192
    all:
      - id: micro-behaviors/communications/http/client/managed::httpwebrequest
      - id: micro-behaviors/communications/http/client/managed::getresponse
      - id: micro-behaviors/communications/http/client/managed::getresponsestream
      - id: micro-behaviors/communications/http/url/scheme::cleartext-http-url-code-literal
      - id: micro-behaviors/process/io/stream::stream-write-buffer-arg
      - id: micro-behaviors/data/archive/extract/tar::tar-extract
      - id: micro-behaviors/process/create/start-process::start-process-msi-path
      - id: micro-behaviors/process/create/hidden::start-process-windowstyle-hidden
      - id: micro-behaviors/process/create/flags::powershell-policy-bypass-argument
  - id: powershell-temp-msi-install
    desc: PowerShell stages and installs TEMP MSI
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/communications/http/download/cli::iwr-outfile-download
      - id: micro-behaviors/fs/path/temp::temp-msi-staging
      - id: micro-behaviors/process/create/installer::powershell-variable-msi-quiet-install
    any:
      - id: micro-behaviors/process/create/hidden::start-process-windowstyle-hidden
      - id: micro-behaviors/process/create/installer::msiexec-norestart-switch
      - id: micro-behaviors/communications/http/lib/invoke-webrequest::useb-flag
  - id: powershell-msi-programdata-install
    desc: PowerShell stages ProgramData MSI
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/communications/http/download/webclient::webclient-downloadfile-msi-url
      - id: micro-behaviors/process/create/installer::msiexec-programdata-msi
      - id: micro-behaviors/process/create/installer::msiexec-package-verb

  - id: powershell-unattended-rmm-msi
    desc: PowerShell stages a quiet unattended RMM MSI
    crit: hostile
    conf: 0.98
    attack: T1105,T1219,T1218.007
    all:
      - id: objectives/command-and-control/dropper/file-exec/installer::powershell-temp-msi-install
    any:
      - id: well-known/dual-use/remote-admin/rmm::logmein-agent-name
      - id: well-known/dual-use/remote-admin/rmm::gotoresolve-agent-name

  - id: batch-github-raw-quiet-rmm-dropper
    for: [batch]
    desc: Batch silently installs a raw-GitHub remote-access MSI
    crit: hostile
    conf: 0.99
    attack: T1105,T1218.007,T1219
    near_bytes: 2048
    all:
      - id: micro-behaviors/communications/http/url/github::github-web-raw-msi-url
      - id: micro-behaviors/communications/http/download/webclient::webclient-downloadfile-msi-url
      - id: micro-behaviors/process/create/installer::msiexec-package-verb
      - id: micro-behaviors/process/create/installer::msiexec-quiet-switch
      - id: objectives/command-and-control/backdoor/control/rmm::remote-access-agent-reference
  # GitHub Releases is a common disposable hosting path for EXE droppers
  # (throwaway repos). Distinct from vendor bootstrap that uses raw.githubusercontent
  # source archives without launching a downloaded EXE.

  - id: github-raw-msi-dropper
    desc: GitHub raw MSI PowerShell dropper
    crit: hostile
    conf: 0.99
    all:
      - id: micro-behaviors/communications/http/url/github::github-web-raw-msi-url
      - id: objectives/command-and-control/dropper/file-exec/installer::powershell-temp-msi-install

  # Phishing droppers commonly use an embedded PowerShell WebClient from a
  # batch wrapper rather than a standalone .ps1. A raw GitHub MSI, a named
  # remote-access agent, and a quiet msiexec invocation bind the fetch and
  # install into the same operator-staged RMM chain without campaign IOCs.
