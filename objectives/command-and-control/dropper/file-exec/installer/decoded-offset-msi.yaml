defaults:
  platforms: [windows, unix]
  for: [powershell]
  attack: T1027,T1059.001,T1105,T1218.007

composite_rules:
  # The recovered stage supplies what the former decoder-only conviction
  # lacked. Harmless encoded output, normal HTTPS installers and visible
  # interactive installations cannot supply every role.
  - id: concealed-decimal-host-quiet-msi
    desc: Concealed decimal-host quiet MSI installation
    crit: hostile
    conf: 0.97
    size_max: 65536
    all:
      - id: micro-behaviors/process/interpreter/eval/constructed::powershell-offset-scriptblock-eval
      - id: micro-behaviors/communications/ip/literal::powershell-decimal-host-download
      - id: micro-behaviors/process/create/installer::quiet-msi-process-start
      - id: micro-behaviors/process/create/hidden::start-process-windowstyle-hidden
      - id: micro-behaviors/fs/delete/file/command::powershell-remove-item-env-path
