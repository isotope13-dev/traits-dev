# Python binds an offset-decoded PowerShell stage to a subprocess launch. The
# encoded stage contains a cleartext HTTP numeric-host URL, DownloadFile,
# msiexec.exe, and quiet/no-restart switches. The claim is the remote quiet
# MSI launch pattern; it does not assert that the fetch or installation
# succeeded or identify the MSI's eventual payload.
defaults:
  platforms: [windows]
  for: [python]
  attack: T1027,T1059.001,T1105,T1218.007

composite_rules:
  - id: python-offset-powershell-quiet-http-msi-stager
    desc: Python launches decoded PowerShell remote quiet MSI installer
    crit: hostile
    conf: 0.98
    near_bytes: 8192
    all:
      - id: objectives/anti-static/obfuscation/eval/powershell-loader::python-launches-offset-powershell-stage
      - id: micro-behaviors/process/interpreter/eval/constructed::powershell-offset-scriptblock-eval
      - id: metadata/lang/encoding::offset1520498-downloadfile-token
      - id: metadata/lang/encoding::offset1520498-msiexec-token
      - id: metadata/lang/encoding::offset1520498-msi-quiet-no-restart-token
      - id: metadata/lang/encoding::offset1520498-http-decimal-host-url
