# A remote URL is passed directly to the installer, linking acquisition and
# activation. Elevation requests and quiet switches add triage context; this
# profile can also appear in administrative deployment scripts.
defaults:
  platforms: [windows]
  for: [batch, powershell, javascript, typescript]

composite_rules:
  - id: elevated-quiet-remote-msi-install
    desc: Remote MSI install with quiet mode and nearby elevation request
    crit: suspicious
    conf: 0.95
    attack: T1105,T1218.007
    near_lines: 12
    all:
      - id: micro-behaviors/process/create/installer::msiexec-remote-url-install
      - id: micro-behaviors/process/create/installer::msiexec-quiet-switch
      - id: micro-behaviors/os/privilege/elevation::runas-verb
