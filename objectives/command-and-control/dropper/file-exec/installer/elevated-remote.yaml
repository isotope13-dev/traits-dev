# A remote URL is passed directly to the installer, linking acquisition and
# activation. Elevation requests and quiet switches add triage context; this
# profile can also appear in administrative deployment scripts.
defaults:
  platforms: [windows]
  for: [batch, powershell, javascript, typescript]

composite_rules:
  - id: elevated-quiet-remote-msi-install
    desc: Remote MSI install with quiet mode and nearby elevation request
    crit: suspicious
    conf: 0.95
    attack: T1105,T1218.007
    near_lines: 12
    all:
      - id: micro-behaviors/process/create/installer::msiexec-remote-url-install
      - id: micro-behaviors/process/create/installer::msiexec-quiet-switch
      - id: micro-behaviors/os/privilege/elevation::runas-verb
  - id: vbs-shellexecute-remote-msi
    desc: Elevated raw-IP MSI download and install
    crit: hostile
    conf: 0.98
    attack: T1059.001,T1105,T1218.007,T1548.002
    for: [vbs]
    all:
      - id: micro-behaviors/process/create/shellexec::shell-application-execute-context
      - id: micro-behaviors/communications/ip/literal::external-ipv4-http-url
      - id: micro-behaviors/communications/http/download/cli::embedded-iwr-outfile-download
      - id: micro-behaviors/communications/http/url/endpoint::remote-msi-package-url
      - id: micro-behaviors/process/create/installer::msiexec-package-verb
      - id: micro-behaviors/process/create/installer::vbs-msiexec-quiet-install
      - id: micro-behaviors/os/privilege/elevation::shellexecute-quoted-runas-verb
