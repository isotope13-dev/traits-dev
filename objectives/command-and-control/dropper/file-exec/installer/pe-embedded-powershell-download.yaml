defaults:
  platforms: [windows]
  for: [pe]
  attack: T1059.001,T1105,T1564.003
composite_rules:
  - id: pe-hidden-webclient-downloadfile-exe-dropper
    desc: PE embeds hidden bypassed WebClient EXE fetch
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/communications/http/download/webclient::webclient-downloadfile-call
      - id: micro-behaviors/process/create/hidden::powershell-windowstyle-hidden-option
      - id: micro-behaviors/process/create/flags::powershell-policy-bypass-text
      - id: objectives/command-and-control/dropper/script-eval/response-pipeline::ps-downloadfile-exe-dll
  - id: smart-install-maker-psdownload-dropper
    desc: Smart Install Maker hides PowerShell EXE download
    crit: hostile
    conf: 0.99
    all:
      - id: metadata/binary/installer/family::smart-install-maker-description
      - id: pe-hidden-webclient-downloadfile-exe-dropper
