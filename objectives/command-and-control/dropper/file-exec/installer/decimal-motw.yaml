# Bounded download/install evidence; the matcher does not bind the download
# destination to the installer argument. Neither downloader alone is malicious.
defaults:
  platforms: [windows]
  for: [powershell]
  attack: T1105,T1218.007
composite_rules:
  - id: decimal-host-quiet-msi-install
    desc: Decimal-host download near hidden quiet MSI staging
    crit: hostile
    conf: 0.97
    near_bytes: 1024
    all:
      - id: micro-behaviors/communications/ip/literal::decimal-ip-http-url
      - id: micro-behaviors/fs/path/temp::temp-msi-staging
      - id: micro-behaviors/process/create/installer::quiet-msi-process-start
      - id: micro-behaviors/process/create/hidden::start-process-windowstyle-hidden
    any:
      - id: micro-behaviors/communications/http/download/cli::iwr-outfile-download
      - id: micro-behaviors/communications/http/download/webclient::webclient-downloadfile-call
  - id: quiet-msi-download-unblock-install
    desc: Download and file unblocking near hidden quiet MSI staging
    crit: hostile
    conf: 0.97
    attack: T1105,T1218.007,T1553.005
    near_bytes: 1024
    all:
      - id: micro-behaviors/fs/path/temp::temp-msi-staging
      - id: micro-behaviors/process/create/installer::quiet-msi-process-start
      - id: micro-behaviors/process/create/hidden::start-process-windowstyle-hidden
      - id: micro-behaviors/fs/delete/file/command::unblock-file
    any:
      - id: micro-behaviors/communications/http/download/cli::iwr-outfile-download
      - id: micro-behaviors/communications/http/download/webclient::webclient-downloadfile-call
