# PowerShell integer-array payloads can hide their installer commands from the
# ordinary text rules. This objective requires encoded download, msiexec, and
# quiet/no-restart evidence together with the established decoder/invocation.
defaults:
  platforms: [windows]
  for: [javascript]
  attack: T1105,T1218.007,T1027,T1140

composite_rules:
  - id: offset-powershell-quiet-hidden-msi-dropper
    desc: Obfuscated PowerShell downloads and quietly installs an MSI
    crit: hostile
    conf: 0.98
    near_bytes: 32768
    all:
      - id: micro-behaviors/process/interpreter/eval/constructed::powershell-offset-scriptblock-eval
      - id: micro-behaviors/data/decode/custom::offset-array-downloadfile-token
      - id: micro-behaviors/data/decode/custom::offset-array-msiexec-token
      - id: micro-behaviors/data/decode/custom::offset-array-msi-quiet-no-restart-token
