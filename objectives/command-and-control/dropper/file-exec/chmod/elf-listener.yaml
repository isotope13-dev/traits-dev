# A stripped static listener that chmod(path, 0700) and execve()s is staging
# a received executable, separate from the socket-to-shell dup2 path.
# BusyBox and Go runtimes ship the same syscalls for legitimate servers.
defaults:
  platforms: [linux]
  for: [elf]
  arch: [x86-64]
  attack: T1105
  mbc: B0022.001

composite_rules:
  - id: static-listener-chmod-exec
    desc: Listener marks a file owner-executable and execs
    crit: hostile
    conf: 0.95
    all:
      - id: micro-behaviors/communications/socket/syscall::linux-network-server
      - id: micro-behaviors/process/create/execv::syscall-execve-elf
      - id: micro-behaviors/os/syscall/raw::x64-mov-chmod-syscall
      - id: micro-behaviors/fs/chmod/modify::owner-mode-0700-immediate
      - id: metadata/binary/linking/dynamic::elf-needed-libs-zero
      - id: "metadata/binary/symbols/table::full-symbol-table-absent-or-empty"
    unless:
      - id: well-known/tool/sysadmin/busybox::busybox-banner
      - id: well-known/tool/sysadmin/busybox::busybox-binary-basename
      - id: metadata/lang/compiler/systems::go-binary
