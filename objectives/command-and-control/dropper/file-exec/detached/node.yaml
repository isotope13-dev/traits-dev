  # Recognised AI memory-vault packages whose CLI opens sign-in URLs via the
  # OS default handler and manages a documented local daemon (pid file,
  # health checks) satisfy every generic leg above without dropping anything.
  - id: well-known/tool/development/toolchain/deno::source-archive-context
  - id: node-known-ai-app-context
# Benign pattern: a CLI respawns its own entry as a detached update-check
# worker (spawn(process.execPath, [entry, "<worker-flag>"], {detached,
# stdio: ignore}).unref()). Each leg is individually notable; together they
# are a self-update nudge, not a payload drop: the spawned target is the
# CLI itself, and the worker only refreshes a version cache. Sibling
# node-self-respawn misses this form because the entry travels through a
# variable (entry = process.argv[1]) rather than a literal __filename.
- id: node-detached-update-check-worker
  desc: Node CLI detached update or release handoff
  crit: exception
  conf: 0.9
  for:
  - javascript
  near_bytes: 2048
  all:
