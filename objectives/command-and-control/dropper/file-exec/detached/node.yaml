traits:
- id: github-raw-batch-url
  desc: GitHub raw batch payload URL
  crit: suspicious
  conf: 0.95
  attack: T1105
  for:
  - javascript
  if:
    type: text
    regex: github\.com/.{1,40}/.{1,60}/raw/refs/heads/.{1,40}/.{1,80}\.(bat|cmd)
- id: node-release-asset-download
  desc: Downloads a selected software release asset
  crit: notable
  conf: 0.92
  for:
  - javascript
  if:
    type: text
    regex: 'browser_download_url[\s\S]{0,240}asset\.name'
- id: node-update-package-self-reference
  desc: Current package identity in update commands
  crit: notable
  conf: 0.9
  for:
  - javascript
  if:
    type: text
    regex: 'PKG\.name[\s\S]{0,400}(npm install -g|npx -y|brew upgrade)'
