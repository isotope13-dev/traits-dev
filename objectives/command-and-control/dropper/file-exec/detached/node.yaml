- id: node-detached-remote-shell-loader
  desc: Detached spawn runs curl-piped-to-shell loader
  crit: hostile
  conf: 0.95
  attack: T1059.004,T1059.007,T1105,T1195.002
  mbc: B0024,F0011
  # Both legs must belong to one spawn invocation: a detached browser-opener
  # in one function and a foreground self-updater curl pipe in another are
  # ordinary CLI tooling, not a loader. A single detached loader call fits
  # in a few hundred bytes; unrelated helpers sit kilobytes apart.
  near_bytes: 1024
  all:
  - id: micro-behaviors/process/create/spawn::detached-ignored-unref-spawn
  - id: micro-behaviors/process/create/shell/pipeline::curl-pipe-shell-text
