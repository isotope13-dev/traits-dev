defaults:
  platforms: [windows]
  for: [pe, powershell]
composite_rules:
  - id: amsi-bypass-webclient-item-launch
    desc: Encoded AMSI bypass co-occurs with WebClient download and item launch
    crit: hostile
    conf: 0.98
    attack: T1562.001,T1105,T1059.001
    near_bytes: 4096
    all:
      - id: objectives/evasion/anti-av/amsi::base64-amsi-init-failed-reflection-bypass
      - id: micro-behaviors/communications/http/download/webclient::webclient-downloadfile-call
      - id: micro-behaviors/process/create/shellexec::powershell-invoke-item
