defaults:
  platforms: [windows]
  for: [batch]

traits:
  - id: batch-python-inline-requests
    desc: Batch starts inline Python importing requests
    crit: notable
    conf: 0.96
    attack: T1059.006
    if:
      type: text
      regex: '(?i)\b[\w.-]+\.exe["'']?\s+-c\s+["'']\s*import\s+requests\b'

  - id: batch-requests-fetch-text
    desc: Python fetches source text from HTTP
    crit: suspicious
    conf: 0.98
    attack: T1105
    if:
      type: text
      regex: '(?is)requests\.get\s*\(\s*["'']https?://.{1,180}?["'']\s*\)\.text'


composite_rules:
  - id: batch-python-remote-code-launcher
    desc: Batch launches a staged Python fetcher
    crit: hostile
    conf: 0.98
    attack: T1059.003,T1059.006,T1105,T1027,T1564.003
    all:
      - id: batch-python-inline-requests
      - id: batch-requests-fetch-text
      - id: micro-behaviors/process/interpreter/eval/direct::batch-python-base64-exec
    any:
      - id: micro-behaviors/process/create/hidden::start-minimized-window
      - id: micro-behaviors/fs/path/system::users-public-executable-path
