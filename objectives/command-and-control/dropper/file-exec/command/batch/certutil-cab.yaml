# certutil -decode followed by expand.exe on a .cab is a LOLBin staging
# chain used to unwrap a smuggled PE from a fake certificate blob.
defaults:
  platforms: [windows]
  for: [batch, powershell]
  attack: T1140,T1105
  mbc: C0026,B0030

composite_rules:
  - id: certutil-decode-expand-cab
    desc: certutil decodes a Cabinet that expand unpacks
    crit: hostile
    conf: 0.99
    all:
      - id: micro-behaviors/data/decode/command::certutil-decode-command
      - id: micro-behaviors/data/archive/extract/cab::expand-cab-command
    near_lines: 12
