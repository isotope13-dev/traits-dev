defaults:
  platforms:
  - windows
traits:
- id: bitsadmin-transfer-false-bom
  desc: False-BOM batch contains a BITSAdmin transfer
  crit: notable
  conf: 0.99
  for: [batch]
  if:
    type: text
    substr: '楢獴摡業⹮硥⁥琯慲獮敦'
- id: start-temp-executable-false-bom
  desc: False-BOM batch starts a Temp executable
  crit: notable
  conf: 0.99
  for: [batch]
  if:
    type: text
    substr: '慴瑲∠•┢整灭慐桴尥攥數楆敬慎敭∥'
- id: temp-jpg-payload-copy--binary
  desc: Copies JPG payload to binary
  crit: suspicious
  conf: 0.92
  for:
  - batch
  if:
    type: text
    regex: '(?i)copy.{0,40}%temp%\\.{1,80}\.jpg.{0,120}\.(exe|dll)'
- id: temp-jpg-payload-copy--script
  desc: Copies JPG payload to script
  crit: suspicious
  conf: 0.92
  for:
  - batch
  if:
    type: text
    regex: '(?i)copy.{0,40}%temp%\\.{1,80}\.jpg.{0,120}\.(cmd|msi|ini)'
- id: renamed-regsvr32-temp-exec
  desc: Renamed regsvr32 temp execution
  crit: suspicious
  conf: 0.94
  for:
  - batch
  if:
    type: text
    regex: '(?is)%[A-Za-z][A-Za-z0-9_]*%32\\\\%1vr32\.exe.{0,180}%temp%\\\\.{1,80}\.exe.{0,180}\.dat'
- id: obfuscated-powershell-hidden-file
  desc: Mixed-case hidden PowerShell script
  crit: suspicious
  conf: 0.95
  attack: T1059.001
  for:
  - batch
  if:
    type: text
    regex: '(?s)Win.{0,60}dOw.{0,40}stY.{0,40}le.{0,60}hI.{0,40}d.{0,40}Den.{0,180}\.ps1'
- id: dat-payload-to-temp-wildcard
  desc: Copies DAT payload into TEMP wildcard target
  crit: suspicious
  conf: 0.9
  for:
  - batch
  if:
    type: text
    regex: '(?i)\.dat\s+%TEMP%\\\*'
- id: fragmented-rundll32-temp-dat-export
  desc: Fragmented rundll32 loads TEMP DAT export
  crit: suspicious
  conf: 0.94
  for:
  - batch
  if:
    type: text
    regex: '(?i)%[A-Za-z0-9_]{4,}%32\s+%TEMP%\\[^,\r\n]{1,60}\.dat,'
- id: single-letter-var-substitution-table
  desc: Batch single-letter substitution table
  crit: suspicious
  conf: 0.92
  for:
  - batch
  count_min: 16
  if:
    type: text
    regex: '(?im)^set\s+[a-z]{6,12}=[a-z]\r?$'
- id: fragmented-ll32-temp-call
  desc: Fragmented ll32 call into TEMP
  crit: suspicious
  conf: 0.93
  for:
  - batch
  if:
    type: text
    regex: '(?i)%[A-Za-z0-9_]+%%[A-Za-z0-9_]+%32\s+%TEMP%\\'
- id: fragmented-temp-export-path
  desc: Fragmented TEMP export path
  crit: suspicious
  conf: 0.92
  for:
  - batch
  if:
    type: text
    regex: '(?i)%TEMP%\\%[A-Za-z0-9_]+%[^ \r\n]{1,120},%[A-Za-z0-9_]+%'
- id: fragmented-copy-to-temp-wildcard
  desc: Fragmented copy into TEMP wildcard
  crit: component
  conf: 0.9
  for:
  - batch
  if:
    type: text
    substr: '%TEMP%\*'
- id: batch-long-quoted-base64-variable
  desc: Batch long quoted base64 variable
  crit: suspicious
  conf: 0.94
  for:
  - batch
  if:
    type: text
    regex: "(?im)^SET\\s+[A-Z0-9_]{2,8}='[A-Za-z0-9+/]{300,}"
- id: keyed-temp-payload-launch--rx-1
  desc: Regex component marker
  crit: component
  conf: 0.95
  for:
  - batch
  if:
    type: text
    substr: start
    case_insensitive: true
- id: batch-base64-pe-prefix
  desc: Base64 PE header in batch data line
  crit: suspicious
  conf: 0.97
  for:
  - batch
  if:
    type: text
    regex: (?im)^\s*TVqQAAMAAAAEAAAA[A-Za-z0-9+/=]{30,}
- id: temp-raw-base64-rebuild
  desc: Temp file raw base64 rebuild chain
  crit: suspicious
  conf: 0.93
  for:
  - batch
  - powershell
  if:
    type: text
    regex: '(?i)Get-Content.{0,80}\.tmp([''"\s]|$).{0,40}-Raw'
  unless:
  - id: well-known/tool/offensive/dalfox::dalfox-scanner-context
- id: ps-regex-repaired-base64
  desc: PowerShell regex repairs Base64
  crit: suspicious
  conf: 0.94
  for:
  - batch
  - powershell
  if:
    type: text
    regex: '(?i)FromBase64String.{0,80}\[regex\]::Replace'
- id: wide-b64-reflection-assembly
  desc: Encoded Reflection.Assembly load
  crit: suspicious
  conf: 0.94
  for:
  - batch
  - powershell
  if:
    type: text
    substr: AFIAZQBmAGwAZQBjAHQAaQBvAG4ALgBBAHMAcwBlAG0AYgBsAHkAXQA6ADo
- id: rem-marker-hidden-payload
  desc: Batch hides payload in REM markers
  crit: suspicious
  conf: 0.96
  for:
  - batch
  if:
    type: text
    regex: (?i)r\^?e\^?m\s+(wjiwkghu|cqtljtup)
- id: nuget-flatcontainer-fragment
  desc: Obfuscated NuGet flatcontainer URL
  crit: notable
  conf: 0.93
  for:
  - batch
  - powershell
  if:
    type: text
    regex: (?i)v3-fl.{0,16}at.{0,16}co.{0,24}(nta|#E-f#Enta)
- id: globalcdn-nuget-fragment
  desc: Obfuscated NuGet package CDN URL
  crit: notable
  conf: 0.93
  for:
  - batch
  - powershell
  if:
    type: text
    regex: (?i)(globalcdn\.nuget\.org|obalc.{0,16}Ed.{0,32}gun\.n)
- id: roslyn-csharp-package-fragment
  desc: Obfuscated Roslyn CodeAnalysis package
  crit: component
  conf: 0.95
  for:
  - batch
  - powershell
  if:
    type: text
    regex: (?i)codea.{0,40}nal
- id: python-bin-payload-arg
  desc: Python script binary payload arg
  crit: notable
  conf: 0.9
  for:
  - batch
  if:
    type: text
    regex: '(?i)\bpython(\.exe)?\s+[^\r\n]{1,80}\.py\s+-p\s+\S+\.bin\b'
- id: python-json-key-arg
  desc: Python script JSON key arg
  crit: notable
  conf: 0.86
  for:
  - batch
  if:
    type: text
    regex: '(?i)\s-k\s+\S+\.json\b'
composite_rules:
- id: false-bom-bitsadmin-download-and-start-temp
  desc: False-BOM batch downloads and starts a Temp payload
  crit: hostile
  conf: 0.995
  attack: T1105,T1059.003
  for: [batch]
  all:
  - id: bitsadmin-transfer-false-bom
  - id: start-temp-executable-false-bom
- id: bitsadmin-download-and-start-temp
  desc: Batch downloads with BITSAdmin and starts the Temp payload
  crit: hostile
  conf: 0.99
  attack: T1105,T1059.003
  for: [batch]
  all:
  - id: micro-behaviors/communications/http/download/cli::bitsadmin-transfer-command
  - id: micro-behaviors/process/create/shell/batch::start-temp-executable-text
- id: temp-jpg-payload-copy
  desc: Copies JPG payload to executable
  crit: suspicious
  conf: 0.92
  for:
  - batch
  any:
  - id: temp-jpg-payload-copy--binary
  - id: temp-jpg-payload-copy--script
- id: batch-rar-vbs-payload-dropper
  desc: Batch passworded RAR to VBS payload dropper
  crit: hostile
  conf: 0.97
  for: [batch]
  all:
  - id: micro-behaviors/fs/file/rename::batch-rename-text-to-rar
  - id: micro-behaviors/data/archive/extract/password::batch-password-rar-extract
  - id: micro-behaviors/process/create/shell/batch::batch-starts-sibling-vbs
  any:
  - id: micro-behaviors/fs/delete/file/command::batch-rar-bat-delete-command
  - id: objectives/impact/degrade/system/file::batch-deletes-desktop-exe
  needs: 1
- id: batch-python-staged-payload-launcher
  desc: Batch launches staged Python payload
  crit: hostile
  conf: 0.97
  attack: T1059.006
  for:
  - batch
  all:
  - id: micro-behaviors/process/interpreter/python::python-script-from-batch
  - id: micro-behaviors/fs/path/app-data::localappdata-short-subdir
  - id: python-bin-payload-arg
  - id: python-json-key-arg
  any:
  - id: micro-behaviors/process/create/hidden::start-minimized-self
  - id: micro-behaviors/fs/path/check::batch-multiple-if-exist-gates
  - id: micro-behaviors/os/console/io::windows-output-to-nul-text
  - id: micro-behaviors/os/console/io::stderr-redirect
  needs: 2
- id: batch-obfuscated-self-deleting-loader
  desc: Obfuscated batch loader with self-delete cleanup
  crit: hostile
  conf: 0.96
  attack: T1070.004
  all:
  - id: objectives/anti-static/obfuscation/string/fragmentation::batch-fragmentation-metrics
  - id: micro-behaviors/process/info/selfpath::self-path-fragment
  - id: micro-behaviors/os/console/io::output-suppression
- id: batch-obfuscated-cleanup-dropper
  desc: Obfuscated batch dropper with staged cleanup pattern
  crit: hostile
  conf: 0.97
  all:
  - id: objectives/anti-static/obfuscation/string/fragmentation::batch-fragmentation-metrics
  - id: micro-behaviors/process/info/selfpath::self-path-fragment
  - id: micro-behaviors/os/console/io::output-suppression
  - id: micro-behaviors/fs/delete/file/command::del-command
# curl writes an EXE into TEMP and the next lines `start` an EXE from TEMP:
# the download target and the launch target are the same per-user temp
# directory, within a few lines, so the fetched program is what runs.
- id: batch-curl-temp-exe-dropper
  desc: Batch curl stages and starts a TEMP EXE
  crit: hostile
  conf: 0.98
  attack: T1105,T1204.002,T1059.003
  for:
  - batch
  near_lines: 6
  all:
  - id: micro-behaviors/communications/http/download/curl::curl-output-to-temp-exe
  - id: micro-behaviors/process/create/shell/tmp-exec::batch-start-temp-exe
- id: batch-download-execute
  desc: Download and execute pattern (batch)
  crit: suspicious
  conf: 0.95
  for:
  - batch
  near_lines: 30
  all:
  - id: micro-behaviors/communications/http/download/cli::batch-download-tool-group
  - id: micro-behaviors/process/create/shell/batch::batch-program-launch-group
  - id: micro-behaviors/communications/http/download/curl::batch-curl-output-flag
  unless:
  - id: well-known/tool/development/cli/batch-scripts::pytorch-ci-sevenzip-installer
  - id: well-known/tool/development/cli/batch-scripts::intel-dle-official-installer
  - id: well-known/tool/development/cli/batch-scripts::protobuf-kokoro-wheel-builder
  - id: well-known/tool/development/cli/batch-scripts::appveyor-pypy-ci-installer
  - id: well-known/tool/development/cli/batch-scripts::appveyor-ci-batch-script
- id: batch-disguised-vnc-dropper
  desc: Batch stages disguised VNC payloads
  crit: hostile
  conf: 0.98
  attack: T1105
  for:
  - batch
  all:
  - id: temp-jpg-payload-copy
  - id: objectives/command-and-control/backdoor/control/rmm::ultravnc-payload-staging
- id: batch-renamed-regsvr32-loader
  desc: Batch copies regsvr32 to temp payload
  crit: suspicious
  conf: 0.97
  attack: T1218.010
  for:
  - batch
  all:
  - id: renamed-regsvr32-temp-exec
  - id: micro-behaviors/os/env/user-paths::temp-env-var
- id: batch-powershell-download-exec
  desc: PowerShell downloads and executes a script from batch
  crit: hostile
  conf: 0.98
  attack: T1059.001
  for:
  - batch
  all:
  - id: micro-behaviors/communications/http/download/webclient::obfuscated-powershell-webclient-downloadfile
  - id: obfuscated-powershell-hidden-file
- id: batch-obfuscated-webclient-hidden-exec
  desc: Obfuscated batch downloads and hides a script
  crit: hostile
  conf: 0.97
  attack: T1059.001,T1105
  for:
  - batch
  near_lines: 20
  all:
  - id: micro-behaviors/communications/http/download/webclient::obfuscated-webclient-downloadfile-ps1
  - id: obfuscated-powershell-hidden-file
- id: batch-powershell-irm-iex
  desc: Batch runs a remote script via irm
  crit: hostile
  conf: 0.97
  attack: T1059.001,T1105
  for:
  - batch
  all:
  - id: micro-behaviors/communications/http/lib/invoke-webrequest::embedded-irm-iex-pipeline
  - id: objectives/command-and-control/dropper/script-eval/response-eval/batch::batch-powershell-long-irm-iex
  unless:
  - id: well-known/tool/packaging/uv::uv-powershell-piped-installer-command
- id: batch-public-python-remote-base64-exec
  desc: Batch runs masqueraded Python remote base64 payload
  crit: hostile
  conf: 0.98
  attack: T1059.006
  for:
  - batch
  all:
  - id: micro-behaviors/process/create/shell/batch::public-exe-script-argument
  - id: objectives/command-and-control/dropper/script-eval/response-eval/batch::batch-python-remote-base64-exec
- id: batch-obfuscated-python-remote-base64-exec
  desc: Obfuscated batch hides Python remote base64 exec
  crit: hostile
  conf: 0.98
  attack: T1027
  for:
  - batch
  all:
  - id: objectives/command-and-control/dropper/script-eval/response-eval/batch::batch-python-remote-base64-exec
  - id: objectives/anti-static/obfuscation/string/fragmentation::batch-cjk-long-token-obfuscation
- id: batch-obfuscated-python-remote-base64-exec-bytes
  desc: Obfuscated batch byte-hides Python remote base64 exec
  crit: hostile
  conf: 0.98
  attack: T1027
  for:
  - batch
  all:
  - id: objectives/command-and-control/dropper/script-eval/response-eval/batch::batch-python-remote-base64-exec-bytes
  - id: objectives/anti-static/obfuscation/string/fragmentation::batch-cjk-long-token-obfuscation
# `mislabeled-single-line-source` (objectives/evasion/masquerade/interpreter)
# is scoped to `for: [shell, javascript]` -- its own `script-content-extension-
# mismatch` leg never evaluates true on Batch, so a leaf batch file can never
# satisfy it. Use the one-line structural fact directly instead; the CJK/long-
# token evidence below already carries the masquerade intent for batch.
- id: batch-cjk-smuggled-one-line-loader
  desc: Batch CJK-smuggled one-line loader
  crit: hostile
  conf: 0.96
  attack: T1027
  for:
  - batch
  all:
  - id: objectives/anti-static/obfuscation/string/fragmentation::batch-cjk-long-token-obfuscation
  - id: metadata/file/line::file-one-liner
- id: batch-cjk-smuggled-degenerate-loader
  desc: Batch CJK-smuggled degenerate loader
  crit: hostile
  conf: 0.96
  attack: T1027
