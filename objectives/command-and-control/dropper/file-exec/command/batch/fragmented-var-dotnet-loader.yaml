# Fragmented-variable batch fileless loaders. The PowerShell stage is cut
# into dozens of short variables with non-Latin names, reassembled through
# chained expansions, and run from a self-derived path (`%~0` plus an
# extension) while the .NET payload rides in an embedded gzip carrier --
# so no command, path, or API name ever appears literally.
defaults:
  platforms: [windows]
  for: [batch]
  attack: T1027,T1059.001,T1059.003,T1620
composite_rules:
  - id: batch-fragmented-var-fileless-loader
    desc: Fragmented batch runs self-derived payload over gzip carrier
    crit: hostile
    conf: 0.97
    all:
      - id: micro-behaviors/data/encode/payload::batch-gzip-base64-carrier
      - id: micro-behaviors/process/create/script/file::batch-self-derived-filename
      - id: objectives/anti-static/obfuscation/string/concat::batch-adjacent-expansion-chain
