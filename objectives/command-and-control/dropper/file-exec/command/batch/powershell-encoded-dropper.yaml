# Batch executes hidden encoded PowerShell dropper targeting AppData
defaults:
  platforms: [windows]
  for: [batch]
  attack: T1059.001,T1059.003,T1105,T1564.003
  mbc: B0030,E1059

composite_rules:
  - id: batch-hidden-encoded-powershell-appdata-dropper
    desc: Batch launches hidden encoded PowerShell dropper staging executable in AppData
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/process/create/hidden::powershell-hidden-window
      - id: micro-behaviors/fs/path/application/executable::appdata-exe-path
      - id: micro-behaviors/process/create/shellexec::powershell-invoke-item
    any:
      - id: micro-behaviors/communications/http/download/cli::iwr-outfile-download
      - id: micro-behaviors/communications/http/download/cli::powershell-restmethod-outfile
