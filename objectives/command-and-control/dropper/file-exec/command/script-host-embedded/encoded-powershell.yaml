defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
composite_rules:
  - id: hidden-encoded-powershell-executable-download
    desc: Hidden encoded PowerShell downloads and invokes executable paths
    crit: suspicious
    conf: 0.96
    attack: T1059.001,T1027,T1105
    all:
      - id: micro-behaviors/process/create/hidden::encodedcommand-invocation-raw
      - id: micro-behaviors/process/argument/option::powershell-windowstyle-hidden-option
      - id: micro-behaviors/communications/http/download/cli::encoded-iwr-outfile-command
      - id: micro-behaviors/process/create/local-exec::encoded-iex-executable-path
