# ELF binary download, permission change, and local launch chain.
defaults:
  platforms: [linux, android]
  for: [elf]
  attack: T1105,T1059.004,T1222.002
  mbc: E1105

composite_rules:
  - id: raw-ip-download-chmod-relative-exec
    platforms: [linux]
    desc: ELF raw-IP download chmod and execute chain
    crit: hostile
    conf: 0.99
    all:
      - id: micro-behaviors/communications/ip/literal::external-ipv4-http-url
      - id: micro-behaviors/process/create/shell/spawn::system-fn
      - id: micro-behaviors/fs/chmod/executable/dangerous::native-chmod-0777-command
      - id: micro-behaviors/process/create/local-exec::native-relative-executable-string

  # A compiled implant carrying its own raw-IP wget/curl/TFTP fallback chain
  # is materially different from an installer that invokes one named client.
  # Requiring the complete local chmod-and-launch command keeps ordinary URL
  # and downloader references out of this verdict.
  - id: raw-ip-multi-client-download-execute
    platforms: [linux]
    desc: IoT bot embeds raw-IP fetch-and-execute chain
    crit: hostile
    conf: 0.99
    all:
      - id: micro-behaviors/communications/ip/literal::http-ip-url
      - id: micro-behaviors/communications/transfer::multiple-download-clients
      - id: micro-behaviors/process/create/local-exec::chmod-then-local-execute-command

    any:
      - id: objectives/lateral-movement/brute-force/iot-creds::mirai-credential-access
      - id: objectives/impact/dos/attack/flood::native-multivector-attack-function-cluster

  # The three-way combination is specific to an IoT bot dropper: a raw-IP
  # download, an executable-mode change, and a Mirai credential table. Each
  # leg is neutral or suspicious on its own, but together they describe the
  # payload-delivery behavior.
  # shell-plus-x is a shell AST match; chmod-make-executable is the
  # text-regex sibling (matches both `+x` and octal forms) that can see the
  # same command as a literal string embedded in this ELF's bytes.
  - id: raw-ip-iot-download-chmod-exec
    platforms: [linux]
    desc: IoT bot downloads and executes raw-IP payload
    crit: hostile
    conf: 0.99
    all:
      - id: micro-behaviors/communications/ip/literal::http-ip-url
      - id: micro-behaviors/fs/chmod/executable/mode::chmod-make-executable
      - id: micro-behaviors/process/create/shell/spawn::system-fn
      - id: objectives/lateral-movement/brute-force/iot-creds::mirai-credential-access

  # Some ARM IoT bots use a compiled socket scanner and invoke a downloader
  # from an embedded shell command without the libc system() wrapper. The
  # credential table, raw IPv4 socket, and literal raw-IP chmod/launch chain
  # together describe the infection routine in those binaries.
  - id: raw-ip-mirai-socket-scan-stager
    platforms: [linux]
    desc: Mirai credential bot scans raw sockets and stages raw-IP payload
    crit: hostile
    conf: 0.99
    attack: T1110.001,T1105,T1059.004,T1222.002
    all:
      - id: objectives/lateral-movement/brute-force/iot-creds::mirai-credential-access
      - id: micro-behaviors/communications/socket/raw::arm-ipv4-raw-socket-creation
      - id: micro-behaviors/communications/ip/literal::http-ip-url
      - id: micro-behaviors/process/create/local-exec::chmod-then-local-execute-command
