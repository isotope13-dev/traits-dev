# Batch crypters that deobfuscate with cmd substring stripping
# (`%VAR:TOKEN=%` removes every TOKEN occurrence) instead of quote-plus
# concatenation. The payload rides in an oversized `::`-comment line, an
# interpreter binary is staged with a stripped copy, and the final `call`
# executes a stripped expansion -- so no payload path, interpreter path, or
# command line ever appears literally.
defaults:
  platforms: [windows]
  for: [batch]
  attack: T1027,T1059.003,T1620
composite_rules:
  - id: batch-strip-executed-crypter
    desc: Batch crypter executes stripped commands over an embedded blob
    crit: hostile
    conf: 0.97
    # A real encoded/encrypted carrier has materially varied byte content.
    # Degenerate repeated-token fixtures can satisfy the line-length and cmd
    # syntax legs without carrying a payload at all.
    all:
      - id: micro-behaviors/process/create/shell/batch::batch-call-strip-execute
      - id: micro-behaviors/fs/file/copy::batch-copy-stripped-source
      - id: metadata/file/line::batch-line-over-100000
      - id: metadata/file/data-blob::batch-file-entropy-above-five
