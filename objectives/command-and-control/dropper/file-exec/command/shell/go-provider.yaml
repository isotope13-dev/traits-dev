defaults:
  for: [elf, macho, pe]
  platforms: [linux, macos, windows]
composite_rules:
  - id: metrics-url-temp-shell-stager
    desc: Metrics-looking download URL accompanies a temporary shell payload stager
    crit: hostile
    conf: 0.99
    attack: T1105,T1059.004
    all:
      - id: micro-behaviors/process/create/local-exec::go-temp-shell-staging-code
      - id: micro-behaviors/communications/http/url/path::provider-grpc-metrics-download-url
