# FTP local-command scripts reconstruct an executable and invoke it. The
# explicit local copy/start sequence is the activation evidence.
defaults:
  platforms: [windows]
  for: [text, batch, cmd]
  attack: T1059.003,T1218
composite_rules:
  - id: ftp-script-binary-reconstruction-dropper
    desc: FTP script reconstructs and launches executable
    crit: suspicious
    conf: 0.99
    mbc: B0024
    all:
      - id: micro-behaviors/communications/ftp/control::ftp-local-shell-command-sequence
      - id: micro-behaviors/process/create/launch::ftp-script-starts-executable
    any:
      - id: micro-behaviors/fs/file/concat::cmd-binary-file-concatenation
      - id: micro-behaviors/fs/file/concat::ftp-local-binary-file-concatenation
    needs: 1
