# Classified by required operations; references do not establish data flow.
defaults:
  platforms: [windows]
  for: [scripts, source, class, java_class]
composite_rules:
  - id: shell-hidden-hex-background-loader
    desc: Shell hides an encoded payload in a background process
    crit: hostile
    conf: 0.99
    for: [shell]
    platforms: [unix]
    all:
      - id: objectives/command-and-control/dropper/staging/script::shell-appended-payload-extract
      - id: "micro-behaviors/fs/path/temp::hidden-tmp-dotfile-path"
      - id: micro-behaviors/process/daemonize/detach::nohup-hidden-output
      - id: micro-behaviors/process/create/background::detached-background-command

