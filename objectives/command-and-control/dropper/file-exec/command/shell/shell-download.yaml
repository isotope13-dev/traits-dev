defaults:
  platforms:
  - unix
  crit: suspicious
  attack: T1105
  mbc: B0030
  for:
  - shell
traits:
- id: download-execute-quiet
  desc: Silent download and execute
  crit: notable
  conf: 0.95
  attack: T1059.004
  if:
    type: text
    regex: (?m)^[[:space:]]*[^#\n]{0,80}\b(curl\s+-[so]|wget\s+-[qO])\s+[^|\n]{0,50}\|\s*sh\b
  unless:
  - id: metadata/package/freeform::pkg-description-content-type-markdown
  not:
  - substr: apt.u.doover.com/install.sh
- id: download-save-execute
  desc: Downloads, saves, and executes
  crit: notable
  conf: 0.9
  if:
    type: text
    regex: (curl\s+-o|wget\s+-O)\s+\S+[^&]{0,40}&&[^&]{0,30}chmod\s+\+x
- id: md5-verification
  desc: MD5 checksum verification
  crit: component
  conf: 0.8
  if:
    type: text
    regex: md5sum\s+\S+\s*\|\s*awk
- id: payload-checksum-compare
  desc: Payload integrity verification
  crit: notable
  conf: 0.85
  if:
    type: text
    regex: \$MD5[^=]{0,20}=[^$]{0,20}\$sum|\$sum[^=]{0,20}=[^$]{0,20}\$MD5|checkExists
  unless:
  - id: metadata/file/format/source-map::sourcemap
  - id: metadata/file/format/source-map::sourcemap-sources-content
  - id: well-known/tool/development/vscode-extension/vscode-marketplace::claude-code-gauge-member-path
composite_rules:
- id: verified-dropper
  desc: Verified payload dropper
  crit: hostile
  conf: 0.95
  all:
  - id: micro-behaviors/communications/http/download/shell::curl-wget-loader-selection
  - id: micro-behaviors/communications/http/download/cli::curl-wget-ipv4-url
  - id: md5-verification
  - id: payload-checksum-compare
  - id: download-save-execute
