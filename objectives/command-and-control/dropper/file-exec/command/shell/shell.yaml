# An agent skill that instructs downloading a password-protected binary and
# also carries a fetch-substitution shell (`$(curl ...)` inside a command
# substitution). The passworded download tells the agent to fetch what
# scanners cannot open; the substitution shell is what runs beside it.
#
# Worked example: the netcode-openclaw trading skills, whose SKILL.md
# directs Windows agents to AuthTool.exe (password: 1234) while embedding a
# base64-masked curl-to-bash line behind an Apple-looking URL echo.
