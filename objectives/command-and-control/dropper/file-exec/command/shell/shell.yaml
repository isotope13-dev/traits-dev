  - id: raw-ip-masqueraded-shell-dropper
    desc: Raw-IP download executes temp stage
    crit: hostile
    conf: 0.99
    attack: T1105,T1036.007,T1059.004
    near_bytes: 1024
    all:
      - id: micro-behaviors/communications/http/download/fallback::downloader-fallback-chain
      - id: objectives/command-and-control/dropper/delivery/execute-download/script::temp-nonscript-shell-launch
      - id: micro-behaviors/communications/ip/literal::external-ipv4-http-url
  - id: raw-ip-multiarch-shell-payload
    desc: Shell fetches and executes raw-IP multi-architecture payload
    crit: hostile
    conf: 0.99
    attack: "T1105,T1059.004,T1222.002"
    all:
      - id: objectives/command-and-control/dropper/delivery/execute-download/script::raw-ip-shell-source
      - id: micro-behaviors/fs/chmod/executable/mode::chmod-exec-var-target
      - id: micro-behaviors/process/create/local-exec::shell-variable-exec-with-args
      - id: "micro-behaviors/os/sysinfo/platform/arch::multi-arch-target"
    any:
      - id: micro-behaviors/communications/http/download/shell::fetch-var-output-var
      - id: micro-behaviors/communications/http/download/shell::fetch-variable-input-output-command
    # The fallback-chain sibling below proves the same multi-architecture
    # fetch-chmod-exec routine with stronger downloader evidence; when both
    # fire it is one behavior, so report this leg once at suspicious rather
    # than stacking a second hostile verdict for it.
    downgrade:
      any:
        - id: multiarch-variable-protocol-dropper
  # This chain proves a multi-architecture executable dropper, but does not by
  # itself prove either an IoT target or botnet enrollment. Keep that stronger
  # interpretation in botnet composites that add actual IoT/botnet evidence.
  - id: multiarch-variable-protocol-dropper
    desc: Multi-arch fallback downloader executes stage
    crit: hostile
    conf: 0.99
    attack: "T1105,T1059.004,T1222.002"
    platforms: [linux]
    all:
      - id: micro-behaviors/communications/http/download/fallback::multi-client-download-fallback
      - id: "micro-behaviors/os/sysinfo/platform/arch::multi-arch-target"
      - id: micro-behaviors/fs/chmod/executable/mode::chmod-exec-var-target
    any:
      - id: micro-behaviors/process/create/local-exec::shell-variable-exec-with-args
      - id: micro-behaviors/process/create/background::detached-background-command
    unless:
      - id: metadata/build/archive::source-archive-member
      - id: metadata/build/autotools::autoconf-generated-script
      - id: micro-behaviors/os/package-manager/installer-script::installer-script
      - id: micro-behaviors/os/package-manager/installer-script::verified-github-release-installer
      - id: micro-behaviors/crypto/hash/file::hash-pinned-download-context
      - id: micro-behaviors/crypto/hash/file::sha512-pinned-download-context
