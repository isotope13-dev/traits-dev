defaults:
  platforms: [unix]
  for: [shell, scripts]
  attack: T1105,T1059.004
composite_rules:
  - id: shell-arch-keyed-raw-ip-insecure-fetch-chmod-setsid
    desc: Shell fetches arch-keyed file from raw IP and runs it
    crit: hostile
    conf: 0.88
    all:
      - id: micro-behaviors/communications/ip/literal::external-ipv4-shell-endpoint
      - id: micro-behaviors/communications/http/url/build::arch-variable-in-url
      - id: micro-behaviors/communications/tls/verify/disable::curl-insecure
      - id: micro-behaviors/fs/chmod/executable/mode::chmod-plus-x-quoted-path
      - id: micro-behaviors/process/daemonize/detach::setsid-command
