defaults:
  for: [batch]
  platforms: [windows]
composite_rules:
  - id: batch-suppressed-download-elevated-launch
    desc: Suppressed download with elevated file launch
    crit: suspicious
    conf: 0.96
    attack: T1105,T1059.001
    all:
      - id: micro-behaviors/communications/http/download/webclient::webclient-downloadfile-call
      - id: micro-behaviors/process/create/start-process::start-process-filepath
      - id: micro-behaviors/os/privilege/elevation::runas-verb
      - id: micro-behaviors/os/console/io::batch-command-stdout-nul
