defaults:
  platforms: [windows]
  for: [class, swift]
  attack: T1105,T1059.003
composite_rules:
  - id: jvm-runtime-temp-batch-download-execute
    desc: JVM Runtime executes a downloaded temporary batch script
    crit: hostile
    conf: 0.98
    for: [class]
    near_bytes: 1024
    all:
      - id: micro-behaviors/communications/http/download/curl::curl-http-download-command-reference
      - id: micro-behaviors/process/create/shell/batch::temporary-batch-command-chain
      - id: micro-behaviors/process/create/spawn::java-runtime-exec-bytecode-symbol
      - id: micro-behaviors/process/create/shell/spawn::java-cmd-exe-c-arguments
