defaults:
  platforms: [linux, macos, windows, unix, android, ios]
  for: [python]
  attack: T1105
  mbc: E1105

composite_rules:
  - id: python-google-drive-jar-dropper
    desc: Google Drive JAR download and execute
    crit: hostile
    conf: 0.97
    all:
      - id: micro-behaviors/communications/http/lib/requests::requests-get
      - id: micro-behaviors/fs/file/open::binary-write-mode
      - id: micro-behaviors/process/create/subprocess::java-jar-argv
      - id: micro-behaviors/communications/http/services/google::google-drive-direct-download-url

# A Python script that drops a downloaded executable into the user's AppData
# and launches it through a raw Win32 call. The AppData landing zone plus the
# ctypes WinExec/ShellExecute launch is the dropper idiom -- a legitimate
# installer uses the user's package manager or Program Files, not a hidden
# per-user directory and a syscall.
#
# Worked example: the `discconnect` PyPI package, whose install hook fetches
# `Driver.exe` from filetransfer.io into %LOCALAPPDATA% and WinExecs it.
  - id: python-download-appdata-exe-launch
    desc: Downloaded exe lands in AppData and WinExecs
    crit: hostile
    conf: 0.97
    all:
      - id: micro-behaviors/communications/http/lib/urllib::urllib-download-to-binary-output
      - id: micro-behaviors/process/create/exec::python-ctypes-win32-exec
    any:
      - id: micro-behaviors/fs/path/application/executable::appdata-exe-path
      - id: micro-behaviors/fs/path/construct::python-path-join-appdata-exe

# A Python package that shells the download job out to PowerShell: curl.exe
# fetches a remote executable to disk and Start-Process runs it, all inside a
# subprocess argument list. The pure-Python droppers are covered above; this
# is the delegation spelling, where the fetch and the launch happen inside a
# child powershell process the parent never has to implement.
#
# Worked example: `antibyfron`, whose module runs
# ["powershell","-Command","curl.exe -L .../zwerve.exe -o ...; Start-Process ..."].
  - id: python-shell-powershell-curl-exe-download
    desc: Python delegates exe download to PowerShell
    crit: hostile
    conf: 0.96
    attack: T1105,T1059.001
    near_lines: 40
    all:
      - id: micro-behaviors/communications/http/download/url::executable-url-reference-embedded
      - id: micro-behaviors/communications/http/download/cli::fetch-output-flag-embedded-command
      - id: micro-behaviors/process/create/launch::python-string-start-process
      - id: micro-behaviors/process/create/subprocess::process-execution

  # `powershell -w hidden` plus `iwr -OutFile` plus `Start-Process` is the
  # same download-and-run cradle when the operator uses the short flags
  # instead of Invoke-WebRequest and Invoke-Expression.
  - id: python-hidden-iwr-outfile-start
    desc: Hidden PowerShell downloads and starts a file
    crit: hostile
    conf: 0.96
    attack: T1105,T1059.001
    scope: file
    all:
      - id: micro-behaviors/process/create/system::python-os-system-text
      - id: micro-behaviors/process/create/hidden::python-powershell-w-hidden
      - id: micro-behaviors/communications/http/download/cli::iwr-outfile-download
      - id: micro-behaviors/process/create/launch::python-string-start-process

