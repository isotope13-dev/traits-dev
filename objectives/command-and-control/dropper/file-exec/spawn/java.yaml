defaults:
  platforms: [unix]
  for: [java, class, jar, zip]
  attack: T1027.009,T1059
  mbc: B0032,E1059

composite_rules:
  - id: java-encrypted-temp-shell-dropper
    desc: Java encrypted temporary shell dropper
    crit: hostile
    conf: 0.99
    all:
      - id: objectives/command-and-control/dropper/staging/encrypted::java-payload-endpoint
      - id: objectives/command-and-control/dropper/staging/encrypted::java-xor-decode-method
      - id: objectives/command-and-control/dropper/staging/encrypted::java-temp-shell-payload-name
      - id: micro-behaviors/fs/chmod/executable/mode::java-owner-execute-permission
    any:
      - id: micro-behaviors/process/create/subprocess::java-processbuilder-source
      - id: micro-behaviors/process/create/subprocess::java-processbuilder-bytecode

  - id: java-indexed-xor-resource-stager
    desc: Java decrypts bundled resource, writes, and executes
    crit: suspicious
    conf: 0.97
    platforms: [unix, windows]
    for: [class, jar, zip]
    all:
      - id: micro-behaviors/data/embedded/payload/resource::java-classpath-resource-stream
      - id: micro-behaviors/crypto/symmetric/xor/loop::jvm-indexed-additive-key-xor-loop
      - id: micro-behaviors/fs/write/file/full::jvm-files-write-bytecode
      - id: micro-behaviors/process/create/exec::java-runtime-exec-bytecode-reference

  # Hidden strings aside, the stage still trusts every certificate, inflates a
  # PNG into ZIP entries, and ProcessBuilder-starts the result.
  - id: java-trustall-png-archive-process-stager
    desc: Trust-all TLS client runs a process unpacked from a PNG archive
    crit: hostile
    conf: 0.97
    platforms: [unix, windows]
    for: [class, jar, zip, java_class]
    scope: archive
    attack: T1105,T1059,T1573,T1027.003
    all:
      - id: objectives/evasion/security-bypass/tls::java-tls-client-own-trust-all-manager
      - id: micro-behaviors/data/embedded/payload/image::png-inflate-process-class
      - id: micro-behaviors/data/archive/extract/zip::jvm-zip-entry-extraction-to-file

  # A JVM stage that unwraps a Fernet-packed payload, writes it out, installs
  # its Python dependencies, and runs it.  Fernet is a Python-only token format
  # (`cryptography.fernet`), so a JVM class implementing it is decrypting
  # something the operator packed with Python tooling; pip-installing the
  # requirements of a payload that arrived encrypted is not a build step or a
  # plugin bootstrap, it is second-stage delivery of an interpreted payload.
