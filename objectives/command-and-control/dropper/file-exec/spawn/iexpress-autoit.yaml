defaults:
  platforms: [windows]
  for: [pe]
  attack: T1027.009

traits:
  - id: iexpress-autoit-script-payload
    desc: IExpress cabinet launches AutoIt script payload
    crit: suspicious
    conf: 0.97
    if:
      type: text
      regex: '(?i)"AutoIt3\.exe"\s+[^\r\n"]{1,80}\.a3x\b'

composite_rules:
  - id: iexpress-autoit-packed-dropper
    desc: IExpress wrapper launches a packed AutoIt payload
    crit: hostile
    conf: 0.99
    all:
      - id: iexpress-autoit-script-payload
      - id: metadata/binary/installer/sfx::wextract-tool
      - id: metadata/lang/compiled::autoit-script-resource-entry
      - id: metadata/lang/compiled::autoit-runtime-resource-entry
      - id: metadata/file/data-blob::peak-region-cipher-entropy
      - id: metadata/file/data-blob::binary-peak-region-mass-over-8k
      - id: metadata/signed/trust-level::unsigned-missing-signature-record
