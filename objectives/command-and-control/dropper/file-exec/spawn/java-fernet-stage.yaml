# File-stage chain classified by direct process or shell-handler launch.
defaults:
  platforms: [unix]
  for: [java, class, jar, zip]
  attack: T1027.009,T1059
  mbc: B0032,E1059

composite_rules:
  # Encrypted self-extractors exist in legitimate software, so the generic
  # chain is suspicious rather than hostile. More specific objectives promote
  # it only when the surrounding context establishes abuse.
  - id: java-fernet-python-stage-dropper
    desc: Java decrypts a Fernet payload before launching a staged process
    crit: hostile
    conf: 0.97
    platforms: [unix, windows]
    for: [class, java_class, jar, java]
    attack: T1027,T1059.006
    all:
      - id: micro-behaviors/crypto/symmetric/fernet::jvm-fernet-token-handling
      - id: micro-behaviors/os/package-manager/install::jvm-pip-install-command
      - id: micro-behaviors/fs/write/file/full::jvm-files-write-bytecode
      - id: micro-behaviors/process/create/spawn::java-processbuilder-start-bytecode
