defaults:
  platforms: [linux]
  for: [elf]
  attack: T1027.009,T1059
  mbc: B0032,E1059

composite_rules:
  - id: go-gcm-temp-payload-launcher
    desc: Go temp-file payload launcher
    crit: hostile
    conf: 0.98
    all:
      - id: objectives/command-and-control/dropper/staging/encrypted::go-encrypted-embedded-payload
      - id: micro-behaviors/process/create/system::go-os-exec-pclntab
    any:
      - id: micro-behaviors/os/env/user-paths::tmpdir-var
      - id: micro-behaviors/fs/temp/mktemp::create-temp-runtime-string
      - id: micro-behaviors/fs/proc/exe::process-self-exe-path
    needs: 2
