defaults:
  platforms: [windows]
  for: [csharp]
  attack: T1105
composite_rules:
  - id: download-execute-csharp
    desc: C# downloads and launches a staged file
    crit: hostile
    conf: 0.94
    near_bytes: 512
    all:
      - id: micro-behaviors/communications/http/client/managed::downloadfile
      - id: micro-behaviors/process/create/spawn::start
    any:
      - id: micro-behaviors/os/env/read::temp-environment-variable-read
      - id: micro-behaviors/process/create/spawn::use-shell-execute-property
    needs: 1
