# Multi-payload dropper staging host-mimicking executables in the Temp Low
# directory and launching them through the shell handler. Unlike the sibling
# special-folder-overlay rule (1 MiB-plus overlays resolved through
# SHGetFolderPath), this shape packs several hundred kilobytes of embedded
# PEs, resolves %TEMP%/%APPDATA% from the environment, and names its drops
# after the Windows Search host. Size is not gated: the four content legs
# (embedded PEs, Low drop path, impersonating name, file write) already
# exclude ordinary installers, which neither bundle executables nor borrow
# system-host names.
defaults:
  platforms: [windows]
  for: [pe]
  attack: T1027.009,T1105,T1204.002

composite_rules:
  - id: temp-low-host-mimic-multi-pe-drop
    desc: Drops host-mimicking PEs into Temp Low
    crit: hostile
    conf: 0.96
    all:
      - id: metadata/binary/layout/embedded::embedded-pe-three-plus
      - id: objectives/evasion/masquerade/path::temp-low-windows-executable
      - id: objectives/evasion/masquerade/file/name::search-host-impersonating-name
      - id: micro-behaviors/fs/write/file/handle::write-file
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/installer/family/
      # String legs without executable code are a mimic, not a drop: the
      # imports are never called, so nothing is written or staged.
      - id: metadata/binary/code/entropy::code-entropy-near-zero

  # The launch half: the Temp-Low payload starts through ShellExecuteEx while
  # the dropper surveys running processes and deletes files. Either half
  # alone (a launch, a survey, a deletion) is ordinary installer behavior;
  # the Low drop path binds them to the staged payload.
  - id: temp-low-payload-launch-cleanup
    desc: Launches Temp-Low payload amid survey and deletion
    crit: hostile
    conf: 0.95
    all:
      - id: objectives/evasion/masquerade/path::temp-low-windows-executable
      - id: micro-behaviors/process/create/shellexec::shell-executeex-call
      - id: micro-behaviors/fs/delete/file/library::deletefile-w
      - id: micro-behaviors/process/enumerate/snapshot::create-toolhelp32-snapshot
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/installer/family/
      # String legs without executable code are a mimic, not a launch: the
      # imports are never called, so nothing is surveyed or deleted.
      - id: metadata/binary/code/entropy::code-entropy-near-zero
