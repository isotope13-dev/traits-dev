# File-stage chain classified by direct process or shell-handler launch.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  attack: T1105,T1027,T1059.007,T1497.001

# Required capabilities are correlated by proximity.

composite_rules:
  - id: vscode-encrypted-stage-dropper
    desc: Encrypted VS Code stage dropper
    crit: hostile
    conf: 0.98
    attack: T1105,T1027,T1059.007
    near_lines: 80
    all:
      - id: well-known/lib/development/vscode::vscode-extension-marker
      - id: micro-behaviors/communications/http/request/client::https-get
      - id: micro-behaviors/crypto/symmetric/decrypt::createDecipheriv
      - id: micro-behaviors/crypto/symmetric/aes/runtime-library::aes-256-gcm
      - id: micro-behaviors/fs/write/file/full::node-write-file-sync
      - id: micro-behaviors/process/create/spawn::process-execpath-spawn

  - id: vscode-hidden-python-stage
    desc: Detached Python stage
    crit: hostile
    conf: 0.99
    attack: T1059.007
    near_lines: 80
    all:
      - id: well-known/lib/development/vscode::vscode-extension-marker
      - id: micro-behaviors/fs/path/extension::js-python-extension-reference
      - id: micro-behaviors/fs/write/file/full::node-write-file-sync
      - id: micro-behaviors/process/create/spawn::process-execpath-spawn
      - id: micro-behaviors/process/create/spawn::detached-true
