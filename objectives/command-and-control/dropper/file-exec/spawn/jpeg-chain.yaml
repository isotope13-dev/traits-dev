defaults:
  platforms:
  - unix
  - windows
  for:
  - javascript
  - typescript
  crit: notable

traits:
  - id: jpeg-parser-vbs-write-spawn-chain
    desc: JPEG command staged in a spawned script
    conf: 0.98
    if:
      type: tree-sitter
      query: |
        (statement_block
          (variable_declaration (variable_declarator
            name: (object_pattern (pair_pattern key: (property_identifier) @spawnkey value: (identifier) @spawnbind))
            value: (call_expression function: (identifier) @require
              arguments: (arguments (string (string_fragment) @module)))))
          (function_declaration name: (identifier) @parser body: (statement_block) @parserbody)
          (function_declaration body: (statement_block
            (lexical_declaration (variable_declarator name: (identifier) @envelope
              value: (call_expression function: (identifier) @parseuse)))
            (lexical_declaration (variable_declarator name: (identifier) @script
              value: (call_expression function: (member_expression object: (array
                (template_string
                  (string_fragment) @run
                  (template_substitution (call_expression function: (member_expression object: (array
                    (identifier)
                    (spread_element (identifier))
                    (call_expression function: (member_expression object: (identifier) @command
                      property: (property_identifier) @trim))))))))))))
            (expression_statement (call_expression
              function: (member_expression property: (property_identifier) @write)
              arguments: (arguments (identifier) @stage (identifier) @written)))
            (return_statement (sequence_expression (call_expression function: (member_expression
              object: (call_expression function: (identifier) @spawnuse arguments: (arguments (identifier) (array (identifier) @launched)))
              property: (property_identifier) @unref))))))
          (#eq? @spawnkey "spawn")
          (#eq? @require "require")
          (#match? @module "^(node:)?child_process$")
          (#eq? @spawnbind @spawnuse)
          (#eq? @parser @parseuse)
          (#match? @parserbody "readUInt16BE")
          (#match? @parserbody "===\\s*(0xED|237)")
          (#eq? @envelope @command)
          (#eq? @trim "trim")
          (#match? @run "WScript\\.Shell.*Run")
          (#eq? @script @written)
          (#eq? @stage @launched)
          (#eq? @write "writeFileSync")
          (#eq? @unref "unref"))
