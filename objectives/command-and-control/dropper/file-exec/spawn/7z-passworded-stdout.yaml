# Password-protected 7z extracted to stdout, PE-checked, then written under a
# random temp name and launched. Encrypted archive plus in-memory extract keeps
# scanners blind until the payload is already a disk image; launching it is the
# dropper, independent of whether the script is named postinstall.js.
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
  attack: T1027.002,T1105,T1059.001
  mbc: B0024

composite_rules:
  - id: passworded-7z-stdout-temp-pe-launch
    desc: Passworded 7z stdout PE launch
    crit: hostile
    conf: 0.98
    all:
      - id: objectives/command-and-control/dropper/node-bootstrap::sevenzip-password-stdout-extract
      - id: objectives/command-and-control/dropper/node-bootstrap::pe-header-validation
      - id: objectives/command-and-control/dropper/node-bootstrap::temp-random-exe-path
      - id: micro-behaviors/process/create/start-process::start-process-temp-executable
