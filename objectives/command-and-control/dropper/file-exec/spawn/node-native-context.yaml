defaults:
  platforms:
  - unix
  - windows
  for:
  - javascript
  - typescript
  attack: T1105
composite_rules:
- id: node-fetch-chmod-exec-stealth-dropper
  desc: Node file fetch, chmod and detached run clues
  conf: 0.95
  near_bytes: 8192
  all:
  - id: micro-behaviors/communications/http/download/handler::node-http-stream-to-file
  - id: micro-behaviors/fs/chmod/executable/mode::node-chmod-make-executable
  any:
  - id: micro-behaviors/process/create/spawn::detached-ignored-unref-spawn
  - id: micro-behaviors/process/create/spawn::node-self-respawn
  needs: 1
  unless:
  - id: metadata/package/testing/
  - id: metadata/build/
  - id: metadata/build/recognized-contexts::benign-app-fp-context
  - id: "metadata/file/naming::test-directory-component"
  crit: suspicious
- id: node-fetch-writefile-chmod-execfile-stealth-dropper
  desc: Node fetch, write, chmod and hidden exec clues
  conf: 0.98
  near_bytes: 8192
  all:
  - id: micro-behaviors/communications/http/request/client::https-get
  - id: micro-behaviors/fs/write/file/full::node-write-file-sync
  - id: micro-behaviors/fs/chmod/executable/mode::node-chmod-exec-mode-755
  - id: micro-behaviors/process/create/system::js-execfile-call
  - id: micro-behaviors/process/create/spawn::detached-ignored-unref-spawn
  unless:
  - id: metadata/package/testing/
  - id: metadata/build/
  - id: metadata/build/recognized-contexts::benign-app-fp-context
  - id: "metadata/file/naming::test-directory-component"
  crit: suspicious
- id: node-fetch-promise-chmod-execfile-stealth-dropper
  desc: Node fetch, chmod and hidden execFile clues
  conf: 0.96
  near_bytes: 8192
  all:
  - id: micro-behaviors/communications/http/request/client::js-fetch-call
  - id: micro-behaviors/fs/write/file/full::node-write-file-promise-destructured
  - id: micro-behaviors/fs/chmod/modify::node-chmod-call
  - id: micro-behaviors/process/create/system::js-execfile-call
  - id: micro-behaviors/process/create/spawn::detached-true
  - id: micro-behaviors/process/fd/stdio::child-stdio-ignore-option
  unless:
  - id: metadata/package/testing/
  - id: metadata/build/
  - id: metadata/build/recognized-contexts::benign-app-fp-context
  - id: "metadata/file/naming::test-directory-component"
  crit: suspicious
- id: node-fetch-writefile-chmod-detached-spawn
  desc: Node response write, chmod and detached spawn
  conf: 0.99
  near_bytes: 8192
  all:
  - id: micro-behaviors/communications/http/request/client::https-get
  - id: micro-behaviors/communications/http/download/handler::node-http-response-to-file
  - id: micro-behaviors/fs/chmod/executable/mode::node-chmod-make-executable
  - id: micro-behaviors/process/create/spawn::detached-ignored-unref-spawn
  unless:
  - id: metadata/package/testing/
  - id: metadata/build/
  - id: metadata/build/recognized-contexts::benign-app-fp-context
  - id: "metadata/file/naming::test-directory-component"
  crit: suspicious
