defaults:
  platforms: [windows]
  for: [pe]
  attack: T1105
  mbc: B0024
composite_rules:
  - id: com-scripted-persistent-dropper
    desc: COM-scripted native dropper with persistence and execution
    crit: hostile
    conf: 0.97
    all:
      - id: micro-behaviors/os/com/invoke::ole-initialize
      - id: micro-behaviors/os/com/invoke::co-create-instance
      - id: micro-behaviors/fs/file/open::file-create-win
      - id: micro-behaviors/fs/write/file/handle::write-file
      - id: micro-behaviors/process/create/spawn::create-process-w
      - id: micro-behaviors/os/registry/access::registry-write-api-chain
      # The transacted-registry API leg is part of common MSI runtimes and
      # says nothing about persistence. Require both a scriptable COM host and
      # a concrete Run-key persistence surface instead.
      - id: micro-behaviors/os/com/automation::wscript-shell-literal
      - id: micro-behaviors/os/registry/keys::currentversion-run-key-path
    any:
      - id: micro-behaviors/fs/file/timestamp::set-file-time-with-walk-and-self-path
      - id: micro-behaviors/os/privilege/manifest::admin-manifest
      - id: micro-behaviors/communications/http/client/wininet::wininet-http-api-cluster
      - id: micro-behaviors/communications/http/message::content-range-bytes-format
    needs: 2
    downgrade:
      any:
        - id: metadata/binary/installer/family/
        - id: metadata/signed/platform/
    unless:
      - id: metadata/signed/unknown::tencent-technologyshenzhen-company-limited
      - id: well-known/app/utility/siw::siw-family-identity
      - id: well-known/app/system/miktex::miktex-setup-wizard
  - id: browser-com-wininet-stager
    desc: Browser COM WinInet stager with payload handoff
    crit: hostile
    conf: 0.96
    size_max: 262144
    all:
      - id: micro-behaviors/os/com/automation::activex-browser-host
      - id: micro-behaviors/os/com/invoke::co-create-instance
      - id: micro-behaviors/communications/http/client/wininet::wininet-http-flow
      - id: micro-behaviors/process/create/system::shell-execute-ex-a
    any:
      - id: micro-behaviors/os/com/invoke::co-initialize
      - id: micro-behaviors/os/com/invoke::ole-initialize
      - id: micro-behaviors/os/registry/access::registry-write-api-chain
      - id: micro-behaviors/communications/http/client/wininet::wininet-cache-cleanup-after-fetch
      - id: objectives/anti-static/obfuscation/payload/self-read::self-read-file-chain
      - id: micro-behaviors/fs/delete/file/command::slash-c-del-fragment
    needs: 2
    downgrade:
      any:
        - id: metadata/binary/installer/family/
        - id: metadata/signed/platform/
    unless:
      - id: well-known/app/system/miktex::miktex-setup-wizard
  - id: elevated-com-dropper-profile
    desc: Elevated COM dropper profile with anti-analysis
    crit: suspicious
    conf: 0.94
    all:
      - id: micro-behaviors/os/com/invoke::ole-initialize
      - id: micro-behaviors/os/com/invoke::co-create-instance
      - id: micro-behaviors/process/create/spawn::create-process-w
      - id: objectives/anti-analysis/debugger-detect/check::is-debugger-present
      - id: micro-behaviors/ui/window/probe::get-desktop-window
    any:
      - id: micro-behaviors/os/privilege/manifest::admin-manifest
      - id: metadata/binary/section/layout::encrypted-rdata-installer-stub-layout
      - id: metadata/binary/layout/entropy::high-entropy-data
    unless:
      - id: metadata/binary/installer/family/
      - id: well-known/tool/sysadmin/universal-extractor::universal-extractor-updater
      - id: well-known/app/utility/installer::uniextract-installer
      - id: metadata/signed/platform/
      - id: metadata/signed/unknown::tencent-technologyshenzhen-company-limited
      - id: well-known/tool/sysadmin/winrar/
      - id: well-known/app/system/miktex::miktex-setup-wizard
