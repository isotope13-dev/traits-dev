defaults:
  for: [vbs]
  platforms: [windows]
  crit: suspicious
  conf: 0.92

composite_rules:
  - id: vbs-hidden-first-arg-wsh-proxy
    desc: VBS hides and runs first CLI argument
    crit: hostile
    conf: 0.98
    attack: T1059.005,T1204.002
    all:
      - id: micro-behaviors/process/create/shell/wsh::vbs-wscript-arguments-zero
      - id: micro-behaviors/process/create/shell/wsh::vbs-shell-run-hidden-false-flags
    any:
      - id: micro-behaviors/process/create/shell/wsh::vbs-createobject-wscript-shell-progid
      - id: micro-behaviors/os/com/automation::wscript-shell-literal
    needs: 1

