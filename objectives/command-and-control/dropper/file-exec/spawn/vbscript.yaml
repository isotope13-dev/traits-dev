defaults:
  for: [vbs]
  platforms: [windows]
  crit: suspicious
  conf: 0.92

composite_rules:
  - id: vba-drop-and-execute-pe
    desc: VB-family script drops and executes PE file
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/fs/path/extension::windows-exe-path-reference
      - id: micro-behaviors/process/create/shell/script-host::wscript-host-exec
    any:
      - id: micro-behaviors/fs/write/stream::adodb-save-to-file
      - id: micro-behaviors/fs/write/stream::adodb-save-to-file-unicode
      - id: micro-behaviors/fs/file/copy::fso-copyfile-text
      - id: micro-behaviors/fs/write/vba::vba-open-for-output
    near_lines: 40
  - id: obfuscated-vbs-drop-and-hidden-run-pe
    desc: Obfuscated VBScript drops PE and runs it hidden
    crit: hostile
    conf: 0.97
    all:
      - id: objectives/command-and-control/dropper/file-exec/spawn::vba-drop-and-execute-pe
      - id: micro-behaviors/process/create/hidden::run-zero-style-argument
    any:
      - id: micro-behaviors/process/create/shell/wsh::wscript-shell-process-run
      - id: metadata/file/line::vbs-long-average-lines
