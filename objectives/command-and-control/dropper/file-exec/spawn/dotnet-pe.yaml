defaults:
  platforms: [windows]
  for: [pe]
  attack: T1105

composite_rules:
- id: dotnet-github-httpclient-download-exec
  desc: .NET GitHub raw downloader drops and runs stage
  crit: hostile
  conf: 0.99
  near_bytes: 16384
  all:
  - id: micro-behaviors/communications/http/client/managed::httpclient-bytearray-download
  - id: micro-behaviors/fs/write/file/full::dotnet-writeallbytes-token
  - id: metadata/binary/symbols/name::dotnet-processstartinfo-name
  any:
  - id: objectives/command-and-control/dropper/delivery/execute-download/file::raw-github-svchost-zowner-url
  - id: objectives/command-and-control/dropper/delivery/execute-download/file::svchost-zowner-stage-name
  - id: micro-behaviors/communications/http/url/github::raw-githubusercontent-script-file
  - id: micro-behaviors/communications/http/url/github::raw-githubusercontent-msbuild-project
  - id: micro-behaviors/fs/path/host-process::windows-svchost-name
  - id: well-known/app/browser/microsoft-edge::msedgewebview2-exe-name
  - id: micro-behaviors/fs/path/temp::windows-temp-executable-path
  needs: 2
# Base64, WriteAllBytes, Process.Start and GetTempFileName metadata tokens
# do not bind decoded bytes to a launched file. Keep their canonical neutral
# findings; an execution objective needs a linked payload, not co-occurrence.
- id: dotnet-remote-wsh-script-dropper
  desc: .NET loader downloads, writes, and launches a remote script stage
  crit: hostile
  conf: 0.99
  attack: "T1105,T1059.005"
  all:
  - id: objectives/command-and-control/dropper/delivery/execute-download/file::dotnet-remote-script-file-stage
  - id: micro-behaviors/process/info/name::windows-script-host-executable-reference
  - id: metadata/signed/trust-level::unsigned-missing-signature-record
  unless:
  - id: metadata/signed/platform/
  - id: well-known/app/
  - id: well-known/tool/
- id: dotnet-kingspy-download-execute
  desc: .NET Kingspy download and execute
  crit: hostile
  conf: 0.99
  all:
  - id: micro-behaviors/communications/http/client/managed::dotnet-downloadfile-token
  - id: objectives/command-and-control/dropper/delivery/execute-download/file::kingspy-wudfhost-payload-url
  - id: micro-behaviors/communications/http/client/managed::webclient
  - id: micro-behaviors/process/create/spawn::dotnet-process-start-split-tokens
  any:
  - id: objectives/command-and-control/dropper/delivery/execute-download/file::relative-taskhost-drop-path
  - id: objectives/command-and-control/dropper/delivery/execute-download/file::dotnet-getenvironmentvariable-token
  - id: "micro-behaviors/data/codec::dotnet-gzip-compression"
- id: dotnet-downloaddata-writeallbytes-shell
  desc: .NET downloads bytes, writes executable, and shells it
  for: [csharp]
  crit: hostile
  conf: 0.98
  all:
  - id: micro-behaviors/communications/http/client/managed::downloaddata
  - id: micro-behaviors/fs/write/file/full::writeallbytes-any
  - id: micro-behaviors/process/create/vb-shell::interaction-shell
- id: dotnet-webclient-write-execute
  desc: .NET WebClient write and execute chain
  crit: hostile
  conf: 0.95
  all:
  - id: micro-behaviors/communications/http/client/managed::request
  - id: micro-behaviors/process/create/spawn::dotnet-process-start-split-tokens
  any:
  - id: micro-behaviors/communications/http/client/managed::dotnet-downloadfile-token
  - id: micro-behaviors/communications/http/client/managed::downloaddata
  - id: micro-behaviors/fs/write/file/full::dotnet-writealltext-token
  - id: micro-behaviors/fs/write/file/full::dotnet-writeallbytes-token
  needs: 2
  unless:
      # Every leg above is a .NET #Strings metadata token, which a large
      # managed application satisfies by referencing the API at all. An
      # assembly naming a product and version has the identity these
      # composites assume is absent.
  - id: objectives/evasion/masquerade/binary/loader::dotnet-template-product-identity-context
  - id: micro-behaviors/fs/path/temp::any-temp-path
  - id: metadata/signed/platform/
  - id: well-known/lib/ai/openai::openai-dotnet-official-library
  # The four staging capabilities must CLUSTER (one small stager class), not be
  # scattered library-wide. Without proximity, this fired on any comprehensive
  # .NET library that merely contains download + base64 + gzip + file-write as
  # unrelated utilities (NewLife/Pek, cloud SDKs, config/asset caches) — 100KB+
  # apart in the metadata heap, never a real download→decode→decompress→write
  # chain. A focused dropper keeps them within one method/type.
- id: dotnet-networked-archive-loader
  desc: .NET networked archive loader with process execution and SOCKS5 transport
  crit: hostile
  conf: 0.97
  all:
  - id: micro-behaviors/communications/http/client/managed::httpclient
  - id: micro-behaviors/data/archive/extract/zip::dotnet-zip-entry-extract
  - id: metadata/binary/symbols/name::dotnet-processstartinfo-name
  - id: micro-behaviors/communications/proxy/socks::socks5-version-greeting-bytes
  - id: micro-behaviors/data/decode/base64::dotnet-frombase64string-text
  unless:
  - id: well-known/lib/ui/spectre-console::spectre-console-library
- id: managed-sandbox-gated-download-launch
  desc: Managed sandbox-aware downloader launches retrieved items
  crit: hostile
  conf: 0.99
  all:
  - id: objectives/command-and-control/dropper/delivery/execute-download/file::managed-update-loader-method-cluster
  - id: objectives/anti-analysis/sandbox-detect/suite::managed-sandbox-fingerprint-suite
  - id: micro-behaviors/communications/http/client/managed::httpclient
  - id: micro-behaviors/process/create/spawn::dotnet-process-start-split-tokens
  - id: micro-behaviors/process/create/hidden::dotnet-create-no-window
