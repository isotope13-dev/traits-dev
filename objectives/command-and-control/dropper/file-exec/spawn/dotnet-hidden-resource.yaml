# File-stage chain classified by direct process or shell-handler launch.
defaults:
  platforms: [windows]
  for: [pe, dll, csharp]
  attack: T1027
  mbc: C0025

composite_rules:

  - id: dotnet-encrypted-resource-hidden-process-stager
    for: [pe]
    desc: Unsigned .NET resource stager prepares a hidden child-process launch
    crit: hostile
    conf: 0.98
    attack: T1027.009,T1140,T1059
    mbc: B0009.014
    # Keep the hidden process launch bound to the resource/decrypt/write chain.
    # Large application frameworks commonly contain all of these capabilities
    # in separate subsystems without staging a child-process payload.
    near_bytes: 8192
    all:
      - id: metadata/binary/framework::dotnet-assembly
      - id: metadata/signed/trust-level::unsigned-missing-signature-record
      - id: metadata/binary/resource/size::dotnet-large-high-entropy-managed-resource
      - id: micro-behaviors/data/embedded/payload/resource::dotnet-managed-resource-access
      - id: micro-behaviors/crypto/symmetric/decrypt::dotnet-create-decryptor
      - id: micro-behaviors/fs/write/file/full::dotnet-writeallbytes-token
      - id: micro-behaviors/process/create/spawn::process-token-dotnet
      - id: micro-behaviors/process/create/hidden::dotnet-create-no-window
    unless:
      - id: metadata/signed/platform/
      - id: micro-behaviors/data/embedded/payload/resource::costura-bundle-marker
      - id: well-known/app/system/stresstimulus::logicnp-cryptolicensing
