# Classified by required operations; references do not establish data flow.
defaults:
  platforms: [windows]
  for: [scripts, source, class, java_class]
composite_rules:
  - id: jvm-staged-resource-process
    desc: JVM decodes and launches a hidden executable stage
    crit: hostile
    conf: 0.99
    for: [class, java_class]
    platforms: [unix, windows]
    # Was `scope: archive`, which pools these legs across every class in a
    # JAR. They are ordinary JVM library surface -- Base64, ProcessBuilder,
    # temp path -- so any substantial application supplies all of them from
    # unrelated classes.
    all:
      - id: micro-behaviors/data/decode/base64::java-base64-decoder-class
      - id: micro-behaviors/process/create/spawn::java-processbuilder-start-bytecode
      - id: micro-behaviors/fs/write/file/stage::jvm-hidden-temp-stage-path

      - id: micro-behaviors/fs/chmod/executable/mode::jvm-file-setexecutable-bytecode
