# Archive-carried stages whose required sink launches a file as a process.
defaults:
  platforms: [windows]
  attack: T1204.002
composite_rules:
  - id: embedded-powershell-hidden-archive-exe-stager
    desc: Hidden PowerShell downloads and launches a TEMP archive executable
    crit: hostile
    conf: 0.99
    attack: T1059.001,T1105,T1140,T1564.003
    for: [javascript, typescript]
    all:
      - id: micro-behaviors/process/create/hidden::powershell-hidden-command-text
      - id: micro-behaviors/communications/http/download/cli::iwr-archive-url-download
      - id: micro-behaviors/data/archive/extract/zip::powershell-expand-archive
      - id: micro-behaviors/process/create/start-process::embedded-powershell-temp-exe
    near_bytes: 512
  - id: powershell-defender-disabled-passworded-archive-launch
    desc: Defender bypassed before passworded archive payload launch
    crit: hostile
    conf: 0.99
    attack: T1105,T1204.002,T1562.001
    mbc: B0030,E1562
    for: [powershell, batch]
    all:
      - id: micro-behaviors/os/security/defender::defender-disable-realtime
      - id: micro-behaviors/process/deploy::powershell-download-extract-and-execute
      - id: micro-behaviors/data/archive/extract/password::cli-passworded-archive-extraction
      - id: micro-behaviors/os/privilege/elevation::runas-verb
    near_lines: 40
  - id: powershell-defender-7z-hidden-dropper
    desc: PowerShell Defender exclusion 7-Zip hidden dropper
    crit: hostile
    conf: 0.99
    attack: T1562.001,T1105,T1204.002,T1564.003
    mbc: B0030
    for: [powershell]
    near_bytes: 8192
    all:
      - id: micro-behaviors/os/security/defender::defender-exclusion-command
      - id: micro-behaviors/communications/http/download/webclient::webclient-downloadfile-call
      - id: objectives/command-and-control/dropper/staging/archive::powershell-start-process-7z-extract-args
      - id: micro-behaviors/fs/enumerate/directory::powershell-recursive-file-enumeration
      - id: micro-behaviors/process/create/hidden::powershell-windowstyle-hidden-option
      - id: micro-behaviors/process/create/start-process::start-process-call

  # ClickFix fake-CAPTCHA stages commonly fetch a remote instruction stream,
  # evaluate it with IEX, then download and extract a payload under TEMP.
  # Requiring the full sequence keeps the hostile inference separate from
  # ordinary archive handling and from ordinary PowerShell web requests.
  - id: powershell-cloud-archive-programdata-exec
    for: [batch, powershell]
    desc: PowerShell cloud archive ProgramData execution
    crit: hostile
    conf: 0.96
    attack: T1105
    all:
      - id: objectives/command-and-control/dropper/staging/archive::powershell-expand-archive-programdata
      - id: micro-behaviors/process/deploy::powershell-download-extract-and-execute
    any:
      - id: objectives/command-and-control/infrastructure/cloud
