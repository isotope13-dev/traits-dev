defaults:
  for: [pe, dll]
  platforms: [windows]
  attack: T1105
  mbc: E1105

composite_rules:
- id: signed-urlmon-download-execute
  desc: Signed URLMon downloader executes payload
  for: [pe]
  crit: suspicious
  conf: 0.95
  size_max: 524288
  all:
  - id: micro-behaviors/communications/http/client/urlmon::branded-urlmon-downloader
  - id: micro-behaviors/os/security/auth/verify::winverifytrust-symbol
  any:
  - id: micro-behaviors/process/create/shellexec::shell-execute-ex
  - id: micro-behaviors/process/create/spawn::create-process-w
  downgrade:
    any:
    - id: well-known/game/steam/
    - id: metadata/signed/platform/
    - id: well-known/app/utility/yandex-pack::official-yandex-pack-downloader
- id: signed-downloader-with-host-recon
  desc: Signed downloader with session reconnaissance
  for: [pe]
  crit: hostile
  conf: 0.97
  size_max: 524288
  unless:
  - id: well-known/app/utility/yandex-pack::official-yandex-pack-downloader
  all:
  - id: micro-behaviors/communications/http/client/urlmon::branded-urlmon-downloader
  - id: micro-behaviors/os/security/auth/verify::winverifytrust-symbol
  - id: objectives/discovery/account/lookup::interactive-session-account-enumeration
  any:
  - id: micro-behaviors/process/create/shellexec::shell-execute-ex
  - id: micro-behaviors/process/create/spawn::create-process-w
  downgrade:
    any:
    - id: metadata/signed/platform/
- id: direct-ip-urlmon-wininet-exec-dropper
  desc: Direct-IP URLMon WinInet execute dropper
  crit: hostile
  conf: 0.97
  size_max: 524288
  all:
  - id: micro-behaviors/communications/ip/literal::external-ipv4-http-url
  - id: micro-behaviors/communications/http/client/urlmon::url-download-to-file
  any:
  - id: micro-behaviors/process/create/spawn::create-process-w
  - id: micro-behaviors/process/create/exec::create-process-a
  - id: micro-behaviors/process/create/shell/spawn::win-shellexecute
  - id: micro-behaviors/process/create/shellexec::shell-execute
  needs: 1
  unless:
  - id: metadata/binary/installer/family/
  - id: metadata/binary/installer/script/
  - id: metadata/binary/resource/identity::pe-version-resource
- id: browser-ua-direct-ip-payload-dropper
  desc: Browser-impersonating direct-IP payload dropper
  crit: hostile
  conf: 0.97
  size_max: 524288
  all:
  - id: direct-ip-urlmon-wininet-exec-dropper
  - id: objectives/command-and-control/channel/http-beacon::chrome-spoof-user-agent-pe
  any:
  - id: objectives/anti-analysis/debugger-detect/check::debugger-api
  - id: objectives/anti-analysis/timing/evasion::timing-delta-check
  - id: micro-behaviors/fs/delete/file/library::deletefile-w
  needs: 1
  unless:
  - id: metadata/binary/installer/family/
  - id: metadata/binary/installer/script/
  - id: metadata/binary/resource/identity::pe-version-resource
  # URLDownloadToFile + memory execution (urlmon-based dropper)
- id: urlmon-embedded-pe-exec-dropper
  desc: URLMon embedded payload execution dropper
  crit: hostile
  conf: 0.96
  size_max: 524288
  all:
  - id: micro-behaviors/communications/http/client/urlmon::url-download-to-file
  - id: micro-behaviors/process/create/launch::create-process-api-name
  - id: metadata/binary/layout/embedded::pe-embedded
  - id: metadata/binary/symbols/imports::pe-imports-max-80
  any:
  - id: micro-behaviors/os/api-resolution/manual::peb-export-resolver-x64
  - id: micro-behaviors/communications/http/client/wininet::internet-open
  - id: micro-behaviors/process/sync/mutex::open-mutex
  needs: 2
  unless:
  - id: metadata/binary/installer/family/
  - id: metadata/binary/installer/script/
  - id: metadata/binary/framework/
- id: urlmon-shell-execute-dropper
  desc: URLMon download and shell execute dropper
  crit: suspicious
  conf: 0.93
  size_max: 524288
  all:
  - id: micro-behaviors/communications/http/client/urlmon::url-download-to-file
  - id: micro-behaviors/process/create/system::shell-execute-ex-a
  - id: metadata/binary/symbols/imports::pe-imports-max-80
  any:
  - id: micro-behaviors/communications/http/client/wininet::internet-open
  - id: micro-behaviors/fs/path/library::wininet-dll-name-reference
  - id: micro-behaviors/mem/protect/modify::virtual-protect
  needs: 2
  unless:
  - id: metadata/binary/resource/identity::pe-version-resource
  - id: metadata/binary/installer/family/
- id: hostile-urlmon-sandbox-gated-stager
  desc: Sandbox-gated URLMon payload stager
  crit: hostile
  conf: 0.96
  size_max: 524288
  all:
  - id: micro-behaviors/communications/http/client/urlmon::urlmon-shellexecute-api-profile
  - id: micro-behaviors/process/enumerate/snapshot::toolhelp-process-enumeration
  - id: micro-behaviors/os/privilege/manifest::require-administrator
  - id: metadata/signed/trust-level::unsigned
  any:
  - id: metadata/binary/section/permission::wx-section
  - id: micro-behaviors/time/sleep/interval::sleep-dup
  unless:
  - id: metadata/binary/resource/identity::pe-version-resource
  - id: metadata/binary/installer/family/
  - id: metadata/binary/installer/script/
- id: packed-urlmon-shell-execute-dropper
  desc: Packed URLMon shell-execute payload dropper
  crit: hostile
  conf: 0.95
  size_max: 524288
  all:
  - id: micro-behaviors/communications/http/client/urlmon::url-download-to-file
  - id: micro-behaviors/process/create/system::shell-execute-ex-a
  - id: metadata/binary/section/label::upx-section-pair
  any:
  - id: micro-behaviors/communications/http/client/wininet::internet-open
  - id: micro-behaviors/mem/protect/modify::virtual-protect
  - id: micro-behaviors/dylib/lookup::get-proc-address-import
  - id: micro-behaviors/dylib/load/runtime::load-library-a
  - id: micro-behaviors/fs/delete/file/command::slash-c-del-fragment
  - id: objectives/anti-static/obfuscation/string/delimiter::repeated-xhash-overlay-delimiter
  needs: 2
  unless:
  - id: metadata/binary/resource/identity::pe-version-resource
  - id: metadata/binary/installer/family/
  # A loader config block that names URLDownloadToFileA beside a bare WinExec
  # string with neither imported: both APIs resolve dynamically, so every
  # import-gated downloader rule goes dark while the binary still fetches
  # cleartext executables (here five numbered payloads with svchost-mimic
  # drop names). No size bound: the block rides in large bundles too.
- id: dynamic-urlmon-winexec-exe-dropper
  desc: Dynamically-resolved URLMon download and WinExec dropper
  crit: hostile
  conf: 0.95
  all:
  - id: micro-behaviors/communications/http/client/urlmon::url-download-to-file
  - id: micro-behaviors/os/api-resolution/dynamic::winexec-resolved-name
  - id: micro-behaviors/communications/http/download/url::cleartext-executable-url-reference-pe
  - id: micro-behaviors/communications/ip/literal::external-ipv4-host-literal-binary
  unless:
  - id: metadata/binary/installer/family/
