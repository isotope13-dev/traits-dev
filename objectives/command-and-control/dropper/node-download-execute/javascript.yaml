defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]

composite_rules:
  - id: node-rc4-hidden-download-execute-stage
    desc: RC4 Node loader executes hidden stage
    crit: hostile
    conf: 0.995
    attack: T1027,T1059.007,T1105,T1070.004
    mbc: B0024,B0032
    near_bytes: 12288
    all:
      - id: micro-behaviors/data/source/dynamic/reflect::helper-call-network-process-module-names
      - id: micro-behaviors/process/create/spawn::bare-spawn-call
      - id: micro-behaviors/fs/delete/file/library::fs-unlinkSync
      - id: micro-behaviors/crypto/symmetric/stream/rc4::js-rc4-implementation
      - id: micro-behaviors/process/create/minified-spawn::detached-bang-true
      - id: micro-behaviors/process/create/minified-spawn::windowshide-bang-true
      - id: micro-behaviors/process/daemonize/detach::node-handle-unref-text
    unless:
      - id: metadata/package/testing/
      - id: well-known/tool/detection/
