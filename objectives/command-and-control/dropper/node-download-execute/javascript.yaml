defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]

traits:
  - id: node-helper-wrapped-https-name
    desc: Helper resolves Node HTTPS module
    crit: component
    if:
      type: text
      regex: '\b[\w$]{1,16}\(["'']https["'']\)'

  - id: node-helper-wrapped-child-process-name
    desc: Helper resolves child process module
    crit: component
    if:
      type: text
      regex: '\b[\w$]{1,16}\(["'']child_process["'']\)'

  - id: node-stage-pipe-symbol
    desc: Node stage pipe identifier
    crit: component
    if:
      type: symbol
      kind: identifier
      exact: pipe

  - id: node-stage-spawn-symbol
    desc: Node stage spawn identifier
    crit: component
    if:
      type: symbol
      kind: identifier
      exact: spawn

  - id: node-stage-unlink-symbol
    desc: Node stage unlink identifier
    crit: component
    if:
      type: symbol
      kind: identifier
      exact: unlinkSync

composite_rules:
  - id: node-helper-wrapped-network-process-imports
    desc: Helper resolves Node network and process modules
    crit: component
    conf: 0.95
    near_bytes: 256
    all:
      - id: node-helper-wrapped-https-name
      - id: node-helper-wrapped-child-process-name

  - id: node-stage-stream-spawn-cleanup-symbols
    desc: Node stream, spawn, and cleanup symbols
    crit: component
    conf: 0.93
    all:
      - id: node-stage-pipe-symbol
      - id: node-stage-spawn-symbol
      - id: node-stage-unlink-symbol

  - id: node-rc4-hidden-download-execute-stage
    desc: RC4 Node loader executes hidden stage
    crit: hostile
    conf: 0.995
    attack: T1027,T1059.007,T1105,T1070.004
    mbc: B0024,B0032
    near_bytes: 12288
    all:
      - id: node-helper-wrapped-network-process-imports
      - id: node-stage-stream-spawn-cleanup-symbols
      - id: micro-behaviors/data/encode/rc4::js-rc4-implementation
      - id: micro-behaviors/process/create/spawn-minified::detached-bang-true
      - id: micro-behaviors/process/create/spawn-minified::windowshide-bang-true
      - id: micro-behaviors/process/daemonize/detach::node-handle-unref-text
    unless:
      - id: metadata/package/testing/
      - id: well-known/tool/detection/
