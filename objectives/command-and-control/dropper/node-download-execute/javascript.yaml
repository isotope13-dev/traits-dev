defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]

composite_rules:
  - id: node-rc4-hidden-download-execute-stage
    desc: RC4 Node loader executes hidden stage
    crit: hostile
    conf: 0.995
    attack: T1027,T1059.007,T1105,T1070.004
    mbc: B0024,B0032
    near_bytes: 12288
    all:
      - id: metadata/lang/source/syntax/call/relationship::nearby-https-child-process-string-calls
      - id: metadata/lang/source/syntax/call/relationship::bare-spawn-call
      - id: micro-behaviors/fs/delete/file/library::fs-unlinkSync
      - id: micro-behaviors/crypto/symmetric/stream/rc4::js-rc4-implementation
      - id: metadata/file/profile/command-options::detached-true
      - id: metadata/file/profile/command-options::node-windowshide-true-option
      - id: micro-behaviors/process/control/wait::node-unref-handle
    unless:
      - id: metadata/path/directory::test-directory-component
