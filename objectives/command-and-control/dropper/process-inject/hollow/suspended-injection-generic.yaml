# Language-neutral suspended-process injection (process hollowing / run-PE).
#
# The classic sequence: create a process in a suspended state, write a payload
# into its address space, then resume its thread so the injected code runs
# under a trusted image. The three roles together — CREATE_SUSPENDED, a
# remote-memory write (VirtualAllocEx / WriteProcessMemory), and a thread
# resume — have no benign reading; ordinary software does not suspend another
# process to write code into it. Kept cross-language (the Midnight
# Blizzard-linked CornFlake backdoor does this from Go via
# syscall.MustFindProc) so a rebuild in another language is still caught.
defaults:
  platforms: [windows]
  attack: T1055.012
  mbc: E1055

composite_rules:
  - id: suspended-injection-remote-write
    desc: Remote-process memory write primitive
    crit: component
    conf: 0.9
    any:
      - id: micro-behaviors/mem/alloc/remote::virtual-alloc-ex-dup
      - id: micro-behaviors/process/inject/runtime/call::write-process-memory-text
      - id: micro-behaviors/process/inject/runtime/call::write-process-memory-binary
      - id: micro-behaviors/process/inject/runtime/call::write-process-memory-source
      - id: micro-behaviors/process/inject/runtime/call::write-process-memory-script

  - id: suspended-injection-thread-resume
    desc: Thread resume primitive
    crit: component
    conf: 0.9
    any:
      - id: micro-behaviors/process/info/thread::resume-thread
      - id: micro-behaviors/process/info/thread::resume-thread-source

  - id: suspended-process-injection
    desc: Suspended-process injection (hollowing)
    crit: hostile
    conf: 0.95
    for: [go, rust, c, cpp, csharp, pe, dll, powershell]
    all:
      - id: micro-behaviors/process/create/flags::create-suspended-flag-reference
      - id: suspended-injection-remote-write
      - id: suspended-injection-thread-resume
    unless:
      - id: metadata/signed/platform/
      # thcrap launches games suspended and injects its patcher DLL by design.
      - id: well-known/game/mod::thcrap-source-tree
      # Corvus ships a catalogue of Windows API annotations (suspended-process
      # creation, remote writes, thread resume) as string data; it executes nothing.
      - id: well-known/tool/reverse-engineering/corvus::corvus-reverse-engineering-tool
    # The .NET hollowing rule (unmap + thread context) is the specific
    # claim for this injection; step down when it fires.
    downgrade:
      any:
        - id: objectives/evasion/process/injection/hollowing/process::dotnet-process-hollowing
        - id: suspended-launch-loadlibrary-thread

  # Launch-time DLL injection: the remote write is a DLL path started by a
  # CreateRemoteThread(LoadLibrary) thread, with no context rewrite or
  # section unmap. Detours-style loaders and game mods do this; the
  # remote-loadlibrary rules make the specific injection claim.
  - id: suspended-launch-loadlibrary-thread
    desc: Remote LoadLibrary thread, no hollowing
    crit: notable
    conf: 0.85
    all:
      - id: micro-behaviors/process/inject/dll::create-remote-thread-source
    any:
      - id: micro-behaviors/dylib/load/source::load-library-a-source
      - id: micro-behaviors/dylib/load/source::load-library-w-source-reference
      - id: micro-behaviors/dylib/load/runtime::load-library-w
    unless:
      - id: micro-behaviors/process/info/thread::thread-context-write-source
      - id: micro-behaviors/process/info/thread::set-thread-context
      - id: micro-behaviors/mem/unmap::native-section-unmap-api-references
      - id: micro-behaviors/os/callback/apc::queue-user-apc
