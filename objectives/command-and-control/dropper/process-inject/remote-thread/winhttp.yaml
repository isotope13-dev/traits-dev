defaults:
  platforms: [windows]
  for: [pe, dll]
  mbc: E1105
  crit: hostile
  conf: 0.995
composite_rules:
- id: unsigned-winhttp-remote-thread-stager
  desc: Unsigned WinHTTP downloader that executes a remote memory stage
  attack: "T1055,T1055.001,T1105"
  size_max: 524288
  all:
  - id: micro-behaviors/communications/http/client/winhttp::winhttp-request-response-flow
  - id: metadata/signed/trust-level::unsigned-missing-signature-record
  - id: micro-behaviors/mem/combined::remote-process-memory-api-cluster
  - id: micro-behaviors/process/inject/remote-thread::remote-thread-api-reference
  unless:
  - id: metadata/signed/platform/
  - id: metadata/binary/installer/family/
  - id: metadata/binary/installer/script/

- id: winhttp-remote-thread-manual-map-stager
  desc: WinHTTP stager with remote LdrLoadDll stubs
  attack: "T1055,T1055.012,T1105"
  all:
  - id: micro-behaviors/process/inject/remote-thread::unsigned-winhttp-startupinfoex-remote-thread-profile
  - id: micro-behaviors/process/inject/runtime/call::rdata-remote-thread-four-arg-adapter-x64
  - id: micro-behaviors/process/inject/runtime/call::rdata-remote-tls-callback-runner-x64
  unless:
  - id: metadata/signed/platform/
