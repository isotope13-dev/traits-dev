# RC4 and WinINet evidence accompanies a remote-thread injection sink.
defaults:
  crit: hostile
  for: [pe, dll]
  platforms: [windows]
  mbc: B0023
  attack: T1140
composite_rules:
  - id: rc4-wininet-remote-injector
    desc: RC4 WinInet payload and remote injection
    conf: 0.99
    mbc: E1055
    all:
      - id: micro-behaviors/crypto/symmetric/stream/rc4::rc4-strings
      - id: micro-behaviors/communications/http/client/wininet::wininet-http-flow
      - id: micro-behaviors/process/inject/runtime/call::remote-alloc-write-thread-api-set
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/installer/family/
      - id: well-known/tool/reverse-engineering/
