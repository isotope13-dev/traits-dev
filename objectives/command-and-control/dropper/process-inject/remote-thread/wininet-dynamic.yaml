defaults:
  platforms: [windows]
composite_rules:
- id: unsigned-wininet-dynamic-remote-thread-stager
  desc: Unsigned WinINet-dynamic downloader that executes a remote memory stage
  crit: hostile
  conf: 0.95
  attack: "T1055,T1055.001,T1105"
  mbc: E1105
  for: [pe, dll]
  size_max: 524288
  all:
  - id: micro-behaviors/communications/http/client/wininet::dynamic-wininet-api-set--internetopenurla
  - id: metadata/signed/trust-level::unsigned-missing-signature-record
  - id: micro-behaviors/process/inject/runtime/call::remote-process-memory-api-cluster
  - id: micro-behaviors/process/inject/runtime/call::create-remote-thread-dup
  unless:
  - id: metadata/signed/platform/
  - id: metadata/binary/installer/family/
  - id: metadata/binary/installer/script/
