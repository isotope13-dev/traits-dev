# MinGW payload decryptor with required cross-process injection evidence.
defaults:
  platforms: [windows]
  for: [pe, dll]
  attack: T1027.007,T1055.012
  mbc: E1105
composite_rules:
  - id: mingw-encrypted-payload-dropper
    desc: MinGW dropper with encrypted payload and injection
    crit: hostile
    conf: 0.95
    size_min: 65536
    all:
      - id: metadata/lang/compiler/native::mingw-built-pe
      - id: micro-behaviors/crypto/symmetric/xor/loop::x86-byte-xor-terminator-loop
      - id: metadata/binary/layout/tls::pe-multiple-tls-callbacks
    # The injection leg has to prove a write into ANOTHER process. It used to be
    # the bare directory `objectives/evasion/process/injection/hollowing`, whose
    # cheapest member (`thread-context-apis`) is satisfied by a lone
    # GetThreadContext/SetThreadContext import -- and mingw-w64's winpthreads
    # imports exactly that quartet (SuspendThread, GetThreadContext,
    # SetThreadContext, ResumeThread) to implement pthread_cancel. Every
    # MinGW-built, threaded PE therefore satisfied it: the other three legs are
    # also unavoidable there (GCC emits the TLS callbacks, and any string hash
    # is an x86 byte-XOR loop), so the whole hostile rule reduced to "built by
    # MinGW", which is how SciPy's Cython extensions came in as droppers.
    # Remote allocation, a cross-process write, or unmapping the host image are
    # the operations a dropper actually needs and winpthreads never performs.
    any:
      - id: micro-behaviors/process/inject/runtime/call::write-process-memory-dup
      - id: micro-behaviors/mem/alloc/remote::virtual-alloc-ex
      - id: objectives/evasion/process/injection/hollowing/process::unmap-section-apis
    needs: 1
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/installer/family/
      - id: metadata/binary/symbols/count::many-exports
      - id: well-known/lib/media/videolan::vlc-plugin-dll-path
      - id: well-known/lib/media/videolan::vlc-known-plugin-dll-name
      - id: objectives/command-and-control/dropper/staging/encrypted::hashcat-archive-exe-path
      - id: well-known/tool/development/build/flow-bin/
      - id: well-known/dual-use/transfer/aria2::aria2-downloader-context
