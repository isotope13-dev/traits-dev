# Browser dropper staging an encrypted archive: the page carries a
# password-protected ZIP as an inline Base64 blob, rebuilds it client-side
# into a Blob (byte-array decode chain), and forces a save through a legacy
# Blob-save API or a synthesised anchor download. The lure shows the victim
# the archive password, and fingerprint-gated, obfuscated staging keeps
# sandboxes from seeing the payload. No legitimate export flow ships an
# encrypted archive this way: client-side ZIP exporters (JSZip/FileSaver)
# build the archive in code from user data, carry no encrypted entries, and
# save on a user gesture rather than a decoder-table sink.
defaults:
  platforms: [windows, unix]
  for: [html, javascript]
  attack: T1189
composite_rules:
  - id: encrypted-archive-mssave-dropper
    desc: Encrypted archive rebuilt for legacy save
    crit: hostile
    conf: 0.97
    all:
      - id: metadata/file/encoding/compression::base64-zip-encrypted-entry
      - id: micro-behaviors/data/buffer/alloc::uint8array-to-blob-materialization
    any:
      - id: micro-behaviors/communications/http/download/handler::browser-ms-save-blob
      - id: micro-behaviors/communications/http/download/handler::browser-ms-save-or-open-blob
      - id: micro-behaviors/communications/http/download/handler::browser-ms-save-or-open-blob-bracket
      - id: micro-behaviors/communications/http/download/handler::browser-ms-save-or-open-blob-hex
  - id: encrypted-archive-anchor-download-dropper
    desc: Encrypted archive rebuilt for anchor download
    crit: hostile
    conf: 0.96
    all:
      - id: metadata/file/encoding/compression::base64-zip-encrypted-entry
      - id: micro-behaviors/data/buffer/alloc::uint8array-to-blob-materialization
    any:
      - id: micro-behaviors/communications/http/download/browser::quoted-download-click-strings
      - id: micro-behaviors/communications/http/download/browser::js-scripted-anchor-download
