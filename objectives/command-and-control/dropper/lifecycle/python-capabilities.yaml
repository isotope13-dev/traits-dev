defaults:
  platforms: [unix, windows]
  for: [python]
composite_rules:
  - id: python-write-capability
    desc: Python file write capability
    crit: component
    conf: 0.8
    any:
      - id: micro-behaviors/fs/write/file/handle::python-open-write-binary
      - id: micro-behaviors/fs/write/file/response-body::python-write-response-content
      - id: micro-behaviors/fs/write/file/handle::py-inline-write-executable-path
  - id: python-exec-capability
    desc: Python execution capability
    crit: component
    conf: 0.8
    any:
      - id: micro-behaviors/process/create/shell/
      - id: micro-behaviors/process/create/subprocess/
      - id: micro-behaviors/process/create/direct/
