defaults:
  platforms: [unix, windows]
  for: [python]

composite_rules:
- id: dynamic-dropper
  desc: Stealer data source near staged payload
  crit: notable
  conf: 0.98
  mbc: "B0023"
  attack: "T1059"
  near_lines: 120
  all:
  - id: objectives/credential-access/credential-manager/secret-storage::credential-acquisition-objective-indicators
  any:
  - id: objectives/command-and-control/dropper/staging/
  - id: objectives/execution/staging/reconstruct::python-marshal-reconstruction-pyc-write
  - id: metadata/file/profile/staging::shell-wget-tmp-chmod-exec
  - id: metadata/binary/layout/overlay::unverified-certificate-carrier-multi-pe-overlay
  - id: micro-behaviors/os/module/resource::resource-temp-shellexec-api-profile
  - id: objectives/supply-chain/hidden-payload/
