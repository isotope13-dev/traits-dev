defaults:
  platforms: [unix, windows]
  for: [python]

composite_rules:
  - id: dynamic-dropper
    desc: Stealer data source near staged payload
    crit: notable
    conf: 0.98
    mbc: "B0023"
    attack: "T1059"
    near_lines: 120
    all:
      - id: objectives/credential-access/theft/multi-store::stealer-data-source-marker
    any:
      - id: objectives/command-and-control/dropper/staging/
      - id: objectives/supply-chain/hidden-payload/
    unless:
      - id: well-known/lib/ai/pyaigis/
      - id: well-known/lib/native/glibc
      - id: well-known/tool/detection/proxy-sandbox
      - id: micro-behaviors/crypto/library/blockchain/
      - id: objectives/exfiltration/stealer/token/
      - id: objectives/exfiltration/stealer/cloud/
