# Android staged loader using a hidden asset DEX and reflective classloader patching.
defaults:
  platforms: [android]
  for: [apk, zip]
  crit: suspicious
  conf: 0.95
  attack: "T1406"

traits:
  - id: firebase-messaging-event
    desc: Firebase messaging event service
    crit: suspicious
    conf: 0.8
    if:
      type: text
      exact: "com.google.firebase.MESSAGING_EVENT"

  - id: cleartext-traffic-enabled
    desc: Android app allows cleartext traffic
    crit: suspicious
    conf: 0.8
    if:
      type: text
      exact: "usesCleartextTraffic"
    unless:
      - id: well-known/app/utility/cachesweeper::cachesweeper-app
      - id: well-known/app/utility/cachesweeper::cachesweeper-dex


  - id: connectivity-change-receiver
    desc: Receiver watches connectivity changes
    crit: suspicious
    conf: 0.84
    if:
      type: text
      exact: "android.net.conn.CONNECTIVITY_CHANGE"

  - id: wake-lock-permission
    desc: Wake lock permission requested
    crit: suspicious
    conf: 0.8
    if:
      type: text
      exact: "android.permission.WAKE_LOCK"
    unless:
      - id: well-known/app/system/ankidroid::package-member
      - id: well-known/app/system/ankidroid::ankidroid-package-string
  - id: post-notifications
    desc: Notification posting permission requested
    crit: suspicious
    conf: 0.78
    if:
      type: text
      exact: "android.permission.POST_NOTIFICATIONS"

  - id: obfuscated-gc-namespace-burst
    desc: Repeated short obfuscated tk.gc classes
    crit: suspicious
    conf: 0.96
    if:
      type: yara
      source: |
        rule obfuscated_gc_namespace_burst {
          strings:
            $a = /tk\.gc\.[A-Za-z]{1,5}/ ascii wide
          condition:
            #a >= 20
        }

  - id: loader-manifest-control-yara
    desc: Obfuscated loader manifest control surface
    crit: suspicious
    conf: 0.995
    if:
      type: yara
      source: |
        rule loader_manifest_control_surface {
          strings:
            $a = "com.google.firebase.MESSAGING_EVENT" ascii wide
            $b = "android.permission.FOREGROUND_SERVICE" ascii wide
            $c = "android.permission.READ_EXTERNAL_STORAGE" ascii wide
            $d = "android.permission.WRITE_EXTERNAL_STORAGE" ascii wide
            $e = "android.net.conn.CONNECTIVITY_CHANGE" ascii wide
            $f = "android.permission.WAKE_LOCK" ascii wide
            $g = "usesCleartextTraffic" ascii wide
            $h = "android.permission.POST_NOTIFICATIONS" ascii wide
            $ns = /tk\.gc\.[A-Za-z]{1,5}/ ascii wide
          condition:
            $a and $b and $c and $d and $e and 1 of ($f,$g,$h) and #ns >= 20
        }

  - id: reflective-loader-cluster-marker
    desc: Obfuscated staged loader class markers
    crit: suspicious
    conf: 0.98
    if:
      type: text
      substr: "scnl.eift2kiuh"

  - id: encoded-loader-control-strings
    desc: Encoded Android loader control strings
    crit: suspicious
    conf: 0.98
    for: [apk]
    if:
      type: yara
      source: |
        rule encoded_loader_control_strings {
          strings:
            $a = "bmd5Ym1h" ascii
            $b = "bXNiaGd0Zw" ascii
            $c = "bUluaXRpYWxBcHBsaWNhdGlvbg" ascii
          condition:
            all of them
        }

composite_rules:
  - id: staged-dex-loader
    desc: APK hides and loads a second-stage DEX from assets
    crit: hostile
    conf: 0.995
    mbc: "B0030"
    all:
      - id: micro-behaviors/process/create/loader::reflective-classloader-patch
      - id: micro-behaviors/process/create/loader::hidden-dex-write

  # The same objective as `staged-dex-loader` reached a different way, which is
  # why that rule does not cover these: it requires the classic
  # BaseDexClassLoader / dexElements / pathList patching triad, and this variant
  # never touches dexElements. It copies a payload out of the APK's own assets
  # into the app's private files directory and then swaps the thread context
  # classloader to pick it up, with setAccessible() clearing the way.
  #
  # Reading assets, writing to getFilesDir() and using a ClassLoader are each
  # ordinary on their own -- plugin hosts and dynamic-feature apps do all three.
  # What is not ordinary is doing them together *and* reaching through
  # reflection to defeat member visibility while re-pointing the loader: a
  # legitimate dynamic-feature app uses the framework's own APIs and has no
  # reason to bypass access checks to install its code path.
  # The `any:` group is what makes the claim checkable. Every `all:` leg is a
  # plain substring hit in the merged DEX -- `getAssets`, `getFilesDir`,
  # `Ljava/io/FileOutputStream;`, `setContextClassLoader`, `Ljava/lang/ClassLoader;`
  # and `setAccessible` -- and a DEX pools the strings of the app *and every
  # bundled library* into one sorted table, so co-presence says nothing about
  # whether one class does all six (and byte proximity is meaningless there).
  # Gson or Retrofit supplies `setAccessible`, any library supplies the rest.
  # Eleven of the corpus's Android samples matched on that alone: Mullvad VPN,
  # NewPipe, RustDesk, shadowsocks-android, SD Maid SE and friends -- none of
  # which referenced a single dynamic-code-loading API. "Swaps the classloader
  # to pick the payload up" requires a class that can load a DEX; if none of
  # these is present, no staged code can be loaded and the objective is unmet.
  - id: asset-staged-context-classloader-loader
    for: [apk, zip, dex]
    desc: APK stages an asset and swaps the classloader
    crit: hostile
    conf: 0.97
    mbc: "B0030"
    all:
      - id: micro-behaviors/process/create/loader::dalvik-get-assets-call
      - id: micro-behaviors/process/create/loader::dalvik-get-files-dir-call
      - id: micro-behaviors/process/create/loader::dalvik-file-output-stream-class
      - id: micro-behaviors/process/create/loader::android-context-classloader-setter
      - id: micro-behaviors/process/create/loader::dalvik-classloader-descriptor
      - id: micro-behaviors/process/create/loader::reflective-access-bypass
      - id: micro-behaviors/process/create/loader::dynamic-dex-loading-api

  - id: obfuscated-push-control-manifest
    desc: Obfuscated manifest with push control hooks
    crit: suspicious
    conf: 0.98
    all:
      - id: firebase-messaging-event
      - id: obfuscated-gc-namespace-burst
    any:
      - id: micro-behaviors/os/service/daemon::android-foreground-service-permission
      - id: connectivity-change-receiver
      - id: cleartext-traffic-enabled
      - id: wake-lock-permission
      - id: micro-behaviors/os/privilege/manifest::read-external-storage
      - id: micro-behaviors/os/privilege/manifest::write-external-storage
      - id: post-notifications
    needs: 3

  - id: staged-loader-manifest-control-surface
    desc: Staged loader manifest with background control surface
    crit: hostile
    conf: 0.99
    all:
      - id: loader-manifest-control-yara
      - id: obfuscated-gc-namespace-burst

  - id: staged-loader-dex-cluster
    desc: Reflective staged loader with obfuscated class cluster
    crit: hostile
    conf: 0.995
    all:
      - id: micro-behaviors/process/create/loader::reflective-dex-loader-member
      - id: reflective-loader-cluster-marker

  # The 11 generic AssetManager/Base64/reflection dalvik APIs are captured by
  # micro-behaviors/process/create/loader::asset-inflater-reflective-loader
  # (suspicious). Alone they appear in benign apps, so hostile only when paired
  # with a large opaque extensionless staged asset.
  - id: android-asset-payload-reflective-apk
    desc: APK asset payload reflective loader
    crit: hostile
    conf: 0.995
    all:
      - id: micro-behaviors/process/create/loader::asset-inflater-reflective-loader
      - id: objectives/command-and-control/dropper/staging/archive::apk-opaque-extensionless-asset

  - id: encoded-android-native-stage-loader
    for: [android_apk, zip, elf]
    desc: Encoded Android loader with native stage writer
    crit: hostile
    conf: 0.995
    all:
      - id: micro-behaviors/process/create/loader::encoded-application-swap-loader
      - id: micro-behaviors/process/create/loader::obfuscated-jni-stage-writer
      - id: objectives/anti-static/obfuscation/payload/encrypted::elf-encrypted-dropper

  - id: encoded-delimited-native-stage-loader
    for: [android_apk, zip, elf]
    desc: Delimited encoded Android loader with native stage writer
    crit: hostile
    conf: 0.995
    all:
      - id: micro-behaviors/process/create/loader::encoded-delimited-application-swap-loader
      - id: micro-behaviors/process/create/loader::obfuscated-jni-stage-writer
      - id: objectives/anti-static/obfuscation/payload/encrypted::elf-encrypted-dropper

  - id: encoded-hqjgwjslwxj-native-stage-loader
    for: [android_apk, zip, elf]
    desc: Delimited encoded Android loader with native stage writer
    crit: hostile
    conf: 0.995
    all:
      - id: micro-behaviors/process/create/loader::encoded-hqjgwjslwxj-application-swap-loader
      - id: micro-behaviors/process/create/loader::android-native-embedded-dex-loader
      - id: objectives/anti-static/obfuscation/payload/encrypted::elf-encrypted-dropper

  - id: android-native-encrypted-stage-writer
    for: [android_apk, zip, elf]
    desc: Android native library writes encrypted stage payload
    crit: hostile
    conf: 0.995
    all:
      - id: micro-behaviors/process/create/loader::obfuscated-jni-stage-writer
      - id: objectives/anti-static/obfuscation/payload/encrypted::elf-encrypted-dropper

  - id: staged-loader-with-push-control
    desc: Staged Android loader with push and background control hooks
    crit: hostile
    conf: 0.99
    all:
      - id: staged-dex-loader
      - id: firebase-messaging-event
    any:
      - id: micro-behaviors/os/service/daemon::android-foreground-service-permission
      - id: connectivity-change-receiver
      - id: cleartext-traffic-enabled
    needs: 2

  - id: android-opaque-asset-dex-loader
    desc: Android opaque asset DEX loader
    crit: suspicious
    conf: 0.97
    for: [apk, binaries, zip]
    ref: sha256:093c727149837d576d10f843edce933436efe648e74b9008ccd91badf197fc5c
    scope: outer
    all:
      - id: metadata/package/files/mobile-package::android-apk-opaque-loader-layout
      - id: micro-behaviors/process/create/loader::dynamic-dex-loading
      - id: micro-behaviors/data/archive/extract/zip::jvm-zipfile-class-reference
    any:
      - id: micro-behaviors/process/lifecycle/runtime-init::attach-base-context
      - id: micro-behaviors/data/decompress/gzip::gzip-decompress
      - id: micro-behaviors/fs/write/file/handle::jvm-fileoutputstream-bytecode
    downgrade:
      all:
        - id: micro-behaviors/os/telemetry/activity::appsflyer-event-endpoint
        - id: metadata/package/files/mobile-package::apk-multiple-secondary-dex
        - id: metadata/package/files/mobile-package::apk-face-landmarker-model
    needs: 2

  # If an encrypted member prevents archive expansion, the outer APK still
  # exposes the loader carrier shape. Keep this as an archive-level fallback;
  # the DEX-specific composites above remain the stronger behavioral findings.
  - id: android-encrypted-opaque-loader-carrier
    desc: APK hides a loader behind encrypted and opaque archive members
    crit: hostile
    conf: 0.98
    attack: T1027,T1406
    all:
      - id: micro-behaviors/data/archive/member::archive-encrypted-member
      - id: objectives/anti-static/pack/archive::apk-large-member-set
      - id: objectives/command-and-control/dropper/delivery/download::android-opaque-asset-bundle

  - id: android-in-memory-dex-startup-loader
    desc: Android startup loader executes an asset-backed in-memory DEX
    crit: hostile
    conf: 0.995
    attack: T1027,T1129,T1406
    for: [apk, zip, dex]
    all:
      - id: micro-behaviors/process/create/loader::android-in-memory-asset-dex-loader
      - id: micro-behaviors/process/create/loader::android-application-classloader-hijack

  - id: android-in-memory-dex-private-stage
    desc: Android loader stages a compressed asset payload before DEX execution
    crit: hostile
    conf: 0.995
    attack: T1027,T1129,T1406
    for: [apk, zip, dex]
    all:
      - id: micro-behaviors/process/create/loader::android-in-memory-asset-dex-loader
      - id: micro-behaviors/process/create/loader::android-private-asset-payload-stager

  - id: android-reflective-dex-bootstrap-hijack
    desc: Android reflectively replaces the application classloader with staged code
    crit: hostile
    conf: 0.995
    attack: T1129,T1406
    for: [apk, zip, dex]
    all:
      - id: micro-behaviors/process/create/loader::android-application-classloader-hijack
      - id: micro-behaviors/process/create/loader::android-private-asset-payload-stager

  - id: android-opaque-loader-control-surface
    for: [android_apk, zip, xml]
    desc: Hidden Android loader with install and storage control
    crit: hostile
    conf: 0.995
    attack: T1129
    all:
      - id: android-opaque-asset-dex-loader
      - id: micro-behaviors/os/package-manager/sideload::android-request-install-packages-permission
      - id: micro-behaviors/os/privilege/manifest::manage-external-storage
      - id: micro-behaviors/os/privilege/paths::android-root-check
    any:
      - id: micro-behaviors/os/privilege/manifest::bind-notification-listener
      - id: micro-behaviors/os/privilege/manifest::package-usage-stats

  - id: android-dex-zip-native-loader
    desc: Android staged DEX/native loader with an opaque payload asset
    crit: suspicious
    conf: 0.97
    for: [apk, binaries]
    ref: sha256:093c727149837d576d10f843edce933436efe648e74b9008ccd91badf197fc5c
    all:
      - id: micro-behaviors/process/create/loader::dynamic-dex-and-native-loading
      - id: micro-behaviors/data/archive/extract/zip::jvm-zipfile-class-reference
      - id: micro-behaviors/process/lifecycle/runtime-init::attach-base-context
    any:
      - id: metadata/package/files/mobile-package::android-apk-opaque-loader-layout
      - id: metadata/package/files/mobile-package::apk-asset-dex-member
    unless:
      - id: metadata/package/files/mobile-package::appsflyer-internal-opaque-asset-member

  - id: android-split-native-loader-bundle
    desc: Android split native loader bundle
    crit: suspicious
    conf: 0.96
    for: [apk, binaries, zip]
    ref: sha256:093c727149837d576d10f843edce933436efe648e74b9008ccd91badf197fc5c
    scope: outer
    all:
      - id: metadata/package/files/mobile-package::xapk-opaque-consonant-jni-split-pair
      - id: micro-behaviors/process/create/loader::dynamic-dex-and-native-loading
      - id: micro-behaviors/data/archive/extract/zip::jvm-zipfile-class-reference
    any:
      - id: micro-behaviors/process/lifecycle/runtime-init::attach-base-context
      - id: micro-behaviors/os/privilege/paths::android-root-check
      - id: micro-behaviors/process/create/spawn::java-runtime-exec-bytecode
    needs: 1
