defaults:
  platforms: [windows, unix]
  for: [html, javascript]
  attack: T1105
traits:
  - id: repeated-image-extension-script-load
    desc: Repeated script loads use image extensions
    crit: suspicious
    conf: 0.94
    count_min: 2
    # A derived trait re-runs the source matcher and does not inherit its
    # unless. Alert-probe corpora repeat image-extension script tags as
    # test vectors; the same suppressors keep this from outliving the atom.
    unless:
      - id: metadata/lang/source/syntax/call::markup-or-decoded-alert-calls
      - id: "metadata/file/naming::test-directory-component"
      - id: metadata/package/testing/presence/
    if:
      id: micro-behaviors/communications/http/client/resource::image-extension-script-source
composite_rules:
  - id: image-script-stage-hides-errors
    desc: Image-extension script stage hides errors
    crit: hostile
    conf: 0.97
    near_bytes: 400
    all:
      - id: repeated-image-extension-script-load
      - id: micro-behaviors/data/control-flow/error-handling::onerror-after-return-true
