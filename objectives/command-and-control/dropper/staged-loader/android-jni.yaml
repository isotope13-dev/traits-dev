# Native JNI helpers that decrypt a DEX, write it, then load it.
defaults:
  platforms: [android]
  for: [elf]
  attack: T1406,T1027
  mbc: B0030

composite_rules:
  - id: jni-cipher-dex-classloader-writer
    desc: JNI decrypts DEX then loads it
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/process/create/loader::dex-classloader-jni-ctor
      - id: micro-behaviors/crypto/library/provider::cipher-class
      - id: micro-behaviors/process/create/loader::jni-file-output-stream

  - id: jni-cipher-dexpathlist-writer
    desc: JNI decrypts DEX into DexPathList
    crit: hostile
    conf: 0.97
    all:
      - id: micro-behaviors/process/create/loader::dex-path-list-element
      - id: micro-behaviors/crypto/library/provider::cipher-class
      - id: micro-behaviors/process/create/loader::jni-file-output-stream

  - id: jni-dex-classloader-pathlist-writer
    desc: JNI writes DEX then patches PathList
    crit: hostile
    conf: 0.97
    all:
      - id: micro-behaviors/process/create/loader::dex-classloader-jni-ctor
      - id: micro-behaviors/process/create/loader::dex-path-list-element
      - id: micro-behaviors/process/create/loader::jni-file-output-stream
