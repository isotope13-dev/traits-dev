defaults:
  platforms: [android]
  for: [java, kotlin]
  attack: T1027,T1140,T1627.001

composite_rules:
  - id: android-asset-xor-gzip-dex-loader
    desc: Android loader XOR-decodes and GZIP-expands an asset before dynamic DEX loading
    crit: suspicious
    conf: 0.99
    all:
      - id: micro-behaviors/fs/file/open::android-asset-open-source
      - id: micro-behaviors/crypto/symmetric/xor/loop::java-indexed-byte-scalar-xor
      - id: micro-behaviors/data/compress/library::gzip-byte-array-input-source
      - id: micro-behaviors/process/create/loader::dex-class-loader-source
    near_lines: 48
