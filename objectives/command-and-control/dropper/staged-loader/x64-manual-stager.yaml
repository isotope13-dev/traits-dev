defaults:
  for: [pe, dll]
  platforms: [windows]
  attack: T1105

composite_rules:
  # Staging half of the junk-padded manual loader: small loader code
  # validates an in-memory MZ/PE image while debugger checks (the
  # ProcessDebugObjectHandle class-30 query and IsDebuggerPresent) gate
  # execution, and a data section dominated by one oversized junk string
  # carries the encoded next stage. Signed platform and framework images
  # that validate their own headers are excluded.
  - id: x64-antidebug-junk-padded-pe-stager
    desc: Anti-debug x64 stager validates junk-padded in-memory PE
    crit: hostile
    conf: 0.97
    attack: T1027,T1105,T1620
    mbc: B0033
    arch: [x86-64]
    all:
      - id: micro-behaviors/data/format/pe-parser::pe-header-walk-x64
      - id: micro-behaviors/data/format/pe-parser::pe-header-compare-immediate-multiple
      - id: micro-behaviors/process/control/info::process-info-class-30-constant
      - id: micro-behaviors/process/debug/detect::is-debugger-present-import
      - id: metadata/binary/section/size::small-code-in-large-pe
    any:
      - id: metadata/file/profile/string-population::native-string-over-256-kib
      - id: metadata/binary/section/ratio::data-section-1p5x-code
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/framework/
