# Android DEX often embeds the same curl|wget|sh one-liner a Unix
# dropper would run from a shell script. Match the DEX string pool
# directly; script-typed curl-pipe atoms never see it.
defaults:
  platforms: [android]
  for: [dex]
  crit: notable
  conf: 0.95
  attack: T1105,T1624.001

traits:
  - id: dex-wget-http-url
    desc: DEX embeds a wget HTTP URL
    if:
      type: text
      substr: "wget http://"

  - id: dex-busybox-wget
    desc: DEX falls back to busybox wget
    if:
      type: text
      substr: "busybox wget"

  - id: dex-toybox-wget
    desc: DEX falls back to toybox wget
    if:
      type: text
      substr: "toybox wget"

composite_rules:
  - id: android-boot-wget-ip-dropper
    desc: Boot receiver wgets a payload from HTTP
    crit: hostile
    conf: 0.96
    all:
      - id: micro-behaviors/os/service/daemon::android-boot-completed-action
      - id: dex-wget-http-url

  - id: android-busybox-toybox-wget-dropper
    desc: DEX wgets via busybox and toybox fallbacks
    crit: hostile
    conf: 0.96
    all:
      - id: dex-wget-http-url
      - id: dex-busybox-wget
      - id: dex-toybox-wget

  - id: android-boot-busybox-wget-dropper
    desc: Boot receiver falls back to busybox wget
    crit: hostile
    conf: 0.96
    all:
      - id: micro-behaviors/os/service/daemon::android-boot-completed-action
      - id: dex-busybox-wget
