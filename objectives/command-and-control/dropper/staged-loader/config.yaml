defaults:
  platforms: [android, unix, windows]
  for: [json, javascript, typescript, python, java, kotlin, csharp, go, rust]
  attack: T1105,T1627.001
  mbc: B0042

traits:
  - id: remote-dex-version-field
    desc: Remote DEX descriptor carries a payload version
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: '(?i)["'']dexVersion["'']\s*:\s*(["''][0-9]+(\.[0-9]+)?["'']|[0-9]+(\.[0-9]+)?)'

  - id: remote-module-class-field
    desc: Remote module class field
    # A class field alone is common in UI frameworks (`className`). Keep it as
    # a component: the higher-level descriptor composite adds the remote URL/digest
    # context before this becomes meaningful.
    crit: component
    conf: 0.94
    if:
      type: text
      regex: '(?i)["''](className|entryClass|loaderClass)["'']\s*:\s*["'']'

  # remote-module-method-field relocated to
  # micro-behaviors/data/plugin::entry-point-field — an entryPoint key is
  # ordinary manifest/descriptor schema.

composite_rules:
  - id: versioned-remote-dex-stage
    desc: Controller descriptor supplies a versioned remote DEX payload
    crit: suspicious
    conf: 0.97
    scope: leaf
    near_bytes: 1024
    all:
      - id: micro-behaviors/communications/url/reference::structured-remote-url-field
      - id: remote-dex-version-field

  - id: remote-module-entrypoint-fields
    desc: Remote module class and method entry points
    crit: component
    conf: 0.96
    all:
      - id: remote-module-class-field
      - id: micro-behaviors/data/plugin::entry-point-field
    near_bytes: 1024

  - id: config-driven-remote-module-descriptor
    desc: Remote module descriptor supplies download, integrity, and entry point
    crit: suspicious
    conf: 0.98
    scope: leaf
    near_bytes: 2048
    all:
      - id: micro-behaviors/communications/url/reference::structured-remote-url-field
      - id: micro-behaviors/crypto/hash/file::serialized-artifact-digest-field
      - id: remote-module-entrypoint-fields
