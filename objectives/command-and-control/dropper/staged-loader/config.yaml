defaults:
  platforms: [android, unix, windows]
  for: [json, javascript, typescript, python, java, kotlin, csharp, go, rust]
  attack: T1105,T1627.001
  mbc: B0042

traits:
  - id: remote-module-url-field
    desc: Remote module URL field
    crit: component
    conf: 0.92
    if:
      type: text
      # Structured key/value syntax only; prose mentioning a download URL does
      # not represent a controller descriptor.
      regex: '(?i)["''](url2?|dexUrl|downloadUrl|payloadUrl|moduleUrl)["'']\s*:\s*["'']https?://'

  - id: remote-dex-version-field
    desc: Remote DEX descriptor carries a payload version
    crit: component
    conf: 0.94
    if:
      type: text
      regex: '(?i)["'']dexVersion["'']\s*:\s*(["''][0-9]+(\.[0-9]+)?["'']|[0-9]+(\.[0-9]+)?)'

  - id: remote-module-digest-field
    desc: Remote module digest field
    crit: component
    conf: 0.94
    if:
      type: text
      regex: '(?i)["''](md5|md52|sha256|checksum|digest)["'']\s*:\s*["''][0-9a-f]{32}'

  - id: remote-module-class-field
    desc: Remote module class field
    crit: component
    conf: 0.94
    if:
      type: text
      regex: '(?i)["''](className|entryClass|loaderClass)["'']\s*:\s*["'']'

  - id: remote-module-method-field
    desc: Remote module method field
    crit: component
    conf: 0.94
    if:
      type: text
      regex: '(?i)["''](method|entryMethod|entryPoint)["'']\s*:\s*["'']'

composite_rules:
  - id: versioned-remote-dex-stage
    desc: Controller descriptor supplies a versioned remote DEX payload
    crit: suspicious
    conf: 0.97
    scope: leaf
    near_bytes: 1024
    all:
      - id: remote-module-url-field
      - id: remote-dex-version-field

  - id: remote-module-entrypoint-fields
    desc: Remote module class and method entry points
    crit: component
    conf: 0.96
    all:
      - id: remote-module-class-field
      - id: remote-module-method-field
    near_bytes: 1024

  - id: config-driven-remote-module-descriptor
    desc: Remote module descriptor supplies download, integrity, and entry point
    crit: suspicious
    conf: 0.98
    scope: leaf
    near_bytes: 2048
    all:
      - id: remote-module-url-field
      - id: remote-module-digest-field
      - id: remote-module-entrypoint-fields
