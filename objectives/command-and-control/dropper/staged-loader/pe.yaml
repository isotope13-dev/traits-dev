# A staged loader that receives its next stage over a socket it resolves
# by hash: the PEB is walked, export names are folded with ROR13, and the
# ws2_32!recv hash constant is requested explicitly, all behind a single
# ordinary import. Each leg is a neutral capability or hash constant; the
# combination is a download-stage loader with concealed networking.
defaults:
  platforms: [windows]
  for: [pe]
  attack: T1105,T1027.007

composite_rules:
  - id: ror13-recv-stage-loader
    desc: PE resolves hashed recv to receive next stage
    crit: hostile
    conf: 0.97
    arch: [x86-64]
    size_max: 524288
    all:
      - id: micro-behaviors/process/info/query::peb-access-x64
      - id: micro-behaviors/os/api-resolution/hash-based::ror13-byte-hash-loop-x64
      - id: micro-behaviors/os/api-resolution/hash-based::ror13-recv-hash-request-x64
      - id: metadata/binary/symbols/imports::single-import-count
    unless:
      - id: metadata/binary/framework/
      - id: metadata/signed/platform/
