# A staged loader that receives its next stage over a socket it resolves
# by hash: the PEB is walked, export names are folded with ROR13, and the
# ws2_32!recv hash constant is requested explicitly, all behind a single
# ordinary import. Each leg is a neutral capability or hash constant; the
# combination is a download-stage loader with concealed networking.
defaults:
  platforms: [windows]
  for: [pe]
  attack: T1105,T1027.007

composite_rules:
  # This form keeps a Winsock resolver inside a PE executable section and
  # starts it from a separate thread. It covers renamed or appended code
  # sections that ordinary .text-scoped ROR13 atoms do not inspect.
  - id: ror13-winsock-recv-thread-shellcode
    desc: PE launches a ROR13-resolved Winsock receive thread
    crit: hostile
    conf: 0.98
    arch: [x86-64]
    size_max: 5242880
    all:
      - id: micro-behaviors/process/info/query::peb-access-x64
      - id: micro-behaviors/os/api-resolution/digest-export::ror13-lodsb-hash-loop-x64
      - id: micro-behaviors/os/api-resolution/digest-export::ror13-recv-hash-request-r10d-x64
      - id: micro-behaviors/process/thread/create::thread-start-api-x64
    unless:
      - id: metadata/binary/framework/
      - id: metadata/signed/platform/
  - id: ror13-recv-stage-loader
    desc: PE resolves hashed recv to receive next stage
    crit: hostile
    conf: 0.97
    arch: [x86-64]
    size_max: 524288
    all:
      - id: micro-behaviors/process/info/query::peb-access-x64
      - id: micro-behaviors/os/api-resolution/digest-export::ror13-byte-hash-loop-x64
      - id: micro-behaviors/os/api-resolution/digest-export::ror13-recv-hash-request-x64
      - id: metadata/binary/symbols/imports::single-import-count
    unless:
      - id: metadata/binary/framework/
      - id: metadata/signed/platform/
