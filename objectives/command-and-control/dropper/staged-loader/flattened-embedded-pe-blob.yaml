# Native code that validates MZ/PE headers, changes page protection, and
# resolves APIs dynamically, alongside a huge encoded string blob and
# flattened control flow, is an embedded-payload reflective loader.
defaults:
  platforms: [windows]
  for: [pe, dll]
  attack: T1620,T1027.009
composite_rules:
  - id: flattened-loader-embedded-encoded-pe-blob
    desc: Flattened PE-mapping loader with huge encoded blob
    crit: hostile
    conf: 0.9
    all:
      - id: micro-behaviors/data/format/pe-parser::pe-header-compare-immediate-multiple
      - id: micro-behaviors/data/format/pe-parser::inline-mz-magic-check
      - id: micro-behaviors/mem/protect/modify::virtual-protect
      - id: micro-behaviors/dylib/lookup::get-proc-address-import
      - id: metadata/file/profile/string-population::native-string-over-256-kib
      - id: objectives/anti-static/obfuscation/control-flow/dispatch::tls-state-relative-table-flattening
