defaults:
  platforms: [android]
  for: [java, class]
  attack: T1627.001
  mbc: B0042

traits:
  - id: android-dexclassloader-source
    desc: Android DexClassLoader source import
    crit: notable
    conf: 0.9
    if:
      type: symbol
      kind: import
      exact: dalvik.system.DexClassLoader
    unless:
      - id: well-known/lib/platform/openjfx::openjfx-source-tree
      - id: well-known/lib/platform/openjfx::openjfx-tooling-tree
  - id: android-staged-jar-literal
    desc: Android staged jar/dex literal
    crit: component
    conf: 0.84
    if:
      type: literal
      regex: '^\\.(jar|dex)$'
  - id: java-reflective-start-invoke
    desc: Java reflective start method invocation
    crit: notable
    conf: 0.86
    if:
      type: text
      # Require reflective Method lookup/invoke of "start", not a bare
      # string literal (protobuf enums commonly contain the word start).
      regex: '(?i)(getMethod|getDeclaredMethod)\(\s*"start"\s*\)|\.invoke\([^)]{0,80}"start"'
  - id: android-hide-launcher-component
    desc: Android launcher component disable source
    crit: notable
    conf: 0.86
    if:
      type: symbol
      kind: call
      exact: setComponentEnabledSetting
  - id: android-wakelock-acquire-source
    desc: Android wakelock acquire source
    crit: component
    conf: 0.82
    if:
      type: symbol
      kind: call
      exact: acquire
  - id: java-data-input-stream-call
    desc: Java DataInputStream call
    crit: component
    if:
      type: symbol
      kind: call
      exact: DataInputStream
  - id: java-data-output-stream-call
    desc: Java DataOutputStream call
    crit: component
    if:
      type: symbol
      kind: call
      exact: DataOutputStream
  - id: java-json-module-class-target
    desc: Reads a JSON module class target
    crit: component
    conf: 0.94
    if:
      type: text
      regex: '(get|opt)String\(\s*"(className|entryClass|loaderClass)"'
  - id: java-json-module-method-target
    desc: Reads a JSON module method target
    crit: component
    conf: 0.94
    if:
      type: text
      regex: '(get|opt)String\(\s*"(method|entryMethod|entryPoint)"'

composite_rules:
  - id: java-json-reflective-module-targets
    desc: JSON supplies class and method targets
    crit: suspicious
    conf: 0.96
    all:
      - id: java-json-module-class-target
      - id: java-json-module-method-target
    near_lines: 12
  - id: java-network-stage-streams
    desc: Java data stream input/output calls
    crit: component
    conf: 0.86
    any:
      - id: java-data-input-stream-call
      - id: java-data-output-stream-call
  - id: android-staged-dex-payload-loader
    desc: Android staged DEX payload loader
    crit: suspicious
    conf: 0.96
    all:
      - id: android-dexclassloader-source
      - id: java-network-stage-streams
      - id: java-reflective-start-invoke
    any:
      - id: android-staged-jar-literal
      - id: android-hide-launcher-component
      - id: android-wakelock-acquire-source
      - id: micro-behaviors/communications/socket/create::java-socket-create
      - id: micro-behaviors/communications/socket/create::java-serversocket-create
    needs: 2
  - id: android-http-downloaded-dex-reflective-execution
    desc: Downloads and reflectively executes DEX
    crit: hostile
    conf: 0.99
    attack: T1105,T1627.001
    scope: leaf
    all:
      - id: android-dexclassloader-source
      - id: java-json-reflective-module-targets
      - id: micro-behaviors/communications/http/client/library::java-http-url-connection
      - id: micro-behaviors/fs/write/file/direct::java-fileoutputstream-source
      - id: micro-behaviors/data/source/dynamic/reflect::java-method-invoke
  - id: android-remote-module-descriptor-dex-execution
    desc: Executes a remotely described Android DEX module
    crit: hostile
    conf: 0.99
    attack: T1105,T1627.001
    scope: leaf
    all:
      - id: android-http-downloaded-dex-reflective-execution
      - id: config-driven-remote-module-descriptor
