# Native file binder: the stub reads records from its own appended data,
# writes each to a fresh %TEMP% directory and starts it with CreateProcess,
# then deletes the dropped files. Hash-resolved sandbox probes gate the
# drop, so the bound payloads only run on hosts that look like real users.
defaults:
  platforms: [windows]
  for: [pe]
  attack: T1027.009,T1497.001,T1204.002
  mbc: B0030

composite_rules:
  - id: hashed-probe-overlay-temp-drop-run
    desc: Sandbox-gated overlay files dropped to temp and run
    crit: hostile
    conf: 0.9
    all:
      - id: objectives/anti-analysis/sandbox-detect/suite::djb2-hashed-sandbox-probes
      - id: micro-behaviors/fs/read/file/handle::pe-module-path-file-io-overlay
      - id: micro-behaviors/os/sysinfo/directories::win32-temp-path-import
      - id: micro-behaviors/process/create/spawn::create-process-w
      - id: micro-behaviors/fs/delete/file/library::deletefile-w
    unless:
      - id: metadata/signed/platform/
