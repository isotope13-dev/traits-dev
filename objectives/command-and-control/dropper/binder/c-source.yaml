# C source for a file-binder stub: the program opens its own image, seeks to
# a fixed offset where records were appended, decrypts each record, writes it
# out and launches it. HTML-rendered listings escape quotes as &quot;, so
# string literals accept both forms.
defaults:
  platforms: [windows]
  for: [c, cpp, html, text]
  attack: T1027.009
  mbc: B0030

traits:
  - id: source-shellexecute-open-call
    desc: ShellExecute opens a file in source
    crit: notable
    conf: 0.88
    if:
      type: text
      regex: '(?i)ShellExecute[AW]?\s*\(\s*NULL\s*,\s*(&quot;|")open(&quot;|")'

  - id: source-self-module-path-read
    desc: Source reads own module file name
    crit: notable
    conf: 0.85
    if:
      type: text
      regex: '(?i)GetModuleFileName[AW]?\s*\(\s*NULL'

  - id: source-setfilepointer-from-begin
    desc: SetFilePointer seeks from file start
    crit: notable
    conf: 0.85
    if:
      type: text
      regex: '(?i)SetFilePointer\s*\([^;]{0,48}FILE_BEGIN'

  - id: source-drop-directory-call
    desc: Source resolves system, Windows or temp dir
    crit: notable
    conf: 0.85
    if:
      type: text
      regex: '(?i)(Get(System|Windows)Directory[AW]?|GetTempPath[AW]?)\s*\('

composite_rules:
  - id: c-source-self-image-binder-stub
    desc: Source reads own appended records, writes and runs them
    crit: hostile
    conf: 0.93
    near_lines: 90
    all:
      - id: source-self-module-path-read
      - id: source-setfilepointer-from-begin
      - id: objectives/command-and-control/backdoor/native-source::source-createfile-write-access
      - id: source-shellexecute-open-call
