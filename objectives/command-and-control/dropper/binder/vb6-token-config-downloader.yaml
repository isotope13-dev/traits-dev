# A VB6 stub whose token-delimited config names a remote executable URL is
# a binder or downloader: it fetches and launches the file, usually behind
# a fake error message.
defaults:
  platforms: [windows]
  for: [pe]
  attack: T1105,T1204.002
composite_rules:
  - id: vb6-token-config-remote-exe-downloader
    desc: VB6 stub config pointing at remote executable
    crit: hostile
    conf: 0.85
    all:
      - id: metadata/binary/framework::vb6-application-framework
      - id: micro-behaviors/data/embedded/payload/trailer::repeated-token-field-delimiter
      - id: micro-behaviors/communications/http/url/scheme::http-executable-url-in-binary
    unless:
      - id: metadata/signed/platform/
