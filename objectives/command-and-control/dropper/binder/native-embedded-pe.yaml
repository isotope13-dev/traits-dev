# A native wrapper carries a second PE as data, rewrites PE resources at
# runtime (the icon/version masquerade step, typically copied from an
# appended signed binary), and launches a process. Installers that merely
# extract and run a payload do not import the resource-update APIs; the
# runtime resource rewrite is the leg that separates this binder shape
# from an ordinary setup stub.
defaults:
  platforms: [windows]
  for: [pe]
  attack: T1027,T1036

composite_rules:
  - id: embedded-pe-resource-rewrite-launch
    desc: PE embeds payload, rewrites resources, launches process
    crit: hostile
    conf: 0.96
    all:
      - id: metadata/binary/layout/embedded::pe-embedded
      - id: micro-behaviors/fs/write/file/resource::begin-update-resource-a
      - id: micro-behaviors/process/create/spawn::create-process-w
      - id: metadata/signed/trust-level::unsigned-missing-signature-record
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/installer/family/
