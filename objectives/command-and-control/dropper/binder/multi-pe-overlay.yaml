# A UPX-packed Windows executable carrying several complete PE images
# in a large unsigned overlay is a binder for bundled payloads.
# Archivers and installers that legitimately carry executables are
# signed or declare installer structure; a packed unsigned carrier
# whose overlay is mostly foreign PE images does not.
defaults:
  platforms: [windows]
  for: [pe]
  attack: T1027.009
  mbc: B0024

composite_rules:
  - id: packed-multi-pe-binder
    desc: UPX-packed PE binds multiple embedded PE payloads
    crit: hostile
    conf: 0.94
    all:
      - id: metadata/binary/layout/overlay::unsigned-multi-embedded-pe-overlay
      - id: metadata/binary/section/label::upx-section-pair
    any:
      - id: metadata/binary/layout/ratio::overlay-over-90pct
      - id: metadata/binary/provenance/build::upx-banner
    needs: 1
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/installer/family/
      # The UPX packer utility itself ships UPX-packed and embeds its ELF
      # loader stubs; seen as a carved child of a concatenated file, its
      # "overlay" is just the neighbouring files, not a bound payload.
      - id: metadata/build/protector::upx-elfmainx-stub-name
