# A UPX-wrapped VB6 program whose appended data is at least half the file,
# that reads and writes files as raw binary records and starts programs
# with Shell, is a binder: the overlay holds the files it extracts and runs.
defaults:
  platforms: [windows]
  for: [pe]
  attack: T1027.009,T1204.002,T1059
composite_rules:
  - id: vb6-upx-overlay-binary-extract-and-shell
    desc: UPX VB6 stub extracting its overlay and running it
    crit: hostile
    conf: 0.85
    all:
      - id: metadata/binary/framework::vb6-application-framework
      - id: metadata/binary/section/label::upx-section-pair
      - id: metadata/binary/layout/overlay::overlay-at-least-half
      - id: micro-behaviors/fs/write/file/handle::vb6-binary-file-write
      - id: micro-behaviors/process/create/exec::vb6-shell-execution
    unless:
      - id: metadata/signed/platform/

  - id: vb6-overlay-embedded-pe-extract-and-shell
    desc: VB6 stub extracting embedded overlay PE and executing it
    crit: hostile
    conf: 0.92
    all:
      - id: metadata/binary/framework::vb6-application-framework
      - id: metadata/binary/layout/overlay::overlay-at-least-half
      - id: metadata/binary/layout/embedded::pe-embedded
      - id: micro-behaviors/fs/write/file/handle::vb6-binary-file-write
      - id: micro-behaviors/process/create/exec::vb6-shell-execution
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/installer/family/
      - id: metadata/binary/layout/embedded::embedded-pe-child
