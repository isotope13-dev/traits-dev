# CryptoAPI decrypts and manually maps a native PE image.
defaults:
  platforms: [windows]
  for: [pe, dll]
  attack: T1140
  mbc: B0023
composite_rules:
  - id: capi-hash-decrypt-manual-pe-loader
    desc: CryptoAPI decrypts a PE into RWX manual-map memory
    crit: hostile
    conf: 0.99
    attack: "T1140,T1620"
    all:
      - id: micro-behaviors/crypto/library/cryptoapi::capi-hash-buffer-decrypt-chain
      - id: micro-behaviors/mem/alloc/virtual::virtual-alloc
      - id: micro-behaviors/mem/alloc/executable::executable-allocation-indicator
      - id: micro-behaviors/data/embedded/payload/header::inline-pe-header-validation-sequence
      - id: micro-behaviors/dylib/lookup::get-proc-address-import
    unless:
      - id: metadata/signed/platform/
      - id: well-known/app/
      - id: well-known/lib/
      - id: well-known/tool/reverse-engineering/
  - id: downloaded-fnv-winhttp-native-image-map
    desc: FNV-resolved WinHTTP stage parsed into native executable memory
    crit: hostile
    conf: 0.98
    attack: "T1105,T1620,T1140"
    all:
      - id: objectives/command-and-control/dropper/download::fnv-resolved-winhttp-encrypted-c2
      - id: micro-behaviors/mem/alloc/virtual::nt-allocate-virtual-memory-api
      - id: micro-behaviors/mem/protect/modify::nt-protect-virtual-memory-name
      - id: micro-behaviors/data/parse/portable-executable::pe-header-walk-x64
