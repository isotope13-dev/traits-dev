# C/C++ sideload loader sources (SilkLurk-class).
defaults:
  platforms: [windows]
  for: [c, cpp]
  attack: T1574.002,T1543.003

traits:
  - id: dllmain-service-dispatcher-call
    desc: DllMain invokes StartServiceCtrlDispatcher
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: 'DllMain[\s\S]{0,400}StartServiceCtrlDispatcher[AW]?'

  - id: c-winexec-hidden-sc-string
    desc: WinExec hides sc.exe service command
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: 'WinExec\s*\([^)]{0,300}\bsc\s+create\b[^)]{0,300}SW_HIDE'

  - id: c-programdata-path-token
    desc: ProgramData path string in C source
    crit: component
    conf: 0.85
    if:
      type: text
      word: ProgramData

  - id: c-vulkan-sideload-dll-name
    desc: vulkan-1.dll sideload companion reference
    crit: notable
    conf: 0.93
    if:
      type: text
      substr: vulkan-1.dll

  - id: c-rtk-sideload-dll-name
    desc: RtkSmbusLoc.dll sideload companion reference
    crit: notable
    conf: 0.93
    if:
      type: text
      substr: RtkSmbusLoc.dll

  - id: c-handshake-key-memcpy-send
    desc: Copies 32-byte key then sends 40-byte block
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: 'memcpy\([^,]{1,40},\s*key,\s*32\)[\s\S]{0,80}send\([^,]{1,40},\s*[^,]{1,40},\s*40\s*,'

  - id: c-onedrive-dat-payload-name
    desc: OneDrive.dat staged payload filename
    crit: notable
    conf: 0.94
    if:
      type: text
      substr: OneDrive.dat

composite_rules:
  - id: c-servicedll-sideload-loader
    desc: C DLL service dispatcher sideload loader
    crit: hostile
    conf: 0.97
    all:
      - id: dllmain-service-dispatcher-call
      - id: c-programdata-path-token
      - id: c-vulkan-sideload-dll-name
    any:
      - id: micro-behaviors/os/service/control::service-auto-start-setting
      - id: c-winexec-hidden-sc-string

  - id: c-winexec-service-persistence-install
    desc: WinExec installs hidden auto-start service
    crit: hostile
    conf: 0.96
    all:
      - id: c-winexec-hidden-sc-string
      - id: micro-behaviors/os/service/control::service-auto-start-setting
      - id: c-programdata-path-token

  - id: c-network-key-c2-handshake
    desc: C implant sends 40-byte key handshake block
    crit: hostile
    conf: 0.96
    attack: T1071
    all:
      - id: c-handshake-key-memcpy-send
      - id: micro-behaviors/communications/socket/send::send-symbol
      - id: micro-behaviors/communications/ip/services::native-ip-protocol-constants

  - id: c-masquerade-payload-move
    desc: Moves disguised OneDrive payload during install
    crit: hostile
    conf: 0.95
    attack: T1036.005
    all:
      - id: c-onedrive-dat-payload-name
      - id: micro-behaviors/fs/file/move::move-file
      - id: c-programdata-path-token
