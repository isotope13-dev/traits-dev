# A DLL exporting the chrome_elf.dll entry points is loaded by the browser
# host next to it. Genuine chrome_elf carries no huge encoded data blob or
# flattened control flow; every export here funnels into one hidden routine.
defaults:
  platforms: [windows]
  for: [pe, dll]
  attack: T1574.001,T1027
traits:
  - id: chrome-elf-export-install-details
    desc: Exports GetInstallDetailsPayload
    crit: notable
    conf: 0.9
    if:
      type: export
      exact: GetInstallDetailsPayload
  - id: chrome-elf-export-browser-process
    desc: Exports IsBrowserProcess
    crit: notable
    conf: 0.9
    if:
      type: export
      exact: IsBrowserProcess
  - id: chrome-elf-export-signal
    desc: Exports SignalChromeElf
    crit: notable
    conf: 0.9
    if:
      type: export
      exact: SignalChromeElf
composite_rules:
  - id: chrome-elf-proxy-flattened-blob-loader
    desc: chrome_elf export proxy with flattened code and huge blob
    crit: hostile
    conf: 0.9
    all:
      - id: chrome-elf-export-install-details
      - id: chrome-elf-export-browser-process
      - id: chrome-elf-export-signal
      - id: micro-behaviors/data/format/pe-parser::inline-mz-magic-check
      - id: metadata/file/profile/string-population::native-string-over-256-kib
      - id: objectives/anti-static/obfuscation/control-flow/dispatch::tls-state-relative-table-flattening
