# Payload that runs as an editor extension.
#
# The delivery step is an ordinary HTTPS download; what makes it a dropper is
# where the downloaded file is put: `<editor-cli> --install-extension <file>
# --force` hands the bytes to the IDE, which then loads them with the user's
# full privileges on the next window.  Legitimate provisioning installs a
# marketplace id into one editor; a dropper downloads an arbitrary .vsix and
# pushes it into every fork it can find, so the fork sweep and the retrieved
# package are the discriminators.
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript, shell, batch, powershell, python]
  attack: T1105,T1176
  mbc: E1105

composite_rules:
  - id: native-editor-extension-dropper
    desc: Native binary downloads and force-installs an editor extension
    crit: hostile
    conf: 0.99
    for: [pe, macho]
    scope: file
    all:
      - id: micro-behaviors/communications/url/external/github::github-release-download
      - id: micro-behaviors/os/package-manager/install::native-ide-cli-force-install
    any:
      - id: micro-behaviors/process/create/spawn::create-process-w
      - id: micro-behaviors/process/create/direct::execve-import
  - id: obfuscated-editor-extension-download-install
    desc: Obfuscated code downloads and force-installs an extension
    crit: hostile
    conf: 0.98
    attack: T1027,T1105,T1176
    scope: file
    all:
      - id: metadata/library/vscode::vscode-extension-marker
      - id: micro-behaviors/os/module/dynamic-load::node-computed-require-call
      - id: metadata/import/builtin::require-http
      - id: micro-behaviors/communications/http/request/dynamic::node-http-request-headers-option
      - id: micro-behaviors/communications/http/request/dynamic::node-http-response-pipe
      - id: micro-behaviors/process/create/shell/bridge::js-spawnsync
      - id: micro-behaviors/os/package-manager/install::ide-cli-install-extension-obfuscated-literals
      - id: objectives/anti-static/obfuscation/obfuscator/js-obfuscator::push-shift-bracket-pattern

  - id: downloaded-vsix-force-install
    desc: Force-installs a downloaded editor extension
    crit: hostile
    conf: 0.95
    all:
      - id: metadata/library/vscode::vscode-extension-marker
      - id: micro-behaviors/fs/temp/directory::node-computed-tmpdir-fragment
      - id: metadata/import/builtin::require-http
      - id: micro-behaviors/communications/http/request/dynamic::node-http-request-headers-option
      - id: micro-behaviors/communications/http/request/dynamic::node-http-response-pipe
      - id: micro-behaviors/process/create/shell/bridge::js-spawnsync
      - id: micro-behaviors/os/package-manager/install::ide-cli-install-extension-obfuscated

  - id: obfuscated-vsix-force-install
    desc: Obfuscated code force-installs a staged VSIX
    crit: hostile
    conf: 0.97
    all:
      - id: downloaded-vsix-force-install
      - id: objectives/discovery/host/application/editor::vscode-fork-editor-enumeration-obfuscated

  - id: editor-fork-sweep-extension-install
    desc: Installs an extension into every editor found
    crit: hostile
    conf: 0.94
    all:
      - id: metadata/library/vscode::vscode-extension-marker
      - id: micro-behaviors/os/package-manager/install::ide-cli-install-extension-obfuscated
      - id: objectives/anti-static/obfuscation/obfuscator/js-obfuscator::push-shift-bracket-pattern
    # Either shape of the fork sweep: a `which <cli>` probe per fork, or a
    # table of per-editor install paths. Both answer "which editors can I
    # reach?"; which one a sample uses is a build detail.
    any:
      - id: objectives/discovery/host/application/editor::vscode-fork-editor-enumeration-obfuscated
      - id: objectives/discovery/host/application/editor::vscode-fork-install-path-enumeration

  # The full chain in one rule: an obfuscator-packed VS Code extension that
  # sweeps the fork family's install paths, pulls a .vsix off the network, and
  # hands it to a child process. A marketplace-provisioning script installs a
  # published *id* into the one editor it was told about, in the clear;
  # nothing legitimate reassembles the editor paths from string fragments to
  # push a downloaded package file into every fork it can find.
  - id: obfuscated-extension-stages-vsix-into-editor-forks
    desc: Obfuscated extension stages a VSIX into editor forks
    crit: hostile
    conf: 0.97
    attack: T1027,T1105,T1176
    scope: file
    all:
      - id: metadata/library/vscode::vscode-extension-marker
      - id: objectives/anti-static/obfuscation/obfuscator/js-obfuscator::push-shift-bracket-pattern
      - id: objectives/discovery/host/application/editor::vscode-fork-install-path-enumeration
      - id: micro-behaviors/process/create/shell/bridge::js-spawnsync
      - id: micro-behaviors/fs/temp/directory::node-computed-tmpdir-fragment
      - id: metadata/import/builtin::require-http
      - id: micro-behaviors/communications/http/request/dynamic::node-http-response-pipe
      - id: micro-behaviors/communications/http/request/dynamic::node-http-request-headers-option
      - id: micro-behaviors/os/package-manager/install::ide-cli-install-extension-obfuscated
