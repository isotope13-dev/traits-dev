# HTML-hosted WSH downloaders that pull a binary through XMLHTTP,
# write it with ADODB.Stream, then load it via an object codebase.
# The stream plus the EXE codebase is the durable shape, not the
# recycled-folder path this family happens to use.
defaults:
  platforms: [windows]
  for: [html]
  attack: T1105,T1059.007

traits:
  - id: html-object-exe-codebase
    desc: Object tag loads a local EXE codebase
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: '(?i)<object.{0,220}codebase\s*=\s*["''][^"'']{1,80}\.exe'

composite_rules:
  - id: html-adodb-stream-save
    desc: HTML ADODB Stream saves a dropped file
    crit: hostile
    conf: 0.96
    all:
      - id: objectives/command-and-control/dropper/execution/wsh::wsh-adodb-stream-html
      - id: micro-behaviors/fs/write/stream::wsh-savetofile
  - id: html-adodb-exe-drop-path
    desc: HTML ADODB Stream writes an EXE path
    crit: hostile
    conf: 0.95
    all:
      - id: objectives/command-and-control/dropper/execution/wsh::wsh-adodb-stream-html
      - id: objectives/command-and-control/dropper/execution/wsh::wsh-unc-exe-path
  - id: html-adodb-object-codebase
    desc: HTML ADODB drop loaded via object codebase
    crit: hostile
    conf: 0.97
    all:
      - id: objectives/command-and-control/dropper/execution/wsh::wsh-adodb-stream-html
      - id: html-object-exe-codebase
