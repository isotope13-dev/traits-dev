# Firseria Installer v2 reconstructs its bundled executable from PE resources,
# stages it under the temporary directory, and launches it through ShellExecute.
defaults:
  platforms: [windows]
  for: [pe]

composite_rules:
  - id: firseria-resource-payload-execution
    desc: Firseria Installer v2 extracts resources and launches the staged payload
    crit: hostile
    conf: 0.995
    attack: T1027.009
    all:
      - id: well-known/unwanted/firseria::firseria-installer-v2-identity
      - id: objectives/anti-static/obfuscation/payload/encrypted::dominant-high-entropy-resources
      - id: micro-behaviors/data/embedded/payload/resource::pe-resource-full-extraction
      - id: micro-behaviors/fs/temp/directory::get-temp-path-dup
      - id: micro-behaviors/process/create/shellexec::shell-executeex-call
