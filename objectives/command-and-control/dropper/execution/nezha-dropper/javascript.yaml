# Nezha deployment clues pending a response-to-file-to-launch review.
defaults:
  crit: suspicious
  platforms: [unix, windows]
  for: [javascript, typescript]
composite_rules:
  - id: nezha-agent-deployment-clues
    desc: Nezha Axios, write, chmod, detach clues
    conf: 0.96
    # micro-behaviors/fs/chmod/executable/mode::shell-plus-x is `for: [shell]`
    # only (a symbol match on a shell `chmod` call) -- it can never fire on a
    # javascript/typescript leaf. node.yaml under the same chmod/mode/ tree
    # has the dedicated javascript/typescript equivalent.
    #
    # micro-behaviors/process/daemonize/detach::setsid-command is a `type:
    # symbol` fact scoped `for: [shell]` only -- also unreachable here.
    # micro-behaviors/process/create/background::detached-background-command
    # is the text-mode equivalent already scoped for javascript/typescript.
    for: [typescript]
    all:
      - id: micro-behaviors/communications/http/lib/axios::axios
      - id: micro-behaviors/fs/write/file/stream::create-write-stream
      - id: micro-behaviors/fs/chmod/executable/mode::node-chmod-make-executable
      - id: micro-behaviors/process/create/background::detached-background-command
    any:
      - id: well-known/app/system/nezha::nezha-v1-config-template
      - id: well-known/app/system/nezha::nezha-v0-stealth-flags
      - id: micro-behaviors/communications/http/url/domain::ssss-nyc-mn
  - id: nezha-npm-file-write-clues
    desc: Nezha deployment with npm-named file write
    conf: 0.97
    all:
      - id: nezha-agent-deployment-clues
      - id: micro-behaviors/fs/write/file/npm-masquerade::write-binary-as-npm
  - id: nezha-npm-write-exec-unlink-clues
    desc: Nezha npm write, launch, unlink clues
    conf: 0.97
    all:
      - id: nezha-agent-deployment-clues
      - id: micro-behaviors/fs/write/file/npm-masquerade::exec-local-npm-binary
      - id: micro-behaviors/fs/delete/file/library::fs-unlink
