defaults:
  platforms: [windows]
  for: [pe]
  attack: T1027,T1059.007

composite_rules:
  - id: nsis-system-encoded-jscript-stage
    desc: NSIS System bundle carries an encoded JScript stage
    crit: hostile
    conf: 0.98
    scope: outer
    all:
      - id: metadata/binary/installer/script::nsis
      - id: metadata/binary/installer/plugin::nsis-system-plugin
      - id: objectives/anti-static/obfuscation/encoding/script::microsoft-script-encoder-file
    unless:
      - id: metadata/signed/platform/
