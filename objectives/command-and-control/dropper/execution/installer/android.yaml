defaults:
  platforms: [android]
  for: [apk]
  attack: T1027,T1631

composite_rules:
  - id: android-vpn-filtered-encrypted-package-installer
    for: [android_apk, dex, xml]
    desc: Encrypted Android package installer establishes selective VPN routing
    crit: hostile
    conf: 0.995
    scope: outer
    all:
      - id: micro-behaviors/data/decode/xor::dalvik-lcg-byte-xor-decode-loop
      - id: micro-behaviors/os/privilege/manifest::request-install-packages-binary-manifest
      - id: micro-behaviors/os/network/interface::android-vpn-application-exclusion-filter

  - id: android-shell-staged-apk-silent-install
    for: [elf]
    desc: Staged APK silently installed via package manager
    crit: hostile
    conf: 0.98
    attack: T1631,T1105
    all:
      - id: micro-behaviors/os/package-manager/sideload::android-shell-package-install
      - id: micro-behaviors/os/package-manager/sideload::android-pm-install-auto-grant
      - id: micro-behaviors/fs/path/temp::android-local-tmp-path
