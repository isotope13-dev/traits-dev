defaults:
  platforms: [windows]
  for: [pe]
  attack: T1105
  mbc: B0022
traits:
  - id: large-overlay-bundle
    desc: Large overlay bundle component
    crit: component
    conf: 0.96
    size_min: 1000000
    if:
      id: metadata/binary/layout::large-overlay-1mb
    unless:
      - id: objectives/command-and-control/dropper/execution/installer/
    downgrade:
      any:
        - id: metadata/binary/installer/family/
        - id: metadata/binary/installer/script/
        - id: metadata/binary/installer/script/
        - id: micro-behaviors/data/embedded/payload/installer::7z-sfx-config-marker
        - id: micro-behaviors/fs/temp/py2exe::py2exe-bundle
  - id: sfx-multiple-runprogram-stages
    desc: SFX launches multiple extracted executables
    crit: notable
    conf: 0.98
    if:
      type: text
      # The 7-Zip SFX config directive is always `RunProgram="<cmd>"`. Anchor on
      # the assignment so the bare CamelCase token in an application's own string
      # table (automation/scheduler UIs use it) is not read as an SFX stage list.
      regex: 'RunProgram\s*=\s*"[^"\n]{1,128}'
    count_min: 2
  - id: sfx-runprogram-executable
    desc: SFX RunProgram launches an executable
    crit: notable
    conf: 0.94
    attack: T1204.002
    if:
      type: text
      # `\"` has to be allowed inside the value. 7-Zip SFX writes the command
      # with escaped quotes whenever it contains a path -- `RunProgram="\"%%T\\
      # payload.exe\""` is the ordinary spelling -- and a value class that
      # excluded every quote stopped at the first `\"`, two characters in, so
      # the `.exe` was never reached. That blinded this atom, and the four
      # composites built on it, to the most common form of the directive.
      regex: 'RunProgram\s*=\s*"(\\"|[^"\r\n]){1,128}\.exe\b'
  - id: sfx-progress-disabled
    desc: SFX disables progress display
    crit: component
    conf: 0.9
    if:
      type: text
      exact: 'Progress="no"'
  - id: sfx-stock-7zs-original-filename
    desc: PE OriginalFilename is stock 7zS.sfx.exe
    crit: component
    conf: 0.96
    if:
      type: value
      path: pe.version.original_filename
      regex: '(?i)^7zS\.sfx(\.exe)?$'
  - id: sfx-installer-lure-basename
    desc: Installer-themed basename on an SFX stub
    crit: component
    conf: 0.9
    if:
      type: path
      basename: true
      regex: '(?i)^(setup|install|installer|update|simplinst)\.exe$'
  - id: sfx-runprogram-affiliate-site-id
    desc: SFX RunProgram passes an affiliate site_id
    crit: suspicious
    conf: 0.95
    attack: T1204.002
    if:
      type: text
      # Potentially unwanted silent SFX chains often re-invoke the extracted
      # stage with `/S /site_id "<digits>"` for affiliate tracking.
      regex: '(?i)RunProgram\s*=\s*"[^"\r\n]{0,160}site_id[^"\r\n]{0,40}\d{3,}'
composite_rules:
  - id: unsigned-silent-7zip-sfx-stage
    desc: Unsigned silent 7-Zip SFX launches an opaque stage
    crit: suspicious
    conf: 0.96
    attack: T1027.009,T1204.002
    all:
      - id: metadata/binary/installer/sfx::7zip-sfx-archive-profile
      - id: metadata/binary/layout::large-high-entropy-overlay
      - id: metadata/binary/layout::pe-no-signature-record
      - id: sfx-runprogram-executable
      - id: sfx-progress-disabled
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/installer/family/
  # Stock 7-Zip SFX stubs renamed to Setup/Install are a common ISO/CDROM
  # delivery wrapper. Basename mismatch + silent Progress=no + opaque
  # RunProgram is stronger than the unsigned-silent stage alone.
  - id: renamed-unsigned-silent-7zip-sfx-dropper
    desc: Renamed silent 7-Zip SFX stages an opaque payload
    crit: hostile
    conf: 0.98
    attack: T1036.005,T1027.009,T1204.002
    all:
      - id: metadata/binary/anomaly/provenance::pe-basename-differs-from-original-filename
      - id: metadata/binary/installer/sfx::7zip-sfx-archive-profile
      - id: metadata/binary/layout::large-high-entropy-overlay
      - id: metadata/binary/layout::pe-no-signature-record
      - id: sfx-runprogram-executable
      - id: sfx-progress-disabled
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/installer/family/
  - id: installer-named-silent-7zip-sfx-dropper
    desc: Installer-named silent 7-Zip SFX stages an opaque payload
    crit: hostile
    conf: 0.97
    attack: T1036.005,T1027.009,T1204.002
    all:
      - id: sfx-installer-lure-basename
      - id: sfx-stock-7zs-original-filename
      - id: metadata/binary/installer/sfx::7zip-sfx-archive-profile
      - id: metadata/binary/layout::large-high-entropy-overlay
      - id: metadata/binary/layout::pe-no-signature-record
      - id: sfx-runprogram-executable
      - id: sfx-progress-disabled
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/installer/family/
  - id: silent-7zip-sfx-affiliate-site-stage
    desc: Silent 7-Zip SFX stages an affiliate site_id payload
    crit: hostile
    conf: 0.97
    attack: T1027.009,T1204.002
    all:
      - id: metadata/binary/installer/sfx::7zip-sfx-archive-profile
      - id: metadata/binary/layout::large-high-entropy-overlay
      - id: metadata/binary/layout::pe-no-signature-record
      - id: sfx-runprogram-affiliate-site-id
      - id: sfx-progress-disabled
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/installer/family/
  - id: admin-multi-stage-sfx-dropper
    desc: Admin SFX runs programs from packed overlay
    crit: hostile
    conf: 0.99
    attack: T1027.009,T1105,T1548.002
    all:
      - id: objectives/command-and-control/dropper/execution/installer::sfx-multiple-runprogram-stages
      - id: metadata/binary/layout::overlay-over-90pct
      - id: metadata/binary/layout::high-entropy-overlay
      - id: metadata/binary/layout::pe-checksum-zeroed
      - id: metadata/build/manifest::pe-requires-admin
      - id: micro-behaviors/process/create/shell/spawn::win-shellexecute
    unless:
      - id: metadata/binary/installer/family/
      - id: metadata/signed/platform/

  - id: signed-recognized-large-overlay-developer
    desc: Signed recognized large overlay developer
    crit: component
    conf: 0.95
    any:
      - id: metadata/signed/developer::win.rar-gmbh
      - id: metadata/signed/developer::valve-corp.
      - id: metadata/signed/developer::martin-tofall
      - id: metadata/signed/platform::microsoft
      - id: metadata/signed/platform::ip-zinukhov-stanislav-igorevich
  - id: large-overlay-installer-marker
    desc: Known installer marker for large overlay bundles
    crit: component
    conf: 0.9
    any:
      - id: metadata/binary/installer/family::known-benign-installer
      - id: metadata/binary/installer/script::inno-setup-installer
      - id: metadata/binary/installer/script::nsis
      - id: micro-behaviors/data/embedded/payload/installer::7z-sfx-config-marker
      - id: micro-behaviors/fs/temp/py2exe::py2exe-bundle
  - id: signed-7zip-sfx-stage-loader
    desc: 7-Zip SFX bundle with staged loader behavior
    crit: suspicious
    conf: 0.98
    size_min: 1000000
    all:
      - id: metadata/binary/layout::large-overlay-1mb
      - id: metadata/binary/installer/sfx::7zip-sfx-runtime
      - id: micro-behaviors/fs/temp/directory::get-temp-path-dup
      - id: micro-behaviors/os/registry/access::registry-write-api-chain
    needs: 2
    any:
      - id: micro-behaviors/crypto/certificate/store::cert-store-population-api
      - id: micro-behaviors/os/sysinfo/platform/locale::locale-fingerprinting-imports
      - id: objectives/anti-analysis/debugger-detect/check::is-debugger-present-symbol
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/installer/family/
  - id: signed-sfx-wrapper-layout
    desc: Signed SFX wrapper layout
    crit: suspicious
    conf: 0.97
    size_min: 900000
    size_max: 1300000
    all:
      - id: metadata/binary/layout::signed-pe-wrapper
      - id: metadata/binary/installer/sfx::7zip-sfx-archive-profile

  # A normal 7-Zip SFX can be signed, elevated, and contain compressed data;
  # this combination additionally requires the known unwanted signer and a
  # dominant opaque resource with an embedded 7-Zip archive.
  - id: installvibes-encrypted-7zip-stage-dropper
    desc: InstallVibes-signed elevated 7-Zip SFX carries opaque payload
    crit: hostile
    conf: 0.995
    scope: outer
    attack: T1036.005,T1027.009,T1204.002,T1548.002
    all:
      - id: metadata/signed/unknown::installvibes
      - id: objectives/anti-static/obfuscation/payload/encrypted::dominant-high-entropy-resources
      - id: metadata/binary/layout::7z-archive-signature-in-resource
      - id: metadata/build/manifest::pe-requires-admin
      - id: micro-behaviors/os/privilege/elevation::runas-verb-token
      - id: micro-behaviors/process/create/shellexec::shell-executeex-call
    unless:
      - id: metadata/signed/platform::microsoft
      - id: metadata/binary/installer/family::known-benign-installer

  - id: signed-admin-pe-with-rsrc-payload
    desc: Admin-elevating PE bundling another PE in resources with timestamp anomaly
    crit: suspicious
    conf: 0.9
    all:
      - id: metadata/build/manifest::pe-requires-admin
      - id: micro-behaviors/data/embedded/payload/resource::pe-magic-in-rsrc
      - id: metadata/binary/anomaly/provenance::pe-far-future-timestamp
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/installer/family/
  - id: identity-mismatched-7z-stage-loader
    desc: Identity-mismatched PE launches an appended 7-Zip stage
    crit: hostile
    conf: 0.99
    attack: T1036.005,T1027.009,T1105
    all:
      - id: objectives/evasion/masquerade/version-resource/contradiction::softwareok-free-manga-identity-contradiction
      - id: micro-behaviors/data/embedded/payload/archive::late-embedded-7z-archive
      - id: objectives/anti-static/obfuscation/payload/self-read::self-read-file-chain
      - id: micro-behaviors/process/create/spawn::child-process-creation-api
    unless:
      - id: metadata/binary/installer/family::known-benign-installer
      - id: metadata/signed/platform/

  - id: unsigned-rar-elevated-logon-dropper
    desc: Unsigned PE embeds RAR payload and elevated logon task
    crit: hostile
    conf: 0.99
    attack: T1027.009,T1053.005,T1105
    all:
      - id: micro-behaviors/data/embedded/payload/archive::rar-magic
      - id: metadata/build/manifest::pe-requires-admin
      - id: objectives/persistence/login/scheduled-task/cli::windows-schtasks-onlogon-highest
      - id: metadata/signed/trust-level::unsigned
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/installer/family/
      - id: metadata/binary/installer/script/
