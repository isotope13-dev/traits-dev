defaults:
  platforms: [windows]
  for: [pe]
  attack: T1105
  mbc: E1105

# wix-burn-runonce-bootstrapper removed: every leg was stock WiX Burn. The
# engine writes SOFTWARE\Microsoft\Windows\CurrentVersion\RunOnce to resume
# after a reboot -- the string sits beside `%ls.RebootRequired` and the
# engine's own "Failed to run RunOnce mode." run-mode table -- and downloads
# its packages over WinINet, so "Burn bundle + RunOnce + WinINet" identifies a
# Burn bundle and nothing else. Microsoft's own Visual C++ redistributable
# matched it and was reported as persisting via RunOnce. The two composites
# below keep the detection: both add multi-provider OAuth endpoints, which is
# the leg that actually separates an abused bundle from an installer.
composite_rules:
- id: wix-burn-cloud-oauth-bundle
  desc: WiX Burn bundle with cloud OAuth theft surface
  crit: suspicious
  conf: 0.97
  all:
  - id: metadata/binary/installer/database::wix-burn-bootstrapper
  - id: micro-behaviors/communications/http/oauth::multi-provider-oauth-endpoints
  - id: metadata/binary/layout::multiple-pe-embedded
  any:
  - id: objectives/persistence/login/registry/autostart::run-once-key
  - id: micro-behaviors/communications/http/get::wininet-http-flow-import-strings
- id: wix-burn-cloud-stealer-dropper
  desc: WiX Burn dropper with cloud token theft
  crit: hostile
  conf: 0.98
  all:
  - id: metadata/binary/installer/database::wix-burn-bootstrapper
  - id: objectives/persistence/login/registry/autostart::run-once-key
  - id: micro-behaviors/communications/http/oauth::multi-provider-oauth-endpoints
  any:
  - id: micro-behaviors/communications/http/get::wininet-http-flow
  - id: micro-behaviors/communications/http/get::wininet-http-flow-import-strings
  - id: metadata/binary/layout::multiple-pe-embedded
  - id: objectives/command-and-control/dropper/execution/inject::self-map-extract-execute
