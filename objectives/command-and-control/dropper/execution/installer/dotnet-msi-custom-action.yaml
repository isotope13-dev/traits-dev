defaults:
  platforms: [windows]
  for: [pe]
  attack: T1059,T1027
  mbc: B0029

composite_rules:
  - id: dotnet-custom-action-vm-gated-child-launch
    desc: Managed MSI action checks for VMs before child launch
    crit: hostile
    conf: 0.98
    all:
      - id: metadata/binary/installer/embedded-payloads::dotnet-managed-custom-action-assembly
      - id: objectives/anti-analysis/vm-detect/wmi::wmi-vm-display-fingerprint
      - id: micro-behaviors/process/create/spawn::dotnet-redirected-stdio
    unless:
      - id: metadata/signed/platform/
