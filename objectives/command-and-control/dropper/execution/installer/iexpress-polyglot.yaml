# A .bat that is simultaneously an IExpress .SED copies itself to %TEMP%, appends
# directives, and calls `iexpress /n /q /m` to compile and run an SFX. The
# polyglot itself is the anti-static trick (objectives/anti-static/polyglot/
# iexpress) and is not by itself a dropper: the technique is demonstrated by
# published batch-scripting collections whose SFX packages a stock System32
# binary and launches `cmd.exe /c break>%tmp%\yes` to read back a button press.
# What separates a dropper is the *content* the SFX carries or starts, so the
# traits below match the two SED directives that name it.
defaults:
  platforms: [windows]
  for: [batch, pe]
  attack: T1218
  mbc: B0024
traits:
  - id: sed-packages-user-writable-payload
    desc: IExpress SED packages a user-dir file
    crit: notable
    conf: 0.92
    if:
      type: text
      regex: '(?i)SourceFiles0=%[A-Z_]{0,12}(TMP|TEMP|APPDATA|PROFILE)%'

  - id: sed-packages-user-profile-payload
    desc: IExpress SED packages a C:\Users file
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)SourceFiles0=[A-Z]:\\Users\\'

  - id: sed-launches-script-host
    desc: IExpress SED starts a Windows script host
    crit: notable
    conf: 0.94
    attack: T1059.005
    if:
      type: text
      regex: '(?i)(AppLaunched|PostInstallCmd)=[^\n]{0,80}\b(wscript|cscript|mshta)'

  - id: sed-launches-powershell
    desc: IExpress SED starts PowerShell
    crit: notable
    conf: 0.94
    attack: T1059.001
    if:
      type: text
      regex: '(?i)(AppLaunched|PostInstallCmd)=[^\n]{0,80}\bpowershell'

composite_rules:
  - id: iexpress-polyglot-dropper
    desc: Batch/SED polyglot compiles and runs a payload SFX
    crit: hostile
    conf: 0.95
    attack: "T1027"
    mbc: "B0032"
    all:
      - id: objectives/anti-static/polyglot/iexpress::bat-iexpress-sed-polyglot
    any:
      - id: sed-packages-user-writable-payload
      - id: sed-packages-user-profile-payload
      - id: sed-launches-script-host
      - id: sed-launches-powershell
    unless:
      - id: well-known/tool/development/batch-scripts::batch-scripts-iexpress-example-path
      - id: well-known/tool/development/batch-scripts::batch-scripts-iexpress-example-name
      - id: well-known/tool/development/batch-scripts::batch-scripts-bat2exe-example-name
