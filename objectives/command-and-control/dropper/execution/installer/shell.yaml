# Install-Time Shell Dropper Detection
# Detects dropper patterns in install/setup scripts
# ATT&CK: T1105
defaults:
  platforms: [linux, unix, macos, android, ios]
  for: [shell]
  attack: T1105
composite_rules:
  - id: install-hidden-compiled-output
    desc: Installer compiles hidden output binary
    crit: suspicious
    conf: 0.88
    all:
      - id: micro-behaviors/process/create/shell/build::gcc-compilation-invocation
      - id: objectives/evasion/file-hiding/dotfile-create::compiler-output-hidden-dotfile
  - id: install-time-native-dropper
    desc: Install-time native dropper workflow
    crit: suspicious
    conf: 0.92
    all:
      - id: objectives/command-and-control/dropper/execution/installer::install-hidden-compiled-output
      - id: micro-behaviors/fs/file/delete::shell-delete-installer-artifact
  - id: github-source-build-installer
    desc: GitHub source archive installer workflow
    crit: suspicious
    conf: 0.91
    all:
      - id: micro-behaviors/communications/url/external/github::github-archive-ref-download
      - id: micro-behaviors/data/archive/extract/tar::tar-extract
      - id: micro-behaviors/process/create/shell/build::local-build-install-script
    any:
      - id: micro-behaviors/communications/url/external/github::github-release-api-latest
      - id: micro-behaviors/communications/http/download/curl::curl-output-file
  - id: elevated-github-source-installer
    desc: Elevated GitHub source installer workflow
    crit: suspicious
    conf: 0.93
    all:
      - id: objectives/command-and-control/dropper/execution/installer::github-source-build-installer
      - id: micro-behaviors/process/create/shell/build::sudo-local-build-install-script
  # A shell installer that fetches an archive, unpacks it, and then looks the
  # payload back up by a bracketed kernel-thread name. The lookup is the tell:
  # `ps` only brackets real kernel threads, so an installer that expects to
  # find one after unpacking a downloaded tarball planted a userspace process
  # wearing that name. No packaging or provisioning workflow has a reason to.
  - id: kernel-thread-name-payload-install
    desc: Installs a payload masquerading as a kernel thread
    crit: hostile
    conf: 0.95
    mbc: F0004
    attack: T1105,T1036.004
    all:
      - id: micro-behaviors/communications/http/download/cli::curl-wget-command
      - id: micro-behaviors/data/archive/extract/tar::tar-extract
      - id: objectives/evasion/masquerade/process/name::shell-kernel-thread-process-lookup
  # Staging from a free dynamic-DNS hostname: throwaway infrastructure an
  # operator can repoint at will, and never where a real vendor publishes a
  # release. Paired with unpack-and-run it is a payload stager, not an
  # installer.
  - id: dynamic-dns-staged-payload-install
    desc: Installer stages a payload from dynamic DNS
    crit: suspicious
    conf: 0.9
    attack: T1105,T1583.001
    all:
      - id: micro-behaviors/data/archive/extract/tar::tar-extract
      - id: micro-behaviors/process/create/local-exec::execute-dot-slash-literal
      - id: micro-behaviors/communications/url/host::dynamic-dns-host-reference
