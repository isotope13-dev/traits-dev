defaults:
  platforms: [macos]
  for: [macho, objc, swift, shell, applescript]
  attack: T1105
traits:
  - id: pkg-file-basename
    desc: macOS installer package basename
    crit: component
    conf: 0.8
    if:
      type: text
      # Require a standalone flat-package filename, not wildcard extension
      # lists (`*.pkg`) or concatenated format names (`.dmg.pkg.deb`).
      regex: '(^|[/\s=\x22\x27])[A-Za-z0-9][^/\s\x22\x27?&#]{0,20}\.pkg($|[\s\x22\x27?&#,;)])'
  - id: installer-target-root-flag
    desc: Installer targets system root
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: -target\s+/\b
  - id: macos-interface-c2
    desc: macOS interface C2 endpoint
    crit: suspicious
    conf: 0.88
    if:
      type: text
      regex: https?://api\.[A-Za-z0-9.-]+/interface/mac/
  - id: ppdserver-failure-endpoint
    desc: ppdserver failure tracking endpoint
    crit: suspicious
    conf: 0.85
    if:
      type: text
      regex: https://api\.ppdserver\.com/(exception|failed)\.php
  - id: background-shell-launch
    desc: Background shell script launch
    crit: suspicious
    conf: 0.82
    if:
      type: text
      regex: do shell script.{0,220}> /dev/null 2>&1 &
    unless:
      - id: micro-behaviors/os/package-manager/management::macos-installed-helper-background-launch
      - id: well-known/tool/development/toolchain/processing::processing-bundle-identifier
      - id: well-known/tool/development/toolchain/processing::processing-package-context
  - id: flat-pkg-preinstall-hook
    desc: macOS pkg preinstall hook
    crit: suspicious
    conf: 0.9
    for: [pkg]
    attack: T1546.016
    if:
      type: text
      regex: '[^/\s]{1,120}\.pkg/Scripts\b|Scripts/(preinstall|postinstall)'
  - id: macos-b64-osascript-on-run
    desc: Base64 wraps an osascript launcher
    crit: suspicious
    conf: 0.96
    for: [shell]
    if:
      type: text
      substr: b3Nhc2NyaXB0IC1lICdvbiBydW4
  - id: dmg-nohup-silent-curl
    desc: Background silent curl
    crit: notable
    conf: 0.9
    for: [dmg]
    if:
      type: raw
      regex: 'nohup curl\s+-\S{1,4}\s+https://'
  - id: dmg-curl-piped-bash
    desc: Curl output piped to bash
    crit: notable
    conf: 0.9
    for: [dmg]
    if:
      type: raw
      regex: 'curl\s+.{0,160}\| bash'
composite_rules:
  - id: pkg-payload-reference
    desc: Downloaded pkg payload reference
    crit: notable
    conf: 0.8
    all:
      - id: pkg-file-basename
    any:
      - id: micro-behaviors/fs/path/temp::macos-package-archive-path
      - id: micro-behaviors/fs/path/temp::unix-temp
      - id: micro-behaviors/fs/path/temp::unix-var-temp
    unless:
      - id: well-known/tool/detection/proxy-sandbox
      - id: metadata/lang/compiler/systems::go-binary
      - id: metadata/package/files/dependency::vsix-bundled-native-tool-path
      - id: well-known/tool/reverse-engineering/radare2::radare2-go-module-source-path
      - id: well-known/lib/platform/browser-automation/automation-context::playwright-core-browser-reinstall-mac-script
  - id: macos-pkg-dropper
    for: [macho, swift, objectivec, applescript]
    desc: macOS package-installing dropper
    crit: suspicious
    conf: 0.93
    all:
      - id: micro-behaviors/process/create/installer::macos-pkg-root-command-reference
      - id: pkg-payload-reference
    any:
      - id: installer-target-root-flag
      - id: macos-interface-c2
      - id: ppdserver-failure-endpoint
      - id: micro-behaviors/fs/path/temp::macos-package-archive-path
      - id: micro-behaviors/process/create/shellexec::usr-bin-open-command
  - id: elevated-macos-pkg-dropper
    for: [macho]
    desc: Elevated macOS package dropper
    crit: suspicious
    conf: 0.95
    all:
      - id: macos-pkg-dropper
      - id: objectives/privilege-escalation/elevation-control/prompt-escalation::admin-privilege-escalation
    any:
      - id: background-shell-launch
      - id: micro-behaviors/process/create/shellexec::usr-bin-open-command
  - id: flat-pkg-preinstall-download-exec
    desc: macOS pkg preinstall download exec
    crit: hostile
    conf: 0.96
    for: [pkg, shell]
    scope: archive
    all:
      - id: flat-pkg-preinstall-hook
      - id: objectives/command-and-control/dropper/delivery/download::shell-silent-hardcoded-download-staging
      - id: micro-behaviors/fs/chmod/executable/mode::shell-7xx
      - id: micro-behaviors/process/daemonize/detach::nohup-command

  - id: macos-b64-osascript-exec
    desc: Decodes base64 into a shell
    crit: hostile
    conf: 0.97
    for: [shell]
    all:
      - id: macos-b64-osascript-on-run
      - id: micro-behaviors/process/create/shell/command-string::shell-direct-sh-c
    any:
      - id: micro-behaviors/data/decode/base64::base64-d-cmd
      - id: micro-behaviors/data/decode/base64::base64-decode-cmd

  - id: macos-hidden-dot-payload-image
    desc: Hidden payload rides a disk image
    crit: hostile
    conf: 0.96
    for: [dmg, shell, macho]
    scope: archive
    all:
      - id: metadata/file/naming::hidden-dot-executable-member
      - id: macos-b64-osascript-on-run
      - id: objectives/anti-static/obfuscation/payload/import::minimal-imports

  - id: openssl-pass-blob-decrypt
    desc: Decrypts an OpenSSL passphrase blob
    crit: hostile
    conf: 0.97
    for: [shell]
    all:
      - id: objectives/credential-access/files/openssl::openssl-hardcoded-pass
      - id: micro-behaviors/crypto/symmetric/aes/openssl::openssl-enc-aes
      - id: micro-behaviors/process/create/shell/pipeline::base64-blob-piped-onward

  - id: hdiutil-download-mount
    desc: Mounts a downloaded disk image
    crit: hostile
    conf: 0.96
    for: [shell]
    all:
      - id: micro-behaviors/fs/volume/mount::hdiutil-attach
      - id: objectives/command-and-control/dropper/delivery/download::curl-silent-output
      - id: micro-behaviors/process/create/shellexec::open-file-command

  - id: perl-packed-xor-decode
    desc: Perl decrypts a packed payload
    crit: hostile
    conf: 0.96
    for: [shell]
    all:
      - id: objectives/anti-static/obfuscation/eval/dropper::perl-e-pack-decode
      - id: micro-behaviors/process/interpreter/perl::perl-code-execute
      - id: objectives/anti-static/obfuscation/payload/encoded::shell-eval-base64-decode

  - id: perl-script-packed-macho
    desc: Packed adhoc payload beside script
    crit: hostile
    conf: 0.95
    for: [dmg, shell, macho]
    scope: archive
    all:
      - id: objectives/anti-static/obfuscation/eval/interpreter::shell-base64-perl-xor-eval
      - id: objectives/anti-static/obfuscation/binary-metrics/imports::embedded-payload-binary
      - id: metadata/signed/trust-level::adhoc

  - id: macos-quarantine-copy-launch
    desc: Clears quarantine and copies payload
    crit: hostile
    conf: 0.96
    for: [shell]
    all:
      - id: micro-behaviors/fs/attributes/xattr::xattr-clear
      - id: micro-behaviors/fs/shell-ops::cp-command-text
      - id: micro-behaviors/fs/traversal/drives::applescript-list-disks

  - id: macos-hidden-adhoc-overlay
    desc: Hidden adhoc binary carries overlay
    crit: hostile
    conf: 0.95
    for: [dmg, macho]
    scope: archive
    all:
      - id: metadata/file/naming::hidden-dot-executable-member
      - id: metadata/signed/trust-level::adhoc
      - id: objectives/anti-static/obfuscation/control-flow/logic::overlay-at-least-half

  - id: dmg-silent-curl-pipe-bash
    desc: Silent curl piped into bash
    crit: hostile
    conf: 0.96
    attack: T1105,T1059.004
    for: [dmg]
    scope: archive
    all:
      - id: dmg-nohup-silent-curl
      - id: dmg-curl-piped-bash
