defaults:
  platforms: [windows]
  for: [powershell]
composite_rules:
  - id: xmlhttp-clsid-any
    desc: Matches any variant of XMLHTTP CLSID
    crit: suspicious
    conf: 0.9
    any:
      - id: micro-behaviors/communications/http/client/xmlhttp::clsid-xmlhttp-b64-unicode
      - id: micro-behaviors/communications/http/client/xmlhttp::clsid-xmlhttp-raw
      - id: micro-behaviors/communications/http/client/xmlhttp::xmlhttp-join-fragments
  - id: ps-xmlhttp-downloader
    desc: PowerShell XMLHTTP downloader using COM objects
    crit: hostile
    conf: 0.95
    attack: "T1105"
    mbc: "E1059.001"
    all:
      - id: xmlhttp-clsid-any
      - id: micro-behaviors/os/com/instantiation::create-instance
      - id: micro-behaviors/communications/http/client/response-body::response-text
      - id: micro-behaviors/process/interpreter/eval/direct::powershell-iex-call
  - id: ps-xmlhttp-adodb-download-execute
    desc: PowerShell XMLHTTP ADODB download execute
    crit: hostile
    conf: 0.98
    attack: "T1105"
    mbc: "B0030"
    all:
      - id: micro-behaviors/communications/http/client/xmlhttp::xmlhttp-join-fragments
      - id: micro-behaviors/os/com/instantiation::new-object-comobject
      - id: micro-behaviors/fs/write/file/stream::adodb-stream-join-fragments
      - id: micro-behaviors/fs/write/stream::adodb-save-to-file
      - id: micro-behaviors/fs/write/stream::stream-write-response-body
      - id: micro-behaviors/process/create/start-process::start-process-call
    any:
      - id: micro-behaviors/communications/http/client/response-body::response-body
      - id: micro-behaviors/fs/write/stream::adodb-type-binary
  - id: ps-winhttp-download-execute
    desc: PowerShell WinHttpRequest download executes payload
    crit: hostile
    conf: 0.98
    attack: "T1105,T1059.001"
    mbc: "B0030"
    all:
      - id: micro-behaviors/communications/http/client/winhttp::winhttp-request-com
      - id: micro-behaviors/communications/http/client/response-body::response-body
      - id: micro-behaviors/process/create/start-process::start-process-call
    any:
      - id: micro-behaviors/process/create/hidden::powershell-windowstyle-hidden
      - id: micro-behaviors/process/create/hidden::powershell-windowstyle-hidden-option
      - id: micro-behaviors/process/create/exec::child-process-execution
