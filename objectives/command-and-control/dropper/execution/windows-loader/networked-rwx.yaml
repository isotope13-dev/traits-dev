defaults:
  for: [pe, dll]
  platforms: [windows]

composite_rules:
  # These combinations describe a loader with executable/writable entrypoint
  # code, dynamic API resolution, and an actual network client.  Each hostile
  # rule adds a distinct payload behavior so a single generic RWX heuristic is
  # not carrying the whole verdict.
  - id: unsigned-rwx-network-c2-loader
    desc: Unsigned RWX loader with hardcoded network client
    crit: hostile
    conf: 0.99
    attack: T1027,T1071.001,T1620
    all:
      - id: objectives/anti-static/obfuscation/payload/section::unsigned-rwx-api-resolver-loader
      - id: micro-behaviors/communications/socket/init::winsock-client-lifecycle
      - id: micro-behaviors/communications/ip/literal::external-ipv4-host-literal-binary
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/installer/family/
      - id: well-known/tool/reverse-engineering/

  - id: unsigned-rwx-physicaldrive-network-loader
    desc: Unsigned RWX network loader with PhysicalDrive write capability
    crit: hostile
    conf: 0.995
    attack: T1027,T1071.001,T1620
    all:
      - id: objectives/anti-static/obfuscation/payload/section::unsigned-rwx-api-resolver-loader
      - id: micro-behaviors/communications/socket/init::winsock-client-lifecycle
      - id: micro-behaviors/fs/disk/raw::windows-physicaldrive-write-profile
      - id: micro-behaviors/communications/ip/literal::external-ipv4-host-literal-binary
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/installer/family/
      - id: well-known/tool/reverse-engineering/

  - id: unsigned-rwx-registry-temp-loader
    desc: Unsigned RWX loader writes registry and executes a Temp stage
    crit: hostile
    conf: 0.995
    attack: T1027,T1105,T1112,T1620
    all:
      - id: objectives/anti-static/obfuscation/payload/section::unsigned-rwx-api-resolver-loader
      - id: micro-behaviors/os/registry/access::registry-write-api-chain
      - id: objectives/command-and-control/dropper/staging/temp::temp-file-execution
      - id: micro-behaviors/communications/ip/literal::external-ipv4-host-literal-binary
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/installer/family/
      - id: well-known/tool/reverse-engineering/
