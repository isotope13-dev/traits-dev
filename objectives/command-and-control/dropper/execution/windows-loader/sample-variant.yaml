defaults:
  platforms: [windows]
  for: [pe, dll]
  attack: T1620

traits:
  - id: x86-xor-add-buffer-execution
    desc: x86 XOR-add decoded buffer execution
    crit: suspicious
    conf: 0.99
    attack: T1027,T1620
    arch: [x86]
    if:
      type: hex
      section: .text
      # Mutates bytes at EAX+ESI with XOR/add, then calls EAX after the loop.
      pattern: '8A 14 30 32 D1 80 C2 42 88 14 30 46 3B 35 ?? ?? ?? ?? 72 ?? FF D0'

composite_rules:
  - id: x86-rwx-decoded-file-buffer-execution
    desc: x86 DLL reads, decodes, and executes an RWX file buffer
    crit: hostile
    conf: 0.99
    attack: T1027,T1620
    all:
      - id: x86-xor-add-buffer-execution
      - id: micro-behaviors/mem/alloc/executable::executable-allocation-indicator
      - id: micro-behaviors/mem/protect/modify::virtual-alloc
      - id: micro-behaviors/fs/file/read::read-file
