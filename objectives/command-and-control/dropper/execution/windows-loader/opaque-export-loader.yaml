# NSIS adware plugin stubs: one opaque mixed-case export plus the classic
# VirtualAlloc/VirtualProtect/LoadLibrary/GetProcAddress loader import set.
defaults:
  platforms: [windows]
  for: [pe, dll]
  attack: T1620,T1106
  size_min: 32768
  size_max: 1048576

composite_rules:
  - id: opaque-export-virtual-memory-loader
    desc: Opaque export DLL with virtual-memory loader
    crit: hostile
    conf: 0.96
    all:
      - id: objectives/anti-static/obfuscation/name-mangling/export-name::single-opaque-mixed-case-export
      - id: micro-behaviors/mem/protect/modify::virtual-alloc
      - id: micro-behaviors/mem/protect/modify::virtual-protect
      - id: micro-behaviors/os/module/load::get-proc-address-import
    any:
      - id: micro-behaviors/dylib/load/runtime::load-library-a
      - id: micro-behaviors/dylib/load/runtime::load-library-w
    unless:
      - id: metadata/signed/platform/
