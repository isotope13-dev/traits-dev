# A DNS TXT fallback that reconstructs an executable payload is a delivery
# channel, not ordinary service discovery.  Keep the hostile inference on the
# complete chain so DNS TXT lookups and Base64 decoding remain useful neutral
# capabilities for legitimate software.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  attack: T1105,T1071.004,T1059.007,T1222.002

composite_rules:
  - id: node-dns-txt-native-payload-dropper
    desc: Node DNS TXT chunks form a detached native payload
    crit: hostile
    conf: 0.99
    near_bytes: 8192
    all:
      - id: micro-behaviors/communications/dns/lookup/txt::node-indexed-txt-chunk-query
      - id: micro-behaviors/data/decode/base64::buffer-from-base64
      - id: micro-behaviors/fs/file/write/async::node-write-file-promise-destructured
      - id: micro-behaviors/fs/chmod/executable/mode::node-chmod-exec-mode-755
      - id: micro-behaviors/process/create/exec::node-execfile-reference
      - id: micro-behaviors/process/create/spawn::detached-ignored-unref-spawn

  - id: node-import-time-dns-txt-payload-dropper
    desc: Import-time Node DNS payload dropper
    crit: hostile
    conf: 0.995
    attack: T1195.002,T1105,T1071.004,T1059.007
    near_bytes: 8192
    all:
      - id: micro-behaviors/data/control-flow/module-exec::js-import-time-hook-installation
      - id: node-dns-txt-native-payload-dropper
