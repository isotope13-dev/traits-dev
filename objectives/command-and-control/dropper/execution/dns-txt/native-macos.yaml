# Native/macOS counterpart to the DNS TXT payload dropper.  The individual
# resolver, process, and launchd capabilities stay neutral; the hostile rule
# requires their delivery, detached execution, and persistence combination.
defaults:
  crit: hostile
  conf: 0.99
  platforms: [macos]
  for: [c, cpp, objc]
  attack: T1105,T1071.004,T1059.004,T1543.004

composite_rules:
  - id: native-dns-txt-detached-loader
    for: [c]
    desc: Native DNS TXT payload is written and detached
    all:
      - id: micro-behaviors/communications/dns/lookup/txt::unix-txt-lookup-ns-t-txt
      - id: micro-behaviors/fs/file/open::fopen
      - id: micro-behaviors/fs/write/file/descriptor::write
      - id: micro-behaviors/process/daemonize/detach::setsid-call
      - id: micro-behaviors/process/create/execv::c-exec-family-source

  - id: native-dns-txt-payload-launchagent
    for: [c]
    desc: Native DNS TXT loader installs a detached LaunchAgent payload
    all:
      - id: micro-behaviors/communications/dns/lookup/txt::unix-txt-lookup-ns-t-txt
      - id: micro-behaviors/process/fork/clone::c-fork-call
      - id: micro-behaviors/process/daemonize/detach::setsid-call
      - id: micro-behaviors/process/create/execv::c-exec-family-source
      - id: micro-behaviors/os/service/launchagent::source-launchagents-plist
      - id: micro-behaviors/os/service/launchagent::source-runatload-key
      - id: micro-behaviors/os/service/start::launchctl-load-command
