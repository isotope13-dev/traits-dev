# Staged payloads launched twice: first with the window suppressed, then again
# elevated through Start-Process -Verb RunAs. A legitimate installer elevates
# once, up front, with a UAC prompt that names the product; a dropper that
# first starts the payload silently from a user-writable staging path and only
# afterwards asks for elevation is manufacturing consent — the user approves a
# generic prompt for a process they never saw. Observed in the post-DEF CON
# Google Doc / DocSend campaign (password-protected archive payloads spawned
# hidden, re-run via RunAs twenty seconds later) and in ClickFix loaders that
# park payloads in %LOCALAPPDATA% vendor-branded cache directories.
defaults:
  platforms: [windows]
  for: [powershell, batch, javascript, csharp]
  attack: T1105,T1548.002,T1564.003
  mbc: B0030

composite_rules:
  - id: staged-payload-hidden-elevated-launch
    desc: Staged payload launched hidden then elevated
    crit: hostile
    conf: 0.95
    near_bytes: 4096
    all:
      - id: micro-behaviors/process/create/start-process::start-process-filepath
      - id: micro-behaviors/os/privilege/elevation::runas-verb
      - id: micro-behaviors/fs/path/application/executable::appdata-exe-path
    any:
      - id: micro-behaviors/process/create/hidden::start-process-windowstyle-hidden
      - id: micro-behaviors/process/create/hidden::powershell-windowstyle-hidden-option
      - id: micro-behaviors/process/create/spawn::windowshide-option
