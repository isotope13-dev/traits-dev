# Runtime-triggered package loader: malicious work is placed inside an ordinary
# public method rather than an install hook or module-scope bootstrap. The
# method resolves a script shipped beside the library, silently detaches it,
# hides its Windows console, and suppresses any launch failure. Package and
# stage names are intentionally absent so repackaged libraries retain coverage.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  attack: T1195.002,T1059.007,T1564.003
  mbc: B0024,F0011

composite_rules:
  - id: runtime-method-detached-bundled-stage
    desc: Library method silently detaches a bundled script stage
    crit: hostile
    conf: 0.99
    near_bytes: 2048
    all:
      - id: micro-behaviors/data/source/prototype::prototype-method-function-assignment
      - id: micro-behaviors/fs/path/construct::node-module-relative-path
      - id: micro-behaviors/process/create/spawn::process-execpath-spawn
      - id: micro-behaviors/process/create/spawn::detached-ignored-unref-spawn
      - id: micro-behaviors/data/control-flow/error-handling::empty-catch-block
    unless:
      - id: micro-behaviors/process/create/spawn::node-lazy-daemon-spawn
