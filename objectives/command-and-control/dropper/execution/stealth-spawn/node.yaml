  # Fetch a file off the network, drop it, and run it where nobody can see it.
  #
  # The three transport legs on their own describe an ordinary self-updater:
  # plenty of legitimate CLIs download a release asset, write it next to
  # themselves and launch it. What an updater does not do is hide the result.
  # `detached` + `stdio: "ignore"` + `unref()` severs the child from the
  # installing process's lifetime and throws away everything it prints, and
  # `windowsHide` suppresses its console. Taken together the author has
  # arranged for the downloaded program to run with no window, no output and
  # no parent — which is a requirement only when the user is not supposed to
  # notice.
  #
  # Deliberately says nothing about *what* is launched. The mshta form of this
  # is named separately in dropper/execution/script/mshta.yaml; keying this one
  # on the spawn shape instead keeps it valid when the next sample drops a
  # `.scr`, a `.js` for wscript, or a plain executable.
- id: js-fetch-drop-hidden-detached-launch
  desc: Runs a downloaded file hidden and detached
  crit: hostile
  conf: 0.95
  attack: "T1105,T1059.007,T1564.003"
  mbc: "B0024, F0011"
  all:
  - id: micro-behaviors/communications/http/url/domain::js-remote-host-url
  - id: micro-behaviors/fs/file/write/async::node-write-file-promise-destructured
  - id: micro-behaviors/process/create/spawn::detached-ignored-unref-spawn
  - id: micro-behaviors/process/create/spawn::windowshide-option
  unless:
  - id: metadata/library/structure/
  - id: metadata/package/testing/

# An install-time payload whose every path and filename is rebuilt from
# XOR-decoded numeric arrays before spawning a detached, unref'd child. The
# install-hook obfuscation rules convict the packed postinstall; this states
# the execution -- the child is unlinked from its parent on purpose, so
# nothing in the process tree explains what is running or where it came from.
#
# Worked example: the @fnos dayjs postinstall, which reconstructs its paths
# from byte arrays and spawns the result detached with .unref().
- id: xor-reconstructed-detached-spawn
  desc: XOR-reconstructed payload spawns detached child
  crit: hostile
  conf: 0.96
  attack: T1027,T1059
