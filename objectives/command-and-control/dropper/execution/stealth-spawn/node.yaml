# Module-load fire-and-forget loader: a detached/ignored/unref'd child whose
# argv is a curl|wget-piped-to-shell one-liner. No legitimate library spawns a
# background shell that pipes a remote download into an interpreter at import.
- id: node-detached-remote-shell-loader
  desc: Detached spawn runs curl-piped-to-shell loader
  crit: hostile
  conf: 0.95
  attack: "T1059.004,T1059.007,T1105,T1195.002"
  mbc: "B0024,F0011"
  # The detached spawn and remote shell loader must be part of the same
  # compact loader; unrelated helpers elsewhere in a source file do not form
  # this behavior.
  #
  # Measured in bytes, not lines, because the inputs this rule has to survive
  # have no line breaks. A `.js.map` is one 500 KB line of JSON, so a 128-*line*
  # window is the whole file: @synkro-sh/cli's source map paired a detached
  # spawn with `curl -fsSL https://bun.sh/install | bash` sitting 11.6 KB away
  # inside a `throw new LocalCCInstallError(...)` message — a remediation hint
  # printed to the user, never executed. The same rule correctly stayed silent
  # on the shipped `bootstrap.js`, which has real line breaks. 6 KB is the same
  # span as 128 lines of ordinary TypeScript and is layout-independent, so it
  # holds on minified bundles too. The sibling rules in this file still use
  # `near_lines` and carry the same latent weakness on one-line inputs.
  near_bytes: 6144
  all:
  - id: micro-behaviors/process/create/spawn::detached-ignored-unref-spawn
  - id: objectives/command-and-control/dropper/execution/pipe::curl-download-pipe-shell
  unless:
  - id: well-known/app/ai/coding-agent/qwen-code::qwen-code-bundle-text
  - id: well-known/app/system/vellum::cli-package-context
  - id: well-known/tool/development/github-actions/setup-docker-action/
