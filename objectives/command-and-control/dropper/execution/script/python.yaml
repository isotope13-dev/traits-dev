# Python Script Dropper Patterns
# Detects Python scripts that download and execute remote payloads
# ATT&CK: T1059.006 (Python), T1105 (Ingress Tool Transfer)
defaults:
  attack: T1105
  mbc: B0024
  platforms: [unix, windows]
  for: [python]
traits:
  - id: curl-slo-variable-output
    desc: Python curl writes variable path
    crit: suspicious
    conf: 0.9
    platforms: [unix]
    unless:
      - id: well-known/tool/detection/agent-glovebox::archive-context
    if:
      type: text
      regex: 'curl\s+-sLo\s+\{?[A-Za-z_][A-Za-z0-9_]*\}?'
  - id: chmod-variable-output
    desc: Python chmods variable path
    crit: component
    conf: 0.9
    platforms: [unix]
    if:
      type: text
      regex: '&&\s*chmod\s+\+x\s+\{?[A-Za-z_][A-Za-z0-9_]*\}?'
  - id: echo-config-piped-to-var
    desc: Echoed config piped to variable
    crit: component
    conf: 0.9
    platforms: [unix]
    if:
      type: text
      regex: "echo\\s+['\"]\\{?[A-Za-z_][A-Za-z0-9_]*\\}?['\"]\\s*\\|"
  - id: inline-wget-download-exec
    desc: Python inline wget download execute
    crit: suspicious
    conf: 0.9
    platforms: [unix]
    if:
      type: string_literal
      regex: 'wget\s+https?://.{10,300}&&.{0,50}(tar|chmod|\./)'
    unless:
      - id: well-known/app/infrastructure/mgmt
composite_rules:
  - id: appdata-exe-write-path
    desc: Writes EXE under APPDATA
    crit: suspicious
    conf: 0.92
    platforms: [windows]
    all:
      - id: micro-behaviors/fs/path/application/executable::appdata-exe-path
      - id: micro-behaviors/fs/write/file/target::write-exe
    near_lines: 40
    unless:
      - id: metadata/build/recognized-contexts::benign-app-fp-context
      - id: well-known/lib/data/market-data::dartlab-finance-context
  - id: shell-curl-chmod-dropper
    desc: Python shell subprocess curl chmod dropper
    crit: suspicious
    conf: 0.9
    all:
      - id: micro-behaviors/process/create/shell-subprocess::shell-true
      - id: curl-slo-variable-output
      - id: chmod-variable-output
  - id: detached-stdin-config-dropper
    desc: Python detached stdin config dropper
    crit: hostile
    conf: 0.96
    all:
      - id: shell-curl-chmod-dropper
      - id: echo-config-piped-to-var
      - id: micro-behaviors/process/create/subprocess::subprocess-detached-session
    any:
      - id: micro-behaviors/fs/delete/file/library::py-remove
      - id: micro-behaviors/fs/delete/directory::shutil-rmtree
  # Python subprocess executing a download-and-pipe-to-shell pattern
  # e.g., subprocess.run("curl ... | shell", shell=True)
  - id: subprocess-download-execute
    desc: Python subprocess download-and-execute dropper
    crit: hostile
    conf: 0.95
    near_lines: 20
    all:
      - id: micro-behaviors/process/create/subprocess::process-execution
      - id: micro-behaviors/process/create/shell/pipeline::python-curl-pipe-bash-string
    any:
      - id: micro-behaviors/process/create/shell-subprocess::shell-true
  # Python file with subprocess shell=True and curl|shell
  # Broader: catches cases where methods composite doesn't fire but raw subprocess does
  - id: shell-true-curl-pipe
    desc: Python shell=True with curl pipe to interpreter
    crit: hostile
    conf: 0.95
    near_lines: 20
    all:
      - id: micro-behaviors/process/create/shell-subprocess::shell-true
      - id: micro-behaviors/process/create/shell/pipeline::python-curl-pipe-bash-string
  - id: python-download-appdata-startfile
    desc: Import replaces Local AppData executable
    crit: hostile
    conf: 0.99
    platforms: [windows]
    near_lines: 40
    all:
      - id: objectives/command-and-control/dropper/download::python-github-response-write-startfile
      - id: micro-behaviors/fs/path/app-data::python-userprofile-local-appdata-path
      - id: micro-behaviors/fs/delete/file/library::py-remove
  - id: python-os-system-wget-download-exec
    desc: Python os.system wget download execute
    crit: hostile
    conf: 0.95
    platforms: [unix]
    all:
      - id: micro-behaviors/process/create/system::python-os-system
      - id: inline-wget-download-exec
  - id: python-module-os-system-curl
    desc: Module runs curl through os.system
    crit: hostile
    conf: 0.96
    attack: T1105,T1071.001
    near_lines: 3
    all:
      - id: micro-behaviors/process/create/system::python-os-system
      - id: micro-behaviors/communications/http/curl::curl-dotted-host
      - id: micro-behaviors/data/control-flow/module-exec::module-level-side-effect-call
  - id: python-os-system-curl-chmod-launch
    desc: os.system downloads, marks, and launches
    crit: hostile
    conf: 0.96
    platforms: [unix]
    attack: T1105,T1059.004
    near_lines: 6
    all:
      - id: micro-behaviors/process/create/system::python-os-system
      - id: micro-behaviors/communications/http/download/curl::curl-output-file
      - id: micro-behaviors/fs/chmod/executable/mode::chmod-exec-tmp-file
  - id: python-os-system-curl-cmd-start
    desc: Curl download is started with cmd
    crit: hostile
    conf: 0.95
    attack: T1105,T1059.003
    near_lines: 12
    all:
      - id: micro-behaviors/process/create/system::python-os-system
      - id: objectives/command-and-control/dropper/delivery/download::curl-silent-output
      - id: micro-behaviors/process/create/shell/script-host::cmd-exe-c-start-launch
