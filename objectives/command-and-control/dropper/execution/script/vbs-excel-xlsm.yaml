# VBS launchers that open a sibling macro-enabled Excel workbook via
# Excel.Application / Workbooks.Open. Common MalwareBazaar pairing with
# weaponized .xlsm (Launch_ESD.vbs → Stasiun_ESD_Master.xlsm).
defaults:
  platforms: [windows]
  for: [vbs]
  attack: T1059.005,T1204.002
  mbc: B0030

traits:
  - id: createobject-excel-application-text
    desc: CreateObject Excel.Application call
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: '(?i)(CreateObject|GetObject)\s*\(\s*["'']Excel\.Application["'']\s*\)'

  - id: excel-workbooks-open-call
    desc: Excel Workbooks.Open method call
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: '(?i)\.Workbooks\.Open\s*\('

  - id: xlsm-sibling-path
    desc: Path to a macro-enabled XLSM workbook
    crit: notable
    conf: 0.93
    if:
      type: text
      regex: '(?i)["''][^"''\r\n]{0,160}\.xlsm["'']'

  - id: excel-display-fullscreen
    desc: Forces Excel DisplayFullScreen mode
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)\.DisplayFullScreen\s*='

composite_rules:
  - id: vbs-excel-xlsm-workbook-launcher
    desc: VBS opens sibling Excel macro workbook
    crit: hostile
    conf: 0.98
    attack: T1059.005,T1204.002,T1566.001
    near_bytes: 2048
    all:
      - id: createobject-excel-application-text
      - id: excel-workbooks-open-call
      - id: xlsm-sibling-path
    any:
      - id: excel-display-fullscreen
      - id: micro-behaviors/os/com/object::filesystemobject-constructor
