# UTF-16 / high-byte JScript that hides ActiveX instantiation behind a
# Syriac→ASCII alphabet map (Quotation.js / DrWeb JS.Muldrop class). The
# map+decoder hostiles live under anti-static/.../syriac-alphabet-map; this
# composite adds the this[decode](ProgID) ActiveX call shape.
defaults:
  platforms: [windows]
  for: [javascript]
  attack: T1059.007,T1027.002,T1106
  mbc: B0032,B0030

composite_rules:
  - id: syriac-charmap-activex-dropper
    desc: Syriac char-map JScript ActiveX dropper
    crit: hostile
    conf: 0.98
    near_bytes: 16384
    all:
      - id: objectives/anti-static/obfuscation/steganography/unicode::syriac-alphabet-map-decoder
      - id: micro-behaviors/data/source/dynamic/reflect::computed-this-method-call
      - id: metadata/file/metrics::high-byte-script-text
