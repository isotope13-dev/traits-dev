defaults:
  platforms:
  - unix
  - windows
  for:
  - batch
  - shell
  - powershell
  - javascript
  - html
  attack: T1218.005
traits:
- id: mshta-remote-url
  desc: MSHTA remote payload fetch
  crit: suspicious
  conf: 0.95
  mbc: E1218.005
  if:
    type: text
    regex: (?i)\bmshta(\.exe)?\s+https?://
- id: vscode-task-mshta-remote-url
  desc: VS Code task invokes remote MSHTA URL
  crit: suspicious
  conf: 0.98
  platforms:
  - windows
  for:
  - json
  if:
    type: value
    path: tasks[*].command
    regex: (?i)^\s*mshta(\.exe)?\s+https?://
- id: encoded-mshta-remote-url
  desc: Encoded command runs mshta on a URL
  crit: suspicious
  conf: 0.95
  for:
  - python
  - shell
  - powershell
  if:
    type: encoded
    encoding: base64
    regex: (?i)\bmshta(\.exe)?\s+https?://
- id: mshta-remote-msixbundle-url
  desc: MSHTA fetches remote MSIX bundle
  crit: suspicious
  conf: 0.98
  mbc: E1218.005
  if:
    type: text
    regex: (?i)\bmshta(\.exe)?\s+https?://[^\s"'#]{1,200}\.msixbundle\b
- id: mshta-remote-archive-url
  desc: MSHTA fetches remote archive file
  crit: suspicious
  conf: 0.95
  mbc: E1218.005
  if:
    type: text
    regex: (?i)\bmshta(\.exe)?\s+https?://[^\s"'#]{1,200}\.(zip|rar|7z)\b
- id: mshta-https-b64-fragment
  desc: Encoded MSHTA HTTPS fragment
  crit: notable
  conf: 0.9
  for:
  - powershell
  if:
    type: string_literal
    exact: EuZXhlIGh0dHBzO
- id: geo-foundation-b64-fragment
  desc: Encoded geo-foundation domain fragment
  crit: notable
  conf: 0.95
  for:
  - powershell
  if:
    type: string_literal
    exact: ZvdW5kYXRp
- id: mshta-inline-vbscript
  desc: MSHTA inline VBScript execution
  crit: notable
  conf: 0.9
  mbc: E1218.005
  if:
    type: text
    regex: '(?i)\bmshta\s+[''"]?vbscript:'
- id: mshta-inline-javascript
  desc: MSHTA inline JavaScript execution
  crit: notable
  conf: 0.9
  mbc: E1218.005
  if:
    type: text
    regex: '(?i)\bmshta\s+[''"]?javascript:'
composite_rules:
- id: ps-fragmented-mshta-remote-url
  desc: Fragmented MSHTA remote payload fetch
  crit: suspicious
  conf: 0.96
  for:
  - powershell
  all:
  - id: mshta-https-b64-fragment
  - id: geo-foundation-b64-fragment
- id: mshta-remote-package-url
  desc: MSHTA fetches remote package file
  crit: suspicious
  conf: 0.98
  any:
  - id: mshta-remote-msixbundle-url
  - id: mshta-remote-archive-url
- id: npm-preinstall-mshta-remote-stage
  desc: npm preinstall launches remote MSHTA stage
  crit: hostile
  conf: 0.995
  attack: T1195.002
  mbc: E1218.005
  scope: archive
  for:
  - javascript
  - package.json
  - npm
  - tar
  all:
  - id: objectives/supply-chain/install-hook/scripts/declaration::has-preinstall
  - id: mshta-remote-url
  any:
  - id: micro-behaviors/process/create/exec::exec-api-call
  - id: micro-behaviors/process/create/shell/bridge::child-process-require
- id: python-b64-mshta-hidden-subprocess
  desc: Python decodes base64 mshta command into hidden subprocess
  crit: hostile
  conf: 0.97
  attack: T1140,T1218.005,T1564.003
  for:
  - python
  near_lines: 40
  all:
  - id: micro-behaviors/data/decode/base64::b64decode-call
  - id: micro-behaviors/process/create/launch::mshta-execution
  - id: micro-behaviors/process/create/flags::creationflags
  - id: micro-behaviors/process/create/subprocess::process-execution
  unless:
  - id: metadata/package/testing/
- id: js-fetch-drop-mshta-hidden-launch
  desc: Fetches a payload and runs it hidden via mshta
  crit: hostile
  conf: 0.97
  attack: T1218.005,T1105,T1564.003
  mbc: E1218.005
  for:
  - javascript
  - typescript
  all:
  - id: micro-behaviors/communications/http/url/domain::js-remote-host-url
  - id: micro-behaviors/fs/write/file/full::node-write-file-promise-destructured
  - id: micro-behaviors/process/create/launch::mshta-execution
  - id: micro-behaviors/process/create/spawn::detached-ignored-unref-spawn
  any:
  - id: micro-behaviors/process/create/spawn::windowshide-option
  - id: micro-behaviors/fs/path/extension::hta-extension
  unless:
  - id: metadata/package/testing/
- id: encoded-mshta-os-system-exec
  desc: exec() runs an encoded mshta command
  crit: hostile
  conf: 0.96
  attack: T1218.005,T1027
  for:
  - python
  scope: file
  all:
  - id: encoded-mshta-remote-url
  - id: objectives/anti-static/obfuscation/encoding/content::encoded-python-os-system
  - id: objectives/anti-static/obfuscation/control-flow/logic::base64-exec-text
- id: batch-background-public-mshta-stage
  desc: Batch runs a Users\Public HTA through background MSHTA
  crit: hostile
  conf: 0.98
  attack: T1218.005,T1564.003
  for:
  - batch
  all:
  - id: micro-behaviors/process/daemonize/spawn::start-no-new-window
  - id: micro-behaviors/process/create/launch::mshta-execution
  - id: micro-behaviors/fs/path/system::users-public-script-path
  - id: micro-behaviors/fs/path/extension::hta-extension
- id: reversed-mshta-remote-launch
  desc: Reversed mshta fetches a remote payload
  crit: hostile
  conf: 0.97
  attack: T1218.005,T1105
  mbc: E1218.005
  for:
  - vbs
  - html
  all:
  - id: objectives/anti-static/obfuscation/string/reverse::reversed-mshta-name
  - id: objectives/anti-static/obfuscation/string/reverse::reversed-wscript-shell-progid
  - id: micro-behaviors/process/create/shell/wsh::wsh-run-url-argument
