# Windows MSHTA script-host execution traits.
# Include html: InstallFix / ClickFix lure pages plant mshta one-liners on the
# clipboard for Win+R paste-run (fake installer guides, CAPTCHA pages).
defaults:
  platforms: [unix, windows]
  for: [batch, shell, powershell, javascript, html]
  attack: T1218.005
traits:
  - id: mshta-remote-url
    desc: MSHTA remote payload fetch
    crit: suspicious
    conf: 0.95
    mbc: E1218.005
    if:
      type: text
      regex: '(?i)\bmshta(\.exe)?\s+https?://'
  # VS Code stores a task's executable command as structured JSON. Matching
  # the command value keeps an unrelated MSHTA string elsewhere in a workspace
  # file from being reported as execution, while covering the malicious
  # folder-open project technique independently of the task label or lure.
  - id: vscode-task-mshta-remote-url
    desc: VS Code task invokes remote MSHTA URL
    crit: suspicious
    conf: 0.98
    platforms: [windows]
    for: [json]
    if:
      type: value
      path: tasks[*].command
      regex: '(?i)^\s*mshta(\.exe)?\s+https?://'
  - id: encoded-mshta-remote-url
    desc: Encoded command runs mshta on a URL
    crit: suspicious
    conf: 0.95
    for: [python, shell, powershell]
    if:
      type: encoded
      encoding: base64
      regex: '(?i)\bmshta(\.exe)?\s+https?://'
  - id: mshta-remote-msixbundle-url
    desc: MSHTA fetches remote MSIX bundle
    crit: suspicious
    conf: 0.98
    mbc: E1218.005
    if:
      type: text
      regex: '(?i)\bmshta(\.exe)?\s+https?://[^\s"''#]{1,200}\.msixbundle\b'
  - id: mshta-remote-archive-url
    desc: MSHTA fetches remote archive file
    crit: suspicious
    conf: 0.95
    mbc: E1218.005
    if:
      type: text
      regex: '(?i)\bmshta(\.exe)?\s+https?://[^\s"''#]{1,200}\.(zip|rar|7z)\b'
  - id: mshta-https-b64-fragment
    desc: Encoded MSHTA HTTPS fragment
    crit: notable
    conf: 0.9
    for: [powershell]
    if:
      type: string_literal
      exact: EuZXhlIGh0dHBzO
  - id: geo-foundation-b64-fragment
    desc: Encoded geo-foundation domain fragment
    crit: notable
    conf: 0.95
    for: [powershell]
    if:
      type: string_literal
      exact: ZvdW5kYXRp
  - id: mshta-inline-vbscript
    desc: MSHTA inline VBScript execution
    crit: notable
    conf: 0.9
    mbc: E1218.005
    if:
      type: text
      regex: '(?i)\bmshta\s+[''"]?vbscript:'
  - id: mshta-inline-javascript
    desc: MSHTA inline JavaScript execution
    crit: notable
    conf: 0.9
    mbc: E1218.005
    if:
      type: text
      regex: '(?i)\bmshta\s+[''"]?javascript:'
composite_rules:
  - id: ps-fragmented-mshta-remote-url
    desc: Fragmented MSHTA remote payload fetch
    crit: suspicious
    conf: 0.96
    for: [powershell]
    all:
      - id: mshta-https-b64-fragment
      - id: geo-foundation-b64-fragment
  - id: mshta-remote-package-url
    desc: MSHTA fetches remote package file
    crit: suspicious
    conf: 0.98
    any:
      - id: mshta-remote-msixbundle-url
      - id: mshta-remote-archive-url
  - id: npm-preinstall-mshta-remote-stage
    desc: npm preinstall launches remote MSHTA stage
    crit: hostile
    conf: 0.995
    attack: T1195.002
    mbc: E1218.005
    scope: archive
    for: [javascript, package.json, npm, tar]
    all:
      - id: objectives/supply-chain/install-hook/scripts/declaration::has-preinstall
      - id: mshta-remote-url
    any:
      - id: micro-behaviors/process/create/exec::exec-api-call
      - id: micro-behaviors/process/create/shell/bridge::child-process-require
  - id: python-b64-mshta-hidden-subprocess
    desc: Python decodes base64 mshta command into hidden subprocess
    crit: hostile
    conf: 0.97
    attack: T1140,T1218.005,T1564.003
    for: [python]
    near_lines: 40
    all:
      - id: micro-behaviors/data/decode/symbol-base64::b64decode-call
      - id: micro-behaviors/process/create/launch::mshta-execution
      - id: micro-behaviors/process/create/flags::creationflags
      - id: micro-behaviors/process/create/subprocess::process-execution
    unless:
      - id: metadata/package/testing/

  # The two-step form: fetch the HTA over HTTP, drop it, then hand the file to
  # mshta.
  #
  # Every mshta rule above keys on the URL sitting on mshta's own command line
  # (`mshta https://…`), which is what a one-liner lure pastes into Win+R. Code
  # does not have to write it that way, and this sample does not: it `fetch`es
  # the payload, `writeFile`s it into `os.tmpdir()`, and spawns mshta on the
  # local path. The remote URL and the interpreter never appear in the same
  # string, so nothing above sees it.
  #
  # The spawn options are what make it hostile rather than a program launching
  # a helper: `detached` + `stdio: "ignore"` + `unref()` cut the child loose
  # from the parent's lifetime and discard its output, and `windowsHide` keeps
  # the HTA window off the screen. A program that wanted the user to see the
  # document it just downloaded would not do any of those.
  #
  # mshta is the LOLBin here, but the shape is the technique: remote fetch,
  # write to a temp path, execute detached and hidden through a signed system
  # interpreter.
  - id: js-fetch-drop-mshta-hidden-launch
    desc: Fetches a payload and runs it hidden via mshta
    crit: hostile
    conf: 0.97
    attack: T1218.005,T1105,T1564.003
    mbc: E1218.005
    for: [javascript, typescript]
    all:
      - id: micro-behaviors/communications/http/url/domain::js-remote-host-url
      - id: micro-behaviors/fs/write/file/full::node-write-file-promise-destructured
      - id: micro-behaviors/process/create/launch::mshta-execution
      - id: micro-behaviors/process/create/spawn::detached-ignored-unref-spawn
    any:
      - id: micro-behaviors/process/create/spawn::windowshide-option
      - id: micro-behaviors/fs/path/extension::hta-extension
    unless:
      - id: metadata/package/testing/

  - id: encoded-mshta-os-system-exec
    desc: exec() runs an encoded mshta command
    crit: hostile
    conf: 0.96
    attack: T1218.005,T1027
    for: [python]
    scope: file
    all:
      - id: encoded-mshta-remote-url
      - id: objectives/anti-static/obfuscation/encoding/content::encoded-python-os-system
      - id: objectives/anti-static/obfuscation/control-flow/logic::base64-exec-text

  # A local HTA is not inherently malicious. Running it from the shared,
  # user-writable Public tree while suppressing the console is the loader
  # shape used by staged phishing chains and is independent of chosen names.
  - id: batch-background-public-mshta-stage
    desc: Batch runs a Users\Public HTA through background MSHTA
    crit: hostile
    conf: 0.98
    attack: T1218.005,T1564.003
    for: [batch]
    all:
      - id: micro-behaviors/process/daemonize/spawn::start-no-new-window
      - id: micro-behaviors/process/create/launch::mshta-execution
      - id: micro-behaviors/fs/path/system::users-public-script-path
      - id: micro-behaviors/fs/path/extension::hta-extension

  # The reversed-spelling form: neither `mshta` nor `WScript.Shell` appears,
  # so the mshta-remote-url atom above never sees it. The reversed LOLBIN
  # name plus a Run of a remote URL is the same fetch-and-execute behavior
  # with the interpreter hidden from static extraction.
  - id: reversed-mshta-remote-launch
    desc: Reversed mshta fetches a remote payload
    crit: hostile
    conf: 0.97
    attack: T1218.005,T1105
    mbc: E1218.005
    for: [vbs, html]
    all:
      - id: objectives/anti-static/obfuscation/string/reverse::reversed-mshta-name
      - id: objectives/anti-static/obfuscation/string/reverse::reversed-wscript-shell-progid
      - id: micro-behaviors/process/create/shell/wsh::wsh-run-url-argument
