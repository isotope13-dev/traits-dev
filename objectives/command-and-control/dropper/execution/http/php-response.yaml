defaults:
  crit: hostile
  conf: 0.98
  platforms: [windows, unix]
  for: [php]
  attack: T1105

composite_rules:
  - id: php-curl-response-script-stage
    desc: Obfuscated PHP stages a cURL response as a sibling script
    scope: outer
    near_bytes: 400
    all:
      - id: micro-behaviors/communications/http/download/curl::php-curl-response-file-write
      - id: micro-behaviors/fs/path/construct::php-obfuscated-sibling-script-path

  - id: php-curl-write-include-chain
    desc: PHP cURL write-and-include chain
    near_bytes: 320
    all:
      - id: micro-behaviors/communications/http/download/curl::php-curl-variable-file-write
      - id: micro-behaviors/process/lifecycle/auto-exec::php-file-check-before-variable-include
