defaults:
  platforms: [unix]
  for: [rust, macho, elf]
  attack: T1105

traits:
  - id: rust-dropper-deploy-path
    desc: Rust dropper deploy path
    crit: suspicious
    conf: 0.94
    if:
      type: text
      substr: /deploy/payload

  - id: rust-dropper-nohup-spawn
    desc: Rust dropper nohup spawn
    crit: notable
    conf: 0.94
    unless:
      - id: well-known/app/development/openai-codex/
    if:
      type: text
      substr: Command::new("nohup")

  # A literal alone is only a fragment. The hostile composite below requires
  # Rust process creation plus output collection in the same source file.
  #
  # Require something fetchable between `curl` and the pipe — a URL, a shell
  # variable, or a Rust format!/`{}` interpolation. Bare "curl | sh" with no
  # argument is prose, not a command: lean-ctx's shell-hook test embeds the
  # comment "# Simulate curl | sh" in the script it runs, and that names the
  # pattern without downloading anything.
  - id: rust-curl-pipe-shell-literal
    desc: Curl pipe-shell command string literal
    crit: component
    conf: 0.96
    for: [rust]
    if:
      type: literal
      kind: string
      regex: 'curl\s[^|\r\n]{0,80}(https?://|\$|\{\w)[^|\r\n]{0,50}\|\s*(sh|bash|cmd)\b'

composite_rules:
  - id: rust-http-download-execute
    desc: Rust HTTP download execute
    crit: hostile
    conf: 0.98
    all:
      - id: rust-dropper-deploy-path
      - id: micro-behaviors/fs/chmod/executable/mode::permissions-from-mode-755
      - id: rust-dropper-nohup-spawn

  - id: rust-curl-pipe-shell-rce
    desc: Rust runs remote curl pipe shell via Command
    crit: hostile
    conf: 0.98
    attack: T1105,T1059.004
    for: [rust]
    all:
      - id: rust-curl-pipe-shell-literal
      - id: micro-behaviors/process/create/direct::rust-process-command-import
      - id: micro-behaviors/process/create/direct::rust-command-output

  - id: rust-wget-pipe-shell-rce
    desc: Rust runs remote wget pipe shell via Command
    crit: hostile
    conf: 0.98
    attack: T1105,T1059.004
    for: [rust]
    all:
      - id: micro-behaviors/process/create/direct::rust-process-command-import
      - id: micro-behaviors/process/create/direct::rust-command-output
      - id: objectives/command-and-control/dropper/delivery/pipe::wget-pipe-shell
