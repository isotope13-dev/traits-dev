# Windows LuaJIT sidecar loaders.  SmartLoader keeps malicious Lua in a data
# file and asks a renamed interpreter to execute it, with LuaJIT FFI resolving
# Windows APIs at runtime.
defaults:
  platforms: [windows]
  for: [lua, batch, text]
  attack: T1059.007,T1105

traits:
  - id: lua-ffi-cdef
    desc: LuaJIT FFI declaration block
    crit: notable
    conf: 0.94
    if:
      type: text
      substr: ffi.cdef

  - id: lua-ffi-process-api
    desc: LuaJIT FFI process API declaration
    crit: suspicious
    conf: 0.95
    if:
      type: text
      word: CreateProcessW

  - id: lua-runtime-dll-name
    desc: Lua runtime DLL name
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '\blua[0-9]{1,2}\.dll\b'

  - id: lua-executable-sidecar-name
    desc: Lua loader executable name
    crit: notable
    conf: 0.88
    if:
      type: text
      regex: '\b[A-Za-z0-9._-]+\.exe\b'
    not:
      - exact: go.exe

  - id: lua-script-sidecar-name
    desc: Lua loader data sidecar name
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '\b[A-Za-z0-9._-]+\.(lua|txt|log|dat)\b'

  - id: lua-sidecar-interpreter-launch
    desc: Interpreter launches sidecar code
    crit: suspicious
    conf: 0.95
    if:
      type: text
      regex: '\b[A-Za-z0-9._-]+\.exe\s+[A-Za-z0-9._%\\/-]+\.(lua|txt|log|dat)\b'

composite_rules:
  - id: lua-ffi-windows-api-declarations
    desc: LuaJIT FFI resolves Windows APIs
    crit: suspicious
    conf: 0.98
    all:
      - id: lua-ffi-cdef
    any:
      - id: micro-behaviors/hardware/display/screenshot::gdi-screen-dimensions-source
      - id: micro-behaviors/hardware/display/screenshot::gdi-dib-section-source
      - id: micro-behaviors/hardware/display/screenshot::gdi-bitblt-source
      - id: lua-ffi-process-api
    needs: 2
    near_bytes: 512

  - id: lua-runtime-sidecar-bundle
    desc: Lua runtime with executable sidecar
    crit: suspicious
    conf: 0.96
    all:
      - id: lua-runtime-dll-name
      - id: lua-executable-sidecar-name
      - id: lua-script-sidecar-name

  - id: lua-ffi-sidecar-loader
    desc: LuaJIT FFI sidecar loader
    crit: hostile
    conf: 0.99
    all:
      - id: lua-ffi-windows-api-declarations
      - id: lua-runtime-sidecar-bundle
      - id: lua-sidecar-interpreter-launch
