# Windows LuaJIT sidecar loaders.  SmartLoader keeps malicious Lua in a data
# file and asks a renamed interpreter to execute it, with LuaJIT FFI resolving
# Windows APIs at runtime.
defaults:
  platforms: [windows]
  for: [lua, batch, text]
  attack: T1059.007,T1105

traits:
  - id: lua-ffi-cdef
    desc: LuaJIT FFI declaration block
    crit: notable
    conf: 0.94
    if:
      type: text
      substr: ffi.cdef

  - id: lua-ffi-process-api
    desc: LuaJIT FFI CreateProcessW declaration
    crit: suspicious
    conf: 0.95
    if:
      # Windows API databases and headers routinely list CreateProcessW.
      # Require the LuaJIT FFI declaration call and the API in the same
      # declaration block before treating it as a sidecar-loader signal.
      type: text
      regex: 'ffi\.cdef.{0,512}\bCreateProcessW\b'
      case_insensitive: true
    unless:
      - id: well-known/tool/development/darling/

  - id: lua-runtime-dll-name
    desc: Lua runtime DLL name
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '\blua[0-9]{1,2}\.dll\b'

  # The former lua-executable-sidecar-name (`<anything>.exe`) and
  # lua-script-sidecar-name (`<anything>.(lua|txt|log|dat)`) are gone.  Neither
  # matched anything Lua- or loader-specific -- they fired on every LICENSE.TXT,
  # every `*-CMakeLists.txt.patch`, and every mention of any Windows binary --
  # so naming them "Lua loader ... name" claimed an identity the regex never
  # established.  The sidecar *relationship* is what carries meaning, and
  # lua-sidecar-interpreter-launch below already expresses it in one matcher.
  - id: lua-sidecar-interpreter-launch
    desc: Interpreter launches sidecar code
    crit: suspicious
    conf: 0.95
    if:
      type: text
      # Use [ \t]+ not \s+: wordlists often place setup.exe and setup.txt on
      # consecutive lines, and \s would bridge the newline into a false positive.
      regex: '\b[A-Za-z0-9._-]+\.exe[ \t]+[A-Za-z0-9._%\\/-]+\.(lua|txt|log|dat)\b'

composite_rules:
  - id: lua-ffi-windows-api-declarations
    desc: LuaJIT FFI resolves Windows APIs
    crit: suspicious
    conf: 0.98
    all:
      - id: lua-ffi-cdef
    any:
      - id: micro-behaviors/hardware/display/screenshot::gdi-screen-dimensions-source
      - id: micro-behaviors/hardware/display/screenshot::gdi-dib-section-source
      - id: micro-behaviors/hardware/display/screenshot::gdi-bitblt-source
      - id: lua-ffi-process-api
    needs: 2
    near_bytes: 512

  - id: lua-runtime-sidecar-bundle
    desc: Lua runtime with executable sidecar
    crit: suspicious
    conf: 0.96
    all:
      - id: lua-runtime-dll-name
      - id: lua-sidecar-interpreter-launch

  - id: lua-ffi-sidecar-loader
    desc: LuaJIT FFI sidecar loader
    crit: hostile
    conf: 0.99
    all:
      - id: lua-ffi-windows-api-declarations
      - id: lua-runtime-sidecar-bundle
