# Go implant build lines written in a POSIX shell script. The Windows-targeted
# counterpart of go-batch.yaml in this directory; same toolchain, same intent,
# different host for the build.
defaults:
  platforms: [windows, unix]
  for: [shell, powershell, python, github-actions]

composite_rules:
  # `go build -ldflags "-H=windowsgui -s -w" -o dist/notepad` -- three
  # decisions that only make sense together for an implant: no console window
  # when it runs, no symbols for whoever looks at it afterwards, and a name
  # the victim will not question. A real GUI application takes the first two
  # and keeps its own name.
  - id: go-gui-build-system-named-output
    desc: Go build emits console-less system-named binary
    crit: suspicious
    conf: 0.94
    attack: T1036.005,T1564.003
    all:
      - id: micro-behaviors/process/create/compile::go-build-command
      - id: micro-behaviors/process/create/compile::go-ldflags-windows-gui
    any:
      - id: objectives/evasion/masquerade/naming/application::build-output-system-process-name
      - id: objectives/evasion/masquerade/naming/application::build-output-bundled-app-name
