defaults:
  platforms: [windows]
  for: [batch]

composite_rules:
  # Build scripts that stamp C2/persistence via -X, strip/hide the console,
  # and emit multi-OS "agent-*" binaries are implant toolchains, not app CI.
  - id: go-agent-stealth-cross-builder
    desc: Go agent cross-build with stealth and -X embeds
    crit: hostile
    conf: 0.97
    unless:
      - id: metadata/build/conda/
    all:
      - id: micro-behaviors/process/create/compile::go-build-release-flags
      - id: micro-behaviors/process/create/compile::go-ldflags-symbol-inject
      - id: micro-behaviors/process/create/compile::go-cross-compile-agent-output
    any:
      - id: objectives/anti-static/obfuscation/obfuscator/garble::garble-build-invocation
      - id: micro-behaviors/process/create/compile::go-ldflags-windows-gui
