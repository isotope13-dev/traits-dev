# A macro that runs on open, invokes every staged API through a method name
# assembled from string fragments, reads the HTTP response body without ever
# naming responseBody, and stages the result under a path derived from the
# process environment. Each leg is ordinary somewhere else; a document that
# combines all four is fetching a payload while hiding the fetch.
defaults:
  platforms: [windows]
  for: [vbs]
  attack: T1105,T1027,T1059.005

composite_rules:
  - id: vba-fragmented-dispatch-http-stager
    desc: Macro fetches HTTP payload through split-string dispatch
    crit: hostile
    conf: 0.97
    all:
      - id: micro-behaviors/process/create/macro/autoexec::auto-open-sub-decl
      - id: micro-behaviors/os/com/automation::vba-callbyname-split-method
      - id: micro-behaviors/communications/http/client/response-body::vbs-split-responsebody-reference
      - id: micro-behaviors/os/env/read::wsh-vbs-environment-method
