defaults:
  platforms: [windows]
  for: [vbs]
  attack: T1105
composite_rules:
  # VBS downloaders resolve WScript.Shell through its CLSID moniker (often
  # fragmented across concatenations so no ProgID string appears), strip a
  # digit filler to reveal a hidden PowerShell command, and run it with
  # window style 0.
  - id: vbs-clsid-shell-hidden-run
    desc: VBS CLSID-resolved shell runs hidden command
    crit: hostile
    conf: 0.97
    all:
      - id: micro-behaviors/os/com/instantiation::wsh-shell-clsid-moniker
      - id: micro-behaviors/process/create/shell/wsh::hidden-window-run
      - id: micro-behaviors/data/decode/custom::vbs-replace-digit-filler-strip
  # Twin for the payload shape rather than the shell-resolution technique:
  # a quarter-megabyte numeric blob, filler-stripped and launched hidden.
  - id: vbs-digit-filler-hidden-dropper
    desc: VBS digit-filler payload launched hidden
    crit: hostile
    conf: 0.97
    all:
      - id: micro-behaviors/data/decode/custom::vbs-oversized-digit-blob
      - id: micro-behaviors/data/decode/custom::vbs-replace-digit-filler-strip
      - id: micro-behaviors/process/create/shell/wsh::hidden-window-run
