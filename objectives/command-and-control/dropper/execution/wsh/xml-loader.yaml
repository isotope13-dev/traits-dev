# XML-hosted JScript downloader/stager traits.
# XML is used because cleave analyzes WSF content as XML with embedded script.
defaults:
  platforms: [windows]
  for: [xml]
  attack: T1027,T1059.001,T1105

traits:
  - id: xml-wsh-powershell-policy-bypass
    desc: PowerShell bypass launch command
    crit: suspicious
    conf: 0.97
    attack: T1059.001
    if:
      type: text
      regex: '(?i)\bpowershell(\.exe)?\\x20-nop\\x20-ep\\x20bypass\\x20-file\b'

  # `xml-wsh-response-text-access` (bare `responseText` substring) was a looser
  # duplicate of micro-behaviors/communications/http/client/response-body::
  # response-text, which already covers xml and carries the jQuery/axios
  # exclusions. It convicted OpenSCAP's report stylesheet, which inlines
  # jQuery, of WSH dropper behaviour. Composites below reference the canonical
  # atom; per the Single-Trait Rule the matcher is defined once.

  - id: xml-wsh-powershell-stage-file-marker
    desc: PowerShell script filename marker
    crit: component
    conf: 0.94
    if:
      type: text
      substr: '.ps1'

  # Common in obfuscated downloaders that keep the URL in a config object
  # rather than a bare string next to XMLHTTP.
  - id: xml-wsh-download-url-field
    desc: downloadUrl staging field
    crit: notable
    conf: 0.9
    if:
      # Requires the script property/assignment form. A bare substring also
      # matches the Maven POM <downloadUrl> distributionManagement element.
      type: text
      regex: 'downloadUrl\s*[:=]'

  - id: xml-wsh-temp-folder-stage
    desc: tempFolder staging field
    crit: notable
    conf: 0.9
    if:
      type: text
      substr: tempFolder

composite_rules:
  - id: xml-wsh-powershell-stage-file
    desc: WSH response is staged as a PowerShell script
    crit: notable
    conf: 0.94
    all:
      - id: micro-behaviors/communications/http/client/response-body::response-text
      - id: xml-wsh-powershell-stage-file-marker
    near_bytes: 240

  - id: xml-wsh-obfuscated-http-download
    desc: Obfuscated ActiveX HTTP download in XML WSH
    crit: suspicious
    conf: 0.96
    attack: T1105,T1059.007
    all:
      - id: micro-behaviors/os/com/object::activex-obfuscated-progid
      - id: micro-behaviors/communications/http/client/response-body::response-text
    any:
      - id: xml-wsh-download-url-field
      - id: micro-behaviors/communications/http/get::xml-http-get-method-literal
      - id: objectives/command-and-control/infrastructure/domain/malicious::firebase-storage
    needs: 2

  - id: xml-wsh-http-client
    desc: XML WSH HTTP download client
    crit: notable
    conf: 0.92
    any:
      - id: micro-behaviors/os/com/object::clsid-xmlhttp-generic
      - id: xml-wsh-obfuscated-http-download

  - id: xml-wsh-stage-write
    desc: XML WSH stages downloaded content to disk
    crit: notable
    conf: 0.9
    any:
      - id: micro-behaviors/fs/write/content::create-text-file-api
      - id: xml-wsh-temp-folder-stage

  - id: xml-xslt-jscript-com-script-dropper
    desc: XSLT-hosted JScript combines COM download and script-file creation
    crit: hostile
    conf: 0.99
    all:
      - id: micro-behaviors/process/interpreter/jscript::activex-object-text
      - id: micro-behaviors/os/com/object::clsid-xmlhttp-generic
      - id: micro-behaviors/os/com/object::wscript-shell-literal
      - id: micro-behaviors/fs/write/content::create-text-file-api
      - id: micro-behaviors/fs/write/content::create-script-file
      - id: micro-behaviors/process/interpreter/scripting/jscript::xslt-jscript-language

  - id: xml-wsh-script-file-loader
    desc: XML WSH downloads and launches a PowerShell script stage
    crit: hostile
    conf: 0.99
    all:
      - id: xml-wsh-http-client
      - id: micro-behaviors/communications/http/client/response-body::response-text
      - id: micro-behaviors/os/com/object::wscript-shell-literal
      - id: xml-wsh-stage-write
      - id: xml-wsh-powershell-stage-file
      - id: xml-wsh-powershell-policy-bypass
