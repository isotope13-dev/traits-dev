# WSH loaders that both register a rapid user-profile task and immediately
# start the staged PowerShell payload. The scheduled task supplies durable
# execution while the hidden policy-bypass launch starts tasking at once.
defaults:
  platforms: [windows]
  for: [vbs]
  attack: T1053.005,T1059.001,T1059.005,T1564.003
  mbc: B0023

composite_rules:
  - id: vbs-scheduled-task-powershell-stage-loader
    desc: VBScript persists and immediately launches an AppData PowerShell stage
    crit: hostile
    conf: 0.99
    all:
      - id: objectives/persistence/login/scheduled-task/com::vbs-short-interval-user-script-task
      - id: objectives/execution/interpreter/script/wsh::execution-policy-bypass
      - id: micro-behaviors/process/create/shell/wsh::hidden-window-run
