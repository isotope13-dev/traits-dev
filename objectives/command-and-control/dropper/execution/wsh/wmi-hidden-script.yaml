# Windows Script Host loaders can write an executable script to a variable path
# and pass that path to Win32_Process.Create with a hidden startup object. The
# variable binding prevents a brittle same-call extension matcher, while the
# combination of executable-script creation, FileSystemObject, and hidden WMI
# execution establishes the drop-and-launch behavior.
defaults:
  platforms: [windows]
  for: [javascript]
  attack: T1047,T1059.007,T1105,T1564.003

composite_rules:
  - id: wsh-script-drop-hidden-wmi-launch
    desc: WSH drops script for hidden WMI launch
    crit: hostile
    conf: 0.99
    all:
      - id: micro-behaviors/os/com/object::filesystemobject-progid
      - id: micro-behaviors/fs/write/content::create-script-file
      - id: objectives/execution/wmi::wmi-hidden-four-argument-process-create
