# Opaque ISO containers can preserve a complete WSH-to-rundll32 loader chain
# even though cleave cannot descend the filesystem image.
defaults:
  platforms: [windows]
  for: [iso]
  attack: T1059.007,T1218.011,T1036.007

composite_rules:
  - id: iso-wsh-rundll32-dat-loader
    desc: ISO WSH launches DAT PE by ordinal
    crit: hostile
    conf: 0.99
    all:
      - id: metadata/file/format/structured::primary-volume-descriptor
      - id: metadata/file/format/iso::iso-wsh-shell-run
      - id: metadata/file/format/iso::iso-wsh-rundll-prefix
      - id: metadata/file/format/iso::iso-wsh-dat-ordinal-launch
