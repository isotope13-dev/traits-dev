defaults:
  platforms: [windows]
  for: [html, vbs]
  attack: T1105

traits:
  - id: wsh-scrcpy-wrapper-name
    desc: scrcpy hidden-run wrapper filename
    crit: notable
    conf: 0.99
    for: [vbs]
    if:
      type: basename
      exact: scrcpy-noconsole.vbs

  - id: wsh-xray-wrapper-name
    desc: Xray hidden-run wrapper filename
    crit: notable
    conf: 0.99
    for: [vbs]
    if:
      type: basename
      exact: xray_no_window.vbs

  - id: wsh-hidden-batch-script-launch
    desc: WSH launches a hidden batch script
    crit: suspicious
    conf: 0.96
    attack: T1059.003,T1564.003
    for: [vbs, javascript]
    if:
      type: text
      regex: '(?is)WScript\.Shell.{0,160}\.bat.{0,24},\s*(0|&H0)\b'
  - id: wsh-hidden-numeric-batch-stage
    desc: WSH hides a numeric-heavy batch stage
    crit: suspicious
    conf: 0.97
    attack: T1059.003,T1564.003
    for: [vbs]
    if:
      type: text
      regex: '(?i)Chr\(34\)\s*&\s*"[A-Za-z]{1,3}\d{5,10}\.bat"\s*&\s*Chr\(34\),\s*0\b'
  - id: wsh-unc-exe-path
    desc: WSH references UNC EXE
    crit: suspicious
    conf: 0.95
    if:
      type: text
      regex: '\\\\[A-Za-z0-9_.-]{1,80}\\[^"''\r\n]{0,80}\.exe'
    unless:
      - id: metadata/document/html/
      - id: metadata/library/structure::javascript-source-map-file
      - id: metadata/file/format/structured::sourcemap
      - id: metadata/file/format/structured::sourcemap-sources-content
      - id: well-known/app/communication/thunderbird::firefox-omni-runtime-path
      - type: text
        substr: CopyFileEx_meth
      - type: text
        substr: _WinAPI_CopyFileEx
      - type: text
        substr: function simulates the move by using the CopyFile
      - id: metadata/file/string/corpus::hashed-text-record
  - id: wsh-filesystemobject-html
    desc: HTML WSH creates FileSystemObject
    crit: suspicious
    conf: 0.85
    for: [html]
    if:
      type: text
      substr: Scripting.FileSystemObject
    unless:
      - id: metadata/document/html/
      - type: text
        substr: codeSnippetLink
      - type: text
        substr: Doxygen
      - type: text
        substr: Generated by
      - type: text
        substr: docs.microsoft.com
  - id: wsh-temp-expand
    desc: WSH expands TEMP path
    crit: notable
    conf: 0.85
    if:
      type: text
      substr: ExpandEnvironmentStrings("%TEMP%")
    unless:
      - id: well-known/tool/sysadmin/microsoft-office::office-license-cleanup-benign-context
      - id: well-known/app/enterprise/fusioninventory::fusioninventory-agent-deployment-benign-context
  # NOTE: copying a file is a neutral filesystem capability, not payload
  # delivery -- the bare `CopyFile` substring that used to live here also
  # matched CopyFileEx docs and Microsoft's own OffScrub uninstaller. The
  # canonical atoms are micro-behaviors/fs/file/copy::fso-copyfile-text /
  # ::fso-copyfile-method; the dropper composites below reference them.
  - id: wsh-adodb-stream-html
    desc: HTML WSH references ADODB Stream
    crit: suspicious
    conf: 0.9
    for: [html]
    if:
      type: text
      substr: ADODB.Stream
  - id: wsh-hex-decode-loop
    desc: WSH hex decode loop
    crit: suspicious
    conf: 0.92
    attack: T1027
    if:
      type: text
      substr: "Step 2:h=h&Chr(CLng(\"&H\"&Mid"
  - id: wsh-xor-decode-loop
    desc: WSH XOR decode loop
    crit: suspicious
    conf: 0.92
    attack: T1027
    if:
      type: text
      regex: '\bXor\b.{0,50}\bAsc\(Mid\('
  - id: wsh-vbs-numeric-array-decoder
    desc: WSH numeric array decoder
    crit: suspicious
    conf: 0.9
    attack: T1027
    for: [vbs]
    if:
      type: text
      regex: '(?i)\)\s*-\s*\(.{1,80}\bAnd\b'
    unless:
      # Source maps may be heuristically typed as VBS because their embedded
      # JavaScript contains VBScript-like arithmetic text.
      - id: metadata/file/format/structured::sourcemap
      - id: metadata/file/format/structured::sourcemap-sources-content
      - id: metadata/library/structure::javascript-source-map-file
  - id: wsh-responsebody-pk-check
    desc: WSH checks downloaded PK header
    crit: suspicious
    conf: 0.92
    for: [vbs]
    if:
      type: text
      regex: '(?i)\)\s*=\s*80\s+And\s+AscB.{0,80}\)\s*=\s*75\s+Then'
  - id: wsh-vbs-run-decoded-argument
    desc: WSH runs decoded argument
    crit: suspicious
    conf: 0.9
    for: [vbs]
    if:
      type: text
      regex: '(?i)\.Run\s+[A-Za-z][A-Za-z0-9_]{5,}\s*\('
  - id: wsh-decoded-createobject
    desc: WSH decoded CreateObject call
    crit: suspicious
    conf: 0.94
    attack: T1027
    if:
      type: text
      regex: 'CreateObject\s*\(\s*x\(["''][0-9A-F]{20,}["'']\)'
  - id: wsh-assembled-executable-name
    desc: WSH builds executable before ShellExecute
    crit: suspicious
    conf: 0.94
    attack: T1027,T1106
    for: [vbs]
    if:
      type: text
      regex: '(?is)\b\w+\s*=\s*\w+(\s*\+\s*[\w"'']+){3,8}[\s\S]{0,600}\.ShellExecute\b'
  - id: wsh-variable-run-call
    desc: WSH runs variable command
    crit: suspicious
    conf: 0.82
    if:
      type: text
      regex: '(?i)\.Run\s*\(?[A-Za-z][A-Za-z0-9_]{6,}\)?\s*,?\s*false'
  - id: wsh-long-variable-hidden-run-call
    desc: WSH runs long variable hidden command
    crit: suspicious
    conf: 0.9
    attack: T1027
    if:
      type: text
      regex: '(?i)\.Run\s+[A-Za-z][A-Za-z0-9_]{80,}\s*,\s*0\s*,\s*False\b'
  - id: wsh-split-powershell-path
    desc: WSH split PowerShell path
    crit: suspicious
    conf: 0.94
    attack: T1059.001
    for: [vbs]
    if:
      type: text
      regex: '(?i)Pow[A-Za-z0-9]{1,24}er[A-Za-z0-9]{1,24}She[A-Za-z0-9]{1,24}ll(\.exe)?'
    unless:
      - id: well-known/tool/detection/debian-security-tracker::security-tracker-cve-leaf
      # Source maps can contain normal PowerShell identifiers; they are not
      # WSH launchers.
      - id: metadata/file/format/structured::sourcemap
  - id: wsh-split-frombase64string
    desc: WSH reconstructs Base64 decode API
    crit: suspicious
    conf: 0.94
    attack: T1027
    for: [vbs]
    if:
      type: text
      # WSH launchers commonly insert an alphanumeric marker inside the
      # .NET method name.  Require the distinctive `From` prefix and reject
      # the ordinary, unobfuscated API spelling.
      regex: '(?i)\bFrom[A-Za-z0-9_]{0,12}Base[A-Za-z0-9_]{0,12}64[A-Za-z0-9_]{0,12}String\b'
    not:
      - regex: '(?i)\bFromBase64String\b'
    unless:
      - id: metadata/file/format/structured::sourcemap
      - id: metadata/file/format/structured::sourcemap-sources-content
      - id: metadata/file/string/corpus::hashed-text-record
      - id: well-known/app/communication/thunderbird::firefox-omni-runtime-path
  - id: wsh-split-bxor-loop
    desc: WSH reconstructs split PowerShell XOR operator
    crit: suspicious
    conf: 0.92
    attack: T1027
    for: [vbs]
    if:
      type: text
      # Permit the same marker style between the operand and PowerShell's
      # -bxor operator, while retaining the strong operator anchor.
      regex: '(?i)\)\s*[A-Za-z0-9]{0,24}-bxor\b'
  - id: wsh-comspec-iex-fragment
    desc: WSH reconstructs ComSpec IEX invocation
    crit: suspicious
    conf: 0.9
    attack: T1059.001
    for: [vbs]
    if:
      type: text
      regex: '(?i)Com.{0,12}S.{0,12}pec\s*\[[0-9A-Za-z,\s]{3,}\]\s*-.{0,12}join'
  - id: wsh-marker-cleanup
    desc: WSH strips a staging marker
    crit: suspicious
    conf: 0.94
    attack: T1027
    for: [vbs]
    if:
      type: text
      regex: '(?i)\bReplace\s*\(\s*[A-Za-z_]\w*\s*,\s*["''][A-Za-z0-9]{4,16}["'']\s*,\s*["'']{2}\s*\)'

  - id: wsh-vbs-xor-charcode
    desc: WSH XORs numeric character codes
    crit: suspicious
    conf: 0.92
    attack: T1027
    for: [vbs]
    if:
      type: text
      # Obfuscated downloaders often decode binary bytes with AscB/MidB
      # instead of the older CLng/Asc/Mid form.
      regex: '(?i)(CLng.{0,120}\bXor\b|AscB\s*\(\s*MidB\s*\([^)]{1,240}\)\s*\)\s*\bXor\b)'

  - id: wsh-vbs-hex-charcode-decoder
    desc: WSH decodes hex bytes via CInt
    crit: suspicious
    conf: 0.92
    attack: T1027
    for: [vbs]
    if:
      type: text
      regex: '(?i)\bChr\s*\(\s*CInt\s*\(\s*["'']&H["'']\s*&\s*Mid\s*\('

  - id: wsh-vbs-lenb-byte-loop
    desc: WSH loops over byte buffer
    crit: notable
    conf: 0.94
    attack: T1140
    for: [vbs]
    if:
      type: text
      regex: '(?i)\bFor\s+\w+\s*=\s*1\s+To\s+LenB\s*\('

  - id: wsh-vbs-key-modulo-step
    desc: WSH indexes a repeating key
    crit: notable
    conf: 0.94
    attack: T1140
    for: [vbs]
    if:
      type: text
      regex: '(?i)\bMod\s+[A-Za-z_]\w*\b'

  - id: wsh-vbs-ascb-midb-read
    desc: WSH reads bytes via AscB/MidB
    crit: notable
    conf: 0.94
    attack: T1140
    for: [vbs]
    if:
      type: text
      regex: '(?i)\bAscB\s*\(\s*MidB\s*\('

  - id: wsh-vbs-variable-xor-step
    desc: WSH XORs two variables
    crit: notable
    conf: 0.94
    attack: T1140
    for: [vbs]
    if:
      type: text
      regex: '(?i)\b[A-Za-z_]\w*\s+Xor\s+[A-Za-z_]\w*\b'

  - id: wsh-vbs-xor-modulo-key
    desc: WSH combines XOR with modulo arithmetic
    crit: suspicious
    conf: 0.92
    attack: T1027
    for: [vbs]
    if:
      type: text
      # Require both operators; a bare VBScript Mod expression is ordinary
      # arithmetic, not payload decoding.
      regex: '(?i)\bXor\b[^\r\n]{0,80}\bMod\s+([A-Za-z_]\w*|\d{1,3})\b'

  - id: js-computed-sync-com-method
    desc: Computed synchronous automation method call
    crit: suspicious
    conf: 0.93
    attack: T1105,T1027
    for: [javascript]
    if:
      type: text
      regex: '\[\w+\(\[[0-9,\s]{3,}\]\)\]\([^,]{1,160},\w+,false\)'

  - id: js-computed-stream-save-overwrite
    desc: Computed stream method saves with overwrite mode
    crit: suspicious
    conf: 0.94
    attack: T1105,T1027
    for: [javascript]
    if:
      type: text
      regex: '\[\w+\(\[[0-9,\s]{12,}\]\)\]\(\w+,2\)'

  - id: js-computed-hidden-run
    desc: Computed method launches a hidden process
    crit: notable
    conf: 0.94
    attack: T1059.007
    for: [javascript]
    if:
      type: text
      regex: '\[\w+\(\[[0-9,\s]{3,}\]\)\]\(\w+,0,false\)'

  - id: vbs-repeated-encoded-call-stager
    desc: VBScript encoded call accumulator
    crit: suspicious
    conf: 0.96
    attack: T1027
    for: [vbs]
    count_min: 8
    if:
      type: text
      regex: '(?im)^\s*Call\s+[A-Za-z_][A-Za-z0-9_]*\s*\(\s*["''][A-Za-z0-9+/]{20,}'

composite_rules:
  - id: wsh-vbs-repeating-key-xor-loop
    desc: WSH repeating-key XOR byte loop
    crit: suspicious
    conf: 0.98
    attack: T1027,T1140
    for: [vbs]
    all:
      - id: wsh-vbs-lenb-byte-loop
      - id: wsh-vbs-key-modulo-step
      - id: wsh-vbs-ascb-midb-read
      - id: wsh-vbs-variable-xor-step
    near_lines: 16

  - id: wsh-fragmented-base64-hidden-loader
    desc: Fragmented Base64 payload runs hidden under WSH
    crit: hostile
    conf: 0.99
    attack: T1027,T1059.005,T1564.003
    for: [vbs]
    all:
      - id: objectives/anti-static/obfuscation/multi-layer::vbs-base64-fragment-helper-calls
      - id: objectives/anti-static/obfuscation/multi-layer::vbs-fragmented-frombase64string-call
      - id: micro-behaviors/process/create/shell/wsh::hidden-window-run
  - id: vbs-embedded-base64-script-dropper
    desc: VBScript decodes, writes, and launches embedded Base64 script
    crit: hostile
    conf: 0.99
    mbc: B0023
    attack: T1027,T1059.005,T1140
    for: [vbs]
    all:
      - id: micro-behaviors/data/encode/payload::vbs-appended-large-base64-payload
      - id: micro-behaviors/data/decode/base64::msxml-node-typed-value
      - id: micro-behaviors/fs/write/stream::adodb-save-to-file
      - id: micro-behaviors/fs/write/content::ext-js
      - id: micro-behaviors/process/create/shell/script-host::wscript-shell-run-create
  - id: wsh-high-byte-obfuscated-script
    desc: WSH high-byte script with obfuscation or hidden execution signals
    crit: suspicious
    conf: 0.92
    attack: T1027
    all:
      - id: metadata/file/metrics::high-byte-script-text
    any:
      - id: wsh-variable-run-call
      - id: wsh-long-variable-hidden-run-call
      - id: objectives/execution/interpreter/vbscript/interpreter::vbs-execute-dynamic
      - id: objectives/anti-static/obfuscation/string/anomaly::script-host-line-bloat
      - id: objectives/anti-static/obfuscation/string/anomaly::vbs-many-long-tokens
    needs: 1
  - id: wsh-obfuscated-temp-script-dropper
    desc: WSH decodes, writes, and runs a hidden temp script
    crit: hostile
    conf: 0.99
    mbc: "B0023"
    attack: "T1027,T1059.005,T1105"
    for: [vbs]
    all:
      - id: wsh-vbs-xor-payload-decode
      - id: micro-behaviors/fs/write/content::create-text-file-api
      - id: objectives/anti-static/obfuscation/wsh::vbs-createobject-variable-arg
      - id: objectives/execution/interpreter/vbscript/loader::execute-variable
      - id: micro-behaviors/process/create/shell/wsh::hidden-window-run

  - id: wsh-obfuscated-encoded-script-stager
    desc: Obfuscated VBScript decodes, stages, and runs a hidden script
    crit: hostile
    conf: 0.99
    mbc: "B0023"
    attack: "T1027,T1059.001,T1059.005,T1564.003"
    for: [vbs]
    all:
      - id: wsh-vbs-xor-charcode
      - id: objectives/anti-static/obfuscation/wsh::vbs-createobject-variable-arg
      - id: micro-behaviors/fs/write/stream::wsh-savetofile
      - id: micro-behaviors/process/create/shell/wsh::hidden-window-run
      - id: objectives/anti-static/obfuscation/string/anomaly::script-host-line-bloat
    any:
      - id: micro-behaviors/fs/write/content::create-text-file-api
      - id: micro-behaviors/fs/write/stream::adodb-save-to-file-observed

  - id: wsh-obfuscated-cint-encoded-script-stager
    desc: Obfuscated VBScript stages a hidden script
    crit: hostile
    conf: 0.99
    mbc: "B0023"
    attack: "T1027,T1059.001,T1059.005,T1564.003"
    for: [vbs]
    all:
      - id: wsh-vbs-hex-charcode-decoder
      - id: objectives/anti-static/obfuscation/wsh::vbs-createobject-variable-arg
      - id: micro-behaviors/fs/write/stream::wsh-savetofile
      - id: micro-behaviors/process/create/shell/wsh::hidden-window-run
      - id: objectives/anti-static/obfuscation/string/anomaly::script-host-line-bloat
      - id: micro-behaviors/fs/write/stream::adodb-save-to-file-observed

  - id: wsh-vbs-xor-payload-decode
    desc: WSH XOR-decodes numeric text
    crit: suspicious
    conf: 0.92
    attack: T1027
    for: [vbs]
    all:
      - id: wsh-vbs-xor-charcode
      - id: wsh-vbs-xor-modulo-key

  - id: wsh-hidden-powershell-runner
    desc: WSH launches PowerShell with a hidden window
    crit: hostile
    conf: 0.98
    attack: T1059.001,T1059.005,T1564.003
    for: [vbs]
    all:
      - id: micro-behaviors/process/create/shell/wsh::wscript-shell-process-run
      - id: objectives/execution/interpreter/vbscript/interpreter::vbs-powershell-launch
      - id: objectives/execution/interpreter/vbscript/interpreter::vbs-hidden-async-run

  - id: vbs-webclient-iex-stager
    desc: VBScript downloads PowerShell text and evaluates it
    crit: hostile
    conf: 0.99
    attack: T1059.001,T1059.005,T1105
    for: [vbs]
    all:
      - id: objectives/execution/interpreter/vbscript/interpreter::vbs-powershell-launch
      - id: micro-behaviors/communications/http/lib/invoke-webrequest::webclient-downloadstring
      - id: micro-behaviors/process/interpreter/eval::embedded-powershell-iex-alias

  - id: wsh-unc-exe-hidden-run-dropper
    desc: WSH hidden UNC EXE dropper
    crit: hostile
    conf: 0.99
    mbc: "B0023"
    all:
      - id: micro-behaviors/os/com/object::wscript-shell-literal
      - id: micro-behaviors/process/create/shell/wsh::hidden-window-run
      - id: wsh-unc-exe-path
  - id: wsh-copy-unc-exe-dropper
    desc: WSH copies UNC EXE dropper
    crit: hostile
    conf: 0.98
    mbc: "B0023"
    all:
      - id: wsh-filesystemobject-ref
      - id: wsh-temp-expand
      - id: micro-behaviors/fs/file/copy::fso-copyfile-text
      - id: wsh-unc-exe-path
      - id: micro-behaviors/process/create/shell/wsh::hidden-window-run
  - id: wsh-xmlhttp-adodb-execute-dropper
    desc: WSH downloads saves and executes
    crit: hostile
    conf: 0.99
    mbc: "B0023"
    all:
      - id: micro-behaviors/os/com/object::activex-http-progid
      - id: wsh-adodb-stream-ref
      - id: micro-behaviors/process/create/script/wsh::responsebody-marker
      - id: micro-behaviors/fs/write/stream::wsh-savetofile
    any:
      - id: micro-behaviors/process/create/shell/wsh::wscript-shell-process-run
      - id: micro-behaviors/process/create/shell/wsh::hidden-window-run
  - id: wsh-http-stream-save-run-dropper
    desc: WSH HTTP response saved to disk and executed
    crit: hostile
    conf: 0.99
    mbc: "B0023"
    attack: "T1105,T1059.005"
    all:
      - id: micro-behaviors/os/com/object::activex-http-progid
      - id: micro-behaviors/communications/http/client/vba::http-open-send
      - id: micro-behaviors/fs/write/file/stream::adodb-stream
      - id: micro-behaviors/fs/write/stream::wsh-savetofile
      - id: micro-behaviors/process/create/shell/wsh::wscript-shell-process-run
  - id: js-obfuscated-wsh-download-save-run
    desc: Obfuscated WSH remote binary download save and hidden execution
    crit: hostile
    conf: 0.99
    mbc: "B0023"
    attack: "T1027,T1059.007,T1105"
    for: [javascript]
    all:
      - id: micro-behaviors/data/decode/custom::js-offset-array-fromcharcode-decode
      - id: objectives/anti-static/obfuscation/syntax::js-computed-constructor-from-numeric-decoder
      - id: js-computed-sync-com-method
      - id: js-computed-stream-save-overwrite
      - id: js-computed-hidden-run
    near_bytes: 4096
  - id: js-obfuscated-wsh-binary-stage
    desc: Obfuscated WSH binary stream staging
    crit: hostile
    conf: 0.98
    mbc: "B0023"
    attack: "T1027,T1105"
    for: [javascript]
    all:
      - id: js-computed-stream-save-overwrite
      - id: micro-behaviors/data/decode/custom::js-offset-array-fromcharcode-decode
      - id: objectives/anti-static/obfuscation/syntax::js-computed-constructor-from-numeric-decoder
      - id: js-computed-sync-com-method
    near_bytes: 4096
  - id: wsh-obfuscated-xor-save-run
    desc: WSH XOR decoded save and run
    crit: hostile
    conf: 0.98
    mbc: "B0023"
    attack: T1027
    all:
      - id: wsh-hex-decode-loop
      - id: wsh-xor-decode-loop
      - id: wsh-decoded-createobject
      - id: micro-behaviors/process/create/script/wsh::responsebody-marker
      - id: micro-behaviors/fs/write/stream::wsh-savetofile
      - id: micro-behaviors/process/create/shell/wsh::hidden-window-run
  - id: wsh-xor-downloaded-payload-run
    desc: WSH downloads XOR payload and runs it
    crit: hostile
    conf: 0.99
    mbc: "B0023"
    attack: "T1059.005,T1105,T1027"
    all:
      - id: wsh-vbs-numeric-array-decoder
      - id: micro-behaviors/process/create/script/wsh::responsebody-marker
      - id: wsh-responsebody-pk-check
      - id: wsh-vbs-xor-payload-decode
      - id: wsh-vbs-run-decoded-argument
    any:
      - id: objectives/anti-static/obfuscation/wsh::vbs-createobject-variable-arg
      - id: micro-behaviors/process/create/shell/wsh::wscript-shell-process-run

  # HTML/VBScript droppers can carry the PE inline instead of downloading it.
  # The behavior is the same across pages and standalone VBS launchers: a
  # script reconstructs an MZ-prefixed byte stream, writes it with WSH file
  # APIs, then invokes the resulting executable.
  - id: wsh-embedded-pe-write
    desc: WSH reconstructs and writes embedded PE
    crit: suspicious
    conf: 0.98
    for: [html, vbs, javascript]
    mbc: B0023
    attack: T1027.009,T1059.005,T1059.007
    all:
      - id: micro-behaviors/data/format/executable/header::script-hex-pe-assignment
      - id: micro-behaviors/os/com/object::filesystemobject-constructor
      - id: micro-behaviors/fs/write/content::create-text-file-api
    any:
      - id: micro-behaviors/data/decode/hex::vbscript-hex-pair-byte-conversion
      - id: micro-behaviors/data/decode/hex::js-hex-charcode-decoder

  - id: wsh-embedded-pe-dropper
    desc: WSH writes and launches embedded PE
    crit: hostile
