# WSH loader persistence through an ADS-backed scheduled task.
# The detector follows the behavior chain instead of family strings or names:
# script content is written to an NTFS stream, then a short-interval task runs
# that stream through wscript.
defaults:
  platforms: [windows]
  for: [vbs]
  attack: T1053.005,T1564.004,T1105
  mbc: F0012,B0030

traits:
  - id: wsh-schtasks-action
    desc: Scheduled task action argument
    crit: suspicious
    conf: 0.94
    if:
      type: text
      regex: '(?i)\bschtasks(\.exe)?\b[^\r\n]{0,120}/tr\b'

  - id: wsh-scheduled-ads-target
    desc: Scheduled WSH action targets ADS in TEMP
    crit: suspicious
    conf: 0.96
    if:
      type: text
      regex: '(?i)(%TEMP%|%TMP%|\\Temp\\)[^"\r\n]{0,120}:[A-Za-z0-9_$.-]{1,64}'

  - id: wsh-minute-task-trigger
    desc: Scheduled task uses minute trigger
    crit: suspicious
    conf: 0.92
    if:
      type: text
      regex: '(?i)/sc\s+minute\b'

  - id: wsh-short-interval-value
    desc: Scheduled task uses short interval
    crit: suspicious
    conf: 0.92
    if:
      type: text
      regex: '(?i)/mo\s+([1-9]|[1-5][0-9])\b'

composite_rules:
  - id: wsh-ads-scheduled-loader
    desc: WSH stages code in an ADS for recurring execution
    crit: hostile
    conf: 0.99
    attack: T1053.005,T1564.004,T1059.005
    all:
      - id: micro-behaviors/fs/path/stream::ntfs-ads-path-source
      - id: micro-behaviors/fs/write/file/stream::savetofile-method-token
      - id: micro-behaviors/os/autorun/scheduled::schtasks-create-cmd
      - id: wsh-schtasks-action
      - id: wsh-scheduled-ads-target
      - id: wsh-minute-task-trigger
      - id: wsh-short-interval-value
    near_lines: 12
