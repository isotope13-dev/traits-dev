# Windows Script Host loader that stages a user-profile DLL and rewrites a
# browser extension manifest to introduce attacker-controlled scripts.
defaults:
  platforms: [windows]
  for: [vbs, javascript]
  attack: T1059.005,T1574.002,T1176

composite_rules:
  - id: wsh-user-profile-dll-browser-patch
    desc: Script host stages DLL and patches browser extension
    crit: hostile
    conf: 0.99
    all:
      - id: micro-behaviors/process/create/shell/script-host::wscript-shell-run-create
      - id: micro-behaviors/fs/path/location::user-profile-dll-path
      - id: micro-behaviors/fs/path/application/browser::browser-extension-manifest-path
      - id: micro-behaviors/fs/write/content::create-text-file-api
    near_bytes: 700
