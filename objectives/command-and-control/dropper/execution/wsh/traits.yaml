defaults:
  platforms: [windows]
  for: [javascript, vbs, html]
  attack: T1059.007,T1140

composite_rules:
  - id: obfuscated-wsh-self-read-command-dropper
    desc: Obfuscated WSH self-reads and launches a hidden command file
    crit: hostile
    conf: 0.99
    all:
      - id: micro-behaviors/os/com/object::wscript-shell-split-progid
      - id: micro-behaviors/os/com/object::filesystemobject-split-progid
      - id: micro-behaviors/process/interpreter/jscript::createobject-call
      - id: micro-behaviors/fs/read/file::script-fullname-reference
      - id: micro-behaviors/fs/read/file::open-text-file-read
      - id: micro-behaviors/fs/write/content::fso-open-text-file-write
      - id: micro-behaviors/process/create/shell/wsh::wsh-run-hidden-text
  # Relocated from dropper/node-bootstrap/, whose Node.js-runtime bootstrapping
  # name misdescribed this WSH fetch-and-save composite. The matcher is the
  # classic WSH downloader tail: an XMLHTTP response body written to disk.
  - id: wsh-payload-handling
    desc: WSH response body saved to file
    crit: suspicious
    conf: 0.8
    for: [javascript]
    all:
      - id: objectives/execution/interpreter/script/wsh::wsh-response-body
      - id: objectives/execution/interpreter/script/wsh::wsh-save-to-file
    unless:
      - id: metadata/build/scaffold::windows-wget-js-bootstrap-helper
      - id: well-known/app/productivity/winmerge::winmerge-bundled-plugin-script
