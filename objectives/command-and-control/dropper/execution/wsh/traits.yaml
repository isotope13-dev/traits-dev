defaults:
  platforms: [windows]
  for: [javascript, vbs, html]
  attack: T1059.007,T1140

traits:
  - id: xhr-json-machine-user-fields
    desc: XHR JSON names machine and user
    crit: notable
    conf: 0.94
    for: [javascript, typescript, html]
    if:
      type: text
      regex: machine_name.{0,120}windows_user

composite_rules:
  - id: self-deleting-hidden-encoded-command-relay
    desc: Stages a self-deleting hidden EncodedCommand relay
    crit: hostile
    conf: 0.99
    attack: T1027,T1059.001,T1059.005,T1564.003
    for: [javascript, typescript]
    all:
      - id: objectives/anti-static/obfuscation/string/fragmentation::js-powershell-encodedcommand-array-fragments
      - id: micro-behaviors/process/create/shell/script-host::wscript-shell-run-hidden-window
      - id: micro-behaviors/process/create/spawn::detached-ignored-unref-spawn
    any:
      - id: micro-behaviors/fs/delete/file/self::fso-delete-scriptfullname
      - id: micro-behaviors/fs/delete/file/self::createobject-delete-scriptfullname

  - id: obfuscated-wsh-self-read-command-dropper
    for: [javascript]
    desc: Obfuscated WSH self-reads and launches a hidden command file
    crit: hostile
    conf: 0.99
    all:
      - id: micro-behaviors/os/com/automation::wscript-shell-split-progid
      - id: micro-behaviors/os/com/automation::filesystemobject-split-progid
      - id: micro-behaviors/process/interpreter/jscript::createobject-call
      - id: micro-behaviors/fs/read/self::script-fullname-reference
      - id: micro-behaviors/fs/read/file/handle::open-text-file-read
      - id: micro-behaviors/fs/write/content::fso-open-text-file-write
      - id: micro-behaviors/process/create/shell/wsh::wsh-run-hidden-text
  # Relocated from dropper/node-bootstrap/, whose Node.js-runtime bootstrapping
  # name misdescribed this WSH fetch-and-save composite. The matcher is the
  # classic WSH downloader tail: an XMLHTTP response body written to disk.
  - id: wsh-payload-handling
    desc: WSH response body saved to file
    crit: suspicious
    conf: 0.8
    for: [javascript]
    all:
      - id: objectives/execution/interpreter/script/wsh::wsh-response-body
      - id: objectives/execution/interpreter/script/wsh::wsh-save-to-file
    unless:
      - id: metadata/build/scaffold::windows-wget-js-bootstrap-helper
      - id: well-known/app/productivity/winmerge::winmerge-bundled-plugin-script

  - id: javascript-obfuscated-activex-hidden-msi-install
    desc: Obfuscated ActiveX runs hidden remote MSI install
    crit: hostile
    conf: 0.99
    attack: T1027,T1059.007,T1105,T1218.007,T1564.003
    for: [javascript]
    all:
      - id: objectives/execution/activex/com::concatenated-activex-progid
      - id: micro-behaviors/process/create/installer::js-split-msiexec-literal
    any:
      - id: micro-behaviors/process/create/shell/wsh::wsh-run-hidden-window-text
      - id: micro-behaviors/process/create/shell/wsh::shellexecute-hidden-showcmd

  - id: javascript-xhr-host-profile-beacon
    desc: JavaScript POSTs host profile over XMLHttpRequest
    crit: suspicious
    conf: 0.95
    attack: T1059.007,T1041,T1071.001
    for: [javascript]
    all:
      - id: micro-behaviors/communications/http/post::xhr-post-open-send
      - id: objectives/command-and-control/dropper/execution/wsh::xhr-json-machine-user-fields
      - id: micro-behaviors/os/env/read::wsh-expand-environment-strings-call

