# The remote-scriptlet loader: `GetObject("script:https://host/file")` hands
# the Windows Script Host a URL, and the host fetches it and runs the code it
# finds there. The whole payload lives on the server, so the file on disk is a
# few dozen bytes with no behavior in it at all -- which is exactly why the
# obfuscated form matters. Once the URL is assembled from fragments there is
# nothing left for a scanner to key on but the seams of the assembly.
defaults:
  platforms: [windows]
  for: [vbs, batch, javascript, html]
  attack: T1105,T1059.005
  mbc: B0023

composite_rules:
  - id: reassembled-script-moniker-loader
    desc: Loads a scriptlet from a reassembled URL
    crit: hostile
    conf: 0.96
    all:
      - id: micro-behaviors/process/script/wsh::wsh-getobject-variable-argument
    any:
      - id: objectives/anti-static/obfuscation/string/concat::split-scheme-separator-fragment
      - id: objectives/anti-static/obfuscation/string/concat::split-moniker-scheme-seam

  - id: literal-script-moniker-loader
    desc: Loads a scriptlet from a literal URL
    crit: hostile
    conf: 0.95
    all:
      - id: micro-behaviors/process/script/wsh::script-moniker-url
    any:
      - id: micro-behaviors/process/script/wsh::wsh-getobject-variable-argument
      - id: micro-behaviors/process/script/wsh::wsh-getobject-url-moniker
