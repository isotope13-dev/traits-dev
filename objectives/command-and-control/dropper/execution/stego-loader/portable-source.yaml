defaults:
  platforms: [linux, macos, windows]
  for: [scripts, source, class, java_class]

composite_rules:
  - id: zero-width-command-loader
    desc: Hidden zero-width payload reaches command execution
    crit: hostile
    conf: 0.99
    attack: T1027,T1059
    near_bytes: 4096
    all:
      - id: micro-behaviors/data/decode/custom::zero-width-command-data-decoder
    any:
      - id: micro-behaviors/process/create/exec::child-process-execution
      - id: micro-behaviors/process/interpreter/eval/direct::js-eval-variable-argument
      - id: objectives/command-and-control/dropper/staging/temp::zig-bin-sh-c
      - id: micro-behaviors/process/create/shell/command-mode::windows-command-shell-invocation
      - id: micro-behaviors/process/create/shell/native::c-popen-variable-input
      - id: micro-behaviors/process/create/system::elixir-system-cmd

  - id: png-lsb-executable-loader
    desc: PNG low bits conceal an executed payload
    crit: hostile
    conf: 0.99
    attack: T1027.003,T1059
    near_bytes: 12288
    all:
      - id: micro-behaviors/data/source/arithmetic::lsb-bit-mask-source
      - id: micro-behaviors/process/create/exec::child-process-execution
    # LSB extraction and an unrelated child process can coexist in legitimate
    # image tooling. Require evidence that the extracted bytes are decoded,
    # staged, or made executable before treating the pair as a loader.
    any:
      - id: micro-behaviors/data/decode/base64/
      - id: micro-behaviors/data/decompress/
      - id: micro-behaviors/fs/write/file/full/
      - id: micro-behaviors/fs/chmod/modify/

  - id: jvm-png-pixel-executable-loader
    desc: JVM image pixels conceal an executed payload
    crit: hostile
    conf: 0.99
    attack: T1027.003,T1059
    for: [class, java_class]
    all:
      - id: micro-behaviors/data/encode/image/pixel::jvm-buffered-image-getrgb-call
      - id: micro-behaviors/data/buffer::bytearrayoutputstream-ref
      - id: micro-behaviors/data/decode/base64::java-base64-decoding-bytecode
      - id: micro-behaviors/fs/write/file/full::jvm-files-write-bytecode
      - id: micro-behaviors/process/create/exec::child-process-execution
