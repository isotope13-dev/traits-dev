defaults:
  platforms: [linux, macos, windows]
  for: [scripts, source, class, java_class]

traits:
  - id: node-base32-decoder-call
    desc: Node decodes an opaque base32 command string
    crit: suspicious
    conf: 0.96
    for: [javascript, typescript]
    if:
      type: text
      regex: 'Buffer\.from\s*\([^\n)]{0,180}["'']base32["'']\s*\)'

composite_rules:
  - id: zero-width-command-loader
    desc: Hidden zero-width payload reaches command execution
    crit: hostile
    conf: 0.99
    attack: T1027,T1059
    near_bytes: 4096
    all:
      - id: micro-behaviors/data/decode/custom::zero-width-command-data-decoder
    any:
      - id: micro-behaviors/process/create/exec::child-process-execution
      - id: micro-behaviors/process/interpreter/eval/direct::js-eval-variable-argument
      - id: objectives/command-and-control/dropper/staging/temp::zig-bin-sh-c
      - id: micro-behaviors/process/create/shell/command-mode::windows-command-shell-invocation
      - id: micro-behaviors/process/create/shell/native::c-popen-variable-input
      - id: micro-behaviors/process/create/system::elixir-system-cmd

  - id: png-lsb-executable-loader
    desc: PNG low bits conceal an executed payload
    crit: hostile
    conf: 0.99
    attack: T1027.003,T1059
    near_bytes: 12288
    all:
      - id: micro-behaviors/data/source/arithmetic::lsb-bit-mask-source
      - id: micro-behaviors/process/create/exec::child-process-execution
      # Nothing here observed an image. `lsb-bit-mask-source` is bare
      # arithmetic -- `& 1`, `& 0xff` -- which any bundle carries, and
      # `near_bytes: 12288` is no bound inside a 9.9 MB / 3-line minified
      # background script: a Microsoft browser extension's
      # background-redux-new.js scored hostile with the mask, a child-process
      # token and a base64 decode landing in one 12 KB window. Require the
      # pixel read the rule is named for, the way the JVM sibling below does
      # with getRGB.
      - id: micro-behaviors/data/encode/image/pixel/
    # LSB extraction and an unrelated child process can coexist in legitimate
    # image tooling. Require evidence that the extracted bytes are decoded,
    # staged, or made executable before treating the pair as a loader.
    any:
      - id: micro-behaviors/data/decode/base64/
      - id: micro-behaviors/data/decompress/
      - id: micro-behaviors/fs/write/file/full/
      - id: micro-behaviors/fs/chmod/modify/

  - id: jvm-png-pixel-executable-loader
    desc: JVM image pixels conceal an executed payload
    crit: hostile
    conf: 0.99
    attack: T1027.003,T1059
    for: [class, java_class]
    all:
      - id: micro-behaviors/data/encode/image/pixel::jvm-buffered-image-getrgb-call
      - id: micro-behaviors/data/buffer/transfer::bytearrayoutputstream-ref
      - id: micro-behaviors/data/decode/base64::java-base64-decoding-bytecode
      - id: micro-behaviors/fs/write/file/full::jvm-files-write-bytecode
      - id: micro-behaviors/process/create/exec::child-process-execution

  - id: node-base32-shell-loader
    desc: Node decodes base32 and executes it through a shell
    crit: hostile
    conf: 0.99
    for: [javascript, typescript, npm, tar, zip, vsix, crx, xpi, asar]
    scope: archive
    attack: T1027,T1140,T1059.004,T1195.002
    all:
      - id: node-base32-decoder-call
      - id: micro-behaviors/process/create/exec::node-execfile-reference
      - id: micro-behaviors/process/create/shell/path::shell-executable-reference

  - id: c-octal-hidden-command-loader
    desc: C source hides a command in octal escapes before popen
    crit: hostile
    conf: 0.99
    # One .c file: the octal-escaped command, the buffer it is assembled in
    # and the popen that runs it are one routine, as the rule's own name
    # says. Under `scope: archive` any source tree supplied all three from
    # unrelated files -- CPython 2.7 has `c-command-buffer` in some 250 of
    # them, the octal escapes in the generated parser tables Python/graminit.c
    # and popen in Python/getcwd.c, and Darling vendors CPython, so it scored
    # hostile. `archives` leaves the `for:` list too, or the container node
    # rolls its members' traits back up and pools them again.
    for: [c, cpp]
    attack: T1027,T1059.004,T1105
    all:
      - id: micro-behaviors/data/encode/char-code::c-octal-escape-sequence
      - id: micro-behaviors/process/create/shell/native::c-popen-variable-input
      - id: micro-behaviors/data/buffer/alloc::c-command-buffer

  # A PNG carried inside the source itself -- base64, hex, or a decimal byte
  # list -- whose low bits are walked, written out, and run. This is the shape
  # a supply-chain stego dropper takes in every ecosystem: the carrier image
  # ships with the package, so the loader needs no network, and the pixels are
  # never rendered.
  #
  # Unlike `png-lsb-executable-loader` above, this rule cannot lean on a pixel
  # API: a source-level chunk walker inflates IDAT by hand and indexes the
  # scanline, so nothing resembling `getRGB` appears. The image literal is what
  # replaces it -- the same job, evidence that the masked bytes really are
  # image data -- and it is far harder for a minified bundle to supply by
  # accident than a bare `& 1`. The staging `any:` then demands the extracted
  # bytes reach a file or an executable bit, not just a buffer.
  # A stego loader decodes the image's low bits right where the image is: the
  # literal, the mask arithmetic and the drop are one routine. Unbounded, the
  # four legs only have to co-exist in a file, which is true of any bundled
  # application -- an inlined PNG data URI, bitwise masks (minified JS is full
  # of them), child_process and fs. draw.io Desktop's Electron bundle scored
  # hostile on it in both the x64 and arm64 builds.
  - id: embedded-image-lsb-drop-executor
    desc: Inlined image low bits drop an executed file
    crit: hostile
    conf: 0.97
    attack: T1027.003,T1059,T1195.002
    # Without proximity this correlates file-wide: a minified multi-MB bundle
    # carries an icon literal, a prose "and 1", and unrelated spawn/write
    # signals megabytes apart. Require one window -- 4096 rather than the
    # sibling's 12288, which that rule's own note calls no bound inside a
    # 9.9 MB minified script.
    near_bytes: 4096
    all:
      - id: micro-behaviors/data/embedded/payload/image::embedded-png-source-literal
      - id: micro-behaviors/data/source/arithmetic::lsb-bit-mask-source
      - id: micro-behaviors/process/create/
    any:
      - id: micro-behaviors/fs/write/
      - id: micro-behaviors/fs/chmod/
      - id: micro-behaviors/fs/path/temp/
