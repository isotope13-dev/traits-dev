# Go equivalent of the .NET bitmap-stego reflective loader: a Go binary that
# decodes a payload hidden in image data, then maps + reprotects executable
# memory to run it in-process (no file ever written). Decoding an image and
# performing manual RWX memory management are each uncommon in benign Go; the
# combination is a steganographic in-memory loader.
defaults:
  platforms: [linux, macos, windows]
  for: [go]
  attack: T1620
  mbc: E1059
composite_rules:
  # metadata/lang/compiler/systems::go-binary and
  # micro-behaviors/data/decode/symbol-base64::go-base64-decode are both
  # `for: [elf, macho, pe, wasm]` -- compiled-binary facts. This file analyzes
  # Go *source* (`for: [go]`), so a leaf can never be typed both a compiled
  # binary and Go source at once: neither leg could ever match here. Drop the
  # redundant compiled-binary confirmation (being Go source already implies
  # the Go toolchain) and use the source-level base64 decode symbols instead.
  - id: go-image-stego-inmemory-loader
    desc: Go binary decodes a payload from image data and executes it in memory
    crit: hostile
    conf: 0.94
    all:
      - id: micro-behaviors/data/embedded/payload/image::go-image-decode
      - id: micro-behaviors/mem/protect/modify::go-rwx-inmemory-exec
    any:
      - id: micro-behaviors/data/decode/symbol-base64::std-encoding-decode-string
      - id: micro-behaviors/data/decode/symbol-base64::raw-std-encoding-decode-string
      - id: micro-behaviors/data/decode/symbol-base64::url-encoding-decode-string
      - id: micro-behaviors/data/decode/symbol-base64::raw-url-encoding-decode-string
      - id: micro-behaviors/data/decode/symbol-base64::std-encoding-decode
      - id: micro-behaviors/data/decode/symbol-base64::new-decoder
