# Loaders whose payload rides after the end of a carrier file, most often an
# image: the script finds the carrier by checking a marker in its final bytes,
# then evaluates or writes out a slice of it. The carrier is fetched or
# shipped separately, so the loader itself holds no payload, and the image
# still renders because viewers ignore bytes past the format's end chunk.
defaults:
  platforms: [windows, linux, macos]
  attack: T1027.003,T1059
  mbc: B0032.001

composite_rules:
  # One routine checks the footer marker and evaluates a fixed slice of the
  # same file as script text.
  - id: powershell-trailer-marked-file-range-iex
    desc: Evaluates a script slice from a marker-tagged file
    crit: hostile
    conf: 0.98
    for: [powershell]
    attack: T1027.003,T1059.001
    near_lines: 80
    all:
      - id: micro-behaviors/data/embedded/payload/trailer/
      - id: micro-behaviors/data/buffer/carve::powershell-file-range-to-string
      - id: micro-behaviors/process/interpreter/eval/direct::powershell-iex-call

  - id: javascript-trailer-marked-file-range-eval
    desc: Evaluates a script slice from a marker-tagged file
    crit: hostile
    conf: 0.96
    for: [javascript, typescript]
    near_lines: 60
    all:
      - id: micro-behaviors/data/embedded/payload/trailer/
      - id: micro-behaviors/data/buffer/carve::javascript-file-range-to-string
    any:
      - id: micro-behaviors/process/interpreter/eval/direct::js-eval-variable-argument
      - id: micro-behaviors/process/interpreter/eval/direct::js-eval-call-expression-arg
      - id: micro-behaviors/process/interpreter/eval/direct::js-eval-tostring-result
      - id: micro-behaviors/process/interpreter/eval/compile/

  - id: python-trailer-marked-file-range-exec
    desc: Executes a script slice from a marker-tagged file
    crit: hostile
    conf: 0.96
    for: [python]
    near_lines: 60
    all:
      - id: micro-behaviors/data/embedded/payload/trailer/
      - id: micro-behaviors/data/buffer/carve::python-file-range-read
    any:
      - id: micro-behaviors/process/interpreter/eval/direct::exec-builtin
      - id: micro-behaviors/process/interpreter/eval/direct::exec-after-file-read

  # The second stage of the same scheme: parse a size/name table stored in
  # the carrier's footer, write the DLL slice to disk and hand it to
  # rundll32. Each leg alone is an ordinary file or process operation; a
  # footer index feeding a written-out library that rundll32 loads is not.
  - id: powershell-trailer-index-dll-rundll32
    desc: Runs a DLL carved from a file's footer index
    crit: hostile
    conf: 0.98
    for: [powershell]
    attack: T1027.003,T1218.011,T1105
    all:
      - id: micro-behaviors/data/embedded/payload/trailer::powershell-footer-relative-int-read
      - id: micro-behaviors/fs/write/file/full::write-all-bytes
      - id: objectives/execution/lolbin/os::rundll32-exe-string
    any:
      - id: micro-behaviors/data/embedded/payload/trailer::powershell-seek-end-magic-compare
      - id: micro-behaviors/data/embedded/payload/trailer::powershell-length-relative-magic-compare
