defaults:
  platforms: [unix, windows]
  for: [python]
  attack: T1105
  mbc: E1105
composite_rules:
  - id: remote-binary-shell-reexec
    desc: Remote binary fetch followed by shell re-exec
    crit: hostile
    conf: 0.96
    attack: T1105, T1059.006
    all:
      - id: micro-behaviors/communications/http/lib/requests::requests-get
      - id: micro-behaviors/process/create/subprocess::shell-true
      - id: micro-behaviors/process/create/subprocess::os-execve
  - id: remote-binary-memfd-reexec
    desc: HTTP response re-executed from a Python memfd
    crit: hostile
    conf: 0.98
    attack: "T1105, T1620"
    all:
      - id: micro-behaviors/communications/http/lib/requests::requests-get
      - id: micro-behaviors/communications/http/client/response-body::requests-response-body-access
      - id: micro-behaviors/communications/ip/literal::http-ip-url
      - id: micro-behaviors/mem/anonymous/create::python-libc-memfd-create
      - id: micro-behaviors/fs/file/write/direct::python-os-write-fd
    any:
      - id: micro-behaviors/process/create/direct::python-os-execve-call
      - id: micro-behaviors/process/create/direct::python-os-execv-call
