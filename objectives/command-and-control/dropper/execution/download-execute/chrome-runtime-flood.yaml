# Browser extension that floods chrome.runtime.connect to crash the host
# process, then continues the CrashFix paste-run chain.
defaults:
  platforms: [windows]
  for: [javascript]
  attack: T1499.004,T1176.001
  mbc: B0018

traits:
  - id: chrome-runtime-connect-call
    desc: Opens a chrome.runtime.connect port
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: 'chrome\.runtime\.connect\s*\('
  - id: js-scientific-iter-flood
    desc: Loop bound uses 1e6 through 1e9
    crit: component
    conf: 0.8
    if:
      type: text
      regex: 'for\s*\([^)]{0,64}1e[6-9]'

composite_rules:
  - id: chrome-runtime-connect-flood
    desc: Extension floods chrome.runtime.connect ports
    crit: hostile
    conf: 0.98
    near_bytes: 240
    all:
      - id: chrome-runtime-connect-call
      - id: js-scientific-iter-flood
