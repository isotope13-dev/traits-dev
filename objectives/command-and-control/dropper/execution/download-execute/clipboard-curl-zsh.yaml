# ClickFix pages copy a silent curl|zsh one-liner onto the clipboard.
defaults:
  crit: hostile
  conf: 0.97
  platforms: [macos, windows]
  for: [html, javascript]
  attack: T1059.004,T1204.004
  mbc: B0024

composite_rules:
  - id: clickfix-clipboard-curl-zsh
    desc: Clipboard stages a curl-to-zsh download
    near_bytes: 1600
    all:
      - id: micro-behaviors/os/clipboard/write::browser-clipboard-write
      - id: objectives/command-and-control/dropper/delivery/pipe::curl-pipe-zsh
  - id: clickfix-clipboard-iex-temp-cleanup
    desc: Clipboard stages IEX temp-file cleanup
    attack: T1059.001,T1204.001
    platforms: [windows]
    near_bytes: 1600
    all:
      - id: micro-behaviors/os/clipboard/write::browser-clipboard-write
      - id: objectives/command-and-control/dropper/delivery/download-fallback::iex-getcontent-raw-cleanup
