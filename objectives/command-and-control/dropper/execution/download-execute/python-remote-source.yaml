# Python remote-source droppers fetch a new Python module, write it to disk,
# execute it through the import system, and remove the one-time stage. This is
# the reusable behavior described in the KANDYKORN/Watcher chain, not a family
# signature or a campaign IOC.
defaults:
  platforms: [linux, macos, windows, unix, android, ios]
  for: [python]
  attack: T1105,T1059.006,T1070.004
  mbc: B0030

composite_rules:
  - id: python-remote-script-stage
    desc: Python downloads and writes a script stage
    crit: suspicious
    conf: 0.96
    scope: file
    near_lines: 40
    all:
      - id: micro-behaviors/communications/http/lib/urllib::urllib-urlopen-call
      - id: micro-behaviors/communications/http/lib/urllib::urlopen-response-body-read
      - id: micro-behaviors/fs/file/open::text-write-append-create-mode
      - id: micro-behaviors/fs/file/write/direct::py-open-script-path

  - id: python-remote-script-fetch-execute
    desc: Python fetches and dynamically executes a script stage
    crit: hostile
    conf: 0.98
    scope: file
    near_lines: 80
    all:
      - id: python-remote-script-stage
      - id: micro-behaviors/os/api-resolution/dynamic::python-importlib-spec-exec-module

  - id: python-remote-script-fetch-execute-cleanup
    desc: Python removes a fetched script after dynamic execution
    crit: hostile
    conf: 0.99
    scope: file
    near_lines: 96
    all:
      - id: python-remote-script-fetch-execute
      - id: micro-behaviors/fs/file/delete::py-remove
      - id: micro-behaviors/os/api-resolution/dynamic::python-importlib-spec-exec-module
