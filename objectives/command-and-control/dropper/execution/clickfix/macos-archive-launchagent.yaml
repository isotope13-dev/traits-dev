# macOS ClickFix stages that turn a downloaded archive into a LaunchAgent.
defaults:
  platforms: [macos]
  for: [shell]
  attack: T1105
  mbc: B0024

composite_rules:
  - id: macos-clickfix-archive-launchagent
    desc: macOS ClickFix archive to LaunchAgent
    crit: hostile
    conf: 0.99
    attack: T1059.004,T1105,T1543.004,T1204.002
    all:
      - id: micro-behaviors/communications/http/tls::curl-insecure
      - id: micro-behaviors/communications/http/download/curl::curl-zip-output
      - id: micro-behaviors/data/archive/extract/zip::unzip-quiet-dir
      - id: micro-behaviors/os/service/config::shell-launchagent-plist-write
      - id: micro-behaviors/fs/chmod/executable/mode::chmod-exec-absolute-path
    near_lines: 30

  - id: macos-clickfix-detached-launchagent-stage
    desc: macOS ClickFix detached LaunchAgent stage
    crit: hostile
    conf: 0.99
    attack: T1059.004,T1222.002,T1543.004,T1204.002
    all:
      - id: micro-behaviors/os/service/config::shell-launchagent-plist-write
      - id: micro-behaviors/process/daemonize/detach::nohup-hidden-output
      - id: micro-behaviors/fs/chmod/executable/mode::chmod-exec-absolute-path
    near_lines: 25
