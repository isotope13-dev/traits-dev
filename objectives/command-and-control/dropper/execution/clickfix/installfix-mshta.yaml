# InstallFix / ClickFix delivery that stages MSHTA remote package fetches or
# irm|iex fileless cradles on the clipboard for Win+R paste-run. Covers the
# fake-installer guide shape (mshta → .msixbundle / archive) and the follow-on
# in-memory PowerShell eval pipeline used across AI-brand impersonation lures.
defaults:
  platforms: [windows]
  for: [html, javascript]
  attack: T1204.001,T1218.005,T1059.001,T1105
  mbc: B0030,E1218.005

traits:
  # Agent approval-reviewer policies catalog `irm … | iex` as a HARD BLOCK
  # example; suppress when that guardrail framing is present.
  - id: irm-iex-pipeline-cradle
    desc: IRM or RestMethod piped to IEX
    crit: suspicious
    conf: 0.97
    if:
      type: text
      regex: '(?i)\b(irm|Invoke-RestMethod)\b[^\r\n|]{0,240}\|\s*iex\b'
    unless:
      - id: well-known/tool/detection/agent-monitor::untrusted-input-data-guardrail
      - id: well-known/app/ai/grok-cli::official-installer-url
      - id: metadata/package/quality/benign-context::checksummed-github-release-updater

  - id: iex-irm-call-cradle
    desc: IEX evaluates IRM or RestMethod
    crit: suspicious
    conf: 0.97
    if:
      type: text
      regex: '(?i)\biex\s*\(\s*(irm|Invoke-RestMethod)\b'
    unless:
      - id: well-known/tool/detection/agent-monitor::untrusted-input-data-guardrail
      - id: well-known/app/ai/grok-cli::official-installer-url
      - id: metadata/package/quality/benign-context::checksummed-github-release-updater

composite_rules:
  - id: installfix-clipboard-mshta-package
    desc: Clipboard InstallFix stages remote MSHTA package
    crit: hostile
    conf: 0.99
    all:
      - id: micro-behaviors/os/clipboard/browser::browser-html-clipboard-write
      - id: objectives/command-and-control/dropper/execution/script::mshta-remote-package-url
      - id: objectives/execution/lure/clipboard::html-winr-shortcut-instruction
      - id: objectives/execution/lure/clipboard::paste-enter-instruction-generic
    near_bytes: 2400

  - id: clickfix-clipboard-irm-iex-cradle
    desc: ClickFix clipboard stages hidden irm|iex cradle
    crit: hostile
    conf: 0.99
    all:
      - id: micro-behaviors/os/clipboard/browser::browser-html-clipboard-write
      - id: powershell-hidden-ep-bypass-flags
      - id: objectives/execution/lure/clipboard::html-winr-shortcut-instruction
    any:
      - id: irm-iex-pipeline-cradle
      - id: iex-irm-call-cradle
    near_bytes: 2400
