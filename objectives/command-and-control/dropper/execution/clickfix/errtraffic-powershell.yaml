# ErrTraffic / Analytics-cluster ClickFix PowerShell stage markers.
# Distinctive decoy comment, MOTW-bypass env, and download machinery used across
# variants that keep the same clipboard-run delivery shape. A /cf.js filename
# alone also occurs in ordinary local module imports and is not a lure or fetch.
defaults:
  platforms: [windows]
  for: [powershell, html, javascript]
  attack: T1059.001,T1204.002,T1553.005
  mbc: B0030

traits:
  # Comment atom: objectives/.../fileless::clickfix-code-verification-comment
  # (same matcher); this file keeps the MOTW bypass observation.
  - id: see-mask-nozonechecks-env
    desc: Sets SEE_MASK_NOZONECHECKS MOTW bypass
    crit: suspicious
    conf: 0.96
    attack: T1553.005
    if:
      type: text
      regex: '(?i)\$env:SEE_MASK_NOZONECHECKS\s*=\s*1'

composite_rules:
  - id: errtraffic-clickfix-powershell-stage
    desc: ErrTraffic ClickFix PowerShell download stage
    crit: hostile
    conf: 0.98
    all:
      - id: objectives/command-and-control/dropper/execution/fileless::clickfix-code-verification-comment
      - id: see-mask-nozonechecks-env
    any:
      - id: objectives/anti-static/obfuscation/string/concat::ps-iwr-concat
      - id: objectives/command-and-control/dropper/execution/clickfix::iex-webclient-downloadstring-cradle
