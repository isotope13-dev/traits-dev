# ClearFake-class ClickFix: hidden conhost launches cmd with delayed-expansion
# WebDAV (@SSL via !s!), then rundll32 invokes a named Run export on the mapped
# DLL. Carets split rundll32/pushd so literal host matchers miss the command.
defaults:
  platforms: [windows]
  for: [batch, powershell, javascript, html, vbs, text]
  attack: T1204.002,T1105,T1218.011
  mbc: B0024

traits:
  - id: conhost-headless-dash-cmd
    desc: conhost --headless -- cmd launcher
    crit: notable
    conf: 0.96
    if:
      type: text
      regex: '(?i)\bconhost(\.exe)?\s+--headless\s+--\s+cmd(\.exe)?\b'

  - id: caret-split-rundll32
    desc: Caret-obfuscated rundll32 token
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: '(?i)\br\^?u\^?n\^?d\^?l\^?l\^?3\^?2\b'
    # Optional carets admit all split positions; explicitly reject the plain
    # spelling so a normal rundll32 URL launcher is not called obfuscated.
    not:
      - regex: '(?i)\brundll32\b'
    unless:
      - id: well-known/lib/ui/textmate::frozen-json-grammar-module

  - id: rundll32-named-run-export
    desc: Rundll32 named Run export
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: '(?i)\.dll,\s*Run\b'

  - id: cmd-delayed-expansion-c
    desc: cmd delayed-expansion /v:on /c
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: '(?i)/v:on\s+/c\b'

composite_rules:
  - id: delayed-ssl-webdav-share
    desc: Delayed-expansion WebDAV SSL share
    crit: suspicious
    conf: 0.97
    near_bytes: 512
    all:
      - id: micro-behaviors/communications/http/webdav::delayed-ssl-share-var
      - id: micro-behaviors/communications/http/webdav::webdav-delayed-ssl-unc

  - id: conhost-webdav-rundll32-run
    desc: Hidden conhost maps WebDAV then rundll32 Run
    crit: hostile
    conf: 0.99
    near_bytes: 1024
    all:
      - id: conhost-headless-dash-cmd
      - id: delayed-ssl-webdav-share
      - id: rundll32-named-run-export

  - id: caret-webdav-rundll32-run
    desc: Caret-obfuscated rundll32 Run over WebDAV
    crit: hostile
    conf: 0.99
    attack: T1027,T1105,T1218.011
    near_bytes: 1024
    all:
      - id: caret-split-rundll32
      - id: delayed-ssl-webdav-share
      - id: rundll32-named-run-export
