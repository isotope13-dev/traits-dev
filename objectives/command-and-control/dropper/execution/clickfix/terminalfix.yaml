# TerminalFix (ClickFix variant) clipboard payload. The pasted PowerShell
# prints color-coded fake Cloudflare verification status to make the terminal
# session look like a CAPTCHA check while it downloads and extracts a payload
# archive and launches it silently. Distinct from the browser-side lure atoms
# in execution/lure/clipboard/: those see the page; this sees the pasted
# script, whose only tell is the theater it prints for the victim.
defaults:
  platforms: [windows]
  for: [powershell]
  attack: T1059.001,T1204.002,T1036.005
  mbc: B0030

traits:
  - id: powershell-writehost-foregroundcolor
    desc: Colored Write-Host console output
    crit: notable
    conf: 0.85
    if:
      type: text
      regex: '(?i)Write-Host\b[^\r\n]{0,140}-ForegroundColor\b'
  - id: verification-console-wording
    desc: Verification or CAPTCHA wording
    crit: component
    conf: 0.8
    if:
      type: text
      regex: '(?i)\b(verification|captcha)\b|\bnot[- ]a[- ]robot\b'

composite_rules:
  - id: powershell-colored-verification-console
    desc: Colored console verification theater
    crit: suspicious
    conf: 0.93
    all:
      - id: powershell-writehost-foregroundcolor
      - id: verification-console-wording
    near_lines: 12

  - id: terminalfix-verification-console-zip-stage
    desc: Fake verification console hides archive stage
    crit: hostile
    conf: 0.97
    attack: T1059.001,T1204.002,T1105
    all:
      - id: powershell-colored-verification-console
      - id: objectives/command-and-control/dropper/staging/archive::powershell-download-archive-execute
    any:
      - id: objectives/command-and-control/dropper/staging/disk::programdata-hex-staging-dir
      - id: micro-behaviors/process/create/hidden::powershell-windowstyle-hidden-option
