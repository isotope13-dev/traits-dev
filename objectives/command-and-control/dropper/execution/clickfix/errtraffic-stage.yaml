# ErrTraffic ClickFix second-stage markers: the PowerShell clipboard payload
# opens with a distinctive `<# Code Verification: NNN #>` comment, then stages
# downloads / injection. The comment atom is
# objectives/.../fileless::clickfix-code-verification-comment; follow-on stage
# composites in this file and errtraffic-powershell.yaml share it.
defaults:
  platforms: [windows]
  for: [powershell, html, javascript]
  attack: T1059.001,T1204.002
  mbc: B0030

traits:
  - id: errtraffic-clickfix-api-ctx
    desc: ErrTraffic ClickFix command API query
    crit: suspicious
    conf: 0.94
    if:
      type: text
      regex: '(?i)/api/index\.php\?a=ctx&os='

composite_rules:
  - id: errtraffic-code-verification-download-stage
    desc: ErrTraffic Code Verification stage downloads a payload
    crit: hostile
    conf: 0.98
    attack: T1059.001,T1105,T1204.002
    for: [powershell]
    near_bytes: 2048
    all:
      - id: objectives/command-and-control/dropper/execution/fileless::clickfix-code-verification-comment
    any:
      - id: micro-behaviors/communications/http/client/managed::downloaddata
      - id: micro-behaviors/communications/http/client/managed::downloadstring
      - id: micro-behaviors/communications/http/lib/invoke-webrequest::request-powershell
      - id: objectives/command-and-control/dropper/execution/clickfix::iex-webclient-downloadstring-cradle

  - id: errtraffic-code-verification-hollow-host
    desc: ErrTraffic stage hollows into a signed Microsoft host
    crit: hostile
    conf: 0.99
    attack: T1055.012,T1059.001
    for: [powershell]
    near_bytes: 4096
    all:
      - id: objectives/command-and-control/dropper/execution/fileless::clickfix-code-verification-comment
      - id: micro-behaviors/process/create/runtime-host::servicemodelreg-exe-name
    any:
      - id: objectives/evasion/process/injection/runtime::powershell-process-memory-injector
      - id: objectives/evasion/process/injection/runtime::ps-kernel32-dllimport
      - id: micro-behaviors/process/create/flags::create-suspended-flag-reference
