# ClickFix stages that use the Windows native downloader/archive/script chain.
# The individual operations are common; the objective rules require their
# combination in a temporary staging path or with Run-key persistence.
defaults:
  platforms: [windows]
  for: [batch, powershell, javascript, typescript, vbs, html]
  attack: T1105
  mbc: B0024

traits:
  # TEMP script-host execution is canonical under the script-host capability
  # tree; the objective composites here add archive or persistence context.

  - id: node-tar-extract-flag
    desc: Node tar extraction flag
    crit: component
    conf: 0.95
    for: [javascript, typescript]
    if:
      type: text
      regex: '["'']-[xX][fF]["'']'

composite_rules:
  - id: clickfix-curl-hta-download
    desc: Clipboard command downloads an HTA stage through the Windows shell
    crit: hostile
    conf: 0.99
    attack: T1059.003,T1105,T1204.004
    for: [html, javascript, batch, powershell, vbs]
    near_bytes: 1600
    all:
      - id: micro-behaviors/os/clipboard/browser::browser-html-clipboard-write
      - id: micro-behaviors/communications/http/download/curl::source-curl-output-option
      - id: micro-behaviors/fs/path/extension::hta-extension
      - id: micro-behaviors/process/create/shell/command-mode::windows-command-shell-invocation

  - id: node-clickfix-remote-archive-script-launch
    desc: Node archive and WScript launch
    crit: hostile
    conf: 0.99
    attack: T1059.005,T1059.007,T1105,T1204.002
    for: [javascript, typescript]
    near_bytes: 1600
    all:
      - id: micro-behaviors/communications/http/request/client::https-get
      - id: micro-behaviors/fs/file/write/direct::node-write-file-sync
      - id: micro-behaviors/data/archive/extract/tar::node-spawn-tar-extract
      - id: node-tar-extract-flag
      - id: micro-behaviors/process/create/shell/bridge::execSync-call
      - id: micro-behaviors/process/create/shell/script-host::temp-script-host-path

  - id: node-clickfix-run-key-wscript-persistence
    desc: Node Run-key WScript persistence
    crit: hostile
    conf: 0.99
    attack: T1059.005,T1059.007,T1547.001
    for: [javascript, typescript]
    near_bytes: 900
    all:
      - id: node-run-key-wscript-temp
      - id: micro-behaviors/process/create/shell/bridge::execSync-call

  - id: node-run-key-wscript-temp
    desc: Node Run-key WScript temp launcher
    crit: suspicious
    conf: 0.97
    attack: T1547.001
    for: [javascript, typescript]
    near_bytes: 700
    all:
      - id: micro-behaviors/os/registry/keys::currentversion-run
      - id: micro-behaviors/process/create/shell/script-host::temp-script-host-path
