# ClickFix pages that stage a hidden-window PowerShell IEX(WebClient.DownloadString)
# cradle on the clipboard. Matches the StopAndProtect-class infection prompt and
# future variants that keep the same Win+R paste-run delivery shape.
defaults:
  platforms: [windows]
  for: [html, javascript]
  attack: T1204.001,T1059.001,T1105
  mbc: B0030

traits:
  - id: iex-webclient-downloadstring-cradle
    desc: IEX evaluates WebClient DownloadString
    crit: suspicious
    conf: 0.96
    if:
      type: text
      regex: '(?i)IEX\s*\(\s*\(?\s*New-Object\s+Net\.WebClient\s*\)?\.DownloadString\s*\('

  - id: powershell-hidden-ep-bypass-flags
    desc: PowerShell hidden window with -ep bypass
    crit: suspicious
    conf: 0.94
    if:
      type: text
      regex: '(?i)powershell(\.exe)?\s+(-w(indowstyle)?\s+hidden|-w\s+h).{0,40}-ep\s+bypass'

composite_rules:
  - id: clickfix-clipboard-webclient-iex-cradle
    desc: ClickFix clipboard stages hidden IEX DownloadString
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/os/clipboard/access::browser-clipboard-write
      - id: iex-webclient-downloadstring-cradle
      - id: powershell-hidden-ep-bypass-flags
    any:
      - id: objectives/execution/lure/clipboard::html-winr-shortcut-instruction
      - id: objectives/execution/lure/clipboard::paste-enter-instruction-generic
      - id: objectives/execution/lure/clipboard::remote-human-check-page
    near_bytes: 1600
