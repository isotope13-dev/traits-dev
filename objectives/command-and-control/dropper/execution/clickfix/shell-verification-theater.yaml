# The shell stage behind a fake-CAPTCHA lure: the victim pastes a
# curl | bash one-liner to "verify", the script downloads and launches an
# agent, then prints that the verification passed so the victim closes the
# terminal satisfied. A local script has no human check to complete; the
# message exists only to cover the launch.
defaults:
  platforms: [macos, linux]
  for: [shell]
  attack: T1204.004,T1059.004,T1105
  mbc: B0030

composite_rules:
  - id: shell-verification-theater-binary-launch
    desc: Launches a download behind a fake verification message
    crit: hostile
    conf: 0.97
    all:
      - id: micro-behaviors/ui/keywords::human-verification-passed-message
      - id: micro-behaviors/communications/http/download/cli::curl-command-call
      - id: micro-behaviors/fs/chmod/executable/mode::chmod-exec-var-target
      - id: micro-behaviors/process/create/local-exec::execute-quoted-var
