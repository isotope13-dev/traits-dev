# macOS ClickFix loaders combine a user-executed shell stage with payload
# staging, launchd persistence, and terminal-history cleanup. These rules bind
# those structural operations without relying on the lure's wording or domain.
defaults:
  platforms: [macos]
  for: [shell, javascript, typescript, go, python, macho]
  attack: T1105

traits:
  - id: macos-apple-cache-directory
    desc: Uses an Apple-looking cache directory
    crit: suspicious
    conf: 0.97
    if:
      type: text
      regex: '(?i)\$HOME/Library/Caches/com\.apple\.(metadata|trustd|homeenergyd|softwareupdate)\b'
  - id: macos-apple-cache-payload
    desc: Uses Apple-looking cache payload name
    crit: suspicious
    conf: 0.97
    if:
      type: text
      regex: '(?i)(com\.apple\.(verified|homeenergyd)|/com\.apple\.softwareupdate/SoftwareUpdate)\b'
composite_rules:
  - id: macos-clickfix-trust-cache-stage
    for: [shell]
    desc: Stages executable in unquarantined trust cache
    crit: hostile
    conf: 0.99
    attack: T1105,T1222.002,T1553.001
    all:
      - id: macos-apple-cache-directory
      - id: macos-apple-cache-payload
      - id: micro-behaviors/fs/attributes/xattr::xattr-quarantine-remove
    any:
      - id: micro-behaviors/fs/chmod/executable/mode::chmod-exec-var-target
      - id: micro-behaviors/fs/chmod/executable/mode::chmod-exec-absolute-path
      - id: micro-behaviors/fs/chmod/executable/mode::chmod-exec-literal-target
    near_lines: 8
  - id: macos-clickfix-arch-cache-stage
    for: [shell]
    desc: Architecture-selected payload staged in Apple-looking cache
    crit: hostile
    conf: 0.99
    attack: T1082,T1105,T1036.005
    all:
      - id: micro-behaviors/os/sysinfo/platform/arch::arch-aware-curl-download
      - id: macos-apple-cache-directory
      - id: macos-apple-cache-payload
    near_bytes: 4096
  - id: macos-signed-apple-cache-stage
    for: [shell]
    desc: Ad-hoc signed payload launches from an Apple-looking cache path
    crit: hostile
    conf: 0.99
    attack: T1105,T1553.001,T1036.005,T1564.003
    all:
      - id: macos-apple-cache-directory
      - id: macos-apple-cache-payload
      - id: micro-behaviors/fs/attributes/xattr::xattr-quarantine-remove
      - id: micro-behaviors/os/security/gatekeeper::codesign-ad-hoc-signing
      - id: micro-behaviors/process/daemonize/detach::nohup-shell-launch
    near_lines: 12
