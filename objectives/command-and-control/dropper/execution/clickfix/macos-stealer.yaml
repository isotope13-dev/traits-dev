# macOS ClickFix loaders combine a user-executed shell stage with payload
# staging, launchd persistence, and terminal-history cleanup. These rules bind
# those structural operations without relying on the lure's wording or domain.
defaults:
  platforms: [macos]
  for: [shell, javascript, typescript, go, python, macho]
  attack: T1105

traits:
  - id: hidden-tmp-download
    desc: Downloads payload into hidden /tmp file
    crit: suspicious
    conf: 0.97
    if:
      type: text
      regex: '(?is)(\bcd\s+)?/tmp\b.{0,180}\bcurl\b.{0,120}\s-o\s+["'']?\.[A-Za-z0-9_-]{3,64}["'']?'
  - id: hidden-tmp-bash-cleanup
    desc: Executes hidden temporary file with Bash
    crit: suspicious
    conf: 0.95
    if:
      type: text
      # Keep the command and hidden filename on the same line.  `\s` also
      # crosses a newline and turns a Makefile's `bash` plus `.SHELLFLAGS`
      # into a false ClickFix execution.
      regex: '(?i)\b(bash|sh)[ \t]+["'']?\.[A-Za-z0-9_-]{3,64}(?!/)'
  - id: hidden-tmp-remove
    desc: Deletes hidden temporary file
    crit: suspicious
    conf: 0.94
    if:
      type: text
      regex: '(?is)\brm\s+-[fF]\s+["'']?\.(?!ninja_(deps|log)\b)[A-Za-z0-9_-]{3,64}\b'
  - id: macos-apple-cache-directory
    desc: Uses Apple-looking cache directory
    crit: suspicious
    conf: 0.97
    if:
      type: text
      regex: '(?i)\$HOME/Library/Caches/com\.apple\.(trustd|homeenergyd|softwareupdate)\b'
  - id: macos-apple-cache-payload
    desc: Uses Apple-looking cache payload name
    crit: suspicious
    conf: 0.97
    if:
      type: text
      regex: '(?i)(com\.apple\.(verified|homeenergyd)|/com\.apple\.softwareupdate/SoftwareUpdate)\b'
composite_rules:
  - id: macos-clickfix-hidden-tmp-loader
    desc: Executes and removes hidden downloaded shell stage
    crit: hostile
    conf: 0.99
    attack: T1105,T1059.004,T1070.004
    all:
      - id: hidden-tmp-download
      - id: hidden-tmp-bash-cleanup
      - id: hidden-tmp-remove
    near_lines: 3
  - id: macos-clickfix-history-cleanup
    desc: ClickFix-style shell stage erases its command history entry
    crit: hostile
    conf: 0.99
    attack: T1070.003,T1059.004
    all:
      - id: objectives/evasion/indicator-removal/history::shell-history-entry-delete
      - id: objectives/evasion/indicator-removal/history::fc-null-history
    near_lines: 4
  - id: macos-clickfix-trust-cache-stage
    desc: Stages executable in unquarantined trust cache
    crit: hostile
    conf: 0.99
    attack: T1105,T1222.002,T1553.001
    all:
      - id: macos-apple-cache-directory
      - id: macos-apple-cache-payload
      - id: micro-behaviors/fs/attributes/xattr::xattr-quarantine-remove
    any:
      - id: micro-behaviors/fs/chmod/executable/mode::chmod-exec-var-target
      - id: micro-behaviors/fs/chmod/executable/mode::chmod-exec-absolute-path
      - id: micro-behaviors/fs/chmod/executable/mode::chmod-exec-literal-target
    near_lines: 8
  - id: macos-clickfix-arch-cache-stage
    desc: Architecture-selected payload staged in Apple-looking cache
    crit: hostile
    conf: 0.99
    attack: T1082,T1105,T1036.005
    all:
      - id: micro-behaviors/os/sysinfo/platform/arch::arch-aware-curl-download
      - id: macos-apple-cache-directory
      - id: macos-apple-cache-payload
    near_bytes: 4096
