defaults:
  platforms:
  - windows
  - unix
  for:
  - javascript
  - typescript
  attack: T1059.007
traits:
- id: hash-input-startswith-prefix
  desc: Hash input starts with a fixed prefix
  crit: suspicious
  conf: 0.9
  if:
    type: text
    regex: (hash|digest)[A-Za-z0-9_$]*\.startsWith\("[0-9A-Fa-f]{5,}"\)
- id: checksum-input-startswith-prefix
  desc: Checksum input starts with a fixed prefix
  crit: suspicious
  conf: 0.9
  if:
    type: text
    regex: (checksum|fingerprint)[A-Za-z0-9_$]*\.startsWith\("[0-9A-Fa-f]{5,}"\)
- id: python-hash-input-prefix
  desc: Python hash input starts with a prefix
  crit: suspicious
  conf: 0.9
  for:
  - python
  if:
    type: text
    regex: (hash|digest)[A-Za-z0-9_]*\.startswith\("[0-9A-Fa-f]{5,}"\)
composite_rules:
- id: hash-prefixed-input-gate
  desc: Hash-like input prefix gate
  crit: suspicious
  conf: 0.9
  any:
  - id: hash-input-startswith-prefix
  - id: checksum-input-startswith-prefix
- id: platform-branched-dropper
  desc: Platform-branched payload dropper
  crit: suspicious
  conf: 0.9
  near_bytes: 8192
  all:
  - id: micro-behaviors/os/sysinfo/platform/branch::multi-platform-branch
  - id: micro-behaviors/process/create/shell/bridge::child-process-require
  - id: micro-behaviors/communications/http/download/
  any:
  - id: micro-behaviors/process/create/shell/bridge::execSync-call
  - id: micro-behaviors/process/create/shell/bridge::js-exec
  - id: micro-behaviors/process/create/spawn::spawn-call
  unless:
  - id: metadata/package/testing/harness/runtime/
  - id: metadata/package/testing/presence/fixture::test-filename-pattern
  - id: objectives/command-and-control/dropper/node-bootstrap/
  - id: well-known/lib/ai/
  - id: well-known/lib/development/launch-editor::launch-editor-guess-context
  - id: well-known/lib/platform/arch::arch-library-context
  - id: well-known/lib/runtime/scripted/napi-rs::napi-rs-generated-loader-context
- id: platform-branched-remote-config-shell-stage
  desc: Platform branch drives shell execution from remote config
  crit: hostile
  conf: 0.98
  attack: T1105,T1059.007,T1195.002
  near_bytes: 8192
  all:
  - id: micro-behaviors/os/sysinfo/platform/branch::node-os-platform-alias-branch
  - id: micro-behaviors/communications/http/url/domain::js-remote-host-url
  - id: micro-behaviors/process/interpreter/eval/direct::evaluate-helper-identifier-call
  - id: micro-behaviors/process/create/shell/bridge::js-stream-end-exec-call
- id: platform-branched-supply-chain-dropper
  desc: Supply chain platform-branched dropper
  crit: hostile
  conf: 0.95
  attack: T1195.002
  all:
  - id: platform-branched-dropper
  any:
  - id: objectives/evasion/self-delete/file/script::node-self-delete
  - id: objectives/evasion/self-delete/file/script::manifest-swap
  - id: metadata/package/scripts/lifecycle::install-hooks
- id: npm-platform-alias-install-dropper
  for:
  - javascript
  - typescript
  - package.json
  - npm
  desc: Npm cross-platform install dropper
  crit: hostile
  conf: 0.98
  attack: T1195.002
  scope: archive
  all:
  - id: micro-behaviors/os/sysinfo/platform/branch::node-os-platform-alias-branch
  - id: micro-behaviors/process/create/shell/bridge::child-process-require
  - id: objectives/supply-chain/install-hook/scripts/declaration::postinstall-hook-declaration
  any:
  - id: objectives/evasion/self-delete/file/script::unlink-filename
  - id: objectives/evasion/self-delete/file/script::unlink-package-json
  - id: objectives/evasion/self-delete/file/script::rename-package-md
- id: js-platform-branch-remote-stage-cleanup
  desc: Script branches on platform, fetches remotely, and self-cleans
  crit: suspicious
  conf: 0.9
  scope: file
  all:
  - id: micro-behaviors/os/sysinfo/platform/branch::node-os-platform-alias-branch
  - id: micro-behaviors/process/create/shell/bridge::child-process-require
  - id: micro-behaviors/communications/http/url/domain::js-remote-host-url
  any:
  - id: objectives/evasion/self-delete/file/script
- id: npm-install-hook-remote-stage-cleanup
  for:
  - javascript
  - typescript
  - json
  - package.json
  - npm
  desc: Npm hook stages platform payload and self-cleans
  crit: hostile
  conf: 0.98
  attack: T1195.002,T1105,T1070.004
  scope: archive
  all:
  - id: objectives/supply-chain/install-hook/scripts/declaration::postinstall-hook-declaration
  - id: js-platform-branch-remote-stage-cleanup
  unless:
  - id: well-known/tool/development/editor/vscodium::archive-context
- id: hash-gated-second-stage-download-execute
  desc: Hash-gated remote second-stage download and execution
  crit: hostile
  conf: 0.98
  attack: T1105,T1059.007
  near_bytes: 8192
  all:
  - id: hash-prefixed-input-gate
  - id: micro-behaviors/communications/http/request/client::https-get
  - id: micro-behaviors/process/create/system::js-execfile-call
- id: cross-platform-layered-stage-dropper
  desc: Cross-platform downloader executes a Base64/XOR staged payload
  crit: hostile
  conf: 0.99
  attack: T1027,T1059.007,T1105,T1222.002
  near_bytes: 8192
  all:
  - id: micro-behaviors/os/sysinfo/platform/branch::multi-platform-branch
  - id: micro-behaviors/data/decode/base64::buffer-from-base64
  - id: micro-behaviors/crypto/symmetric/xor/loop::xor-modulo-key-loop
  - id: micro-behaviors/communications/http/request/client::https-get
  - id: micro-behaviors/fs/write/file/full::node-write-file-sync
  - id: micro-behaviors/process/create/system::js-execfile-call
- id: python-hash-gated-platform-stage
  desc: Python hash-gated platform stage
  crit: hostile
  conf: 0.98
  for:
  - python
  attack: T1027,T1105,T1059.006,T1222.002
  near_bytes: 8192
  all:
  - id: python-hash-input-prefix
  - id: micro-behaviors/os/sysinfo/platform/branch::python-platform-branch
  - id: micro-behaviors/communications/http/lib/requests::requests-get
  - id: micro-behaviors/fs/file/open::write-append-create-mode
  - id: micro-behaviors/process/create/subprocess::process-execution
