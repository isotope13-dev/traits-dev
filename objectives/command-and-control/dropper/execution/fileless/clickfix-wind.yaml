# ClickFix-style PowerShell one-liners truncate -WindowStyle to `-wind mi`
# and rebuild `irm` from `sv o ir` plus `(gv o).Value+'M'`.
defaults:
  platforms: [windows]
  for: [powershell, text, html]
  attack: T1059.001,T1105,T1564.003

traits:
  - id: powershell-truncated-windowstyle
    desc: Truncated PowerShell WindowStyle flag
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)-wind\s+mi\b'
  - id: powershell-sv-ir-alias
    desc: Set-Variable aliases the irm prefix
    crit: notable
    conf: 0.92
    if:
      type: text
      regex: '(?i)\bsv\s+\w+\s+ir\b'
  - id: powershell-gv-irm-reconstruct
    desc: Rebuilds irm from a variable plus M
    crit: notable
    conf: 0.93
    if:
      type: text
      regex: '(?i)\(gv\s+\w+\)\.Value\+\s*[''"]M[''"]'

composite_rules:
  - id: clickfix-truncated-window-irm
    desc: Hidden truncated-window IRM reconstruction
    crit: hostile
    conf: 0.96
    all:
      - id: powershell-truncated-windowstyle
      - id: powershell-gv-irm-reconstruct
  - id: clickfix-sv-ir-reconstruct
    desc: Set-Variable irm prefix reconstruction
    crit: hostile
    conf: 0.96
    all:
      - id: powershell-sv-ir-alias
      - id: powershell-gv-irm-reconstruct
  - id: clickfix-truncated-sv-ir
    desc: Truncated-window Set-Variable irm alias
    crit: hostile
    conf: 0.95
    all:
      - id: powershell-truncated-windowstyle
      - id: powershell-sv-ir-alias
