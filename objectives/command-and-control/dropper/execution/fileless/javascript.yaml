# A JavaScript program that shells out to a PowerShell download-and-execute
# cradle.
#
# `powershell -Command "irm <url> | iex"` fetches a script over HTTP and runs it
# in the PowerShell process. Nothing is written to disk, so there is no file for
# an on-access scanner to see and no artifact left for an incident responder to
# recover — and the code that runs is whatever the server decides to return at
# that moment, which means the shipped artifact never contains the payload at
# all. The delivery is the only thing an analyst gets to look at.
#
# The pairing is what makes this hostile rather than a string. A program that
# merely *contains* this command line might be documenting an install step;
# these composites require the host program to also hold the means to run a
# command, which turns the string into an instruction. The anchor on the command
# atom keeps prose out.
#
# Host-language-specific because the spawn primitives are: the sibling files in
# this directory do the same for Perl, Swift, Deno and WSH.
defaults:
  platforms: [windows]
  for: [javascript, typescript]
  attack: T1059.001,T1105
  mbc: B0030

composite_rules:
  - id: js-powershell-fetch-execute-cradle
    desc: JavaScript spawns a PowerShell fetch-execute cradle
    crit: hostile
    conf: 0.95
    all:
      - id: micro-behaviors/process/interpreter/eval/direct::powershell-fetch-execute-command
    unless:
      - id: well-known/tool/development/uv::uv-install-sh-bootstrap-url
    needs: 1
    any:
      # Any of the Node spawn bridges — the point is that the host program can
      # run a command, not which call it reaches for.
      - id: micro-behaviors/process/create/shell/bridge
    # `js-hidden-powershell-fetch-execute` below is this rule plus a hidden
    # window, so whenever it matches, this one matches too and the same cradle
    # is reported twice. Step aside for the more specific finding; on its own —
    # a cradle run in a visible console — this stays hostile.
    downgrade:
      any:
        - id: js-hidden-powershell-fetch-execute

  # The same cradle with the window suppressed on both sides — Node's
  # `windowsHide` and PowerShell's own `-WindowStyle Hidden`. A console window
  # is the only thing that would tell the user their editor just started a
  # shell, so suppressing it is a deliberate choice about who gets to notice,
  # and it has no place in a program that is doing something it can explain.
  - id: js-hidden-powershell-fetch-execute
    desc: JavaScript hides a PowerShell fetch-execute cradle
    crit: hostile
    conf: 0.97
    all:
      - id: js-powershell-fetch-execute-cradle
    needs: 1
    any:
      - id: micro-behaviors/process/create/spawn::windowshide-obfuscated-true
      - id: micro-behaviors/process/create/hidden::argv-array-windowstyle-hidden
      - id: micro-behaviors/process/daemonize/spawn::powershell-hidden
