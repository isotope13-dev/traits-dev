defaults:
  crit: hostile
  conf: 0.99
  platforms: [windows]
  for: [javascript, vbs]
  attack: T1027,T1059.007,T1564.003

composite_rules:
  - id: wsh-hidden-environment-stage
    desc: WSH stages many environment values for a hidden child process
    all:
      - id: micro-behaviors/os/env/modify::wsh-environment-decoded-assignment-cluster
      - id: micro-behaviors/process/create/shell/wsh::wsh-run-hidden-window-text
      - id: micro-behaviors/os/com/automation::wscript-shell-literal
  # near_lines omitted: js-long-string-concat-chain is a file-level AST metric
  # that anchors at line 1, while the hidden Run often sits hundreds of lines
  # later after a large environment-staged payload. The five-leg combination is
  # already high-precision without a proximity window.
  - id: wsh-environment-staged-hidden-runner
    desc: WSH environment-staged payload launches hidden
    # Fileless loader: the payload is staged through the WSH Environment
    # collection (itself retrieved through a computed argument), indexed
    # chunks are assigned through a COM default property, the script keeps
    # its own path for re-execution, and the launch hides its window behind
    # obfuscated constants.  No proximity window: the staging loop, the
    # self-path reference, and the hidden launch sit in different routines.
    all:
      - id: micro-behaviors/os/env/read::wsh-environment-computed-arg
      - id: micro-behaviors/data/source/syntax/assignment::indexed-call-assignment
      - id: micro-behaviors/process/create/shell/wsh::obfuscated-constant-hidden-window-call
      - id: micro-behaviors/process/info/selfpath::wscript-scriptfullname
      - id: objectives/execution/activex/com::activex-object-aliased-constructor
