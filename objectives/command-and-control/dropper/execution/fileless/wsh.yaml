defaults:
  crit: hostile
  conf: 0.99
  platforms: [windows]
  for: [javascript, vbs]
  attack: T1027,T1059.007,T1564.003

composite_rules:
  - id: wsh-hidden-environment-stage
    desc: WSH stages many environment values for a hidden child process
    all:
      - id: micro-behaviors/os/env/modify::wsh-environment-decoded-assignment-cluster
      - id: micro-behaviors/process/create/shell/wsh::wsh-run-hidden-window-text
      - id: micro-behaviors/os/com/object::wscript-shell-literal
  # near_lines omitted: js-long-string-concat-chain is a file-level AST metric
  # that anchors at line 1, while the hidden Run often sits hundreds of lines
  # later after a large environment-staged payload. The five-leg combination is
  # already high-precision without a proximity window.
