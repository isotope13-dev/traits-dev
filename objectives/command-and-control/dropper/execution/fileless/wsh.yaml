defaults:
  platforms: [windows]
  for: [javascript, vbs]
  attack: T1027,T1059.007,T1564.003

composite_rules:
  - id: wsh-hidden-environment-stage
    desc: WSH stages many environment values for a hidden child process
    crit: hostile
    conf: 0.99
    all:
      - id: micro-behaviors/os/env/access::wsh-environment-decoded-assignment-cluster
      - id: micro-behaviors/process/create/shell/wsh::wsh-run-hidden-window-text
      - id: micro-behaviors/os/com/object::wscript-shell-literal
  # near_lines omitted: js-long-string-concat-chain is a file-level AST metric
  # that anchors at line 1, while the hidden Run often sits hundreds of lines
  # later after a large environment-staged payload. The five-leg combination is
  # already high-precision without a proximity window.
  - id: wsh-computed-byte-hidden-environment-stage
    desc: Obfuscated JScript stages encoded values for hidden WSH execution
    crit: hostile
    conf: 0.99
    attack: T1027,T1059.001,T1059.007,T1564.003
    mbc: B0032
    all:
      - id: micro-behaviors/data/encode/char-code::computed-string-method-byte-rebuild
      - id: micro-behaviors/os/env/access::encoded-call-assignment-cluster
      - id: metadata/file/metrics::js-long-string-concat-chain
      - id: micro-behaviors/process/interpreter/eval/compile::function-ctor-call-expr-arg
      - id: micro-behaviors/process/create/shell/wsh::computed-method-hidden-window-call
