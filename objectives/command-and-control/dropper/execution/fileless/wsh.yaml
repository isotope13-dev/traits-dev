defaults:
  platforms: [windows]
  for: [javascript, vbs]
  attack: T1027,T1059.007,T1564.003

composite_rules:
  - id: wsh-hidden-environment-stage
    desc: WSH stages many environment values for a hidden child process
    crit: hostile
    conf: 0.99
    all:
      - id: micro-behaviors/os/env/access::wsh-environment-decoded-assignment-cluster
      - id: micro-behaviors/process/create/shell/wsh::wsh-run-hidden-window-text
      - id: micro-behaviors/os/wsh/file::wscript-shell-object
