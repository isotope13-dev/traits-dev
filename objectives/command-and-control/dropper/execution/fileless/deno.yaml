defaults:
  platforms: [windows]
  for: [powershell]
traits:
  - id: js-remote-deno-run-all-permissions
    desc: JavaScript runs remote Deno with -A
    crit: suspicious
    conf: 0.98
    attack: T1105,T1059.007,T1480
    for: [javascript]
    if:
      type: text
      # The unrestricted flag is only a remote/fileless dropper signal when
      # paired with a URL or data URI. Local test commands such as
      # `deno run -A ./test/test.js` are benign build metadata.
      regex: '(?i)\bdeno\s+run\s+-A\s+(https?://|data:)'

  - id: ps-deno-run-remote-all-permissions
    desc: PowerShell runs remote Deno with -A
    crit: suspicious
    conf: 0.98
    attack: T1105,T1059.007,T1480
    for: [powershell, batch, text]
    if:
      type: text
      regex: '(?i)\bdeno(\.exe)?\b.{0,80}\brun\b.{0,40}\b-A\b.{0,80}https?://'

  - id: ps-scoop-bootstrap-irm-iex
    desc: PowerShell bootstraps Scoop via irm|iex
    crit: suspicious
    conf: 0.95
    for: [powershell, batch, text]
    if:
      type: text
      regex: '(?i)\birm\b[^\r\n]{0,40}get\.scoop\.sh[^\r\n]{0,40}\|\s*iex\b'
  - id: ps-deno-install-script
    desc: PowerShell downloads Deno installer
    crit: suspicious
    conf: 0.96
    if:
      type: text
      regex: '(?i)\birm\b.{0,80}https://deno\.land/install\.ps1'
  - id: ps-deno-runtime-path
    desc: PowerShell references Deno runtime
    crit: suspicious
    conf: 0.94
    if:
      type: text
      regex: '(?i)\$env:USERPROFILE\\\.deno\\bin\\deno\.exe'
  - id: ps-deno-data-uri-exec
    desc: PowerShell runs Deno data URI
    crit: suspicious
    conf: 0.98
    if:
      type: text
      regex: '(?is)\.deno\\bin\\deno\.exe.{0,80}-A.{0,120}data:application/javascript;base64,'
  - id: curl-deno-land-zip-fetch
    desc: curl downloads Deno release zip
    crit: suspicious
    conf: 0.96
    for: [powershell, batch, vbs]
    if:
      type: text
      regex: '(?i)\bcurl(\.exe)?\b.{0,160}dl\.deno\.land/.{0,100}deno-[A-Za-z0-9._-]{1,80}\.zip'
  - id: tar-extract-deno-zip
    desc: tar extracts Deno zip archive
    crit: suspicious
    conf: 0.94
    for: [powershell, batch, vbs]
    if:
      type: text
      regex: '(?i)\btar(\.exe)?\b.{0,60}\bxf\b.{0,100}deno\.zip'
  - id: localappdata-serial-stage-path
    desc: LocalAppData Serial staging path
    crit: notable
    conf: 0.9
    for: [powershell, batch, vbs, text]
    if:
      type: text
      regex: '(?i)(%LOCALAPPDATA%|\\AppData\\Local)\\Serial\\'
  - id: encoded-deno-username-env
    desc: Encoded Deno username environment lookup
    crit: component
    conf: 0.92
    if:
      type: encoded
      encoding: base64
      substr: 'Deno.env.get("USERNAME")'
  - id: encoded-deno-hostname-call
    desc: Encoded Deno hostname lookup
    crit: component
    conf: 0.92
    if:
      type: encoded
      encoding: base64
      substr: Deno.hostname()
  - id: encoded-deno-system-memory
    desc: Encoded Deno memory fingerprinting
    crit: component
    conf: 0.92
    if:
      type: encoded
      encoding: base64
      substr: Deno.systemMemoryInfo()
  - id: encoded-deno-osrelease
    desc: Encoded Deno OS release lookup
    crit: component
    conf: 0.92
    if:
      type: encoded
      encoding: base64
      substr: Deno.osRelease()
  - id: encoded-deno-mutex-bind
    desc: Encoded Deno localhost bind mutex
    crit: suspicious
    conf: 0.97
    if:
      type: encoded
      encoding: base64
      # Obfuscated `port:n` or a literal high port used as a single-instance lock.
      regex: 'Deno\.listen\(\{port:(n|\d{4,5}),hostname:"127\.0\.0\.1",transport:"tcp"\}'
  - id: encoded-deno-health-check
    desc: Encoded Deno C2 health check
    crit: suspicious
    conf: 0.97
    if:
      type: encoded
      encoding: base64
      regex: '(?s)Promise\.any\(.{0,220}/health.{0,220}Promise\.race'
  - id: encoded-deno-jwt-stage-fetch
    desc: Encoded Deno JWT stage fetch
    crit: suspicious
    conf: 0.98
    if:
      type: encoded
      encoding: base64
      regex: '/mv2/[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+/'
  - id: encoded-deno-fileless-import
    desc: Encoded Deno fileless JS import
    crit: suspicious
    conf: 0.98
    if:
      type: encoded
      encoding: base64
      regex: 'import\("data:application/javascript;base64,"\+btoa'
  - id: deno-username-env
    desc: Deno username environment lookup
    crit: component
    conf: 0.92
    for: [javascript]
    if:
      type: text
      substr: 'Deno.env.get("USERNAME")'
  - id: deno-hostname-call
    desc: Deno hostname lookup
    crit: component
    conf: 0.92
    for: [javascript]
    if:
      type: text
      substr: Deno.hostname()
  - id: deno-system-memory
    desc: Deno memory fingerprinting
    crit: component
    conf: 0.92
    for: [javascript]
    if:
      type: text
      substr: Deno.systemMemoryInfo()
  - id: deno-osrelease
    desc: Deno OS release lookup
    crit: component
    conf: 0.92
    for: [javascript]
    if:
      type: text
      substr: Deno.osRelease()
  - id: deno-mutex-bind
    desc: Deno localhost bind mutex
    crit: suspicious
    conf: 0.97
    for: [javascript]
    if:
      type: text
      regex: 'Deno\.listen\(\{port:(n|\d{4,5}),hostname:"127\.0\.0\.1",transport:"tcp"\}'
  - id: deno-health-check
    desc: Deno C2 health check
    crit: suspicious
    conf: 0.97
    for: [javascript]
    if:
      type: text
      regex: '(?s)Promise\.any\(.{0,220}/health.{0,220}Promise\.race'
  - id: deno-jwt-stage-fetch
    desc: Deno JWT stage fetch
    crit: suspicious
    conf: 0.98
    for: [javascript]
    if:
      type: text
      regex: '/mv2/[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+/'
  - id: deno-fileless-import
    desc: Deno fileless JS import
    crit: suspicious
    conf: 0.98
    for: [javascript]
    if:
      type: text
      regex: 'import\("data:application/javascript;base64,"\+btoa'
composite_rules:
  - id: encoded-deno-host-fingerprint
    desc: Encoded Deno host fingerprinting
    crit: suspicious
    conf: 0.97
    all:
      - id: encoded-deno-username-env
      - id: encoded-deno-hostname-call
      - id: encoded-deno-system-memory
      - id: encoded-deno-osrelease
  - id: deno-host-fingerprint
    desc: Deno host fingerprinting
    crit: suspicious
    conf: 0.97
    for: [javascript]
    all:
      - id: deno-username-env
      - id: deno-hostname-call
      - id: deno-system-memory
      - id: deno-osrelease
  - id: ps-deno-bootstrap
    desc: PowerShell bootstraps Deno runtime
    crit: suspicious
    conf: 0.96
    all:
      - id: ps-deno-install-script
      - id: ps-deno-runtime-path
  - id: ps-fileless-deno-loader
    desc: PowerShell launches fileless Deno loader
    crit: hostile
    conf: 0.99
    all:
      - id: ps-deno-runtime-path
      - id: ps-deno-data-uri-exec
  - id: encoded-deno-c2-loader
    desc: Encoded Deno C2 loader
    crit: hostile
    conf: 0.99
    all:
      - id: encoded-deno-host-fingerprint
      - id: encoded-deno-mutex-bind
      - id: encoded-deno-health-check
      - id: encoded-deno-jwt-stage-fetch
      - id: encoded-deno-fileless-import
  - id: deno-c2-loader
    desc: Deno in-memory C2 loader
    crit: hostile
    conf: 0.99
    for: [javascript]
    all:
      - id: deno-host-fingerprint
      - id: deno-mutex-bind
      - id: deno-health-check
      - id: deno-jwt-stage-fetch
      - id: deno-fileless-import
  - id: deno-mutex-health-jwt-stage
    desc: Deno mutex with health and JWT staging
    crit: hostile
    conf: 0.98
    for: [javascript]
    all:
      - id: deno-mutex-bind
      - id: deno-health-check
      - id: deno-jwt-stage-fetch
  - id: curl-tar-deno-byor-stage
    desc: curl and tar stage Deno BYOR runtime
    crit: hostile
    conf: 0.98
    attack: T1105,T1059.007
    all:
      - id: curl-deno-land-zip-fetch
      - id: tar-extract-deno-zip
      - id: ps-deno-runtime-path
  - id: curl-tar-fileless-deno-chain
    desc: curl/tar Deno stage launches fileless data URI
    crit: hostile
    conf: 0.99
    attack: T1105,T1059.007,T1620
    all:
      - id: curl-tar-deno-byor-stage
      - id: ps-deno-data-uri-exec
  - id: ps-scoop-winget-deno-remote-c2
    desc: Scoop/winget bootstrap then Deno remote -A C2
    crit: hostile
    conf: 0.98
    attack: T1105,T1059.001,T1059.007
    for: [powershell, batch, text]
    all:
      - id: ps-scoop-bootstrap-irm-iex
      - id: ps-deno-run-remote-all-permissions
    any:
      - id: micro-behaviors/process/create/hidden::powershell-windowstyle-hidden-option
      - id: objectives/command-and-control/dropper/execution/fileless::ps-irm-pipeline-eval
      - id: micro-behaviors/communications/ip/literal::http-ip-url
  - id: vbs-serial-hidden-powershell-launcher
    desc: VBS launches hidden PowerShell from Serial stage path
    crit: suspicious
    conf: 0.97
    attack: T1059.005,T1059.001
    for: [vbs]
    all:
      - id: localappdata-serial-stage-path
      - id: micro-behaviors/process/create/shell/command-flag::powershell-flagged-command-line
    any:
      - id: micro-behaviors/process/create/shell/wsh::wscript-shell-hidden-run
      - id: micro-behaviors/process/create/shell/wsh::wscript-shell-run
      - id: micro-behaviors/os/com/object::wscript-shell-literal
