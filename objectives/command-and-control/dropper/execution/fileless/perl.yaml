defaults:
  platforms: [unix]
  for: [perl]
  attack: T1059.006
  mbc: B0022

traits:
  - id: perl-base64-runtime-payload
    desc: Perl decodes runtime payload
    crit: suspicious
    conf: 0.94
    if:
      type: text
      substr: 'decode_base64($blob)'

composite_rules:
  - id: perl-fileless-python-payload
    desc: Perl fileless Python payload
    crit: hostile
    conf: 0.98
    all:
      - id: perl-base64-runtime-payload
      - id: micro-behaviors/process/interpreter/python::python-inline-command
      - id: micro-behaviors/process/fork/clone::fork-call
