# IRM/IEX cradles that fetch a remote HTTPS script rather than a public
# CDN bootstrap. The existing public-code pipeline requires gist/jsDelivr
# hosts; commodity droppers use throwaway HTTPS URLs instead.
defaults:
  platforms: [windows]
  for: [powershell, batch]
  attack: T1059.001,T1105
  mbc: B0030

traits:
  - id: irm-https-url
    desc: IRM fetches a remote HTTPS URL
    crit: notable
    conf: 0.9
    if:
      type: text
      # Allow cmdlet arguments between the command and the URL: droppers
      # use the long form (Invoke-RestMethod -Uri 'https://...').
      regex: '(?i)\b(irm|Invoke-RestMethod)\b[^|\r\n]{0,80}https://'
  - id: irm-https-ps1-url
    desc: IRM fetches a remote HTTPS script
    crit: notable
    conf: 0.92
    if:
      type: text
      regex: '(?i)\b(irm|Invoke-RestMethod)\b[^|\r\n]{0,80}https://[^\s|]{1,80}\.ps1\b'

composite_rules:
  - id: irm-https-pipeline-eval
    desc: HTTPS IRM response piped to IEX
    crit: hostile
    conf: 0.96
    all:
      - id: irm-https-url
      - id: objectives/command-and-control/dropper/execution/fileless::ps-irm-pipeline-eval
    unless:
      - id: well-known/lib/ai/unsloth::unsloth-package-context
      - id: well-known/app/productivity/ferronote::ferronote-windows-installer-context
      - id: well-known/app/ai/gateway/ollama::official-install-ps1-url
      - id: micro-behaviors/os/package-manager/install::bun-powershell-piped-installer-command
      - id: metadata/package/documentation/powershell-help::powershell-comment-help-piped-url-example
      - id: metadata/package/documentation/powershell-help::powershell-comment-help-irm-iex-example
  - id: irm-https-oneliner-eval
    desc: One-line HTTPS IRM cradle evaluates code
    crit: hostile
    conf: 0.96
    all:
      - id: irm-https-url
      - id: metadata/file/line::file-one-liner
      - id: objectives/command-and-control/dropper/execution/fileless::ps-irm-pipeline-eval
    unless:
      - id: well-known/lib/ai/unsloth::unsloth-package-context
      - id: well-known/app/productivity/ferronote::ferronote-windows-installer-context
      - id: well-known/app/ai/gateway/ollama::official-install-ps1-url
      - id: micro-behaviors/os/package-manager/install::bun-powershell-piped-installer-command
      - id: metadata/package/documentation/powershell-help::powershell-comment-help-piped-url-example
      - id: metadata/package/documentation/powershell-help::powershell-comment-help-irm-iex-example
  - id: irm-https-script-eval
    desc: IRM fetches a remote HTTPS PowerShell script
    crit: hostile
    conf: 0.95
    all:
      - id: irm-https-ps1-url
      - id: objectives/command-and-control/dropper/execution/fileless::ps-irm-pipeline-eval
    unless:
      - id: well-known/lib/ai/unsloth::unsloth-package-context
      - id: well-known/app/productivity/ferronote::ferronote-windows-installer-context
      - id: well-known/app/ai/gateway/ollama::official-install-ps1-url
      - id: micro-behaviors/os/package-manager/install::bun-powershell-piped-installer-command
      - id: metadata/package/documentation/powershell-help::powershell-comment-help-piped-url-example
      - id: metadata/package/documentation/powershell-help::powershell-comment-help-irm-iex-example
# A nested powershell.exe invocation that fetches a remote HTTPS script and
# pipes it straight into the evaluator is fileless execution, not an
# installer: the fetch and the piped eval must coincide in one command line.
  - id: irm-https-wrapper-eval
    desc: Nested PowerShell evaluates a remote HTTPS script
    crit: hostile
    conf: 0.96
    near_bytes: 512
    all:
      - id: irm-https-url
      - id: objectives/command-and-control/dropper/execution/fileless::ps-command-wrapper-network-eval
    unless:
      - id: well-known/lib/ai/unsloth::unsloth-package-context
      - id: well-known/app/productivity/ferronote::ferronote-windows-installer-context
      - id: well-known/app/ai/gateway/ollama::official-install-ps1-url
      - id: micro-behaviors/os/package-manager/install::bun-powershell-piped-installer-command
      - id: metadata/package/documentation/powershell-help::powershell-comment-help-piped-url-example
      - id: metadata/package/documentation/powershell-help::powershell-comment-help-irm-iex-example
