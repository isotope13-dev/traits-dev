  count_max: 1012349
- id: ps-restmethod-bare-domain-eval-call
  desc: PowerShell evals RestMethod bare domain
  crit: suspicious
  conf: 0.97
  mbc: "B0030"
  attack: "T1105"
  size_min: 1
  if:
    type: text
    regex: '\biex\s*\(\s*(irm|Invoke-RestMethod)\s+[a-z0-9][a-z0-9.-]*\.[a-z]{2,}\s*\)'
    case_insensitive: true
- id: embedded-powershell-command
  desc: Embedded PowerShell command
  crit: component
  conf: 0.92
  for: [pe, batch, powershell]
  ref: sha256:4c666890a558a284ac2f14950f096f255f622b9b4e32771d17f4667d63d2847d
  if:
    type: text
    regex: '\bpowershell(\.exe)?\b.{0,40}-Command\b'
    case_insensitive: true
- id: native-pe-irm-pipeline
  desc: PE embeds remote PowerShell IRM-IEX cradle
  crit: notable
  conf: 0.96
  attack: "T1059.001,T1105"
  for: [pe, dll]
  if:
    type: text
    regex: '(?i)\b(irm|Invoke-RestMethod)\b[^\r\n|]{0,160}\|\s*iex\b'
    not:
      - substr: bun.sh/install.ps1
  unless:
    # Bun single-file executables embed the upstream `bun.sh/install.ps1|iex`
    # bootstrap text for Windows setup failures, not a hostile cradle.
    - id: well-known/lib/runtime/bun-runtime::runtime-context
    - id: well-known/lib/runtime/bun-runtime::bun-standalone-graph-trailer
    - id: well-known/lib/runtime/bun-runtime::unix-runtime-context
- id: ps-webclient-concatenated-object
