- id: iwr-zoomsdk-chromechip-log--rx-13
  desc: Regex component marker
  crit: component
  conf: 0.97
  if:
    type: text
    substr: chromechip.log
    case_insensitive: true
  count_max: 1012329
- id: iwr-zoomsdk-chromechip-log--rx-15
  desc: Regex component marker
  crit: component
  conf: 0.97
  if:
    type: text
    substr: OutFile
    case_insensitive: true
  count_max: 1012331
- id: chromechip-log-stage-path
  desc: Chromechip log stage path
  crit: component
  conf: 0.94
  mbc: "B0030"
  attack: "T1105"
  if:
    type: text
    substr: chromechip.log
- id: hidden-powershell-getcontent-iex--rx-22
  desc: Regex component marker
  crit: component
  conf: 0.95
  if:
    type: text
    substr: Start-Process
    case_insensitive: true
  count_max: 1012339
- id: hidden-powershell-getcontent-iex--rx-23
  desc: Regex component marker
  crit: component
  conf: 0.95
  if:
    type: text
    substr: Get-Content
    case_insensitive: true
