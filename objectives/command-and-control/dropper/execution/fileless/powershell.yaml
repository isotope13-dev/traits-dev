composite_rules:
- id: ps-webrequest-content-iex-pipeline
  desc: PowerShell evaluates downloaded response content
  crit: suspicious
  conf: 0.96
  mbc: "B0030"
  attack: "T1059.001,T1105"
  for: [powershell, vbs, batch]
  all:
  - id: ps-webrequest-content-iex
  any:
  - id: micro-behaviors/communications/http/lib/invoke-webrequest::invoke-webrequest
  - id: micro-behaviors/communications/http/lib/invoke-webrequest::invoke-restmethod
  near_bytes: 384
  near_lines: 1
  not:
    - regex: '(?i)githubusercontent\.com'
    - regex: '(?i)//github\.com/'
- id: ps-command-wrapper-useb-remote-eval
  desc: Nested PowerShell uses BasicParsing for IWR-to-IEX execution
  crit: suspicious
  conf: 0.97
  mbc: "B0030"
  attack: "T1059.001,T1105"
  all:
  - id: ps-command-wrapper-network-eval
  - id: micro-behaviors/communications/http/lib/invoke-webrequest::useb-flag
  near_bytes: 384
- id: ps-http-inprocess-shellcode-loader
  desc: PowerShell network-delivered in-process shellcode loader
  crit: hostile
  conf: 0.99
  attack: T1105,T1055.001,T1620
  mbc: B0030
  near_lines: 80
  all:
  - id: objectives/evasion/process/injection/runtime::powershell-inprocess-shellcode-loader
  - id: micro-behaviors/communications/http/lib/invoke-webrequest::invoke-webrequest
- id: ps-restmethod-eval-call
  desc: PowerShell evaluates an Invoke-RestMethod response
  crit: suspicious
  conf: 0.96
  mbc: "B0030"
  attack: "T1105"
  all:
  - id: micro-behaviors/process/interpreter/eval::powershell-iex-call
  - id: micro-behaviors/communications/http/lib/invoke-webrequest::invoke-restmethod
  - id: micro-behaviors/communications/http/lib/invoke-webrequest::irm-name
  near_bytes: 256
  unless:
  - id: well-known/tool/development/avengineers-bootstrap-installer::bootstrap-installer-powershell-context
  - id: well-known/app/productivity/ferronote::ferronote-windows-installer-context
  - id: well-known/tool/sysadmin/scoop::scoop-bootstrap-installer-context
- id: ps-remote-command-response-field
  desc: PowerShell HTTP request with command/task response property
  crit: suspicious
  conf: 0.96
  attack: T1059.001
  unless:
  # Ansible modules return a result object whose fields are named for the
  # module's own parameters, so `$result.command` next to the Invoke-WebRequest
  # a win_get_url/win_package module makes is the module reporting itself.
  - id: well-known/app/infrastructure/ansible::ansible-module-source-context
  all:
  - id: micro-behaviors/communications/http/lib/invoke-webrequest::request-powershell
  any:
  - id: ps-response-command-field
  - id: ps-response-task-field
  - id: ps-task-command-field
  - id: ps-task-script-field
- id: hidden-policy-bypassed-remote-eval
  desc: Hidden policy-bypassed remote script execution
  crit: hostile
  conf: 0.99
  mbc: "B0030"
  attack: "T1059.001, T1105, T1564.003"
  all:
  # Use the flag atom directly so native .ps1 files match; the
  # execution-policy-bypass composite incorrectly requires powershell-keyword,
  # which excludes PowerShell itself (meant for embedding hosts only).
  - id: objectives/execution/interpreter/script/wsh::execution-policy-bypass-flag
  - id: micro-behaviors/process/create/hidden::start-process-windowstyle-hidden
  - id: ps-restmethod-bare-domain-eval-call
- id: hidden-window-policy-bypassed-irm-eval
  desc: Hidden-window PowerShell bypasses policy and evaluates a remote response
  crit: hostile
  conf: 0.99
  mbc: "B0030"
  attack: "T1059.001, T1105, T1564.003"
  all:
  - id: micro-behaviors/process/create/flags::powershell-policy-bypass-flag
  - id: micro-behaviors/process/create/hidden::powershell-windowstyle-hidden-option
  - id: ps-restmethod-bare-domain-eval-call
  near_bytes: 256
- id: restmethod-http-pipe-iex
  desc: PowerShell evaluates an HTTP response returned by Invoke-RestMethod
  # This is a real download-and-evaluate capability, but it is also used by
  # first-party installers. Keep the capability notable; hostile intent needs
  # the stealth, policy-bypass, or embedded-payload composites.
  crit: notable
  conf: 0.96
  mbc: "B0030"
  attack: "T1105"
  for: [batch, powershell]
  # Both legs are structured call facts, so comments and string-valued
  # update instructions cannot form a fileless execution pipeline.
  all:
  - id: micro-behaviors/communications/http/lib/invoke-webrequest::invoke-restmethod
  - id: micro-behaviors/process/interpreter/eval::powershell-iex-call
  near_bytes: 256
- id: ps-downloadfile-call
  desc: PowerShell DownloadFile call
  crit: suspicious
  conf: 0.9
  attack: T1105
  any:
  - id: ps-downloadfile-exe-dll
  - id: ps-downloadfile-shell-script
  - id: ps-downloadfile-script-host
- id: ps-tiny-hidden-irm-eval
  desc: Tiny hidden PowerShell IRM eval
  crit: hostile
  conf: 0.99
  mbc: "B0030"
  attack: "T1059.001"
  all:
  - id: objectives/command-and-control/dropper/execution/fileless::ps-tiny-hidden-ep-launcher
  - id: objectives/command-and-control/dropper/execution/fileless::ps-tiny-irm-eval

# ClickFix paste-and-run cradles: hidden-window powershell that immediately
# iex(irm ...) fetches a remote script, often with -UseBasicParsing.
- id: clickfix-hidden-irm-cradle
  desc: Hidden-window PowerShell IRM ClickFix cradle
  crit: suspicious
  conf: 0.98
  mbc: "B0030"
  attack: "T1059.001,T1105,T1204.004"
  for: [powershell, batch, html, javascript]
  near_bytes: 256
  all:
  - id: ps-tiny-irm-eval
  - id: micro-behaviors/process/create/hidden::powershell-hidden-window
  any:
  - id: micro-behaviors/communications/http/lib/invoke-webrequest::useb-flag

- id: clickfix-tracked-irm-cradle
  desc: IRM cradle with Verification ID trailer
  crit: suspicious
  conf: 0.97
  mbc: "B0030"
  attack: "T1059.001,T1105,T1204.004"
  for: [powershell, batch, html, javascript]
  near_bytes: 200
  all:
  - id: ps-tiny-irm-eval
  - id: clickfix-verification-id-comment

- id: clickfix-code-verification-irm-cradle
  desc: IRM cradle with Code Verification marker
  crit: hostile
  conf: 0.98
  mbc: "B0030"
  attack: "T1059.001,T1105,T1204.004"
  for: [powershell, batch, html, javascript]
  near_bytes: 240
  all:
  - id: clickfix-code-verification-comment
  any:
  - id: ps-tiny-irm-eval
  - id: micro-behaviors/communications/http/lib/invoke-webrequest::embedded-iex-irm-call
  - id: micro-behaviors/communications/http/lib/invoke-webrequest::embedded-irm-iex-pipeline
# Tiny iex(irm …) cradles pointed at a raw IPv4 host — no DNS, no vendor CDN.
# Catches future ClickFix/one-liner stagers that skip http:// and pipe forms.
- id: ps-tiny-irm-ipv4-eval
  desc: Tiny PowerShell IRM eval from raw IPv4 host
  crit: hostile
