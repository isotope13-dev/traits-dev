- id: hidden-powershell-getcontent-iex-flow
  desc: Get-Content output piped to PowerShell eval
  crit: suspicious
  conf: 0.98
  if:
    type: text
    regex: '(?i)Get-Content[^\r\n|]{0,160}\|\s*(IEX|Invoke-Expression)\b'
- id: curl-custom-ua-piped-powershell--rx-27
  desc: Regex component marker
