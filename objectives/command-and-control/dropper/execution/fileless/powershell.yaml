defaults:
  platforms: [windows]
  for: [powershell]

traits:
- id: ps-c2-register-endpoint
  desc: PowerShell HTTP request to a /register endpoint
  crit: suspicious
  conf: 0.95
  if:
    type: text
    regex: '(?i)\b(Invoke-RestMethod|Invoke-WebRequest|curl(\.exe)?)\b[^\r\n]{0,180}/register\b'
- id: ps-c2-poll-endpoint
  desc: PowerShell HTTP request to a /poll endpoint
  crit: suspicious
  conf: 0.95
  if:
    type: text
    regex: '(?i)\b(Invoke-RestMethod|Invoke-WebRequest|curl(\.exe)?)\b[^\r\n]{0,180}/poll\b'
- id: ps-c2-report-endpoint
  desc: PowerShell HTTP request to a /report endpoint
  crit: suspicious
  conf: 0.95
  if:
    type: text
    regex: '(?i)\b(Invoke-RestMethod|Invoke-WebRequest|curl(\.exe)?)\b[^\r\n]{0,180}/report\b'
- id: ps-response-command-field
  desc: PowerShell response/result command property
  crit: component
  conf: 0.96
  attack: T1059.001
  if:
    type: text
    # Generic object properties such as `$hookDef.command` are common in
    # installers and configuration code, not evidence of C2 tasking.
    regex: '(?i)\$(response|result)\.(command|cmd)\b'
- id: ps-response-task-field
  desc: PowerShell response/result task property token
  crit: component
  conf: 0.96
  attack: T1059.001
  if:
    type: text
    regex: '(?i)\$(response|result)\.(task|script)\b'
- id: ps-task-command-field
  desc: PowerShell task command property token
  crit: component
  conf: 0.96
  attack: T1059.001
  if:
    type: text
    regex: '(?i)\$(task|tasking|commandResponse)\.(command|cmd)\b'
- id: ps-task-script-field
  desc: PowerShell task script property token
  crit: component
  conf: 0.96
  attack: T1059.001
  if:
    type: text
    regex: '(?i)\$(task|tasking|commandResponse)\.(task|script)\b'
- id: ps-tiny-hidden-ep-launcher
  desc: Tiny hidden PowerShell EP bypass
  crit: suspicious
  conf: 0.96
  mbc: "B0030"
  attack: "T1059.001"
  size_min: 1
  size_max: 256
  if:
    type: text
    substr: "powershell -W H -EP B -c"
- id: ps-tiny-irm-eval
  desc: Tiny PowerShell IRM eval
  crit: suspicious
  conf: 0.98
  mbc: "B0030"
  attack: "T1105"
  size_min: 1
  size_max: 256
  if:
    type: text
    substr: "iex(irm "

- id: clickfix-verification-id-comment
  desc: PowerShell Verification ID comment trailer
  crit: notable
  conf: 0.96
  for: [powershell, batch, html, javascript]
  if:
    type: text
    # ErrTraffic-style ClickFix cradles append a hex tracking id in a PS
    # block comment after the iex(irm) one-liner.
    regex: '(?i)<#\s*Verification\s+ID:\s*[0-9a-f]{8,64}\s*#>'
- id: clickfix-code-verification-comment
  desc: PowerShell Code Verification comment marker
  crit: notable
  conf: 0.97
  for: [powershell, batch, html, javascript]
  if:
    type: text
    # ErrTraffic Beer-cluster clipboard commands prefix the cradle with
    # `<# Code Verification: <digits> #>` (decimal tracking id).
    regex: '(?i)<#\s*Code\s+Verification:\s*\d{6,32}\s*#>'
# ClickFix / fileless cradles often omit the URL scheme: iex(irm '1.2.3.4/x').
# Distinct from bare-domain irm|iex vendor installers (rustup/scoop) which use
# DNS names, not raw IPv4 hosts.
- id: irm-external-ipv4-host
  desc: IRM/RestMethod targets raw external IPv4 host
  crit: notable
  conf: 0.94
  mbc: "B0030"
  attack: "T1105"
  for: [powershell, batch, pe]
  if:
    type: text
    regex: "(?i)\\b(irm|Invoke-RestMethod)\\b[^\\r\\n]{0,40}['\\\"]?\\d{1,3}(\\.\\d{1,3}){3}([:/]|\\s|$)"
    is: external_ip
- id: ps-encoded-iwr-http-fragment
  desc: Encoded IWR HTTP launcher fragment
  crit: suspicious
  conf: 0.93
  mbc: "B0030"
  attack: "T1105"
  if:
    type: text
    substr: aQB3AHIAIAAiAGgAdAB0AHAA
- id: ps-encoded-scriptblock-fragment
  desc: Encoded ScriptBlock launcher fragment
  crit: suspicious
  conf: 0.95
  mbc: "B0030"
  attack: "T1059.001"
  if:
    type: text
    substr: QBbAHMAYwByAGkAcAB0AGIAbABvAGMAawBdADoAOg
- id: ps-network-eval-pipeline
  desc: PowerShell network response piped to eval
  crit: suspicious
  conf: 0.92
  mbc: "B0030"
  attack: "T1105"
  if:
    type: text
    regex: "(?im)^[ \\t]*\\biwr\\b[^\\r\\n|]{0,220}\\|\\s*iex\\b"
  not:
    # Trusted code-hosting source: `iwr <raw repo URL> | iex` is the canonical
    # vendor install one-liner (rustup/scoop/this project). Untrusted-source
    # iwr|iex (raw IP, pastebin, throwaway domain) still fires.
    - regex: '(?i)githubusercontent\.com'
    - regex: '(?i)//github\.com/'
- id: ps-command-wrapper-network-eval
  desc: Nested PowerShell pipes IWR to IEX
  crit: suspicious
  conf: 0.97
  mbc: "B0030"
  attack: "T1059.001,T1105"
  if:
    type: text
    regex: '(?i)\bpowershell\b[^\r\n]{0,120}\biwr\b[^\r\n|]{0,160}\|\s*iex\b'
- id: ps-webrequest-content-iex
  desc: PowerShell evaluates response content
  crit: suspicious
  conf: 0.96
  mbc: "B0030"
  attack: "T1059.001,T1105"
  for: [powershell, vbs, batch]
  if:
    type: text
    regex: '(?i)(Select-Object\s+-Expand\s+Content|\.Content)\s*\|\s*(IEX|Invoke-Expression)\b'
- id: ps-comment-help-irm-iex
  desc: Comment-help documents irm|iex install
  crit: notable
  conf: 0.9
  if:
    type: text
    regex: '(?is)\.SYNOPSIS\b.{0,400}\.USAGE\b'

- id: ps-irm-pipeline-eval
  desc: IRM response piped to IEX
  crit: suspicious
  conf: 0.97
  mbc: "B0030"
  attack: "T1059.001,T1105"
  # Native binaries frequently embed vendor documentation or installer help
  # containing the canonical Bun `irm|iex` command.  This rule is for script
  # source, where the pipeline is executable code rather than inert PE text.
  for: [vbs, powershell, batch]
  if:
    type: text
    # Do not treat a commented install example as executable code.
    regex: '(?im)^[ \t]*\b(irm|Invoke-RestMethod)\b[^\r\n|]{0,240}\|\s*iex\b'
  unless:
    - id: well-known/lib/ai/unsloth::unsloth-package-context
    - id: well-known/app/productivity/ferronote::ferronote-windows-installer-context
    - id: well-known/app/ai/gateway/ollama::official-install-ps1-url
    # Bun publishes this exact bootstrap as its supported Windows installer.
    - id: micro-behaviors/os/package-manager/install::bun-powershell-piped-installer-command
    # PowerShell comment-based help (.SYNOPSIS/.USAGE) often documents the
    # one-liner used to fetch this same script; that is not fileless execution.
    - id: ps-comment-help-irm-iex
- id: curl-zoom-user-agent-piped-iex--rx-4
  desc: Regex component marker
  crit: component
  conf: 0.96
  if:
    type: text
    substr: ZoomSDK
    case_insensitive: true
  count_max: 1012320
- id: curl-zoom-user-agent-piped-iex--rx-5
