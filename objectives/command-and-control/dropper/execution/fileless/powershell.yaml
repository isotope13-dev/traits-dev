- id: hidden-powershell-getcontent-iex--rx-24
  desc: Regex component marker
  crit: component
  conf: 0.95
  if:
    type: text
    substr: WindowStyle
    case_insensitive: true
  count_max: 1012341
- id: hidden-powershell-getcontent-iex--rx-26
  desc: Regex component marker
  crit: component
