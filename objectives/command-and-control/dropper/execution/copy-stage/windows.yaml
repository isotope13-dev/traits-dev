# Unsigned PEs that copy a file, write registry, and create a process are
# stagers, not installers: the copy-plus-spawn is the drop, the registry
# write is persistence or config.
defaults:
  platforms: [windows]
  for: [pe]
  attack: T1105,T1059,T1112
  crit: hostile
  conf: 0.93

composite_rules:
  - id: unsigned-copyfile-exec
    desc: Unsigned file copier creates a process
    crit: suspicious
    conf: 0.8
    all:
      - id: micro-behaviors/fs/file/copy::copyfile-a
      - id: micro-behaviors/process/create/spawn::create-process-a
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/installer/family/
      - id: metadata/binary/installer/script::nsis
      - id: well-known/tool/packaging/inno-setup::inno-setup-compiler
      - id: well-known/tool/packaging/inno-setup::inno-setup-preprocessor
      - id: well-known/lib/
      - id: well-known/tool/reverse-engineering/exiftool::exiftool-windows-binary
      - id: well-known/tool/reverse-engineering/exiftool::perl-win32-copyfile-extension

  - id: unsigned-copyfile-registry
    desc: Unsigned file copier writes registry keys
    crit: suspicious
    conf: 0.8
    all:
      - id: micro-behaviors/fs/file/copy::copyfile-a
      - id: micro-behaviors/os/registry/manipulate::registry-write-api-chain
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/installer/family/
      - id: well-known/tool/packaging/inno-setup::inno-setup-compiler
      - id: well-known/tool/packaging/inno-setup::inno-setup-preprocessor
      - id: well-known/lib/

  - id: unsigned-exec-registry
    desc: Unsigned process creator writes registry keys
    crit: suspicious
    conf: 0.8
    all:
      - id: micro-behaviors/process/create/spawn::create-process-a
      - id: micro-behaviors/os/registry/manipulate::registry-write-api-chain
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/installer/family/
      - id: well-known/tool/packaging/inno-setup::inno-setup-compiler
      - id: well-known/tool/packaging/inno-setup::inno-setup-preprocessor
      - id: well-known/lib/

  - id: unsigned-copyfile-runkey
    desc: Unsigned file copier writes a Run key
    attack: T1105,T1547.001
    all:
      - id: micro-behaviors/fs/file/copy::copyfile-a
      - id: micro-behaviors/os/registry/keys::currentversion-run
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/installer/family/
      - id: well-known/tool/packaging/inno-setup::inno-setup-compiler
      - id: well-known/tool/packaging/inno-setup::inno-setup-preprocessor
      - id: well-known/lib/

  - id: unsigned-copyfile-http-post
    desc: Unsigned file copier posts over HTTP
    attack: T1105,T1071.001
    all:
      - id: micro-behaviors/fs/file/copy::copyfile-a
      - id: micro-behaviors/communications/http/post::native-post-request-line
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/installer/family/
      - id: well-known/tool/packaging/inno-setup::inno-setup-compiler
      - id: well-known/tool/packaging/inno-setup::inno-setup-preprocessor
      - id: well-known/lib/
