defaults:
  platforms: [windows]
  for: [vbs, html]
  attack: T1218.005
  mbc: E1059
traits:
  - id: cloudflare-tunnel-url
    desc: trycloudflare tunnel URL
    crit: suspicious
    conf: 0.9
    if:
      type: text
      substr: '.tryc" + "loud" + "flare'
  - id: epub-hta-stage-url
    desc: Remote epub HTA stage URL
    crit: suspicious
    conf: 0.9
    if:
      type: text
      substr: '"ep" + "ub"'
  - id: fragmented-mshta-exe
    desc: Fragmented mshta.exe string
    crit: suspicious
    conf: 0.94
    if:
      type: text
      regex: 'm["'']?\s*\+\s*["'']sh["'']?\s*\+\s*["'']ta["'']?\s*\+\s*["'']\.exe'
  - id: wscript-run-variable
    desc: WScript Shell runs variable command
    crit: suspicious
    conf: 0.92
    if:
      type: text
      substr: ").Run causehRK"
  # NOTE: the MSXML `dataType = "bin.base64"` conversion node is a plain
  # Windows-script Base64 codec -- `copy-paste`'s clipboard fallback uses it to
  # ENCODE the clipboard before echoing it. The canonical atom lives in
  # micro-behaviors/data/decode/base64::msxml-datatype-bin-base64 (notable);
  # the loader composites below reference it and supply the dropper context.
  - id: windows-script-adodb-temp-gzip-write
    desc: Windows script writes temporary gzip
    crit: suspicious
    conf: 0.96
    if:
      type: text
      substr: 'oStream.SaveToFile tempZip'
  - id: windows-script-powershell-gzip-decompress
    desc: Windows script PowerShell gzip decoder
    crit: suspicious
    conf: 0.96
    if:
      type: text
      substr: 'IO.Compression.GzipStream'
  - id: windows-script-runs-decoded-temp-batch
    desc: Windows script runs decoded temporary batch
    crit: suspicious
    conf: 0.97
    if:
      type: text
      regex: '(?i)objShell\.Run\s+tempBat'

  - id: hta-computed-activex-object
    desc: HTA computed ActiveXObject ProgID
    crit: suspicious
    conf: 0.95
    for: [html, text, data]
    if:
      type: text
      regex: 'new\s+ActiveXObject\s*\(\s*[A-Za-z_$][A-Za-z0-9_$]{1,40}\s*\('

  - id: hta-open-text-stream
    desc: HTA opens file text stream
    crit: suspicious
    conf: 0.92
    for: [html]
    if:
      type: text
      regex: '\.OpenAsTextStream\s*\('

  - id: hta-create-shortcut-call
    desc: HTA creates Windows shortcut
    crit: component
    conf: 0.94
    for: [html]
    if:
      type: text
      regex: '\.CreateShortcut\s*\('

  - id: hta-shortcut-target-path
    desc: HTA assigns shortcut TargetPath
    crit: suspicious
    conf: 0.93
    for: [html]
    if:
      type: text
      regex: '\.TargetPath\s*='

composite_rules:
  - id: offscreen-obfuscated-wsh-downloader
    desc: Off-screen obfuscated WSH script downloads a file through hidden execution
    crit: hostile
    conf: 0.99
    attack: T1027,T1059.007,T1105,T1564.003
    for: [javascript, html, vbs, text, data]
    near_bytes: 1600
    all:
      - id: objectives/evasion/process/hidden/execution::hta-offscreen-resize
      - id: micro-behaviors/process/interpreter/jscript::activex-object
      - id: objectives/anti-static/obfuscation/string/concat::dense-single-char-concat
      - id: micro-behaviors/os/env/access::wsh-expand-environment-strings-call
      - id: micro-behaviors/communications/http/download/curl::source-curl-output-option
      - id: micro-behaviors/process/create/shell/wsh::hidden-window-run

  - id: wsh-archive-download-execute
    desc: WSH script downloads, extracts, and launches archive contents
    crit: hostile
    conf: 0.99
    attack: T1059.007,T1105,T1140,T1564.003
    for: [javascript, html, vbs, text, data]
    near_bytes: 2400
    all:
      - id: micro-behaviors/os/env/access::wsh-expand-environment-strings-call
      - id: micro-behaviors/communications/http/download/curl::source-curl-output-option
      - id: micro-behaviors/data/archive/extract/tar::js-tar-extract-command
      - id: micro-behaviors/process/daemonize/spawn::start-no-new-window
      - id: micro-behaviors/process/create/shell/wsh::hidden-window-run
      - id: micro-behaviors/fs/path/extension::windows-exe-path-reference

  - id: hta-fso-create-text-file
    desc: HTA application writes text file via FSO
    crit: suspicious
    conf: 0.94
    for: [html]
    all:
      - id: metadata/file/format/markup::hta-application-element
      - id: micro-behaviors/fs/write/content::create-text-file-method-name

  - id: hta-embedded-batch-dropper
    desc: Hidden HTA writes and runs a temporary batch payload
    crit: hostile
    conf: 0.99
    attack: "T1027,T1059.003,T1059.005,T1218.005,T1564.003"
    all:
      - id: objectives/evasion/process/hidden/execution::hidden-hta-window
      - id: hta-fso-create-text-file
      - id: micro-behaviors/fs/write/content::create-text-file-api
      - id: micro-behaviors/process/create/shell/script-host::cmd-exe-c-command
      - id: micro-behaviors/process/create/shell/wsh::hidden-window-run
      - id: objectives/command-and-control/dropper/execution/wsh::wsh-temp-expand

  - id: hta-msxml-dynamic-vbs-loader
    desc: Hidden HTA decodes and executes a VBScript stage
    crit: hostile
    conf: 0.99
    attack: "T1027,T1059.005,T1140,T1218.005"
    all:
      - id: objectives/evasion/process/hidden/execution::hidden-hta-window
      - id: micro-behaviors/data/decode/base64::msxml-node-typed-value
      - id: objectives/execution/interpreter/vbscript/loader::executeglobal-variable

  - id: hta-hex-xor-string-decoder
    desc: HTA hex-pair XOR string decoder
    crit: suspicious
    conf: 0.95
    for: [javascript, html, vbs]
    all:
      - id: metadata/file/format/markup::hta-application-element
      - id: micro-behaviors/data/decode/custom::js-hex-xor-character-decode

  - id: hta-encoded-eval-loader
    desc: HTA hex-XOR decode-and-eval loader
    crit: hostile
    conf: 0.99
    attack: "T1027,T1059.007,T1140"
    for: [javascript, html, vbs]
    all:
      - id: metadata/file/format/markup::hta-application-element
      - id: hta-hex-xor-string-decoder
      - id: micro-behaviors/data/encode/base64::large-string-assignment
      - id: micro-behaviors/process/interpreter/eval/direct::js-eval-variable-text

  - id: hta-mshta-remote-stage
    desc: HTA launches remote mshta stage
    crit: hostile
    conf: 0.98
    all:
      - id: metadata/file/format/markup::hta-application-element
      - id: wscript-run-variable
      - id: fragmented-mshta-exe
    any:
      - id: cloudflare-tunnel-url
      - id: epub-hta-stage-url
  - id: hta-base64-gzip-tempbat-loader
    desc: Hidden HTA decodes gzip payload to a temporary batch file and runs it
    crit: hostile
    conf: 0.99
    all:
      - id: objectives/evasion/process/hidden/execution::hidden-hta-window
      - id: micro-behaviors/data/decode/base64::msxml-datatype-bin-base64
      - id: windows-script-adodb-temp-gzip-write
      - id: windows-script-powershell-gzip-decompress
      - id: windows-script-runs-decoded-temp-batch
    any:
      - id: objectives/evasion/process/hidden/execution::hta-offscreen-resize
      - id: metadata/file/format/markup::hta-application-element
  - id: hta-obfuscated-com-tempbat-loader
    desc: HTA obfuscated COM temp batch loader
    crit: hostile
    conf: 0.98
    all:
      - id: hta-base64-gzip-tempbat-loader
      - id: objectives/command-and-control/dropper/execution/string-reconstruct::obfuscated-wsh-com-dropper

  - id: vbs-base64-gzip-tempbat-loader
    desc: VBScript decodes and runs a hidden Base64 gzip batch payload
    crit: hostile
    conf: 0.99
    for: [vbs]
    all:
      - id: micro-behaviors/data/decode/base64::msxml-datatype-bin-base64
      - id: windows-script-adodb-temp-gzip-write
      - id: windows-script-powershell-gzip-decompress
      - id: windows-script-runs-decoded-temp-batch
      - id: micro-behaviors/process/create/shell/wsh::hidden-window-run

  - id: hta-obfuscated-wscript-file-runner
    desc: HTA writes and runs obfuscated script
    crit: hostile
    conf: 0.99
    all:
      - id: metadata/file/format/markup::hta-application-element
      - id: hta-hex-xor-string-decoder
      - id: hta-computed-activex-object
      - id: hta-fso-create-text-file
      - id: hta-open-text-stream
      - id: micro-behaviors/process/create/shell/wsh::hidden-window-run

  - id: hta-obfuscated-shortcut-persistence
    desc: HTA builds obfuscated shortcut persistence
    crit: hostile
    conf: 0.98
    all:
      - id: metadata/file/format/markup::hta-application-element
      - id: hta-hex-xor-string-decoder
      - id: hta-computed-activex-object
      - id: hta-create-shortcut-call
      - id: hta-shortcut-target-path
      - id: micro-behaviors/os/wsh/file::shortcut-save

  # The loader family is intentionally described by behavior, not by its
  # staging hostname: a hidden HTA launches a hidden WMI process, fetches
  # bytes, decodes them, and reflectively loads a .NET assembly in memory.
  - id: hidden-hta-remote-reflective-loader
    desc: Hidden HTA downloads and reflectively loads .NET payload
    crit: hostile
    conf: 0.99
    attack: "T1059.001,T1047,T1105,T1140,T1620,T1564.003"
    for: [html]
    scope: file
    all:
      - id: objectives/evasion/process/hidden/execution::hidden-hta-window
      - id: objectives/evasion/process/hidden/execution::hta-offscreen-resize
      - id: objectives/execution/wmi::wmi-hidden-variable-process-create
      - id: micro-behaviors/communications/http/client/webclient::webclient-download-data
      - id: micro-behaviors/data/decode/base64::dotnet-frombase64string-text
      - id: micro-behaviors/process/interpreter/reflection/runtime::powershell-appdomain-split-reflected-load
      - id: objectives/command-and-control/dropper/execution/shell-chain::invoke-expression-env-variable

  - id: hta-hidden-layered-script-dropper
    desc: Hidden HTA decodes and runs a staged script payload
    crit: hostile
    conf: 0.99
    attack: T1027,T1059.001,T1059.005,T1218.005,T1564.003
    for: [html, vbs, text, data]
    all:
      - id: objectives/evasion/process/hidden/execution::hidden-hta-window
      - id: objectives/evasion/process/hidden/execution::hta-offscreen-resize
      - id: windows-script-runs-decoded-temp-batch
      - id: micro-behaviors/process/create/shell/wsh::hidden-window-run

  - id: hta-hidden-powershell-decode-stager
    desc: Hidden HTA reconstructs Base64 and launches PowerShell
    crit: hostile
    conf: 0.99
    attack: T1027,T1059.001,T1218.005,T1564.003
    for: [html, vbs, text, data]
    all:
      - id: objectives/evasion/process/hidden/execution::hidden-hta-window
      - id: objectives/evasion/process/hidden/execution::hta-offscreen-resize
      - id: objectives/command-and-control/dropper/execution/wsh::wsh-split-frombase64string
      - id: micro-behaviors/process/create/shell/lang::powershell-keyword
