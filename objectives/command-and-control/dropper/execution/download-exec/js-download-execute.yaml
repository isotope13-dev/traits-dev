defaults:
  platforms: [unix, windows]
  for: [javascript]
composite_rules:
- id: js-download-write-execute
  desc: Downloads payload to disk and executes it
  crit: hostile
  conf: 0.95
  attack: T1105
  mbc: E1105
  all:
  - id: micro-behaviors/communications/ip/literal::external-ipv4-script
  - id: micro-behaviors/fs/write/file/direct::write-file-sync
  - id: micro-behaviors/process/create/shell/bridge::js-exec
# The sibling above requires a disk write, so the fileless form -- keep the
# response in memory and hand it straight to a shell -- scored notable-only: an
# https.get to a hardcoded external IP whose end handler runs `execSync(body)`
# produced 14 findings, none above notable, standalone or appended to a built
# bundle. That is the form a payload appended to an already-bundled dist/ file
# uses, since it needs no dependency and no path on disk.
#
# The *eval* sinks of this shape are already covered and are deliberately not
# repeated here: dropper/delivery/fetch-eval:: response-end-then-eval,
# node-https-eval-loader, and fetch-eval-remote-code own that half. The gap was
# only ever the shell sink -- nothing paired an HTTP client with a child_process
# exec of the response.
- id: js-download-shell-exec-in-memory
  desc: Shell-executes a downloaded payload in memory
  crit: hostile
  conf: 0.95
  attack: T1105
  mbc: E1105
  near_lines: 30
  all:
  - id: micro-behaviors/communications/http/request/client::http-client-usage
  any:
  - id: micro-behaviors/process/create/shell/bridge::js-stream-end-exec-call
  - id: micro-behaviors/process/create/shell/bridge::js-stream-end-exec-template
- id: js-curl-insecure-executable-download-execute
  desc: JavaScript curl download and execute
  crit: hostile
  conf: 0.97
  attack: T1105,T1059.007,T1553.004
  mbc: E1105,C0017
  for: [javascript, typescript]
  near_lines: 45
  all:
  - id: micro-behaviors/communications/http/download/curl::source-curl-insecure-executable-download
  any:
  - id: micro-behaviors/process/create/shell/bridge::js-exec
  - id: micro-behaviors/process/create/shell/bridge::js-exec-wrapper-with-hidden-options
- id: js-obfuscated-com-dropper
  desc: Obfuscated COM stream stages a payload
  crit: hostile
  conf: 0.98
  attack: T1027,T1105,T1106
  mbc: B0032,E1105
  all:
  - id: objectives/anti-static/obfuscation/syntax::js-obfuscated-com-overwrite
  - id: micro-behaviors/fs/write/file/stream::js-adodb-stream-savetofile-dynamic-path
  - id: objectives/anti-static/obfuscation/syntax::js-computed-call-false-argument
- id: js-tls-bypass-c2-fetch
  desc: TLS verification bypass while downloading and executing a payload
  crit: hostile
  conf: 0.95
  attack: T1553.004
  all:
  - id: micro-behaviors/communications/socket/ssl::node-tls-verification-env-disable
  - id: micro-behaviors/fs/write/file/direct::write-file-sync
  - id: micro-behaviors/process/create/shell/bridge::js-exec
  any:
  - id: micro-behaviors/communications/ip/literal::external-ipv4-script
  - id: micro-behaviors/communications/ip/literal::http-ip-url
  - id: micro-behaviors/communications/http/url/cloud::alibaba-oss-executable-url
  unless:
  - id: well-known/app/media/mastergo::mastergo-application-context
  - id: well-known/app/development/codewhale::codewhale-application-context
