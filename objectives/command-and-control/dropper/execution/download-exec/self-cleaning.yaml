# Fetch a script into the temp directory, run it, delete it — one command line,
# chained with `&&` so each step only happens if the last one worked.
#
# Each third of that is unremarkable alone. Downloading to temp is what
# installers do; running a batch file is what batch files are for; deleting a
# temp file is tidy. Together they describe a stage that is designed to leave
# nothing: the payload never had a permanent path, the process that ran it is
# gone, and the only artifact was removed by the same command that created it.
# An investigator arriving afterwards has the URL and nothing else — and the URL
# serves whatever the operator wants it to serve next.
#
# This is why the deletion leg is required rather than merely welcome. A
# download-and-run without it leaves the second stage on disk, where an
# on-access scanner or an incident responder can still reach it; adding the
# delete is a decision about who gets to see what ran.
#
# Composed from capability atoms rather than the command string, so it holds
# for `certutil -urlcache`, `bitsadmin`, an `Invoke-WebRequest -OutFile`, or a
# Node fetch that writes the file itself — the shape is the durable part.
defaults:
  platforms: [windows]
  for: [scripts, source]
  attack: T1105,T1059.003,T1070.004
  mbc: B0024,E1105

composite_rules:
  - id: temp-script-fetch-run-delete
    desc: Fetches, runs and deletes a temp script
    crit: hostile
    conf: 0.95
    all:
      - id: objectives/evasion/indicator-removal/cleanup::quiet-delete-temp-script
      - id: micro-behaviors/fs/path/location::temporary-batch-path-reference
      - id: micro-behaviors/process/create/shell/bridge::child-process-require
    needs: 1
    any:
      - id: micro-behaviors/communications/http/download/curl::curl-output-file
      - id: micro-behaviors/communications/http/download/cli::fetch-output-flag-script
