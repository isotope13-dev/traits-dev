# Hidden batch bootstrap that decodes a decimal URL, retrieves an MSI, and
# installs it.  This is the script-side execution stage of a web lure; the
# URL, filename, and hosting service are intentionally not part of the match.
# ATT&CK: T1027 (Obfuscated Files or Information), T1059.001 (PowerShell),
# T1105 (Ingress Tool Transfer), T1218.007 (Msiexec)
defaults:
  platforms: [windows]
  for: [batch]
  attack: T1027,T1059.001,T1105,T1218.007
  mbc: B0030

composite_rules:
  - id: hidden-decimal-url-msi-dropper
    desc: Hidden batch decodes a decimal URL, downloads an MSI, and installs it
    crit: hostile
    conf: 0.99
    all:
      - id: micro-behaviors/data/decode/char-code/decimal-triplet::powershell-decimal-triplet-ascii-decode
      - id: micro-behaviors/communications/http/download/cli::iwr-outfile-download
      - id: micro-behaviors/process/create/installer::msiexec-package-verb
      - id: micro-behaviors/process/create/hidden::powershell-windowstyle-hidden
    any:
      - id: micro-behaviors/process/create/flags::powershell-policy-bypass-flag
      - id: micro-behaviors/os/privilege/elevation::runas-verb
    needs: 1
    near_lines: 12

  - id: elevated-hidden-msi-download-chain
    desc: Hidden policy-bypassed PowerShell requests elevation for an MSI install
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/communications/http/download/cli::iwr-outfile-download
      - id: micro-behaviors/process/create/installer::msiexec-package-verb
      - id: micro-behaviors/process/create/flags::powershell-policy-bypass-flag
      - id: micro-behaviors/os/privilege/elevation::runas-verb
    any:
      - id: micro-behaviors/process/create/hidden::powershell-windowstyle-hidden
      - id: micro-behaviors/data/decode/char-code/decimal-triplet::powershell-decimal-triplet-ascii-decode
    needs: 1
    near_lines: 12
