defaults:
  platforms: [windows]
  for: [pe, dll]

composite_rules:
  # These file-wide capabilities are common to legitimate updaters and do not
  # establish that the same downloaded object is launched and then deleted.
  - id: urlmon-download-exec-file-io-cluster
    desc: Windows binary combines URLMon download, process launch, and file I/O
    crit: suspicious
    conf: 0.9
    attack: T1105
    all:
      - id: micro-behaviors/communications/http/get::url-download-to-file-str
      - id: micro-behaviors/process/create/spawn::create-process-w
      - id: micro-behaviors/fs/file/write/direct::write-file
      - id: micro-behaviors/fs/file/delete::deletefile-w
      - id: micro-behaviors/communications/http/url/domain::http-url-binary
    unless:
      - id: well-known/app/utility/360-file-guard::360-file-guard-identity

  - id: urlmon-obfuscated-download-exec
    desc: XOR-obfuscated Windows download-and-execute chain
    crit: hostile
    conf: 0.98
    attack: T1027.002
    all:
      - id: micro-behaviors/communications/http/get::url-download-to-file-str
      - id: micro-behaviors/process/create/spawn::create-process-w
      - id: micro-behaviors/communications/http/url/domain::xor-decoded-http-url
      - id: micro-behaviors/communications/http/url/domain::http-url-binary
