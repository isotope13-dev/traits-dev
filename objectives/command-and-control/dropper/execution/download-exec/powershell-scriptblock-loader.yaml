defaults:
  platforms: [windows]
  for: [powershell]
  attack: T1105
  mbc: B0030

composite_rules:
  - id: powershell-webclient-scriptblock-loader
    desc: PowerShell downloads text and invokes it as a ScriptBlock
    crit: hostile
    conf: 0.99
    all:
      - id: micro-behaviors/communications/http/client/managed::webclient
      - id: micro-behaviors/communications/http/client/managed::downloadstring
      - id: micro-behaviors/process/interpreter/eval/direct::powershell-scriptblock-constructor-text
      - id: micro-behaviors/process/interpreter/eval/direct::powershell-variable-call-operator
    near_lines: 24

  - id: powershell-scriptblock-temp-task-stage
    desc: PowerShell ScriptBlock loader persists through a TEMP scheduled task
    crit: hostile
    conf: 0.99
    attack: T1053.005
    all:
      - id: powershell-webclient-scriptblock-loader
      - id: objectives/persistence/login/scheduled-task/path::schtasks-action-temp-path
      - id: micro-behaviors/os/autorun/scheduled::scheduled-task-registration
    near_bytes: 8192
