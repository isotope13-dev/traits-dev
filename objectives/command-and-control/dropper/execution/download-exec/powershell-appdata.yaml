defaults:
  platforms: [windows]
  for: [powershell]
  attack: T1059.001,T1105,T1204.002
  mbc: B0030

composite_rules:
  - id: powershell-appdata-download-execute
    desc: PowerShell downloads and launches an executable from AppData
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/communications/http/download/cli::iwr-outfile-download
      - id: micro-behaviors/fs/path/application/executable::appdata-exe-path
      - id: micro-behaviors/process/create/start-process::start-process-call
    near_lines: 10
  - id: embedded-hidden-powershell-appdata-download-execute
    desc: Embedded hidden PowerShell downloads and launches AppData EXE
    crit: hostile
    conf: 0.99
    for: [pe, csharp, batch, javascript, vbs]
    attack: T1059.001,T1105,T1204.002,T1564.003
    all:
      - id: micro-behaviors/communications/http/download/cli::iwr-outfile-download
      - id: micro-behaviors/fs/path/application/executable::appdata-exe-path
      - id: micro-behaviors/process/create/start-process::start-process-filepath
      - id: objectives/evasion/process/hidden/execution::ps-double-hidden-window
    near_bytes: 512
