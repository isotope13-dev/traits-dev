defaults:
  platforms: [macos]
  for: [macho]
  attack: T1059.004
  mbc: B0022

# Every behavioural leg below is a bare libSystem import (system, fscanf,
# unlink, fork/setsid). A language runtime imports that exact set because it
# re-exports it to the code it hosts -- CPython's os/subprocess modules are
# built on it -- and delocate/auditwheel re-sign the dylibs they vendor
# ad-hoc, so a repaired Python wheel satisfies the signing leg too. The
# runtime identities are excluded rather than the dropper legs loosened.
composite_rules:
  - id: obfuscated-shell-dropper
    desc: Obfuscated shell dropper with cleanup
    crit: suspicious
    conf: 0.94
    all:
      - id: metadata/signed/trust-level::adhoc
      - id: micro-behaviors/process/create/shell/spawn::system-fn
      - id: micro-behaviors/fs/file/read::fscanf
      - id: micro-behaviors/fs/file/delete::delete-comp
    any:
      - id: micro-behaviors/crypto/symmetric/xor/arm64
      - id: objectives/anti-static/obfuscation/payload/encrypted::high-entropy-const
    unless:
      - id: well-known/lib/runtime/cpython::cpython-macos-runtime-library
  - id: daemonized-shell-dropper
    desc: Daemonized shell dropper with cleanup
    crit: suspicious
    conf: 0.95
    all:
      - id: metadata/signed/trust-level::adhoc
      - id: micro-behaviors/process/create/shell/spawn::system-fn
      - id: micro-behaviors/fs/file/read::fscanf
      - id: micro-behaviors/fs/file/delete::delete-comp
      - id: micro-behaviors/process/daemonize/detach::fork-new-session
    unless:
      - id: well-known/lib/runtime/cpython::cpython-macos-runtime-library
  - id: sparse-daemon-shell-dropper
    desc: String-sparse daemonized shell dropper
    crit: hostile
    conf: 0.97
    all:
      - id: daemonized-shell-dropper
      - id: objectives/anti-static/obfuscation/control-flow/native::sparse-strings
