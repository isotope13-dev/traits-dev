# Telegram Bot API pull channels that execute operator-supplied attachments
# after adding a Microsoft Defender path exclusion. Bot tokens, chat IDs,
# filenames, and staging paths are deliberately absent: the durable behavior is
# remote attachment execution paired with an antivirus exclusion mutation.
defaults:
  platforms: [windows]
  for: [binaries, scripts, source]
  attack: T1102.002,T1105,T1059,T1562.001
  mbc: B0022,B0030

composite_rules:
  - id: defender-excluded-telegram-attachment-loader
    desc: Telegram attachment loader adds a Defender path exclusion
    crit: hostile
    conf: 0.995
    near_bytes: 16384
    all:
      - id: objectives/command-and-control/backdoor/control/telegram::telegram-polled-attachment-execution
      - id: micro-behaviors/os/security/defender::defender-exclusion-command
