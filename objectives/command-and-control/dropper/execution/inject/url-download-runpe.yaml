# Commodity loader shape: pull the second stage over HTTP with the URLMon
# one-call download helper, then run it by hollowing a freshly spawned process
# instead of executing the dropped file directly. Keeping the payload off the
# process tree (it runs as the host image, not as the downloaded file) is the
# whole point of pairing the two.
#
# The download alone is a neutral capability and the hollowing primitives alone
# are covered by objectives/evasion/process/injection/; this rule is the
# delivery-to-execution join, which is what makes it a dropper.
defaults:
  for: [pe, dll]
  platforms: [windows]
  attack: T1105,T1055.012
  mbc: E1105,E1055.012

composite_rules:
  - id: url-download-to-hollowed-process
    desc: Downloaded payload executed by process hollowing
    crit: hostile
    conf: 0.96
    # Prefer evidence from one analyzed leaf. The exclusions below also cover
    # infectors whose root byte stream contains several appended PE images.
    scope: leaf
    all:
      - id: micro-behaviors/communications/http/get::url-download-to-file
      - id: micro-behaviors/process/create/launch::create-process-api-name
      - id: micro-behaviors/process/inject/runtime/call::write-process-memory-dup
      - id: objectives/evasion/process/injection/hollowing::thread-context-apis
    any:
      # Any one of these completes the write-into-a-suspended-host sequence, or
      # shows the fetch being scrubbed from the local WinInet cache afterwards.
      - id: micro-behaviors/mem/alloc/remote::virtual-alloc-ex-dup
      - id: micro-behaviors/process/info/thread::resume-thread
      - id: micro-behaviors/communications/http/get::delete-url-cache-entry
    unless:
      - id: metadata/signed/platform/
      - id: well-known/tool/reverse-engineering/
      - id: metadata/binary/metrics/threshold::many-exports-200
      - id: well-known/app/system/iobit::advanced-systemcare-component-context
      # File infectors append complete unrelated programs. Their combined raw
      # bytes can otherwise supply every downloader/hollowing API independently.
      - id: objectives/impact/infect/binary/rewrite::repeated-standard-pe-overlay-infector
      - id: objectives/impact/infect/binary/rewrite::self-copying-repeated-pe-image-stack
