defaults:
  platforms: [windows]
  for: [powershell]
  attack: T1055.012,T1620
  mbc: B0009.014
traits:
  - id: ps-byte-payload-invokemember
    desc: PowerShell InvokeMember byte payload dispatch
    crit: suspicious
    conf: 0.95
    if:
      type: text
      regex: '(?is)InvokeMember\(.{0,260}\[byte\[\]\]\$[A-Za-z0-9_.$]+PayloadBytes.{0,160}TargetProcess'
  - id: ps-reflected-resumethread
    desc: PowerShell reflectively resumes remote thread
    crit: suspicious
    conf: 0.9
    if:
      type: text
      regex: '(?is)InvokeMember\([''"]ResumeThread[''"]'
composite_rules:
  - id: ps-managed-injection-target-marker
    desc: PowerShell managed injection target marker
    crit: suspicious
    conf: 0.94
    any:
      # The host binary is named by its runtime-directory path; MSBuild is only
      # the best-known member of that directory, not the whole technique.
      - id: micro-behaviors/process/create/runtime-host::dotnet-framework-runtime-exe-path
      - id: ps-reflected-resumethread
  - id: ps-encrypted-managed-payload-injector
    desc: PowerShell decrypts managed payload and injects into MSBuild
    crit: hostile
    conf: 0.99
    all:
      - id: micro-behaviors/process/interpreter/reflection/runtime::powershell-appdomain-reflected-load-invoke
      - id: ps-byte-payload-invokemember
      - id: ps-managed-injection-target-marker
    any:
      - id: objectives/command-and-control/dropper/staging/encrypted::ps-aes-inline-payload
      - id: objectives/command-and-control/dropper/staging/encrypted::ps-base32-aes-embedded-stage

  # In-memory helper assembly + an embedded PE + the path of a signed .NET
  # runtime binary: the three arguments of managed process hollowing, where the
  # framework executable is only ever the sacrificial host. No build or deploy
  # script hands a PE byte array to a reflected method.
  - id: ps-reflected-loader-hollows-dotnet-runtime-host
    desc: Reflected loader injects PE into .NET runtime host
    crit: hostile
    conf: 0.98
    attack: T1055.012,T1620,T1218
    all:
      - id: micro-behaviors/process/interpreter/reflection/runtime::powershell-assembly-method-invoke
      - id: micro-behaviors/process/create/runtime-host::dotnet-framework-runtime-exe-path
      - id: micro-behaviors/data/embedded/payload/array::decimal-mz-dos-header-array
