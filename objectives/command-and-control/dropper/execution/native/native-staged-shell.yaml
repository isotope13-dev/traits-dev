defaults:
  platforms: [windows]
  for: [pe, dll]

composite_rules:
  - id: staged-native-loader-with-command-shell
    desc: Native staged PE loader with WinHTTP and cmd.exe /c
    crit: hostile
    conf: 0.99
    attack: T1059.003,T1105,T1620
    all:
      - id: objectives/command-and-control/dropper/staging/encrypted::capi-inline-pe-memory-loader
      - id: micro-behaviors/communications/http/client/winhttp::winhttp-downloader-flow-text
      - id: micro-behaviors/process/create/shell/script-host::cmd-exe-c-command
      - id: micro-behaviors/process/create/shell/spawn::system-fn
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/installer/family/
      - id: well-known/app/
      - id: well-known/lib/
      - id: well-known/tool/
