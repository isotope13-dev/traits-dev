defaults:
  for: [elf]
  platforms: [linux]
  crit: hostile
  conf: 0.99
  attack: T1105,T1059.004

composite_rules:
  - id: static-hidden-temp-stage-execution
    desc: Static loader executes hidden temp stage
    all:
      - id: objectives/command-and-control/dropper/staging/encrypted::hidden-temp-stage-file-trio
      - id: micro-behaviors/process/create/execv::static-execl-symbol-text
      - id: micro-behaviors/process/create/execv::syscall-execve-elf
      - id: metadata/binary/linking/static::static-linked
