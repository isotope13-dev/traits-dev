# Source-level native module staging. The proximity constraint distinguishes an
# implementation from SDK and portability headers that merely collect unrelated
# Win32 wrappers in one file.
defaults:
  platforms: [windows]
  for: [c, cpp]
  attack: T1129

composite_rules:
  - id: native-modular-temp-plugin-loader
    desc: Nearby temp lookup, file write, library load, and export resolution
    crit: suspicious
    conf: 0.92
    all:
      - id: micro-behaviors/fs/temp/directory::get-temp-path-source-call
      - id: micro-behaviors/fs/file/write/direct::write-file-source
      - id: micro-behaviors/dylib/load/source::load-library-a-source
      - id: micro-behaviors/os/module/load::get-proc-address-source-call
    near_lines: 40
