defaults:
  attack: "T1027.013,T1059.001,T1140"
  platforms: [windows]
  for: [batch]

traits:
  - id: powershell-reads-own-batch-content
    desc: PowerShell reads the enclosing batch script
    crit: component
    conf: 0.96
    if:
      type: text
      regex: '(?i)Get-Content[^\r\n]{0,120}(%SELF%|%~f0|%0)[^\r\n]{0,80}-Raw'

composite_rules:
  - id: self-extracting-gzip-powershell-stage
    desc: Batch extracts an embedded gzip PowerShell stage
    crit: hostile
    conf: 0.99
    all:
      - id: powershell-reads-own-batch-content
      - id: micro-behaviors/data/encode/payload::batch-gzip-base64-carrier
      - id: micro-behaviors/data/decode/base64::dotnet-frombase64string-text
      - id: micro-behaviors/data/compress/library::powershell-gzipstream
      - id: micro-behaviors/data/compress/library::powershell-data-compressionmode-decompress
      - id: micro-behaviors/fs/write/file/binary::embedded-powershell-base64-write-all-bytes
