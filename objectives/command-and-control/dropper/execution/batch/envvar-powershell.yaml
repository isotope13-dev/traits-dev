defaults:
  attack: "T1027, T1059.001, T1105"
  platforms: [windows]
  for: [batch]

traits:
  - id: short-env-cmd-fragments
    desc: Short envvar cmd fragments
    crit: component
    conf: 0.9
    if:
      type: text
      regex: '(?i)%![A-Z0-9]%m\^%![A-Z0-9]%'

  - id: short-env-powershell-fragments
    desc: Short envvar PowerShell fragments
    crit: component
    conf: 0.9
    if:
      type: text
      regex: '(?i)o\^w\^%![A-Z0-9]%r\^sh'

  - id: short-env-downloadstring
    desc: Short envvar DownloadString
    crit: suspicious
    conf: 0.94
    if:
      type: text
      regex: '(?i)oa\^%![A-Z0-9]%S\^tri\^%![A-Z0-9]%'

  - id: short-env-iex
    desc: Short envvar IEX fragment
    crit: component
    conf: 0.9
    if:
      type: text
      regex: '(?i)\^I\^%![A-Z0-9]%X\^'

  - id: batch-ps1-url-assignment
    desc: Batch assigns PS1 URL
    crit: suspicious
    conf: 0.94
    if:
      type: text
      regex: '(?i)set\s+[A-Z0-9_!]{4,}\s*=\s*''?https?://.{1,60}\.Ps1''?'
  - id: batch-delayed-expansion-web-download
    desc: Delayed-expansion batch hides a PowerShell web download
    crit: suspicious
    conf: 0.95
    if:
      # Some Windows batch files carry only a BOM and are otherwise bytewise
      # text; the text extractor can discard those bytes. Raw matching keeps
      # the downloader visible in that encoding too.
      type: raw
      regex: '(?is)enabledelayedexpansion.{0,600}(Invoke-WebRequest|DownloadString|WebClient).{0,240}https?://'
  - id: batch-delayed-expansion-archive-launch
    desc: Delayed-expansion batch extracts and launches a downloaded archive
    crit: suspicious
    conf: 0.96
    if:
      type: raw
      regex: '(?is)enabledelayedexpansion.{0,900}(Expand-Archive|tar\s+[-/])[s\S]{0,240}\bstart\s+[^\r\n]{1,120}\.exe\b'
  - id: batch-powershell-webrequest-hex
    desc: Batch contains a PowerShell web request command
    crit: suspicious
    conf: 0.94
    if:
      type: hex
      pattern: "49 6e 76 6f 6b 65 2d 57 65 62 52 65 71 75 65 73 74"
  - id: batch-expand-archive-hex
    desc: Batch extracts a downloaded archive
    crit: suspicious
    conf: 0.94
    if:
      type: hex
      pattern: "45 78 70 61 6e 64 2d 41 72 63 68 69 76 65"
  - id: batch-start-executable-hex
    desc: Batch starts an executable payload
    crit: suspicious
    conf: 0.94
    if:
      type: hex
      pattern: "73 74 61 72 74 20 54 61 2e 65 78 65"

composite_rules:
  - id: short-envvar-powershell-downloadstring
    desc: Short-envvar PowerShell stager
    crit: hostile
    conf: 0.97
    all:
      - id: short-env-cmd-fragments
      - id: short-env-powershell-fragments
      - id: short-env-downloadstring
      - id: short-env-iex
      - id: batch-ps1-url-assignment
  - id: batch-delayed-expansion-downloader
    desc: Obfuscated delayed-expansion PowerShell downloader
    crit: hostile
    conf: 0.98
    all:
      - id: batch-delayed-expansion-web-download
      - id: batch-delayed-expansion-archive-launch
  - id: batch-webrequest-archive-executable-dropper
    desc: Batch downloads, extracts, and launches an executable payload
    crit: hostile
    conf: 0.97
    all:
      - id: batch-powershell-webrequest-hex
      - id: batch-expand-archive-hex
      - id: batch-start-executable-hex
