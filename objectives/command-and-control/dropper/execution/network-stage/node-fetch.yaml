  - id: metadata/build/recognized-contexts::benign-build-tooling-context
- id: bom-temp-write
  desc: BOM temp script write
  crit: suspicious
  conf: 0.9
  if:
    type: text
    regex: "\\[[^\\]]{1,80}\\]\\s*\\([^,]{1,160},\\s*['\"]\\\\uFEFF['\"]\\s*\\+"
- id: timeout-bracket-delete
  desc: setTimeout bracketed call
  crit: component
