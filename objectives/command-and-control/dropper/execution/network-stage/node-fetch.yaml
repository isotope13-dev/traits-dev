# A hidden detached child that is launched from a shuffled/obfuscated module
# and fingerprints the host is a staged dropper shape.  Requiring both the
# host MAC read and child-process import keeps ordinary obfuscated libraries,
# normal detached helpers, and standalone inventory code out of this finding.
- id: obfuscated-detached-host-fingerprint-stage
  desc: Obfuscated detached child fingerprints the host
  crit: hostile
  conf: 0.98
  attack: T1027,T1059.007,T1082,T1564.003
  all:
  - id: objectives/anti-static/obfuscation/obfuscator/js-obfuscator::push-shift-bracket-pattern
  - id: micro-behaviors/process/create/spawn-minified::node-obfuscated-detached-stdio-options
  - id: micro-behaviors/process/create/spawn::windowshide-obfuscated-true
  - id: micro-behaviors/os/module/dynamic-load::node-computed-require-call
  - id: micro-behaviors/os/network/interface::node-mac-address-property
  unless:
  - id: metadata/package/testing/
