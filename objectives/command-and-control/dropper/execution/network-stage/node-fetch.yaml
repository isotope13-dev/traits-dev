composite_rules:
- id: obfuscated-detached-network-stage
  desc: Obfuscated Node code detaches a hidden runtime stage
  crit: hostile
  conf: 0.98
  attack: T1027,T1059.007,T1564.003
  all:
  - id: micro-behaviors/process/create/spawn-minified::node-obfuscated-detached-stdio-options
  - id: micro-behaviors/process/create/spawn::windowshide-obfuscated-true
  - id: objectives/anti-static/obfuscation/string/dynamic::arithmetic-decoder-wrapper-call
  - id: micro-behaviors/os/module/dynamic-load::node-computed-require-call
  unless:
  - id: metadata/package/testing/

# Detached hidden spawn with computed require is the common post-decode
# staging pattern in packed npm droppers (child_process options stay as
# string-table hits; module names are rebuilt). Distinct from the
# arithmetic-decoder leg above so decoder-less obfuscator.io packs still
# surface as hostile C2 staging.
- id: obfuscated-detached-computed-require-stage
  desc: Obfuscated Node stage spawns a hidden detached child via computed require
  crit: hostile
  conf: 0.97
  attack: T1027,T1059.007,T1564.003
  all:
  - id: micro-behaviors/process/create/spawn-minified::node-obfuscated-detached-stdio-options
  - id: micro-behaviors/process/create/spawn::windowshide-obfuscated-true
  - id: micro-behaviors/os/module/dynamic-load::node-computed-require-call
  - id: objectives/anti-static/obfuscation/obfuscator/js-obfuscator::push-shift-bracket-pattern
  unless:
  - id: metadata/package/testing/

- id: wallet-targeted-obfuscated-process-dropper
  desc: Obfuscated JavaScript targets wallets and exits via process control
  crit: hostile
  conf: 0.98
  attack: "T1027,T1059.007,T1555.003"
  mbc: B0028
  all:
  - id: objectives/credential-access/wallet/extension::multi-wallet-targeting
  - id: micro-behaviors/process/exit/terminate::process-exit
  - id: objectives/anti-static/obfuscation/obfuscator/js-obfuscator::hex-name-mangling-with-string-table-rotation
  # Do not suppress on weak @metamask package-scope substrings that stealers
  # also decode; only skip genuine extension packaging markers.
  unless:
  - id: well-known/app/browser-extension/metamask::crx-member
  - id: well-known/app/browser-extension/metamask::official-manifest
  - id: well-known/app/browser-extension/metamask::lavamoat-webpack
  - id: well-known/app/browser-extension/lastpass::crx-member
- id: npm-postinstall-staged-native-launch
  desc: npm package launches a native stage after remote install-time staging
  crit: hostile
  conf: 0.97
  for: [javascript, typescript, npm, archives]
  attack: "T1195.002,T1059.007,T1105"
  scope: archive
  # The lifecycle declaration belongs to package.json, so this rule remains
  # archive-scoped.  Keep the fetch/write/chmod/spawn chain file-scoped: an
  # npm package can legitimately contain those operations in unrelated
  # runtime, cache, or native-wrapper files.
  all:
  - id: objectives/supply-chain/install-hook/scripts/lifecycle::postinstall-hook-declaration
  - id: same-file-remote-native-stage
  unless:
  - id: micro-behaviors/os/service/legitimate::npm-native-binary-wrapper
  - id: well-known/app/publishing/decocms/
  - id: metadata/package/files/dependency::node-modules-path
- id: same-file-remote-native-stage
  desc: JavaScript fetches, enables, and launches a native stage
  crit: suspicious
  conf: 0.96
  scope: file
  # "Same file" was the only bound, which in a large module means "somewhere in
  # 135KB". ArchiveBox's chrome_utils.js has the fetch at line 3246, the write at
  # 253, the chmod at 257 and the spawn at 1140 -- four unrelated operations in a
  # browser-automation utility, not a stage. A real fetch->write->chmod->spawn
  # dropper writes those four steps as one block, so require them to sit together.
  near_bytes: 2048
  unless:
  - id: metadata/package/testing/
  all:
  - id: micro-behaviors/communications/http/request/client::js-fetch-call
  - id: micro-behaviors/fs/file/write/direct::node-write-file-sync-call
  - id: micro-behaviors/fs/chmod/executable/mode::node-chmod-exec-mode-755
  - id: micro-behaviors/process/create/spawn::spawn-call
- id: spawn-node
  desc: Spawn node inline or temp stage
  crit: notable
  conf: 0.88
  near_bytes: 256
  all:
  - id: micro-behaviors/process/create/spawn::spawn-call
  - id: call-arg-node-string
  any:
  - id: micro-behaviors/process/create/inline-script::spawn-node-eval
  - id: micro-behaviors/process/create/inline-script::spawn-node-eval-var
  - id: micro-behaviors/fs/path/temp::js-path-under-tmp
  unless:
  - id: metadata/package/testing/
  - id: metadata/package/testing/presence/manifest::test-fixtures
  - id: metadata/package/testing/presence/fixture::test-filename-pattern
  - id: metadata/package/testing/presence/harness/
  - id: metadata/library/structure::js-large-module-bundle
- id: date-temp-write-delete
  desc: Dated temp write-delete
  crit: suspicious
  conf: 0.92
  all:
  - id: micro-behaviors/data/source/property/computed::js-computed-date-method-call
  - id: bom-temp-write
  - id: timeout-bracket-delete
- id: admzip-extract-spawn-exit
  desc: AdmZip extract-spawn-exit
  crit: suspicious
  conf: 0.92
  all:
  - id: dynamic-new-archive
  - id: objectives/anti-static/obfuscation/syntax::obfuscated-true-call-argument
  - id: micro-behaviors/process/exit/terminate::process-exit
  - id: micro-behaviors/data/archive/library::adm-zip-lib
# The atom is now micro-behaviors/fs/path/temp::js-path-under-tmp -- it only
# recognizes a path literal, which is a filesystem capability, not a staging
# objective. Pairing it with the entirely generic node-process-launch-call made
# "mentions a /tmp/*.js path somewhere and launches a process somewhere" read as
# a network-stage dropper, which is what any sandbox runtime, test runner, or
# build tool does. Staging means the script is WRITTEN and then run, so the
# write leg is now required and the randomized-filename tell stays as the
# alternative route.
- id: temp-js-stage-and-run
  desc: Writes a JavaScript file under tmp and launches it
  crit: suspicious
  conf: 0.8
  # Bind the path, write, and launch into one staging block. Large local
  # servers often contain a /tmp fixture path, unrelated file writes, and
  # process launches in separate endpoint handlers.
  near_bytes: 2048
  all:
  - id: micro-behaviors/fs/path/temp::js-path-under-tmp
  - id: micro-behaviors/fs/write/file/direct::js-file-write
  any:
  - id: random-temp-filename
  - id: micro-behaviors/process/create/exec::node-process-launch-call
  unless:
  - id: well-known/app/ai/gateway/neurolink::benign-archive-context
  - id: well-known/tool/development/anthropic-claude-agent/
  - id: well-known/app/infrastructure/pulumi::pulumi-source-tree
  - id: metadata/package/quality/benign-context::stacksjs-stx-framework-context
- id: fetch-write-exec
  desc: Fetch and write then execute
  crit: suspicious
  conf: 0.9
  # Keep the three operations in one compact stage. Line proximity alone is
  # ineffective on minified bundles: unrelated report writes, loopback health
  # probes, and local-service launches can all occupy one generated line.
  near_lines: 30
  near_bytes: 2048
  all:
  - id: micro-behaviors/communications/http/request/client::js-fetch-call
  - id: micro-behaviors/fs/write/file/direct::js-file-write
  any:
  - id: micro-behaviors/process/create/system::js-execfile-call
  - id: micro-behaviors/process/create/spawn-variable::spawn-variable-program
  downgrade:
    any:
    - id: micro-behaviors/process/interpreter/vm/
    - id: micro-behaviors/os/service/legitimate::npm-native-binary-wrapper-postinstall
    - id: micro-behaviors/os/service/legitimate::npm-native-binary-wrapper-platform-bin-postinstall
  unless:
  - id: auto-retry-helper
  - id: metadata/library/nodeunit/
  - id: well-known/tool/detection/codetotal::codetotal-local-docker-runner
  - id: well-known/app/infrastructure/netlify::official-js-github-release-bootstrap
  - id: well-known/lib/platform/browser-automation::puppeteer-archive-context
  - id: well-known/lib/platform/browser-automation::chromium-bisect-builds-helper
- id: fetch-write-exec-delete
  desc: Nearby JavaScript fetch/write/execute/delete sequence
  crit: notable
  conf: 0.92
  # Require both source-line and byte proximity. Minified application bundles
  # otherwise collapse unrelated HTTP requests, report writes, service starts,
  # and cleanup into a single line that resembles a payload stage.
  near_lines: 40
  near_bytes: 2048
  all:
  - id: micro-behaviors/communications/http/request/client::js-fetch-call
  - id: micro-behaviors/fs/write/file/direct::js-file-write
  - id: micro-behaviors/fs/file/delete/
  any:
  - id: micro-behaviors/process/create/system::js-execfile-call
  - id: micro-behaviors/process/create/spawn-variable::spawn-variable-program
  unless:
  - id: well-known/tool/development/anthropic-claude-agent/
  - id: well-known/app/infrastructure/pulumi::pulumi-source-tree
- id: package-temp-response-exec-delete
  desc: Package fetches and executes a deleted temp response
  crit: hostile
  conf: 0.99
  attack: T1105,T1059.007,T1195.002,T1070.004
  scope: archive
  near_bytes: 8192
  all:
  - id: micro-behaviors/communications/http/request/client::js-fetch-call
  - id: micro-behaviors/fs/file/write/async::node-write-file-promise
  - id: micro-behaviors/process/create/shell/bridge::js-exec
  - id: micro-behaviors/fs/file/delete::node-fs-promises-unlink
  - id: micro-behaviors/fs/path/temp::node-os-tmpdir
  - id: metadata/package/manifest/entrypoint::pkg-main-field
  unless:
  - id: metadata/package/testing/
  - id: well-known/tool/detection/

