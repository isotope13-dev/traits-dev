# A file cryptor that hides even the XOR itself: the keystream byte comes
# from a repeating key indexed with Mod, the XOR is spelled as the boolean
# identity (a Or b) And (Not (a And b)) so no Xor token exists, and the
# re-encrypted bytes go back to disk through a binary Put. One obfuscated
# carrier-file pass that decrypts the next stage in place.
defaults:
  platforms: [windows]
  for: [vbs]
  attack: T1027,T1140

composite_rules:
  - id: vba-boolean-xor-file-cryptor
    desc: VBScript decrypts file bytes with concealed XOR key loop
    crit: hostile
    conf: 0.96
    all:
      - id: micro-behaviors/data/encode/xor::vba-boolean-identity-xor
      - id: objectives/command-and-control/dropper/execution/wsh::wsh-vbs-key-modulo-step
      - id: micro-behaviors/fs/write/file/handle::vb6-put-binary-source
