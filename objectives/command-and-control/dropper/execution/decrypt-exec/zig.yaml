# The byte array itself and XOR operation are neutral. Executing the decoded
# value through cmd.exe is the source-to-sink chain that makes this a loader.
defaults:
  platforms: [windows]
  for: [zig]
  attack: T1027,T1059.003

composite_rules:
  - id: zig-xor-byte-array-command-loader
    desc: Zig XOR-decodes bytes into a shell command
    crit: hostile
    conf: 0.99
    scope: file
    all:
      - id: micro-behaviors/data/embedded/payload/array::zig-hex-byte-array-literal
      - id: micro-behaviors/data/source/arithmetic::source-xor-operation
      - id: micro-behaviors/process/create/shell/command-mode::windows-command-shell-invocation
      - id: micro-behaviors/process/create/direct::zig-child-init
