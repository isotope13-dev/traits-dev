# Node AES decrypt-drop-execute stage.
#
# After AES-decrypting a blob (createDecipheriv), the stub materialises the
# cleartext payload to disk (writeFileSync) and launches it detached with
# stdio ignored and the handle unref'd so the parent can exit — the classic
# decrypt-drop-execute dropper chain. Seen in an Electron main.js posing as a
# document-signing client: it AES-256-CBC-decrypts response.file with
# response.key fetched from a /verify endpoint, drops a randomly named .exe
# into Documents, and runs it via shell.openPath or detached spawn+unref.
# Keyed on the decipher + synchronous file write + fire-and-forget spawn so it
# fires on the disk-staging behaviour, not on in-memory decode or on plain
# download-and-run without the decryption stage.
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
  attack: T1027,T1059.007,T1105
  mbc: B0024
composite_rules:
  - id: node-aes-decrypt-drop-execute
    desc: Node AES-decrypts payload, drops to disk and executes it
    crit: hostile
    conf: 0.97
    near_lines: 80
    all:
      - id: micro-behaviors/crypto/symmetric/aes/runtime-library::createDecipheriv
      - id: micro-behaviors/fs/write/file/full::node-write-file-sync-call
      - id: micro-behaviors/process/create/spawn::detached-ignored-unref-spawn
    unless:
      - id: metadata/package/testing/
