defaults:
  platforms: [windows]
  for: [pe, dll]
  arch: [x86]
  size_max: 524288
  attack: T1027.003,T1620

composite_rules:
  - id: mfc-encrypted-resource-memory-exec
    desc: MFC resource decrypt-and-execute loader
    crit: hostile
    conf: 0.99
    all:
      - id: micro-behaviors/dylib/library/legacy::mfc42-ref
      - id: objectives/anti-static/obfuscation/payload/container::moderately-encoded-rsrc
      - id: micro-behaviors/process/inject/runtime/call::transformed-stack-buffer-dispatch-x86
      - id: metadata/signed/trust-level::unsigned-missing-signature-record
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/installer/family/
      - id: well-known/app/
      - id: well-known/lib/
