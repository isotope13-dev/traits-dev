# A script stage that goes looking for the file that delivered it.
#
# 2026-09 Colombian judicial-lure chain: a .msg carries an `.xhtml`-named SVG;
# the SVG smuggles a fake Fiscalia page that zips up a JScript file; the
# JScript then walks Downloads/Descargas/Desktop/Escritorio/Documentos for any
# `*.xhtml`, cuts the text between two comment markers out of it, hex-XOR
# decrypts it and runs it through `new (this["Function"])(...)`. The payload
# never leaves the original attachment, so the dropped script is a key without
# a lock and every static scanner that sees it alone sees no payload.
#
# Visible in the script: the localized user-folder paths, a bytewise XOR
# decoder, and a Function constructor reached through a computed receiver.
# Any one is ordinary; a script that searches the user's download folders and
# feeds decrypted text to a hidden Function constructor is a loader.
defaults:
  platforms: [windows]
  for: [javascript]
  attack: T1027,T1140,T1059.007
  mbc: B0024
composite_rules:
  - id: user-folder-carrier-decrypt-exec
    desc: Script searches user folders and runs decrypted code
    crit: hostile
    conf: 0.93
    all:
      - id: micro-behaviors/fs/path/location::localized-user-folder-path
      - id: micro-behaviors/data/decode/custom::bytewise-xor-append-transform
    any:
      - id: objectives/anti-static/obfuscation/eval/loader::computed-receiver-new-constructor
      - id: objectives/anti-static/obfuscation/string/dynamic::char-code-helper-member-name
