# Chromium accepts a custom program for starting its GPU child process. A
# shell supplied through that flag can execute a remote stage while the outer
# process still appears to be a trusted browser. ClickFix campaigns place this
# browser command line on the clipboard for victim-assisted execution.
defaults:
  platforms: [windows]
  for: [html, javascript, typescript, batch, powershell]
  attack: T1059.003,T1105,T1218.005
  mbc: B0024,E1218.005

composite_rules:
  - id: chromium-gpu-launcher-remote-mshta
    desc: Chromium GPU launcher starts remote MSHTA
    crit: hostile
    conf: 0.99
    near_bytes: 1200
    all:
      - id: micro-behaviors/process/create/flags::chromium-gpu-launcher-shell
      - id: objectives/command-and-control/dropper/execution/script::mshta-remote-url
    any:
      - id: micro-behaviors/process/create/flags::chromium-headless-launch-flag
      - id: micro-behaviors/process/create/flags::chromium-disable-gpu-sandbox-flag
