defaults:
  platforms: [windows, unix]
  for: [javascript, html]
  attack: T1105
  mbc: B0024
traits:
  - id: browser-contract-stage-loader-yara
    desc: Browser smart-contract stage loader
    crit: suspicious
    conf: 0.99
    if:
      type: yara
      source: |
        rule browser_contract_stage_loader_b64xor255 {
          strings:
            $wrap = "atob(s);var len=s.length" ascii
            $state = "jJaLmqCNmo+elo2gjIuei5rY" ascii
            $contract = "z4eevceZy8bMyMiZnMfJy8vMyMvLyJq7x7nGvbnKzcrMxrrHvb7Ox73O" ascii
            $eth_call = "ai5egnJ6Tk9jT" ascii
            $api_js = "0J6PltCWkZuah9GPl4/AnsKVjNmSkJuaw" ascii
          condition:
            filesize < 200KB and all of them
        }
  - id: b64xor-site-repair-state
    desc: Base64 XOR site repair state key
    crit: baseline
    conf: 0.96
    if:
      type: text
      substr: jJaLmqCNmo+elo2gjIuei5rY
  - id: b64xor-bw-downloaded-state
    desc: Base64 XOR browser download state key
    crit: baseline
    conf: 0.96
    if:
      type: text
      substr: 2I0puQiJGTkJ6bmpvY
  - id: b64xor-browser-mode-map
    desc: Base64 XOR browser lure mode map
    crit: baseline
    conf: 0.93
    if:
      type: text
      substr: djZCIjJqNxdiJztGVjNg
  - id: b64xor-cloudflare-mode-map
    desc: Base64 XOR Cloudflare lure mode map
    crit: baseline
    conf: 0.93
    if:
      type: text
      substr: yTkIqbmZOejZrF2InJ0ZWM2
  - id: b64xor-api-js-mode-stage
    desc: Base64 XOR API mode script stage
    crit: suspicious
    conf: 0.96
    if:
      type: text
      substr: 0J6PltCWkZuah9GPl4/AnsKVjNmSkJuaw
  - id: b64xor-state-key-pair
    desc: Base64 XOR browser state keys
    crit: suspicious
    conf: 0.97
    if:
      type: text
      regex: jJaLmqCNmo\+elo2gjIuei5rY[\s\S]{0,100}2I0puQiJGTkJ6bmpvY
  - id: b64xor-dual-lure-modes
    desc: Base64 XOR dual lure modes
    crit: suspicious
    conf: 0.95
    if:
      type: text
      regex: djZCIjJqNxdiJztGVjNg[\s\S]{0,120}yTkIqbmZOejZrF2InJ0ZWM2
  - id: clickfix-finger-command
    desc: Finger remote-query command marker
    crit: component
    conf: 0.94
    if:
      type: text
      regex: '(?i)\bfinger(\.exe)?\s+[a-z0-9._-]{2,64}@[a-z0-9.-]{3,253}\.[a-z]{2,24}\b'
  - id: clickfix-finger-ip-command
    desc: Finger remote-query IP marker
    crit: component
    conf: 0.95
    if:
      type: text
      regex: '(?i)\bfinger(\.exe)?\s+[a-z0-9._-]{2,64}@(\d{1,3}\.){3}\d{1,3}\b'
  - id: clickfix-renamed-finger-command
    desc: Renamed finger command marker
    crit: component
    conf: 0.96
    if:
      type: text
      regex: '(?i)(copy|cp|move|ren)\s+[^\r\n]{0,120}finger\.exe[^\r\n]{0,160}\\ct\.exe'
  - id: clickfix-base64-finger-cmd
    desc: Encoded finger command marker
    crit: component
    conf: 0.94
    if:
      type: text
      regex: '(?i)(atob|btoa|base64|fromCharCode).{0,240}\bfinger(\.exe)?\s+[A-Za-z0-9._-]{2,64}@'
  - id: crashfix-browser-abnormal-warning
    desc: CrashFix browser abnormal warning
    crit: suspicious
    conf: 0.93
    if:
      type: text
      regex: '(?i)browser\s+(has\s+)?stopped\s+abnormally|chrome\s+(has\s+)?stopped\s+abnormally'
  - id: clickfix-lure-action-word
    desc: 'Generic action verb — composite-only'
    crit: component
    conf: 0.5
    if:
      type: text
      regex: '(?i)\bpaste\b.{0,80}\bpowershell\b'
  - id: macos-paste-terminal-cue
    desc: Instructs paste into Terminal
    crit: component
    conf: 0.9
    platforms: [macos]
    for: [html, markdown, javascript, typescript]
    if:
      type: text
      regex: '(?is)\bpaste\b.{0,160}\b(terminal|return)\b|\bterminal\b.{0,160}\bpaste\b'
  - id: macos-terminal-name
    desc: Terminal app launch reference
    crit: component
    conf: 0.5
    platforms: [macos]
    if:
      type: text
      regex: '(?i)\bTerminal\.app\b|\b(open|launch|start)\s+(the\s+)?Terminal\b'
  - id: clickfix-base64-decode
    desc: ClickFix base64 decode command
    crit: component
    conf: 0.9
    platforms: [macos]
    if:
      type: text
      regex: '(?i)\bbase64\s+(-[A-Za-z]*d|--decode)\b'
  - id: clickfix-shell-pipe-sink
    desc: ClickFix decoded shell pipe sink
    crit: component
    conf: 0.9
    platforms: [macos]
    if:
      type: text
      regex: '(?i)\|\s*((/bin/)?(bash|zsh|sh|osascript))\b'
  - id: clickfix-shell-c
    desc: ClickFix shell command execution
    crit: component
    conf: 0.9
    platforms: [macos]
    if:
      type: text
      regex: '(?i)\b((/bin/)?(bash|zsh|sh))\s+-c\b'
  - id: clickfix-do-shell-script
    desc: ClickFix AppleScript shell execution
    crit: component
    conf: 0.9
    platforms: [macos]
    if:
      type: text
      regex: '(?i)\bdo\s+shell\s+script\b'
  - id: claude-public-artifact-host
    desc: Claude public artifact page host
    crit: notable
    conf: 0.94
    for: [html, markdown, javascript, typescript]
    if:
      type: text
      regex: '(?i)https?://claude\.ai/public/artifacts/'
  - id: chatgpt-canvas-public-host
    desc: ChatGPT Canvas public page host
    crit: notable
    conf: 0.94
    for: [html, markdown, javascript, typescript]
    if:
      type: text
      regex: '(?i)https?://chatgpt\.com/(canvas|share)/'
  - id: copilot-public-page-host
    desc: Microsoft Copilot public page host
    crit: notable
    conf: 0.94
    for: [html, markdown, javascript, typescript]
    if:
      type: text
      regex: '(?i)https?://copilot\.microsoft\.com/(pages|share)/'
  - id: ai-fix-terminal-paste-cue
    desc: AI-fix page instructs terminal copy and paste
    crit: component
    conf: 0.93
    for: [html, markdown, javascript, typescript]
    platforms: [macos]
    if:
      type: text
      regex: '(?is)\b(open|launch)\s+(the\s+)?terminal\b[\s\S]{0,320}\b(copy\s+and\s+paste|paste)\b'
  - id: browser-curl-insecure-flag
    desc: HTML curl disables TLS verification
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: '(?i)\bcurl(\.exe)?[^\r\n]{0,140}\s(-k|--insecure)\b'
    unless:
      - id: well-known/lib/ui/swagger-ui::swagger-ui-bundle-marker
      - id: micro-behaviors/communications/http/download/curl::kubectl-manifest-curl-install-example
      - id: metadata/file/extension/identity::declaration-file-extension
  # `curl -o` is the ordinary way to download a file and already has a canonical
  # atom at micro-behaviors/communications/http/download/curl::source-curl-output-option.
  # The copy that lived here described itself as "HTML curl" while matching any
  # carrier the file's `for:` admitted — auto-editor's Nim build script, which
  # the type sniffer reports as JavaScript, fetches its FFmpeg sources that way
  # — so the archive-command composite below references the canonical one.
  - id: browser-curl-archive-output
    desc: Browser curl archive output
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: '(?i)\b(curl|curl\.exe)\s+[^\r\n]{0,260}\.(zip|update|7z|rar)\b'
    unless:
      - id: metadata/library/structure::vscode-extension-generated-asset
      - id: metadata/library/structure::vscode-js-distribution-bundle
      - id: well-known/lib/format/zip-js::zip-js-library-marker
  - id: interview-test-record
    desc: Interview test record key
    crit: notable
    conf: 0.92
    if:
      type: text
      regex: '["'']testName["'']\s*:'
  - id: interview-company-role-key
    desc: Interview company or role key
    crit: notable
    conf: 0.92
    if:
      type: text
      regex: '["''](companyName|roleName)["'']\s*:'
  - id: interview-question-count-key
    desc: Interview question count key
    crit: notable
    conf: 0.92
    if:
      type: text
      regex: '["'']questionCount["'']\s*:'
  - id: interview-invite-route-data
    desc: Generated /invite/ interview routes
    crit: suspicious
    conf: 0.94
    if:
      type: text
      regex: '(?is)["'']redirectURL["'']\s*:\s*\[[^\]]{0,500}/invite/'
composite_rules:
  - id: ai-public-artifact-host
    desc: Public AI-generated page host
    crit: notable
    conf: 0.94
    any:
      - id: claude-public-artifact-host
      - id: chatgpt-canvas-public-host
      - id: copilot-public-page-host
  - id: shell-download-pipeline
    desc: Browser page combines a terminal lure with a shell download pipeline
    crit: suspicious
    conf: 0.94
    for: [html, markdown]
    platforms: [macos]
    all:
      - id: micro-behaviors/process/create/shell/pipeline::curl-pipe-shell-text
      - id: ai-fix-terminal-paste-cue
    near_bytes: 512
  - id: clickfix-macos-terminal-lure
    desc: macOS Terminal copy-paste lure
    crit: suspicious
    conf: 0.9
    platforms: [macos]
    all:
      - id: macos-terminal-name
    any:
      - id: clickfix-lure-action-word
      - id: macos-paste-terminal-cue
      - id: ai-fix-terminal-paste-cue
    near_bytes: 240
    unless:
      - id: metadata/file/extension/identity::edoc-file-extension
      - id: metadata/library/structure::js-vite-rollup-vendor-chunk
      - id: metadata/library/runtime::acquire-vscode-api
      - id: micro-behaviors/process/interpreter/vm/
      - id: micro-behaviors/ui/help::terminal-help-instruction
  - id: clickfix-base64-terminal-exec
    desc: Base64 decoded shell execution
    crit: suspicious
    conf: 0.92
    platforms: [macos]
    all:
      - id: clickfix-base64-decode
    any:
      - id: clickfix-shell-pipe-sink
      - id: clickfix-shell-c
      - id: clickfix-do-shell-script
    near_lines: 1
    unless:
      - id: metadata/library/structure/
      - id: metadata/package/quality/benign-context::benign-app-fp-context
      - id: metadata/package/testing/
      - id: metadata/package/testing/presence/harness::test-fixture-directory-path
  - id: clickfix-state-key-pair
    desc: ClickFix browser state key pair
    crit: suspicious
    conf: 0.96
    all:
      - id: b64xor-site-repair-state
      - id: b64xor-bw-downloaded-state
  - id: clickfix-lure-mode-map
    desc: ClickFix lure mode map
    crit: suspicious
    conf: 0.94
    all:
      - id: b64xor-browser-mode-map
      - id: b64xor-cloudflare-mode-map
  - id: browser-contract-stage-loader
    desc: Browser smart-contract stage loader
    crit: hostile
    conf: 0.99
    all:
      - id: browser-contract-stage-loader-yara
      - id: micro-behaviors/data/decode/xor::js-base64-xor-decode-loop
      - id: micro-behaviors/data/source/dynamic/eval::new-function-iife
  - id: clickfix-finger-lolbin-stage
    desc: ClickFix finger LOLBin stage
    crit: hostile
    conf: 0.97
    any:
      - id: clickfix-finger-command
      - id: clickfix-finger-ip-command
      - id: clickfix-base64-finger-cmd
      - id: objectives/command-and-control/channel/finger::finger-output-command-execution
    all:
      - id: objectives/execution/lure/clipboard::browser-clipboard-write
  - id: crashfix-finger-browser-lure
    desc: CrashFix finger browser lure
    crit: hostile
    conf: 0.98
    all:
      - id: crashfix-browser-abnormal-warning
    any:
      - id: clickfix-finger-command
      - id: clickfix-finger-ip-command
      - id: clickfix-renamed-finger-command
  - id: clickfix-macos-terminal-loader
    desc: macOS ClickFix Terminal loader
    crit: hostile
    conf: 0.96
    platforms: [macos]
    attack: T1059.004,T1059.002
    all:
      - id: clickfix-macos-terminal-lure
    any:
      - id: clickfix-base64-terminal-exec
      - id: objectives/command-and-control/dropper/delivery/pipe::curl-pipe-shell
      - id: objectives/command-and-control/dropper/staging/memory::curl-osascript
  - id: ai-fix-trusted-page-terminal-loader
    desc: Trusted AI-hosted page lures terminal download execution
    crit: hostile
    conf: 0.98
    platforms: [macos]
    for: [html, markdown, javascript, typescript]
    all:
      - id: ai-public-artifact-host
      - id: ai-fix-terminal-paste-cue
      - id: shell-download-pipeline
    near_bytes: 8192
  - id: browser-camera-clickfix-command
    desc: Browser camera lure copies a Windows payload command
    crit: hostile
    conf: 0.99
    attack: T1059.001,T1059.005,T1105,T1123,T1204.002
    near_bytes: 1800
    all:
      - id: micro-behaviors/hardware/display/camera::browser-media-capture-api
      - id: browser-clickfix-windows-archive-command
      - id: micro-behaviors/os/clipboard/access::browser-clipboard-write
  - id: browser-clickfix-windows-archive-command
    desc: Browser Windows archive and WScript command
    crit: suspicious
    conf: 0.98
    attack: T1059.001,T1059.005,T1105,T1204.002
    near_bytes: 1000
    all:
      - id: browser-curl-insecure-flag
      - id: micro-behaviors/communications/http/download/curl::source-curl-output-option
      - id: browser-curl-archive-output
      - id: micro-behaviors/data/archive/extract/zip::powershell-expand-archive-text
      - id: micro-behaviors/process/create/shell/script-host::temp-script-host-path
  - id: interview-invite-schema
    desc: Structured interview invitation record
    crit: suspicious
    conf: 0.95
    near_bytes: 500
    all:
      - id: interview-test-record
      - id: interview-company-role-key
      - id: interview-question-count-key
  - id: browser-interview-clickfix-page
    desc: Interview page ClickFix command lure
    crit: hostile
    conf: 0.99
    attack: T1059.001,T1059.005,T1105,T1123,T1204.002
    near_bytes: 4096
    all:
      - id: browser-camera-clickfix-command
      - id: interview-invite-schema
      - id: interview-invite-route-data
