defaults:
  platforms: [windows]
  for: [vbs]
  attack: "T1027,T1047,T1059.001,T1105"

composite_rules:
  - id: vbs-encoded-url-hidden-wmi-stager
    desc: VBScript encoded URL hidden WMI stager
    crit: hostile
    conf: 0.99
    all:
      - id: objectives/execution/wmi::wmi-hidden-variable-process-create
      - id: micro-behaviors/communications/http/url/encoded::vbs-encoded-http-url
      - id: objectives/anti-static/obfuscation/wsh::vbs-obfuscated-getobject-target
  - id: vbs-http-range-reflective-wmi-loader
    desc: Hidden WMI launches a Unicode-obfuscated remote .NET loader
    crit: hostile
    conf: 0.995
    attack: "T1027.002,T1047,T1059.001,T1105,T1140,T1564.003,T1620"
    mbc: "B0030,B0032,E1043"
    all:
      - id: objectives/execution/wmi::wmi-hidden-variable-process-create
      - id: micro-behaviors/process/create/shell/encoded::unicode-delimited-powershell-command
      - id: micro-behaviors/communications/http/client/managed::unicode-delimited-http-range-request
      - id: objectives/anti-static/obfuscation/steganography/unicode::js-unicode-delimited-appdomain-fragment
