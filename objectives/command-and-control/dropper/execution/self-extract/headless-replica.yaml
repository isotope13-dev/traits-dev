# GUI-subsystem PE that writes a new executable and launches it, with no
# windowing imports. IMAGE_SUBSYSTEM_WINDOWS_GUI hides the console; without
# user32 the process is not a real GUI app — it is a silent drop-and-run.
defaults:
  platforms: [windows]
  for: [pe]
  attack: T1204.002
  mbc: B0023

composite_rules:
  - id: headless-gui-replica-launch
    desc: Headless GUI writes and launches replica
    crit: hostile
    conf: 0.94
    all:
      - id: metadata/binary/metrics/pe-details::pe-windows-gui-subsystem
      - id: micro-behaviors/os/module/load::get-module-filename-ansi
      - id: micro-behaviors/fs/file/open::fopen
      - id: micro-behaviors/process/create/spawn::create-process-a
      - id: metadata/binary/layout::pe-no-signature-record
    unless:
      - id: micro-behaviors/ui/window/manage/control::create-window-ex
      - id: metadata/signed/platform/
      - id: metadata/binary/installer/family/
      - id: metadata/package/versioning::pe-version-resource
      - id: metadata/binary/framework/
      # GNU gettext's runtime DLL exports helper process/file routines as part
      # of its translation tooling; its exact package identity is not a dropper.
      - id: well-known/lib/runtime/gnu-libintl::gettext-windows-runtime-library
      # radare2 release DLLs legitimately resolve their own paths, perform
      # file I/O, and launch helper processes as part of the tool suite.
      - id: well-known/tool/reverse-engineering/radare2::radare2-release-source-tree
