# SQL Server configuration and extensibility abuse. The article's affiliate
# enabled SQL Server features that turn database code into Windows process
# execution: trustworthy/CLR, unsafe assemblies, xp_cmdshell, and OLE
# Automation. Match SQL statement structure so renamed procedures and payload
# URLs remain detectable.
defaults:
  platforms: [windows]
  for: [text, data]
  attack: T1059.001,T1505.001,T1047

traits:
  - id: sqlserver-enable-clr
    desc: SQL Server enables CLR integration
    crit: suspicious
    conf: 0.95
    if:
      type: text
      regex: "(?is)sp_configure\\s+['\"]clr\\s+enabled['\"]"

  - id: sqlserver-trustworthy-database
    desc: SQL Server enables TRUSTWORTHY database
    crit: suspicious
    conf: 0.96
    if:
      type: text
      regex: '(?is)alter\s+database.{0,160}set\s+trustworthy\s+on'

  - id: sqlserver-unsafe-clr-assembly
    desc: SQL Server creates unsafe CLR assembly
    crit: suspicious
    conf: 0.97
    if:
      type: text
      regex: '(?is)create\s+assembly.{0,500}permission_set\s*=\s*unsafe'

  - id: sqlserver-external-clr-procedure
    desc: SQL Server exposes external CLR procedure
    crit: suspicious
    conf: 0.95
    if:
      type: text
      regex: '(?is)create\s+procedure.{0,500}as\s+external\s+name'

  - id: sqlserver-enable-xp-cmdshell
    desc: SQL Server enables xp_cmdshell
    crit: suspicious
    conf: 0.96
    if:
      type: text
      regex: "(?is)sp_configure\\s+['\"]xp_cmdshell['\"]"

  - id: sqlserver-xp-windows-command
    desc: xp_cmdshell launches Windows command
    crit: suspicious
    conf: 0.96
    if:
      type: text
      regex: '(?is)xp_cmdshell.{0,260}(cmd(\.exe)?|powershell(\.exe)?|wmic)'

  - id: sqlserver-enable-ole-automation
    desc: SQL Server enables OLE Automation
    crit: suspicious
    conf: 0.95
    if:
      type: text
      regex: "(?is)sp_configure\\s+['\"]ole automation procedures['\"]"

  - id: sqlserver-ole-wscript-shell
    desc: SQL Server creates WScript.Shell OLE object
    crit: suspicious
    conf: 0.98
    if:
      type: text
      regex: "(?is)sp_oacreate\\s+['\"]wscript\\.shell['\"]"

  - id: sqlserver-ole-run-method
    desc: SQL Server invokes OLE shell Run method
    crit: suspicious
    conf: 0.97
    if:
      type: text
      regex: "(?is)sp_oamethod.{0,160}['\"]run['\"]"

  - id: sqlserver-external-shell-command
    desc: SQL Server CLR procedure reaches Windows shell
    crit: suspicious
    conf: 0.96
    if:
      type: text
      regex: '(?is)as\s+external\s+name.{0,800}(cmd(\.exe)?|powershell(\.exe)?|wmic)'

composite_rules:
  - id: sqlserver-unsafe-clr-shell
    desc: SQL Server unsafe CLR command shell
    crit: hostile
    conf: 0.99
    attack: T1059.001,T1505.001
    all:
      - id: sqlserver-enable-clr
      - id: sqlserver-trustworthy-database
      - id: sqlserver-unsafe-clr-assembly
      - id: sqlserver-external-clr-procedure
      - id: sqlserver-external-shell-command

  - id: sqlserver-xp-cmdshell-payload
    desc: SQL Server enables xp_cmdshell for payload execution
    crit: hostile
    conf: 0.99
    attack: T1059.001,T1505.001
    all:
      - id: sqlserver-enable-xp-cmdshell
      - id: sqlserver-xp-windows-command

  - id: sqlserver-ole-shell-execution
    desc: SQL Server OLE Automation launches shell command
    crit: hostile
    conf: 0.99
    attack: T1059.001,T1505.001
    all:
      - id: sqlserver-enable-ole-automation
      - id: sqlserver-ole-wscript-shell
      - id: sqlserver-ole-run-method
