defaults:
  platforms: [windows]
  for: [oledoc]
  conf: 0.97

composite_rules:
  - id: localappdata-node-script-dropper
    desc: MSI launches a randomized Node script chain from LocalAppData
    crit: hostile
    attack: T1059.003
    all:
      - id: metadata/binary/installer/database::cmd-randomized-script-custom-action
      - id: metadata/binary/installer/database::randomized-data-js-alias-pair
      - id: metadata/binary/installer/database::randomized-cmd-file-alias
      - id: metadata/binary/installer/database::node-manifest-config-pair
      - id: metadata/binary/installer/database::node-notice-changelog-pair
      - id: metadata/binary/installer/database::randomized-executable-file-alias
      - id: metadata/binary/installer/database::msi-localappdata-install-root
      - id: metadata/binary/installer/database::embedded-mscf-cabinet
