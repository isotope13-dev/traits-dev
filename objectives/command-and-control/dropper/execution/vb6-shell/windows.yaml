# VB6 droppers that conceal Win32 APIs then Shell() an exe, or pair URLMon
# with a fake Microsoft company name, are staged malware not VB6 apps.
defaults:
  platforms: [windows]
  for: [pe]
  attack: T1059,T1027
  crit: hostile
  conf: 0.94

composite_rules:
  - id: vb6-concealed-shell
    desc: VB6 conceals Win32 APIs then shells a payload
    all:
      - id: objectives/anti-static/obfuscation/imports::vb6-concealed-win32-apis
      - id: micro-behaviors/process/create/macro/office::vb6-shell-execution
    unless:
      - id: metadata/signed/platform/
      - id: well-known/lib/runtime/native-platform/vb-richclient::vb-richclient-runtime-library

  - id: vb6-obfuscated-shell
    desc: VB6 obfuscated loader shells a payload
    all:
      - id: objectives/anti-static/obfuscation/imports::vb6-obfuscated-runtime-dispatch
      - id: micro-behaviors/process/create/macro/office::vb6-shell-execution
    unless:
      - id: metadata/signed/platform/
      - id: well-known/lib/runtime/native-platform/vb-richclient::vb-richclient-runtime-library

  - id: vb6-fso-shell
    desc: VB6 FileSystemObject dropper shells a payload
    all:
      - id: micro-behaviors/os/com/object::filesystemobject-progid
      - id: micro-behaviors/process/create/macro/office::vb6-shell-execution
    unless:
      - id: metadata/signed/platform/
      - id: well-known/lib/runtime/native-platform/vb-richclient::vb-richclient-runtime-library

  - id: vb6-urlmon-ms-claim
    desc: Fake Microsoft VB6 URLMon downloader
    attack: T1036.005,T1105
    all:
      - id: micro-behaviors/communications/http/client/urlmon::url-download-to-file-str
      - id: objectives/evasion/masquerade/version-resource/claim::microsoft-company-name-short
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/vendor::is-microsoft-named
      - id: well-known/lib/runtime/native-platform/vb-richclient::vb-richclient-runtime-library

  - id: vb6-concealed-toolhelp
    desc: VB6 conceals Win32 APIs then walks processes
    all:
      - id: objectives/anti-static/obfuscation/imports::vb6-concealed-win32-apis
      - id: micro-behaviors/process/enumerate/snapshot::dynamic-toolhelp-process-traversal
    unless:
      - id: metadata/signed/platform/
      - id: well-known/lib/runtime/native-platform/vb-richclient::vb-richclient-runtime-library

  - id: vb6-concealed-cached-password
    desc: VB6 conceals Win32 APIs then dumps cached passwords
    attack: T1056,T1555
    all:
      - id: objectives/anti-static/obfuscation/imports::vb6-concealed-win32-apis
      - id: objectives/credential-access/dump/system::cached-password-enumeration-marker
    unless:
      - id: metadata/signed/platform/
      - id: well-known/lib/runtime/native-platform/vb-richclient::vb-richclient-runtime-library

  - id: vb6-urlmon-string-cat
    desc: VB6 URLMon downloader builds strings at runtime
    attack: T1105,T1027
    all:
      - id: micro-behaviors/communications/http/client/urlmon::url-download-to-file-str
      - id: micro-behaviors/data/string/runtime::vb6-string-construction-cat
    unless:
      - id: metadata/signed/platform/
      - id: well-known/lib/runtime/native-platform/vb-richclient::vb-richclient-runtime-library

  - id: vb6-filecopy-shell
    desc: VB6 FileCopy dropper shells a payload
    all:
      - id: micro-behaviors/fs/file/copy::vb6-rtcfilecopy
      - id: micro-behaviors/process/create/macro/office::vb6-shell-execution
    unless:
      - id: metadata/signed/platform/
      - id: well-known/lib/runtime/native-platform/vb-richclient::vb-richclient-runtime-library

  - id: vb6-environ-shell
    desc: VB6 shell dropper reads process environment
    all:
      - id: micro-behaviors/os/env/read::vb6-environ-var
      - id: micro-behaviors/process/create/macro/office::vb6-shell-execution
    unless:
      - id: metadata/signed/platform/
      - id: well-known/lib/runtime/native-platform/vb-richclient::vb-richclient-runtime-library

  - id: vb6-winsock-ocx-shell
    desc: VB6 shell dropper embeds MSWINSCK.OCX
    all:
      - id: micro-behaviors/communications/socket/mfc::mswinsck-ocx
      - id: micro-behaviors/process/create/macro/office::vb6-shell-execution
    unless:
      - id: metadata/signed/platform/
      - id: well-known/lib/runtime/native-platform/vb-richclient::vb-richclient-runtime-library

  - id: vb6-smss-drop
    desc: VB6 shell dropper stages beside smss.exe
    all:
      - id: micro-behaviors/fs/path/host-process::windows-smss-name
      - id: micro-behaviors/process/create/macro/office::vb6-shell-execution
    unless:
      - id: metadata/signed/platform/
      - id: well-known/lib/runtime/native-platform/vb-richclient::vb-richclient-runtime-library

  - id: vb6-telnet-runkey
    desc: VB6 Run-key dropper launches telnet to a host
    attack: T1547.001
    all:
      - id: micro-behaviors/os/registry/keys::currentversion-run
      - id: micro-behaviors/communications/socket/telnet::telnet-client-host-port
    unless:
      - id: metadata/signed/platform/
      - id: well-known/lib/runtime/native-platform/vb-richclient::vb-richclient-runtime-library

  - id: vb6-few-imports-shell
    desc: Sparse-import VB6 stub shells a payload
    all:
      - id: objectives/anti-static/pack/runtime::pe-import-count-under-10
      - id: micro-behaviors/process/create/macro/office::vb6-shell-execution
    unless:
      - id: metadata/signed/platform/
      - id: well-known/lib/runtime/native-platform/vb-richclient::vb-richclient-runtime-library

  - id: vb6-rundll32-shell
    desc: VB6 shell dropper invokes rundll32
    all:
      - id: micro-behaviors/process/create/shell/script-host::rundll32-exec-with-args
      - id: micro-behaviors/process/create/macro/office::vb6-shell-execution
    unless:
      - id: metadata/signed/platform/
      - id: well-known/lib/runtime/native-platform/vb-richclient::vb-richclient-runtime-library

  - id: vb6-sparse-shell
    desc: Low-string VB6 stub shells a payload
    all:
      - id: objectives/anti-static/obfuscation/payload/string-sparse::low-string-count-vb6
      - id: micro-behaviors/process/create/macro/office::vb6-shell-execution
    unless:
      - id: metadata/signed/platform/
      - id: well-known/lib/runtime/native-platform/vb-richclient::vb-richclient-runtime-library

  - id: vb6-shell-telnet
    desc: VB6 shell dropper launches a telnet client
    all:
      - id: micro-behaviors/process/create/macro/office::vb6-shell-execution
      - id: micro-behaviors/communications/socket/telnet::telnet-client-host-port
    unless:
      - id: metadata/signed/platform/
      - id: well-known/lib/runtime/native-platform/vb-richclient::vb-richclient-runtime-library

  - id: vb6-dll-runkey
    desc: VB6 DllFunctionCall stub writes a Run key
    attack: T1547.001
    all:
      - id: micro-behaviors/dylib/lookup::vb6-dll-function-call
      - id: micro-behaviors/os/registry/keys::currentversion-run
    unless:
      - id: metadata/signed/platform/
      - id: well-known/lib/runtime/native-platform/vb-richclient::vb-richclient-runtime-library
