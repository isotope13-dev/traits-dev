# The Office macro downloader, stated as what it does rather than as a family.
#
# Four capabilities, each ordinary on its own and none of which a document has
# a reason to combine: it runs when the file is opened rather than when a
# person asks; it holds several hardcoded payload URLs, which is a fallback
# list and not a link; it writes a fetched stream to disk through ADODB; and it
# carries a shell object to start what it wrote.
#
# Deliberately not tied to any campaign's strings. The wave that surfaced this
# hid its `.doc` inside a zip named `.xlsm`, so nothing had ever read the
# macro; what was inside was the same downloader that has been shipping since
# Dridex, and the next one will be too.
#
# The second rule below is the same document with the work pushed out to
# PowerShell instead of done in VBA. It only became reachable once VBA module
# source started decompressing at all -- until then a `.docm` reached the rules
# as a zip with a `vbaProject.bin` in it and nothing more.
defaults:
  platforms: [windows]
  for: [oledoc, ooxml]
  attack: T1204.002,T1059.005,T1105
  mbc: C0002

composite_rules:
  - id: vba-autoopen-multi-url-stream-dropper
    desc: Macro runs on open and stages a download
    crit: hostile
    conf: 0.96
    all:
      - id: micro-behaviors/process/create/macro/autoexec::raw-auto-open-entrypoint
      - id: micro-behaviors/process/create/macro/office::multi-url-download-list
      - id: micro-behaviors/fs/write/file/stream::vba-adodb-savetofile-call
      - id: micro-behaviors/process/create/macro/office::wscript-shell-object
    unless:
      - id: metadata/signed/platform/
      - id: well-known/lib/

  # A document that runs a base64 command line when it is opened.
  #
  # Each half is a choice. `Document_Open` means the code runs on open rather
  # than when someone asks for it. `-enc` means the command was encoded, and
  # the only thing encoding buys is that the command cannot be read -- an
  # enterprise macro that calls PowerShell writes the command out, because
  # somebody has to maintain it.
  #
  # The third leg is what the encoded command turns out to be doing, from
  # whichever of its fragments survived into the clear.
  - id: vba-autoopen-encoded-powershell
    desc: Macro runs an encoded PowerShell command on open
    crit: hostile
    conf: 0.96
    attack: T1204.002,T1059.001,T1027
    all:
      - id: micro-behaviors/process/create/macro/office::document-open-handler
      - id: objectives/command-and-control/reverse-shell/encoded::vbs-powershell-enc-cmd
    needs: 1
    any:
      - id: micro-behaviors/communications/http/download/cli::embedded-iwr-outfile-download
      - id: micro-behaviors/process/create/shell/command-mode::windows-command-shell-invocation
      - id: micro-behaviors/process/create/shell/command-flag::powershell-flagged-command-line
    unless:
      - id: metadata/signed/platform/
      - id: well-known/lib/
