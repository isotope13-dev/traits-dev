# What an Office macro does once it runs, stated without reference to how it
# was triggered.
#
# The trigger is the part that varies -- Auto_Open in one build, Document_Open
# in the next, a button in the third -- and it is also the part that sits in a
# different evaluation scope from the macro's text, so a composite that
# insists on it reaches nothing. `for:` carries the scoping instead: a
# document has no business doing any of this, triggered or not.
#
# These only became reachable when VBA module source started decompressing.
# Two PowerPoint add-ins and a macro-enabled deck in this corpus had zero
# findings apiece and turned out to be a batch dropper and two mshta stagers.
defaults:
  platforms: [windows]
  for: [oledoc, ooxml, vbs, text]
  attack: T1059.005
  mbc: C0002

composite_rules:
  # The macro writes a script file and then asks the shell to run it. VBA can
  # execute directly, so the detour through a file on disk is deliberate: what
  # runs is no longer the document's macro, it is a `.bat` the document left
  # behind, and whatever watches Office sees a shell, not a payload.
  - id: office-macro-writes-and-runs-script
    for: [vbs]
    desc: Macro writes a batch file and shells it
    crit: hostile
    conf: 0.95
    attack: T1059.005,T1059.003
    all:
      - id: micro-behaviors/data/format/script::embedded-batch-script-header
      - id: micro-behaviors/fs/write/vba::vba-open-for-output
      - id: micro-behaviors/process/create/shell/command-mode::windows-command-shell-invocation

  # `mshta` runs HTML Applications with no browser sandbox and no mark of the
  # web, which is the whole reason a macro reaches for it. Alongside a
  # `GetObject` whose moniker is built at runtime rather than written down,
  # the document is starting a second interpreter on a target it does not name.
  - id: office-macro-mshta-stage
    for: [vbs]
    desc: Macro launches mshta with a built moniker
    crit: hostile
    conf: 0.95
    attack: T1218.005,T1059.005
    all:
      - id: micro-behaviors/process/create/launch::mshta-command-text
      - id: micro-behaviors/process/create/launch::mshta-execution
      - id: micro-behaviors/process/script/wsh::wsh-getobject-variable-argument
