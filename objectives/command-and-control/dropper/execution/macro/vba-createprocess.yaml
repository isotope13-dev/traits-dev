defaults:
  platforms: [windows]
  for: [vbs]
composite_rules:
  # VBA macro source (seen as vbs) that auto-executes, nibble-decodes hex
  # blobs into a command, and runs it through CreateProcessA: the decoded
  # stage is typically a PowerShell downloader with AMSI bypass.
  - id: vba-autoopen-decoded-createprocess
    desc: VBA auto-open decodes hex payload into hidden process
    crit: hostile
    conf: 0.98
    attack: T1027,T1059.005
    all:
      - id: micro-behaviors/process/create/macro/autoexec::auto-open-sub-decl
      - id: micro-behaviors/data/decode/hex::vbscript-hex-pair-byte-conversion
      - id: micro-behaviors/process/create/launch::create-process-api-name
      - id: objectives/anti-static/obfuscation/name-mangling/variables::vbs-generated-identifiers
  # Stealth-spawn angle of the same chain: the CreateProcess call passes
  # CREATE_NO_WINDOW, so the decoded command runs with no console window.
  - id: vba-hidden-createprocess-spawn
    desc: VBA auto-open spawns windowless CreateProcess child
    crit: hostile
    conf: 0.98
    attack: T1059.005,T1564.003
    all:
      - id: micro-behaviors/process/create/macro/autoexec::auto-open-sub-decl
      - id: micro-behaviors/process/create/launch::create-process-api-name
      - id: micro-behaviors/process/create/hidden::vb-create-no-window
      - id: objectives/anti-static/obfuscation/name-mangling/variables::vbs-generated-identifiers
