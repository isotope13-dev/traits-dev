# A WSH dropper whose COM object name is computed at runtime, then writes a
# file and a registry value through it. Moved from impact/infect/script: the
# script plants files, it does not modify other programs.
defaults:
  platforms: [windows]
  attack: T1059.005

composite_rules:
  # No `text` in for: -- wscript-regwrite and the CreateTextFile atoms do not
  # match plain text, so the rule could never fire there.
  - id: vbs-decoded-object-dropper
    desc: Decoded COM object writes a file
    crit: hostile
    conf: 0.93
    for: [javascript, vbs, static-lib]
    all:
      - id: objectives/anti-static/obfuscation/wsh::vbs-createobject-call
      - id: micro-behaviors/os/registry/write/wsh::wscript-regwrite
    any:
      - id: micro-behaviors/fs/write/content::create-text-file-method-name
      - id: micro-behaviors/fs/write/content::create-text-file-literal
