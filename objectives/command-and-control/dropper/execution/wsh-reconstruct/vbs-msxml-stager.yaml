defaults:
  platforms: [windows]
  for: [vbs, html, scripts, mp3]
  attack: T1027

traits:
  # A large runtime-built hex table is an encoded stage, not ordinary string
  # formatting. Count the accumulator calls so a few unrelated hex literals
  # do not trigger this observation.
  - id: vbs-hex-fragment-accumulator
    desc: VBScript accumulates hex-encoded fragments
    crit: suspicious
    conf: 0.96
    if:
      type: text
      regex: '(?i)\b[A-Za-z_]\w*\s*=\s*[A-Za-z_]\w*\s*&\s*[A-Za-z_]\w*\s*\(\s*["''][0-9a-f]{16,}["'']\s*\)'
    count_min: 8

  # `acc = acc & Chr(code - key)` over a table of five-digit integers.
  # The subtraction hides the character; the table is the payload.
  - id: vbs-chr-offset-decoder
    desc: Chr of an identifier minus another
    crit: suspicious
    conf: 0.94
    for: [vbs, html]
    if:
      type: text
      regex: '(?i)\bChr[Ww]?\s*\(\s*[A-Za-z_]\w*\s*-\s*[A-Za-z_]\w*\s*\)'

  - id: vbs-five-digit-code-table
    desc: Long run of five-digit numeric codes
    crit: notable
    conf: 0.9
    for: [vbs, html]
    if:
      type: text
      regex: '\d{5}\s*,\s*\d{5}'
    count_min: 20

composite_rules:
  - id: obfuscated-hta-msxml-staged-payload
    for: [vbs, mp3]
    desc: Hidden HTA stages an obfuscated MSXML-decoded payload
    crit: hostile
    conf: 0.99
    attack: T1027,T1059.005,T1140,T1218.005,T1564.003
    all:
      - id: metadata/file/format/markup::hta-application-element
      - id: objectives/evasion/process/hidden/execution::hta-taskbar-hidden
      - id: vbs-hex-fragment-accumulator
      - id: micro-behaviors/data/decode/base64::msxml-node-typed-value
      - id: objectives/anti-static/obfuscation/wsh::vbs-createobject-variable-arg

  - id: vbs-chr-offset-hidden-launch
    desc: Chr-offset string launches a hidden command
    crit: hostile
    conf: 0.97
    attack: T1027,T1059.005,T1140,T1564.003
    for: [vbs, html]
    all:
      - id: vbs-chr-offset-decoder
      - id: vbs-five-digit-code-table
      - id: micro-behaviors/process/create/shell/wsh::hidden-window-run
