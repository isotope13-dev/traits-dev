# Stage-two delivery through a profiled launcher endpoint.
#
# The loader fingerprints the host — hardware ID, hostname, username, OS
# build, keyboard layouts — POSTs the profile to a launcher API, and passes
# the response body straight into the Function() constructor, so the stage
# executes in memory with nothing written to disk. This is the DocSend /
# signow-style Electron implant flow documented by Huntress: the server
# decides per-host what the victim runs next, and every error path is
# silently discarded so a dead server and a live compromise look identical.
#
# A Function constructor alone is a loader capability (fetch-eval
# composites cover the plain forms); pairing it with an outbound host
# profile is what makes the remote side an operator choosing payloads.
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
  attack: T1105,T1059.007,T1082
  mbc: B0030

composite_rules:
  - id: profiled-function-constructor-stage2
    desc: Host profile POST supplies Function-executed stage
    crit: hostile
    conf: 0.95
    near_bytes: 8192
    all:
      - id: micro-behaviors/process/interpreter/eval/compile::js-new-function-constructor
      - id: objectives/discovery/system/fingerprint/hardware::js-profiling
    any:
      - id: micro-behaviors/communications/http/request/client::http-post-json
      - id: micro-behaviors/communications/http/post::node-https-request-post
