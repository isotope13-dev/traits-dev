# A program that POSTs, then runs whatever comes back.
#
# The response body is accumulated from the `data` events, and on `end` it is
# handed to Node's `vm` to execute inside a context the caller populates —
# typically with `require`, `process`, `fs` and friends, which makes the
# "sandbox" a full runtime rather than a restriction. Nothing about the payload
# is in the shipped artifact: what executes is whatever the server returns at
# that moment, to that victim. An analyst gets the delivery and nothing else.
#
# This is the fileless shape of a second stage. There is no download to disk, no
# child process, and no eval of a string the file contains — three of the things
# a reviewer looks for — which is why it needs its own rule rather than falling
# out of the dropper composites that key on those.
#
# Keyed on the join between the response handler and the VM execution, so it
# holds whether the request was made with `https.request`, `http.request` or a
# wrapper, and whether the vm module was imported plainly or under an alias.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  attack: T1059.007,T1105
  mbc: B0024,E1105

composite_rules:
  - id: node-http-response-executed-in-vm
    desc: Executes the HTTP response body in a Node VM
    crit: hostile
    conf: 0.95
    all:
      - id: micro-behaviors/process/interpreter/vm::vm-runInContext
      - id: micro-behaviors/communications/http/response::node-response-data-event
      - id: micro-behaviors/communications/http/response::node-response-end-event
