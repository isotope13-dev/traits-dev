# Unsigned WinExec copy-and-kill PEs are infectors, not launchers: they
# copy a file, spawn it, and terminate competing processes by name.
defaults:
  platforms: [windows]
  for: [pe, dll]
  attack: T1105,T1059,T1489
  crit: hostile
  conf: 0.93

composite_rules:
  # The short two-capability rules below need broad library and installer
  # exclusions because each pair occurs in legitimate launchers.  This full
  # chain does not: it copies and launches a persistent payload while carrying
  # a multi-vendor AV/EDR process target list and process-termination logic.
  - id: winexec-persistent-security-process-killer
    desc: Persistent WinExec payload targets security processes
    crit: hostile
    conf: 0.99
    attack: T1105,T1547.001,T1562.001
    all:
      - id: micro-behaviors/process/create/exec::winexec
      - id: micro-behaviors/fs/file/copy::copyfile-a
      - id: micro-behaviors/os/registry/keys::currentversion-run
      - id: objectives/impact/degrade/edr/targeting::multi-vendor-security-process-images
    any:
      - id: micro-behaviors/process/terminate/kill::terminate-process
      - id: micro-behaviors/process/terminate/kill::terminate-process-name-text
      - id: micro-behaviors/os/registry/access::reg-set-value-ex-a
      - id: micro-behaviors/os/registry/access::reg-set-value-ex-w
    needs: 2

  - id: unsigned-winexec-copyfile
    desc: Unsigned WinExec payload copies a file
    all:
      - id: micro-behaviors/process/create/exec::winexec
      - id: micro-behaviors/fs/file/copy::copyfile-a
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/installer/family/
      - id: well-known/lib/

  - id: unsigned-winexec-terminate
    desc: Unsigned WinExec payload kills processes by name
    all:
      - id: micro-behaviors/process/create/exec::winexec
      - id: micro-behaviors/process/terminate/kill::terminate-process-name-text
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/installer/family/
      - id: well-known/lib/

  - id: unsigned-winexec-socket
    desc: Unsigned WinExec payload talks over Winsock
    all:
      - id: micro-behaviors/process/create/exec::winexec
      - id: micro-behaviors/communications/socket/init::winsock-client-lifecycle
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/installer/family/

  - id: unsigned-winexec-deletefile
    desc: Unsigned WinExec payload deletes a file
    all:
      - id: micro-behaviors/process/create/exec::winexec
      - id: micro-behaviors/fs/delete/file/library::deletefile-a
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/installer/family/
      - id: metadata/package/tooling::cpuz-binary

  - id: unsigned-winexec-single-export
    desc: Single-export module launches via WinExec
    all:
      - id: micro-behaviors/process/create/exec::winexec
      - id: metadata/binary/symbols/exports::single-export
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/installer/family/

  - id: unsigned-lsp-enum-winexec
    desc: Unsigned WinExec payload enumerates Winsock LSPs
    all:
      - id: micro-behaviors/process/create/exec::winexec
      - id: micro-behaviors/communications/socket/lsp::wsc-enum-protocols
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/installer/family/
      - id: well-known/lib/

  - id: unsigned-lsp-path-winexec
    desc: Unsigned WinExec payload queries LSP paths
    all:
      - id: micro-behaviors/process/create/exec::winexec
      - id: micro-behaviors/communications/socket/lsp::wsc-get-provider-path
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/installer/family/
      - id: well-known/lib/

  - id: unsigned-lsp-connect-winexec
    desc: Unsigned WinExec payload connects after LSP enum
    all:
      - id: micro-behaviors/process/create/exec::winexec
      - id: micro-behaviors/communications/socket/init::connect-api
      - id: micro-behaviors/communications/socket/lsp::wsc-enum-protocols
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/installer/family/
      - id: well-known/lib/
