defaults:
  platforms: [windows]
  for: [pe]
  attack: T1027,T1055,T1105
  mbc: B0032

composite_rules:

  - id: pyinstaller-crypto-decompression-stage
    desc: PyInstaller anti-debug encrypted stage
    crit: hostile
    conf: 0.99
    attack: T1027,T1140,T1622,T1620
    # Bootloader strings live in the PE; debugger imports also appear in
    # extracted runtime members — pool the onefile tree.
    scope: outer
    all:
      - id: micro-behaviors/fs/temp/pyinstaller::onefile-temp-bootstrap
      - id: metadata/binary/layout::large-high-entropy-overlay
      - id: micro-behaviors/process/debug/detect::is-debugger-present-import
      - id: micro-behaviors/fs/temp/pyinstaller::pyinstaller-opaque-script-entry
      - id: objectives/evasion/masquerade/versioninfo::opaque-alnum-internal-name

  - id: pyinstaller-encrypted-reloc-loader
    desc: PyInstaller loader with encrypted relocation payload
    crit: hostile
    conf: 0.98
    attack: T1027.002,T1027.009
    all:
      - id: micro-behaviors/fs/temp/pyinstaller::pyinstaller-meipass-elf
      - id: objectives/anti-static/pack/section-anomaly::reloc-encrypted-dominant-overlay
      - id: micro-behaviors/process/create/spawn::create-process-w
