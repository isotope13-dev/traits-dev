defaults:
  for: [pe]
  platforms: [windows]
traits:
  - id: compact-rwx-upx1
    desc: Compact RWX UPX1 payload section
    crit: suspicious
    conf: 0.96
    if:
      type: section
      exact: UPX1
      length_min: 32768
      length_max: 262144
      entropy_min: 7.7
      writable: true
      executable: true
    unless:
      - id: metadata/package/versioning::pe-version-resource
      - id: metadata/signed/developer/
      - id: well-known/app/storage/peazip::peazip-freearc-sfx-helper
      - id: metadata/binary/installer/sfx::freearc-sfx
      - id: well-known/tool/development/cygwin::cygwin-distribution-context
      - id: metadata/package/testing/presence/harness::binary-test-directory
      - id: well-known/tool/sysadmin/wimlib::bfi-helper
      - id: well-known/app/security/itop-vpn::benign-context
composite_rules:
  - id: compact-rwx-upx-known-upload-c2
    desc: Compact RWX UPX1 with known upload C2
    crit: hostile
    conf: 0.97
    attack: T1041,T1027.002
    all:
      - id: compact-rwx-upx1
      - id: objectives/command-and-control/infrastructure/domain/malicious::wecan-hasthe-upload-endpoint
  - id: fake-upx-memory-wrapper
    desc: Fake UPX wrapper with in-memory payload layout
    crit: suspicious
    conf: 0.97
    attack: T1027
    mbc: B0032
    all:
      - id: metadata/binary/section/entropy::large-rwx-upx1-section
      - id: metadata/binary/section/names::empty-rwx-upx0
      - id: metadata/binary/section/names::upx-section
      - id: metadata/binary/resource::minimal-resources
      - id: metadata/binary/metrics/anomaly::low-function-count-marker
      - id: objectives/anti-static/obfuscation/binary-metrics/imports::import-count-under-40
    unless:
      - id: objectives/command-and-control/dropper/execution/windows-loader/
      - id: metadata/package/versioning::pe-version-resource
      - id: metadata/signed/platform/

  # Unsigned UPX with a giant RWX payload, empty UPX0 decoy, writable entry,
  # and VirtualProtect + minimal dynamic imports — the shape used to ship
  # packed Go stealers inside SFX droppers when UPX unpack is unavailable.
  - id: upx-giant-writable-entry-dynamic-loader
    desc: Giant RWX UPX PE with writable entry and dynamic resolution
    crit: hostile
    conf: 0.97
    attack: T1027.002,T1620
    mbc: B0030
    all:
      - id: metadata/binary/section/entropy::large-rwx-upx1-section
      - id: metadata/binary/section/names::empty-rwx-upx0
      - id: metadata/binary/section/metrics::pe-entry-in-writable-section
      - id: objectives/anti-static/obfuscation/payload/import::minimal-pe-dynamic-load
      - id: micro-behaviors/mem/protect/modify::virtual-protect
    unless:
      - id: metadata/package/versioning::pe-version-resource
      - id: metadata/signed/platform/
      # Two traits report "the Authenticode signature verifies": the metrics
      # spelling below and the value spelling `-kv`. Only the latter fires on
      # a signed UPX-packed DLL, so listing one alone let the rule convict
      # signed code it explicitly means to exclude.
      - id: metadata/signed/certificate/identity::pe-signature-verified
      - id: metadata/signed/certificate/identity::pe-signature-verified-kv
      - id: well-known/tool/development/cygwin::cygwin-distribution-context
      # Canonical UPX uses this exact RWX section/entry/import geometry. Only
      # magic-stripped or otherwise altered wrappers imply a concealed loader.
      - id: objectives/anti-static/pack/upx::upx-magic-bytes
  - id: fake-upx-threaded-memory-loader
    desc: Fake UPX threaded in-memory loader
    crit: hostile
    conf: 0.98
    attack: T1620
    mbc: B0030
    all:
      - id: metadata/binary/section/entropy::large-rwx-upx1-section
      - id: metadata/binary/section/names::empty-rwx-upx0
      - id: metadata/binary/section/names::upx-section
      - id: metadata/binary/resource::minimal-resources
      - id: metadata/binary/metrics/anomaly::low-function-count-marker
      - id: objectives/anti-static/obfuscation/binary-metrics/imports::import-count-under-40
      - id: micro-behaviors/process/thread/create::create-thread
    any:
      - id: micro-behaviors/time/timing/delay::sleep-dup
      - id: micro-behaviors/dylib/load/runtime::load-library-ex-a
      - id: micro-behaviors/dylib/load/runtime::load-library-ex-w
      - id: micro-behaviors/mem/protect/modify::virtual-free
    needs: 3
    unless:
      - id: objectives/command-and-control/dropper/execution/windows-loader/
      - id: metadata/package/versioning::pe-version-resource
      - id: metadata/signed/platform/
  # Magic-stripped UPX bookend used as an in-memory loader: giant RWX UPX1,
  # empty UPX0 decoy, and a VirtualProtect resolution stub — orthogonal to
  # pure pack/upx composites so both surfaces fire for triage.
  - id: scrambled-upx-giant-memory-loader
    desc: Magic-stripped UPX giant RWX in-memory loader
    crit: hostile
    conf: 0.97
    attack: T1620
    mbc: B0030
    all:
      - id: metadata/binary/section/entropy::large-rwx-upx1-section
      - id: metadata/binary/section/names::empty-rwx-upx0
      - id: objectives/anti-static/pack/upx::scrambled-upx-header
      - id: micro-behaviors/mem/protect/modify::virtual-protect
      - id: objectives/anti-static/pack/runtime::pe-import-count-under-10
    unless:
      - id: objectives/anti-static/pack/upx::upx-magic-bytes
      - id: metadata/signed/platform/
      - id: metadata/signed/developer/
      - id: metadata/package/versioning::pe-version-resource

  - id: scrambled-upx-overlay-api-loader
    desc: Magic-stripped UPX loader with encrypted overlay and API resolution
    crit: hostile
    conf: 0.98
    attack: T1027.002,T1620
    mbc: B0030
    all:
      - id: objectives/anti-static/pack/upx::scrambled-upx-header
      - id: metadata/binary/layout::high-entropy-overlay
      - id: micro-behaviors/os/module/load::get-proc-address-import
      - id: micro-behaviors/mem/protect/modify::virtual-protect
      - id: objectives/anti-static/pack/runtime::pe-import-count-under-10
    unless:
      - id: objectives/anti-static/pack/upx::upx-magic-bytes
      - id: metadata/signed/platform/
      - id: metadata/signed/developer/
      - id: metadata/package/versioning::pe-version-resource

  - id: compact-fake-upx-memory-wrapper
    desc: Compact fake UPX wrapper with memory-loader layout
    crit: suspicious
    conf: 0.96
    attack: T1027
    mbc: B0032
    all:
      - id: compact-rwx-upx1
      - id: metadata/binary/section/names::empty-rwx-upx0
      - id: metadata/binary/section/names::upx-section
      - id: objectives/anti-static/pack/polymorphic::unusual-entry-point-section
      - id: metadata/binary/metrics/structural::single-complex-function
      - id: objectives/anti-static/obfuscation/binary-metrics/imports::import-count-under-40
    any:
      - id: micro-behaviors/mem/protect/modify::virtual-protect
      - id: micro-behaviors/os/module/load::get-proc-address-import
      - id: micro-behaviors/dylib/load/runtime::load-library-a
    needs: 2
    unless:
      - id: objectives/command-and-control/dropper/execution/windows-loader/
      - id: metadata/package/versioning::pe-version-resource
      - id: metadata/signed/platform/
  - id: compact-fake-upx-memory-loader
    desc: Compact fake UPX in-memory loader
    crit: hostile
    conf: 0.97
    attack: T1620
    mbc: B0030
    all:
      - id: compact-rwx-upx1
      - id: metadata/binary/section/names::empty-rwx-upx0
      - id: metadata/binary/section/names::upx-section
      - id: objectives/anti-static/pack/polymorphic::unusual-entry-point-section
      - id: metadata/binary/metrics/structural::single-complex-function
      - id: objectives/anti-static/obfuscation/binary-metrics/imports::import-count-under-40
      - id: micro-behaviors/mem/protect/modify::virtual-protect
    any:
      - id: micro-behaviors/os/module/load::get-proc-address-import
      - id: micro-behaviors/dylib/load/runtime::load-library-a
      - id: metadata/binary/layout::has-overlay
    needs: 2
    unless:
      - id: objectives/command-and-control/dropper/execution/windows-loader/
      - id: metadata/package/versioning::pe-version-resource
      - id: metadata/signed/platform/
  - id: upx-windowsupdate-masquerade-loader
    desc: UPX masquerade loader stages WindowsUpdate path
    crit: hostile
    conf: 0.97
    attack: T1027
    mbc: B0030
    all:
      - id: compact-rwx-upx1
      - id: objectives/anti-static/obfuscation/payload/import::minimal-pe-dynamic-load
      - id: objectives/evasion/masquerade/identity/mimicry::non-microsoft-windowsupdate-path
    any:
      - id: objectives/anti-static/obfuscation/encoding/content::encoded-mozilla-ua
      - id: micro-behaviors/dylib/load/runtime::load-library-a-string-no-import
      - id: metadata/binary/metrics/structural::dominant-section
    needs: 2
    unless:
      - id: metadata/package/versioning::pe-version-resource
      - id: metadata/signed/platform/
  - id: upx-encrypted-overlay-module-loader
    desc: UPX encrypted overlay resolves modules
    crit: hostile
    conf: 0.97
    attack: T1027.002
    mbc: B0032
    all:
      - id: compact-rwx-upx1
      - id: objectives/anti-static/obfuscation/binary-metrics/shape::binary-encrypted-overlay
      - id: objectives/anti-static/obfuscation/payload/import::minimal-pe-dynamic-load
    any:
      - id: micro-behaviors/dylib/load/runtime::load-library-a-string-no-import
      - id: micro-behaviors/process/enumerate/snapshot::dynamic-toolhelp-enumerator
      - id: xor-base64-encoded-payload
      - id: objectives/anti-static/obfuscation/binary-metrics/shape::high-entropy-overlay
    needs: 2
    downgrade:
      any:
        - id: metadata/signed/platform/
  - id: upx-dominant-overlay-apihash-loader
    desc: UPX dominant overlay hashes APIs
    crit: hostile
    conf: 0.98
    attack: T1027.002
    mbc: B0032
    all:
      - id: compact-rwx-upx1
      - id: objectives/anti-static/obfuscation/imports::pe-api-hashing-indicator-single
      - id: objectives/anti-static/obfuscation/binary-metrics/shape::high-entropy-overlay
    any:
      - id: objectives/anti-static/obfuscation/binary-metrics/shape::binary-encrypted-overlay
      - id: objectives/anti-static/obfuscation/payload/import::minimal-pe-dynamic-load
      - id: micro-behaviors/process/enumerate/snapshot::dynamic-toolhelp-enumerator
      - id: micro-behaviors/dylib/load/runtime::load-library-a-string-no-import
    needs: 2
    downgrade:
      any:
        - id: metadata/signed/platform/
        - id: metadata/package/versioning::pe-version-resource
        - id: well-known/lib/runtime/spidermonkey/
  - id: xor-base64-encoded-payload
    desc: XOR and base64 encoded payload content
    crit: suspicious
    conf: 0.8
    all:
      - id: metadata/lang/encoded/xor/
      - id: metadata/lang/encoded/base64/

  - id: fake-upx-pyinstaller-temp-loader
    desc: Fake UPX PyInstaller temp loader
    crit: hostile
    conf: 0.98
    attack: T1027.001
    mbc: B0032
    all:
      - id: objectives/anti-static/pack/upx::fake-upx-invalid-import-wrapper
      - id: micro-behaviors/fs/temp/pyinstaller::onefile-temp-bootstrap
    any:
      - id: micro-behaviors/os/module/load::get-proc-address-import
      - id: micro-behaviors/dylib/load/runtime::load-library-ex-w
      - id: micro-behaviors/mem/protect/modify::virtual-protect-text-pe
    needs: 2
    unless:
      - id: metadata/signed/platform/
      - id: metadata/package/versioning::pe-version-resource

  - id: fake-upx-pyinstaller-memory-loader
    desc: Fake UPX PyInstaller memory loader
    crit: hostile
    conf: 0.99
    attack: T1620
    mbc: B0030
    all:
      - id: objectives/anti-static/pack/upx::fake-upx-invalid-import-wrapper
      - id: micro-behaviors/fs/temp/pyinstaller::onefile-temp-bootstrap
      - id: micro-behaviors/os/module/load::get-proc-address-import
      - id: micro-behaviors/mem/protect/modify::virtual-protect-text-pe
    any:
      - id: micro-behaviors/dylib/load/runtime::load-library-ex-w
      - id: micro-behaviors/dylib/load/runtime::load-library-a-string-no-import
    unless:
      - id: metadata/signed/platform/
      - id: metadata/package/versioning::pe-version-resource
