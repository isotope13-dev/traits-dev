defaults:
  platforms: [windows]
  for: [pe, dll]
  attack: "T1027.002,T1106,T1620"
  mbc: "B0032,B0042"

composite_rules:
  # Reuse the high-confidence packer/entry profile rather than treating two
  # imported APIs as a loader. The code-only-body leg gives this dropper rule a
  # distinct staging interpretation; it does not claim that static analysis
  # recovered a payload.
  - id: unsigned-packed-native-opaque-loader
    desc: Unsigned native loader stub has an opaque code-only body
    crit: hostile
    conf: 0.98
    all:
      - id: objectives/anti-static/pack/runtime::unsigned-single-section-api-resolver
      - id: metadata/binary/metrics/structural::pe-near-total-code-data
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/framework/
      - id: metadata/binary/installer/family/
