defaults:
  platforms: [windows]
  for: [pe]

composite_rules:
  # A resource-carried command payload that is materialized through the
  # Windows temporary-file path and launched as a child process is a portable
  # update-trojan shape.  The resource and command markers are independent of
  # any vendor branding or payload filename.
  - id: resource-temp-command-process-loader
    desc: Resource payload stages a temporary command process
    crit: hostile
    conf: 0.98
    attack: T1027.009,T1059.003,T1105
    all:
      - id: objectives/anti-static/obfuscation/encoding/content::encoded-cmd-exe
      - id: micro-behaviors/data/embedded/payload/resource::find-resource-any
      - id: micro-behaviors/data/embedded/payload/resource::load-resource
      - id: micro-behaviors/process/create/spawn::create-process-a
    any:
      - id: micro-behaviors/fs/temp/directory::get-temp-path-dup
      - id: micro-behaviors/fs/file/write/direct::write-file
      - id: micro-behaviors/fs/file/delete::deletefile-a
      - id: micro-behaviors/fs/file/delete::deletefile-w
    needs: 2
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/installer/family/

  - id: encrypted-resource-overlay-process-loader
    desc: PE extracts resource data and executes it from an obfuscated overlay
    crit: hostile
    conf: 0.99
    attack: T1027.009
    all:
      - id: micro-behaviors/data/embedded/payload/resource::find-resource-any
      - id: micro-behaviors/data/embedded/payload/resource::load-resource
      - id: micro-behaviors/data/embedded/payload/resource::sizeof-resource
      - id: micro-behaviors/data/embedded/payload/resource::lock-resource
      - id: micro-behaviors/process/create/spawn::create-process-a
      - id: micro-behaviors/mem/alloc/executable::executable-allocation-indicator
      - id: metadata/binary/layout::large-overlay-1mb
      - id: objectives/anti-analysis/debugger-detect/check::is-debugger-present-symbol
    downgrade:
      any:
        - id: metadata/signed/platform/
        - id: metadata/binary/installer/family/
        - id: well-known/lib/runtime/protection/
    unless:
      - id: metadata/binary/installer/database::advanced-installer-bootstrapper
