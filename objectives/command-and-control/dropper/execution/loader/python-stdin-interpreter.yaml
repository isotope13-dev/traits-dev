# Code fetched over HTTP and piped into a fresh interpreter.
#
# `subprocess.Popen([sys.executable, "-"], stdin=PIPE)` starts Python with the
# program to run coming from stdin. Write an HTTP response into that pipe and
# the downloaded code runs as a detached process, with stdout and stderr on
# DEVNULL and no file anywhere: nothing to quarantine, nothing in the module
# the importer can read, and the parent returns immediately.
#
# The PyPI package `tablates` -- a typosquat of `tabulate` -- does this from a
# thread started by its table-formatting entry point, against a base64-decoded
# base URL. Every leg already existed; nothing joined them.
defaults:
  platforms: [unix, windows]
  for: [scripts, source]
  attack: T1059.006,T1105
  mbc: E1059

composite_rules:
  - id: python-fetched-code-piped-to-interpreter
    for: [python]
    desc: Pipes fetched code into a new interpreter
    crit: hostile
    conf: 0.96
    all:
      - id: micro-behaviors/process/create/subprocess::sys-executable-stdin-subprocess
      - id: micro-behaviors/communications/http/client/response-body/
    any:
      - id: micro-behaviors/process/create/subprocess::subprocess-detached-session
      - id: micro-behaviors/process/create/subprocess::subprocess-suppresses-stdio
      - id: micro-behaviors/communications/http/url/encoded::base64-decoded-http-url

  # Without the fetch: a detached interpreter reading its program from a pipe
  # is still a loader, just one whose source is elsewhere in the process.
  - id: python-detached-stdin-interpreter-spawn
    for: [python]
    desc: Spawns a detached interpreter reading stdin
    crit: suspicious
    conf: 0.92
    all:
      - id: micro-behaviors/process/create/subprocess::sys-executable-stdin-subprocess
      - id: micro-behaviors/process/create/subprocess::subprocess-detached-session
      - id: micro-behaviors/process/create/subprocess::subprocess-suppresses-stdio
