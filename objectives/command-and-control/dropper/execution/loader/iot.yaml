# Native IoT loaders commonly daemonize after retrieving a stage.
defaults:
  platforms: [unix]
  for: [elf]
  attack: T1105,T1059.004
  mbc: B0024,E1105

composite_rules:
  - id: raw-ip-daemonized-payload-loader
    desc: Native raw-IP downloader daemonizes and executes payload
    crit: hostile
    conf: 0.99
    all:
      - id: micro-behaviors/communications/http/get::manual-http10-dynamic-get
      - id: micro-behaviors/communications/ip/literal::external-ipv4-binary
      - id: micro-behaviors/process/daemonize/detach::full-daemon
      - id: micro-behaviors/process/create/execv::c-exec-variants
  - id: native-http-download-execute-cleanup-loader
    desc: Native ELF fetches from a hardcoded endpoint, executes, and removes the stage
    crit: hostile
    conf: 0.99
    attack: T1105,T1071.001,T1106,T1070.004
    mbc: B0024,C0047
    all:
      - id: micro-behaviors/communications/http/get::manual-http10-dynamic-get
      - id: micro-behaviors/communications/ip/endpoint::external-ipv4-port-elf
      - id: micro-behaviors/process/fork/clone::fork
      - id: micro-behaviors/process/create/execv::c-exec-variants
      - id: micro-behaviors/fs/file/delete::unlink
