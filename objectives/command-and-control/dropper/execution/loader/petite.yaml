# Petite-packed executable with a large encoded overlay and runtime API
# resolution. This is a generic memory-loader pattern; VB6-specific evidence
# belongs in petite-vb6.yaml.
defaults:
  platforms: [windows]
  for: [pe]
  attack: T1027.002
  mbc: B0032

composite_rules:
  - id: petite-encoded-overlay-runtime-loader
    desc: Petite-packed executable resolves APIs around encoded overlay
    crit: hostile
    conf: 0.98
    attack: "T1027.002,T1027.013,T1620"
    all:
      - id: objectives/anti-static/pack/petite::petite-encoded-overlay-loader
      - id: objectives/anti-static/obfuscation/payload/import::pe-dynamic-resolution
      - id: objectives/anti-static/obfuscation/payload/encoded::custom-alphabet-encoded-blob
      - id: micro-behaviors/mem/protect/modify::virtual-memory-allocation-protection-api-pair
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/installer/family/
