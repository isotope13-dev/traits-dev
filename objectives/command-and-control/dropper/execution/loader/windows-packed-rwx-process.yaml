defaults:
  platforms: [windows]
  for: [pe, dll]
  attack: T1027.002
  mbc: B0032

composite_rules:
- id: packed-rwx-process-cleanup-loader
  desc: Packed RWX loader with process launch and file cleanup
  crit: hostile
  conf: 0.99
  all:
  - id: objectives/anti-static/pack/section-anomaly::rwx-writable-entry-payload
  - id: micro-behaviors/process/create/spawn::create-process-a
  - id: micro-behaviors/process/create/exec::shell-execute-a
  - id: micro-behaviors/fs/file/delete::deletefile-a
  any:
  - id: metadata/binary/layout::pe-checksum-mismatch
  - id: micro-behaviors/communications/ipc/message::local-atom-table-readback
  unless:
  - id: metadata/signed/platform/
