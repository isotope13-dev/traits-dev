defaults:
  platforms: [windows]
  for: [pe]
composite_rules:
  - id: delphi-packed-overlay-dropper
    desc: Delphi packed wrapper/dropper with large overlay payload
    crit: hostile
    conf: 0.95
    scope: file
    all:
      - id: metadata/binary/layout::pe-embedded
      - id: metadata/binary/layout::overlay-dominates-third
    any:
      - id: metadata/lang/compiler/managed::delphi-kol-pas-source-path
      - id: metadata/lang/compiler/managed::borland-rtl-regkey
    unless:
      - id: well-known/app/storage/peazip::peazip-inno-uninstaller
      - id: metadata/binary/installer/script::nsis
      - id: metadata/binary/installer/script::nullsoft-install-system
      - id: well-known/tool/sysadmin/npcap::npcap-installer
      - id: well-known/tool/sysadmin/npcap::npcap-installer-context
