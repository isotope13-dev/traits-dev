defaults:
  platforms: [windows]
  for: [pe]
  attack: T1105

composite_rules:
- id: vb6-embedded-shell-apihash-loader
  desc: VB6 shell loader embeds hashed payload
  crit: hostile
  conf: 0.96
  all:
  - id: micro-behaviors/process/create/shell/lang::vb6-shell-execution
  - id: metadata/binary/layout::pe-embedded
  any:
  - id: objectives/anti-static/obfuscation/imports::pe-walk-hash-resolver-x64
  - id: metadata/binary/metrics/structural::malformed-pe-structure
  - id: micro-behaviors/communications/ip/endpoint::external-ipv4-port-rdata-pair
  - id: micro-behaviors/dylib/load/runtime::load-library-a-string-no-import
  needs: 2
- id: vb6-urlmon-hollowing-loader
  desc: VB6 URLMon downloader with process hollowing
  crit: hostile
  conf: 0.97
  all:
  - id: metadata/binary/framework::vb6-application-framework
  - id: micro-behaviors/communications/http/get::url-download-to-file-str
  - id: objectives/evasion/process/injection/hollowing::process-hollowing-alloc-write-marker
  any:
  - id: micro-behaviors/communications/http/get::delete-url-cache-entry
  - id: metadata/binary/metrics/structural::malformed-pe-structure
  - id: micro-behaviors/data/string/runtime::vb6-runtime-string-decoding
  needs: 2

# RFDxNew and related VB6 loaders append a complete carrier executable behind
# a small native stub.  The stub keeps URLMon and its Win32 operations as
# strings for late dispatch, while the dominant overlay holds the next image.
# Requiring all of those mechanics distinguishes it from ordinary VB6
# downloaders and from signed self-extracting installers.
- id: vb6-concealed-overlay-downloader
  desc: VB6 concealed downloader wraps appended PE payload
  crit: hostile
  conf: 0.98
  attack: T1027.009,T1105
  all:
  - id: metadata/binary/framework::vb6-application-framework
  - id: metadata/binary/layout::pe-embedded
  - id: micro-behaviors/communications/http/get::url-download-to-file-str
  - id: objectives/anti-static/obfuscation/imports::vb6-obfuscated-runtime-dispatch
  - id: objectives/command-and-control/dropper/staging/stub::overlay-body-stub-executable
  - id: metadata/signed/trust-level::unsigned-missing-signature-record
  unless:
  - id: metadata/signed/platform/
  - id: metadata/binary/installer/family/
  - id: well-known/tool/
