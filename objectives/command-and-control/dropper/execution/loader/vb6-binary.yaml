    - id: micro-behaviors/fs/write/file/handle::vb6-binary-file-write

# Both legs are near-universal in Windows GUI binaries: `ShellExecute` appears
# in any shell-integration app, and the UTF-16 `exe` token is present in the
# .text of every managed assembly whose user-string heap mentions a filename.
# Without the VB6 framework leg this convicted ContextMenuManager, a .NET
# context-menu editor whose whole purpose is editing ShellExecute commands.
- id: vb6-shellexec-exe-drop
  desc: VB6 ShellExecute dropper stages an exe payload
  crit: hostile
  conf: 0.93
  attack: T1059
  unless:
    - id: metadata/signed/platform/
    - id: metadata/binary/installer/family/
    - id: well-known/lib/runtime/native-platform/vb-richclient::vb-richclient-runtime-library
  all:
