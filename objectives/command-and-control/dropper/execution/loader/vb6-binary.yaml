defaults:
  crit: hostile
  platforms: [windows]
  for: [pe]
  attack: T1105

composite_rules:
- id: vb6-embedded-shell-apihash-loader
  desc: VB6 shell loader embeds hashed payload
  crit: hostile
  conf: 0.96
  all:
  - id: micro-behaviors/process/create/macro/office::vb6-shell-execution
  - id: metadata/binary/layout/embedded::pe-embedded
  any:
  - id: objectives/anti-static/obfuscation/imports::pe-walk-hash-resolver-x64
  - id: metadata/binary/header/malformed::malformed-pe-structure
  - id: micro-behaviors/communications/ip/endpoint::external-ipv4-port-rdata-pair
  - id: micro-behaviors/dylib/load/runtime::load-library-a-string-no-import
  needs: 2
- id: vb6-urlmon-hollowing-loader
  desc: VB6 URLMon downloader with process hollowing
  crit: hostile
  conf: 0.97
  all:
  - id: metadata/binary/framework::vb6-application-framework
  - id: micro-behaviors/communications/http/client/urlmon::url-download-to-file-str
  - id: objectives/evasion/process/injection/hollowing::process-hollowing-alloc-write-marker
  any:
  - id: micro-behaviors/communications/http/client/wininet::delete-url-cache-entry
  - id: metadata/binary/header/malformed::malformed-pe-structure
  - id: micro-behaviors/data/string/runtime::vb6-runtime-string-decoding
  needs: 2

- id: vb6-obfuscated-runkey-persistence
  desc: VB6 obfuscated loader writes a Run key
  crit: hostile
  conf: 0.96
  attack: T1547.001,T1027
  unless:
    - id: metadata/signed/platform/
    - id: metadata/binary/installer/family/
    - id: well-known/lib/runtime/native-platform/vb-richclient::vb-richclient-runtime-library
  all:
    - id: objectives/anti-static/obfuscation/imports::vb6-obfuscated-runtime-dispatch
    - id: micro-behaviors/os/registry/keys::currentversion-run

- id: vb6-obfuscated-wininet-downloader
  desc: VB6 obfuscated loader downloads over WinINet
  crit: hostile
  conf: 0.96
  attack: T1105,T1027
  unless:
    - id: metadata/signed/platform/
    - id: well-known/lib/runtime/native-platform/vb-richclient::vb-richclient-runtime-library
  all:
    - id: objectives/anti-static/obfuscation/imports::vb6-obfuscated-runtime-dispatch
    - id: micro-behaviors/communications/http/client/wininet::dynamic-wininet-api-set--internetopenurla

- id: vb6-obfuscated-keylogger
  desc: VB6 obfuscated loader labels itself a keylogger
  crit: hostile
  conf: 0.95
  attack: T1056.001,T1027
  unless:
    - id: metadata/signed/platform/
    - id: well-known/lib/runtime/native-platform/vb-richclient::vb-richclient-runtime-library
    - id: well-known/tool/detection/
  all:
    - id: objectives/anti-static/obfuscation/imports::vb6-obfuscated-runtime-dispatch
    - id: micro-behaviors/hardware/input/keyboard/label::keylogger-identity-label

- id: vb6-concealed-keylogger
  desc: VB6 conceals Win32 APIs in a self-labeled keylogger
  crit: hostile
  conf: 0.95
  attack: T1056.001,T1027
  unless:
    - id: metadata/signed/platform/
    - id: well-known/lib/runtime/native-platform/vb-richclient::vb-richclient-runtime-library
    - id: well-known/tool/detection/
  all:
    - id: objectives/anti-static/obfuscation/imports::vb6-concealed-win32-apis
    - id: micro-behaviors/hardware/input/keyboard/label::keylogger-identity-label

- id: vb6-toolhelp-hosts-loader
  desc: VB6 hosts-file implant walks the process list
  crit: hostile
  conf: 0.95
  attack: T1057,T1565.001
  unless:
    - id: metadata/signed/platform/
  all:
    - id: objectives/anti-static/obfuscation/imports::vb6-obfuscated-runtime-dispatch
    - id: micro-behaviors/process/enumerate/snapshot::dynamic-toolhelp-process-traversal

- id: vb6-concealed-wininet-cluster
  desc: VB6 conceals Win32 APIs then talks WinINet
  crit: hostile
  conf: 0.95
  attack: T1105,T1027
  unless:
    - id: metadata/signed/platform/
    - id: well-known/lib/runtime/native-platform/vb-richclient::vb-richclient-runtime-library
  all:
    - id: objectives/anti-static/obfuscation/imports::vb6-concealed-win32-apis
    - id: micro-behaviors/communications/http/dynamic::dynamic-wininet-http-api-cluster

- id: vb6-ie-masquerade-shell
  desc: VB6 shell dropper masquerades as Internet Explorer
  crit: hostile
  conf: 0.94
  attack: T1036.005,T1059
  unless:
    - id: metadata/signed/platform/
  all:
    - id: micro-behaviors/process/create/macro/office::vb6-shell-execution
    - id: objectives/evasion/masquerade/process/name::internet-explorer-name

- id: vb6-numbered-ie-masquerade
  desc: VB6 numbered-identifier loader spoofs Internet Explorer
  crit: hostile
  conf: 0.94
  attack: T1036.005,T1027
  unless:
    - id: metadata/signed/platform/
    - id: well-known/lib/runtime/native-platform/vb-richclient::vb-richclient-runtime-library
  all:
    - id: objectives/anti-static/obfuscation/string/junking::vb6-numbered-identifier-obfuscation-profile
    - id: objectives/evasion/masquerade/process/name::internet-explorer-name

- id: vb6-obfuscated-http-url
  desc: VB6 obfuscated loader embeds a cleartext HTTP URL
  crit: hostile
  conf: 0.93
  attack: T1071.001,T1027
  unless:
    - id: metadata/signed/platform/
    - id: well-known/lib/runtime/native-platform/vb-richclient::vb-richclient-runtime-library
  all:
    - id: objectives/anti-static/obfuscation/imports::vb6-obfuscated-runtime-dispatch
    - id: micro-behaviors/communications/http/url/scheme::cleartext-http-url

- id: vb6-concealed-shellexec
  desc: VB6 conceals Win32 APIs then ShellExecute
  crit: hostile
  conf: 0.94
  attack: T1059,T1027
  unless:
    - id: metadata/signed/platform/
    - id: well-known/lib/runtime/native-platform/vb-richclient::vb-richclient-runtime-library
  all:
    - id: objectives/anti-static/obfuscation/imports::vb6-concealed-win32-apis
    - id: micro-behaviors/process/create/shellexec::shell-execute-call

- id: vb6-obfuscated-shellexec
  desc: VB6 obfuscated loader calls ShellExecute
  crit: hostile
  conf: 0.94
  attack: T1059,T1027
  unless:
    - id: metadata/signed/platform/
    - id: well-known/lib/runtime/native-platform/vb-richclient::vb-richclient-runtime-library
  all:
    - id: objectives/anti-static/obfuscation/imports::vb6-obfuscated-runtime-dispatch
    - id: micro-behaviors/process/create/shellexec::shell-execute-call
