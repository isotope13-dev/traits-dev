# .NET encrypted-stage reflective loader with a shipped (non-derived) key.
#
# A managed stub decrypts a stage with a symmetric key taken straight from a
# string literal (no KDF, no IV -- the same key ships in every build) and hands
# the plaintext to Assembly.Load, so the real payload never lands on disk in
# cleartext. QuickFox's FDMTP Gen-2 loader decrypted update.bin with AES-128-ECB
# under a hardcoded key, then reflectively loaded the implant. The existing
# aes-reflective-stage-dropper requires a password KDF (Rfc2898) or an inline
# base64 PE; this class is the opposite -- a decryptor that ships its raw key --
# and generalizes to any .NET crypter that pairs a shipped-key symmetric decrypt
# with reflective assembly loading.
defaults:
  platforms: [windows]
  for: [csharp, pe, dll]
  attack: T1620,T1140
  mbc: B0032

composite_rules:
  - id: dotnet-shipped-key-reflective-load
    desc: Shipped-key symmetric decrypt feeds reflective assembly load
    crit: hostile
    conf: 0.94
    scope: file
    near_lines: 40
    all:
      - id: objectives/command-and-control/dropper/staging/encrypted::dotnet-ecb-static-key-decrypt
      - id: micro-behaviors/process/interpreter/reflection/resolve::assembly-load-buffer
