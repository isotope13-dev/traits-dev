# C# source shape of a remote in-memory .NET stage loader: fetch a payload
# with WebClient, base64-decode it, Assembly.Load the bytes, and invoke the
# reflected entry point — the Operation RepoGhost mid4 chain (stager pulled
# from a Pastebin/raw-IP host, .NET stage executed entirely in memory) and
# the generic shape of countless C# stagers since. Each leg alone is a
# legitimate .NET capability; holding all five inside one narrow window is
# a fileless loader with no benign counterpart.
defaults:
  for: [csharp]
  platforms: [windows]
  attack: "T1105,T1620"
  mbc: "E1620"

composite_rules:
  - id: csharp-download-base64-assembly-invoke
    desc: C# downloads, decodes, and reflectively invokes an assembly
    crit: hostile
    conf: 0.97
    all:
      - id: micro-behaviors/communications/http/client/managed::webclient
      - id: micro-behaviors/communications/http/client/managed::downloadstring
      - id: micro-behaviors/data/decode/base64::dotnet-frombase64string-text
      - id: micro-behaviors/process/interpreter/reflection/resolve::assembly-load
      - id: micro-behaviors/process/interpreter/reflection/runtime::csharp-reflection-invoke-call
    near_bytes: 1024
