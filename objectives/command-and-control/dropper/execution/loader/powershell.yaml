# A PowerShell script that both (a) marshals bytes into unmanaged memory via
# P/Invoke and (b) reflectively loads and invokes a .NET assembly built from
# decoded bytes is staging a second-stage payload entirely in memory. Neither
# half has an ordinary automation use on its own -- native memory marshaling
# in PowerShell exists in a handful of legitimate low-level modules, and
# Assembly.Load(byte[]) shows up in some plugin hosts, but the combination
# (stage bytes into unmanaged memory, then hand a decoded blob to
# Assembly.Load and invoke a method pulled out of it via reflection) is the
# in-memory .NET loader shape used across commodity crypters and loaders,
# independent of which specific host process or API names the sample picks.
defaults:
  platforms: [windows]
  for: [powershell]
  attack: T1027.002,T1055.012,T1620
  mbc: B0009.014

composite_rules:
  - id: powershell-inmemory-reflective-dotnet-loader
    desc: PowerShell stages unmanaged memory and reflectively loads a .NET payload
    crit: hostile
    conf: 0.97
    all:
      - id: micro-behaviors/mem/c-runtime/functions::marshal-copy-powershell
      - id: micro-behaviors/process/interpreter/reflection/runtime::obfuscated-powershell-assembly-load
      - id: micro-behaviors/process/interpreter/reflection/runtime::powershell-assembly-method-invoke
    unless:
      - id: well-known/tool/development/
      - id: well-known/dual-use/remote-admin/
