defaults:
  platforms: [windows, unix]
  for: [class, java_class]
  attack: T1059,T1106
  mbc: B0011

traits:
  # Method name the relaunched JVM calls to hand the collected context to the
  # staged payload. A bare identifier is not a capability -- it means nothing
  # outside this staging chain -- so it stays a component here rather than
  # posing as a process-launch API under micro-behaviors/.
  - id: stage-with-context-method-name
    desc: stageWithContext staging method name
    crit: component
    conf: 0.9
    for: [class, java_class, jar, zip]
    if:
      type: value
      path: class.strings[*]
      exact: stageWithContext

composite_rules:
  - id: java-javaw-processbuilder-jar-relaunch
    desc: ProcessBuilder relaunches a JAR through javaw
    crit: suspicious
    conf: 0.95
    attack: T1059
    all:
      - id: micro-behaviors/process/create/spawn::java-processbuilder-start-bytecode-symbol
      - id: micro-behaviors/process/create/launch::javaw-exe-literal
      - id: micro-behaviors/process/create/launch::java-jar-flag-literal

  - id: java-self-jar-javaw-relaunch
    desc: Self JAR path relaunched via javaw ProcessBuilder
    crit: hostile
    conf: 0.98
    all:
      - id: java-javaw-processbuilder-jar-relaunch
      - id: micro-behaviors/process/info/current::protection-domain-self-path

  # Obfuscated variant of java-self-jar-javaw-relaunch: the launcher literals
  # ("javaw.exe", "-jar") are held hex-encoded and rebuilt at run time, so the
  # plaintext composite above misses it. What stays visible is the shape --
  # resolve the running JAR through ProtectionDomain, locate the interpreter
  # through java.home, and start a process -- and that shape carrying encoded
  # constants has no benign form: legitimate self-relaunchers (updaters, JVM
  # bootstrappers) spell their command line out in clear text.
  - id: java-obfuscated-self-jar-relaunch
    desc: Obfuscated class relaunches its own JAR
    crit: hostile
    conf: 0.96
    attack: T1059,T1027
    all:
      - id: micro-behaviors/process/info/current::protection-domain-self-path
      - id: micro-behaviors/process/create/spawn::java-processbuilder-start-bytecode-symbol
      - id: micro-behaviors/process/create/launch::java-home-property-literal
      - id: metadata/file/encoded::multiple-hex-class-literals

  # The original JVM is deliberately terminated after the obfuscated child is
  # started.  This narrower process-launch/exit chain remains independent of
  # the self-path composite above, while a normal System.exit call alone stays
  # neutral.
  - id: java-obfuscated-process-launch-exit
    desc: Obfuscated Java process launch followed by parent exit
    crit: hostile
    conf: 0.97
    attack: T1059,T1027
    all:
      - id: micro-behaviors/process/create/spawn::java-processbuilder-start-bytecode-symbol
      - id: micro-behaviors/process/create/launch::java-home-property-literal
      - id: metadata/file/encoded::multiple-hex-class-literals
      - id: micro-behaviors/process/exit/terminate::jvm-system-exit-bytecode

  - id: java-obfuscated-stage-handoff
    desc: Obfuscated decrypt hands off to staged Java payload
    crit: hostile
    conf: 0.97
    attack: T1059,T1027
    all:
      - id: java-javaw-processbuilder-jar-relaunch
      - id: stage-with-context-method-name
      - id: objectives/anti-static/obfuscation/string/encoding::java-int-array-string-decrypt-descriptor
