# Unsigned WinInet downloaders that wipe the URL cache, copy a file, and
# create a process are stagers, not browsers: the cache wipe hides the fetch.
defaults:
  platforms: [windows]
  for: [pe]
  attack: T1105,T1070.004
  crit: hostile
  conf: 0.94

composite_rules:
  - id: wininet-cache-wipe-exec
    desc: WinInet cache wipe then creates a process
    all:
      - id: micro-behaviors/communications/http/client/wininet::delete-url-cache-entry
      - id: micro-behaviors/process/create/spawn::create-process-a
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/installer/family/
      - id: well-known/lib/

  - id: wininet-cache-wipe-copy
    desc: WinInet cache wipe then copies a file
    all:
      - id: micro-behaviors/communications/http/client/wininet::delete-url-cache-entry
      - id: micro-behaviors/fs/file/copy::copyfile-a
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/installer/family/
      - id: well-known/lib/

  - id: wininet-cache-wipe-registry
    desc: WinInet cache wipe then writes registry keys
    all:
      - id: micro-behaviors/communications/http/client/wininet::delete-url-cache-entry
      - id: micro-behaviors/os/registry/manipulate::registry-write-api-chain
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/installer/family/
      - id: well-known/lib/

  - id: wininet-http-runkey
    desc: WinInet HTTP client writes a Run key
    attack: T1105,T1547.001
    all:
      - id: micro-behaviors/communications/http/client/wininet::wininet-http-flow
      - id: micro-behaviors/os/registry/keys::currentversion-run
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/installer/family/
      - id: well-known/lib/
      - id: metadata/binary/debug::pdb-remcos-backdoor-tree

  - id: wininet-http-shellexec
    desc: WinInet HTTP client launches via ShellExecuteEx
    attack: T1105,T1059
    all:
      - id: micro-behaviors/communications/http/client/wininet::wininet-http-flow
      - id: micro-behaviors/process/create/shellexec::shell-executeex-call
    unless:
      - id: metadata/signed/trust-level::signer-evidence-present
      - id: metadata/signed/platform/
      - id: metadata/binary/installer/family/
      - id: well-known/lib/
      # A compiled AutoIt script links the whole interpreter: InetGet/InetRead
      # pull in the WinInet flow and ShellExecute() pulls in ShellExecuteEx,
      # so both imports are present in every AutoIt binary by construction.
      - id: metadata/lang/compiled::autoit-binary
      - id: metadata/binary/debug::pdb-remcos-backdoor-tree
      - id: metadata/binary/section/label::cape-sandbox-dump-section

  - id: unsigned-shellexec-form-header
    desc: ShellExecuteEx downloader embeds a form POST header
    attack: T1105,T1071.001
    all:
      - id: micro-behaviors/process/create/shellexec::shell-executeex-call
      - id: objectives/command-and-control/dropper/delivery/download::form-urlencoded-header
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/installer/family/
      - id: well-known/lib/

  - id: unsigned-shellexec-regsvr32
    desc: ShellExecuteEx dropper also invokes regsvr32
    all:
      - id: micro-behaviors/process/create/shellexec::shell-executeex-call
      - id: micro-behaviors/process/create/launch::regsvr32
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/installer/family/
      - id: well-known/lib/
