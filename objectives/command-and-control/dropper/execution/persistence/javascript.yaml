defaults:
  platforms:
  - linux
  - macos
  - windows
  for:
  - javascript
  - typescript
composite_rules:
- id: node-http-temp-exec-autorun-profile
  desc: Node HTTP temp-exec and autorun clues
  crit: suspicious
  conf: 0.98
  all:
  - id: micro-behaviors/communications/http/download/handler::node-http-stream-to-file
  - id: objectives/command-and-control/dropper/node-bootstrap::exec-downloaded-raw
  any:
  - id: objectives/persistence/login/registry/autostart::currentversion-run-key-path
  - id: objectives/persistence/login/xdg::xdg-persistence
  - id: objectives/persistence/system/launchd/interpreter::launchd-js-runatload-installer
  unless:
  - id: metadata/package/testing/
  - id: well-known/app/ai/coding-agent/pixcode::benign-runtime-context
  - id: well-known/app/ai/coding-agent/pixcode::benign-archive-context
