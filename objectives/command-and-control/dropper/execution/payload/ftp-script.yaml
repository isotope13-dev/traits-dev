defaults:
  platforms: [windows]
  for: [text, batch, cmd]
  attack: T1059.003,T1218

composite_rules:
  - id: ftp-script-binary-reconstruction-dropper
    desc: FTP local-command script reconstructs and launches an executable
    crit: hostile
    conf: 0.99
    mbc: B0024
    all:
      - id: micro-behaviors/communications/ftp/control::ftp-local-shell-command-sequence
      - id: micro-behaviors/fs/file/copy::cmd-binary-file-concatenation
      - id: micro-behaviors/process/create/launch::ftp-script-starts-executable
