defaults:
  platforms: [windows]
  for: [pe, dll]

traits:
  - id: stack-resolved-temp-pe-drop-api-chain
    desc: Resolves temp-file write and execution APIs
    crit: suspicious
    conf: 0.98
    if:
      type: hex
      pattern: '81 F9 57 69 6E 45 [0-32] 81 F9 43 6C 6F 73 [0-48] 81 F9 57 72 69 74 [0-48] 81 F9 43 72 65 61 [0-48] 81 F9 47 65 74 54'
      offset_range: [0, null]

composite_rules:
  - id: parasitic-entrypoint-embedded-pe-dropper
    desc: Parasitic entrypoint drops an embedded PE
    crit: hostile
    conf: 0.98
    attack: T1554,T1027.009,T1204.002
    all:
      - id: objectives/impact/infect/binary/rewrite::oep-restoration-patch-write
      - id: micro-behaviors/data/format/pe-parser::mz-nop-header-scan
      - id: stack-resolved-temp-pe-drop-api-chain
    unless:
      - id: metadata/signed/platform/
