# Native-binary stealth dropper (Node.js).
#
# A JavaScript module that downloads a file to disk, marks it executable, and
# launches it as a detached/output-suppressed process. This is the
# language-agnostic dropper shape used by npm supply-chain loaders that fetch a
# compiled stealer/implant from a code-hosting release and run it out-of-band.
#
# Behavior over IOCs: no hash, URL, package name, or guard-tag literal is keyed.
# The signal is the data-flow shape fetch -> chmod +x -> run, which survives
# obfuscation-seed rotation, account rotation, and filename changes.
#
# FP boundary: benign binary-wrapper packages (esbuild, @vscode/ripgrep,
# playwright) also download + chmod + spawn a platform binary, but they run it
# ATTACHED with inherited/piped stdio to surface its output. The stealth
# execution leg (detached + stdio:'ignore' / windowsHide, or an execPath
# self-respawn) is the discriminator — a wrapper has no reason to hide its tool.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  attack: T1105
  mbc: B0024
composite_rules:
  - id: npm-postinstall-configurable-native-stager
    desc: npm postinstall stages configurable native payload
    crit: hostile
    conf: 0.98
    scope: archive
    attack: "T1195.002,T1105,T1222.002"
    all:
      - id: objectives/supply-chain/install-hook/package/manifest::postinstall-runs-node-script
      - id: objectives/supply-chain/trojanized/app/remote-install::configurable-release-server-url
      - id: objectives/supply-chain/trojanized/app/remote-install::large-binary-size-threshold
      - id: micro-behaviors/communications/http/request/client::https-get
      - id: micro-behaviors/fs/chmod/executable/mode::node-chmod-exec-mode-755
      - id: micro-behaviors/process/create/shell/bridge::js-execsync

  - id: node-fetch-chmod-exec-stealth-dropper
    desc: Node downloads a binary, makes it executable, runs it hidden
    crit: hostile
    conf: 0.95
    attack: "T1105, T1059.007, T1564.003"
    mbc: "B0024, F0011"
    near_bytes: 8192
    all:
      - id: micro-behaviors/communications/http/download/handler::node-http-stream-to-file
      - id: micro-behaviors/fs/chmod/executable/mode::node-chmod-make-executable
    any:
      - id: micro-behaviors/process/create/spawn::detached-ignored-unref-spawn
      - id: micro-behaviors/process/create/spawn::node-self-respawn
    needs: 1
    unless:
      - id: metadata/package/testing/
      - id: metadata/package/testing/presence/harness/
      - id: metadata/library/structure/
      - id: metadata/package/quality/benign-context::benign-app-fp-context

  # Some loaders buffer an HTTPS response before writing it, rather than
  # piping the response directly to disk.  The same hidden detached launch is
  # still the discriminator from an ordinary native dependency wrapper.
  - id: node-fetch-writefile-chmod-execfile-stealth-dropper
    desc: Node writes and stealth-launches fetched executable
    crit: hostile
    conf: 0.98
    attack: "T1105,T1059.007,T1222.002,T1564.003"
    mbc: "B0024,F0011"
    near_bytes: 8192
    all:
      - id: micro-behaviors/communications/http/request/client::https-get
      - id: micro-behaviors/fs/file/write/direct::node-write-file-sync
      - id: micro-behaviors/fs/chmod/executable/mode::node-chmod-exec-mode-755
      - id: micro-behaviors/process/create/system::js-execfile-call
      - id: micro-behaviors/process/create/spawn::detached-ignored-unref-spawn
    unless:
      - id: metadata/package/testing/
      - id: metadata/package/testing/presence/harness/
      - id: metadata/library/structure/
      - id: metadata/package/quality/benign-context::benign-app-fp-context

  # Promise-style spelling of the same chain: `fetch()`, `node:fs/promises`
  # writeFile/chmod through destructured imports, and `execFile(binary, [],
  # { detached: true, stdio: 'ignore' })`. The composites around it are keyed
  # to `https.get`, `writeFileSync` and a `spawn().unref()`, none of which a
  # promise-style loader writes, so the family scored such a loader at nothing
  # — every step of it was individually notable and never joined up. The
  # stealth-launch legs remain the discriminator against a binary wrapper,
  # which runs its tool attached; a verifying installer (sigstore attestation
  # check before the write) never launches the binary at install time at all.
  - id: node-fetch-promise-chmod-execfile-stealth-dropper
    desc: Node fetch chmods and stealth-launches a payload
    crit: hostile
    conf: 0.96
    attack: "T1105,T1059.007,T1222.002,T1564.003"
    mbc: "B0024,F0011"
    near_bytes: 8192
    all:
      - id: micro-behaviors/communications/http/request/client::js-fetch-call
      - id: micro-behaviors/fs/file/write/async::node-write-file-promise-destructured
      - id: micro-behaviors/fs/chmod/modify::node-chmod-call
      - id: micro-behaviors/process/create/system::js-execfile-call
      - id: micro-behaviors/process/create/spawn::detached-true
      - id: micro-behaviors/process/create/spawn::stdio-ignore
    unless:
      - id: metadata/package/testing/
      - id: metadata/package/testing/presence/harness/
      - id: metadata/library/structure/
      - id: metadata/package/quality/benign-context::benign-app-fp-context

  # Buffered-response variant: the loader keeps the response in memory and
  # uses writeFileSync, so it does not expose the stream-to-file atom above or
  # need execFile. Tie the write to the evented response before requiring chmod
  # +x and an output-suppressed, detached spawn; a separate config write must
  # not combine with an unrelated HTTPS request.
  - id: node-fetch-writefile-chmod-detached-spawn
    desc: Node writes and detaches a fetched executable
    crit: hostile
    conf: 0.99
    attack: "T1105,T1059.007,T1222.002,T1564.003"
    mbc: "B0024,F0011"
    near_bytes: 8192
    all:
      - id: micro-behaviors/communications/http/request/client::https-get
      - id: micro-behaviors/communications/http/response::node-response-to-file
      - id: micro-behaviors/fs/chmod/executable/mode::node-chmod-make-executable
      - id: micro-behaviors/process/create/spawn::detached-ignored-unref-spawn
    unless:
      - id: metadata/package/testing/
      - id: metadata/package/testing/presence/harness/
      - id: metadata/library/structure/
      - id: metadata/package/quality/benign-context::benign-app-fp-context
  - id: npm-postinstall-archive-detached-native-dropper
    desc: npm postinstall extracts and detaches a downloaded native payload
    crit: hostile
    conf: 0.99
    scope: archive
    attack: "T1195.002,T1105,T1059.007,T1564.003"
    all:
      - id: objectives/supply-chain/install-hook/package/manifest::postinstall-runs-node-script
      - id: micro-behaviors/communications/http/download/handler::node-http-stream-to-file-text
      - id: micro-behaviors/data/archive/extract/zip::powershell-expand-archive-unicode
      - id: micro-behaviors/process/create/spawn-minified::detached-bang-true
      - id: micro-behaviors/fs/write/file/direct::create-write-stream
