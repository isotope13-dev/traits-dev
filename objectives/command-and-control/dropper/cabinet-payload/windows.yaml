# Follow-on cabinet dropper pairings kept out of delivery/cab/ so that
# directory stays under the taxonomy size cap.
defaults:
  platforms: [windows]
  for: [cab, pe]
  attack: T1027.013,T1204.002
  crit: hostile
  conf: 0.94

composite_rules:
  - id: cab-com-bound-imports
    desc: Cabinet wraps VB6 COM with bound imports
    scope: archive
    all:
      - id: objectives/command-and-control/dropper/delivery/cab::cab-container-format
      - id: metadata/package/files/archive-member::archive-com-member
      - id: metadata/build/artifact::pe-bound-imports-present
    unless:
      - id: metadata/signed/platform/

  - id: cab-vb6-bound-imports
    desc: Cabinet wraps VB6 with bound imports
    scope: archive
    all:
      - id: objectives/command-and-control/dropper/delivery/cab::cab-container-format
      - id: metadata/file/archive::archive-misplaced-executable-member
      - id: metadata/build/artifact::pe-bound-imports-present
    unless:
      - id: metadata/signed/platform/

  - id: cab-tiny-manual-map
    desc: Cabinet wraps a tiny manual-map stub
    scope: archive
    all:
      - id: objectives/command-and-control/dropper/delivery/cab::cab-container-format
      - id: metadata/binary/resource/size::small-pe-no-resources
      - id: objectives/command-and-control/backdoor/loader/native-reflect::x86-manual-pe-mapper
    unless:
      - id: metadata/signed/platform/

  - id: cab-dotnet-zero-checksum
    desc: Cabinet wraps a zero-checksum managed stub
    scope: archive
    all:
      - id: objectives/command-and-control/dropper/delivery/cab::cab-container-format
      - id: metadata/binary/framework::mscoree-name
      - id: metadata/binary/layout/checksum::pe-checksum-zeroed
    unless:
      - id: metadata/signed/platform/

  - id: cab-png-entropy-dropper
    desc: Cabinet wraps a high-entropy PNG-resource PE
    scope: archive
    all:
      - id: objectives/command-and-control/dropper/delivery/cab::cab-container-format
      - id: metadata/binary/resource/embedded-media::png-magic-in-text
      - id: metadata/binary/layout/entropy::high-overall-entropy-70
    unless:
      - id: metadata/signed/platform/

  - id: cab-percent-bat-dropper
    desc: Cabinet wraps percent-sliced batch
    scope: archive
    for: [cab, batch, pe]
    all:
      - id: objectives/command-and-control/dropper/delivery/cab::cab-container-format
      - id: metadata/file/naming::archive-bat-member
      - id: objectives/command-and-control/dropper/execution/string-reconstruct::batch-dense-percent-slice-operator

  - id: cab-cjk-gibberish-dropper
    desc: Cabinet wraps CJK gibberish batch
    scope: archive
    for: [cab, batch, pe]
    all:
      - id: objectives/command-and-control/dropper/delivery/cab::cab-script-member-entry
      - id: objectives/anti-static/obfuscation/string/junking::consonant-vowel-gibberish-source

  - id: cab-lure-appdata-dropper
    desc: Cabinet wraps lure batch staging under AppData
    scope: archive
    for: [cab, batch, pe]
    all:
      - id: objectives/command-and-control/dropper/delivery/cab::cab-container-format
      - id: objectives/command-and-control/dropper/delivery/cab::cab-lure-script-member-a
      - id: micro-behaviors/fs/path/app-data::path-suspicious-appdata-exe

  - id: cab-curl-outfile-dropper
    desc: Cabinet wraps curl output staging
    scope: archive
    for: [cab, batch, pe, powershell]
    all:
      - id: objectives/command-and-control/dropper/delivery/cab::cab-script-member-entry
      - id: micro-behaviors/communications/http/download/curl::curl-output-file

  - id: cab-java-getruntime-dropper
    desc: Cabinet wraps Java getRuntime exec
    scope: archive
    for: [cab, class, pe, java, java_class]
    all:
      - id: objectives/command-and-control/dropper/delivery/cab::cab-container-format
      - id: micro-behaviors/process/create/spawn::java-runtime-exec-bytecode-symbol
      - id: micro-behaviors/process/create/spawn::java-runtime-getruntime-bytecode-symbol

  - id: cab-path-huge-member
    desc: Escaping cabinet member exceeds ten megabytes
    scope: archive
    for: [cab, pe, zip, tar, 7z]
    all:
      - id: objectives/command-and-control/dropper/delivery/cab::cab-parent-path-entry
      - id: metadata/build/archive::archive-member-over-10mb

  - id: cab-order-com-dropper
    desc: Cabinet wraps an order-lure COM payload
    scope: archive
    all:
      - id: objectives/command-and-control/dropper/delivery/cab::cab-container-format
      - id: metadata/package/files/archive-member::archive-com-member
      - id: objectives/evasion/masquerade/file/lure::order-exe-lure
    unless:
      - id: metadata/signed/platform/

  - id: cab-vector-banner-dropper
    desc: Cabinet wraps banner-prefixed PE chunks
    scope: archive
    for: [cab, pe, data, text]
    all:
      - id: objectives/command-and-control/dropper/delivery/cab::cab-several-member-entry
      - id: micro-behaviors/data/embedded/payload/header::vector-stage-banner

  - id: cab-payment-pif-dropper
    desc: Cabinet wraps a payment-lure PIF
    scope: archive
    all:
      - id: metadata/file/naming::archive-payment-pif-member
      - id: metadata/binary/resource/embedded-media::png-magic-in-text
    unless:
      - id: metadata/signed/platform/

  - id: cab-docx-pif-dropper
    desc: Cabinet wraps a document-extension PIF
    scope: archive
    all:
      - id: metadata/file/naming::archive-docx-pif-member
      - id: metadata/binary/resource/embedded-media::png-magic-in-text
    unless:
      - id: metadata/signed/platform/

  - id: cab-pif-double-ext-dropper
    desc: Cabinet wraps a double-extension PIF
    scope: archive
    all:
      - id: metadata/file/naming::archive-pif-member
      - id: objectives/evasion/masquerade/file/double-ext::basename-is-doc-double-pif
    unless:
      - id: metadata/signed/platform/

  - id: cab-po-script-dropper
    desc: Cabinet wraps a numbered PO batch
    scope: archive
    for: [cab, batch, pe]
    all:
      - id: metadata/file/naming::archive-po-numbered-script-member
      - id: objectives/command-and-control/dropper/delivery/cab::cab-script-member-entry

  - id: cab-po-parse-dropper
    desc: Cabinet wraps an unparsable PO batch
    scope: archive
    for: [cab, batch, pe]
    all:
      - id: metadata/file/naming::archive-po-numbered-script-member
      - id: objectives/anti-static/obfuscation/string/fragmentation::batch-large-parse-fallback

  - id: cab-bat-percent-slices
    desc: Cabinet wraps percent-sliced batch
    scope: archive
    for: [cab, batch, pe]
    all:
      - id: metadata/file/naming::archive-bat-member
      - id: objectives/command-and-control/dropper/execution/string-reconstruct::batch-shortvar-percent-substring-slicing

  - id: cab-enquiry-script-dropper
    desc: Cabinet wraps an enquiry-lure batch
    scope: archive
    for: [cab, batch, pe]
    all:
      - id: metadata/file/naming::archive-enquiry-script-member
      - id: objectives/command-and-control/dropper/delivery/cab::cab-script-member-entry

  - id: cab-lure-script-entry
    desc: Cabinet lure script is a script member
    scope: archive
    for: [cab, batch, pe]
    all:
      - id: objectives/command-and-control/dropper/delivery/cab::cab-lure-script-member-a
      - id: objectives/command-and-control/dropper/delivery/cab::cab-script-member-entry

  - id: cab-bank-script-dropper
    desc: Cabinet wraps a bank-lure script
    scope: archive
    for: [cab, batch, pe]
    all:
      - id: metadata/file/naming::archive-bank-script-member
      - id: objectives/command-and-control/dropper/delivery/cab::cab-script-member-entry

  - id: cab-onenote-encrypted
    desc: Cabinet wraps an encrypted OneNote section
    scope: archive
    for: [cab, data, pe]
    all:
      - id: objectives/command-and-control/dropper/delivery/cab::cab-onenote-section-entry
      - id: metadata/document/office/markup::office-encryption-descriptor

  - id: cab-onenote-aes
    desc: Cabinet wraps AES-encrypted OneNote
    scope: archive
    for: [cab, data, pe]
    all:
      - id: objectives/command-and-control/dropper/delivery/cab::cab-onenote-section-entry
      - id: metadata/document/office/markup::office-encryption-aes

  - id: cab-csv-fixed-width
    desc: Cabinet wraps fixed-width encoded CSV
    scope: archive
    for: [cab, pe, data, text]
    all:
      - id: objectives/command-and-control/dropper/delivery/cab::cab-csv-member-entry
      - id: metadata/file/line::long-fixed-width-text-rows

  - id: cab-csv-opaque-id
    desc: Cabinet wraps an opaque-id CSV blob
    scope: archive
    for: [cab, pe, data, text]
    all:
      - id: metadata/file/naming::archive-opaque-id-csv-member
      - id: metadata/file/line::long-fixed-width-text-rows

  - id: cab-encoded-audio-dropper
    desc: Cabinet wraps text under an audio name
    scope: archive
    for: [cab, pe, media]
    all:
      - id: metadata/package/files/archive-member::archive-audio-member
      - id: metadata/file/format/media::media-content-is-text

  - id: cab-broken-audio-dropper
    desc: Cabinet wraps broken named audio media
    scope: archive
    for: [cab, pe, media]
    all:
      - id: metadata/package/files/archive-member::archive-audio-member
    any:
      - id: metadata/file/format/media::media-trailing-data
      - id: metadata/file/format/media::media-interior-hole
      - id: metadata/file/format/media::media-overlapping-regions
      - id: metadata/file/format/media::media-content-is-executable
      - id: metadata/file/format/media::media-content-is-text
      - id: metadata/file/format/media::media-content-is-archive
      - id: metadata/file/format/media::media-content-is-opaque-blob
      - id: metadata/file/format/media::media-stowaway-executable
      - id: metadata/file/format/media::media-stowaway-archive
      - id: metadata/file/format/media::media-stowaway-script
      - id: metadata/file/format/media::media-stowaway-high-entropy
    needs: 1
    unless:
      # SciPy ships RF64 wavs under io/tests/data so the reader is tested
      # against odd audio. That is the fixture, not a hidden payload.
      - id: metadata/package/testing/presence/harness::media-asset-test-path
      - id: metadata/package/testing/presence/path::test-fixture-directory-path

  - id: cab-audio-encoded-text
    desc: Cabinet wraps encoded-text audio names
    scope: archive
    for: [cab, pe, media]
    all:
      - id: metadata/package/files/archive-member::archive-audio-member
      - id: objectives/evasion/masquerade/extension-mismatch::media-named-file-is-encoded-text

  - id: cab-csv-id-dropper
    desc: Cabinet wraps an opaque-named CSV
    scope: archive
    all:
      - id: objectives/command-and-control/dropper/delivery/cab::cab-csv-member-entry
      - id: metadata/file/naming::archive-opaque-id-csv-member

  - id: cab-csv-fat-member
    desc: Cabinet wraps a large CSV member
    scope: archive
    all:
      - id: objectives/command-and-control/dropper/delivery/cab::cab-csv-member-entry
      - id: metadata/file/naming::archive-member-over-200kb

  - id: cab-csv-fat-id
    desc: Cabinet wraps a large opaque-id CSV
    scope: archive
    all:
      - id: metadata/file/naming::archive-opaque-id-csv-member
      - id: metadata/file/naming::archive-member-over-200kb

  - id: cab-extensionless-crowd
    desc: Cabinet lists ten extensionless members
    scope: archive
    all:
      - id: objectives/command-and-control/dropper/delivery/cab::cab-extensionless-member-entry
      - id: metadata/file/archive::archive-at-least-10-members
    unless:
      - id: metadata/signed/platform/

  - id: cab-tiny-extensionless
    desc: Cabinet hides a tiny extensionless member
    scope: archive
    all:
      - id: objectives/command-and-control/dropper/delivery/cab::cab-extensionless-member-entry
      - id: metadata/file/naming::archive-member-under-10kb
    unless:
      - id: metadata/signed/platform/

  - id: cab-onenote-fat-section
    desc: Cabinet wraps a large OneNote section
    scope: archive
    all:
      - id: objectives/command-and-control/dropper/delivery/cab::cab-onenote-section-entry
      - id: metadata/file/naming::archive-member-over-200kb

  - id: cab-onenote-toc-fat
    desc: Cabinet wraps OneNote TOC plus large payload
    scope: archive
    all:
      - id: objectives/command-and-control/dropper/delivery/cab::cab-onenote-toc-entry
      - id: metadata/file/naming::archive-member-over-200kb

  - id: cab-bat-parse-error
    desc: Cabinet wraps an unparsable batch member
    scope: archive
    for: [cab, batch, pe]
    all:
      - id: metadata/file/naming::archive-bat-member
      - id: metadata/file/format/conformance::parse-error

  - id: cab-pif-clr-dropper
    desc: Cabinet wraps a high-entropy CLR PIF
    scope: archive
    all:
      - id: metadata/file/naming::archive-pif-member
      - id: metadata/binary/resource/size::clr-resource-high-entropy
    unless:
      - id: metadata/signed/platform/

