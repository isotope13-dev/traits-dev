defaults:
  platforms: [windows]
  for: [batch, powershell, scripts, javascript]
  attack: T1105
traits:
  - id: get-pip-script-fetch
    desc: Downloads get-pip bootstrap script
    crit: notable
    conf: 0.86
    unless:
      - id: micro-behaviors/os/package-manager/install::python-runtime-pip-install
      - id: micro-behaviors/os/package-manager/install::ensurepip-bootstrap
      - id: well-known/app/system/crunr::crunr-demo-marker
      - id: well-known/app/ai/coding-agent/jaccoder::jaccoder-extension-context
    if:
      type: text
      regex: '(?i)\bget-pip\.py\b'
  - id: python-clipboard-keyboard-pip-install
    desc: Installs clipboard keyboard deps
    crit: notable
    conf: 0.92
    if:
      type: text
      substr: "install pyperclip keyboard"
  - id: python-screen-ui-pip-deps
    desc: Installs screen UI automation deps
    crit: notable
    conf: 0.9
    if:
      type: text
      substr: "mss pyautogui pywin32 uiautomation comtypes"
  # The composite is a JavaScript launcher staging a Python payload; scoped
  # to JS so it stops firing on every Python module that joins a .py path.
composite_rules:
  - id: javascript-python-overlay-runtime-bootstrap
    for: [javascript]
    desc: JavaScript launcher stages Python overlay surveillance runtime
    crit: hostile
    conf: 0.98
    attack: T1105,T1059.006
    all:
      - id: well-known/lib/runtime/scripted/cpython::cpython-windows-installer
      - id: micro-behaviors/process/create/installer::quiet-python-user-install
      - id: python-clipboard-keyboard-pip-install
      - id: python-screen-ui-pip-deps
      - id: micro-behaviors/process/create/variable-spawn::node-variable-program-and-script-argument
      - id: micro-behaviors/fs/path/script::node-local-python-script-path
