defaults:
  platforms: [unix, windows]
  for: [php]
  attack: T1552.001,T1041

composite_rules:
- id: composer-run-key-node-beacon
  desc: Composer package persists a Node beacon
  crit: hostile
  conf: 0.99
  for: [php, zip]
  scope: archive
  all:
  - id: "micro-behaviors/os/registry/keys/autostart::currentversion-run"
  - id: micro-behaviors/os/registry/manipulate::php-reg-variable-command
  - id: metadata/file/profile/operation-cooccurrence::embedded-node-https-get-with-timeout
  - id: micro-behaviors/os/application/target/development::node-executable-name-reference