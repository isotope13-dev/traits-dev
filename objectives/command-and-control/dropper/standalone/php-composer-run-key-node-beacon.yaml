defaults:
  platforms: [unix, windows]
  for: [php]
  attack: T1552.001,T1041

composite_rules:
- id: composer-run-key-node-beacon
  desc: Composer package persists a Node beacon
  crit: hostile
  conf: 0.99
  for: [php, zip]
  scope: archive
  all:
  - id: micro-behaviors/os/registry/keys::currentversion-run
  - id: micro-behaviors/os/registry/manipulate::php-reg-variable-command
  - id: micro-behaviors/communications/http/request/beacon::embedded-node-periodic-https-beacon
  - id: node-exe