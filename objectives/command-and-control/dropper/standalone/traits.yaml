defaults:
  platforms: [windows, unix]
traits:
- id: js-python-stdin-payload-exec--rx-5
  desc: exec_bin payload field marker
  crit: notable
  conf: 0.94
  for:
  - javascript
  - typescript
  if:
    type: text
    substr: exec_bin
composite_rules:
- id: node-standalone
  desc: Downloads standalone Node.js interpreter
  crit: suspicious
  conf: 0.85
  attack: T1105
  for: [pyc, python]
  all:
  - id: micro-behaviors/communications/http/url/domain::nodejs-distribution-url
  - id: micro-behaviors/fs/path/archive::node-versioned-archive-reference
  - id: objectives/anti-static/obfuscation/payload/bytecode::exec-functions
  any:
  - id: micro-behaviors/data/archive/extension::tar-gz
  - id: micro-behaviors/data/archive/extension::zip-extension
- id: python-standalone-stdin-loader
  desc: Downloaded Python executes stdin payload
  crit: hostile
  conf: 0.98
  attack: T1059.006
  for:
  - javascript
  - typescript
  all:
  - id: micro-behaviors/communications/http/download/helper::python-standalone-release-reference
  - id: micro-behaviors/process/deploy/runtime::interpreter-path-api-reference
  - id: micro-behaviors/process/create/spawn::child-process-member-spawn
  - id: micro-behaviors/data/decode/hex::buffer-from-hex-string
  any:
  - id: micro-behaviors/communications/url/external/github::github-release-download
  - id: micro-behaviors/communications/url/scheme::hex-encoded-https
  - id: metadata/lang/encoding::js-dense-hex-escapes
- id: js-downloaded-python-stdin-loader
  desc: Downloaded Python runs stdin payload
  crit: hostile
  conf: 0.99
  attack: T1059.006
  for:
  - javascript
  - typescript
  all:
  - id: metadata/lang/source/shape::python-standalone-release-marker-context
  - id: js-python-stdin-payload-exec
  - id: metadata/import/builtin::require-child-process
- id: js-python-stdin-payload-exec
  desc: Spawned interpreter receives stdin payload
  crit: suspicious
  conf: 0.94
  attack: T1059
  for:
  - javascript
  - typescript
  all:
  - id: micro-behaviors/process/fd/stdio::js-stdin-write
  - id: js-python-stdin-payload-exec--rx-5
  - id: micro-behaviors/process/create/spawn::child-process-member-spawn
  unless:
  - id: metadata/file/format/source-map::sourcemap-sources-content
  - id: well-known/lib/platform/raycast-api/

