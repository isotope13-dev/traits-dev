defaults:
  attack: T1027
  mbc: E1027
  platforms:
    - windows
  for:
    - pe
traits:
  - id: mutated-exe-dropper-string
    desc: Mutated executable dropper string pattern
    crit: component
    if:
      type: hex
      pattern: 6d 75 74 61 74 65 64 5f 00 2e 65 78 65
      section: .rdata

composite_rules:
  - id: mutated-exe-dropper
    desc: Dropper uses hardcoded mutated_*.exe filename
    crit: hostile
    conf: 1.0
    all:
      - id: mutated-exe-dropper-string
      - id: metadata/binary/section/metrics::mutated-exe-randomizer-string
      - id: micro-behaviors/process/create/spawn::create-process-a

  # Fragtor/Zusy-class MinGW loaders pair the mutated_*.exe drop name with
  # classic RunPE thread-context APIs in the same PE.
  - id: mutated-exe-runpe-thread-apis
    desc: Mutated_*.exe dropper with RunPE thread-context APIs
    crit: hostile
    conf: 0.97
    attack: T1055.012,T1027
    mbc: E1055.012
    all:
      - id: mutated-exe-dropper
      - id: micro-behaviors/process/inject/runtime/call::get-thread-context-dup
      - id: micro-behaviors/process/inject/runtime/call::set-thread-context-dup
      - id: micro-behaviors/process/info/thread::resume-thread-dup
    any:
      - id: micro-behaviors/process/info/thread::suspend-thread-import
      - id: micro-behaviors/mem/protect/modify::virtual-protect
