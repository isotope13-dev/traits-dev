# Concealed downloader bytes must reach a shell sink; an encoded URL or a
# certificate bypass alone does not establish a remote execution objective.
defaults:
  crit: hostile
  platforms: [unix]
  for: [scripts, source, build, text]
  attack: T1105,T1059.004,T1027
  mbc: E1105
composite_rules:
  - id: encoded-payload-remote-shell-execution
    desc: Encoded payload fetches and runs code
    conf: 0.98
    all:
      - id: micro-behaviors/process/create/shell/pipeline::encoded-blob-piped-to-shell
      - id: micro-behaviors/process/create/shell/pipeline::encoded-blob-piped-onward
    any:
      - id: micro-behaviors/communications/http/download/encoded::encoded-remote-shell-fetch
      - id: micro-behaviors/communications/http/download/encoded::encoded-remote-substitution-fetch
    unless:
      - id: metadata/package/testing/corpus/
