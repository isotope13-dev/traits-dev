defaults:
  platforms: [macos]
  for: [macho]
  attack: T1027,T1105

composite_rules:
  - id: xor-http-python-site-packages-dropper
    desc: XOR-obfuscated HTTP client writes server content into Python site-packages
    crit: hostile
    conf: 0.99
    all:
      - id: micro-behaviors/communications/http/url/domain::xor-decoded-http-url
      - id: micro-behaviors/communications/http/download/curl::xor-decoded-curl-easy-perform
      - id: micro-behaviors/communications/http/download/curl::xor-decoded-server-content-fetch-failure
      - id: micro-behaviors/fs/enumerate/directory::xor-decoded-site-packages-enumeration
      - id: micro-behaviors/fs/file/write/completion::xor-decoded-write-failure-status
