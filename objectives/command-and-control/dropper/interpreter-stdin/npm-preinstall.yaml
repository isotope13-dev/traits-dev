defaults:
  platforms: [unix, windows]
  for: [package.json]
composite_rules:
  - id: renamed-package-archived-node-loader
    desc: Renamed package preinstall executes archived remote JavaScript
    crit: hostile
    conf: 0.98
    attack: T1105,T1059.007,T1195.002
    all:
      - id: micro-behaviors/communications/http/download/package::preinstall-http-node-pipeline
      - id: micro-behaviors/communications/http/download/package::preinstall-wayback-url
      - id: metadata/package/repository::npm-name-repo-mismatch
