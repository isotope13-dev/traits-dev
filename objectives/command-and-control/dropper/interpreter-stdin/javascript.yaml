defaults:
  attack: T1059.007,T1027,T1564.003
  for: [javascript, typescript]
  platforms: [unix, windows]
composite_rules:
  - id: concealed-detached-node-stdin-stage
    desc: Packed code conceals Node stream launch
    crit: suspicious
    conf: 0.98
    all:
      - id: micro-behaviors/process/fd/stdio::helper-spawn-dash-computed-stream-input
      - id: micro-behaviors/process/create/spawn::windowshide-obfuscated-true
      - id: micro-behaviors/process/daemonize/detach::detached-obfuscated-true
      - id: objectives/anti-static/obfuscation/obfuscator/js-obfuscator::plain-javascript-obfuscator-string-array-runtime

  - id: noop-logger-concealed-node-stage
    desc: Logger facade conceals detached Node stream stage
    crit: hostile
    conf: 0.99
    for: [npm, tar, zip, javascript, typescript]
    scope: archive
    all:
      - id: metadata/package/placeholder::pino-export-is-noop-middleware
      - id: concealed-detached-node-stdin-stage
