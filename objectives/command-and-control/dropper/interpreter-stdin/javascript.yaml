defaults:
  attack: T1059.007,T1027,T1564.003
  for: [javascript, typescript]
  platforms: [unix, windows]
composite_rules:
  - id: concealed-detached-node-stdin-stage
    desc: Packed code conceals Node stream launch
    crit: suspicious
    conf: 0.98
    all:
      - id: micro-behaviors/process/fd/stdio::helper-spawn-dash-computed-stream-input
      - id: micro-behaviors/process/create/spawn::windowshide-obfuscated-true
      - id: micro-behaviors/process/daemonize/detach::detached-obfuscated-true
      - id: objectives/anti-static/obfuscation/obfuscator/js-obfuscator::plain-javascript-obfuscator-string-array-runtime

  - id: noop-logger-concealed-node-stage
    desc: Logger facade conceals detached Node stream stage
    crit: hostile
    conf: 0.99
    for: [npm, tar, zip, javascript, typescript]
    scope: archive
    all:
      - id: metadata/package/placeholder::pino-export-is-noop-middleware
      - id: concealed-detached-node-stdin-stage

  # Hand-obfuscated variant: the destination URL is hex-encoded rather than
  # packed by a known obfuscator, fetched over HTTPS, and streamed straight
  # into a spawned interpreter's stdin. Fetching a concealed URL into an
  # interpreter's stdin is staging, whatever packed the URL.
  - id: hex-url-fetch-piped-interpreter-stdin
    desc: Hex-concealed URL fetched and piped to interpreter stdin
    crit: hostile
    conf: 0.98
    attack: T1059.007,T1105,T1027
    near_bytes: 6144
    all:
      - id: micro-behaviors/communications/url/scheme::hex-encoded-https
      - id: micro-behaviors/process/fd/stdio::node-stream-to-stdin-pipe
      - id: micro-behaviors/process/create/exec::spawn-variable-program
