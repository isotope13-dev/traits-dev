defaults:
  platforms: [unix, windows]
  for: [python]
  mbc: B0024
composite_rules:
  - id: shell-true-curl-pipe
    desc: Python shell runs curl-to-bash string
    crit: hostile
    conf: 0.95
    attack: T1105,T1059.004
    near_lines: 20
    all:
      - id: micro-behaviors/process/create/shell-subprocess::shell-true
      - id: micro-behaviors/process/create/shell/pipeline::python-curl-pipe-bash-string
  - id: python-launchctl-curl-pipe-argument
    desc: Python launchctl job pipes curl into shell
    crit: hostile
    conf: 0.96
    attack: T1105,T1059.004,T1543.004
    platforms: [macos]
    near_lines: 20
    all:
      - id: micro-behaviors/os/service/control::python-launchctl-argv
      - id: micro-behaviors/process/create/shell/command-string::shell-c-argument-curl-pipe-shell
