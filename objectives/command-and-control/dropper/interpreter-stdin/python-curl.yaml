defaults:
  platforms: [unix, windows]
  for: [python]
composite_rules:
  - id: shell-true-curl-pipe
    desc: Python shell and shortened remote Bash stage
    crit: hostile
    conf: 0.95
    attack: T1105,T1059.004
    near_lines: 20
    all:
      - id: micro-behaviors/process/create/shell/command-string::python-subprocess-shell-true
      - id: micro-behaviors/process/create/shell/pipeline::python-curl-pipe-bash-string
      - id: micro-behaviors/communications/url/shortener/
      - id: micro-behaviors/process/fd/stdio::python-subprocess-near-devnull-stdio-assignment
    downgrade:
      any:
        - id: micro-behaviors/os/package-manager/installer-script::official-claude-code-bootstrap-installer
