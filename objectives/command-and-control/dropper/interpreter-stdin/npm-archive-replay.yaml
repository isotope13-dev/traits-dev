defaults:
  platforms: [unix, windows]
  for: [package.json, npm]

composite_rules:
  - id: npm-preinstall-archive-replay-node-loader
    desc: npm preinstall executes replayed third-party code through Node stdin
    crit: hostile
    conf: 0.99
    attack: T1195.002,T1105,T1059.007
    mbc: B0024
    all:
      - id: metadata/package/scripts/lifecycle::has-preinstall-script
      - id: micro-behaviors/process/create/shell/pipeline::preinstall-curl-http-pipe-node
      - id: micro-behaviors/communications/http/url/endpoint::preinstall-archive-replay-url
