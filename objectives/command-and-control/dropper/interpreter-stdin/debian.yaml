# Interpreter-stdin retains its admitted legacy home pending sink migration.
defaults:
  for: [shell]
  platforms: [linux]

composite_rules:
  - id: deb-control-remote-shell-stage
    desc: Debian install hook pipes a remote stage into a shell
    crit: hostile
    conf: 0.99
    attack: T1195.002,T1105,T1059.004
    all:
      - id: metadata/path::debian-control-hook-path
      - id: micro-behaviors/process/create/shell/pipeline::curl-pipe-shell-text

