defaults:
  platforms: [unix, windows]
  for: [shell]
  attack: T1105
  mbc: B0024

composite_rules:
  - id: raw-ip-fallback-shell-dropper
    desc: Raw-IP fallback pipes stage to shell
    crit: hostile
    conf: 0.99
    attack: T1105,T1059.004
    all:
      - id: micro-behaviors/communications/http/download/fallback::downloader-fallback-chain
      - id: micro-behaviors/communications/ip/literal::external-ipv4-http-url
      - id: micro-behaviors/process/create/shell/spawn::curl-pipe-exec
