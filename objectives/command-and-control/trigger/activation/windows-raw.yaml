# Covert raw-packet framing used by passive Windows implants: a 16-bit
# length field recovered by XOR with 0xAAAA, then AES-CCM unwrap + opcode
# dispatch. ATT&CK T1205 (Traffic Signaling).
defaults:
  platforms: [windows]
  for: [c, cpp, python]
  attack: T1205

traits:
  - id: xor-aaaa-length-mask
    desc: XOR with 0xAAAA length-mask constant
    crit: component
    conf: 0.72
    if:
      type: text
      regex: '\^\s*0xA{4}\b|\b0xA{4}\s*\^'
  - id: crc8-poly-0x31
    desc: CRC-8 polynomial 0x31
    crit: component
    conf: 0.7
    if:
      type: text
      word: "0x31"

composite_rules:
  - id: rcvall-ccm-opcode-passive-backdoor
    desc: Promiscuous receive-all AES-CCM opcode backdoor
    crit: hostile
    conf: 0.97
    for: [c, cpp]
    attack: T1205,T1059,T1620
    all:
      - id: micro-behaviors/communications/socket/options::windows-rcvall-sniff
      - id: micro-behaviors/crypto/symmetric/aes/cng::bcrypt-chain-mode-ccm-macro
      - id: micro-behaviors/data/control-flow/dispatch::switch-command-variable-dispatch
      - id: xor-aaaa-length-mask
      - id: micro-behaviors/mem/protect/modify::getprocaddress-virtualprotect-source
  - id: rcvall-ccm-framed-trigger
    desc: Receive-all framed AES-CCM packet trigger
    crit: suspicious
    conf: 0.94
    all:
      - id: micro-behaviors/communications/socket/options::sio-rcvall-constant
      - id: xor-aaaa-length-mask
    any:
      - id: micro-behaviors/crypto/symmetric/aes/cng::bcrypt-chain-mode-ccm-macro
      - id: micro-behaviors/crypto/symmetric/aes/ccm::pycrypto-aes-ccm-mode
  - id: dns-label-ccm-trigger
    desc: DNS-label Base32 CRC-8 AES-CCM command trigger
    crit: suspicious
    conf: 0.95
    for: [python]
    attack: T1205,T1071.004
    all:
      - id: micro-behaviors/crypto/symmetric/aes/ccm::pycrypto-aes-ccm-mode
      - id: micro-behaviors/data/encode/base32::rfc4648-lowercase-alphabet-literal
      - id: crc8-poly-0x31
      - id: xor-aaaa-length-mask
  - id: dns-label-ccm-opcode-interpreter
    desc: Passive DNS-label AES-CCM trigger runs shellcode in memory
    crit: hostile
    conf: 0.97
    for: [python]
    attack: T1205,T1071.004,T1620
    all:
      - id: dns-label-ccm-trigger
      - id: objectives/evasion/process/injection/runtime::python-virtualprotect-rwx
      - id: micro-behaviors/process/inject/runtime/call::python-cfunctype-function-pointer-call
