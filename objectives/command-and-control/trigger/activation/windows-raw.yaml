# Covert raw-packet framing used by passive Windows implants: a 16-bit
# length field recovered by XOR with 0xAAAA, then AES-CCM unwrap + opcode
# dispatch. ATT&CK T1205 (Traffic Signaling).
defaults:
  platforms: [windows]
  for: [c, cpp, python]
  attack: T1205

composite_rules:
  - id: ccm-rwx-pointer-execution
    desc: AES-CCM clues co-occur with RWX memory and a C-function pointer wrapper
    crit: hostile
    conf: 0.97
    for: [python]
    attack: T1620
    all:
      - id: micro-behaviors/crypto/symmetric/aes/mode::ccm-base32-crc-xor-clues
      - id: micro-behaviors/mem/protect/modify/executable::python-virtualprotect-rwx
      - id: micro-behaviors/dylib/load/ffi::python-cfunctype-pointer-wrapper
