# Go package init() functions with side effects.
# Go's init() runs automatically on package import, before main(). When init
# launches goroutines that perform network I/O, filesystem mutation, or
# credential collection, the package compromises any program that imports it
# — the supply-chain equivalent of Python's import-time decorator C2.
defaults:
  platforms: [unix, windows]
  for: [go]
  attack: T1195.002
  mbc: B0024
traits: []
composite_rules:
  - id: go-init-network-stager
    desc: Go package init() runs network I/O on import
    crit: hostile
    conf: 0.95
    # Network I/O must live inside an init()-spawned goroutine, not merely
    # within N lines of a signal-handler goroutine elsewhere in the file.
    # Network I/O must appear inside the init() body, not merely within N
    # lines of an unrelated signal-handler goroutine elsewhere in the file.
    any:
      - id: micro-behaviors/process/thread/create::go-init-body-net-dial
      - id: micro-behaviors/process/thread/create::go-init-body-dial-method
      - id: micro-behaviors/process/thread/create::go-init-body-http-request
    unless:
      - id: metadata/build/archive::source-archive-member
      - id: well-known/tool/development/go-toolchain::go-toolchain-distribution
      - id: metadata/package/testing/presence/harness::go-test-file
      - id: metadata/package/testing/presence/harness::go-test-helper-file
      - id: metadata/package/testing/presence/harness::go-tools-testdata-directory-path
  - id: go-init-credential-collector
    desc: Go init() collects environment/credential context on import
    crit: hostile
    conf: 0.95
    # Same precision guard as go-init-network-stager: the collection must
    # happen inside the init goroutine, not anywhere in a large package.
    near_lines: 25
    all:
      - id: micro-behaviors/process/thread/create::go-init-with-goroutine
      - id: micro-behaviors/os/env/access::os-environ
    any:
      - id: micro-behaviors/communications/http/lib/netlib::go-http-newrequest
      - id: micro-behaviors/fs/file/read::os-readfile
    unless:
      - id: metadata/build/archive::source-archive-member
      - id: metadata/package/testing/presence/harness::go-test-file
      - id: metadata/package/testing/presence/harness::go-test-helper-file
      - id: metadata/package/testing/presence/harness::go-tools-testdata-directory-path
