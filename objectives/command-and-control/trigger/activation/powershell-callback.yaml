# PowerBreach supports three activation paths in addition to timer polling.
# Require its executable remote-command callback, not just packet/DNS APIs.
# The descriptions deliberately describe same-file evidence; the source review
# confirms these branches select the callback peer after the trigger matches.
defaults:
  platforms: [windows]
  for: [powershell]
  crit: hostile
  conf: 0.98
  attack: T1205

composite_rules:
  - id: powershell-packet-trigger-command-callback
    desc: Packet-content activation beside remote-command callback
    all:
      - id: objectives/command-and-control/remote-command/dispatch/eval::powerbreach-remote-callback-evaluation
      - id: micro-behaviors/communications/socket/configure::powershell-receive-all-control-code
      - id: micro-behaviors/data/control-flow/branch::powershell-packet-trigger-comparison
      - id: metadata/lang/source/syntax/assignment/name::powershell-source-address-match-assignment
  - id: powershell-tcp-trigger-command-callback
    desc: TCP token activation beside remote-command callback
    all:
      - id: objectives/command-and-control/remote-command/dispatch/eval::powerbreach-remote-callback-evaluation
      - id: micro-behaviors/communications/socket/accept::powershell-accept-tcp-client
      - id: metadata/lang/source/syntax/assignment/name::powershell-reader-line-assignment
      - id: micro-behaviors/data/control-flow/branch::powershell-line-trigger-comparison
      - id: metadata/lang/source/syntax/call/invocation::powershell-remote-endpoint-address-string
  - id: powershell-dns-trigger-command-callback
    desc: DNS address-change activation beside remote-command callback
    all:
      - id: objectives/command-and-control/remote-command/dispatch/eval::powerbreach-remote-callback-evaluation
      - id: micro-behaviors/communications/dns/lookup::powershell-dns-query-reference
      - id: metadata/lang/source/syntax/assignment/name::powershell-resolved-ip-string-assignment
      - id: micro-behaviors/data/control-flow/branch::powershell-resolved-trigger-comparison
      - id: metadata/lang/source/syntax/assignment/name::powershell-resolved-match-assignment
