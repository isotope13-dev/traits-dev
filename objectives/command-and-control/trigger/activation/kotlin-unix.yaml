defaults:
  platforms: [unix]
  for: [kotlin, class, jar]
  attack: T1204

traits:
  # Endpoint matchers require an AST-backed route path that starts at the
  # route root and terminates at the path segment (e.g. "/commands" or
  # "/api/commands"). Anchoring at the root excludes package/import paths such
  # as "github.com/example/commands". AST-backed literals also exclude
  # documentation/comments such as BeanShell's `importCommands` help text.
  - id: kotlin-trigger-endpoint
    desc: Kotlin trigger endpoint
    crit: suspicious
    conf: 0.94
    for: [kotlin, class]
    if:
      type: string_literal
      # A bare SerialName "trigger" is a JSON field, not a route.
      regex: '^/([^/]+/)*trigger$'

  - id: kotlin-commands-endpoint
    desc: Kotlin commands endpoint
    crit: suspicious
    conf: 0.94
    for: [kotlin, class]
    if:
      type: string_literal
      regex: '^/([^/]+/)*commands$'

  - id: kotlin-timing-window-gate
    desc: Kotlin timing window gate
    crit: suspicious
    conf: 0.94
    for: [kotlin, class]
    if:
      type: text
      substr: now.hour !in 2..5

composite_rules:
  - id: kotlin-timed-c2-trigger
    desc: Kotlin timed C2 trigger
    crit: hostile
    conf: 0.98
    all:
      - id: kotlin-trigger-endpoint
      - id: kotlin-commands-endpoint
    any:
      - id: kotlin-timing-window-gate
