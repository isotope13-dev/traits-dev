# Kernel extension registers an IP filter and waits for one ICMP
# type/code pair: a magic-packet trigger for a kernel backdoor.
defaults:
  platforms: [macos]
  for: [c]
  crit: hostile
  attack: T1205,T1014

composite_rules:
  - id: xnu-ipf-magic-icmp-trigger
    desc: Kernel IP filter waits for a magic ICMP packet
    conf: 0.93
    all:
      - id: micro-behaviors/os/kernel/callback::macos-ipf-addv4
      - id: micro-behaviors/communications/icmp::icmp-type-and-code-magic-compare
