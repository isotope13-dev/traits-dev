defaults:
  platforms: [linux]
  for: [c, cpp]
  attack: T1205,T1059.004

composite_rules:
  - id: packet-filtered-shell-callback
    desc: Packet-filtered capture paired with socket shell redirection
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/communications/capture/packet-socket::raw-all-protocol-capture-loop
      - id: micro-behaviors/communications/socket/options::options-filter
      - id: micro-behaviors/os/bpf/program/network::classic-bpf-filter-array-source
      - id: objectives/command-and-control/reverse-shell/fd-redirect::posix-fd-redirect-shell-source
