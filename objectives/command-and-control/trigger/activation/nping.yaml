defaults:
  platforms:
    - unix
  for:
    - shell
traits:
  - id: rootkit-listening-text
    desc: Rootkit listener usage text
    crit: component
    conf: 0.95
    if:
      type: text
      substr: rootkit is listening
  - id: backdoor-key-arg
    desc: Backdoor key packet argument
    crit: component
    conf: 0.95
    if:
      type: text
      substr: <Backdoor KEY>
  - id: nping-root-required
    desc: nping raw packet root requirement
    crit: component
    conf: 0.95
    if:
      type: text
      substr: nping settings we use require root
composite_rules:
  # The knock read off the packet rather than off the operator's prose. The
  # three text atoms above are KoviD's own help output; a client for the next
  # rootkit will word its usage differently and match none of them, which left
  # this rule -- and the hostile verdict built on it -- keyed to one project's
  # README. These two facts are properties of the packet the client sends, so
  # they survive a rewrite.
  #
  # Both legs are required because either alone has an honest reading. Illegal
  # flag combinations are what an XMAS or NULL scan is made of, and a scan is a
  # legitimate thing for a test script to do; a single packet with a payload is
  # how any one-shot probe works. A scan sweeps and carries nothing, a probe
  # carries something and does not need impossible flags. Doing both at once --
  # one packet, with a payload, wearing flags no stack emits -- is a message
  # addressed to something already listening for it.
  - id: crafted-single-packet-knock
    desc: One crafted nping packet carries a payload
    crit: suspicious
    conf: 0.93
    all:
      - id: micro-behaviors/communications/benchmark/nping::multi-flag-option
      - id: micro-behaviors/communications/benchmark/nping::single-packet-payload

  - id: nping-secret-knock-marker
    desc: nping secret knock marker
    crit: suspicious
    conf: 0.97
    all:
      - id: micro-behaviors/communications/benchmark/nping::source-port
      - id: micro-behaviors/communications/benchmark/nping::payload-data
    any:
      - id: rootkit-listening-text
      - id: backdoor-key-arg
      - id: nping-root-required
      - id: crafted-single-packet-knock
  - id: nping-backdoor-activation
    desc: Crafted nping packet activates backdoor
    crit: hostile
    conf: 0.98
    attack: T1205
    mbc: B0022
    all:
      - id: micro-behaviors/communications/benchmark/nping::nping
      - id: micro-behaviors/communications/benchmark/nping::tcp-mode
      - id: micro-behaviors/communications/benchmark/nping::flags-option
      - id: nping-secret-knock-marker
