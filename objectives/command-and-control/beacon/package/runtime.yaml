# A package hook that writes a hidden temp stage and then opens a client channel
# is an install-time beacon independent of how its activation gate is spelled.
# An explicit Host identity supplies a stronger sibling verdict when present.
defaults:
  platforms: [linux, macos, windows]
  attack: T1071.001
  mbc: B0030

composite_rules:
  - id: package-hidden-network-beacon
    desc: Package hidden stage opens network client
    crit: hostile
    conf: 0.96
    all:
      - id: objectives/supply-chain/install-hook/runtime::package-automatic-execution-surface
      - id: objectives/supply-chain/install-hook/runtime::package-network-client
      - id: objectives/supply-chain/install-hook/runtime::package-hidden-temp-stage

  - id: package-hidden-explicit-host-beacon
    desc: Package hidden stage sends Host callback
    crit: hostile
    conf: 0.97
    all:
      - id: objectives/supply-chain/install-hook/runtime::package-automatic-execution-surface
      - id: objectives/supply-chain/install-hook/runtime::package-network-client
      - id: objectives/supply-chain/install-hook/runtime::package-hidden-temp-stage
    any:
      - id: micro-behaviors/communications/http/header/custom::source-explicit-host-header
      - id: micro-behaviors/communications/http/header/custom::source-host-header-setter
      - id: micro-behaviors/communications/http/message::raw-http-body-request-line
      - id: micro-behaviors/communications/http/message::raw-http-body-request-line-source
