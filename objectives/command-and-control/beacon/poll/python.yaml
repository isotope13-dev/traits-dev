# Embedded watchdog code is a Python string, so AST rules cannot see its loop.
defaults:
  platforms: [unix, windows]
  for: [python]
  attack: T1071.001,T1059.006
traits:
  - id: urllib-token-poll-request
    desc: Sends token with urllib poll request
    crit: component
    if:
      type: text
      regex: 'Request\(url,\s*headers\s*=\s*\{\s*["'']X-Token["'']\s*:\s*\w+\s*\}\)'
  - id: urllib-poll-reads-code-field
    desc: Reads task data from urllib response
    crit: component
    if:
      type: text
      regex: 'urlopen\(req[\s\S]{0,250}\.get\(["'']data'
  - id: python-poll-loop-sleeps
    desc: Infinite polling loop sleeps between requests
    crit: component
    if:
      type: text
      regex: '(?s)while\s+True\s*:.{0,500}time\.sleep\(\d+\)'
  - id: python-poll-exec-task-slice
    desc: Executes a sliced remote task string
    crit: suspicious
    if:
      type: text
      regex: 'exec\(d\[\d{1,3}:\],\s*\{\s*["'']__builtins__["'']\s*:\s*__builtins__'
  - id: python-child-code-launcher
    desc: Runs code in a detached Python child
    crit: notable
    if:
      type: text
      regex: 'subprocess\.Popen\(\[sys\.executable,\s*["'']-c["''],\s*code\]'
  - id: python-launches-polled-response
    desc: Passes polled response to code launcher
    crit: suspicious
    if:
      type: text
      substr: 'launch(d)'
composite_rules:
  - id: python-child-task-execution
    desc: Launches polled task as Python code
    crit: suspicious
    scope: file
    all:
      - id: python-child-code-launcher
      - id: python-launches-polled-response
  - id: python-token-polling-remote-execution
    desc: Token-authenticated poll executes remote Python tasks
    crit: hostile
    conf: 0.99
    scope: file
    attack: T1071.001,T1059.006,T1105
    mbc: B0024
    all:
      - id: urllib-token-poll-request
      - id: urllib-poll-reads-code-field
      - id: python-poll-loop-sleeps
    any:
      - id: python-poll-exec-task-slice
      - id: python-child-task-execution
