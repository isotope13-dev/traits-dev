# An obfuscated package that beacons to a Telegram bot on a jittered schedule.
#
# Telegram is attractive as C2 because the transport is somebody else's: the
# domain resolves, the TLS is valid, the traffic looks like an ordinary bot, and
# the operator never registers infrastructure. Long-polling with jitter is how
# the Bot API is meant to be used, so the polling loop is not the tell either.
#
# Neither is a hardcoded token by itself. Plenty of small, honest bots commit
# one -- careless, but not hostile, and a rule keyed on that pair alone would
# convict them. The third leg is what separates the two: a table of raw-IP
# proxy nodes. A bot that talks to the Bot API needs no proxy pool, and one
# written against hardcoded IPs rather than hostnames is not reaching a service
# that has DNS. That is operator infrastructure, and it is the part a careless
# developer never has.
#
# Archive-scoped because the facts land on different members: the token and the
# poll loop sit together in the bundled entry, the proxy table beside it.
#
# Worked example: the `@depro-tech/cortana-md` releases -- a WhatsApp-bot
# facade whose `dist/index.cjs` polls a hardcoded Telegram bot while the package
# carries a raw-IP proxy table and a file-hosting upload path.
defaults:
  platforms: [unix, windows]
  attack: T1102.002,T1027.002
  mbc: B0030

composite_rules:
  - id: telegram-beacon-with-proxy-pool
    desc: Telegram beacon ships raw-IP proxy pool
    crit: hostile
    conf: 0.95
    scope: archive
    all:
      - id: micro-behaviors/time/schedule/timeout::jittered-timeout-delay
      - id: micro-behaviors/communications/http/auth::hardcoded-telegram-bot-token-literal
      - id: micro-behaviors/communications/ip/endpoint::javascript-non-resolver-ipv4-host-table

  # Python carrier: the getUpdates long-poll is the Bot API tasking shape an
  # honest bot also has, and plenty of careless bots commit the token. What
  # separates the implant is that the same module persists itself on the
  # host: a CurrentVersion Run value write turns a chat bot into software
  # that reactivates on login. Verified on bytecode members where the write
  # appears as the SetValueEx constant; the hardcoded token, when present,
  # corroborates under the same file.
  - id: telegram-tasking-bot-run-key-persistence
    desc: Telegram tasking bot installs Run-key persistence
    crit: hostile
    conf: 0.96
    attack: T1102.002,T1547.001
    for: [python, pyc]
    all:
      - id: micro-behaviors/communications/http/services/telegram::telegram-get-updates-path
      - id: micro-behaviors/os/registry/keys/autostart::currentversion-run
    any:
      - id: micro-behaviors/os/registry/access::pyc-setvalueex-name
      - id: micro-behaviors/os/registry/access::python-bytecode-winreg-value-write
      - id: micro-behaviors/os/registry/write::winreg-setvalue
    unless:
      - id: micro-behaviors/os/registry/manipulate::run-key-write-with-uninstaller
