defaults:
  platforms: [windows]
  for: [rust]
  attack: T1071.001

traits:
  - id: rust-agent-id-header
    desc: Implant ID in HTTP header
    crit: suspicious
    conf: 0.92
    if:
      type: text
      substr: X-Agent-ID
    unless:
      # Observability headers: agent platforms emit X-Agent-ID beside
      # X-Run-ID/X-Workflow-ID/X-Step-ID for per-run usage attribution of
      # LLM calls — a trace family, not a lone implant identifier.
      - type: text
        regex: 'X-(Run|Workflow|Step|Action)-ID'

  - id: rust-agent-data-marker
    desc: AGENT_DATA C2 payload marker
    crit: suspicious
    conf: 0.9
    if:
      # Match a payload field/value, not the ordinary USER_AGENT_DATA
      # identifier used by browser/platform libraries.
      type: literal
      exact: AGENT_DATA

composite_rules:
  - id: rust-agent-http-beacon
    desc: Rust agent HTTP beacon
    crit: hostile
    conf: 0.98
    all:
      - id: rust-agent-id-header
      - id: rust-agent-data-marker
      - id: micro-behaviors/communications/http/url/telemetry::beacon-path-token
