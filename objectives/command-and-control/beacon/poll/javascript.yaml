# Script-implant polling loop: register, take a session token, sleep a
# server-supplied interval plus jitter, ask for work, repeat.
#
# Two structural pieces of that loop generalise past any one family:
#
#   * The registration reply arrives as an HTTP *error* status. Both Node.js
#     implants in the Mirage Kitten coding-challenge campaign answer /beacon
#     and /api/rabbit/checkin with 400 and carry the session token in the error
#     body, so a proxy log, a NetFlow summary and a triage analyst all read the
#     exchange as a failed request. The 400 comparison itself is already an
#     atom (communications/http/response-code); what is detected here is the
#     token read sitting next to it. 401/403 are deliberately out of scope --
#     an auth error followed by a token read is the ordinary OAuth refresh
#     path, and matching it would fire on every API client.
#
#   * The sleep is a server-controlled interval plus a random jitter. Ordinary
#     polling clients hard-code their cadence or back off on failure; taking
#     both the period and a randomisation window from the response is beacon
#     traffic shaping, done to break the fixed-period signature a network
#     sensor keys on.
#
# ATT&CK: T1071.001 (Web Protocols), T1029 (Scheduled Transfer)
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  attack: T1071.001
  mbc: B0030
traits:
  - id: server-supplied-interval-and-jitter
    desc: Response supplies poll interval and jitter
    crit: suspicious
    conf: 0.88
    attack: T1029
    if:
      type: text
      regex: '(?i)\b\w*(poll|sleep|beacon)(Interval|Time)\b[\s\S]{0,160}\bjitter\w*\b'

  - id: jittered-poll-reschedule
    desc: Reschedules a poll after interval plus jitter
    crit: suspicious
    conf: 0.88
    attack: T1029
    if:
      type: text
      regex: 'setTimeout\([\s\S]{0,140}\w+\s*\+\s*(Math\.\w+\()?\s*Math\.random\(\)\s*\*'

composite_rules:
  - id: error-status-registration-token
    desc: Takes a session token from a 400 response
    crit: suspicious
    conf: 0.9
    near_bytes: 512
    all:
      - id: micro-behaviors/communications/http/response-code::http-400-response
      - id: micro-behaviors/communications/http/auth::socket-session-id-member

  - id: error-status-registration-beacon
    desc: Registers over HTTP, treating a 4xx as success
    crit: hostile
    conf: 0.94
    attack: T1071.001,T1029
    all:
      - id: error-status-registration-token
      - id: micro-behaviors/communications/http/request/client::node-http-request-stream-body
    any:
      - id: server-supplied-interval-and-jitter
      - id: jittered-poll-reschedule

  - id: jittered-task-polling-beacon
    desc: Polls for tasks on a jittered server-set schedule
    crit: hostile
    conf: 0.93
    attack: T1071.001,T1029
    all:
      - id: server-supplied-interval-and-jitter
      - id: jittered-poll-reschedule
      - id: micro-behaviors/communications/http/request/client::node-http-request-stream-body
    any:
      - id: micro-behaviors/process/interpreter/eval::js-new-function-constructor
      - id: micro-behaviors/process/create/system::js-execfile-call
      - id: micro-behaviors/process/create/exec::node-execfile-reference
