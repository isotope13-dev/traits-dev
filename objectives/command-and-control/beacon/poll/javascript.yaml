# Script-implant polling loop: register, take a session token, sleep a
# server-supplied interval plus jitter, ask for work, repeat.
#
# Two structural pieces of that loop generalise past any one family:
#
#   * The registration reply arrives as an HTTP *error* status. Both Node.js
#     implants in the Mirage Kitten coding-challenge campaign answer /beacon
#     and /api/rabbit/checkin with 400 and carry the session token in the error
#     body, so a proxy log, a NetFlow summary and a triage analyst all read the
#     exchange as a failed request. The 400 comparison itself is already an
#     atom (communications/http/response-code); what is detected here is the
#     token read sitting next to it. 401/403 are deliberately out of scope --
#     an auth error followed by a token read is the ordinary OAuth refresh
#     path, and matching it would fire on every API client.
#
#   * The sleep is a server-controlled interval plus a random jitter. Ordinary
#     polling clients hard-code their cadence or back off on failure; taking
#     both the period and a randomisation window from the response is beacon
#     traffic shaping, done to break the fixed-period signature a network
#     sensor keys on.
#
# ATT&CK: T1071.001 (Web Protocols), T1029 (Scheduled Transfer)
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  attack: T1071.001
  mbc: B0030
composite_rules:
  - id: error-status-registration-beacon
    desc: Registers over HTTP, treating a 4xx as success
    crit: hostile
    conf: 0.94
    attack: T1071.001,T1029
    all:
      - id: micro-behaviors/communications/http/response::http-400-session-id-clues
      - id: micro-behaviors/communications/http/request/body/construction::node-http-request-stream-body
    any:
      - id: micro-behaviors/time/schedule/interval::jittered-poll-interval
      - id: micro-behaviors/time/schedule/timeout::jittered-timeout-delay

  - id: jittered-task-polling-beacon
    desc: Polls for tasks on a jittered server-set schedule
    crit: hostile
    conf: 0.93
    attack: T1071.001,T1029
    all:
      - id: micro-behaviors/time/schedule/interval::jittered-poll-interval
      - id: micro-behaviors/time/schedule/timeout::jittered-timeout-delay
      - id: micro-behaviors/communications/http/request/body/construction::node-http-request-stream-body
    any:
      - id: micro-behaviors/metaprogramming/generation/function::js-new-function-constructor
      - id: micro-behaviors/process/create/exec::js-execfile-call
      - id: metadata/lang/source/naming/interface/execution::execfile-identifier-text

  - id: persistent-webview-bridge-c2-relay
    desc: Jittered C2 poller relays to WebView bridge
    crit: hostile
    conf: 0.96
    attack: T1071.001,T1029
    all:
      - id: micro-behaviors/data/db/write::browser-storage-persistence
      - id: micro-behaviors/time/schedule/interval::jittered-poll-interval
      - id: micro-behaviors/communications/http/request/json::json-body-post
      - id: micro-behaviors/communications/ipc/bridge::hybrid-webview-js-bridge

  - id: periodic-curl-beacon-timer
    desc: Configures a scheduled periodic curl beacon to a remote host
    crit: hostile
    conf: 0.98
    all:
      - id: objectives/persistence/system/cron/schedule::source-systemd-curl-exec
      - id: micro-behaviors/time/schedule/interval::systemd-timer-schedule-literal
      - id: micro-behaviors/communications/url/host/domain-http::js-remote-host-url
    unless:
      - id: metadata/path/directory::test-directory-component

  # Attested feed: challenge nonce is echoed in an attest POST, the bearer
  # token from that reply authorises a GET of the feed, and the feed text is
  # later invoked through a module call on a timer. Each constituent is common
  # alone; the attest handshake and text-to-module invocation together are not.
  - id: attested-remote-feed-module-tasking
    desc: Attested feed poll invokes fetched text via module
    crit: hostile
    conf: 0.96
    attack: T1071.001,T1105,T1059.007
    # Bundled clients commonly contain all six primitives in unrelated code.
    # The feed exchange and its use must be part of one short code path.
    near_lines: 40
    near_bytes: 2048
    all:
      - id: micro-behaviors/communications/url/reference::attest-challenge-endpoint-path
      - id: micro-behaviors/communications/http/request/json::json-body-nonce-echo
      - id: micro-behaviors/communications/http/authorization-header::bearer-header-from-token
      - id: micro-behaviors/communications/http/client/response-body::js-response-text-read
      - id: micro-behaviors/time/schedule/interval::setInterval
      - id: micro-behaviors/data/control-flow/direct-call::identifier-call-with-true-flag

  - id: attest-host-environment-report
    desc: Attestation request reports environment key list
    crit: suspicious
    conf: 0.9
    all:
      - id: micro-behaviors/communications/url/reference::attest-challenge-endpoint-path
      - id: micro-behaviors/os/env/enumerate/copy::json-body-env-keys-field
      - id: micro-behaviors/communications/http/request/json::json-body-nonce-echo

  # Interval poll of a hardcoded remote text feed that authenticates with a
  # Bearer token and reports the host's platform in its request. The feed is
  # read as text on every tick, so the operator controls the content that the
  # package then acts on. Each leg is common alone; the interval, the remote
  # host, the platform field and the token-authorized text read together are
  # the remote-controlled feed pattern. The legs must sit within one 40-line
  # window and one ~1 KiB span: a bundle that merely contains a timer, an API
  # client and a platform check elsewhere is ordinary software, not a feed
  # poller.
  - id: attested-remote-text-feed-poll
    desc: Interval poll reads remote text with a token and platform
    crit: hostile
    conf: 0.95
    attack: T1071.001,T1029
    scope: file
    near_lines: 40
    near_bytes: 1024
    all:
      - id: micro-behaviors/time/schedule/interval::setInterval
      - id: micro-behaviors/communications/http/client/response-body::js-response-text-read
      - id: micro-behaviors/communications/http/authorization-header::bearer-header-from-token
      - id: micro-behaviors/os/sysinfo/platform/runtime/platform::process-platform-member
    any:
      - id: micro-behaviors/communications/url/host/domain-http::js-remote-host-url
      - id: micro-behaviors/communications/url/encoded::base64-decoded-http-url

  # A challenge-response attestation: the client fetches a nonce, then POSTs
  # the nonce with host platform data as JSON to receive a session token. The
  # token is then required for the content fetch, so the server decides what
  # the host receives. Attestation alone is ordinary license or device checks;
  # it is suspicious here only as the gate in front of a remote feed. The
  # JSON body, platform field and bearer header must be co-located, so a
  # platform check in one function and a token-bearing call in another do not
  # combine into an attestation.
  - id: challenge-attest-platform-token-gate
    desc: Posts platform nonce to attest endpoint for a token
    crit: suspicious
    conf: 0.9
    scope: file
    near_lines: 40
    # The handshake itself must be present: a /attest or /challenge endpoint
    # and a JSON body that echoes a server-issued nonce. Without those legs a
    # generic API client that sends os/arch metadata in a JSON POST and then
    # uses a bearer token (a coding assistant's model request, for example)
    # matches the three transport legs alone.
    all:
      - id: micro-behaviors/communications/url/reference::attest-challenge-endpoint-path
      - id: micro-behaviors/communications/http/request/json::json-body-nonce-echo
      - id: micro-behaviors/communications/http/request/json::fetch-json-stringify-body
      - id: micro-behaviors/os/sysinfo/platform/runtime/platform::process-platform-member
      - id: micro-behaviors/communications/http/authorization-header::bearer-header-from-token
