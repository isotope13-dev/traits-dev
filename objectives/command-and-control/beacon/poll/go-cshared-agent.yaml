# A Go c-shared library whose exported surface is only a Start/Stop lifecycle
# while its body is an object-storage polling client that runs processes.
# Host code (an npm wrapper, Python ctypes, a plugin loader) calls Start and the
# library beacons from inside that process; nothing in the host shows network
# or execution code of its own.
defaults:
  platforms: [unix, windows]
  for: [binaries]
  attack: T1102.002,T1129

composite_rules:
  - id: go-cshared-bucket-polling-agent
    desc: Go c-shared library with Start/Stop exports runs a bucket-polling task agent
    crit: hostile
    conf: 0.92
    all:
      - id: metadata/lang/go-build::cgo-exported-start-stop-lifecycle
      - id: micro-behaviors/communications/http/services/tencent::go-cos-list-get-put-client
      - id: metadata/binary/symbols/name/process::go-os-exec-package-reference
    any:
      - id: micro-behaviors/communications/http/request/tasking::go-inbox-outbox-key-methods
      - id: micro-behaviors/communications/http/request/tasking::go-liveness-object-method
