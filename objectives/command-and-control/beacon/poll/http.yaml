defaults:
  platforms:
    - linux
    - macos
    - windows
  for: [elf, macho, pe]
traits:
  - id: http-client-dup
    desc: http.Client type
    crit: notable
    conf: 0.6
    if:
      type: symbol
      exact: http.Client
  - id: time-ticker
    desc: time.Ticker periodic execution
    crit: notable
    conf: 0.6
    if:
      type: symbol
      exact: time.Ticker
composite_rules:
  - id: objectives/command-and-control/beacon/poll::http-client-dup-funcs
    desc: HTTP client request evidence
    any:
      - id: objectives/evasion/fileless/memory::http-client-dup
      - id: micro-behaviors/communications/http/lib/netlib::go-http-client-do-string
    crit: component
    unless:
      - id: well-known/app/development/kilocode::kilo-code-native-runtime
      - id: well-known/tool/reverse-engineering/frida/
      - id: well-known/app/infrastructure/turboadb::official-turboadb-gui
      - id: well-known/tool/sysadmin/alpine-packages::alpine-filebrowser-binary
  - id: interval-funcs
    desc: Periodic scheduling evidence
    any:
      - id: time-ticker
      - id: micro-behaviors/time/sleep/interval::go-time-sleep
    crit: component
    unless:
      - id: well-known/tool/sysadmin/alpine-packages::alpine-filebrowser-binary
  - id: http-customization
    desc: HTTP request carries an Authorization header
    any:
      - id: micro-behaviors/communications/http/headers::auth-header
      - id: micro-behaviors/communications/http/headers::authorization-header-map-entry
      - id: micro-behaviors/communications/http/request/client::hardcoded-auth-token
      - id: micro-behaviors/communications/http/lib/netlib::go-http-header-auth
    crit: component
    unless:
      - id: well-known/app/development/kilocode::kilo-code-native-runtime
      - id: well-known/tool/reverse-engineering/frida/
  - id: c2-beacon
    desc: HTTP C2 beacon pattern
    crit: suspicious
    conf: 0.7
    attack: T1071.001
    all:
      - id: objectives/command-and-control/beacon/poll::http-client-dup-funcs
      - id: interval-funcs
      - id: http-customization
    any:
      - id: micro-behaviors/data/encode/base64::encoding-base64-import
      - id: micro-behaviors/data/serialize/json::encoding-json-import
    unless:
      # Large binaries (>50MB) are infrastructure/platform tools, not C2 agents
      - id: metadata/binary/metrics/size::massive-executable
      - id: metadata/package/testing/harness/unit/
