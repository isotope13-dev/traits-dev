defaults:
  crit: suspicious
  attack: T1071.001
  mbc: B0030
  for: [scripts, binaries]
  platforms:
    - unix
    - windows
traits:
  - id: c2-cmd-type-check
    desc: C2 command type numeric check
    crit: suspicious
    conf: 0.85
    if:
      type: string_literal
      regex: cmd[_-]?type.{0,50}==.{0,50}["']?[0-9]{3}["']?
  - id: c2-response-code-extract
    desc: C2 response code extraction
    crit: suspicious
    conf: 0.85
    if:
      type: string_literal
      regex: res\[.{0,50}:.{0,50}\+[0-9]{3,}
  - id: c2-response-substring-13-primary
    desc: Response substring slice [13:]
    crit: suspicious
    conf: 0.8
    if:
      type: string_literal
      regex: \b(res|resp|response)\s*\[\s*13\s*:\s*\]
  - id: c2-response-substring-13-secondary
    desc: Reply substring slice [13:]
    crit: suspicious
    conf: 0.8
    if:
      type: string_literal
      regex: \b(reply|packet|msg)\s*\[\s*13\s*:\s*\]
  - id: c2-response-substring-code-primary
    desc: Response code slice [10:13]
    crit: suspicious
    conf: 0.8
    if:
      type: string_literal
      regex: \b(res|resp|response)\s*\[\s*10\s*:\s*13\s*\]
  - id: c2-response-substring-code-secondary
    desc: Reply code slice [10:13]
    crit: suspicious
    conf: 0.8
    if:
      type: string_literal
      regex: \b(reply|packet|msg)\s*\[\s*10\s*:\s*13\s*\]
  - id: c2-request-prefix
    desc: C2 request prefix pattern
    crit: suspicious
    conf: 0.8
    if:
      type: string_literal
      regex: ^[A-Z]+_REQ[0-9]
  - id: c2-response-prefix
    desc: C2 response prefix pattern
    crit: suspicious
    conf: 0.8
    if:
      type: string_literal
      regex: ^[A-Z]+_RES[0-9]
  # The four opcode atoms below match a `cmd`-ish token next to one three-digit
  # number. That is one leg of a signature, not a standalone observation: any
  # program with a numeric command/keycode table produces `cmd == 502` by
  # coincidence (openclaw's terminal handling did). Their meaning comes entirely
  # from c2-command-suite, which requires three of the four opcodes together --
  # so they are components, and the suite composite is unchanged.
  - id: c2-cmd-info-collection
    desc: C2 info collection opcode literal (501)
    crit: component
    conf: 0.5
    if:
      type: text
      regex: (cmd|command|cmd_type|cmdType)[\s=:]*501
  - id: c2-cmd-exec
    desc: C2 command-execution opcode literal (502)
    crit: component
    conf: 0.5
    if:
      type: text
      regex: (cmd|command|cmd_type|cmdType)[\s=:]*502
  - id: c2-cmd-download
    desc: C2 download opcode literal (503)
    crit: component
    conf: 0.5
    if:
      type: text
      regex: (cmd|command|cmd_type|cmdType)[\s=:]*503
  - id: c2-cmd-kill
    desc: C2 self-terminate opcode literal (504)
    crit: component
    conf: 0.5
    if:
      type: text
      regex: (cmd|command|cmd_type|cmdType)[\s=:]*504
  - id: c2-protocol-builder
    desc: C2 protocol string builder
    crit: suspicious
    conf: 0.8
    if:
      type: string_literal
      regex: '[A-Z]+_REQ.{0,50}\+.{0,50}01.{0,50}\+.{0,50}00.{0,50}\+'
  - id: c2-base64-response
    desc: C2 base64 encoded response
    crit: suspicious
    conf: 0.75
    if:
      type: string_literal
      regex: 'b64decode.{0,50}res\[13:'
composite_rules:
  - id: c2-structured-protocol
    desc: C2 structured command protocol
    crit: suspicious
    conf: 0.9
    needs: 2
    any:
      - id: c2-cmd-type-check
      - id: c2-response-code-extract
      - id: c2-response-substring-13-primary
      - id: c2-response-substring-13-secondary
      - id: c2-response-substring-code-primary
      - id: c2-response-substring-code-secondary
      - id: c2-request-prefix
      - id: c2-response-prefix
      - id: c2-protocol-builder
  - id: c2-response-substring
    desc: C2 response substring parsing
    crit: suspicious
    conf: 0.9
    any:
      - id: c2-response-substring-13-primary
      - id: c2-response-substring-13-secondary
      - id: c2-response-substring-code-primary
      - id: c2-response-substring-code-secondary
  # Three of four numeric opcodes, and nothing else, is an opcode table -- a
  # coherent observation but not proof of a C2 protocol on its own, which is
  # why every leg below is a component. c2-full-protocol stays hostile: it adds
  # the structured request/response parsing that makes the opcodes meaningful.
  - id: c2-command-suite
    desc: C2 multi-command opcode table
    crit: suspicious
    conf: 0.95
    for:
      - python
      - javascript
    needs: 3
    any:
      - id: c2-cmd-info-collection
      - id: c2-cmd-exec
      - id: c2-cmd-download
      - id: c2-cmd-kill
  - id: c2-full-protocol
    desc: C2 command and control protocol
    crit: hostile
    conf: 0.98
    all:
      - id: c2-structured-protocol
      - id: c2-command-suite
