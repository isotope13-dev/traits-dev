defaults:
  crit: suspicious
  attack: T1036.005
  mbc: B0030
  for: [python, javascript, shell, pe, elf, macho]
  platforms:
    - linux
    - macos
    - windows
traits:
  - id: typosquat-git-hub-domain
    desc: Git typosquat domain
    crit: suspicious
    conf: 0.95
    if:
      type: text
      # Require a real public suffix. Angular/Nest module paths such as
      # `git-hub.service` / `git-hub.module` are source basenames, not domains.
      regex: '(?i)\bgit-hub\.(com|net|org|io|co|ru|cn|info|biz|xyz|top|cc|tk|ml|ga|cf)\b'
    unless:
      - id: well-known/tool/detection/malcontent::malcontent-defensive-scanner-context
  - id: typosquat-githab-domain
    desc: Githab typosquat domain
    crit: suspicious
    conf: 0.95
    if:
      type: text
      regex: githab\.[a-z]{2,}
  - id: typosquat-githup-domain
    desc: Githup typosquat domain
    crit: suspicious
    conf: 0.95
    if:
      type: text
      regex: githup\.[a-z]{2,}
  - id: typosquat-letter-swap-1
    desc: Letter swap typosquat 1
    crit: suspicious
    conf: 0.8
    if:
      type: text
      regex: (githuk\.|gihhub\.|gituhb\.)[a-z]{2,}
  - id: typosquat-letter-swap-2
    desc: Letter swap typosquat 2
    crit: suspicious
    conf: 0.8
    if:
      type: text
      regex: (githbu\.|githyb\.)[a-z]{2,}
  # `googie-anaiytics.com` -- the 2024 polyfill.io injection's payload host,
  # built by swapping `l` for `i` twice in `google-analytics.com`. Analytics
  # hostnames are the ideal cover for an injected script: every page already
  # loads one, so a reviewer skimming network requests reads past it. Match the
  # near-miss spellings and filter the genuine domain out of the evidence.
  - id: typosquat-google-analytics-domain
    desc: Google Analytics typosquat domain
    crit: suspicious
    conf: 0.95
    if:
      type: text
      regex: '(?i)\bgoo(gie|g1e|gle)-ana(iy|1y|ly)tics\.[a-z]{2,}\b'
    not:
      - regex: '(?i)^google-analytics\.'
  - id: typosquat-google-domain
    desc: Google typosquat domain
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: \b(gooogle|googel|goggle)\.[a-z]{2,}\b
    unless:
      - id: metadata/package/testing/presence/fixture::test-filename-pattern
      - id: metadata/package/testing/harness/runtime::test-basename-suffix
      - type: text
        substr: buyaple.com
      - type: text
        substr: apple.cm
      - type: text
        regex: \b(gooogle|googel|goggle)\.[a-z]{2,}\b
        section: .rsrc
      - id: metadata/package/quality/
  - id: typosquat-apple-domain
    desc: Apple typosquat domain
    crit: suspicious
    conf: 0.95
    if:
      type: text
      regex: \b(appple|aple|applee)\.[a-z]{2,}\b
    unless:
      - type: text
        substr: buyaple.com
      - type: text
        substr: apple.cm
      - type: text
        regex: \b(appple|aple|applee)\.[a-z]{2,}\b
        section: .rsrc
    downgrade:
      any:
        - id: metadata/signed/platform::apple
  - id: typosquat-microsoft-domain
    desc: Microsoft typosquat domain
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: (microsof|microsft|micrsoft)\.[a-z]{2,}
    downgrade:
      any:
        - id: metadata/binary/vendor/
        - id: metadata/signed/platform/
  - id: c2-view-php-endpoint
    desc: C2 view.php endpoint
    crit: component
    conf: 0.75
    if:
      type: text
      regex: view\.php\?
  - id: c2-gate-php-endpoint
    desc: C2 gate.php endpoint
    crit: component
    conf: 0.75
    if:
      type: text
      regex: gate\.php
  - id: c2-panel-php-endpoint
    desc: C2 panel.php endpoint
    crit: component
    conf: 0.75
    if:
      type: text
      regex: panel\.php
composite_rules:
  - id: github-typosquat
    desc: GitHub typosquatting domain
    crit: suspicious
    conf: 0.95
    any:
      - id: typosquat-git-hub-domain
      - id: typosquat-githab-domain
      - id: typosquat-githup-domain
      - id: objectives/command-and-control/infrastructure/domain/brand-impersonation::github-double-letter-typosquat-domain
      - id: typosquat-letter-swap-1
      - id: typosquat-letter-swap-2
  - id: popular-service-typosquat
    desc: Popular service typosquatting
    crit: suspicious
    conf: 0.95
    any:
      - id: typosquat-google-domain
      - id: typosquat-apple-domain
      - id: typosquat-microsoft-domain
  - id: c2-php-endpoint
    desc: C2 PHP endpoint pattern
    crit: component
    conf: 0.8
    attack: T1071.001
    any:
      - id: c2-view-php-endpoint
      - id: c2-gate-php-endpoint
      - id: c2-panel-php-endpoint
  - id: typosquat-c2-combo
    desc: Typosquat domain with C2 endpoint
    crit: suspicious
    conf: 0.98
    all:
      - id: github-typosquat
      - id: c2-php-endpoint

  # A lookalike analytics host is only a name until something loads code from
  # it. Injecting a <script> whose src is a near-miss of a real analytics
  # domain is the 2024 polyfill.io pattern and the general shape of a CDN
  # supply-chain inject: the second stage arrives from a host that reads as
  # ordinary telemetry in any network log.
  - id: typosquat-analytics-script-load
    desc: Script loaded from lookalike analytics host
    crit: hostile
    conf: 0.96
    scope: file
    attack: T1189
    all:
      - id: typosquat-google-analytics-domain
      - id: micro-behaviors/communications/http/client/resource::dynamic-script-element-load

