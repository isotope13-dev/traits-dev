defaults:
  crit: suspicious
  attack: T1036.005
  mbc: B0030
  for: [python, javascript, shell, pe, elf, macho]
  platforms:
    - linux
    - macos
    - windows
traits:
  - id: typosquat-git-hub-domain
    desc: Git typosquat domain
    crit: suspicious
    conf: 0.95
    if:
      type: text
      # Require a real public suffix. Angular/Nest module paths such as
      # `git-hub.service` / `git-hub.module` are source basenames, not domains.
      regex: '(?i)\bgit-hub\.(com|net|org|io|co|ru|cn|info|biz|xyz|top|cc|tk|ml|ga|cf)\b'
    unless:
      - id: well-known/tool/detection/malcontent::malcontent-defensive-scanner-context
  - id: typosquat-githab-domain
    desc: Githab typosquat domain
    crit: suspicious
    conf: 0.95
    if:
      type: text
      regex: githab\.[a-z]{2,}
    unless:
      - id: well-known/app/browser-extension/content-blocker::adblock-filter-resource
      - id: well-known/tool/detection/
      - id: metadata/package/testing/
  - id: typosquat-githup-domain
    desc: Githup typosquat domain
    crit: suspicious
    conf: 0.95
    if:
      type: text
      regex: githup\.[a-z]{2,}
  - id: typosquat-letter-swap-1
    desc: Letter swap typosquat 1
    crit: suspicious
    conf: 0.8
    if:
      type: text
      regex: (githuk\.|gihhub\.|gituhb\.)[a-z]{2,}
  - id: typosquat-letter-swap-2
    desc: Letter swap typosquat 2
    crit: suspicious
    conf: 0.8
    if:
      type: text
      regex: (githbu\.|githyb\.)[a-z]{2,}
    unless:
      - id: well-known/tool/detection/agent-glovebox::archive-context
  # `googie-anaiytics.com` -- the 2024 polyfill.io injection's payload host,
  # built by swapping `l` for `i` twice in `google-analytics.com`. Analytics
  # hostnames are the ideal cover for an injected script: every page already
  # loads one, so a reviewer skimming network requests reads past it. Match the
  # near-miss spellings and filter the genuine domain out of the evidence.
  - id: typosquat-google-analytics-domain
    desc: Google Analytics typosquat domain
    crit: suspicious
    conf: 0.95
    if:
      type: text
      regex: '(?i)\bgoo(gie|g1e|gle)-ana(iy|1y|ly)tics\.[a-z]{2,}\b'
    not:
      - regex: '(?i)^google-analytics\.'
    unless:
      - id: well-known/app/browser-extension/content-blocker::adblock-filter-resource
      # The serialized adblocker engine (browserless/goto engine.bin) carries
      # this host as a BLOCK rule; nothing loads it.
      - id: well-known/lib/data/easylist::engine-serialization
  - id: typosquat-google-domain
    desc: Google typosquat domain
    crit: suspicious
    conf: 0.95
    if:
      type: text
      # Require a real public suffix. Source basenames such as Brave Goggles
      # configs (`programming-goggle.json`) are filenames, not domains.
      regex: \b(gooogle|googel|goggle)\.(com|net|org|io|co|ru|cn|info|biz|xyz|top|cc|tk|ml|ga|cf)\b
    unless:
      - id: metadata/package/testing/presence/fixture::test-filename-pattern
      - id: metadata/package/testing/harness/runtime::test-basename-suffix
      # A candidate-domain filter lists lookalike names to drop, among
      # hundreds of other quoted hostnames; they are data being excluded.
      - id: metadata/file/catalog/identity::embedded-domain-blocklist-context
      - type: text
        substr: buyaple.com
      - type: text
        substr: apple.cm
      # Kept broad on purpose: this carve-out only needs to recognize the
      # lookalike token inside resource strings, not re-assert the suffix gate.
      - type: text
        regex: \b(gooogle|googel|goggle)\.[a-z]{2,}\b
        section: .rsrc
      - id: metadata/build/recognized-contexts/
      # Referrer-source tables (Snowplow/Matomo referer-parser, analytics and
      # support-inbox attribution) deliberately list misspelled search domains
      # as rows of `medium<TAB>Source<TAB>domain`, so the lookalike is data
      # that classifies visitors, not a host the program contacts.
      - type: text
        regex: '(?m)^(search|social|email|paid)\t[A-Z][\w .&-]{1,30}\t[a-z0-9]'
      # Genuine Microsoft-signed Edge embeds lookalike tables as protection
      # data, not beacon targets.
      - id: metadata/signed/certificate/signature::microsoft-signed-edge-runtime-context
  - id: typosquat-apple-domain
    desc: Apple typosquat domain
    crit: suspicious
    conf: 0.95
    if:
      type: text
      regex: \b(appple|aple|applee)\.[a-z]{2,}\b
    unless:
      - type: text
        substr: buyaple.com
      - type: text
        substr: apple.cm
      - type: text
        regex: \b(appple|aple|applee)\.[a-z]{2,}\b
        section: .rsrc
    downgrade:
      any:
        - id: metadata/signed/platform::apple
  - id: typosquat-microsoft-domain
    desc: Microsoft typosquat domain
    crit: suspicious
    conf: 0.95
    if:
      type: text
      # Require a real public suffix (same gate as typosquat-google-domain).
      # Edge packs its host table with suffix compression, and the overlap
      # between `copilot.microsoft.com` and `copilot-stg.com` yields the
      # byte run `microsof.copilot` — `copilot` is no TLD.
      regex: (microsof|microsft|micrsoft)\.(com|net|org|io|co|ru|cn|info|biz|xyz|top|cc|tk|ml|ga|cf)\b
    unless:
      # Microsoft's Windows Application Certification Kit license text contains a typoed URL on download.microsft.com.
      - type: text
        substr: "Application Certification Kit"
      # Microsoft Fabric OneLake storage endpoints compiled into cloud storage clients.
      - type: text
        substr: "fabric.microsoft"
      - type: text
        substr: "dfs.fabric"
      # The genuine Microsoft-signed Edge runtime packs its own host table
      # (copilot.microsoft.com, copilot-stg.com); compression artifacts in
      # that table are vendor strings, not beacon infrastructure.
      - id: metadata/signed/certificate/signature::microsoft-signed-edge-runtime-context
    downgrade:
      any:
        - id: metadata/binary/vendor/
        - id: metadata/signed/platform/
  - id: c2-view-php-endpoint
    desc: C2 view.php endpoint
    crit: component
    conf: 0.75
    if:
      type: text
      substr: 'view.php?'
  - id: c2-gate-php-endpoint
    desc: C2 gate.php endpoint
    crit: component
    conf: 0.75
    if:
      type: text
      substr: 'gate.php'
  - id: c2-panel-php-endpoint
    desc: C2 panel.php endpoint
    crit: component
    conf: 0.75
    if:
      type: text
      substr: 'panel.php'
  # `analytics-google.<tld>` swaps the two words of `google-analytics`.
  # Google never hosted telemetry there.
  - id: reversed-google-analytics-host
    desc: Reversed Google Analytics hostname
    crit: suspicious
    conf: 0.95
    for: [html, javascript]
    if:
      type: text
      regex: '(?i)\banalytics-google\.[a-z]{2,8}\b'
    unless:
      - id: well-known/app/browser-extension/content-blocker::adblock-filter-resource
composite_rules:
  - id: github-typosquat
    desc: GitHub typosquatting domain
    crit: suspicious
    conf: 0.95
    unless:
      - id: well-known/app/browser-extension/content-blocker::adblock-filter-resource
    any:
      - id: typosquat-git-hub-domain
      - id: typosquat-githab-domain
      - id: typosquat-githup-domain
      - id: objectives/command-and-control/infrastructure/domain/brand-impersonation::github-double-letter-typosquat-domain
      - id: typosquat-letter-swap-1
      - id: typosquat-letter-swap-2
  - id: popular-service-typosquat
    desc: Popular service typosquatting
    crit: suspicious
    conf: 0.95
    any:
      - id: typosquat-google-domain
      - id: typosquat-apple-domain
      - id: typosquat-microsoft-domain
  - id: c2-php-endpoint
    desc: C2 PHP endpoint pattern
    crit: component
    conf: 0.8
    attack: T1071.001
    any:
      - id: c2-view-php-endpoint
      - id: c2-gate-php-endpoint
      - id: c2-panel-php-endpoint
  - id: typosquat-c2-combo
    desc: Typosquat domain with C2 endpoint
    crit: suspicious
    conf: 0.98
    near_bytes: 500
    all:
      - id: github-typosquat
      - id: c2-php-endpoint
    unless:
      - id: well-known/app/browser-extension/content-blocker::adblock-filter-resource

  # A lookalike analytics host is only a name until something loads code from
  # it. Injecting a <script> whose src is a near-miss of a real analytics
  # domain is the 2024 polyfill.io pattern and the general shape of a CDN
  # supply-chain inject: the second stage arrives from a host that reads as
  # ordinary telemetry in any network log.
  # `analytics-google.<tld>` is the word-swapped form of that cover.
  - id: reversed-analytics-script-load
    desc: Script loads from reversed analytics host
    crit: hostile
    conf: 0.96
    for: [html]
    attack: T1189
    near_bytes: 200
    all:
      - id: reversed-google-analytics-host
      - id: micro-behaviors/communications/http/client/resource::remote-script-element-source
    unless:
      - id: well-known/app/browser-extension/content-blocker::adblock-filter-resource

  - id: typosquat-analytics-script-load
    for: [elf, macho, pe, javascript]
    desc: Script loaded from lookalike analytics host
    crit: hostile
    conf: 0.96
    scope: file
    attack: T1189
    all:
      - id: typosquat-google-analytics-domain
      - id: micro-behaviors/data/collection/dom::script-create-near-src-assignment
    unless:
      # A serialized adblock engine carries the block rules and noop scriptlets
      # for exactly these hosts; nothing here loads a script from them.
      - id: well-known/lib/data/easylist::engine-serialization
      - id: well-known/app/browser-extension/content-blocker::adblock-filter-resource
