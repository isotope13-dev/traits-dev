defaults:
  platforms: [unix, windows, macos]
  for: [javascript, typescript, npm, tar, tgz, archives]
  attack: T1041,T1071.001,T1552.001
  mbc: E1041

composite_rules:
  - id: node-hardcoded-endpoint-environment-relay
    desc: Node relays process environment to a hardcoded HTTP endpoint
    crit: hostile
    conf: 0.99
    scope: archive
    all:
      - id: micro-behaviors/os/env/read::node-process-env-object-copy
      - id: objectives/exfiltration/http/upload::node-upload-sink
      - id: objectives/command-and-control/infrastructure/ip-port::hardcoded-js-ip-port-endpoint
      - id: micro-behaviors/data/encode/base64::node-buffer-base64-encode
      - id: micro-behaviors/data/control-flow/error-handling::silent-error-handler
