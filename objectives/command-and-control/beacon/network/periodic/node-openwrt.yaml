defaults:
  platforms: [openwrt]
  for: [javascript, typescript]
  attack: T1071.001
  mbc: B0030

traits:
  - id: node-etc-config-marker
    desc: Node /etc/config marker
    crit: notable
    conf: 0.86
    if:
      type: text
      # OpenWrt UCI file paths (/etc/config/wireless), not mock paths with extensions.
      regex: '["''`](/etc/config/[a-zA-Z0-9_-]+)["''`]'
  - id: node-openwrt-agent-user-agent
    desc: Node OpenWrt agent User-Agent string
    crit: notable
    conf: 0.86
    if:
      type: text
      regex: 'OpenWrt[^"'']{0,40}Agent|openwrt-agent'

composite_rules:
  - id: openwrt-node-http-beacon
    desc: OpenWrt Node periodic HTTP beacon
    crit: hostile
    conf: 0.96
    all:
      - id: micro-behaviors/communications/http/request/client::https-request
      - id: micro-behaviors/communications/http/request/verb::post-method-text
      - id: micro-behaviors/communications/http/url/api-path::node-heartbeat-path
      - id: node-etc-config-marker
    any:
      - id: node-openwrt-agent-user-agent
      - id: micro-behaviors/time/schedule/timeout::setTimeout
      - id: micro-behaviors/data/control-flow/dispatch::command-member-or-handler-reference
    needs: 1
