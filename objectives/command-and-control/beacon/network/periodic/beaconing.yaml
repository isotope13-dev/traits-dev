defaults:
  crit: suspicious
  attack: T1071.001
  mbc: B0030
  for: [scripts, binaries]
  platforms:
    - unix
    - windows
traits:
  # The request/response polling legs moved to their neutral homes; the
  # composites below reference them cross-directory and supply the C2
  # context. See micro-behaviors/communications/http/request/client and
  # micro-behaviors/communications/http/client/response-body.
  - id: try-except-sleep
    desc: Try-except with sleep
    crit: suspicious
    conf: 0.75
    if:
      type: string_literal
      regex: try:.{0,50}sleep.{0,50}except|except.{0,50}sleep.{0,50}continue
    unless:
      # Recorded agent transcripts embed candidate scripts as data; a
      # wait-and-retry line inside a stored run is a record, not this file's
      # beacon loop.
      - id: micro-behaviors/data/llm/agent::agent-trajectory-record-context
      - id: metadata/package/testing/harness/runtime::benchmark-task-agent-record
  - id: request-exception-sleep
    desc: Request exception with sleep
    crit: suspicious
    conf: 0.8
    if:
      type: string_literal
      regex: RequestException.{0,50}sleep|sleep.{0,50}RequestException
    unless:
      - id: micro-behaviors/data/llm/agent::agent-trajectory-record-context
      - id: metadata/package/testing/harness/runtime::benchmark-task-agent-record
composite_rules:
  # A beacon is network traffic on a timer; the sleep interval alone is not
  # evidence of one. The 60-second-sleep leg used to sit in the any: below,
  # which convicted ordinary wait loops — device-boot polling in Skia's
  # buildbot recipes, installers, daemons — that never touch the network.
  # Only the request/response legs carry the C2 claim; periodicity is
  # already established by the two all: legs.
  - id: c2-sleep-beacon
    for: [python]
    unless:
      - id: well-known/lib/ai/unsloth::unsloth-package-context
    desc: C2 sleep beacon pattern
    crit: suspicious
    conf: 0.85
    attack: T1029
    all:
      - id: micro-behaviors/data/control-flow/loop::python-while-true
      - id: micro-behaviors/data/control-flow/loop::sleep-near-while-loop
    any:
      - id: micro-behaviors/communications/http/lib/requests::http-polling-request-loop
      - id: micro-behaviors/communications/http/client/response-body::http-response-status-check-loop
  - id: c2-polling-beacon
    desc: C2 polling beacon
    crit: suspicious
    conf: 0.9
    needs: 2
    any:
      - id: micro-behaviors/communications/http/lib/requests::http-polling-request-loop
      - id: micro-behaviors/communications/http/client/response-body::http-response-status-check-loop
      - id: micro-behaviors/time/sleep/interval::sleep-60-seconds
  - id: c2-resilient-beacon
    desc: Resilient C2 beacon with error handling
    crit: hostile
    conf: 0.95
    for:
      - python
      - javascript
    needs: 2
    any:
      - id: try-except-sleep
      - id: request-exception-sleep
      - id: micro-behaviors/time/sleep/interval::sleep-continue-loop
    all:
      - id: c2-polling-beacon
  - id: c2-beacon-suite
    for: [python]
    desc: C2 beacon with sleep intervals
    crit: hostile
    conf: 0.95
    all:
      - id: c2-sleep-beacon
      - id: c2-polling-beacon
