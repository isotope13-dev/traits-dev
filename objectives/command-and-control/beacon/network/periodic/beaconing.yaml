defaults:
  crit: suspicious
  attack: T1071.001
  mbc: B0030
  for: [scripts, binaries]
  platforms:
    - unix
    - windows
traits:
  - id: c2-poll-loop
    unless:
    - id: well-known/lib/ai/unsloth::unsloth-package-context
    - id: metadata/file/profile/markup::assessment-playbook-examples
    desc: C2 polling loop pattern
    crit: suspicious
    conf: 0.8
    if:
      type: string_literal
      regex: while.{0,50}True.{0,50}requests\.(get|post)|requests\.(get|post).{0,50}while
  - id: c2-response-check-loop
    desc: C2 response check in loop
    crit: notable
    conf: 0.75
    if:
      type: string_literal
      regex: if.{0,50}response\.status_code.{0,50}while|while.{0,50}status_code
  - id: c2-continue-polling
    desc: C2 continue polling pattern
    crit: notable
    conf: 0.6
    if:
      type: string_literal
      regex: continue.{0,50}sleep|sleep.{0,50}continue
  - id: try-except-sleep
    desc: Try-except with sleep
    crit: suspicious
    conf: 0.75
    if:
      type: string_literal
      regex: try:.{0,50}sleep.{0,50}except|except.{0,50}sleep.{0,50}continue
  - id: request-exception-sleep
    desc: Request exception with sleep
    crit: suspicious
    conf: 0.8
    if:
      type: string_literal
      regex: RequestException.{0,50}sleep|sleep.{0,50}RequestException
composite_rules:
  # A beacon is network traffic on a timer; the sleep interval alone is not
  # evidence of one. The 60-second-sleep leg used to sit in the any: below,
  # which convicted ordinary wait loops — device-boot polling in Skia's
  # buildbot recipes, installers, daemons — that never touch the network.
  # Only the request/response legs carry the C2 claim; periodicity is
  # already established by the two all: legs.
  - id: c2-sleep-beacon
    for: [python]
    unless:
      - id: well-known/lib/ai/unsloth::unsloth-package-context
    desc: C2 sleep beacon pattern
    crit: suspicious
    conf: 0.85
    attack: T1029
    all:
      - id: micro-behaviors/data/control-flow/loop::python-while-true
      - id: micro-behaviors/data/control-flow/loop::sleep-near-while-loop
    any:
      - id: c2-poll-loop
      - id: c2-response-check-loop
  - id: c2-polling-beacon
    desc: C2 polling beacon
    crit: suspicious
    conf: 0.9
    needs: 2
    any:
      - id: c2-poll-loop
      - id: c2-response-check-loop
      - id: micro-behaviors/time/sleep/interval::sleep-60-seconds
  - id: c2-resilient-beacon
    desc: Resilient C2 beacon with error handling
    crit: hostile
    conf: 0.95
    for:
      - python
      - javascript
    needs: 2
    any:
      - id: try-except-sleep
      - id: request-exception-sleep
      - id: c2-continue-polling
    all:
      - id: c2-polling-beacon
  - id: c2-beacon-suite
    for: [python]
    desc: C2 beacon with sleep intervals
    crit: hostile
    conf: 0.95
    all:
      - id: c2-sleep-beacon
      - id: c2-polling-beacon
