defaults:
  crit: suspicious
  for: [scripts, binaries]
  platforms:
    - unix
    - windows
traits:
  # The request/response polling legs moved to their neutral homes; the
  # composites below reference them cross-directory and supply the C2
  # context. See micro-behaviors/communications/http/request/client and
  # micro-behaviors/communications/http/client/response-body.
  - id: try-except-sleep
    desc: Try-except with sleep text
    crit: notable
    conf: 0.75
    if:
      type: string_literal
      regex: try:.{0,50}sleep.{0,50}except|except.{0,50}sleep.{0,50}continue
  - id: request-exception-sleep
    desc: Request exception and sleep text
    crit: notable
    conf: 0.8
    if:
      type: string_literal
      regex: RequestException.{0,50}sleep|sleep.{0,50}RequestException
composite_rules:
  # These literal patterns also occur in retry helpers and quoted test code.
  # They do not establish that a loop executes or that its purpose is C2.
  - id: c2-sleep-beacon
    for: [python]
    unless:
      - id: well-known/lib/ai/unsloth::unsloth-package-context
    desc: Sleep and HTTP polling patterns in literals
    crit: notable
    conf: 0.85
    all:
      - id: micro-behaviors/data/control-flow/loop/unconditional::python-unconditional-while-header
      - id: metadata/lang/source/syntax/control-flow::sleep-near-while-loop
    any:
      - id: micro-behaviors/communications/http/lib/requests::http-polling-request-loop
      - id: micro-behaviors/communications/http/client/response-body::http-response-status-check-loop
  - id: c2-polling-beacon
    desc: HTTP polling and sleep indicators
    crit: notable
    conf: 0.9
    needs: 2
    any:
      - id: micro-behaviors/communications/http/lib/requests::http-polling-request-loop
      - id: micro-behaviors/communications/http/client/response-body::http-response-status-check-loop
      - id: micro-behaviors/time/sleep/interval::sleep-60-seconds
  - id: c2-resilient-beacon
    desc: Polling and sleep with exception text
    crit: notable
    conf: 0.95
    for:
      - python
      - javascript
    needs: 2
    any:
      - id: try-except-sleep
      - id: request-exception-sleep
      - id: micro-behaviors/time/sleep/interval::sleep-continue-loop
    all:
      - id: c2-polling-beacon
  - id: c2-beacon-suite
    for: [python]
    desc: Overlapping polling and sleep indicators
    crit: notable
    conf: 0.95
    all:
      - id: c2-sleep-beacon
      - id: c2-polling-beacon
