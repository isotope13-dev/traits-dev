defaults:
  platforms: [openwrt]
  for: [python]
  attack: T1071.001
  mbc: B0030

traits:
  - id: python-http-beacon-path
    desc: HTTP URL with beacon-like path
    crit: component
    conf: 0.88
    if:
      type: text
      regex: '(?i)https?://[^\t\n ]{0,160}/(report|heartbeat|beacon)([/?]|$)'
    unless:
      - id: well-known/tool/detection/
      - id: micro-behaviors/crypto/library/blockchain/
  - id: python-beacon-interval-name
    desc: Python beacon interval variable
    crit: notable
    conf: 0.82
    if:
      type: text
      regex: '(?i)beacon[_-]?interval'

composite_rules:
  - id: openwrt-python-http-beacon
    desc: OpenWrt Python periodic HTTP beacon
    crit: hostile
    conf: 0.96
    all:
      - id: micro-behaviors/communications/http/lib/urllib::urllib-urlopen-call
      - id: micro-behaviors/communications/http/post::python-post-method-literal
      - id: python-http-beacon-path
      - id: micro-behaviors/fs/path/config/system::openwrt-platform-context
    any:
      - id: python-beacon-interval-name
      - id: objectives/persistence/system/network-appliance::openwrt-root-crontab-path
    needs: 1
