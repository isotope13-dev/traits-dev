# A process acting as an NTP client has no legitimate reason to send NTP
# server-mode replies in a rapid, fixed-size burst. This structure catches the
# covert channel independently of the operator's domains and implant names.
defaults:
  platforms: [unix, windows]
  for: [c, cpp, go, rust, python]
  attack: T1095,T1001.003
  mbc: B0030

composite_rules:
  - id: ntp-server-reply-burst-c2
    desc: NTP-shaped C2 sends bursts of server-mode datagrams to port 123
    crit: hostile
    conf: 0.995
    near_bytes: 1200
    all:
      - id: micro-behaviors/communications/socket/udp::ntp-destination-port-literal
      - id: micro-behaviors/communications/socket/udp::ntp-datagram-buffer-size
      - id: micro-behaviors/communications/socket/udp::ntpv4-server-mode-header
      - id: micro-behaviors/communications/socket/udp::nine-datagram-send-burst
