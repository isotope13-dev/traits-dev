# setInterval's callback is the function whose body fetches a host and evals
# the next response. A nearby timer that calls a different function does not
# match. The body shape is the same one
# objectives/command-and-control/channel/deaddrop/url::js-indirected-http-response-eval
# binds; this trait adds the scheduled name.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  conf: 0.98
  attack: T1102.001,T1059.007,T1071.001
traits:
  - id: js-interval-deaddrop-eval-callback
    desc: Timer calls dead-drop response eval
    crit: suspicious
    if:
      type: tree-sitter
      query: |
        ((program
          (function_declaration
            name: (identifier) @fn
            body: (statement_block
              (lexical_declaration . (variable_declarator name: (identifier) @host value: (await_expression (call_expression function: (member_expression object: (parenthesized_expression (await_expression (call_expression function: (identifier) @fetch1 arguments: (arguments (_))))) property: (property_identifier) @text1) arguments: (arguments)))) .)
              . (lexical_declaration . (variable_declarator name: (identifier) @code value: (await_expression (call_expression function: (member_expression object: (parenthesized_expression (await_expression (call_expression function: (identifier) @fetch2 arguments: (arguments (template_string . (string_fragment) @scheme . (template_substitution (identifier) @used_host) . (string_fragment)))))) property: (property_identifier) @text2) arguments: (arguments)))) .) . (expression_statement (call_expression function: (identifier) @eval arguments: (arguments . (identifier) @executed .)))))
          (expression_statement
            (call_expression
              function: (identifier) @timer
              arguments: (arguments . (identifier) @scheduled . (_)))))
          (#eq? @fetch1 "fetch")
          (#eq? @fetch2 "fetch")
          (#eq? @text1 "text")
          (#eq? @text2 "text")
          (#eq? @host @used_host)
          (#match? @scheme "^https?://$")
          (#eq? @eval "eval")
          (#eq? @code @executed)
          (#eq? @timer "setInterval")
          (#eq? @fn @scheduled))
        ((program
          (function_declaration
            name: (identifier) @fn
            body: (statement_block
              (lexical_declaration . (variable_declarator name: (identifier) @host value: (call_expression function: (member_expression object: (call_expression function: (identifier) @await1 arguments: (arguments (await_expression (call_expression function: (identifier) @fetch1 arguments: (arguments (_)))))) property: (property_identifier) @text1) arguments: (arguments))) .)
              . (lexical_declaration . (variable_declarator name: (identifier) @code value: (call_expression function: (member_expression object: (call_expression function: (identifier) @await2 arguments: (arguments (await_expression (call_expression function: (identifier) @fetch2 arguments: (arguments (template_string . (string_fragment) @scheme . (template_substitution (identifier) @used_host) . (string_fragment))))))) property: (property_identifier) @text2) arguments: (arguments))) .) . (expression_statement (call_expression function: (identifier) @eval arguments: (arguments . (identifier) @executed .)))))
          (expression_statement
            (call_expression
              function: (identifier) @timer
              arguments: (arguments . (identifier) @scheduled . (_)))))
          (#eq? @fetch1 "fetch")
          (#eq? @fetch2 "fetch")
          (#eq? @text1 "text")
          (#eq? @text2 "text")
          (#eq? @host @used_host)
          (#match? @scheme "^https?://$")
          (#eq? @await1 "await")
          (#eq? @await2 "await")
          (#eq? @eval "eval")
          (#eq? @code @executed)
          (#eq? @timer "setInterval")
          (#eq? @fn @scheduled))
    unless:
      - id: metadata/lang/source/origin::plain-source-layer-path
composite_rules:
  - id: js-interval-deaddrop-response-eval
    desc: Interval repeats dead-drop HTTP eval
    crit: hostile
    conf: 0.98
    near_lines: 20
    all:
      - id: js-interval-deaddrop-eval-callback
      - id: objectives/command-and-control/channel/deaddrop/url::js-indirected-http-response-eval
    unless:
      - id: metadata/lang/source/origin::plain-source-layer-path
