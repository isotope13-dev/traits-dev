defaults:
  platforms: [macos, linux]
  for: [c, objc, elf]
  attack: T1071.001

traits:
  - id: api-v1-poll-sleep
    desc: HTTP API v1 poll sleep loop
    crit: suspicious
    conf: 0.9
    if:
      type: text
      regex: '/api/v1/poll[\s\S]{0,120}sleep 300'

composite_rules:
  - id: libcurl-api-c2-agent
    desc: libcurl API C2 agent
    crit: hostile
    conf: 0.97
    all:
      - id: micro-behaviors/communications/http/path/versioned::api-v1-beacon-endpoint
      - id: micro-behaviors/communications/http/path/versioned::api-v1-exfil-endpoint
      - id: micro-behaviors/communications/http/download/curl::libcurl-http
    any:
      - id: micro-behaviors/communications/http/path/versioned::api-v1-payload-endpoint
      - id: api-v1-poll-sleep
      - id: micro-behaviors/communications/http/upload::octet-stream-upload-header
