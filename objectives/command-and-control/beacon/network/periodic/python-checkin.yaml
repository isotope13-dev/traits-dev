defaults:
  platforms: [unix]
  for: [python]
  attack: T1071.001
  mbc: B0030

traits:
  - id: python-api-checkin-path
    desc: Python API checkin path
    crit: suspicious
    conf: 0.9
    ref: "sha256:f1f60b5798395491f3f3773dc6690460f2ca20f564161746f28e22439ced5438"
    if:
      type: text
      regex: 'https?://[^"''\s]{1,200}/api/checkin\b|["'']/api/checkin["'']'
    unless:
      # A server defining the route is the other side of a beacon: FastAPI /
      # Flask `@app.post("/api/checkin")` declares the endpoint this trait
      # would otherwise read as a phone-home path (e.g. a local check-in
      # manager serving its own `/api/checkin` to its web UI).
      - type: text
        regex: '@\w+\.(get|post|put|delete)\(\s*["'']/api/checkin'

composite_rules:
  - id: python-periodic-checkin-loop
    desc: Python periodic checkin loop
    crit: suspicious
    conf: 0.93
    ref: "sha256:f1f60b5798395491f3f3773dc6690460f2ca20f564161746f28e22439ced5438"
    all:
      - id: micro-behaviors/data/control-flow/loop::python-unconditional-while-header
      - id: micro-behaviors/time/sleep/interval::python-sleep-call
      - id: python-api-checkin-path

  - id: python-periodic-http-checkin
    desc: Python periodic HTTP checkin
    crit: hostile
    conf: 0.98
    ref: "sha256:f1f60b5798395491f3f3773dc6690460f2ca20f564161746f28e22439ced5438"
    all:
      - id: python-periodic-checkin-loop
      - id: micro-behaviors/communications/http/client/exchange::urllib-urlopen-call
      - id: micro-behaviors/communications/http/post::script-post-method-literal
