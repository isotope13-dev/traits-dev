# A victim-registration beacon: the machine's own name sent to a hardcoded
# raw IP address.
#
# Legitimate telemetry reaches a *domain* the vendor controls, because an IP
# cannot be moved, renewed or served over a trusted certificate. Code that
# hardcodes an address and posts `gethostname()` to it is not measuring usage;
# it is telling an operator which sites are now running the payload. The June
# 2024 WordPress.org source compromise shipped this alone in its first
# poisoned revision -- fired from `upgrader_process_complete`, so every site
# that took the update announced itself -- before later revisions added the
# form grabber and the config-credential theft.
defaults:
  platforms: [windows, unix]
  for: [php]
  attack: T1071.001
  mbc: B0030

composite_rules:
  - id: hostname-beacon-to-hardcoded-ip
    desc: Sends host name to a hardcoded IP
    crit: hostile
    conf: 0.94
    scope: file
    all:
      - id: micro-behaviors/os/sysinfo/hostname::php-gethostname-call
      - id: micro-behaviors/communications/ip/direct::external-ipv4-http-endpoint
    any:
      - id: micro-behaviors/communications/http/request/wordpress::wp-remote-http-request
      - id: micro-behaviors/communications/http/curl::php-curl-request
      - id: micro-behaviors/communications/http/client/file-read::file-get-contents-url
    unless:
      - id: metadata/package/testing/harness/unit/
      - id: metadata/package/testing/presence/harness/
