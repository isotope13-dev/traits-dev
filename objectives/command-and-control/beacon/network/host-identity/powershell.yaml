# Periodic TCP telemetry is suspicious but also occurs in monitoring agents.
# Require independent transport, identity, output, repetition and pacing roles.
# No claim of data flow or remote command execution is made.
defaults:
  for: [powershell]
  platforms: [windows]
composite_rules:
  - id: powershell-periodic-tcp-host-checkin
    desc: PowerShell TCP check-in with host identity and periodic loop
    crit: suspicious
    conf: 0.93
    attack: T1095,T1082
    near_lines: 20
    all:
      - id: micro-behaviors/communications/socket/dial::powershell-tcpclient-endpoint-constructor-text
      - id: micro-behaviors/communications/socket/tcp::powershell-tcpclient-stream
      - id: micro-behaviors/os/env/system-info::computer-user-environment-references
      - id: micro-behaviors/data/stream/write::powershell-stream-writes-byte-buffer
      - id: micro-behaviors/data/control-flow/loop/unconditional::embedded-powershell-while-true
      - id: micro-behaviors/time/sleep/interval::ps-start-sleep

  - id: powershell-persistent-checkin-defender-exclusion
    desc: Periodic TCP host check-in with persistence and Defender exclusion
    crit: hostile
    conf: 0.97
    attack: T1095,T1562.001,T1053.005
    all:
      - id: objectives/command-and-control/beacon/network/host-identity::powershell-periodic-tcp-host-checkin
      - id: objectives/evasion/anti-av/exclusion::defender-windows-temp-exclusion
      - id: micro-behaviors/os/autorun/control::task-create-user-directory-action-text
