# Batch script beacons host identity (computer name and user name)
# to a remote endpoint via curl.
defaults:
  platforms: [windows]
  for: [batch]
  attack: T1071.001,T1033
  mbc: B0030

composite_rules:
  - id: batch-curl-host-identity-beacon
    desc: Batch curls host identity to remote endpoint
    crit: hostile
    conf: 0.95
    scope: file
    all:
      - id: micro-behaviors/communications/http/curl/command::batch-curl-call
      - id: micro-behaviors/communications/http/curl/command::batch-curl-http-url
      - id: micro-behaviors/os/env/system-info::computer-user-environment-references
