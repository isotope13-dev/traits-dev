# Node twin of the PHP host-identity beacon: the script reads hostname and
# username, GETs them to a hardcoded IP endpoint, and also resolves a
# hostname-embedded DNS label at an OOB host. Either channel alone has
# legitimate shapes (status checks, dynamic DNS); the triple -- direct-IP
# HTTP plus OOB identity plus DNS exfiltration in one file -- is an
# install-time tracker, not plumbing.
#
# Worked example: @flexmr/ui beacon.js, run on preinstall, install, and
# postinstall, which sends token, package, event, host, user, cwd,
# platform, and node version to http://177.7.60.239:48080 and resolves
# flexmr-<hostname>.oob.recon.dev.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  attack: T1071.001,T1041
  mbc: B0030
composite_rules:
  - id: node-host-identity-dual-channel-beacon
    desc: Node script beacons host identity over HTTP and DNS
    crit: hostile
    conf: 0.98
    scope: file
    all:
      - id: micro-behaviors/communications/ip/literal::direct-ip-http-client
      - id: micro-behaviors/os/sysinfo/profile::node-oast-identity-query-cooccurrence
      - id: micro-behaviors/communications/dns/resolver::node-dns-lookup-with-oob-host-text
    unless:
      - id: metadata/package/testing/harness/runtime/
