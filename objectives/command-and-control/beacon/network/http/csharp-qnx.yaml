defaults:
  platforms: [qnx, unix, windows]
  for: [csharp, pe]
  attack: T1071.001

traits:
  - id: qnx-dotnet-nto-user-agent
    desc: QNX .NET NTO user agent
    crit: notable
    conf: 0.94
    if:
      type: text
      substr: "Mozilla/5.0 (compatible; NTO/7.1)"

composite_rules:
  - id: qnx-dotnet-telemetry-beacon
    desc: QNX .NET telemetry beacon
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/communications/http/header/custom::x-session-id-name
      - id: qnx-dotnet-nto-user-agent
      - id: micro-behaviors/communications/http/url/api-path/telemetry::api-v1-telemetry-path
