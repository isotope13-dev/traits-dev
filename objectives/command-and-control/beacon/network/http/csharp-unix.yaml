defaults:
  platforms: [unix, appliance, windows]
  for: [csharp]
  attack: T1071.001

traits:
  - id: dotnet-webclient-post-beacon
    desc: .NET WebClient POST beacon
    crit: suspicious
    conf: 0.92
    if:
      type: text
      substr: 'client.UploadData(url, "POST", data)'

composite_rules:
  - id: dotnet-runtime-profile-http-beacon
    desc: .NET runtime profile HTTP beacon
    crit: hostile
    conf: 0.98
    all:
      - id: dotnet-webclient-post-beacon
      - id: micro-behaviors/os/sysinfo/platform/runtime::dotnet-machine-name-os-description
    unless:
      - id: well-known/app/ai/agent-runtime/dotcraft/
