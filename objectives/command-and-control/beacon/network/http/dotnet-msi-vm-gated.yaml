defaults:
  platforms: [windows]
  for: [pe]
  attack: T1041,T1059
  mbc: B0030

composite_rules:
  - id: dotnet-custom-action-vm-gated-network-beacon
    desc: Managed MSI action fingerprints VMs before HTTP beaconing
    crit: hostile
    conf: 0.99
    all:
      - id: metadata/binary/installer/embedded-payloads::dotnet-managed-custom-action-assembly
      - id: objectives/anti-analysis/vm-detect/wmi::wmi-vm-display-fingerprint
      - id: micro-behaviors/communications/http/client/managed::httpwebrequest
      - id: micro-behaviors/communications/http/client/managed::getresponse
      - id: micro-behaviors/communications/http/post::post-string-pe
    unless:
      - id: metadata/signed/platform/
