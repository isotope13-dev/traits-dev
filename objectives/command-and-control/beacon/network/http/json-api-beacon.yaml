# Plaintext HTTP bot protocol: POST host/user/pid JSON to /api/beacon and
# report command output to /api/result/. Scoped to scripted implants so the
# /api/beacon atom does not collide with the native WinHTTP and Ruby detectors.
defaults:
  platforms: [windows]
  for: [python]
  attack: T1071.001
  mbc: B0030

traits:
  - id: script-api-beacon-path
    desc: Scripted HTTP /api/beacon C2 path
    crit: suspicious
    conf: 0.93
    if:
      type: text
      substr: /api/beacon

  - id: script-api-result-path
    desc: Scripted HTTP /api/result C2 path
    crit: suspicious
    conf: 0.93
    if:
      type: text
      regex: '(?i)/api/result/'

  - id: json-id-user-host-pid-beacon
    desc: JSON beacon with id user host pid
    crit: suspicious
    conf: 0.94
    if:
      type: text
      regex: '(?i)["'']id["'']\s*:.{0,80}["'']user["'']\s*:.{0,80}["'']host["'']\s*:.{0,80}["'']pid["'']'

  - id: c2-out-staging-file
    desc: c2_out.txt command-output staging file
    crit: suspicious
    conf: 0.95
    if:
      type: text
      substr: c2_out.txt

composite_rules:
  - id: http-api-beacon-result-channel
    desc: HTTP /api/beacon and /api/result C2 channel
    crit: hostile
    conf: 0.98
    all:
      - id: script-api-beacon-path
      - id: script-api-result-path
    near_bytes: 4096

  - id: http-json-host-beacon-loop
    desc: JSON host identity posted to /api/beacon
    crit: hostile
    conf: 0.97
    all:
      - id: script-api-beacon-path
      - id: json-id-user-host-pid-beacon
    near_bytes: 2048

  - id: http-beacon-shell-via-c2-out
    desc: Beacon channel stages shell output in c2_out.txt
    crit: hostile
    conf: 0.99
    attack: T1071.001,T1059.003
    all:
      - id: http-api-beacon-result-channel
      - id: c2-out-staging-file
      - id: micro-behaviors/process/create/exec::cmd-exe-reference
    near_bytes: 8192
