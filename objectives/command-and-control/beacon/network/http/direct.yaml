defaults:
  attack: T1071.001
  mbc: B0030
  platforms:
    - unix
    - windows
traits:
  - id: libksba-ocsp-marker
    desc: libksba OCSP validation marker
    crit: notable
    conf: 0.94
    for: [binaries]
    if:
      type: text
      substr: ksba_ocsp_
    unless:
      - id: well-known/tool/sysadmin/gnupg/

composite_rules:
  - id: php-hardcoded-ip-host-identity-beacon
    desc: Server-side script sends host identity to a hardcoded HTTP endpoint
    crit: hostile
    conf: 0.98
    attack: T1071.001,T1041
    all:
      - id: micro-behaviors/communications/ip/literal::direct-ip-http-client
      - id: objectives/command-and-control/beacon/network/host-identity::hostname-beacon-to-hardcoded-ip
    unless:
      - id: objectives/discovery/cloud/metadata/

  - id: direct-http-c2
    desc: Direct HTTP C2 infrastructure
    crit: suspicious
    conf: 0.95
    scope: file
    size_max: 1500000
    all:
      - id: micro-behaviors/communications/ip/literal::direct-ip-http-client
    any:
      - id: objectives/command-and-control/backdoor/dispatch/
      - id: objectives/command-and-control/backdoor/proxy/
      - id: objectives/command-and-control/backdoor/tasking/
      - id: objectives/command-and-control/backdoor/webshell/
      - id: objectives/command-and-control/beacon/network/periodic/
      - id: objectives/command-and-control/botnet/
      - id: objectives/command-and-control/remote-command/
      - id: objectives/command-and-control/reverse-shell/
    downgrade:
      any:
        - id: metadata/binary/resource::kernel-driver-init
        - id: metadata/binary/resource::kernel-driver-idata
        - id: metadata/package/versioning::pe-version-resource
        - id: metadata/binary/resource/
        - id: metadata/package/testing/presence/platform_suites::autoconf-testsuite
        - id: metadata/package/testing/presence/platform_suites::gnu-coreutils-test
        - id: metadata/library/structure/
    unless:
      - id: objectives/discovery/network/scan/http::public-http-endpoint-swarm
  - id: direct-http-c2-binary-ip
    desc: Binary direct-IP HTTP evidence
    crit: suspicious
    conf: 0.9
    size_max: 1500000
    all:
      - id: micro-behaviors/communications/ip/literal::external-ipv4-binary
    any:
      - id: micro-behaviors/communications/http/request/
      - id: micro-behaviors/communications/http/headers::dense-request-header-set
      - id: micro-behaviors/communications/http/message::http-url-literal
    unless:
      - id: objectives/discovery/cloud/metadata/
      - id: metadata/package/testing/presence/harness::python-test-file
      - id: metadata/package/testing/presence/harness/
      - id: micro-behaviors/crypto/library/blockchain/
      - id: micro-behaviors/communications/ip/literal/
      # libksba X.509 OCSP/CRL validation context (e.g. GnuPG dirmngr):
      # the hardcoded IPv4 values are DNS root-server addresses and the
      # http:// literals are keyserver/CRL URLs, not C2 infrastructure.
      - id: libksba-ocsp-marker
  - id: direct-http-c2-dropper
    desc: Direct IP HTTP C2 with staged dropper
    crit: hostile
    conf: 0.96
    size_max: 5242880
    all:
      - id: direct-http-c2-binary-ip
      - id: objectives/command-and-control/dropper/download::winhttp-temp-dropper
      - id: objectives/evasion/security-bypass/policy/execution::bypass-execution-policy
    any:
      - id: micro-behaviors/communications/http/headers::auth-header
      - id: micro-behaviors/communications/http/post::post-string-pe
      - id: metadata/build/manifest::pe-requires-admin
      - id: objectives/anti-analysis/emulator-detect/vendor-strings::comprehensive
