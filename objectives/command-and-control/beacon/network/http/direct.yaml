defaults:
  attack: T1071.001
  mbc: B0030
  platforms:
  - unix
  - windows
traits:
- id: libksba-ocsp-marker
  desc: libksba OCSP validation marker
  crit: notable
  conf: 0.94
  for:
  - binaries
  if:
    type: text
    substr: ksba_ocsp_
  unless:
  - id: well-known/tool/sysadmin/gnupg/
composite_rules:
- id: php-hardcoded-ip-host-identity-beacon
  desc: Server-side script sends host identity to a hardcoded HTTP endpoint
  crit: hostile
  conf: 0.98
  attack: T1071.001,T1041
  all:
  - id: micro-behaviors/communications/ip/literal::direct-ip-http-client
  - id: objectives/command-and-control/beacon/network/host-identity::hostname-beacon-to-hardcoded-ip
  unless:
  - id: objectives/discovery/cloud/metadata
  - id: micro-behaviors/communications/http/services/aws::native-imds-endpoint-reference
  - id: micro-behaviors/communications/http/services/gcp::native-metadata-host-and-flavor-header
- id: direct-http-c2-binary-ip
  desc: Binary direct-IP HTTP evidence
  crit: suspicious
  conf: 0.9
  size_max: 1500000
  all:
  - id: micro-behaviors/communications/ip/literal::external-ipv4-binary
  any:
  - id: micro-behaviors/communications/http/request
  - id: micro-behaviors/communications/http/client/response-body::response-stream-python
  - id: micro-behaviors/communications/http/header/custom::request-header-token-density
  - id: micro-behaviors/communications/http/url/scheme::http-url-literal
  unless:
  - id: micro-behaviors/communications/http/services/cloud::cloud-metadata-endpoint-reference
  - id: metadata/path::test-directory-component
  - id: metadata/package/testing/presence/harness::binary-test-directory
  - id: micro-behaviors/communications/ip/literal::geoip-range-table-context
  - id: libksba-ocsp-marker
- id: direct-http-c2-dropper
  desc: Direct IP HTTP C2 with staged dropper
  crit: hostile
  conf: 0.96
  size_max: 5242880
  all:
  - id: direct-http-c2-binary-ip
  - id: micro-behaviors/communications/http/client/winhttp::winhttp-temp-write-api-cluster
  - id: objectives/evasion/security-bypass/policy/execution::bypass-execution-policy
  any:
  - id: micro-behaviors/communications/http/authorization-header::auth-header
  - id: micro-behaviors/communications/http/post::native-post-method-token
  - id: metadata/build/manifest::pe-requires-admin
  - id: micro-behaviors/os/virtualization/hypervisor::vm-vendor-hardware-references
