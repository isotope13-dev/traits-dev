# Zig HTTP check-in that POSTs /beacon and GETs /commands, or POSTs /collect.
# The path tokens are the protocol; keep them independent of C2_HOST so a
# renamed constant still matches.
defaults:
  platforms: [unix]
  for: [zig]
  attack: T1071.001
  crit: suspicious
  conf: 0.94

traits:
  - id: zig-http-commands-get
    desc: Zig HTTP GET commands
    if:
      type: text
      substr: 'GET /commands HTTP/1.1'
  - id: zig-http-collect-post
    desc: Zig HTTP POST collect
    if:
      type: text
      substr: 'POST /collect HTTP/1.1'

composite_rules:
  - id: zig-http-beacon-command-channel
    desc: Zig HTTP beacon and command poll
    crit: hostile
    conf: 0.97
    all:
      - id: objectives/exfiltration/stealer/system-info::native-netscaler-http-beacon
      - id: zig-http-commands-get
  - id: zig-http-collect-exfil
    desc: Zig HTTP POST collect exfil
    crit: hostile
    conf: 0.96
    all:
      - id: zig-http-collect-post
      - id: micro-behaviors/communications/http/upload::octet-stream-upload-header
