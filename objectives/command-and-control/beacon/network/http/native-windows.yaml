defaults:
  platforms: [windows]
  for: [c, cpp, pe, dll]
  attack: T1071.001

traits:
  - id: explicit-native-c2-session-status
    desc: Native C2 session status
    crit: suspicious
    conf: 0.98
    if:
      type: text
      regex: '(?i)\b(Connected to C(&C|NC) server|Connection closed by CNC server)\b'

  - id: bot-protocol-registration-status
    desc: Bot protocol registration failure
    crit: suspicious
    conf: 0.98
    if:
      type: text
      regex: '(?i)Failed to send (protocol magic header|bot version info)\b'

  - id: winhttp-json-beacon-path
    desc: WinHTTP JSON beacon path
    crit: suspicious
    conf: 0.92
    if:
      type: text
      substr: /api/beacon

  - id: json-host-user-pid-beacon
    desc: JSON host user PID beacon
    crit: suspicious
    conf: 0.9
    if:
      type: text
      regex: 'type\\":\\"beacon[\s\S]{0,220}host\\":\\"%s[\s\S]{0,120}user\\":\\"%s'

composite_rules:
  - id: native-bot-c2-session
    desc: Native bot maintains an explicit command-and-control session
    crit: hostile
    conf: 0.995
    mbc: B0030
    all:
      - id: explicit-native-c2-session-status
      - id: bot-protocol-registration-status
      - id: micro-behaviors/communications/socket/init::winsock-client-lifecycle
    any:
      - id: micro-behaviors/communications/url/host::dynamic-dns-hostname
      - id: micro-behaviors/communications/http/post::form-urlencoded-post-template

  - id: winhttp-json-beacon
    desc: WinHTTP JSON beacon
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/communications/http/client/winhttp::winhttp-send-request
      - id: micro-behaviors/communications/http/client/winhttp::winhttp-receive-response
      - id: winhttp-json-beacon-path
      - id: json-host-user-pid-beacon
