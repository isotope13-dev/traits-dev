defaults:
  platforms: [windows]
  for: [c, cpp, pe, dll]
  attack: T1071.001

traits:
  - id: explicit-native-c2-session-status
    desc: Native C2 session status
    crit: suspicious
    conf: 0.98
    if:
      type: text
      regex: '(?i)\b(Connected to C(&C|NC) server|Connection closed by CNC server)\b'

  - id: bot-protocol-registration-status
    desc: Bot protocol registration failure
    crit: suspicious
    conf: 0.98
    if:
      type: text
      regex: '(?i)Failed to send (protocol magic header|bot version info)\b'

  - id: json-host-user-pid-beacon
    desc: JSON host user PID beacon
    crit: suspicious
    conf: 0.9
    if:
      type: text
      regex: 'type\\":\\"beacon[\s\S]{0,220}host\\":\\"%s[\s\S]{0,120}user\\":\\"%s'

  # Native implants often embed plaintext JSON templates:
  # {"type":"beacon","computer":"%s","user":"%s",...}
  - id: json-type-beacon-computer-user
    desc: JSON type=beacon computer/user check-in template
    crit: suspicious
    conf: 0.94
    if:
      type: text
      regex: '\{"type"\s*:\s*"beacon"\s*,\s*"computer"\s*:\s*"%s"'

composite_rules:
  - id: native-bot-c2-session
    desc: Native bot maintains an explicit command-and-control session
    crit: hostile
    conf: 0.995
    mbc: B0030
    all:
      - id: explicit-native-c2-session-status
      - id: bot-protocol-registration-status
      - id: micro-behaviors/communications/socket/init::winsock-client-lifecycle
    any:
      - id: micro-behaviors/communications/url/host::dynamic-dns-hostname
      - id: micro-behaviors/communications/http/post::form-urlencoded-post-template

  - id: winhttp-json-beacon
    desc: WinHTTP JSON beacon
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/communications/http/client/winhttp::winhttp-send-request
      - id: micro-behaviors/communications/http/client/winhttp::winhttp-receive-response
      - id: micro-behaviors/communications/http/url/path::api-beacon-path
      - id: json-host-user-pid-beacon

  # Runtime-resolved WinHTTP plus a structured type=beacon JSON template and
  # remote-process injection APIs — typical of compact native RATs.
  - id: winhttp-runtime-json-beacon-injector
    desc: WinHTTP runtime JSON beacon with process injection APIs
    crit: hostile
    conf: 0.98
    attack: T1071.001,T1055
    mbc: B0030,B0033
    all:
      - id: json-type-beacon-computer-user
      - id: micro-behaviors/communications/http/client/winhttp::winhttp-runtime-api-table
      - id: objectives/evasion/process/injection/memory::process-inject-api
      - id: metadata/binary/layout::pe-no-signature-record
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/installer/family/
      - id: well-known/tool/sysadmin/
