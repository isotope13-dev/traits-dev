defaults:
  platforms: [windows]
  for: [pe, dll]
  attack: T1071.001
  mbc: C0002

composite_rules:
  - id: wininet-host-profile-client-report
    desc: WinInet client reports host work status
    crit: suspicious
    conf: 0.99
    all:
      - id: micro-behaviors/communications/http/request/report::client-report-query-template
      - id: micro-behaviors/communications/http/request/report::host-profile-form-template
    any:
      - id: micro-behaviors/communications/http/get::http-open-request
      - id: micro-behaviors/communications/http/get::http-send-request
      - id: micro-behaviors/communications/http/get::internet-connect
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/installer/family/
