defaults:
  platforms: [windows]
  for: [pe, dll]
  attack: T1071.001
  mbc: C0002

composite_rules:
  - id: wininet-host-profile-client-report
    desc: WinInet client reports host work status
    crit: suspicious
    conf: 0.99
    all:
      - id: micro-behaviors/communications/http/request/report::client-report-query-template
      - id: micro-behaviors/communications/http/request/report::host-profile-form-template
    any:
      - id: micro-behaviors/communications/http/get::http-open-request
      - id: micro-behaviors/communications/http/get::http-send-request
      - id: micro-behaviors/communications/http/get::internet-connect
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/installer/family/

  # A carrier that both phones home with this bot-status protocol and ships a
  # full CreateRemoteThread/VirtualAllocEx/OpenProcess API set around an
  # embedded PE resource is staging a second-stage injection, not just
  # reporting telemetry - the two legs together are the loader-and-inject
  # pattern used by Amadey/SmokeLoader-style downloaders.
  - id: host-profile-report-with-embedded-injector
    desc: Host-status C2 report paired with embedded-payload injector
    crit: hostile
    conf: 0.97
    attack: "T1071.001,T1055"
    mbc: "C0002,B0033"
    all:
      - id: wininet-host-profile-client-report
      - id: objectives/evasion/process/injection/memory::resource-backed-remote-thread-injector
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/installer/family/
      - id: well-known/tool/reverse-engineering/
