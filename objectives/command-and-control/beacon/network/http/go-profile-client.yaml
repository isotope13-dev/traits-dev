# The profile names alone are dual-use. Requiring host inventory, an HTTP
# client request, and child-process execution identifies a functioning agent.
defaults:
  platforms: [windows]
  for: [pe]

composite_rules:
  - id: go-profiled-c2-inventory-client
    desc: Go C2 profile client collects host inventory and runs subprocesses
    crit: hostile
    conf: 0.99
    attack: T1071.001,T1082,T1057
    all:
      - id: metadata/binary/symbols/name/token::go-traffic-profile-routine-names
      - id: metadata/binary/symbols/name/qualified::go-inventory-routine-names
      - id: micro-behaviors/communications/http/client/library::go-http-client-do-string
      - id: micro-behaviors/process/create/spawn::go-pe-os-exec-command-call
