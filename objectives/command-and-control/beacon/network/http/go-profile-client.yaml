# The profile names alone are dual-use. Requiring host inventory, an HTTP
# client request, and child-process execution identifies a functioning agent.
defaults:
  platforms: [windows]
  for: [pe]

composite_rules:
  - id: go-profiled-c2-inventory-client
    desc: Go C2 profile client collects host inventory and runs subprocesses
    crit: hostile
    conf: 0.99
    attack: T1071.001,T1082,T1057
    all:
      - id: metadata/lang/source/naming/function/communication::go-traffic-profile-routine-names
      - id: objectives/collection/multi-source::go-inventory-routine-names
      - id: micro-behaviors/communications/http/client/library::go-http-client-do-string
      - id: micro-behaviors/process/create/subprocess/configure::go-pe-os-exec-command-call

  # A related Go agent may use a custom profile and stage a mapped payload
  # instead of exposing the standard os/exec call shape above.
  - id: go-inventory-http-staging-agent
    desc: Go agent reports inventory over HTTP with staged payload execution
    crit: hostile
    conf: 0.98
    attack: T1071.001,T1082,T1105
    all:
      - id: metadata/lang/source/naming/function/communication::go-traffic-profile-routine-names
      - id: objectives/collection/multi-source::go-inventory-routine-names
      - id: micro-behaviors/communications/http/client/library::go-http-client-do-string
      - id: micro-behaviors/communications/url/host/oob-http::url-external-ip-port-binary
      - id: objectives/execution/staging/runtime::module-map-write-process-profile
