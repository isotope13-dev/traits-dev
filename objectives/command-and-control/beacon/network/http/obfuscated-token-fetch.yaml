# A string-array-rotated (obfuscator.io) stub that issues an XHR whose URL
# ends in a fresh random token for every page view: the per-visit check-in
# of a site-injection loader asking its server whether to serve a payload.
defaults:
  platforms: [windows, unix]
  for: [javascript]
composite_rules:
  - id: rotated-string-array-random-token-fetch
    desc: Obfuscated stub fetches with per-visit random token
    crit: hostile
    conf: 0.95
    attack: T1027,T1071.001
    near_bytes: 4000
    all:
      - id: micro-behaviors/data/collection/array::string-array-rotation
      - id: micro-behaviors/communications/http/request/params::httpclient-token-request
      - id: objectives/anti-static/obfuscation/obfuscator/js-obfuscator::hex-mangled-parseint-loop-assignment
