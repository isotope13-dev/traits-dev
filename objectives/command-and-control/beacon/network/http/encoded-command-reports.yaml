# Reverse analysis: the progressive decoder supplies endpoint hostnames;
# command reports are compressed, feedback-XOR encoded and rotated before
# delivery. No campaign domain, signing identity, or viewer name is required.
defaults:
  for: [pe]
  platforms: [windows]
  arch: [x86-64]
  attack: T1071.001,T1027
  conf: 0.97

composite_rules:
  - id: concealed-endpoint-encoded-command-reports
    desc: Concealed endpoints and encoded command reports
    crit: hostile
    all:
      - id: micro-behaviors/data/codec::x64-progressive-add-byte-decoder
      - id: micro-behaviors/data/codec::x64-feedback-xor-rotate-buffer
      - id: micro-behaviors/data/format/json::compiled-command-result-fields
      - id: micro-behaviors/data/format/json::compiled-output-truncation-fields
