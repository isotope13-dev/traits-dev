defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  attack: T1071.001
  mbc: B0030

composite_rules:
  - id: browser-page-context-direct-ip-beacon
    desc: Sends current page hostname and path to a raw IP address
    crit: hostile
    conf: 0.99
    # The page-context reads must feed the same request as the raw-IP URL.
    # Without proximity, any large bundle containing a router, an XHR client,
    # and an example IP placeholder (e.g. a monitoring UI's server-URL field)
    # pools into a beacon verdict across hundreds of kilobytes.
    near_bytes: 2048
    all:
      - id: micro-behaviors/communications/ip/literal::javascript-external-ipv4-url
      - id: micro-behaviors/communications/http/request/client::xmlhttprequest-new
      - id: micro-behaviors/communications/http/url/navigation::browser-location-host-read
      - id: micro-behaviors/communications/http/url/navigation::browser-location-path-read
  # The request carries no payload handling at all: the response callback is
  # an empty function and failures are caught and discarded, so the call can
  # neither succeed usefully nor fail visibly. That is a heartbeat, not a
  # fetch. The required empty-response leg is what separates this from an
  # ordinary GET whose caller reads the body. A `r => r.resume()` drain
  # counts as empty: it flushes the body without reading a byte.
  - id: fire-and-forget-https-beacon
    desc: HTTPS beacon discards response and errors
    crit: hostile
    conf: 0.97
    all:
      - id: micro-behaviors/communications/http/get::node-https-get-reference
      - id: micro-behaviors/data/control-flow/error-handling::empty-catch-block
    any:
      - id: micro-behaviors/communications/http/get::node-http-get-empty-arrow-callback
      - id: micro-behaviors/communications/http/get::node-http-get-empty-function-callback
      - id: micro-behaviors/communications/http/get::node-http-get-resume-drain-callback
      - id: micro-behaviors/communications/http/get::node-http-get-resume-drain-function
    needs: 1
    unless:
      - id: metadata/package/testing/harness/runtime/
