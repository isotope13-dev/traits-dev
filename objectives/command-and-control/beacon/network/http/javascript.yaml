defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  attack: T1071.001
  mbc: B0030

composite_rules:
  - id: browser-page-context-direct-ip-beacon
    desc: Sends current page hostname and path to a raw IP address
    crit: hostile
    conf: 0.99
    all:
      - id: micro-behaviors/communications/ip/literal::javascript-external-ipv4-url
      - id: micro-behaviors/communications/http/request/client::xmlhttprequest-new
      - id: micro-behaviors/communications/http/url/path::browser-location-host-read
      - id: micro-behaviors/communications/http/url/path::browser-location-path-read
