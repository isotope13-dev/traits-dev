defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  attack: T1071.001
  mbc: B0030

composite_rules:
  - id: browser-page-context-direct-ip-beacon
    desc: Sends current page hostname and path to a raw IP address
    crit: hostile
    conf: 0.99
    # The page-context reads must feed the same request as the raw-IP URL.
    # Without proximity, any large bundle containing a router, an XHR client,
    # and an example IP placeholder (e.g. a monitoring UI's server-URL field)
    # pools into a beacon verdict across hundreds of kilobytes.
    near_bytes: 2048
    all:
      - id: micro-behaviors/communications/ip/literal::javascript-external-ipv4-url
      - id: micro-behaviors/communications/http/request/client::xmlhttprequest-new
      - id: micro-behaviors/communications/http/url/navigation::browser-location-host-read
      - id: micro-behaviors/communications/http/url/navigation::browser-location-path-read

  - id: node-fire-and-forget-campaign-https-beacon
    desc: Module sends fire-and-forget GET to campaign callback
    crit: hostile
    conf: 0.99
    near_bytes: 2048
    all:
      - id: micro-behaviors/communications/http/get::https-empty-response-empty-catch-context
      - id: micro-behaviors/communications/http/get::module-level-https-get-call
      - id: micro-behaviors/communications/http/url/domain::accenture-npm-azure-callback-reference

  - id: extension-broad-permission-install-beacon
    desc: Broad-permission extension sends install beacon
    crit: hostile
    conf: 0.98
    for: [javascript, typescript, xpi, chrome-manifest]
    scope: archive
    attack: T1071.001,T1176
    all:
      - id: metadata/permission/host::permission-all-urls
      - id: micro-behaviors/browser-extension/lifecycle::chrome-runtime-on-installed
      - id: micro-behaviors/communications/http/request/client::js-fetch-call
      - id: micro-behaviors/communications/http/url/domain::js-remote-host-url
