defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  attack: T1071.001
  mbc: B0030

composite_rules:
  - id: browser-page-context-direct-ip-beacon
    desc: Sends current page hostname and path to a raw IP address
    crit: hostile
    conf: 0.99
    # The page-context reads must feed the same request as the raw-IP URL.
    # Without proximity, any large bundle containing a router, an XHR client,
    # and an example IP placeholder (e.g. a monitoring UI's server-URL field)
    # pools into a beacon verdict across hundreds of kilobytes.
    near_bytes: 2048
    all:
      - id: micro-behaviors/communications/ip/ipv4::javascript-external-ipv4-url
      - id: micro-behaviors/communications/http/request/client::xmlhttprequest-new
      - id: micro-behaviors/communications/url/navigation-http::browser-location-host-read
      - id: micro-behaviors/communications/url/navigation-http::browser-location-path-read

  - id: node-fire-and-forget-campaign-https-beacon
    desc: Module sends fire-and-forget GET to campaign callback
    crit: hostile
    conf: 0.99
    near_bytes: 2048
    all:
      - id: micro-behaviors/communications/http/get::https-empty-response-empty-catch-context
      - id: micro-behaviors/communications/http/get::module-level-https-get-call
      - id: micro-behaviors/communications/url/host/domain-http::accenture-npm-azure-callback-reference

  - id: node-encoded-sysinfo-beacon-to-hardcoded-ip
    desc: Beacons encoded system info to a hardcoded-IP HTTP endpoint
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/communications/ip/literal::javascript-external-http-ip-url
      - id: micro-behaviors/communications/http/request/client::http-client-usage
      - id: micro-behaviors/os/sysinfo/hostname/reference::os-hostname-member-reference
    any:
      - id: micro-behaviors/communications/url/construction/query::urlsearchparams-base64-append
      - id: micro-behaviors/communications/url/construction/query::encoded-dynamic-url-query-value
    unless:
      - id: objectives/discovery/cloud/metadata
      - id: micro-behaviors/communications/http/services/aws::native-imds-endpoint-reference
      - id: micro-behaviors/communications/http/services/gcp::native-metadata-host-and-flavor-header
      - id: metadata/path/directory::test-directory-component
