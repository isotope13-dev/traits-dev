defaults:
  platforms: [windows, unix, appliance]
  for: [lua]
  attack: T1071.001

traits:
  - id: lua-host-findings-beacon-call
    desc: Lua sends host findings to beacon endpoint
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: 'send_to_c2\s*\(\s*["'']/beacon["'']\s*,\s*payload\s*\)'

  - id: lua-webclient-http-method
    desc: WebClient download/upload to C2
    crit: suspicious
    conf: 0.92
    if:
      type: literal
      regex: 'WebClient[\s\S]{0,180}(DownloadString|UploadString|UploadData)'

composite_rules:
  - id: lua-host-findings-http-beacon
    desc: Lua reports host findings over socket HTTP
    crit: hostile
    conf: 0.98
    all:
      - id: lua-host-findings-beacon-call
      - id: micro-behaviors/os/sysinfo/hostname/query::lua-host-info-hostname-field
      - id: micro-behaviors/communications/socket/connect/attempt::lua-tcp-connect
      - id: micro-behaviors/communications/http/post::post-request-line
      - id: micro-behaviors/communications/socket/send/message::lua-socket-send

  - id: lua-socket-http-beacon
    desc: Lua socket HTTP beacon
    crit: hostile
    conf: 0.97
    all:
      - id: micro-behaviors/communications/url/resource-path/collection::beacon-path-token
      - id: micro-behaviors/os/sysinfo/hostname/query::lua-hostname-data-reference
      - id: micro-behaviors/communications/socket/connect/attempt::lua-tcp-connect
      - id: micro-behaviors/communications/socket/send/message::lua-socket-send

  - id: lua-webclient-http-beacon
    desc: Lua WebClient HTTP beacon
    crit: suspicious
    conf: 0.97
    all:
      - id: micro-behaviors/communications/url/resource-path/collection::beacon-path-token
      - id: lua-webclient-http-method
    any:
      - id: metadata/lang/source/naming/function/system::lua-os-execute-symbol
      - id: micro-behaviors/process/create/shell/interpreter::lua-io-popen
