# A Python beacon whose destination is a hardcoded public IP and whose
# User-Agent apologizes in advance for the request.
#
# The disclosure is the point. Code that contacts a server its own operator
# arranged does not need to introduce itself as a study or to publish an
# opt-out address; that text is written for the owner of a machine that was
# contacted without asking, and it is the standing shape of the mass "research"
# beacon campaigns uploaded to public package registries -- thousands of
# lookalike packages, each phoning a bare IP once per execution to record that
# it ran somewhere. Whether the operator means to publish a paper or to build a
# target list is not decidable from the file, and does not change what the code
# does: it reports execution on someone else's computer to fixed infrastructure
# that no dependency of theirs asked to reach.
#
# The IP leg is what separates this from a crawler carrying the same courtesy
# string: a research crawler fetches the targets it was pointed at, while this
# fetches one address pinned in the source, past DNS and past any reputation
# lookup on a name.
defaults:
  platforms: [unix, windows]
  for: [python]
  attack: T1071.001
  mbc: B0030

composite_rules:
  - id: python-optout-disclosed-ip-beacon
    desc: Opt-out research beacon to hardcoded IP
    crit: hostile
    conf: 0.95
    scope: file
    attack: T1071.001,T1041
    mbc: E1041
    all:
      - id: micro-behaviors/communications/ip/literal::interpolated-ip-http-client
      - id: micro-behaviors/communications/http/user-agent::research-optout-user-agent
    any:
      # Corroboration that the disclosure really is what the request carries --
      # the string is set as a User-Agent header -- or that the caller hides the
      # outcome, which a fetch whose result mattered would not.
      - id: micro-behaviors/communications/http/user-agent::user-agent-header
      - id: micro-behaviors/data/control-flow/error-handling::silent-exception-pass
    unless:
      - id: well-known/tool/detection/security-scanner/
      - id: metadata/package/testing/presence/harness/
