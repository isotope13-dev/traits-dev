defaults:
  for: [shell]
  platforms: [macos]
composite_rules:
  - id: pasted-event-payload-beacon
    desc: Hidden payload stager reports a paste event
    crit: hostile
    conf: 0.99
    attack: T1071.001
    all:
      - id: objectives/evasion/anti-av/platform/gatekeeper::encoded-stager-clears-attributes
      - id: micro-behaviors/communications/http/request/result::http-post-option
      - id: micro-behaviors/communications/http/header/custom::build-id-header
      - id: micro-behaviors/process/daemonize/detach::background-ampersand-hidden
    any:
      - id: micro-behaviors/communications/http/url/encoded::printf-pasted-event-query-format
      - id: micro-behaviors/communications/http/url/encoded::printf-pasted-event-query-percent-b
