# A module that phones home the moment it loads and swallows every failure.
# The three legs together -- a top-level call on the required HTTPS client,
# an empty catch around it, and both inside one tight window -- separate a
# beacon from ordinary request code, which handles responses and surfaces
# errors. Packaging context (placeholder shape, dependency confusion) lives
# in the supply-chain twins; this states the network behavior alone.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  attack: T1071.001
  mbc: B0030

composite_rules:
  - id: suppressed-error-import-time-beacon
    desc: Import-time HTTPS beacon swallows all errors
    crit: suspicious
    conf: 0.88
    scope: file
    near_bytes: 2048
    all:
      - id: micro-behaviors/communications/http/get::node-https-get-reference
      - id: micro-behaviors/data/control-flow/module-exec::module-level-imported-method-call
      - id: micro-behaviors/data/control-flow/error-handling::empty-named-catch-text
    unless:
      - id: metadata/package/testing/
      - id: metadata/file/naming::test-directory-component
