# A module that phones home the moment it loads and swallows every failure.
# The two legs together -- an HTTPS request initiated by top-level module
# code on the required client, and an empty catch within one tight window --
# separate a beacon from ordinary request code, which runs when called,
# handles responses, and surfaces errors to its caller. Packaging context
# (placeholder shape, dependency confusion) lives in the supply-chain twins;
# this states the network behavior alone.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  attack: T1071.001
  mbc: B0030

composite_rules:
  - id: suppressed-error-import-time-beacon
    desc: Import-time HTTPS beacon swallows all errors
    crit: suspicious
    conf: 0.88
    scope: file
    near_bytes: 2048
    all:
      - id: micro-behaviors/communications/http/get::module-level-https-get-call
      - id: micro-behaviors/data/control-flow/error-handling::empty-named-catch-text
    unless:
      - id: metadata/package/testing/
      - id: metadata/file/naming::test-directory-component
