# Classified by required operations; references do not establish data flow.
defaults:
  platforms: [windows]
  for: [scripts, source, class, java_class]
composite_rules:
  - id: swift-embedded-node-beacon-launch
    desc: Swift process launch and embedded Node HTTP timer
    crit: suspicious
    conf: 0.99
    # Archive membership does not connect a process in one file to a timer
    # or executable reference in another. Member findings still propagate.
    for: [swift]
    scope: file
    all:
      - id: micro-behaviors/process/create/subprocess/launch::swift-source-process-run
      - id: micro-behaviors/os/application/target/development::node-executable-name-reference
      - id: micro-behaviors/communications/http/client/reference::embedded-node-https-get-with-timeout

