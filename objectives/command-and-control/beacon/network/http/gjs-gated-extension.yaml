# GJS startup extensions can make legitimate update and telemetry requests.
# Requiring a hidden home-cache gate and an ignored-response GET distinguishes
# this check-in shape from a normal extension endpoint configuration.
defaults:
  platforms: [unix]
  for: [javascript]
  attack: T1071.001

traits:
  - id: gjs-extension-gated-http-checkin-shape
    desc: GJS home cache marker gates Soup GET
    crit: suspicious
    conf: 0.98
    if:
      type: yara
      source: |
        rule gjs_extension_gated_http_checkin {
          strings:
            $home = /GLib\.get_home_dir\s*\(\)/
            $gate = /GLib\.file_test\s*\(\s*[A-Za-z_$][A-Za-z0-9_$]*\s*,\s*GLib\.FileTest\.EXISTS\s*\)/
            $session = /Soup\.Session\s*\(\s*\)/
            $get = /Soup\.Message\.new\s*\(\s*["']GET["']\s*,\s*["']https?:\/\//
            $queue = /\.queue_message\s*\(\s*[A-Za-z_$][A-Za-z0-9_$]*\s*,\s*\(\s*\)\s*=>\s*\{\s*\}\s*\)/
          condition:
            all of them
        }
