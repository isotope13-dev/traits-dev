defaults:
  platforms: [macos]
  for: [macho, dylib]
  attack: T1071.001
  mbc: B0030

composite_rules:
  - id: flutter-remote-poll-delay-api
    desc: Flutter remote polling delay API
    crit: hostile
    conf: 0.97
    all:
      - id: micro-behaviors/communications/http/url/api-path::polling-interval-api-path
      - id: micro-behaviors/process/interpreter/webview::flutter-webview-js-channel-bridge
      - id: micro-behaviors/process/threading/concurrency::dart-isolate-remote-runner
    any:
      - id: micro-behaviors/communications/http/header/content-type::json-header
      - id: micro-behaviors/communications/http/authorization-header::auth-header-dup
