defaults:
  platforms: [netscaler, appliance, unix]
  for: [ruby]
  attack: T1041

traits:
  - id: ruby-net-http-beacon
    desc: Ruby Net::HTTP beacon
    crit: suspicious
    conf: 0.92
    if:
      type: text
      regex: 'Net::HTTP::Post[\s\S]{0,180}/api/v1/beacon'

composite_rules:
  - id: rubygems-rakefile-direct-ip-http-beacon
    desc: RubyGem extension sends HTTP GET beacon to raw external IP
    crit: hostile
    conf: 0.98
    for: [gem, tar, ruby]
    scope: archive
    all:
      - id: metadata/package/files/rubygems::gemspec-native-extension-declaration
      - id: micro-behaviors/os/package-manager/hook-install::gem-extensions
      - id: micro-behaviors/communications/http/request/netlib::ruby-net-http-get-response-call
      - id: micro-behaviors/communications/ip/literal::direct-ip-http-client
