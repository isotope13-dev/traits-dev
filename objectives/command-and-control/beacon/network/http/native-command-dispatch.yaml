defaults:
  for: [pe]
  platforms: [windows]
  attack: T1071.001

traits:
  - id: native-dispatch-payload-log
    desc: Logs command dispatch payload length
    crit: notable
    if:
      type: text
      substr: '[DISPATCH] payload_len='

  - id: native-beacon-gate-log
    desc: Logs deferred beacon network activity
    crit: component
    if:
      type: text
      substr: '[GATE] DEFER -> no network'

  - id: native-wipe-task-log
    desc: Logs scheduled task cleanup
    crit: component
    if:
      type: text
      substr: 'WIPE: Task A deleted'

composite_rules:
  - id: native-obfuscated-url-command-beacon
    desc: Native command beacon with encoded external URL and task cleanup
    crit: hostile
    all:
      - id: native-dispatch-payload-log
      - id: native-beacon-gate-log
      - id: native-wipe-task-log
      - id: micro-behaviors/communications/url/host/oob-http::url-external-ip-xor-binary
