defaults:
  platforms: [windows, unix]
  for: [scripts, binaries]
traits:
  # curl-invoked-with-url-or-option lives in micro-behaviors/communications/http/download/curl.
  - id: wget-cmd-dup
    desc: wget command
    crit: component
    conf: 0.3
    if:
      type: text
      regex: \bwget(\s+-|\s+http|\s+--)
    unless:
      - type: text
        substr: github.com/google/protobuf/releases
      - id: metadata/package/testing/harness/runtime/
  # A plain `curl -F` form post and a `-F field=@file` attachment are neutral
  # transfer capabilities, not beacon evidence; both now live in
  # micro-behaviors/communications/http/upload (curl-upload-file and
  # curl-form-file-attachment) and are referenced from the composites below.
  - id: shell-env-block-dump
    desc: Shell env block dump via group command
    crit: component
    conf: 0.9
    for: [shell]
    if:
      type: text
      regex: '\{\s*env\s*[;|]'
composite_rules:
  - id: curl-post-exfil
    desc: curl POST exfiltrates data to external endpoint
    crit: hostile
    conf: 0.95
    mbc: C0002
    for: [shell]
    all:
      - id: micro-behaviors/communications/http/upload::curl-data-binary
    any:
      # workers.dev alone is not exfil — Cloudflare Workers hosts ordinary APIs
      # (coverage charts, status pages). Require env/OAST/IMDS corroboration.
      - id: shell-env-block-dump
      - id: objectives/supply-chain/recon-exfil/oast/env::shell-env-dump
      - id: objectives/supply-chain/recon-exfil/oast/env::oast-fun-url
      - id: micro-behaviors/os/security/auth/cloud::aws-imds-credential-reference
      - id: micro-behaviors/os/security/auth/cloud::gcp-metadata-credential-reference
    unless:
      - id: well-known/app/utility/cmdchamp/
      - id: well-known/tool/detection/security-scanner-identity::ks-aur-scanner-source-context
      - id: metadata/package/testing/presence/harness::test-directory-path
  # Uploading a named local file (-F field=@path) to an ephemeral tunnel
  # endpoint is data exfiltration: legitimate software does not push local
  # files into a throwaway ngrok/localtunnel/serveo URL.
  - id: curl-file-upload-to-tunnel
    desc: curl uploads a local file to an OOB tunnel
    crit: hostile
    conf: 0.95
    mbc: C0002
    attack: T1567.002
    all:
      - id: micro-behaviors/communications/http/upload::curl-form-file-attachment
    any:
      - id: objectives/command-and-control/infrastructure/domain/tunnel/
      - id: well-known/dual-use/tunnel/ngrok::ngrok-free-domain
