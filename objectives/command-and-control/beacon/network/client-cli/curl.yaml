defaults:
  platforms:
  - windows
  - unix
  for:
  - scripts
  - binaries
  mbc: C0002
  crit: hostile
  conf: 0.95
traits: []
composite_rules:
- id: curl-post-exfil
  desc: curl POST exfiltrates data to external endpoint
  for:
  - shell
  all:
  - id: micro-behaviors/communications/http/curl::curl-data-binary
  any:
  - id: objectives/supply-chain/recon-exfil/oast/env::shell-env-dump
  - id: micro-behaviors/communications/url/host/oob::manifest-oast-fun-reference
  - id: micro-behaviors/os/security/auth/cloud::aws-imds-credential-reference
  - id: micro-behaviors/os/security/auth/cloud::gcp-metadata-credential-reference
  unless:
  - id: well-known/app/utility/cmdchamp/
  - id: well-known/tool/detection/security-scanner-identity::ks-aur-scanner-source-context
  - id: metadata/path::test-directory-component
  - id: micro-behaviors/communications/http/services/gcp::gcs-client-with-instance-token
  - id: well-known/tool/offensive/peas::linpeas-audit-script
- id: curl-file-upload-to-tunnel
  desc: curl uploads a local file to an OOB tunnel
  attack: T1567.002
  all:
  - id: micro-behaviors/communications/http/upload::curl-form-file-attachment
  any:
  - id: objectives/command-and-control/infrastructure/domain/tunnel/
  - id: micro-behaviors/communications/url/host/oob::ngrok-free-domain
  unless:
  - id: well-known/tool/detection/ai-guardrail::command-rule-corpus
