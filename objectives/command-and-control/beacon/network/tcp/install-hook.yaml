# A package that phones home over a raw TCP socket to a hardcoded address,
# reporting what machine it landed on.
#
# The shape is an install beacon, and every part of it is a choice. Raw TCP
# rather than HTTP, so there is no URL in the bytes, no Host header, no TLS
# certificate, and nothing a proxy log will show as a request. A literal IP
# rather than a name, so there is no DNS query to observe and nothing to
# sinkhole. Platform and architecture in the payload, because the operator is
# deciding what second stage this victim gets. And an obfuscated body, because
# none of the above survives being read.
#
# What it is *for* is inventory: the package is published under many names at
# once, and the beacon is how the operator learns which installs took, on what
# kind of host, before spending a payload on them. That is why so little
# happens in the sample itself — the interesting behaviour is one reply away,
# and the reply is not in the artifact.
#
# Composed from capabilities rather than the address, so the next campaign's IP
# and port are covered. The obfuscation leg is what separates this from a
# legitimate service client that happens to dial a fixed host: an application
# talking to its own backend has no reason to hide the code that does it.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  attack: T1095,T1082
  mbc: B0030,E1082

composite_rules:
  - id: obfuscated-tcp-host-beacon
    desc: Obfuscated raw-TCP beacon reports the host
    crit: hostile
    conf: 0.94
    all:
      - id: micro-behaviors/communications/socket/connect::node-tcp-socket-client
      - id: micro-behaviors/communications/ip/literal::external-ipv4-script
      - id: objectives/anti-static/obfuscation/obfuscator/js-obfuscator::hex-name-mangling
    needs: 1
    any:
      - id: micro-behaviors/os/sysinfo/platform/runtime::node-platform-method-call
      - id: micro-behaviors/os/sysinfo/hostname::node-os-alias-hostname-call
      - id: micro-behaviors/process/user/query::node-os-alias-userinfo-call
