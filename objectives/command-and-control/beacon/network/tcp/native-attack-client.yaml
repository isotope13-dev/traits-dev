defaults:
  platforms: [windows]
  for: [pe]

composite_rules:
  - id: native-c2-attack-command-client
    desc: Native C2 client with network attack command parameters
    crit: hostile
    conf: 0.99
    attack: T1095
    all:
      - id: objectives/command-and-control/beacon/network/http::explicit-native-c2-session-status
      - id: objectives/impact/dos/attack/flood::native-threaded-attack-parameters
      - id: micro-behaviors/communications/socket/connect/attempt::winsock-client-lifecycle
