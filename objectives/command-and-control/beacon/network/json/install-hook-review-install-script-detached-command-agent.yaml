defaults:
  platforms: [unix, windows]
  for: [javascript]
composite_rules:
  - id: install-script-detached-command-agent
    desc: Install-named script has command endpoint and detached shell clues
    crit: hostile
    conf: 0.99
    attack: T1195.002, T1059.004, T1071.001, T1105
    scope: leaf
    all:
      - id: micro-behaviors/process/daemonize/detach::install-named-script-detach-options
      - id: objectives/command-and-control/beacon/network/json::c2-command-result-endpoints
      - id: micro-behaviors/process/create/shell/variable-command::js-spawnsync-bash-command
