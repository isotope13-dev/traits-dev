defaults:
  platforms: [windows, unix]
  for: [scripts, binaries]
traits:
  - id: marker
    desc: Explicit 'c2-client' string marker
    crit: suspicious
    conf: 1.0
    if:
      type: text
      word: c2-client
    unless:
      - id: well-known/tool/detection/pattern-catalog::js-threat-data-catalog
      - id: metadata/lang/scripted::dts-declaration-file
      # Documentation prose and crate/package names in a README are not a
      # code marker, even when the engine sniffs the file as a script.
      - id: metadata/file/extension/identity::markdown-file-basename
