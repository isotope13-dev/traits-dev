defaults:
  platforms: [unix, windows]
  for: [binaries]
traits:
  - id: eset-update-path
    desc: References an ESET update endpoint
    crit: notable
    conf: 0.9
    if:
      type: text
      substr: /eset_upd/consumer/windows/limited/dll/update.ver
  - id: eset-update-host
    desc: References an ESET update host
    crit: notable
    conf: 0.9
    if:
      type: text
      substr: um01.cn.eset.com
  - id: c2-handler-server-label
    desc: References C2 handler, server or beacon labels
    crit: notable
    conf: 0.75
    if:
      type: text
      regex: '(?i)\b(c2Handler|c2Server|c2Beacon)\b|c2\s*=\s*https?://'


composite_rules:
  - id: native-vendor-update-channel-disables-tls-validation
    desc: Impersonates ESET updates with TLS checks disabled
    crit: hostile
    conf: 0.97
    attack: T1071.001,T1553.004
    all:
      - id: micro-behaviors/communications/tls/verify/disable::x86-winhttp-ignore-certificate-errors
      - id: eset-update-path
      - id: eset-update-host
      - id: micro-behaviors/communications/http/auth::authorization-basic-header-token

