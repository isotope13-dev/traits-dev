# Serverless WebRTC C2 loaders embed a hardcoded SDP peer session, beacon
# victim page URL and User-Agent over the control DataChannel, and optionally
# wait on a DOM MutationObserver selector before connecting.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  attack: T1071.001

traits:
  - id: browser-ua-pageurl-telemetry-fields
    desc: Collects browser user-agent and page URL fields
    crit: notable
    conf: 0.92
    for: [javascript, typescript, html]
    if:
      type: text
      regex: '(?s)\buser_agent\b.{0,240}\bpage_url\b|\bpage_url\b.{0,240}\buser_agent\b'

composite_rules:
  - id: webrtc-browser-context-beacon
    desc: Hardcoded WebRTC channel beacons page URL and User-Agent
    crit: hostile
    conf: 0.97
    attack: T1071.001,T1082,T1041
    mbc: B0030
    near_bytes: 12000
    all:
      - id: micro-behaviors/communications/proxy/turn::webrtc-peer-connection-api
      - id: micro-behaviors/communications/proxy/turn::webrtc-data-channel-api
      - id: micro-behaviors/communications/proxy/turn::webrtc-inline-sdp-datachannel
      - id: browser-ua-pageurl-telemetry-fields
      - id: micro-behaviors/data/serialize/json::json-stringify-text-call

  - id: dom-selector-gated-webrtc-c2
    desc: DOM MutationObserver gates hardcoded WebRTC C2 activation
    crit: hostile
    conf: 0.98
    attack: T1071.001,T1059.007,T1027
    mbc: B0030
    near_bytes: 12000
    all:
      - id: micro-behaviors/communications/proxy/turn::webrtc-inline-sdp-datachannel
      - id: micro-behaviors/communications/proxy/turn::webrtc-peer-connection-api
      - id: micro-behaviors/ui/window/event::browser-mutation-observer
      - id: micro-behaviors/data/collection/dom::dom-element-lookup--queryselector
    any:
      - id: micro-behaviors/process/interpreter/eval/indirect::js-indirect-eval
      - id: micro-behaviors/process/interpreter/eval/indirect::js-indirect-eval-text
      - id: micro-behaviors/process/interpreter/eval/javascript::js-eval-raw
      - id: micro-behaviors/metaprogramming/generation/function::js-function-constructor
