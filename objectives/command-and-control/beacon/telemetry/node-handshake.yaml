# A library that silently POSTs a generated node identity and a handshake
# timestamp on import is making an automatic check-in. Require both that
# import-time trigger and the structured telemetry request; an explicit
# telemetry start method alone is ordinary opt-in behavior.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  attack: T1071.001

traits:
  - id: node-telemetry-id-field
    desc: Node identifier field in telemetry payload
    crit: component
    conf: 0.9
    if:
      type: text
      regex: '\bnode_id\s*:'

  - id: telemetry-handshake-label
    desc: Telemetry labels an initialization handshake
    crit: component
    conf: 0.9
    if:
      type: text
      regex: '\btelemetry_type\s*:\s*["''][^"'']{0,48}handshake'

  - id: module-level-try-wrapped-zero-arg-call
    desc: Try-wrapped zero-argument call at module scope
    crit: component
    conf: 0.9
    if:
      type: text
      regex: '(?m)^try\s*\{\s*[A-Za-z_$][A-Za-z0-9_$]*\s*\(\s*\)\s*;\s*\}\s*catch\b'

composite_rules:
  - id: node-telemetry-handshake-on-import
    desc: Sends node handshake telemetry during import
    crit: suspicious
    conf: 0.96
    scope: file
    near_bytes: 1400
    all:
      - id: node-telemetry-id-field
      - id: telemetry-handshake-label
      - id: module-level-try-wrapped-zero-arg-call
      - id: micro-behaviors/communications/http/post::js-http-post-request
      - id: micro-behaviors/communications/http/request/body/construction::node-bound-request-write-end
      - id: micro-behaviors/data/serialize/json::json-stringify-text-call
