# Pipe-delimited victim-registration message format.
#
# On first contact many RATs register the victim with a single pipe-delimited
# record that concatenates host-recon fields — CPU arch, hostname, username,
# integrity level, public IP, implant version. Abyssos uses
# "HELLO|%s|%s|%s|%s|%s|v2.4F|%s|%s|%s". The reusable, family-independent
# artifact is the printf-family format string that joins five or more %s
# tokens with '|': ordinary logging and CSV builders rarely chain that many
# string fields under a pipe separator, and it is the shape of a beacon
# registration record regardless of the family name or C2 address.
defaults:
  platforms: [unix, windows]
  for: [c, cpp, source, scripts]
  attack: T1071.001
  mbc: B0030

traits:
  - id: pipe-delimited-victim-registration
    desc: Pipe-joined multi-field host-report format
    crit: notable
    conf: 0.85
    if:
      type: text
      regex: '%s\|%s\|%s\|%s\|%s'
