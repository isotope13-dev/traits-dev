# A Python source file that carries a complete beacon implant as template
# text (an f-string or dedented block the tool writes out for the operator):
# an endless loop that reports the host and user it landed on, takes a
# command from the reply, runs it through a shell, and either randomizes its
# sleep or ignores certificate errors. Each piece has benign uses -- a
# monitoring agent reports host and user, a deploy tool runs a "cmd" field --
# but all of them in one loop is the shape of an implant, whoever wrote it
# and whoever the operator is meant to be.
defaults:
  platforms: [unix, windows]
  for: [python]
  attack: T1071.001,T1059.004
  mbc: B0030

traits:
  - id: symmetric-random-sleep-jitter
    desc: Interval jittered with random uniform offset
    crit: notable
    conf: 0.85
    if:
      type: text
      regex: 'random\.uniform\(\s*-\w{1,30}\s*,\s*\w{1,30}\s*\)'

composite_rules:
  - id: python-templated-beacon-implant
    desc: Python source carries host-reporting shell-command beacon loop
    crit: hostile
    conf: 0.9
    near_lines: 80
    all:
      - id: micro-behaviors/data/control-flow/loop/unconditional::python-unconditional-while-header
      - id: micro-behaviors/data/serialize/schema-system::host-user-field-pair
      - id: micro-behaviors/data/property/access::mapping-command-key-access
      - id: micro-behaviors/process/create/shell/command-mode::check-output-shell-true
    any:
      - id: symmetric-random-sleep-jitter
      - id: micro-behaviors/communications/tls/verify/disable::verify-mode-none
