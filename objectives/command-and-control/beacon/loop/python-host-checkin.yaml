# Connect-back check-in: on every (re)connection the client announces the
# host it landed on -- hostname, OS, and whether it holds root -- and on loss
# it retries with jittered sleeps. Telemetry clients rarely report their own
# privilege level; implants report it so the operator knows what they own.
defaults:
  platforms: [unix, windows]
  for: [python]
  attack: T1082,T1071.001
  mbc: B0030
composite_rules:
  - id: python-socket-root-checkin-reconnect
    desc: Socket client reports host and root, retries
    crit: suspicious
    conf: 0.9
    near_lines: 80
    all:
      - id: micro-behaviors/communications/socket/send/stream::python-connected-socket-write
      - id: micro-behaviors/os/sysinfo/profile::python-host-information-query-combination
      - id: micro-behaviors/os/privilege/check::os-geteuid-root-check
      - id: micro-behaviors/time/sleep/interval::python-randomized-sleep
