# A periodic timer that re-runs a Base64-encoded /dev/tcp reverse shell is a
# shell beacon: unlike HTTP polling implants, the loop carries no request
# shaping, only setInterval around an encoded child_process exec of a dialable
# endpoint. The host must be literal digits so encoded payload templates stay
# documentation; the reassembly legs below already enforce that.
defaults:
  platforms: [linux, macos, windows, unix]
  for: [javascript, typescript]
  attack: T1059.007,T1071.001
  mbc: B0030
composite_rules:
  - id: node-interval-devtcp-shell-beacon
    desc: Timer re-runs an encoded dev/tcp reverse shell
    crit: hostile
    conf: 0.97
    scope: file
    near_lines: 20
    all:
      - id: micro-behaviors/time/schedule/interval::setInterval
      - id: metadata/import/builtin::encoded-child-process-reference
      - id: objectives/command-and-control/reverse-shell/dev-tcp::reverse-shell-shell-encoded
    unless:
      - id: metadata/package/documentation/security-testing::reverse-shell-inert-documentation
      - id: metadata/package/testing/corpus/
      - id: well-known/tool/offensive/
      - id: well-known/tool/detection/
      - id: metadata/package/testing/presence/harness/
      - id: metadata/path::test-directory-component
