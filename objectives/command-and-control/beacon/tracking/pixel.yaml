defaults:
  crit: suspicious
  platforms: [unix, windows]
composite_rules:
# Image URLs and numeric hosts alone are ordinary telemetry references.
# Require an admitted browser-history theft chain and actual image fetches
# before interpreting the status requests as operator check-ins. This describes
# attempted callbacks; it does not assert that a background job succeeds.
- id: browser-stealer-image-status-checkin
  desc: Browser stealer attempts image-status check-ins
  crit: hostile
  conf: 0.97
  attack: T1071.001
  for: [powershell]
  all:
  - id: objectives/exfiltration/stealer/browser::powershell-concealed-history-exfil
  - id: micro-behaviors/communications/http/get::powershell-image-url-get
  - id: micro-behaviors/communications/http/url/telemetry::image-beacon-status-url
- id: ruby-tracking-pixel-beacon
  desc: Ruby HTTP request to tracking/logging service (beaconing)
  conf: 0.95
  all:
  - id: micro-behaviors/communications/http/lib/netlib::request-ruby
  any:
  - id: objectives/discovery/network/ip-tracker/
  - id: objectives/discovery/system/fingerprint/network::iplogger-keyword
  - id: objectives/discovery/system/fingerprint/network::iplogger-ru-host
  - id: objectives/discovery/system/fingerprint/network::iplogger-encoded
- id: python-tracking-pixel-beacon
  desc: Python HTTP request to tracking/logging service (beaconing)
  conf: 0.95
  all:
  - id: micro-behaviors/communications/http/request/client::request-python
  any:
  - id: objectives/discovery/network/ip-tracker/
  - id: objectives/discovery/system/fingerprint/network::iplogger-keyword
  - id: objectives/discovery/system/fingerprint/network::iplogger-ru-host
  - id: objectives/discovery/system/fingerprint/network::iplogger-encoded
- id: generic-tracking-pixel-beacon
  desc: HTTP request to tracking/logging service (beaconing)
  conf: 0.9
    # Require the HTTP client and tracker marker in the same local
    # neighborhood. File-wide coincidence of a filter-engine domain table
    # plus unrelated fetch/XHR elsewhere is not beaconing.
  near_lines: 25
  unless:
  - id: well-known/app/browser-extension/content-blocker::adblock-extension-bundle
  - id: well-known/lib/data/easylist::filter-list-title-header
  - id: well-known/app/browser-extension/ublock-origin::filter-bundle
  - id: micro-behaviors/process/hook/webextension::dnr-block-request-rules
  all:
  - id: micro-behaviors/communications/http/request/
  any:
  - id: objectives/discovery/network/ip-tracker/
  - id: objectives/discovery/system/fingerprint/network::iplogger-keyword
  - id: objectives/discovery/system/fingerprint/network::iplogger-ru-host
  - id: objectives/discovery/system/fingerprint/network::iplogger-encoded
