defaults:
  platforms:
  - linux
  - macos
  - windows
  for:
  - javascript
  - typescript
  attack: T1059
  mbc: B0030.002
composite_rules:
- id: node-bash-socket-stdio-reverse-shell
  desc: Node bash spawn piped over Socket.connect
  crit: hostile
  conf: 0.98
  all:
  - id: micro-behaviors/process/create/shell/spawn::node-spawn-bash-shell
  - id: micro-behaviors/communications/socket/connect::node-net-socket-connect
  - id: micro-behaviors/process/fd/stdio::node-duplex-stdio-pipe-pair
  unless:
  - id: well-known/tool/detection/llm-scanner/
- id: node-createconnection-stdio-reverse-shell
  desc: Node net.createConnection stdio reverse shell
  crit: hostile
  conf: 0.98
  platforms:
  - openwrt
  all:
  - id: micro-behaviors/communications/socket/connect::net-create-connection-call
  - id: micro-behaviors/process/interpreter/shell::bin-sh
  - id: micro-behaviors/process/fd/stdio::node-duplex-stdio-pipe-pair
  unless:
  - id: well-known/tool/detection/llm-scanner/
- id: extension-reverse-shell-pipe
  for:
  - javascript
  - typescript
  - vsix
  platforms:
  - unix
  - windows
  desc: Extension contains a socket shell relay
  crit: hostile
  conf: 0.98
  attack: T1059,T1195.002
  scope: archive
  all:
  - id: well-known/lib/development/vscode::vscode-extension-marker
  any:
  - id: objectives/command-and-control/reverse-shell/stream-bridge::node-net-connect-shell-pipe-bridge
  - id: objectives/command-and-control/reverse-shell/stream-bridge::js-reverse-shell-spawn
  - id: objectives/command-and-control/reverse-shell/stream-bridge::node-bash-socket-stdio-reverse-shell
  - id: objectives/command-and-control/reverse-shell/stream-bridge::node-createconnection-stdio-reverse-shell
  - id: objectives/command-and-control/reverse-shell/stream-bridge::js-net-options-bash-reverse-shell
  - id: objectives/command-and-control/reverse-shell/stream-bridge::js-variable-shell-reverse-shell
  - id: objectives/command-and-control/reverse-shell/stream-bridge::js-fetched-command-reverse-shell
  - id: objectives/command-and-control/reverse-shell/stream-bridge::node-dynamic-import-reverse-shell
