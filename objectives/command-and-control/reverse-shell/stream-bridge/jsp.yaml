# JSP-shaped source explicitly bridges a configured socket and shell streams.
defaults:
  platforms: [windows, unix]
  for: [python, javascript]
  attack: T1505.003
  mbc: B0030
composite_rules:
  - id: jsp-cookie-reverse-shell
    desc: JSP opens a cookie-configured socket and bridges a command shell
    crit: hostile
    conf: 0.99
    all:
      - id: metadata/lang/source/language::jsp-server-page
      - id: micro-behaviors/communications/http/cookies::servlet-request-cookie-read
      - id: metadata/lang/source/syntax/call/construction::socket-constructor-variable-arguments
      - id: micro-behaviors/process/create/exec::java-runtime-exec-source
      - id: micro-behaviors/fs/path/application/interpreter::unix-shell-executable-path
      - id: metadata/lang/source/syntax/call/invocation::paired-stream-accessor-start-text
    near_bytes: 4096
