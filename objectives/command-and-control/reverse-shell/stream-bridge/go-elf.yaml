# A compiled Go binary stores exec.Command("/bin/sh", "-c", line) as separate
# string blobs plus pclntab symbols. Source-shaped exec.Command rules never see it.
# The session compares a word to "exit" with MOVZ/MOVK immediates 0x7865/0x7469
# before running the shell.
defaults:
  platforms: [linux]
  for: [elf]
  attack: T1059
  mbc: B0030.002

traits:
  - id: arm64-exit-word-compare
    desc: ARM64 compares a word to exit
    crit: notable
    conf: 0.9
    if:
      type: hex
      section: text
      pattern: 'A6 0C 8F D2 26 8D AE F2 BF 00 06 6B'

composite_rules:
  - id: go-elf-dial-sh-c
    desc: Go binary dials and runs sh -c
    crit: hostile
    conf: 0.96
    all:
      - id: metadata/lang/compiler/systems::go-binary
      - id: micro-behaviors/fs/path/binary::bin-sh-path-reference
      - id: arm64-exit-word-compare
      - id: micro-behaviors/process/create/system::go-os-exec-pclntab
      - id: micro-behaviors/communications/socket/connect::pclntab-net-dial
    unless:
      - id: well-known/tool/sysadmin/unix-benign/
      - id: metadata/binary/installer/family/
