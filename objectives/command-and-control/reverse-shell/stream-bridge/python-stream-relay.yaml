defaults:
  platforms:
  - unix
  - windows
  for:
  - python
composite_rules:
- id: python-popen-socket-stream-relay
  desc: Python shell transfers socket and process data
  crit: hostile
  conf: 0.98
  attack: T1059.006
  mbc: B0030.002
  near_bytes: 4096
  all:
  - id: micro-behaviors/communications/socket/dial::python-dial
  - id: micro-behaviors/process/create/shell/interpreter::python-popen-shell-executable
  - id: micro-behaviors/process/fd/stdio::python-received-data-to-stdin
  - id: micro-behaviors/process/fd/stdio::python-standard-output-to-send
  unless:
  - id: metadata/package/testing/harness/runtime/
  - id: metadata/package/testing/presence/harness/
  - id: well-known/tool/detection/llm-scanner/
  - id: well-known/app/infrastructure/ansible::ansible-module-source-context
  - id: well-known/app/infrastructure/ansible::ansible-collections-wheel-context
  - id: "metadata/file/naming::test-directory-component"
