defaults:
  platforms: [unix, windows]
  for: [javascript, java]
  attack: T1059.004,T1095

traits:
  - id: java-staged-script-socket
    desc: Stages Java socket connection
    crit: notable
    if:
      type: text
      substr: 'new java.net.Socket(host, port)'
  - id: java-staged-script-shell
    desc: Stages Java shell process
    crit: notable
    if:
      type: text
      substr: 'new java.lang.ProcessBuilder(cmd).redirectErrorStream(true).start()'
  - id: java-staged-script-shell-output
    desc: Relays process output to socket
    crit: notable
    if:
      type: text
      substr: 'so.write(pi.read())'
  - id: java-staged-script-shell-input
    desc: Relays socket input to process
    crit: notable
    if:
      type: text
      substr: 'po.write(si.read())'

composite_rules:
  - id: java-staged-script-reverse-shell
    desc: Stages Java socket shell bridge
    crit: hostile
    conf: 0.99
    all:
      - id: java-staged-script-socket
      - id: java-staged-script-shell
      - id: java-staged-script-shell-output
      - id: java-staged-script-shell-input
