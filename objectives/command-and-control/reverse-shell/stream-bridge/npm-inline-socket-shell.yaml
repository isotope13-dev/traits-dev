defaults:
  platforms: [unix]
  for: [package.json]
  attack: T1059.004,T1095,T1195.002

traits:
  - id: npm-inline-socket-shell-spawn
    desc: Install hook spawns a shell
    crit: notable
    if:
      type: value
      path: scripts.preinstall
      regex: '\.spawn\s*\(\s*["''](/bin/)?(ba)?sh["'']'
  - id: npm-inline-socket-create
    desc: Install hook creates a network socket
    crit: notable
    if:
      type: value
      path: scripts.preinstall
      regex: 'new\s+net\.Socket\s*\('
  - id: npm-inline-socket-shell-input
    desc: Pipes socket data to shell input
    crit: notable
    if:
      type: value
      path: scripts.preinstall
      regex: '\b[\w$]{1,40}\.pipe\s*\(\s*[\w$]{1,40}\.stdin\s*\)'
  - id: npm-inline-socket-connect
    desc: Install hook connects to a TCP port
    crit: notable
    if:
      type: value
      path: scripts.preinstall
      regex: '\.connect\s*\(\s*[0-9]{1,5}\s*,'
  - id: npm-inline-socket-shell-output
    desc: Pipes shell output to socket
    crit: notable
    if:
      type: value
      path: scripts.preinstall
      regex: '\b[\w$]{1,40}\.stdout\.pipe\s*\(\s*[\w$]{1,40}\s*\)'

composite_rules:
  - id: npm-inline-socket-shell-reverse-shell
    desc: Opens socket shell during package install
    crit: hostile
    conf: 0.99
    all:
      - id: npm-inline-socket-shell-spawn
      - id: npm-inline-socket-create
      - id: npm-inline-socket-connect
      - id: npm-inline-socket-shell-input
      - id: npm-inline-socket-shell-output
