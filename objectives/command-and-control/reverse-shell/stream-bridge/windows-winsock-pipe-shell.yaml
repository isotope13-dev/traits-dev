defaults:
  platforms: [windows]
  crit: hostile
  attack: T1059.003
  mbc: B0022

composite_rules:
  - id: windows-winsock-pipe-cmd-shell-source
    desc: Relays Windows shell pipes over Winsock
    conf: 0.98
    for: [c, cpp]
    all:
      - id: micro-behaviors/communications/socket/connect/attempt::connect-symbol
      - id: micro-behaviors/communications/socket/receive::recv-symbol
      - id: micro-behaviors/communications/socket/send/reference::send-symbol
      - id: micro-behaviors/communications/ipc/pipe::create-pipe-source-call
      - id: micro-behaviors/process/create/subprocess/launch::create-process-call-source
      - id: micro-behaviors/process/stdio/configure::startupinfo-stdhandles-flag
      - id: micro-behaviors/process/stdio/relay::c-winsock-pipe-stream-relay
    any:
      - id: micro-behaviors/process/create/shell/command-mode::windows-command-shell-invocation
      - id: micro-behaviors/fs/path/application/interpreter::cmd-exe-image-name
      - id: micro-behaviors/fs/path/application/interpreter::powershell-executable-token
  - id: windows-winsock-pipe-cmd-shell-pe
    desc: PE bridges Winsock and shell pipes
    conf: 0.96
    for: [pe, dll]
    size_max: 2097152
    all:
      - id: micro-behaviors/communications/socket/lib::winsock-client-io-pe
      - id: micro-behaviors/communications/ipc/pipe::create-pipe
      - id: micro-behaviors/process/create/exec::child-process-execution
      - id: micro-behaviors/process/stdio/relay::pe-winsock-pipe-stream-relay
    any:
      - id: micro-behaviors/process/create/shell/command-mode::windows-command-shell-invocation
      - id: micro-behaviors/fs/path/application/interpreter::cmd-exe-image-name
      - id: micro-behaviors/fs/path/application/interpreter::pe-dword-stack-cmd-exe
      - id: micro-behaviors/fs/path/application/interpreter::powershell-executable-token
    unless:
      - id: metadata/signature/verified/platform::microsoft
