defaults:
  platforms: [windows]
  crit: hostile
  attack: T1059.003
  mbc: B0022

composite_rules:
  - id: windows-winsock-pipe-cmd-shell-source
    desc: Winsock relays pipe I/O to cmd.exe
    conf: 0.98
    for: [c, cpp]
    all:
      - id: micro-behaviors/communications/socket/connect/attempt::connect-symbol
      - id: micro-behaviors/communications/socket/receive::recv-symbol
      - id: micro-behaviors/communications/socket/send/reference::send-symbol
      - id: micro-behaviors/communications/ipc/pipe::create-pipe-source-call
      - id: micro-behaviors/process/stdio/configure::startupinfo-stdio-handle-fields
      - id: micro-behaviors/fs/read/file/handle::win32-readfile-source-call
      - id: micro-behaviors/process/create/shell/command-mode::windows-command-shell-invocation
  - id: windows-winsock-pipe-cmd-shell-pe
    desc: PE bridges Winsock, pipes, and cmd.exe
    conf: 0.96
    for: [pe, dll]
    size_max: 2097152
    all:
      - id: micro-behaviors/communications/socket/connect/attempt::connect-api
      - id: micro-behaviors/communications/socket/receive::recv-api
      - id: micro-behaviors/communications/socket/send/reference::send-api
      - id: micro-behaviors/communications/ipc/pipe::create-pipe
      - id: micro-behaviors/fs/read/file/handle::read-file
      - id: micro-behaviors/process/create/exec::child-process-execution
      - id: micro-behaviors/process/create/shell/command-mode::windows-command-shell-invocation
    unless:
      - id: metadata/signature/verified/platform::microsoft
