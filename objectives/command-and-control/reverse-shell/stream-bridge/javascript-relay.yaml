defaults:
  platforms:
  - unix
  - windows
  for:
  - javascript
  - typescript
  attack: T1059.007
composite_rules:
- id: js-net-options-bash-reverse-shell
  desc: Node options socket drives Bash through child stdio
  crit: hostile
  conf: 0.99
  mbc: B0030.002
  attack: T1059.004,T1095
  all:
  - id: micro-behaviors/communications/socket/connect::node-net-options-connect
  - id: micro-behaviors/process/create/shell/options-spawn::node-spawn-absolute-bash
  - id: micro-behaviors/process/fd/stdio::node-socket-data-to-stdin-write
  - id: micro-behaviors/process/fd/stdio::node-child-output-to-stream-pipe
  near_bytes: 4096
- id: js-reverse-shell-spawn
  desc: Node socket relays both child standard streams
  crit: hostile
  conf: 0.98
  all:
  - id: micro-behaviors/communications/socket/connect::net-connect
  - id: micro-behaviors/process/fd/stdio::node-duplex-stdio-pipe-pair
  - id: micro-behaviors/process/interpreter/shell::bin-sh
  any:
  - id: metadata/import/builtin::require-child-process
  - id: metadata/import/builtin::child-process-import-runtime
  near_bytes: 4096
- id: js-daemonized-reverse-shell
  desc: Shell relay with detached-child configuration
  crit: hostile
  conf: 0.98
  attack: T1059.007,T1564
  mbc: B0030.002
  all:
  - id: objectives/command-and-control/reverse-shell/stream-bridge::js-reverse-shell-spawn
  - id: micro-behaviors/os/env/config::node-is-child-env-reference
  - id: micro-behaviors/process/create/spawn::detached-true
  - id: micro-behaviors/process/fd/stdio::child-stdio-ignore-option
- id: js-hardcoded-ip-reverse-shell
  desc: Shell relay with external IPv4 literal
  crit: hostile
  conf: 0.98
  attack: T1059.007,T1095
  mbc: B0030.002
  all:
  - id: objectives/command-and-control/reverse-shell/stream-bridge::js-reverse-shell-spawn
  - id: micro-behaviors/communications/ip/literal::external-ipv4-script
- id: npm-postinstall-reverse-shell
  desc: Package declares Node postinstall and shell relay
  crit: hostile
  conf: 0.99
  attack: T1195.002,T1059.007
  mbc: B0030.002,B0024
  platforms:
  - unix
  - windows
  - linux
  for:
  - javascript
  - typescript
  - package.json
  - npm
  - tar
  - alpine_apk
  scope: archive
  all:
  - id: objectives/command-and-control/reverse-shell/stream-bridge::js-reverse-shell-spawn
  - id: metadata/package/scripts/lifecycle::postinstall-runs-node-script
- id: js-fetched-command-reverse-shell
  desc: Command stream relay with an HTTP fetch
  crit: hostile
  conf: 0.99
  mbc: B0030.002
  all:
  - id: micro-behaviors/communications/http/request/client::js-fetch-call
  - id: micro-behaviors/process/create/shell/bridge::js-object-exec-call
  - id: micro-behaviors/communications/socket/connect::node-net-socket-connect
  - id: micro-behaviors/process/fd/stdio::node-duplex-stdio-pipe-pair
  near_bytes: 2048
- id: js-variable-shell-reverse-shell
  desc: Variable-shell JavaScript socket reverse shell
  crit: hostile
  conf: 0.99
  mbc: B0030.002
  attack: T1059.007,T1095
  all:
  - id: micro-behaviors/communications/socket/connect::net-connect
  - id: micro-behaviors/process/create/spawn::child-process-alias-spawn
  - id: micro-behaviors/process/fd/stdio::node-duplex-stdio-pipe-pair
  near_bytes: 4096
  any:
  - id: micro-behaviors/process/create/shell/selection::platform-shell-path-selection
  - id: micro-behaviors/process/create/shell/path::shell-executable-reference
