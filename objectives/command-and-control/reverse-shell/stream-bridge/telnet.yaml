# Relational shell-I/O patterns plus canonical outbound endpoint evidence.
defaults:
  platforms:
  - unix
  - windows
  crit: hostile
  attack: T1059.004
  mbc: B0030.002
composite_rules:
- id: telnet-fifo-shell-relay
  desc: Telnet and shell share a FIFO relay
  conf: 0.99
  for: &id001
  - shell
  unless: &id002
  - id: well-known/tool/detection/llm-scanner/
  all:
  - id: telnet-fifo-shell-relay-structure
  - id: micro-behaviors/communications/socket/telnet::telnet-client-endpoint
- id: telnet-dual-channel-shell-relay
  desc: Shell bridges two Telnet connections
  conf: 0.98
  for: &id003
  - shell
  unless: &id004
  - id: well-known/tool/detection/llm-scanner/
  all:
  - id: telnet-dual-channel-shell-relay-structure
  - id: micro-behaviors/communications/socket/telnet::telnet-client-endpoint
- id: telnet-dual-channel-package-script
  desc: Package script declares a Telnet shell relay
  conf: 0.95
  for: &id005
  - package.json
  unless: &id006
  - id: well-known/tool/detection/llm-scanner/
  all:
  - id: telnet-dual-channel-package-script-structure
  - id: micro-behaviors/communications/socket/telnet::telnet-package-script-endpoint
traits:
- id: telnet-fifo-shell-relay-structure
  desc: Telnet and shell share a FIFO relay
  conf: 0.95
  for: *id001
  unless: *id002
  crit: suspicious
  if:
    type: tree-sitter
    query: |
      ((_ (command name: (command_name (word)) . argument: (_) @created) @creation
      (redirected_statement body: (pipeline . (command name: (command_name (word) @cat) . argument: (_) @input .) . (command name: (command_name (word)) ) @shell . (command name: (command_name (word))) @telnet .) (file_redirect !descriptor ">" destination: (_) @output) .)) @relay
      (#match? @creation "^(/usr/bin/)?(mkfifo[ \t]+[^ \t;]+|mknod[ \t]+[^ \t;]+[ \t]+p)$")
      (#match? @shell "^(/(usr/)?bin/)?(ba|da|z|k)?sh([ \t]+-i)?[ \t]*$")
      (#match? @telnet "^(/usr/bin/)?telnet[ \t]+[^ \t;|<>-][^ \t;|<>]*[ \t]+([0-9]{1,5}|\$[A-Za-z_][A-Za-z0-9_]*)[ \t]*$")
      (#eq? @created @input)
      (#eq? @created @output)
      (#match? @cat "^(/bin/)?cat$")
      )

      ((_ (command name: (command_name (word)) . argument: (_) @created) @creation
      (redirected_statement body: (pipeline . (redirected_statement body: (pipeline . (command name: (command_name (word) @cat) . argument: (_) @input .) . (command name: (command_name (word)) ) @shell .) redirect: (file_redirect descriptor: (file_descriptor) @err ">&" destination: (number) @out)) . (command name: (command_name (word))) @telnet .) (file_redirect !descriptor ">" destination: (_) @output) .)) @relay
      (#match? @creation "^(/usr/bin/)?(mkfifo[ \t]+[^ \t;]+|mknod[ \t]+[^ \t;]+[ \t]+p)$")
      (#match? @shell "^(/(usr/)?bin/)?(ba|da|z|k)?sh([ \t]+-i)?[ \t]*$")
      (#match? @telnet "^(/usr/bin/)?telnet[ \t]+[^ \t;|<>-][^ \t;|<>]*[ \t]+([0-9]{1,5}|\$[A-Za-z_][A-Za-z0-9_]*)[ \t]*$")
      (#eq? @created @input)
      (#eq? @created @output)
      (#match? @cat "^(/bin/)?cat$")
      (#eq? @err "2")
      (#eq? @out "1")
      )

      ((_ (command name: (command_name (word)) . argument: (_) @created) @creation
      (redirected_statement body: (pipeline . (redirected_statement body: (command name: (command_name (word)) ) @shell redirect: (file_redirect !descriptor "<" destination: (_) @input)) . (command name: (command_name (word))) @telnet .) (file_redirect !descriptor ">" destination: (_) @output) .)) @relay
      (#match? @creation "^(/usr/bin/)?(mkfifo[ \t]+[^ \t;]+|mknod[ \t]+[^ \t;]+[ \t]+p)$")
      (#match? @shell "^(/(usr/)?bin/)?(ba|da|z|k)?sh([ \t]+-i)?[ \t]*$")
      (#match? @telnet "^(/usr/bin/)?telnet[ \t]+[^ \t;|<>-][^ \t;|<>]*[ \t]+([0-9]{1,5}|\$[A-Za-z_][A-Za-z0-9_]*)[ \t]*$")
      (#eq? @created @input)
      (#eq? @created @output)
      )

      ((_ (command name: (command_name (word)) . argument: (_) @created) @creation
      (redirected_statement body: (pipeline . (redirected_statement body: (command name: (command_name (word))) @telnet redirect: (file_redirect !descriptor "<" destination: (_) @input)) . (command name: (command_name (word)) ) @shell .) (file_redirect !descriptor ">" destination: (_) @output) .)) @relay
      (#match? @creation "^(/usr/bin/)?(mkfifo[ \t]+[^ \t;]+|mknod[ \t]+[^ \t;]+[ \t]+p)$")
      (#match? @shell "^(/(usr/)?bin/)?(ba|da|z|k)?sh([ \t]+-i)?[ \t]*$")
      (#match? @telnet "^(/usr/bin/)?telnet[ \t]+[^ \t;|<>-][^ \t;|<>]*[ \t]+([0-9]{1,5}|\$[A-Za-z_][A-Za-z0-9_]*)[ \t]*$")
      (#eq? @created @input)
      (#eq? @created @output)
      )
- id: telnet-dual-channel-shell-relay-structure
  desc: Shell bridges two Telnet connections
  conf: 0.95
  for: *id003
  unless: *id004
  crit: suspicious
  if:
    type: tree-sitter
    query: |
      ((pipeline . (command name: (command_name (word))) @inbound . (command name: (command_name (word)) ) @shell . (command name: (command_name (word))) @outbound .) @relay
      (#match? @shell "^(/(usr/)?bin/)?(ba|da|z|k)?sh([ \t]+-i)?[ \t]*$")
      (#match? @inbound "^(/usr/bin/)?telnet[ \t]+[^ \t;|<>-][^ \t;|<>]*[ \t]+([0-9]{1,5}|\$[A-Za-z_][A-Za-z0-9_]*)[ \t]*$")
      (#match? @outbound "^(/usr/bin/)?telnet[ \t]+[^ \t;|<>-][^ \t;|<>]*[ \t]+([0-9]{1,5}|\$[A-Za-z_][A-Za-z0-9_]*)[ \t]*$")
      )
- id: telnet-dual-channel-package-script-structure
  desc: Package script declares a Telnet shell relay
  conf: 0.95
  for: *id005
  unless: *id006
  crit: suspicious
  if:
    type: value
    path: scripts.*
    regex: \btelnet\s+\S+\s+\d+\s*\|\s*(/bin/)?(ba)?sh\s*(-i\s*)?\|\s*telnet\s+\S+\s+\d+\b
