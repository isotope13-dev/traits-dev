defaults:
  for: [php]
  platforms: [linux, macos, windows]
  attack: T1059
  mbc: B0030.002
composite_rules:
  - id: php-socket-process-pipe-relay
    desc: PHP shell relays socket and pipes
    crit: hostile
    conf: 0.99
    all:
      - id: micro-behaviors/communications/socket/connect/attempt::fsockopen-call
      - id: micro-behaviors/data/stream/transfer::php-read-to-index-zero-stream
      - id: micro-behaviors/data/stream/transfer::php-index-one-two-read-to-stream
    any:
      - id: micro-behaviors/process/create/shell/command-string::proc-open-shell-command
      - id: micro-behaviors/process/create/shell/interactive::php-proc-open-interactive-shell
    needs: 1
    near_bytes: 4096
    unless:
      - id: well-known/tool/detection/llm-scanner::llm-scanner-context
  - id: php-windows-socket-process-pipe-relay
    desc: PHP bridges cmd session and connected socket
    crit: hostile
    conf: 0.99
    platforms: [windows]
    all:
      - id: micro-behaviors/process/create/shell/interactive::php-proc-open-cmd-session
      - id: micro-behaviors/process/stdio/relay::php-socket-process-duplex-relay
