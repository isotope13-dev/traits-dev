defaults:
  for: [php]
  platforms: [linux, macos, windows]
  attack: T1059
  mbc: B0030.002
composite_rules:
  - id: php-socket-process-pipe-relay
    desc: PHP shell relays socket and pipes
    crit: hostile
    conf: 0.99
    all:
      - id: micro-behaviors/communications/socket/connect::fsockopen-call
      - id: micro-behaviors/process/fd/stdio::php-resource-read-stdin-pipe-write
      - id: micro-behaviors/process/fd/stdio::php-output-pipe-read-resource-write
    any:
      - id: micro-behaviors/process/create/shell/lang::proc-open-shell-command
      - id: micro-behaviors/process/create/shell/native::php-interactive-shell-command
    needs: 1
    near_bytes: 4096
    unless:
      - id: well-known/tool/detection/llm-scanner/
