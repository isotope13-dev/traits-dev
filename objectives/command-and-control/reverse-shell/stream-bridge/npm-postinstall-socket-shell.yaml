defaults:
  platforms: [unix, windows]
  attack: T1195.002,T1059.004,T1095

composite_rules:
  - id: node-ngrok-tcp-callback-shell
    desc: Node socket reverse shell connects through ngrok TCP
    crit: hostile
    conf: 0.99
    for: [javascript, typescript]
    scope: file
    all:
      - id: node-socket-callback-shell-bridge
      - id: objectives/command-and-control/infrastructure/domain/tunnel::ngrok-tcp-source-endpoint

  - id: npm-postinstall-socket-callback-shell
    desc: npm postinstall package contains socket reverse shell
    crit: hostile
    conf: 0.99
    for: [zip, npm, tar, javascript, typescript, package.json]
    scope: archive
    all:
      - id: node-socket-callback-shell-bridge
      - id: metadata/package/scripts/lifecycle::postinstall-hook-declaration
