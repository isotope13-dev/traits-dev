# Java reverse shell: socket streams copied to and from a shell process.
defaults:
  for: [java, jsp]
  platforms: [linux, macos, windows]
  attack: T1059
  mbc: B0030.002
composite_rules:
  - id: jsp-java-socket-shell-stream-bridge
    for: [jsp]
    desc: JSP connects a shell process to socket input and output streams
    crit: hostile
    conf: 0.99
    all:
      - id: micro-behaviors/communications/socket/create::java-socket-create
      - id: micro-behaviors/fs/path/application/interpreter::source-command-shell-reference
      - id: micro-behaviors/data/stream/read::jsp-multiple-input-stream-access-source
      - id: micro-behaviors/data/stream/write::jsp-multiple-output-stream-access-source
    any:
      - id: micro-behaviors/process/create/subprocess/launch::java-runtime-exec-source
      - id: metadata/lang/source/syntax/call/construction::java-processbuilder-source
      - id: micro-behaviors/process/create/subprocess/launch::java-runtime-variable-exec-source
    needs: 1
  - id: jsp-java-bind-shell-stream-bridge
    for: [jsp]
    desc: JSP accepts a socket connection and bridges it to a shell process
    crit: hostile
    conf: 0.99
    all:
      - id: micro-behaviors/communications/socket/accept::java-server-socket-accept-context
      - id: micro-behaviors/fs/path/application/interpreter::source-command-shell-reference
      - id: micro-behaviors/data/stream/read::jsp-multiple-input-stream-access-source
      - id: micro-behaviors/data/stream/write::jsp-multiple-output-stream-access-source
      - id: micro-behaviors/process/create/subprocess/launch::java-runtime-exec-source
  - id: java-revshell
    desc: Java shell with socket streams copied both ways
    crit: hostile
    conf: 0.99
    all:
      - id: micro-behaviors/communications/socket/connect/endpoint::new-socket-host-port
      - id: micro-behaviors/process/create/shell/interpreter::java-runtime-exec-shell-array
      - id: micro-behaviors/data/stream/transfer::java-stream-transfer-to
      - id: micro-behaviors/data/stream/read::java-input-stream-access
      - id: micro-behaviors/data/stream/write::java-output-stream-access
    unless:
      - id: well-known/tool/detection/llm-scanner::llm-scanner-context
  # Compiled form of java-revshell: the class constructs a Socket, opens both
  # of its streams, starts a shell and opens both of the child's stdio streams.
  # Requiring all four stream accessors and a literal shell path keeps network
  # clients that merely run a helper process out.
  - id: jvm-bytecode-socket-shell-stream-bridge
    for: [class]
    desc: Java class bridges socket and shell stdio
    crit: hostile
    conf: 0.95
    all:
      - id: micro-behaviors/communications/socket/create::jvm-socket-constructor-reference
      - id: metadata/import/jvm::socket-input-stream-reference
      - id: metadata/import/jvm::socket-output-stream-reference
      - id: micro-behaviors/process/stdio/read::jvm-process-input-stream
      - id: metadata/import/jvm::jvm-process-stdin-method-reference
      - id: micro-behaviors/fs/path/application/interpreter::jvm-command-shell-path
    any:
      - id: metadata/import/jvm::java-runtime-exec-bytecode-reference
      - id: metadata/import/jvm::java-processbuilder-start-bytecode-reference
