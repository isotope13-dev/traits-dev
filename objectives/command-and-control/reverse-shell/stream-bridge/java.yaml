# Java reverse shell: socket streams copied to and from a shell process.
defaults:
  for: [java]
  platforms: [linux, macos, windows]
  attack: T1059
  mbc: B0030.002
composite_rules:
  - id: java-revshell
    desc: Java shell with socket streams copied both ways
    crit: hostile
    conf: 0.99
    all:
      - id: micro-behaviors/communications/socket/connect::new-socket-host-port
      - id: micro-behaviors/process/create/shell/spawn::java-runtime-exec-shell-array
      - id: micro-behaviors/process/io/stream::java-stream-transfer-to
      - id: micro-behaviors/process/io/stream::java-input-stream-access
      - id: micro-behaviors/process/io/stream::java-output-stream-access
    unless:
      - id: well-known/tool/detection/llm-scanner/
