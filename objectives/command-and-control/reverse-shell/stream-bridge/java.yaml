# Java reverse shell: socket streams copied to and from a shell process.
defaults:
  for: [java, jsp]
  platforms: [linux, macos, windows]
  attack: T1059
  mbc: B0030.002
composite_rules:
  - id: jsp-java-socket-shell-stream-bridge
    for: [jsp]
    desc: JSP connects a shell process to socket input and output streams
    crit: hostile
    conf: 0.99
    all:
      - id: micro-behaviors/communications/socket/create::java-socket-create
      - id: micro-behaviors/process/create/shell/selection::java-shell-executable-path-source
      - id: micro-behaviors/process/io/stream::jsp-process-stream-input-access-source
      - id: micro-behaviors/process/io/stream::jsp-process-stream-output-access-source
    any:
      - id: micro-behaviors/process/create/exec::java-runtime-exec-source
      - id: micro-behaviors/process/create/spawn::java-processbuilder-source
    needs: 1
  - id: jsp-java-bind-shell-stream-bridge
    for: [jsp]
    desc: JSP accepts a socket connection and bridges it to a shell process
    crit: hostile
    conf: 0.99
    all:
      - id: micro-behaviors/communications/socket/create::java-serversocket-create
      - id: micro-behaviors/communications/socket/create::java-socket-accept-source
      - id: micro-behaviors/process/create/shell/selection::java-shell-executable-path-source
      - id: micro-behaviors/process/io/stream::jsp-process-stream-input-access-source
      - id: micro-behaviors/process/io/stream::jsp-process-stream-output-access-source
      - id: micro-behaviors/process/create/exec::java-runtime-exec-source
  - id: java-revshell
    desc: Java shell with socket streams copied both ways
    crit: hostile
    conf: 0.99
    all:
      - id: micro-behaviors/communications/socket/connect::new-socket-host-port
      - id: micro-behaviors/process/create/shell/spawn::java-runtime-exec-shell-array
      - id: micro-behaviors/process/io/stream::java-stream-transfer-to
      - id: micro-behaviors/process/io/stream::java-input-stream-access
      - id: micro-behaviors/process/io/stream::java-output-stream-access
    unless:
      - id: well-known/tool/detection/llm-scanner/
