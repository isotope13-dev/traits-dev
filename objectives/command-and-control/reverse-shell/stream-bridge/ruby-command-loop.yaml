defaults:
  for: [ruby]
  platforms: [unix, windows]

composite_rules:
  - id: ruby-outbound-open3-command-shell
    desc: Outbound TCP client executes received commands and returns output
    crit: hostile
    conf: 0.98
    attack: T1059.004
    all:
      - id: micro-behaviors/communications/socket/connect::ruby-socket-connect
      - id: objectives/command-and-control/remote-command/dispatch/command::ruby-socket-open3-command-shell
