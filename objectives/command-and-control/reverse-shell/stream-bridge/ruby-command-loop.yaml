defaults:
  platforms: [unix, windows]
  for: [ruby, shell]
  attack: T1059.006,T1071

traits:
  - id: ruby-socket-command-loop
    desc: Ruby reads socket lines as commands
    crit: notable
    if:
      type: text
      regex: '(?i)while\s*\(?[^)]{0,80}\.gets\s*\)?\s*(;|do|\n)\s*IO\.popen\s*\('
  - id: ruby-socket-command-output
    desc: Ruby returns command output over socket
    crit: notable
    if:
      type: text
      regex: '(?is)IO\.popen\s*\([^)]{0,40}\)\s*(\{|do)[^\n]{0,40}\.print\s+\w+\.read'
  - id: ruby-tcp-socket-constructor
    desc: Ruby creates an outbound TCP socket
    crit: component
    if:
      type: text
      regex: '\bTCPSocket\.(new|open)\s*\('

composite_rules:
  - id: ruby-socket-command-loop-backdoor
    desc: Ruby TCP loop executes remote commands
    crit: hostile
    conf: 0.98
    all:
      - id: ruby-socket-command-loop
      - id: ruby-socket-command-output
      - id: ruby-tcp-socket-constructor
  - id: ruby-daemonized-reverse-shell
    for: [ruby]
    desc: Ruby reverse shell with fork-detached daemonization
    crit: hostile
    conf: 0.99
    attack: T1059.006,T1564
    mbc: B0030.002
    all:
      - id: ruby-socket-command-loop-backdoor
      - id: micro-behaviors/process/daemonize/detach::ruby-fork-exit-detach
  - id: ruby-system-socket-reverse-shell
    for: [ruby]
    desc: Ruby executes inline socket reverse shell
    crit: hostile
    conf: 0.98
    mbc: B0030.002
    all:
      - id: micro-behaviors/process/create/exec::system-process-call
      - id: ruby-socket-command-loop-backdoor
