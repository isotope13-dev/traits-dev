defaults:
  for: [swift]
  platforms: [macos, ios]
  attack: T1059
  mbc: B0030.002
traits:
  - id: swift-pipe-handle-wires-stdio
    desc: Swift FileHandle wires Process stdio
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: 'standard(Input|Output|Error)\s*=\s*stdin|standardError\s*=\s*stdout'
composite_rules:
  - id: swift-nwconnection-shell-stream-bridge
    desc: Swift NWConnection bridges shell process streams
    crit: hostile
    conf: 0.99
    all:
      - id: micro-behaviors/communications/socket/connect::nwconnection-connect-source
      - id: micro-behaviors/communications/socket/state-connect::nwconnection-start-source
      - id: micro-behaviors/communications/socket/send::nwconnection-send-source
      - id: micro-behaviors/communications/socket/receive::nwconnection-receive-source
      - id: micro-behaviors/process/create/shell/launch::swift-process-launchpath-bin-sh
      - id: swift-pipe-handle-wires-stdio
    near_bytes: 4096
    unless:
      - id: well-known/tool/detection/llm-scanner/
