defaults:
  for: [swift]
  platforms: [macos, ios]
  attack: T1059
  mbc: B0030.002
traits:
composite_rules:
  - id: swift-nwconnection-shell-stream-bridge
    desc: Swift NWConnection bridges shell process streams
    crit: hostile
    conf: 0.99
    all:
      - id: micro-behaviors/communications/socket/connect/attempt::nwconnection-connect-source
      - id: metadata/lang/source/syntax/call/member::swift-queued-start-call-text
      - id: micro-behaviors/communications/socket/send/message::nwconnection-send-source
      - id: micro-behaviors/communications/socket/receive::nwconnection-receive-source
      - id: micro-behaviors/process/create/subprocess/configure::swift-shell-launchpath-text
      - id: micro-behaviors/process/stdio/relay::swift-pipe-handle-wires-stdio
    near_bytes: 4096
    unless:
      - id: well-known/tool/detection/llm-scanner::llm-scanner-context
