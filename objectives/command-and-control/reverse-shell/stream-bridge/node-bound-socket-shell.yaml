defaults:
  platforms: [unix]
  for: [javascript]
traits:
  - id: node-bound-net-socket-shell-relay
    desc: Node socket callback relays shell streams
    crit: hostile
    conf: 0.99
    attack: T1059.004,T1095
    if:
      type: tree-sitter
      language: javascript
      query: |
        ((program
          (variable_declaration (variable_declarator name: (identifier) @net
            value: (call_expression function: (identifier) @require_net
              arguments: (arguments . (string (string_fragment) @net_module) .))))
          (variable_declaration (variable_declarator name: (identifier) @spawn
            value: (member_expression object: (call_expression function: (identifier) @require_child
              arguments: (arguments . (string (string_fragment) @child_module) .))
              property: (property_identifier) @spawn_property)))
          (function_declaration body: (statement_block
            (variable_declaration (variable_declarator name: (identifier) @socket
              value: (new_expression constructor: (member_expression
                object: (identifier) @net_use property: (property_identifier) @socket_ctor))))
            (expression_statement (call_expression function: (member_expression
              object: (identifier) @connected property: (property_identifier) @connect)
              arguments: (arguments [(identifier) (number)] [(identifier) (string)] (function_expression body: (statement_block
                (variable_declaration (variable_declarator name: (identifier) @child
                  value: (call_expression function: (identifier) @spawn_use
                    arguments: (arguments . (string (string_fragment) @shell) . (_)))))
                (expression_statement (call_expression function: (member_expression
                  object: (identifier) @peer_in property: (property_identifier) @pipe_in)
                  arguments: (arguments . (member_expression object: (identifier) @child_in
                    property: (property_identifier) @stdin) .)))
                (expression_statement (call_expression function: (member_expression
                  object: (member_expression object: (identifier) @child_out property: (property_identifier) @stdout)
                  property: (property_identifier) @pipe_out)
                  arguments: (arguments . (identifier) @peer_out .)))))))))))
          (#eq? @require_net "require") (#eq? @net_module "net")
          (#eq? @require_child "require") (#match? @child_module "^(node:)?child_process$")
          (#eq? @spawn_property "spawn") (#eq? @spawn @spawn_use)
          (#eq? @net @net_use) (#eq? @socket_ctor "Socket") (#eq? @connect "connect")
          (#eq? @socket @connected) (#eq? @socket @peer_in) (#eq? @socket @peer_out)
          (#eq? @child @child_in) (#eq? @child @child_out)
          (#eq? @stdin "stdin") (#match? @stdout "^(stdout|stderr)$")
          (#eq? @pipe_in "pipe") (#eq? @pipe_out "pipe")
          (#match? @shell "^(/usr)?/bin/(ba|z)?sh$"))
