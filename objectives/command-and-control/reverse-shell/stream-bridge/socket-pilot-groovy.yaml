# Canonical placement from the socket-shell cohort audit.
defaults:
  for:
  - groovy
  platforms:
  - linux
  - macos
  - windows
  crit: hostile
  conf: 0.99
  attack: T1059
  mbc: B0030.002
composite_rules:
- id: groovy-revshell
  desc: Bridges a socket to shell streams
  all:
  - id: micro-behaviors/communications/socket/connect::new-socket-host-port
  - id: micro-behaviors/process/create/shell/selection::groovy-list-shell-execute
  - id: micro-behaviors/process/io/stream::groovy-consume-process-output-socket
  - id: micro-behaviors/process/io/stream::groovy-input-to-child-stream
  unless:
  - id: well-known/tool/detection/llm-scanner/
