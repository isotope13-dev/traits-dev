defaults:
  platforms: [unix]
  for: [javascript]
  attack: T1059.004,T1071.001

traits:
  - id: node-net-socket-connect
    desc: Connects Node socket to target
    crit: notable
    if:
      type: text
      regex: '\bclient\.connect\(targetPort,\s*targetIP'
  - id: node-exec-shell-command
    desc: Starts a Unix command shell
    crit: notable
    if:
      type: text
      regex: 'exec\(([''"]/bin/(ba)?sh[''"]|shell)\s*,'
  - id: node-shell-stdout-to-socket
    desc: Pipes shell output to socket
    crit: notable
    if:
      type: text
      substr: 'sh.stdout.pipe(client)'
  - id: node-socket-to-shell-stdin
    desc: Pipes socket to shell input
    crit: notable
    if:
      type: text
      substr: 'client.pipe(sh.stdin)'

composite_rules:
  - id: node-net-shell-stream-bridge
    desc: Connects socket to interactive shell streams
    crit: hostile
    conf: 0.99
    scope: file
    all:
      - id: node-net-socket-connect
      - id: node-exec-shell-command
      - id: node-shell-stdout-to-socket
      - id: node-socket-to-shell-stdin
