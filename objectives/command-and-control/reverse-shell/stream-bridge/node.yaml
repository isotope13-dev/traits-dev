defaults:
  platforms:
  - linux
  - macos
  - windows
  for:
  - javascript
  - typescript
  attack: T1059
composite_rules:
- id: cmd-shell-rfc1918-bridge
  desc: Node cmd shell bridged to private endpoint
  crit: hostile
  conf: 0.95
  all:
  - id: micro-behaviors/fs/path/application/executable::cmd-exe-image-name
  - id: micro-behaviors/communications/ip/literal::rfc1918-host-string
  any:
  - id: objectives/command-and-control/reverse-shell/stream-bridge::node-net-connect-shell-pipe-bridge
  - id: objectives/command-and-control/reverse-shell/stream-bridge::node-bash-socket-port-reverse-shell
  - id: objectives/command-and-control/reverse-shell/stream-bridge::node-dynamic-import-reverse-shell
- id: node-bash-socket-port-reverse-shell
  desc: Node bash spawn with Socket.connect port and host
  crit: hostile
  conf: 0.97
  mbc: B0030.002
  all:
  - id: micro-behaviors/process/create/shell/spawn::node-spawn-bash-shell
  - id: micro-behaviors/communications/socket/connect::socket-connect-port-host
  - id: micro-behaviors/communications/socket/create::net-socket-connect-method
  - id: micro-behaviors/data/parse/vocabulary::reverse-shell-terminology
  unless:
  - id: well-known/tool/detection/llm-scanner/
- id: node-dynamic-import-reverse-shell
  desc: Node dynamically imported command shell bridged to socket
  crit: hostile
  conf: 0.99
  mbc: B0030.002
  attack: T1059.007
  all:
  - id: micro-behaviors/os/module/load::js-computed-import
  - id: micro-behaviors/process/create/shell/bridge::js-object-exec-call
  - id: micro-behaviors/communications/socket/connect::node-net-socket-connect
  - id: micro-behaviors/process/fd/stdio::node-duplex-stdio-pipe-pair
  near_bytes: 2048
  unless:
  - id: well-known/tool/detection/llm-scanner/
- id: node-net-connect-shell-pipe-bridge
  desc: Node shell relays input and output streams
  crit: hostile
  conf: 0.99
  mbc: B0030.002
  all:
  - id: micro-behaviors/communications/socket/connect::net-connect-port
  - id: micro-behaviors/process/interpreter/shell::bin-sh
  - id: micro-behaviors/process/fd/stdio::node-duplex-stdio-pipe-pair
  any:
  - id: micro-behaviors/process/create/shell/bridge/
  - id: micro-behaviors/process/create/exec::exec-api-call
  unless:
  - id: well-known/tool/detection/llm-scanner/
  near_bytes: 4096
