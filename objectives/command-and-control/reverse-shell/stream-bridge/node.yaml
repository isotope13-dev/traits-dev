defaults:
  platforms:
  - linux
  - macos
  - windows
  for:
  - javascript
  - typescript
  attack: T1059
composite_rules:
- id: cmd-shell-rfc1918-bridge
  desc: Node cmd shell bridged to private endpoint
  crit: hostile
  conf: 0.95
  all:
  - id: micro-behaviors/fs/path/application/interpreter::cmd-exe-image-name
  - id: micro-behaviors/communications/ip/literal::rfc1918-host-string
  any:
  - id: objectives/command-and-control/reverse-shell/stream-bridge::node-net-connect-shell-pipe-bridge
  - id: node-socket-callback-shell-bridge
  - id: objectives/command-and-control/reverse-shell/stream-bridge::node-bash-socket-port-reverse-shell
  - id: objectives/command-and-control/reverse-shell/stream-bridge::node-dynamic-import-reverse-shell
- id: node-bash-socket-port-reverse-shell
  desc: Node bash spawn with Socket.connect port and host
  crit: hostile
  conf: 0.97
  mbc: B0030.002
  all:
  - id: micro-behaviors/process/create/shell/spawn::node-spawn-bash-shell
  - id: metadata/file/profile/socket-api::socket-connect-port-host
  - id: micro-behaviors/communications/socket/create::net-socket-connect-method
  - id: micro-behaviors/data/parse/vocabulary::reverse-shell-terminology
  unless:
  - id: well-known/tool/detection/llm-scanner/
- id: node-dynamic-import-reverse-shell
  desc: Node dynamically imported command shell bridged to socket
  crit: hostile
  conf: 0.99
  mbc: B0030.002
  attack: T1059.007
  all:
  - id: micro-behaviors/os/module/load/name::js-computed-import
  - id: micro-behaviors/process/create/shell/command-string::js-object-exec-call
  - id: micro-behaviors/communications/socket/connect/tcp::node-net-socket-connect
  - id: micro-behaviors/process/stdio/relay::node-duplex-stdio-pipe-pair
  near_bytes: 2048
  unless:
  - id: well-known/tool/detection/llm-scanner/
- id: node-net-connect-shell-pipe-bridge
  desc: Node shell relays input and output streams
  crit: hostile
  conf: 0.99
  mbc: B0030.002
  all:
  - id: micro-behaviors/communications/socket/connect/endpoint::net-connect-port
  - id: micro-behaviors/fs/path/application/interpreter::unix-shell-executable-path
  - id: micro-behaviors/process/stdio/relay::node-duplex-stdio-pipe-pair
  any:
  - id: metadata/file/profile/operation-reference::command-wrapper-reference
  - id: micro-behaviors/process/create/exec::js-child-process
  unless:
  - id: well-known/tool/detection/llm-scanner/
  near_bytes: 4096

- id: node-socket-callback-shell-bridge
  desc: Socket connection callback relays command-shell streams
  crit: hostile
  conf: 0.98
  mbc: B0030.002
  all:
  - id: micro-behaviors/process/stdio/relay::node-socket-connect-callback-stdio
  - id: micro-behaviors/fs/path/application/interpreter::source-command-shell-reference
  - id: metadata/import/builtin::require-child-process
  any:
  - id: metadata/file/profile/operation-reference::command-wrapper-reference
  - id: micro-behaviors/process/create/exec::js-child-process
  near_bytes: 4096

- id: node-event-callback-shell-bridge
  desc: Socket events bridge command-shell input and output
  crit: hostile
  conf: 0.98
  mbc: B0030.002
  all:
  - id: micro-behaviors/communications/socket/connect/tcp::node-net-socket-connect
  - id: micro-behaviors/process/create/shell/spawn::node-spawn-command-shell
  - id: micro-behaviors/process/stdio/write::node-data-handler-stdin-write
  - id: micro-behaviors/process/stdio/relay::child-output-callback-relays-data
  - id: metadata/import/builtin::require-child-process
