# A socket, a child shell with redirected stdin, and bytes moved between
# their streams -- by an explicit Write loop or by paired CopyToAsync calls
# (Vinci RAT, eSentire 2026-11: TcpClient(host, port) and cmd.exe /K).
# Text legs also match a shell embedded as a quoted script; that still ships
# the bridge.
defaults:
  platforms: [windows]
  for: [powershell]
  attack: T1059.003

composite_rules:
  - id: powershell-tcpclient-shell-stream-bridge
    desc: PowerShell bridges a socket stream to a shell process
    crit: hostile
    conf: 0.97
    near_bytes: 4096
    all:
      - id: micro-behaviors/communications/socket
      - id: micro-behaviors/process/stdio/configure::powershell-redirect-standard-input
      - id: micro-behaviors/data/stream/write::powershell-stream-relay-write
    any:
      - id: micro-behaviors/os/env/runtime::comspec-env-var
      - id: micro-behaviors/fs/path/application/interpreter::cmd-exe-image-name
