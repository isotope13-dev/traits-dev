# A PowerShell reverse shell bridges a TCP client stream to a spawned
# shell process: the socket connects out to a listener, then the shell's
# redirected stdin is pumped over that stream (stdout follows in the same
# StartInfo block). The atoms are neutral micro-behaviors; the bridged
# combination has no legitimate administration form. HTML is in scope
# because offensive modules are routinely collected as rendered GitHub
# blob pages embedding the source.
defaults:
  platforms: [windows]
  for: [powershell, html]
  attack: T1059.001,T1071.001

composite_rules:
  - id: powershell-tcpclient-shell-stream-bridge
    desc: PowerShell bridges TCP stream to shell process
    crit: hostile
    conf: 0.97
    near_bytes: 4096
    all:
      - id: micro-behaviors/communications/socket/create::powershell-tcpclient-connect-call
      - id: micro-behaviors/process/fd/stdio::powershell-redirect-standard-input
