# Require a parsed constructor command: quoted payload templates do not run.
defaults:
  platforms: [windows]
  for: [powershell]
  attack: T1059.003

composite_rules:
  - id: powershell-tcpclient-shell-stream-bridge
    desc: PowerShell bridges TCP stream to shell process
    crit: hostile
    conf: 0.97
    near_bytes: 4096
    all:
      - id: micro-behaviors/communications/socket/create::powershell-tcpclient-construction-call
      - id: micro-behaviors/communications/socket/create::powershell-tcpclient-connect-call
      - id: micro-behaviors/process/fd/stdio::powershell-redirect-standard-input
      - id: micro-behaviors/process/io/stream::powershell-encoded-buffer-stream-write
    any:
      - id: micro-behaviors/os/env/runtime::comspec-env-var
      - id: micro-behaviors/fs/path/application/executable::cmd-exe-image-name
