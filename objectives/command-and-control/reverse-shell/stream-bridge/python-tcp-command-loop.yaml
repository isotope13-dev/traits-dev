defaults:
  for: [python]
  platforms: [unix, windows]
  attack: T1059,T1071

traits:
  - id: python-tcp-shell-command-output-loop
    desc: TCP commands execute and return shell output
    crit: hostile
    conf: 0.99
    if:
      type: tree-sitter
      query: |
        ((module
          (import_from_statement module_name: (dotted_name) @subprocess name: (dotted_name (identifier) @runimport))
          (while_statement body: (block (with_statement body: (block
            (expression_statement (assignment left: (identifier) @socket1 right: (call function: (identifier) @constructor)))
            (expression_statement (call function: (attribute object: (identifier) @socket2 attribute: (identifier) @connect)))
            (expression_statement (call function: (attribute object: (identifier) @socket3 attribute: (identifier) @send)
              arguments: (argument_list (identifier) @data1)))
            (expression_statement (assignment left: (identifier) @command right: (call
              function: (attribute object: (call function: (attribute object: (identifier) @socket4 attribute: (identifier) @recv))
                attribute: (identifier) @decode))))
            (expression_statement (assignment left: (identifier) @process right: (call
              function: (identifier) @run arguments: (argument_list (identifier) @command2
                (keyword_argument name: (identifier) @shell value: (true))))))
            (expression_statement (assignment left: (identifier) @data2 right: (boolean_operator
              left: (boolean_operator left: (attribute object: (identifier) @process2 attribute: (identifier) @stdout)
                right: (attribute object: (identifier) @process3 attribute: (identifier) @stderr)))))
            (expression_statement (call function: (attribute object: (identifier) @socket5 attribute: (identifier) @close))))))))
          (#eq? @subprocess "subprocess") (#eq? @runimport "run") (#eq? @run @runimport) (#eq? @shell "shell")
          (#eq? @constructor "socket") (#eq? @connect "connect") (#eq? @send "send") (#eq? @recv "recv")
          (#eq? @decode "decode") (#eq? @close "close") (#eq? @data1 @data2) (#eq? @command @command2)
          (#eq? @process @process2) (#eq? @process @process3) (#eq? @stdout "stdout") (#eq? @stderr "stderr")
          (#eq? @socket1 @socket2) (#eq? @socket1 @socket3) (#eq? @socket1 @socket4) (#eq? @socket1 @socket5))

  - id: python-tcp-shell-chunked-output-loop
    desc: TCP commands execute and return shell output
    crit: hostile
    conf: 0.99
    if:
      type: tree-sitter
      query: |
        ((module
          (import_from_statement module_name: (dotted_name) @subprocess name: (dotted_name (identifier) @runimport))
          (function_definition name: (identifier) @senddef parameters: (parameters (identifier) @senddata)
            body: (block (expression_statement (assignment left: (identifier) @chunk
              right: (subscript value: (identifier) @senddata2)))
              (while_statement body: (block (expression_statement (call
                function: (attribute object: (identifier) @socket3 attribute: (identifier) @sendall)
                arguments: (argument_list (identifier) @chunk2)))))))
          (while_statement body: (block (with_statement body: (block
            (expression_statement (assignment left: (identifier) @socket1 right: (call function: (identifier) @constructor)))
            (expression_statement (call function: (attribute object: (identifier) @socket2 attribute: (identifier) @connect)))
            (expression_statement (call function: (identifier) @sendhelper
              arguments: (argument_list (identifier) @data1)))
            (expression_statement (assignment left: (identifier) @command right: (call
              function: (attribute object: (call function: (attribute object: (identifier) @socket4 attribute: (identifier) @recv))
                attribute: (identifier) @decode))))
            (expression_statement (assignment left: (identifier) @process right: (call
              function: (identifier) @run arguments: (argument_list (identifier) @command2
                (keyword_argument name: (identifier) @shell value: (true))))))
            (expression_statement (assignment left: (identifier) @data2 right: (boolean_operator
              left: (boolean_operator left: (attribute object: (identifier) @process2 attribute: (identifier) @stdout)
                right: (attribute object: (identifier) @process3 attribute: (identifier) @stderr)))))
            (expression_statement (call function: (attribute object: (identifier) @socket5 attribute: (identifier) @close))))))))
          (#eq? @subprocess "subprocess") (#eq? @runimport "run") (#eq? @run @runimport) (#eq? @shell "shell")
          (#eq? @constructor "socket") (#eq? @connect "connect") (#eq? @sendall "sendall") (#eq? @recv "recv")
          (#eq? @sendhelper @senddef) (#eq? @senddata @senddata2) (#eq? @chunk @chunk2)
          (#eq? @decode "decode") (#eq? @close "close") (#eq? @data1 @data2) (#eq? @command @command2)
          (#eq? @process @process2) (#eq? @process @process3) (#eq? @stdout "stdout") (#eq? @stderr "stderr")
          (#eq? @socket1 @socket2) (#eq? @socket1 @socket3) (#eq? @socket1 @socket4) (#eq? @socket1 @socket5))
