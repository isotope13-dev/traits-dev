# Native Windows PE implants that dial out and bridge a spawned child's stdio
# through anonymous pipes, encrypting the relay with the ChaCha20 stream
# cipher, share the import surface of legitimate network tools; the hostile
# signal is the outbound Winsock lifecycle plus pipe-backed process creation
# alongside the ChaCha state constant. This mirrors the OpenSSL variant of
# the same relay shape.
defaults:
  platforms: [windows]
  for: [pe]
  arch: [x86-64]
  attack: T1059.003
  mbc: B0030.002

composite_rules:
  - id: chacha-pipe-shell-reverse-shell-pe
    desc: ChaCha20 client bridges pipes to a spawned shell
    crit: hostile
    conf: 0.96
    all:
      - id: micro-behaviors/communications/socket/connect::connect-api
      - id: micro-behaviors/communications/socket/init::wsa-startup
      - id: micro-behaviors/crypto/symmetric/stream/chacha::chacha-salsa-constant
      - id: micro-behaviors/communications/ipc/pipe::pipe-io-redirect
      - id: micro-behaviors/process/create/exec::create-process-a
    unless:
      - id: metadata/signed/platform/
