# Kotlin reverse shell: Socket + ProcessBuilder("/bin/sh","-i") + stream copying.
defaults:
  for: [kotlin]
  platforms: [linux, macos, windows]
  attack: T1059
  mbc: B0030.002
traits:
  - id: kotlin-socket-host-port
    desc: Kotlin Socket constructor with host literal
    crit: notable
    conf: 0.92
    if:
      type: text
      regex: 'Socket\s*\(\s*"[^"]{1,80}"\s*,\s*\d{2,5}\s*\)'
  - id: kotlin-socket-to-process-copy
    desc: Kotlin copies socket input to process output
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '\w+\.getInputStream\(\)\.copyTo\(\w+\.outputStream\)'
  - id: kotlin-process-to-socket-copy
    desc: Kotlin copies process input to socket output
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '\w+\.inputStream\.copyTo\(\w+\.getOutputStream\(\)\)'
composite_rules:
  - id: kotlin-revshell
    desc: Kotlin reverse shell (Socket + ProcessBuilder shell + stream copy bridge)
    crit: hostile
    conf: 0.99
    all:
      - id: kotlin-socket-host-port
      - id: micro-behaviors/process/create/shell/spawn::kotlin-processbuilder-shell
      - id: kotlin-socket-to-process-copy
      - id: kotlin-process-to-socket-copy
    unless:
      - id: well-known/tool/detection/llm-scanner/
