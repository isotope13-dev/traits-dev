# Go socket streams explicitly bridge to a spawned shell process.
defaults:
  crit: hostile
  platforms: [linux, macos, windows]
  for: [go]
  attack: T1059
  mbc: B0030.002
composite_rules:
  - id: go-revshell
    desc: Go reverse shell bridges socket and process streams
    conf: 0.99
    all:
      - id: metadata/lang/source/syntax/call/construction::go-exec-command-bin-sh
      - id: micro-behaviors/process/stdio/configure::process-stdin-assignment
    any:
      - id: micro-behaviors/communications/socket/connect/endpoint::go-net-dial-literal-endpoint
      - id: micro-behaviors/communications/socket/dial::go-dial-methods
    unless:
      - id: well-known/tool/detection/llm-scanner::llm-scanner-context
      - id: metadata/package/testing/presence/harness::go-test-file
