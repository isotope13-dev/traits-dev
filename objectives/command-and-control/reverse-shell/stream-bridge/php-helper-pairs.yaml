# Bind a selected shell property, fsockopen result and proc_open pipe array
# in one class. Both helper directions use the same peer and pipe array.
# The helper implementation is opaque to this rule, so retain suspicious
# criticality rather than claiming proven read/write transfer.
defaults:
  platforms:
  - unix
  - windows
  for:
  - php
traits:
- id: php-connected-shell-helper-relay
  desc: PHP connects shell pipes through helper calls
  crit: suspicious
  conf: 0.9
  if:
    type: tree-sitter
    query: |
      ((class_declaration body: (declaration_list (method_declaration body: (compound_statement
       (if_statement body: (compound_statement
       (expression_statement (assignment_expression
       left: (member_access_expression object: (variable_name) @select_receiver name: (name) @shell_property)
       right: (string) @shell))))))(method_declaration body: (compound_statement (if_statement body: (compound_statement (expression_statement (assignment_expression left: (variable_name) @peer
       right: (error_suppression_expression (function_call_expression function: (name) @connect))))(if_statement alternative: (else_clause body: (compound_statement (expression_statement (assignment_expression
       right: (error_suppression_expression (function_call_expression
       function: (name) @spawn arguments: (arguments . (argument (member_access_expression object: (variable_name) @launch_receiver name: (name) @launch_property)) . (argument) .
       (argument (variable_name) @pipes))))))(if_statement alternative: (else_clause body: (compound_statement (do_statement body: (compound_statement (if_statement alternative: (else_clause body: (if_statement body: (compound_statement (if_statement body: (compound_statement (if_statement body: (compound_statement
       (expression_statement (member_call_expression
       object: (variable_name) @in_receiver name: (name) @in_helper
       arguments: (arguments . (argument (variable_name) @in_peer) .
       (argument (subscript_expression (variable_name) @in_pipes (integer) @stdin)))))))(if_statement body: (compound_statement
       (expression_statement (member_call_expression
       object: (variable_name) @out_receiver name: (name) @out_helper
       arguments: (arguments . (argument (subscript_expression (variable_name) @out_pipes (integer) @stdout)) .
       (argument (variable_name) @out_peer))))))))))))))))))))) @bridge))))) @class
       (#eq? @connect "fsockopen") (#eq? @spawn "proc_open")
       (#eq? @peer @in_peer) (#eq? @peer @out_peer)
       (#eq? @pipes @in_pipes) (#eq? @pipes @out_pipes)
       (#eq? @in_helper @out_helper) (#eq? @in_receiver @out_receiver)
       (#eq? @stdin "0") (#match? @stdout "^[12]$")
       (#eq? @shell_property @launch_property)
       (#eq? @select_receiver @launch_receiver)
       (#match? @shell "^['\"](/bin/(ba)?sh|cmd\\.exe)['\"]$"))
