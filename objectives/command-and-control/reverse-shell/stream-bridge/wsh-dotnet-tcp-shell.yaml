# A Windows Script Host page or script creates .NET TCPClient and stream
# reader/writer objects and an interactive cmd/powershell through Exec, then
# shuttles bytes between the socket stream and the shell's stdio: an outbound
# connection coupled to a command interpreter.
defaults:
  platforms: [windows]
  for: [vbs, html]
  attack: T1059.003,T1095

composite_rules:
  - id: wsh-dotnet-tcp-shell-stream-bridge
    desc: Bridges a TCP stream to a shell
    crit: hostile
    conf: 0.97
    all:
      - id: micro-behaviors/communications/socket/create::wsh-dotnet-tcpclient-object
      - id: micro-behaviors/data/stream/configure::wsh-dotnet-stream-io
      - id: micro-behaviors/process/stdio/configure::wsh-exec-interactive-shell-streams
