defaults:
  platforms: [windows]
  for: [pe]
  attack: T1059.003,T1071.001
  mbc: B0030.002

composite_rules:
  - id: winsock-pipe-reverse-shell-pe
    desc: Outbound Winsock client bridges anonymous pipes to a spawned process
    crit: hostile
    conf: 0.97
    all:
      - id: micro-behaviors/communications/socket/connect::winsock-client-lifecycle
      - id: micro-behaviors/communications/ipc/pipe::pipe-io-redirect
    any:
      - id: micro-behaviors/process/create/exec::create-process-a
      - id: micro-behaviors/process/create/spawn::create-process-w
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/symbols/count::many-imports
      - id: metadata/binary/resource/identity::pe-version-resource
      - id: well-known/tool/
      - id: well-known/app/
