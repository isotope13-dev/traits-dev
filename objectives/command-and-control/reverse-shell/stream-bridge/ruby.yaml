defaults:
  for: [ruby]
  platforms: [unix, windows]
  attack: T1059
composite_rules:
  - id: ruby-socket-shell-stream-relay
    desc: Ruby socket and shell stream relay
    crit: suspicious
    conf: 0.95
    near_bytes: 4096
    all:
      - id: micro-behaviors/communications/socket/connect::ruby-socket-connect
      - id: micro-behaviors/process/create/shell/lang::ruby-shell-duplex-pipe
      - id: micro-behaviors/fs/write/file/copy::ruby-stream-copy-pair
  - id: ruby-retrying-socket-shell-relay
    desc: Ruby shell relay with reconnect delay
    crit: suspicious
    conf: 0.96
    all:
      - id: ruby-socket-shell-stream-relay
      - id: objectives/command-and-control/beacon/network/periodic::ruby-reconnecting-loop
