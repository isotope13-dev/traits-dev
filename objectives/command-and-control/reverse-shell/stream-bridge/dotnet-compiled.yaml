# Compiled .NET connect-back shell implementation. API co-occurrence alone
# does not prove a relay: require both complementary CIL reader/writer loops.
# Compiled CLR type and member names are usually split, so accept the scoped
# ProcessStartInfo/FileName/Start composite as well as the older full token.
# This recognizes implementation, not a successful connection; malformed
# endpoint configuration can prevent an otherwise present relay from running.
#
# A loopback smoke-test harness that drives cmd.exe against its own address
# shares every token; the loopback exception below separates the two by where
# the TCP client points.
defaults:
  for: [pe, dll]
  platforms: [windows]
  attack: T1059.003
  mbc: B0030.002
composite_rules:
- id: dotnet-tcp-cmd-stream-bridge
  desc: Managed TCP and cmd stdio with paired relay loops
  crit: hostile
  conf: 0.93
  size_max: 10485760
  all:
  - id: micro-behaviors/communications/socket/tcp::tcpclient-dotnet-str
  - id: micro-behaviors/communications/socket/tcp::networkstream-dotnet-str
  - id: micro-behaviors/process/create/spawn::redirect-standard-input-dotnet
  - id: micro-behaviors/process/create/spawn::redirect-standard-output-dotnet
  - id: micro-behaviors/fs/path/application/interpreter::cmd-exe-image-name
  - id: metadata/binary/framework::dotnet-assembly
  - id: metadata/binary/instruction/sequence::cil-field-writer-chained-reader-loop
  - id: metadata/binary/instruction/sequence::cil-chained-writer-field-reader-loop
  any:
  - id: micro-behaviors/process/create/spawn::start-token-dotnet
  - id: micro-behaviors/process/create/subprocess::dotnet-process-start-split-tokens
  unless:
  - id: micro-behaviors/communications/ip/endpoint::loopback-cmd-stdio-harness
  - id: well-known/dual-use/remote-admin/
