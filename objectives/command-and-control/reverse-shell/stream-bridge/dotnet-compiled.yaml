# Compiled .NET connect-back shell. The source-shape rules in this leaf parse
# C# text; a compiled assembly carries the same mechanism only as managed
# member tokens: the socket half (TcpClient + its NetworkStream) and the shell
# half (cmd.exe with both standard streams redirected). A Process.Start token
# is also required: process-start configuration can appear in a library that
# never launches the configured shell. Requiring both halves and a launch
# operation supports the coupled-I/O claim that reverse-shell admission needs.
#
# A loopback smoke-test harness that drives cmd.exe against its own address
# shares every token; the loopback exception below separates the two by where
# the TCP client points.
defaults:
  for: [pe, dll]
  platforms: [windows]
  attack: T1059.003
  mbc: B0030.002
composite_rules:
- id: dotnet-tcp-cmd-stream-bridge
  desc: TCP stream coupled to redirected cmd.exe stdio
  crit: hostile
  conf: 0.93
  size_max: 10485760
  all:
  - id: micro-behaviors/communications/socket/tcp::tcpclient-dotnet-str
  - id: micro-behaviors/communications/socket/tcp::networkstream-dotnet-str
  - id: micro-behaviors/process/create/spawn::redirect-standard-input-dotnet
  - id: micro-behaviors/process/create/spawn::redirect-standard-output-dotnet
  - id: micro-behaviors/fs/path/application/executable::cmd-exe-image-name
  - id: micro-behaviors/process/create/spawn::start-token-dotnet
  unless:
  - id: micro-behaviors/communications/ip/endpoint::loopback-cmd-stdio-harness
  - id: well-known/dual-use/remote-admin/
