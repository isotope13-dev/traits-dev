defaults:
  for: [scripts, source]
  platforms: [unix]
  attack: T1059.004
composite_rules:
  - id: openssl-fifo-interactive-shell
    desc: FIFO and interactive shell pipeline establish an OpenSSL reverse shell
    crit: hostile
    conf: 0.99
    near_lines: 4
    all:
      - id: micro-behaviors/process/create/shell/pipeline::interactive-file-input-output-pipe
      - id: micro-behaviors/process/create/shell/pipeline::pipe-to-openssl-client
      - id: micro-behaviors/communications/socket/tls::openssl-connect-file-output
      - id: micro-behaviors/fs/pipe/fifo::mkfifo-reference
