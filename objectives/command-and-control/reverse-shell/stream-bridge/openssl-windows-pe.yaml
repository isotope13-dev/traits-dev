# Native Windows PE implants that dial out over TLS and bridge a child
# process stdio through anonymous pipes share the same import surface as
# legitimate OpenSSL clients; the hostile signal is outbound Winsock
# lifecycle plus pipe-backed CreateProcessW and paired SSL_read/SSL_write
# relay loops.
defaults:
  platforms: [windows]
  for: [pe]
  attack: T1059.003
  mbc: B0030.002

composite_rules:
  - id: openssl-pipe-shell-reverse-shell-pe
    desc: OpenSSL client bridges pipes to a spawned shell over TLS
    crit: hostile
    conf: 0.97
    all:
      - id: micro-behaviors/communications/socket/init::connect-api-ordinal
      - id: micro-behaviors/communications/socket/init::winsock-startup-ordinal
      - id: micro-behaviors/communications/socket/ssl::ssl-connect-symbol
      - id: micro-behaviors/communications/ipc/pipe::pipe-io-redirect
      - id: micro-behaviors/process/create/spawn::create-process-w
      - id: micro-behaviors/communications/socket/ssl::ssl-read-symbol
      - id: micro-behaviors/communications/socket/ssl::ssl-write-symbol
    unless:
      - id: metadata/signed/platform/
