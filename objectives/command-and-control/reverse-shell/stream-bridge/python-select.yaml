defaults:
  platforms: [unix, windows]
  for: [python]
composite_rules:
  - id: python-select-interactive-shell-relay
    desc: Shell child relays socket and fd buffers
    crit: hostile
    conf: 0.98
    attack: T1059.004
    all:
      - id: micro-behaviors/communications/socket/dial::python-dial
      - id: micro-behaviors/os/event/select::python-select-stdout-and-peer
      - id: micro-behaviors/data/stream/transfer::python-conditional-recv-or-fd-read
      - id: micro-behaviors/process/stdio/relay::python-peer-or-stdin-buffer-write
    # Shell child: `-i` is optional, a plain Popen(["/bin/sh"]) fed from the
    # socket relay is the same remote shell.
    any:
      - id: micro-behaviors/process/create/shell/interactive::python-subprocess-interactive-shell
      - id: micro-behaviors/process/create/shell/interpreter::python-popen-shell-interpreter
      - id: micro-behaviors/process/create/shell/interpreter::python-popen-shell-executable
