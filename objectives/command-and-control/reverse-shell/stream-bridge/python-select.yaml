defaults:
  platforms: [unix, windows]
  for: [python]
composite_rules:
  - id: python-select-interactive-shell-relay
    desc: Interactive shell relays socket and fd buffers
    crit: hostile
    conf: 0.98
    attack: T1059.004
    all:
      - id: micro-behaviors/communications/socket/dial::python-dial
      - id: micro-behaviors/process/create/shell/interactive::python-subprocess-interactive-shell
      - id: micro-behaviors/os/event/select::python-select-stdout-and-peer
      - id: micro-behaviors/process/io/stream::python-conditional-recv-or-fd-read
      - id: micro-behaviors/process/io/stream::python-peer-or-stdin-buffer-write
