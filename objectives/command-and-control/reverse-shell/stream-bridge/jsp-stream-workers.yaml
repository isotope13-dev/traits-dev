defaults:
  platforms: [windows]
  for: [jsp]
composite_rules:
  # JSP lacks value-flow facts. This records a concerning combination, not
  # proof that the constructor receivers are the socket and child process.
  - id: jsp-socket-shell-stream-workers
    desc: JSP socket, shell and paired stream workers
    crit: suspicious
    conf: 0.95
    near_bytes: 4096
    all:
      - id: metadata/lang/scripted::jsp-server-page
      - id: micro-behaviors/communications/socket/connect/tcp::java-socket-connect
      - id: micro-behaviors/process/info/query::java-getruntime-ref
      - id: micro-behaviors/process/create/shell/interactive::jvm-cmd-shell-session
      - id: metadata/lang/source/syntax/call/invocation::paired-stream-accessor-construction-text
