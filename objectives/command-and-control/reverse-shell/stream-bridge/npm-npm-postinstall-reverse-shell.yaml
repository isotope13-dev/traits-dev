defaults:
  platforms: [unix, windows]
  for: [package.json]
composite_rules:
- id: npm-postinstall-js-spawn-reverse-shell
  desc: npm postinstall hook launches a socket reverse shell
  crit: hostile
  conf: 0.99
  attack: T1195.002,T1059.007,T1095
  mbc: B0030.002
  for: [npm, package.json, javascript]
  scope: archive
  all:
  - id: metadata/package/scripts/lifecycle::postinstall-hook-declaration
  - id: objectives/command-and-control/reverse-shell/stream-bridge::js-reverse-shell-spawn
