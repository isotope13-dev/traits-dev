defaults:
  platforms:
  - unix
  - windows
  for:
  - javascript
  - typescript
  attack: T1059.004,T1095
  mbc: B0030
traits:
- id: node-tcp-command-execution-reverse-shell
  desc: TCP client executes commands and returns output
  crit: hostile
  conf: 0.995
  if:
    type: yara
    source: |
      rule ordered_evidence {
        strings:
          $b0_0 = /(new\s+net\.Socket\s*\(\s*\)|net\.connect\s*\()/is
          $b0_1 = /\.on\s*\(\s*["']data["']/is
          $bad_0_2 = /[)]/is
          $b0_2 = /exec\s*\(\s*(data\.toString\s*\(\s*\)|String\s*\(\s*data\s*\))/is
          $b0_3 = /(client|socket)\.write\s*\(\s*(stdout|stderr)/is
        condition:
          (
            for any i0 in (1..#b0_0) : (
              for any i1 in (1..#b0_1) : (
                @b0_1[i1] >= (@b0_0[i0] + !b0_0[i0]) and
                @b0_1[i1] <= (@b0_0[i0] + !b0_0[i0]) + 1200 and
                for any i2 in (1..#b0_2) : (
                  @b0_2[i2] >= (@b0_1[i1] + !b0_1[i1]) and
                  @b0_2[i2] <= (@b0_1[i1] + !b0_1[i1]) + 1000 and
                  for any i3 in (1..#b0_3) : (
                    @b0_3[i3] >= (@b0_2[i2] + !b0_2[i2]) + 0 and
                    @b0_3[i3] <= (@b0_2[i2] + !b0_2[i2]) + 1300 and
                    (@b0_3[i3] <= (@b0_2[i2] + !b0_2[i2]) + 1000 or not $bad_0_2 in ((@b0_2[i2] + !b0_2[i2]) .. @b0_3[i3] - 1001)) and
                    true
                  )
                )
              )
            )
          )
      }
composite_rules: []
