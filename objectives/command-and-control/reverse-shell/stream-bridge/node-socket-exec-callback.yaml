defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, npm, tar, zip]
  attack: T1059.004,T1095
  mbc: B0030

traits:
  - id: node-tcp-data-command-exec-and-output-relay
    desc: Executes commands received over a TCP socket and returns their output
    crit: suspicious
    conf: 0.99
    if:
      type: text
      regex: '(?is)(?:new\s+net\.Socket\s*\(\s*\)|net\.connect\s*\()[\s\S]{0,1200}\.on\s*\(\s*["'']data["''][\s\S]{0,1000}exec\s*\(\s*(?:data\.toString\s*\(\s*\)|String\s*\(\s*data\s*\))[^)]{0,300}[\s\S]{0,1000}(?:client|socket)\.write\s*\(\s*(?:stdout|stderr)'

composite_rules:
  - id: node-tcp-command-execution-reverse-shell
    desc: TCP client provides remote command execution with output returned to the controller
    crit: hostile
    conf: 0.995
    for: [zip, npm, tar, javascript, typescript]
    scope: archive
    all:
      - id: node-tcp-data-command-exec-and-output-relay
