defaults:
  attack: T1059.001
  for: [python]
  platforms: [windows]
traits:
  - id: python-interpolated-stream-eval-reply
    desc: Builds a stream command-eval reply loop
    crit: suspicious
    conf: 0.98
    # The entire read/evaluate/write loop is in one constructed string;
    # this does not infer that the Python process executes PowerShell locally.
    if:
      type: tree-sitter
      query: |
        ((string (interpolation) @slot) @payload
          (#match? @payload "while\\(.*\\.Read\\(")
          (#match? @payload "(?i)\\((iex|Invoke-Expression)[ \\t]+\\$[A-Za-z_]")
          (#match? @payload "\\.Write\\(.*\\.Flush\\(\\)"))
composite_rules:
  - id: python-interpolated-powershell-command-relay
    desc: Builds a PowerShell TCP command relay
    crit: hostile
    conf: 0.98
    near_bytes: 1
    all:
      - id: python-interpolated-stream-eval-reply
      - id: micro-behaviors/communications/socket/receive::python-tcp-read-loop-template
