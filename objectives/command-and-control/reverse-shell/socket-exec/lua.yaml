# Lua reverse shell: socket.tcp + connect + io.popen, with socket I/O.
#
# All three want the socket and the shell in the same routine. A Lua reverse
# shell is a handful of lines -- connect, popen, pump -- while a library that
# happens to do both keeps them apart: LuaLogging's socket appender calls
# `io.popen("/bin/hostname")` once at load to label its messages and opens its
# TCP connection 140 lines later, in a different function.
defaults:
  crit: hostile
  for: [lua]
  platforms: [linux, macos, windows]
  attack: T1059
  mbc: B0030.002
composite_rules:
  - id: lua-revshell
    desc: Lua TCP socket shell with received command data
    conf: 0.99
    near_bytes: 1024
    all:
      - id: micro-behaviors/communications/socket/connect::lua-tcp-connect
      - id: micro-behaviors/process/create/shell/spawn::lua-io-popen
      - id: micro-behaviors/communications/socket/receive::lua-socket-receive
    unless:
      - id: well-known/tool/detection/llm-scanner/
  - id: lua-socket-popen-shell
    desc: Lua TCP socket paired with io.popen shell execution
    conf: 0.97
    near_bytes: 1024
    all:
      - id: micro-behaviors/communications/socket/connect::lua-tcp-connect
      - id: micro-behaviors/process/create/shell/spawn::lua-io-popen
    unless:
      - id: well-known/tool/detection/llm-scanner/
  - id: lua-socket-send-popen-shell
    desc: Lua TCP socket shell that sends command output
    conf: 0.97
    near_bytes: 1024
    all:
      - id: micro-behaviors/communications/socket/connect::lua-tcp-connect
      - id: micro-behaviors/process/create/shell/spawn::lua-io-popen
      - id: micro-behaviors/communications/socket/send::lua-socket-send
    unless:
      - id: well-known/tool/detection/llm-scanner/
