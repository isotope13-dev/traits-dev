defaults:
  platforms: [unix, windows]
  for: [perl]
traits:
  - id: sockaddr-in-connect
    desc: Perl sockaddr_in socket connect
    crit: notable
    conf: 0.92
    attack: T1095
    if:
      type: text
      regex: 'connect\s*\(\w+\s*,\s*sockaddr_in\('
  - id: perl-exec-bin-sh
    desc: Perl execs a quoted shell path
    crit: notable
    conf: 0.9
    for: [perl, static-lib]
    if:
      type: text
      regex: 'exec\s*\{\s*[''"]/bin/sh[''"]'
  - id: inet-aton-arg
    desc: inet_aton on runtime host
    crit: notable
    conf: 0.88
    attack: T1095
    if:
      type: text
      regex: 'inet_aton\s*\(\s*\$ARGV\['
  - id: connectback-banner
    desc: ConnectBack backdoor banner string
    crit: suspicious
    conf: 0.99
    attack: T1587
    if:
      type: string_literal
      substr: ConnectBack Backdoor
  - id: history-wipe-prelude
    desc: History wipe shell prelude
    crit: suspicious
    conf: 0.95
    attack: T1070.003
    if:
      type: string_literal
      substr: unset HISTFILE; unset SAVEHIST
  - id: recon-shell-prelude
    desc: System recon shell prelude
    crit: suspicious
    conf: 0.93
    attack: T1082
    if:
      type: string_literal
      regex: 'uname -a;.{0,50}id;.{0,50}pwd;'
composite_rules:
  - id: connectback-recon-prelude
    desc: Connect-back recon shell prelude
    crit: suspicious
    conf: 0.97
    all:
      - id: history-wipe-prelude
      - id: recon-shell-prelude
  - id: reverse-shell-perl
    desc: Reverse shell in Perl
    crit: suspicious
    conf: 0.66
    mbc: B0033
    attack: T1059
    all:
      - id: micro-behaviors/communications/socket/create::socket-call
      - id: micro-behaviors/communications/socket/create::open-call
      - id: objectives/command-and-control/reverse-shell/dup::perl-redir
    any:
      - id: micro-behaviors/process/create/shell/interactive::sh-interactive
      - id: micro-behaviors/process/create/shell/spawn::bin-sh-interactive
  - id: perl-socket-exec-shell
    desc: Perl connects a shell to a socket
    crit: hostile
    conf: 0.95
    attack: T1095
    for: [perl, static-lib]
    all:
      - id: micro-behaviors/communications/socket/tcp::sock-stream
      - id: objectives/command-and-control/reverse-shell/dup::stdin-socket-redir
      - id: objectives/command-and-control/reverse-shell/dup::stdout-socket-redir
      - id: perl-exec-bin-sh
  - id: connectback-system-shell
    desc: Perl connect-back system shell
    crit: hostile
    conf: 0.995
    mbc: B0030.002
    attack: T1095
    all:
      - id: micro-behaviors/communications/socket/create::socket-call
      - id: sockaddr-in-connect
      - id: inet-aton-arg
      - id: objectives/command-and-control/reverse-shell/dup::stdio-socket-redirect
      - id: micro-behaviors/process/create/system::system-process-call
      - id: micro-behaviors/process/interpreter/shell::bin-sh
    any:
      - id: connectback-banner
      - id: connectback-recon-prelude
  - id: masked-reverse-shell
    desc: Reverse shell hiding its process title
    crit: hostile
    conf: 0.95
    attack: T1036.005
    all:
      - id: reverse-shell-perl
      - id: objectives/evasion/masquerade/identity/process-title::process-title-nul-pad
