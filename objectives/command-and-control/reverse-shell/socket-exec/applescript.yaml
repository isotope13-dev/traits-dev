# AppleScript reverse shell: do shell script "bash -i >& /dev/tcp/...".
defaults:
  for: [applescript]
  platforms: [macos]
  attack: T1059
  mbc: B0030.002
traits:
  - id: applescript-do-shell-bash-i
    desc: "AppleScript do shell w/ interactive bash"
    crit: notable
    conf: 0.93
    if:
      type: text
      regex: 'do\s+shell\s+script\s+"(/bin/)?(ba)?sh\s+-i'
