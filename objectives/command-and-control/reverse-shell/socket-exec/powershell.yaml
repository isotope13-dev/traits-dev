defaults:
  platforms: [windows]
  for: [powershell, scripts]
  attack: T1059.001,T1105
traits:
  - id: powershell-command-output-loop
    desc: PowerShell command output socket loop
    crit: suspicious
    conf: 0.97
    for: [powershell, scripts, markdown]
    if:
      type: text
      regex: '(?i)Out-String[\s\S]{0,500}\.Write\s*\('
    unless:
      - id: well-known/tool/offensive/
  - id: powershell-iex-on-stream-read
    desc: PowerShell iex consumes stream-read bytes
    crit: notable
    conf: 0.93
    for: [powershell, scripts, markdown]
    if:
      type: text
      regex: '(?i)\(iex\s+\$\w+(\s+2>&1)?\s*\|\s*Out-String\)'
  # micro-behaviors/communications/socket/tcp::tcpclient-host-port and
  # ::tcpclient-stream are `for: [powershell]` only. Local markdown-scoped
  # duplicates so a documented/tutorial code block (the same literal PowerShell
  # text, just fenced in a .md file) can satisfy markdown-powershell-tcpclient-
  # revshell below.
  # A tutorial/writeup showing the technique is weaker evidence than the same
  # text in a live script, so these sit below the canonical atoms' confidence.
  - id: tcpclient-host-port-doc
    desc: PowerShell TcpClient host-port (documented)
    crit: notable
    conf: 0.85
    for: [markdown]
    if:
      type: text
      regex: '(?i)TCPClient\s*\(\s*[\x27"][^\x27"]{1,80}[\x27"]\s*,\s*\d{2,5}'
  - id: tcpclient-stream-doc
    desc: PowerShell TcpClient stream (documented)
    crit: notable
    conf: 0.9
    for: [markdown]
    if:
      type: text
      regex: '(?i)New-Object\s+(System\.)?Net\.Sockets\.TCPClient[\s\S]{0,500}\.GetStream\s*\(\s*\)'
composite_rules:
  - id: powershell-tcpclient-command-loop
    for: [powershell]
    desc: PowerShell TcpClient reverse command loop
    crit: hostile
    conf: 0.99
    all:
      - id: micro-behaviors/communications/socket/tcp::tcpclient-stream
      - id: powershell-command-output-loop
    unless:
      - id: well-known/tool/detection/llm-scanner/
  - id: powershell-tcpclient-iex-revshell
    for: [powershell]
    desc: PowerShell TCPClient + iex consumer = reverse shell
    crit: hostile
    conf: 0.99
    all:
      - id: micro-behaviors/communications/socket/tcp::tcpclient-host-port
      - id: powershell-iex-on-stream-read
    unless:
      - id: well-known/tool/detection/llm-scanner/
  - id: powershell-tcpclient-revshell
    for: [powershell]
    desc: PowerShell TCPClient reverse-shell skeleton
    crit: hostile
    conf: 0.97
    all:
      - id: micro-behaviors/communications/socket/tcp::tcpclient-host-port
      - id: micro-behaviors/communications/socket/tcp::tcpclient-stream
    any:
      - id: powershell-command-output-loop
      - id: powershell-iex-on-stream-read
    unless:
      - id: well-known/tool/detection/llm-scanner/
  - id: markdown-powershell-tcpclient-revshell
    desc: Markdown documents PowerShell TCP reverse shell
    crit: hostile
    conf: 0.99
    attack: T1059.001
    for: [markdown]
    all:
      - id: tcpclient-host-port-doc
      - id: tcpclient-stream-doc
      - id: powershell-command-output-loop
      - id: powershell-iex-on-stream-read
    unless:
      - id: well-known/tool/detection/llm-scanner/
