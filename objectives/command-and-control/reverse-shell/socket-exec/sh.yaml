defaults:
  platforms: [unix, windows]
  attack: T1059.004
traits:
  - id: reverse-shell-python
    desc: Python reverse shell pattern
    crit: suspicious
    conf: 0.95
    attack: T1059.006
    for:
      - shell
      - package.json
      - python
    if:
      type: text
      regex: python[23]?\s+-c\s+['"]import socket.{0,50}subprocess.{0,50}connect
    unless:
      - id: well-known/tool/offensive/
      # Scanner rule corpora quote the one-liner inside labeled example
      # blocks; the corpus labels themselves mark the file as test fixtures
      # for detection rules rather than executed behavior.
      - type: text
        regex: '\b(true|false)_positive:'
  - id: sh-reverse-shell-perl
    desc: Perl socket reverse shell
    crit: suspicious
    conf: 0.95
    attack: T1059
    for:
      - shell
      - package.json
    if:
      type: text
      regex: perl\s+-e\s+['"].{0,50}socket.{0,50}connect.{0,50}exec
    unless:
      - id: well-known/tool/detection/security-scanner-identity::ks-aur-scanner-source-context
      - id: metadata/package/testing/presence/harness::test-directory-path
  - id: php-cli-fsockopen
    desc: PHP CLI fsockopen reverse-shell setup
    crit: notable
    conf: 0.9
    attack: T1059
    for:
      - shell
      - package.json
      - php
    if:
      type: text
      regex: php\s+-r\s+['"].{0,80}fsockopen
  - id: php-var-fsockopen
    desc: PHP fsockopen socket variable
    crit: notable
    conf: 0.9
    attack: T1059
    for:
      - shell
      - package.json
      - php
    if:
      type: text
      regex: '\$sock\s*=\s*fsockopen'
  - id: sh-reverse-shell-ruby-1
    desc: Ruby socket reverse shell (cli execution)
    crit: suspicious
    conf: 0.95
    attack: T1059
    for:
      - shell
      - package.json
      - ruby
    if:
      type: text
      regex: ruby\s+-rsocket\s+-e.{0,80}(exec|spawn|system)
  - id: sh-reverse-shell-ruby-2
    desc: Ruby socket reverse shell (cli path)
    crit: suspicious
    conf: 0.95
    attack: T1059
    for:
      - shell
      - package.json
      - ruby
    if:
      type: text
      regex: ruby\s+-rsocket\s+-e.{0,80}(/bin/sh|/bin/shell)
  - id: sh-reverse-shell-ruby-3
    desc: Ruby socket reverse shell (TCPSocket)
    crit: suspicious
    conf: 0.95
    attack: T1059
    for:
      - shell
      - package.json
      - ruby
    if:
      type: text
      regex: ruby\s+-rsocket\s+-e.{0,160}TCPSocket\.open.{0,160}(exec|spawn|system)
composite_rules:
  - id: sh-reverse-shell-ruby
    desc: Ruby socket reverse shell
    crit: suspicious
    conf: 0.95
    attack: T1059
    for:
      - shell
      - package.json
      - ruby
    any:
      - id: sh-reverse-shell-ruby-1
      - id: sh-reverse-shell-ruby-2
      - id: sh-reverse-shell-ruby-3
  - id: reverse-shell-php
    desc: PHP reverse shell pattern
    crit: suspicious
    conf: 0.95
    attack: T1059
    for:
      - php
    all:
      - id: php-fsockopen-socket
      - id: php-shell-exec-function
  - id: php-fsockopen-socket
    desc: PHP fsockopen socket setup
    crit: component
    conf: 0.9
    attack: T1059
    for:
      - shell
      - package.json
      - php
    any:
      - id: php-cli-fsockopen
      - id: php-var-fsockopen
  - id: php-shell-exec-function
    desc: PHP shell execution function
    crit: component
    conf: 0.9
    attack: T1059
    for:
      - php
    any:
      - id: micro-behaviors/process/create/shell/spawn::php-exec
      - id: micro-behaviors/process/create/shell/spawn::php-shell-exec
      - id: micro-behaviors/process/create/shell/spawn::php-passthru
      - id: micro-behaviors/process/create/shell/spawn::php-system-call
      - id: micro-behaviors/process/create/shell/lang::popen
      - id: micro-behaviors/process/create/shell/lang::proc-open
