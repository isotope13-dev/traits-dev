defaults:
  platforms: [windows, unix]
  for: [php]
  attack: T1059
  mbc: B0030

composite_rules:
  - id: php-client-socket-with-shell
    desc: PHP client socket paired with shell execution
    crit: suspicious
    conf: 0.95
    all:
      - id: micro-behaviors/communications/socket/connect::php-socket-create
      - id: micro-behaviors/communications/socket/connect::php-socket-connect
    any:
      - id: micro-behaviors/process/create/shell/lang/
