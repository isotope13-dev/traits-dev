# A setup script with a custom install command that carries a complete Python
# socket reverse-shell one-liner: socket connect, stdio descriptors
# duplicated onto the socket, then a /bin shell spawned. The one-liner is
# matched as text, so it also fires when the payload is quoted inside a
# string written to disk or left commented out for a later stage. That is why
# this stays suspicious: the text proves the payload is shipped with the
# installer, not that the installer runs it. Live variants are judged by the
# call-based reverse-shell rules in descriptor-audit-python.yaml.
defaults:
  platforms: [unix]
  for: [python]
  attack: T1059.006,T1195.002

composite_rules:
  - id: python-install-hook-embedded-reverse-shell
    desc: Install-hook setup script embeds Python reverse shell
    crit: suspicious
    conf: 0.9
    mbc: B0030.002
    all:
      - id: metadata/build/package/recipe/setup-hooks::python-install-hook
      - id: micro-behaviors/process/fd/dup::inline-python-socket-dup2
      - id: micro-behaviors/process/create/shell/interactive::python-shell-spawn-text
    unless:
      - id: objectives/command-and-control/reverse-shell/fd-redirect::embedded-shell-documentation-context
      - id: metadata/package/testing/corpus/security-tests::ran-bundled-adversary-templates
