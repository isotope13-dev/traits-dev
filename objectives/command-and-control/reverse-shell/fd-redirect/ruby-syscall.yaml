defaults:
  for: [ruby]
  platforms: [unix]
composite_rules:
  - id: ruby-syscall-stdio-reverse-shell
    desc: Socket dup2 syscall precedes shell exec
    crit: hostile
    conf: 0.99
    all:
      - id: micro-behaviors/process/fd/dup::ruby-socket-syscall-stdio-dup
      - id: micro-behaviors/process/create/exec::ruby-exec
      - id: micro-behaviors/fs/path/application/interpreter::unix-shell-executable-path
