# Zig reverse shell: tcpConnectToHost + dup2 + execveZ /bin/sh.
defaults:
  for: [zig]
  platforms: [linux, macos]
  attack: T1059
  mbc: B0030.002
traits:
  - id: zig-os-dup2-fd-stdio
    desc: Zig os.dup2 over fd onto stdio slot
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: 'os\.dup2\s*\(\s*fd\s*,\s*[0-2]\s*\)'
composite_rules:
  - id: zig-revshell
    desc: Zig reverse shell (tcpConnectToHost + dup2 + execveZ /bin/sh)
    crit: hostile
    conf: 0.99
    all:
      - id: micro-behaviors/communications/socket/endpoint::zig-tcp-connect-host-literal
      - id: zig-os-dup2-fd-stdio
      - id: micro-behaviors/process/create/shell/spawn::zig-execveZ-bin-sh
    unless:
      - id: well-known/tool/detection/llm-scanner/
