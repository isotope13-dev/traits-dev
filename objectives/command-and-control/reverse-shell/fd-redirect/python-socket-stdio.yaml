# The fd-redirect reverse shell without descriptor duplication: the shell
# child inherits the operator's connected socket as its stdio streams, so the
# remote peer drives the shell. Sibling to the dup2 variants in
# descriptor-audit-python.yaml, which route the socket through os.dup2; this
# passes the socket object itself to Popen. The locally-created-socket leg
# binds connect to one socket variable, and the custom-stdio leg requires
# identifier-valued stream kwargs on the Popen call, so the hostile claim
# never rests on file-wide co-occurrence.
defaults:
  platforms: [unix, windows]
  for: [python]
composite_rules:
  - id: python-socket-stdio-shell
    desc: Shell child inherits a connected socket as its stdio
    crit: hostile
    conf: 0.96
    attack: T1059.004,T1059.006
    mbc: B0030.002
    near_lines: 40
    all:
      - id: micro-behaviors/communications/socket/connect::python-created-socket-connect
      - id: micro-behaviors/process/create/subprocess::python-popen-shell-interpreter
      - id: micro-behaviors/process/fd/stdio::python-custom-stdio
    unless:
      # AF_UNIX is local IPC, not a remote shell: standard-library helpers
      # bridge child stdio over a Unix-domain socket to a local process.
      - id: micro-behaviors/communications/socket/family::af-unix-socket
      - id: metadata/lang/source/origin::yaml-plain-source-layer-path
      - id: metadata/package/testing/corpus::ran-bundled-adversary-templates
      - id: metadata/package/testing/presence/harness/
      - id: micro-behaviors/metaprogramming/generation::configured-payload-generator
      - id: well-known/tool/offensive/
      - id: well-known/tool/detection/
