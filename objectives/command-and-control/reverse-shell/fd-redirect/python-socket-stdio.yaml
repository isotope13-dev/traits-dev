# The fd-redirect reverse shell without descriptor duplication: the shell
# child inherits the operator's connected socket as its stdio streams, so the
# remote peer drives the shell. Sibling to the dup2 variants in
# descriptor-audit-python.yaml, which route the socket through os.dup2; this
# passes the socket object itself to Popen. The locally-created-socket leg
# binds connect to one socket variable. The structural leg additionally
# requires that same variable for all three child streams; local log files
# beside an unrelated network client do not establish a reverse shell.
defaults:
  platforms: [unix, windows]
  for: [python]
  attack: T1059.004,T1059.006
  mbc: B0030.002
composite_rules:
  - id: python-socket-stdio-shell
    desc: Shell child inherits a connected socket as its stdio
    crit: hostile
    conf: 0.96
    near_lines: 40
    all:
      - id: micro-behaviors/communications/socket/connect/attempt::python-created-socket-connect
      - id: micro-behaviors/process/create/shell/interpreter::python-popen-shell-interpreter
      - id: micro-behaviors/process/stdio/configure::python-custom-stdio
      - id: python-connected-socket-subprocess-shell
    unless:
      # AF_UNIX is local IPC, not a remote shell: standard-library helpers
      # bridge child stdio over a Unix-domain socket to a local process.
      - id: micro-behaviors/communications/socket/family::af-unix-socket
      - id: metadata/lang/source/origin::yaml-plain-source-layer-path
      - id: metadata/package/testing/corpus/adversary-templates::ran-bundled-adversary-templates
      - id: micro-behaviors/metaprogramming/generation/source::configured-payload-generator
  # Scope-independent sibling of python-socket-stdio-shell: a created socket is the
  # shell child's stdin/stdout/stderr, and the same code dials out. Covers the
  # function-wrapped, create_connection, shell=True and from-import spellings
  # that the module-level structural leg cannot see.
  - id: python-dialed-socket-shared-stdio-shell
    desc: Outbound socket code gives a shell child shared stdio
    crit: hostile
    conf: 0.95
    near_lines: 30
    all:
      - id: micro-behaviors/communications/socket/dial::python-dial
      - id: micro-behaviors/process/stdio/configure::python-shell-child-socket-stdio-object
    unless:
      - id: micro-behaviors/communications/socket/family::af-unix-socket
      - id: metadata/lang/source/origin::yaml-plain-source-layer-path
      - id: metadata/package/testing/corpus/adversary-templates::ran-bundled-adversary-templates
      - id: micro-behaviors/metaprogramming/generation/source::configured-payload-generator
