defaults:
  crit: hostile
  platforms: [linux]
  for: [elf]
  attack: T1059.004
  mbc: B0030.002
composite_rules:
  # The two rules around this one are both static-only, which left the most
  # ordinary compiled reverse shell uncovered:
  #   * native-address-stdio-shell needs glibc's INTERNAL aliases
  #     (__libc_socket / __GI_socket, __libc_connect, __libc_dup2). Those names
  #     only appear when glibc is linked statically; a dynamically linked ELF
  #     imports the public `socket` / `connect` / `dup2` instead.
  #   * static-forked-reverse-shell-linux matches raw x86-64 syscall bytes and
  #     additionally requires clone().
  # So `gcc revshell.c -o x` — socket + connect + dup2(0,1,2) + execl("/bin/sh")
  # with the C2 address compiled in — scored no hostile at all.
  #
  # Precision rests on the pinned address, not on the primitive set: socat, nc,
  # sshd, screen and script(1) all connect a socket to a shell, but they take
  # the peer from argv or config. Measured on 9,314 ELF files under /usr/bin,
  # /usr/lib and /usr/sbin: 21 carry socket+connect+dup2+/bin/sh+inet_*+exec*
  # (libc.so.6, ncat, pppd, sudoers.so, busybox among them), and zero of those
  # 21 also carry a pinned host address -- so the address leg is what separates
  # an implant from the general-purpose tools, and the six legs together have no
  # false positive on that corpus.
  - id: dynamic-linked-reverse-shell-linux
    desc: Dynamically linked reverse shell to pinned IP
    conf: 0.97
    all:
      - id: micro-behaviors/communications/socket/create::posix-socket-import
      - id: micro-behaviors/communications/socket/connect::connect-symbol
      - id: micro-behaviors/process/fd/dup::dup2
      - id: micro-behaviors/process/create/shell/spawn::bin-sh-binary-text
      - id: micro-behaviors/process/create/execv::exec-variant-symbol-text
      - id: micro-behaviors/communications/ip/literal::external-ipv4-host-literal-binary
  # Fork/clone before connect+dup2+/bin/sh is the classic detached reverse
  # shell shape. Catches stripped static GetShell/Trojan.Linux variants that
  # background before dialing out — not covered by symbol-based native-address-stdio-shell.
  - id: static-forked-reverse-shell-linux
    desc: Stripped static forked reverse shell
    conf: 0.98
    all:
      - id: micro-behaviors/process/fork/clone::x86-64-clone-syscall
      - id: micro-behaviors/communications/socket/create::x86-64-socket-syscall
      - id: micro-behaviors/communications/socket/create::x86-64-connect-syscall
      - id: micro-behaviors/process/create/shell/fd::x86-64-syscall-dup2
      - id: micro-behaviors/process/create/execv::x86-64-syscall-execve
      - id: micro-behaviors/process/create/shell/spawn::bin-sh-binary-text
      - id: micro-behaviors/communications/ip/literal::external-ipv4-binary
  # Exploit-payload LD_PRELOAD shells (Metasploit's CVE-2017-17562 GoAhead
  # .so family) carry no pinned address: the template ships 0.0.0.0 and the
  # operator patches it at exploit time. Precision rests on LD_PRELOAD
  # instead: legitimate preload shims (faketime, sanitizers, fakeroot)
  # never dial out, duplicate stdio, and exec a shell together.
  - id: ld-preload-reverse-shell-linux
    desc: LD_PRELOAD reverse shell with shell exec
    conf: 0.96
    all:
      - id: micro-behaviors/os/linker/env::ld-preload
      - id: micro-behaviors/communications/socket/create::posix-socket-import
      - id: micro-behaviors/communications/socket/connect::connect-symbol
      - id: micro-behaviors/process/fd/dup::dup2
      - id: micro-behaviors/process/create/execv::c-exec-variants
    any:
      - id: micro-behaviors/process/create/shell/spawn::bin-sh-binary-text
      - id: micro-behaviors/process/create/shell/native::bash-binary-name
    needs: 1
    unless:
      # Preload exploit payloads are shared objects (.so); standalone executables have PT_INTERP.
      - id: metadata/binary/linking/runtime::interpreter
      - id: well-known/app/ai/coding-agent/
      # Node native addons (.node) are shared libraries loaded via dlopen, not preload exploit shims.
      - id: metadata/binary/symbols/exports::node-api-addon-export
      - id: metadata/binary/framework::node-module-register-export

  # Forking outbound payload: connect distinguishes it from a listener.
  - id: ld-preload-forking-reverse-shell
    desc: Forking LD_PRELOAD reverse shell
    conf: 0.96
    all:
      - id: micro-behaviors/os/linker/env::ld-preload
      - id: micro-behaviors/communications/socket/create::posix-socket-import
      - id: micro-behaviors/communications/socket/connect::connect-symbol
      - id: micro-behaviors/process/fd/dup::dup2
      - id: micro-behaviors/process/create/fork::fork
      - id: micro-behaviors/process/create/execv::c-exec-variants
    any:
      - id: micro-behaviors/process/create/shell/spawn::bin-sh-binary-text
      - id: micro-behaviors/process/create/shell/native::bash-binary-name
    needs: 1
    unless:
      # Preload exploit payloads are shared objects (.so); standalone executables have PT_INTERP.
      - id: metadata/binary/linking/runtime::interpreter
      - id: well-known/app/ai/coding-agent/
      # Node native addons (.node) are shared libraries loaded via dlopen, not preload exploit shims.
      - id: metadata/binary/symbols/exports::node-api-addon-export
      - id: metadata/binary/framework::node-module-register-export

