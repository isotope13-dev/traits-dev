defaults:
  crit: hostile
  platforms: [linux]
  for: [elf]
  attack: T1059.004
  mbc: B0030.002
composite_rules:
  # Plex2Shell (CVE-2026-96652/96654/96655/96656) delivery: the payload is a
  # constructor-only ELF shared object written into a Plex codec directory.
  # The transcoder dlopen()s every *.so it finds there, which runs the object's
  # DT_INIT_ARRAY constructor on load -- before symbol resolution, so the
  # library needs no exported entry point, no `lib` prefix and no execute bit.
  # The constructor opens the reverse shell as the plex account (uid 1000).
  #
  # Distinct from the IP-anchored rules below: precision here rests on the
  # object SHAPE, not on a pinned address, so it still fires when the C2 is a
  # hostname (the writeup's 127.0.0.1.<attacker>.sslip.io wildcard) rather than
  # a literal IP. A loadable shared object (ET_DYN, no program interpreter) with
  # almost no code of its own that nonetheless bundles the full socket -> connect
  # -> dup2(stdio) -> exec(/bin/sh) reverse-shell set is the signature. Real
  # libraries that carry those symbols (libc.so.6, sudoers.so, ncat) have a
  # large function surface and are excluded by few-functions; LD_PRELOAD shims
  # (faketime, sanitizers) never also dup stdio onto a socket and exec a shell.
  - id: constructor-only-shared-object-reverse-shell
    desc: Constructor-only shared object opens a reverse shell on load
    conf: 0.95
    attack: T1059.004,T1574
    all:
      - id: metadata/binary/header/identity::shared-object-type
      - id: metadata/binary/linking/dynamic::init-array-present
      - id: metadata/binary/code/complexity::few-functions
      - id: micro-behaviors/communications/socket/create::posix-socket-import
      - id: micro-behaviors/communications/socket/connect/attempt::connect-symbol
      - id: micro-behaviors/process/fd/dup::dup2
      - id: micro-behaviors/fs/path/application/interpreter::bin-sh-path-reference
      - id: micro-behaviors/process/replace::c-exec-variants
    unless:
      # A real program (PIE executable) has a program interpreter; a dlopen'd
      # payload / preload object does not.
      - id: metadata/binary/linking/runtime::interpreter
      - id: well-known/tool/sysadmin/busybox::busybox-binary
      - id: metadata/binary/linking/runtime::musl-loader-basename
      - id: metadata/binary/symbols/name/c-runtime::libc-export-reference-clues
  # The two rules around this one are both static-only, which left the most
  # ordinary compiled reverse shell uncovered:
  #   * native-address-stdio-shell needs glibc's INTERNAL aliases
  #     (__libc_socket / __GI_socket, __libc_connect, __libc_dup2). Those names
  #     only appear when glibc is linked statically; a dynamically linked ELF
  #     imports the public `socket` / `connect` / `dup2` instead.
  #   * static-forked-reverse-shell-linux matches raw x86-64 syscall bytes and
  #     additionally requires clone().
  # So `gcc revshell.c -o x` — socket + connect + dup2(0,1,2) + execl("/bin/sh")
  # with the C2 address compiled in — scored no hostile at all.
  #
  # Precision rests on the pinned address, not on the primitive set: socat, nc,
  # sshd, screen and script(1) all connect a socket to a shell, but they take
  # the peer from argv or config. Measured on 9,314 ELF files under /usr/bin,
  # /usr/lib and /usr/sbin: 21 carry socket+connect+dup2+/bin/sh+inet_*+exec*
  # (libc.so.6, ncat, pppd, sudoers.so, busybox among them), and zero of those
  # 21 also carry a pinned host address -- so the address leg is what separates
  # an implant from the general-purpose tools, and the six legs together have no
  # false positive on that corpus.
  # The exec leg accepts any of the exec-family forms. exec-variant-symbol-text
  # only matches an exec token that lands in .text, which happens for statically
  # linked or inlined binaries; a dynamically linked, stripped ELF carries
  # `execl`/`execve` in .dynstr instead, where it surfaces as a symbol/import.
  # Requiring only the .text form left exactly the `gcc revshell.c` case this
  # rule names uncovered. The pinned external address stays the precision anchor.
  - id: dynamic-linked-reverse-shell-linux
    desc: Dynamically linked reverse shell to pinned IP
    conf: 0.97
    all:
      - id: micro-behaviors/communications/socket/create::posix-socket-import
      - id: micro-behaviors/communications/socket/connect/attempt::connect-symbol
      - id: micro-behaviors/process/fd/dup::dup2
      - id: micro-behaviors/fs/path/application/interpreter::bin-sh-path-reference
      - id: micro-behaviors/communications/ip/literal::external-ipv4-shaped-text-binary
    any:
      - id: metadata/binary/symbols/name/process::exec-variant-symbol-text
      - id: metadata/binary/symbols/name/process::execve-import
      - id: micro-behaviors/process/replace::c-exec-variants
    needs: 1
  # Fork/clone before connect+dup2+/bin/sh is the classic detached reverse
  # shell shape. Catches stripped static GetShell/Trojan.Linux variants that
  # background before dialing out — not covered by symbol-based native-address-stdio-shell.
  - id: static-forked-reverse-shell-linux
    desc: Stripped static reverse shell with clone
    arch: [x86-64]
    conf: 0.98
    all:
      - id: micro-behaviors/os/syscall/clone::x86-64-clone-syscall
      - id: micro-behaviors/communications/socket/create::x86-64-socket-syscall
      - id: micro-behaviors/communications/socket/syscall/connect::linux-connect-syscall-sequence
      - id: micro-behaviors/process/fd/dup::x86-64-syscall-dup2
      - id: micro-behaviors/process/replace::x86-execve-syscall-sequence
      - id: micro-behaviors/fs/path/application/interpreter::bin-sh-path-reference
      - id: micro-behaviors/communications/ip/literal::external-ipv4-binary
  # Exploit-payload LD_PRELOAD shells (Metasploit's CVE-2017-17562 GoAhead
  # .so family) carry no pinned address: the template ships 0.0.0.0 and the
  # operator patches it at exploit time. Precision rests on LD_PRELOAD
  # instead: legitimate preload shims (faketime, sanitizers, fakeroot)
  # never dial out, duplicate stdio, and exec a shell together.
  - id: ld-preload-reverse-shell-linux
    desc: LD_PRELOAD reverse shell with shell exec
    conf: 0.96
    size_max: 5242880
    all:
      - id: micro-behaviors/os/env/runtime::ld-preload
      - id: micro-behaviors/communications/socket/create::posix-socket-import
      - id: micro-behaviors/communications/socket/connect/attempt::connect-symbol
      - id: micro-behaviors/process/fd/dup::dup2
      - id: micro-behaviors/process/replace::c-exec-variants
    any:
      - id: micro-behaviors/fs/path/application/interpreter::bin-sh-path-reference
      - id: micro-behaviors/fs/path/application/interpreter::bash-path-reference
    needs: 1
    unless:
      # Preload exploit payloads are shared objects (.so); standalone executables have PT_INTERP.
      - id: metadata/binary/linking/runtime::interpreter

  # Forking outbound payload: connect distinguishes it from a listener.
  - id: ld-preload-forking-reverse-shell
    desc: Forking LD_PRELOAD reverse shell
    conf: 0.96
    size_max: 5242880
    all:
      - id: micro-behaviors/os/env/runtime::ld-preload
      - id: micro-behaviors/communications/socket/create::posix-socket-import
      - id: micro-behaviors/communications/socket/connect/attempt::connect-symbol
      - id: micro-behaviors/process/fd/dup::dup2
      - id: micro-behaviors/process/create/fork::fork
      - id: micro-behaviors/process/replace::c-exec-variants
    any:
      - id: micro-behaviors/fs/path/application/interpreter::bin-sh-path-reference
      - id: micro-behaviors/fs/path/application/interpreter::bash-path-reference
    needs: 1
    unless:
      # Preload exploit payloads are shared objects (.so); standalone executables have PT_INTERP.
      - id: metadata/binary/linking/runtime::interpreter
