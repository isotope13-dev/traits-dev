# A Windows PE that connects an outbound Winsock socket and assigns that
# same socket handle to a spawned process's standard streams is a reverse
# shell, even when the host and command strings are decoded at runtime.
defaults:
  platforms: [windows]
  for: [pe]
  arch: [x86]
  attack: T1059.003
  mbc: B0030.002

composite_rules:
  - id: winsock-startupinfo-stdio-reverse-shell
    desc: Winsock socket feeds spawned-process stdio
    crit: hostile
    conf: 0.96
    all:
      - id: micro-behaviors/process/fd/stdio::pe-startupinfo-same-handle-stdio
      - id: micro-behaviors/process/create/spawn::create-process-w
      - id: micro-behaviors/communications/socket/connect::connect-api-ordinal
      - id: micro-behaviors/communications/socket/init::winsock-startup-ordinal
      - id: micro-behaviors/communications/socket/init::wsa-socket
      - id: objectives/anti-static/obfuscation/encoding/xor::i386-stack-key-xor-loop

  - id: winsock-startupinfo-stdio-reverse-shell-x64
    desc: x64 Winsock socket feeds spawned-process stdio
    crit: hostile
    conf: 0.96
    arch: [x86-64]
    all:
      - id: micro-behaviors/process/fd/stdio::pe-startupinfo-same-handle-stdio-x64
      - id: micro-behaviors/process/create/spawn::create-process-w
      - id: micro-behaviors/communications/socket/init::winsock-startup-ordinal
      - id: micro-behaviors/communications/socket/init::wsa-socket
      - id: micro-behaviors/communications/socket/receive::recv-api-ordinal
    any:
      - id: micro-behaviors/communications/socket/connect::connect-api-ordinal
      - id: micro-behaviors/communications/socket/init::wsa-connect

  - id: winsock-dns-connect-back-command-shell-pe
    desc: Resolves host then runs commands over Winsock
    crit: hostile
    conf: 0.95
    arch: [x86-64]
    all:
      - id: micro-behaviors/process/fd/stdio::pe-startupinfo-same-handle-stdio-x64
      - id: micro-behaviors/communications/dns/lookup::winsock-name-resolution-ordinal
      - id: micro-behaviors/process/create/spawn::create-process-w
      - id: micro-behaviors/communications/socket/init::winsock-startup-ordinal
      - id: micro-behaviors/communications/socket/receive::recv-api-ordinal
    any:
      - id: micro-behaviors/communications/socket/connect::connect-api-ordinal
      - id: micro-behaviors/communications/socket/init::wsa-connect
