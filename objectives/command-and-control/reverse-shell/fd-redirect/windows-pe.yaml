# A Windows PE that connects an outbound Winsock socket and assigns that
# same socket handle to a spawned process's standard streams is a reverse
# shell, even when the host and command strings are decoded at runtime.
defaults:
  platforms: [windows]
  for: [pe]
  arch: [x86]
  attack: T1059.003
  mbc: B0030.002

composite_rules:
  - id: winsock-startupinfo-stdio-reverse-shell
    desc: Winsock socket feeds spawned-process stdio
    crit: hostile
    conf: 0.96
    all:
      - id: micro-behaviors/process/stdio/configure::pe-startupinfo-same-handle-stdio
      - id: metadata/binary/symbols/name/process::create-process-w
      - id: micro-behaviors/communications/socket/connect/attempt::connect-api-ordinal
      - id: micro-behaviors/communications/socket/init::winsock-startup-ordinal
      - id: micro-behaviors/communications/socket/init::wsa-socket
      - id: micro-behaviors/data/encoding/xor/cyclic-key::i386-stack-key-xor-loop

  - id: winsock-startupinfo-stdio-reverse-shell-x64
    desc: x64 Winsock socket feeds spawned-process stdio
    crit: hostile
    conf: 0.96
    arch: [x86-64]
    all:
      - id: micro-behaviors/process/stdio/configure::pe-startupinfo-same-handle-stdio-x64
      - id: metadata/binary/symbols/name/process::create-process-w
      - id: micro-behaviors/communications/socket/init::winsock-startup-ordinal
      - id: micro-behaviors/communications/socket/init::wsa-socket
      - id: micro-behaviors/communications/socket/receive::recv-api-ordinal
    any:
      - id: micro-behaviors/communications/socket/connect/attempt::connect-api-ordinal
      - id: micro-behaviors/communications/socket/init::wsa-connect

  - id: winsock-dns-connect-back-command-shell-pe
    desc: Resolves host then runs commands over Winsock
    crit: hostile
    conf: 0.95
    arch: [x86-64]
    all:
      - id: micro-behaviors/process/stdio/configure::pe-startupinfo-same-handle-stdio-x64
      - id: micro-behaviors/communications/dns/lookup::winsock-name-resolution-ordinal
      - id: metadata/binary/symbols/name/process::create-process-w
      - id: micro-behaviors/communications/socket/init::winsock-startup-ordinal
      - id: micro-behaviors/communications/socket/receive::recv-api-ordinal
    any:
      - id: micro-behaviors/communications/socket/connect/attempt::connect-api-ordinal
      - id: micro-behaviors/communications/socket/init::wsa-connect

  # Stack-frame STARTUPINFO variant with no decoder requirement: one handle
  # in all three std slots plus an outbound connect is the classic
  # connect-back cmd shell.
  - id: winsock-connected-socket-child-stdio
    desc: Outbound socket becomes a child's console
    crit: hostile
    conf: 0.95
    all:
      - id: micro-behaviors/process/stdio/relay::pe-winsock-handle-as-child-stdio
    any:
      - id: micro-behaviors/communications/socket/connect/attempt::connect-api
      - id: micro-behaviors/communications/socket/connect/attempt::connect-api-ordinal
      - id: micro-behaviors/communications/socket/init::wsa-connect

  # x64 counterpart: no dependence on ordinal versus by-name Winsock imports
  # or on which register carries the socket handle.
  - id: winsock-connected-socket-child-stdio-x64
    desc: x64 outbound socket becomes a child's console
    crit: hostile
    conf: 0.95
    arch: [x86-64]
    all:
      - id: micro-behaviors/process/stdio/relay::pe-winsock-handle-as-child-stdio-x64
    any:
      - id: micro-behaviors/communications/socket/connect/attempt::connect-api
      - id: micro-behaviors/communications/socket/connect/attempt::connect-api-ordinal
      - id: micro-behaviors/communications/socket/init::wsa-connect
