# The opcode carrier, rather than the generator's language, filename, model
# class, endpoint or archive format, supplies the deserialization context.
# Do not require successful parsing of the complete pickle: a corrupt length
# or trailing instruction must not hide the embedded reverse-shell source.
defaults:
  for: [pickle]
  platforms: [unix]
composite_rules:
  - id: pickle-socket-pty-shell
    desc: Pickle embeds socket-to-PTY reverse-shell source
    crit: hostile
    conf: 0.98
    attack: T1059.006
    mbc: B0030.002
    near_bytes: 2048
    all:
      - id: metadata/import/builtin::pickle-builtins-exec
      - id: micro-behaviors/process/fd/dup::inline-python-socket-dup2
      - id: micro-behaviors/process/create/shell/spawn::pickle-pty-shell-spawn
