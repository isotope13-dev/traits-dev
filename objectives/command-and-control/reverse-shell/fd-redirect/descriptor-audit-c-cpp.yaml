  - id: micro-behaviors/process/create/exec::execve-import
  - id: micro-behaviors/process/interpreter/shell::unix-shell-executable-path
  unless:
  - id: micro-behaviors/communications/ssh/connect::libssh-proxycommand-source
  - id: micro-behaviors/process/create/shell/command-string::posix-tunnel-shell-spawn-source
  - id: micro-behaviors/os/container/oci/
