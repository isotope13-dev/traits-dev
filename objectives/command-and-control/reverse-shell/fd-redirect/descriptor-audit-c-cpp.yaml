# Descriptor audit: neutral observations and explicit shell relay mechanisms.
defaults:
  platforms:
    - unix
  attack: T1059.004
composite_rules:
  - id: source-execve-fd-redirect-shell
    desc: C execve shell with socket stdio
    for:
      - c
      - cpp
    crit: hostile
    conf: 0.98
    mbc: B0030.002
    all:
      - id: metadata/file/profile/co-occurrence/network-process::source-socket-fd-redirect
      - id: metadata/binary/symbols/name/process::execve-import
      - id: micro-behaviors/fs/path/application/interpreter::unix-shell-executable-path
    unless:
      - id: micro-behaviors/communications/ssh/connect::libssh-proxycommand-source
      - id: micro-behaviors/process/create/shell/command-string::posix-tunnel-shell-spawn-source
      - id: micro-behaviors/os/container/oci/
      - id: micro-behaviors/communications/socket/vsock/
      - id: metadata/package/testing/presence/harness::c-source-test-directory
  - id: posix-fd-redirect-shell
    desc: POSIX shell with socket fd redirection
    for:
      - elf
      - so
    crit: suspicious
    conf: 0.85
    mbc: B0022
    scope: leaf
    size_max: 20000000
    all:
      - id: metadata/file/profile/socket-api::connect
      - id: micro-behaviors/process/fd/dup::dup2
      - id: metadata/binary/symbols/name/process::execve-fn
    any:
      - id: micro-behaviors/fs/path/application/interpreter::bin-sh-path-reference
      - id: micro-behaviors/process/create/shell/interactive::bin-sh-interactive
      - id: micro-behaviors/process/create/shell/spawn::usr-bin-sh
      - id: micro-behaviors/fs/path/application/interpreter::bash-path-reference
    unless:
      - id: metadata/file/profile/string-population::rich-sentence-strings-20pct
    # Runtime libraries may export the complete socket and process API surface.
    downgrade:
      any:
        - id: metadata/binary/symbols/count::many-exports-1000
  - id: unix-dual-mode-socket-exec-redirect
    desc: Socket bind, connect, shell and dup2 API profile
    for:
      - elf
      - so
    crit: suspicious
    conf: 0.96
    mbc: B0022
    scope: leaf
    size_max: 20000000
    all:
      - id: metadata/file/profile/socket-api::connect
      - id: micro-behaviors/communications/socket/listen::listen
      - id: micro-behaviors/communications/socket/accept::accept-sym
      - id: micro-behaviors/communications/socket/bind/function::bind
      - id: micro-behaviors/process/fd/dup::dup2
      - id: metadata/binary/symbols/name/process::c-exec-variants
    any:
      - id: micro-behaviors/fs/path/application/interpreter::bin-sh-path-reference
      - id: micro-behaviors/process/create/shell/interactive::bin-sh-interactive
      - id: micro-behaviors/process/create/shell/spawn::usr-bin-sh
      - id: micro-behaviors/fs/path/application/interpreter::bash-path-reference
    unless:
      - id: metadata/binary/header/identity::shared-object-type
  - id: unix-terminal-socket-exec-backdoor
    desc: Socket and shell APIs with terminal control
    for:
      - elf
      - so
    crit: suspicious
    conf: 0.94
    mbc: B0022,B0024
    scope: leaf
    size_max: 20000000
    all:
      - id: metadata/binary/header/identity::elf-executable-type
      - id: metadata/file/profile/socket-api::connect
      - id: micro-behaviors/process/fd/dup::dup2
      - id: metadata/binary/symbols/name/process::c-exec-variants
      - id: micro-behaviors/process/create/shell/
      - id: micro-behaviors/process/tty/terminal::terminal-attribute-control
    any:
      - id: micro-behaviors/fs/path/device/terminal::dev-tty
      - id: micro-behaviors/process/tty/terminal::tty-markers
  - id: unix-socket-popen-redirect-backdoor
    desc: Socket, subprocess and descriptor-duplication APIs
    for:
      - elf
      - so
    crit: suspicious
    conf: 0.93
    mbc: B0022
    size_max: 20000000
    all:
      - id: metadata/file/profile/socket-api::connect
      - id: micro-behaviors/process/fd/dup::dup2
      - id: micro-behaviors/process/create/shell/native::c-popen
      - id: metadata/binary/symbols/name/process::c-exec-variants
    any:
      - id: micro-behaviors/os/console/io::null-redirect-stdout-stderr
      - id: micro-behaviors/communications/http/authorization-header::auth-header
  - id: c-revshell-execve-shell-fd-redirect
    desc: C shell target with socket stdio
    for:
      - c
      - cpp
    crit: hostile
    conf: 0.99
    mbc: B0030.002
  # connect, dup2 onto stdio, execve, and the shell path must be one
  # redirect. A utility file can hold each call in a different helper.
    near_lines: 40
    all:
      - id: metadata/file/profile/socket-api::connect
      - id: micro-behaviors/process/fd/dup::source-dup2-stdio
      - id: metadata/binary/symbols/name/process::execve-import
      - id: micro-behaviors/fs/path/application/interpreter::unix-shell-executable-path
    unless:
      - id: well-known/tool/detection/llm-scanner::llm-scanner-context
