# Require socket provenance at dup2 and shell-path provenance at exec.
# Nearby independent helpers or quoted relay examples are insufficient.
defaults:
  platforms: [unix]
  for: [c, cpp]
  attack: T1059.004
  mbc: B0030.002
composite_rules:
  - id: source-execve-fd-redirect-shell
    desc: C socket stdio relay launches shell
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/communications/socket/connect/attempt::connect
      - id: micro-behaviors/process/fd/dup::source-socket-stdio-redirect
      - id: micro-behaviors/process/replace::c-exec-shell-target
    unless:
      - id: micro-behaviors/communications/ssh/connect::libssh-proxycommand-source
      - id: micro-behaviors/process/replace::posix-tunnel-shell-spawn-source
      - id: micro-behaviors/os/container/oci/
      - id: micro-behaviors/communications/socket/vsock/
      - id: metadata/package/testing/presence/harness::c-source-test-directory
      - id: well-known/tool/detection/llm-scanner::llm-scanner-context
