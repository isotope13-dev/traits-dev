# Descriptor audit: neutral observations and explicit shell relay mechanisms.
defaults:
  for:
  - python
composite_rules:
- id: python-dup2-shell
  desc: Python socket-descriptor shell
  platforms:
  - unix
  - windows
  crit: suspicious
  unless:
  - id: metadata/package/testing/corpus::yaml-heuristic-source-fragment
  - id: metadata/package/testing/corpus::ran-bundled-adversary-templates
  - id: well-known/tool/offensive/
  conf: 0.95
  attack: T1059.006
  all:
  - id: micro-behaviors/process/fd/dup::python-dup2-io-redirect
  - id: micro-behaviors/process/create/subprocess::call-ast
  any:
  - id: micro-behaviors/process/create/shell/spawn::python-bash-path
  - id: micro-behaviors/process/interpreter/shell::bin-sh
  - id: micro-behaviors/process/create/shell/spawn::bin-shell
- id: inline-python-reverse-shell
  desc: Python connects socket to interactive shell
  platforms:
  - unix
  - windows
  crit: hostile
  conf: 0.99
  attack: T1059.006
  mbc: B0030.002
  all:
  - id: micro-behaviors/communications/socket/connect::connect-python
  - id: micro-behaviors/process/fd/dup::inline-python-socket-dup2
  - id: micro-behaviors/process/create/shell/interactive::python-subprocess-interactive-shell
  any:
  - id: micro-behaviors/process/create/shell/lang::python-c-flag
  - id: micro-behaviors/process/interpreter/shell::bin-sh
  - id: micro-behaviors/process/create/shell/spawn::bin-shell
  unless:
  - id: metadata/package/testing/corpus::ran-bundled-adversary-templates
  - id: well-known/lib/ai/unsloth::unsloth-package-context
  - id: well-known/tool/offensive/
  - id: well-known/tool/detection/agent-glovebox::staticscan-reverse-shell-fixture-context
- id: inline-python-reverse-shell-c2
  desc: Inline Python reverse shell with C2
  platforms:
  - unix
  - windows
  crit: hostile
  conf: 0.995
  attack: T1059.006
  mbc: B0030.002
  all:
  - id: objectives/command-and-control/reverse-shell/fd-redirect::inline-python-reverse-shell
  - id: micro-behaviors/communications/socket/dial::python-connect-ip-port
- id: combo-reverse-shell
  desc: Socket and shell with stdio duplication
  platforms:
  - unix
  unless:
  - id: micro-behaviors/ui/help::escaped-local-command-reference
  - id: metadata/package/testing/corpus::yaml-heuristic-source-fragment
  - id: metadata/package/testing/corpus::ran-bundled-adversary-templates
  - id: well-known/tool/offensive/pentestkit::local-storage-panel
  crit: hostile
  mbc: B0030.002
  attack: T1059
  conf: 0.95
  all:
  - id: micro-behaviors/communications/socket/connect::socket-connect-method
  - id: micro-behaviors/process/fd/dup::python-dup2
  - id: micro-behaviors/process/fd/stdio::py-stdio-dup2
  any:
  - id: micro-behaviors/process/interpreter/shell::bin-sh
  - id: micro-behaviors/process/create/shell/spawn::bin-shell
  downgrade:
    any:
    - id: micro-behaviors/dylib/library/family/
- id: python-fd-redirect-shell
  desc: Connected socket feeds shell descriptor input
  platforms:
  - unix
  crit: hostile
  mbc: B0030
  attack: T1059.006
  conf: 0.98
  near_lines: 80
  unless:
  - id: well-known/tool/offensive/xxgaruda::product-tagline
  all:
  - id: micro-behaviors/process/create/shell/command-mode::python-os-system
  - id: micro-behaviors/process/create/shell/spawn::bin-sh-interactive
  - id: micro-behaviors/process/create/shell/fd::shell-stdin-fd-redirect
  - id: micro-behaviors/process/fd/query::python-fileno
  - id: micro-behaviors/communications/socket/connect::python-tuple-address-connect-call
- id: python-socket-fileno-shell
  desc: Shell receives socket descriptors as stdio
  platforms:
  - unix
  - windows
  crit: hostile
  conf: 0.97
  attack: T1059.006,T1571
  mbc: B0022
  size_max: 50000
  all:
  - id: micro-behaviors/process/fd/query::python-fileno
  - id: micro-behaviors/communications/socket/connect::socket-connect-method
  - id: micro-behaviors/process/fd/stdio::python-stdin-fileno-argument
  - id: micro-behaviors/process/fd/stdio::python-stdout-fileno-argument
  any:
  - id: micro-behaviors/process/create/shell/spawn::python-bash-path
  - id: micro-behaviors/process/interpreter/shell::bin-sh
  unless:
  - id: well-known/tool/offensive/
  - id: metadata/import/python/unittest
  - id: metadata/package/testing/scripted::pytest
  - id: well-known/tool/detection/agent-glovebox::staticscan-reverse-shell-fixture-context
  - id: well-known/lib/ai/unsloth::unsloth-package-context
