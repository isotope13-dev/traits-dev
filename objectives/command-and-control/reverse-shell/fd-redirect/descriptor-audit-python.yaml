# Reverse shells require an outbound socket coupled to shell I/O.
# Endpoint-literal aliases and path-only shell composites are deliberately
# omitted: endpoint facts already surface, and a shell path is not execution.
# Keep the one path-only fixture exception to a specific fixture directory; the
# broader release-tree path is unnecessary once that directory is present.
defaults:
  for:
  - python
  attack: T1059.006
composite_rules:
- id: inline-python-reverse-shell
  desc: Python socket-to-shell payload with redirected I/O
  platforms:
  - unix
  - windows
  crit: hostile
  conf: 0.99
  mbc: B0030.002
  all:
  - id: micro-behaviors/communications/socket/connect/attempt::connect-python
  - id: micro-behaviors/process/fd/dup::inline-python-socket-dup2
  - id: micro-behaviors/process/create/shell/interactive::python-interactive-shell-launch
  any:
  - id: micro-behaviors/process/deploy/interpreter-command::python-c-flag
  - id: micro-behaviors/fs/path/application/interpreter::unix-shell-executable-path
  - id: micro-behaviors/fs/path/executable::bin-shell
  unless:
  - id: well-known/tool/detection/agent-glovebox::staticscan-fixture-dirname
  - id: objectives/command-and-control/reverse-shell/fd-redirect::embedded-shell-documentation-context
  - id: metadata/package/testing/corpus/adversary-templates::ran-bundled-adversary-templates
  - id: metadata/package/testing/corpus/adversary-templates::disabled-placeholder-reverse-shell-template
  - id: metadata/package/documentation/security-testing::scanner-playground-threat-example
  - id: well-known/tool/detection/code-analysis/semgrep::rule-pack-fixture
  - id: well-known/tool/detection/agent/cc-audit::bypass-fixture-context
  downgrade:
    scope: archive
    any:
    - id: well-known/tool/detection/agent/cc-audit::cc-audit-source-package-identity
- id: python-fd-redirect-shell
  desc: Connected socket feeds shell descriptor input
  platforms:
  - unix
  crit: hostile
  mbc: B0030
  conf: 0.98
  near_lines: 80
  unless:
  - id: well-known/tool/offensive/xxgaruda::product-tagline
  - id: metadata/package/testing/corpus/adversary-templates::disabled-placeholder-reverse-shell-template
  all:
  - id: micro-behaviors/process/create/shell/command-mode::python-os-system
  - id: micro-behaviors/process/interpreter/shell::bin-sh-interactive
  - id: micro-behaviors/process/fd/stdio::shell-stdin-fd-redirect
  - id: micro-behaviors/process/fd/query::python-fileno
  - id: micro-behaviors/communications/socket/connect/attempt::python-tuple-address-connect-call
- id: python-socket-fileno-shell
  desc: Shell receives socket descriptors as stdio
  platforms:
  - unix
  - windows
  crit: hostile
  conf: 0.97
  mbc: B0030.002
  size_max: 50000
  all:
  - id: micro-behaviors/process/fd/query::python-fileno
  - id: micro-behaviors/communications/socket/connect/attempt::socket-connect-method
  - id: micro-behaviors/process/fd/stdio::python-stdin-fileno-argument
  - id: micro-behaviors/process/fd/stdio::python-stdout-fileno-argument
  any:
  - id: micro-behaviors/fs/path/application/interpreter::unix-shell-executable-path
  unless:
  - id: objectives/command-and-control/reverse-shell/fd-redirect::embedded-shell-documentation-context
  - id: metadata/package/testing/corpus/adversary-templates::disabled-placeholder-reverse-shell-template
  - id: metadata/package/documentation/security-testing::scanner-playground-threat-example
  - id: micro-behaviors/metaprogramming/generation/source::configured-assessment-plugin
# Same socket-to-stdio redirect as inline-python-reverse-shell, but the shell
# is started through os.exec*, os.spawn* or os.system instead of subprocess.
- id: python-socket-dup2-os-shell
  desc: Python socket stdio redirect then OS shell launch
  platforms:
  - unix
  crit: hostile
  conf: 0.98
  mbc: B0030.002
  near_lines: 30
  all:
  - id: micro-behaviors/process/fd/dup::inline-python-socket-dup2
  - id: micro-behaviors/process/fd/dup::py-stdio-dup2
  - id: micro-behaviors/fs/path/application/interpreter::unix-shell-executable-path
  any:
  - id: micro-behaviors/process/replace::python-os-exec-call
  - id: micro-behaviors/process/create/exec::python-os-spawn-call
  - id: micro-behaviors/process/create/shell/command-mode::python-os-system
  unless:
  - id: well-known/tool/detection/agent-glovebox::staticscan-fixture-dirname
  - id: objectives/command-and-control/reverse-shell/fd-redirect::embedded-shell-documentation-context
  - id: metadata/package/testing/corpus/adversary-templates::ran-bundled-adversary-templates
  - id: metadata/package/testing/corpus/adversary-templates::disabled-placeholder-reverse-shell-template
  - id: metadata/package/documentation/security-testing::scanner-playground-threat-example
  - id: well-known/tool/detection/code-analysis/semgrep::rule-pack-fixture
# socket.create_connection returns an already-connected socket, so the classic
# socket.socket + connect pairing never appears; the dup2 relay is the same.
- id: python-create-connection-dup2-shell
  desc: Python create_connection stdio redirect then shell
  platforms:
  - unix
  crit: hostile
  conf: 0.97
  mbc: B0030.002
  near_lines: 30
  all:
  - id: micro-behaviors/process/fd/dup::create-connection-python-dup2
  - id: micro-behaviors/fs/path/application/interpreter::unix-shell-executable-path
  any:
  - id: micro-behaviors/process/create/shell/interactive::python-interactive-shell-launch
  - id: micro-behaviors/process/replace::python-os-exec-call
  - id: micro-behaviors/process/create/exec::python-os-spawn-call
  - id: micro-behaviors/process/create/shell/command-mode::python-os-system
  - id: micro-behaviors/process/tty/pty::python-pty-shell-call
  unless:
  - id: well-known/tool/detection/agent-glovebox::staticscan-fixture-dirname
  - id: objectives/command-and-control/reverse-shell/fd-redirect::embedded-shell-documentation-context
  - id: metadata/package/testing/corpus/adversary-templates::ran-bundled-adversary-templates
  - id: metadata/package/testing/corpus/adversary-templates::disabled-placeholder-reverse-shell-template
  - id: metadata/package/documentation/security-testing::scanner-playground-threat-example
  - id: well-known/tool/detection/code-analysis/semgrep::rule-pack-fixture
