# Outbound twin of ruby-accepted-socket-descriptor-shell: the descriptors
# formatted into `/bin/sh -i <&%d >&%d 2>&%d` (or handed to spawn as the
# child's stdio) belong to a socket this script connected, so the remote
# peer drives an interactive shell.
defaults:
  for: [ruby]
  platforms: [unix, windows]
  attack: T1059.004
  mbc: B0030.002

composite_rules:
  - id: ruby-connected-socket-descriptor-shell
    desc: Wires a connected socket to a shell
    crit: hostile
    conf: 0.97
    near_lines: 12
    all:
      - id: micro-behaviors/communications/socket/connect/tcp::ruby-socket-connect
      - id: objectives/command-and-control/remote-command/shell::ruby-interactive-shell-fd-redirection
      - id: micro-behaviors/fs/path/application/interpreter::unix-shell-executable-path
    unless:
      - id: well-known/tool/detection/llm-scanner::llm-scanner-context
      - id: well-known/lib/network/net-ssh/

  - id: ruby-spawn-socket-stdio-shell
    desc: Spawns a shell with socket stdio
    crit: hostile
    conf: 0.97
    near_lines: 3
    all:
      - id: micro-behaviors/process/fd/stdio::ruby-spawn-stdio-to-tcp-socket
      - id: micro-behaviors/process/create/exec::ruby-spawn
      - id: micro-behaviors/fs/path/application/interpreter::unix-shell-executable-path
    unless:
      - id: well-known/tool/detection/llm-scanner::llm-scanner-context
