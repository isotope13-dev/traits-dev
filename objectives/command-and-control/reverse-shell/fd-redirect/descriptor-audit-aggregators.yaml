# Descriptor audit: neutral observations and explicit shell relay mechanisms.
defaults:
  for:
    - python
    - c
  platforms:
    - linux
    - macos
    - windows
  crit: hostile
  conf: 0.99
  attack: T1059
  mbc: B0030
composite_rules:
  - id: socket-dup2-shell-exec
    desc: Socket dial with stdio duplication and shell
    scope: leaf
    near_lines: 80
    all:
      - id: micro-behaviors/communications/socket/dial/
      - id: micro-behaviors/process/fd/dup::dup2
      - id: micro-behaviors/fs/path/application/interpreter::unix-shell-executable-path
    any:
      - id: micro-behaviors/process/create/shell/interactive::c-exec-interactive-shell
      - id: micro-behaviors/process/create/shell/interactive::sh-interactive
      - id: micro-behaviors/process/create/shell/interactive::bin-sh-interactive
      - id: metadata/file/profile/operation-reference::ruby-shell-exec
      - id: metadata/lang/source/syntax/call/construction::go-exec-command-bin-sh
      - id: micro-behaviors/process/create/shell/spawn::java-runtime-exec-shell-array
      - id: metadata/lang/source/syntax/command/pipeline::pipe-to-absolute-shell-path
      - id: micro-behaviors/process/create/shell/spawn::bash-exec
      - id: micro-behaviors/process/create/shell/command-string::sh-c-exec
    unless:
      - id: well-known/app/storage/community-scripts-proxmoxve::mirror-connectivity-context
      - id: well-known/tool/detection/llm-scanner/
      - id: metadata/file/profile/security-scanner/
      - id: metadata/build/recognized-contexts::benign-app-fp-context
