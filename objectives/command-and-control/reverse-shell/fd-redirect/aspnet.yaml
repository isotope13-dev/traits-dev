defaults:
  platforms: [windows]
  for: [html, csharp, asp]
  attack: T1505.003
  mbc: B0030

traits:
  - id: aspnet-runs-process-over-socket-stdio
    desc: ASP.NET process redirects socket to stdio
    crit: suspicious
    conf: 0.99
    if:
      type: text
      regex: '(?is)CreateProcess(AsUser)?\s*\([\s\S]{0,1000}hStdInput\s*=\s*oursocket[\s\S]{0,160}hStdOutput\s*=\s*oursocket[\s\S]{0,160}hStdError\s*=\s*oursocket'

composite_rules:
  - id: aspnet-callback-reverse-shell
    desc: Outbound socket drives process stdio
    crit: hostile
    conf: 0.99
    all:
      - id: micro-behaviors/communications/http/server/managed::aspnet-server-side-script-block
      - id: micro-behaviors/communications/socket/create::aspnet-creates-outbound-native-socket
      - id: aspnet-runs-process-over-socket-stdio
