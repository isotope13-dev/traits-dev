defaults:
  platforms: [windows]
  for: [html, csharp, asp]
  attack: T1505.003
  mbc: B0030

traits:
  - id: aspnet-runs-process-over-socket-stdio
    desc: ASP.NET process redirects socket to stdio
    crit: suspicious
    conf: 0.99
    if:
      type: text
      # All three STARTUPINFO std handles bound to a socket variable. Those
      # fields exist only to be handed to CreateProcess, so the handle
      # assignments alone carry the redirect; the variable name is not fixed.
      regex: '(?is)hStdInput\s*=\s*\w*sock.{0,160}StdOutput\s*=\s*\w*sock.{0,160}StdError\s*=\s*\w*sock'

composite_rules:
  - id: aspnet-callback-reverse-shell
    desc: Outbound socket drives process stdio
    crit: hostile
    conf: 0.99
    all:
      - id: micro-behaviors/communications/http/server/managed::aspnet-server-side-script-block
      - id: micro-behaviors/communications/socket/create::aspnet-creates-outbound-native-socket
      - id: aspnet-runs-process-over-socket-stdio
