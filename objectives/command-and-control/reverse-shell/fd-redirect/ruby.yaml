defaults:
  for: [ruby]
  platforms: [unix, windows]
  attack: T1059
  mbc: B0030.002

composite_rules:
  - id: ruby-reopened-stdio-shell
    desc: Connects a socket and reopens shell stdio
    crit: hostile
    conf: 0.98
    near_lines: 12
    all:
      - id: micro-behaviors/communications/socket/connect::ruby-socket-connect
      - id: micro-behaviors/process/fd/stdio::ruby-stdin-reopen
      - id: micro-behaviors/process/fd/stdio::ruby-output-stream-reopen
      - id: micro-behaviors/process/create/shell/lang::ruby-exec
      - id: micro-behaviors/fs/path/application/executable::unix-shell-executable-path
    unless:
      - id: well-known/tool/detection/llm-scanner/
      - id: well-known/lib/network/net-ssh/

  # The listening twin of the rule above: the descriptors handed to /bin/sh -i
  # are the accepted client socket's, so the connection itself becomes the
  # shell's stdin, stdout and stderr. The bind-shell verdict lives in
  # backdoor/bind-shell; this one records the descriptor wiring.
  - id: ruby-accepted-socket-descriptor-shell
    desc: Wires an accepted socket to a shell
    crit: hostile
    conf: 0.96
    near_lines: 12
    all:
      - id: micro-behaviors/communications/socket/listen::ruby-tcp-server-accept-call
      - id: micro-behaviors/process/fd/stdio::ruby-interactive-shell-fd-redirection
      - id: micro-behaviors/process/create/shell/lang::ruby-exec
      - id: micro-behaviors/fs/path/application/executable::unix-shell-executable-path
    unless:
      - id: well-known/tool/detection/llm-scanner/
      - id: well-known/lib/network/net-ssh/
