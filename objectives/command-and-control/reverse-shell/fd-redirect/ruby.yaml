defaults:
  for: [ruby]
  platforms: [unix, windows]
  attack: T1059
  mbc: B0030.002

composite_rules:
  - id: ruby-reopened-stdio-shell
    desc: Connects a socket and reopens shell stdio
    crit: hostile
    conf: 0.98
    near_lines: 12
    all:
      - id: micro-behaviors/communications/socket/connect::ruby-socket-connect
      - id: micro-behaviors/process/fd/stdio::ruby-stdin-reopen
      - id: micro-behaviors/process/fd/stdio::ruby-stdout-reopen
      - id: micro-behaviors/process/create/shell/lang::ruby-exec
      - id: micro-behaviors/process/interpreter/shell::bin-sh
    unless:
      - id: well-known/tool/detection/llm-scanner/
      - id: well-known/lib/network/net-ssh/
