# Exact context bundle for source-generation and placeholder examples that
# are not connected reverse shells by themselves.
defaults:
  platforms: [unix, windows]
  for: [python, javascript, text]
  crit: notable
  conf: 0.97

composite_rules:
  - id: embedded-shell-documentation-context
    desc: Embedded shell templates and documentation context
    crit: exception
    any:
      - id: metadata/lang/source/origin::yaml-plain-source-layer-path
      - id: micro-behaviors/communications/http/url/github::placeholder-repository-url
      - id: micro-behaviors/data/collection/map::documentation-octet-table
      - id: micro-behaviors/metaprogramming/generation::configured-assessment-plugin
