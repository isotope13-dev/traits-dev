defaults:
  for: [javascript]
  platforms: [unix]
  attack: T1059.004,T1059.007

traits:
  - id: node-relay-command-template
    desc: Declares a variable named command
    crit: component
    conf: 0.98
    if:
      type: text
      substr: 'const command = `'
  - id: node-relay-tcp-fd
    desc: Opens shell TCP file descriptor
    crit: notable
    conf: 0.98
    if:
      type: text
      regex: 'exec 5<>/dev/tcp/[0-9.]+/[0-9]+'
  - id: node-relay-read-loop
    desc: Reads commands from socket descriptor
    crit: notable
    conf: 0.98
    if:
      type: text
      substr: 'cat <&5 | while read line'
  - id: node-relay-attempt-execute
    desc: Attempts to execute received line
    crit: notable
    conf: 0.98
    if:
      type: text
      substr: 'do \$line 2>&5 >&5; done'
  - id: node-relay-exec-command
    desc: Executes command on module load
    crit: notable
    conf: 0.98
    if:
      type: text
      regex: '(?m)^exec\(command, \(error\) =>'

composite_rules:
  - id: node-attempt-tcp-command-relay
    desc: Attempts socket command relay on import
    crit: suspicious
    conf: 0.98
    scope: file
    # The backslash before $line is consumed by the JavaScript template.
    # The outer shell then expands it before bash executes the command, so
    # the received line is not reliably executed by this particular payload.
    all:
      - id: metadata/package/files/included::javascript-index-basename
      - id: metadata/import/builtin::child-process-exec-destructure
      - id: node-relay-command-template
      - id: node-relay-tcp-fd
      - id: node-relay-read-loop
      - id: node-relay-attempt-execute
      - id: node-relay-exec-command
  - id: npm-module-attempt-tcp-command-relay
    desc: Package import attempts TCP command relay
    crit: hostile
    conf: 0.98
    scope: archive
    for: [zip, npm, javascript, package.json]
    all:
      - id: node-attempt-tcp-command-relay
      - id: metadata/package/entrypoint/module::has-index-entry
