# Match the encoded Bash TCP redirection syntax, never an endpoint or package
# identity. Decoding and Node shell execution must coexist in the same file.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  conf: 0.98
  attack: T1059.004,T1027,T1059.007
traits:
  - id: rot13-base64-bash-tcp-redirect-literal
    desc: ROT13/Base64 Bash TCP redirect literal
    crit: notable
    if:
      type: text
      regex: '["'']LzSmnPN(gLlNaLzSmnPN)?gnFN\+WvNiMTI2Y3EwpP[89][A-Za-z0-9_+/-]{8,}={0,2}["'']'
composite_rules:
  - id: node-rot13-base64-tcp-shell-execution
    desc: Node decodes and executes an encoded Bash TCP shell
    crit: hostile
    scope: file
    near_bytes: 1800
    all:
      - id: rot13-base64-bash-tcp-redirect-literal
      - id: micro-behaviors/data/decode/base64::buffer-from-base64
      - id: metadata/import/builtin::child-process-module-reference
    any:
      - id: micro-behaviors/process/create/shell/bridge::js-exec
      - id: micro-behaviors/process/create/shell/bridge::child-process-compiled-exec-call
    unless:
      - id: well-known/tool/detection/pattern-catalog::js-threat-data-catalog
      - id: metadata/package/testing/harness/runtime/
