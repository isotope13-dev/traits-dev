defaults:
  for: [python]
  platforms: [unix, windows]

traits:
  # Module-level shapes: the subprocess call (Popen, call, run, ...) bare or
  # assigned, and its stdio given either as the socket object or as
  # socket.fileno(), plus a string command run through shell=True. Keep the
  # bare-object expression pattern first: with the fileno form leading, no
  # pattern in this query matched the Popen fixtures in cleave test-rules.
  - id: python-connected-socket-subprocess-shell
    desc: Connected socket supplies shell standard streams
    crit: hostile
    conf: 0.99
    attack: T1059.006
    if:
      type: tree-sitter
      query: |
        ((module
          (expression_statement (call function: (attribute object: (identifier) @socket1 attribute: (identifier) @connect)))
          (expression_statement (call function: (attribute object: (identifier) @subprocess attribute: (identifier) @popen)
            arguments: (argument_list (list . (string) @shell)
              (keyword_argument name: (identifier) @stdin value: (identifier) @socket2)
              (keyword_argument name: (identifier) @stdout value: (identifier) @socket3)
              (keyword_argument name: (identifier) @stderr value: (identifier) @socket4)))))
          (#eq? @connect "connect") (#eq? @subprocess "subprocess") (#match? @popen "^(Popen|call|run|check_call|check_output)$")
          (#eq? @stdin "stdin") (#eq? @stdout "stdout") (#eq? @stderr "stderr")
          (#eq? @socket1 @socket2) (#eq? @socket1 @socket3) (#eq? @socket1 @socket4)
          (#match? @shell "^.(/(usr/)?bin/)?(bash|sh|zsh|cmd)([.]exe)?.$"))
        ((module
          (expression_statement (call function: (attribute object: (identifier) @socket1 attribute: (identifier) @connect)))
          (expression_statement (call function: (attribute object: (identifier) @subprocess attribute: (identifier) @popen)
            arguments: (argument_list (list . (string) @shell)
              (keyword_argument name: (identifier) @stdin value: (call function: (attribute object: (identifier) @socket2 attribute: (identifier) @fileno1)))
              (keyword_argument name: (identifier) @stdout value: (call function: (attribute object: (identifier) @socket3 attribute: (identifier) @fileno2)))
              (keyword_argument name: (identifier) @stderr value: (call function: (attribute object: (identifier) @socket4 attribute: (identifier) @fileno3)))))))
          (#eq? @connect "connect") (#eq? @subprocess "subprocess") (#match? @popen "^(Popen|call|run|check_call|check_output)$")
          (#eq? @stdin "stdin") (#eq? @stdout "stdout") (#eq? @stderr "stderr")
          (#eq? @fileno1 "fileno") (#eq? @fileno2 "fileno") (#eq? @fileno3 "fileno")
          (#eq? @socket1 @socket2) (#eq? @socket1 @socket3) (#eq? @socket1 @socket4)
          (#match? @shell "^.(/(usr/)?bin/)?(bash|sh|zsh|cmd)([.]exe)?.$"))
        ((module
          (expression_statement (call function: (attribute object: (identifier) @socket1 attribute: (identifier) @connect)))
          (expression_statement (assignment right: (call function: (attribute object: (identifier) @subprocess attribute: (identifier) @popen)
            arguments: (argument_list (list . (string) @shell)
              (keyword_argument name: (identifier) @stdin value: (identifier) @socket2)
              (keyword_argument name: (identifier) @stdout value: (identifier) @socket3)
              (keyword_argument name: (identifier) @stderr value: (identifier) @socket4))))))
          (#eq? @connect "connect") (#eq? @subprocess "subprocess") (#match? @popen "^(Popen|call|run|check_call|check_output)$")
          (#eq? @stdin "stdin") (#eq? @stdout "stdout") (#eq? @stderr "stderr")
          (#eq? @socket1 @socket2) (#eq? @socket1 @socket3) (#eq? @socket1 @socket4)
          (#match? @shell "^.(/(usr/)?bin/)?(bash|sh|zsh|cmd)([.]exe)?.$"))
        ((module
          (expression_statement (call function: (attribute object: (identifier) @socket1 attribute: (identifier) @connect)))
          (expression_statement (assignment right: (call function: (attribute object: (identifier) @subprocess attribute: (identifier) @popen)
            arguments: (argument_list (list . (string) @shell)
              (keyword_argument name: (identifier) @stdin value: (call function: (attribute object: (identifier) @socket2 attribute: (identifier) @fileno1)))
              (keyword_argument name: (identifier) @stdout value: (call function: (attribute object: (identifier) @socket3 attribute: (identifier) @fileno2)))
              (keyword_argument name: (identifier) @stderr value: (call function: (attribute object: (identifier) @socket4 attribute: (identifier) @fileno3))))))))
          (#eq? @connect "connect") (#eq? @subprocess "subprocess") (#match? @popen "^(Popen|call|run|check_call|check_output)$")
          (#eq? @stdin "stdin") (#eq? @stdout "stdout") (#eq? @stderr "stderr")
          (#eq? @fileno1 "fileno") (#eq? @fileno2 "fileno") (#eq? @fileno3 "fileno")
          (#eq? @socket1 @socket2) (#eq? @socket1 @socket3) (#eq? @socket1 @socket4)
          (#match? @shell "^.(/(usr/)?bin/)?(bash|sh|zsh|cmd)([.]exe)?.$"))
        ((module
          (expression_statement (call function: (attribute object: (identifier) @socket1 attribute: (identifier) @connect)))
          (expression_statement (call function: (attribute object: (identifier) @subprocess attribute: (identifier) @popen)
            arguments: (argument_list (string) @shell
              (keyword_argument name: (identifier) @shk value: (true))
              (keyword_argument name: (identifier) @stdin value: (identifier) @socket2)
              (keyword_argument name: (identifier) @stdout value: (identifier) @socket3)
              (keyword_argument name: (identifier) @stderr value: (identifier) @socket4)))))
          (#eq? @connect "connect") (#eq? @subprocess "subprocess") (#match? @popen "^(Popen|call|run|check_call|check_output)$")
          (#eq? @shk "shell")
          (#eq? @stdin "stdin") (#eq? @stdout "stdout") (#eq? @stderr "stderr")
          (#eq? @socket1 @socket2) (#eq? @socket1 @socket3) (#eq? @socket1 @socket4)
          (#match? @shell "^.(/(usr/)?bin/)?(bash|sh|zsh|cmd)([.]exe)?( -i)?.$"))
        ((module
          (expression_statement (call function: (attribute object: (identifier) @socket1 attribute: (identifier) @connect)))
          (expression_statement (call function: (attribute object: (identifier) @subprocess attribute: (identifier) @popen)
            arguments: (argument_list (list . (string) @shell)
              (keyword_argument name: (identifier) @stdin value: (identifier) @socket2)
              (keyword_argument name: (identifier) @stdout value: (identifier) @socket3)
              (keyword_argument name: (identifier) @stderr value: (attribute object: (identifier) @stdmod attribute: (identifier) @stdconst))))))
          (#eq? @connect "connect") (#eq? @subprocess "subprocess") (#match? @popen "^(Popen|call|run|check_call|check_output)$")
          (#eq? @stdin "stdin") (#eq? @stdout "stdout") (#eq? @stderr "stderr")
          (#eq? @stdmod "subprocess") (#eq? @stdconst "STDOUT")
          (#eq? @socket1 @socket2) (#eq? @socket1 @socket3)
          (#match? @shell "^.(/(usr/)?bin/)?(bash|sh|zsh|cmd)([.]exe)?.$"))
        ((module
          (expression_statement (assignment left: (identifier) @socket1 right: (call function: (attribute object: (identifier) @sockmod attribute: (identifier) @create))))
          (expression_statement (call function: (attribute object: (identifier) @subprocess attribute: (identifier) @popen)
            arguments: (argument_list (list . (string) @shell)
              (keyword_argument name: (identifier) @stdin value: (identifier) @socket2)
              (keyword_argument name: (identifier) @stdout value: (identifier) @socket3)
              (keyword_argument name: (identifier) @stderr value: (identifier) @socket4)))))
          (#eq? @create "create_connection") (#eq? @sockmod "socket")
          (#eq? @subprocess "subprocess") (#match? @popen "^(Popen|call|run|check_call|check_output)$")
          (#eq? @stdin "stdin") (#eq? @stdout "stdout") (#eq? @stderr "stderr")
          (#eq? @socket1 @socket2) (#eq? @socket1 @socket3) (#eq? @socket1 @socket4)
          (#match? @shell "^.(/(usr/)?bin/)?(bash|sh|zsh|cmd)([.]exe)?.$"))
