# Canonical placement from the socket-shell cohort audit.
defaults:
  platforms:
  - unix
  - windows
composite_rules:
- id: reverse-shell-perl
  desc: Reverse shell in Perl
  for:
  - perl
  crit: suspicious
  conf: 0.66
  mbc: B0033
  attack: T1059
  all:
  - id: micro-behaviors/communications/socket/create::socket-call
  - id: micro-behaviors/communications/socket/create::open-call
  - id: micro-behaviors/process/fd/dup::perl-redir
  - id: micro-behaviors/communications/socket/connect::perl-sockaddr-in-connect
  any:
  - id: micro-behaviors/process/create/shell/interactive::sh-interactive
  - id: micro-behaviors/process/create/shell/spawn::bin-sh-interactive
- id: perl-socket-exec-shell
  desc: Perl connects a shell to a socket
  for:
  - perl
  - static-lib
  crit: hostile
  conf: 0.95
  attack: T1095
  all:
  - id: micro-behaviors/communications/socket/tcp::sock-stream
  - id: micro-behaviors/process/fd/stdio::stdin-socket-redir
  - id: micro-behaviors/process/fd/stdio::stdout-socket-redir
  - id: micro-behaviors/process/create/exec::perl-exec-quoted-shell
  any:
  - id: micro-behaviors/communications/socket/connect::perl-sockaddr-in-connect
  - id: micro-behaviors/communications/socket/connect::perl-packed-sockaddr-connect
- id: connectback-system-shell
  desc: Perl connect-back system shell
  for:
  - perl
  crit: hostile
  conf: 0.995
  mbc: B0030.002
  attack: T1095
  all:
  - id: micro-behaviors/communications/socket/create::socket-call
  - id: micro-behaviors/communications/socket/connect::perl-sockaddr-in-connect
  - id: micro-behaviors/communications/ip/parse::perl-inet-aton-argument
  - id: micro-behaviors/process/fd/stdio::stdio-socket-redirect
  - id: micro-behaviors/process/create/system::system-process-call
  - id: micro-behaviors/process/interpreter/shell::bin-sh
  any:
  - id: objectives/command-and-control/backdoor/keywords::connectback-banner
  - id: objectives/evasion/indicator-removal/history::perl-history-suppressed-recon
