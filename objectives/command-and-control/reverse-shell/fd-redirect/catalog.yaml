# A JSON index whose entries are backconnect shell sources in several
# languages. The index itself runs nothing, but its only function is
# to hand an operator a bind/reverse shell for whatever interpreter
# the compromised host offers.
defaults:
  platforms: [windows, unix]
  for: [json]
  attack: T1105,T1059

composite_rules:
  - id: backconnect-shell-catalog-index
    desc: JSON index of backconnect shell downloads
    crit: hostile
    conf: 0.96
    all:
      - id: objectives/command-and-control/backdoor/webshell/config::backconnect-shell-url-entry
      - id: objectives/command-and-control/backdoor/webshell/config::b4tm4n-tools-json-catalog
