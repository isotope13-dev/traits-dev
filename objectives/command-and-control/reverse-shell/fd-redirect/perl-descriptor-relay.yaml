# Canonical descriptor observations and socket-shell relays.
defaults:
  platforms:
  - unix
  - windows
  crit: hostile
composite_rules:
- id: perl-revshell-hostile
  desc: Perl reverse shell (socket + stdio redirect + exec shell)
  for:
  - perl
  conf: 0.98
  mbc: B0030.002
  all:
  - id: micro-behaviors/communications/socket/connect::perl-sockaddr-in-connect
  - id: micro-behaviors/process/fd/stdio::stdio-socket-redirect
  - id: micro-behaviors/process/create/shell/spawn::bin-sh-interactive
  unless:
  - id: well-known/tool/detection/llm-scanner/
- id: perl-socket-stdio-shell
  desc: Perl socket connect paired with STDIN reopen on socket + exec
  for:
  - perl
  conf: 0.97
  mbc: B0030.002
  all:
  - id: micro-behaviors/communications/socket/create::socket-call
  - id: micro-behaviors/process/fd/stdio::stdio-socket-redirect
  - id: micro-behaviors/process/create/shell/spawn::bin-sh-interactive
  unless:
  - id: well-known/tool/detection/llm-scanner/
- id: perl-sockaddr-stdio-shell
  desc: Perl sockaddr_in + STDIO reopen + exec shell
  for:
  - perl
  conf: 0.97
  mbc: B0030.002
  all:
  - id: micro-behaviors/process/fd/stdio::stdio-socket-redirect
  - id: micro-behaviors/communications/socket/connect::perl-sockaddr-in-connect
  - id: micro-behaviors/communications/socket/create::socket-call
  - id: micro-behaviors/process/create/shell/spawn::bin-sh-interactive
  unless:
  - id: well-known/tool/detection/llm-scanner/
- id: perl-pf-inet-revshell-skeleton
  desc: Perl PF_INET socket + stdio redirect + exec
  for:
  - perl
  conf: 0.97
  mbc: B0030.002
  all:
  - id: micro-behaviors/process/create/shell/spawn::bin-sh-interactive
  - id: micro-behaviors/communications/socket/connect::perl-sockaddr-in-connect
  - id: micro-behaviors/communications/socket/endpoint::perl-sockaddr-in
  - id: micro-behaviors/process/fd/stdio::stdio-socket-redirect
  - id: micro-behaviors/communications/socket/create::socket-call
  unless:
  - id: well-known/tool/detection/llm-scanner/
- id: perl-revshell-quadruple
  desc: Perl sockaddr_in + PF_INET + stdio redirect + exec sh
  for:
  - perl
  conf: 0.99
  mbc: B0030.002
  all:
  - id: micro-behaviors/communications/socket/connect::perl-sockaddr-in-connect
  - id: micro-behaviors/communications/socket/family::perl-socket-pf-inet
  - id: micro-behaviors/process/fd/stdio::stdio-socket-redirect
  - id: micro-behaviors/process/create/shell/spawn::bin-sh-interactive
  unless:
  - id: well-known/tool/detection/llm-scanner/
- id: perl-dup-stdio-exec
  desc: Perl execs a shell on socket-duped stdio
  for:
  - perl
  conf: 0.97
  attack: T1059
  near_lines: 8
  all:
  - id: micro-behaviors/process/fd/dup::perl-stdin-dup-read
  - id: micro-behaviors/process/fd/dup::perl-stdout-dup-write
  - id: micro-behaviors/process/create/shell/lang::perl-exec-variable
  - id: micro-behaviors/communications/socket/create::socket-call
  unless:
  - id: metadata/package/testing/presence/harness::perl-test-file
  - id: well-known/tool/detection/llm-scanner/
  - id: well-known/tool/development/vcs/git-for-windows::vendored-tree
- id: perl-text-typed-revshell
  desc: Perl script execs sh on socket stdio
  for:
  - text
  conf: 0.97
  mbc: B0030.002
  attack: T1059
  all:
  - id: metadata/lang/shebang::perl-shebang-text
  - id: micro-behaviors/communications/socket/create::perl-inet-stream-socket
  - id: micro-behaviors/process/fd/stdio::stdio-socket-redirect
  - id: micro-behaviors/process/create/exec::perl-exec-bin-sh
  unless:
  - id: well-known/tool/detection/llm-scanner/
