defaults:
  for: [php]
  platforms: [linux, macos, windows]
  attack: T1059
  mbc: B0030.002
composite_rules:
  # Bind the redirected shell text to an execution argument. An unrelated
  # system($request) call does not execute a quoted shell example elsewhere
  # in the file. Explicit socket descriptors are handled by the next rule.
  - id: php-socket-interactive-shell
    desc: PHP socket with executed redirected shell command
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/communications/socket/connect::fsockopen-call
      - id: micro-behaviors/process/fd/stdio::php-shell-stdio-fd-redirection
      - id: micro-behaviors/process/create/shell/interactive::php-exec-redirected-interactive-shell
    unless:
      - id: well-known/tool/detection/llm-scanner/
      - id: "metadata/file/naming::test-directory-component"

  - id: php-socket-proc-open-stdio
    desc: PHP shell binds stdin/stdout to a socket
    crit: hostile
    conf: 0.99
    all:
      - id: micro-behaviors/process/fd/stdio::php-socket-proc-open-descriptors
      - id: micro-behaviors/process/create/shell/lang::proc-open-shell-command
    near_bytes: 4096
