defaults:
  for: [php]
  platforms: [linux, macos, windows]
  attack: T1059
  mbc: B0030.002
composite_rules:
  # Shell redirection is required: a socket and shell string alone do not
  # establish that shell input and output cross the network.
  - id: php-socket-interactive-shell
    desc: PHP socket call with interactive shell FD redirection
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/communications/socket/connect::fsockopen-call
      - id: micro-behaviors/process/create/shell/native::php-interactive-shell-command
      - id: micro-behaviors/process/fd/stdio::php-shell-stdio-fd-redirection
    any:
      - id: micro-behaviors/communications/http/request/superglobal::request-param-assignment
      - id: micro-behaviors/communications/socket/netcat::nc-connect-endpoint
    needs: 1
    unless:
      - id: well-known/tool/detection/llm-scanner/
      - id: "metadata/file/naming::test-directory-component"

  - id: php-socket-proc-open-stdio
    desc: PHP shell binds stdin/stdout to a socket
    crit: hostile
    conf: 0.99
    all:
      - id: micro-behaviors/process/fd/stdio::php-socket-proc-open-descriptors
      - id: micro-behaviors/process/create/shell/lang::proc-open-shell-command
    near_bytes: 4096
