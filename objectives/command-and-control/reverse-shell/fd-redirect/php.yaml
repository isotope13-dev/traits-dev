defaults:
  for:
  - php
  platforms:
  - linux
  - macos
  - windows
  attack: T1059
  mbc: B0030.002
  crit: hostile
composite_rules:
- id: php-socket-interactive-shell
  desc: PHP socket with executed redirected shell command
  conf: 0.98
  all:
  - id: micro-behaviors/communications/socket/connect/attempt::fsockopen-call
  - id: micro-behaviors/process/fd/stdio::php-shell-stdio-fd-redirection
  - id: micro-behaviors/process/create/shell/interactive::php-exec-redirected-interactive-shell
  unless:
  - id: well-known/tool/detection/llm-scanner::llm-scanner-context
- id: php-socket-proc-open-stdio
  desc: PHP shell binds stdin/stdout to a socket
  conf: 0.99
  all:
  - id: micro-behaviors/process/fd/stdio::php-socket-proc-open-descriptors
  - id: micro-behaviors/process/create/shell/command-string::proc-open-shell-command
  near_bytes: 4096
