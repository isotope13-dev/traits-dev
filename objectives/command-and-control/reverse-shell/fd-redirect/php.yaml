defaults:
  for: [php]
  platforms: [linux, macos, windows]
  attack: T1059
  mbc: B0030.002
composite_rules:
  - id: php-revshell-hostile
    desc: PHP reverse shell redirects socket into shell descriptors
    crit: hostile
    conf: 0.99
    all:
      - id: micro-behaviors/communications/socket/connect::fsockopen-call
      - id: micro-behaviors/process/fd/stdio::proc-open-stdin-resource
    any:
      - id: micro-behaviors/process/create/shell/lang::proc-open-shell-command
      - id: micro-behaviors/process/create/shell/native::php-interactive-shell-command
    needs: 1
    near_bytes: 4096
    unless:
      - id: well-known/tool/detection/llm-scanner/
  # Shell-level redirection instead of proc_open plumbing: fsockopen() to a
  # request-selected endpoint, then /bin/sh -i with its stdio bound to that
  # socket (`/bin/sh -i <&3 >&3`). The sibling proc_open composite above
  # needs proc_open descriptor resources; this shape never touches proc_open,
  # so it needs its own legs: the socket call, the interactive-shell string,
  # and request-selected addressing.
  - id: php-socket-interactive-shell
    desc: PHP socket feeds an interactive shell
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/communications/socket/connect::fsockopen-call
      - id: micro-behaviors/process/create/shell/native::php-interactive-shell-command
    any:
      - id: micro-behaviors/communications/http/request/superglobal::request-param-assignment
      - id: micro-behaviors/communications/socket/netcat::nc-connect-endpoint
    needs: 1
    unless:
      - id: well-known/tool/detection/llm-scanner/
      - id: metadata/package/testing/presence/harness::test-directory-path
