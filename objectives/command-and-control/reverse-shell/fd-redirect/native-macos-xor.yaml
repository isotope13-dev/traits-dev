defaults:
  for: [macho]
  platforms: [macos]
composite_rules:
  - id: xor-zsh-socket-stdio-relay
    desc: Socket and stdio triplet with XOR-concealed interactive zsh argv
    crit: hostile
    conf: 0.99
    attack: T1059.004
    all:
      - id: objectives/anti-static/obfuscation/string/reconstruct::x64-xor-concealed-zsh-argv
      - id: micro-behaviors/process/fd/dup::x64-shared-source-stdio-triplet
      - id: micro-behaviors/communications/socket/connect::connect-import
      - id: micro-behaviors/process/fd/dup::dup2
      - id: micro-behaviors/process/create/exec::execve-import
