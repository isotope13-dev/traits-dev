# A configured interactive shell command carried in source comments can be
# activated by copycats. Require both the descriptor relay and an IP endpoint;
# ordinary security documentation is covered by the shared inert-context rule.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  attack: T1059.004,T1105

traits:
  - id: comment-shell-interpreter-assignment
    desc: Comment assigns shell as interpreter
    crit: notable
    if:
      type: comment
      regex: '(?i)\b[A-Za-z_][A-Za-z0-9_]*\s*=\s*sh\s*;'

  - id: comment-interactive-shell-fd-relay
    desc: Comment contains interactive shell FD relay
    crit: notable
    if:
      type: comment
      regex: '(?i)\$\(\$[A-Za-z_]\w*\s+-i\s+>&\s*/\$[A-Za-z_]\w*(/\$[A-Za-z_]\w*){3}\s+0>&1\)'

  - id: source-comment-ipv4-endpoint
    desc: Source contains an IPv4 endpoint
    crit: component
    if:
      type: comment
      regex: '\b[0-9]{1,3}(\.[0-9]{1,3}){3}\b'

composite_rules:
  - id: configured-reverse-shell-comment
    desc: Source comment carries configured reverse shell payload
    crit: hostile
    conf: 0.96
    scope: file
    all:
      - id: comment-shell-interpreter-assignment
      - id: comment-interactive-shell-fd-relay
      - id: source-comment-ipv4-endpoint
    unless:
      - id: objectives/command-and-control/reverse-shell/fd-redirect::embedded-shell-documentation-context
