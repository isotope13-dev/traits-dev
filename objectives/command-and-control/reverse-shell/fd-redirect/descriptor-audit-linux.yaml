# Descriptor audit: neutral observations and explicit shell relay mechanisms.
defaults:
  for:
    - elf
  platforms:
    - linux
  crit: hostile
  mbc: B0030.002
composite_rules:
  - id: syscall-reverse-shell-linux
    desc: Socket, stdio and execve syscalls
    attack: T1059
    conf: 0.9
    all:
      - id: micro-behaviors/communications/socket/create::inet-socket-syscall
      - id: micro-behaviors/communications/socket/connect/attempt::socket-connect
      - id: micro-behaviors/process/create/exec::syscall-execve-elf
    any:
      - id: micro-behaviors/process/fd/dup::dup2-stdin-target-syscall
      - id: micro-behaviors/process/fd/dup::dup2-stdout-target-syscall
      - id: micro-behaviors/process/fd/dup::dup2-stderr-target-syscall
    unless:
      - id: well-known/lib/native/glibc::libc-soname
      - id: metadata/file/profile/libc/implementation::glibc-versioned-libc
      - id: metadata/file/profile/libc/implementation::is-libc-binary
  - id: x86-64-syscall-pinned-ip-reverse-shell
    desc: Raw-syscall shell with fixed IP
    arch: [x86-64]
    attack: T1059.004,T1095
    conf: 0.98
    size_max: 65536
    all:
      - id: micro-behaviors/communications/socket/create::x86-64-socket-syscall
      - id: metadata/file/profile/socket-runtime::linux-connect-syscall-sequence
      - id: micro-behaviors/process/fd/dup::x86-64-syscall-dup2
      - id: micro-behaviors/process/create/exec::x86-execve-syscall-sequence
      - id: micro-behaviors/fs/path/application/interpreter::bin-sh-path-reference
      - id: micro-behaviors/communications/ip/literal::external-ipv4-shaped-text-binary
