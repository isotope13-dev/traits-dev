# 32-bit MSVC decodes a short stack key with `i % n` (cmp/cmovnz) and XORs
# each output byte. Paired with a pipe-backed CreateProcessW and an SSL
# read/write relay, the hidden buffer is the child image, not ordinary arithmetic.
defaults:
  platforms: [windows]
  for: [pe]
  arch: [x86]
  attack: T1027
  crit: notable

composite_rules:
  - id: stack-key-xor-tls-pipe-process
    desc: XOR, process, pipe and TLS API clues
    crit: hostile
    conf: 0.96
    all:
      - id: micro-behaviors/data/encoding/xor/cyclic-key::i386-stack-key-xor-loop
      - id: metadata/binary/symbols/name/process::create-process-w
      - id: micro-behaviors/communications/ipc/pipe::pipe-io-redirect
      - id: micro-behaviors/communications/socket/ssl::ssl-read-symbol
      - id: micro-behaviors/communications/socket/ssl::ssl-write-symbol
