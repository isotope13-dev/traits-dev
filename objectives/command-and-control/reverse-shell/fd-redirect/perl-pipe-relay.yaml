# Pipe-backed shell relays need not duplicate the network socket onto stdio.
# Require concealed process identity as well as network receive and shell I/O.
defaults:
  for: [perl]
  platforms: [unix, windows]

composite_rules:
  - id: perl-concealed-shell-relay
    desc: Concealed network shell with redirected streams
    crit: hostile
    conf: 0.97
    attack: T1059.006
    mbc: B0030.002
    all:
      - id: objectives/evasion/masquerade/identity/process-title::process-title-nul-pad
      - id: micro-behaviors/communications/socket/create::socket-call
      - id: micro-behaviors/communications/socket/receive::perl-socket-recv
      - id: micro-behaviors/process/fd/dup::perl-stdin-dup-read
      - id: micro-behaviors/process/fd/dup::perl-stdout-dup-write
      - id: micro-behaviors/process/create/shell/lang::perl-exec-variable
      - id: micro-behaviors/process/create/shell/interactive::sh-interactive
