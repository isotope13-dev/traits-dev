# The connected-socket shell in any statement list: the socket variable made by
# socket.socket()/socket.create_connection() supplies stdin, stdout and stderr
# of a shell child. Covers function bodies, assigned or bare launches, a
# shell=True command string, and a Popen imported by name. A connect call near
# the launch is a separate leg; local files or pipes as stdio do not qualify
# because the variable must originate from the socket module.
defaults:
  platforms: [unix, windows]
  for: [python]
traits:
  - id: python-socket-variable-shell-stdio
    desc: Socket variable is shell child stdio
    crit: notable
    conf: 0.97
    attack: T1059.006
    if:
      type: tree-sitter
      query: |
        ((_
          (expression_statement (assignment left: (identifier) @socket1
            right: (call function: (attribute object: (identifier) @sockmod attribute: (identifier) @create))))
          [(expression_statement (call function: [(attribute attribute: (identifier) @popen) (identifier) @popen]
            arguments: (argument_list [(list . (string) @shell) ((string) @shell (keyword_argument name: (identifier) @shk value: (true)))]
              (keyword_argument name: (identifier) @stdin value: (identifier) @socket2)
              (keyword_argument name: (identifier) @stdout value: (identifier) @socket3)
              (keyword_argument name: (identifier) @stderr value: (identifier) @socket4))))
           (expression_statement (assignment right: (call function: [(attribute attribute: (identifier) @popen) (identifier) @popen]
            arguments: (argument_list [(list . (string) @shell) ((string) @shell (keyword_argument name: (identifier) @shk value: (true)))]
              (keyword_argument name: (identifier) @stdin value: (identifier) @socket2)
              (keyword_argument name: (identifier) @stdout value: (identifier) @socket3)
              (keyword_argument name: (identifier) @stderr value: (identifier) @socket4)))))])
          (#eq? @sockmod "socket") (#match? @create "^(socket|create_connection)$")
          (#match? @popen "^(Popen|call|run|check_call|check_output)$")
          (#eq? @stdin "stdin") (#eq? @stdout "stdout") (#eq? @stderr "stderr")
          (#eq? @socket1 @socket2) (#eq? @socket1 @socket3) (#eq? @socket1 @socket4)
          (#match? @shell "^.(/(usr/)?bin/)?(bash|sh|zsh|cmd)([.]exe)?( -i)?.$"))
composite_rules:
  - id: python-socket-variable-shell-revshell
    desc: Connected socket variable supplies a shell's standard streams
    crit: hostile
    conf: 0.96
    attack: T1059.004,T1059.006
    mbc: B0030.002
    near_lines: 40
    all:
      - id: python-socket-variable-shell-stdio
    any:
      - id: micro-behaviors/communications/socket/connect/attempt::socket-connect-method
      - id: micro-behaviors/communications/socket/connect/attempt::socket-create-connection-call
    unless:
      - id: micro-behaviors/communications/socket/family::af-unix-socket
      - id: metadata/lang/source/origin::yaml-plain-source-layer-path
      - id: metadata/package/testing/corpus/adversary-templates::ran-bundled-adversary-templates
      - id: micro-behaviors/metaprogramming/generation/source::configured-payload-generator
