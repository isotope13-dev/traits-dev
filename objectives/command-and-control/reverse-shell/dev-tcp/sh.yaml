# Bash /dev/tcp magic-fd reverse shell redirect.
defaults:
  for: [scripts, source]
  platforms: [linux, macos]
  attack: T1059.004
  mbc: B0030

composite_rules:
  - id: dev-tcp-revshell
    desc: bash /dev/tcp reverse shell redirect
    crit: hostile
    conf: 0.99
    scope: outer
    all:
      - id: objectives/command-and-control/reverse-shell/dup::reverse-shell-shell-complete
    any:
      - id: micro-behaviors/communications/socket/connect::dev-tcp-path
      - id: micro-behaviors/communications/socket/connect::dev-tcp-external-ip
    unless:
      - id: metadata/file/policy/identity::agent-action-security-policy-context
      - id: well-known/app/utility/cmdchamp::cli-trainer-source-context
      - id: well-known/tool/detection/security-scanner/
      - id: well-known/tool/offensive/pentestkit/
      - id: well-known/tool/detection/llm-scanner/
      - id: metadata/package/testing/presence/harness::test-directory

  - id: dev-tcp-bash-interactive-shell
    desc: bash -i redirected onto /dev/tcp socket (full one-liner skeleton)
    crit: hostile
    conf: 0.98
    scope: outer
    all:
      - id: objectives/command-and-control/reverse-shell/dup::reverse-shell-shell-complete
    unless:
      - id: metadata/file/policy/identity::agent-action-security-policy-context
      - id: well-known/app/utility/cmdchamp::cli-trainer-source-context
      - id: well-known/tool/detection/security-scanner/
      - id: well-known/tool/detection/llm-scanner/
      - id: well-known/tool/offensive/pentestkit/
      - id: metadata/package/testing/presence/harness::test-directory

  - id: dev-tcp-bash-stdin-redirect
    desc: Bash interactive reverse shell with stdin redirection
    crit: hostile
    conf: 0.99
    scope: outer
    all:
      - id: objectives/command-and-control/reverse-shell/dup::reverse-shell-shell-complete
      - id: objectives/command-and-control/backdoor/shell/reverse::stdin-redirect-dup
    unless:
      - id: metadata/file/policy/identity::agent-action-security-policy-context
      - id: well-known/app/utility/cmdchamp::cli-trainer-source-context
      - id: well-known/tool/detection/security-scanner/
      - id: well-known/tool/detection/llm-scanner/
      - id: well-known/tool/offensive/pentestkit/
      - id: metadata/package/testing/presence/harness::test-directory

# A setup.py whose module code spawns a /dev/tcp reverse shell. The
# install-hook rules convict the code execution at install time; this
# states the payload -- the shell that the install opens back to the
# operator.
#
# Worked examples: the pypi set whose setup.py runs dev-tcp payloads at
# module scope.
  - id: setup-py-dev-tcp-reverse-shell
    desc: setup.py spawns dev-tcp reverse shell
    crit: hostile
    conf: 0.97
    attack: T1059.004,T1195.002
    for: [python, pyc]
    all:
      - id: metadata/package/files/included::setup-py-basename
      - id: objectives/execution/interpreter/cmd/injection::python-dev-tcp-payload
