# Bash /dev/tcp magic-fd reverse shell redirect.
defaults:
  attack: T1059.004
traits:
  - id: reverse-shell-shell-complete
    platforms: [unix, windows]
    desc: Bash reverse shell via /dev/tcp
    crit: suspicious
    conf: 0.98
    # Every composite that references this is `for: [scripts, source,
    # package.json]`, so scoping the leg to shell/js/package.json made all
    # three unreachable for any other host language -- a `bash -i >&
    # /dev/tcp/...` one-liner embedded in Groovy, Python, Ruby, Java or Go
    # produced no finding at all. The matcher is a text search for the shell
    # one-liner; the language that carries it is incidental, which is what the
    # sibling `python.yaml` header says too.
    # Shell source uses the parsed command rule below: a filename alone must
    # neither suppress executable payloads nor turn quoted fixtures into code.
    for: [scripts, -shell, source, package.json]
    if:
      type: text
      regex: '(/bin/)?(ba)?sh\s+-i\b[^"''\r\n;]{0,40}/dev/tcp/[a-zA-Z0-9$]'
    unless:
      - id: metadata/package/documentation/security-testing::local-container-escape-calibration
      - id: metadata/package/documentation/security-testing::reverse-shell-inert-documentation
      - id: well-known/tool/offensive/
      - id: well-known/tool/detection/
      - id: metadata/package/testing/corpus/
      - id: metadata/package/testing/harness/unit/
      # A brace or printf placeholder (`/dev/tcp/{ip}/{port}`,
      # `/dev/tcp/%s/%d`) is a payload template, not a payload: it names no
      # host, and the string is not executable shell until a generator fills
      # it. Live one-liners carry a literal host or a shell variable
      # ($h / ${h}), which this does not exclude.
      # A placeholder host slot names no dialable host either. Methodology
      # docs and scanner guidance write the slot as an all-caps token
      # (`/dev/tcp/ATTACKER_IP/4444`) or in angle brackets
      # (`/dev/tcp/<target>/4444`); underscores are illegal in DNS hostnames
      # and brackets never survive exec, so neither form can be dialed.
      # Live one-liners carry a literal host or a shell variable ($h /
      # ${h}), which this does not exclude.
      - type: text
        regex: '/dev/tcp/(\.\.\.|[{%]|[A-Za-z0-9.~-]*_[A-Za-z0-9_.~-]*/|<[^>\n]*>/)'
      # Loopback addresses (RFC 1122, RFC 4291) or .example reserved documentation TLD (RFC 2606)
      # are local health checks/fixtures or documentation, not external C2.
      - type: text
        regex: '/dev/tcp/(127\.0\.0\.1|localhost|::1|[^/\s<>]{1,80}\.example)/'
  - id: reverse-shell-shell
    platforms: [unix, windows]
    desc: Bash reverse shell via /dev/tcp
    crit: suspicious
    conf: 0.95
    for:
      - package.json
      - javascript
    if:
      type: text
      regex: '(/bin/)?(ba)?sh\s+-i\b[^"''\r\n;]{0,80}/dev/tcp/[a-zA-Z0-9$]'
    unless:
      - id: metadata/package/documentation/security-testing::local-container-escape-calibration
      - id: metadata/package/documentation/security-testing::reverse-shell-inert-documentation
      - id: well-known/tool/offensive/
      - id: well-known/tool/detection/
      - id: metadata/package/testing/corpus/
      - id: metadata/package/testing/harness/unit/
      # Same payload-template carve-out as reverse-shell-shell-complete
      # above: a brace, printf, angle-bracket, or underscore placeholder
      # host slot (`/dev/tcp/{ip}/`, `/dev/tcp/%s/`, `/dev/tcp/<target>/`,
      # `/dev/tcp/ATTACKER_IP/`) names no dialable host, so the one-liner is
      # documentation, not a payload. Live one-liners carry a literal host
      # or a shell variable ($h / ${h}), which this does not exclude.
      - type: text
        regex: '/dev/tcp/(\.\.\.|[{%]|[A-Za-z0-9.~-]*_[A-Za-z0-9_.~-]*/|<[^>\n]*>/)'
      - type: text
        regex: '/dev/tcp/(127\.0\.0\.1|localhost|::1|[^/\s<>]{1,80}\.example)/'
  - id: shell-interactive-dev-tcp-command
    desc: Shell TCP redirection with stdin fd bridge
    crit: suspicious
    conf: 0.99
    for:
    - shell
    platforms:
    - linux
    - macos
    if:
      type: tree-sitter
      query: "((redirected_statement\n  body: (command\n    name: (command_name) @shell\n    argument: (word) @flag)\n  redirect: (file_redirect\n    destination:\
        \ (word) @endpoint\n    destination: (number) @zero) @redirect\n  . redirect: (file_redirect\n    destination: (number) @one) @stdin) @payload\n \
        \ (#match? @shell \"^(/bin/)?(ba)?sh$\")\n  (#eq? @flag \"-i\")\n  (#eq? @zero \"0\")\n  (#eq? @one \"1\")\n  (#match? @redirect \"^(&>|>&)\")\n \
        \ (#match? @stdin \"^[<>]&[ \\\\t]*1$\")\n  (#match? @endpoint \"^/dev/tcp/[^ \\\\t\\\\r\\\\n]+/[0-9]+$\"))\n"
    unless:
    - id: metadata/package/testing/harness/fixture::shell-spec-case-file-context
    downgrade:
      scope: archive
      any:
      - id: well-known/tool/detection/cc-audit::cc-audit-source-package-identity

  - id: python-fstring-dev-tcp-template
    platforms: [unix, windows]
    desc: F-string builds a bash TCP shell
    crit: notable
    conf: 0.94
    for: [python]
    if:
      type: text
      substr: 'bash -i >& /dev/tcp/{'
  # Inline staging can switch between Base64/OpenSSL and hex/xxd, or move
  # between host languages without changing the decoded shell command.
  # Keep this observation independent of the decoder and carrier. A concrete
  # numeric endpoint is required so payload templates stay documentation.
  - id: reverse-shell-shell-encoded
    platforms: [unix, windows]
    desc: Encoded Bash /dev/tcp reverse shell
    crit: suspicious
    conf: 0.97
    for: [scripts, -batch, -jcl, -applescript, -vbs, -lua, -perl, typescript, groovy, text, package.json]
    if:
      type: encoded
      encoding: [base64, hex, url]
      # Accept form-query '+' separators as well as decoded whitespace.
      # The bounded command fragment stops at quotes; a numeric endpoint
      # keeps unfilled host/port templates out of this observation.
      regex: '(ba)?sh[+\s]+-[a-z]+\b[^"'']{0,60}/dev/tcp/\d{1,3}(\.\d{1,3}){3}/\d{1,5}'
    unless:
      - id: metadata/package/documentation/security-testing::reverse-shell-inert-documentation
      - id: metadata/package/testing/corpus/
      - id: well-known/tool/offensive/
      - id: well-known/tool/detection/
      # A directory named testdata/tests is not evidence that the encoded
      # command is inert. Keep content-based documentation/tool exclusions.
composite_rules:
  - id: eval-decoded-devtcp-reverse-shell
    for: [javascript, typescript, package.json]
    platforms: [linux, macos, windows]
    mbc: B0022
    desc: eval runs an encoded dev/tcp reverse shell
    crit: hostile
    conf: 0.98
    attack: T1059.004,T1195.002
    near_bytes: 8192
    all:
      - id: micro-behaviors/process/interpreter/eval/direct::decoded-buffer-eval-call-or-command
      - id: reverse-shell-shell-encoded
    unless:
      - id: metadata/package/documentation/security-testing::reverse-shell-inert-documentation
      - id: metadata/package/testing/corpus/
      - id: well-known/tool/offensive/
      - id: well-known/tool/detection/
      - id: metadata/package/testing/presence/harness/
  - id: dev-tcp-revshell
    for:
    - scripts
    - source
    - package.json
    - npm
    - whl
    - python_sdist
    - zip
    - tar
    platforms:
    - linux
    - macos
    mbc: B0030
    desc: bash /dev/tcp reverse shell redirect
    crit: hostile
    conf: 0.99
    all:
    - id: micro-behaviors/communications/socket/tcp::dev-tcp-path
    any:
    - id: reverse-shell-shell-complete
    - id: shell-interactive-dev-tcp-command
    unless:
    - id: metadata/package/documentation/security-testing::local-container-escape-calibration
    - id: metadata/package/documentation/security-testing::reverse-shell-inert-documentation
    - id: metadata/package/testing/corpus/
    - id: metadata/package/testing/harness/unit/
    - id: metadata/file/policy/identity::agent-action-security-policy-context
    - id: well-known/app/utility/cmdchamp/
    - id: well-known/tool/offensive/
    downgrade:
      scope: archive
      any:
      - id: well-known/tool/detection/cc-audit::cc-audit-source-package-identity

  - id: dev-tcp-bash-interactive-shell
    for: [scripts, source, package.json, npm, whl, python_sdist, zip, tar]
    platforms: [linux, macos]
    mbc: B0030
    desc: bash -i redirected onto /dev/tcp socket (full one-liner skeleton)
    crit: suspicious
    conf: 0.98
    # Container types listed so the pooled scope has a node to run on (cleave archive for: gate, 2026-09).
    scope: outer
    any:
      - id: reverse-shell-shell-complete
      - id: shell-interactive-dev-tcp-command
    unless:
      - id: metadata/package/documentation/security-testing::local-container-escape-calibration
      - id: metadata/package/documentation/security-testing::reverse-shell-inert-documentation
      - id: metadata/package/testing/corpus/
      - id: metadata/package/testing/harness/unit/
      - id: metadata/file/policy/identity::agent-action-security-policy-context
      - id: well-known/app/utility/cmdchamp/
      - id: well-known/tool/detection/
      - id: well-known/tool/offensive/
  - id: dev-tcp-bash-stdin-redirect
    for:
    - scripts
    - source
    - package.json
    - npm
    - whl
    - python_sdist
    - zip
    - tar
    platforms:
    - linux
    - macos
    mbc: B0030
    desc: Bash interactive reverse shell with stdin redirection
    crit: hostile
    conf: 0.99
    scope: outer
    all:
    - id: micro-behaviors/process/fd/stdio::shell-stdin-to-stdout-redirection
    any:
    - id: reverse-shell-shell-complete
    - id: shell-interactive-dev-tcp-command
    unless:
    - id: metadata/package/documentation/security-testing::local-container-escape-calibration
    - id: metadata/package/documentation/security-testing::reverse-shell-inert-documentation
    - id: metadata/package/testing/corpus/
    - id: well-known/tool/detection/
    - id: well-known/tool/offensive/
    downgrade:
      scope: archive
      any:
      - id: well-known/tool/detection/cc-audit::cc-audit-source-package-identity

  - id: setup-py-dev-tcp-reverse-shell
    platforms:
    - linux
    - macos
    mbc: B0030
    desc: setup.py spawns dev-tcp reverse shell
    crit: hostile
    conf: 0.97
    attack: T1059.004,T1195.002
    for:
    - python
    all:
    - id: metadata/package/files/included::setup-py-basename
    - id: micro-behaviors/fs/path/socket::python-dev-tcp-endpoint-literal
  - id: reverse-shell-dev-tcp
    platforms: [unix, windows]
    desc: Interactive shell reverse shell
    crit: hostile
    conf: 0.99
    mbc: B0022
    for: [shell, javascript]
    all:
      - id: micro-behaviors/communications/socket/tcp::dev-tcp-external-ip
      - id: micro-behaviors/process/create/shell/interactive::sh-interactive
      - id: micro-behaviors/process/fd/stdio::shell-stdin-to-stdout-redirection
  - id: python-executes-dev-tcp-template
    platforms: [unix, windows]
    desc: Python runs a built reverse shell
    crit: hostile
    conf: 0.97
    for: [python]
    scope: file
    near_lines: 20
    all:
      - id: python-fstring-dev-tcp-template
    any:
      - id: micro-behaviors/process/create/shell-subprocess::popen-shell-true
      - id: micro-behaviors/process/create/shell/command-mode::python-os-system
    needs: 1
