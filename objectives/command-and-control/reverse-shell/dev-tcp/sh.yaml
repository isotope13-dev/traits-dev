# Bash /dev/tcp magic-fd reverse shell redirect.
defaults:
  attack: T1059.004
traits:
  - id: reverse-shell-shell-complete
    platforms: [unix, windows]
    desc: Bash reverse shell via /dev/tcp
    crit: suspicious
    conf: 0.98
    # Every composite that references this is `for: [scripts, source,
    # package.json]`, so scoping the leg to shell/js/package.json made all
    # three unreachable for any other host language -- a `bash -i >&
    # /dev/tcp/...` one-liner embedded in Groovy, Python, Ruby, Java or Go
    # produced no finding at all. The matcher is a text search for the shell
    # one-liner; the language that carries it is incidental, which is what the
    # sibling `python.yaml` header says too.
    for: [scripts, source, package.json]
    if:
      type: text
      regex: (/bin/)?(ba)?sh\s+-i\b.{0,40}/dev/tcp/
    unless:
      - id: metadata/file/policy/identity::agent-action-security-policy-context
      - id: well-known/app/utility/cmdchamp::cli-trainer-source-context
      - id: well-known/tool/offensive/
      - id: well-known/tool/detection/security-scanner
      - id: metadata/package/testing/presence/harness::test-directory
      # Rust unit tests live beside the code (#[test] in src/), never under
      # tests/, so test-directory-path cannot see a scanner regression test
      # quoting this one-liner as input data.
      - id: metadata/package/testing/harness/unit::rust-test
      # A brace placeholder (`/dev/tcp/{ip}/{port}`) is a payload template,
      # not a payload: it names no host, and with bare braces the string is
      # not executable shell -- only a generator (f-string, str.format) that
      # builds the one-liner at runtime. Live one-liners carry a literal
      # host or a shell variable ($h / ${h}), which this does not exclude.
      - type: text
        regex: '/dev/tcp/\{'
  - id: reverse-shell-shell
    platforms: [unix, windows]
    desc: Bash reverse shell via /dev/tcp
    crit: suspicious
    conf: 0.95
    for:
      - shell
      - package.json
      - javascript
    if:
      type: text
      regex: (/bin/)?(ba)?sh\s+-i\b.{0,80}/dev/tcp/
    unless:
      - id: metadata/file/policy/identity::agent-action-security-policy-context
      - id: well-known/app/utility/cmdchamp::cli-trainer-source-context
      - id: well-known/tool/offensive/
      - id: well-known/tool/detection/security-scanner
      - id: metadata/package/testing/presence/harness::test-directory
  - id: dev-tcp-http-get
    platforms: [unix, windows]
    desc: HTTP GET via /dev/tcp socket
    crit: suspicious
    conf: 0.95
    for:
      - shell
    if:
      type: string_literal
      regex: /dev/tcp/.{0,64}GET\s+/
  - id: dev-tcp-http-host
    platforms: [unix, windows]
    desc: HTTP Host header via /dev/tcp
    crit: suspicious
    conf: 0.9
    for:
      - shell
    if:
      type: string_literal
      regex: '/dev/tcp/.{0,50}Host:'
composite_rules:
  - id: dev-tcp-revshell
    for: [scripts, source, package.json]
    platforms: [linux, macos]
    mbc: B0030
    desc: bash /dev/tcp reverse shell redirect
    crit: hostile
    conf: 0.99
    scope: outer
    all:
      - id: objectives/command-and-control/reverse-shell/dev-tcp::reverse-shell-shell-complete
    any:
      - id: micro-behaviors/communications/socket/tcp::dev-tcp-path
      - id: micro-behaviors/communications/socket/tcp::dev-tcp-external-ip
    unless:
      - id: metadata/file/policy/identity::agent-action-security-policy-context
      - id: well-known/app/utility/cmdchamp::cli-trainer-source-context
      - id: well-known/tool/detection/security-scanner/
      - id: well-known/tool/offensive/pentestkit/
      - id: well-known/tool/detection/llm-scanner/
      - id: metadata/package/testing/presence/harness::test-directory
      - id: metadata/package/testing/harness/unit::rust-test
  - id: dev-tcp-bash-interactive-shell
    for: [scripts, source, package.json]
    platforms: [linux, macos]
    mbc: B0030
    desc: bash -i redirected onto /dev/tcp socket (full one-liner skeleton)
    crit: suspicious
    conf: 0.98
    scope: outer
    all:
      - id: objectives/command-and-control/reverse-shell/dev-tcp::reverse-shell-shell-complete
    unless:
      - id: metadata/file/policy/identity::agent-action-security-policy-context
      - id: well-known/app/utility/cmdchamp::cli-trainer-source-context
      - id: well-known/tool/detection/security-scanner/
      - id: well-known/tool/detection/llm-scanner/
      - id: well-known/tool/offensive/pentestkit/
      - id: metadata/package/testing/presence/harness::test-directory
      - id: metadata/package/testing/harness/unit::rust-test
  - id: dev-tcp-bash-stdin-redirect
    for: [scripts, source, package.json]
    platforms: [linux, macos]
    mbc: B0030
    desc: Bash interactive reverse shell with stdin redirection
    crit: hostile
    conf: 0.99
    scope: outer
    all:
      - id: objectives/command-and-control/reverse-shell/dev-tcp::reverse-shell-shell-complete
      - id: objectives/command-and-control/backdoor/shell/reverse::stdin-redirect-dup
    unless:
      - id: metadata/file/policy/identity::agent-action-security-policy-context
      - id: well-known/app/utility/cmdchamp::cli-trainer-source-context
      - id: well-known/tool/detection/security-scanner/
      - id: well-known/tool/detection/llm-scanner/
      - id: well-known/tool/offensive/pentestkit/
      - id: metadata/package/testing/presence/harness::test-directory
      - id: metadata/package/testing/harness/unit::rust-test

# A setup.py whose module code spawns a /dev/tcp reverse shell. The
# install-hook rules convict the code execution at install time; this
# states the payload -- the shell that the install opens back to the
# operator.
#
# Worked examples: the pypi set whose setup.py runs dev-tcp payloads at
# module scope.
  - id: setup-py-dev-tcp-reverse-shell
    platforms: [linux, macos]
    mbc: B0030
    desc: setup.py spawns dev-tcp reverse shell
    crit: hostile
    conf: 0.97
    attack: T1059.004,T1195.002
    for: [python]
    all:
      - id: metadata/package/files/included::setup-py-basename
      - id: objectives/execution/interpreter/cmd/injection::python-dev-tcp-payload
  - id: reverse-shell-dev-tcp
    platforms: [unix, windows]
    desc: Interactive shell reverse shell
    crit: hostile
    conf: 0.99
    mbc: B0022
    for: [shell, javascript]
    all:
      - id: micro-behaviors/communications/socket/tcp::dev-tcp-external-ip
      - id: micro-behaviors/process/create/shell/interactive::sh-interactive
      - id: objectives/command-and-control/backdoor/shell/reverse::stdin-redirect-dup
  - id: shell-dev-tcp-http
    platforms: [unix, windows]
    desc: Bash /dev/tcp HTTP client
    crit: hostile
    conf: 0.95
    for:
      - shell
    all:
      - id: micro-behaviors/communications/socket/tcp::dev-tcp-fd-redirect
    any:
      - id: dev-tcp-http-get
      - id: dev-tcp-http-host
