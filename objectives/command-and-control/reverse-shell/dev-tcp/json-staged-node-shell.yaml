defaults:
  platforms: [unix]
  for: [json]
  attack: T1059.004,T1095

traits:
  - id: json-staged-shell-child-process
    desc: Stages Node child process execution
    crit: notable
    if:
      type: text
      regex: 'const\s*\{\s*execSync\s*\}\s*=\s*require\(["'']child_process["'']\)'
  - id: json-staged-shell-devtcp
    desc: Stages interactive shell over TCP
    crit: notable
    if:
      type: text
      regex: '(ba)?sh\s+-i\s+>&\s*/dev/tcp/[^\s/]{1,150}/[0-9]{1,5}\s+0>&1'
  - id: json-staged-shell-exec
    desc: Executes a shell command variable
    crit: notable
    if:
      type: text
      regex: '\bexecSync\s*\(\s*[A-Za-z_$][\w$]*\s*,'

composite_rules:
  - id: json-staged-devtcp-reverse-shell
    desc: Stages Node reverse shell in JSON file
    crit: hostile
    conf: 0.99
    all:
      - id: json-staged-shell-child-process
      - id: json-staged-shell-devtcp
      - id: json-staged-shell-exec
