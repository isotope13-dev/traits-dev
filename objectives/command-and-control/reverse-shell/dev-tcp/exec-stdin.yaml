# A shell reading commands from a TCP descriptor also sends its output there.
# Match one executable statement; quoted examples and comments do not qualify.
defaults:
  platforms: [linux, macos]
  for: [shell]
  attack: T1059.004
  conf: 0.99
traits:
  - id: shell-tcp-stdin-stream-bridge
    desc: Shell stdin and output use TCP
    crit: suspicious
    if:
      type: tree-sitter
      query: |
        ((redirected_statement) @payload
          (#match? @payload "^exec[ \\t]+(/bin/)?(ba)?sh[ \\t]+0<")
          (#match? @payload "0<[ \\t]*/dev/tcp/[^ \\t\\r\\n/]+/[0-9]+[ \\t]+1>&0[ \\t]+2>&0$"))

composite_rules:
  - id: exec-shell-tcp-stdin
    desc: Exec shell redirects standard streams over TCP
    crit: hostile
    all:
      - id: shell-tcp-stdin-stream-bridge
      - id: micro-behaviors/process/create/shell/spawn::shell-exec
