defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  attack: T1059.004,T1059.007
composite_rules:
  - id: node-executes-bash-tcp-shell
    desc: Node executes a Bash TCP I/O shell
    crit: hostile
    conf: 0.99
    near_bytes: 128
    all:
      - id: micro-behaviors/process/create/shell/bridge::exec-call-bash-tcp-io
      - id: micro-behaviors/process/fd/stdio::shell-stdin-to-stdout-redirection
    any:
      - id: metadata/import/builtin::require-child-process
      - id: metadata/import/builtin::child-process-import-runtime
    unless:
      - id: micro-behaviors/metaprogramming/generation::javascript-tcp-shell-template

  - id: node-exec-bash-tcp-shell-template
    desc: Node exec call contains a parameterized Bash TCP shell template
    crit: suspicious
    conf: 0.99
    near_bytes: 128
    all:
      - id: micro-behaviors/process/create/shell/bridge::exec-call-bash-tcp-io
      - id: micro-behaviors/process/fd/stdio::shell-stdin-to-stdout-redirection
      - id: micro-behaviors/metaprogramming/generation::javascript-tcp-shell-template
    any:
      - id: metadata/import/builtin::require-child-process
      - id: metadata/import/builtin::child-process-import-runtime
