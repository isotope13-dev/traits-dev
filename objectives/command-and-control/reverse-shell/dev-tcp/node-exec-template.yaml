defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
traits:
  - id: exec-call-bash-tcp-io-template
    desc: Exec arg starts a Bash TCP shell
    crit: notable
    conf: 0.98
    if:
      type: symbol
      kind: call
      regex: '(^|\.)exec(Sync)?$'
      arg:
        kind: string
        substr: 'bash -i >& /dev/tcp/'
composite_rules:
  - id: node-executes-bash-tcp-template
    desc: Node executes a Bash TCP I/O shell
    crit: hostile
    conf: 0.99
    attack: T1059.004,T1059.007
    near_bytes: 128
    all:
      - id: exec-call-bash-tcp-io-template
      - id: micro-behaviors/process/fd/stdio::shell-stdin-to-stdout-redirection
    any:
      - id: metadata/import/builtin::require-child-process
      - id: metadata/import/builtin::child-process-import-runtime
