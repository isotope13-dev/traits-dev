defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
traits:
  - id: exec-call-bash-tcp-io-template
    desc: Exec-style call receives a TCP I/O shell
    crit: notable
    conf: 0.98
    if:
      type: tree-sitter
      language: javascript
      query: |
        ((call_expression
          function: [(identifier) @exec
            (member_expression property: (property_identifier) @exec)]
          arguments: (arguments [(template_string) (string)] @command))
          (#match? @exec "^exec(Sync)?$")
          (#match? @command "(/bin/)?(ba)?sh[[:space:]]+-i.{0,256}dev/tcp/.{0,256}0>&1"))
composite_rules:
  - id: node-executes-bash-tcp-template
    desc: Node executes a Bash TCP I/O shell
    crit: hostile
    conf: 0.99
    attack: T1059.004,T1059.007
    all:
      - id: exec-call-bash-tcp-io-template
    any:
      - id: metadata/import/builtin::require-child-process
      - id: metadata/import/builtin::child-process-import-runtime
