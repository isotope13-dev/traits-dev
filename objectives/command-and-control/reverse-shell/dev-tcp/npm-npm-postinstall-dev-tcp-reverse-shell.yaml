defaults:
  platforms: [unix, windows]
  for: [package.json]
composite_rules:
- id: npm-postinstall-dev-tcp-reverse-shell
  desc: Postinstall launches Bash dev-tcp reverse shell
  crit: hostile
  conf: 0.99
  mbc: "B0030"
  attack: "T1195.002,T1059.004,T1095"
  for: [npm, package.json, javascript]
  scope: archive
  all:
  - id: metadata/package/scripts/lifecycle::postinstall-hook-declaration
  - id: micro-behaviors/process/create/shell/command-string::js-exec
  - id: objectives/command-and-control/reverse-shell/dev-tcp::reverse-shell-shell-complete
