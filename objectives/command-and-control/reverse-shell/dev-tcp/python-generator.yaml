# Match construction, not execution on the generator's host. The interpolation
# must be in the same string as the interactive shell and both fd redirects.
# Plain documentation, comments, and a TCP file transfer cannot satisfy it.
defaults:
  attack: T1059.004
  for: [python]
  platforms: [unix]
traits:
  - id: python-interpolated-devtcp-output
    desc: Builds interactive shell TCP output redirection
    crit: suspicious
    conf: 0.98
    if:
      type: tree-sitter
      query: |
        ((string (interpolation)) @payload
          (#match? @payload "(ba)?sh[ \\t]+-i[ \\t]+>&[ \\t]*/dev/tcp/")
          (#match? @payload "[ \\t]+0>&1"))
composite_rules:
  - id: python-interpolated-devtcp-shell
    desc: Builds an interactive TCP reverse shell
    crit: hostile
    conf: 0.98
    near_lines: 1
    all:
      - id: python-interpolated-devtcp-output
      - id: micro-behaviors/process/fd/stdio::shell-stdin-to-stdout-redirection
