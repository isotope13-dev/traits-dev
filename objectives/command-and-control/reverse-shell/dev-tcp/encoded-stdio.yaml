defaults:
  platforms: [unix, windows]
  for: [scripts, -batch, -jcl, -applescript, -vbs, -lua, -perl, typescript, groovy, text, package.json]
  attack: T1059.004
traits:
  - id: encoded-interactive-tcp-stdio
    desc: Encoded interactive TCP shell stdio payload
    crit: suspicious
    conf: 0.99
    # Require the socket-to-shell I/O coupling, not just a shell and TCP path.
    # '+' is the form-query space representation exposed by decoded HTTP text.
    # This identifies a payload, without claiming its carrier executes it.
    if:
      type: encoded
      encoding: [base64, hex, url]
      regex: '\b(ba)?sh[+\s]+-i[+\s]+>&[+\s]*/dev/tcp/[^"''\s+]+[+\s]+0>&1'
    unless:
      - id: metadata/package/documentation/security-testing::reverse-shell-inert-documentation
      - id: metadata/package/testing/corpus/
      - id: well-known/tool/offensive/
      - id: well-known/tool/detection/
composite_rules:
  - id: encoded-interactive-tcp-stdio-payload
    desc: Encoded TCP shell with numeric callback
    crit: hostile
    conf: 0.99
    near_bytes: 256
    all:
      - id: encoded-interactive-tcp-stdio
      - id: reverse-shell-shell-encoded
