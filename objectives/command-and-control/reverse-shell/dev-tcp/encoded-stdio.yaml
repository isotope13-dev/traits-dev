defaults:
  platforms: [unix, windows]
  # Decoded shell payloads retain their meaning in compiled-language source.
  for: [scripts, -batch, -jcl, -applescript, -vbs, -lua, -perl, source, text, package.json]
  attack: T1059.004
traits:
  - id: encoded-interactive-tcp-stdio-script
    desc: Encoded interactive TCP shell stdio payload
    crit: suspicious
    for: [scripts, -batch, -jcl, -applescript, -vbs, -lua, -perl, groovy, clojure, text, package.json]
    conf: 0.99
    # Require the socket-to-shell I/O coupling, not just a shell and TCP path.
    # '+' is the form-query space representation exposed by decoded HTTP text.
    # This identifies a payload, without claiming its carrier executes it.
    if:
      type: encoded
      encoding: [base64, hex, url]
      regex: '\b(ba)?sh[+\s]+-i[+\s]+>&[+\s]*/dev/tcp/[^"''\s+]{1,200}[+\s]+0>&1'
    unless:
      - id: metadata/package/documentation/security-testing::reverse-shell-inert-documentation
  - id: encoded-interactive-tcp-stdio-source
    desc: Encoded interactive TCP shell stdio payload
    crit: suspicious
    for: [source, -groovy, -clojure, -typescript]
    conf: 0.99
    # Require the socket-to-shell I/O coupling, not just a shell and TCP path.
    # '+' is the form-query space representation exposed by decoded HTTP text.
    # This identifies a payload, without claiming its carrier executes it.
    if:
      type: encoded
      encoding: [base64, hex, url]
      regex: '\b(ba)?sh[+\s]+-i[+\s]+>&[+\s]*/dev/tcp/[^"''\s+]{1,200}[+\s]+0>&1'
    unless:
      - id: metadata/package/documentation/security-testing::reverse-shell-inert-documentation
composite_rules:
  - id: encoded-interactive-tcp-stdio
    desc: Encoded interactive TCP shell stdio payload
    crit: suspicious
    conf: 0.99
    any:
      - id: encoded-interactive-tcp-stdio-script
      - id: encoded-interactive-tcp-stdio-source
  - id: encoded-interactive-tcp-stdio-payload
    desc: Encoded TCP shell with callback endpoint
    crit: hostile
    conf: 0.99
    near_bytes: 256
    all:
      - id: encoded-interactive-tcp-stdio
    any:
      - id: reverse-shell-shell-encoded
      # Reuse the numeric-port path observation for hostname callbacks too.
      - id: micro-behaviors/communications/socket/tcp::dev-tcp-path
