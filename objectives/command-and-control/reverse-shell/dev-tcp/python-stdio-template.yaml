# This is a generated shell command, not a connection from the Python process.
# Require TCP descriptor setup, both output redirects and a shell invocation
# within the same string expression (including adjacent Python literals).
defaults:
  for: [python]
  platforms: [unix]
  attack: T1059.004
traits:
  - id: python-tcp-stdio-shell-command-text
    desc: TCP standard-stream shell command text
    crit: suspicious
    conf: 0.99
    if:
      type: tree-sitter
      query: |
        ([(string) (concatenated_string)] @command
          (#match? @command "exec[ \\t]+0<>/dev/tcp/")
          (#match? @command "1>&0[ \\t]+2>&0;")
          (#match? @command "exec[^\\r\\n]{0,120}/bin/(ba)?sh"))

composite_rules:
  - id: python-builds-tcp-stdio-shell-command
    desc: Returns a TCP standard-stream shell command
    crit: hostile
    conf: 0.99
    near_lines: 2
    all:
      - id: python-tcp-stdio-shell-command-text
      - id: micro-behaviors/metaprogramming/generation::python-returned-shell-command-text
