defaults:
  platforms:
  - unix
  attack: T1195.002,T1059.004
traits:
- id: node-interpolated-reverse-shell-exec
  desc: Executes interpolated bash TCP reverse shell
  crit: suspicious
  conf: 0.99
  for:
  - javascript
  if:
    type: yara
    source: |
      rule ordered_evidence {
        strings:
          $b0_0 = /(const|let|var)\s+ATTACKER_IP\s*=\s*["']([0-9]{1,3}\.){3}[0-9]{1,3}["']/s
          $b0_1 = /(const|let|var)\s+ATTACKER_PORT\s*=\s*["'][0-9]{1,5}["']/s
          $b0_2 = /(const|let|var)\s+reverseShell\s*=\s*`[^`]*bash\s+-i\s+>&\s*\/dev\/tcp\/\$\{ATTACKER_IP\}\/\$\{ATTACKER_PORT\}\s+0>&1[^`]*`/s
          $b0_3 = /\bexec\s*\(\s*`\$\{reverseShell\}/s
        condition:
          (
            for any i0 in (1..#b0_0) : (
              for any i1 in (1..#b0_1) : (
                @b0_1[i1] >= (@b0_0[i0] + !b0_0[i0]) and
                @b0_1[i1] <= (@b0_0[i0] + !b0_0[i0]) + 200 and
                for any i2 in (1..#b0_2) : (
                  @b0_2[i2] >= (@b0_1[i1] + !b0_1[i1]) and
                  @b0_2[i2] <= (@b0_1[i1] + !b0_1[i1]) + 200 and
                  for any i3 in (1..#b0_3) : (
                    @b0_3[i3] >= (@b0_2[i2] + !b0_2[i2]) and
                    @b0_3[i3] <= (@b0_2[i2] + !b0_2[i2]) + 1000 and
                    true
                  )
                )
              )
            )
          )
      }
composite_rules:
- id: npm-install-interpolated-tcp-reverse-shell
  desc: npm install executes interpolated TCP reverse shell
  crit: hostile
  conf: 0.995
  for:
  - zip
  - npm
  - tar
  - javascript
  - package.json
  scope: archive
  all:
  - id: metadata/package/scripts/lifecycle::postinstall-hook-declaration
  - id: node-interpolated-reverse-shell-exec
