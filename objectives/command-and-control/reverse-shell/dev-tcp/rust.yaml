# A /dev/tcp reverse shell carried in Rust source: either a format template
# filled at run time or a literal endpoint. Sibling to python.yaml, which
# covers the Python carrier.
#
# The leg is an interactive `bash -i` redirection onto `/dev/tcp/`, followed
# by a host that is either a `{}` placeholder or a concrete address. Template
# and literal forms share one atomic so that a literal shell command in a
# Rust file is not missed by the template-only rule.
#
# Execution needs a shell interpreter constructed in the same file, so a bare
# string does not fire the spawn composite. A dropper that writes the script
# to a hidden temp path stages the shell without spawning it; that is a
# separate hostile composite.
defaults:
  platforms: [unix, windows]
  for: [rust]
  attack: "T1059.004,T1071.001"
  mbc: "B0022"

traits:
  - id: rust-dev-tcp-shell-command
    desc: Rust source builds bash /dev/tcp shell command
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: '(ba)?sh\s+-i\b[^"''\r\n;]{0,40}/dev/tcp/[{a-zA-Z0-9$]'
      exclude_comments: true

composite_rules:
  - id: rust-executes-dev-tcp-shell
    desc: Rust shell spawn runs a built /dev/tcp reverse shell
    crit: hostile
    conf: 0.97
    scope: file
    near_lines: 20
    all:
      - id: rust-dev-tcp-shell-command
      - id: metadata/lang/source/syntax/argument::rust-command-shell-interpreter
  - id: rust-stages-dev-tcp-shell-script
    desc: Rust writes a /dev/tcp shell script to a hidden temp path
    crit: hostile
    conf: 0.97
    scope: file
    all:
      - id: rust-dev-tcp-shell-command
      - id: micro-behaviors/fs/write/file/full/call::fs-write
      - id: micro-behaviors/fs/path/hidden::hidden-tmp-path
