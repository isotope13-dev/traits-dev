# A /dev/tcp reverse shell built from a Rust format template and run through a
# shell interpreter. Sibling to python.yaml, which covers the Python carrier.
#
# The concrete-endpoint rules in sh.yaml never see this shape: the host and
# port are `{}` placeholders filled at run time, so no `/dev/tcp/<ip>/<port>`
# literal exists in the source. The template leg is an interactive `bash -i`
# redirection onto `/dev/tcp/{`, and the composite requires a shell interpreter
# spawned in the same file so a bare format string does not fire.
defaults:
  platforms: [unix, windows]
  for: [rust]
  attack: "T1059.004,T1071.001"
  mbc: "B0022"

traits:
  - id: rust-dev-tcp-shell-template
    desc: Rust format template builds bash TCP shell
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: '(ba)?sh\s+-i\b[^"''\r\n;]{0,40}/dev/tcp/\{'
      exclude_comments: true

composite_rules:
  - id: rust-executes-dev-tcp-template
    desc: Rust shell spawn runs a built /dev/tcp reverse shell
    crit: hostile
    conf: 0.97
    scope: file
    near_lines: 20
    all:
      - id: rust-dev-tcp-shell-template
      - id: metadata/lang/source/syntax/argument::rust-command-shell-interpreter
