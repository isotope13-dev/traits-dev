defaults:
  for: [objectivec]
  platforms: [macos]
  attack: T1059.004
  mbc: B0030.002
traits:
  - id: objc-systemd-dev-tcp-unit
    desc: Objective-C embeds systemd dev-tcp shell unit
    crit: suspicious
    conf: 0.94
    platforms: [linux, macos]
    if:
      type: text
      regex: 'revshell\.service[\s\S]{0,360}/dev/tcp/%s/4444'
  - id: objectivec-formatted-dev-tcp-reverse-shell
    desc: Objective-C formatted /dev/tcp shell
    crit: notable
    conf: 0.995
    if:
      type: text
      regex: 'bash\s+&>\s+/dev/tcp/%@/%d\s+0>&1'
  - id: objectivec-system-formatted-command
    desc: Objective-C passes formatted text to system
    crit: notable
    conf: 0.98
    if:
      type: text
      regex: 'system\s*\(\s*\[\[NSString\s+stringWithFormat:'
composite_rules:
  - id: objectivec-dev-tcp-reverse-shell
    desc: Objective-C executes a /dev/tcp reverse shell
    crit: hostile
    conf: 0.999
    all:
      - id: objectivec-formatted-dev-tcp-reverse-shell
      - id: objectivec-system-formatted-command
  - id: objc-systemd-reverse-shell
    desc: Objective-C installs a persistent dev-tcp shell
    crit: hostile
    conf: 0.98
    platforms: [linux, macos]
    all:
      - id: objc-systemd-dev-tcp-unit
      - id: micro-behaviors/os/service/unit-field::wanted-by-target-text
      - id: micro-behaviors/os/service/restart-policy::restart-always-text
    near_bytes: 4096
