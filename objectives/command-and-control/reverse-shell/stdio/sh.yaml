# Shell pipeline into /bin/sh stdin.
defaults:
  for: [shell]
  platforms: [linux, macos]
  attack: T1059
  mbc: B0030

# The `| /bin/sh` pipeline atom that used to live here moved to
# micro-behaviors/process/create/shell/pipeline::pipe-to-absolute-shell-path.
# The matcher only sees "a pipeline feeds a shell", which is as much the
# `curl | /bin/bash` bootstrap every installer ships as it is a reverse
# shell; the reverse-shell intent comes from the netcat/socket legs of the
# composites below, which reference it cross-directory.
composite_rules:
  - id: process-stream-revshell
    desc: process stdio attached to conn plus shell exec
    crit: hostile
    conf: 0.97
    all:
      - id: objectives/command-and-control/reverse-shell/dup::any-shell-exec
    any:
      - id: process-stream-on-conn
      - id: process-inputstream-on-conn
