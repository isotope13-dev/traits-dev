# Shell pipeline into /bin/sh stdin.
# The `| /bin/sh` pipeline atom that used to live here moved to
# micro-behaviors/process/create/shell/pipeline::pipe-to-absolute-shell-path.
# The matcher only sees "a pipeline feeds a shell", which is as much the
# `curl | /bin/bash` bootstrap every installer ships as it is a reverse
# shell; the reverse-shell intent comes from the netcat/socket legs of the
# composites below, which reference it cross-directory.
defaults:
  mbc: B0030
  for: [shell]
  crit: hostile
composite_rules:
  - id: process-stream-revshell
    platforms: [linux, macos]
    attack: T1059
    desc: process stdio attached to conn plus shell exec
    conf: 0.97
    all:
      - id: objectives/command-and-control/reverse-shell/socket-exec::any-shell-exec
    any:
      - id: process-stream-on-conn
      - id: process-inputstream-on-conn
  - id: reverse-shell-telnet-fifo
    platforms: [unix, windows]
    attack: T1059.004
    desc: Telnet reverse shell through FIFO and sh
    conf: 0.99
    all:
      - id: micro-behaviors/fs/pipe/fifo::mkfifo-reference
      - id: micro-behaviors/process/create/shell/interactive::sh-interactive-command
      - id: micro-behaviors/communications/socket/telnet::telnet-client-endpoint
      - id: micro-behaviors/communications/ip/literal::external-ipv4-telnet-command
    unless:
      - id: well-known/tool/detection/llm-scanner/
