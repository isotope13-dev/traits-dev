defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  attack: T1059.003
composite_rules:
  - id: js-net-options-bash-reverse-shell
    desc: Node options socket drives Bash through child stdio
    crit: hostile
    conf: 0.99
    mbc: B0030.002
    attack: T1059.004,T1095
    all:
      - id: micro-behaviors/communications/socket/connect::node-net-options-connect
      - id: micro-behaviors/process/create/shell/spawn-options::node-spawn-absolute-bash
      - id: micro-behaviors/process/fd/stdio::node-socket-data-to-stdin-write
      - id: micro-behaviors/process/fd/stdio::node-child-output-to-stream-pipe
    near_bytes: 4096

  - id: js-reverse-shell-spawn
    desc: Node.js reverse shell with a bidirectional socket-to-child stdio bridge
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/process/create/shell/bridge::child-process-require
      # `new net.Socket().connect(...)` is the same outbound socket primitive
      # as `net.connect(...)`, but uses the constructor form.
      - id: micro-behaviors/communications/socket/connect::node-net-socket-connect
      - id: micro-behaviors/process/fd/stdio::node-stream-to-stdin-pipe
      - id: micro-behaviors/process/fd/stdio::node-child-output-to-stream-pipe
    any:
      - id: micro-behaviors/process/create/shell/spawn::bin-sh
      - id: micro-behaviors/process/create/shell/spawn::node-spawn-sh-shell
    near_bytes: 4096

  - id: js-fetched-command-reverse-shell
    desc: Fetched command execution bridged to socket stdio
    crit: hostile
    conf: 0.99
    mbc: B0030.002
    attack: T1059.007
    all:
      - id: micro-behaviors/communications/http/request/client::js-fetch-call
      - id: micro-behaviors/process/create/exec::js-object-exec-call
      - id: micro-behaviors/communications/socket/connect::node-net-socket-connect
      - id: micro-behaviors/process/fd/stdio::node-stream-to-stdin-pipe
      - id: micro-behaviors/process/fd/stdio::node-child-output-to-stream-pipe
    near_bytes: 2048

  - id: js-variable-shell-reverse-shell
    desc: Variable-shell JavaScript socket reverse shell
    crit: hostile
    conf: 0.99
    mbc: B0030.002
    attack: T1059.007,T1095
    all:
      - id: js-socket-shell-stdio-bridge
      - id: micro-behaviors/communications/socket/connect::net-connect
      - id: micro-behaviors/process/create/spawn::spawn-call
      - id: micro-behaviors/process/fd/stdio::node-child-output-to-stream-pipe
    near_bytes: 4096

  - id: js-socket-shell-stdio-bridge
    desc: Socket connects to a platform shell with piped stdio
    crit: notable
    conf: 0.98
    all:
      - id: micro-behaviors/communications/socket/connect::net-connect
      - id: micro-behaviors/process/fd/stdio::node-stream-pipe
    any:
      - id: micro-behaviors/process/create/shell/selection::platform-shell-path-selection
      - id: micro-behaviors/process/create/shell/path::shell-executable-reference
    near_bytes: 4096
