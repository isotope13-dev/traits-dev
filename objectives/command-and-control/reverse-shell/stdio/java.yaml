# Java/Groovy-flavored stdio-to-connection wiring:
#   p.inputStream = sock
defaults:
  for: [java, groovy, kotlin, scala, html, javascript, python, vbs]
  platforms: [linux, macos, windows]
  attack: T1059
  mbc: B0030

traits:
  - id: process-inputstream-on-conn
    desc: inputStream attached to socket
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(p|process)\.inputStream\s*=\s*(s|sock|client)'
  - id: process-socket-bidirectional-stream-bridge
    desc: JVM bridges process and socket streams
    crit: suspicious
    conf: 0.97
    count_min: 2
    if:
      type: text
      regex: '\w+\(\w+\.getInputStream\(\),\s*\w+\.getOutputStream\(\)\)\.start\(\)'
