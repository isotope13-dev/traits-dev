# PHP reverse shell: fsockopen + proc_open + descriptorspec on socket.
defaults:
  for: [php]
  platforms: [linux, macos, windows]
  attack: T1059
  mbc: B0030.002
traits:
  - id: php-descriptorspec-socket
    desc: PHP descriptorspec mapping stdio onto socket
    crit: notable
    conf: 0.93
    if:
      type: text
      regex: '0\s*=>\s*\$sock'
composite_rules:
  - id: php-fsockopen-descriptor-shell
    desc: PHP fsockopen + socket-mapped descriptors
    crit: hostile
    conf: 0.97
    all:
      - id: objectives/command-and-control/reverse-shell/socket-exec::php-fsockopen-host-port
      - id: php-descriptorspec-socket
    unless:
      - id: well-known/tool/detection/llm-scanner/
  - id: php-socket-descriptor-shell
    desc: PHP socket API maps stdio into a spawned shell
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/communications/socket/connect::fsockopen-call
      - id: micro-behaviors/process/create/shell/lang::proc-open
      - id: php-descriptorspec-socket
    unless:
      - id: well-known/tool/detection/llm-scanner/
