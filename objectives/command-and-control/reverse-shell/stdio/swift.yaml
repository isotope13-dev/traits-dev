# Swift reverse shell: NWConnection + Process + /bin/sh.
defaults:
  for: [swift]
  platforms: [macos, ios]
  attack: T1059
  mbc: B0030.002
traits:
  - id: swift-pipe-handle-wires-stdio
    desc: Swift FileHandle wires Process stdio
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: 'standard(Input|Output|Error)\s*=\s*stdin|standardError\s*=\s*stdout'
composite_rules:
  - id: swift-nwendpoint-process-pipe
    desc: Swift NWEndpoint + Process shell + stdio pipe
    crit: hostile
    conf: 0.98
    all:
      - id: objectives/command-and-control/reverse-shell/socket-exec::swift-nwendpoint-port-literal
      - id: objectives/command-and-control/reverse-shell/socket-exec::swift-process-launchpath-bin-sh
      - id: swift-pipe-handle-wires-stdio
    unless:
      - id: well-known/tool/detection/llm-scanner/
