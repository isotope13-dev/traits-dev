# Perl-flavored stdio reopen onto socket: open STDIN, ">&S"
defaults:
  for: [perl]
  platforms: [linux, macos, windows]
  attack: T1059
  mbc: B0030

traits:
  - id: stdio-reopen-socket
    desc: STDIN/STDOUT/STDERR reopened onto socket
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '\bopen\s*\(\s*STD(IN|OUT|ERR)\s*,\s*["'']>&'
    unless:
      - id: well-known/lib/platform/openjfx::openjfx-source-tree
      - id: well-known/lib/platform/openjfx::openjfx-tooling-tree
      # Benign capture/restore idiom: the script first SAVES a standard stream
      # into a scalar (`open(my $SAVE, '>&', STDOUT)`) and later restores it.
      # A reverse shell reopens STD* onto its socket and never preserves the
      # originals, so the presence of a save-to-variable line marks output
      # capturing (test harnesses, loggers, build wrappers like OpenSSL's
      # util/withlibctx.pl), not a shell redirect.
      # Covers both save forms: 3-arg `open(my $s, '>&', STDOUT)` and 2-arg
      # `open(my $s, ">&STDOUT")`.
      - type: text
        regex: '\bopen\s*\(\s*(my\s+)?\$\w+\s*,\s*["'']>&["'']?\s*,?\s*STD(IN|OUT|ERR)\b'
