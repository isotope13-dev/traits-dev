defaults:
  platforms: [unix]
  for: [javascript]
  attack: T1059.004,T1095

traits:
  - id: node-fifo-cat-shell-pipeline
    desc: Builds FIFO input to interactive shell
    crit: notable
    if:
      type: text
      regex: 'mkfifo\s+[^;]{1,100};\s*cat\s+[^|]{1,100}\|\s*(ba)?sh\s+-i'
  - id: node-fifo-netcat-endpoint
    desc: Pipes shell output to network client
    crit: notable
    if:
      type: text
      regex: '\|\s*nc\s+[^\s;]{1,150}\s+[0-9]{1,5}'

composite_rules:
  - id: node-staged-fifo-netcat-shell
    desc: Stages FIFO and Netcat reverse shell
    crit: hostile
    conf: 0.99
    all:
      - id: node-fifo-cat-shell-pipeline
      - id: node-fifo-netcat-endpoint
      - id: micro-behaviors/process/create/shell/command-string::child-process-inline-exec-call
