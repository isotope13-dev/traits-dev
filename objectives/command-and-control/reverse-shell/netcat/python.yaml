defaults:
  for: [python]
  platforms: [unix, windows]
  attack: T1059.006,T1059.004
  mbc: B0030

composite_rules:
  - id: python-system-netcat-reverse-shell
    desc: Python executes outbound Netcat shell
    crit: hostile
    conf: 0.99
    near_bytes: 256
    all:
      - id: micro-behaviors/communications/socket/netcat::python-system-outbound-shell
      - id: micro-behaviors/communications/socket/netcat::nc-connect-endpoint
      - id: micro-behaviors/process/create/system::python-os-system
