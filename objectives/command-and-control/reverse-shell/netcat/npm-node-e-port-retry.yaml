defaults:
  platforms: [unix]
  for: [package.json]
  attack: T1059.004,T1195.002

traits:
  - id: preinstall-node-netcat-shell-command
    desc: Node install command invokes netcat shell
    crit: notable
    conf: 0.99
    if:
      type: value
      path: scripts.preinstall
      regex: '(?i)\bexec\s*\(\s*["'']timeout\s+\d+\s+nc\s+-e\s+/(usr/)?bin/(ba)?sh\s'
  - id: preinstall-node-numeric-host
    desc: Node install command defines numeric host
    crit: notable
    conf: 0.95
    if:
      type: value
      path: scripts.preinstall
      regex: 'HOST\s*=\s*["'']([0-9]{1,3}\.){3}[0-9]{1,3}["'']'
    not:
      - regex: 'HOST\s*=\s*["''](127\.|0\.)'
  - id: preinstall-node-port-retry
    desc: Node install command increments port on error
    crit: notable
    conf: 0.9
    if:
      type: value
      path: scripts.preinstall
      regex: '(?i)if\s*\(\s*err[^)]*\)\s*\{\s*\w+\+\+'
  - id: preinstall-node-socket-shell-output
    desc: Install connects a named socket
    crit: notable
    conf: 0.97
    if:
      type: value
      path: scripts.preinstall
      regex: 's\s*=\s*new\s+net\.Socket\(\).{0,120}s\.connect\('
  - id: preinstall-node-shell-assignment
    desc: Install assigns a spawned shell
    crit: notable
    conf: 0.97
    if:
      type: value
      path: scripts.preinstall
      regex: 'sh\s*=.{0,80}\.spawn\(["'']/(usr/)?bin/(ba)?sh'
  - id: preinstall-shell-stdout-pipe
    desc: Install command pipes spawned shell stdout
    crit: notable
    conf: 0.95
    if:
      type: value
      path: scripts.preinstall
      regex: '\bsh\.stdout\.pipe\(s\)'

composite_rules:
  - id: preinstall-node-netcat-shell
    desc: Install hook runs netcat shell on numeric host
    crit: hostile
    conf: 0.98
    all:
      - id: preinstall-node-netcat-shell-command
      - id: preinstall-node-numeric-host
  - id: preinstall-node-netcat-retry-shell
    desc: Install hook retries netcat shell connection
    crit: hostile
    conf: 0.99
    all:
      - id: preinstall-node-netcat-shell-command
      - id: preinstall-node-numeric-host
      - id: preinstall-node-port-retry
  - id: preinstall-node-socket-shell-output-connection
    desc: Install hook connects shell output to socket
    crit: hostile
    conf: 0.97
    all:
      - id: preinstall-node-socket-shell-output
      - id: preinstall-node-shell-assignment
      - id: preinstall-shell-stdout-pipe
      - id: preinstall-node-numeric-host
