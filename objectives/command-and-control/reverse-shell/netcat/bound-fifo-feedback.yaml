# Closed source recipe: declared FIFO, shell stdin, network stdout, literal -c argv
# and actual endpoint are bound by filefacts. No execution or connection observed.
defaults:
  for:
  - shell
  platforms:
  - unix
  attack: T1059.004,T1095
  mbc: B0030.002
composite_rules:
- id: quoted-shell-netcat-fifo-feedback
  desc: Encoded Netcat FIFO gives peer a shell
  crit: hostile
  conf: 0.99
  all:
  - id: micro-behaviors/process/io/stream::shell-netcat-fifo-feedback
  - id: micro-behaviors/fs/pipe::shell-feedback-fifo-created
  - id: metadata/lang/encoded/base32
  unless:
  - id: metadata/lang/source/origin::heuristic-quoted-source
- id: explicit-stdio-encoded-fifo-feedback-shell
  desc: Encoded Netcat FIFO shell with explicit stdio
  crit: hostile
  conf: 0.99
  all:
  - id: micro-behaviors/process/io/stream::explicit-fifo-stdio-shell-netcat
  - id: micro-behaviors/fs/pipe::mkfifo-reference
  - id: micro-behaviors/communications/socket/netcat::nc-connect-endpoint
  - id: metadata/lang/encoded/base32
  unless:
  - id: metadata/lang/source/origin::heuristic-quoted-source
