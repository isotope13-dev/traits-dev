# netcat reverse shell via FIFO pipeline.
defaults:
  attack: T1059.004
traits:
  - id: nc-exec-sh
    platforms: [unix, windows]
    desc: nc -e shell execution
    crit: suspicious
    conf: 0.9
    for:
      - shell
      - package.json
      - javascript
      - typescript
    if:
      type: text
      # Anchor at a non-comment line. This still admits shell commands and
      # commands embedded in exec/system string arguments, while excluding
      # //, /*, leading *, and # comment examples.
      regex: '(?m)^[\t ]*([^/#*\s][^\r\n]{0,180})?\bnc\s+[-\w. ]{0,90}-e\s+(/usr/bin/|/bin/)?(ba)?sh\b'
    unless:
      - id: well-known/tool/offensive/pentestkit::local-storage-panel
      - id: well-known/tool/offensive/nmap::nmap-source-tree
      - id: metadata/package/testing/presence/harness::test-directory
  - id: ncat-exec-sh
    platforms: [unix, windows]
    desc: ncat -e shell execution
    crit: suspicious
    conf: 0.9
    for:
      - shell
      - package.json
      - javascript
      - typescript
    if:
      type: text
      regex: '\bncat\s+[-\w. ]{0,90}-e\s+(/usr/bin/|/bin/)?(ba)?sh\b'
    unless:
      - id: well-known/app/utility/cmdchamp/
      - id: well-known/app/system/aptl/
  - id: netcat-exec-sh
    platforms: [unix, windows]
    desc: netcat -e shell execution
    crit: suspicious
    conf: 0.9
    for:
      - shell
      - package.json
      - javascript
      - typescript
    if:
      type: text
      regex: '\bnetcat\s+[-\w. ]{0,90}-e\s+(/usr/bin/|/bin/)?(ba)?sh\b'
composite_rules:
  - id: nc-fifo-revshell
    for: [shell]
    platforms: [linux, macos]
    mbc: B0030
    desc: netcat FIFO reverse shell pipeline
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/fs/pipe/fifo::mkfifo-reference
      - id: micro-behaviors/communications/socket/netcat/
    any:
      - id: micro-behaviors/process/create/shell/pipeline::pipe-to-absolute-shell-path
      - id: micro-behaviors/process/create/shell/interactive::sh-interactive
      - id: micro-behaviors/process/create/shell/interactive::sh-interactive-command
    unless:
      - id: well-known/tool/detection/llm-scanner/
      - id: well-known/tool/detection/pattern-catalog/
      - id: metadata/file/catalog/identity/
      - id: metadata/package/testing/presence/path::git-tests-directory
      - id: metadata/package/testing/presence/harness::test-directory
  - id: nc-fifo-sh-pipe-revshell
    for: [shell]
    platforms: [linux, macos]
    mbc: B0030
    desc: mkfifo + nc + shell pipe (classic nc revshell)
    crit: hostile
    conf: 0.99
    all:
      - id: micro-behaviors/fs/pipe/fifo::mkfifo-reference
      - id: micro-behaviors/communications/socket/netcat/
      - id: micro-behaviors/process/create/shell/pipeline::pipe-to-absolute-shell-path
    unless:
      - id: well-known/tool/detection/llm-scanner/
      - id: well-known/tool/detection/pattern-catalog/
      - id: metadata/file/catalog/identity/
      - id: metadata/package/testing/presence/path::git-tests-directory
      - id: metadata/package/testing/presence/harness::test-directory
  - id: makeself-nc-fifo-revshell
    for: [shell]
    platforms: [linux, macos]
    mbc: B0030
    desc: Makeself embeds a Netcat FIFO reverse shell
    crit: hostile
    conf: 0.99
    all:
      - id: micro-behaviors/data/archive/package::makeself-archive-context
      - id: objectives/command-and-control/reverse-shell/netcat::nc-fifo-revshell
  - id: reverse-shell-netcat
    platforms: [unix, windows]
    desc: Netcat reverse shell pattern
    crit: hostile
    conf: 0.96
    for:
      - shell
      - package.json
      - javascript
      - typescript
    all:
      - id: micro-behaviors/communications/socket/netcat/
      - id: micro-behaviors/process/create/shell/spawn/
    any:
      - id: nc-exec-sh
      - id: ncat-exec-sh
      - id: netcat-exec-sh
    unless:
      - id: metadata/package/testing/presence/scripted::it-call
      - id: well-known/app/utility/cmdchamp/
      - id: well-known/tool/offensive/pentestkit/
      - id: well-known/tool/offensive/nmap::nmap-source-tree
  # In JavaScript, the shell process is created by child_process.exec rather
  # than by a shell-language spawn token.  Join that executable call surface
  # to the complete nc -e /bin/sh command so reverse-shell generators that
  # merely return or print the same payload remain below hostile.
  - id: javascript-exec-netcat-reverse-shell
    platforms: [unix, windows]
    desc: Node executes nc reverse shell
    crit: hostile
    conf: 0.99
    attack: "T1059.007,T1059.004"
    mbc: B0030
    for: [javascript, typescript]
    near_bytes: 512
    all:
      - id: nc-exec-sh
      - id: micro-behaviors/process/create/shell/bridge::js-exec
    unless:
      - id: metadata/package/testing/
      - id: well-known/tool/offensive/pentestkit/
      - id: well-known/tool/offensive/nmap::nmap-source-tree
