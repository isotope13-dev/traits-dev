# netcat reverse shell via FIFO pipeline.
defaults:
  attack: T1059.004
traits:
  - id: python-os-system-nc-fifo-literal
    for: [python]
    platforms: [linux, macos]
    desc: Python system call contains Netcat FIFO shell
    crit: component
    conf: 0.95
    if:
      type: tree-sitter
      query: |
        ((call
          function: (attribute object: (identifier) @module attribute: (identifier) @method)
          arguments: (argument_list (string) @command))
          (#eq? @module "os")
          (#eq? @method "system")
          (#match? @command "mkfifo")
          (#match? @command "\\|/bin/(ba)?sh[ \\t]+-i")
          (#match? @command "\\|nc[ \\t]+"))
composite_rules:
  - id: nc-fifo-revshell
    for: [shell]
    platforms: [linux, macos]
    mbc: B0030
    desc: netcat FIFO reverse shell pipeline
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/fs/pipe::mkfifo-reference
      - id: micro-behaviors/communications/socket/netcat::nc-connect-endpoint
    any:
      - id: micro-behaviors/process/create/shell/pipeline::pipe-to-absolute-shell-path
      - id: micro-behaviors/process/create/shell/interactive::sh-interactive
      - id: micro-behaviors/process/create/shell/interactive::sh-interactive-command
    unless:
      - id: well-known/tool/detection/llm-scanner/
      - id: well-known/tool/detection/pattern-catalog/
      - id: metadata/file/catalog/identity/
      - id: metadata/package/testing/presence/path::git-tests-directory
      - id: metadata/package/testing/presence/harness::test-directory
  - id: nc-fifo-sh-pipe-revshell
    # Exploit builders and droppers often carry this shell payload inside a
    # source string rather than in a standalone .sh member.
    for: [scripts, source]
    platforms: [linux, macos]
    mbc: B0030
    desc: Netcat FIFO reverse shell command pattern
    crit: suspicious
    conf: 0.99
    all:
      - id: micro-behaviors/fs/pipe::mkfifo-reference
      - id: micro-behaviors/communications/socket/netcat::nc-outbound-target
      - id: micro-behaviors/process/create/shell/pipeline::pipe-to-absolute-shell-path
    unless:
      - id: metadata/package/documentation/security-testing::authorized-fenced-testing-skill
      - id: well-known/tool/detection/llm-scanner/
      - id: well-known/tool/detection/pattern-catalog/
      - id: metadata/file/catalog/identity/
      - id: metadata/package/testing/presence/path::git-tests-directory
      - id: metadata/package/testing/presence/harness::test-directory
      - id: well-known/tool/offensive/
      - id: micro-behaviors/metaprogramming/generation::parameterized-shell-command-builder
      - id: micro-behaviors/metaprogramming/generation::configured-payload-generator
  - id: makeself-nc-fifo-revshell
    for: [shell]
    platforms: [linux, macos]
    mbc: B0030
    desc: Makeself embeds a Netcat FIFO reverse shell
    crit: hostile
    conf: 0.99
    all:
      - id: micro-behaviors/data/archive/package::makeself-archive-context
      - id: objectives/command-and-control/reverse-shell/netcat::nc-fifo-revshell
  - id: python-executes-nc-fifo-shell
    for: [python]
    platforms: [linux, macos]
    desc: Python system call contains a FIFO shell
    crit: hostile
    conf: 0.95
    near_bytes: 256
    all:
      - id: nc-fifo-sh-pipe-revshell
      - id: python-os-system-nc-fifo-literal
  - id: reverse-shell-netcat
    platforms: [unix, windows]
    desc: Netcat reverse shell pattern
    crit: hostile
    conf: 0.96
    for:
      - shell
      - package.json
      - javascript
      - typescript
      - text
    all:
      - id: micro-behaviors/communications/socket/netcat::nc-outbound-target
    # The required -e/--exec shell evidence below supplies the shell role.
    # A separate generic spawn fact excludes valid direct Netcat commands.
    near_bytes: 1024
    # Do not join a listener's -e shell with a separate outbound command.
    near_lines: 0
    any:
      - id: micro-behaviors/process/create/shell/interactive::nc-exec-sh
      - id: micro-behaviors/process/create/shell/interactive::ncat-exec-sh
      - id: micro-behaviors/process/create/shell/interactive::netcat-exec-sh
    unless:
      - id: metadata/lang/source/shape::javascript-literal-tables-pure-helpers
      - id: metadata/package/testing/corpus/
      - id: metadata/package/testing/presence/scripted::it-call
      - id: well-known/app/utility/cmdchamp/
      - id: well-known/tool/offensive/pentestkit/
      - id: well-known/tool/offensive/nmap::nmap-source-tree
      - id: metadata/file/format/security-corpus::command-injection-probe-list
    downgrade:
      scope: archive
      any:
      - id: well-known/tool/detection/cc-audit::cc-audit-source-package-identity
  # In JavaScript, the shell process is created by child_process.exec rather
  # than by a shell-language spawn token.  Join that executable call surface
  # to the complete nc -e /bin/sh command so reverse-shell generators that
  # merely return or print the same payload remain below hostile.
  - id: javascript-exec-netcat-reverse-shell
    platforms: [unix, windows]
    desc: Node executes nc reverse shell
    crit: hostile
    conf: 0.99
    attack: "T1059.007,T1059.004"
    mbc: B0030
    for: [javascript, typescript]
    near_bytes: 512
    all:
      - id: micro-behaviors/process/create/shell/interactive::nc-exec-sh
      - id: micro-behaviors/process/create/shell/bridge::js-exec
    unless:
      - id: metadata/package/testing/
      - id: well-known/tool/offensive/pentestkit/
      - id: well-known/tool/offensive/nmap::nmap-source-tree
      - id: metadata/path::test-directory-component
