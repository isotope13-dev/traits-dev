# netcat reverse shell via FIFO pipeline.
defaults:
  for: [shell, source]
  platforms: [linux, macos]
  attack: T1059.004
  mbc: B0030

composite_rules:
  - id: nc-fifo-revshell
    desc: netcat FIFO reverse shell pipeline
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/fs/pipe/fifo::mkfifo-reference
      - id: micro-behaviors/communications/socket/netcat/
    any:
      - id: micro-behaviors/process/create/shell/pipeline::pipe-to-absolute-shell-path
      - id: micro-behaviors/process/create/shell/interactive::sh-interactive
      - id: micro-behaviors/process/create/shell/interactive::sh-interactive-command
    unless:
      - id: well-known/tool/detection/llm-scanner/
      - id: metadata/file/catalog/identity/
      - id: metadata/package/testing/presence/harness::git-tests-directory

  - id: nc-fifo-sh-pipe-revshell
    desc: mkfifo + nc + shell pipe (classic nc revshell)
    crit: hostile
    conf: 0.99
    all:
      - id: micro-behaviors/fs/pipe/fifo::mkfifo-reference
      - id: micro-behaviors/communications/socket/netcat/
      - id: micro-behaviors/process/create/shell/pipeline::pipe-to-absolute-shell-path
    unless:
      - id: well-known/tool/detection/llm-scanner/
      - id: metadata/file/catalog/identity/
      - id: metadata/package/testing/presence/harness::git-tests-directory

  - id: nc-host-port-shell
    desc: nc with explicit host:port + shell pipeline
    crit: hostile
    conf: 0.97
    all:
      - id: micro-behaviors/communications/socket/netcat/
      - id: micro-behaviors/process/create/shell/pipeline::pipe-to-absolute-shell-path
      - id: micro-behaviors/fs/pipe/fifo::mkfifo-reference
    unless:
      - id: well-known/tool/detection/llm-scanner/
      - id: metadata/file/catalog/identity/
      - id: metadata/package/testing/presence/harness::git-tests-directory

  # Makeself archives are legitimate packaging on their own. A generated
  # archive whose install body opens a FIFO-backed interactive Netcat shell is
  # an executable C2 package, including when a privileged updater runs it.
  - id: makeself-nc-fifo-revshell
    desc: Makeself embeds a Netcat FIFO reverse shell
    crit: hostile
    conf: 0.99
    all:
      - id: micro-behaviors/data/archive/package::makeself-archive-context
      - id: objectives/command-and-control/reverse-shell/netcat::nc-fifo-revshell
