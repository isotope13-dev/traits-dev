defaults:
  platforms: [unix, windows]
  for: [package.json]
composite_rules:
- id: preinstall-netcat-reverse-shell
  desc: preinstall launches netcat reverse shell
  crit: hostile
  conf: 0.99
  mbc: "B0022"
  attack: "T1059.004"
  all:
  - id: metadata/package/scripts/lifecycle::filtered-preinstall-hook
  - id: micro-behaviors/process/interpreter/shell::preinstall-netcat-shell
  - id: micro-behaviors/communications/ip/literal::preinstall-external-ip
  - id: micro-behaviors/communications/ip/endpoint::preinstall-ip-port-endpoint
