defaults:
  platforms:
  - unix
  - windows
  for:
  - package.json
traits:
- id: preinstall-netcat-fifo-shell
  desc: Preinstall bridges shell through netcat FIFO
  crit: suspicious
  conf: 0.99
  if:
    type: yara
    source: |
      rule ordered_evidence {
        strings:
          $b0_0 = /["']preinstall["']\s*:\s*["'][^"']{0,200}\bmkfifo\s+[^;"']+;[^"']{0,200}\|\s*\/bin\/(ba)?sh\s+-i\b[^"']{0,100}\|\s*(nc|netcat)\s+[^"']{1,100}>/
        condition:
          (
            $b0_0
          )
      }
composite_rules:
- id: preinstall-netcat-reverse-shell
  desc: preinstall launches netcat reverse shell
  crit: hostile
  conf: 0.99
  mbc: B0022
  attack: T1059.004
  all:
  - id: metadata/package/scripts/lifecycle::filtered-preinstall-hook
  - id: micro-behaviors/process/interpreter/shell::preinstall-netcat-shell
  - id: micro-behaviors/communications/ip/literal::preinstall-external-ip
  - id: micro-behaviors/communications/ip/endpoint::preinstall-ip-port-endpoint
- id: preinstall-fifo-netcat-reverse-shell
  desc: preinstall launches FIFO netcat reverse shell
  crit: hostile
  conf: 0.99
  attack: T1059.004
  all:
  - id: metadata/package/scripts/lifecycle::filtered-preinstall-hook
  - id: preinstall-netcat-fifo-shell
