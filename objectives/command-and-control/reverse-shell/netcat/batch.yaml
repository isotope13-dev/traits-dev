# Windows batch one-liner that runs nc.exe -e cmd against a numeric host.
# The cheat-sheet form is a UNC copy of nc.exe, then `-e cmd <ip> <port>`.
defaults:
  platforms: [windows]
  for: [batch]
  attack: T1059.003
  crit: notable
  conf: 0.9
traits:
  - id: batch-nc-exe-e-cmd
    desc: Batch launches nc.exe with a shell
    if:
      type: text
      regex: '(?i)\bnc\.exe"?\s+-e\s+cmd(\.exe)?\b'
  - id: batch-nc-numeric-endpoint
    desc: Netcat targets a numeric host port
    if:
      type: text
      regex: '(?i)\bnc\.exe"?\s+-e\s+cmd(\.exe)?\s+([0-9]{1,3}\.){3}[0-9]{1,3}\s+[0-9]{2,5}\b'

composite_rules:
  - id: batch-nc-exe-reverse-shell
    desc: Batch netcat executes a remote shell
    crit: hostile
    conf: 0.97
    near_lines: 3
    all:
      - id: batch-nc-exe-e-cmd
      - id: batch-nc-numeric-endpoint
