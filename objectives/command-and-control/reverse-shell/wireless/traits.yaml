# Reverse shell over raw 802.11, as demonstrated against Broadcom
# gateways: command output on the router is hex-encoded and returned
# inside vendor action frames (`wl actframe`), so the channel needs no
# IP address, listener, or internet-reachable C2 server.
defaults:
  platforms: [unix, appliance]
  for: [shell, python, c, cpp, go, rust]
  attack: T1048
  crit: hostile
  conf: 0.97

composite_rules:
  - id: wireless-action-frame-reverse-shell
    desc: Returns command output in 802.11 action frames
    crit: hostile
    conf: 0.98
    near_lines: 40
    all:
      - id: micro-behaviors/hardware/wireless/network::wl-actframe-command
      - id: micro-behaviors/hardware/wireless/network::wl-actframe-variable-payload
      - id: micro-behaviors/data/encode/hex::piped-hex-encode-shell-output
