defaults:
  platforms: [unix]
  for: [javascript]
  attack: T1059.004,T1090

traits:
  - id: node-bash-command-binding
    desc: Sets Bash as child command
    crit: notable
    if:
      type: text
      regex: 'command\s*=\s*["'']bash["'']'
  - id: node-bash-ngrok-nc-args
    desc: Passes nc and ngrok to Bash
    crit: notable
    if:
      type: text
      regex: 'args\s*=\s*\[["'']-i["''],\s*["'']nc["''],\s*["''][0-9]+\.tcp\.[a-z0-9-]+\.ngrok\.io'
  - id: node-spawn-bound-command-args
    desc: Spawns bound command and arguments
    crit: notable
    if:
      type: text
      regex: 'spawn\(command,\s*args,\s*\{\s*stdio:\s*["'']ignore["'']'
  - id: node-reverse-shell-comment
    desc: Labels command as reverse shell
    crit: notable
    if:
      type: text
      substr: 'reverse shell command'

composite_rules:
  - id: node-bash-ngrok-reverse-shell-attempt
    desc: Attempts malformed Bash ngrok reverse shell
    crit: hostile
    conf: 0.98
    scope: file
    all:
      - id: node-bash-command-binding
      - id: node-bash-ngrok-nc-args
      - id: node-spawn-bound-command-args
      - id: node-reverse-shell-comment
