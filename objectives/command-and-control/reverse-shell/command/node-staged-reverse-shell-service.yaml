defaults:
  for: [javascript]
  platforms: [unix]
  attack: T1059.004,T1105

traits:
  - id: node-staged-reverse-shell-service
    desc: Stages reverse-shell service command
    crit: hostile
    conf: 0.98
    if:
      type: tree-sitter
      query: |
        ((program
          (lexical_declaration (variable_declarator name: (object_pattern (shorthand_property_identifier_pattern) @exec)
            value: (call_expression function: (identifier) @require arguments: (arguments (string (string_fragment) @module)))))
          (expression_statement (assignment_expression left: (member_expression object: (identifier) @exports)
            right: (function_expression body: (statement_block
              (expression_statement (call_expression function: (identifier) @exec_use
                arguments: (arguments (string (string_fragment) @command)))))))))
          (#eq? @exec "exec")
          (#eq? @require "require")
          (#eq? @module "child_process")
          (#eq? @exports "exports")
          (#eq? @exec @exec_use)
          (#match? @command "^/?bin/bash[[:space:]]+-c[[:space:]]+\"curl[[:space:]]+https?//reverse-shell[.]sh/[0-9.]+:[0-9]+[[:space:]]*[|][[:space:]]*sh\"$"))
