defaults:
  for: [ruby]
  platforms: [unix, windows]
  attack: T1059.006,T1071

composite_rules:
  - id: ruby-outbound-socket-open3-shell
    desc: Ruby outbound socket runs received commands
    crit: hostile
    conf: 0.97
    mbc: B0030.002
    all:
      - id: micro-behaviors/communications/socket/connect/tcp::ruby-socket-connect
      - id: objectives/command-and-control/remote-command/dispatch/command::ruby-socket-open3-command-shell
