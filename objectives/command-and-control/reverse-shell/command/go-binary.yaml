defaults:
  platforms: [linux]
  for: [elf]
  arch: [x86-64]
  attack: T1059.004
composite_rules:
  # Require Bash argv construction close to the timed network setup;
  # library methods merely linked into an obfuscated binary do not qualify.
  - id: go-timed-command-loop
    desc: Go timed network setup near Bash command construction
    crit: suspicious
    conf: 0.95
    arch: [x86-64]
    near_bytes: 2048
    all:
      - id: micro-behaviors/communications/socket/connect/attempt::go-five-second-network-call-setup
      - id: micro-behaviors/process/create/shell/command-mode::go-amd64-bash-c-argv
    # The code window carries the behavior. Obfuscation is file context,
    # so put it in a separate composite rather than the proximity window.
  - id: garbled-go-timed-reverse-shell
    desc: Garble-obfuscated Go command loop over a timed connection
    crit: hostile
    conf: 0.97
    arch: [x86-64]
    all:
      - id: go-timed-command-loop
      - id: objectives/anti-static/obfuscation/obfuscator/garble::go-garble-indicators
      - id: micro-behaviors/data/stream/read::go-binary-read-string-reference
      - id: micro-behaviors/process/create/subprocess/capture::go-binary-renamed-combined-output-reference
