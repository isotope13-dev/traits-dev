traits:
  - id: jpeg-comment-python-pty-reverse-shell
    desc: JPEG comment contains Python reverse shell
    for: [jpeg]
    platforms: [unix, windows]
    crit: hostile
    conf: 0.98
    attack: T1059.006
    if:
      type: yara
      source: |
        rule jpeg_comment_python_pty_reverse_shell {
          strings:
            $comment = { FF FE }
            $code_socket = "socket.socket("
            $code_connect = ".connect("
            $code_dup = "os.dup2("
            $code_fileno = ".fileno("
            $code_pty = "pty.spawn("
          condition:
            uint16be(0) == 0xffd8 and all of ($code*) and
            for any i in (1..#comment) : (
              uint16be(@comment[i] + 2) >= 2 and
              @comment[i] + uint16be(@comment[i] + 2) + 2 <= filesize and
              all of ($code*) in (@comment[i] + 4 .. @comment[i] + uint16be(@comment[i] + 2) + 1)
            )
        }
