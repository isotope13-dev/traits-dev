# A statically-linked, stripped ELF that carries one hardcoded address, hunts
# for whatever shell the host happens to have, and allocates a pseudo-terminal
# to run it in.
#
# This is the portable-implant build: no dynamic imports to inspect, no
# symbols, no configuration file, and the same source cross-compiled for every
# architecture an embedded target might use — the sample this was written for
# is big-endian PowerPC64 out of Buildroot, which is not a shape any commodity
# packer or scanner heuristic is aimed at. Text is all that survives, so the
# rule is built from text.
#
# Each leg is separately ordinary. Monitoring agents pin an address; container
# runtimes probe for an interpreter; terminal multiplexers open PTYs. What has
# no ordinary reading is all three in one static binary with no name, no
# version string and no configuration: an address it cannot be pointed away
# from, an interpreter it will find wherever it lands, and an interactive
# terminal to hand over.
defaults:
  platforms: [linux]
  for: [elf]
  attack: "T1059.004,T1071"
  mbc: B0022

composite_rules:
  - id: static-elf-pty-shell-to-pinned-address
    desc: Static ELF opens a PTY shell to a pinned IP
    crit: hostile
    conf: 0.96
    all:
      - id: micro-behaviors/communications/ip/literal::external-ipv4-host-literal-binary
      - id: micro-behaviors/process/create/shell/native::multi-shell-path-probe-set
      - id: micro-behaviors/fs/path/device/terminal::dev-ptmx
    any:
      # Corroboration that the binary means to persist or stage on the host it
      # lands on rather than merely talk to it.
      - id: micro-behaviors/fs/path/temp::hidden-tmp-state-file
      - id: micro-behaviors/fs/path/temp::android-local-tmp-path
      - id: micro-behaviors/fs/path/device/terminal::dev-pts
