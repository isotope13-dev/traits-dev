# Shell paths and an IP alone do not establish a reverse shell. Require the
# record dispatch and descriptor-forwarding code, PTY surface and process
# interference table recovered from this implant's controller loop.
defaults:
  platforms: [linux]
  for: [elf]
  arch: [mips]
composite_rules:
  - id: mips-command-record-pty-shell
    desc: MIPS command-record relay with PTY shell and process targets
    crit: hostile
    conf: 0.98
    attack: T1059.004,T1095
    all:
      - id: micro-behaviors/data/control-flow/branch::mips-r6-byte-command-switch
      - id: micro-behaviors/process/io/stream::mips-r6-record-body-descriptor-write
      - id: micro-behaviors/fs/path/device/terminal::dev-ptmx
      - id: micro-behaviors/fs/path/binary::multiple-shell-path-references
      - id: micro-behaviors/communications/socket/syscall::mips-socket-operation
      - id: micro-behaviors/fs/proc/info/cmdline::downloader-shell-command-target-table
    any:
      - id: micro-behaviors/communications/ip/literal::external-ipv4-host-literal-binary
      - id: micro-behaviors/fs/path/device/terminal::dev-pts
