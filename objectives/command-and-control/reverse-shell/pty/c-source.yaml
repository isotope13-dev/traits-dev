# PTY Backdoor Detection - C/C++ Source Code
# Detects PTY-based backdoor patterns in C source (openpty + socket + dup2 + /bin/sh)
# ATT&CK: T1059.004 (Unix Shell)
# MBC: B0024 (Remote Access)
defaults:
  platforms: [unix]
  for: [c, cpp]
  mbc: "B0024"
  attack: "T1059.004"
traits:
- id: port-31337
  desc: Default backdoor port 31337
  crit: component
  conf: 0.9
  if:
    type: text
    regex: '(^|[^0-9,])3133[67]($|[^0-9,])'
- id: reverse-remote-shell
  desc: Reverse Remote Shell description
  crit: suspicious
  conf: 0.95
  if:
    type: text
    substr: "Reverse Remote Shell"
composite_rules:
  # Source-level PTY reverse shell: PTY master + socket + dup2 + /bin/sh
  # Complexity: all(3) + any(needs 1) + for(1) = 5 >= 4 HOSTILE
  #
  # The allocation leg accepts either spelling. The ELF sibling in
  # ../pty/binary.yaml has always matched both, but this source rule was keyed
  # to openpty(3) alone, so a handwritten posix_openpt + grantpt + unlockpt +
  # ptsname sequence -- what the rctl-derived router implants and most static
  # embedded builds use -- read as clean.
- id: source-pty-reverse-shell
  desc: PTY reverse shell in C source
  crit: hostile
  conf: 0.95
  all:
  - id: micro-behaviors/process/tty/pty::pty-master-allocation
  - id: micro-behaviors/communications/socket/connect::connect-symbol
  - id: micro-behaviors/process/fd/dup::dup2
  any:
  - id: micro-behaviors/process/interpreter/shell::bin-sh
  - id: micro-behaviors/process/create/execv::c-exec-family-source
  - id: micro-behaviors/process/create/execv::c-exec-variants
  - id: port-31337
  unless:
  # Terminal emulators, OpenSSH, screen/tmux and the like legitimately join a
  # PTY to a socket; a recognized product identity clears the combination.
  - id: objectives/command-and-control/reverse-shell/pty::pty-native-runtime-context
