defaults:
  platforms: [unix, windows]
  for: [python]
traits:
- id: stdio-socket
  desc: Connected socket supplies subprocess stdio
  crit: suspicious
  conf: 0.98
  if:
    type: tree-sitter
    query: |
      ((block
        (expression_statement (assignment left: (identifier) @sock
          right: (call function: (attribute object: (identifier) @module
            attribute: (identifier) @create))))
        . (expression_statement (call function: (attribute object: (identifier) @connected
          attribute: (identifier) @connect)))
        . (_ (call function: (attribute object: (identifier) @subprocess
          attribute: (identifier) @spawn)
          arguments: (argument_list
            (keyword_argument name: (identifier) @stdin value: (identifier) @input)
            (keyword_argument name: (identifier) @stdout value: (identifier) @output)))))
        (#eq? @module "socket") (#eq? @create "socket")
        (#eq? @sock @connected) (#eq? @connect "connect")
        (#eq? @subprocess "subprocess") (#eq? @spawn "Popen")
        (#eq? @stdin "stdin") (#eq? @stdout "stdout")
        (#eq? @sock @input) (#eq? @sock @output))
