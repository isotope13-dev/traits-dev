defaults:
  platforms:
  - linux
  - windows
  - macos
traits:
- id: socat-exec-sh
  desc: socat EXEC shell pattern
  crit: notable
  conf: 0.8
  for:
  - shell
  - package.json
  - markdown
  if:
    type: text
    regex: socat\s+.{0,50}EXEC.{0,20}sh
- id: shell-python-pty-spawn-bash
  desc: Shell promotes Python PTY bash
  crit: suspicious
  conf: 0.96
  attack: T1059.006
  for:
  - shell
  - text
  - markdown
  unless:
  - id: well-known/app/utility/cmdchamp/
  - id: well-known/app/system/anthropic-cybersecurity-skills::defensive-cybersecurity-skills-repository
  - id: well-known/tool/offensive/xalgorix::repository-member-path
  - id: well-known/tool/offensive/bingo/
  if:
    type: text
    regex: 'python3?\s+-c\s+[''"]import\s+pty;\s*pty\.spawn\([''"]/bin/bash'
- id: socat-tcp-exec
  desc: socat TCP EXEC pattern
  crit: notable
  conf: 0.8
  for:
  - shell
  - package.json
  - markdown
  if:
    type: text
    regex: socat\s+.{0,50}TCP.{0,30}EXEC
- id: socat-pty
  desc: socat PTY pattern
  crit: notable
  conf: 0.8
  for:
  - shell
  - package.json
  - markdown
  if:
    type: text
    regex: socat\s+.{0,50}PTY
  unless:
    - id: metadata/lang/source::linux-kernel-secondary-tree-path
    - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-scripts
    - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-extra
    - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-mmfs
    - id: metadata/lang/source::linux-kernel-primary-tree-path
- id: telnet-pipe
  desc: telnet piped reverse shell pattern
  crit: notable
  conf: 0.8
  for:
  - shell
  - package.json
  if:
    type: text
    regex: telnet\s+\S+\s+\d+\s*\|.{0,50}\|\s*telnet
- id: mknod-telnet
  desc: mknod telnet reverse shell pattern
  crit: notable
  conf: 0.8
  for:
  - shell
  - package.json
  if:
    type: text
    regex: mknod.{0,30}telnet
composite_rules:
- id: python-pty
  desc: Python PTY spawn reverse shell
  crit: suspicious
  conf: 0.95
  attack: T1059.006
  for:
  - python
  all:
  - id: micro-behaviors/process/tty/pty/
  - id: micro-behaviors/communications/socket/create::python-socket
  - id: micro-behaviors/communications/socket/connect::connect-python
  any:
  - id: micro-behaviors/process/create/shell/spawn::bin-sh
  - id: micro-behaviors/process/create/shell/spawn::bin-shell
  - id: micro-behaviors/process/create/shell/spawn::python-bash-path
  # Do not combine imports and unrelated socket/process helpers across a
  # large utility module; a reverse-shell handler is locally adjacent.
  near_lines: 64
  unless:
  - id: metadata/package/quality/benign-context::twicc-terminal-path
  - id: well-known/app/infrastructure/skypilot::skypilot-source-file
  - id: well-known/tool/detection/pipguard::pipguard-defensive-scanner-source
  - id: well-known/tool/development/luma::archive-member
- id: python-socket-shell
  desc: Python socket/process shell indicators
  # Socket calls, subprocess pipes, and a shell-path literal are incomplete
  # indicators when collected from a broad utility module.  Keep this as
  # component evidence; hostile descendants add a command loop or C2 address.
  crit: component
  conf: 0.95
  attack: T1059.006
  for:
  - python
  all:
  - id: micro-behaviors/communications/socket/connect::socket-socket-call
  - id: micro-behaviors/communications/socket/connect::socket-connect-method
  - id: micro-behaviors/process/create/subprocess::import-subprocess
  - id: micro-behaviors/process/fd/stdio::python-subprocess-pipe-args
  any:
  - id: micro-behaviors/process/create/shell/spawn::bin-sh
  - id: micro-behaviors/process/create/shell/spawn::bin-shell
  - id: micro-behaviors/process/create/shell/spawn::python-bash-path
  unless:
  - id: micro-behaviors/communications/socket/family::af-unix-socket
  downgrade:
    any:
    - id: micro-behaviors/process/fd/stdio::pipe-constant
- id: python-command-loop-shell
  desc: Python socket command loop shell
  crit: suspicious
  conf: 0.96
  attack: T1059.006
  for:
  - pyc
  all:
  - id: metadata/file/magic/identity::python-bytecode
  - id: micro-behaviors/process/create/subprocess::popen-pipe-communicate
  - id: micro-behaviors/process/create/subprocess::subprocess-output-options
  - id: micro-behaviors/process/create/subprocess::subprocess-shell-cwd-options
- id: stdio-socket
  desc: Python subprocess stdio bridged to socket
  crit: suspicious
  conf: 0.9
  attack: T1059
  for: [scripts, binaries]
  all:
  - id: micro-behaviors/process/fd/stdio::python-custom-stdio
  any:
  - id: micro-behaviors/communications/socket/connect::socket-connect-call
  - id: micro-behaviors/communications/socket/connect::socket-connect-method
  near_bytes: 4096
  downgrade:
    any:
    - id: metadata/package/testing/presence/harness::python-test-file
    - id: metadata/package/testing/presence/harness::unittest-module
    - id: objectives/anti-static/obfuscation/payload/container::source-map-extension
    - id: metadata/file/format/structured::sourcemap-sources-content
  unless:
  - id: well-known/tool/offensive/sic-security/
  - id: well-known/tool/development/breezy::ssh-transport
  - id: well-known/app/ai/copilot-sdk-supercharged::tcp-cli-connect-fn
  - id: well-known/app/ai/copilot-sdk-supercharged::copilot-client-class
- id: stdio-dup2-socket
  desc: Python socket descriptor bridged to stdio
  crit: suspicious
  unless:
    - id: well-known/tool/detection/agent-glovebox::archive-context
    - id: well-known/app/system/remotepower::documented-rmm-release-context
    - id: well-known/tool/offensive/commix::commix-source-file
    - id: well-known/tool/offensive/pentestkit/
    - id: well-known/tool/offensive/bingo/
    - id: well-known/tool/offensive/keris::package-tree-member
    - id: well-known/tool/offensive/reconprobe/
  conf: 0.9
  attack: T1059.006
  for: [python, pyc]
  all:
  - id: micro-behaviors/process/fd/stdio::py-stdio-dup2
  any:
  - id: micro-behaviors/communications/socket/connect::socket-connect-call
  - id: micro-behaviors/communications/socket/connect::socket-connect-method
- id: socat
  desc: Socat reverse shell pattern
  crit: suspicious
  conf: 0.95
  attack: T1059.004
  for:
  - shell
  - package.json
  - markdown
  any:
  - id: socat-exec-sh
  - id: socat-tcp-exec
  - id: socat-pty
  unless:
  - id: well-known/tool/sysadmin/network::socat-upstream-test-suite
- id: shell-python-pty-promotion
  desc: Python PTY shell promotion
  crit: hostile
  conf: 0.98
  attack: T1059.006
  for:
  - shell
  - text
  - markdown
  all:
  - id: micro-behaviors/process/interpreter/python::python-inline-command
  - id: shell-python-pty-spawn-bash
  unless:
  - id: well-known/app/utility/cmdchamp/
  - id: well-known/app/system/anthropic-cybersecurity-skills::defensive-cybersecurity-skills-repository
  - id: well-known/tool/offensive/xalgorix::repository-member-path
  - id: well-known/tool/offensive/bingo/
- id: telnet-comp
  desc: Telnet-based reverse shell
  crit: suspicious
  conf: 0.95
  attack: T1059.004
  for:
  - shell
  - package.json
  any:
  - id: telnet-pipe
  - id: mknod-telnet
- id: python-reverse-shell-c2
  desc: Python reverse shell with hardcoded C2 IP
  crit: hostile
  conf: 0.99
  attack: T1059.006
  for:
  - python
  all:
  - id: python-socket-shell
  - id: micro-behaviors/communications/ip/literal::external-ipv4-script
- id: python-command-loop-c2
  desc: Python socket command shell with hardcoded C2
  crit: hostile
  conf: 0.99
  attack: T1059.006
  for:
  - pyc
  all:
  - id: python-command-loop-shell
  - id: micro-behaviors/communications/ip/literal::external-ipv4-binary
