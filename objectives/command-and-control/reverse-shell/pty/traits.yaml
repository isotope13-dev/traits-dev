defaults:
  platforms:
  - linux
  - windows
  - macos
traits:
- id: shell-python-pty-spawn-bash
  desc: Shell promotes Python PTY bash
  crit: suspicious
  conf: 0.96
  attack: T1059.006
  for:
  - shell
  - text
  - markdown
  unless:
  - id: well-known/app/utility/cmdchamp/
  - id: well-known/app/system/anthropic-cybersecurity-skills::defensive-cybersecurity-skills-repository
  - id: well-known/app/ai/knowledge/farai-data::farai-data-repository
  - id: well-known/tool/offensive/xalgorix::repository-member-path
  - id: well-known/tool/offensive/bingo/
  - id: metadata/package/documentation/agent-safety::authorized-redteam-skill-documentation
  if:
    type: text
    regex: 'python3?\s+-c\s+[''"]import\s+pty;\s*pty\.spawn\([''"]/bin/bash'
composite_rules:
- id: python-pty
  desc: Python PTY spawn reverse shell
  crit: suspicious
  conf: 0.95
  attack: T1059.006
  for:
  - python
  all:
  - id: micro-behaviors/process/tty/pty/
  - id: micro-behaviors/communications/socket/create::python-socket
  - id: micro-behaviors/communications/socket/connect::connect-python
  any:
  - id: micro-behaviors/process/interpreter/shell::bin-sh
  - id: micro-behaviors/process/create/shell/spawn::bin-shell
  - id: micro-behaviors/process/create/shell/spawn::python-bash-path
  # Do not combine imports and unrelated socket/process helpers across a
  # large utility module; a reverse-shell handler is locally adjacent.
  near_lines: 64
  unless:
  - id: well-known/lib/vendor-sdk/twicc::twicc-terminal-path
  - id: well-known/app/infrastructure/skypilot::skypilot-source-file
  - id: well-known/tool/detection/pipguard::pipguard-defensive-scanner-source
  - id: well-known/tool/development/luma::archive-member
- id: stdio-socket
  desc: Python subprocess stdio bridged to socket
  crit: suspicious
  conf: 0.9
  attack: T1059
  for: [scripts, binaries]
  all:
  - id: micro-behaviors/process/fd/stdio::python-custom-stdio
  any:
  - id: micro-behaviors/communications/socket/connect::socket-connect-call
  - id: micro-behaviors/communications/socket/connect::socket-connect-method
  near_bytes: 4096
  downgrade:
    any:
    - id: metadata/package/testing/presence/harness::python-test-file
    - id: metadata/package/testing/presence/harness::unittest-module
    - id: metadata/file/format/source-map::sourcemap
    - id: metadata/file/format/source-map::sourcemap-sources-content
  unless:
  - id: well-known/tool/offensive/sic-security/
  - id: well-known/tool/development/vcs/breezy::ssh-transport
  - id: well-known/app/ai/coding-agent/copilot-sdk-supercharged::tcp-cli-connect-fn
  - id: well-known/app/ai/coding-agent/copilot-sdk-supercharged::copilot-client-class
  # AF_UNIX is local IPC, not a network reverse shell: the standard library
  # browser launcher bridges subprocess stdio for TTY browsers while talking
  # to a local browser instance over a Unix-domain socket.
  - id: micro-behaviors/communications/socket/family::af-unix-socket
- id: stdio-dup2-socket
  desc: Python socket descriptor bridged to stdio
  crit: suspicious
  # A large utility can contain an unrelated socket client and descriptor
  # redirection in separate subsystems. Reverse-shell bridging keeps the
  # connect and dup2 operations in the same small handler.
  near_bytes: 4096
  unless:
    - id: metadata/package/testing/corpus::ran-bundled-adversary-templates
    - id: metadata/package/testing/corpus/
    # Grouped rather than N named leaves (RULES.md suppression-budget
    # guidance): any catalogued dual-use offensive tool/framework is a
    # directory reference, which counts once instead of summing.
    - id: well-known/tool/offensive/
    - id: well-known/lib/ai/unsloth::unsloth-package-context
    - id: well-known/tool/detection/agent-glovebox::archive-context
    - id: well-known/app/system/remotepower::documented-rmm-release-context
  conf: 0.9
  attack: T1059.006
  for: [python, pyc]
  all:
  - id: micro-behaviors/process/fd/stdio::py-stdio-dup2
  any:
  - id: micro-behaviors/communications/socket/connect::socket-connect-call
  - id: micro-behaviors/communications/socket/connect::socket-connect-method
- id: socat
  desc: socat outbound shell relay with a pseudo-terminal
  crit: suspicious
  conf: 0.95
  attack: T1059.004
  for: [shell, package.json, markdown]
  near_lines: 2
  all:
  - id: micro-behaviors/communications/proxy/relay::socat-tcp-shell-relay
  - id: micro-behaviors/communications/socket/connect::socat-tcp-connect
  - id: micro-behaviors/process/tty/pty::socat-pty-option
  unless:
  - id: well-known/tool/sysadmin/network::socat-upstream-test-suite
  - id: metadata/package/documentation/agent-safety::security-example-documentation
- id: shell-python-pty-promotion
  desc: Python PTY shell promotion
  crit: hostile
  conf: 0.98
  attack: T1059.006
  for:
  - shell
  - markdown
  all:
  - id: micro-behaviors/process/interpreter/python::python-inline-command
  - id: shell-python-pty-spawn-bash
  unless:
  - id: well-known/app/utility/cmdchamp/
  - id: well-known/app/system/anthropic-cybersecurity-skills::defensive-cybersecurity-skills-repository
  - id: well-known/app/ai/knowledge/farai-data::farai-data-repository
  - id: well-known/app/ai/coding-agent/yana-ai::yana-ai-security-audit-product-context
  - id: well-known/tool/offensive/xalgorix::repository-member-path
  - id: well-known/tool/offensive/bingo/
  - id: metadata/package/documentation/agent-safety::authorized-redteam-skill-documentation
