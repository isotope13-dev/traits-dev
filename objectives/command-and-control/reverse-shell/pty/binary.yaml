defaults:
  platforms:
  - linux
  - macos
  for:
  - elf
  - macho
  mbc: B0024
  attack: T1059.004
composite_rules:
- id: pty-native-runtime-context
  desc: Recognized PTY-capable native runtime context
  crit: exception
  conf: 0.99
  any:
  - id: well-known/tool/sysadmin/busybox::busybox-banner
  - id: well-known/app/network/dropbear::server-binary
- id: mips-named-client-reverse-shell
  desc: MIPS client dispatches a named PTY reverse shell
  crit: hostile
  conf: 0.99
  attack: T1059.004,T1095
  for:
  - elf
  arch:
  - mips
  all:
  - id: micro-behaviors/process/tty/pty::pty-allocation-symbols
  - id: micro-behaviors/communications/socket/connect::connect
  - id: micro-behaviors/process/fd/dup::dup2
  - id: micro-behaviors/process/create/shell/
  - id: micro-behaviors/process/tty/terminal::terminal-attribute-control
  - id: objectives/lateral-movement/brute-force/iot-creds::mirai-credential-access
- id: pty-bind-shell
  desc: PTY bind shell (listens for connections)
  crit: hostile
  conf: 0.95
  for:
  - elf
  scope: leaf
  near_bytes: 32768
  all:
  - id: micro-behaviors/process/tty/pty::pty-allocation-symbols
  - id: micro-behaviors/communications/socket/accept::accept-func
  - id: micro-behaviors/communications/socket/bind/function::bind
  - id: micro-behaviors/process/fd/dup::dup2
  - id: micro-behaviors/process/create/shell/
  unless:
  - id: pty-native-runtime-context
  - id: well-known/app/ai/coding-agent/reason-machines::reason-machines-cli-context
  - id: well-known/lib/runtime/scripted/bun-runtime/
  - id: metadata/binary/linking/runtime::musl-loader-basename
  - id: micro-behaviors/dylib/library/libc::is-libc-binary
- id: pty-dual-mode-backdoor
  desc: PTY shell with both reverse and bind shell modes
  crit: hostile
  conf: 0.93
  for:
  - elf
  scope: leaf
  size_min: 32768
  near_bytes: 65536
  mbc: B0022,B0024
  all:
  - id: micro-behaviors/process/tty/pty::grantpt
  - id: micro-behaviors/process/tty/pty::unlockpt
  - id: micro-behaviors/process/fd/dup::dup2
  - id: micro-behaviors/process/create/exec::execve-import
  - id: micro-behaviors/communications/socket/connect::connect
  - id: micro-behaviors/communications/socket/accept::accept-func
  - id: micro-behaviors/communications/socket/bind/function::bind
  any:
  - id: micro-behaviors/process/daemonize/detach::setsid-import
  - id: micro-behaviors/process/daemonize/detach::fork-new-session
  unless:
  - id: pty-native-runtime-context
  - id: well-known/tool/sysadmin/busybox::busybox-binary
  - id: metadata/binary/linking/runtime::musl-loader-basename
  - id: micro-behaviors/dylib/library/libc::is-libc-binary
  - id: micro-behaviors/communications/ipc/unix-socket::unix-socket-pty-host
  downgrade:
    any:
    - id: micro-behaviors/ui/help/
    - id: metadata/signed/platform/
    - id: well-known/lib/runtime/scripted/bun-runtime/
