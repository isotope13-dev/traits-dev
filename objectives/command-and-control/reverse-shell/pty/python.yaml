# Remote Shell Detection
# MBC: OB0004 (Command & Control) → B0030 (C2 Communication)
# ATT&CK: T1059 (Command and Scripting Interpreter)
# NOTE: Socket connect/bind/listen are defined in communications/socket/*/unix.yaml
defaults:
  crit: hostile
  mbc: B0030.002
  attack: T1059.006
  platforms: [unix, windows]
  for: [python]
composite_rules:
  - id: python-dup2-c2
    desc: Python PTY reverse shell connects to a hardcoded IP and port
    conf: 0.99
    all:
      - id: python-socket-dup2-pty-revshell
      - id: micro-behaviors/communications/socket/dial::python-connect-ip-port
  - id: python-socket-dup2-pty-revshell
    desc: Python socket-to-stdio PTY reverse shell
    conf: 0.99
    all:
    - id: micro-behaviors/process/fd/dup::inline-python-socket-dup2
    - id: micro-behaviors/process/tty/pty::pty-spawn-inline-shell-text
    any:
    - id: micro-behaviors/process/fd/stdio::py-stdio-dup2
    - id: micro-behaviors/process/fd/stdio::python-dup2-stdio-loop
    near_lines: 20
    unless:
    - id: well-known/tool/detection/llm-scanner/
    - id: micro-behaviors/metaprogramming/generation::configured-payload-generator
    - id: micro-behaviors/metaprogramming/generation::parameterized-shell-command-builder
