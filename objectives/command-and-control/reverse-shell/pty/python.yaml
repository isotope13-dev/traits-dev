# Remote Shell Detection
# MBC: OB0004 (Command & Control) → B0030 (C2 Communication)
# ATT&CK: T1059 (Command and Scripting Interpreter)
# NOTE: Socket connect/bind/listen are defined in communications/socket/*/unix.yaml
defaults:
  platforms: [unix, windows]
  for: [python]
composite_rules:
  - id: python-dup2-c2
    desc: Python PTY reverse shell connects to a hardcoded IP and port
    crit: hostile
    conf: 0.99
    attack: T1059.006
    mbc: "OB0004"
    all:
      - id: python-socket-dup2-pty-revshell
      - id: micro-behaviors/communications/socket/dial::python-connect-ip-port
  - id: python-socket-dup2-pty-revshell
    desc: Python socket + os.dup2 + pty.spawn reverse shell
    crit: hostile
    conf: 0.99
    mbc: B0030.002
    attack: T1059.006
    all:
      - id: objectives/command-and-control/reverse-shell/dup::inline-python-socket-dup2
    any:
      - id: micro-behaviors/process/tty/pty::pty-spawn
      - id: micro-behaviors/process/tty/pty::pty-spawn-inline-shell-text
    unless:
      - id: well-known/tool/detection/llm-scanner/
  - id: python-socket-fd-bridge-pty-revshell
    desc: Python connects a socket FD to stdio and spawns a PTY shell
    crit: hostile
    conf: 0.98
    mbc: B0030.002
    attack: T1059.006
    all:
      - id: micro-behaviors/communications/socket/connect::socket-connect-method
      - id: objectives/command-and-control/reverse-shell/dup::python-dup2
      - id: objectives/command-and-control/reverse-shell/dup::python-fileno
      - id: micro-behaviors/process/tty/pty::pty-spawn
    near_lines: 20
    unless:
      - id: well-known/tool/detection/llm-scanner/
