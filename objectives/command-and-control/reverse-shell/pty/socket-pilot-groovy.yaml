# Canonical placement from the socket-shell cohort audit.
defaults:
  for:
  - groovy
  platforms:
  - linux
  - macos
  - windows
  crit: hostile
  attack: T1059
  mbc: B0030.002
composite_rules:
- id: groovy-python-reverse-shell
  desc: Python PTY socket-shell payload execution
  conf: 0.98
  all:
    - id: micro-behaviors/process/create/shell/command-string::groovy-shell-command-execute
    - id: micro-behaviors/process/create/inline-script::groovy-python-c-command
    - id: micro-behaviors/communications/socket/connect::groovy-python-socket-connect
    - id: micro-behaviors/process/fd/dup::groovy-python-dup2-stdio
    - id: micro-behaviors/process/tty/pty::groovy-python-pty-shell
  unless:
    - id: well-known/tool/detection/llm-scanner/
- id: groovy-python-reverse-shell-payload
  desc: Python PTY socket-shell payload
  conf: 0.97
  all:
    - id: micro-behaviors/process/create/inline-script::groovy-python-c-command
    - id: micro-behaviors/communications/socket/connect::groovy-python-socket-connect
    - id: micro-behaviors/process/fd/dup::groovy-python-dup2-stdio
    - id: micro-behaviors/process/tty/pty::groovy-python-pty-shell
  unless:
    - id: well-known/tool/detection/llm-scanner/
