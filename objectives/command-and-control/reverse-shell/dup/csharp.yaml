# C# reverse shell: TcpClient + Process redirect stdio + cmd.exe/sh.
defaults:
  for: [csharp]
  platforms: [linux, macos, windows]
  attack: T1059
  mbc: B0030.002

traits:
  - id: csharp-tcpclient-host-port
    desc: C# TcpClient with host and port literal
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: 'new\s+TcpClient\s*\(\s*"[^"]{1,80}"\s*,\s*\d{2,5}\s*\)'
composite_rules:
  - id: csharp-revshell
    desc: C# reverse shell (TcpClient + redirected Process stdio + shell)
    crit: hostile
    conf: 0.98
    all:
      - id: csharp-tcpclient-host-port
      - id: micro-behaviors/process/create/spawn::redirect-standard-output-dotnet
      - id: micro-behaviors/communications/socket/create::tcpclient-get-stream
    unless:
      - id: well-known/tool/detection/llm-scanner/

  - id: csharp-cmd-revshell
    desc: C# TcpClient + cmd.exe Process redirection
    crit: hostile
    conf: 0.99
    all:
      - id: csharp-tcpclient-host-port
      - id: micro-behaviors/process/create/spawn::redirect-standard-output-dotnet
      - id: micro-behaviors/process/create/exec::csharp-cmd-exe-startinfo
    unless:
      - id: well-known/tool/detection/llm-scanner/

  - id: csharp-tcpclient-process-shell
    desc: C# TcpClient + Process + cmd.exe shell
    crit: hostile
    conf: 0.98
    all:
      - id: csharp-tcpclient-host-port
      - id: micro-behaviors/process/create/start-process::dotnet-process-object-creation
      - id: micro-behaviors/process/create/exec::csharp-cmd-exe-startinfo
    unless:
      - id: well-known/tool/detection/llm-scanner/

  # The three composites above all hinge on `new TcpClient("host", 4444)`. An
  # implant that decrypts its endpoint at runtime — or a sample whose config
  # has been zeroed before sharing — has no literal host/port pair and slips
  # past all of them. The bridge itself is the behavior worth naming: a socket
  # stream on one side, cmd.exe with stdin AND stdout redirected on the other.
  # Redirecting stdout alone is ordinary "run a tool, read its output" code;
  # writing to the child's stdin from a network stream is an interactive shell.
  - id: csharp-cmd-stream-bridge-revshell
    desc: C# bridges a socket stream to interactive cmd.exe
    crit: hostile
    conf: 0.96
    all:
      - id: micro-behaviors/communications/socket/create::tcpclient-create
      - id: micro-behaviors/communications/socket/create::tcpclient-get-stream
      - id: micro-behaviors/process/create/exec::csharp-cmd-exe-startinfo
      - id: micro-behaviors/process/create/spawn::redirect-standard-input-dotnet
      - id: micro-behaviors/process/create/spawn::redirect-standard-output-dotnet
    unless:
      - id: well-known/tool/detection/llm-scanner/
