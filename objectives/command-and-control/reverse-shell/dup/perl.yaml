defaults:
  platforms: [unix, windows]
  for: [perl]
traits:
  - id: perl-redir
    desc: Perl file descriptor redirect
    crit: component
    conf: 0.75
    if:
      type: string_literal
      regex: '>&[A-Za-z_][A-Za-z0-9_]*'
  - id: stdin-socket-redir
    desc: STDIN redirected to socket
    crit: notable
    conf: 0.96
    if:
      type: text
      regex: 'open\s*\(\s*STDIN\s*,\s*"?>&[A-Z_]'
  - id: stdout-socket-redir
    desc: STDOUT redirected to socket
    crit: notable
    conf: 0.96
    if:
      type: text
      regex: 'open\s*\(\s*STDOUT\s*,\s*"?>&[A-Z_]'
  - id: stderr-socket-redir
    desc: STDERR redirected to socket
    crit: notable
    conf: 0.96
    if:
      type: text
      regex: 'open\s*\(\s*STDERR\s*,\s*"?>&[A-Z_]'
  - id: perl-stdin-dup-read
    desc: Reopens STDIN from another handle
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: 'open\s+STDIN\s*,\s*["'']<&'
  - id: perl-stdout-dup-write
    desc: Reopens STDOUT onto another handle
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: 'open\s+STDOUT\s*,\s*["'']>&'
composite_rules:
  - id: stdio-socket-redirect
    desc: Redirects stdio to socket
    crit: notable
    conf: 0.98
    all:
      - id: stdin-socket-redir
      - id: stdout-socket-redir
      - id: stderr-socket-redir
  - id: perl-revshell-hostile
    desc: Perl reverse shell (socket + stdio redirect + exec shell)
    crit: hostile
    conf: 0.98
    mbc: B0030.002
    all:
      - id: objectives/command-and-control/reverse-shell/socket-exec::sockaddr-in-connect
      - id: stdio-socket-redirect
      - id: micro-behaviors/process/create/shell/spawn::bin-sh-interactive
    unless:
      - id: well-known/tool/detection/llm-scanner/
  - id: perl-socket-stdio-shell
    desc: Perl socket connect paired with STDIN reopen on socket + exec
    crit: hostile
    conf: 0.97
    mbc: B0030.002
    all:
      - id: micro-behaviors/communications/socket/create::socket-call
      - id: stdio-socket-redirect
      - id: micro-behaviors/process/create/shell/spawn::bin-sh-interactive
    unless:
      - id: well-known/tool/detection/llm-scanner/
  - id: perl-sockaddr-stdio-shell
    desc: Perl sockaddr_in + STDIO reopen + exec shell
    crit: hostile
    conf: 0.97
    mbc: B0030.002
    all:
      - id: objectives/command-and-control/reverse-shell/socket-exec::sockaddr-in-connect
      - id: micro-behaviors/communications/socket/create::socket-call
      - id: micro-behaviors/process/create/shell/spawn::bin-sh-interactive
    unless:
      - id: well-known/tool/detection/llm-scanner/
  - id: perl-pf-inet-revshell-skeleton
    desc: Perl PF_INET socket + stdio redirect + exec
    crit: hostile
    conf: 0.97
    mbc: B0030.002
    all:
      - id: micro-behaviors/communications/socket/connect::perl-sockaddr-in
      - id: stdio-socket-redirect
      - id: micro-behaviors/communications/socket/create::socket-call
    unless:
      - id: well-known/tool/detection/llm-scanner/
  - id: perl-revshell-quadruple
    desc: Perl sockaddr_in + PF_INET + stdio redirect + exec sh
    crit: hostile
    conf: 0.99
    mbc: B0030.002
    all:
      - id: objectives/command-and-control/reverse-shell/socket-exec::sockaddr-in-connect
      - id: micro-behaviors/communications/socket/family::perl-socket-pf-inet
      - id: stdio-socket-redirect
      - id: micro-behaviors/process/create/shell/spawn::bin-sh-interactive
    unless:
      - id: well-known/tool/detection/llm-scanner/
  - id: perl-dup-stdio-exec
    desc: Perl execs a shell on duped stdio
    crit: hostile
    conf: 0.97
    attack: T1059
    near_lines: 8
    all:
      - id: perl-stdin-dup-read
      - id: perl-stdout-dup-write
      - id: micro-behaviors/process/create/shell/lang::perl-exec-variable
    unless:
      - id: metadata/package/testing/presence/harness::perl-test-file
      - id: well-known/tool/detection/llm-scanner/
      - id: well-known/tool/development/vcs/git-for-windows::vendored-tree
