defaults:
  platforms: [linux, macos, windows]
  for: [javascript, typescript]
  attack: T1059
traits:
- id: node-socket-pipe-shell-stdin
  desc: Node socket piped into spawned shell stdin
  crit: suspicious
  conf: 0.92
  platforms: [openwrt]
  if:
    type: text
    substr: sock.pipe(shell.stdin)
- id: node-shell-stdout-pipe-socket
  desc: Spawned shell stdout piped to Node socket
  crit: suspicious
  conf: 0.92
  platforms: [openwrt]
  if:
    type: text
    substr: shell.stdout.pipe(sock)
- id: cmd-exe-string
  desc: cmd.exe shell string
  crit: component
  conf: 0.75
  if:
    type: text
    word: cmd.exe
- id: rfc1918-host-string--rx-1
  desc: RFC1918 private IP prefix (10./192.168.)
  crit: component
  conf: 0.75
  if:
    type: text
    regex: '\b(10\.(\d{1,3}\.){2}\d{1,3}|192\.168\.(\d{1,3}\.)\d{1,3})\b'
    is: valid_ip
  count_max: 1009711
- id: rfc1918-host-string--rx-2
  desc: Regex component marker
  crit: component
  conf: 0.75
  if:
    type: text
    regex: '(172\.(1[6-9]|2[0-9]|3[0-1])\.)'
  count_max: 1009712
composite_rules:
- id: node-dev-tcp-bash-reverse-shell
  desc: Node Bash reverse shell over dev-tcp
  crit: hostile
  conf: 0.99
  mbc: B0030.002
  all:
  - id: micro-behaviors/process/create/shell/spawn::node-spawn-bash-shell
  - id: micro-behaviors/communications/socket/connect::dev-tcp-path
  - id: micro-behaviors/process/create/shell/spawn::bash-interactive-fd-bridge
  near_bytes: 1200
- id: socket-with-exec
  desc: Socket combined with command execution
  crit: suspicious
  conf: 0.9
  near_bytes: 2048
  all:
  - id: micro-behaviors/communications/socket/connect::net-socket-connect-method
  - id: micro-behaviors/process/create/exec::exec-api-call
  any:
  - id: micro-behaviors/communications/socket/receive::node-socket-data-event
  - id: micro-behaviors/process/fd/stdio::node-stream-pipe
- id: cmd-shell-rfc1918-bridge
  desc: cmd.exe shell to hardcoded RFC1918 host
  crit: hostile
  conf: 0.95
  all:
  - id: socket-with-exec
  - id: cmd-exe-string
  - id: rfc1918-host-string
- id: rfc1918-host-string
  desc: RFC1918 host string
  crit: component
  conf: 0.75
  any:
  - id: rfc1918-host-string--rx-1
  - id: rfc1918-host-string--rx-2

- id: node-exec-inline-python-reverse-shell
  desc: Node exec inline Python reverse shell
  crit: hostile
  conf: 0.99
  mbc: B0030.002
  near_bytes: 1200
  all:
  - id: micro-behaviors/process/interpreter/embedded-python::js-inline-python-dup2-stdio
  - id: micro-behaviors/process/interpreter/embedded-python::js-inline-python-pty-shell
  - id: micro-behaviors/process/create/shell/bridge::js-exec
  any:
  - id: micro-behaviors/process/interpreter/embedded-python::js-exec-inline-python-command
  - id: micro-behaviors/process/interpreter/embedded-python::js-inline-python-socket-create
  - id: micro-behaviors/process/interpreter/embedded-python::js-inline-python-socket-connect
  - id: micro-behaviors/process/interpreter/shell::bin-sh
  unless:
  - id: well-known/tool/detection/llm-scanner/

- id: node-net-connect-spawn-shell
  desc: Node net.connect + spawn shell + pipe
  crit: hostile
  conf: 0.99
  mbc: B0030.002
  all:
  - id: micro-behaviors/communications/socket/connect::net-connect-port
  - id: micro-behaviors/process/create/shell/bridge/
  - id: micro-behaviors/process/interpreter/shell::bin-sh
  unless:
  - id: well-known/tool/detection/llm-scanner/

- id: node-pipe-shell-stdio-to-socket
  desc: Node sock.pipe to child stdio
  crit: hostile
  conf: 0.98
  mbc: B0030.002
  all:
  - id: micro-behaviors/communications/socket/connect::net-connect-port
  - id: micro-behaviors/process/interpreter/shell::bin-sh
  any:
  - id: micro-behaviors/process/create/shell/bridge/
  - id: micro-behaviors/process/create/exec::exec-api-call
  unless:
  - id: well-known/tool/detection/llm-scanner/

- id: node-net-connect-shell-pipe-bridge
  desc: Node net.connect + shell bridge with command execution
  crit: hostile
  conf: 0.97
  mbc: B0030.002
  all:
  - id: micro-behaviors/communications/socket/connect::net-connect-port
  - id: micro-behaviors/process/create/shell/bridge/
  - id: micro-behaviors/process/interpreter/shell::bin-sh
  any:
  - id: micro-behaviors/process/create/exec::exec-api-call
  near_bytes: 4096
  unless:
  - id: well-known/tool/detection/llm-scanner/

- id: node-spawn-bin-sh-pipe-net
  desc: Node spawn /bin/sh paired with socket pipe
  crit: hostile
  conf: 0.97
  mbc: B0030.002
  all:
  - id: micro-behaviors/process/create/shell/bridge/
  - id: micro-behaviors/process/interpreter/shell::bin-sh
  - id: micro-behaviors/communications/socket/connect::net-connect-port
  unless:
  - id: well-known/tool/detection/llm-scanner/

# Socket().connect(port, host) + cp.spawn('/bin/bash') + stdio pipes —
# common condensed Node reverse-shell shape that skips net.connect/bin/sh.
- id: node-bash-socket-stdio-reverse-shell
  desc: Node bash spawn piped over Socket.connect
  crit: hostile
  conf: 0.98
  mbc: B0030.002
  all:
  - id: micro-behaviors/process/create/shell/spawn::node-spawn-bash-shell
  - id: micro-behaviors/communications/socket/connect::node-net-socket-connect
  - id: micro-behaviors/process/fd/stdio::node-stream-to-stdin-pipe
  - id: micro-behaviors/process/fd/stdio::node-child-output-to-stream-pipe
  unless:
  - id: well-known/tool/detection/llm-scanner/

- id: node-bash-socket-port-reverse-shell
  desc: Node bash spawn with Socket.connect port and host
  crit: hostile
  conf: 0.97
  mbc: B0030.002
  all:
  - id: micro-behaviors/process/create/shell/spawn::node-spawn-bash-shell
  - id: micro-behaviors/communications/socket/connect::socket-connect-port-host
  - id: micro-behaviors/communications/socket/connect::net-socket-connect-method
  - id: objectives/command-and-control/backdoor/keywords::reverse-shell-match
  unless:
  - id: well-known/tool/detection/llm-scanner/

- id: node-revshell-quadruple
  desc: Node socket child-process shell
  crit: hostile
  conf: 0.99
  mbc: B0030.002
  all:
  - id: micro-behaviors/communications/socket/connect::net-connect-port
  - id: micro-behaviors/process/create/shell/bridge/
  - id: micro-behaviors/process/interpreter/shell::bin-sh
  - id: micro-behaviors/process/create/exec::exec-api-call
  unless:
  - id: well-known/tool/detection/llm-scanner/

- id: node-createconnection-stdio-reverse-shell
  desc: Node net.createConnection stdio reverse shell
  crit: hostile
  conf: 0.98
  mbc: B0030.002
  platforms: [openwrt]
  all:
  - id: micro-behaviors/communications/socket/connect::net-create-connection-call
  - id: node-socket-pipe-shell-stdin
  - id: node-shell-stdout-pipe-socket
  - id: micro-behaviors/process/interpreter/shell::bin-sh
  unless:
  - id: well-known/tool/detection/llm-scanner/

- id: node-dynamic-import-reverse-shell
  desc: Node dynamically imported command shell bridged to socket
  crit: hostile
  conf: 0.99
  mbc: B0030.002
  attack: T1059.007
  all:
  - id: micro-behaviors/os/module/load::dynamic-import-expression
  - id: micro-behaviors/process/create/exec::js-object-exec-call
  - id: micro-behaviors/communications/socket/connect::node-net-socket-connect
  - id: micro-behaviors/process/fd/stdio::node-stream-to-stdin-pipe
  - id: micro-behaviors/process/fd/stdio::node-child-output-to-stream-pipe
  near_bytes: 2048
  unless:
  - id: well-known/tool/detection/llm-scanner/

# A custom decoder hides the net.Socket constructor, connect method, shell
# executable, and stdio property names from ordinary source matchers. The
# structural legs still require an obfuscated computed constructor/call
# cluster, Node child-process creation, and a computed module load in one file.
- id: node-obfuscated-computed-stream-reverse-shell
  desc: Obfuscated Node child-process stream reverse shell
  crit: hostile
  conf: 0.99
  mbc: B0030.002
  attack: T1059.007,T1095
  all:
  - id: objectives/anti-static/obfuscation/obfuscator/js-obfuscator::a0-string-decoder-entrypoint
  - id: micro-behaviors/process/create/spawn::spawn-call
  - id: micro-behaviors/os/module/dynamic-load::node-computed-require-call
  - id: micro-behaviors/data/source/property/computed::js-obfuscated-computed-call-cluster
  - id: micro-behaviors/data/source/property/computed::js-computed-constructor
  near_bytes: 24576
  unless:
  - id: well-known/tool/detection/llm-scanner/
