# Rust reverse shell: a remote socket, duplicated descriptors, and a shell.
defaults:
  for: [rust]
  platforms: [linux, macos]
  attack: T1059
  mbc: B0030.002

composite_rules:
  - id: rust-revshell
    desc: Rust reverse shell (TcpStream + libc::dup + Command shell + raw-fd stdio)
    crit: hostile
    conf: 0.99
    all:
      - id: micro-behaviors/communications/socket/connect::tcpstream-connect-host-literal
      - id: micro-behaviors/process/fd/dup::rust-libc-dup-fd
      - id: micro-behaviors/process/fd/stdio::rust-stdio-from-raw-fd
    any:
      - id: micro-behaviors/process/create/direct::rust-bin-sh-c-call
      - id: micro-behaviors/process/create/direct::rust-bin-sh-i-call
    unless:
      - id: well-known/tool/detection/llm-scanner/

  - id: rust-tcpstream-shell-command
    desc: Rust TcpStream paired with Command shell and raw-fd stdio
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/communications/socket/connect::tcpstream-connect-host-literal
      - id: micro-behaviors/process/fd/stdio::rust-stdio-from-raw-fd
    any:
      - id: micro-behaviors/process/create/direct::rust-bin-sh-c-call
      - id: micro-behaviors/process/create/direct::rust-bin-sh-i-call
    unless:
      - id: well-known/tool/detection/llm-scanner/

  - id: rust-tcpstream-libc-dup-shell
    desc: Rust TcpStream + libc::dup + shell Command
    crit: hostile
    conf: 0.97
    all:
      - id: micro-behaviors/communications/socket/connect::tcpstream-connect-host-literal
      - id: micro-behaviors/process/fd/dup::rust-libc-dup-fd
    any:
      - id: micro-behaviors/process/create/direct::rust-bin-sh-c-call
      - id: micro-behaviors/process/create/direct::rust-bin-sh-i-call
    unless:
      - id: well-known/tool/detection/llm-scanner/
