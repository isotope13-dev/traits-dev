# Cross-language reverse-shell aggregator composites.
# Other reverse-shell technique dirs reference any-shell-exec or the canonical
# socket-dial capability directory to combine shell execution with a dial.
defaults:
  crit: hostile
  for: [scripts, source]
  platforms: [linux, macos, windows]
  attack: T1059
  mbc: B0030
composite_rules:
  - id: dup2-plus-shell-exec
    for: [python, c]
    desc: dup2 stdio plus shell exec
    conf: 0.97
    scope: leaf
    near_lines: 80
    all:
      - id: micro-behaviors/process/fd/dup::dup2
      - id: objectives/command-and-control/reverse-shell/socket-exec::any-shell-exec
      - id: micro-behaviors/process/interpreter/shell::bin-sh
    unless:
      - id: well-known/tool/detection/llm-scanner/
      - id: well-known/tool/detection/security-scanner/
      - id: metadata/build/recognized-contexts::benign-app-fp-context
      # This variant has no socket leg, so `nsenter`-style container attach
      # satisfies it: setns() into an existing namespace, dup2 a PTY onto
      # stdio, execle /bin/sh -l -i. HTCondor ships exactly that as
      # condor_tools/nsenter.cpp. A reverse shell never calls setns, and the
      # socket-bearing sibling below still covers the case where one does.
      - id: micro-behaviors/os/container/namespace::setns-str
  - id: socket-dup2-shell-exec
    for: [python, c]
    desc: socket dial plus dup2 plus shell exec (classic revshell triple)
    conf: 0.99
    scope: leaf
    near_lines: 80
    all:
      - id: micro-behaviors/communications/socket/dial/
      - id: micro-behaviors/process/fd/dup::dup2
      - id: objectives/command-and-control/reverse-shell/socket-exec::any-shell-exec
      - id: micro-behaviors/process/interpreter/shell::bin-sh
    unless:
      - id: well-known/tool/detection/llm-scanner/
      - id: well-known/tool/detection/security-scanner/
      - id: metadata/build/recognized-contexts::benign-app-fp-context
