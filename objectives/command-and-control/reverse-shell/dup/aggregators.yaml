# Cross-language reverse-shell aggregator composites.
# Other reverse-shell technique dirs reference any-shell-exec or the canonical
# socket-dial capability directory to combine shell execution with a dial.
defaults:
  for: [scripts, source]
  platforms: [linux, macos, windows]
  attack: T1059
  mbc: B0030

composite_rules:
  # The shell binary itself is the spawned program (or is fed on stdin), as
  # opposed to a command string handed to `sh -c`.  Kept separate from
  # any-shell-exec because `sh -c <cmd>` and a bare `bash` reference are
  # ordinary scripting: every CI script, installer, and build wrapper runs
  # one, so they are too weak to carry a two-leg hostile composite on their own.
  - id: any-shell-binary-spawn
    desc: Shell binary spawned directly or fed on stdin
    crit: component
    conf: 0.9
    unless:
      - id: well-known/app/storage/community-scripts-proxmoxve::mirror-connectivity-context
    any:
      - id: micro-behaviors/process/create/shell/interactive::sh-interactive
      - id: micro-behaviors/process/create/shell/spawn::bin-sh-interactive
      - id: micro-behaviors/process/create/shell/lang::ruby-shell-exec
      - id: micro-behaviors/process/create/shell/lang::go-exec-command-bin-sh
      - id: objectives/command-and-control/reverse-shell/dup::java-runtime-exec-shell-array
      - id: micro-behaviors/process/create/shell/pipeline::pipe-to-absolute-shell-path

  - id: any-shell-exec
    desc: Shell execution primitive aggregate
    crit: component
    conf: 0.9
    unless:
      - id: well-known/app/storage/community-scripts-proxmoxve::mirror-connectivity-context
    any:
      - id: any-shell-binary-spawn
      - id: micro-behaviors/process/create/shell/spawn::bash-exec
      - id: micro-behaviors/process/create/shell/command-string::sh-c-exec

  - id: socket-plus-shell-exec
    desc: socket dial plus direct shell binary spawn
    crit: hostile
    conf: 0.96
    scope: leaf
    near_lines: 10
    all:
      - id: micro-behaviors/communications/socket/dial/
      - id: any-shell-binary-spawn
    unless:
      - id: well-known/tool/detection/
      - id: metadata/package/quality/benign-context::benign-app-fp-context
      - id: well-known/lib/runtime/jruby/
      - id: metadata/package/testing/harness/
      - id: well-known/tool/offensive/bingo::bingo-pentest-module-context

  - id: dup2-plus-shell-exec
    desc: dup2 stdio plus shell exec
    crit: hostile
    conf: 0.97
    scope: leaf
    near_lines: 80
    all:
      - id: micro-behaviors/process/fd/dup::dup2
      - id: any-shell-exec
      - id: micro-behaviors/process/create/shell/spawn::bin-sh
    unless:
      - id: well-known/tool/detection/llm-scanner/
      - id: well-known/tool/detection/security-scanner/
      - id: metadata/package/quality/benign-context::benign-app-fp-context
  - id: socket-dup2-shell-exec
    desc: socket dial plus dup2 plus shell exec (classic revshell triple)
    crit: hostile
    conf: 0.99
    scope: leaf
    near_lines: 80
    all:
      - id: micro-behaviors/communications/socket/dial/
      - id: micro-behaviors/process/fd/dup::dup2
      - id: any-shell-exec
      - id: micro-behaviors/process/create/shell/spawn::bin-sh
    unless:
      - id: well-known/tool/detection/llm-scanner/
      - id: well-known/tool/detection/security-scanner/
      - id: metadata/package/quality/benign-context::benign-app-fp-context

  - id: socket-plus-interactive-shell
    desc: socket dial plus /bin/sh -i interactive shell
    crit: hostile
    conf: 0.98
    scope: leaf
    # Without proximity, an unrelated socket call (e.g. TLS test harness) and an
    # unrelated `sh -i` (e.g. interactive-debug helper) co-occur in the same file
    # and trip a hostile finding. Mirror socket-plus-shell-exec's proximity.
    near_lines: 80
    all:
      - id: micro-behaviors/communications/socket/dial/
      - id: micro-behaviors/process/create/shell/interactive::sh-interactive
    unless:
      - id: well-known/tool/detection/llm-scanner/
      - id: well-known/tool/detection/security-scanner/
      - id: well-known/tool/detection/security-scanner-identity::ks-aur-scanner-source-context
      - id: metadata/package/testing/presence/harness::test-directory-path
      - id: metadata/package/quality/benign-context::benign-app-fp-context

      - id: well-known/tool/offensive/bingo/
  - id: socket-shell-exec-malware-term
    desc: Socket dial and executed shell near reverse-shell term
    crit: hostile
    conf: 0.96
    scope: leaf
    near_lines: 80
    all:
      - id: micro-behaviors/communications/socket/dial/
      - id: objectives/command-and-control/backdoor/keywords::reverse-shell-match
    # A bare /bin/bash literal is only a shell reference and commonly occurs
    # in CLI help. Require either a direct shell-binary spawn or an explicit
    # shell -c execution so this rule actually proves execution.
    any:
      - id: any-shell-binary-spawn
      - id: micro-behaviors/process/create/shell/command-string::sh-c-exec
    unless:
      - id: well-known/app/utility/cmdchamp::cli-trainer-source-context
      - id: well-known/tool/detection/llm-scanner/
      - id: well-known/tool/detection/security-scanner/
      - id: metadata/package/quality/benign-context::benign-app-fp-context
      - id: well-known/tool/offensive/bingo::bingo-pentest-module-context

  - id: node-hosted-reverse-shell-loader
    desc: Node loads a hosted reverse shell through curl
    crit: hostile
    conf: 0.97
    attack: "T1105, T1059.007"
    mbc: B0032.001
    all:
      - id: micro-behaviors/process/create/shell/bridge::child-process-require
      - id: micro-behaviors/communications/http/download/curl::curl-pipe-shell-in-js-exec
      - id: objectives/command-and-control/dropper/delivery/pipe::hosted-reverse-shell-service
