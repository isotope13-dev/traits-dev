# Objective-C reverse shell: BSD socket + dup2 + NSTask shell.
defaults:
  crit: hostile
  for: [objc]
  platforms: [linux, macos]
  attack: T1059
  mbc: B0030.002
composite_rules:
  - id: objc-revshell
    desc: Objective-C socket dup2 reverse shell
    conf: 0.99
    all:
      - id: micro-behaviors/communications/socket/create::objc-ipv4-tcp-socket-source
      - id: micro-behaviors/process/create/shell/launch::nstask-shell-launch
      - id: micro-behaviors/process/fd/dup::source-dup2-stdio
    unless:
      - id: well-known/tool/detection/llm-scanner/
  - id: objc-nstask-interactive-shell
    desc: Objective-C NSTask dup2 shell
    conf: 0.98
    all:
      - id: micro-behaviors/process/create/shell/launch::nstask-shell-launch
      - id: objectives/command-and-control/reverse-shell/socket-exec::nstask-interactive-args
      - id: micro-behaviors/process/fd/dup::source-dup2-stdio
    unless:
      - id: well-known/tool/detection/llm-scanner/
  - id: objc-bsd-socket-revshell-triple
    desc: BSD socket dup2 shell
    conf: 0.99
    all:
      - id: micro-behaviors/communications/socket/create::objc-ipv4-tcp-socket-source
      - id: objectives/command-and-control/reverse-shell/socket-exec::objc-connect-call
      - id: micro-behaviors/process/fd/dup::source-dup2-stdio
      - id: objectives/command-and-control/reverse-shell/socket-exec::objc-shell-spawn
    unless:
      - id: well-known/tool/detection/llm-scanner/
