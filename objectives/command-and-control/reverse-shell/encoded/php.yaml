# Some packed PHP webshells reverse and ROT13 their source before wrapping it
# in Base64. Match the decoded-layer back-connect label rather than a sample
# hash, filename, operator host, or variable name.
defaults:
  for: [php]
  platforms: [unix]
  attack: T1059.004
  mbc: B0030

traits:
  - id: php-rot13-reversed-back-connect-label
    desc: Reversed ROT13 back-connect label in Base64
    crit: suspicious
    conf: 0.99
    if:
      type: encoded
      encoding: base64
      regex: '\]yerc\[\s+gpraabp-xpnO'
    unless:
      - id: well-known/tool/detection/

composite_rules:
  - id: php-packed-back-connect-shell
    desc: Packed PHP contains bind and back-connect shells
    crit: hostile
    conf: 0.99
    all:
      - id: php-rot13-reversed-back-connect-label
      - id: objectives/command-and-control/backdoor/bind-shell::php-rot13-reversed-bind-port-label
      - id: micro-behaviors/process/interpreter/eval/direct::eval-call
