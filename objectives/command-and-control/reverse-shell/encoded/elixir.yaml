defaults:
  for: [elixir]
  platforms: [linux, macos]
  attack: T1059.004
  mbc: B0030

composite_rules:
  - id: elixir-encoded-reverse-shell
    desc: Decodes reverse shell alongside shell invocation
    crit: hostile
    conf: 0.95
    all:
      - id: objectives/anti-static/obfuscation/encoding/content::encoded-reverse-shell-pattern
      - id: micro-behaviors/data/decode/base64::elixir-base64-decode
      - id: micro-behaviors/process/create/shell/spawn::elixir-system-cmd-unix-shell
