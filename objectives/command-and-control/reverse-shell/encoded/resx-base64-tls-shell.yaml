defaults:
  platforms:
  - windows
  for:
  - xml
  attack: T1059.001,T1059.004
traits:
- id: base64-tcpclient-name
  desc: Base64 encodes .NET TCPClient reference
  crit: notable
  conf: 0.98
  if:
    type: text
    regex: (TmV0LlNvY2tldHMuVENQQ2xp|dC5Tb2NrZXRzLlRDUENsaWVu|ZXQuU29ja2V0cy5UQ1BDbGll)
- id: base64-invoke-expression
  desc: Base64 encodes PowerShell Invoke-Expression
  crit: suspicious
  conf: 0.98
  if:
    type: text
    regex: (SW52b2tlLUV4cHJlc3Np|dm9rZS1FeHByZXNz|bnZva2UtRXhwcmVzc2lv)
- id: base64-dotnet-process-start
  desc: Base64 encodes .NET Process Start signature
  crit: suspicious
  conf: 0.98
  if:
    type: yara
    source: |
      rule ordered_evidence {
        strings:
          $b0_0 = /(U3lzdGVtLkRpYWdub3N0aWNzLlByb2Nlc3MgU3Rh|c3RlbS5EaWFnbm9zdGljcy5Qcm9jZXNzIFN0|eXN0ZW0uRGlhZ25vc3RpY3MuUHJvY2VzcyBTdGFy)/
        condition:
          (
            $b0_0
          )
      }
composite_rules:
- id: resx-serialized-tcp-command-shell
  desc: Serialized resource contains a TCP command execution gadget
  crit: hostile
  conf: 0.99
  all:
  - id: metadata/file/format/managed-runtime::resx-binary-object-mime
  - id: base64-tcpclient-name
  - id: base64-invoke-expression
  - id: base64-dotnet-process-start
