defaults:
  for: [perl]
  platforms: [unix]
  attack: T1059.004
  mbc: B0030

composite_rules:
  # This is a payload-and-capability signature, not a claim of proven flow.
  # Names of package APIs, environment gates, and endpoints are not inputs.
  - id: perl-encoded-reverse-shell
    desc: Encoded reverse shell with decoding and execution
    crit: hostile
    conf: 0.95
    all:
      # The Perl source stores the Base64 payload in a variable before passing
      # it to decode_base64. The generic encoded-content extractor cannot
      # recover that variable flow, but its decode/exec proximity composite
      # still records the encoded execution shape.
      - id: objectives/anti-static/obfuscation/payload/encoded::base64-subprocess-proximity
      - id: micro-behaviors/process/create/shell/spawn::perl-system-unix-shell
