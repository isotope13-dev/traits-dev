defaults:
  for: [kotlin]
  platforms: [linux, macos]
  attack: T1059.004
  mbc: B0030

composite_rules:
  - id: kotlin-base64-processbuilder-shell
    desc: Kotlin decodes Base64 for a shell process
    crit: hostile
    conf: 0.98
    scope: archive
    all:
      - id: micro-behaviors/data/decode/base64::java-base64-decoder-source-call
      - id: objectives/command-and-control/reverse-shell/socket-exec::kotlin-processbuilder-shell

  - id: kotlin-encoded-reverse-shell
    desc: Kotlin decodes and executes a reverse shell
    crit: hostile
    conf: 0.98
    near_lines: 30
    all:
      - id: objectives/anti-static/obfuscation/encoding/content::encoded-reverse-shell-pattern
      - id: micro-behaviors/data/decode/base64::java-base64-decoder-source-call
      - id: objectives/command-and-control/reverse-shell/socket-exec::kotlin-processbuilder-shell
