# Encoded PowerShell payloads can still expose their command-channel behavior
# after decoding. Require a TCP client, TLS stream, and network-fed evaluation.
defaults:
  platforms: [windows]
  for: [text]
  attack: T1059.001,T1095
  mbc: B0030.002

traits:
  - id: encoded-powershell-tcp-client
    desc: Encoded PowerShell opens a TCP client
    crit: notable
    conf: 0.98
    if:
      type: encoded
      encoding: [base64]
      regex: '(?i)TCPClient\s*\(\s*["''][^"'']+["'']\s*,\s*\d+'

  - id: encoded-powershell-ssl-stream
    desc: Encoded PowerShell wraps a stream in TLS
    crit: suspicious
    conf: 0.98
    if:
      type: encoded
      encoding: [base64]
      regex: '(?is)SslStream[\s\S]{0,300}AuthenticateAsClient'

  - id: encoded-powershell-network-command-loop
    desc: Encoded PowerShell evaluates network input
    crit: suspicious
    conf: 0.99
    if:
      type: encoded
      encoding: [base64]
      regex: '(?is)\.Read\([^)]{0,100}\)[\s\S]{0,220}Invoke-Expression\s+'

composite_rules:
  - id: encoded-powershell-tls-tcp-reverse-shell
    desc: Encoded PowerShell opens a TLS command shell
    crit: hostile
    conf: 0.99
    all:
      - id: encoded-powershell-tcp-client
      - id: encoded-powershell-ssl-stream
      - id: encoded-powershell-network-command-loop
