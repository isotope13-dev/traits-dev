# Linux syscall reverse shell: AF_INET socket + stdio dup + execve sequence.
#
# Every leg must be resolved AT the syscall site. Statically linked musl
# binaries embed raw socket/connect/dup2/execve syscall instructions inside
# libc wrappers (and an AF_UNIX nscd client) regardless of what the program
# does, so bare "syscall site exists" legs convict every large static binary
# with networking and subprocess support. The intent-bearing legs here are the
# two with resolved arguments that only inline syscall code produces: an
# immediate AF_INET domain and a dup2/dup3 targeting a standard stream.
defaults:
  crit: hostile
  platforms: [linux]
  for: [elf]
  attack: T1059
  mbc: B0030

composite_rules:
  - id: syscall-reverse-shell-linux
    desc: Linux syscall reverse shell (AF_INET socket + stdio dup + execve)
    mbc: B0030.002
    conf: 0.9
    all:
      - id: micro-behaviors/communications/socket/create::inet-socket-syscall
      - id: micro-behaviors/communications/socket/create::socket-connect
      - id: micro-behaviors/process/create/execv::syscall-execve-elf
    any:
      - id: micro-behaviors/process/create/shell/fd::dup2-stdin-target-syscall
      - id: micro-behaviors/process/create/shell/fd::dup2-stdout-target-syscall
      - id: micro-behaviors/process/create/shell/fd::dup2-stderr-target-syscall
    unless:
      - id: well-known/lib/native/glibc::libc-soname
      - id: micro-behaviors/dylib/library/libc::glibc-versioned-libc
      - id: micro-behaviors/dylib/library/libc::is-libc-binary
  - id: x86-64-syscall-pinned-ip-reverse-shell
    desc: x86-64 syscall reverse shell with pinned IP
    mbc: B0030.002
    conf: 0.98
    attack: T1059.004,T1095
    size_max: 65536
    all:
      - id: micro-behaviors/communications/socket/create::x86-64-socket-syscall
      - id: micro-behaviors/communications/socket/create::x86-64-connect-syscall
      - id: micro-behaviors/process/create/shell/fd::x86-64-syscall-dup2
      - id: micro-behaviors/process/create/execv::x86-64-syscall-execve
      - id: micro-behaviors/process/create/shell/spawn::bin-sh-binary-text
      - id: micro-behaviors/communications/ip/literal::external-ipv4-host-literal-binary
