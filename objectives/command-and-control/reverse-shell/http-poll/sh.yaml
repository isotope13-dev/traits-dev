# HTTP-polling command shells implemented in POSIX shell.
#
# The shell twin of the PowerShell rule beside it: a loop that curls a command
# from an HTTP endpoint, evaluates the fetched text (`eval "$cmd"`), and posts
# the output back with curl. The eval of a fetched value plus a POST that returns
# the result is the C2 round trip; a curl|sh install cradle fetches and runs but
# never uploads its output.
defaults:
  platforms: [unix]
  for: [shell]
  attack: T1071.001,T1059.004
  mbc: B0030

composite_rules:
  - id: shell-http-poll-command-shell
    desc: Shell HTTP polling command shell
    crit: hostile
    conf: 0.95
    scope: file
    all:
      # Fetch a command over HTTP.
      - id: micro-behaviors/communications/http/download/cli::curl-command-call
      # Evaluate the fetched value as a shell command.
      - id: micro-behaviors/process/interpreter/eval/direct::shell-eval-variable
      # Send the command output back over HTTP.
      - id: micro-behaviors/communications/http/curl::curl-post-flag
    any:
      # A loop makes it an interactive shell; the -d body carrying the result is
      # the alternative discriminator when the loop is structured differently.
      - id: micro-behaviors/data/control-flow/loop::shell-infinite-loop
      - id: micro-behaviors/communications/http/curl::curl-short-data-option
