# Domain Generation Algorithm (DGA) - JavaScript/Node
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
  attack: T1568.002,T1071.004

composite_rules:
  - id: node-dga-doh-tasking-channel
    desc: Node DGA generates domain for DoH tasking
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/communications/dns/domain::js-interpolated-ddns-domain-template
      - id: micro-behaviors/communications/dns/doh::doh-google-json
      - id: metadata/lang/source/syntax/operator::bigint-modulo-subscript-form
      - id: micro-behaviors/crypto/decrypt::createDecipheriv
      - id: micro-behaviors/crypto/verify::node-crypto-verify
      - id: micro-behaviors/fs/write/file/full::js-file-write
      - id: micro-behaviors/communications/dns/txt
    any:
      - id: micro-behaviors/process/create/hidden::node-hidden-policy-bypass-powershell-launch
      - id: objectives/evasion/indicator-removal/ads::node-motw-stream-removal
