# Domain Generation Algorithm (DGA) - JavaScript/Node
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
  attack: T1568.002,T1071.004

composite_rules:
  - id: node-dga-doh-tasking-channel
    desc: Node DGA generates domain for DoH tasking
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/communications/dns/domain::js-wordlist-dynamic-domain-template
      - id: micro-behaviors/communications/dns/doh::doh-google-json
    any:
      - id: micro-behaviors/communications/dns/txt::doh-txt-query-parameter
      - id: micro-behaviors/communications/dns/txt::json-answer-txt-filter
