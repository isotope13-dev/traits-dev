defaults:
  platforms: [windows]
  for: [powershell]

composite_rules:
  - id: powershell-dga-script-command-channel
    desc: PowerShell script tasking uses date-generated domains
    crit: hostile
    conf: 0.98
    attack: T1568.002
    all:
      - id: micro-behaviors/communications/dns/domain::powershell-date-seeded-domain-generator
      - id: micro-behaviors/communications/dns/label::powershell-dns-query-reference
      - id: objectives/command-and-control/backdoor/dispatch/module::powershell-socket-script-command-dispatch
