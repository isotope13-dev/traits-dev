# Python date-hashed domain generation combined with a heartbeat check-in.
# A digest slice of the current date, cycled across a literal TLD list, is
# probed with a heartbeat route until one answers - the C2 discovery loop of
# a DGA-implant family. Neither mechanic alone is hostile: hash labels and
# TLD lists appear in sharding and failover code, and heartbeats in monitors.
# ATT&CK: T1568.002 (Dynamic Resolution: Domain Generation Algorithms)
defaults:
  platforms: [windows, unix]
  for: [python]

composite_rules:
  - id: python-date-hash-dga-heartbeat-channel
    desc: Python date-hashed DGA candidates with heartbeat check-in
    crit: hostile
    conf: 0.96
    attack: T1568.002
    all:
      - id: micro-behaviors/communications/dns/domain::python-md5-slice-domain-label
      - id: micro-behaviors/communications/dns/domain::python-tld-candidate-rotation
      - id: micro-behaviors/time/schedule/interval::heartbeat-routine-label
    any:
      - id: micro-behaviors/communications/http/request/route::status-checkin-route
      - id: micro-behaviors/time/schedule/interval::heartbeat-routine-label
    unless:
      - id: metadata/package/testing/
