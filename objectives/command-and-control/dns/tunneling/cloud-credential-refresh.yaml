# DNS-delivered cloud credential refresh. The durable behavior is a paired
# length/data label protocol over AAAA answers followed by credential-bearing
# configuration persistence, independent of the service or family name.
defaults:
  platforms: [windows, unix]
  for: [csharp, python, javascript, typescript, powershell, go, pe, dll]
  attack: T1071.004
  mbc: B0030

traits:
  - id: dns-length-query-label-shape
    desc: DNS tunnel length query label shape
    crit: suspicious
    conf: 0.96
    if:
      type: text
      regex: '\{[^}]{1,32}\}\.\{[^}]{1,32}\}\.\{[^}]{1,32}\}\.p\.'

  - id: dns-data-query-label-shape
    desc: DNS tunnel data chunk label shape
    crit: suspicious
    conf: 0.97
    if:
      type: text
      regex: '\{[^}]{1,32}\}\.\{[^}]{1,32}\}\.\{[^}]{1,32}\}\.\{[^}]{1,32}\}\.q\.'

  - id: tenant-id-config-field
    desc: Entra tenant ID configuration field
    crit: component
    conf: 0.9
    if:
      type: text
      word: tenantId

  - id: client-id-config-field
    desc: Entra client ID configuration field
    crit: component
    conf: 0.9
    if:
      type: text
      word: clientId

  - id: client-secret-config-field
    desc: Entra client secret configuration field
    crit: component
    conf: 0.92
    if:
      type: text
      word: clientSecret

  - id: mailbox-config-field
    desc: Cloud mailbox configuration field
    crit: component
    conf: 0.88
    if:
      type: text
      word: mailbox

composite_rules:
  - id: entra-credential-field-set
    desc: Entra mailbox credential field set
    crit: suspicious
    conf: 0.95
    unless:
      - id: well-known/app/ai/assistant/claude-desktop::official-package-context
    all:
      - id: tenant-id-config-field
      - id: client-id-config-field
      - id: client-secret-config-field
      - id: mailbox-config-field
    # A file-wide set of common schema names is not evidence of a single
    # credential-refresh object. Keep the fields in one local config object.
    near_bytes: 4096

  - id: dns-length-data-label-pair
    desc: Paired DNS tunnel length and data labels
    crit: suspicious
    conf: 0.98
    all:
      - id: dns-length-query-label-shape
      - id: dns-data-query-label-shape

  - id: dns-cloud-credential-refresh
    desc: DNS AAAA cloud credential refresh tunnel
    crit: hostile
    conf: 0.99
    attack: T1071.004,T1552.001
    all:
      - id: micro-behaviors/communications/dns/lookup/aaaa::aaaa-record-lookup
      - id: dns-length-data-label-pair
      - id: entra-credential-field-set
      - id: micro-behaviors/fs/write/file/direct::dotnet-writealltext-token
