defaults:
  platforms: [qnx]
  for: [elf]
  attack: T1071.004

traits:
  - id: qnx-zig-dns-response-marker
    desc: Zig DNS response type marker
    crit: component
    conf: 0.9
    if:
      type: text
      substr: Io.net.HostName.DnsResponse

  - id: qnx-zig-socket-receive-marker
    desc: Zig socket receive marker
    crit: component
    conf: 0.9
    if:
      type: text
      substr: Io.net.Socket.receiveManyTimeout

  - id: qnx-zig-net-send-marker
    desc: Zig network send marker
    crit: component
    conf: 0.9
    if:
      type: text
      substr: Io.Threaded.netSendPosix

composite_rules:
  - id: qnx-zig-elf-dns-response-type
    desc: QNX Zig ELF DNS response type
    crit: suspicious
    conf: 0.9
    all:
      - id: metadata/binary/anomaly/section-header::qnx-identity
      - id: qnx-zig-dns-response-marker
    unless:
      - id: metadata/binary/linking/runtime::dynamic-loader-needed
      - id: metadata/binary/linking/runtime::glibc-needed

  - id: qnx-zig-elf-socket-receive
    desc: QNX Zig ELF socket receive
    crit: suspicious
    conf: 0.9
    all:
      - id: metadata/binary/anomaly/section-header::qnx-identity
      - id: qnx-zig-socket-receive-marker
    unless:
      - id: metadata/binary/linking/runtime::dynamic-loader-needed
      - id: metadata/binary/linking/runtime::glibc-needed

  - id: qnx-zig-elf-net-send-symbol
    desc: QNX Zig ELF net send symbol
    crit: suspicious
    conf: 0.9
    all:
      - id: metadata/binary/anomaly/section-header::qnx-identity
      - id: qnx-zig-net-send-marker
    unless:
      - id: metadata/binary/linking/runtime::dynamic-loader-needed
      - id: metadata/binary/linking/runtime::glibc-needed

  - id: qnx-zig-elf-dns-c2-channel
    desc: QNX Zig ELF DNS C2 channel
    crit: hostile
    conf: 0.96
    all:
      - id: qnx-zig-elf-dns-response-type
      - id: qnx-zig-elf-socket-receive
      - id: qnx-zig-elf-net-send-symbol
