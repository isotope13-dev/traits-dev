defaults:
  platforms: [windows, unix]
  for: [go]
  attack: T1071.004
  mbc: C0011

traits:
  - id: go-dns-label-size-chunking
    desc: Chunks data at the DNS label-size limit
    crit: component
    conf: 0.95
    if:
      type: symbol
      kind: call
      exact: chunks
      arg:
        kind: number
        value: 63
        radix: 10

composite_rules:
  - id: go-dns-encoded-payload-channel
    desc: Go transports encoded payloads in DNS labels
    crit: suspicious
    conf: 0.96
    near_bytes: 2048
    all:
      - id: micro-behaviors/data/encode/base32::go-base32-encode-call
      - id: micro-behaviors/communications/dns/struct::go-dns-wire-message
      - id: go-dns-label-size-chunking
