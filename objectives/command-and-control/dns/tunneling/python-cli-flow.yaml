# A resolver call beside an unrelated variable-held argv is not execution of
# DNS data. Bind the sink argument to the resolver process's returned value.
defaults:
  platforms: [unix, windows]
  for: [python]
  crit: suspicious
  conf: 0.98
  attack: T1071.004,T1059.006
traits:
  - id: python-dns-cli-response-eval
    desc: Python evaluates data returned by DNS CLI
    if:
      type: symbol
      kind: call
      regex: '^(exec|eval)$'
      arg:
        index: 0
        from:
          call: '^subprocess\.(check_output|run|Popen)$'
          literal: '(^|[/\s])(dig|nslookup)(\s|$)'
          through:
            - call: '\.decode$'
              receiver: true
            - call: '\.strip$'
              receiver: true
  - id: python-dns-cli-response-process
    desc: Python launches data returned by DNS CLI
    attack: T1071.004,T1059
    if:
      type: symbol
      kind: call
      regex: '^subprocess\.(run|Popen|call)$'
      arg:
        index: 0
        from:
          call: '^subprocess\.(check_output|run|Popen)$'
          literal: '(^|[/\s])(dig|nslookup)(\s|$)'
          through:
            - call: '\.decode$'
              receiver: true
            - call: '\.strip$'
              receiver: true
