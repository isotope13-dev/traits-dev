defaults:
  platforms: [unix, windows]
  for: [python, javascript, powershell, pe, elf]
  mbc: C0001
  attack: T1071.004

composite_rules:
  - id: doh-c2
    desc: DNS over HTTPS potential C2
    crit: notable
    conf: 0.75
    all:
      - id: micro-behaviors/communications/dns/doh::doh-endpoint
      - id: micro-behaviors/communications/dns/doh::doh-content-reference
    any:
      - id: metadata/file/literal::dns-exfil
      - id: metadata/file/literal::dns-c2
      - id: metadata/file/literal::dns-beacon
      - id: micro-behaviors/communications/url/host::long-alphanumeric-third-level-label
    unless:
      - id: well-known/lib/runtime/scripted/v8::isolate-symbol
