defaults:
  platforms:
  - windows
  - unix
  for:
  - scripts
  - source
  attack: T1071.004
  mbc: B0030
composite_rules:
- id: encoded-dns-txt-binary-reassembly
  for:
  - scripts
  - '!jcl'
  - go
  desc: Reassembles an encoded binary from DNS TXT response data
  crit: suspicious
  conf: 0.98
  near_lines: 80
  scope: leaf
  all:
  - id: micro-behaviors/communications/dns/txt::source-txt-query
  - id: micro-behaviors/communications/dns/txt::source-txt-response
  - id: micro-behaviors/data/decode/base64::base64-decoding
  downgrade:
    any:
    - id: well-known/tool/offensive/psbits::source-tree-member
- id: node-indexed-txt-binary-reassembly
  desc: Node indexes DNS TXT chunks and decodes the joined binary payload
  crit: suspicious
  conf: 0.98
  for:
  - javascript
  - typescript
  near_bytes: 4096
  all:
  - id: micro-behaviors/communications/dns/txt::node-indexed-txt-chunk-query
  - id: micro-behaviors/data/decode/base64::buffer-from-base64
- id: python-dns-txt-code-exec
  desc: Python executes DNS TXT response
  for:
  - python
  crit: hostile
  conf: 0.98
  near_lines: 20
  all:
  - id: micro-behaviors/communications/dns/txt::python-dns-txt-response-capture
  any:
  - id: micro-behaviors/process/interpreter/eval/direct::exec-variable
  - id: micro-behaviors/process/interpreter/eval/direct::eval-builtin
- id: node-dns-txt-code-exec
  desc: Node.js executes DNS TXT response
  for:
  - javascript
  - typescript
  crit: hostile
  conf: 0.98
  near_lines: 20
  all:
  - id: micro-behaviors/communications/dns/txt::node-resolve-txt-response-capture
  any:
  - id: micro-behaviors/process/interpreter/eval/direct::js-eval-variable-argument
  - id: micro-behaviors/process/interpreter/eval/compile::js-new-function-variable-argument
  - id: micro-behaviors/process/interpreter/eval/indirect::js-indirect-eval-variable
- id: ruby-dns-txt-code-exec
  desc: Ruby executes DNS TXT response
  for:
  - ruby
  crit: hostile
  conf: 0.98
  near_lines: 20
  all:
  - id: micro-behaviors/communications/dns/txt::ruby-dns-txt-response-capture
  - id: micro-behaviors/process/interpreter/eval/direct::ruby-eval
- id: php-dns-txt-code-exec
  desc: PHP executes DNS TXT response
  for:
  - php
  crit: hostile
  conf: 0.98
  near_lines: 20
  all:
  - id: micro-behaviors/communications/dns/txt::php-dns-txt-response-capture
  - id: micro-behaviors/process/interpreter/eval/direct::eval-call
- id: perl-dns-txt-code-exec
  desc: Perl executes DNS TXT response
  for:
  - perl
  crit: hostile
  conf: 0.98
  near_lines: 20
  all:
  - id: micro-behaviors/communications/dns/txt::perl-dns-txt-response-capture
  - id: micro-behaviors/process/interpreter/eval/direct::perl-eval-variable
- id: shell-dns-txt-code-exec
  desc: Shell executes DNS TXT response
  for:
  - shell
  crit: hostile
  conf: 0.98
  near_lines: 20
  all:
  - id: micro-behaviors/communications/dns/txt::shell-dns-txt-response-capture
  - id: micro-behaviors/process/interpreter/eval/direct::shell-eval
- id: source-dns-txt-shell-command
  desc: Source executes a shell command after a DNS TXT lookup
  crit: hostile
  conf: 0.97
  attack: T1071.004,T1059.004
  near_lines: 120
  for:
  - c
  - cpp
  - elixir
  scope: file
  all:
  - id: micro-behaviors/communications/dns/txt::nslookup-txt-command-source
  any:
  - id: micro-behaviors/process/interpreter/eval/direct::shell-dynamic-command-execution
  - id: micro-behaviors/process/create/shell/pipeline::pipeline-terminates-in-shell
- id: zig-dns-txt-shell-command
  desc: Zig executes a shell command from DNS TXT fields
  crit: hostile
  conf: 0.98
  attack: T1071.004,T1059.004
  near_lines: 80
  for:
  - zig
  scope: file
  all:
  - id: micro-behaviors/communications/dns/txt::zig-txt-fields-call
  - id: micro-behaviors/process/create/direct::zig-child-init
  any:
  - id: micro-behaviors/process/interpreter/eval/direct::shell-dynamic-command-execution
  - id: micro-behaviors/process/create/shell/pipeline::pipeline-terminates-in-shell
- id: python-dns-cli-command-exec
  desc: Python executes data from DNS lookup
  crit: hostile
  conf: 0.96
  attack: T1071.004,T1059.004
  for:
  - python
  scope: file
  near_lines: 20
  all:
  - id: micro-behaviors/communications/dns/resolver::python-dns-cli-resolver
  any:
  - id: micro-behaviors/process/interpreter/eval/direct::exec-variable
  - id: micro-behaviors/process/interpreter/eval/direct::eval-builtin
  - id: micro-behaviors/process/create/subprocess::variable-command-argument
  - id: micro-behaviors/process/create/shell/command-string::python-subprocess-sh-c-runtime-command
- id: batch-dns-txt-payload-reassembly
  desc: Batch rebuilds a decoded payload from DNS TXT response chunks
  for:
  - batch
  crit: hostile
  conf: 0.99
  attack: T1071.004,T1105,T1140
  near_lines: 80
  scope: leaf
  all:
  - id: micro-behaviors/communications/dns/txt::batch-nslookup-txt-for-f-capture
  - id: micro-behaviors/fs/write/file/redirect::batch-append-redirect
  - id: micro-behaviors/data/decode/command::certutil-decode-command
  unless:
  - id: well-known/tool/offensive/psbits::source-tree-member
