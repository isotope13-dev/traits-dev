# Cross-language DNS TXT tasking. Each composite requires a response-capture
# operation and a dynamic execution sink in the same short source region.
# A lookup alone remains a neutral DNS capability.
defaults:
  platforms: [windows, unix]
  # Every leg here is a source-code construct, but with no `for:` the
  # composites were also evaluated against archive containers, where they
  # pooled coincidental matches out of a .tar.gz's compressed bytes and
  # reported a DNS tunnel with no member file to attribute it to.
  for: [scripts, source]
  attack: T1071.004
  mbc: B0030

composite_rules:
  # A DNS TXT channel that reconstructs encoded bytes is suspicious even
  # before a caller executes them. Keep this capability cross-language and
  # leave hostile conviction to the materialization/execution composite below.
  - id: encoded-dns-txt-binary-reassembly
    desc: Reassembles an encoded binary from DNS TXT response data
    crit: suspicious
    conf: 0.98
    near_lines: 80
    # Without this the three legs pool at the archive root: a 7000-file source
    # tarball (Ansible's) satisfied "TXT query", "TXT response", and "base64
    # decode" from three unrelated members and reported a DNS tunnel with no
    # file to point at. Reassembly happens inside one unit of code.
    scope: leaf
    all:
      - id: micro-behaviors/communications/dns/lookup/txt::source-txt-query
      - id: micro-behaviors/communications/dns/lookup/txt::source-txt-response
      - id: micro-behaviors/data/decode/base64::base64-decoding

  # The npm loader uses a count record followed by numbered TXT chunks. This
  # more specific rule catches that reconstruction in a partial sample where
  # no file write or process launch is present.
  - id: node-indexed-txt-binary-reassembly
    desc: Node indexes DNS TXT chunks and decodes the joined binary payload
    crit: suspicious
    conf: 0.98
    for: [javascript, typescript]
    near_bytes: 4096
    all:
      - id: micro-behaviors/communications/dns/lookup/txt::node-indexed-txt-chunk-query
      - id: micro-behaviors/data/decode/base64::buffer-from-base64

  - id: python-dns-txt-code-exec
    desc: Python executes DNS TXT response
    for: [python]
    crit: hostile
    conf: 0.98
    near_lines: 20
    all:
      - id: micro-behaviors/communications/dns/lookup/txt::python-dns-txt-response-capture
    any:
      - id: micro-behaviors/process/interpreter/python::exec-variable
      - id: micro-behaviors/process/interpreter/python::eval-builtin

  - id: node-dns-txt-code-exec
    desc: Node.js executes DNS TXT response
    for: [javascript, typescript]
    crit: hostile
    conf: 0.98
    near_lines: 20
    all:
      - id: micro-behaviors/communications/dns/lookup/txt::node-resolve-txt-response-capture
    any:
      - id: micro-behaviors/process/interpreter/eval/direct::js-eval-variable-argument
      - id: micro-behaviors/process/interpreter/eval/compile::js-new-function-variable-argument
      - id: micro-behaviors/process/interpreter/eval/direct::js-indirect-eval-variable

  # DNS TXT can carry a binary stage without using an eval sink. Require the
  # dynamic lookup, indexed chunk query, explicit Base64 decode, materialization,
  # and hidden detached execution together; a DNS lookup or decoder alone is benign.
  - id: node-dns-txt-binary-stage
    desc: Node rebuilds and detaches an executable from DNS TXT chunks
    for: [javascript, typescript]
    crit: hostile
    conf: 0.99
    attack: "T1071.004,T1105,T1059.007,T1222.002"
    mbc: "B0030,B0024"
    near_bytes: 8192
    all:
      - id: micro-behaviors/communications/dns/lookup/txt::node-indexed-txt-chunk-query
      - id: micro-behaviors/data/decode/base64::buffer-from-base64
      - id: micro-behaviors/fs/file/write/direct::node-write-file-sync
      - id: micro-behaviors/fs/chmod/executable/mode::node-chmod-make-executable
      - id: micro-behaviors/process/create/spawn::detached-ignored-unref-spawn

  - id: ruby-dns-txt-code-exec
    desc: Ruby executes DNS TXT response
    for: [ruby]
    crit: hostile
    conf: 0.98
    near_lines: 20
    all:
      - id: micro-behaviors/communications/dns/lookup/txt::ruby-dns-txt-response-capture
      - id: micro-behaviors/process/interpreter/eval/direct::ruby-eval

  - id: php-dns-txt-code-exec
    desc: PHP executes DNS TXT response
    for: [php]
    crit: hostile
    conf: 0.98
    near_lines: 20
    all:
      - id: micro-behaviors/communications/dns/lookup/txt::php-dns-txt-response-capture
      - id: micro-behaviors/process/interpreter/eval/direct::eval-call

  - id: perl-dns-txt-code-exec
    desc: Perl executes DNS TXT response
    for: [perl]
    crit: hostile
    conf: 0.98
    near_lines: 20
    all:
      - id: micro-behaviors/communications/dns/lookup/txt::perl-dns-txt-response-capture
      - id: micro-behaviors/process/interpreter/eval/direct::perl-eval-variable

  - id: shell-dns-txt-code-exec
    desc: Shell executes DNS TXT response
    for: [shell]
    crit: hostile
    conf: 0.98
    near_lines: 20
    all:
      - id: micro-behaviors/communications/dns/lookup/txt::shell-dns-txt-response-capture
      - id: micro-behaviors/process/interpreter/eval/direct::shell-eval
