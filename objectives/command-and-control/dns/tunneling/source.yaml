# Cross-language source rules for DNS TXT tasking.  These rules model the
# behavior described in the KATA article rather than any one tunnel domain:
# encoded data in changing left-most labels under a stable suffix, followed by
# command data returned in TXT records.
defaults:
  platforms: [windows, unix]
  for: [python, powershell, javascript, typescript]
  attack: T1071.004
  mbc: C0011

traits:
  - id: python-dns-txt-subprocess
    desc: Python DNS TXT response to subprocess
    crit: suspicious
    conf: 0.95
    for: [python]
    if:
      type: text
      regex: '(?is)dns\.resolver\.(resolve|query).{0,500}subprocess\.'

  - id: javascript-dns-txt-exec
    desc: JavaScript DNS TXT response to exec
    crit: suspicious
    conf: 0.95
    for: [javascript, typescript]
    if:
      type: text
      regex: 'resolveTxt.{0,500}execSync'

composite_rules:
  - id: powershell-dns-txt-iex
    desc: PowerShell DNS TXT response to IEX
    crit: suspicious
    conf: 0.97
    for: [powershell]
    near_lines: 40
    all:
      - id: micro-behaviors/communications/dns/lookup/txt::source-txt-query
      - id: micro-behaviors/process/interpreter/eval::embedded-powershell-iex

  - id: dns-txt-response-exec-chain
    desc: DNS TXT response reaches command execution
    crit: suspicious
    conf: 0.96
    any:
      - id: python-dns-txt-subprocess
      - id: powershell-dns-txt-iex
      - id: javascript-dns-txt-exec

  - id: encoded-dns-txt-tunnel
    desc: Encoded DNS TXT tunnel with dynamic labels
    crit: hostile
    conf: 0.97
    near_lines: 80
    all:
      - id: micro-behaviors/communications/dns/label::encoded-dynamic-dns-label
      - id: micro-behaviors/communications/dns/lookup/txt::source-txt-query

  - id: dns-txt-command-tasking
    desc: DNS TXT response used for command tasking
    crit: hostile
    conf: 0.98
    attack: T1059
    near_lines: 80
    all:
      - id: micro-behaviors/communications/dns/lookup/txt::source-txt-query
      - id: dns-txt-response-exec-chain
