# Cross-language source rules for DNS TXT tasking.  These rules model the
# behavior described in the KATA article rather than any one tunnel domain:
# encoded data in changing left-most labels under a stable suffix, followed by
# command data returned in TXT records.
defaults:
  platforms: [windows, unix]
  for: [python, powershell, javascript, typescript, go]
  attack: T1071.004
  mbc: C0011

traits:
  - id: python-dns-txt-subprocess
    desc: Python DNS TXT response to subprocess
    crit: suspicious
    conf: 0.95
    for: [python]
    if:
      type: text
      regex: '(?is)dns\.resolver\.(resolve|query).{0,500}subprocess\.'

  - id: javascript-dns-txt-exec
    desc: JavaScript DNS TXT response to exec
    crit: suspicious
    conf: 0.95
    for: [javascript, typescript]
    if:
      type: text
      regex: 'resolveTxt.{0,500}execSync'

composite_rules:
  # Base32 encoding and an A-record lookup are each ordinary operations; it is
  # packing encoded output into the label of a resolution that makes the pair
  # an egress channel, so the intent lives here and the atoms stay neutral.
  - id: python-dns-a-record-output-exfil
    desc: Encodes output for DNS label exfiltration
    crit: suspicious
    conf: 0.97
    for: [python]
    all:
      - id: micro-behaviors/data/encode/base32::python-b32encode-call
    any:
      - id: micro-behaviors/communications/dns/lookup/a::python-dnspython-resolve-a
      - id: micro-behaviors/communications/dns/lookup/a::python-dnspython-query-a
    near_bytes: 1024

  - id: go-dns-txt-command-exec
    desc: Go executes a command fetched through DNS TXT
    crit: hostile
    conf: 0.97
    for: [go]
    near_lines: 30
    all:
      - id: micro-behaviors/communications/dns/lookup/txt::go-dns-txt-response-capture
      - id: micro-behaviors/process/create/direct::exec-command

  - id: powershell-dns-txt-iex
    desc: PowerShell DNS TXT response to IEX
    crit: suspicious
    conf: 0.97
    for: [powershell]
    near_lines: 40
    all:
      - id: micro-behaviors/communications/dns/lookup/txt::source-txt-response
      - id: micro-behaviors/process/interpreter/eval/direct::embedded-powershell-iex

  - id: dns-txt-response-exec-chain
    desc: DNS TXT response reaches command execution
    crit: suspicious
    conf: 0.96
    any:
      - id: python-dns-txt-subprocess
      - id: powershell-dns-txt-iex
      - id: javascript-dns-txt-exec
      - id: go-dns-txt-command-exec

  - id: node-dns-txt-callback-code-exec
    desc: Node DNS TXT callback executes tasking
    crit: hostile
    conf: 0.98
    for: [javascript, typescript]
    scope: file
    near_lines: 80
    all:
      - id: micro-behaviors/communications/dns/lookup/txt::node-resolve-txt-callback-response
      - id: micro-behaviors/process/interpreter/eval/direct::js-eval-variable-argument
      - id: micro-behaviors/communications/dns/lookup/txt::resolve-txt-reference

  - id: encoded-dns-txt-tunnel
    desc: Encoded DNS TXT tunnel with dynamic labels
    crit: hostile
    conf: 0.97
    near_lines: 80
    all:
      - id: micro-behaviors/communications/dns/label::encoded-dynamic-dns-label
      - id: micro-behaviors/communications/dns/lookup/txt::source-txt-response

  - id: dns-txt-command-tasking
    desc: DNS TXT response used for command tasking
    crit: hostile
    conf: 0.98
    attack: T1059
    near_lines: 80
    all:
      - id: micro-behaviors/communications/dns/lookup/txt::source-txt-response
      - id: dns-txt-response-exec-chain

  - id: python-dns-command-output-exfil
    desc: Python executes DNS TXT tasking and returns output through DNS labels
    crit: hostile
    conf: 0.99
    attack: T1059,T1071.004
    for: [python]
    all:
      - id: python-dns-txt-subprocess
      - id: python-dns-a-record-output-exfil
    near_bytes: 8192
