defaults:
  crit: hostile
  platforms: [windows]
  for: [powershell, html]
  attack: T1071.004
  mbc: B0030

composite_rules:
  - id: powershell-dns-txt-command-exec
    for: [html]
    desc: PowerShell executes DNS TXT response
    conf: 0.98
    near_bytes: 1024
    all:
      - id: micro-behaviors/communications/dns/txt::powershell-nslookup-txt-capture
      - id: micro-behaviors/process/interpreter/eval/direct::powershell-expression-command-text

  - id: powershell-explicit-resolver-dns-txt-exec
    for: [html]
    desc: PowerShell executes TXT from explicit resolver
    conf: 0.99
    near_bytes: 1024
    all:
      - id: powershell-dns-txt-command-exec
      - id: micro-behaviors/communications/dns/txt::nslookup-txt-explicit-resolver

  - id: powershell-reconstructed-host-dns-txt-exec
    for: [html]
    desc: PowerShell reconstructs DNS tasking hostname
    conf: 0.98
    near_bytes: 1024
    all:
      - id: powershell-dns-txt-command-exec
      - id: micro-behaviors/data/string/concat::powershell-string-join

  - id: powershell-dns-txt-double-eval
    for: [html]
    desc: PowerShell twice evaluates DNS TXT response
    conf: 0.99
    near_bytes: 1024
    all:
      - id: powershell-dns-txt-command-exec
      - id: micro-behaviors/process/interpreter/eval/direct::embedded-powershell-chained-iex

  # Some droppers inline nslookup directly inside IEX instead of assigning
  # its output first. A second and third IEX in the pipeline execute the TXT
  # answer while evading the variable-capture form above.
  - id: powershell-inline-nslookup-txt-double-eval
    desc: PowerShell double-evaluates DNS TXT tasking
    conf: 0.99
    near_bytes: 512
    all:
      - id: micro-behaviors/communications/dns/txt::powershell-inline-nslookup-txt-iex
      - id: micro-behaviors/communications/dns/txt::nslookup-txt-explicit-resolver
      - id: micro-behaviors/communications/dns/txt::powershell-nslookup-txt-double-iex
