# JVM DNS C2 family signature: a method literally named
# commandAndControlViaDns shows intent; the supporting legs are neutral
# capabilities referenced from their technique homes — DNS resolution and
# tunnel vocabulary.
defaults:
  platforms: [ios, unix, windows]
  for: [java, class]
  attack: T1071.004

traits:
  - id: java-dns-c2-method
    desc: Java DNS C2 method
    crit: suspicious
    conf: 0.92
    for: [java, kotlin, class]
    if:
      type: text
      substr: commandAndControlViaDns

composite_rules:
  - id: java-ios-dns-c2
    desc: Java iOS DNS C2
    crit: hostile
    conf: 0.97
    for: [java, kotlin]
    all:
      - id: java-dns-c2-method
      - id: micro-behaviors/communications/dns/lookup/resolver::jvm-inetaddress-getallbyname-source
      - id: micro-behaviors/communications/proxy/tunnel::java-tunnel-term

  - id: jvm-ios-dns-c2
    for: [class]
    desc: JVM iOS DNS C2
    crit: hostile
    conf: 0.97
    all:
      - id: java-dns-c2-method
      - id: micro-behaviors/communications/dns/lookup/resolver::jvm-inetaddress-getallbyname-bytecode
      - id: micro-behaviors/communications/proxy/tunnel::java-tunnel-term
