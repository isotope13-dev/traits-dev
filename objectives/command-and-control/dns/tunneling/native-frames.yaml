defaults:
  platforms: [windows]
  for: [pe, dll]
composite_rules:
  - id: numbered-hex-frame-tasking
    desc: DNS hex-frame templates with task-control dispatcher
    crit: hostile
    conf: 0.99
    attack: T1071.004
    # This is a static implementation fingerprint, not observed DNS traffic:
    # numbered multi-label data frames, an F0 task word and fetch-mode flag,
    # and the native DNS library. No domain or campaign-specific token gates it.
    all:
      - id: micro-behaviors/data/format/string::numbered-single-hex-label-template
      - id: micro-behaviors/data/format/string::numbered-four-hex-label-template
      - id: micro-behaviors/data/control-flow/branch::x86-f0-control-word-flags
      - id: micro-behaviors/fs/path/library::dnsapi-dll
