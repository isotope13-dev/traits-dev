# Built-in Guest promoted to a remote-desktop administrator.
#
# Gh0st-lineage service DLLs (Trojan-PSW.Win32.Bjlog, sha 2271192a) carry one
# XOR-hidden shell line: `net1 start TermService & net1 user guest /add &
# net1 user guest %s /active:yes & net1 localgroup administrators guest /add`.
# The operator supplies the password, Terminal Services is started, and the
# shared Guest identity becomes an administrator reachable over RDP.
#
# Admission: enabling Guest and adding it to Administrators are each a weakened
# authentication boundary; together with RDP enablement they open an
# administrator logon nobody owns. Administration and hardening tooling disables
# Guest (/active:no) and never grants it Administrators. The legs are command
# text, so the rule survives a different password, encoding, or carrier.
defaults:
  platforms: [windows]
  attack: T1098,T1021.001

composite_rules:
  # net.exe / net1.exe command lines, as shell text or hidden inside a binary.
  - id: guest-admin-remote-desktop-backdoor
    desc: Enables Guest as RDP administrator
    crit: hostile
    conf: 0.96
    for: [pe, dll, batch]
    all:
      - id: micro-behaviors/os/user/modify::net-guest-account-activate
      - id: micro-behaviors/os/group/membership::net-localgroup-administrators-add-guest
    any:
      - id: micro-behaviors/os/service/remote::net-start-termservice
      - id: micro-behaviors/os/service/remote::rdp-service-autostart
      - id: micro-behaviors/os/service/remote::rdp-registry-allow-connections
      - id: micro-behaviors/os/registry/value-name::rdp-deny-connections-value
      - id: micro-behaviors/os/registry/value-name::rdp-concurrent-sessions-value
      - id: micro-behaviors/os/registry/value-name::rdp-multiple-sessions-value
      - id: micro-behaviors/os/firewall/netsh::rdp-firewall-enable
      - id: micro-behaviors/os/service/remote::batch-enable-rdp-registry
    needs: 1

  # The LocalAccounts cmdlet spelling of the same three steps.
  - id: powershell-guest-admin-remote-desktop-backdoor
    desc: PowerShell enables Guest as RDP administrator
    crit: hostile
    conf: 0.95
    for: [powershell]
    all:
      - id: micro-behaviors/os/user/modify::powershell-guest-account-enable
      - id: micro-behaviors/os/group/membership::powershell-guest-administrators-add
    any:
      - id: micro-behaviors/os/service/remote::net-start-termservice
      - id: micro-behaviors/os/service/remote::rdp-service-autostart
      - id: micro-behaviors/os/service/remote::rdp-registry-allow-connections
      - id: micro-behaviors/os/registry/value-name::rdp-deny-connections-value
      - id: micro-behaviors/os/registry/value-name::rdp-concurrent-sessions-value
      - id: micro-behaviors/os/registry/value-name::rdp-multiple-sessions-value
      - id: micro-behaviors/os/firewall/netsh::rdp-firewall-enable
      - id: micro-behaviors/os/service/remote::powershell-rdp-service-autostart
    needs: 1
