defaults:
  platforms: [unix, windows]
  for: [csharp, pe]

composite_rules:
  - id: dotnet-account-session-startup-clues
    desc: .NET account, session and startup text clues
    crit: suspicious
    conf: 0.98
    needs: 3
    any:
      - id: micro-behaviors/communications/http/services/fortios::fortios-admin-api-dotnet
      - id: micro-behaviors/communications/http/services/fortios::fortios-admin-api-dotnet-pe
      - id: micro-behaviors/os/security/auth/rbac::dotnet-super-admin-role-text
      - id: micro-behaviors/os/security/auth/rbac::dotnet-pe-super-admin-role-text
      - id: well-known/app/network/fortios::dotnet-fortitek-session-text
      - id: micro-behaviors/communications/http/cookie-store::dotnet-phpsessid-text
      - id: objectives/persistence/system/init/script::dotnet-fortios-label-or-rc-local-text
