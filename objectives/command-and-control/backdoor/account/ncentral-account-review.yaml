defaults:
  platforms:
  - windows
  - unix
  - appliance
  for:
  - scripts
  - source
  attack: T1136.001,T1098
composite_rules:
- id: ncentral-admin-invalid-email-clues
  desc: N-central admin role and invalid email clues
  crit: suspicious
  conf: 0.98
  all:
  - id: well-known/dual-use/remote-admin/n-central::get-pier-details-request
  - id: metadata/lang/source/literal/string/shape::email-appended-invalid-suffix
  - id: metadata/lang/source/syntax/identity-field::administrator-role-field
  any:
  - id: micro-behaviors/communications/http/request/client::fetch-post-pattern
  - id: micro-behaviors/communications/http/curl/body::curl-post-flag
  - id: micro-behaviors/communications/http/post
  needs: 1
