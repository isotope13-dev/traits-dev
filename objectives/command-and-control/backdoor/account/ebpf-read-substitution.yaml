defaults:
  for: [c]
  platforms: [linux]

traits:
  - id: ebpf-passwd-shadow-read-branch
    desc: Branch selects passwd or shadow file data
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: 'file_type\s*==\s*PASSWD\s*\|\|\s*file_type\s*==\s*SHADOW'
  - id: ebpf-backdoor-trigger-lookup
    desc: Looks up a BPF map named backdoor_trigger
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: 'bpf_map_lookup_elem\s*\(\s*&backdoor_trigger\b'
  - id: source-copy-backdoor-password-hash
    desc: Copies backdoor password hash into buffer
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: 'memcpy\s*\([^,;]{1,80},\s*backdoor_hashed_passwd\b'

composite_rules:
  - id: ebpf-account-read-backdoor
    desc: eBPF read hook, account backdoor trigger and user-memory write
    crit: hostile
    conf: 0.98
    attack: T1556
    all:
      - id: ebpf-passwd-shadow-read-branch
      - id: ebpf-backdoor-trigger-lookup
      - id: micro-behaviors/os/bpf/program/tracing::syscall-read-exit-tracepoint-section
      - id: micro-behaviors/os/bpf/program/tracing::bpf-probe-write-user
  - id: ebpf-account-backdoor-controller
    desc: Account backdoor hash replacement and eBPF map update
    crit: hostile
    conf: 0.97
    attack: T1556
    all:
      - id: source-copy-backdoor-password-hash
      - id: micro-behaviors/fs/path/account-db::unix-account-database-path-reference
      - id: micro-behaviors/os/bpf/program/maps::bpf-map-update
      - id: micro-behaviors/os/bpf/program/loader::bpf-skeleton
