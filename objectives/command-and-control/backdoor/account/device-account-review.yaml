    desc: Superuser creation alongside PHP webshell
    crit: hostile
    conf: 0.99
    platforms: [appliance, unix]
    for: [perl, shell, python]
    all:
      - id: well-known/app/network/netscaler::netscaler-bind-superuser
      - id: well-known/app/network/netscaler::netscaler-add-system-user
