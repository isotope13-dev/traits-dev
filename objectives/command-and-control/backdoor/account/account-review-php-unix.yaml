defaults:
  platforms: [unix]
  for: [php]

traits:
  - id: php-passwd-backdoor-id-variable-text
    desc: PHP passwd backdoor ID-variable text
    crit: suspicious
    conf: 0.94
    if:
      type: text
      regex: ':x:\{?\$BACKDOOR_UID\}?:\{?\$BACKDOOR_GID\}?'

composite_rules:
  - id: php-backdoor-account-field-clues
    desc: PHP backdoor account field clues
    crit: suspicious
    conf: 0.98
    all:
      - id: metadata/lang/source/naming/account::php-backdoor-user-identifier
      - id: metadata/lang/source/naming/account::php-shadow-entry-identifier
    any:
      - id: objectives/command-and-control/backdoor/account::php-passwd-backdoor-id-variable-text
      - id: micro-behaviors/fs/config/sudo::nopasswd-all-directive
