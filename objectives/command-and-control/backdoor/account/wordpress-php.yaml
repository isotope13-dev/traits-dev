defaults:
  platforms: [unix, windows]
  for: [php]
  attack: T1136.001,T1564
  mbc: B0030

composite_rules:
  - id: wordpress-dashboard-excluded-user
    desc: Creates user alongside dashboard login exclusion
    crit: suspicious
    conf: 0.95
    near_bytes: 2000
    all:
      - id: micro-behaviors/os/user/create::wordpress-create-user
      - id: micro-behaviors/os/application/hook/registration::wordpress-admin-user-list-filter
      - id: micro-behaviors/data/db/query::wp-user-query-exclusion

  - id: wordpress-dashboard-excluded-administrator
    desc: Creates admin alongside dashboard login hiding
    crit: suspicious
    conf: 0.98
    near_bytes: 2000
    all:
      - id: micro-behaviors/os/user/create::wordpress-create-user-admin-role
      - id: objectives/command-and-control/backdoor/account::wordpress-dashboard-excluded-user

  - id: wordpress-hidden-administrator-persistence
    desc: Creates a WordPress administrator hidden from UI and REST listings
    crit: hostile
    conf: 0.99
    near_bytes: 6000
    all:
      - id: micro-behaviors/os/user/create::wordpress-create-user-admin-role
      - id: objectives/command-and-control/backdoor/webshell/hide::wp-user-hiding
      - id: objectives/evasion/file-hiding/plugin::wordpress-rest-user-hiding

  # The original campaign grants editor accounts administrative capabilities;
  # the working variant creates an administrator directly. Require account
  # creation and session injection as well as the request comparison, so normal
  # user-registration handlers do not satisfy this backdoor bootstrap.
  # This is co-occurrence, not a proven control/data-flow relationship.
  - id: wordpress-token-privileged-user-bootstrap
    desc: Request token check with privileged user creation
    crit: hostile
    conf: 0.99
    attack: T1136.001,T1098,T1505.003
    near_bytes: 4000
    all:
      - id: micro-behaviors/communications/http/request/superglobal::php-request-hash-equals-comparison
      - id: micro-behaviors/os/user/create::wordpress-create-user
      - id: micro-behaviors/os/security/auth/session::wordpress-auth-session-setup
    any:
      - id: micro-behaviors/os/user/modify::wordpress-privileged-cap-grant
      - id: micro-behaviors/os/user/modify::wordpress-admin-role-assignment
    unless:
      - id: well-known/lib/web/server/wordpress-core::wordpress-core-package-doc
      - id: well-known/lib/web/server/wordpress-core::wordpress-core-include-bootstrap
      - id: well-known/lib/web/server/wordpress-core::wordpress-phpunit-test-case

  # Account hand-off backdoor: plant a WordPress administrator, then post the
  # login URL, username and password of that account off-host. The operator who
  # receives the record can sign in regardless of what the site owner knows.
  # The any: leg ties the pair to a delivery context -- a plugin hook that fires
  # it unattended (init, admin_init, activation), or a raw-IP collection endpoint -- so an operator-driven
  # provisioning tool that emails its own admin credentials is not convicted by
  # creation plus a login record alone. Proximity, not proven data flow.
  - id: wordpress-sql-admin-credential-handoff
    desc: Inserts WordPress admin, posts its login remotely
    crit: hostile
    conf: 0.97
    attack: T1136.001,T1098,T1041
    near_bytes: 6000
    all:
      - id: micro-behaviors/os/user/create::sql-wordpress-admin-create
      - id: micro-behaviors/communications/http/request/body/credential::php-login-record-post
    any:
      - id: micro-behaviors/os/application/hook/registration::wordpress-admin-init-hook
      - id: micro-behaviors/os/application/hook/registration::wordpress-init-hook
      - id: micro-behaviors/os/application/hook/registration::wordpress-activation-hook
      - id: micro-behaviors/communications/ip/literal::external-ipv4-url-script
    unless:
      - id: well-known/lib/web/server/wordpress-core::wordpress-core-package-doc
      - id: well-known/lib/web/server/wordpress-core::wordpress-core-include-bootstrap
      - id: well-known/lib/web/server/wordpress-core::wordpress-phpunit-test-case

  - id: wordpress-api-admin-credential-handoff
    desc: Creates WordPress admin, posts its login remotely
    crit: hostile
    conf: 0.96
    attack: T1136.001,T1098,T1041
    near_bytes: 6000
    all:
      - id: micro-behaviors/os/user/create::wordpress-create-user-admin-role
      - id: micro-behaviors/communications/http/request/body/credential::php-login-record-post
    any:
      - id: micro-behaviors/os/application/hook/registration::wordpress-admin-init-hook
      - id: micro-behaviors/os/application/hook/registration::wordpress-init-hook
      - id: micro-behaviors/os/application/hook/registration::wordpress-activation-hook
      - id: micro-behaviors/communications/ip/literal::external-ipv4-url-script
    unless:
      - id: well-known/lib/web/server/wordpress-core::wordpress-core-package-doc
      - id: well-known/lib/web/server/wordpress-core::wordpress-core-include-bootstrap
      - id: well-known/lib/web/server/wordpress-core::wordpress-phpunit-test-case
