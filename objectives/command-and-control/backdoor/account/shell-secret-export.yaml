defaults:
  platforms: [unix]
  for: [shell]

composite_rules:
  - id: passworded-root-account-with-secret-export
    desc: Passworded root login with credential export
    crit: hostile
    conf: 0.99
    attack: T1136.001
    all:
      - id: micro-behaviors/os/user/create::useradd-crypt-password-arguments
      - id: objectives/exfiltration/stealer/credential/file::root-account-auth-config-export
