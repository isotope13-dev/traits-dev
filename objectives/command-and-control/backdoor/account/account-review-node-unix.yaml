defaults:
  platforms: [unix]
  for: [javascript, typescript]

traits:
  - id: node-uid-zero-backdoor-entry-text
    desc: Node UID-zero backdoor entry text
    crit: suspicious
    conf: 0.92
    if:
      type: text
      substr: backdoor:x:0:0:Backdoor User

  - id: node-shadow-modified-status-text
    desc: Node shadow-modified status text
    crit: suspicious
    conf: 0.92
    if:
      type: text
      substr: shadow-modified:true

composite_rules:
  - id: node-uid-zero-shadow-status-clues
    desc: Node UID-zero entry and shadow status clues
    crit: suspicious
    conf: 0.98
    all:
      - id: objectives/command-and-control/backdoor/account::node-uid-zero-backdoor-entry-text
      - id: objectives/command-and-control/backdoor/account::node-shadow-modified-status-text
