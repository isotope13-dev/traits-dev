# Account creation and password setting are administrative operations. The
# pairing is suspicious because unattended scripts also use it for access
# accounts; named-tool or privilege context belongs in a consumer.
defaults:
  platforms: [unix]
  for: [shell]
  attack: T1136.001

composite_rules:
  - id: shell-useradd-chpasswd-account
    desc: Shell creates a Unix account and sets its password
    crit: suspicious
    conf: 0.8
    near_lines: 10
    all:
      - id: micro-behaviors/os/user/create::useradd-command
      - id: micro-behaviors/os/user/modify::chpasswd-command
    unless:
      - id: metadata/package/testing/harness/unit::go-test-source-file
      - id: metadata/package/testing/harness/unit::go-integration-test-file
    # Container and CI test helpers create throwaway accounts to exercise
    # privilege code; keep them reportable as notable, not suspicious.
    downgrade:
      any:
        - id: metadata/path/directory::test-directory-component
        - id: metadata/package/testing/harness/fixture::ssh-test-fixture-server
