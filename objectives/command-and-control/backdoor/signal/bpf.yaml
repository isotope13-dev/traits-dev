# BPF/eBPF Backdoor Patterns
# Detects BPF-based backdoor techniques including BPFDoor-style packet filter backdoors
# ATT&CK: T1205 (Traffic Signaling)
defaults:
  platforms: [unix]
  for: [c, cpp, elf]

traits:
  - id: icmp-module-obj
    desc: Build includes ICMP trigger module
    crit: component
    conf: 0.98
    for: [c, cpp, shell, makefile]
    if:
      type: text
      substr: modules/icmp.o
  - id: bpf-hook-module-obj
    desc: Build includes BPF hook module
    crit: component
    conf: 0.98
    for: [c, cpp, shell, makefile]
    if:
      type: text
      substr: modules/bpf_hook.o
  - id: cbpf-http-9999-magic
    desc: BPF HTTP 9999 magic
    crit: component
    conf: 0.82
    if:
      type: text
      substr: "0x39393939"
  - id: cbpf-udp-icmp-7255-magic
    desc: BPF UDP ICMP magic
    crit: component
    conf: 0.78
    if:
      type: text
      substr: "0x00007255"
  - id: cbpf-icmp-5572-magic
    desc: BPF ICMP relay magic
    crit: component
    conf: 0.76
    if:
      type: text
      substr: "0x5572"
  - id: cbpf-tcp-5293-magic
    desc: BPF TCP magic constant
    crit: component
    conf: 0.78
    if:
      type: text
      substr: "0x00005293"

composite_rules:
  # Raw socket helper
  - id: raw-socket
    desc: Raw packet socket
    crit: suspicious
    conf: 0.6
    any:
      - id: micro-behaviors/os/bpf/program/network::af-packet
      - id: micro-behaviors/communications/socket/raw::sock-raw-constant
      - id: micro-behaviors/communications/socket/raw::raw-socket-creation-regex
    unless:
      - id: well-known/tool/sysadmin/alpine-packages::alpine-datadog-agent
      - id: metadata/lang/compiler/systems::go-binary
      - id: well-known/lib/runtime/cpython::cpython-interpreter-binary
  # Magic/knock patterns helper
  - id: magic-knock-patterns
    desc: "Magic packet/knock sequences in BPF"
    crit: suspicious
    conf: 0.7
    any:
      - id: micro-behaviors/os/bpf/program/icmp::icmp-sequence-1234
      - id: micro-behaviors/os/bpf/program/icmp::pid-derived-icmp-bpf-filter
      - id: objectives/command-and-control/channel/covert::hip-routing-bpf-channel
      - id: objectives/command-and-control/channel/covert::icmp-seq-1234-channel
      - id: objectives/command-and-control/channel/covert::rc4-icmp-tunnel
    unless:
      - id: well-known/tool/sysadmin/alpine-packages::alpine-datadog-agent
      - id: metadata/lang/compiler/systems::go-binary
  # BPF backdoor (migrated from YARA)
  - id: backdoor
    desc: BPF packet filtering for backdoor
    crit: suspicious
    conf: 0.8
    attack: "T1205"
    all:
      - id: micro-behaviors/communications/socket/options::bpf-filter-attachment
      - id: raw-socket
      - id: magic-knock-patterns
    unless:
      - id: well-known/tool/sysadmin/alpine-packages::alpine-datadog-agent
      - id: metadata/lang/compiler/systems::go-binary
  - id: bpfdoor-modern-packet-filter
    desc: Magic BPF packet filter
    crit: suspicious
    conf: 0.9
    all:
      - id: micro-behaviors/communications/socket/options::bpf-filter-attachment
    needs: 2
    any:
      - id: cbpf-http-9999-magic
      - id: cbpf-icmp-5572-magic
      - id: cbpf-udp-icmp-7255-magic
      - id: cbpf-tcp-5293-magic
      - id: micro-behaviors/os/bpf/program/network::af-packet-dgram-filter-source
  # Shell activation helper
  # NOTE: dup2 + execve is extremely common in legitimate programs.
  # Only suspicious in context of /bin/sh execution with fd redirection.
  - id: shell-activation
    desc: Shell execution components
    crit: notable
    conf: 0.6
    # Removed 'for: [elf, c]' as it matches file default
    all:
      - id: micro-behaviors/process/interpreter/shell::bin-sh
    any:
      - id: micro-behaviors/process/fd/dup::dup2
      - id: micro-behaviors/process/create/direct::execve-import
  # BPFDoor-style helper
  # Requires both shell activation AND protocol trigger to be suspicious
  - id: bpfdoor-activation
    desc: BPFDoor activation components
    crit: suspicious
    conf: 0.85
    # Removed 'for: [elf, c]' as it matches file default
    all:
      - id: shell-activation
    any:
      - id: micro-behaviors/communications/ip/services::ipproto-icmp
      - id: micro-behaviors/communications/socket/udp::ipproto-udp
  # BPFDoor-style backdoor (migrated from YARA)
  - id: bpfdoor-style
    desc: BPFDoor-style packet filter backdoor
    crit: suspicious
    conf: 0.9
    attack: "T1205"
    # Removed 'for: [elf, c]' as it matches file default
    all:
      - id: bpfdoor-activation
      - id: micro-behaviors/communications/socket/options::bpf-filter-attachment
    needs: 2
    any:
      - id: micro-behaviors/os/bpf/program/network::af-packet-dgram-filter-source
      - id: micro-behaviors/os/bpf/program/network::knock-string
      - id: micro-behaviors/os/bpf/program/loader/
      - id: micro-behaviors/os/bpf/network-infra::pcap-api-symbol
  - id: raw-bpf-triggered-shell
    desc: Raw BPF packet-triggered shell
    crit: hostile
    conf: 0.97
    attack: "T1205"
    for: [c, cpp]
    all:
      - id: micro-behaviors/communications/socket/options::options-filter
      - id: micro-behaviors/communications/socket/receive::recvfrom-symbol
      - id: micro-behaviors/communications/socket/raw::raw-socket-creation-regex
      - id: micro-behaviors/process/create/shell/native::c-shell-execution-path
      - id: micro-behaviors/data/string/search::native-buffer-string-compare
      - id: micro-behaviors/communications/ip/services::native-ip-protocol-constants

  - id: binary-bpf-triggered-shell
    desc: Native binary BPF packet shell
    crit: hostile
    conf: 0.97
    attack: "T1205,T1059.004"
    mbc: "B0030"
    for: [elf]
    all:
      - id: micro-behaviors/communications/socket/options::options-set
      - id: micro-behaviors/communications/socket/options::options-filter-x64
      - id: micro-behaviors/communications/socket/receive::recvfrom-symbol
      - id: micro-behaviors/process/create/shell/spawn::bin-sh-binary-text
      - id: micro-behaviors/process/fd/dup::dup2
      - id: micro-behaviors/process/create/execv::c-exec-variants

  - id: packet-triggered-firewall-shell
    desc: Packet-triggered firewall redirect shell
    crit: hostile
    conf: 0.98
    attack: "T1205,T1059.004,T1562.004"
    mbc: "B0030"
    for: [c, cpp]
    all:
      - id: micro-behaviors/communications/socket/options::options-filter
      - id: micro-behaviors/communications/socket/raw::raw-socket-creation-regex
      - id: micro-behaviors/communications/socket/receive::recvfrom-symbol
      - id: micro-behaviors/process/create/shell/native::c-shell-execution-path
      - id: micro-behaviors/os/firewall/iptables::native-iptables-prerouting-redirect
      - id: micro-behaviors/communications/ip/services::native-ip-protocol-constants

  - id: packet-filter-daemon-masquerade
    desc: Packet backdoor masquerades as system daemon
    crit: hostile
    conf: 0.98
    attack: "T1205,T1036.004"
    mbc: "B0030,F0004"
    for: [c, cpp]
    all:
      - id: micro-behaviors/communications/socket/options::options-filter
      - id: micro-behaviors/communications/socket/raw::raw-socket-creation-regex
      - id: micro-behaviors/communications/socket/receive::recvfrom-symbol
      - id: micro-behaviors/process/create/shell/native::c-shell-execution-path
    any:
      - id: objectives/evasion/masquerade/process/env::native-common-daemon-name
      - id: objectives/evasion/masquerade/process/env::native-service-daemon-name
      - id: objectives/evasion/masquerade/process/env::native-system-daemon-name
  - id: icmp-bpf-trigger-build
    desc: ICMP BPF trigger module build
    crit: suspicious
    conf: 0.96
    for: [makefile]
    all:
      - id: micro-behaviors/os/kernel/module::linux-kbuild-module-build
      - id: icmp-module-obj
      - id: bpf-hook-module-obj
    any:
      - id: objectives/evasion/kernel-hide/lkm/rootkit::hiding-tcp-module-obj
      - id: objectives/evasion/kernel-hide/lkm/rootkit::hide-module-obj
