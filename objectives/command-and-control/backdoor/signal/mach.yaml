# Mach exception-port hijacking as a control channel.
#
# Registering task *and* thread exception ports plus reading/writing thread
# state is what every in-process crash reporter (Breakpad, Crashpad,
# PLCrashReporter) and every JIT that traps EXC_BAD_ACCESS does, so that
# combination alone is a neutral crash-handler capability and lives at
# micro-behaviors/os/exception/register::task-and-thread-exception-ports.
#
# What makes it a backdoor is the target: an in-process handler installs on
# mach_task_self(), while a hijack has to steal a *foreign* task port first
# (task_for_pid / processor_set_tasks) and then drive the victim's threads
# through thread_set_state.  That foreign-task leg is the discriminator, and
# it replaces the per-vendor allowlist this rule used to carry — Firefox,
# Chrome, Electron and Zed all ship the handler pair and none of them can
# acquire another task's port.
defaults:
  platforms: [macos, ios]
  for: [macho, c]
  attack: T1622

composite_rules:
- id: mach-exception-hijack
  desc: Hijacks another process Mach exception ports
  crit: hostile
  conf: 0.98
  all:
  - id: micro-behaviors/process/attach/mach::task-for-pid
  - id: micro-behaviors/os/exception/register::task-and-thread-exception-ports
  - id: micro-behaviors/os/kernel/routines::thread-get-state
  - id: micro-behaviors/os/kernel/routines::thread-set-state
  unless:
  - id: metadata/signed/platform::apple
  - id: well-known/tool/development/darling/
