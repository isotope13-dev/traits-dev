defaults:
  platforms: [windows, unix]
  for: [rust]
  attack: T1055,T1059,T1082

traits:
  - id: rust-library-dll-inject-call
    desc: Rust library delegates DLL injection
    crit: notable
    if:
      type: text
      regex: '\bdll_inject_impl::dll_inject\s*\('
  - id: rust-library-dll-reflect-call
    desc: Rust library delegates reflective DLL loading
    crit: notable
    if:
      type: text
      regex: '\bdll_reflect_impl::dll_reflect\s*\('
  - id: rust-library-shell-call
    desc: Rust library delegates shell command execution
    crit: notable
    if:
      type: text
      regex: '\bshell_impl::shell\s*\('
  - id: rust-library-host-env-call
    desc: Rust library delegates environment retrieval
    crit: component
    if:
      type: text
      regex: '\bget_env_impl::get_env\s*\('

composite_rules:
  - id: rust-injection-shell-discovery-library
    desc: Rust agent exposes injection shell and discovery
    crit: hostile
    conf: 0.97
    all:
      - id: rust-library-dll-inject-call
      - id: rust-library-dll-reflect-call
      - id: rust-library-shell-call
      - id: rust-library-host-env-call
