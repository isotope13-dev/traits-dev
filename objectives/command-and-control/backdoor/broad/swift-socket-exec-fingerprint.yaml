defaults:
  platforms: [unix]
  for: [swift]
  attack: T1059,T1071

traits:
  - id: swift-socket-fingerprint-command-dispatch
    desc: Swift agent reports host and executes tasks
    crit: hostile
    conf: 0.98
    if:
      type: yara
      source: |
        rule swift_socket_fingerprint_command_dispatch {
          strings:
            $send = /\b(Glibc|Darwin)\.send\s*\(/
            $recv = /\b(Glibc|Darwin)\.recv\s*\(/
            $uname = /\b(Glibc\.)?uname\s*\(/
            $host = "uts.nodename"
            $command = "EXEC:"
            $result = "RESULT:"
            $shell = "/bin/sh"
            $run = /\b(Process\(\)|Process\s*\(\s*\))/
          condition:
            all of them
        }
