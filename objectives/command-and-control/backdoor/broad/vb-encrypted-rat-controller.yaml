defaults:
  platforms: [windows]
  for: [vbs]
  attack: T1071.001,T1059

traits:
  - id: vb-encrypted-remote-collection-controller
    desc: Encrypted remote collection and execution
    crit: hostile
    conf: 0.99
    if:
      type: yara
      source: |
        rule vb_encrypted_remote_collection_controller {
          strings:
            $listener = "TcpListener" nocase
            $decrypt = "AES_Decrypt" nocase
            $keys = "Msg.StartsWith(\"KeyLogs\")" nocase
            $passwords = "Msg.StartsWith(\"Passwords\")" nocase
            $execute = "ExecuteFromLink" nocase
            $send = "SendToSelected" nocase
          condition:
            all of them
        }
