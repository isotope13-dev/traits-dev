defaults:
  platforms: [unix, windows, network-appliance]
  for: [lua]

traits:

  - id: lua-python-revshell-payload
    desc: Lua embeds Python revshell
    crit: suspicious
    conf: 0.92
    if:
      type: text
      regex: 'socket\.AF_INET.{0,160}os\.dup2.{0,160}/bin/sh'

  - id: lua-msfvenom-generator
    desc: Lua msfvenom generator
    crit: suspicious
    conf: 0.9
    if:
      type: text
      word: msfvenom





  - id: lua-certutil-rundll32-chain
    desc: Lua certutil rundll32 chain
    crit: suspicious
    conf: 0.96
    if:
      type: text
      regex: 'certutil.{0,260}rundll32'

  - id: lua-byte-builder
    desc: Lua byte-string construction
    crit: component
    conf: 0.88
    if:
      type: text
      regex: 'string\.char|table\.concat|\\x[0-9a-f]{2}'
      case_insensitive: true

  - id: lua-posix-fork-call
    desc: Lua posix fork call
    crit: notable
    conf: 0.9
    if:
      type: symbol
      exact: posix.fork

  - id: lua-infinite-loop-text
    desc: Lua infinite loop
    crit: component
    conf: 0.8
    if:
      type: text
      regex: 'while\s+true\s+do'

  - id: lua-activexobject-text
    desc: Lua emits ActiveXObject script
    crit: notable
    conf: 0.84
    if:
      type: text
      word: ActiveXObject

  - id: lua-mshta-javascript-text
    desc: Lua emits mshta JavaScript
    crit: suspicious
    conf: 0.9
    if:
      type: text
      substr: 'mshta javascript:'

  - id: lua-response-eval-text
    desc: Lua emits response eval script
    crit: suspicious
    conf: 0.88
    if:
      type: text
      substr: eval(s.ResponseText)

  - id: lua-wmic-xsl-scriptlet
    desc: Lua emits WMIC XSL scriptlet
    crit: suspicious
    conf: 0.9
    if:
      type: text
      substr: shell.xsl

  - id: lua-lateral-method-table
    desc: Lua lateral movement method table
    crit: suspicious
    conf: 0.9
    if:
      type: text
      substr: 'psexec = true, smbexec = true, wmi = true, winrm = true, ssh = true, nc = true'

  - id: lua-impacket-wmiexec
    desc: Lua emits wmiexec command
    crit: notable
    conf: 0.84
    if:
      type: text
      word: wmiexec.py

  - id: lua-impacket-winexec
    desc: Lua emits winexec command
    crit: notable
    conf: 0.84
    if:
      type: text
      word: winexec.py

  - id: lua-kerberos-spn-query
    desc: Lua Kerberos SPN query
    crit: suspicious
    conf: 0.9
    if:
      type: text
      word: servicePrincipalName

  - id: lua-getuserspns-tool
    desc: Lua GetUserSPNs tool command
    crit: suspicious
    conf: 0.92
    if:
      type: text
      word: GetUserSPNs.py

  - id: lua-uci-export-command
    desc: Lua uci export command
    crit: notable
    conf: 0.84
    if:
      type: text
      substr: uci export

  - id: lua-appliance-txn-api
    desc: Lua appliance HTTP API
    crit: notable
    conf: 0.84
    if:
      type: text
      regex: 'txn\.get_http_|txn\.set_http_|http\.call\('

  - id: lua-selenium-name
    desc: Lua selenium name
    crit: notable
    conf: 0.8
    if:
      type: text
      word: selenium

  - id: lua-phantomjs-name
    desc: Lua phantomjs name
    crit: notable
    conf: 0.8
    if:
      type: text
      word: phantomjs

  - id: lua-puppeteer-name
    desc: Lua puppeteer name
    crit: notable
    conf: 0.8
    if:
      type: text
      word: puppeteer

  - id: lua-playwright-name
    desc: Lua playwright name
    crit: notable
    conf: 0.8
    if:
      type: text
      word: playwright

  - id: lua-webdriver-name
    desc: Lua webdriver name
    crit: notable
    conf: 0.8
    if:
      type: text
      word: webdriver

composite_rules:
  - id: lua-shellcode-generator
    desc: Lua manipulates shellcode bytes
    crit: suspicious
    conf: 0.88
    near_bytes: 320
    all:
      - id: metadata/lang/natural/vocabulary/security::lua-shellcode-term
      - id: lua-byte-builder

  - id: lua-callback-shellcode-builder
    desc: Lua builds shellcode with callback parameters
    crit: suspicious
    conf: 0.96
    all:
      - id: lua-shellcode-generator
      - id: micro-behaviors/communications/ip/config::lua-lhost-lport-params


  - id: lua-sensitive-files
    desc: Lua sensitive file paths
    crit: notable
    conf: 0.88
    any:
      - id: micro-behaviors/fs/path/config/accounts::etc-passwd
      - id: micro-behaviors/os/privilege/paths::etc-shadow
      - id: micro-behaviors/fs/path/config/ssh::lua-etc-ssh-path
      - id: micro-behaviors/fs/path/config/ssh::ssh-dir
      - id: micro-behaviors/fs/path/config/ssh::lua-id-rsa-name
      - id: micro-behaviors/fs/path/config/ssh::lua-authorized-keys-name
      - id: micro-behaviors/os/service/remote::dropbear-ref
      - id: lua-uci-export-command

  # Notable, not suspicious: naming browser automation tools (Selenium, PhantomJS,
  # WebDriver) is common in anti-bot / DDoS mitigation scripts and web testing.
  # The backdoor claim belongs in lua-appliance-recon-exfil where it is paired
  # with a C2 host and transaction API.
  - id: lua-browser-automation-list
    desc: Lua browser automation list
    crit: notable
    conf: 0.88
    all:
      - id: lua-selenium-name
    any:
      - id: lua-phantomjs-name
      - id: metadata/lang/source/naming/flag::lua-headless-mode-name
      - id: lua-puppeteer-name
      - id: lua-playwright-name
      - id: lua-webdriver-name

  - id: lua-command-plugin-revshell
    desc: Lua command plugin revshell
    crit: hostile
    conf: 0.97
    all:
      - id: "micro-behaviors/data/control-flow/registration::lua-register-command-call"
    any:
      - id: lua-python-revshell-payload
      - id: lua-msfvenom-generator
      - id: lua-certutil-rundll32-chain
      - id: lua-callback-shellcode-builder

  - id: lua-lolbas-payload-plugin
    desc: Lua LOLBAS payload plugin
    crit: hostile
    conf: 0.96
    all:
      - id: "micro-behaviors/data/control-flow/registration::lua-register-command-call"
      - id: micro-behaviors/fs/path/reference::lua-windows-command-tool-reference
    any:
      - id: lua-shellcode-generator
      - id: lua-msfvenom-generator
      - id: lua-mshta-javascript-text
      - id: lua-wmic-xsl-scriptlet
    unless:
      - id: objectives/execution/staging/transfer::lua-bitsadmin-payload-command-generator

  - id: lua-activex-lolbas-plugin
    desc: Lua ActiveX LOLBAS plugin
    crit: hostile
    conf: 0.96
    all:
      - id: "micro-behaviors/data/control-flow/registration::lua-register-command-call"
      - id: micro-behaviors/fs/path/reference::lua-windows-command-tool-reference
      - id: lua-activexobject-text
    any:
      - id: micro-behaviors/os/com/automation::wscript-shell-literal
      - id: lua-response-eval-text
      - id: lua-mshta-javascript-text

  - id: lua-fork-bomb
    desc: Lua fork bomb
    crit: suspicious
    conf: 0.98
    all:
      - id: lua-posix-fork-call
      - id: lua-infinite-loop-text

  - id: lua-appliance-recon-exfil
    desc: Lua appliance recon exfil
    crit: hostile
    conf: 0.95
    all:
      - id: lua-appliance-txn-api
      - id: metadata/lang/source/naming/security::lua-control-endpoint-name
    any:
      - id: lua-browser-automation-list
      - id: micro-behaviors/communications/url/resource-path/collection::lua-control-route-reference
      - id: metadata/lang/source/naming/security::lua-safe-gate-marker

  - id: lua-lateral-command-plugin
    desc: Lua lateral movement command plugin
    crit: hostile
    conf: 0.96
    all:
      - id: "micro-behaviors/data/control-flow/registration::lua-register-command-call"
      - id: lua-lateral-method-table
    any:
      - id: lua-impacket-wmiexec
      - id: lua-impacket-winexec
      - id: micro-behaviors/communications/ssh/client::sshpass-tool-reference

  - id: lua-kerberos-harvest-plugin
    desc: Lua Kerberos ticket harvest plugin
    crit: hostile
    conf: 0.96
    all:
      - id: "micro-behaviors/data/control-flow/registration::lua-register-command-call"
      - id: lua-kerberos-spn-query
      - id: lua-getuserspns-tool
    any:
      - id: metadata/lang/source/naming/function/system::lua-os-execute-symbol
      - id: lua-sensitive-files
