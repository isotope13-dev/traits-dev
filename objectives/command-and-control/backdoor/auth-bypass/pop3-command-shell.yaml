defaults:
  platforms: [unix]
  for: [c, cpp]
  attack: T1059.004,T1556

traits:
  - id: pop3-auth-command-shell-trigger
    desc: POP3 authentication checks hidden command
    crit: suspicious
    conf: 0.98
    if:
      type: text
      regex: '\bstrncmp\s*\(\s*inbuf\s*,\s*WOAH\s*,\s*4\s*\)\s*==\s*0'
  - id: pop3-interactive-shell-command
    desc: POP3 server starts interactive shell
    crit: suspicious
    conf: 0.98
    if:
      type: text
      regex: '\bsystem\s*\(\s*"/bin/sh -i"\s*\)'

composite_rules:
  - id: pop3-hidden-command-interactive-shell
    desc: Hidden POP3 command starts interactive shell
    crit: hostile
    conf: 0.99
    near_lines: 8
    all:
      - id: pop3-auth-command-shell-trigger
      - id: pop3-interactive-shell-command
