# A magic credential wired into a daemon's authentication path.
#
# The change is always tiny and always the same shape: an extra comparison
# against a literal string, sitting in the expression that decides whether
# authentication failed. wu-ftpd 2.1f/2.2 (1994) added `&& strcmp(passwd,
# "NULL")` to the failure condition, so the literal password `NULL` made the
# failure branch unreachable for any account. proftpd 1.3.3c (2010) put the
# same idea in a command handler: `strcmp(target, "ACIDBITCHEZ") == 0` guarding
# setuid(0) plus a shell. util-linux 2.9g (1999) checked the username instead.
#
# So the rule keys on the *pairing*, never on the sentinel: a literal-string
# comparison standing next to a credential comparison, or guarding a privilege
# call. The sentinel changes with every incident; the shape does not.
#
# `text` is in `for:` because this evidence normally reaches an analyst as a
# patch or a source excerpt, and a `.patch`/`.diff` types as text.
defaults:
  platforms: [unix]
  for: [c, cpp, text]
  attack: T1556
  mbc: F0005

traits:
  - id: literal-guarded-root-uid-change
    desc: Literal comparison near a root UID change
    crit: suspicious
    conf: 0.96
    # Require a root UID change after the literal comparison. A nearby
    # comment such as "insecure-setuid-wanted" is not a privilege transition.
    if:
      type: text
      regex: 'strcmp.{0,80}"[^"\n]{2,40}".{0,24}==\s*0.{0,40}setuid\(0\)'

composite_rules:
  # The wu-ftpd shape: a sentinel comparison conjoined into the same boolean
  # expression as the real password check.
  # The proftpd shape: the sentinel does not touch the password check at all,
  # it simply opens a root shell for whoever knows it. The second leg is the
  # bare literal comparison, which the same statement also satisfies -- it
  # keeps the rule from resting on one regex.
  - id: sentinel-guarded-privilege-shell
    desc: Literal command opens a root-privileged shell
    crit: hostile
    conf: 0.97
    for: [c, cpp]
    all:
      - id: literal-guarded-root-uid-change
      - id: micro-behaviors/data/string/compare::literal-string-comparison
      - id: micro-behaviors/process/create/shell/spawn::system-fn

  - id: sentinel-conjunct-in-auth-predicate
    desc: Sentinel comparison joins the password test
    crit: hostile
    conf: 0.95
    near_lines: 4
    all:
      - id: micro-behaviors/os/security/auth/password::strcmp-password-field
      - id: micro-behaviors/os/security/auth/password::strcmp-credential-var-to-literal
