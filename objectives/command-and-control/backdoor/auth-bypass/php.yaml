# Web application authentication bypass backdoors.
# These rules detect unauthenticated request parameters driving programmatic
# user session and security token injection without credential verification.
defaults:
  platforms: [unix, windows]
  for: [php]
  attack: T1556
  mbc: F0005

composite_rules:
  - id: symfony-request-auth-token-bypass
    desc: Request parameter drives Symfony auth bypass
    crit: hostile
    conf: 0.98
    near_lines: 80
    all:
      - id: micro-behaviors/communications/http/request/superglobal::get-post-param-access
      - id: micro-behaviors/os/user/lookup::symfony-doctrine-user-lookup
      - id: micro-behaviors/os/security/auth/session::symfony-token-stored-password
    any:
      - id: micro-behaviors/os/security/auth/session::symfony-security-set-token
      - id: micro-behaviors/os/security/auth/session::symfony-security-session-set
