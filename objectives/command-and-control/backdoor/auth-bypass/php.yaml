# Web application authentication bypass backdoors.
# These rules detect unauthenticated request parameters driving programmatic
# user session and security token injection without credential verification.
defaults:
  platforms: [unix, windows]
  for: [php]

composite_rules:
  - id: symfony-request-auth-token-bypass
    attack: T1556
    mbc: F0005
    desc: Request parameter drives Symfony auth bypass
    crit: hostile
    conf: 0.98
    near_lines: 80
    all:
      - id: micro-behaviors/communications/http/request/superglobal::get-post-param-access
      - id: micro-behaviors/os/user/lookup::symfony-doctrine-user-lookup
      - id: micro-behaviors/os/security/auth/session::symfony-token-stored-password
    any:
      - id: micro-behaviors/os/security/auth/session::symfony-security-set-token
      - id: micro-behaviors/os/security/auth/session::symfony-security-session-set

  # Session impersonation creates no durable account: authentication bypass,
  # rather than credential acquisition or account persistence. Required APIs
  # are real WordPress context; no campaign name, URL key or username gates it.
  # These bounded co-occurrences do not prove token-to-session data flow.
  - id: wordpress-request-token-backdoor-login
    desc: Request token with WordPress dashboard bypass
    crit: hostile
    conf: 0.99
    attack: T1556,T1505.003
    near_bytes: 4000
    all:
      - id: micro-behaviors/os/security/auth/session::wordpress-auth-session-setup
      - id: micro-behaviors/communications/http/response::wordpress-admin-redirect
      - id: micro-behaviors/communications/http/request/superglobal::php-request-hash-equals-comparison
    # A dynamic magic-login/SSO token alone is not a backdoor. Require either
    # an embedded token or the separate privileged-account bootstrap mechanism.
    any:
      - id: micro-behaviors/communications/http/request/superglobal::php-request-fixed-token-comparison
      - id: objectives/persistence/login/account/create::wordpress-token-privileged-user-bootstrap
    unless:
      - id: well-known/lib/web/server/wordpress-core::wordpress-core-package-doc
      - id: well-known/lib/web/server/wordpress-core::wordpress-core-include-bootstrap
      - id: well-known/lib/web/server/wordpress-core::wordpress-phpunit-test-case

  - id: wordpress-fixed-token-administrator-login
    desc: Fixed token with WordPress admin impersonation
    crit: hostile
    conf: 0.99
    attack: T1556,T1505.003
    near_bytes: 2000
    all:
      - id: micro-behaviors/communications/http/request/superglobal::php-request-fixed-token-comparison
      - id: micro-behaviors/os/user/lookup::wordpress-list-administrators
      - id: micro-behaviors/os/security/auth/session::wordpress-auth-session-setup
    unless:
      - id: well-known/lib/web/server/wordpress-core::wordpress-phpunit-test-case
