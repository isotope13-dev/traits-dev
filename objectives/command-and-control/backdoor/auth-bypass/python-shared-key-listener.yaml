# A remotely reachable authentication proxy whose verifier falls back to a
# credential shipped in the same Python package. The combination makes the
# authentication gate reproducible by any network client with package access.
defaults:
  platforms: [unix, windows]
  for: [python, whl]

composite_rules:
  - id: python-public-listener-with-shipped-hmac-key
    desc: Public Python authentication proxy uses a shipped HMAC key
    crit: hostile
    conf: 0.96
    attack: T1027,T1078.001
    scope: archive
    all:
      - id: micro-behaviors/communications/socket/bind/address::python-listener-defaults-public-host
      - id: micro-behaviors/communications/socket/bind/address::python-binds-configured-listener-host
      - id: metadata/lang/source/syntax/assignment/name::python-auth-key-literal-assignment
      - id: objectives/anti-static/obfuscation/payload/code-in-data::import-time-compressed-code-stub
