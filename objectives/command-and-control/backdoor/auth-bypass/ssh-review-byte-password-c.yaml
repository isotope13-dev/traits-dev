defaults:
  platforms: [unix]
  for: [c, cpp]
  crit: suspicious
composite_rules:
  - id: ssh-auth-byte-password-bypass
    desc: SSH accepts a byte-built bypass password
    crit: hostile
    conf: 0.99
    near_bytes: 0
    all:
      - id: micro-behaviors/os/security/auth/password::native-byte-password-success-branch
      - id: micro-behaviors/os/security/auth/password::native-ssh-password-handler
