defaults:
  for: [perl]
  platforms: [unix]
composite_rules:
  - id: perl-accepted-socket-interactive-shell
    desc: Perl listener payload redirects streams into an interactive shell
    crit: hostile
    conf: 0.98
    attack: T1059.004
    near_lines: 6
    all:
      - id: micro-behaviors/communications/socket/accept::perl-accept-socket
      - id: micro-behaviors/process/fd/stdio::stdio-socket-redirect
      - id: micro-behaviors/process/interpreter/shell::bin-sh-interactive
