# The counterpart to reverse-shell/encoded::php-rot13-reversed-back-connect-
# label. This marker identifies the separately embedded bind-shell option; the
# reverse-shell composite requires both network-shell payload labels.
defaults:
  for: [php]
  platforms: [unix]
  attack: T1059.004
  mbc: B0030

traits:
  - id: php-rot13-reversed-bind-port-label
    desc: Reversed ROT13 bind-shell label in Base64
    crit: suspicious
    conf: 0.99
    if:
      type: encoded
      encoding: base64
      regex: '\]yerc\[\s+uf/avo/\s+bg\s+gebc\s+qavO'
    unless:
      - id: well-known/tool/detection/
