# Simple POSIX Backdoor Logic
# Detects minimal bind shells that use socket+bind+dup2+shell-launch pattern
defaults:
  platforms: [linux, unix, macos]
  for: [elf, macho, c, cpp]
  crit: hostile
  conf: 0.9
  attack: "T1059.004"
  mbc: "B0022"

composite_rules:
  # Compiled local bind shells do not retain AF_UNIX as a string or type name.
  # The endpoint/shell literal pair plus the complete accepting-server surface
  # and socket-to-stdio redirection is the stable cross-compiler shape. No
  # memcmp leg: -O2 inlines a short password compare (no import), many bind
  # shells have no password, and every large binary imports memcmp. The
  # source variant below remains separate because source facts expose call
  # syntax while binaries expose imports.
  - id: unix-socket-stdio-shell-binary
    desc: Unix-domain socket listener redirects stdio to a shell
    crit: hostile
    conf: 0.98
    for: [elf, macho]
    all:
      - id: micro-behaviors/fs/path/socket::unix-socket-path-beside-shell
      - id: micro-behaviors/communications/socket/accept::accepting-server-api-surface
      - id: micro-behaviors/process/fd/dup::dup2
      - id: micro-behaviors/process/create/exec::execve-import
    unless:
      # Pinokio's local daemon uses a Unix socket to broker automation
      # subprocesses; the packaged binary is not a bind-shell payload.
      - id: well-known/app/ai/media/pinokio::app-bundle
      # Same reasoning, for a terminal emulator: Tabby's packaged binary binds
      # its own IPC socket, accepts on it, redirects the connection onto a PTY
      # and execs a shell. That is the product.
      - id: well-known/app/utility/tabby-terminal::tabby-terminal-app
      # Chromium/Electron runtime binaries use Unix domain sockets for browser-renderer
      # IPC and manage child processes (zygote, renderer, GPU); they are not bind shells.
      - id: well-known/lib/runtime/scripted/electron::electron-chromium-runtime-strong
      # A Node.js/V8 runtime statically links libuv (socket, accept, dup2)
      # and child_process (execve, /bin/sh): a renamed Node binary such as
      # the signed postman-cli satisfies every leg without being a shell.
      - id: well-known/lib/runtime/scripted/node-runtime::embedded-js-runtime-safe-context

  - id: posix-bind-shell-source
    desc: C source bind shell (bind+dup2+shell)
    for: [c, cpp]
    # A bind shell is one function: the socket is set up, the descriptors are
    # moved, and the shell is launched within a few dozen lines. Without a
    # proximity bound the legs pool across a whole translation unit, which
    # convicted the pristine ircII 2.2.9 `ircaux.c` -- its DCC listener binds
    # and listens at line 525, and an unrelated `dup2` feeding a decompression
    # pipe sits at line 1140, six hundred lines away and attached to no socket
    # at all.
    near_lines: 60
    all:
      - id: micro-behaviors/communications/socket/bind/function::bind
      # `listen-sym` (the call), not the `listen` composite: that composite
      # also requires `socket/create::posix-socket-import`, an import-table
      # lookup that only a compiled binary can satisfy -- C source declares
      # `#include <sys/socket.h>` and has no import named `socket`. Depending
      # on it made this rule, declared `for: [c, cpp]`, unable to fire on any
      # source file; the vsftpd 2.3.4 backdoor matched every other leg and
      # still scored clean.
      - id: micro-behaviors/communications/socket/listen::listen-sym
      - id: micro-behaviors/process/fd/dup::dup2
    any:
      - id: micro-behaviors/process/create/shell/spawn::system-fn
      - id: micro-behaviors/process/interpreter/shell::bin-sh
      - id: micro-behaviors/process/interpreter/shell::unix-shell-executable-path
    unless:
      # Socket test helpers deliberately exercise bind/listen/dup2 patterns:
      # checkpointctl's test/piggie/piggie.c binds 127.0.0.1:5000 and dup2s
      # log-file fds for namespace tests, with system() only running a fixed
      # `ip link` setup command -- no shell ever touches the socket.
      - id: metadata/package/testing/
      - id: "metadata/file/naming::test-directory-component"

  # TCP sibling of the Unix-socket rules above for LD_PRELOAD exploit
  # payloads (Metasploit's CVE-2017-17562 GoAhead bind .so family): the
  # template binds every interface with no address literal at all, so the
  # Unix-socket-path legs cannot apply. LD_PRELOAD plus a complete
  # accept/dup2/shell-exec chain is the discriminator; legitimate preload
  # shims never accept sockets and exec shells together.
  - id: ld-preload-tcp-bind-shell
    desc: LD_PRELOAD TCP bind shell with shell exec
    conf: 0.96
    for: [elf]
    all:
      - id: micro-behaviors/os/linker/env::ld-preload
      - id: micro-behaviors/communications/socket/accept::accepting-server-api-surface
      - id: micro-behaviors/process/fd/dup::dup2
      - id: micro-behaviors/process/create/execv::c-exec-variants
    any:
      - id: micro-behaviors/process/create/shell/spawn::bin-sh-binary-text
      - id: micro-behaviors/process/create/shell/native::bash-binary-name
    needs: 1
    unless:
      # Preload exploit payloads are shared objects (.so); standalone executables have PT_INTERP.
      - id: metadata/binary/linking/runtime::interpreter
      - id: well-known/app/ai/coding-agent/
      # Node native addons (.node) are shared libraries loaded via dlopen, not preload exploit shims.
      - id: metadata/binary/symbols/exports::node-api-addon-export
      - id: metadata/binary/framework::node-module-register-export

  # Forking listener payload: require an accepting socket surface.
  - id: ld-preload-forking-bind-shell
    desc: Forking LD_PRELOAD TCP bind shell
    crit: hostile
    platforms: [linux]
    for: [elf]
    conf: 0.96
    all:
      - id: micro-behaviors/os/linker/env::ld-preload
      - id: micro-behaviors/communications/socket/accept::accepting-server-api-surface
      - id: micro-behaviors/process/fd/dup::dup2
      - id: micro-behaviors/process/create/fork::fork
      - id: micro-behaviors/process/create/execv::c-exec-variants
    any:
      - id: micro-behaviors/process/create/shell/spawn::bin-sh-binary-text
      - id: micro-behaviors/process/create/shell/native::bash-binary-name
    needs: 1
    unless:
      # Preload exploit payloads are shared objects (.so); standalone executables have PT_INTERP.
      - id: metadata/binary/linking/runtime::interpreter
      - id: well-known/app/ai/coding-agent/
      # Node native addons (.node) are shared libraries loaded via dlopen, not preload exploit shims.
      - id: metadata/binary/symbols/exports::node-api-addon-export
      - id: metadata/binary/framework::node-module-register-export

