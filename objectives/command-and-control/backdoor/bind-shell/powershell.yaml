# PowerShell counterpart of a Windows bind shell: accept a TCP client and
# attach cmd.exe's standard streams to that socket.
defaults:
  for: [powershell]
  platforms: [windows]
  attack: T1059.003
  mbc: B0022
composite_rules:
  - id: powershell-tcplistener-cmd-bind-shell
    desc: PowerShell listener pipes a cmd.exe shell
    crit: hostile
    conf: 0.97
    near_bytes: 4096
    all:
      - id: micro-behaviors/communications/socket/create::powershell-tcplistener-object
      - id: micro-behaviors/communications/socket/create::powershell-accept-tcp-client
      - id: micro-behaviors/communications/socket/create::powershell-redirect-standard-input
      - id: micro-behaviors/fs/path/application/executable::cmd-exe-image-name
