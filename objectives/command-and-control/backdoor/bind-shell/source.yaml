defaults:
  for:
  - scripts
  - binaries
  - c
  - cpp
  platforms:
  - unix
  - windows
  attack: T1059
  mbc: B0030.003
traits:
- id: source-winexec-client-command
  desc: WinExec on parsed client command
  crit: suspicious
  conf: 0.94
  for:
  - c
  - cpp
  platforms:
  - windows
  if:
    type: text
    substr: WinExec(cutstr(cmd)+
composite_rules:
- id: shell-netcat-fifo-bind
  desc: Netcat listener exposes FIFO-backed shell
  crit: hostile
  conf: 0.999
  for:
  - shell
  platforms:
  - unix
  scope: leaf
  near_lines: 20
  all:
  - id: micro-behaviors/fs/pipe::mkfifo-variable-target
  - id: micro-behaviors/communications/socket/netcat::nc-listen-mode
  - id: micro-behaviors/process/create/shell/pipeline::pipe-to-absolute-shell-path
- id: bind-shell
  for:
  - elf
  - macho
  desc: Bind shell pattern with socket listener and shell launch
  crit: suspicious
  conf: 0.95
  size_max: 500000
  scope: leaf
  near_lines: 80
  all:
  - id: micro-behaviors/communications/socket/accept::accepting-server-api-surface
  any:
  - id: micro-behaviors/fs/path/application/executable::unix-shell-executable-path
  - id: micro-behaviors/process/create/shell/spawn::bin-shell
  unless:
  - id: micro-behaviors/process/create/fork::daemon-dup
  - id: well-known/tool/sysadmin/network::socat-family-binary-name
  downgrade:
    any:
    - id: metadata/signed/platform::apple
    - id: micro-behaviors/dylib/library/family/
    - id: objectives/persistence/system/daemon
    - id: micro-behaviors/ui/help/
- id: listener-command-exec-source
  for:
  - c
  desc: Native listener executes client commands
  crit: hostile
  conf: 0.97
  size_max: 500000
  near_lines: 140
  all:
  - id: micro-behaviors/communications/socket/bind/function::source-bind-call
  - id: micro-behaviors/communications/socket/listen::server-socket-source
  - id: micro-behaviors/communications/socket/accept::accept-call-source
  any:
  - id: source-winexec-client-command
  - id: micro-behaviors/process/create/shell/spawn::c-popen-call
- id: go-bind-shell-pty-source
  desc: Go TCP listener relays an interactive PTY shell
  crit: hostile
  conf: 0.99
  for:
  - go
  mbc: B0022
  size_max: 500000
  scope: leaf
  near_lines: 160
  all:
  - id: micro-behaviors/communications/socket/listen::listen-go
  - id: micro-behaviors/communications/socket/accept::accept-go
  - id: micro-behaviors/process/tty/pty::go-pty-start
  - id: micro-behaviors/data/buffer/transfer::go-io-copy
  any:
  - id: micro-behaviors/process/create/shell/lang::go-exec-command-bin-sh
  - id: micro-behaviors/process/create/subprocess::go-powershell-command
  unless:
  - id: well-known/tool/offensive/xodbox::xodbox-framework-context
- id: go-bind-shell-stdio-source
  desc: Go TCP listener attaches a shell to the socket
  crit: hostile
  conf: 0.99
  for:
  - go
  mbc: B0022
  size_max: 500000
  scope: leaf
  near_lines: 160
  all:
  - id: micro-behaviors/communications/socket/listen::listen-go
  - id: micro-behaviors/communications/socket/accept::accept-go
  - id: micro-behaviors/process/fd/stdio::go-named-stream-stdio-assignment
  any:
  - id: micro-behaviors/process/create/shell/lang::go-exec-command-bin-sh
  - id: micro-behaviors/process/create/subprocess::go-powershell-command
  unless:
  - id: well-known/tool/offensive/xodbox::xodbox-framework-context
