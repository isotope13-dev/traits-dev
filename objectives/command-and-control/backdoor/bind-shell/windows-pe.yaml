# Compiled Windows bind shell: the program listens, accepts a client and
# hands the accepted Winsock socket to a child process as stdin, stdout and
# stderr, so whoever connects types straight into that process.
defaults:
  platforms: [windows]
  for: [pe, dll]
  arch: [x86]
  attack: T1059.003
  mbc: B0022

composite_rules:
  - id: winsock-accepted-socket-child-stdio
    desc: Accepted socket becomes a child's console
    crit: hostile
    conf: 0.95
    all:
      - id: micro-behaviors/process/stdio/relay::pe-winsock-handle-as-child-stdio
      - id: micro-behaviors/communications/socket/listen::winsock-listener-imports
      - id: micro-behaviors/communications/socket/init::accept-api
