# Statically linked MIPS builds do not retain socket/exec imports. The direct
# syscall wrappers and shell path must be combined with both listener
# operations to identify a shell exposed through a bound network socket.
defaults:
  platforms: [linux]
  for: [elf]
  attack: T1059.004
  mbc: B0022

composite_rules:
  - id: mips-static-bind-shell
    desc: Statically linked MIPS network listener with shell execution
    crit: hostile
    conf: 0.97
    all:
      - id: metadata/arch/iot::mips
      - id: metadata/binary/linking/dynamic::elf-needed-libs-zero
      - id: micro-behaviors/communications/socket/syscall::mips-socket-operation
      - id: micro-behaviors/communications/socket/syscall::mips-bind-operation
      - id: micro-behaviors/communications/socket/syscall::mips-listen-operation
      - id: micro-behaviors/os/syscall/raw::mips-o32-execve-syscall-le
      - id: micro-behaviors/fs/path/binary::bin-sh-rodata-substring
