defaults:
  for: [python]
  platforms: [unix]
  attack: T1059.006
  mbc: B0030

composite_rules:
  - id: python-accepted-descriptor-shell
    desc: Accepted socket feeds shell descriptor input
    crit: hostile
    conf: 0.98
    near_lines: 80
    all:
      - id: micro-behaviors/communications/socket/bind/function::python-socket-bind-method
      - id: micro-behaviors/communications/socket/listen::socket-accept-call
      - id: micro-behaviors/process/create/system::python-os-system
      - id: micro-behaviors/process/create/shell/spawn::bin-sh-interactive
      - id: micro-behaviors/process/create/shell/fd::shell-stdin-fd-redirect
      - id: micro-behaviors/process/fd/query::python-fileno
    any:
      - id: micro-behaviors/communications/socket/listen::python-short-socket-listen-method
      - id: micro-behaviors/communications/socket/listen::python-server-socket-listen-method
      - id: micro-behaviors/communications/socket/listen::python-named-socket-listen-method
    unless:
      - id: well-known/tool/offensive/xxgaruda::product-tagline
