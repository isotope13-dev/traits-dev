defaults:
  platforms: [windows, unix]
  for: [python]
composite_rules:
  # Relocated from backdoor/shell/socket: a listening shell is a bind shell,
  # rather than an outbound reverse shell. Matching and exclusions preserved.
  - id: python-bind-shell-command-channel
    desc: Python bind shell command channel
    crit: hostile
    conf: 0.97
    attack: T1059.006
    mbc: B0022
    near_lines: 30
    all:
      - id: micro-behaviors/communications/socket/bind/function::python-socket-bind-method
      - id: metadata/lang/source/syntax/call/invocation::python-listen-call-text
      - id: micro-behaviors/communications/socket/accept::socket-accept-call
      - id: micro-behaviors/communications/socket/receive::socket-recv-call
      - id: micro-behaviors/process/create/subprocess::process-execution
      - id: micro-behaviors/process/create/shell-subprocess::shell-true
    any:
      - id: micro-behaviors/communications/socket/send::python-send-output-named-variable
      - id: micro-behaviors/communications/socket/bind/address::bind-all-interfaces
      - id: micro-behaviors/process/create/thread::python-daemon-thread
    unless:
      - id: metadata/package/testing/
      - id: metadata/file/naming::test-directory-component
      - id: well-known/tool/detection/llm-scanner/
      - id: well-known/lib/vendor-sdk/sogen/
