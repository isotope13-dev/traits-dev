defaults:
  crit: hostile
  attack: T1059
  platforms: [unix, windows]
  for: [ruby]

composite_rules:
  - id: ruby-tcp-server-open3-bind-shell
    desc: Ruby TCP server runs client commands
    conf: 0.97
    near_lines: 12
    all:
      - id: micro-behaviors/communications/socket/listen::ruby-tcp-server-loop-call
      - id: micro-behaviors/process/create/shell/lang::ruby-open3-interpolated-command

  - id: ruby-tcpserver-exec-bind-shell
    desc: Ruby TCPServer execs an interactive shell
    conf: 0.97
    near_lines: 8
    all:
      - id: micro-behaviors/communications/socket/listen::ruby-tcp-server-accept-call
      - id: micro-behaviors/process/fd/stdio::ruby-interactive-shell-fd-redirection

  - id: ruby-base64-tcpserver-command-shell
    desc: Encoded Ruby TCP command shell
    crit: hostile
    conf: 0.98
    near_bytes: 512
    all:
      - id: ruby-encoded-tcpserver-command-input
      - id: ruby-encoded-command-backtick-execution

traits:
  # Decode the embedded stage before checking its behavior: TCPServer receives
  # commands and Ruby evaluates each command through backtick interpolation.
  - id: ruby-encoded-tcpserver-command-input
    desc: Encoded Ruby server reads client commands
    crit: notable
    conf: 0.98
    if:
      type: encoded
      encoding: base64
      regex: 'TCPServer\.(open|new)\(\d+\)[\s\S]{0,50}\.accept[\s\S]{0,50}\.gets'

  - id: ruby-encoded-command-backtick-execution
    desc: Encoded Ruby executes received commands
    crit: notable
    conf: 0.98
    if:
      type: encoded
      encoding: base64
      regex: '\.gets[\s\S]{0,50}`#\{[^}]{1,50}\}'
