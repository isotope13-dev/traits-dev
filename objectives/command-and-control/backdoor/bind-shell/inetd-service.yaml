# An inetd service line that runs an interactive shell as root hands a root
# shell to whoever connects to the named port.  Exploit payloads write one to a
# scratch file and start inetd on it, because it needs no compiled backdoor.
defaults:
  platforms: [unix]
  for: [scripts, c]
  attack: T1059.004,T1543
  mbc: B0022

traits:
  - id: inetd-root-shell-service-line
    desc: inetd service line runs a root shell
    crit: suspicious
    conf: 0.95
    if:
      type: text
      regex: '\b[\w-]{2,24}\s+stream\s+tcp\s+nowait\s+root\s+/bin/(ba|k)?sh\s+(ba|k)?sh\s+-i\b'

  - id: inetd-started-on-scratch-config
    desc: inetd started on a temp-directory config
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '\binetd\s+(-s\s+)?/(tmp|var/tmp|dev/shm)/\S+'

composite_rules:
  - id: inetd-root-shell-backdoor-launch
    desc: inetd launched on a root-shell service config
    crit: hostile
    conf: 0.96
    near_lines: 6
    all:
      - id: inetd-root-shell-service-line
      - id: inetd-started-on-scratch-config
    unless:
      - id: metadata/package/testing/
      - id: "metadata/file/naming::test-directory-component"
