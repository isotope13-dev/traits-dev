# Python analogue of an embedded bind shell.  The listener and accepted socket
# are connected to a child process, which is the behavior of an xlogin-style
# shell without relying on that family name.
defaults:
  crit: hostile
  platforms: [unix, appliance]
  for: [python]
  attack: T1059.006,T1059.004
  mbc: B0030

composite_rules:
  - id: python-cli-bind-shell-dispatch
    desc: Python CLI dispatches a bind-shell server
    conf: 0.98
    platforms: [windows, unix]
    attack: T1059
    scope: leaf
    near_lines: 60
    all:
      - id: metadata/lang/natural/vocabulary/content-word::bind-shell-term
      - id: metadata/lang/source/syntax/argument::python-shell-option
      - id: metadata/lang/source/literal/string/command::bash-command-option-text
      - id: micro-behaviors/data/control-flow/dispatch/named::python-run-server-shell-call

  - id: python-listener-pty-shell-channel
    desc: Python listener exposes an interactive PTY shell
    conf: 0.99
    scope: leaf
    all:
      - id: micro-behaviors/communications/socket/bind/function::python-server-socket-bind-method
      - id: micro-behaviors/communications/socket/listen::python-server-socket-listen-method
      - id: micro-behaviors/communications/socket/accept::socket-accept-call
      - id: objectives/command-and-control/backdoor/tasking/socket::python-pty-shell-channel

  - id: python-public-socket-bind-shell
    desc: Python public socket launches a child shell
    conf: 0.98
    all:
      - id: micro-behaviors/communications/socket/bind/address::python-bind-all-interfaces
      - id: micro-behaviors/communications/socket/listen::python-server-socket-listen-method
      - id: micro-behaviors/communications/socket/accept::socket-accept-call
      - id: metadata/lang/source/syntax/argument::python-stdin-identifier-form
      - id: micro-behaviors/process/create/subprocess/launch::popen-ast
    near_lines: 40

  - id: python-http-bind-shell
    desc: Python HTTP listener executes commands through shell
    conf: 0.98
    platforms: [windows, unix]
    attack: T1059.006,T1505.003
    all:
      - id: micro-behaviors/communications/http/server/framework::builtin-http-server
      - id: micro-behaviors/communications/http/server/handler::python-http-handler-base-request
      - id: micro-behaviors/process/create/shell/command-string::python-subprocess-shell-true
      - id: micro-behaviors/communications/http/server/request::python-http-response-body-write
    any:
      - id: micro-behaviors/communications/http/server/listener::python-httpserver-bind-all
      - id: micro-behaviors/communications/socket/bind/address::bind-all-interfaces
      - id: micro-behaviors/process/create/variable::variable-command-argument
      - id: micro-behaviors/communications/http/server/middleware::python-basehttp-log-message-override
      - id: micro-behaviors/communications/http/response::source-http-404-call
    near_lines: 40
