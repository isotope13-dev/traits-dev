# Windows socket stdio redirection bind shell.
# Listener-side counterpart to reverse-shell: binds and listens on a socket,
# accepts incoming client connection, and attaches child process stdio handles
# (STARTF_USESTDHANDLES) to the accepted socket to provide an interactive shell.
defaults:
  for: [c, cpp, html, text]
  platforms: [windows]
  attack: T1059.003
  mbc: B0022

composite_rules:
  - id: windows-bind-shell-stdio-source
    desc: Windows listener attaches shell process to socket stdio
    crit: hostile
    conf: 0.98
    near_bytes: 2048
    all:
      - id: micro-behaviors/communications/socket/listen::winsock-listener-call-sequence
      - id: micro-behaviors/process/fd/stdio::startupinfo-stdio-handle-fields
