# JNI libraries that expose a shell-command runner to their hosting app. A
# Java-called native entry point is ordinary; pairing it with a libc shell
# executor import and a dedicated command-runner export means the app can
# be driven to run arbitrary shell commands through this library.
defaults:
  platforms: [android]
  for: [elf]
  attack: T1059.004,T1620
  mbc: B0022

traits:
composite_rules:
  - id: jni-shell-backdoor-executor
    desc: JNI library runs shell commands for host
    crit: hostile
    conf: 0.97
    all:
      - id: metadata/binary/symbols/plugin::jni-native-method-exports
      - id: micro-behaviors/process/create/shell/native::c-system-import
      - id: metadata/binary/symbols/export-name-pattern::shell-command-named-export
