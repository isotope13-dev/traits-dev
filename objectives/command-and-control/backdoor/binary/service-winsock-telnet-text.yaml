# Text-based variant of service-winsock-telnet-backdoor for PEs whose
# import directory is malformed/non-standard so the symbol-based atoms
# in micro-behaviors/communications/socket/multiplex don't fire.
defaults:
  platforms: [windows]
  for: [pe]
  attack: T1543.003
  mbc: B0030
traits:
  - id: ipv4-port-format-string
    desc: IPv4 colon-port format string %u.%u.%u.%u:%u
    crit: notable
    conf: 0.95
    if:
      type: text
      exact: '%u.%u.%u.%u:%u'
  - id: odbc32-exe-install-path
    desc: Bot install path WINDOWS odbc32.exe
    crit: suspicious
    conf: 0.99
    if:
      type: text
      regex: \\WINDOWS\\(system32|SysWOW64)\\odbc32\.exe$
      case_insensitive: true
  - id: network-services-display-name
    desc: 'Network Services service display name'
    crit: notable
    conf: 0.92
    if:
      type: text
      exact: Network Services
composite_rules:
  # An appended PE can carry its own backdoor while the outer file presents
  # as an upload utility. Require the embedded-image boundary plus its
  # persistence, socket-client API surface, service label, and endpoint
  # formatting. The API and strings are sourced from the appended PE; callers
  # should confirm its service flow when reviewing an individual specimen.
  - id: embedded-persistent-network-service-agent
    desc: Embedded PE has a persistent named network-service agent profile
    crit: hostile
    conf: 0.9
    all:
      - id: metadata/binary/layout/embedded::pe-embedded
      - id: micro-behaviors/os/registry/keys/autostart::currentversion-run-key-path
      - id: micro-behaviors/communications/socket/init::winsock-runtime-client-api-table
      - id: network-services-display-name
      - id: ipv4-port-format-string

  - id: service-winsock-telnet-backdoor-text
    desc: Service-installing Winsock+Telnet backdoor (text imports)
    crit: hostile
    conf: 0.96
    all:
      - id: micro-behaviors/os/service/dispatch::service-dispatch-triad
      - id: micro-behaviors/communications/socket/multiplex::winsock-event-loop-text
      - id: ipv4-port-format-string
      - id: micro-behaviors/communications/socket/telnet::telnet-bare-token
    any:
      - id: "micro-behaviors/os/registry/keys/autostart::currentversion-run-key-path"
      - id: micro-behaviors/os/service/create::create-service
    downgrade:
      any:
        - id: metadata/signed/platform/
        - id: metadata/binary/vendor/
  - id: bot-odbc32-service-install
    desc: Bot install at odbc32.exe with SCM service install
    crit: hostile
    conf: 0.98
    attack: T1036.005,T1543.003
    all:
      - id: odbc32-exe-install-path
      - id: micro-behaviors/os/service/create::create-service
    any:
      - id: micro-behaviors/os/service/dispatch::service-dispatch-triad
      - id: network-services-display-name
      - id: "micro-behaviors/os/registry/keys/autostart::currentversion-run-key-path"
