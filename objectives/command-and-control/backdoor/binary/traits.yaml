defaults:
  platforms: [unix]
  for: [elf, macho]
  crit: hostile
  conf: 0.82
  attack: T1059

composite_rules:
  - id: persistent-http-command-backdoor
    desc: Persistent HTTP command backdoor surface
    crit: hostile
    conf: 0.99
    attack: T1059.003,T1547.001,T1071.001
    for: [pe]
    platforms: [windows]
    all:
      - id: objectives/persistence/login/registry/run-key::pe-registry-self-install
      - id: micro-behaviors/communications/http/url/domain::xor-decoded-http-url
      - id: micro-behaviors/communications/http/post::post-template-pe
      - id: micro-behaviors/process/create/exec::cmd-exe-reference

  # An unsigned PE that walks the process list, kills by name, and talks
  # WinInet HTTP is a hunter, not an administrator: each capability is
  # reviewable alone, but the traversal plus the kill plus the channel plus
  # the missing signature is the shape of commodity RAT/dropped binaries
  # (seen in the Infestation game-mod drop).
  - id: unsigned-process-hunter-backdoor
    desc: Unsigned process hunter phones home
    crit: hostile
    conf: 0.94
    attack: T1057,T1071.001
    for: [pe]
    platforms: [windows]
    all:
      - id: micro-behaviors/process/enumerate/snapshot::dynamic-toolhelp-process-traversal
      - id: micro-behaviors/process/terminate/kill::terminate-process-name-text
      - id: micro-behaviors/communications/http/dynamic::dynamic-wininet-http-api-cluster
      - id: metadata/signed/trust-level::unsigned-missing-signature-record
    unless:
      - id: metadata/signed/platform/
      - id: well-known/tool/reverse-engineering/

  - id: unsigned-hunter-runkey-backdoor
    desc: Unsigned process hunter installs a Run key
    crit: hostile
    conf: 0.95
    attack: T1057,T1547.001
    for: [pe]
    platforms: [windows]
    all:
      - id: unsigned-process-hunter-backdoor
      - id: micro-behaviors/os/registry/keys::currentversion-run
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/installer/family/

  - id: unsigned-hunter-self-install
    desc: Unsigned process hunter copies itself into the registry
    crit: hostile
    conf: 0.95
    attack: T1057,T1547.001
    for: [pe]
    platforms: [windows]
    all:
      - id: unsigned-process-hunter-backdoor
      - id: objectives/persistence/login/registry/run-key::pe-registry-self-install
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/installer/family/

  - id: unsigned-hunter-create-process
    desc: Unsigned process hunter creates a process
    crit: hostile
    conf: 0.94
    attack: T1057,T1059
    for: [pe]
    platforms: [windows]
    all:
      - id: unsigned-process-hunter-backdoor
      - id: micro-behaviors/process/create/spawn::create-process-a
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/installer/family/

  - id: unsigned-hunter-shellexec
    desc: Unsigned process hunter launches via ShellExecuteEx
    crit: hostile
    conf: 0.94
    attack: T1057,T1059
    for: [pe]
    platforms: [windows]
    all:
      - id: unsigned-process-hunter-backdoor
      - id: micro-behaviors/process/create/shellexec::shell-executeex-call
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/installer/family/

  - id: unsigned-toolhelp-winexec
    desc: Process hunter launches payload via WinExec
    crit: hostile
    conf: 0.93
    attack: T1057,T1059
    for: [pe]
    platforms: [windows]
    all:
      - id: micro-behaviors/process/enumerate/snapshot::dynamic-toolhelp-process-traversal
      - id: micro-behaviors/process/create/exec::winexec
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/installer/family/
      - id: well-known/lib/

  - id: unsigned-toolhelp-kill
    desc: Process hunter kills processes by name
    crit: hostile
    conf: 0.93
    attack: T1057,T1489
    for: [pe]
    platforms: [windows]
    all:
      - id: micro-behaviors/process/enumerate/snapshot::dynamic-toolhelp-process-traversal
      - id: micro-behaviors/process/terminate/kill::terminate-process-name-text
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/installer/family/
      - id: well-known/lib/
      - id: well-known/tool/sysadmin/7zip::sevenzip-distribution-binary

  - id: unsigned-cmd-create-process-w
    desc: Unsigned cmd.exe reference creates a Unicode process
    crit: hostile
    conf: 0.93
    attack: T1059.003
    for: [pe]
    platforms: [windows]
    all:
      - id: micro-behaviors/process/create/exec::cmd-exe-reference
      - id: micro-behaviors/process/create/spawn::create-process-w
    unless:
      - id: metadata/signed/platform/
      - id: metadata/signed/trust-level::signer-evidence-present
      - id: metadata/binary/installer/family/
      - id: well-known/lib/
      - id: well-known/tool/development/toolchain/dlang::dmd-install-tree

  - id: unsigned-shellexec-create-process-w
    desc: Unsigned ShellExecute also creates a Unicode process
    crit: suspicious
    conf: 0.82
    for: [pe]
    platforms: [windows]
    all:
      - id: micro-behaviors/process/create/shellexec::shell-execute-call
      - id: micro-behaviors/process/create/spawn::create-process-w
    unless:
      - id: metadata/signed/trust-level::signer-evidence-present
      - id: metadata/signed/platform/
      - id: metadata/binary/installer/family/
      - id: well-known/lib/
      - id: well-known/tool/sysadmin/7zip::sevenzip-distribution-binary
      # A compiled AutoIt script links the whole interpreter, whose library
      # surface always contains ShellExecute and CreateProcessW regardless of
      # what the embedded script does, so the pair is not evidence here.
      - id: metadata/lang/compiled::autoit-binary
      - id: well-known/tool/development/toolchain/dlang::dmd-install-tree

  - id: unsigned-virtual-alloc-cmd
    desc: Unsigned VirtualAlloc stub shells cmd.exe
    crit: hostile
    conf: 0.93
    attack: T1055,T1059.003
    for: [pe]
    platforms: [windows]
    all:
      - id: micro-behaviors/mem/protect/modify::virtual-alloc-string
      - id: micro-behaviors/process/create/exec::cmd-exe-reference
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/installer/family/
      - id: well-known/lib/
      - id: well-known/tool/development/toolchain/dlang::dmd-install-tree

  - id: benign-native-command-server-context
    desc: Recognized benign native command-server tool context
    crit: exception
    conf: 0.99
    any:
      - id: well-known/app/media/godot::godot-native-runtime
      - id: well-known/app/ai/coding-agent/anthropic-claude-code::native-linux-cli-member
      - id: well-known/tool/detection/falco::falco-monitoring-context
      - id: well-known/tool/reverse-engineering/gdb::gdb-debugger-context
      - id: well-known/app/system/samba::samba-configuration-library
      - id: well-known/tool/development/runtime/qemu::qemu-system-emulator

  - id: xor-unpacking-winsock-command-backdoor
    desc: XOR-unpacking Winsock command backdoor
    crit: hostile
    conf: 0.99
    attack: T1027,T1059.003,T1057
    mbc: B0030
    for: [pe]
    platforms: [windows]
    all:
      - id: objectives/anti-static/obfuscation/payload/encrypted::nop-padded-dword-xor-decryptor
      - id: micro-behaviors/communications/socket/init::socket-api
      - id: micro-behaviors/communications/socket/init::bind-api
      - id: micro-behaviors/communications/socket/init::listen-api
      - id: micro-behaviors/communications/socket/init::accept-api
      - id: micro-behaviors/process/create/exec::winexec
      - id: micro-behaviors/os/msdos/internal::check-command-com
      - id: micro-behaviors/process/enumerate/snapshot::dynamic-process32-first

  - id: socket-command-backdoor
    desc: Socket command backdoor surface
    all:
      - id: micro-behaviors/communications/socket/create::posix-socket-import
      - id: micro-behaviors/communications/socket/receive::recv-symbol
      - id: micro-behaviors/communications/socket/send::send-symbol
      - id: micro-behaviors/process/create/shell/spawn::system-fn
      - id: micro-behaviors/process/create/execv::exec-variant-symbol-text
      - id: micro-behaviors/process/create/shell/spawn::bin-sh-binary-text
    unless:
      # Stock shells/privileged tools (busybox, socat, gawk, sudo) — grouped
      # into one exception. sudo's intercept preload lib opens a socket to the
      # sudo process and hooks exec for the intercept policy, not a backdoor.
      - id: well-known/tool/sysadmin/unix-benign::benign-native-shell-tools
      - id: well-known/tool/sysadmin/busybox::busybox-binary
      - id: well-known/tool/development/build/flow-bin/
      - id: benign-native-command-server-context
      - id: well-known/tool/offensive/ncat::ncat-package-identity
      - id: well-known/dual-use/remote-admin/meshcentral::meshcentral-agent-binary-context

  - id: accepting-command-backdoor
    desc: Accepting command backdoor surface
    all:
      - id: micro-behaviors/communications/socket/listen::accepting-server-api-surface
      - id: micro-behaviors/process/create/shell/spawn::system-fn
      - id: micro-behaviors/process/create/execv::exec-variant-symbol-text
      - id: micro-behaviors/process/create/shell/command-mode::native-shell-command-invocation
    unless:
      - id: well-known/tool/sysadmin/network::socat-family-binary-name
      - id: well-known/tool/development/cli/gnu-awk::gawk-binary
      - id: well-known/tool/sysadmin/busybox::busybox-binary
      - id: well-known/tool/development/build/flow-bin/
      - id: benign-native-command-server-context
      - id: well-known/dual-use/remote-admin/meshcentral::meshcentral-agent-binary-context
  - id: malformed-native-network-exec-backdoor
    desc: Malformed native binary exposes network control and process execution
    crit: hostile
    conf: 0.98
    attack: T1027.002,T1059,T1071
    mbc: B0030
    for: [elf]
    platforms: [linux]
    all:
      - id: metadata/binary/header/malformed::elf-parse-failure
      - id: micro-behaviors/communications/socket/listen::listen-sym
      - id: micro-behaviors/process/create/execv::exec-variant-symbol-text
    unless:
      - id: well-known/tool/sysadmin/unix-benign/
      - id: metadata/binary/vendor/
  - id: daemonized-socket-command-backdoor
    desc: Daemonized socket command backdoor
    all:
      - id: micro-behaviors/communications/socket/listen::accepting-server-api-surface
      - id: micro-behaviors/process/create/shell/spawn::system-fn
      - id: micro-behaviors/process/create/execv::exec-variant-symbol-text
      - id: micro-behaviors/process/create/shell/command-mode::native-shell-command-invocation
      - id: micro-behaviors/process/daemonize/detach::setsid-import
    unless:
      - id: well-known/tool/sysadmin/network::socat-family-binary-name
      - id: well-known/tool/development/cli/gnu-awk::gawk-binary
      - id: well-known/tool/sysadmin/busybox::busybox-binary
      - id: well-known/tool/development/build/flow-bin/
      - id: benign-native-command-server-context
      - id: well-known/dual-use/remote-admin/meshcentral::meshcentral-agent-binary-context

  - id: vless-upnp-native-backdoor
    for: [elf]
    desc: Native VLESS proxy with UPnP exposure
    crit: hostile
    conf: 0.98
    attack: T1090,T1105
    all:
      - id: micro-behaviors/communications/proxy/vless::native-vless-websocket-marker
      - id: micro-behaviors/communications/http/request/upnp::add-port-mapping-soap
      - id: micro-behaviors/os/syscall/raw::raw-network-syscalls

  - id: native-vless-relay-service
    for: [elf]
    desc: Native VLESS WebSocket relay service
    crit: hostile
    conf: 0.99
    attack: T1090,T1071.001
    all:
      - id: micro-behaviors/communications/proxy/vless::native-vless-websocket-marker
      - id: micro-behaviors/communications/proxy/vless::native-vless-relay-thread
      - id: micro-behaviors/communications/http/websocket::websocket-http-upgrade-headers
      - id: micro-behaviors/communications/http/request/proxy::proxy-connect-method
      - id: micro-behaviors/communications/socket/listen::accepting-server-api-surface
      - id: micro-behaviors/communications/socket/connect::connect-symbol

  - id: local-setuid-file-replacement-backdoor
    desc: Local setuid file replacement backdoor
    crit: suspicious
    conf: 0.86
    all:
      - id: micro-behaviors/process/identity/setuid::setreuid
      - id: micro-behaviors/os/privilege/query::geteuid
      - id: micro-behaviors/fs/file/rename::rename
    any:
      - id: micro-behaviors/fs/file/rename::rename-account-file
      - id: micro-behaviors/fs/file/rename::rename-loader-file
    needs: 1
    unless:
      - id: metadata/binary/linking/runtime::musl-loader-basename
      - id: metadata/package/files/included::so-extension-basename
      - id: well-known/lib/runtime/scripted/bun-runtime/
      - id: well-known/tool/development/agent/kilocode::kilo-code-native-runtime
      - id: well-known/app/ai/coding-agent/opencode::opencode-bun-runtime
      - id: objectives/credential-access/dump/system/
      - id: well-known/tool/sysadmin/container::podman-distribution
      - id: metadata/package/files/dependency::os-image-root-file-path
      - id: objectives/command-and-control/backdoor/binary::benign-native-library-context
  - id: local-setuid-checked-file-replacement
    desc: Checked setuid file replacement backdoor
    crit: suspicious
    conf: 0.88
    all:
      - id: local-setuid-file-replacement-backdoor
      - id: micro-behaviors/fs/file/stat::stat-exists

  - id: benign-native-library-context
    desc: Recognized benign native-library context for standard file APIs
    crit: exception
    conf: 0.99
    any:
      - id: well-known/lib/data/sap-hana/
      - id: well-known/lib/runtime/scripted/koffi/
