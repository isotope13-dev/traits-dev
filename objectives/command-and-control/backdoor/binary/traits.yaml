defaults:
  platforms: [unix]
  for: [elf, macho]
  crit: hostile
  conf: 0.82
  attack: T1059

composite_rules:
  - id: xor-unpacking-winsock-command-backdoor
    desc: XOR-unpacking Winsock command backdoor
    crit: hostile
    conf: 0.99
    attack: T1027,T1059.003,T1057
    mbc: B0030
    for: [pe]
    platforms: [windows]
    all:
      - id: metadata/binary/instruction/sequence/stack::x86-pusha-mov-push-four-pop-edi
      - id: micro-behaviors/communications/socket/create::socket-api
      - id: micro-behaviors/communications/socket/bind/function::winsock-bind-import
      - id: micro-behaviors/communications/socket/init::listen-api
      - id: micro-behaviors/communications/socket/init::accept-api
      - id: metadata/binary/symbols/name/process::winexec
      - id: micro-behaviors/os/msdos/internal::check-command-com
      - id: micro-behaviors/process/enumerate/snapshot::dynamic-process32-first

  - id: malformed-native-network-exec-backdoor
    desc: Malformed native binary exposes network control and process execution
    crit: hostile
    conf: 0.98
    attack: T1027.002,T1059,T1071
    mbc: B0030
    for: [elf]
    platforms: [linux]
    all:
      - id: metadata/binary/header/malformed::elf-parse-failure
      - id: micro-behaviors/communications/socket/listen::listen-sym
      - id: metadata/binary/symbols/name/process::exec-variant-symbol-text
  - id: vless-upnp-native-backdoor
    for: [elf]
    desc: Native VLESS proxy with UPnP exposure
    crit: hostile
    conf: 0.98
    attack: T1090,T1105
    all:
      - id: micro-behaviors/communications/proxy/vless::native-vless-websocket-marker
      - id: micro-behaviors/communications/http/request/upnp::add-port-mapping-soap
      - id: micro-behaviors/os/syscall/raw::raw-network-syscalls

  - id: native-vless-relay-service
    for: [elf]
    desc: Native VLESS WebSocket relay service
    crit: hostile
    conf: 0.99
    attack: T1090,T1071.001
    all:
      - id: micro-behaviors/communications/proxy/vless::native-vless-websocket-marker
      - id: micro-behaviors/communications/proxy/vless::native-vless-relay-thread
      - id: micro-behaviors/communications/http/websocket::websocket-http-upgrade-headers
      - id: micro-behaviors/communications/http/request/proxy::proxy-connect-method
      - id: micro-behaviors/communications/socket/accept::accepting-server-api-surface
      - id: micro-behaviors/communications/socket/connect/attempt::connect-symbol

  - id: local-setuid-file-replacement-backdoor
    desc: Local setuid file replacement backdoor
    crit: suspicious
    conf: 0.86
    all:
      - id: micro-behaviors/process/identity/setuid::setreuid
      - id: micro-behaviors/os/privilege/query::geteuid
      - id: micro-behaviors/fs/file/rename::rename
    any:
      - id: micro-behaviors/fs/file/rename::rename-account-file
      - id: micro-behaviors/fs/file/rename::rename-loader-file
    needs: 1
  - id: local-setuid-checked-file-replacement
    desc: Checked setuid file replacement backdoor
    crit: suspicious
    conf: 0.88
    all:
      - id: local-setuid-file-replacement-backdoor
      - id: micro-behaviors/fs/file/stat::stat-exists
