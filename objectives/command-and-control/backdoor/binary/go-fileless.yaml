# Go-compiled connect-back implants that launch fileless via memfd_create.
# Not a reverse-shell (no stdio plumbing, no shell exec) — pure C2 implant.
defaults:
  crit: hostile
  attack: T1071.001
  platforms: [unix, windows, macos]
  for: [elf, macho, pe]

composite_rules:
  - id: go-fileless-connectback-c2
    for: [elf, macho]
    desc: Go connect-back malware with fileless memory launch
    conf: 0.98
    mbc: C0002
    all:
      - id: metadata/lang/compiler/systems::go-binary
      - id: objectives/command-and-control/infrastructure/ip-port::hardcoded-ipv4-port-list
      - id: objectives/evasion/fileless/memory::memfd-fileless-runtime-flow
  - id: go-aggressive-behavior
    desc: Go malware with aggressive function naming and persistence
    conf: 0.95
    all:
      - id: metadata/lang/compiler/systems::go-binary
      - id: metadata/binary/symbols/name/qualified/security::aggressive-go-punishment
    any:
      - id: objectives/persistence/login/registry/run-key/
      - id: objectives/persistence/login/registry/script::run-key-node-beacon-persistence
      - id: objectives/persistence/login/registry/script::perl-run-key-node-beacon
      - id: objectives/persistence/login/registry/script::elixir-run-key-node-beacon
      - id: objectives/persistence/login/registry/script::kotlin-run-key-node-beacon
      - id: objectives/persistence/login/registry/script::typescript-run-key-node-beacon
      - id: objectives/persistence/login/registry/script::csharp-run-key-node-beacon
      - id: objectives/persistence/login/registry/script::go-run-key-node-beacon
      - id: objectives/persistence/login/registry/script::rust-run-key-node-beacon
      - id: objectives/persistence/login/registry/script::python-run-key-http-beacon-persistence
      - id: objectives/persistence/login/registry/script::swift-run-key-node-beacon
      - id: objectives/persistence/login/registry/script::packaged-source-run-key-node-beacon
      - id: objectives/persistence/login/registry/script::jvm-bytecode-run-key-node-beacon
