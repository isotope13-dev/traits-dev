defaults:
  platforms: [windows]
  for: [pe, dll]

composite_rules:
  - id: managed-remote-control-hidden-process-profile
    desc: Managed remote-control and hidden-process APIs
    crit: suspicious
    conf: 0.98
    attack: T1059,T1564.003
    all:
      - id: metadata/lang/compiler/managed::dotnet-metadata
      - id: objectives/command-and-control/backdoor/binary::managed-remote-control-method-cluster
      - id: micro-behaviors/fs/write/file/full/bytes::dotnet-writeallbytes-token
      - id: metadata/binary/symbols/name/process::dotnet-processstartinfo-name
      - id: micro-behaviors/process/config/window::dotnet-console-window-option-reference
    any:
      - id: micro-behaviors/data/decode/base64/reference::dotnet-frombase64string-text
      - id: micro-behaviors/process/interpreter/runtime/clr::assembly-resolve-event-api
      - id: micro-behaviors/crypto/decrypt/initialize::dotnet-create-decryptor
      - id: micro-behaviors/os/registry/delete::managed-registry-delete-value-references
      - id: micro-behaviors/process/terminate/kill::dotnet-kill-member-reference
    needs: 2
