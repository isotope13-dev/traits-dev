defaults:
  platforms: [windows]
  for: [pe, dll]
  attack: T1059,T1071,T1105
  mbc: B0030

traits:
  - id: global-shard-mutex-v1
    desc: Global ShardMutex_v1 RAT mutex name
    crit: component
    conf: 0.99
    if:
      type: text
      exact: 'Global\ShardMutex_v1'

composite_rules:
  - id: xor-obfuscated-winsock-download-exec-backdoor
    desc: XOR-obfuscated Winsock backdoor downloads and executes payloads
    crit: hostile
    conf: 0.99
    attack: T1027,T1059,T1071.001,T1105
    all:
      - id: micro-behaviors/data/encode/xor::x64-key-index-dual-xor-copy-loop
      - id: micro-behaviors/communications/socket/init::winsock-client-lifecycle
      - id: micro-behaviors/communications/http/get::wininet-http-flow
      - id: micro-behaviors/communications/http/get::internet-read-file
      - id: micro-behaviors/process/create/spawn::child-process-creation-api

  - id: native-profile-file-control-rat
    desc: Native RAT profiles its host and exposes file and process control
    crit: hostile
    conf: 0.99
    all:
      - id: global-shard-mutex-v1
      - id: objectives/discovery/system/fingerprint/info::native-host-profile-record
      - id: micro-behaviors/communications/ip/literal::external-ipv4-host-literal-binary
      - id: micro-behaviors/communications/socket/init::ws2-startup-api-string
      - id: micro-behaviors/fs/enumerate/directory::find-file-walker
      - id: micro-behaviors/process/create/spawn::create-process-a
      - id: micro-behaviors/process/create/exec::shell-execute-a
