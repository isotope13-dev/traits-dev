defaults:
  platforms:
    - windows
  for:
    - pe
    - dll
  attack: T1071
  mbc: B0030
traits:
  - id: managed-remote-stage
    desc: Managed remote stage method
    crit: notable
    conf: 0.9
    if:
      type: text
      word: ApplyRemoteBinary
  - id: managed-register-payload
    desc: Managed registration payload method
    crit: notable
    conf: 0.9
    if:
      type: text
      word: SendRegistrationPayload
  - id: managed-plugin-slot
    desc: Managed plugin slot method
    crit: notable
    conf: 0.9
    if:
      type: text
      word: AssignPluginSlot
  - id: managed-module-channel
    desc: Managed module channel method
    crit: notable
    conf: 0.9
    if:
      type: text
      word: RunModuleChannelAsync
  - id: managed-pulse-channel
    desc: Managed pulse channel method
    crit: notable
    conf: 0.9
    if:
      type: text
      word: RunPulseChannelAsync
  - id: managed-child-channel
    desc: Managed child channel method
    crit: notable
    conf: 0.9
    if:
      type: text
      word: CreateChildChannelAsync
  - id: managed-diagnostics
    desc: Managed diagnostics request method
    crit: notable
    conf: 0.9
    if:
      type: text
      word: HandleDiagnosticsRequest
  - id: managed-task-cleanup
    desc: Managed scheduled-task cleanup method
    crit: notable
    conf: 0.9
    if:
      type: text
      word: ClearScheduledTasksAsync
composite_rules:
  - id: unsigned-encrypted-http-backdoor
    desc: Unsigned .NET remote-control methods with HTTP and AES APIs
    crit: suspicious
    conf: 0.96
    attack: T1071.001,T1027,T1105
    all:
      - id: metadata/binary/framework::dotnet-assembly
      - id: metadata/signed/trust-level::unsigned-missing-signature-record
      - id: micro-behaviors/communications/http/client/managed::dotnet-http-client-with-aes
      - id: micro-behaviors/crypto/decrypt::dotnet-create-decryptor
      - id: micro-behaviors/communications/url/host/domain-http::http-url-binary
      - id: managed-remote-control-method-cluster
  - id: managed-remote-control-method-cluster
    desc: Managed remote-control method cluster
    crit: component
    conf: 0.92
    any:
      - id: managed-remote-stage
      - id: managed-register-payload
      - id: managed-plugin-slot
      - id: managed-module-channel
      - id: managed-pulse-channel
      - id: managed-child-channel
      - id: metadata/binary/symbols/name/token/network::managed-connect-sub-socket-method-name
      - id: managed-diagnostics
      - id: micro-behaviors/os/security/auth/verify::authenticateasync-reference
      - id: managed-task-cleanup
    needs: 2
  - id: managed-encrypted-plugin-c2-backdoor
    desc: Encrypted managed plugin C2 backdoor
    crit: hostile
    conf: 0.98
    attack: T1071,T1059,T1620
    all:
      - id: metadata/binary/framework::dotnet-metadata
      - id: micro-behaviors/communications/socket/tcp::dotnet-tcpclient-stream-references
      - id: managed-remote-control-method-cluster
      - id: micro-behaviors/process/interpreter/runtime/clr::assembly-resolve-event-api
      - id: micro-behaviors/crypto/decrypt::dotnet-create-decryptor
    any:
      - id: metadata/file/profile/execution-api::redirect-standard-output-dotnet
      - id: metadata/file/profile/process/hidden::dotnet-hidden-process-launch-setup
      - id: micro-behaviors/os/privilege/check::is-user-an-admin
    needs: 2
    unless:
      - id: metadata/signed/platform/
  - id: managed-encrypted-tcp-payload-stager
    desc: Unsigned .NET combines encrypted TCP control with executable staging
    crit: hostile
    conf: 0.99
    attack: T1027,T1071,T1105
    all:
      - id: metadata/binary/framework::dotnet-assembly
      - id: metadata/signed/trust-level::unsigned-missing-signature-record
      - id: micro-behaviors/communications/socket/tcp::dotnet-tcpclient-stream-references
      - id: micro-behaviors/crypto/decrypt::dotnet-create-decryptor
      - id: metadata/file/profile/file-write-api::dotnet-writeallbytes-token
      - id: micro-behaviors/fs/path/binary::programdata-executable-path
    unless:
      - id: metadata/signed/platform/
  - id: managed-tcp-desktop-payload-backdoor
    desc: Managed TCP backdoor controls processes and captures the desktop
    crit: hostile
    conf: 0.98
    attack: T1095,T1059,T1105,T1113
    all:
      - id: metadata/binary/framework::dotnet-assembly
      - id: micro-behaviors/communications/socket/tcp::dotnet-tcpclient-stream-references
      - id: metadata/file/profile/screen-capture-api::copyfromscreen-dotnet
      - id: metadata/binary/symbols/name/process::dotnet-processstartinfo-name
      - id: metadata/file/profile/file-write-api::dotnet-writeallbytes-token
      - id: micro-behaviors/os/api-resolution/dynamic::managed-function-pointer-delegate
    unless:
      - id: metadata/signed/platform/
      - id: metadata/signed/developer/
  - id: dotnet-encrypted-remote-control-implant
    desc: .NET remote control with capture, redirected streams and HTTP AES
    crit: suspicious
    conf: 0.97
    attack: T1219,T1071.001,T1113
    mbc: B0025,B0030
    all:
      - id: micro-behaviors/ui/window/automation::dotnet-capture-or-input-apis
      - id: micro-behaviors/communications/http/client/managed::dotnet-http-client-with-aes
      - id: metadata/file/profile/execution-api::redirect-standard-input-dotnet
      - id: metadata/file/profile/execution-api::redirect-standard-output-dotnet
      - id: metadata/file/profile/execution-api::redirect-standard-error-dotnet
    any:
      - id: managed-remote-control-method-cluster
      - id: objectives/command-and-control/backdoor/dispatch/module::rat-transfer-surveillance-handler-cluster
  - id: dotnet-encrypted-service-cloud-backdoor
    desc: Managed service references assembly resolution, AES and S3
    crit: suspicious
    conf: 0.98
    attack: T1027,T1071.001,T1105
    all:
      - id: metadata/binary/framework::dotnet-assembly
      - id: micro-behaviors/process/interpreter/runtime/clr::assembly-resolve-event-api
      - id: micro-behaviors/communications/http/client/managed::dotnet-http-client-with-aes
      - id: micro-behaviors/crypto/decrypt::dotnet-create-decryptor
      - id: micro-behaviors/communications/http/url/cloud::aws-s3-url
      - id: micro-behaviors/fs/path/basename::service-suffix-executable-reference
