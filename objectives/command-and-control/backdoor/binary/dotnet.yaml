# Managed TCP backdoor indicators.
# The individual APIs are dual-use; the composites require a focused
# remote-control method cluster plus encrypted transport and hidden execution.
defaults:
  platforms: [windows]
  for: [pe, dll]
  attack: T1071
  mbc: B0030

traits:
  - id: managed-remote-stage
    desc: Managed remote stage method
    crit: component
    conf: 0.9
    if:
      type: text
      word: ApplyRemoteBinary

  - id: managed-register-payload
    desc: Managed registration payload method
    crit: component
    conf: 0.9
    if:
      type: text
      word: SendRegistrationPayload

  - id: managed-plugin-slot
    desc: Managed plugin slot method
    crit: component
    conf: 0.9
    if:
      type: text
      word: AssignPluginSlot

  - id: managed-module-channel
    desc: Managed module channel method
    crit: component
    conf: 0.9
    if:
      type: text
      word: RunModuleChannelAsync

  - id: managed-pulse-channel
    desc: Managed pulse channel method
    crit: component
    conf: 0.9
    if:
      type: text
      word: RunPulseChannelAsync

  - id: managed-child-channel
    desc: Managed child channel method
    crit: component
    conf: 0.9
    if:
      type: text
      word: CreateChildChannelAsync

  - id: managed-subchannel-connect
    desc: Managed subchannel connection method
    crit: component
    conf: 0.9
    if:
      type: text
      word: ConnectSubSockAsync

  - id: managed-diagnostics
    desc: Managed diagnostics request method
    crit: component
    conf: 0.9
    if:
      type: text
      word: HandleDiagnosticsRequest

  - id: managed-authentication
    desc: Managed authentication method
    crit: component
    conf: 0.9
    if:
      type: text
      word: AuthenticateAsync

  - id: managed-task-cleanup
    desc: Managed scheduled-task cleanup method
    crit: component
    conf: 0.9
    if:
      type: text
      word: ClearScheduledTasksAsync

composite_rules:
  - id: managed-remote-control-method-cluster
    desc: Managed remote-control method cluster
    crit: component
    conf: 0.92
    any:
      - id: managed-remote-stage
      - id: managed-register-payload
      - id: managed-plugin-slot
      - id: managed-module-channel
      - id: managed-pulse-channel
      - id: managed-child-channel
      - id: managed-subchannel-connect
      - id: managed-diagnostics
      - id: managed-authentication
      - id: managed-task-cleanup
    needs: 2

  - id: managed-encrypted-plugin-c2-backdoor
    desc: Encrypted managed plugin C2 backdoor
    crit: hostile
    conf: 0.98
    attack: T1071,T1059,T1620
    all:
      - id: metadata/binary/framework::dotnet-metadata
      - id: micro-behaviors/communications/socket/create::dotnet-tcpclient-channel
      - id: managed-remote-control-method-cluster
      - id: micro-behaviors/data/embedded/payload/resource::assemblyresolve-hook
      - id: micro-behaviors/crypto/symmetric/decrypt::dotnet-create-decryptor
    any:
      - id: micro-behaviors/process/create/spawn::redirect-standard-output-dotnet
      - id: objectives/evasion/process/hidden/execution::dotnet-hidden-process-launch
      - id: micro-behaviors/os/privilege/check::is-user-an-admin
    needs: 2
    unless:
      - id: metadata/signed/platform/

  - id: managed-encrypted-tcp-payload-stager
    desc: Unsigned .NET combines encrypted TCP control with executable staging
    crit: hostile
    conf: 0.99
    attack: T1027,T1071,T1105
    all:
      - id: metadata/binary/framework::dotnet-assembly
      - id: metadata/binary/layout::pe-no-signature-record
      - id: micro-behaviors/communications/socket/create::dotnet-tcpclient-channel
      - id: micro-behaviors/crypto/symmetric/decrypt::dotnet-create-decryptor
      - id: micro-behaviors/fs/write/file/direct::dotnet-writeallbytes-token
      - id: micro-behaviors/fs/path/location::programdata-executable-path
    unless:
      - id: metadata/signed/platform/

  # Screen capture by itself is common in legitimate desktop software, and a
  # TcpClient by itself is ordinary networking. Combining both with arbitrary
  # process creation, byte-for-byte payload staging, and native API delegates
  # is the characteristic control surface of a managed RAT.
  - id: managed-tcp-desktop-payload-backdoor
    desc: Managed TCP backdoor controls processes and captures the desktop
    crit: hostile
    conf: 0.98
    attack: T1095,T1059,T1105,T1113
    all:
      - id: metadata/binary/framework::dotnet-assembly
      - id: micro-behaviors/communications/socket/create::dotnet-tcpclient-channel
      - id: micro-behaviors/hardware/display/screen::copyfromscreen-dotnet
      - id: micro-behaviors/process/create/spawn::process-token-dotnet
      - id: micro-behaviors/fs/write/file/direct::dotnet-writeallbytes-token
      - id: micro-behaviors/os/api-resolution/dynamic::managed-function-pointer-delegate
    unless:
      - id: metadata/signed/platform/
      - id: metadata/signed/developer/
      - id: well-known/app/
      - id: well-known/lib/

  # A managed implant with the three parts of a remote-administration tool and
  # nothing that needs them together: it enumerates video capture devices and
  # synthesises input (it can watch and drive the machine), it runs children
  # with all three standard streams redirected (an interactive shell over the
  # wire rather than a launched program), and its HTTP traffic is wrapped in
  # AES. Any one of those is ordinary; a remote-support product does all three
  # and is signed, which the `unless:` requires.
  #
  # Keyed on the capability set rather than on any family's strings, so the
  # next XWorm/AsyncRAT rebuild reads the same even when every literal changes.
  - id: dotnet-encrypted-remote-control-implant
    desc: .NET implant with capture, shell and AES C2
    crit: hostile
    conf: 0.97
    attack: T1219,T1071.001,T1113
    mbc: B0025,B0030
    all:
      - id: objectives/command-and-control/backdoor/capture::dotnet-surveillance-capture-backdoor
      - id: micro-behaviors/communications/http/client/managed::dotnet-http-client-with-aes
      - id: micro-behaviors/process/create/spawn::redirect-standard-input-dotnet
      - id: micro-behaviors/process/create/spawn::redirect-standard-output-dotnet
      - id: micro-behaviors/process/create/spawn::redirect-standard-error-dotnet
    unless:
      - id: metadata/signed/certificate/identity::pe-signature-verified-kv
      - id: well-known/dual-use/remote-admin/
      - id: well-known/tool/reverse-engineering/

