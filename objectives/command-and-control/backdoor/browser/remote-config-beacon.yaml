# Browser extension code that fetches a hard-coded remote JSON resource.  The
# fetch is useful context for remote-config detections, but is also normal for
# first-party extension services and must not stand alone as a backdoor.
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript, chrome-manifest, crx, archives]
  attack: T1071,T1102

traits:
  - id: extension-hardcoded-remote-json-fetch
    desc: Fetches a hard-coded remote JSON URL
    crit: notable
    conf: 0.92
    for: [javascript, typescript]
    if:
      type: tree-sitter
      kind: call
      regex: '^fetch\s*\(\s*["'']https?://[^"'']{1,200}\.json["'']'
    unless:
      - id: well-known/app/ai/mastra::models-dev-catalog-json-fetch

composite_rules:
  - id: extension-remote-operator-beacon
    desc: Extension beacons to remote JSON operator endpoint
    crit: hostile
    conf: 0.96
    scope: file
    all:
      - id: extension-hardcoded-remote-json-fetch
      - id: micro-behaviors/communications/http/request/client::js-fetch-call
    unless:
      - id: well-known/app/ai/mastra::mastra-core-package
      - id: well-known/app/development/vscode-extension/dscodegpt::extension-auth-context
      - id: well-known/app/development/vscode-extension/dscodegpt::package-member-context
