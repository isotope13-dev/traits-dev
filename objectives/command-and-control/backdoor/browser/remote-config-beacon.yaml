# Browser extensions that phone home to a third-party JSON endpoint on startup,
# often gating malicious behavior behind a remote config flag.
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript, chrome-manifest, crx, archives]
  attack: T1071,T1102

traits:
  - id: extension-remote-json-beacon-fetch
    desc: Fetches remote JSON config on extension startup
    crit: notable
    conf: 0.92
    for: [javascript, typescript]
    if:
      type: text
      regex: 'fetch\s*\(\s*["'']https?://.{0,200}\.json["'']'

composite_rules:
  - id: extension-remote-operator-beacon
    desc: Extension beacons to remote JSON operator endpoint
    crit: hostile
    conf: 0.96
    scope: file
    all:
      - id: extension-remote-json-beacon-fetch
      - id: micro-behaviors/communications/http/request/client::js-fetch-call
