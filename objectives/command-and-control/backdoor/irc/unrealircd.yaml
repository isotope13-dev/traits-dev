defaults:
  for: [lua, shell, text]
  platforms: [windows, unix]
traits:
  - id: unreal-backdoor-trigger
    desc: UnrealIRCd backdoor trigger assignment
    crit: notable
    if:
      type: text
      regex: 'local\s+trigger\s*=\s*["'']AB["'']'
  - id: unreal-backdoor-command-arg
    desc: UnrealIRCd backdoor operator-command argument
    crit: notable
    if:
      type: text
      substr: "get_script_args('irc-unrealircd-backdoor.command')"
  - id: unreal-backdoor-send-command
    desc: Sends constructed command to IRC socket
    crit: notable
    if:
      type: text
      substr: 'socket:send(full_command'
composite_rules:
  - id: unrealircd-triggered-remote-command
    desc: Send operator commands to the UnrealIRCd backdoor
    crit: hostile
    conf: 0.99
    near_lines: 120
    all:
      - id: unreal-backdoor-trigger
      - id: unreal-backdoor-command-arg
      - id: unreal-backdoor-send-command
