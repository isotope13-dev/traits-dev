# Polling endpoints alone do not establish malicious remote control.
# Keep credential-theft admission on the original stealer rule; the shell
# agent rule requires separate tasking, results, and command-handler evidence.
defaults:
  platforms: [windows]
  for: [pe]

traits:
  - id: polling-command-id
    desc: Polling command identifier field
    crit: notable
    if:
      type: text
      exact: command_id

  - id: polling-result-path
    desc: Command result endpoint path
    crit: notable
    if:
      type: text
      regex: '^/results?$'

  - id: polling-command-path
    desc: Command polling endpoint path
    crit: notable
    if:
      type: text
      regex: '^/(poll|commands/pending)$'

  - id: remote-file-upload-action
    desc: Remote file upload action name
    crit: notable
    if:
      type: text
      exact: upload_file

  - id: remote-process-kill-action
    desc: Remote process termination action name
    crit: notable
    if:
      type: text
      exact: kill_process

  - id: remote-webcam-action
    desc: Remote webcam capture action name
    crit: notable
    if:
      type: text
      exact: webcam_capture

composite_rules:
  - id: polling-stealer-remote-control
    desc: Credential stealer polls for file, process and webcam commands
    crit: hostile
    attack: T1071.001,T1105
    all:
      - id: objectives/credential-access/dev-tools/application::multi-app-credential-stealer
      - id: polling-command-id
      - id: polling-result-path
      - id: polling-command-path
      - id: remote-file-upload-action
      - id: remote-process-kill-action
      - id: remote-webcam-action
