# Native Windows agents that use a small heartbeat protocol for remote tasking.
defaults:
  platforms: [windows]
  for: [pe, dll]
  attack: T1071,T1105
  mbc: B0030

traits:
  - id: c2-udp-command-token
    desc: UDP flood command token
    crit: component
    conf: 0.9
    if:
      type: hex
      section: .rdata
      pattern: 21 75 64 70
  - id: c2-standard-command-token
    desc: Standard flood command token
    crit: component
    conf: 0.9
    if:
      type: hex
      section: .rdata
      pattern: 21 73 74 64
  - id: c2-vse-command-token
    desc: VSE flood command token
    crit: component
    conf: 0.9
    if:
      type: hex
      section: .rdata
      pattern: 21 76 73 65
  - id: c2-ntp-command-token
    desc: NTP flood command token
    crit: component
    conf: 0.9
    if:
      type: hex
      section: .rdata
      pattern: 21 6E 74 70
  - id: c2-dns-command-token
    desc: DNS flood command token
    crit: component
    conf: 0.9
    if:
      type: hex
      section: .rdata
      pattern: 21 64 6E 73
  - id: c2-tcp-command-token
    desc: TCP flood command token
    crit: component
    conf: 0.9
    if:
      type: hex
      section: .rdata
      pattern: 21 74 63 70
  - id: c2-xmas-command-token
    desc: XMAS flood command token
    crit: component
    conf: 0.9
    if:
      type: hex
      section: .rdata
      pattern: 21 78 6D 61 73
  - id: c2-http-command-token
    desc: HTTP flood command token
    crit: component
    conf: 0.9
    if:
      type: hex
      section: .rdata
      pattern: 21 68 74 74 70

composite_rules:
  - id: c2-multi-vector-command-set
    desc: Multiple network attack command tokens
    crit: suspicious
    conf: 0.96
    needs: 4
    any:
      - id: c2-udp-command-token
      - id: c2-standard-command-token
      - id: c2-vse-command-token
      - id: c2-ntp-command-token
      - id: c2-dns-command-token
      - id: c2-tcp-command-token
      - id: c2-xmas-command-token
      - id: c2-http-command-token

  - id: windows-native-c2-tasking-agent
    desc: Native Windows agent with C2 tasking over Winsock
    crit: hostile
    conf: 0.99
    all:
      - id: c2-multi-vector-command-set
      - id: micro-behaviors/communications/socket/init::winsock-client-lifecycle
      - id: micro-behaviors/process/create/shell/spawn::system-fn
    unless:
      - id: metadata/signed/platform/
      - id: well-known/tool/sysadmin/
