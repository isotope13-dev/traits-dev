defaults:
  platforms: [windows, unix, android]
  for: [class, java_class, jar, zip]

traits:
  - id: runcmd-task-token
    desc: RAT command-shell task token
    crit: component
    conf: 0.98
    mbc: B0024
    attack: T1059
    if:
      type: hex
      pattern: 52 55 4E 43 4D 44

  - id: getscreenonce-task-token
    desc: RAT one-shot screenshot task token
    crit: component
    conf: 0.98
    mbc: B0022
    attack: T1113
    if:
      type: hex
      pattern: 47 45 54 53 43 52 45 45 4E 4F 4E 43 45

  - id: listprocess-task-token
    desc: RAT process-listing task token
    crit: component
    conf: 0.98
    mbc: B0022
    attack: T1057
    if:
      type: hex
      pattern: 4C 49 53 54 50 52 4F 43 45 53 53

  - id: getfile-task-token
    desc: RAT file-retrieval task token
    crit: component
    conf: 0.98
    mbc: B0022
    attack: T1105
    if:
      type: hex
      pattern: 47 45 54 46 49 4C 45

  - id: takefile-task-token
    desc: RAT file-upload task token
    crit: component
    conf: 0.98
    mbc: B0022
    attack: T1105
    if:
      type: hex
      pattern: 54 41 4B 45 46 49 4C 45

  - id: klog-task-token
    desc: RAT keylogging task token
    crit: component
    conf: 0.98
    mbc: B0022
    attack: T1056.001
    if:
      type: hex
      pattern: 4B 4C 4F 47

composite_rules:
  - id: jvm-operator-task-suite
    desc: JVM RAT dispatcher with execution surveillance and file task verbs
    crit: hostile
    conf: 0.99
    mbc: B0022
    attack: T1219,T1059,T1113,T1057
    all:
      - id: micro-behaviors/process/create/spawn::java-runtime-exec-bytecode-symbol
    needs: 4
    any:
      - id: runcmd-task-token
      - id: getscreenonce-task-token
      - id: listprocess-task-token
      - id: getfile-task-token
      - id: takefile-task-token
      - id: klog-task-token
