# Source-level RAT tasking loop: an unbounded check-in loop that posts to a
# controller and launches shell processes from the same file. Existing
# csharp tasking composites pin specific server/UI shapes; a plain
# beacon-and-exec agent only surfaced as loop, POST, and Process.Start
# capabilities. Shell execution is required so telemetry or update polling
# loops that merely post status do not fire.
defaults:
  platforms: [windows]
  for: [csharp]
  attack: T1219
  mbc: B0022

composite_rules:
  - id: csharp-beacon-shell-tasking-loop
    desc: C# beacon loop posts and launches shell commands
    crit: hostile
    conf: 0.95
    attack: T1219,T1059,T1071.001
    all:
      - id: micro-behaviors/data/control-flow/loop/unconditional::infinite-loop-header
      - id: micro-behaviors/communications/http/post::postasync
      - id: micro-behaviors/process/create/subprocess/launch::dotnet-process-start
    any:
      - id: micro-behaviors/process/argument/visibility::powershell-hidden-command-text
      - id: micro-behaviors/fs/path/application/interpreter::cmd-exe-image-name
      - id: micro-behaviors/time/sleep/interval::csharp-multisecond-task-delay
