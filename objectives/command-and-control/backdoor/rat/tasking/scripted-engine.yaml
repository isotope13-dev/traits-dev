defaults:
  platforms: [windows]
  for: [c, cpp]
  attack: T1053.005,T1071.001,T1113

traits:
  - id: active-task-dsl-declaration
    desc: Active task declaration with async control
    crit: suspicious
    conf: 0.92
    if:
      type: string_literal
      regex: '(?i)\btask\s+[A-Za-z_]\w*\s*\[\s*active\s*=\s*true\s*,\s*async\s*=\s*(true|false)\s*\]'

  - id: delayer-task-handler
    desc: Delayer namespace task handler
    crit: notable
    conf: 0.92
    if:
      type: string_literal
      regex: '(?i)\bdelayer::[A-Za-z_]\w*\s*\('

  - id: autoruns-task-handler
    desc: Autoruns namespace task handler
    crit: notable
    conf: 0.92
    if:
      type: string_literal
      regex: '(?i)\bautoruns?::[A-Za-z_]\w*\s*\('

  - id: communicator-task-handler
    desc: Communicator namespace task handler
    crit: notable
    conf: 0.92
    if:
      type: string_literal
      regex: '(?i)\bcommunicator::[A-Za-z_]\w*\s*\('

  - id: runtime-task-handler
    desc: Runtime namespace task handler
    crit: notable
    conf: 0.92
    if:
      type: string_literal
      regex: '(?i)\bruntime::[A-Za-z_]\w*\s*\('

composite_rules:
  - id: namespaced-task-handler-call
    desc: Multiple namespace-qualified task handlers
    crit: notable
    conf: 0.94
    needs: 2
    any:
      - id: delayer-task-handler
      - id: autoruns-task-handler
      - id: communicator-task-handler
      - id: runtime-task-handler

  - id: scripted-remote-access-task-engine
    desc: Scripted agent with persistence capture and network
    crit: hostile
    conf: 0.99
    all:
      - id: active-task-dsl-declaration
      - id: namespaced-task-handler-call
      - id: micro-behaviors/os/registry/access::registry-set-value-source
      - id: micro-behaviors/hardware/display/native-capture::source-gdi-screen-capture-primitives
      - id: micro-behaviors/communications/http/get::wininet-http-client-src
    near_lines: 140
