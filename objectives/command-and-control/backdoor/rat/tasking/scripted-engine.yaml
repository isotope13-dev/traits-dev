defaults:
  platforms: [windows]
  for: [c, cpp]
  attack: T1053.005,T1071.001,T1113

composite_rules:
  - id: scripted-remote-access-task-engine
    desc: Scripted agent with persistence capture and network
    crit: hostile
    conf: 0.99
    all:
      - id: metadata/lang/source/literal/string::active-task-dsl-declaration
      - id: metadata/file/profile/operation-reference::namespaced-task-handler-text
      - id: micro-behaviors/os/registry/write::registry-set-value-source
      - id: metadata/file/profile/screen-capture-context::source-gdi-screen-capture-primitives
      - id: micro-behaviors/communications/http/client/wininet::wininet-http-client-src
    near_lines: 140
