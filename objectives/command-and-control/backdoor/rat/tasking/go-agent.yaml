# Moved to the canonical RAT mechanism leaf.
defaults:
  platforms: [linux, windows]
  for: [elf, pe]
  attack: T1059,T1090,T1105,T1070.004
  mbc: B0022

composite_rules:
  - id: go-agent-command-set
    desc: Go agent remote-control command set
    crit: hostile
    conf: 0.99
    attack: T1059,T1090,T1543,T1070.004
    all:
      - id: metadata/binary/symbols/name/agent-routine::dispatcher-loop
      - id: metadata/binary/symbols/name/agent-routine::dispatcher-exec-handler
      - id: metadata/binary/symbols/name/agent-routine::dispatcher-persistence-handler
      - id: metadata/binary/symbols/name/agent-routine::dispatcher-proxy-handler
      - id: metadata/binary/symbols/name/agent-routine::dispatcher-self-destruct-handler
