# Shad0w Windows beacon registration, task polling, and payload dispatch.
defaults:
  platforms: [windows]
  for: [source]
  attack: T1071.001,T1059,T1055,T1105

traits:
  - id: shad0w-task-opcode
    desc: Reads the remote task opcode
    crit: suspicious
    conf: 0.97
    if:
      type: text
      regex: 'jRead_int\(ResBuffer.{0,100}task.{0,50}JREAD_NUMBER'

  - id: shad0w-task-arguments
    desc: Reads arguments from beacon response
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: 'jRead\(ResBuffer.{0,100}args.{0,50}result'

  - id: shad0w-base64-decode
    desc: Calls the Base64 decoder
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: '\bbase64_decode\s*\('

  - id: shad0w-execute-or-inject-code
    desc: Calls code execution or injection helper
    crit: suspicious
    conf: 0.97
    if:
      type: text
      regex: '\b(SpawnCode|InjectCode|InjectDLL)\s*\('

  - id: shad0w-file-process-task-helper
    desc: Defines remote file and process task helpers
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: '\b(listdirs|readfile|removefile|makedirectory|changedir|getps)\s*\('

  # shad0w-ignore-certificate-validation relocated to
  # micro-behaviors/communications/tls/verify/disable::ignore-unknown-ca-security-flag.

composite_rules:
  - id: shad0w-http-tasking-code-injection
    desc: HTTP beacon polls tasks and injects decoded code
    crit: hostile
    conf: 0.99
    attack: T1071.001,T1055,T1105
    near_bytes: 12000
    all:
      - id: micro-behaviors/communications/http/client/winhttp::winhttp-request-flow
      - id: shad0w-task-opcode
      - id: shad0w-task-arguments
      - id: shad0w-base64-decode
      - id: shad0w-execute-or-inject-code
    any:
      - id: micro-behaviors/communications/tls/verify/disable::ignore-unknown-ca-security-flag
      - id: shad0w-file-process-task-helper
