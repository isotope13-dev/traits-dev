# Generic command-task envelope used by cross-platform RAT agents.
# These rules detect the protocol shape, not a family name or a fixed C2 IOC.
defaults:
  platforms: [unix, windows]
  for: [scripts, binaries]
  attack: T1059
  mbc: B0022

traits:
  - id: command-task-type
    desc: Structured command task message type
    crit: component
    conf: 0.9
    if:
      type: text
      regex: '["'']t["'']\s*[:=]\s*["'']cmd["'']'

  - id: command-task-field
    desc: Structured command task carries a command field
    crit: component
    conf: 0.85
    if:
      type: text
      regex: '["'']command["'']\s*[:=]'

  - id: shell-task-runner
    desc: Names a shell task runner
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '["''](bash_run|ps_run)["'']'

  - id: interpreter-task-runner
    desc: Names an interpreter task runner
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '["''](python_run|python3_run|powershell_run)["'']'

composite_rules:
  - id: cross-platform-shell-task-runner
    desc: Names a shell or interpreter task runner
    crit: notable
    conf: 0.92
    any:
      - id: shell-task-runner
      - id: interpreter-task-runner

  - id: shell-command-tasking-schema
    desc: Command task envelope dispatches a shell or interpreter runner
    crit: suspicious
    conf: 0.96
    all:
      - id: command-task-type
      - id: command-task-field
      - id: cross-platform-shell-task-runner

  - id: ssh-worm-with-shell-tasking
    desc: SSH-spreading agent exposes structured remote shell tasking
    crit: hostile
    conf: 0.99
    attack: "T1021.004,T1059,T1105"
    all:
      - id: shell-command-tasking-schema
      - id: objectives/lateral-movement/ssh/propagation::scp-payload-destination
      - id: objectives/lateral-movement/ssh/propagation::ssh-chmod-command
      - id: micro-behaviors/fs/chmod/executable/mode::chmod-make-executable
      - id: objectives/lateral-movement/ssh/propagation::detached-payload-launch
      - id: micro-behaviors/communications/ssh/client::strict-host-disable
