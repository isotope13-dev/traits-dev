# Websocket C2 with proxying and a DDoS/RAT flood token.
#
# A websocket client behind a proxy is ordinary application networking. The
# same binary also carrying a flood-attack command token (the `!dns` family
# the native RAT tasking set keys on) is a remotely-tasked agent whose
# channel and whose attack vocabulary ship together.
defaults:
  platforms: [windows]
  for: [pe, dll]
  attack: T1071.001
  crit: hostile
  conf: 0.9

composite_rules:
  - id: websocket-proxy-dns-command-channel
    desc: Websocket C2 with proxying and DNS flood command token
    all:
      - id: micro-behaviors/communications/http/websocket::websocket-upgrade-header
      - id: micro-behaviors/communications/proxy/library::proxy-func
      - id: objectives/command-and-control/backdoor/rat/tasking::c2-dns-command-token
