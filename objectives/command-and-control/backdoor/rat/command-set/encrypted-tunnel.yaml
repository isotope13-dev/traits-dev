defaults:
  platforms: [windows, unix]
  for: [class]
  crit: suspicious
  conf: 0.97
traits:
  - id: socks-terminal-file-transfer-task-set
    desc: SOCKS, terminal and file-transfer task catalog
    if:
      type: yara
      source: |
        rule socks_terminal_file_transfer_task_set {
          strings:
            $proxy = "SOCKS5" ascii
            $terminal = "TERMINAL_COMMAND" ascii
            $read = "FILE_GET_SOCKS" ascii
            $write = "FILE_PUT_SOCKS" ascii
            $update = "UPDATE" ascii
          condition:
            uint32be(0) == 0xcafebabe and all of them
        }
  - id: encrypted-terminal-file-worker-dispatch
    desc: Encrypted terminal/file-worker dispatch names
    if:
      type: yara
      source: |
        rule encrypted_terminal_file_worker_dispatch {
          strings:
            $terminal = "TerminalCommandThread" ascii
            $read = "ReadFileThread" ascii
            $write = "WriteFileThread" ascii
            $decrypt = "decryptData" ascii
            $receive = "recv" ascii
            $type = "getType" ascii
            $submit = "submit" ascii
          condition:
            uint32be(0) == 0xcafebabe and all of them
        }
