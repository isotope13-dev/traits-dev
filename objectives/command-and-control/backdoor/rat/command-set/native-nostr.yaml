defaults:
  for: [elf, macho, pe]
  platforms: [linux, macos, windows]
composite_rules:
  - id: native-nostr-reverse-shell-controller
    desc: Reverse-shell command dispatcher with Nostr profile recovery
    crit: hostile
    conf: 0.99
    attack: T1059,T1102.001
    all:
      - id: micro-behaviors/process/create/shell/native::reverse-shell-started-diagnostic
      - id: micro-behaviors/process/create/shell/native::reverse-shell-stop-diagnostic
      - id: micro-behaviors/data/parse/command::command-type-dispatch-diagnostic
      - id: micro-behaviors/data/config/read::metadata-website-lookup-diagnostic
      - id: micro-behaviors/communications/http/websocket::native-nostr-relay-directory-url
