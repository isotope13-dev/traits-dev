defaults:
  platforms:
  - windows
  for:
  - scripts
  - binaries
  - csharp
  attack: T1105
  mbc: B0030
composite_rules:
- id: windows-rat-credential-stealer
  desc: Windows RAT tasking with credential theft
  crit: hostile
  conf: 0.98
  attack: T1056.001,T1555
  all:
  - id: metadata/lang/source/shape::input-capture-name-context
  - id: objectives/credential-access/theft/multi-app::multi-app-credential-stealer
  any:
  - id: micro-behaviors/data/config/browser-preference::chromium-encrypted-key-metadata
  - id: micro-behaviors/data/db/access::chromium-login-sql
  - id: micro-behaviors/fs/path/token::telegram-session-data-location
  - id: micro-behaviors/communications/http/services/file-hosting::pastebin
  unless:
  - id: well-known/tool/detection/
  - id: well-known/app/
