# Native (C/C++) modular RAT: a plugin loader that drops encrypted DLL modules
# to the temp directory and reflectively invokes them, plus an encrypted C2
# channel that registers the victim with a pipe-delimited host-report record.
# Modeled on Abyssos (Zscaler, 2026) but keyed on the reusable technique shapes,
# not on family strings, so future variants and re-implementations still match.
#
# Each capability is expressed as its own suspicious composite; the hostile
# rules require two capabilities together. Anti-analysis is NOT required — the
# family ships samples with the VM checks stripped, so the loader+C2 pairing
# stands on its own, and the anti-VM pairing is an independent hostile path.
defaults:
  platforms: [windows]
  for: [c, cpp]
  attack: T1105,T1071.001
  mbc: B0030

composite_rules:
  # Drop a DLL to %TEMP% and reflectively load+resolve it: the module-plugin
  # dispatch. GetTempPath + WriteFile stages the module; LoadLibrary +
  # GetProcAddress executes an exported entry point from the dropped file.
  - id: native-modular-temp-plugin-loader
    desc: Drops a DLL to temp and reflectively loads an exported entry point
    crit: suspicious
    conf: 0.92
    attack: T1620,T1129
    all:
      - id: micro-behaviors/fs/temp/directory::get-temp-path-source-call
      - id: micro-behaviors/fs/file/write/direct::write-file-source
      - id: micro-behaviors/dylib/load/source::load-library-a-source
      - id: micro-behaviors/os/module/load::get-proc-address-source-call

  # Encrypted C2 registration: a pipe-delimited victim-registration record,
  # an outbound socket, and a hardcoded 256-bit key buffer for the channel
  # cipher (Abyssos uses AES-GCM with a hardcoded 32-byte key).
  - id: native-encrypted-c2-registration
    desc: Pipe-delimited victim registration over an encrypted socket channel
    crit: suspicious
    conf: 0.92
    all:
      - id: micro-behaviors/data/format/string::pipe-delimited-five-string-format
      - id: micro-behaviors/communications/socket/connect::connect
      - id: micro-behaviors/data/buffer::fixed-thirtytwo-byte-array

  # RAT = reflective module loading + encrypted C2 registration. Two full
  # implant capabilities together; no benign reading.
  - id: native-modular-rat
    desc: Native modular RAT — reflective plugin loader with encrypted C2 registration
    crit: hostile
    conf: 0.97
    all:
      - id: native-modular-temp-plugin-loader
      - id: native-encrypted-c2-registration

  # Same implant capabilities, but gated on VM-evasion instead: an anti-analysis
  # guest-agent/CPUID check paired with either implant capability.
  - id: vm-evading-modular-rat
    desc: VM-evading native RAT with plugin loading or encrypted registration
    crit: hostile
    conf: 0.96
    any:
      - id: objectives/anti-analysis/vm-detect/process::vm-guest-agent-process-blacklist
      - id: objectives/anti-analysis/vm-detect/vendor::hypervisor-cpuid-vendor-cluster
    all:
      - id: native-anti-vm-implant-capability

  - id: native-anti-vm-implant-capability
    desc: Native RAT implant capability (loader or encrypted registration)
    crit: suspicious
    conf: 0.92
    any:
      - id: native-modular-temp-plugin-loader
      - id: native-encrypted-c2-registration
