# Custom encrypted Go agents that combine command execution, file transfer,
# and listener control over a multiplexed QUIC relay.
defaults:
  platforms: [linux, macos, windows]
  for: [elf]
  attack: T1059,T1105,T1090.001
  mbc: B0022,B0024

composite_rules:
  - id: go-encrypted-relay-remote-command
    desc: Encrypted Go relay accepts commands and starts local processes
    crit: hostile
    conf: 0.96
    all:
      - id: metadata/file/profile/relay-implementation::go-encrypted-session-acceptor
      - id: metadata/file/profile/relay-implementation::go-connect-request-packet
      - id: metadata/binary/symbols/name/qualified::go-native-exec-command-reference

  - id: go-encrypted-relay-file-transfer
    desc: Encrypted Go relay implements remote file upload and download
    crit: hostile
    conf: 0.96
    all:
      - id: metadata/file/profile/relay-implementation::go-encrypted-session-acceptor
      - id: metadata/file/profile/relay-implementation::go-connect-request-packet
      - id: metadata/binary/symbols/name/qualified::go-native-exec-command-reference
      - id: metadata/file/profile/relay-implementation::go-upload-request-packet
      - id: metadata/file/profile/relay-implementation::go-download-response-packet

  - id: go-encrypted-relay-listener-control
    desc: Encrypted Go relay exposes remotely controlled listeners
    crit: hostile
    conf: 0.96
    all:
      - id: metadata/file/profile/relay-implementation::go-encrypted-session-acceptor
      - id: metadata/file/profile/relay-implementation::go-connect-request-packet
      - id: metadata/binary/symbols/name/qualified::go-native-exec-command-reference
      - id: metadata/file/profile/relay-implementation::go-quic-relay-constructor
      - id: metadata/file/profile/relay-implementation::go-listener-request-packet
      - id: metadata/file/profile/relay-implementation::go-listener-bind-response-packet
      - id: metadata/file/profile/relay-implementation::go-listener-socket-response-packet
