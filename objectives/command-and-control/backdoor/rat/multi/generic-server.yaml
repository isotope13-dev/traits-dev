defaults:
  platforms: [windows, unix]
  for: [scripts, binaries]
traits:
- id: command-execution
  desc: RAT shell-socket command execution marker
  crit: suspicious
  conf: 0.65
  if:
    type: text
    # Match the protocol marker as its own token.  A substring search also
    # fires on benign Rust completion tables containing "shellsocket".
    word: shellsoc
- id: server-component
  desc: RAT server component
  crit: suspicious
  conf: 0.6
  if:
    type: text
    regex: Trojan[_\s]Server|Server[_\s]1\\.1
composite_rules:
- id: rat-generic
  desc: Remote Access Trojan behavior
  crit: suspicious
  conf: 0.8
  attack: T1219
  mbc: B0022
  all:
  - id: micro-behaviors/communications/socket/listen::socket-listen-api
  - id: command-execution
  downgrade:
    any:
    - id: metadata/package/versioning::pe-version-resource
    - id: well-known/lib/runtime/electron::chromium-network-mojom-marker
- id: rat-server
  desc: Remote Access Trojan server component
  crit: suspicious
  conf: 0.85
  attack: T1219
  mbc: B0022
  all:
  - id: micro-behaviors/communications/socket/listen::socket-listen-api
  - id: server-component
  - id: command-execution
