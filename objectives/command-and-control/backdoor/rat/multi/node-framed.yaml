# A custom-framed TLS remote shell that also accepts direct TCP forwarding and
# internal port-scan tasks is a pivoting RAT.  This combines transport, tasking,
# and discovery behavior without depending on a family name or endpoint.
defaults:
  platforms: [unix, windows, fortios]
  for: [javascript, typescript]
  attack: T1046,T1059.007,T1090.001,T1572,T1573.002
  mbc: B0030

composite_rules:
  - id: node-framed-tls-pivot-rat
    desc: Framed TLS shell forwards and scans targets
    crit: hostile
    conf: 0.995
    near_bytes: 16384
    all:
      - id: objectives/command-and-control/channel/transport::node-framed-tls-command-agent
      - id: objectives/command-and-control/channel/tunnel/proxy::node-direct-forward-command-handler
      - id: objectives/discovery/network/scan/port::node-port-scan-command-handler
      - id: micro-behaviors/communications/socket/connect::net-connect
