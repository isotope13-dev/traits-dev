defaults:
  platforms: [windows, linux, macos]
  for: [elf, macho, pe]
  mbc: B0024
traits:
- id: socket-quick-control
  desc: Socket quick control functions
  crit: suspicious
  conf: 0.9
  if:
    type: text
    regex: socket_quick_(start|stop)
- id: go-system-recon-method-name--getsysteminfo
  desc: Go RAT system information method (getSystemInfo)
  crit: notable
  conf: 0.85
  if:
    type: text
    word: getSystemInfo
- id: go-system-recon-method-name--updatesysteminfo
  desc: Go RAT system information (UpdateSysteminfo)
  crit: notable
  conf: 0.85
  if:
    type: text
    word: UpdateSysteminfo
- id: go-system-recon-method-name--makesysteminfo
  desc: Go RAT system information (makeSystemInfo)
  crit: notable
  conf: 0.85
  if:
    type: text
    word: makeSystemInfo
composite_rules:
- id: go-system-recon-method-name
  desc: Go RAT system information method name
  crit: component
  conf: 0.85
  attack: T1082
  not:
  - substr: github.com/IBM/cloudant-go-sdk/base.getSystemInfo
  - substr: k8s.io/api/core/v1.NodeSystemInfo
  - substr: k8s.io/api/core/v1.(*NodeSystemInfo)
  any:
  - id: go-system-recon-method-name--getsysteminfo
  - id: go-system-recon-method-name--updatesysteminfo
  - id: go-system-recon-method-name--makesysteminfo
- id: go-system-recon
  desc: Go RAT system information gathering
  crit: suspicious
  conf: 0.85
  attack: T1082
  unless:
  - id: well-known/app/infrastructure/terraform-provider/
  all:
  - id: go-system-recon-method-name
  any:
  - id: metadata/lang/compiler/systems::go-binary-comp
  - id: metadata/lang/compiler/systems::go-binary
  - id: metadata/lang/compiler/systems::go-version-string
  - id: metadata/lang/runtime::go-runtime-marker
- id: go-rat-shell-proxy
  desc: Go RAT with shell and SOCKS proxy
  crit: hostile
  conf: 0.98
  attack: T1059.004
  all:
  - id: micro-behaviors/ui/terminal::shell-mode-labels
  - id: micro-behaviors/communications/proxy/tunnel::go-socks-proxy-module
  - id: micro-behaviors/process/create/system::go-os-exec-pclntab
- id: go-rat-full
  desc: Go RAT with full C2 capabilities
  crit: hostile
  conf: 0.98
  attack: T1059.004
  all:
  - id: micro-behaviors/ui/terminal::shell-mode-labels
  - id: micro-behaviors/communications/transfer::go-utils-transfer-helper-call
  - id: go-system-recon
  - id: micro-behaviors/process/create/system::go-os-exec-pclntab
- id: go-rat-antiforensics
  desc: Go RAT with anti-forensics capabilities
  crit: hostile
  conf: 0.98
  attack: T1070
  all:
  - id: micro-behaviors/ui/terminal::shell-mode-labels
  - id: objectives/evasion/indicator-removal/history::go-clean-history
  - id: micro-behaviors/process/create/system::go-os-exec-pclntab
- id: go-rat-timestomp
  desc: Go RAT with timestomping
  crit: hostile
  conf: 0.98
  attack: T1070.006
  all:
  - id: micro-behaviors/ui/terminal::shell-mode-labels
  - id: objectives/evasion/indicator-removal/timestamps::go-timestomp
  - id: micro-behaviors/process/create/system::go-os-exec-pclntab
- id: go-implant-proxy-transfer
  desc: Go implant with proxy and file transfer
  crit: hostile
  conf: 0.95
  mbc: B0030
  attack: T1090.001
  all:
  - id: micro-behaviors/communications/proxy/tunnel::go-socks-proxy-module
  - id: micro-behaviors/communications/transfer::go-utils-transfer-helper-call
  - id: micro-behaviors/process/create/system::go-os-exec-pclntab
- id: go-dir-enum
  desc: Go directory enumeration
  crit: suspicious
  conf: 0.8
  attack: T1083
  all:
  - id: metadata/lang/compiler/systems::go-binary-comp
  any:
  - id: micro-behaviors/fs/directory/readdir::getdirlist-method-name
  - id: micro-behaviors/fs/directory/readdir::listdirectory-method-name
  unless:
    - id: well-known/lib/runtime/managed/dotnet-runtime::framework-reference-assembly-context
    - id: metadata/file/extension/identity::netstandard-dll-basename
