defaults:
  platforms: [windows]
  for: [pe]
composite_rules:
  - id: go-garbled-backdoor-recon
    desc: Garble-obfuscated Go backdoor with process scanning
    crit: hostile
    conf: 0.94
    attack: T1057
    all:
      - id: objectives/anti-static/obfuscation/name-mangling/type-names::obfuscated-go-identifiers
      - id: micro-behaviors/process/enumerate/psapi::enum-processes
    any:
      - id: objectives/anti-static/obfuscation/obfuscator/garble::go-http-capability-garbled
      - id: objectives/anti-static/obfuscation/obfuscator/garble::go-tls-capability-garbled
      - id: objectives/command-and-control/backdoor/dispatch/shell/source::go-http-post-beacon

  - id: garbled-go-aes-tls-network-implant
    desc: Garble-obfuscated Go PE with AES and TLS networking stack
    crit: hostile
    conf: 0.94
    attack: T1027,T1071
    all:
      - id: objectives/anti-static/obfuscation/obfuscator/garble::go-garble-indicators
      - id: objectives/anti-static/obfuscation/name-mangling/type-names::obfuscated-go-identifiers
      - id: micro-behaviors/crypto/symmetric/aes/ctr::go-internal-aes-ctr-string
      - id: micro-behaviors/data/runtime/library::go-runtime-crypto-tls-fragment
