defaults:
  platforms: [linux]
  for: [elf]
  arch: [x86-64]

composite_rules:
  - id: sandbox-gated-go-terminal-control
    desc: Sandbox-aware terminal and screen task implant
    crit: hostile
    conf: 0.97
    attack: T1059.004,T1113,T1497.001
    mbc: B0022
    # The compiled selectors are in the reviewed remote task dispatcher.
    # Neither a shell path, a PTY device, nor Go obfuscation alone admits C2.
    all:
      - id: metadata/lang/compiler/systems::go-binary
      - id: objectives/anti-static/obfuscation/obfuscator/garble::go-garble-indicators
      - id: objectives/anti-analysis/sandbox-detect/artifact/known::threatbook-sandbox-home-reference
      - id: micro-behaviors/data/control-flow/branch::x64-terminal-selector-compare
      - id: micro-behaviors/data/control-flow/branch::x64-screen-selector-compare
      - id: micro-behaviors/process/tty/pty::dev-ptmx
      - id: micro-behaviors/fs/path/application/interpreter::multiple-shell-path-references
