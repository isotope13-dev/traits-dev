# A Go Linux agent that combines QUIC transport, an interactive PTY, anonymous
# executable staging and child-process creation. The combination describes a
# remotely tasked fileless shell; each primitive alone has legitimate uses.
defaults:
  platforms: [linux]
  for: [elf]
  attack: T1059,T1071.001,T1620
  mbc: B0022

composite_rules:
  - id: go-quic-fileless-pty-command-agent
    desc: Go QUIC agent stages commands in memory and opens a PTY
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/communications/socket/quic::quic-go-library-reference
      - id: micro-behaviors/process/tty/pty::go-creack-pty-path
      - id: micro-behaviors/mem/anonymous/create::memfd-create-go
      - id: metadata/binary/symbols/name/qualified/execution::go-native-exec-command-reference
      - id: micro-behaviors/communications/http/server/listener::go-http-server
