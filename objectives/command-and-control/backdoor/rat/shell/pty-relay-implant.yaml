defaults:
  platforms: [linux, macos, windows]
  for: [elf, macho, pe, go]
  attack: T1059,T1071
  mbc: B0022

composite_rules:
  - id: pty-session-or-relay-capability
    desc: PTY session or stream relay capability
    crit: notable
    conf: 0.92
    any:
      - id: micro-behaviors/process/tty/pty/
      - id: micro-behaviors/process/stdio/relay::conn-pty-stream-relay

  - id: remote-pty-multiplex-clue
    desc: Remote PTY relay or session identifier
    crit: notable
    conf: 0.93
    any:
      - id: micro-behaviors/process/stdio/relay::conn-pty-stream-relay
      - id: micro-behaviors/data/serialize/envelope::term-id-envelope-field
      - id: go-interactive-shell-lifecycle

  - id: bof-or-encrypted-endpoint-profile
    desc: BOF loader or encrypted endpoint profile
    crit: suspicious
    conf: 0.95
    any:
      - id: micro-behaviors/process/interpreter/bof::bof-loader-capability
      - id: micro-behaviors/data/serialize/envelope::encrypted-endpoint-profile-schema
  # Any TLS-capable client links both a socket dial and AES/ChaCha (every Go
  # net/http binary does); the C2 reading needs the PTY and implant legs of
  # encrypted-pty-surveillance-implant, so this co-occurrence is a component.
  - id: socket-and-symmetric-cipher-clue
    desc: Outbound socket and symmetric cipher co-occur
    crit: component
    conf: 0.92
    all:
      - id: micro-behaviors/communications/socket/endpoint::outbound-socket-dial-or-connect
      - id: micro-behaviors/crypto/cipher/reference::aes-or-chacha-capability

  - id: remote-pty-bof-or-c2-profile
    desc: Remote PTY relay combined with a BOF loader or encrypted endpoint profile
    crit: hostile
    conf: 0.98
    scope: leaf
    all:
      - id: pty-session-or-relay-capability
      - id: remote-pty-multiplex-clue
      - id: bof-or-encrypted-endpoint-profile
      - id: socket-and-symmetric-cipher-clue
    any:
      - id: micro-behaviors/communications/socket/dial::net-dial-text
      - id: micro-behaviors/communications/socket/connect/
      - id: micro-behaviors/communications/http/websocket::websocket-headers

  # A hard-coded external HTTP endpoint and POST token are common in clients.
  # Pairing them with a native PTY and SOCKS5h support identifies a remote
  # command-and-proxy implant rather than an ordinary HTTP application.
  - id: native-http-pty-socks-implant
    desc: HTTP implant combines remote PTY and SOCKS proxy
    crit: hostile
    conf: 0.98
    platforms: [macos]
    for: [macho]
    scope: leaf
    all:
      - id: micro-behaviors/communications/ip/literal::http-ip-url-text
      - id: micro-behaviors/communications/http/request/reference::native-post-method-token
      - id: micro-behaviors/process/tty/pty::openpty
      - id: micro-behaviors/communications/proxy/socks/reference::socks5h-proto
