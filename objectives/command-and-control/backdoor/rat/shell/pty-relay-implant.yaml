defaults:
  platforms: [linux, macos, windows]
  for: [elf, macho, pe, go]
  attack: T1059,T1071,T1573
  mbc: B0022

composite_rules:
  - id: pty-session-or-relay-capability
    desc: PTY session or stream relay capability
    crit: notable
    conf: 0.92
    any:
      - id: micro-behaviors/process/tty/pty/
      - id: micro-behaviors/process/stdio/relay::conn-pty-stream-relay

  - id: remote-pty-multiplex-clue
    desc: Remote PTY relay or session identifier
    crit: notable
    conf: 0.93
    any:
      - id: micro-behaviors/process/stdio/relay::conn-pty-stream-relay
      - id: micro-behaviors/data/serialize/envelope::term-id-envelope-field
      - id: go-interactive-shell-lifecycle

  - id: symmetric-socket-c2-clue
    desc: Outbound socket paired with symmetric cipher
    crit: notable
    conf: 0.92
    all:
      - id: outbound-socket-dial-clue
      - id: symmetric-cipher-clue

  - id: outbound-socket-dial-clue
    desc: Outbound network dial or socket connect
    crit: component
    conf: 0.9
    any:
      - id: micro-behaviors/communications/socket/dial::net-dial-text
      - id: micro-behaviors/communications/socket/connect/

  - id: symmetric-cipher-clue
    desc: AES or ChaCha20 symmetric cipher capability
    crit: component
    conf: 0.9
    any:
      - id: micro-behaviors/crypto/symmetric/aes/
      - id: micro-behaviors/crypto/symmetric/stream/chacha/

  - id: covert-implant-surveillance-or-bof
    desc: Screenshot capture, BOF or C2 profile
    crit: suspicious
    conf: 0.95
    any:
      - id: micro-behaviors/hardware/display/screenshot/reference::screenshot-library
      - id: micro-behaviors/process/interpreter/bof::bof-loader-capability
      - id: micro-behaviors/data/serialize/envelope::encrypted-endpoint-profile-schema

  - id: encrypted-pty-surveillance-implant
    desc: Implant relays PTY shell over encrypted C2
    crit: hostile
    conf: 0.98
    scope: leaf
    all:
      - id: pty-session-or-relay-capability
      - id: remote-pty-multiplex-clue
      - id: symmetric-socket-c2-clue
      - id: covert-implant-surveillance-or-bof
