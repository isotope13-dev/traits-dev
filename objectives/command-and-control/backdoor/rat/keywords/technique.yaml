# RAT / stealer technique-name keywords. Generic across malware families (many
# RATs implement HVNC), so they live here as neutral malware-vocabulary keywords
# rather than under a single family directory; family composites gate on them.
defaults:
  platforms: [windows, unix]
  for: [scripts, source]
  crit: component
  conf: 0.4
traits:
  - id: hvnc-term
    desc: '"hvnc" (Hidden VNC) technique keyword'
    if:
      type: text
      substr: hvnc
  - id: reflective-term
    crit: notable
    desc: '"reflective" loading technique keyword'
    for: [binaries]
    if:
      type: text
      word: reflective
      case_insensitive: true
      section: .text
  # In a managed assembly .text holds the metadata string heap, not code, so
  # every workflow or ORM "persistence" type name matched there.
  - id: persistence-term
    crit: notable
    desc: '"persistence" word in native code section'
    for: [binaries]
    if:
      type: text
      word: persistence
      section: .text
    unless:
      - id: metadata/binary/framework::dotnet-assembly
  - id: autorun-term
    crit: notable
    desc: '"autorun" technique keyword (binary .text)'
    for: [binaries]
    if:
      type: text
      word: autorun
      section: .text
