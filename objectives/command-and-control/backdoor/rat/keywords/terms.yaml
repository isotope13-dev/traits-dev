---
defaults:
  platforms:
  - windows
  - unix
  crit: component
  conf: 0.2
  for:
  - binaries
  - scripts
  - source
traits:
- id: file-browser-word
  crit: notable
  desc: '"file_browser" feature word'
  if:
    type: text
    substr: file_browser
  unless:
    - id: well-known/tool/detection/malcontent::malcontent-defensive-scanner-context
- id: keylogger-word
  desc: '"keylogger" feature word'
  if:
    type: text
    substr: keylogger
