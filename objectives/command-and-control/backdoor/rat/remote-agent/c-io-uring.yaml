defaults:
  platforms: [linux]
  for: [c, cpp, elf]
  attack: "T1095,T1105"

composite_rules:
  - id: io-uring-command-agent
    desc: io_uring remote command and file agent
    crit: hostile
    conf: 0.99
    all:
      - id: micro-behaviors/communications/async-io::io-uring-socket-operations
      - id: micro-behaviors/process/create/command-handler::cmd-get-identifier
      - id: micro-behaviors/process/create/command-handler::cmd-recv-identifier
      - id: micro-behaviors/process/create/command-handler::cmd-users-identifier
      - id: micro-behaviors/process/create/command-handler::cmd-selfdestruct-identifier
