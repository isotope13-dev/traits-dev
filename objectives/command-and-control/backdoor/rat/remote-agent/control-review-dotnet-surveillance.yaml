defaults:
  platforms:
  - windows
  for:
  - pe

composite_rules:
  - id: dotnet-socket-tasked-screen-capture-camera-inventory
    desc: Socket tasking, screen capture, camera inventory
    crit: hostile
    conf: 0.9
    attack: T1113,T1120,T1057
    all:
      - id: micro-behaviors/communications/socket/receive::dotnet-begin-receive-method-token
      - id: metadata/file/profile/screen-capture-context::dotnet-copyfromscreen-capture
      - id: micro-behaviors/hardware/input/video::avicap32-device-enum
      - id: micro-behaviors/process/enumerate/managed::dotnet-process-enumeration-member
  - id: dotnet-socket-tasked-hidden-command-execution
    desc: .NET socket tasking dispatches hidden child process commands
    crit: hostile
    conf: 0.9
    attack: T1059,T1564.003
    all:
      - id: micro-behaviors/communications/socket/receive::dotnet-begin-receive-method-token
      - id: metadata/file/profile/process::dotnet-hidden-process-launch-setup
      - id: metadata/file/profile/process::dotnet-process-start-split-tokens
      - id: micro-behaviors/metaprogramming/reflection/inspect/class::dotnet-entrypoint-launch-members
  - id: dotnet-socket-tasked-plugin-download-execution
    desc: .NET socket tasking combines plugin dispatch with downloaded process launch
    crit: hostile
    conf: 0.9
    attack: T1105,T1620
    all:
      - id: micro-behaviors/communications/socket/receive::dotnet-begin-receive-method-token
      - id: micro-behaviors/communications/http/client/managed::dotnet-downloadfile-token
      - id: metadata/file/profile/staging::dotnet-download-temp-process-references
      - id: micro-behaviors/metaprogramming/reflection/inspect/class::dotnet-load-instance-dispatch-members
