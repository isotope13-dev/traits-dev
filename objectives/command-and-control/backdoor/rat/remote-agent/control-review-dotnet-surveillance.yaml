defaults:
  platforms:
  - windows
  for:
  - pe

composite_rules:
  - id: dotnet-socket-tasked-screen-capture-camera-inventory
    desc: Socket tasking, screen capture, camera inventory
    crit: hostile
    conf: 0.9
    attack: T1113,T1120,T1057
    all:
      - id: micro-behaviors/communications/socket/receive::dotnet-begin-receive-method-token
      - id: micro-behaviors/hardware/display/screenshot/unspecified::dotnet-copyfromscreen-capture
      - id: micro-behaviors/hardware/input/video::avicap32-device-enum
      - id: micro-behaviors/process/enumerate/managed::dotnet-process-enumeration-member
  - id: dotnet-socket-tasked-hidden-command-execution
    desc: Socket-driven shell with console-window configuration references
    crit: hostile
    conf: 0.9
    attack: T1059
    all:
      # Networking, a plugin loader and console settings also occur in benign
      # managed applications. Require independent shell-task evidence; option
      # names alone do not prove that a child window was actually hidden.
      - id: objectives/command-and-control/backdoor/dispatch/shell/interactive::managed-tasked-redirected-shell
      - id: micro-behaviors/communications/socket/receive::dotnet-begin-receive-method-token
      - id: micro-behaviors/process/config/window::dotnet-console-launch-config-references
      - id: metadata/file/profile/process/creation-api::dotnet-start-name-config-references
      - id: micro-behaviors/metaprogramming/reflection/inspect/class/inspection::dotnet-entrypoint-launch-members
  - id: dotnet-socket-tasked-plugin-download-execution
    desc: .NET socket tasking combines plugin dispatch with downloaded process launch
    crit: hostile
    conf: 0.9
    attack: T1105,T1620
    all:
      - id: micro-behaviors/communications/socket/receive::dotnet-begin-receive-method-token
      - id: micro-behaviors/communications/http/client/managed::dotnet-downloadfile-token
      - id: micro-behaviors/process/deploy/file-exec/spawn::dotnet-download-temp-process-references
      - id: micro-behaviors/metaprogramming/reflection/inspect/class/invocation::dotnet-load-instance-dispatch-members
