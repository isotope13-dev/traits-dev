defaults:
  platforms: [android]
  for: [java, kotlin]

composite_rules:
  - id: android-accessibility-websocket-overlay-rat
    desc: Android accessibility service runs WebSocket C2 and injects WebView overlays
    crit: hostile
    conf: 0.99
    attack: T1417.002,T1628.001,T1071.001
    all:
      - id: micro-behaviors/hardware/input/accessibility::android-accessibility-service-source
      - id: micro-behaviors/os/package-manager/config::android-component-disable
      - id: micro-behaviors/ui/window/overlay::android-source-fullscreen-overlay-window
      - id: metadata/import/library::source-webview-import
      - id: micro-behaviors/communications/websocket/client::android-source-okhttp-websocket-client
      - id: micro-behaviors/communications/websocket/receive::okhttp-message-handler-source

  - id: android-accessibility-websocket-socks5-rat
    desc: Android accessibility service runs WebSocket C2, SOCKS5 relay, and gestures
    crit: hostile
    conf: 0.99
    attack: T1090,T1071.001
    all:
      - id: micro-behaviors/hardware/input/accessibility::android-accessibility-service-source
      - id: micro-behaviors/communications/websocket/client::android-source-okhttp-websocket-client
      - id: micro-behaviors/communications/proxy/socks/relay::socks5-stream-relay
    any:
      - id: micro-behaviors/hardware/input/accessibility::android-accessibility-back-navigation
      - id: micro-behaviors/hardware/input/accessibility::android-accessibility-gesture-dispatch
