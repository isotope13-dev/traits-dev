# Unlike standalone testing-tool references, this combines native screen and
# touch tooling with privileged writes that enable an Accessibility service.
# Retain suspicious: device-management and testing agents can share this design.
defaults:
  platforms: [android]
  for: [source, binaries]
composite_rules:
  - id: android-native-control-accessibility-enable
    desc: Shell screen/touch tooling accompanies Accessibility enable commands
    crit: suspicious
    conf: 0.97
    attack: T1113,T1548
    all:
      - id: micro-behaviors/hardware/display/screenshot::android-staged-minicap-path
      - id: micro-behaviors/hardware/input/device::android-staged-minitouch-path
      - id: micro-behaviors/os/privilege/elevation::android-accessibility-settings-command-enable
