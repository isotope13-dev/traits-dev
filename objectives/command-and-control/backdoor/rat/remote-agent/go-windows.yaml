# Moved to the canonical RAT mechanism leaf.
defaults:
  platforms: [windows]
  for: [go]
composite_rules:
  - id: go-windows-rat-capabilities
    desc: Go binary with multiple Windows RAT capabilities
    crit: hostile
    conf: 0.95
    all:
      - id: metadata/lang/source/naming/security::go-av-process-name-set
      - id: micro-behaviors/os/privilege/check::physical-drive-admin-probe
    any:
      - id: objectives/impact/degrade/system/network::go-netsh-wifi-disable
      - id: micro-behaviors/os/user/create::go-net-user-add
      - id: micro-behaviors/os/autorun/task-registration::schtasks-create-cmd
