# Linux Go remote-access agents that combine shell command execution,
# evasion/obfuscation, and network C2/proxying capabilities.
defaults:
  platforms: [linux]
  for: [elf]
  attack: T1059.004,T1071.001,T1090
  mbc: B0030

composite_rules:
  - id: go-linux-obfuscated-rat-agent
    desc: Obfuscated Go Linux RAT agent with shell execution and proxying
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/fs/path/application/interpreter::go-bin-sh-binary-reference
      - id: objectives/anti-static/obfuscation/obfuscator/garble::garble-random-packages
    any:
      - id: micro-behaviors/communications/proxy/socks/unspecified::socks5h-proto
      - id: micro-behaviors/communications/proxy/library::proxy-func
      - id: micro-behaviors/os/application/target/utility::busybox-name-reference
    needs: 1
