defaults:
  for: [pe]
  platforms: [windows]
  attack: T1071.001,T1113

composite_rules:
  - id: dotnet-ssl-rat-capabilities
    desc: .NET binary with SslStream C2, screen capture, and AppDomain.Load
    crit: hostile
    conf: 0.95
    mbc: B0022
    scope: file
    all:
      - id: micro-behaviors/communications/tls/initialize::dotnet-sslstream-type
      - id: micro-behaviors/hardware/display/screenshot/reference::copyfromscreen-dotnet
      - id: micro-behaviors/process/interpreter/runtime/clr::managed-assembly-load-api
