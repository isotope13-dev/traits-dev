defaults:
  for: [pe]
  platforms: [windows]
  attack: T1071.001,T1113

composite_rules:
  - id: dotnet-ssl-rat-capabilities
    desc: .NET binary with SslStream C2, screen capture, and AppDomain.Load
    crit: hostile
    conf: 0.95
    mbc: B0022
    scope: file
    all:
      - id: micro-behaviors/communications/socket
      - id: micro-behaviors/communications/tls
      - id: micro-behaviors/hardware/display
      - id: micro-behaviors/metaprogramming/reflection
