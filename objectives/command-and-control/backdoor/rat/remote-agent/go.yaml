# Garble-obfuscated Go agents that expose remote command execution through a
# pinned network endpoint.  The component traits remain reusable; the hostile
# conclusion requires the endpoint, obfuscation, process pipes, and collected
# command output in the same PE.
defaults:
  platforms: [windows]
  for: [pe]
  attack: "T1059.003,T1071.001"

composite_rules:
  - id: go-obfuscated-command-agent
    desc: Garble-obfuscated Go C2 command agent
    crit: hostile
    conf: 0.98
    scope: leaf
    all:
      - id: micro-behaviors/communications/http/url/external-ip::url-external-ip-port-binary
      - id: objectives/anti-static/obfuscation/obfuscator/garble::garble-random-packages
      - id: micro-behaviors/process/create/shell/lang::stdin-pipe
      - id: micro-behaviors/process/create/shell/lang::stdout-pipe
      - id: micro-behaviors/process/create/direct::go-binary-combined-output-text
      - id: micro-behaviors/communications/proxy/library::proxy-func
