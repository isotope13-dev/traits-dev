# Python remote-management agents with an HTTP command queue.
defaults:
  platforms: [unix, windows]
  for: [python, pyc]
  attack: T1071.001

traits:
  - id: python-agent-command-queue-endpoint
    desc: Python agent command queue endpoint
    crit: notable
    conf: 0.96
    if:
      type: text
      substr: /api/command-queue

composite_rules:
  # The socket-to-shell command channel itself lives in
  # objectives/command-and-control/backdoor/shell/socket::python-socket-shell-command-channel;
  # reference it rather than redefining the same five legs here.
  - id: python-agent-shell-command-channel
    desc: Shell=True agent command channel
    crit: notable
    conf: 0.98
    for: [python]
    near_bytes: 12000
    all:
      - id: metadata/lang/source/naming/action/process::python-execute-command-function
      - id: micro-behaviors/process/create/shell/command-string::python-subprocess-shell-true
    any:
      - id: python-agent-command-queue-endpoint
      - id: micro-behaviors/data/string/search::exec-colon-prefix-check

  - id: python-remote-agent-shell-channel
    for: [python, pyc, tar]
    desc: Python HTTP agent remote shell channel
    crit: hostile
    conf: 0.99
    scope: archive
    unless:
      - id: well-known/app/system/remotepower::documented-rmm-release-context
    attack: "T1059.004,T1071.001"
    all:
      - id: micro-behaviors/communications/http/url/api-path/telemetry::http-api-heartbeat-path
      - id: python-agent-command-queue-endpoint
      - id: micro-behaviors/data/string/search::exec-colon-prefix-check
      - id: python-agent-shell-command-channel
    any:
      - id: micro-behaviors/os/service/control::systemctl-enable-command
      - id: micro-behaviors/os/service/config::systemd-etc-unit-path

  - id: python-websocket-client-channel
    desc: Python WebSocket client communication channel
    crit: notable
    conf: 0.92
    any:
      - id: micro-behaviors/communications/websocket/library::python-websockets-client
      - id: micro-behaviors/communications/websocket/library::python-websockets-compat-client
      - id: micro-behaviors/communications/websocket/library::python-websocket-client
      - id: micro-behaviors/communications/websocket/library::python-websocket-class-client

  - id: python-aes-gcm-cipher-use
    desc: Python AES-GCM authenticated encryption usage
    crit: notable
    conf: 0.92
    any:
      - id: micro-behaviors/crypto/cipher/mode::aead-mode-keyword--mode-gcm
      - id: micro-behaviors/crypto/symmetric/aes/reference::aesgcm-name-reference

  - id: python-hidden-subprocess-execution
    desc: Python runs subprocess with hidden console window
    crit: notable
    conf: 0.92
    for: [python]
    all:
      - id: micro-behaviors/process/create/subprocess/launch::run-ast
      - id: micro-behaviors/process/config/launch::python-create-no-window-use

  - id: python-encrypted-websocket-rat
    desc: Python AES-GCM WebSocket RAT with hidden shell and remote control
    crit: hostile
    conf: 0.98
    for: [python]
    attack: T1071.001,T1573.001,T1059
    mbc: B0030
    all:
      - id: python-websocket-client-channel
      - id: python-aes-gcm-cipher-use
      - id: python-hidden-subprocess-execution
    any:
      - id: micro-behaviors/process/tty/pty::openpty-call
      - id: micro-behaviors/process/interpreter/eval/constructed::exec-compiled-code
      - id: micro-behaviors/hardware/display/screenshot/display::mss-screenshot
      - id: micro-behaviors/ui/graphics/draw::gdi-bitblt-source
      - id: micro-behaviors/communications/socket/send/message::python-sendall
      - id: micro-behaviors/process/enumerate/psutil::psutil-process-iter-call
    needs: 2
