# SMS reporting, remote command dispatch, and native anti-tool probes in one
# DEX. Each leg is ordinary on its own (SMS gateways report SMS and accept
# commands), but an app that hides its probes in native code and checks for
# instrumentation has no legitimate reason to combine them.
defaults:
  platforms: [android]
  for: [dex]

composite_rules:
  - id: android-dex-sms-native-tool-check-rat
    desc: DEX reports SMS, takes commands, and checks native tools
    crit: hostile
    conf: 0.95
    attack: T1636.004,T1497.001
    scope: file
    all:
      - id: objectives/collection/messaging/sms::android-dex-sms-http-report
      - id: objectives/command-and-control/channel/messaging::android-dex-command-executor
      - id: objectives/anti-analysis/tool-detect/process::android-dex-native-tool-check
