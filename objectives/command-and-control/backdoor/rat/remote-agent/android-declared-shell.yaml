# Manifest evidence survives encrypted/missing DEX. Report configured components,
# not successful execution, collection, or contact with a command server.
defaults:
  platforms: [android]
  for: [apk]
composite_rules:
  - id: android-declared-shell-surveillance
    desc: Android package declares reverse-shell and surveillance payload components
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/os/service/daemon::android-reverse-shell-service-declaration
      - id: micro-behaviors/data/stream/record::android-shell-video-recorder-declaration
      - id: micro-behaviors/data/stream/record::android-shell-audio-manager-declaration
      - id: metadata/permission/network::android-internet-apk-request
