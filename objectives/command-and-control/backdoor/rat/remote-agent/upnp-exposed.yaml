defaults:
  platforms:
  - windows
  for:
  - pe
  - dll
  attack: T1219,T1113,T1090
  mbc: B0022
composite_rules:
- id: upnp-exposed-remote-control-server
  desc: NAT-forwarded screen and input control server
  crit: hostile
  conf: 0.95
  all:
  - id: micro-behaviors/communications/http/request/upnp::internet-gateway-port-mapping
  - id: micro-behaviors/communications/socket/multiplex::winsock-event-loop
  - id: micro-behaviors/hardware/display/screenshot::gdi-screen-capture-primitives
  - id: micro-behaviors/hardware/input/synthesize::sendinput-api-name
  unless:
  - id: metadata/signed/platform/
  - id: metadata/signed/developer/
  - id: well-known/app
  - id: well-known/lib
  - id: well-known/tool
  - id: well-known/dual-use/remote-admin/
