# Garble-obfuscated Go executables shipped inside Android packages as lib*.so
# and driven over JSON: struct tags name accessibility-node selectors (text,
# resourceId, className, contentDesc) next to a command envelope, so a remote
# operator can click UI elements by selector. Garble hides every Go identifier;
# the JSON tags survive because they are runtime data.
defaults:
  platforms: [android]
  for: [elf]
  attack: T1417,T1513,T1629
  mbc: B0030

traits:
  - id: go-json-tag-content-desc
    desc: Go struct tag names contentDesc node selector
    crit: notable
    conf: 0.85
    if:
      type: text
      exact: 'json:"contentDesc"'

  - id: go-json-tag-resource-id
    desc: Go struct tag names resourceId node selector
    crit: notable
    conf: 0.85
    if:
      type: text
      exact: 'json:"resourceId"'

  - id: go-json-tag-command
    desc: Go struct tag names a command field
    crit: notable
    conf: 0.8
    if:
      type: text
      exact: 'json:"command"'

composite_rules:
  - id: garbled-go-android-ui-control-agent
    desc: Garbled Go agent with Android UI-node selector and command tags
    crit: hostile
    conf: 0.93
    all:
      - id: objectives/anti-static/obfuscation/obfuscator/garble
      - id: go-json-tag-content-desc
      - id: go-json-tag-resource-id
      - id: go-json-tag-command
