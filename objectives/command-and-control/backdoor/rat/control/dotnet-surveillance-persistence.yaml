# A .NET program that captures the screen, polls the keyboard, records the
# microphone through MCI, and also registers a Run key and switches the
# firewall off is a remote-access trojan: each capability is a feature of a
# RAT builder, and the autostart and firewall change keep it reachable.
defaults:
  platforms: [windows]
  for: [pe]
composite_rules:
  - id: dotnet-capture-suite-with-run-key-and-firewall-off
    desc: .NET capture suite with Run key and firewall off
    crit: hostile
    conf: 0.88
    attack: T1113,T1056.001,T1123,T1547.001,T1562.004
    all:
      - id: micro-behaviors/hardware/display/screenshot::dotnet-copyfromscreen-capture
      - id: micro-behaviors/hardware/input/keyboard/poll::get-async-key-state-str
      - id: micro-behaviors/hardware/input/audio::mci-recsound-record
      - id: micro-behaviors/os/registry/keys/autostart::currentversion-run-key-path
      - id: objectives/impact/degrade/firewall::netsh-firewall-set-opmode-disable
    unless:
      - id: metadata/signed/platform/
  # The avicap leg proves device enumeration, not camera recording.
  - id: dotnet-socket-tasked-screen-capture-camera-inventory
    desc: Socket tasking, screen capture, camera inventory
    crit: hostile
    conf: 0.9
    attack: T1113,T1120,T1057
    all:
      - id: micro-behaviors/communications/socket/receive::dotnet-begin-receive-method-token
      - id: micro-behaviors/hardware/display/screenshot::dotnet-copyfromscreen-capture
      - id: micro-behaviors/hardware/input/video::avicap32-device-enum
      - id: micro-behaviors/process/enumerate/managed::dotnet-process-enumeration-member
  - id: dotnet-socket-tasked-hidden-command-execution
    desc: .NET socket tasking dispatches hidden child process commands
    crit: hostile
    conf: 0.9
    attack: T1059,T1564.003
    all:
      - id: micro-behaviors/communications/socket/receive::dotnet-begin-receive-method-token
      - id: micro-behaviors/process/create/hidden::dotnet-hidden-process-launch-setup
      - id: micro-behaviors/process/create/subprocess::dotnet-process-start-split-tokens
      - id: micro-behaviors/metaprogramming/reflection/inspect/class::dotnet-entrypoint-launch-members
  - id: dotnet-socket-tasked-plugin-download-execution
    desc: .NET socket tasking combines plugin dispatch with downloaded process launch
    crit: hostile
    conf: 0.9
    attack: T1105,T1620
    all:
      - id: micro-behaviors/communications/socket/receive::dotnet-begin-receive-method-token
      - id: micro-behaviors/communications/http/client/managed::dotnet-downloadfile-token
      - id: micro-behaviors/process/create/spawn::dotnet-download-temp-process-references
      - id: micro-behaviors/metaprogramming/reflection/inspect/class::dotnet-load-instance-dispatch-members
