defaults:
  platforms: [android]
  for: [apk, zip]

composite_rules:
  - id: android-a11y-settings-socket-rat
    desc: RAT prompts accessibility then opens a socket
    crit: hostile
    conf: 0.93
    scope: outer
    for: [android_apk, zip, dex]
    unless:
      - id: well-known/dual-use/remote-admin/rustdesk::rustdesk-android-package
    all:
      - id: micro-behaviors/hardware/input/accessibility::android-accessibility-service-class
      - id: micro-behaviors/hardware/input/accessibility::android-accessibility-settings-intent
      - id: micro-behaviors/communications/socket/create::java-socket-bytecode-reference
  - id: android-a11y-boot-socket-rat
    desc: Accessibility implant sockets after reboot
    crit: hostile
    conf: 0.95
    scope: outer
    for: [android_apk, zip, dex]
    unless:
      - id: well-known/dual-use/remote-admin/rustdesk::rustdesk-android-package
    all:
      - id: micro-behaviors/hardware/input/accessibility::android-accessibility-service-class
      - id: micro-behaviors/os/service/daemon::android-boot-completed-action
      - id: micro-behaviors/communications/socket/create::java-socket-bytecode-reference
  - id: android-a11y-hidden-socket-rat
    desc: Hidden accessibility implant opens a socket
    crit: hostile
    conf: 0.95
    scope: outer
    for: [android_apk, zip, dex]
    unless:
      - id: well-known/dual-use/remote-admin/rustdesk::rustdesk-android-package
    all:
      - id: micro-behaviors/hardware/input/accessibility::android-accessibility-service-class
      - id: objectives/evasion/process/hidden/launcher::android-set-component-enabled-setting-reference
      - id: micro-behaviors/communications/socket/create::java-socket-bytecode-reference
  - id: android-a11y-overlay-socket-rat
    desc: Overlay accessibility implant opens a socket
    crit: hostile
    conf: 0.95
    scope: outer
    for: [android_apk, zip, dex, xml]
    unless:
      - id: well-known/dual-use/remote-admin/rustdesk::rustdesk-android-package
    all:
      - id: micro-behaviors/hardware/input/accessibility::android-accessibility-service-class
      - id: micro-behaviors/os/privilege/manifest::system-alert-window-binary-manifest
      - id: micro-behaviors/communications/socket/create::java-socket-bytecode-reference
