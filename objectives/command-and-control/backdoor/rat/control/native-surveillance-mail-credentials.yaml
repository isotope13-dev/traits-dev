# Remote-desktop tools poll keys, capture the screen and inject input, so those
# three legs alone describe admin software.  A native image that also reads the
# Outlook MAPI profile keys, where mail account passwords are kept, is
# collecting credentials while it watches and drives the desktop.
defaults:
  platforms: [windows]
  for: [pe, dll]
  attack: T1219,T1056.001,T1113,T1555

composite_rules:
  - id: native-surveillance-rat-with-mail-credentials
    desc: Native RAT with input capture and mail keys
    crit: hostile
    conf: 0.93
    all:
      - id: micro-behaviors/hardware/input/keyboard/poll::get-keyboard-state
      - id: micro-behaviors/hardware/display/screenshot::gdi-screen-capture-primitives
      - id: micro-behaviors/hardware/input/event::synthetic-user-input
      - id: micro-behaviors/os/registry/keys/credential::outlook-profile-registry-key
    unless:
      - id: metadata/signed/platform/
      - id: well-known/dual-use/
