# JavaScript RAT backdoor control channels: a socket/TLS C2 session framing
# every tasking packet with a sequence-size header that carries the
# per-message key material inline, decrypted taskings executed locally.
# The AtlasRAT Node variant shape; the verdict rests on the framed channel
# plus remote execution, not the check-in constant.
defaults:
  platforms: [windows, unix]
  for: [javascript]
  attack: T1219
composite_rules:
  - id: xor-framed-remote-exec-backdoor
    desc: Key-framed C2 channel with remote command execution
    crit: hostile
    conf: 0.94
    all:
      - id: micro-behaviors/communications/socket/connect/tcp::net-connect
      - id: micro-behaviors/communications/socket/connect/attempt::node-tls-connect
      - id: micro-behaviors/communications/socket/framing::u32-quad-header-tail
      - id: micro-behaviors/communications/socket/framing::key-offset-header-placement
      - id: micro-behaviors/process/create/shell/command-string::js-exec
      - id: micro-behaviors/data/arithmetic::xor-modulo-loop-observation

  # Windows Script Host agent: the script registers itself in a Run key and
  # keeps an HTTP channel whose responses sit beside an encoded PowerShell
  # launcher. Login persistence turns a one-shot launcher into a standing
  # remote-execution agent (JScript loader/RAT shape, e.g. RFQ-lure .js).
  - id: persistent-wsh-http-encoded-powershell-agent
    desc: Run-key WSH HTTP agent runs encoded PowerShell
    crit: hostile
    conf: 0.93
    platforms: [windows]
    attack: T1219,T1547.001,T1059.001,T1071.001
    all:
      - id: objectives/execution/payload/file-exec/command/script-host-download::wsh-http-response-encoded-powershell-launch
      - id: "micro-behaviors/os/registry/autostart/reference::currentversion-run"
    any:
      - id: micro-behaviors/os/registry/value/write::js-regwrite-method-call
      - id: micro-behaviors/os/registry/value/write::wscript-regwrite
