defaults:
  platforms: [windows]
  for: [pe, dll]
  attack: T1071.001,T1059.003,T1083,T1105
  mbc: B0022

composite_rules:
  - id: unsigned-json-http-shell-file-rat
    desc: Unsigned HTTP JSON implant executes piped shell commands and manages files
    crit: hostile
    conf: 0.98
    all:
      - id: metadata/signed/trust-level::unsigned
      - id: micro-behaviors/communications/http/header/content-type::json-header
      - id: micro-behaviors/communications/http/form::multipart-form
      - id: micro-behaviors/os/user/lookup::get-user-name
      - id: micro-behaviors/os/sysinfo/hostname/query::get-computer-name
      - id: micro-behaviors/process/create/shell/command-mode::windows-command-shell-invocation
      - id: micro-behaviors/communications/ipc/pipe::pipe-io-redirect
      - id: micro-behaviors/fs/enumerate/drives::logical-drive-enumeration
      - id: micro-behaviors/fs/delete/file/library::deletefile-w
    unless:
      - id: metadata/signed/platform/
