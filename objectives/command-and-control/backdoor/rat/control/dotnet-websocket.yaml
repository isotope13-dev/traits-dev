defaults:
  platforms: [windows]
  for: [pe, dll]
  attack: T1219,T1071.001

traits:
  - id: agent-register-event
    desc: Agent registration event token
    crit: component
    conf: 0.9
    if:
      type: text
      exact: agent:register
      section: .text

  - id: remote-desktop-capability
    desc: Remote desktop capability token
    crit: component
    conf: 0.9
    if:
      type: text
      exact: remote_desktop
      section: .text

  - id: shell-execution-capability
    desc: Shell execution capability token
    crit: component
    conf: 0.9
    if:
      type: text
      exact: shell_exec
      section: .text

composite_rules:
  - id: websocket-rat-control
    desc: WebSocket RAT registration advertises remote control capabilities
    crit: hostile
    conf: 0.99
    all:
      - id: micro-behaviors/communications/http/websocket::dotnet-client-websocket
      - id: agent-register-event
      - id: remote-desktop-capability
      - id: shell-execution-capability
