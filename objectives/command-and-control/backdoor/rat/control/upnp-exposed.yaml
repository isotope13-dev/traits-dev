# A remote-control server that opens its own hole in the router.
#
# The capability set -- an event-driven socket server, screen readback, and
# synthetic keyboard/mouse input -- is what remote-desktop software is, and it
# is not by itself a verdict. What is a verdict is the direction of the
# connection. Hosted remote-admin products gave up on inbound listeners years
# ago: the agent dials out to a broker precisely because NAT makes inbound
# unreliable, and because an inbound port is a liability the vendor does not
# want. A binary that instead asks the gateway to forward an external port to
# itself is arranging to be reachable from the internet by anyone who knows the
# address, on a machine whose owner never agreed to host a service.
#
# ATT&CK: T1090 (Proxy) for the mapping itself, T1113 (Screen Capture) and
# T1219 (Remote Access Software) for what waits behind it.
defaults:
  platforms: [windows]
  for: [pe, dll]
  attack: T1219,T1113,T1090
  mbc: B0022

composite_rules:
  - id: upnp-exposed-remote-control-server
    desc: NAT-forwarded screen and input control server
    crit: hostile
    conf: 0.95
    all:
      - id: micro-behaviors/communications/http/request/upnp::internet-gateway-port-mapping
      - id: micro-behaviors/communications/socket/multiplex::winsock-event-loop
      - id: micro-behaviors/hardware/display/screen::gdi-screen-capture-primitives
      - id: micro-behaviors/hardware/input/synthesize::sendinput-api-name
    unless:
      # The named remote-desktop and conferencing products that do carry this
      # whole set legitimately. They are recognised by identity rather than by
      # behaviour because the behaviour is genuinely the same -- what differs is
      # that a user installed them on purpose.
      - id: metadata/signed/platform/
      - id: metadata/signed/developer/
      - id: well-known/app/
      - id: well-known/lib/
      - id: well-known/tool/
      - id: well-known/dual-use/remote-admin/
