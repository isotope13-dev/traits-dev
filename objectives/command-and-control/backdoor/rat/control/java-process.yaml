defaults:
  platforms: [windows]
  for: [java]
  attack: T1057,T1489
  mbc: B0022

traits:
  - id: java-rat-process-command-packet
    desc: Handles a remote process command packet
    crit: notable
    conf: 0.92
    if:
      type: text
      substr: 'PacketProcessCommandRequest.class'

composite_rules:
  - id: java-rat-process-control-handler
    desc: RAT enumerates and terminates remote processes
    crit: suspicious
    conf: 0.96
    all:
      - id: micro-behaviors/process/enumerate/wmi::java-wmic-process-list
      - id: micro-behaviors/process/terminate/command::taskkill-pid-command
      - id: java-rat-process-command-packet
      - id: micro-behaviors/process/create/exec::java-runtime-exec-source
