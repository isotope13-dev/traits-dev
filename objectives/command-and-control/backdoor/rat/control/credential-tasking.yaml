# Reviewed native dispatcher compares these task names, calls credential and
# surveillance handlers, and returns their results over WinHTTP. Vocabulary
# alone remains suspicious; the composite also requires Defender suppression
# and request/response APIs. No hostname, port or chosen output name is required.
defaults:
  platforms: [windows]
  for: [pe, dll]

traits:
  - id: wallet-browser-theft-task-vocabulary
    desc: Wallet and browser credential task names
    crit: suspicious
    conf: 0.97
    if:
      type: raw
      section: .rdata
      regex: 'ext_grab\x00bip39_scan\x00browser_pass\x00cookies\x00cards\x00'

  - id: keylogger-toggle-task-vocabulary
    desc: Paired keylogger enable and disable task names
    crit: suspicious
    conf: 0.95
    if:
      type: raw
      section: .rdata
      regex: 'keylog_on\x00keylog_off\x00'

composite_rules:
  - id: native-http-credential-surveillance-backdoor
    desc: Credential/surveillance HTTP tasking and AV bypass
    crit: hostile
    conf: 0.98
    attack: T1071.001,T1555.003,T1056.001
    all:
      - id: wallet-browser-theft-task-vocabulary
      - id: keylogger-toggle-task-vocabulary
      - id: micro-behaviors/communications/http/client/winhttp::winhttp-send-request
      - id: micro-behaviors/communications/http/client/winhttp::winhttp-read-data
      - id: objectives/evasion/anti-av/platform/defender::native-hidden-defender-suppression
