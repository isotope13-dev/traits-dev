# Gradle-era APKs store permission names in the AXML UTF-8 string pool.
# Pair SMS/overlay grants with network sockets so UTF-8 manifests convict.
defaults:
  platforms: [android]
  for: [apk, zip, xml, dex]
  attack: T1636
composite_rules:
  - id: overlay-socket-exfil
    desc: Overlay grant with a Java socket
    crit: hostile
    conf: 0.94
    scope: outer
    all:
      - id: micro-behaviors/os/privilege/manifest::system-alert-window-binary-manifest
      - id: micro-behaviors/communications/socket/create::java-socket-bytecode-reference
