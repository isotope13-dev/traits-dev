defaults:
  platforms: [windows]
  for: [pe, dll]
  attack: T1059.003
  mbc: B0022

traits:
  - id: hidden-copy-c2-loop-log
    desc: Hidden copy enters C2 command loop
    crit: component
    conf: 0.99
    if:
      type: text
      exact: hidden copy running, entering c2_loop

  - id: received-command-log
    desc: Remote-command receipt log prefix
    crit: component
    conf: 0.9
    if:
      type: text
      exact: 'recv cmd:'

  - id: screenshot-response-envelope
    desc: JSON screenshot response envelope
    crit: component
    conf: 0.96
    if:
      type: text
      exact: '{"type":"screenshot","data":"'

  - id: stream-start-command
    desc: Remote desktop stream-start command token
    crit: component
    conf: 0.9
    if:
      type: text
      exact: stream_start

  - id: stream-stop-command
    desc: Remote desktop stream-stop command token
    crit: component
    conf: 0.9
    if:
      type: text
      exact: stream_stop

  - id: stream-start-event-marker
    desc: Remote screen stream start event marker
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: '(?i)\bSTREAM[_ ]START\b'

  - id: server-approval-reconnect-marker
    desc: Server approval and reconnect control markers
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: '(?i)(approved by server|no APPROVE from server|server silence timeout|reconnecting in)'

composite_rules:
  - id: native-screen-stream-command-rat
    desc: Hidden Windows RAT receives commands for screenshots and live streaming
    crit: hostile
    conf: 0.99
    attack: T1059.003,T1113
    mbc: B0022,C0014
    all:
      - id: hidden-copy-c2-loop-log
      - id: received-command-log
      - id: screenshot-response-envelope
      - id: stream-start-command
      - id: stream-stop-command
      - id: micro-behaviors/communications/socket/init::winsock-client-lifecycle
    unless:
      - id: metadata/signed/platform/
      - id: well-known/tool/sysadmin/

  - id: native-screen-stream-approval-rat
    desc: Native RAT with approved screen-stream control channel
    crit: hostile
    conf: 0.99
    attack: T1041,T1059.003,T1113
    mbc: B0022,C0014
    all:
      - id: stream-start-event-marker
      - id: server-approval-reconnect-marker
      - id: micro-behaviors/communications/socket/init::ws2-32-dll-marker
      - id: micro-behaviors/communications/socket/init::socket-api-ordinal
      - id: micro-behaviors/communications/socket/init::connect-api-ordinal
      - id: micro-behaviors/communications/socket/init::send-api-ordinal
      - id: micro-behaviors/communications/socket/init::recv-api-ordinal
      - id: micro-behaviors/hardware/display/screen::gdi-screen-capture-primitives
      - id: micro-behaviors/data/encode/image/gdiplus::gdiplus-image-encode
      - id: micro-behaviors/process/enumerate/snapshot::process32-traversal-text
      - id: objectives/privilege-escalation/elevation-control/uac-bypass/relaunch::shell-execute-runas
    unless:
      - id: metadata/signed/platform/
      - id: well-known/tool/sysadmin/
