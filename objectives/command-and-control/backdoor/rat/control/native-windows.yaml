defaults:
  platforms: [windows]
  for: [pe, dll]
  attack: T1059.003
  mbc: B0022

traits:
  - id: hidden-copy-c2-loop-log
    desc: Hidden copy enters C2 command loop
    crit: component
    conf: 0.99
    if:
      type: text
      exact: hidden copy running, entering c2_loop

  - id: received-command-log
    desc: Remote-command receipt log prefix
    crit: component
    conf: 0.9
    if:
      type: text
      exact: 'recv cmd:'

  - id: screenshot-response-envelope
    desc: JSON screenshot response envelope
    crit: component
    conf: 0.96
    if:
      type: text
      exact: '{"type":"screenshot","data":"'

  - id: stream-start-command
    desc: Remote desktop stream-start command token
    crit: component
    conf: 0.9
    if:
      type: text
      exact: stream_start

  - id: stream-stop-command
    desc: Remote desktop stream-stop command token
    crit: component
    conf: 0.9
    if:
      type: text
      exact: stream_stop

  - id: stream-start-event-marker
    desc: Stream-start event token for RAT composite
    crit: component
    conf: 0.94
    if:
      type: text
      regex: '(?i)\bSTREAM[_ ]START\b'
    unless:
      - id: metadata/signed/leaf::videolan

  # The operator-approval prose a RAT prints while it waits for its controller
  # to admit the session. `reconnecting in` used to be a fourth alternative and
  # was dropped: a reconnect countdown is what every network client logs, so
  # OBS Studio's own `Output '%s': Reconnecting in %.02f seconds..` matched and
  # was reported under RAT control as "server approval and reconnect control
  # markers" when no approval marker existed anywhere in the file. The three
  # remaining strings have no reading outside a controller handshake.
  - id: server-approval-control-marker
    desc: Server approval or silence-timeout message
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: '(?i)(approved by server|no APPROVE from server|server silence timeout)'

  # AtlasRAT variants expose a compact binary handshake and a separate
  # configuration marker.  These are protocol bytes, not prose or filenames;
  # keeping them as components lets the conviction require the pair.
  - id: opaque-rat-config-marker
    desc: Opaque native RAT configuration marker
    crit: component
    conf: 0.99
    for: [pe, dll, c, cpp, go, rust]
    if:
      type: text
      substr: 'By@V<'

  - id: opaque-rat-handshake-b
    desc: Opaque native RAT BFuck handshake marker
    crit: notable
    conf: 0.99
    for: [pe, dll, c, cpp, go, rust]
    if:
      type: text
      substr: BFuck

  - id: opaque-rat-handshake-s
    desc: Opaque native RAT SFuck handshake marker
    crit: notable
    conf: 0.99
    for: [pe, dll, c, cpp, go, rust]
    if:
      type: text
      substr: SFuck

  - id: admin-remote-command-packet
    desc: Native admin protocol remote-command packet
    crit: component
    conf: 0.96
    if:
      type: text
      exact: AdminExecuteCommandPacket

  - id: admin-file-request-packet
    desc: Native admin protocol file-request packet
    crit: component
    conf: 0.96
    if:
      type: text
      regex: 'Admin(RequestFileList|RequestFile|ReturnFileList)Packet'

  - id: admin-file-modification-packet
    desc: Native admin protocol file-modification packet
    crit: component
    conf: 0.96
    if:
      type: text
      regex: 'Admin(CreateFile|CreateDir|DeleteFile|EditFile|UploadFile|RenameFile)Packet'

  - id: admin-stealer-packet
    desc: Native admin protocol stealer packet
    crit: component
    conf: 0.98
    if:
      type: text
      exact: AdminStealerPacket

  - id: admin-media-translation-packet
    desc: Native screen or camera translation packet
    crit: component
    conf: 0.96
    if:
      type: text
      regex: 'Admin(Start|Continue|Stop)(Screen|Camera|Microphone)TranslationPacket'

composite_rules:
  - id: unsigned-admin-control-rat
    desc: Unsigned native RAT exposes file, command, and stealer tasking
    crit: hostile
    conf: 0.99
    attack: T1059.003,T1105,T1041,T1005
    all:
      - id: admin-remote-command-packet
      - id: admin-file-request-packet
      - id: admin-file-modification-packet
      - id: admin-stealer-packet
      - id: metadata/binary/layout::pe-no-signature-record
      - id: objectives/evasion/anti-av/platform/defender::native-defender-exclusion-loader
    any:
      - id: micro-behaviors/communications/socket/init::winsock-client-lifecycle
      - id: micro-behaviors/communications/http/client/winhttp::winhttp-bidirectional-transfer
      - id: admin-media-translation-packet

  - id: native-websocket-hidden-shell-screen-agent
    desc: Unsigned native WebSocket agent with hidden PowerShell and screen capture
    crit: hostile
    conf: 0.99
    attack: T1071.001,T1059.001,T1113
    all:
      - id: micro-behaviors/communications/http/websocket::wss-scheme
      - id: micro-behaviors/communications/http/client/winhttp::winhttp-runtime-api-table
      - id: micro-behaviors/process/create/shell/interpreter::powershell-executable-token
      - id: micro-behaviors/process/create/shell/remote-powershell::powershell-hidden-window
      - id: micro-behaviors/process/create/launch::create-process-api-name
      - id: micro-behaviors/hardware/display/screen::gdi-bitmap-transfer-primitives
    unless:
      - id: metadata/signed/platform/
      - id: well-known/tool/sysadmin/

  - id: native-opaque-rat-handshake
    desc: Native RAT uses opaque configuration and handshake markers
    crit: hostile
    conf: 0.99
    attack: T1071,T1573
    mbc: B0030
    for: [pe, dll, c, cpp, go, rust]
    all:
      - id: opaque-rat-config-marker
    any:
      - id: opaque-rat-handshake-b
      - id: opaque-rat-handshake-s

  - id: native-screen-stream-command-rat
    desc: Hidden Windows RAT receives commands for screenshots and live streaming
    crit: hostile
    conf: 0.99
    attack: T1059.003,T1113
    mbc: B0022,C0014
    all:
      - id: hidden-copy-c2-loop-log
      - id: received-command-log
      - id: screenshot-response-envelope
      - id: stream-start-command
      - id: stream-stop-command
      - id: micro-behaviors/communications/socket/init::winsock-client-lifecycle
    unless:
      - id: metadata/signed/platform/
      - id: well-known/tool/sysadmin/

  - id: native-screen-stream-approval-rat
    desc: Native RAT with approved screen-stream control channel
    crit: hostile
    conf: 0.99
    attack: T1041,T1059.003,T1113
    mbc: B0022,C0014
    all:
      - id: stream-start-event-marker
      - id: server-approval-control-marker
      - id: micro-behaviors/communications/socket/init::ws2-32-dll-marker
      - id: micro-behaviors/communications/socket/init::socket-api-ordinal
      - id: micro-behaviors/communications/socket/init::connect-api-ordinal
      - id: micro-behaviors/communications/socket/init::send-api-ordinal
      - id: micro-behaviors/communications/socket/init::recv-api-ordinal
      - id: micro-behaviors/hardware/display/screen::gdi-screen-capture-primitives
      - id: micro-behaviors/data/encode/image/gdiplus::gdiplus-image-encode
      - id: micro-behaviors/process/enumerate/snapshot::process32-traversal-text
      - id: objectives/privilege-escalation/elevation-control/uac-bypass/relaunch::shell-execute-runas
    unless:
      - id: metadata/signed/platform/
      - id: well-known/tool/sysadmin/
