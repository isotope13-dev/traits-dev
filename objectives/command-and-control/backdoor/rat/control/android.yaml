defaults:
  platforms: [android]
  for: [apk, zip, dex]

traits:
  - id: android-registration-paths
    desc: Android registration protocol paths
    crit: component
    conf: 0.94
    count_min: 3
    if:
      type: text
      regex: ":3030/reg[A-Za-z]{2,12}"

  - id: android-heartbeat-path
    desc: Android heartbeat protocol path
    crit: component
    conf: 0.9
    if:
      type: text
      regex: ":3030/heart[a-z]{4}"

  - id: android-tcp-worker-threads
    desc: Android TCP worker threads
    crit: component
    conf: 0.9
    if:
      type: text
      regex: "(Heartbeat-Loop|ScreenInfo-Loop|TCP-Worker)"

  - id: android-pin-digits-field
    desc: Android pinDigits telemetry field
    crit: component
    if:
      type: text
      word: pinDigits
  - id: android-transaction-type-field
    desc: Android transactionType telemetry field
    crit: component
    if:
      type: text
      word: transactionType
  - id: android-request-json-raw-field
    desc: Android reqJsonRaw telemetry field
    crit: component
    if:
      type: text
      word: reqJsonRaw

  - id: android-rat-packet-class
    desc: Android RAT packet class
    crit: component
    conf: 0.84
    if:
      type: text
      substr: "PacketClass"

  - id: android-rat-encryption-class
    desc: Android RAT encryption class
    crit: component
    conf: 0.86
    if:
      type: text
      substr: "EncryptionCUtils"

  - id: android-encoded-external-ipv4
    desc: Encoded Android external IPv4
    crit: suspicious
    conf: 0.9
    if:
      type: encoded
      encoding: base64
      regex: "^([0-9]{1,3}\\.){3}[0-9]{1,3}$"
      is: external_ip

composite_rules:
  # A remote-support app can legitimately use Accessibility, screenshots, or
  # WebSockets. A DEX that combines all three inside a deliberately opaque
  # package hierarchy is instead a high-confidence remote-control profile.
  - id: android-obfuscated-accessibility-screen-rat
    desc: Obfuscated Accessibility screen-surveillance RAT
    crit: hostile
    conf: 0.995
    attack: T1027,T1071.001,T1113,T1417.001
    all:
      - id: micro-behaviors/hardware/input/accessibility::android-accessibility-service-class
      - id: micro-behaviors/hardware/display/screen::android-screen-capture-capability
      - id: micro-behaviors/communications/http/websocket::android-okhttp-websocket-client
      - id: objectives/anti-static/obfuscation/name-mangling/class-folder::android-deep-long-package-namespace

  - id: android-transaction-telemetry-fields
    desc: Android transaction telemetry fields
    crit: component
    conf: 0.94
    any:
      - id: android-pin-digits-field
      - id: android-transaction-type-field
      - id: android-request-json-raw-field
  - id: android-encrypted-socket-rat
    desc: Android encrypted socket RAT
    crit: hostile
    conf: 0.97
    all:
      - id: android-rat-packet-class
      - id: android-rat-encryption-class
      - id: micro-behaviors/communications/socket/create::android-secondary-socket-class
    any:
      - id: android-encoded-external-ipv4
      - id: micro-behaviors/communications/socket/create::java-socket-bytecode-reference
      - id: micro-behaviors/communications/socket/create::java-datagram-socket-bytecode-reference
      - id: micro-behaviors/hardware/input/accessibility::android-accessibility-service-config

  - id: android-transaction-control-protocol
    desc: Android transaction control protocol
    crit: suspicious
    conf: 0.96
    all:
      - id: android-registration-paths
      - id: android-heartbeat-path
      - id: android-transaction-telemetry-fields
    any:
      - id: android-tcp-worker-threads
      - id: micro-behaviors/communications/socket/create::java-socket-bytecode-reference
      - id: micro-behaviors/communications/ip/literal::external-ipv4-android-apk

  - id: android-screen-sms-surveillance-rat
    desc: Android screen and SMS surveillance RAT
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/hardware/display/screen::android-screen-capture-capability
      - id: micro-behaviors/os/message/intent::android-sms-received-action-source
      - id: micro-behaviors/os/privilege/manifest::read-phone-state
    any:
      - id: micro-behaviors/hardware/input/audio::android-audio-recording-capability
      - id: micro-behaviors/hardware/display/screen::android-media-projection-screen-capture
      - id: micro-behaviors/os/privilege/manifest::send-sms

  - id: android-webview-sms-credential-rat
    desc: Android WebView SMS credential RAT
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/process/interpreter/webview::webview-remote-content-shell
      - id: micro-behaviors/os/message/intent::android-sms-received-action-source
      - id: micro-behaviors/os/privilege/manifest::read-phone-state
    any:
      - id: micro-behaviors/hardware/display/screen::android-screen-capture-capability
      - id: micro-behaviors/hardware/input/accessibility::android-accessibility-service-class
      - id: micro-behaviors/os/privilege/manifest::send-sms

  - id: android-mediaprojection-sms-rat
    desc: Android MediaProjection SMS RAT
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/hardware/display/screen::android-media-projection-screen-capture
      - id: micro-behaviors/os/message/intent::android-sms-received-action-source
      - id: micro-behaviors/os/privilege/manifest::read-phone-state
    any:
      - id: micro-behaviors/hardware/input/audio::android-audio-recording-capability
      - id: micro-behaviors/process/interpreter/webview::webview-remote-content-shell
      - id: micro-behaviors/os/privilege/manifest::send-sms

  # Source-level profile for RAT forks whose generated class names and C2
  # domains change. Accessibility gesture control plus remote screen and
  # camera APIs is a meaningful device-control pattern even without a family
  # signature.
  - id: android-source-websocket-transport
    desc: Android source WebSocket C2 transport
    crit: notable
    conf: 0.94
    for: [java, kotlin]
    any:
      - id: micro-behaviors/communications/http/websocket::android-source-okhttp-websocket-client
      - id: micro-behaviors/communications/websocket/endpoints::android-wss-endpoint

  - id: android-accessibility-sensor-control-rat
    desc: Android accessibility sensor-control RAT
    crit: hostile
    conf: 0.995
    for: [java, kotlin]
    attack: T1417.001,T1113,T1125,T1071.001
    all:
      - id: micro-behaviors/hardware/input/accessibility::android-accessibility-service-source
      - id: micro-behaviors/hardware/input/accessibility::android-accessibility-ui-action-source
      - id: android-source-websocket-transport
      - id: micro-behaviors/hardware/display/screenshot::android-source-media-projection-screen-capture
      - id: micro-behaviors/hardware/display/camera::android-source-camera-capture

  # APK/DEX counterpart: the same conclusion from compiled Android API
  # references and package-level capabilities.
  - id: android-accessibility-sensor-control-apk
    desc: Android accessibility sensor-control APK RAT
    crit: hostile
    conf: 0.995
    attack: T1417.001,T1113,T1125,T1071.001
    all:
      - id: micro-behaviors/hardware/input/accessibility::android-accessibility-service-config
      - id: micro-behaviors/communications/http/websocket::android-okhttp-websocket-client
      - id: micro-behaviors/hardware/display/screen::android-media-projection-screen-capture
      - id: micro-behaviors/hardware/display/camera::android-camera-capture-capability

  # SpyNote's relevant behavior does not require screen sharing: a RAT can use
  # Accessibility to drive the UI, invoke the package installer, and bring in
  # a second payload over its remote channel.  Requiring all three surfaces
  # keeps ordinary accessibility apps and ordinary APK installers separate.
  - id: android-accessibility-silent-package-installer-rat
    desc: Android Accessibility-controlled silent APK installer RAT
    crit: hostile
    conf: 0.995
    attack: T1417.001,T1631,T1071.001
    all:
      - id: micro-behaviors/hardware/input/accessibility::android-accessibility-service-config
      - id: micro-behaviors/os/package-manager/install::android-packageinstaller-session-params
      - id: micro-behaviors/communications/http/websocket::android-okhttp-websocket-client
      - id: micro-behaviors/communications/websocket/endpoints::android-wss-endpoint

  - id: android-source-accessibility-silent-package-installer-rat
    desc: Android source Accessibility-controlled silent APK installer RAT
    crit: hostile
    conf: 0.995
    attack: T1417.001,T1631,T1071.001
    for: [java, kotlin]
    all:
      - id: micro-behaviors/hardware/input/accessibility::android-accessibility-service-source
      - id: micro-behaviors/hardware/input/accessibility::android-accessibility-ui-action-source
      - id: android-source-websocket-transport
      - id: micro-behaviors/os/package-manager/install::android-silent-apk-install
