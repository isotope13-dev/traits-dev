# PromptSpy shows a useful composite for future Android variants: an
# accessibility-enabled app combines model-guided UI control with remote
# screen/control and collection capabilities.  No family or endpoint string
# is required here.
defaults:
  platforms: [android]
  for: [java, kotlin]
  attack: T1663,T1516,T1113

composite_rules:
  - id: android-accessibility-vnc-surveillance
    desc: Android accessibility VNC surveillance capability
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/hardware/input/accessibility::android-accessibility-service-source
      - id: micro-behaviors/hardware/input/accessibility::android-accessibility-ui-action-source
      - id: micro-behaviors/communications/socket/vnc::vnc-source-reference
      - id: micro-behaviors/hardware/display/screenshot::android-source-screenshot-call
      - id: micro-behaviors/hardware/display/screenshot::android-installed-apps-enumeration
    any:
      - id: micro-behaviors/crypto/symmetric/aes/mode::java-aes-gcm-mode
