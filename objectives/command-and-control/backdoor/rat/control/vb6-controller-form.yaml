# VB6 RAT and botnet controller UI forms managing bot and daemon controls.
defaults:
  platforms: [windows]
  for: [text]
  attack: T1219
  mbc: B0030

traits:
  - id: vb6-bot-selection-label
    desc: Botnet controller selected bots UI string
    crit: notable
    conf: 0.9
    if:
      type: text
      substr: 'Selected bots:'

  - id: vb6-bot-daemon-controls
    desc: Bot and daemon VB6 user controls
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: 'Begin [A-Za-z0-9_]+\.(uBot|uDaemon)\b'

composite_rules:
  - id: vb6-bot-controller-form
    desc: VB6 RAT/botnet controller bot-management form
    crit: suspicious
    conf: 0.92
    all:
      - id: metadata/lang/generated::vb6-form-definition
      - id: vb6-bot-selection-label
      - id: vb6-bot-daemon-controls
