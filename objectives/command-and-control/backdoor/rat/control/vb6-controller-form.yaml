# VB6 RAT and botnet controller UI forms managing bot and daemon controls.
defaults:
  platforms: [windows]
  for: [text]
  attack: T1219
  mbc: B0030

traits:
  - id: vb6-bot-selection-label
    desc: Botnet controller selected bots UI string
    crit: notable
    conf: 0.9
    if:
      type: text
      substr: 'Selected bots:'

  - id: vb6-bot-daemon-controls
    desc: Bot and daemon VB6 user controls
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: 'Begin [A-Za-z0-9_]+\.(uBot|uDaemon)\b'

  - id: vb6-winsock-command-send
    desc: VB6 form sends command over Winsock
    crit: notable
    conf: 0.85
    if:
      type: text
      regex: '(?i)WinSock[A-Za-z0-9_]*\.SendData\s+"[0-9]{2,4}"\s*&'

  - id: vb6-server-printer-caption
    desc: VB6 form targets remote server printer
    crit: notable
    conf: 0.88
    if:
      type: text
      regex: '(?i)Caption\s*=\s*"Print to servers? printer"'

  # Confirmation prompt for deleting a directory chosen in a remote file browser.
  - id: vb6-remote-directory-remove-prompt
    desc: VB6 form confirms removing a chosen directory
    crit: notable
    conf: 0.88
    if:
      type: text
      regex: '(?i)remove the specified directory|Caption\s*=\s*"Remove Directory"'

composite_rules:
  - id: vb6-bot-controller-form
    desc: VB6 RAT/botnet controller bot-management form
    crit: suspicious
    conf: 0.92
    all:
      - id: metadata/lang/generated::vb6-form-definition
      - id: vb6-bot-selection-label
      - id: vb6-bot-daemon-controls

  - id: vb6-rat-winsock-command-form
    desc: VB6 RAT client form dispatches remote commands over Winsock
    crit: hostile
    conf: 0.94
    all:
      - id: metadata/lang/generated::vb6-form-definition
      - id: vb6-winsock-command-send
      - id: vb6-server-printer-caption

  # Remote file browser that sends a directory-removal command to the bot.
  - id: vb6-rat-remote-directory-delete
    desc: VB6 RAT form sends remote directory removal over Winsock
    crit: hostile
    conf: 0.93
    attack: T1485
    all:
      - id: metadata/lang/generated::vb6-form-definition
      - id: vb6-winsock-command-send
      - id: vb6-remote-directory-remove-prompt
