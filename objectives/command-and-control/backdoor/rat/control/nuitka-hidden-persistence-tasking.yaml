defaults:
  platforms: [windows]
  for: [pe]
  attack: T1547.001,T1059,T1113
traits:
  # Nuitka's serialized module constants keep these independent behaviors
  # together, even though the Python source is compiled to native code. The
  # bounded window prevents unrelated bundled-library strings from supplying
  # the tasking and capture evidence.
  - id: nuitka-hidden-persistence-tasking
    desc: Nuitka RAT persistence and tasking strings
    crit: hostile
    conf: 0.99
    if:
      type: yara
      source: |
        rule nuitka_hidden_persistence_tasking {
          meta:
            filetypes = "pe"
          strings:
            $hide = "attrib +s +h %localappdata%\\" ascii nocase
            $run = "REG ADD HKEY_LOCAL_MACHINE\\Software\\Microsoft\\Windows\\CurrentVersion\\Run" ascii nocase
            $startup = "\\Windows\\Start Menu\\Programs\\StartUp\\" ascii nocase
            $compiled = "__compiled__" ascii
            $socket = "websockets.client" ascii
            $screen = "screenshot" ascii
            $upload = "AnonFiles" ascii nocase
            $command = "COMMAND" ascii
            $result = "RESULT" ascii
          condition:
            for any i in (1..#hide) : (
              @hide[i] >= 1024 and
              $compiled in (@hide[i] - 1024 .. @hide[i] + 8192) and
              $run in (@hide[i] - 1024 .. @hide[i] + 8192) and
              $startup in (@hide[i] - 1024 .. @hide[i] + 8192) and
              $socket in (@hide[i] - 1024 .. @hide[i] + 8192) and
              $screen in (@hide[i] - 1024 .. @hide[i] + 8192) and
              $upload in (@hide[i] - 1024 .. @hide[i] + 8192) and
              $command in (@hide[i] - 1024 .. @hide[i] + 8192) and
              $result in (@hide[i] - 1024 .. @hide[i] + 8192)
            )
        }
