defaults:
  platforms: [windows, unix, android]
  for: [java]
  attack: T1219
  mbc: B0022

traits:
  - id: java-rat-shell-command-method
    desc: Java RAT shell command method
    crit: notable
    conf: 0.9
    if:
      type: symbol
      kind: function
      exact: sendShellCommand
  - id: java-rat-keylogger-method
    desc: Java RAT keylogger method
    crit: notable
    conf: 0.9
    if:
      type: symbol
      kind: function
      regex: '^startKey(log|logger)'
  - id: java-rat-filesystem-view-method
    desc: Java RAT filesystem view method
    crit: notable
    conf: 0.88
    if:
      type: symbol
      kind: function
      exact: getFileSystemView
  - id: java-rat-filesystem-update-method
    desc: Java RAT filesystem update method
    crit: notable
    conf: 0.88
    if:
      type: symbol
      kind: function
      exact: onFileSystemInfoUpdate
  - id: java-rat-filesystem-root-method
    desc: Java RAT filesystem root method
    crit: notable
    conf: 0.88
    if:
      type: symbol
      kind: function
      exact: onFilesystemRootInfoReceived
  - id: java-rat-process-stop-method
    desc: Java RAT process stop method
    crit: notable
    conf: 0.88
    if:
      type: symbol
      kind: function
      exact: stopProcessMonitor
  - id: java-rat-process-info-method
    desc: Java RAT process info method
    crit: notable
    conf: 0.88
    if:
      type: symbol
      kind: function
      exact: onProcessInfoReceived
  - id: java-rat-process-session-method
    desc: Java RAT process session method
    crit: notable
    conf: 0.88
    if:
      type: symbol
      kind: function
      exact: onProcessSessionClosed
  - id: java-rat-power-control-method
    desc: Java RAT power control method
    crit: notable
    conf: 0.88
    if:
      type: symbol
      kind: function
      regex: '^start(Reboot|ShutDown|LogOff|Lock)'
  - id: java-rat-reverse-shell-subject
    desc: Java RAT reverse shell subject
    crit: notable
    conf: 0.86
    if:
      type: symbol
      kind: member
      exact: Subject.REVERSE_SHELL
  - id: java-rat-shell-senddata-source
    desc: Java RAT shell command sender
    crit: notable
    conf: 0.88
    if:
      type: text
      regex: 'SendData\([^,\n]{0,80},\s*(shell|cmd|command|exec)'
      case_insensitive: true
  - id: java-rat-reverse-shell-ui-text
    desc: Java RAT reverse shell UI text
    crit: notable
    conf: 0.86
    if:
      type: text
      regex: '(?i)reverse shell (output|closed)|shell input'
  - id: java-rat-file-response-protocol
    desc: Java RAT file response protocol
    crit: notable
    conf: 0.86
    if:
      type: text
      regex: 'startsWith\("(FILE|SCREENSHOT|KEYLOG|MIC)'
  - id: java-rat-screenshot-download-text
    desc: Java RAT screenshot download text
    crit: notable
    conf: 0.88
    if:
      type: text
      # Adjacent phrasing only — loose "screenshot ... download" windows
      # false-positive on protobuf API docs for artifact download URLs.
      regex: '(?i)screenshot\s+(received|downloaded|saved)'
  - id: java-rat-screenshot-fstream-text
    desc: Java RAT screenshot FileOutputStream text
    crit: notable
    conf: 0.88
    if:
      type: text
      regex: '(?i)FileOutputStream.{0,40}screenshot'
  - id: java-rat-keylog-download-text
    desc: Java RAT keylog download text
    crit: notable
    conf: 0.88
    if:
      type: text
      regex: '(?i)keylogs?.{0,160}(download|received|FileOutputStream)'
  - id: java-rat-mic-download-text
    desc: Java RAT mic recording download text
    crit: notable
    conf: 0.88
    if:
      type: text
      regex: '(?i)mic recording.{0,160}(download|received|FileOutputStream)'
  - id: java-rat-tsocket-worker-source
    desc: Java RAT per-socket worker source
    crit: notable
    conf: 0.84
    if:
      type: text
      regex: 'new\s+TSocket\([^)]{0,80}\)\.start\(\)'
  - id: java-rat-master-agent-registration
    desc: Java RAT master and agent registration text
    crit: notable
    conf: 0.88
    if:
      type: text
      regex: '\((Master|Agent)\) Connection established|addAgent:'
  - id: java-rat-restart-all-sockets
    desc: Java RAT restart all sockets command
    crit: notable
    conf: 0.88
    if:
      type: text
      substr: restartSocket
  - id: java-c2-operation-console-history
    desc: Java C2 operation console command history
    crit: notable
    conf: 0.84
    if:
      type: text
      substr: commandHistory
  - id: java-c2-common-handler-command
    desc: Java C2 common command handler dispatch
    crit: notable
    conf: 0.88
    if:
      type: text
      regex: 'CommonHandler\([^,\n]{0,80},\s*this'
  - id: java-c2-task-killer-source
    desc: Java C2 task killer source
    crit: notable
    conf: 0.86
    if:
      type: symbol
      kind: call
      exact: TaskKiller
  - id: java-rat-agentdata-source
    desc: Java RAT agent data source
    crit: notable
    conf: 0.84
    if:
      type: symbol
      kind: identifier
      exact: AgentData
  # `micro-behaviors/fs/file/copy::java-files-copy` is a `type: import` match
  # against a compiled .class file's constant pool; it cannot see this Java
  # source file. Source calls the method directly instead.
  - id: java-source-files-copy
    desc: Java source calls Files.copy
    crit: notable
    conf: 0.88
    if:
      type: symbol
      kind: call
      exact: Files.copy

  - id: java-rat-discord-grabber-task
    desc: Sends Discord token grabber task to agent
    crit: notable
    conf: 0.92
    if:
      type: text
      substr: 'discordGrabber:'
  - id: java-rat-discord-grabber-ui
    desc: Discord token grabber operator panel
    crit: notable
    conf: 0.92
    if:
      type: text
      substr: 'Discord Grabber'
  - id: java-rat-discord-token-copy-label
    desc: Offers to copy returned Discord tokens
    crit: notable
    conf: 0.92
    if:
      type: text
      substr: 'Copy Tokens'
  - id: java-rat-discord-grabber-response
    desc: Displays response from token grabber task
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: 'logText\s*\.\s*setText\s*\(\s*response'

  - id: java-rat-powershell-session-source
    desc: Opens an embedded PowerShell session
    crit: notable
    conf: 0.92
    platforms: [windows]
    if:
      type: text
      substr: 'PowerShell.openSession()'

  - id: java-rat-powershell-policy-loosen-source
    desc: Loosens PowerShell policy for this process
    crit: notable
    conf: 0.94
    platforms: [windows]
    if:
      type: text
      substr: 'Set-ExecutionPolicy Unrestricted -Scope Process'

  - id: java-rat-remote-command-dispatch-source
    desc: Dispatches commands from a remote client
    crit: notable
    conf: 0.92
    if:
      type: text
      regex: 'CommandManager\.parseCommand\s*\(\s*client\.receive\(\)\.trim\(\)\s*,\s*this\s*\)'

  - id: java-rat-powershell-command-execution-source
    desc: Runs commands in an embedded PowerShell session
    crit: notable
    conf: 0.92
    platforms: [windows]
    if:
      type: text
      regex: 'powerShell\.executeCommand\s*\(\s*command\s*\)'

  - id: java-rat-remote-file-transfer-source
    desc: Transfers files via a secondary remote client
    crit: notable
    conf: 0.92
    if:
      type: text
      regex: 'temporary\.(receiveFile|sendFile)\s*\('

composite_rules:
  - id: java-rat-filesystem-method
    desc: Java RAT filesystem methods
    crit: notable
    conf: 0.88
    any:
      - id: java-rat-filesystem-view-method
      - id: java-rat-filesystem-update-method
      - id: java-rat-filesystem-root-method
  - id: java-rat-process-method
    desc: Java RAT process methods
    crit: notable
    conf: 0.88
    any:
      - id: java-rat-process-stop-method
      - id: java-rat-process-info-method
      - id: java-rat-process-session-method
  - id: java-rat-collected-artifact-download
    desc: Java RAT artifact download handler
    crit: notable
    conf: 0.88
    any:
      - id: java-rat-screenshot-download-text
      - id: java-rat-screenshot-fstream-text
      - id: java-rat-keylog-download-text
      - id: java-rat-mic-download-text
  - id: java-source-rat-controller-surface
    desc: Java source RAT controller surface
    crit: suspicious
    conf: 0.95
    any:
      - id: java-rat-shell-command-method
      - id: java-rat-keylogger-method
      - id: java-rat-filesystem-method
      - id: objectives/command-and-control/backdoor/control/desktop::java-rat-screen-method
      - id: java-rat-process-method
      - id: java-rat-power-control-method
      - id: java-rat-reverse-shell-subject
      - id: micro-behaviors/communications/socket/create::java-socket-create
    needs: 4
  - id: java-rat-reverse-shell-ui
    desc: Java RAT reverse shell UI command sender
    crit: suspicious
    conf: 0.93
    all:
      - id: micro-behaviors/communications/socket/create::java-socket-create
      - id: java-rat-reverse-shell-ui-text
      - id: java-rat-shell-senddata-source
  - id: java-rat-socket-artifact-collector
    desc: Java RAT socket artifact collector
    crit: suspicious
    conf: 0.94
    all:
      - id: micro-behaviors/communications/socket/create::java-socket-create
      - id: micro-behaviors/process/io/stream::java-input-stream-access
      - id: java-source-files-copy
    any:
      - id: java-rat-file-response-protocol
      - id: java-rat-collected-artifact-download
    needs: 1
  - id: java-rat-server-broker
    desc: Java RAT server broker
    crit: suspicious
    conf: 0.93
    all:
      - id: micro-behaviors/communications/socket/create::java-serversocket-create
      - id: micro-behaviors/communications/socket/listen::java-accepts-connection
    any:
      - id: java-rat-master-agent-registration
      - id: java-rat-restart-all-sockets
      - id: java-rat-tsocket-worker-source
    needs: 1
  - id: java-c2-operation-console
    desc: Java C2 operation console
    crit: suspicious
    conf: 0.93
    all:
      - id: java-c2-operation-console-history
      - id: java-c2-common-handler-command
    any:
      - id: java-c2-task-killer-source
      - id: micro-behaviors/communications/socket/create::java-socket-create
    needs: 1
  - id: java-rat-registration-handler
    desc: Java RAT master/agent registration handler
    crit: suspicious
    conf: 0.92
    all:
      - id: micro-behaviors/communications/socket/create::java-socket-create
      - id: java-rat-master-agent-registration
  - id: java-rat-agent-management-ui
    desc: Java RAT agent management UI
    crit: suspicious
    conf: 0.92
    all:
      - id: java-rat-restart-all-sockets
      - id: java-rat-agentdata-source
  - id: java-rat-discord-token-operator
    desc: RAT handles returned Discord token tasks
    crit: suspicious
    conf: 0.97
    all:
      - id: java-rat-discord-grabber-task
      - id: java-rat-discord-grabber-ui
      - id: java-rat-discord-token-copy-label
      - id: java-rat-discord-grabber-response
      - id: micro-behaviors/os/clipboard/write::java-clipboard-set-contents

  - id: java-rat-powershell-remote-command-agent
    desc: Java remote agent dispatches commands through PowerShell
    crit: suspicious
    conf: 0.97
    platforms: [windows]
    all:
      - id: java-rat-powershell-session-source
      - id: java-rat-powershell-policy-loosen-source
      - id: java-rat-remote-command-dispatch-source
      - id: java-rat-powershell-command-execution-source
      - id: java-rat-remote-file-transfer-source
