defaults:
  platforms: [windows]
  for: [pe, dll, csharp]
  attack: T1027

traits:
  - id: dotnet-rat-config-field-cluster
    desc: .NET RAT host, port, and install fields
    crit: suspicious
    conf: 0.86
    if:
      type: text
      regex: '(?s)\bHost\b.{0,120}\bPort\b.{0,120}\bMutex\b.{0,120}\b(SPL|InstallName)\b'

  - id: dotnet-rat-config-pipe-separator
    desc: .NET RAT config pipe separator
    crit: component
    conf: 0.9
    if:
      type: text
      exact: "<|>"

composite_rules:
  - id: dotnet-rat-config-crypto-cooccurrence
    for: [csharp]
    desc: .NET RAT config with crypto markers
    crit: hostile
    conf: 0.96
    all:
      - id: micro-behaviors/crypto/symmetric/aes/library::rijndael-managed
      - id: micro-behaviors/crypto/hash/digest::dotnet-md5-cryptoprovider-reference
      - id: dotnet-rat-config-field-cluster
    any:
      - id: micro-behaviors/crypto/symmetric/config::dotnet-ecb-or-zero-padding-reference
      - id: dotnet-rat-config-pipe-separator
