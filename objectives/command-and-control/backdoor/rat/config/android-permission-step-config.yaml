# Builder configuration for an Android device-takeover implant. Each key names
# one permission or protection step the dropper walks the victim through: the
# Play Protect switch, device-administrator activation and SMS reading. A
# settings file that carries all three alongside a C2/web decoy URL is the
# implant's own operator config, not a stock app preference set.
defaults:
  platforms: [android]
  for: [json]
  attack: T1626.001,T1629.003,T1636.004
  mbc: B0022

traits:
  - id: permission-config-play-protect-step
    desc: Config toggles a Play Protect step
    crit: notable
    conf: 0.9
    if:
      type: value
      path: permissionConfig.enablePlayProtect
      exists: true

  - id: permission-config-device-admin-step
    desc: Config toggles a device-admin step
    crit: notable
    conf: 0.9
    if:
      type: value
      path: permissionConfig.enableDeviceAdmin
      exists: true

  - id: permission-config-sms-read-step
    desc: Config toggles an SMS-read step
    crit: notable
    conf: 0.9
    if:
      type: value
      path: permissionConfig.enableSmsRead
      exists: true

composite_rules:
  - id: android-takeover-permission-step-config
    desc: Config enables Play Protect, device-admin and SMS-read takeover steps
    crit: hostile
    conf: 0.93
    all:
      - id: permission-config-play-protect-step
      - id: permission-config-device-admin-step
      - id: permission-config-sms-read-step
