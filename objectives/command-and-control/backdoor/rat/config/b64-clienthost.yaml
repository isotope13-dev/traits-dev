# Commercial Android RATs (Spyroid-class and forks) ship C2 as Base64-encoded
# ClientHost / ClientPort string fields and keep the reverse socket alive with
# setSoTimeout(0). Detect the config + never-timeout dial shape, not one IP.
defaults:
  platforms: [android, unix, windows]
  for: [java, dex]
  attack: T1521,T1422,T1219
  mbc: B0022

traits:
  - id: android-rat-clienthost-b64-field
    desc: Android RAT Base64 ClientHost C2 field
    crit: suspicious
    conf: 0.96
    if:
      type: text
      regex: '\bClientHost\s*=\s*["''][A-Za-z0-9+/]{8,}={0,2}["'']'

  - id: android-rat-clientport-b64-field
    desc: Android RAT Base64 ClientPort C2 field
    crit: suspicious
    conf: 0.96
    if:
      type: text
      regex: '\bClientPort\s*=\s*["''][A-Za-z0-9+/]{4,}={0,2}["'']'

  - id: android-rat-connectionkey-field
    desc: Android RAT ConnectionKey auth field
    crit: notable
    conf: 0.92
    if:
      type: text
      regex: '\bConnectionKey\s*='

  - id: java-socket-never-timeout
    desc: Java socket setSoTimeout(0) never-timeout
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '\.setSoTimeout\s*\(\s*0\s*\)'

  - id: sacred-explosion-package
    desc: Spyroid Bankprotect sacred.explosion package
    crit: suspicious
    conf: 0.99
    if:
      type: text
      regex: '\b(package\s+)?sacred\.explosion\b'

composite_rules:
  - id: android-rat-b64-c2-never-timeout-socket
    desc: Base64 ClientHost/ClientPort C2 with never-timeout socket
    crit: hostile
    conf: 0.99
    attack: T1521,T1219
    near_bytes: 4000
    all:
      - id: android-rat-clienthost-b64-field
      - id: android-rat-clientport-b64-field
      - id: java-socket-never-timeout
    any:
      - id: android-rat-connectionkey-field
      - id: micro-behaviors/communications/socket/dial::jvm-dial
      - id: micro-behaviors/communications/socket/create::java-socket-create
      - id: micro-behaviors/communications/dns/lookup/resolver::jvm-inetaddress-getbyname-source

  - id: spyroid-sacred-explosion-c2
    desc: sacred.explosion RAT with Base64 ClientHost C2
    crit: hostile
    conf: 0.99
    attack: T1219,T1476
    all:
      - id: sacred-explosion-package
      - id: android-rat-clienthost-b64-field
      - id: android-rat-clientport-b64-field
    any:
      - id: java-socket-never-timeout
      - id: android-rat-connectionkey-field
