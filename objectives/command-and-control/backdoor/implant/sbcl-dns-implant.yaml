# SBCL binary carrying an appended compressed core: the SBCL Market DNS TXT
# implant shape. The SBCL core-loader strings alone (now
# metadata/lang/scripted::sbcl-core-*) mark any SBCL binary, so this rule
# additionally requires the embedded/appended core machinery.
defaults:
  platforms: [unix]
  for: [elf]
  attack: "T1071.004"
  mbc: "C0002"
composite_rules:
  - id: dns-txt-implant
    desc: SBCL Market DNS TXT malware signature
    crit: hostile
    conf: 0.98
    size_min: 1048576
    size_max: 33554432
    all:
      - id: metadata/lang/scripted::is-sbcl
      - id: micro-behaviors/data/embedded/runtime::embedded-core-loader
      - id: micro-behaviors/data/embedded/runtime::zstd-compressed-core
      - id: objectives/anti-static/obfuscation/payload/compressed-data::sbcl-appended-core-container
    any:
      - id: metadata/lang/scripted::sbcl-core-parser-source
      - id: metadata/lang/scripted::sbcl-core-zstd-error
