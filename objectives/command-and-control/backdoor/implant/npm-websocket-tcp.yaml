# A package runtime that registers itself with a controller and exposes a
# controller-selected TCP connection through a WebSocket is a remote proxy
# backdoor.  The capability atoms remain neutral and reusable.
defaults:
  platforms: [unix, windows]
  for: [npm]
  attack: "T1195.002,T1090,T1105"
  mbc: B0025

composite_rules:
  - id: npm-websocket-tcp-proxy-backdoor
    desc: npm runtime exposes a controller-managed WebSocket TCP proxy
    crit: hostile
    conf: 0.995
    scope: archive
    all:
      - id: metadata/package/manifest/entrypoint::has-exports-field
      - id: micro-behaviors/communications/http/url/external-ip::url-external-ip-script
      - id: micro-behaviors/communications/http/request/client::fetch-post-pattern
      - id: micro-behaviors/communications/websocket/library::ws
      - id: micro-behaviors/communications/proxy/tunnel::node-websocket-tcp-bridge
      - id: micro-behaviors/communications/http/websocket::websocket-constructor-call
