# Operator panel deletes offline implant records from the roster.
# This is C2 client-hygiene, not destructive disk wipe.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  attack: T1070.004

traits:
  - id: wipe-offline-clients-confirm
    desc: Wipe-all-offline-clients confirm prompt
    crit: notable
    conf: 0.94
    if:
      type: text
      substr: Remove ALL offline clients

  - id: wipe-offline-btn-id
    desc: Wipe offline clients button identifier
    crit: notable
    conf: 0.9
    if:
      type: text
      substr: wipe-offline-btn

composite_rules:
  - id: operator-wipe-offline-client-roster
    desc: Operator wipes offline implant roster
    crit: hostile
    conf: 0.96
    all:
      - id: micro-behaviors/communications/http/panel::api-clients-offline-path
      - id: wipe-offline-clients-confirm
      - id: wipe-offline-btn-id
      - id: micro-behaviors/communications/http/panel::api-clients-banned-ips-path
