defaults:
  platforms: [windows]
  for: [c, cpp]
  attack: T1071.001
  mbc: B0030

composite_rules:
  - id: c-masqueraded-export-socket-beacon
    desc: Masqueraded C export sends socket beacon
    crit: hostile
    conf: 0.96
    all:
      - id: objectives/evasion/masquerade/dll/proxy::source-curl-api-export
      - id: micro-behaviors/communications/socket/create::windows-tcp-socket-source
      - id: micro-behaviors/communications/socket/connect::connect-symbol
      - id: micro-behaviors/communications/socket/send::source-send-call
    any:
      - id: micro-behaviors/os/service/export::source-registerservice-export
