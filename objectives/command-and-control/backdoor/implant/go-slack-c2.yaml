defaults:
  platforms:
  - unix
  - windows
  for:
  - go
  attack: T1071.003,T1105,T1059
  mbc: B0030
traits:
- id: go-slack-helper-payload-launch
  desc: Writes and launches Slack payload content
  crit: suspicious
  conf: 0.98
  if:
    type: text
    regex: CreateFile\(savePath[\s\S]{0,200}StartChild\(savePath
- id: go-send-slack-message-call
  desc: Calls Slack message helper
  crit: notable
  conf: 0.94
  if:
    type: symbol
    kind: call
    exact: SendSlackMessage
composite_rules:
- id: go-slack-encrypted-command-channel
  for:
  - go
  - zip
  - tar
  desc: Slack chunk schema with decrypted-code launch
  crit: hostile
  conf: 0.995
  scope: archive
  all:
  - id: micro-behaviors/communications/http/services/slack::go-slack-history-auth-api-set
  - id: metadata/lang/source/syntax/annotation::go-json-t-id-d-tags
  - id: micro-behaviors/crypto/symmetric/aes/gcm::go-cipher-new-gcm
  - id: micro-behaviors/data/decode/base64::go-base64-decode-method
  any:
  - id: micro-behaviors/process/create/eval::go-open-result-node-code
  - id: go-slack-helper-payload-launch
- id: go-slack-downloaded-payload-execution
  for:
  - go
  - zip
  - tar
  desc: Go Slack implant assembles and launches remote payloads
  crit: hostile
  conf: 0.995
  scope: archive
  all:
  - id: micro-behaviors/communications/http/services/slack::go-slack-history-auth-api-set
  - id: go-slack-helper-payload-launch
  - id: micro-behaviors/process/create/subprocess::go-exec-command-call
- id: go-slack-host-profile-exfil
  for:
  - go
  - zip
  - tar
  desc: Go implant reports host identity through Slack
  crit: hostile
  conf: 0.99
  scope: archive
  attack: T1082,T1041,T1071.003
  all:
  - id: micro-behaviors/communications/http/services/slack::go-slack-api-base-url
  - id: go-send-slack-message-call
  - id: micro-behaviors/os/sysinfo/hostname::host-and-user-identity-query
