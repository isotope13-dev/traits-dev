# Implants that profile the victim before tasking: a jsjiami-concealed file
# carrying RSA key material that reports the host hardware address as an
# HTTP query parameter and moves cookie material in a request body field.
# Each leg is individually explainable, but the four together in one
# obfuscated file are the encrypted victim-profiling uplink of a backdoor:
# keyed crypto, host fingerprint, exfiltration over a stateful HTTP
# channel. Legitimate telemetry SDKs do not hide all of that behind a
# commercial JavaScript obfuscator.
defaults:
  crit: hostile
  platforms: [windows, unix]
  for: [javascript, typescript]
  attack: T1027,T1071.001,T1082
  mbc: B0032

composite_rules:
  - id: obfuscated-hardware-identity-uplink
    desc: Obfuscated file uplinks hardware identity over cookie session
    conf: 0.97
    scope: file
    unless:
      - id: metadata/package/testing/
      - id: "metadata/file/naming::test-directory-component"
    all:
      - id: objectives/anti-static/obfuscation/obfuscator/js-obfuscator::jsjiami-watermark
      - id: micro-behaviors/communications/http/message::urlencoded-mac-address-field
      - id: micro-behaviors/communications/http/cookies::cookie-value-body-field
      - id: micro-behaviors/crypto/key/representation::pem-public-key-header
