# Python build drivers for compiled bots: the script stamps a bot identity
# header (BOT_NAME/BOT_VERSION), encrypts the client's strings at build time,
# and wipes the PE Rich header from every output. Feature toggles such as a
# keylogger switch or a web-inject config shipped with the builder corroborate.
defaults:
  platforms: [windows]
  for: [python]
  attack: T1587.001

traits:
  - id: bot-identity-header-template
    desc: Generates BOT_NAME and BOT_VERSION defines
    crit: notable
    conf: 0.85
    if:
      type: text
      regex: '#define\s+BOT_NAME\b(?s:.){0,200}?#define\s+BOT_VERSION\b'

  - id: keylogger-build-toggle-define
    desc: Generates keylogger build-toggle macro
    crit: suspicious
    conf: 0.9
    if:
      type: text
      regex: '#define\s+[A-Z0-9_]*KEYLOGGER\b'

  - id: webinjects-config-file
    desc: References webinjects.txt bot config
    crit: suspicious
    conf: 0.85
    if:
      type: text
      regex: '(?i)\bwebinjects\.txt\b'

composite_rules:
  - id: encrypted-stripped-bot-builder
    desc: Bot builder encrypting strings and wiping Rich header
    crit: hostile
    conf: 0.95
    all:
      - id: bot-identity-header-template
      - id: objectives/anti-static/obfuscation/string/encrypt::rolling-xor-hex-escape-emitter
      - id: objectives/evasion/indicator-removal/structure::python-zero-dos-stub-to-lfanew
    any:
      - id: keylogger-build-toggle-define
      - id: webinjects-config-file
