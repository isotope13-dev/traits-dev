defaults:
  for: [pe]
  platforms: [windows]

composite_rules:
  - id: resource-keyboard-hook-c2-autostart
    desc: Embedded keyboard-hook resource with remote update sources and Run-key setup
    crit: hostile
    conf: 0.97
    attack: T1056.001,T1547.001
    all:
      - id: micro-behaviors/communications/url/host/name::dynamic-dns-hostname-freedns
      - id: micro-behaviors/communications/http/url/archive::executable-remote-archive-url
      - id: micro-behaviors/data/embedded/payload/resource::resource-command-process-io-profile
      - id: micro-behaviors/os/registry/manipulate::runkey-own-path-api-profile
      - id: micro-behaviors/ui/window/hook::windows-hook-lifecycle
