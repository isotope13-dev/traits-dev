# Preloaded command-execution shim: a shared object that, once injected via
# LD_PRELOAD, forks and runs commands through the C system API. There is no
# listener leg, so it is not a bind shell; the loadable dependency itself is
# the implant (cf. the dylib HTTP/command pair in this leaf). The discriminator
# is LD_PRELOAD plus fork plus system(): legitimate preload shims interpose
# calls but never fork off a shell. Standalone executables carry PT_INTERP;
# Node native addons are dlopen-loaded libraries, not preload shims.
defaults:
  platforms: [linux]
  for: [elf]
  crit: hostile
  conf: 0.96
  attack: "T1059.004"
  mbc: "B0022"

composite_rules:
  - id: ld-preload-forking-command-exec
    desc: Forking LD_PRELOAD library runs commands
    all:
      - id: micro-behaviors/os/linker/env::ld-preload
      - id: micro-behaviors/process/create/fork::fork
      - id: micro-behaviors/process/create/shell/spawn::system-fn
    unless:
      # Preload exploit payloads are shared objects (.so); standalone executables have PT_INTERP.
      - id: metadata/binary/linking/runtime::interpreter
      - id: well-known/app/ai/coding-agent/
      # Node native addons (.node) are shared libraries loaded via dlopen, not preload exploit shims.
      - id: metadata/binary/symbols/exports::node-api-addon-export
      - id: metadata/binary/framework::node-module-register-export
