defaults:
  platforms: [windows]
  for: [pe]
  arch: [x86-64]
traits:
  - id: c2-uninstall-request-diagnostic
    desc: C2 uninstall request diagnostic
    crit: notable
    if:
      type: text
      substr: 'c2 requested uninstall'
  - id: payload-keepalive-server-diagnostic
    desc: Payload keepalive server URL diagnostic
    crit: notable
    if:
      type: text
      substr: 'PayloadKeepAlive skipped: server URL is empty'
composite_rules:
  - id: http-ghosted-payload-keepalive
    desc: HTTP payload keepalive with ghosted-image loader
    crit: hostile
    conf: 0.98
    attack: T1071.001,T1055
    all:
      - id: c2-uninstall-request-diagnostic
      - id: payload-keepalive-server-diagnostic
      - id: micro-behaviors/communications/http/client/winhttp::winhttp-read-data
      - id: objectives/execution/payload/process-inject/hollowing/process::delete-pending-image-context-redirection
