defaults:
  platforms: [linux, macos, windows]
  for: [go]
traits:
  - id: go-c2-agent-struct-bot
    desc: Go struct representing a C2 agent/implant
    crit: notable
    conf: 0.85
    if:
      type: text
      regex: 'type\s+[A-Za-z0-9_]*Implant\s+struct|type\s+(C2Agent|RemoteAgent|C2Bot)\s+struct'
  # A struct named plainly `Victim` is as likely a GC or exploit regression
  # test fixture (Go's own test/fixedbugs) as an implant; require a name that
  # only makes sense for a compromised host record.
  - id: go-c2-agent-struct-victim
    desc: Go struct representing a C2 victim
    crit: notable
    conf: 0.85
    if:
      type: text
      regex: 'type\s+(\w*(C2|Bot|Agent)Victim|Victim(Info|Agent|Client|Host))\s+struct'
  - id: go-c2-agent-id-field
    desc: Go agent or bot ID field
    crit: baseline
    conf: 0.8
    if:
      type: text
      regex: '\b(AgentID|BotID)\s+string\b'
  - id: go-c2-agent-machine-field
    desc: Go struct field for machine HWID
    crit: baseline
    conf: 0.8
    if:
      type: text
      regex: '\b(MachineID|HWID)\s+string\b'
  - id: go-c2-agent-cwd-field
    desc: Go struct field for agent working directory
    crit: baseline
    conf: 0.8
    if:
      type: text
      regex: 'CWD\s+string'
  - id: go-c2-server-struct-c2
    desc: Go explicitly named C2 server struct
    crit: notable
    conf: 0.85
    if:
      type: text
      regex: 'type\s+(C2|C2Server|C2Controller|C2Manager)\s+struct'
  - id: go-c2-server-struct-command
    desc: Go agent command struct
    crit: notable
    conf: 0.85
    unless:
      - id: well-known/lib/network/go-telegram-bot-api::library-source-context
    if:
      type: text
      regex: 'type\s+[A-Za-z0-9_]*(Agent|Bot|Implant|Task)Command\s+struct'
  - id: go-c2-agent-host-field
    desc: Go agent host field fragment
    crit: notable
    conf: 0.86
    if:
      type: text
      regex: '(?m)^\s*host\s+Host\b'
  - id: go-c2-agent-process-field
    desc: Go agent process field fragment
    crit: notable
    conf: 0.86
    if:
      type: text
      regex: '(?m)^\s*process\s+Process\b'
  - id: go-c2-agent-struct-declaration
    desc: Go agent-like struct declaration
    crit: notable
    conf: 0.86
    if:
      type: text
      regex: 'type\s+[A-Za-z0-9_]*(C2Bot|Implant|Agent|Victim)\s+struct'
  - id: go-c2-agent-comms-field
    desc: Go agent comms field fragment
    crit: notable
    conf: 0.86
    if:
      type: text
      regex: '(?m)^\s*comms\s+Comms\b'
  - id: go-c2-agent-linked-field
    desc: Go linked agents field
    crit: notable
    conf: 0.84
    if:
      type: text
      regex: '\blinkedAgents\s+\[\]uuid\.UUID\b'
  - id: go-c2-agent-secret-byte-field
    desc: Go byte-slice secret field
    crit: component
    conf: 0.84
    if:
      type: text
      regex: '\bsecret\s+\[\]byte\b'
  - id: go-c2-agent-data-directory
    desc: Go C2 agent data dir
    crit: notable
    conf: 0.78
    if:
      type: text
      regex: 'filepath\.Join\(.{0,80}"data".{0,80}"agents"'
  - id: go-c2-deferred-update-func
    desc: Go deferred updater func
    crit: notable
    conf: 0.9
    if:
      type: symbol
      exact: writeDeferredUpdateBatch
  - id: go-c2-update-copy-line
    desc: Go updater copy line
    crit: notable
    conf: 0.82
    if:
      type: string_literal
      exact: '  copy /Y \"%SRC%\" \"%DST%\" >> \"%LOG%\" 2>&1 && (set \"COPIED=1\" & goto copied)'
  - id: go-c2-update-start-line
    desc: Go updater start line
    crit: notable
    conf: 0.82
    if:
      type: string_literal
      exact: '  start \"\" \"%DST%\" >> \"%LOG%\" 2>&1'
  - id: go-c2-update-delete-line
    desc: Go updater delete line
    crit: notable
    conf: 0.82
    if:
      type: string_literal
      exact: 'del /F /Q \"%~f0\" >NUL 2>&1'
  - id: go-c2-startup-target-func
    desc: Go startup target func
    crit: notable
    conf: 0.82
    if:
      type: symbol
      exact: startupTargetPath
  - id: go-c2-copy-executable-func
    desc: Go copies agent exe
    crit: notable
    conf: 0.82
    if:
      type: symbol
      exact: copyExecutableAtomic
  - id: go-c2-persistence-configure
    desc: Go configures persistence
    crit: notable
    conf: 0.82
    if:
      type: text
      substr: persistence.Configure(startupPath)
  # `micro-behaviors/process/create/flags::create-no-window` is a `type:
  # symbol` match scoped to Python's ctypes usage; it cannot see a Go source
  # file. Go's own idiom for the same Windows flag is `SysProcAttr{HideWindow:
  # true}` (which the runtime turns into CREATE_NO_WINDOW) or a direct
  # `windows.CREATE_NO_WINDOW` constant reference, so match that text instead.
  - id: go-create-no-window
    desc: Go process creation hides console window
    crit: notable
    conf: 0.85
    if:
      type: text
      regex: 'HideWindow:\s*true|CREATE_NO_WINDOW'
composite_rules:
  - id: go-c2-agent-struct
    desc: Go struct representing a C2 agent/implant
    crit: notable
    conf: 0.85
    any:
      - id: go-c2-agent-struct-bot
      - id: go-c2-agent-struct-victim
  - id: go-c2-agent-uuid-field
    desc: Go struct field for agent UUID/ID
    crit: baseline
    conf: 0.8
    any:
      - id: go-c2-agent-id-field
      - id: go-c2-agent-machine-field
  - id: go-c2-server-struct
    desc: Go struct representing a C2 server state
    crit: notable
    conf: 0.85
    any:
      - id: go-c2-server-struct-c2
      - id: go-c2-server-struct-command
  - id: go-c2-agent-definition
    desc: Go source defines C2 agent tracking structure
    crit: suspicious
    conf: 0.95
    attack: T1059
    mbc: B0022
    all:
      - id: go-c2-agent-struct
    any:
      - id: go-c2-agent-uuid-field
      - id: go-c2-agent-cwd-field
  - id: go-c2-agent-aggregate-definition
    desc: Go C2 agent state struct
    crit: suspicious
    conf: 0.94
    attack: T1059
    mbc: B0022
    all:
      - id: go-c2-agent-aggregate-fields
      - id: objectives/command-and-control/backdoor/listener::go-c2-agent-secret-listener-state
    any:
      - id: go-c2-agent-data-directory
  - id: go-c2-agent-any-definition
    desc: Go C2 agent tracking struct
    crit: suspicious
    conf: 0.94
    attack: T1059
    mbc: B0022
    any:
      - id: go-c2-agent-definition
      - id: go-c2-agent-aggregate-definition
  - id: go-c2-server-definition
    desc: Go source defines C2 server state structure
    crit: suspicious
    conf: 0.95
    attack: T1059
    mbc: B0022
    all:
      - id: go-c2-server-struct
    any:
      - id: micro-behaviors/data/source/syntax/schema::operator-typed-struct-field
    near_lines: 40
  - id: go-c2-framework-component
    desc: Go source implements C2 framework components (agent + server)
    crit: hostile
    conf: 0.98
    attack: T1059
    mbc: B0022
    all:
      - id: go-c2-agent-any-definition
      - id: go-c2-server-definition
  - id: go-c2-agent-aggregate-fields
    desc: Go C2 agent state fields
    crit: notable
    conf: 0.86
    near_lines: 14
    all:
      - id: go-c2-agent-host-field
      - id: go-c2-agent-struct-process-field
      - id: go-c2-agent-comms-field
  - id: go-c2-agent-struct-process-field
    desc: Go C2 agent struct process field
    crit: notable
    conf: 0.86
    all:
      - id: go-c2-agent-struct-declaration
      - id: go-c2-agent-process-field
    near_bytes: 1200
  - id: go-c2-agent-secret-field
    desc: Go C2-agent byte-slice secret field
    crit: component
    conf: 0.84
    all:
      - id: go-c2-agent-struct-declaration
      - id: go-c2-agent-secret-byte-field
    near_bytes: 2500
  - id: go-c2-deferred-agent-update-batch
    desc: Go deferred update batch
    crit: suspicious
    conf: 0.93
    all:
      - id: go-c2-deferred-update-func
      - id: go-c2-update-copy-line
      - id: go-c2-update-start-line
      - id: go-c2-update-delete-line
  - id: go-c2-agent-update-refreshes-startup
    desc: Go agent refreshes startup
    crit: suspicious
    conf: 0.9
    all:
      - id: go-c2-startup-target-func
      - id: go-c2-copy-executable-func
      - id: go-c2-persistence-configure
  - id: go-c2-conversation-chunk-manager
    desc: Go C2 chunked conversation
    crit: suspicious
    conf: 0.9
    all:
      - id: objectives/command-and-control/backdoor/listener::go-c2-conv-handle-init
      - id: objectives/command-and-control/backdoor/listener::go-c2-total-chunks-field
      - id: objectives/command-and-control/backdoor/listener::go-c2-status-packet-type
      - id: objectives/command-and-control/backdoor/listener::go-c2-acks-field
  - id: go-c2-rat-command-envelope-surveillance
    desc: Go RAT command envelope dispatches surveillance and control actions
    crit: hostile
    conf: 0.96
    attack: T1059,T1113,T1219
    mbc: B0022
    all:
      - id: micro-behaviors/data/serialize/envelope::map-string-interface-envelope
      - id: objectives/command-and-control/backdoor/control/command-vocab::go-c2-commandtype-envelope-field
    needs: 4
    any:
      - id: objectives/command-and-control/backdoor/control/command-vocab
  - id: go-c2-rat-interactive-desktop-control
    desc: Go RAT command dispatcher provides interactive desktop and hidden VNC control
    crit: hostile
    conf: 0.95
    attack: T1219,T1113
    mbc: B0022
    all:
      - id: objectives/command-and-control/backdoor/control/command-vocab::go-c2-commandtype-envelope-field
    any:
      - id: objectives/command-and-control/backdoor/control/command-vocab::go-c2-taskkill-image-command
  - id: go-c2-rat-keylog-script-control
    desc: Go RAT command dispatcher retrieves keylogs and executes supplied scripts
    crit: hostile
    conf: 0.94
    attack: T1056.001,T1059.001
    mbc: B0012,B0022
    all:
      - id: objectives/command-and-control/backdoor/control/command-vocab::go-c2-commandtype-envelope-field
    any:
      - id: objectives/command-and-control/backdoor/control/command-vocab::go-c2-script-exec-powershell-default
  - id: go-c2-agent-self-update-startup
    desc: Go agent refreshes startup
    crit: hostile
    conf: 0.96
    attack: T1105,T1547.001
    mbc: F0004
    all:
      - id: go-c2-deferred-agent-update-batch
      - id: go-c2-agent-update-refreshes-startup
  - id: go-c2-agent-self-update-hidden
    desc: Go agent relaunches hidden
    crit: hostile
    conf: 0.94
    attack: T1105
    mbc: F0004
    all:
      - id: go-c2-deferred-agent-update-batch
      - id: go-create-no-window
  - id: go-c2-agent-self-update-persistence
    desc: Go agent self-update persistence
    crit: suspicious
    conf: 0.96
    attack: T1105,T1547.001
    mbc: F0004
    any:
      - id: go-c2-agent-self-update-startup
      - id: go-c2-agent-self-update-hidden
