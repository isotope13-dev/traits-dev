# A Node.js program frozen into an executable with pkg keeps its script in
# a virtual C:\snapshot filesystem. When that script resolves its server
# from a GitHub Gist raw file, talks WebSocket and hides a PowerShell
# window, the bundle is a bot: the Gist is a dead-drop that lets the
# operator move the C2 without touching the binary.
defaults:
  platforms: [windows]
  for: [pe]
  attack: T1102.001,T1071.001,T1059.001
composite_rules:
  - id: pkg-node-gist-websocket-hidden-powershell-bot
    desc: pkg Node bot with Gist dead-drop and WebSocket
    crit: hostile
    conf: 0.85
    all:
      - id: micro-behaviors/fs/path/script::pkg-snapshot-entrypoint-path
      - id: micro-behaviors/communications/http/url/github::gist-githubusercontent-raw-binary-url
      - id: micro-behaviors/communications/websocket/library::websocket-class-reference
      - id: micro-behaviors/process/create/shell/command-flag::powershell-command-text
    unless:
      - id: metadata/signed/platform/
