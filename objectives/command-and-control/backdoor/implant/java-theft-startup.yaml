defaults:
  platforms: [windows, unix]
  for: [class]
traits:
  - id: theft-usb-command-server-class-set
    desc: Theft, USB-spread and command-server classes
    crit: suspicious
    conf: 0.97
    if:
      type: yara
      source: |
        rule theft_usb_command_server_class_set {
          strings:
            $stealer = "AccountStealer" ascii
            $usb = "USBSpread" ascii
            $command = "CommandPromptServer" ascii
            $tasks = "TaskChecker" ascii
          condition:
            uint32be(0) == 0xcafebabe and all of them
        }
composite_rules:
  - id: jvm-theft-usb-command-server-startup
    desc: JVM theft and USB-spread startup orchestrator
    crit: hostile
    conf: 0.98
    all:
      - id: theft-usb-command-server-class-set
      - id: metadata/import/jvm::accountstealer-load-member-reference
      - id: metadata/import/jvm::usbspread-member-reference
      - id: metadata/import/jvm::command-server-init-member-reference
