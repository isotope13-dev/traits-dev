defaults:
  platforms: [windows]
  for: [pe, dll]
composite_rules:
  # Remote administration alone can be legitimate. Here the native scan-status
  # patcher supplies the impairment evidence, alongside transport, monitoring
  # and reflective plugin execution. This is a capability conjunction; it does
  # not assert data flow from a particular received buffer to Assembly.Load.
  - id: managed-surveillance-plugin-agent-with-scan-patching
    desc: Managed surveillance agent with AMSI bypass
    crit: hostile
    conf: 0.98
    attack: T1219,T1620,T1113,T1562.001
    all:
      - id: objectives/evasion/anti-av/amsi::managed-cross-architecture-scan-status-patcher
      - id: micro-behaviors/communications/socket/tcp::networkstream-dotnet-str
      - id: micro-behaviors/process/interpreter/reflection/runtime::dotnet-appdomain-load-instance-tokens
      - id: micro-behaviors/hardware/display/screenshot::dotnet-copyfromscreen-capture
      - id: micro-behaviors/ui/window/enumerate::managed-active-window-title-api-set
  - id: managed-surveillance-plugin-agent
    desc: Plugin agent monitors activity and hides deletion
    crit: hostile
    conf: 0.96
    attack: T1219,T1620,T1070.004
    # A conjunction of independent roles: network client, dynamic plugin
    # dispatch, foreground/idle monitoring, and hidden delayed file deletion.
    # This is a static capability set, not a claimed receive-to-load data flow.
    # No family names, controller addresses, or chosen plugin names are required.
    all:
      - id: metadata/binary/framework::dotnet-assembly
      - id: metadata/lang/source/naming/function::dotnet-connect-async-method-token
      - id: micro-behaviors/communications/socket/receive::dotnet-receive-async-method-token
      - id: micro-behaviors/process/interpreter/reflection/runtime::dotnet-load-instance-dispatch-members
      - id: micro-behaviors/ui/window/enumerate::managed-active-window-title-api-set
      - id: micro-behaviors/hardware/input/idle-time::get-last-input-info
      - id: micro-behaviors/process/create/hidden::dotnet-hidden-process-launch-setup
      - id: micro-behaviors/fs/delete/file/command::choice-delayed-file-delete-command
