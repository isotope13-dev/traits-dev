defaults:
  platforms:
  - macos
  for:
  - macho
  attack: T1071.001,T1059.004
  mbc: B0030
composite_rules:
- id: dylib-http-client-command-exec
  desc: Dylib pairs an HTTP client with shell command execution
  crit: suspicious
  conf: 0.9
  all:
  - id: metadata/binary/header/identity::macho-dylib
  - id: metadata/binary/symbols/name/process::c-popen
  any:
  - id: micro-behaviors/communications/http/lib/nsurlsession::nsurlsession-class
  - id: micro-behaviors/communications/http/client/library::macos-libcurl-http
  needs: 1
- id: dylib-http-shell-hostname-profile
  desc: Dylib references HTTP, shell execution and hostname APIs
  crit: suspicious
  conf: 0.9
  attack: T1071.001,T1059.004,T1082
  all:
  - id: dylib-http-client-command-exec
  - id: micro-behaviors/os/sysinfo/hostname/query::gethostname
- id: dylib-initializer-http-shell-profile
  desc: Dylib has an initializer and HTTP and shell execution APIs
  crit: suspicious
  conf: 0.97
  attack: T1129,T1071.001,T1059.004
  all:
  - id: dylib-http-client-command-exec
  - id: micro-behaviors/process/lifecycle/auto-exec::macho-module-initializer
