defaults:
  platforms:
  - macos
  for:
  - macho
  attack: T1071.001,T1059.004
  mbc: B0030
composite_rules:
- id: aws-sdk-cpp-embedded-diagnostics
  desc: Dylib statically embeds AWS SDK C++ or AWS CRT diagnostics
  crit: exception
  conf: 0.93
  any:
  - id: well-known/lib/cloud/aws-sdk-cpp::osversioninfo-sys-command-output
  - id: well-known/lib/cloud/aws-crt::aws-c-common-run-command
  - id: well-known/lib/cloud/aws-crt::aws-crt-library-context
- id: openms-embedded-diagnostics
  desc: Dylib embeds OpenMS ConsoleUtils terminal-width query
  crit: exception
  conf: 0.95
  any:
  - id: well-known/lib/data/openms::console-utils-read-console-size
  - id: well-known/lib/data/openms::openms-library-context
- id: mlx-embedded-metal-jit
  desc: Dylib embeds the Apple MLX Metal kernel JIT toolchain
  crit: exception
  conf: 0.9
  any:
  - id: well-known/lib/ai/mlx::mlx-kernel-jit-compile-command
  - id: well-known/lib/ai/mlx::mlx-metallib-resource
  - id: well-known/lib/ai/mlx::mlx-core-symbols
- id: dylib-http-client-command-exec
  desc: Dylib pairs an HTTP client with shell command execution
  crit: suspicious
  conf: 0.9
  all:
  - id: metadata/binary/header/identity::macho-dylib
  - id: micro-behaviors/process/create/shell/native::c-popen
  any:
  - id: micro-behaviors/communications/http/lib/nsurlsession::nsurlsession-class
  - id: micro-behaviors/communications/http/download/curl::macos-libcurl-http
  needs: 1
  unless:
  - id: well-known/lib/runtime
  - id: aws-sdk-cpp-embedded-diagnostics
  - id: openms-embedded-diagnostics
  - id: mlx-embedded-metal-jit
  - id: well-known/lib/ui/tinyfiledialogs/
  - id: well-known/lib/vendor-sdk/alibaba-securityguard::securityguard-macos-library
- id: dylib-implant-beacon-exec-recon
  desc: Dylib implant beacons, runs commands, and fingerprints the host
  crit: hostile
  conf: 0.9
  attack: T1071.001,T1059.004,T1082
  all:
  - id: dylib-http-client-command-exec
  - id: micro-behaviors/os/sysinfo/hostname::gethostname
- id: dylib-load-time-http-command-exec
  desc: Dylib initializer performs HTTP and shell command execution
  crit: hostile
  conf: 0.97
  attack: T1129,T1071.001,T1059.004
  all:
  - id: dylib-http-client-command-exec
  - id: micro-behaviors/process/lifecycle/auto-exec::macho-module-initializer
