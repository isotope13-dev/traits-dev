# A Java source path that literally names its emitted library as a backdoor is
# intent-bearing. Restrict this to an actual Paths.get call so documentation or
# a stray filename mention does not become a finding.
defaults:
  platforms: [windows]
  for: [java]

traits:
  - id: java-backdoor-library-output-path
    desc: Java constructs backdoor-labeled output path
    crit: suspicious
    conf: 0.98
    if:
      type: text
      regex: '(?i)\bPaths\.get\(\s*["'']Backdoor\.(dll|exe|jar)["'']\s*\)'
