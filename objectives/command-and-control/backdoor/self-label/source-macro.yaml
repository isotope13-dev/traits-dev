# Source-level backdoor self-labels.
defaults:
  platforms: [windows, unix]
  for: [c, cpp]
traits:
  - id: backdoor-macro-def
    desc: C macro defining a backdoor constant
    crit: suspicious
    if:
      type: text
      regex: '#define\s+[A-Z0-9_]*BACKDOOR(_[A-Z0-9_]+)?\s+'
    not:
      - regex: '#define\s+VMW(ARE)?_BACKDOOR(_[A-Z0-9_]+)?\s+'
      # RFID/security-card implementations use BACKDOOR_KEY constants for
      # protocol recovery keys; that is not a software backdoor self-label.
      # Widened past a literal `BACKDOOR_KEY`: MIFARE Classic's documented
      # FM11RF08S commands are `MF_CLASSIC_CMD_BACKDOOR_AUTH_KEY_A`/`_B`
      # (0x64/0x65), which the flipper firmwares define verbatim.
      - regex: '#define\s+[A-Z0-9_]*BACKDOOR_[A-Z0-9_]*KEY[A-Z0-9_]*\s+'
    unless:
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-source-context
      - id: metadata/lang/upstream::linux-kernel-source-tree-path
