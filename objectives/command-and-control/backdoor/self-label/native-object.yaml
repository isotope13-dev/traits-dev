defaults:
  platforms: [linux]
  for: [elf]
  crit: suspicious
  conf: 0.9

composite_rules:
  - id: elf-object-backdoor-socket-hints
    desc: Backdoor-labeled object carries socket hints
    all:
      - id: metadata/binary/header/identity::elf-relocatable-object
      - id: objectives/command-and-control/backdoor/keywords::backdoor-word
      - id: micro-behaviors/communications/socket/create::posix-socket-import
