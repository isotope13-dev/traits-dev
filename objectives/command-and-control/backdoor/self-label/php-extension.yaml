# PHP extension build configs that self-label as backdoors (config.m4).
defaults:
  platforms: [unix]
  for: [text]
  attack: T1505.003
  crit: notable
  conf: 0.96

traits:
  - id: php-new-extension-backdoor-source
    desc: PHP_NEW_EXTENSION compiles backdoor.c
    crit: suspicious
    conf: 0.98
    if:
      type: text
      regex: '\bPHP_NEW_EXTENSION\s*\([^)]{0,80}\bbackdoor\.c\b'

  - id: php-arg-enable-back-extension
    desc: PHP_ARG_ENABLE enables a back extension
    crit: suspicious
    conf: 0.94
    if:
      type: text
      regex: '\bPHP_ARG_ENABLE\s*\(\s*back(door)?\s*,'

composite_rules:
  - id: php-extension-backdoor-source-build
    desc: PHP extension build compiles backdoor.c
    crit: hostile
    conf: 0.99
    all:
      - id: metadata/build/autotools::php-new-extension-macro
      - id: php-new-extension-backdoor-source

  - id: php-config-m4-backdoor-extension
    desc: config.m4 builds a PHP backdoor extension
    crit: hostile
    conf: 0.99
    all:
      - id: metadata/build/autotools::php-config-m4-basename
      - id: php-new-extension-backdoor-source

  - id: php-arg-enable-backdoor-extension-build
    desc: PHP_ARG_ENABLE pairs with backdoor.c build
    crit: hostile
    conf: 0.98
    all:
      - id: php-arg-enable-back-extension
      - id: php-new-extension-backdoor-source
