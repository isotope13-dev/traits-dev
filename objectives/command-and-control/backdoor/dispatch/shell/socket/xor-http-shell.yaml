defaults:
  platforms: [windows]
  for: [pe]
composite_rules:
  # Required concealed endpoint/API evidence and shell-output code distinguish
  # this implant profile from an ordinary HTTP client with a cmd.exe string.
  # This is static code evidence, not proof of a live C2 connection.
  - id: xor-http-shell-command-interface
    desc: Concealed HTTP endpoints with shell-output command code
    crit: hostile
    conf: 0.97
    attack: T1059.003,T1071.001
    all:
      - id: objectives/anti-static/obfuscation/decoders::xor-encoded-api-table
      - id: micro-behaviors/communications/http/url/domain::xor-decoded-http-url
      - id: micro-behaviors/communications/http/post::post-template-pe
      - id: metadata/binary/instruction/sequence::x86-shared-output-startup-flags
      - id: micro-behaviors/process/create/shell/command-mode::windows-command-shell-invocation
      - id: micro-behaviors/process/create/exec::create-process-a
      - id: micro-behaviors/communications/ipc/pipe::create-pipe
      - id: micro-behaviors/fs/read/file/handle::read-file
