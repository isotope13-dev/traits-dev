---
defaults:
  for:
  - pe
  - dll
  platforms:
  - windows
composite_rules:
- id: winsock-proxy-connect-command-backdoor
  desc: Winsock proxy CONNECT C2 with command backdoor
  crit: hostile
  conf: 0.94
  attack: T1071.001
  all:
  - id: micro-behaviors/fs/path/system/library::ws2-32-dll-marker
  - id: micro-behaviors/communications/http/request/proxy::http-proxy-connect-auth-tunnel
  any:
  - id: micro-behaviors/process/argument/interpreter::cmd-slash-c
  - id: micro-behaviors/os/security/firewall::windows-firewall-authorizedapps-write-chain
  - id: micro-behaviors/process/sync/mutex::mutex-instance-check
  needs: 2
  downgrade:
    any:
    - id: metadata/filename/name-form::is-microsoft-named
    - id: well-known/app/security/defender/
    - id: metadata/vendor/identity::microsoft-corp-versioninfo
