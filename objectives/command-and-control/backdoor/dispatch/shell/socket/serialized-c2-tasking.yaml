defaults:
  platforms: [linux, macos, windows]
  for: [binaries, go, rust, python]
  attack: T1059,T1071,T1573,T1090
  mbc: B0022,C0002

composite_rules:
  - id: encrypted-serialized-job-tunnel-agent
    desc: Encrypted C2 agent with serialized tasking
    crit: hostile
    conf: 0.98
    scope: leaf
    all:
      - id: micro-behaviors/data/serialize/envelope::serialized-task-job-dispatch-envelope
      - id: micro-behaviors/data/serialize/envelope::encrypted-endpoint-profile-schema
      - id: micro-behaviors/data/serialize/schema-system::serialized-host-privilege-recon-schema
    any:
      - id: metadata/binary/symbols/name/process::go-os-exec-package-reference
      - id: metadata/binary/symbols/name/qualified/execution::go-native-exec-command-reference
      - id: micro-behaviors/process/create/
