defaults:
  platforms: [linux]
  for: [elf]
traits:
  - id: shell-start-frame-token
    desc: Shell session start frame token
    crit: component
    if: {type: text, substr: SHSTART}
  - id: shell-size-frame-token
    desc: Shell terminal resize frame token
    crit: component
    if: {type: text, substr: SHSIZE}
  - id: shell-end-frame-token
    desc: Shell session end frame token
    crit: component
    if: {type: text, substr: SHEND}
  - id: shell-pty-capability-advertisement
    desc: Advertises PTY and shell resize support
    crit: notable
    if: {type: text, substr: 'pty,ustall,shsize'}
composite_rules:
  - id: shell-session-frame-cluster
    desc: Shell start, resize and end protocol tokens
    crit: notable
    near_bytes: 64
    all:
      - id: shell-start-frame-token
      - id: shell-size-frame-token
      - id: shell-end-frame-token
  - id: native-framed-shell-agent
    desc: Native shell agent with session tasking protocol
    crit: hostile
    conf: 0.98
    attack: T1059.004
    all:
      - id: shell-session-frame-cluster
      - id: shell-pty-capability-advertisement
      - id: micro-behaviors/fs/path/application/interpreter::bin-sh-rodata-substring
      - id: micro-behaviors/process/replace::syscall-execve-elf
