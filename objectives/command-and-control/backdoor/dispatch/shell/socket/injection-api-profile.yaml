# The API table supports a reference profile, not a performed injection or
# evasion path. The required HTTP-shell finding supplies the hostile admission.
# Preserve the original matcher and severity while correcting its claim/home.
# The only old ancestor consumer is PowerShell-only Empire, outside this PE
# rule's scope. The new C2 ancestor consumer already sees the required shell.
defaults:
  platforms: [windows]
  for: [pe, dll]
composite_rules:
- id: http-shell-remote-injection-api-profile
  desc: HTTP shell with remote-injection API references
  crit: hostile
  conf: 0.97
  attack: T1071.001
  all:
  - id: objectives/command-and-control/backdoor/dispatch/shell/socket::xor-http-shell-command-interface
  - id: micro-behaviors/process/inject/remote-thread::remote-alloc-write-thread-api-set
