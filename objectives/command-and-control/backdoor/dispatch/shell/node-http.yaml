# HTTP services that disable authentication when a token is unset, decode a
# request header, and hand an object-provided command to Bash expose a complete
# unauthenticated remote shell dispatch path.
defaults:
  platforms: [unix]
  for: [javascript, typescript, npm]
  attack: T1059.004,T1071.001
  mbc: B0030

composite_rules:
  - id: node-http-job-shell-dispatch
    desc: Unauthenticated HTTP jobs dispatch Bash command
    crit: hostile
    conf: 0.99
    scope: file
    all:
      - id: micro-behaviors/communications/http/server/listener::nodejs-http-imported-create-server
      - id: micro-behaviors/communications/http/header/custom::base64-json-request-header
      - id: micro-behaviors/process/create/shell/bridge::node-bash-lc-member-command
      - id: micro-behaviors/os/security/auth/verify::optional-token-request-auth
