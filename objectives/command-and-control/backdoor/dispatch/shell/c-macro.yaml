# Source-level command dispatch hidden behind C preprocessor macros.
defaults:
  platforms: [unix, windows]
  for: [c, cpp]
  attack: T1059.004
  mbc: B0022

traits:
  # The macro name must be written in the all-caps convention and must carry a
  # command-execution token. The former case-insensitive form matched any
  # camelCase function whose name merely contained "log"/"system"/"cmd", so
  # ordinary platform code called it: `CRSetCrashLogMessage(buffer)` in
  # libc++abi, `WriteToSyslog(buffer)` in the sanitizer runtime, and
  # `MmGetSystemAddressForMdl(_Buffer)` in the Windows DDK headers all hit it.
  # `LOG` is dropped outright — a logging macro that takes a buffer is not
  # command dispatch, which is the objective this directory models.
  - id: input-buffer-command-forwarder
    desc: Command-exec macro called with a buffer arg
    crit: suspicious
    conf: 0.94
    if:
      type: text
      regex: '(^|[^A-Z0-9_])[A-Z0-9_]{0,24}(EXEC|CMD|SYSTEM)\s*\(\s*\w*[Bb]uf\w*\s*\)'

composite_rules:
  - id: debug-macro-system-wrapper
    desc: DEBUG macro hides system command execution
    crit: suspicious
    conf: 0.98
    size_max: 500000
    all:
      - id: micro-behaviors/process/create/shell/native::c-debug-system-macro-wrapper
      - id: micro-behaviors/data/source/syntax/directive::ifdef-debug-build-guard

  - id: debug-macro-input-dispatch
    desc: DEBUG-gated buffer reaches command macro
    crit: hostile
    conf: 0.98
    size_max: 500000
    all:
      - id: micro-behaviors/data/source/syntax/directive::ifdef-debug-build-guard
      - id: micro-behaviors/data/buffer::short-prefix-comparison
      - id: input-buffer-command-forwarder

  # The same backdoor split across two files, which is how it is actually
  # shipped. UnrealIRCd 3.2.8.1 (2010) put the macro chain in `include/struct.h`
  #
  #   #define DEBUG3_LOG(x)          DEBUG3_DOLOG_SYSTEM (x)
  #   #define DEBUG3_DOLOG_SYSTEM(x) system(x)
  #
  # and the trigger in `src/s_bsd.c`, inside the raw read path:
  #
  #   if (!memcmp(readbuf, DEBUGMODE3_INFO, 2)) DEBUG3_LOG(readbuf);
  #
  # The file-scoped rules above can never see both halves, and the call site
  # spells no EXEC/CMD/SYSTEM token, so `input-buffer-command-forwarder` misses
  # it. At archive scope the pair is unambiguous: a source tree whose debug
  # macro expands to system(), and which elsewhere tests a two-byte prefix of a
  # network read buffer, is carrying a protocol-triggered command backdoor.
  - id: source-tree-debug-macro-command-trigger
    desc: Source tree pairs a system macro with a byte trigger
    crit: hostile
    conf: 0.96
    scope: archive
    for: [c, cpp, tar, archives]
    all:
      - id: micro-behaviors/process/create/shell/native::c-debug-system-macro-wrapper
      - id: micro-behaviors/data/buffer::short-prefix-comparison
    # No test-context `unless:` here. At archive scope every real source tree
    # ships a tests/ directory, so the usual exclusion would suppress the rule
    # on exactly the artifacts it exists for.
