# Source-level command dispatch hidden behind C preprocessor macros.
defaults:
  platforms: [unix, windows]
  for: [c, cpp]
  attack: T1059.004
  mbc: B0022

traits:
  # The macro name must be written in the all-caps convention and must carry a
  # command-execution token. The former case-insensitive form matched any
  # camelCase function whose name merely contained "log"/"system"/"cmd", so
  # ordinary platform code called it: `CRSetCrashLogMessage(buffer)` in
  # libc++abi, `WriteToSyslog(buffer)` in the sanitizer runtime, and
  # `MmGetSystemAddressForMdl(_Buffer)` in the Windows DDK headers all hit it.
  # `LOG` is dropped outright — a logging macro that takes a buffer is not
  # command dispatch, which is the objective this directory models.
  - id: input-buffer-command-forwarder
    desc: Command-exec macro called with a buffer arg
    crit: suspicious
    conf: 0.94
    if:
      type: text
      regex: '(^|[^A-Z0-9_])[A-Z0-9_]{0,24}(EXEC|CMD|SYSTEM)\s*\(\s*\w*[Bb]uf\w*\s*\)'

composite_rules:
  - id: debug-macro-system-wrapper
    desc: DEBUG macro hides system command execution
    crit: suspicious
    conf: 0.98
    size_max: 500000
    all:
      - id: micro-behaviors/process/create/shell/native::c-debug-system-macro-wrapper
      - id: micro-behaviors/data/source/syntax/directive::ifdef-debug-build-guard

  - id: debug-macro-input-dispatch
    desc: DEBUG-gated buffer reaches command macro
    crit: hostile
    conf: 0.98
    size_max: 500000
    all:
      - id: micro-behaviors/data/source/syntax/directive::ifdef-debug-build-guard
      - id: micro-behaviors/data/buffer::short-prefix-comparison
      - id: input-buffer-command-forwarder
