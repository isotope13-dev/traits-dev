# Source-level command dispatch hidden behind C preprocessor macros.
defaults:
  platforms: [unix, windows]
  for: [c, cpp]
  attack: T1059.004
  mbc: B0022

traits:
  - id: debug-conditional-macro
    desc: C DEBUG conditional compilation
    crit: notable
    conf: 0.86
    if:
      type: text
      regex: '(?im)^\s*#\s*ifdef\s+\w*DEBUG\w*\b'

  - id: input-buffer-command-forwarder
    desc: C buffer reaches command macro
    crit: suspicious
    conf: 0.94
    if:
      type: text
      regex: '(?is)\b[A-Z]\w*(LOG|EXEC|CMD|SYSTEM)\w*\s*\(\s*\w*buf\w*\s*\)'

composite_rules:
  - id: debug-macro-system-wrapper
    desc: DEBUG macro hides system command execution
    crit: suspicious
    conf: 0.98
    size_max: 500000
    all:
      - id: micro-behaviors/process/create/shell/native::c-debug-system-macro-wrapper
      - id: debug-conditional-macro

  - id: debug-macro-input-dispatch
    desc: DEBUG-gated buffer reaches command macro
    crit: hostile
    conf: 0.98
    size_max: 500000
    all:
      - id: debug-conditional-macro
      - id: micro-behaviors/process/create/shell/native::c-short-magic-prefix-compare
      - id: input-buffer-command-forwarder
