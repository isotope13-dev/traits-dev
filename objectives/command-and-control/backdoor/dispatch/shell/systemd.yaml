defaults:
  platforms: [linux]
  for: [elf, so]
  attack: "T1059.004,T1195.002"
  mbc: "B0022,B0024"

composite_rules:
  - id: systemd-terminal-socket-command-channel
    desc: Trojanized systemd library exposing a terminal socket command channel
    crit: hostile
    conf: 0.98
    all:
      - id: well-known/lib/systemd::systemd-shared-library
      - id: objectives/command-and-control/reverse-shell/dup::unix-terminal-socket-exec-backdoor
      - id: micro-behaviors/communications/socket/listen::listen
