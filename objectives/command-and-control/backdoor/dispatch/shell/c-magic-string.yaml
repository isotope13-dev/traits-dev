# A trojanized string routine that watches scanned input for a magic
# two-byte sequence written as hex literals -- so the trigger never appears
# as text in the source -- and calls an out-of-place function when it sees it.
#
# The dispatch is what makes the backdoor a backdoor: the bind shell it calls
# is ordinary socket code on its own, and the scanner is an ordinary string
# routine until the hex pair turns it into a tripwire. The classic spelling
# scans a username for `:)` as 0x3a/0x29.
#
# Worked example: the trojanized vsftpd 2.3.4, whose `str_contains_space`
# calls `vsf_sysutil_extra()` -- bind :6200, dup2, execl("/bin/sh") -- the
# moment a login name contains the hex-written smiley.
defaults:
  platforms: [unix]
  for: [c, cpp]
  attack: T1059.004,T1543
  mbc: B0022

traits:
  - id: hex-magic-pair-scan
    desc: Hex literals compared in a scan loop
    crit: component
    conf: 0.9
    if:
      type: text
      regex: '==\s*0x[0-9a-f]{2}\)[\s\S]{0,8}&&[\s\S]{0,40}\[\w+\s*\+\s*1\s*\]\s*==\s*0x[0-9a-f]{2}'

composite_rules:
  - id: source-magic-byte-dispatch-trigger
    desc: Input scan dispatches on magic byte pair
    crit: hostile
    conf: 0.96
    scope: archive
    all:
      - id: hex-magic-pair-scan
      # The dispatched destination: a direct program exec in the same source
      # tree. The pair alone -- tripwire scanner, exec elsewhere -- is the
      # trojan's shape; nothing legitimate hides its trigger this way.
      - id: micro-behaviors/process/create/execv::c-exec-family-source
