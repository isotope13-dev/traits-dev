defaults:
  platforms: [android]
  for: [kotlin]
  attack: T1059
  mbc: B0022

composite_rules:
  - id: kotlin-webview-root-shell-bridge
    desc: Kotlin WebView exposes root shell bridge
    crit: suspicious
    conf: 0.95
    all:
      - id: micro-behaviors/process/interpreter/webview::source-javascript-interface-import
      - id: micro-behaviors/process/create/root-shell::exec-function
      - id: micro-behaviors/process/create/root-shell::root-shell-call
    any:
      - id: micro-behaviors/process/create/root-shell::root-shell-helper-import
      - id: micro-behaviors/process/create/root-shell-output::root-shell-job-call
      - id: micro-behaviors/process/interpreter/webview::kotlin-javascript-callback-loadurl
      - id: micro-behaviors/process/create/root-shell-output::shell-stdout-bridge
    needs: 2
    unless:
      - id: well-known/dual-use/access-control/kernelsu::manager-package-marker

  - id: kotlin-webview-root-shell-command-dispatch
    desc: Kotlin WebView dispatches root shell commands
    crit: hostile
    conf: 0.96
    all:
      - id: micro-behaviors/process/interpreter/webview::source-javascript-interface-import
      - id: micro-behaviors/process/create/root-shell::exec-function
      - id: micro-behaviors/process/create/root-shell::root-shell-call
      - id: micro-behaviors/process/create/root-shell::root-shell-helper-import
      - id: micro-behaviors/process/create/root-shell-output::root-shell-job-call
      - id: micro-behaviors/process/interpreter/webview::kotlin-javascript-callback-loadurl
    unless:
      - id: well-known/dual-use/access-control/kernelsu::manager-package-marker
