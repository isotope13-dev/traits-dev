# A structured Node.js dispatcher that maps both exec and shell actions to
# child-process creation.  The action labels are partial command vocabulary;
# requiring the object-field switch and process API establishes tasking intent.
defaults:
  platforms: [unix, windows, fortios]
  for: [javascript, typescript]
  attack: T1059.007
  mbc: B0030

composite_rules:
  - id: node-exec-shell-command-dispatch
    desc: Type dispatcher exposes exec and shell
    crit: suspicious
    conf: 0.98
    near_bytes: 4096
    all:
      - id: micro-behaviors/data/control-flow/dispatch::object-type-dispatch-switch
      - id: objectives/command-and-control/backdoor/control/command-vocab::cmd-vocab-exec-case-label
      - id: objectives/command-and-control/backdoor/control/command-vocab::cmd-vocab-shell-case-label
      - id: micro-behaviors/process/create/spawn::spawn-call
