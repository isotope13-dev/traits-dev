defaults:
  platforms: [windows]
  for: [pe, dll]
traits:
  - id: remote-shell-input-task
    desc: RAT shell-input task token runnnnnn
    crit: notable
    conf: 0.98
    if:
      type: text
      exact: runnnnnn
  - id: remote-shell-close-task
    desc: RAT shell-session close task token
    crit: notable
    conf: 0.96
    if:
      type: text
      exact: closeshell
composite_rules:
  - id: managed-tasked-redirected-shell
    desc: Managed RAT shell tasking with redirected stdin and stdout
    crit: hostile
    conf: 0.99
    attack: T1059.003
    all:
      - id: metadata/binary/framework::dotnet-assembly
      - id: remote-shell-input-task
      - id: remote-shell-close-task
      - id: micro-behaviors/fs/path/application/executable::cmd-exe-image-name
      - id: micro-behaviors/process/create/spawn::redirect-standard-input-dotnet
      - id: micro-behaviors/process/create/spawn::redirect-standard-output-dotnet
      - id: micro-behaviors/process/create/spawn::redirect-standard-error-dotnet
