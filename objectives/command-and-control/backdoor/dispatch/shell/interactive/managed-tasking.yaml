defaults:
  platforms: [windows]
  for: [pe, dll]
traits:
  - id: remote-shell-input-task
    desc: RAT shell-input task token
    crit: notable
    conf: 0.98
    if:
      type: text
      regex: '^run(n{5}|shell)$'
  - id: remote-shell-close-task
    desc: RAT shell-session close task token
    crit: notable
    conf: 0.96
    if:
      type: text
      exact: closeshell
composite_rules:
  - id: managed-shell-task-vocabulary
    desc: Shell-input and shell-close task vocabulary
    crit: notable
    conf: 0.98
    all:
      - id: remote-shell-input-task
      - id: remote-shell-close-task
  - id: managed-tasked-redirected-shell
    desc: Managed socket and redirected-shell tasking
    crit: hostile
    conf: 0.99
    attack: T1059.003
    all:
      - id: metadata/lang/compiler/managed::dotnet-assembly
      - id: micro-behaviors/fs/path/application/interpreter::cmd-exe-image-name
      - id: micro-behaviors/process/fd/stdio::dotnet-stdin-redirection-reference
      - id: micro-behaviors/process/fd/stdio::dotnet-stdout-redirection-reference
      - id: micro-behaviors/process/fd/stdio::dotnet-stderr-redirection-reference
      # Protocol words and unused redirection imports survive in inert
      # fixtures. Require the retained input-write code and socket call.
      - id: micro-behaviors/process/stdio/write::managed-field-array-child-input
      - id: micro-behaviors/communications/socket/receive::dotnet-socket-receive-call
