defaults:
  platforms: [android]
  for: [kotlin]
  attack: T1059
  mbc: B0022

composite_rules:
  - id: objectives/command-and-control/backdoor/dispatch/shell/interactive::kotlin-webview-root-shell-bridge
    desc: Kotlin WebView exposes root shell bridge
    crit: suspicious
    conf: 0.95
    all:
      - id: metadata/import/library::source-javascript-interface-import
      - id: metadata/lang/source/naming/function/command::exec-function
      - id: micro-behaviors/os/privilege/elevation::root-shell-call
    any:
      - id: metadata/import/jvm::kotlin-root-or-shellutils-import
      - id: metadata/lang/source/syntax/call/member::kotlin-newjob-call
      - id: micro-behaviors/ui/window/webview::android-loadurl-javascript-text
      - id: metadata/lang/source/literal/string/label::kotlin-stdout-literal
    needs: 2
    unless:
      - id: well-known/dual-use/access-control/kernelsu::manager-package-marker

  - id: objectives/command-and-control/backdoor/dispatch/shell/interactive::kotlin-webview-root-shell-command-dispatch
    desc: Kotlin WebView dispatches root shell commands
    crit: hostile
    conf: 0.96
    all:
      - id: metadata/import/library::source-javascript-interface-import
      - id: metadata/lang/source/naming/function/command::exec-function
      - id: micro-behaviors/os/privilege/elevation::root-shell-call
      - id: metadata/import/jvm::kotlin-root-or-shellutils-import
      - id: metadata/lang/source/syntax/call/member::kotlin-newjob-call
      - id: micro-behaviors/ui/window/webview::android-loadurl-javascript-text
    unless:
      - id: well-known/dual-use/access-control/kernelsu::manager-package-marker
