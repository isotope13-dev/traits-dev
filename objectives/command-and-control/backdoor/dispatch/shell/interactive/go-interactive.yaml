defaults:
  crit: suspicious
  conf: 0.85
  platforms: [windows, linux, macos]
  for: [elf, macho, pe]
  mbc: B0030
  attack: T1059.004
traits:
  - id: objectives/command-and-control/backdoor/dispatch/shell/interactive::interactive-shell-string-interactive
    desc: Interactive shell mode strings
    if:
      type: text
      word: interactive_shell
    unless:
      - id: metadata/file/string/identity::system-shell-basename
      - id: metadata/file/string/identity::shell-loadable-builtin-path
      - id: "metadata/file/naming::test-directory-component"
      - id: metadata/package/testing/presence/harness::binary-test-directory
      - id: well-known/tool/development/agent/reason-machines::reason-machines-agent-context
  - id: objectives/command-and-control/backdoor/dispatch/shell/interactive::interactive-shell-string-exec-shell
    desc: Interactive shell mode strings
    if:
      type: text
      word: Exec_shell
  - id: objectives/command-and-control/backdoor/dispatch/shell/interactive::interactive-shell-string-execshell
    desc: Interactive shell mode strings
    if:
      type: text
      word: execShell
    unless:
      - id: well-known/tool/detection/malcontent::malcontent-defensive-scanner-context
composite_rules:
  - id: objectives/command-and-control/backdoor/dispatch/shell/interactive::interactive-shell-string
    desc: Interactive shell mode strings
    any:
      - id: objectives/command-and-control/backdoor/dispatch/shell/interactive::interactive-shell-string-interactive
      - id: objectives/command-and-control/backdoor/dispatch/shell/interactive::interactive-shell-string-exec-shell
      - id: objectives/command-and-control/backdoor/dispatch/shell/interactive::interactive-shell-string-execshell
