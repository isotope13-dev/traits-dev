defaults:
  platforms: [android]
  for: [dex]
  attack: T1059,T1437,T1433
composite_rules:
  # Co-located call sites indicate a tasking cluster, not proven data flow.
  - id: android-socket-command-sms-tasking-cluster
    desc: Socket, command execution and SMS tasking call cluster
    crit: hostile
    conf: 0.96
    near_bytes: 16384
    all:
      - id: micro-behaviors/communications/messaging/send::dex-socket-input-call
      - id: micro-behaviors/communications/messaging/send::dex-socket-output-call
      - id: micro-behaviors/communications/messaging/send::dex-command-executor-call
      - id: micro-behaviors/communications/messaging/send::dex-sms-sender-helper-call
      - id: micro-behaviors/process/create/subprocess/launch::dex-runtime-exec-call
      - id: micro-behaviors/communications/messaging/send::dex-sms-send-text-call

  - id: android-mqtt-remote-command-and-script-dispatch
    desc: Dispatches MQTT script, cmd, and install tasks
    crit: hostile
    conf: 0.98
    for: [android_apk, apk_android, apk, zip, dex]
    all:
      - id: micro-behaviors/communications/messaging/send::dex-mqtt-function-script-topic
      - id: micro-behaviors/communications/messaging/send::dex-mqtt-function-cmd-topic
      - id: micro-behaviors/communications/messaging/send::dex-mqtt-function-app-install-topic
      - id: micro-behaviors/communications/messaging/send::dex-mqtt-function-remote-control-topic
      - id: micro-behaviors/process/create/subprocess/launch::dex-runtime-exec-call
