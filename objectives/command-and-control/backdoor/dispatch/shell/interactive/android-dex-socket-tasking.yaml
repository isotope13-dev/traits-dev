defaults:
  platforms: [android]
  for: [dex]
  attack: T1059,T1437,T1433
traits:
  - id: dex-socket-input-call
    desc: DEX gets socket input stream
    crit: notable
    conf: 0.98
    if:
      type: symbol
      kind: call
      exact: 'Ljava/net/Socket;->getInputStream'
  - id: dex-socket-output-call
    desc: DEX gets socket output stream
    crit: notable
    conf: 0.98
    if:
      type: symbol
      kind: call
      exact: 'Ljava/net/Socket;->getOutputStream'
  - id: dex-command-executor-call
    desc: DEX calls command executor helper
    crit: notable
    conf: 0.9
    if:
      type: symbol
      kind: call
      regex: '(?i);->(executer2?|execcommand|executecommand|runcommand)$'
  - id: dex-sms-sender-helper-call
    desc: DEX calls SMS sending helper
    crit: notable
    conf: 0.9
    if:
      type: symbol
      kind: call
      regex: '(?i);->sendsms$'
composite_rules:
  # Co-located call sites indicate a tasking cluster, not proven data flow.
  - id: android-socket-command-sms-tasking-cluster
    desc: Socket, command execution and SMS tasking call cluster
    crit: hostile
    conf: 0.96
    near_bytes: 16384
    all:
      - id: dex-socket-input-call
      - id: dex-socket-output-call
      - id: dex-command-executor-call
      - id: dex-sms-sender-helper-call
      - id: micro-behaviors/process/create/subprocess/launch::dex-runtime-exec-call
      - id: micro-behaviors/communications/messaging/send::dex-sms-send-text-call
