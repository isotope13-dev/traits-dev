defaults:
  crit: hostile
  platforms:
    - linux
    - unix
    - android
    - macos
    - ios
    - windows
  for: [binaries]
composite_rules:
  - id: objectives/command-and-control/backdoor/dispatch/shell/source::cpp-command-backdoor
    for: [elf, macho, pe]
    desc: C++ command execution backdoor with string concealment
    conf: 0.95
    attack: T1059.004
    mbc: B0022
    all:
      - id: metadata/binary/symbols/name/qualified/runtime::cpp-stdlib
      - id: metadata/binary/symbols/name/qualified/runtime::cpp-string
      - id: metadata/binary/symbols/name/function::cpp-exception
      - id: micro-behaviors/process/create/shell/reference::cpp-command-capture
      - id: "metadata/binary/layout/strings::binary-strings-at-most-10"
  - id: objectives/command-and-control/backdoor/dispatch/shell/source::cpp-backdoor-dispatch-symbols
    for: [elf, macho, pe]
    desc: C++ backdoor with RunCommand/ProcessRequest/SaveAndExecute symbols
    conf: 1.0
    all:
      - id: metadata/binary/symbols/name/function::cpp-command-handler-symbols
      - id: metadata/binary/symbols/name/function::write-callback-symbol
      - id: metadata/binary/symbols/name/function::make-status-string-symbol
      - id: metadata/binary/symbols/name/function::get-exe-path-symbol
