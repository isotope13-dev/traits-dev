defaults:
  platforms: [windows, unix]
  for: [binaries]
  mbc: B0030
traits:
- id: go-heartbeat-task-loop
  desc: Go HeartBeat/heartbeat worker functions
  crit: notable
  conf: 0.95
  for:
  - go
  if:
    type: string_literal
    regex: (heartbeat|HeartBeat)(Task|Loop|Worker)\b
- id: go-file-transfer
  desc: Go C2 file transfer functions
  crit: suspicious
  conf: 0.85
  # Module-qualified function symbols (.../cmd.uploadFile). A leading
  # star or bracket is a Go type descriptor (*cmd.uploadFile, *[]cmd.uploadFile)
  # for an ordinary cmd-package struct, not a transfer function.
  if:
    type: text
    regex: '/cmd\.(uploadFile|downloadFile|Upload|Download)\b'
  unless:
  - id: well-known/tool/sysadmin/alpine-packages/
  - id: well-known/tool/development/toolchain/go-toolchain::go-toolchain-distribution
- id: go-http-post-beacon
  desc: Go HTTP POST beacon pattern
  crit: suspicious
  conf: 0.85
  if:
    type: text
    regex: (request\.DoPost|BuildPostData)\b
  unless:
  - id: well-known/tool/sysadmin/alpine-packages/binary::alpine-dogstatsd
  - id: well-known/tool/sysadmin/alpine-packages/binary::alpine-datadog-agent
  - id: well-known/app/utility/360-file-guard::360-file-guard-identity
composite_rules:
- id: go-heartbeat-function
  desc: Go C2 heartbeat function
  crit: component
  conf: 0.95
  any:
  - id: objectives/command-and-control/backdoor/tasking/timing::heartbeat-send
  - id: objectives/command-and-control/backdoor/tasking/timing::heartbeat-set
  - id: objectives/command-and-control/backdoor/dispatch/shell/source::go-heartbeat-task-loop
- id: go-c2-implant-heartbeat
  desc: Go C2 implant with heartbeat
  crit: hostile
  conf: 0.95
  attack: T1071.001
  all:
  - id: objectives/command-and-control/backdoor/dispatch/shell/source::go-heartbeat-function
  - id: micro-behaviors/process/create/command-handler::go-cmd-package-execution-handler
  - id: metadata/binary/symbols/name::go-os-exec-package-reference
- id: go-c2-implant-transfer
  desc: Go C2 implant with file transfer
  crit: hostile
  conf: 0.95
  attack: T1105
  all:
  - id: objectives/command-and-control/backdoor/dispatch/shell/source::go-heartbeat-function
  - id: objectives/command-and-control/backdoor/dispatch/shell/source::go-file-transfer
  - id: metadata/binary/symbols/name::go-os-exec-package-reference
- id: go-c2-implant-monitor
  desc: Go C2 with monitor worker
  crit: hostile
  conf: 0.95
  all:
  - id: objectives/command-and-control/backdoor/dispatch/shell/source::go-heartbeat-function
  - id: metadata/binary/symbols/name::monitor-worker-name
  - id: micro-behaviors/process/create/command-handler::go-cmd-package-execution-handler
  - id: metadata/binary/symbols/name::go-os-exec-package-reference
- id: go-c2-implant-full
  desc: Full Go C2 implant
  crit: hostile
  conf: 0.98
  attack: T1071.001
  all:
  - id: objectives/command-and-control/backdoor/dispatch/shell/source::go-heartbeat-function
  - id: micro-behaviors/process/create/command-handler::go-cmd-package-execution-handler
  - id: objectives/command-and-control/backdoor/dispatch/shell/source::go-file-transfer
  - id: metadata/binary/symbols/name::go-os-exec-package-reference
  any:
  - id: micro-behaviors/crypto/symmetric/xor/stream
  - id: micro-behaviors/fs/path/log/system::hidden-system-log-path
  - id: micro-behaviors/os/sysinfo/platform/runtime::go-machine-type-function
- id: go-c2-attack-tasking
  desc: Go heartbeat channel paired with an attack worker
  crit: hostile
  conf: 0.98
  attack: T1071.001,T1498.001
  for: [elf]
  platforms: [linux]
  all:
  - id: objectives/impact/dos/attack/botnet::go-attack-worker-name
  - id: micro-behaviors/data/source/function/names::go-heartbeat-function-name
  - id: micro-behaviors/communications/ip/literal::external-ipv4-host-literal-binary
