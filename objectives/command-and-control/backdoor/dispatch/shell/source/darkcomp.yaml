defaults:
  platforms: [windows]
  for: [pe, batch, c, cpp]
  attack: T1059

# Each atom is one command name from the DarkComp tasking table, matched only
# as a whole string (a quoted source literal, or an entire extracted binary
# string -- the dispatch-table entry), never as an identifier
# or a word inside prose: `delete_file` and `run_cmd` are ordinary function
# names in C and Python launchers. The family reading comes from the
# vocabulary composite below, which requires the whole set together.
traits:
  - id: objectives/command-and-control/backdoor/dispatch/shell/source::run-cmd-command-name
    desc: '"run_cmd" command-name string'
    crit: component
    conf: 0.94
    if:
      type: text
      regex: '(?m)(^|")run_cmd("|$)'
  - id: objectives/command-and-control/backdoor/dispatch/shell/source::run-powershell-command-name
    desc: '"run_powershell" command-name string'
    crit: component
    conf: 0.94
    if:
      type: text
      regex: '(?m)(^|")run_powershell("|$)'
  - id: objectives/command-and-control/backdoor/dispatch/shell/source::upload-chunk-command-name
    desc: '"upload_chunk" command-name string'
    crit: component
    conf: 0.94
    if:
      type: text
      regex: '(?m)(^|")upload_chunk("|$)'
  - id: objectives/command-and-control/backdoor/dispatch/shell/source::delete-file-command-name
    desc: '"delete_file" command-name string'
    crit: component
    conf: 0.94
    if:
      type: text
      regex: '(?m)(^|")delete_file("|$)'
  - id: objectives/command-and-control/backdoor/dispatch/shell/source::cmd-start-command-name
    desc: '"cmd_start" command-name string'
    crit: component
    conf: 0.94
    if:
      type: text
      regex: '(?m)(^|")cmd_start("|$)'
  - id: objectives/command-and-control/backdoor/dispatch/shell/source::cmd-input-command-name
    desc: '"cmd_input" command-name string'
    crit: component
    conf: 0.94
    if:
      type: text
      regex: '(?m)(^|")cmd_input("|$)'
  - id: objectives/command-and-control/backdoor/dispatch/shell/source::cmd-stop-command-name
    desc: '"cmd_stop" command-name string'
    crit: component
    conf: 0.94
    if:
      type: text
      regex: '(?m)(^|")cmd_stop("|$)'
  - id: objectives/command-and-control/backdoor/dispatch/shell/source::ps-start-command-name
    desc: '"ps_start" command-name string'
    crit: component
    conf: 0.94
    if:
      type: text
      regex: '(?m)(^|")ps_start("|$)'
  - id: objectives/command-and-control/backdoor/dispatch/shell/source::ps-input-command-name
    desc: '"ps_input" command-name string'
    crit: component
    conf: 0.94
    if:
      type: text
      regex: '(?m)(^|")ps_input("|$)'
  - id: objectives/command-and-control/backdoor/dispatch/shell/source::ps-stop-command-name
    desc: '"ps_stop" command-name string'
    crit: component
    conf: 0.94
    if:
      type: text
      regex: '(?m)(^|")ps_stop("|$)'
  - id: objectives/command-and-control/backdoor/dispatch/shell/source::reregister-command-name
    desc: '"re_register" command-name string'
    crit: component
    conf: 0.94
    if:
      type: text
      regex: '(?m)(^|")re_register("|$)'

composite_rules:
  - id: objectives/command-and-control/backdoor/dispatch/shell/source::darkcomp-cmd-session-vocabulary
    desc: Darkcomp cmd session command vocabulary
    crit: component
    conf: 0.94
    all:
      - id: objectives/command-and-control/backdoor/dispatch/shell/source::cmd-start-command-name
      - id: objectives/command-and-control/backdoor/dispatch/shell/source::cmd-input-command-name
      - id: objectives/command-and-control/backdoor/dispatch/shell/source::cmd-stop-command-name

  - id: objectives/command-and-control/backdoor/dispatch/shell/source::darkcomp-powershell-session-vocabulary
    desc: Darkcomp PowerShell session command vocabulary
    crit: component
    conf: 0.94
    all:
      - id: objectives/command-and-control/backdoor/dispatch/shell/source::ps-start-command-name
      - id: objectives/command-and-control/backdoor/dispatch/shell/source::ps-input-command-name
      - id: objectives/command-and-control/backdoor/dispatch/shell/source::ps-stop-command-name

  - id: objectives/command-and-control/backdoor/dispatch/shell/source::darkcomp-command-vocabulary
    desc: Darkcomp RAT command vocabulary
    crit: suspicious
    conf: 0.98
    all:
      - id: objectives/command-and-control/backdoor/dispatch/shell/source::run-cmd-command-name
      - id: objectives/command-and-control/backdoor/dispatch/shell/source::run-powershell-command-name
      - id: objectives/command-and-control/backdoor/dispatch/shell/source::upload-chunk-command-name
      - id: objectives/command-and-control/backdoor/dispatch/shell/source::delete-file-command-name
      - id: objectives/command-and-control/backdoor/dispatch/shell/source::reregister-command-name
    any:
      - id: objectives/command-and-control/backdoor/dispatch/shell/source::darkcomp-cmd-session-vocabulary
      - id: objectives/command-and-control/backdoor/dispatch/shell/source::darkcomp-powershell-session-vocabulary
      - id: objectives/command-and-control/backdoor/dispatch/shell/source::reregister-command-name
