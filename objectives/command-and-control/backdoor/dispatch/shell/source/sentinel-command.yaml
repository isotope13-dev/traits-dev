# A command handler that hands out a root shell when it recognizes a secret
# word. The auth-bypass rules convict the bypass itself (a literal compared
# against operator input before a root UID change); this one states the dispatch -- the
# service's public command surface is the trigger, so anyone who sends the
# word owns the process.
#
# Worked example: the trojanized ProFTPD `HELP` handler, where
# `strcmp(target, "ACIDBITCHEZ") == 0` runs setuid(0); setgid(0);
# system("/bin/sh;/sbin/sh").
defaults:
  platforms: [linux, unix]
  for: [c, cpp]
  attack: T1059.004
  mbc: B0022

composite_rules:
  - id: objectives/command-and-control/backdoor/dispatch/shell/source::magic-string-command-dispatch
    desc: Command handler dispatches on magic string to shell
    crit: hostile
    conf: 0.97
    near_bytes: 256
    all:
      - id: micro-behaviors/process/identity/setuid::literal-guarded-root-uid-change
      - id: micro-behaviors/process/create/shell/native::c-shell-execution-path
