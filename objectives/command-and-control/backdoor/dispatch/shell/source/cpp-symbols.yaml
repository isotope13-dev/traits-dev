defaults:
  platforms: [windows, linux, macos]
  for: [elf, macho, pe]
  mbc: B0030
traits:
  - id: objectives/command-and-control/backdoor/dispatch/shell/source::rshell-run
    desc: Runs commands via remote shell
    crit: suspicious
    conf: 0.95
    attack: T1059.004
    if:
      type: text
      regex: RShellRun\b
  - id: objectives/command-and-control/backdoor/dispatch/shell/source::rshell-init
    desc: Initializes remote shell backdoor
    crit: suspicious
    conf: 0.95
    attack: T1059.004
    if:
      type: text
      regex: RShellInit\b
  - id: objectives/command-and-control/backdoor/dispatch/shell/source::rshell-cleanup
    desc: Tears down remote shell session
    crit: suspicious
    conf: 0.95
    attack: T1059.004
    if:
      type: text
      regex: RShellCleanUp\b
  - id: objectives/command-and-control/backdoor/dispatch/shell/source::init-rshell-fds
    desc: Sets up remote shell I/O FDs
    crit: suspicious
    conf: 0.95
    attack: T1059.004
    if:
      type: text
      regex: InitRShellFDS\b
  - id: objectives/command-and-control/backdoor/dispatch/shell/source::rshell-packet-handler
    desc: Handles inbound remote-shell packets
    crit: suspicious
    conf: 0.95
    attack: T1059.004
    if:
      type: text
      regex: OnReceivedPacket.{0,30}RShell
  - id: objectives/command-and-control/backdoor/dispatch/shell/source::exec-shell-cmd
    desc: ExecShellCmd shell command routine
    crit: suspicious
    conf: 0.9
    attack: T1059
    if:
      type: text
      regex: ExecShellCmd\b
  - id: objectives/command-and-control/backdoor/dispatch/shell/source::run-shell-cmd
    desc: RunShellCmd shell command routine
    crit: suspicious
    conf: 0.9
    attack: T1059
    if:
      type: text
      regex: RunShellCmd\b
  - id: objectives/command-and-control/backdoor/dispatch/shell/source::cxx-msg-command-task-symbol
    desc: C++ MsgCmd or MsgRun command task symbol
    crit: notable
    conf: 0.98
    attack: T1059.004
    size_min: 500000
    size_max: 8000000
    if:
      type: text
      regex: '_Z6Msg(Cmd|Run)P11_TRANS_INFO'
      section: .strtab
composite_rules:
  - id: objectives/command-and-control/backdoor/dispatch/shell/source::rshell-function
    desc: Remote shell function pattern
    crit: suspicious
    conf: 0.95
    attack: T1059.004
    any:
      - id: objectives/command-and-control/backdoor/dispatch/shell/source::rshell-run
      - id: objectives/command-and-control/backdoor/dispatch/shell/source::rshell-init
      - id: objectives/command-and-control/backdoor/dispatch/shell/source::rshell-cleanup
      - id: objectives/command-and-control/backdoor/dispatch/shell/source::init-rshell-fds
      - id: objectives/command-and-control/backdoor/dispatch/shell/source::rshell-packet-handler
  - id: objectives/command-and-control/backdoor/dispatch/shell/source::remote-cmd-exec
    desc: Remote command execution pattern
    crit: suspicious
    conf: 0.9
    attack: T1059
    any:
      - id: objectives/command-and-control/backdoor/dispatch/shell/source::exec-shell-cmd
      - id: objectives/command-and-control/backdoor/dispatch/shell/source::run-shell-cmd
  - id: objectives/command-and-control/backdoor/dispatch/shell/source::cxx-rat-command-task-dispatch
    for: [elf, macho]
    desc: C++ RAT command task dispatch symbols
    crit: hostile
    conf: 0.98
    attack: T1059.004
    unless:
      - id: objectives/command-and-control/backdoor/tasking/payload::native-payload-command-tasking
    all:
      - id: objectives/command-and-control/backdoor/dispatch/shell/source::cxx-msg-command-task-symbol
      - id: micro-behaviors/process/create/execv::c-exec-variants
