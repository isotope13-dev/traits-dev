# A command handler that hands out a root shell when it recognizes a secret
# word. The auth-bypass rules convict the bypass itself (a literal compared
# against operator input before setuid); this one states the dispatch -- the
# service's public command surface is the trigger, so anyone who sends the
# word owns the process.
#
# Worked example: the trojanized ProFTPD `HELP` handler, where
# `strcmp(target, "ACIDBITCHEZ")` runs setuid(0); setgid(0);
# system("/bin/sh;/sbin/sh").
defaults:
  platforms: [linux, unix]
  for: [c, cpp]
  attack: T1059.004,T1136
  mbc: B0022

composite_rules:
  - id: magic-string-command-dispatch
    desc: Command handler dispatches on magic string to shell
    crit: hostile
    conf: 0.97
    all:
      - id: objectives/command-and-control/backdoor/auth-bypass::literal-guarded-root-shell
      - id: micro-behaviors/process/create/shell/spawn::system-fn
