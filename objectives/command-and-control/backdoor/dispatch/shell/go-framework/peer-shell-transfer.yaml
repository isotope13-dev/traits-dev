defaults:
  for: [macho, elf, pe]
  platforms: [macos, linux, windows]
  attack: T1059,T1105,T1547

traits:
  - id: go-peer-backshell-open
    desc: Go peer framework opens a local shell
    crit: notable
    conf: 0.96
    if:
      type: text
      substr: 'backshell.openLocalShell'
  - id: go-peer-backshell-stream
    desc: Go peer framework handles shell stream
    crit: notable
    conf: 0.96
    if:
      type: text
      regex: 'backshell\.handle(LocalShellIn|LocalShellOut|Stream)'
  - id: go-peer-file-autostart
    desc: Go file-transfer component ensures autostart
    crit: notable
    conf: 0.96
    if:
      type: text
      substr: 'filetransfer.(*File).EnsureAutoStart'
  - id: go-peer-file-download
    desc: Go file-transfer component downloads files
    crit: notable
    conf: 0.96
    if:
      type: text
      substr: 'filetransfer.DownloadFile'
  - id: go-peer-ssh-brute-worker
    desc: Go framework contains SSH brute-force worker
    crit: notable
    conf: 0.96
    if:
      type: text
      substr: 'reque_client/workers/brute_ssh'

composite_rules:
  - id: go-peer-shell-transfer-autostart
    desc: Peer shell with SSH brute force and persistent file transfer
    crit: hostile
    conf: 0.99
    all:
      - id: go-peer-backshell-open
      - id: go-peer-backshell-stream
      - id: go-peer-file-autostart
      - id: go-peer-file-download
      - id: go-peer-ssh-brute-worker
