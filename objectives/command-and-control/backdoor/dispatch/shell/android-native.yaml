defaults:
  platforms: [android]
  for: [elf]
  attack: T1059.004,T1095
  mbc: B0030.002

composite_rules:
  - id: android-tv-socket-shell-tasking
    desc: Android TV-masquerading bot accepts and executes shell tasking
    crit: hostile
    conf: 0.99
    all:
      - id: objectives/evasion/masquerade/process/name::android-tv-process-masquerade-set
      - id: micro-behaviors/communications/socket/listen::accepting-server-api-surface
      - id: micro-behaviors/communications/socket/receive::recv-symbol
      - id: micro-behaviors/process/create/shell/spawn::android-system-sh-binary-text
      - id: micro-behaviors/process/create/shell/spawn::system-fn
      - id: micro-behaviors/process/create/execv::c-exec-variants
