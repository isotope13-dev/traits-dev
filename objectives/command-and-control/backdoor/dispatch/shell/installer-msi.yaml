defaults:
  platforms: [windows]
  for: [pe]
  attack: T1059.001,T1105,T1219

composite_rules:
  # Embedded MiniPowerShell-style PE: Telegram Bot API control plus redirected
  # PowerShell stdio — fires when the PE member is scanned on its own.
  - id: msi-embedded-telegram-powershell-backdoor
    desc: Embedded PE exposes Telegram PowerShell control
    crit: hostile
    conf: 0.99
    attack: T1059.001,T1071.001,T1105
    all:
      - id: micro-behaviors/communications/http/services/telegram::telegram-api-host
      - id: micro-behaviors/communications/messaging/send::chat-send-message
      - id: micro-behaviors/process/create/shell/interpreter::powershell-executable-token
      - id: micro-behaviors/process/create/spawn::dotnet-redirected-stdio
    near_bytes: 4000
    unless:
      - id: well-known/lib/platform/textcopy/
      - id: well-known/app/development/unity-hub::official-package-context
      - id: well-known/tool/sysadmin/chocolatey::official-library-pe-context
