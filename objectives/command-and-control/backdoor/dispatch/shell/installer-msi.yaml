defaults:
  platforms: [windows]
  for: [pe]
  attack: T1059.001,T1105,T1219

composite_rules:
  # Embedded MiniPowerShell-style PE: Telegram Bot API control plus redirected
  # PowerShell stdio — fires when the PE member is scanned on its own.
  - id: msi-embedded-telegram-powershell-backdoor
    desc: Embedded PE exposes Telegram PowerShell control
    crit: hostile
    conf: 0.99
    attack: T1059.001,T1071.001,T1105
    all:
      - id: metadata/package/files/msi::msi-powershell-stdio-cluster
      - id: metadata/package/files/msi::msi-telegram-control-marker
