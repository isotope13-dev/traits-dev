defaults:
  platforms: [windows]
  for: [all]
  attack: T1059.001,T1105,T1219

composite_rules:
  - id: msi-telegram-powershell-backdoor
    desc: MSI embeds Telegram-controlled PowerShell backdoor
    crit: hostile
    conf: 0.99
    all:
      - id: metadata/package/files/msi::msi-installation-database-title
      - id: metadata/package/files/msi::msi-run-key-table-entry
      - id: metadata/package/files/msi::msi-powershell-stdio-cluster
      - id: metadata/package/files/msi::msi-telegram-control-marker
      - id: micro-behaviors/fs/path/host-process::windows-application-frame-host-name
  - id: msi-embedded-telegram-powershell-backdoor
    desc: Embedded PE exposes Telegram PowerShell control
    crit: hostile
    conf: 0.99
    attack: T1059.001,T1071.001,T1105
    for: [pe]
    all:
      - id: metadata/package/files/msi::msi-powershell-stdio-cluster
      - id: metadata/package/files/msi::msi-telegram-control-marker
