defaults:
  platforms: [macos]
  for: [macho]
  attack: T1059,T1105,T1071

traits:
  - id: macho-packet-shell-handler
    desc: Mach-O packet command shell handler
    crit: notable
    conf: 0.94
    if:
      type: symbol
      kind: export
      regex: '^_?proc_shell$'
  - id: macho-packet-upload-handler
    desc: Mach-O packet upload handler
    crit: notable
    conf: 0.94
    if:
      type: symbol
      kind: export
      regex: '^_?proc_upload$'
  - id: macho-packet-download-handler
    desc: Mach-O packet download handler
    crit: notable
    conf: 0.94
    if:
      type: symbol
      kind: export
      regex: '^_?proc_download$'
  - id: macho-packet-delete-handler
    desc: Mach-O packet file-removal handler
    crit: notable
    conf: 0.94
    if:
      type: symbol
      kind: export
      regex: '^_?proc_rmfile$'
  - id: macho-packet-connection-handler
    desc: Mach-O packet socket connection handler
    crit: notable
    conf: 0.94
    if:
      type: symbol
      kind: export
      regex: '^_?socket_connect$'
  - id: macho-packet-write-handler
    desc: Mach-O packet writer
    crit: notable
    conf: 0.94
    if:
      type: symbol
      kind: export
      regex: '^_?write_packet$'

composite_rules:
  - id: macho-socket-tasking-file-shell
    desc: Mach-O socket tasking exposes shell and file handlers
    crit: hostile
    conf: 0.98
    all:
      - id: macho-packet-shell-handler
      - id: macho-packet-upload-handler
      - id: macho-packet-download-handler
      - id: macho-packet-delete-handler
      - id: macho-packet-connection-handler
      - id: macho-packet-write-handler
