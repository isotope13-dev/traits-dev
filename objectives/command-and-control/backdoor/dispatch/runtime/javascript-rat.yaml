defaults:
  platforms: [windows, unix]
  for:
    - javascript
traits:
  - id: npm-install-runtime-exec
    desc: Runtime npm install via exec
    crit: suspicious
    conf: 0.85
    attack: T1027.009
    if:
      # Migrated from a tree-sitter query to a `kind: call` match on
      # the pre-extracted call fact (no per-member cursor walk).
      type: symbol
      kind: call
      regex: '\.(^(exec|execSync)$)$'
  - id: npm-prefix-install
    desc: Runtime exec call with npm prefix
    crit: notable
    conf: 0.7
    if:
      type: symbol
      kind: call
      regex: '(^|\.)exec$'
      arg:
        kind: string
        substr: --prefix
  - id: windows-hide-option
    desc: windowsHide option for stealth
    crit: notable
    conf: 0.8
    attack: T1564.003
    if:
      type: string_literal
      regex: windowsHide:\s*true
  - id: module-paths-push
    desc: module.paths.push manipulation
    crit: suspicious
    conf: 0.85
    attack: T1574.007
    if:
      type: symbol
      regex: module\\.paths\\.push
  # `.node_modules` moved to
  # micro-behaviors/fs/path/application/interpreter::node-home-global-module-path.
  # The substring matched Node's own GLOBAL_FOLDERS resolution
  # (`path.join(homeDir, ".node_modules")`), which every Node-compatible
  # runtime carries, so a bundled runtime read as a RAT hiding modules in the
  # home directory — and the description claimed a home directory the matcher
  # never checked. It is a path reference; the tampering intent comes from the
  # `module.paths.push` leg of the composite below, which reaches for it
  # cross-directory. The three benign-runtime carve-outs went with it: they
  # were compensating for the wrong tier, not for a real exception.
  - id: socket-command-handler
    desc: Socket command event handler
    crit: suspicious
    conf: 0.9
    attack: T1059.007
    if:
      # Migrated from a tree-sitter query to a `kind: call` match on
      # the pre-extracted call fact (no per-member cursor walk).
      type: symbol
      kind: call
      regex: '(^|\.)\^\(socket\|sock\|client\|conn\|connection\|ws\)\$\.on$'
  - id: process-id-collection
    desc: Process ID collection
    crit: suspicious
    conf: 0.6
    if:
      type: symbol
      regex: process\\.pid
composite_rules:
  - id: runtime-npm-install
    desc: Runtime npm package installation (dependency evasion)
    crit: hostile
    conf: 0.95
    attack: T1027.009
    mbc: E1027
    all:
      - id: npm-install-runtime-exec
      - id: objectives/execution/interpreter/eval/invoke::shell-eval
      - id: npm-prefix-install
  - id: module-path-tampering
    desc: Node.js module path tampering for persistence
    crit: suspicious
    conf: 0.85
    attack: T1574.007
    all:
      - id: module-paths-push
      - id: micro-behaviors/fs/path/application/interpreter::node-home-global-module-path
  - id: rat-command-execution
    desc: Remote Access Trojan with command execution
    crit: hostile
    conf: 0.95
    attack: T1219
    mbc: B0022
    all:
      - id: socket-command-handler
      - id: micro-behaviors/communications/websocket/server::socketio-server-import
      - id: micro-behaviors/process/create/exec::js-child-process
  - id: advanced-rat-evasion
    desc: Advanced RAT with runtime dependency evasion
    crit: hostile
    conf: 0.95
    attack: T1219
    all:
      - id: runtime-npm-install
      - id: module-path-tampering
    any:
      - id: socket-command-handler
      - id: micro-behaviors/communications/websocket/server::socketio-server-import
  - id: rat-client-fingerprinting
    desc: RAT client fingerprinting and tracking
    crit: suspicious
    conf: 0.85
    attack: T1082
    all:
      - id: micro-behaviors/data/source/property/identity::client-uuid-object-field
    any:
      - id: process-id-collection
      - id: micro-behaviors/process/user/query::os-homedir-call
