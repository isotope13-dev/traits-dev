# This profile captures a native macOS command runner that reads an
# environment-supplied encrypted configuration, stages it under /private/var,
# and starts the configured child with piped standard streams. It does not
# require a network API in the same binary because the environment is its
# handoff from a parent process.
defaults:
  platforms: [macos]
  for: [macho]
  attack: T1059.004,T1106,T1140
  mbc: B0030

traits:
  - id: server-auth-key-env-name
    desc: Server auth key environment name
    crit: notable
    conf: 0.9
    if:
      type: text
      substr: SERVER_AUTH_KEY

  - id: client-auth-key-env-name
    desc: Client auth key environment name
    crit: notable
    conf: 0.9
    if:
      type: text
      substr: CLIENT_AUTH_KEY

  - id: private-var-config-stage-path
    desc: Private var temporary configuration stage path
    crit: notable
    conf: 0.9
    if:
      type: text
      substr: /private/var/tmp/cfg

composite_rules:
  - id: environment-authenticated-piped-command-runner
    desc: Encrypted environment configuration launches a piped child process
    crit: hostile
    conf: 0.97
    all:
      - id: server-auth-key-env-name
      - id: client-auth-key-env-name
      - id: private-var-config-stage-path
      - id: micro-behaviors/process/create/direct::child-stdio-pipe-redirect
    unless:
      - id: well-known/app/
      - id: well-known/tool/
