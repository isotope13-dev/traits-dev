# Native dual-mode socket command bridges
defaults:
  platforms: [unix]
  for: [elf, so]
  attack: T1059.004
  mbc: B0022

composite_rules:
  - id: unix-dual-mode-terminal-command-bridge
    desc: Unix dual-mode socket command bridge with terminal control
    crit: hostile
    conf: 0.96
    mbc: "B0022,B0024"
    attack: "T1059.004,T1090.003"
    scope: leaf
    size_max: 20000000
    all:
      - id: micro-behaviors/communications/socket/connect::connect
      - id: micro-behaviors/communications/socket/listen::listen
      - id: micro-behaviors/communications/socket/listen::accept-sym
      - id: micro-behaviors/communications/socket/bind/function::bind
      - id: micro-behaviors/process/fd/dup::dup2
      - id: micro-behaviors/process/create/execv::c-exec-variants
      - id: micro-behaviors/process/tty/terminal::terminal-attribute-control
    # A command bridge must actually launch a shell to relay commands over the
    # socket, so require concrete shell evidence: a shell path it execs
    # (/bin/sh, /bin/bash, /usr/bin/sh) or a pseudoterminal allocation
    # (forkpty/openpty) for an interactive session. This deliberately excludes a
    # bare `system` import symbol, which nearly every libc-linked binary carries
    # undefined-and-uncalled — the leg that let a benign Rust crossterm/ratatui
    # TUI (a spreadsheet with a 127.0.0.1 session bridge) match: it links
    # socket/bind/listen/accept, dup2 (std::process pipes) and execvp (spawning a
    # helper such as curl) but spawns no shell. Mirrors the concrete-shell-text
    # precision the whole reverse-shell/dup family rests on.
    any:
      - id: micro-behaviors/process/create/shell/spawn::bin-sh-binary-text
      - id: micro-behaviors/process/create/shell/native::bash-binary-name
      - id: micro-behaviors/process/create/shell/spawn::usr-bin-sh
      - id: micro-behaviors/process/tty/pty::forkpty
      - id: micro-behaviors/process/tty/pty::openpty-call
    unless:
      - id: objectives/command-and-control/reverse-shell/dup::unix-dual-mode-socket-exec-known-context
