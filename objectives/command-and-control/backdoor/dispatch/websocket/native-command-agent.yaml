# Native clients that keep a WSS channel open and bridge child-process stdio
# provide remote command execution. Requiring all three capabilities avoids
# treating ordinary WebSocket clients or local pipe users as command agents.
defaults:
  platforms: [linux, macos]
  for: [elf, macho]
  attack: T1071.001,T1059.004,T1219
  mbc: B0030

composite_rules:
  - id: websocket-piped-child-command-agent
    desc: WebSocket agent relays commands through a piped child process
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/communications/http/websocket::wss-scheme
      - id: micro-behaviors/communications/http/websocket::websocket-class
      - id: micro-behaviors/process/create/direct::child-stdio-pipe-redirect
    unless:
      - id: well-known/dual-use/remote-admin/platypus::platypus-brand
      - id: well-known/app/
      - id: well-known/tool/
