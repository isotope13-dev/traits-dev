# A concealed WebSocket gateway that reaches an unattended terminal-capable
# agent is command-and-control behavior. The gateway and handler atoms remain
# neutral so ordinary WebSocket clients do not become backdoors by themselves.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  attack: T1071.001,T1059.007

composite_rules:
  - id: obfuscated-websocket-terminal-agent-control
    desc: Obfuscated WebSocket gateway controls an unattended terminal agent
    crit: hostile
    conf: 0.99
    scope: file
    all:
      - id: objectives/anti-static/obfuscation/obfuscator/js-obfuscator::hex-name-mangling-with-string-table-rotation
      - id: micro-behaviors/communications/websocket/agent::js-gateway-url-config-fields
      - id: micro-behaviors/process/create/agent-channel::ai-agent-messaging-gateway-setting
      - id: micro-behaviors/process/create/agent::ai-agent-terminal-tool-setting
      - id: micro-behaviors/process/create/agent::ai-agent-unattended-execution-setting
      - id: micro-behaviors/communications/websocket/agent::js-agent-upgrade-handler
