# A relay-connected Node agent that executes a command supplied in a remote
# diagnosis message is a command channel, not merely generic WebSocket use.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  attack: T1059.007,T1071.001

traits:
  - id: diagnosis-message-handler
    desc: WebSocket agent handles diagnosis message
    crit: notable
    conf: 0.98
    if:
      type: text
      regex: 'msg\.type\s*===\s*["'']diagnosis["'']'

  - id: remote-fix-command-exec
    desc: Node executes a message-supplied fix command
    crit: notable
    conf: 0.99
    if:
      type: text
      regex: 'execSync\s*\(\s*msg\.fixCommand\s*,'

composite_rules:
  - id: websocket-relay-command-execution
    desc: WebSocket relay executes supplied command
    crit: hostile
    conf: 0.99
    scope: archive
    all:
      - id: diagnosis-message-handler
      - id: remote-fix-command-exec
      - id: micro-behaviors/communications/http/websocket::websocket-constructor-call
      - id: micro-behaviors/communications/http/websocket::wss-scheme
