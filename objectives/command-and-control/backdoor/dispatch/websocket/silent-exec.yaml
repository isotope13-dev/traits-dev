# Operator-panel WebSocket commands that pull a payload over HTTP,
# mark it executable, then run it hidden (silent_exec).
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  attack: T1105,T1059
  mbc: B0022

traits:
  - id: command-type-silent-exec
    desc: Typed silent_exec control command
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: 'commandType:\s*["'']silent_exec["'']'

  - id: command-type-file-upload-http
    desc: Typed file_upload_http control command
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: 'commandType:\s*["'']file_upload_http["'']'

  - id: command-type-file-chmod
    desc: Typed file_chmod control command
    crit: notable
    conf: 0.93
    if:
      type: text
      regex: 'commandType:\s*["'']file_chmod["'']'

  - id: silent-exec-hide-window
    desc: Silent-exec hideWindow payload field
    crit: notable
    conf: 0.92
    if:
      type: text
      regex: 'hideWindow:\s*(true|false|\w+\.hideWindow)'

composite_rules:
  - id: websocket-silent-exec-http-dropper
    desc: WebSocket HTTP pull then silent-exec
    crit: hostile
    conf: 0.98
    all:
      - id: command-type-silent-exec
      - id: command-type-file-upload-http
      - id: command-type-file-chmod
      - id: silent-exec-hide-window
      - id: micro-behaviors/communications/websocket/send::member-ws-send-call
    near_bytes: 4096
