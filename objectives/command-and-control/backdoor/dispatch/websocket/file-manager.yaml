# Operator-panel WebSocket file-manager commands (list/download/delete).
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  attack: T1071.001,T1005

traits:
  - id: command-type-file-download
    desc: Typed file_download control command
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: 'commandType:\s*["'']file_download["'']'

  - id: command-type-file-list
    desc: Typed file_list control command
    crit: notable
    conf: 0.93
    if:
      type: text
      regex: 'commandType:\s*["'']file_list["'']'

  - id: command-type-file-delete
    desc: Typed file_delete control command
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: 'commandType:\s*["'']file_delete["'']'

composite_rules:
  - id: websocket-remote-file-manager
    desc: WebSocket remote file-manager commands
    crit: hostile
    conf: 0.98
    all:
      - id: command-type-file-download
      - id: micro-behaviors/communications/websocket/send::member-ws-send-call
    any:
      - id: command-type-file-list
      - id: command-type-file-delete
    near_bytes: 4096
