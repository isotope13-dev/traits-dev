defaults:
  platforms: [linux, macos]
  for: [elf, macho]
  attack: T1071.001,T1059.004
  mbc: B0030

traits:
  - id: websocket-shell-stream-text-marker
    desc: WebSocket shell stream text marker
    crit: component
    conf: 0.82
    if:
      type: text
      regex: '(?i)\bSHELL stream\b'

  - id: websocket-forkpty-failed-marker
    desc: WebSocket forkpty failure marker
    crit: component
    conf: 0.86
    if:
      type: text
      regex: '(?i)\[shell\]\s+forkpty failed'

  - id: websocket-socks-stream-text-marker
    desc: WebSocket SOCKS stream text marker
    crit: component
    conf: 0.82
    if:
      type: text
      regex: '(?i)\bSOCKS stream\b'

  - id: password-json-message-marker
    desc: JSON password message marker
    crit: component
    conf: 0.84
    if:
      type: text
      regex: '(?i)"type":"password","password":'

  - id: password-success-message-marker
    desc: Password success message marker
    crit: component
    conf: 0.84
    if:
      type: text
      regex: '(?i)Password sent successfully'

composite_rules:
  - id: websocket-shell-stream-marker
    desc: WebSocket shell stream marker
    crit: suspicious
    conf: 0.95
    any:
      - id: websocket-shell-stream-text-marker
      - id: websocket-forkpty-failed-marker

  - id: websocket-socks-stream-marker
    desc: WebSocket SOCKS stream marker
    crit: suspicious
    conf: 0.93
    all:
      - id: websocket-socks-stream-text-marker
      - id: micro-behaviors/communications/proxy/socks::socks5-string

  - id: password-authenticated-agent-protocol
    desc: Agent password message
    crit: suspicious
    conf: 0.92
    any:
      - id: password-json-message-marker
      - id: password-success-message-marker

  - id: websocket-pty-remote-shell-agent
    desc: Hardcoded-endpoint WebSocket agent with password-authenticated PTY shell tasking
    crit: hostile
    conf: 0.99
    attack: T1071.001,T1059.004,T1105
    all:
      - id: micro-behaviors/communications/http/websocket::websocket-http-upgrade-headers
      - id: micro-behaviors/process/tty/pty::forkpty
      - id: websocket-shell-stream-marker
      - id: password-authenticated-agent-protocol
    any:
      - id: micro-behaviors/communications/ip/endpoint::external-ipv4-port-elf
      - id: micro-behaviors/communications/ip/literal::external-ipv4-port-macho
    unless:
      - id: well-known/app/
      - id: well-known/lib/

  # The same capability set as `websocket-pty-remote-shell-agent` above, minus
  # the family-specific protocol markers: a native binary that writes itself a
  # systemd unit, dials out over WSS, and relays a coding agent on a PTY.
  # Whoever holds the other end of that socket runs commands on the host, and
  # the unit makes it survive reboot.
  #
  # This lives in objectives/ because the parts do not. `native-wss-pty-ai-cli-
  # agent` and `native-persistent-wss-pty-ai-agent` are both correctly notable
  # — one is a micro-behaviour, the other observes a unit file — and after they
  # were relocated and demoted, nothing rated the combination at all. A
  # published product and an implant are structurally identical here, so the
  # only honest separator is identity, and identity is what `unless:` carries:
  # a recognised coding-agent vendor is exempt, an unbranded build is not.
  #
  # Suspicious, not hostile: remote control is what these products are *for*,
  # and the user of a legitimate one asked for it.
  - id: unvouched-self-persisting-remote-pty-agent
    desc: Unbranded self-persisting remote PTY agent
    crit: suspicious
    conf: 0.94
    attack: T1543.002,T1071.001,T1219
    all:
      - id: objectives/persistence/system/service/systemd::native-persistent-wss-pty-ai-agent
    unless:
      # A recognised coding-agent product; the vendor identity is the claim
      # that makes the same shape accountable.
      - id: well-known/app/ai/coding-agent/
      - id: well-known/tool/
      - id: metadata/signed/platform/
