defaults:
  for: [javascript, typescript, html]
  platforms: [unix, windows]
  crit: hostile
  conf: 0.99
  attack: T1059.007,T1071.001
composite_rules:
  - id: browser-websocket-json-code-execution
    desc: WebSocket callback evaluates JSON message code
    near_bytes: 600
    all:
      - id: micro-behaviors/communications/websocket/handler::websocket-javascript-constructor
      - id: micro-behaviors/communications/websocket/receive::browser-message-handler
      - id: micro-behaviors/process/interpreter/eval/direct::evaluate-json-message-field
