# A WebSocket-connected npm agent that exposes an interactive PTY is a remote
# control capability.  The hostile objective requires the full protocol and
# PTY bridge shape, not WebSocket or terminal APIs in isolation.
defaults:
  platforms: [unix, windows]
  for: [archives, npm, tar]
  attack: "T1059.004,T1059.006,T1071.001"

composite_rules:
  - id: node-websocket-python-pty-agent
    desc: WebSocket agent relays a Python PTY-backed command session
    crit: hostile
    conf: 0.995
    scope: archive
    all:
      - id: micro-behaviors/communications/http/websocket::websocket-constructor-call
      - id: micro-behaviors/communications/websocket/receive::websocket-message-event-handler
      - id: micro-behaviors/process/create/shell/interpreter::node-spawn-python-interpreter
      - id: micro-behaviors/process/tty/pty::python-openpty-call
      - id: micro-behaviors/process/tty/pty::python-pty-master-write
      - id: micro-behaviors/process/create/subprocess::os-execvp
      - id: micro-behaviors/process/fd/stdio::js-stdin-write
    unless:
      - id: metadata/package/testing/
      - id: well-known/app/ai/claude-remote::claude-remote-known-app-context
