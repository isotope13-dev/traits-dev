# Python Remote Code Execution via Eval
# Detects patterns where remote config/data is executed via eval
# ATT&CK: T1059.006 (Python)
defaults:
  crit: hostile
  attack: T1059.006
  platforms: [linux, macos, windows, unix, android, ios]
  for: [python]
composite_rules:
- id: python-http-post-response-code-execution
  desc: Python HTTP POST response code execution
  crit: hostile
  conf: 0.99
  attack: T1059.006,T1071.001
  mbc: B0024,B0032
  scope: leaf
  near_lines: 80
  # The article describes a Python backdoor that POSTs to C2 and executes
  # Python commands returned by the server.  Keep the conclusion on the
  # behavior/dataflow, not on a family name, URL, or command vocabulary.
  all:
  - id: micro-behaviors/communications/http/request/client::python-post-transport
  - id: micro-behaviors/communications/http/client/response-body::python-response-json-call
  - id: micro-behaviors/data/collection/map::mapping-get-code-command-script-payload-key
  - id: micro-behaviors/metaprogramming/generation::compile-exec-mode
  - id: micro-behaviors/process/interpreter/eval/direct::exec-builtin

