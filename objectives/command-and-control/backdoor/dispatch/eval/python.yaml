# Python Remote Code Execution via Eval
# Detects patterns where remote config/data is executed via eval
# ATT&CK: T1059.006 (Python)
defaults:
  attack: T1059.006
  platforms: [linux, macos, windows, unix, android, ios]
  for: [python]
composite_rules:
- id: python-http-post-response-code-execution
  desc: Python HTTP POST response code execution
  crit: hostile
  conf: 0.99
  attack: T1059.006,T1071.001
  mbc: B0024,B0032
  scope: leaf
  near_lines: 80
  # The article describes a Python backdoor that POSTs to C2 and executes
  # Python commands returned by the server.  Keep the conclusion on the
  # behavior/dataflow, not on a family name, URL, or command vocabulary.
  all:
  - id: micro-behaviors/communications/http/request/client::python-post-transport
  - id: micro-behaviors/communications/http/lib/requests::response-json-call
  - id: micro-behaviors/data/serialize/json::mapping-get-executable-field
  - id: micro-behaviors/process/interpreter/python::compile-exec-mode
  - id: micro-behaviors/process/interpreter/python::exec-builtin

- id: python-http-post-payload-stage
  desc: Python HTTP POST payload staging and launch
  crit: hostile
  conf: 0.98
  attack: T1059.006,T1105,T1071.001
  mbc: B0024
  scope: leaf
  near_lines: 100
  # The same report describes update logic that POSTs for a payload, writes
  # the response, and runs the staged program.  Use existing structural
  # capabilities so this catches renamed endpoints and staging paths.
  all:
  - id: micro-behaviors/communications/http/request/client::python-post-transport
  - id: micro-behaviors/process/create/subprocess::run-ast
  needs: 1
  any:
  - id: micro-behaviors/fs/write/file/direct::python-write-response-body-path
  - id: micro-behaviors/fs/write/file/direct::python-write-response-content
  - id: micro-behaviors/fs/write/file/direct::python-write-response-read

- id: remote-config-eval
  desc: Remote configuration executed via eval()
  crit: hostile
  conf: 0.95
  mbc: "E1059"
  all:
  - id: objectives/execution/interpreter/eval/invoke::python-eval
  - id: micro-behaviors/communications/http/client/
  any:
  - id: objectives/execution/interpreter/eval/remote::eval-config-access
  - id: micro-behaviors/process/interpreter/python::eval-mapping-get
- id: client-config-execution
  desc: HTTP client config execution pattern
  crit: hostile
  conf: 0.93
  mbc: "E1059"
  near_bytes: 500
  all:
  - id: objectives/execution/interpreter/eval/invoke::python-eval
  - id: micro-behaviors/communications/http/lib/urllib::urllib-word
  - id: objectives/execution/interpreter/eval/remote::eval-config-access
- id: config-string-execution
  desc: Configuration string execution
  crit: hostile
  conf: 0.90
  all:
  - id: objectives/execution/interpreter/eval/invoke::python-eval
  any:
  - id: objectives/execution/interpreter/eval/remote::eval-config-access
  - id: objectives/execution/interpreter/eval/remote::eval-client-config
  unless:
  - id: metadata/package/testing/
  downgrade:
    any:
    - id: micro-behaviors/ui/controls/widget::qtwidgets-import
    - id: metadata/file/metrics::many-functions-50-generic
    - id: metadata/file/metrics::binary-code-size-50k
