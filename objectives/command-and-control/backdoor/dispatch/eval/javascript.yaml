# JavaScript Dynamic Code Execution
# Detects obfuscated code execution patterns in JavaScript
# ATT&CK: T1059.007 (JavaScript)
defaults:
  attack: T1059.007
  platforms: [unix, windows]
  for: [javascript]
traits:
  - id: http-post-eval-route
    desc: HTTP POST eval route
    crit: suspicious
    conf: 0.97
    attack: T1059.007,T1190
    if:
      type: text
      regex: 'onPOST\s*\(\s*["''].{0,80}(eval|execute|script).{0,20}["'']'

  - id: decoded-script-eval-dispatch
    desc: Evaluates inline decoded JavaScript
    crit: suspicious
    conf: 0.96
    if:
      type: text
      # Do not treat namespaced calls such as XQuery's util:eval() as the
      # JavaScript eval sink.  A preceding colon is not a JavaScript call
      # boundary for this signature.
      regex: '\beval\s*\(\s*(decode\w*|from\d+)\s*\('
    not:
      # decodeURI path/label decoding near UI eval handlers is not a payload
      # decode→eval edge (unlike atob / fromCharCode / decodeURIComponent).
      - regex: 'decodeURI\s*\('
    unless:
      # Construct 3's generated runtime exposes ExecJS(a), which legitimately
      # evaluates project expressions. Its nearby decodeURIComponent helper is
      # not a dataflow edge into eval.
      - id: well-known/lib/runtime/construct::html5-runtime-banner
      - id: well-known/app/ai/coding-agent/bito::vscode-extension-context
      - id: metadata/package/testing/presence/harness/
      - id: metadata/package/testing/harness/fixture::jsimplifier-benignjs-corpus-path

  - id: websocket-eval-command-marker
    desc: WebSocket handler recognizes eval commands
    crit: suspicious
    conf: 0.98
    if:
      type: text
      regex: '(?i)(startsWith|includes)\(["''][\w:./_-]{0,32}(eval|exec)\('

  - id: async-function-request-response-parameters
    desc: Dynamic function receives HTTP context
    crit: suspicious
    conf: 0.98
    for: [javascript, typescript]
    if:
      type: text
      regex: 'new\s+AsyncFunction\s*\(\s*["'']require["'']\s*,\s*["'']req["'']\s*,\s*["'']res["'']'

  - id: async-function-invoked-with-request-response
    desc: Dynamic function invoked with request response
    crit: suspicious
    conf: 0.98
    for: [javascript, typescript]
    if:
      type: text
      regex: '\bfn\s*\(\s*require\s*,\s*req\s*,\s*res\s*\)'

  - id: response-code-field
    desc: Hotfix response contains code field
    crit: suspicious
    conf: 0.95
    for: [javascript, typescript]
    if:
      type: text
      regex: '\bhotfix\b.{0,80}[_\."''](code|script|source)'

  - id: eval-response-code-property
    desc: Evaluates a response code or script property
    crit: suspicious
    conf: 0.96
    for: [javascript, typescript]
    if:
      type: text
      regex: '\beval\s*\(\s*(result|response)\s*\.\s*(code|script)\s*\)'
    unless:
      - id: well-known/app/development/vscode-extension/vsliveshare::vsliveshare-bundle-marker
  - id: eval-response-bracket-property
    desc: Evaluates a bracketed response property
    crit: suspicious
    conf: 0.96
    for: [javascript, typescript]
    if:
      type: text
      regex: '\beval\s*\(\s*(result|response)\s*\[\s*["''](code|script)["'']\s*\]\s*\)'
  - id: eval-response-execute-property
    desc: Evaluates a response execute property
    crit: suspicious
    conf: 0.98
    for: [javascript, typescript]
    if:
      type: text
      regex: '\beval\s*\(\s*(result|response)\s*\.\s*execute\s*\)'
  - id: eval-response-bracket-execute-property
    desc: Evaluates bracketed response execute property
    crit: suspicious
    conf: 0.98
    for: [javascript, typescript]
    if:
      type: text
      regex: '\beval\s*\(\s*(result|response)\s*\[\s*["'']execute["'']\s*\]\s*\)'

composite_rules:
  - id: json-http-response-execute-code
    desc: Executes code returned in a JSON execute property
    crit: hostile
    conf: 0.99
    attack: T1059.007,T1071.001
    mbc: B0032
    for: [javascript, typescript]
    near_lines: 80
    all:
      - id: micro-behaviors/communications/http/request/json::fetch-json-response
    any:
      - id: eval-response-execute-property
      - id: eval-response-bracket-execute-property
  - id: json-http-response-code-execution
    desc: Executes code returned in a JSON HTTP response
    crit: hostile
    conf: 0.99
    attack: T1059.007,T1071.001
    mbc: B0032
    for: [javascript, typescript]
    near_lines: 80
    all:
      - id: micro-behaviors/communications/http/request/client::http-client-usage
      - id: micro-behaviors/communications/http/client/response-body::js-response-text-read
      - id: micro-behaviors/data/source/property/identity::result-code-script-property
      - id: eval-response-code-property
  - id: server-response-async-code-execution
    desc: HTTP response code executes with request and response access
    crit: hostile
    conf: 0.99
    attack: T1059.007,T1071.001
    mbc: B0032
    for: [javascript, typescript]
    all:
      - id: micro-behaviors/process/interpreter/eval::js-async-function-constructor
      - id: objectives/anti-static/obfuscation/eval/require::async-function-require-arg
      - id: micro-behaviors/communications/http/post::client-wrapper-post-call
      - id: response-code-field
    any:
      - id: async-function-request-response-parameters
      - id: async-function-invoked-with-request-response

  - id: dynamic-code-execution
    desc: Dynamic code execution with obfuscation
    crit: hostile
    conf: 0.93
    all:
      - id: micro-behaviors/process/interpreter/eval::js-eval-raw
    any:
      - id: metadata/file/metrics::high-entropy-identifiers
      - id: metadata/file/metrics::high-average-string-entropy
    downgrade:
      any:
        - id: objectives/execution/interpreter/eval/dynamic::eval-function-definition
    unless:
      - id: well-known/lib/runtime/vm-browserify::browser-vm-compatibility-module
      - id: micro-behaviors/data/source/build::webpack-eval-devtool-comment
      - id: micro-behaviors/data/source/build::webpack-sourceurl-comment
      - id: metadata/build/ci/step::github-action-eval-input-parser
      - id: metadata/package/testing/harness/runtime/
      # Linter test corpora (biome noGlobalEval) ship eval() edge-case fixtures
      # under tests/specs and .snap snapshots whose diagnostic dumps read as
      # high-entropy — not a real dynamic-execution backdoor.
      - id: metadata/package/testing/presence/harness::test-directory-path
      - id: metadata/package/testing/presence/fixture::snapshot-file
      - id: metadata/lang/encoded/unicode-escape::unicode-escape-js-basename
  # A script that evaluates dynamic content AND talks to a Tor hidden service is
  # a remote-code-execution backdoor: the C2 hands back code (an "EVAL" command)
  # that the client runs. eval-of-a-variable + an onion address is the shape,
  # independent of the specific dispatch protocol.
  - id: onion-eval-c2-backdoor
    desc: Script evals commands from Tor C2
    crit: hostile
    conf: 0.95
    all:
      - id: micro-behaviors/process/interpreter/eval::js-eval-variable-argument
      - id: micro-behaviors/communications/proxy/tor::onion-domain-reference

  - id: http-decoded-eval-backdoor
    desc: HTTP POST route decodes and executes supplied JavaScript
    crit: hostile
    conf: 0.99
    attack: T1059.007,T1190,T1071.001
    mbc: B0032
    for: [javascript, typescript]
    all:
      - id: http-post-eval-route
      - id: decoded-script-eval-dispatch
      - id: micro-behaviors/process/interpreter/eval::js-member-eval-call

  - id: websocket-decoded-eval-backdoor
    desc: Message-tasked backdoor decodes and executes message content
    crit: hostile
    conf: 0.99
    attack: T1059.007,T1071.001
    mbc: B0032
    for: [javascript, typescript]
    all:
      - id: micro-behaviors/communications/ipc/message::js-event-on-message
      - id: micro-behaviors/process/interpreter/eval::js-eval-message-data
      - id: decoded-script-eval-dispatch
      - id: micro-behaviors/process/interpreter/eval::js-member-eval-call
    near_bytes: 2400

  - id: websocket-command-eval-backdoor
    desc: WebSocket command executes decoded JavaScript
    crit: hostile
    conf: 0.995
    attack: T1059.007,T1071.001
    mbc: B0032
    for: [javascript, typescript]
    all:
      - id: micro-behaviors/communications/http/websocket::websocket-constructor-call
      - id: websocket-eval-command-marker
      - id: micro-behaviors/process/interpreter/eval::js-eval-variable-argument
    near_bytes: 16000

  # The transport's message body is parsed as JSON and one of its fields is
  # executed. Requiring the WebSocket constructor, message receiver, parse,
  # and eval sink keeps ordinary WebSocket clients and local expression
  # evaluators from satisfying the remote-tasking objective independently.
  - id: websocket-json-field-eval-backdoor
    desc: WebSocket JSON message field executes as JavaScript
    crit: hostile
    conf: 0.99
    attack: T1059.007,T1071.001
    mbc: B0032
    for: [javascript, typescript]
    all:
      - id: micro-behaviors/communications/websocket/handler::websocket-library-api-reference
      - id: micro-behaviors/communications/ipc/message::js-message-event-listener
      - id: micro-behaviors/data/parse/json::json-data-property-parse
      - id: micro-behaviors/process/interpreter/eval::js-eval-object-property
    near_bytes: 2400
    unless:
      - id: well-known/tool/detection/

  # RustBucket's JavaScript stage posted a small task and executed the decoded
  # response.  Keep the composite about the dataflow (HTTP response -> decode
  # -> eval), not the campaign's URL, variable names, or polling string.
  - id: javascript-http-response-decode-eval
    desc: JavaScript decodes and evaluates an HTTP response
    crit: hostile
    conf: 0.99
    attack: T1059.007,T1105,T1140,T1071.001
    mbc: B0024,B0032
    for: [javascript, typescript]
    near_bytes: 1800
    all:
      - id: micro-behaviors/process/interpreter/eval::js-eval-variable-argument
      - id: micro-behaviors/data/decode/base64::atob-decode
      - id: micro-behaviors/communications/http/post::node-https-request-post
    any:
      - id: micro-behaviors/communications/http/response::node-response-data-event
      - id: micro-behaviors/communications/http/client/response-body::response-text
      - id: micro-behaviors/communications/http/client/response-body::js-response-text-read

  - id: javascript-periodic-http-response-backdoor
    desc: JavaScript repeatedly polls and executes decoded HTTP responses
    crit: hostile
    conf: 0.995
    attack: T1059.007,T1105,T1140,T1071.001
    mbc: B0024,B0032
    for: [javascript, typescript]
    all:
      - id: javascript-http-response-decode-eval
      - id: micro-behaviors/time/schedule/interval::setInterval

  # An explicitly C2-labelled server feeding a require-enabled Function is a
  # backdoor dispatch path, independently of the particular host or API route.
  - id: c2-labeled-json-require-backdoor
    desc: C2 JSON payload executes with require
    crit: hostile
    conf: 0.995
    attack: T1059.007,T1071.001,T1105
    mbc: B0032
    for: [javascript, typescript]
    all:
      - id: objectives/command-and-control/dropper/delivery/fetch-eval::fetch-json-message-function-loader
      - id: objectives/command-and-control/infrastructure/config::c2-server-identifier
