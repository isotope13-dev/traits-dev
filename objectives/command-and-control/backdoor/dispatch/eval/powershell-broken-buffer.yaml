# The socket read is discarded: IEX decodes a fresh zero-filled array.
# Detect the concealed backdoor attempt, without claiming working command I/O.
defaults:
  platforms:
  - windows
  for:
  - powershell
composite_rules:
- id: scheduled-socket-command-backdoor-attempt
  desc: Hidden task attempts socket command evaluation
  crit: hostile
  conf: 0.98
  attack: T1053.005,T1059.001
  all:
  - id: micro-behaviors/communications/socket/tcp::tcpclient-host-port
  - id: micro-behaviors/communications/socket/tcp::tcpclient-stream
  - id: micro-behaviors/data/decode/charset::powershell-iex-fresh-buffer-text
  - id: micro-behaviors/data/buffer/transfer::powershell-stream-buffer-write
  - id: micro-behaviors/process/interpreter/powershell/command::encodedcommand-flag-native
  - id: micro-behaviors/process/create/hidden::powershell-hidden-command-text
  - id: micro-behaviors/os/autorun/scheduled::schtasks-system-runas
  - id: micro-behaviors/os/autorun/task-trigger::schtasks-minute-short-interval
