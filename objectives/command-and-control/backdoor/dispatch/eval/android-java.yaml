defaults:
  platforms: [android]
  for: [java, kotlin]
  attack: T1059.007,T1071.001
  mbc: B0032

traits:
  - id: json-js-field-base64-decode
    desc: Decodes JSON js field as Base64
    crit: suspicious
    conf: 0.97
    if:
      type: text
      # Require both structured field access and the decoder operation. A bare
      # "js" literal or Base64 call is common and does not establish tasking.
      regex: '(?s)\.(get|opt)String\s*\(\s*"js"\s*\).{0,500}\bBase64\.decode\s*\('

composite_rules:
  - id: android-json-tasked-webview-script-execution
    desc: Executes decoded JSON task in WebView
    crit: hostile
    conf: 0.99
    scope: leaf
    near_lines: 24
    all:
      - id: json-js-field-base64-decode
      - id: micro-behaviors/data/decode/base64::android-base64-decoder-source-call
      - id: micro-behaviors/process/interpreter/webview::source-webview-evaluate-javascript-call
