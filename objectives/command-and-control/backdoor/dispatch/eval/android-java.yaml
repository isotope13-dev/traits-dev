defaults:
  platforms: [android]
  for: [java, kotlin]
  attack: T1059.007,T1071.001
  mbc: B0032

traits:
  - id: json-script-field-access
    desc: Reads a JSON script task field
    crit: component
    conf: 0.94
    if:
      type: text
      # Structured accessor syntax prevents a bare field name in prose from
      # matching while supporting alternate task-protocol field names.
      regex: '\.(get|opt)String\s*\(\s*"(js|javascript|script|scriptCode|webScript)"'

composite_rules:
  - id: json-js-field-base64-decode
    desc: Decodes a JSON script field as Base64
    crit: suspicious
    conf: 0.97
    all:
      - id: json-script-field-access
      - id: micro-behaviors/data/decode/base64::android-base64-decoder-source-call
    near_lines: 12
  - id: android-json-tasked-webview-script-execution
    desc: Executes decoded JSON task in WebView
    crit: hostile
    conf: 0.99
    scope: leaf
    near_lines: 24
    all:
      - id: json-js-field-base64-decode
      - id: micro-behaviors/data/decode/base64::android-base64-decoder-source-call
      - id: micro-behaviors/process/interpreter/webview::source-webview-evaluate-javascript-call
