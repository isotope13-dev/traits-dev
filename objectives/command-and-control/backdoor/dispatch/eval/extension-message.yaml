# This requires a code-member script argument and indirect eval inside the
# same runtime listener; independent helpers elsewhere cannot qualify.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, chrome-manifest, crx, xpi, zip]
  attack: T1059.007
composite_rules:
- id: extension-message-eval-proxy
  desc: Message listener injects a code member alongside indirect eval
  crit: hostile
  conf: 0.97
  scope: archive
  all:
  - id: micro-behaviors/process/inject/webextension::message-handler-code-argument-injection
  - id: micro-behaviors/process/interpreter/eval/indirect::js-indirect-eval-variable
  - id: micro-behaviors/process/inject/webextension::webextension-scripting-execute
