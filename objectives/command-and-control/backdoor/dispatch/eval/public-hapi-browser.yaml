# A public listener that passes an HTTP body field directly to browser
# JavaScript evaluation is an unauthenticated remote execution surface.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  attack: T1059.007,T1071.001,T1190
  mbc: B0032

composite_rules:
  - id: public-hapi-browser-script-service
    desc: Public Hapi endpoint evaluates caller-supplied browser JavaScript
    crit: hostile
    conf: 0.995
    scope: file
    all:
      - id: micro-behaviors/communications/socket/bind/address::bind-all-interfaces
      - id: micro-behaviors/communications/http/server/framework::server-hapi
      - id: micro-behaviors/communications/http/server/route::javascript-server-post-route
      - id: micro-behaviors/communications/http/server/route::hapi-route-script-payload
      - id: micro-behaviors/process/create/script/automation::browser-object-page-evaluate
