defaults:
  platforms:
    - unix
    - windows
  for: [scripts, binaries]
composite_rules:
  - id: npm-compiled-panel-archive-clues
    desc: npm compiled C2 panel and archive dependency
    crit: hostile
    conf: 0.96
    attack: T1587.001
    for:
      - package.json
    all:
      - id: objectives/command-and-control/backdoor/dispatch/panel::npm-compiled-c2-server-panel
      - id: metadata/package/dependencies/archive::dep-adm-zip
    any:
      - id: metadata/package/dependencies/blockchain::dep-solana-web3
      - id: metadata/package/dependencies/network::dep-web-push
