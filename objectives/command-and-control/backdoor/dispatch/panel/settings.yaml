# Operator UI that configures implant-builder concurrency and hourly
# quotas. Field atoms already live in this directory; the API path
# supplies the settings-surface evidence.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  attack: T1071

traits:
  - id: global-max-concurrent-field
    desc: Global max concurrent builds field
    crit: notable
    conf: 0.92
    if:
      type: text
      word: globalMaxConcurrent

  - id: max-concurrent-per-user-field
    desc: Max concurrent builds per user
    crit: notable
    conf: 0.92
    if:
      type: text
      word: maxConcurrentPerUser

composite_rules:
  - id: operator-implant-builder-rate-limit
    desc: Operator implant-builder rate-limit settings
    crit: hostile
    conf: 0.96
    all:
      - id: build-rate-limit-field
      - id: max-builds-per-hour-field
      - id: global-max-concurrent-field
      - id: micro-behaviors/communications/http/panel::api-settings-build-rate-limit-path
