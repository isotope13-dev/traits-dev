# Authenticated operator-panel file-share upload with PE MIME mapping
# and a download-password header. Distinguishes a C2 payload locker
# from a generic disk file manager.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  attack: T1071.001,T1105

traits:
  - id: can-upload-files-fn
    desc: canUploadFiles upload permission helper
    crit: notable
    conf: 0.9
    if:
      type: text
      word: canUploadFiles

composite_rules:
  - id: operator-file-share-upload-panel
    desc: Operator panel file-share upload gate
    crit: hostile
    conf: 0.96
    all:
      - id: can-upload-files-fn
      - id: micro-behaviors/communications/http/download/handler::api-file-share-upload-route
      - id: micro-behaviors/communications/http/header/content-type::pe-portable-executable-media-type
      - id: micro-behaviors/communications/http/header/custom::x-download-password-header
