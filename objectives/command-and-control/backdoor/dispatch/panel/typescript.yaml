# TypeScript C2 panel that enrolls implants and rate-limits agent
# builder jobs. Generic field names stay notable; hostility is the
# combination with an agent token and enrollment gate.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  attack: T1071

traits:
  - id: build-rate-limit-field
    desc: Agent build rate-limit field
    crit: notable
    conf: 0.93
    if:
      type: text
      word: buildRateLimit

  - id: max-builds-per-hour-field
    desc: Max agent builds per hour
    crit: notable
    conf: 0.92
    if:
      type: text
      word: maxBuildsPerHour

  - id: enrollment-require-approval-block
    desc: Enrollment requireApproval config block
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: 'enrollment:[\s\S]{0,80}requireApproval'

  - id: agent-token-ts-field
    desc: TypeScript agentToken config field
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '\bagentToken\s*:'

composite_rules:
  - id: implant-builder-enrollment-panel
    desc: Implant builder enrollment control panel
    crit: hostile
    conf: 0.96
    all:
      - id: build-rate-limit-field
      - id: max-builds-per-hour-field
      - id: enrollment-require-approval-block
      - id: agent-token-ts-field
