defaults:
  platforms: [windows]
  for: [pe, dll]
  conf: 0.96
composite_rules:
  - id: messagepack-registry-cached-plugin-dispatch-references
    desc: MessagePack TLS client with registry cache and dynamic activation
    crit: suspicious
    attack: T1620,T1112
    all:
      - id: micro-behaviors/metaprogramming/reflection/inspect/class/construction::managed-load-activate-dynamic-dispatch-calls
      - id: micro-behaviors/data/serialize/msgpack::managed-messagepack-decode-call
      - id: micro-behaviors/os/registry/read::dotnet-registry-value-read-api
      - id: micro-behaviors/os/registry/value/write::dotnet-registrykey-setvalue-references
      - id: micro-behaviors/communications/tls/initialize::dotnet-sslstream-type
      - id: micro-behaviors/data/codec::gzipstream-dotnet
