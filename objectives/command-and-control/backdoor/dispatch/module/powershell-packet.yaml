defaults:
  platforms: [windows]
  for: [powershell]

composite_rules:
  - id: powershell-socket-script-command-dispatch
    desc: PowerShell socket tasking evaluates encoded scripts
    crit: hostile
    conf: 0.99
    attack: T1059.001
    all:
      - id: micro-behaviors/data/control-flow/branch::powershell-packet-field-switch
      - id: micro-behaviors/communications/socket/receive::powershell-sslstream-read-callback
      - id: micro-behaviors/data/decode/base64::powershell-base64-script-field
      - id: micro-behaviors/data/collection/map::powershell-eval-result-packet
      - id: micro-behaviors/process/interpreter/eval/direct::powershell-iex-text

  - id: powershell-socket-managed-plugin-dispatch
    desc: PowerShell socket tasking loads managed plugin bytes
    crit: hostile
    conf: 0.99
    attack: T1620
    all:
      - id: powershell-socket-script-command-dispatch
      - id: micro-behaviors/process/interpreter/reflection/runtime::powershell-base64-object-field-assembly-load
      - id: micro-behaviors/process/interpreter/reflection/runtime::powershell-assembly-load-call
