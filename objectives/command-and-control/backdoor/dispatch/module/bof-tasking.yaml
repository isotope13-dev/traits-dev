defaults:
  platforms: [linux, macos, windows]
  for: [binaries, go, c, cpp]
  attack: T1620,T1071
  mbc: B0030

composite_rules:
  - id: outbound-c2-transport-clue
    desc: Outbound socket or HTTP client transport
    crit: notable
    conf: 0.9
    any:
      - id: micro-behaviors/communications/socket/dial::net-dial-text
      - id: micro-behaviors/communications/socket/connect/
      - id: micro-behaviors/communications/http/client/

  - id: bof-dispatch-handler-clue
    desc: Remote tasking or BOF dispatch handler
    crit: notable
    conf: 0.92
    any:
      - id: micro-behaviors/process/interpreter/bof::exec-bof-routine-name
      - id: micro-behaviors/data/serialize/envelope::serialized-task-job-dispatch-envelope
      - id: micro-behaviors/data/serialize/envelope::encrypted-endpoint-profile-schema

  - id: network-bof-tasking-agent
    desc: C2 agent dispatches in-memory BOF tasks
    crit: hostile
    conf: 0.98
    scope: leaf
    all:
      - id: micro-behaviors/process/interpreter/bof::bof-loader-capability
      - id: outbound-c2-transport-clue
      - id: bof-dispatch-handler-clue
