defaults:
  platforms: [windows]
  for: [pe, dll]
  attack: T1105,T1620

traits:
  - id: load-dll-task-token
    desc: Remote DLL-loading task token
    crit: component
    conf: 0.86
    if:
      type: text
      exact: load_dll
      section: .text

  - id: save-plugin-task-token
    desc: Save-plugin task token
    crit: component
    conf: 0.96
    if:
      type: text
      exact: savePlugin

  - id: send-plugin-task-token
    desc: Send-plugin request token
    crit: component
    conf: 0.96
    if:
      type: text
      exact: sendPlugin

  - id: plugin-dot-plugin-type
    desc: Plugin.Plugin managed type name
    crit: component
    conf: 0.96
    if:
      type: text
      exact: Plugin.Plugin

composite_rules:
  - id: remote-managed-plugin-loader
    desc: Remote managed plugin download and load chain
    crit: hostile
    conf: 0.99
    all:
      - id: load-dll-task-token
      - id: micro-behaviors/communications/http/client/managed::httpclient-bytearray-download
      - id: micro-behaviors/fs/write/file/direct::dotnet-writeallbytes-token
      - id: micro-behaviors/data/embedded/payload/resource::assemblyresolve-hook

  - id: messagepack-managed-plugin-tasking
    desc: MessagePack tasking loads and invokes a managed plugin
    crit: hostile
    conf: 0.99
    all:
      - id: objectives/anti-static/obfuscation/reflection/invoke::dotnet-appdomain-invokemember-load-instance
      - id: plugin-dot-plugin-type
      - id: save-plugin-task-token
      - id: send-plugin-task-token
    any:
      - id: micro-behaviors/data/serialize/msgpack::dotnet-messagepacklib-namespace
      - id: micro-behaviors/data/serialize/msgpack::dotnet-msgpack-type-name
