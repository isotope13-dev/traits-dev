defaults:
  platforms: [windows]
  for: [pe, dll]
  attack: T1105,T1620

traits:
  - id: load-dll-task-token
    desc: Remote DLL-loading task token
    crit: component
    conf: 0.86
    if:
      type: text
      exact: load_dll
      section: .text

composite_rules:
  - id: remote-managed-plugin-loader
    desc: Remote managed plugin download and load chain
    crit: hostile
    conf: 0.99
    all:
      - id: load-dll-task-token
      - id: micro-behaviors/communications/http/client/managed::httpclient-bytearray-download
      - id: micro-behaviors/fs/write/file/direct::dotnet-writeallbytes-token
      - id: micro-behaviors/data/embedded/payload/resource::assemblyresolve-hook
