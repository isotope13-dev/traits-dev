defaults:
  platforms:
  - windows
  for:
  - pe
  - dll
  attack: T1105,T1620
traits:
- id: load-dll-task-token
  desc: Remote DLL-loading task token
  crit: notable
  conf: 0.86
  if:
    type: text
    exact: load_dll
    section: .text
composite_rules:
- id: remote-managed-plugin-loader
  desc: Remote managed plugin download and load chain
  crit: hostile
  conf: 0.99
  all:
  - id: load-dll-task-token
  - id: micro-behaviors/communications/http/get::getbytearrayasync
  - id: micro-behaviors/fs/write/file/full/bytes::dotnet-writeallbytes-token
  - id: micro-behaviors/process/interpreter/runtime/clr::assembly-resolve-event-api
- id: messagepack-managed-plugin-tasking
  desc: MessagePack plugin tasking with managed activation
  crit: hostile
  conf: 0.99
  all:
  - id: micro-behaviors/metaprogramming/reflection/inspect/class/construction::managed-reflective-activation-references
  - id: micro-behaviors/communications/transfer::plugin-transfer-command-token
  - id: messagepack-plugin-activation-contract
  any:
  - id: micro-behaviors/data/serialize/msgpack::dotnet-messagepacklib-namespace
  - id: micro-behaviors/data/serialize/msgpack::dotnet-msgpack-type-name
- id: messagepack-plugin-activation-contract
  desc: Named plugin entry or registry-cached activation contract
  crit: notable
  conf: 0.96
  # Preserve the named interface variant while admitting renamed interfaces
  # only with the stronger call-based registry-cache/activation profile.
  any:
  - id: metadata/binary/symbols/name/qualified/runtime::dotnet-plugin-type-name
  - id: messagepack-registry-cached-plugin-dispatch-references
- id: managed-plugin-tasking-backdoor
  desc: Plugin tasking with receive, activation and Rijndael references
  crit: hostile
  conf: 0.98
  all:
  - id: metadata/lang/compiler/managed::dotnet-assembly
  - id: micro-behaviors/communications/transfer::plugin-transfer-command-token
  - id: micro-behaviors/crypto/symmetric/aes/reference::dotnet-rijndael
  - id: micro-behaviors/communications/socket/receive::dotnet-begin-receive-method-token
  - id: micro-behaviors/metaprogramming/reflection/inspect/class/invocation::dotnet-load-instance-dispatch-members
  any:
  - id: micro-behaviors/os/security/policy::powershell-policy-bypass-text
  - id: micro-behaviors/data/format/string::start-ddos-command-token
  - id: micro-behaviors/os/registry/autostart/reference::currentversion-run-key-path
  - id: objectives/discovery/host/security::wmi-security-product-enumeration
