defaults:
  platforms:
  - windows
  for:
  - pe
  - dll
  attack: T1105,T1620
traits:
- id: load-dll-task-token
  desc: Remote DLL-loading task token
  crit: notable
  conf: 0.86
  if:
    type: text
    exact: load_dll
    section: .text
composite_rules:
- id: remote-managed-plugin-loader
  desc: Remote managed plugin download and load chain
  crit: hostile
  conf: 0.99
  all:
  - id: load-dll-task-token
  - id: micro-behaviors/communications/http/get::getbytearrayasync
  - id: micro-behaviors/fs/write/file/full::dotnet-writeallbytes-token
  - id: micro-behaviors/process/interpreter/runtime/clr::assembly-resolve-event-api
- id: messagepack-managed-plugin-tasking
  desc: MessagePack plugin task tokens with managed load and invocation APIs
  crit: hostile
  conf: 0.99
  all:
  - id: micro-behaviors/metaprogramming/reflection::managed-reflective-activation-references
  - id: metadata/binary/symbols/name/qualified::dotnet-plugin-type-name
  - id: micro-behaviors/data/format/string::plugin-transfer-command-token
  any:
  - id: micro-behaviors/data/serialize/msgpack::dotnet-messagepacklib-namespace
  - id: micro-behaviors/data/serialize/msgpack::dotnet-msgpack-type-name
- id: managed-plugin-tasking-backdoor
  desc: Plugin tasking with receive, activation and Rijndael references
  crit: hostile
  conf: 0.98
  all:
  - id: metadata/binary/framework::dotnet-assembly
  - id: micro-behaviors/data/format/string::plugin-transfer-command-token
  - id: micro-behaviors/crypto/symmetric/aes/library::dotnet-rijndael
  - id: micro-behaviors/communications/socket/receive::dotnet-begin-receive-method-token
  - id: micro-behaviors/process/interpreter/reflection/runtime::dotnet-load-instance-dispatch-members
  any:
  - id: micro-behaviors/os/security/policy::powershell-policy-bypass-text
  - id: micro-behaviors/data/format/string::start-ddos-command-token
  - id: micro-behaviors/os/registry/keys/autostart::currentversion-run-key-path
  - id: objectives/discovery/host/security::wmi-security-product-enumeration
  unless:
  - id: metadata/signed/platform/
  - id: well-known/tool
  - id: well-known/lib
