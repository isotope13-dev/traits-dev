defaults:
  platforms: [windows]
  for: [pe, dll]
  attack: T1105,T1620

traits:
  - id: load-dll-task-token
    desc: Remote DLL-loading task token
    crit: notable
    conf: 0.86
    if:
      type: text
      exact: load_dll
      section: .text

  - id: save-plugin-task-token
    desc: Save-plugin task token
    crit: notable
    conf: 0.96
    if:
      type: text
      exact: savePlugin

  - id: send-plugin-task-token
    desc: Send-plugin request token
    crit: notable
    conf: 0.96
    if:
      type: text
      exact: sendPlugin

composite_rules:
  - id: remote-managed-plugin-loader
    desc: Remote managed plugin download and load chain
    crit: hostile
    conf: 0.99
    all:
      - id: load-dll-task-token
      - id: micro-behaviors/communications/http/client/managed::httpclient-bytearray-download
      - id: micro-behaviors/fs/write/file/full::dotnet-writeallbytes-token
      - id: micro-behaviors/process/interpreter/runtime/clr::assembly-resolve-event-api

  # Builds differ in which plugin verb they keep as a bare string (savePlugin,
  # sendPlugin); either one names the plugin-delivery task.
  - id: plugin-task-token
    desc: Save or send plugin task token
    crit: notable
    conf: 0.96
    any:
      - id: save-plugin-task-token
      - id: send-plugin-task-token

  - id: messagepack-managed-plugin-tasking
    desc: MessagePack plugin task tokens with managed load and invocation APIs
    crit: hostile
    conf: 0.99
    all:
      - id: micro-behaviors/process/interpreter/reflection/runtime::dotnet-appdomain-load-instance-tokens
      - id: micro-behaviors/metaprogramming/reflection::dotnet-plugin-type-name
      - id: plugin-task-token
    any:
      - id: micro-behaviors/data/serialize/msgpack::dotnet-messagepacklib-namespace
      - id: micro-behaviors/data/serialize/msgpack::dotnet-msgpack-type-name
