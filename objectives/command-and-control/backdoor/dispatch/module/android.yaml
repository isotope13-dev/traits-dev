defaults:
  platforms: [android, unix]
  for: [elf, apk, python, javascript, java, kotlin, c, cpp]
  attack: T1059.007,T1105
  mbc: B0032

traits:
  - id: remote-script-snapshot-identifier
    desc: Remote script snapshot identifier
    crit: component
    conf: 0.9
    if:
      type: text
      regex: '(?i)\bscript[A-Za-z0-9_]*snapshot\b'

  - id: remote-script-module-list
    desc: Remote script module list
    crit: component
    conf: 0.9
    if:
      type: text
      regex: '(?i)\bmodules?\.txt\b'

  - id: remote-script-fetch
    desc: Fetches a remote script module
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: '(?is)\b(fetch|urlopen)\s*\([^)]{0,180}\b(script|modules?)\b'

  - id: python-module-fetch
    desc: Python fetches a remote module
    crit: notable
    conf: 0.94
    for: [python, pyc]
    if:
      type: text
      regex: '(?is)\brequests\.(get|post)\s*\([^)]{0,180}\b(script|modules?)\b'

  - id: remote-script-source-evaluation
    desc: Evaluates fetched script source
    crit: suspicious
    conf: 0.96
    if:
      type: text
      regex: '(?is)\beval\s*\(\s*[A-Za-z_$][A-Za-z0-9_$]*(source|script|module)\b'

  - id: named-script-source-evaluation
    desc: Evaluates named script source
    crit: suspicious
    conf: 0.94
    if:
      type: text
      regex: '(?is)\beval\s*\([^)]{0,80}["''](javascript|script|module)["'']'

composite_rules:
  - id: android-remote-script-module-execution
    desc: Android C2-delivered script module execution
    crit: hostile
    conf: 0.99
    all:
      - id: remote-script-source-evaluation
    any:
      - id: remote-script-fetch
      - id: python-module-fetch
      - id: remote-script-snapshot-identifier
      - id: remote-script-module-list
