defaults:
  platforms: [android, unix]
  for: [elf, apk, python, javascript, java, kotlin, c, cpp]
  attack: T1059.007,T1105
  mbc: B0032

traits:
  - id: remote-script-snapshot-identifier
    desc: Remote script snapshot identifier
    crit: component
    conf: 0.9
    if:
      type: text
      regex: '(?i)\bscript[A-Za-z0-9_]*snapshot\b'

  - id: remote-script-module-list
    desc: Remote script module list
    crit: component
    conf: 0.9
    if:
      type: text
      regex: '(?i)\bmodules?\.txt\b'

  - id: named-script-source-evaluation
    desc: Evaluates named script source
    crit: suspicious
    conf: 0.94
    if:
      type: text
      # CommonJS/Yarn uses eval("module") to recover the module object; that
      # is a lookup, not evaluation of script source.
      regex: '(?is)\beval\s*\(\s*["''](javascript|script)["'']'
    unless:
      # Webpack/Rspack's eval devtool wraps ordinary generated modules in
      # eval() strings and commonly contains the words javascript/module.
      - id: micro-behaviors/data/source/build::webpack-sourceurl-comment

  - id: java-script-engine-eval-source
    desc: ScriptEngine evaluates a source variable
    crit: suspicious
    conf: 0.95
    for: [java, kotlin, apk, zip]
    if:
      type: text
      regex: '(?is)\bScriptEngine\b.{0,160}\beval\s*\(\s*[A-Za-z_$][A-Za-z0-9_$]*[Ss]ource\b'

  - id: java-script-engine-eval-module
    desc: ScriptEngine evaluates a module variable
    crit: suspicious
    conf: 0.95
    for: [java, kotlin, apk, zip]
    if:
      type: text
      regex: '(?is)\bScriptEngine\b.{0,160}\beval\s*\(\s*[A-Za-z_$][A-Za-z0-9_$]*[Mm]odule\b'

  - id: java-script-engine-eval-code
    desc: ScriptEngine evaluates a code variable
    crit: suspicious
    conf: 0.95
    for: [java, kotlin, apk, zip]
    if:
      type: text
      regex: '(?is)\bScriptEngine\b.{0,160}\beval\s*\(\s*[A-Za-z_$][A-Za-z0-9_$]*[Cc]ode\b'

composite_rules:
  # scope: leaf — the retrieval and the eval must live in the same analyzed
  # unit. Without it the legs pool across every entry of a package tarball, so
  # an eval() in one bundled runtime plus an unrelated `fetch('…​.js')` in
  # another file convicted the official Next.js release.
  - id: android-remote-script-module-execution
    desc: Android C2-delivered script module execution
    crit: hostile
    conf: 0.99
    scope: leaf
    all:
      - id: micro-behaviors/process/interpreter/eval::js-eval-variable-text
    any:
      - id: remote-script-fetch
      - id: python-module-fetch
      - id: remote-script-snapshot-identifier
      - id: remote-script-module-list
    unless:
      - id: well-known/app/development/vscode-extension/dbcode::extension-context

  - id: jvm-remote-script-module-execution
    desc: JVM HTTP client evaluates a script module
    crit: hostile
    conf: 0.98
    for: [java, kotlin, apk, zip]
    all:
      - id: micro-behaviors/communications/http/client/library::java-http-url-connection
      - id: java-script-module-source-evaluation

  - id: java-script-module-source-evaluation
    desc: JVM evaluates a script module variable
    crit: suspicious
    conf: 0.95
    for: [java, kotlin, apk, zip]
    any:
      - id: java-script-engine-eval-source
      - id: java-script-engine-eval-module
      - id: java-script-engine-eval-code
