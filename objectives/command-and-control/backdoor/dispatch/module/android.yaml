defaults:
  platforms: [android, unix]
  for: [elf, android_apk, python, javascript, java, kotlin, c, cpp]
  attack: T1059.007,T1105
  mbc: B0032

composite_rules:
  - id: jvm-remote-script-module-execution
    desc: JVM HTTP client evaluates a script module
    crit: hostile
    conf: 0.98
    for: [java, kotlin]
    # Same leaf scope as android-remote-script-module-execution: without
    # it, HttpURLConnection in one archive member plus ScriptEngine.eval in
    # another (e.g. Spring Framework) false-positives as remote C2.
    scope: leaf
    all:
      - id: micro-behaviors/communications/http/client/library::java-http-url-connection
      - id: micro-behaviors/process/interpreter/runtime/jvm::java-scriptengine-eval-variable
