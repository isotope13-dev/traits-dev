defaults:
  platforms: [android, unix]
  for: [elf, apk, python, javascript, java, kotlin, c, cpp]
  attack: T1059.007,T1105
  mbc: B0032

traits:
  - id: named-script-source-evaluation
    desc: Evaluates named script source
    crit: suspicious
    conf: 0.94
    if:
      type: text
      # CommonJS/Yarn uses eval("module") to recover the module object; that
      # is a lookup, not evaluation of script source.
      regex: '(?is)\beval\s*\(\s*["''](javascript|script)["'']'
    unless:
      # Webpack/Rspack's eval devtool wraps ordinary generated modules in
      # eval() strings and commonly contains the words javascript/module.
      - id: micro-behaviors/data/source/build::webpack-sourceurl-comment

  - id: java-script-engine-eval-source
    desc: ScriptEngine evaluates a source variable
    crit: suspicious
    conf: 0.95
    for: [java, kotlin, apk, zip]
    if:
      type: text
      # Require the *Source identifier to be the eval argument (or first of
      # several). `eval(scriptSource.getScriptAsString())` is framework
      # ScriptSource plumbing, not evaluating a source-named payload var.
      regex: '(?is)\bScriptEngine\b.{0,160}\beval\s*\(\s*[A-Za-z_$][A-Za-z0-9_$]*[Ss]ource\s*[,)]'

  - id: java-script-engine-eval-module
    desc: ScriptEngine evaluates a module variable
    crit: suspicious
    conf: 0.95
    for: [java, kotlin, apk, zip]
    if:
      type: text
      regex: '(?is)\bScriptEngine\b.{0,160}\beval\s*\(\s*[A-Za-z_$][A-Za-z0-9_$]*[Mm]odule\s*[,)]'

  - id: java-script-engine-eval-code
    desc: ScriptEngine evaluates a code variable
    crit: suspicious
    conf: 0.95
    for: [java, kotlin, apk, zip]
    if:
      type: text
      regex: '(?is)\bScriptEngine\b.{0,160}\beval\s*\(\s*[A-Za-z_$][A-Za-z0-9_$]*[Cc]ode\s*[,)]'

composite_rules:
  - id: jvm-remote-script-module-execution
    desc: JVM HTTP client evaluates a script module
    crit: hostile
    conf: 0.98
    for: [java, kotlin, apk, zip]
    # Same leaf scope as android-remote-script-module-execution: without
    # it, HttpURLConnection in one archive member plus ScriptEngine.eval in
    # another (e.g. Spring Framework) false-positives as remote C2.
    scope: leaf
    all:
      - id: micro-behaviors/communications/http/client/library::java-http-url-connection
      - id: java-script-module-source-evaluation

  - id: java-script-module-source-evaluation
    desc: JVM evaluates a script module variable
    crit: suspicious
    conf: 0.95
    for: [java, kotlin, apk, zip]
    any:
      - id: java-script-engine-eval-source
      - id: java-script-engine-eval-module
      - id: java-script-engine-eval-code
