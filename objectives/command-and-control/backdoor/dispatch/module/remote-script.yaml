# A script module is pulled over the network and handed straight to the
# interpreter — the C2 module-dispatch shape in script runtimes.
#
# Two component atoms used to widen this composite and were removed rather than
# repaired, because neither token carries any remote-delivery meaning:
#   * /script\w*snapshot/ ("Remote script snapshot identifier") is the
#     TypeScript language service API — `ts.IScriptSnapshot`,
#     `getScriptSnapshot` — so every editor that bundles the TS worker supplied
#     it (monaco-editor, and through it the DBCode SQL extension's langserver).
#   * /modules?\.txt/ ("Remote script module list") is an ordinary filename.
# Paired with a bare `eval(identifier)` they escalated ordinary bundles to
# hostile. Both remaining legs require an actual fetch of the module.
defaults:
  platforms: [linux, macos, windows]
  for: [javascript, typescript, python, pyc]
  attack: T1059.007,T1105
  mbc: B0032

traits:
  - id: remote-script-fetch
    desc: Fetches an external JavaScript module
    crit: notable
    conf: 0.94
    platforms: [unix, windows, android]
    for: [elf, apk, python, javascript, java, kotlin, c, pyc]
    if:
      type: text
      regex: '(?is)\b(fetch|urlopen)\s*\(\s*["'']https?://[^"'']{1,120}\.m?js\b'

  - id: python-module-fetch
    desc: Python fetches a remote module
    crit: notable
    conf: 0.94
    platforms: [unix, windows, android]
    for: [python, pyc]
    if:
      type: text
      regex: '(?is)\brequests\.(get|post)\s*\([^)]{0,180}\b(script|modules?)\b'

composite_rules:
  - id: remote-script-module-fetch-and-eval
    desc: Fetches a remote script module and evaluates it
    crit: hostile
    conf: 0.99
    all:
      - id: micro-behaviors/process/interpreter/eval::js-eval-variable-text
    any:
      - id: remote-script-fetch
      - id: python-module-fetch
