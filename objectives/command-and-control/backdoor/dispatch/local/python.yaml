defaults:
  platforms: [windows, unix]
  for: [python]
  attack: T1059.006

traits:
- id: local-http-backdoor-endpoints--rx-1
  desc: "Matches 'self.paths'"
  crit: notable
  conf: 0.9
  if:
    type: text
    regex: self\.path\s*==\s*['"]/(probe|stream)['"]

- id: local-http-backdoor-endpoints--rx-2
  desc: "Matches 'self.paths'"
  crit: notable
  conf: 0.9
  if:
    type: text
    regex: self\.path\s*==\s*['"]/(buffer|flush)['"]

- id: local-http-backdoor-endpoints--rx-3
  desc: "Matches 'self.paths'"
  crit: notable
  conf: 0.9
  if:
    type: text
    regex: self\.path\s*==\s*['"]/(commit|capture)['"]

- id: local-http-backdoor-endpoints--rx-4
  desc: "Matches 'self.paths'"
  crit: notable
  conf: 0.9
  count_min: 4
  if:
    type: text
    regex: self\.path\s*==\s*['"]/(gc)['"]

- id: screenshot-capture-api
  desc: Screenshot capture API marker
  crit: component
  conf: 0.9
  if:
    type: text
    regex: 'ImageGrab|\bmss\b|Image\.grab'

composite_rules:
- id: python-injected-code-control-channel
  desc: Injected Python child hook with command code execution
  crit: hostile
  conf: 0.99
  mbc: B0030
  attack: T1059.006,T1546
  for: [whl, python, pkginfo]
  scope: archive
  all:
  - id: micro-behaviors/process/hook/interception::python-sitecustomize-startup-hook
  - id: micro-behaviors/process/create/subprocess/launch::popen-ast
  - id: micro-behaviors/process/interpreter/eval/python-builtins::eval-builtin
  - id: micro-behaviors/process/interpreter/eval/python-builtins::exec-builtin
  unless:
  - id: well-known/tool/development/debug/h4-debugger::h4-debugger-repl-context
  - id: well-known/tool/development/debug/h4-debugger::h4-debugger-summary
- id: capture-endpoint-screenshot
  desc: Local HTTP capture screenshot handler
  crit: suspicious
  conf: 0.9
  near_lines: 40
  all:
  - id: screenshot-capture-api
  any:
  - id: micro-behaviors/communications/http/server/framework::capture-route-decorator
  - id: micro-behaviors/communications/http/server/framework::capture-add-url-rule
- id: python-local-http-command-backdoor
  desc: Python local HTTP command backdoor
  crit: hostile
  conf: 0.97
  all:
  - id: local-http-backdoor-endpoints
  - id: micro-behaviors/communications/http/server/framework::threaded-python-http-server
  any:
  - id: micro-behaviors/process/deploy/interpreter-command::python-powershell-subprocess
  - id: micro-behaviors/process/create/subprocess/launch::process-execution
  - id: capture-endpoint-screenshot
  - id: micro-behaviors/communications/http/server/listener::loopback-app-port-after-host
  - id: micro-behaviors/communications/http/server/listener::loopback-app-port-before-host
  needs: 2
- id: local-http-backdoor-endpoints
  desc: Local HTTP backdoor endpoints
  crit: component
  conf: 0.9
  any:
  - id: local-http-backdoor-endpoints--rx-1
  - id: local-http-backdoor-endpoints--rx-2
  - id: local-http-backdoor-endpoints--rx-3
  - id: local-http-backdoor-endpoints--rx-4
