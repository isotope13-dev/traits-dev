defaults:
  platforms: [windows, unix]
  for: [python]
  attack: T1059.006

composite_rules:
  - id: python-tcp-code-evaluation-server
    desc: Python TCP server evaluates received code
    crit: suspicious
    conf: 0.95
    near_lines: 160
    all:
      - id: micro-behaviors/communications/socket/listen::asyncio-start-server-call
      - id: micro-behaviors/communications/socket/receive::socket-data-transfer
      - id: micro-behaviors/process/interpreter/python::eval-builtin
      - id: micro-behaviors/process/interpreter/python::exec-builtin
    unless:
      - id: well-known/app/subsequence::benign-live-coding-server-context
