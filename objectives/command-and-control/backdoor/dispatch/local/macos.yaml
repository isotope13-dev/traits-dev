defaults:
  crit: hostile
  platforms:
  - macos
  for:
  - macho
  attack: T1071.001
traits:
  # objectives/persistence/system/surface/paths::remote-login-enabled is
  # scoped for: [shell] only -- its own comment restricts the raw
  # command-string detector to command-oriented files because Python hook/
  # test sources embed the command as inert data. An AppleScript backdoor
  # runs the same command through `do shell script "..."`; anchor on that
  # idiom rather than copying the bare command-string match verbatim (which
  # would just be the same trait logic under a second id).
  - id: applescript-remote-login-enabled
    desc: Remote Login service enabled
    crit: suspicious
    conf: 0.84
    attack: T1021.004
    for: [applescript]
    if:
      type: text
      regex: 'do shell script.{0,120}(systemsetup\s+-setremotelogin\s+on|com\.apple\.access_ssh)'
    unless:
    - id: metadata/package/files/ecosystem::conda-shell-activation-layout
    - id: well-known/app/storage/carbon-copy-cloner::official-carbon-copy-cloner-member
  # micro-behaviors/os/autorun/cron::crontab-file-install is for: [shell,
  # python, ruby, perl] only, missing applescript for the same `do shell
  # script "crontab /path"` reason as remote-login-enabled above.
  - id: applescript-crontab-file-install
    desc: Installs crontab entries from a file
    crit: notable
    conf: 0.85
    for: [applescript]
    unless:
      - id: well-known/app/infrastructure/pihole::pihole-artifact
      - id: well-known/app/system/aks-engine/
      - id: metadata/package/files/dependency::os-image-root-file-path
    if:
      type: text
      regex: 'do shell script.{0,120}\bcrontab\s+/[^\s|]{3,60}'
composite_rules:
- id: macos-native-c2-agent
  desc: macOS osascript/codesign C2 agent
  crit: hostile
  conf: 0.97
  all:
  - id: micro-behaviors/os/security/gatekeeper::codesign-force-adhoc
  - id: micro-behaviors/process/create/script/osascript::osascript-binary-ref
  - id: micro-behaviors/fs/temp/mktemp::mkstemps-fn
  - id: objectives/evasion/masquerade/identity/user-agent::user-agent-msie8
  any:
  - id: objectives/discovery/host/system::apple-setup-done-ctime
- id: applescript-modular-c2-agent
  desc: AppleScript modular C2 agent
  crit: hostile
  conf: 0.99
  for: [applescript]
  attack: T1071.001,T1059.002,T1105
  all:
  - id: objectives/exfiltration/stealer/system-info::applescript-host-profile-exfil
  - id: objectives/command-and-control/dropper/staging/memory::applescript-c2-module-exec
  any:
  - id: objectives/discovery/host/software::mdfind-bundle-id-query
  - id: objectives/discovery/host/browser/identity::macos-launchservices-default-browser
  - id: objectives/discovery/host/security::csrutil-status-query
- id: applescript-remote-admin-persistence
  desc: AppleScript remote admin persistence backdoor
  crit: hostile
  conf: 0.97
  for: [applescript]
  attack: T1021.004,T1053.003,T1548.004
  all:
  - id: applescript-remote-login-enabled
  - id: applescript-crontab-file-install
  # admin-privilege-escalation is for: [shell, python, javascript, macho] --
  # its own sibling composite shell-admin (same file) is the applescript-
  # scoped equivalent, combining the same two legs.
  - id: objectives/privilege-escalation/elevation-control/prompt-escalation::shell-admin
  any:
  - id: objectives/credential-access/phishing/lure::hidden-answer
  - id: micro-behaviors/fs/path/config/privesc::etc-sudoers
  - id: micro-behaviors/os/security/directory-service::dscl-cli
  needs: 3
  unless:
  - id: metadata/package/files/ecosystem::conda-shell-activation-layout
