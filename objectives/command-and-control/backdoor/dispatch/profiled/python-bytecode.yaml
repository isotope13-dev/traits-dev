defaults:
  platforms: [windows, unix]
  for: [pyc]
  crit: notable
  conf: 0.95

traits:
  - id: pyc-inbound-task-dispatch-name
    desc: Bytecode names inbound task dispatch
    if:
      type: symbol
      kind: identifier
      regex: '^(handle_inbound|dispatch_command|dispatch_task|cmd_loop)$'

  - id: pyc-shell-task-handler-name
    desc: Bytecode names a shell task handler
    if:
      type: symbol
      kind: identifier
      regex: '^(h_shell|shell_handler|handle_shell|shell_task)$'

composite_rules:
  - id: pyc-socket-shell-with-browser-credential-recovery
    desc: Bytecode names socket shell tasking and browser credential recovery
    crit: hostile
    conf: 0.97
    attack: T1059,T1555.003
    all:
      - id: pyc-inbound-task-dispatch-name
      - id: pyc-shell-task-handler-name
      - id: micro-behaviors/process/create/subprocess/launch::pyc-popen-reference
      - id: micro-behaviors/communications/socket/receive::socket-recv-pyc-name
      - id: objectives/credential-access/browser/multi-target::pyc-multiple-browser-secret-recovery
