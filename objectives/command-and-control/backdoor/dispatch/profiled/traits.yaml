defaults:
  platforms:
  - windows
  - unix
  for:
  - javascript
  - typescript
  attack: T1071.001,T1041,T1105
composite_rules:
- id: host-profile-exfil-source
  desc: Host profile exfiltration source
  crit: component
  conf: 0.96
  any:
  - id: objectives/exfiltration/stealer/system-info
  - id: objectives/discovery/system/profile
  - id: objectives/discovery/network/enumeration::routeros-js-network-config-query-set
  - id: micro-behaviors/communications/http/telemetry::sentry-default-pii-enabled
  - id: micro-behaviors/communications/http/telemetry::sentry-ip-address-user-field
  - id: micro-behaviors/data/encode/base64::node-encoded-post-form-fields
  - id: micro-behaviors/data/serialize/schema-object::node-compact-telemetry-fields
  - id: micro-behaviors/os/telemetry/logging/event::agent-status-label
  needs: 2
- id: remote-fetch-exec-source
  desc: Remote fetched execution source
  crit: component
  conf: 0.96
  any:
  - id: objectives/command-and-control/dropper/delivery/fetch-exec::hex-decoded-http-stream-exe-dropper
  - id: objectives/command-and-control/dropper/delivery/fetch-exec::npm-lifecycle-hex-stream-exe-dropper
  - id: objectives/command-and-control/dropper/delivery/fetch-exec::npm-postinstall-hex-stream-exe-dropper
  - id: objectives/execution/payload/file-exec/command/shell::axios-stream-write-exec-hidden-dropper
  - id: objectives/execution/payload/file-exec/command/shell::axios-stream-appdata-hidden-exe-dropper
  needs: 2
- id: profiled-remote-exec-agent
  desc: Profile exfiltration with remote execution
  crit: hostile
  conf: 0.99
  near_lines: 80
  all:
  - id: host-profile-exfil-source
  - id: remote-fetch-exec-source
  unless:
  - id: well-known/lib
  - id: metadata/build
  - id: well-known/app/system/quickemu
  - id: metadata/package/description/function::description-ai-coding-orchestrator
  - id: well-known/app/ai/coding-agent/0xray::archive-context
  - id: well-known/app/ai/coding-agent/0xray::mcp-knowledge-skill-marker
