defaults:
  platforms:
    - unix
    - windows
  for: [scripts, binaries]
composite_rules:
  - id: python-backdoor-file-thread-wrapper-clues
    desc: Backdoor option, open and thread wrapper clues
    crit: suspicious
    conf: 0.98
    for: [python]
    all:
      - id: metadata/lang/source/syntax/command/options::python-backdoor-file-option
      - id: micro-behaviors/fs/read/file/handle::python-backdoor-option-open-text
      - id: micro-behaviors/metaprogramming/generation/source::python-thread-line-write-text
  - id: python-backdoor-thread-compiled-wrapper-clues
    desc: Backdoor open, thread and py_compile clues
    crit: suspicious
    conf: 0.97
    for: [python]
    all:
      - id: micro-behaviors/fs/read/file/handle::python-backdoor-option-open-text
      - id: micro-behaviors/metaprogramming/generation/source::python-thread-line-write-text
      - id: micro-behaviors/metaprogramming/generation/compile::python-pycompile-output-text
    any:
      - id: micro-behaviors/process/create/shell/command-mode::python-os-system
      - id: micro-behaviors/fs/chmod/executable/mode::shell-plus-x
    needs: 1
