defaults:
  for: [java]
  platforms: [windows, unix]
  attack: T1587,T1056

traits:
  - id: java-spyware-builder-menu
    desc: Java builder identifies a spyware generator
    crit: suspicious
    conf: 0.94
    if:
      type: text
      substr: GENERATE SPYWARE

  - id: java-spyware-template-configuration
    desc: Java configures screenshot capture template
    crit: suspicious
    conf: 0.94
    if:
      type: text
      substr: 'replaceWord("booleanScreenshot"'

  - id: java-spyware-template-persistence
    desc: Java configures persistence template
    crit: notable
    conf: 0.94
    if:
      type: text
      substr: 'replaceWord("booleanPersistence"'

composite_rules:
  - id: java-spyware-template-builder
    desc: Java builds configurable surveillance payloads
    crit: hostile
    conf: 0.97
    all:
      - id: java-spyware-builder-menu
      - id: java-spyware-template-configuration
      - id: java-spyware-template-persistence
      - id: micro-behaviors/process/create/subprocess/launch::java-runtime-exec-source
