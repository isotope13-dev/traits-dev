# A broker-controlled WebSocket PTY is remote shell tasking.  The route
# markers are protocol evidence; the PTY, WebSocket, and process atoms remain
# reusable capabilities in their normal micro-behavior directories.
defaults:
  platforms: [macos]
  for: [macho]
  attack: T1071.001,T1059.004,T1105
  mbc: B0030

traits:
  - id: broker-agent-session-route
    desc: Broker agent session-token route
    crit: notable
    conf: 0.96
    if:
      type: text
      regex: '/rescue/(agent|status|report|setup/attach)\?session=%s&agent_token=%s'

  - id: broker-agent-progress-route
    desc: Broker agent progress-token route
    crit: notable
    conf: 0.96
    if:
      type: text
      exact: '%s/rescue/agent/progress?agent_token=%s'

composite_rules:
  - id: broker-agent-route-cluster
    desc: Brokered agent control and reporting routes
    crit: notable
    conf: 0.97
    all:
      - id: broker-agent-session-route
      - id: broker-agent-progress-route

  - id: websocket-broker-pty-remote-shell
    desc: Brokered WebSocket agent exposes a PTY-backed remote shell
    crit: hostile
    conf: 0.995
    all:
      - id: broker-agent-session-route
      - id: broker-agent-progress-route
      - id: micro-behaviors/communications/http/websocket::websocket-headers
      - id: micro-behaviors/process/tty/pty::go-creack-pty-path
      - id: micro-behaviors/process/create/direct::fork-exec-piped-stdio
