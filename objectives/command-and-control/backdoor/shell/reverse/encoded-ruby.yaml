defaults:
  platforms: [unix, windows]
  for: [ruby]
traits:
  - id: encoded-ruby-tcp-shell-streaming
    desc: Encoded Ruby TCP and shell streaming
    crit: suspicious
    conf: 0.97
    if:
      type: encoded
      regex: '(?s)TCPSocket[.]new.{0,160}/bin/sh.{0,240}IO[.]copy_stream'
    unless:
      - id: objectives/supply-chain/install-hook/extconf::extconf-sandbox-gated-eval-payload
      - id: objectives/supply-chain/install-hook/extconf::extconf-decoy-native-build-with-staged-payload
      - id: objectives/supply-chain/install-hook/extconf::extconf-base64-spawn-staged-payload
composite_rules:
  - id: encoded-extconf-spawn-staged-reverse-shell
    desc: Encoded reverse shell with spawn extconf
    crit: component
    conf: 0.99
    scope: file
    all:
      - id: encoded-ruby-tcp-shell-streaming
      - id: objectives/supply-chain/install-hook/extconf::extconf-base64-spawn-staged-payload
  - id: ruby-build-hook-encoded-reverse-shell
    desc: Build hook launches encoded reverse shell
    crit: hostile
    conf: 0.99
    attack: T1059.004,T1573
    scope: file
    all:
      - id: objectives/anti-static/obfuscation/encoding/base64::base64-ruby-socket-require-fragment
    any:
      - id: encoded-extconf-spawn-staged-reverse-shell
      - id: objectives/supply-chain/install-hook/extconf::extconf-sandbox-gated-eval-payload
      - id: objectives/supply-chain/install-hook/extconf::extconf-decoy-native-build-with-staged-payload
    needs: 1
