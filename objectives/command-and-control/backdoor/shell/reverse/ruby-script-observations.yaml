defaults:
  for: [ruby]
  platforms: [unix, windows]


composite_rules:
  # A TCPSocket mention plus any shell (a fixture backtick, a mock
  # class name) is a client, not a reverse shell. Require an actual
  # connect beside a shell or PTY that can take that socket's I/O.
  - id: ruby-reverse-shell
    desc: Socket connect near shell or PTY
    conf: 0.9
    crit: suspicious
    near_lines: 12
    unless:
      - id: well-known/lib/runtime/scripted/jruby/
      - id: well-known/lib/web/server/thor::actions-file-generator
      - id: well-known/tool/offensive/pwn/
    all:
      - id: micro-behaviors/communications/socket/connect::ruby-socket-connect
    any:
      - id: micro-behaviors/process/tty/pty::ruby-pty
      - id: micro-behaviors/process/fd/stdio::ruby-stdin-reopen
      - id: micro-behaviors/process/fd/stdio::ruby-interactive-shell-fd-redirection
      - id: micro-behaviors/process/create/shell/interpreter::ruby-shell-duplex-pipe
      - id: micro-behaviors/process/create/shell/lang::ruby-io-popen-interpolated
      - id: micro-behaviors/process/create/shell/lang::ruby-system-shell-interpreter
      - id: micro-behaviors/process/create/subprocess::ruby-popen
      - id: ruby-tcpsocket-spawn
      - id: ruby-tcpsocket-popen
    downgrade:
      any:
        - id: metadata/package/testing/presence/harness::ruby-test-file
