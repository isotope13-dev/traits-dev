defaults:
  for: [ruby]
  platforms: [unix, windows]


composite_rules:
  - id: ruby-reverse-shell
    desc: Ruby TCP socket with shell or PTY clues
    conf: 0.9
    crit: suspicious
    unless:
      - id: well-known/lib/runtime/scripted/jruby/
      - id: well-known/lib/web/thor::actions-file-generator
      - id: well-known/tool/offensive/pwn/
    all:
      - id: micro-behaviors/communications/socket/connect::ruby-tcp-socket
    any:
      - id: micro-behaviors/process/create/shell/
      - id: micro-behaviors/process/tty/pty::ruby-pty
    downgrade:
      any:
        - id: metadata/package/testing/presence/harness::ruby-test-file
