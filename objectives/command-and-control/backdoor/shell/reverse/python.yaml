    desc: Python CLI dispatches a reverse-shell connector
    crit: hostile
    conf: 0.98
    scope: leaf
    near_lines: 25
    all:
      - id: objectives/command-and-control/backdoor/keywords::generic-term-reverse-shell
      - id: micro-behaviors/process/argument/authentication::python-password-option
      - id: micro-behaviors/process/argument/option::python-shell-option
      - id: micro-behaviors/process/create/shell/spawn::bash-exec
      - id: micro-behaviors/process/create/shell/runner::python-run-connect-shell-call
