defaults:
  for: [source]
  platforms:
    - unix
    - windows
traits:
  - id: reverse-tcp
    desc: Reverse TCP term
    crit: component
    conf: 0.3
    if:
      type: text
      regex: (?i)reverse[-_]?(tcp)
    unless:
      - type: text
        regex: '(?i)adb[[:space:]]+reverse[[:space:]]+tcp|getAdbReverseTcpCommand'
      - id: well-known/tool/reverse-engineering/radare2::radare2-go-module-source-path
  - id: reverse-shell
    desc: Reverse shell keyword
    crit: component
    conf: 0.3
    if:
      type: text
      regex: (?i)reverse[-_]?(shell)
  - id: reverse-backdoor
    desc: Reverse backdoor reference
    crit: suspicious
    conf: 0.3
    if:
      type: text
      regex: (?i)reverse[-_]?(backdoor)
  - id: ruby-tcpsocket-spawn
    desc: Ruby TCPSocket with spawn reverse shell
    crit: suspicious
    conf: 0.9
    attack: T1059.006
    for:
      - ruby
    if:
      type: string_literal
      regex: spawn\(["']/bin/sh["'],.{0,64}TCPSocket
  - id: ruby-tcpsocket-popen
    desc: Ruby TCPSocket with popen reverse shell
    crit: suspicious
    conf: 0.9
    attack: T1059.006
    for:
      - ruby
    if:
      type: string_literal
      regex: TCPSocket.{0,64}\.gets.{0,64}IO.popen
  - id: go-child-stdin
    desc: Go exec.Cmd.childStdin
    crit: notable
    conf: 0.7
    for: [go]
    if:
      type: text
      substr: os/exec.(*Cmd).childStdin
composite_rules:
  - id: perl-socket-open
    desc: Perl socket with open reverse shell
    crit: suspicious
    conf: 0.8
    attack: T1059.006
    mbc: B0022
    for:
      - perl
    all:
      - id: micro-behaviors/communications/socket/create::socket-call
      - id: micro-behaviors/communications/socket/create::open-call
      - id: micro-behaviors/communications/socket/create::fd-redirect
      - id: micro-behaviors/process/interpreter/shell::sh-interactive
  - id: mkfifo-netcat-shell
    desc: Reverse shell via mkfifo and netcat
    crit: suspicious
    conf: 0.95
    attack: T1059.004
    mbc: B0022
    for: [shell]
    all:
      - id: micro-behaviors/fs/pipe::mkfifo-reference
      - id: micro-behaviors/process/interpreter/shell::sh-interactive
      - id: micro-behaviors/communications/socket/netcat::nc-pipe
  - id: go-reverse-shell
    desc: Go reverse shell pattern
    crit: suspicious
    conf: 0.9
    attack: T1059
    mbc: B0022
    any:
      - id: micro-behaviors/fs/path/executable::bin-shell
      - id: micro-behaviors/fs/path/application/interpreter::unix-shell-executable-path
    all:
      - id: metadata/binary/symbols/name/process::exec-cmd-run
      - id: go-child-stdin
      - id: micro-behaviors/communications/socket/dial::dial-tcp
  - id: reverse-keyword
    desc: Reverse-shell keyword fragment
    crit: component
    conf: 0.3
    any:
      - id: micro-behaviors/communications/proxy/reverse::reverse-connection-term
      - id: reverse-tcp
      - id: reverse-shell
      - id: reverse-backdoor
      - id: metadata/lang/natural/vocabulary/tunneling::reverse-tunnel-term
  - id: generic-reverse-shell
    for: [source, elf, macho]
    desc: Generic reverse shell pattern (socket and shell)
    crit: suspicious
    conf: 0.8
    attack: T1059
    all:
      - id: reverse-keyword
      - id: micro-behaviors/communications/socket/create::posix-socket-import
    any:
      - id: micro-behaviors/fs/path/executable::bin-shell
      - id: micro-behaviors/fs/path/application/interpreter::unix-shell-executable-path
