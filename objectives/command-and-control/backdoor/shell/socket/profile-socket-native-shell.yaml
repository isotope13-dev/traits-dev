defaults:
  platforms: [unix]
  for: [elf, macho]
  crit: notable
  conf: 0.82
composite_rules:
  - id: socket-and-shell-apis
    desc: Socket and shell execution API references
    all:
      - id: micro-behaviors/communications/socket/create::posix-socket-import
      - id: micro-behaviors/communications/socket/receive::recv-symbol
      - id: micro-behaviors/communications/socket/send/reference::send-symbol
      - id: micro-behaviors/process/create/subprocess/reference::system-command-api-clues
      - id: metadata/binary/symbols/name/process::exec-variant-symbol-text
      - id: micro-behaviors/fs/path/application/interpreter::bin-sh-path-reference
  - id: server-and-shell-apis
    desc: Socket server and shell execution API references
    all:
      - id: micro-behaviors/communications/socket/accept::accepting-server-api-surface
      - id: micro-behaviors/process/create/subprocess/reference::system-command-api-clues
      - id: metadata/binary/symbols/name/process::exec-variant-symbol-text
      - id: micro-behaviors/process/create/shell/command-mode::native-shell-command-invocation
  - id: daemon-server-and-shell-apis
    desc: Daemon, socket server and shell API references
    all:
      - id: micro-behaviors/communications/socket/accept::accepting-server-api-surface
      - id: micro-behaviors/process/create/subprocess/reference::system-command-api-clues
      - id: metadata/binary/symbols/name/process::exec-variant-symbol-text
      - id: micro-behaviors/process/create/shell/command-mode::native-shell-command-invocation
      - id: micro-behaviors/process/daemonize/detach::setsid-import
