defaults:
  platforms: [unix, windows]
  for: [c, cpp]
traits:
  - id: received-buffer-system-call
    desc: Socket receive buffer passed to system()
    crit: suspicious
    conf: 0.98
    attack: T1059.004
    if:
      type: tree-sitter
      language: c
      query: |
        (compound_statement
          (expression_statement
            (assignment_expression
              right: (call_expression
                function: (identifier) @receive
                arguments: (argument_list
                  (_) (identifier) @buffer))))
          (return_statement
            (call_expression
              function: (identifier) @execute
              arguments: (argument_list (identifier) @command)))
          (#match? @receive "^(recv|recvfrom)$")
          (#eq? @execute "system")
          (#eq? @buffer @command)) @dispatch
