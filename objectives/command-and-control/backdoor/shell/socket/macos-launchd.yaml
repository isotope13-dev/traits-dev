# macOS Native C2 Agent — curl + osascript + codesign resign + C2 protocol
# Detects a compiled macOS C2 agent that drops payloads to /private/tmp, re-signs
# them ad-hoc with codesign to satisfy Gatekeeper, and executes AppleScript via
# osascript. Combined with a legacy IE8 User-Agent and standard C2 JSON protocol.
# Also detects nlohmann::json embedded C++ library (toolchain fingerprint) and
# POSIX ps process enumeration, both present in the axios/NukeSped Mach-O.
# ATT&CK: T1071.001 (HTTP), T1059.002 (AppleScript), T1553.001 (Code Signing)
defaults:
  crit: hostile
  platforms:
    - macos
  for:
    - macho
  attack: T1071.001
composite_rules:
  - id: macos-bind-shell-launchd-backdoor
    desc: macOS bind shell with launchd persistence
    crit: hostile
    conf: 0.96
    attack: T1059,T1547
    mbc: B0030.003
    all:
      - id: micro-behaviors/communications/socket/bind/function::bind
      - id: micro-behaviors/communications/socket/listen::listen
      - id: micro-behaviors/communications/socket/accept::accept-sym
      - id: micro-behaviors/process/create/subprocess/reference::system-command-api-clues
      - id: objectives/persistence/system/launchd/location::launchd
    any:
      - id: micro-behaviors/process/tty/terminal::tcgetattr
      - id: metadata/binary/symbols/name/process::c-popen
      - id: objectives/discovery/system/fingerprint/network::external-recon-service
      - id: micro-behaviors/process/replace::c-exec-variants
    unless:
      - id: metadata/signature/verified/platform::apple
      - id: metadata/binary/provenance/build::terminal-editor-marker
      # A Bun single-file executable embeds the whole JS runtime, whose
      # standard library supplies bind/listen/accept, system/exec and PTY
      # handling for any embedded application. Those imports describe the
      # runtime, not the program, exactly as for the PTY profile below.
      # Match any Bun runtime context, not just the trailer: the trailer can
      # sit megabytes from EOF under the appended code signature, and some
      # layouts expose only the __bun section or the oven-sh source path.
      - id: well-known/lib/runtime/scripted/bun-runtime::bun-standalone-graph-trailer
      - id: well-known/lib/runtime/scripted/bun-runtime::unix-runtime-context
      # A Developer-ID signature never reaches platform::apple (the engine
      # emits that finding only for Apple's own platform binaries), so
      # vendor-built tools signed with a Developer ID need their product
      # identity as the benign context instead.
      - id: well-known/app/ai/coding-agent/anthropic-claude-code::native-macos-package-context
