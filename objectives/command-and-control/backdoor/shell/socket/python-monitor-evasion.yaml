defaults:
  platforms: [windows, unix]
  for: [python]
composite_rules:
  # This is deliberately a co-occurrence claim. Helper-based command dispatch
  # is not currently traced across arbitrary user-defined transformations.
  - id: python-analysis-evading-socket-shell
    desc: Analysis-tool exit gate accompanies socket input and variable shell execution
    crit: hostile
    conf: 0.97
    attack: T1059.006,T1095,T1622
    all:
      - id: objectives/anti-analysis/debugger-detect/combined-checks::python-monitor-blacklist-immediate-exit
      - id: micro-behaviors/communications/socket/receive::socket-recv-call
      - id: micro-behaviors/communications/socket/create::socket-socket-call
      - id: micro-behaviors/process/create/shell-subprocess::variable-command-shell-true
      - id: micro-behaviors/data/encoding/xor::python-xor-bytes-comprehension
