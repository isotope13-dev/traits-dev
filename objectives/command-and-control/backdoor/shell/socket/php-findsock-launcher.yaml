# Web-side half of a socket-reuse shell: the PHP page runs a helper from its
# own directory and hands it the client's address and port, so the helper can
# find that TCP connection and attach a shell to it. The interactive shell
# rides the existing HTTP socket, bypassing egress filtering.
defaults:
  platforms: [unix]
  for: [php]
  attack: T1505.003,T1059.004
  mbc: B0022
traits:
- id: php-local-helper-exec
  desc: PHP execs binary from own directory
  crit: notable
  conf: 0.85
  if:
    type: text
    regex: '(system|exec|passthru|shell_exec|popen|proc_open)\s*\(\s*["'']\./[A-Za-z0-9_.-]{1,40}'
composite_rules:
- id: php-socket-reuse-shell-launcher
  desc: PHP hands client socket to local shell helper
  crit: hostile
  conf: 0.95
  all:
  - id: micro-behaviors/process/create/shell/spawn::php-exec-client-addr-port-args
  - id: php-local-helper-exec
  unless:
  - id: "metadata/file/naming::test-directory-component"
