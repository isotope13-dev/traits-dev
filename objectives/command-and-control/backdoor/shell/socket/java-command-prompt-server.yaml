defaults:
  platforms: [windows, unix]
  for: [class]
composite_rules:
  - id: jvm-command-prompt-client-listener
    desc: Command-prompt server accepts clients for processing
    crit: suspicious
    conf: 0.97
    # The listener's role is clear; the handler may be a separate artifact.
    # Do not claim command execution or an authentication bypass from imports.
    all:
      - id: metadata/lang/source/naming/declaration::jvm-command-prompt-server-declaration
      - id: micro-behaviors/communications/socket/accept::java-socket-accept-bytecode
      - id: metadata/import/jvm::client-processor-class-reference
