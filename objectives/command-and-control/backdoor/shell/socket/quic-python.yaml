defaults:
  platforms: [unix, windows]
  for: [python]

composite_rules:
  - id: python-quic-reverse-command-shell
    desc: Python QUIC client executes received shell commands
    crit: hostile
    conf: 0.995
    scope: file
    attack: T1059.006,T1095
    mbc: B0022
    all:
      - id: micro-behaviors/communications/socket/quic::aioquic-client-connect
      - id: micro-behaviors/communications/socket/quic::aioquic-stream-data-event-import
      - id: micro-behaviors/communications/socket/quic::quic-send-stream-data-call
      - id: objectives/command-and-control/backdoor/control/command-vocab::file-control-command-set
      - id: micro-behaviors/process/create/subprocess::shell-true
      - id: micro-behaviors/process/create/subprocess::process-execution
