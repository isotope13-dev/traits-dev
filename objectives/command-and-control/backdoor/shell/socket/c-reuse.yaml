defaults:
  platforms: [unix]
  attack: T1059.004
composite_rules:
- id: socket-reuse-fd-shell-source
  desc: C reuses a live socket for shell stdio
  for:
  - c
  - cpp
  crit: hostile
  conf: 0.97
  mbc: B0022
  near_lines: 50
  all:
  - id: micro-behaviors/communications/socket/state-connect::getpeername-call
  - id: micro-behaviors/process/fd/dup::source-dup2-stdio-fd
  - id: micro-behaviors/process/create/shell/interactive::c-exec-interactive-shell
  unless:
  - id: "metadata/file/naming::test-directory-component"
  - id: metadata/package/testing/presence/harness::c-source-test-directory
