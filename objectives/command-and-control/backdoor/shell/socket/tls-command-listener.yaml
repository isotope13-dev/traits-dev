# TLS-protected command listeners used as appliance implants. The matchers are
# technique-based so equivalent implementations using OpenSSL, Mbed TLS, or a
# script-level TLS server remain visible.
defaults:
  platforms: [unix, windows, appliance]
  for: [scripts, binaries, source]
  attack: "T1573.002,T1059.004"
  mbc: B0022

traits:
  - id: tls-ssl-command-dispatch
    desc: OpenSSL read near a command execution reference
    crit: suspicious
    conf: 0.95
    for: [shell, python, javascript, elf, macho, pe]
    if:
      type: text
      regex: '(?is)\bSSL_read\b.{0,500}(\b(popen|system|exec[a-z]{0,3})\s*\(|/bin/sh\b)'
    unless:
      - id: well-known/tool/detection/malcontent::malcontent-defensive-scanner-context
      - id: metadata/package/testing/
      - id: "metadata/file/naming::test-directory-component"
  - id: tls-mbedtls-command-dispatch
    desc: Mbed TLS input is dispatched to commands
    crit: suspicious
    conf: 0.95
    for: [shell, python, javascript, c, cpp, elf, macho, pe]
    if:
      type: text
      regex: '(?is)\bmbedtls_ssl_read\b.{0,500}(\b(popen|system|exec[a-z]{0,3})\s*\(|/bin/sh\b)'
    unless:
      - id: metadata/package/testing/
      - id: "metadata/file/naming::test-directory-component"
  - id: tls-script-command-dispatch
    desc: Script TLS input is dispatched to commands
    crit: suspicious
    conf: 0.95
    for: [shell, python, javascript, c, cpp, elf, macho, pe]
    if:
      type: text
      regex: '(?is)tls\.(read|recv).{0,500}(subprocess|child_process)'
composite_rules:
  - id: tls-command-dispatch
    desc: TLS input is dispatched to command execution
    crit: suspicious
    conf: 0.96
    any:
      - id: tls-ssl-command-dispatch
      - id: objectives/command-and-control/remote-command/dispatch::openssl-buffer-shell-dispatch
      - id: tls-mbedtls-command-dispatch
      - id: tls-script-command-dispatch

  - id: tls-command-listener
    for: [elf, macho, pe, c]
    desc: TLS listener executes remote commands
    crit: hostile
    conf: 0.99
    near_lines: 220
    all:
      - id: tls-command-dispatch
      - id: micro-behaviors/communications/socket/ssl::tls-server-certificate-key-pair
      - id: micro-behaviors/communications/socket/ssl::tls-server-handshake
    any:
      - id: micro-behaviors/communications/socket/accept::accepting-server-api-surface
      - id: micro-behaviors/communications/socket/listen::server-socket-source
      - id: micro-behaviors/communications/socket/listen::node-tls-create-server

  - id: tls-command-listener-socket
    desc: TLS command listener uses a socket server API
    crit: hostile
    conf: 0.98
    near_bytes: 4096
    all:
      - id: tls-command-dispatch
      - id: micro-behaviors/communications/socket/ssl::tls-server-certificate-key-pair
    any:
      - id: micro-behaviors/communications/socket/listen
      - id: micro-behaviors/communications/socket/accept::accept-sym
      - id: micro-behaviors/communications/socket/accept::accept64-sym
      - id: micro-behaviors/communications/socket/accept::accept-func
      - id: micro-behaviors/communications/socket/accept::accepting-server-api-surface
      - id: micro-behaviors/communications/socket/accept::accept-call-source

  - id: tls-command-listener-device-report
    for: [elf, macho, pe, c]
    desc: TLS command listener reports device identity
    crit: hostile
    conf: 0.99
    all:
      - id: tls-command-listener
      - id: micro-behaviors/communications/http/telemetry::device-identity-report-parameter-set

  - id: detached-python-socket-shell
    for: [python]
    desc: Detached Python socket command shell
    crit: hostile
    conf: 0.995
    attack: T1059.004
    near_bytes: 1200
    all:
      - id: micro-behaviors/process/create/shell/command-mode::socket-receive-shell-cooccurrence
      - id: micro-behaviors/communications/socket/dial::python-dial
      - id: micro-behaviors/process/create/shell-subprocess::shell-true
      - id: micro-behaviors/process/daemonize/detach::python-fork-new-session
