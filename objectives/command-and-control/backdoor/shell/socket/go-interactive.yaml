defaults:
  platforms: [linux, windows, macos]
  for: [elf, macho, pe]
composite_rules:
  - id: go-interactive-backdoor-shell
    desc: Go interactive backdoor shell capability
    crit: hostile
    conf: 0.98
    attack: T1059.004
    all:
      - id: micro-behaviors/ui/terminal::execshell-label
      - id: metadata/binary/symbols/name/process::go-os-exec-package-reference
      - id: micro-behaviors/communications/ipc/pipe::io-pipe
    unless:
      - id: well-known/tool/detection/malcontent::malcontent-defensive-scanner-context
