defaults:
  platforms: [unix, windows]
  for: [python]
  attack: T1059.006,T1071.001
traits:
  - id: received-command-popen-shell
    desc: Received command passed to Popen shell
    crit: suspicious
    conf: 0.98
    if:
      type: tree-sitter
      query: |
        (block
          (expression_statement
            (assignment left: (identifier) @command
              right: (call function: (attribute
                object: (identifier) @socket
                attribute: (identifier) @receive))))
          (expression_statement
            (assignment right: (call function: (attribute
              object: (identifier) @module
              attribute: (identifier) @execute)
              arguments: (argument_list
                (identifier) @argument
                (keyword_argument name: (identifier) @flag value: (true))))))
          (#eq? @command @argument)
          (#eq? @receive "recv")
          (#eq? @module "subprocess")
          (#eq? @execute "Popen")
          (#eq? @flag "shell")) @dispatch
composite_rules:
  - id: python-websocket-shell-client
    desc: WebSocket command client executes shell
    crit: hostile
    conf: 0.98
    near_bytes: 1200
    all:
      - id: received-command-popen-shell
      - id: micro-behaviors/communications/websocket/library::python-websocket-client
      - id: micro-behaviors/communications/websocket/receive::python-websocket-receive-method
      - id: micro-behaviors/process/create/shell-subprocess::popen-shell-true
      - id: micro-behaviors/communications/websocket/send::python-websocket-send-method
