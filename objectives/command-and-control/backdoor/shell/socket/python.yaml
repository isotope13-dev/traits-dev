defaults:
  platforms:
  - windows
  - unix
  for:
  - scripts
  - binaries
  crit: hostile
composite_rules:
- id: python-env-triggered-reverse-shell
  desc: Python env-triggered reverse shell
  conf: 0.96
  attack: T1059.006
  mbc: B0022
  for:
  - python
  near_lines: 50
  all:
  - id: micro-behaviors/communications/socket/connect::python-tuple-address-connect-call
  - id: micro-behaviors/communications/socket/receive::socket-recv-call
  - id: micro-behaviors/process/create/subprocess::process-execution
  - id: micro-behaviors/os/env/config::python-named-secret-env-lookup
  any:
  - id: micro-behaviors/communications/socket/send::python-send-output-named-variable
  - id: micro-behaviors/os/env/read::os-environ-symbol
- id: python-reverse-shell-command-loop
  desc: Python socket command loop reverse shell
  conf: 0.98
  attack: T1059.006
  mbc: B0030.002
  for:
  - python
  near_lines: 45
  all:
  - id: micro-behaviors/communications/socket/connect::python-tuple-address-connect-call
  - id: micro-behaviors/communications/socket/receive::socket-recv-call
  - id: micro-behaviors/process/create/shell/command-string::python-subprocess-shell-true
  - id: micro-behaviors/communications/socket/send::python-send-output-named-variable
  unless:
  - id: metadata/package/testing/presence/harness/
  - id: well-known/tool/detection/llm-scanner/
  - id: metadata/path::test-directory-component
- id: python-received-shell-command
  desc: Python socket input reaches a subprocess alongside shell parsing
  crit: suspicious
  conf: 0.98
  attack: T1059.006,T1095
  for: [python]
  near_lines: 45
  all:
  - id: micro-behaviors/communications/socket/connect::socket-create-connection-call
  - id: micro-behaviors/process/create/subprocess::recv-input-argument
  - id: micro-behaviors/process/create/shell/command-string::python-subprocess-shell-true
- id: python-received-shell-command-session
  desc: Python socket input reaches shell execution with output sent back
  conf: 0.98
  attack: T1059.006,T1095
  for: [python]
  near_lines: 45
  all:
  - id: python-received-shell-command
  - id: micro-behaviors/communications/socket/send::python-send-output-named-variable
- id: python-reverse-shell-command-loop-pyc
  desc: Python bytecode socket command loop reverse shell
  conf: 0.96
  attack: T1059.006
  mbc: B0030.002
  for:
  - pyc
  near_bytes: 512
  all:
  - id: micro-behaviors/communications/socket/connect::socket-connect-pyc-name
  - id: micro-behaviors/communications/socket/receive::socket-recv-pyc-name
  - id: micro-behaviors/process/create/shell-subprocess::subprocess-shell-pyc
  - id: micro-behaviors/communications/socket/send::python-sendall-pyc-name
- id: python-socket-shell-command-channel
  desc: Python TCP socket routes received data to shell execution
  conf: 0.995
  for:
  - python
  scope: leaf
  near_lines: 80
  attack: T1059.006,T1095
  all:
  - id: micro-behaviors/communications/socket/connect::socket-connect-method
  - id: micro-behaviors/communications/socket/receive::socket-data-transfer
  - id: micro-behaviors/process/create/shell/command-string::python-subprocess-shell-true
  - id: micro-behaviors/process/create/subprocess::process-execution
  - id: micro-behaviors/data/parse/json::json-loads-call
- id: python-socket-agent-command-file-control
  desc: Python socket agent exposes shell and file control
  conf: 0.99
  scope: archive
  for:
  - python
  - whl
  all:
  - id: python-socket-shell-command-channel
  - id: micro-behaviors/communications/socket/bind/address::bind-all-interfaces
  - id: micro-behaviors/communications/socket/accept::socket-accept-call
  - id: metadata/lang/source/naming/action/function-name::python-upload-file-call
  - id: metadata/lang/source/syntax/call/invocation::python-download-file-call
- id: python-tcp-pipes-command-shell
  desc: TCP socket pipes a command shell
  conf: 0.98
  for:
  - python
  attack: T1059.003,T1095
  near_lines: 45
  all:
  - id: micro-behaviors/communications/socket/connect::socket-create-connection-call
  - id: micro-behaviors/process/create/subprocess::popen-ast
  - id: micro-behaviors/fs/path/application/interpreter::cmd-exe-image-name
  - id: micro-behaviors/process/thread/create::python-daemon-thread
