defaults:
  platforms: [linux]
  for: [scripts, source]
composite_rules:
  - id: stun-concealed-command-channel
    desc: STUN shell channel with procfs concealment
    crit: hostile
    conf: 0.98
    attack: T1090,T1059.004,T1564
    scope: leaf
    near_lines: 40
    all:
      - id: objectives/evasion/process/hidden/procfs::init-metadata-process-overlay
      - id: socket-shell-dispatch-evidence

    any:
      - id: micro-behaviors/communications/proxy/turn::binding-request-header-pack
      - id: micro-behaviors/communications/proxy/turn::binding-request-byte-array

  - id: procfs-concealed-command-channel
    desc: Socket shell dispatch combined with init-metadata procfs concealment
    crit: hostile
    conf: 0.98
    attack: T1059.004,T1564
    scope: leaf
    near_lines: 40
    all:
      - id: objectives/evasion/process/hidden/procfs::init-metadata-process-overlay
      - id: socket-shell-dispatch-evidence

  - id: socket-shell-dispatch-evidence
    desc: Socket input precedes or supplies shell command execution
    crit: suspicious
    conf: 0.96
    platforms: [unix, windows]
    any:
      - id: socket-command-dispatch
      - id: received-buffer-system-call
