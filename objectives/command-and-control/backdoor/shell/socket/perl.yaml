defaults:
  platforms: [unix, fortios]
  for: [perl]
  attack: T1059

traits:
  - id: perl-backdoor-command-dispatch
    desc: Perl backdoor command dispatch
    crit: suspicious
    conf: 0.94
    if:
      type: text
      regex: '\$cmd =~ /\^exec\\s\+\(\.\+\)\$/i[\s\S]{0,260}`\$1 2>&1`'
  - id: perl-udp-bound-socket
    desc: Binds a UDP socket locally
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: 'IO::Socket::INET->new\([^)\n]{0,160}LocalPort[^)\n]{0,80}udp'
  - id: perl-system-interpolated
    desc: Runs an interpolated system command
    crit: suspicious
    conf: 0.92
    if:
      type: text
      regex: '(^|[;=])\s*system\s*\(\s*["'']\$[A-Za-z_]\w*["'']\s*\)'

composite_rules:
  - id: perl-socket-command-backdoor
    desc: Perl socket command backdoor
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/communications/socket/listen::perl-iosocket-listener
      - id: perl-backdoor-command-dispatch
  - id: perl-udp-interpolated-command
    desc: Perl UDP socket runs a command
    crit: hostile
    conf: 0.96
    near_lines: 40
    all:
      - id: perl-udp-bound-socket
      - id: perl-system-interpolated
    unless:
      - id: metadata/package/testing/presence/harness::perl-test-file
