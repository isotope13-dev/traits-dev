# Stripped statically linked IoT binaries that claim a loopback socket as their
# single-instance lock, reference /bin/sh and fork are the shape of a resident
# bot. The loopback guard is the specific leg: it is rare in static utilities,
# which do not need to stop a second copy of themselves.
defaults:
  platforms: [linux]
  for: [elf]
  attack: T1059.004,T1480
composite_rules:
  - id: static-iot-socket-guard-shell-bot
    desc: Stripped static ELF with loopback guard, fork and /bin/sh
    crit: hostile
    conf: 0.9
    size_max: 400000
    all:
      - id: micro-behaviors/process/lifecycle/single-instance::localhost-socket-single-instance
      - id: metadata/binary/linking/records::elf-linker-metadata-and-full-symbol-table-absent
      - id: micro-behaviors/fs/path/application/interpreter::bin-sh-path-reference
    any:
      - id: micro-behaviors/process/create/fork::fork-syscall
      - id: micro-behaviors/process/create/fork::m68k-fork-syscall
