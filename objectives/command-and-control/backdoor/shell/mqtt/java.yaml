# JVM MQTT callbacks that hand broker-delivered payloads to a local shell.
# The library callback, a shell-form process launch, and publishing the
# result back to the broker distinguish a tasked implant (the XCPE pattern:
# subscribe to a per-device topic, run `sh -c` tasking, publish output) from
# telemetry and home-automation clients, which act on fixed local state.
# Broker host, topic names, and application identifiers are not matched.
defaults:
  platforms: [android, windows, unix]
  for: [java, kotlin]
  attack: "T1059.004,T1071.001"
  mbc: B0022

composite_rules:
  - id: java-mqtt-remote-shell-backdoor
    desc: MQTT callback runs broker-delivered shell code
    crit: hostile
    conf: 0.98
    scope: file
    all:
      - id: micro-behaviors/communications/messaging/mqtt::java-mqtt-subscriber
      - id: micro-behaviors/communications/messaging/mqtt::java-mqtt-message-callback
      - id: micro-behaviors/process/create/subprocess/launch::java-runtime-exec-source
    any:
      - id: micro-behaviors/process/deploy/interpreter-command::jvm-sh-c-argument-pass
      - id: micro-behaviors/process/create/subprocess/launch::runtime-exec-with-shell-array
      - id: micro-behaviors/communications/messaging/mqtt::java-mqtt-publisher
