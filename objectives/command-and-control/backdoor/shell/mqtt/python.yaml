# MQTT callbacks that route broker-delivered payloads into a local command
# shell. The transport identity, inbound payload access, variable command, and
# shell-enabled process call distinguish tasking implants from ordinary MQTT
# telemetry producers and automation clients with fixed local commands.
defaults:
  platforms: [windows, unix]
  for: [python]
  attack: "T1059.006,T1071"
  mbc: B0022

traits:
  - id: python-mqtt-message-payload-dispatch
    desc: MQTT callback decodes broker payload
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: '(?s)def\s+on_message\s*\(.{0,200}\).{0,500}\bmessage\.payload(\.decode\s*\(\))?'

composite_rules:
  - id: python-mqtt-remote-shell-backdoor
    desc: MQTT callback executes broker-delivered commands
    crit: hostile
    conf: 0.98
    scope: file
    all:
      - id: micro-behaviors/communications/messaging/mqtt::paho-mqtt-subscriber
      - id: python-mqtt-message-payload-dispatch
      - id: micro-behaviors/process/create/subprocess::variable-command-argument
      - id: micro-behaviors/process/create/shell-subprocess::shell-true
    unless:
      - id: metadata/package/testing/presence/harness::verified-python-test-file
