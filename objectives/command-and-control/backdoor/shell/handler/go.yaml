# A Go listener that accepts a connection, negotiates a remote PTY shell, and
# bridges the operator terminal is a reverse-shell handler pattern.  It is
# suspicious in an unattributed source tree; a recognized offensive tool gets
# an explicit context exception rather than weakening the generic matcher.
defaults:
  platforms: [unix, windows]
  for: [go]
  attack: T1059
  mbc: B0022

composite_rules:
  - id: go-reverse-shell-handler
    desc: Go listener relays a remote PTY shell
    crit: suspicious
    conf: 0.96
    scope: outer
    all:
      - id: micro-behaviors/communications/socket/listen::listen-go
      - id: micro-behaviors/communications/socket/listen::accept-go
      - id: micro-behaviors/process/tty/pty::go-pty-spawn-command
      - id: micro-behaviors/process/io/stream::go-terminal-network-bridge
    unless:
      - id: well-known/tool/offensive/gato::gato-tool-context
