# A shell loop that POSTs an identifier to a hard-coded IP, evals the reply
# as a command, base64-encodes the output and posts it back before sleeping.
# That is a complete command channel written in a dozen lines of sh.
defaults:
  platforms: [unix]
  for: [shell]
  attack: T1059.004,T1071.001,T1132.001
composite_rules:
  - id: shell-http-poll-eval-base64-reply
    desc: Shell polls a raw IP, evals the reply, posts base64 output
    crit: hostile
    conf: 0.93
    all:
      - id: micro-behaviors/communications/http/download/wget::wget-output-stdout
      - id: micro-behaviors/communications/ip/literal::external-ipv4-shell-endpoint
      - id: micro-behaviors/process/interpreter/eval/direct::shell-eval-variable
      - id: micro-behaviors/data/encode/base64::base64-encode-command
      - id: micro-behaviors/time/sleep/trailing::trailing-sleep
    unless:
      - id: metadata/package/testing/
      - id: metadata/file/naming::test-directory-component
