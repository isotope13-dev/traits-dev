# A Telegram bot that runs whatever a chat message tells it to. Sibling to
# node.yaml, which describes the same backdoor in JavaScript.
#
# The bot framework supplies the transport and the authentication: the operator
# sends a slash command from any Telegram client, the handler runs it, and the
# output comes back in the same chat. There is no listening port to find, the
# traffic is TLS to a legitimate API host, and egress filtering that permits
# Telegram permits the channel.
#
# What separates this from an ordinary bot is the handler body: passing the
# message text to a shell and returning stdout is a remote shell, whatever the
# command is named. A weather bot formats an API response; it does not hand the
# message to `Popen(..., shell=True)`.
#
# Worked example: an `lxml` typosquat shipping a Telegram mirror bot whose
# `/shell` handler runs `Popen(cmd, stdout=PIPE, stderr=PIPE, shell=True)` on
# the message text and replies with both streams, alongside an `/eval` handler
# that execs Python in a persistent namespace.
defaults:
  platforms: [unix, windows]
  for: [python]
  attack: "T1059,T1102.002,T1071.001"
  mbc: "B0022"

composite_rules:
  - id: python-telegram-remote-shell-backdoor
    desc: Telegram command handler runs a shell
    crit: hostile
    conf: 0.96
    all:
      - id: micro-behaviors/communications/http/services/telegram::python-telegram-command-handler-import
      - id: micro-behaviors/process/create/subprocess::popen-shell-true
    unless:
      - id: metadata/package/testing/presence/harness::verified-python-test-file
