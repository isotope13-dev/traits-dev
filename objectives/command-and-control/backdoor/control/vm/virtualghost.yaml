# VirtualGHOST-style rogue VMware guests.
# The technique starts a VM from the ESXi host's datastore with the VMX
# executable rather than through vCenter inventory, and can persist the launch
# in the host's local startup script. The rules deliberately match the launch
# mechanics, not the name of a malware family or one operator's VM filename.
defaults:
  platforms: [unix, windows]
  for: [scripts, binaries]
  attack: T1547

composite_rules:
  - id: vmware-ghost-vm-direct-launch
    desc: Direct VMware VMX launch from a datastore outside inventory
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/os/virtualization/hypervisor::vmware-vmx-background-suppression
      - id: micro-behaviors/os/sysinfo/vmware::vmfs-path
    near_bytes: 4096

  - id: vmware-ghost-vm-startup-persistence
    desc: Direct VMware VMX launch persisted through ESXi local startup
    crit: hostile
    conf: 0.99
    all:
      - id: vmware-ghost-vm-direct-launch
      - id: micro-behaviors/os/virtualization/hypervisor::vmware-esxi-local-startup-script
    near_bytes: 4096
