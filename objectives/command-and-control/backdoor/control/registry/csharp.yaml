defaults:
  for: [csharp]
  platforms: [windows]
  attack: T1112

traits:
  - id: remote-registry-value-model
    desc: Remote registry value model
    crit: notable
    conf: 0.9
    if:
      type: text
      substr: RegistrySeeker.RegValueData
  - id: registry-edit-wire-command
    desc: Registry edit wire command
    crit: component
    conf: 0.9
    if:
      type: literal
      regex: '^R[GED]$'
  - id: registry-value-data-write-field
    desc: Registry value data assignment
    crit: notable
    conf: 0.88
    if:
      type: text
      substr: "_value.Data"
  - id: registry-hex-editor-data-field
    desc: Registry hex editor data field
    crit: notable
    conf: 0.86
    if:
      type: text
      substr: "hexEditor.HexTable"
  - id: registry-value-text-data-field
    desc: Registry text data field
    crit: notable
    conf: 0.86
    if:
      type: text
      substr: "valueDataTxtBox.Text"
  - id: encoded-registry-message-send
    desc: Encoded registry message send
    crit: notable
    conf: 0.9
    if:
      type: symbol
      kind: call
      exact: Module0.smethod_6
  - id: registry-client-send-call
    desc: Registry client send call
    crit: notable
    conf: 0.9
    if:
      type: symbol
      kind: call
      regex: '(^|\.)method_1$'

composite_rules:
  - id: registry-value-kind-ui
    desc: Enumerates multiple .NET RegistryValueKind types
    crit: notable
    conf: 0.9
    needs: 3
    any:
      - id: micro-behaviors/os/registry/value-type::registry-binary-kind-source
      - id: micro-behaviors/os/registry/value-type::dotnet-registry-value-kind-dword
      - id: micro-behaviors/os/registry/value-type::dotnet-registry-value-kind-expand-string
      - id: micro-behaviors/os/registry/value-type::dotnet-registry-value-kind-multi-string
      - id: micro-behaviors/os/registry/value-type::dotnet-registry-value-kind-qword
      - id: micro-behaviors/os/registry/value-type::dotnet-registry-value-kind-string
  - id: dotnet-remote-registry-editor-command
    desc: .NET remote registry editor command
    crit: suspicious
    conf: 0.95
    all:
      - id: registry-value-kind-ui
      - id: encoded-registry-message-send
      - id: registry-client-send-call
    any:
      - id: registry-edit-wire-command
  - id: dotnet-remote-registry-value-editor
    desc: .NET remote registry value editor
    crit: suspicious
    conf: 0.93
    all:
      - id: remote-registry-value-model
      - id: metadata/lang/source/syntax/member::csharp-dialog-result-ok-reference
    any:
      - id: registry-value-data-write-field
      - id: registry-hex-editor-data-field
      - id: registry-value-text-data-field
