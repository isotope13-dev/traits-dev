# Public-IP bind/connect code paired with an interpreter execution API is a
# remote-agent shape.  Each leg is behavior-based; ordinary HTTP or local
# socket servers do not satisfy the public-IP channel prerequisite.
defaults:
  platforms: [windows, unix]
  for: [python, whl]
  attack: T1059.006,T1090,T1105
  mbc: B0030

composite_rules:
  - id: python-public-ip-interpreter-agent
    desc: Public-IP socket channel with inline interpreter and process control
    crit: hostile
    conf: 0.98
    scope: archive
    all:
      - id: objectives/command-and-control/channel/bind::python-bind-public-ip-channel
      - id: micro-behaviors/process/create/subprocess::python-interpreter-variable-code-argument
      - id: micro-behaviors/process/control/signal::python-os-kill-call
