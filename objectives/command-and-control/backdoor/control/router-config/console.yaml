defaults:
  platforms: [unix, windows, android]
  for: [perl, python, ruby, c, go]
  crit: notable
  conf: 0.95

traits:
  - id: router-scfg-console-command
    desc: Router console request supplies shell command
    if:
      type: text
      regex: '\w+\s*\(\s*SCFG_CONSOLE\s*,\s*(["'']exec\s+2>&1\b|\$?(cmd|command)\b)'

  - id: router-scfg-read-all-config
    desc: Router protocol names full configuration read
    if:
      type: text
      word: SCFG_GETALL

  - id: router-scfg-receive-file
    desc: Router protocol names file receipt
    if:
      type: text
      word: SCFG_RECEIVE

composite_rules:
  - id: router-config-protocol-remote-console
    desc: Router configuration protocol client invokes remote shell console
    crit: hostile
    conf: 0.98
    all:
      - id: router-scfg-console-command
      - id: router-scfg-read-all-config
      - id: router-scfg-receive-file
