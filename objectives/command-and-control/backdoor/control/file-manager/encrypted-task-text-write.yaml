defaults:
  platforms: [windows]
  for: [pe, dll]

composite_rules:
  # Reviewed dispatch takes the destination and content from task fields and
  # calls File.WriteAllText. These matchers establish co-occurrence with the
  # independently validated shell-task handler, not intermethod data flow.
  # No family name, command spelling, destination or endpoint is required.
  - id: encrypted-shell-task-backdoor-text-file-write
    desc: Shell-task backdoor with text-write references
    crit: hostile
    conf: 0.96
    all:
      - id: objectives/command-and-control/remote-command/shell::cil-encrypted-task-shell-dispatch
      - id: micro-behaviors/fs/write/file/full::dotnet-writealltext-token
