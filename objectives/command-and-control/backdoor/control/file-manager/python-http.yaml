defaults:
  platforms: [unix, windows]
  for: [python]
  attack: T1219
  mbc: B0022

composite_rules:
  - id: python-http-remote-file-manager-control
    desc: Python HTTP remote file manager control
    crit: hostile
    conf: 0.98
    ref: sha256:a978ee4e489697d548b6eb4922c592307a9a38c7ad778bb0c8598fb3739c56db
    all:
      - id: micro-behaviors/communications/http/auth::python-authenticated-session-client
      - id: micro-behaviors/communications/http/url/endpoint::rest-file-manager-endpoint-matrix
      - id: micro-behaviors/fs/file/read-write::python-remote-file-manager-functions
    any:
      - id: metadata/lang/source/naming/function::python-user-management-function-set
      - id: micro-behaviors/communications/http/url/endpoint::rest-admin-config-user-endpoints
    needs: 1

  - id: python-http-polled-file-manager-shell-agent
    desc: HTTP polling agent combines file management with shell commands
    crit: hostile
    conf: 0.99
    attack: T1219,T1059.006,T1071.001,T1005,T1105
    scope: file
    all:
      - id: micro-behaviors/communications/http/request/tasking::python-poll-shell-handler-result-profile
      - id: micro-behaviors/data/encode/base64::python-file-read-base64-result
      - id: micro-behaviors/fs/delete/directory::shutil-rmtree
    unless:
      - id: well-known/tool/offensive/
