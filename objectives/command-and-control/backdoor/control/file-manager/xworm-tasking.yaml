defaults:
  platforms: [windows]
  for: [pe, dll]
  attack: T1219
  mbc: B0022

traits:
  - id: xworm-file-manager-record-separator
    desc: XWorm remote file-manager record separator
    crit: suspicious
    conf: 0.98
    if:
      type: text
      exact: FileManagerSplitFileManagerSplit
      section: .text

  - id: xworm-file-manager-text-edit-task
    desc: XWorm remote text-file edit task token
    crit: suspicious
    conf: 0.95
    if:
      type: text
      exact: txtttt
      section: .text

composite_rules:
  - id: xworm-lineage-remote-file-manager-tasking
    desc: XWorm remote file-manager task with file ops
    crit: hostile
    conf: 0.98
    all:
      - id: xworm-file-manager-record-separator
      - id: xworm-file-manager-text-edit-task
      - id: micro-behaviors/fs/enumerate/drives::get-drives-dotnet
      - id: micro-behaviors/fs/read/file/full::dotnet-read-all-text
      - id: micro-behaviors/fs/write/file/full::dotnet-writeallbytes-token
