defaults:
  platforms: [windows]
  for: [pe, dll]
  attack: T1219
composite_rules:
  # Task labels can be renamed without removing the remote file capability.
  - id: managed-shell-file-management-profile
    desc: Shell implant has drive and file-management APIs
    crit: hostile
    conf: 0.98
    all:
      - id: objectives/command-and-control/backdoor/dispatch/shell/interactive::managed-tasked-redirected-shell
      - id: micro-behaviors/fs/enumerate/drives::get-drives-dotnet
      - id: micro-behaviors/fs/read/file/content/characters::dotnet-read-all-text
      - id: micro-behaviors/fs/write/file/full/bytes::dotnet-writeallbytes-token
