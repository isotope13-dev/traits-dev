defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]

composite_rules:
  - id: node-express-file-manager-shell
    desc: Express file manager exposes shell execution
    crit: hostile
    conf: 0.98
    attack: T1059,T1505.003
    scope: file
    all:
      - id: micro-behaviors/communications/http/server/framework::server-express
      - id: micro-behaviors/data/control-flow/dispatch/named::javascript-exec-call
      - id: micro-behaviors/data/property/access::mapping-command-key-access
    any:
      - id: micro-behaviors/communications/http/request/dynamic::node-computed-get-call
      - id: micro-behaviors/fs/directory/readdir/language::node-readdir-sync-call
      - id: micro-behaviors/fs/write/file/unspecified::node-write-file-sync-call
      - id: objectives/collection/archive/create::archiver-require
    needs: 2
