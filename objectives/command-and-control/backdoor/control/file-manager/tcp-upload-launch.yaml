defaults:
  for: [ne]
  platforms: [windows]
  attack: T1219,T1059

traits:
  - id: tcp-upload-launch-server
    desc: TCP server uploads and launches programs
    crit: hostile
    conf: 0.98
    if:
      type: yara
      source: |
        rule legacy_tcp_upload_launch_server {
          strings:
            $winsock = "WSAStartup" ascii nocase
            $listen = "listen" ascii
            $accept = "accept" ascii
            $upload = "file uploaded." ascii nocase
            $launch = "program launched" ascii nocase
            $registry = "Software\\Microsoft\\Windows\\CurrentVersion" ascii nocase
          condition:
            uint16(0) == 0x5a4d and all of them
        }
