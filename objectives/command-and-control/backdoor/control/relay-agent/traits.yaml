# Node relay agent that exposes remote desktop input, a file manager, and a
# shell as named handlers. Each name is a capability; together they are a
# backdoor. Legitimate VNC or file tools do not ship this whole handler set.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  attack: T1219
  crit: notable
  conf: 0.95

traits:
  - id: vnc-keyboard-handler
    desc: Names a VNC keyboard input handler
    if:
      type: text
      word: vncKeyboard

  - id: vnc-mouse-handler
    desc: Names a VNC mouse input handler
    if:
      type: text
      word: vncMouse

  - id: remote-file-download-handler
    desc: Names a remote file download handler
    if:
      type: text
      word: handleFileDownload

  - id: remote-file-delete-handler
    desc: Names a remote file delete handler
    if:
      type: text
      word: handleFileDelete

  - id: remote-terminal-start
    desc: Names a remote terminal start handler
    if:
      type: text
      word: startTerminal

  - id: remote-process-kill-handler
    desc: Names a remote process kill handler
    if:
      type: text
      word: handleProcKill

composite_rules:
  - id: node-vnc-file-shell-agent
    desc: Node agent offers VNC, files, and a shell
    crit: hostile
    conf: 0.98
    attack: T1219,T1059.007,T1105
    all:
      - id: vnc-keyboard-handler
      - id: vnc-mouse-handler
      - id: remote-file-download-handler
    any:
      - id: remote-terminal-start
      - id: metadata/lang/source/naming/interface::execute-command-name
    needs: 1
    unless:
      - id: metadata/path::test-directory-component
