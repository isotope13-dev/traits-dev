defaults:
  platforms: [windows]
  for: [batch]
  attack: T1219
  mbc: B0022

traits:
  - id: batch-enable-rdp-registry
    desc: Batch enables RDP registry
    crit: suspicious
    conf: 0.94
    if:
      type: text
      regex: '(?i)reg\s+add.{0,120}Terminal Server.{0,80}fDenyTSConnections.{0,80}/d\s+0\b'

  - id: batch-netsh-remotedesktop-enable
    desc: Batch enables RDP firewall service
    crit: suspicious
    conf: 0.92
    if:
      type: text
      regex: '(?i)netsh\s+firewall\s+set\s+service.{0,80}remotedesktop.{0,80}mode\s*=\s*enable'

  - id: batch-netsh-open-rdp-port
    desc: Batch opens RDP port
    crit: suspicious
    conf: 0.92
    if:
      type: text
      regex: '(?i)netsh\s+firewall\s+add\s+portopening.{0,80}\b3389\b'

  - id: batch-advfirewall-add-rule
    desc: Batch advfirewall add rule command
    crit: component
    conf: 0.9
    if:
      type: text
      regex: '(?i)netsh\s+advfirewall\s+firewall\s+add\s+rule\b'

  - id: batch-firewall-localport-3389
    desc: Firewall rule sets localport 3389
    crit: component
    conf: 0.9
    if:
      type: text
      regex: '(?i)localport\s*=\s*3389'

  - id: batch-firewall-action-allow
    desc: Firewall rule sets action allow
    crit: component
    conf: 0.88
    if:
      type: text
      regex: '(?i)action\s*=\s*allow'

  - id: batch-advfirewall-set-rule
    desc: Batch advfirewall set rule command
    crit: component
    conf: 0.9
    if:
      type: text
      regex: '(?i)netsh\s+advfirewall\s+firewall\s+set\s+rule\b'

  - id: batch-wmi-firewall-group-name
    desc: Windows Management Instrumentation rule group
    crit: component
    conf: 0.92
    if:
      type: text
      substr: windows management instrumentation
      case_insensitive: true

  - id: batch-firewall-enable-yes
    desc: Firewall rule enable equals yes
    crit: component
    conf: 0.88
    if:
      type: text
      regex: '(?i)enable\s*=\s*yes'

  - id: ngrok-authtoken-command
    desc: Ngrok auth token command
    crit: suspicious
    conf: 0.92
    if:
      type: text
      regex: '(?i)\bngrok\s+authtoken\s+\S{12,}'

  - id: remotespark-joinvnc-url
    desc: RemoteSpark joinvnc URL
    crit: suspicious
    conf: 0.94
    if:
      type: text
      substr: remotespark.com/view/joinvnc.html?id=

composite_rules:
  - id: batch-enables-rdp-access
    desc: Batch enables remote desktop access
    crit: hostile
    conf: 0.97
    all:
      - id: batch-enable-rdp-registry
      - id: batch-netsh-remotedesktop-enable
      - id: batch-netsh-open-rdp-port

  - id: batch-advfirewall-rdp-allow-rule
    desc: Batch advfirewall allows inbound TCP 3389
    crit: suspicious
    conf: 0.95
    near_lines: 1
    all:
      - id: batch-advfirewall-add-rule
      - id: batch-firewall-localport-3389
      - id: batch-firewall-action-allow

  - id: batch-advfirewall-wmi-enable
    desc: Batch enables remote WMI firewall group
    crit: suspicious
    conf: 0.94
    near_lines: 1
    all:
      - id: batch-advfirewall-set-rule
      - id: batch-wmi-firewall-group-name
      - id: batch-firewall-enable-yes

  - id: batch-advfirewall-rdp-wmi-enable
    desc: Batch opens RDP and remote WMI via advfirewall
    crit: hostile
    conf: 0.98
    all:
      - id: batch-enable-rdp-registry
      - id: batch-advfirewall-rdp-allow-rule
      - id: batch-advfirewall-wmi-enable

  - id: batch-ngrok-rdp-backdoor
    desc: Batch exposes RDP through ngrok
    crit: hostile
    conf: 0.98
    all:
      - id: ngrok-authtoken-command
      - id: objectives/command-and-control/channel/tunnel/proxy::ngrok-rdp-tcp-tunnel
