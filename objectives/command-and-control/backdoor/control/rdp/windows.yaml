defaults:
  platforms: [windows]
  for: [scripts, source, pe]
  attack: T1021.001
  mbc: B0022

traits:
  - id: rdp-network-level-auth-disable
    desc: Turns off RDP network-level authentication
    crit: suspicious
    conf: 0.94
    attack: T1562.001
    if:
      # Bind the disabled value to RDP-Tcp: UserAuthentication alone is
      # also an ordinary application identifier.
      type: text
      regex: '(?i)RDP-Tcp.{0,200}\bUserAuthentication\b.{0,80}(\b0\b|-Value\s+0)'
    unless:
      - id: well-known/app/infrastructure/


composite_rules:
  - id: registry-rdp-backdoor-enablement
    desc: Registry writes install a concurrent-session RDP backdoor
    crit: hostile
    conf: 0.96
    attack: T1021.001,T1112
    all:
      - id: micro-behaviors/os/service/remote::rdp-registry-allow-connections
      - id: micro-behaviors/os/firewall/netsh::rdp-firewall-enabled-tcp-3389-value
    any:
      - id: micro-behaviors/os/service/remote::rdp-concurrent-session-setting
      - id: micro-behaviors/os/service/remote::rdp-multiple-session-setting
      - id: micro-behaviors/fs/path/config/system::windows-termsrv-dll-path
    needs: 2

  - id: powershell-staged-rdp-enablement
    desc: RDP enablement near AppData IWR/start clues
    crit: suspicious
    conf: 0.98
    for: [powershell]
    attack: T1105,T1021.001
    all:
      - id: micro-behaviors/communications/http/download/cli::iwr-outfile-download
      - id: micro-behaviors/fs/path/application/executable::appdata-exe-path
      - id: micro-behaviors/process/create/exec::start-process-call
      - id: micro-behaviors/os/service/remote::rdp-registry-allow-connections
      - id: micro-behaviors/os/service/remote::powershell-rdp-service-autostart
    near_lines: 24

  - id: powershell-downloaded-hidden-rdp-backdoor
    desc: Downloads hidden executable and enables RDP
    crit: hostile
    conf: 0.98
    for: [powershell]
    attack: T1105,T1021.001
    all:
      - id: micro-behaviors/process/create/hidden::powershell-hidden-start-with-executable-url
      - id: micro-behaviors/os/service/remote::rdp-registry-allow-connections
      - id: micro-behaviors/os/firewall/netsh::rdp-firewall-enable
