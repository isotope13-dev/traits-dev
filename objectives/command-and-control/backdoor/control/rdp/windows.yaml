defaults:
  platforms: [windows]
  for: [scripts, pe]
  attack: T1021.001
  mbc: B0022

traits:
  - id: rdp-service-autostart
    desc: Terminal Services set to auto-start
    crit: suspicious
    conf: 0.94
    if:
      type: text
      regex: '(?i)\bsc(\.exe)?\s+config\s+TermService\b[^\r\n]{0,80}\bauto\b'

  - id: powershell-termservice-name
    desc: PowerShell targets Terminal Services
    crit: notable
    conf: 0.92
    for: [powershell]
    if:
      type: text
      regex: '(?i)\bSet-Service\b[^\r\n]{0,80}\bTermService\b'

  # The `-StartupType Automatic` half of the pair is not an RDP fact at all —
  # it is the generic Windows boot-persistence setting, and now lives with its
  # siblings as micro-behaviors/os/service/control::service-auto-start-setting.
  # Only the TermService target above makes this directory the right home.

  - id: rdp-registry-allow-connections
    desc: Registry allows RDP connections
    crit: suspicious
    conf: 0.95
    if:
      type: text
      regex: '(?i)\bfDenyTSConnections\b[^\r\n]{0,100}(\b0\b|-Value\s+0)'

  - id: rdp-firewall-remote-desktop
    desc: Firewall command targets Remote Desktop
    crit: suspicious
    conf: 0.94
    if:
      type: text
      regex: '(?i)\bnetsh(\.exe)?\b[^\r\n]{0,120}\bremote[ -]?desktop\b'

  - id: rdp-firewall-enable-command
    desc: Firewall command enables a rule
    crit: component
    conf: 0.94
    if:
      type: text
      regex: '(?i)\bnetsh(\.exe)?\b[^\r\n]{0,100}\b(enable|enabled|new)\b'

composite_rules:
  - id: rdp-firewall-enable
    desc: Firewall command enables a Remote Desktop rule
    crit: suspicious
    conf: 0.94
    all:
      - id: rdp-firewall-enable-command
      - id: rdp-firewall-remote-desktop
    near_lines: 1

  - id: windows-rdp-enable-sequence
    desc: Enables Windows Remote Desktop through service, registry, and firewall changes
    crit: hostile
    conf: 0.98
    all:
      - id: rdp-service-autostart
      - id: rdp-registry-allow-connections
      - id: rdp-firewall-remote-desktop
      - id: rdp-firewall-enable
    near_lines: 6

  - id: powershell-rdp-service-autostart
    desc: PowerShell sets Terminal Services auto-start
    crit: suspicious
    conf: 0.95
    for: [powershell]
    all:
      - id: powershell-termservice-name
      - id: micro-behaviors/os/service/control::service-auto-start-setting
    near_lines: 2

  - id: powershell-staged-rdp-enablement
    desc: PowerShell stages implant and enables RDP
    crit: hostile
    conf: 0.98
    for: [powershell]
    attack: T1105,T1021.001
    all:
      - id: objectives/command-and-control/dropper/execution/download-exec::powershell-appdata-download-execute
      - id: rdp-registry-allow-connections
      - id: powershell-rdp-service-autostart
    near_lines: 24
