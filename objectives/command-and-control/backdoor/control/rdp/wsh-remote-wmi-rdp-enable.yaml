# Remote-administration scripts that switch on Terminal Services on another
# host over WMI with supplied credentials and move the RDP listener to a
# chosen port. Administrators enable RDP this way, and intruders holding
# stolen credentials do too, so the combination is suspicious, not hostile.
defaults:
  platforms: [windows]
  for: [vbs]
  attack: T1021.001,T1047,T1112

composite_rules:
  - id: wsh-remote-wmi-enables-terminal-services
    desc: Enables Terminal Services over remote WMI
    crit: suspicious
    conf: 0.88
    all:
      - id: micro-behaviors/os/wmi/remote::swbemlocator-connectserver-with-credentials
      - id: micro-behaviors/os/service/remote::stdregprov-terminal-services-write
  - id: wsh-wmi-relocates-rdp-listener-port
    desc: Moves RDP listener port via WMI registry
    crit: suspicious
    conf: 0.85
    all:
      - id: micro-behaviors/os/service/remote::stdregprov-rdp-port-number-write
      - id: micro-behaviors/os/service/remote::stdregprov-terminal-services-write
