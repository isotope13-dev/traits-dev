# Compound compiler-wrapper and command-agent indicators.
# Archive co-occurrence does not prove which client a wrapper invokes.
defaults:
  platforms:
  - linux
  for:
  - go
  - zip
  - go_module
  - shell
  - data
  - text
  - source
  attack: T1195.002,T1059.004,T1071.001
composite_rules:
- id: cgo-wrapper-http-shell-indicators
  desc: cgo wrapper with HTTP shell indicators
  crit: hostile
  conf: 0.98
  scope: archive
  all:
  - id: micro-behaviors/data/format/json::go-json-command-tag
  - id: metadata/lang/source/syntax/call/arguments::go-field-prefix-shell-script
  - id: micro-behaviors/dylib/load/ffi::go-cgo-sysroot-linker-flag
  - id: micro-behaviors/fs/write/copy::shell-relative-client-copy-to-tmp
  - id: micro-behaviors/fs/chmod/executable/mode::shell-tmp-client-mode-700
  - id: micro-behaviors/process/create/spawn::shell-tmp-client-command-options
  - id: micro-behaviors/process/create/compile::gcc-self-spec-wrapper-directive
  - id: micro-behaviors/process/create/construction::go-http-json-run-shell-indicators
- id: cgo-wrapper-shell-result-indicators
  desc: cgo wrapper with shell result indicators
  crit: hostile
  conf: 0.97
  scope: archive
  all:
  - id: micro-behaviors/data/format/json::go-json-command-tag
  - id: metadata/lang/source/syntax/call/arguments::go-field-prefix-shell-script
  - id: micro-behaviors/dylib/load/ffi::go-cgo-sysroot-linker-flag
  - id: micro-behaviors/process/create/spawn::shell-tmp-client-command-options
  - id: metadata/lang/source/syntax/annotation::go-json-stdout-stderr-fields
  - id: metadata/lang/source/syntax/call/arguments::go-encoded-result-endpoint-arguments
  - id: micro-behaviors/process/create/compile::gcc-self-spec-wrapper-directive
  - id: micro-behaviors/process/create/construction::go-http-json-run-shell-indicators
