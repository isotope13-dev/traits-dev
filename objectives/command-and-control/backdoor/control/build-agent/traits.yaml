# Compound compiler-wrapper and command-agent indicators.
# Archive co-occurrence does not prove which client a wrapper invokes.
defaults:
  platforms:
    - linux
  for:
    - go
    - zip
    - go_module
    - shell
    - data
    - text
    - source
  attack: T1195.002,T1059.004,T1071.001
composite_rules:
  - id: go-http-shell-task-indicators
    desc: Go HTTP tasking and shell execution indicators
    crit: suspicious
    conf: 0.95
    for: [go]
    scope: file
    all:
      - id: micro-behaviors/data/format/json::go-json-command-tag
      - id: micro-behaviors/data/control-flow/branch::go-action-field-switch
      - id: metadata/lang/source/syntax/annotation::go-json-stdout-stderr-fields
      - id: micro-behaviors/communications/http/client/library::go-http-newrequest
      - id: micro-behaviors/data/parse/json::go-json-new-decoder
      - id: micro-behaviors/data/serialize/json::go-json-marshal
      - id: micro-behaviors/process/create/subprocess/configure::go-exec-command-bin-sh
      - id: metadata/lang/source/syntax/call/construction::go-login-shell-command-constructor
      - id: micro-behaviors/process/create/subprocess/launch::go-command-launch
  - id: cgo-wrapper-http-shell-indicators
    desc: Build wrapper beside HTTP shell-tasking code
    crit: hostile
    conf: 0.98
    scope: archive
    all:
      - id: micro-behaviors/data/format/json::go-json-command-tag
      - id: metadata/lang/source/syntax/call/construction::go-field-prefix-shell-script
      - id: micro-behaviors/dylib/load/ffi::go-cgo-sysroot-linker-flag
      - id: micro-behaviors/fs/write/copy::shell-relative-client-copy-to-tmp
      - id: micro-behaviors/fs/chmod/executable/mode::shell-tmp-client-mode-700
      - id: metadata/lang/source/syntax/command/launch::shell-tmp-client-command-options
      - id: metadata/build/compiler::gcc-self-spec-wrapper-directive
      - id: objectives/command-and-control/remote-command/http-poll::go-http-json-run-shell-indicators
  - id: cgo-wrapper-shell-result-indicators
    desc: Build wrapper beside shell-result reporting
    crit: hostile
    conf: 0.97
    scope: archive
    all:
      - id: micro-behaviors/data/format/json::go-json-command-tag
      - id: metadata/lang/source/syntax/call/construction::go-field-prefix-shell-script
      - id: micro-behaviors/dylib/load/ffi::go-cgo-sysroot-linker-flag
      - id: metadata/lang/source/syntax/command/launch::shell-tmp-client-command-options
      - id: metadata/lang/source/syntax/annotation::go-json-stdout-stderr-fields
      - id: metadata/lang/source/syntax/call/arguments::go-encoded-result-endpoint-arguments
      - id: metadata/build/compiler::gcc-self-spec-wrapper-directive
      - id: objectives/command-and-control/remote-command/http-poll::go-http-json-run-shell-indicators
