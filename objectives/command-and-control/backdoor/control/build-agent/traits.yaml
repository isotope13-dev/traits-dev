defaults:
  platforms: [linux]
  for: [go, zip, go_module, shell, data, source]
  attack: T1195.002,T1059.004,T1071.001

traits:
  - id: go-login-shell-lc
    desc: Go launches a login shell command
    crit: suspicious
    for: [go]
    if:
      type: text
      regex: 'exec\.Command\("/bin/sh",\s*"-lc"'

  - id: go-compiler-parent-gate
    desc: Go agent requires compiler ancestry
    crit: suspicious
    for: [go]
    if:
      type: text
      regex: 'seenCompiler\s*&&\s*seenGoBuild'

  - id: cgo-sysroot-linker-flag
    desc: cgo linker flags select a sysroot
    crit: suspicious
    for: [go]
    if:
      type: text
      regex: '#cgo.{0,80}LDFLAGS:.{0,80}--sysroot'

  - id: gcc-specs-shell-self-wrapper
    desc: GCC specs install a shell wrapper
    crit: suspicious
    for: [data, source]
    if:
      type: text
      regex: '(?s)\*self_spec:.{0,80}-wrapper /bin/sh'

  - id: shell-wrapper-copy-to-tmp
    desc: Shell wrapper copies a client to tmp
    crit: suspicious
    for: [shell]
    if:
      type: text
      regex: 'cp\s+"\$base/.{0,80}/tmp/'

  - id: shell-wrapper-chmods-tmp-client
    desc: Shell wrapper makes tmp client executable
    crit: suspicious
    for: [shell]
    if:
      type: text
      regex: 'chmod\s+700\s+/tmp/.{0,80}client'

  - id: shell-wrapper-runs-tmp-client
    desc: Shell wrapper runs a tmp client
    crit: suspicious
    for: [shell]
    if:
      type: text
      regex: '/tmp/.{0,80}client\s+--'

  - id: go-callback-result-streams
    desc: Go callback result captures stdout and stderr
    crit: notable
    for: [go]
    if:
      type: text
      regex: '(?s)Stdout\s+string\s+`json:"stdout"`.{0,100}Stderr\s+string\s+`json:"stderr"`'

  - id: go-compiler-result-upload
    desc: Uploads encoded results to compiler endpoint
    crit: suspicious
    for: [go]
    if:
      type: text
      substr: 'resultMethod, compilerResultURL, bytes.NewReader(encoded)'

composite_rules:
  - id: cgo-linker-wrapper-stages-client
    desc: cgo linker wrapper stages and runs a client
    crit: hostile
    conf: 0.97
    scope: archive
    all:
      - id: cgo-sysroot-linker-flag
      - id: shell-wrapper-copy-to-tmp
      - id: shell-wrapper-chmods-tmp-client
      - id: shell-wrapper-runs-tmp-client

  - id: compiler-triggered-http-command-agent
    desc: Compiler-triggered HTTP shell command agent
    crit: hostile
    conf: 0.98
    scope: archive
    all:
      - id: micro-behaviors/data/format/json::go-json-command-tag
      - id: go-login-shell-lc
      - id: go-compiler-parent-gate
      - id: cgo-sysroot-linker-flag
      - id: shell-wrapper-copy-to-tmp
      - id: shell-wrapper-chmods-tmp-client
      - id: shell-wrapper-runs-tmp-client

  - id: compiler-triggered-shell-output-return
    desc: Compiler-triggered shell output returned over HTTP
    crit: hostile
    conf: 0.97
    scope: archive
    all:
      - id: micro-behaviors/data/format/json::go-json-command-tag
      - id: go-login-shell-lc
      - id: cgo-sysroot-linker-flag
      - id: shell-wrapper-runs-tmp-client
      - id: go-callback-result-streams
      - id: go-compiler-result-upload

