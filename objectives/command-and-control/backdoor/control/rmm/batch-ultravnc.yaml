# Batch staging of an UltraVNC component set (config, settings helper, hook
# DLL, viewer): unattended deployment of a third-party remote-desktop agent.
defaults:
  platforms:
  - windows
  for: [batch]
traits:
- id: ultravnc-ini-stage
  desc: Stages UltraVNC configuration
  crit: notable
  conf: 0.9
  if:
    type: text
    substr: UltraVNC.ini
- id: ultravnc-settings-stage
  desc: Stages UltraVNC settings helper
  crit: notable
  conf: 0.9
  if:
    type: text
    substr: uvnc_settings.exe
- id: ultravnc-hooks-stage
  desc: Stages UltraVNC hook DLL
  crit: notable
  conf: 0.9
  if:
    type: text
    substr: vnchooks.dll
- id: ultravnc-viewer-stage
  desc: Stages UltraVNC viewer
  crit: notable
  conf: 0.9
  if:
    type: text
    substr: vncviewer.exe
composite_rules:
- id: ultravnc-payload-staging
  desc: Stages UltraVNC payload set
  crit: suspicious
  conf: 0.94
  needs: 3
  any:
  - id: ultravnc-ini-stage
  - id: ultravnc-settings-stage
  - id: ultravnc-hooks-stage
  - id: ultravnc-viewer-stage
