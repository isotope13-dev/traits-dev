# What a remote-management agent's filename gives away about who it answers to.
#
# These products personalise the download: the tenant or account identifier is
# appended to the vendor's own setup name, so `<vendor>-setup<account-id>.exe`
# is a copy that enrols itself the moment it runs, with no operator input.
# That is ordinary in a managed estate — the administrator downloaded it — so
# the bare shape is only an observation.  It convicts when the same filename
# also presents the file as some unrelated consumer application, because then
# the person running it is not the person the agent will report to.
defaults:
  platforms: [windows]
  for: [pe, dll]
  attack: T1219
traits:
  - id: agent-installer-account-id-filename
    desc: Agent installer filename embeds GUID-shaped ID
    # `setup` or `agent` immediately followed by a GUID-shaped identifier and
    # the extension.  A short vendor token may sit between the verb and GUID
    # (the report's CNN file has `setupad<guid>`), and a separator is common.
    # Anchoring the identifier to the install verb keeps this off build
    # artefacts and content-addressed cache entries that merely carry a GUID
    # somewhere in the name.
    crit: notable
    conf: 0.9
    mbc: B0030
    if:
      type: path
      basename: true
      regex: '(?i)(setup|agent)[-._]?[a-f\d]{6,8}(-[a-f\d]{4,12}){4}\.exe$'
  - id: ipv4-clientsetup-filename
    desc: IPv4-prefixed ClientSetup filename
    crit: suspicious
    conf: 0.94
    if:
      type: path
      basename: true
      regex: '^([0-9]{1,3}\.){3}[0-9]{1,3}ClientSetup\.exe$'
    not:
      - regex: '^(10|127)\.'
      - regex: '^172\.(1[6-9]|2[0-9]|3[0-1])\.'
      - regex: '^192\.168\.'
composite_rules:
  # The victim double-clicks what the download page called a free app; the
  # binary is a remote-administration agent already enrolled to the account
  # named in its own filename.  Nobody who legitimately holds that account
  # renames its installer after somebody else's product.
  - id: account-bound-lure-named-agent-installer
    desc: Account-bound agent installer with app-lure name
    crit: hostile
    conf: 0.97
    attack: T1219,T1036.005
    mbc: B0030
    all:
      - id: agent-installer-account-id-filename
      - id: objectives/evasion/masquerade/file/lure::branded-app-installer-exe-name
    any:
      - id: well-known/dual-use/remote-admin/rmm::rmm-product-version-resource
      - id: well-known/dual-use/remote-admin/syspectr::syspectr-product-version-resource
      - id: well-known/dual-use/remote-admin/teamviewer::product-name
