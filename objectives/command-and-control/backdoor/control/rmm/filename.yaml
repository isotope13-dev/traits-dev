defaults:
  platforms: [windows]
  for: [pe, dll]
  attack: T1219
traits:
  - id: rmm-clientsetup-executable-name
    desc: RMM ClientSetup executable filename
    crit: suspicious
    conf: 0.86
    if:
      type: path
      basename: true
      regex: 'ClientSetup\.exe$'
  - id: ipv4-clientsetup-filename
    desc: IPv4-prefixed ClientSetup filename
    crit: suspicious
    conf: 0.94
    if:
      type: path
      basename: true
      regex: '^([0-9]{1,3}\.){3}[0-9]{1,3}ClientSetup\.exe$'
    not:
      - regex: '^(10|127)\.'
      - regex: '^172\.(1[6-9]|2[0-9]|3[0-1])\.'
      - regex: '^192\.168\.'
composite_rules:
  - id: ipv4-prefixed-rmm-clientsetup
    desc: RMM ClientSetup filename carries an IPv4 C2 parameter
    crit: hostile
    conf: 0.97
    all:
      - id: rmm-clientsetup-executable-name
      - id: ipv4-clientsetup-filename
