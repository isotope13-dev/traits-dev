# Remotely (immense/Remotely) agent deployment markers seen when affiliates
# install the open-source RMM as post-compromise remote access instead of a
# custom implant. Match structural paths/service names — not marketing prose.
defaults:
  platforms: [windows]
  for: [powershell, scripts, batch]
  attack: T1219,T1105
  mbc: B0030

traits:
  - id: remotely-win-zip-content-path
    desc: Downloads Remotely-Win agent zip path
    crit: suspicious
    conf: 0.96
    if:
      type: text
      regex: '(?i)/Content/Remotely-Win-(x64|x86)\.zip\b'

  - id: remotely-agent-executable
    desc: Remotely_Agent.exe service binary name
    crit: suspicious
    conf: 0.95
    if:
      type: text
      regex: '(?i)\bRemotely_Agent\.exe\b'

  - id: remotely-service-name
    desc: Remotely_Service Windows service name
    crit: suspicious
    conf: 0.95
    if:
      type: text
      regex: '(?i)\bRemotely_Service\b'

  - id: remotely-connectioninfo-json
    desc: Remotely ConnectionInfo.json agent config
    crit: suspicious
    conf: 0.94
    if:
      type: text
      regex: '(?i)Remotely[\\/]ConnectionInfo\.json\b'

  - id: remotely-clientdownloads-api
    desc: Remotely WindowsInstaller ClientDownloads API
    crit: suspicious
    conf: 0.96
    if:
      type: text
      regex: '(?i)/api/ClientDownloads/WindowsInstaller/'

  - id: remotely-irm-iex-pipeline
    desc: Remotely irm|iex installer pipeline
    crit: suspicious
    conf: 0.96
    if:
      type: text
      regex: '(?i)\birm\b[^\r\n|]{0,200}/api/ClientDownloads/WindowsInstaller/[^\r\n|]{0,80}\|\s*iex\b'

composite_rules:
  - id: remotely-agent-zip-service-install
    desc: Remotely zip download installs Remotely service
    crit: hostile
    conf: 0.98
    all:
      - id: remotely-win-zip-content-path
      - id: remotely-service-name
      - id: remotely-agent-executable

  - id: remotely-irm-clientdownloads-bootstrap
    desc: Remotely ClientDownloads installer piped to IEX
    crit: hostile
    conf: 0.97
    all:
      - id: remotely-clientdownloads-api
      - id: remotely-irm-iex-pipeline
