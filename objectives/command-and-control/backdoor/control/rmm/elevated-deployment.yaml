# The reported BAT dropper elevates and installs ScreenConnect. Reuse the
# delivery/provisioning capabilities so product and staging-host rotation do
# not change the detection. Consent-based elevation is not a UAC bypass.
defaults:
  for: [batch, powershell, javascript, typescript, vbs]
  platforms: [windows]

composite_rules:
  - id: elevated-unattended-agent-deployment
    desc: Elevated script downloads and provisions RMM
    crit: suspicious
    conf: 0.94
    attack: T1219,T1105
    all:
      - id: objectives/command-and-control/backdoor/control/rmm::scripted-unattended-agent-deployment
    any:
      - id: micro-behaviors/os/privilege/elevation::runas-verb
      - id: micro-behaviors/os/privilege/elevation::wsh-shellexecute-runas
    unless:
      - id: metadata/package/testing/presence/harness/
