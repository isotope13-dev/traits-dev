defaults:
  platforms: [windows]
  for: [batch, powershell, pe, dll, csharp, oledoc]
  attack: "T1219"

traits:
  - id: simplehelp-rmm-marker
    desc: SimpleHelp RMM marker
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: '(?i)\b(SimpleHelp|SimpleGateway|SimpleService\.exe|customer\.jar)\b'
  - id: silent-rmm-config
    desc: Silent RMM access configuration
    crit: suspicious
    conf: 0.94
    if:
      type: text
      regex: '(?i)(RequireSessionConfirmation=false|AllowScripting=true|AllowRecovery=true)'

  - id: screenconnect-clickonce-application-url
    desc: ScreenConnect ClickOnce URL
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: 'ScreenConnect\.Client\.application\?'
      case_insensitive: true
  - id: screenconnect-clickonce-host-param
    desc: ScreenConnect ClickOnce host parameter
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: 'ScreenConnect\.Client\.application\?[^\r\n]{0,180}h='
      case_insensitive: true
  - id: screenconnect-clickonce-port-param
    desc: ScreenConnect ClickOnce port parameter
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: 'ScreenConnect\.Client\.application\?[^\r\n]{0,180}p=[0-9]{2,5}'
      case_insensitive: true
  - id: screenconnect-clickonce-key-param
    desc: ScreenConnect ClickOnce key parameter
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: 'ScreenConnect\.Client\.application\?[^\r\n]{0,180}k='
      case_insensitive: true

  - id: screenconnect-nonvendor-hosted-endpoint
    desc: ScreenConnect URL outside vendor domain
    crit: suspicious
    conf: 0.96
    if:
      id: screenconnect-clickonce-application-url
    unless:
      - id: well-known/dual-use/remote-admin/screenconnect::screenconnect-vendor-hosted-endpoint

composite_rules:
  # A ScreenConnect MSI can be a legitimate support deployment. This
  # combination configures a guest-access agent for an operator-selected
  # bare-IP relay, installs it for unattended use, and hides access indicators
  # from the person at the machine. Together these bytes describe concealed
  # remote-control access rather than product identity alone.
  - id: screenconnect-concealed-unattended-bare-ip-backdoor
    desc: ScreenConnect MSI configures concealed unattended access to a bare-IP relay
    crit: hostile
    conf: 0.99
    attack: T1219,T1071.001,T1564
    for: [msi, oledoc]
    scope: outer
    all:
      - id: well-known/dual-use/remote-admin/screenconnect::screenconnect-product-identity
      - id: well-known/dual-use/remote-admin/screenconnect::msi-screenconnect-bare-ip-relay
      - id: well-known/dual-use/remote-admin/screenconnect::msi-screenconnect-unattended-installer
      - id: well-known/dual-use/remote-admin/screenconnect::msi-stealth-access-group

  # This operator relay was reported in malware-distributed ScreenConnect
  # clients. Require the embedded ScreenConnect service launch configuration
  # and disabled access indicators so the infrastructure IOC is tied to the
  # actual concealed remote-control behavior.
  - id: screenconnect-malware-relay-concealed-service-client
    desc: ScreenConnect concealed service client targets reported malware relay
    crit: hostile
    conf: 0.99
    attack: T1219,T1071.001
    for: [msi, oledoc]
    scope: outer
    all:
      - id: well-known/dual-use/remote-admin/screenconnect::screenconnect-family
      - id: well-known/dual-use/remote-admin/screenconnect::msi-service-client-launch-parameters
      - id: well-known/dual-use/remote-admin/screenconnect::msi-stealth-access-group
      - id: objectives/command-and-control/infrastructure/domain/known::adminrolling-live-screenconnect-relay

  # The filename sells one vendor's product; the package installs a different
  # vendor's remote-management agent. A brand owner never ships somebody
  # else's agent under their own name, and an administrator deploying that
  # agent has no reason to rename it after an unrelated consumer application —
  # the name exists to get the victim to run it. Distinct from the
  # document-lure rule in objectives/evasion/masquerade/file/lure/, which
  # covers the paperwork wording rather than an impersonated vendor.
  - id: brand-lure-msi-remote-management-agent
    desc: Brand-lure MSI name hides a remote-admin agent
    crit: hostile
    conf: 0.98
    for: [oledoc]
    attack: "T1036.005,T1219"
    all:
      - id: metadata/package/files/msi::msi-adobe-acrobat-branded-basename
      - id: objectives/command-and-control/backdoor/control/rmm::remote-management-agent-msi-package

  # A remote-administration product is legitimate, and a browser mockup is a
  # neutral UI component. Combining the product with a BiTB page that delivers
  # its installer is the social-engineering-to-backdoor chain: the synthetic
  # browser supplies false trust while the remote agent supplies continued
  # access. The collective identity reaches ScreenConnect, AnyDesk, TeamViewer,
  # Zoho Assist, RustDesk, and other RMM installer names.
  - id: browser-in-browser-remote-agent-delivery
    desc: Fake browser window delivers a remote-admin agent
    crit: hostile
    conf: 0.99
    for: [html]
    attack: "T1036,T1105,T1219"
    all:
      - id: objectives/command-and-control/dropper/delivery/auto-download::browser-in-browser-installer-delivery
      - id: objectives/command-and-control/backdoor/control/rmm::remote-access-agent-reference
    unless:
      - id: well-known/tool/detection/
      - id: metadata/package/testing/presence/fixture/

  - id: rmm-with-advanced-ip-scanner
    for: [pe, batch, powershell]
    desc: Remote-support tool paired with Advanced IP Scanner
    crit: suspicious
    conf: 0.95
    attack: T1219,T1046
    all:
      - id: well-known/tool/sysadmin/network::advanced-ip-scanner
    any:
      - id: well-known/dual-use/remote-admin/rmm::anydesk-installer-name
      - id: simplehelp-rmm-marker

  - id: rmm-with-mimikatz
    desc: Remote-support tool paired with Mimikatz credential dumping
    crit: suspicious
    conf: 0.97
    attack: T1219,T1003.001
    for: [batch, python, javascript, c, powershell]
    unless:
      - id: metadata/build/generated::generated-attack-map-context
    all:
      - id: metadata/lang/source/syntax/command::mimikatz-memory-dump-command-text
      - id: objectives/command-and-control/backdoor/control/rmm::remote-access-agent-reference

  - id: rmm-with-remote-execution
    desc: Remote-support tool paired with cross-host execution
    crit: suspicious
    conf: 0.97
    attack: T1219,T1047,T1569.002
    for: [batch, python, javascript, c, powershell]
    all:
      - id: objectives/command-and-control/backdoor/control/rmm::remote-access-agent-reference
      - id: objectives/lateral-movement/delivery/wmi::quiet-remote-shell-execution

  # The article documents the three-tool operator chain: a legitimate RMM
  # agent retains interactive access, Mimikatz obtains reusable credentials,
  # and PsExec moves execution to another Windows endpoint. Product and
  # implementation identities stay in their canonical rules so this catches
  # other remote-support agents and WMI/Impacket variants of the same chain.
  - id: rmm-credential-dump-lateral-execution
    desc: RMM access followed by credential dumping and remote execution
    crit: hostile
    conf: 0.98
    attack: T1219,T1003.001,T1047,T1569.002
    for: [batch, python, javascript, c, powershell]
    all:
      - id: rmm-with-mimikatz
      - id: objectives/lateral-movement/delivery/wmi::quiet-remote-shell-execution

  - id: screenconnect-clickonce-session-url
    desc: ScreenConnect ClickOnce session URL
    crit: notable
    conf: 0.96
    all:
      - id: screenconnect-clickonce-application-url
      - id: screenconnect-clickonce-host-param
      - id: screenconnect-clickonce-port-param
      - id: screenconnect-clickonce-key-param

  # Self-hosting is ScreenConnect's ordinary deployment (an MSP's own
  # support.<domain> relay), and the vendor signature authenticates the runner,
  # not the relay named in it. A non-vendor host alone is therefore a
  # deployment fact, not intent; the hostile launcher rules below require a
  # corroborating relay indicator (raw IP, suspicious TLD, confirmed campaign
  # relay, tampered image).
  - id: screenconnect-self-hosted-launcher
    for: [pe]
    desc: Signed ScreenConnect launcher for a self-hosted relay
    crit: notable
    conf: 0.9
    all:
      - id: well-known/dual-use/remote-admin/screenconnect::screenconnect-authenticode-signer
      - id: screenconnect-clickonce-session-url
      - id: screenconnect-nonvendor-hosted-endpoint
      - id: micro-behaviors/communications/http/url/domain::http-url-binary
    unless:
      - id: well-known/dual-use/remote-admin/screenconnect::screenconnect-signed-launcher-context

  - id: screenconnect-external-ip-launcher
    for: [pe]
    desc: ScreenConnect launcher uses external IPv4 endpoint
    crit: hostile
    conf: 0.97
    all:
      - id: screenconnect-clickonce-session-url
      - id: micro-behaviors/communications/http/url/external-ip::url-external-ip-query-port-binary
    unless:
      - id: well-known/dual-use/remote-admin/screenconnect::screenconnect-signed-launcher-context

  # A valid ConnectWise signature authenticates the reusable runner, not the
  # relay URL stored in its unauthenticated Authenticode attribute. Require the
  # vendor signer, the runner build artifact, and a separately confirmed relay
  # endpoint before assigning hostile intent to this otherwise legitimate RMM.
  - id: screenconnect-known-malware-relay-launcher
    for: [pe]
    desc: Signed ScreenConnect launcher targets confirmed malware relay
    crit: hostile
    conf: 0.99
    all:
      - id: well-known/dual-use/remote-admin/screenconnect::screenconnect-authenticode-signer
      - id: well-known/dual-use/remote-admin/screenconnect::screenconnect-clickonce-runner-pdb
    any:
      - id: objectives/command-and-control/infrastructure/ip::campaign-screenconnect-relay-217-60-241

  - id: screenconnect-suspicious-tld-launcher
    desc: ScreenConnect launcher directed to suspicious TLD
    crit: hostile
    conf: 0.97
    all:
      - id: screenconnect-clickonce-session-url
    any:
      - id: micro-behaviors/communications/http/url/tld::tld-su

  # A revoked signer alone is not evidence that a ScreenConnect component
  # is malicious, and an MSP may legitimately provision unattended access on a
  # self-hosted relay. ConnectWise says the certificate rotation addressed
  # customization-data trust requirements, not certificate compromise. A
  # revoked certificate, custom relay and unattended client warrant review but
  # do not establish an unauthorized deployment by themselves.
  - id: revoked-signer-screenconnect-unattended-relay
    desc: Revoked-certificate ScreenConnect runner embeds unattended external relay
    crit: suspicious
    conf: 0.97
    attack: T1219,T1071.001
    for: [pe]
    scope: outer
    all:
      - id: well-known/dual-use/remote-admin/screenconnect::screenconnect-product-identity
      - id: well-known/dual-use/remote-admin/screenconnect::msi-screenconnect-prearmed-unattended-client
      - id: well-known/dual-use/remote-admin/screenconnect::msi-relay-host-nonvendor-domain
      - id: metadata/signed/certificate/security::connectwise-legacy-code-signing-cert-revoked

  - id: screenconnect-tampered-session-launcher
    for: [pe]
    desc: Tampered signed ScreenConnect session launcher
    crit: hostile
    conf: 0.98
    attack: "T1219,T1553.002"
    all:
      - id: well-known/dual-use/remote-admin/screenconnect::screenconnect-family
      - id: screenconnect-clickonce-session-url
      - id: metadata/signed/certificate/signature::pe-signature-digest-mismatch
    unless:
      - id: well-known/dual-use/remote-admin/screenconnect::screenconnect-signed-launcher-context

  - id: unsigned-screenconnect-business-lure-control
    for: [pe]
    desc: Unsigned ScreenConnect business lure with process control
    crit: hostile
    conf: 0.99
    attack: "T1036.007,T1055,T1219"
    all:
      - id: metadata/file/naming::business-document-themed-basename
      - id: metadata/signed/trust-level::unsigned-missing-signature-record
      - id: well-known/dual-use/remote-admin/screenconnect::screenconnect-family
      - id: micro-behaviors/process/enumerate/psapi::enum-processes
      - id: micro-behaviors/process/attach/rights::open-process
      - id: micro-behaviors/mem/protect/modify::virtual-protect
      - id: micro-behaviors/process/info/thread::get-thread-context-import
      - id: micro-behaviors/process/info/thread::set-thread-context-import

  - id: dual-rmm-remote-access-stack
    for: [pe]
    desc: Dual RMM remote access stack
    crit: hostile
    conf: 0.98
    all:
      - id: simplehelp-rmm-marker
      - id: well-known/dual-use/remote-admin/screenconnect::screenconnect-product-marker
    any:
      - id: silent-rmm-config
      - id: objectives/persistence/system/safeboot::rmm-safeboot-service-persistence
