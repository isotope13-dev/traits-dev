defaults:
  platforms: [windows]
  for: [batch, powershell, pe, dll, csharp, oledoc]
  attack: "T1219"

traits:
  - id: simplehelp-rmm-marker
    desc: SimpleHelp RMM marker
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: '(?i)\b(SimpleHelp|SimpleGateway|SimpleService\.exe|customer\.jar)\b'
  - id: silent-rmm-config
    desc: Silent RMM access configuration
    crit: suspicious
    conf: 0.94
    if:
      type: text
      regex: '(?i)(RequireSessionConfirmation=false|AllowScripting=true|AllowRecovery=true)'

  - id: screenconnect-clickonce-application-url
    desc: ScreenConnect ClickOnce URL
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: 'ScreenConnect\.Client\.application\?'
      case_insensitive: true
  - id: screenconnect-clickonce-host-param
    desc: ScreenConnect ClickOnce host parameter
    crit: component
    conf: 0.95
    if:
      type: text
      regex: 'ScreenConnect\.Client\.application\?[^\r\n]{0,180}h='
      case_insensitive: true
  - id: screenconnect-clickonce-port-param
    desc: ScreenConnect ClickOnce port parameter
    crit: component
    conf: 0.95
    if:
      type: text
      regex: 'ScreenConnect\.Client\.application\?[^\r\n]{0,180}p=[0-9]{2,5}'
      case_insensitive: true
  - id: screenconnect-clickonce-key-param
    desc: ScreenConnect ClickOnce key parameter
    crit: component
    conf: 0.95
    if:
      type: text
      regex: 'ScreenConnect\.Client\.application\?[^\r\n]{0,180}k='
      case_insensitive: true

  - id: screenconnect-nonvendor-hosted-endpoint
    desc: ScreenConnect URL outside vendor domain
    crit: suspicious
    conf: 0.96
    if:
      id: screenconnect-clickonce-application-url
    unless:
      - id: well-known/dual-use/remote-admin/screenconnect::screenconnect-vendor-hosted-endpoint

composite_rules:
  # The filename sells one vendor's product; the package installs a different
  # vendor's remote-management agent. A brand owner never ships somebody
  # else's agent under their own name, and an administrator deploying that
  # agent has no reason to rename it after an unrelated consumer application —
  # the name exists to get the victim to run it. Distinct from the
  # document-lure rule in objectives/evasion/masquerade/file/lure/, which
  # covers the paperwork wording rather than an impersonated vendor.
  - id: brand-lure-msi-remote-management-agent
    desc: Brand-lure MSI name hides a remote-admin agent
    crit: hostile
    conf: 0.98
    for: [msi]
    attack: "T1036.005,T1219"
    all:
      - id: metadata/package/files/msi::msi-adobe-acrobat-branded-basename
      - id: objectives/command-and-control/backdoor/control/rmm::remote-management-agent-msi-package

  - id: rmm-with-advanced-ip-scanner
    desc: Remote-support tool paired with Advanced IP Scanner
    crit: suspicious
    conf: 0.95
    attack: T1219,T1046
    all:
      - id: well-known/tool/sysadmin/network::advanced-ip-scanner
    any:
      - id: well-known/dual-use/remote-admin/rmm::anydesk-installer-name
      - id: simplehelp-rmm-marker

  - id: rmm-with-mimikatz
    desc: Remote-support tool paired with Mimikatz credential dumping
    crit: suspicious
    conf: 0.97
    attack: T1219,T1003.001
    for: [scripts, source, pe, dll, csharp, oledoc]
    unless:
      - id: metadata/file/profile/identity::generated-attack-map-context
    all:
      - id: well-known/tool/offensive/mimikatz::mimikatz-command-script
      - id: objectives/command-and-control/backdoor/control/rmm::remote-access-agent-reference

  - id: rmm-with-remote-execution
    desc: Remote-support tool paired with cross-host execution
    crit: suspicious
    conf: 0.97
    attack: T1219,T1047,T1569.002
    for: [batch, powershell, python, javascript, c, cpp, pe, dll]
    all:
      - id: objectives/command-and-control/backdoor/control/rmm::remote-access-agent-reference
      - id: objectives/lateral-movement/delivery/wmi::windows-wmi-or-psexec-remote-execution

  # The article documents the three-tool operator chain: a legitimate RMM
  # agent retains interactive access, Mimikatz obtains reusable credentials,
  # and PsExec moves execution to another Windows endpoint. Product and
  # implementation identities stay in their canonical rules so this catches
  # other remote-support agents and WMI/Impacket variants of the same chain.
  - id: rmm-credential-dump-lateral-execution
    desc: RMM access followed by credential dumping and remote execution
    crit: hostile
    conf: 0.98
    attack: T1219,T1003.001,T1047,T1569.002
    for: [batch, powershell, python, javascript, c, cpp, pe, dll]
    all:
      - id: rmm-with-mimikatz
      - id: objectives/lateral-movement/delivery/wmi::windows-wmi-or-psexec-remote-execution

  - id: screenconnect-clickonce-session-url
    desc: ScreenConnect ClickOnce session URL
    crit: notable
    conf: 0.96
    all:
      - id: screenconnect-clickonce-application-url
      - id: screenconnect-clickonce-host-param
      - id: screenconnect-clickonce-port-param
      - id: screenconnect-clickonce-key-param

  - id: screenconnect-untrusted-hosted-launcher
    desc: Signed ScreenConnect session launcher hosted outside the vendor domain
    crit: hostile
    conf: 0.98
    all:
      - id: well-known/dual-use/remote-admin/screenconnect::screenconnect-authenticode-signer
      - id: screenconnect-clickonce-session-url
      - id: screenconnect-nonvendor-hosted-endpoint
      - id: micro-behaviors/communications/http/url/domain::http-url-binary
    unless:
      - id: well-known/dual-use/remote-admin/screenconnect::screenconnect-signed-launcher-context

  - id: screenconnect-external-ip-launcher
    desc: ScreenConnect launcher uses external IPv4 endpoint
    crit: hostile
    conf: 0.97
    all:
      - id: screenconnect-clickonce-session-url
      - id: micro-behaviors/communications/http/url/external-ip::url-external-ip-query-port-binary
    unless:
      - id: well-known/dual-use/remote-admin/screenconnect::screenconnect-signed-launcher-context

  # A valid ConnectWise signature authenticates the reusable runner, not the
  # relay URL stored in its unauthenticated Authenticode attribute. Require the
  # vendor signer, the runner build artifact, and a separately confirmed relay
  # endpoint before assigning hostile intent to this otherwise legitimate RMM.
  - id: screenconnect-known-malware-relay-launcher
    desc: Signed ScreenConnect launcher targets confirmed malware relay
    crit: hostile
    conf: 0.99
    all:
      - id: well-known/dual-use/remote-admin/screenconnect::screenconnect-authenticode-signer
      - id: well-known/dual-use/remote-admin/screenconnect::screenconnect-clickonce-runner-pdb
    any:
      - id: objectives/command-and-control/infrastructure/ip::campaign-screenconnect-relay-217-60-241

  - id: screenconnect-suspicious-tld-launcher
    desc: ScreenConnect launcher directed to suspicious TLD
    crit: hostile
    conf: 0.97
    all:
      - id: screenconnect-clickonce-session-url
    any:
      - id: micro-behaviors/communications/http/url/tld::tld-su

  - id: screenconnect-tampered-session-launcher
    desc: Tampered signed ScreenConnect session launcher
    crit: hostile
    conf: 0.98
    attack: "T1219,T1553.002"
    all:
      - id: well-known/dual-use/remote-admin/screenconnect::screenconnect-family
      - id: screenconnect-clickonce-session-url
      - id: metadata/binary/anomaly/provenance::pe-signature-digest-mismatch
    unless:
      - id: well-known/dual-use/remote-admin/screenconnect::screenconnect-signed-launcher-context

  - id: unsigned-screenconnect-business-lure-control
    desc: Unsigned ScreenConnect business lure with process control
    crit: hostile
    conf: 0.99
    attack: "T1036.007,T1055,T1219"
    all:
      - id: objectives/evasion/masquerade/file/lure::business-document-exe-name
      - id: metadata/binary/layout::pe-no-signature-record
      - id: well-known/dual-use/remote-admin/screenconnect::screenconnect-family
      - id: micro-behaviors/process/enumerate/psapi::enum-processes
      - id: micro-behaviors/process/create/spawn::open-process
      - id: micro-behaviors/mem/protect/modify::virtual-protect
      - id: micro-behaviors/process/inject/runtime/call::get-thread-context-dup
      - id: micro-behaviors/process/inject/runtime/call::set-thread-context-dup

  - id: dual-rmm-remote-access-stack
    desc: Dual RMM remote access stack
    crit: hostile
    conf: 0.98
    all:
      - id: simplehelp-rmm-marker
      - id: well-known/dual-use/remote-admin/screenconnect::screenconnect-product-marker
    any:
      - id: silent-rmm-config
      - id: objectives/persistence/system/service/install::rmm-safeboot-service-persistence
