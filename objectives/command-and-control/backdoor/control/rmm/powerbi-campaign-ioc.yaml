# Huntress identifies this ScreenConnect service client as the secondary rogue
# RMM deployed in the Power BI phishing campaign. The stock runner's product
# identity and revoked vendor certificate are not sufficient to call other
# builds hostile; this exact Authenticode image hash records the reported IOC.
defaults:
  platforms: [windows]
  for: [pe]
  attack: T1219

traits:
  - id: powerbi-secondary-rogue-screenconnect-client
    desc: ScreenConnect client linked to phishing campaign
    crit: hostile
    conf: 1.0
    ref: https://www.huntress.com/blog/screenconnect-power-bi
    if:
      type: value
      path: pe.image_hash.sha256
      exact: ccf995f9bc4afd000bb44c22fecdcd6ab0c61e14df10ab275d619cea0f200a9a
