defaults:
  for:
  - powershell
  platforms:
  - windows
  crit: notable
  conf: 0.98
traits:
- id: reflective-vnc-bind-arguments
  desc: Injected VNC bind port and password arguments
  if:
    type: text
    substr: notepad.exe bind $Port $Password
composite_rules:
- id: powershell-injected-vnc-access
  desc: Injects a VNC remote-control payload
  crit: hostile
  all:
  - id: reflective-vnc-bind-arguments
  - id: micro-behaviors/process/inject/runtime/call::powershell-remote-thread-memory-api-profile
  - id: well-known/tool/offensive/powershell-empire::lateral-module-functions
