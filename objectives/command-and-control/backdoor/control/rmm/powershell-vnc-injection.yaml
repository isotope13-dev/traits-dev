defaults:
  for:
  - powershell
  platforms:
  - windows
  crit: notable
  conf: 0.98
traits:
- id: reflective-vnc-bind-arguments
  desc: VNC payload bind port and password arguments
  if:
    type: text
    substr: notepad.exe bind $Port $Password
composite_rules:
- id: powershell-reflective-vnc-access
  desc: Reflectively loads a VNC remote-control payload
  crit: hostile
  all:
  - id: reflective-vnc-bind-arguments
  - id: micro-behaviors/data/decode/base64::powershell-pebytes-buffer-decode
  - id: micro-behaviors/process/inject/remote-thread::powershell-remote-reflective-image-call
