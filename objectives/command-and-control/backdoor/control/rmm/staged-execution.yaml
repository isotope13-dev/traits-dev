# Deployment and execution profiles, not verdicts about the commercial client.
# Co-occurrence does not prove parentage, authorization, or installer data flow.
# Embedded PowerShell commands retain this profile in other source languages.
# The download atoms distinguish native and embedded command representations.
defaults:
  for: [scripts, source]
  platforms: [windows]
  crit: suspicious
  conf: 0.92
  attack: T1219,T1105,T1218.007
composite_rules:
  - id: policy-bypassed-remote-agent-msi-download
    desc: Policy bypass near remote-agent download and quiet MSI install
    near_lines: 8
    any:
      - id: micro-behaviors/communications/http/download/cli::iwr-outfile-download
      - id: micro-behaviors/communications/http/download/cli::embedded-iwr-outfile-download
    all:
      - id: remote-access-agent-reference
      - id: micro-behaviors/os/security/policy::powershell-process-policy-bypass-command
      - id: micro-behaviors/process/create/installer::msiexec-package-verb
      - id: micro-behaviors/process/create/installer::msiexec-quiet-switch

  - id: downloaded-remote-agent-staged-execution
    desc: Remote-agent MSI deployment near ScreenConnect RunFile execution
    near_lines: 8
    any:
      - id: micro-behaviors/communications/http/download/cli::iwr-outfile-download
      - id: micro-behaviors/communications/http/download/cli::embedded-iwr-outfile-download
    all:
      - id: remote-access-agent-reference
      - id: micro-behaviors/process/create/installer::msiexec-package-verb
      - id: micro-behaviors/process/create/installer::msiexec-quiet-switch
      - id: well-known/dual-use/remote-admin/screenconnect::windows-client-runfile-command
      - id: micro-behaviors/fs/path/temp::screenconnect-document-transfer-executable-path
