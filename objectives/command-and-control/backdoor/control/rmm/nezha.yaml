# Nezha (nezhahq) agent install used as C2/backdoor visibility in Medusa and
# similar post-compromise tooling. Match env-config + install script fetch —
# not product marketing prose.
defaults:
  platforms: [windows, unix]
  for: [powershell, shell, scripts]
  attack: T1219,T1105
  mbc: B0030

traits:
  - id: nezha-nz-server-env
    desc: Nezha NZ_SERVER environment assignment
    crit: suspicious
    conf: 0.95
    if:
      type: text
      regex: '(?i)\$env:NZ_SERVER\s*='

  - id: nezha-nz-client-secret-env
    desc: Nezha NZ_CLIENT_SECRET environment assignment
    crit: suspicious
    conf: 0.95
    if:
      type: text
      regex: '(?i)\$env:NZ_CLIENT_SECRET\s*='

  - id: nezha-official-install-script-url
    desc: Downloads Nezha agent install.ps1 from nezhahq
    crit: suspicious
    conf: 0.96
    if:
      type: text
      regex: '(?i)raw\.githubusercontent\.com/nezhahq/[^\r\n]{0,80}install\.ps1'

composite_rules:
  - id: nezha-agent-env-install
    desc: Nezha agent via NZ_* env and install script
    crit: hostile
    conf: 0.98
    all:
      - id: nezha-nz-server-env
      - id: nezha-nz-client-secret-env
      - id: nezha-official-install-script-url

  - id: nezha-agent-covers-tracks
    desc: Nezha install clears PowerShell history
    crit: hostile
    conf: 0.97
    all:
      - id: nezha-agent-env-install
      - id: objectives/evasion/indicator-removal/history::powershell-psreadline-history-remove
    near_lines: 40
