# Remote-management enrollment through a script or loader.  The signal is the
# combination of a transfer API and an enrollment credential on a launch line.
# Agent installer filenames live under micro-behaviors (not RMM intent alone).
defaults:
  platforms: [windows]
  for: [batch, powershell, javascript, vbs, pe]
  attack: T1105,T1219

traits:
  # Both credential atoms accept the spellings RMM vendors actually use on the
  # command line — API_KEY, APITOKEN, apikey, auth_token, authkey — because the
  # tradecraft is "the agent is enrolled to somebody's tenant at install time",
  # not one vendor's parameter name. Each pattern also anchors a launcher
  # (msiexec / Start-Process / ShellExecute) so a bare token is not enough.
  - id: msiexec-enrollment-credential
    desc: MSI enrollment credential launch argument
    crit: suspicious
    conf: 0.94
    if:
      type: text
      regex: '(?i)\bmsiexec(\.exe)?\b[^\r\n]{0,120}\b(api|auth)[_-]?(key|token)\s*='

  - id: script-enrollment-credential
    desc: Scripted enrollment credential launch argument
    crit: suspicious
    conf: 0.94
    if:
      type: text
      regex: '(?i)\b(ShellExecute|Start-Process)\b[^\r\n]{0,120}\b(api|auth)[_-]?(key|token)\s*='

composite_rules:
  - id: viewer-lure-filename-bootstrap-enrollment
    desc: Viewer lure enrolls remote agent from filename
    crit: hostile
    conf: 0.995
    for: [oledoc]
    all:
      - id: micro-behaviors/fs/path/construct::msi-path-token-host-bootstrap-arguments
      - id: objectives/evasion/masquerade/file/lure::viewer-named-rmm-agent-installer

  - id: remote-agent-enrollment-bootstrap
    desc: Scripted remote-agent enrollment bootstrap
    crit: hostile
    conf: 0.98
    near_bytes: 4096
    all:
      - id: micro-behaviors/communications/http/client/xmlhttp::js-xmlhttp-open
    any:
      - id: msiexec-enrollment-credential
      - id: script-enrollment-credential

  - id: identified-remote-agent-enrollment
    desc: Remote-agent enrollment with installer artifact
    crit: hostile
    conf: 0.99
    near_bytes: 4096
    all:
      - id: remote-agent-enrollment-bootstrap
      - id: micro-behaviors/fs/path/application/executable::agent-suffixed-exe-or-msi-name

  - id: rmm-post-access-security-recon
    desc: RMM follow-on security posture reconnaissance
    crit: hostile
    conf: 0.97
    attack: T1082,T1069.001,T1518.001
    near_bytes: 8192
    all:
      - id: remote-agent-enrollment-bootstrap
    any:
      - id: objectives/discovery/host/security::ps-bitlocker-volume-query
      - id: objectives/discovery/host/security::ps-firewall-profile-query
      - id: objectives/discovery/account/enum::ps-local-administrators-group-query
      - id: objectives/discovery/system/activity::ps-reboot-required-query
    needs: 2
