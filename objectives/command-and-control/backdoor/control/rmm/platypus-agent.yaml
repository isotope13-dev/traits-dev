defaults:
  platforms: [unix, windows]
  for: [elf, macho, pe]
  crit: suspicious
  conf: 0.95
traits:
  - id: remote-agent-process-and-filesystem-rpc
    desc: Remote agent exposes process and filesystem RPC
    if:
      type: text
      substr: host_fs_write_
  - id: remote-agent-shell-rpc-interface
    desc: Remote agent exposes interactive shell RPC
    if:
      type: raw
      regex: 'Platypus/internal/agent/.{0,60}(shell|exec)'
