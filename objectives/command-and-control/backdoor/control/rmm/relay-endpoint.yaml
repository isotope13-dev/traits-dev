# RMM agents wired to an operator-run relay instead of the vendor's cloud.
#
# ScreenConnect and its peers take their session endpoint as client launch
# parameters — `?h=<relay host>&p=<port>&k=<key>` — baked into the installer or
# passed on the msiexec command line.  In a genuine deployment the host is the
# tenant's vendor-hosted instance (`<tenant>.screenconnect.com`, a
# `*-relay.screenconnect.com` edge).  Crews that re-host the agent point those
# same parameters at a box of their own, which has no DNS name, so the host
# field carries a bare IPv4 and a non-standard port.
#
# The existing MSI-side rules in well-known/dual-use/remote-admin/screenconnect cover
# the vendor-domain relay string and the stealth switches inside the package.
# This file covers the script-side install command, where the endpoint is
# chosen — and the raw-address form those rules do not express.
#
# ATT&CK: T1219 (Remote Access Software)
defaults:
  platforms: [windows, unix]
  for: [scripts, oledoc, pe, dll, csharp]
  attack: T1219
  mbc: B0030

traits:
  - id: screenconnect-access-guest-parameters
    desc: ScreenConnect guest access parameters
    crit: component
    conf: 0.94
    for: [batch, powershell, javascript, typescript, html, php, source]
    if:
      type: text
      regex: '(?i)[?&]e=Access(&amp;|&)y=Guest'
  - id: screenconnect-relay-host-parameter
    desc: ScreenConnect relay host parameter
    crit: component
    conf: 0.94
    for: [batch, powershell, javascript, typescript, html, php, source]
    if:
      type: text
      regex: '(?i)[?&]h=[A-Za-z0-9.-]{1,120}-relay\.screenconnect\.com'
  - id: screenconnect-relay-port-parameter
    desc: ScreenConnect relay port parameter
    crit: component
    conf: 0.9
    for: [batch, powershell, javascript, typescript, html, php, source]
    if:
      type: text
      regex: '(?i)[?&]p=443(&amp;|&)'
  - id: screenconnect-session-parameter
    desc: ScreenConnect session parameter
    crit: component
    conf: 0.9
    for: [batch, powershell, javascript, typescript, html, php, source]
    if:
      type: text
      regex: '(?i)[?&](s|k)=[A-Za-z0-9+/=_-]{8,}'

composite_rules:
  - id: screenconnect-guest-relay-session
    desc: ScreenConnect guest session targets relay
    crit: suspicious
    conf: 0.97
    for: [batch, powershell, javascript, typescript, html, php, source]
    all:
      - id: screenconnect-access-guest-parameters
      - id: screenconnect-relay-host-parameter
      - id: screenconnect-relay-port-parameter
      - id: screenconnect-session-parameter
    near_bytes: 512

  - id: screenconnect-guest-relay-client-launch
    desc: ScreenConnect relay session launches client
    crit: hostile
    conf: 0.99
    for: [batch, powershell, javascript, typescript, html, php, source]
    all:
      - id: screenconnect-guest-relay-session
      - id: well-known/dual-use/remote-admin/screenconnect::screenconnect-clientsetup-name-script
      - id: well-known/dual-use/remote-admin/screenconnect::screenconnect-clientservice-name-script
    near_bytes: 2048

  - id: screenconnect-guest-relay-msi-bootstrap
    desc: ScreenConnect relay session installs MSI client
    crit: hostile
    conf: 0.99
    for: [batch, powershell, javascript, typescript, html, php, source]
    all:
      - id: screenconnect-guest-relay-session
      - id: well-known/dual-use/remote-admin/screenconnect::screenconnect-clientsetup-name-script
      - id: micro-behaviors/process/create/installer::msiexec-package-verb
    near_bytes: 4096
