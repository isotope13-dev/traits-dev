# RMM agents wired to an operator-run relay instead of the vendor's cloud.
#
# ScreenConnect and its peers take their session endpoint as client launch
# parameters — `?h=<relay host>&p=<port>&k=<key>` — baked into the installer or
# passed on the msiexec command line.  In a genuine deployment the host is the
# tenant's vendor-hosted instance (`<tenant>.screenconnect.com`, a
# `*-relay.screenconnect.com` edge).  Crews that re-host the agent point those
# same parameters at a box of their own, which has no DNS name, so the host
# field carries a bare IPv4 and a non-standard port.
#
# The existing MSI-side rules in well-known/dual-use/remote-admin/screenconnect cover
# the vendor-domain relay string and the stealth switches inside the package.
# This file covers the script-side install command, where the endpoint is
# chosen — and the raw-address form those rules do not express.
#
# ATT&CK: T1219 (Remote Access Software)
defaults:
  platforms: [windows, unix]
  for: [scripts, oledoc, pe, dll, csharp]
  attack: T1219
  mbc: B0030

traits:
  - id: screenconnect-access-guest-parameters
    desc: ScreenConnect guest access parameters
    crit: component
    conf: 0.94
    for: [batch, powershell, javascript, typescript, html, php, source]
    if:
      type: text
      regex: '(?i)[?&]e=Access(&amp;|&)y=Guest'
  - id: screenconnect-relay-host-parameter
    desc: ScreenConnect relay host parameter
    crit: component
    conf: 0.94
    for: [batch, powershell, javascript, typescript, html, php, source]
    if:
      type: text
      regex: '(?i)[?&]h=[A-Za-z0-9.-]{1,120}-relay\.screenconnect\.com'
  - id: screenconnect-relay-port-parameter
    desc: ScreenConnect relay port parameter
    crit: component
    conf: 0.9
    for: [batch, powershell, javascript, typescript, html, php, source]
    if:
      type: text
      regex: '(?i)[?&]p=443(&amp;|&)'
  - id: screenconnect-session-parameter
    desc: ScreenConnect session parameter
    crit: component
    conf: 0.9
    for: [batch, powershell, javascript, typescript, html, php, source]
    if:
      type: text
      regex: '(?i)[?&](s|k)=[A-Za-z0-9+/=_-]{8,}'

  # `&t=` carries the label the client reports to the relay — the name the
  # operator sees in their session list. An MSP fills it with the customer or
  # site, because that console list is how they find the machine again; a
  # deployment tool fills it from an asset field. A run of six or more letters
  # with no vowel in it is neither: it is what someone types when the field is
  # required and they intend nobody to be able to attribute the session.
  #
  # Vowel-free is the discriminator rather than "looks random": real labels are
  # words, hostnames or ticket ids, and all of those carry vowels or digits.
  - id: screenconnect-unpronounceable-session-label
    desc: ScreenConnect session label has no vowels
    crit: notable
    conf: 0.9
    platforms: [windows]
    for: [pe, dll, msi, batch, powershell]
    if:
      type: text
      regex: '(?i)[?&]t=[b-df-hj-np-tv-xz]{6,}\b'

composite_rules:
  - id: screenconnect-guest-relay-session
    desc: ScreenConnect guest session targets relay
    crit: suspicious
    conf: 0.97
    for: [batch, powershell, javascript, typescript, html, php, source]
    all:
      - id: screenconnect-access-guest-parameters
      - id: screenconnect-relay-host-parameter
      - id: screenconnect-relay-port-parameter
      - id: screenconnect-session-parameter
    near_bytes: 512

  - id: screenconnect-guest-relay-client-launch
    desc: ScreenConnect relay session launches client
    crit: hostile
    conf: 0.99
    for: [batch, powershell, javascript, typescript, html, php, source]
    all:
      - id: screenconnect-guest-relay-session
      - id: well-known/dual-use/remote-admin/screenconnect::screenconnect-clientsetup-name-script
      - id: well-known/dual-use/remote-admin/screenconnect::screenconnect-clientservice-name-script
    near_bytes: 2048

  - id: screenconnect-guest-relay-msi-bootstrap
    desc: ScreenConnect relay session installs MSI client
    crit: hostile
    conf: 0.99
    for: [batch, powershell, javascript, typescript, html, php, source]
    all:
      - id: screenconnect-guest-relay-session
      - id: well-known/dual-use/remote-admin/screenconnect::screenconnect-clientsetup-name-script
      - id: micro-behaviors/process/create/installer::msiexec-package-verb
    near_bytes: 4096

  # A stock, validly-signed ScreenConnect client is dual-use: the pre-armed
  # unattended-access configuration alone is what an MSP ships too. What an MSP
  # does not ship is that configuration with the operator label deliberately
  # left unattributable — their own console depends on that field being
  # meaningful. Together: a remote-control agent that will accept a session with
  # nobody at the keyboard, pinned to one relay, reporting to an operator who
  # took care not to name themselves.
  - id: screenconnect-anonymous-prearmed-client
    desc: Pre-armed ScreenConnect client hides its operator
    crit: suspicious
    conf: 0.95
    platforms: [windows]
    for: [pe, dll, msi]
    all:
      - id: well-known/dual-use/remote-admin/screenconnect::msi-screenconnect-prearmed-unattended-client
      - id: screenconnect-unpronounceable-session-label

  # The general form of the rule above: the product identity plus a deployment
  # anomaly. These signals warrant investigation but do not alone prove that
  # the software was installed without authorization.
  #
  # Product identity is only notable on its own. A customer who bought
  # ScreenConnect deploys it through their own console: the build
  # carries their instance, the tray icon and the "you are being controlled"
  # banner stay on because their users are supposed to know, the relay is a DNS
  # name rather than an address, and the operator label names a site. Every leg
  # below is an operator choosing the opposite, and each one costs the attacker
  # something they wanted — visibility to the victim, or attribution of the
  # session back to them.
  #
  # Structural artifacts of unpacking are deliberately NOT anomalies here. An
  # embedded `ScreenConnect.Core.dll` lifted out of a signed installer is
  # unsigned simply because members of a signed package are, and treating that
  # as evidence would convict every extracted component of a legitimate build.
  - id: screenconnect-anomalous-deployment
    desc: ScreenConnect build carries a deployment anomaly
    crit: suspicious
    conf: 0.95
    platforms: [windows]
    for: [pe, dll, msi, batch, powershell]
    scope: outer
    all:
      - id: well-known/dual-use/remote-admin/screenconnect::screenconnect-family
    any:
      # Tray icon, connect balloon and control banner switched off: the victim
      # is not meant to know a session is live.
      - id: well-known/dual-use/remote-admin/screenconnect::msi-screenconnect-stealth-config
      # Relay is a bare IPv4 — operator infrastructure with no DNS name, not a
      # tenant's vendor-hosted instance.
      - id: well-known/dual-use/remote-admin/screenconnect::screenconnect-bare-ip-relay-parameters
      # Session label deliberately unattributable.
      - id: screenconnect-unpronounceable-session-label
  # ScreenConnect becomes concretely deceptive when its executable is presented
  # as a text file or business document. Normal unattended and self-hosted
  # deployments do not satisfy either filename-lure condition.
  - id: screenconnect-masqueraded-deployment
    desc: ScreenConnect executable masquerades as document
    crit: hostile
    conf: 0.98
    attack: "T1219,T1036"
    platforms: [windows]
    for: [pe, dll]
    scope: outer
    all:
      - id: well-known/dual-use/remote-admin/screenconnect::screenconnect-family
    any:
      - id: objectives/evasion/masquerade/extension/mismatch::pe-named-as-txt
      - id: objectives/evasion/masquerade/file/lure::business-document-exe-name
