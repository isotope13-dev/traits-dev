# A legitimate remote-management agent becomes a suspicious implant profile
# when it is installed as a privileged auto-start service and exposes structured
# remote task/file-transfer operations over an encrypted WebSocket.  The rule
# deliberately uses protocol and persistence mechanics rather than vendor names
# so trojanized agents in other languages remain visible.
defaults:
  attack: T1219,T1543.003,T1071.001

composite_rules:
  - id: windows-persistent-rmm-wss-agent
    desc: Windows LocalSystem auto-start service with WSS remote-agent tasking
    crit: suspicious
    conf: 0.97
    platforms: [windows]
    for: [powershell, batch, csharp, go]
    all:
      - id: micro-behaviors/os/service/control::sc-local-system-auto-start
      - id: micro-behaviors/communications/http/websocket::wss-scheme
      - id: micro-behaviors/process/create/agent::remote-task-file-transfer-protocol
    near_bytes: 2048

  - id: unix-persistent-rmm-wss-agent
    desc: Root systemd auto-start service with WSS remote-agent tasking
    crit: suspicious
    conf: 0.97
    platforms: [linux, unix]
    for: [python, shell, systemd, go, rust, objc, elf]
    all:
      - id: objectives/persistence/system/service/install::root-multi-user-autostart-service
      - id: micro-behaviors/communications/http/websocket::wss-scheme
      - id: micro-behaviors/process/create/agent::remote-task-file-transfer-protocol
    near_bytes: 2048
