# RMM identity corroborates the executable/document mismatch. Keep this
# suspicious: URL suffixes do not establish the response's actual file type.
defaults:
  for: [html]
  platforms: [windows, macos, linux]
  attack: "T1219,T1036.008"

composite_rules:
  - id: rmm-installer-document-download-name
    desc: RMM installer link suggests a document filename
    crit: suspicious
    conf: 0.97
    all:
      - id: objectives/evasion/masquerade/extension/mismatch/
    any:
      - id: well-known/dual-use/remote-admin/screenconnect::screenconnect-clientsetup-name-script
      - id: well-known/dual-use/remote-admin/rmm::anydesk-installer-name
      - id: well-known/dual-use/remote-admin/rmm::teamviewer-installer-name
      - id: well-known/dual-use/remote-admin/rmm::zoho-assist-installer-name
      - id: well-known/dual-use/remote-admin/rmm::logmein-agent-name
    near_bytes: 256
