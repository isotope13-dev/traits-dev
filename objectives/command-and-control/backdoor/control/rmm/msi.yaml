defaults:
  for: [msi, oledoc]
  platforms: [windows]
  attack: T1219
  size_max: 50000000

composite_rules:
# Vendor-agnostic "this MSI installs somebody's remote-management agent",
# read from the container's own summary stream. The per-vendor legs are value
# matchers over MSI metadata, and this composite is the single place the lure
# rules name them collectively.
# Deploying one of these is ordinary administration, so on its own it is only
# an observation of what the package is.
- id: remote-management-agent-msi-package
  desc: MSI package installs a remote-admin agent
  crit: notable
  conf: 0.95
  any:
  - id: well-known/dual-use/remote-admin/rmm::breeze-rmm-msi-subject
  - id: metadata/package/files/msi::msi-ninite-agent-subject-summary
  - id: metadata/package/files/msi::msi-zoho-assist-title
  - id: metadata/package/files/msi::msi-screenconnect-creator-summary
  - id: well-known/dual-use/remote-admin/logmein-resolve::logmein-resolve-installer

# The same package, built for entry with nobody present.
#
# `remote-management-agent-msi-package` above only says which product an
# installer carries, because deploying a remote-support agent is ordinary
# administration. What raises it is the vendor's own summary calling the build
# unattended: that variant registers a service and accepts an inbound session
# without the logged-on user approving it, so installing it -- once, silently,
# from a file that arrived by whatever route -- leaves a standing inbound path
# onto the host. It is the MSI-packaged equivalent of the `--set-password`
# and `--silent --start-with-win` switches in unattended.yaml, and it was the
# one shape those script-facing rules could not see, because there is no script:
# the provisioning is baked into the package.
#
# Suspicious. A managed estate deploys unattended agents deliberately and at
# scale; the composites in unattended.yaml supply the legs -- a bare-IP download
# host, a hidden self-elevating launcher, a second tunnel -- that make a
# specific deployment hostile.
- id: unattended-remote-agent-msi-package
  desc: MSI installs an unattended remote-access agent
  crit: suspicious
  conf: 0.93
  attack: T1219,T1543.003
  all:
  - id: remote-management-agent-msi-package
  - id: metadata/package/files/msi::msi-unattended-package-description

# The unattended package plus the capabilities that make a foothold useful.
#
# `remote-access-host-inventory` in unattended.yaml records this pairing for the
# scripted deployments -- a remote-support product named next to a run of host
# inventory commands -- and could not see it here, because in a packaged agent
# the inventory is compiled into the binary rather than written as shell.
# Reading it from the embedded agent instead: deep Win32 host profiling and
# access-token duplication, alongside an installer whose own summary says the
# build accepts sessions unattended.
#
# Suspicious, not hostile. This is what a remote-management agent is for, and a
# managed estate ships one deliberately. What the rule buys is that an analyst
# holding an unsolicited installer is told, in one finding, that it provisions
# standing remote access and arrives able to enumerate and impersonate on the
# host -- rather than having to assemble that from a hundred notable imports.
#
# scope: outer -- the summary fact is on the installer database and the profiling
# and token calls are in the agent binary inside it, which the MSI carries as an
# OLE stream rather than as an archive entry, so `archive` does not pool them.
- id: unattended-remote-agent-msi-host-recon
  for: [msi, oledoc, pe]
  desc: Unattended remote agent packages host reconnaissance
  crit: suspicious
  conf: 0.92
  attack: T1219,T1082,T1134
  scope: outer
  all:
  - id: unattended-remote-agent-msi-package
  - id: micro-behaviors/os/sysinfo/profile::win32-host-network-api-profile
  - id: micro-behaviors/os/privilege/token::duplicate-token

- id: screenconnect-msi-deployment-indicators
  desc: ScreenConnect MSI package with suspicious deployment indicators
  crit: suspicious
  conf: 0.98
  attack: T1219,T1071.001
  scope: outer
  all:
  - id: remote-management-agent-msi-package
  any:
  - id: well-known/dual-use/remote-admin/screenconnect::msi-unattended-access-launch-parameter
  - id: well-known/dual-use/remote-admin/screenconnect::msi-relay-host-bare-ip
  - id: objectives/command-and-control/backdoor/control/rmm::screenconnect-unpronounceable-session-label
  # Disabled indicators already have a precise dual-use configuration finding;
  # they alone establish neither unattended access nor a command channel.
  unless:
  - id: well-known/dual-use/remote-admin/screenconnect::msi-screenconnect-unattended-installer

# The operator-built shape of a ScreenConnect MSI: the session endpoint is a
# bare IPv4 (vendor and MSP deployments name a tenant hostname), the package
# is configured for unattended Access, and it registers the persistent client
# service. Binaries may be stock and validly signed -- the configuration is
# what hands an unknown party standing inbound control, so the combination
# is read as a covert RMM foothold rather than an administrator's rollout.
- id: screenconnect-msi-operator-relay-unattended-service
  for: [msi, oledoc, pe, xml, cab]
  desc: ScreenConnect MSI wires an unattended service to a bare-IP relay
  crit: hostile
  conf: 0.95
  attack: T1219,T1543.003,T1071.001
  scope: outer
  all:
  - id: well-known/dual-use/remote-admin/screenconnect::msi-screenconnect-bare-ip-relay
  - id: well-known/dual-use/remote-admin/screenconnect::msi-screenconnect-unattended-installer
  - id: well-known/dual-use/remote-admin/screenconnect::msi-screenconnect-service-persistence

# The remote-management product is dual-use, but its customized relay is
# paired with an unattended role whose user-facing indicators are suppressed,
# or the fuller auto-consent stealth configuration. Unattended access alone
# does not establish concealment. This is an objective finding, not identity.
- id: screenconnect-msi-nonvendor-unattended-access
  desc: ScreenConnect unattended access uses a nonvendor relay domain
  crit: suspicious
  conf: 0.95
  attack: T1219,T1071.001
  for: [pe, dll, xml, msi]
  scope: outer
  all:
  - id: well-known/dual-use/remote-admin/screenconnect::msi-screenconnect-nonvendor-domain-relay
  - id: well-known/dual-use/remote-admin/screenconnect::msi-unattended-access-launch-parameter

# A fixed bare-IP endpoint and unattended/hidden-access configuration is the
# operator-built deployment shape. Product binaries can remain stock; the
# installer configuration is the hostile behavior.
- id: screenconnect-msi-covert-bare-ip-relay
  desc: ScreenConnect covert bare-IP relay deployment
  crit: hostile
  conf: 0.96
  attack: T1219,T1071.001
  mbc: C0048
  for: [pe, dll, xml, msi]
  scope: outer
  all:
  - id: well-known/dual-use/remote-admin/screenconnect::screenconnect-product-identity
  - id: well-known/dual-use/remote-admin/screenconnect::msi-relay-host-bare-ip
  any:
  - id: well-known/dual-use/remote-admin/screenconnect::msi-feedback-survey-hidden
  - id: well-known/dual-use/remote-admin/screenconnect::msi-balloon-connect-hidden
  - id: well-known/dual-use/remote-admin/screenconnect::msi-balloon-hide-hidden
  - id: well-known/dual-use/remote-admin/screenconnect::msi-tray-icon-hidden
  - id: well-known/dual-use/remote-admin/screenconnect::msi-unattended-access-launch-parameter

# ScreenConnect also ships a native ClientSetup.exe wrapper around the same
# MSI/CAB payload. A customized wrapper can therefore be validly vendor-signed
# while already carrying the operator's unattended Access/Guest role, relay,
# key, and service registration. This is high-risk deployment context rather
# than proof of compromise: managed estates legitimately generate unattended
# clients, while unsolicited email/browser delivery makes the same artifact an
# RMM foothold.
- id: screenconnect-prearmed-unattended-sfx-installer
  for: [pe]
  desc: ScreenConnect SFX installer embeds unattended relay access
  crit: suspicious
  conf: 0.97
  attack: T1219,T1543.003
  scope: outer
  all:
  - id: well-known/dual-use/remote-admin/screenconnect::screenconnect-sfx-installer
  - id: well-known/dual-use/remote-admin/screenconnect::msi-screenconnect-prearmed-unattended-client
  - id: well-known/dual-use/remote-admin/screenconnect::msi-screenconnect-service-persistence
