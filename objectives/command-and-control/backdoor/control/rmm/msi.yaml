defaults:
  # Nested ScreenConnect PE members carry these markers; MSI containers are
  # a first-class `msi` type; keep matchers on that bucket.
  for: [pe, dll]
  platforms: [windows]
  attack: T1219
  size_max: 50000000

traits:
- id: screenconnect-msi-launch-constraint
  desc: ScreenConnect constrained launch config
  crit: component
  conf: 0.96
  if:
    type: text
    substr: ScreenConnect.ApplicationSettings
    section: ".text"
- id: screenconnect-msi-access-mode
  desc: ScreenConnect access session mode
  crit: component
  conf: 0.93
  if:
    type: text
    substr: SERVICE_CLIENT_LAUNCH_PARAMETERS?e=Access
    section: ".text"
- id: screenconnect-msi-backstage-shell
  desc: ScreenConnect backstage shell payload
  crit: component
  conf: 0.96
  if:
    type: text
    substr: ProcessExecutablePathsToTerminate=[INSTALLLOCATION]ScreenConnect.WindowsBackstageShell.exe
    section: ".text"
- id: screenconnect-msi-credential-storage
  desc: ScreenConnect credential storage UI
  crit: component
  conf: 0.94
  if:
    type: text
    substr: Store credentials to enter on the logon screen later
    section: ".text"

composite_rules:
# Vendor-agnostic "this MSI installs somebody's remote-management agent",
# read from the container's own summary stream. MSI containers route as
# Unknown, so the per-vendor legs are value matchers under
# metadata/package/files/msi/ rather than well-known/ identities, and this
# composite is the single place the lure rules name them collectively.
# Deploying one of these is ordinary administration, so on its own it is only
# an observation of what the package is.
- id: remote-management-agent-msi-package
  desc: MSI package installs a remote-admin agent
  crit: notable
  conf: 0.95
  for: [msi]
  any:
  - id: well-known/dual-use/remote-admin/rmm::breeze-rmm-msi-subject
  - id: metadata/package/files/msi::msi-ninite-agent-subject-summary
  - id: metadata/package/files/msi::msi-zoho-assist-title
  - id: metadata/package/files/msi::msi-screenconnect-creator-summary

- id: screenconnect-msi-relay-service
  desc: ScreenConnect relay service installer
  crit: suspicious
  conf: 0.99
  scope: outer
  all:
  - id: metadata/package/files/msi::msi-installation-database-title
  - id: screenconnect-msi-launch-constraint
  - id: well-known/dual-use/remote-admin/screenconnect::msi-relay-host-parameter
  - id: objectives/persistence/system/service/install::msi-service-wrapper-binaries
  any:
  - id: screenconnect-msi-access-mode
  - id: screenconnect-msi-backstage-shell
- id: screenconnect-msi-remote-access-backdoor
  desc: ScreenConnect remote access backdoor
  crit: hostile
  conf: 0.99
  scope: outer
  all:
  - id: screenconnect-msi-relay-service
  - id: objectives/persistence/login/winlogon/credential-provider::msi-credential-provider-persistence
  any:
  - id: screenconnect-msi-backstage-shell
  - id: screenconnect-msi-credential-storage
