defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
composite_rules:
  - id: encrypted-hidden-command-job-broker
    desc: Encrypted command jobs feed a hidden child
    crit: hostile
    conf: 0.98
    attack: T1071.001,T1573.001,T1059
    all:
      - id: micro-behaviors/process/io/stdin::function-input-hidden-child-stdin
      - id: metadata/lang/source/syntax/member::message-type-and-content-member-names
      - id: metadata/lang/source/syntax/object::http-request-options-object-shape
      - id: metadata/lang/source/syntax/object::host-user-heartbeat-object-fields
    any:
      - id: micro-behaviors/data/encode/xor::host-identity-compressed-xor-codec
      - id: micro-behaviors/crypto/symmetric/aes/runtime-library::createCipheriv

  - id: ecdh-message-dispatch-function-exec-rat
    desc: ECDH-authenticated message handler executes dynamic code and updates script
    crit: hostile
    conf: 0.99
    attack: T1059.007,T1573.002,T1105
    all:
      - id: metadata/lang/source/syntax/member::message-type-and-content-member-names
      - id: micro-behaviors/crypto/asymmetric/ecdh::ecdh-source-algorithm-reference
      - id: micro-behaviors/process/interpreter/eval/constructed::new-function-iife
      - id: micro-behaviors/fs/write/file/full::node-write-file-sync-call
      - id: micro-behaviors/process/info/commandline::check-argv
      - id: metadata/import/builtin::require-child-process
