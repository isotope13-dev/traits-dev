defaults:
  for: [c]
  platforms: [unix]

traits:
  - id: shell-backdoor-test-declaration
    desc: Shell backdoor test identifier
    crit: notable
    if:
      type: symbol
      kind: identifier
      regex: '^test_(drop|install)_shell_backdoor$'

  - id: hide-port-test-declaration
    desc: Port concealment test identifier
    crit: notable
    if:
      type: symbol
      kind: identifier
      regex: '^test_hide_(tcp_)?ports$'

  - id: login-record-cleanup-test-declaration
    desc: Login record cleanup test identifier
    crit: notable
    if:
      type: symbol
      kind: identifier
      exact: test_cleanup_login_records

composite_rules:
  - id: concealed-backdoor-test-declarations
    desc: Tests name a shell backdoor, port hiding, and login record cleanup
    crit: hostile
    all:
      - id: shell-backdoor-test-declaration
      - id: hide-port-test-declaration
      - id: login-record-cleanup-test-declaration
