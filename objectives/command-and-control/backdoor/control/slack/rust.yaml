# Rust Slack-polled command agents. Slack API use is neutral in
# micro-behaviors; this objective requires history polling plus outbound post
# and local process execution — the host-tagged RAT shape seen in custom
# Slack C2 implants (including AI-assisted builds).
defaults:
  platforms: [unix, windows]
  for: [rust]
  attack: T1071.003,T1059,T1105
  mbc: B0030

traits:
  - id: rust-host-tagged-run-prefix
    desc: Host-tagged run command prefix
    crit: component
    conf: 0.9
    if:
      type: string_literal
      exact: "run:"

  - id: rust-host-tagged-download-prefix
    desc: Host-tagged download command prefix
    crit: component
    conf: 0.9
    if:
      type: string_literal
      exact: "download:"

  - id: rust-host-tagged-shell-prefix
    desc: Host-tagged reverse-shell command prefix
    crit: component
    conf: 0.92
    if:
      type: string_literal
      exact: "shell:"

composite_rules:
  - id: rust-slack-history-poller
    desc: Rust implant polls Slack conversation history
    crit: suspicious
    conf: 0.98
    all:
      - id: micro-behaviors/communications/http/services/slack::go-slack-api-base-url
      - id: micro-behaviors/communications/http/services/slack::go-slack-conversations-history
      - id: micro-behaviors/communications/http/services/slack::go-slack-auth-test

  - id: rust-slack-command-agent
    desc: Rust Slack agent polls history and executes commands
    crit: hostile
    conf: 0.995
    all:
      - id: rust-slack-history-poller
      - id: micro-behaviors/communications/http/services/slack::rust-slack-chat-post
      - id: micro-behaviors/process/create/exec::rust-command-new-call
    any:
      - id: rust-host-tagged-run-prefix
      - id: rust-host-tagged-download-prefix
      - id: rust-host-tagged-shell-prefix
    near_bytes: 8000

  - id: rust-slack-reverse-shell-agent
    desc: Rust Slack agent exposes reverse-shell command
    crit: hostile
    conf: 0.99
    all:
      - id: rust-slack-history-poller
      - id: rust-host-tagged-shell-prefix
      - id: micro-behaviors/process/create/exec::rust-command-new-call
