defaults:
  platforms: [unix, windows]
  attack: T1102.002,T1059.007

composite_rules:
  - id: go-slack-decrypted-code-tasking
    desc: Slack history with decrypted Node source
    for: [go]
    crit: hostile
    conf: 0.97
    all:
      - id: micro-behaviors/communications/http/services/slack::slack-history-request-url
      - id: micro-behaviors/communications/http/lib/netlib::go-http-client-do
      - id: micro-behaviors/crypto/decrypt::go-gcm-open
      - id: micro-behaviors/process/create/eval::go-open-result-node-code
      - id: micro-behaviors/data/control-flow/loop::block-unbounded-loop-header

  - id: webcrypto-slack-code-tasking
    desc: Slack polling with decrypted code evaluation
    for: [javascript, typescript]
    crit: hostile
    conf: 0.98
    all:
      - id: objectives/execution/payload/script-eval::webcrypto-slack-plaintext-eval
      - id: micro-behaviors/communications/http/services/slack::slack-history-request-url
      - id: micro-behaviors/data/control-flow/loop::infinite-loop-header
