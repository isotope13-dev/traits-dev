# Encrypted Slack tasking agents; messaging alone is neutral.
defaults:
  platforms:
  - unix
  - windows
  for:
  - go
  attack: T1071.001,T1059,T1105
  mbc: B0025
composite_rules:
- id: go-slack-encrypted-command-agent
  for:
  - go
  - zip
  desc: Go Slack agent decrypts, drops, and executes received content
  crit: hostile
  conf: 0.99
  scope: archive
  all:
  - id: micro-behaviors/communications/http/services/slack::go-slack-conversations-history
  - id: micro-behaviors/communications/http/services/slack::go-slack-auth-test
  - id: micro-behaviors/communications/http/services/slack::go-slack-chat-post-api
  - id: micro-behaviors/crypto/symmetric/aes/gcm::go-cipher-new-gcm
  - id: micro-behaviors/fs/write/file/full::go-os-writefile
  - id: micro-behaviors/process/create/subprocess::go-exec-command-call
- id: go-slack-polled-chunked-tasking
  desc: Go file polls Slack history for chunked encrypted tasks
  crit: hostile
  conf: 0.98
  all:
  - id: micro-behaviors/communications/http/services/slack::go-slack-api-base-url
  - id: micro-behaviors/communications/http/services/slack::go-slack-conversations-history
  - id: objectives/command-and-control/backdoor/implant::go-slack-chunk-packet-schema
  - id: micro-behaviors/crypto/symmetric/aes/gcm::go-cipher-new-gcm
  - id: micro-behaviors/process/create/subprocess::go-exec-command-call
