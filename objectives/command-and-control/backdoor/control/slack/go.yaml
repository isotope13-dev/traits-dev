# Slack-backed encrypted command agents.  Slack protocol use is neutral in
# micro-behaviors; this objective requires both directions of the API plus
# decryption, file output, and process execution across the Go package.
defaults:
  platforms: [unix, windows]
  for: [go]
  attack: T1071.001,T1059,T1105
  mbc: B0025

composite_rules:
  - id: go-slack-encrypted-command-agent
    for: [go, zip]
    desc: Go Slack agent decrypts, drops, and executes received content
    crit: hostile
    conf: 0.99
    scope: archive
    all:
      - id: micro-behaviors/communications/http/services/slack::go-slack-conversations-history
      - id: micro-behaviors/communications/http/services/slack::go-slack-auth-test
      - id: micro-behaviors/communications/http/services/slack::go-slack-chat-post-api
      - id: micro-behaviors/crypto/symmetric/aes/gcm::go-cipher-new-gcm
      - id: micro-behaviors/fs/write/file/full::go-os-writefile
      - id: micro-behaviors/process/create/direct::exec-command

  # File-scope form of the same technique. The archive-scope agent above
  # pools evidence across a whole package; a single-file implant (or a
  # reviewer looking at one provider/module source file) carries the full
  # chain in one leaf: it polls conversations.history, reassembles the
  # operator's chunked t/id/d packets, AES-GCM-decrypts them, and executes
  # the result. Same legs minus the drop-to-disk requirement, since
  # memory-only tasking needs no WriteFile.
  - id: go-slack-polled-chunked-tasking
    desc: Go file polls Slack history for chunked encrypted tasks
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/communications/http/services/slack::go-slack-api-base-url
      - id: micro-behaviors/communications/http/services/slack::go-slack-conversations-history
      - id: objectives/command-and-control/backdoor/implant::go-slack-chunk-packet-schema
      - id: micro-behaviors/crypto/symmetric/aes/gcm::go-cipher-new-gcm
      - id: micro-behaviors/process/create/direct::exec-command
