# An mIRC remote that only answers a hardcoded operator nick and tells that
# nick the client is infected is a backdoor check-in, not a greeting script:
# the nick gate selects the operator, the silent .msg answers them directly,
# and the backdoor self-label states what the victim is carrying. Any single
# leg can appear in a benign script; together they have no legitimate use.
defaults:
  platforms: [unix, windows]
  attack: T1071
composite_rules:
  - id: mirc-nick-gated-infection-announcer
    desc: Nick-gated IRC infection announcer
    crit: hostile
    conf: 0.94
    any:
      - id: objectives/command-and-control/channel/irc/client::mirc-script-event-join
      - id: objectives/command-and-control/channel/irc/client::mirc-script-event-text
    all:
      - id: objectives/command-and-control/channel/irc/client::mirc-controller-nick-gate
      - id: objectives/command-and-control/channel/irc/client::mirc-command-targets-nick
      - id: objectives/command-and-control/backdoor/keywords::backdoor-word
