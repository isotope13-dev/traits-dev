# A live IRC server entry plus Perform-on-connect activation creates a
# remotely managed mIRC profile. The remote-script list corroborates this
# configuration, but a server address or remote-enabled client alone is
# insufficient.
defaults:
  platforms: [windows]
  for: [text]
composite_rules:
  - id: mirc-irc-remote-control-profile
    desc: mIRC profile connects to IRC with remote scripts enabled
    crit: hostile
    conf: 0.94
    all:
      - id: metadata/file/format/structured::mirc-client-config-section
      - id: micro-behaviors/communications/irc/configure::mirc-enable-remote-scripts
      - id: micro-behaviors/communications/irc/configure::mirc-server-endpoint-declaration
      - id: metadata/file/format/structured::mirc-remote-script-list
  - id: mirc-sys-script-dde-fserve-control-profile
    desc: mIRC profile loads .sys scripts with DDE server and silent file serving
    crit: hostile
    conf: 0.96
    attack: T1071.001,T1559.002
    all:
      - id: metadata/file/format/structured::mirc-client-config-section
      - id: objectives/evasion/masquerade/extension-mismatch::mirc-sys-suffixed-script-config
      - id: micro-behaviors/os/message/dde::mirc-dde-server-enabled
      - id: micro-behaviors/os/message/dde::mirc-dde-custom-service-name
      - id: micro-behaviors/communications/irc/configure::mirc-fileserver-warning-disabled
      - id: micro-behaviors/communications/irc/configure::mirc-warn-fserve-disabled
  # Bot profiles that connect to a fixed server, load remote scripts and set
  # symbol fonts on the status/channel windows: the client is configured to
  # take remote commands while its activity is unreadable to the user.
  - id: mirc-masked-remote-script-profile
    desc: IRC remote-script profile masks its windows
    crit: hostile
    conf: 0.95
    attack: T1071.001,T1564
    all:
      - id: metadata/file/format/structured::mirc-client-config-section
      - id: micro-behaviors/communications/irc/configure::mirc-server-endpoint-declaration
      - id: metadata/file/format/structured::mirc-remote-script-list
      - id: micro-behaviors/ui/window/visibility::mirc-config-symbol-font-window
