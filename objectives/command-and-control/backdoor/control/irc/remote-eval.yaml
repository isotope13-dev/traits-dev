# Two mIRC evaluation tricks in one script: `// [ $+ [ %on ] ]` runs a
# stored string, and `{ $2- |` runs the sender's remaining text as a
# command. Scripts use one or the other for dynamic aliases; both means
# the operator's chat line is executed on the host.
defaults:
  platforms: [windows]
  for: [mirc]
  attack: T1059
traits:
  # `... | $2- }`: the sender's remaining text becomes the command after a
  # pipe. The `{ $2- |` mirror image lives in mirc-exec-bare-params; both
  # shapes execute chat text, neither appears in legitimate scripts.
  - id: mirc-exec-piped-params
    desc: mIRC executes piped message text
    crit: suspicious
    conf: 0.92
    if:
      type: text
      regex: '(?i)\|\s*\$[1-9]-\s*(\||\})'
composite_rules:
  - id: mirc-evaluates-remote-command
    desc: mIRC evaluates attacker text as a command
    crit: hostile
    conf: 0.96
    all:
      - id: objectives/command-and-control/channel/irc/client::mirc-eval-bracket
      - id: objectives/command-and-control/channel/irc/client::mirc-exec-bare-params
  # A TEXT handler whose body pipes the sender's text into execution and
  # halts default processing is silent arbitrary remote command execution:
  # anyone whose line reaches the handler runs mIRC commands (file,
  # process, DCC) on the victim's host with no visible reply. The halt leg
  # mirrors the CTCP exec composite: without it the trigger line stays
  # visible in the victim's window.
  - id: mirc-text-piped-exec
    desc: mIRC text handler executes piped text
    crit: hostile
    conf: 0.95
    all:
      - id: mirc-exec-piped-params
      - id: micro-behaviors/communications/ipc/irc::mirc-on-text-handler
      - id: micro-behaviors/communications/ipc/irc::mirc-halt-default-processing
