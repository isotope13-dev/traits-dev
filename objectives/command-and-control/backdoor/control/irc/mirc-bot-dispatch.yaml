# An mIRC script whose command dispatcher branches on the first word of a
# channel line to start scans, launch UDP/SYN/smurf floods, and download or
# run files is a DDoS and scanning bot taking orders from the IRC operator.
# Each verb family is a notable fragment (a lone `$1 == udp` test is an
# ordinary command parser); flood plus scan plus a download or shell verb in
# one script is the bot dispatcher.
defaults:
  platforms: [windows]
  for: [mirc]
  attack: T1059,T1498
traits:
  - id: mirc-bot-scan-verbs
    desc: mIRC dispatcher branches on scan verbs
    crit: notable
    conf: 0.9
    if:
      type: text
      case_insensitive: true
      regex: '\$1 == (iisscan|ntscan|randscan|dscan)\)'

  - id: mirc-bot-flood-verbs
    desc: mIRC dispatcher branches on flood verbs
    crit: notable
    conf: 0.9
    if:
      type: text
      case_insensitive: true
      regex: '\$1 == (udp|syn|smurf|pflood)\)'

  - id: mirc-bot-download-verbs
    desc: mIRC dispatcher branches on download verbs
    crit: notable
    conf: 0.9
    if:
      type: text
      case_insensitive: true
      regex: '\$1 == (downex|download|update)\)'

  - id: mirc-bot-command-verb
    desc: mIRC dispatcher runs a stored command
    crit: notable
    conf: 0.9
    if:
      type: text
      case_insensitive: true
      regex: '\$1 == cmd\) \{[^}]{0,40}set %cmd'

composite_rules:
  - id: mirc-flood-scan-bot-dispatcher
    desc: mIRC bot dispatcher launches floods, scans and downloads
    crit: hostile
    conf: 0.95
    all:
      - id: mirc-bot-flood-verbs
      - id: mirc-bot-scan-verbs
    any:
      - id: mirc-bot-download-verbs
      - id: mirc-bot-command-verb
    needs: 1
