defaults:
  platforms: [windows]
  for: [perl]
  attack: T1021.001,T1136.001

traits:
  - id: perl-telnet-registry-key
    desc: References Windows Telnet registry key
    crit: notable
    if:
      type: text
      substr: 'Microsoft\\TelnetServer\\1.0'
  - id: perl-telnet-port-registry
    desc: Sets Telnet service port in registry
    crit: notable
    if:
      type: text
      regex: 'SetValueEx\s*\(\s*["'']TelnetPort["'']'
  - id: perl-telnet-ntlm-disabled
    desc: Sets NTLM registry value to zero
    crit: suspicious
    if:
      type: text
      regex: 'SetValueEx\s*\(\s*["'']NTLM["'']\s*,\s*0\s*,\s*4\s*,\s*0\s*\)'
  - id: perl-start-telnet-service
    desc: Starts Windows Telnet service
    crit: notable
    if:
      type: text
      regex: 'Win32::Service::StartService\s*\([^\n]{0,100}["'']TlntSvr["'']'
  - id: perl-create-user
    desc: Calls Windows user creation
    crit: notable
    if:
      type: text
      substr: 'Win32::NetAdmin::UserCreate('
  - id: perl-add-admin-group
    desc: Calls administrator group addition
    crit: notable
    if:
      type: text
      regex: 'Win32::NetAdmin::LocalGroupAddUsers\([^\n]{0,100}["'']Administrators["'']'

composite_rules:
  - id: perl-create-admin-user
    desc: Attempts user and admin group creation
    crit: suspicious
    near_lines: 3
    all:
      - id: perl-create-user
      - id: perl-add-admin-group

  - id: perl-remote-telnet-admin-kit
    desc: Attempts Telnet and admin user setup
    crit: hostile
    conf: 0.98
    all:
      - id: perl-telnet-registry-key
      - id: perl-telnet-port-registry
      - id: perl-telnet-ntlm-disabled
      - id: perl-start-telnet-service
      - id: perl-create-admin-user
