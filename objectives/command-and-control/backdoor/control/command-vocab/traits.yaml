# Generic RPC command-name vocabulary used by various npm-published
# extension and backdoor implants. The atoms are deliberately narrow literals
# or structured case labels: they are too generic to mean anything
# individually, and their signal comes from co-occurrence in a small window.
# Hosting them here keeps family attribution out of generic trait IDs.
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
traits:
  - id: cmd-vocab-exec-case-label
    desc: Exec action case label
    crit: component
    conf: 0.94
    if:
      type: text
      regex: 'case\s+["'']exec["'']\s*:'

  - id: cmd-vocab-shell-case-label
    desc: Shell action case label
    crit: component
    conf: 0.94
    if:
      type: text
      regex: 'case\s+["'']shell["'']\s*:'

  - id: cmd-vocab-websocket-control
    desc: '"websocket_control" command keyword'
    crit: component
    conf: 0.6
    if:
      type: text
      substr: websocket_control
  - id: cmd-vocab-delete-cache
    desc: '"delete_cache" command keyword'
    crit: component
    conf: 0.6
    if:
      type: text
      substr: delete_cache
  - id: cmd-vocab-screenshot
    desc: Screenshot token in command-dispatch context
    crit: component
    conf: 0.5
    if:
      type: text
      regex: '(case|command|cmd|type)[^;\n]{0,24}["'']screenshot["'']'
      case_insensitive: true
  - id: cmd-vocab-open-uri
    desc: '"open_uri" command keyword'
    crit: component
    conf: 0.6
    if:
      type: text
      substr: open_uri

  - id: cmd-vocab-install-skill
    desc: '"INSTALL_SKILL" command keyword'
    crit: component
    conf: 0.9
    if:
      type: literal
      kind: string
      exact: INSTALL_SKILL

  - id: cmd-vocab-update-skill
    desc: '"UPDATE_SKILL" command keyword'
    crit: component
    conf: 0.9
    if:
      type: literal
      kind: string
      exact: UPDATE_SKILL

  - id: cmd-vocab-uninstall-skill
    desc: '"UNINSTALL_SKILL" command keyword'
    crit: component
    conf: 0.9
    if:
      type: literal
      kind: string
      exact: UNINSTALL_SKILL

  - id: cmd-vocab-install-expert
    desc: '"INSTALL_EXPERT" command keyword'
    crit: component
    conf: 0.9
    if:
      type: literal
      kind: string
      exact: INSTALL_EXPERT

composite_rules:
  - id: remote-agent-skill-management-commands
    desc: Remote agent skill-management command set
    crit: suspicious
    conf: 0.98
    needs: 3
    any:
      - id: cmd-vocab-install-skill
      - id: cmd-vocab-update-skill
      - id: cmd-vocab-uninstall-skill
      - id: cmd-vocab-install-expert
