# Operator task prefixes used by remote file-management agents. Each token is
# incomplete evidence on its own; the clustered command set is the intent signal.
defaults:
  platforms: [unix, windows]
  for: [python, cpp, powershell]
  crit: component
  conf: 0.94

traits:
  - id: browse-path-prefix
    crit: notable
    desc: Browse-path command prefix
    if:
      type: literal
      kind: string
      exact: 'browse:'

  - id: download-file-prefix
    crit: notable
    desc: Download-file command prefix
    if:
      type: literal
      kind: string
      exact: 'download-file:'

  - id: upload-file-prefix
    crit: notable
    desc: Upload-file command prefix
    if:
      type: literal
      kind: string
      exact: 'upload-file:'

  - id: delete-file-prefix
    crit: notable
    desc: Delete-file command prefix
    if:
      type: literal
      kind: string
      exact: 'delete-file:'

  - id: rename-file-prefix
    crit: notable
    desc: Rename-file command prefix
    if:
      type: literal
      kind: string
      exact: 'rename-file:'

  - id: browse-data-prefix
    crit: notable
    desc: Browse-data response prefix
    if:
      type: literal
      kind: string
      substr: 'browse-data-'

  - id: file-data-prefix
    crit: notable
    desc: File-data response prefix
    if:
      type: literal
      kind: string
      substr: 'file-data:'

composite_rules:
  - id: file-control-command-set
    desc: Remote file-control command set
    crit: suspicious
    conf: 0.99
    needs: 4
    any:
      - id: browse-path-prefix
      - id: download-file-prefix
      - id: upload-file-prefix
      - id: delete-file-prefix
      - id: rename-file-prefix

  - id: file-control-response-set
    desc: Remote file-control response set
    crit: notable
    conf: 0.97
    all:
      - id: browse-data-prefix
      - id: file-data-prefix
