defaults:
  platforms: [windows]
  for: [pe]

traits:
  # Rust pools literals without NUL separators. Raw bounded searches recover
  # this dispatcher vocabulary when the extracted text view omits the pool.
  - id: screen-shell-process-task-verbs
    desc: Screen, shell and process-control task verbs
    crit: suspicious
    conf: 0.96
    if:
      type: raw
      section: .rdata
      regex: 'screenshot.{0,16}exec.{0,16}processes.{0,16}ps_list.{0,16}kill_process'
  - id: steam-deploy-collect-task-verbs
    desc: Steam deployment and collection task vocabulary
    crit: notable
    conf: 0.97
    if:
      type: raw
      section: .rdata
      regex: 'deploy_steam.{0,16}collect_steam'
