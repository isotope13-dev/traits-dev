# Public browser/desktop input services combine remote control with direct
# access to the user's graphical session.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  attack: T1056.003,T1113,T1071.001
  mbc: B0030

composite_rules:
  - id: public-http-desktop-input-service
    desc: Public Hapi service exposes browser and desktop controls
    crit: hostile
    conf: 0.99
    for: [javascript, typescript, npm]
    scope: archive
    all:
      - id: micro-behaviors/communications/socket/bind/address::bind-all-interfaces
      - id: micro-behaviors/communications/http/server/framework::server-hapi
      - id: micro-behaviors/communications/http/server/route::javascript-server-post-route
      - id: micro-behaviors/ui/graphics/image::javascript-page-screenshot
      - id: micro-behaviors/hardware/input/automation::desktop-input-capability-set
