# Public browser/desktop input services combine remote control with direct
# access to the user's graphical session.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  attack: T1056.003,T1113,T1071.001
  mbc: B0030

composite_rules:
  - id: desktop-input-capability-set
    desc: Browser and desktop input capability set
    crit: notable
    conf: 0.96
    any:
      - id: micro-behaviors/hardware/input/keyboard/simulate::node-xdotool-input
      - id: micro-behaviors/hardware/input/automation::browser-page-mouse-input
      - id: micro-behaviors/hardware/input/automation::browser-page-keyboard-input
      - id: micro-behaviors/hardware/input/automation::w-mousekey-desktop-input-library
    needs: 2

  - id: public-http-desktop-input-service
    desc: Public Hapi service exposes browser and desktop controls
    crit: hostile
    conf: 0.99
    scope: archive
    all:
      - id: micro-behaviors/communications/socket/bind/address::bind-all-interfaces
      - id: micro-behaviors/communications/http/server/framework::server-hapi
      - id: micro-behaviors/communications/http/server/route::javascript-server-post-route
      - id: micro-behaviors/hardware/display/screenshot::javascript-page-screenshot
      - id: desktop-input-capability-set
