defaults:
  platforms: [windows]
  for: [pe]
  attack: T1059.003,T1105,T1219
  conf: 0.99

traits:
  - id: go-pe-remote-shell-command-runner
    desc: Go PE function runs supplied command text
    crit: suspicious
    if:
      type: function
      exact: sym.go.main.shellRun
  - id: go-pe-http-task-retriever
    desc: Go PE function retrieves HTTP tasking
    crit: suspicious
    if:
      type: function
      exact: sym.go.main.fetchC2
  - id: go-pe-tasking-dispatcher
    desc: Go PE function dispatches received tasks
    crit: suspicious
    if:
      type: function
      exact: sym.go.main.launchMethod

composite_rules:
  - id: go-pe-http-controlled-remote-command-agent
    desc: Go PE retrieves remote tasks and executes supplied shell commands
    crit: hostile
    conf: 0.99
    all:
      - id: go-pe-remote-shell-command-runner
      - id: go-pe-http-task-retriever
      - id: go-pe-tasking-dispatcher
      - id: micro-behaviors/process/create/spawn::go-pe-os-exec-command-call
      - id: micro-behaviors/communications/http/client/library::go-http-client-do-string
