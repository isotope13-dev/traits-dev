defaults:
  platforms: [windows]
  for: [pe, dll]
  attack: T1219

composite_rules:
  # Co-occurring capabilities in a strongly concealed assembly. These imports
  # do not by themselves establish the network packet-to-input data flow.
  - id: concealed-clr-network-desktop-control
    desc: Concealed CLR combines screen capture, input synthesis, and socket transport
    crit: hostile
    conf: 0.95
    all:
      - id: objectives/anti-static/obfuscation/control-flow/indirect::clr-resource-and-call-concealer
      - id: micro-behaviors/hardware/display/screenshot::copyfromscreen-dotnet
      - id: micro-behaviors/hardware/input/keyboard/simulate::keybd-event
      - id: micro-behaviors/hardware/input/mouse::mouse-event
      - id: micro-behaviors/communications/socket/send::dotnet-async-socket-send-api-references
