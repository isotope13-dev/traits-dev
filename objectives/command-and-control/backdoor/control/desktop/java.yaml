# Java remote-desktop implants couple an HTTP task channel to an AWT Robot
# command dispatcher. Each command token is ordinary automation vocabulary on
# its own; the protocol cluster plus remote polling establishes RAT behavior.
defaults:
  platforms: [windows, unix]
  for: [class, java_class, jar]
  attack: T1219
  mbc: B0030

traits:
  - id: jvm-remote-pointer-command-group
    desc: JVM pointer command tokens
    crit: component
    conf: 0.9
    if:
      type: value
      path: class.strings[*]
      regex: '^(MOVE |MOVECLICK |DRAG )$'
  - id: jvm-remote-click-command-group
    desc: JVM mouse click command tokens
    crit: component
    conf: 0.9
    if:
      type: value
      path: class.strings[*]
      regex: '^(CLICK |DOUBLECLICK |MOUSE_(DOWN|UP) )$'
  - id: jvm-remote-keyboard-command-group
    desc: JVM keyboard command tokens
    crit: component
    conf: 0.9
    if:
      type: value
      path: class.strings[*]
      regex: '^(TYPE |KEY |HOTKEY )$'
  - id: jvm-remote-scroll-command
    desc: JVM scroll command token
    crit: component
    conf: 0.88
    if:
      type: value
      path: class.strings[*]
      exact: 'SCROLL '
  - id: jvm-http-device-tasking-endpoint
    desc: JVM HTTP device task endpoint
    crit: notable
    conf: 0.96
    attack: T1071.001
    if:
      type: value
      path: class.strings[*]
      regex: '(?i)^https?://[^/]{1,253}/(getcommand|getactivedevice)([/?#]|$)'

composite_rules:
  - id: jvm-desktop-input-command-protocol
    desc: JVM keyboard and mouse command protocol
    crit: suspicious
    conf: 0.98
    needs: 3
    any:
      - id: jvm-remote-pointer-command-group
      - id: jvm-remote-click-command-group
      - id: jvm-remote-keyboard-command-group
      - id: jvm-remote-scroll-command

  - id: java-http-screen-control-rat
    desc: Java HTTP desktop-control RAT
    crit: hostile
    conf: 0.995
    attack: T1071.001,T1219
    scope: archive
    all:
      - id: jvm-desktop-input-command-protocol
      - id: jvm-http-device-tasking-endpoint
      - id: micro-behaviors/hardware/input/robot::jvm-awt-input-synthesis-methods
      - id: micro-behaviors/communications/http/lib/httpclient::java-httpclient-send
