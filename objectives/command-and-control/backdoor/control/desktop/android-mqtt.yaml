# Broker-tasked synthetic input on Android: an MQTT subscriber whose
# message callback injects key or pointer events through
# android.app.Instrumentation. The send*Sync calls put events into other
# applications' event queues, so a production callback that drives them
# from broker tasking is remote device control, not UI automation: test
# code injects input locally and does not take orders from a broker.
# This is the input leg of the XCPE remote-desktop pattern (tasked
# sendKeyDownUpSync alongside hidden-API screen capture over MQTT).
# Broker host, topic names, and application identifiers are not matched.
defaults:
  platforms: [android]
  for: [java, kotlin]
  attack: T1219,T1071.001
  mbc: B0022

composite_rules:
  - id: android-mqtt-tasked-input-injection
    desc: Injects device input tasked over MQTT
    crit: hostile
    conf: 0.98
    scope: file
    all:
      - id: micro-behaviors/communications/messaging/mqtt::java-mqtt-subscriber
      - id: micro-behaviors/communications/messaging/mqtt::java-mqtt-message-callback
    any:
      - id: micro-behaviors/hardware/input/automation::android-instrumentation-key-injection
      - id: micro-behaviors/hardware/input/automation::android-instrumentation-pointer-injection
