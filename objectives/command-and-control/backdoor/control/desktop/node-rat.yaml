# A Node RAT that periodically captures and uploads the desktop while polling a
# remote endpoint for mouse and keyboard commands. Keep the library atoms
# neutral; the network coupling and persistence establish hostile intent.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  attack: T1056.002,T1113,T1219
  mbc: B0030

composite_rules:
  - id: node-desktop-screenshot-capture
    desc: Node captures the host desktop
    crit: suspicious
    conf: 0.96
    all:
      - id: micro-behaviors/hardware/display/screenshot::screenshot-desktop-import
      - id: micro-behaviors/hardware/display/screenshot::screenshot-desktop-call

  - id: node-desktop-screenshot-http-exfil
    desc: Node uploads captured desktop images to an IP endpoint
    crit: hostile
    conf: 0.99
    attack: T1041,T1113
    all:
      - id: node-desktop-screenshot-capture
      - id: micro-behaviors/communications/http/request/configuration::node-http-request-configured
      - id: micro-behaviors/communications/http/request/client::request-write-call
      - id: micro-behaviors/communications/ip/endpoint::external-ipv4-port-source-literal

  - id: node-remote-desktop-input-polling
    desc: Node polls HTTP and applies remote mouse or keyboard input
    crit: suspicious
    conf: 0.98
    all:
      - id: micro-behaviors/hardware/input/automation::nut-js-input-import
      - id: micro-behaviors/time/schedule/interval::setInterval-fetch
    any:
      - id: micro-behaviors/hardware/input/desktop-automation

  - id: node-screen-control-rat
    desc: Node RAT combines screenshot exfiltration with remote input control
    crit: hostile
    conf: 0.995
    all:
      - id: node-desktop-screenshot-http-exfil
      - id: node-remote-desktop-input-polling

  - id: node-persistent-screen-control-rat
    desc: Node screen-control RAT installs Windows run-key persistence
    crit: hostile
    conf: 0.995
    platforms: [windows]
    attack: T1053.005,T1113,T1219
    all:
      - id: node-screen-control-rat
      - id: micro-behaviors/os/registry/keys::currentversion-run
