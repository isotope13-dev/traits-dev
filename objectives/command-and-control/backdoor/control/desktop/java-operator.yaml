defaults:
  for: [java]
  platforms: [windows, unix]
  attack: T1059,T1562.001,T1055

traits:
  - id: java-remote-client-command-set
    desc: Java sends screenshot command to clients
    crit: suspicious
    conf: 0.95
    if:
      type: text
      regex: '\.SendData\([^\n]{0,100}"screenshot"\)'

  - id: java-remote-client-password-command
    desc: Java sends password command to clients
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: '\.SendData\([^\n]{0,100}"passcat"\)'

  - id: java-reflective-dll-injection-call
    desc: Calls a reflective DLL injection helper
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: '\bReflectiveDLLInjection\.DLLInject\s*\('

composite_rules:
  - id: java-remote-operator-defense-evasion
    desc: Remote operator combines collection and defense evasion
    crit: hostile
    conf: 0.97
    all:
      - id: java-remote-client-command-set
      - id: java-remote-client-password-command
      - id: java-reflective-dll-injection-call
      - id: micro-behaviors/os/security/defender::defender-exclusion-command-reference
