defaults:
  platforms: [windows]
  for: [pe]
  mbc: B0030
  attack: T1219,T1136.001,T1070.001,T1113

composite_rules:
  # A remote-control client that can watch the screen and inject input also
  # creates local accounts and clears the event logs. Remote-support products
  # do the first half; none has a reason to add a user behind the operator or
  # erase the logs that record the session.
  - id: native-screen-input-account-log-wipe-rat
    desc: Native RAT with screen, input, new-account and log wipe
    crit: hostile
    conf: 0.95
    all:
      - id: micro-behaviors/hardware/display/screenshot::gdi-screen-capture-primitives
      - id: micro-behaviors/hardware/input/event::synthetic-user-input
      - id: micro-behaviors/os/user/account::net-user-add-api
      - id: micro-behaviors/os/event/log::native-open-and-clear-api-set
    unless:
      - id: metadata/signed/platform/
      - id: well-known/dual-use/remote-admin/
