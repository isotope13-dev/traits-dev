# PowerShell workers compiled with Add-Type and driven over stdin/stdout are a
# common pipe stage for Node or batch parents. The protocol markers and combined
# GDI capture plus SendInput synthesis distinguish covert remote control from
# local admin utilities that only snapshot the desktop once.
defaults:
  platforms: [windows]
  for: [powershell]
  attack: T1219,T1113,T1056.002
  mbc: B0030

traits:
  - id: ps-stdio-ready-marker
    desc: Stdio desktop worker ready sentinel
    crit: suspicious
    conf: 0.95
    if:
      type: text
      substr: '__READY__'
  - id: ps-stdio-capture-command
    desc: Stdio JPEG desktop capture command
    crit: suspicious
    conf: 0.95
    if:
      type: text
      substr: '__CAPTURE__'
  - id: ps-stdin-readline-loop
    desc: Console stdin command loop
    crit: suspicious
    conf: 0.92
    if:
      type: text
      substr: '[Console]::In.ReadLine()'
  - id: ps-csharp-sendinput-import
    desc: C# SendInput P/Invoke declaration
    crit: notable
    conf: 0.9
    if:
      type: text
      substr: 'SendInput(uint n, IData[] inp'
  - id: ps-csharp-bitblt-import
    desc: C# GDI BitBlt P/Invoke declaration
    crit: notable
    conf: 0.9
    if:
      type: text
      substr: 'BitBlt(IntPtr dst,int xd,int yd'

composite_rules:
  - id: ps-csharp-gdi-capture-input-worker
    desc: Embedded BitBlt and SendInput worker
    crit: suspicious
    conf: 0.96
    near_lines: 800
    all:
      - id: ps-csharp-sendinput-import
      - id: ps-csharp-bitblt-import
  - id: ps-stdio-desktop-command-protocol
    desc: Stdio protocol drives capture and input
    crit: suspicious
    conf: 0.97
    near_lines: 800
    all:
      - id: ps-stdio-ready-marker
      - id: ps-stdin-readline-loop
      - id: ps-stdio-capture-command
  - id: powershell-stdio-remote-desktop-agent
    desc: Stdin PowerShell remote desktop worker
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/metaprogramming/generation::powershell-add-type
      - id: ps-stdio-desktop-command-protocol
      - id: ps-csharp-gdi-capture-input-worker
