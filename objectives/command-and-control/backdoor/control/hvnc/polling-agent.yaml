defaults:
  platforms: [windows]
  for: [pe]
  crit: notable

traits:
  - id: desktop-shell-created-status
    desc: Desktop shell creation message
    if:
      type: text
      substr: desktop created (explorer pid

  - id: desktop-stream-attach-status
    desc: Desktop streaming attachment message
    if:
      type: text
      regex: 'stream: attached to [a-z]{1,24} desktop'

composite_rules:
  - id: polling-agent-hidden-desktop-control
    desc: Polling shell agent includes alternate desktop streaming control
    crit: hostile
    conf: 0.98
    attack: T1219,T1564.003,T1113
    all:
      - id: objectives/command-and-control/remote-command/http-poll::native-polling-shell-agent
      - id: desktop-shell-created-status
      - id: desktop-stream-attach-status
      - id: micro-behaviors/ui/window/station::set-thread-desktop-import
      - id: micro-behaviors/hardware/display/screenshot/window::print-window-api
