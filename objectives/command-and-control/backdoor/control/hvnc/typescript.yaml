# Typed WebSocket remote-desktop commands (start session, enable mouse/keyboard).
# These commandType tokens are the operator-panel side of hidden-desktop control.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  attack: T1219
  mbc: B0025

traits:
  - id: command-type-desktop-start
    desc: Typed desktop_start control command
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: 'commandType:\s*["'']desktop_start["'']'

  - id: command-type-desktop-mouse
    desc: Typed desktop mouse-enable command
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: 'commandType:\s*["'']desktop_enable_mouse["'']'

  - id: command-type-desktop-keyboard
    desc: Typed desktop keyboard-enable command
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: 'commandType:\s*["'']desktop_enable_keyboard["'']'

composite_rules:
  - id: websocket-desktop-input-control
    desc: WebSocket remote-desktop input control
    crit: hostile
    conf: 0.98
    all:
      - id: command-type-desktop-start
      - id: micro-behaviors/communications/websocket/send::member-ws-send-call
    any:
      - id: command-type-desktop-mouse
      - id: command-type-desktop-keyboard
    near_bytes: 4096
