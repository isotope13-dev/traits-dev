# Hidden VNC from the JVM through JNA.
#
# 2026-09, a jar posing as the Fabric Minecraft mod "Aeon Descent": a JNA
# User32 interface declares CreateDesktop, OpenDesktop, SetThreadDesktop,
# EnumDesktopWindows and PrintWindow, a Gdi32 interface BitBlt and GetDIBits.
# That is the HVNC loop -- create an invisible desktop, move a thread onto it,
# render each window there into a bitmap and stream it -- with no native code
# of its own, so the PE-oriented HVNC rules in this directory never look at it.
#
# A desktop switcher creates desktops but does not screenshot windows on them;
# a screen recorder captures windows but never needs its own desktop.
defaults:
  platforms: [windows]
  attack: T1219,T1564.003,T1113
  mbc: B0025
composite_rules:
  - id: jvm-hidden-desktop-window-capture
    desc: JVM creates a hidden desktop and captures windows
    crit: hostile
    conf: 0.93
    for: [class, java_class, jar]
    scope: archive
    all:
      - id: micro-behaviors/ui/window/station::jvm-create-desktop-name
      - id: micro-behaviors/ui/window/station::jvm-set-thread-desktop-name
    any:
      - id: micro-behaviors/hardware/display/screen::jvm-print-window-name
      - id: micro-behaviors/hardware/display/screen::jvm-getdibits-name
