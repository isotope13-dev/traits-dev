defaults:
  platforms: [windows]
  for: [c, cpp, csharp]
  crit: notable
  conf: 0.94

traits:
  - id: source-console-window-lookup
    desc: Looks up the process console window
    if:
      type: symbol
      kind: call
      regex: '(^|[.:])GetConsoleWindow$'
  - id: source-hide-window-call
    desc: Requests a hidden native window
    if:
      type: text
      regex: '\bShowWindow\s*\([^,\r\n]{1,64},\s*(SW_HIDE|0)\s*\)'
  - id: source-hidden-vnc-start
    desc: Starts hidden VNC through a function call
    if:
      type: symbol
      kind: call
      regex: '(?i)(^|[.:])(Start_?(HVNC|Hidden_?VNC)|InitializeHVNC)$'

composite_rules:
  - id: hidden-console-vnc-agent-launch
    desc: Hides its console and starts a hidden VNC agent
    crit: hostile
    conf: 0.98
    attack: T1219,T1564.003
    all:
      - id: source-console-window-lookup
      - id: source-hide-window-call
      - id: source-hidden-vnc-start
