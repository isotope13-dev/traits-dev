# hVNC (Hidden Virtual Network Computing) browser injection detection.
# Detects the hVNC technique where browsers are launched in a hidden desktop
# context with injected DLLs for screen capture via DXGI.
# Used by Overlord RAT and other remote access tools.
defaults:
  platforms: [windows]
  for: [go, pe, dll, c, cpp]
  attack: T1219
  mbc: B0025
traits:
  - id: hvnc-inject-log-prefix
    desc: hVNC injection log message prefix
    crit: notable
    conf: 0.95
    if:
      type: text
      substr: 'hvnc inject:'
  - id: hvnc-browser-log-prefix
    desc: hVNC browser operation log prefix
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: 'hvnc \w+: '
  - id: hvnc-clone-prefix
    desc: hVNC browser profile clone directory prefix
    crit: notable
    conf: 0.9
    if:
      type: text
      word: 'hvnc_'
  - id: hvnc-browser-profile-clone
    desc: hVNC browser profile cloning message
    crit: notable
    conf: 0.9
    if:
      type: text
      substr: 'cloned profile'
  - id: hvnc-gpu-capture
    desc: hVNC GPU/DXGI capture reference
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: 'DXGI (capture|injection|active)'
  - id: hvnc-browser-sandbox-bypass
    desc: hVNC browser launch with sandbox bypass
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: --window-position=0,0.{0,40}--no-sandbox
  - id: go-hvnc-handler-routines
    desc: Go hVNC handler routines
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: '\bmain\.handleHVNC(Start|Stop|Keys|Mouse)\b'
  - id: go-hvnc-frame-token
    desc: Go hVNC frame protocol token
    crit: notable
    conf: 0.9
    if:
      type: text
      word: hvnc_frame
composite_rules:
  - id: hvnc-browser-injection
    desc: hVNC browser injection with reflective DLL loading
    crit: hostile
    conf: 0.95
    all:
      - id: hvnc-inject-log-prefix
    any:
      - id: hvnc-browser-profile-clone
      - id: hvnc-gpu-capture
      - id: hvnc-browser-sandbox-bypass
      - id: micro-behaviors/communications/ipc/file-mapping::hvnc-shared-memory-section
      - id: micro-behaviors/data/embedded/payload/rdi-env::rdi-env-var-cluster
    needs: 2

  - id: go-hvnc-remote-control
    desc: Go hidden desktop or hVNC remote control agent
    crit: hostile
    conf: 0.98
    for: [pe]
    all:
      - id: metadata/lang/compiler/systems::go-binary-comp
      - id: go-hvnc-handler-routines
    any:
      - id: go-hvnc-frame-token
      - id: micro-behaviors/hardware/input/mouse::mouse-event
      - id: micro-behaviors/hardware/input/keyboard/simulate::keybd-event
    unless:
      - id: metadata/signed/platform/
      - id: well-known/tool/reverse-engineering/
