# Hidden virtual browser: the victim's own logged-in browser, driven by a
# remote operator over the Chrome DevTools Protocol.
#
# The Windows-era HVNC modules in this directory build a hidden desktop and
# copy a browser profile onto it. The portable form drops the desktop entirely:
#
#   1. copy the live profile directory (Default/, Local State) somewhere else
#   2. relaunch the browser's OWN executable against the copy, headless or
#      off-screen, with --remote-debugging-port
#   3. bridge that debug socket to the operator
#   4. Page.startScreencast for the picture, Input.dispatch*Event for the
#      keyboard and mouse
#
# The operator ends up inside sessions the victim is already authenticated to —
# webmail, banking, cloud consoles — while the victim's visible browser is
# untouched, so nothing looks wrong on screen. Because the browser's own signed
# binary does the decrypting, the cookies come back in cleartext and no
# os_crypt key is ever needed.
#
# Discriminating from legitimate CDP automation:
#
# * Automation (puppeteer, playwright, scrapers, print-to-PDF) drives a browser
#   it created, on a throwaway profile. It does not need a screencast, because
#   the caller *is* the thing deciding what to click.
# * Remote-browser-isolation and cloud-browser products DO screencast and DO
#   inject input — but into a fresh container profile, never into a copy of an
#   end user's on-disk profile directory.
#
# So the live-profile reference is what turns remote control into session
# theft, and it is the leg both hostile rules require.
#
# ATT&CK: T1185 (Browser Session Hijacking), T1555.003, T1219.
defaults:
  platforms: [windows, unix, macos, linux]
  for: [scripts, source]
  attack: T1185
  mbc: B0025

composite_rules:
  - id: cdp-live-browser-remote-control
    desc: Browser driven live over CDP
    # Screencast plus synthetic input is the shape of interactive remote
    # control rather than scripted automation. Legitimate agents and
    # remote-browser-isolation products land here, which is why this stays
    # notable and the profile-hijack rules below carry the hostile verdict.
    crit: notable
    conf: 0.94
    attack: T1185,T1219
    all:
      - id: micro-behaviors/communications/http/devtools/client::cdp-method-page-start-screencast
      - id: micro-behaviors/communications/http/devtools/client::cdp-input-event-injection
    unless:
      # InspectorBackendCommands.js is a generated CDP registry: it lists
      # command schemas but does not drive a browser.  Keep the composite
      # anchored to executable protocol-client source.
      - id: metadata/lang/source::codegen-source-path
      # Hash-named Deno/npm cache copies of protocol-dts-generator output
      # keep the "Auto-generated…" banner but lose the codegen path segment.
      - id: metadata/lang/source::automatically-generated-source-marker
      # TypeScript declaration files likewise describe the CDP surface but
      # contain no executable client.  This covers generated protocol.d.ts
      # files, including Playwright's Chromium protocol declarations.
      - id: metadata/lang/scripted::dts-declaration-file
      # Playwright's bundled client implements this exact protocol surface for
      # ordinary browser automation; keep the live-profile rules below intact.
      - id: objectives/execution/exploit/debug-interface::puppeteer-playwright-marker
      - id: well-known/lib/platform/browser-automation::puppeteer-library-present
      - id: well-known/app/ai/damocles::damocles-cdp-browser-context
      - id: well-known/app/ai/cline::cline-cdp-browser-context
      - id: well-known/app/development/inspect::inspect-devtools-cdp-adapter-context

  - id: cdp-hijacked-profile-browser-control
    desc: Hijacked browser profile driven over CDP
    crit: hostile
    conf: 0.97
    attack: T1185,T1555.003
    all:
      - id: cdp-live-browser-remote-control
      # The debug channel is opened by the caller's own launch, pointed at a
      # profile directory the caller chose...
      - id: micro-behaviors/process/create/flags::chromium-remote-debugging-port
      - id: micro-behaviors/process/create/flags::chromium-user-data-dir
      # ...and that profile is the user's real installed-browser profile, not
      # a throwaway. Extension names, web-bundle suffixes, and other unrelated
      # browser-path artifacts do not satisfy this condition.
      - id: micro-behaviors/fs/path/application/browser::chromium-profile-directory-path

  - id: cdp-origin-check-disabled-profile-hijack
    desc: Debug-socket origin check disabled on a real profile
    # A third route to the same outcome, and the one that survives when the
    # module neither screencasts nor dumps the whole jar.
    #
    # Chrome 111 added an Origin check on the debug WebSocket for exactly this
    # attack: local code attaching to a browser it did not start.
    # --remote-allow-origins=* turns the check off. An automation framework
    # never needs it — puppeteer and playwright launch the browser themselves
    # and connect from the launching process, which passes the check — so the
    # flag is set precisely when something *else* is meant to attach.
    #
    # Pointing that unguarded socket at the user's real installed-browser
    # profile rather than a throwaway is what makes it session theft: the
    # attaching party inherits every login the victim holds.
    crit: hostile
    conf: 0.95
    attack: T1185,T1539,T1555.003
    all:
      - id: micro-behaviors/process/create/flags::chromium-remote-allow-origins-flag
      - id: micro-behaviors/process/create/flags::chromium-remote-debugging-port
      # Tie the unguarded debug socket to an explicitly selected profile. A
      # browser path elsewhere in the artifact is not enough to prove that the
      # debug instance was launched against that profile.
      - id: micro-behaviors/process/create/flags::chromium-user-data-dir
      - id: micro-behaviors/fs/path/application/browser::chromium-profile-directory-path

  - id: cdp-hijacked-profile-cookie-export
    desc: Cookie jar dumped from a copied profile
    # The same hidden instance also dumps the jar, decrypted by the browser
    # itself. Reported separately from the control rule so a module that only
    # exfiltrates sessions — no screencast, no synthetic input — is still
    # convicted. Network.getAllCookies and Storage.getCookies take no URL
    # filter: unlike Network.getCookies they cannot be a scoped read for the
    # page the caller is already driving.
    crit: hostile
    conf: 0.96
    attack: T1185,T1539,T1555.003
    all:
      - id: micro-behaviors/process/create/flags::chromium-remote-debugging-port
      - id: micro-behaviors/process/create/flags::chromium-user-data-dir
      - id: micro-behaviors/fs/path/application/browser::chromium-profile-directory-path
    any:
      - id: micro-behaviors/communications/http/devtools/client::cdp-method-network-get-all-cookies
      - id: micro-behaviors/communications/http/devtools/client::cdp-method-storage-get-cookies
    unless:
      # Puppeteer protocol tables plus Chrome install-path discovery co-occur
      # in Agentforce/Cline browser tooling that uses a throwaway mkdtemp
      # profile, not the user's installed Chrome User Data directory.
      - id: well-known/app/development/vscode-extension/salesforcedx-einstein-gpt/

  - id: cdp-hijacked-profile-native-control
    desc: Native implant drives a hijacked browser profile over CDP
    crit: hostile
    conf: 0.97
    attack: T1185,T1555.003,T1219
    for: [elf, macho, pe, dll]
    all:
      - id: micro-behaviors/communications/http/devtools/client::cdp-screencast-input-native-cluster
      - id: micro-behaviors/process/create/flags::chromium-cdp-profile-launch-native-cluster
      - id: micro-behaviors/fs/path/application/browser::chromium-profile-directory-path
    unless:
      # Chromium itself implements the CDP server and embeds its method table;
      # this rule is for a separate native controller carrying launch/profile
      # material, not the genuine browser binary.
      - id: well-known/app/browser/

  - id: cdp-hijacked-profile-native-cookie-export
    desc: Native implant exports cookies from a hijacked browser profile
    crit: hostile
    conf: 0.97
    attack: T1185,T1539,T1555.003
    for: [elf, macho, pe, dll]
    all:
      - id: micro-behaviors/communications/http/devtools/client::cdp-cookie-control-native-cluster
      - id: micro-behaviors/process/create/flags::chromium-cdp-profile-launch-native-cluster
      - id: micro-behaviors/fs/path/application/browser::chromium-profile-directory-path
    unless:
      - id: well-known/app/browser/
