# Hidden VNC (HVNC) implant for Windows.
# Creates and controls an alternate/hidden desktop session and captures window bitmaps
# without user interaction on the active desktop.
defaults:
  platforms: [windows]
  for: [pe, dll]
  attack: T1219,T1564.003,T1113
  mbc: B0025

composite_rules:
  - id: windows-hvnc-server-implant
    desc: Native Windows Hidden VNC server implant
    crit: hostile
    conf: 0.98
    all:
      - id: metadata/binary/symbols/exports::vnc-server-export-pair
    any:
      - id: micro-behaviors/ui/window/station::alternate-desktop-control
      - id: micro-behaviors/ui/window/station::create-desktop-a
      - id: micro-behaviors/ui/window/station::set-thread-desktop-import
      - id: objectives/evasion/process/hidden/window::alternate-desktop-window-control
      - id: objectives/collection/screenshot::printwindow-window-capture

  - id: alternate-desktop-printwindow-network-hvnc
    desc: Alternate desktop PrintWindow capture and remote input HVNC
    crit: hostile
    conf: 0.96
    all:
      - id: micro-behaviors/ui/window/station::set-thread-desktop-import
      - id: objectives/collection/screenshot::printwindow-window-capture
      - id: micro-behaviors/hardware/input/keyboard/simulate::keybd-event
      - id: micro-behaviors/hardware/input/mouse::mouse-event
    any:
      - id: micro-behaviors/ui/window/station::create-desktop-a
      - id: micro-behaviors/ui/window/station::open-desktop-a
      - id: micro-behaviors/ui/window/station::open-desktop-import
