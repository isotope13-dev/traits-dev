defaults:
  for: [pyc]
  platforms: [windows, unix]
  attack: T1059,T1125,T1123

traits:
  - id: pyc-camera-command
    desc: Bytecode names a camera command
    crit: component
    if:
      type: symbol
      kind: identifier
      exact: camera_command
  - id: pyc-mic-command
    desc: Bytecode names a microphone command
    crit: component
    if:
      type: symbol
      kind: identifier
      exact: mic_command
  - id: pyc-cmd-command
    desc: Bytecode names a command execution handler
    crit: component
    if:
      type: symbol
      kind: identifier
      exact: cmd_command
  - id: pyc-reply-photo
    desc: Bytecode references a photo reply
    crit: notable
    if:
      type: symbol
      kind: identifier
      exact: reply_photo
  - id: pyc-reply-voice
    desc: Bytecode references a voice reply
    crit: notable
    if:
      type: symbol
      kind: identifier
      exact: reply_voice
  - id: pyc-video-capture
    desc: Bytecode references video capture
    crit: component
    if:
      type: symbol
      kind: identifier
      exact: VideoCapture
  - id: pyc-audio-input
    desc: Bytecode references audio input
    crit: component
    if:
      type: symbol
      kind: identifier
      exact: InputStream
  - id: pyc-subprocess
    desc: Bytecode references subprocess
    crit: component
    if:
      type: symbol
      kind: identifier
      exact: subprocess

composite_rules:
  - id: pyc-camera-audio-shell-bot
    desc: Bytecode combines remote camera, audio and shell commands
    crit: hostile
    conf: 0.98
    all:
      - id: pyc-camera-command
      - id: pyc-mic-command
      - id: pyc-cmd-command
      - id: pyc-reply-photo
      - id: pyc-reply-voice
      - id: pyc-video-capture
      - id: pyc-audio-input
      - id: pyc-subprocess
