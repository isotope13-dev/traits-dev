# Native Windows PE agents that receive commands polled from Telegram Bot API.
defaults:
  platforms: [windows]
  for: [pe]
  attack: T1102.002,T1059.003
  mbc: B0022,B0030

composite_rules:
  - id: telegram-native-bot-remote-control
    desc: Native Windows agent executes commands polled from Telegram Bot API
    crit: hostile
    conf: 0.99
    all:
      - id: micro-behaviors/communications/http/services/telegram::telegram-bot-chat-id-field
      - id: micro-behaviors/communications/http/services/telegram::telegram-bot-update-id-field
      - id: micro-behaviors/communications/http/client/winhttp::winhttp-request-response-flow
      - id: micro-behaviors/process/create/exec::create-process-a
    any:
      - id: micro-behaviors/communications/ipc/pipe::create-pipe
      - id: micro-behaviors/communications/http/upload::multipart-form-data-upload
      - id: micro-behaviors/process/terminate/kill::toolhelp-termination-api-profile
    unless:
      - id: metadata/signed/platform/
