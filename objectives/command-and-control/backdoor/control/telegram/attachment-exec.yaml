# Telegram Bot API pull channels that turn operator-supplied documents into
# local processes. The endpoint paths are stable protocol structure; bot
# tokens, chat IDs, filenames, staging directories, and command words are not
# part of the match. Requiring update polling, file resolution, a repeating
# task loop, file transfer, and process creation distinguishes this backdoor
# behavior from notification bots and file archivers.
defaults:
  platforms: [unix, windows]
  for: [binaries, scripts, source]
  attack: T1102.002,T1105,T1059
  mbc: B0022,B0030

composite_rules:
  - id: telegram-repeating-file-task-poll
    desc: Telegram file retrieval runs in a repeating loop
    crit: component
    conf: 0.97
    for: [binaries, scripts, source, python, powershell]
    near_bytes: 16384
    all:
      - id: micro-behaviors/communications/http/services/telegram::telegram-bot-api-polled-file-retrieval
    any:
      - id: micro-behaviors/data/control-flow/analysis::while-loop
      - id: micro-behaviors/data/control-flow/loop::infinite-loop-header
      - id: micro-behaviors/data/control-flow/loop::embedded-powershell-while-true

  - id: telegram-file-download-response
    desc: Telegram file task acquires a downloaded file
    crit: component
    conf: 0.97
    for: [binaries, scripts, source, python, powershell]
    any:
      - id: micro-behaviors/communications/http/client/response-body::requests-response-body-access
      - id: micro-behaviors/communications/http/download/cli::iwr-outfile-download
      - id: micro-behaviors/communications/http/download/cli::iwr-outfile-call

  - id: telegram-polled-attachment-execution
    desc: Telegram-polled attachment is executed locally
    crit: hostile
    conf: 0.99
    for: [binaries, scripts, source, python, powershell]
    near_bytes: 16384
    all:
      - id: telegram-repeating-file-task-poll
      - id: telegram-file-download-response
    any:
      - id: micro-behaviors/process/create/exec::child-process-execution
      # `child-process-execution` does not yet include Python's direct
      # subprocess.Popen call atom, which is also a clear process launch.
      - id: micro-behaviors/process/create/subprocess::popen-ast
