defaults:
  platforms: [unix, windows]
  for: [python, whl]
  attack: T1059.006,T1102

traits:
  - id: python-telegram-message-to-agent-job
    desc: Telegram message queues an agent job
    crit: notable
    conf: 0.97
    for: [python]
    if:
      type: text
      regex: 'def\s+handle_message_text\s*\([^)]{0,120}\)[\s\S]{0,700}\.jobs\.put\s*\(\s*BridgeJob'
  - id: python-telegram-input-queue
    desc: Telegram input enters agent queue
    crit: notable
    conf: 0.97
    for: [python]
    if:
      type: text
      regex: 'input_queue\.put\(\s*\{\s*["'']source["'']\s*:\s*["'']telegram["'']'

composite_rules:
  - id: python-telegram-agent-remote-control
    desc: Telegram remote agent control
    crit: hostile
    conf: 0.995
    scope: archive
    all:
      - id: micro-behaviors/communications/http/services/telegram::telegram-api-host
      - id: micro-behaviors/communications/http/services/telegram::python-telegram-get-updates
      - id: micro-behaviors/process/create/shell-subprocess::variable-command-shell-true
    any:
      - id: python-telegram-message-to-agent-job
      - id: python-telegram-input-queue
    unless:
      # The bot runs on a token the local user supplied through their own
      # profile/settings: a self-hosted personal assistant, not an
      # attacker-provisioned channel. Attacker C2 hardcodes or fetches the
      # token instead.
      - id: micro-behaviors/communications/http/services/telegram::user-configured-telegram-bot-context
