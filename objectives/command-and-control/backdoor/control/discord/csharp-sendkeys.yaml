defaults:
  for: [csharp]
  platforms: [windows]
  attack: T1059,T1102

traits:
  - id: csharp-discord-command-sends-keys
    desc: Discord command types supplied keystrokes
    crit: hostile
    conf: 0.97
    if:
      type: tree-sitter
      query: |
        ((class_declaration
          (base_list (generic_name (identifier) @base (type_argument_list (identifier) @context)))
          body: (declaration_list (method_declaration
            (attribute_list (attribute name: (identifier) @command))
            parameters: (parameter_list (parameter name: (identifier) @input))
            body: (block (expression_statement (invocation_expression
              function: (member_access_expression expression: (identifier) @keys name: (identifier) @send)
              arguments: (argument_list (argument (identifier) @used))))))))
        (#eq? @base "ModuleBase")
        (#eq? @context "SocketCommandContext")
        (#eq? @command "Command")
        (#eq? @keys "SendKeys")
        (#eq? @send "SendWait")
        (#eq? @input @used)
        )
