# Discord bots that silently add an operator account and expose token control
# are backdoor control flows, not browser-token harvesting.
#
# The list operations below (`adminIds.push` / `adminIds.includes`) are
# neutral JavaScript: the same roster logic manages WhatsApp group admins,
# Telegram operators, or Discord staff. They live as notable atoms under
# micro-behaviors/data/collection/array and carry no platform claim, so a
# bare admin roster can never convict here. The Discord verdict comes from
# the `any:` context legs (a discord.js import or a Discord API call) that
# every composite below requires alongside the roster evidence.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  attack: T1098,T1528

composite_rules:
  - id: discord-hardcoded-admin-id-injection
    desc: Adds hardcoded ID to Discord admins
    crit: suspicious
    conf: 0.98
    all:
      - id: micro-behaviors/data/collection/array::admin-id-list-membership
      - id: micro-behaviors/data/collection/array::admin-id-list-append
      - id: micro-behaviors/data/format/string::long-numeric-id-literal
    any:
      - id: metadata/import/package::discord-js-import
      - id: micro-behaviors/communications/http/services/discord::api-url
  - id: discord-hardcoded-admin-token-control
    desc: Hardcoded Discord admin gains token refresh control
    crit: hostile
    conf: 0.99
    all:
      - id: discord-hardcoded-admin-id-injection
      - id: micro-behaviors/communications/http/token-auth::access-refresh-token-pair
      - id: micro-behaviors/communications/http/post::axios-post-call
    any:
      - id: metadata/import/package::discord-js-import
      - id: micro-behaviors/communications/http/services/discord::api-url
