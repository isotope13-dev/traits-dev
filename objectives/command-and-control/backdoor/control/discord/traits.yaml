# Discord bots that silently add an operator account and expose token control
# are backdoor control flows, not browser-token harvesting.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  attack: T1098,T1528

traits:
  - id: discord-admin-list-membership
    desc: Discord admin list membership check
    crit: suspicious
    conf: 0.9
    if:
      type: text
      regex: '(?i)\badminIds\s*\.\s*includes\s*\('
  - id: discord-admin-list-append
    desc: Discord admin list append
    crit: suspicious
    conf: 0.9
    if:
      type: text
      regex: '(?i)\badminIds\s*\.\s*push\s*\('
  - id: discord-account-id-literal
    desc: Hardcoded Discord account ID
    crit: component
    conf: 0.88
    if:
      type: text
      regex: '[''"][0-9]{17,20}[''"]'

composite_rules:
  - id: discord-hardcoded-admin-id-injection
    desc: Adds hardcoded ID to Discord admins
    crit: suspicious
    conf: 0.98
    all:
      - id: discord-admin-list-membership
      - id: discord-admin-list-append
      - id: discord-account-id-literal
    near_bytes: 320
  - id: discord-hardcoded-admin-token-control
    desc: Hardcoded Discord admin gains token refresh control
    crit: hostile
    conf: 0.99
    all:
      - id: discord-hardcoded-admin-id-injection
      - id: micro-behaviors/communications/http/token-auth::access-refresh-token-pair
      - id: micro-behaviors/communications/http/post::axios-post-source
    near_lines: 220
