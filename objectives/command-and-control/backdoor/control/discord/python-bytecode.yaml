defaults:
  platforms: [windows, unix]
  for: [pyc]
  crit: hostile
  conf: 0.97
  attack: T1059.006,T1102
composite_rules:
  - id: pyc-discord-keylogger-shell-agent
    desc: Discord keystroke-delivery agent also describes shell command execution
    all:
      - id: objectives/exfiltration/stealer/multi-item::pyc-discord-buffered-keystroke-exfiltration
      - id: metadata/lang/natural/diagnostic::pyc-shell-command-description
  - id: pyc-discord-rat-command-executor
    desc: Discord bot executes shell or detached processes
    all:
      - id: micro-behaviors/communications/http/services/discord::python-bot-framework-import
    any:
      - id: metadata/binary/code/bytecode::subprocess-shell-pyc
      - id: micro-behaviors/process/daemonize/detach::pyc-detached-process-flag
