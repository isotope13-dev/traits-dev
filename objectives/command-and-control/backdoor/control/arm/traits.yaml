defaults:
  platforms: [linux]
  for: [elf]
  arch: [arm]
  attack: T1095,T1071.004

composite_rules:
  - id: static-arm-custom-command-channel
    desc: Static ARM implant implements a custom socket command channel
    crit: hostile
    conf: 0.99
    all:
      - id: micro-behaviors/communications/socket/framing::redkill-client-marker
      - id: "metadata/binary/linking/dynamic::elf-needed-libs-zero"
      - id: micro-behaviors/communications/socket/syscall::arm-literal-pool-network-syscalls
      - id: micro-behaviors/communications/socket/syscall::arm-literal-pool-network-io-syscalls
      - id: micro-behaviors/communications/ip/literal::external-ipv4-host-literal-binary
