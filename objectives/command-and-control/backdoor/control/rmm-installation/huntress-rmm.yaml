defaults:
  for: [powershell]
  platforms: [windows]
  conf: 0.99
  attack: T1543.003,T1219
traits:
  - id: screenconnect-service-image-argument
    ref: https://www.huntress.com/blog/rmm-alerts-msp-soc-incident-response
    desc: ScreenConnect service image argument
    crit: component
    if:
      type: text
      regex: '(?i)-BinaryPathName\s+["''][^\r\n]{0,100}ScreenConnect\.ClientService\.exe\b'
      exclude_comments: true
composite_rules:
  - id: screenconnect-reported-malicious-relay-service
    ref: https://www.huntress.com/blog/rmm-alerts-msp-soc-incident-response
    desc: Installs ScreenConnect service configured for a reported malicious relay
    crit: hostile
    near_lines: 1
    all:
      - id: micro-behaviors/os/service/create::powershell-new-service-command
      - id: screenconnect-service-image-argument
    any:
      - id: objectives/command-and-control/infrastructure/domain/known::truexx-freeddns-screenconnect-relay
      - id: objectives/command-and-control/infrastructure/ip::huntress-rmm-relay-host-75-119-149-164
