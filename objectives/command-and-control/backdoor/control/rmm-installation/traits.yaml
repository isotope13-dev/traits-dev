# A customized relay alone can be legitimate administration. An installer
# that grants unattended Access/Guest sessions, installs the service, and
# suppresses local control indicators configures concealed third-party access.
defaults:
  platforms: [windows]
  # The install role and relay may come from the MSI, while service identity
  # and application settings are recovered from CAB members.
  for: [msi, oledoc, pe, dll, xml, cab]
  attack: T1219,T1071.001,T1564

composite_rules:
  - id: screenconnect-covert-external-relay-install
    desc: ScreenConnect installer configures concealed unattended relay access
    crit: hostile
    conf: 0.99
    scope: outer
    all:
      - id: well-known/dual-use/remote-admin/screenconnect::msi-screenconnect-nonvendor-domain-relay
      - id: well-known/dual-use/remote-admin/screenconnect::msi-unattended-access-launch-parameter
      - id: well-known/dual-use/remote-admin/screenconnect::msi-screenconnect-service-persistence
      - id: objectives/evasion/process/concealment::screenconnect-configured-indicators-off
