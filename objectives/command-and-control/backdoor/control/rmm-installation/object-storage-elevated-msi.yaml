# A script that elevates itself, pulls a remote-access agent MSI from generic
# cloud object storage rather than the vendor or the operator's own instance,
# installs it with no UI and deletes the installer. Each step has admin uses;
# together they give an unseen party persistent remote control. The relay
# and access settings live inside the MSI, not in the script, so the
# script alone cannot show whose instance it joins.
defaults:
  platforms: [windows]
  for: [batch, powershell]
  attack: T1219,T1105,T1218.007,T1548.002

composite_rules:
  - id: elevated-silent-rmm-msi-from-object-storage
    desc: Elevated silent RMM install from object storage
    crit: suspicious
    conf: 0.93
    all:
      - id: objectives/command-and-control/backdoor/control/rmm::remote-access-agent-reference
      - id: micro-behaviors/communications/url/reference::object-storage-endpoint
      - id: micro-behaviors/communications/url/resource-path/file::remote-msi-package-url
      - id: micro-behaviors/os/package-manager/config::msiexec-quiet-switch
    any:
      - id: micro-behaviors/os/privilege/elevation::powershell-start-process-runas
      - id: micro-behaviors/process/config/launch::runas-verb
      - id: micro-behaviors/os/privilege/check::net-session-admin-check-raw
