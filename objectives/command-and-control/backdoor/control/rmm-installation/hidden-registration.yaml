# Hiding a deployed package from inventory can be deliberate administration;
# report concealment without claiming that the package is malware.
defaults:
  platforms: [windows]
  for: [batch, powershell]
  attack: T1564
composite_rules:
  - id: silent-msi-hidden-app-entry
    desc: Quiet RMM with app-entry hiding property
    crit: suspicious
    conf: 0.98
    all:
      - id: objectives/command-and-control/backdoor/control/rmm::remote-access-agent-reference
      - id: micro-behaviors/os/package-manager/management::quiet-msiexec-hidden-registration
