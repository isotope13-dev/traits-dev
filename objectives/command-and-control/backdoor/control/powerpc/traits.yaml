defaults:
  platforms: [linux]
  for: [elf]
  arch: [powerpc]
  attack: T1095,T1071.004

composite_rules:
  - id: static-ppc-redkill-command-channel
    desc: Static PowerPC RedKill implant implements a socket command channel
    crit: hostile
    conf: 0.99
    all:
      - id: micro-behaviors/communications/socket/framing::redkill-client-marker
      - id: metadata/binary/linking/static::elf-needed-libs-zero
      - id: micro-behaviors/communications/socket/syscall::ppc-socketcall-network-io
      - id: micro-behaviors/communications/ip/literal::external-ipv4-host-literal-binary
