# RPC time-service implants advertise a backdoor banner and a dead-hour
# host-time check instead of returning a real clock.
defaults:
  platforms: [unix]
  for: [elf]
  attack: T1219
  mbc: B0024

traits:
  - id: rpc-time-backdoor-banner
    desc: RPC time backdoor self-label
    crit: suspicious
    conf: 0.98
    if:
      type: text
      regex: '(?i)RPC TIME BACKDOOR'
  - id: deadhour-host-time
    desc: Host-time dead-hour implant marker
    crit: notable
    conf: 0.96
    if:
      type: text
      substr: DEADH0UR
  - id: survive-taunt-banner
    desc: I-will-survive implant taunt
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)I will SuRvIvE'

composite_rules:
  - id: rpc-time-deadhour-backdoor
    desc: RPC time backdoor with dead-hour
    crit: hostile
    conf: 0.98
    all:
      - id: rpc-time-backdoor-banner
      - id: deadhour-host-time
  - id: rpc-time-survive-backdoor
    desc: RPC time backdoor with survive taunt
    crit: hostile
    conf: 0.96
    all:
      - id: rpc-time-backdoor-banner
      - id: survive-taunt-banner
  - id: deadhour-survive-backdoor
    desc: Dead-hour marker with survive taunt
    crit: hostile
    conf: 0.95
    all:
      - id: deadhour-host-time
      - id: survive-taunt-banner
