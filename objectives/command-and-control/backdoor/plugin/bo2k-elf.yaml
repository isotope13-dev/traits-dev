# Back Orifice 2000-style Linux plugins live under a dedicated lib
# directory and announce plugin load, then expose a connect-host-port
# client.
defaults:
  platforms: [unix]
  for: [elf]
  attack: T1219
  mbc: B0024

traits:
  - id: bo2k-lib-path
    desc: BO2K plugin library directory
    crit: notable
    conf: 0.97
    if:
      type: text
      substr: /usr/lib/bo2k/
  - id: plugin-loaded-banner
    desc: Plugin successfully loaded banner
    crit: notable
    conf: 0.9
    if:
      type: text
      substr: Plugin successfully loaded
  - id: connect-host-port-usage
    desc: Usage is connect host port
    crit: notable
    conf: 0.92
    if:
      type: text
      substr: 'Usage: connect host port'

composite_rules:
  - id: bo2k-plugin-loaded
    desc: BO2K path with plugin-loaded banner
    crit: hostile
    conf: 0.97
    all:
      - id: bo2k-lib-path
      - id: plugin-loaded-banner
  - id: bo2k-connect-usage
    desc: BO2K path with connect-host usage
    crit: hostile
    conf: 0.96
    all:
      - id: bo2k-lib-path
      - id: connect-host-port-usage
  - id: plugin-loaded-connect-usage
    desc: Plugin-loaded banner with connect usage
    crit: hostile
    conf: 0.94
    all:
      - id: plugin-loaded-banner
      - id: connect-host-port-usage
