defaults:
  platforms: [windows]
  for: [csharp]
  crit: notable
  conf: 0.94

traits:
  - id: client-starts-anti-analysis
    desc: Client invokes an anti-analysis routine
    if:
      type: symbol
      kind: call
      regex: '(^|\.)RunAntiAnalysis$'
  - id: client-installs-autorun
    desc: Client calls its autorun installer
    if:
      type: symbol
      kind: call
      regex: '(^|\.)(NormalStartup|StartupPersistence|Autorun)\.Install$'
  - id: client-requests-critical-process
    desc: Client enables critical process protection
    if:
      type: symbol
      kind: call
      regex: '(^|\.)(ProcessCritical\.Set|SetProcessCritical)$'
  - id: client-unbounded-reconnection-loop
    desc: Client retries its connection indefinitely
    if:
      type: text
      regex: '\b(while\s*\(\s*true\s*\)|for\s*\(\s*;\s*;\s*\))[\s\S]{0,350}\.Reconnect\s*\('

composite_rules:
  - id: anti-analysis-persistent-critical-reconnecting-client
    desc: Reconnecting client combines anti-analysis, autorun, and process protection
    crit: hostile
    conf: 0.98
    attack: T1497,T1547
    all:
      - id: client-starts-anti-analysis
      - id: client-installs-autorun
      - id: client-requests-critical-process
      - id: client-unbounded-reconnection-loop
