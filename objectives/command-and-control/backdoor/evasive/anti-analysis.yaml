defaults:
  crit: hostile
  platforms: [unix, windows, macos]
# Generic backdoor patterns
composite_rules:
  # System profiling backdoor with fake user agent
  - id: system-profiling-backdoor
    desc: Backdoor with old browser UA spoofing and system fingerprinting
    conf: 0.95
    attack: "T1071.001"
    for: [macho]
    platforms: [macos]
    all:
      - id: objectives/evasion/masquerade/identity/user-agent::user-agent-msie8
      - id: micro-behaviors/fs/path/temp::tmp-hidden-file
      - id: micro-behaviors/os/sysinfo/profile::macos-hardware-version-query-set
  # System profiling backdoor with specific IE8 user agent
  - id: system-profiling-backdoor-ie8
    desc: Backdoor with MSIE 8.0 UA spoofing and macOS system enumeration
    conf: 1.0
    attack: "T1071.001"
    for: [macho]
    platforms: [macos]
    all:
      - id: objectives/evasion/masquerade/identity/user-agent::user-agent-msie8
      - id: micro-behaviors/fs/path/temp::tmp-hidden-file
      - id: objectives/discovery/system/install::install-log-grep
      - id: micro-behaviors/os/sysinfo/hardware::sysctl-hw-model-key
      - id: micro-behaviors/os/sysinfo/cpu::sysctl-cpu-brand-string
      - id: micro-behaviors/os/sysinfo/config::sw-vers-product-version
  - id: covert-proc-inspection-backdoor
    platforms: [linux, macos, unix, windows]
    crit: suspicious
    desc: Covert C2 process-inspection backdoor
    conf: 0.96
    attack: "T1071,T1057"
    mbc: "B0030,E1057"
    all:
      - id: well-known/lib/native/uclibc::static-uclibc-string-tables
      - id: micro-behaviors/fs/proc/memory::process-maps-cmdline-fragment-cluster
