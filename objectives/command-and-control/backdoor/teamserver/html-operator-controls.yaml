# Operator pages that expose tasking and transport controls for connected
# clients. Individual controls are notable; the combination indicates a C2 UI.
defaults:
  platforms: [unix, windows]
  for: [html]
  attack: T1071.001

traits:
  - id: client-command-form
    desc: Form sends commands to selected client
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: >-
        (?is)<form\b.{0,850}name=["']client_id["'].{0,850}name=["']command["']

  - id: client-shellcode-form
    desc: Form submits shellcode to client
    crit: notable
    conf: 0.92
    if:
      type: text
      regex: >-
        (?is)<form\b.{0,850}client_id.{0,850}shellcode.{0,850}Run Shellcode

  - id: client-file-transfer-form
    desc: Form transfers files through client
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: >-
        (?is)<form\b.{0,900}client_id.{0,900}<input.{0,80}type=["']file["']

composite_rules:
  - id: multi-capability-client-operator-panel
    desc: Panel combines client tasking and payload controls
    crit: suspicious
    conf: 0.94
    near_bytes: 10000
    all:
      - id: client-command-form
      - id: client-shellcode-form
    any:
      - id: client-file-transfer-form
      - id: micro-behaviors/ui/controls/input::port-forwarding-form
