defaults:
  platforms: [unix, windows]
  for: [php]

traits:
  - id: bot-linked-report-insertion
    desc: Links stored reports to bots
    crit: notable
    conf: 0.96
    if:
      type: text
      substr: AddReportToBot
  - id: credential-report-module-loader
    desc: Loads credential report parser modules
    crit: notable
    conf: 0.95
    if:
      type: text
      substr: /class/pass_module/
  - id: wallet-report-storage
    desc: Stores wallets from reports
    crit: notable
    conf: 0.95
    if:
      type: text
      substr: InsertWallet
  - id: host-report-storage
    desc: Stores bot host reports
    crit: notable
    conf: 0.95
    if:
      type: text
      substr: InsertReport

composite_rules:
  - id: bot-credential-report-backend
    desc: Bot panel stores host and credential reports
    crit: hostile
    conf: 0.98
    attack: T1583.001,T1552.001
    all:
      - id: bot-linked-report-insertion
      - id: credential-report-module-loader
      - id: wallet-report-storage
      - id: host-report-storage
