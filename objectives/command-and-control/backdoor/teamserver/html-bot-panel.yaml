# Web templates of a botnet or RAT controller: a table of connected bots, a
# toggle that starts and stops the listener, and a console with Command and
# SSH tabs. Controller UIs for red-team and remote-admin tools look the
# same, so the pairings stay suspicious.
defaults:
  platforms: [unix, windows]
  for: [html]
  attack: T1071.001

traits:
  - id: bot-specific-attack-control
    desc: Attack button targets a bot identifier
    crit: suspicious
    conf: 0.95
    if:
      type: text
      regex: '(?is)bot_(uid|id)=\w+\.(uid|id)[^>]{0,100}>\s*<button[^>]{0,60}>Attack<'

  - id: bots-table-element
    desc: Panel has a bots table or counter
    crit: notable
    conf: 0.85
    if:
      type: text
      regex: '(?i)id="bots-(display|count)"'

  - id: listener-ip-port-toggle
    desc: Panel toggles a server listener
    crit: notable
    conf: 0.85
    if:
      type: text
      regex: '(?is)id="server-ip".{0,200}id="server-port".{0,400}server-active-toggle'

  - id: command-ssh-console-tabs
    desc: Panel has Command and SSH console tabs
    crit: notable
    conf: 0.85
    if:
      type: text
      regex: '(?is)id="command".{0,160}Command.{0,300}id="ssh".{0,160}SSH'

composite_rules:
  - id: bot-listener-control-panel
    desc: Template lists bots and toggles a listener
    crit: suspicious
    conf: 0.92
    near_bytes: 6000
    all:
      - id: bots-table-element
      - id: listener-ip-port-toggle
