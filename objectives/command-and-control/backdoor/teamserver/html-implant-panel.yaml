# Web templates of a C2 team server: pages that list generated implants and
# show how each one is configured. The vocabulary is the evidence -- a
# callback URL, a kill date and an obfuscation level on one implant record,
# or a prompt to weaponize stagers when no implant is active. Red-team C2
# frameworks are dual-use, so these stay suspicious.
defaults:
  platforms: [unix, windows]
  for: [html]
  attack: T1071.001

traits:
  - id: implant-kill-date-label
    desc: Implant record shows a kill date
    crit: notable
    conf: 0.85
    if:
      type: text
      regex: '(?i)>\s*Kill date\s*</'

  - id: implant-callback-url-label
    desc: Implant record shows a callback URL
    crit: notable
    conf: 0.85
    if:
      type: text
      regex: '(?i)>\s*Callback URL\s*</'

  - id: implant-obfuscation-level-label
    desc: Implant record shows an obfuscation level
    crit: notable
    conf: 0.85
    if:
      type: text
      regex: '(?i)>\s*Obfuscation level\s*</'

  - id: weaponize-stagers-prompt
    desc: Panel tells operator to weaponize stagers
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)weaponi[sz]e\s+stagers'

composite_rules:
  - id: implant-config-panel
    desc: Template shows implant callback, kill date and obfuscation
    crit: suspicious
    conf: 0.93
    near_bytes: 1500
    all:
      - id: implant-kill-date-label
      - id: implant-callback-url-label
      - id: implant-obfuscation-level-label
