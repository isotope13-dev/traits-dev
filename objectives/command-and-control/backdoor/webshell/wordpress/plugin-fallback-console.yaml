# A server-side webshell hiding inside a WordPress plugin file: the file carries
# plugin metadata so it installs and persists as an ordinary plugin, while its
# request handler runs a stealthy execution-API fallback console (probing which
# of system/shell_exec/passthru survived disable_functions, running the winner
# on caller input, errors suppressed). This is the wp2shell/WSO deployment
# shape — a shell registered as an active plugin. Either half alone is weak
# (many legitimate plugins carry a header; the console composite already
# covers the bare shape), but a fallback console wearing a plugin header is a
# plugin-disguised webshell, not an admin tool.
defaults:
  platforms: [unix, windows]
  for: [php]
  attack: T1505.003
  mbc: B0030

composite_rules:
  - id: wordpress-plugin-stealth-command-console
    desc: WordPress plugin file runs a stealthy fallback command console
    crit: hostile
    conf: 0.98
    scope: file
    all:
      - id: metadata/package/files/ecosystem::wordpress-plugin-header-name
      - id: objectives/command-and-control/backdoor/webshell/exec::php-stealth-fallback-console
    near_bytes: 3000
