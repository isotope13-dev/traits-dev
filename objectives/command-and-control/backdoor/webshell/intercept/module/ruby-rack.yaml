defaults:
  for:
    - ruby
  platforms:
    - unix
    - windows
composite_rules:
  - id: rack-middleware-backdoor
    desc: Cookie eval alongside method aliasing
    crit: suspicious
    conf: 0.99
    all:
      - id: ruby-decoded-cookie-eval-flow
      - id: micro-behaviors/metaprogramming/generation::ruby-alias-method
  # This records the presence of a real production test near the evaluator;
  # it does not assert that every evaluator is dominated by that condition.
  - id: ruby-cookie-eval-with-production-check
    desc: Cookie eval with production-mode check
    crit: hostile
    conf: 0.99
    near_lines: 40
    all:
      - id: ruby-decoded-cookie-eval-flow
      - id: micro-behaviors/os/env/test::ruby-rails-production-check
