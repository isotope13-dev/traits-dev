defaults:
  for: [ruby]
  platforms: [unix, windows]
traits:
  - id: ruby-decoded-cookie-eval-flow
    desc: Evaluates Base64-decoded request cookie data
    crit: suspicious
    conf: 0.99
    if:
      type: tree-sitter
      query: |
        ((_ (assignment left: (identifier) @decoded right: (call receiver: (constant) @b64
                  method: (identifier) @decode arguments: (argument_list [(element_reference object: (identifier) @env
          [(string (string_content) @cookie_key)
           (call receiver: (string (string_content) @cookie_key) method: (identifier) @upper)]) (call receiver: (element_reference object: (call receiver: (call receiver: (element_reference object: (identifier) @env
          [(string (string_content) @cookie_key)
           (call receiver: (string (string_content) @cookie_key) method: (identifier) @upper)])
          method: (identifier) @scan arguments: (argument_list (regex)))
          method: (identifier) @flatten) (integer) @index) method: (identifier) @to_s)])))
                [(call method: (identifier) @eval arguments: (argument_list (identifier) @executed))
                 (if_modifier body: (call method: (identifier) @eval arguments: (argument_list (identifier) @executed)))])
          (#eq? @b64 "Base64") (#match? @decode "^(urlsafe_decode64|strict_decode64|decode64)$")
          (#match? @cookie_key "^(HTTP_COOKIE|http_cookie)$")
          (#eq? @upper "upcase") (#eq? @scan "scan") (#eq? @flatten "flatten")
          (#eq? @index "0") (#eq? @to_s "to_s")
          (#eq? @eval "eval") (#eq? @decoded @executed))
        ((call method: (identifier) @eval arguments: (argument_list
          (call receiver: (constant) @b64 method: (identifier) @decode
            arguments: (argument_list [(element_reference object: (identifier) @env
          [(string (string_content) @cookie_key)
           (call receiver: (string (string_content) @cookie_key) method: (identifier) @upper)]) (call receiver: (element_reference object: (call receiver: (call receiver: (element_reference object: (identifier) @env
          [(string (string_content) @cookie_key)
           (call receiver: (string (string_content) @cookie_key) method: (identifier) @upper)])
          method: (identifier) @scan arguments: (argument_list (regex)))
          method: (identifier) @flatten) (integer) @index) method: (identifier) @to_s)]))))
          (#eq? @eval "eval") (#eq? @b64 "Base64")
          (#match? @decode "^(urlsafe_decode64|strict_decode64|decode64)$")
          (#match? @cookie_key "^(HTTP_COOKIE|http_cookie)$")
          (#eq? @upper "upcase") (#eq? @scan "scan") (#eq? @flatten "flatten")
          (#eq? @index "0") (#eq? @to_s "to_s"))
