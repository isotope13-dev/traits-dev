defaults:
  platforms: [unix, windows]
  for: [java]
traits:
  - id: java-middleware-service-implementation
    desc: Implements middleware Java service interface
    crit: notable
    if:
      type: text
      regex: 'implements\s+JavaService2\b'
      exclude_comments: true
composite_rules:
  - id: middleware-request-shell
    desc: Middleware request parameters near shell execution
    crit: suspicious
    conf: 0.97
    near_lines: 18
    all:
      - id: java-middleware-service-implementation
      - id: micro-behaviors/communications/http/request/params::servlet-get-parameter-call
      - id: micro-behaviors/process/create/subprocess/configure::java-processbuilder-shell-exec
      - id: micro-behaviors/process/create/subprocess/launch::java-processbuilder-start-source
    unless:
      - id: middleware-request-shell-execution
  - id: middleware-request-shell-execution
    desc: Middleware starts a shell with a request parameter value
    crit: hostile
    conf: 0.99
    attack: T1505.003
    near_lines: 18
    all:
      - id: java-middleware-service-implementation
      - id: micro-behaviors/process/create/subprocess/configure::java-request-value-shell-start
