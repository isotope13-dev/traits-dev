# An unauthenticated HTTP-triggered Node middleware that shells out and plants
# an embedded SSH public key is a webshell used to install persistent access,
# distinct from the concealed-download variant in node-middleware.yaml.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  attack: T1505.003,T1098.004

composite_rules:
  - id: http-triggered-shell-plants-ssh-key
    desc: HTTP-gated middleware shells out to plant an SSH key
    crit: hostile
    conf: 0.97
    near_bytes: 1200
    all:
      - id: micro-behaviors/communications/http/server/route::exported-middleware-binding
      - id: micro-behaviors/process/create/shell/command-string::execSync-call
      - id: micro-behaviors/crypto/asymmetric/ssh::ed25519-public-key-literal
      - id: micro-behaviors/communications/ssh/keys::authorized-keys-append-redirect
