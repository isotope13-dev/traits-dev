defaults:
  platforms: [windows, unix]
  for: [java, class]
  attack: T1505.003
  mbc: B0030

traits:
  - id: javassist-bytecode-builder-source
    desc: Javassist bytecode builder source
    crit: notable
    conf: 0.88
    if:
      type: symbol
      kind: import
      regex: '^javassist(\.|$)'
  - id: javassist-method-body-source
    desc: Javassist method body patch source
    crit: notable
    conf: 0.86
    if:
      type: symbol
      kind: call
      exact: setBody
  - id: javassist-method-body-text-source
    desc: Javassist method body patch text source
    crit: notable
    conf: 0.84
    if:
      type: text
      substr: .setBody(
  - id: javassist-add-method-helper-source
    desc: Javassist addMethod helper source
    crit: notable
    conf: 0.86
    if:
      type: symbol
      kind: function
      exact: addMethod
  - id: javassist-add-field-helper-source
    desc: Javassist addField helper source
    crit: notable
    conf: 0.84
    if:
      type: symbol
      kind: function
      exact: addField
  - id: javassist-remove-sourcefile-source
    desc: Javassist source file attribute removal source
    crit: notable
    conf: 0.9
    if:
      type: symbol
      kind: function
      exact: removeSourceFileAttribute
  - id: javassist-to-bytecode-source
    desc: Javassist bytecode emission source
    crit: notable
    conf: 0.86
    if:
      type: symbol
      kind: call
      exact: toBytecode
  - id: java-agent-manifest-source
    desc: Java agent manifest entry source
    crit: notable
    conf: 0.9
    if:
      type: literal
      regex: '^(Premain-Class|Agent-Class)$'
  - id: java-agent-jar-outputstream-source
    desc: Java agent JAR output stream source
    crit: notable
    conf: 0.86
    if:
      type: symbol
      kind: call
      exact: JarOutputStream
  - id: java-bcel-loader-builder-source
    desc: Java BCEL loader builder source
    crit: notable
    conf: 0.9
    if:
      type: symbol
      kind: function
      exact: generatorBCELoaderClass
  - id: java-shell-generator-interface-source
    desc: Java shell generator interface source
    crit: notable
    conf: 0.86
    if:
      type: symbol
      kind: import
      exact: jmg.core.generator.IShellGenerator
  - id: java-shell-bytecode-make-source
    desc: Java shell or injector generator entrypoint
    crit: notable
    conf: 0.88
    if:
      type: text
      regex: '\b(genPayload|makeShell|makeInjector)\s*\('
  - id: java-shell-bytecode-modify-source
    desc: Java shell bytecode modify source
    crit: notable
    conf: 0.88
    if:
      type: symbol
      kind: function
      exact: modifyShell
  - id: java-shell-gzip-base64-source
    desc: Java shell gzip Base64 source
    crit: notable
    conf: 0.86
    if:
      type: symbol
      kind: call
      exact: setShellGzipBase64String
  - id: java-memshell-generator-class
    desc: Java memshell generator class
    crit: notable
    conf: 0.88
    if:
      type: symbol
      kind: identifier
      regex: '^(MemShellGenerator|jMGenerator)$'
  - id: java-probe-shell-generator-class
    desc: Java probe shell generator class
    crit: notable
    conf: 0.88
    if:
      type: symbol
      kind: identifier
      exact: ProbeShellGenerator
  - id: java-memshell-result-source
    desc: Java memshell result source
    crit: notable
    conf: 0.86
    if:
      type: symbol
      kind: identifier
      exact: MemShellResult
  - id: java-shelltool-class
    desc: Java shell tool class
    crit: notable
    conf: 0.86
    if:
      type: symbol
      kind: identifier
      exact: ShellTool
  - id: java-shelltype-class
    desc: Java shell type class
    crit: notable
    conf: 0.86
    if:
      type: symbol
      kind: identifier
      exact: ShellType
  - id: java-shelltoolconfig-class
    desc: Java shell tool config class
    crit: notable
    conf: 0.86
    if:
      type: symbol
      kind: identifier
      exact: ShellToolConfig
  - id: java-godzilla-manager-class
    desc: Java Godzilla manager class
    crit: notable
    conf: 0.88
    if:
      type: symbol
      kind: identifier
      exact: GodzillaManager
  - id: java-antsword-manager-class
    desc: Java AntSword manager class
    crit: notable
    conf: 0.88
    if:
      type: symbol
      kind: identifier
      exact: AntSwordManager
  - id: java-behinder-manager-class
    desc: Java Behinder manager class
    crit: notable
    conf: 0.88
    if:
      type: symbol
      kind: identifier
      exact: BehinderManager
  - id: java-suo5-manager-class
    desc: Java Suo5 manager class
    crit: notable
    conf: 0.88
    if:
      type: symbol
      kind: identifier
      exact: Suo5Manager
  - id: java-memshell-inject-helper-source
    desc: Java memshell injection helper source
    crit: notable
    conf: 0.9
    if:
      type: symbol
      kind: call
      exact: packerResultAndInject
  - id: java-memshell-probe-content-source
    desc: Java memshell probe content source
    crit: notable
    conf: 0.86
    if:
      type: text
      regex: 'Probe(Content|Method)\.'
  - id: java-memshell-packer-source
    desc: Java memshell packer source
    crit: notable
    conf: 0.84
    if:
      type: symbol
      kind: identifier
      exact: Packers
  - id: java-memshell-shellassertion-source
    desc: Java memshell shell assertion helper source
    crit: notable
    conf: 0.86
    if:
      type: symbol
      kind: identifier
      exact: ShellAssertion
  - id: java-webshell-manager-entrypoint-call
    desc: Java webshell manager entrypoint call
    crit: notable
    conf: 0.84
    if:
      type: symbol
      kind: call
      exact: entrypoint
  - id: java-webshell-manager-key-call
    desc: Named memshell context key call
    crit: notable
    conf: 0.84
    if:
      type: text
      regex: '(?i)(webshell|memshell|shell)[\s\S]{0,240}\bkey\s*\('
  # CommandValve and CommandListener are bytecode-redefinition templates:
  # CommandGenerator replaces their inert getInputStream method with process
  # execution. The source alone demonstrates the request-to-response shell
  # shape, but not an executable process call, so keep this suspicious.
  - id: java-command-shell-template-request-input
    desc: Request parameter matches the shell name
    crit: notable
    conf: 0.9
    for: [java]
    if:
      type: text
      regex: 'getParameter\s*\(\s*paramName\s*\)'
  - id: java-command-shell-template-header-fallback
    desc: Reads shell input from same-named header
    crit: notable
    conf: 0.9
    for: [java]
    if:
      type: text
      regex: 'getHeader\s*\(\s*paramName\s*\)'
  - id: java-command-shell-template-stream-method
    desc: Passes input to replaceable stream method
    crit: notable
    conf: 0.9
    for: [java]
    if:
      type: text
      regex: 'getInputStream\s*\(\s*param\s*\)'
  - id: java-command-shell-template-scans-stream
    desc: Reads replaceable input stream to text
    crit: notable
    conf: 0.9
    for: [java]
    if:
      type: text
      regex: 'new\s+Scanner\s*\(\s*inputStream\s*\)'
  - id: java-command-shell-template-response-writer
    desc: Writes generated stream through servlet response
    crit: notable
    conf: 0.9
    for: [java]
    if:
      type: text
      regex: 'getWriter\s*\(\s*\)\s*\.write\s*\('

composite_rules:
  - id: java-memshell-bytecode-generator
    desc: Java memshell bytecode generator
    crit: suspicious
    conf: 0.94
    all:
      - id: javassist-bytecode-builder-source
    any:
      - id: java-shell-generator-interface-source
      - id: java-shell-bytecode-make-source
      - id: java-shell-bytecode-modify-source
      - id: java-shell-gzip-base64-source
      - id: javassist-method-body-source
      - id: javassist-method-body-text-source
      - id: javassist-add-method-helper-source
      - id: javassist-add-field-helper-source
      - id: javassist-remove-sourcefile-source
      - id: javassist-to-bytecode-source
      - id: java-bcel-loader-builder-source
      - id: java-agent-manifest-source
      - id: java-agent-jar-outputstream-source
    needs: 3
  - id: java-memshell-generator-api-source
    desc: Java memshell generator API source
    crit: notable
    conf: 0.88
    any:
      - id: java-memshell-generator-class
      - id: java-probe-shell-generator-class
  - id: java-memshell-shelltool-source
    desc: Java memshell shell tool source
    crit: component
    conf: 0.86
    any:
      - id: java-shelltool-class
      - id: java-shelltype-class
      - id: java-shelltoolconfig-class
  - id: java-memshell-manager-api-source
    desc: Java memshell manager API source
    crit: notable
    conf: 0.88
    any:
      - id: java-godzilla-manager-class
      - id: java-antsword-manager-class
      - id: java-behinder-manager-class
      - id: java-suo5-manager-class
  - id: java-memshell-generation-harness
    desc: Java memshell generation harness
    crit: suspicious
    conf: 0.94
    all:
      - id: java-memshell-generator-api-source
    any:
      - id: java-shell-bytecode-make-source
      - id: java-memshell-result-source
      - id: java-memshell-shelltool-source
      - id: java-memshell-manager-api-source
      - id: java-memshell-inject-helper-source
      - id: java-memshell-probe-content-source
      - id: java-memshell-packer-source
    needs: 1
  - id: java-memshell-integration-harness
    desc: Java memshell integration harness
    crit: suspicious
    conf: 0.94
    all:
      - id: java-memshell-shellassertion-source
      - id: java-memshell-inject-helper-source
    any:
      - id: java-memshell-shelltool-source
      - id: java-memshell-manager-api-source
      - id: java-memshell-result-source
    needs: 2
  - id: java-webshell-manager-connection-builder
    desc: Java webshell manager connection builder
    crit: component
    conf: 0.86
    all:
      - id: java-webshell-manager-entrypoint-call
    any:
      - id: objectives/command-and-control/channel/irc/source::java-irc-pass-call
      - id: java-webshell-manager-key-call
    needs: 1
  - id: java-webshell-manager-local-test
    desc: Java webshell manager local test
    crit: suspicious
    conf: 0.92
    all:
      - id: java-memshell-manager-api-source
      - id: java-webshell-manager-connection-builder

  - id: java-command-shell-template
    desc: Servlet command shell template
    crit: suspicious
    conf: 0.96
    for: [java]
    all:
      - id: java-command-shell-template-request-input
      - id: java-command-shell-template-header-fallback
      - id: java-command-shell-template-stream-method
      - id: java-command-shell-template-scans-stream
      - id: java-command-shell-template-response-writer
    near_bytes: 500
