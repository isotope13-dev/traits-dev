defaults:
  platforms: [windows, unix]
  for: [java, class]
  attack: T1505.003
  mbc: B0030

traits:
  - id: servlet-filter-register-source
    desc: Servlet filter registration source
    crit: notable
    conf: 0.9
    if:
      type: literal
      exact: registerFilter
  - id: servlet-filter-manager-source
    desc: getFilterManager named, not called directly
    crit: notable
    conf: 0.88
    if:
      type: literal
      exact: getFilterManager
    unless:
    # A name reached through a string is the reflective spelling; where the
    # direct form is already recorded, this would be the same call twice.
    - id: servlet-filter-manager-call-source
  - id: servlet-filter-manager-call-source
    desc: Servlet filter manager call source
    crit: notable
    conf: 0.88
    if:
      type: symbol
      kind: call
      exact: getFilterManager
  - id: servlet-filter-pattern-list-source
    desc: Servlet filter pattern list mutation source
    crit: notable
    conf: 0.88
    if:
      type: literal
      exact: filterPatternList
  - id: servlet-filter-template-class-source
    desc: Dynamic filter template class source
    crit: notable
    conf: 0.86
    if:
      type: literal
      exact: com.memshell.generic.DynamicFilterTemplate
  - id: webapp-runtime-context-reflect-source
    desc: WebApp runtime context reflection
    crit: notable
    conf: 0.88
    if:
      type: literal
      exact: WebAppRuntimeMBeanImpl
  - id: servlet-context-reflect-field-source
    desc: Servlet context reflective field
    crit: notable
    conf: 0.86
    if:
      type: literal
      exact: context
  - id: servlet-listener-register-source
    desc: Servlet listener runtime registration source
    crit: notable
    conf: 0.9
    if:
      type: literal
      exact: addApplicationEventListener
  - id: servlet-listener-array-source
    desc: Servlet listener array replacement source
    crit: notable
    conf: 0.88
    if:
      type: literal
      exact: setApplicationEventListeners
  - id: undertow-listener-info-source
    desc: Undertow ListenerInfo runtime source
    crit: notable
    conf: 0.88
    if:
      type: literal
      exact: io.undertow.servlet.api.ListenerInfo
  - id: undertow-managed-listener-source
    desc: Undertow ManagedListener runtime source
    crit: notable
    conf: 0.88
    if:
      type: literal
      exact: io.undertow.servlet.core.ManagedListener
  - id: servlet-application-listeners-source
    desc: Servlet applicationListeners mutation source
    crit: notable
    conf: 0.88
    if:
      type: literal
      exact: applicationListeners
  - id: tomcat-valve-add-source
    desc: Tomcat valve runtime add source
    crit: notable
    conf: 0.9
    if:
      type: literal
      exact: addValve
  - id: tomcat-pipeline-source
    desc: Tomcat pipeline reflection source
    crit: notable
    conf: 0.86
    if:
      type: literal
      exact: getPipeline
  - id: weblogic-servlet-mapping-source
    desc: WebLogic servlet mapping mutation source
    crit: notable
    conf: 0.9
    if:
      type: literal
      exact: getServletMapping
  - id: weblogic-servlet-stub-source
    desc: WebLogic servlet stub construction source
    crit: notable
    conf: 0.9
    if:
      type: literal
      exact: weblogic.servlet.internal.ServletStubImpl
  - id: servlet-add-source
    desc: Servlet runtime add source
    crit: notable
    conf: 0.88
    if:
      type: literal
      exact: addServlet
  - id: servlet-mapping-add-source
    desc: Servlet mapping runtime add source
    crit: notable
    conf: 0.88
    if:
      type: literal
      exact: addMapping
  - id: servlet-mapper-field-servletmapper
    desc: ServletMapper reflective field source
    crit: notable
    conf: 0.84
    if:
      type: literal
      exact: servletMapper
  - id: servlet-mapper-field-webapp
    desc: Webapp reflective field source
    crit: notable
    conf: 0.84
    if:
      type: literal
      exact: webapp
  - id: websphere-filter-mapping-source
    desc: WebSphere filter mapping add source
    crit: notable
    conf: 0.9
    if:
      type: literal
      exact: addFilterMapping
  - id: websphere-filter-info-source
    desc: WebSphere filter info add source
    crit: notable
    conf: 0.9
    if:
      type: literal
      exact: addFilterInfo
  - id: websphere-filter-manager-field-source
    desc: WebSphere filter manager field source
    crit: notable
    conf: 0.86
    if:
      type: literal
      exact: filterManager
  - id: dubbo-service-config-source
    desc: Dubbo ServiceConfig source
    crit: notable
    conf: 0.9
    if:
      type: symbol
      kind: identifier
      exact: ServiceConfig
  # Dubbo publishes through the no-argument `serviceConfig.export()`. Matching
  # the bare method name put a webshell-objective notable on any Java file with
  # a method called export — bnd's Ant task calls
  # `getBndProject(...).export(runFilePath, keep, output)` to write a runnable
  # JAR. The empty argument list is what separates the two.
  - id: dubbo-service-export-source
    desc: Dubbo dynamic service export source
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '\.export\s*\(\s*\)'
  - id: dubbo-dynamic-services-source
    desc: Dubbo dynamic services registry source
    crit: notable
    conf: 0.86
    if:
      type: symbol
      kind: identifier
      exact: DYNAMIC_SERVICES
  - id: dubbo-serviceconfig-factory-source
    desc: Dubbo ServiceConfig factory source
    crit: notable
    conf: 0.86
    if:
      type: symbol
      kind: function
      exact: createServiceConfig
  - id: websocket-command-endpoint-source
    desc: WebSocket command endpoint source
    crit: notable
    conf: 0.88
    if:
      type: symbol
      kind: import
      exact: javax.websocket.Endpoint
  - id: websocket-message-handler-source
    desc: WebSocket message handler source
    crit: notable
    conf: 0.86
    if:
      type: symbol
      kind: import
      exact: javax.websocket.MessageHandler
  - id: websocket-sendtext-source
    desc: WebSocket remote sendText source
    crit: notable
    conf: 0.88
    if:
      type: symbol
      kind: call
      exact: sendText
  # Some Jetty shells expose equals(Object) as the handler entry point instead
  # of implementing a visible Handler interface. The framework arguments are
  # unpacked as an Object[]; a secret request-header substring claims the
  # exchange, then the request body drives the tunnel implementation.
  - id: jetty-object-equals-handler-source
    desc: Jetty shell overrides Object.equals as handler
    crit: notable
    conf: 0.92
    for: [java]
    if:
      type: text
      regex: '\bboolean\s+equals\s*\(\s*Object\s+\w+\s*\)'
  - id: jetty-object-array-handler-arguments
    desc: Jetty shell unpacks framework arguments
    crit: notable
    conf: 0.92
    for: [java]
    if:
      type: text
      regex: 'Object\[\]\s+\w+\s*=\s*\(\(Object\[\]\)\s*\w+\)'
  - id: jetty-reflective-request-header-access
    desc: Jetty shell reflects request header access
    crit: notable
    conf: 0.9
    for: [java]
    if:
      type: text
      regex: 'getMethod\s*\(\s*["'']getHeader["'']\s*,\s*String\.class\s*\)'
  - id: jetty-shell-marks-request-handled
    desc: Jetty shell suppresses ordinary request handling
    crit: notable
    conf: 0.9
    for: [java]
    if:
      type: text
      regex: 'getMethod\s*\(\s*["'']setHandled["'']'
  - id: jetty-shell-handled-flag-true
    desc: Jetty shell marks matched request handled
    crit: notable
    conf: 0.9
    for: [java]
    if:
      type: text
      regex: 'invoke\s*\(\s*baseRequest\s*,\s*true\s*\)'

composite_rules:
  - id: servlet-mapper-field-source
    desc: Servlet mapper reflective field source
    crit: component
    conf: 0.84
    any:
      - id: servlet-mapper-field-servletmapper
      - id: servlet-mapper-field-webapp
  - id: java-servlet-filter-memshell-injector
    desc: Java servlet filter memshell injector
    crit: suspicious
    conf: 0.96
    for: [class]
    all:
      - id: micro-behaviors/data/source/dynamic/reflect::java-defineclass
      - id: micro-behaviors/data/source/dynamic/reflect::java-set-accessible
      - id: servlet-filter-register-source
    any:
      - id: servlet-filter-manager-source
      - id: webapp-runtime-context-reflect-source
      - id: servlet-context-reflect-field-source
    needs: 2
  - id: java-runtime-filter-memshell-registration
    desc: Java runtime filter memshell registration
    crit: suspicious
    conf: 0.94
    all:
      - id: servlet-filter-register-source
      - id: micro-behaviors/data/source/dynamic/reflect::java-set-accessible
    any:
      - id: servlet-filter-manager-source
      - id: servlet-filter-manager-call-source
      - id: servlet-filter-pattern-list-source
      - id: servlet-filter-template-class-source
      - id: servlet-context-reflect-field-source
    needs: 2
  - id: java-servlet-listener-memshell-injector
    desc: Java servlet listener memshell injector
    crit: suspicious
    conf: 0.96
    for: [class]
    all:
      - id: micro-behaviors/data/source/dynamic/reflect::java-defineclass
      - id: micro-behaviors/data/source/dynamic/reflect::java-set-accessible
    any:
      - id: servlet-listener-register-source
      - id: servlet-listener-array-source
      - id: webapp-runtime-context-reflect-source
      - id: servlet-context-reflect-field-source
    needs: 2
  - id: java-undertow-listener-memshell-injector
    desc: Java Undertow listener memshell injector
    crit: suspicious
    conf: 0.96
    for: [class]
    all:
      - id: micro-behaviors/data/source/dynamic/reflect::java-defineclass
      - id: micro-behaviors/data/source/dynamic/reflect::java-set-accessible
      - id: servlet-application-listeners-source
    any:
      - id: servlet-listener-register-source
      - id: undertow-listener-info-source
      - id: undertow-managed-listener-source
    needs: 2
  - id: java-tomcat-valve-memshell-injector
    desc: Java Tomcat valve memshell injector
    crit: suspicious
    conf: 0.96
    for: [class]
    all:
      - id: micro-behaviors/data/source/dynamic/reflect::java-defineclass
      - id: micro-behaviors/data/source/dynamic/reflect::java-set-accessible
      - id: tomcat-valve-add-source
    any:
      - id: tomcat-pipeline-source
      - id: servlet-context-reflect-field-source
    needs: 1
  - id: java-weblogic-servlet-memshell-injector
    desc: Java WebLogic servlet memshell injector
    crit: suspicious
    conf: 0.96
    for: [class]
    all:
      - id: micro-behaviors/data/source/dynamic/reflect::java-defineclass
      - id: micro-behaviors/data/source/dynamic/reflect::java-set-accessible
      - id: weblogic-servlet-mapping-source
    any:
      - id: weblogic-servlet-stub-source
      - id: webapp-runtime-context-reflect-source
      - id: servlet-context-reflect-field-source
    needs: 2
  - id: java-servlet-mapping-memshell-injector
    desc: Java servlet mapping memshell injector
    crit: suspicious
    conf: 0.95
    for: [class]
    all:
      - id: micro-behaviors/data/source/dynamic/reflect::java-defineclass
      - id: micro-behaviors/data/source/dynamic/reflect::java-set-accessible
      - id: servlet-add-source
      - id: servlet-mapping-add-source
    any:
      - id: servlet-mapper-field-source
      - id: servlet-context-reflect-field-source
    needs: 1
  - id: java-websphere-filter-memshell-injector
    desc: Java WebSphere filter memshell injector
    crit: suspicious
    conf: 0.96
    for: [class]
    all:
      - id: micro-behaviors/data/source/dynamic/reflect::java-defineclass
      - id: micro-behaviors/data/source/dynamic/reflect::java-set-accessible
      - id: websphere-filter-mapping-source
      - id: websphere-filter-info-source
    any:
      - id: websphere-filter-manager-field-source
      - id: servlet-application-listeners-source
      - id: servlet-context-reflect-field-source
    needs: 1
  - id: java-dubbo-service-memshell-injector
    desc: Java Dubbo service memshell injector
    crit: suspicious
    conf: 0.96
    for: [class]
    all:
      - id: micro-behaviors/data/source/dynamic/reflect::java-defineclass
      - id: micro-behaviors/data/source/dynamic/reflect::java-set-accessible
      - id: dubbo-service-export-source
    any:
      - id: dubbo-service-config-source
      - id: dubbo-dynamic-services-source
      - id: dubbo-serviceconfig-factory-source
      - id: objectives/command-and-control/backdoor/webshell/intercept/generator::javassist-bytecode-builder-source
    needs: 1
  - id: java-websocket-command-memshell
    desc: Java WebSocket command memshell
    crit: suspicious
    conf: 0.93
    all:
      - id: websocket-command-endpoint-source
      - id: websocket-sendtext-source
      - id: micro-behaviors/communications/websocket/receive::jvm-onmessage-function
    any:
      - id: websocket-message-handler-source
      - id: objectives/command-and-control/backdoor/dispatch/shell/interactive::java-command-dispatch-class
      - id: micro-behaviors/process/create/spawn::java-runtime-exec-source
    needs: 1
  - id: jetty-header-equals-tunnel-webshell
    desc: Jetty hook dispatches a header-gated tunnel
    crit: hostile
    conf: 0.99
    for: [java]
    all:
      - id: jetty-object-equals-handler-source
      - id: jetty-object-array-handler-arguments
      - id: jetty-reflective-request-header-access
      - id: jetty-shell-marks-request-handled
      - id: jetty-shell-handled-flag-true
      - id: objectives/command-and-control/channel/tunnel/http::java-header-tasked-arbitrary-tcp-forwarder
