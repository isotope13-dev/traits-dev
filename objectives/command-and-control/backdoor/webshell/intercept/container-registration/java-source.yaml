defaults:
  platforms: [unix, windows]
  for: [java]
  attack: T1505.003
  mbc: B0022

traits:
  - id: websphere-filter-mapping-list-source
    desc: Reads WebSphere filter mappings
    crit: notable
    conf: 0.92
    if:
      type: text
      substr: 'getFilterMappings'

  - id: websphere-filter-config-register-source
    desc: Registers a filter config in WebSphere
    crit: notable
    conf: 0.94
    if:
      type: text
      substr: 'addFilterInfo'

  - id: websphere-filter-url-mapping-source
    desc: Adds a WebSphere filter URL mapping
    crit: notable
    conf: 0.94
    if:
      type: text
      substr: 'addMappingForUrlPatterns'

  - id: websphere-filter-template-instance-source
    desc: Instantiates a servlet filter template
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: 'new\s+FilterTemplate\s*\('

  - id: websphere-dynamic-filter-class-source
    desc: Resolves a generated filter template class
    crit: notable
    conf: 0.92
    if:
      type: text
      substr: 'getDynamicFilterTemplateClass'

composite_rules:
  - id: undertow-listener-source-injector
    desc: Installs a listener into a running Undertow app
    crit: suspicious
    conf: 0.98
    all:
      - id: micro-behaviors/data/source/dynamic/reflect::java-reflective-defineclass-source
      - id: "micro-behaviors/metaprogramming/reflection::java-set-accessible"
      - id: objectives/command-and-control/backdoor/webshell/intercept/container-registration::servlet-application-listeners-source
      - id: objectives/command-and-control/backdoor/webshell/intercept/container-registration::undertow-listener-info-source
      - id: objectives/command-and-control/backdoor/webshell/intercept/container-registration::undertow-managed-listener-source

  - id: websphere-runtime-filter-source-injector
    desc: Registers a filter in a running WebSphere app
    crit: suspicious
    conf: 0.98
    all:
      - id: "micro-behaviors/metaprogramming/reflection::java-set-accessible"
      - id: websphere-filter-mapping-list-source
      - id: websphere-filter-config-register-source
      - id: websphere-filter-url-mapping-source
    any:
      - id: websphere-filter-template-instance-source
      - id: websphere-dynamic-filter-class-source
