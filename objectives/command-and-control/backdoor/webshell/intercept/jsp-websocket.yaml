defaults:
  platforms: [windows, unix]
  for: [python, java, class, html, javascript]
  attack: T1505.003
  mbc: B0030

composite_rules:
  - id: jsp-websocket-memory-shell
    desc: JSP dynamically registers a WebSocket command shell
    crit: hostile
    conf: 0.99
    all:
      - id: metadata/lang/scripted::jsp-server-page
      - id: objectives/command-and-control/remote-command/control::jsp-websocket-shell-command
      - id: micro-behaviors/communications/websocket/server::java-websocket-endpoint-registration
      - id: micro-behaviors/communications/http/request/params::java-servlet-get-parameter
    near_bytes: 8192
