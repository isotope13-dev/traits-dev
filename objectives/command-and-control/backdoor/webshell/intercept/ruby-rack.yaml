defaults:
  for:
    - ruby
  platforms:
    - unix
    - windows
traits:
  # Same underlying observation as rails-production-check-text below (a Rails
  # production-environment guard), just caught in quoted-string form (e.g. a
  # generator template building a Rakefile snippet) rather than as bare code.
  # A production gate is an ordinary, ubiquitous Rails idiom on its own — not
  # independently suspicious, and no composite here references this atom
  # directly; it only contributes real signal alongside the composites'
  # own eval/base64/rack-cookie evidence. Keep it at the same criticality as
  # its code-text twin instead of over-weighting the quoted-string form.
  - id: rails-production-env
    desc: Rails production check in a quoted string
    crit: notable
    conf: 0.65
    attack: T1190
    if:
      type: string_literal
      regex: Rails\.env\.production|env\.production\?
  # `alias_method` moved to micro-behaviors/data/source/dynamic/reflect::
  # ruby-alias-method -- it is a plain Ruby reflection primitive, not a
  # webshell-interception fragment. Referenced from the composites below.
  # HTTP_COOKIE env access is a neutral Rack capability; see
  # micro-behaviors/communications/http/cookies::rack-env-http-cookie-key.
  # A Rails production gate written as code (`Rails.env.production?`) rather
  # than data: the string_literal twin only sees the check inside quoted
  # strings, so a text form is needed for the gate as written in middleware.
  - id: rails-production-check-text
    desc: Rails production gate in code
    crit: notable
    conf: 0.9
    attack: T1190
    if:
      type: text
      regex: 'Rails\.env\.production\?|\.production\?\s*(\&\&|then)'
composite_rules:
  - id: rack-middleware-backdoor
    desc: Rack middleware backdoor
    crit: suspicious
    conf: 0.95
    attack: T1059
    needs: 4
    any:
      - id: well-known/lib/web/rack::rack-library
      - id: micro-behaviors/communications/http/cookies::rack-env-http-cookie-key
      - id: micro-behaviors/data/decode/base64::base64-urlsafe-decode
      - id: micro-behaviors/process/interpreter/eval/direct::ruby-eval
      - id: micro-behaviors/data/source/dynamic/reflect::ruby-alias-method
  - id: cookie-code-injection
    desc: Cookie-based code injection
    crit: suspicious
    conf: 0.93
    attack: T1059
    needs: 3
    any:
      - id: micro-behaviors/communications/http/cookies::rack-env-http-cookie-key
      - id: micro-behaviors/communications/http/cookies::ruby-cookie-scanner-call
      - id: micro-behaviors/data/decode/base64::base64-urlsafe-decode
      - id: micro-behaviors/process/interpreter/eval/direct::ruby-eval
  # Evaluating request input only in production hides the backdoor from
  # development and staging runs while keeping it live where it pays: the
  # bootstrap-sass 3.2.0.3 gem wrapped its cookie eval in
  # `Rails.env.production?` and swallowed every error twice.
  - id: production-gated-cookie-eval-backdoor
    desc: Production-gated cookie eval backdoor
    crit: hostile
    conf: 0.94
    attack: T1195.002,T1059
    all:
      - id: micro-behaviors/process/interpreter/eval/direct::ruby-eval
      - id: micro-behaviors/data/decode/base64::base64-decoding
      - id: rails-production-check-text
