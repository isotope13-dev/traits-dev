defaults:
  platforms: [unix, windows]
  for: [class]
  attack: T1505.003
  mbc: B0030

composite_rules:
  - id: jvm-filter-body-encrypted-loader
    desc: Replaces servlet filter body with encrypted bytecode loader
    crit: hostile
    conf: 0.99
    all:
      - id: objectives/command-and-control/backdoor/webshell/request/code-load::jvm-template-encrypted-request-classloader
      - id: micro-behaviors/process/hook/instrumentation::javassist-method-setbody-bytecode
      - id: micro-behaviors/communications/http/server/middleware::tomcat-application-filter-chain
