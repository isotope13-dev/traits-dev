defaults:
  platforms: [windows, unix]
  for: [java, class]
  attack: T1505.003
  mbc: B0030

traits:
  - id: java-agent-dynamic-attach-entry
    desc: Java agent dynamic-attach entry (agentmain)
    crit: notable
    conf: 0.85
    if:
      type: text
      regex: '\bagentmain\s*\('
  - id: javassist-method-body-insert-source
    desc: Javassist method-body code injection
    crit: notable
    conf: 0.84
    if:
      type: text
      regex: '\.insert(Before|After)\s*\('

composite_rules:
  - id: java-instrumentation-retransform-memshell
    desc: Agent retransforms filter chain for memshell
    crit: hostile
    conf: 0.95
    for: [java, class, java_class, jar]
    all:
      - id: micro-behaviors/process/hook/instrumentation::java-instrumentation-retransform
      - id: micro-behaviors/communications/http/server/middleware::jvm-servlet-filterchain-reference
    any:
      - id: java-agent-dynamic-attach-entry
      - id: micro-behaviors/process/hook/instrumentation::java-instrumentation-add-transformer
      - id: javassist-method-body-insert-source
      - id: objectives/command-and-control/backdoor/webshell/intercept/generator::javassist-bytecode-builder-source
