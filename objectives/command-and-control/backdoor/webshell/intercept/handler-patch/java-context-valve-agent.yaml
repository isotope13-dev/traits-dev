defaults:
  for: [java]
  platforms: [windows, unix]
  attack: T1055,T1505.003

traits:
  - id: java-server-context-valve-target
    desc: References a server context valve
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(Default|Standard)ContextValve'

composite_rules:
  - id: java-context-valve-agent-injector
    desc: Java agent injects code into server valve
    crit: hostile
    conf: 0.97
    all:
      - id: java-server-context-valve-target
      - id: micro-behaviors/process/hook/instrumentation::java-instrumentation-add-transformer
      - id: micro-behaviors/process/hook/instrumentation::java-instrumentation-retransform
      - id: objectives/anti-static/obfuscation/obfuscator/bytecode::java-asm-method-instruction-source
      - id: objectives/execution/exploit/access-control::java-defineclass-reflection-open-source
      - id: micro-behaviors/data/decompress/gzip::gzip-byte-array-input-source
