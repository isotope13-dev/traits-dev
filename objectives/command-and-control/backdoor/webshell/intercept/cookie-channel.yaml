# A backdoor that takes its commands from a cookie.
#
# The trojanized strong_password gem is already described in anti-static terms:
# a base64 blob decoded and eval'd. That says how the code was hidden. This
# says where it comes from, which is the part that makes it a channel rather
# than a payload.
#
# A cookie is a good choice for the operator and a bad one for the defender.
# It is not in the URL, so it never appears in an access log or a referer
# header. It survives redirects. It looks identical to session state to every
# proxy and WAF between the attacker and the process. And unlike a query
# parameter, nobody scrolls past it while reading traffic.
#
# So the two findings answer different questions. The encoding rule tells a
# reviewer the code was concealed; this tells an incident responder that the
# request logs they are about to search will not contain the commands, and
# that they need the cookie header to find out what was run.
defaults:
  platforms: [unix, windows]
  for: [ruby, php, python, javascript, text]
  attack: T1505.003,T1071.001
  mbc: B0030

composite_rules:
  - id: cookie-delivered-code-execution
    desc: Backdoor takes code from a cookie
    crit: hostile
    conf: 0.95
    all:
      - id: objectives/command-and-control/backdoor/webshell/intercept::cookie-code-injection
    any:
      - id: objectives/anti-static/obfuscation/payload/encoded::ruby-eval-base64-decode
      - id: objectives/anti-static/obfuscation/payload/encoded/
    unless:
      - id: metadata/package/testing/
