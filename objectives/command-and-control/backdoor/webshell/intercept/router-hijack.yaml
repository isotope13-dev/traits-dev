# Exposing an in-process backdoor through the front door: rather than dropping
# a new page under the web root, the operator edits the running HTTP front
# end's routing table so an existing, already-reachable URI is handed to the
# handler they injected. The rewritten target is a server-side page name — the
# class an injected handler impersonates — and the traffic is proxied to a
# loopback listener that is not otherwise published.
#
# Scoped to programs, not configuration files, so a deployment's own static
# route table cannot match: the finding is that something *rewrites* the router
# at run time and points an authentication endpoint at a private backend.
defaults:
  platforms: [unix]
  for: [shell, python, javascript, go, ruby, perl, php]
  attack: T1505.003
  mbc: B0030

composite_rules:
  - id: live-router-loopback-route-injection
    desc: Live router given a loopback route
    crit: suspicious
    conf: 0.9
    all:
      - id: micro-behaviors/communications/http/route::unit-live-config-surface
      - id: micro-behaviors/communications/http/route::http-route-loopback-proxy-action

  - id: auth-endpoint-route-hijack
    desc: Auth URI rerouted to a server page
    crit: hostile
    conf: 0.93
    all:
      - id: live-router-loopback-route-injection
      - id: micro-behaviors/communications/http/route::http-route-server-page-rewrite
      - id: micro-behaviors/communications/http/route::http-route-auth-uri-match
