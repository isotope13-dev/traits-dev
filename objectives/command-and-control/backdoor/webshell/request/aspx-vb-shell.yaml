defaults:
  crit: notable
  attack: T1505.003
  for:
    - html
    - csharp
    - objectivec
    - vbs
  platforms:
    - windows
    - unix
traits:
  - id: aspx-page-directive
    desc: ASP.NET page directive
    crit: notable
    conf: 0.9
    if:
      type: text
      substr: '<%@ Page'
  - id: aspx-shell-cmd-exe
    desc: Shells cmd.exe from the page
    crit: suspicious
    conf: 0.95
    if:
      type: text
      regex: 'shell\(\s*"cmd\.exe /c '
composite_rules:
  - id: aspx-vb-cmd-shell
    desc: ASP.NET page shells cmd.exe
    crit: hostile
    conf: 0.97
    near_lines: 20
    all:
      - id: aspx-page-directive
      - id: aspx-shell-cmd-exe
