defaults:
  platforms: [windows, unix]
  for: [php]
  attack: T1505.003
  mbc: B0030

traits:
  - id: php-eval-request-in-string
    desc: Evaluates HTTP request parameter
    crit: suspicious
    conf: 0.98
    if:
      type: text
      regex: '(?i)@?eval\s*\(\s*\$_(GET|POST|REQUEST|COOKIE)\s*\['
    downgrade:
      any:
        # Displayed source on a rendered code-view page; the page does not
        # evaluate the request parameter it renders.
        - id: well-known/tool/development/vcs/github-web::blob-page-rendered-source
      scope: parent

composite_rules:
  - id: php-create-function-request-eval-webshell
    desc: Webshell compiles function evaluating request
    crit: hostile
    conf: 0.99
    all:
      - id: micro-behaviors/metaprogramming/generation/function::php-create-function-call
      - id: micro-behaviors/data/control-flow/dispatch/computed::php-variable-function-call
      - id: php-eval-request-in-string
    unless:
      - id: metadata/file/extension/identity::markdown-file-basename
