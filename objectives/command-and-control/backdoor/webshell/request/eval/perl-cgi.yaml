defaults:
  for: [perl]
  platforms: [unix, windows]
  mbc: B0030
  attack: T1505.003
traits:
  - id: perl-eval-b64decode
    desc: Evals a custom base64 decode
    crit: suspicious
    conf: 0.94
    if:
      type: text
      regex: '\beval\s*\(\s*b64decode\s*\('
  - id: perl-long-b64-literal
    desc: Assigns a long base64 literal
    crit: notable
    conf: 0.88
    if:
      type: text
      regex: '=\s*"[A-Za-z0-9+/]{80}'
composite_rules:
  - id: perl-eval-b64-payload
    desc: Evals a long base64 payload
    crit: hostile
    conf: 0.96
    near_lines: 40
    all:
      - id: perl-eval-b64decode
      - id: perl-long-b64-literal
    unless:
      - id: metadata/package/testing/presence/harness::perl-test-file
