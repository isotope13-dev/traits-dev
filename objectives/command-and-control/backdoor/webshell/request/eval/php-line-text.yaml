# A textual request-evaluation observation, also used to prevent a test
# exception from hiding an unescaped request eval outside its fixture string.
defaults:
  for: [php]
  platforms: [unix, windows]
  crit: notable

traits:
  - id: php-unescaped-request-eval
    desc: Unescaped direct request eval text
    if:
      type: text
      encoding: none
      regex: '(?m)^[ \t]*eval\s*\(\s*\$_(GET|POST|REQUEST|COOKIE)\s*\['

