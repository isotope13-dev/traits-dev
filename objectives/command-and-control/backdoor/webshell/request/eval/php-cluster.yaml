defaults:
  platforms: [unix, windows]
  for: [php]
  mbc: B0030
  attack: T1505.003
composite_rules:
- id: php-request-evaluation-cluster
  desc: PHP eval accompanies request-driven evaluation
  crit: suspicious
  conf: 0.92
  # Require a request-linked evaluation sink; unrelated local eval and
  # request handling beside a shell call are insufficient.
  near_lines: 120
  all:
  - id: micro-behaviors/process/interpreter/eval/direct::eval-call
  - id: micro-behaviors/communications/http/request/superglobal::php-request-parameter-access
  any:
  - id: objectives/execution/interpreter/eval/remote::eval-user-input
  - id: objectives/command-and-control/backdoor/webshell/exec::php-assert-get-post
  - id: objectives/command-and-control/backdoor/webshell/exec::php-assert-request-cookie
  needs: 1
  unless:
  - id: micro-behaviors/data/string/sanitize::php-shell-argument-escaping
  - id: well-known/app/system/anthropic-cybersecurity-skills::cybersecurity-skill-template-guide
  downgrade:
    any:
    - id: well-known/app/publishing/matomo/
    - id: well-known/lib/crypto/phpseclib/
    - id: well-known/lib/web/server/symfony::package-doc
    # Displayed source on a rendered code-view page; the page does not
    # evaluate the request parameter it renders.
    - id: well-known/tool/development/vcs/github-web::blob-page-rendered-source
    scope: parent
