defaults:
  platforms: [windows, unix]
  for: [html, php]
traits:
  - id: php-post-session-eval-loader
    desc: PHP evals POST data through session storage
    crit: notable
    conf: 0.99
    attack: T1505.003
    if:
      type: text
      regex: '\$_SESSION.{1,24}=stripslashes\(\$_POST.{1,24};eval\(\$_SESSION'
