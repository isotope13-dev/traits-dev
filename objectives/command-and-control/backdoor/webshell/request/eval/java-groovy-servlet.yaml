defaults:
  platforms: [windows, unix]
  for: [java]

traits:
  - id: groovy-shell-evaluates-servlet-input
    desc: Groovy shell evaluates servlet request input
    crit: hostile
    conf: 0.98
    attack: T1505.003,T1059
    if:
      type: tree-sitter
      query: |
        ((method_declaration
          parameters: (formal_parameters
            (formal_parameter type: (_) @request_type name: (identifier) @request))
          body: (block
            (local_variable_declaration (variable_declarator name: (identifier) @script
              value: (method_invocation object: (identifier) @input
                name: (identifier) @read)))
            [(expression_statement (method_invocation arguments: (argument_list
               (method_invocation object: (object_creation_expression type: (_) @engine)
                 name: (identifier) @eval arguments: (argument_list . (identifier) @value .)))))
             (return_statement
               (method_invocation object: (object_creation_expression type: (_) @engine)
                 name: (identifier) @eval arguments: (argument_list . (identifier) @value .)))]))
          (#match? @request_type "(^|[.])(HttpServletRequest|ServletRequest)$")
          (#eq? @request @input)
          (#match? @read "^get(Parameter|Header)$")
          (#match? @engine "(^|[.])GroovyShell$")
          (#eq? @eval "evaluate")
          (#eq? @script @value))

        ((method_declaration
          parameters: (formal_parameters
            (formal_parameter type: (_) @request_type name: (identifier) @request))
          body: (block (return_statement
            (method_invocation object: (object_creation_expression type: (_) @engine)
              name: (identifier) @eval arguments: (argument_list
                 . (method_invocation object: (identifier) @input name: (identifier) @read) .)))))
          (#match? @request_type "(^|[.])(HttpServletRequest|ServletRequest)$")
          (#eq? @request @input)
          (#match? @engine "(^|[.])GroovyShell$")
          (#eq? @eval "evaluate")
          (#match? @read "^get(Parameter|Header)$"))
