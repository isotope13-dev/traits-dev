# A JSP page that evaluates request input through a script or expression
# engine (ScriptEngine, EL, Beans Expression, JShell, XSLT) is a webshell.
#
# JSP has its own file type. The other carrier types remain for JSP fragments
# that are embedded in files classified from their surrounding content.
defaults:
  platforms:
  - windows
  - unix
  for:
  - jsp
  - java
  - class
  - html
  - javascript
  - python
  - vbs
  mbc: B0030
  attack: T1505.003
traits:
- id: jsp-transformer-newstylesheet-source
  desc: JSP builds a transformer from request data
  crit: notable
  conf: 0.9
  for: [jsp]
  if:
    type: text
    regex: '(?s)TransformerFactory\s*\.\s*newInstance\s*\(\s*\)[\s\S]{0,200}\.newTransformer\s*\('
- id: jsp-elprocessor-processbuilder-source
  desc: JSP ELProcessor evaluates ProcessBuilder
  crit: notable
  conf: 0.94
  for: [jsp]
  if:
    type: text
    regex: '(?is)ELProcessor[\s\S]{0,160}\.eval\s*\([\s\S]{0,500}ProcessBuilder'
- id: jsp-nashorn-native-string-source
  desc: JSP references Nashorn NativeString
  crit: notable
  conf: 0.96
  for: [jsp]
  if:
    type: text
    substr: jdk.nashorn.internal.objects.NativeString
- id: jsp-bcel-classloader-source
  desc: JSP references the internal BCEL loader
  crit: notable
  conf: 0.96
  for: [jsp]
  if:
    type: text
    substr: com.sun.org.apache.bcel.internal.util.ClassLoader
composite_rules:
# Script-engine command shells keep Runtime.exec out of raw source: the page
# concatenates a shell argv prefix, the request parameter, and a decoded
# `...getRuntime().exec(...)` suffix, then evaluates the result through a
# looked-up engine (usually Nashorn) and streams the process output back.
# The decoded-string exec atoms catch the concealed sink; the request-into-
# eval dataflow is what makes the page a webshell.
- id: jsp-scriptengine-request-eval-webshell
  for: [jsp, html, javascript, python]
  desc: JSP evaluates request input through a script engine
  crit: hostile
  conf: 0.97
  all:
  - id: metadata/lang/scripted::jsp-server-page
  - id: micro-behaviors/communications/http/request/params::java-servlet-get-parameter
  - id: micro-behaviors/process/interpreter/runtime/jvm::java-scriptengine-lookup-eval
  any:
  - id: micro-behaviors/data/decode/base64::java-base64-decoder-source-call
  - id: micro-behaviors/process/create/exec::java-runtime-exec-encoded
  - id: micro-behaviors/process/create/exec::java-runtime-exec-source
  needs: 1
  unless:
  - id: well-known/tool/offensive/
  - id: metadata/package/testing/presence/harness::test-fixture-directory
- id: jsp-elprocessor-request-command-shell
  for: [jsp]
  desc: JSP evaluates a request command through the EL and JavaScript engines
  crit: hostile
  conf: 0.99
  all:
  - id: micro-behaviors/communications/http/request/params::java-servlet-get-parameter
  - id: jsp-elprocessor-processbuilder-source

- id: jsp-bcel-nashorn-command-shell
  for: [jsp]
  desc: JSP passes a request command into a BCEL and Nashorn gadget chain
  crit: hostile
  conf: 0.99
  all:
  - id: objectives/command-and-control/backdoor/webshell/request/command::jsp-command-temp-file-source
  - id: jsp-nashorn-native-string-source
  - id: jsp-bcel-classloader-source

- id: jsp-beans-expression-request-command-shell
  for: [jsp]
  desc: JSP evaluates a request supplied command through Java Beans Expression
  crit: hostile
  conf: 0.99
  all:
  - id: metadata/lang/scripted::jsp-server-page
  - id: micro-behaviors/communications/http/request/params::java-servlet-get-parameter
  - id: micro-behaviors/process/create/spawn::java-beans-runtime-exec-expression
  - id: micro-behaviors/process/create/spawn::java-beans-expression-get-value

- id: jsp-jshell-request-source-eval
  for: [jsp]
  desc: JSP evaluates request supplied Java source with JShell
  crit: hostile
  conf: 0.99
  all:
  - id: micro-behaviors/communications/http/request/params::java-servlet-get-parameter
  - id: micro-behaviors/process/interpreter/runtime/jvm::java-jshell-eval-source

- id: jsp-encrypted-xslt-command-shell
  for: [jsp]
  desc: JSP decrypts request content and evaluates it as an XSLT stylesheet
  crit: hostile
  conf: 0.97
  all:
  - id: objectives/command-and-control/backdoor/webshell/request/command::jsp-request-body-read-source
  - id: micro-behaviors/crypto/library/provider::java-cipher-decrypt-mode-source
  - id: jsp-transformer-newstylesheet-source
