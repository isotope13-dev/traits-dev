defaults:
  crit: hostile
  platforms: [unix, windows]
  for: [php]
  attack: T1505.003
  mbc: B0030

composite_rules:
  # Timestamp copying and encoded file dispatch distinguish this operator
  # console from a generic authenticated PHP evaluation/debugging endpoint.
  - id: php-encoded-timestamp-eval-console
    desc: PHP eval console with encoded dispatch and timestomping
    conf: 0.97
    all:
      # This context profile retains the POST/Base64/eval evidence when the
      # generic eval atom is suppressed in taxonomy test fixtures.
      - id: micro-behaviors/process/interpreter/eval/direct::php-post-base64-variable-eval-context
      - id: micro-behaviors/metaprogramming/reflection::php-encoded-file-write-dispatch-profile
      - id: micro-behaviors/fs/file/timestamp::php-dispatched-mtime-copy-profile
      - id: micro-behaviors/os/telemetry/logging/configure::php-log-config-disabled
