defaults:
  platforms: [windows, unix]
  for: [php]
  attack: T1505.003
  mbc: B0030

composite_rules:
  - id: php-request-assembled-callback-webshell
    desc: Request executed via assembled callback
    crit: hostile
    conf: 0.98
    all:
      - id: objectives/command-and-control/backdoor/webshell/exec::php-dynamic-callback-indexed-param
      - id: micro-behaviors/communications/http/request/superglobal::get-post-param-access
      - id: micro-behaviors/data/string/assembly::php-chr-slice-char-chain
    unless:
      - id: metadata/package/testing/presence/path::php-test-or-fixture-path
