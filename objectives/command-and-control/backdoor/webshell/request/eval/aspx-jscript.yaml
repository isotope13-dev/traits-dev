defaults:
  platforms:
  - windows
  for:
  - asp
  - jsp
  attack: T1505.003
  mbc: B0030
traits:
- id: aspx-jscript-page-directive
  desc: ASP.NET page selects JScript
  crit: baseline
  conf: 0.96
  if:
    type: text
    regex: (?i)<%@\s*page\b[^%>]{0,160}\blanguage\s*=\s*["']?jscript["']?
- id: aspx-jscript-fragmented-request-name
  desc: JScript concatenates fragments of Request
  crit: notable
  conf: 0.96
  if:
    type: text
    regex: (?is)"R"\s*\+\s*"e"[\s\S]{0,40}"q"\s*\+\s*"u"
- id: jsp-typed-jscript-eval-call
  desc: JSP-typed JScript page calls eval
  crit: notable
  conf: 0.9
  for:
  - jsp
  if:
    type: text
    regex: (?i)\beval\s*\(
- id: aspx-jscript-base64-decode
  desc: ASP.NET JScript decodes Base64 source
  crit: notable
  conf: 0.9
  if:
    type: text
    regex: (?i)System\s*\.\s*Convert\s*\.\s*FromBase64String\s*\(
- id: aspx-jscript-codepage-decode
  desc: JScript uses a legacy code page
  crit: notable
  conf: 0.9
  if:
    type: text
    substr: System.Text.Encoding.GetEncoding
- id: aspx-jscript-codepage-getstring
  desc: JScript decodes encoded byte strings
  crit: notable
  conf: 0.9
  if:
    type: text
    substr: .GetString(
- id: aspx-jscript-base64-request-item-token
  desc: JScript joins Base64 pieces for Request.Item
  crit: notable
  conf: 0.96
  if:
    type: text
    regex: (?is)ZXF1Z["']\s*\+\s*["']XN0\.?[Ll]k["']\s*\+\s*["']l0ZW1["']\s*\+\s*["']b
- id: aspx-jscript-unsafe-eval
  desc: ASP.NET JScript unsafe eval execution
  crit: notable
  conf: 0.98
  for:
  - asp
  if:
    type: text
    regex: (?i)\beval\s*\([^,)]{1,60},\s*["']unsafe["']\s*\)
composite_rules:
- id: aspx-jscript-eval-call
  desc: ASP.NET JScript evaluates source dynamically
  crit: notable
  conf: 0.9
  any:
  - id: micro-behaviors/process/interpreter/eval/direct::vbs-eval-function
  - id: jsp-typed-jscript-eval-call
- id: aspx-jscript-request-eval-webshell
  desc: ASP.NET JScript evaluates request-controlled source
  crit: hostile
  conf: 0.99
  all:
  - id: aspx-jscript-page-directive
  - id: aspx-jscript-eval-call
  any:
  - id: micro-behaviors/communications/http/server/managed::aspnet-request-collection-indexer
  - id: "micro-behaviors/communications/http/server/managed::aspnet-request-indexer-syntax"
  - id: aspx-jscript-fragmented-request-name
- id: aspx-jscript-obfuscated-indexed-request-eval-webshell
  desc: JScript evaluates a fragmented request expression
  crit: hostile
  conf: 0.99
  for:
  - asp
  all:
  - id: "metadata/lang/source/syntax::aspnet-page-directive"
  - id: aspx-jscript-eval-call
  - id: aspx-jscript-fragmented-request-name
- id: aspx-jscript-obfuscated-request-eval-webshell
  desc: ASP.NET JScript decodes and evaluates request-controlled source
  crit: hostile
  conf: 0.99
  all:
  - id: aspx-jscript-page-directive
  - id: aspx-jscript-eval-call
  - id: aspx-jscript-base64-decode
  - id: aspx-jscript-codepage-decode
  - id: aspx-jscript-codepage-getstring
  any:
  - id: aspx-jscript-base64-request-item-token
