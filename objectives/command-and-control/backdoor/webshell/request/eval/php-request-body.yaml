defaults:
  platforms: [windows, unix]
  for: [php]
  attack: T1505.003
  mbc: B0030

traits:
  - id: php-input-stream-read
    desc: Reads raw HTTP request body via php://input
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: "file_get_contents\\s*\\(\\s*['\"]php://input['\"]\\s*\\)"

composite_rules:
  # The eval argument is the request body itself. A test harness that evaluates
  # stdin-style input is the same primitive, so this stays suspicious and does
  # not claim an operator or implant.
  - id: php-request-body-eval-webshell
    desc: PHP eval executes raw HTTP request body
    crit: suspicious
    conf: 0.93
    near_bytes: 160
    all:
      - id: micro-behaviors/process/interpreter/eval/direct::eval-call
      - id: php-input-stream-read
