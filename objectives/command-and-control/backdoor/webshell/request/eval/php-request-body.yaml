defaults:
  platforms: [windows, unix]
  for: [php]
  attack: T1505.003
  mbc: B0030

traits:
  - id: php-input-stream-read
    desc: Reads raw HTTP request body via php://input
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: "file_get_contents\\s*\\(\\s*['\"]php://input['\"]\\s*\\)"

composite_rules:
  # Proximity does not establish that the request body reaches eval.
  - id: php-request-body-eval-webshell
    desc: PHP eval near raw HTTP request body read
    crit: suspicious
    conf: 0.93
    near_bytes: 160
    downgrade:
      any:
        - id: well-known/tool/detection/agent/skillspector::skillspector-regression-corpus
        - id: metadata/path/directory::test-directory-component
    all:
      - id: micro-behaviors/process/interpreter/eval/direct::eval-call
      - id: php-input-stream-read
