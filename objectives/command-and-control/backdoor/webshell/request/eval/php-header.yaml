defaults:
  platforms: [unix, windows]
  for: [php]
  attack: T1505.003,T1059
traits:
  - id: php-decoded-header-eval
    desc: Executes decoded request header code
    crit: suspicious
    conf: 0.99
    if:
      type: tree-sitter
      language: php
      kind: call
      regex: ^eval\s*\(\s*base64_decode\s*\(\s*\$_SERVER\s*\[\s*['"]HTTP_
    unless:
    - id: metadata/package/documentation/security-testing::nuclei-http-request-matcher-template
    downgrade:
      scope: parent
      any:
      - id: metadata/package/documentation/security-testing::nuclei-http-request-matcher-template

composite_rules:
  - id: php-encoded-header-eval-webshell
    desc: Encoded HTTP header eval webshell
    crit: hostile
    conf: 0.99
    near_bytes: 256
    all:
    - id: php-decoded-header-eval
    - id: micro-behaviors/data/decode/base64::php-base64-decode-call
    any:
    - id: micro-behaviors/process/interpreter/eval/direct::eval-call
    unless:
    - id: well-known/tool/offensive/projectdiscovery::nuclei-yaml-template-header
    - id: metadata/package/documentation/security-testing::nuclei-http-request-matcher-template
    - id: metadata/lang/source/origin::yaml-percent-decoded-source-layer
    downgrade:
      scope: parent
      any:
      - id: well-known/tool/offensive/projectdiscovery::nuclei-yaml-template-header
