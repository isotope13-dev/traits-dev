defaults:
  platforms: [unix, windows]
  for: [php]
  attack: T1505.003,T1059
traits:
  - id: php-decoded-header-eval
    desc: Executes decoded request header code
    crit: suspicious
    conf: 0.99
    if:
      type: tree-sitter
      language: php
      kind: call
      regex: '\beval\s*\(\s*base64_decode\s*\(\s*\$_SERVER\s*\[[''"]HTTP_'
composite_rules:
  - id: php-encoded-header-eval-webshell
    desc: Encoded HTTP header eval webshell
    crit: hostile
    conf: 0.99
    near_bytes: 256
    all:
      - id: php-decoded-header-eval
      - id: micro-behaviors/data/decode/base64::php-base64-decode-call
    any:
      - id: micro-behaviors/process/interpreter/eval/direct::eval-call
