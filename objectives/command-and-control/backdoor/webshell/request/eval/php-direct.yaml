defaults:
  for:
  - php
  platforms:
  - windows
  - unix
  attack: T1505.003
  mbc: B0030
composite_rules:
# The exact argument shape excludes predicates and quoted demonstration code.
# The independent request observation also works for PHP's mixed-case keywords.
- id: php-direct-request-eval-webshell
  desc: Evaluates raw PHP code from HTTP input
  crit: hostile
  conf: 0.99
  all:
  - id: php-direct-request-eval
  - id: micro-behaviors/communications/http/request/superglobal
  unless:
  - id: metadata/file/extension/identity::markdown-file-basename
  - id: well-known/app/system/anthropic-cybersecurity-skills::cybersecurity-skill-documentation
  - id: metadata/package/documentation/security-testing::pentest-skill-methodology
  downgrade:
    any:
      - id: metadata/package/documentation/security-testing::structured-technique-payload-catalog
      - id: well-known/tool/offensive/cdk::container-toolkit-binary
      - id: well-known/app/publishing/wordpress-plugins/security::centershield-decoded-signature-literal
      # A code-view page renders source files for browsing; a payload
      # decoded from the displayed bytes is shown, not deployed. The
      # marker matches the containing page, so the downgrade reads the
      # immediate parent's findings.
      - id: well-known/tool/development/vcs/github-web::blob-page-rendered-source
    scope: parent
traits:
- id: php-direct-request-eval
  desc: Raw HTTP parameter is PHP eval argument
  crit: suspicious
  conf: 0.99
  if:
    type: tree-sitter
    query: "((function_call_expression\n  function: (name) @sink\n  arguments: (arguments .\n    (argument (subscript_expression\n      (variable_name (name)\
      \ @source))) .)) @execution\n  (#match? @sink \"(?i)^eval$\")\n  (#any-of? @source \"_GET\" \"_POST\" \"_REQUEST\" \"_COOKIE\"))\n"
  downgrade:
    any:
      - id: metadata/package/documentation/security-testing::structured-technique-payload-catalog
      - id: well-known/tool/offensive/cdk::container-toolkit-binary
      - id: well-known/app/publishing/wordpress-plugins/security::centershield-decoded-signature-literal
      # Displayed source on a rendered code-view page; the page does not
      # evaluate the request parameter it renders.
      - id: well-known/tool/development/vcs/github-web::blob-page-rendered-source
    scope: parent
