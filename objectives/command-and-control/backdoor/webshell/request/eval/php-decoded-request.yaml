---
defaults:
  crit: hostile
  platforms:
  - linux
  - macos
  - windows
  for:
  - php
  mbc: B0030
  attack: T1505.003
composite_rules:
- id: php-decoded-request-eval-webshell
  desc: Webshell evaluates decoded HTTP request code
  crit: hostile
  conf: 0.99
  all:
  - id: objectives/execution/interpreter/eval/remote::php-decoded-request-eval
  - id: micro-behaviors/process/interpreter/eval/direct::php-eval-decoder-chain
  - id: micro-behaviors/process/interpreter/eval/direct::eval-call
  near_bytes: 256
  unless:
  - id: metadata/lang/source::yara-rule-source
  - id: well-known/app/publishing/wordpress-plugins/security::bitfire-plugin-path
  - id: well-known/tool/offensive/bingo/
