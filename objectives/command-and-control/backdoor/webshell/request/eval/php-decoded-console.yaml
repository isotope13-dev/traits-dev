composite_rules:
- crit: hostile
  platforms:
  - windows
  - unix
  for:
  - php
  attack: T1505.003,T1059
  mbc: B0030
  id: php-post-variable-eval-shell-console
  desc: PHP decoded request eval and command console
  conf: 0.98
  all:
  - id: micro-behaviors/communications/http/request/superglobal::php-request-parameter-access
  - id: micro-behaviors/data/decode/base64/unspecified::php-base64-decode-call
  - id: micro-behaviors/process/interpreter/eval/direct::eval-variable-argument
  any:
  - id: micro-behaviors/process/create/shell/variable-command::php-variable-shell-command
  - id: micro-behaviors/process/create/variable::proc-open-variable-argument
  unless:
  - id: metadata/file/extension/identity::markdown-file-basename
