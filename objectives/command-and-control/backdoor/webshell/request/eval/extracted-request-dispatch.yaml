defaults:
  platforms: [windows, unix]
  for: [php]
  attack: T1505.003
  mbc: B0030
composite_rules:
  - id: extract-request-dynamic-dispatch
    desc: Extracted request drives a dynamic call
    crit: hostile
    conf: 0.95
    near_lines: 3
    near_bytes: 128
    all:
      - id: objectives/command-and-control/backdoor/webshell/request/eval::request-import-immediate-dynamic-call
      - id: micro-behaviors/communications/http/request/superglobal::extract-request
      - id: micro-behaviors/data/control-flow/dispatch::php-variable-function-call
    unless:
      - id: metadata/package/testing/harness/unit/
      - id: well-known/lib/runtime/scripted/php-runtime::source-tree
