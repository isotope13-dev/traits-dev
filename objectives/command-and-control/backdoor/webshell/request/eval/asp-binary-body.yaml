defaults:
  platforms: [windows]
  for: [asp]
  attack: T1505.003

composite_rules:
  # A raw-body upload handler has no Execute statement. An include helper
  # has no raw-body read. These atoms do not prove variable provenance, so
  # report the conjunction as suspicious rather than a working webshell.
  - id: classic-asp-binary-body-with-execute
    desc: ASP binary request read accompanies script Execute
    crit: suspicious
    conf: 0.96
    near_bytes: 2048
    all:
      - id: micro-behaviors/communications/http/request/superglobal::classic-asp-request-binaryread
      - id: micro-behaviors/process/interpreter/eval/direct::vbs-execute-statement
