defaults:
  crit: hostile
  platforms: [linux, macos, windows]
  for: [php]
  mbc: B0030
  attack: T1505.003

composite_rules:
  # tebink-style PHP runner: encoded request field decoded in PHP and handed
  # to eval() as a variable. Unlike the decoder-chain composite (which binds
  # adjacent legs), the decode helper here is shared across command, code and
  # file actions, so the legs are file-scoped on purpose.
  - id: php-encoded-request-variable-eval
    desc: Webshell evaluates encoded request input
    conf: 0.98
    all:
      - id: micro-behaviors/process/interpreter/eval/direct::eval-variable-argument
      - id: micro-behaviors/data/decode/base64::php-base64-decode-call
      - id: micro-behaviors/communications/http/request/superglobal::post-dup
    unless:
      - id: well-known/app/publishing/wordpress-plugins/catalog::known-wordpress-plugin
      - id: metadata/file/naming::test-directory-component
      - id: metadata/package/testing/harness/unit/
