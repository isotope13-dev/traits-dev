defaults:
  platforms: [windows, unix]
  for: [php]
composite_rules:
  # Nearby request access and indirect invocation do not prove data flow
  # through the reconstructed assertion function. Retain suspicious severity.
  - id: php-request-call-complemented-assert
    desc: Request read near complemented name and call
    crit: suspicious
    conf: 0.97
    attack: T1505.003
    near_bytes: 128
    all:
      - id: micro-behaviors/data/decode/xor::php-complemented-assert-name
      - id: micro-behaviors/data/control-flow/dispatch::php-variable-function-call
      - id: micro-behaviors/communications/http/request/superglobal::get-post-param-access
