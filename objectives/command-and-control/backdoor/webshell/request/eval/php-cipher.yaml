defaults:
  platforms: [unix, windows]
  for: [php]
  attack: T1505.003,T1573
  mbc: B0030

composite_rules:
  - id: php-request-eval-with-decryption
    desc: Request eval co-occurs with decryption
    crit: hostile
    conf: 0.99
    # The request must occur inside eval's argument, independently of the
    # cipher evidence. This states co-occurrence, not proven cipher data flow.
    scope: file
    all:
      - id: objectives/execution/interpreter/eval/remote::eval-user-input
    any:
      - id: micro-behaviors/crypto/symmetric/stream/rc4/cipher::php-rc4-implementation
      - id: micro-behaviors/crypto/decrypt/transform/unspecified::php-openssl-decrypt-call
      - id: micro-behaviors/data/bitwise/xor/expression::php-caret-xor-expression
      - id: micro-behaviors/data/bitwise/xor/expression::php-compound-xor-assignment
