# A JSP page that turns an HTTP request parameter into a spawned process is a
# webshell: the page is the command channel.
#
# JSP has its own file type. The other carrier types remain for JSP fragments
# that are embedded in files classified from their surrounding content.
defaults:
  platforms:
  - windows
  - unix
  for:
  - jsp
  - java
  - class
  - html
  - javascript
  - python
  - vbs
  mbc: B0030
  attack: T1505.003
traits:
- id: jsp-request-body-read-source
  desc: JSP reads its HTTP request body
  crit: notable
  conf: 0.9
  for: [jsp]
  if:
    type: text
    regex: 'request\s*\.\s*getReader\s*\('
- id: jsp-jndi-rmi-lookup-source
  desc: JSP looks up a remote RMI object
  crit: notable
  conf: 0.94
  for: [jsp]
  if:
    type: text
    regex: '(?s)\.lookup\s*\(\s*["'']rmi://|new\s+JNDI\s*\(\s*\)\s*\.lookup\s*\(\s*["'']rmi://'
- id: jsp-reflective-run-method-source
  desc: JSP invokes a supplied run method reflectively
  crit: notable
  conf: 0.94
  for: [jsp]
  if:
    type: text
    regex: '(?s)getMethod\s*\(\s*["'']run["''][\s\S]{0,160}\.invoke\s*\('
- id: jsp-transformer-newstylesheet-source
  desc: JSP builds a transformer from request data
  crit: notable
  conf: 0.9
  for: [jsp]
  if:
    type: text
    regex: '(?s)TransformerFactory\s*\.\s*newInstance\s*\(\s*\)[\s\S]{0,200}\.newTransformer\s*\('
- id: jsp-elprocessor-processbuilder-source
  desc: JSP ELProcessor evaluates ProcessBuilder
  crit: notable
  conf: 0.94
  for: [jsp]
  if:
    type: text
    regex: '(?is)ELProcessor[\s\S]{0,160}\.eval\s*\([\s\S]{0,500}ProcessBuilder'
- id: jsp-command-temp-file-source
  desc: JSP references its command temp file
  crit: notable
  conf: 0.94
  for: [jsp]
  if:
    type: text
    substr: CMD
- id: jsp-request-input-written-to-file
  desc: JSP writes request data to a file
  crit: notable
  conf: 0.9
  for: [jsp]
  if:
    type: text
    regex: '(?is)request\s*\.\s*getParameter\s*\([^)]{1,80}\)[\s\S]{0,800}Files\.write\s*\('
- id: jsp-nashorn-native-string-source
  desc: JSP references Nashorn NativeString
  crit: notable
  conf: 0.96
