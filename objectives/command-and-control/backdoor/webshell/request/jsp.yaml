# A JSP page that turns an HTTP request parameter into a spawned process is a
# webshell: the page is the command channel.
#
# `for:` carries the JSP-carrier types because cleave has no `jsp` file type and
# a `.jsp` is classified by content — the three pages that motivated this
# (cat.jsp, dy.jsp, jspShell.jsp) arrive typed python/javascript, so a
# `for: [java, class, html]` gate left every rule here inert on them.
defaults:
  platforms:
  - windows
  - unix
  for:
  - java
  - class
  - html
  - javascript
  - python
  - vbs
  mbc: B0030
  attack: T1505.003
composite_rules:
- id: jsp-shell
  desc: JSP webshell implementation patterns
  crit: suspicious
  conf: 0.9
  all:
  - id: metadata/lang/scripted::jsp-server-page
  - id: micro-behaviors/communications/http/request/params::java-servlet-get-parameter
  any:
  - id: micro-behaviors/process/create/spawn::java-runtime-exec-source
  - id: micro-behaviors/process/create/exec::java-runtime-variable-exec-source
  - id: micro-behaviors/process/create/spawn::java-runtime-exec-bytecode-symbol
  unless:
  - id: metadata/package/testing/presence/harness::test-fixture-directory
  - id: well-known/tool/offensive/bingo/
- id: jsp-request-command-webshell
  desc: JSP request command webshell
  crit: hostile
  conf: 0.99
  any:
  - id: jsp-runtime-exec-request-param
  - id: jsp-runtime-variable-exec-request-param
  unless:
  - id: metadata/package/testing/presence/harness::test-fixture-directory
# Interactive shells keep a ProcessThread and pull cmd/function from the
# request; pair that durable worker with the request channel so the page
# scores in both exec/ and request/ rather than only on the worker class.
- id: jsp-process-thread-request-channel
  desc: JSP ProcessThread command channel driven by request parameters
  crit: hostile
  conf: 0.97
  all:
  - id: metadata/lang/scripted::jsp-server-page
  - id: objectives/command-and-control/backdoor/webshell/exec::jsp-process-thread-class
  - id: micro-behaviors/communications/http/request/params::java-servlet-get-parameter
  any:
  - id: micro-behaviors/process/create/spawn::java-runtime-exec-source
  - id: micro-behaviors/process/create/exec::java-runtime-variable-exec-source
  unless:
  - id: metadata/package/testing/presence/harness::test-fixture-directory
- id: jsp-runtime-exec-request-param
  desc: JSP Runtime.exec request parameter
  crit: suspicious
  conf: 0.98
  all:
  - id: metadata/lang/scripted::jsp-server-page
  - id: micro-behaviors/process/create/spawn::java-runtime-exec-source
  - id: micro-behaviors/communications/http/request/params::java-servlet-get-parameter
  unless:
  - id: metadata/package/testing/presence/harness::test-fixture-directory
  - id: well-known/tool/offensive/bingo/
  near_bytes: 4096
- id: jsp-runtime-variable-exec-request-param
  desc: JSP Runtime variable exec request parameter
  crit: suspicious
  conf: 0.98
  all:
  - id: metadata/lang/scripted::jsp-server-page
  - id: micro-behaviors/process/create/exec::java-runtime-variable-exec-source
  - id: micro-behaviors/communications/http/request/params::java-servlet-get-parameter
  unless:
  - id: metadata/package/testing/presence/harness::test-fixture-directory
  # Large JSP shells often keep the request dispatcher far below helper
  # methods; keep the bound below the per-file analysis window.
  near_bytes: 65536
# Most hand-written JSP shells hold the Runtime in a local before calling exec
# (`Runtime rt = Runtime.getRuntime(); rt.exec(cmd)`), so the
# `Runtime.getRuntime().exec` literal never appears. Anchor that variant on the
# page directive instead: a server page that reaches the Runtime accessor and
# reads request parameters is the same command channel.
- id: jsp-page-runtime-request-shell
  desc: JSP page reaches Java Runtime with request parameter input
  crit: hostile
  conf: 0.96
  all:
  - id: metadata/lang/scripted::jsp-server-page
  - id: micro-behaviors/process/create/spawn::java-getruntime-ref
  - id: micro-behaviors/communications/http/request/params::java-servlet-get-parameter
  any:
  - id: micro-behaviors/process/create/spawn::java-runtime-exec-source
  - id: micro-behaviors/process/create/exec::java-runtime-variable-exec-source
  unless:
  - id: metadata/package/testing/presence/harness::test-fixture-directory
  - id: metadata/package/testing/
  - id: well-known/tool/offensive/bingo/
- id: jsp-cookie-command-webshell
  desc: JSP decodes a cookie-supplied command and executes it
  crit: hostile
  conf: 0.99
  all:
  - id: metadata/lang/scripted::jsp-server-page
  - id: micro-behaviors/process/create/spawn::java-runtime-exec-source
  - id: micro-behaviors/data/decode/base64::java-base64-decoder-source-call
  any:
  - id: micro-behaviors/communications/http/cookies::servlet-request-cookie-read
  - id: micro-behaviors/communications/http/cookies::servlet-cookie-helper-read
  near_bytes: 4096
