defaults:
  platforms:
  - windows
  for:
  - html
  - csharp
  - asp
  mbc: B0030
  attack: T1505.003
traits:
- id: aspnet-source-process-instance-start
  desc: ASP.NET creates and starts a process
  crit: component
  conf: 0.92
  for: [asp]
  if:
    type: text
    regex: '(?is)new\s+(System\.Diagnostics\.)?Process\s*\(\s*\)[\s\S]{0,500}\.Start'
- id: aspnet-source-process-static-start
  desc: ASP.NET source starts a configured .NET process
  crit: component
  conf: 0.92
  for: [asp]
  if:
    type: text
    regex: '(?i)\bProcess\s*\.\s*Start\s*\(\s*[A-Za-z_$][\w$]*'
- id: aspnet-processstartinfo-control-text
  desc: ASP.NET process arguments use control text
  crit: component
  conf: 0.9
  for: [asp]
  if:
    type: text
    regex: '(?is)ProcessStartInfo[\s\S]{0,500}\b[A-Za-z_$][\w$]*\s*\.\s*Text\b'
- id: aspnet-process-output-read
  desc: ASP.NET reads redirected process output
  crit: component
  conf: 0.94
  for: [asp]
  if:
    type: text
    regex: '(?is)Standard(Output|Error)[\s\S]{0,300}ReadToEnd\s*\('
- id: aspnet-process-output-control-sink
  desc: ASP.NET renders output through a control
  crit: component
  conf: 0.93
  for: [asp]
  if:
    type: text
    regex: '(?i)([A-Za-z_$][\w$]*\s*\.\s*Text\s*=|HttpUtility\.HtmlEncode\s*\(|<%\s*=)'
- id: aspnet-base64-embedded-assembly-load
  desc: ASP.NET loads a Base64 embedded .NET assembly
  crit: notable
  conf: 0.96
  if:
    type: text
    regex: '(?is)Assembly\s*\.\s*Load\s*\(\s*Convert\s*\.\s*FromBase64String\s*\('
- id: aspnet-reflected-processrequest-method
  desc: ASP.NET resolves ProcessRequest by reflection
  crit: component
  conf: 0.96
  if:
    type: text
    regex: 'GetMethod\s*\(\s*("ProcessRequest"|"Proc"\s*\+\s*"essR"\s*\+\s*"equest")'
- id: aspnet-reflected-context-pass
  desc: ASP.NET passes HttpContext to reflected handler
  crit: component
  conf: 0.96
  if:
    type: text
    regex: 'Invoke\s*\([^)]{0,160}new\s+object\s*\[\s*\]\s*\s*\{\s*this\s*\.\s*Context\s*\}'
- id: aspnet-final-block-assembly-load
  desc: Loads decrypted request bytes as assembly
  crit: component
  conf: 0.98
  for: [asp]
  if:
    type: text
    regex: '(?is)TransformFinalBlock\s*\([^)]{0,240}\)[\s\S]{0,240}@?Assembly\s*\.\s*@?Load\s*\('
- id: aspnet-request-body-base64-action-tuple
  desc: ASP.NET decodes request action tuple
  crit: suspicious
  conf: 0.96
  for: [asp]
  if:
    type: text
    regex: '(?i)FromBase64String\(Server\.UrlDecode'
- id: aspnet-request-body-split-action-tuple
  desc: ASP.NET splits request data into actions
  crit: component
  conf: 0.95
  for: [asp]
  if:
    type: text
    regex: '(?i)Split.{0,4}_'
- id: aspnet-request-input-stream-body
  desc: ASP.NET reads the raw request body
  crit: component
  conf: 0.96
  for: [asp]
  if:
    type: text
    substr: Request.InputStream
- id: aspnet-request-tuple-process-stdin
  desc: Request data enters process stdin
  crit: suspicious
  conf: 0.97
  for: [asp]
  if:
    type: text
    regex: '(?i)StandardInput\s*\.\s*WriteLine\s*\([^)]{0,80}\[[\w$]{1,30}\]'
- id: aspnet-request-tuple-process-stdout
  desc: ASP.NET reads redirected process output
  crit: component
  conf: 0.97
  for: [asp]
  if:
    type: text
    regex: '(?i)StandardOutput\s*\.\s*ReadToEnd\s*\('
- id: aspnet-request-form-decrypted-plugin-dispatch
  desc: ASP.NET dispatches into a loaded plugin
  crit: component
  conf: 0.98
  for: [asp]
  if:
    type: text
    regex: '(?i)\.GetType\("C"\)\.GetMethod\("S"\)\.Invoke\('
- id: aspnet-request-plugin-assembly-load
  desc: ASP.NET loads a request plugin assembly
  crit: component
  conf: 0.98
  for: [asp]
  if:
    type: text
    substr: Assembly.Load
- id: aspnet-godzilla-session-cache-marker
  desc: Godzilla session cache key
  crit: component
  conf: 0.98
  for: [asp]
  if:
    type: text
    regex: '(?i)Session\s*\[\s*["'']loadekko["'']\s*\]'
- id: aspnet-loopback-tcpclient-connect
  desc: ASP.NET connects to a loopback TCP service
  crit: component
  conf: 0.95
  for: [asp]
  if:
    type: text
    regex: '(?i)\.Connect\s*\(\s*"127\.0\.0\.1"\s*,\s*\w+'
- id: aspnet-ftp-user-setup-command
  desc: ASP.NET configures an FTP server account
  crit: component
  conf: 0.97
  for: [asp]
  if:
    type: text
    substr: -SETUSERSETUP
- id: aspnet-ftp-root-directory-grant
  desc: ASP.NET grants FTP drive-root access
  crit: component
  conf: 0.98
  for: [asp]
  if:
    type: text
    substr: '-HomeDir=c:\\'
- id: aspnet-ftp-site-exec-command
  desc: FTP SITE EXEC receives a control value
  crit: suspicious
  conf: 0.98
  for: [asp]
  if:
    type: text
    regex: '(?i)SITE\s+EXEC\s*["'']?\s*&\s*Command'
- id: aspnet-ftp-command-control-input
  desc: Command is read from a text control
  crit: suspicious
  conf: 0.96
  for: [asp]
  if:
    type: text
    regex: '(?i)Command\s+As\s+String\s*=\s*Text_cmd\.Text'
- id: aspnet-physical-path-page-writer
  desc: ASP.NET request rewrites its page as ASPX
  crit: suspicious
  conf: 0.98
  if:
    type: text
    regex: '(?is)WriteAllText\s*\(\s*HttpContext\s*\.\s*Current\s*\.\s*Request\s*\.\s*PhysicalPath\s*\+\s*["'']\.aspx["'']'
- id: aspnet-handler-include-page-writer
  desc: ASP.NET handler writes an include directive
  crit: suspicious
  conf: 0.98
  if:
    type: text
    regex: '(?is)File\s*\.\s*CreateText\s*\(\s*[^)]*Server\s*\.\s*MapPath\s*\([^)]*\.aspx[^)]*\)[^)]*\)[\s\S]{0,240}<!--#include\s+file='
- id: aspnet-handler-eval-page-template
  desc: ASP.NET handler writes a request-eval page
  crit: suspicious
  conf: 0.98
  for: [asp]
  if:
    type: text
    regex: '(?i)Response\.Write\s*\(\s*eval\s*\(\s*Request\.Item'
- id: aspnet-handler-query-page-writer
  desc: ASP.NET handler writes query.aspx
  crit: suspicious
  conf: 0.97
  for: [asp]
  if:
    type: text
    regex: '(?i)File\.CreateText\s*\([^)]{0,120}query\.aspx'
- id: aspnet-form-configures-http-relay
  desc: ASP.NET form selects an HTTP destination
  crit: suspicious
  conf: 0.97
  if:
    type: text
    regex: '(?i)Request\s*\.\s*Form\s*\[\s*["''](Remoteserver|Endpoint)["'']\s*\]'
- id: aspnet-forwards-request-body-over-http
  desc: ASP.NET forwards request data over HTTP
  crit: suspicious
  conf: 0.97
  if:
    type: text
    regex: '(?is)WebRequest\s*\.\s*Create\s*\([^)]*\)[\s\S]{0,240}\.Method\s*=\s*["'']POST["''][\s\S]{0,500}GetRequestStream\s*\(\)[\s\S]{0,200}\.Write\s*\('
- id: aspnet-relay-returns-remote-response
  desc: ASP.NET returns a remote HTTP response
  crit: notable
  conf: 0.94
  if:
    type: text
    regex: '(?is)GetResponse\s*\(\)[\s\S]{0,300}GetResponseStream\s*\(\)[\s\S]{0,240}Response\s*\.\s*Write\s*\('
# The Request.QueryString / Request.Form reads and the Response.Write sink that
# lived here as `aspnet-request-processstartinfo--rx-6/-rx-9` and
# `aspnet-process-output-response--rx-14` are ordinary ASP.NET request/response
# mechanics (every .aspx page in the .NET Framework uses them); they now live in
# micro-behaviors/communications/http/server/managed.
- id: aspnet-default-recon-command
  desc: ASP.NET webshell default recon command
  crit: suspicious
  conf: 0.95
  if:
    type: text
    substr: whoami /all && hostname && ipconfig
- id: dnn-portals-health-check-webshell
  desc: DNN Portals health-check webshell path
  crit: suspicious
  conf: 0.92
  if:
    type: text
    regex: '/Portals/0/health_check_t\.aspx|health_check_t\.aspx'
composite_rules:
- id: aspnet-server-side-page-installer
  desc: ASP.NET page writes an executable server-side page
  crit: hostile
  conf: 0.99
  for: [asp]
  all:
  - id: micro-behaviors/communications/http/server/managed::aspnet-server-side-script-block
  - id: micro-behaviors/fs/write/file/full::dotnet-writealltext-token
  - id: aspnet-physical-path-page-writer
- id: aspnet-handler-include-page-installer
  desc: ASP.NET handler installs a server-side include page
  crit: hostile
  conf: 0.98
  for: [asp]
  all:
  - id: micro-behaviors/communications/http/server/managed::aspnet-webhandler-directive
  - id: aspnet-handler-include-page-writer
- id: aspnet-handler-eval-page-installer
  desc: ASP.NET handler installs a request-eval page
  crit: hostile
  conf: 0.99
  for: [asp]
  all:
  - id: micro-behaviors/communications/http/server/managed::aspnet-webhandler-directive
  - id: aspnet-handler-eval-page-template
  - id: aspnet-handler-query-page-writer
- id: aspnet-loopback-ftp-command-webshell
  desc: ASP.NET controls an FTP server as a command shell
  crit: hostile
  conf: 0.99
  for: [asp]
  all:
  - id: micro-behaviors/communications/http/server/managed::aspnet-page-directive
  - id: aspnet-loopback-tcpclient-connect
  - id: aspnet-ftp-user-setup-command
  - id: aspnet-ftp-root-directory-grant
  - id: aspnet-ftp-site-exec-command
  - id: aspnet-ftp-command-control-input
- id: aspnet-http-request-relay-webshell
  desc: ASP.NET request proxies data to an attacker-selected HTTP destination
  crit: hostile
  conf: 0.99
  all:
  - id: micro-behaviors/communications/http/server/managed::aspnet-page-directive
  - id: aspnet-form-configures-http-relay
  - id: aspnet-forwards-request-body-over-http
  - id: aspnet-relay-returns-remote-response
- id: aspnet-process-start-any
  desc: ASP.NET child process execution
  crit: notable
  conf: 0.95
  any:
  - id: micro-behaviors/process/create/spawn::start
  - id: micro-behaviors/process/create/start-process::dotnet-process-instance-start
  - id: aspnet-source-process-instance-start
  - id: aspnet-source-process-static-start
- id: aspnet-request-command-webshell
  desc: ASP.NET request command webshell
  crit: hostile
  conf: 0.98
  all:
  - id: aspnet-request-processstartinfo
  any:
  - id: aspnet-process-output-response
  - id: micro-behaviors/process/create/spawn::start-info
  - id: micro-behaviors/process/create/spawn::start
  unless:
  - id: metadata/package/testing/presence/harness::csharp-test-file
  - id: metadata/package/testing/presence/harness::test-fixture-directory
# Encrypted in-memory assembly loaders (the Godzilla/Behinder ASP.NET shape)
# never spawn a process: the request carries a Base64 blob, the handler decrypts
# it with a baked-in Rijndael key, and the plaintext is loaded as an assembly
# through a reflectively resolved `Load` method, so no `Assembly.Load`
# reference appears. The encrypted response framing confirms the channel.
- id: aspnet-request-encrypted-assembly-webshell
  desc: ASP.NET loads request-supplied encrypted bytes as an assembly
  crit: hostile
  conf: 0.98
  all:
  - id: micro-behaviors/communications/http/server/managed::aspnet-request-indexer-access
  - id: micro-behaviors/data/decode/base64::dotnet-frombase64string-text
  - id: micro-behaviors/crypto/symmetric/aes/library::dotnet-rijndael-any
  - id: micro-behaviors/process/interpreter/reflection/resolve::assembly-load-reflected-name
  - id: micro-behaviors/process/interpreter/reflection/runtime::dotnet-reflected-method-invoke
  any:
  - id: micro-behaviors/communications/http/server/managed::aspnet-response-write
  - id: micro-behaviors/crypto/symmetric/encrypt::dotnet-create-encryptor
- id: aspnet-embedded-processrequest-assembly-webshell
  desc: ASP.NET delegates each request to an embedded .NET handler
  crit: hostile
  conf: 0.99
  for: [asp, csharp]
  all:
  - id: micro-behaviors/communications/http/server/managed::aspnet-page-directive
  - id: micro-behaviors/communications/http/server/managed::aspnet-server-side-script-block
  - id: aspnet-base64-embedded-assembly-load
  - id: micro-behaviors/process/interpreter/reflection/runtime::csharp-reflection-method-lookup
  - id: aspnet-reflected-processrequest-method
  - id: micro-behaviors/process/interpreter/reflection/runtime::dotnet-reflected-method-invoke
  - id: aspnet-reflected-context-pass
- id: aspnet-request-body-decrypted-assembly-webshell
  desc: ASP.NET decrypts request bytes and loads them as an assembly
  crit: hostile
  conf: 0.99
  for: [asp]
  all:
  - id: micro-behaviors/communications/http/server/managed::aspnet-page-directive
  - id: micro-behaviors/communications/http/request/superglobal::classic-asp-request-binaryread
  - id: micro-behaviors/crypto/symmetric/aes/library::dotnet-rijndael-decryptor
  - id: micro-behaviors/crypto/symmetric/decrypt::transform-final-block
  - id: aspnet-final-block-assembly-load
- id: aspnet-request-body-action-process-webshell
  desc: ASP.NET dispatches request-carried commands to a child process
  crit: hostile
  conf: 0.99
  for: [asp]
  all:
  - id: micro-behaviors/communications/http/server/managed::aspnet-page-directive
  - id: aspnet-request-input-stream-body
  - id: aspnet-request-body-base64-action-tuple
  - id: aspnet-request-body-split-action-tuple
  - id: aspnet-request-tuple-process-stdin
  - id: aspnet-request-tuple-process-stdout
- id: aspnet-request-form-decrypted-plugin-webshell
  desc: ASP.NET decrypts request data and dispatches into a loaded plugin
  crit: hostile
  conf: 0.99
  for: [asp]
  all:
  - id: micro-behaviors/communications/http/server/managed::aspnet-page-directive
  - id: micro-behaviors/communications/http/server/managed::aspnet-request-form-read
  - id: micro-behaviors/data/decode/base64::dotnet-frombase64string-text
  - id: micro-behaviors/crypto/symmetric/aes/library::dotnet-rijndael-decryptor
  - id: micro-behaviors/crypto/symmetric/decrypt::transform-final-block
  - id: aspnet-request-plugin-assembly-load
  - id: aspnet-request-form-decrypted-plugin-dispatch
- id: aspnet-godzilla-session-assembly-webshell
  desc: ASP.NET decrypts request data into a session-cached plugin shell
  crit: hostile
  conf: 0.99
  for: [asp]
  all:
  - id: micro-behaviors/communications/http/server/managed::aspnet-page-directive
  - id: micro-behaviors/crypto/symmetric/aes/library::dotnet-rijndael-decryptor
  - id: micro-behaviors/crypto/symmetric/decrypt::transform-final-block
  - id: micro-behaviors/process/interpreter/reflection/resolve::assembly-load-reflected-name
  - id: aspnet-godzilla-session-cache-marker
- id: aspnet-default-recon-webshell
  desc: ASP.NET default recon webshell
  crit: hostile
  conf: 0.99
  all:
  - id: aspnet-request-command-webshell
  - id: aspnet-default-recon-command
- id: aspnet-request-processstartinfo
  desc: ASP.NET request launches process
  crit: suspicious
  conf: 0.96
  all:
  - id: aspnet-process-start-any
  # ProcessStart/Info plus cmd.exe is common in benign helpers and wrappers.
  # For a webshell objective, require an actual ASP.NET request source.
  any:
  - id: micro-behaviors/communications/http/server/managed::aspnet-request-querystring-read
  - id: micro-behaviors/communications/http/server/managed::aspnet-request-form-read
  - id: micro-behaviors/communications/http/server/managed::aspnet-request-indexer-access
  - id: aspnet-processstartinfo-control-text
  unless:
  - id: metadata/package/testing/presence/harness::csharp-test-file
  - id: metadata/package/testing/presence/harness::test-fixture-directory
- id: aspnet-process-output-response
  desc: ASP.NET process output response
  crit: notable
  conf: 0.94
  all:
  - id: aspnet-process-start-any
  any:
  - id: micro-behaviors/process/create/exec::powershell-exe-reference
  - id: micro-behaviors/communications/http/server/managed::aspnet-response-write
  - id: aspnet-process-output-rendered
  unless:
  - id: metadata/package/testing/presence/harness::csharp-test-file
  - id: metadata/package/testing/presence/harness::test-fixture-directory
- id: aspnet-process-output-rendered
  desc: ASP.NET returns process output to its caller
  crit: notable
  conf: 0.95
  for: [asp]
  all:
  - id: aspnet-process-output-read
  any:
  - id: micro-behaviors/communications/http/server/managed::aspnet-response-write
  - id: aspnet-process-output-control-sink
