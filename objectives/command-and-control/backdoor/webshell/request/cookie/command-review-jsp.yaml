# A JSP page that turns an HTTP request parameter into a spawned process is a
# webshell: the page is the command channel.
#
# JSP has its own file type. The other carrier types remain for JSP fragments
# that are embedded in files classified from their surrounding content.
defaults:
  platforms:
    - windows
    - unix
  for:
    - jsp
    - java
    - class
    - html
    - javascript
    - python
    - vbs
  mbc: B0030
  attack: T1505.003
composite_rules:
  - id: jsp-cookie-command-webshell
    for: [jsp, python, javascript, java, html]
    desc: JSP decodes a cookie-supplied command and executes it
    crit: hostile
    conf: 0.99
    all:
      - id: metadata/lang/source/language::jsp-server-page
      - id: micro-behaviors/process/create/subprocess/launch::java-runtime-exec-source
      - id: micro-behaviors/data/decode/base64/unspecified::java-base64-decoder-source-call
    any:
      - id: micro-behaviors/communications/http/cookies::servlet-request-cookie-read
      - id: micro-behaviors/communications/http/cookies::servlet-cookie-helper-read
    near_bytes: 4096
