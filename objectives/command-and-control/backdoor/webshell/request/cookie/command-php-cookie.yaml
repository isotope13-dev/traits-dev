defaults:
  platforms: [unix, windows]
  for: [scripts, source]
  attack: T1505.003
traits:
  - id: php-decoded-cookie-shell-sink
    desc: PHP executes URL-decoded cookie commands
    crit: suspicious
    conf: 0.99
    if:
      type: text
      regex: '\b(passthru|system|shell_exec|exec|popen)\s*\(\s*(raw)?urldecode\s*\(\s*\$_COOKIE\s*\['
  # A webshell gates its command sink on one hardcoded cookie value. Legitimate
  # sessions compare an opaque token from a store, not a literal in the source.
  # A literal cookie compare alone is incomplete evidence (themes, flags), so it
  # stays a component leg; cookie-gated-shell-literal-token supplies the verdict.
  - id: php-cookie-literal-token-gate
    desc: PHP cookie compared against a literal token
    crit: component
    conf: 0.95
    if:
      type: text
      regex: '\$_COOKIE\s*\[\s*[''"][\w-]+[''"]\s*\]\s*===?\s*[''"][^''"]{3,}[''"]'
composite_rules:
  # The sink alone is suspicious (cookie-driven shell); a literal gate in the
  # same file is the backdoor authentication that makes it a planted webshell.
  # The cookie superglobal read is notable on its own; it is listed so the
  # hostile verdict rests on two notable-or-higher legs.
  - id: cookie-gated-shell-literal-token
    desc: Cookie-gated PHP shell with a literal token
    crit: hostile
    conf: 0.97
    near_bytes: 256
    all:
      - id: php-decoded-cookie-shell-sink
      - id: php-cookie-literal-token-gate
      - id: micro-behaviors/communications/http/request/superglobal::cookie
  - id: cookie-command-apache-handler-install
    desc: Cookie command execution near Apache PHP handler
    crit: suspicious
    conf: 0.99
    near_bytes: 4096
    all:
      - id: php-decoded-cookie-shell-sink
      - id: micro-behaviors/communications/http/server/route::apache-php-file-handler
  - id: cookie-command-static-asset-alias
    desc: Cookie webshell beside static asset aliases
    crit: hostile
    conf: 0.99
    near_bytes: 4096
    all:
      - id: php-decoded-cookie-shell-sink
      - id: micro-behaviors/communications/http/server/route::apache-php-file-handler
    any:
      - id: micro-behaviors/communications/http/server/route::apache-static-asset-alias
      - id: micro-behaviors/communications/http/server/route::apache-static-asset-regex-alias
