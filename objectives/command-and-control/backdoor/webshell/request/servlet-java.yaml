# A Java servlet that exposes request data to Runtime.exec and streams the
# child output back to the response is a command webshell. Keep this separate
# from the JSP rules: servlet source has no page directive and should not be
# required to look like a server-side template.
defaults:
  platforms: [unix, windows]
  for: [java, class]
  attack: T1505.003
  mbc: B0030

composite_rules:
  - id: java-servlet-command-webshell
    desc: Java servlet request-driven command webshell
    crit: suspicious
    conf: 0.99
    all:
      - id: micro-behaviors/communications/http/request/params::servlet-get-parameter-call
      - id: micro-behaviors/process/create/spawn::java-runtime-exec-source
      - id: micro-behaviors/process/io/stream::java-input-stream-access
    any:
      - id: micro-behaviors/process/create/shell/command-mode::windows-command-shell-invocation
      - id: micro-behaviors/process/create/spawn::java-getruntime-ref
    near_bytes: 4096
    unless:
      - id: well-known/tool/offensive/
