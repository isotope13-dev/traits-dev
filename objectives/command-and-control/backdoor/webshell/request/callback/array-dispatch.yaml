defaults:
  platforms: [windows, unix]
  for: [php]
  attack: T1505.003
  mbc: B0030

traits:
  # A variable callback must follow the request data: one-argument
  # array_filter($_GET[...]) only drops empty values (ProfilePress member
  # directory filters), and literal callbacks ('trim', 'intval') sanitise.
  - id: php-request-array-callback-argument
    desc: PHP array callback receives request data
    crit: suspicious
    conf: 0.95
    if:
      type: tree-sitter
      query: |
        ((function_call_expression
          function: [(name) @api (qualified_name (name) @api)]
          arguments: (arguments
            [(argument
               (array_creation_expression
                 (array_element_initializer
                   (subscript_expression
                     (variable_name (name) @source)))))
             (argument
               (subscript_expression
                 (variable_name (name) @source)))
             (argument
               (variable_name (name) @source))]
            (argument (variable_name))))
          (#any-of? @api "array_intersect_uassoc" "array_uintersect_uassoc" "array_uintersect" "array_intersect_ukey"
                         "array_diff_uassoc" "array_udiff_uassoc" "array_udiff" "array_diff_ukey"
                         "array_filter" "array_walk" "array_walk_recursive" "array_reduce"
                         "usort" "uasort" "uksort")
          (#any-of? @source "_GET" "_POST" "_REQUEST" "_COOKIE"))

  - id: request-array-dangerous-literal-callback
    desc: Request data passed to code-execution callback
    crit: suspicious
    conf: 0.95
    if:
      type: tree-sitter
      query: |
        ((function_call_expression
          function: [(name) @api (qualified_name (name) @api)]
          arguments: (arguments
            [(argument
               (subscript_expression
                 (variable_name (name) @source)))
             (argument
               (variable_name (name) @source))]
            (argument [(string (string_content) @cb) (encapsed_string (string_content) @cb)])))
          (#any-of? @api "array_filter" "array_walk" "array_walk_recursive" "array_reduce"
                         "array_intersect_uassoc" "array_diff_uassoc" "usort" "uasort" "uksort")
          (#any-of? @source "_GET" "_POST" "_REQUEST" "_COOKIE")
          (#match? @cb "^(?i)(assert|system|exec|passthru|shell_exec|popen|create_function)$"))

  - id: request-supplied-array-callback
    desc: Request value used as array callback
    crit: suspicious
    conf: 0.95
    if:
      type: tree-sitter
      query: |
        ((function_call_expression
          function: [(name) @api (qualified_name (name) @api)]
          arguments: (arguments
            (argument)
            (argument
              (subscript_expression
                (variable_name (name) @source)))))
          (#any-of? @api "array_intersect_uassoc" "array_uintersect_uassoc" "array_uintersect" "array_intersect_ukey"
                         "array_diff_uassoc" "array_udiff_uassoc" "array_udiff" "array_diff_ukey"
                         "array_filter" "array_walk" "array_walk_recursive" "array_reduce"
                         "usort" "uasort" "uksort")
          (#any-of? @source "_GET" "_POST" "_REQUEST" "_COOKIE"))


composite_rules:
  - id: php-request-array-callback-webshell
    desc: Request input drives array callback webshell
    crit: hostile
    conf: 0.98
    # Both legs already restrict the call to the callback array APIs.
    all:
      - id: micro-behaviors/communications/http/request/superglobal::php-request-parameter-access
    any:
      - id: php-request-array-callback-argument
      - id: request-supplied-array-callback
      - id: request-array-dangerous-literal-callback
