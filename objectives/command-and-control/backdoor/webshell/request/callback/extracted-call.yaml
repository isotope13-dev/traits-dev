defaults:
  platforms: [linux, macos, windows]
  for: [php]
  attack: T1505.003
  mbc: B0030
traits:
- id: request-import-immediate-dynamic-call
  desc: Request overwrite precedes variable invocation
  crit: notable
  conf: 0.95
  if:
    type: tree-sitter
    # Sibling executable statements, not a payload quoted in a string or
    # comment. The default extract mode allows the request to overwrite both
    # the callable and its argument. EXTR_SKIP / EXTR_PREFIX_* do not qualify.
    query: |
      ((_
        (expression_statement) @import
        . (comment)*
        . (expression_statement) @invoke)
        (#match? @import "^@?\\s*(?i:extract)\\s*\\(\\s*\\$_REQUEST\\s*\\)\\s*;$")
        (#match? @invoke "^@?\\s*((?i:die|exit)\\s*\\(\\s*)?\\$\\w+\\s*\\(\\s*\\$\\w+\\s*\\)\\s*\\)?\\s*;$"))
composite_rules:
- id: request-extracted-call-response
  desc: Request import with variable-call exit response
  crit: hostile
  conf: 0.9
  near_lines: 3
  near_bytes: 128
  all:
  - id: request-import-immediate-dynamic-call
  - id: micro-behaviors/communications/http/request/superglobal::extract-request
  - id: micro-behaviors/process/exit/terminate::exit-dynamic-call-result
