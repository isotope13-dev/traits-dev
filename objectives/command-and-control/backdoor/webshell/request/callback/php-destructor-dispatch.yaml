defaults:
  platforms: [windows, unix]
  for: [php, html, text]

traits:
  - id: php-encoded-request-destructor-dispatch
    desc: PHP destructor dispatches decoded request data
    crit: hostile
    conf: 0.97
    attack: T1505.003,T1059
    if:
      type: yara
      source: |
        rule php_encoded_request_destructor_dispatch {
          meta:
            filetypes = "php,html,text"
          strings:
            $xor = /=\s*['"][^'"\r\n]{1,8}['"]\s*\^\s*['"][^'"\r\n]{1,12}['"]\s*;/
            $join = /=\s*\$\w+(\s*\.\s*\$\w+){3,12}\s*;/
            $destructor = /function\s+__destruct\s*\(\s*\)\s*\{[^}]{0,160}@?\$\w+\s*\(\s*\$this\s*->\s*\w+\s*\)/ nocase
            $decode = /\$\w+\s*->\s*\w+\s*=[^;]{0,180}base64_decode\s*\(\s*\$_(GET|POST|REQUEST|COOKIE)\s*\[/ nocase
          condition:
            #xor >= 4 and $join and $destructor and $decode and
            @join < @destructor and @destructor < @decode and
            @decode - @join < 1200
        }
