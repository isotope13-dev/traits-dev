# ColdFusion pages that bind a browser form field to `<cfexecute>` are a
# command channel: the HTTP request is the shell. Distinct from the
# file-manager composite (filesystem mutations + optional exec) — this rule
# only requires the request→execute sink.
#
# Carrier types match metadata/lang/scripted::cfml-output-tag: a .cfm has no
# `cfml` file type and lands on vbs/javascript/html by content weight.
defaults:
  platforms: [unix, windows]
  for: [vbs, html, javascript]
  attack: T1505.003
  mbc: B0030
traits:
  - id: cfml-command-form-field
    desc: ColdFusion form field named command
    crit: component
    conf: 0.85
    if:
      type: text
      regex: '(?i)(name\s*=\s*["'']command["'']|isDefined\s*\(\s*["'']command["''])'
composite_rules:
  - id: cfml-request-command-shell
    desc: ColdFusion request parameter drives cfexecute
    crit: hostile
    conf: 0.97
    all:
      - id: metadata/lang/scripted::cfml-output-tag
      - id: micro-behaviors/process/create/exec::cfexecute-tag
      - id: cfml-command-form-field
