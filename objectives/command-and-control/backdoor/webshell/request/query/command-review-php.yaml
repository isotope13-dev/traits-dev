defaults:
  crit: suspicious
  conf: 0.9
  platforms:
  - windows
  - unix
  for:
  - php
  mbc: B0030
  attack: T1505.003
composite_rules:
- id: php-shell-comp
  desc: PHP $_GET-driven command execution (webshell pattern)
  crit: suspicious
  conf: 0.9
  all:
  - id: metadata/lang/scripted::php-open-tag
  - id: objectives/command-and-control/backdoor/webshell/command::exec-user-input-get-text
  unless:
  - id: metadata/package/documentation/security-catalog::quoted-command-reference-contexts
  - id: metadata/package/documentation/security-exercise::fenced-pentest-methodology-documentation
  - id: metadata/package/testing/corpus/security-tests::php-taint-engine-fixture-context
  - id: metadata/package/testing/corpus/security-tests::rust-php-taint-parser-tests
  - id: metadata/lang/source/origin::base64-decoded-source-layer
  downgrade:
    scope: parent
    any:
    - id: metadata/package/documentation/security-catalog::parent-command-example-context
    - id: well-known/tool/offensive/projectdiscovery::nuclei-yaml-template-header
