defaults:
  platforms: [windows]
  for: [asp]
  crit: notable
  conf: 0.96
traits:
  - id: vb-process-form-path
    desc: VB process path comes from text control
    if:
      type: text
      regex: '(?i)\bnew\s+ProcessStartInfo\s*\(\s*[a-z_][a-z0-9_]*\.text\s*\)'
  - id: vb-process-form-arguments
    desc: VB process arguments come from text control
    if:
      type: text
      regex: '(?i)\.Arguments\s*=\s*[a-z_][a-z0-9_]*\.text\b'
  - id: vb-process-output-form-result
    desc: VB writes process output to text control
    if:
      type: text
      regex: '(?i)\b[a-z_][a-z0-9_]*\.text\s*=\s*[^\r\n]{0,100}\b[a-z_][a-z0-9_]*\s*&\s*"</pre>"'
composite_rules:
  - id: aspnet-vb-program-arguments-output-shell
    desc: ASP.NET form runs program and shows output
    crit: hostile
    attack: T1505.003,T1059.003
    all:
      - id: vb-process-form-path
      - id: vb-process-form-arguments
      - id: vb-process-output-form-result
      - id: metadata/lang/source/syntax/directive::aspnet-page-directive
      - id: micro-behaviors/ui/controls/input::aspnet-server-textbox-control
      - id: micro-behaviors/process/stdio/configure::dotnet-standard-output-redirection
