defaults:
  platforms:
  - windows
  - unix
  for:
  - php
  mbc: B0030
  attack: T1505.003,T1059
  crit: hostile
composite_rules:
- id: php-variable-command-webshell
  desc: PHP command form with variable execution
  conf: 0.95
  all:
  - id: micro-behaviors/communications/http/request/superglobal::request-isset-default-assignment
  - id: micro-behaviors/ui/controls/input::php-command-named-form-control
  any:
  - id: micro-behaviors/process/create/shell/variable-command::php-variable-shell-command
  - id: micro-behaviors/process/create/variable::proc-open-variable-argument
  unless:
  - id: metadata/file/extension/identity::markdown-file-basename
