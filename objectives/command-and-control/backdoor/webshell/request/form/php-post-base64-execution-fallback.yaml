defaults:
  crit: suspicious
  platforms: [unix, windows]
  for: [php]
composite_rules:
  - id: php-post-base64-execution-fallback
    desc: PHP POST and Base64 with probed execution fallbacks
    conf: 0.98
    all:
      - id: micro-behaviors/communications/http/request/superglobal::post-dup
      - id: micro-behaviors/data/decode/base64/unspecified::php-base64-decode-call
      - id: micro-behaviors/metaprogramming/reflection/invoke::php-loop-execution-availability-probe
    any:
      - id: micro-behaviors/process/create/shell/variable-command::exec-variable-argument-exec
      - id: micro-behaviors/process/create/shell/variable-command::exec-variable-argument-system
      - id: micro-behaviors/process/create/shell/variable-command::exec-variable-argument-shell
      - id: micro-behaviors/process/create/shell/variable-command::exec-variable-argument-passthru
      - id: micro-behaviors/process/create/variable::proc-open-variable-argument
      - id: micro-behaviors/process/create/shell/variable-command::php-variable-shell-command
    needs: 2
