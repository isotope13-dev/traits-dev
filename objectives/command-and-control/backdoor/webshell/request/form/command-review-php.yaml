defaults:
  crit: suspicious
  conf: 0.9
  platforms:
  - windows
  - unix
  for:
  - php
  mbc: B0030
  attack: T1505.003
composite_rules:
- id: php-shell-post
  desc: PHP $_POST-driven command execution (webshell pattern)
  crit: suspicious
  conf: 0.9
  any:
  - id: objectives/command-and-control/backdoor/webshell/command::exec-user-input-post--g1
  - id: objectives/command-and-control/backdoor/webshell/command::exec-user-input-post--g2
  unless:
  - id: well-known/tool/offensive/projectdiscovery::nuclei-template-artifact
  - id: well-known/tool/offensive/framework/bingo/
  - id: well-known/tool/offensive/exploitdb::published-script-wrapper
  - id: metadata/package/documentation/security-exercise::scoped-security-test-documentation
  downgrade:
    scope: parent
    any:
    - id: metadata/package/documentation/security-catalog::parent-command-example-context
