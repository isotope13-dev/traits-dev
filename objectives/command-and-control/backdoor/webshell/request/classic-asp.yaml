defaults:
  platforms: [windows]
  # These indicators describe Classic ASP/VBScript source.  Applying them to
  # arbitrary JavaScript bundles makes ordinary library text look like a
  # webshell (for example Swagger UI's bundled decoder documentation).
  for: [vbs, html, elixir, asp]
  attack: T1505.003
  mbc: B0030

traits:
  - id: asp-decoded-execute
    desc: Classic ASP decoded execute
    crit: suspicious
    conf: 0.94
    if:
      type: text
      regex: '(?i)execute\s*\(\s*decode\s*\('

  - id: asp-request-eval-decoder
    desc: Classic ASP request eval decoder
    crit: suspicious
    conf: 0.95
    if:
      type: text
      # A VBScript Function header ends its parameter list at end of line; the
      # brace form is a JavaScript `function decode(...) {` helper, which every
      # bundled JPEG/base64 decoder in a web asset carries.
      regex: '(?im)^\s*Function\s+DeCode\s*\(.{0,60}\)\s*$|Asc\(\s*Curchar\s*\)\s*-\s*3'
    unless:
      - id: metadata/build/bundler/vscode::javascript-source-map-file
      - id: well-known/lib/format/iconv-lite::iconv-lite-decode-runtime
      - id: well-known/app/communication/thunderbird::firefox-omni-runtime-path

  - id: asp-script-encoder-directive
    desc: Classic ASP VBScript.Encode language directive
    crit: suspicious
    conf: 0.93
    if:
      type: text
      substr: VBScript.Encode
  - id: asp-script-timeout-large
    desc: Raises Classic ASP script timeout high
    crit: suspicious
    conf: 0.9
    if:
      type: text
      regex: '(?i)Server\.ScriptTimeout\s*=\s*[1-9][0-9]{4,}'
  - id: asp-hardcoded-userpass
    desc: Hardcodes a Classic ASP login password
    crit: suspicious
    conf: 0.92
    if:
      type: text
      regex: '(?i)\bUserPass\s*=\s*["''][^"'']{1,64}["'']'

  - id: asp-request-chr-field
    desc: ASP request field selected through Chr
    crit: suspicious
    conf: 0.94
    if:
      type: text
      regex: '(?i)\bRequest\s*\(\s*Chr\s*\(\s*\d{1,3}\s*\)\s*\)'

  - id: asp-executeglobal-request-field
    desc: ExecuteGlobal evaluates a request field
    crit: suspicious
    conf: 0.97
    if:
      type: text
      regex: '(?i)ExecuteGlobal\s+Request\s*\(\s*["''][^"'']{1,64}["'']\s*\)'

composite_rules:
  - id: classic-asp-request-eval-webshell
    desc: Classic ASP evaluates a request-selected field
    crit: hostile
    conf: 0.99
    for: [asp, vbs]
    all:
      - id: micro-behaviors/process/interpreter/eval/direct::vbs-eval-function
      - id: asp-request-chr-field

  - id: classic-asp-request-executeglobal-webshell
    desc: Classic ASP evaluates a request-backed global script
    crit: hostile
    conf: 0.99
    for: [asp, vbs]
    all:
      - id: micro-behaviors/process/interpreter/eval/direct::vbs-executeglobal
    any:
      - id: asp-executeglobal-request-field
      - id: asp-request-chr-field

  - id: classic-asp-decoded-eval-webshell
    desc: Classic ASP decoded eval webshell
    crit: hostile
    conf: 0.98
    all:
      - id: asp-decoded-execute
      - id: asp-request-eval-decoder
  - id: classic-asp-command-webshell
    for: [vbs, asp]
    desc: Classic ASP request-facing command shell
    crit: hostile
    conf: 0.98
    all:
      - id: metadata/lang/scripted::vbscript-valid
      - id: micro-behaviors/communications/http/request/superglobal::classic-asp-request-field
    any:
      - id: micro-behaviors/process/create/shell/script-host::cmd-exe-c-command
      - id: micro-behaviors/process/create/shell/spawn::shell-execution-comp
      - id: objectives/execution/wmi::process-startup-create-variable

  - id: classic-asp-http-command-stager
    for: [vbs, asp]
    desc: Classic ASP command shell with outbound HTTP staging
    crit: hostile
    conf: 0.98
    all:
      - id: classic-asp-command-webshell
      - id: micro-behaviors/communications/http/client/vba::http-open-send

  - id: classic-asp-privileged-command-webshell
    for: [vbs, asp]
    desc: Classic ASP command shell with privilege or admin access
    crit: hostile
    conf: 0.99
    all:
      - id: classic-asp-command-webshell
    any:
      - id: micro-behaviors/os/user/account::net-localgroup-administrators-add
      - id: micro-behaviors/communications/http/response::http-401-unauthorized
      - id: objectives/execution/interpreter/vbscript/wmi::startup-spawn-instance

  - id: classic-asp-script-encoded-file-manager
    desc: Classic ASP Script Encoder-wrapped file manager shell
    crit: hostile
    conf: 0.98
    for: [vbs, html, asp]
    all:
      - id: asp-script-encoder-directive
      - id: micro-behaviors/os/com/automation::filesystemobject-progid
    any:
      - id: micro-behaviors/fs/write/content::create-text-file-api
      - id: micro-behaviors/fs/delete/file/self::fso-deletefile-call
      - id: micro-behaviors/fs/file/copy::fso-copyfile
      - id: micro-behaviors/communications/http/download/wsh::adodb-stream-object
      - id: micro-behaviors/process/create/shell/script-host::cmd-exe-c-command
      - id: micro-behaviors/process/create/shell/script-host::wscript-shell-run-create
      - id: micro-behaviors/communications/http/request/superglobal::classic-asp-request-field

  - id: classic-asp-script-encoded-command-shell
    for: [vbs, asp]
    desc: Classic ASP Script Encoder-wrapped command shell
    crit: hostile
    conf: 0.98
    all:
      - id: asp-script-encoder-directive
      - id: micro-behaviors/process/create/shell/script-host::cmd-exe-c-command
    any:
      - id: micro-behaviors/os/com/automation::filesystemobject-progid
      - id: micro-behaviors/process/create/shell/script-host::wscript-shell-run-create
      - id: micro-behaviors/communications/http/request/superglobal::classic-asp-request-field
  - id: classic-asp-encoded-timeout-gate
    desc: Script-encoded ASP raises a long timeout
    crit: hostile
    conf: 0.97
    all:
      - id: asp-script-encoder-directive
      - id: asp-script-timeout-large
  - id: classic-asp-encoded-password-gate
    desc: Script-encoded ASP uses a hardcoded password
    crit: hostile
    conf: 0.97
    all:
      - id: asp-script-encoder-directive
      - id: asp-hardcoded-userpass
  - id: classic-asp-timeout-password-gate
    desc: ASP webshell pairs password with long timeout
    crit: hostile
    conf: 0.96
    all:
      - id: asp-script-timeout-large
      - id: asp-hardcoded-userpass
