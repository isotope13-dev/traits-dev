defaults:
  platforms: [unix, windows]
  for: [php]
  attack: T1505.003,T1059
traits:
  - id: php-decoded-header-command
    desc: Executes decoded request header commands
    crit: suspicious
    conf: 0.99
    if:
      type: tree-sitter
      language: php
      kind: call
      regex: '\b(shell_exec|system|exec|passthru)\s*\(\s*base64_decode\s*\(\s*\$_SERVER\s*\[[''"]HTTP_'
composite_rules:
  - id: php-encoded-header-command-webshell
    desc: Encoded HTTP header command webshell
    crit: hostile
    conf: 0.99
    near_bytes: 256
    all:
      - id: php-decoded-header-command
      - id: micro-behaviors/data/decode/base64::php-base64-decode-call
    any:
      - id: micro-behaviors/process/create/shell/spawn::php-shell-exec
      - id: micro-behaviors/process/create/shell/spawn::php-system-call
      - id: micro-behaviors/process/create/shell/spawn::php-exec
      - id: micro-behaviors/process/create/shell/spawn::php-passthru
