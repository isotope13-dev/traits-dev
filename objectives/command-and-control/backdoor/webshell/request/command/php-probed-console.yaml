composite_rules:
- crit: hostile
  platforms:
  - windows
  - unix
  for:
  - php
  attack: T1505.003,T1059
  mbc: B0030
  id: php-probed-execution-fallback-console
  desc: PHP decoded POST command and fallback probes
  conf: 0.98
  all:
  - id: micro-behaviors/communications/http/request/superglobal::post-dup
  - id: micro-behaviors/data/decode/base64::php-base64-decode-call
  - id: micro-behaviors/metaprogramming/reflection/invoke::php-loop-execution-availability-probe
  any:
  - id: micro-behaviors/process/create/shell/lang::php-variable-shell-command
  - id: micro-behaviors/process/create/subprocess::proc-open-variable-argument
  unless:
  - id: well-known/app/publishing/wordpress-plugins/catalog::known-wordpress-plugin
  - id: metadata/path::test-directory-component
  - id: metadata/file/extension/identity::markdown-file-basename
