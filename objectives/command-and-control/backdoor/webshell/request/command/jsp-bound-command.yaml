# JSP facts do not expose a flow graph. This lexical binding requires the same
# local cmd name at request assignment and execution; proximity bounds the pair.
# Multiple cmd assignments are excluded: this is a lexical check, not dataflow.
# Direct request-at-sink execution uses the existing canonical sink observation.
# The alias shape below covers the helper-indirection spelling: the page reads
# getParameter("cmd") at one site and a Runtime stored in a local variable
# executes a cmd-named value inside the helper. The same-name join is the
# binding evidence; the composite adds the request-side read.
defaults:
  platforms: [unix, windows]
  for: [jsp, python, javascript, java, vbs, html]
  attack: T1505.003
  mbc: B0030
traits:
  - id: jsp-request-cmd-local-exec
    desc: Request cmd passed to getRuntime().exec
    crit: suspicious
    conf: 0.96
    if:
      type: text
      regex: '(?s)\bcmd\s*=\s*request\..{0,50};.{0,300}getRuntime\(\)\.exec\([^;]{0,40}\bcmd\)'
      exclude_html_comments: true
    unless:
      - type: text
        regex: '(?s)\bcmd\s*=[^=].{0,400}\bcmd\s*=[^=]'

  # Sink half of the helper-indirection shape: the receiver is a variable
  # assigned from Runtime.getRuntime(), not the chained call, so the sibling
  # binding regex and the direct request-at-sink atom both miss it.
  - id: jsp-runtime-alias-cmd-exec
    desc: Runtime alias exec of a cmd-named value
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?s)Runtime\s+\w+\s*=\s*Runtime\.getRuntime\(\).{0,500}\w+\.exec\(\s*cmd\b'
      exclude_html_comments: true

composite_rules:
  - id: jsp-local-request-command-execution
    desc: JSP request cmd binding beside Runtime execution
    crit: hostile
    conf: 0.96
    all:
      - id: metadata/lang/scripted::jsp-server-page
      - id: jsp-request-cmd-local-exec
      - id: micro-behaviors/process/info/query::java-getruntime-ref
    any:
      - id: micro-behaviors/process/create/exec::java-runtime-exec-source
      - id: micro-behaviors/process/create/exec::java-runtime-variable-exec-source
    unless:
      - id: well-known/tool/offensive/payload-corpus::payloadsallthethings-release-member
      - id: micro-behaviors/metaprogramming/generation::configured-assessment-plugin
