# Request-origin arguments supplied to a cmd.exe call.
defaults:
  platforms: [unix, windows]
  for: [cfml]
  crit: notable
  attack: T1059
traits:
  - id: cfexecute-request-cmd-arguments
    desc: CFML request member supplies cmd.exe arguments
    conf: 0.9
    if:
      type: symbol
      kind: call
      exact: cfexecute
      args:
        - index: 0
          from:
            field: name
            whole_value: '(?i)(^|[\\/])cmd\.exe$'
        - index: 0
          from:
            field: arguments
            member: '^(form|url)\.'
