defaults:
  platforms: [windows]
  # These indicators describe Classic ASP/VBScript source.  Applying them to
  # arbitrary JavaScript bundles makes ordinary library text look like a
  # webshell (for example Swagger UI's bundled decoder documentation).
  for: [vbs, html, elixir, asp]
  attack: T1505.003
  mbc: B0030

composite_rules:
  - id: classic-asp-command-form-wsh-execution
    for: [vbs, asp]
    desc: ASP command form and WSH execution co-occur
    crit: hostile
    conf: 0.96
    near_lines: 30
    all:
      - id: micro-behaviors/communications/http/request/superglobal::classic-asp-command-form-field
      - id: micro-behaviors/process/create/exec::wsh-reference-near-variable-call
    unless:
      - id: "metadata/lang/source/shape::yara-rule-source"
      - id: well-known/tool/detection/security-scanner::anteumbra-package-tree-member

  - id: classic-asp-http-command-stager
    for: [vbs, asp]
    desc: ASP command shell with outbound HTTP staging
    crit: hostile
    conf: 0.98
    all:
      - id: classic-asp-command-form-wsh-execution
      - id: micro-behaviors/communications/http/client/vba::http-open-send

  - id: classic-asp-loosened-output-webshell
    for: [vbs, asp]
    desc: ASP shell grants Everyone full control
    crit: hostile
    conf: 0.98
    near_lines: 30
    all:
      - id: classic-asp-command-form-wsh-execution
      - id: micro-behaviors/fs/acl::cacls-grant-everyone-full

  - id: classic-asp-privileged-command-webshell
    for: [vbs, asp]
    desc: ASP command shell with admin-access clues
    crit: hostile
    conf: 0.99
    all:
      - id: classic-asp-command-form-wsh-execution
    any:
      - id: micro-behaviors/os/group/membership::net-localgroup-administrators-add
      - id: micro-behaviors/communications/http/response::http-401-unauthorized
      - id: objectives/execution/interpreter/vbscript/wmi::startup-spawn-instance

  - id: classic-asp-script-encoded-command-shell
    for: [vbs, asp]
    desc: Classic ASP Script Encoder-wrapped command shell
    crit: hostile
    conf: 0.98
    all:
      - id: metadata/lang/runtime::asp-script-encoder-directive
      - id: micro-behaviors/process/create/shell/command-mode::cmd-exe-c-command
    any:
      - id: micro-behaviors/os/com/automation::filesystemobject-progid
      - id: micro-behaviors/process/create/exec::wsh-progid-near-run
      - id: micro-behaviors/communications/http/request/superglobal::classic-asp-request-field
  - id: classic-asp-encoded-timeout-gate
    desc: Script-encoded ASP raises a long timeout
    crit: hostile
    conf: 0.97
    all:
      - id: metadata/lang/runtime::asp-script-encoder-directive
      - id: micro-behaviors/process/resources/limits::asp-script-timeout-large
