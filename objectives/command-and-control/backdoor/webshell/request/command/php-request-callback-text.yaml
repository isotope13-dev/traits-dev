defaults:
  for: [php, markdown]
  platforms: [unix, windows]
  attack: T1505.003,T1059

traits:
  - id: php-request-callback-with-request-argument
    desc: Request selects PHP callback and its argument
    crit: hostile
    conf: 0.98
    if:
      type: text
      regex: '\$_(GET|POST|REQUEST)\[[^\]\n]{1,40}\]\s*\(\s*\$_(GET|POST|REQUEST)\['
  - id: php-direct-eval-request-code
    desc: PHP code evaluates supplied request input
    crit: hostile
    conf: 0.98
    if:
      type: text
      regex: '<\?php\s+eval\s*\(\s*\$_(GET|POST|REQUEST|COOKIE)\['
