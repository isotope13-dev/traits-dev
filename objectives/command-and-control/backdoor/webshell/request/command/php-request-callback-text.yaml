defaults:
  for: [php, markdown]
  platforms: [unix, windows]
  attack: T1505.003,T1059

traits:
  - id: php-request-callback-with-request-argument
    desc: Request selects PHP callback and its argument
    crit: hostile
    conf: 0.98
    if:
      type: text
      regex: '\$_(GET|POST|REQUEST)\[[^\]\n]{1,40}\]\s*\(\s*\$_(GET|POST|REQUEST)\['
    unless:
      # Scoped assessment documentation quotes these payloads as examples;
      # the file is a document, not a deployed webshell.
      - id: metadata/package/documentation/security-exercise::scoped-security-test-documentation
      # A PHP snippet decoded from a Markdown Base64 literal is quoted
      # example data; carrier rules evaluate deployment evidence.
      - id: metadata/lang/source/origin::markdown-decoded-php-snippet
      # A skill guide that pairs the quoted payloads with a remediation
      # section teaches the vulnerability; it does not deploy a handler.
      - id: metadata/package/documentation/security-exercise::defense-technique-reference
  - id: php-direct-eval-request-code
    desc: PHP request-fed eval payload
    crit: hostile
    conf: 0.98
    for: [php]
    # Parsed argument shape excludes predicates, comments and quoted examples.
    # Facts currently expose PHP subscripts as opaque expressions, so reuse
    # the existing structural request-to-eval observation.
    if:
      id: objectives/command-and-control/backdoor/webshell/request/eval::php-direct-request-eval
    unless:
      # Scoped assessment documentation quotes these payloads as examples;
      # the file is a document, not a deployed webshell.
      - id: metadata/package/documentation/security-exercise::scoped-security-test-documentation
      - id: well-known/app/system/anthropic-cybersecurity-skills::cybersecurity-skill-documentation
      # A PHP snippet decoded from a Markdown Base64 literal is quoted
      # example data; carrier rules evaluate deployment evidence.
      - id: metadata/lang/source/origin::markdown-decoded-php-snippet
    downgrade:
      # A code-view page renders source files for browsing; a payload decoded
      # from the displayed bytes is shown, not deployed. The content stays
      # visible at suspicious; deployment claims need the carrier's own
      # evidence. The rendered-page marker matches the containing page, so
      # the downgrade reads the immediate parent's findings.
      scope: parent
      any:
        - id: well-known/tool/development/vcs/github-web::blob-page-rendered-source
  # In Markdown, only a webshell body laid out as file content (the tag
  # opens the line, optionally behind a GIF polyglot header) is a payload.
  # A tag quoted mid-line inside an `echo '...'` step or a "decodes to:"
  # explanation is attack-technique prose, not a deployable file.
  - id: php-direct-eval-request-code-block
    desc: Markdown carries request-fed PHP eval file body
    crit: hostile
    conf: 0.97
    for: [markdown]
    if:
      type: text
      regex: '(?im)^[ \t]*(GIF8[79]a)?<\?php\s+@?eval\s*\(\s*\$_(GET|POST|REQUEST|COOKIE)\s*\['
    unless:
      - id: metadata/package/documentation/security-exercise::scoped-security-test-documentation
      - id: metadata/lang/source/origin::markdown-decoded-php-snippet
      - id: metadata/package/documentation/security-exercise::defense-technique-reference
