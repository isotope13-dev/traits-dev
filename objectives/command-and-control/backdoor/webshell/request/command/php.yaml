defaults:
  crit: suspicious
  conf: 0.9
  platforms:
  - windows
  - unix
  for:
  - php
  mbc: B0030
  attack: T1505.003
composite_rules:
- id: php-tiny-system-request-webshell
  desc: Tiny PHP request-fed system-call pattern
  crit: hostile
  conf: 0.96
  size_max: 512
  all:
  - id: micro-behaviors/process/create/shell/command-string::php-system-call
  - id: micro-behaviors/process/create/shell/command-string::php-system-request-source
  unless:
  - id: metadata/file/encoding::decoded-base64-layer
  - id: metadata/lang/source/shape::javascript-literal-tables-pure-helpers
  - id: well-known/tool/offensive/
  - id: metadata/package/testing/harness/unit::unit-test-quoted-webshell-fixture
  - id: micro-behaviors/metaprogramming/generation::configured-assessment-plugin
  - id: micro-behaviors/metaprogramming/generation::parameterized-shell-command-builder
  - id: micro-behaviors/metaprogramming/generation::configured-payload-generator
  - id: metadata/lang/source/origin::yaml-percent-decoded-source-layer
  downgrade:
    scope: parent
    any:
    - id: well-known/tool/offensive/projectdiscovery::nuclei-yaml-template-header
- id: php-tiny-request-command-webshell
  desc: Tiny PHP file runs request input as command
  # The alternate command-sink forms for $_REQUEST: a
  # sub-512-byte file whose only job is handing a request parameter to
  # system/exec/shell_exec or passthru/popen/proc_open, directly or through
  # an adjacent request assignment with the same bound variable.
  crit: hostile
  conf: 0.96
  size_max: 512
  all:
  - id: metadata/lang/scripted::php-open-tag
  any:
  - id: micro-behaviors/process/create/shell/command-string::exec-user-input-request--g1
  - id: micro-behaviors/process/create/shell/command-string::exec-user-input-request--g2
  - id: micro-behaviors/process/create/shell/lang::php-request-default-to-echoed-shell
  unless:
  - id: metadata/package/testing/presence/harness::go-test-file
  - id: well-known/tool/offensive/
  - id: micro-behaviors/metaprogramming/generation::configured-assessment-plugin
  - id: micro-behaviors/metaprogramming/generation::parameterized-shell-command-builder
  - id: micro-behaviors/metaprogramming/generation::configured-payload-generator
- id: php-shell-comp
  desc: PHP $_GET-driven command execution (webshell pattern)
  crit: suspicious
  conf: 0.9
  all:
  - id: metadata/lang/scripted::php-open-tag
  - id: micro-behaviors/process/create/shell/command-string::exec-user-input-get-text
  unless:
  - id: metadata/file/encoding::decoded-base64-layer
  - id: metadata/lang/source/shape::javascript-literal-tables-pure-helpers
  - id: micro-behaviors/ui/help::escaped-local-command-reference
  - id: well-known/tool/offensive/
  - id: metadata/file/naming::test-directory-component
  - id: metadata/file/extension/identity::markdown-file-basename
  downgrade:
    scope: parent
    any:
    - id: micro-behaviors/ui/help::escaped-local-command-reference
    - id: well-known/tool/offensive/projectdiscovery::nuclei-yaml-template-header
- id: php-shell-post
  desc: PHP $_POST-driven command execution (webshell pattern)
  crit: suspicious
  conf: 0.9
  any:
  - id: micro-behaviors/process/create/shell/command-string::exec-user-input-post--g1
  - id: micro-behaviors/process/create/shell/command-string::exec-user-input-post--g2
  unless:
  - id: well-known/tool/offensive/projectdiscovery::nuclei-template-artifact
  - id: well-known/tool/offensive/bingo/
  - id: well-known/tool/offensive/exploitdb::published-script-wrapper
  - id: micro-behaviors/process/create/shell/command-string::extension-origin-local-helper
- id: php-shell-request
  desc: PHP $_REQUEST-driven command execution (webshell pattern)
  crit: suspicious
  conf: 0.9
  any:
  - id: micro-behaviors/process/create/shell/command-string::exec-user-input-request--g1
  - id: micro-behaviors/process/create/shell/command-string::exec-user-input-request--g2
  unless:
  - id: well-known/tool/offensive/projectdiscovery::nuclei-template-artifact
  - id: micro-behaviors/metaprogramming/generation::configured-assessment-plugin
  - id: micro-behaviors/metaprogramming/generation::parameterized-shell-command-builder
  - id: metadata/package/testing/presence/harness::go-test-file
