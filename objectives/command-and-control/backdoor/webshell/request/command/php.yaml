defaults:
  crit: suspicious
  conf: 0.9
  platforms:
  - windows
  - unix
  for:
  - php
  mbc: B0030
  attack: T1505.003
composite_rules:
- id: php-tiny-system-get-webshell
  desc: Tiny PHP file runs system() on a GET param
  # A file this small that does nothing but hand a GET parameter to system()
  # is a drop-in command shell, not an application using exec incidentally.
  crit: hostile
  conf: 0.96
  size_max: 512
  all:
  - id: micro-behaviors/process/create/shell/spawn::php-system-call
  - id: objectives/command-and-control/backdoor/webshell/exec::php-system-get-param
  unless:
    - id: well-known/tool/offensive/raxuiscli::source-tree-path
    - id: well-known/tool/offensive/projectdiscovery::nuclei-yaml-template-header
  downgrade:
    scope: parent
    any:
      - id: well-known/tool/offensive/projectdiscovery::nuclei-yaml-template-header
- id: php-tiny-request-command-webshell
  desc: Tiny PHP file runs a $_REQUEST param as command
  # The $_REQUEST spelling of the GET rule above, for any command sink: a
  # sub-512-byte file whose only job is handing a request parameter to
  # system/exec/shell_exec or passthru/popen/proc_open.
  crit: hostile
  conf: 0.96
  size_max: 512
  all:
  - id: metadata/lang/scripted::php-open-tag
  any:
  - id: micro-behaviors/process/create/shell/lang::exec-user-input-request--g1
  - id: micro-behaviors/process/create/shell/lang::exec-user-input-request--g2
  unless:
  # A detector's own Go test file quoting webshell fixtures for its watcher
  # to flag: quoted payload, not a shipped shell.
  - id: metadata/package/testing/presence/harness::go-test-file
- id: php-shell-comp
  desc: PHP $_GET-driven command execution (webshell pattern)
  crit: suspicious
  conf: 0.9
  all:
  - id: metadata/lang/scripted::php-open-tag
  - id: micro-behaviors/process/create/shell/lang::exec-user-input-get-text
  unless:
  - id: micro-behaviors/ui/help::escaped-local-command-reference
  - id: well-known/tool/offensive/
  - id: metadata/file/naming::test-directory-component
  - id: metadata/file/extension/identity::markdown-file-basename
  downgrade:
    scope: parent
    any:
    - id: micro-behaviors/ui/help::escaped-local-command-reference
    - id: well-known/tool/offensive/projectdiscovery::nuclei-yaml-template-header
- id: php-shell-post
  desc: PHP $_POST-driven command execution (webshell pattern)
  crit: suspicious
  conf: 0.9
  all:
  - id: metadata/lang/scripted::php-open-tag
  any:
  - id: micro-behaviors/process/create/shell/lang::exec-user-input-post--g1
  - id: micro-behaviors/process/create/shell/lang::exec-user-input-post--g2
  unless:
  - id: well-known/tool/offensive/projectdiscovery::nuclei-template-artifact
  - id: well-known/tool/offensive/bingo/
  - id: well-known/tool/offensive/exploitdb::published-script-wrapper
  - id: micro-behaviors/process/create/shell/lang::extension-origin-local-helper
- id: php-shell-request
  desc: PHP $_REQUEST-driven command execution (webshell pattern)
  crit: suspicious
  conf: 0.9
  all:
  - id: metadata/lang/scripted::php-open-tag
  any:
  - id: micro-behaviors/process/create/shell/lang::exec-user-input-request--g1
  - id: micro-behaviors/process/create/shell/lang::exec-user-input-request--g2
  unless:
  - id: well-known/tool/offensive/projectdiscovery::nuclei-template-artifact
  - id: micro-behaviors/metaprogramming/generation::configured-assessment-plugin
  - id: micro-behaviors/metaprogramming/generation::parameterized-shell-command-builder
  # A detector's own Go test file quoting webshell fixtures for its watcher
  # to flag: quoted payload, not a shipped execution path.
  - id: metadata/package/testing/presence/harness::go-test-file
