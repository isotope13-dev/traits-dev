defaults:
  crit: suspicious
  conf: 0.9
  platforms:
  - windows
  - unix
  for:
  - php
  mbc: B0030
  attack: T1505.003
traits:
  # Tiny headless shells end on the dispatched result (`die($ctime($atime))`)
  # so the response carries only the command output -- no markup, no login
  # page. Plain `die($msg)` error paths name a variable, never a
  # variable-named call, so the callee must itself be dynamic.
  - id: php-exit-dynamic-call-result
    desc: PHP exits with a dynamic-call result
    crit: suspicious
    conf: 0.8
    if:
      type: text
      regex: '(die|exit)\s*\(\s*\$[A-Za-z_][A-Za-z0-9_]*\s*\('
composite_rules:
- id: php-shell-comp
  desc: PHP $_GET-driven command execution (webshell pattern)
  crit: suspicious
  conf: 0.9
  all:
  - id: metadata/lang/scripted::php-open-tag
  - id: micro-behaviors/process/create/shell/lang::exec-user-input-get-text
  unless:
  - id: well-known/tool/offensive/projectdiscovery::nuclei-template-artifact
  - id: well-known/tool/offensive/nmap::nmap-source-tree
  - id: well-known/tool/offensive/bingo/
  # A webshell fixture embedded in a test corpus is data its detector asserts
  # on, not a shipped execution path.
  - id: metadata/package/testing/presence/harness::test-directory-path
  - id: metadata/file/extension/identity::markdown-file-basename
  - id: well-known/tool/offensive/payload-corpus::payloadsallthethings-release-member
- id: php-shell-post
  desc: PHP $_POST-driven command execution (webshell pattern)
  crit: suspicious
  conf: 0.9
  all:
  - id: metadata/lang/scripted::php-open-tag
  any:
  - id: micro-behaviors/process/create/shell/lang::exec-user-input-post--g1
  - id: micro-behaviors/process/create/shell/lang::exec-user-input-post--g2
  unless:
  - id: well-known/tool/offensive/projectdiscovery::nuclei-template-artifact
  - id: well-known/tool/offensive/bingo/
- id: php-shell-request
  desc: PHP $_REQUEST-driven command execution (webshell pattern)
  crit: suspicious
  conf: 0.9
  all:
  - id: metadata/lang/scripted::php-open-tag
  any:
  - id: micro-behaviors/process/create/shell/lang::exec-user-input-request--g1
  - id: micro-behaviors/process/create/shell/lang::exec-user-input-request--g2
  unless:
  - id: well-known/tool/offensive/projectdiscovery::nuclei-template-artifact
