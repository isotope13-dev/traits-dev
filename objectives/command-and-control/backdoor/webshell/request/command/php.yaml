defaults:
  crit: suspicious
  conf: 0.9
  platforms:
  - windows
  - unix
  for:
  - php
  mbc: B0030
  attack: T1505.003
composite_rules:
- id: php-tiny-system-request-webshell
  desc: Tiny PHP request-fed system-call pattern
  crit: hostile
  conf: 0.96
  size_max: 512
  all:
  - id: micro-behaviors/process/create/shell/command-string::php-system-call
  - id: metadata/lang/source/syntax/call/argument-identifier::php-system-request-source
  unless:
  - id: metadata/file/format/security-corpus::attack-payload-corpus
  - id: metadata/package/documentation/security-catalog::quoted-command-reference-contexts
  - id: metadata/package/testing/harness/unit::unit-test-quoted-webshell-fixture
  - id: metadata/package/documentation/security-exercise::fenced-pentest-methodology-documentation
  - id: metadata/lang/source/origin::markdown-decoded-php-snippet
  downgrade:
    scope: parent
    any:
    # A PHP view carved from JavaScript is embedded content; carrier rules
    # separately evaluate evidence that it is deployed or invoked.
    - id: micro-behaviors/data/embedded/script::embedded-php-open-tag
    - id: metadata/package/documentation/security-catalog::parent-command-example-context
    - id: well-known/tool/offensive/projectdiscovery::nuclei-yaml-template-header
    - id: metadata/lang/source/origin::base64-decoded-source-layer
- id: php-tiny-request-command-webshell
  desc: Tiny PHP file runs request input as command
  # The alternate command-sink forms for $_REQUEST: a
  # sub-512-byte file whose only job is handing a request parameter to
  # system/exec/shell_exec or passthru/popen/proc_open, directly or through
  # an adjacent request assignment with the same bound variable.
  crit: hostile
  conf: 0.96
  size_max: 512
  all:
  - id: metadata/lang/scripted::php-open-tag
  any:
  - id: objectives/command-and-control/backdoor/webshell/command::exec-user-input-request--g1
  - id: objectives/command-and-control/backdoor/webshell/command::exec-user-input-request--g2
  - id: objectives/command-and-control/backdoor/webshell/command::php-request-default-to-echoed-shell
  unless:
  - id: metadata/package/testing/presence/harness::go-test-file
  - id: micro-behaviors/metaprogramming/generation/source::configured-assessment-plugin
  - id: micro-behaviors/metaprogramming/generation/source::parameterized-shell-command-builder
  - id: micro-behaviors/metaprogramming/generation/source::configured-payload-generator
  - id: metadata/package/documentation/security-exercise::fenced-pentest-methodology-documentation
  - id: metadata/lang/source/origin::markdown-decoded-php-snippet
  downgrade:
    scope: parent
    any:
    - id: metadata/package/documentation/security-catalog::parent-command-example-context
- id: php-shell-request
  desc: PHP $_REQUEST-driven command execution (webshell pattern)
  crit: suspicious
  conf: 0.9
  any:
  - id: objectives/command-and-control/backdoor/webshell/command::exec-user-input-request--g1
  - id: objectives/command-and-control/backdoor/webshell/command::exec-user-input-request--g2
  unless:
  - id: well-known/tool/offensive/projectdiscovery::nuclei-template-artifact
  - id: micro-behaviors/metaprogramming/generation/source::configured-assessment-plugin
  - id: micro-behaviors/metaprogramming/generation/source::parameterized-shell-command-builder
  - id: metadata/package/testing/presence/harness::go-test-file
  - id: metadata/package/documentation/security-exercise::fenced-pentest-methodology-documentation
  downgrade:
    scope: parent
    any:
    - id: metadata/package/documentation/security-catalog::parent-command-example-context
