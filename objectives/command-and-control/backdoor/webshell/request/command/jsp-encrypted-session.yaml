defaults:
  for: [class]
  platforms: [unix, windows]
  attack: T1505.003,T1059

composite_rules:
  - id: jvm-encrypted-jsp-shell-control
    desc: Encrypted JSP payload controls shell streams
    crit: hostile
    conf: 0.98
    all:
      - id: objectives/command-and-control/channel/http/message::jvm-encrypted-jsp-equals-channel
      - id: micro-behaviors/process/stdio/read::jvm-process-input-stream
      - id: metadata/import/jvm::jvm-process-stdin-method-reference
      - id: micro-behaviors/fs/path/application/interpreter::jvm-command-shell-path
    any:
      - id: metadata/import/jvm::java-runtime-exec-bytecode-reference
      - id: micro-behaviors/process/create/subprocess/launch::java-processbuilder-start-bytecode
