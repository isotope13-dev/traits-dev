defaults:
  platforms: [windows, unix]
  for: [jsp, java, class, html, javascript, python, vbs]
  attack: T1505.003
  mbc: B0030
composite_rules:
- id: jsp-cmd-parameter-runtime-exec
  for:
  - jsp
  - python
  - javascript
  - java
  - vbs
  - html
  desc: JSP runs the cmd request parameter
  crit: hostile
  conf: 0.96
  all:
  - id: metadata/lang/scripted::jsp-server-page
  - id: micro-behaviors/communications/http/request/params::servlet-cmd-parameter-read
  - id: micro-behaviors/process/info/query::java-getruntime-ref
  any:
  - id: micro-behaviors/process/create/exec::runtime-exec-request-parameter
  - id: objectives/command-and-control/backdoor/webshell/request/command::jsp-local-request-command-execution
  - id: objectives/command-and-control/backdoor/webshell/request/command::jsp-runtime-alias-cmd-exec
  unless:
  - id: well-known/tool/offensive/payload-corpus::payloadsallthethings-release-member
  - id: micro-behaviors/metaprogramming/generation::configured-assessment-plugin
