defaults:
  platforms:
  - windows
  - unix
  for:
  - php
  mbc: B0030
  attack: T1505.003,T1059
  crit: hostile
composite_rules:
- id: php-variable-command-webshell
  desc: PHP command form with variable execution
  conf: 0.95
  all:
  - id: micro-behaviors/communications/http/request/superglobal::request-isset-default-assignment
  - id: micro-behaviors/ui/controls/input::php-command-named-form-control
  any:
  - id: micro-behaviors/process/create/shell/lang::php-variable-shell-command
  - id: micro-behaviors/process/create/subprocess::proc-open-variable-argument
  unless:
  - id: metadata/path::test-directory-component
  - id: metadata/file/extension/identity::markdown-file-basename
- id: php-indirect-request-command-webshell
  desc: PHP request assignment with variable shell execution
  conf: 0.97
  all:
  - id: micro-behaviors/communications/http/request/superglobal::request-param-assignment
  - id: micro-behaviors/process/create/shell/lang::php-variable-shell-command
  any:
  - id: micro-behaviors/metaprogramming/reflection/invoke::php-callback-dispatch
  - id: micro-behaviors/metaprogramming/reflection/inspect/member::php-reflection-function
  - id: micro-behaviors/communications/socket/connect::fsockopen-call
  - id: micro-behaviors/fs/attributes/chattr::chattr-immutable
  near_bytes: 1024
  unless:
  - id: php-variable-command-webshell
  - id: metadata/path::test-directory-component
  - id: metadata/file/extension/identity::markdown-file-basename
  - id: well-known/tool/detection/security-scanner/
