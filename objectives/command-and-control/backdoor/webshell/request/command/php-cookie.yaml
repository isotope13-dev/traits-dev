defaults:
  platforms: [unix, windows]
  for: [scripts, source]
  attack: T1505.003
traits:
  - id: php-decoded-cookie-shell-sink
    desc: PHP executes URL-decoded cookie commands
    crit: suspicious
    conf: 0.99
    if:
      type: text
      regex: '\b(passthru|system|shell_exec|exec|popen)\s*\(\s*(raw)?urldecode\s*\(\s*\$_COOKIE\s*\['
composite_rules:
  - id: cookie-command-apache-handler-install
    desc: Cookie command execution near Apache PHP handler
    crit: suspicious
    conf: 0.99
    near_bytes: 4096
    all:
      - id: php-decoded-cookie-shell-sink
      - id: micro-behaviors/communications/http/server/route::apache-php-file-handler
  - id: cookie-command-static-asset-alias
    desc: Cookie webshell beside static asset aliases
    crit: hostile
    conf: 0.99
    near_bytes: 4096
    all:
      - id: php-decoded-cookie-shell-sink
      - id: micro-behaviors/communications/http/server/route::apache-php-file-handler
    any:
      - id: micro-behaviors/communications/http/server/route::apache-static-asset-alias
      - id: micro-behaviors/communications/http/server/route::apache-static-asset-regex-alias
