defaults:
  platforms: [unix, windows]
  for: [scripts, source]
  attack: T1505.003
traits:
  - id: php-decoded-cookie-shell-sink
    desc: PHP executes URL-decoded cookie commands
    crit: suspicious
    conf: 0.99
    if:
      type: text
      regex: '\b(passthru|system|shell_exec|exec|popen)\s*\(\s*(raw)?urldecode\s*\(\s*\$_COOKIE\s*\['
composite_rules:
  - id: cookie-command-suid-shell-bootstrap
    desc: Cookie command webshell accompanies SUID system shell permissions
    crit: hostile
    conf: 0.99
    all:
      - id: php-decoded-cookie-shell-sink
      - id: micro-behaviors/fs/chmod/executable/mode::chmod-setuid-shell
  - id: cookie-command-apache-handler-install
    desc: Cookie command webshell registers a PHP handler in Apache
    crit: hostile
    conf: 0.99
    all:
      - id: php-decoded-cookie-shell-sink
      - id: micro-behaviors/communications/http/server/route::apache-php-file-handler
  - id: cookie-command-static-asset-alias
    desc: Cookie command webshell is aliased through an Apache static asset URL
    crit: hostile
    conf: 0.99
    all:
      - id: php-decoded-cookie-shell-sink
      - id: micro-behaviors/communications/http/server/route::apache-static-asset-alias
      - id: micro-behaviors/communications/http/server/route::apache-php-file-handler
