defaults:
  platforms: [windows]
  for: [jsp, java, html]
  attack: T1505.003
  mbc: B0030
traits:
  - id: runtime-cmd-prefix-request-parameter
    desc: Runtime cmd /c command concatenates HTTP input
    crit: suspicious
    conf: 0.99
    if:
      type: text
      regex: 'getRuntime\(\)\.exec\(\s*"cmd(\.exe)? /c "\s*\+\s*request\.getParameter\('
      exclude_html_comments: true
    unless:
      - type: text
        regex: '(?s)/\*([^*]|\*[^/])*getRuntime\(\)\.exec'
      - type: text
        regex: '(?m)//[^\r\n]{0,500}getRuntime\(\)\.exec'
