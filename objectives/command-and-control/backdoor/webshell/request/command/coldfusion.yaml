# ColdFusion pages that bind a browser form field to `<cfexecute>` are a
# command channel: the HTTP request is the shell. Distinct from the
# file-manager composite (filesystem mutations + optional exec) — this rule
# only requires the request→execute sink.
#
# FileFacts identifies ColdFusion pages as `cfml`, including mixed markup.
defaults:
  platforms: [unix, windows]
  for: [cfml]
  attack: T1505.003
  mbc: B0030
composite_rules:
  - id: cfml-request-command-shell
    desc: CFML page executes request-supplied programs or commands
    crit: hostile
    conf: 0.94
    all:
      - id: metadata/lang/scripted::cfml-output-tag
      - id: micro-behaviors/process/create/exec::cfexecute-tag
    any:
      - id: micro-behaviors/process/create/exec::cfexecute-request-program
      - id: micro-behaviors/process/create/shell/request::cfexecute-request-cmd-arguments
  - id: cfml-command-output-file-shell
    desc: CFML command shell includes file reads and deletions
    crit: hostile
    conf: 0.94
    all:
      - id: cfml-request-command-shell
      - id: micro-behaviors/process/create/exec::cfexecute-output-file
      - id: micro-behaviors/fs/read/file/full::cffile-read
      - id: micro-behaviors/fs/delete/file/command::cffile-delete
  - id: cfml-webshell-url-registration-callback
    desc: Command page posts its request URL data
    crit: hostile
    conf: 0.98
    all:
      - id: cfml-request-command-shell
      - id: micro-behaviors/communications/http/post::cfhttp-post-request-url-param
