# A local HttpListener is commonly used for development and administration.
# It becomes a webshell when an HTTP command field is handed to PowerShell's
# dynamic evaluator and the output is returned in the response page.
# A bearer-authenticated listener that writes a posted script to disk and runs
# it in a child powershell.exe is a remote command agent. That is suspicious,
# not a webshell: the child process and request body are the evidence.
defaults:
  platforms: [windows]
  for: [powershell]
  attack: T1505.003,T1059.001
  mbc: B0030

traits:
  - id: powershell-http-command-form
    desc: PowerShell HTTP command form
    crit: notable
    conf: 0.97
    if:
      type: text
      regex: '(?is)<form[^>]{0,160}action=["'']?/[^>]{0,160}>.{0,500}name=["'']?command\b'

  - id: powershell-request-command-eval
    desc: PowerShell evaluates request URL command
    crit: suspicious
    conf: 0.99
    if:
      type: text
      regex: '(?is)\$REQUEST\.Url\.Query.{0,900}Invoke-Expression[^\r\n]{0,120}\$FORMFIELD\b'

  - id: powershell-http-request-body-read
    desc: PowerShell reads HTTP request body stream
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: '(?i)\$\w{1,24}\.(InputStream|HasEntityBody)\b'

composite_rules:
  - id: powershell-httplistener-command-webshell
    desc: PowerShell HttpListener executes request-supplied commands
    crit: hostile
    conf: 0.995
    all:
      - id: micro-behaviors/communications/http/server/managed::powershell-httplistener
      - id: powershell-http-command-form
      - id: powershell-request-command-eval

  - id: powershell-httplistener-posted-script-exec
    desc: PowerShell HTTP listener runs posted script in a child
    crit: suspicious
    conf: 0.9
    all:
      - id: micro-behaviors/communications/http/server/managed::powershell-httplistener
      - id: powershell-http-request-body-read
      - id: micro-behaviors/data/decode/base64/call::powershell-frombase64string
      - id: micro-behaviors/fs/path/application/interpreter::powershell-executable-token
    any:
      - id: micro-behaviors/process/create/cmdlet::start-process-call
      - id: micro-behaviors/process/create/subprocess/configure::powershell-processstartinfo-object
