defaults:
  platforms: [windows]
  for: [asp]

traits:
  - id: asp-com-exec-request-argument
    desc: ASP forwards request data to COM Exec
    crit: notable
    conf: 0.96
    if:
      type: text
      regex: '(?i)\.Exec\s*\([^\r\n;]{0,100}\bRequest(\.(Form|QueryString))?\s*\('

  - id: asp-prints-com-command-output
    desc: ASP returns a subprocess output stream
    crit: notable
    conf: 0.96
    if:
      type: text
      regex: '(?i)Response\.Write\b[^\r\n]{0,180}\.StdOut\.ReadAll\b'

composite_rules:
  - id: asp-server-object-request-command-shell
    desc: ASP server-side shell object executes a request and returns subprocess output
    crit: hostile
    conf: 0.99
    attack: T1505.003,T1059
    all:
      - id: micro-behaviors/os/com/instantiation::asp-server-object-tag-classid
      - id: micro-behaviors/os/com/instantiation::shell-automation-clsid-text
      - id: asp-com-exec-request-argument
      - id: asp-prints-com-command-output
    near_bytes: 1800
