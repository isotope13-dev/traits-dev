# Classic ASP upload kits read the raw request with Request.BinaryRead and
# write it through Scripting.FileSystemObject. Either call is common alone.
defaults:
  platforms: [windows]
  for: [asp]
  attack: T1505.003
  mbc: B0030
composite_rules:
  - id: asp-binary-request-command-shell
    desc: ASP command shell reads the raw request body
    crit: hostile
    conf: 0.95
    all:
      - id: micro-behaviors/communications/http/request/superglobal::classic-asp-request-binaryread
      - id: micro-behaviors/os/com/automation::filesystemobject-progid
      - id: objectives/command-and-control/backdoor/webshell/request/command::classic-asp-command-webshell
