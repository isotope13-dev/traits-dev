defaults:
  for: [perl]
  platforms: [unix, windows]
  mbc: B0030
  attack: T1505.003
traits:
  - id: execute-frame
    desc: Execute action iframe
    crit: suspicious
    conf: 0.82
    if:
      type: text
      regex: 'iframe\s+name="output".{0,80}action=execute'
  - id: webshell-cookie-name
    desc: Web shell cookie name pattern
    crit: suspicious
    conf: 0.92
    if:
      type: text
      regex: "WebShell-[A-Za-z]{3,16}"
  - id: perl-cmd-query-capture
    desc: Captures a cmd query parameter
    crit: suspicious
    conf: 0.94
    if:
      type: text
      substr: '^cmd=(.*)$'
  - id: perl-system-capture-group
    desc: Runs the first capture group
    crit: suspicious
    conf: 0.93
    if:
      type: text
      regex: '\bsystem\s*\(\s*["'']\$1'
  - id: perl-use-cgi
    desc: Imports the Perl CGI module
    crit: notable
    conf: 0.8
    for: [perl, text, static-lib, html]
    if:
      type: text
      regex: '(?m)^use\s+CGI\b'
  - id: perl-system-interactive-bash
    desc: System starts an interactive bash
    crit: suspicious
    conf: 0.93
    for: [perl, text, static-lib, html]
    unless:
      # Detection-rule corpora quote reverse-shell spelling as signature
      # content rather than starting a shell.
      - id: well-known/tool/detection/emerging-threats::detection-ruleset
    if:
      type: text
      substr: '/bin/bash -i'
  - id: perl-query-variable-backtick-command
    desc: CGI query variable becomes backtick command
    crit: suspicious
    conf: 0.97
    if:
      type: tree-sitter
      query: |
        (source_file
          (expression_statement
            (assignment_expression
              left: (variable_declaration variable: (scalar) @input)
              right: (hash_element_expression
                hash: (container_variable (varname) @environment)
                key: (autoquoted_bareword) @key)))
          (expression_statement
            (assignment_expression
              right: (command_string
                content: (string_content (scalar) @command)) @shell))
          (#eq? @environment "ENV")
          (#eq? @key "QUERY_STRING")
          (#eq? @input @command)
          (#match? @shell "^`\\$[A-Za-z_]\\w*`$")) @channel
composite_rules:
  - id: perl-cgi-variable-backtick-webshell
    desc: CGI query command with HTTP response
    crit: hostile
    conf: 0.97
    all:
      - id: perl-query-variable-backtick-command
      - id: micro-behaviors/communications/http/header/content-type::perl-cgi-html-content-type
    unless:
      - id: metadata/package/testing/presence/harness::perl-test-file
  - id: perl-cgi-system-cmd-field
    desc: CGI script starts interactive bash
    crit: hostile
    conf: 0.95
    for: [perl, text, static-lib, html]
    all:
      - id: perl-use-cgi
      - id: micro-behaviors/process/create/shell/lang::system-dollar-variable
      - id: perl-system-interactive-bash
  - id: perl-cgi-command-webshell
    desc: Perl CGI command webshell
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/process/create/shell/open3::shell-exec
      - id: micro-behaviors/communications/http/request/cgi::request-handling
      - id: micro-behaviors/ui/controls/input::html-command-named-input
    any:
      - id: micro-behaviors/data/source/syntax/keyword::webshell-term-reference
      - id: micro-behaviors/ui/terminal::webshell-manager-label
      - id: execute-frame
  - id: perl-cgi-pipe-command
    desc: Opens a pipe from a CGI command
    crit: hostile
    conf: 0.97
    near_lines: 70
    all:
      - id: micro-behaviors/process/create/popen::perl-open-interpolated-pipe
    any:
      - id: micro-behaviors/ui/controls/input::html-command-named-input
      - id: micro-behaviors/communications/http/request/cgi::query-string-server-var
    unless:
      - id: metadata/package/testing/presence/harness::perl-test-file
      - id: metadata/package/tooling::gnu-global-cgi
      - id: well-known/app/system/bbbike::source-tree
  - id: perl-cgi-cmd-query-system
    desc: Runs a cmd parameter from the query
    crit: hostile
    conf: 0.97
    near_lines: 4
    all:
      - id: perl-cmd-query-capture
      - id: perl-system-capture-group
      - id: micro-behaviors/communications/http/request/cgi::query-string-server-var
    unless:
      - id: metadata/package/testing/presence/harness::perl-test-file
  - id: perl-cgi-backtick-command
    desc: Backticks a CGI command parameter
    crit: hostile
    conf: 0.96
    near_lines: 30
    all:
      - id: micro-behaviors/process/create/shell/backtick::backticks-variable-exec
      - id: micro-behaviors/communications/http/request/cgi::perl-command-param-call
    unless:
      - id: metadata/package/testing/presence/harness::perl-test-file
