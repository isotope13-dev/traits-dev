defaults:
  for: [perl]
  platforms: [unix, windows]
  mbc: B0030
  attack: T1505.003
traits:
  - id: command-form
    desc: HTML command input form
    crit: suspicious
    conf: 0.86
    if:
      type: text
      regex: '<input[^>\n]{0,120}name="command"'
  - id: cgi-command-action-field
    desc: CGI command action hidden field
    crit: notable
    conf: 0.9
    if:
      type: text
      substr: 'name="a" value="command"'
  - id: execute-frame
    desc: Execute action iframe
    crit: suspicious
    conf: 0.82
    if:
      type: text
      regex: 'iframe\s+name="output".{0,80}action=execute'
  - id: webshell-cookie-name
    desc: Web shell cookie name pattern
    crit: suspicious
    conf: 0.92
    if:
      type: text
      regex: "WebShell-[A-Za-z]{3,16}"
  - id: perl-cmd-query-capture
    desc: Captures a cmd query parameter
    crit: suspicious
    conf: 0.94
    if:
      type: text
      substr: '^cmd=(.*)$'
  - id: perl-system-capture-group
    desc: Runs the first capture group
    crit: suspicious
    conf: 0.93
    if:
      type: text
      regex: '\bsystem\s*\(\s*["'']\$1'
  - id: perl-cgi-command-param
    desc: Reads a CGI command parameter
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '\bparam\(\s*[''"]command[''"]'
  - id: perl-use-cgi
    desc: Imports the Perl CGI module
    crit: notable
    conf: 0.8
    for: [perl, text, static-lib, html]
    if:
      type: text
      regex: '(?m)^use\s+CGI\b'
  - id: perl-system-interactive-bash
    desc: System starts an interactive bash
    crit: suspicious
    conf: 0.93
    for: [perl, text, static-lib, html]
    if:
      type: text
      substr: '/bin/bash -i'
composite_rules:
  - id: perl-cgi-system-cmd-field
    desc: CGI script starts interactive bash
    crit: hostile
    conf: 0.95
    for: [perl, text, static-lib, html]
    all:
      - id: perl-use-cgi
      - id: micro-behaviors/process/create/shell/lang::perl-system-variable
      - id: perl-system-interactive-bash
  - id: perl-cgi-command-webshell
    desc: Perl CGI command webshell
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/process/create/shell/open3::shell-exec
      - id: micro-behaviors/communications/http/request/cgi::request-handling
      - id: command-form
    any:
      - id: micro-behaviors/data/source/syntax/keyword::webshell-term-reference
      - id: objectives/command-and-control/backdoor/webshell/self-label::identifier
      - id: execute-frame
  - id: perl-cgi-variable-backtick-webshell
    desc: Perl CGI backtick command webshell
    crit: hostile
    conf: 0.97
    all:
      - id: micro-behaviors/process/create/shell/backtick::backticks-variable-exec
      - id: micro-behaviors/communications/http/request/cgi::query-string-server-var
      - id: cgi-command-action-field
  - id: perl-cgi-pipe-command
    desc: Opens a pipe from a CGI command
    crit: hostile
    conf: 0.97
    near_lines: 70
    all:
      - id: micro-behaviors/process/create/popen::perl-open-interpolated-pipe
    any:
      - id: command-form
      - id: micro-behaviors/communications/http/request/cgi::query-string-server-var
    unless:
      - id: metadata/package/testing/presence/harness::perl-test-file
      - id: metadata/package/tooling::gnu-global-cgi
  - id: perl-cgi-cmd-query-system
    desc: Runs a cmd parameter from the query
    crit: hostile
    conf: 0.97
    near_lines: 4
    all:
      - id: perl-cmd-query-capture
      - id: perl-system-capture-group
      - id: micro-behaviors/communications/http/request/cgi::query-string-server-var
    unless:
      - id: metadata/package/testing/presence/harness::perl-test-file
  - id: perl-cgi-backtick-command
    desc: Backticks a CGI command parameter
    crit: hostile
    conf: 0.96
    near_lines: 30
    all:
      - id: micro-behaviors/process/create/shell/backtick::backticks-variable-exec
      - id: perl-cgi-command-param
    unless:
      - id: metadata/package/testing/presence/harness::perl-test-file
