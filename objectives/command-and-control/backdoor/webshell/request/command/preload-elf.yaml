defaults:
  platforms: [unix]
  for: [elf]

composite_rules:
  # Disassembly confirms a CGI QUERY_STRING cmd field passed to system in the
  # sample. These reusable facts lack that value binding, so retain suspicion
  # and describe the supported interface rather than claiming proven dataflow.
  - id: preload-cgi-command-shell-interface
    desc: Preload CGI command and shell-launch interface
    crit: suspicious
    conf: 0.96
    attack: T1505.003,T1574.006
    all:
      - id: micro-behaviors/communications/http/request/cgi::query-string-binary
      - id: micro-behaviors/communications/http/request/cgi::cgi-command-parameter-literal
      - id: micro-behaviors/process/create/shell/native::c-system-import
      - id: micro-behaviors/os/env/runtime::ld-preload-text-reference
      - id: micro-behaviors/os/env/write::unsetenv-import
      - id: metadata/binary/linking/dynamic::init-array-present
    unless:
      - id: metadata/binary/linking/runtime::interpreter
