# Direct request-to-process taint shapes used by command webshell composites.
# These are execution sinks under remote operator control, so they belong with
# webshell command-and-control rather than generic interpreter execution.
defaults:
  crit: notable
  conf: 0.99
  platforms: [unix, windows]
  for: [markdown, php, html, csharp, java, python]
  attack: T1505.003
  mbc: B0030

traits:
  - id: aspx-request-process-execution
    desc: ASPX request passed to process creation
    for: [markdown, csharp]
    if:
      type: text
      regex: '(?is)\bProcess\.Start\s*\([^\n]{0,240}\bRequest\s*\[.{0,40}\]'

  # The Python half of the same shape: a WSGI/ASGI request accessor (Flask,
  # Django, FastAPI/Starlette, Bottle, Tornado) read straight into a process
  # or shell sink as its first argument, matching the ASPX sibling above.
  # JSP's canonical atom is process/create/exec::runtime-exec-request-parameter.
  # Demanding the accessor at the call site is what separates a
  # webshell from an application that merely owns both a route and a
  # subprocess call -- the latter is every CI service and every
  # deliberately-vulnerable IAST fixture.
  - id: python-qualified-request-process
    desc: Qualified process call with request value
    for: [markdown, python]
    if:
      type: text
      regex: '(?i)\bsubprocess\.(system|popen|run|call)\s*\(\s*request\.'

  - id: python-os-request-process
    desc: OS process call with request value
    for: [markdown, python]
    if:
      type: text
      regex: '(?i)\bos\.(system|popen|run|call)\s*\(\s*request\.'

  - id: python-check-output-request
    desc: Subprocess check output receives request
    for: [markdown, python]
    if:
      type: text
      regex: '(?i)\bsubprocess\.check_output\s*\(\s*request\.'

  - id: python-bare-request-process
    desc: Bare process-style call with request value
    crit: component
    for: [markdown, python]
    if:
      type: text
      regex: '(?i)(^|[^.\w])(system|popen|run|call)\s*\(\s*request\.'

  - id: python-process-function-import
    crit: component
    attack: none
    mbc: none
    desc: Imports process execution function
    for: [markdown, python]
    if:
      type: text
      regex: '(?m)from +subprocess +import +[^\n]{0,80}\b(system|popen|run|call)\b'

  - id: python-os-function-import
    crit: component
    attack: none
    mbc: none
    desc: Imports OS process execution function
    for: [markdown, python]
    if:
      type: text
      regex: '(?m)from +os +import +[^\n]{0,80}\b(system|popen|run|call)\b'

  - id: python-bare-check-output-request
    desc: Bare check output receives request
    crit: component
    for: [markdown, python]
    if:
      type: text
      regex: '(?i)(^|[^.\w])check_output\s*\(\s*request\.'

  - id: python-check-output-import
    crit: component
    attack: none
    mbc: none
    desc: Imports subprocess check output
    for: [markdown, python]
    if:
      type: text
      regex: '(?m)from +subprocess +import +[^\n]{0,80}\bcheck_output\b'

composite_rules:
  - id: python-request-process-execution
    desc: Python request value passed to process execution
    for: [markdown, python]
    any:
      - id: python-qualified-request-process
      - id: python-os-request-process
      - id: python-check-output-request
      - id: python-imported-request-process
      - id: python-imported-check-output-request

  - id: python-imported-request-process
    desc: Imported Python process function receives request value
    for: [markdown, python]
    all:
      - id: python-bare-request-process
    any:
      - id: python-process-function-import
      - id: python-os-function-import

  - id: python-imported-check-output-request
    desc: Imported check output receives request value
    for: [markdown, python]
    all:
      - id: python-bare-check-output-request
      - id: python-check-output-import

