defaults:
  platforms: [windows]
  for: [asp]
  attack: T1505.003,T1059.003
composite_rules:
  - id: aspnet-form-cmd-output-response
    desc: Form command, stdout redirect and response write
    crit: hostile
    conf: 0.96
    all:
      - id: micro-behaviors/ui/controls/input::aspnet-server-textbox-control
      - id: micro-behaviors/process/create/shell/command-string::dotnet-cmd-c-concatenated-argument
      - id: micro-behaviors/process/io/stream::dotnet-standard-output-redirection
      - id: micro-behaviors/communications/http/response::asp-response-write
