# Classic ASP.NET command webshell: an asp:TextBox on the page supplies the
# text, the server-side script runs it through `cmd.exe /c` with output
# redirected, so any visitor can execute OS commands on the web server.
# Request[...]-based variants are covered in aspnet.yaml; this is the
# Web Forms control spelling.
defaults:
  platforms: [windows]
  for: [html, asp]
  mbc: B0030
  attack: T1505.003

composite_rules:
  - id: aspnet-textbox-cmd-webshell
    desc: ASP.NET page runs form text via cmd.exe /c
    crit: hostile
    conf: 0.97
    all:
      - id: metadata/lang/source/syntax::aspnet-page-directive
      - id: micro-behaviors/communications/http/server/managed::aspnet-server-side-script-block
      - id: micro-behaviors/ui/controls/input::aspnet-server-textbox-control
      - id: micro-behaviors/process/create/shell/command-string::dotnet-cmd-c-concatenated-argument
