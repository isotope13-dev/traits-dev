# A command surface beside a MU-plugin-path write. Proximity does not bind
# the write destination or prove the generated PHP is valid or reactivated.
defaults:
  platforms: [unix, windows]
  for: [php]
  mbc: B0030
  attack: T1505.003

composite_rules:
  - id: wordpress-mu-plugin-webshell-backdoor
    desc: Request shell source near MU-plugin path write
    crit: hostile
    conf: 0.99
    all:
      - id: micro-behaviors/fs/write/file/full::php-write-near-wp-mu-plugin-path
    any:
      - id: php-command-webshell
      - id: php-request-shell-execution
      - id: php-request-shell-execution-alt
    near_bytes: 1600
