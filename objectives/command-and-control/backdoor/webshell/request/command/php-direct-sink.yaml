# Direct HTTP request parameters used as shell-command arguments.
defaults:
  crit: notable
  conf: 0.99
  platforms: [unix, windows]
  for: [markdown, php]
  attack: T1505.003
  mbc: B0030
traits:
  - id: php-request-shell-execution
    desc: PHP request parameter passed to shell execution
    if:
      type: text
      regex: '(?is)\b(system|exec)\s*\(\s*\$_(GET|POST|REQUEST|COOKIE)\s*\['
    unless:
      - id: metadata/package/documentation/security-testing::fenced-security-methodology-skill

  - id: php-request-shell-execution-alt
    desc: PHP request passed to alternate shell function
    if:
      type: text
      regex: '(?is)\b(shell_exec|passthru)\s*\(\s*\$_(GET|POST|REQUEST|COOKIE)\s*\['
    unless:
      - id: metadata/package/documentation/security-testing::fenced-security-methodology-skill

