# Request-to-command call syntax, including quoted source and templates.
# This alone does not establish execution by the containing artifact;
# consumers must supply the invocation or deployment context for that claim.
defaults:
  crit: notable
  conf: 0.99
  platforms: [unix, windows]
  # PHP request-to-command code may be emitted by an installer written in
  # another language, or quoted in a vulnerability-scan template. Its PHP
  # syntax, not the outer extension, is evidence.
  for: [markdown, scripts, source, yaml]
  attack: T1505.003
  mbc: B0030
traits:
  - id: php-request-shell-execution
    desc: PHP request-to-shell call pattern
    if:
      type: text
      regex: '(?is)\b(system|exec)\s*\(\s*\$_(GET|POST|REQUEST|COOKIE)\s*\['
    unless:
      - id: metadata/package/documentation/security-testing::fenced-security-methodology-skill

  - id: php-request-shell-execution-alt
    desc: Request input reaches shell_exec() or passthru()
    if:
      type: text
      regex: '(?is)\b(shell_exec|passthru)\s*\(\s*\$_(GET|POST|REQUEST|COOKIE)\s*\['
    unless:
      - id: metadata/package/documentation/security-testing::fenced-security-methodology-skill

