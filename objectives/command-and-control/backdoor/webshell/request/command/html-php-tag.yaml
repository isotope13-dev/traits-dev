# Compromised-page injections carry a non-standard <php cmd="..."> element
# for a server-side tag handler to evaluate. HTML has no <php> element, so
# the markup only makes sense as an execution tag; when the cmd attribute
# carries a request superglobal, the page wires visitor input to server-side
# command execution rather than printing fixed markup.
defaults:
  platforms: [windows, unix]
  for: [html]
  mbc: B0030
  attack: T1505.003

traits:
  - id: html-php-cmd-tag
    desc: HTML-embedded php cmd execution tag
    crit: suspicious
    conf: 0.9
    if:
      type: text
      regex: '(?i)<php\s+cmd\s*='

  - id: html-php-cmd-tag-request-param
    desc: PHP cmd tag carries a request parameter
    crit: suspicious
    conf: 0.95
    if:
      type: text
      regex: '(?i)<php\s+cmd\s*=\s*"[^"]{0,160}\$_(GET|POST|REQUEST)\s*\['

composite_rules:
  - id: html-php-cmd-tag-request-webshell
    desc: HTML php cmd tag executes a request parameter
    crit: hostile
    conf: 0.95
    all:
      - id: html-php-cmd-tag
      - id: html-php-cmd-tag-request-param
