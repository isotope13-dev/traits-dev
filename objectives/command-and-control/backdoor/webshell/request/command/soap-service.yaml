defaults:
  platforms: [windows]
  for: [asp, csharp, text]
composite_rules:
  - id: soap-operand-command-webshell
    desc: SOAP command operand runs with captured output
    crit: hostile
    conf: 0.99
    attack: T1505.003
    mbc: B0030
    all:
      - id: metadata/lang/source/syntax/directive::aspnet-webservice-directive
      - id: "metadata/lang/source/syntax/directive::dotnet-webmethod-attribute"
      # China Chopper's SOAP protocol places a two-character argument prefix
      # before the program path. Require the request-operand alias and its
      # executable use together; an arbitrary ProcessStartInfo is insufficient.
      - id: "metadata/lang/source/declaration::csharp-z1-operand-alias"
      - id: micro-behaviors/process/argument/executable::dotnet-prefix-stripped-program
      - id: micro-behaviors/process/create/subprocess::dotnet-source-process-instance-start
      - id: micro-behaviors/process/io/stream::dotnet-standard-output-redirection
