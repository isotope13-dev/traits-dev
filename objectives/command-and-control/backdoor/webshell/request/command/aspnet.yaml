defaults:
  platforms:
  - windows
  for:
  - html
  - csharp
  - asp
  mbc: B0030
  attack: T1505.003
traits:
- id: aspnet-source-process-instance-start
  desc: ASP.NET creates and starts a process
  crit: component
  conf: 0.92
  for: [asp]
  if:
    type: text
    regex: '(?is)new\s+(System\.Diagnostics\.)?Process\s*\(\s*\)[\s\S]{0,500}\.Start'
- id: aspnet-source-process-static-start
  desc: ASP.NET source starts a configured .NET process
  crit: component
  conf: 0.92
  for: [asp]
  if:
    type: text
    regex: '(?i)\bProcess\s*\.\s*Start\s*\(\s*[A-Za-z_$][\w$]*'
- id: aspnet-processstartinfo-control-text
  desc: ASP.NET process arguments use control text
  crit: component
  conf: 0.9
  for: [asp]
  if:
    type: text
    regex: '(?is)ProcessStartInfo[\s\S]{0,500}\b[A-Za-z_$][\w$]*\s*\.\s*Text\b'
- id: aspnet-process-output-read
  desc: ASP.NET reads redirected process output
  crit: component
  conf: 0.94
  for: [asp]
  if:
    type: text
    regex: '(?is)Standard(Output|Error)[\s\S]{0,300}ReadToEnd\s*\('
- id: aspnet-process-output-control-sink
  desc: ASP.NET renders output through a control
  crit: component
  conf: 0.93
  for: [asp]
  if:
    type: text
    regex: '(?i)([A-Za-z_$][\w$]*\s*\.\s*Text\s*=|HttpUtility\.HtmlEncode\s*\(|<%\s*=)'
- id: aspnet-request-body-base64-action-tuple
  desc: ASP.NET decodes request action tuple
  crit: suspicious
  conf: 0.96
  for: [asp]
  if:
    type: text
    regex: '(?i)FromBase64String\(Server\.UrlDecode'
- id: aspnet-request-body-split-action-tuple
  desc: ASP.NET splits request data into actions
  crit: component
  conf: 0.95
  for: [asp]
  if:
    type: text
    regex: '(?i)Split.{0,4}_'
- id: aspnet-request-input-stream-body
  desc: ASP.NET reads the raw request body
  crit: component
  conf: 0.96
  for: [asp]
  if:
    type: text
    substr: Request.InputStream
- id: aspnet-request-tuple-process-stdin
  desc: Request data enters process stdin
  crit: suspicious
  conf: 0.97
  for: [asp]
  if:
    type: text
    regex: '(?i)StandardInput\s*\.\s*WriteLine\s*\([^)]{0,80}\[[\w$]{1,30}\]'
- id: aspnet-request-tuple-process-stdout
  desc: ASP.NET reads redirected process output
  crit: component
  conf: 0.97
  for: [asp]
  if:
    type: text
    regex: '(?i)StandardOutput\s*\.\s*ReadToEnd\s*\('
- id: aspnet-loopback-tcpclient-connect
  desc: ASP.NET connects to a loopback TCP service
  crit: component
  conf: 0.95
  for: [asp]
  if:
    type: text
    regex: '(?i)\.Connect\s*\(\s*"127\.0\.0\.1"\s*,\s*\w+'
- id: aspnet-ftp-user-setup-command
  desc: ASP.NET configures an FTP server account
  crit: component
  conf: 0.97
  for: [asp]
  if:
    type: text
    substr: -SETUSERSETUP
- id: aspnet-ftp-root-directory-grant
  desc: ASP.NET grants FTP drive-root access
  crit: component
  conf: 0.98
  for: [asp]
  if:
    type: text
    substr: '-HomeDir=c:\\'
- id: aspnet-ftp-site-exec-command
  desc: FTP SITE EXEC receives a control value
  crit: suspicious
  conf: 0.98
  for: [asp]
  if:
    type: text
    regex: '(?i)SITE\s+EXEC\s*["'']?\s*&\s*Command'
- id: aspnet-ftp-command-control-input
  desc: Command is read from a text control
  crit: suspicious
  conf: 0.96
  for: [asp]
  if:
    type: text
    regex: '(?i)Command\s+As\s+String\s*=\s*Text_cmd\.Text'
# The Request.QueryString / Request.Form reads and the Response.Write sink that
# lived here as `aspnet-request-processstartinfo--rx-6/-rx-9` and
# `aspnet-process-output-response--rx-14` are ordinary ASP.NET request/response
# mechanics (every .aspx page in the .NET Framework uses them); they now live in
# micro-behaviors/communications/http/server/managed.
- id: aspnet-default-recon-command
  desc: ASP.NET webshell default recon command
  crit: suspicious
  conf: 0.95
  if:
    type: text
    substr: whoami /all && hostname && ipconfig
composite_rules:
- id: aspnet-loopback-ftp-command-webshell
  desc: ASP.NET controls an FTP server as a command shell
  crit: hostile
  conf: 0.99
  for: [asp]
  all:
  - id: micro-behaviors/communications/http/server/managed::aspnet-page-directive
  - id: aspnet-loopback-tcpclient-connect
  - id: aspnet-ftp-user-setup-command
  - id: aspnet-ftp-root-directory-grant
  - id: aspnet-ftp-site-exec-command
  - id: aspnet-ftp-command-control-input
- id: aspnet-process-start-any
  desc: ASP.NET child process execution
  crit: notable
  conf: 0.95
  any:
  - id: micro-behaviors/process/create/spawn::start
  - id: micro-behaviors/process/create/start-process::dotnet-process-instance-start
  - id: aspnet-source-process-instance-start
  - id: aspnet-source-process-static-start
- id: aspnet-request-command-webshell
  desc: ASP.NET request command webshell
  crit: hostile
  conf: 0.98
  all:
  - id: aspnet-request-processstartinfo
  any:
  - id: aspnet-process-output-response
  - id: micro-behaviors/process/create/spawn::start-info
  - id: micro-behaviors/process/create/spawn::start
  unless:
  - id: metadata/package/testing/presence/harness::csharp-test-file
  - id: metadata/package/testing/presence/harness::test-fixture-directory
- id: aspnet-request-body-action-process-webshell
  desc: ASP.NET dispatches request-carried commands to a child process
  crit: hostile
  conf: 0.99
  for: [asp]
  all:
  - id: micro-behaviors/communications/http/server/managed::aspnet-page-directive
  - id: aspnet-request-input-stream-body
  - id: aspnet-request-body-base64-action-tuple
  - id: aspnet-request-body-split-action-tuple
  - id: aspnet-request-tuple-process-stdin
  - id: aspnet-request-tuple-process-stdout
- id: aspnet-default-recon-webshell
  desc: ASP.NET default recon webshell
  crit: hostile
  conf: 0.99
  all:
  - id: aspnet-request-command-webshell
  - id: aspnet-default-recon-command
- id: aspnet-request-processstartinfo
  desc: ASP.NET request launches process
  crit: suspicious
  conf: 0.96
  all:
  - id: aspnet-process-start-any
  # ProcessStart/Info plus cmd.exe is common in benign helpers and wrappers.
  # For a webshell objective, require an actual ASP.NET request source.
  any:
  - id: micro-behaviors/communications/http/query::asp-request-querystring-read
  - id: micro-behaviors/communications/http/server/managed::aspnet-request-form-read
  - id: micro-behaviors/communications/http/server/managed::aspnet-request-indexer-access
  - id: aspnet-processstartinfo-control-text
  unless:
  - id: metadata/package/testing/presence/harness::csharp-test-file
  - id: metadata/package/testing/presence/harness::test-fixture-directory
- id: aspnet-process-output-response
  desc: ASP.NET process output response
  crit: notable
  conf: 0.94
  all:
  - id: aspnet-process-start-any
  any:
  - id: micro-behaviors/process/create/exec::powershell-exe-reference
  - id: micro-behaviors/communications/http/response::asp-response-write
  - id: aspnet-process-output-rendered
  unless:
  - id: metadata/package/testing/presence/harness::csharp-test-file
  - id: metadata/package/testing/presence/harness::test-fixture-directory
- id: aspnet-process-output-rendered
  desc: ASP.NET returns process output to its caller
  crit: notable
  conf: 0.95
  for: [asp]
  all:
  - id: aspnet-process-output-read
  any:
  - id: micro-behaviors/communications/http/response::asp-response-write
  - id: aspnet-process-output-control-sink
