defaults:
  platforms:
  - windows
  - unix
  for:
  - php
  mbc: B0030
composite_rules:
- id: php-shell-functional
  desc: PHP request input reaches command execution
  crit: suspicious
  conf: 0.98
  attack: T1505.003
  all:
  - id: micro-behaviors/process/create/shell/request::exec-user-input
  - id: micro-behaviors/communications/http/request
  downgrade:
    scope: parent
    any:
    - id: metadata/package/documentation/security-catalog::parent-command-example-context
- id: php-command-webshell
  desc: PHP request-to-command webshell pattern
  crit: hostile
  conf: 0.99
  attack: T1505.003,T1059.004
  all:
  - id: php-shell-functional
  any:
  - id: php-request-shell-execution
  - id: php-request-shell-execution-alt
  unless:
  - id: metadata/package/documentation/security-catalog::quoted-command-reference-contexts
  downgrade:
    scope: parent
    any:
    # A PHP view carved from JavaScript is embedded content; carrier rules
    # separately evaluate evidence that it is deployed or invoked.
    - id: micro-behaviors/data/embedded/script::embedded-php-open-tag
    - id: metadata/package/documentation/security-catalog::serialized-markdown-reference-pages
    - id: well-known/tool/offensive/projectdiscovery::nuclei-yaml-template-header
