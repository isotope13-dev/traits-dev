defaults:
  platforms: [windows, unix]
  for: [php]
  mbc: B0030
composite_rules:
- id: php-shell-functional
  desc: PHP request input reaches command execution
  crit: suspicious
  conf: 0.98
  attack: T1505.003
  all:
  - id: micro-behaviors/process/create/shell/lang::exec-user-input
  - id: micro-behaviors/communications/http/request/
  unless:
  - id: well-known/tool/offensive/
  # Any testing-presence context (gherkin, Go test file, JS fixture): quoted
  # fixture payload, not a shipped execution path. One dir-ref, not a leaf
  # per test convention.
  - id: metadata/package/testing/presence/
  - id: metadata/package/testing/harness/unit::php-test-runner
  - id: micro-behaviors/communications/socket/uri::localhost-socket-uri
  - id: well-known/tool/detection/security-scanner/
  - id: well-known/app/system/zealphp
  - id: well-known/lib/web/server/symfony::package-doc
  - id: metadata/file/extension/identity::markdown-file-basename
  downgrade:
    scope: parent
    any:
      - id: micro-behaviors/ui/help::escaped-local-command-reference
- id: php-command-webshell
  desc: PHP payload routes request parameters to shell commands
  crit: hostile
  conf: 0.99
  attack: T1505.003,T1059.004
  all:
  - id: php-shell-functional
  any:
  - id: php-request-shell-execution
  - id: php-request-shell-execution-alt
  unless:
  - id: micro-behaviors/ui/help::escaped-local-command-reference
  # Any testing-presence context (test directory, Go test file, JS fixture):
  # a detector quoting webshell fixtures for its tests is quoted payload,
  # not a shipped shell. One dir-ref, not a leaf per test convention.
  - id: metadata/package/testing/presence/
  - id: metadata/file/extension/identity::markdown-file-basename
  - id: micro-behaviors/metaprogramming/generation::configured-assessment-plugin
  - id: well-known/tool/offensive/exploitdb::published-script-wrapper
  - id: well-known/tool/detection/websec-validator::websec-validator-probe-context
  - id: well-known/tool/detection/teler/
  - id: well-known/tool/offensive/raxuiscli::source-tree-path
  downgrade:
    scope: parent
    any:
    - id: well-known/tool/offensive/projectdiscovery::nuclei-yaml-template-header

