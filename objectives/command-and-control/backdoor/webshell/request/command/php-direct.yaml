defaults:
  platforms:
  - windows
  - unix
  for:
  - php
  mbc: B0030
composite_rules:
- id: php-shell-functional
  desc: PHP request input reaches command execution
  crit: suspicious
  conf: 0.98
  attack: T1505.003
  all:
  - id: objectives/command-and-control/backdoor/webshell/command::exec-user-input
  - id: micro-behaviors/communications/http/request
  unless:
  - id: metadata/file/catalog/pattern-rules::js-security-rule-catalog-context
  - id: metadata/file/format/security-corpus::attack-payload-corpus
  - id: metadata/package/documentation/security-exercise::fenced-pentest-methodology-documentation
  - id: well-known/app/system/anthropic-cybersecurity-skills::cybersecurity-skill-documentation
  - id: metadata/file/extension/identity::markdown-file-basename
  - id: metadata/package/testing/corpus/security-tests/scanner::php-taint-test-fixture-context
  - id: well-known/tool/detection/teler::teler-cves-json-shape
  downgrade:
    scope: parent
    any:
    - id: metadata/package/testing/presence/upload-fixture::javascript-upload-webshell-test-context
    - id: metadata/package/documentation/security-catalog::quoted-command-reference-contexts
- id: php-command-webshell
  desc: PHP request-to-command webshell pattern
  crit: hostile
  conf: 0.99
  attack: T1505.003,T1059.004
  all:
  - id: php-shell-functional
  any:
  - id: php-request-shell-execution
  - id: php-request-shell-execution-alt
  # Request value assigned to a local and passed on to the shell call.
  - id: micro-behaviors/process/create/shell/variable-command::php-adjacent-request-shell-command
  unless:
  - id: metadata/package/documentation/security-catalog::quoted-command-reference-contexts
  - id: metadata/package/testing/harness/fixture::unit-test-quoted-webshell-fixture
  - id: well-known/tool/detection/teler::teler-cves-json-shape
  # The quoted PHP child view is data when its immediate JS parent is a
  # security-rule catalog carrying this specific SQL/PHP example.
  downgrade:
    scope: file-or-parent
    any:
    - id: metadata/package/testing/presence/upload-fixture::javascript-upload-webshell-test-context
    - id: metadata/file/catalog/pattern-rules::js-security-catalog-php-webshell-example
    - id: micro-behaviors/data/embedded/script::embedded-php-open-tag
    - id: metadata/package/documentation/security-catalog::quoted-command-reference-contexts
    - id: well-known/tool/offensive/projectdiscovery::nuclei-yaml-template-header
    - id: metadata/package/documentation/security-catalog::html-sql-outfile-reference
