# JSP has no Java flow projection. Recognize the conventional split-argv
# implementation only with both request bindings and the complete EC helper.
# Text matchers include decoded Unicode escapes; raw YARA does not.
defaults:
  platforms: [unix, windows]
  for: [jsp]
  attack: T1505.003
  mbc: B0030
composite_rules:
  - id: jsp-charset-request-command
    desc: JSP charset-converted request values become process argv
    crit: hostile
    conf: 0.99
    all:
      - id: metadata/lang/scripted::jsp-server-page
      - id: micro-behaviors/communications/http/request/params::jsp-request-ec-z1-binding
      - id: micro-behaviors/communications/http/request/params::jsp-request-ec-z2-binding
      - id: micro-behaviors/data/codec::java-ec-latin1-charset-helper
      - id: micro-behaviors/process/create/exec::java-split-prefix-argv-exec
