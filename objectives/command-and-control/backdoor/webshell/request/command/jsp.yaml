# A JSP page that turns an HTTP request parameter into a spawned process is a
# webshell: the page is the command channel.
#
# JSP has its own file type. The other carrier types remain for JSP fragments
# that are embedded in files classified from their surrounding content.
defaults:
  platforms:
  - windows
  - unix
  for:
  - jsp
  - java
  - class
  - html
  - javascript
  - python
  - vbs
  mbc: B0030
  attack: T1505.003
traits:
- id: jsp-request-body-read-source
  desc: JSP reads its HTTP request body
  crit: notable
  conf: 0.9
  for: [jsp]
  if:
    type: text
    regex: 'request\s*\.\s*getReader\s*\('
- id: jsp-command-temp-file-source
  desc: JSP references its command temp file
  crit: notable
  conf: 0.94
  for: [jsp]
  if:
    type: text
    substr: CMD
- id: jsp-obfuscated-processbuilder-classname
  desc: JSP encodes the ProcessBuilder name as bytes
  crit: notable
  conf: 0.96
  for: [jsp]
  if:
    type: text
    substr: 106,97,118,97,46,108,97,110,103,46,80,114,111,99,101,115,115,66,117,105,108,100,101,114
- id: jsp-reflective-processbuilder-constructor
  desc: JSP reflectively builds ProcessBuilder argv
  crit: notable
  conf: 0.94
  for: [jsp]
  if:
    type: text
    substr: getConstructor(String[].class)
- id: jsp-request-command-body-source
  desc: JSP reads commands from the HTTP body
  crit: notable
  conf: 0.92
  for: [jsp]
  if:
    type: text
    substr: request.getReader()
- id: jsp-utf16be-runtime-request-exec
  desc: UTF-16BE JSP executes request commands
  crit: notable
  conf: 0.99
  for: [jsp]
  if:
    type: hex
    pattern: "00 52 00 75 00 6E 00 74 00 69 00 6D 00 65 00 2E 00 67 00 65 00 74 00 52 00 75 00 6E 00 74 00 69 00 6D 00 65 00 28 00 29 00 2E 00 65 00 78 00 65 00 63 00 28 00 72 00 65 00 71 00 75 00 65 00 73 00 74 00 2E 00 67 00 65 00 74 00 50 00 61 00 72 00 61 00 6D 00 65 00 74 00 65 00 72 00 28 00 22 00 69 00 22 00 29 00 29 00 3B"
- id: jsp-utf32le-runtime-request-exec
  desc: UTF-32LE JSP executes request commands
  crit: notable
  conf: 0.99
  for: [jsp]
  if:
    type: hex
    pattern: "52 00 00 00 75 00 00 00 6E 00 00 00 74 00 00 00 69 00 00 00 6D 00 00 00 65 00 00 00 2E 00 00 00 67 00 00 00 65 00 00 00 74 00 00 00 52 00 00 00 75 00 00 00 6E 00 00 00 74 00 00 00 69 00 00 00 6D 00 00 00 65 00 00 00 28 00 00 00 29 00 00 00 2E 00 00 00 65 00 00 00 78 00 00 00 65 00 00 00 63 00 00 00 28 00 00 00 72 00 00 00 65 00 00 00 71 00 00 00 75 00 00 00 65 00 00 00 73 00 00 00 74 00 00 00 2E 00 00 00 67 00 00 00 65 00 00 00 74 00 00 00 50 00 00 00 61 00 00 00 72 00 00 00 61 00 00 00 6D 00 00 00 65 00 00 00 74 00 00 00 65 00 00 00 72 00 00 00 28 00 00 00 22 00 00 00 69 00 00 00 22 00 00 00 29 00 00 00 29 00 00 00 3B 00 00 00"
- id: jsp-ibm1026-runtime-request-exec
  desc: IBM1026 JSP executes request commands
  crit: notable
  conf: 0.99
  for: [jsp]
  if:
    type: hex
    pattern: "D9 A4 95 A3 89 94 85 4B 87 85 A3 D9 A4 95 A3 89 94 85 4D 5D 4B 85 A7 85 83 4D 99 85 98 A4 85 A2 A3 4B 87 85 A3 D7 81 99 81 94 85 A3 85 99 4D FC 89 FC 5D 5D 5E"
composite_rules:
- id: jsp-request-processbuilder-handler
  for: [jsp, python, javascript, html]
  desc: JSP reads request parameters and constructs a subprocess
  crit: suspicious
  conf: 0.96
  all:
  - id: metadata/lang/scripted::jsp-server-page
  - id: micro-behaviors/communications/http/request/params::java-servlet-get-parameter
  - id: micro-behaviors/process/create/spawn::java-processbuilder-source
  unless:
  - id: well-known/tool/offensive/
  - id: metadata/package/testing/presence/harness::test-fixture-directory
- id: jsp-request-processbuilder-shell
  for: [jsp, python, javascript, html]
  desc: JSP request handler launches an operating-system shell
  crit: hostile
  conf: 0.99
  all:
  - id: jsp-request-processbuilder-handler
  any:
  - id: micro-behaviors/process/create/shell/selection::java-windows-command-array-source
  - id: micro-behaviors/process/create/shell/selection::java-posix-command-array-source
  - id: micro-behaviors/process/create/shell/selection::java-numeric-posix-command-array-source
  needs: 1
- id: jsp-shell
  for: [jsp, python, javascript, vbs, html]
  desc: JSP request access with process execution
  crit: suspicious
  conf: 0.9
  all:
  - id: metadata/lang/scripted::jsp-server-page
  - id: micro-behaviors/communications/http/request/params::java-servlet-get-parameter
  any:
  - id: micro-behaviors/process/create/spawn::java-runtime-exec-source
  - id: micro-behaviors/process/create/exec::java-runtime-variable-exec-source
  - id: micro-behaviors/process/create/spawn::java-runtime-exec-bytecode-symbol
  unless:
  - id: well-known/tool/offensive/
  - id: metadata/package/testing/presence/harness::test-fixture-directory
# Interactive shells keep a ProcessThread and pull cmd/function from the
# request; pair that durable worker with the request channel so the page
# scores in both exec/ and request/ rather than only on the worker class.
- id: jsp-process-thread-request-channel
  for: [jsp, python, javascript, vbs, html]
  desc: JSP ProcessThread command channel driven by request parameters
  crit: hostile
  conf: 0.97
  all:
  - id: metadata/lang/scripted::jsp-server-page
  - id: objectives/command-and-control/backdoor/webshell/exec::jsp-process-thread-class
  - id: micro-behaviors/communications/http/request/params::java-servlet-get-parameter
  any:
  - id: micro-behaviors/process/create/spawn::java-runtime-exec-source
  - id: micro-behaviors/process/create/exec::java-runtime-variable-exec-source
  unless:
  - id: well-known/tool/offensive/
  - id: metadata/package/testing/presence/harness::test-fixture-directory
- id: jsp-base64-parameter-exec
  for: [jsp, html, javascript, python, makefile]
  desc: JSP decodes a parameter and executes it
  crit: hostile
  conf: 0.96
  near_bytes: 1024
  all:
  - id: metadata/lang/scripted::jsp-server-page
  - id: micro-behaviors/data/decode/base64::java-legacy-base64-decoder-source-call
  - id: "micro-behaviors/data/property/access::get-parameter-method-call-syntax"
  - id: micro-behaviors/process/create/spawn::java-runtime-exec-source
  any:
  - id: metadata/lang/scripted::jsp-page-directive
  - id: metadata/lang/scripted::jsp-xml-scriptlet
  needs: 1
- id: jsp-runtime-exec-request-param
  for: [jsp, python, javascript, html]
  desc: JSP request access with Runtime.exec
  crit: suspicious
  conf: 0.98
  all:
  - id: metadata/lang/scripted::jsp-server-page
  - id: micro-behaviors/process/create/spawn::java-runtime-exec-source
  - id: micro-behaviors/communications/http/request/params::java-servlet-get-parameter
  unless:
  - id: well-known/tool/offensive/
  - id: metadata/package/testing/presence/harness::test-fixture-directory
  near_bytes: 4096
# Most hand-written JSP shells hold the Runtime in a local before calling exec
# (`Runtime rt = Runtime.getRuntime(); rt.exec(cmd)`), so the
# `Runtime.getRuntime().exec` literal never appears. Anchor that variant on the
# page directive instead: a server page that reaches the Runtime accessor and
# reads request parameters is the same command channel.
- id: jsp-page-runtime-request-shell
  for: [jsp, python, javascript, vbs, html]
  desc: JSP page combines request access with Runtime execution
  crit: suspicious
  conf: 0.96
  all:
  - id: metadata/lang/scripted::jsp-server-page
  - id: micro-behaviors/process/create/spawn::java-getruntime-ref
  - id: micro-behaviors/communications/http/request/params::java-servlet-get-parameter
  any:
  - id: micro-behaviors/process/create/spawn::java-runtime-exec-source
  - id: micro-behaviors/process/create/exec::java-runtime-variable-exec-source
  unless:
  - id: well-known/tool/offensive/
  - id: metadata/package/testing/
  - id: "metadata/file/naming::test-directory-component"
- id: jsp-cookie-command-webshell
  for: [jsp, python, javascript, java, html]
  desc: JSP decodes a cookie-supplied command and executes it
  crit: hostile
  conf: 0.99
  all:
  - id: metadata/lang/scripted::jsp-server-page
  - id: micro-behaviors/process/create/spawn::java-runtime-exec-source
  - id: micro-behaviors/data/decode/base64::java-base64-decoder-source-call
  any:
  - id: micro-behaviors/communications/http/cookies::servlet-request-cookie-read
  - id: micro-behaviors/communications/http/cookies::servlet-cookie-helper-read
  near_bytes: 4096
  unless:
  - id: well-known/tool/offensive/

- id: jsp-encrypted-request-command-shell
  for: [jsp]
  desc: JSP decrypts an HTTP request body and executes the command
  crit: hostile
  conf: 0.99
  all:
  - id: jsp-request-body-read-source
  - id: micro-behaviors/crypto/library/provider::java-cipher-decrypt-mode-source
  - id: micro-behaviors/process/create/spawn::java-runtime-exec-source
  near_bytes: 12000

- id: jsp-obfuscated-processbuilder-request-shell
  for: [jsp]
  desc: JSP executes a command read from the request through reflective ProcessBuilder
  crit: hostile
  conf: 0.99
  all:
  - id: jsp-obfuscated-processbuilder-classname
  - id: jsp-reflective-processbuilder-constructor
  - id: jsp-request-command-body-source
  - id: micro-behaviors/process/io/stream::jsp-input-stream-access-source
- id: jsp-non-ascii-runtime-request-exec
  for: [jsp]
  desc: Encoded JSP source executes a command from an HTTP parameter
  crit: hostile
  conf: 0.99
  all:
  - id: metadata/lang/scripted::jsp-page-directive
  any:
  - id: objectives/command-and-control/backdoor/webshell/request/command::jsp-utf16be-runtime-request-exec
  - id: objectives/command-and-control/backdoor/webshell/request/command::jsp-utf32le-runtime-request-exec
  - id: objectives/command-and-control/backdoor/webshell/request/command::jsp-ibm1026-runtime-request-exec
  needs: 1

- id: jsp-direct-request-runtime-command
  for: [jsp]
  desc: JSP directly executes an HTTP parameter
  crit: hostile
  conf: 0.99
  all:
  - id: metadata/lang/scripted::jsp-server-page
  - id: micro-behaviors/process/create/request-input::runtime-exec-request-parameter
  - id: micro-behaviors/communications/http/request/params::java-servlet-get-parameter
