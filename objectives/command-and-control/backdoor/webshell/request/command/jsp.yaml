# A JSP page that turns an HTTP request parameter into a spawned process is a
# webshell: the page is the command channel.
#
# JSP has its own file type. The other carrier types remain for JSP fragments
# that are embedded in files classified from their surrounding content.
defaults:
  platforms:
    - windows
    - unix
  for:
    - jsp
    - java
    - class
    - html
    - javascript
    - python
    - vbs
  mbc: B0030
  attack: T1505.003
traits:
  - id: jsp-obfuscated-processbuilder-classname
    desc: JSP encodes the ProcessBuilder name as bytes
    crit: notable
    conf: 0.96
    for: [jsp]
    if:
      type: text
      substr: 106,97,118,97,46,108,97,110,103,46,80,114,111,99,101,115,115,66,117,105,108,100,101,114

  - id: jsp-utf16be-runtime-request-exec
    desc: UTF-16BE JSP executes request commands
    crit: notable
    conf: 0.99
    for: [jsp]
    if:
      type: hex
      pattern: "00 52 00 75 00 6E 00 74 00 69 00 6D 00 65 00 2E 00 67 00 65 00 74 00 52 00 75 00 6E 00 74 00 69
        00 6D 00 65 00 28 00 29 00 2E 00 65 00 78 00 65 00 63 00 28 00 72 00 65 00 71 00 75 00 65 00 73 00 74 00
        2E 00 67 00 65 00 74 00 50 00 61 00 72 00 61 00 6D 00 65 00 74 00 65 00 72 00 28 00 22 00 69 00 22 00 29
        00 29 00 3B"
  - id: jsp-utf32le-runtime-request-exec
    desc: UTF-32LE JSP executes request commands
    crit: notable
    conf: 0.99
    for: [jsp]
    if:
      type: hex
      pattern: "52 00 00 00 75 00 00 00 6E 00 00 00 74 00 00 00 69 00 00 00 6D 00 00 00 65 00 00 00 2E 00 00 00
        67 00 00 00 65 00 00 00 74 00 00 00 52 00 00 00 75 00 00 00 6E 00 00 00 74 00 00 00 69 00 00 00 6D 00 00
        00 65 00 00 00 28 00 00 00 29 00 00 00 2E 00 00 00 65 00 00 00 78 00 00 00 65 00 00 00 63 00 00 00 28 00
        00 00 72 00 00 00 65 00 00 00 71 00 00 00 75 00 00 00 65 00 00 00 73 00 00 00 74 00 00 00 2E 00 00 00 67
        00 00 00 65 00 00 00 74 00 00 00 50 00 00 00 61 00 00 00 72 00 00 00 61 00 00 00 6D 00 00 00 65 00 00 00
        74 00 00 00 65 00 00 00 72 00 00 00 28 00 00 00 22 00 00 00 69 00 00 00 22 00 00 00 29 00 00 00 29 00 00
        00 3B 00 00 00"
  - id: jsp-ibm1026-runtime-request-exec
    desc: EBCDIC JSP executes request commands
    crit: notable
    conf: 0.99
    for: [jsp]
    if:
      type: hex
      pattern: "D9 A4 95 A3 89 94 85 4B 87 85 A3 D9 A4 95 A3 89 94 85 4D 5D 4B 85 A7 85 83 4D 99 85 98 A4 85 A2
        A3 4B 87 85 A3 D7 81 99 81 94 85 A3 85 99 4D (FC|7F) 89 (FC|7F) 5D 5D 5E"
composite_rules:
  - id: jsp-request-processbuilder-handler
    for: [jsp, python, javascript, html, data]
    desc: JSP reads request parameters and constructs a subprocess
    crit: suspicious
    conf: 0.96
    all:
      - id: metadata/lang/source/language::jsp-server-page
      - id: micro-behaviors/communications/http/request/params::java-servlet-get-parameter
      - id: metadata/lang/source/syntax/call/construction::java-processbuilder-source
  - id: jsp-request-processbuilder-shell
    for: [jsp, python, javascript, html, data]
    desc: JSP request handler launches an operating-system shell
    crit: hostile
    conf: 0.99
    all:
      - id: jsp-request-processbuilder-handler
    any:
      - id: micro-behaviors/process/create/subprocess/configure::java-windows-command-array-source
      - id: micro-behaviors/process/create/subprocess/configure::java-posix-command-array-source
      - id: micro-behaviors/process/create/subprocess/configure::java-numeric-posix-command-array-source
    needs: 1
  - id: jsp-process-thread-request-channel
    for: [jsp, python, javascript, vbs, html]
    desc: JSP ProcessThread command channel driven by request parameters
    crit: hostile
    conf: 0.97
    all:
      - id: metadata/lang/source/language::jsp-server-page
      - id: objectives/command-and-control/backdoor/webshell/exec::jsp-process-thread-class
      - id: micro-behaviors/communications/http/request/params::java-servlet-get-parameter
    any:
      - id: micro-behaviors/process/create/subprocess/launch::java-runtime-exec-source
      - id: micro-behaviors/process/create/subprocess/launch::java-runtime-variable-exec-source
  - id: jsp-base64-parameter-exec
    for: [jsp, html, javascript, python, makefile]
    desc: JSP decodes a parameter and executes it
    crit: hostile
    conf: 0.96
    near_bytes: 1024
    all:
      - id: metadata/lang/source/language::jsp-server-page
      - id: micro-behaviors/data/decode/base64/unspecified::java-legacy-base64-decoder-source-call
      - id: "metadata/lang/source/syntax/call/member::get-parameter-method-call-syntax"
      - id: micro-behaviors/process/create/subprocess/launch::java-runtime-exec-source
    any:
      - id: metadata/lang/source/language::jsp-page-directive
      - id: metadata/lang/source/language::jsp-xml-scriptlet
    needs: 1
  - id: jsp-runtime-exec-request-param
    for:
      - jsp
      - python
      - javascript
      - html
    desc: JSP request command passed to Runtime.exec
    crit: suspicious
    conf: 0.98
    all:
      - id: objectives/command-and-control/backdoor/webshell/request/parameter::jsp-cmd-parameter-runtime-exec
      - id: metadata/lang/source/language::jsp-server-page
      - id: micro-behaviors/process/create/subprocess/launch::java-runtime-exec-source
      - id:
          objectives/command-and-control/backdoor/webshell/request/parameter::jsp-local-request-command-execution
      - id: micro-behaviors/communications/http/request/params::java-servlet-get-parameter
    unless:
      - id: micro-behaviors/metaprogramming/generation/source::configured-assessment-plugin
    near_bytes: 4096
  - id: jsp-obfuscated-processbuilder-request-shell
    for: [jsp]
    desc: JSP executes a command read from the request through reflective ProcessBuilder
    crit: hostile
    conf: 0.99
    all:
      - id: jsp-obfuscated-processbuilder-classname
      - id: micro-behaviors/metaprogramming/reflection/resolve::java-string-array-constructor-lookup
      - id: micro-behaviors/communications/http/server/request::jsp-request-reader-source
      - id: micro-behaviors/data/stream/read::jsp-input-stream-access-source
  - id: jsp-non-ascii-runtime-request-exec
    for: [jsp]
    desc: Encoded JSP source executes a command from an HTTP parameter
    crit: hostile
    conf: 0.99
    all:
      - id: metadata/lang/source/language::jsp-page-directive
    any:
      - id: objectives/command-and-control/backdoor/webshell/request/command::jsp-utf16be-runtime-request-exec
      - id: objectives/command-and-control/backdoor/webshell/request/command::jsp-utf32le-runtime-request-exec
      - id: objectives/command-and-control/backdoor/webshell/request/command::jsp-ibm1026-runtime-request-exec
    needs: 1

  # Directive-less JSP fragments assembled as data by an exploit or
  # dropper in another language never carry a page directive, so the
  # scriptlet opener plus a parameter read inside the launch call's
  # own argument list identifies the same request-command page.
  # Bare co-occurrence of a parameter read and a process launch is
  # not enough: fixed-command pages read parameters for other work.
  - id: jsp-embedded-scriptlet-request-shell
    for: [python, javascript, html, data]
    desc: Embedded JSP scriptlet executes a request-supplied shell command
    crit: hostile
    conf: 0.98
    near_bytes: 1024
    all:
      - id: metadata/lang/source/language::jsp-scriptlet-tag
    any:
      - id: objectives/command-and-control/backdoor/webshell/request/parameter::jsp-processbuilder-parameter-arg
      - id: objectives/command-and-control/backdoor/webshell/request/parameter::jsp-exec-parameter-arg
    needs: 1
    unless:
      - id: micro-behaviors/metaprogramming/generation/source::configured-assessment-plugin

  - id: jsp-direct-request-runtime-command
    for: [jsp]
    desc: JSP directly executes an HTTP parameter
    crit: hostile
    conf: 0.99
    all:
      - id: metadata/lang/source/language::jsp-server-page
      - id: micro-behaviors/communications/http/request/params::java-servlet-get-parameter
    any:
      - id: micro-behaviors/process/create/variable::runtime-exec-request-parameter
      - id: objectives/command-and-control/backdoor/webshell/request/parameter::runtime-cmd-prefix-request-parameter
