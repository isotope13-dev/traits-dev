traits:
  - id: php-query-input-exec-text
    desc: PHP GET-to-exec command text
    crit: suspicious
    for: [scripts]
    platforms: [linux, macos, windows]
    conf: 0.98
    if:
      type: text
      regex: (?is)exec[[:space:]]*\([[:space:]]*(\$_GET|%24_GET)[[:space:]]*\[
    unless:
    - id: metadata/package/testing/harness/runtime::bun-assertion-suite
    - id: micro-behaviors/ui/help::escaped-local-command-reference
    - id: well-known/tool/offensive/bingo/
    - id: well-known/tool/detection/react-doctor::react-doctor-tree-path
    - id: well-known/tool/offensive/pentestkit::local-storage-panel
