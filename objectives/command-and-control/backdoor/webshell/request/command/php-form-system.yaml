defaults:
  crit: notable
  attack: T1505.003
  for:
    - php
  platforms:
    - unix
    - windows
traits:
  - id: php-system-cmd-var
    desc: Runs system on a command variable
    crit: suspicious
    conf: 0.93
    if:
      type: text
      regex: 'system\(\s*\$(this->)?(cmd|shell)\b'
  - id: php-command-form-field
    desc: Form field named cmd or shell
    crit: notable
    conf: 0.88
    if:
      type: text
      regex: 'name=\\?"(cmd|shell)\\?"'
composite_rules:
  - id: php-form-system-shell
    desc: Form posts into PHP system
    crit: hostile
    conf: 0.96
    near_lines: 20
    all:
      - id: php-system-cmd-var
      - id: php-command-form-field
