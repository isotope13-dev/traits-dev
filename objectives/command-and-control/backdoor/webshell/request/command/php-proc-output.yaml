defaults:
  platforms: [unix, windows]
  for: [php]
  conf: 0.98
  attack: T1505.003

composite_rules:
  - id: php-request-proc-open-console
    desc: Request command shell returns process output
    crit: hostile
    all:
      - id: micro-behaviors/process/fd/stdio::php-proc-output-echo
    any:
      - id: micro-behaviors/process/create/shell/lang::exec-user-input-request--g2
      - id: micro-behaviors/process/create/shell/lang::exec-user-input-post--g2
      - id: micro-behaviors/process/create/shell/lang::exec-user-input-get-text--rx-3
    near_bytes: 1024
