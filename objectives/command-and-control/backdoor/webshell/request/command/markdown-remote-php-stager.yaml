defaults:
  for: [markdown]
  platforms: [unix, windows]
  attack: T1505.003,T1105

traits:
  - id: markdown-php-eval-http-read
    desc: PHP evaluates content fetched over HTTP
    crit: suspicious
    conf: 0.96
    if:
      type: text
      regex: 'eval\s*\(\s*substr\s*\(\s*file_get_contents\s*\(\s*["'']https?://'
  - id: markdown-webshell-description
    desc: Document describes a web shell
    crit: notable
    conf: 0.92
    if:
      type: text
      regex: '(?i)\bweb[ -]?shell\b'

composite_rules:
  - id: markdown-webshell-remote-eval-stub
    desc: Webshell document includes remote PHP evaluation stub
    crit: hostile
    conf: 0.98
    all:
      - id: markdown-php-eval-http-read
      - id: markdown-webshell-description
