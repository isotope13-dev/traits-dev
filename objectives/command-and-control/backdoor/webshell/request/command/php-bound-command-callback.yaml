defaults:
  platforms: [unix, windows]
  for: [php]
  attack: T1505.003,T1059
  mbc: B0030
traits:
  # Call facts retain the variable target, but do not resolve its assignment.
  # Nearby strings and a variable call cannot prove the selected function.
  # Require adjacent statements in the same block and the same variable;
  # an intervening reassignment, a quoted example or a different callback fails.
  - id: php-bound-command-callback
    desc: PHP bound shell callback executes request input
    crit: hostile
    conf: 0.99
    if:
      type: tree-sitter
      language: php
      query: |
        (_
          (expression_statement
            (assignment_expression
              left: (variable_name) @bound
              right: [(string . (string_content) @command .)
                      (encapsed_string . (string_content) @command .)]))
          .
          (comment)*
          .
          (expression_statement
            (function_call_expression
              function: (variable_name) @called
              arguments: (arguments . (argument
                (subscript_expression (variable_name) @request))))) @evidence
          (#eq? @bound @called)
          (#match? @command "(?i)^(system|exec|shell_exec|passthru)$")
          (#match? @request "^\\$_(GET|POST|REQUEST|COOKIE)$"))
