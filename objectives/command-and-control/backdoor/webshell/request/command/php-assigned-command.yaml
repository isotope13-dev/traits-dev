defaults:
  crit: hostile
  platforms: [windows, unix]
  for: [php]
  attack: T1505.003
  mbc: B0030

composite_rules:
  - id: php-request-command-api-probes
    desc: Request command branch probes execution APIs
    conf: 0.99
    all:
      - id: micro-behaviors/process/create/shell/lang::php-request-assigned-command-branch
      - id: micro-behaviors/communications/http/request/superglobal::request-param-assignment
      # Require explicit availability probes for multiple execution APIs. A
      # bare shell_exec()/system() co-occurrence also appears in ordinary build
      # tooling and does not establish fallback behavior.
      - id: micro-behaviors/process/create/shell/lang::php-multiple-execution-availability-checks
      - id: micro-behaviors/process/create/shell/lang::exec-variable-argument
    near_bytes: 512

