defaults:
  platforms: [unix, windows]
  attack: T1505.003,T1071.001,T1573.002
  mbc: B0030

composite_rules:
  - id: native-signed-encrypted-header-command-backdoor
    desc: Native server verifies signature and decrypts X- header to run commands
    crit: hostile
    conf: 0.97
    for: [elf, macho, pe, c, cpp]
    all:
      - id: micro-behaviors/communications/http/header/custom::binary-custom-x-header-name
      - id: micro-behaviors/crypto/key/import/
      - id: micro-behaviors/crypto/hash/digest/
      - id: micro-behaviors/crypto/verify/
      - id: micro-behaviors/crypto/decrypt/
    any:
      - id: metadata/binary/symbols/name/process::c-popen
      - id: micro-behaviors/process/create/subprocess/capture::c-popen-call
      - id: micro-behaviors/process/create/shell/
      - id: micro-behaviors/process/create/exec/

  - id: go-signed-encrypted-header-command-backdoor
    desc: Go handler verifies signature and decrypts X- header to run commands
    crit: hostile
    conf: 0.97
    for: [go]
    near_lines: 200
    all:
      - id: micro-behaviors/communications/http/header/custom::go-request-x-header-get
      - id: micro-behaviors/data/decode/base64/
      - id: micro-behaviors/crypto/key/
      - id: micro-behaviors/crypto/hash/digest/
      - id: micro-behaviors/crypto/verify/
      - id: micro-behaviors/crypto/decrypt/
      - id: micro-behaviors/crypto/symmetric/
      - id: micro-behaviors/process/create/subprocess/

  - id: python-signed-encrypted-header-command-backdoor
    desc: Python handler verifies signature and decrypts X- header to run commands
    crit: hostile
    conf: 0.97
    for: [python]
    near_lines: 200
    all:
      - id: micro-behaviors/communications/http/header/custom::python-request-x-header-get
      - id: micro-behaviors/data/decode/base64/
      - id: micro-behaviors/crypto/key/
      - id: micro-behaviors/crypto/hash/digest/
      - id: micro-behaviors/crypto/verify/
      - id: micro-behaviors/crypto/decrypt/
      - id: micro-behaviors/crypto/symmetric/
    any:
      - id: micro-behaviors/process/create/subprocess/
      - id: micro-behaviors/process/create/shell/
      - id: micro-behaviors/process/create/exec/

  - id: js-signed-encrypted-header-command-backdoor
    desc: JS handler verifies signature and decrypts X- header to run commands
    crit: hostile
    conf: 0.97
    for: [javascript, typescript]
    near_lines: 200
    all:
      - id: micro-behaviors/communications/http/header/custom::js-request-x-header-get
      - id: micro-behaviors/data/decode/base64/
      - id: micro-behaviors/crypto/key/
      - id: micro-behaviors/crypto/hash/digest/
      - id: micro-behaviors/crypto/verify/
      - id: micro-behaviors/crypto/decrypt/
      - id: micro-behaviors/crypto/symmetric/
    any:
      - id: micro-behaviors/process/create/subprocess/
      - id: micro-behaviors/process/create/shell/
      - id: micro-behaviors/process/create/exec/

  - id: php-signed-encrypted-header-command-backdoor
    desc: PHP handler verifies signature and decrypts X- header to run commands
    crit: hostile
    conf: 0.97
    for: [php]
    near_lines: 200
    all:
      - id: micro-behaviors/communications/http/header/custom::http-x-custom-header
      - id: micro-behaviors/data/decode/base64/
      - id: micro-behaviors/crypto/key/
      - id: micro-behaviors/crypto/hash/digest/
      - id: micro-behaviors/crypto/verify/
      - id: micro-behaviors/crypto/decrypt/
      - id: micro-behaviors/crypto/symmetric/
    any:
      - id: micro-behaviors/process/create/subprocess/
      - id: micro-behaviors/process/create/shell/
      - id: micro-behaviors/process/create/exec/
