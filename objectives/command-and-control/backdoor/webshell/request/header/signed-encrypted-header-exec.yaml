defaults:
  platforms: [unix, windows]
  attack: T1505.003,T1071.001,T1573.002
  mbc: B0030

composite_rules:
  - id: native-signed-encrypted-header-command-backdoor
    desc: Native server verifies signature and decrypts request header to run commands
    crit: hostile
    conf: 0.97
    for: [elf, macho, pe, dll, so, dylib, c, cpp]
    # Whole-binary co-occurrence: a large runtime (Chromium, a Go service)
    # links an HTTP server, TLS verify/decrypt and process spawning for its
    # own purposes. A dedicated implant stays small.
    size_max: 4194304
    all:
      - id: micro-behaviors/communications/http/server/request::server-request-header-read
      - id: micro-behaviors/crypto/verify/
      - id: micro-behaviors/crypto/decrypt/
    any:
      - id: metadata/binary/symbols/name/process::c-popen
      - id: micro-behaviors/process/create/shell/
      - id: micro-behaviors/process/create/subprocess/
    unless:
      - id: well-known/lib/runtime/scripted/electron::chromium-engine-capability-context
      - id: well-known/lib/runtime/scripted/electron::chromium-engine-marker-cluster

  - id: go-signed-encrypted-header-command-backdoor
    desc: Go handler verifies signature and decrypts request header to run commands
    crit: hostile
    conf: 0.97
    for: [go]
    near_lines: 200
    all:
      - id: micro-behaviors/communications/http/server/request::server-request-header-read
      - id: micro-behaviors/data/decode/base64/
      - id: micro-behaviors/crypto/verify/
      - id: micro-behaviors/crypto/decrypt/
    any:
      - id: micro-behaviors/process/create/subprocess/
      - id: micro-behaviors/process/create/shell/
      - id: micro-behaviors/process/create/exec/

  - id: python-signed-encrypted-header-command-backdoor
    desc: Python handler verifies signature and decrypts request header to run commands
    crit: hostile
    conf: 0.97
    for: [python]
    near_lines: 200
