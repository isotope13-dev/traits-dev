defaults:
  platforms: [unix, windows]
  for: [php]
traits:
  - id: php-direct-header-command
    desc: PHP executes an HTTP header as command
    crit: suspicious
    conf: 0.99
    attack: T1505.003
    if:
      type: tree-sitter
      language: php
      query: |
        ((function_call_expression
          function: (name) @sink
          arguments: (arguments . (argument
            (subscript_expression
              (variable_name) @source
              [(string (string_content) @header)
               (encapsed_string (string_content) @header)])))) @command
          (#match? @sink "(?i)^(exec|system|shell_exec|passthru)$")
          (#eq? @source "$_SERVER")
          (#match? @header "^HTTP_"))
