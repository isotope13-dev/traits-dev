# Class construction uses equals as a servlet-context payload entry point.
defaults:
  for: [jsp]
  platforms: [unix, windows]
  attack: T1505.003

traits:
  - id: jsp-newinstance-equals-context-dispatch
    desc: JSP new instance receives context via equals
    crit: suspicious
    conf: 0.97
    if:
      type: text
      regex: '\.newInstance\s*\(\s*\)\s*\.\s*equals\s*\(\s*(pageContext|request|session|response)'

composite_rules:
  - id: jsp-classloader-equals-pagecontext-shell
    desc: JSP class loader dispatches servlet context through equals
    crit: hostile
    conf: 0.99
    all:
      - id: jsp-newinstance-equals-context-dispatch
      - id: micro-behaviors/communications/http/server/request::jsp-request-reader-source
      - id: micro-behaviors/process/interpreter/runtime/jvm::java-classloader

