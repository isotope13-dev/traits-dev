# No family names, request parameter names, cipher keys or response markers.
# The ClassLoader byte-array signature also survives hiding the method name
# in a numeric byte array, as VersaMem does for defineClass.
defaults:
  platforms: [unix, windows]
  for: [class]
  attack: T1505.003
  mbc: B0030

composite_rules:
  - id: jvm-template-encrypted-request-classloader
    desc: Embedded request handler decrypts and reflectively loads bytecode
    crit: hostile
    conf: 0.97
    all:
      - id: micro-behaviors/data/source/dynamic/reflect::jvm-template-classloader-bytearray-method
      - id: micro-behaviors/data/source/dynamic/reflect::jvm-template-parameter-classloader-invoke
      - id: micro-behaviors/crypto/decrypt::jvm-template-cipher-decrypt-init
