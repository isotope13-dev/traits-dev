# A JSP page that loads request-supplied or embedded compiled code (classes,
# serialized objects, remote objects) into the server process is a webshell.
#
# JSP has its own file type. The other carrier types remain for JSP fragments
# that are embedded in files classified from their surrounding content.
defaults:
  platforms:
  - windows
  - unix
  for:
  - jsp
  - java
  - class
  - html
  - javascript
  - python
  - vbs
  mbc: B0030
  attack: T1505.003
traits:
- id: jsp-jndi-rmi-lookup-source
  desc: JSP looks up a remote RMI object
  crit: notable
  conf: 0.94
  for: [jsp]
  if:
    type: text
    regex: '(?s)\.lookup\s*\(\s*["'']rmi://|new\s+JNDI\s*\(\s*\)\s*\.lookup\s*\(\s*["'']rmi://'
- id: jsp-reflective-run-method-source
  desc: JSP invokes a supplied run method reflectively
  crit: notable
  conf: 0.94
  for: [jsp]
  if:
    type: text
    regex: '(?s)getMethod\s*\(\s*["'']run["''][\s\S]{0,160}\.invoke\s*\('
- id: jsp-request-input-written-to-file
  desc: JSP writes request data to a file
  crit: notable
  conf: 0.9
  for: [jsp]
  if:
    type: text
    regex: '(?is)request\s*\.\s*getParameter\s*\([^)]{1,80}\)[\s\S]{0,800}Files\.write\s*\('
- id: jsp-versionhelper-request-classload-source
  desc: JSP loads Base64 class with request command
  crit: notable
  conf: 0.94
  for: [jsp]
  if:
    type: text
    substr: VersionHelper
- id: jsp-versionhelper-loadclass-call
  desc: JSP calls VersionHelper.loadClass
  crit: notable
  conf: 0.92
  for: [jsp]
  if:
    type: text
    substr: .loadClass(
- id: jsp-serviceloader-scriptengine-provider
  desc: JSP loads a ScriptEngineFactory
  crit: notable
  conf: 0.94
  for: [jsp]
  if:
    type: text
    substr: ScriptEngineFactory.class
- id: jsp-serviceloader-urlclassloader
  desc: JSP configures URLClassLoader service discovery
  crit: notable
  conf: 0.94
  for: [jsp]
  if:
    type: text
    substr: URLClassLoader
- id: jsp-serviceloader-uploaded-engine-source
  desc: JSP loads an embedded engine JAR
  crit: notable
  conf: 0.96
  for: [jsp]
  if:
    type: text
    substr: Base64.getDecoder().decode
- id: jsp-dynamic-jsp-classloader
  desc: JSP loads embedded JSP classes
  crit: notable
  conf: 0.94
  for: [jsp]
  if:
    type: text
    substr: class JspClassLoader
- id: jsp-dynamic-jsp-servlet-bootstrap
  desc: JSP bootstraps Tomcat JSP servlet classes
  crit: notable
  conf: 0.94
  for: [jsp]
  if:
    type: text
    substr: JspServlet
- id: jsp-dynamic-jsp-httpbase-dispatch
  desc: JSP dispatches requests to embedded HttpJspBase
  crit: notable
  conf: 0.94
  for: [jsp]
  if:
    type: text
    regex: 'HttpJspBase[\s\S]{0,700}\.service\s*\(\s*request\s*,\s*response'
- id: jsp-dynamic-jsp-servlet-loader-source
  desc: JSP serves an embedded JSP class
  crit: notable
  conf: 0.96
  for: [jsp]
  if:
    type: text
    substr: defineClass
- id: jsp-custom-objectinputstream-resolver
  desc: JSP defines custom deserialization resolution
  crit: notable
  conf: 0.94
  for: [jsp]
  if:
    type: text
    substr: extends ObjectInputStream
- id: jsp-objectstream-readobject-call
  desc: JSP triggers deserialization with readObject
  crit: notable
  conf: 0.9
  for: [jsp]
  if:
    type: text
    substr: .readObject()
- id: jsp-objectstream-urlclassloader
  desc: JSP resolves classes from temporary URLs
  crit: notable
  conf: 0.94
  for: [jsp]
  if:
    type: text
    substr: new URLClassLoader
- id: jsp-aes-request-classload-source
  desc: JSP decrypts an input buffer
  crit: notable
  conf: 0.96
  for: [jsp]
  if:
    type: text
    substr: .doFinal(
- id: jsp-cipher-numeric-decrypt-mode-source
  desc: JSP uses Cipher's numeric decrypt mode
  crit: notable
  conf: 0.92
  for: [jsp]
  if:
    type: text
    substr: .init(2,
- id: jsp-dynamic-defineclass-call
  desc: JSP defines a class from supplied bytes
  crit: notable
  conf: 0.92
  for: [jsp]
  if:
    type: text
    substr: .defineClass(
- id: jsp-memshell-packer-template
  desc: JSP decodes a build-time class placeholder
  crit: notable
  conf: 0.94
  for: [jsp]
  if:
    type: text
    substr: "{{base64Str}}"
composite_rules:
- id: jsp-request-base64-classload-shell
  for: [jsp]
  desc: JSP defines and executes a Base64 class supplied in the request body
  crit: hostile
  conf: 0.99
  all:
  - id: objectives/command-and-control/backdoor/webshell/request/command::jsp-request-body-read-source
  - id: micro-behaviors/data/decode/base64::java-base64-decoder-source-call
  - id: micro-behaviors/data/source/dynamic/reflect::java-defineclass-any
  - id: micro-behaviors/data/source/dynamic/reflect::java-newinstance

- id: jsp-deserialization-command-shell
  for: [jsp]
  desc: JSP deserializes a custom class after writing the request command
  crit: hostile
  conf: 0.99
  all:
  - id: objectives/command-and-control/backdoor/webshell/request/command::jsp-command-temp-file-source
  - id: jsp-custom-objectinputstream-resolver
  - id: jsp-objectstream-readobject-call
  - id: jsp-objectstream-urlclassloader
  - id: micro-behaviors/data/decode/base64::java-base64-decoder-source-call

- id: jsp-versionhelper-command-shell
  for: [jsp]
  desc: JSP executes a request command through a hidden loaded class
  crit: hostile
  conf: 0.99
  all:
  - id: jsp-versionhelper-request-classload-source
  - id: jsp-versionhelper-loadclass-call
  - id: micro-behaviors/data/decode/base64::java-base64-decoder-source-call
  - id: micro-behaviors/communications/http/request/params::java-servlet-get-parameter

- id: jsp-serviceloader-command-shell
  for: [jsp]
  desc: JSP executes request commands through a loaded script-engine JAR
  crit: hostile
  conf: 0.99
  all:
  - id: jsp-request-input-written-to-file
  - id: jsp-serviceloader-scriptengine-provider
  - id: jsp-serviceloader-urlclassloader
  - id: jsp-serviceloader-uploaded-engine-source

- id: jsp-embedded-jsp-memory-shell
  for: [jsp]
  desc: JSP loads a hidden JSP class into Tomcat and dispatches the request
  crit: hostile
  conf: 0.99
  all:
  - id: jsp-dynamic-jsp-classloader
  - id: jsp-dynamic-jsp-servlet-bootstrap
  - id: jsp-dynamic-jsp-httpbase-dispatch
  - id: jsp-dynamic-jsp-servlet-loader-source

- id: jsp-encrypted-jndi-rmi-command-shell
  for: [jsp]
  desc: JSP decrypts request data and invokes a remote JNDI RMI object
  crit: hostile
  conf: 0.99
  all:
  - id: objectives/command-and-control/backdoor/webshell/request/command::jsp-request-body-read-source
  - id: micro-behaviors/crypto/library/provider::java-cipher-decrypt-mode-source
  - id: jsp-jndi-rmi-lookup-source
  - id: jsp-reflective-run-method-source

- id: jsp-aes-request-classload-shell
  for: [jsp]
  desc: JSP decrypts a supplied class and installs it into the running web process
  crit: hostile
  conf: 0.99
  all:
  - id: objectives/command-and-control/backdoor/webshell/request/command::jsp-request-body-read-source
  - id: jsp-aes-request-classload-source
  - id: jsp-dynamic-defineclass-call
  - id: micro-behaviors/data/source/dynamic/reflect::java-newinstance
  any:
  - id: micro-behaviors/crypto/library/provider::java-cipher-decrypt-mode-source
  - id: objectives/command-and-control/backdoor/webshell/request/code-load::jsp-cipher-numeric-decrypt-mode-source
  needs: 1
- id: jsp-memshell-packer-template-suspicious
  for: [jsp]
  desc: JSP template installs a build-time supplied class into a custom classloader
  crit: suspicious
  conf: 0.97
  all:
  - id: objectives/command-and-control/backdoor/webshell/request/code-load::jsp-memshell-packer-template
  - id: micro-behaviors/data/source/dynamic/reflect::java-defineclass-source
  - id: micro-behaviors/data/source/dynamic/reflect::java-newinstance
