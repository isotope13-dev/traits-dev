defaults:
  for: [class]
  platforms: [unix, windows]
  attack: T1505.003,T1620

composite_rules:
  - id: jvm-encrypted-jsp-reflective-loader
    desc: Encrypted JSP payload reflectively loads bytecode
    crit: hostile
    conf: 0.98
    all:
      - id: objectives/command-and-control/channel/http/message::jvm-encrypted-jsp-equals-channel
      - id: micro-behaviors/process/interpreter/runtime/jvm::java-defineclass-name-constant
      - id: metadata/import/jvm::jvm-classloader-class-reference
      - id: micro-behaviors/metaprogramming/reflection/resolve::jvm-get-declared-method
      - id: micro-behaviors/metaprogramming/reflection/modify/accessibility::set-accessible-reference
      - id: micro-behaviors/metaprogramming/reflection/invoke::java-method-invoke-bytecode
