defaults:
  platforms: [windows, unix]
  for: [php]
  mbc: B0030
traits:
- id: wp-usermeta-admin-capability-insert
  desc: WordPress administrator capability value
  crit: notable
  conf: 0.96
  attack: T1098
  if:
    type: text
    regex: "['\"]administrator['\"]\\s*=>\\s*true"
- id: wp-user-creation-wordpress-email
  desc: WordPress user creation with WordPress.org email
  crit: suspicious
  conf: 0.92
  if:
    type: text
    regex: 'wp_(create|insert)_user.{0,200}@wordpress\.org'
composite_rules:
- id: wp-direct-admin-capability-insert
  desc: Direct WordPress administrator capability insert
  crit: hostile
  conf: 0.99
  attack: T1098
  near_lines: 40
  all:
  - id: wp-usermeta-admin-capability-insert
  - id: metadata/lang/source/naming/account::wp-usermeta-capability-keys
  any:
  - id: wp-user-creation-wordpress-email
  - id: micro-behaviors/os/user/create::wordpress-create-user
  downgrade:
    any:
    - id: well-known/app/publishing/wordpress-plugins/security::wordpress-security-plugin
