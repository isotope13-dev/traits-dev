defaults:
  for: [perl]
  platforms: [unix, windows]
  mbc: B0030
  attack: T1505.003
traits:
  - id: perl-cgi-password-form
    desc: HTML password form in Perl
    crit: suspicious
    conf: 0.86
    if:
      type: text
      regex: '<input[^>\n]{0,80}name="password"[^>\n]{0,80}type="password"'
composite_rules:
  - id: perl-cgi-auth-webshell
    desc: Password-gated Perl webshell
    crit: suspicious
    conf: 0.95
    all:
      - id: perl-cgi-password-form
      - id: micro-behaviors/communications/http/request/cgi::cookie-session
    any:
      - id: objectives/command-and-control/backdoor/webshell/request/command::webshell-cookie-name
      - id: objectives/command-and-control/backdoor/webshell/request/command::execute-frame
