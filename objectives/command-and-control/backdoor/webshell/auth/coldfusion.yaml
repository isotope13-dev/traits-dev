# ColdFusion webshells sometimes protect an administrative page with a
# password embedded in the template. This records the gate without relying on
# the sample's password or endpoint as an indicator.
defaults:
  platforms: [unix, windows]
  for: [cfml]
  attack: T1505.003
  mbc: B0030
traits:
  - id: cfml-hardcoded-password-gate
    desc: ColdFusion shell uses a hardcoded password
    crit: suspicious
    conf: 0.93
    if:
      type: text
      regex: '(?is)<\s*cfset\s+\w*(?:pwd|pass(?:word)?)\w*\s*=\s*["''][^"'']{1,80}["'']\s*>.{0,1200}(?:session\.\w+\s+(?:neq|!=)\s+\w*(?:pwd|pass(?:word)?)\w*|\w*(?:pwd|pass(?:word)?)\w*\s+(?:neq|!=)\s+session\.\w+)'
composite_rules:
  - id: cfml-first-visit-url-callback
    desc: ColdFusion shell sends encrypted URL beacon
    crit: suspicious
    conf: 0.96
    all:
      - id: micro-behaviors/communications/http/post::cfhttp-post-request
      - id: micro-behaviors/communications/http/post::cfml-encrypted-request-url
      - id: micro-behaviors/communications/http/post::cfml-session-initialization-check
