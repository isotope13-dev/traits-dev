defaults:
  platforms: [windows]
  # These indicators describe Classic ASP/VBScript source.  Applying them to
  # arbitrary JavaScript bundles makes ordinary library text look like a
  # webshell (for example Swagger UI's bundled decoder documentation).
  for: [vbs, html, elixir, asp]
  attack: T1505.003
  mbc: B0030

traits:
  - id: asp-hardcoded-userpass
    desc: Hardcodes a Classic ASP login password
    crit: suspicious
    conf: 0.92
    if:
      type: text
      regex: '(?i)\bUserPass\s*=\s*["''][^"'']{1,64}["'']'

composite_rules:
  - id: classic-asp-encoded-password-gate
    desc: Script-encoded ASP uses a hardcoded password
    crit: hostile
    conf: 0.97
    all:
      - id: objectives/command-and-control/backdoor/webshell/request/command::asp-script-encoder-directive
      - id: asp-hardcoded-userpass
  - id: classic-asp-timeout-password-gate
    desc: ASP webshell pairs password with long timeout
    crit: hostile
    conf: 0.96
    all:
      - id: objectives/command-and-control/backdoor/webshell/request/command::asp-script-timeout-large
      - id: asp-hardcoded-userpass
