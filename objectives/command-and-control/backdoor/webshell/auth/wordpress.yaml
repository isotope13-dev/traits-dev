# WordPress persistence modules installed after a browser-side takeover.
# These rules describe the techniques, not the incident's filenames or users.
defaults:
  platforms: [unix, windows]
  for: [php]
  mbc: B0030
  attack: T1505.003

traits:
  - id: wordpress-magic-login-parameter
    desc: WordPress magic-login request parameter
    crit: suspicious
    conf: 0.97
    if:
      type: text
      regex: '(?i)\$_(GET|REQUEST)\s*\[\s*["'']_wplogin["'']\s*\]'

composite_rules:
  # Backdoor REST callbacks often use a custom permission callback rather than
  # the obviously public __return_true form. The request pair plus two literal
  # comparisons distinguishes that gate from an ordinary REST callback.
  - id: wordpress-rest-hardcoded-credential-gate
    desc: WordPress REST uses hardcoded credentials
    crit: suspicious
    conf: 0.97
    all:
      - id: micro-behaviors/communications/http/request/wordpress::register-rest-route
      - id: micro-behaviors/communications/http/request/wordpress::rest-username-param-read
      - id: micro-behaviors/communications/http/request/wordpress::rest-password-param-read
      - id: micro-behaviors/os/security/auth/password::php-user-literal-comparison
      - id: micro-behaviors/os/security/auth/password::php-secret-literal-comparison
    near_bytes: 1600

  - id: wordpress-mu-plugin-persistence-write
    desc: Writes PHP into WP MU-plugin directory
    crit: suspicious
    conf: 0.97
    all:
      - id: micro-behaviors/fs/path/application/webapp::wp-mu-plugin-path
      - id: micro-behaviors/fs/file/write/direct::php-file-put-contents
    near_bytes: 640

  - id: wordpress-mu-plugin-webshell-backdoor
    desc: MU-plugin persistence with PHP webshell
    crit: hostile
    conf: 0.99
    all:
      - id: wordpress-mu-plugin-persistence-write
      - id: objectives/command-and-control/backdoor/webshell/exec::php-command-webshell
    near_bytes: 1600

  - id: wordpress-magic-login-mu-plugin-backdoor
    desc: Magic login with MU-plugin persistence
    crit: hostile
    conf: 0.99
    all:
      - id: wordpress-magic-login-parameter
      - id: micro-behaviors/os/security/auth/session::wordpress-auth-cookie
      - id: wordpress-mu-plugin-persistence-write
    near_bytes: 1600

  - id: wordpress-magic-login-user-hiding-backdoor
    desc: Magic login with hidden administrator accounts
    crit: hostile
    conf: 0.99
    all:
      - id: wordpress-magic-login-parameter
      - id: micro-behaviors/os/security/auth/session::wordpress-auth-cookie
      - id: objectives/command-and-control/backdoor/webshell/hide::wp-user-hiding
    near_bytes: 1600
