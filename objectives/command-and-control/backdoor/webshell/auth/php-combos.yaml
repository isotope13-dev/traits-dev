---
defaults:
  platforms:
  - windows
  - unix
  for:
  - php
  mbc: B0030
  attack: T1505.003
composite_rules:
- id: php-hardcoded-auth
  desc: PHP webshell with hardcoded hash
  crit: suspicious
  conf: 0.95
  any:
  - id: objectives/command-and-control/backdoor/webshell/auth::request-md5-hardcoded-auth
  - id: objectives/command-and-control/backdoor/webshell/auth::request-sha1-hardcoded-auth
  all:
  - id: micro-behaviors/data/string/access::php-substring-call
- id: php-custom-header-decoy-eval-webshell
  desc: PHP token-header eval shell hides behind 404
  crit: hostile
  conf: 0.99
  all:
  - id: micro-behaviors/communications/http/header/custom-trigger::http-x-auth-header
  - id: micro-behaviors/process/interpreter/eval/direct::eval-user-input
  any:
  - id: micro-behaviors/communications/http/response::php-http-response-code-404
  - id: micro-behaviors/communications/http/response::php-header-status-404
  near_bytes: 1024
- id: php-custom-header-eval-webshell
  desc: PHP custom token header gates request-supplied code evaluation
  crit: hostile
  conf: 0.99
  all:
  - id: micro-behaviors/communications/http/header/custom-trigger::http-x-auth-header
  - id: micro-behaviors/process/interpreter/eval/direct::eval-user-input
  near_bytes: 1024
