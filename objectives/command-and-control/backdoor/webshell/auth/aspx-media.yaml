defaults:
  platforms: [windows]
  for: [media]
  attack: T1505.003
  mbc: B0030

composite_rules:
  - id: media-aspnet-hardcoded-cookie-auth-webshell
    desc: Media ASP.NET webshell with hardcoded cookie authentication
    crit: hostile
    conf: 0.99
    all:
      - id: micro-behaviors/data/embedded/payload/media::aspnet-page-directive-in-media
      - id: micro-behaviors/data/embedded/payload/media::aspnet-server-script-in-media
      - id: micro-behaviors/data/embedded/payload/media::aspnet-cookie-auth-compare-in-media
      - id: micro-behaviors/data/embedded/payload/media::aspnet-password-literal-in-media
