# A Plesk planter lists every hosted domain and copies one PHP file into each
# document root. A normal site deploy does not walk `plesk bin domain --list`
# and drop a single script into every httpdocs tree.
defaults:
  platforms: [unix]
  for: [shell]
  attack: T1505.003
  crit: notable
  conf: 0.9

traits:
  - id: plesk-domain-list
    desc: Lists Plesk domains from the CLI
    if:
      type: text
      substr: 'plesk bin domain --list'
  - id: plesk-vhost-httpdocs
    desc: Plesk vhost document root path
    if:
      type: text
      substr: /var/www/vhosts/
  - id: shell-php-path-assignment
    desc: Assigns a PHP script path
    if:
      type: text
      regex: '=\s*["''][^"''\n]{0,80}\.php["'']'

composite_rules:
  - id: plesk-vhost-php-planter
    desc: Copies a PHP file into every vhost
    crit: hostile
    conf: 0.97
    near_lines: 50
    all:
      - id: plesk-domain-list
      - id: plesk-vhost-httpdocs
      - id: shell-php-path-assignment
