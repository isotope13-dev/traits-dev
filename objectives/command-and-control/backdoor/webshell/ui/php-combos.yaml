---
defaults:
  platforms:
  - windows
  - unix
  for:
  - php
  mbc: B0030
  attack: T1505.003
composite_rules:
- id: php-get-command-webshell
  desc: PHP GET command webshell
  crit: hostile
  conf: 0.99
  all:
  - id: objectives/command-and-control/backdoor/webshell/command::exec-user-input-get-text
  - id: objectives/command-and-control/backdoor/webshell/ui::command-input-form
  any:
  - id: objectives/command-and-control/backdoor/webshell/ui::command-output-pre-block
  - id: objectives/command-and-control/backdoor/webshell/ui::execute-submit-label
  - id: micro-behaviors/process/fd/stdio::shell-stderr-redirect
- id: php-web-ui
  desc: Password form fronts a PHP command or eval surface
  crit: suspicious
  conf: 0.85
  all:
  - id: micro-behaviors/ui/controls/credential::php-password-input-element
  any:
  - id: objectives/command-and-control/backdoor/webshell/session/
  - id: objectives/command-and-control/backdoor/webshell/request/eval::php-request-evaluation-cluster
  - id: micro-behaviors/metaprogramming/reflection/resolve::php-multiple-execution-availability-checks
  - id: objectives/command-and-control/backdoor/webshell/request/json-command::raw-json-post-cmd-field
  - id: objectives/command-and-control/backdoor/webshell/ui::command-input-form
  - id: objectives/command-and-control/backdoor/webshell/ui::browser-terminal-fetch-cmd
- id: php-mysql-admin-webshell
  desc: PHP MySQL admin webshell
  crit: suspicious
  conf: 0.97
  all:
  - id: micro-behaviors/data/db/mysql::php-mysql-admin-surface
  - id: micro-behaviors/data/db/mysql::php-mysql-query-console
  - id: micro-behaviors/communications/http/request/superglobal::extract-legacy-http-input
  - id: micro-behaviors/communications/http/cookies::setcookie-call
  any:
  - id: micro-behaviors/ui/controls/credential::php-password-input-element
  - id: micro-behaviors/data/control-flow/error-handling/suppress::error-suppress-prefix
  - id: micro-behaviors/data/db/mysql::php-mysql-dump-export
- id: php-post-command-webshell
  desc: PHP POST command webshell with web interface
  crit: hostile
  conf: 0.99
  all:
  - id: micro-behaviors/communications/http/form::html-form-post-method
  - id: micro-behaviors/ui/controls/input::php-command-named-form-control
  - id: micro-behaviors/communications/http/request/superglobal::post-dup
  - id: micro-behaviors/process/create/shell/variable-command::php-variable-shell-command
  any:
  - id: objectives/command-and-control/backdoor/webshell/ui::execute-submit-label
  - id: micro-behaviors/ui/controls/credential::php-password-input-element
- id: php-authenticated-eval-webshell
  desc: Authenticated PHP eval backdoor with login interface
  crit: hostile
  conf: 0.99
  scope: file
  all:
  - id: micro-behaviors/ui/controls/credential::php-password-input-element
  - id: objectives/execution/interpreter/eval/remote::eval-user-input
  any:
  - id: micro-behaviors/communications/http/cookies::setcookie-call
  - id: micro-behaviors/communications/http/form::html-form-post-method
  - id: micro-behaviors/communications/http/request/superglobal::session
