# Request-gated server-side shells can use a private HTTP header as a command
# selector.  The observed Windchill campaign used X-windchill-req; keep the
# exact header as an atomic artifact and pair it with a process sink, in-memory
# class load, or application-API credential/vault abuse before the hostile
# inference.  JSP page directives are common carriers but not required — the
# same header gating appears in compiled servlets.
defaults:
  platforms: [unix, windows]
  for: [java, kotlin, groovy, scala, html, javascript, python, vbs]
  attack: T1505.003
  mbc: B0030

composite_rules:
  - id: windchill-jsp-header-command-webshell
    desc: JSP shell gated by Windchill command header
    crit: hostile
    conf: 0.99
    all:
      - id: metadata/lang/scripted::jsp-server-page
      - id: micro-behaviors/communications/http/header/custom::windchill-command-header
    any:
      - id: micro-behaviors/process/create/spawn::java-runtime-exec-source
      - id: micro-behaviors/process/create/exec::java-runtime-variable-exec-source
      - id: micro-behaviors/process/create/spawn::java-runtime-exec
    unless:
      - id: metadata/package/testing/presence/harness::test-fixture-directory

  # Same header without requiring a page directive: compiled servlet implants
  # still read X-windchill-req and either exec, load bytecode, or abuse the
  # application keystore/vault APIs.
  - id: windchill-header-command-backdoor
    desc: Windchill command-header gated server backdoor
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/communications/http/header/custom::windchill-command-header
    any:
      - id: micro-behaviors/process/create/spawn::java-runtime-exec-source
      - id: micro-behaviors/process/create/exec::java-runtime-variable-exec-source
      - id: micro-behaviors/process/create/spawn::java-runtime-exec
      - id: micro-behaviors/data/source/dynamic/reflect::java-defineclass-any
      - id: objectives/credential-access/theft/app::plm-keystore-credential-harvest
      - id: objectives/command-and-control/backdoor/webshell/recon::app-vault-file-list-enum
      - id: objectives/command-and-control/backdoor/webshell/recon::windchill-vault-schema-file-list
    needs: 1
    unless:
      - id: metadata/package/testing/presence/harness::test-fixture-directory
