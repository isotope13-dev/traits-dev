# The operator side of a CGI shell: a Perl prompt loop that substitutes each
# typed command into a request marker, writes it as a raw POST over an
# IO::Socket::INET connection, and can route that request through an HTTP
# proxy (Proxy-Connection header).  The proxy path is what lets the operator
# reach the server-side shell through a third party's logs.
defaults:
  platforms: [unix, windows]
  for: [perl]
  attack: T1090.001,T1059

traits:
  - id: perl-proxy-connection-header
    desc: Perl writes a Proxy-Connection header
    crit: notable
    conf: 0.85
    if:
      type: text
      substr: 'Proxy-Connection:'

composite_rules:
  - id: perl-cgi-shell-client-via-proxy
    desc: Perl CGI shell client posting commands via proxy
    crit: hostile
    conf: 0.93
    near_lines: 60
    all:
      - id: objectives/command-and-control/remote-command/client::perl-subst-command-var
      - id: micro-behaviors/communications/socket/connect::perl-io-socket-inet-client
      - id: perl-proxy-connection-header
    unless:
      - id: metadata/package/testing/presence/harness::perl-test-file
