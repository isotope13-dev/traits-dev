# A quoted dynamic command field is weak on its own. Require a code-side
# command-execution echo probe and OS query, plus an actual HTTP transport.
# No controller, password, JSP filename or application-specific gate is used.
defaults:
  platforms: [unix, windows]
  for: [python]
  attack: T1505.003
composite_rules:
  - id: quoted-query-shell-command-client
    desc: HTTP command client probes shell execution
    crit: suspicious
    conf: 0.9
    all:
      - id: micro-behaviors/communications/http/query::quoted-command-field-template
      - id: micro-behaviors/os/sysinfo/platform/kernel::uname-system-machine-command-literal
      - id: micro-behaviors/process/create/shell/command-string::interpolated-echo-execution-probe
      - id: micro-behaviors/communications/http/client/exchange::urllib-urlopen-call
