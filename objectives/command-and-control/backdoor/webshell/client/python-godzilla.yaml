# Python generators that emit Godzilla-compatible PHP webshells.
# Family label strings (PhpDynamicPayload, connection banners) live under
# well-known/malware/webshell/godzilla; this file covers the builder mechanics
# objectives may own (stager encoding, key derivation comments, emitted PHP).
defaults:
  platforms: [windows, unix]
  for: [python]
  attack: T1505.003
  mbc: B0030

traits:
  - id: godzilla-compatible-stager-fn
    desc: Godzilla-compatible stager builder function
    crit: suspicious
    conf: 0.97
    if:
      type: text
      regex: (?i)godzilla[_ -]?compatible[_ -]?stager|build_godzilla

  - id: godzilla-secret-key-x-derivation
    desc: Derives Godzilla getSecretKeyX AES key material
    crit: suspicious
    conf: 0.95
    if:
      type: text
      substr: getSecretKeyX

  - id: godzilla-getbasicsinfo-handshake
    desc: Godzilla getBasicsInfo payload handshake marker
    crit: notable
    conf: 0.93
    if:
      type: text
      substr: getBasicsInfo

  - id: php-aes-gzinflate-cookie-stager
    desc: Embedded PHP AES+gzinflate cookie stager decode
    crit: suspicious
    conf: 0.96
    if:
      type: text
      regex: gzinflate\s*\(\s*@?openssl_decrypt[\s\S]{0,120}AES-128-ECB

  # `$$name` followed by an eval call is PHP variable-variable dispatch only
  # inside PHP. Julia -- which cleave types as Python -- writes `$$x` for
  # nested quoting and `eval(` for its own evaluator, so the fragment alone
  # matches the language's own test suite (julia/test/show.jl). The emitted
  # PHP always carries an open tag; require it.
  - id: php-variable-variable-eval-fragment
    desc: PHP variable-variable near eval call
    crit: component
    conf: 0.94
    if:
      type: text
      regex: '\$\$[A-Za-z_][A-Za-z0-9_]*[\s\S]{0,80}@?eval\s*\('

composite_rules:
  - id: php-variable-variable-eval-stager
    desc: Embedded PHP variable-variable eval stager
    crit: suspicious
    conf: 0.94
    all:
      - id: php-variable-variable-eval-fragment
      - id: objectives/command-and-control/backdoor/webshell/embedded::php-open-tag-literal

  - id: python-godzilla-webshell-generator
    desc: Python Godzilla-compatible PHP shell generator
    crit: hostile
    conf: 0.99
    all:
      - id: objectives/command-and-control/backdoor/webshell/embedded::php-webshell-builder
      - id: godzilla-compatible-stager-fn
    any:
      - id: godzilla-secret-key-x-derivation
      - id: godzilla-getbasicsinfo-handshake
      - id: php-aes-gzinflate-cookie-stager

  - id: python-godzilla-aes-session-stager
    desc: Python emits Godzilla AES session PHP stager
    crit: hostile
    conf: 0.98
    all:
      - id: php-aes-gzinflate-cookie-stager
      - id: godzilla-getbasicsinfo-handshake
      - id: micro-behaviors/crypto/symmetric/aes/library::pycrypto-aes-import
    any:
      - id: php-variable-variable-eval-stager
      - id: godzilla-compatible-stager-fn
      - id: objectives/command-and-control/backdoor/webshell/embedded::php-webshell-builder
