defaults:
  for: [ruby]
  platforms: [unix, windows]
traits:
  - id: ruby-cookie-encoded-command-construction
    desc: Cookie protocol carries encoded command payload
    crit: suspicious
    conf: 0.99
    if:
      type: tree-sitter
      query: |
        ((assignment right: (binary left: (binary
          left: (string (string_content) @cm)
          right: (call receiver: (scope_resolution) @rex method: (identifier) @encode
            arguments: (argument_list (call receiver: (identifier) @payload method: (identifier) @encoded))))
          right: (string) @rest))
          (#eq? @cm "cm=") (#eq? @rex "Rex::Text") (#eq? @encode "encode_base64")
          (#eq? @payload "payload") (#eq? @encoded "encoded")
          (#match? @rest "; cn=.*; cp="))
composite_rules:
  - id: ruby-cookie-command-shell-client
    desc: Exploit client sends encoded cookie commands
    crit: hostile
    conf: 0.99
    all:
      - id: ruby-cookie-encoded-command-construction
      - id: well-known/tool/offensive/metasploit::remote-exploit-class-declaration
      - id: micro-behaviors/communications/http/client/exchange::rex-http-request-call
