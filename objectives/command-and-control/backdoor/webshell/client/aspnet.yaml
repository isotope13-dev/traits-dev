# ASP.NET webshell clients submit an evaluator snippet that writes a second
# request-controlled ASPX page to the server's application directory.
defaults:
  platforms: [windows]
  for: [asp]
  attack: T1505.003
  mbc: B0030

traits:
  - id: aspnet-client-posts-to-page-endpoint
    desc: Form posts to an ASP.NET endpoint
    crit: notable
    conf: 0.95
    if:
      type: text
      exclude_html_comments: true
      regex: '(?i)\baction\s*=\s*["'']?https?://[^"''\s>]{1,120}\.aspx\b'
  - id: aspnet-client-accepts-code-input
    desc: Form exposes an editable code field
    crit: notable
    conf: 0.9
    if:
      type: text
      exclude_html_comments: true
      regex: '(?i)<textarea\b[^>]{0,100}\bname\s*=\s*["'']?[a-z][\w-]{0,20}'
  - id: aspnet-client-uses-streamwriter
    desc: Uses .NET StreamWriter
    crit: notable
    conf: 0.95
    if:
      type: text
      exclude_html_comments: true
      regex: '(?i)new\s+(System\s*\.\s*IO\s*\.\s*)?StreamWriter\s*\('
  - id: aspnet-client-maps-aspx-page-path
    desc: Maps a server-side ASPX path
    crit: notable
    conf: 0.97
    if:
      type: text
      exclude_html_comments: true
      regex: '(?is)Server\s*\.\s*MapPath\s*\(\s*["''][^"'']{1,80}\.aspx["'']'
  - id: aspnet-client-writes-request-content
    desc: ASPX page writer uses request content
    crit: notable
    conf: 0.97
    if:
      type: text
      exclude_html_comments: true
      regex: '(?is)\.Write\s*\(\s*Request\s*\.\s*Item\s*\[\s*["''][^"'']{1,32}["'']\s*\]'

composite_rules:
  - id: aspnet-webshell-deployment-client
    desc: ASP.NET client deploys a request-controlled page
    crit: hostile
    conf: 0.98
    all:
      - id: aspnet-client-posts-to-page-endpoint
      - id: aspnet-client-accepts-code-input
      - id: aspnet-client-uses-streamwriter
      - id: aspnet-client-maps-aspx-page-path
      - id: aspnet-client-writes-request-content
    near_bytes: 600
