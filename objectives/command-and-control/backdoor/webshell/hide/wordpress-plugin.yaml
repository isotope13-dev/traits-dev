# A plugin that deletes itself from the WordPress installed-plugin list and, in
# the same file, runs whatever the request hands it. Either half alone has a
# benign reading — white-label agency plugins hide themselves from clients, and
# a maintenance plugin may shell out — but a concealed plugin carrying a request
# sink is a backdoor with no other reading, which is why this pairs them rather
# than raising either leg on its own.
defaults:
  platforms: [unix, windows]
  for: [php]
  mbc: B0030
  attack: T1505.003,T1564

composite_rules:
  - id: wp-hidden-plugin-request-backdoor
    desc: Self-hiding WordPress plugin runs request input
    crit: hostile
    conf: 0.98
    all:
      - id: objectives/evasion/file-hiding/plugin::wordpress-plugin-admin-list-removal
    any:
      - id: micro-behaviors/process/create/shell/lang::exec-user-input
      - id: objectives/execution/interpreter/eval/remote::eval-user-input
      - id: micro-behaviors/process/interpreter/reflection/dispatch::dynamic-function-execution
      - id: objectives/command-and-control/backdoor/webshell/exec::php-request-shell-execution
