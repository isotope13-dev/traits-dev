defaults:
  platforms:
  - windows
  - unix
  for:
  - scripts
  - html
  mbc: B0030
  attack: T1505.003
traits:
- id: drf-response-call
  desc: Django REST Framework Response call
  crit: component
  conf: 0.85
  for:
  - python
  if:
    type: text
    regex: 'from\s+rest_framework\.response\s+import\s+Response'
- id: drf-forbidden-status
  desc: Django REST Framework 403 status
  crit: component
  conf: 0.85
  for:
  - python
  if:
    type: text
    regex: 'status\s*=\s*(status|drf_status)\.HTTP_403_FORBIDDEN|status\s*=\s*403'
composite_rules:
- id: drf-authorization-response-marker
  desc: Django REST Framework authorization response
  crit: notable
  conf: 0.9
  all:
  - id: drf-response-call
  - id: drf-forbidden-status
- id: command-webshell-access-denied-response
  desc: Command webshell emits access denial
  crit: suspicious
  conf: 0.8
  for:
  - php
  - csharp
  - java
  - markdown
  all:
  - id: micro-behaviors/communications/http/response::http-access-denied-page-text
  - id: micro-behaviors/communications/http/response::http-authorization-denied-status-text
  any:
  - id: objectives/command-and-control/backdoor/webshell/exec
  not:
  - substr: 'xn--3bst00mcompare'
  - substr: 'new Uint32Array(Tt)'
  - regex: 'xn--[a-z0-9-]{3,}[\s\S]{0,1200}Uint32Array'
  - regex: 'You do not have permission to (edit|delete|restore|manage) this cipher'
  unless:
  - id: micro-behaviors/process/interpreter/vm/
  - id: well-known/app/productivity/stirling-pdf/
  - id: metadata/file/magic/identity::php-archive
  - id: metadata/library/web-frameworks::wordpress-plugin-dir-constants
  # An HTTP client library's test suite stubs a 403/401 page to exercise its
  # error mapping (chargebee's native_request_spec); it consumes the denied
  # response, it does not serve one.
  - id: metadata/package/testing/presence/harness::test-directory-path
  - id: well-known/tool/detection/sast/
  # Group FastAPI + DRF authz markers into one exception (counts as 1).
  - id: framework-authorization-response
  # Grav API ForbiddenException is a typed 403, not a webshell deny page.
  - id: well-known/app/publishing/grav/
  - id: well-known/app/infrastructure/prefect::official-source-context
  near_bytes: 640
- id: fastapi-authorization-check-marker
  desc: Recognized FastAPI authorization-check context
  crit: exception
  conf: 0.92
  all:
  - id: micro-behaviors/communications/http/server/framework::fastapi-http-exception-marker
  any:
  - id: micro-behaviors/communications/http/server/auth::fastapi-caller-permission-identifier
  - id: micro-behaviors/communications/http/server/auth::fastapi-allowed-routes-identifier
  - id: micro-behaviors/communications/http/server/auth::fastapi-team-model-access-identifier
  - id: micro-behaviors/communications/http/server/authz::permission-guard-reference
- id: framework-authorization-response
  desc: Recognized web-framework authorization response context
  crit: exception
  conf: 0.92
  any:
  - id: fastapi-authorization-check-marker
  - id: drf-authorization-response-marker
