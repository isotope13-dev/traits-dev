  count_max: 1016584
composite_rules:
- id: sensitive-path-panel
  desc: Sensitive server path panel
  crit: suspicious
  conf: 0.9
  attack: T1083
  any:
  - id: sensitive-path-panel--rx-6
  - id: sensitive-path-panel--rx-6--alt-2
  - id: sensitive-path-panel--rx-6--alt-3
  - id: sensitive-path-panel--rx-7
  - id: sensitive-path-panel--rx-7--alt-2
  - id: sensitive-path-panel--rx-8
  - id: sensitive-path-panel--rx-9
  unless:
  - id: metadata/package/quality/benign-context::phpstan-phar-path
  - id: well-known/app/publishing/wordpress-plugins::wordpress-w3-ftp-configuration-context
  - id: metadata/lang/source::yara-rule-source
  - id: well-known/tool/detection/security-scanner::anteumbra-package-tree-member
  - id: metadata/package/testing/presence/fixture::php-security-test-context
  - id: metadata/package/testing/presence/fixture::php-security-regression-test-context
- id: recon-command-panel
  desc: Server recon command panel
  crit: suspicious
  conf: 0.88
  attack: T1082
  any:
  - id: recon-command-panel--rx-10
  - id: recon-command-panel--rx-10--alt-2
  - id: recon-command-panel--rx-11
  - id: recon-command-panel--rx-11--alt-2
  - id: recon-command-panel--rx-12
  - id: recon-command-panel--rx-12--alt-2
  - id: recon-command-panel--rx-13
  - id: recon-command-panel--rx-13--alt-2
  - id: recon-command-panel--rx-14
  - id: recon-command-panel--rx-14--alt-2
  unless:
  - id: metadata/package/quality/benign-context::phpstan-phar-path
  - id: metadata/lang/source::yara-rule-source
  - id: well-known/tool/detection/security-scanner::anteumbra-package-tree-member
  - id: metadata/package/testing/presence/fixture::php-security-test-context
  - id: metadata/package/testing/presence/fixture::php-security-regression-test-context
