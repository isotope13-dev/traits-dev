---
defaults:
  platforms:
  - windows
  - unix
  for:
  - php
  mbc: B0030
  attack: T1505.003
traits:
- id: sensitive-path-panel--rx-6
  desc: "Matches '(/etc/passwd|\\.ssh/author...'"
  crit: notable
  conf: 0.9
  count_min: 2
  if:
    type: text
    substr: '(/etc/passwd|\.ssh/authorized_keys)'
- id: sensitive-path-panel--rx-6--alt-2
  desc: "Matches '(/etc/shadow|\\.ssh/author...'"
  crit: notable
  conf: 0.9
  count_min: 2
  if:
    type: text
    substr: '(/etc/shadow|\.ssh/authorized_keys)'
- id: sensitive-path-panel--rx-6--alt-3
  desc: "Matches '(/etc/resolv\\.conf|\\.ssh/...'"
  crit: notable
  conf: 0.9
  count_min: 2
  if:
    type: text
    substr: '(/etc/resolv\.conf|\.ssh/authorized_keys)'
- id: sensitive-path-panel--rx-7
  desc: 'Matches ''id_rsa'''
  crit: notable
  conf: 0.9
  count_min: 2
  if:
    type: text
    substr: 'id_rsa'
- id: sensitive-path-panel--rx-7--alt-2
  desc: "Matches '\\.bash_history'"
  crit: notable
  conf: 0.9
  count_min: 2
  if:
    type: text
    substr: '\.bash_history'
- id: sensitive-path-panel--rx-8
  desc: "Matches '\\.mysql_history'"
  crit: notable
  conf: 0.9
  count_min: 2
  if:
    type: text
    substr: '\.mysql_history'
- id: sensitive-path-panel--rx-9
  desc: Regex component marker
  crit: component
  conf: 0.9
  count_min: 2
  if:
    type: text
    regex: "(/var/log/lastlog)"
- id: recon-command-panel--rx-10
  desc: Regex component marker
  crit: component
  conf: 0.88
  count_min: 3
  if:
    type: text
    substr: 'whoami'
- id: recon-command-panel--rx-10--alt-2
  desc: 'Matches ''uname -a'''
  crit: notable
  conf: 0.88
  count_min: 3
  if:
    type: text
    substr: 'uname -a'
- id: recon-command-panel--rx-11
  desc: 'Matches ''ipconfig'''
  crit: notable
  conf: 0.88
  count_min: 3
  if:
    type: text
    substr: 'ipconfig'
- id: recon-command-panel--rx-11--alt-2
  desc: 'Matches ''netstat -an'''
  crit: notable
  conf: 0.88
  count_min: 3
  if:
    type: text
    substr: 'netstat -an'
- id: recon-command-panel--rx-12
  desc: 'Matches ''ps -aux'''
  crit: notable
  conf: 0.88
  count_min: 3
  if:
    type: text
    substr: 'ps -aux'
- id: recon-command-panel--rx-12--alt-2
  desc: 'Matches ''ls -la'''
  crit: notable
  conf: 0.88
  count_min: 3
  if:
    type: text
    substr: 'ls -la'
- id: recon-command-panel--rx-13
  desc: "Matches 'find \\. -type f'"
  crit: notable
  conf: 0.88
  count_min: 3
  if:
    type: text
    substr: 'find \. -type f'
- id: recon-command-panel--rx-13--alt-2
  desc: "Matches 'cmd\\.exe'"
  crit: notable
  conf: 0.88
  count_min: 3
  if:
    type: text
    substr: 'cmd\.exe'
- id: recon-command-panel--rx-14
  desc: "Matches 'powershell\\.exe'"
  crit: notable
  conf: 0.88
  count_min: 3
  if:
    type: text
    substr: 'powershell\.exe'
- id: recon-command-panel--rx-14--alt-2
  desc: Regex component marker
  crit: component
  conf: 0.88
  count_min: 3
  if:
    type: text
    substr: 'nc -l'
composite_rules:
- id: sensitive-path-panel
  desc: Sensitive server path panel
  crit: suspicious
  conf: 0.9
  attack: T1083
  any:
  - id: sensitive-path-panel--rx-6
  - id: sensitive-path-panel--rx-6--alt-2
  - id: sensitive-path-panel--rx-6--alt-3
  - id: sensitive-path-panel--rx-7
  - id: sensitive-path-panel--rx-7--alt-2
  - id: sensitive-path-panel--rx-8
  - id: sensitive-path-panel--rx-9
  unless:
  - id: well-known/lib/development/phpstan::phpstan-phar-path
  - id: well-known/app/publishing/wordpress-plugins/performance::wordpress-w3-ftp-configuration-context
  - id: metadata/lang/source::yara-rule-source
  - id: well-known/tool/detection/security-scanner::anteumbra-package-tree-member
  - id: metadata/package/testing/presence/fixture::php-security-test-context
  - id: metadata/package/testing/presence/fixture::php-security-regression-test-context
- id: recon-command-panel
  desc: Server recon command panel
  crit: suspicious
  conf: 0.88
  attack: T1082
  any:
  - id: recon-command-panel--rx-10
  - id: recon-command-panel--rx-10--alt-2
  - id: recon-command-panel--rx-11
  - id: recon-command-panel--rx-11--alt-2
  - id: recon-command-panel--rx-12
  - id: recon-command-panel--rx-12--alt-2
  - id: recon-command-panel--rx-13
  - id: recon-command-panel--rx-13--alt-2
  - id: recon-command-panel--rx-14
  - id: recon-command-panel--rx-14--alt-2
  unless:
  - id: well-known/lib/development/phpstan::phpstan-phar-path
  - id: metadata/lang/source::yara-rule-source
  - id: well-known/tool/detection/security-scanner::anteumbra-package-tree-member
  - id: metadata/package/testing/presence/fixture::php-security-test-context
  - id: metadata/package/testing/presence/fixture::php-security-regression-test-context
