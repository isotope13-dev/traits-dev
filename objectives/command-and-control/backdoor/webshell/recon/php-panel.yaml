---
defaults:
  platforms:
  - windows
  - unix
  for:
  - php
  mbc: B0030
  attack: T1505.003
traits:
- id: sensitive-path-panel--rx-6
  desc: Regex component marker
  crit: component
  conf: 0.9
  count_min: 2
  if:
    type: text
    substr: '(/etc/passwd|\.ssh/authorized_keys)'
  count_max: 1016576
- id: sensitive-path-panel--rx-6--alt-2
  desc: Regex component marker
  crit: component
  conf: 0.9
  count_min: 2
  if:
    type: text
    substr: '(/etc/shadow|\.ssh/authorized_keys)'
  count_max: 1016576
- id: sensitive-path-panel--rx-6--alt-3
  desc: Regex component marker
  crit: component
  conf: 0.9
  count_min: 2
  if:
    type: text
    substr: '(/etc/resolv\.conf|\.ssh/authorized_keys)'
  count_max: 1016576
- id: sensitive-path-panel--rx-7
  desc: Regex component marker
  crit: component
  conf: 0.9
  count_min: 2
  if:
    type: text
    substr: 'id_rsa'
  count_max: 1016577
- id: sensitive-path-panel--rx-7--alt-2
  desc: Regex component marker
