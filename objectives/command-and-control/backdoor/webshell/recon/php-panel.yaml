- id: recon-command-panel--rx-12
  desc: Regex component marker
  crit: component
  conf: 0.88
  count_min: 3
  if:
    type: text
    substr: 'ps -aux'
  count_max: 1016582
- id: recon-command-panel--rx-12--alt-2
  desc: Regex component marker
  crit: component
  conf: 0.88
  count_min: 3
  if:
    type: text
    substr: 'ls -la'
