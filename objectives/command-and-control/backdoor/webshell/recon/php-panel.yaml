---
defaults:
  platforms:
  - windows
  - unix
  for:
  - php
  mbc: B0030
  attack: T1505.003
traits:
- id: sensitive-path-panel--rx-6--alt-2
  desc: "Matches '/etc/shadow'"
  crit: notable
  conf: 0.9
  if:
    type: text
    regex: '(file://)?/etc/shadow'
  not:
    - regex: 'file://'
- id: sensitive-path-panel--rx-7
  desc: "Matches '.ssh/id_rsa'"
  crit: notable
  conf: 0.9
  if:
    type: text
    regex: '\.ssh/id_rsa\b'
- id: sensitive-path-panel--rx-8
  desc: "Matches '.mysql_history'"
  crit: notable
  conf: 0.9
  if:
    type: text
    substr: '.mysql_history'
- id: sensitive-path-panel--rx-9
  desc: "Matches '/var/log/lastlog'"
  crit: notable
  conf: 0.9
  if:
    type: text
    substr: '/var/log/lastlog'
- id: recon-command-panel--rx-10
  desc: Matches whoami command token
  crit: component
  conf: 0.88
  count_min: 3
  if:
    type: text
    # Identifier and CSS fragments (get_whoami, pc-whoami) are not the command.
    # A following parenthesis is a method call (LDAP Connection::whoami()),
    # not the shell command token.
    regex: '[^A-Za-z0-9_-]whoami[^A-Za-z0-9_(]'
- id: recon-command-panel--rx-10--alt-2
  desc: 'Matches ''uname -a'''
  crit: notable
  conf: 0.88
  count_min: 3
  if:
    type: text
    substr: 'uname -a'
- id: recon-command-panel--rx-11
  desc: 'Matches ''ipconfig'''
  crit: notable
  conf: 0.88
  count_min: 3
  if:
    type: text
    substr: 'ipconfig'
- id: recon-command-panel--rx-11--alt-2
  desc: 'Matches ''netstat -an'''
  crit: notable
  conf: 0.88
  count_min: 3
  if:
    type: text
    substr: 'netstat -an'
- id: recon-command-panel--rx-12
  desc: 'Matches ''ps -aux'''
  crit: notable
  conf: 0.88
  count_min: 3
  if:
    type: text
    substr: 'ps -aux'
- id: recon-command-panel--rx-12--alt-2
  desc: 'Matches ''ls -la'''
  crit: notable
  conf: 0.88
  count_min: 3
  if:
    type: text
    substr: 'ls -la'
- id: recon-command-panel--rx-13
  desc: "Matches 'find \\. -type f'"
  crit: notable
  conf: 0.88
  count_min: 3
  if:
    type: text
    substr: 'find \. -type f'
- id: recon-command-panel--rx-13--alt-2
  desc: "Matches 'cmd\\.exe'"
  crit: notable
  conf: 0.88
  count_min: 3
  if:
    type: text
    substr: 'cmd\.exe'
- id: recon-command-panel--rx-14
  desc: "Matches 'powershell\\.exe'"
  crit: notable
  conf: 0.88
  count_min: 3
  if:
    type: text
    substr: 'powershell\.exe'
- id: recon-command-panel--rx-14--alt-2
  desc: Regex component marker
  crit: component
  conf: 0.88
  count_min: 3
  if:
    type: text
    substr: 'nc -l'
composite_rules:
# A PHP file is a security test either by its own declarations or by regression
# language; both forms quiet the panel rule the same way.
- id: php-security-test-either-context
  desc: PHP security test or regression context
  crit: exception
  conf: 0.98
  any:
  - id: metadata/package/testing/presence/fixture::php-security-test-context
  - id: metadata/package/testing/presence/fixture::php-security-regression-test-context
- id: wordpress-plugin-security-firewall-context
  desc: WordPress security plugin firewall and signature context
  crit: exception
  conf: 0.98
  any:
  - id: well-known/app/publishing/wordpress-plugins/security::centershield-decoded-signature-literal
  - id: well-known/app/publishing/wordpress-plugins/security::locktura-firewall-signature-context
  - id: well-known/app/publishing/wordpress-plugins/performance::wordpress-w3-ftp-configuration-context
- id: sensitive-path-panel
  desc: Sensitive server path panel
  crit: suspicious
  conf: 0.9
  attack: T1083
  any:
  - id: micro-behaviors/fs/path/credential::php-account-or-ssh-public-key-path
  - id: sensitive-path-panel--rx-6--alt-2
  - id: micro-behaviors/fs/path/config/system::config-resolv
  - id: sensitive-path-panel--rx-7
  - id: micro-behaviors/fs/path/personal::bash-history-artifact
  - id: sensitive-path-panel--rx-8
  - id: sensitive-path-panel--rx-9
  needs: 2
  unless:
  - id: well-known/lib/development/phpstan::phpstan-phar-path
  - id: wordpress-plugin-security-firewall-context
  - id: "metadata/lang/source/syntax/"
  - id: well-known/tool/detection/security-scanner::anteumbra-package-tree-member
  - id: php-security-test-either-context
  - id: metadata/package/documentation/agent-safety::scoped-security-test-documentation
  - id: well-known/app/system/anthropic-cybersecurity-skills/
  - id: well-known/lib/cloud/aws-sdk-php::aws-sdk-php-generated-model
  # Injection-vector and WAF bait-path lists name these paths as entries.
  - id: metadata/file/format/wordlist::security-probe-string-list
- id: recon-command-panel
  desc: Server recon command panel
  crit: suspicious
  conf: 0.88
  attack: T1082
  any:
  - id: recon-command-panel--rx-10
  - id: recon-command-panel--rx-10--alt-2
  - id: recon-command-panel--rx-11
  - id: recon-command-panel--rx-11--alt-2
  - id: recon-command-panel--rx-12
  - id: recon-command-panel--rx-12--alt-2
  - id: recon-command-panel--rx-13
  - id: recon-command-panel--rx-13--alt-2
  - id: recon-command-panel--rx-14
  - id: recon-command-panel--rx-14--alt-2
  unless:
  - id: metadata/package/documentation/security-testing::authorized-fenced-testing-skill
  - id: well-known/lib/development/phpstan::phpstan-phar-path
  - id: "metadata/lang/source/syntax/"
  - id: well-known/tool/detection/security-scanner::anteumbra-package-tree-member
  - id: php-security-test-either-context
  - id: well-known/app/system/anthropic-cybersecurity-skills/
  - id: wordpress-plugin-security-firewall-context
