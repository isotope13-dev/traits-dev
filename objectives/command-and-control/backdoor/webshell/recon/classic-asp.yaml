# A Classic ASP page that rebuilds Scripting.FileSystemObject from quoted
# pieces, then creates and deletes a file while walking a request path, is
# looking for a writable drop location. Naming several security products and
# raising the script timeout is the same probe run across those install trees.
defaults:
  platforms: [windows]
  for: [vbs]
  attack: T1505.003,T1083
  mbc: B0030

composite_rules:
  - id: asp-split-progid-writable-path-probe
    desc: Split ProgID ASP page probes writable paths
    crit: hostile
    conf: 0.96
    all:
      - id: objectives/anti-static/obfuscation/wsh::filesystemobject-ampersand-split-progid
      - id: micro-behaviors/os/com/automation::vbs-computed-createobject
      - id: micro-behaviors/fs/write/content::create-text-file-method-name
      - id: micro-behaviors/fs/delete/file/library::wsh-deletefile-call
      - id: micro-behaviors/fs/directory/readdir::wsh-for-each-files
      - id: micro-behaviors/communications/http/request/superglobal::classic-asp-bare-request-field

  - id: asp-security-product-write-sweep
    desc: Long-running ASP write probe names security products
    crit: hostile
    conf: 0.95
    all:
      - id: asp-split-progid-writable-path-probe
      - id: micro-behaviors/process/resources/limits::asp-script-timeout-large
      - id: micro-behaviors/os/security/product::edr-product-name
