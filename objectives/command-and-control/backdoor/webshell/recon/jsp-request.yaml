# JSP pages that let a request query application databases or sweep hosts
# from the server: reconnaissance through a deployed webshell.
#
# JSP has its own file type. The other carrier types remain for JSP fragments
# that are embedded in files classified from their surrounding content.
defaults:
  platforms:
  - windows
  - unix
  for:
  - jsp
  - java
  - class
  - html
  - javascript
  - python
  - vbs
  mbc: B0030
  attack: T1505.003
traits:
- id: jsp-oracle-all-table-dump-source
  desc: JSP enumerates tables and exports SQL rows
  crit: notable
  conf: 0.96
  for: [jsp]
  if:
    type: text
    substr: user_tab_comments
- id: jsp-oracle-user-info-exposure-source
  desc: JSP queries Oracle user_info and returns rows
  crit: notable
  conf: 0.94
  for: [jsp]
  if:
    type: text
    substr: from user_info
- id: jsp-oracle-table-enumeration-source
  desc: JSP enumerates Oracle tables for export
  crit: notable
  conf: 0.94
  for: [jsp]
  if:
    type: text
    substr: all_tables
- id: jsp-request-ip-sweep-source
  desc: JSP scans a selected address range
  crit: notable
  conf: 0.94
  for: [jsp]
  if:
    type: hex
    pattern: "69 20 3C 3D 20 32 35 36"
composite_rules:
- id: jsp-oracle-user-database-exposure
  for: [jsp]
  desc: JSP connects to Oracle and returns user table records to the requester
  crit: hostile
  conf: 0.98
  all:
  - id: micro-behaviors/data/db/access::oracle-jdbc-url-reference
  - id: jsp-oracle-user-info-exposure-source
  - id: micro-behaviors/data/db/query::jsp-resultset-string-read
  - id: micro-behaviors/data/db/sql::execute-sql-variable
- id: jsp-oracle-database-dump
  for: [jsp]
  desc: JSP dumps Oracle database table contents to local files
  crit: hostile
  conf: 0.99
  all:
  - id: micro-behaviors/data/db/access::oracle-jdbc-url-reference
  - id: jsp-oracle-all-table-dump-source
  - id: micro-behaviors/data/db/write/row::jsp-insert-statement-text
  - id: micro-behaviors/fs/write/file/handle::java-fileoutputstream-source
- id: jsp-oracle-requested-table-dump
  for: [jsp]
  desc: JSP exports request-selected Oracle table data into web-accessible files
  crit: hostile
  conf: 0.99
  all:
  - id: micro-behaviors/data/db/access::oracle-jdbc-url-reference
  - id: jsp-oracle-table-enumeration-source
  - id: micro-behaviors/communications/http/request/params::java-servlet-get-parameter
  - id: micro-behaviors/data/db/sql::execute-sql-variable
  - id: micro-behaviors/fs/write/file/handle::java-fileoutputstream-source
- id: jsp-request-network-sweep
  for: [jsp]
  desc: JSP performs request-controlled HTTP reconnaissance across a host range
  crit: suspicious
  conf: 0.97
  all:
  - id: micro-behaviors/communications/http/request/params::java-servlet-get-parameter
  - id: jsp-request-ip-sweep-source
  - id: micro-behaviors/communications/http/client/library::java-http-url-connection
