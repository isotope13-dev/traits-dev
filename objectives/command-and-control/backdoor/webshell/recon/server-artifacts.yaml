# Campaign-specific filesystem artifact from the linked Windchill advisory.
# This is a path marker, not prose: the advisory says flst.txt is created by
# the attacker's file-listing step.  It is intentionally useful across server
# languages because a later shell need not remain JSP.
defaults:
  platforms: [unix, windows]
  # Keep this composite on the carriers for which the rule has explicit
  # process-sink evidence; broadening it would lower hostile precision.
  for: [java, php]
  attack: T1083
  mbc: E1083

traits:
  - id: attacker-file-list-manifest
    desc: Attacker file-listing manifest path
    crit: suspicious
    conf: 0.98
    if:
      type: literal
      kind: string
      substr: flst.txt

composite_rules:
  - id: file-list-manifest-command-webshell
    desc: Server-side command shell writes file-list manifest
    crit: hostile
    conf: 0.99
    all:
      - id: attacker-file-list-manifest
    any:
      - id: micro-behaviors/process/create/spawn::java-runtime-exec-source
      - id: micro-behaviors/process/create/exec::java-runtime-variable-exec-source
      - id: micro-behaviors/process/create/spawn::java-runtime-exec
      - id: micro-behaviors/process/create/shell/spawn::php-shell-exec
      - id: micro-behaviors/process/create/shell/spawn::php-exec
    near_bytes: 4096
    unless:
      - id: metadata/package/testing/presence/harness::test-fixture-directory
