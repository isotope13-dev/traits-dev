# Campaign-specific filesystem artifact from the linked Windchill advisory.
# This is a path marker, not prose: the advisory says flst.txt is created by
# the attacker's file-listing step.  It is intentionally useful across server
# languages because a later shell need not remain JSP.
#
# App-integrated variants enumerate the vault through the host application's
# own DB context (MethodContext / WTConnection) rather than Runtime.exec —
# that path is covered by app-vault-file-list-enum below.
defaults:
  platforms: [unix, windows]
  # Keep this composite on the carriers for which the rule has explicit
  # process-sink evidence; broadening it would lower hostile precision.
  # html/js/python/vbs cover JSP pages mis-typed by content heuristics.
  for: [java, php, html, javascript, python, vbs]
  attack: T1083
  mbc: E1083

traits:
  - id: attacker-file-list-manifest
    desc: Attacker file-listing manifest path
    crit: suspicious
    conf: 0.98
    if:
      type: literal
      kind: string
      substr: flst.txt

  - id: methodcontext-db-bridge
    desc: MethodContext application DB bridge
    crit: notable
    conf: 0.9
    # JSP pages are often typed as html/js/python (no dedicated jsp type).
    for: [java, kotlin, groovy, scala, html, javascript, python, vbs]
    if:
      type: text
      regex: 'MethodContext\s*\.\s*getContext\s*\('

  - id: wtconnection-cast
    desc: WTConnection application DB connection
    crit: notable
    conf: 0.92
    for: [java, kotlin, groovy, scala, html, javascript, python, vbs]
    if:
      type: text
      word: WTConnection

  # Windchill file-vault schema tables named in the Clop shell's L command.
  - id: windchill-fvitem-table
    desc: Windchill FVITEM vault table name
    crit: component
    conf: 0.9
    for: [java, kotlin, groovy, scala, html, javascript, python, vbs]
    if:
      type: text
      regex: '(?i)\bFVITEM\b'

  - id: windchill-fvmount-table
    desc: Windchill FVMOUNT vault table name
    crit: component
    conf: 0.9
    for: [java, kotlin, groovy, scala, html, javascript, python, vbs]
    if:
      type: text
      regex: '(?i)\bFVMOUNT\b'

  - id: windchill-applicationdata-table
    desc: Windchill ApplicationData table name
    crit: component
    conf: 0.9
    for: [java, kotlin, groovy, scala, html, javascript, python, vbs]
    if:
      type: text
      regex: '(?i)\bApplicationData\b'

  - id: windchill-mastered-replica-table
    desc: Windchill MasteredOnReplicaItem table name
    crit: component
    conf: 0.9
    for: [java, kotlin, groovy, scala, html, javascript, python, vbs]
    if:
      type: text
      regex: '(?i)\bMasteredOnReplicaItem\b'

composite_rules:
  - id: windchill-vault-schema-tables
    desc: Windchill file-vault schema table names
    crit: notable
    conf: 0.93
    needs: 2
    any:
      - id: windchill-fvitem-table
      - id: windchill-fvmount-table
      - id: windchill-applicationdata-table
      - id: windchill-mastered-replica-table

  - id: file-list-manifest-command-webshell
    desc: Server-side command shell writes file-list manifest
    crit: hostile
    conf: 0.99
    all:
      - id: attacker-file-list-manifest
    any:
      - id: micro-behaviors/process/create/spawn::java-runtime-exec-source
      - id: micro-behaviors/process/create/exec::java-runtime-variable-exec-source
      - id: micro-behaviors/process/create/spawn::java-runtime-exec
      - id: micro-behaviors/process/create/shell/spawn::php-shell-exec
      - id: micro-behaviors/process/create/shell/spawn::php-exec
    near_bytes: 4096
    unless:
      - id: metadata/package/testing/presence/harness::test-fixture-directory

  - id: app-vault-file-list-enum
    desc: App-context DB vault enumeration writes file-list manifest
    crit: hostile
    conf: 0.97
    attack: T1083,T1005
    all:
      - id: attacker-file-list-manifest
      - id: methodcontext-db-bridge
      - id: wtconnection-cast
    near_bytes: 5000
    unless:
      - id: metadata/package/testing/presence/harness::test-fixture-directory

  # Vault listing that also names the Windchill FV* / ApplicationData tables.
  - id: windchill-vault-schema-file-list
    desc: Windchill vault schema enum writes flst.txt
    crit: hostile
    conf: 0.97
    attack: T1083,T1005
    all:
      - id: attacker-file-list-manifest
      - id: windchill-vault-schema-tables
    any:
      - id: methodcontext-db-bridge
      - id: wtconnection-cast
      - id: micro-behaviors/communications/http/header/custom::windchill-command-header
    near_bytes: 6000
    unless:
      - id: metadata/package/testing/presence/harness::test-fixture-directory
