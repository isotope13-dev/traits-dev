defaults:
  platforms: [unix, windows]
  for: [cfml]
traits:
  - id: cfml-sql-result-cell-output
    desc: CFML prints query result cells
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: '(?i)<cfoutput>\s*#\w+\[\w+\]\[\w+\]#\s*</cfoutput>'
  - id: cfml-query-column-enumeration
    desc: CFML iterates query column names
    crit: notable
    conf: 0.92
    if:
      type: text
      regex: '(?i)<cfloop\b[^>]{0,120}\w+\.ColumnList'
composite_rules:
  # Raw SQL consoles can be deliberately deployed by administrators. Keep the
  # security-boundary observation suspicious; do not invent command execution,
  # credential theft or destructive SQL merely from the internal service API.
  - id: cfml-enumerated-datasource-sql-console
    desc: Form SQL console exposes enumerated datasources
    crit: suspicious
    conf: 0.99
    all:
      - id: micro-behaviors/data/db/config::cfml-datasource-service-enumeration
      - id: micro-behaviors/data/db/query::cfml-raw-form-query
      - id: micro-behaviors/data/db/access::cfml-form-selected-datasource

  - id: cfml-enumerated-sql-result-webshell
    desc: CFML console executes and displays arbitrary SQL
    crit: hostile
    conf: 0.98
    attack: T1505.003,T1505.005
    all:
      - id: cfml-enumerated-datasource-sql-console
      - id: cfml-sql-result-cell-output
      - id: cfml-query-column-enumeration
