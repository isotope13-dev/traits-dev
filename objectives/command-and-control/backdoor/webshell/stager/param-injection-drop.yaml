# Exploit files that both carry a request-eval PHP webshell and plant it
# through HTTP parameter injection: the payload leg establishes what gets
# staged, the injection leg establishes how it gets there. Either alone is
# weaker (a quoted webshell, or a decode pipe with no payload); together in
# one artifact they describe a complete webshell dropper, which has no
# legitimate use. Scoped to PHP/Text carriers because the payload leg is a
# PHP-AST claim; page renderings of the same exploit (HTML) and ports in
# other languages keep the suspicious injection finding but cannot reference
# that leg. Threat writeups quoting a full exploit may match both legs; that
# co-occurrence is the same attack content, not a separate benign use.
defaults:
  platforms: [unix, windows]
  for: [php]
  attack: T1190,T1059.004,T1505.003

composite_rules:
  - id: param-injection-webshell-dropper
    desc: Parameter injection plants a request-eval webshell
    crit: hostile
    conf: 0.97
    all:
      - id: objectives/lateral-movement/exploit/http::http-param-echo-decode-pipe
      - id: objectives/command-and-control/backdoor/webshell/request/eval::php-eval-request-in-string
