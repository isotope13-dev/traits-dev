defaults:
  platforms: [windows, unix]
  for: [php]
  mbc: B0030
traits:
- id: embedded-admin-password-preamble
  desc: Embedded admin password preamble
  crit: suspicious
  conf: 0.98
  attack: T1505.003
  if:
    type: text
    substr: JHBhc3N3b3JkPSdBRE1JTi0tJzsKZXJyb3JfcmVwb3J0aW5nLyoqLygwKTsKQHNldF90aW1lX2xpbWl0
- id: embedded-hex-decoder-routine
  desc: Embedded Class UC key decoder
  crit: suspicious
  conf: 0.95
  attack: T1027
  if:
    type: text
    substr: IENsYXNzX1VDX2tleS8qKi8oJHN0cmluZyl7
- id: embedded-create-function-launcher
  desc: Embedded Create Function launcher
  crit: suspicious
  conf: 0.98
  attack: T1505.003
  if:
    type: text
    substr: Q3JlYXRlX0Z1bmN0aW9uLyoqLygnJywkZmlsZW5hbWUvKiovKTskUEhQLyoqLygpOyAg
- id: flysystem-forcedcopy-gadget-class
  desc: Flysystem ForcedCopy gadget class
  crit: notable
  conf: 0.96
  for: [yaml, source, scripts]
  attack: T1190
  if:
    type: text
    substr: 'League\Flysystem\Plugin\ForcedCopy'
- id: data-uri-base64-php-tag-prefix
  desc: Data URI carrying base64-encoded PHP tag
  crit: suspicious
  conf: 0.96
  for: [yaml, source, scripts]
  attack: T1505.003
  if:
    type: text
    regex: 'data:text/html;base64,PD9waHAg[A-Za-z0-9+/=]{16,120}'
composite_rules:
- id: authenticated-admin-webshell
  desc: Embedded staged admin webshell
  crit: hostile
  conf: 0.995
  attack: T1505.003
  all:
  - id: embedded-admin-password-preamble
  - id: embedded-create-function-launcher
  any:
  - id: embedded-hex-decoder-routine
  - id: objectives/anti-static/obfuscation/eval/loader::staged-eval-loader
- id: php-staged-embedded-payload-webshell
  desc: PHP webshell evaluates embedded compressed payload
  crit: hostile
  conf: 0.99
  attack: T1505.003
  all:
  - id: micro-behaviors/data/decode/embedded/base64::php-embedded-base64-literal
  - id: micro-behaviors/data/control-flow/dispatch/computed::php-variable-function-call
  any:
  - id: objectives/anti-static/obfuscation/string/conceal::split-name-dynamic-invoke
  - id: objectives/anti-static/obfuscation/payload/builder::split-eval-spelling
  - id: objectives/anti-static/obfuscation/eval/loader::staged-eval-loader
- id: flysystem-forcedcopy-data-uri-webshell-stager
  desc: Flysystem ForcedCopy gadget stages base64 PHP webshell
  crit: hostile
  conf: 0.98
  for: [yaml, source, scripts]
  attack: T1190,T1505.003
  all:
  - id: flysystem-forcedcopy-gadget-class
  - id: data-uri-base64-php-tag-prefix
  - id: micro-behaviors/data/serialize/object::php-serialized-object-record
- id: php-carrier-slice-stager-webshell
  desc: PHP webshell slices and evaluates payload from carrier
  crit: hostile
  conf: 0.99
  attack: T1027.009,T1505.003
  all:
  - id: micro-behaviors/data/buffer/carve::php-file-range-read
  any:
  - id: micro-behaviors/data/decompress/zlib::gzuncompress-call
  - id: micro-behaviors/data/decompress/zlib::gzinflate-call
  - id: objectives/command-and-control/backdoor/webshell/eval::php-regex-eval-dynamic-replacement
