defaults:
  platforms: [windows]
  for: [csharp]
  attack: T1505.003
  mbc: B0030

composite_rules:
  - id: aspnet-virtual-provider-webshell
    desc: ASP.NET provider injects and runs a server-side page
    crit: hostile
    conf: 0.995
    all:
      - id: micro-behaviors/communications/http/server/managed::aspnet-virtual-path-provider-registration
      - id: micro-behaviors/communications/http/server/managed::aspnet-server-executes-virtual-path
      - id: micro-behaviors/data/decode/base64/reference::dotnet-frombase64string-text
