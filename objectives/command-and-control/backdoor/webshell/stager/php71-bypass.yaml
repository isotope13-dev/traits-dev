defaults:
  platforms: [windows, unix]
  for: [php]
  mbc: B0030
  attack: T1505.003
traits:
- id: xor-built-request-superglobal
  desc: XOR-built request superglobal name
  crit: suspicious
  conf: 0.98
  attack: T1027
  mbc: B0032
  if:
    type: text
    regex: "['\"]~\\+d\\(\\)['\"]\\s*\\^\\s*['\"]!\\{\\+\\{\\}['\"]"
# The subscripted variable-variable atom that used to live here (subscripted
# form only, on the theory that a plain `$x = $$name` read stays ordinary)
# was retired: Cacti's lib/functions.php disproves the intent claim. Its
# config/session setters and readers use `$$set_var[$set_key]` throughout,
# byte-identical to upstream. The idiom is covered by the canonical neutral
# trait micro-behaviors/metaprogramming/reflection/resolve::php-variable-
# variable-dereference (notable), whose scope already includes both the
# plain and the subscripted forms; the composites below reference it.
- id: eval-quoted-prefix-argument
  desc: Evals quoted prefix concatenated with variable
  crit: suspicious
  conf: 0.98
  attack: T1059.001
  mbc: E1059
  if:
    type: text
    regex: "eval\\s*\\(\\s*['\\\"][^'\"\\r\\n]{1,4}['\\\"]\\s*\\.\\s*\\$[A-Za-z_]\\w*\\s*\\)"
composite_rules:
- id: php-xor-variable-variable-webshell
  desc: PHP webshell with XOR superglobal and variable-variable dispatch
  crit: hostile
  conf: 0.99
  all:
  - id: micro-behaviors/metaprogramming/reflection/resolve::php-variable-variable-dereference
  - id: micro-behaviors/data/control-flow/dispatch/computed::php-variable-function-call
  any:
  - id: xor-built-request-superglobal
  - id: objectives/anti-static/obfuscation/string/conceal::bitwise-string-synthesis
  - id: micro-behaviors/data/string/assembly::php-xor-char-chain
- id: obfuscated-request-eval-stager
  desc: Obfuscated request-driven eval stager
  crit: suspicious
  conf: 0.98
  all:
  - id: micro-behaviors/process/interpreter/eval/direct::eval-call
  - id: micro-behaviors/metaprogramming/reflection/resolve::php-variable-variable-dereference
  any:
  - id: xor-built-request-superglobal
  - id: objectives/anti-static/obfuscation/string/conceal::bitwise-string-synthesis
  - id: eval-quoted-prefix-argument
- id: php71-bareword-bypass-webshell
  desc: PHP webshell with quoted-prefix eval and variable-variable deref
  crit: hostile
  conf: 0.995
  all:
  - id: micro-behaviors/process/interpreter/eval/direct::eval-call
  - id: micro-behaviors/metaprogramming/reflection/resolve::php-variable-variable-dereference
  - id: eval-quoted-prefix-argument
  any:
  - id: xor-built-request-superglobal
  - id: objectives/anti-static/obfuscation/string/conceal::bitwise-string-synthesis
  - id: micro-behaviors/data/string/assembly::php-xor-char-chain
