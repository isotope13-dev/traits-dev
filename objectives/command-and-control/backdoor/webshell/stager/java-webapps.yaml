# A deployment program that combines a Java webapps JSP destination, a file
# write, servlet request input, and Runtime.exec contains both the staged
# command channel and the mechanism that places it in a live application tree.
# The Zimbra refinement covers both Jetty roots identified by CERT Polska;
# the generic rule also catches the same technique against other servlet hosts.
defaults:
  platforms: [unix, windows]
  for: [scripts, binaries]
  attack: T1505.003
  mbc: B0030

composite_rules:
  - id: java-webapps-jsp-command-shell-stage
    desc: Writes a request-driven JSP command shell into a Java webapps tree
    crit: hostile
    conf: 0.995
    scope: file
    all:
      - id: micro-behaviors/fs/path/webserver::java-webapps-jsp-target-path
      - id: micro-behaviors/communications/http/request/params::java-servlet-get-parameter
      - id: micro-behaviors/process/create/spawn::java-runtime-exec-source
    any:
      - id: micro-behaviors/fs/file/write/
      - id: micro-behaviors/fs/write/file/
    near_bytes: 8192

  - id: zimbra-jetty-jsp-command-shell-stage
    desc: Writes a request-driven JSP command shell into a Zimbra Jetty webapp
    crit: hostile
    conf: 0.999
    scope: file
    all:
      - id: java-webapps-jsp-command-shell-stage
      - id: micro-behaviors/fs/path/webserver::zimbra-jetty-webapps-jsp-path
