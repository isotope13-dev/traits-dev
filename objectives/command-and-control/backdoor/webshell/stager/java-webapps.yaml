defaults:
  crit: hostile
  platforms:
  - unix
  - windows
  for:
  - python
  - javascript
  attack: T1505.003
  mbc: B0030
composite_rules:
- id: java-webapps-jsp-command-shell-stage
  desc: Writes a request-driven JSP command shell into a Java webapps tree
  conf: 0.995
  scope: file
  all:
  - id: micro-behaviors/fs/path/webserver::java-webapps-jsp-target-path
  - id: micro-behaviors/communications/http/request/params::java-servlet-get-parameter
  - id: micro-behaviors/process/create/exec::java-runtime-exec-source
  any:
  - id: micro-behaviors/fs/write/file
  near_bytes: 8192
- id: zimbra-jetty-jsp-command-shell-stage
  desc: Writes a request-driven JSP command shell into a Zimbra Jetty webapp
  conf: 0.999
  scope: file
  all:
  - id: java-webapps-jsp-command-shell-stage
  - id: micro-behaviors/fs/path/webserver::zimbra-jetty-webapps-jsp-path
