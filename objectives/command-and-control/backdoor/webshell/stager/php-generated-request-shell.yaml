defaults:
  platforms: [unix, windows]
  for: [php]
  attack: T1505.003
  mbc: B0030
composite_rules:
  - id: php-writes-generated-request-eval-shell
    desc: PHP writes a generated request-driven eval shell
    crit: hostile
    conf: 0.95
    all:
      - id: micro-behaviors/fs/write/file/full/call::php-file-put-contents
      - id: micro-behaviors/fs/write/file/full/string::php-escaped-request-superglobal-in-source
      - id: micro-behaviors/fs/write/file/full/string::php-escaped-eval-in-source
    near_bytes: 900
