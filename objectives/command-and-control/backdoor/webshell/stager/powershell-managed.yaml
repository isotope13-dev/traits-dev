# PowerShell staging of executable ASP.NET handlers. The source language is
# irrelevant: Python, JavaScript, C#, or a batch file may construct the command.
defaults:
  platforms: [windows, unix]
  for: [scripts, source, -php, -perl, -lua, -applescript]
  attack: T1505.003
  mbc: B0030

composite_rules:
  - id: powershell-managed-webroot-handler-stage
    desc: PowerShell decodes Base64 bytes into an ASP.NET webroot handler
    crit: suspicious
    conf: 0.995
    all:
      - id: micro-behaviors/fs/write/file/binary::embedded-powershell-base64-write-all-bytes
      - id: micro-behaviors/fs/path/webserver::managed-webroot-handler-path
      - id: micro-behaviors/communications/http/server/managed::aspnet-webhandler-directive
    near_bytes: 1600
