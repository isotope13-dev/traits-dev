defaults:
  for: [php]
  platforms: [windows, unix]
composite_rules:
  - id: php-writes-literal-request-eval-shell
    desc: Writes request-eval code to a PHP script
    crit: hostile
    conf: 0.98
    attack: T1505.003
    near_lines: 3
    all:
      - id: micro-behaviors/fs/write/file/full::php-request-eval-source-write
    any:
      - id: file-put-target-php-ext
      - id: micro-behaviors/fs/path/construct::php-script-path-suffix
