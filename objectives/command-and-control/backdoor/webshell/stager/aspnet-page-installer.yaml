defaults:
  platforms:
  - windows
  for:
  - html
  - csharp
  - asp
  mbc: B0030
  attack: T1505.003
traits:
- id: aspnet-physical-path-page-writer
  desc: ASP.NET request rewrites its page as ASPX
  crit: suspicious
  conf: 0.98
  if:
    type: text
    regex: '(?i)WriteAllText\s*\(\s*HttpContext\.Current\.Request\.PhysicalPath\s*\+\s*["'']\.aspx["'']'
- id: aspnet-handler-include-page-writer
  desc: ASP.NET handler writes an include directive
  crit: suspicious
  conf: 0.98
  if:
    type: text
    regex: '(?is)CreateText\s*\([^)]{0,80}MapPath\s*\([^)]{0,80}\.aspx.{0,300}<!--#include\s+file='
- id: aspnet-handler-eval-page-template
  desc: ASP.NET handler writes a request-eval page
  crit: suspicious
  conf: 0.98
  for: [asp]
  if:
    type: text
    regex: '(?i)Response\.Write\s*\(\s*eval\s*\(\s*Request\.Item'
- id: aspnet-handler-query-page-writer
  desc: ASP.NET handler writes query.aspx
  crit: suspicious
  conf: 0.97
  for: [asp]
  if:
    type: text
    regex: '(?i)File\.CreateText\s*\([^)]{0,120}query\.aspx'
composite_rules:
- id: aspnet-server-side-page-installer
  desc: ASP.NET page writes an executable server-side page
  crit: hostile
  conf: 0.99
  for: [asp]
  all:
  - id: micro-behaviors/communications/http/server/managed::aspnet-server-side-script-block
  - id: micro-behaviors/fs/write/file/full::dotnet-writealltext-token
  - id: aspnet-physical-path-page-writer
- id: aspnet-handler-include-page-installer
  desc: ASP.NET handler installs a server-side include page
  crit: hostile
  conf: 0.98
  for: [asp]
  all:
  - id: micro-behaviors/communications/http/server/managed::aspnet-webhandler-directive
  - id: aspnet-handler-include-page-writer
- id: aspnet-handler-eval-page-installer
  desc: ASP.NET handler installs a request-eval page
  crit: hostile
  conf: 0.99
  for: [asp]
  all:
  - id: micro-behaviors/communications/http/server/managed::aspnet-webhandler-directive
  - id: aspnet-handler-eval-page-template
  - id: aspnet-handler-query-page-writer
