# Compiled ASP.NET page carrying an API-hashed HTTP stage loader and native
# thread primitives. The stage's receive-to-return sequence binds downloaded
# bytes to execution. Mere presence of HTTP context and native API names
# cannot distinguish a malicious page from a diagnostic application.
defaults:
  platforms: [windows]
  for: [pe, dll]
  attack: T1505.003,T1620
composite_rules:
  - id: dotnet-page-http-shellcode-stager
    desc: ASP.NET page carries HTTP shellcode stager
    crit: hostile
    conf: 0.96
    all:
      - id: micro-behaviors/communications/http/server/managed::http-context
      - id: micro-behaviors/os/api-resolution/dynamic::managed-function-pointer-delegate
      - id: micro-behaviors/mem/alloc/virtual::nt-allocate-virtual-memory-api
      - id: micro-behaviors/process/create/thread::nt-create-thread-ex-name
      - id: objectives/anti-static/obfuscation/imports/api-hashing::ror13-peb-export-resolver-x86
      - id: micro-behaviors/process/inject/runtime/call::x86-wininet-read-stage-return
    unless:
      - id: metadata/signed/platform/
