# Compromised WordPress "verify" plugins that drop store/proxy helpers, phone
# home to /wreport.php, and overlay a fake CAPTCHA (StopAndProtect ClickFix
# hosting). Individual drops are weak; the combo is the kit signal.
defaults:
  platforms: [unix, windows]
  for: [php]
  attack: T1505.003,T1185
  mbc: B0030

traits:
  - id: wreport-php-endpoint
    desc: Posts telemetry to /wreport.php
    crit: suspicious
    conf: 0.95
    if:
      type: text
      regex: '(?i)/wreport\.php\b'

  - id: stored-url-txt-drop
    desc: Writes stored_url.txt control file
    crit: notable
    conf: 0.92
    if:
      type: text
      regex: '(?i)stored_url\.txt'

  - id: store-php-sidecar-drop
    desc: Drops store.php sidecar via file_put_contents
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: "file_put_contents\\s*\\([^;]{0,80}store\\.php"

  - id: proxy-php-sidecar-drop
    desc: Drops proxy.php sidecar via file_put_contents
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: "file_put_contents\\s*\\([^;]{0,80}proxy\\.php"

composite_rules:
  - id: wordpress-verify-captcha-kit-bootstrap
    desc: WP verify plugin drops store/proxy and reports home
    crit: hostile
    conf: 0.97
    all:
      - id: store-php-sidecar-drop
      - id: proxy-php-sidecar-drop
      - id: stored-url-txt-drop
      - id: wreport-php-endpoint
      - id: micro-behaviors/communications/http/request/wordpress::wp-remote-post
    near_bytes: 2400
