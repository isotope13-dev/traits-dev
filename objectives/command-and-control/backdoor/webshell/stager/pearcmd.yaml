# A reachable PEAR command dispatcher can turn config-create into a file-write
# primitive. Requiring a request-driven PHP payload and a web-served script
# destination separates webshell staging from legitimate PEAR configuration.
defaults:
  platforms: [unix, windows]
  for: [scripts, source]
  attack: T1059.004,T1505.003
  mbc: B0030

composite_rules:
  - id: pearcmd-config-create-webshell-write
    desc: PEAR config-create writes PHP webshell
    crit: hostile
    conf: 0.995
    all:
      - id: micro-behaviors/fs/path/package-manager::pear-command-script-path
      - id: objectives/execution/exploit/include-gadget::pear-config-create-query-argv
      - id: objectives/execution/exploit/include-gadget::pear-config-create-absolute-output
      - id: objectives/command-and-control/backdoor/webshell/embedded::embedded-php-request-command
      - id: micro-behaviors/fs/path/webserver::public-web-script-path-reference
    any:
      - id: micro-behaviors/communications/http/get/
      - id: micro-behaviors/communications/http/lib/requests/
      - id: micro-behaviors/communications/http/request/client/
      - id: micro-behaviors/communications/http/curl/
    needs: 1
    near_bytes: 2048

  - id: pearcmd-config-create-temp-webshell-stage
    desc: PEAR config-create stages PHP webshell to temp
    crit: hostile
    conf: 0.995
    all:
      - id: micro-behaviors/fs/path/package-manager::pear-command-script-path
      - id: objectives/execution/exploit/include-gadget::pear-config-create-query-argv
      - id: objectives/execution/exploit/include-gadget::pear-config-create-absolute-output
      - id: objectives/command-and-control/backdoor/webshell/embedded::embedded-php-request-command
      - id: micro-behaviors/fs/path/temp::temporary-php-script-path
    any:
      - id: micro-behaviors/communications/http/get/
      - id: micro-behaviors/communications/http/lib/requests/
      - id: micro-behaviors/communications/http/request/client/
      - id: micro-behaviors/communications/http/curl/
    needs: 1
    near_bytes: 2048

