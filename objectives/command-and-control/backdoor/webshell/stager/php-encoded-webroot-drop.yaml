# Stages a server-executable payload: PHP decodes an embedded Base64 blob and
# writes the result as a .php script into the web document root, where the web
# server will execute it on request. The dropped script's function is not
# established by these legs; webroot staging plus concealed execution is the
# attack claim. Bare-PHP injections without an opening tag are typed Text and
# reach these legs only through text-surface traits, which also search decoded
# string layers.
defaults:
  platforms: [windows, unix]
  for: [php, text]
composite_rules:
  - id: php-encoded-webroot-drop
    desc: PHP writes a Base64-decoded script into the web document root
    crit: hostile
    conf: 0.96
    attack: T1505.003
    all:
      - id: micro-behaviors/fs/write/file/full/bytes::php-writes-base64-data-any
      - id: micro-behaviors/communications/http/request/superglobal::document-root-access
      - id: micro-behaviors/fs/path/script::php-script-path-suffix
    # Concealment beside the staged write separates an encoded payload
    # installer from ordinary deployment code: the same file either evaluates
    # source through eval, decodes a carrier-scale literal directly, carries
    # a large embedded Base64 blob, or (parsed PHP only) nests a decoder call
    # in eval.
    any:
      - id: micro-behaviors/process/interpreter/eval/direct::eval-variable-argument
      - id: micro-behaviors/data/decode/embedded/base64::php-large-literal-base64-decode
      - id: micro-behaviors/data/decode/embedded/base64::php-embedded-base64-literal
      - id: micro-behaviors/process/interpreter/eval/decoded::php-eval-string-decoder
