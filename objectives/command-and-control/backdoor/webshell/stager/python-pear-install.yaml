defaults:
  for:
  - python
  platforms:
  - unix
  - windows
composite_rules:
- id: pear-request-command-shell-install
  desc: PEAR request-command shell injection accompanies a temporary PHP path
  crit: hostile
  conf: 0.98
  all:
  - id: objectives/execution/exploit/include-gadget::python-pear-request-command-injection
  - id: micro-behaviors/fs/path/temp::temporary-php-script-path
  unless:
  - id: metadata/lang/source/shape::python-literal-module-quoted-source
