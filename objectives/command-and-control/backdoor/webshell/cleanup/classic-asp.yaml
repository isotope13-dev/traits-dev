defaults:
  platforms: [windows]
  for: [vbs, html]
  attack: T1505.003
  mbc: B0030

composite_rules:
  - id: classic-asp-command-output-cleanup
    desc: Classic ASP deletes command output
    crit: hostile
    conf: 0.99
    all:
      - id: metadata/lang/scripted::vbscript-valid
      - id: micro-behaviors/communications/http/request/params::classic-asp-request-field
      - id: micro-behaviors/process/create/shell/script-host::cmd-exe-c-command
      - id: micro-behaviors/fs/delete/file::cmd-del-command
