defaults:
  platforms: [windows]
  for: [vbs, html, asp]
  attack: T1505.003
  mbc: B0030

composite_rules:
  # A request-driven WSH command shell that also deletes a file is cleaning
  # up its output staging (the temp file holding command output) or its own
  # dropper. Either deletion spelling establishes the cleanup half: cmd del
  # for shell-form cleanup, FileSystemObject DeleteFile for API-form cleanup.
  - id: classic-asp-command-shell-file-deletion
    for: [vbs, asp]
    desc: ASP command shell deletes a file
    crit: hostile
    conf: 0.97
    all:
      - id: objectives/command-and-control/backdoor/webshell/request/command::classic-asp-command-form-wsh-execution
    any:
      - id: micro-behaviors/fs/delete/file/command::cmd-del-command
      - id: micro-behaviors/fs/delete/file/library::wsh-deletefile-call
