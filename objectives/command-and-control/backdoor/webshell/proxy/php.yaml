defaults:
  platforms: [unix, windows]
  for: [php]
  attack: T1505.003
  mbc: B0030

traits:
  # These partial fragments bind the request URL to the outbound HTTP relay.
  - id: php-request-proxy-field-fragment
    desc: PHP source reads the request proxy field
    crit: component
    conf: 0.98
    if:
      type: text
      regex: "\\$_REQUEST\\s*\\[\\s*['\"]proxy['\"]\\s*\\]"
  - id: php-request-url-proxy-parser-fragment
    desc: PHP request proxy URL parser
    crit: component
    conf: 0.98
    if:
      type: text
      regex: "explode\\s*\\(\\s*['\"]/['\"]\\s*,\\s*\\$proxy\\s*\\)"
  - id: php-request-proxy-socket-fragment
    desc: PHP socket connects to proxy host
    crit: component
    conf: 0.98
    if:
      type: text
      regex: 'fsockopen\s*\(\s*\$host\s*,\s*80\s*\)'
  - id: php-request-proxy-write-fragment
    desc: PHP sends request over proxy socket
    crit: component
    conf: 0.98
    if:
      type: text
      regex: 'fputs\s*\(\s*\$fp\s*,\s*\$header\s*\)'
  - id: php-request-proxy-read-fragment
    desc: PHP reads response from proxy socket
    crit: component
    conf: 0.98
    if:
      type: text
      regex: 'fgets\s*\(\s*\$fp\s*,\s*1024\s*\)'
  - id: php-request-proxy-relay-fragment
    desc: PHP echoes the proxy response line
    crit: component
    conf: 0.98
    if:
      type: text
      regex: 'echo\s+\$line\s*;'

composite_rules:
  - id: php-request-controlled-raw-http-proxy
    desc: PHP request URL selects an outbound raw HTTP proxy destination
    crit: suspicious
    conf: 0.98
    all:
      - id: micro-behaviors/communications/socket/connect::fsockopen-call
      - id: micro-behaviors/communications/http/message::raw-http-safe-request-line
      - id: micro-behaviors/fs/write/file/handle::php-fputs
      - id: micro-behaviors/communications/http/request/superglobal::request-param-assignment
      - id: micro-behaviors/fs/read/stream::php-fgets-call
      - id: micro-behaviors/process/io/stream::php-echo-statement
      - id: php-request-proxy-field-fragment
      - id: php-request-url-proxy-parser-fragment
      - id: php-request-proxy-socket-fragment
      - id: php-request-proxy-write-fragment
      - id: php-request-proxy-read-fragment
      - id: php-request-proxy-relay-fragment
