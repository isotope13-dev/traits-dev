defaults:
  platforms: [unix, windows]
  for: [php]
  attack: T1505.003
traits:
  # Both the /e modifier and request-controlled replacement must belong to
  # this same call. A normal /e callback plus a separate request substitution
  # is deliberately a near miss.
  - id: php-request-regex-evaluation
    desc: PHP regex evaluator executes request replacement
    crit: suspicious
    conf: 0.98
    if:
      type: tree-sitter
      language: php
      query: |
        (function_call_expression
          function: (name) @callee
          arguments: (arguments
            . (argument (_) @pattern)
            . (argument (subscript_expression) @replacement))
          (#match? @callee "(?i)^preg_replace$")
          (#match? @pattern "[/|#~][A-Za-z]*e[A-Za-z]*[\"']$")
          (#match? @replacement "^\\$_(GET|POST|REQUEST)\\[")) @eval

  - id: php-regex-eval-dynamic-replacement
    desc: Dynamic PHP preg_replace /e evaluation
    crit: suspicious
    conf: 0.96
    if:
      type: tree-sitter
      language: php
      query: |
        (function_call_expression
          function: (name) @callee
          arguments: (arguments
            . (argument (_) @pattern)
            . (argument [(variable_name) (member_access_expression) (subscript_expression) (function_call_expression)] @replacement))
          (#match? @callee "(?i)^preg_(replace|filter)$")
          (#match? @pattern "[/|#~][A-Za-z]*e[A-Za-z]*[\"']$")) @eval

composite_rules:
  - id: php-regex-eval-webshell
    desc: PHP preg_replace /e evaluation webshell
    crit: hostile
    conf: 0.99
    mbc: B0030
    all:
      - id: php-regex-eval-dynamic-replacement
    any:
      - id: micro-behaviors/communications/http/request/superglobal::get-dup
      - id: micro-behaviors/communications/http/request/superglobal::post-dup
      - id: micro-behaviors/communications/http/request/superglobal::request-dup
      - id: micro-behaviors/communications/http/request/superglobal::cookie
      - id: micro-behaviors/communications/http/request/superglobal::get-post-param-access
      - id: micro-behaviors/communications/http/request/superglobal::php-request-parameter-access
      - id: micro-behaviors/communications/http/request/superglobal::session

  - id: php-regex-eval-decompressed-webshell
    desc: PHP preg_replace /e evaluates decompressed payload
    crit: hostile
    conf: 0.99
    mbc: B0030
    all:
      - id: php-regex-eval-dynamic-replacement
    any:
      - id: micro-behaviors/data/decompress/zlib::gzuncompress-call
      - id: micro-behaviors/data/decompress/zlib::gzinflate-call
      - id: micro-behaviors/data/decode/base64/unspecified::php-base64-decode-call
