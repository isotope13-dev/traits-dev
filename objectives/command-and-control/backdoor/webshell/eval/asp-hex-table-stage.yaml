defaults:
  platforms: [windows]
  for: [asp]
  crit: notable
  conf: 0.96
traits:
  - id: asp-server-jscript-block
    desc: ASP contains server-side JavaScript block
    if:
      type: text
      regex: '(?i)<script\s+runat\s*=\s*["'']?server["'']?\s+language\s*=\s*["'']?javascript'
  - id: asp-hex-marker-code-table
    desc: ASP source contains marker-prefixed hex table
    if:
      type: text
      regex: '(H[0-9A-Fa-f]{2}){80,}'
  - id: asp-hex-marker-unescape
    desc: ASP changes hex markers before unescape
    if:
      type: text
      regex: '(?i)\bunescape\s*\(\s*\w+\.replace\s*\(\s*/H/g\s*,\s*["'']%["'']'
  - id: asp-eval-property-alias
    desc: ASP stores eval in object property
    if:
      type: text
      regex: '(?i)\{\s*["''][a-z_][a-z0-9_]*["'']\s*:\s*eval\s*\}'
composite_rules:
  # A request selects among encoded server-side stages; this is a source
  # profile and does not assert that a selected stage completed.
  - id: asp-request-selected-hex-eval-stage
    desc: ASP request selects hex-decoded eval stage
    crit: hostile
    attack: T1505.003,T1027,T1059.007
    all:
      - id: asp-hex-marker-code-table
      - id: asp-hex-marker-unescape
      - id: asp-eval-property-alias
      - id: micro-behaviors/communications/http/server/request::classic-asp-collection-request-field
      - id: asp-server-jscript-block
