defaults:
  platforms: [unix, windows]
  for: [media]
  attack: T1505.003,T1027.009
composite_rules:
  - id: media-php-request-eval-webshell
    desc: PHP in media directly evaluates HTTP request input
    crit: hostile
    conf: 0.99
    near_bytes: 128
    all:
      - id: micro-behaviors/data/embedded/payload/media::php-open-tag-in-media
      - id: micro-behaviors/data/embedded/payload/media::request-driven-eval-in-media
