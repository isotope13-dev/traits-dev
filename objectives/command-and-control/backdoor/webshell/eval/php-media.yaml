defaults:
  platforms: [unix, windows]
  for: [media, bmp]
  attack: T1505.003,T1027.009
composite_rules:
  - id: media-php-request-eval-webshell
    desc: PHP in media evaluates HTTP request input
    crit: hostile
    conf: 0.99
    all:
      - id: micro-behaviors/data/embedded/payload/media::php-open-tag-in-media
      - id: micro-behaviors/data/embedded/payload/media::php-request-eval-call
  - id: media-php-request-assert-webshell
    desc: PHP in media passes request input to assert
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/data/embedded/payload/media::php-open-tag-in-media
      - id: micro-behaviors/data/embedded/payload/media::php-request-assert-call
