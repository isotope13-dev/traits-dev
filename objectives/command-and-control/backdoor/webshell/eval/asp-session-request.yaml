defaults:
  platforms: [windows]
  for: [asp]
  crit: notable
  conf: 0.97
traits:
  - id: asp-request-to-session-assignment
    desc: ASP assigns request data to session
    if:
      type: text
      regex: '(?i)\bsession\s*\([^\r\n)]{1,80}\)\s*=\s*request\s*\([^\r\n)]{1,80}\)'
  - id: asp-execute-session-value
    desc: ASP executes a session value
    if:
      type: text
      regex: '(?i)\bexecute\s+session\s*\([^\r\n)]{1,80}\)'
composite_rules:
  # Proximity records a request-fed session execution pattern; it does not
  # assert that the two session expressions use the same key.
  - id: asp-request-fed-session-execute
    desc: ASP request-fed session execution clues
    crit: hostile
    attack: T1505.003,T1059.005
    near_bytes: 1024
    all:
      - id: asp-request-to-session-assignment
      - id: asp-execute-session-value
