defaults:
  platforms: [windows]
  for: [asp]
  crit: notable
  conf: 0.96
traits:
  - id: vb-obfuscated-eval-token
    desc: VB constructs eval from character code
    if:
      type: text
      regex: '(?i)["'']ev["'']\s*&\s*chr\s*\([^\r\n)]{1,12}\)\s*&\s*["'']l["'']'
  - id: vb-scriptcontrol-addobject-request-fragment
    desc: Script control receives request object clues
    if:
      type: text
      regex: '(?i)\.addobject\s+["'']r["'']\s*&\s*chr\s*\([^\r\n)]{1,12}\)\s*&\s*["'']qu[a-z]*["'']'
composite_rules:
  - id: asp-obfuscated-scriptcontrol-request-eval
    desc: Obfuscated ASP script-control request eval
    crit: hostile
    attack: T1505.003,T1059.005,T1027
    all:
      - id: vb-obfuscated-eval-token
      - id: vb-scriptcontrol-addobject-request-fragment
      - id: objectives/anti-static/obfuscation/eval/loader::vbs-chr-execute-statement
      - id: objectives/anti-static/obfuscation/string/concat::vbs-createobject-chr-progid
