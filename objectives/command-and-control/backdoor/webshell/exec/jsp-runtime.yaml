defaults:
  platforms: [unix, windows]
  for: [jsp]
  attack: T1505.003
  mbc: B0030

composite_rules:
  - id: jsp-request-runtime-exec-shell
    desc: JSP request handler launches a shell via Runtime.exec
    crit: hostile
    conf: 0.99
    all:
      - id: metadata/lang/scripted::jsp-server-page
      - id: micro-behaviors/communications/http/request/params::java-servlet-get-parameter
      - id: micro-behaviors/process/create/exec::java-runtime-exec-source
    any:
      - id: micro-behaviors/process/create/shell/selection::java-windows-command-array-source
      - id: micro-behaviors/process/create/shell/selection::java-posix-command-array-source
      - id: micro-behaviors/process/create/shell/selection::java-numeric-posix-command-array-source
      - id: micro-behaviors/process/create/shell/spawn::java-runtime-exec-shell-array
    needs: 1
    unless:
      - id: well-known/tool/offensive/
      - id: metadata/package/testing/presence/harness::test-fixture-directory
