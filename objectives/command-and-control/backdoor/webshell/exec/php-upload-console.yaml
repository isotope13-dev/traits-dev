defaults:
  platforms: [unix, windows]
  for: [php]
composite_rules:
  # This is a console capability combination, not a claim that all POST
  # values reach execution or that the console has been planted on a host.
  # Online development/admin consoles remain a legitimate near neighbor.
  - id: php-command-ui-decoded-upload-console
    desc: PHP command console with decoded file uploads
    crit: suspicious
    conf: 0.95
    all:
      - id: micro-behaviors/ui/controls/input::php-command-named-form-control
      - id: micro-behaviors/communications/http/request/superglobal::request-param-assignment
      - id: micro-behaviors/process/create/shell/lang::php-variable-shell-command
      - id: micro-behaviors/fs/write/file/full::php-writes-base64-data
      - id: micro-behaviors/data/serialize/json::php-json-encode
