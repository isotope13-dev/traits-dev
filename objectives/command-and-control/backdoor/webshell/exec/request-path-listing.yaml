# A servlet that builds a File from request input and reports what it finds.
#
#   String path = req.getParameter("file");
#   File file = new File(path);
#   File afile[] = file.listFiles();
#   printwriter.write(...);
#
# The caller names any path on the server and gets the directory back. There
# is no traversal to detect because nothing is being escaped -- the parameter
# is the path. A file manager for an authenticated administrator looks the
# same in these three lines, which is why the response write matters: the
# listing is going back to whoever asked, in the same request.
#
# Half of a webshell's usefulness is this rather than command execution, and
# it survives every control aimed at spawning processes.
defaults:
  platforms: [unix, windows]
  for: [java, class, html]
  attack: T1505.003,T1083
  mbc: B0030

traits:
  - id: file-constructed-from-request-parameter
    desc: File path taken from a request parameter
    crit: suspicious
    conf: 0.95
    if:
      type: text
      regex: 'new File\(\s*[\w.]{0,24}getParameter'

composite_rules:
  - id: servlet-request-path-directory-listing
    for: [java]
    desc: Servlet lists a caller-supplied directory
    crit: hostile
    conf: 0.95
    near_bytes: 4096
    # The getParameter leg is intentionally absent from the any-list: it is
    # already required in all, and any JavaBean reader can be named
    # getParameter (OpenShift Template parameters, build-tool models). The
    # HTTP context must come from a servlet import or a response writer.
    all:
      - id: micro-behaviors/communications/http/request/params::servlet-get-parameter-call
      - id: micro-behaviors/fs/path/construct::java-file-object-constructor
      - id: micro-behaviors/fs/directory/readdir::java-listfiles-no-arg-call
    any:
      - id: metadata/import/framework::java-servlet-api-name-reference
      - id: micro-behaviors/communications/http/server/managed::java-response-output-accessor
      - id: micro-behaviors/communications/http/server/managed::java-response-writer-output
    unless:
      - id: well-known/tool/offensive/
      - id: metadata/import/framework::android-framework-java-import
