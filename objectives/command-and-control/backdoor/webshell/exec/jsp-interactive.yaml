# Interactive JSP shells keep a long-lived ProcessThread and feed it commands
# from request parameters (often behind a session auth gate). Distinct from
# the one-shot Runtime.exec request/ composites: the durable process is the
# command channel.
#
# Carrier types: cleave has no `jsp` file type (see metadata/lang/scripted).
defaults:
  platforms: [unix, windows]
  for: [java, class, html, javascript, python, vbs]
  attack: T1505.003
  mbc: B0030
traits:
  - id: jsp-process-thread-class
    desc: JSP ProcessThread worker class
    crit: component
    conf: 0.92
    if:
      type: text
      regex: 'class\s+ProcessThread\s+extends\s+Thread'
  - id: jsp-cmd-request-parameter
    desc: JSP reads cmd request parameter
    crit: component
    conf: 0.85
    if:
      type: text
      substr: 'getParameter("cmd")'
composite_rules:
  - id: jsp-interactive-process-shell
    desc: JSP interactive ProcessThread command shell
    crit: hostile
    conf: 0.97
    all:
      - id: metadata/lang/scripted::jsp-server-page
      - id: jsp-process-thread-class
      - id: jsp-cmd-request-parameter
    any:
      - id: micro-behaviors/process/create/spawn::java-runtime-exec-source
      - id: micro-behaviors/process/create/exec::java-runtime-variable-exec-source
      - id: micro-behaviors/process/create/spawn::java-getruntime-ref
