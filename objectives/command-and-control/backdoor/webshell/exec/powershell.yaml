# A local HttpListener is commonly used for development and administration.
# It becomes a webshell when an HTTP command field is handed to PowerShell's
# dynamic evaluator and the output is returned in the response page.
defaults:
  platforms: [windows]
  for: [powershell]
  attack: T1505.003,T1059.001
  mbc: B0030

traits:
  - id: powershell-http-command-form
    desc: PowerShell HTTP command form
    crit: component
    conf: 0.97
    if:
      type: text
      regex: '(?is)<form[^>]{0,160}action=["'']?/[^>]{0,160}>.{0,500}name=["'']?command\b'

  - id: powershell-request-command-eval
    desc: PowerShell evaluates request URL command
    crit: suspicious
    conf: 0.99
    if:
      type: text
      regex: '(?is)\$REQUEST\.Url\.Query.{0,900}Invoke-Expression[^\r\n]{0,120}\$FORMFIELD\b'

composite_rules:
  - id: powershell-httplistener-command-webshell
    desc: PowerShell HttpListener executes request-supplied commands
    crit: hostile
    conf: 0.995
    all:
      - id: micro-behaviors/communications/http/server/managed::powershell-httplistener
      - id: powershell-http-command-form
      - id: powershell-request-command-eval
