# JScript ASP shells instantiate WScript.Shell and call Exec, not Run:
# `new ActiveXObject("WScript.Shell")` then `goWSS.Exec(sCmd)`.
defaults:
  platforms: [windows]
  for: [javascript, vbs]
  attack: T1505.003
  mbc: B0030
composite_rules:
  - id: wscript-shell-exec-command
    desc: WScript.Shell Exec launches command
    crit: hostile
    conf: 0.96
    all:
      - id: micro-behaviors/os/com/automation::wscript-shell-literal
      - id: micro-behaviors/process/create/shell/wsh::exec-method-call
    # The webshell part: the command arrives in an ASP request field. A WSH
    # script that Exec()s its own command line is ordinary automation.
    any:
      - id: micro-behaviors/communications/http/request/superglobal::classic-asp-request-field
    near_lines: 40
    unless:
      - id: metadata/package/tooling::contools-script-path
