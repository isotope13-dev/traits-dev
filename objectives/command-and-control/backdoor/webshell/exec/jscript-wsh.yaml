# JScript ASP shells instantiate WScript.Shell and call Exec, not Run:
# `new ActiveXObject("WScript.Shell")` then `goWSS.Exec(sCmd)`.
defaults:
  platforms: [windows]
  for: [javascript, vbs]
  attack: T1505.003
  mbc: B0030
composite_rules:
  - id: wscript-shell-exec-command
    desc: WScript.Shell Exec launches command
    crit: hostile
    conf: 0.96
    all:
      - id: micro-behaviors/os/com/object::wscript-shell-literal
      - id: objectives/execution/interpreter/scripting/host::exec-method
    near_lines: 40
