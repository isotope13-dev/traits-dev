---
defaults:
  platforms:
  - windows
  - unix
  for:
  - php
composite_rules:
- id: php-memory-webshell
  desc: 'PHP memory webshell: self-delete + remote eval'
  crit: hostile
  conf: 0.99
  mbc: B0030
  attack: T1505.003
  all:
  - id: objectives/evasion/self-delete/file/script::script-self-delete
  - id: micro-behaviors/process/interpreter/eval::eval-symbol
  any:
  - id: micro-behaviors/process/control/signal::ignore-user-abort
  - id: micro-behaviors/process/control/signal::set-time-limit
  - id: micro-behaviors/fs/read/file::file-get-contents
  - id: micro-behaviors/process/interpreter/eval::error-suppressed-eval
  needs: 2
  unless:
  - id: metadata/package/testing/presence/fixture::gherkin-feature-file
- id: php-backdoor
  desc: 'PHP webshell: session-based backdoor'
  crit: hostile
  conf: 0.95
  mbc: B0030
  attack: T1505.003
  all:
  # Require the concrete host-derived /tmp session path. The session
  # directory also contains benign background-worker observations.
  - id: objectives/command-and-control/backdoor/webshell/session::temp-host-log-path
  - id: micro-behaviors/communications/http/request/
  any:
  - id: objectives/anti-static/obfuscation/
  - id: micro-behaviors/fs/write/
  - id: micro-behaviors/process/create/shell/
  unless:
  - id: metadata/package/testing/presence/fixture::gherkin-feature-file
  - id: well-known/app/wordpress-plugins::wordpress-maintenance-plugin
- id: php-shell-functional
  desc: PHP request input reaches command execution
  crit: suspicious
  conf: 0.98
  mbc: B0030
  attack: T1505.003
  all:
  - id: micro-behaviors/process/create/shell/lang::exec-user-input
  - id: micro-behaviors/communications/http/request/
  unless:
  - id: metadata/package/testing/presence/fixture::gherkin-feature-file
  - id: metadata/package/testing/harness/unit::php-test-runner
  - id: micro-behaviors/communications/socket/connect::localhost-socket-uri
  - id: well-known/tool/detection/security-scanner/
  - id: well-known/app/zealphp
  - id: well-known/lib/symfony::package-doc
  - id: well-known/tool/sysadmin/nmap::nmap-source-tree
- id: php-command-webshell
  desc: PHP request directly executes a shell command
  crit: hostile
  conf: 0.99
  mbc: B0030
  attack: T1505.003,T1059.004
  all:
  - id: php-shell-functional
  - id: objectives/execution/interpreter/eval/remote::php-request-shell-execution

- id: php-command-panel
  desc: PHP command webshell includes an authentication panel
  crit: hostile
  conf: 0.99
  mbc: B0030
  attack: T1505.003
  all:
  - id: php-command-webshell
  - id: objectives/command-and-control/backdoor/webshell/auth::password-form

- id: php-remote-code-forwarder
  desc: PHP forwards request-supplied code to remote shells
  crit: hostile
  conf: 0.99
  mbc: B0030
  attack: T1505.003,T1059.004
  all:
  - id: micro-behaviors/communications/http/request/params::php-requested-code-field
  - id: micro-behaviors/communications/http/request/params::post-dup
  - id: micro-behaviors/communications/http/post::php-http-build-query

- id: php-backdoor-url-manager
  desc: PHP stores a browser-supplied backdoor URL
  crit: hostile
  conf: 0.99
  mbc: B0030
  attack: T1505.003
  all:
  - id: micro-behaviors/communications/http/request/params::php-backdoor-url-field
  - id: micro-behaviors/communications/http/request/params::post-dup
  - id: micro-behaviors/communications/http/request/params::php-backdoor-storage-assignment

- id: php-backdoor-fleet-registry
  desc: PHP registers a backdoor URL into an indexed shell fleet
  crit: hostile
  conf: 0.99
  mbc: B0030
  attack: T1505.003
  all:
  - id: micro-behaviors/communications/http/request/params::php-backdoor-url-field
  - id: micro-behaviors/communications/http/request/params::php-backdoor-storage-assignment
  - id: micro-behaviors/communications/http/request/params::request-param-assignment

- id: php-remote-code-fleet-stager
  desc: PHP stages request-supplied code across a shell fleet
  crit: hostile
  conf: 0.99
  mbc: B0030
  attack: T1505.003,T1059.004
  all:
  - id: php-remote-code-forwarder
  - id: micro-behaviors/communications/http/request/params::php-requested-code-field
  - id: micro-behaviors/communications/http/post::php-http-build-query

- id: php-shell-fleet-validator
  desc: PHP validates reachability of a stored shell fleet
  crit: hostile
  conf: 0.97
  mbc: B0030
  attack: T1505.003
  all:
  - id: micro-behaviors/communications/http/request/params::php-shell-validity-check
  - id: micro-behaviors/process/lifecycle/auto-exec::php-include-init-script
  - id: micro-behaviors/communications/http/request/params::post-dup

- id: php-shell-fleet-recheck
  desc: PHP rechecks and persists shell fleet validity
  crit: hostile
  conf: 0.96
  mbc: B0030
  attack: T1505.003
  all:
  - id: micro-behaviors/communications/http/request/params::php-shell-validity-check
  - id: micro-behaviors/communications/http/request/params::post-dup
  - id: micro-behaviors/communications/http/request/params::php-shell-fleet-save-db

- id: php-shell-fleet-comment-store
  desc: PHP stores operator comments on a shell fleet entry
  crit: hostile
  conf: 0.96
  mbc: B0030
  attack: T1505.003
  all:
  - id: micro-behaviors/communications/http/request/params::post-dup
  - id: micro-behaviors/communications/http/request/params::php-shell-comment-field
  - id: micro-behaviors/process/lifecycle/auto-exec::php-include-init-script

- id: php-shell-fleet-comment-panel
  desc: PHP shell-fleet comment editor panel
  crit: hostile
  conf: 0.95
  mbc: B0030
  attack: T1505.003
  all:
  - id: micro-behaviors/communications/http/request/params::php-shell-comment-field
  - id: micro-behaviors/process/lifecycle/auto-exec::php-include-init-script
  - id: micro-behaviors/communications/http/request/params::request-param-assignment

- id: php-shell-enslaver-panel
  desc: PHP shell-fleet management panel
  crit: hostile
  conf: 0.97
  mbc: B0030
  attack: T1505.003
  all:
  - id: micro-behaviors/communications/http/request/params::php-shell-enslaver-marker
  - id: micro-behaviors/process/lifecycle/auto-exec::php-include-init-script

- id: php-shell-enslaver-ui-assets
  desc: PHP shell-fleet panel loads operator UI assets
  crit: hostile
  conf: 0.96
  mbc: B0030
  attack: T1505.003
  all:
  - id: micro-behaviors/communications/http/request/params::php-shell-enslaver-marker
  - id: micro-behaviors/communications/http/request/params::php-shell-enslaver-ui-asset
- id: php-backtick-rce
  desc: 'PHP webshell: backtick RCE from user input'
  crit: suspicious
  conf: 0.98
  mbc: E1059
  attack: T1059.004
  all:
  - id: micro-behaviors/process/create/shell/lang::backtick
  - id: micro-behaviors/communications/http/request/
  any:
  - id: micro-behaviors/communications/http/request/form-input::php-input
  - id: micro-behaviors/process/create/shell/
  - id: micro-behaviors/fs/write/
  - id: objectives/command-and-control/backdoor/webshell/session/
  unless:
  - id: metadata/package/testing/presence/fixture::gherkin-feature-file
  - id: metadata/package/testing/presence/fixture::php-test-file
  - id: well-known/app/matomo/
  - id: well-known/app/zealphp/
  - id: well-known/app/egroupware/
  - id: well-known/tool/sysadmin/munin/
  - id: well-known/app/wordpress-plugins/
  - id: metadata/file/magic/identity::php-archive
  - id: well-known/lib/benign-runtime-bundles/
- id: php-full-webshell
  desc: Full-featured PHP webshell
  crit: suspicious
  conf: 0.98
  mbc: B0030
  attack: T1505.003
  all:
  - id: micro-behaviors/process/create/shell/
  - id: micro-behaviors/communications/http/request/
  - id: micro-behaviors/fs/write/
  - id: objectives/command-and-control/backdoor/webshell/
  - id: micro-behaviors/process/create/shell/lang::backtick
  unless:
  - id: metadata/package/testing/presence/fixture::gherkin-feature-file
  - id: metadata/package/testing/presence/fixture::php-test-file
  - id: well-known/app/zealphp
  - id: well-known/app/egroupware/
  - id: well-known/tool/sysadmin/munin/
  - id: well-known/app/wordpress-plugins/
  - id: metadata/file/magic/identity::php-archive
  - id: well-known/lib/benign-runtime-bundles/
