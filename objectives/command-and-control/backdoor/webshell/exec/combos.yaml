---
defaults:
  platforms:
  - windows
  - unix
  for:
  - php
composite_rules:
- id: php-memory-webshell
  desc: 'PHP memory webshell: self-delete + remote eval'
  crit: hostile
  conf: 0.99
  mbc: B0030
  attack: T1505.003
  all:
  - id: objectives/evasion/self-delete/file/script::script-self-delete
  - id: micro-behaviors/process/interpreter/eval/direct::eval-call
  any:
  - id: micro-behaviors/process/control/signal::ignore-user-abort
  - id: micro-behaviors/process/resources/limits::set-time-limit
  - id: micro-behaviors/fs/read/file/full::file-get-contents
  - id: micro-behaviors/process/interpreter/eval/direct::error-suppressed-eval
  needs: 2
  unless:
  - id: metadata/package/testing/presence/path::gherkin-feature-file
- id: php-backdoor
  desc: PHP request execution with host-derived log path
  crit: hostile
  conf: 0.95
  mbc: B0030
  attack: T1505.003
  all:
  # Require the concrete host-derived /tmp session path. The session
  # directory also contains benign background-worker observations.
  - id: micro-behaviors/fs/path/temp::php-host-derived-log-path
  - id: micro-behaviors/communications/http/request/
  any:
  - id: objectives/execution/interpreter/eval/remote::eval-user-input
  - id: micro-behaviors/process/create/shell/lang::exec-user-input
  - id: micro-behaviors/process/create/shell/lang::php-request-assigned-command-branch
  unless:
  - id: metadata/package/testing/presence/path::gherkin-feature-file
  - id: well-known/app/publishing/wordpress-plugins/site-admin::wordpress-maintenance-plugin
- id: php-shell-functional
  desc: PHP request input reaches command execution
  crit: suspicious
  conf: 0.98
  mbc: B0030
  attack: T1505.003
  all:
  - id: micro-behaviors/process/create/shell/lang::exec-user-input
  - id: micro-behaviors/communications/http/request/
  unless:
  - id: well-known/tool/offensive/
  - id: metadata/package/testing/presence/path::gherkin-feature-file
  - id: metadata/package/testing/harness/unit::php-test-runner
  - id: micro-behaviors/communications/socket/uri::localhost-socket-uri
  - id: well-known/tool/detection/security-scanner/
  - id: well-known/app/system/zealphp
  - id: well-known/lib/web/symfony::package-doc
  - id: metadata/file/extension/identity::markdown-file-basename
- id: php-command-webshell
  desc: PHP request directly executes a shell command
  crit: hostile
  conf: 0.99
  mbc: B0030
  attack: T1505.003,T1059.004
  all:
  - id: php-shell-functional
  - id: php-request-shell-execution
  unless:
  - id: metadata/package/testing/presence/harness::test-directory-path
  - id: metadata/file/extension/identity::markdown-file-basename
- id: php-variable-command-webshell
  desc: PHP command form with variable execution
  crit: hostile
  conf: 0.95
  mbc: B0030
  attack: T1505.003,T1059.004
  all:
  - id: micro-behaviors/process/create/shell/lang::exec-variable-argument
  - id: micro-behaviors/communications/http/request/superglobal::request-isset-default-assignment
  - id: objectives/command-and-control/backdoor/webshell/request/command::php-command-form-field
  unless:
  - id: metadata/package/testing/presence/harness::test-directory-path
  - id: metadata/file/extension/identity::markdown-file-basename

# Indirect shape the direct taint atoms miss: request data is assigned to a
# variable first (`$command = $_REQUEST[$cmd]`), then executed through
# system()/passthru() with that variable, with the dangerous sink reached
# through reflection (`ReflectionFunction('system')->invoke`), a callback
# dispatcher, a reverse-shell socket, or anti-removal file locking. The
# direct-shape composite above needs a literal cmd/shell form field and an
# isset-with-default; this one needs the assignment plus the variable sink
# plus one corroborating concealment/egress/persistence move.
- id: php-indirect-request-command-webshell
  desc: PHP request value assigned then executed as command
  crit: hostile
  conf: 0.97
  mbc: B0030
  attack: T1505.003,T1059.004
  all:
  - id: micro-behaviors/communications/http/request/superglobal::request-param-assignment
  - id: micro-behaviors/process/create/shell/lang::exec-variable-argument
  - id: php-webshell-corroborating-move
  near_bytes: 1024
  unless:
  - id: php-variable-command-webshell
  - id: metadata/package/testing/presence/harness::test-directory-path
  - id: metadata/file/extension/identity::markdown-file-basename
  - id: well-known/tool/detection/security-scanner/
- id: php-webshell-corroborating-move
  desc: Corroborating concealment or egress move
  crit: notable
  conf: 0.95
  mbc: B0030
  attack: T1505.003
  any:
  - id: micro-behaviors/process/interpreter/reflection/dispatch::php-callback-dispatch
  - id: micro-behaviors/process/interpreter/reflection/function::php-reflection-function
  - id: micro-behaviors/communications/socket/connect::fsockopen-call
  - id: micro-behaviors/fs/attributes/chattr::chattr-immutable

# Request input reaching exec()/system()/shell_exec() or eval() with no
# intervening validation is the defining move of a command webshell. The
# matcher is a direct taint shape, not an obfuscated dispatch, so it lives
# beside the other exec-facing webshell composites.
- id: php-dynamic-user-input-backdoor
  desc: PHP backdoor directly executes request input
  crit: suspicious
  conf: 0.99
  mbc: B0030
  attack: T1505.003
  any:
  - id: micro-behaviors/process/create/shell/lang::exec-user-input
  - id: objectives/execution/interpreter/eval/remote::eval-user-input
  unless:
  - id: well-known/tool/offensive/nmap::nmap-source-tree

- id: php-command-panel
  desc: PHP command webshell includes an authentication panel
  crit: hostile
  conf: 0.99
  mbc: B0030
  attack: T1505.003
  all:
  - id: php-command-webshell
  - id: micro-behaviors/ui/window/password-field::php-password-input-element

