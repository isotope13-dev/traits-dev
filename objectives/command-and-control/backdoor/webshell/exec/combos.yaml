# Python analogue of `php-command-webshell`: a route handler in the same file
# as a request accessor read straight into a process/shell sink. The sink
# trait carries the taint shape; the framework leg confirms the value is
# operator-reachable over HTTP rather than a local CLI argument.
- id: python-command-webshell
  desc: Python request directly executes a shell command
  crit: hostile
  conf: 0.99
  for:
  - python
  mbc: B0030
  attack: T1505.003,T1059.006
  all:
  - id: python-request-process-execution
  - id: micro-behaviors/communications/http/server/framework::server-python
  unless:
  - id: metadata/package/testing/presence/harness::test-directory-path

# Ruby analogue of `php-command-webshell`: an HTTP command parameter served
# over an accepted TCPServer connection and executed through IO.popen. The
# socket-parsed request has no framework accessor, so the command-field query
# plus the popen sink plus the accepting server together establish the
# operator-reachable taint shape.
- id: ruby-command-webshell
  desc: Ruby HTTP server executes request command via command pipe
  crit: hostile
  conf: 0.97
  for:
  - ruby
  mbc: B0030
  attack: T1505.003
  all:
  - id: micro-behaviors/communications/http/query::ruby-http-cmd-query
  - id: micro-behaviors/process/create/shell/lang::ruby-io-popen-interpolated
  - id: micro-behaviors/communications/socket/listen::ruby-tcp-server-accept-call
  unless:
  - id: metadata/package/testing/presence/harness::test-directory-path
