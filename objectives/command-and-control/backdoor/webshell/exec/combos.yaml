defaults:
  platforms:
  - windows
  - unix
  for:
  - php
composite_rules:
- id: php-explicit-infection-command-include-webshell
  desc: PHP command/include backdoor with infection banner
  crit: hostile
  conf: 0.99
  mbc: B0030
  attack: T1505.003
  all:
  - id: micro-behaviors/process/create/shell/command-string::exec-user-input-post--g1
  - id: objectives/execution/exploit/include-gadget::direct-request-include
  - id: objectives/command-and-control/backdoor/webshell/self-label::infection-banner
- id: php-memory-webshell
  desc: 'PHP memory webshell: self-delete + remote eval'
  crit: hostile
  conf: 0.99
  mbc: B0030
  attack: T1505.003
  all:
  - id: objectives/evasion/self-delete/file/script::script-self-delete
  - id: micro-behaviors/process/interpreter/eval/direct::eval-call
  any:
  - id: micro-behaviors/process/control/signal::ignore-user-abort
  - id: micro-behaviors/process/resources/limits::set-time-limit
  - id: micro-behaviors/fs/read/file/full::file-get-contents
  - id: micro-behaviors/process/interpreter/eval/direct::error-suppressed-eval
  needs: 2
  unless:
  - id: metadata/package/testing/presence/path::gherkin-feature-file
- id: php-backdoor
  desc: PHP request execution with host-derived log path
  crit: hostile
  conf: 0.95
  mbc: B0030
  attack: T1505.003
  all:
  - id: micro-behaviors/fs/path/temp::php-host-derived-log-path
  - id: micro-behaviors/communications/http/request
  any:
  - id: objectives/execution/interpreter/eval/remote::eval-user-input
  - id: micro-behaviors/process/create/shell/command-string::exec-user-input
  - id: micro-behaviors/process/create/shell/lang::php-request-assigned-command-branch
  unless:
  - id: metadata/package/testing/presence/path::gherkin-feature-file
  - id: well-known/app/publishing/wordpress-plugins/site-admin::wordpress-maintenance-plugin
- id: php-indirect-request-pipe-process-webshell
  desc: PHP request assignment with pipe-process execution
  crit: hostile
  conf: 0.97
  mbc: B0030
  attack: T1505.003,T1059
  all:
  - id: micro-behaviors/communications/http/request/superglobal::request-param-assignment
  - id: micro-behaviors/process/create/subprocess::proc-open-variable-argument
  any:
  - id: micro-behaviors/process/interpreter/reflection/dispatch::php-callback-dispatch
  - id: micro-behaviors/metaprogramming/reflection::php-reflection-function
  - id: micro-behaviors/communications/socket/connect::fsockopen-call
  - id: micro-behaviors/fs/attributes/chattr::chattr-immutable
  near_bytes: 1024
  unless:
  - id: objectives/command-and-control/backdoor/webshell/request/command::php-variable-command-webshell
  - id: metadata/path::test-directory-component
  - id: metadata/file/extension/identity::markdown-file-basename
  - id: well-known/tool/detection/security-scanner/
- id: php-dynamic-user-input-backdoor
  desc: PHP backdoor directly executes request input
  crit: suspicious
  conf: 0.99
  mbc: B0030
  attack: T1505.003
  any:
  - id: micro-behaviors/process/create/shell/command-string::exec-user-input
  - id: objectives/execution/interpreter/eval/remote::eval-user-input
  unless:
  - id: metadata/package/documentation/security-catalog::quoted-command-reference-contexts
  - id: micro-behaviors/ui/help::escaped-local-command-reference
  - id: well-known/tool/offensive/nmap::nmap-source-tree
  downgrade:
    scope: parent
    any:
    - id: micro-behaviors/ui/help::escaped-local-command-reference
- id: php-command-panel
  desc: PHP command webshell includes an authentication panel
  crit: hostile
  conf: 0.99
  mbc: B0030
  attack: T1505.003
  all:
  - id: objectives/command-and-control/backdoor/webshell/request/command::php-command-webshell
  - id: micro-behaviors/ui/controls/credential::php-password-input-element
- id: php-remote-code-forwarder
  desc: PHP forwards request code through an outbound HTTP request
  crit: hostile
  conf: 0.99
  mbc: B0030
  attack: T1505.003,T1059.004
  all:
  - id: micro-behaviors/communications/http/request/superglobal::php-code-request-parameter
  - id: micro-behaviors/communications/http/request/superglobal::post-dup
  - id: micro-behaviors/data/encode/url::http-build-query-call
  any:
  - id: micro-behaviors/communications/http/request/wordpress/
  - id: micro-behaviors/communications/http/curl/
  near_bytes: 1024
- id: php-remote-code-fleet-stager
  desc: PHP stages request-supplied code across a shell fleet
  crit: hostile
  conf: 0.99
  mbc: B0030
  attack: T1505.003,T1059.004
  all:
  - id: php-remote-code-forwarder
  - id: micro-behaviors/data/property/assign::php-indexed-backdoor-record
- id: php-backtick-rce
  desc: 'PHP webshell: backtick RCE from user input'
  crit: suspicious
  conf: 0.98
  mbc: E1059
  attack: T1059.004
  all:
  - id: micro-behaviors/process/create/shell/lang::backtick
  - id: micro-behaviors/communications/http/request
  any:
  - id: micro-behaviors/communications/http/request/form-input/
  - id: objectives/command-and-control/backdoor/webshell/session/
  unless:
  - id: metadata/package/testing/presence/path::gherkin-feature-file
  - id: metadata/package/testing/presence/fixture::php-test-file
  - id: well-known/tool/development/testing/symfony-phpunit-bridge::symfony-phpunit-bridge-package
  - id: well-known/app/publishing/matomo/
  - id: well-known/app/system/zealphp/
  - id: well-known/app/enterprise/egroupware/
  - id: well-known/tool/sysadmin/munin/
  - id: well-known/app/publishing/wordpress-plugins/
  - id: metadata/file/magic/identity::php-archive
- id: php-full-webshell
  desc: Full-featured PHP webshell
  crit: suspicious
  conf: 0.98
  mbc: B0030
  attack: T1505.003
  all:
  - id: micro-behaviors/process/create/shell/
  - id: micro-behaviors/communications/http/request
  - id: micro-behaviors/fs/write
  - id: objectives/command-and-control/backdoor/webshell/account/
  - id: objectives/command-and-control/backdoor/webshell/archive/
  - id: objectives/command-and-control/backdoor/webshell/auth/
  - id: objectives/command-and-control/backdoor/webshell/channel/
  - id: objectives/command-and-control/backdoor/webshell/cleanup/
  - id: objectives/command-and-control/backdoor/webshell/client/
  - id: objectives/command-and-control/backdoor/webshell/config/
  - id: objectives/command-and-control/backdoor/webshell/db-tunnel/
  - id: objectives/command-and-control/backdoor/webshell/decoder/
  - id: objectives/command-and-control/backdoor/webshell/deny/
  - id: objectives/command-and-control/backdoor/webshell/embedded/
  - id: objectives/command-and-control/backdoor/webshell/fetch/
  - id: objectives/command-and-control/backdoor/webshell/file-manager/
  - id: objectives/command-and-control/backdoor/webshell/hide/
  - id: objectives/command-and-control/backdoor/webshell/intercept/
  - id: objectives/command-and-control/backdoor/webshell/keywords/
  - id: objectives/command-and-control/backdoor/webshell/obf-dispatch/
  - id: objectives/command-and-control/backdoor/webshell/path/
  - id: objectives/command-and-control/backdoor/webshell/recon/
  - id: objectives/command-and-control/backdoor/webshell/relay/
  - id: objectives/command-and-control/backdoor/webshell/request/
  - id: objectives/command-and-control/backdoor/webshell/self-label/
  - id: metadata/lang/natural/vocabulary/content-word::en-rootkit-meterpreter-term
  - id: metadata/lang/natural/vocabulary/content-word::en-shell-backdoor-term
  - id: objectives/command-and-control/backdoor/webshell/session/
  - id: objectives/command-and-control/backdoor/webshell/stager/
  - id: objectives/command-and-control/backdoor/webshell/ui/
  - id: objectives/command-and-control/backdoor/webshell/upload/
  unless:
  - id: metadata/package/testing/presence/path::gherkin-feature-file
  - id: metadata/package/testing/presence/fixture::php-test-file
  - id: well-known/app/system/zealphp
  - id: well-known/app/enterprise/egroupware/
  - id: well-known/tool/sysadmin/munin/
  - id: well-known/app/publishing/wordpress-plugins/
  - id: metadata/file/magic/identity::php-archive
  - id: well-known/tool/development/testing/symfony-phpunit-bridge::symfony-phpunit-bridge-package
- id: python-command-webshell
  desc: Python request directly executes a shell command
  crit: hostile
  conf: 0.99
  for:
  - python
  mbc: B0030
  attack: T1505.003,T1059.006
  all:
  - id: python-request-process-execution
  - id: micro-behaviors/communications/http/server/framework::server-python
  unless:
  - id: metadata/path::test-directory-component
- id: ruby-command-webshell
  desc: Ruby HTTP server executes request command via command pipe
  crit: hostile
  conf: 0.97
  for:
  - ruby
  mbc: B0030
  attack: T1505.003
  all:
  - id: micro-behaviors/communications/http/query::ruby-http-cmd-query
  - id: micro-behaviors/process/create/shell/lang::ruby-io-popen-interpolated
  - id: micro-behaviors/communications/socket/listen::ruby-tcp-server-accept-call
  unless:
  - id: metadata/path::test-directory-component
