---
defaults:
  platforms:
  - windows
  - unix
  for:
  - java
  - class
  mbc: B0030
  attack: T1505.003
traits:
- id: jsp-cat-download-shell-methods
  desc: Java webshell toolkit methods
  crit: suspicious
  conf: 0.9
  if:
    type: text
    regex: "(?s)String\\s+cat\\(.{0,320}void\\s+download\\(.{0,320}void\\s+shell\\("
composite_rules:
# `java-socket-create` (type: text, source) and `java-fileinputstream-class`
# (type: import, bytecode) can never both match the same node -- a .java file
# never has bytecode-only facts (imports) and a .class file never has
# source-only facts (symbol/text matches). Split into source/bytecode
# variants joined by `any:`, matching the `java-classloader-dropper` pattern
# in objectives/anti-static/obfuscation/reflection/class/java.yaml.
- id: jsp-post-exploitation-toolkit-source
  desc: JSP post-exploitation toolkit (source)
  crit: suspicious
  conf: 0.98
  for: [java]
  all:
  - id: micro-behaviors/process/create/spawn::java-runtime-exec-source
  - id: micro-behaviors/communications/socket/create::java-socket-create
  - id: micro-behaviors/fs/read/file/handle::java-source-fileinputstream-use
  - id: micro-behaviors/communications/http/lib/httpclient::java-url-openconnection
  - id: jsp-cat-download-shell-methods
- id: jsp-post-exploitation-toolkit-bytecode
  desc: JSP post-exploitation toolkit (bytecode)
  crit: suspicious
  conf: 0.98
  for: [class]
  all:
  - id: micro-behaviors/process/create/spawn::java-runtime-exec-source
  - id: micro-behaviors/communications/socket/create::java-socket-class-import
  - id: micro-behaviors/fs/read/file/handle::java-fileinputstream-class
  - id: micro-behaviors/communications/http/lib/httpclient::java-url-constructor-bytecode
  - id: jsp-cat-download-shell-methods
- id: jsp-post-exploitation-toolkit
  desc: JSP post-exploitation toolkit
  crit: suspicious
  conf: 0.98
  any:
  - id: jsp-post-exploitation-toolkit-source
  - id: jsp-post-exploitation-toolkit-bytecode
