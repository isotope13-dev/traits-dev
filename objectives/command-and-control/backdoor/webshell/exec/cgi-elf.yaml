# Compiled CGI command shells: QUERY_STRING plus popen, often with an
# ISINDEX "Command to Execute" HTML prompt or a CGI Backdoor self-label.
defaults:
  platforms: [unix]
  for: [elf]
  mbc: B0030
  attack: T1505.003
traits:
  - id: isindex-command-prompt
    desc: ISINDEX prompt for command execution
    crit: suspicious
    conf: 0.96
    if:
      type: text
      regex: '(?i)ISINDEX.{0,48}Command to Execute'
  - id: cgi-backdoor-self-label
    desc: Self-labels as a CGI backdoor
    crit: suspicious
    conf: 0.95
    if:
      type: text
      regex: '(?i)CGI Backdoor'
composite_rules:
  - id: cgi-query-popen-shell
    desc: CGI QUERY_STRING piped through popen
    crit: hostile
    conf: 0.97
    all:
      - id: micro-behaviors/communications/http/request/cgi::query-string-binary
      - id: micro-behaviors/process/create/popen::c-popen
    any:
      - id: isindex-command-prompt
      - id: cgi-backdoor-self-label
  - id: cgi-isindex-popen-shell
    desc: ISINDEX CGI prompt piped through popen
    crit: hostile
    conf: 0.96
    all:
      - id: isindex-command-prompt
      - id: micro-behaviors/process/create/popen::c-popen
  - id: cgi-backdoor-query-shell
    desc: CGI backdoor reads QUERY_STRING
    crit: hostile
    conf: 0.95
    all:
      - id: cgi-backdoor-self-label
      - id: micro-behaviors/communications/http/request/cgi::query-string-binary
