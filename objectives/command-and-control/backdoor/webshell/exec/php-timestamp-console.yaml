defaults:
  crit: hostile
  platforms: [unix, windows]
  for: [php]
  attack: T1505.003
  mbc: B0030

composite_rules:
  # Require concealment-oriented file controls, encoded file dispatch and
  # disabled audit configuration in addition to remote execution capabilities.
  # These are file-scoped implementation profiles; they do not assert a bound
  # request-to-process data flow or an authentication bypass.
  - id: php-encoded-timestamp-shell-console
    desc: PHP fallback shell console with timestamp concealment
    conf: 0.97
    all:
      - id: micro-behaviors/communications/http/request/superglobal::post-dup
      - id: micro-behaviors/metaprogramming/reflection::php-encoded-file-write-dispatch-profile
      - id: micro-behaviors/fs/file/timestamp::php-dispatched-mtime-copy-profile
      - id: micro-behaviors/os/telemetry/logging/configure::php-log-config-disabled
      - id: micro-behaviors/process/create/shell/lang::php-loop-execution-availability-probe
      - id: micro-behaviors/process/create/subprocess::proc-open-variable-argument
      - id: micro-behaviors/process/create/shell/lang::exec-variable-argument-exec
