# Command shell configuration consumed by the MemShellParty bytecode builder.
# These options describe generated payload behavior, not execution by this class.
defaults:
  platforms: [unix, windows]
  for: [java]
  attack: T1505.003
  mbc: B0030

traits:
  - id: java-command-shell-config-class
    desc: Java config extends shell tool settings
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: 'class\s+CommandConfig\s+extends\s+ShellToolConfig'

  - id: java-command-shell-config-process-modes
    desc: Offers two process execution modes
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: 'RuntimeExec\s*,\s*ForkAndExec'

  - id: java-command-shell-config-command-template
    desc: Supports command template substitution
    crit: notable
    conf: 0.9
    if:
      type: text
      substr: '{command}'

composite_rules:
  - id: java-command-shell-generator-config
    desc: Configures generated command webshell behavior
    crit: suspicious
    conf: 0.96
    all:
      - id: java-command-shell-config-class
      - id: java-command-shell-config-process-modes
      - id: java-command-shell-config-command-template
