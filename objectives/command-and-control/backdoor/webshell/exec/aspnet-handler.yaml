# Request access and variable-valued stdin writes must accompany an actual
# cmd.exe child in an IHttpHandler. No parameter name or handler class is fixed.
# These are bounded co-occurring operations; source analysis must still confirm
# which request value the stdin variable represents. This remains suspicious
# because fixed diagnostic commands can use a similar handler structure.
defaults:
  platforms: [windows]
  for: [asp]
  attack: T1505.003,T1059.003
composite_rules:
  - id: aspnet-request-cmd-stdin-handler
    desc: ASP.NET request handler writes cmd stdin
    crit: suspicious
    conf: 0.96
    near_bytes: 1536
    all:
      - id: metadata/lang/source/syntax::aspnet-webhandler-directive
      - id: micro-behaviors/communications/http/server/managed::aspnet-request-indexer-access
      - id: micro-behaviors/process/create/shell/spawn::aspnet-startinfo-cmd-exe
      - id: micro-behaviors/process/create/subprocess::dotnet-source-process-instance-start
      - id: micro-behaviors/process/io/stream::aspnet-standard-input-redirection
      - id: micro-behaviors/process/io/stream::aspnet-process-stdin-variable-write
