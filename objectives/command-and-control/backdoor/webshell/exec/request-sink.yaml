# Direct request-to-process taint shapes used by command webshell composites.
# These are execution sinks under remote operator control, so they belong with
# webshell command-and-control rather than generic interpreter execution.
defaults:
  crit: notable
  conf: 0.99
  platforms: [unix, windows]
  for: [markdown, php, html, csharp, java, python]
  attack: T1505.003
  mbc: B0024

traits:
  - id: php-request-shell-execution
    desc: PHP request parameter passed to shell execution
    for: [markdown, php]
    if:
      type: text
      regex: '(?is)\b(system|exec)\s*\(\s*\$_(GET|POST|REQUEST)\s*\['

  - id: php-request-shell-execution-alt
    desc: PHP request passed to alternate shell function
    for: [markdown, php]
    if:
      type: text
      regex: '(?is)\b(shell_exec|passthru)\s*\(\s*\$_(GET|POST|REQUEST)\s*\['

  - id: aspx-request-process-execution
    desc: ASPX request passed to process creation
    for: [markdown, csharp]
    if:
      type: text
      regex: '(?is)\bProcess\.Start\s*\([^\n]{0,240}\bRequest\s*\[.{0,40}\]'

  - id: jsp-request-process-execution
    desc: JSP request parameter passed to Runtime.exec
    for: [markdown, java]
    if:
      type: text
      regex: '(?is)Runtime\.getRuntime\s*\(\s*\)\.exec\s*\(\s*request\.getParameter\s*\('

  # The Python half of the same shape: a WSGI/ASGI request accessor (Flask,
  # Django, FastAPI/Starlette, Bottle, Tornado) read straight into a process
  # or shell sink as its first argument, matching the PHP/ASPX/JSP siblings
  # above. Demanding the accessor at the call site is what separates a
  # webshell from an application that merely owns both a route and a
  # subprocess call -- the latter is every CI service and every
  # deliberately-vulnerable IAST fixture.
  - id: python-request-process-execution
    desc: Python request value passed to process execution
    for: [markdown, python]
    if:
      type: text
      regex: '(?i)\b(system|popen|run|call|check_output)\(\s*request\.(args|form|GET|POST|json)\b'

