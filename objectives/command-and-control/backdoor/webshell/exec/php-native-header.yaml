# Native PHP source can add a request-header eval sink beneath an otherwise
# ordinary extension routine.  The misspelled header and vendor-marker gate
# are the distinctive parts of this 2021 PHP supply-chain backdoor.
defaults:
  platforms: [unix, windows]
  for: [text, c, cpp]
  attack: T1505.003,T1059.006

traits:
  - id: php-native-typo-header
    desc: Native PHP reads typoed user-agent header
    crit: notable
    conf: 0.99
    if:
      type: text
      substr: HTTP_USER_AGENTT
  - id: php-native-zend-eval
    desc: Native PHP source calls zend eval
    crit: suspicious
    conf: 0.99
    if:
      type: text
      regex: '\bzend_eval_string\s*\('
  - id: php-native-zerodium-gate
    desc: Native PHP gates execution on zerodium
    crit: suspicious
    conf: 0.99
    if:
      type: text
      substr: zerodium

composite_rules:
  - id: php-native-header-eval-backdoor
    desc: PHP native source adds header eval backdoor
    crit: hostile
    conf: 0.995
    all:
      - id: php-native-typo-header
      - id: php-native-zend-eval
      - id: php-native-zerodium-gate
