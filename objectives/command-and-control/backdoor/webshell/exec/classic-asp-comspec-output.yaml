# Classic ASP page runs `%COMSPEC% /c <request input>` through WScript.Shell
# Exec and writes StdOut.ReadAll back into the response.
defaults:
  platforms: [windows]
  for: [asp]
  attack: T1505.003,T1059.003
  mbc: B0030

composite_rules:
  - id: classic-asp-request-comspec-output-shell
    desc: ASP runs request commands and returns output
    crit: hostile
    conf: 0.96
    all:
      - id: micro-behaviors/communications/http/request/superglobal::classic-asp-request-field
      - id: objectives/command-and-control/remote-command/shell::asp-wsh-exec-variable
      - id: objectives/command-and-control/remote-command/shell::asp-wsh-stdout-readall
      - id: micro-behaviors/process/create/shell/command-mode::comspec-c-command-text
