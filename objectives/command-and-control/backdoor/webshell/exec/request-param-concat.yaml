# The request parameter concatenated straight into the command string.
#
#   Process p = Runtime.getRuntime().exec("cmd /c " + req.getParameter("cmd"));
#
# The servlet composite next door already pairs "reads a parameter" with "runs
# a process", which is the right shape for a webshell but also the shape of a
# build server or an admin console -- it cannot see whether anything checks
# who is asking. This is narrower: the text the caller supplied *is* the
# command line, with a shell prefix glued on in the same expression. No
# application passes unvalidated request input to a shell on purpose, and
# there is nowhere in that expression for an authorisation check to live.
defaults:
  platforms: [unix, windows]
  for: [java, class, html]
  attack: T1505.003,T1059
  mbc: B0030

traits:
  - id: exec-arg-concatenates-request-parameter
    desc: exec argument concatenates a request parameter
    crit: suspicious
    conf: 0.97
    if:
      type: text
      regex: 'exec\(\s*"[^"]{0,40}"\s*\+\s*[\w.]{0,24}getParameter'

composite_rules:
  - id: servlet-exec-of-request-parameter
    desc: Servlet runs a command built from request input
    crit: hostile
    conf: 0.98
    all:
      - id: exec-arg-concatenates-request-parameter
      - id: micro-behaviors/process/create/spawn::java-runtime-exec-source
    unless:
      - id: well-known/tool/offensive/
