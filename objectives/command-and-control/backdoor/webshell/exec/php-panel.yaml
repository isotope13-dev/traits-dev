---
defaults:
  platforms:
  - windows
  - unix
  for:
  - php
  mbc: B0030
  attack: T1505.003
traits:
- id: sqlserver-xp-cmdshell-invocation
  desc: SQL Server xp_cmdshell execution
  crit: suspicious
  conf: 0.94
  attack: T1059
  if:
    type: text
    regex: '(?i)\bexec(ute)?\s+xp_cmdshell\b'
  unless:
  - id: metadata/lang/source::yara-rule-source
  - id: metadata/package/testing/presence/fixture::test-declaration-call
  - id: well-known/tool/detection/security-scanner::anteumbra-package-tree-member
- id: sqlserver-xp-execresultset-invocation
  desc: SQL Server xp_execresultset execution
  crit: suspicious
  conf: 0.94
  attack: T1059
  if:
    type: text
    regex: '(?i)\bexec(ute)?\s+xp_execresultset\b'
  unless:
  - id: metadata/lang/source::yara-rule-source
  - id: well-known/tool/detection/security-scanner::anteumbra-package-tree-member
- id: sqlserver-xp-regenumkeys-invocation
  desc: SQL Server xp_regenumkeys execution
  crit: suspicious
  conf: 0.94
  attack: T1059
  if:
    type: text
    regex: '(?i)\bexec(ute)?\s+xp_regenumkeys\b'
  unless:
  - id: metadata/lang/source::yara-rule-source
  - id: well-known/tool/detection/security-scanner::anteumbra-package-tree-member
- id: sqlserver-xp-filelist-invocation
  desc: SQL Server xp_filelist execution
  crit: suspicious
  conf: 0.94
  attack: T1059
  if:
    type: text
    regex: '(?i)\bexec(ute)?\s+xp_filelist\b'
  unless:
  - id: metadata/lang/source::yara-rule-source
  - id: well-known/tool/detection/security-scanner::anteumbra-package-tree-member
- id: php-assert-get-post
  desc: PHP assert over GET or POST
  crit: notable
  conf: 0.92
  if:
    type: text
    regex: 'assert\s*\(\s*\$_(GET|POST)\b'
- id: php-assert-request-cookie
  desc: PHP assert over REQUEST or COOKIE
  crit: notable
  conf: 0.92
  if:
    type: text
    # Classic assert($_REQUEST/COOKIE) webshell sink; plain assert($cond, $msg)
    # invariant checks are not code execution.
    regex: 'assert\s*\(\s*\$_(REQUEST|COOKIE)\b'

composite_rules:
- id: sqlserver-xp-command-shell
  desc: SQL Server extended procedure invocation
  crit: suspicious
  conf: 0.94
  any:
  - id: sqlserver-xp-cmdshell-invocation
  - id: sqlserver-xp-execresultset-invocation
  - id: sqlserver-xp-regenumkeys-invocation
  - id: sqlserver-xp-filelist-invocation
- id: php-user-request-parameter
  desc: PHP reads caller-supplied request parameters
  crit: component
  conf: 0.9
  any:
  - id: micro-behaviors/communications/http/request/params::get-dup
  - id: micro-behaviors/communications/http/request/params::post-dup
  - id: micro-behaviors/communications/http/request/params::request-dup
- id: dangerous-php-function-cluster
  desc: PHP caller input paired with dynamic execution or probing
  crit: suspicious
  conf: 0.92
  all:
  - id: micro-behaviors/process/interpreter/eval::eval-symbol
  - id: php-user-request-parameter
  any:
  - id: micro-behaviors/process/interpreter/eval::eval-user-input
  - id: php-assert-get-post
  - id: php-assert-request-cookie
  - id: micro-behaviors/fs/file/read::php-show-source
  - id: micro-behaviors/process/create/shell/spawn::php-exec
  - id: micro-behaviors/process/create/shell/lang::proc-open
  - id: micro-behaviors/process/create/shell/lang::popen
  - id: micro-behaviors/process/create/shell/spawn::php-shell-exec
  needs: 1
  unless:
  - id: well-known/app/publishing/matomo/
  - id: well-known/lib/crypto/phpseclib/
  - id: well-known/lib/web/symfony::package-doc
  - id: micro-behaviors/process/create/shell/spawn::php-shell-argument-escaping
  - id: well-known/tool/detection/security-scanner::php-threat-scanner-context
