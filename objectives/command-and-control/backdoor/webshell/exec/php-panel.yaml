---
defaults:
  platforms:
  - windows
  - unix
  for:
  - php
  mbc: B0030
  attack: T1505.003
traits:
- id: php-assert-get-post
  desc: PHP assert over GET or POST
  crit: notable
  conf: 0.92
  if:
    type: text
    regex: 'assert\s*\(\s*\$_(GET|POST)\b'
- id: php-assert-request-cookie
  desc: PHP assert over REQUEST or COOKIE
  crit: notable
  conf: 0.92
  if:
    type: text
    # Classic assert($_REQUEST/COOKIE) webshell sink; plain assert($cond, $msg)
    # invariant checks are not code execution.
    regex: 'assert\s*\(\s*\$_(REQUEST|COOKIE)\b'
- id: php-error-suppressed-assert-exec
  desc: Error-suppressed PHP assert code execution
  crit: suspicious
  conf: 0.95
  attack: T1059.001
  # `@assert(<expr>)` — in PHP < 8 assert() runs a string/expression argument
  # as code, and the `@` error-suppression is the webshell tell: legitimate
  # invariant checks are never error-suppressed. Requiring the argument to
  # begin with an identifier, variable, or call (`\`, `$`, or a letter — e.g.
  # `wp_get_referer()`, `base64_decode(...)`, `$_COOKIE[...]`) excludes the
  # rare `@assert($ok)` boolean-suppression while catching the assert-as-eval
  # backdoor whose source is a request-returning helper, not a raw superglobal
  # the plain assert atoms above already cover.
  if:
    type: text
    regex: '@\s*assert\s*\(\s*[A-Za-z_$\\]'
  unless:
  - id: metadata/package/testing/harness/unit/
  - id: well-known/lib/runtime/scripted/php-runtime::source-tree
- id: php-rot13-reversed-request-eval
  desc: Reversed ROT13 request eval in Base64
  crit: suspicious
  conf: 0.99
  if:
    type: encoded
    encoding: base64
    substr: ";)]'1c'[GFBC_$(ynir"
  unless:
  - id: well-known/tool/detection/

- id: php-assert-string-literal
  desc: Assigns the assert function name
  crit: notable
  conf: 0.9
  if:
    type: text
    regex: '=\s*[''"]assert[''"]'

- id: php-indexed-post-call
  desc: Calls an indexed callback with POST data
  crit: suspicious
  conf: 0.94
  if:
    type: text
    regex: '\]\s*\(\s*\$_POST\s*\['

- id: php-array-index-callback
  desc: Calls a callback stored in an array
  crit: notable
  conf: 0.9
  if:
    type: text
    regex: '\$\w+\[\d+\]\[[^\]]{1,32}\]\s*\('

- id: php-sql-into-outfile
  desc: SQL writes a file via INTO OUTFILE
  crit: suspicious
  conf: 0.95
  if:
    type: text
    regex: '(?i)INTO\s+OUTFILE\b'
  unless:
  - id: well-known/tool/offensive/nmap::nmap-source-tree

- id: php-system-get-param
  desc: system() runs a GET parameter
  crit: suspicious
  conf: 0.95
  if:
    type: text
    regex: 'system\s*\(\s*\\?\$_GET\s*\['
  unless:
  - id: well-known/tool/offensive/nmap::nmap-source-tree
  - id: metadata/file/extension/identity::markdown-file-basename

- id: php-union-select-php-payload
  desc: UNION SELECT plants a PHP payload
  crit: notable
  conf: 0.96
  if:
    type: text
    regex: '(?i)UNION\s+SELECT.{0,80}<\?'

composite_rules:
- id: php-assert-indexed-post-webshell
  desc: Assert callback runs POST input
  crit: hostile
  conf: 0.97
  all:
  - id: php-assert-string-literal
  - id: php-indexed-post-call
- id: php-assert-array-callback
  desc: Assert stored in an array callback
  crit: hostile
  conf: 0.96
  all:
  - id: php-assert-string-literal
  - id: php-array-index-callback
- id: php-array-post-callback
  desc: Array callback runs POST input
  crit: hostile
  conf: 0.96
  all:
  - id: php-array-index-callback
  - id: php-indexed-post-call

- id: php-sql-outfile-system-shell
  desc: INTO OUTFILE drops a system GET shell
  crit: hostile
  conf: 0.97
  all:
  - id: php-sql-into-outfile
  - id: php-system-get-param
  unless:
  - id: well-known/tool/offensive/nmap::nmap-source-tree

- id: php-sql-outfile-union-shell
  desc: UNION SELECT writes a shell via OUTFILE
  crit: hostile
  conf: 0.96
  all:
  - id: php-sql-into-outfile
  - id: php-union-select-php-payload
  unless:
  - id: well-known/tool/offensive/nmap::nmap-source-tree

- id: php-union-system-get-shell
  desc: UNION SELECT plants a system GET shell
  crit: hostile
  conf: 0.96
  all:
  - id: php-union-select-php-payload
  - id: php-system-get-param
  unless:
  - id: well-known/tool/offensive/nmap::nmap-source-tree

- id: php-assert-server-header-webshell
  desc: PHP assert backdoor reads request headers
  crit: hostile
  conf: 0.96
  # A library may use assert() for a type check and read headers elsewhere;
  # the backdoor shape requires the two behaviors to be close together.
  near_lines: 20
  attack: T1505.003,T1059.006
  all:
  - id: objectives/execution/interpreter/php-assert::php-assert-call
  - id: objectives/execution/interpreter/php-assert::server-superglobal-read
  any:
  - id: micro-behaviors/communications/http/user-agent-routing/inbound::php-user-agent-read
  - id: micro-behaviors/communications/http/request/superglobal::request-dup
  - id: micro-behaviors/communications/http/request/superglobal::cookie

- id: php-packed-request-eval-webshell
  desc: Packed PHP webshell evaluates request code
  crit: hostile
  conf: 0.99
  all:
  - id: php-rot13-reversed-request-eval
  - id: micro-behaviors/process/interpreter/eval/direct::eval-call
  - id: micro-behaviors/process/interpreter/reflection/dispatch::dynamic-function-execution
- id: sqlserver-xp-command-shell
  desc: SQL Server extended procedure invocation
  crit: suspicious
  conf: 0.94
  any:
  - id: sqlserver-xp-cmdshell-invocation
  - id: sqlserver-xp-execresultset-invocation
  - id: sqlserver-xp-regenumkeys-invocation
  - id: sqlserver-xp-filelist-invocation
- id: php-user-request-parameter
  desc: PHP reads caller-supplied request parameters
  crit: component
  conf: 0.9
  any:
  - id: micro-behaviors/communications/http/request/superglobal::get-dup
  - id: micro-behaviors/communications/http/request/superglobal::post-dup
  - id: micro-behaviors/communications/http/request/superglobal::request-dup
- id: dangerous-php-function-cluster
  desc: PHP caller input paired with dynamic execution or probing
  crit: suspicious
  conf: 0.92
  # The three legs are each common alone (eval helpers, binary-presence
  # shell_exec probes, request handling); the webshell shape requires them
  # to be close together, not scattered across a large application file.
  near_lines: 120
  all:
  - id: micro-behaviors/process/interpreter/eval/direct::eval-call
  - id: php-user-request-parameter
  any:
  - id: objectives/execution/interpreter/eval/remote::eval-user-input
  - id: php-assert-get-post
  - id: php-assert-request-cookie
  - id: micro-behaviors/fs/read/file/full::php-show-source
  - id: micro-behaviors/process/create/shell/spawn::php-exec
  - id: micro-behaviors/process/create/shell/lang::proc-open
  - id: micro-behaviors/process/create/shell/lang::popen
  - id: micro-behaviors/process/create/shell/spawn::php-shell-exec
  needs: 1
  unless:
  - id: well-known/app/publishing/matomo/
  - id: well-known/lib/crypto/phpseclib/
  - id: well-known/lib/web/symfony::package-doc
  - id: micro-behaviors/process/create/shell/spawn::php-shell-argument-escaping
  - id: well-known/tool/detection/security-scanner/
