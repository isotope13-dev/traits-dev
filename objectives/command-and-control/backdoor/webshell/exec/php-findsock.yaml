# A PHP endpoint that passes its live HTTP client's tuple to the findsock
# helper attaches a shell to that request's socket.
defaults:
  crit: hostile
  conf: 0.97
  platforms: [unix]
  for: [php]
  attack: T1505.003
  mbc: B0030

traits:
  - id: php-system-launches-findsock
    desc: PHP system launches findsock helper
    crit: notable
    conf: 0.96
    if:
      type: text
      regex: 'system\s*\(\s*"\./findsock'

composite_rules:
  - id: php-findsock-http-shell
    desc: PHP attaches a shell to the requesting HTTP socket
    all:
      - id: micro-behaviors/process/create/shell/spawn::php-exec-client-addr-port-args
      - id: php-system-launches-findsock
