defaults:
  for: [perl]
  platforms: [unix, windows]
  mbc: B0030
  attack: T1505.003

composite_rules:
  # The query string is percent-decoded by hand and its first capture group is
  # handed to system(): an unauthenticated command endpoint, whatever address
  # filter wraps it. A loopback-only check does not make the sink benign, as
  # any local pivot or reverse proxy reaches it.
  - id: perl-cgi-decoded-query-system
    desc: Perl CGI decodes the query string into system()
    crit: hostile
    conf: 0.95
    near_lines: 6
    all:
      - id: micro-behaviors/data/decode/url::perl-percent-decode-substitution
      - id: micro-behaviors/communications/http/request/cgi::query-string-server-var
      - id: objectives/command-and-control/backdoor/webshell/request/command::perl-system-capture-group
    unless:
      - id: metadata/package/testing/presence/harness::perl-test-file
