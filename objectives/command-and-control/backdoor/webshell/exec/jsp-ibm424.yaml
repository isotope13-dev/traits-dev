# IBM or CP charset JSP pages that declare an evasive charset and carry
# direct or encoded Runtime.exec(request.getParameter) scriptlets.
defaults:
  platforms: [unix, windows]
  for: [jsp]
  attack: T1505.003
  mbc: B0030
composite_rules:
  - id: jsp-ibm424-charset-runtime-exec
    desc: IBM or EBCDIC page executes a request parameter
    crit: hostile
    conf: 0.99
    all:
      - id: metadata/lang/scripted::jsp-ibm424-charset-page
      - id: objectives/command-and-control/backdoor/webshell/request/command::jsp-ibm1026-runtime-request-exec
  - id: jsp-ibm-charset-direct-request-exec
    desc: IBM charset JSP executes request parameter
    crit: hostile
    conf: 0.99
    all:
      - id: metadata/lang/scripted::jsp-ibm424-charset-page
      - id: micro-behaviors/process/create/exec::runtime-exec-request-parameter
