# IBM424 (EBCDIC Hebrew) JSP pages that declare the charset and carry the
# encoded Runtime.exec(request.getParameter) scriptlet.
defaults:
  platforms: [unix, windows]
  for: [jsp]
  attack: T1505.003
  mbc: B0030
composite_rules:
  - id: jsp-ibm424-charset-runtime-exec
    desc: IBM424 page executes a request parameter
    crit: hostile
    conf: 0.99
    all:
      - id: metadata/lang/scripted::jsp-ibm424-charset-page
      - id: objectives/command-and-control/backdoor/webshell/request/command::jsp-ibm1026-runtime-request-exec
