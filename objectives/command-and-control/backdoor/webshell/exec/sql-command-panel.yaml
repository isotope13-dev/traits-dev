# SQL Server extended stored procedures reached from a web page.
#
# `xp_cmdshell` runs an OS command as the SQL Server service account, so a page
# that can call it is an OS-command execution surface no matter what language
# it is written in. These atoms previously sat in php-panel.yaml and inherited
# that file's `for: [php]` default, which left classic ASP -- historically the
# most common host for an MSSQL management shell -- entirely uncovered. The
# matchers are plain text and language-neutral, so the type list is too; ids are
# unchanged because trait ids come from the directory, not the filename.
defaults:
  platforms: [windows]
  for: [php, vbs, html, javascript, java, csharp]
  mbc: B0030
  attack: T1505.003

traits:
  - id: sqlserver-xp-cmdshell-invocation
    desc: SQL Server xp_cmdshell execution
    crit: suspicious
    conf: 0.94
    attack: T1059
    if:
      type: text
      regex: '(?i)\bexec(ute)?\s+(master\.\.)?xp_cmdshell\b'
    unless:
      - id: metadata/lang/source::yara-rule-source
      - id: metadata/package/testing/presence/fixture::test-declaration-call
      - id: well-known/tool/detection/security-scanner::anteumbra-package-tree-member

  - id: sqlserver-xp-execresultset-invocation
    desc: SQL Server xp_execresultset execution
    crit: suspicious
    conf: 0.94
    attack: T1059
    if:
      type: text
      regex: '(?i)\bexec(ute)?\s+xp_execresultset\b'
    unless:
      - id: metadata/lang/source::yara-rule-source
      - id: well-known/tool/detection/security-scanner::anteumbra-package-tree-member

  - id: sqlserver-xp-regenumkeys-invocation
    desc: SQL Server xp_regenumkeys execution
    crit: suspicious
    conf: 0.94
    attack: T1059
    if:
      type: text
      regex: '(?i)\bexec(ute)?\s+xp_regenumkeys\b'
    unless:
      - id: metadata/lang/source::yara-rule-source
      - id: well-known/tool/detection/security-scanner::anteumbra-package-tree-member

  - id: sqlserver-xp-filelist-invocation
    desc: SQL Server xp_filelist execution
    crit: suspicious
    conf: 0.94
    attack: T1059
    if:
      type: text
      regex: '(?i)\bexec(ute)?\s+xp_filelist\b'
    unless:
      - id: metadata/lang/source::yara-rule-source
      - id: well-known/tool/detection/security-scanner::anteumbra-package-tree-member

composite_rules:
  # The pairing is what makes it a shell rather than a DBA script: the page
  # takes caller-supplied request parameters *and* reaches xp_cmdshell, so
  # whoever can reach the URL runs commands as the SQL Server service account.
  # Deployment scripts and migration tooling call xp_cmdshell too, but they do
  # not read Request.Form / $_POST while doing it.
  - id: web-request-driven-xp-cmdshell
    desc: Web request page reaches xp_cmdshell
    crit: hostile
    conf: 0.96
    attack: T1505.003,T1059
    all:
      - id: sqlserver-xp-cmdshell-invocation
    any:
      - id: micro-behaviors/communications/http/request/params::classic-asp-request-field
      - id: objectives/command-and-control/backdoor/webshell/exec::php-user-request-parameter
    needs: 1
    unless:
      - id: metadata/lang/source::yara-rule-source
      - id: metadata/package/testing/presence/fixture::test-declaration-call
      - id: well-known/tool/detection/security-scanner::anteumbra-package-tree-member
