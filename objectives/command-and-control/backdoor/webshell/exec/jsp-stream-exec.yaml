defaults:
  platforms: [unix, windows]
  for: [jsp, java, class, html, javascript, python, vbs]
  attack: T1505.003
  mbc: B0030
composite_rules:
  - id: jsp-runtime-exec-response-stream
    for: [jsp]
    desc: JSP executes request command and streams output to response
    crit: hostile
    conf: 0.99
    all:
      - id: objectives/command-and-control/backdoor/webshell/request/command::jsp-request-cmd-local-exec
      - id: micro-behaviors/process/io/stream::jsp-input-stream-access-source
      - id: micro-behaviors/communications/http/response::jsp-response-print-syntax
    unless:
      - id: well-known/tool/offensive/
      - id: metadata/package/testing/presence/harness::test-fixture-directory
      - id: micro-behaviors/metaprogramming/generation::configured-assessment-plugin
