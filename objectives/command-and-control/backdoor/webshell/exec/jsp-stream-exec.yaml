defaults:
  platforms: [unix, windows]
  for: [jsp, java, class, html, javascript, python, vbs]
  attack: T1505.003
  mbc: B0030
composite_rules:
  - id: jsp-runtime-exec-response-stream
    for: [jsp]
    desc: JSP executes request command and streams output to response
    crit: hostile
    conf: 0.99
    all:
      - id: objectives/command-and-control/backdoor/webshell/request/parameter::jsp-request-cmd-local-exec
      - id: micro-behaviors/data/stream/read::jsp-input-stream-access-source
      - id: micro-behaviors/communications/http/response::jsp-response-print-syntax
    unless:
      - id: micro-behaviors/metaprogramming/generation/source::configured-assessment-plugin

  - id: jsp-processbuilder-response-stream
    for: [jsp, data]
    desc: JSP executes ProcessBuilder command and streams response
    crit: hostile
    conf: 0.99
    all:
      - id: objectives/command-and-control/backdoor/webshell/request/command::jsp-request-processbuilder-shell
      - id: micro-behaviors/data/stream/read::jsp-input-stream-access-source
      - id: micro-behaviors/communications/http/response::jsp-response-print-syntax
    unless:
      - id: micro-behaviors/metaprogramming/generation/source::configured-assessment-plugin

  - id: jsp-processbuilder-posix-shell-response-stream
    for: [jsp, data]
    desc: JSP runs POSIX shell via ProcessBuilder and streams output
    crit: hostile
    conf: 0.99
    all:
      - id: metadata/lang/source/language::jsp-server-page
      - id: metadata/lang/source/syntax/call/construction::java-processbuilder-source
      - id: micro-behaviors/process/create/subprocess/configure::java-posix-command-array-source
      - id: micro-behaviors/data/stream/read::jsp-input-stream-access-source
      - id: micro-behaviors/data/stream/transfer::java-input-stream-transfer-to
      - id: micro-behaviors/communications/http/response::jsp-response-print-syntax
    unless:
      - id: micro-behaviors/metaprogramming/generation/source::configured-assessment-plugin
