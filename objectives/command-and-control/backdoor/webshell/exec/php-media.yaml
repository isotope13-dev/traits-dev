defaults:
  platforms: [unix, windows]
  for: [media]
  attack: T1059.004,T1505.003
  mbc: B0024

composite_rules:
  - id: media-php-command-webshell
    desc: Media PHP command webshell
    crit: hostile
    conf: 0.99
    all:
      - id: micro-behaviors/data/embedded/payload/media::php-open-tag-in-media
      - id: micro-behaviors/data/embedded/payload/media::php-request-input-in-media
      - id: micro-behaviors/data/embedded/payload/media::php-command-exec-in-media
