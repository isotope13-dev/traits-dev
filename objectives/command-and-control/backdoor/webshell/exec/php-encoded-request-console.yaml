defaults:
  crit: hostile
  platforms: [unix, windows]
  for: [php]
  attack: T1505.003
  mbc: B0030

composite_rules:
  # tebink-style console: the command arrives as an encoded request field, is
  # decoded in PHP, and runs through whichever of proc_open/exec/shell_exec/
  # system/passthru survived disable_functions (probed from a name list, not
  # literal-quoted checks, so the classic availability atoms miss it).
  - id: php-encoded-request-fallback-console
    desc: Encoded-request command console with execution fallback
    conf: 0.98
    attack: T1505.003,T1059.004
    all:
      - id: micro-behaviors/communications/http/request/superglobal::post-dup
      - id: micro-behaviors/data/decode/base64::php-base64-decode-call
      - id: micro-behaviors/process/create/shell/lang::php-loop-execution-availability-probe
    any:
      - id: micro-behaviors/process/create/shell/lang::exec-variable-argument-exec
      - id: micro-behaviors/process/create/shell/lang::exec-variable-argument-system
      - id: micro-behaviors/process/create/shell/lang::exec-variable-argument-shell
      - id: micro-behaviors/process/create/shell/lang::exec-variable-argument-passthru
      - id: micro-behaviors/process/create/subprocess::proc-open-variable-argument
    needs: 2
    unless:
      - id: well-known/app/publishing/wordpress-plugins/catalog::known-wordpress-plugin
      - id: metadata/file/naming::test-directory-component
