defaults:
  for: [perl]
  platforms: [unix, windows]

traits:
  - id: system-base64-decoded-variable
    desc: Executes a Base64-decoded variable
    crit: notable
    conf: 0.96
    if:
      type: text
      regex: '(?i)\bsystem\s*\(\s*decode_base64\s*\(\s*\$[a-z_][a-z0-9_]*\s*\)\s*\)'

composite_rules:
  - id: perl-cgi-base64-command-webshell
    desc: CGI executes a Base64-encoded command
    crit: hostile
    conf: 0.98
    attack: T1505.003,T1059.006
    all:
      - id: micro-behaviors/communications/http/request/cgi::query-string-server-var
      - id: system-base64-decoded-variable
    unless:
      - id: metadata/package/testing/presence/harness::perl-test-file
