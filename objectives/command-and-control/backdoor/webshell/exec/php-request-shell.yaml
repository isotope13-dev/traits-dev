defaults:
  crit: hostile
  platforms: [windows, unix]
  for: [php]
  attack: T1505.003
  mbc: B0030

composite_rules:
  # The r57 / c99 / SnIpEr_SA family shape: probe which of shell_exec, system,
  # passthru, popen and proc_open survived the host's disable_functions, run the
  # winner on a request-supplied variable. Error control and buffer cleanup
  # alone do not establish stealth: b374k captures errors and then renders
  # them in its UI. Keep these neutral atoms as context for the console.
  - id: php-error-suppressed-fallback-console
    desc: PHP fallback console with disabled error reporting
    conf: 0.98
    attack: T1505.003,T1059
    all:
      - id: micro-behaviors/process/create/shell/lang::php-multiple-execution-availability-checks
      - id: micro-behaviors/data/control-flow/error-handling::error-reporting-off
      - id: micro-behaviors/process/io/buffer::ob-end-clean
      - id: micro-behaviors/communications/http/request/superglobal::request-param-assignment
    any:
      - id: micro-behaviors/process/create/shell/lang::php-variable-shell-command
      - id: micro-behaviors/process/create/subprocess::proc-open-variable-argument
    unless:
      - id: well-known/app/publishing/wordpress-plugins/catalog::known-wordpress-plugin
      - id: well-known/app/enterprise/egroupware/

  - id: php-authenticated-post-command-console
    desc: Authenticated PHP POST command console
    conf: 0.99
    attack: T1505.003,T1059.004
    all:
      - id: micro-behaviors/communications/http/request/superglobal::post-dup
      - id: micro-behaviors/communications/http/request/superglobal::php-post-password-field
      - id: micro-behaviors/process/create/shell/lang::php-multiple-execution-availability-checks
      - id: micro-behaviors/process/create/shell/lang::exec-variable-argument-shell

  # Encoded-channel webshell shape: POST input passes through Base64
  # decoding, is evaluated as PHP source from a variable, and is also run
  # as a shell command from a variable with a proc_open fallback. Either
  # sink alone is suspicious in an authenticated console; the
  # evaluated-code sink together with the shell-execution sink on the same
  # decoded request channel leaves no legitimate use. File-scoped on
  # purpose: consoles spread the channel, the sinks and the fallback probe
  # across distant handlers.
  - id: php-post-variable-eval-shell-console
    desc: PHP POST console with variable code and shell execution
    conf: 0.98
    attack: T1505.003,T1059
    all:
      - id: micro-behaviors/communications/http/request/superglobal::post-dup
      - id: micro-behaviors/data/decode/base64::php-base64-decode-call
      - id: micro-behaviors/process/interpreter/eval/direct::eval-variable-argument
    any:
      - id: micro-behaviors/process/create/shell/lang::php-variable-shell-command
      - id: micro-behaviors/process/create/subprocess::proc-open-variable-argument
    unless:
      - id: metadata/path::test-directory-component
      - id: metadata/file/extension/identity::markdown-file-basename
