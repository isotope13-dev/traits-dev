defaults:
  platforms: [windows, unix]
  for: [php]
  attack: T1505.003
  mbc: B0030

traits:
  - id: shell-fallback-chain
    desc: PHP shell execution fallback chain
    crit: suspicious
    conf: 0.97
    if:
      type: text
      regex: 'shell_exec\s*\([^)]{0,160}\)[\s\S]{0,180}\bsystem\s*\('

composite_rules:
  - id: php-request-command-webshell
    desc: PHP webshell executes request-assigned command
    crit: hostile
    conf: 0.99
    all:
      - id: micro-behaviors/communications/http/request/params::request-param-assignment
      - id: micro-behaviors/process/create/shell/lang::exec-variable-argument
    any:
      - id: micro-behaviors/process/create/shell/spawn::php-shell-exec
      - id: micro-behaviors/process/create/shell/lang::exec-variable-argument-system
    near_bytes: 512

  - id: php-request-shell-fallback-webshell
    desc: PHP webshell uses shell execution fallback
    crit: hostile
    conf: 0.99
    all:
      - id: micro-behaviors/communications/http/request/params::request-param-assignment
      - id: shell-fallback-chain
      - id: micro-behaviors/process/create/shell/lang::exec-variable-argument-system
    near_bytes: 512
