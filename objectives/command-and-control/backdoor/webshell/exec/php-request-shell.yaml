defaults:
  platforms: [windows, unix]
  for: [php]
  attack: T1505.003
  mbc: B0030

composite_rules:
  - id: php-request-command-webshell
    desc: PHP webshell executes request-assigned command
    crit: hostile
    conf: 0.99
    all:
      - id: micro-behaviors/communications/http/request/params::request-param-assignment
      - id: micro-behaviors/process/create/shell/lang::exec-variable-argument
    any:
      - id: micro-behaviors/process/create/shell/spawn::php-shell-exec
      - id: micro-behaviors/process/create/shell/lang::exec-variable-argument-system
    near_bytes: 512
    # PHP quoted inside a JVM test class is a static-analysis engine's own
    # corpus proving its cmdi query fires -- the snippet cannot execute there.
    unless:
      - id: metadata/package/testing/presence/jvm::jvm-test-suite-class-declaration
      # A semgrep rule ships the vulnerable code it hunts for as its own test
      # fixture, annotated `// ruleid:` / `// ok:`.
      - id: well-known/tool/detection/semgrep::rule-pack-fixture

  - id: php-request-shell-fallback-webshell
    desc: PHP webshell uses shell execution fallback
    crit: hostile
    conf: 0.99
    all:
      - id: micro-behaviors/communications/http/request/params::request-param-assignment
      # Require explicit availability probes for multiple execution APIs. A
      # bare shell_exec()/system() co-occurrence also appears in ordinary build
      # tooling and does not establish fallback behavior.
      - id: php-execution-fallback-chain
      - id: micro-behaviors/process/create/shell/lang::exec-variable-argument-system
    near_bytes: 512

  # The r57 / c99 / SnIpEr_SA family shape: probe which of shell_exec, system,
  # passthru, popen and proc_open survived the host's disable_functions, run the
  # winner on a request-supplied variable, and keep the page quiet by turning
  # error reporting off and clearing the output buffer. No application probes
  # its own execution primitives *and* silences the results to run caller input.
  - id: php-stealth-fallback-console
    desc: Stealthy PHP fallback command console
    crit: hostile
    conf: 0.98
    attack: T1505.003,T1059.004
    all:
      - id: objectives/command-and-control/backdoor/webshell/exec::php-execution-fallback-chain
      - id: objectives/command-and-control/backdoor/webshell/obf-dispatch::php-stealth-output-control
      - id: micro-behaviors/communications/http/request/params::request-param-assignment
      - id: micro-behaviors/process/create/shell/lang::exec-variable-argument

  - id: php-authenticated-post-command-console
    desc: Authenticated PHP POST command console
    crit: hostile
    conf: 0.99
    attack: T1505.003,T1059.004
    all:
      - id: micro-behaviors/communications/http/request/params::post-dup
      - id: micro-behaviors/communications/http/request/params::php-post-password-field
      - id: objectives/command-and-control/backdoor/webshell/exec::php-execution-fallback-chain
      - id: micro-behaviors/process/create/shell/lang::exec-variable-argument-shell
