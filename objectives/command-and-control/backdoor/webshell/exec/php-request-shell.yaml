defaults:
  crit: hostile
  platforms: [windows, unix]
  for: [php]
  attack: T1505.003
  mbc: B0030

composite_rules:
  # The r57 / c99 / SnIpEr_SA family shape: probe which of shell_exec, system,
  # passthru, popen and proc_open survived the host's disable_functions, run the
  # winner on a request-supplied variable, and keep the page quiet by turning
  # error reporting off and clearing the output buffer. No application probes
  # its own execution primitives *and* silences the results to run caller input.
  - id: php-stealth-fallback-console
    desc: Stealthy PHP fallback command console
    conf: 0.98
    attack: T1505.003,T1059.004
    all:
      - id: micro-behaviors/process/create/shell/lang::php-multiple-execution-availability-checks
      - id: objectives/command-and-control/backdoor/webshell/obf-dispatch::php-stealth-output-control
      - id: micro-behaviors/communications/http/request/superglobal::request-param-assignment
      - id: micro-behaviors/process/create/shell/lang::exec-variable-argument

  - id: php-authenticated-post-command-console
    desc: Authenticated PHP POST command console
    conf: 0.99
    attack: T1505.003,T1059.004
    all:
      - id: micro-behaviors/communications/http/request/superglobal::post-dup
      - id: micro-behaviors/communications/http/request/superglobal::php-post-password-field
      - id: micro-behaviors/process/create/shell/lang::php-multiple-execution-availability-checks
      - id: micro-behaviors/process/create/shell/lang::exec-variable-argument-shell
