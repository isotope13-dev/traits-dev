# A package that replaces Node's HTTP server factory to intercept a private
# route, then sends caller-supplied SQL to a database, installs a hidden
# administrative execution surface inside the host application.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  attack: T1505.003,T1059
  mbc: B0030

traits:
  - id: node-replaces-http-server-factory
    desc: Replaces the Node HTTP server factory
    crit: notable
    conf: 0.96
    if:
      type: text
      regex: 'http\.createServer\s*=\s*\([^)]{0,100}\)\s*=>'

  - id: node-http-server-short-circuits-private-route
    desc: HTTP wrapper intercepts route before app
    crit: notable
    conf: 0.97
    if:
      type: text
      regex: 'handler\(req,\s*res\)[\s\S]{0,180}originalListener\(req,\s*res\)'

  - id: node-server-forwards-parsed-request-query
    desc: Forwards parsed request query to database
    crit: notable
    conf: 0.97
    if:
      type: text
      regex: 'const\s+\{\s*query,\s*dbType\s*\}\s*=\s*parsed\.data'

  - id: node-database-executes-unbound-query
    desc: Database client executes an unbound query string
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: '(pool|poolPg)\.query\(\s*(\{\s*sql:\s*)?query\b'

composite_rules:
  - id: node-hidden-request-driven-sql-console
    desc: HTTP factory patch exposes caller supplied SQL execution
    crit: hostile
    conf: 0.98
    for: [npm, tar, package.json, javascript, typescript]
    scope: archive
    attack: T1505.003,T1059.007
    all:
      - id: node-replaces-http-server-factory
      - id: node-http-server-short-circuits-private-route
      - id: node-server-forwards-parsed-request-query
      - id: node-database-executes-unbound-query
