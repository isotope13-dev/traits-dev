defaults:
  platforms:
  - windows
  - unix
  for:
  - php
traits:
- id: referer-accept-lang-c2-pair
  desc: "Referer+Accept-Language covert C2 pair"
  crit: suspicious
  conf: 0.9
  attack: T1071.001
  mbc: C0002
  if:
    type: string_literal
    regex: REFER.{1,100}LANG
- id: gz-base64-encode-response
  desc: 'gz b64 encode response'
  crit: suspicious
  conf: 0.88
  attack: T1573.001
  if:
    type: string_literal
    regex: gz\w*compress.{0,60}base64_\w*encode
composite_rules:
- id: background-php-webshell-runner
  desc: Background PHP request execution with host-log path
  crit: hostile
  conf: 0.96
  all:
  - id: micro-behaviors/process/control/signal::ignore-user-abort-true-call
  - id: micro-behaviors/process/resources/limits::set-time-limit
  - id: micro-behaviors/fs/path/temp::php-host-derived-log-path
  # Background lifecycle settings and a log-path reference are neutral.
  # Require request-driven execution before claiming a webshell runner.
  any:
  - id: objectives/execution/interpreter/eval/remote::eval-user-input
  - id: micro-behaviors/process/create/shell/lang::exec-user-input
  - id: micro-behaviors/process/create/shell/lang::php-request-assigned-command-branch
  unless:
  - id: well-known/app/publishing/pressbooks
  - id: well-known/app/publishing/wordpress-plugins/site-admin::wordpress-maintenance-plugin
