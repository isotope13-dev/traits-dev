defaults:
  platforms: [windows, unix]
  for: [php]
  attack: T1505.003
  mbc: B0030

traits:
  - id: php-shell-record-url-password
    desc: PHP stores shell URL and password
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: '\$database\[[^]]{1,32}\]\[[''\"]url[''\"]\][\s\S]{0,120}\bpass[''\"]'

  - id: php-custom-http-content-fetch
    desc: PHP calls a custom HTTP content fetcher
    crit: component
    conf: 0.9
    if:
      type: symbol
      kind: call
      exact: get_content

  - id: php-archive-download-link
    desc: PHP emits a downloadable archive link
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)archive/.{0,80}\.(zip|txt).{0,80}Download'

composite_rules:
  - id: php-webroot-dotenv-disclosure
    desc: PHP webshell discloses webroot dotenv contents
    crit: hostile
    conf: 0.99
    attack: T1505.003,T1041,T1552.001
    all:
      - id: micro-behaviors/fs/read/file::file-get-contents
      - id: micro-behaviors/fs/path/sensitive/credentials::dotenv-filename-literal
      - id: micro-behaviors/communications/http/request/params::document-root-access
      - id: micro-behaviors/os/stdio::php-echo-statement
      - id: micro-behaviors/fs/read/file::php-dotenv-read-into-variable

  - id: php-webshell-command-relay
    desc: PHP relays submitted code to stored webshells
    crit: hostile
    conf: 0.99
    attack: T1505.003,T1071.001
    all:
      - id: metadata/lang/scripted::php-open-tag
      - id: micro-behaviors/communications/http/request/params::post-dup
      - id: micro-behaviors/communications/http/request/params::php-code-request-parameter
      - id: micro-behaviors/data/encode/url::http-build-query-call
      - id: php-custom-http-content-fetch

  - id: php-webshell-credential-archive
    desc: PHP archives stored webshell URLs and passwords
    crit: hostile
    conf: 0.99
    attack: T1505.003,T1560.001
    all:
      - id: metadata/lang/scripted::php-open-tag
      - id: micro-behaviors/communications/http/request/params::post-dup
      - id: micro-behaviors/communications/http/request/params::php-key-request-parameter
      - id: php-shell-record-url-password
      - id: micro-behaviors/fs/file/write/direct::php-file-put-contents
      - id: micro-behaviors/data/archive/create/zip::php-ziparchive-create

  - id: php-webshell-credential-archive-download
    desc: PHP exposes archived webshell credentials for download
    crit: hostile
    conf: 0.99
    attack: T1505.003,T1560.001
    all:
      - id: php-shell-record-url-password
      - id: micro-behaviors/data/archive/create/zip::php-ziparchive-create
      - id: php-archive-download-link
