defaults:
  platforms: [windows]
  for: [html]
  attack: T1505.003
composite_rules:
  - id: html-form-embedded-asp-shell-delivery
    desc: HTML form submits embedded ASP shell
    crit: hostile
    conf: 0.97
    scope: file
    all:
      - id: micro-behaviors/communications/http/form::html-form-action-from-input
      - id: micro-behaviors/communications/http/form::html-form-post-method
      - id: micro-behaviors/communications/http/form::html-form-field-name-from-password
      - id: micro-behaviors/communications/http/request/form-input::asp-request-form-reference
      - id: micro-behaviors/os/com/instantiation::wscript-shell-createobject
      - id: micro-behaviors/os/handler/open::shell-application-execute-context
      - id: objectives/command-and-control/backdoor/webshell/upload::classic-asp-upload-writer-host-identity
