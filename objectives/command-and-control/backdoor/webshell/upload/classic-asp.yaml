# These co-occurring upload, write and network-object facts occur in both
# webshells and administrative file managers. They do not prove that host
# identity is disclosed or that an upload succeeded.
defaults:
  platforms: [windows]
  for: [vbs, html, asp]
  attack: T1505.003,T1105,T1082
  mbc: B0030

composite_rules:
  - id: classic-asp-upload-writer-host-identity
    desc: ASP upload, file write and network-object clues
    crit: suspicious
    conf: 0.93
    all:
      - id: micro-behaviors/communications/http/request/superglobal::classic-asp-request-binaryread
      - id: micro-behaviors/os/com/automation::filesystemobject-progid
      - id: micro-behaviors/fs/write/content::fso-text-file-write-api
      - id: well-known/lib/runtime/scripted/windows-script-host::wscript-network-progid
