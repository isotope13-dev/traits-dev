# Classic ASP upload webshells (ASP_KIT up.asp and kin) parse the raw multipart
# body themselves and write it wherever the form says, then print the server's
# machine and account name so the operator knows where they landed. Upload
# handlers in real sites do the first half; none have a reason to instantiate
# WScript.Network and echo the host identity back to the uploader.
defaults:
  platforms: [windows]
  for: [vbs, html]
  attack: T1505.003,T1105,T1082
  mbc: B0030

composite_rules:
  - id: classic-asp-upload-writer-host-identity
    desc: ASP upload writer discloses server host identity
    crit: hostile
    conf: 0.93
    all:
      - id: micro-behaviors/communications/http/request/superglobal::classic-asp-request-binaryread
      - id: micro-behaviors/os/com/automation::filesystemobject-progid
      - id: micro-behaviors/fs/write/content::create-text-file-api
      - id: micro-behaviors/os/com/automation::wscript-network-progid
