# Browser payloads that package a request-command PHP shell as a WordPress
# plugin and send it through the authenticated plugin uploader. The upload
# APIs and ZIP media type are ordinary administration mechanics on their own;
# the embedded request-to-command sink makes the uploaded plugin a webshell.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  attack: T1505.003,T1105
  mbc: B0030

composite_rules:
  - id: wordpress-plugin-command-webshell-upload
    desc: Uploads command webshell as WordPress plugin
    crit: hostile
    conf: 0.995
    scope: file
    near_bytes: 4096
    all:
      - id: micro-behaviors/communications/http/request/plugin-install::plugin-upload-action-endpoint
      - id: micro-behaviors/communications/http/request/plugin-install::plugin-archive-form-field
      - id: micro-behaviors/data/format/mime::application-zip-mime
      - id: micro-behaviors/data/embedded/script::wordpress-request-execution-fragment-context
      - id: micro-behaviors/communications/http/request/client::js-fetch-call

  - id: wordpress-plugin-archive-webshell-upload
    desc: Uploads embedded PHP webshell archive via WordPress plugin installer
    crit: hostile
    conf: 0.995
    for: [scripts, source, -php]
    all:
      - id: micro-behaviors/communications/http/request/plugin-install::wordpress-plugin-zip-upload
      - id: micro-behaviors/data/embedded/script::embedded-php-command-or-eval-webshell
    any:
      - id: micro-behaviors/communications/http/post/
      - id: micro-behaviors/communications/http/curl/body/
      - id: micro-behaviors/communications/http/request/body/construction/
    unless:
      - id: well-known/tool/detection/defensive-scanner-context::published-defensive-scanner-context

  - id: wordpress-editor-webshell-write
    desc: Writes embedded PHP webshell via WordPress theme or plugin editor
    crit: hostile
    conf: 0.995
    for: [scripts, source, -php]
    all:
      - id: micro-behaviors/communications/http/request/wordpress::code-editor-endpoint
      - id: micro-behaviors/communications/http/request/params::wordpress-editor-newcontent-field
      - id: micro-behaviors/data/embedded/script::embedded-php-command-or-eval-webshell
    any:
      - id: micro-behaviors/communications/http/post/
      - id: micro-behaviors/communications/http/curl/body/
      - id: micro-behaviors/communications/http/request/body/construction/
    unless:
      - id: well-known/tool/detection/defensive-scanner-context::published-defensive-scanner-context
