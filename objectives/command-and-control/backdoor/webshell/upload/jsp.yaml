# JSP upload web shells (PSEMHUB.war u.jsp / u2.jsp and kin). The page reads a
# destination path and a content chunk from request parameters and writes the
# attacker-supplied bytes there, reassembling an arbitrary file under the web
# root. A raw JSP scriptlet that opens a request-named file in write mode is
# already a webshell primitive; decoding base64 request content into it is the
# chunked-uploader shape these campaigns stage next to their command shells.
#
# Carrier types: a .jsp is classified by content, so a JSP arrives typed jsp or
# one of python/javascript/vbs/html (see metadata/lang/scripted). The carriers
# ride in for: so the gate is not left inert on a mis-sniffed page.
defaults:
  platforms: [unix, windows]
  for: [jsp, html, javascript, python, vbs]
  attack: T1505.003,T1105
  mbc: B0030

composite_rules:
  - id: jsp-request-controlled-file-write
    desc: JSP writes a request-named file
    crit: suspicious
    conf: 0.93
    unless:
      - id: well-known/tool/offensive/
      - id: metadata/package/testing/presence/harness::test-fixture-directory
    all:
      - id: metadata/lang/scripted::jsp-server-page
      - id: micro-behaviors/communications/http/request/params::java-servlet-get-parameter
    any:
      - id: micro-behaviors/fs/write/file/handle::java-randomaccessfile-write-mode
      - id: micro-behaviors/fs/write/file/handle::java-fos-simple
      - id: micro-behaviors/fs/write/file/handle::java-fileoutputstream-source

  - id: jsp-request-base64-upload-shell
    desc: JSP decodes base64 upload to a file
    crit: hostile
    conf: 0.95
    unless:
      - id: well-known/tool/offensive/
      - id: metadata/package/testing/presence/harness::test-fixture-directory
    all:
      - id: jsp-request-controlled-file-write
      - id: micro-behaviors/data/decode/base64::java-base64-decoder-source-call
