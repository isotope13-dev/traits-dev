# Detects the delivered behavior rather than a product or CVE: a multipart
# request names a server-executable script and its body is a functional webshell.
defaults:
  platforms: [unix, windows]
  for: [scripts, binaries]
  attack: T1505.003,T1190
  mbc: B0030

composite_rules:
  - id: multipart-command-webshell-upload
    desc: Multipart request uploads a command webshell script
    crit: hostile
    conf: 0.995
    all:
      - id: micro-behaviors/communications/http/form::multipart-form
      - id: objectives/command-and-control/backdoor/webshell/exec/
    any:
      - id: micro-behaviors/communications/http/upload::multipart-php-script-filename
      - id: micro-behaviors/communications/http/upload::multipart-managed-script-filename
      - id: micro-behaviors/communications/http/upload::multipart-cgi-script-filename
    near_bytes: 8192

  # General exploit-client form: a caller-controlled extension policy permits
  # a server script, the same multipart request supplies that script, and its
  # embedded payload profiles the host before exposing a browser file writer.
  # The required upload-policy objective keeps quoted webshell examples and
  # ordinary PHP upload handlers from becoming a conviction on their own.
  - id: multipart-recon-upload-webshell-deployment
    desc: Multipart policy bypass deploys a host-profiling upload webshell
    crit: hostile
    conf: 0.995
    all:
      - id: objectives/execution/exploit/file-upload::request-policy-server-script-upload
      - id: micro-behaviors/data/embedded/script::embedded-php-upload-handler
      - id: micro-behaviors/data/embedded/script::embedded-php-host-profile
      - id: micro-behaviors/communications/http/form::multipart-form
    near_bytes: 8192
