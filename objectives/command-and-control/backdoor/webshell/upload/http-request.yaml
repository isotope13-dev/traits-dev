# Detects the delivered behavior rather than a product or CVE: a multipart
# request names a server-executable script and its body is a functional webshell.
defaults:
  platforms: [unix, windows]
  for: [scripts, binaries]
  attack: T1505.003,T1190
  mbc: B0030

composite_rules:
  - id: multipart-command-webshell-upload
    desc: Multipart request uploads a command webshell script
    crit: hostile
    conf: 0.995
    all:
      - id: micro-behaviors/communications/http/post::multipart-form
      - id: objectives/command-and-control/backdoor/webshell/exec/
    any:
      - id: micro-behaviors/communications/http/upload::multipart-php-script-filename
      - id: micro-behaviors/communications/http/upload::multipart-managed-script-filename
      - id: micro-behaviors/communications/http/upload::multipart-cgi-script-filename
    near_bytes: 8192
