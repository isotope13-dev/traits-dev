defaults:
  platforms: [windows, unix]
  for: [php]
  attack: T1505.003
  mbc: B0030

traits:
  # Atomic move_uploaded_file($_FILES[...]['tmp_name']) is ordinary PHP
  # import/media handling (WordPress plugins, forms). Webshell signal lives in
  # php-host-profiling-upload-shell with host profiling + URL republication.
composite_rules:
  # The deployed shell described in CVE-2026-27540 reports the host and gives
  # its operator a browser upload form that writes more files. Unlike the URL
  # republication variant below, that behavior does not need to print the new
  # file's public URL. The combination is suspicious but can occur in a small
  # legitimate diagnostics uploader, so command execution or URL publication
  # remains necessary for a hostile verdict.
  - id: php-host-profile-browser-uploader
    desc: PHP host-profile page accepts browser uploads and writes them to the server
    crit: suspicious
    conf: 0.97
    all:
      - id: micro-behaviors/os/sysinfo/platform/runtime::php-uname-call
      - id: micro-behaviors/communications/http/form::html-multipart-enctype
    any:
      - id: micro-behaviors/fs/file/copy::php-copy-uploaded-temp-file
      - id: micro-behaviors/communications/http/upload::php-move-uploaded-temp-file
      - id: micro-behaviors/fs/write/file/stream::write-uploaded-temp-stream
    near_bytes: 4096

  - id: php-upload-url-publication
    desc: PHP publishes uploaded file URL
    crit: suspicious
    conf: 0.96
    all:
      - id: micro-behaviors/communications/http/request/superglobal::files
      - id: micro-behaviors/communications/http/url/build::php-request-host-script-url
    near_bytes: 512

  - id: php-host-profiling-upload-shell
    desc: PHP upload shell profiles host and republishes files
    crit: hostile
    conf: 0.99
    all:
      - id: micro-behaviors/os/sysinfo/platform/runtime::php-uname-call
      - id: php-upload-url-publication
    any:
      - id: micro-behaviors/fs/file/copy::php-copy-uploaded-temp-file
      - id: micro-behaviors/communications/http/upload::php-move-uploaded-temp-file
      - id: micro-behaviors/fs/write/file/stream::write-uploaded-temp-stream
    near_bytes: 4096
