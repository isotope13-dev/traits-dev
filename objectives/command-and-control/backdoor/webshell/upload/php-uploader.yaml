defaults:
  platforms: [windows, unix]
  for: [php]
  attack: T1505.003
  mbc: B0030

# Atomic move_uploaded_file($_FILES[...]['tmp_name']) is ordinary PHP
# import/media handling (WordPress plugins, forms). The hostile composite
# requires host profiling, an upload form, a command field and shell call.
composite_rules:
  # Host profiling plus an upload form can be a small diagnostics utility.
  # Its neutral upload observation lives under micro-behaviors; this rule needs
  # page to expose a command field alongside shell execution.
  - id: php-host-profile-command-upload-webshell
    desc: PHP host-profile uploader combines command form and shell call
    crit: hostile
    conf: 0.99
    all:
      - id: micro-behaviors/communications/http/server/request::php-host-profile-upload-handler
      - id: micro-behaviors/ui/controls/input::php-command-named-form-control
      - id: micro-behaviors/process/create/shell/spawn::php-shell-exec
    near_bytes: 4096

  - id: php-command-shell-upload-webshell
    desc: PHP command webshell with file upload
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/fs/file/move::php-path-upload-handler
      - id: micro-behaviors/communications/http/request/superglobal::request-param-assignment
    any:
      - id: micro-behaviors/process/create/shell/lang::php-variable-shell-command
      - id: micro-behaviors/process/create/subprocess::proc-open-variable-argument
    unless:
      - id: well-known/app/publishing/wordpress-plugins/catalog::known-wordpress-plugin
      - id: metadata/path::test-directory-component

  - id: php-obfuscated-file-upload-webshell
    desc: Obfuscated PHP file upload webshell
    crit: hostile
    conf: 0.98
    attack: T1505.003,T1027
    all:
      - id: micro-behaviors/communications/http/request/superglobal::files
      - id: micro-behaviors/communications/http/request/superglobal::post-dup
      - id: micro-behaviors/process/resources/limits::php-disable-execution-time-limit
      - id: micro-behaviors/data/control-flow/dispatch/computed::php-variable-function-call
    any:
      - id: objectives/anti-static/obfuscation/string/array::php-heavy-hex-escape-density
      - id: metadata/lang/encoding/unicode-escape::unicode-escape-dense-php-byte-escapes
    unless:
      - id: metadata/path::test-directory-component
      - id: well-known/app/publishing/wordpress-plugins/catalog::known-wordpress-plugin
