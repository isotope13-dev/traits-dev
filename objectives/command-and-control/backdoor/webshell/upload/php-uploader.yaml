defaults:
  platforms: [windows, unix]
  for: [php]
  attack: T1505.003
  mbc: B0030

traits:
  # Atomic move_uploaded_file($_FILES[...]['tmp_name']) is ordinary PHP
  # import/media handling (WordPress plugins, forms). The hostile composite
  # requires host profiling, an upload form, a command field and shell call.
composite_rules:
  # Host profiling plus an upload form can be a small diagnostics utility.
  # Keep that combination suspicious; the hostile verdict requires the same
  # page to expose a command field alongside shell execution.
  - id: php-host-profile-browser-uploader
    desc: PHP host-profile page accepts browser uploads and writes them to the server
    crit: suspicious
    conf: 0.97
    all:
      - id: micro-behaviors/os/sysinfo/platform/runtime::php-uname-call
      - id: micro-behaviors/communications/http/form::html-multipart-enctype
    any:
      - id: micro-behaviors/fs/file/copy::php-copy-uploaded-temp-file
      - id: micro-behaviors/communications/http/upload::php-move-uploaded-temp-file
      - id: micro-behaviors/fs/write/file/stream::write-uploaded-temp-stream
    near_bytes: 4096

  - id: php-upload-url-publication
    desc: PHP publishes uploaded file URL
    crit: suspicious
    conf: 0.96
    all:
      - id: micro-behaviors/communications/http/request/superglobal::files
      - id: micro-behaviors/communications/http/url/build::php-request-host-script-url
    near_bytes: 512

  - id: php-host-profile-command-upload-webshell
    desc: PHP host-profile uploader combines command form and shell call
    crit: hostile
    conf: 0.99
    all:
      - id: php-host-profile-browser-uploader
      - id: micro-behaviors/ui/controls/input::php-command-named-form-control
      - id: micro-behaviors/process/create/shell/spawn::php-shell-exec
    near_bytes: 4096
