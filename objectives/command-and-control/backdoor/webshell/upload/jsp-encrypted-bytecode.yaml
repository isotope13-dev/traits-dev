defaults:
  for: [class]
  platforms: [unix, windows]
  attack: T1505.003,T1105

composite_rules:
  - id: jvm-encrypted-jsp-base64-file-writer
    desc: Encrypted JSP control combines decoding and file output
    crit: hostile
    conf: 0.97
    all:
      - id: objectives/command-and-control/channel/http/message::jvm-encrypted-jsp-equals-channel
      - id: micro-behaviors/fs/file/open/write::jvm-fileoutputstream-constructor
    any:
      - id: micro-behaviors/data/decode/base64/unspecified::java-legacy-base64-decode-bytecode
      - id: micro-behaviors/data/decode/base64/unspecified::java-base64-decode-bytecode-call
