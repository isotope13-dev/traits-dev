defaults:
  platforms: [unix, windows]
  for: [python]
  attack: T1190,T1505.003
  mbc: B0030

composite_rules:
  # A caller-controlled form identifier carries parent-directory traversal,
  # while the same multipart request uploads a PHP request-command payload.
  # Together these identify a traversal-assisted webshell write without
  # depending on one product's field spelling or upload endpoint.
  - id: python-traversal-form-webshell-upload
    desc: Python multipart request deploys a PHP webshell through form traversal
    crit: hostile
    conf: 0.995
    scope: file
    near_bytes: 4096
    all:
      - id: micro-behaviors/communications/http/form::form-upload-identifier-field
      - id: micro-behaviors/fs/path/traversal::repeated-parent-directory-segments
      - id: micro-behaviors/communications/http/upload::python-http-files-parameter
      - id: objectives/command-and-control/backdoor/webshell/embedded::embedded-php-request-command

  # The Python client embeds a request-driven PHP shell in a plugin ZIP and
  # sends it through WordPress's authenticated plugin upload route. The
  # generated PHP payload plus the upload transaction establishes deployment.
  - id: python-wordpress-plugin-command-webshell-upload
    desc: Python uploads a WordPress command webshell
    crit: hostile
    conf: 0.995
    scope: file
    near_bytes: 4096
    all:
      - id: micro-behaviors/communications/http/request/plugin-install::plugin-upload-action-endpoint
      - id: micro-behaviors/communications/http/request/plugin-install::python-plugin-archive-form-field
      - id: micro-behaviors/data/embedded/script::fragmented-embedded-php-command-execution
      - id: micro-behaviors/data/embedded/script::embedded-wordpress-plugin-header

  # Require the functional JSP body, multipart upload call, exploit transport,
  # and deployed shell path in one source member. Documentation or a reusable
  # HTTP upload helper cannot independently complete this objective.
  - id: python-jsp-command-webshell-upload-exploit
    desc: Python exploit uploads a JSP request-command webshell
    crit: hostile
    conf: 0.995
    scope: file
    near_lines: 120
    all:
    - id: objectives/command-and-control/backdoor/webshell/request/command::jsp-runtime-exec-request-param
    - id: micro-behaviors/communications/http/upload::python-http-files-parameter
    - id: objectives/execution/exploit/network-service/command-execution::python-exploit-network-send
    - id: micro-behaviors/communications/http/url/endpoint::shell-endpoint
    unless:
    - id: well-known/tool/offensive/
