# Upload handler (raw multipart body parsed for `filename="`, then written to
# disk) on a page that also runs commands and returns their output. Ordinary
# ASP upload handlers do not ship a command console.
defaults:
  platforms: [windows]
  for: [asp]
  attack: T1505.003,T1105
  mbc: B0030

composite_rules:
  - id: classic-asp-multipart-upload-command-shell
    desc: ASP command shell also writes uploaded files
    crit: hostile
    conf: 0.95
    all:
      - id: micro-behaviors/communications/http/request/superglobal::classic-asp-request-binaryread
      - id: micro-behaviors/communications/http/server/request::asp-multipart-filename-scan
      - id: objectives/command-and-control/remote-command/shell::asp-wsh-stdout-readall
    any:
      - id: micro-behaviors/fs/write/content::fso-text-file-write-api
      - id: micro-behaviors/fs/write/content::create-text-file-method-name
      - id: micro-behaviors/fs/write/stream::adodb-save-to-file
