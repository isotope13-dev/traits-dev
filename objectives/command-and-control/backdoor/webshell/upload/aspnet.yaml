# ASP.NET upload webshells combine server command execution with arbitrary
# file upload handling.
defaults:
  platforms: [windows]
  for: [asp]
  attack: T1505.003,T1105
  mbc: B0030

composite_rules:
  - id: aspnet-command-shell-file-upload
    desc: ASP.NET command webshell with file upload
    crit: hostile
    conf: 0.98
    all:
      - id: "metadata/lang/source/syntax/directive::aspnet-page-directive"
      - id: micro-behaviors/process/create/shell/spawn::aspnet-startinfo-cmd-exe
      - id: objectives/command-and-control/backdoor/webshell/file-manager::aspnet-control-panel-request-upload-saveas
      - id: micro-behaviors/process/fd/stdio::dotnet-standard-output-redirection
