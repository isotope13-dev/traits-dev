defaults:
  platforms: [unix, windows]
  for: [php]

traits:
  - id: copy-upload-to-client-filename
    desc: Copies uploaded data to client filename
    crit: notable
    conf: 0.96
    if:
      type: text
      regex: '(?i)copy\s*\(\s*\$_FILES\[[^\r\n]{0,80}tmp_name[^\r\n]{0,80}\$_FILES\[[^\r\n]{0,80}name'
  - id: fixed-get-login-check
    desc: Fixed login value in GET parameter
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '\$_GET\[[^\r\n]{0,40}login[^\r\n]{0,40}==\s*[''"][^''"]{3,40}[''"]'

composite_rules:
  - id: fixed-gate-arbitrary-file-uploader
    desc: Fixed-gate uploader writes attacker filenames
    crit: hostile
    conf: 0.97
    attack: T1505.003,T1105
    all:
      - id: copy-upload-to-client-filename
      - id: fixed-get-login-check
