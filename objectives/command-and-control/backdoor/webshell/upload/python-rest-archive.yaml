# Co-occurrence of a bound PHP request-command archive member, ZIP writer,
# WordPress REST references and a multipart HTTP client. Remote acceptance
# and the in-memory ZIP's return through a helper are not modeled here.
defaults:
  platforms: [unix, windows]
  for: [python]
  attack: T1505.003

composite_rules:
  - id: python-wordpress-rest-command-shell-archive
    desc: WordPress REST client builds command-shell ZIP
    crit: hostile
    conf: 0.99
    all:
      - id: micro-behaviors/data/archive/create/zip::python-archive-request-command-php
      - id: micro-behaviors/data/archive/create/zip::python-zipfile-writer
      - id: micro-behaviors/communications/http/request/wordpress::rest-endpoint-url
      - id: micro-behaviors/communications/http/upload::python-http-files-parameter
