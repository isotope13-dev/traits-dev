# A JSP page that writes request-supplied content to a request-chosen path
# beneath the web root plants further server pages.
#
# JSP has its own file type. The other carrier types remain for JSP fragments
# that are embedded in files classified from their surrounding content.
defaults:
  platforms:
  - windows
  - unix
  for:
  - jsp
  - java
  - class
  - html
  - javascript
  - python
  - vbs
  mbc: B0030
  attack: T1505.003
traits:
- id: jsp-request-file-content-source
  desc: JSP writes request parameter bytes to disk
  crit: notable
  conf: 0.92
  for: [jsp]
  if:
    type: text
    regex: '(?is)request\s*\.\s*getParameter\s*\([^)]{1,100}\)\s*\.\s*getBytes\s*\(\)'
composite_rules:
- id: jsp-request-webroot-file-upload
  for: [jsp]
  desc: JSP writes request-selected content to a path beneath the web root
  crit: hostile
  conf: 0.99
  all:
  - id: micro-behaviors/communications/http/request/params::java-servlet-get-parameter
  - id: micro-behaviors/fs/write/file/handle::java-fileoutputstream-source
  - id: micro-behaviors/fs/path/construct::jsp-webroot-request-path-source
  any:
  - id: micro-behaviors/fs/write/file/handle::jsp-request-stream-to-file-source
  - id: jsp-request-file-content-source
  needs: 1
