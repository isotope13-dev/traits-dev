# WordPress REST routes that accept unauthenticated uploads and write under
# ABSPATH (StopAndProtect MU plugin / wp-sec style). A public REST route alone
# is common; pairing it with an ABSPATH file write is the backdoor signal.
defaults:
  platforms: [unix, windows]
  for: [php]
  attack: T1505.003,T1105
  mbc: B0030

traits:
  - id: rest-upload-route-segment
    desc: Registers a REST route under /upload
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: "register_rest_route\\s*\\([^;]{0,120}['\\\"]/upload['\\\"]"

composite_rules:
  - id: wordpress-rest-abspath-file-upload
    desc: Public WP REST upload writes files under ABSPATH
    crit: hostile
    conf: 0.98
    all:
      - id: rest-upload-route-segment
      - id: micro-behaviors/communications/http/request/wordpress::rest-permission-allows-all
      - id: micro-behaviors/fs/path/application/webapp::php-abspath-path-join
    any:
      - id: micro-behaviors/fs/file/write/direct::php-file-put-contents
      - id: micro-behaviors/fs/write/file/direct::move-uploaded-file
    near_bytes: 2400

  - id: wordpress-rest-hardcoded-abspath-file-upload
    desc: Hardcoded-auth WP REST route writes files under ABSPATH
    crit: hostile
    conf: 0.99
    all:
      - id: objectives/command-and-control/backdoor/webshell/auth::wordpress-rest-hardcoded-credential-gate
      - id: rest-upload-route-segment
      - id: micro-behaviors/fs/path/application/webapp::php-abspath-path-join
      - id: micro-behaviors/fs/file/write/direct::php-file-put-contents
    near_bytes: 3200

  - id: wordpress-mu-plugin-rest-uploader-install
    desc: Installer drops MU plugin REST file uploader
    crit: hostile
    conf: 0.98
    all:
      - id: objectives/command-and-control/backdoor/webshell/auth::wordpress-mu-plugin-persistence-write
      - id: rest-upload-route-segment
      - id: micro-behaviors/communications/http/request/wordpress::rest-permission-allows-all
    any:
      - id: micro-behaviors/fs/delete/file::php-unlink
      - id: micro-behaviors/fs/path/application/webapp::php-abspath-path-join
    near_bytes: 4000
