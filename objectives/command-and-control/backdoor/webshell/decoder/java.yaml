# Encrypted-payload Java webshells (the Behinder / Godzilla / ORANGETAIL
# shape). The request carries a Base64 blob, the handler symmetrically decrypts
# it with a key baked into the class, and the plaintext is a class body that is
# defined and run in-process. Nothing is ever written to disk and no command
# string appears anywhere, so the decrypt-then-defineClass path is the part
# worth matching: a servlet that turns request bytes into a live class has no
# benign reading.
defaults:
  platforms: [unix, windows]
  for: [java, kotlin, groovy, scala]
  attack: T1505.003
  mbc: B0030

composite_rules:
  - id: java-request-payload-decrypt
    desc: Servlet decrypts a request-supplied payload
    crit: suspicious
    conf: 0.9
    all:
      - id: micro-behaviors/crypto/library/provider::java-cipher-getinstance-source
      - id: micro-behaviors/crypto/library/provider::dofinal-method
    any:
      - id: micro-behaviors/communications/http/request/params::servlet-get-parameter-call
      - id: micro-behaviors/communications/http/header/custom::servlet-get-header-call
    needs: 1

  - id: java-encrypted-request-classload-shell
    desc: Request payload decrypted into a class
    crit: hostile
    conf: 0.96
    all:
      - id: java-request-payload-decrypt
      - id: micro-behaviors/data/source/dynamic/reflect::java-defineclass-any
    any:
      - id: micro-behaviors/data/decode/base64::java-base64-decoder-source-call
      - id: micro-behaviors/crypto/library/provider::java-secretkeyspec-source
      - id: micro-behaviors/crypto/library/provider::java-aes-ecb-transform
    needs: 1
