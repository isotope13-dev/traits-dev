---
defaults:
  platforms:
  - linux
  - macos
  - windows
  for:
  - php
  mbc: B0030
  attack: T1505.003
composite_rules:
- id: php-decoder-eval-webshell
  desc: PHP decoder eval webshell
  crit: hostile
  conf: 0.97
  all:
  - id: objectives/command-and-control/backdoor/webshell/decoder::eval-decoder-chain
  any:
  - id: objectives/anti-static/obfuscation/encoding/hex::php-long-percent-encoded-literal
  - id: micro-behaviors/data/decode/base64::php-large-literal-base64-decode
  - id: micro-behaviors/process/interpreter/eval/direct::eval-gzinflate-base64
  - id: micro-behaviors/process/interpreter/eval/direct::eval-gzuncompress-base64
  - id: micro-behaviors/process/interpreter/eval/direct::eval-user-input
  - id: micro-behaviors/communications/http/request/params::get-dup
  - id: micro-behaviors/communications/http/request/params::post-dup
  - id: micro-behaviors/communications/http/request/params::request-dup
  unless:
  - id: metadata/lang/source::yara-rule-source
  - id: well-known/app/publishing/wordpress-plugins::bitfire-plugin-path
  - id: well-known/tool/offensive/bingo/
  - id: metadata/package/testing/presence/reconstruction::php-behavioral-reconstruction-context
- id: php-named-decoder-eval-webshell
  desc: PHP request handler evaluates compressed literal through decoder
  crit: hostile
  conf: 0.99
  attack: T1505.003,T1027,T1059.006
  all:
  - id: objectives/command-and-control/backdoor/webshell/decoder::php-eval-named-loader-call
  - id: micro-behaviors/data/compress/library::php-compressed-base64-decode
  - id: micro-behaviors/communications/http/request/params::request-dup
- id: php-obfuscated-request-eval-webshell
  desc: PHP request payload reaches reconstructed eval dispatcher
  crit: hostile
  conf: 0.99
  attack: T1505.003,T1027,T1059.006
  all:
  - id: objectives/anti-static/obfuscation/string/concat::php-split-eval-base64-fragment
  - id: micro-behaviors/communications/http/request/params::request-dup
  - id: micro-behaviors/process/interpreter/reflection/dispatch::dynamic-function-execution
