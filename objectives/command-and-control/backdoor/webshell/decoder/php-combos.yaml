---
defaults:
  crit: hostile
  platforms:
  - linux
  - macos
  - windows
  for:
  - php
  mbc: B0030
  attack: T1505.003
composite_rules:
- id: php-compressed-literal-request-eval
  desc: PHP evaluates compressed code containing request evaluation
  crit: hostile
  conf: 0.98
  # One source string ties the decoded request expression to the evaluated
  # literal; a separate encoded example cannot supply the decoded evidence.
  all:
  - id: micro-behaviors/process/interpreter/eval/decoded::php-eval-compressed-base64-literal
  - id: objectives/command-and-control/backdoor/webshell/request/eval::php-eval-request-in-string
  - id: metadata/lang/source/literal/string/population::php-single-string-literal
  unless:
  - id: metadata/package/testing/presence/path::php-test-or-fixture-path
  downgrade:
    any:
    - id: well-known/tool/development/vcs/github-web::blob-page-rendered-source
    scope: parent
- id: php-named-decoder-eval-webshell
  desc: PHP request handler evaluates compressed literal through decoder
  crit: hostile
  conf: 0.99
  attack: T1505.003,T1027,T1059.006
  all:
  - id: micro-behaviors/process/interpreter/eval/decoded::php-eval-named-loader-call
  - id: objectives/execution/interpreter/eval/remote::eval-user-input
  - id: micro-behaviors/data/compression::php-base64-wrapped-decompression
  - id: micro-behaviors/communications/http/request/superglobal::request-dup
- id: php-obfuscated-request-eval-webshell
  desc: PHP request payload reaches reconstructed eval dispatcher
  crit: hostile
  conf: 0.99
  attack: T1505.003,T1027,T1059.006
  all:
  - id: objectives/anti-static/obfuscation/string/concat::php-split-eval-base64-fragment
  - id: micro-behaviors/communications/http/request/superglobal::request-dup
  - id: micro-behaviors/data/control-flow/dispatch/computed::php-variable-function-call
- id: php-decompressed-shift-decoder-webshell
  desc: PHP webshell evaluates decompressed byte-transformed payload
  crit: hostile
  conf: 0.99
  attack: T1505.003,T1027,T1059.006
  all:
  - id: micro-behaviors/data/compression::php-base64-wrapped-decompression
  - id: micro-behaviors/process/interpreter/eval/direct::php-eval-named-function-argument
  any:
  - id: micro-behaviors/data/string/conversion::php-chr-of-ord
  - id: metadata/file/text-distribution::php-near-zero-whitespace
