defaults:
  platforms: [windows, unix]
  for: [php]
  mbc: B0030
  attack: T1505.003
traits:
- id: php-fopo-eval-marker
  desc: FOPO obfuscated eval marker
  crit: suspicious
  conf: 0.96
  attack: T1027
  if:
    type: text
    substr: '";@eval('
- id: encoded-dangerous-php-base64--rx-4
  desc: Regex component marker
  crit: suspicious
  conf: 0.9
  if:
    type: text
    regex: '(ZXZhbCg|c3lzdGVt)'
- id: encoded-dangerous-php-base64--rx-5
  desc: Regex component marker
  crit: suspicious
  conf: 0.9
  if:
    type: text
    regex: '(cHJlZ19yZXBsYWNl|ZXhlYyg)'
- id: encoded-dangerous-php-base64--rx-6
  desc: Regex component marker
  crit: suspicious
  conf: 0.9
  if:
    type: text
    regex: '(Y21kLmV4ZQ|cG93ZXJzaGVsbC5leGU)'
- id: escaped-hex-dangerous-php
  desc: Hex escaped PHP danger keywords
  crit: suspicious
  conf: 0.92
  attack: T1027
  if:
    type: text
    regex: '(\\x65\\x76\\x61\\x6[cC]|\\x65\\x78\\x65\\x63|\\x73\\x79\\x73\\x74\\x65\\x6d)'
  unless:
  - id: well-known/tool/detection/security-scanner::devdome-malware-scanner-source-context
- id: hpack-dangerous-php
  desc: Hpack hex PHP danger keywords
  crit: suspicious
  conf: 0.88
  attack: T1027
  # Require the call-paren nibble (`28` = '(') after eval/system so incidental
  # hex of words like "system" inside protobuf descriptor blobs (server_system_time)
  # does not fire. preg_replace / base64_decode remain long enough to stay unique.
  if:
    type: text
    regex: '(6576616[cC]28|73797374656d28|707265675f7265706c616365|61736536345f6465636f6465)'
  unless:
  - id: well-known/lib/format/protobuf::php-protobuf-hex2bin-descriptor
  - id: well-known/lib/format/protobuf::php-gpbmetadata-namespace
- id: reversed-dangerous-php--rx-7
  desc: Regex component marker
  crit: suspicious
  conf: 0.9
  if:
    type: text
    regex: '(slabolg|ecalper_gerp)'
- id: reversed-dangerous-php--rx-8
  desc: Regex component marker
  crit: suspicious
  conf: 0.9
  if:
    type: text
    regex: '(edoced_46esab|etalfnizg)'
- id: reversed-dangerous-php--rx-9
  desc: Regex component marker
  crit: suspicious
  conf: 0.9
  if:
    type: text
    regex: '(metsys|urhtssap)'
- id: cookie-sourced-payload-decoder
  desc: Cookie value decoded via gzinflate/base64
  crit: suspicious
  conf: 0.94
  attack: T1027
  if:
    type: text
    regex: str_replace[\s\S]{0,240}\$_COOKIE[\s\S]{0,240}(gzinflate|base64_decode)
- id: php-rot13-double-base64-gzinflate-chain
  desc: PHP rot13 double-base64 gzinflate decode chain
  crit: notable
  conf: 0.97
  attack: T1027
  if:
    type: text
    substr: 'gzinflate(base64_decode(base64_decode(str_rot13'
- id: php-image-marker-payload-extract
  desc: PHP extracts marked payload from image file
  crit: suspicious
  conf: 0.95
  attack: T1027
  if:
    type: text
    regex: 'file_get_contents\([^)]{0,120}\.(jpg|jpeg|png).{0,240}(start|end)'
- id: php-reads-php-script-file
  desc: PHP reads a .php script file
  crit: component
  conf: 0.9
  attack: T1027
  if:
    type: text
    regex: 'file\s*\([^)]{0,120}\.php[^)]{0,40}\)'
- id: php-implode-substr-base64-decode
  desc: PHP reassembles Base64 via substr/implode
  crit: suspicious
  conf: 0.94
  attack: T1027
  if:
    type: text
    regex: 'implode\s*\([\s\S]{0,240}substr\s*\([\s\S]{0,240}base64_decode\s*\('
# A substr whose start offset is read out of an array of numbers. The carrier
# file holds several payloads end to end and the loader keeps their boundaries
# in a table, so one dropped .php can serve the stage, the shell and the
# fallback depending on which index it is asked for.
- id: php-offset-table-substr
  desc: substr offsets read from a number table
  crit: notable
  conf: 0.93
  attack: T1027
  if:
    type: text
    regex: 'substr\s*\(\s*\$\w{1,20}\s*,\s*\$\w{1,20}\[\d'
composite_rules:
- id: php-carrier-file-offset-payload-loader
  desc: Loader slices payloads from a carrier script
  crit: hostile
  conf: 0.96
  attack: T1027,T1505.003
  all:
    - id: php-file-fragment-payload-output
    - id: php-offset-table-substr
- id: php-stego-image-eval-backdoor
  desc: PHP decodes image-marked payload then evals loader
  crit: hostile
  conf: 0.99
  attack: T1505.003,T1027,T1059.006
  scope: outer
  for: [zip, php]
  all:
    - id: php-rot13-double-base64-gzinflate-chain
    - id: objectives/anti-static/obfuscation/eval/loader::php-eval-named-loader-call
- id: php-jpeg-carrier-eval-backdoor-archive
  desc: PHP archive ships JPEG-staged eval loader backdoor
  crit: hostile
  conf: 0.99
  attack: T1505.003,T1027,T1195.002
  scope: archive
  for: [zip, php, jpeg]
  all:
    - id: metadata/image/trailing::jpeg-large-appended-data
    - id: php-rot13-double-base64-gzinflate-chain
    - id: objectives/anti-static/obfuscation/eval/loader::php-eval-named-loader-call
- id: php-file-fragment-payload-output
  desc: PHP decodes and emits a payload extracted from a script file
  crit: suspicious
  conf: 0.97
  attack: T1027,T1505.003
  near_lines: 40
  all:
    - id: php-reads-php-script-file
    - id: php-implode-substr-base64-decode
    - id: micro-behaviors/os/stdio::php-echo-statement
- id: encoded-dangerous-php-base64
  desc: Base64 encoded PHP danger keywords
  crit: suspicious
  conf: 0.9
  attack: T1027
  any:
  - id: encoded-dangerous-php-base64--rx-4
  - id: encoded-dangerous-php-base64--rx-5
  - id: encoded-dangerous-php-base64--rx-6
- id: reversed-dangerous-php
  desc: Reversed PHP danger keywords
  crit: suspicious
  conf: 0.9
  attack: T1027
  any:
  - id: reversed-dangerous-php--rx-7
  - id: reversed-dangerous-php--rx-8
  - id: reversed-dangerous-php--rx-9
