---
defaults:
  platforms:
  - windows
  - unix
  for:
  - php
  mbc: B0030
composite_rules:
- id: php-curl-response-eval-loader
  desc: PHP retrieves remote content and evaluates a transformed response
  crit: hostile
  conf: 0.98
  attack: T1105,T1059.006,T1505.003
  all:
  - id: micro-behaviors/communications/http/curl::init
  - id: micro-behaviors/communications/http/curl::exec
  - id: micro-behaviors/process/interpreter/eval/direct::error-suppressed-eval
  any:
  - id: objectives/anti-static/obfuscation/code-metrics/identifiers::php-single-long-line
  - id: objectives/anti-static/obfuscation/code-metrics/identifiers::php-obfuscated-vars
  near_bytes: 4096

- id: php-proxy
  desc: PHP proxy/SSRF webshell with user-controlled fetch
  crit: suspicious
  conf: 0.9
  attack: T1090
  all:
  - id: micro-behaviors/communications/http/curl::init
  any:
  - id: objectives/command-and-control/backdoor/webshell/fetch::ssrf-pattern
  - id: objectives/command-and-control/backdoor/webshell/fetch::url-param-fetch
- id: php-seo-tool
  desc: PHP SEO spam tool with remote fetch
  crit: suspicious
  conf: 0.85
  attack: T1505.003
  all:
  - id: objectives/command-and-control/backdoor/webshell/fetch::google-search-scrape
  - id: micro-behaviors/communications/http/curl::init
