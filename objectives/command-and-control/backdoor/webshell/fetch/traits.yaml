defaults:
  crit: suspicious
  platforms:
  - linux
  - macos
  - windows
  for:
  - php
  mbc: B0030
  conf: 0.85
traits:
- id: ssrf-pattern
  desc: Server-side request forgery fetch pattern
  crit: suspicious
  attack: T1090
  if:
    type: text
    regex: curl_init\s*\(.{0,50}\$_(GET|POST|REQUEST)
  unless:
  - id: metadata/path::test-directory-component
  - id: well-known/tool/detection/semgrep::rule-pack-fixture
- id: google-search-scrape
  desc: Google search results scraping
  crit: notable
  if:
    type: string_literal
    regex: 'google\.[a-z.]+/search\?.{0,50}site:'
composite_rules: []
