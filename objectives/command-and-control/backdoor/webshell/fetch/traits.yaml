defaults:
  crit: suspicious
  platforms:
  - linux
  - macos
  - windows
  for:
  - php
  mbc: B0030
traits:
- id: ssrf-pattern
  desc: Server-side request forgery fetch pattern
  crit: suspicious
  conf: 0.85
  attack: T1090
  if:
    type: text
    regex: curl_init\s*\(.{0,50}\$_(GET|POST|REQUEST)
  unless:
    # An application's own test fixtures proxy a request parameter on purpose
    # (SSRF and domain-limit test servers for a PHP firewall).
    - id: metadata/file/naming::test-directory-component
- id: google-search-scrape
  desc: Google search results scraping
  crit: notable
  conf: 0.85
  if:
    type: string_literal
    regex: 'google\.[a-z.]+/search\?.{0,50}site:'
composite_rules: []
