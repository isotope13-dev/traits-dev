defaults:
  platforms: [unix, windows]
  for: [php]
  attack: T1505.003,T1059
  mbc: B0030
composite_rules:
  # The shell argument must derive from Base64 decoding. A nearby
  # request decoder and byte-XOR loop support an encoded command channel;
  # this does not claim complete request-to-command taint resolution.
  - id: php-xor-request-command-channel
    desc: PHP decoded request, XOR and built shell command
    crit: hostile
    conf: 0.98
    near_bytes: 1024
    all:
      - id: micro-behaviors/data/decode/base64/structured::php-base64-request-param
      - id: micro-behaviors/data/encoding/xor/cyclic-key::php-byte-xor-transform-loop
      - id: micro-behaviors/process/create/shell/variable-command::php-base64-derived-shell-command
