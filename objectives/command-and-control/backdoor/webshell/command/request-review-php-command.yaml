defaults:
  platforms: [unix, windows]
  for: [php]
  crit: notable
  mbc: "E1059"
  attack: "T1059.004"
traits:
  - id: exec-user-input-cookie
    desc: PHP cookie parameter selects a shell command
    crit: suspicious
    conf: 0.98
    attack: T1059
    if:
      type: tree-sitter
      language: php
      query: |
        ((function_call_expression
          function: (name) @sink
          arguments: (arguments . (argument (subscript_expression
            (variable_name) @source))))
          (#match? @sink "(?i)^(exec|system|shell_exec)$")
          (#eq? @source "$_COOKIE")) @command
    unless:
      - id: metadata/package/documentation/security-exercise::fenced-pentest-methodology-documentation
    downgrade:
      scope: parent
      any:
        - id: metadata/package/documentation/security-catalog::parent-command-example-context
  - id: exec-user-input-cookie-alt
    desc: PHP cookie reaches passthru/popen/proc_open
    crit: suspicious
    conf: 0.98
    attack: T1059
    if:
      type: tree-sitter
      language: php
      query: |
        ((function_call_expression
          function: (name) @sink
          arguments: (arguments . (argument (subscript_expression
            (variable_name) @source))))
          (#match? @sink "(?i)^(passthru|popen|proc_open)$")
          (#eq? @source "$_COOKIE")) @command
    unless:
      - id: metadata/package/documentation/security-exercise::fenced-pentest-methodology-documentation
    downgrade:
      scope: parent
      any:
        - id: metadata/package/documentation/security-catalog::parent-command-example-context
# An exec-family call whose arguments reference a request superglobal. PHP
# subscripts/interpolations don't fold to arg facts, so these match the call
# form plus the superglobal as source text — the function list and the `(`
# keep them FP-safe. The function list is split into two atoms per superglobal
# to stay under the alt-chain limit (≤4 alternatives), mirroring the existing
# `exec-user-input-get-text--rx-*` decomposition. `$_GET` is already covered by
# the `exec-user-input-get-text` composite below.
# The pipe-process forms require the request as the first command argument;
# request data in a descriptor or output argument does not select a command.
  - id: exec-user-input-post--g1
    desc: $_POST reaches exec/system/shell_exec
    crit: suspicious
    conf: 0.85
    if:
      type: tree-sitter
      kind: call
      regex: \b(exec|system|shell_exec)\s*\([^;]{0,200}\$_POST
    unless:
      - id: well-known/tool/offensive/exploitdb::published-script-wrapper
      - id: metadata/package/documentation/security-exercise::fenced-pentest-methodology-documentation
    downgrade:
      scope: parent
      any:
        - id: metadata/package/documentation/security-catalog::parent-command-example-context
  - id: exec-user-input-post--g2
    desc: $_POST reaches passthru/popen/proc_open
    crit: suspicious
    conf: 0.85
    if:
      type: tree-sitter
      kind: call
      regex: '\b(passthru|popen|proc_open)\s*\(\s*\$_POST\s*\['
    unless:
      - id: metadata/package/documentation/security-exercise::fenced-pentest-methodology-documentation
    downgrade:
      scope: parent
      any:
        - id: metadata/package/documentation/security-catalog::parent-command-example-context
  - id: exec-user-input-request--g1
    desc: $_REQUEST reaches exec/system/shell_exec
    crit: suspicious
    conf: 0.85
    if:
      type: tree-sitter
      kind: call
      regex: \b(exec|system|shell_exec)\s*\([^;]{0,200}\$_REQUEST
    unless:
      - type: text
        regex: '\bescapeshell(arg|cmd)\s*\(\s*\$_REQUEST'
      - id: micro-behaviors/metaprogramming/generation/source::configured-assessment-plugin
      - id: micro-behaviors/metaprogramming/generation/source::parameterized-shell-command-builder
      - id: metadata/package/documentation/security-exercise::fenced-pentest-methodology-documentation
    downgrade:
      scope: parent
      any:
        - id: metadata/package/documentation/security-catalog::parent-command-example-context
  # A detector's own Go test file quoting webshell fixtures for its watcher
  # to flag: quoted payload, not a shipped execution path.
  - id: exec-user-input-request--g2
    desc: $_REQUEST reaches passthru/popen/proc_open
    crit: suspicious
    conf: 0.85
    if:
      type: tree-sitter
      kind: call
      regex: '\b(passthru|popen|proc_open)\s*\(\s*\$_REQUEST\s*\['
    unless:
      - id: metadata/package/documentation/security-exercise::fenced-pentest-methodology-documentation
    downgrade:
      scope: parent
      any:
        - id: metadata/package/documentation/security-catalog::parent-command-example-context
  - id: exec-user-input-get-text--rx-1
    desc: $_GET reaches exec/system
    crit: suspicious
    conf: 0.92
    if:
      type: tree-sitter
      kind: call
    # Match the selected call itself, not PHP source quoted in another call.
      regex: '^(exec|system)\s*\(\s*\$_GET\s*\[[^\]]{1,80}\]'
    unless:
      - id: metadata/file/format/security-corpus::attack-payload-corpus
      - id: metadata/package/documentation/security-exercise::fenced-pentest-methodology-documentation
      - id: metadata/package/testing/corpus/security-tests::rust-php-taint-parser-tests
    downgrade:
      scope: parent
      any:
        - id: metadata/file/format/security-corpus::attack-payload-corpus
        - id: metadata/package/documentation/security-catalog::parent-command-example-context
  - id: exec-user-input-get-text--rx-2
    desc: $_GET reaches shell_exec/passthru
    crit: suspicious
    conf: 0.92
    if:
      type: tree-sitter
      kind: call
      regex: '\b(shell_exec|passthru)\s*\(\s*\$_GET\s*\[[^\]]{1,80}\]'
    unless:
      - id: metadata/package/documentation/security-exercise::fenced-pentest-methodology-documentation
    downgrade:
      scope: parent
      any:
        - id: metadata/package/documentation/security-catalog::parent-command-example-context
  - id: exec-user-input-get-text--rx-3
    desc: $_GET reaches popen/proc_open
    crit: suspicious
    conf: 0.92
    if:
      type: tree-sitter
      kind: call
      regex: '\b(popen|proc_open)\s*\(\s*\$_GET\s*\[[^\]]{1,80}\]'
    unless:
      - id: metadata/package/documentation/security-exercise::fenced-pentest-methodology-documentation
    downgrade:
      scope: parent
      any:
        - id: metadata/package/documentation/security-catalog::parent-command-example-context

composite_rules:
  - id: exec-user-input
    desc: Command execution with user input
    crit: suspicious
    conf: 0.9
    any:
      - id: objectives/command-and-control/backdoor/webshell/command::exec-user-input-post--g1
      - id: objectives/command-and-control/backdoor/webshell/command::exec-user-input-post--g2
      - id: objectives/command-and-control/backdoor/webshell/command::exec-user-input-request--g1
      - id: objectives/command-and-control/backdoor/webshell/command::exec-user-input-request--g2
      - id: objectives/command-and-control/backdoor/webshell/command::exec-user-input-get-text
      - id: objectives/command-and-control/backdoor/webshell/command::exec-user-input-cookie
      - id: objectives/command-and-control/backdoor/webshell/command::exec-user-input-cookie-alt
    unless:
      - id: metadata/file/format/security-corpus::attack-payload-corpus
      - id: metadata/package/documentation/security-catalog::quoted-command-reference-contexts
      - id: metadata/package/documentation/security-exercise::fenced-pentest-methodology-documentation
      - id: "metadata/lang/source/shape::yara-rule-source"
      - id: well-known/tool/detection/anteumbra::anteumbra-package-tree-member
      - id: metadata/package/testing/corpus/security-tests::php-taint-engine-fixture-context
      - id: metadata/package/testing/corpus/security-tests::rust-php-taint-parser-tests
  # A webshell fixture embedded in a test corpus is data its detector asserts
  # on, not a shipped execution path.
    downgrade:
      scope: parent
      any:
        - id: metadata/file/format/security-corpus::attack-payload-corpus
        - id: metadata/package/documentation/security-catalog::parent-command-example-context
  - id: exec-user-input-get-text
    desc: GET input reaches command execution
    crit: suspicious
    conf: 0.92
    any:
      - id: objectives/command-and-control/backdoor/webshell/command::exec-user-input-get-text--rx-1
      - id: objectives/command-and-control/backdoor/webshell/command::exec-user-input-get-text--rx-2
      - id: objectives/command-and-control/backdoor/webshell/command::exec-user-input-get-text--rx-3
    unless:
      - id: metadata/file/format/security-corpus::attack-payload-corpus
      - id: metadata/package/documentation/security-catalog::quoted-command-reference-contexts
      - id: metadata/package/documentation/security-exercise::fenced-pentest-methodology-documentation
      - id: metadata/build/generated::php-empty-function-declarations
      - id: metadata/build/generated::php-manual-empty-function-stubs
      - id: metadata/package/testing/corpus/security-tests::php-taint-engine-fixture-context
      - id: metadata/package/testing/corpus/security-tests::rust-php-taint-parser-tests
    downgrade:
      scope: parent
      any:
        - id: metadata/package/documentation/security-catalog::parent-command-example-context
