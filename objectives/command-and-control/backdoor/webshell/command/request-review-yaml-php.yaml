defaults:
  platforms:
    - unix
    - windows
  for:
    - php
composite_rules:
  - id: php-request-command-yaml-url-data
    desc: YAML URL data contains request-fed PHP command
    crit: suspicious
    conf: 0.96
    all:
      - id: metadata/lang/source/origin::yaml-percent-decoded-source-layer
      - id: micro-behaviors/process/create/shell/command-string::php-system-call
      - id: objectives/command-and-control/backdoor/webshell/request/command::php-system-request-source
    downgrade:
      scope: parent
      any:
        - id: metadata/package/documentation/security-testing::nuclei-http-request-matcher-template
