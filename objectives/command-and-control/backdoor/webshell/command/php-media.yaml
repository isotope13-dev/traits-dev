defaults:
  platforms: [unix, windows]
  for: [media]
  attack: T1505.003,T1027.009
composite_rules:
  - id: media-php-request-command-webshell
    desc: PHP in media executes HTTP request commands
    crit: hostile
    conf: 0.99
    near_bytes: 128
    all:
      - id: micro-behaviors/data/embedded/payload/media::php-open-tag-in-media
      - id: micro-behaviors/data/embedded/payload/media::php-request-command-call
