defaults:
  platforms: [unix, windows]
  for: [media]
  attack: T1027,T1505.003
  mbc: B0030

composite_rules:
  - id: media-php-eval-webshell
    desc: Media PHP request-driven eval webshell
    crit: hostile
    conf: 0.99
    all:
      - id: micro-behaviors/data/embedded/payload/media::php-open-tag-in-media
      - id: micro-behaviors/data/embedded/payload/media::php-request-input-in-media
      - id: micro-behaviors/data/embedded/payload/media::dynamic-eval-in-media
