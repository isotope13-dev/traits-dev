# PHP Webshell: Dynamic Function Execution Patterns
# 
# This trait detects advanced obfuscation techniques used in PHP webshells
# that evade simple keyword-based detection.
# 
# MBC: B0030 (C2 Communication), B0032 (Obfuscation)
# ATT&CK: T1505.003 (Web Shell), T1027 (Obfuscated Files/Information)
defaults:
  platforms:
    - windows
    - unix
  for:
    - php

traits:
  # A dynamic-dispatch call whose callee argument is built by string
  # concatenation (`call_user_func($a . $b, ...)`). The callee anchor is what
  # keeps this precise: concatenation in a call argument is ordinary PHP, but
  # concatenation feeding the *dispatch* family can hide the callable name.
  - id: forward-static-call-concat
    desc: Dispatch call concatenates callable name
    crit: suspicious
    conf: 0.95
    attack: T1027
    mbc: B0032
    if:
      type: tree-sitter
      query: |
        (function_call_expression
          function: (name) @fn
          arguments: (arguments
            (argument
              (binary_expression operator: ".")))
          (#any-of? @fn
            "call_user_func" "call_user_func_array"
            "forward_static_call" "forward_static_call_array"))
    unless:
      # php-http/discovery builds a static class-method callable from its
      # fixed strategy registry. Its Composer package identity and source
      # path provide stronger benign context than the dispatch syntax alone.
      - id: well-known/lib/core/php-http-discovery::library-context
      - id: well-known/lib/format/gettext-languages::library-context
      - id: well-known/app/publishing/wordpress-plugins::wordpress-plugin-path-seraphinite-accelerator
  
  # forward_static_call_array alone (less common than call_user_func_array)
  - id: forward-static-call-array
    desc: Dynamic dispatch via forward_static_call_array
    crit: suspicious
    conf: 0.85
    mbc: B0030
    attack: T1505.003
    if:
      type: symbol
      kind: call
      exact: forward_static_call_array
    unless:
      - id: well-known/lib/runtime/php-runtime::source-tree
      # MVC routers dispatch Controller@method static handlers via reflection.
      - type: text
        regex: 'new ReflectionMethod\([^)]+\)[\s\S]{0,400}?forward_static_call_array\s*\(\s*array\s*\('

  # NOTE: a bare `call_user_func_array` trait was removed here. Its desc claimed
  # "with binary_operation (dynamic exec)" but a lenient migration left it
  # matching ANY call_user_func_array — the standard PHP dispatch function used
  # by WordPress hooks, Freemius, and virtually every framework — firing
  # suspicious standalone on legitimate code. The genuine obfuscated-dispatch
  # case (concatenated/dynamic function name) is already covered by
  # `forward-static-call-concat` above.
  # `$_REQUEST['cmd'](...)` — the callee itself is read straight out of a
  # request superglobal, so the attacker names the function being invoked.
  # Distinct from dispatch::array-index-dynamic-call, which only covers
  # integer-indexed callees (`$matches[1](...)`).
  #
  # NOTE: a `var-string-concat-in-call` trait was removed here. Its query was
  # written against a grammar that does not exist (`binary_op`) and so never
  # matched. The tree-sitter-php analyzer rejects combining `operator:` with
  # `left:` on one `binary_expression`, so "concatenation whose left operand is
  # a variable" is not expressible; without the operand constraint the trait is
  # just "a call with a concatenated argument", which is ordinary PHP. The
  # obfuscated-dispatch case it aimed at is covered by
  # `forward-static-call-concat` above, which anchors the callee instead.
  - id: request-as-function-variable
    desc: Request superglobal drives the callee name
    crit: suspicious
    conf: 0.85
    attack: T1505.003
    mbc: B0030
    if:
      type: tree-sitter
      query: |
        (function_call_expression
          function: (subscript_expression
            (variable_name) @superglobal)
          (#any-of? @superglobal "$_REQUEST" "$_GET" "$_POST" "$_COOKIE"))

  # Substring from HTTP to build function name
  - id: http-substring-to-execution
    desc: HTTP header substring in dynamic call
    crit: suspicious
    conf: 0.85
    attack: T1505.003
    mbc: B0030
    unless:
      - id: well-known/app/publishing/matomo/
      - id: well-known/app/enterprise/egroupware/
      - id: well-known/lib/runtime/php-runtime::source-tree
      - id: well-known/app/communication/postfixadmin::postfixadmin-source-path
    # `substr($_SERVER['HTTP_...'])` is common in benign request handling, for
    # example truncating User-Agent. Require it as an argument to PHP dynamic
    # dispatch rather than treating the substring operation itself as execution.
    if:
      type: text
      regex: '(?i)call_user_func.{0,90}substr\s*\(\s*\$_SERVER\s*\[\s*[''"]HTTP'

composite_rules:
  # Obfuscated PHP webshell: uses string concatenation to hide function name
  - id: obfuscated-webshell-pattern
    desc: Obfuscated PHP webshell (string concat + dynamic call)
    crit: suspicious
    conf: 0.95
    attack: T1505.003
    mbc: B0030
    all:
      - id: objectives/command-and-control/backdoor/webshell/obf-dispatch::forward-static-call-concat
    any:
      - id: micro-behaviors/communications/http/request/params::server-referer
      - id: objectives/command-and-control/backdoor/webshell/obf-dispatch::forward-static-call-array

  # Request-driven dynamic dispatch: an integer-indexed variable function call
  # (`$matches[1]($matches[2])`) sitting next to a request-superglobal read is
  # the cookie/GET-driven webshell shape — the callee name and its argument are
  # both attacker-supplied. The proximity keeps legitimate dispatch tables
  # (which don't read raw request superglobals to name the callee) out.
  - id: request-driven-array-dynamic-call
    desc: Request data drives an array-indexed dynamic call
    crit: hostile
    conf: 0.9
    attack: T1505.003
    mbc: B0030
    all:
      - id: micro-behaviors/process/interpreter/reflection/dispatch::array-index-dynamic-call
      - id: micro-behaviors/communications/http/request/params
    near_lines: 2
    unless:
      - id: metadata/package/testing/harness/unit/
      - id: well-known/lib/runtime/php-runtime::source-tree
