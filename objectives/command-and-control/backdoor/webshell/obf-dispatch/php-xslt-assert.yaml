defaults:
  platforms: [unix, windows]
  for: [php]

traits:
  - id: xslt-php-assert-call
    desc: XSLT calls PHP assert
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: 'function\s*\(.{0,5}assert'
composite_rules:
  - id: php-xslt-request-assert-webshell
    desc: XSLT evaluates request code through assert
    crit: hostile
    conf: 0.97
    attack: T1505.003,T1059.004
    all:
      - id: register-php-functions
      - id: xslt-php-assert-call
      - id: micro-behaviors/data/control-flow/assert::php-assert-request-subscript-text
