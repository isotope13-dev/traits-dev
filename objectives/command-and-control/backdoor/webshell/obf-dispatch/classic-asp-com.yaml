# Classic ASP shells that hide which COM object they instantiate.
#
# The whole point of `Set o = CreateObject("WScript.Shell")` in a web page is
# command execution, and that literal is what every ASP webshell scanner keys
# on. The evasion is mechanical: chop the ProgID into two- and three-character
# pieces, glue them back together with a variable between each piece, and hand
# the resulting variable to CreateObject. Nothing about the page's behaviour
# changes -- only its readability to a scanner -- which is why the assembled
# form is scored where the literal one would be.
#
# The request leg is what separates this from an obfuscated standalone script:
# a page that reads Request.Form / Request.QueryString and instantiates a
# concealed COM object is reachable by whoever can reach the URL.
defaults:
  platforms: [windows]
  for: [vbs, html]
  attack: T1505.003,T1027
  mbc: B0030

composite_rules:
  - id: asp-concealed-progid-request-shell
    desc: ASP page instantiates a concealed COM ProgID
    crit: hostile
    conf: 0.96
    all:
      - id: objectives/anti-static/obfuscation/wsh::vbs-splintered-string-concat
      - id: objectives/anti-static/obfuscation/wsh::vbs-createobject-variable-arg
      - id: micro-behaviors/communications/http/request/params::classic-asp-request-field
    unless:
      - id: metadata/lang/source::yara-rule-source
      - id: metadata/package/testing/presence/fixture::test-declaration-call
