defaults:
  platforms: [windows, unix]
  for: [php]
  attack: T1505.003
  mbc: B0030

traits:
  - id: php-request-data-callback
    desc: PHP callback from request data array
    crit: suspicious
    conf: 0.94
    if:
      type: text
      regex: '\bcall_user_func(_array)?\s*\(\s*\$(post|request|input)\s*\['
      case_insensitive: true

  - id: php-request-callback-assignment
    desc: PHP request value assigned as callback
    crit: notable
    conf: 0.92
    if:
      type: text
      regex: '\$(callback|handler)\s*=\s*\$_(GET|POST|REQUEST)\s*\['

  - id: php-placeholder-callback
    desc: PHP callback from placeholder data
    crit: suspicious
    conf: 0.94
    if:
      type: text
      regex: '\bcall_user_func(_array)?\s*\(\s*\$this->placeholdered_data\s*\['

  - id: php-invoke-dynamic-call
    desc: __invoke forwards into a dynamic call
    crit: notable
    conf: 0.93
    if:
      type: text
      regex: '(?is)function\s+__invoke\s*\([^)]{0,40}\)[\s\S]{0,80}\$\w+\(\s*\$\w+\s*\)'

  - id: php-post-superglobal-name-loop
    desc: Loops POST keys into variable variables
    crit: suspicious
    conf: 0.95
    if:
      type: text
      regex: "foreach\\s*\\(\\s*array\\s*\\(\\s*['\"]_POST['\"]"

composite_rules:
  - id: php-request-data-callback-dispatch
    desc: PHP request data callback
    crit: suspicious
    conf: 0.96
    all:
      - id: php-request-data-callback
    any:
      - id: micro-behaviors/process/interpreter/reflection/dispatch::php-callback-dispatch
      - id: micro-behaviors/metaprogramming/reflection::php-callback-array-dispatch

  - id: php-request-variable-callback
    desc: PHP request variable callback
    crit: suspicious
    conf: 0.95
    all:
      - id: php-request-callback-assignment
    any:
      - id: micro-behaviors/process/interpreter/reflection/dispatch::php-callback-dispatch
      - id: micro-behaviors/metaprogramming/reflection::php-callback-array-dispatch
    near_bytes: 512

  - id: php-placeholder-callback-dispatch
    desc: PHP placeholder callback dispatch
    crit: suspicious
    conf: 0.96
    all:
      - id: php-placeholder-callback
    any:
      - id: micro-behaviors/process/interpreter/reflection/dispatch::php-callback-dispatch
      - id: micro-behaviors/metaprogramming/reflection::php-callback-array-dispatch

  - id: php-reflection-invoke-webshell
    desc: Reflection constructs an invoke callback shell
    crit: hostile
    conf: 0.97
    all:
      - id: php-invoke-dynamic-call
    any:
      - id: micro-behaviors/process/interpreter/reflection/resolve::reflection-class-instantiation
      - id: micro-behaviors/process/interpreter/reflection/resolve::reflection-class-name-literal
    unless:
      - id: well-known/lib/development/phpstan::phpstan-phar-path

  - id: php-reflection-post-varvars
    desc: Reflection instantiates POST variable-variables
    crit: hostile
    conf: 0.96
    all:
      - id: php-post-superglobal-name-loop
    any:
      - id: micro-behaviors/process/interpreter/reflection/resolve::reflection-class-instantiation
      - id: micro-behaviors/process/interpreter/reflection/resolve::reflection-class-name-literal

  - id: php-post-invoke-webshell
    desc: POST keys drive an invoke callback
    crit: hostile
    conf: 0.96
    all:
      - id: php-post-superglobal-name-loop
      - id: php-invoke-dynamic-call
