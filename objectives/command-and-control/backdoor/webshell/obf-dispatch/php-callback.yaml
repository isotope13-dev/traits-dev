defaults:
  platforms: [windows, unix]
  for: [php]
  attack: T1505.003
  mbc: B0030

traits:
  - id: php-direct-request-callback
    desc: PHP request value passed to callback
    crit: suspicious
    conf: 0.97
    if:
      type: text
      regex: '\bcall_user_func(_array)?\s*\(\s*\$_(GET|POST|REQUEST)\s*\['

  - id: php-request-data-callback
    desc: PHP callback from request data array
    crit: suspicious
    conf: 0.94
    if:
      type: text
      regex: '\bcall_user_func(_array)?\s*\(\s*\$(post|request|input)\s*\['
      case_insensitive: true

  - id: php-request-callback-assignment
    desc: PHP request value assigned as callback
    crit: suspicious
    conf: 0.92
    if:
      type: text
      regex: '\$(callback|handler)\s*=\s*\$_(GET|POST|REQUEST)\s*\['

  - id: php-placeholder-callback
    desc: PHP callback from placeholder data
    crit: suspicious
    conf: 0.94
    if:
      type: text
      regex: '\bcall_user_func(_array)?\s*\(\s*\$this->placeholdered_data\s*\['

composite_rules:
  - id: php-request-callback-webshell
    desc: PHP request callback webshell
    crit: hostile
    conf: 0.98
    all:
      - id: php-direct-request-callback
    any:
      - id: micro-behaviors/os/callback/dispatch::php-callback-dispatch
      - id: micro-behaviors/os/callback/dispatch::php-callback-array-dispatch
    near_bytes: 512

  - id: php-request-data-callback-dispatch
    desc: PHP request data callback
    crit: suspicious
    conf: 0.96
    all:
      - id: php-request-data-callback
    any:
      - id: micro-behaviors/os/callback/dispatch::php-callback-dispatch
      - id: micro-behaviors/os/callback/dispatch::php-callback-array-dispatch

  - id: php-request-variable-callback
    desc: PHP request variable callback
    crit: suspicious
    conf: 0.95
    all:
      - id: php-request-callback-assignment
    any:
      - id: micro-behaviors/os/callback/dispatch::php-callback-dispatch
      - id: micro-behaviors/os/callback/dispatch::php-callback-array-dispatch
    near_bytes: 512

  - id: php-placeholder-callback-dispatch
    desc: PHP placeholder callback dispatch
    crit: suspicious
    conf: 0.96
    all:
      - id: php-placeholder-callback
    any:
      - id: micro-behaviors/os/callback/dispatch::php-callback-dispatch
      - id: micro-behaviors/os/callback/dispatch::php-callback-array-dispatch
