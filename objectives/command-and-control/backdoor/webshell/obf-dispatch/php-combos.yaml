---
defaults:
  platforms:
  - windows
  - unix
  for:
  - php
composite_rules:
- id: php-eval-base64-backdoor
  desc: 'PHP backdoor: eval of base64 payload'
  crit: suspicious
  conf: 0.99
  mbc: B0030
  attack: T1505.003
  all:
  - id: micro-behaviors/data/decode/base64::php-large-literal-base64-decode
  - id: objectives/anti-static/obfuscation/code-metrics/identifiers::php-webshell-pattern
# The desc used to read "PHP: obfuscated dynamic backdoor (dynamic" -- truncated
# mid-parenthesis, so the finding line trailed off in the UI. Say what the legs
# prove: a shell-execution call in a file whose identifiers or strings look
# obfuscated.
#
# `unless:` on the protobuf identity: protoc-generated GPBMetadata classes embed
# the .proto FileDescriptorProto as a raw binary blob inside a PHP string. Bytes
# in that blob satisfy both halves of this rule by coincidence -- a 0x60 reads
# as `process/create/shell/lang::backtick`, and the high bytes read as
# `php-non-ascii-name` -- so every PHP gRPC client shipped a "webshell".
#
# The namespace atom is the right gate rather than the generated-source
# composite: that composite also requires the hex2bin() descriptor spelling,
# and when protoc emits the descriptor as a raw binary literal the blob defeats
# the PHP parser (this file yields one symbol), so no call-based leg survives.
# `namespace GPBMetadata\` is declarative, always present, and nothing
# hand-written declares itself there. webshell/decoder/php.yaml already gates
# on the same atom.
- id: php-obfuscated-dynamic-backdoor
  desc: 'PHP shell call with obfuscated identifiers'
  crit: suspicious
  conf: 0.98
  mbc: B0032
  attack: T1027
  all:
  - id: micro-behaviors/process/create/shell/
  any:
  - id: objectives/anti-static/obfuscation/code-metrics/identifiers::php-obfuscated-vars
  - id: objectives/anti-static/obfuscation/code-metrics/identifiers::php-encoded-strings
  unless:
  - id: well-known/lib/format/protobuf::php-gpbmetadata-namespace
# Same truncated-desc and same protobuf exposure as the rule above: the binary
# descriptor blob is almost entirely non-ASCII, so it maximises the non-ASCII
# ratio leg.
- id: php-non-ascii-backdoor
  desc: 'PHP shell call in mostly non-ASCII source'
  crit: suspicious
  conf: 0.98
  mbc: B0032
  attack: T1027
  all:
  - id: micro-behaviors/process/create/shell/
  - id: objectives/anti-static/obfuscation/code-metrics/identifiers::php-high-non-ascii-ratio
  unless:
  - id: well-known/lib/format/protobuf::php-gpbmetadata-namespace
- id: php-variable-function-backdoor
  desc: 'PHP webshell: user input as function call'
  crit: suspicious
  conf: 0.99
  mbc: B0030
  attack: T1505.003
  all:
  - id: objectives/command-and-control/backdoor/webshell/obf-dispatch::dynamic-user-input-call
  - id: micro-behaviors/process/create/shell/
  any:
  - id: micro-behaviors/communications/http/request/
  - id: micro-behaviors/fs/write/
  - id: micro-behaviors/fs/read/
- id: php-junk-str-replace-webshell
  desc: 'PHP webshell: junk-injection str_replace code assembly'
  crit: hostile
  conf: 0.99
  mbc: B0030
  attack: T1505.003
  all:
  - id: objectives/anti-static/obfuscation/string/conceal::str-replace-func-name-deob
  - id: objectives/execution/interpreter/eval/remote::create-function-junk-injected
  any:
  - id: objectives/command-and-control/backdoor/webshell/session::referer-accept-lang-c2-pair
  - id: objectives/execution/interpreter/eval/remote::ob-start-eval-capture
  - id: objectives/execution/interpreter/eval/remote::eval-gz-b64-chain-in-string
- id: php-hex-dispatch-webshell
  desc: 'PHP webshell: hex-encoded function names with dynamic dispatch'
  crit: suspicious
  conf: 0.98
  mbc: B0030
  attack: T1505.003
  all:
  - id: micro-behaviors/data/decode/hex::chr-hexdec-call
  - id: objectives/anti-static/obfuscation/encoding/hex::integer-indexed-func-dispatch
  - id: micro-behaviors/communications/http/request/
  any:
  - id: objectives/anti-static/obfuscation/encoding/hex::hex-string-func-array
  - id: micro-behaviors/fs/write/
  - id: micro-behaviors/fs/chmod/modify/
