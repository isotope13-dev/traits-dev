defaults:
  platforms:
    - windows
    - unix
  for:
    - php
composite_rules:
  - id: php-eval-base64-backdoor
    desc: 'PHP backdoor: eval of base64 payload'
    crit: suspicious
    conf: 0.99
    mbc: B0030
    attack: T1505.003
    all:
      - id: micro-behaviors/data/decode/embedded/base64::php-large-literal-base64-decode
      - id: objectives/anti-static/obfuscation/source-layout::php-long-line-entropy-profile
  - id: php-obfuscated-dynamic-backdoor
    desc: Obfuscated PHP dynamic function call with shell execution
    crit: suspicious
    conf: 0.98
    mbc: B0030
    attack: T1505.003
    all:
      - id: micro-behaviors/process/create/shell/
      - id: micro-behaviors/data/control-flow/dispatch/computed::php-variable-function-call
      - id: micro-behaviors/communications/http/request/superglobal::php-request-parameter-access
    any:
      - id: metadata/lang/source/naming/population::php-high-entropy-short-identifiers
      - id: metadata/lang/source/literal/string/population::high-average-string-entropy
    unless:
      - id: well-known/lib/format/protobuf::php-gpbmetadata-namespace
  - id: php-non-ascii-backdoor
    desc: PHP shell call in mostly non-ASCII source
    crit: suspicious
    conf: 0.98
    mbc: B0032
    attack: T1027
    all:
      - id: micro-behaviors/process/create/shell/
      - id: metadata/file/encoding/shape::php-high-non-ascii-ratio
    unless:
      - id: well-known/lib/format/protobuf::php-gpbmetadata-namespace
  - id: php-variable-function-backdoor
    desc: 'PHP webshell: user input as function call'
    crit: suspicious
    conf: 0.99
    mbc: B0030
    attack: T1505.003
    all:
      - id: objectives/command-and-control/backdoor/webshell/obf-dispatch::dynamic-user-input-call
      - id: micro-behaviors/process/create/shell/
    any:
      - id: micro-behaviors/communications/http/request
      - id: micro-behaviors/fs/write
      - id: micro-behaviors/fs/read/
  - id: php-xor-assembled-dispatch-webshell
    desc: PHP webshell with XOR string assembly and dynamic dispatch
    crit: hostile
    conf: 0.98
    mbc: B0030
    attack: T1505.003
    all:
      - id: micro-behaviors/data/control-flow/dispatch/computed::php-variable-function-call
      - id: micro-behaviors/data/string/assembly::php-xor-char-chain
    any:
      - id: micro-behaviors/metaprogramming/reflection/resolve::php-variable-variable-dereference
      - id: objectives/command-and-control/backdoor/webshell/stager::xor-built-request-superglobal
      - id: micro-behaviors/communications/http/request
  - id: php-char-code-assembled-dispatch-webshell
    desc: Character-assembled dynamic webshell
    crit: hostile
    conf: 0.98
    mbc: B0030
    attack: T1505.003
    all:
      - id: micro-behaviors/data/control-flow/dispatch/computed::php-variable-function-call
      - id: micro-behaviors/data/string/assembly::php-chr-slice-char-chain
      - id: micro-behaviors/communications/http/request
    unless:
      - id: metadata/package/testing/presence/path::php-test-or-fixture-path
  - id: php-xor-decoded-dispatch-webshell
    desc: XOR-decoded PHP webshell dynamic dispatch
    crit: hostile
    conf: 0.98
    mbc: B0030
    attack: T1505.003
    near_bytes: 1024
    all:
      - id: micro-behaviors/communications/http/request/superglobal::php-request-parameter-access
      - id: micro-behaviors/data/decode/xor/reconstruction::php-hex-xor-reconstruction
    any:
      - id: micro-behaviors/data/collection/array::php-array-callback-dynamic-callable
      - id: micro-behaviors/data/control-flow/dispatch/computed::php-variable-function-call
      - id: micro-behaviors/data/control-flow/dispatch/computed::php-computed-expression-call
      - id: micro-behaviors/metaprogramming/reflection/invoke::php-dispatcher-dynamic-callable
  - id: php-junk-str-replace-webshell
    desc: 'PHP webshell: junk-injection str_replace code assembly'
    crit: hostile
    conf: 0.99
    mbc: B0030
    attack: T1505.003
    all:
      - id: objectives/anti-static/obfuscation/string/conceal::str-replace-func-name-deob
      - id: objectives/execution/interpreter/eval/remote::create-function-junk-injected
    any:
      - id: objectives/command-and-control/backdoor/webshell/session::referer-accept-lang-c2-pair
      - id: objectives/execution/interpreter/eval/remote::ob-start-eval-capture
      - id: objectives/execution/interpreter/eval/remote::eval-gz-b64-chain-in-string
  - id: php-hex-dispatch-webshell
    desc: 'PHP webshell: hex-encoded function names with dynamic dispatch'
    crit: suspicious
    conf: 0.98
    mbc: B0030
    attack: T1505.003
    all:
      - id: micro-behaviors/data/decode/hex::chr-hexdec-call
      - id: micro-behaviors/data/control-flow/dispatch/computed::integer-indexed-func-dispatch
      - id: micro-behaviors/communications/http/request
    any:
      - id: metadata/lang/encoding/hex::php-dense-hex-string-literals
      - id: micro-behaviors/fs/write
      - id: micro-behaviors/fs/chmod/modify/
      - id: micro-behaviors/fs/chmod/executable/mode::desktop-exec-chmod-exec
      - id: micro-behaviors/fs/chmod/executable/mode::desktop-exec-chmod-octal
      - id: micro-behaviors/fs/chmod/executable/mode::desktop-exec-chmod
      - id: micro-behaviors/fs/file/create::node-create-restricted-mode
      - id: micro-behaviors/fs/acl::cacls-grant-everyone-full
      - id: micro-behaviors/fs/acl::icacls-grant-everyone-full-shell
      - id: micro-behaviors/fs/acl::icacls-grant-everyone-full
      - id: micro-behaviors/fs/acl::icacls-grant-replace-admins-system
