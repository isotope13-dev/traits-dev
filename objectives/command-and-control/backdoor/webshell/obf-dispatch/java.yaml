# Java webshells that avoid declaring an interface for their payload classes by
# reusing a method every Object already has. The loader defines a class from
# delivered bytes and then reaches its entry point reflectively through
# `getMethod("equals", Object.class)` (or `hashCode`/`toString`), passing the
# page context or session key as the argument. Application code that genuinely
# wants `equals` calls it directly; looking it up by reflection only makes
# sense when the class on the other end was not known at compile time.
defaults:
  platforms: [unix, windows]
  for: [java, kotlin, groovy, scala]
  attack: T1505.003
  mbc: B0030

traits:
  - id: java-reflective-object-method-entrypoint
    desc: Reflective Object-method entry point
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: 'getMethod\s*\(\s*["''](equals|hashCode|toString)["'']'

composite_rules:
  - id: java-defineclass-object-method-dispatch
    desc: Defined class invoked via reflection
    crit: hostile
    conf: 0.95
    all:
      - id: java-reflective-object-method-entrypoint
      - id: micro-behaviors/data/source/dynamic/reflect::java-defineclass
      - id: micro-behaviors/data/source/dynamic/reflect::java-method-invoke
