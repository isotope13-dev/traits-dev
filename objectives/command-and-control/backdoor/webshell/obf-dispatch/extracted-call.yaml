defaults:
  platforms: [linux, macos, windows]
  for: [php]
  attack: T1505.003
  mbc: B0030
traits:
- id: request-import-immediate-dynamic-call
  desc: Adjacent request import and variable-call text
  crit: notable
  conf: 0.95
  if:
    type: text
    regex: 'extract\s*\(\$_REQUEST\);\s*@?(die\s*\(\s*)?\$\w+\s*\(\s*\$\w+\s*\)'
composite_rules:
- id: request-extracted-call-response
  desc: Request variable import with dynamic-call response
  crit: hostile
  conf: 0.9
  near_lines: 3
  near_bytes: 128
  all:
  - id: request-import-immediate-dynamic-call
  - id: micro-behaviors/communications/http/request/superglobal::extract-request
  - id: micro-behaviors/process/exit/terminate::exit-dynamic-call-result
