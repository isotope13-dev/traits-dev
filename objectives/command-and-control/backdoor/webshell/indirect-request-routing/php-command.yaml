defaults:
  platforms: [unix, windows]
  for: [php]
  attack: T1505.003
  mbc: B0030

traits:
  - id: php-request-shell-field-fragment
    desc: PHP request shell field assignment
    crit: component
    conf: 0.98
    if:
      type: text
      regex: "\\$shell\\s*=\\s*\\$_REQUEST\\s*\\[\\s*['\"]shell['\"]\\s*\\]"
  - id: php-shell-object-property-fragment
    desc: PHP shell variable copied to object property
    crit: component
    conf: 0.98
    if:
      type: text
      regex: '\$[A-Za-z_]\w*\s*->\s*shell\s*=\s*\$shell'
  - id: php-shell-object-sink-fragment
    desc: PHP system consumes shell object property
    crit: component
    conf: 0.98
    if:
      type: text
      regex: 'system\s*\(\s*\$this\s*->\s*shell\s*\)'

composite_rules:
  - id: php-class-property-request-command-webshell
    desc: PHP command webshell routes its shell field through an object property
    crit: hostile
    conf: 0.99
    all:
      - id: micro-behaviors/ui/controls/input::php-command-named-form-control
      - id: micro-behaviors/process/create/shell/command-string::php-system-call
      - id: php-request-shell-field-fragment
      - id: php-shell-object-property-fragment
      - id: php-shell-object-sink-fragment
