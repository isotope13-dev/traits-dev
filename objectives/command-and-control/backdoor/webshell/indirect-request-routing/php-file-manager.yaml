defaults:
  platforms: [unix, windows]
  for: [php]
  attack: T1505.003
  mbc: B0030

traits:
  # Partial source fragments only; the composite binds them to complete
  # request-to-file-operation paths.
  - id: php-request-delete-field-fragment
    desc: PHP source reads the request delete field
    crit: component
    conf: 0.98
    if:
      type: text
      regex: "\\$_REQUEST\\s*\\[\\s*['\"]del['\"]\\s*\\]"
  - id: php-delete-object-property-fragment
    desc: PHP delete field copied to object property
    crit: component
    conf: 0.98
    if:
      type: text
      regex: '\$[A-Za-z_]\w*\s*->\s*del\s*=\s*\$del'
  - id: php-object-property-delete-sink-fragment
    desc: PHP unlink consumes delete object property
    crit: component
    conf: 0.98
    if:
      type: text
      regex: 'unlink\s*\(\s*\$this\s*->\s*del\s*\)'
  - id: php-request-edit-content-fragment
    desc: PHP posted file content assignment
    crit: component
    conf: 0.98
    if:
      type: text
      regex: "\\$_POST\\s*\\[\\s*['\"]fichier['\"]\\s*\\]"
  - id: php-edit-object-property-fragment
    desc: PHP posted content copied to object property
    crit: component
    conf: 0.98
    if:
      type: text
      regex: '\$[A-Za-z_]\w*\s*->\s*fichier\s*=\s*\$fichier'
  - id: php-object-property-write-sink-fragment
    desc: PHP fwrite consumes posted content property
    crit: component
    conf: 0.98
    if:
      type: text
      regex: 'fwrite\s*\(\s*\$fp\s*,\s*\$this\s*->\s*fichier\s*\)'
  - id: php-request-view-file-field-fragment
    desc: PHP source reads request-selected file path
    crit: component
    conf: 0.98
    if:
      type: text
      regex: "\\$_REQUEST\\s*\\[\\s*['\"]file['\"]\\s*\\]"
  - id: php-view-file-object-property-fragment
    desc: PHP selected file copied to object property
    crit: component
    conf: 0.98
    if:
      type: text
      regex: '\$[A-Za-z_]\w*\s*->\s*file\s*=\s*\$file'
  - id: php-object-property-file-read-fragment
    desc: PHP highlight_file reads file property
    crit: component
    conf: 0.98
    if:
      type: text
      regex: 'highlight_file\s*\(\s*\$this\s*->\s*file\s*\)'
  - id: php-post-copy-source-fragment
    desc: PHP source reads posted copy source path
    crit: component
    conf: 0.98
    if:
      type: text
      regex: "\\$_POST\\s*\\[\\s*['\"]cfichier['\"]\\s*\\]"
  - id: php-post-copy-destination-fragment
    desc: PHP source reads posted copy destination path
    crit: component
    conf: 0.98
    if:
      type: text
      regex: "\\$_POST\\s*\\[\\s*['\"]cdestination['\"]\\s*\\]"
  - id: php-post-copy-paths-sink-fragment
    desc: PHP copy uses posted paths
    crit: component
    conf: 0.98
    if:
      type: text
      regex: 'copy\s*\(\s*\$cfichier\s*,\s*\$cdestination\s*\)'

composite_rules:
  - id: php-request-object-file-manager-webshell
    desc: PHP request-controlled file manager edits and deletes server files
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/communications/http/request/superglobal::request-param-assignment
      - id: micro-behaviors/fs/directory/readdir/language::php-opendir
      - id: micro-behaviors/fs/directory/readdir/language::php-readdir-call
      - id: micro-behaviors/fs/write/file/handle::php-fwrite
      - id: micro-behaviors/fs/delete/file/library::php-unlink
      - id: micro-behaviors/fs/file/copy/call::copy-call
      - id: php-request-view-file-field-fragment
      - id: php-view-file-object-property-fragment
      - id: php-object-property-file-read-fragment
      - id: php-post-copy-source-fragment
      - id: php-post-copy-destination-fragment
      - id: php-post-copy-paths-sink-fragment
      - id: php-request-delete-field-fragment
      - id: php-delete-object-property-fragment
      - id: php-object-property-delete-sink-fragment
      - id: php-request-edit-content-fragment
      - id: php-edit-object-property-fragment
      - id: php-object-property-write-sink-fragment
