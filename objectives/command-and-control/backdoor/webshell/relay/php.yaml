composite_rules:
- id: php-webshell-command-relay
  desc: PHP prepares WSO tasks for stored endpoints
  crit: hostile
  conf: 0.99
  attack: T1505.003,T1071.001
  all:
  - id: metadata/lang/scripted::php-open-tag
  - id: micro-behaviors/communications/http/request/superglobal::post-dup
  - id: micro-behaviors/data/encode/url::http-build-query-call
  - id: php-wso-action-argument
  - id: micro-behaviors/data/property/access::php-url-password-record
  any:
  # Retain the reviewed helper form, and recognize renamed helpers from the
  # query-body argument relationship. Request field names are operator choices.
  - id: micro-behaviors/data/control-flow/dispatch/named::php-get-content-call
  - id: micro-behaviors/communications/http/request/body/construction::php-query-body-url-helper
- id: php-webshell-endpoint-registry
  desc: PHP probes and unserializes remote shell records
  crit: hostile
  conf: 0.98
  attack: T1505.003,T1071.001
  all:
  - id: metadata/lang/scripted::php-open-tag
  - id: micro-behaviors/data/encode/url::http-build-query-call
  - id: micro-behaviors/communications/http/request/body/construction::php-query-body-url-helper
  - id: micro-behaviors/data/serialize/object::unserialize
  - id: micro-behaviors/data/property/access::php-url-password-record
traits:
- id: php-wso-action-argument
  desc: PHP constructs WSO action and task fields
  crit: suspicious
  conf: 0.96
  if:
    type: text
    regex: '[''"]a[''"]\s*=>\s*[''"](RC|FilesMan|Console|SqlS)[''"][\s\S]{0,120}[''"]p1[''"]\s*=>'
  size_max: 5000000
defaults:
  platforms:
  - windows
  - unix
  for:
  - php
