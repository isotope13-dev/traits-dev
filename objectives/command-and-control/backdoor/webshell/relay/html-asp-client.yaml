# An operator-side controller, not a server-side ASP implant. Dual-use:
# these indicators alone do not prove an unauthorized target.
defaults:
  platforms: [windows]
  for: [html]
  attack: T1505.003
composite_rules:
  - id: html-asp-webshell-operator-form
    desc: Form submits ASP Execute code to chosen URL
    crit: suspicious
    conf: 0.98
    all:
      - id: micro-behaviors/communications/http/form::html-asp-session-execute-expression
      - id: micro-behaviors/communications/http/form::html-form-action-from-input
      - id: micro-behaviors/communications/http/form::html-form-field-name-from-password
      - id: micro-behaviors/communications/http/post::html-form-post-method
