# The hidden POST field installs request-supplied PHP in a session and evals
# it. Requiring the operator form distinguishes delivery from quoted examples.
defaults:
  platforms: [windows, unix]
  for: [html]
  attack: T1505.003
composite_rules:
  - id: php-session-webshell-operator-form
    desc: Operator posts session-backed PHP evaluator
    crit: hostile
    conf: 0.99
    all:
      - id: micro-behaviors/data/property/assign::php-post-to-session-assignment
      - id: objectives/command-and-control/backdoor/webshell/request/eval::php-post-session-eval-loader
      - id: micro-behaviors/communications/http/form::html-form-action-from-input
      - id: micro-behaviors/communications/http/form::html-form-field-name-from-password
      - id: micro-behaviors/communications/http/form::html-form-post-method
