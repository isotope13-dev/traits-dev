# The client tuple alone can serve diagnostics. Require the file to describe
# attaching a shell to the client's existing socket as well as launch a helper.
# The helper itself is external, so this reports the documented shell boundary
# as suspicious rather than claiming a proven live shell on the host.
defaults:
  platforms: [unix]
  for: [php]

traits:
  - id: socket-shell-attachment-description
    desc: Documents client socket shell attachment
    crit: notable
    conf: 0.97
    if:
      type: text
      regex: 'socket[\s\S]{0,160}attaches a shell to it'

composite_rules:
  - id: php-client-socket-shell-launcher
    desc: Client-tuple launcher documents socket shell attachment
    crit: suspicious
    conf: 0.98
    attack: T1505.003
    all:
      - id: socket-shell-attachment-description
      - id: micro-behaviors/process/create/shell/command-string::php-relative-client-endpoint-command
