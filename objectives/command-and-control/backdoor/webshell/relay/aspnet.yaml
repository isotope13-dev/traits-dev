defaults:
  platforms:
  - windows
  for:
  - html
  - csharp
  - asp
  mbc: B0030
  attack: T1505.003
traits:
- id: aspnet-form-configures-http-relay
  desc: ASP.NET form selects an HTTP destination
  crit: suspicious
  conf: 0.97
  if:
    type: text
    regex: '(?i)Request\s*\.\s*Form\s*\[\s*["''](Remoteserver|Endpoint)["'']\s*\]'
- id: aspnet-relay-returns-remote-response
  desc: ASP.NET returns a remote HTTP response
  crit: notable
  conf: 0.94
  if:
    type: text
    regex: '(?is)GetResponse\s*\(\).{0,300}GetResponseStream\s*\(\).{0,240}Response\.Write\s*\('
composite_rules:
# A POST WebRequest whose request body stream is written: the relay legs below
# pair it with a form-configured upstream and a mirrored response.
- id: aspnet-forwards-request-body-over-http
  desc: ASP.NET forwards request data over HTTP
  crit: suspicious
  conf: 0.97
  near_bytes: 1200
  all:
  - id: micro-behaviors/communications/http/client/managed::webrequest-post-method
  - id: micro-behaviors/communications/http/client/managed::request-stream-write
- id: aspnet-http-request-relay-webshell
  desc: ASP.NET request proxies data to an attacker-selected HTTP destination
  crit: hostile
  conf: 0.99
  all:
  - id: micro-behaviors/communications/http/server/managed::aspnet-page-directive
  - id: aspnet-form-configures-http-relay
  - id: aspnet-forwards-request-body-over-http
  - id: aspnet-relay-returns-remote-response
