traits:
- id: php-wso-upload-protocol
  desc: PHP builds WSO FilesMan uploadFile request
  crit: suspicious
  conf: 0.98
  if:
    type: text
    regex: (?i)['"]a['"]\s*=>\s*['"]FilesMan['"][\s\S]{0,100}['"]p1['"]\s*=>\s*['"]uploadFile['"]
composite_rules:
- id: php-upload-relay-webshell
  desc: PHP relays uploaded files to remote shells
  crit: hostile
  conf: 0.99
  attack: T1505.003,T1105
  all:
  - id: objectives/command-and-control/backdoor/webshell/relay::php-wso-upload-protocol
  - id: micro-behaviors/communications/http/request/superglobal::files
  - id: micro-behaviors/fs/write/file/copy::move-uploaded-file
  - id: micro-behaviors/communications/http/curl::php-curl-request
  any:
  - id: micro-behaviors/communications/http/post::php-stream-context-http-post
  - id: micro-behaviors/communications/http/download/handler::php-content-disposition-readfile
- id: php-upload-report-webshell
  desc: PHP records remote shell upload results
  crit: hostile
  conf: 0.99
  attack: T1505.003,T1105
  all:
  - id: objectives/command-and-control/backdoor/webshell/relay::php-wso-upload-protocol
  - id: micro-behaviors/fs/write/file/copy::move-uploaded-file
  - id: micro-behaviors/fs/write/file/full::php-file-put-contents
  - id: micro-behaviors/communications/http/curl::php-curl-request
  - id: micro-behaviors/communications/http/download/handler::php-content-disposition-readfile
defaults:
  platforms:
  - unix
  - windows
  for:
  - php
