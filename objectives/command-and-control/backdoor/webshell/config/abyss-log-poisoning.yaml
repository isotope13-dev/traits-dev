# Log-poisoning backdoor: the access log lives under the served htdocs tree
# and a shell interpreter claims its extension, so any request text written
# to the log (User-Agent, path, Referer) runs as shell commands when the log
# URL is requested.
defaults:
  for: [xml, text]
  platforms: [unix, windows]
  conf: 0.95
  attack: T1505.003
composite_rules:
  - id: abyss-shell-executes-served-access-log
    desc: Abyss serves its access log through a shell
    crit: hostile
    all:
      - id: micro-behaviors/communications/http/server/route::abyss-access-log-in-htdocs
      - id: micro-behaviors/communications/http/server/route::abyss-interpreter-data-extension
    any:
      - id: micro-behaviors/communications/http/server/route::abyss-interpreter-unix-shell
      - id: micro-behaviors/communications/http/server/route::abyss-interpreter-windows-shell

  # The source dictionaries bind the shell to .log and put the combined log
  # inside the served tree. A generic shell/data-extension pair is insufficient.
  - id: shell-served-access-log-configuration
    desc: Configures served access log as shell input
    crit: hostile
    conf: 0.98
    for: [python]
    near_bytes: 1200
    all:
      - id: micro-behaviors/communications/http/server/route::python-shell-log-extension-mapping
      - id: micro-behaviors/communications/http/server/route::python-combined-log-webroot-setting
      - id: micro-behaviors/communications/http/post::python-httpclient-post-transport
