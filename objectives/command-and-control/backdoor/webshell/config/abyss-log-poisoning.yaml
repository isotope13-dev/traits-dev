# Source calls configure a shell log handler and a combined log under a
# conventional webroot. XML declarations alone are covered as suspicious
# server configuration, without claiming successful or unauthorized execution.
defaults:
  for: [xml, text]
  platforms: [unix, windows]
  conf: 0.95
  attack: T1505.003
composite_rules:
  # The source dictionaries bind the shell to .log and put the combined log
  # inside the served tree. A generic shell/data-extension pair is insufficient.
  - id: shell-served-access-log-configuration
    desc: Configures served access log as shell input
    crit: hostile
    conf: 0.98
    for: [python]
    near_bytes: 1200
    all:
      - id: micro-behaviors/communications/http/server/route::python-shell-log-extension-mapping
      - id: micro-behaviors/communications/http/server/route::python-combined-log-webroot-setting
      - id: micro-behaviors/communications/http/post::python-httpclient-post-transport

  - id: javascript-shell-served-access-log-configuration
    desc: Shell log handler, webroot log, poisoning payload
    crit: hostile
    conf: 0.98
    for: [javascript, typescript]
    near_bytes: 1200
    all:
      - id: micro-behaviors/communications/http/server/route::javascript-shell-log-extension-mapping
      - id: micro-behaviors/communications/http/server/route::javascript-combined-log-webroot-setting
      - id: micro-behaviors/communications/http/post::node-http-request-post
      - id: objectives/execution/exploit/command-injection::combined-log-field-breakout-shell-injection
