---
defaults:
  platforms:
  - windows
  - unix
  for:
  - php
  - text
  mbc: B0030
  attack: T1505.003
traits:
- id: htaccess-handler-directives--rx-3
  desc: Adds a PHP handler or auto-prepend directive
  crit: component
  conf: 0.9
  if:
    type: text
    regex: "(Add(Type|Handler).{0,80}(x-httpd-php|\\.php)|php_value\\s+auto_prepend_file)"
  count_max: 1016573
- id: htaccess-handler-directives--rx-4
  desc: Adds PHP output filter or auto-prepend
  crit: component
  conf: 0.9
  if:
    type: text
    regex: "(Add(OutputFilter).{0,80}(x-httpd-php|\\.php)|php_value\\s+auto_prepend_file)"
  count_max: 1016574
- id: htaccess-handler-directives--rx-5
  desc: Disables an Apache security filter
  crit: component
  conf: 0.9
  if:
    type: text
    regex: "(SecFilterEngine\\s+Off)"
  count_max: 1016575
- id: htaccess-extension-handler
  desc: Maps text extension to PHP handler
  crit: suspicious
  conf: 0.98
  if:
    type: text
    regex: 'AddType\s+application/x-httpd-php\s+\.[A-Za-z0-9]+'
  unless:
  - id: well-known/tool/offensive/payload-corpus::payloadsallthethings-release-member
- id: htaccess-image-handler-exception
  desc: Restores image handler exceptions
  crit: suspicious
  conf: 0.96
  if:
    type: text
    regex: '<FilesMatch[\s\S]{0,160}ForceType\s+none[\s\S]{0,160}Header\s+unset\s+Content-Disposition'
composite_rules:
- id: htaccess-handler-directives
  desc: htaccess PHP handler directives
  crit: suspicious
  conf: 0.9
  any:
  - id: htaccess-handler-directives--rx-3
  - id: htaccess-handler-directives--rx-4
  - id: htaccess-handler-directives--rx-5
- id: htaccess-upload-filter-bypass
  desc: Apache handler bypass for uploaded files
  crit: hostile
  conf: 0.99
  all:
  - id: htaccess-extension-handler
  - id: htaccess-image-handler-exception
  - id: htaccess-handler-directives
