---
defaults:
  platforms:
  - windows
  - unix
  for:
  - php
  - text
  mbc: B0030
  attack: T1505.003
traits:
- id: htaccess-php-handler-directive
  desc: Adds a PHP handler directive
  crit: suspicious
  conf: 0.9
  if:
    type: text
    # Apache needs whitespace between the directive and its handler; without
    # it the regex matched source paths such as `Form/Ajax/AddHandler.php`.
    regex: "\\bAdd(Type|Handler|OutputFilter)[ \\t]+[^\\n]{0,80}(x-httpd-php|\\.php)"
  unless:
  - id: well-known/tool/detection/security-scanner/
  - id: well-known/app/publishing/wordpress-plugins/security::aiowps-security-plugin-path
  - id: well-known/lib/web/zealphp::zealphp-source-tree
- id: htaccess-auto-prepend-directive
  desc: Adds a PHP auto-prepend directive
  crit: suspicious
  conf: 0.9
  if:
    type: text
    regex: "php_value\\s+auto_prepend_file"
  unless:
  - id: well-known/tool/detection/security-scanner/
  - id: well-known/app/publishing/wordpress-plugins/security::aiowps-security-plugin-path
- id: htaccess-handler-directives--rx-5
  desc: Disables an Apache security filter
  crit: suspicious
  conf: 0.9
  if:
    type: text
    regex: "(SecFilterEngine\\s+Off)"
  unless:
  - id: well-known/tool/detection/security-scanner/
  - id: well-known/app/publishing/wordpress-plugins/security::aiowps-security-plugin-path
- id: htaccess-extension-handler
  desc: Maps text extension to PHP handler
  crit: suspicious
  conf: 0.98
  if:
    type: text
    regex: 'AddType\s+application/x-httpd-php\s+\.[A-Za-z0-9]+'
  unless:
  - id: well-known/tool/offensive/payload-corpus::payloadsallthethings-release-member
- id: htaccess-image-handler-exception
  desc: Restores image handler exceptions
  crit: suspicious
  conf: 0.96
  if:
    type: text
    regex: '<FilesMatch[\s\S]{0,160}ForceType\s+none[\s\S]{0,160}Header\s+unset\s+Content-Disposition'
composite_rules:
- id: htaccess-handler-directives
  desc: htaccess PHP handler directives
  crit: suspicious
  conf: 0.9
  any:
  - id: htaccess-php-handler-directive
  - id: htaccess-auto-prepend-directive
  - id: htaccess-handler-directives--rx-5
- id: htaccess-upload-filter-bypass
  desc: Apache handler bypass for uploaded files
  crit: hostile
  conf: 0.99
  all:
  - id: htaccess-extension-handler
  - id: htaccess-image-handler-exception
  - id: htaccess-handler-directives
