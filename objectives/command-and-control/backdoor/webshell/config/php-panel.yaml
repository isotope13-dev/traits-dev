---
defaults:
  platforms:
  - windows
  - unix
  for:
  - php
  - text
  mbc: B0030
  attack: T1505.003
traits:
- id: php-global-config-path
  desc: References global PHP configuration file path
  crit: notable
  conf: 0.9
  for: [shell, text, php]
  if:
    type: text
    regex: '(?i)(/etc/php(\.ini|/[0-9.]+|.d/)|/opt/plesk/php/[0-9.]+/etc/php\.ini)'
- id: php-auto-prepend-config-assignment
  desc: Assigns auto_prepend_file directive
  crit: suspicious
  conf: 0.93
  for: [shell, text, php]
  if:
    type: text
    regex: '(?i)auto_prepend_file\s*=\s*["'']?(\$[A-Za-z_]\w*|[^;\s\r\n]{1,120}\.php)'
- id: htaccess-auto-prepend-directive
  desc: Adds a PHP auto-prepend directive
  crit: suspicious
  conf: 0.9
  if:
    type: text
    regex: "php_value\\s+auto_prepend_file"
  unless:
    - id: well-known/tool/detection/pattern-catalog::php-scanner-signature-rule-table
- id: userini-auto-prepend-directive
  desc: Sets INI auto-prepend file
  crit: suspicious
  conf: 0.92
  if:
    type: text
    # INI syntax, not the htaccess `php_value` form above: the directive
    # opens the line, as PHP's per-directory .user.ini requires. A bare
    # `auto_prepend_file=p0wny.png` line is the webshell persistence drop.
    # The explicit CR class matters: polyglot drops separate the magic
    # with a lone carriage return, which (?m)^ does not treat as a start.
    # The value must be non-empty and not a comment: stock php.ini templates
    # ship both directives with nothing assigned, which sets nothing.
    regex: '(?im)(^|[\r\n])\s*auto_prepend_file[ \t]*=[ \t]*[^;\s]'
  unless:
    - id: metadata/file/naming::test-directory-component
    # A PHP extension's module ini (`extension=xhprof.so` beside its own
    # `auto_prepend_file`) is installed into the PHP configuration directory by
    # whoever builds the image; a `.user.ini` webshell drop carries no extension.
    - type: text
      regex: '(?im)^[ \t]*(zend_)?extension[ \t]*='
    # A prepend file in the root-owned configuration tree (`/usr/local/etc/...`,
    # `/etc/...`) is a tool's own debug or profiling bridge loaded for every
    # request, installed by whoever administers the host. A `.user.ini` drop
    # exists because the attacker cannot write there and points into the web
    # root instead.
    - type: text
      regex: '(?im)^[ \t]*auto_prepend_file[ \t]*=[ \t]*["'']?/(usr/local/)?etc/\S+\.php'
- id: userini-auto-append-directive
  desc: Sets INI auto-append file
  crit: suspicious
  conf: 0.92
  if:
    type: text
    # As above: stock php.ini templates leave the value empty, which sets
    # nothing and is not a persistence drop.
    regex: '(?im)(^|[\r\n])\s*auto_append_file[ \t]*=[ \t]*[^;\s]'
  unless:
    - id: metadata/file/naming::test-directory-component
- id: prepend-image-file-target
  desc: Prepend target is an image file
  crit: notable
  conf: 0.9
  if:
    type: text
    # The prepended payload wears an image suffix (p0wny.png) so the
    # dropper passes upload filters. No legitimate prepend points at
    # raster data PHP would then try to execute.
    regex: '(?i)auto_prepend_file\s*=\s*["'']?[^"''\s;]{1,120}\.(png|jpe?g|gif|ico|svg|webp)\b'
  unless:
  - id: well-known/tool/detection/security-scanner/
  - id: well-known/app/publishing/wordpress-plugins/security::aiowps-security-plugin-path
- id: htaccess-modsecurity-filter-off
  desc: Disables an Apache security filter
  crit: suspicious
  conf: 0.9
  if:
    type: text
    regex: "(SecFilterEngine\\s+Off)"
  unless:
  - id: well-known/tool/detection/security-scanner/
  - id: well-known/app/publishing/prestashop::htaccess-generator-source
  - id: well-known/app/publishing/wordpress-plugins/security::aiowps-security-plugin-path
  # Stock server configs (Magento's .htaccess.sample) disable POST filtering
  # with a documented upload-compatibility comment; a webshell states no
  # such reason. The same stanza ships in deployed copies of the sample.
  - type: text
    regex: '(?i)not break.{0,40}upload'
- id: htaccess-image-handler-exception
  desc: Restores image handler exceptions
  crit: suspicious
  conf: 0.96
  if:
    type: text
    regex: '<FilesMatch[\s\S]{0,160}ForceType\s+none[\s\S]{0,160}Header\s+unset\s+Content-Disposition'
composite_rules:
- id: htaccess-upload-filter-bypass
  desc: Apache handler bypass for uploaded files
  crit: hostile
  conf: 0.99
  all:
  - id: micro-behaviors/communications/http/server/route::apache-nonstandard-php-suffix
  - id: htaccess-image-handler-exception
# Dropped per-directory config, not an edited global php.ini: PHP only
# honors the per-directory filename, so the attacker cannot rename it and
# still get execution -- the basename leg is format-mandated, not a
# collector-chosen name. Either disguise leg (image magic prefix or an
# image-suffixed payload) completes the persistence drop.
- id: userini-prepend-persistence
  desc: user.ini persists a prepended webshell
  crit: hostile
  conf: 0.97
  all:
  - id: userini-auto-prepend-directive
  - id: metadata/file/naming::userini-config-basename
  any:
  - id: metadata/file/magic/identity::gif-magic-header
  - id: prepend-image-file-target
# Handler configuration alone can be an administrator's compatibility setting.
# Require the request-command/output channel before claiming webshell intent.
# This is local co-occurrence, not a proved write of the handler string.
- id: htaccess-command-webshell-handler
  desc: Command webshell with htaccess data handler
  for: [php]
  crit: hostile
  conf: 0.97
  all:
  - id: micro-behaviors/communications/http/server/route::apache-data-suffix-php-handler
  - id: micro-behaviors/fs/write/file/full::php-htaccess-write-proximity
  - id: objectives/command-and-control/backdoor/webshell/request/command::php-request-proc-open-console
  near_bytes: 2048
- id: php-global-prepend-persistence
  desc: Global PHP configuration auto_prepend_file persistence
  crit: hostile
  conf: 0.98
  attack: T1505.003,T1546
  for: [shell, text, php]
  all:
  - id: php-global-config-path
  - id: php-auto-prepend-config-assignment

