defaults:
  platforms: [unix, windows]
  for: [text, html]
  crit: notable
  conf: 0.97

traits:
  - id: rivet-handler-for-access-config
    desc: Rivet evaluates the access configuration
    if:
      type: text
      regex: '(?im)^\s*AddType\s+application/x-httpd-rivet\s+\.?htaccess\b'
  - id: rivet-request-fed-to-shell
    desc: Rivet passes request data to a shell
    if:
      type: text
      regex: '\[exec\s+([^\s\]]{1,60}/)?(ba|da|z)?sh\s+-c\s+\[(::rivet::)?var\s+get\s+'

composite_rules:
  - id: apache-rivet-config-command-webshell
    desc: Self-handled Apache configuration executes Rivet request commands
    crit: hostile
    conf: 0.99
    attack: T1505.003
    all:
      - id: rivet-handler-for-access-config
      - id: rivet-request-fed-to-shell
