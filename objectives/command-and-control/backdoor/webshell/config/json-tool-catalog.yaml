defaults:
  platforms: [windows, unix]
  for: [json]
  attack: T1505.003
traits:
- id: b4tm4n-tools-json-catalog
  desc: b4tm4n webshell tool catalog marker
  crit: suspicious
  conf: 0.95
  if:
    type: text
    substr: b4tm4n_t00lz
# Entries whose URL path is a backconnect directory holding one
# shell source per language (back.py, back.php, back.rb, ...). Three
# or more such entries make the JSON a shell distribution index, not
# a reading list: every linked file is a bind/reverse shell.
- id: backconnect-shell-url-entry
  desc: Catalog entry links a backconnect shell file
  crit: notable
  conf: 0.94
  if:
    type: text
    regex: '"url"\s*:\s*"https?://[^"\s]{1,160}/backconnect/back\.[a-z]+"'
  count_min: 3
- id: adminer-php-filename
  desc: Adminer PHP filename
  crit: notable
  conf: 0.9
  if:
    type: text
    regex: 'adminer-[0-9][^"''\s<>]{0,80}\.php'
composite_rules:
- id: raw-github-adminer-php-entry
  desc: Raw GitHub Adminer PHP entry
  crit: suspicious
  conf: 0.92
  near_bytes: 260
  all:
  - id: micro-behaviors/communications/http/url/github::raw-githubusercontent-any
  - id: adminer-php-filename
- id: webshell-tool-catalog-raw-php
  desc: Webshell tool catalog raw PHP
  crit: suspicious
  conf: 0.96
  all:
  - id: b4tm4n-tools-json-catalog
  - id: raw-github-adminer-php-entry
- id: backconnect-shell-download-catalog
  desc: JSON catalog distributing backconnect shells
  crit: hostile
  conf: 0.97
  all:
  - id: backconnect-shell-url-entry
  - id: micro-behaviors/communications/http/url/github::raw-githubusercontent-scripting-lang
