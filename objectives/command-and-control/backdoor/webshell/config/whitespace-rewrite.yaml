# The PHP destination name is operator-selected. Match the unusual route
# structure from the implant rather than config.php or its installation path.
defaults:
  platforms: [unix, windows]
  for: [scripts, source, text]

traits:
  - id: apache-leading-whitespace-php-rewrite
    desc: Rewrites leading whitespace paths to PHP
    crit: suspicious
    conf: 0.95
    if:
      type: text
      regex: 'RewriteRule[ \t]+\^\\s\+[ \t]+[^\s]{1,96}\.php\b'

