defaults:
  platforms:
  - windows
  - unix
  for:
  - html
  - php
  mbc: B0030
  attack: T1505.003
traits:
- id: filesman-file-manager-label
  desc: 'FilesMan file-manager panel label'
  crit: suspicious
  conf: 0.95
  for: [php, java, class, html, csharp]
  size_max: 1000000
  if:
    type: text
    word: FilesMan
  unless:
  - id: well-known/tool/detection/
- id: offensive-tool-term
  desc: Text names a rootkit or Meterpreter
  crit: notable
  conf: 0.78
  if:
    type: text
    regex: "(?i)(rootkit|meterpreter)"
- id: interpreter-restriction-bypass-term
  desc: Advertises a PHP safe_mode bypass
  crit: notable
  conf: 0.78
  if:
    type: text
    regex: "(?i)safe_mode bypass"
- id: hash-cracking-term
  desc: Advertises password hash cracking
  crit: notable
  conf: 0.78
  if:
    type: text
    regex: "(?i)hashcrack"
- id: open-basedir-bypass-term
  desc: Advertises an open_basedir bypass
  crit: notable
  conf: 0.78
  if:
    type: text
    regex: "(?i)open_basedir bypass"
- id: defacement-term
  desc: Text names website defacement
  crit: notable
  conf: 0.78
  if:
    type: text
    # `haml.deface` is a template extension, not a defacement claim.
    regex: '(?i)(^|[^A-Za-z0-9._])deface'
composite_rules:
- id: admin-terms-identified
  desc: Webshell panel with security administration terms
  crit: suspicious
  conf: 0.78
  all:
  - id: micro-behaviors/ui/terminal::webshell-manager-label
  any:
  - id: micro-behaviors/data/parse/vocabulary::backdoor-term
  - id: micro-behaviors/data/parse/vocabulary::shell-kind-term
  - id: offensive-tool-term
  - id: interpreter-restriction-bypass-term
  - id: hash-cracking-term
  - id: open-basedir-bypass-term
  - id: defacement-term
  unless:
  - id: well-known/lib/web/
  - id: metadata/build/
  - id: well-known/tool/offensive/spellbook::reverse-shell-generator-context
  - id: well-known/tool/detection/
  - id: well-known/lib/cloud/api-codegen::cloud-sdk-api-model
  - id: well-known/lib/cloud/cloud-sdk::huaweicloud-python-model
  # The gettext table suppresses translation catalogs whose values describe
  # shells (the file labels a scanner's detections, not itself).
  - id: metadata/lang/locale::php-gettext-header-table
