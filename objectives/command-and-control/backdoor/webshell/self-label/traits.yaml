defaults:
  platforms:
  - windows
  - unix
  for:
  - html
  - php
  - perl
  mbc: B0030
  attack: T1505.003
traits:
- id: identifier
  desc: Explicit web-shell panel or command terminology
  crit: suspicious
  conf: 0.82
  if:
    type: text
    regex: '(?i)webshell.{0,40}(panel|manager)'
  unless:
  - id: well-known/tool/detection/
  - id: well-known/lib/cloud/api-codegen::cloud-sdk-api-model
  - id: metadata/library/cloud-sdk::huaweicloud-python-model
  - id: metadata/package/documentation/source::webshell-policy-doc-marker
  - type: path
    regex: '(?i)\.yar(a)?$'
# Each trait below names the vocabulary it actually matches. They were split out
# of one alternation list mechanically and kept descriptions belonging to other
# branches — a reader was told a file "matches 'open_basedir bypass'" when what
# it contained was the word "backdoor", which spends the reader's trust for
# nothing. The matchers are unchanged.
- id: backdoor-term
  desc: Text names a backdoor or cmd shell
  crit: notable
  conf: 0.78
  if:
    type: text
    regex: "(?i)(backdoor|cmd shell)"
- id: shell-kind-term
  desc: Text names a web or reverse shell
  crit: notable
  conf: 0.78
  if:
    type: text
    regex: "(?i)(web shell|reverse shell)"
- id: filesman-file-manager-label
  desc: 'FilesMan file-manager panel label'
  crit: suspicious
  conf: 0.95
  for: [php, java, class, html, csharp]
  size_max: 1000000
  if:
    type: text
    word: FilesMan
  unless:
  - id: well-known/tool/detection/
- id: offensive-tool-term
  desc: Text names a rootkit or Meterpreter
  crit: notable
  conf: 0.78
  if:
    type: text
    regex: "(?i)(rootkit|meterpreter)"
- id: interpreter-restriction-bypass-term
  desc: Advertises a PHP safe_mode bypass
  crit: notable
  conf: 0.78
  if:
    type: text
    regex: "(?i)safe_mode bypass"
- id: hash-cracking-term
  desc: Advertises password hash cracking
  crit: notable
  conf: 0.78
  if:
    type: text
    regex: "(?i)hashcrack"
- id: open-basedir-bypass-term
  desc: Advertises an open_basedir bypass
  crit: notable
  conf: 0.78
  if:
    type: text
    regex: "(?i)open_basedir bypass"
- id: defacement-term
  desc: Text names website defacement
  crit: notable
  conf: 0.78
  if:
    type: text
    regex: "(?i)deface"
composite_rules:
- id: webshell-admin-terms
  desc: Webshell administrative terms
  # Vocabulary alone is incomplete evidence: defensive policy lists and
  # documentation use the same words. The identified-panel composite adds
  # the separate self-label evidence needed for a suspicious interpretation.
  crit: component
  conf: 0.78
  any:
  - id: backdoor-term
  - id: shell-kind-term
  - id: offensive-tool-term
  - id: interpreter-restriction-bypass-term
  - id: hash-cracking-term
  - id: open-basedir-bypass-term
  - id: defacement-term
  unless:
  - id: metadata/library/syntaxhighlighter/
  - id: metadata/library/structure/
  - id: well-known/tool/offensive/spellbook::reverse-shell-generator-context
- id: admin-terms-identified
  desc: Generic webshell admin terminology
  crit: suspicious
  conf: 0.82
  all:
  - id: identifier
  - id: webshell-admin-terms
  unless:
  - id: well-known/tool/detection/
  - id: well-known/lib/cloud/api-codegen::cloud-sdk-api-model
  - id: metadata/library/cloud-sdk::huaweicloud-python-model
