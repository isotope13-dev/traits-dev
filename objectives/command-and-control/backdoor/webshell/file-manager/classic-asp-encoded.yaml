defaults:
  platforms: [windows]
  # These indicators describe Classic ASP/VBScript source.  Applying them to
  # arbitrary JavaScript bundles makes ordinary library text look like a
  # webshell (for example Swagger UI's bundled decoder documentation).
  for: [vbs, html, elixir, asp]
  attack: T1505.003
  mbc: B0030

composite_rules:
  - id: classic-asp-script-encoded-file-manager
    desc: Classic ASP Script Encoder-wrapped file manager shell
    crit: hostile
    conf: 0.98
    for: [vbs, html, asp]
    all:
      - id: metadata/lang/runtime::asp-script-encoder-directive
      - id: micro-behaviors/os/com/automation::filesystemobject-progid
    any:
      - id: micro-behaviors/fs/write/content::fso-text-file-write-api
      - id: micro-behaviors/fs/delete/file/self::fso-deletefile-call
      - id: micro-behaviors/fs/file/copy::fso-copyfile
      - id: micro-behaviors/communications/http/download/wsh::adodb-stream-object
      - id: micro-behaviors/process/create/shell/script-host::cmd-exe-c-command
      - id: micro-behaviors/process/create/shell/script-host::wscript-shell-run-create
      - id: micro-behaviors/communications/http/request/superglobal::classic-asp-request-field
