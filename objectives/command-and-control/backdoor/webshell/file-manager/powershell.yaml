# Bidirectional, request-selected file access on a PowerShell HttpListener is
# the file-management half of a webshell. Requiring both arbitrary upload and
# download paths avoids treating ordinary single-purpose transfer endpoints as
# a backdoor.
defaults:
  platforms: [windows]
  for: [powershell]
  attack: T1505.003,T1105,T1041
  mbc: B0030

traits:
  - id: powershell-filepath-form-field
    desc: PowerShell reads filepath form field
    crit: component
    conf: 0.98
    if:
      type: text
      regex: '\$HEADER\.Item\([''\"]filepath[''\"]\)'

  - id: powershell-formfield-file-read
    desc: PowerShell reads form-selected file bytes
    crit: component
    conf: 0.98
    if:
      type: text
      regex: 'ReadAllBytes\(\$FORMFIELD\)'

  - id: powershell-multipart-filepath-field
    desc: Multipart request supplies filepath field
    crit: component
    conf: 0.98
    if:
      type: text
      regex: '\$HEADERNAME\s+-eq\s+["'']filepath["'']'

  - id: powershell-target-filedata-write
    desc: PowerShell writes uploaded data to target
    crit: component
    conf: 0.99
    if:
      type: text
      regex: 'WriteAllText\(\$TARGETNAME,\s*\$FILEDATA'

composite_rules:
  - id: powershell-request-path-file-download
    desc: Serves a request-selected local file
    crit: suspicious
    conf: 0.99
    near_bytes: 3000
    all:
      - id: powershell-filepath-form-field
      - id: powershell-formfield-file-read
      - id: micro-behaviors/communications/http/server/managed::powershell-http-response-stream-write

  - id: powershell-multipart-path-file-write
    desc: Writes multipart data to supplied path
    crit: suspicious
    conf: 0.99
    near_bytes: 7000
    all:
      - id: powershell-multipart-filepath-field
      - id: powershell-target-filedata-write
      - id: micro-behaviors/communications/http/server/managed::powershell-http-request-stream

  - id: powershell-httplistener-file-manager-webshell
    desc: PowerShell HttpListener uploads and downloads arbitrary host files
    crit: hostile
    conf: 0.995
    all:
      - id: micro-behaviors/communications/http/server/managed::powershell-httplistener
      - id: powershell-request-path-file-download
      - id: powershell-multipart-path-file-write
