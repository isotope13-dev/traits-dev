defaults:
  platforms: [windows]
  # Classic ASP is often typed as javascript/html/lua by content heuristics when
  # the file mixes markup with VBScript, starts with a Session.CodePage
  # preamble, or is Script-Encoder wrapped — so carrier types include those.
  for: [vbs, html, javascript, lua, asp]
  attack: T1505.003
  mbc: B0030

composite_rules:
  # The `Request.` leg is what makes any of these request-facing, and four
  # composites in this file were missing it: "VBScript + FileSystemObject +
  # two file operations" is every Windows admin script and MSI custom action
  # ever written, so an Office patch-registration custom action
  # (rePatchesww.vbs: FSO + CopyFile + CreateTextFile + DeleteFile) came out
  # hostile twice over with no HTTP surface anywhere in it. The sibling
  # ADO/attribute shells below already required it.
  - id: classic-asp-file-manager-shell
    for: [vbs, asp]
    desc: Classic ASP request-facing file manager shell
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/communications/http/request/superglobal::classic-asp-request-field
      - id: metadata/lang/scripted::vbscript-valid
      - id: micro-behaviors/os/com/automation::filesystemobject-progid
    any:
      - id: micro-behaviors/fs/file/copy::fso-copyfile
      - id: micro-behaviors/fs/write/stream::adodb-save-to-file
      - id: micro-behaviors/fs/write/content::create-text-file-api
      - id: micro-behaviors/fs/delete/file/self::fso-deletefile-call
      - id: micro-behaviors/fs/traversal/drives::fso-drive-enumeration
    needs: 2

  - id: classic-asp-database-shell
    for: [vbs, asp]
    desc: Classic ASP database administration shell
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/communications/http/request/superglobal::classic-asp-request-field
      - id: metadata/lang/scripted::vbscript-valid
      - id: micro-behaviors/os/com/automation::filesystemobject-progid
      - id: micro-behaviors/data/db/sql::sql-select
      - id: micro-behaviors/data/db/schema/delete::sql-drop-object

  # MSSQL/ADO admin panels often skip FileSystemObject and drive ADOX/ADODB
  # directly from Request fields — still a request-facing DB shell. SQL Server
  # panels frequently build `Select * From [table]` via string concat, which
  # misses the literal-only `sql-select` atom, so any SQL dialect trait plus
  # an ADOX catalog leg covers the online-management shape. Explicit relocated
  # SQL alternatives preserve this consumer's original SQL evidence set.
  - id: classic-asp-ado-database-shell
    desc: Classic ASP ADO database administration shell
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/communications/http/request/superglobal::classic-asp-request-field
      - id: micro-behaviors/os/com/automation::adodb-connection-progid
      - id: micro-behaviors/os/com/automation::adox-catalog-progid
    any:
      - id: micro-behaviors/data/db/sql
      - id: micro-behaviors/data/db/delete/row::sql-delete
      - id: micro-behaviors/data/db/delete/row::sql-delete-clause
      - id: micro-behaviors/data/db/delete/row::sql-delete-from-statement
      - id: micro-behaviors/data/db/delete/row::sql-delete-order-clause
      - id: micro-behaviors/data/db/delete/row::sql-delete-terminated
      - id: micro-behaviors/data/db/schema/delete::sql-drop-database
      - id: micro-behaviors/data/db/schema/delete::sql-drop-object
      - id: micro-behaviors/data/db/schema/delete::sql-drop-object-statement
      - id: micro-behaviors/data/db/write/row::sql-insert
      - id: micro-behaviors/data/db/write/row::sql-insert-into-statement
      - id: micro-behaviors/data/db/delete/row::sql-truncate-object
      - id: micro-behaviors/data/db/write/row::sql-update
      - id: micro-behaviors/data/db/write/row::sql-update-set-statement
      - id: micro-behaviors/data/db/schema/introspection::information-schema-ref
      - id: micro-behaviors/data/db/schema/introspection::postgres-catalog-table
      - id: micro-behaviors/data/db/schema/introspection::pragma-table-info-ref
      - id: micro-behaviors/data/db/schema/introspection::schema-catalog-reference-suite
      - id: micro-behaviors/data/db/schema/introspection::sqlite-master-ref
      - id: micro-behaviors/data/db/schema/relational::sql-create-table
      - id: micro-behaviors/data/db/schema/relational::sql-password-column
      - id: micro-behaviors/data/db/schema/relational::sql-value-blob-column
      - id: micro-behaviors/data/db/schema/relational::table-and-blob-column-syntax
      - id: micro-behaviors/data/db/schema/stored-code::javascript-trigger-source

  - id: classic-asp-ado-catalog-shell
    desc: Classic ASP ADOX catalog database shell
    crit: notable
    conf: 0.97
    all:
      - id: micro-behaviors/communications/http/request/superglobal::classic-asp-request-field
      - id: micro-behaviors/os/com/automation::adox-catalog-progid
      - id: micro-behaviors/os/com/automation::adodb-connection-progid

  - id: classic-asp-database-dropper
    for: [vbs, asp]
    desc: Classic ASP database shell can launch a remote executable
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/communications/http/request/superglobal::classic-asp-request-field
      - id: metadata/lang/scripted::vbscript-valid
      - id: micro-behaviors/data/db/sql::sql-select
      - id: micro-behaviors/data/db/schema/delete::sql-drop-object
      - id: micro-behaviors/fs/path/application/executable::unc-exe-path-reference

  - id: classic-asp-archive-download-shell
    for: [javascript]
    desc: Classic ASP packages and downloads server files
    crit: notable
    conf: 0.97
    all:
      - id: micro-behaviors/os/com/automation::filesystemobject-progid
      - id: micro-behaviors/communications/http/header/custom::content-disposition-filename
      - id: micro-behaviors/communications/http/download/wsh::adodb-stream-object

  # Same repair as the composites above, applied to the last one that was
  # missing it. Exists-check + DeleteFile + ADODB.Stream is the shape of any
  # Windows Script Host helper that downloads something to a temp file and
  # cleans up after itself: WinMerge ships two — `MergePlugins/AI.sct` reads an
  # OpenAI response through ADODB.Stream and deletes its scratch file, and
  # `ApplyPatch.sct` does the same around patch.exe — and both came out hostile
  # with no HTTP request surface anywhere in them. The `Request.` field is what
  # makes an archive helper *server-side and attacker-driven*.
  - id: classic-asp-self-delete-archive
    for: [javascript]
    desc: Classic ASP archive helper deletes its own server file
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/communications/http/request/superglobal::classic-asp-request-field
      - id: micro-behaviors/fs/path/check::fso-file-exists
      - id: micro-behaviors/fs/delete/file/self::fso-deletefile-call
      - id: micro-behaviors/communications/http/download/wsh::adodb-stream-object

  - id: classic-asp-attribute-shell-app
    desc: Classic ASP attribute manager uses Shell.Application
    crit: hostile
    conf: 0.97
    all:
      - id: micro-behaviors/communications/http/request/superglobal::classic-asp-request-field
      - id: micro-behaviors/os/com/automation::shell-application-progid
    any:
      - id: micro-behaviors/fs/file/attributes::fso-attribute-mutation
      - id: micro-behaviors/fs/file/attributes::fso-vbs-attribute-mutation

  # The restore half of a site packer. `classic-asp-archive-download-shell`
  # above covers the outbound direction -- walk the tree, pack it, serve it --
  # but ASPWebPack-style tools are bidirectional: they also read a packed blob
  # back off disk, seek each member inside it, recreate the directory tree, and
  # write every member out again. That inbound direction is a mass file-drop
  # primitive, so it is its own conviction rather than a second spelling of the
  # download. Requiring the load, the binary stream type, directory creation
  # and the write together keeps ordinary single-file WSH download helpers --
  # which never create directories to unpack into -- out of it.
  - id: classic-asp-archive-restore-file-drop
    for: [javascript, vbs]
    desc: Classic ASP unpacks an archive onto the server
    # Site backup/restore utilities implement this exact operation.  A request-
    # driven command shell or unauthenticated upload must supply hostile intent.
    crit: notable
    conf: 0.97
    attack: T1505.003,T1105
    all:
      - id: micro-behaviors/fs/read/stream::stream-load-from-file
      - id: micro-behaviors/fs/write/stream::adodb-save-to-file
      - id: micro-behaviors/fs/write/stream::adodb-type-binary
      - id: micro-behaviors/fs/directory/mkdir::wsh-createfolder
      - id: micro-behaviors/os/com/automation::filesystemobject-progid

  # ASPWebPack-style site packers: request-driven pack (download the tree) and
  # recover (mass-drop the archive back onto the server). Either half alone can
  # be a backup utility; both plus a Request surface is a webshell file manager.
  - id: classic-asp-site-packer-shell
    for: [javascript]
    desc: Classic ASP request-driven site pack and restore shell
    crit: hostile
    conf: 0.97
    attack: T1505.003,T1105,T1041
    all:
      - id: micro-behaviors/communications/http/request/superglobal::classic-asp-request-field
      - id: classic-asp-archive-download-shell
      - id: classic-asp-archive-restore-file-drop
