# ColdFusion file shells expose multiple file operations, sometimes alongside
# a request-controlled command sink. The file-only variant requires request
# provenance for both file reads and writes; fixed-path maintenance is common.
#
# Java object construction is not an execution sink. ServiceFactory can
# enumerate datasource configuration without launching a process.
defaults:
  platforms: [unix, windows]
  for: [cfml]
  attack: T1505.003
  mbc: B0030
composite_rules:
  - id: cfml-file-manager-command-shell
    desc: ColdFusion file manager page executes programs
    crit: hostile
    conf: 0.96
    all:
      - id: micro-behaviors/fs/file/read-write::cfml-multiple-file-operations
      - id: objectives/command-and-control/backdoor/webshell/request/command::cfml-request-command-shell
  - id: cfml-browser-file-webshell
    desc: CFML file manager accepts request-controlled reads and writes
    crit: hostile
    conf: 0.97
    all:
      - id: metadata/lang/scripted::cfml-output-tag
      - id: micro-behaviors/fs/read/file/full::cffile-request-controlled-read
      - id: micro-behaviors/fs/write/content::cffile-request-write-path-content
      - id: micro-behaviors/fs/write/content::cffile-upload
      - id: micro-behaviors/fs/delete/file/command::cffile-delete
    any:
      - id: micro-behaviors/fs/file/move::cffile-move
      - id: micro-behaviors/fs/file/copy::cffile-copy
