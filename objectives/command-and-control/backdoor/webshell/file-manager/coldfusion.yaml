# ColdFusion webshells ("CFM Shell", ice.cfm, cfmshell) are a single .cfm page
# that pairs a browser file manager with a command-execution sink. Neither half
# is remarkable alone — a CMS upload handler writes files, and a build page may
# legitimately shell out — but one page that mutates the filesystem in several
# different ways *and* launches programs is the shell's whole interface.
#
# The Java-object leg covers the ServiceFactory/Runtime route CFM shells use
# when `<cfexecute>` is disabled by the administrator.
defaults:
  platforms: [unix, windows]
  for: [vbs, html, javascript]
  attack: T1505.003
  mbc: B0030
composite_rules:
  - id: cfml-file-manager
    desc: ColdFusion page manages files from the browser
    crit: suspicious
    conf: 0.9
    all:
      - id: metadata/lang/scripted::cfml-output-tag
    any:
      - id: micro-behaviors/fs/write/content::cffile-write
      - id: micro-behaviors/fs/write/content::cffile-upload
      - id: micro-behaviors/fs/delete/file::cffile-delete
      - id: micro-behaviors/fs/delete/file::cfdirectory-delete
      - id: micro-behaviors/fs/delete/file::cfm-java-file-delete
      - id: micro-behaviors/fs/file/move::cffile-relocate
      - id: micro-behaviors/fs/directory/readdir::cfdirectory-list
    needs: 3
  - id: cfml-file-manager-command-shell
    desc: ColdFusion file manager page executes programs
    crit: hostile
    conf: 0.96
    all:
      - id: cfml-file-manager
    any:
      - id: micro-behaviors/process/create/exec::cfexecute-tag
      - id: micro-behaviors/process/create/exec::cfm-java-object-instantiation
