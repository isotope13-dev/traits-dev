defaults:
  for: [asp]
  platforms: [windows]
composite_rules:
  - id: servu-privileged-ftp-account-panel
    desc: ASP request panel provisions privileged FTP access to the whole drive
    crit: hostile
    conf: 0.99
    all:
      - id: objectives/privilege-escalation/modify-service::servu-http-maintenance-admin-grant
      - id: micro-behaviors/communications/http/request/superglobal::classic-asp-request-field
      - id: micro-behaviors/communications/ftp/control::servu-drive-root-home
      - id: micro-behaviors/communications/ftp/control::servu-full-drive-access
