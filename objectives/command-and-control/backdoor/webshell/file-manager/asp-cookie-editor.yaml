defaults:
  for: [asp, html, vbs]
  platforms: [windows]
  crit: hostile
  conf: 0.99
  attack: T1505.003
composite_rules:
  - id: cookie-gated-arbitrary-file-editor
    desc: Literal-cookie gate permits request-driven file writes
    all:
      - id: micro-behaviors/communications/http/cookies::asp-password-cookie-literal-comparison
      - id: micro-behaviors/communications/http/server/request::asp-request-file-path-assignment
      - id: micro-behaviors/fs/write/content::asp-request-text-write
      - id: micro-behaviors/fs/write/content::asp-selected-path-text-file-create
      - id: micro-behaviors/os/com/automation::filesystemobject-progid
  - id: cookie-gated-arbitrary-file-delete
    desc: Literal-cookie gate permits request-driven file deletion
    all:
      - id: micro-behaviors/communications/http/cookies::asp-password-cookie-literal-comparison
      - id: micro-behaviors/communications/http/server/request::asp-request-file-path-assignment
      - id: micro-behaviors/fs/file/open::asp-bound-path-file-object
      - id: micro-behaviors/fs/delete/file/library::asp-file-object-force-delete
      - id: micro-behaviors/os/com/automation::filesystemobject-progid
