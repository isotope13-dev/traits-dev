defaults:
  platforms: [windows]
  for: [media]
  attack: T1105,T1505.003
  mbc: B0030

composite_rules:
  - id: media-aspnet-file-manager-webshell
    desc: Media ASP.NET file manager webshell
    crit: hostile
    conf: 0.99
    all:
      - id: micro-behaviors/data/embedded/payload/media::aspnet-page-directive-in-media
      - id: micro-behaviors/data/embedded/payload/media::aspnet-server-script-in-media
      - id: micro-behaviors/data/embedded/payload/media::aspnet-request-property-in-media
      - id: micro-behaviors/data/embedded/payload/media::aspnet-request-indexer-in-media
      - id: micro-behaviors/data/embedded/payload/media::aspnet-file-upload-in-media
      - id: micro-behaviors/data/embedded/payload/media::aspnet-file-save-in-media
      - id: micro-behaviors/data/embedded/payload/media::aspnet-directory-enumeration-in-media
      - id: micro-behaviors/data/embedded/payload/media::aspnet-response-file-in-media
