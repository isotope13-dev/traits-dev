defaults:
  platforms: [unix, windows]
  for: [jsp]
  attack: T1505.003
  mbc: B0030
# Custom JSP/JSPX shell protocol: require request/local/argument-array bindings
# and their matching helper implementations, without banners or DB names.
# Block and server-page comments cannot supply the required source snippets.
traits:
  - id: jsp-custom-request-file-manager-pattern
    desc: Custom JSP request-file management pattern
    crit: suspicious
    conf: 0.99
    if:
      type: yara
      source: |
        rule jsp_custom_request_file_manager {
          strings:
            $code_z1 = /String\s+z1\s*=\s*(EC\()?decode\((EC\()?request\.getParameter\("z1"\)/
            $code_z2 = /String\s+z2\s*=\s*(EC\()?decode\((EC\()?request\.getParameter\("z2"\)/
            $code_args = /String\[\]\s+pars\s*=\s*\{\s*z0,\s*z1,\s*z2,\s*z3\s*\}/
            $write_z1 = /\bz1\s*=/
            $write_z2 = /\bz2\s*=/
            $write_pars = /\bpars\s*=/
            $comment = /<%--.*?--%>|<!--.*?-->|\/\*.*?\*\//s

            $code_read_dispatch = "ReadFileCode(pars[1])"
            $code_upload_dispatch = /UploadFileCode\(pars\[1\],\s*pars\[2\]\)/
            $code_read_helper = /ReadFileCode\(String filePath\)/
            $code_read = "new FileInputStream(new File(filePath))"
            $code_upload_helper = /UploadFileCode\(String savefilePath,\s*String fileHexContext\)/
            $code_upload_target = "new File(savefilePath)"
            $code_write = /new FileOutputStream\(f(,\s*true)?\)/
            $code_data = "h.indexOf(fileHexContext.charAt(i)) << 4"

          condition:
            all of ($code*) and
            #write_z1 == 1 and #write_z2 == 1 and #write_pars == 1 and
            for all of ($code*) : (
              #comment == 0 or for all c in (1..#comment) : (
                @ < @comment[c] or @ >= @comment[c] + !comment[c]
              )
            )
        }

composite_rules:
  - id: jsp-custom-request-file-manager
    desc: JSP request-controlled file read/upload shell
    crit: hostile
    conf: 0.99
    all:
      - id: jsp-custom-request-file-manager-pattern
      - id: metadata/lang/scripted::jsp-server-page
      - id: micro-behaviors/communications/http/response::jsp-response-print-syntax
