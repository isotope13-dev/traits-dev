# Bounded JSP request bindings; no password, banner, URL or parameter key gates.
defaults:
  platforms:
  - unix
  - windows
  for:
  - jsp
  attack: T1505.003
  mbc: B0030
composite_rules:
- id: jsp-request-file-write-command-shell
  desc: JSP shell writes request-chosen files
  crit: hostile
  conf: 0.99
  all:
  - id: objectives/command-and-control/backdoor/webshell/request/command::jsp-forwarded-request-command
  - id: micro-behaviors/fs/write/file/handle::jsp-parameter-path-content-write
