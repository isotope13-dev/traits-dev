defaults:
  for: [class]
  platforms: [unix, windows]
  attack: T1505.003
composite_rules:
  - id: jvm-encrypted-jsp-file-management
    desc: Encrypted JSP control includes file listing, reading and deletion
    crit: hostile
    conf: 0.98
    all:
      - id: objectives/command-and-control/channel/http/message::jvm-encrypted-jsp-equals-channel
      - id: micro-behaviors/fs/directory/readdir/language::jvm-file-listfiles
      - id: micro-behaviors/fs/read/file/handle::java-fileinputstream-class
      - id: metadata/import/jvm::java-file-delete-bytecode
