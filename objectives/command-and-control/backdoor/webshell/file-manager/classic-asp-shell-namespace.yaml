# Request-driven server file management (FileSystemObject writes or
# Shell.Application CopyHere/MoveHere, objects created by ProgID or by a
# server <object> CLSID tag) on a page that also runs commands and returns
# their output. Stand-alone ASP file managers are admin tools; the command
# console makes this one a webshell.
defaults:
  platforms: [windows]
  for: [asp]
  attack: T1505.003,T1083
  mbc: B0030

composite_rules:
  - id: classic-asp-command-shell-file-manager
    desc: ASP command shell also manages server files
    crit: hostile
    conf: 0.94
    all:
      - id: micro-behaviors/communications/http/request/superglobal::classic-asp-request-field
      - id: objectives/command-and-control/remote-command/shell::asp-wsh-stdout-readall
    any:
      - id: micro-behaviors/os/com/automation::filesystemobject-progid
      - id: micro-behaviors/os/com/instantiation::asp-server-object-tag-classid
      - id: micro-behaviors/fs/write/content::fso-text-file-write-api
      - id: micro-behaviors/fs/write/content::create-text-file-method-name
      - id: micro-behaviors/fs/file/copy/call::shell-namespace-copyhere-movehere
    needs: 3
