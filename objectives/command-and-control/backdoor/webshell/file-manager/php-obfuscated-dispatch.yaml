defaults:
  platforms: [unix, windows]
  for: [php]
  attack: T1505.003
  mbc: B0030

composite_rules:
  # tebink-style file manager: filesystem builtins are hidden behind a
  # base64 dispatch table (Obf::call('unlink', ...) instead of unlink(...)),
  # so the direct-call file atoms miss it; the callback dispatcher plus the
  # request-driven upload/write pair is the detectable shape.
  - id: php-obfuscated-dispatch-file-manager
    desc: Obfuscated-dispatch file manager with upload and write
    crit: hostile
    conf: 0.97
    all:
      - id: micro-behaviors/process/interpreter/reflection/dispatch::php-callback-array-dispatch
      - id: micro-behaviors/fs/write/file/copy::move-uploaded-file
      - id: micro-behaviors/communications/http/request/superglobal::request-param-assignment
    any:
      - id: micro-behaviors/fs/write/file/full::php-file-put-contents
      - id: micro-behaviors/fs/write/file/full::file-put-contents
    needs: 1
    unless:
      - id: well-known/app/publishing/wordpress-plugins/catalog::known-wordpress-plugin
      - id: metadata/file/naming::test-directory-component
