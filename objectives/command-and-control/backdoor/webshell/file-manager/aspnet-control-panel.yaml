# ASP.NET control panels expose host command execution alongside server-side
# file management. Keep each observation tied to a concrete operation; the
# hostile objectives require the web endpoint and several capabilities.
defaults:
  platforms: [windows]
  for: [asp]
  attack: T1505.003,T1059.003
  mbc: B0030

traits:
  - id: aspnet-control-panel-cmd-process
    desc: ASP.NET starts cmd.exe
    crit: notable
    conf: 0.96
    if:
      type: text
      exclude_html_comments: true
      regex: '(?i)ProcessStartInfo\s*\(\s*["'']cmd\.exe["'']\s*\)'
  - id: aspnet-control-panel-shell-stdin
    desc: ASP.NET writes commands to shell input
    crit: notable
    conf: 0.97
    if:
      type: text
      exclude_html_comments: true
      regex: '(?i)RedirectStandardInput\s*=\s*true|\bsIn\.WriteLine\s*\('
  - id: aspnet-control-panel-shell-output
    desc: ASP.NET captures shell output
    crit: notable
    conf: 0.96
    if:
      type: text
      exclude_html_comments: true
      regex: '(?i)RedirectStandardOutput\s*=\s*true|\bsOut\.ReadToEnd\s*\('
  - id: aspnet-control-panel-command-input
    desc: ASP.NET command field reaches its shell runner
    crit: notable
    conf: 0.97
    if:
      type: text
      exclude_html_comments: true
      regex: '(?i)command\s*\(\s*Command\.Text\s*\)'
  - id: aspnet-control-panel-startinfo-cmd-exe
    desc: ASP.NET process runs cmd.exe
    crit: notable
    conf: 0.97
    if:
      type: text
      exclude_html_comments: true
      regex: '(?i)StartInfo\.FileName\s*=\s*["'']cmd\.exe["'']'
  - id: aspnet-control-panel-text-startinfo-arguments
    desc: ASP.NET text enters shell arguments
    crit: notable
    conf: 0.97
    if:
      type: text
      exclude_html_comments: true
      regex: '(?i)StartInfo\.Arguments\s*=\s*["'']/c\s+["'']\s*\+\s*\w+\.Text'
  - id: aspnet-control-panel-file-listing
    desc: ASP.NET enumerates server files and directories
    crit: notable
    conf: 0.95
    if:
      type: text
      exclude_html_comments: true
      regex: '(?i)Directory\.GetFiles\s*\('
  - id: aspnet-control-panel-directory-getdirectories
    desc: ASP.NET enumerates child directories
    crit: notable
    conf: 0.95
    if:
      type: text
      exclude_html_comments: true
      regex: '(?i)Directory\.GetDirectories\s*\('
  - id: aspnet-control-panel-directoryinfo-getdirectories
    desc: DirectoryInfo enumerates child directories
    crit: notable
    conf: 0.95
    if:
      type: text
      exclude_html_comments: true
      regex: '(?i)\.GetDirectories\s*\(\s*\)'
  - id: aspnet-control-panel-directoryinfo-getfiles
    desc: ASP.NET enumerates a DirectoryInfo file list
    crit: notable
    conf: 0.95
    if:
      type: text
      exclude_html_comments: true
      regex: '(?i)\.GetFiles\s*\(\s*\)'
  - id: aspnet-control-panel-upload-saveas
    desc: ASP.NET upload writes a server file
    crit: notable
    conf: 0.96
    if:
      type: text
      exclude_html_comments: true
      regex: '(?is)FileUpload\w*\.SaveAs\s*\('
  - id: aspnet-control-panel-request-upload-saveas
    desc: ASP.NET upload saves a file
    crit: notable
    conf: 0.97
    if:
      type: text
      exclude_html_comments: true
      regex: '(?is)\.HasFile[\s\S]{0,700}\w+\.SaveAs\s*\(\s*\w+\s*\+\s*["'']/["'']\s*\+\s*\w+'
  - id: aspnet-control-panel-request-file-download
    desc: ASP.NET returns a request-selected file
    crit: notable
    conf: 0.97
    if:
      type: text
      exclude_html_comments: true
      regex: '(?i)Response\s*\.\s*WriteFile\s*\('
  - id: aspnet-control-panel-request-get-value
    desc: ASP.NET reads the requested download path
    crit: notable
    conf: 0.97
    if:
      type: text
      exclude_html_comments: true
      regex: '(?i)Request\s*\.\s*QueryString\s*\[\s*["'']get["'']\s*\]'
  - id: aspnet-control-panel-request-file-delete
    desc: ASP.NET request selects a file for deletion
    crit: notable
    conf: 0.97
    if:
      type: text
      exclude_html_comments: true
      regex: '(?is)File\s*\.\s*Delete\s*\(\s*Request\s*\.\s*QueryString\s*\[\s*["'']del["'']\s*\]\s*\)'
  - id: aspnet-control-panel-directoryinfo
    desc: ASP.NET code constructs a directory handle
    crit: notable
    conf: 0.96
    if:
      type: text
      exclude_html_comments: true
      regex: '(?i)new\s+DirectoryInfo\s*\('
  - id: aspnet-control-panel-recursive-delete
    desc: ASP.NET recursively deletes a directory
    crit: notable
    conf: 0.96
    if:
      type: text
      exclude_html_comments: true
      regex: '(?i)\.Delete\s*\(\s*true\s*\)'
  - id: aspnet-control-panel-hardcoded-password
    desc: ASP.NET code embeds a password literal
    crit: notable
    conf: 0.89
    if:
      type: text
      exclude_html_comments: true
      regex: '(?i)(string|const\s+string)\s+password\s*=\s*["''][^"'']{4,48}["'']'
  - id: aspnet-control-panel-cookie-password-check
    desc: Cookie value checked against a password
    crit: notable
    conf: 0.94
    if:
      type: text
      exclude_html_comments: true
      regex: '(?is)Request\.Cookies\s*\[\s*["''][^"'']{1,48}["'']\s*\]\s*\.\s*Value\s*!=\s*password'
  - id: aspnet-control-panel-user-supplied-sql
    desc: Form query reaches SQL execution
    crit: notable
    conf: 0.97
    if:
      type: text
      exclude_html_comments: true
      regex: '(?i)CreateDynamicTable\s*\(\s*sqlquery\.Text\s*\)'
  - id: aspnet-control-panel-query-executes
    desc: Executes SQL and reads query results
    crit: notable
    conf: 0.94
    if:
      type: text
      exclude_html_comments: true
      regex: '(?is)new\s+SqlCommand\s*\(\s*command\s*,\s*myconn\s*\)[\s\S]{0,180}ExecuteReader\s*\('

composite_rules:
  - id: aspnet-control-panel-command-loop
    desc: ASP.NET form runs commands through cmd.exe and returns output
    crit: hostile
    conf: 0.99
    all:
      - id: micro-behaviors/communications/http/server/managed::aspnet-page-directive
      - id: aspnet-control-panel-cmd-process
      - id: aspnet-control-panel-shell-stdin
      - id: aspnet-control-panel-shell-output
      - id: aspnet-control-panel-command-input

  - id: aspnet-control-panel-file-manager
    desc: ASP.NET endpoint provides a server file manager
    crit: hostile
    conf: 0.99
    all:
      - id: micro-behaviors/communications/http/server/managed::aspnet-page-directive
      - id: aspnet-control-panel-file-listing
      - id: aspnet-control-panel-upload-saveas
      - id: aspnet-control-panel-directoryinfo
      - id: aspnet-control-panel-recursive-delete
      - id: aspnet-control-panel-hardcoded-password
      - id: aspnet-control-panel-cookie-password-check

  - id: aspnet-control-panel-text-command-loop
    desc: ASP.NET request text is run by cmd.exe and returned to the caller
    crit: hostile
    conf: 0.99
    all:
      - id: micro-behaviors/communications/http/server/managed::aspnet-page-directive
      - id: aspnet-control-panel-startinfo-cmd-exe
      - id: aspnet-control-panel-text-startinfo-arguments
      - id: aspnet-control-panel-shell-output

  - id: aspnet-control-panel-request-file-manager
    desc: ASP.NET request can browse, download, upload, and delete server files
    crit: hostile
    conf: 0.99
    all:
      - id: micro-behaviors/communications/http/server/managed::aspnet-page-directive
      - id: aspnet-control-panel-directoryinfo
      - id: aspnet-control-panel-directoryinfo-getdirectories
      - id: aspnet-control-panel-directoryinfo-getfiles
      - id: aspnet-control-panel-request-upload-saveas
      - id: aspnet-control-panel-request-file-download
      - id: aspnet-control-panel-request-get-value
      - id: aspnet-control-panel-request-file-delete

  - id: aspnet-control-panel-static-file-manager
    desc: ASP.NET exposes remote file listing
    crit: hostile
    conf: 0.99
    all:
      - id: micro-behaviors/communications/http/server/managed::aspnet-page-directive
      - id: aspnet-control-panel-file-listing
      - id: aspnet-control-panel-directory-getdirectories
      - id: aspnet-control-panel-upload-saveas
      - id: aspnet-control-panel-request-file-delete

  - id: aspnet-control-panel-database-console
    desc: ASP.NET endpoint executes web-supplied database queries
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/communications/http/server/managed::aspnet-page-directive
      - id: aspnet-control-panel-user-supplied-sql
      - id: aspnet-control-panel-query-executes
      - id: aspnet-control-panel-hardcoded-password
      - id: aspnet-control-panel-cookie-password-check
