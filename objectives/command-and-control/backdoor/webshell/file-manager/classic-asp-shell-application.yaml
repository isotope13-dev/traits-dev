# A request-driven ASP page whose Shell.Application folder objects copy, move
# and launch files. The copy and move calls go through a stored folder variable
# (`fod1.copyhere item`) and the launch through `.Items.Item(x).InvokeVerb`, so
# the one-expression namespace rule does not see them. InvokeVerb on a path the
# visitor typed starts that file on the server: a file manager with remote
# execution is a webshell, not an admin tool.
defaults:
  platforms: [windows]
  for: [asp]
  attack: T1505.003,T1083
  mbc: B0030
traits:
  - id: asp-shell-namespace-invokeverb
    desc: Shell folder item is launched via InvokeVerb
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)\.Namespace\s*\([^)\r\n]{1,60}\)\.Items\.Item\s*\([^)\r\n]{1,60}\)\.InvokeVerb\b'
  - id: asp-shell-folder-copyhere-movehere
    desc: Shell folder object copies or moves items
    crit: notable
    conf: 0.85
    if:
      type: text
      regex: '(?i)\b\w{1,20}\.(CopyHere|MoveHere)[ \t(]+\w'
composite_rules:
  - id: classic-asp-shell-application-file-launcher
    desc: ASP page copies, moves and launches server files via Shell.Application
    crit: hostile
    conf: 0.94
    all:
      - id: micro-behaviors/communications/http/request/superglobal::classic-asp-request-field
      - id: micro-behaviors/os/com/automation::shell-application-progid
      - id: asp-shell-namespace-invokeverb
      - id: asp-shell-folder-copyhere-movehere
