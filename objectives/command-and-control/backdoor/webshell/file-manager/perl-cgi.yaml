defaults:
  for: [perl]
  platforms: [unix, windows]
  mbc: B0030
  attack: T1505.003
traits:
  - id: browse-action-link
    desc: Browse action path link
    crit: suspicious
    conf: 0.84
    if:
      type: text
      substr: 'action=browse&path='
composite_rules:
  - id: perl-cgi-file-browser-webshell
    desc: Perl CGI file browser webshell
    crit: suspicious
    conf: 0.96
    all:
      - id: micro-behaviors/fs/directory/readdir::directory-browser
      - id: micro-behaviors/communications/http/request/cgi::cookie-session
    any:
      - id: browse-action-link
      - id: objectives/command-and-control/backdoor/webshell/request/command::webshell-cookie-name
      - id: objectives/command-and-control/backdoor/webshell/request/command::execute-frame
