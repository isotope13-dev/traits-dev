# Classic ASP upload kits read the raw request with Request.BinaryRead and
# write it through Scripting.FileSystemObject. Either call is common alone.
defaults:
  platforms: [windows]
  for: [asp]
  attack: T1505.003
  mbc: B0030
traits:
  - id: asp-request-binary-read
    desc: ASP reads the raw request body
    crit: notable
    conf: 0.86
    if:
      type: text
      substr: Request.BinaryRead
  - id: asp-upload-filesystem-object
    desc: ASP upload creates a filesystem object
    crit: notable
    conf: 0.84
    if:
      type: text
      substr: Scripting.FileSystemObject
composite_rules:
  - id: asp-binary-upload-shell
    desc: ASP uploads a file from the request
    crit: hostile
    conf: 0.95
    all:
      - id: asp-request-binary-read
      - id: asp-upload-filesystem-object
