# JSP post-exploitation pages often pair a browser file manager with a
# Runtime.exec command sink. The request/ composites already catch the
# command channel; this rule catches the file-manager half when the same
# page also reaches the JVM process API — a combination with no legitimate
# framework counterpart.
#
# JSP has a dedicated file type; other carriers cover embedded JSP pages.
defaults:
  platforms: [unix, windows]
  for: [jsp, java, class, html, javascript, python, vbs]
  attack: T1505.003
  mbc: B0030
traits:
  - id: jsp-save-file-helper
    desc: JSP saveFile helper method
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '\b(void|String|boolean)\s+saveFile\s*\('
  - id: jsp-download-helper
    desc: JSP download helper method
    crit: notable
    conf: 0.88
    if:
      type: text
      regex: '\b(void|String|boolean)\s+download\s*\(\s*String'
composite_rules:
  # cat.jsp-style toolkit: save + download helpers beside a process sink.
  - id: jsp-toolkit-file-manager-shell
    for: [jsp, python, javascript, vbs, html]
    desc: JSP toolkit file manager with process exec
    crit: hostile
    conf: 0.97
    all:
      - id: metadata/lang/scripted::jsp-server-page
      - id: micro-behaviors/communications/http/request/params::java-servlet-get-parameter
      - id: jsp-save-file-helper
      - id: jsp-download-helper
    any:
      - id: micro-behaviors/process/create/exec::java-runtime-exec-source
      - id: micro-behaviors/process/create/exec::java-runtime-variable-exec-source
      - id: micro-behaviors/process/info/query::java-getruntime-ref
  # dy.jsp-style: a saveFile helper is enough when paired with Runtime.exec
  # on a server page that reads request parameters.
  - id: jsp-save-file-command-shell
    for: [jsp, python, javascript, vbs, html]
    desc: JSP saveFile helper with process exec
    crit: hostile
    conf: 0.96
    all:
      - id: metadata/lang/scripted::jsp-server-page
      - id: micro-behaviors/communications/http/request/params::java-servlet-get-parameter
      - id: jsp-save-file-helper
    any:
      - id: micro-behaviors/process/create/exec::java-runtime-exec-source
      - id: micro-behaviors/process/create/exec::java-runtime-variable-exec-source
      - id: micro-behaviors/process/info/query::java-getruntime-ref

  # JSP file manager combining FileInputStream reading, FileOutputStream writing,
  # request parameters, and process execution.
  - id: jsp-file-stream-command-shell
    for: [jsp]
    desc: JSP file stream reader and writer with process exec
    crit: hostile
    conf: 0.97
    unless:
      - id: well-known/tool/offensive/
      - id: metadata/package/testing/presence/harness::test-fixture-directory
    all:
      - id: metadata/lang/scripted::jsp-server-page
      - id: micro-behaviors/communications/http/request/params::java-servlet-get-parameter
      - id: micro-behaviors/fs/read/file/handle::java-source-fileinputstream-use
      - id: micro-behaviors/fs/write/file/handle::java-fileoutputstream-source
    any:
      - id: micro-behaviors/process/create/exec::java-runtime-exec-source
      - id: micro-behaviors/process/create/exec::java-runtime-variable-exec-source
      - id: micro-behaviors/process/info/query::java-getruntime-ref
