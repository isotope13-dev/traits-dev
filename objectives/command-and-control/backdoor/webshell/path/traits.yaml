# Observed Windchill shells were deposited under /Windchill/login/ with
# generated-looking names.  These atoms deliberately cover the naming scheme,
# not a single observed filename, so new shells remain huntable.
defaults:
  platforms: [unix, windows]
  # Basename matching is intentionally capped to a focused carrier set.  The
  # webshell path is a server-side artifact, not a universal filename marker.
  for: [java, php, csharp, javascript, python, shell, html]
  attack: T1505.003
  mbc: B0030

traits:
  - id: hex-named-jsp-webshell-path
    desc: Sixteen-hex JSP webshell filename
    crit: suspicious
    conf: 0.97
    if:
      type: basename
      regex: '^[0-9a-f]{16}\.jsp$'

  - id: dpr-hex-jsp-webshell-path
    desc: DPR-hex JSP webshell filename
    crit: suspicious
    conf: 0.96
    if:
      type: basename
      regex: '^dpr_[0-9a-f]{8}\.jsp$'

  - id: short-hex-jsp-filename
    desc: Six-character lowercase-hex JSP filename
    crit: component
    conf: 0.9
    if:
      type: basename
      regex: '^[0-9a-f]{6}\.jsp$'

composite_rules:
  - id: hex-named-jsp-command-webshell
    desc: Generated-name JSP command webshell
    crit: hostile
    conf: 0.99
    all:
      - id: hex-named-jsp-webshell-path
      - id: metadata/lang/scripted::jsp-server-page
    any:
      - id: micro-behaviors/process/create/spawn::java-runtime-exec-source
      - id: micro-behaviors/process/create/exec::java-runtime-variable-exec-source
      - id: micro-behaviors/process/create/spawn::java-runtime-exec
    unless:
      - id: metadata/package/testing/presence/harness::test-fixture-directory

  - id: dpr-hex-jsp-command-webshell
    desc: DPR-named JSP command webshell
    crit: hostile
    conf: 0.99
    all:
      - id: dpr-hex-jsp-webshell-path
      - id: metadata/lang/scripted::jsp-server-page
    any:
      - id: micro-behaviors/process/create/spawn::java-runtime-exec-source
      - id: micro-behaviors/process/create/exec::java-runtime-variable-exec-source
      - id: micro-behaviors/process/create/spawn::java-runtime-exec
    unless:
      - id: metadata/package/testing/presence/harness::test-fixture-directory

  - id: short-hex-jsp-command-webshell
    desc: Six-hex named JSP command webshell
    crit: hostile
    conf: 0.98
    all:
      - id: short-hex-jsp-filename
      - id: metadata/lang/scripted::jsp-server-page
    any:
      - id: micro-behaviors/process/create/spawn::java-runtime-exec-source
      - id: micro-behaviors/process/create/exec::java-runtime-variable-exec-source
      - id: micro-behaviors/process/create/spawn::java-runtime-exec
    unless:
      - id: metadata/package/testing/presence/harness::test-fixture-directory
