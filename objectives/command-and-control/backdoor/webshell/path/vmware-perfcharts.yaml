# Dropping a JSP under VMware vCenter's perfcharts Tomcat tree turns that
# management webapp into a command channel. Pairing the path with a decoded
# write and passwordless sudo for the perfcharts account is the observed
# post-compromise persistence pattern on VCSA.
defaults:
  platforms: [unix]
  for: [shell, python, javascript, java, html]
  attack: T1505.003,T1548.003
  mbc: B0030

traits:
  - id: base64-decode-to-jsp-path
    desc: Base64 decode writes a JSP path
    crit: suspicious
    conf: 0.94
    for: [shell, python]
    if:
      type: text
      regex: 'base64\s+-d\b[^\n]{0,160}>\s*["'']?[^"''\n]{0,200}\.jsp\b'


  - id: perfcharts-nopasswd-sudoers
    desc: Passwordless sudoers rule for perfcharts account
    crit: suspicious
    conf: 0.96
    for: [shell, python]
    if:
      type: text
      regex: '(?i)\bperfcharts\s+ALL=\(root\)\s+NOPASSWD:\s*ALL\b'

composite_rules:
  - id: perfcharts-jsp-webshell-drop
    desc: Decodes a JSP into VMware perfcharts webapps
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/fs/path/webserver::vmware-perfcharts-statsreport-jsp
      - id: base64-decode-to-jsp-path
    near_lines: 6

  - id: perfcharts-webshell-passwordless-sudo
    desc: Perfcharts JSP drop paired with passwordless sudoers
    crit: hostile
    conf: 0.99
    all:
      - id: perfcharts-jsp-webshell-drop
      - id: perfcharts-nopasswd-sudoers
    any:
      - id: objectives/privilege-escalation/elevation-control/sudo::passwordless-sudoers-dropin
      - id: micro-behaviors/fs/path/config/privesc::etc-sudoers-d
    near_lines: 20
