# Both call facts must occur at the same write site. A shell string elsewhere
# in a catalog cannot turn a harmless PHP file write into a shell deployment.
defaults:
  platforms: [unix, windows]
  for: [javascript]
  attack: T1505.003

composite_rules:
  - id: node-writes-php-command-webshell
    desc: Node writes request-driven command source to a PHP endpoint
    crit: hostile
    conf: 0.99
    near_bytes: 1
    all:
      - id: micro-behaviors/fs/write/file/executable::node-write-php-endpoint
    any:
      - id: micro-behaviors/fs/write/file/full/string::node-write-php-request-command
      - id: micro-behaviors/fs/write/file/full/string::node-write-php-request-command-request
