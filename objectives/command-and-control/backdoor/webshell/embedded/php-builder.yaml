defaults:
  platforms:
  - windows
  - unix
  for:
  - source
  - python
  attack: T1505.003
  mbc: B0030
traits:
- id: php-proc-open-variable
  desc: Embedded PHP proc_open variable command
  crit: notable
  conf: 0.96
  if:
    type: text
    regex: \bproc_open\s*\(\s*\$[A-Za-z_][A-Za-z0-9_]*
- id: php-encryption-call
  desc: Embedded PHP encryption call
  crit: notable
  conf: 0.92
  if:
    type: text
    regex: \bopenssl_(decrypt|encrypt)\s*\(
- id: php-cookie-response-write
  desc: Embedded PHP response cookie write
  crit: notable
  conf: 0.92
  if:
    type: text
    regex: \bset(raw)?cookie\s*\(
composite_rules:
- id: php-webshell-builder
  desc: PHP web shell payload embedded in source (builder)
  crit: hostile
  conf: 0.96
  near_bytes: 4096
  all:
  - id: micro-behaviors/data/embedded/script::embedded-php-open-tag-literal
  - id: micro-behaviors/data/embedded/script::embedded-php-variable-eval
  - id: micro-behaviors/communications/http/request/superglobal::embedded-php-request-superglobal
  unless:
  - id: metadata/package/testing/
  - id: metadata/package/documentation
  - id: metadata/file/extension/identity::markdown-file-basename
  - id: well-known/tool/detection/defensive-scanner-context::published-defensive-scanner-context
  - id: well-known/tool/offensive/
  - id: metadata/path::test-directory-component
- id: php-cookie-command-webshell-builder
  desc: Embedded PHP cookie-command webshell builder
  crit: hostile
  conf: 0.99
  all:
  - id: micro-behaviors/data/embedded/script::embedded-php-open-tag-literal
  - id: php-proc-open-variable
  - id: php-encryption-call
  - id: php-cookie-response-write
  - id: micro-behaviors/communications/http/request/superglobal::embedded-php-request-superglobal
  unless:
  - id: metadata/package/testing/
  - id: well-known/tool/detection/defensive-scanner-context::published-defensive-scanner-context
  - id: metadata/path::test-directory-component
- id: php-upload-recon-webshell-builder
  desc: Embedded PHP host-profiling upload webshell
  crit: hostile
  conf: 0.99
  all:
  - id: micro-behaviors/data/embedded/script::embedded-php-upload-handler
  - id: micro-behaviors/data/embedded/script::embedded-php-host-profile
  - id: micro-behaviors/communications/http/form::multipart-form
  near_bytes: 4096
  unless:
  - id: metadata/package/testing/
  - id: well-known/tool/detection/defensive-scanner-context::published-defensive-scanner-context
  - id: metadata/path::test-directory-component
