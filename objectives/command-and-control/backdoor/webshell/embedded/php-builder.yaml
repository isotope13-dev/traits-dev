defaults:
  platforms:
  - windows
  - unix
  for:
  - source
  - python
  attack: T1505.003
  mbc: B0030
composite_rules:
- id: php-webshell-builder
  desc: PHP web shell payload embedded in source (builder)
  crit: hostile
  conf: 0.96
  near_bytes: 4096
  all:
  - id: micro-behaviors/data/embedded/script::embedded-php-open-tag-literal
  - id: micro-behaviors/data/embedded/script::embedded-php-variable-eval
  - id: micro-behaviors/communications/http/request/superglobal::embedded-php-request-superglobal
  unless:
  - id: well-known/tool/detection/defensive-scanner-context::published-defensive-scanner-context
  - id: metadata/package/testing/harness/unit::python-unittest-test-module
- id: php-cookie-command-webshell-builder
  desc: Embedded PHP cookie-command webshell builder
  crit: hostile
  conf: 0.99
  all:
  - id: micro-behaviors/data/embedded/script::embedded-php-open-tag-literal
  - id: micro-behaviors/data/embedded/script::php-proc-open-variable
  - id: micro-behaviors/data/embedded/script::php-encryption-call
  - id: micro-behaviors/data/embedded/script::php-cookie-response-write
  - id: micro-behaviors/communications/http/request/superglobal::embedded-php-request-superglobal
  unless:
  - id: well-known/tool/detection/defensive-scanner-context::published-defensive-scanner-context
  - id: metadata/package/testing/harness/unit::python-unittest-test-module
- id: php-upload-recon-webshell-builder
  desc: Embedded PHP host-profiling upload webshell
  crit: hostile
  conf: 0.99
  all:
  - id: micro-behaviors/data/embedded/script::embedded-php-upload-handler
  - id: micro-behaviors/data/embedded/script::embedded-php-host-profile
  - id: micro-behaviors/communications/http/form::multipart-form
  near_bytes: 4096
  unless:
  - id: well-known/tool/detection/defensive-scanner-context::published-defensive-scanner-context
  - id: metadata/package/testing/harness/unit::python-unittest-test-module
- id: fragmented-php-command-webshell-builder
  desc: Fragmented embedded PHP command webshell in multipart upload
  crit: hostile
  conf: 0.98
  all:
  - id: micro-behaviors/data/embedded/script::fragmented-embedded-php-command-execution
  - id: micro-behaviors/communications/http/form::multipart-form
  - id: micro-behaviors/fs/path/script::quoted-rooted-php-path
  unless:
  - id: well-known/tool/detection/defensive-scanner-context::published-defensive-scanner-context
  - id: metadata/package/testing/harness/unit::python-unittest-test-module
- id: embedded-wordpress-mu-plugin-webshell-builder
  desc: Embedded PHP payload writes a command webshell into WordPress mu-plugins
  crit: hostile
  conf: 0.99
  for:
  - scripts
  - source
  - -php
  near_bytes: 4096
  all:
  - id: micro-behaviors/fs/path/application/webapp::wp-mu-plugin-path
  - id: micro-behaviors/data/embedded/script::embedded-php-open-tag-literal
  - id: micro-behaviors/data/embedded/script::embedded-php-request-command-fragment
  - id: micro-behaviors/data/embedded/script::embedded-php-file-put-contents
  unless:
  - id: well-known/tool/detection/defensive-scanner-context::published-defensive-scanner-context
  - id: metadata/package/testing/harness/unit::python-unittest-test-module
