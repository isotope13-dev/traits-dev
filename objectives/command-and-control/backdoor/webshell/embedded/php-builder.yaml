defaults:
  platforms:
  - windows
  - unix
  for:
  - source
  - python
  attack: T1505.003
  mbc: B0030
composite_rules:
- id: php-webshell-builder
  desc: Embedded PHP request-evaluation payload
  crit: hostile
  conf: 0.96
  for: [python]
  near_bytes: 4096
  all:
  - id: micro-behaviors/data/embedded/script::embedded-php-open-tag-literal
  - id: micro-behaviors/data/embedded/script::embedded-php-variable-eval
  - id: micro-behaviors/communications/http/request/superglobal::embedded-php-request-superglobal
  unless:
  - id: well-known/tool/detection/defensive-scanner-context::php-source-defensive-scanner-context
  - id: metadata/package/testing/harness/unit::python-unittest-test-module
  - id: metadata/package/testing/presence/fixture::quarantine-restore-test
  - id: metadata/file/format/security-corpus::attack-payload-docstring-corpus
  # A pytest module on a test path embeds PHP probe bodies as request data.
  - id: metadata/package/testing/presence/harness::verified-python-test-file
  downgrade:
    scope: archive
    any:
    - id: metadata/package/testing/presence/path::archive-test-directory-member-path
- id: php-webshell-builder-source
  desc: PHP web shell payload embedded in compiled source (builder)
  crit: hostile
  conf: 0.96
  for: [source]
  near_bytes: 4096
  all:
  - id: micro-behaviors/data/embedded/script::embedded-php-open-tag-literal
  - id: micro-behaviors/data/embedded/script::embedded-php-variable-eval
  - id: micro-behaviors/communications/http/request/superglobal::embedded-php-request-superglobal
  unless:
  - id: well-known/tool/detection/defensive-scanner-context::published-defensive-scanner-context
  - id: metadata/package/testing/harness/unit::go-test-source-file
  - id: metadata/package/testing/presence/jvm::jvm-test-suite-class-declaration
  downgrade:
    scope: archive
    any:
    - id: metadata/package/testing/presence/path::archive-test-directory-member-path
- id: php-cookie-command-webshell-builder
  desc: Embedded PHP cookie-command webshell builder
  crit: hostile
  conf: 0.99
  all:
  - id: micro-behaviors/data/embedded/script::embedded-php-open-tag-literal
  - id: micro-behaviors/data/embedded/script::php-proc-open-variable
  - id: micro-behaviors/data/embedded/script::php-encryption-call
  - id: micro-behaviors/data/embedded/script::php-cookie-response-write
  - id: micro-behaviors/communications/http/request/superglobal::embedded-php-request-superglobal
  unless:
  - id: well-known/tool/detection/defensive-scanner-context::published-defensive-scanner-context
  - id: metadata/package/testing/harness/unit::python-unittest-test-module
- id: php-upload-recon-webshell-builder
  desc: Embedded PHP host-profiling upload webshell
  crit: hostile
  conf: 0.99
  all:
  - id: micro-behaviors/data/embedded/script::embedded-php-upload-handler
  - id: micro-behaviors/data/embedded/script::embedded-php-host-profile
  - id: micro-behaviors/communications/http/form::multipart-form
  near_bytes: 4096
  unless:
  - id: well-known/tool/detection/defensive-scanner-context::published-defensive-scanner-context
  - id: metadata/package/testing/harness/unit::python-unittest-test-module
- id: fragmented-php-command-webshell-builder
  desc: Fragmented embedded PHP command webshell in multipart upload
  crit: hostile
  conf: 0.98
  near_bytes: 4096
  all:
  - id: micro-behaviors/data/embedded/script::fragmented-embedded-php-command-execution
  - id: micro-behaviors/communications/http/form::multipart-form
  - id: micro-behaviors/fs/path/script::quoted-rooted-php-path
  unless:
  - id: well-known/tool/detection/defensive-scanner-context::published-defensive-scanner-context
  - id: metadata/package/testing/harness/unit::python-unittest-test-module
- id: embedded-wordpress-mu-plugin-webshell-builder
  desc: Embedded PHP payload writes a command webshell into WordPress mu-plugins
  crit: hostile
  conf: 0.99
  for:
  - scripts
  - source
  - -php
  near_bytes: 4096
  all:
  - id: micro-behaviors/fs/path/application/webapp::wp-mu-plugin-path
  - id: micro-behaviors/data/embedded/script::embedded-php-open-tag-literal
  - id: micro-behaviors/data/embedded/script::embedded-php-request-command-fragment
  - id: micro-behaviors/data/embedded/script::embedded-php-file-put-contents
  unless:
  - id: well-known/tool/detection/defensive-scanner-context::published-defensive-scanner-context
- id: php-gated-command-webshell-builder
  desc: Embedded HTTP-verified 403-gated PHP command webshell builder
  crit: hostile
  conf: 0.97
  for: [python]
  near_bytes: 2048
  all:
  - id: micro-behaviors/data/embedded/script::embedded-php-command-or-eval-webshell
  - id: micro-behaviors/data/embedded/script::embedded-php-http-response-code-403
  - id: micro-behaviors/communications/http/client/exchange::python-urlopen-constructed-request
  unless:
  - id: well-known/tool/detection/defensive-scanner-context::php-source-defensive-scanner-context
  - id: metadata/package/testing/harness/unit::python-unittest-test-module
  - id: metadata/package/testing/presence/fixture::quarantine-restore-test
  - id: metadata/file/format/security-corpus::attack-payload-docstring-corpus
