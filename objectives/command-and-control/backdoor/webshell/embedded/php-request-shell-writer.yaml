# PHP code that writes a request-driven eval shell to disk. The generated
# source is a string literal, so the escaped `\$` in it hides the variable
# eval from the bare eval atoms. The claim needs the file write, the request
# read, and the escaped eval of a variable inside the same file.
defaults:
  platforms: [unix, windows]
  for: [php]
  attack: T1505.003

traits:
  - id: php-escaped-eval-variable-literal
    desc: Quoted PHP source evaluates an escaped variable
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '\beval\s*\(\s*\\\$[A-Za-z_]\w*\s*\)'
  # The generated source reads the request inside a string literal, where the
  # symbol-level superglobal atoms cannot see it. Request reads are common in
  # PHP, so this leg stays baseline and the composite supplies two notable legs.
  - id: php-quoted-request-superglobal-read
    desc: Quoted PHP source reads a request superglobal
    crit: baseline
    conf: 0.9
    if:
      type: text
      regex: '\$_(GET|POST|REQUEST)\['

composite_rules:
  - id: php-request-eval-shell-write
    desc: PHP writes a request-driven eval shell to disk
    crit: hostile
    conf: 0.96
    near_bytes: 700
    all:
      - id: micro-behaviors/fs/write/file/full/call::php-file-put-contents
      - id: php-quoted-request-superglobal-read
      - id: php-escaped-eval-variable-literal
