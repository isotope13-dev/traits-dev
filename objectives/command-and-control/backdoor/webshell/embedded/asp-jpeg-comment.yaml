traits:
  - id: jpeg-comment-asp-request-eval
    desc: JPEG comment embeds ASP request evaluator
    for: [jpeg]
    platforms: [windows]
    crit: hostile
    conf: 0.98
    attack: T1505.003
    if:
      type: yara
      source: |
        rule jpeg_comment_asp_request_eval {
          strings:
            $comment = /\xff\xfe[\x00-\xff]{2}\s*<%\s*eval\s*\(?\s*request\s*\([^\r\n%]{1,48}\)\s*\)?\s*%>/ nocase
          condition:
            uint16be(0) == 0xffd8 and
            for any i in (1..#comment) : (
              !comment[i] <= uint16be(@comment[i] + 2) + 2 and
              @comment[i] + uint16be(@comment[i] + 2) + 2 <= filesize
            )
        }
