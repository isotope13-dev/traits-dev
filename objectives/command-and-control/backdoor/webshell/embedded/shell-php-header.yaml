defaults:
  platforms: [unix, windows]
  for: [shell]
traits:
  - id: php-header-eval-template
    desc: PHP header evaluation expression in shell text
    crit: suspicious
    conf: 0.94
    if:
      type: text
      regex: 'eval\s*\(\s*\\?\$_SERVER\s*\[\s*["'']HTTP_[^"'']{1,80}["'']\s*\]\s*\)'
  - id: phpsploit-backdoor-template-setting
    desc: phpsploit config sets a backdoor template
    crit: component
    conf: 0.95
    if:
      type: text
      regex: '(?im)^\s*set\s+BACKDOOR\s+'
  - id: phpsploit-generate-backdoor
    desc: phpsploit requests its backdoor payload
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: '(?im)^\s*exploit\s+--get-backdoor\b'
composite_rules:
  - id: phpsploit-header-eval-backdoor-template
    desc: phpsploit config contains header-eval webshell
    crit: hostile
    conf: 0.97
    attack: T1505.003
    all:
      - id: php-header-eval-template
      - id: phpsploit-backdoor-template-setting
      - id: phpsploit-generate-backdoor
