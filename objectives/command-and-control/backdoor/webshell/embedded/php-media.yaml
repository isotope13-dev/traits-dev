# A media container carrying PHP server-side code. PHP is commonly used for
# image polyglots, but the carrier can be any passive media format recognized
# by cleave, so intent is inferred from the combination rather than GIF alone.
defaults:
  platforms: [unix, windows]
  for: [media]
  attack: T1027.009,T1505.003
  mbc: B0030

composite_rules:
  - id: media-carried-php-webshell
    desc: Media-carried PHP webshell
    crit: hostile
    conf: 0.99
    all:
      - id: micro-behaviors/data/embedded/payload/media::php-open-tag-in-media
      - id: micro-behaviors/data/embedded/payload/media::php-request-input-in-media
    any:
      - id: micro-behaviors/data/embedded/payload/media::php-command-exec-in-media
      - id: micro-behaviors/data/embedded/payload/media::php-file-operation-in-media
      - id: micro-behaviors/data/embedded/payload/media::dynamic-eval-in-media
      # assert(string) executes code in PHP, so an assert-driven webshell
      # carries no eval() call; keep convicting it via the assert leg now
      # that dynamic-eval-in-media is eval-only.
      - id: micro-behaviors/data/embedded/payload/media::assert-call-in-media
