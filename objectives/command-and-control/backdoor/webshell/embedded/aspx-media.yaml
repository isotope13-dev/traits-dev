# A passive media carrier containing an ASP.NET request-driven server page. The
# media signature is a delivery/evasion layer; the execution objectives live
# beside the other webshell composites and reuse the capability atoms.
defaults:
  platforms: [windows]
  for: [media]
  attack: T1027.009,T1505.003
  mbc: B0030

composite_rules:
  - id: media-prefixed-aspnet-webshell
    desc: Media-prefixed ASP.NET webshell
    crit: hostile
    conf: 0.99
    all:
      - id: metadata/file/format/media::media-trailing-data
      - id: micro-behaviors/data/embedded/payload/media::aspnet-page-directive-in-media
      - id: micro-behaviors/data/embedded/payload/media::aspnet-server-script-in-media
      - id: micro-behaviors/data/embedded/payload/media::aspnet-request-property-in-media
      - id: micro-behaviors/data/embedded/payload/media::aspnet-request-indexer-in-media
    any:
      - id: micro-behaviors/data/embedded/payload/media::aspnet-processstartinfo-in-media
      - id: micro-behaviors/data/embedded/payload/media::aspnet-directory-enumeration-in-media

  - id: media-aspnet-security-weakened-webshell
    desc: Media ASP.NET webshell with page security controls disabled
    crit: hostile
    conf: 0.99
    all:
      - id: micro-behaviors/data/embedded/payload/media::aspnet-page-directive-in-media
      - id: micro-behaviors/data/embedded/payload/media::aspnet-server-script-in-media
      - id: micro-behaviors/data/embedded/payload/media::aspnet-request-property-in-media
      - id: micro-behaviors/data/embedded/payload/media::aspnet-page-security-disabled-in-media
    any:
      - id: micro-behaviors/data/embedded/payload/media::aspnet-processstartinfo-in-media
      - id: micro-behaviors/data/embedded/payload/media::aspnet-directory-enumeration-in-media

  # The one-liner. Both rules above describe a full webshell pasted into an
  # image and need five or six capabilities to say so; this needs the two that
  # a minimal shell actually has, and requires them of a file that is a
  # rendering image with bytes stuck on the end.
  #
  # `media-trailing-data` is what makes two legs enough. A JPEG that still
  # decodes, plus a server-side page directive, plus an evaluator reading an
  # HTTP parameter, is an upload-filter bypass -- the file passes as an image
  # on the way in and is requested back as a page. Nothing benign has that
  # combination, at any size.
  - id: media-carried-request-eval-webshell
    desc: Media carries a request-evaluating webshell
    crit: hostile
    conf: 0.98
    platforms: [windows, unix]
    all:
      - id: metadata/file/format/media::media-trailing-data
      - id: micro-behaviors/data/embedded/payload/media::request-driven-eval-in-media
    any:
      - id: micro-behaviors/data/embedded/payload/media::aspnet-page-directive-in-media
      - id: micro-behaviors/data/embedded/payload/media::aspnet-server-script-in-media
      - id: micro-behaviors/data/embedded/payload/media::php-open-tag-in-media

  # Same one-liner, but the image header is only a prefix: `GIF89a` followed
  # directly by the page, so the walker finds no trailer and reports a broken
  # container instead of trailing data. A media signature whose structure
  # fails validation and whose body is a server page evaluating a request
  # parameter is the same upload-filter bypass with a lazier disguise.
  - id: media-header-request-eval-webshell
    desc: Media header fronts a request-eval webshell
    crit: hostile
    conf: 0.98
    platforms: [windows, unix]
    all:
      - id: metadata/file/format/media::media-structure-problem-reported
      - id: micro-behaviors/data/embedded/payload/media::request-driven-eval-in-media
    any:
      - id: micro-behaviors/data/embedded/payload/media::aspnet-page-directive-in-media
      - id: micro-behaviors/data/embedded/payload/media::aspnet-server-script-in-media
      - id: micro-behaviors/data/embedded/payload/media::php-open-tag-in-media

  # A GIF that still ends in a trailer, with a JSP scriptlet in the middle
  # that runs a request parameter. Trailing-data rules never see it: the
  # container parses, and the page is not appended after the trailer.
  - id: media-carried-jsp-request-exec
    desc: Media carries a JSP request webshell
    crit: hostile
    conf: 0.97
    platforms: [windows, unix]
    all:
      - id: micro-behaviors/data/embedded/payload/media::jsp-request-parameter-in-media
      - id: micro-behaviors/data/embedded/payload/media::jsp-runtime-exec-in-media
