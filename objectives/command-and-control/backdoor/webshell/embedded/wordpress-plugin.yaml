# A WordPress plugin source fragment embedded in an exploit client or browser
# payload. The plugin metadata header makes the fragment installable through
# WordPress, while request input passed directly to an execution primitive
# makes it a command webshell rather than an ordinary generated plugin.
defaults:
  platforms: [unix, windows]
  for: [scripts, source, -php]
  attack: T1505.003
  mbc: B0030

composite_rules:
  - id: embedded-wordpress-plugin-command-webshell
    desc: Embedded WordPress plugin command webshell
    crit: hostile
    conf: 0.999
    near_bytes: 1024
    all:
      - id: micro-behaviors/data/embedded/script::embedded-wordpress-plugin-header
      - id: micro-behaviors/data/embedded/script::embedded-php-command-exec-call
      - id: objectives/command-and-control/backdoor/webshell/embedded::php-request-superglobal
