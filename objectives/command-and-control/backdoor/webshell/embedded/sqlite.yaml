# An SQLite3 database carrying an embedded PHP request-driven webshell
# (e.g., planted via Drupal's Fail2Install SQLite site_name injection).
# Requires the SQLite3 magic header plus distinct request-input and tagged
# execution primitives within one record/page window so renamed copies stay
# detected.
defaults:
  platforms: [unix, windows]
  for: [data]
  attack: T1505.003
  mbc: B0030

composite_rules:
  - id: sqlite-embedded-php-webshell
    desc: SQLite database embeds PHP request webshell
    crit: hostile
    conf: 0.98
    all:
      - id: metadata/file/magic/identity::sqlite3
      - id: micro-behaviors/data/embedded/script::data-php-tagged-exec
      - id: micro-behaviors/data/embedded/script::data-php-request-webshell
