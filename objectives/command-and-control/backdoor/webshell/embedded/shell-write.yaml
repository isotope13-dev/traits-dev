# Shell facts expose the write and heredoc separately, without binding content
# to its destination. Proximity would also match a harmless write next to a
# quoted webshell example. Require the payload inside that PHP-targeted write.
defaults:
  platforms: [unix]
  for: [shell]
  attack: T1505.003
traits:
  - id: shell-writes-php-command-webshell
    desc: Shell writes request-command PHP source
    crit: hostile
    conf: 0.99
    if:
      type: tree-sitter
      language: bash
      query: |
        ((redirected_statement
          body: (command . name: (command_name (word) @writer) .)
          .
          redirect: (file_redirect [">" ">>"] destination: (_) @path) @output
          . redirect: (heredoc_redirect (heredoc_body) @payload) .)
          (#match? @output "^1?>")
          (#match? @writer "^(/bin/)?cat$")
          (#match? @path "\\.php[\"']?$")
          (#match? @payload "<\\?php")
          (#match? @payload "\\b(system|exec)\\s*\\(\\s*\\$_(GET|POST|REQUEST)\\s*\\["))
        ((redirected_statement
          body: (command . name: (command_name (word) @writer) .)
          . redirect: (heredoc_redirect
            . (heredoc_start)
            . redirect: (file_redirect [">" ">>"] destination: (_) @path) @output
            . (heredoc_body) @payload
            . (heredoc_end) .) .)
          (#match? @output "^1?>")
          (#match? @writer "^(/bin/)?cat$")
          (#match? @path "\\.php[\"']?$")
          (#match? @payload "<\\?php")
          (#match? @payload "\\b(system|exec)\\s*\\(\\s*\\$_(GET|POST|REQUEST)\\s*\\["))
        ((redirected_statement
          body: (command . name: (command_name (word) @writer)
            . argument: (raw_string) @payload .)
          . redirect: (file_redirect [">" ">>"] destination: (_) @path) @output .)
          (#match? @output "^1?>")
          (#match? @writer "^(/bin/)?echo$")
          (#match? @path "\\.php[\"']?$")
          (#match? @payload "<\\?php")
          (#match? @payload "\\b(system|exec)\\s*\\(\\s*\\$_(GET|POST|REQUEST)\\s*\\["))
        ((redirected_statement
          body: (command . name: (command_name (word) @writer)
            . argument: (raw_string) @format
            . argument: (raw_string) @payload .)
          . redirect: (file_redirect [">" ">>"] destination: (_) @path) @output .)
          (#match? @output "^1?>")
          (#match? @writer "^(/usr/bin/)?printf$")
          (#match? @format "^'%s")
          (#match? @path "\\.php[\"']?$")
          (#match? @payload "<\\?php")
          (#match? @payload "\\b(system|exec)\\s*\\(\\s*\\$_(GET|POST|REQUEST)\\s*\\["))
