defaults:
  platforms: [windows, unix]
  for: [pdf]
  attack: T1505.003
  mbc: B0030

composite_rules:
  - id: pdf-php-upload-webshell
    desc: PDF polyglot containing PHP upload shell
    crit: hostile
    conf: 0.99
    all:
      - id: micro-behaviors/data/embedded/payload/document::pdf-header
      - id: micro-behaviors/data/embedded/payload/document::pdf-php-open-tag
      - id: micro-behaviors/data/embedded/payload/document::pdf-upload-source-array
      - id: micro-behaviors/data/embedded/payload/document::pdf-file-copy-call
