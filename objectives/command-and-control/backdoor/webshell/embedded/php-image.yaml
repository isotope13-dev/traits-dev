defaults:
  crit: hostile
  platforms: [windows, unix]
  for: [jpeg, png]
  attack: T1505.003
  mbc: B0030
composite_rules:
  - id: php-code-in-image
    desc: PHP code embedded in image
    conf: 0.98
    all:
      - id: micro-behaviors/data/embedded/payload/media::php-open-tag-in-media
      - id: metadata/file/magic

  - id: gif-prefixed-php-command-webshell
    desc: GIF-prefixed PHP command webshell
    conf: 0.99
    for: [php]
    all:
      - id: micro-behaviors/data/embedded/payload/image::gif-header-in-script
      - id: metadata/lang/scripted::php-open-tag
    any:
      # Bind request input to the command argument. A header plus an unrelated
      # request read and a constant shell command is not a command webshell.
      - id: objectives/command-and-control/backdoor/webshell/request/command::php-request-shell-execution
      - id: objectives/command-and-control/backdoor/webshell/request/command::php-request-shell-execution-alt
    unless:
      - id: well-known/app/system/anthropic-cybersecurity-skills::cybersecurity-skill-template-guide

  - id: gif-prefixed-asp-eval-webshell
    desc: GIF-prefixed Classic ASP eval webshell
    conf: 0.99
    for: [asp]
    all:
      - id: micro-behaviors/data/embedded/payload/image::gif-header-in-script
      - id: objectives/command-and-control/backdoor/webshell/request/eval::classic-asp-request-eval-webshell
