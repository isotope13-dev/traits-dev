defaults:
  platforms: [windows]
  for: [pe, dll]
  attack: "T1113, T1071"

composite_rules:
  - id: native-desktop-context-loader
    desc: Native loader samples desktop context
    crit: suspicious
    conf: 0.94
    all:
      - id: micro-behaviors/data/format/executable/header::x86-mz-pe-signature-check
      - id: micro-behaviors/ui/graphics/draw::gdi-create-compatible-dc
      - id: micro-behaviors/ui/window/probe::get-desktop-window
    any:
      - id: micro-behaviors/communications/socket/init::wsa-startup
      - id: micro-behaviors/os/handler/open::shell-execute
    downgrade:
      any:
        - id: metadata/lang/compiler/native::mingw-pseudo-reloc-runtime
        - id: well-known/app/media/handbrake/
        - id: well-known/lib/media/ffmpeg/
        - id: well-known/lib/media/videolan/
