defaults:
  platforms: [windows]
  for: [pe, dll]
  attack: T1219
  mbc: B0025
composite_rules:
- id: dotnet-surveillance-capture-backdoor
  desc: .NET RAT capture primitives
  crit: suspicious
  conf: 0.95
  all:
  - id: metadata/binary/framework::dotnet-assembly
  any:
  - id: micro-behaviors/hardware/display/screen::copyfromscreen-dotnet
  - id: micro-behaviors/hardware/display/screen::dotnet-copyfromscreen-capture
  - id: micro-behaviors/hardware/input/video::avicap32-device-enum
  - id: micro-behaviors/hardware/input/video::avicap32-dll
  - id: micro-behaviors/hardware/display/screen::dotnet-gdi-managed-screen-capture
  - id: micro-behaviors/hardware/input/mouse/synthesis::mouse-event
  needs: 2
  downgrade:
    any:
    - id: metadata/lang/compiler/managed::winforms-ui
  unless:
  - id: well-known/lib/platform/wine/
- id: dotnet-surveillance-rat-backdoor
  desc: .NET networked surveillance RAT
  crit: hostile
  conf: 0.98
  all:
  - id: metadata/binary/framework::dotnet-assembly
  - id: micro-behaviors/communications/http/client/managed::dotnet-http-client-with-aes
  - id: dotnet-surveillance-capture-backdoor
  - id: objectives/command-and-control/backdoor/dispatch/module::rat-transfer-surveillance-handler-cluster

- id: dotnet-encrypted-resource-surveillance-backdoor
  desc: .NET surveillance backdoor with encrypted resource staging
  crit: hostile
  conf: 0.99
  attack: "T1113,T1027.009,T1140,T1620"
  mbc: "B0025,B0009.014"
  all:
  - id: metadata/binary/layout::pe-no-signature-record
  - id: micro-behaviors/hardware/display/screen::dotnet-copyfromscreen-capture
  - id: micro-behaviors/data/embedded/payload/resource::dotnet-managed-resource-access
  - id: micro-behaviors/crypto/symmetric/3des::triple-des-provider
  - id: micro-behaviors/process/interpreter/reflection/runtime::create-delegate
  unless:
  - id: metadata/signed/platform/
  - id: metadata/binary/vendor/
  - id: well-known/app/
  - id: well-known/lib/

- id: dotnet-embedded-screen-network-control-loader
  desc: .NET embedded PE loader combines screen capture and network control
  crit: hostile
  conf: 0.98
  attack: T1027.009,T1113,T1219
  mbc: B0025,B0009
  all:
  - id: metadata/binary/layout::multiple-pe-embedded
  - id: micro-behaviors/data/embedded/payload/resource::assemblyresolve-hook
  - id: micro-behaviors/hardware/display/screen::gdi-stretchblt
  - id: micro-behaviors/communications/socket/create::networkstream-dotnet-str
  - id: micro-behaviors/process/create/shellexec::shell-execute-call

- id: dotnet-resource-screen-command-loader
  desc: .NET resource loader combines screen capture with HTTP control
  crit: hostile
  conf: 0.97
  attack: T1027.009,T1113,T1071.001,T1219
  mbc: B0025,B0009
  all:
  - id: micro-behaviors/data/embedded/payload/resource::dotnet-getmanifestresourcestream
  - id: micro-behaviors/hardware/display/screen::gdi-bitblt
  - id: micro-behaviors/communications/http/message::raw-http-control-request-line
  - id: micro-behaviors/process/create/spawn::use-shell-execute-property
