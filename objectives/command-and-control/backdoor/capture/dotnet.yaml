defaults:
  crit: hostile
  platforms:
  - windows
  for:
  - pe
  - dll
  attack: T1219
  mbc: B0025
composite_rules:
- id: dotnet-surveillance-rat-backdoor
  desc: .NET networked surveillance RAT
  conf: 0.98
  all:
  - id: metadata/binary/framework::dotnet-assembly
  - id: micro-behaviors/communications/http/client/managed::dotnet-http-client-with-aes
  - id: micro-behaviors/ui/window/automation::dotnet-capture-or-input-apis
  - id: objectives/command-and-control/backdoor/dispatch/module::rat-transfer-surveillance-handler-cluster
- id: dotnet-encrypted-resource-surveillance-backdoor
  desc: .NET surveillance backdoor with encrypted resource staging
  conf: 0.99
  attack: T1113,T1027.009,T1140,T1620
  mbc: B0025,B0009.014
  all:
  - id: metadata/signed/trust-level::unsigned-missing-signature-record
  - id: micro-behaviors/hardware/display/screenshot::dotnet-copyfromscreen-capture
  - id: micro-behaviors/data/embedded/payload/resource::dotnet-managed-resource-access
  - id: micro-behaviors/crypto/symmetric/3des::triple-des-provider
  - id: micro-behaviors/metaprogramming/reflection::dotnet-create-delegate-reference
  unless:
  - id: metadata/signed/platform/
  - id: metadata/binary/vendor/
  - id: well-known/app
  - id: well-known/lib
- id: dotnet-resource-screen-command-loader
  desc: .NET resource loader combines screen capture with HTTP control
  conf: 0.97
  attack: T1027.009,T1113,T1071.001,T1219
  mbc: B0025,B0009
  all:
  - id: micro-behaviors/data/embedded/payload/resource::dotnet-getmanifestresourcestream
  - id: micro-behaviors/hardware/display/screen::gdi-bitblt
  - id: micro-behaviors/communications/http/message::raw-http-control-request-line
  - id: micro-behaviors/process/create/flags::use-shell-execute-property
  unless:
  - id: metadata/signed/platform/
  - id: metadata/binary/vendor/
  - id: metadata/signed/trust-level::signer-evidence-present
  - id: well-known/app
  - id: well-known/lib
  - id: well-known/dual-use/remote-admin/screenconnect::screenconnect-vendor-binary-context
  - id: well-known/dual-use/remote-admin/screenconnect::screenconnect-runner-binary-context
  downgrade:
    any:
    - id: well-known/dual-use/remote-admin/screenconnect::screenconnect-authenticode-signer
