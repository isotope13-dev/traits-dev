# Native source and patch-level backdoor delivery patterns.
defaults:
  platforms: [unix, windows]
  for: [c, cpp, text]
  mbc: B0030

traits:
  - id: diff-inet-address-call
    desc: Text adds an inet address literal
    crit: notable
    conf: 0.95
    for: [text]
    if:
      type: text
      regex: 'inet_addr\s*\(\s*"[0-9]{1,3}(\.[0-9]{1,3}){3}"'
  - id: diff-native-connect-call
    desc: Text adds a native connect call
    crit: notable
    conf: 0.9
    for: [text]
    if:
      type: text
      substr: 'connect('
  - id: diff-native-stdio-duplication
    desc: Text adds native stdio duplication
    crit: notable
    conf: 0.9
    for: [text]
    if:
      type: text
      substr: 'dup2('
  - id: diff-native-shell-exec
    desc: Text adds native shell execution
    crit: notable
    conf: 0.95
    for: [text]
    if:
      type: text
      regex: '(bin/sh|execve\s*\()'
  - id: diff-magic-system-macro
    desc: Text adds a system-call macro
    crit: notable
    conf: 0.95
    for: [text]
    if:
      type: text
      substr: DEBUG3_DOLOG_SYSTEM
  - id: diff-magic-readbuf-guard
    desc: Text gates on a read-buffer marker
    crit: notable
    conf: 0.95
    for: [text]
    if:
      type: text
      substr: 'memcmp(readbuf'

composite_rules:
  - id: source-fixed-ip-http-backdoor-trigger
    desc: C source sends fixed-IP HTTP trigger
    crit: hostile
    conf: 0.97
    for: [c, cpp]
    attack: T1095,T1195.002
    near_lines: 80
    all:
      - id: micro-behaviors/communications/ip/literal::external-ipv4-c-source-literal
      - id: micro-behaviors/communications/socket/create::tcp-connect-socket-source
      - id: micro-behaviors/communications/socket/send::send-symbol
      - id: micro-behaviors/communications/http/message::raw-http-safe-request-line-source

  - id: diff-fixed-address-native-reverse-shell
    desc: Diff adds a fixed-address reverse shell
    crit: hostile
    conf: 0.99
    for: [text]
    attack: T1059.004,T1095,T1195.002
    near_lines: 50
    all:
      - id: diff-inet-address-call
      - id: diff-native-connect-call
      - id: diff-native-stdio-duplication
      - id: diff-native-shell-exec

  - id: diff-magic-packet-system-backdoor
    desc: Diff adds magic-packet system backdoor
    crit: hostile
    conf: 0.99
    for: [text]
    attack: T1059.004,T1195.002
    near_lines: 60
    all:
      - id: diff-magic-system-macro
      - id: diff-magic-readbuf-guard
      - id: micro-behaviors/process/create/shell/spawn::untyped-shell-out-primitive-call
