# Native source and patch-level backdoor delivery patterns.
defaults:
  platforms: [unix, windows]
  for: [c, cpp, text, html]
  mbc: B0030

traits:
  - id: diff-inet-address-call
    desc: Text adds an inet address literal
    crit: notable
    conf: 0.95
    for: [text]
    if:
      type: text
      regex: 'inet_addr\s*\(\s*"[0-9]{1,3}(\.[0-9]{1,3}){3}"'
  - id: diff-native-connect-call
    desc: Text adds a native connect call
    crit: notable
    conf: 0.9
    for: [text]
    if:
      type: text
      # An added patch line, as the name says; a bare `connect(` is in every
      # socket client and in SQL test scripts (spider's `connect(...)`).
      regex: '(?m)^\+[^+\n][^\n]{0,118}\bconnect\s*\('
  - id: diff-native-stdio-duplication
    desc: Text adds native stdio duplication
    crit: notable
    conf: 0.9
    for: [text]
    if:
      type: text
      # An added patch line, as the name says; a bare `dup2(` is in every
      # strace log and stdio-redirection snippet.
      regex: '(?m)^\+[^+\n][^\n]{0,118}\bdup2\s*\('
  - id: diff-native-shell-exec
    desc: Text adds native shell execution
    crit: notable
    conf: 0.95
    for: [text]
    if:
      type: text
      # This objective describes an added patch line, not any source text
      # that happens to mention a shell or execve.
      regex: '(?m)^\+[^+\n][^\n]{0,118}(bin/sh|execve\s*\()'
  - id: diff-magic-system-macro
    desc: Text adds a system-call macro
    crit: notable
    conf: 0.95
    for: [text]
    if:
      type: text
      substr: DEBUG3_DOLOG_SYSTEM
  - id: diff-magic-readbuf-guard
    desc: Text gates on a read-buffer marker
    crit: notable
    conf: 0.95
    for: [text]
    if:
      type: text
      substr: 'memcmp(readbuf'

  - id: source-createfile-write-access
    desc: CreateFile opens a file for writing
    crit: notable
    conf: 0.92
    if:
      type: text
      regex: '(?i)CreateFile[AW]?\s*\([^;]{0,64}\bGENERIC_WRITE\b'

  - id: source-writefile-call
    desc: Native WriteFile call in source
    crit: notable
    conf: 0.85
    if:
      type: text
      regex: '(?i)\bWriteFile\s*\('

  - id: source-createfile-read-access
    desc: CreateFile opens a file for reading
    crit: notable
    conf: 0.92
    if:
      type: text
      regex: '(?i)CreateFile[AW]?\s*\([^;]{0,64}\bGENERIC_READ\b'

  - id: source-winsock-connect
    desc: Native socket connect call
    crit: notable
    conf: 0.88
    if:
      type: text
      regex: '(?i)\bconnect\s*\(\s*[a-zA-Z0-9_]+\s*,\s*\([^)]{1,32}\)\s*&'

  - id: source-file-transfer-status
    desc: File transfer status message
    crit: notable
    conf: 0.90
    if:
      type: text
      regex: '(?i)(Downloaded|Uploaded)\s*\[?\s*%d'

  - id: source-getfilesize-call
    desc: Native GetFileSize call in source
    crit: notable
    conf: 0.85
    if:
      type: text
      regex: '(?i)\bGetFileSize\s*\('

composite_rules:
  - id: source-fixed-ip-http-backdoor-trigger
    desc: C source sends fixed-IP HTTP trigger
    crit: hostile
    conf: 0.97
    for: [c, cpp]
    attack: T1095,T1195.002
    near_lines: 80
    all:
      - id: micro-behaviors/communications/ip/literal::external-ipv4-c-source-literal
      - id: micro-behaviors/communications/socket/create::tcp-connect-socket-source
      - id: micro-behaviors/communications/socket/send::send-symbol
      - id: micro-behaviors/communications/http/message::raw-http-safe-request-line-source

  - id: diff-fixed-address-native-reverse-shell
    desc: Diff adds a fixed-address reverse shell
    crit: hostile
    conf: 0.99
    for: [text]
    attack: T1059.004,T1095,T1195.002
    near_lines: 50
    all:
      - id: diff-inet-address-call
      - id: diff-native-connect-call
      - id: diff-native-stdio-duplication
      - id: diff-native-shell-exec

  - id: diff-magic-packet-system-backdoor
    desc: Diff adds magic-packet system backdoor
    crit: hostile
    conf: 0.99
    for: [text]
    attack: T1059.004,T1195.002
    near_lines: 60
    all:
      - id: diff-magic-system-macro
      - id: diff-magic-readbuf-guard
      - id: micro-behaviors/process/create/shell/spawn::untyped-shell-out-primitive-call

  - id: source-socket-file-download-routine
    desc: Socket file download write routine
    crit: suspicious
    conf: 0.95
    for: [c, cpp]
    near_bytes: 1500
    all:
      - id: source-createfile-write-access
      - id: source-writefile-call
      - id: micro-behaviors/communications/socket/receive::recv-symbol
    unless:
      - id: well-known/tool/development/runtime/qemu::source-tree-path


  - id: source-socket-file-upload-routine
    desc: Socket file upload read routine
    crit: suspicious
    conf: 0.95
    for: [c, cpp]
    near_bytes: 1500
    all:
      - id: source-createfile-read-access
      - id: micro-behaviors/fs/read/file/handle::win32-readfile-source-call
      - id: micro-behaviors/communications/socket/send::send-symbol

  - id: native-source-rat-file-transfer
    desc: Native source backdoor socket file transfer
    crit: hostile
    conf: 0.98
    for: [c, cpp]
    attack: T1105,T1059.003
    mbc: B0022,B0024
    near_bytes: 4096
    all:
      - id: source-socket-file-download-routine
      - id: source-socket-file-upload-routine
      - id: source-winsock-connect
    any:
      - id: source-file-transfer-status
      - id: source-getfilesize-call
