# A native SQL Server extended-procedure DLL: it exports the __GetXpVersion entry
# point that SQL Server requires and runs a command string held in a variable.
# Once sp_addextendedproc registers it, any SQL login allowed to call the xp runs
# OS commands as the SQL Server service account. Stock xp DLLs do not compute
# their command through system() from an identifier, so both legs must hold.
defaults:
  platforms: [windows]
  for: [c, cpp]
  attack: T1505.001

traits:
  - id: xp-version-export
    desc: SQL Server xp DLL version export name
    crit: notable
    conf: 0.95
    if:
      type: text
      substr: __GetXpVersion

  - id: sp-add-extended-proc
    desc: Registers a SQL Server extended procedure
    crit: notable
    conf: 0.92
    if:
      type: text
      regex: '(?i)\bsp_addextendedproc\b'

composite_rules:
  - id: sqlserver-xp-marker
    desc: SQL Server extended-procedure export or registration
    crit: notable
    any:
      - id: xp-version-export
      - id: sp-add-extended-proc

  - id: sqlserver-xp-command-dll
    desc: SQL Server xp DLL runs a command from a variable
    crit: hostile
    conf: 0.93
    all:
      - id: micro-behaviors/process/create/shell/variable-command::c-computed-command-execution
      - id: sqlserver-xp-marker
