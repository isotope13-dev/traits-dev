defaults:
  platforms: [unix, windows]
  for: [yaml]
  attack: T1543

# A Bukkit/Spigot plugin manifest (plugin.yml) declares the plugin's name and
# main class. The name leg is the self-declared identity; the manifest leg
# shows the descriptor is a Minecraft server plugin. Both are required, so a
# stray "backdoor" value elsewhere in YAML does not qualify.
traits:
  - id: minecraft-plugin-backdoor-name
    desc: Minecraft plugin manifest named BackDoor
    crit: notable
    conf: 0.8
    if:
      type: value
      path: name
      regex: '(?i)^back[ _-]?door$'

  - id: minecraft-plugin-main-class
    desc: Plugin manifest names a Java main class
    crit: notable
    conf: 0.85
    if:
      type: value
      path: main
      regex: '^[a-z][a-z0-9_]*(\.[a-z0-9_]+)+\.[A-Z][A-Za-z0-9_$]*$'

composite_rules:
  - id: minecraft-plugin-backdoor-manifest
    desc: Bukkit plugin manifest self-named as a backdoor
    crit: hostile
    conf: 0.8
    all:
      - id: minecraft-plugin-backdoor-name
      - id: minecraft-plugin-main-class
