defaults:
  platforms: [windows]
  for: [source]

traits:
  # Unlike prose containing the word "backdoor", this matcher requires a
  # source-language string literal that names an executable path or basename.
  - id: backdoor-executable-name-source
    desc: Executable path explicitly names a backdoor
    crit: suspicious
    conf: 0.92
    if:
      type: literal
      kind: string
      regex: '(?i)(^|[\\/])backdoor\.exe\b'
