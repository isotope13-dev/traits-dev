defaults:
  platforms: [unix, windows]
  for: [php, html, text, data]
  attack: T1505.003
  mbc: B0030

traits:
  - id: php-encode-path-function
    desc: PHP encode path helper
    crit: notable
    conf: 0.92
    if:
      type: text
      substr: 'function encodePath($path)'
  - id: php-decode-path-function
    desc: PHP decode path helper
    crit: notable
    conf: 0.92
    if:
      type: text
      substr: 'function decodePath($path)'
  - id: php-path-unlink-handler
    desc: PHP PATH unlink handler
    crit: notable
    conf: 0.95
    if:
      type: text
      substr: 'if(unlink($name))'
composite_rules:
  - id: inline-php-file-manager-router
    desc: Inline PHP file manager router
    crit: suspicious
    conf: 0.96
    all:
      - id: micro-behaviors/communications/http/query::php-get-path-router-p
      - id: micro-behaviors/communications/http/query::php-get-path-router-q
      - id: php-encode-path-function
      - id: php-decode-path-function
      - id: micro-behaviors/fs/enumerate/directory::php-path-scandir-panel
  - id: inline-php-file-edit-handler
    desc: Inline PHP file edit handler
    crit: suspicious
    conf: 0.96
    all:
      - id: micro-behaviors/fs/read/file/full::php-path-file-read-edit-form
      - id: micro-behaviors/fs/write/file/handle::php-path-file-write-edit-form
  - id: inline-php-delete-handler
    desc: Inline PHP file delete handler
    crit: suspicious
    conf: 0.96
    all:
      - id: php-path-unlink-handler
      - id: micro-behaviors/fs/delete/directory::php-path-rmdir-handler
  - id: inline-php-upload-edit-webshell
    desc: Inline PHP upload/edit file-manager webshell
    crit: hostile
    conf: 0.98
    all:
      - id: inline-php-file-manager-router
      - id: micro-behaviors/fs/write/file/copy::php-path-upload-handler
      - id: inline-php-file-edit-handler
  - id: inline-php-destructive-file-manager-webshell
    desc: Inline PHP destructive file-manager webshell
    crit: hostile
    conf: 0.98
    all:
      - id: inline-php-file-manager-router
      - id: inline-php-delete-handler
    any:
      - id: micro-behaviors/fs/write/file/copy::php-path-upload-handler
      - id: inline-php-file-edit-handler
