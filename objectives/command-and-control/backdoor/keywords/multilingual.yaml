# Non-English generic malware-category labels — the multilingual companions to
# the English malware/trojan/backdoor/stealer vocabulary in generic-malware.yaml.
# Only the category nouns that name "what the malware is" live here; terms that
# name a *specific* objective are filed with that objective (keylogger →
# keyboard/label, ransomware → impact/ransom, botnet → c2/botnet, RAT →
# c2/remote-command, spyware → exfiltration/stealer/surveillance, AV-evasion →
# evasion/security-bypass, phishing/scam → credential-access/phishing).
#
# Matching: CJK has no word boundaries → substr; Cyrillic → case-insensitive
# substr (catches inflected forms); Arabic/Vietnamese phrases → substr.
defaults:
  platforms: [unix, windows, android]
  # Opaque native blobs and encoded data routinely contain accidental
  # matches for ordinary language words.
  for: [scripts, source, documents]
  conf: 0.7

traits:
  # --- "malware" / "malicious code" (notable, rare outside the sample) -------
  # Project documentation is the one place these words are ordinary prose: a
  # README explains what a security warning means, tells users to scan a
  # download, or states that the project contains none. GitHub Store's Russian
  # README carries "…Apple не может проверить GitHub Store на наличие
  # вредоносного ПО" — a paragraph about the macOS Gatekeeper dialog — which
  # gave a translated readme a command-and-control/backdoor finding. Every
  # category label below therefore skips documentation context; the lexicon
  # composite still fires on code and data that enumerate these labels.
  - id: ru-malware-term
    desc: Russian malware-context term
    crit: notable
    if:
      id: metadata/lang/natural::ru-malware-term
    unless:
      - id: metadata/package/documentation/source::documentation-dir-path
      - id: metadata/package/documentation/source::package-doc-reference-basename
      - id: metadata/file/format/markup::adblock-filter-list
      - id: metadata/lang/locale::i18n-module-basename
      - id: metadata/lang/locale::multilingual-ui-language-table
  - id: fa-malware-term
    desc: Farsi malware term (بدافزار)
    crit: notable
    conf: 0.8
    if:
      type: text
      substr: بدافزار
    unless:
      - id: metadata/package/documentation/source::documentation-dir-path
      - id: metadata/package/documentation/source::package-doc-reference-basename
      - id: metadata/lang/locale::i18n-module-basename
      - id: metadata/lang/locale::multilingual-ui-language-table
  - id: ko-malware-term
    desc: Korean malware term (악성코드)
    crit: notable
    if:
      id: metadata/lang/natural::ko-malware-term
    unless:
      - id: metadata/package/documentation/source::documentation-dir-path
      - id: metadata/package/documentation/source::package-doc-reference-basename
      - id: metadata/lang/locale::i18n-module-basename
      - id: metadata/lang/locale::multilingual-ui-language-table
  - id: vi-malware-term
    desc: Vietnamese malware term (mã độc)
    crit: notable
    if:
      id: metadata/lang/natural::vi-malware-term
    unless:
      - id: metadata/package/documentation/source::documentation-dir-path
      - id: metadata/package/documentation/source::package-doc-reference-basename
      - id: metadata/lang/locale::i18n-module-basename
      - id: metadata/lang/locale::multilingual-ui-language-table
  - id: tr-malware-term
    desc: Turkish malware term (zararlı yazılım)
    crit: notable
    if:
      type: text
      substr: zararlı yazılım
    unless:
      - id: metadata/package/documentation/source::documentation-dir-path
      - id: metadata/package/documentation/source::package-doc-reference-basename
  - id: ar-malware-term
    desc: Arabic malware term (برمجية خبيثة)
    crit: notable
    if:
      id: metadata/lang/natural::ar-malware-term
    unless:
      - id: metadata/package/documentation/source::documentation-dir-path
      - id: metadata/package/documentation/source::package-doc-reference-basename
  - id: es-malicious-code-term
    desc: Spanish 'malicious code' term (código malicioso)
    crit: notable
    if:
      id: metadata/lang/natural::es-malicious-code-term
    unless:
      - id: metadata/package/documentation/source::documentation-dir-path
      - id: metadata/package/documentation/source::package-doc-reference-basename

  # --- "stealer" (notable transliteration) ----------------------------------
  - id: ru-stealer-term
    desc: Russian infostealer term (стилер)
    crit: notable
    attack: T1555
    if:
      type: text
      substr: стилер
      case_insensitive: true

  # --- "trojan" (component — collides with mythology / proxy protocols) -----
  - id: ru-trojan-term
    desc: Russian trojan term (троян)
    crit: notable
    conf: 0.5
    if:
      type: text
      substr: троян
      case_insensitive: true
  - id: fa-trojan-term
    desc: Farsi trojan term (تروجان)
    crit: notable
    conf: 0.5
    if:
      type: text
      substr: تروجان
  - id: ko-trojan-term
    desc: Korean trojan-horse term (트로이목마)
    crit: notable
    conf: 0.5
    if:
      type: text
      substr: 트로이목마
  - id: tr-trojan-term
    desc: Turkish trojan-horse phrase
    crit: notable
    conf: 0.45
    if:
      type: text
      regex: '\btruva[ \t]+atı\b'
      case_insensitive: true
    unless:
      - type: basename
        regex: '(?i)^(english[_-]?words?|words?|dictionary)\.txt$'
      - id: well-known/dual-use/tunnel/mihomo::mihomo-comment-bundle
  - id: ar-trojan-term
    desc: Arabic trojan-horse term (حصان طروادة)
    crit: notable
    conf: 0.5
    if:
      type: text
      substr: حصان طروادة
  - id: pt-trojan-term
    desc: Portuguese trojan-horse term (cavalo de troia)
    crit: notable
    conf: 0.5
    if:
      type: text
      regex: 'cavalo de tr[oó]ia'
      case_insensitive: true
  - id: es-trojan-term
    desc: Spanish trojan term (troyano)
    crit: notable
    conf: 0.45
    if:
      type: text
      # Troyano is also a surname (zxcvbn's name list); require an article
      # or malware noun phrase around it.
      regex: '(?i)\b(un|el|los|virus|tipo)\s+troyanos?\b|\btroyanos?\s+(bancario|de acceso)'

  # --- "stealer/thief" calques (component — also everyday "thief") ----------
  - id: pt-stealer-term
    desc: Portuguese thief word literal (ladrão)
    crit: component
    conf: 0.4
    for: [javascript, typescript]
    if:
      type: literal
      exact: ladrão
      case_insensitive: true
  - id: es-stealer-term
    desc: Spanish thief word literal (ladrón)
    crit: component
    conf: 0.4
    for: [javascript, typescript]
    if:
      type: literal
      exact: ladrón
      case_insensitive: true

composite_rules:
  # Several unambiguous malware-category labels co-occurring in one file is a
  # strong "operator-facing malware tooling" signal. Restricted to the notable
  # terms (not the collision-prone calques) and guarded against multilingual
  # AV/SAST products that legitimately enumerate these words.
  - id: multilingual-malware-lexicon-cluster
    desc: Multiple non-English malware category labels
    crit: suspicious
    conf: 0.8
    near_lines: 60
    near_bytes: 2048
    needs: 3
    any:
      - id: ru-malware-term
      - id: fa-malware-term
      - id: ko-malware-term
      - id: vi-malware-term
      - id: tr-malware-term
      - id: ar-malware-term
      - id: es-malicious-code-term
      - id: metadata/lang/natural::ru-backdoor-term
      - id: metadata/lang/natural::ko-backdoor-term
      - id: ru-stealer-term
    unless:
      - id: well-known/tool/detection/
      - id: metadata/lang/locale::i18n-module-basename
      - id: metadata/lang/locale::multilingual-ui-language-table
      - id: well-known/tool/development/docs/storybook::storybook-ui-bundle-context
