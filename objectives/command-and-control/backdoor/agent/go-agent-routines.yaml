defaults:
  platforms: [windows, unix]
  for: [elf]

traits:
  - id: go-agent-shellcode-injection-name
    desc: Go agent names shellcode injection routine
    crit: notable
    conf: 0.92
    if:
      type: hex
      section: .gopclntab
      # Go function-table names are NUL-terminated bytes.
      pattern: "2F 69 6E 74 65 72 6E 61 6C 2F 61 67 65 6E 74 2E 49 6E 6A 65 63 74 53 68 65 6C 6C 63 6F 64 65 00"
  - id: go-agent-persistence-name
    desc: Go agent names persistence routine
    crit: notable
    conf: 0.92
    if:
      type: hex
      section: .gopclntab
      # Go function-table names are NUL-terminated bytes.
      pattern: "2F 69 6E 74 65 72 6E 61 6C 2F 61 67 65 6E 74 2E 50 65 72 73 69 73 74 41 6C 6C 49 6E 4F 6E 65 00"
  - id: go-agent-c2-name
    desc: Go agent names command-channel routine
    crit: notable
    conf: 0.9
    if:
      type: hex
      section: .gopclntab
      # Go function-table names are NUL-terminated bytes.
      pattern: "2F 69 6E 74 65 72 6E 61 6C 2F 61 67 65 6E 74 2E 43 6F 6E 6E 65 63 74 43 43 00"
  - id: go-agent-reverse-shell-name
    desc: Go agent names reverse-shell routine
    crit: notable
    conf: 0.92
    if:
      type: hex
      section: .gopclntab
      # Go function-table names are NUL-terminated bytes.
      pattern: "2F 69 6E 74 65 72 6E 61 6C 2F 61 67 65 6E 74 2E 72 65 76 65 72 73 65 53 68 65 6C 6C 00"

composite_rules:
  - id: go-agent-injection-persistence-c2
    desc: Go agent names injection, persistence and C2
    crit: hostile
    conf: 0.96
    scope: file
    all:
      - id: metadata/lang/compiler/systems::go-binary
      - id: go-agent-shellcode-injection-name
      - id: go-agent-persistence-name
      - id: go-agent-c2-name
      - id: go-agent-reverse-shell-name
