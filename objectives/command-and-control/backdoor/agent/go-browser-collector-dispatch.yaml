defaults:
  platforms: [unix, windows]
  for: [go]
  attack: T1071,T1059,T1539

traits:
  - id: go-agent-command-shell-dispatch
    desc: Agent dispatches remote shell commands
    crit: suspicious
    conf: 0.98
    if:
      type: text
      regex: '(?s)case\s+config\.COMMAND_OSSHELL\s*:.{0,100}processOsShell\s*\('
  - id: go-agent-browser-cookie-dispatch
    desc: Agent dispatches browser cookie collection
    crit: suspicious
    conf: 0.98
    if:
      type: text
      regex: '(?s)case\s+config\.AUTO_CHROME_COOKIE\s*:.{0,100}AutoModeChromeCookie\s*\('
  - id: go-agent-browser-login-dispatch
    desc: Agent dispatches browser login collection
    crit: suspicious
    conf: 0.98
    if:
      type: text
      regex: '(?s)case\s+config\.AUTO_CHROME_KEYCHAIN\s*:.{0,100}AutoModeMacChromeLoginData\s*\('
  - id: go-agent-message-exchange-loop
    desc: Agent exchanges and decodes control messages
    crit: notable
    conf: 0.98
    if:
      type: text
      regex: '(?s)transport\.HtxpExchange\s*\(.{0,150}command\.DecodeMsg\s*\('

composite_rules:
  - id: go-browser-collector-command-agent
    desc: Command agent controls shell and browser collection
    crit: hostile
    conf: 0.99
    all:
      - id: go-agent-command-shell-dispatch
      - id: go-agent-browser-cookie-dispatch
      - id: go-agent-browser-login-dispatch
      - id: go-agent-message-exchange-loop
