defaults:
  for: [javascript, typescript]
  platforms: [unix, windows]
  attack: T1557
traits:
  - id: mcp-installer-tool-name
    desc: MCP tool exposes an installer operation
    crit: notable
    conf: 0.95
    if:
      type: string_literal
      exact: install_mcp
  - id: mcp-install-command-text
    desc: Text names an install_command field
    crit: component
    conf: 0.9
    if:
      type: text
      substr: install_command
  - id: mcp-installer-operation-text
    desc: Contains an MCP installer operation
    crit: notable
    conf: 0.95
    if:
      type: text
      substr: install_mcp
  - id: mcp-install-parameters-text
    desc: MCP installer accepts package parameters
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: '(mcp_id.{0,120}env_vars|env_vars.{0,120}mcp_id)'
  - id: mcp-launcher-token-environment
    desc: MCP launcher uses an access-token key
    crit: notable
    conf: 0.96
    if:
      type: string_literal
      exact: TOOL_TOKEN
  - id: mcp-bundled-npx-package-launch
    desc: MCP launches bundled packages via npx -y
    crit: notable
    conf: 0.94
    if:
      type: text
      # Either order: compiled launch records read
      # `'args':['-y',pkg['package_name']]`, hand-written ones the reverse.
      regex: '(package_name.{0,200}[''"]-y[''"]|[''"]-y[''"].{0,200}package_name)'
composite_rules:
  - id: mcp-install-command-field
    desc: MCP response supplies an install command field
    crit: notable
    conf: 0.96
    all:
      - id: mcp-install-command-text
    any:
      - id: mcp-installer-operation-text
      - id: mcp-install-parameters-text
    unless:
      - id: micro-behaviors/os/package-manager/upgrade::npm-registry-self-update-check-marker
  # Either installer tell: a plaintext `install_command` response field, or
  # the installer parameter schema (`mcp_id` + `env_vars`) that survives
  # string-table obfuscation. Composites use this instead of requiring one
  # spelling, so encoded and plain builds both convict.
  - id: mcp-installer-evidence
    desc: MCP installer operation evidence
    crit: notable
    conf: 0.96
    any:
      - id: mcp-install-command-field
      - id: mcp-install-parameters-text
  # JSON-RPC to a child process, a readline prompt, and an HTTP client
  # co-exist in a large session-manager bundle without forming a relay.
  # The envelope, the stdin read, and the post have to share one span.
  - id: stdin-http-relay
    desc: Stdin-to-HTTP relay proxy
    crit: suspicious
    conf: 0.9
    near_bytes: 8192
    all:
      - id: micro-behaviors/communications/rpc::jsonrpc-2-protocol-object
      - id: micro-behaviors/process/fd/stdio::js-stdin-read
      - id: micro-behaviors/process/fd/stdio::js-readline-interface-create
    any:
      - id: micro-behaviors/communications/http/post::axios-post-call
      - id: micro-behaviors/communications/http/post::fetch-post-call
      - id: micro-behaviors/communications/http/post::node-http-request-post
    unless:
      - id: well-known/tool/development/vscode-extension/tencent-codebuddy::codebuddy-marker
      - id: well-known/app/ai/agent-runtime/guangnao-agent-cli::guangnao-agent-cli-context
      - id: well-known/app/ai/agent-runtime/pikaa-cli::pikaa-agent-cli-context
      - id: well-known/app/ai/agent-runtime/paigy-harness::paigy-harness-context
      - id: well-known/app/ai/agent-runtime/claude-gateway::claude-gateway-context
  - id: mcp-mitm-proxy
    desc: MCP man-in-the-middle proxy
    crit: hostile
    conf: 0.95
    all:
      - id: micro-behaviors/communications/mcp::mcp-call-tool-response
      - id: micro-behaviors/process/fd/stdio::js-readline-interface-create
    any:
      - id: micro-behaviors/communications/http/post::axios-post-call
      - id: micro-behaviors/communications/http/post::fetch-post-call
      - id: micro-behaviors/communications/http/post::node-http-request-post
  - id: mcp-tunnel-exfil
    desc: MCP proxy via tunnel service
    crit: hostile
    conf: 0.95
    all:
      - id: micro-behaviors/communications/mcp::mcp-call-tool-response
      - id: micro-behaviors/process/fd/stdio::js-readline-line-event
    any:
      - id: objectives/command-and-control/infrastructure/domain/tunnel::ngrok-tunnel
      - id: micro-behaviors/communications/url/host/oob::ngrok-free-domain
      - id: micro-behaviors/communications/url/host/name::ngrok-io-endpoint
  - id: mcp-obfuscated-remote-install
    for: [javascript, typescript, npm]
    desc: Obfuscated MCP server executes remote install data
    crit: hostile
    conf: 0.99
    attack: T1027,T1059.007,T1195.002
    scope: archive
    all:
      - id: micro-behaviors/communications/mcp::mcp-server-constructor
      - id: mcp-installer-evidence
      - id: metadata/import/builtin::require-child-process
      - id: micro-behaviors/process/create/shell/bridge::child-process-compiled-computed-call
      - id: micro-behaviors/communications/http/request/client::js-fetch-call
      - id: metadata/lang/javascript-features::generated-name-or-state-syntax
