# A public SOCKS5 stream relay is a capability, not an incident-specific IOC.
# Keep the objective separate from the protocol atoms so the same detection
# works for source, scripts, and native binaries in future botnet variants.
defaults:
  platforms: [linux, macos, windows, android]
  for: [source, scripts, binaries]
  attack: T1090.001
  mbc: B0030

composite_rules:
  - id: public-socks5-relay-node
    desc: Publicly exposed SOCKS5 stream relay
    crit: suspicious
    conf: 0.94
    all:
      - id: micro-behaviors/communications/proxy/socks::socks5-stream-relay
      - id: micro-behaviors/communications/proxy/socks::socks-relay-public-bind
