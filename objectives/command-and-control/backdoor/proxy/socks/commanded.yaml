# A polled backdoor action that converts the host into a SOCKS5 relay.
#
# The implant already speaks to its controller; when the same code that names
# socks5 also fetches a script or config from the panel and evaluates it, the
# host is being turned into network infrastructure for the operator — the
# "enablesocks5" action of the AMOS-family LaunchDaemon backdoor documented by
# Huntress, and the equivalent verb in other panels. The eval leg is what
# separates this from a proxy server's own setup script: legitimate proxies
# ship their configuration; they do not execute what a remote panel hands them.
defaults:
  platforms: [unix, windows]
  for: [shell, python, javascript, powershell]
  attack: T1090,T1071.001
  mbc: B0030

composite_rules:
  - id: commanded-socks5-relay
    desc: Tasked backdoor fetches and runs a SOCKS5 relay
    crit: hostile
    conf: 0.95
    near_bytes: 2048
    all:
      - id: micro-behaviors/communications/proxy/socks::socks5-string
      - id: micro-behaviors/process/create/eval::shell-eval-variable
    any:
      - id: micro-behaviors/communications/http/download/shell::shell-curl-script-url-call
      - id: micro-behaviors/communications/http/download/shell::shell-curl-url-call
      - id: micro-behaviors/process/create/shell/pipeline::curl-pipe-sh-text
