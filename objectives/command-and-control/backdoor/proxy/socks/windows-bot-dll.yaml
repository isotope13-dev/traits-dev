# Windows botnet DLL SOCKS5 proxy module using a dynamic API dispatch table
# (e.g., api.pCreateThread) to launch SOCKS5 relay and listener threads.
defaults:
  platforms: [windows]
  for: [c, cpp, text]
  mbc: B0030
  attack: T1090

composite_rules:
  - id: windows-bot-socks5-dll-source
    desc: Windows botnet SOCKS5 proxy source using dynamic API table
    crit: hostile
    conf: 0.95
    all:
      - id: micro-behaviors/process/thread/create::api-table-create-thread
      - id: micro-behaviors/communications/proxy/socks/server::socks-protocol-constants-source
      - id: micro-behaviors/communications/proxy/socks/server::socks5-listen-port-dispatch
