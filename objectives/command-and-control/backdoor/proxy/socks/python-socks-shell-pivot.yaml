# One package that both relays SOCKS5 traffic and exposes a network-fed PTY
# shell gives whoever reaches the listener a pivot: tunnel through the host
# and drive a login shell on it. Each half has admin uses; together they
# are the standard post-exploitation pivot kit.
defaults:
  platforms: [linux, macos, windows]
  for: [python, whl, python-sdist, zip]
  attack: T1090,T1059.004

composite_rules:
  - id: python-socks5-relay-with-network-pty-shell
    desc: SOCKS5 relay packaged with network-fed PTY shell
    crit: suspicious
    conf: 0.9
    scope: archive
    all:
      - id: micro-behaviors/communications/proxy/socks/relay::socks5-relay-outbound-write
      - id: micro-behaviors/process/tty/pty::python-network-fed-pty-shell
