# Reverse SOCKS relays establish an outbound control channel and open separately
# registered data streams for operator-requested proxy sessions.
defaults:
  platforms: [linux, macos, windows, android]
  for: [source, scripts, binaries]
  attack: T1090.001,T1572
  mbc: B0030

composite_rules:
  - id: session-multiplexed-reverse-socks-relay
    desc: Session-multiplexed reverse SOCKS5 relay
    # Reverse SOCKS is also a legitimate administration/pivoting primitive.
    # Bot-control or persistence context is required for a hostile verdict.
    crit: suspicious
    conf: 0.98
    all:
      - id: micro-behaviors/communications/proxy/tunnel::session-separated-relay-protocol
      - id: micro-behaviors/communications/proxy/socks::socks5-stream-relay
      - id: micro-behaviors/communications/proxy/relay::relay-outbound-connect-call
