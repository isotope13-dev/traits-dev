# Python SOCKS5 reverse-tunnel detector
# Generic SOCKS protocol use is neutral.  These objective rules require the
# handshake plus explicit inbound relay mechanics before reporting a tunnel.
# ATT&CK: T1572 (Protocol Tunneling), T1090.001 (Internal Proxy)
defaults:
  platforms: [unix, windows]
  for: [python]
  attack: T1572

composite_rules:
- id: socks5-reverse-tunnel
  desc: Python SOCKS5 reverse tunnel proxy
  crit: suspicious
  conf: 0.94
  size_max: 32768
  all:
  - id: micro-behaviors/communications/proxy/socks::socks5-proto
  - id: micro-behaviors/data/parse/binary::python-unpack-three-bytes
  - id: micro-behaviors/communications/proxy/relay::python-bridge-function
  - id: micro-behaviors/communications/socket/accept::socket-accept-call
  any:
  - id: micro-behaviors/communications/socket/connect::socket-connect-call
  - id: micro-behaviors/communications/socket/connect::socket-connect-method
  - id: micro-behaviors/data/control-flow/error-handling::connection-exception-class
  unless:
  - id: well-known/lib/network/pysocks::pysocks-socks-module
  - id: well-known/lib/network/txtorcon::library-member-path

- id: python-proxy-backdoor
  desc: Python SOCKS proxy with inbound listener
  crit: suspicious
  conf: 0.95
  size_max: 32768
  all:
  - id: micro-behaviors/communications/proxy/socks::socks
  - id: micro-behaviors/data/parse/binary::python-unpack-three-bytes
  any:
  - id: micro-behaviors/communications/proxy/auth::proxy-credential-literal-assignment
  - id: micro-behaviors/process/hook/interception::python-socket-class-replacement
  - id: micro-behaviors/data/control-flow/error-handling::connection-exception-class
  - id: micro-behaviors/communications/socket/accept::socket-accept-call
  unless:
  - id: well-known/lib/network/pysocks::pysocks-socks-module
  - id: well-known/lib/network/txtorcon::library-member-path
