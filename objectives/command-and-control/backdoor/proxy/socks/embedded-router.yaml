# An embedded device acting as an authenticated SOCKS relay.  The detection
# relies on the exposed listener, credentials, and high port together rather
# than on Quad7 names or a particular binary hash.
defaults:
  platforms: [unix, appliance]
  for: [shell]
  attack: T1090.001
  mbc: B0030

composite_rules:
  - id: embedded-authenticated-socks-relay
    desc: Authenticated high-port SOCKS relay
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/communications/proxy/socks::socks-server-all-interfaces
      - id: micro-behaviors/communications/proxy/socks::socks-server-auth-user-pass
      - id: micro-behaviors/communications/proxy/socks::socks-server-high-port
