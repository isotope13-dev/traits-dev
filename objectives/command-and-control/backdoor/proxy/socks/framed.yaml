# Cross-language variant of the article's outer proxy framing.  The Android
# implementation has a dedicated protocol atom; this rule covers Python's
# common struct/AES implementation without relying on vendor identifiers.
defaults:
  platforms: [android, unix, windows]
  for: [python]
  attack: T1090,T1572,T1573

composite_rules:
  - id: python-aes-ecb-length-framed-message
    desc: Python AES-ECB length-framed message
    crit: notable
    conf: 0.95
    all:
      - id: micro-behaviors/communications/socket/framing::big-endian-u32-framing
      - id: micro-behaviors/crypto/symmetric/aes/library::pycrypto-aes-ecb-mode

  - id: python-encrypted-framed-socks5-exit
    desc: Python encrypted framed SOCKS5 exit
    crit: hostile
    conf: 0.98
    all:
      - id: python-aes-ecb-length-framed-message
      - id: micro-behaviors/communications/proxy/socks::socks5-stream-relay
    any:
      - id: micro-behaviors/communications/socket/connect::socket-accept-call
      - id: micro-behaviors/communications/socket/listen::listen

