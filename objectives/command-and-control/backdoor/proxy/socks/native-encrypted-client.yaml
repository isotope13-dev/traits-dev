defaults:
  platforms: [linux]
  for: [elf]
  attack: T1090
  mbc: B0030

composite_rules:
  # Captures implants that launch and supervise a local proxy subprocess, then
  # issue SOCKS5 domain requests through it. This survives encryption of proxy
  # names, loopback addresses, and destination domains.
  - id: encrypted-managed-socks-c2
    desc: Encrypted implant manages a subprocess-backed SOCKS C2 channel
    crit: hostile
    conf: 0.99
    all:
      - id: micro-behaviors/crypto/symmetric/stream/sigma::compact-opaque-sigma-rodata-profile
      - id: micro-behaviors/communications/proxy/socks/wire::native-socks5-domain-connect-client
      - id: micro-behaviors/communications/ipc/pipe::pipe-import
      - id: micro-behaviors/process/fd/dup::dup2
      - id: micro-behaviors/process/create/fork::fork
      - id: micro-behaviors/process/replace::c-exec-variants
      - id: micro-behaviors/os/env/write::native-setenv
      - id: micro-behaviors/os/event/select::select-multiplex
