defaults:
  platforms: [linux]
  for: [elf]
  attack: T1090
  mbc: B0030

composite_rules:
  # Captures implants that launch and supervise a local proxy subprocess, then
  # issue SOCKS5 domain requests through it. This survives encryption of proxy
  # names, loopback addresses, and destination domains.
  - id: encrypted-managed-socks-c2
    desc: Encrypted implant manages a subprocess-backed SOCKS C2 channel
    crit: hostile
    conf: 0.99
    all:
      - id: objectives/anti-static/obfuscation/payload/encrypted::native-chacha-runtime-string-table
      - id: micro-behaviors/communications/proxy/socks::native-socks5-domain-connect-client
      - id: micro-behaviors/process/create/direct::pipe-import
      - id: micro-behaviors/process/fd/dup::dup2
      - id: micro-behaviors/process/fork/clone::fork
      - id: micro-behaviors/process/create/execv::c-exec-variants
      - id: micro-behaviors/os/env/access::native-setenv
      - id: micro-behaviors/os/event/kernel/select::select-multiplex
