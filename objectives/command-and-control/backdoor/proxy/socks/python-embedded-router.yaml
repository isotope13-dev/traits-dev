# A language-neutral relay analogue: Python accepts an inbound public socket,
# opens an outbound connection, and carries explicit proxy credentials.
defaults:
  platforms: [unix, appliance]
  for: [python]
  attack: T1090.001
  mbc: B0030

composite_rules:
  - id: python-authenticated-inbound-socket-relay
    desc: Python authenticated socket relay
    crit: suspicious
    conf: 0.96
    all:
      - id: micro-behaviors/communications/socket/bind/address::python-bind-all-interfaces
      - id: micro-behaviors/communications/socket/listen::python-server-socket-listen-method
      - id: micro-behaviors/communications/socket/connect::socket-accept-call
      - id: micro-behaviors/communications/socket/dial::python-dial
      - id: micro-behaviors/communications/proxy/auth::proxy-credential-literal-assignment
    near_lines: 40
