defaults:
  platforms: [android, unix]
  for: [elf, apk, python, javascript, java, kotlin, c, cpp]
  attack: T1090,T1572
  mbc: B0030

traits:
  - id: android-hdmi-gates-proxy-service
    desc: HDMI state gates proxy service
    crit: suspicious
    conf: 0.96
    unless:
      - id: well-known/app/fwupd::source-tree-context
    if:
      type: text
      regex: '(?is)\b(if|when)\b.{0,96}\bhdmi\w*\b.{0,96}(proxy|socks5)\w*\b'

composite_rules:
  - id: android-conditional-socks5-exit
    desc: Android HDMI-gated SOCKS5 exit service
    crit: hostile
    conf: 0.99
    all:
      - id: micro-behaviors/hardware/display/connection::android-hdmi-state-observation
      - id: android-hdmi-gates-proxy-service
      - id: micro-behaviors/communications/proxy/socks::socks5-stream-relay
    any:
      - id: micro-behaviors/communications/socket/connect::socket-accept-call
      - id: micro-behaviors/communications/socket/listen::node-server-listen
      - id: micro-behaviors/communications/socket/listen::java-accepts-connection

  - id: android-encrypted-framed-socks5-exit
    desc: Android encrypted framed SOCKS5 exit service
    crit: hostile
    conf: 0.99
    attack: T1090,T1572,T1573
    all:
      - id: micro-behaviors/communications/socket/framing::android-aes-ecb-length-framed-message
      - id: micro-behaviors/communications/proxy/socks::socks5-stream-relay
    any:
      - id: micro-behaviors/communications/socket/connect::socket-accept-call
      - id: micro-behaviors/communications/socket/listen::node-server-listen
      - id: micro-behaviors/communications/socket/listen::java-accepts-connection
