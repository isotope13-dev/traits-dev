---
defaults:
  platforms:
  - unix
  - android
  for:
  - elf
  mbc: B0030
composite_rules:
- id: native-alpine-implant
  desc: Alpine static implant with SOCKS
  crit: hostile
  conf: 0.93
  attack: T1090
  all:
  - id: metadata/lang/compiler/native::linux-musl-target-triple
  - id: metadata/lang/compiler/native::alpine-gcc-build-string
  - id: micro-behaviors/communications/proxy/socks/unspecified::socks5h-proto
  - id: micro-behaviors/crypto/key/exchange
- id: go-elf-encrypted-socks-implant
  desc: Go ELF encrypted SOCKS proxy implant
  crit: hostile
  conf: 0.96
  attack: T1090,T1573.001
  # socks5h (x/net/proxy), /bin/sh and x/crypto ciphers are also linked into
  # product CLIs such as Bohr (40 third-party modules); an implant usually
  # carries a small module graph.
  unless:
  - id: metadata/lang/go-build::go-build-forty-plus-modules-elf
  # Code-indexing servers link linguist tables beside proxy-aware clients.
  - id: well-known/lib/development/go-enry::go-enry-module
  - id: well-known/app/system/act::go-module-path
  all:
  - id: micro-behaviors/communications/proxy/socks/unspecified::socks5h-proto
  - id: micro-behaviors/fs/path/application/interpreter::go-bin-sh-binary-reference
  any:
  - id: micro-behaviors/crypto/asymmetric/curve25519::x25519-key-exchange-term
  - id: micro-behaviors/crypto/symmetric/stream/chacha::chacha20-quarter-round-rotations-x86-64
  - id: micro-behaviors/crypto/symmetric/stream/reference::go-native-xor-keystream-reference
