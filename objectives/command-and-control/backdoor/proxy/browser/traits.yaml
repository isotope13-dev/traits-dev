defaults:
  platforms: [unix, windows]
  for: [crx, xpi, zip, archives]
  attack: T1090,T1185,T1059.007

composite_rules:
  - id: extension-remote-proxy-traffic-control
    desc: Extension remotely controls proxy and page traffic
    crit: hostile
    conf: 0.98
    scope: archive
    all:
      - id: metadata/permission/manifest::host-permission-all-urls
      - id: micro-behaviors/os/network/webextension::chrome-proxy-settings-set
      - id: micro-behaviors/process/inject/webextension::chrome-scripting-main-world
      - id: micro-behaviors/communications/http/headers::dnr-modify
      - id: micro-behaviors/communications/http/endpoints::remote-config-endpoint
