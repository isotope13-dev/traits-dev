defaults:
  platforms: [unix, windows]
  for: [crx, xpi, zip, archives]
  attack: T1090,T1185,T1059.007

composite_rules:
  - id: extension-remote-proxy-traffic-control
    desc: Extension remotely controls proxy and page traffic
    crit: hostile
    conf: 0.98
    scope: archive
    all:
      - id: metadata/permission/manifest::host-permission-all-urls
      - id: micro-behaviors/os/network/webextension::chrome-proxy-settings-set
      - id: micro-behaviors/process/inject/webextension::chrome-scripting-main-world
      - id: micro-behaviors/communications/http/headers::dnr-modify
      - id: micro-behaviors/communications/http/endpoints::remote-config-endpoint

  # Browser-carried RATs can avoid direct network APIs by driving a local
  # Chromium instance through CDP, injecting JavaScript, and using WebRTC as
  # the external transport.  The hostile conclusions require the browser
  # bridge, channel construction, and a host command sink; the individual
  # capabilities remain neutral elsewhere in the taxonomy.
  - id: browser-mediated-webrtc-c2
    desc: CDP-driven browser WebRTC C2 channel
    crit: hostile
    conf: 0.99
    for: [pe, dll, csharp, go, rust, javascript, typescript, python, powershell]
    attack: T1059.007,T1071.001,T1090,T1573.001
    mbc: B0030
    all:
      - id: micro-behaviors/process/create/flags::chromium-remote-debugging-port
      - id: micro-behaviors/process/create/flags::chromium-headless-launch-flag
      - id: micro-behaviors/communications/http/devtools/client::cdp-method-runtime-evaluate
      - id: micro-behaviors/communications/http/devtools/client::cdp-method-runtime-add-binding
      - id: micro-behaviors/communications/proxy/turn::webrtc-peer-connection-api
      - id: micro-behaviors/communications/proxy/turn::webrtc-data-channel-api
    any:
      - id: micro-behaviors/communications/proxy/turn::webrtc-sdp-signaling-api
      - id: micro-behaviors/communications/proxy/turn::webrtc-stun-turn-relay-config
      - id: micro-behaviors/communications/http/url/domain::workers-dev-domain
    near_bytes: 8192

  - id: browser-mediated-remote-shell
    desc: CDP WebRTC channel executes host commands
    crit: hostile
    conf: 0.99
    for: [pe, dll, csharp, go, rust, javascript, typescript, python, powershell]
    attack: T1059,T1071.001,T1102
    all:
      - id: micro-behaviors/communications/http/devtools/client::cdp-method-runtime-evaluate
      - id: micro-behaviors/communications/http/devtools/client::cdp-method-runtime-add-binding
      - id: micro-behaviors/communications/proxy/turn::webrtc-data-channel-api
    any:
      - id: micro-behaviors/process/create/shell/bridge::js-exec
      - id: micro-behaviors/process/create/direct::rust-command-from-import
      - id: micro-behaviors/process/create/shell/script-host::cmd-exe-c-command
    near_bytes: 8192
