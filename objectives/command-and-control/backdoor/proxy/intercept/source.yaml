# Backdoors embedded into an HTTP edge proxy can terminate a covert request at
# the proxy, dispatch commands, and selectively replace downstream responses.
# The rules key on those mechanics rather than the reported family name or C2.
defaults:
  platforms: [unix]
  for: [c, cpp]
  attack: T1572
  mbc: B0030

composite_rules:
  - id: embedded-proxy-command-channel
    desc: Embedded proxy filter hides and dispatches commands
    crit: hostile
    conf: 0.99
    attack: T1572,T1059.004,T1562.006
    all:
      - id: well-known/app/infrastructure/haproxy::native-filter-source
      - id: micro-behaviors/communications/http/proxy::request-response-filter-callbacks
      - id: micro-behaviors/communications/http/proxy::request-forwarding-state-zeroed
      - id: objectives/evasion/indicator-removal/network::proxy-statistics-counter-scrub
      - id: micro-behaviors/process/create/shell/spawn::c-popen-call
    any:
      - id: micro-behaviors/fs/pipe/fifo::fifo
      - id: micro-behaviors/data/control-flow/dispatch::switch-command-variable-dispatch

  - id: targeted-proxy-response-injection
    desc: Embedded proxy injects payloads into selected responses
    crit: hostile
    conf: 0.99
    attack: T1185,T1539
    all:
      - id: well-known/app/infrastructure/haproxy::native-filter-source
      - id: micro-behaviors/communications/http/proxy::request-response-filter-callbacks
      - id: micro-behaviors/communications/http/proxy::response-shape-rewrite
      - id: micro-behaviors/communications/http/proxy::targeted-response-body-rewrite
      - id: objectives/evasion/indicator-removal/network::proxy-statistics-counter-scrub
      - id: micro-behaviors/fs/file/open::fopen

  - id: full-proxy-interception-backdoor
    desc: Proxy backdoor combines covert command and injection channels
    crit: hostile
    conf: 0.99
    attack: T1572,T1185,T1059.004
    all:
      - id: embedded-proxy-command-channel
      - id: targeted-proxy-response-injection
