---
defaults:
  platforms:
  - unix
  - android
  for:
  - elf
  mbc: B0030
composite_rules:
- id: native-tor-implant
  desc: Native C2 implant with Tor
  crit: hostile
  conf: 0.95
  attack: T1572
  all:
  - id: micro-behaviors/communications/proxy/socks/unspecified::socks5h-proto
  - id: micro-behaviors/communications/proxy/tor::onion-domain-reference
  - id: well-known/lib/network/curl::libcurl-version
  - id: micro-behaviors/crypto/key/exchange
- id: native-crypto-proxy-implant
  desc: Native Tor and encrypted proxy capabilities
  crit: suspicious
  conf: 0.92
  attack: T1573
  # The `any:` group used to offer socks5h, socks4a, HTTP CONNECT or onion
  # handling. The first three are libcurl's *own* protocol-support strings:
  # once a binary vendors libcurl it has them, and it has `libcurl-version`
  # too, so three of the four legs came free with one library and the rule
  # reduced to "bundles libcurl and a TLS stack". pyarrow's libarrow.so
  # statically links libcurl and OpenSSL for its S3/GCS filesystems, so the
  # Airflow image scored hostile. Onion handling is the only leg libcurl does
  # not supply and the only one that says Tor, so it is required.
  all:
  - id: well-known/lib/network/curl::libcurl-version
  - id: micro-behaviors/crypto/key/exchange
  - id: micro-behaviors/crypto/symmetric/stream/sigma::chacha-salsa-constant
  - id: micro-behaviors/communications/proxy/tor::onion-domain-reference
  downgrade:
    any:
    - id: well-known/lib/crypto/openssl/
    - id: well-known/lib/media/regula-document-reader::regula-android-sdk-context
