# Native Tor fallback routing.  This is a technique rule: it does not depend
# on a family name or one hidden-service address.
defaults:
  platforms: [unix, android]
  for: [source]
  attack: T1090.003,T1572
  mbc: B0030

traits:
  - id: native-tor-fallback-state-machine
    desc: Native Tor or onion proxy state routine
    crit: suspicious
    conf: 0.95
    for: [c, cpp]
    if:
      type: symbol
      kind: function
      regex: '(?i)(^|[_-])(tor|onion|socks)[_-].{0,32}state'
    unless:
      - id: well-known/lib/network/curl::source-tree-path

composite_rules:
  - id: native-tor-socks-fallback-c2
    desc: Native C2 falls back to an onion service through SOCKS5
    crit: hostile
    conf: 0.99
    all:
      - id: micro-behaviors/communications/proxy/tor::onion-domain-source-literal
      - id: micro-behaviors/communications/proxy/tunnel::socks5-domain-connect-constant
      - id: native-tor-fallback-state-machine
      - id: micro-behaviors/communications/proxy/config::loopback-proxy-port-endpoint
