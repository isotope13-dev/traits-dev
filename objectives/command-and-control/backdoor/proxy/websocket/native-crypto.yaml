---
defaults:
  platforms:
  - unix
  - android
  for:
  - elf
  mbc: B0030
composite_rules:
- id: native-vless-websocket-forward-proxy
  desc: Native VLESS WebSocket forwarding proxy
  crit: hostile
  conf: 0.97
  attack: T1090
  all:
  - id: micro-behaviors/communications/proxy/vless::native-vless-websocket-marker
  - id: micro-behaviors/communications/http/websocket::websocket-headers
  - id: micro-behaviors/communications/socket/listen::server-api-surface
  - id: micro-behaviors/communications/socket/connect/attempt::connect-symbol
  - id: objectives/evasion/masquerade/binary/filename::binary-content-as-text-extension
- id: native-vless-connect-relay
  desc: Native VLESS WebSocket HTTP CONNECT relay
  crit: hostile
  conf: 0.99
  attack: T1090,T1071.001
  all:
    - id: micro-behaviors/communications/proxy/vless::native-vless-websocket-marker
    - id: micro-behaviors/communications/http/websocket::websocket-http-upgrade-headers
    - id: micro-behaviors/communications/http/request/proxy::proxy-connect-method
    - id: micro-behaviors/communications/socket/accept::accepting-server-api-surface
    - id: micro-behaviors/communications/socket/connect/attempt::connect-symbol
- id: npm-native-vless-proxy-carrier
  desc: npm package carries a native VLESS proxy with manifest anomalies
  crit: hostile
  conf: 0.995
  scope: archive
  attack: T1090,T1071.001,T1195.002
  for: [npm, tar, elf, package.json]
  all:
    - id: native-vless-connect-relay
    - id: metadata/package/files/binary::npm-package-with-native-binary
    - id: metadata/package/files/included::npm-includes-so
    - id: metadata/package/dependencies/reconciliation::npm-phantom-runtime-dependency
    - id: metadata/package/entrypoint/module::pkg-main-field
- id: rust-proxy-websocket-crypto-profile
  desc: Rust WebSocket and SOCKS with stream cipher references
  crit: suspicious
  conf: 0.91
  attack: T1071.001
  platforms:
  - linux
  all:
  - id: micro-behaviors/communications/http/websocket::websocket-headers
  - id: micro-behaviors/communications/http/lib/crate::ureq-user-agent
  - id: micro-behaviors/communications/proxy/socks/unspecified::socks4-proto
  - id: micro-behaviors/crypto/symmetric/stream/sigma::sigma-stream-cipher-clues
- id: rust-pty-proxy-websocket-crypto-profile
  desc: Rust PTY with WebSocket, SOCKS and stream cipher references
  crit: suspicious
  conf: 0.96
  attack: T1059
  platforms:
  - linux
  all:
  - id: micro-behaviors/communications/http/websocket::websocket-headers
  - id: micro-behaviors/communications/http/lib/crate::ureq-user-agent
  - id: micro-behaviors/communications/proxy/socks/unspecified::socks4-proto
  - id: micro-behaviors/crypto/symmetric/stream/sigma::chacha-salsa-constant
  - id: micro-behaviors/process/tty/pty::openpty-call
  - id: micro-behaviors/fs/path/device/terminal::dev-ptmx
  any:
  - id: micro-behaviors/fs/path/config/accounts::etc-passwd
  - id: micro-behaviors/fs/proc/mounts::mounts-mountinfo
