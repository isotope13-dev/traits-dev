# A WebSocket endpoint that accepts an arbitrary target and forwards traffic
# can turn an exposed appliance into a pivot into services bound to loopback.
# The local destination is what separates this from a generic WebSocket relay.
defaults:
  platforms: [windows, unix]
  for: [python, java, javascript, typescript, go]
  attack: T1090,T1572,T1190
  mbc: B0030

composite_rules:
  - id: websocket-local-service-pivot
    desc: WebSocket proxy pivots to a request-selected local service
    crit: hostile
    conf: 0.97
    all:
      - id: micro-behaviors/communications/proxy/target::websocket-request-target-relay
      - id: micro-behaviors/communications/proxy/target::websocket-local-target
    unless:
      - id: well-known/app/
      - id: well-known/tool/
