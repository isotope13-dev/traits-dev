defaults:
  platforms:
  - windows
  - unix
  for:
  - python
  - java
  - javascript
  - typescript
  - go
  attack: T1090,T1572,T1190
  mbc: B0030
composite_rules:
- id: websocket-local-service-pivot
  for:
  - python
  - java
  - go
  desc: WebSocket proxy pivots to a request-selected local service
  crit: hostile
  conf: 0.97
  all:
  - id: micro-behaviors/communications/proxy/target::websocket-request-target-relay
  - id: micro-behaviors/communications/proxy/target::websocket-local-target
  unless:
  - id: well-known/app
  - id: well-known/tool
