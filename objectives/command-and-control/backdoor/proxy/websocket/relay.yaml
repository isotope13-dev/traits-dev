# Server-controlled WebSocket relays that open operator-selected TCP targets
# are a distinct C2 objective: the victim becomes a network pivot.
defaults:
  platforms: [windows, unix]
  for: [c, cpp, python, go, rust, javascript, typescript, csharp]
  attack: T1090,T1572,T1071.001
  mbc: B0030

composite_rules:
  - id: websocket-socks-relay
    desc: Server-controlled WebSocket SOCKS relay
    crit: hostile
    conf: 0.99
    all:
      - id: micro-behaviors/communications/proxy/tunnel::websocket-relay-frame-layout
      - id: micro-behaviors/communications/proxy/tunnel::socks5-domain-connect-encoding
      - id: micro-behaviors/communications/proxy/tunnel::websocket-channel-bidirectional-copy
      - id: micro-behaviors/communications/proxy/tunnel::websocket-target-connect
    any:
      - id: micro-behaviors/communications/http/websocket::websocket-http-upgrade-headers
      - id: micro-behaviors/communications/http/websocket::websocket-http-upgrade-headers-source
      - id: micro-behaviors/communications/websocket/library::python-websocket-client
      - id: micro-behaviors/communications/http/websocket::websocket
    unless:
      - id: well-known/app/
      - id: well-known/tool/

  # A custom relay that disables both certificate-chain and hostname checks is
  # not merely proxy-capable software with a user-selectable compatibility
  # option.  It accepts any TLS peer as its controller while exposing
  # operator-selected TCP targets through the WebSocket channel.  Reference
  # the two observable assignments directly: the neutral aggregate excludes
  # test fixtures, while detection fixtures must exercise this attack shape.
  - id: python-unverified-websocket-socks-relay
    desc: Python WebSocket SOCKS relay accepts any TLS controller certificate
    crit: hostile
    conf: 0.99
    for: [python]
    all:
      - id: websocket-socks-relay
      - id: micro-behaviors/communications/socket/ssl::check-hostname-false
      - id: micro-behaviors/communications/socket/ssl::verify-mode-none
    unless:
      - id: well-known/app/
      - id: well-known/tool/

  - id: target-gated-websocket-relay
    desc: WebSocket relay restricted to a selected victim identity
    crit: suspicious
    conf: 0.98
    all:
      - id: websocket-socks-relay
    any:
      - id: objectives/anti-analysis/geofencing/target-gating::dynamic-windows-username-substring-gate
      - id: objectives/anti-analysis/geofencing/target-gating::python-username-substring-gate

  - id: websocket-proxy-authenticated-relay
    desc: WebSocket relay uses integrated HTTP proxy authentication
    crit: hostile
    conf: 0.99
    platforms: [windows]
    all:
      - id: websocket-socks-relay
      - id: micro-behaviors/communications/proxy/auth::windows-integrated-proxy-auth
    unless:
      - id: well-known/app/
      - id: well-known/tool/
