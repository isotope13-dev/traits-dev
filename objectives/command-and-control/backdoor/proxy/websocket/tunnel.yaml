# Cross-language coverage for a WebSocket tunnel that carries a custom binary
# control protocol and relays SOCKS5 traffic.  The generic relay is suspicious;
# per-target username gating and integrated proxy authentication raise the
# combination to hostile.
defaults:
  platforms: [windows, unix]
  for: [c, cpp, pe, dll, python]
  attack: T1090,T1071.001
  mbc: B0030

composite_rules:
  - id: websocket-fixed-binary-tunnel
    desc: WebSocket uses a custom fixed binary tunnel protocol
    crit: suspicious
    conf: 0.97
    all:
      - id: micro-behaviors/communications/http/websocket::websocket-http-upgrade-headers
    any:
      - id: micro-behaviors/communications/websocket/framing::native-fixed-tunnel-frame
      - id: micro-behaviors/communications/websocket/framing::python-fixed-tunnel-frame

  - id: websocket-socks5-binary-relay
    desc: WebSocket custom binary channel relays SOCKS5 traffic
    crit: suspicious
    conf: 0.98
    all:
      - id: websocket-fixed-binary-tunnel
      - id: micro-behaviors/communications/proxy/socks::socks5-stream-relay

  - id: username-targeted-websocket-socks5-tunnel
    desc: Username-targeted WebSocket SOCKS5 tunnel
    crit: hostile
    conf: 0.99
    attack: T1090,T1071.001,T1497
    all:
      - id: websocket-socks5-binary-relay
      - id: objectives/anti-analysis/sandbox-detect/username-gate::normalized-username-substring-gate

  - id: proxy-authenticated-websocket-socks5-tunnel
    desc: WebSocket SOCKS5 tunnel traverses an integrated HTTP proxy
    crit: hostile
    conf: 0.99
    all:
      - id: websocket-socks5-binary-relay
      - id: micro-behaviors/communications/http/auth::winhttp-proxy-authentication
