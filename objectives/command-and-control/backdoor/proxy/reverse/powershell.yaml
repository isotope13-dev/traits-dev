defaults:
  platforms: [windows, unix]
  for: [powershell, csharp]
  attack: T1090,T1572
  mbc: B0030

composite_rules:
  - id: dotnet-outbound-tcp-stream-bridge
    desc: Connects to a controller, parses a host:port target, and bridges the TCP streams
    crit: hostile
    conf: 0.97
    all:
      - id: micro-behaviors/data/control-flow/loop/unconditional::infinite-loop-header
      - id: micro-behaviors/communications/proxy/relay::dotnet-host-port-split-dial
    any:
      - id: micro-behaviors/data/stream/transfer::dotnet-paired-stream-copy-to
      - id: micro-behaviors/communications/proxy/relay::powershell-paired-stream-read-write-bridge
