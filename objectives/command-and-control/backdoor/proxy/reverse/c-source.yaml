# C/C++ reverse-proxy implant sources (LurkProxy-class).
defaults:
  platforms: [windows]
  for: [c, cpp]
  attack: T1090
  mbc: B0030

# The hardcoded-endpoint atom is a neutral IP-literal observation and lives in
# micro-behaviors/communications/ip/literal; the implant intent comes from
# pairing it with the listener and proxy/service-export legs below.

composite_rules:
  - id: c-reverse-proxy-implant
    desc: C reverse proxy implant with hardcoded endpoint
    crit: hostile
    conf: 0.96
    all:
      - id: micro-behaviors/communications/socket/listen::server-socket-source
      - id: micro-behaviors/communications/ip/literal::external-ipv4-c-source-literal
    any:
      - id: objectives/evasion/masquerade/dll/proxy::source-curl-api-export
      - id: micro-behaviors/os/service/export::source-registerservice-export
      - id: micro-behaviors/communications/proxy/reverse::reverse-proxy

  - id: c-servicedll-proxy-export-implant
    desc: C DLL-export reverse proxy implant
    crit: hostile
    conf: 0.97
    all:
      - id: micro-behaviors/os/service/export::source-registerservice-export
      - id: objectives/evasion/masquerade/dll/proxy::source-curl-api-export
      - id: micro-behaviors/communications/socket/listen::server-socket-source
