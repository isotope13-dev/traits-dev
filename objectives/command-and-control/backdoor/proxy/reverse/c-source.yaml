# C/C++ reverse-proxy implant sources (LurkProxy-class).
defaults:
  platforms: [windows]
  for: [c, cpp]
  attack: T1090
  mbc: B0030

traits:
  - id: c-source-hardcoded-external-ipv4
    desc: C source hardcoded external IPv4 string
    crit: notable
    conf: 0.9
    if:
      type: literal
      kind: string
      regex: '^\d{1,3}(\.\d{1,3}){3}$'
      is: external_ip

  - id: curl-easy-escape-dllexport
    desc: curl_easy_escape DLL export masquerade
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: '__declspec\s*\(\s*dllexport\s*\).{0,80}\bcurl_easy_escape\b'

  - id: registerservice-dllexport
    desc: RegisterService DLL export entrypoint
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: '__declspec\s*\(\s*dllexport\s*\)\s+void\s+RegisterService'

composite_rules:
  - id: c-reverse-proxy-implant
    desc: C reverse proxy implant with hardcoded endpoint
    crit: hostile
    conf: 0.96
    all:
      - id: micro-behaviors/communications/proxy/socks::socks5-listener-source
      - id: c-source-hardcoded-external-ipv4
    any:
      - id: curl-easy-escape-dllexport
      - id: registerservice-dllexport
      - id: micro-behaviors/communications/proxy/reverse::reverse-proxy

  - id: c-servicedll-proxy-export-implant
    desc: C DLL-export reverse proxy implant
    crit: hostile
    conf: 0.97
    all:
      - id: registerservice-dllexport
      - id: curl-easy-escape-dllexport
      - id: micro-behaviors/communications/proxy/socks::socks5-listener-source

  - id: c-dllexport-socket-beacon
    desc: C DLL masquerade opens socket C2 channel
    crit: hostile
    conf: 0.96
    attack: T1071.001
    all:
      - id: curl-easy-escape-dllexport
      - id: micro-behaviors/communications/socket/connect::connect-symbol
      - id: micro-behaviors/communications/socket/send::send-symbol
    any:
      - id: registerservice-dllexport
