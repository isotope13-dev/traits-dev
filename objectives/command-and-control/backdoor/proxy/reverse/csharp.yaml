defaults:
  platforms: [windows]
  for: [csharp]
  attack: T1090
  mbc: B0030

traits:
  - id: csharp-rproxy-marker
    desc: C# reverse proxy command marker
    crit: notable
    conf: 0.93
    if:
      type: string_literal
      exact: RProxy

  - id: csharp-client-key-reattachment
    desc: C# client key reattachment
    crit: notable
    conf: 0.86
    if:
      type: symbol
      kind: call
      exact: Operators.CompareString

composite_rules:
  - id: csharp-rproxy-listener
    desc: C# reverse proxy listener
    crit: suspicious
    conf: 0.95
    all:
      - id: micro-behaviors/communications/socket/create::tcp-listener-create
      - id: micro-behaviors/communications/socket/create::accept-tcp-client
      - id: csharp-rproxy-marker
    any:
      - id: metadata/lang/source/literal/string/shape::csharp-double-crlf-escape-literal
      - id: csharp-client-key-reattachment

  - id: csharp-control-stream-tcp-pivot
    desc: C# reverse TCP pivot relays control-selected targets
    crit: hostile
    conf: 0.98
    platforms: [windows, unix]
    attack: T1090,T1572
    all:
      - id: micro-behaviors/communications/socket/create::tcpclient-create
      - id: micro-behaviors/communications/socket/create::tcpclient-get-stream
      - id: micro-behaviors/data/stream/read::csharp-streamreader-constructor
      - id: micro-behaviors/data/stream/read::csharp-readline-call
      - id: micro-behaviors/communications/proxy/relay::csharp-split-host-port-connect
      - id: micro-behaviors/data/buffer/transfer::dotnet-dual-stream-copyto
      - id: micro-behaviors/data/control-flow/loop/unconditional::infinite-loop-header
    any:
      - id: metadata/lang/source/naming/function/communication::dotnet-connect-async-method-token
      - id: micro-behaviors/communications/socket/create::tcpclient-connect

  - id: powershell-control-stream-tcp-pivot
    desc: PowerShell reverse TCP pivot relays control-selected targets
    crit: hostile
    conf: 0.98
    platforms: [windows, unix]
    for: [powershell]
    attack: T1090,T1572
    all:
      - id: micro-behaviors/communications/socket/create::powershell-tcpclient-construction-call
      - id: micro-behaviors/communications/socket/create::powershell-tcpclient-connect-call
      - id: micro-behaviors/communications/socket/tcp::powershell-tcpclient-stream
      - id: micro-behaviors/data/stream/read::powershell-streamreader-constructor-text
      - id: micro-behaviors/data/stream/read::powershell-readline-assignment-text
      - id: micro-behaviors/communications/proxy/relay::powershell-split-host-port-connect
      - id: micro-behaviors/data/control-flow/loop/unconditional::infinite-loop-header
      - id: micro-behaviors/communications/proxy/relay::powershell-bidirectional-networkstream-pump
