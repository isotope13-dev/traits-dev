# Multi-hop proxy configuration is legitimate on its own. When the same
# artifact also polls an HTTP controller, executes the returned command, and
# posts process output, the host is both a managed command node and a relay.
defaults:
  platforms: [unix, windows]
  for: [python, javascript, typescript, shell, powershell, go, rust]
  attack: T1090.003,T1059,T1071.001
  mbc: B0030

composite_rules:
  - id: relay-chain-command-node
    desc: Multi-hop proxy relay node executes HTTP-delivered commands
    crit: hostile
    conf: 0.99
    scope: file
    all:
      - id: micro-behaviors/communications/proxy/config::clash-relay-proxy-group
      - id: objectives/command-and-control/backdoor/tasking/http-command::http-polled-command-output-backdoor
