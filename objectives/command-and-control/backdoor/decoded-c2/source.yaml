# Backdoors that reconstruct a network endpoint from unary whitespace data.
# The endpoint itself can change freely: the stable behavior is converting the
# lengths of whitespace-only lines into characters, then using the result for
# HTTP tasking and local process execution.
defaults:
  platforms: [windows, unix]
  for: [python, javascript, typescript]
  attack: T1027,T1071.001,T1059
  mbc: B0032,B0022

composite_rules:
  - id: whitespace-unary-c2-channel
    desc: HTTP channel uses a host reconstructed from whitespace line lengths
    crit: hostile
    conf: 0.99
    near_lines: 120
    all:
      - id: micro-behaviors/data/decode/custom::whitespace-run-length-decoder
      - id: micro-behaviors/communications/http/request/client/

  - id: whitespace-unary-command-backdoor
    desc: Whitespace-decoded HTTP channel executes remote commands
    crit: hostile
    conf: 0.995
    near_lines: 120
    all:
      - id: whitespace-unary-c2-channel
      - id: micro-behaviors/communications/http/request/tasking::http-task-command-field-read
      - id: micro-behaviors/process/create/
