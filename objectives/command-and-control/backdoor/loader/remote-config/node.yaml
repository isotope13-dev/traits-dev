defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  attack: "T1071.001,T1105,T1564.001"
  mbc: "C0002"

traits:
  - id: node-json-c2-property
    desc: References a c2 configuration property
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: '(?i)\b(config|options|settings|payload)\s*(\.\s*c2\b|\[\s*["'']c2["'']\s*\])'

composite_rules:
  - id: node-remote-c2-config-to-home-state
    desc: Node fetches C2 config and writes hidden home state
    crit: hostile
    conf: 0.99
    near_bytes: 5000
    all:
      - id: node-json-c2-property
      - id: micro-behaviors/fs/path/location::node-homedir-hidden-entry
      - id: micro-behaviors/data/control-flow/module-exec::js-synchronous-iife-invoke
      - id: micro-behaviors/process/user/query::os-homedir-call
      - id: micro-behaviors/communications/http/get::node-https-get-reference
      - id: micro-behaviors/communications/http/download/handler::node-http-response-to-file
      - id: micro-behaviors/data/parse/json::json-parse-call

  - id: hex-concealed-x-header-response-eval-loader
    desc: Hex-concealed X-header POST evaluates remote script
    crit: hostile
    conf: 0.99
    attack: T1071.001,T1059.007,T1027
    all:
      - id: objectives/execution/payload/script-eval::concealed-client-eval-response-data
      - id: objectives/anti-static/obfuscation/string/array::hex-table-concealed-http-x-header
      - id: micro-behaviors/data/control-flow/error-handling::empty-arrow-catch-handler
