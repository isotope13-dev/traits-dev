# AddInProcess32 is a legitimate .NET add-in host.  The article documents a
# loader abusing it from a user-writable parent, followed by network activity
# and machine certificate-store access.  These rules match the event structure
# of that correlation rather than the campaign's names or endpoints.
defaults:
  platforms: [windows]
  for: [json]
  attack: T1620

traits:
  - id: addinprocess32-process-name
    desc: AddInProcess32.exe process name
    crit: notable
    conf: 0.99
    if:
      type: text
      regex: '(?i)process\.name.{0,32}AddInProcess32\.exe'

  - id: addinprocess32-user-writable-parent
    desc: Process parent path uses AppData or Temp
    crit: suspicious
    conf: 0.97
    if:
      type: text
      regex: '(?i)process\.parent\.executable.{0,120}(AppData|Temp)'

  - id: addinprocess32-destination-ip
    desc: Network destination IP field
    crit: notable
    conf: 0.96
    if:
      type: text
      substr: '"destination.ip"'

composite_rules:
  - id: addinprocess32-user-writable-network-loader
    desc: AddInProcess32 network activity after a user-writable loader launch
    crit: hostile
    conf: 0.97
    attack: T1105,T1620
    all:
      - id: addinprocess32-process-name
      - id: addinprocess32-user-writable-parent
      - id: addinprocess32-destination-ip

  - id: addinprocess32-user-writable-certificate-loader
    desc: AddInProcess32 certificate-store access after a user-writable loader launch
    crit: hostile
    conf: 0.97
    all:
      - id: addinprocess32-process-name
      - id: addinprocess32-user-writable-parent
      - id: micro-behaviors/os/registry/access::machine-certificate-store-object
      - id: micro-behaviors/os/registry/access::machine-root-certificate-store
    near_lines: 3
