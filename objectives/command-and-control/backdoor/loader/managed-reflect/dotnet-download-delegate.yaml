# Fileless managed stager: an unsigned .NET executable that hides its IL from
# disassembly, downloads a byte array over HTTP, loads it as an assembly and
# dispatches its entry through a delegate. The payload never touches disk and
# the stub itself carries nothing but the fetch-and-run logic.
defaults:
  platforms: [windows]
  for: [pe, dll]
  attack: T1105,T1620,T1027

composite_rules:
  - id: dotnet-download-assembly-delegate-stager
    desc: Unsigned .NET delegate-runs downloaded assembly
    crit: hostile
    conf: 0.92
    all:
      - id: metadata/lang/compiler/managed::dotnet-assembly
      - id: metadata/signature/absent::unsigned-missing-signature-record
      - id: objectives/anti-static/obfuscation/anti-decompile::suppress-ildasm-managed-pe
      - id: micro-behaviors/communications/http/client/managed::downloaddata
      - id: micro-behaviors/process/interpreter/runtime/clr::managed-assembly-load-api
      - id: micro-behaviors/metaprogramming/reflection/inspect/class/construction::managed-load-type-delegate-dispatch-references
