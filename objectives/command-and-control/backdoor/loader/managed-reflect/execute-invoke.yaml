# PowerShell loaders that download Base64 .NET, reflectively load it, and
# invoke a parameterless static Execute method (StopAndProtect stage-1/2 shape).
defaults:
  platforms: [windows]
  for: [powershell]
  attack: T1620,T1105,T1059.001
  mbc: E1620

composite_rules:
  - id: ps-download-reflect-execute-invoke
    desc: Downloads Base64 .NET and invokes static Execute
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/communications/http/client/managed::downloadstring
      - id: micro-behaviors/metaprogramming/reflection/inspect/class/assembly::ps-decode-and-load
      - id: micro-behaviors/metaprogramming/reflection/inspect/class/invocation::powershell-reflected-execute-method
      - id: micro-behaviors/metaprogramming/reflection/invoke::powershell-assembly-method-invoke
    near_bytes: 1200
