# PowerShell loaders that download Base64 .NET, reflectively load it, and
# invoke a parameterless static Execute method (StopAndProtect stage-1/2 shape).
defaults:
  platforms: [windows]
  for: [powershell]
  attack: T1620,T1105,T1059.001
  mbc: E1620

traits:
  - id: reflected-static-execute-method
    desc: Reflects a static Execute method by name
    crit: suspicious
    conf: 0.95
    if:
      type: text
      regex: "(?i)\\.GetMethod\\(\\s*['\\\"]Execute['\\\"]\\s*\\)"

composite_rules:
  - id: ps-download-reflect-execute-invoke
    desc: Downloads Base64 .NET and invokes static Execute
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/communications/http/client/managed::downloadstring
      - id: objectives/command-and-control/backdoor/loader/managed-reflect::ps-decode-and-load
      - id: reflected-static-execute-method
      - id: micro-behaviors/process/interpreter/reflection/runtime::powershell-assembly-method-invoke
    near_bytes: 1200
