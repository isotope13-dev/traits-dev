# PowerShell Reflective Loading
# Detects PowerShell reflective code loading patterns
# ATT&CK: T1620 (Reflective Code Loading)
defaults:
  attack: T1620
  mbc: E1620
  platforms: [linux, macos, windows, unix, android, ios]
  for: [powershell]

traits:
  - id: powershell-delimited-remote-payload
    desc: PowerShell slices downloaded delimited payload
    crit: suspicious
    conf: 0.96
    attack: T1105,T1140
    platforms: [windows]
    if:
      type: text
      regex: '(?is)\.Download(Data|String)\s*\([^)]{0,240}\)[\s\S]{0,600}\.(IndexOf|Substring)\s*\('

  - id: powershell-image-carrier-download
    desc: PowerShell downloads image payload carrier
    crit: suspicious
    conf: 0.94
    attack: T1105
    platforms: [windows]
    if:
      type: text
      regex: '(?i)Download\w{0,8}.{0,80}\.(jpe?g|png|gif|bmp)\b'

composite_rules:
  - id: powershell-remote-delimited-assembly-loader
    desc: PowerShell downloads delimited data and reflectively loads a .NET assembly
    crit: hostile
    conf: 0.99
    attack: T1105,T1140,T1620
    mbc: B0024,E1620
    platforms: [windows]
    all:
      - id: ps-decode-and-load
      - id: micro-behaviors/communications/http/client/managed::downloaddata
      - id: powershell-delimited-remote-payload

  - id: ps-decode-and-load
    desc: PowerShell decode and reflective load
    crit: hostile
    conf: 0.95
    all:
      - id: micro-behaviors/process/interpreter/reflection/resolve::powershell-assembly-load
      - id: micro-behaviors/data/decode/base64::dotnet-frombase64string-text
  - id: ps-reflective-load
    desc: PowerShell reflective assembly loading
    crit: hostile
    conf: 0.93
    all:
      - id: micro-behaviors/process/interpreter/reflection/resolve::powershell-assembly-load
    any:
      - id: micro-behaviors/process/interpreter/reflection/runtime::powershell-assembly-entrypoint-invoke
      - id: micro-behaviors/process/interpreter/reflection/runtime::powershell-assembly-method-invoke
