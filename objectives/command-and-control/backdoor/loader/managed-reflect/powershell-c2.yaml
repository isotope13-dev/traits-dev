---
defaults:
  platforms:
  - windows
  for:
  - powershell
  size_max: 5242880
  attack: T1059.001
traits:
- id: ps1-hidden-child-ps
  desc: 'Spawns hidden child PS with redirected output'
  crit: suspicious
  conf: 0.9
  attack: T1564.003
  if:
    type: text
    regex: ProcessWindowStyle\]::Hidden.{0,120}RedirectStandardOutput
- id: ps1-webclient-upload
  desc: WebClient UploadData for C2 beacon
  crit: suspicious
  conf: 0.8
  attack: T1071.001
  if:
    type: text
    substr: UploadData
composite_rules:
- id: ps1-reflective-c2-agent
  desc: PowerShell RAT with reflective .NET load and registry persistence
  crit: hostile
  conf: 0.97
  all:
  - id: micro-behaviors/process/interpreter/reflection/runtime::ps-decode-and-load
  - id: micro-behaviors/process/enumerate/wmi::win32-process-cmdlet-enumeration
  - id: ps1-hidden-child-ps
  - id: micro-behaviors/os/registry/keys::currentversion-run-key-path
  any:
  - id: ps1-webclient-upload
