---
defaults:
  platforms:
  - windows
  for:
  - powershell
  size_max: 5242880
  attack: T1059.001
traits:
- id: ps1-hidden-child-ps
  desc: 'Spawns hidden child PS with redirected output'
  crit: suspicious
  conf: 0.9
  attack: T1564.003
  if:
    type: text
    regex: ProcessWindowStyle\]::Hidden.{0,120}RedirectStandardOutput
composite_rules:
- id: ps1-reflective-c2-agent
  desc: PowerShell RAT with reflective .NET load and registry persistence
  crit: hostile
  conf: 0.97
  all:
  - id: micro-behaviors/process/interpreter/reflection/runtime::ps-decode-and-load
  - id: micro-behaviors/process/info/query::powershell-win32-process-query
  - id: ps1-hidden-child-ps
  - id: "micro-behaviors/os/registry/keys/autostart::currentversion-run-key-path"
  any:
  - id: micro-behaviors/communications/http/client/webclient::upload-data-method-name
