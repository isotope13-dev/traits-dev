# Class loading from a URL the class assembles at runtime.
#
# The bytecode holds `java/net/URL`, `[Ljava/net/URL;` (the URLClassLoader
# constructor signature) and `java/lang/ClassLoader`, and reaches them through
# Class.forName + getConstructor + newInstance rather than by naming
# URLClassLoader in the constant pool -- so the name never appears as a string
# and `java-urlclassloader-bytecode` cannot see it. Fractureiser stage 0 built
# "java.net.URLClassLoader" one byte at a time for exactly this reason.
#
# What convicts is the combination: a class that reflectively constructs
# something taking an array of URLs, then reflectively invokes a method on the
# result, is loading code from the network whatever the loader is called.
defaults:
  platforms: [unix, windows]
  for: [class, java_class, jar, zip]
  attack: T1105,T1620
  mbc: B0024

traits:
  # `URLClassLoader.addURL` is protected, so the documented way to extend a
  # running JVM's classpath is to reach it reflectively -- which produces this
  # rule's whole signature (a URL-array type, a reflective constructor, a
  # reflective invoke) without naming URLClassLoader in the constant pool.
  # GNU Octave's org/octave/ClassHelper backs `javaaddpath` this way; Ant and
  # most plugin hosts do the same. Reflection here is a language constraint,
  # not concealment, which is the premise the rule rests on.
  - id: reflective-classpath-addurl
    desc: Reflective addURL classpath extension
    crit: notable
    conf: 0.93
    if:
      type: text
      word: addURL
  - id: url-array-constructor-signature
    for: [class]
    desc: References the URL-array constructor type
    crit: notable
    conf: 0.9
    if:
      type: value
      path: class.class_refs[*]
      exact: '[Ljava/net/URL;'

composite_rules:
  - id: reflective-url-classloader-stage
    desc: Reflectively loads classes from a URL
    crit: hostile
    conf: 0.96
    # One class file, not one jar. A reflective loader stage is a single
    # method's worth of bytecode, but unscoped the legs pool across every
    # class in an archive: Jakarta Mail's Session reflectively constructs the
    # providers named in META-INF/javamail.providers and SocketFetcher does
    # the same for socket factories, while some unrelated class in the same
    # jar carries the ([Ljava/net/URL;)V signature. Every WAR that sends mail
    # -- GitBucket, Keycloak, Apicurio, Netflix Asgard -- matched on that.
    scope: file
    all:
      - id: url-array-constructor-signature
      - id: micro-behaviors/data/source/dynamic/reflect::java-bytecode-reflective-constructor-invoke
      - id: micro-behaviors/data/source/dynamic/reflect::java-bytecode-reflective-method-invoke
    unless:
      - id: metadata/package/testing/
      # Ordinary plugin/rendering loaders name URLClassLoader directly. This
      # rule is for the evasive form that hides the loader behind reflection.
      - id: micro-behaviors/data/source/dynamic/reflect::java-urlclassloader-bytecode
      - id: reflective-classpath-addurl
      - id: well-known/lib/network/jakarta-mail/
