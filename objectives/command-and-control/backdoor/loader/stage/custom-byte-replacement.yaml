# Remote staged payloads using the chained byte-substitution + XOR decoder
# described in the PrivateLoader analysis.
defaults:
  platforms: [windows, unix]
  for: [source, scripts, binaries]
  attack: T1105,T1140
  mbc: B0032

composite_rules:
  - id: prefixed-custom-payload-decoder
    desc: Custom byte decoder strips a staged payload prefix
    crit: hostile
    conf: 0.98
    attack: T1027,T1140
    all:
      - id: micro-behaviors/data/decode/custom::chained-byte-substitution-xor-decoder
      - id: micro-behaviors/data/decode/custom::four-byte-decoded-prefix-removal

  - id: remote-custom-decoder-stage-execution
    desc: Remote response is custom-decoded and executed as a staged payload
    crit: hostile
    conf: 0.99
    attack: T1105,T1140,T1059
    all:
      - id: micro-behaviors/data/decode/custom::chained-byte-substitution-xor-decoder
      - id: micro-behaviors/communications/http/client/response-body::remote-response-body-read
      - id: micro-behaviors/process/create/subprocess::process-execution
    near_lines: 80

  - id: dead-drop-custom-stage-execution
    desc: Dead-drop C2 delivers a custom-decoded executable stage
    crit: hostile
    conf: 0.99
    attack: T1102.001,T1105,T1140,T1059
    all:
      - id: objectives/command-and-control/channel/deaddrop/http-resolver::http-dead-drop-resolver
      - id: micro-behaviors/data/decode/custom::chained-byte-substitution-xor-decoder
      - id: micro-behaviors/process/create/subprocess::process-execution
    near_lines: 40
