defaults:
  platforms: [unix, windows]
  attack: T1129
  mbc: B0032
  for:
    - java
    - class
traits:

composite_rules:
  - id: socket-fed-classloader-stage
    desc: Socket-fed in-memory Java stage loader
    crit: hostile
    conf: 0.98
    for: [class]
    all:
      - type: trait
        id: objectives/command-and-control/backdoor/loader/archive::streamed-jar-bytecode-loader
      - type: trait
        id: micro-behaviors/data/source/dynamic/reflect::jvm-classloader-class-ref
      - type: trait
        id: micro-behaviors/data/source/dynamic/reflect::java-defineclass
      - type: trait
        id: micro-behaviors/data/source/dynamic/reflect::java-getdeclaredconstructor
      - type: trait
        id: micro-behaviors/communications/socket/create::java-socket-slash-reference
      - type: trait
        id: micro-behaviors/data/source/dynamic/reflect::java-method-invoke
    any:
      - type: trait
        id: objectives/command-and-control/backdoor/loader/classloader::loadclassfrombytes-string
      - type: trait
        id: micro-behaviors/data/source/dynamic/reflect::java-urlclassloader-bytecode
  - id: decoy-socket-jar-classloader
    desc: Decoy-tagged socket JAR classloader
    crit: hostile
    conf: 0.99
    for: [class]
    all:
      - type: trait
        id: objectives/command-and-control/backdoor/loader/classloader::gson-loader-string
      - type: trait
        id: objectives/command-and-control/backdoor/loader/archive::jarinputstream-string
      - type: trait
        id: objectives/command-and-control/backdoor/loader/archive::getnextjarentry-string
      - type: trait
        id: objectives/command-and-control/backdoor/loader/archive::bytearrayoutputstream-string
      - type: trait
        id: micro-behaviors/data/source/dynamic/reflect::java-getdeclaredconstructor
      - type: trait
        id: micro-behaviors/data/source/dynamic/reflect::java-method-invoke-bytecode
    any:
      - type: trait
        id: micro-behaviors/data/source/dynamic/reflect::java-defineclass
      - type: trait
        id: objectives/command-and-control/backdoor/loader/classloader::loadclassfrombytes-string
      - type: trait
        id: micro-behaviors/data/source/dynamic/reflect::java-urlclassloader-bytecode

  - id: java-encrypted-socket-file-stage
    desc: Java encrypted socket data loader with file staging
    crit: hostile
    conf: 0.98
    for: [jar]
    attack: T1071.001,T1573.001,T1105
    scope: archive
    all:
      - id: micro-behaviors/communications/http/lib/urlconnection::java-https-urlconnection-bytecode-import
      - id: micro-behaviors/communications/socket/create::java-socket-class-import
      - id: micro-behaviors/crypto/library/provider::secretkeyspec
      - id: micro-behaviors/fs/write/file/direct::jvm-fileoutputstream-bytecode
      # SecretKeySpec is only a key-construction API; require actual cipher
      # initialization/finalization before treating this common library mix
      # as an encrypted loader.
      - id: micro-behaviors/crypto/library/provider::cipher-init
    unless:
      - id: well-known/lib/jgit::eclipse-jgit-jar
      - id: well-known/lib/jgit::openrewrite-jgit-jar
