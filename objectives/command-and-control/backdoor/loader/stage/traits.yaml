defaults:
  crit: hostile
  platforms: [unix, windows]
  attack: T1129
  mbc: B0032
  for:
    - java
    - class
traits: []

composite_rules:
  - id: socket-fed-classloader-stage
    desc: Socket-fed in-memory Java stage loader
    conf: 0.98
    for: [class]
    all:
      - type: trait
        id: micro-behaviors/metaprogramming/reflection::jar-stream-classloader-apis
      - type: trait
        id: micro-behaviors/data/source/dynamic/reflect::jvm-classloader-class-ref
      - type: trait
        id: micro-behaviors/data/source/dynamic/reflect::java-defineclass
      - type: trait
        id: micro-behaviors/data/source/dynamic/reflect::java-getdeclaredconstructor
      - type: trait
        id: micro-behaviors/communications/socket/create::java-socket-slash-reference
      - type: trait
        id: micro-behaviors/metaprogramming/reflection::java-method-invoke-bytecode
    any:
      - type: trait
        id: micro-behaviors/metaprogramming/reflection::loadclassfrombytes-helper
      - type: trait
        id: micro-behaviors/data/source/dynamic/reflect::java-urlclassloader-bytecode
  - id: decoy-socket-jar-classloader
    desc: Decoy-tagged socket JAR classloader
    conf: 0.99
    for: [class]
    all:
      - type: trait
        id: objectives/command-and-control/backdoor/loader/classloader::gson-loader-string
      - type: trait
        id: micro-behaviors/data/archive/library::jarinputstream-ref
      - type: trait
        id: micro-behaviors/data/archive/library::jarinputstream-entry-iteration
      - type: trait
        id: micro-behaviors/data/buffer/transfer::bytearrayoutputstream-ref
      - type: trait
        id: micro-behaviors/data/source/dynamic/reflect::java-getdeclaredconstructor
      - type: trait
        id: micro-behaviors/metaprogramming/reflection::java-method-invoke-bytecode
    any:
      - type: trait
        id: micro-behaviors/data/source/dynamic/reflect::java-defineclass
      - type: trait
        id: micro-behaviors/metaprogramming/reflection::loadclassfrombytes-helper
      - type: trait
        id: micro-behaviors/data/source/dynamic/reflect::java-urlclassloader-bytecode
