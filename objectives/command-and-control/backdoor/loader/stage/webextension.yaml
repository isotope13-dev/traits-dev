# Browser-extension stage loader described by Socket's Superior campaign
# research. The matchers model the reusable architecture: an all-site extension
# receives tasking over WebSocket, persists an encrypted module in extension
# storage, decrypts it, and asks the page's main world to compile it through a
# DOM event-handler attribute.
defaults:
  platforms: [windows, unix]
  for: [crx, xpi, zip]
  attack: T1059.007,T1071.001,T1105,T1176

composite_rules:
  - id: webextension-websocket-encrypted-dom-stage
    desc: WebSocket extension decrypts stored code into a DOM event handler
    crit: hostile
    conf: 0.995
    scope: archive
    all:
      - id: metadata/permission/manifest::is-chrome-manifest
      - id: metadata/permission/host::broad-host-access
      - id: micro-behaviors/communications/http/websocket::wss-scheme
      - id: micro-behaviors/communications/http/websocket::websocket-constructor-call
      - id: micro-behaviors/communications/ipc/message::js-message-event-listener
      - id: micro-behaviors/data/db/web-storage::chrome-storage-local-set
      - id: micro-behaviors/data/db/web-storage::chrome-storage-local-get
      - id: micro-behaviors/crypto/symmetric/aes/library::webcrypto-aes-gcm-decrypt
      - id: micro-behaviors/process/interpreter/runtime/eval::js-dom-event-handler-variable-code
      - id: micro-behaviors/ui/window/manage/automation::dom-dispatch-non-pointer-event
