# Socket-fed staged loaders: connect, accumulate a multi-read second stage
# in a receive loop, then execute it from natively allocated memory. This is
# the AtlasRAT loader shape (magic check-in, 300-500 kB shellcode stage,
# backdoor runs from the stage, second C2 session follows); the verdict
# rests on the staged-download-plus-execution structure, not the check-in
# constant, so re-keyed loaders keep matching.
defaults:
  platforms: [windows]
  for: [python]
  attack: T1105,T1055
composite_rules:
  - id: checkin-staged-shellcode-loader
    desc: Socket-fed staged shellcode loader
    crit: hostile
    conf: 0.95
    all:
      - id: micro-behaviors/communications/socket/connect::socket-create-connection-call
      - id: micro-behaviors/communications/socket/receive::staged-recv-accumulation
      - id: micro-behaviors/mem/alloc/executable::python-virtualalloc-call
      - id: micro-behaviors/process/thread/create::python-ctypes-create-thread
