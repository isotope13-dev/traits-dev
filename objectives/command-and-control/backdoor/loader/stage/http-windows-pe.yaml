---
defaults:
  for:
  - pe
  - dll
  platforms:
  - windows
composite_rules:
- id: winhttp-staged-loader-profile
  desc: WinHTTP C2 with staged loader host integration profile
  crit: suspicious
  conf: 0.94
  attack: T1071.001
  all:
  - id: micro-behaviors/communications/http/client/winhttp::winhttp-request-flow
  - id: micro-behaviors/process/sync/mutex::mutex-instance-check
  any:
  - id: micro-behaviors/os/registry/access::registry-write-api-chain
  - id: objectives/impact/degrade/edr/enumerate::process-enumeration-terminate
  - id: micro-behaviors/data/embedded/payload/resource::pe-resource-full-extraction
  - id: micro-behaviors/crypto/library/provider::capi-keyed-buffer-crypto-chain
  - id: objectives/persistence/login/startup/folder::startup-folder-shell-path-composition-chain
  needs: 3
  downgrade:
    any:
    - id: metadata/binary/vendor::is-microsoft-named
    - id: well-known/app/security/defender/
    - id: metadata/binary/vendor::microsoft-corp-versioninfo
    - id: metadata/package/versioning::pe-version-resource

- id: unsigned-encrypted-socks-cert-loader
  desc: Unsigned PE hides a SOCKS loader behind encrypted C2 and certificate staging
  crit: hostile
  conf: 0.99
  attack: "T1071.001,T1090.003,T1027,T1497"
  all:
  - id: metadata/signed/trust-level::unsigned
  - id: micro-behaviors/communications/socket/multiplex::winsock-event-loop
  - id: micro-behaviors/communications/proxy/socks::socks5-proto
  - id: micro-behaviors/crypto/library/provider::capi-keyed-buffer-crypto-chain
  - id: objectives/command-and-control/infrastructure/domain/tld::suspicious-tld
  any:
  - id: micro-behaviors/crypto/certificate/store::cert-add-to-store
  - id: micro-behaviors/crypto/certificate/store::pfx-import
  - id: micro-behaviors/process/debug/detect::is-debugger-present-import
  - id: objectives/anti-analysis/vm-detect/vendor::vendor-qemu
  needs: 1
