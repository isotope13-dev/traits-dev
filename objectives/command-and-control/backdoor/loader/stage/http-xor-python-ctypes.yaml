# Downloader stage: the body of an HTTP response is XOR-decoded in Python and
# the result is copied into an executable VirtualAlloc buffer and entered on a
# new thread. CoffeeLoader's downloader fetches its main body this way (key =
# first 16 bytes of the response). The verdict rests on the fetch + decode +
# executable-memory structure, not on a host, path, or header name.
defaults:
  platforms: [windows]
  for: [python]
  attack: T1105,T1620,T1055
composite_rules:
  - id: http-xor-stage-ctypes-loader
    desc: HTTP body XOR-decoded into executable memory
    crit: hostile
    conf: 0.95
    all:
      - id: micro-behaviors/communications/http/client/response-body::urlopen-response-body-read
      - id: micro-behaviors/data/encoding/xor/unspecified-key::python-xor-bytes-comprehension
      - id: micro-behaviors/mem/alloc/virtual::python-virtualalloc-near-rwx-number
      - id: micro-behaviors/mem/copy::python-ctypes-memmove
      - id: micro-behaviors/process/thread/create::python-ctypes-create-thread
