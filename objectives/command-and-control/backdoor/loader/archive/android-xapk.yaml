defaults:
  for: [archives, zip, odf]
  platforms: [android]
  crit: component
  conf: 0.98
  attack: T1105

traits:
  - id: redrama-base-apk-member
    desc: XAPK contains the Redrama base APK
    for: [odf]
    if:
      type: value
      path: archive.members[*].path
      exact: com.redrama.shortsgo.apk

  - id: redrama-native-loader-split-reference
    desc: XAPK split references the Redrama native loader
    crit: suspicious
    if:
      type: text
      substr: lib/arm64-v8a/librckbpfundzy.so

composite_rules:
  - id: redrama-concealed-native-c2-loader-carrier
    desc: XAPK carries the Redrama startup-loaded native C2 response handler
    crit: hostile
    conf: 0.999
    all:
      - id: redrama-base-apk-member
      - id: redrama-native-loader-split-reference
      - id: metadata/package/files/mobile-package::android-xapk-bundle
