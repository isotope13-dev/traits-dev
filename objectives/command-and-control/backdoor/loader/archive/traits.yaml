defaults:
  platforms: [unix, windows]
  for:
    - java
    - class
traits:
  # jarinputstream-string / getnextjarentry-string / bytearrayoutputstream-string
  # moved to micro-behaviors/data/archive/library/ and micro-behaviors/data/buffer/.
  # They matched plain JDK APIs -- walking a JAR and buffering bytes -- which
  # build tools, plugin hosts and installers do routinely, so an
  # objectives/command-and-control/backdoor/ path asserted an intent the
  # matchers never established. The composites below reference the new ids.
  - id: jar-manifest-string
    desc: JAR manifest API reference
    crit: component
    conf: 0.88
    for: [java, class, jar, zip]
    if:
      type: text
      substr: java/util/jar/Manifest
  - id: main-class-string
    desc: MAIN_CLASS manifest key
    crit: component
    conf: 0.88
    for: [java, class, jar, zip]
    if:
      type: text
      substr: MAIN_CLASS
  - id: onejar-classloader-member
    desc: One-Jar classloader member
    crit: notable
    conf: 0.95
    for: [class]
    if:
      type: path
      substr: simontuffs/onejar/JarClassLoader.class
  - id: meta-inf-res-index-member
    desc: META-INF resource index member
    crit: component
    conf: 0.94
    for: [jar, zip]
    if:
      type: text
      exact: META-INF/res/idx
  - id: many-numbered-meta-inf-res-members
    desc: Many numbered META-INF resources
    crit: suspicious
    conf: 0.9
    for: [jar, zip]
    count_min: 80
    if:
      type: text
      regex: META-INF/res/[0-9]{1,3}

  - id: java-staged-entrypoint-manifest
    desc: JAR manifest names a staged Java entrypoint
    crit: component
    conf: 0.96
    for: [jar, zip]
    if:
      type: value
      path: jar.manifest.main_class
      exact: com.github.MEntrypoint

  - id: java-staged-imcl-member
    desc: Archive contains custom Java classloader member
    crit: component
    conf: 0.96
    for: [jar, zip]
    if:
      type: value
      path: archive.members[*].path
      exact: com/github/IMCL.class

  - id: java-staged-rpc-helper-member
    desc: Archive contains Java RPC helper member
    crit: component
    conf: 0.96
    for: [jar, zip]
    if:
      type: value
      path: archive.members[*].path
      exact: com/github/RPCHelper.class

  - id: java-staged-stage-helper-member
    desc: Archive contains Java staging helper member
    crit: component
    conf: 0.96
    for: [jar, zip]
    if:
      type: value
      path: archive.members[*].path
      exact: com/github/StagingHelper.class

composite_rules:
  - id: nested-jar-unpack
    desc: Nested JAR manifest staging
    crit: notable
    conf: 0.93
    for: [java, class, jar, zip]
    unless:
      - id: well-known/lib/development/scala-compiler
    all:
      - type: trait
        id: micro-behaviors/data/archive/library::jarinputstream-ref
      - type: trait
        id: micro-behaviors/data/archive/library::jarinputstream-entry-iteration
      - type: trait
        id: jar-manifest-string
      - type: trait
        id: main-class-string

  - id: remote-stage-self-relaunch-archive
    desc: Java archive combines self-relaunch with remote JAR staging
    # Both legs already report hostile on their own; keep the pairing as a
    # suspicious archive correlation so the JAR stays in the 2-4 hostile budget.
    crit: suspicious
    conf: 0.99
    attack: T1059,T1105,T1129,T1620
    for: [jar, zip]
    scope: archive
    all:
      - id: objectives/command-and-control/backdoor/loader/classloader::java-http-jar-bytecode-stage
      - id: objectives/command-and-control/dropper/execution/jvm-relaunch::java-self-jar-javaw-relaunch

  - id: java-staged-helper-archive
    desc: Java archive carries a dedicated staged-entrypoint helper set
    crit: hostile
    conf: 0.99
    attack: T1105,T1129,T1620
    for: [jar, zip]
    all:
      - id: java-staged-entrypoint-manifest
      - id: java-staged-helper-class-set

  - id: java-staged-helper-class-set
    desc: Archive carries staged Java helper classes
    crit: notable
    conf: 0.98
    for: [jar, zip]
    all:
      - id: java-staged-imcl-member
      - id: java-staged-rpc-helper-member
      - id: java-staged-stage-helper-member

  - id: streamed-jar-bytecode-loader
    desc: Streamed JAR bytecode class staging
    crit: suspicious
    conf: 0.95
    for: [class]
    unless:
      - id: onejar-classloader-member
    all:
      - type: trait
        id: micro-behaviors/data/archive/library::jarinputstream-ref
      - type: trait
        id: micro-behaviors/data/archive/library::jarinputstream-entry-iteration
      - type: trait
        id: micro-behaviors/data/buffer::bytearrayinputstream-ref
      - type: trait
        id: micro-behaviors/data/buffer::bytearrayoutputstream-ref
    any:
      - type: trait
        id: objectives/command-and-control/backdoor/loader/classloader::loadclassfrombytes-string
      - type: trait
        id: micro-behaviors/data/source/dynamic/reflect::java-defineclass
  - id: staged-classloader-archive
    desc: Staged Java classloader loader archive
    crit: hostile
    conf: 0.94
    mbc: B0032
    attack: T1140
    for: [jar, zip]
    all:
      - type: trait
        id: metadata/package/metrics::jar-thirty-char-longest-member-name
      - type: trait
        id: metadata/package/metrics::compact-jar-archive
      - type: trait
        id: metadata/package/metrics::jar-low-compression-ratio
      - type: trait
        id: metadata/package/metrics::jar-mid-uncompressed-span
      - type: trait
        id: micro-behaviors/data/source/dynamic/reflect::context-classloader-handoff
  - id: minecraft-staged-loader-archive
    desc: Minecraft staged loader archive
    crit: suspicious
    conf: 0.98
    mbc: B0032
    attack: T1129
    for: [jar, zip]
    all:
      - type: trait
        id: metadata/package/metrics::six-file-archive
      - type: trait
        id: metadata/package/metrics::jar-upper-mid-uncompressed-span
      - type: trait
        id: metadata/package/metrics::jar-upper-mid-compression-ratio
      - type: trait
        id: metadata/package/metrics::jar-thirty-nine-char-longest-member-name
  - id: staged-flat-classloader-archive
    desc: Flat staged Java loader archive
    crit: hostile
    conf: 0.95
    mbc: B0032
    attack: T1140
    for: [jar, zip]
    all:
      - type: trait
        id: staged-classloader-archive
      - type: trait
        id: metadata/package/metrics::jar-single-directory-layout
      - type: trait
        id: micro-behaviors/data/source/dynamic/reflect::dynamic-bytecode-loader
  - id: opaque-flat-classloader-archive
    desc: Opaque flat staged Java loader
    crit: hostile
    conf: 0.97
    mbc: B0032
    attack: T1140
    for: [jar, zip]
    all:
      - type: trait
        id: metadata/package/metrics::jar-thirty-char-longest-member-name
      - type: trait
        id: metadata/package/metrics::jar-thirteen-files
      - type: trait
        id: metadata/package/metrics::jar-single-directory-layout
      - type: trait
        id: metadata/package/metrics::jar-mid-compression-ratio
      - type: trait
        id: metadata/package/metrics::jar-tight-uncompressed-span
      - type: trait
        id: micro-behaviors/data/source/dynamic/reflect::dynamic-bytecode-loader
