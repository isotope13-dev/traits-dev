defaults:
  platforms: [windows, unix]
  for: [scripts]
  crit: notable
  conf: 0.9
  attack: T1546

traits:
composite_rules:
  - id: plugin-fetch-exec-hostile
    desc: Hostile fetch-and-execute in plugin context
    crit: hostile
    conf: 0.95
    all:
      - id: micro-behaviors/fs/path/extension::plugin-directory-path-1
      - id: micro-behaviors/fs/path/extension::plugin-directory-path-2
      - id: micro-behaviors/fs/path/extension::plugin-directory-path-3
    any:
      - id: micro-behaviors/process/create/subprocess::fetch-write-exec
      - id: micro-behaviors/process/create/subprocess::fetch-write-exec-delete
      - id: objectives/evasion/process/hidden/execution::obfuscated-node-hidden-stage-exec
      - id: objectives/command-and-control/dropper/script-eval/
    unless:
      - id: well-known/app/development/cloudflare/
      - id: metadata/package/testing/presence/harness/
      - id: metadata/build/pip::python-packaging-tool-tests
      - id: "metadata/file/naming::test-directory-component"
