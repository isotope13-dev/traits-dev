defaults:
  platforms: [windows, unix]
  for: [scripts]
  crit: notable
  conf: 0.9
  attack: T1546

composite_rules:
  - id: plugin-fetch-exec-hostile
    desc: Hostile fetch-and-execute in plugin context
    crit: hostile
    conf: 0.95
    all:
      - id: micro-behaviors/fs/path/library::plugins-or-extensions-subdirectory-reference
      - id: micro-behaviors/fs/path/application/plugin::comfyui-custom-nodes-directory-reference
      - id: micro-behaviors/fs/path/application/plugin::module-plugin-subdirectory-reference
    any:
      - id: metadata/file/profile/co-occurrence/network-process::fetch-write-exec
      - id: metadata/file/profile/co-occurrence/network-process::fetch-write-spawn-delete-context
      - id: objectives/evasion/process/hidden/execution::obfuscated-node-hidden-stage-exec
      - id: objectives/command-and-control/dropper/script-eval/
      - id: objectives/execution/payload/script-eval::activex-serverxmlhttp-sync-eval-dropper
      - id: metadata/file/profile/script-evaluation::php-eval-http-read-text
      - id: metadata/file/profile/script-evaluation::php-eval-uri-read-text
      - id: metadata/file/profile/script-evaluation::batch-powershell-long-irm-iex
      - id: metadata/file/profile/script-evaluation::powershell-web-response-piped-eval-text
      - id: micro-behaviors/process/deploy/script-eval/network::eval-curl-subshell
      - id: objectives/execution/payload/script-eval::concealed-client-eval-response-data
      - id: objectives/execution/payload/script-eval::python-base64-gzip-exec-with-error-cover
    unless:
      - id: well-known/app/development/cloudflare/
      - id: metadata/package/testing/presence/harness/
      - id: metadata/build/pip::python-packaging-tool-tests
      - id: metadata/path/directory::test-directory-component
