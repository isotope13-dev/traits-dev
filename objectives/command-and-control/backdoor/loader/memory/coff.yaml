# In-memory COFF/BOF loader behavior described in the linked technical report.
# This is a technique rule, not a family or IOC signature.
defaults:
  platforms: [unix, windows]
  for: [c, cpp, python, rust, elf, macho, pe, dll]
  attack: T1620
  mbc: C0016
traits:
  - id: beacon-object-payload-marker
    desc: References a Beacon object payload
    crit: component
    conf: 0.88
    if:
      type: text
      regex: '\bBeacon\b.{0,40}\b(object|payload)\b'
  - id: coff-memory-payload
    desc: COFF payload in memory
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)\b(load|execute)\w*\s+(a\s+)?COFF.{0,40}\bmemory\b'
  - id: bof-memory-payload
    desc: BOF payload in memory
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '\bBOF\b.{0,80}\b(in[- ]memory|memory)\b'
composite_rules:
  - id: coff-beacon-in-memory-loader
    desc: Loads a COFF/Beacon payload directly in memory
    crit: hostile
    conf: 0.97
    all:
      - id: beacon-object-payload-marker
    any:
      - id: coff-memory-payload
      - id: bof-memory-payload
