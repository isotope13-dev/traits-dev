defaults:
  crit: hostile
  platforms: [unix, windows, macos]
  attack: T1620
composite_rules:
  - id: go-mem-loader
    desc: "Detects Go-based memory loader with self-deletion or shellcode"
    mbc: C0016 # In-Memory Execution
    all:
      - id: objectives/execution/interpreter/go::go-mem-exec
    any:
      - id: objectives/execution/interpreter/go::go-self-delete
      - id: objectives/anti-static/obfuscation/string/encoding::hex-xor-loop-stub
  - id: go-aes-callback-shellcode-stager
    desc: Go AES callback shellcode stager
    conf: 0.995
    mbc: B0005
    all:
      - id: metadata/lang/compiler/systems::go-pe-rich-symbols
      - id: micro-behaviors/os/api-resolution/manual::go-lazyproc-resolution
      - id: micro-behaviors/crypto/certificate/store::cert-enum-system-store-location
      - id: micro-behaviors/crypto/decrypt/transform/symmetric::go-aes-ecb-decrypt-name
    any:
      - id: metadata/lang/compiler/systems::certenum-source-path
      - id: objectives/command-and-control/backdoor/loader/memory::go-marker-16-char-literal
      - id: micro-behaviors/communications/http/client/wininet::wininet-http-api-cluster
      - id: objectives/command-and-control/infrastructure/domain/malicious::h5-helloniubi-shop
      - id: micro-behaviors/communications/http/header/value::windows-phone-mobile-ua
    downgrade:
      any:
        - id: metadata/filename/name-form::is-microsoft-named
