defaults:
  platforms: [windows]
  for: [java]
  attack: T1620
  mbc: E1055

traits:
  - id: java-reflective-dll-inject-method
    desc: Java reflective DLL inject method
    crit: notable
    conf: 0.9
    if:
      type: symbol
      kind: function
      exact: DLLInject
  - id: java-reflective-dll-operator-text
    desc: Java reflective DLL injection operator text
    crit: notable
    conf: 0.9
    if:
      type: literal
      exact: Reflective DLL Injection
  - id: java-remote-dll-send-command
    desc: Java remote DLL send command
    crit: notable
    conf: 0.9
    if:
      type: literal
      exact: fdll
  # `micro-behaviors/fs/read/file/handle::java-fileinputstream-class` is a
  # `type: import` match against a compiled .class file's constant-pool import
  # table; it cannot see this Java source file. Source uses the class by name
  # instead, either via an explicit import or the fully qualified constructor
  # call.
  - id: java-source-fileinputstream-use
    desc: Java source references FileInputStream
    crit: notable
    conf: 0.85
    if:
      type: text
      regex: '\bjava\.io\.FileInputStream\b|\bnew\s+FileInputStream\s*\('

composite_rules:
  - id: java-remote-reflective-dll-injection
    desc: Java remote reflective DLL injection
    crit: suspicious
    conf: 0.95
    all:
      - id: java-reflective-dll-inject-method
      - id: micro-behaviors/communications/socket/create::java-socket-create
      - id: java-source-fileinputstream-use
      - id: java-remote-dll-send-command
    any:
      - id: java-reflective-dll-operator-text
      - id: java-socket-output-write-source
  - id: java-socket-output-write-source
    desc: Java output-stream write evidence
    crit: component
    conf: 0.84
    any:
      - id: micro-behaviors/process/io/stream::java-output-stream-access
      - id: micro-behaviors/process/io/stream::java-output-stream-write
