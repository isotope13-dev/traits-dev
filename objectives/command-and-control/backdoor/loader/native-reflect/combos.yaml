defaults:
  platforms:
    - unix
    - windows
    - macos
  mbc: B0005
  for: [pe, dll]
composite_rules:
  - id: encrypted-overlay-x86-reflective-loader
    desc: XOR overlay feeds x86 manual PE mapper
    crit: hostile
    conf: 0.99
    attack: T1027.002, T1027.009, T1140, T1620
    platforms:
      - windows
    arch:
      - x86
    all:
      - id: micro-behaviors/fs/read/file/handle::pe-module-path-file-io-overlay
      - id: micro-behaviors/data/bitwise/xor-forms/indexed::x86-indexed-two-buffer-xor-loop
      - id: micro-behaviors/mem/combined::x86-pe-validation-allocation-export-api-set
      - id: metadata/binary/layout/entropy::high-entropy-overlay
      - id: metadata/signature/absent::unsigned-missing-signature-record
    unless:
      - id: metadata/installer/product/
  - id: reflective-loader-with-shellcode-thread
    desc: Reflective loader stages executable thread
    crit: hostile
    conf: 0.97
    attack: T1620, T1055
    platforms:
      - windows
    all:
      - id: micro-behaviors/data/format/executable/header::x86-mz-pe-signature-check
      # CRT image-base validation already checks MZ/PE, and the CRT pseudo-
      # relocator calls VirtualProtect, so those legs alone describe every
      # threaded MinGW/MSVC program. Relocation-type dispatch is the step that
      # actually maps an image by hand.
      - id: micro-behaviors/data/format/pe-parser::x86-base-relocation-type-dispatch
      - id: micro-behaviors/mem/protect/modify/api-reference::integer-loads-protection-thread-apis
      - id: micro-behaviors/process/thread/create::create-thread
    unless:
      - id: well-known/app/ai/tool-server/mcu-ai-debug/
      - id: metadata/lang/compiled::rust-backtrace-symbolizer
  - id: native-loader-with-anti-analysis
    desc: Native loader combines anti-analysis gates
    crit: hostile
    conf: 0.97
    attack: T1620, T1497, T1622
    platforms:
      - windows
    all:
      - id: micro-behaviors/data/format/executable/header::x86-mz-pe-signature-check
      - id: micro-behaviors/os/virtualization/hypervisor::vm-vendor-hardware-references
      - id: micro-behaviors/process/debug/tool-markers::analyst-tool-name-cluster
    unless:
      - id: metadata/lang/compiled::rust-backtrace-symbolizer
  - id: encrypted-pe-loader-with-analyst-tool-catalog
    desc: Encrypted PE loader catalogs debuggers
    crit: hostile
    conf: 0.99
    attack: T1027, T1497, T1518.001, T1620
    platforms:
      - windows
    all:
      - id: micro-behaviors/mem/combined::cbc-pe-header-protection-api-profile
      - id: micro-behaviors/data/embedded/payload/header::inline-pe-header-validation-sequence
      - id: micro-behaviors/process/debug/tool-markers::x64dbg-executable-name-reference
      - id: micro-behaviors/process/debug/tool-markers::procmon-tool-name-reference
      - id: micro-behaviors/process/debug/tool-markers::ollydbg-executable-name-reference
    unless:
      - id: metadata/installer/product/
  - id: windows-persistent-aes-loader
    desc: Windows persistent AES loader chain
    crit: hostile
    conf: 0.97
    attack: T1620, T1547.001
    platforms:
      - windows
    all:
      - id: micro-behaviors/mem/combined::cbc-pe-header-protection-api-profile
      - id: micro-behaviors/os/registry/autostart/reference::currentversion-run-key-path
      - id: micro-behaviors/communications/ip/endpoint::external-ipv4-port-rdata-pair
    unless:
      - id: metadata/installer/product/
  - id: unsigned-renamed-aes-network-reflective-loader
    desc: Unsigned renamed PE decrypts a PE and resolves network endpoints
    crit: hostile
    conf: 0.97
    attack: T1027,T1620,T1071.004
    platforms:
      - windows
    all:
      - id: metadata/signature/absent::unsigned-missing-signature-record
      - id: metadata/binary/provenance/version-info::pe-original-filename-mismatch
      - id: micro-behaviors/mem/combined::cbc-pe-header-protection-api-profile
      - id: micro-behaviors/communications/ip/resolve::resolve-getaddrinfo-import
    unless:
      - id: metadata/installer/product/
  - id: encrypted-overlay-reflective-pe-loader
    desc: Encrypted overlay in-memory PE loader
    crit: hostile
    conf: 0.98
    attack: T1027.002, T1027.009, T1140, T1620
    platforms:
      - windows
    all:
      - id: metadata/binary/layout/overlay::overlay-80kb-high-entropy
      - id: micro-behaviors/os/api-resolution/dynamic::loader-api-surface
      - id: micro-behaviors/data/format/pe-parser::inline-pe-signature-check
    any:
      - id: micro-behaviors/data/parse/portable-executable::pe-mz-compare-x64
      - id: micro-behaviors/data/parse/portable-executable::pe-header-walk-x64
      - id: micro-behaviors/mem/combined::virtual-memory-allocation-protection-api-pair
  - id: xor-concealed-inline-pe-map-loader
    desc: XOR-concealed remote-thread API name alongside in-memory PE mapping
    crit: suspicious
    conf: 0.96
    attack: T1027.007, T1620
    platforms:
      - windows
    all:
      - id: micro-behaviors/process/inject/remote-thread::xor-createremotethread-name-prefix
      - id: micro-behaviors/data/embedded/payload/header::inline-pe-header-validation-sequence
      - id: micro-behaviors/mem/protect/modify/unspecified::virtual-protect-import
      - id: metadata/signature/absent::unsigned-missing-signature-record
