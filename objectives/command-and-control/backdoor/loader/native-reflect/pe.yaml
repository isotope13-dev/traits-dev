defaults:
  platforms:
    - windows
  for:
    - pe
    - dll
traits:
  - id: service-run-export
    desc: DLL exports ServiceRun entry point
    crit: suspicious
    conf: 0.96
    if:
      type: export
      exact: ServiceRun

  - id: service-run-export-source
    desc: Source declares exported ServiceRun entry point
    crit: suspicious
    conf: 0.96
    for: [source]
    if:
      type: text
      regex: '(?is)__declspec\s*\(\s*dllexport\s*\).{0,80}\bServiceRun\s*\('

  - id: custom-pe-loader
    desc: Manual PE header verification and parsing
    crit: suspicious
    conf: 0.9
    mbc: B0005
    if:
      type: hex
      section: .text
      pattern: 66 81 ?? 4d 5a 75 ?? ?? ?? ?? 3c ?? ?? ?? ?? ?? 50 45 00 00
    unless:
      - id: metadata/signed/developer::hulubulu-software
      - id: metadata/lang/compiler/native::mingw-pseudo-reloc-runtime
      # Benign compiled-runtime PE markers: a Python C-extension (PyInit_
      # export) or a MinGW C-runtime stub is not a reflective loader.
      # Raw: large MinGW binaries may not surface this via text extraction.
      - type: raw
        section: .rdata
        regex: 'PyInit_|Mingw-w64 runtime failure:'
      - id: micro-behaviors/data/db/postgresql/
      - id: well-known/app/system/sq::go-module-path
      # The Rust object crate's PE/COFF parser (linked by std backtrace
      # symbolization) emits this exact MZ/PE-signature header walk on the
      # binary's own headers — not a payload it intends to map and run.
      - id: metadata/lang/compiled::rust-backtrace-symbolizer
      - id: well-known/lib/media/ffmpeg/
      - id: well-known/lib/runtime/icu::icu-data-runtime-library

  - id: x64-manual-pe-section-mapper
    desc: x64 manual PE section mapper
    crit: component
    conf: 0.92
    mbc: B0005
    attack: T1620
    arch: [x86-64]
    if:
      type: hex
      section: .text
      pattern: "48 63 40 3C 48 8B 8C 24 C0 00 00 00 48 03 C8 48 8B C1 48 89 44 24 28 48 8B 44 24 28 0F B7 40 14"
  - id: x64-manual-pe-section-copy-loop
    desc: x64 manual PE section copy loop
    crit: component
    conf: 0.9
    mbc: B0005
    attack: T1620
    arch: [x86-64]
    if:
      type: hex
      section: .text
      pattern: "0F B7 40 06 39 44 24 24 7D 67 48 63 44 24 24 48 6B C0 28 48 8B 4C 24 38 8B 44 01 0C"
composite_rules:
  - id: x64-manual-pe-mapper
    desc: x64 manual PE mapper
    crit: suspicious
    conf: 0.95
    mbc: B0005
    attack: T1620
    all:
      - id: x64-manual-pe-section-mapper
      - id: x64-manual-pe-section-copy-loop
  - id: loader-api-surface
    desc: Native loader API surface pattern
    crit: suspicious
    conf: 0.86
    mbc: B0005
    attack: T1620
    all:
      - id: micro-behaviors/mem/protect/modify::virtual-alloc
      - id: micro-behaviors/dylib/load/runtime::load-library-a
      - id: micro-behaviors/os/module/load::get-proc-address-import
      - id: micro-behaviors/mem/protect/modify::virtual-protect
    any:
      - id: micro-behaviors/os/module/load::get-module-filename-ansi
      - id: micro-behaviors/fs/file/open::fopen
      - id: micro-behaviors/fs/file/read::fread
    needs: 2
    unless:
      - id: metadata/binary/metrics/structural::many-imports
      - id: metadata/binary/metrics/threshold::many-imports-100
      - id: metadata/package/quality/
      - id: micro-behaviors/data/db/postgresql/
      - id: well-known/tool/reverse-engineering/oep-finder/
      - id: well-known/tool/reverse-engineering/windows-debugger/
      - id: well-known/tool/reverse-engineering/nanomite/
  - id: x86-manual-pe-mapper
    desc: x86 manual PE mapper API surface
    crit: suspicious
    conf: 0.97
    mbc: B0005
    attack: T1620
    arch: [x86]
    all:
      - id: micro-behaviors/data/embedded/payload/header::x86-inline-pe-header-validation-sequence
      - id: micro-behaviors/mem/protect/modify::virtual-memory-allocation-protection-api-pair
      - id: micro-behaviors/os/module/load::get-proc-address-import
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/installer/family/
      - id: well-known/app/
      - id: well-known/lib/
      - id: well-known/tool/reverse-engineering/
  # The MemoryModule import surface, keyed on the two APIs the MSVC C runtime
  # never pulls in.
  #
  # `loader-api-surface` and `native-loader-api-combo` both stand down on
  # `many-imports`, because VirtualAlloc + LoadLibraryA + GetProcAddress alone
  # is ordinary in any large program. That guard also exempts every loader
  # linked against the MSVC CRT, which drags ~80 imports in on its own — i.e.
  # most real droppers. This composite replaces the import-count guard with a
  # sharper discriminator, so it stays valid at any import count.
  #
  # `IsBadReadPtr` was deprecated by Microsoft two decades ago and no current
  # runtime calls it; `GetNativeSystemInfo` is the WOW64-aware page-size and
  # architecture query. Joachim Bauch's MemoryModule — the reference manual PE
  # mapper that most in-memory loaders are still copied from — imports exactly
  # this pair to size and validate the image it is about to map, alongside the
  # alloc/protect/resolve trio. Seeing both beside the mapping APIs means the
  # program is preparing to lay out a PE itself rather than let the loader do
  # it.
  - id: memorymodule-manual-map-api-set
    desc: MemoryModule manual PE mapping API set
    crit: suspicious
    conf: 0.93
    mbc: B0005
    attack: T1620
    all:
      - id: micro-behaviors/os/sysinfo/hardware::get-native-system-info
      - id: objectives/anti-analysis/debugger-detect/check::bad-read-ptr
      - id: micro-behaviors/mem/protect/modify::virtual-alloc
      - id: micro-behaviors/mem/protect/modify::virtual-protect
      - id: micro-behaviors/os/module/load::get-proc-address-import
    any:
      - id: micro-behaviors/dylib/load/runtime::load-library-a
      - id: micro-behaviors/os/module/load::free-library
    unless:
      - id: metadata/signed/platform/
      - id: well-known/tool/reverse-engineering/
      - id: metadata/binary/installer/family/

  # The mapper plus the thing it maps. A stub whose code section is a few
  # percent of the file, whose remaining ninety percent is unparsed appended
  # data, and whose imports are the manual-map set, has one plausible reading:
  # the overlay is a PE that the stub lays out in memory at run time. Nothing
  # is written to disk and no loader-visible module is ever created, which is
  # the point.
  - id: overlay-payload-manual-map-loader
    desc: Overlay-payload stub maps its payload manually
    crit: hostile
    conf: 0.95
    mbc: B0005
    attack: T1620,T1027.009
    all:
      - id: memorymodule-manual-map-api-set
      - id: objectives/command-and-control/dropper/staging/stub::overlay-body-stub-executable

  - id: native-loader-obfuscated
    desc: Native reflective loader with packer profile
    crit: suspicious
    conf: 0.9
    all:
      - id: loader-api-surface
      - id: objectives/anti-static/obfuscation/binary-metrics/shape::dominant-section
  - id: resource-backed-native-loader
    desc: Resource-backed native memory loader chain
    crit: suspicious
    conf: 0.92
    mbc: B0005
    attack: T1620
    all:
      - id: loader-api-surface
      - id: micro-behaviors/data/embedded/payload/resource::pe-resource-load-lock-chain
    any:
      - id: objectives/anti-analysis/timing/evasion::timing-delta-check
      - id: objectives/anti-analysis/environment-detect/runtime::environment-adaptive-behavior
      - id: micro-behaviors/time/timing/delay::sleep-dup
    downgrade:
      any:
        - id: metadata/package/versioning::pe-version-resource
        - id: metadata/binary/vendor::is-microsoft-named
