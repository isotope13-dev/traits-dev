defaults:
  platforms:
    - windows
  for:
    - pe
    - dll
traits:
  - id: service-run-export
    desc: DLL exports ServiceRun entry point
    crit: suspicious
    conf: 0.96
    if:
      type: export
      exact: ServiceRun

  - id: service-run-export-source
    desc: Source declares exported ServiceRun entry point
    crit: suspicious
    conf: 0.96
    for: [source]
    if:
      type: text
      regex: '(?is)__declspec\s*\(\s*dllexport\s*\).{0,80}\bServiceRun\s*\('

  - id: x64-manual-pe-section-mapper
    desc: x64 manual PE section mapper
    crit: notable
    conf: 0.92
    mbc: B0005
    attack: T1620
    arch: [x86-64]
    if:
      type: hex
      section: .text
      pattern: "48 63 40 3C 48 8B 8C 24 C0 00 00 00 48 03 C8 48 8B C1 48 89 44 24 28 48 8B 44 24 28 0F B7 40 14"
  - id: x64-manual-pe-section-copy-loop
    desc: x64 manual PE section copy loop
    crit: notable
    conf: 0.9
    mbc: B0005
    attack: T1620
    arch: [x86-64]
    if:
      type: hex
      section: .text
      pattern: "0F B7 40 06 39 44 24 24 7D 67 48 63 44 24 24 48 6B C0 28 48 8B 4C 24 38 8B 44 01 0C"
composite_rules:
  - id: x64-manual-pe-mapper
    desc: x64 manual PE mapper
    crit: suspicious
    conf: 0.95
    mbc: B0005
    attack: T1620
    all:
      - id: x64-manual-pe-section-mapper
      - id: x64-manual-pe-section-copy-loop
  - id: loader-api-surface
    desc: Native loader API surface pattern
    crit: notable
    conf: 0.86
    mbc: B0005
    attack: T1620
    all:
      - id: micro-behaviors/mem/alloc/virtual::virtual-alloc
      - id: micro-behaviors/dylib/load/runtime::load-library-a
      - id: micro-behaviors/dylib/lookup::get-proc-address-import
      - id: metadata/file/profile/memory/protection-api::virtual-protect
    any:
      - id: micro-behaviors/process/info/current::get-module-filename-ansi
      - id: micro-behaviors/fs/file/open::fopen
      - id: micro-behaviors/fs/read/file/handle::fread
    needs: 2
  # Pair the shared memory/loader API-set capability with an executable
  # overlay stub. Keep the capability definition in mem/combined; this
  # objective adds the payload context without duplicating its evidence.
  - id: overlay-payload-manual-map-loader
    desc: Overlay-payload stub maps its payload manually
    crit: hostile
    conf: 0.95
    mbc: B0005
    attack: T1620,T1027.009
    all:
      - id: micro-behaviors/mem/combined::pe-allocation-protection-resolution-api-set
      - id: metadata/binary/layout/overlay::unsigned-dominant-overlay-small-sections

  - id: native-loader-obfuscated
    desc: Native reflective loader with packer profile
    crit: suspicious
    conf: 0.9
    all:
      - id: loader-api-surface
      - id: metadata/binary/section/ratio::largest-section-at-least-90-percent
  - id: resource-backed-native-loader
    desc: Resource-backed native memory loader chain
    crit: suspicious
    conf: 0.92
    mbc: B0005
    attack: T1620
    all:
      - id: loader-api-surface
      - id: micro-behaviors/data/embedded/payload/resource::pe-resource-load-lock-chain
    any:
      - id: micro-behaviors/time/query::multiple-clock-api-references
      - id: objectives/anti-analysis/environment-detect/runtime::environment-adaptive-behavior
      - id: micro-behaviors/time/sleep/interval::sleep-dup
    downgrade:
      any:
        - id: metadata/binary/resource/identity::pe-version-resource
        - id: metadata/binary/vendor::is-microsoft-named
