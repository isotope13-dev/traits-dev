# Source-level crypter/loader patterns: PE resource stage → decode → manual map.
# Captures VIP Crypt-style Delphi/native loaders described in Insikt reporting
# without requiring a compiled PE sample.
defaults:
  platforms: [windows]
  for: [c, cpp]
  attack: T1027.009,T1620,T1140
  mbc: B0032,B0023

traits: []

composite_rules:
  - id: forged-peb-loader-module-registration
    desc: Registers a synthetic PE module in PEB loader lists
    crit: hostile
    conf: 0.995
    attack: T1620,T1036
    all:
      - id: micro-behaviors/os/module/load::ldr-entry-image-metadata-writes-source
      - id: micro-behaviors/os/module/load::ldr-entry-self-linked-hash-source
      - id: micro-behaviors/os/module/load::ldr-entry-dual-list-insertion-source
    near_bytes: 2200

  # File-staged variant: a hand-rolled cipher unpacks an encrypted image that
  # is manually mapped section-by-section and then linked into the PEB loader
  # lists, so the running module never appears as a loaded file. The cipher +
  # manual-map + loader-registration combination has no legitimate use.
  - id: rc4-unpacked-image-peb-registration
    desc: Registers RC4-unpacked mapped image in PEB
    crit: hostile
    conf: 0.97
    attack: T1620,T1036
    all:
      - id: micro-behaviors/crypto/symmetric/stream/rc4::source-rc4-implementation
      - id: micro-behaviors/mem/alloc/virtual::virtual-alloc-source
      - id: micro-behaviors/os/module/load::ldr-entry-dual-list-insertion-source
    any:
      - id: micro-behaviors/fs/file/section::asm-pe-header-manipulation-entrypoint
      - id: micro-behaviors/fs/file/section::asm-pe-header-manipulation-sizeofimage

  - id: source-resource-manual-pe-map
    desc: Resource stage manually maps PE image
    crit: hostile
    conf: 0.98
    attack: T1027.009,T1620
    all:
      - id: micro-behaviors/data/embedded/payload/resource::source-pe-resource-extraction
      - id: micro-behaviors/mem/alloc/virtual::virtual-alloc-source
      - id: micro-behaviors/fs/file/section::asm-pe-header-manipulation-entrypoint
      - id: micro-behaviors/fs/file/section::asm-pe-header-manipulation-sizeofimage
      - id: micro-behaviors/fs/file/section::asm-pe-header-manipulation-layout-sections
    any:
      - id: micro-behaviors/mem/protect/modify::virtual-protect-source-call
      - id: micro-behaviors/mem/protect/modify::virtual-protect
    near_bytes: 4000

  - id: source-resource-xor-manual-map
    desc: XOR-decodes resource then maps PE entry
    crit: hostile
    conf: 0.98
    attack: T1027.009,T1140,T1620
    all:
      - id: micro-behaviors/data/embedded/payload/resource::source-pe-resource-extraction
      - id: micro-behaviors/crypto/symmetric/xor/loop::indexed-xor-array-assignment
      - id: micro-behaviors/mem/alloc/virtual::virtual-alloc-source
      - id: micro-behaviors/fs/file/section::asm-pe-header-manipulation-entrypoint
    any:
      - id: micro-behaviors/mem/protect/modify::virtual-protect-source-call
      - id: micro-behaviors/mem/protect/modify::virtual-protect
    near_bytes: 4000
