# A reflective loader that fetches over WinHTTP, decrypts with BCrypt, parses
# PE headers in its own code and keeps a Run key: the whole fetch, decrypt,
# map and persist chain, with its memory APIs resolved by hash. A legitimate
# updater downloads a signed installer; it does not parse PE headers in
# memory or hide VirtualAlloc.
defaults:
  platforms: [windows]
  for: [pe]
  attack: T1620,T1105,T1547.001
composite_rules:
  - id: hash-resolved-winhttp-bcrypt-pe-mapper-with-run-key
    desc: Hash-resolved WinHTTP/BCrypt PE mapper with Run key
    crit: hostile
    conf: 0.88
    all:
      - id: objectives/anti-static/obfuscation/imports/api-hashing::pe-walk-hash-resolver-x64
      - id: micro-behaviors/data/format/pe-parser::inline-pe-signature-check
      - id: micro-behaviors/communications/http/client/winhttp::winhttp-query-headers
      - id: micro-behaviors/fs/path/library::bcrypt-dll-name
      - id: micro-behaviors/os/registry/keys/autostart::currentversion-run-key-path
    unless:
      - id: metadata/signed/platform/
