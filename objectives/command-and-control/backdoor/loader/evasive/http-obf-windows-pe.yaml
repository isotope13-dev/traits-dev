defaults:
  for:
  - pe
  - dll
  platforms:
  - windows
  attack: T1071.001
  crit: hostile
composite_rules:
- id: winhttp-crypto-admin-trojan
  desc: WinHTTP C2 with crypto, admin elevation, and anti-analysis
  conf: 0.95
  all:
  - id: micro-behaviors/communications/http/client/winhttp::winhttp-request-flow
  - id: micro-behaviors/crypto/cipher::bcrypt-cbc-mode-references
  - id: metadata/build/manifest::require-administrator
  - id: metadata/signed/trust-level::unsigned
  any:
  - id: micro-behaviors/crypto/kdf/algorithm::pbkdf2
  - id: objectives/anti-analysis/debugger-detect/combined-checks::debugger-check-with-guards
  - id: objectives/evasion/self-delete/file/script::module-path-delete
  - id: micro-behaviors/os/privilege/check::admin-sid-check
  needs: 2
  unless:
  - id: metadata/signed/platform/
  - id: metadata/binary/vendor::is-microsoft-named
- id: managed-anti-analysis-network-loader
  desc: Managed network loader with analysis evasion
  conf: 0.97
  attack: T1027,T1497.001,T1105
  for:
  - pe
  all:
  - id: micro-behaviors/communications/http/client/managed::httpwebrequest
  - id: micro-behaviors/os/virtualization/hypervisor::vm-vendor-hardware-references
  - id: micro-behaviors/metaprogramming/reflection::resolver-token-pair
  any:
  - id: micro-behaviors/crypto/decrypt::dotnet-create-decryptor
  - id: metadata/lang/source/naming/resource::dotnet-frombase64string-text
  - id: micro-behaviors/data/codec::dotnet-gzip-compression
  needs: 2
