---
defaults:
  for:
  - pe
  - dll
  platforms:
  - windows
  attack: T1071.001
composite_rules:
- id: evasive-wininet-backdoor
  desc: WinInet backdoor with anti-analysis and syscalls
  crit: hostile
  conf: 0.95
  all:
  - id: micro-behaviors/communications/http/client/wininet::wininet-http-api-cluster
  - id: objectives/anti-analysis/debugger-detect/combined-checks::win-basic
  any:
  - id: micro-behaviors/os/syscall/raw::windows-direct-syscall-profile
  - id: objectives/evasion/anti-av/syscall::windows-direct-syscalls
  - id: micro-behaviors/os/syscall/raw::direct-syscall-pattern
  - id: micro-behaviors/process/info/query::nt-query-information-process-text
  - id: objectives/anti-analysis/debugger-detect/combined-checks::win-comprehensive
  needs: 2
  downgrade:
    any:
    - id: metadata/binary/vendor::is-microsoft-named
    - id: well-known/app/security/defender/
    - id: metadata/binary/vendor::microsoft-corp-versioninfo
    - id: metadata/binary/resource/identity::pe-version-resource
    - id: metadata/signed/platform/
- id: winhttp-token-kill-chain
  desc: WinHTTP C2 with tokenized spawn and process-kill evasion
  crit: hostile
  conf: 0.93
  all:
  - id: micro-behaviors/communications/http/client/winhttp::winhttp-request-flow
  - id: micro-behaviors/os/privilege/token::token-spawn-api-chain
  - id: micro-behaviors/process/terminate/kill::security-name-enumeration-termination-api-profile
  any:
  - id: micro-behaviors/process/sync/mutex::mutex-instance-check
  - id: micro-behaviors/os/registry/access::registry-write-api-chain
  - id: micro-behaviors/data/embedded/payload/resource::pe-resource-full-extraction
  downgrade:
    any:
    - id: metadata/binary/resource/identity::pe-version-resource
