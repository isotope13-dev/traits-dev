defaults:
  for:
    - pe
    - dll
  platforms:
    - windows
  attack: T1071
composite_rules:
  - id: obfuscated-winsock-memory-loader
    desc: High-entropy Winsock-linked memory loader
    crit: hostile
    conf: 0.98
    attack: T1027,T1055,T1071
    all:
      - id: metadata/binary/layout/entropy::pe-high-entropy-allocation-pattern-clues
      - id: micro-behaviors/fs/path/system/library::ws2-32-dll-marker
    unless:
      - id: metadata/installer/product/
  - id: pe-winsock-evasive-loader
    desc: Winsock-linked PE with evasive loader profile
    crit: suspicious
    conf: 0.9
    unless:
      - id: metadata/binary/symbols/count::many-imports
    all:
      - id: micro-behaviors/fs/path/system/library::ws2-32-dll-marker
      - id: objectives/anti-analysis/debugger-detect/check::debugger-api
    any:
      - id: micro-behaviors/time/query::multiple-clock-api-references
      - id: objectives/anti-static/obfuscation/reflection/class::dynamic-load-pattern
      - id: metadata/binary/code/complexity::no-functions
    needs: 2
    downgrade:
      any:
        - id: metadata/filename/name-form::is-microsoft-named
        - id: well-known/app/security/defender/
        - id: metadata/vendor/identity::microsoft-corp-versioninfo
        - id: well-known/tool/reverse-engineering/windows-debugger/
        - id: metadata/signature/verified/signer::bitdefender-srl
        - id: metadata/binary/resource/identity::pe-version-resource
  - id: signed-mingw-winsock-process-stager
    desc: Signed MinGW Winsock process stager with inline PE checks
    crit: hostile
    conf: 0.94
    attack: T1105
    size_max: 131072
    all:
      - id: metadata/lang/compiler/native::mingw-runtime-marker
      - id: micro-behaviors/communications/socket/connect/attempt::winsock-client-lifecycle
      - id: micro-behaviors/process/create/exec::child-process-creation-evidence
      - id: micro-behaviors/fs/file/pe-inspect::inline-pe-signature-check
      - id: metadata/binary/layout/tls::pe-multiple-tls-callbacks
    any:
      - id: micro-behaviors/communications/ip/resolve::resolve-getaddrinfo-import
      - id: micro-behaviors/process/thread/create::create-thread
      - id: metadata/binary/resource/manifest::pe-version-and-manifest-only
    needs: 2
    unless:
      - id: metadata/installer/product/
  - id: signed-mingw-inline-pe-network-loader
    desc: Signed MinGW inline-PE network loader
    crit: hostile
    conf: 0.93
    attack: T1105
    size_max: 131072
    all:
      - id: signed-mingw-winsock-process-stager
      - id: micro-behaviors/communications/socket/connect/attempt::winsock-client-lifecycle
      - id: micro-behaviors/fs/file/pe-inspect::inline-pe-signature-check
    any:
      - id: micro-behaviors/process/create/exec::child-process-creation-evidence
      - id: micro-behaviors/communications/socket/connect/attempt::connect-api-name-reference
    unless:
      - id: metadata/installer/product/
  - id: pe-network-clock-tamper-anti-debug-loader
    desc: WinInet/Winsock PE loader with clock tampering and anti-debugging
    crit: hostile
    conf: 0.97
    attack: T1071.001,T1497.003
    mbc: B0030
    all:
      - id: micro-behaviors/communications/socket/init::wsa-startup
      - id: micro-behaviors/communications/http/client/wininet::internet-open
      - id: objectives/anti-analysis/debugger-detect/check::debugger-api
      - id: micro-behaviors/os/sysinfo/config::set-system-time-api
      - id: metadata/binary/layout/tls::pe-multiple-tls-callbacks
      - id: metadata/binary/instruction/sequence/unspecified::allocation-like-argument-patterns
    unless:
      - id: metadata/installer/product/
  - id: unsigned-debugger-gated-winsock-loader
    desc: Unsigned Winsock loader with debugger-gated PE
    crit: hostile
    conf: 0.97
    attack: T1071,T1620,T1622
    all:
      - id: metadata/signature/absent::unsigned-missing-signature-record
      - id: micro-behaviors/communications/socket/init::wsa-socket
      - id: micro-behaviors/communications/ip/resolve::resolve-getaddrinfo-import
      - id: micro-behaviors/process/debug/detect::is-debugger-present-import
      - id: micro-behaviors/data/embedded/payload/header::inline-pe-header-validation-sequence
    any:
      - id: metadata/binary/instruction/operand::x64-load-r8-r9-40
      - id: metadata/binary/instruction/operand::x64-load-r8-r9-20
    unless:
      - id: metadata/installer/product/
      - id: well-known/app/ai/coding-agent/cursor-sandbox::cursor-sandbox-context
      - id: metadata/binary/symbols/count::many-imports
  - id: unsigned-discovery-winsock-security-masquerade
    desc: Unsigned Winsock PE with host discovery and security-product masquerade
    crit: hostile
    conf: 0.98
    attack: T1071,T1036.005,T1082
    all:
      - id: metadata/signature/absent::unsigned-missing-signature-record
      - id: micro-behaviors/communications/socket/connect/attempt::winsock-client-symbol-lifecycle
      - id: micro-behaviors/os/sysinfo/hostname/query::get-computer-name
      - id: micro-behaviors/fs/enumerate/drives::logical-drive-enumeration
      - id: metadata/binary/resource/identity::pe-security-product-name
      - id: metadata/file/entropy::very-high-overall-entropy-75
    any:
      - id: micro-behaviors/os/registry/hive/restore::reg-restore-key
      - id: micro-behaviors/hardware/input/mouse::mouse-event
    needs: 1
    unless:
      - id: metadata/signature/verified/platform/
      - id: metadata/installer/product/
  - id: unpack-stub-binds-and-shellexecutes
    desc: Unpack stub binds a socket, reads adapter parameters, and ShellExecutes
    crit: hostile
    conf: 0.96
    attack: T1620,T1071,T1059
    near_bytes: 512
    all:
      - id: micro-behaviors/mem/alloc/virtual::virtual-alloc
      - id: micro-behaviors/mem/protect/modify/unspecified::virtual-protect-import
      - id: micro-behaviors/os/sysinfo/network::get-network-params
      - id: micro-behaviors/os/handler/open::shell-execute-a
      - id: micro-behaviors/communications/socket/bind/function::winsock-bind-import
    unless:
      - id: metadata/installer/product/
