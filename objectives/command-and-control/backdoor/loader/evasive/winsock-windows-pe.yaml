- id: unsigned-mingw-dual-role-winsock-implant
  desc: Unsigned MinGW Winsock implant with multi TLS callbacks
  crit: hostile
  conf: 0.95
  all:
  - id: metadata/lang/compiler/native::mingw-built-pe
  - id: metadata/signed/trust-level::unsigned
  - id: micro-behaviors/communications/socket/init::winsock-dual-role-lifecycle
  - id: metadata/binary/layout/tls::pe-multiple-tls-callbacks
  any:
  - id: micro-behaviors/communications/ip/resolve::resolve-getaddrinfo-import
  - id: micro-behaviors/process/create/thread::create-thread
  - id: micro-behaviors/communications/socket/init::select-api
  needs: 2
  unless:
  - id: metadata/package/versioning/scheme::pe-version-resource
  - id: metadata/signed/platform/
  - id: metadata/binary/installer/family/
  # Go's statically linked network runtime routinely exposes both client and
  # server Winsock lifecycles, getaddrinfo/select, worker threads, and several
  # TLS callbacks. A cgo build can also carry MinGW runtime markers, so this
  # shape does not by itself establish an implant in a recognized Go PE.
  - id: metadata/lang/compiler/systems::go-pe-binary-context
  # CPython's own `_socket` C extension (a MinGW-built, unsigned .pyd on
  # Windows) implements the winsock client/server dual-role lifecycle,
  # resolves addresses via getaddrinfo, and — like most compiled extension
  # modules — carries multiple TLS callbacks from the runtime; none of that
  # makes the standard library socket module an implant.
  - id: well-known/lib/runtime/scripted/python-runtime::python2-legacy-extension-module
  - id: metadata/lang/compiler/native::python-pyinit-export
  # Same shape again for OCaml: Facebook's Flow type checker (flow-bin's
  # bundled flow.exe) is MinGW-cross-compiled, unsigned, and ships no PE
  # version resource. Its documented client/server "flow server" background
  # daemon architecture legitimately does winsock dual-role socket lifecycle,
  # getaddrinfo resolution and worker-thread creation, and OCaml's statically
  # linked runtime carries the usual multi-TLS-callback CRT init shape.
  - id: metadata/lang/compiler/native::ocaml-native-runtime-marker
  # FFmpeg's community MinGW Windows static builds (distributed via npm's
  # @ffmpeg-installer/win32-x64 and equivalents) are unsigned by convention,
  # implement RTMP/HTTP/RTSP client AND server roles for real streaming
  # protocol support (winsock dual-role lifecycle, getaddrinfo), spawn
  # worker threads for its multi-threaded codec pipeline, and statically
  # link a large C runtime that carries the usual multi-TLS-callback shape.
  # The directory reference covers ffmpeg and the other recognized media
  # libraries that ship the same statically linked networked shape.
  - id: well-known/lib/media/
  # OpenOCD and hashcat are unsigned MinGW tools whose documented
  # client/server sockets are this same dual-role Winsock shape. Statically
  # linked TLS libraries (mbedtls) and npm-resolved JS-to-native toolchains
  # contribute the same shape and are grouped into the same exception.
  - id: dual-role-winsock-tool-context
- id: signed-mingw-winsock-process-stager
  desc: Signed MinGW Winsock process stager with inline PE checks
  crit: hostile
  conf: 0.94
  attack: T1105
  size_max: 131072
  all:
