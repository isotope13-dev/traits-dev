- id: dual-role-winsock-tool-context
  desc: Documented dual-role Winsock software
  crit: exception
  conf: 0.99
  any:
  - id: well-known/tool/reverse-engineering/openocd/
  - id: well-known/tool/offensive/hashcat::hashcat-usage-banner
  - id: well-known/dual-use/transfer/aria2::aria2c-basename
  # Statically linked mbedtls ships TLS client AND server states over plain
  # Winsock with getaddrinfo resolution, so a binary embedding its vendored
  # source paths shows a dual-role socket lifecycle without having one of
  # its own.
  - id: well-known/lib/crypto/mbedtls::vendored-source-path
  # npm-resolved JS-to-native toolchains cross compile with MinGW: unsigned
  # by convention, CRT multi-TLS-callbacks, and an event-loop runtime that
  # opens real sockets. The node_modules build provenance in the binary
  # separates them from hand-crafted implants.
  - id: metadata/binary/provenance/source::npm-native-toolchain-context
