defaults:
  platforms: [netscaler, appliance, unix]
  for: [kotlin, class, jar]
  attack: T1055

traits:
  - id: kotlin-payload-class-bytes
    desc: Kotlin payload class bytes
    crit: suspicious
    conf: 0.92
    for: [kotlin, class]
    if:
      type: text
      substr: Payload.class
    unless:
      - id: well-known/lib/data/snowflake-jdbc::jdbc-driver-context

composite_rules:
  - id: kotlin-classloader-payload-exec
    desc: Kotlin classloader payload exec
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/process/interpreter/runtime/jvm::java-isolated-classloader
      - id: kotlin-payload-class-bytes
    any:
      - id: micro-behaviors/metaprogramming/reflection/inspect/class::kotlin-reflective-method-execute
