defaults:
  platforms: [unix, windows]
  for:
  - java
  - class
traits:
- id: loadclassfrombytes-string
  desc: Custom byte-array class loader helper
  crit: component
  conf: 0.92
  for: [class, jar, zip]
  if:
    type: text
    exact: loadClassFromBytes
- id: gson-loader-string--ensuregsonloaded
  desc: Gson loader helper reference (ensureGsonLoaded)
  crit: component
  conf: 0.93
  for: [class, jar, zip]
  if:
    type: text
    word: ensureGsonLoaded
- id: gson-loader-string--gsonclassloader
  desc: Gson loader helper reference (gsonClassLoader)
  crit: component
  conf: 0.93
  for: [class, jar, zip]
  if:
    type: text
    word: gsonClassLoader
- id: gson-loader-string--loadgson
  desc: Gson loader helper reference (loadGson)
  crit: component
  conf: 0.93
  for: [class, jar, zip]
  if:
    type: text
    word: loadGson
- id: network-provider-helper-reference
  desc: JVM references a network provider helper
  crit: component
  conf: 0.88
  for: [class]
  if:
    type: import
    regex: '(^|/)NetworkProvider$'
- id: proxy-helper-reference
  desc: JVM references a proxy helper
  crit: component
  conf: 0.88
  for: [class]
  if:
    type: import
    regex: '(^|/)TotalProxy$'
composite_rules:
- id: gson-loader-string
  desc: Gson loader helper reference
  crit: component
  conf: 0.93
  for: [class, jar, zip]
  any:
  - id: gson-loader-string--ensuregsonloaded
  - id: gson-loader-string--gsonclassloader
  - id: gson-loader-string--loadgson
- id: context-classloader-handoff
  desc: Thread context classloader activation
  crit: notable
  conf: 0.92
  # Class-scoped on purpose: every leg is a per-class bytecode fact. Allowing
  # jar/zip lets an archive root pool legs from unrelated member jars, so any
  # large JVM distribution matches by coincidence.
  for: [class]
  unless:
  - id: well-known/lib/runtime/jruby::package-path
  - id: well-known/lib/runtime/jruby::module-marker
  - id: well-known/lib/runtime/jruby::jruby-home-path
  - id: well-known/lib/format/jline/
  - id: well-known/lib/development/scala-compiler
  - id: metadata/library/structure::vscode-language-server-library
  all:
  - type: trait
    id: micro-behaviors/process/thread/lifecycle::java-current-thread-reference
  - type: trait
    id: micro-behaviors/data/source/dynamic/reflect::java-context-classloader-setter
  - type: trait
    id: micro-behaviors/data/source/dynamic/reflect::java-urlclassloader-bytecode
  - type: trait
    id: micro-behaviors/data/source/dynamic/reflect::java-getdeclaredconstructor
  - type: trait
    id: micro-behaviors/data/source/dynamic/reflect::java-method-invoke-bytecode
  any:
  - type: trait
    id: micro-behaviors/data/source/dynamic/reflect::java-defineclass
  - type: trait
    id: micro-behaviors/data/embedded/payload/resource::java-getresourceasstream
  - type: trait
    id: micro-behaviors/data/source/dynamic/reflect::java-class-forname-bytecode
- id: encrypted-loader-payload
  desc: Encrypted Java loader payload
  crit: component
  conf: 0.92
  for: [jar, zip]
  unless:
  - id: well-known/lib/runtime/jruby::package-path
  - id: well-known/lib/runtime/jruby::module-marker
  - id: well-known/lib/runtime/jruby::jruby-home-path
  - id: well-known/lib/format/jline/
  all:
  - type: trait
    id: micro-behaviors/crypto/library/provider::jvm-security-class-ref
  - type: trait
    id: micro-behaviors/crypto/library/provider::secretkeyspec
  - type: trait
    id: micro-behaviors/crypto/library/provider::dofinal-method
- id: dynamic-bytecode-loader
  desc: Dynamic bytecode class definition
  crit: notable
  conf: 0.93
  # Class-scoped: defineClass + ClassLoader + getResourceAsStream must live in
  # one class to mean anything. At jar/zip scope the archive root pools these
  # from separate member jars and every JVM plugin bundle matches.
  for: [class, java_class]
  unless:
  - id: well-known/lib/runtime/jruby::package-path
  - id: well-known/lib/runtime/jruby::module-marker
  - id: well-known/lib/runtime/jruby::jruby-home-path
  - id: well-known/lib/runtime/openjdk::source-archive-path
  - id: metadata/library/structure::vscode-language-server-library
  all:
  - type: trait
    id: micro-behaviors/data/source/dynamic/reflect::jvm-classloader-class-ref
  - type: trait
    id: micro-behaviors/data/source/dynamic/reflect::java-defineclass
  - type: trait
    id: micro-behaviors/data/embedded/payload/resource::java-getresourceasstream
- id: in-memory-bytearray-classloader
  desc: In-memory byte-array ClassLoader defineClass
  crit: suspicious
  conf: 0.96
  mbc: B0032
  attack: T1620
  for: [class, java_class]
  unless:
  - id: well-known/lib/runtime/jruby::package-path
  - id: well-known/lib/runtime/jruby::module-marker
  - id: well-known/lib/runtime/jruby::jruby-home-path
  - id: well-known/lib/runtime/openjdk::source-archive-path
  - id: metadata/library/structure::vscode-language-server-library
  all:
  - type: trait
    id: dynamic-bytecode-loader
  - type: trait
    id: micro-behaviors/data/source/dynamic/reflect::java-get-system-classloader
  - type: trait
    id: micro-behaviors/data/compress/library::bytearrayinputstream
- id: system-parented-inmemory-classloader
  desc: System-parented in-memory loader with staging
  crit: hostile
  conf: 0.96
  mbc: B0032
  attack: T1620,T1129
  for: [class, java_class]
  near_bytes: 2048
  unless:
  - id: well-known/lib/runtime/jruby::package-path
  - id: well-known/lib/runtime/jruby::module-marker
  - id: well-known/lib/runtime/jruby::jruby-home-path
  - id: well-known/lib/runtime/openjdk::source-archive-path
  - id: metadata/library/structure::vscode-language-server-library
  all:
  - type: trait
    id: micro-behaviors/data/source/dynamic/reflect::jvm-classloader-class-ref
  - type: trait
    id: micro-behaviors/data/source/dynamic/reflect::java-defineclass
  - type: trait
    id: micro-behaviors/data/source/dynamic/reflect::java-get-system-classloader
  - type: trait
    id: micro-behaviors/data/compress/library::bytearrayinputstream
  - type: trait
    id: micro-behaviors/data/embedded/payload/resource::java-getresourceasstream
  any:
  - type: trait
    id: micro-behaviors/communications/http/lib/urlconnection::jvm-http-urlconnection-inputstream
  - type: trait
    id: micro-behaviors/process/create/spawn::java-processbuilder-start-bytecode
- id: map-backed-findclass-defineclass-loader
  desc: findClass defineClass loader with staging
  crit: hostile
  conf: 0.97
  mbc: B0032
  attack: T1620,T1129
  for: [class, java_class]
  near_bytes: 2048
  unless:
  - id: well-known/lib/runtime/jruby::package-path
  - id: well-known/lib/runtime/jruby::module-marker
  - id: well-known/lib/runtime/jruby::jruby-home-path
  - id: well-known/lib/runtime/openjdk::source-archive-path
  - id: metadata/library/structure::vscode-language-server-library
  all:
  - type: trait
    id: in-memory-bytearray-classloader
  - type: trait
    id: micro-behaviors/data/source/dynamic/reflect::java-findclass
  - type: trait
    id: micro-behaviors/data/source/dynamic/reflect::java-defineclass
  any:
  - type: trait
    id: micro-behaviors/communications/http/lib/urlconnection::jvm-http-urlconnection-inputstream
  - type: trait
    id: micro-behaviors/process/create/spawn::java-processbuilder-start-bytecode
- id: java-http-jar-bytecode-stage
  desc: Java downloads and stages JAR classes
  crit: hostile
  conf: 0.98
  mbc: B0032
  attack: T1105,T1129
  for: [class]
  all:
  - type: trait
    id: micro-behaviors/data/archive/library::jarinputstream-ref
  - type: trait
    id: micro-behaviors/data/archive/library::jarinputstream-entry-iteration
  - type: trait
    id: micro-behaviors/data/buffer::bytearrayoutputstream-ref
  - type: trait
    id: micro-behaviors/data/source/dynamic/reflect::java-loadclass
  - type: trait
    id: micro-behaviors/communications/http/lib/httpclient::java-httpclient-send
  - type: trait
    id: micro-behaviors/communications/http/lib/httpclient::java-byte-array-response-handler
- id: java-remote-jar-stream-classloader
  desc: Java streams a remote JAR into dynamic classes
  crit: hostile
  conf: 0.98
  mbc: B0032
  attack: T1105,T1129
  for: [class]
  all:
  - type: trait
    id: micro-behaviors/data/archive/library::jarinputstream-ref
  - type: trait
    id: micro-behaviors/data/archive/library::jarinputstream-entry-iteration
  - type: trait
    id: micro-behaviors/data/buffer::bytearrayoutputstream-ref
  - type: trait
    id: micro-behaviors/data/source/dynamic/reflect::java-loadclass
  - type: trait
    id: micro-behaviors/data/source/dynamic/reflect::java-reflection
  - type: trait
    id: network-provider-helper-reference
  - type: trait
    id: proxy-helper-reference
- id: minecraft-remote-token-classloader-stage
  desc: Fabric mod accesses Minecraft token before remote bytecode staging
  # The archive correlation is intentional: the mod entrypoint, token access,
  # network fetch, and byte-array loader are the package's staged chain.
  crit: hostile
  conf: 0.98
  mbc: B0032
  attack: "T1105, T1129, T1528"
  for: [jar, zip]
  scope: archive
  all:
  - type: trait
    id: metadata/package/config::fabric-mod-metadata
  - type: trait
    id: objectives/exfiltration/stealer/credential/token::minecraft-session-token-access
  - type: trait
    id: dynamic-bytecode-loader
  - type: trait
    id: micro-behaviors/communications/http/lib/urlconnection::jvm-http-urlconnection-inputstream
  - type: trait
    id: micro-behaviors/process/create/spawn::java-processbuilder-start-bytecode

- id: encrypted-in-memory-jar-loader
