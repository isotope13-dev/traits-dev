  # network fetch, and byte-array loader are the package's staged chain.
  # Archive correlation; avoid stacking with class-level hostiles.
  crit: suspicious
  conf: 0.98
  mbc: B0032
  attack: "T1105, T1129, T1528"
  for: [jar, zip]
  scope: archive
  all:
  - type: trait
    id: metadata/package/config::fabric-mod-metadata
