defaults:
  platforms: [unix, windows]
  for:
  - java
  - class
traits:
- id: loadclassfrombytes-string
  desc: Custom byte-array class loader helper
  crit: component
  conf: 0.92
  for: [class, jar, zip]
  if:
    type: text
    exact: loadClassFromBytes
- id: gson-loader-string--ensuregsonloaded
  desc: Gson loader helper reference (ensureGsonLoaded)
  crit: component
  conf: 0.93
  for: [class, jar, zip]
  if:
    type: text
    word: ensureGsonLoaded
- id: gson-loader-string--gsonclassloader
  desc: Gson loader helper reference (gsonClassLoader)
  crit: component
  conf: 0.93
  for: [class, jar, zip]
  if:
    type: text
    word: gsonClassLoader
- id: gson-loader-string--loadgson
  desc: Gson loader helper reference (loadGson)
  crit: component
  conf: 0.93
  for: [class, jar, zip]
  if:
    type: text
    word: loadGson
- id: network-provider-helper-reference
  desc: JVM references a network provider helper
  crit: component
  conf: 0.88
  for: [class]
  if:
    type: import
    regex: '(^|/)NetworkProvider$'
- id: proxy-helper-reference
  desc: JVM references a proxy helper
  crit: component
  conf: 0.88
  for: [class]
  if:
    type: import
    regex: '(^|/)TotalProxy$'
composite_rules:
- id: gson-loader-string
  desc: Gson loader helper reference
  crit: component
  conf: 0.93
  for: [class, jar, zip]
  any:
  - id: gson-loader-string--ensuregsonloaded
  - id: gson-loader-string--gsonclassloader
  - id: gson-loader-string--loadgson
- id: encrypted-loader-payload
  desc: Encrypted Java loader payload
  crit: component
  conf: 0.92
  for: [jar, zip]
  unless:
  - id: well-known/lib/runtime/jruby::package-path
