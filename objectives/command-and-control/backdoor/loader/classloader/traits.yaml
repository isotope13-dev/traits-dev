# A JAR that is never written to disk: the archive arrives as a byte[], is
# walked entry by entry through JarInputStream over a ByteArrayInputStream,
# each entry drained into a ByteArrayOutputStream, and a class from that map
# is then resolved and instantiated. The sibling loader composites here all
# require the fetch and the defineClass to sit in the SAME class; a stager
# that splits transport into a helper class (fetch -> byte[] -> this loader)
# matches none of them, which is the gap this pair covers. The shape alone is
# suspicious rather than hostile because in-memory plugin hosts and test
# harnesses do load jars this way.
- id: in-memory-jar-entry-classload
  desc: JAR read from memory and loaded as classes
  crit: suspicious
  conf: 0.93
  mbc: B0032
  attack: T1620,T1129
  for: [class, java_class]
  unless:
  - id: well-known/lib/runtime/jruby::package-path
  - id: well-known/lib/runtime/jruby::module-marker
  - id: well-known/lib/runtime/jruby::jruby-home-path
  - id: well-known/lib/runtime/openjdk::source-archive-path
  - id: well-known/lib/web/spring-boot::executable-jar
  - id: metadata/library/structure::vscode-language-server-library
  all:
  - type: trait
    id: micro-behaviors/data/archive/library::jarinputstream-ref
  - type: trait
    id: micro-behaviors/data/archive/library::jarinputstream-entry-iteration
  - type: trait
    id: micro-behaviors/data/buffer::bytearrayinputstream-ref
  - type: trait
    id: micro-behaviors/data/buffer::bytearrayoutputstream-ref
  - type: trait
    id: micro-behaviors/data/source/dynamic/reflect::java-loadclass
  - type: trait
    id: micro-behaviors/data/source/dynamic/reflect::java-newinstance

# The plugin host and the test harness spell their own constants out. A class
# that carries the same in-memory JAR loader while holding its own string
# constants as hex blobs of three different lengths is hiding what it loads and
# where it came from, which leaves no benign reading.
- id: obfuscated-in-memory-jar-loader
  desc: Obfuscated class loads a JAR held in memory
  # Pairs with memory-instantiation; keep one hostile chain.
  crit: suspicious
  conf: 0.96
  mbc: B0032
  attack: T1620,T1129,T1027
  for: [class, java_class]
  all:
  - type: trait
    id: in-memory-jar-entry-classload
  - type: trait
    id: metadata/file/encoded::multiple-hex-class-literals
