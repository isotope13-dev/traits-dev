---
defaults:
  for:
  - pe
  - dll
  platforms:
  - windows
  attack: T1071.001
composite_rules:
- id: wininet-c2-loader
  desc: WinInet HTTP loader with C2 and injection
  crit: hostile
  conf: 0.93
  all:
  - id: micro-behaviors/communications/http/client/wininet::internet-open
  - id: micro-behaviors/communications/http/client/wininet::internet-connect
  - id: objectives/command-and-control/infrastructure/ip-port::hardcoded-ipv4-port-dup
  any:
  - id: micro-behaviors/os/sysinfo/machine-id::machineguid
  - id: objectives/evasion/process/injection/toolkit::process-hollowing-context-hijack
  - id: objectives/anti-analysis/debugger-detect/combined-checks::win-anti-analysis-suite
  - id: objectives/persistence/login/startup/folder::startup-folder-shell-path-composition-chain
  needs: 2
  downgrade:
    any:
    - id: metadata/binary/vendor::is-microsoft-named
    - id: well-known/app/security/defender/
    - id: metadata/binary/vendor::microsoft-corp-versioninfo
- id: winhttp-ip-c2-loader
  desc: WinHTTP IP C2 loader profile
  crit: suspicious
  conf: 0.93
  all:
  - id: micro-behaviors/communications/http/client/winhttp::winhttp-read-data
  - id: micro-behaviors/communications/ip/endpoint::external-ipv4-port-binary
  any:
  - id: objectives/anti-analysis/debugger-detect/check::debugger-api
  - id: objectives/anti-analysis/timing/evasion::timing-anti-debug
  - id: micro-behaviors/communications/ipc/named-pipe::create-named-pipe
  - id: micro-behaviors/process/sync/mutex::open-mutex
  - id: metadata/binary/layout/entropy::high-entropy-data
  needs: 2
  downgrade:
    any:
    - id: metadata/binary/vendor::is-microsoft-named
    - id: metadata/binary/vendor::microsoft-corp-versioninfo
    - id: metadata/signed/platform/

- id: http-process-control-service-dll
  desc: DLL combines HTTP, process control, and service APIs
  crit: hostile
  conf: 0.99
  attack: T1071.001,T1055,T1134.001,T1543.003
  all:
  - id: metadata/binary/symbols/count::minimal-exports
  - id: micro-behaviors/communications/http/client/wininet::internet-open
  - id: micro-behaviors/communications/http/client/winhttp::winhttp-crack-url
  - id: micro-behaviors/mem/query::virtualquery-ex
  - id: micro-behaviors/process/debug/event::wait-for-debug-event
  - id: micro-behaviors/process/debug/event::continue-debug-event
  - id: micro-behaviors/os/privilege/token::set-thread-token
  - id: micro-behaviors/os/service/dispatch::register-service-handler
  - id: micro-behaviors/os/service/dispatch::set-service-status
  unless:
  - id: metadata/binary/installer/family/
  - id: metadata/binary/framework/
  - id: well-known/tool/reverse-engineering/

- id: api-hashed-winhttp-hardcoded-c2-stager
  desc: API-hashed WinHTTP stager with literal HTTPS C2 URL
  crit: hostile
  conf: 0.97
  attack: T1071.001,T1027.007
  size_max: 524288
  all:
  - id: micro-behaviors/communications/http/client/winhttp::winhttp-open
  - id: micro-behaviors/communications/http/client/winhttp::winhttp-connect
  - id: micro-behaviors/communications/http/client/winhttp::winhttp-send-request
  - id: micro-behaviors/communications/ip/literal::http-ip-url-text
  - id: objectives/anti-static/obfuscation/imports/api-hashing::ror13-peb-export-resolver-x64
  - id: metadata/signed/trust-level::unsigned-missing-signature-record

# WinINet twin of the WinHTTP stager above: an import-less PE resolves its
# APIs by ROR13 hash, loads wininet by bare name, and carries a literal IP
# and browser User-Agent for the stage request.
- id: api-hashed-wininet-hardcoded-ip-stager
  desc: API-hashed WinInet stager with literal IP C2
  crit: hostile
  conf: 0.95
  attack: T1071.001,T1027.007,T1105
  size_max: 524288
  all:
  - id: micro-behaviors/fs/path/library::wininet-bare-library-name
  - id: objectives/anti-static/obfuscation/imports/api-hashing::ror13-peb-export-resolver-x64
  - id: metadata/binary/symbols/count::no-imports
  - id: micro-behaviors/communications/ip/literal::external-ipv4-shaped-text-binary
  - id: micro-behaviors/communications/http/user-agent::browser-mozilla-5-0
  - id: metadata/signed/trust-level::unsigned-missing-signature-record
