defaults:
  platforms: [windows, unix]
  for: [jar]

composite_rules:
  - id: java-obfuscated-encrypted-socket-loader
    desc: Obfuscated Java encrypts and stages socket data
    crit: hostile
    conf: 0.98
    attack: T1071.001,T1573.001,T1105,T1027
    scope: archive
    all:
      - id: micro-behaviors/communications/http/lib/urlconnection::java-https-urlconnection-bytecode-import
      - id: micro-behaviors/communications/socket/create::java-socket-class-import
      - id: micro-behaviors/crypto/library/provider::secretkeyspec
      - id: micro-behaviors/fs/write/file/direct::jvm-fileoutputstream-bytecode
