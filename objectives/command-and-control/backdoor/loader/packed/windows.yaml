defaults:
  for: [pe, dll]
  platforms: [windows]
composite_rules:
- id: packed-registry-network-backdoor
  desc: Packed Windows backdoor capability profile
  crit: suspicious
  conf: 0.93
  attack: "T1071"
  all:
  - id: micro-behaviors/fs/path/system/library::ws2-32-dll-marker
  - id: objectives/anti-static/obfuscation/reflection/class::dynamic-load-pattern
  - id: micro-behaviors/os/registry/create::registry-create-key-api
  - id: objectives/anti-static/obfuscation/payload/section/layout::custom-packed-pe-layout
  any:
  - id: metadata/build/manifest::admin-manifest
  - id: micro-behaviors/process/control/affinity::affinity-mask-control
  - id: micro-behaviors/ui/window/station::window-station-query-chain
  downgrade:
    any:
    - id: well-known/lib/network/curl/
