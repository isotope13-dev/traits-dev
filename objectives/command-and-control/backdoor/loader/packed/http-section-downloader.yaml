# Packed HTTP downloader that maps its payload with NT section APIs. The unpacker
# keeps its section table random and checks the PEB for a debugger; the WinHTTP
# client reads the response that becomes the mapped image. The PEB/section-anomaly
# composite is the packer evidence and the WinHTTP read is the network leg; neither
# alone proves a loader, so the conjunction with NT section mapping is required.
defaults:
  platforms: [windows]
  for: [pe, dll]
  attack: T1105,T1027.002

traits:
  - id: nt-zw-map-view-section-import
    desc: Names NtMapViewOfSection or ZwMapViewOfSection
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(Nt|Zw)MapViewOfSection'

composite_rules:
  - id: packed-http-section-downloader
    desc: Packed PE with WinHTTP download and NT section-map payload loading
    crit: hostile
    conf: 0.9
    scope: file
    all:
      - id: objectives/anti-static/pack/section-anomaly::random-section-loader-with-peb-access-and-debugger-check
      - id: micro-behaviors/communications/http/client/winhttp::winhttp-read-data
      - id: objectives/command-and-control/backdoor/loader/packed::nt-zw-map-view-section-import
