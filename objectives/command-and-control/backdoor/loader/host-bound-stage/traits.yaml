defaults:
  platforms: [linux, macos, windows]
  for: [c, cpp, python, powershell, csharp, javascript, go, rust]
  attack: T1027.013,T1055,T1105,T1497.001

composite_rules:
  - id: host-bound-in-process-plugin
    desc: Host-bound stage loaded as an in-process plugin
    crit: hostile
    conf: 0.94
    attack: T1027.013,T1055,T1497.001
    all:
      - id: objectives/anti-analysis/fingerprinting/host-bound::host-derived-key-material
      - id: micro-behaviors/process/create/load/remote-code::dynamic-plugin-dispatch
    any:
      - id: micro-behaviors/data/compress/library::zlib-uncompress-call
      - id: micro-behaviors/data/compress/library::zlib-decompress-symbol
      - id: micro-behaviors/data/compress/library::powershell-data-deflate-decompress

  - id: host-bound-c2-plugin-stage
    desc: Host-bound compressed plugin stage received through a socket
    crit: hostile
    conf: 0.96
    attack: T1027.013,T1105,T1497.001
    all:
      - id: objectives/anti-analysis/fingerprinting/host-bound::host-derived-key-material
      - id: micro-behaviors/process/create/load/remote-code::dynamic-plugin-dispatch
      - id: objectives/command-and-control/backdoor/loader/host-bound-stage::socket-stage-receive
    any:
      - id: micro-behaviors/data/compress/library::zlib-uncompress-call
      - id: micro-behaviors/data/compress/library::zlib-decompress-symbol
      - id: micro-behaviors/data/compress/library::powershell-data-deflate-decompress

  - id: host-bound-executable-plugin-loader
    desc: Host-bound stage is decoded and transferred into executable memory
    crit: hostile
    conf: 0.97
    attack: T1027.013,T1055,T1497.001
    all:
      - id: objectives/anti-analysis/fingerprinting/host-bound::host-derived-key-material
      - id: micro-behaviors/process/create/load/remote-code::dynamic-plugin-dispatch
      - id: micro-behaviors/data/compress/library::zlib-uncompress-call
      - id: micro-behaviors/mem/protect/modify::virtual-protect
      - id: micro-behaviors/process/thread/create::create-thread-source

  - id: host-bound-persistent-plugin-loader
    desc: Host-bound plugin loader with persistence
    crit: hostile
    conf: 0.95
    attack: T1027.013,T1053.005,T1543.003,T1497.001
    all:
      - id: objectives/anti-analysis/fingerprinting/host-bound::host-derived-key-material
      - id: micro-behaviors/process/create/load/remote-code::dynamic-plugin-dispatch
      - id: micro-behaviors/data/compress/library::powershell-data-deflate-decompress
    any:
      - id: micro-behaviors/os/service/control::sc-create-command
      - id: objectives/persistence/login/scheduled-task/path::schtasks-create-user-writable-path

  - id: socket-stage-receive
    desc: Receives staged data from a socket
    crit: notable
    conf: 0.82
    any:
      - id: micro-behaviors/communications/socket/receive::recv-symbol
      - id: micro-behaviors/communications/socket/receive::socket-recv-call
