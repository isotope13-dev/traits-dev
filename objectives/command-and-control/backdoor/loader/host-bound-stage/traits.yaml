defaults:
  platforms: [linux, macos, windows]
  for: [c, cpp, python, powershell, csharp, javascript, go, rust]
  attack: T1027.013,T1055,T1105,T1497.001

composite_rules:
  - id: host-bound-in-process-plugin
    desc: Host-bound stage loaded as an in-process plugin
    crit: hostile
    conf: 0.94
    attack: T1027.013,T1055,T1497.001
    all:
      - id: objectives/anti-analysis/fingerprinting/host-bound::host-key-derivation
      - id: micro-behaviors/process/create/load/remote-code::dynamic-plugin-dispatch
    any:
      - id: micro-behaviors/data/compress/library::zlib-uncompress-call
      - id: micro-behaviors/data/compress/library::zlib-decompress-symbol
      - id: micro-behaviors/data/compress/library::powershell-data-deflate-decompress

  - id: host-bound-c2-plugin-stage
    desc: Host-bound compressed plugin stage received through a socket
    crit: hostile
    conf: 0.96
    attack: T1027.013,T1105,T1497.001
    all:
      - id: objectives/anti-analysis/fingerprinting/host-bound::host-key-derivation
      - id: micro-behaviors/process/create/load/remote-code::dynamic-plugin-dispatch
      # Neutral recv is referenced directly — do not re-emit it as a C2 notable.
      - id: micro-behaviors/communications/socket/receive::recv-symbol
    any:
      - id: micro-behaviors/data/compress/library::zlib-uncompress-call
      - id: micro-behaviors/data/compress/library::zlib-decompress-symbol
      - id: micro-behaviors/data/compress/library::powershell-data-deflate-decompress

  - id: host-bound-executable-plugin-loader
    desc: Host-bound stage is decoded and transferred into executable memory
    crit: hostile
    conf: 0.97
    attack: T1027.013,T1055,T1497.001
    all:
      - id: objectives/anti-analysis/fingerprinting/host-bound::host-key-derivation
      - id: micro-behaviors/process/create/load/remote-code::dynamic-plugin-dispatch
      - id: micro-behaviors/data/compress/library::zlib-uncompress-call
      - id: micro-behaviors/mem/protect/modify::virtual-protect
      - id: micro-behaviors/process/thread/create::create-thread-source

  - id: host-bound-persistent-plugin-loader
    desc: Host-bound plugin loader with persistence
    crit: hostile
    conf: 0.95
    attack: T1027.013,T1053.005,T1543.003,T1497.001
    all:
      - id: objectives/anti-analysis/fingerprinting/host-bound::host-key-derivation
      - id: micro-behaviors/process/create/load/remote-code::dynamic-plugin-dispatch
      - id: micro-behaviors/data/compress/library::powershell-data-deflate-decompress
    any:
      - id: micro-behaviors/os/service/control::sc-create-command
      - id: objectives/persistence/login/scheduled-task/path::schtasks-create-user-writable-path

  - id: host-bound-side-loaded-service-loader
    desc: Host-bound plugin loader installed through service DLL side-loading
    crit: hostile
    conf: 0.97
    attack: T1027.013,T1055,T1574.002,T1543.003,T1497.001
    all:
      - id: objectives/anti-analysis/fingerprinting/host-bound::host-key-derivation
      - id: micro-behaviors/process/create/load/remote-code::dynamic-plugin-dispatch
      - id: objectives/evasion/hijack-execution-flow/dll-hijacking::service-side-loaded-loader
    any:
      - id: micro-behaviors/data/compress/library::zlib-uncompress-call
      - id: micro-behaviors/data/compress/library::zlib-decompress-symbol
      - id: micro-behaviors/data/compress/library::powershell-data-deflate-decompress

  - id: host-bound-reflective-stage-loader
    desc: Host-bound payload executed from memory after export resolution
    crit: hostile
    conf: 0.98
    attack: T1027.013,T1055,T1129,T1497.001
    platforms: [windows]
    for: [c, cpp]
    all:
      - id: objectives/anti-analysis/fingerprinting/host-bound::host-key-derivation
      - id: micro-behaviors/mem/protect/modify::virtual-protect
      - id: micro-behaviors/process/thread/create::create-thread-source
    any:
      - id: micro-behaviors/dylib/load/source::load-library-source
      - id: micro-behaviors/os/module/load::get-proc-address-source-call

  - id: host-bound-socks-proxy
    desc: Host-bound implant exposing a SOCKS proxy
    crit: hostile
    conf: 0.97
    attack: T1027.013,T1090,T1497.001
    platforms: [windows, unix]
    for: [c, cpp]
    all:
      - id: objectives/anti-analysis/fingerprinting/host-bound::host-key-derivation
      - id: micro-behaviors/communications/proxy/socks::socks5-proxy-implementation

  - id: host-bound-service-registered-plugin
    desc: Host-bound compressed plugin loader registered as a Windows service
    crit: hostile
    conf: 0.96
    attack: T1027.013,T1055,T1543.003,T1497.001
    platforms: [windows]
    all:
      - id: objectives/anti-analysis/fingerprinting/host-bound::host-key-derivation
      - id: micro-behaviors/process/create/load/remote-code::dynamic-plugin-dispatch
      - id: objectives/persistence/system/service/registry-loader::service-registration-capability
    any:
      - id: micro-behaviors/data/compress/library::zlib-uncompress-call
      - id: micro-behaviors/data/compress/library::zlib-decompress-symbol
      - id: micro-behaviors/data/compress/library::powershell-data-deflate-decompress

  - id: host-bound-proxy-implant
    desc: Host-bound plugin loader with SOCKS proxy capability
    crit: hostile
    conf: 0.97
    attack: T1027.013,T1055,T1090,T1497.001
    all:
      - id: host-bound-in-process-plugin
    any:
      - id: micro-behaviors/communications/proxy/socks::socks5-proxy-implementation
      - id: micro-behaviors/communications/proxy/socks::socks
      - id: micro-behaviors/communications/proxy/tunnel::python-loopback-socket-bridge

  - id: host-bound-browser-credential-plugin
    desc: Host-bound plugin loader with browser credential-store access
    crit: hostile
    conf: 0.97
    attack: T1027.013,T1055,T1555.003,T1497.001
    all:
      - id: host-bound-in-process-plugin
    any:
      - id: objectives/credential-access/browser/chromium::logins-table
      - id: objectives/credential-access/browser/firefox::moz-logins-sql

  - id: host-bound-network-share-archive
    desc: Host-bound plugin loader stages data from a network share
    crit: hostile
    conf: 0.96
    attack: T1027.013,T1055,T1021.002,T1560.001,T1497.001
    all:
      - id: host-bound-in-process-plugin
      - id: objectives/collection/archive/stage::network-share-archive-staging
