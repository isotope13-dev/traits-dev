defaults:
  crit: hostile
  for:
  - pe
  - dll
  platforms:
  - windows
composite_rules:
- id: confuserex-managed-http-dropper-hidden-launch
  desc: ConfuserEx managed HTTP payload writer launches it without a window
  crit: hostile
  conf: 0.98
  attack: T1105,T1204.002,T1027.002
  all:
  - id: metadata/binary/framework::dotnet-metadata
  - id: micro-behaviors/communications/http/client/managed::httpwebrequest
  - id: micro-behaviors/communications/http/client/managed::getresponsestream
  - id: micro-behaviors/fs/write/file/full::dotnet-writeallbytes-token
  - id: micro-behaviors/process/create/hidden::dotnet-create-no-window
  - id: metadata/binary/symbols/name::dotnet-processstartinfo-name
  - id: micro-behaviors/process/create/spawn::process-start-member-token

- id: confuserex-managed-resource-dropper-hidden-launch
  desc: ConfuserEx managed resource payload is written and launched hidden
  crit: hostile
  conf: 0.97
  attack: T1105,T1204.002,T1027.002
  all:
  - id: metadata/binary/framework::dotnet-metadata
  - id: micro-behaviors/data/embedded/payload/resource::dotnet-resource-reader-access
  - id: micro-behaviors/fs/write/file/full::dotnet-writeallbytes-token
  - id: micro-behaviors/process/create/hidden::dotnet-create-no-window
  - id: metadata/binary/symbols/name::dotnet-processstartinfo-name
  - id: micro-behaviors/process/create/spawn::process-start-member-token

- id: c2-controlled-powershell-download-stager
  desc: C2 agent stages a payload through PowerShell download and execute
  crit: hostile
  conf: 0.99
  attack: T1105,T1059.001
  all:
  - id: micro-behaviors/communications/http/client/managed::webclient
  - id: micro-behaviors/process/argument/option::powershell-command-options-text
  - id: objectives/command-and-control/backdoor/rat/tasking::windows-native-c2-tasking-agent
  - id: micro-behaviors/process/create/shell/spawn::system-fn
  unless:
  - id: metadata/signed/platform/
- id: stack-built-http-memory-loader
  desc: Stack-built HTTP URL and payload executed from memory
  crit: hostile
  conf: 0.99
  attack: T1027,T1105,T1620
  all:
  - id: micro-behaviors/communications/http/url/build::stack-built-https-url-x64
  - id: micro-behaviors/dylib/lookup::get-proc-address
  - id: micro-behaviors/mem/alloc/virtual::virtualalloc-readwrite-commit-resolved-x64
  - id: micro-behaviors/mem/protect/modify::virtualprotect-executable-resolved-x64
  - id: micro-behaviors/process/create/thread::create-thread-buffer-resolved-x64-stack-args
