# PHP stager: fetch a script body with cURL, write it to a tmpfile(), recover
# that file's path, and include it. The fetched code runs with the web app's
# privileges and never lands under the document root. Package managers and
# updaters verify and install files; they do not include a raw HTTP body.
defaults:
  platforms: [unix, windows]
  for: [php]
composite_rules:
  - id: php-curl-body-tmpfile-include
    desc: Includes cURL-fetched PHP via a temp file
    crit: hostile
    conf: 0.95
    attack: T1105,T1059.004
    all:
      - id: micro-behaviors/communications/http/curl::exec
      - id: micro-behaviors/fs/write/file/handle::php-fwrite
      - id: micro-behaviors/fs/temp/file::php-tmpfile-meta-uri
      - id: micro-behaviors/process/interpreter/eval/source::php-variable-file-load
    near_bytes: 800
