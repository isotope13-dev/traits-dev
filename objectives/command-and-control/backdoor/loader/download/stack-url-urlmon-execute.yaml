defaults:
  platforms: [windows]
  for: [pe]
composite_rules:
  - id: stack-built-url-urlmon-download-execute
    desc: Stack-built URL fetched with URLMon then launched
    crit: hostile
    conf: 0.9
    attack: T1105,T1027,T1204.002
    all:
      - id: micro-behaviors/communications/url/construction/fragment::stack-built-http-scheme-register-p
      - id: micro-behaviors/communications/http/client/urlmon::url-download-to-file-import
      - id: micro-behaviors/process/create/shellexec::shell-execute-a
      - id: micro-behaviors/fs/path/temp::windows-temp-executable-path
    unless:
      - id: metadata/signed/platform/
