defaults:
  crit: hostile
  for:
    - powershell
  platforms:
    - windows

composite_rules:
  - id: powershell-download-decrypt-memory-loader
    desc: PowerShell downloads, decrypts, and executes payload from memory
    conf: 0.98
    attack: T1105,T1027,T1055.001,T1620
    all:
      - id: micro-behaviors/crypto/cipher/io::dotnet-cryptostream
      - id: micro-behaviors/crypto/decrypt/initialize::powershell-create-decryptor-call
      - id: micro-behaviors/process/inject/runtime/call::powershell-native-memory-entry-thread
    any:
      - id: micro-behaviors/communications/http/client/managed::downloaddata
      - id: micro-behaviors/communications/http/client/webclient::webclient-download-data
      - id: micro-behaviors/communications/http/lib/invoke-webrequest::invoke-webrequest
