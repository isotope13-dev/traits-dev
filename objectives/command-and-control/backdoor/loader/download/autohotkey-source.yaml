# A script that downloads from a URL held in a variable (taken from a C2
# response, as in Retadup's "download-<url>" command), saves it as an EXE and
# runs it. Fixed-URL updaters are out of scope: the URL must be variable.
defaults:
  platforms: [windows]
  for: [text]
  attack: T1105,T1204.002
composite_rules:
  - id: autohotkey-variable-url-download-run-exe
    desc: AutoHotkey downloads and runs remote EXE
    crit: hostile
    conf: 0.9
    near_lines: 8
    all:
      - id: micro-behaviors/communications/http/download/executable::autohotkey-variable-url-download-exe
      - id: micro-behaviors/process/create/exec::autohotkey-run-exe-path
