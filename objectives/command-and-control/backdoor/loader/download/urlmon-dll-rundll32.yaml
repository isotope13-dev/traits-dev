# Loader DLLs that fetch a second-stage DLL with URLDownloadToFile and hand
# it to rundll32 under an export name. Installers that download components
# load them in-process or run a signed setup EXE; rundll32 over a freshly
# downloaded DLL is a stager handoff.
defaults:
  platforms: [windows]
  for: [pe, dll]
composite_rules:
  - id: urlmon-file-download-evidence
    desc: URLMon download API or remote payload URL
    crit: notable
    conf: 0.9
    any:
      - id: micro-behaviors/communications/http/client/urlmon::url-download-to-file-import
      - id: micro-behaviors/communications/http/client/urlmon::url-download-to-file-str
      - id: micro-behaviors/communications/http/download/url::dll-url-reference-pe
      - id: micro-behaviors/communications/http/download/url::executable-url-reference-pe

  - id: urlmon-dll-download-rundll32-launch
    desc: Runs URLMon-downloaded DLL via rundll32
    crit: hostile
    conf: 0.93
    attack: T1105,T1218.011
    all:
      - id: urlmon-file-download-evidence
      - id: micro-behaviors/fs/path/application/executable::rundll32-executable-reference
      - id: micro-behaviors/process/create/exec::quoted-dll-export-argument
    any:
      - id: micro-behaviors/process/create/exec::create-process-a
      - id: micro-behaviors/process/create/system::shell-execute-ex-a
      - id: micro-behaviors/os/autorun/scheduled::task-scheduler-com-class-guid
    needs: 1
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/installer/family/
