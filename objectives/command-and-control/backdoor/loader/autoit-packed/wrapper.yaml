defaults:
  crit: suspicious
  for: [pe]
  platforms: [windows]
  attack: T1071
  mbc: C0002

composite_rules:
  - id: packed-autoit-socket-backdoor-wrapper
    desc: Packed AutoIt dual network wrapper
    conf: 0.95
    all:
      - id: objectives/anti-static/obfuscation/binary-metrics/section-names::packed-autoit-encrypted-resource
      - id: micro-behaviors/communications/socket/init::wsock32-dll-marker
      - id: micro-behaviors/process/create/spawn::create-process-w
    any:
      - id: micro-behaviors/communications/http/client/wininet::wininet-http-flow
      - id: micro-behaviors/os/network/share::wnet-share-connect-cycle
      - id: micro-behaviors/hardware/input/block::block-input-import
      - id: micro-behaviors/hardware/input/keyboard/poll::get-async-key-state
    needs: 2
  - id: packed-autoit-remote-injection-surveillance
    desc: Packed AutoIt remote-injection surveillance backdoor
    crit: hostile
    conf: 0.94
    attack: T1055,T1056.001,T1071
    all:
      - id: objectives/anti-static/obfuscation/binary-metrics/section-names::packed-autoit-encrypted-resource
      - id: micro-behaviors/process/inject/runtime/call::remote-process-memory-api-cluster
    any:
      - id: micro-behaviors/hardware/input/block::block-input-import
      - id: micro-behaviors/hardware/input/keyboard/poll::get-async-key-state
      - id: micro-behaviors/hardware/input/keyboard/label::keystroke-capture-string
      - id: micro-behaviors/communications/http/client/wininet::wininet-http-flow
      - id: micro-behaviors/os/network/share::wnet-share-connect-cycle
    needs: 2
  - id: packed-autoit-network-capable-wrapper
    desc: Packed AutoIt network-capable wrapper
    conf: 0.82
    all:
      - id: metadata/lang/compiled::autoit-compiled-script
      - id: micro-behaviors/fs/path/app-data::roaming-appdata-executable-path
    any:
      - id: micro-behaviors/communications/http/client/wininet::wininet-dll-name-reference
      - id: micro-behaviors/communications/socket/init::wsock32-dll-marker
      - id: micro-behaviors/os/network/share::wnet-add-connection
      - id: metadata/binary/section/ratio::dominant-section
      - id: metadata/hardening/memory::wx-section
      - id: metadata/binary/symbols/imports::few-import-count
    needs: 4
    downgrade:
      any:
        - id: metadata/binary/vendor::is-microsoft-named
