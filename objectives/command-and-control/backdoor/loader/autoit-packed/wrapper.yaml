defaults:
  crit: suspicious
  for: [pe]
  platforms: [windows]
  attack: T1071
  mbc: C0002

composite_rules:
  - id: packed-autoit-network-capable-wrapper
    desc: Packed AutoIt network-capable wrapper
    conf: 0.82
    all:
      - id: metadata/lang/compiled::autoit-compiled-script
      - id: micro-behaviors/fs/path/app-data::roaming-appdata-executable-path
    any:
      - id: micro-behaviors/fs/path/library::wininet-dll-name-reference
      - id: micro-behaviors/communications/socket/init::wsock32-dll-marker
      - id: micro-behaviors/os/network/share::wnet-add-connection
      - id: metadata/binary/section/ratio::dominant-section
      - id: metadata/binary/section/permission::wx-section
      - id: metadata/binary/symbols/imports::few-import-count
    needs: 4
    downgrade:
      any:
        - id: metadata/binary/vendor::is-microsoft-named
  - id: packed-upx-autoit-wininet-injector
    desc: UPX-packed AutoIt WinInet remote-memory injector
    crit: hostile
    conf: 0.96
    attack: T1055,T1071.001
    size_min: 500000
    all:
      - id: metadata/binary/section/label::upx-section-pair
      - id: metadata/binary/symbols/name::autoit-filecopy-api-name
      - id: metadata/binary/symbols/name::autoit-drivegetdrive-api-name
      - id: micro-behaviors/communications/http/client/wininet::wininet-http-flow
      - id: micro-behaviors/mem/write/arbitrary::write-process-memory-dup
      - id: micro-behaviors/mem/alloc/remote::virtual-alloc-ex
    any:
      - id: micro-behaviors/process/info/thread::resume-thread-import
      - id: micro-behaviors/hardware/input/block::block-input-import
      - id: micro-behaviors/process/inject/remote-thread::create-remote-thread
    needs: 1
    unless:
      - id: metadata/signed/platform/
      - id: well-known/tool/sysadmin/autoit::official-autoit-interpreter-runtime
