defaults:
  crit: suspicious
  for: [pe]
  platforms: [windows]
  attack: T1071
  mbc: C0002

composite_rules:
  - id: autoit-recovered-upx-overlay-loader
    desc: AutoIt reconstructed UPX loader with encrypted overlay
    crit: hostile
    conf: 0.97
    attack: T1027.002,T1071.001,T1055
    all:
      - id: metadata/lang/compiled::autoit-binary
      - id: metadata/binary/section/layout::recovered-upx-image-layout
      - id: metadata/binary/layout/entropy::high-entropy-overlay
      - id: micro-behaviors/mem/write/arbitrary::upx-autoit-remote-memory-api-profile
      - id: metadata/signature/absent::unsigned-missing-signature-record
    unless:
      - id: metadata/installer/product/

  - id: packed-autoit-network-capable-wrapper
    desc: Packed AutoIt network-capable wrapper
    conf: 0.82
    all:
      - id: metadata/lang/compiled::autoit-compiled-script
      - id: micro-behaviors/fs/path/app-data/platform::roaming-appdata-executable-path
    any:
      - id: micro-behaviors/fs/path/system/library::wininet-dll-name-reference
      - id: micro-behaviors/communications/socket/init::wsock32-dll-marker
      - id: micro-behaviors/network/share::wnet-add-connection
      - id: metadata/binary/section/ratio::dominant-section
      - id: metadata/binary/section/permission::wx-section
      - id: metadata/binary/symbols/imports::few-import-count
    needs: 4
    downgrade:
      any:
        - id: metadata/filename/name-form::is-microsoft-named
