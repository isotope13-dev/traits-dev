# A script that starts its own SSH daemon and then reverse-forwards a
# loopback port to a server whose host key it refuses to verify gives an
# outside operator an inbound shell through NAT and firewalls. Service
# packaging starts sshd/dropbear, but does not also open the reverse tunnel.
defaults:
  platforms: [unix]
  for: [shell]
  attack: T1572,T1021.004,T1133

composite_rules:
  - id: private-sshd-exposed-by-reverse-tunnel
    desc: Starts a private SSH daemon and exposes it via unverified reverse tunnel
    crit: hostile
    conf: 0.96
    near_bytes: 8192
    all:
      - id: micro-behaviors/os/service/remote::dropbear-server-args
      - id: micro-behaviors/communications/ssh/connect::remote-forward-to-loopback-service
      - id: micro-behaviors/communications/ssh/client::strict-host-disable
