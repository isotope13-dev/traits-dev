# Passwordless sudo paired with an authorized_keys append is a complete
# root persistence primitive regardless of the host language or delivery
# mechanism (webshell hook, cron payload, bare shell script).
defaults:
  platforms: [unix]
  for: [scripts, source]
  attack: T1548.003,T1098.004

composite_rules:
  - id: sudo-noninteractive-root-key-plant
    desc: Passwordless sudo plants an SSH key for root
    crit: hostile
    conf: 0.97
    near_bytes: 600
    all:
      - id: micro-behaviors/os/privilege/elevation::sudo-noninteractive-bash-text
      - id: micro-behaviors/communications/ssh/keys::authorized-keys-append-redirect
      - id: micro-behaviors/crypto/asymmetric/ssh::ed25519-public-key-literal
