defaults:
  for: [javascript]
  platforms: [unix, windows]
  attack: T1098.004,T1027

traits:
  - id: node-import-base64-authorized-key-overwrite
    desc: Import overwrites SSH keys with encoded key
    crit: hostile
    conf: 0.99
    if:
      type: tree-sitter
      query: |
        ((program
          (lexical_declaration (variable_declarator name: (identifier) @os value: (call_expression
            function: (identifier) @require_os arguments: (arguments (string (string_fragment) @os_module)))))
          (lexical_declaration (variable_declarator name: (identifier) @path value: (call_expression
            function: (identifier) @require_path arguments: (arguments (string (string_fragment) @path_module)))))
          (lexical_declaration (variable_declarator name: (identifier) @fs value: (member_expression
            object: (call_expression function: (identifier) @require_fs arguments: (arguments (string (string_fragment) @fs_module)))
            property: (property_identifier) @promises)))
          (lexical_declaration (variable_declarator name: (identifier) @flag value: (string (string_fragment) @initial)))
          (function_declaration name: (identifier) @fn body: (statement_block
            (lexical_declaration (variable_declarator name: (identifier) @key value: (string (string_fragment) @encoded)))
            (lexical_declaration (variable_declarator name: (identifier) @home value: (call_expression
              function: (member_expression object: (identifier) @os_use property: (property_identifier) @homedir))))
            (lexical_declaration (variable_declarator name: (identifier) @ssh value: (call_expression
              function: (member_expression object: (identifier) @path_use1 property: (property_identifier) @join1)
              arguments: (arguments (identifier) @home_use (string (string_fragment) @ssh_literal)))))
            (lexical_declaration (variable_declarator name: (identifier) @auth value: (call_expression
              function: (member_expression object: (identifier) @path_use2 property: (property_identifier) @join2)
              arguments: (arguments (identifier) @ssh_use (string (string_fragment) @auth_literal)))))
            (try_statement body: (statement_block (expression_statement (await_expression (call_expression
              function: (member_expression object: (identifier) @fs_use property: (property_identifier) @write)
              arguments: (arguments (identifier) @auth_use (binary_expression left: (call_expression
                function: (member_expression object: (call_expression function: (identifier) @atob
                  arguments: (arguments (identifier) @key_use)) property: (property_identifier) @trim)))))))))))
          (if_statement condition: (parenthesized_expression (binary_expression left: (identifier) @flag_use operator: "===" right: (string (string_fragment) @condition)))
            consequence: (statement_block (expression_statement (call_expression function: (identifier) @fn_use)))))
          (#eq? @require_os "require")
          (#eq? @os_module "os")
          (#eq? @require_path "require")
          (#eq? @path_module "path")
          (#eq? @require_fs "require")
          (#eq? @fs_module "fs")
          (#eq? @promises "promises")
          (#eq? @os @os_use)
          (#eq? @homedir "homedir")
          (#eq? @path @path_use1)
          (#eq? @path @path_use2)
          (#eq? @join1 "join")
          (#eq? @join2 "join")
          (#eq? @home @home_use)
          (#eq? @ssh_literal ".ssh")
          (#eq? @ssh @ssh_use)
          (#eq? @auth_literal "authorized_keys")
          (#eq? @fs @fs_use)
          (#eq? @write "writeFile")
          (#eq? @auth @auth_use)
          (#eq? @atob "atob")
          (#eq? @key @key_use)
          (#eq? @trim "trim")
          (#match? @encoded "^c3NoLXJzYS[A-Za-z0-9+/=]{21,}$")
          (#eq? @flag @flag_use)
          (#eq? @initial @condition)
          (#eq? @fn @fn_use))

  - id: node-import-plain-authorized-key-overwrite
    desc: Import overwrites SSH keys with public key
    crit: hostile
    conf: 0.99
    if:
      type: tree-sitter
      query: |
        ((program
          (lexical_declaration (variable_declarator name: (identifier) @os value: (call_expression
            function: (identifier) @require_os arguments: (arguments (string (string_fragment) @os_module)))))
          (lexical_declaration (variable_declarator name: (identifier) @path value: (call_expression
            function: (identifier) @require_path arguments: (arguments (string (string_fragment) @path_module)))))
          (lexical_declaration (variable_declarator name: (identifier) @fs value: (member_expression
            object: (call_expression function: (identifier) @require_fs arguments: (arguments (string (string_fragment) @fs_module)))
            property: (property_identifier) @promises)))
          (lexical_declaration (variable_declarator name: (identifier) @flag value: (string (string_fragment) @initial)))
          (function_declaration name: (identifier) @fn body: (statement_block
            (lexical_declaration (variable_declarator name: (identifier) @key value: (string (string_fragment) @encoded)))
            (lexical_declaration (variable_declarator name: (identifier) @home value: (call_expression
              function: (member_expression object: (identifier) @os_use property: (property_identifier) @homedir))))
            (lexical_declaration (variable_declarator name: (identifier) @ssh value: (call_expression
              function: (member_expression object: (identifier) @path_use1 property: (property_identifier) @join1)
              arguments: (arguments (identifier) @home_use (string (string_fragment) @ssh_literal)))))
            (lexical_declaration (variable_declarator name: (identifier) @auth value: (call_expression
              function: (member_expression object: (identifier) @path_use2 property: (property_identifier) @join2)
              arguments: (arguments (identifier) @ssh_use (string (string_fragment) @auth_literal)))))
            (try_statement body: (statement_block (expression_statement (await_expression (call_expression
              function: (member_expression object: (identifier) @fs_use property: (property_identifier) @write)
              arguments: (arguments (identifier) @auth_use (binary_expression left: (call_expression
                function: (member_expression object: (identifier) @key_use property: (property_identifier) @trim)))))))))))
          (if_statement condition: (parenthesized_expression (binary_expression left: (identifier) @flag_use operator: "===" right: (string (string_fragment) @condition)))
            consequence: (statement_block (expression_statement (call_expression function: (identifier) @fn_use)))))
          (#eq? @require_os "require")
          (#eq? @os_module "os")
          (#eq? @require_path "require")
          (#eq? @path_module "path")
          (#eq? @require_fs "require")
          (#eq? @fs_module "fs")
          (#eq? @promises "promises")
          (#eq? @os @os_use)
          (#eq? @homedir "homedir")
          (#eq? @path @path_use1)
          (#eq? @path @path_use2)
          (#eq? @join1 "join")
          (#eq? @join2 "join")
          (#eq? @home @home_use)
          (#eq? @ssh_literal ".ssh")
          (#eq? @ssh @ssh_use)
          (#eq? @auth_literal "authorized_keys")
          (#eq? @fs @fs_use)
          (#eq? @write "writeFile")
          (#eq? @auth @auth_use)
          (#eq? @key @key_use)
          (#eq? @trim "trim")
          (#match? @encoded "^ssh-rsa [A-Za-z0-9+/=]{20,}")
          (#eq? @flag @flag_use)
          (#eq? @initial @condition)
          (#eq? @fn @fn_use))
