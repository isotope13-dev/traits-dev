# PHP-side sibling of authorized-keys.yaml (shell/JS/Swift legs already
# exist): web application code — or, as in the trojanized Virtualizor update
# delivered over a BGP hijack (Aug 2026), malicious lines injected into a
# legitimate PHP core file — writing an attacker key straight into root's
# authorized_keys with file_put_contents().
defaults:
  platforms: [unix]
  for: [php]

composite_rules:
  - id: php-ssh-backdoor
    desc: PHP installs SSH key into authorized_keys
    crit: hostile
    attack: T1098.004
    conf: 0.97
    mbc: E1098
    all:
      - id: micro-behaviors/crypto/asymmetric/ssh::hardcoded-public-key
      - id: micro-behaviors/communications/ssh/keys::php-authorized-keys-write
