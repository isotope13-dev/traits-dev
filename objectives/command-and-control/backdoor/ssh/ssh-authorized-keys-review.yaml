defaults:
  crit: suspicious
  attack: T1098.004
  for: [scripts, binaries]
  platforms:
  - unix
  size_max: 104857600
composite_rules:
- id: locked-authorized-key-history-cover
  for: [shell]
  desc: Plants and locks an SSH key while clearing shell history
  crit: hostile
  conf: 0.99
  mbc: E1098
  near_lines: 10
  all:
  - id: micro-behaviors/communications/ssh/keys::shell-echo-authorized-key
  - id: micro-behaviors/fs/chmod/modify::chmod-removes-authorized-keys-write
  - id: objectives/evasion/indicator-removal/logs::history-clear
- id: hardcoded-root-authorized-key
  desc: Hardcoded root SSH login key
  crit: hostile
  conf: 0.99
  for: [shell]
  near_bytes: 4096
  all:
  - id: micro-behaviors/fs/path/public-key::ssh-authorized-keys
  - id: micro-behaviors/communications/ssh/keys::root-authorized-keys-echo-append
  - id: micro-behaviors/crypto/asymmetric/ssh::hardcoded-public-key
  # Installing a root key is also normal provisioning. Hostile requires
  # independently supported control, lockout, or evidence destruction.
  any:
  - id: objectives/command-and-control/channel/irc/bot::signed-shell-command-response
  - id: objectives/evasion/indicator-removal/logs::history-clear
  - id: objectives/command-and-control/backdoor/ssh::ssh-trust-store-eviction
- id: ssh-trust-store-reset
  for: [shell]
  desc: SSH trust store reset with key
  crit: hostile
  conf: 0.96
  mbc: E1098
  all:
  - id: micro-behaviors/fs/directory/create::reset-ssh-dir
  - id: micro-behaviors/communications/ssh/keys::authorized-keys-shell-write
  - id: micro-behaviors/crypto/asymmetric/ssh::hardcoded-public-key
  any:
  - id: micro-behaviors/fs/chmod/ssh::chmod-ssh-go-eq
  - id: micro-behaviors/fs/chmod/ssh::chmod-ssh-dir
  unless:
  - id: well-known/tool/sysadmin/automatedlab/
  - id: well-known/app/system/kiwi::kiwi-build-helper-context
  - id: well-known/tool/development/editor/qtcreator/
- id: js-embedded-ssh-key-install
  platforms: [unix, windows]
  for: [javascript, typescript]
  desc: JavaScript installs embedded SSH key
  crit: suspicious
  conf: 0.97
  all:
  - id: micro-behaviors/crypto/asymmetric/ssh::hardcoded-public-key
  any:
  - id: micro-behaviors/fs/write/file/target::node-writes-authorized-keys
  - id: micro-behaviors/communications/ssh/keys::node-authorized-keys-variable-write
  - id: micro-behaviors/fs/write/file/target::node-bound-authorized-keys-write
  # Prefer the more specific resolved-path finding for the same key install.
  unless:
  - id: objectives/command-and-control/backdoor/ssh::js-authorized-key-literal-backdoor
- id: cross-platform-sshd-key-backdoor
  platforms: [unix, windows]
  for: [scripts, source]
  desc: Plants SSH key and enables multi-OS sshd
  crit: hostile
  conf: 0.98
  attack: T1098.004,T1021.004
  mbc: E1098
  all:
  - id: micro-behaviors/crypto/asymmetric/ssh::hardcoded-public-key
  - id: micro-behaviors/communications/ssh/keys::authorized-keys-write-operation
  - id: micro-behaviors/os/service/remote::cross-platform-ssh-server-enable
- id: js-authorized-key-literal-backdoor
  desc: JavaScript installs embedded SSH key
  crit: hostile
  conf: 0.98
  mbc: E1098
  for: [javascript, typescript]
  all:
  - id: micro-behaviors/fs/write/file/target::js-authorized-keys-variable-write
  - id: micro-behaviors/crypto/asymmetric/ssh::hardcoded-public-key
  any:
  - id: micro-behaviors/fs/path/public-key::js-authorized-keys-path-variable
  - id: micro-behaviors/fs/path/public-key::js-authorized-keys-resolve-path
  - id: metadata/lang/source/naming/variable::js-authorized-keys-binder
  # Key literals are often declared at module top; path helpers and the write
  # sit hundreds of lines below in postinstall droppers.
  near_bytes: 4800
- id: js-variable-ssh-backdoor
  desc: JavaScript variable SSH key backdoor
  crit: hostile
  conf: 0.96
  mbc: E1098
  for: [javascript, typescript]
  all:
  - id: micro-behaviors/fs/path/public-key::js-authorized-keys-path-variable
  - id: micro-behaviors/fs/write/file/target::js-authorized-keys-variable-write
  - id: micro-behaviors/fs/path/secret-config::js-ssh-homedir-path
  - id: metadata/lang/source/naming/variable::js-public-key-variable
  any:
  - id: micro-behaviors/os/sysinfo/platform/branch::js-platform-linux-check
  - id: micro-behaviors/fs/chmod/modify::js-ssh-chmod-owner-only-mode-cooccurrence
- id: js-remote-authorized-keys-backdoor
  desc: Node installs remote SSH key into authorized_keys
  crit: hostile
  conf: 0.97
  mbc: E1098
  for: [javascript, typescript]
  all:
  - id: micro-behaviors/communications/http/url/api-path/resource::js-ssh-key-api-path
  - id: metadata/lang/source/naming/variable::js-authorized-keys-join-variable
  - id: micro-behaviors/communications/ssh/keys::node-authorized-keys-variable-write
  any:
  - id: micro-behaviors/os/firewall/ufw::javascript-ssh-allow-command
  - id: micro-behaviors/fs/chmod/modify::js-ssh-chmod-owner-only-mode-cooccurrence
- id: js-remote-response-authorized-keys-backdoor
  desc: Node appends remote data to authorized_keys
  crit: hostile
  conf: 0.98
  mbc: E1098
  for: [javascript, typescript]
  near_bytes: 1200
  all:
  - id: micro-behaviors/communications/http/get::axios-get-call
  - id: micro-behaviors/communications/http/response::axios-response-data-access
  - id: micro-behaviors/fs/write/file/append::append-file-sync
  - id: micro-behaviors/fs/path/public-key::js-authorized-keys-resolve-path
  - id: micro-behaviors/fs/path/secret-config::js-ssh-config-path-reference
  unless:
  - id: well-known/tool/development/editor/qtcreator/
# Eviction around a key install supplies intent: the script destroys existing
# trust and removes password/access-control fallbacks, unlike provisioning.
- id: ssh-trust-store-eviction
  desc: Wipes the SSH trust store before installing an authorized key
  crit: hostile
  conf: 0.97
  attack: T1098.004,T1531
  mbc: E1098
  all:
  - id: micro-behaviors/fs/directory/create::reset-ssh-dir
  any:
  - id: micro-behaviors/communications/ssh/keys::authorized-keys-shell-write
  - id: micro-behaviors/communications/ssh/keys::authorized-keys-append-redirect
  unless:
  - id: well-known/tool/sysadmin/automatedlab/
  - id: well-known/app/system/kiwi::kiwi-build-helper-context
  - id: well-known/tool/development/editor/qtcreator/

- id: ssh-key-install-with-operator-lockout
  desc: Installs an SSH key and revokes the operator's own access
  crit: hostile
  conf: 0.96
  attack: T1098.004,T1531
  all:
  - id: objectives/command-and-control/backdoor/ssh::ssh-trust-store-eviction
  any:
  - id: micro-behaviors/os/user/modify::chpasswd-command
  - id: micro-behaviors/os/firewall/tcp-wrappers::tcp-wrappers-deny-list-cleared

# Same technique expressed through a language runtime rather than a shell
# one-liner: rmtree the trust store, rebuild it, write the key back.
- id: python-ssh-trust-store-eviction
  desc: Python removes directories and appends SSH keys
  crit: suspicious
  conf: 0.96
  for: [python]
  mbc: E1098
  near_bytes: 1024
  all:
  - id: micro-behaviors/fs/delete/directory::shutil-rmtree
  - id: micro-behaviors/communications/ssh/keys::authorized-keys-path-construction
  - id: micro-behaviors/fs/file/io-mode::write-append-create-mode
- id: python-ssh-key-install-with-operator-lockout
  desc: Python replaces SSH trust and clears host access controls
  crit: hostile
  conf: 0.96
  for: [python]
  attack: T1098.004,T1562.004
  all:
  - id: objectives/command-and-control/backdoor/ssh::python-ssh-trust-store-eviction
  - id: micro-behaviors/os/firewall/tcp-wrappers::tcp-wrappers-deny-list-cleared

- id: ssh-key-immutable-persistence
  desc: Installs SSH key and sets file immutable flag
  crit: hostile
  conf: 0.98
  attack: T1098.004,T1222.002
  mbc: E1098
  # The lock must target the key install: without proximity, a chattr help
  # entry and an unrelated authorized_keys mention in opposite ends of a
  # large admin cheatsheet (e.g. cmdchamp) convict the whole file.
  near_bytes: 1024
  all:
  - id: micro-behaviors/fs/attributes/chattr::authorized-keys-set-immutable
  - id: micro-behaviors/communications/ssh/keys::hardcoded-authorized-key-write
