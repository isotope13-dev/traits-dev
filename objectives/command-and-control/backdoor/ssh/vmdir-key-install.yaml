defaults:
  for: [shell]
  platforms: [unix]

composite_rules:
  - id: vmdir-copy-with-ssh-key-install
    desc: Copies vCenter directory database and installs an embedded SSH key
    crit: hostile
    conf: 0.98
    attack: T1003,T1098.004
    near_lines: 10
    all:
      - id: objectives/credential-access/files/appliance::vmdir-database-copy
      - id: micro-behaviors/communications/ssh/keys::shell-embedded-key-redirect
