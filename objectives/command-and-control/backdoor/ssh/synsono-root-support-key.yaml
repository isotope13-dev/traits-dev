# The SynSono package carries one fixed support key and installs it as root's
# only SSH login during an explicitly confirmed image-preparation flow. The
# separate auto-restore composite treats reinstating the key after removal as
# hostile persistence.
defaults:
  platforms: [linux]
  attack: T1098.004
  mbc: E1098

traits:
  - id: synsono-support-key
    desc: SynSono support SSH key
    crit: notable
    for: [text]
    if:
      type: text
      exact: ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIIMZgJFz7mYw0MYHscq2dpFp5cSfSAPp146UbCrl59bU synsono-support

  - id: synsono-root-key-install
    desc: Installs support key for root SSH
    crit: notable
    for: [javascript]
    if:
      type: text
      regex: 'writeFileSafe\(\s*sys\(\s*["'']root/\.ssh/authorized_keys["'']\s*\)\s*,'
      exclude_comments: true

  - id: synsono-root-key-source
    desc: Reads the SynSono support key
    crit: notable
    for: [javascript]
    if:
      type: symbol
      kind: call
      exact: supportKey

  - id: synsono-root-key-only-ssh
    desc: Requires key authentication for root SSH
    crit: notable
    for: [javascript]
    if:
      type: text
      regex: 'PasswordAuthentication no[\s\S]{0,120}PermitRootLogin prohibit-password'

  - id: synsono-auto-infrastructure-apply
    desc: Queues infrastructure repair after startup
    crit: notable
    for: [javascript]
    if:
      type: text
      substr: 'setTimeout(autoApplyInfrastructure'

composite_rules:
  - id: synsono-root-support-ssh-access
    desc: Installs bundled key for root SSH access
    crit: suspicious
    conf: 0.95
    attack: T1098.004,T1021.004
    scope: package
    for: [npm, text, javascript]
    all:
      - id: synsono-support-key
      - id: synsono-root-key-install
      - id: synsono-root-key-source
      - id: synsono-root-key-only-ssh

  - id: synsono-root-lockout-with-key
    desc: Locks user passwords and installs root key
    crit: suspicious
    conf: 0.9
    attack: T1098.004,T1531
    scope: package
    for: [npm, javascript]
    all:
      - id: synsono-root-key-install
      - id: micro-behaviors/os/user/modify::account-password-lock
      - id: synsono-root-key-only-ssh

  - id: synsono-auto-restores-root-support-key
    desc: Infrastructure update restores removed root SSH access
    crit: hostile
    conf: 0.995
    attack: T1098.004,T1021.004
    scope: package
    for: [npm, shell, javascript, text]
    all:
      - id: conditional-root-ssh-key-restoration
      - id: synsono-root-support-ssh-access
      - id: synsono-auto-infrastructure-apply
