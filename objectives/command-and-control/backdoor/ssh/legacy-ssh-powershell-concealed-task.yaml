defaults:
  platforms:
  - windows
  for:
  - powershell
composite_rules:
- id: administrator-ssh-key-with-command-backdoor
  desc: Admin SSH key with concealed command backdoor
  crit: hostile
  conf: 0.98
  attack: T1098.004
  all:
  - id: micro-behaviors/fs/write/file/target::powershell-admin-authorized-key-append
  - id: micro-behaviors/communications/ssh/keys::ed25519-key-text-fragment
  - id: micro-behaviors/os/service/start::powershell-start-service-command
  - id: objectives/command-and-control/backdoor/dispatch/eval::scheduled-socket-command-backdoor-attempt
