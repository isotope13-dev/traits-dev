# Ebury's reported configuration uses process environment bytes as authorized
# keys. Match the directive and pseudo-file together, not the malware's name,
# installed library version, or collector socket. Numeric PIDs cover the same
# process-environment mechanism in other implementations.
defaults:
  platforms: [linux]
  for: [scripts, source, '!python']

traits:
  - id: authorized-keys-process-environment
    desc: SSH keys sourced from process environment
    crit: suspicious
    conf: 0.98
    if:
      type: literal
      regex: '(?im)^\s*AuthorizedKeysFile[ \t=]+/proc/(self|\d+)/environ\s*$'

  # Python docstrings following comments are not consistently tagged by the
  # literal extractor. Require assignment syntax there rather than relying on
  # exclude_docstrings. Keep scopes disjoint: one observation, one finding.
  - id: python-authorized-keys-process-environment
    desc: Assigned SSH keys use process environment
    crit: suspicious
    conf: 0.98
    for: [python]
    if:
      type: tree-sitter
      kind: assignment
      regex: '(?i)(["''\n]|\\n)\s*AuthorizedKeysFile[ \t=]+/proc/(self|\d+)/environ["''\s\\]'
