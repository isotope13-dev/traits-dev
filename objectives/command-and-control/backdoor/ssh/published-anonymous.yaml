defaults:
  platforms: [unix]
  for: [whl, python-sdist, python]
composite_rules:
  # The fixed collector supplies attack context missing from an ordinary
  # disposable SSH server. The gateway executes SSH command text and permits
  # authentication-free access; the tunnel exposes the gateway to that collector.
  - id: published-anonymous-ssh-shell
    desc: Anonymous SSH shell with collector publication
    crit: hostile
    conf: 0.99
    attack: T1021.004,T1059.004
    scope: archive
    all:
      - id: objectives/command-and-control/infrastructure/dead-drop::python-default-collector-ssh-access-report
      - id: micro-behaviors/communications/ssh/server::asyncssh-begin-auth-disabled-branch
      - id: micro-behaviors/communications/ssh/server::asyncssh-create-server-call
      - id: micro-behaviors/communications/ssh/forward::asyncssh-remote-port-forward
      - id: micro-behaviors/process/create/shell/command-string::python-session-command-to-shell-argv
      - id: micro-behaviors/process/tty/pty::python-openpty-call
