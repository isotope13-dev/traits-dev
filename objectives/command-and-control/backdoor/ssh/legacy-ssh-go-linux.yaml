defaults:
  platforms: [unix]
  for: [go]

composite_rules:
  - id: go-ssh-authorized-key-backdoor
    desc: Go SSH authorized key backdoor
    crit: hostile
    attack: T1098.004
    conf: 0.98
    near_bytes: 256
    all:
      - id: micro-behaviors/crypto/key/generate::go-rsa-generate-key
      - id: micro-behaviors/communications/ssh/keys::go-writes-ssh-rsa-prefix
      - id: micro-behaviors/fs/write/file/append::append-ssh-authorized-keys
