# WordPress plugin module that POSTs to a remote endpoint, evals the
# base64 PHP "runtime" in the reply, and runs operator commands.
defaults:
  platforms: [unix, windows]
  for: [php]
  attack: T1071.001,T1059.004

traits:
  - id: response-field-base64-decode
    desc: Decodes base64 field from a parsed reply
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: base64_decode\(\s*(\(string\)\s*)?\$\w+\[\s*'(code|hook|payload|cmd)'\s*\]

  - id: eval-wrapped-function-body
    desc: Evals received code wrapped in a function
    crit: suspicious
    conf: 0.93
    if:
      type: text
      regex: eval\(\s*'function\s+\w+\(\)\s*\{'\s*\.\s*\$\w+\s*\.

  - id: method-name-prefix-dispatch
    desc: Dispatches command names to act_ methods
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '''act_''\s*\.\s*\$\w+'

  - id: exec-command-with-stderr-capture
    desc: Runs command and captures output
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: exec\(\s*\$\w+\s*\.\s*' 2>&1'

  - id: wordpress-users-hash-dump
    desc: Selects WordPress user password hashes
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: user_login\s*,\s*user_email\s*,\s*user_pass

  - id: webshell-template-eval-get
    desc: Template evals GET input or runs system
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: eval\(\s*\\\$\w+\s*\)[\s\S]{0,60}system\(\s*\\\$\w+\s*\)

  - id: webshell-template-written-to-file
    desc: Writes PHP template string to a file
    crit: notable
    conf: 0.85
    if:
      type: text
      regex: file_put_contents\(\s*\$\w+\s*,\s*\$shell\s*\)

composite_rules:
  - id: php-remote-reply-runtime-eval
    desc: Evals base64 PHP code taken from a remote reply
    crit: hostile
    conf: 0.97
    near_bytes: 8192
    all:
      - id: response-field-base64-decode
      - id: eval-wrapped-function-body
      - id: micro-behaviors/process/interpreter/eval/constructed::php-strip-open-tags-before-eval
      - id: micro-behaviors/communications/http/curl/binding::exec

  - id: php-wordpress-webshell-dropper
    desc: Writes a GET-driven eval/system webshell to disk
    crit: hostile
    conf: 0.97
    near_bytes: 2048
    all:
      - id: webshell-template-eval-get
      - id: webshell-template-written-to-file

  - id: php-wordpress-implant-command-actions
    desc: Remote command names reach shell, DB dump and webshell actions
    crit: hostile
    conf: 0.97
    needs: 3
    all:
      - id: method-name-prefix-dispatch
    any:
      - id: exec-command-with-stderr-capture
      - id: wordpress-users-hash-dump
      - id: php-wordpress-webshell-dropper
      - id: eval-wrapped-function-body
