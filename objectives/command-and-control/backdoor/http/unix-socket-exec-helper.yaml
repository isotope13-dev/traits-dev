defaults:
  platforms: [unix]
  for: [elf, macho, c, cpp]
  attack: T1505.003,T1559,T1059.004
  mbc: B0030

composite_rules:
  # A web-server module (in-process with Nginx or a fork such as cwpsrv) that
  # forks a helper, talks to it over a connected/accepted socket, and runs
  # commands through popen with decrypted input. Stock Nginx forks workers and
  # uses socket channels but never pipes commands through popen; generic
  # servers (Go, Node, IDE language servers) carry fork/accept/connect/crypto
  # but no Nginx module registry. The module context and the popen pipe are
  # the legs that separate a request-driven command helper from ordinary
  # networked software.
  - id: server-forked-ipc-command-helper-backdoor
    desc: Nginx module forks popen helper over sockets
    crit: hostile
    conf: 0.95
    all:
      - id: micro-behaviors/communications/http/server/module/
      - id: micro-behaviors/process/create/fork/
      - id: micro-behaviors/communications/socket/connect/attempt::connect-symbol
      - id: micro-behaviors/communications/socket/accept/
      - id: micro-behaviors/crypto/decrypt/
    any:
      - id: metadata/binary/symbols/name/process::c-popen
      - id: micro-behaviors/process/create/subprocess/capture::c-popen-call
    unless:
      - id: micro-behaviors/communications/ipc/unix-socket::unix-socket-pty-host
