defaults:
  platforms: [unix]
  for: [elf, macho, c, cpp]
  attack: T1505.003,T1559,T1059.004
  mbc: B0030

composite_rules:
  - id: server-forked-ipc-command-helper-backdoor
    desc: HTTP server spawns local-socket command helper with encrypted response
    crit: hostile
    conf: 0.96
    all:
      - id: micro-behaviors/process/create/fork/
      - id: micro-behaviors/communications/socket/connect/attempt::connect-symbol
      - id: micro-behaviors/communications/socket/accept/
      - id: micro-behaviors/communications/http/
      - id: micro-behaviors/crypto/decrypt/
    any:
      - id: metadata/binary/symbols/name/process::c-popen
      - id: micro-behaviors/process/create/subprocess/capture::c-popen-call
      - id: micro-behaviors/process/create/shell/
    unless:
      - id: micro-behaviors/communications/ipc/unix-socket::unix-socket-pty-host
