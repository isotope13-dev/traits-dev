defaults:
  for:
    - "lua"
  platforms:
    - "unix"
    - "windows"
composite_rules:
  - id: "lua-command-poll-execute-report"
    desc: "Lua command polling, shell execution and results with secret upload"
    crit: "hostile"
    conf: 0.97
    all:
      - id: "micro-behaviors/communications/http/request/parameter::lua-command-result-http-body"
      - id: "micro-behaviors/communications/http/request/parameter::lua-command-route-http-request"
      - id: "micro-behaviors/process/create/shell/interpreter::lua-io-popen"
      - id: "objectives/exfiltration/stealer/credential/raw-file::lua-secret-file-http-upload"
