defaults:
  platforms: [windows]
  for: [javascript]
  attack: T1053.005,T1059.003,T1071.001

traits:
  - id: axios-response-command-dispatch
    desc: Axios response command passed to helper
    crit: notable
    conf: 0.99
    if:
      type: text
      regex: '(?s)axios\.post\s*\(.{0,300}res\.data\.command.{0,100}func\s*\(\s*res\.data\.command\s*\)'

  - id: exec-command-helper
    desc: Helper executes supplied shell command
    crit: notable
    conf: 0.99
    if:
      type: text
      regex: '(?s)func\s*=\s*\(cmd\)\s*=>\s*\{.{0,60}exec\s*\(\s*cmd\s*,'

  - id: scheduled-node-relaunch
    desc: Scheduled task relaunches Node script
    crit: notable
    conf: 0.99
    if:
      type: text
      regex: 'schtasks\s+/create[^\n]{0,150}/tr\s+["\x27]node\s+\$\{path\}'

composite_rules:
  - id: axios-scheduled-remote-command
    desc: Scheduled Node script executes HTTP response commands
    crit: hostile
    conf: 0.99
    scope: file
    all:
      - id: axios-response-command-dispatch
      - id: exec-command-helper
      - id: scheduled-node-relaunch
