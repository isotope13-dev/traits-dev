defaults:
  platforms: [windows]
  for: [pe, dll, c, cpp, go, rust, csharp, python]
  attack: T1071.001
  mbc: B0030

composite_rules:
  # A persistent Windows service that harvests computer name, active user, and
  # Active Directory domain/logon-server context and transmits HTTP requests.
  - id: windows-service-domain-recon-https-beacon
    desc: Windows service beacons host, user, and AD domain context over HTTP
    crit: hostile
    conf: 0.96
    attack: T1071.001,T1543.003
    all:
      - id: micro-behaviors/os/service/dispatch::windows-service-dispatch-any
      - id: micro-behaviors/os/sysinfo/hostname/query::host-hostname-lookup-any
      - id: micro-behaviors/os/user/lookup::host-username-lookup-any
      - id: micro-behaviors/os/sysinfo/hostname/query::windows-domain-logon-discovery
    any:
      - id: micro-behaviors/communications/http/client/winhttp::winhttp-send-request
      - id: micro-behaviors/communications/http/post
      - id: micro-behaviors/communications/http/request/client::http-get-or-post-operation
    unless:
      - id: metadata/signature/verified/
      - id: metadata/installer/product/

  # Multi-field implant check-in harvesting PID/path, OS build, computer, user,
  # and domain/logon-server identity alongside outbound HTTP transmission.
  - id: implant-full-host-ad-profile-checkin
    desc: Implant collects PID, OS, host, user, and AD profile for HTTP check-in
    crit: hostile
    conf: 0.97
    attack: T1071.001,T1082,T1033
    all:
      - id: micro-behaviors/process/info/current::self-process-or-module-query
      - id: micro-behaviors/os/sysinfo/platform/version::windows-os-version-query
      - id: micro-behaviors/os/sysinfo/hostname/query::host-hostname-lookup-any
      - id: micro-behaviors/os/user/lookup::host-username-lookup-any
      - id: micro-behaviors/os/sysinfo/hostname/query::windows-domain-logon-discovery
    any:
      - id: micro-behaviors/communications/http/client/winhttp::winhttp-send-request
      - id: micro-behaviors/communications/http/post
      - id: micro-behaviors/communications/http/request/client::http-get-or-post-operation
    unless:
      - id: metadata/signature/verified/
      - id: metadata/installer/product/
      # A compiled Chromium/Electron engine links every one of these host,
      # identity and HTTP APIs for its own runtime; it is not a check-in.
      # Electron hosts are product-named and lack browser policy strings, so
      # also accept the electron.exe PDB-backed engine context.
      - id: well-known/lib/runtime/scripted/electron::chromium-engine-marker-cluster
      - id: well-known/lib/runtime/scripted/electron::chromium-engine-capability-context
      # Perl runtime XS extensions (e.g. Win32.xs.dll) expose host, user, and
      # network APIs to Perl scripts as standard library bindings.
      - id: well-known/lib/runtime/scripted/perl-runtime::perl-xs-extension
      # RdViewer's client registers the host with its own auth/data service;
      # the profile is product enrolment, not a covert implant check-in.
      - id: well-known/dual-use/remote-admin/rdviewer::rdviewer-native-client
