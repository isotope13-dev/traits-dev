# A listener that terminates whichever process holds its port to bind a
# wildcard (all-interfaces) socket goes beyond local dev-server port
# cleanup: the killed owner did not consent, and the seized port is
# exposed to the network, not loopback.
defaults:
  for: [pe]
  platforms: [windows]
composite_rules:
  - id: wildcard-listener-port-owner-kill
    desc: Wildcard listener kills the process holding its port
    crit: suspicious
    conf: 0.8
    all:
      - id: micro-behaviors/process/terminate/kill::listener-port-owner-termination
      - id: micro-behaviors/communications/socket/bind/address::listening-all-interfaces-text
