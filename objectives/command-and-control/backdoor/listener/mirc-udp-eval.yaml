defaults:
  for: [mirc]
  platforms: [windows]
  attack: T1059,T1095

traits:
  - id: mirc-udp-socket-start
    desc: mIRC starts a UDP socket
    crit: notable
    conf: 0.96
    if:
      type: text
      regex: '(?i)\bsockudp\s+-[A-Za-z]+'
  - id: mirc-udp-read-variable-command
    desc: mIRC evaluates a received UDP variable
    crit: notable
    conf: 0.96
    if:
      type: text
      regex: '(?i)udpread[^\n]{0,100}sockread[^\n]{0,80}\|\s*\[\s*%[A-Za-z0-9_]+\s*\]'

composite_rules:
  - id: mirc-udp-received-command-eval
    desc: mIRC UDP listener evaluates received commands
    crit: hostile
    conf: 0.99
    all:
      - id: mirc-udp-socket-start
      - id: mirc-udp-read-variable-command
