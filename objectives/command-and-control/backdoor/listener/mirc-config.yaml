# Configuration evidence only: the referenced scripts are not inspected here.
defaults:
  for: [text]
  platforms: [windows]
composite_rules:
  - id: mirc-disguised-scripts-custom-dde-server
    desc: DLL-suffixed mIRC scripts with custom DDE command server
    crit: suspicious
    conf: 0.85
    all:
      - id: objectives/evasion/masquerade/extension-mismatch::mirc-dll-suffixed-script-config
      - id: micro-behaviors/data/config/schema::mirc-dde-server-enabled
      - id: micro-behaviors/data/config/schema::mirc-dde-custom-service-name
