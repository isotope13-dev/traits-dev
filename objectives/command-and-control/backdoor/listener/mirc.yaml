# A script that listens on a fixed port, accepts the inbound connection and
# acts on the socket's lines with local file operations (staging file bytes
# for send, deleting a named file, parsing the line into a command verb) is
# an operator-driven file backdoor: every leg is individually ordinary socket
# scripting, together they answer only to the remote peer.
defaults:
  platforms: [unix, windows]
  for: [mirc]
  attack: T1059
composite_rules:
  - id: mirc-listen-accept-file-backdoor
    desc: mIRC listener serves file commands remotely
    crit: hostile
    conf: 0.96
    all:
      - id: objectives/command-and-control/channel/irc/client::mirc-socklisten-command
      - id: objectives/command-and-control/channel/irc/client::mirc-sockaccept-command
    any:
      - id: objectives/command-and-control/channel/irc/client::mirc-bread-binary-transfer
      - id: objectives/command-and-control/channel/irc/client::mirc-remove-remote-path
      - id: objectives/command-and-control/channel/irc/client::mirc-gettok-command-parse
