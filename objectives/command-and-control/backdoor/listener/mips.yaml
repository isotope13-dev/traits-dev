# Statically linked MIPS implants lose every import and symbol, so a network
# listener survives only as the raw syscall instruction sequence (socket,
# bind, listen) and command execution only as a direct execve beside a shell
# path. A daemon that binds a listening socket and launches /bin/sh is a
# command-execution backdoor listener; on embedded Linux this shape belongs
# to bot payloads, not deployed services. BusyBox telnetd legitimately binds,
# listens and execs a shell, so the multi-call banner and exact basename are
# excluded -- an attacker-renamed copy of this payload matches neither.
defaults:
  platforms: [linux]
  for: [elf]
  arch: [mips]
  attack: T1059.004
  mbc: B0022

composite_rules:
  - id: mips-static-listener-shell-backdoor
    desc: Stripped MIPS binary listens and has raw execve with /bin/sh
    crit: hostile
    conf: 0.95
    all:
      - id: micro-behaviors/communications/socket/syscall::mips-socket-operation
      - id: micro-behaviors/communications/socket/syscall::mips-bind-operation
      - id: micro-behaviors/communications/socket/syscall::mips-listen-operation
      # The raw execve pair plus the shell path proves the listener launches
      # command interpreters; without it this is only a server.
      - id: micro-behaviors/fs/path/binary::bin-sh-path-reference
      # A symbol-free image: shipped daemons keep an import or symbol table,
      # while bot payloads arrive stripped to the syscall surface alone.
      - id: "metadata/binary/symbols/table::full-symbol-table-absent-or-empty"
    any:
      - id: micro-behaviors/os/syscall/raw::mips-o32-execve-syscall
      - id: micro-behaviors/os/syscall/raw::mips-o32-execve-syscall-le
    unless:
      - id: well-known/tool/sysadmin/busybox::busybox-banner
      - id: well-known/tool/sysadmin/busybox::busybox-binary-basename
    # The legs co-occur; nothing binds the accepted client to the shell.
    # Mirai-family scanners bind a local port and run /bin/sh only for their
    # download-and-run loader script. When that credential-spray loader is
    # present it explains the shape and is convicted by its own rule, so
    # step down rather than claim a second, unproven bind-shell backdoor.
    downgrade:
      any:
        - id: objectives/lateral-movement/brute-force/iot-creds::iot-credential-spray-command-injection-loader
