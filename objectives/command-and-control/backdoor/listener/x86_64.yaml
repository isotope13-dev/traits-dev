# Statically linked x86-64 implants with stripped section headers expose a
# network listener only as raw bind/listen syscalls and remote command
# execution as dup2 onto the accepted socket followed by execve. BusyBox
# telnetd legitimately binds, listens, and execs a shell, so its banner and
# basename are excluded.
defaults:
  platforms: [linux]
  for: [elf]
  arch: [x86-64]
  attack: T1059.004
  mbc: B0022

composite_rules:
  - id: x86_64-static-listener-exec-backdoor
    desc: Stripped static x86-64 listener redirects socket and execs
    crit: hostile
    conf: 0.95
    all:
      - id: micro-behaviors/communications/socket/syscall::linux-network-server
      - id: micro-behaviors/process/create/execv::syscall-execve-elf
      - id: "metadata/binary/symbols/table::full-symbol-table-absent-or-empty"
      - id: metadata/binary/linking/dynamic::elf-needed-libs-zero
    any:
      - id: micro-behaviors/process/create/shell/fd::x86-64-syscall-dup2
      - id: micro-behaviors/process/create/shell/fd::x86-64-syscall-dup2-sectionless
      - id: micro-behaviors/process/create/shell/fd::dup2-stdin-target-syscall
      - id: micro-behaviors/process/create/shell/fd::dup2-stdout-target-syscall
      - id: micro-behaviors/process/create/shell/fd::dup2-stderr-target-syscall
    needs: 1
    unless:
      - id: well-known/tool/sysadmin/busybox::busybox-banner
      - id: well-known/tool/sysadmin/busybox::busybox-binary-basename
    downgrade:
      any:
        - id: objectives/lateral-movement/brute-force/iot-creds::iot-credential-spray-command-injection-loader
