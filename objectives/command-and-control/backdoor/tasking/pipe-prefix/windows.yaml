# Pipe-delimited plaintext C2 tasking used by modular Windows RATs (Troy and
# similar). Keep atomics narrow: common tokens like LIST|/OPEN|/CMD| and bare
# CONNECTED appear in benign software; elevate only the distinctive cluster.
defaults:
  platforms: [windows]
  for: [c, cpp, pe, dll, csharp]
  attack: T1059,T1105,T1005
  mbc: B0030

traits:
  - id: zipdownload-pipe-prefix
    desc: ZIPDOWNLOAD pipe-delimited exfil command
    crit: suspicious
    conf: 0.97
    if:
      type: text
      regex: '(?i)\bZIPDOWNLOAD\|'

  - id: set-config-pipe-prefix
    desc: Uppercase SET_CONFIG tasking prefix
    crit: suspicious
    conf: 0.95
    if:
      type: text
      substr: "SET_CONFIG|"

  - id: pipe-delimited-transfer-prefix
    desc: Pipe-delimited file transfer tasking prefix
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)\b(DOWNLOAD|UPLOAD)\|'

  - id: http-connected-session-token
    desc: CONNECTED HTTP session handshake token
    crit: component
    conf: 0.85
    if:
      type: text
      # Exact uppercase handshake token; lowercase "connected" is common in
      # networking error strings and must not elevate.
      word: CONNECTED

composite_rules:
  - id: pipe-prefix-http-connected-tasking
    desc: Pipe-delimited RAT commands with CONNECTED handshake
    crit: hostile
    conf: 0.98
    attack: T1071.001,T1059
    near_bytes: 4096
    all:
      - id: zipdownload-pipe-prefix
      - id: http-connected-session-token
    any:
      - id: set-config-pipe-prefix
      - id: pipe-delimited-transfer-prefix
      - id: micro-behaviors/communications/http/get::wininet-http-client-src
      - id: micro-behaviors/communications/http/get::wininet-open-src
