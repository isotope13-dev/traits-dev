# Agent skills that authenticate against a remote service and publish executable
# programs over a token-bearing WebSocket. Each text atom is a capability; the
# archive composite identifies the combined remote-tasking behavior.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, markdown, text, documents]
  attack: T1059,T1071.001

traits:
  - id: run-route-path-field
    desc: Route field uses /run path
    crit: component
    conf: 0.9
    if:
      type: text
      # A bare filesystem path such as `mounted: "/run"` is not a remote
      # tasking endpoint.
      regex: '(?i)["''](path|route|endpoint)["'']\s*[:=]\s*["'']?/run\b'

  - id: run-url-path
    desc: URL uses /run path
    crit: component
    conf: 0.9
    if:
      type: text
      regex: '(?i)https?://[^"''`\s]{1,200}/run\b'

  - id: agent-program-field
    desc: Quoted JSON program field key
    crit: notable
    conf: 0.94
    if:
      type: text
      # Require the quoted JSON key, as the `visibility: "PUBLIC"` and
      # `type: "execute"` siblings in this family already do. Bare
      # `\bprogram\s*[:=]` matched ordinary English prose that ends a clause
      # on a colon ("...as an argument to the shell program: ..."), every YAML
      # config carrying a `program:` key (supervisord, service wrappers, CI),
      # and struct field declarations such as `program: String`.
      #
      # Case-insensitively it was still too loose: `"Program"` is the ESTree
      # root node type, so every parser / linter / transpiler bundle carries
      # it, and WebGL stacks (PixiJS, three.js, regl) export a `Program` shader
      # class that bundlers emit as `"Program": () => ...`. The tasking message
      # this leg belongs to spells the key lowercase and gives it a quoted
      # executable name, so require both.
      regex: '["'']program["'']\s*[:=]\s*["'']'

  - id: agent-public-visibility
    desc: Agent skill marks programs public
    crit: notable
    conf: 0.94
    if:
      type: text
      # The tasking protocol uses the exact uppercase sentinel. Lowercase
      # visibility fields are ordinary UI/document metadata (for example a
      # package's public/private record visibility) and are not agent messages.
      regex: '["'']visibility["'']\s*[:=]\s*["'']PUBLIC["'']'

  - id: agent-execute-message-type
    desc: Execute message type field
    crit: component
    conf: 0.94
    if:
      type: text
      regex: '(?i)\btype\s*[:=]\s*["'']execute["'']'

composite_rules:
  - id: run-endpoint-path-literal
    desc: Route or URL uses /run path
    crit: component
    conf: 0.9
    any:
      - id: run-route-path-field
      - id: run-url-path

  - id: agent-skill-credential-input
    desc: Agent skill credential-input marker
    crit: component
    conf: 0.94
    any:
      - id: micro-behaviors/communications/http/auth::email-password-input-marker
      - id: micro-behaviors/communications/http/auth::existing-bearer-token-input

  - id: agent-public-program-run-request
    desc: Agent skill posts an authenticated public program
    crit: notable
    conf: 0.95
    all:
      - id: run-endpoint-path-literal
      - id: micro-behaviors/communications/http/headers::bearer-token
      - id: agent-program-field
      - id: agent-public-visibility

  - id: agent-websocket-execute-program-message
    desc: Agent skill sends execute-program WebSocket data
    crit: notable
    conf: 0.95
    all:
      - id: micro-behaviors/communications/http/websocket::websocket-constructor-call
      - id: agent-execute-message-type
      - id: agent-program-field

  - id: agent-skill-credentialed-public-remote-tasking
    desc: Agent skill publishes executable remote tasks
    crit: hostile
    conf: 0.98
    for: [archives]
    scope: file
    all:
      - id: agent-skill-credential-input
      - id: agent-public-program-run-request
      - id: agent-websocket-execute-program-message
