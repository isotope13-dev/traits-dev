# Python WebSocket remote-desktop agent: a command table keyed by dotted
# operator verbs (terminal.exec, file.upload, screen.shot, ...). Each key is a
# quoted dictionary key, so prose and docs that merely mention a verb do not
# match. Only the combination of shell, file-transfer and screen verbs with a
# WebSocket channel is the remote-control claim.
defaults:
  platforms: [windows, unix]
  for: [python]
  attack: T1059.006,T1071.001
  mbc: B0022

traits:
  - id: python-dispatch-terminal-exec-key
    desc: Command table key runs terminal commands
    crit: notable
    conf: 0.93
    if:
      type: text
      regex: '["'']terminal\.exec(\.start)?["'']\s*:'

  - id: python-dispatch-file-transfer-keys
    desc: Command table keys upload or download files
    crit: notable
    conf: 0.93
    attack: T1105
    if:
      type: text
      regex: '["'']file\.(upload|download)(\.chunk)?["'']\s*:'

  - id: python-dispatch-screen-capture-keys
    desc: Command table keys capture or stream screen
    crit: notable
    conf: 0.93
    attack: T1113
    if:
      type: text
      regex: '["'']screen\.(shot|stream\.start)["'']\s*:'

  - id: python-dispatch-process-control-keys
    desc: Command table keys list or kill processes
    crit: notable
    conf: 0.9
    attack: T1057
    if:
      type: text
      regex: '["'']process\.(kill|list)["'']\s*:'

  - id: python-dispatch-blackout-keys
    desc: Command table keys blank victim screen
    crit: notable
    conf: 0.9
    attack: T1113
    if:
      type: text
      regex: '["''](privescreen|screen\.black)\.start["'']\s*:'

composite_rules:
  - id: python-websocket-remote-desktop-shell-agent
    desc: Python WebSocket agent dispatches shell, file and screen commands
    crit: hostile
    conf: 0.97
    attack: T1059.006,T1071.001,T1105,T1113
    all:
      - id: python-dispatch-terminal-exec-key
      - id: python-dispatch-file-transfer-keys
      - id: python-dispatch-screen-capture-keys
    any:
      - id: micro-behaviors/communications/http/websocket::ws-public-ipv4-endpoint
      - id: micro-behaviors/communications/websocket/library::python-websockets-client
      - id: python-dispatch-blackout-keys
      - id: python-dispatch-process-control-keys
    needs: 2
