# Behavioural form of the Python WebSocket RAT, independent of its command
# names: the agent connects out over WebSocket, authenticates and decrypts each
# task with an AEAD cipher keyed from a shared token, runs the task text
# through a shell, and reports host identity. The dotted-verb rule in
# python-dotted-dispatch.yaml misses variants that rename the verbs; this
# composite keys on the channel and execution mechanics instead.
defaults:
  platforms: [windows, unix]
  for: [python]
  attack: T1059.006,T1071.001,T1573.001
  mbc: B0022

composite_rules:
  - id: python-encrypted-websocket-shell-agent
    desc: Python agent decrypts WebSocket tasks and runs them in a shell
    crit: hostile
    conf: 0.95
    all:
      - id: micro-behaviors/communications/websocket/library::websockets-connect-call
      - id: micro-behaviors/crypto/decrypt/transform/call::python-decrypt-and-verify
      - id: micro-behaviors/process/create/shell/variable-command::python-variable-command-through-shell
      - id: micro-behaviors/os/sysinfo/profile::python-host-information-query-combination
    unless:
      - id: metadata/package/testing/presence/harness::verified-python-test-file
