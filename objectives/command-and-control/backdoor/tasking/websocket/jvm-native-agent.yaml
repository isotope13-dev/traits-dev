defaults:
  platforms: [windows]
  for: [jar, zip, java_class, pe, dll]
  attack: T1071.001,T1555.003

composite_rules:
  - id: jvm-websocket-credential-agent
    desc: WebSocket JVM agent combines Chromium credential recovery and task execution
    crit: hostile
    conf: 0.98
    scope: outer
    all:
      - id: micro-behaviors/communications/websocket/library::java-websocket-client
      - id: micro-behaviors/communications/websocket/library::javax-websocket-client-endpoint
      - id: micro-behaviors/communications/websocket/server::add-message-handler
      - id: metadata/binary/symbols/name/process::java-processbuilder-bytecode
      - id: micro-behaviors/os/application/target/browser::chromium-brand-target-table
      - id: micro-behaviors/fs/path/app-data/browser::chromium-user-data-directory-text
      - id: metadata/binary/symbols/name/token/security::decryptdata-name-reference
      - id: micro-behaviors/os/com/instantiation::co-create-instance
      - id: micro-behaviors/os/com/invoke::co-set-proxy-blanket
      - id: micro-behaviors/communications/ipc/named-pipe::wait-named-pipe
      - id: micro-behaviors/communications/ipc/pipe::peek-named-pipe
