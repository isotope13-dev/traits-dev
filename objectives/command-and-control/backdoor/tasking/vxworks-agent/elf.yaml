# Rust VxWorks agents keep a crate-level vxworks_agent module that
# pairs a safety_gate with gather_system_info reconnaissance.
# Hex matchers cover relocatable objects whose strings live in
# mangled symbols rather than a parsed string table.
defaults:
  platforms: [unix, appliance]
  for: [elf]
  attack: T1059
  mbc: B0030

traits:
  - id: vxworks-agent-module
    desc: Names a vxworks_agent module
    crit: notable
    conf: 0.96
    if:
      type: hex
      pattern: 76 78 77 6f 72 6b 73 5f 61 67 65 6e 74
      offset_range: [0, null]
  - id: safety-gate-symbol
    desc: Safety-gate implant gate symbol
    crit: notable
    conf: 0.93
    if:
      type: hex
      pattern: 73 61 66 65 74 79 5f 67 61 74 65
      offset_range: [0, null]
  - id: gather-system-info-text
    desc: Gather-system-info recon symbol
    crit: notable
    conf: 0.9
    if:
      type: hex
      pattern: 67 61 74 68 65 72 5f 73 79 73 74 65 6d 5f 69 6e 66 6f
      offset_range: [0, null]

composite_rules:
  - id: vxworks-agent-safety-gate
    desc: VxWorks agent with safety gate
    crit: hostile
    conf: 0.97
    all:
      - id: vxworks-agent-module
      - id: safety-gate-symbol
  - id: vxworks-agent-sysinfo
    desc: VxWorks agent gathers system info
    crit: hostile
    conf: 0.96
    all:
      - id: vxworks-agent-module
      - id: gather-system-info-text
  - id: vxworks-safety-sysinfo
    desc: Safety gate with system-info gather
    crit: hostile
    conf: 0.95
    all:
      - id: safety-gate-symbol
      - id: gather-system-info-text
