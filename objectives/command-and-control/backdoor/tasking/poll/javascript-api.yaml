defaults:
  platforms: [unix, appliance, windows]
  for: [javascript, typescript]
  attack: T1059

traits:
  - id: js-command-array-dispatch
    desc: JS dispatches command array
    crit: suspicious
    conf: 0.94
    if:
      type: text
      regex: 'Array\.isArray\(.{0,80}\.commands\)[\s\S]{0,260}executeCommand\(.{0,80}\.command'

composite_rules:
  - id: js-api-command-tasking
    desc: JS API command tasking
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/communications/http/endpoints::api-command-path
      - id: micro-behaviors/communications/http/endpoints::api-response-path
    any:
      - id: micro-behaviors/process/create/shell/bridge::js-execsync-cmd-arg
      - id: micro-behaviors/process/create/shell/bridge::js-compiled-execsync-cmd-arg

  - id: js-command-poll-exec
    desc: JS command poll exec
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/communications/http/endpoints::api-command-path
      - id: micro-behaviors/communications/http/endpoints::api-response-path
      - id: micro-behaviors/process/create/shell/bridge::js-execsync-cmd-arg

  - id: js-api-commands-tasking
    desc: JS API commands tasking
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/communications/http/endpoints::api-commands-path
      - id: js-command-array-dispatch
      - id: micro-behaviors/process/create/shell/bridge::js-execsync-cmd-arg
    any:
      - id: objectives/command-and-control/infrastructure/keywords::node-command-results-post
      - id: micro-behaviors/communications/http/request/client::node-http-request-stream-body

  # Compact Node HTTP tasking: poll /commands, POST /results, run via bash -c.
  # Covers npm install agents and standalone implants that skip /api/ prefixes.
  - id: js-commands-results-bash-tasking
    desc: JS polls /commands and runs results via bash
    crit: hostile
    conf: 0.98
    attack: T1059.004,T1071.001,T1105
    all:
      - id: micro-behaviors/communications/http/endpoints::commands-endpoint-path
      - id: micro-behaviors/communications/http/endpoints::result-endpoint-path
      - id: micro-behaviors/process/create/shell/bridge::js-spawnsync-bash-command
    any:
      - id: objectives/command-and-control/beacon/network/json::c2-command-result-endpoints
      - id: micro-behaviors/communications/ip/literal::javascript-external-ipv4-url

  # XOR-decoded Bearer secret plus /cmd C2 and bash -c — credential-backed
  # remote shell agent shape reused across npm postinstall implant families.
  - id: js-xor-bearer-cmd-bash-agent
    desc: XOR Bearer token drives /cmd bash agent
    crit: hostile
    conf: 0.98
    attack: T1059.004,T1071.001,T1140,T1552
    all:
      - id: micro-behaviors/data/decode/xor::buffer-from-hex-byte-xor
      - id: micro-behaviors/communications/http/request/client::bearer-authorization-prefix
      - id: objectives/command-and-control/beacon/network/json::c2-command-result-endpoints
      - id: micro-behaviors/process/create/shell/bridge::js-spawnsync-bash-command
