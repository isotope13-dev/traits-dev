defaults:
  platforms: [unix, windows]
  for: [ruby]
  attack: T1071.001

composite_rules:
  - id: ruby-beacon-exfil-c2
    desc: Ruby beacon and exfil C2 client
    crit: hostile
    conf: 0.96
    all:
      - id: micro-behaviors/communications/http/url/api-path::api-v1-beacon-endpoint
      - id: micro-behaviors/communications/http/url/api-path::api-v1-exfil-endpoint
    any:
      - id: micro-behaviors/communications/http/post::ruby-octet-stream-post
      - id: micro-behaviors/communications/http/lib/netlib::net-http
