    desc: JSON POST client with beacon/exfil routes
    crit: hostile
    conf: 0.96
    all:
      - id: micro-behaviors/communications/http/url/api-path::api-v1-beacon-endpoint
      - id: micro-behaviors/communications/http/url/api-path::api-v1-exfil-endpoint
      - id: micro-behaviors/communications/http/request/json::ruby-json-body-request-send
