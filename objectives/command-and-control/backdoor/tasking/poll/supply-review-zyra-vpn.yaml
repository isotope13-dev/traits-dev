defaults:
  platforms: [windows]
  for: [pe]
  size_max: 16777216

composite_rules:
  - id: update-tasking-updater-name-clues
    desc: Tasking fields and updater name clues
    crit: suspicious
    conf: 0.99
    all:
      - id: micro-behaviors/communications/http/url/api-path/telemetry::service-update-log-task-endpoint-clues
      - id: objectives/command-and-control/backdoor/tasking/poll::polled-tasking-json-cluster
      - id: micro-behaviors/fs/path/updater::updater-exe-name
  - id: update-tasking-updater-message-clues
    desc: Tasking fields and updater status clues
    crit: suspicious
    conf: 0.99
    all:
      - id: micro-behaviors/os/application/update::check-update-endpoint-reference
      - id: micro-behaviors/communications/url/query/selection::service-system-id-poll-param
      - id: objectives/command-and-control/backdoor/tasking/poll::polled-tasking-json-cluster
      - id: micro-behaviors/os/application/update::service-update-launched-msg
