  - go
composite_rules:
- id: c2-file-tasking-channel
  desc: Encrypted file tasking with command execution
  crit: suspicious
  conf: 0.94
  all:
  - id: micro-behaviors/communications/http/request/route::file-transfer-routes
  - id: micro-behaviors/data/format/json::file-task-path-fields
  - id: micro-behaviors/data/format/json::command-state-fields
  - id: micro-behaviors/process/create/command-handler::go-execute-command-routine
  - id: micro-behaviors/data/serialize/json::json-ciphertext-field
  - id: micro-behaviors/data/serialize/json::json-iv-field-any
  - id: micro-behaviors/crypto/symmetric/aes/library::go-cbc-mode-string
