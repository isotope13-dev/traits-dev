# MQTT agents that expose paired file upload and download task handlers. Both
# topic directions and data-dependent filesystem access are required so a
# normal client publishing local files to a fixed telemetry topic does not
# satisfy the rule.
defaults:
  platforms: [windows, unix]
  for: [python]
  attack: "T1071,T1105"
  mbc: "B0030,C0001"

traits:
  - id: file-upload-task-topic
    desc: File upload task topic
    crit: notable
    conf: 0.96
    if:
      type: string_literal
      exact: /file/upload

  - id: file-download-task-topic
    desc: File download task topic
    crit: notable
    conf: 0.96
    if:
      type: string_literal
      exact: /file/download

  - id: python-message-path-binary-write
    desc: Writes binary data to message path
    crit: notable
    conf: 0.97
    if:
      type: text
      regex: 'open\s*\(\s*command\[["'']path["'']\]\s*,\s*["'']wb["'']\s*\)'

  - id: python-message-path-binary-read
    desc: Reads binary data from message path
    crit: notable
    conf: 0.97
    if:
      type: text
      regex: 'open\s*\(\s*command\[["'']path["'']\]\s*,\s*["'']rb["'']\s*\)'

composite_rules:
  - id: mqtt-file-upload-download-topic-pair
    desc: Paired file transfer task topics
    crit: suspicious
    conf: 0.98
    all:
      - id: file-upload-task-topic
      - id: file-download-task-topic

  - id: python-message-path-binary-read-write
    desc: Message path used for binary transfer
    crit: suspicious
    conf: 0.98
    near_bytes: 1000
    all:
      - id: python-message-path-binary-write
      - id: python-message-path-binary-read

  - id: python-mqtt-remote-file-manager
    desc: MQTT tasks access operator-selected files
    crit: hostile
    conf: 0.99
    scope: file
    all:
      - id: micro-behaviors/communications/messaging/mqtt::paho-mqtt-subscriber
      - id: mqtt-file-upload-download-topic-pair
      - id: python-message-path-binary-read-write
    unless:
      - id: metadata/package/testing/presence/harness::verified-python-test-file
