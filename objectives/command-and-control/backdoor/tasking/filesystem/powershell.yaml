# A watched-file command queue is a local asynchronous tasking channel: another
# component writes commands to the input file and retrieves captured results.
defaults:
  platforms: [windows]
  for: [powershell]
  attack: T1059.001
  mbc: B0030

composite_rules:
  - id: powershell-file-watch-command-loop
    desc: PowerShell watch loop executes file-delivered commands and captures results
    crit: hostile
    conf: 0.99
    attack: T1059.001,T1105
    all:
      - id: micro-behaviors/data/control-flow/loop::powershell-infinite-loop
      - id: micro-behaviors/fs/watch/monitor::powershell-last-write-time-poll
      - id: micro-behaviors/fs/read/file::get-content-raw
      - id: micro-behaviors/process/interpreter/runtime/eval::powershell-iex-text
      - id: micro-behaviors/fs/write/file/redirect::powershell-all-stream-append-redirect
      - id: micro-behaviors/process/lifecycle/supervise::watchdog-delay
    near_lines: 32
