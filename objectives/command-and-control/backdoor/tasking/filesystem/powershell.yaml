# A watched-file command queue is a local asynchronous tasking channel: another
# component writes commands to the input file and retrieves captured results.
defaults:
  platforms: [windows]
  for: [powershell]
  attack: T1059.001
  mbc: B0030

composite_rules:
  - id: powershell-file-watch-command-loop
    desc: PowerShell watch loop executes file-delivered commands and captures results
    crit: hostile
    conf: 0.99
    attack: T1059.001,T1105
    all:
      - id: micro-behaviors/data/control-flow/loop/unconditional::infinite-loop-header
      - id: micro-behaviors/fs/watch::powershell-last-write-time-poll
      - id: micro-behaviors/fs/read/file/content/unspecified::get-content-raw
      - id: micro-behaviors/process/interpreter/eval/powershell::powershell-iex-text
      - id: micro-behaviors/fs/write/file/redirect::powershell-all-stream-append-redirect
      - id: micro-behaviors/time/sleep/interval::ps-start-sleep
    near_lines: 32

  - id: powershell-hash-polled-file-command-watchdog
    desc: Polls a command script by file hash, evaluates updates, and writes output
    crit: hostile
    conf: 0.98
    attack: T1059.001,T1105
    all:
      - id: micro-behaviors/crypto/hash/digest/unnamed-algorithm::powershell-get-filehash
      - id: micro-behaviors/fs/read/file/content/unspecified::get-content
      - id: micro-behaviors/process/interpreter/eval/powershell::powershell-iex-call
      - id: micro-behaviors/fs/write/file/full/string::powershell-set-content-call
      - id: micro-behaviors/time/sleep/interval::ps-start-sleep
