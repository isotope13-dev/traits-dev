defaults:
  platforms:
  - windows
  - unix
  for:
  - go
  - elf
  - pe
  - macho
  attack: T1071.001,T1059,T1105
  mbc: B0030
composite_rules:
- id: go-decoded-file-task-execute
  for:
  - go
  desc: Go decodes writes and executes a file payload
  crit: suspicious
  conf: 0.96
  near_bytes: 200
  all:
  - id: micro-behaviors/data/decode/base64::go-base64-decode-method
  - id: micro-behaviors/fs/write/file/full::go-os-writefile
  - id: micro-behaviors/process/create/exec::go-exec-command-call
- id: go-websocket-upload-execute-tasking
  for:
  - go
  desc: Go WebSocket executes uploaded content
  crit: hostile
  conf: 0.99
  all:
  - id: micro-behaviors/communications/websocket/send::go-websocket-json-write-call
  - id: micro-behaviors/data/format/json::file-content-field-cluster
  - id: micro-behaviors/process/argument/subcommand::file-operation-command-roster
  - id: go-decoded-file-task-execute
- id: go-websocket-file-collection-control
  for:
  - go
  desc: Go WebSocket browses and collects files
  crit: hostile
  conf: 0.98
  attack: T1071.001,T1083,T1119
  all:
  - id: micro-behaviors/communications/websocket/send::go-websocket-json-write-call
  - id: micro-behaviors/data/format/json::file-content-field-cluster
  - id: micro-behaviors/process/argument/subcommand::file-operation-command-roster
  - id: micro-behaviors/fs/directory/traverse::filepath-walk
