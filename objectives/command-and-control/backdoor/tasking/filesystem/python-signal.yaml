defaults:
  platforms: [unix, windows]
  for: [whl, python-sdist]
  attack: T1105
  mbc: B0022

traits:
  - id: python-handler-upload-download-pair
    desc: Remote handler upload/download pair
    crit: notable
    conf: 0.96
    for: [python]
    if:
      type: text
      regex: 'def\s+_handle_upload[\s\S]{0,1000}def\s+_handle_download'
  - id: python-handler-writes-requested-path
    desc: Handler writes requested path bytes
    crit: notable
    conf: 0.96
    for: [python]
    if:
      type: text
      regex: 'Path\s*\(\s*remote_path\s*\)[\s\S]{0,180}write_bytes'
  - id: python-handler-reads-requested-path
    desc: Handler reads requested path bytes
    crit: notable
    conf: 0.96
    for: [python]
    if:
      type: text
      regex: 'Path\s*\(\s*remote_path\s*\)[\s\S]{0,180}read_bytes'

composite_rules:
  - id: python-signal-remote-file-tasking
    desc: Python signal agent provides remote file tasking
    crit: hostile
    conf: 0.99
    scope: archive
    attack: T1105,T1071.001
    all:
      - id: objectives/command-and-control/backdoor/rat/multi::python-signal-client-import
      - id: objectives/command-and-control/backdoor/rat/multi::python-remote-command-handler-import
      - id: objectives/command-and-control/backdoor/rat/multi::python-file-transfer-protocol
      - id: objectives/command-and-control/backdoor/rat/multi::python-file-transfer-mode
      - id: objectives/command-and-control/backdoor/rat/multi::python-transfer-helper-import
      - id: micro-behaviors/fs/write/file/direct::python-pathlib-write-bytes
    unless:
      - id: well-known/tool/offensive/darkglitch::published-package-summary

  - id: python-remote-command-file-transfer-agent
    desc: Remote command handler transfers requested files
    crit: hostile
    conf: 0.99
    for: [python]
    attack: T1059.006,T1105
    all:
      - id: objectives/command-and-control/backdoor/rat/multi::python-command-dispatch-handler-cluster
      - id: python-handler-upload-download-pair
      - id: python-handler-writes-requested-path
      - id: python-handler-reads-requested-path
