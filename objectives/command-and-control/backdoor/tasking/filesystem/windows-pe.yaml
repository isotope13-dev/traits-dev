# Native RAT agents often expose their controller-driven file channel through
# adjacent status messages. Requiring download, execution, and controller
# upload language distinguishes remote tasking from an ordinary transfer UI.
defaults:
  platforms: [windows]
  for: [pe, dll]
  size_max: 10485760

traits:
- id: controller-file-upload-status
  desc: File upload to remote controller status
  crit: notable
  conf: 0.98
  if:
    type: text
    exact: "Uploading file to Controller:"
- id: remote-file-download-status
  desc: Remote file download status
  crit: component
  conf: 0.9
  if:
    type: text
    exact: "Downloading file:"
- id: downloaded-file-execution-status
  desc: Downloaded file execution status
  crit: component
  conf: 0.94
  if:
    type: text
    exact: "Executing file:"

composite_rules:
- id: native-controller-file-tasking
  desc: Native RAT downloads, executes, and uploads controller-tasked files
  crit: hostile
  conf: 0.99
  attack: T1105
  all:
  - id: controller-file-upload-status
  - id: remote-file-download-status
  - id: downloaded-file-execution-status
