defaults:
  platforms: [windows, unix]
  for: [rust]
  attack: T1105
  mbc: B0030
traits:
  - id: rust-agent-hello-schema
    desc: Rust agent hello schema
    crit: component
    conf: 0.9
    if:
      type: text
      substr: AgentHello
  - id: rust-task-result-schema
    desc: Rust task result schema
    crit: component
    conf: 0.9
    if:
      type: text
      substr: TaskResult
  - id: rust-read-file-chunk-task
    desc: Rust read file chunk task
    crit: notable
    conf: 0.95
    if:
      type: text
      substr: read_file_chunk
  - id: rust-delete-dir-task
    desc: Rust delete directory task
    crit: component
    conf: 0.95
    if:
      type: text
      substr: delete_dir
  - id: rust-scan-files-task
    desc: Rust scan files task
    crit: component
    conf: 0.95
    if:
      type: text
      substr: scan_files
  - id: rust-pwd-command-handler
    desc: Rust pwd command handler
    crit: component
    conf: 0.92
    attack: T1083
    if:
      type: text
      regex: 'pub\s+fn\s+pwd\s*\(\s*\)\s*->\s*String'
  - id: rust-ls-command-handler
    desc: Rust ls command handler
    crit: component
    conf: 0.92
    attack: T1083
    if:
      type: text
      regex: 'pub\s+fn\s+ls\s*\(\s*path:\s*&str\s*\)\s*->\s*String'
  - id: rust-change-directory-handler
    desc: Rust change-directory handler
    crit: component
    conf: 0.94
    attack: T1083
    if:
      type: text
      regex: 'pub\s+fn\s+change_dir\s*\(\s*path:\s*&str\s*\)\s*->\s*String'
  - id: rust-search-handler
    desc: Rust recursive search handler
    crit: component
    conf: 0.94
    attack: T1083
    if:
      type: text
      regex: 'pub\s+fn\s+search\s*\(\s*directory:\s*&PathBuf'
composite_rules:
  - id: rust-filesystem-websocket-backdoor
    desc: Rust filesystem tasking backdoor
    crit: hostile
    conf: 0.98
    all:
      - id: rust-agent-hello-schema
      - id: rust-task-result-schema
      - id: rust-read-file-chunk-task
      - id: micro-behaviors/fs/file/read-write::rust-write-file-identifier
      - id: rust-delete-dir-task
      - id: rust-scan-files-task
  - id: rust-directory-tasking-module
    desc: Rust filesystem command tasking
    crit: suspicious
    conf: 0.9
    attack: T1083
    all:
      - id: rust-pwd-command-handler
      - id: rust-ls-command-handler
      - id: rust-change-directory-handler
      - id: micro-behaviors/fs/directory/cwd::rust-current-directory
      - id: micro-behaviors/fs/directory/cwd::rust-set-current-directory
    any:
      - id: micro-behaviors/fs/directory/cwd::rust-current-directory-error
      - id: micro-behaviors/fs/directory/cwd::rust-set-current-directory-error
      - id: objectives/anti-static/obfuscation/string/conceal::obfuscate-macro-pair
  - id: rust-filesystem-search-tasking
    desc: Rust recursive filesystem tasking
    crit: hostile
    conf: 0.92
    attack: T1083
    all:
      - id: rust-directory-tasking-module
      - id: rust-search-handler
      - id: micro-behaviors/fs/directory/readdir::rust-read-dir
    any:
      - id: micro-behaviors/fs/directory/traverse::rust-recursive-search
      - id: objectives/anti-static/obfuscation/string/conceal::obfuscate-macro-pair
