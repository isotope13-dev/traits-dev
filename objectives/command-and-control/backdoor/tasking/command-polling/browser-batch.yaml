defaults:
  platforms: [windows]
  for: [batch]
  attack: T1059.003,T1071.001,T1105

composite_rules:
  - id: headless-browser-command-fragment-backdoor
    desc: Headless browser stages and executes command fragments
    crit: hostile
    conf: 0.99
    all:
      - id: micro-behaviors/communications/http/client/browser-cli::chromium-command-remote-url
      - id: micro-behaviors/process/create/flags::chromium-headless-launch-flag
      - id: micro-behaviors/fs/file/copy::cmd-wildcard-script-concatenation
      - id: micro-behaviors/process/create/script/file::batch-script-output-capture
    near_lines: 16
