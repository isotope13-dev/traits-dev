defaults:
  platforms: [windows]
  for: [powershell]
  attack: T1059.001,T1059.003,T1071.001
composite_rules:
  # Task handler shape: one value is run through both cmd /c and
  # Invoke-Expression in neighbouring branches of one dispatcher. Admin
  # wrappers do this too, so it stays notable and only the beacon loop below
  # convicts.
  - id: powershell-task-dispatch-cmd-and-iex
    desc: PowerShell dispatcher runs tasks via cmd and IEX
    crit: notable
    conf: 0.85
    near_lines: 14
    all:
      - id: micro-behaviors/process/create/shell/command-mode::cmd-exe-c-command-text
      - id: micro-behaviors/process/interpreter/eval/powershell::powershell-iex-text
  # A beacon loop: the dispatcher above, an HTTP POST to the server, and a
  # jittered sleep between rounds inside an unconditional loop.
  - id: powershell-beacon-loop-remote-shell
    desc: PowerShell beacon loop runs remote cmd and IEX tasks
    crit: hostile
    conf: 0.95
    all:
      - id: powershell-task-dispatch-cmd-and-iex
      - id: micro-behaviors/communications/http/post::powershell-post-method
      - id: micro-behaviors/time/sleep/interval::ps-randomized-sleep
      - id: micro-behaviors/data/control-flow/loop/unconditional::embedded-powershell-while-true
