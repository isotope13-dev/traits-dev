# Remote tasking alone does not establish unauthorized execution. Neutral
# task/API/process observations were relocated to their supported subjects.
defaults:
  platforms: [unix, windows]
  for: [python, whl]
  attack: T1059.006,T1071.001
  mbc: B0030

composite_rules:
  # A remote queue that feeds a shell executor is an attack pattern only when
  # the queue/handler structure is present alongside the command handoff.  A
  # local CLI that merely imports subprocess — or a GIS toolkit whose public
  # API is literally run_command() — does not satisfy these legs alone.
  - id: python-queued-remote-shell-agent
    desc: Python queued remote shell agent
    crit: hostile
    conf: 0.99
    for: [python]
    mbc: B0022
    near_lines: 80
    all:
      - id: objectives/command-and-control/backdoor/rat/control::python-command-dispatch-handler-cluster
      - id: micro-behaviors/data/collection/map::python-payload-cmd-get
      - id: micro-behaviors/data/control-flow/dispatch/named::python-run-command-call
      - id: micro-behaviors/data/control-flow/dispatch/selector::python-claimed-command-handler-calls
