# A package that polls a service for work, launches server-selected Python
# widgets, and reports task results is a remote task worker.
defaults:
  platforms: [unix, windows]
  for: [python, whl]
  attack: T1059.006,T1071.001
  mbc: B0030

traits:
  - id: python-task-api-method
    desc: Task API method name
    crit: component
    conf: 0.9
    for: [python]
    if:
      type: text
      regex: '(?i)\b(getTask|pollTask)\b'

  - id: python-task-id-field
    desc: Python task identifier field
    crit: notable
    conf: 0.9
    for: [python]
    if:
      type: text
      word: taskUUID

  - id: python-widget-process-arguments
    desc: Python widget process arguments
    crit: notable
    conf: 0.95
    for: [python]
    if:
      type: text
      regex: '(?is)sys\.executable.{0,220}["'']--run["''].{0,220}["'']--out["'']'

  - id: python-task-result-callback
    desc: Python task result callback
    crit: notable
    conf: 0.9
    for: [python]
    if:
      type: text
      word: TaskNotify

  - id: python-handler-command-field
    desc: Remote handler reads payload command
    crit: notable
    conf: 0.96
    for: [python]
    attack: T1059.006
    if:
      type: text
      substr: 'payload.get("cmd"'

  - id: python-handler-shell-runner
    desc: Remote handler calls shell runner
    crit: notable
    conf: 0.96
    for: [python]
    attack: T1059.006
    if:
      # A generic helper named run_command is common in platform probes and
      # local CLIs.  Keep this atom in the remote-tasking tier only when the
      # source also hands a received payload command to that helper.
      type: text
      regex: '(?s)payload\s*\.\s*get\(\s*["'']cmd["'']\s*\)[\s\S]{0,320}\brun_command\s*\('

  - id: python-handler-command-queue
    desc: Daemon claims queued commands
    crit: notable
    conf: 0.95
    for: [python]
    if:
      type: text
      regex: 'claim_commands\s*\([\s\S]{0,520}\b_handle_command\s*\('

composite_rules:
  - id: python-task-polling-api
    desc: Task API paired with task state
    crit: notable
    conf: 0.9
    for: [python]
    all:
      - id: python-task-api-method
      - id: python-task-id-field

  - id: python-remote-widget-task-worker
    desc: Remote Python widget task worker
    crit: hostile
    conf: 0.99
    for: [whl]
    scope: archive
    all:
      - id: python-task-polling-api
      - id: python-task-id-field
      - id: python-widget-process-arguments
      - id: python-task-result-callback
      - id: micro-behaviors/process/create/subprocess::process-execution
      - id: micro-behaviors/communications/http/request/client::request-python

  # Generic remote-worker form: a task poll/result protocol that launches
  # processes is hostile even when the worker does not use the ryry widget
  # names or its `--run/--out` convention.
  - id: python-remote-process-task-worker
    desc: Python remote task worker launches processes and reports results
    crit: hostile
    conf: 0.98
    for: [whl]
    scope: archive
    all:
      - id: python-task-polling-api
      - id: python-task-result-callback
      - id: micro-behaviors/process/create/subprocess::process-execution
      - id: micro-behaviors/communications/http/request/client::request-python
    any:
      - id: python-widget-process-arguments
      - id: python-handler-command-field
      - id: python-handler-command-queue

  # Host profiling becomes an attack capability when the same package also
  # polls for operator work and reports over its HTTP client.  The profile
  # fields are intentionally broad; no vendor, domain, or package identity is
  # part of this rule.
  - id: python-remote-profile-task-worker
    desc: Python remote task worker reports a hardware profile
    crit: hostile
    conf: 0.98
    for: [whl]
    scope: archive
    attack: T1082,T1041,T1071.001
    all:
      - id: python-task-polling-api
      - id: objectives/exfiltration/stealer/host-profile/remote-agent::python-hardware-profile-field
      - id: objectives/exfiltration/stealer/host-profile/remote-agent::python-profile-api-call
      - id: micro-behaviors/communications/http/request/client::request-python

  # A tasking worker that walks files, archives them, and uploads the archive
  # has a collection/exfiltration capability independent of the package name
  # or the destination service.
  - id: python-remote-archive-upload-worker
    desc: Python remote task worker archives and uploads collected files
    crit: hostile
    conf: 0.98
    for: [whl]
    scope: archive
    attack: T1059.006,T1560.001,T1041
    all:
      - id: python-task-polling-api
      - id: python-task-result-callback
      - id: micro-behaviors/fs/directory/traverse::traverse-walk-call
      - id: micro-behaviors/data/archive/create/zip::python-zipfile-writer
      - id: micro-behaviors/communications/http/upload::upload-zip

  # A remote queue that feeds a shell executor is an attack pattern only when
  # the queue/handler structure is present alongside the command handoff.  A
  # local CLI that merely imports subprocess — or a GIS toolkit whose public
  # API is literally run_command() — does not satisfy these legs alone.
  - id: python-queued-remote-shell-agent
    desc: Python queued remote shell agent
    crit: hostile
    conf: 0.99
    for: [python]
    mbc: B0022
    near_lines: 80
    all:
      - id: objectives/command-and-control/backdoor/rat/multi::python-command-dispatch-handler-cluster
      - id: python-handler-command-field
      - id: micro-behaviors/process/create/shell/runner::python-run-command-call
      - id: python-handler-command-queue
