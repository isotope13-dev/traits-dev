defaults:
  platforms: [unix, windows]
  for: [python, whl]
  attack: T1059.006,T1071.001
  mbc: B0030

composite_rules:
  - id: python-http-file-queue-shell-agent
    desc: Python polls remote files for shell commands
    crit: hostile
    conf: 0.98
    scope: outer
    near_lines: 120
    all:
      - id: micro-behaviors/process/create/shell/command-string::python-aliased-subprocess-sh-c-runtime-command
      - id: micro-behaviors/data/control-flow/module-exec::python-http-remote-cmd-suffix-poll
      - id: micro-behaviors/communications/tls/verify/disable::unverified-ssl-context
