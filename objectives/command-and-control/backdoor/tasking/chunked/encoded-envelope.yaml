# Improvised C2 carried over ordinary web services.  The technique is the
# protocol shape: a self-describing, chunkable envelope, polling, decoding,
# and dispatching a received command.  No service or incident-specific name
# is used so equivalent implementations can match across languages.
defaults:
  platforms: [unix, windows]
  for: [scripts, go, rust, c, cpp, java, csharp]
  attack: T1071.001,T1059
  mbc: B0022

traits:
  - id: python-payload-chunk-join
    desc: Python joins encoded payload chunks
    crit: notable
    conf: 0.94
    for: [python]
    if:
      type: text
      regex: '(?i)\.join\s*\([^)]{0,140}["'']payload["'']'

  - id: go-payload-chunk-join
    desc: Go joins encoded payload chunks
    crit: notable
    conf: 0.94
    for: [go]
    if:
      type: text
      regex: '(?i)append\([^)]{0,100}\bPayload\b[\s\S]{0,200}strings\.Join'

  - id: checksum-after-sha256
    desc: SHA-256 checksum comparison
    crit: component
    conf: 0.94
    for: [python, go]
    if:
      type: text
      regex: '(?is)(sha256|hashlib\.sha256)[\s\S]{0,180}\bchecksum\b[\s\S]{0,80}(==|!=)'

  - id: checksum-before-sha256
    desc: Checksum comparison with SHA-256
    crit: component
    conf: 0.94
    for: [python, go]
    if:
      type: text
      regex: '(?is)(==|!=)[\s\S]{0,80}\bchecksum\b[\s\S]{0,180}(sha256|hashlib\.sha256)'

  - id: python-polls-channel
    desc: Python polls HTTP queue by channel
    crit: notable
    conf: 0.94
    for: [python]
    if:
      type: text
      regex: '(?is)while\s+True\s*:[\s\S]{0,450}urlopen\s*\([\s\S]{0,450}["'']channel["'']'

  - id: go-polls-channel
    desc: Go polls HTTP queue by channel
    crit: notable
    conf: 0.94
    for: [go]
    if:
      type: text
      regex: '(?is)for\s*\{[\s\S]{0,450}http\.Get\s*\([\s\S]{0,450}\.Channel\b'

  - id: python-command-shell-dispatch
    desc: Command-kind branch enables Python shell
    crit: suspicious
    conf: 0.96
    for: [python]
    if:
      type: text
      regex: '(?is)kind\s*==\s*["'']command["''][\s\S]{0,700}\bshell\s*=\s*True'

  - id: go-command-shell-dispatch
    desc: Go dispatches command to shell
    crit: suspicious
    conf: 0.96
    for: [go]
    if:
      type: text
      regex: '(?is)kind\s*==\s*["'']command["''][\s\S]{0,450}exec\.Command[\s\S]{0,100}["'']-c["'']'

  - id: python-command-result-envelope
    desc: Python serializes subprocess stdout result
    crit: suspicious
    conf: 0.96
    for: [python]
    if:
      type: text
      regex: '(?is)subprocess\.run[\s\S]{0,700}["'']result["'']\s*:\s*\w+\.stdout\b'
    unless:
      - id: well-known/app/ai/coding-agent/vtcode::vtcode-eval-harness-context
      - id: well-known/app/ai/coding-agent/vtcode::eval-harness-marker

  - id: python-result-post
    desc: Python posts command result envelope
    crit: suspicious
    conf: 0.96
    for: [python]
    if:
      type: text
      regex: '(?is)post_envelope[\s\S]{0,500}["'']result["'']'

  - id: go-command-result-envelope
    desc: Go builds command result envelope
    crit: suspicious
    conf: 0.96
    for: [go]
    if:
      type: text
      regex: '(?is)exec\.Command[\s\S]{0,700}Type\s*:\s*["'']result["'']'

  - id: go-result-post
    desc: Go posts command result envelope
    crit: suspicious
    conf: 0.96
    for: [go]
    if:
      type: text
      regex: '(?is)Type\s*:\s*["'']result["''][\s\S]{0,500}http\.Post'

composite_rules:
  - id: checksum-validation
    desc: Validates a decoded payload checksum
    crit: notable
    conf: 0.94
    for: [python, go]
    any:
      - id: checksum-after-sha256
      - id: checksum-before-sha256

  - id: ordered-payload-chunk-reassembly
    desc: Orders and joins payload chunks
    crit: notable
    conf: 0.95
    any:
      - id: python-ordered-payload-chunk-reassembly
      - id: go-ordered-payload-chunk-reassembly

  - id: python-ordered-payload-chunk-reassembly
    desc: Python orders and joins payload chunks
    crit: notable
    conf: 0.95
    for: [python]
    all:
      - id: micro-behaviors/data/buffer::python-sequence-field-sort
      - id: python-payload-chunk-join

  - id: go-ordered-payload-chunk-reassembly
    desc: Go orders and joins payload chunks
    crit: notable
    conf: 0.95
    for: [go]
    all:
      - id: micro-behaviors/data/buffer::go-sequence-field-sort
      - id: go-payload-chunk-join

  - id: polls-and-filters-envelope-channel
    desc: Polls HTTP queue and filters channel
    crit: notable
    conf: 0.95
    any:
      - id: python-polls-channel
      - id: go-polls-channel

  - id: declared-command-shell-dispatch
    desc: Dispatches declared command to shell
    crit: suspicious
    conf: 0.97
    any:
      - id: python-command-shell-dispatch
      - id: go-command-shell-dispatch

  - id: python-encoded-command-result-post
    desc: Python posts encoded command output
    crit: suspicious
    conf: 0.97
    for: [python]
    all:
      - id: python-command-result-envelope
      - id: python-result-post

  - id: go-encoded-command-result-post
    desc: Go posts encoded command output
    crit: suspicious
    conf: 0.97
    for: [go]
    all:
      - id: go-command-result-envelope
      - id: go-result-post

  - id: encoded-command-result-post
    desc: Posts encoded command output
    crit: suspicious
    conf: 0.97
    any:
      - id: python-encoded-command-result-post
      - id: go-encoded-command-result-post

  - id: encoded-envelope-command-tasking
    desc: Encoded envelope command tasking
    crit: hostile
    conf: 0.99
    near_lines: 180
    all:
      # The field fragments are only C2 evidence in combination with the
      # polling, encoding, and command-dispatch behaviors below.
      - id: micro-behaviors/data/serialize/envelope::json-type-field
      - id: micro-behaviors/data/serialize/envelope::json-channel-field
      - id: micro-behaviors/data/serialize/envelope::json-sequence-field
      - id: micro-behaviors/data/serialize/envelope::json-checksum-field
      - id: micro-behaviors/data/serialize/envelope::json-payload-field
      - id: polls-and-filters-envelope-channel
      - id: micro-behaviors/data/compress/library::encoded-compressed-transform
      - id: declared-command-shell-dispatch

  - id: chunked-encoded-envelope-command-tasking
    desc: Chunked encoded envelope command tasking
    crit: hostile
    conf: 0.99
    near_lines: 220
    all:
      - id: encoded-envelope-command-tasking
      - id: ordered-payload-chunk-reassembly
    any:
      - id: checksum-validation

  - id: encoded-envelope-command-output-staging
    desc: Encoded envelope command output staging
    crit: hostile
    conf: 0.99
    near_lines: 220
    all:
      - id: encoded-envelope-command-tasking
      - id: encoded-command-result-post
