defaults:
  platforms: [windows]
  for: [powershell]
  attack: T1041,T1030
composite_rules:
  # A file opened as a stream is read into a byte buffer in fixed-size blocks
  # and each block is Base64-encoded and packed into a JSON document for the
  # server. Splitting the transfer lets an implant move a large file over its
  # task channel; the read loop, encoding and serialization must sit together.
  - id: powershell-file-chunks-base64-json
    desc: PowerShell packs file chunks as Base64 JSON
    crit: suspicious
    conf: 0.88
    near_lines: 30
    all:
      - id: micro-behaviors/fs/file/open/read::powershell-file-openread
      - id: micro-behaviors/data/stream/read::powershell-buffer-stream-read
      - id: micro-behaviors/data/encode/base64/primitive::to-base64-string
      - id: micro-behaviors/data/serialize/json::convertto-json
