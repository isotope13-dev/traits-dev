# Structured HTTP tasking used by command backdoors. The same protocol shape
# can be recovered from native binary string tables as well as source text.
#
# This intentionally does not key on a family, repository, user agent, or
# endpoint name. It detects the reusable protocol shape: a task schema with
# command/liveness fields, a result upload, an HTTP client, and local process
# execution. The individual field names remain weak fragments; the assembled
# channel is the hostile observation.
defaults:
  platforms: [windows, unix]
  for: [rust, go, c, cpp, python, powershell, javascript, typescript, shell]
  attack: T1071.001
  mbc: C0002

traits:
  - id: http-task-command-field
    desc: HTTP tasking command field
    crit: component
    conf: 0.9
    if:
      type: text
      regex: '(?i)["'']?(cmd|command)["'']?\s*[:=]'

  - id: http-task-argument-field
    desc: HTTP tasking argument field
    crit: component
    conf: 0.9
    if:
      type: text
      regex: '(?i)["'']?(arg|args|argument)["'']?\s*[:=]'

  - id: http-task-liveness-field
    desc: HTTP tasking liveness field
    crit: component
    conf: 0.9
    if:
      type: text
      regex: '(?i)["'']?(ping|heartbeat|alive)["'']?\s*[:=]'

  - id: http-task-sequence-field
    desc: HTTP tasking sequence field
    crit: component
    conf: 0.9
    if:
      type: text
      regex: '(?i)["'']?(seq|sequence|task_id)["'']?\s*[:=]'

  - id: http-result-put-request
    desc: HTTP PUT request carries task result
    crit: component
    conf: 0.9
    if:
      type: text
      regex: '(?is)\bput\s*\([^\n]{0,220}["'']?(result|output|stdout|stderr)["'']?'

  - id: http-result-post-request
    desc: HTTP POST request carries task result
    crit: component
    conf: 0.9
    if:
      type: text
      regex: '(?is)\bpost\s*\([^\n]{0,220}["'']?(result|output|stdout|stderr)["'']?'

  - id: http-result-send-request
    desc: HTTP send request carries task result
    crit: component
    conf: 0.9
    if:
      type: text
      regex: '(?is)\bsend\s*\([^\n]{0,220}["'']?(result|output|stdout|stderr)["'']?'

  - id: http-native-result-post
    desc: Native HTTP POST carries command output
    crit: notable
    conf: 0.9
    for: [pe, dll, c, cpp, rust, go]
    if:
      type: text
      regex: '(?is)\bPOST\s+\S{1,160}\s+HTTP/1\.[01]\b[\s\S]{0,512}\b(result|output|stdout|stderr)\b'

  - id: http-native-task-command-field
    desc: Native task command field
    crit: component
    conf: 0.93
    for: [pe, dll]
    if:
      type: text
      regex: '"cmd"\s*:'

  - id: http-native-task-argument-field
    desc: Native task argument field
    crit: component
    conf: 0.93
    for: [pe, dll]
    if:
      type: text
      regex: '"arg"\s*:'

  - id: http-native-task-liveness-field
    desc: Native task liveness field
    crit: component
    conf: 0.93
    for: [pe, dll]
    if:
      type: text
      regex: '"ping"\s*:'

  - id: http-native-task-sequence-field
    desc: Native task sequence field
    crit: component
    conf: 0.93
    for: [pe, dll]
    if:
      type: text
      regex: '"seq"\s*:'

composite_rules:
  - id: http-task-result-upload
    desc: HTTP task result upload request
    crit: suspicious
    conf: 0.92
    any:
      - id: http-result-put-request
      - id: http-result-post-request
      - id: http-result-send-request
      - id: http-native-result-post

  - id: http-task-schema
    desc: Structured tasking field cluster
    crit: component
    conf: 0.95
    needs: 3
    unless:
      - id: well-known/app/aui-agent-builder/
    any:
      - id: http-task-command-field
      - id: http-task-argument-field
      - id: http-task-liveness-field
      - id: http-task-sequence-field

  - id: http-native-task-schema
    desc: Native HTTP task schema
    crit: notable
    conf: 0.93
    for: [pe, dll]
    needs: 3
    any:
      - id: http-native-task-command-field
      - id: http-native-task-argument-field
      - id: http-native-task-liveness-field
      - id: http-native-task-sequence-field

  - id: http-structured-shell-tasking
    desc: HTTP command backdoor with structured tasking and result upload
    crit: hostile
    conf: 0.98
    attack: "T1059,T1071.001"
    near_bytes: 8192
    all:
      - id: http-task-schema
      - id: http-task-result-upload
      - id: micro-behaviors/communications/http/
      - id: micro-behaviors/process/create/

  - id: http-native-structured-shell-tasking
    desc: Native HTTP command backdoor with structured tasking and result upload
    crit: hostile
    conf: 0.98
    attack: "T1059,T1071.001"
    for: [pe, dll]
    near_bytes: 8192
    all:
      - id: http-native-task-schema
      - id: http-native-result-post
      - id: micro-behaviors/communications/http/
      - id: micro-behaviors/process/create/
