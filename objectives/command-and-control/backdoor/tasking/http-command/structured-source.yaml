# Structured HTTP tasking used by command backdoors. The same protocol shape
# can be recovered from native binary string tables as well as source text.
#
# This intentionally does not key on a family, repository, user agent, or
# endpoint name. It detects the reusable protocol shape: a clustered task
# schema, a structured result payload, an HTTP client, and local process
# execution. Individual field names remain weak fragments; the assembled
# channel is the hostile observation.
defaults:
  platforms: [windows, unix]
  for: [rust, go, c, cpp, python, powershell, javascript, typescript, shell]
  attack: T1071.001
  mbc: C0002

traits:
  - id: http-native-task-command-field
    desc: Native task command field
    crit: component
    conf: 0.93
    for: [pe, dll]
    if:
      type: text
      regex: '"cmd"\s*:'

  - id: http-native-task-argument-field
    desc: Native task argument field
    crit: component
    conf: 0.93
    for: [pe, dll]
    if:
      type: text
      regex: '"arg"\s*:'

  - id: http-native-task-liveness-field
    desc: Native task liveness field
    crit: component
    conf: 0.93
    for: [pe, dll]
    if:
      type: text
      regex: '"ping"\s*:'

  - id: http-native-task-sequence-field
    desc: Native task sequence field
    crit: component
    conf: 0.93
    for: [pe, dll]
    if:
      type: text
      regex: '"seq"\s*:'

composite_rules:
  - id: http-native-result-post
    desc: Native HTTP POST result field
    crit: notable
    conf: 0.9
    for: [pe, dll, c, cpp, rust, go]
    near_bytes: 1024
    all:
      - id: micro-behaviors/communications/http/post::native-post-request-line
      - id: micro-behaviors/data/format/json::json-result-output-field

  - id: http-task-result-upload
    desc: HTTP task result payload paired with a structured task schema
    crit: suspicious
    conf: 0.92
    all:
      - id: http-task-schema
    any:
      - id: micro-behaviors/communications/http/request/result::http-result-put-request
      - id: micro-behaviors/communications/http/request/result::http-result-post-request
      - id: micro-behaviors/communications/http/request/result::http-result-send-request
      - id: http-native-result-post

  - id: http-task-schema
    desc: Clustered structured task schema in an HTTP client
    crit: component
    conf: 0.95
    needs: 3
    near_bytes: 512
    unless:
      - id: well-known/app/ai/agent-runtime/aui-agent-builder/
    all:
      - id: micro-behaviors/communications/http/request/client/
    any:
      - id: micro-behaviors/communications/http/request/tasking

  - id: http-native-task-schema
    desc: Native HTTP task schema
    crit: notable
    conf: 0.93
    for: [pe, dll]
    needs: 3
    near_bytes: 512
    any:
      - id: http-native-task-command-field
      - id: http-native-task-argument-field
      - id: http-native-task-liveness-field
      - id: http-native-task-sequence-field

  - id: http-structured-shell-tasking
    desc: HTTP command backdoor with structured tasking and result upload
    crit: hostile
    conf: 0.98
    attack: "T1059,T1071.001"
    near_bytes: 4096
    all:
      - id: http-task-schema
      - id: http-task-result-upload
      - id: micro-behaviors/communications/http/
      - id: micro-behaviors/process/create/

  - id: http-native-structured-shell-tasking
    desc: Native HTTP command backdoor with structured tasking and result upload
    crit: hostile
    conf: 0.98
    attack: "T1059,T1071.001"
    for: [pe, dll]
    near_bytes: 4096
    all:
      - id: http-native-task-schema
      - id: http-native-result-post
      - id: micro-behaviors/communications/http/
      - id: micro-behaviors/process/create/

  # Some compact agents use only one task key instead of a full schema. The
  # paired stdout/stderr result object, recurring poll loop, HTTP GET/POST, and
  # local process launch make the command channel explicit without relying on
  # an endpoint name, family marker, or campaign infrastructure.
  - id: http-polled-command-output-backdoor
    desc: HTTP-polled command backdoor executes tasks and posts process output
    crit: hostile
    conf: 0.99
    attack: "T1059,T1071.001,T1041"
    scope: file
    near_lines: 120
    all:
      - id: micro-behaviors/communications/http/request/tasking::http-task-command-field-read
      - id: micro-behaviors/communications/http/request/result::process-stream-result-post
      - id: micro-behaviors/data/control-flow/loop/
      - id: micro-behaviors/process/create/
    any:
      - id: micro-behaviors/communications/http/lib/requests::requests-get
      - id: micro-behaviors/communications/http/get/
      - id: micro-behaviors/communications/http/request/client::js-http-get-or-fetch
    needs: 1

  - id: python-http-polled-command-output-backdoor
    desc: Python polls HTTP commands, executes them, and posts the output
    crit: hostile
    conf: 0.99
    attack: "T1059.006,T1071.001,T1041"
    for: [python]
    scope: file
    all:
      - id: micro-behaviors/communications/http/request/tasking::python-json-response-command-read
      - id: micro-behaviors/communications/http/request/result::python-http-result-output-post
      - id: micro-behaviors/data/control-flow/loop::python-while-true
      - id: micro-behaviors/process/create/subprocess::subprocess-shell-cwd-options
      - id: micro-behaviors/communications/http/lib/requests::requests-get
