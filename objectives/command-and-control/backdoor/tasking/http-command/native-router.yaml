defaults:
  platforms: [unix, appliance]
  for: [c, cpp]
  attack: T1059,T1071.001
  mbc: B0030

traits:
  - id: embedded-iot-user-agent
    desc: Embedded IOT HTTP user-agent
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: '(?i)User-Agent:\s*IOT\b'

  - id: native-command-result-field
    desc: Native command result field
    crit: component
    conf: 0.9
    if:
      type: text
      regex: '(?i)\b(cmdResult|command[_-]?result|stdout|stderr)\b\s*[:=]'

  - id: native-command-selector-exec
    desc: Native command selector field
    crit: component
    conf: 0.9
    if:
      type: text
      regex: '(?i)\b(cmdNum|command|action)\b\s*[:=]'

  - id: native-url-buffer-update
    desc: Copies data after a URL field
    crit: component
    conf: 0.9
    if:
      type: text
      regex: '(?i)\b(url|uri)\b[^;\r\n]{0,120}\b(strncpy|strcpy|memcpy)\s*\('

  - id: native-url-word
    desc: Native URL or endpoint field
    crit: component
    conf: 0.8
    if:
      type: text
      regex: '(?i)\b(url|uri|endpoint)\b'

  - id: native-json-command-post
    desc: Native JSON command POST body
    crit: suspicious
    conf: 0.92
    if:
      type: text
      regex: '(?i)CURLOPT_POSTFIELDS[\s\S]{0,180}(cmdNum|command[_-]?(id|number)?)'

composite_rules:
  - id: native-command-selector-process
    desc: Command selector drives process execution
    crit: suspicious
    conf: 0.94
    all:
      - id: native-command-selector-exec
      - id: micro-behaviors/process/create/shell/spawn::c-popen-call
    near_lines: 20

  - id: native-command-url-update
    desc: Command selector updates C2 URL
    crit: suspicious
    conf: 0.94
    all:
      - id: native-command-selector-exec
      - id: native-url-buffer-update
      - id: native-url-word
    near_lines: 20

  - id: native-http-json-shell-tasking
    desc: Native JSON HTTP shell tasking
    crit: hostile
    conf: 0.99
    all:
      - id: micro-behaviors/communications/http/download/curl::libcurl-http
      - id: micro-behaviors/communications/http/header/content-type::native-json-content-type
      - id: embedded-iot-user-agent
      - id: native-command-result-field
      - id: native-command-selector-process
      - id: micro-behaviors/process/create/shell/spawn::c-popen-call
    near_bytes: 4096

  - id: native-http-url-rotating-shell
    desc: Native shell with changeable HTTP C2 URL
    crit: hostile
    conf: 0.99
    all:
      - id: native-http-json-shell-tasking
      - id: native-command-url-update
      - id: native-json-command-post
    near_bytes: 4096
