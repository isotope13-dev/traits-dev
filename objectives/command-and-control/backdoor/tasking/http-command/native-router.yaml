defaults:
  platforms: [unix, appliance]
  for: [c, cpp]
  attack: T1059,T1071.001
  mbc: B0030

traits:
  - id: embedded-iot-user-agent
    desc: Embedded IOT HTTP user-agent
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: '(?i)User-Agent:\s*IOT\b'

  # Read the selector from a JSON object. A quoted `"command":` string alone
  # can just be an output field, log template, or API response schema.
  - id: native-command-selector-command
    desc: Native JSON command field read
    crit: component
    conf: 0.96
    if:
      type: symbol
      kind: call
      regex: '(?i)^(cJSON_GetObjectItem\w*|json_object_object_get(_ex)?)$'
      arg:
        kind: string
        exact: command

  - id: native-command-selector-cmdnum
    desc: Native JSON cmdNum field read
    crit: component
    conf: 0.96
    if:
      type: symbol
      kind: call
      regex: '(?i)^(cJSON_GetObjectItem\w*|json_object_object_get(_ex)?)$'
      arg:
        kind: string
        exact: cmdNum

  - id: native-command-selector-action
    desc: Native JSON action field read
    crit: component
    conf: 0.94
    if:
      type: symbol
      kind: call
      regex: '(?i)^(cJSON_GetObjectItem\w*|json_object_object_get(_ex)?)$'
      arg:
        kind: string
        exact: action

  - id: native-url-buffer-update
    desc: Copies data after a URL field
    crit: component
    conf: 0.9
    if:
      type: text
      regex: '(?i)\b(url|uri)\b[^;\r\n]{0,40}\b(strncpy|strcpy|memcpy)\s*\('

composite_rules:
  # A libcurl POST whose body carries a command-selector key.  The two legs
  # must be matched separately: `CURLOPT_POSTFIELDS` as a substring also hits
  # `CURLOPT_POSTFIELDSIZE_LARGE`, so any HTTP client that sizes its POST body
  # (JUCE's juce_Network_curl.cpp, for one) collided with an unrelated
  # `command` token a few lines away.
  - id: native-json-command-post
    desc: Native libcurl POST body carries a command selector key
    crit: suspicious
    conf: 0.92
    all:
      - id: micro-behaviors/communications/http/curl::native-post-fields-option
    any:
      - id: native-command-selector-command
      - id: native-command-selector-cmdnum
      - id: native-command-selector-action
    near_lines: 20

  - id: native-command-selector-process
    desc: Command selector drives process execution
    crit: suspicious
    conf: 0.94
    all:
      - id: micro-behaviors/process/create/shell/spawn::c-popen-call
    any:
      - id: native-command-selector-command
      - id: native-command-selector-cmdnum
      - id: native-command-selector-action
    near_lines: 20
    unless:
      - id: well-known/tool/reverse-engineering/radare2::radare2-source-identity

  - id: native-command-url-update
    desc: Command selector updates C2 URL
    crit: suspicious
    conf: 0.94
    all:
      - id: native-url-buffer-update
    any:
      - id: native-command-selector-command
      - id: native-command-selector-cmdnum
      - id: native-command-selector-action
    near_lines: 20

  - id: native-http-json-shell-tasking
    desc: Native JSON HTTP shell tasking
    crit: hostile
    conf: 0.99
    all:
      - id: micro-behaviors/communications/http/download/curl::libcurl-http
      - id: micro-behaviors/communications/http/header/content-type::native-json-content-type
      - id: embedded-iot-user-agent
      - id: micro-behaviors/data/format/json::native-command-result-field
      - id: native-command-selector-process
      - id: micro-behaviors/process/create/shell/spawn::c-popen-call
    near_bytes: 4096

  - id: native-http-url-rotating-shell
    desc: Native shell with changeable HTTP C2 URL
    crit: hostile
    conf: 0.99
    all:
      - id: native-http-json-shell-tasking
      - id: native-command-url-update
      - id: native-json-command-post
    near_bytes: 4096
