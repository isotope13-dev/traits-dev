# A service module that consumes attacker tasking through temporary batch files
# is a command-dispatch pattern, not a product or family signature.  Keep the
# service evidence separate from the generic cmd/batch capability so the same
# technique can be recognized in native service DLLs and script-based
# installers with different names.
defaults:
  platforms: [windows]
  for: [scripts, binaries]
  attack: T1059.003,T1543.003
  mbc: B0011.003

composite_rules:
  - id: service-temp-batch-command-dispatch
    desc: Windows service dispatches temporary batch commands
    crit: suspicious
    conf: 0.97
    all:
      - id: micro-behaviors/fs/path/location::temporary-batch-path-reference
      - id: micro-behaviors/process/create/script/file::batch-script-exec-cmd
    any:
      - id: micro-behaviors/os/service/export::win-service-export
      - id: micro-behaviors/os/service/control
      - id: micro-behaviors/os/service/config::powershell-binary-service-command
    near_bytes: 4096
