# The protocol vocabulary is documented in ESET's MythicRatatoskr analysis.
# Each token is incomplete alone. Require all four distinct roles and a real
# JSON HTTP request; neither an address nor a family-specific filename gates it.
defaults:
  platforms: [unix, windows]
  for: [source, scripts]
  crit: component
  conf: 0.95

traits:
  - id: checkin-message-token
    desc: Check-in message token
    if:
      type: string_literal
      exact: checkin
  - id: tasking-message-token
    desc: Task-poll message token
    if:
      type: string_literal
      exact: tasking
  - id: result-message-token
    desc: Result message token
    if:
      type: string_literal
      exact: result
  - id: getfile-message-token
    desc: File-request message token
    if:
      type: string_literal
      exact: getfile

composite_rules:
  - id: checkin-task-result-file-protocol
    desc: JSON HTTP check-in task result and file-request protocol
    crit: suspicious
    conf: 0.98
    attack: T1071.001
    near_bytes: 8192
    all:
      - id: checkin-message-token
      - id: tasking-message-token
      - id: result-message-token
      - id: getfile-message-token
    any:
      - id: micro-behaviors/communications/http/request/json::go-post-json-content-type
      - id: micro-behaviors/communications/http/request/json::python-json-body-transport
      - id: micro-behaviors/communications/http/request/json::http-post-json
