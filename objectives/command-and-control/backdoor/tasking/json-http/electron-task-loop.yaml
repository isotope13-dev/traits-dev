# An Electron main process that polls a server for tasks: it reports a host
# identity record (computer and user name) as JSON, then acts on the task in
# the reply -- evaluating a code field or writing base64 files and running the
# dropped .exe. Each leg is ordinary Node code on its own; reporting who the
# machine is and then running whatever the server answers with is a backdoor.
defaults:
  platforms: [windows]
  for: [javascript, typescript]
  attack: T1071.001,T1059.007
  crit: notable
  conf: 0.9

traits:
  - id: js-beacon-host-identity-array
    desc: JSON body lists computer and user name
    if:
      type: text
      regex: 'JSON\.stringify\(\[[^\]]{0,80}env\.COMPUTERNAME\s*,\s*process\.env\.USERNAME'

  - id: js-json-response-task-dispatch
    desc: Dispatches the task field of a reply
    if:
      type: text
      regex: '\.task\s*&&\s*\w+\(\w+\.task\)'

  - id: js-task-eval-field
    desc: Evaluates a task's code field
    if:
      type: text
      regex: 'if\(\w+\.e\)\{try\{(const \w+=)?eval\(\w+\.e\)'

  - id: js-task-files-base64-exe-run
    desc: Writes base64 task files, tracks the .exe
    if:
      type: text
      regex: 'Buffer\.from\(\w+,"base64"\)\),\w+\.endsWith\("\.exe"\)'

  - id: js-sleep-poll-loop
    desc: Endless loop with delay between calls
    if:
      type: text
      regex: 'for\(;;\)await \w+\(\),await \w+\(\d+e\d+\)'

composite_rules:
  - id: json-beacon-task-eval-or-drop-exec
    desc: Host-identity beacon runs eval or dropped exe
    crit: hostile
    conf: 0.97
    attack: T1071.001,T1059.007,T1105
    near_bytes: 4096
    all:
      - id: js-beacon-host-identity-array
      - id: js-json-response-task-dispatch
    any:
      - id: js-task-eval-field
      - id: js-task-files-base64-exe-run
