# HTTP command agents that exchange structured task and result objects.
#
# The article describes a PhantomCore variant that POSTs JSON to its C2,
# receives commands, and can deliver additional modules. These atoms use
# protocol fields and dispatch APIs rather than family names or prose.
defaults:
  platforms: [unix, windows]
  for: [scripts, binaries, c, cpp, csharp, go, rust, python, javascript, typescript, php, powershell, batch, shell, pe, elf, macho, dll]
  attack: T1059,T1071.001,T1105
  mbc: B0030

traits:
  - id: command-json-key
    desc: Carries a command field
    crit: component
    conf: 0.9
    if:
      type: text
      regex: '(?i)[{,]\s*["'']?(cmd|command|task|action)["'']?\s*[:=]'

  - id: command-object-property
    desc: Reads a command property
    crit: component
    conf: 0.9
    if:
      type: text
      regex: '(?i)\.\s*(cmd|command|task|action)\b'

  - id: result-json-key
    desc: Carries a result field
    crit: component
    conf: 0.9
    if:
      type: text
      regex: '(?i)[{,]\s*["'']?(result|output|stdout|response)["'']?\s*[:=]'

  - id: result-object-property
    desc: Reads a result property
    crit: component
    conf: 0.9
    if:
      type: text
      regex: '(?i)\.\s*(result|output|stdout|response)\b\s*[:=]'

  - id: powershell-shell-dispatch
    desc: Dispatches through PowerShell
    crit: notable
    conf: 0.92
    attack: T1059
    if:
      type: text
      regex: '(?i)powershell(\.exe)?[^\r\n]{0,120}-Command\b'

  - id: process-shell-call
    desc: Calls a shell execution API
    crit: notable
    conf: 0.92
    attack: T1059
    if:
      type: text
      regex: '(?i)\b(os\.system|(os\.)?popen|shell_exec)\s*\('

  - id: python-shell-call
    desc: Calls a Python process API
    crit: notable
    conf: 0.92
    attack: T1059
    if:
      type: text
      regex: '(?i)\bsubprocess\.(run|Popen)\s*\('

  - id: go-shell-call
    desc: Calls a Go process API
    crit: notable
    conf: 0.92
    attack: T1059
    if:
      type: text
      regex: '(?i)\bexec\.Command\s*\('

  - id: windows-process-call
    desc: Calls a Windows process API
    crit: notable
    conf: 0.92
    attack: T1059
    if:
      type: text
      regex: '(?i)\b(CreateProcess[AW]?|ShellExecute(Ex)?[AW]?)\s*\('

  - id: windows-client-url
    desc: Remote Windows client URL
    crit: notable
    conf: 0.88
    attack: T1105
    if:
      type: text
      regex: '(?i)https?://[^\s''"]{1,180}\.(exe|msi)([?#][^\s''"]{0,80})?'

  - id: unix-client-url
    desc: Remote Unix client URL
    crit: notable
    conf: 0.88
    attack: T1105
    if:
      type: text
      regex: '(?i)https?://[^\s''"]{1,180}\.(pkg|deb|rpm)([?#][^\s''"]{0,80})?'

composite_rules:
  - id: structured-command-field
    desc: Structured object carries a command
    crit: component
    any:
      - id: command-json-key
      - id: command-object-property

  - id: structured-result-field
    desc: Structured object carries a result
    crit: component
    any:
      - id: result-json-key
      - id: result-object-property

  - id: structured-shell-api
    desc: Executes through a shell
    crit: notable
    any:
      - id: powershell-shell-dispatch
      - id: process-shell-call
      - id: python-shell-call
      - id: go-shell-call
      - id: windows-process-call

  - id: json-command-tasking
    desc: HTTP agent exchanges task results
    crit: suspicious
    conf: 0.96
    near_bytes: 8192
    all:
      - id: structured-command-field
      - id: structured-result-field
    any:
      - id: micro-behaviors/communications/http/post
      - id: micro-behaviors/communications/http/curl::curl-post-flag

  - id: json-command-shell-agent
    desc: HTTP agent executes shell commands
    crit: hostile
    conf: 0.99
    near_bytes: 8192
    all:
      - id: json-command-tasking
      - id: structured-shell-api

  - id: remote-client-command-agent
    desc: Remote client URL with tasking agent
    crit: hostile
    conf: 0.99
    attack: T1195.002,T1059,T1071.001,T1105
    near_bytes: 12288
    all:
      - id: json-command-shell-agent
    any:
      - id: windows-client-url
      - id: unix-client-url
