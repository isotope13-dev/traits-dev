# HTTP command agents that exchange structured task and result objects.
#
# The article describes a PhantomCore variant that POSTs JSON to its C2,
# receives commands, and can deliver additional modules. These atoms use
# protocol fields and dispatch APIs rather than family names or prose.
defaults:
  platforms: [unix, windows]
  for: [scripts, binaries, c, cpp, csharp, go, rust, python, javascript, typescript, php, powershell, batch, shell, pe, elf, macho, dll]
  attack: T1059,T1071.001,T1105
  mbc: B0030

# A URL ending in .exe/.msi was already defined canonically as
# micro-behaviors/communications/http/download/url::executable-url-reference.
# The copy that lived here duplicated that matcher, scanned raw text instead
# of string literals, and called the result a "Remote Windows client URL" --
# so a BoringSSL comment citing a 1992 LISTSERV thread
# (http://listserv.nodak.edu/scripts/wa.exe?A2=...) surfaced under C2
# tasking. Its Unix twin (.pkg/.deb/.rpm), which called an Ansible doc
# example a "Remote Unix client URL", had the same defect and moved to
# micro-behaviors/communications/http/download/url::os-package-url-reference.
# The composite below references both canonical traits.

composite_rules:
  - id: json-command-agent
    desc: HTTP agent executes received commands
    crit: hostile
    conf: 0.99
    # Keep the protocol fields and dispatch call tightly coupled. Bundled
    # debugger/client libraries commonly contain each capability separately.
    near_bytes: 1024
    scope: leaf
    all:
      - id: micro-behaviors/data/serialize/json::command-result-field-pair
      - id: micro-behaviors/process/create/exec::child-process-execution
    any:
      - id: micro-behaviors/communications/http/request/client::http-post-json
      - id: micro-behaviors/communications/http/curl::curl-post-flag

  - id: remote-client-command-agent
    desc: Remote client URL with tasking agent
    crit: hostile
    conf: 0.99
    attack: T1195.002,T1059,T1071.001,T1105
    near_bytes: 12288
    all:
      - id: json-command-agent
    any:
      - id: micro-behaviors/communications/http/download/url::executable-url-reference
      - id: micro-behaviors/communications/http/download/url::os-package-url-reference
