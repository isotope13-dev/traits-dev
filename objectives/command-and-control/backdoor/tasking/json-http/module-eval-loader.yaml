# Fetch-polled tasking that compiles the received code through a fresh
# Node Module instance and evals it. Each leg is dual-use on its own --
# fetch clients, dynamic module loads, and eval all ship in frameworks --
# but a single file that fetches, compiles, and evaluates is a remote
# access loader, not a framework.
#
# Worked example: sra-testing-test telemetry.js, which fetches tasks,
# instantiates Module for the payload, and evals the response body.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  attack: T1105,T1059.007
  mbc: B0009.016
composite_rules:
  - id: fetch-tasking-module-eval-loader
    desc: Fetched tasking executes via dynamic module compile
    crit: hostile
    conf: 0.98
    scope: file
    all:
      - id: metadata/lang/source/syntax/call::single-fetch-call
      - id: micro-behaviors/os/module/load::node-new-module-computed-invocation
      - id: micro-behaviors/process/interpreter/eval/direct::eval-call-text
    unless:
      - id: metadata/package/testing/harness/runtime/
