# A Node or Electron agent that polls a server and runs whatever it answers
# with through two sinks: Node's vm (JavaScript tasks) and a hidden
# PowerShell child given the task as -EncodedCommand or on stdin. Each leg
# is ordinary on its own; an app shipping both code sinks beside an HTTP
# client and window hiding is a remote-tasking backdoor. Seen in the Vinci
# backdoor, a Microsoft Store "Setup Assistant" Electron app (eSentire,
# 2026-11). Obfuscator.io string tables keep the sink names as literals,
# which these legs read; a base64-encoded table hides them, so the
# obfuscated variant below relies on the surviving import and spawn options.
defaults:
  platforms: [windows]
  for: [javascript, typescript]
  attack: T1071.001,T1059.001,T1059.007
  size_max: 2000000

composite_rules:
  - id: node-vm-run-sink
    desc: Node VM run method called or named
    crit: notable
    conf: 0.9
    any:
      - id: micro-behaviors/process/interpreter/vm::vm-run-methods
      - id: micro-behaviors/process/interpreter/vm::vm-run-method-name-literal

  - id: node-agent-vm-and-hidden-encoded-powershell
    desc: Node agent runs fetched tasks in a VM and as hidden encoded PowerShell
    crit: hostile
    conf: 0.95
    ref: https://www.esentire.com/blog/vinci-rat-lives-in-the-microsoft-store
    all:
      - id: node-vm-run-sink
      - id: micro-behaviors/process/argument/executable::js-powershell-name-literal
      - id: metadata/lang/source/syntax/argument::encodedcommand-flag-js
      - id: micro-behaviors/process/argument/visibility
      - id: micro-behaviors/communications/http/request/client/call::js-fetch-call

  - id: obfuscated-node-vm-hidden-detached-spawn
    desc: Obfuscator.io script imports vm, fetches, and spawns detached hidden children
    crit: hostile
    conf: 0.9
    ref: https://www.esentire.com/blog/vinci-rat-lives-in-the-microsoft-store
    all:
      - id: objectives/anti-static/obfuscation/obfuscator/js-obfuscator::javascript-obfuscator-string-array-runtime
      - id: micro-behaviors/process/interpreter/vm::vm-require
      - id: micro-behaviors/process/argument/visibility::windowshide-obfuscated-true
      - id: micro-behaviors/process/daemonize/detach::detached-obfuscated-true
      - id: micro-behaviors/communications/http/request/client/call::js-fetch-call

  - id: downloads-watch-runs-server-task
    desc: Watches Downloads and runs server-supplied code when files appear
    crit: hostile
    conf: 0.93
    ref: https://www.esentire.com/blog/vinci-rat-lives-in-the-microsoft-store
    attack: T1059.007,T1071.001,T1204.002
    near_bytes: 1500
    all:
      - id: micro-behaviors/fs/watch::node-fs-watch-call
      - id: micro-behaviors/fs/path/personal::homedir-downloads-path
      - id: micro-behaviors/communications/http/post::fetch-post-call
    any:
      - id: node-vm-run-sink
      - id: micro-behaviors/process/create/shell/interpreter::node-powershell-launch
