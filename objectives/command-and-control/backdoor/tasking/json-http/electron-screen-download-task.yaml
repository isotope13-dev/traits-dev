defaults:
  platforms: [windows, unix]
  for: [javascript]
  crit: notable
  conf: 0.96
traits:
  - id: electron-screen-capture-task-clues
    desc: Electron screenshot and reporting clues
    if:
      type: yara
      source: |
        rule electron_screen_capture_task_clues {
          strings:
            $capture = "desktopCapturer.getSources" ascii
            $screen = "types: [\"screen\"]" ascii
            $image = "thumbnail.toDataURL" ascii
            $report = "/screenshot" ascii
          condition:
            all of them
        }
  - id: session-download-executable-task-clues
    desc: Session download and executable task clues
    if:
      type: yara
      source: |
        rule session_download_executable_task_clues {
          strings:
            $files = "session.dataFiles" ascii
            $apps = "session.applications" ascii
            $rename = ".log" ascii
            $exe = ".exe" ascii
            $download = "downloadFileFromURL" ascii
          condition:
            all of them
        }
composite_rules:
  # The source shows these capabilities together; the finding does not assert
  # that the remote task service or downloaded executables were operational.
  - id: electron-screenshot-tasked-download-execution
    desc: Electron screenshot and tasked executable download clues
    crit: hostile
    attack: T1059.007,T1105,T1113
    all:
      - id: electron-screen-capture-task-clues
      - id: session-download-executable-task-clues
      - id: metadata/import/npm/axios::axios
      - id: micro-behaviors/process/daemonize/detach::detached-ignored-unref-spawn
      - id: micro-behaviors/os/privilege/elevation::node-powershell-start-process-runas
