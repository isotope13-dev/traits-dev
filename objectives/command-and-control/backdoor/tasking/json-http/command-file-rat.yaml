defaults:
  platforms: [windows, linux, macos]
  for: [python, go, rust, javascript, typescript, csharp]
  attack: T1071.001,T1059,T1105
  mbc: B0022

traits:
  - id: client-id-registration-field
    desc: C2 client identifier field token
    crit: component
    conf: 0.9
    if:
      type: text
      regex: '\b(client_id|ClientID)\b'

  - id: json-content-type-or-accept
    desc: JSON MIME media type token
    crit: component
    conf: 0.9
    not:
      - substr: sourceMappingURL=data:application/json
    if:
      type: text
      regex: '(?i)application/json'

  - id: host-and-user-query-source
    desc: Current username lookup call or variable
    crit: component
    conf: 0.88
    if:
      type: text
      regex: '\b(getuser|USERNAME|whoami|GetUserName)\b'

  - id: hostname-query-source
    desc: Hostname lookup call or environment variable
    crit: component
    conf: 0.88
    if:
      type: text
      regex: '\b(gethostname|COMPUTERNAME|GetComputerName|hostname\(\))\b'

composite_rules:
  - id: cross-lang-json-http-file-shell-rat
    desc: JSON HTTP agent registers host-user ID, runs shell commands, and uploads files
    crit: hostile
    conf: 0.96
    all:
      - id: client-id-registration-field
      - id: micro-behaviors/communications/http/form::multipart-file-field-disposition
      - id: json-content-type-or-accept
      - id: micro-behaviors/process/argument/interpreter::shell-command-spawn-flag
      - id: host-and-user-query-source
      - id: hostname-query-source
