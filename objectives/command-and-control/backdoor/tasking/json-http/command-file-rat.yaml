defaults:
  platforms: [windows, linux, macos]
  for: [python, go, rust, javascript, typescript, csharp]
  attack: T1071.001,T1059,T1105
  mbc: B0022

traits:
  - id: client-id-registration-field
    desc: C2 client identifier field token
    crit: component
    conf: 0.9
    if:
      type: text
      regex: '\b(client_id|ClientID)\b'

  - id: multipart-file-field-disposition
    desc: Multipart file-upload field disposition
    crit: notable
    conf: 0.92
    not:
      - regex: '^\s*(//|/\*|\*|#)'
    if:
      type: text
      regex: '(?i)(form-data;\s*name="file"|files\s*=\s*\{[''"]file[''"])'

  - id: json-content-type-or-accept
    desc: JSON MIME media type token
    crit: component
    conf: 0.9
    not:
      - substr: sourceMappingURL=data:application/json
    if:
      type: text
      regex: '(?i)application/json'

  - id: shell-command-spawn-cmd
    desc: Windows cmd.exe /c inline execution flag
    crit: notable
    conf: 0.94
    not:
      - substr: "//"
    if:
      type: text
      regex: '(?i)(//[^\r\n]{0,30})?\bcmd(\.exe)?[^\r\n]{1,20}["''\s]/c\b'

  - id: shell-command-spawn-ps
    desc: PowerShell -Command inline execution flag
    crit: notable
    conf: 0.94
    not:
      - substr: "//"
    if:
      type: text
      regex: '(?i)(//[^\r\n]{0,30})?\bpowershell[^\r\n]{1,24}-(c|command)\b'

  - id: shell-command-spawn-unix
    desc: Unix shell inline execution flag
    crit: notable
    conf: 0.94
    not:
      - substr: "//"
      - substr: "#"
    if:
      type: text
      regex: '(//[^\r\n]{0,30}|#[^\r\n]{0,30})?(/bin/|["''\s])(ba)?sh[\s"'',]{1,8}-c["''\s]'

  - id: host-and-user-query-source
    desc: Current username lookup call or variable
    crit: component
    conf: 0.88
    if:
      type: text
      regex: '\b(getuser|USERNAME|whoami|GetUserName)\b'

  - id: hostname-query-source
    desc: Hostname lookup call or environment variable
    crit: component
    conf: 0.88
    if:
      type: text
      regex: '\b(gethostname|COMPUTERNAME|GetComputerName|hostname\(\))\b'

composite_rules:
  - id: shell-command-spawn-flag
    desc: Command-shell inline execution flag
    crit: notable
    conf: 0.94
    any:
      - id: shell-command-spawn-cmd
      - id: shell-command-spawn-ps
      - id: shell-command-spawn-unix

  - id: cross-lang-json-http-file-shell-rat
    desc: JSON HTTP agent registers host-user ID, runs shell commands, and uploads files
    crit: hostile
    conf: 0.96
    all:
      - id: client-id-registration-field
      - id: multipart-file-field-disposition
      - id: json-content-type-or-accept
      - id: shell-command-spawn-flag
      - id: host-and-user-query-source
      - id: hostname-query-source
