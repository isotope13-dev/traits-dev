# Structured HTTP backdoors that register a detailed host profile, then expose
# shell, file-transfer, and Beacon Object File tasking. These match protocol
# structure and task capabilities rather than campaign infrastructure.
defaults:
  platforms: [unix, windows]
  for: [scripts, source, pe, dll, elf, macho]
  attack: T1071.001,T1059,T1105,T1620
  mbc: B0030

traits:
  # The four dispatch legs below are grammar fragments: a generic task word
  # within 120 characters of a protocol token ("shell", "upload"…). Any
  # config-driven runner or bot API matches one alone -- a knowledge CLI's
  # materializer (`case "shell"`) did -- so the RAT grammar exists only in
  # the composites that require several branches at once.
  - id: shell-task-dispatch-branch
    desc: Dispatches a shell task token
    crit: component
    conf: 0.94
    for: [scripts, source]
    if:
      type: text
      regex: '(?i)(strcmp|case|cmd|command|task).{0,120}["'']shell["'']'

  - id: upload-task-dispatch-branch
    desc: Dispatches an upload task token
    crit: component
    conf: 0.94
    for: [scripts, source]
    if:
      type: text
      regex: '(?i)(strcmp|case|cmd|command|task).{0,120}["'']upload["'']'

  - id: download-task-dispatch-branch
    desc: Dispatches a download task token
    crit: component
    conf: 0.94
    for: [scripts, source]
    if:
      type: text
      regex: '(?i)(strcmp|case|cmd|command|task).{0,120}["'']download["'']'

  - id: bof-task-dispatch-branch
    desc: Dispatches a Beacon Object File task token
    crit: component
    conf: 0.96
    for: [scripts, source]
    if:
      type: text
      regex: '(?i)(strcmp|case|cmd|command|task).{0,120}["'']bof["'']'

  - id: upload-server-target-task-usage
    desc: Upload task maps server file to path
    crit: notable
    conf: 0.97
    if:
      type: text
      regex: '(?i)Usage\s*:\s*upload\s+<server_filename>\s*:\s*<target_path>'

  - id: encoded-bof-task-usage
    desc: BOF task accepts encoded object and arguments
    crit: suspicious
    conf: 0.99
    if:
      type: text
      regex: '(?i)Usage\s*:\s*bof\s+<encoded_bof>\s*:\s*<encoded_args>'

composite_rules:
  - id: shell-file-bof-tasking-roster
    desc: Dispatches shell file-transfer and BOF tasks
    crit: suspicious
    conf: 0.99
    for: [scripts, source]
    all:
      - id: shell-task-dispatch-branch
      - id: upload-task-dispatch-branch
      - id: download-task-dispatch-branch
      - id: bof-task-dispatch-branch
    near_bytes: 4096

  - id: encoded-bof-upload-tasking-grammar
    desc: Encoded BOF and upload task grammar
    crit: suspicious
    conf: 0.99
    all:
      - id: upload-server-target-task-usage
      - id: encoded-bof-task-usage
    near_bytes: 1024

  - id: profiled-http-beacon-registration
    desc: HTTP beacon registers host process and privilege profile
    crit: hostile
    conf: 0.99
    near_bytes: 8192
    all:
      - id: micro-behaviors/communications/http/url/telemetry::beacon-path-token
      - id: micro-behaviors/data/serialize/schema-object::host-process-privilege-profile-schema
    any:
      - id: micro-behaviors/communications/http/post::post-method-detection
      - id: micro-behaviors/communications/http/client/winhttp::winhttp-send-request
      - id: micro-behaviors/communications/http/message::raw-http-body-request-line
      - id: micro-behaviors/communications/http/message::raw-http-body-request-line-source

  - id: chunked-file-shell-bof-backdoor
    desc: Beacon protocol exposes chunked transfer shell and BOF tasking
    crit: hostile
    conf: 0.99
    near_bytes: 8192
    all:
      - id: micro-behaviors/communications/http/url/telemetry::beacon-path-token
      - id: micro-behaviors/data/serialize/schema-object::chunked-file-transfer-schema
    any:
      - id: shell-file-bof-tasking-roster
      - id: encoded-bof-upload-tasking-grammar
