defaults:
  platforms: [windows, unix]
  for: [go, pe]
  attack: T1059.003,T1083,T1105
  mbc: B0022,B0030

traits:
  - id: shell-task-token
    desc: RAT shell task token
    crit: component
    conf: 0.92
    if:
      type: string_literal
      exact: shell
  - id: heartbeat-task-token
    desc: RAT heartbeat-control task token
    crit: component
    conf: 0.96
    if:
      type: string_literal
      exact: set_heartbeat
  - id: upload-task-token
    desc: RAT upload task token
    crit: component
    conf: 0.9
    if:
      type: string_literal
      exact: upload
  - id: download-task-token
    desc: RAT download task token
    crit: component
    conf: 0.9
    if:
      type: string_literal
      exact: download
  - id: list-directory-task-token
    desc: RAT directory-listing task token
    crit: component
    conf: 0.96
    if:
      type: string_literal
      exact: list_dir

composite_rules:
  - id: go-shell-file-tasking-roster
    desc: Go RAT shell and file task roster
    crit: suspicious
    conf: 0.99
    all:
      - id: micro-behaviors/process/create/direct::exec-command
    needs: 4
    any:
      - id: shell-task-token
      - id: heartbeat-task-token
      - id: upload-task-token
      - id: download-task-token
      - id: list-directory-task-token
