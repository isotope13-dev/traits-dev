defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, npm, tar]
  attack: T1071.001

composite_rules:
  - id: node-split-fetch-reflect-apply-channel-tasking
    desc: Concealed fetch accompanies remote zsh prompt execution
    crit: hostile
    conf: 0.99
    scope: archive
    all:
      - id: micro-behaviors/os/module/dynamic-load::js-array-join-fetch-token
      - id: objectives/anti-static/obfuscation/imports/concealment::node-split-array-binding-spawn-sync
      - id: objectives/command-and-control/remote-command/control/terminal::reflective-json-zsh-prompt-channel

  # Shell-start polling: the package registers code that runs whenever a
  # shell starts or redraws its prompt (a home-relative `source` line or a
  # zsh precmd hook) and that code fetches JSON from a channel through a
  # fetch name it refuses to spell. The response is stored for the next
  # stage. Concealing `fetch` in a script tied to every shell start is
  # tasking, not an update check.
  - id: shell-start-hook-concealed-fetch-channel
    desc: Shell-start hook polls concealed remote JSON channel
    crit: hostile
    conf: 0.95
    attack: T1071.001,T1546.004
    scope: archive
    all:
      - id: micro-behaviors/os/module/dynamic-load::js-array-join-fetch-token
      - id: micro-behaviors/communications/http/client/response-body::response-json-no-argument-call
    any:
      - id: micro-behaviors/process/interpreter/eval/source::home-relative-source-command
      - id: micro-behaviors/os/application/config::zsh-precmd-hook-command
