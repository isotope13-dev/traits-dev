defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, npm, tar]
  attack: T1071.001

composite_rules:
  - id: node-split-fetch-reflect-apply-channel-tasking
    desc: Concealed fetch accompanies remote zsh prompt execution
    crit: hostile
    conf: 0.99
    scope: archive
    all:
      - id: micro-behaviors/os/module/dynamic-load::js-array-join-fetch-token
      - id: objectives/anti-static/obfuscation/imports/concealment::node-split-array-binding-spawn-sync
      - id: objectives/command-and-control/remote-command/control/terminal::reflective-json-zsh-prompt-channel
