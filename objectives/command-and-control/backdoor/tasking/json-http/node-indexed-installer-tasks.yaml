defaults:
  platforms: [windows]
  for: [javascript]
  crit: notable
  conf: 0.95
traits:
  - id: js-indexed-link-task-key
    desc: JavaScript constructs indexed link key
    if:
      type: text
      regex: 'link\$\{[A-Za-z_][A-Za-z0-9_]*\}'
  - id: js-indexed-python-task-key
    desc: JavaScript constructs indexed Python key
    if:
      type: text
      regex: 'python\$\{[A-Za-z_][A-Za-z0-9_]*\}'
composite_rules:
  # These source facts do not by themselves bind response fields to exec.
  - id: node-indexed-download-python-task-clues
    desc: Numbered download and Python tasking clues
    crit: hostile
    conf: 0.96
    attack: T1105,T1059.006,T1059.007
    all:
      - id: js-indexed-link-task-key
      - id: js-indexed-python-task-key
      - id: micro-behaviors/communications/http/download/handler::javascript-download-helper-call
      - id: micro-behaviors/communications/http/post::axios-post-call
      - id: micro-behaviors/process/create/shell/variable-command::node-exec-command-variable
      - id: micro-behaviors/os/package-manager/config::msiexec-quiet-switch
      - id: micro-behaviors/time/schedule/interval::setInterval
