defaults:
  platforms: [windows]
  for: [pe, dll, c, cpp]
  attack: "T1105, T1059"
  mbc: B0022
composite_rules:
  - id: c2-download-run-tasking-clues
    desc: C2 endpoint and DOWNLOAD_RUN tasking clues
    crit: hostile
    conf: 0.96
    all:
      - id: objectives/command-and-control/channel/http/transport::client-file-transfer-endpoint
      - id: objectives/command-and-control/backdoor/tasking/payload::download-run-command
    any:
      - id: micro-behaviors/os/handler/open::shell-execute
      - id: micro-behaviors/os/handler/open::shell-execute-ex
      - id: metadata/binary/symbols/name/process::create-process-w
      - id: micro-behaviors/communications/http/client/wininet::wininet-session-request-api-set
      - id: micro-behaviors/communications/http/client/wininet::wininet-http-client-src
