# DNS TXT capture near expression evaluation suggests tasking; the two
# observations do not establish a shared data flow.
defaults:
  crit: suspicious
  platforms: [windows]
  for: [powershell, html]
  attack: T1071.004

composite_rules:
  - id: powershell-dns-txt-command-exec
    for: [html]
    desc: DNS TXT capture and PowerShell eval text
    conf: 0.98
    near_bytes: 1024
    all:
      - id: micro-behaviors/communications/dns/txt::powershell-nslookup-txt-capture
      - id: micro-behaviors/process/interpreter/eval/powershell::powershell-expression-command-text

  - id: powershell-explicit-resolver-dns-txt-exec
    for: [html]
    desc: DNS capture, eval text and explicit resolver
    conf: 0.99
    near_bytes: 1024
    all:
      - id: powershell-dns-txt-command-exec
      - id: micro-behaviors/communications/dns/txt::nslookup-txt-explicit-resolver

  - id: powershell-reconstructed-host-dns-txt-exec
    for: [html]
    desc: DNS capture, eval text and string join
    conf: 0.98
    near_bytes: 1024
    all:
      - id: powershell-dns-txt-command-exec
      - id: micro-behaviors/data/string/concat/join::powershell-string-join

  - id: powershell-dns-txt-double-eval
    for: [html]
    desc: DNS capture and chained PowerShell eval text
    conf: 0.99
    near_bytes: 1024
    all:
      - id: powershell-dns-txt-command-exec
      - id: micro-behaviors/process/interpreter/eval/powershell::embedded-powershell-chained-iex

