defaults:
  for: [npm, tar, javascript, typescript]
  platforms: [unix, windows]

composite_rules:
  - id: node-txt-helper-decoded-shell
    desc: DNS TXT helper accompanies decoded shell command attempt
    crit: hostile
    conf: 0.98
    attack: T1071.004,T1059.004
    scope: archive
    all:
      - id: micro-behaviors/communications/dns/txt::node-txt-fields-helper-call
      - id: micro-behaviors/communications/dns/txt::source-txt-query-command
      - id: micro-behaviors/process/argument/positional::node-base32-shell-argv
