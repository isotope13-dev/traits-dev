defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
composite_rules:
  - id: js-dns-txt-fields-shell-exec
    desc: Node passes DNS TXT results to shell execution
    crit: hostile
    conf: 0.99
    attack: T1071.004,T1059.004
    all:
      - id: micro-behaviors/process/create/shell/variable-command::node-resolvetxt-shell-argument
      - id: micro-behaviors/communications/dns/txt::resolve-txt
      - id: metadata/import/npm/dns
