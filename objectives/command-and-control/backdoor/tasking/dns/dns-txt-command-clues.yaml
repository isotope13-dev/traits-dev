---
defaults:
  platforms:
  - windows
  - unix
  for:
  - python
  - powershell
  - javascript
  - typescript
  - go
composite_rules:
- id: python-variable-subprocess-launch
  desc: Python subprocess launch with a variable command
  crit: component
  conf: 0.95
  for:
  - python
  any:
  - id: micro-behaviors/process/create/shell/variable-command::python-variable-command-through-shell
  - id: micro-behaviors/process/create/shell/variable-command::python-popen-variable-shell
  - id: micro-behaviors/process/create/shell/variable-command::python-subprocess-sh-c-runtime-command
  - id: micro-behaviors/process/create/shell/variable-command::variable-command-shell-true
- id: python-dns-txt-subprocess
  desc: Python TXT lookup near variable subprocess command
  crit: suspicious
  conf: 0.95
  for:
  - python
  near_lines: 30
  all:
  - id: objectives/command-and-control/backdoor/tasking/dns::python-variable-subprocess-launch
  any:
  - id: micro-behaviors/communications/dns/txt::python-dnspython-query-txt
  - id: micro-behaviors/communications/dns/txt::python-dnspython-resolve-txt
- id: javascript-dns-txt-exec
  desc: Node TXT lookup near execSync call
  crit: suspicious
  conf: 0.95
  for:
  - javascript
  - typescript
  near_lines: 30
  all:
  - id: micro-behaviors/communications/dns/txt::resolve-txt
  - id: micro-behaviors/process/create/shell/command-string::execSync-call
- id: go-dns-txt-command-exec
  desc: Go DNS TXT capture and command setup
  crit: suspicious
  conf: 0.97
  for:
  - go
  near_lines: 30
  all:
  - id: micro-behaviors/communications/dns/txt::go-dns-txt-response-capture
  - id: micro-behaviors/process/create/subprocess/configure::go-exec-command-call
- id: powershell-dns-txt-iex
  desc: PowerShell DNS TXT and IEX clues
  crit: suspicious
  conf: 0.97
  for:
  - powershell
  near_lines: 40
  all:
  - id: micro-behaviors/communications/dns/txt::source-txt-response
  - id: micro-behaviors/process/interpreter/eval/powershell::powershell-iex-call
- id: dns-txt-response-exec-chain
  desc: DNS TXT and command execution clues
  crit: suspicious
  conf: 0.96
  any:
  - id: objectives/command-and-control/backdoor/tasking/dns::python-dns-txt-subprocess
  - id: objectives/command-and-control/backdoor/tasking/dns::powershell-dns-txt-iex
  - id: objectives/command-and-control/backdoor/tasking/dns::javascript-dns-txt-exec
  - id: objectives/command-and-control/backdoor/tasking/dns::go-dns-txt-command-exec
