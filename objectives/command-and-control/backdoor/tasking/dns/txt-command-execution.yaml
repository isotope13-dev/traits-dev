defaults:
  platforms:
  - windows
  - unix
  for:
  - scripts
  - source
  attack: T1071.004
  mbc: B0030

composite_rules:
  - id: python-dns-txt-code-exec
    desc: Python executes DNS TXT response
    for:
      - python
    crit: hostile
    conf: 0.98
    near_lines: 20
    all:
      - id: micro-behaviors/communications/dns/txt::python-dns-txt-response-capture
    any:
      - id: micro-behaviors/process/interpreter/eval/python-builtins::exec-variable
      - id: micro-behaviors/process/interpreter/eval/python-builtins::eval-builtin
  - id: node-dns-txt-code-exec
    desc: Node.js executes DNS TXT response
    for:
      - javascript
      - typescript
    crit: hostile
    conf: 0.98
    near_lines: 20
    all:
      - id: micro-behaviors/communications/dns/txt::node-resolve-txt-response-capture
    any:
      - id: micro-behaviors/process/interpreter/eval/javascript::js-eval-variable-argument
      - id: micro-behaviors/metaprogramming/generation/function::js-new-function-variable-argument
      - id: micro-behaviors/process/interpreter/eval/indirect::js-indirect-eval-variable
  - id: ruby-dns-txt-code-exec
    desc: Ruby executes DNS TXT response
    for:
      - ruby
    crit: hostile
    conf: 0.98
    near_lines: 20
    all:
      - id: micro-behaviors/communications/dns/txt::ruby-dns-txt-response-capture
      - id: micro-behaviors/process/interpreter/eval/direct::ruby-eval
  - id: php-dns-txt-code-exec
    desc: PHP executes DNS TXT response
    for:
      - php
    crit: hostile
    conf: 0.98
    near_lines: 20
    all:
      - id: micro-behaviors/communications/dns/txt::php-dns-txt-response-capture
      - id: micro-behaviors/process/interpreter/eval/direct::eval-call
  - id: perl-dns-txt-code-exec
    desc: Perl executes DNS TXT response
    for:
      - perl
    crit: hostile
    conf: 0.98
    near_lines: 20
    all:
      - id: micro-behaviors/communications/dns/txt::perl-dns-txt-response-capture
      - id: micro-behaviors/process/interpreter/eval/direct::perl-eval-variable
  - id: shell-dns-txt-code-exec
    desc: Shell executes DNS TXT response
    for:
      - shell
    crit: hostile
    conf: 0.98
    near_lines: 20
    all:
      - id: micro-behaviors/communications/dns/txt::shell-dns-txt-response-capture
      - id: micro-behaviors/process/interpreter/eval/direct::shell-eval
  - id: source-dns-txt-shell-command
    desc: Source executes a shell command after a DNS TXT lookup
    crit: hostile
    conf: 0.97
    attack: T1071.004,T1059.004
    near_lines: 120
    for:
      - c
      - cpp
      - elixir
    scope: file
    all:
      - id: micro-behaviors/communications/dns/txt::nslookup-txt-command-source
    any:
      - id: micro-behaviors/process/interpreter/shell::shell-dynamic-command-execution
      - id: metadata/lang/source/syntax/command/pipeline::shell-pipe-token
  - id: zig-dns-txt-shell-command
    desc: Zig executes a shell command from DNS TXT fields
    crit: hostile
    conf: 0.98
    attack: T1071.004,T1059.004
    near_lines: 80
    for:
      - zig
    scope: file
    all:
      - id: micro-behaviors/communications/dns/txt::zig-txt-fields-call
      - id: metadata/lang/source/syntax/member::zig-child-init
    any:
      - id: micro-behaviors/process/interpreter/shell::shell-dynamic-command-execution
      - id: metadata/lang/source/syntax/command/pipeline::shell-pipe-token
  - id: source-dns-txt-fields-shell-exec
    desc: Source runs shell command from DNS TXT fields
    crit: hostile
    conf: 0.98
    attack: T1071.004,T1059.004
    near_lines: 30
    scope: file
    all:
      - id: micro-behaviors/communications/dns/txt::source-txt-fields-call
      - id: micro-behaviors/process/deploy/interpreter-command::jvm-sh-c-argument-pass
  - id: js-dns-txt-fields-shell-exec
    desc: JavaScript runs shell command from DNS TXT fields
    crit: hostile
    conf: 0.98
    attack: T1071.004,T1059.004
    near_lines: 30
    for:
      - javascript
      - typescript
    scope: file
    all:
      - id: micro-behaviors/communications/dns/txt::source-txt-fields-call
      - id: micro-behaviors/process/create/exec::js-execfile-call
      - id: micro-behaviors/fs/path/application/interpreter::unix-shell-executable-path
  - id: python-dns-txt-decoded-shell-exec
    desc: Python executes decoded shell command from DNS TXT query
    crit: hostile
    conf: 0.98
    attack: T1071.004,T1059.004,T1140
    for:
      - python
    scope: file
    all:
      - id: micro-behaviors/communications/dns/txt::source-txt-query-command
      - id: micro-behaviors/process/create/shell/variable-command::python-subprocess-sh-c-runtime-command
      - id: micro-behaviors/process/argument/positional::python-decoded-bytes-subprocess-argv
