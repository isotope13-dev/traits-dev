# C2 implant helpers that turn a local helper binary into Donut-style
# shellcode and queue it as the next beacon task. The generate-then-task
# relationship is the durable shape, not the helper filename.
defaults:
  platforms: [windows]
  for: [python]
  attack: T1055,T1106

traits:
  - id: python-shellcode-generate
    desc: Generates shellcode from a helper binary
    crit: notable
    conf: 0.94
    if:
      type: text
      substr: shellcode.generate(
  - id: python-beacon-task-assign
    desc: Assigns generated data as a beacon task
    crit: notable
    conf: 0.93
    if:
      type: text
      regex: 'beacons\[.{0,60}\]\["task"\]\s*='
  - id: python-no-active-beacon
    desc: Guards on an active beacon session
    crit: notable
    conf: 0.9
    if:
      type: text
      substr: No active beacon

composite_rules:
  - id: python-shellcode-beacon-task
    desc: Shellcode generate queued as a beacon task
    crit: hostile
    conf: 0.97
    all:
      - id: python-shellcode-generate
      - id: python-beacon-task-assign
  - id: python-shellcode-beacon-guard
    desc: Shellcode generate gated on an active beacon
    crit: hostile
    conf: 0.95
    all:
      - id: python-shellcode-generate
      - id: python-no-active-beacon
  - id: python-beacon-task-session-guard
    desc: Beacon tasking gated on an active session
    crit: hostile
    conf: 0.94
    all:
      - id: python-beacon-task-assign
      - id: python-no-active-beacon
