defaults:
  platforms: [netscaler, appliance, unix]
  for: [class, jar]
  attack: T1102

traits:
  - id: jvm-api-beacon-hex
    desc: JVM API beacon hex
    crit: suspicious
    conf: 0.94
    if:
      type: hex
      pattern: "2F 61 70 69 2F 76 31 2F 62 65 61 63 6F 6E"
    unless:
      - type: basename
        regex: '\.(?:zip|whl|vsix|xpi|crx)$'
      - type: basename
        regex: '\.(?:asar|7z)$'

  - id: jvm-api-report-hex
    desc: JVM API report hex
    crit: suspicious
    conf: 0.94
    if:
      type: hex
      pattern: "2F 61 70 69 2F 76 31 2F 72 65 70 6F 72 74"
    unless:
      - type: basename
        regex: '\.(?:zip|whl|vsix|xpi|crx)$'
      - type: basename
        regex: '\.(?:asar|7z)$'

  # `/api/v1/config` is an ordinary REST path, so this is a component of
  # `jvm-netscaler-bytecode-tasking` below rather than a standalone verdict;
  # only `jvm-api-beacon-hex` names an endpoint a normal service would not
  # expose. The literal was also unbounded, so it matched inside longer
  # paths: Kubernetes' CoreV1Api declares `/api/v1/configmaps`, and Apache
  # Druid bundles the Java client. The trailing class keeps the exact
  # NetScaler endpoint and drops the prefix matches.
  - id: jvm-api-config-hex
    desc: JVM API config hex
    crit: component
    conf: 0.92
    if:
      type: text
      regex: '/api/v1/config($|[^A-Za-z0-9_-])'

composite_rules:
  - id: jvm-netscaler-bytecode-tasking
    desc: JVM NetScaler bytecode tasking
    crit: hostile
    conf: 0.98
    all:
      - id: jvm-api-beacon-hex
    any:
      - id: jvm-api-report-hex
      - id: jvm-api-config-hex
