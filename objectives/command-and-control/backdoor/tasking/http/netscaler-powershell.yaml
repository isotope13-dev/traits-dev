defaults:
  platforms: [windows]
  for: [powershell]
  attack: T1102

# Removed: suspicious atomic `ps-netscaler-encoded-remote-cmd`
# (substr `powershell.exe -NoProfile -EncodedCommand`). That matcher detects
# a generic encoded-command invocation, nothing NetScaler-specific, and
# duplicates micro-behaviors/process/create/hidden::encodedcommand-invocation,
# so the hostiles below reference the canonical trait instead.
composite_rules:
  - id: ps-netscaler-agent-http-tasking
    desc: PowerShell NetScaler HTTP tasking
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/communications/http/url/api-path::agent-register-path
      - id: micro-behaviors/communications/http/url/api-path::agent-beacon-path
    any:
      - id: micro-behaviors/communications/http/url/api-path::agent-task-result-path
      - id: micro-behaviors/process/create/hidden::encodedcommand-invocation

  - id: ps-netscaler-task-result-channel
    desc: PowerShell NetScaler task result
    crit: hostile
    conf: 0.97
    all:
      - id: micro-behaviors/communications/http/url/api-path::agent-task-result-path
      - id: micro-behaviors/process/create/hidden::encodedcommand-invocation
