defaults:
  platforms: [windows]
  for: [pe]
  attack: T1071.001,T1059.001
composite_rules:
  - id: http-task-result-shell-dispatch
    desc: Task and result URLs beside a PowerShell and cmd switch
    crit: hostile
    conf: 0.97
    near_bytes: 512
    all:
      - id: micro-behaviors/communications/http/url/api-path::http-tasks-path
      - id: micro-behaviors/communications/http/url/api-path::http-results-path
      - id: objectives/execution/interpreter/powershell::adjacent-powershell-cmd-switch
    unless:
      - id: metadata/signed/platform/
