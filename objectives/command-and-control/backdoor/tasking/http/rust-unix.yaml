defaults:
  platforms: [unix]
  for: [rust]
  attack: T1059

traits:
  - id: rust-command-endpoint-url
    desc: Rust command endpoint URL
    crit: suspicious
    conf: 0.92
    if:
      type: literal
      # Short C2-style paths (host + ≤3 segments + /command). Deep docs URLs
      # like MDN …/Web/API/CommandEvent/command are not tasking endpoints.
      regex: 'https?://[^/"''\s]{1,80}(/[^/"''\s]{1,48}){0,3}/command\b'
    not:
      - regex: 'developer\.mozilla\.org/'
      - regex: '/docs/Web/API/'
      - regex: 'docs\.rs/'

    unless:
    - id: metadata/package/files/system-package::debian-missing-sources-vendored-crate
  - id: rust-ureq-post-command
    desc: Rust ureq command POST
    crit: suspicious
    conf: 0.9
    if:
      type: text
      regex: 'ureq::post\(C2_ENDPOINT\)'

  - id: rust-command-result-send-string
    desc: Rust sends command result string
    crit: suspicious
    conf: 0.92
    if:
      type: text
      regex: '\bcmd_result\b[\s\S]{0,240}\bsend_string\b'
  - id: rust-command-result-send-json
    desc: Rust sends command result JSON
    crit: suspicious
    conf: 0.92
    if:
      type: text
      regex: '\bcmd_result\b[\s\S]{0,240}\bsend_json\b'
  - id: rust-command-result-named-send-string
    desc: Rust sends named command result string
    crit: suspicious
    conf: 0.92
    if:
      type: text
      regex: '\bcommand_result\b[\s\S]{0,240}\bsend_string\b'
  - id: rust-command-result-named-send-json
    desc: Rust sends named command result JSON
    crit: suspicious
    conf: 0.92
    if:
      type: text
      regex: '\bcommand_result\b[\s\S]{0,240}\bsend_json\b'

composite_rules:
  - id: rust-http-command-tasking
    desc: Rust HTTP command tasking
    crit: hostile
    conf: 0.98
    all:
      - id: rust-command-endpoint-url
      - id: rust-ureq-post-command
      - id: micro-behaviors/process/create/shell/runner::rust-shell-command-exec
      - id: rust-command-result-send-string
      - id: rust-command-result-send-json
      - id: rust-command-result-named-send-string
      - id: rust-command-result-named-send-json
