defaults:
  platforms: [unix, windows]
  for: [python]
  attack: T1059.006,T1505.003
  mbc: B0024

traits:
  - id: python-http-url-code-evaluator
    desc: Python request URL near code evaluator call
    crit: suspicious
    conf: 0.98
    if:
      type: text
      # A request.url reference is normal web-framework plumbing. Require the
      # evaluator call in the same source region so this atom represents the
      # attack-specific URL-to-evaluation relationship it is named for.
      regex: '(?s)\b(_request|request)\.url\b.{0,600}\b(execResult|exec_result)\s*\('

  - id: python-http-exec-result-call
    desc: Python HTTP handler calls a code evaluator
    crit: suspicious
    conf: 0.98
    if:
      type: text
      regex: '\b(execResult|exec_result)\s*\('

composite_rules:
  - id: python-http-url-eval-backdoor
    desc: Python HTTP URL code-execution backdoor
    crit: hostile
    conf: 0.99
    all:
      - id: python-http-url-code-evaluator
      - id: python-http-exec-result-call
    any:
      - id: micro-behaviors/communications/http/server/framework::flask-framework
      - id: micro-behaviors/communications/http/server/framework::python-http-route-basic-method
      - id: micro-behaviors/communications/socket/bind/address::bind-all-interfaces
    needs: 1
