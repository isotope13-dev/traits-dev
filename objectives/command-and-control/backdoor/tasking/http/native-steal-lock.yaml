defaults:
  platforms:
  - windows
  for:
  - pe
  - dll
traits:
- id: bang-stealer-task-token
  desc: Bang-prefixed stealer task token
  crit: notable
  conf: 0.94
  if:
    type: raw
    section: .rdata
    regex: '\x00!steal(er)?\x00'
- id: bang-winlocker-task-token
  desc: Bang-prefixed screen-lock task token
  crit: notable
  conf: 0.94
  if:
    type: raw
    section: .rdata
    regex: '\x00!winlock(er)?\x00'
composite_rules:
- id: native-stealer-locker-command-interface
  desc: Exported steal/lock tasks with HTTP APIs
  crit: hostile
  conf: 0.98
  attack: T1071.001
  all:
  - id: bang-stealer-task-token
  - id: bang-winlocker-task-token
  - id: metadata/binary/symbols/exports::command-handler-export-name
  - id: micro-behaviors/communications/http/header/custom::declared-stealer-upload-header
  - id: micro-behaviors/communications/http/client/wininet::http-send-request
  - id: micro-behaviors/process/create/exec::create-process-a
