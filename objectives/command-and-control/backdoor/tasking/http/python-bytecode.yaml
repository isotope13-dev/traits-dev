defaults:
  platforms: [windows]
  for: [pyc]
  attack: T1059.003,T1071.001,T1486

composite_rules:
  # Function names alone are common in legitimate worker agents. Coupling the
  # complete fetch/dispatch/loop vocabulary to an external HTTP endpoint and
  # independently proven file-encryption impact identifies remote tasking in a
  # ransomware implant without relying on its campaign domain or ransom text.
  - id: python-ransomware-command-tasking
    desc: Python ransomware polls HTTP tasking and dispatches commands
    crit: hostile
    conf: 0.99
    all:
      - id: metadata/lang/source/naming/function/command::pyc-fetch-command-text
      - id: metadata/lang/source/naming/function/command::pyc-execute-command-text
      - id: metadata/lang/source/naming/function/command::pyc-command-loop-text
      - id: micro-behaviors/communications/url/host/oob-http::url-external-ip-binary
      - id: metadata/binary/code/bytecode::python-bytecode-recursive-encrypt-helper
      - id: metadata/binary/code/bytecode::python-bytecode-encrypt-file-helper
      - id: objectives/impact/ransom/encrypt/bytecode::readme-decrypt-note
    any:
      - id: objectives/impact/ransom/encrypt/bytecode::cryptor-extension
      - id: objectives/impact/ransom/encrypt/bytecode::enc-extension
