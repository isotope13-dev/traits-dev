defaults:
  platforms: [windows]
  for: [pyc]
  attack: T1059.003,T1071.001,T1486

traits:
  - id: fetch-command-name
    desc: Python bytecode remote-command fetcher name
    crit: component
    conf: 0.9
    if:
      type: text
      exact: fetch_command

  - id: execute-command-name
    desc: Python bytecode command dispatcher name
    crit: component
    conf: 0.9
    if:
      type: text
      exact: execute_command

  - id: command-loop-name
    desc: Python bytecode command polling-loop name
    crit: component
    conf: 0.9
    if:
      type: text
      exact: command_loop

composite_rules:
  # Function names alone are common in legitimate worker agents. Coupling the
  # complete fetch/dispatch/loop vocabulary to an external HTTP endpoint and
  # independently proven file-encryption impact identifies remote tasking in a
  # ransomware implant without relying on its campaign domain or ransom text.
  - id: python-ransomware-command-tasking
    desc: Python ransomware polls HTTP tasking and dispatches commands
    crit: hostile
    conf: 0.99
    all:
      - id: fetch-command-name
      - id: execute-command-name
      - id: command-loop-name
      - id: micro-behaviors/communications/http/url/external-ip::url-external-ip-binary
      - id: objectives/impact/ransom/encrypt/bytecode::encrypt-recursive
      - id: objectives/impact/ransom/encrypt/bytecode::encrypt-file-helper
      - id: objectives/impact/ransom/encrypt/bytecode::readme-decrypt-note
    any:
      - id: objectives/impact/ransom/encrypt/bytecode::cryptor-extension
      - id: objectives/impact/ransom/encrypt/bytecode::enc-extension
