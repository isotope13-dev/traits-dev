# This file describes generated offensive-agent code. Its three capabilities
# can be hostile while the unconfigured source template is ruled dual-use.
# Emitting the code as quoted data without launching it is a negative control.
defaults:
  platforms: [unix]
  for: [shell]
composite_rules:
  - id: shell-emitted-python-http-command-agent
    desc: Generates and launches an HTTP command agent
    crit: hostile
    conf: 0.99
    attack: T1059.006,T1071.001
    all:
      - id: micro-behaviors/process/deploy/file-exec/command::shell-launches-heredoc-written-python
      - id: micro-behaviors/process/create/shell/interpreter::heredoc-python-http-shell-dispatch
  - id: shell-emitted-http-agent-native-code-task
    desc: Generated HTTP agent executes native-code tasks
    crit: hostile
    conf: 0.99
    attack: T1059.006,T1106
    all:
      - id: shell-emitted-python-http-command-agent
      - id: micro-behaviors/process/deploy/native-call::heredoc-python-native-memory-callback
  - id: shell-emitted-http-agent-file-upload
    desc: Generated HTTP agent supports file uploads
    crit: hostile
    conf: 0.99
    attack: T1041
    all:
      - id: shell-emitted-python-http-command-agent
      - id: metadata/file/profile/http-upload::heredoc-python-multipart-file-upload
