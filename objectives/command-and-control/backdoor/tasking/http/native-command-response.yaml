defaults:
  platforms: [linux, macos, windows]
  for: [elf, macho, pe]
  attack: T1071.001,T1059
  mbc: B0030,B0011

composite_rules:
  - id: native-http-command-response-backdoor
    desc: Native HTTP tasking returns command output
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/communications/http/route::api-attach-route
      - id: micro-behaviors/communications/http/route::api-request-route
      - id: micro-behaviors/communications/http/route::api-response-route
      - id: micro-behaviors/process/create/popen::c-popen
      - id: micro-behaviors/fs/file/read::fgets-api-import
    any:
      - id: micro-behaviors/communications/http/download/curl::libcurl-http
      - id: micro-behaviors/communications/http/download/curl::macos-libcurl-http
