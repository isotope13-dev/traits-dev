defaults:
  platforms: [unix, windows]
  for: [python, whl, zip]
composite_rules:
  - id: python-rc4-http-browser-shell-agent
    desc: RC4 HTTP agent combines shell and credentials
    crit: hostile
    conf: 0.97
    scope: archive
    attack: T1071.001,T1059,T1555.003
    all:
      - id: micro-behaviors/crypto/symmetric/stream/rc4::python-rc4-md5-http-profile
      - id: micro-behaviors/process/create/subprocess::python-decoded-bytes-subprocess-argv
    # Query atoms also work when a larger browser profile is reported only
    # after the archive's first composite pass. They state the required data.
    any:
      - id: micro-behaviors/data/db/access::chromium-login-sql
      - id: micro-behaviors/data/db/access::chromium-encrypted-cookie-sql
