defaults:
  platforms: [unix]
  for: [javascript, typescript]
  attack: T1059.007

traits:
  - id: node-c2-action-vocabulary
    desc: Exfiltration or deployment command label
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: 'case ["''](exfil|deploy)["'']'

composite_rules:
  - id: node-http-command-response-tasking
    desc: Node HTTP command response tasking
    crit: hostile
    conf: 0.97
    all:
      - id: micro-behaviors/communications/http/request/client::https-request
      - id: micro-behaviors/data/control-flow/dispatch::command-member-or-handler-reference
    any:
      - id: node-c2-action-vocabulary
      - id: micro-behaviors/process/create/spawn::child-process-member-spawn
      - id: micro-behaviors/process/create/shell/command-string::sh-c-exec
    needs: 1
    scope: file
    near_bytes: 1024

  # The verify-server shape: an HTTPS request whose accumulated response is
  # parsed as JSON and mined for command members (`cmd`/`args`) that are
  # then launched through a detached script host. Unlike
  # `node-http-command-response-tasking` above -- which keys on
  # `response.commands`/`processCommand` vocabulary -- this keys on the
  # parsed response object supplying the command members consumed beside
  # the hidden launch, so a renamed protocol still matches while a
  # fixed-path updater (no response command members) does not.
  - id: node-http-response-command-execution
    desc: Executes a command supplied by an HTTP response
    crit: hostile
    conf: 0.97
    all:
      - id: micro-behaviors/communications/http/request/client::https-request
      - id: micro-behaviors/communications/http/response::http-response-json-data-parse
      - id: micro-behaviors/communications/http/response::response-command-member-pair
      - id: objectives/command-and-control/dropper/file-exec/command/script-host-embedded::js-spawn-wscript-detached
    scope: file
    near_bytes: 2048
