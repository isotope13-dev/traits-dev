defaults:
  platforms: [linux]
  for: [elf]
  arch: [powerpc]
  attack: T1095,T1071.004

composite_rules:
  - id: redkill-ppc-port53-tasking-marker
    desc: RedKill marker with PowerPC port-53 setup
    crit: notable
    conf: 0.99
    all:
      - id: micro-behaviors/communications/socket/syscall::ppc-sockaddr-port-53
      - id: micro-behaviors/communications/socket/framing::redkill-client-marker

  - id: redkill-ppc-port53-tasking
    desc: PowerPC implant uses TCP port 53 for custom command tasking
    crit: hostile
    conf: 0.99
    all:
      - id: redkill-ppc-port53-tasking-marker
      - id: micro-behaviors/communications/socket/syscall::ppc-socketcall-network-io
      - id: micro-behaviors/communications/ip/literal::external-ipv4-host-literal-binary
