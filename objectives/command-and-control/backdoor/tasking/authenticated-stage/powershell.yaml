# STAC4749 used a downloaded AppData implant with a raw token/signature pair
# on its command line.  The specific flag and filenames changed; the rule
# keys on the protocol shape and the surrounding staging behavior instead.
defaults:
  platforms: [windows]
  for: [powershell]
  attack: T1105,T1071.001
  mbc: B0030

composite_rules:
  - id: powershell-authenticated-appdata-stage
    desc: PowerShell launches AppData stage with token signature
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/communications/http/download/cli::iwr-outfile-download
      - id: micro-behaviors/fs/path/application/executable::appdata-exe-path
      - id: micro-behaviors/process/create/start-process::start-process-call
      - id: micro-behaviors/process/argument/authentication::token-signature-argument
      - id: objectives/evasion/indicator-removal/cleanup::unblock-file
    near_lines: 20
