# A request handler accepts JSON tasking and executes it through a shell.
defaults:
  platforms: [unix, windows]
  for: [python]
  attack: T1059.006,T1071.001
  mbc: C0002

composite_rules:
  - id: python-http-json-command-execution-service
    desc: Python HTTP service executes request supplied commands and returns output
    crit: hostile
    conf: 0.99
    scope: file
    near_lines: 100
    all:
      - id: micro-behaviors/communications/http/server/handler::python-http-handler-base-request
      - id: micro-behaviors/communications/http/server/handler::python-http-handler-post
      - id: micro-behaviors/data/collection/map::python-get-query-key
      - id: metadata/lang/source/literal/string/label::python-quoted-output-or-code-label
    any:
      - id: micro-behaviors/process/create/shell/command-mode::python-popen-command-call
      - id: micro-behaviors/data/string/concat/expression::python-popen-token-concatenation
