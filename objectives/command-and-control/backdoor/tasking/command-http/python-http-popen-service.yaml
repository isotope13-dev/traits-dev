# A request handler accepts JSON tasking and executes it through a shell.
defaults:
  platforms: [unix, windows]
  for: [python]
  attack: T1059.006,T1071.001
  mbc: C0002

traits:
  - id: python-http-handler-base-request
    desc: Python base HTTP request handler
    crit: notable
    conf: 0.98
    if:
      type: text
      word: BaseHTTPRequestHandler

  - id: python-http-handler-post
    desc: Python POST request handler
    crit: notable
    conf: 0.96
    if:
      type: text
      word: do_POST

  - id: python-json-command-field
    desc: Python JSON command query field
    crit: notable
    conf: 0.96
    if:
      type: text
      regex: '\.get\(\s*["''](q|query)["'']'

  - id: python-popen-command-call
    desc: Python popen command invocation
    crit: notable
    conf: 0.97
    if:
      type: text
      regex: '\bpopen\(\s*\w+'

  - id: python-obfuscated-popen-attribute
    desc: Python joins obfuscated popen attribute
    crit: notable
    conf: 0.98
    if:
      type: text
      regex: '["'']po["'']\s*\+\s*["'']pen["'']'

composite_rules:
  - id: python-http-json-command-execution-service
    desc: Python HTTP service executes request supplied commands and returns output
    crit: hostile
    conf: 0.99
    scope: file
    near_lines: 100
    all:
      - id: python-http-handler-base-request
      - id: python-http-handler-post
      - id: python-json-command-field
      - id: metadata/lang/source/literal/string::python-quoted-output-or-code-text
    any:
      - id: python-popen-command-call
      - id: python-obfuscated-popen-attribute
