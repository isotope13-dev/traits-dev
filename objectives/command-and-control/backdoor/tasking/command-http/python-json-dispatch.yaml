defaults:
  platforms: [unix, windows]
  for: [python]
  attack: T1071.001,T1059.006
composite_rules:
  - id: json-post-task-and-dynamic-execution
    desc: HTTP JSON task receipt with dynamic Python execution
    crit: suspicious
    conf: 0.94
    # These required roles co-occur; variable identity is not bound.
    all:
      - id: micro-behaviors/communications/http/request/tasking::python-post-json-response-assignment
      - id: micro-behaviors/communications/http/request/tasking::http-task-command-field-read
      - id: micro-behaviors/process/interpreter/eval/direct::exec-builtin
