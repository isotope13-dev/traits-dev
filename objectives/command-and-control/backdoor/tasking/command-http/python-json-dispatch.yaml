defaults:
  platforms: [unix, windows]
  for: [python]
  attack: T1071.001,T1059.006
composite_rules:
  - id: json-post-task-and-dynamic-execution
    desc: HTTP POST task response drives dynamic code execution
    crit: hostile
    conf: 0.94
    # Task assignment, command dispatch and exec establish the C2 result on
    # their own. Data-theft legs belong to the stealer composite; requiring
    # them here blinds this rule to tasking implants that steal nothing.
    all:
      - id: micro-behaviors/communications/http/request/tasking::python-post-json-response-assignment
      - id: micro-behaviors/data/property/access::mapping-command-key-access
      - id: micro-behaviors/process/deploy::python-http-json-response-code-exec
