defaults:
  platforms: [unix, windows]
  for: [python]
  attack: T1071.001,T1059.006
composite_rules:
  - id: json-post-task-and-dynamic-execution
    desc: HTTP task code execution alongside iOS Notes byte export
    crit: hostile
    conf: 0.94
    # HTTP response and exec share a binding; private-data export admits abuse.
    all:
      - id: micro-behaviors/communications/http/request/tasking::python-post-json-response-assignment
      - id: micro-behaviors/communications/http/request/tasking::http-task-command-field-read
      - id: micro-behaviors/process/deploy::python-http-json-response-code-exec
      - id: micro-behaviors/communications/http/upload::python-ios-notes-path-byte-post
