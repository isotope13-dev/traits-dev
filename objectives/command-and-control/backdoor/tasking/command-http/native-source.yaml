# Native source that polls an HTTP task endpoint and dispatches returned shell
# commands. The individual atoms are neutral enough for reuse; the complete
# poll/dispatch/result channel is an objective-level backdoor signal.
defaults:
  platforms: [unix, windows]
  for: [c, cpp]
  attack: T1059.004,T1071.001
  mbc: C0002

traits:
  - id: shell-command-from-task-field
    desc: Shell command from task field
    crit: suspicious
    conf: 0.96
    attack: T1059.004
    if:
      type: text
      regex: >-
        \[\s*['"](bash|sh)['"]\s*,\s*['"]-c['"]\s*,\s*[^,\]]{0,100}\b(cmd|command)\b
  - id: native-command-poll-loop
    desc: Native HTTP command poll loop
    crit: notable
    conf: 0.92
    attack: T1071.001
    if:
      type: text
      regex: >-
        while\s+true[\s\S]{0,500}(curl|urlopen)[\s\S]{0,240}/(commands?|tasks?|jobs?)\b
  - id: native-command-result-schema
    desc: Native command result JSON schema
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: >-
        \bid\b[\s\S]{0,220}\boutput\b[\s\S]{0,100}\bexit_code\b

composite_rules:
  - id: native-http-shell-tasking
    desc: Native HTTP shell tasking channel
    crit: hostile
    conf: 0.99
    all:
      - id: shell-command-from-task-field
      - id: native-command-poll-loop
      - id: native-command-result-schema
