defaults:
  platforms: [openwrt]
  for: [python, pyc]
  attack: T1059.006

traits:
  # The path must open a quoted string or follow an f-string placeholder
  # (`"/cmd"`, `f"{base}/command?id="`). A bare `/command` token is PostScript
  # name syntax (Pillow's PSDraw prolog) and shell prose, not a URL path.
  - id: python-http-command-path
    desc: Quoted /cmd or /command URL path
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '["''`}]/(cmd|command)([?&/"''`]|$)'
  - id: python-fetch-commands-name
    desc: Python command polling name
    crit: notable
    conf: 0.9
    if:
      type: text
      word: fetch_commands
  - id: python-remote-command-name
    desc: Python remote command name
    crit: notable
    conf: 0.9
    if:
      type: text
      word: execute_remote_command


composite_rules:
  - id: python-http-command-endpoint
    desc: Python command tasking endpoint
    crit: component
    conf: 0.9
    any:
      - id: python-http-command-path
      - id: python-fetch-commands-name
      - id: python-remote-command-name

  - id: openwrt-python-http-command-tasking
    desc: OpenWrt Python HTTP command tasking
    crit: hostile
    conf: 0.97
    all:
      - id: micro-behaviors/os/service/config::rc-common-init-script-header
      - id: micro-behaviors/communications/http/lib/urllib::urllib-urlopen-call
      - id: python-http-command-endpoint
    any:
      - id: micro-behaviors/process/create/shell-subprocess::shell-true
      - id: micro-behaviors/process/create/shell-subprocess::subprocess-shell-pyc
    needs: 1
