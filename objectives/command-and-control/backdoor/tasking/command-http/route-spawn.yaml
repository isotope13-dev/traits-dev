# An HTTP endpoint named for running commands whose handler spawns a
# process: whoever can reach the port can run programs on the host. CI
# runners and admin agents do this legitimately, so it stops at suspicious;
# which callers are allowed is not visible statically.
defaults:
  platforms: [windows, unix]
  for: [python, javascript, typescript, go, ruby, php]
  attack: T1059,T1071.001
  mbc: B0030

composite_rules:
  - id: command-route-spawns-process
    desc: Command-named HTTP route spawns a process
    crit: suspicious
    conf: 0.9
    near_lines: 20
    all:
      - id: micro-behaviors/communications/http/server/route::process-execution-route-path
    any:
      - id: micro-behaviors/process/create/subprocess/
      - id: metadata/binary/symbols/name/token::pyc-subprocess-name-reference
      - id: metadata/lang/source/syntax/call/arguments::urlencoded-groovy-processbuilder
      - id: micro-behaviors/process/create/shell-subprocess/
      - id: micro-behaviors/process/create/exec/
      - id: metadata/lang/source/syntax/command/invocation::rundll32-command-syntax-reference
      - id: micro-behaviors/process/create/flags::wsh-hidden-async-run
      - id: micro-behaviors/process/create/shell/bridge::execSync-call
    unless:
      - id: metadata/file/extension/identity::frontend-component-extension
      - id: metadata/path::test-directory-component
      - id: objectives/command-and-control/backdoor/tasking/command-http::privilege-dropping-command-service
      - id: micro-behaviors/communications/http/server/route::quoted-command-route-sample
      - id: micro-behaviors/communications/http/server/route::fenced-command-route-sample
    downgrade:
      any:
        - id: micro-behaviors/communications/http/server/authentication::signed-admin-server-context
        # A loopback-bound exec API is reachable only from its own host, so
        # the remote-tasking reading does not hold; what remains is a local
        # execution interface, still visible as a notable.
        - id: micro-behaviors/communications/http/server/framework::python-uvicorn-loopback-run

  # A command-execution API for an agent sandbox that forks each command with
  # a pre-exec hook which setuid/setgid's the child to an unprivileged account.
  # A tasking backdoor runs commands as the service identity; dropping to a
  # lower one is containment, so the API is the product, not a foothold.
  - id: privilege-dropping-command-service
    desc: Command service drops privileges for children
    crit: exception
    conf: 0.93
    for: [python]
    all:
      - id: micro-behaviors/process/create/direct::python-preexec-hook
      - id: micro-behaviors/process/identity/setuid::os-setuid-call
      - id: micro-behaviors/process/identity/setuid::os-setgid-call
