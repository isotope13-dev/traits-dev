# An HTTP endpoint named for running commands whose handler spawns a
# process: whoever can reach the port can run programs on the host. CI
# runners and admin agents do this legitimately, so it stops at suspicious;
# which callers are allowed is not visible statically.
defaults:
  platforms: [windows, unix]
  for: [python, javascript, typescript, go, ruby, php]
  attack: T1059,T1071.001
  mbc: B0030

composite_rules:
  - id: command-route-spawns-process
    desc: Command-named HTTP route spawns a process
    crit: suspicious
    conf: 0.9
    near_lines: 20
    all:
      - id: micro-behaviors/communications/http/server/route::command-verb-route-path
    any:
      - id: micro-behaviors/process/create/subprocess/
      - id: micro-behaviors/process/create/shell-subprocess/
      - id: micro-behaviors/process/create/exec/
      - id: micro-behaviors/process/create/hidden::wsh-run-hidden-async-statement
      - id: micro-behaviors/process/create/shell/bridge::execSync-call
    unless:
      - id: metadata/file/extension/identity::frontend-component-extension
      - id: metadata/file/naming::test-directory-component
    downgrade:
      any:
        - id: micro-behaviors/communications/http/server/authentication::signed-admin-server-context
