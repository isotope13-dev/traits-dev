defaults:
  platforms: [openwrt]
  for: [c, cpp, objc, rust, elf]
  attack: T1059
  mbc: B0030

traits:
  - id: native-exec-command-marker
    desc: Native received command execution marker
    crit: suspicious
    conf: 0.9
    if:
      type: text
      regex: 'Received remote command.{0,64}exec(ute)?\b'

composite_rules:
  - id: native-http-command-endpoint
    desc: Native HTTP command endpoint
    crit: component
    conf: 0.9
    any:
      - id: micro-behaviors/communications/http/url/api-path::native-api-command-path
      - id: micro-behaviors/communications/http/url/path::http-command-route-reference

  - id: openwrt-native-http-command-tasking
    desc: OpenWrt native HTTP command tasking
    crit: hostile
    conf: 0.97
    all:
      - id: native-http-command-endpoint
    any:
      - id: native-exec-command-marker
      - id: micro-behaviors/process/create/shell/spawn::system-fn
      - id: micro-behaviors/process/create/direct::rust-bin-sh-c
    needs: 2
