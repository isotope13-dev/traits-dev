defaults:
  platforms: [windows, unix]
  for: [python]
  attack: T1102.003,T1059.006

composite_rules:
  # A URL response is read into a variable and handed to exec(). This is the
  # complete HTTP tasking channel; the URL or variable name need not say C2.
  - id: python-urllib-response-command-exec
    desc: Python executes commands retrieved through urllib
    crit: hostile
    conf: 0.99
    near_lines: 20
    all:
      - id: micro-behaviors/communications/http/lib/urllib::urllib-urlopen-call
      - id: micro-behaviors/communications/http/lib/urllib::urlopen-response-body-read
      - id: micro-behaviors/process/interpreter/python::exec-command-argument

