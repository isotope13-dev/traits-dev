defaults:
  platforms: [windows, unix]
  for: [python]
  attack: T1102.003,T1059.006

composite_rules:
  # A URL response is read into a variable and handed to exec(). This is the
  # complete HTTP tasking channel; the URL or variable name need not say C2.
  - id: python-urllib-response-command-exec
    desc: Python executes commands retrieved through urllib
    crit: hostile
    conf: 0.99
    near_lines: 20
    all:
      - id: micro-behaviors/communications/http/lib/urllib::urllib-urlopen-call
      - id: micro-behaviors/communications/http/lib/urllib::urlopen-response-body-read
      - id: micro-behaviors/process/interpreter/python::exec-command-argument

  - id: python-import-poll-decodes-body
    desc: Import loop posts and decodes replies
    crit: hostile
    conf: 0.96
    scope: file
    near_lines: 25
    all:
      - id: micro-behaviors/data/control-flow/module-exec::python-column0-infinite-loop
      - id: micro-behaviors/communications/http/request/verb::urllib-request-post
      - id: micro-behaviors/data/decode/symbol-base64::b64decode-call
      - id: micro-behaviors/process/create/thread::python-thread-create

  - id: python-http-helper-starts-program
    desc: HTTP helper thread runs a program
    crit: hostile
    conf: 0.95
    scope: file
    near_lines: 25
    all:
      - id: micro-behaviors/communications/http/lib/urllib::urllib-urlopen-call
      - id: micro-behaviors/process/create/thread::python-daemon-thread
      - id: micro-behaviors/process/create/shell-subprocess::shell-true

