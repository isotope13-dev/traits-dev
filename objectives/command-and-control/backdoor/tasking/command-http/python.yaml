defaults:
  platforms:
  - windows
  - unix
  for:
  - python
  attack: T1102.003,T1059.006
traits:
- id: python-github-api-host
  desc: Python source references the GitHub API host
  crit: component
  conf: 0.94
  if:
    type: text
    regex: 'https?://api\.github\.com'
- id: python-gist-command-polling-schema
  desc: Python source uses a Gist command schema
  crit: component
  conf: 0.94
  if:
    type: text
    regex: '(?is)(cmds\.txt|"cmd"\s*[:,])'
composite_rules:
- id: python-urllib-response-command-exec
  desc: Python executes commands retrieved through urllib
  crit: hostile
  conf: 0.99
  near_lines: 20
  all:
  - id: micro-behaviors/communications/http/client/exchange::urllib-urlopen-call
  - id: micro-behaviors/communications/http/client/response-body::urlopen-response-body-read
  - id: micro-behaviors/process/interpreter/eval/direct::exec-command-argument
- id: python-import-poll-decodes-body
  desc: Import loop posts and decodes replies
  crit: hostile
  conf: 0.96
  scope: file
  near_lines: 25
  all:
  - id: micro-behaviors/data/control-flow/module-exec::python-column0-while-true-loop
  - id: micro-behaviors/communications/http/request/verb::urllib-request-post
  - id: micro-behaviors/data/decode/base64::b64decode-call
  - id: micro-behaviors/process/thread/create::python-thread-create
- id: python-http-helper-starts-program
  desc: HTTP helper thread runs a program
  crit: hostile
  conf: 0.95
  scope: file
  near_lines: 25
  all:
  - id: micro-behaviors/communications/http/client/exchange::urllib-urlopen-call
  - id: micro-behaviors/process/thread/create::python-daemon-thread
  - id: micro-behaviors/process/create/shell/command-string::python-subprocess-shell-true
- id: python-github-gist-polling-shell-agent
  desc: Python polls GitHub Gists and runs returned shell commands
  crit: hostile
  conf: 0.97
  scope: file
  near_lines: 30
  all:
  - id: micro-behaviors/communications/http/client/exchange::urllib-urlopen-call
  - id: micro-behaviors/process/create/shell/command-string::python-subprocess-shell-true
  - id: python-github-api-host
  - id: python-gist-command-polling-schema
