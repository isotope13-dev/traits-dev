# Custom command protocols often serialize compact numeric command IDs with a
# repeated delimiter. The framing alone is weak; the hostile rules require it
# alongside an HTTP channel and execution, file-write, or in-memory loading
# mechanics.
defaults:
  platforms: [windows, unix]
  for: [scripts, binaries, c, cpp, csharp, go, rust, python, javascript, typescript, pe, elf, macho, dll]
  attack: T1059,T1071.001,T1105
  mbc: B0030

traits:
  - id: numeric-punctuation-delimited-command-records
    desc: Numeric commands use repeated delimiters
    crit: component
    conf: 0.99
    count_min: 4
    if:
      type: text
      regex: '\b[0-9]{1,3}[#@|:$%^&*~]{2,5}'

composite_rules:
  - id: delimited-http-upload-execution-backdoor
    desc: Delimited HTTP task protocol executes processes and uploads files
    crit: hostile
    conf: 0.995
    attack: T1059,T1071.001,T1041
    near_bytes: 4096
    all:
      - id: numeric-punctuation-delimited-command-records
      - id: micro-behaviors/communications/http/message::raw-http-body-request-line
      - id: micro-behaviors/communications/http/url/
      - id: micro-behaviors/communications/http/upload/
      - id: micro-behaviors/fs/read/file/
      - id: micro-behaviors/process/create/

  - id: delimited-http-file-writing-tasking-backdoor
    desc: Delimited HTTP task protocol dispatches processes and writes files
    crit: hostile
    conf: 0.995
    near_bytes: 4096
    all:
      - id: numeric-punctuation-delimited-command-records
      - id: micro-behaviors/communications/http/message::raw-http-body-request-line
      - id: micro-behaviors/process/create/
    any:
      - id: micro-behaviors/fs/file/write/direct/
      - id: micro-behaviors/fs/write/file/direct/

  - id: delimited-http-memory-module-backdoor
    desc: Delimited HTTP task protocol runs modules in allocated memory
    crit: hostile
    conf: 0.995
    attack: T1071.001,T1105,T1620
    near_bytes: 4096
    all:
      - id: numeric-punctuation-delimited-command-records
      - id: micro-behaviors/communications/http/message::raw-http-body-request-line
      - id: micro-behaviors/mem/protect/modify::virtual-alloc-string
      - id: micro-behaviors/process/threading/create::create-thread-text
