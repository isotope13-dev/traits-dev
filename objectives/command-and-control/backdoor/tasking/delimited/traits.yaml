# TWOSTROKE serializes command fields with the distinctive @##@ delimiter. The
# marker alone is incomplete; the hostile rules require it alongside an HTTP
# channel and execution, file-write, or in-memory loading mechanics.
defaults:
  platforms: [windows]
  for: [pe, dll, c, cpp]
  attack: T1059,T1071.001,T1105
  mbc: B0030

traits:
  - id: twostroke-command-field-delimiter
    desc: TWOSTROKE-style @##@ command delimiter
    crit: component
    conf: 0.99
    if:
      type: text
      substr: '@##@'

composite_rules:
  - id: twostroke-http-upload-execution-backdoor
    desc: TWOSTROKE HTTP executes and uploads files
    crit: hostile
    conf: 0.995
    attack: T1059,T1071.001,T1041
    near_bytes: 4096
    all:
      - id: twostroke-command-field-delimiter
      - id: micro-behaviors/communications/http/message::raw-http-body-request-line
      - id: micro-behaviors/communications/http/url/
      - id: micro-behaviors/communications/http/upload/
      - id: micro-behaviors/fs/read/file/
      - id: micro-behaviors/process/create/

  - id: twostroke-http-file-writing-tasking-backdoor
    desc: TWOSTROKE HTTP executes and writes files
    crit: hostile
    conf: 0.995
    near_bytes: 4096
    all:
      - id: twostroke-command-field-delimiter
      - id: micro-behaviors/communications/http/message::raw-http-body-request-line
      - id: micro-behaviors/process/create/
    any:
      - id: micro-behaviors/fs/write/file/direct/

  - id: twostroke-http-memory-module-backdoor
    desc: TWOSTROKE HTTP runs modules in memory
    crit: hostile
    conf: 0.995
    attack: T1071.001,T1105,T1620
    near_bytes: 4096
    all:
      - id: twostroke-command-field-delimiter
      - id: micro-behaviors/communications/http/message::raw-http-body-request-line
      - id: micro-behaviors/mem/protect/modify::virtual-alloc-string
      - id: micro-behaviors/process/threading/create::create-thread-text
