---
defaults:
  platforms:
  - unix
  - android
  for:
  - elf
  mbc: B0030
  attack: T1071.001
composite_rules:
- id: native-libcurl-timing-backdoor
  desc: Native libcurl, sleep, heartbeat, and key exchange or SOCKS references
  crit: suspicious
  conf: 0.95
  # These references can coexist in legitimate clients; they do not prove
  # that an implant uses them for command and control.
  all:
  - id: micro-behaviors/communications/http/client/curl::libcurl-http
  - id: micro-behaviors/time/sleep/interval::sleep-network-cooccurrence
  - id: metadata/lang/natural/vocabulary/content-word::heartbeat-word
  any:
  - id: micro-behaviors/crypto/key/exchange
  - id: micro-behaviors/communications/proxy/socks/wire::socks5-noauth-greeting-stack-store-x86-64
  - id: micro-behaviors/communications/proxy/socks/wire::native-socks5-domain-connect-client
- id: native-libcurl-proxy-auth-client
  desc: Native libcurl client with HTTP authorization and SOCKS proxy support
  crit: notable
  conf: 0.88
  all:
  - id: well-known/lib/network/curl::libcurl-version
  - id: micro-behaviors/communications/http/authorization-header::auth-header
  - id: micro-behaviors/communications/socket/connect/attempt::connect
  any:
  - id: micro-behaviors/communications/proxy/socks/unspecified::socks4-proto
  - id: micro-behaviors/communications/proxy/socks/unspecified::socks5-proto
# libcurl, SOCKS support and a bare heartbeat token do not establish tasking.
# Semgrep 1.92.0 and 1.93.0 both embed curl 8.5.0 plus OCaml TLS's RFC 6520
# enum and "no heartbeat" alert formatter. Keep the individual network facts;
# a backdoor finding needs independent evidence of attacker control.
