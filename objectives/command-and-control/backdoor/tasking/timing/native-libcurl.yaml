---
defaults:
  platforms:
  - unix
  - android
  for:
  - elf
  mbc: B0030
  attack: T1071.001
composite_rules:
- id: native-libcurl-timing-backdoor
  desc: Native libcurl backdoor with delayed, heartbeat-based network tasking
  crit: hostile
  conf: 0.95
  # libcurl + delay + "heartbeat" + Authorization header describes nearly every
  # modern API client and monitoring agent (e.g. librdkafka's OAuth/OIDC bearer
  # flow plus Kafka consumer-group heartbeats). The hostile discriminator must be
  # an implant-specific channel: self-rolled ECDH key exchange or hand-built SOCKS
  # proxy protocol bytes — not a bearer header. auth-header alone is covered by the
  # notable native-libcurl-proxy-auth-client rule below.
  all:
  - id: micro-behaviors/communications/http/download/curl::libcurl-http
  - id: objectives/anti-analysis/timing/evasion::delay-with-network
  - id: objectives/command-and-control/infrastructure/keywords::heartbeat-word
  any:
  - id: micro-behaviors/crypto/asymmetric/ecdh
  - id: micro-behaviors/communications/proxy/socks::socks4-proto
  - id: micro-behaviors/communications/proxy/socks::socks5-proto
  unless:
  - id: well-known/dual-use/tunnel/sauce-connect::client
- id: native-libcurl-proxy-auth-client
  desc: Native libcurl client with HTTP authorization and SOCKS proxy support
  crit: notable
  conf: 0.88
  all:
  - id: micro-behaviors/communications/http/download/curl::libcurl-version
  - id: micro-behaviors/communications/http/headers::auth-header
  - id: micro-behaviors/communications/socket/connect::connect
  any:
  - id: micro-behaviors/communications/proxy/socks::socks4-proto
  - id: micro-behaviors/communications/proxy/socks::socks5-proto
  unless:
  - id: well-known/tool/sysadmin/network::curl-basename
  - id: well-known/lib/network/curl::runtime-library
  - id: micro-behaviors/ui/help/
- id: native-libcurl-heartbeat-proxy
  desc: Native libcurl client combines heartbeat wording with SOCKS proxy support
  crit: suspicious
  conf: 0.9
  all:
  - id: micro-behaviors/communications/http/download/curl::libcurl-version
  - id: objectives/command-and-control/infrastructure/keywords::heartbeat-word
  any:
  - id: micro-behaviors/communications/proxy/socks::socks4-proto
  - id: micro-behaviors/communications/proxy/socks::socks5-proto
  unless:
  - id: well-known/tool/development/curl-fuzzer::curl-fuzzer-context
  - id: well-known/tool/development/curl-fuzzer::oss-fuzz-curl-context
  - id: well-known/tool/development/curl-fuzzer::oss-fuzz-curl-fuzzer-artifact-path
  - id: well-known/app/infrastructure/containerd::source-tree
  - id: well-known/lib/network/curl::runtime-library
  # The official Bedrock server embeds libcurl's proxy protocol strings and
  # heartbeat wording as part of its game/network stack.
  - id: well-known/game/minecraft-bedrock-server::dedicated-server-mode-marker
  - id: well-known/lib/media/regula-document-reader::regula-android-sdk-context
  - id: well-known/dual-use/tunnel/sauce-connect::client
- id: native-libcurl-heartbeat-command-runner
  desc: Native libcurl heartbeat client with local command execution
  crit: suspicious
  conf: 0.9
  all:
  - id: micro-behaviors/communications/http/download/curl::libcurl-version
  - id: objectives/command-and-control/infrastructure/keywords::heartbeat-word
  - id: micro-behaviors/communications/socket/connect::connect-symbol
  any:
  - id: micro-behaviors/process/create/popen::c-popen
  - id: micro-behaviors/process/create/execv::c-exec-variants
  unless:
  - id: well-known/tool/development/curl-fuzzer::curl-fuzzer-context
  - id: well-known/tool/development/curl-fuzzer::oss-fuzz-curl-context
  - id: well-known/tool/development/curl-fuzzer::oss-fuzz-curl-fuzzer-artifact-path
  - id: well-known/app/infrastructure/containerd::source-tree
  - id: well-known/lib/network/curl::runtime-library
  - id: well-known/dual-use/tunnel/sauce-connect::client
