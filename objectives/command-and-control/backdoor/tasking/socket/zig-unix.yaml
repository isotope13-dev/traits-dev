# Zig bind-shell backdoors that dispatch wipe/exec over a listening socket
# and plant an SSH key. The command tokens are the protocol; the authorized
# keys write is how the operator comes back after the wipe.
defaults:
  platforms: [unix]
  for: [zig]
  attack: T1059.004,T1485,T1098.004
  crit: notable
  conf: 0.94

traits:
  - id: zig-backdoor-exec-token
    desc: Zig backdoor exec command token
    crit: suspicious
    conf: 0.95
    if:
      type: text
      substr: 'startsWith(u8, cmd, "exec "'
  - id: zig-backdoor-wipe-token
    desc: Zig backdoor wipe command token
    crit: suspicious
    conf: 0.96
    if:
      type: text
      substr: 'startsWith(u8, cmd, "wipe "'
  - id: zig-ssh-rsa-authorized-keys
    desc: Zig writes ssh-rsa authorized_keys
    crit: suspicious
    conf: 0.96
    if:
      type: text
      regex: 'authorized_keys[\s\S]{0,500}ssh-rsa '
  - id: zig-history-wipe-paths
    desc: Zig wipes shell history files
    crit: suspicious
    conf: 0.94
    if:
      type: text
      regex: '/root/\.bash_history[\s\S]{0,200}/root/\.zsh_history'

composite_rules:
  - id: zig-bind-shell-wipe-backdoor
    desc: Zig bind shell with wipe token
    crit: hostile
    conf: 0.98
    all:
      - id: zig-backdoor-exec-token
      - id: zig-backdoor-wipe-token
      - id: objectives/command-and-control/dropper/staging/temp::zig-bin-sh-c
  - id: zig-wipe-history-and-tmp
    desc: Zig wipe token with history paths
    crit: hostile
    conf: 0.97
    all:
      - id: zig-backdoor-wipe-token
      - id: zig-history-wipe-paths
  - id: zig-ssh-key-backdoor-plant
    desc: Zig plants ssh-rsa authorized_keys
    crit: hostile
    conf: 0.97
    all:
      - id: zig-ssh-rsa-authorized-keys
      - id: zig-backdoor-exec-token
