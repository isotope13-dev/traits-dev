# PowerShell agents that use a raw TCP stream as a file-backed task queue.
# Command words are matched as parsed PowerShell string literals with the
# protocol newline terminator; prose mentioning GET or UPLOAD cannot satisfy
# these atoms.
defaults:
  platforms: [windows]
  for: [powershell]
  attack: T1059.001,T1095,T1105
  mbc: B0030

traits:
  - id: powershell-tcp-task-request-frame
    desc: PowerShell task request protocol frame
    crit: suspicious
    conf: 0.97
    if:
      type: string_literal
      regex: '(?i)^GET\s+\$[A-Za-z_][A-Za-z0-9_.()$-]*`n$'

  - id: powershell-tcp-file-upload-frame
    desc: PowerShell file upload protocol frame
    crit: suspicious
    conf: 0.97
    attack: T1041
    if:
      type: string_literal
      regex: '(?i)^UPLOAD\s+\$[^\r\n]{1,120}`n$'

composite_rules:
  - id: powershell-tcp-file-task-protocol
    desc: PowerShell TCP agent requests tasks and uploads files
    crit: suspicious
    conf: 0.99
    all:
      - id: micro-behaviors/communications/socket/tcp::tcpclient-stream
      - id: powershell-tcp-task-request-frame
      - id: powershell-tcp-file-upload-frame

  - id: powershell-tcp-script-task-runner
    desc: PowerShell TCP agent writes and executes fetched script tasks
    crit: hostile
    conf: 0.99
    all:
      - id: powershell-tcp-file-task-protocol
      - id: micro-behaviors/fs/write/file/full::write-all-bytes
      - id: objectives/command-and-control/dropper/execution/fileless::ps-downloadfile-variable-invoke-temp
      - id: micro-behaviors/os/env/user-paths::env-temp-dup

  - id: powershell-tcp-task-result-exfil-cleanup
    desc: PowerShell TCP task runner uploads results and deletes local artifacts
    crit: hostile
    conf: 0.99
    attack: T1041,T1070.004,T1095
    all:
      - id: powershell-tcp-script-task-runner
      - id: micro-behaviors/fs/read/file/full::read-all-bytes
      - id: micro-behaviors/fs/write/file/full::powershell-stream-buffer-write
      - id: micro-behaviors/fs/delete/file/command::powershell-remove-item-force
