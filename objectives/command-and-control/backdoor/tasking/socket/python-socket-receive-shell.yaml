defaults:
  platforms:
  - unix
  - windows
  for:
  - python

composite_rules:
  - id: python-socket-receive-shell
    desc: Socket receive beside Python shell execution
    crit: notable
    conf: 0.98
    all:
      - id: micro-behaviors/communications/socket/receive::socket-receive
      - id: micro-behaviors/process/create/shell/command-mode::python-os-system
    near_lines: 24
    unless:
      - id: micro-behaviors/process/terminate/command::python-self-pid-taskkill
