# No flow query currently binds compiled Go Scanner output to exec.Command.
# Keep the detector suspicious even though disassembly of the positive sample
# proves an unauthenticated receive -> sh -c -> CombinedOutput -> TCP write loop.
# No address, port, collected filename, main-package name or Go version is used.
defaults:
  platforms: [linux]
  for: [elf]
composite_rules:
  - id: go-line-agent-shell-tasking
    desc: Go TCP agent framing with shell command capture
    crit: suspicious
    conf: 0.95
    attack: T1059.004
    all:
      - id: micro-behaviors/communications/socket/connect::go-net-dialtimeout-text
      - id: micro-behaviors/process/create/subprocess::go-compiled-exec-command-reference
      - id: micro-behaviors/data/string/split::go-compiled-scanner-scan-reference
      - id: micro-behaviors/process/fd/stdio::go-binary-combined-output-reference
      - id: micro-behaviors/fs/path/binary::go-bin-sh-binary-reference
      - id: micro-behaviors/data/string/split::newline-done-record-delimiter
