defaults:
  platforms: [appliance, unix]
  for: [c, cpp, objc, elf]
  attack: T1059
  mbc: B0030

traits:
- id: native-line-c2-records
  desc: Native line-delimited C2 records
  crit: suspicious
  conf: 0.92
  if:
    type: text
    regex: 'EXFIL (passwd|shadow|environ)|BEACON completed'

- id: native-exec-read-task-tokens
  desc: "Formatted EXEC / READ task token literal"
  crit: notable
  conf: 0.92
  # Require a format placeholder after the token. A bare `READ:` string is
  # common in ordinary diagnostic output (for example `cerr << "READ: "`).
  if:
    type: string_literal
    regex: '^(EXEC|READ):\s*%[sdu]'
  unless:
  - id: micro-behaviors/os/syscall/invoke::linux-kernel-source-context
  - id: well-known/app/system/drivers/nvidia::linux-driver-core-library-basename
  - id: metadata/package/license::linux-syscall-note-license
  downgrade:
    scope: archive
    any:
    - id: well-known/app/system/drivers/nvidia::arch-nvidia-utils-package


- id: vxworks-image-discovery
  desc: VxWorks image discovery
  crit: notable
  conf: 0.88
  if:
    type: text
    regex: '\*\.vxe|/etc/vxWorks'

- id: native-destructive-task-tokens--wipedrive
  desc: WIPEDRIVE command marker
  crit: component
  conf: 0.92
  if:
    type: text
    word: WIPEDRIVE
- id: native-destructive-task-tokens--beat
  desc: BEAT heartbeat token
  crit: notable
  conf: 0.92
  if:
    type: text
    # Require this family's pipe-delimited framing, as the sibling
    # pipe-BEACON/EXFIL/RESULT records do. Unlike WIPEDRIVE and REINSTALL,
    # a bare `BEAT` is an ordinary English word and the core domain noun of
    # every DAW, sequencer, metronome and rhythm engine — it was matching
    # prose ("dragging on a BEAT line") and enum names, and it feeds no
    # composite, so the word match was pure noise.
    regex: '\bBEAT\|[^|\r\n]{1,128}(\||$)'
  unless:
  - id: micro-behaviors/os/syscall/invoke::linux-kernel-source-context
  - id: well-known/tool/reverse-engineering/radare2/
composite_rules:
  # "FILE|" and "RESULT|" are extremely common substrings (table headers, enums,
  # bat's syntax grammars), so "2 pipe-delimited tokens" is not suspicious on its
  # own. Building block for the hostile socket-tasking composite below, which adds
  # socket connect + EXEC/destructive task tokens.
- id: vxworks-native-socket-tasking
  for: [elf, c]
  desc: VxWorks socket tasking
  crit: hostile
  conf: 0.98
  all:
  - id: metadata/file/format/structured::native-pipe-delimited-record-markers
  - id: metadata/file/profile/socket-api::connect
  any:
  - id: native-exec-read-task-tokens
  - id: objectives/command-and-control/backdoor/tasking/socket::native-destructive-task-tokens--wipedrive
  unless:
  - id: well-known/tool/sysadmin/alpine-packages/binary::alpine-parseable-binary
  - id: well-known/app/ai/coding-agent/tabby/
  - id: well-known/tool/sysadmin/alpine-packages/binary::parseable-binary-name

- id: vxworks-destructive-socket-tasking
  for: [elf, c]
  desc: VxWorks destructive tasking
  crit: hostile
  conf: 0.98
  all:
  - id: native-line-c2-records
  - id: objectives/command-and-control/backdoor/tasking/socket::native-destructive-task-tokens--wipedrive
  - id: metadata/file/profile/socket-api::connect
