# Socket-tasked implant in Python: an outbound connection carries
# operator commands that are executed locally, with the output framed
# back over the same socket. The command text arrives at run time, so
# the exec argument is a variable, not a literal. The legs must sit in
# one implant routine (25 lines, the Python routine norm): a wider
# window stitches unrelated helpers in large benign files (e.g. an SSH
# client next to a localhost port-forwarder, or an IPC broker client
# beside a CLI wrapper) into a phantom backdoor.
defaults:
  platforms: [windows, unix]
  for: [python]
  attack: T1059,T1071.001

composite_rules:
  # A script that listens on loopback and dials loopback is exercising its own
  # service: an integration or smoke test that starts a local fixture server,
  # connects to the proxy under test and runs the binary being checked. An
  # implant dials out; it does not host a loopback listener to talk to itself.
  - id: python-loopback-self-test-context
    desc: Python script tests a service over loopback
    crit: exception
    conf: 0.9
    all:
      - id: micro-behaviors/communications/socket/endpoint::python-create-connection-loopback-literal
      - id: micro-behaviors/communications/socket/bind/address::bind-loopback-address
  # A guest driver dials the VM's forwarded SSH port and runs ssh/scp against
  # 127.0.0.1. The command string is the test entry, and sendall is a separate
  # monitor socket. An implant does not SSH to itself on loopback.
  - id: python-loopback-ssh-guest-driver
    desc: Python drives a guest over loopback SSH
    crit: exception
    conf: 0.9
    all:
      - id: micro-behaviors/communications/socket/endpoint::python-create-connection-loopback-literal
      - id: micro-behaviors/communications/socket/endpoint::python-ssh-loopback-target
  - id: python-socket-tasked-command-runner
    desc: Python runs remotely supplied commands over a connected socket
    crit: hostile
    conf: 0.96
    near_lines: 25
    all:
      - id: micro-behaviors/communications/socket/connect::socket-create-connection-call
      - id: micro-behaviors/process/create/subprocess::run-ast
      - id: micro-behaviors/process/create/subprocess::variable-command-argument
      - id: micro-behaviors/communications/socket/send::python-sendall
    unless:
      - id: python-loopback-self-test-context
      - id: python-loopback-ssh-guest-driver
