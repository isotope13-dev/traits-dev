# Socket-tasked implant in Python: an outbound connection carries
# operator commands that are executed locally, with the output framed
# back over the same socket. The command text arrives at run time, so
# the exec argument is a variable, not a literal.
defaults:
  platforms: [windows, unix]
  for: [python]
  attack: T1059,T1071.001
  mbc: B0025.003

composite_rules:
  - id: python-socket-tasked-command-runner
    desc: Python runs remotely supplied commands over a connected socket
    crit: hostile
    conf: 0.96
    near_bytes: 16384
    all:
      - id: micro-behaviors/communications/socket/connect::socket-create-connection-call
      - id: micro-behaviors/process/create/subprocess::run-ast
      - id: micro-behaviors/process/create/subprocess::variable-command-argument
      - id: micro-behaviors/communications/socket/send::python-sendall
