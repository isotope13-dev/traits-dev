defaults:
  platforms: [unix]
  for: [csharp]
  attack: T1059
  mbc: B0022

traits:
  - id: csharp-command-result-write
    desc: C# writes command result
    crit: notable
    conf: 0.92
    if:
      type: text
      substr: 'WriteLine($"RESULT:'

composite_rules:
  - id: csharp-tcp-command-backdoor
    desc: C# TCP command backdoor
    crit: hostile
    conf: 0.98
    all:
      - id: metadata/lang/source/syntax/call/member::csharp-stream-read-buffer-prefix
      - id: micro-behaviors/process/argument/interpreter::dotnet-bash-command-exec
      - id: csharp-command-result-write
