defaults:
  platforms: [routeros, appliance, unix]
  for: [python, pyc]
  attack: T1059
  mbc: B0022

traits:
- id: routeros-python-api-login
  desc: Python RouterOS API login
  crit: suspicious
  conf: 0.94
  if:
    type: text
    regex: '(/login[\s\S]{0,160}=(name|password)=|=(name|password)=[\s\S]{0,160}/login)'
  unless:
  - id: well-known/tool/offensive/nmap::nmap-source-tree
  - id: well-known/tool/offensive/wirelessxpl::routeros-api-client-context
  - id: well-known/tool/offensive/wirelessxpl::authorized-framework-context
  - id: micro-behaviors/os/sysinfo/profile::routeros-api-system-profile-query

- id: routeros-python-api-response
  desc: Python RouterOS response auth
  crit: suspicious
  conf: 0.92
  if:
    type: text
    substr: =response=0x

- id: routeros-python-command-sender
  desc: Python RouterOS command sender
  crit: suspicious
  conf: 0.9
  if:
    type: text
    regex: 'cmd\.split\(\)[\s\S]{0,260}_write_packet\(sock'

composite_rules:
- id: routeros-python-api-socket-tasking
  desc: Python RouterOS API tasking
  crit: hostile
  conf: 0.98
  all:
  - id: routeros-python-api-login
  - id: routeros-python-api-response
  - id: routeros-python-command-sender
  any:
  - id: micro-behaviors/data/control-flow/loop::python-command-list-loop
  - id: micro-behaviors/communications/socket/receive::socket-data-transfer

- id: routeros-python-api-c2-channel
  for: [python]
  desc: Python RouterOS API C2 channel
  crit: hostile
  conf: 0.96
  all:
  - id: routeros-python-api-login
  - id: micro-behaviors/communications/ip/endpoint::routeros-api-port-argument
  - id: micro-behaviors/communications/socket/connect::connect-python
  - id: micro-behaviors/communications/socket/receive::socket-data-transfer
