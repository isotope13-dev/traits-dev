# A remotely controlled job shell becomes an unauthenticated backdoor when its
# enrollment API treats an unset token as authorization. Requiring the pairing
# route separates this from local HTTP task runners and authenticated CI agents.
defaults:
  platforms: [unix]
  for: [javascript, typescript, npm]
  attack: T1059.004,T1071.001,T1133
  mbc: B0030

composite_rules:
  - id: unauthenticated-controller-shell-agent
    desc: Unauthenticated controller enrolls remote shell agent
    crit: hostile
    conf: 0.995
    scope: file
    all:
      - id: objectives/command-and-control/backdoor/dispatch/shell::node-http-job-shell-dispatch
      - id: micro-behaviors/communications/http/url/path::controller-pairing-api-route
