defaults:
  crit: hostile
  for:
  - macho
  platforms:
  - macos
  attack: T1059
  mbc: B0009
composite_rules:
- id: macos-daemon-pty-connect-backdoor
  platforms:
  - linux
  - macos
  desc: macOS PTY, process and external socket references
  crit: suspicious
  conf: 0.9
  attack: T1059.004,T1095,T1543.001
  all:
  - id: micro-behaviors/process/tty/pty::forkpty
  - id: micro-behaviors/process/daemonize/detach::setsid-import
  - id: micro-behaviors/communications/socket/connect/attempt::connect-symbol
  - id: micro-behaviors/communications/ip/literal::external-ipv4-shaped-text-binary
  - id: micro-behaviors/process/replace::c-exec-variants
  - id: metadata/signature/absent::unsigned-macho
  unless:
  - id: metadata/signature/verified/platform::apple
