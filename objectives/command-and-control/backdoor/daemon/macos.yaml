defaults:
  crit: hostile
  for:
  - macho
  platforms:
  - macos
  attack: T1059
  mbc: B0009
composite_rules:
- id: macos-daemon-pty-connect-backdoor
  platforms:
  - linux
  - macos
  desc: macOS daemonized PTY connects to an external controller
  conf: 0.96
  attack: T1059.004,T1095,T1543.001
  all:
  - id: micro-behaviors/process/tty/pty::forkpty
  - id: micro-behaviors/process/daemonize/detach::setsid-import
  - id: micro-behaviors/communications/socket/connect::connect-symbol
  - id: micro-behaviors/communications/ip/literal::external-ipv4-host-literal-binary
  - id: micro-behaviors/process/create/execv::c-exec-variants
  - id: metadata/signed/trust-level::unsigned-macho
  unless:
  - id: metadata/signed/platform::apple
  - id: well-known/app/
  - id: well-known/tool/
