# Embedded-router backdoors that expose a temporary shell through a Telnet
# daemon.  The rule is technique-based: it does not depend on Quad7 names,
# xlogin, or a particular firmware family.
defaults:
  platforms: [unix, appliance, fortios]
  for: [shell, elf]
  attack: T1021.007,T1059.004
  mbc: B0030

composite_rules:
  - id: fortios-exposed-admin-backdoor
    desc: FortiOS admin access exposed without safeguards
    crit: hostile
    conf: 0.99
    for: [shell]
    attack: T1133,T1562.001
    near_lines: 20
    all:
      - id: micro-behaviors/os/network/interface::fortios-interface-https-management
      - id: micro-behaviors/os/user/account::fortios-cli-admin-config
      - id: objectives/impact/degrade/system/mfa::fortios-unset-admin-two-factor
      - id: objectives/impact/degrade/system/policy::fortios-admin-trusted-host-unset

  - id: embedded-high-port-temp-telnet-shell
    desc: High-port Telnet hands off a temporary shell
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/communications/socket/telnet::telnetd-high-port
      - id: micro-behaviors/communications/socket/telnet::telnetd-temp-login

  - id: embedded-router-management-suppression
    desc: HTTP management stopped with Telnet shell
    crit: hostile
    conf: 0.98
    attack: T1021.007,T1059.004,T1562.001
    all:
      - id: micro-behaviors/communications/socket/telnet::telnetd-high-port
      - id: micro-behaviors/process/control/signal::embedded-httpd-termination
