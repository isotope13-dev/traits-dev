# Turning on HTTPS management for an interface is routine on its own -- it is
# how the box is administered. It becomes a backdoor when the same script also
# strips the administrator's second factor and trusted-host allow-list, leaving
# the management daemon reachable with a single reusable credential.
defaults:
  platforms: [fortios, appliance, unix]
  for: [shell]
  attack: T1133,T1562.001
  mbc: B0030

composite_rules:
  - id: fortios-exposed-admin-backdoor
    desc: FortiOS admin access exposed without safeguards
    crit: hostile
    conf: 0.99
    near_lines: 20
    all:
      - id: micro-behaviors/os/network/interface::fortios-interface-https-management
      - id: micro-behaviors/os/user/account::fortios-cli-admin-config
      - id: objectives/impact/degrade/system/mfa::fortios-unset-admin-two-factor
      - id: objectives/impact/degrade/system/policy::fortios-admin-trusted-host-unset
