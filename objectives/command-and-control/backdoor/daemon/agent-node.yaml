defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  attack: T1071.001

traits:
  - id: remote-agent-hub-url-start
    desc: hubUrl in startNode configuration
    crit: component
    conf: 0.98
    if:
      type: text
      regex: 'startNode\s*\(\s*\{[\s\S]{0,120}hubUrl\s*:'

  - id: remote-agent-hub-url-fallback
    desc: hubUrl uses agent URL fallback
    crit: component
    conf: 0.98
    if:
      type: text
      regex: 'hubUrl\s*:\s*[A-Za-z_$][A-Za-z0-9_$]*\.AGENT_HUB_URL\s*\|\|'

  - id: remote-agent-token-env
    desc: Hub token from environment
    crit: component
    conf: 0.98
    if:
      type: text
      regex: 'token\s*:\s*process\.env\.AGENT_HUB_[A-Z0-9_]*TOKEN'

  - id: remote-agent-token-config
    desc: Hub token from agent config
    crit: component
    conf: 0.98
    if:
      type: text
      regex: 'token\s*:\s*[A-Za-z_$][A-Za-z0-9_$]*\.AGENT_HUB_[A-Z0-9_]*TOKEN'

  - id: cli-startup-auto-join-call
    desc: CLI startup auto-joins agent pool
    crit: suspicious
    conf: 0.98
    if:
      type: text
      regex: '(void\s+)?autoJoinPool\s*\(\s*\)\s*;'

  - id: remote-agent-hub-join-guard
    desc: Hub join flag enabled
    crit: component
    conf: 0.99
    if:
      type: text
      regex: 'AGENT_PROXY_JOIN_HUB[\s\S]{0,220}\?\s*!'

  - id: remote-agent-cli-mode-includes
    desc: Client mode membership check
    crit: component
    conf: 0.99
    if:
      type: text
      regex: '[A-Za-z_$][A-Za-z0-9_$]*\.includes\('

  - id: remote-agent-cli-mode-exclusion
    desc: CLI mode excluded from hub join
    crit: component
    conf: 0.99
    if:
      type: text
      regex: ':\s*[A-Za-z_$][A-Za-z0-9_$]*\.codexMode\s*!==\s*["'']cli["'']'

  - id: remote-agent-credential-gate
    desc: Checks local credentials before joining
    crit: suspicious
    conf: 0.98
    attack: T1552.001
    if:
      type: text
      regex: 'onlyIfCredentialed\s*&&\s*!\(\s*await\s+[A-Za-z_$][A-Za-z0-9_$]*\(\)\s*\)\.length'

  - id: remote-agent-credential-required-config
    desc: Hub join requires local credentials
    crit: suspicious
    conf: 0.98
    attack: T1552.001
    if:
      type: text
      regex: 'onlyIfCredentialed\s*:\s*(!0|true)'

  - id: xor-agent-hub-base64
    desc: Base64 buffer decoding
    crit: component
    conf: 0.99
    if:
      type: text
      regex: 'Buffer\.from\([^,]{1,120},\s*["'']base64["'']\)'

  - id: xor-agent-hub-charcode
    desc: XOR URL reconstruction call
    crit: component
    conf: 0.99
    if:
      type: text
      regex: 'String\.fromCharCode\([\s\S]{0,180}\^'

  - id: xor-agent-hub-fallback
    desc: Hub URL fallback expression
    crit: component
    conf: 0.99
    if:
      type: text
      regex: 'AGENT_HUB_URL\s*\|\|'

  - id: agent-register-message
    desc: Agent registration message
    crit: component
    conf: 0.99
    if:
      type: text
      regex: '\{\s*t\s*:\s*["'']register["'']\s*,\s*token\s*:'

  - id: agent-register-node
    desc: Registration node identifier
    crit: component
    conf: 0.99
    if:
      type: text
      regex: 'nodeId\s*:'

  - id: agent-register-models
    desc: Registration model inventory
    crit: component
    conf: 0.99
    if:
      type: text
      regex: 'models\s*:'

  - id: agent-register-capacity
    desc: Registration capacity field
    crit: component
    conf: 0.99
    if:
      type: text
      regex: 'capacity\s*:'

  - id: loopback-proxy-bind
    desc: Loopback proxy bind
    crit: component
    conf: 0.99
    if:
      type: text
      regex: 'PORT\s*:\s*["'']0["'']\s*,\s*HOST\s*:\s*["'']127\.0\.0\.1["'']'

  - id: loopback-proxy-empty-agent-key
    desc: Empty agent proxy key
    crit: component
    conf: 0.99
    if:
      type: text
      regex: 'AGENT_PROXY_API_KEY\s*:\s*["'']["'']'

  - id: loopback-proxy-empty-cli-key
    desc: Empty CLI proxy key
    crit: component
    conf: 0.99
    if:
      type: text
      regex: 'CLI_SERVER_API_KEY\s*:\s*["'']["'']'

  - id: remote-agent-job-message
    desc: WebSocket agent accepts a controller job message
    crit: suspicious
    conf: 0.97
    attack: T1059.007
    if:
      type: text
      regex: '\b[A-Za-z_$][A-Za-z0-9_$]*\.t\s*===\s*["'']job["'']'

  - id: remote-agent-local-base-fetch
    desc: Local API fetch path
    crit: component
    conf: 0.98
    if:
      type: text
      regex: 'fetch\s*\(\s*localBase\s*\+\s*path\s*,\s*\{'

  # The three legs of the generic-local-POST composite below -- a fetch() URL
  # built by concatenation, `method: "POST"`, and `body: <variable>` -- are
  # ordinary HTTP-client mechanics that fire on any JavaScript that posts a
  # request. Naming them `remote-agent-forward-*` here filed neutral capability
  # matchers under a C2 backdoor objective; they now live in
  # micro-behaviors/communications/http/ and are referenced cross-tier.

  - id: remote-agent-chunk-send
    desc: WebSocket chunk send
    crit: component
    conf: 0.97
    if:
      type: text
      regex: 'send\s*\(\s*ws\s*,\s*\{\s*t\s*:\s*["'']chunk["'']'

  - id: remote-agent-chunk-type
    desc: Chunk message type
    crit: component
    conf: 0.97
    if:
      type: text
      regex: '\{\s*t\s*:\s*["'']chunk["'']'

  - id: remote-agent-chunk-data
    desc: Chunk data encoding
    crit: component
    conf: 0.97
    if:
      type: text
      regex: 'data\s*:\s*Buffer\.from\([^)]{1,120}\)'

  - id: remote-agent-chunk-base64
    desc: Base64 chunk conversion
    crit: component
    conf: 0.97
    if:
      type: text
      regex: '\.toString\(["'']base64["'']\)'

  - id: all-interface-shell-listener
    desc: All-interface interactive shell listener
    crit: suspicious
    conf: 0.98
    attack: T1046
    if:
      type: text
      substr: 'server.listen(port2, host === "127.0.0.1" ? "0.0.0.0"'

  - id: node-connector-poll-path
    desc: Node agent polls a connector task endpoint
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: '(?i)/api/connector/poll([?/#"'']|$)'

  - id: node-connector-response-path
    desc: Node agent posts connector task results
    crit: notable
    conf: 0.95
    attack: T1041
    if:
      type: text
      regex: '(?i)/api/connector/respond\b'

  - id: node-task-execute-bash
    desc: Node agent dispatches named shell task
    crit: suspicious
    conf: 0.97
    attack: T1059.007
    if:
      type: text
      regex: 'toolName\s*===\s*["'']execute_bash["'']'

composite_rules:
  - id: remote-agent-hub-url
    desc: Agent hub URL source
    crit: suspicious
    conf: 0.98
    any:
      - id: remote-agent-hub-url-start
      - id: remote-agent-hub-url-fallback

  - id: remote-agent-token-argument
    desc: Agent hub token source
    crit: suspicious
    conf: 0.98
    any:
      - id: remote-agent-token-env
      - id: remote-agent-token-config

  - id: remote-agent-default-hub-enrollment
    desc: Default external hub join condition
    crit: suspicious
    conf: 0.99
    attack: T1078
    all:
      - id: remote-agent-hub-join-guard
      - id: remote-agent-cli-mode-includes
      - id: remote-agent-cli-mode-exclusion
    near_bytes: 400

  - id: xor-obfuscated-default-agent-hub
    desc: Obfuscated default hub URL
    crit: suspicious
    conf: 0.99
    attack: T1027.013
    all:
      - id: xor-agent-hub-base64
      - id: xor-agent-hub-charcode
      - id: xor-agent-hub-fallback
    near_bytes: 1200

  - id: remote-agent-capacity-registration
    desc: Agent capacity registration
    crit: suspicious
    conf: 0.99
    all:
      - id: agent-register-message
      - id: agent-register-node
      - id: agent-register-models
      - id: agent-register-capacity
    near_bytes: 640

  - id: loopback-ai-credential-proxy
    desc: Starts an unauthenticated loopback AI proxy backed by local credentials
    crit: suspicious
    conf: 0.99
    attack: T1552.001
    all:
      - id: loopback-proxy-bind
      - id: loopback-proxy-empty-agent-key
      - id: loopback-proxy-empty-cli-key
    near_bytes: 320

  - id: remote-agent-generic-local-post
    desc: Generic local API POST
    crit: component
    conf: 0.98
    all:
      - id: micro-behaviors/communications/http/request/computed-url::fetch-concatenated-url
      - id: micro-behaviors/communications/http/request/client::post-method-text
      - id: micro-behaviors/communications/http/request/body::options-body-from-variable
    near_bytes: 260

  - id: remote-agent-local-http-forward
    desc: Agent local HTTP forward
    crit: suspicious
    conf: 0.98
    attack: T1059.007
    any:
      - id: remote-agent-local-base-fetch
      - id: remote-agent-generic-local-post

  - id: remote-agent-base64-chunk
    desc: Base64-encoded agent chunk
    crit: component
    conf: 0.97
    all:
      - id: remote-agent-chunk-type
      - id: remote-agent-chunk-data
      - id: remote-agent-chunk-base64
    near_bytes: 260

  - id: remote-agent-result-stream
    desc: Base64-streams local API responses over the controller channel
    crit: suspicious
    conf: 0.97
    attack: T1041
    any:
      - id: remote-agent-chunk-send
      - id: remote-agent-base64-chunk

  - id: node-websocket-short-code-remote-shell
    desc: Remote shell daemon uses short pairing code
    crit: hostile
    conf: 0.99
    attack: "T1059.004,T1078"
    scope: archive
    all:
      - id: micro-behaviors/communications/websocket/agent::websocket-pairing-code-session
      - id: objectives/command-and-control/backdoor/tasking/websocket-task-agent::websocket-task-request-message
      - id: objectives/command-and-control/backdoor/tasking/websocket-task-agent::websocket-shell-tool-schema
      - id: micro-behaviors/communications/http/websocket::websocket-constructor-call
      - id: micro-behaviors/process/create/shell/spawn::bash-exec

  - id: unauthorised-remote-agent-auto-enrollment
    desc: Silent credentialed remote-agent enrollment
    crit: hostile
    conf: 0.99
    scope: file
    all:
      - id: remote-agent-hub-url
      - id: remote-agent-token-argument
      - id: cli-startup-auto-join-call
      - id: micro-behaviors/communications/http/request/client::js-fetch-call
      - id: micro-behaviors/process/create/spawn::detached-ignored-unref-spawn

  - id: concealed-default-remote-agent-enrollment
    desc: Default startup enrolls credentialed AI clients into an XOR-hidden external hub
    crit: hostile
    conf: 0.99
    attack: "T1078,T1027.013,T1552.001"
    scope: file
    all:
      - id: remote-agent-default-hub-enrollment
      - id: remote-agent-credential-gate
      - id: remote-agent-credential-required-config
      - id: xor-obfuscated-default-agent-hub
      - id: remote-agent-capacity-registration
      - id: loopback-ai-credential-proxy

  - id: remote-agent-job-forwarding
    desc: Controller-supplied jobs drive a local AI API and receive streamed results
    crit: hostile
    conf: 0.99
    attack: "T1059.007,T1041"
    scope: file
    all:
      - id: remote-agent-job-message
      - id: remote-agent-local-http-forward
      - id: remote-agent-result-stream
      - id: remote-agent-capacity-registration
      - id: micro-behaviors/communications/http/request/client::js-fetch-call
  - id: persistent-remote-npm-agent
    desc: Persistent Node agent polls commands and self-updates via npm
    crit: hostile
    conf: 0.99
    for: [npm]
    scope: archive
    attack: "T1053,T1071.001,T1105"
    all:
      - id: micro-behaviors/communications/http/endpoints::api-commands-path
      - id: micro-behaviors/os/package-manager/install::global-npm-install-command
      - id: micro-behaviors/process/create/spawn::detached-true
      - id: micro-behaviors/process/daemonize/detach::node-handle-unref-text
  - id: cross-platform-persistent-remote-agent
    desc: Cross-platform persistent agent with remote command channel
    crit: hostile
    conf: 0.99
    for: [npm]
    scope: archive
    attack: "T1053,T1071.001"
    all:
      - id: micro-behaviors/communications/http/endpoints::api-commands-path
      - id: micro-behaviors/os/package-manager/install::global-npm-install-command
      - id: micro-behaviors/process/create/spawn::detached-true
      - id: micro-behaviors/process/daemonize/detach::node-handle-unref-text
      - id: objectives/persistence/system/init/boot::systemctl-user-enable
      - id: micro-behaviors/os/service/config::source-launchagents-join
      - id: micro-behaviors/os/service/control::launchctl-load-command

  - id: node-connector-remote-shell-agent
    desc: Node connector polls, executes, and returns shell tasks
    crit: hostile
    conf: 0.99
    scope: file
    attack: "T1059.007,T1071.001,T1041"
    all:
      - id: node-connector-poll-path
      - id: node-connector-response-path
      - id: node-task-execute-bash
      # Prefer exec/shell atoms: child-process-member-spawn is suppressed on
      # dist/ library-structure matches even for first-party agent code.
      - id: micro-behaviors/process/create/exec::js-child-process
      - id: micro-behaviors/process/create/spawn::shell-true

  - id: node-connector-daemonized-agent
    desc: Node connector agent detaches and persists a task poller
    crit: hostile
    conf: 0.99
    scope: file
    attack: "T1053,T1071.001"
    all:
      - id: node-connector-poll-path
      - id: node-connector-response-path
      - id: micro-behaviors/process/create/spawn::process-execpath-spawn
      - id: micro-behaviors/process/create/spawn::detached-true
      - id: micro-behaviors/process/daemonize/detach::node-handle-unref-text

  - id: public-pty-command-agent
    desc: Remote command agent exposes a PTY on all interfaces
    crit: hostile
    conf: 0.99
    scope: file
    attack: "T1059.007,T1071.001,T1046"
    all:
      - id: micro-behaviors/process/create/agent::pending-remote-command-method
      - id: micro-behaviors/process/create/agent::claim-remote-command-method
      - id: micro-behaviors/process/create/agent::dispatch-claimed-command-method
      - id: micro-behaviors/process/tty/pty::node-pty-spawn
      - id: micro-behaviors/process/tty/pty::node-socket-message-pty-write
      - id: micro-behaviors/communications/socket/listen::node-server-listen-all-interfaces
      - id: micro-behaviors/communications/http/websocket::websocket-class

  - id: all-interface-websocket-shell-daemon
    desc: All-interface daemon exposes interactive shell
    crit: hostile
    conf: 0.99
    attack: T1059.007,T1046
    scope: archive
    all:
      - id: objectives/command-and-control/backdoor/daemon::all-interface-shell-listener
      - id: objectives/command-and-control/backdoor/shell/pty::websocket-shell-input-write
      - id: objectives/command-and-control/backdoor/shell/pty::interactive-shell-spawn
      - id: micro-behaviors/communications/http/websocket::websocket
