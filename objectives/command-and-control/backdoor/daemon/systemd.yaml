defaults:
  platforms: [linux]
  for: [systemd]
  attack: "T1021.004,T1543.002"
  mbc: E1037
traits:
- id: sidedoor-execstart
  desc: systemd starts sidedoor tunnel
  crit: suspicious
  conf: 0.94
  if:
    type: value
    path: service.exec_start
    regex: '(^|/)(sidedoor)\b'
- id: reverse-tunnel-description
  desc: Reverse tunnel service description
  crit: suspicious
  conf: 0.9
  if:
    type: value
    path: unit.description
    regex: '(?i)reverse tunnel'
- id: bico-bind-service
  desc: Bico bind backdoor service
  crit: suspicious
  conf: 0.94
  if:
    type: text
    regex: '(?i)Backdoor Service - Bico|ExecStart=.{0,80}/bico_bind\b'
- id: sided00r-root-local-service
  desc: SideD00r root local service
  crit: suspicious
  conf: 0.94
  if:
    type: text
    regex: '(?i)Description=SideD00r|ExecStart=.{0,80}/root/\.local/start\.sh'
- id: sidedoor-ssh-masquerade-description
  desc: Service description masquerades as SSH daemon
  crit: suspicious
  conf: 0.9
  if:
    type: text
    regex: '(?i)^Description=SSH connection daemon'
- id: sidedoor-default-envfile
  desc: Sidedoor default environment file
  crit: notable
  conf: 0.9
  if:
    type: text
    substr: 'EnvironmentFile=-/etc/default/sidedoor'
composite_rules:
- id: sidedoor-envfile-autostart
  desc: Sidedoor unit loads packaged env and autostarts
  crit: hostile
  conf: 0.96
  all:
  - id: sidedoor-execstart
  - id: sidedoor-default-envfile
  - id: micro-behaviors/os/service/unit-field::install-wanted-by-exists
- id: sidedoor-masqueraded-reverse-tunnel
  desc: Sidedoor tunnel masquerades as an SSH daemon
  crit: hostile
  conf: 0.97
  all:
  - id: sidedoor-execstart
  - id: sidedoor-ssh-masquerade-description
- id: named-backdoor-root-service
  desc: Named backdoor systemd service runs as root
  crit: hostile
  conf: 0.97
  all:
  - id: bico-bind-service
  - id: micro-behaviors/os/service/config::service-runs-as-root
  - id: micro-behaviors/os/service/unit-field::install-wanted-by-exists
- id: sidedoor-reverse-tunnel-service
  desc: Sidedoor reverse tunnel service
  crit: hostile
  conf: 0.97
  all:
  - id: sidedoor-execstart
  any:
  - id: reverse-tunnel-description
  - id: micro-behaviors/os/service/unit-field::install-wanted-by-exists
- id: bico-bind-backdoor-service
  desc: Bico bind backdoor systemd service
  crit: hostile
  conf: 0.98
  all:
  - id: bico-bind-service
  any:
  - id: micro-behaviors/os/service/restart-policy::restart-always
  - id: micro-behaviors/os/service/unit-field::install-wanted-by-exists
- id: sided00r-root-local-backdoor-service
  desc: SideD00r root-local systemd backdoor
  crit: hostile
  conf: 0.98
  all:
  - id: sided00r-root-local-service
  any:
  - id: objectives/persistence/system/service/install::systemd-sudo-root-local-script
  - id: micro-behaviors/os/service/unit-field::install-wanted-by-exists
