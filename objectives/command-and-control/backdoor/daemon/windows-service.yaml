# Service-Based Implant Detection - Windows PE
# Composites for PE binaries that install as a service with C2 and crypto capabilities
defaults:
  platforms: [windows]
  for: [pe]
composite_rules:
  - id: service-implant-with-c2
    desc: Service-installing binary with HTTP and crypto
    crit: suspicious
    conf: 0.85
    attack: T1543.003
    all:
    - id: micro-behaviors/os/service/configure::service-create-configure-start-api-set
    - id: micro-behaviors/communications/http/client/winhttp::winhttp-request-flow
    - id: micro-behaviors/crypto/library/
    any:
    - id: micro-behaviors/process/enumerate/snapshot::create-toolhelp32-snapshot
    - id: micro-behaviors/os/network/connections::get-tcp-table
    downgrade:
      any:
      - id: metadata/binary/installer/
      - id: metadata/binary/vendor/
  # A service that opens the logged-on desktop and a WinInet URL is leaving
  # session 0 to fetch a remote module. Each leg is only co-present; the
  # combination is the backdoor.
  - id: input-desktop-service-url-client
    desc: CreateService with input-desktop WinInet URL
    crit: hostile
    conf: 0.96
    attack: T1543.003,T1071.001
    all:
      - id: micro-behaviors/os/service/create::create-service
      - id: micro-behaviors/ui/window/station::open-input-desktop
      - id: micro-behaviors/ui/window/station::set-thread-desktop-import
      - id: micro-behaviors/communications/http/client/wininet::internet-open-url
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/installer/family/
      - id: metadata/binary/vendor/
