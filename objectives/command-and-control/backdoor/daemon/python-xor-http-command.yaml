defaults:
  for: [python]
  platforms: [unix, windows]

traits:
  - id: python-command-field-to-popen-read
    desc: Runs command variable and reads output
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: 'os\.popen\(\s*command\s*\)\.read\(\s*\)'

composite_rules:
  - id: python-xor-http-command-polling
    desc: XOR HTTP polling runs commands and returns output
    crit: hostile
    conf: 0.97
    attack: T1059.006,T1071.001
    scope: file
    all:
      - id: python-command-field-to-popen-read
      - id: micro-behaviors/data/collection/map::mapping-get-code-command-script-payload-key
      - id: micro-behaviors/data/encode/xor::python-repeating-key-xor-helper
      - id: micro-behaviors/communications/http/post::requests-post
      - id: micro-behaviors/time/sleep/interval::python-loop-sleep-call
