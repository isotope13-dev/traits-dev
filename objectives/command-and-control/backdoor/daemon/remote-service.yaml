# Remote Shell Backdoor Installation
# Detects telnet and SSH services exposed for persistent remote shell access.
# ATT&CK: T1021.004 (Remote Services: SSH)
# MBC: E1037 (Communication)
defaults:
  attack: T1021.004
  platforms: [unix, android, ios]
  for: [elf, shell]
composite_rules:
  - id: telnet-service
    desc: "Telnet service for remote access"
    crit: notable
    conf: 0.8
    all:
      - id: micro-behaviors/communications/socket/telnet::telnet
    any:
      - id: micro-behaviors/communications/socket/listen::listen-sym
      - id: micro-behaviors/communications/socket/accept::accept-sym
      - id: micro-behaviors/communications/socket/accept::accept64-sym
      - id: micro-behaviors/os/service/daemon::telnetd
    unless:
      - id: micro-behaviors/communications/http/download/curl::curl-easy-init
      - id: metadata/filename/identity::telnet-executable-basename
    downgrade:
      any:
        - id: metadata/binary/layout/size::massive-executable

  - id: telnetd-daemon
    desc: "Telnet daemon for remote access"
    crit: suspicious
    conf: 0.85
    all:
      - id: micro-behaviors/os/service/daemon::telnetd
    any:
      - id: micro-behaviors/communications/socket/listen::listen-sym
      - id: micro-behaviors/communications/socket/accept::accept-sym
      - id: micro-behaviors/communications/socket/accept::accept64-sym
    unless:
      - id: metadata/filename/identity::telnet-executable-basename
      - id: well-known/tool/sysadmin/busybox::busybox-binary

  - id: ssh-configured-backdoor
    for: [shell]
    desc: SSH service with suspicious access configuration
    crit: suspicious
    conf: 0.9
    mbc: "E1037"
    all:
      # Merely naming sshd_config and a permissive authentication setting is
      # normal provisioning. Prove an edit and require backdoor-specific
      # access evidence below before inferring attacker intent.
      - id: micro-behaviors/os/service/remote::sshd-config-sed-edit
    any:
      - id: micro-behaviors/os/service/remote::sshd-root-login-enabled
      - id: objectives/persistence/login/ssh/backdoor::hardcoded-root-authorized-key

    unless:
      - id: well-known/app/infrastructure/
      - id: metadata/build/generated::legitimate-kubernetes-incluster-client-marker
      # threecb task configs enable root SSH login in victim containers.
      - id: well-known/lib/ai/inspect-evals::eval-corpus-context
      # A container entrypoint that generates host keys, rewrites sshd_config
      # and runs `sshd -D` as its own foreground process (e.g. MegaLinter's
      # opt-in MEGALINTER_SSH server) provisions SSH for the image; a backdoor
      # reconfigures a host whose sshd is already running.
      - id: micro-behaviors/os/service/remote::sshd-container-foreground-start
      # Integration harnesses may enable root SSH on disposable test systems
      # so their controller can provision and inspect those machines.
      - id: metadata/path::test-directory-component
      - id: metadata/package/testing/
      - id: metadata/path::proxmoxve-community-scripts
      - id: metadata/build/recognized-contexts::freebsd-installerconfig-script
      - id: ssh-image-or-vagrant-provision

  - id: ssh-image-or-vagrant-provision
    desc: Recognized image, Vagrant or StartOS SSH provisioning context
    crit: exception
    conf: 0.94
    any:
      - id: metadata/build/recognized-contexts::cloud-instance-user-data-context
      - id: micro-behaviors/os/service/remote::vagrant-box-root-ssh-provision
      # StartOS's Clearnet WireGuard setup explicitly provisions key-based
      # root access on a user-selected VPS as part of VPN installation.
      - id: well-known/app/system/startos::clearnet-setup-context

  - id: remote-shell-backdoor
    desc: "Remote shell backdoor"
    crit: suspicious
    conf: 0.9
    mbc: "E1037"
    unless:
      - id: well-known/app/network/openssh/
    any:
      - id: telnetd-daemon
      - id: ssh-configured-backdoor
  - id: iot-telnet-service-backdoor
    desc: IoT telnet service backdoor
    crit: hostile
    conf: 0.98
    all:
      - id: telnetd-daemon
      - id: micro-behaviors/fs/path/application/interpreter::bin-busybox-path
      - id: micro-behaviors/fs/proc/info/path::proc-net-tcp
    unless:
      - id: metadata/filename/identity::telnet-executable-basename
