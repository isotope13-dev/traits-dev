# Remote Shell Backdoor Installation
# Detects telnet and SSH services exposed for persistent remote shell access.
# ATT&CK: T1021.004 (Remote Services: SSH)
# MBC: E1037 (Communication)
defaults:
  attack: T1021.004
  platforms: [unix, android, ios]
  for: [elf, shell]
composite_rules:
  - id: telnet-service
    desc: "Telnet service for remote access"
    crit: notable
    conf: 0.8
    all:
      - id: micro-behaviors/communications/socket/telnet::telnet
    any:
      - id: micro-behaviors/communications/socket/listen::listen-sym
      - id: micro-behaviors/communications/socket/accept::accept-sym
      - id: micro-behaviors/communications/socket/accept::accept64-sym
      - id: micro-behaviors/os/service/daemon::telnetd
    unless:
      - id: micro-behaviors/communications/http/client/curl::curl-easy-init
      - id: metadata/filename/identity::telnet-executable-basename
    downgrade:
      any:
        - id: metadata/binary/layout/size::massive-executable

  - id: telnetd-daemon
    desc: "Telnet daemon for remote access"
    crit: suspicious
    conf: 0.85
    all:
      - id: micro-behaviors/os/service/daemon::telnetd
    any:
      - id: micro-behaviors/communications/socket/listen::listen-sym
      - id: micro-behaviors/communications/socket/accept::accept-sym
      - id: micro-behaviors/communications/socket/accept::accept64-sym
    unless:
      - id: metadata/filename/identity::telnet-executable-basename
      - id: well-known/tool/sysadmin/busybox::busybox-binary

  - id: ssh-configured-backdoor
    for: [shell]
    desc: SSH service with suspicious access configuration
    crit: suspicious
    conf: 0.9
    mbc: "E1037"
    all:
      # Merely naming sshd_config and a permissive authentication setting is
      # normal provisioning. Prove an edit and require backdoor-specific
      # access evidence below before inferring attacker intent.
      - id: micro-behaviors/os/service/remote::sshd-config-sed-edit
    any:
      - id: micro-behaviors/os/service/remote::sshd-root-login-enabled
      - id: objectives/command-and-control/backdoor/ssh::hardcoded-root-authorized-key
    unless:
      # spread prepare scripts open root SSH on the disposable test guest.
      - id: well-known/tool/development/testing/spread::spread-harness-environment
      - id: well-known/app/infrastructure/ansible::ansible-test-bootstrap-context
      # diskimage-builder elements build disposable CI node images that are
      # provisioned over root SSH; the sed and root-login atoms stay visible.
      - id: metadata/path/development::diskimage-builder-element-phase-path

  - id: remote-shell-backdoor
    desc: "Remote shell service indicators"
    crit: suspicious
    conf: 0.9
    mbc: "E1037"
    any:
      - id: telnetd-daemon
      - id: ssh-configured-backdoor
  - id: iot-telnet-service-backdoor
    desc: IoT telnet service backdoor
    crit: hostile
    conf: 0.98
    all:
      - id: telnetd-daemon
      - id: micro-behaviors/fs/path/application/interpreter::bin-busybox-path
      - id: micro-behaviors/fs/proc/info/path::proc-net-tcp
    unless:
      - id: metadata/filename/identity::telnet-executable-basename
