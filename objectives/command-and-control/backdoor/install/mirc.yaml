# Script-driven install steps: the payload reaches a system directory and
# runs from there. Each leg is ordinary mIRC scripting; together with the
# hidden-client composite below they install with no visible window.
defaults:
  platforms: [windows]
  for: [mirc]
  attack: T1059
traits:
  - id: mirc-run-pif-file
    desc: Launches a pif from mIRC
    crit: notable
    conf: 0.9
    if:
      type: text
      # A .pif executes as a program when shelled, like an .exe.
      regex: '(?i)(^|[\s;{|=])\.?/?run\s+\S{1,48}\.pif\b'
  # `.timer 1 10 run <target>`: the payload runs after a delay, decoupling
  # the install moment from execution.
  - id: mirc-timer-delayed-run
    desc: mIRC timer runs a delayed command
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)\.timer\s+\d+\s+\d+\s+run\s+\S+'
  # `copy <payload> c:\...\system32\...`: the drop lands where Windows
  # binaries live, the first half of a system-directory install.
  - id: mirc-copy-system32-drop
    desc: mIRC copies a file into system32
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)(^|[\s;{|=])\.?/?copy\s+\S+\s+[A-Za-z]:\\[^\r\n]{0,80}system32\\'
composite_rules:
  - id: mirc-start-hide-drop-run
    desc: mIRC START hides client and runs payload
    crit: hostile
    conf: 0.96
    all:
      - id: objectives/command-and-control/channel/irc/client::mirc-script-event-start
      - id: objectives/evasion/process/hidden/window::mirc-dll-hide-call
      - id: mirc-copy-system32-drop
    any:
      - id: mirc-run-pif-file
      - id: objectives/command-and-control/channel/irc/client::mirc-launches-exe
      - id: mirc-timer-delayed-run
