defaults:
  for: [scripts, elf, pe]
  platforms: [unix, windows]
  attack: T1098.004
composite_rules:
  - id: redis-authorized-keys-backdoor
    desc: Redis key payload saves into SSH authorized_keys
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/data/db/redis::redis-dump-authorized-keys-filename
      - id: micro-behaviors/data/db/redis::redis-dump-ssh-directory
      - id: micro-behaviors/data/db/redis::redis-ssh-key-set-value
      - id: micro-behaviors/data/db/redis::redis-save-command
    unless:
      - id: well-known/app/system/anthropic-cybersecurity-skills::cybersecurity-skill-template-guide
