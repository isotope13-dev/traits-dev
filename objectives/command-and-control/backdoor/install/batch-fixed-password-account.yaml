defaults:
  platforms: [windows]
  for: [batch]
  attack: T1136.001

composite_rules:
  - id: batch-installs-fixed-password-account-backdoor
    desc: Fixed-password account creation alongside hidden logon user
    crit: hostile
    conf: 0.9
    size_max: 1024
    all:
      - id: micro-behaviors/os/user/create::net-user-add-inline-password
      - id: micro-behaviors/os/user/create::net-user-create
      - id: objectives/persistence/login/winlogon::winlogon-specialaccounts-hidden-user
