defaults:
  platforms: [windows]
  for: [python]
  attack: T1136.001,T1021.006,T1564.002

composite_rules:
  - id: winrm-hidden-administrator
    desc: WinRM execution alongside concealed administrator creation
    crit: hostile
    conf: 0.97
    ref: https://socradar.io/blog/dark-web-profile-n0n-ransomware/
    all:
      - id: micro-behaviors/communications/http/client/library::winrm-run-command
      - id: micro-behaviors/os/user/create::net-user-create-text
      - id: micro-behaviors/os/group/membership::net-localgroup-administrators-add-text
      - id: objectives/persistence/login/winlogon::winlogon-specialaccounts-hidden-user
