# Complete Backdoor Installation Chains
# Detects multi-step attack sequences combining account creation with persistent access
# Generic indicator for comprehensive system compromise
defaults:
  mbc: E1015
  platforms: [linux, unix, android, macos, ios]
  for: [elf, shell]
composite_rules:
  # A VPS hardening script creates a sudo user with the operator's key and
  # restarts sshd, the same account-plus-key-plus-sshd sequence a backdoor
  # installer runs. What it does alongside is the opposite of a backdoor: it
  # turns direct root login off and sets a default-deny inbound firewall. An
  # installer that wants a way in does not close the front door and the ports.
  - id: server-hardening-account-setup
    desc: Hardening script disables root SSH and denies inbound
    crit: exception
    for: [shell]
    all:
      - id: micro-behaviors/os/service/remote::sshd-root-login-disabled
      - id: metadata/build/package/maintainer-scripts::server-hardening-firewall-policy
  - id: account-ssh-access-setup
    desc: Account creation with SSH access setup
    crit: notable
    conf: 0.92
    attack: "T1098.004"
    all:
      - id: micro-behaviors/os/user/account::useradd-command
      - id: micro-behaviors/os/user/account::useradd-login-shell
      - id: micro-behaviors/fs/path/public-key::ssh-authorized-keys
  # Account and key provisioning alone also appears in legitimate server
  # setup. Pair it with a hardcoded operator key and an immediately staged,
  # detached executable to identify the combined backdoor installation chain.
  - id: account-ssh-key-payload-backdoor
    desc: Creates an SSH account and launches a fetched executable
    crit: hostile
    conf: 0.98
    for: [shell]
    attack: "T1098.004,T1105,T1059.004"
    all:
      - id: account-ssh-access-setup
      - id: micro-behaviors/crypto/asymmetric/ssh::hardcoded-public-key
      - id: objectives/execution/payload/file-exec/command/shell::raw-ip-shell-fetch-chmod-detach
    near_bytes: 4096
  - id: password-set-privilege-escalation
    desc: Password setting with privilege escalation
    crit: hostile
    conf: 0.90
    attack: "T1136.001"
    all:
      - id: micro-behaviors/os/user/account::chpasswd-command
      - id: objectives/persistence/login/account/create::privilege-escalation-setup
    unless:
      - id: well-known/app/infrastructure/pvetui::pvetui-ansible-bootstrap-context
      - id: well-known/app/network/gns3::gns3-remote-install-context
      - id: well-known/app/infrastructure/pritunl-cloud::pritunl-cloud-setup-context
      - id: well-known/app/network/sonic-mgmt::sonic-mgmt-container-setup-context
      - id: server-hardening-account-setup
      # The password is collected from the operator in this script. A planted
      # account does not stop to ask for the credential it is about to set.
      - id: micro-behaviors/ui/dialog/prompt::shell-interactive-password-prompt
  - id: complete-backdoor-installation
    desc: Complete backdoor account and SSH setup
    crit: hostile
    conf: 0.95
    attack: "T1098.004"
    all:
      - id: micro-behaviors/os/user/account::account-provisioning
      - id: objectives/persistence/login/account/create::privilege-escalation-setup
      - id: micro-behaviors/fs/path/public-key::ssh-authorized-keys
      - id: micro-behaviors/os/service/start::sshd-restart-command
    unless:
      - id: server-hardening-account-setup
  - id: fixed-key-passwordless-root-account
    for: [shell]
    desc: Fixed-key SSH account gains passwordless root
    crit: hostile
    conf: 0.99
    attack: "T1098.004,T1548.003"
    # Correlate one provisioning sequence: a fixed-key login is created, added
    # to wheel, and allowed to pass su without presenting another credential.
    near_lines: 12
    all:
      - id: account-ssh-access-setup
      - id: micro-behaviors/crypto/asymmetric/ssh::hardcoded-public-key
      - id: micro-behaviors/os/group/membership::sed-adds-wheel-group-members
      - id: micro-behaviors/os/pam/auth::pam-wheel-trust-passwordless-su
    unless:
      - id: metadata/build/recognized-contexts::development-ssh-provisioning
