defaults:
  platforms: [windows]
  for: [pe]
  attack: T1539,T1555.003
  mbc: B0030

traits:
  - id: discord-client-location-reload-string
    desc: Browser location reload call in Discord helper
    crit: component
    if:
      type: text
      regex: '\blocation\.reload\s*\('

composite_rules:
  # A native Discord helper that drives the local Chromium debug interface,
  # then inserts Discord's encrypted-token storage records and reloads the
  # client. The token prefix distinguishes this from ordinary CDP automation.
  - id: discord-token-via-cdp-storage-injection
    desc: Injects Discord token records through local CDP
    crit: hostile
    conf: 0.98
    near_bytes: 262144
    all:
      - id: micro-behaviors/communications/http/devtools/client::cdp-default-debug-port-url
      - id: micro-behaviors/communications/http/devtools/client::cdp-method-runtime-evaluate
      - id: micro-behaviors/os/application/target/network::discord-client-name-reference
      - id: micro-behaviors/data/format/discord-token::discord-encrypted-token-prefix-bytes
      - id: micro-behaviors/data/db/write::dom-storage-setitem
      - id: discord-client-location-reload-string
