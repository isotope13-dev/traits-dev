# Discord token harvesters that hide path/API names in string tables.
defaults:
  platforms: [unix, windows]
  for: [javascript]

traits:
  - id: obfuscated-discord-fragment
    desc: Split Discord name fragment
    crit: baseline
    conf: 0.88
    if:
      type: text
      regex: '(?i)\b(discr|disco)\b'
  - id: obfuscated-leveldb-fragment
    desc: Split LevelDB name fragment
    crit: baseline
    conf: 0.88
    if:
      type: text
      regex: '(?i)(veldb|eldb|ldb)'
  - id: obfuscated-token-fragment
    desc: Token name in an obfuscated string table
    crit: baseline
    conf: 0.86
    if:
      type: text
      substr: token
  - id: obfuscated-local-fragment
    desc: Local path fragment in a string table
    crit: baseline
    conf: 0.86
    if:
      type: text
      regex: '(?i)(local|appd)'
  - id: obfuscated-read-fragment
    desc: File read API fragment
    crit: baseline
    conf: 0.86
    if:
      type: text
      regex: '(?i)(readf|readd)'
  - id: obfuscated-api-fragment
    desc: Discord API path fragment
    crit: baseline
    conf: 0.86
    if:
      type: text
      substr: api/v
  - id: obfuscated-webhook-fragment
    desc: Webhook marker in an obfuscated string table
    crit: baseline
    conf: 0.86
    if:
      type: text
      regex: '(?i)webho'
  - id: obfuscated-http-fragment
    desc: HTTP scheme fragment in a string table
    crit: baseline
    conf: 0.86
    if:
      type: text
      substr: 'http:'

composite_rules:
  - id: discord-leveldb-string-table-harvester
    desc: Obfuscated Discord LevelDB token harvester
    crit: hostile
    conf: 0.98
    attack: T1555.003,T1005,T1027
    all:
      - id: objectives/anti-static/obfuscation/obfuscator/js-obfuscator::hex-mangled-bracket-rotation
      - id: objectives/anti-static/obfuscation/obfuscator/js-obfuscator::hex-mangled-parseint-rotation-guard
    any:
      - id: obfuscated-discord-fragment
      - id: obfuscated-leveldb-fragment
      - id: obfuscated-token-fragment
      - id: obfuscated-local-fragment
      - id: obfuscated-read-fragment
    needs: 4
  - id: discord-api-token-validation-string-table
    desc: Obfuscated Discord token validation request
    crit: hostile
    conf: 0.97
    attack: T1528,T1027
    all:
      - id: objectives/anti-static/obfuscation/obfuscator/js-obfuscator::hex-mangled-bracket-rotation
      - id: objectives/anti-static/obfuscation/obfuscator/js-obfuscator::hex-mangled-parseint-rotation-guard
    any:
      - id: obfuscated-discord-fragment
      - id: obfuscated-token-fragment
      - id: obfuscated-api-fragment
      - id: metadata/lang/source/naming/interface::fetch-word-text
      - id: obfuscated-leveldb-fragment
    needs: 4
  - id: discord-token-webhook-string-table-export
    desc: Obfuscated Discord token webhook exfiltration
    crit: hostile
    conf: 0.98
    attack: T1041,T1567.002,T1027
    all:
      - id: objectives/anti-static/obfuscation/obfuscator/js-obfuscator::hex-mangled-bracket-rotation
      - id: objectives/anti-static/obfuscation/obfuscator/js-obfuscator::hex-mangled-parseint-rotation-guard
    any:
      - id: obfuscated-discord-fragment
      - id: obfuscated-token-fragment
      - id: obfuscated-webhook-fragment
      - id: metadata/lang/source/naming/interface::fetch-word-text
      - id: obfuscated-http-fragment
    needs: 4
  - id: discord-leveldb-direct-token-harvest
    desc: Reads Discord LevelDB token-shaped values
    crit: hostile
    conf: 0.98
    attack: T1555.003,T1005
    all:
      - id: micro-behaviors/fs/path/app-data::discord-local-storage-path
      - id: micro-behaviors/fs/path/app-data::chromium-leveldb-local-storage
      - id: micro-behaviors/data/format/credentials::discord-token-regex-source-variants
    any:
      - id: micro-behaviors/fs/directory/async-enumeration::node-readdir-dynamic-name
      - id: micro-behaviors/fs/directory/async-enumeration::node-readfile-dynamic-name
