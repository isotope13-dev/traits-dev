defaults:
  for: [c, cpp]
  platforms: [windows]
  attack: T1555

traits:
  - id: native-dpapi-decrypt-helper-call
    desc: Calls a DPAPI decryption helper
    crit: notable
    conf: 0.85
    if:
      type: symbol
      kind: call
      exact: decryptDPAPI
  - id: native-append-decrypted-token
    desc: Appends a decrypted-token identifier
    crit: notable
    conf: 0.85
    if:
      type: symbol
      kind: call
      regex: '\.push_back$'
      arg:
        index: 0
        kind: identifier
        name_regex: '^decryptedToken$'

composite_rules:
  - id: native-discord-leveldb-token-recovery
    desc: Discord token markers, LevelDB and decryption with token collection
    crit: hostile
    conf: 0.97
    all:
      - id: native-dpapi-decrypt-helper-call
      - id: native-append-decrypted-token
      - id: micro-behaviors/data/format/discord-token::discord-encrypted-token-prefix-source
      - id: micro-behaviors/fs/path/app-data/browser::chromium-leveldb-local-storage
