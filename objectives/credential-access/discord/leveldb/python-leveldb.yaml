# Token syntax and store references need a file-read operation; no send is inferred.
defaults:
  platforms: [unix, windows]
  for: [python, whl, python-sdist, zip]
  crit: notable
  conf: 0.95

composite_rules:
  - id: python-leveldb-token-read-profile
    desc: LevelDB token patterns and Python file reads
    crit: suspicious
    conf: 0.95
    attack: T1552.001
    scope: file
    all:
      - id: micro-behaviors/fs/read/file/full::python-file-content-read-operation
      - id: micro-behaviors/data/format/credentials::discord-token-regex-source
      - id: micro-behaviors/fs/path/app-data::chromium-leveldb-local-storage
