# Generated variable names and four optional text fragments cannot establish
# Discord token theft: the old combinations could pass without any Discord
# reference. Retain the source-specific storage/token observation at its
# canonical acquisition home. API validation and webhook export retain their
# independent classifiers requiring real account-API and webhook evidence.
defaults:
  platforms: [unix, windows]
  for: [javascript]

composite_rules:
  - id: discord-leveldb-direct-token-harvest
    desc: Discord LevelDB token patterns with file-read names
    crit: hostile
    conf: 0.98
    attack: T1555.003,T1005
    all:
      - id: micro-behaviors/fs/path/app-data::discord-local-storage-path
      - id: micro-behaviors/fs/path/app-data::chromium-leveldb-local-storage
      - id: micro-behaviors/data/format/credentials::discord-token-regex-source-variants
    any:
      - id: micro-behaviors/fs/directory/async-enumeration::node-readdir-dynamic-name
      - id: micro-behaviors/fs/directory/async-enumeration::node-readfile-dynamic-name
