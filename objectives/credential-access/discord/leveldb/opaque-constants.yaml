# Serialized constants preserve independent token-store, key-decryption,
# token-search and outbound webhook evidence. No function-call claim is made.
defaults:
  for: [data]
  platforms: [windows]
composite_rules:
  - id: opaque-token-decryption-webhook
    desc: Discord token recovery and webhook in opaque data
    crit: hostile
    conf: 0.97
    attack: T1528,T1555.003
    all:
      - id: micro-behaviors/data/format/discord-token::discord-encrypted-token-prefix-source
      - id: micro-behaviors/fs/path/app-data/browser::chromium-leveldb-local-storage
      - id: micro-behaviors/os/security/dpapi::crypt-unprotect-data-container-string
      - id: micro-behaviors/communications/http/webhook::discord-webhook-path
