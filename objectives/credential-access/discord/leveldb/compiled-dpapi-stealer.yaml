# Compiled stealers that implement AES-GCM in user space (e.g. Rust aes-gcm)
# rather than calling Windows BCrypt still combine DPAPI key unwrapping,
# Local State, LevelDB directory scanning, Discord client targets, and the
# dQw4w9WgXcQ encrypted token parser format.
defaults:
  platforms: [windows]
  for: [pe]
  attack: T1555.003,T1528
  mbc: B0030

composite_rules:
  - id: compiled-discord-leveldb-dpapi-stealer
    desc: Compiled stealer decrypts Discord LevelDB tokens via DPAPI
    crit: hostile
    conf: 0.97
    all:
      - id: micro-behaviors/data/format/discord-token::discord-token-parser-formats
      - id: micro-behaviors/os/security/dpapi::crypt-unprotect-data-api
      - id: micro-behaviors/fs/path/application/browser/profile::local-state
      - id: micro-behaviors/data/db/leveldb::leveldb-ref
      - id: micro-behaviors/os/application/target/network::discord-client-name-reference
