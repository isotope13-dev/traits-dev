# A native (Go/C++) program that reads the Discord client's and Chromium's
# LevelDB Local Storage, where login tokens live, and holds a Discord webhook
# to send them out. Discord itself never reads another app's LevelDB, and a
# webhook URL is the stealer's drop box.
defaults:
  platforms: [windows]
  for: [pe]
  attack: T1528,T1041
composite_rules:
  - id: native-discord-leveldb-token-webhook-stealer
    desc: Native binary reads Discord LevelDB and holds a webhook
    crit: hostile
    conf: 0.93
    mbc: B0028
    all:
      - id: micro-behaviors/data/db/leveldb::leveldb-ref
      - id: micro-behaviors/fs/path/app-data::chromium-leveldb-local-storage
      - id: micro-behaviors/communications/http/webhook::discord-webhook-path
    any:
      - id: well-known/app/communication/discord::discord-app-path-windows
      - id: micro-behaviors/os/application/target/network::discord-client-name-reference
    unless:
      - id: metadata/signed/platform/
      - id: metadata/package/testing/
