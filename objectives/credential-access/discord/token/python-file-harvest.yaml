defaults:
  platforms: [windows, unix]
  for: [python]
  attack: T1528
traits:
  - id: python-file-discord-token-regex-harvest
    desc: Searches file contents with Discord token regex
    crit: suspicious
    conf: 0.98
    if:
      type: tree-sitter
      query: |
        (block
          (expression_statement (assignment
            left: (identifier) @pattern_var
            right: (call function: (attribute
              object: (identifier) @re
              attribute: (identifier) @compile)
              arguments: (argument_list (string) @pattern))))
          (for_statement body: (block
            (expression_statement (assignment
              left: (identifier) @data
              right: (call function: (attribute
                object: (call function: (identifier) @open)
                attribute: (identifier) @read))))
            (for_statement
              right: (call function: (attribute
                object: (identifier) @matcher
                attribute: (identifier) @findall)
                arguments: (argument_list (identifier) @input))) @loop))
          (#eq? @re "re")
          (#eq? @compile "compile")
          (#match? @pattern "mfa.*84|\\{24(,26)?\\}.*\\{6\\}")
          (#eq? @open "open")
          (#eq? @read "read")
          (#eq? @findall "findall")
          (#eq? @pattern_var @matcher)
          (#eq? @data @input))
composite_rules:
  - id: python-file-token-harvest-and-validation
    desc: File token harvesting with Discord validation
    crit: hostile
    conf: 0.98
    near_lines: 20
    all:
      - id: python-file-discord-token-regex-harvest
      - id: discord-api-token-validate
