defaults:
  for: [javascript]
  platforms: [windows]
  attack: T1555,T1539

traits:
  - id: discord-localstorage-token-field
    desc: Reads token field from browser local storage
    crit: notable
    if:
      type: text
      regex: '(?s)localStorage[\s\S]{0,300}\[\s*\\?["'']token\\?["'']\s*\]'
composite_rules:
  - id: discord-core-localstorage-token-post
    desc: Discord core injection posts local storage token
    crit: hostile
    conf: 0.99
    all:
      - id: discord-localstorage-token-field
      - id: micro-behaviors/communications/messaging/send::send-token-text-proximity
      - id: micro-behaviors/fs/path/app-data/application::discord-core-module
      - id: micro-behaviors/fs/path/app-data/application::discord-index-js
      - id: micro-behaviors/communications/http/post::xhr-post-open-send
      - id: micro-behaviors/process/terminate/command::js-taskkill-force-command
