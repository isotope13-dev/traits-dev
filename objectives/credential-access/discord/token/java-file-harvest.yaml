defaults:
  platforms: [windows, unix]
  for: [class]
composite_rules:
  - id: jvm-encrypted-discord-token-file-harvest
    desc: Discord token file search with decryption APIs
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/data/format/credentials::discord-encrypted-token-prefix
      - id: micro-behaviors/data/format/credentials::discord-token-regex-source
      - id: metadata/import/jvm::filereader-class-reference
      - id: metadata/import/jvm::regex-matcher-member-reference
      - id: metadata/import/jvm::decrypt-member-reference
      - id: micro-behaviors/data/decode/base64::java-base64-decode-bytecode-call
