defaults:
  platforms: [unix, windows]
  for: [javascript]
  attack: T1528,T1041,T1567.002
  crit: notable
  conf: 0.95

traits:
  - id: discord-user-token-config-field
    desc: Discord USER_TOKEN configuration field
    if:
      type: text
      regex: '\b(USER_TOKEN|config\.USER_TOKEN)\b'
  - id: discord-users-me-auth-get
    desc: Discord /users/@me Authorization GET
    if:
      type: text
      regex: '(?s)discord\.com/api/v\d+/users/@me.{0,200}Authorization'
