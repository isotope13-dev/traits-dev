# Encrypted Discord tokens harvested from LevelDB storage and decrypted
# with the DPAPI-unprotected Chromium key. Reading the dQw4w9WgXcQ-prefixed
# token store and unwrapping its key has no self-token helper reading:
# the store belongs to installed Discord/browser profiles.
defaults:
  platforms: [windows]
  for: [python]
  attack: T1555.003,T1528

composite_rules:
  - id: python-leveldb-encrypted-token-dpapi-decrypt
    desc: LevelDB encrypted tokens decrypted via DPAPI key
    crit: hostile
    conf: 0.98
    scope: file
    all:
      - id: micro-behaviors/data/format/credentials::discord-encrypted-token-prefix-source
      - id: micro-behaviors/fs/path/app-data::chromium-leveldb-local-storage
      - id: micro-behaviors/os/security/dpapi::python-dpapi-unprotect
      - id: micro-behaviors/os/security/dpapi::python-chromium-key-unprotect
