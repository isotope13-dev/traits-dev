defaults:
  platforms: [windows, unix]
  for: [class]
traits:
  - id: jvm-discord-token-collection-helper
    desc: JVM Discord token collector helper reference
    crit: notable
    conf: 0.9
    if:
      type: import
      regex: '(^|[./])getDiscordTokens$'
composite_rules:
  # The analyzer projects constant-pool method references, not their data
  # flow. Flag the acquisition/POST combination without claiming that the
  # token itself is proven to reach the HTTP body by this matcher.
  - id: jvm-discord-collector-http-post
    desc: JVM Discord collector and HTTP POST co-occur
    crit: suspicious
    conf: 0.94
    attack: T1555
    all:
      - id: jvm-discord-token-collection-helper
      - id: micro-behaviors/communications/http/post::jvm-okhttp-post-method
      - id: micro-behaviors/communications/http/form::jvm-okhttp-multipart-builder-class-ref
