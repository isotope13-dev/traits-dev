defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  attack: T1528,T1555.003
traits:
  - id: computed-dual-discord-token-extraction
    desc: Computed regex methods extract Discord tokens
    crit: suspicious
    conf: 0.98
    if:
      type: tree-sitter
      language: javascript
      query: |
        ((lexical_declaration
          (variable_declarator name: (identifier) @regular value: (regex) @pattern)
          (variable_declarator name: (identifier) @mfa value: (regex) @mfapattern)
          (variable_declarator name: (array_pattern (identifier))
            value: (binary_expression
              left: (binary_expression
                left: (call_expression
                  function: (subscript_expression object: (identifier) @regularuse)
                  arguments: (arguments . (identifier) @input .))
                right: (call_expression
                  function: (subscript_expression object: (identifier) @mfause)
                  arguments: (arguments . (identifier) @input2 .)))
              right: (array (null)))))
          (#eq? @regular @regularuse) (#eq? @mfa @mfause) (#eq? @input @input2)
          (#match? @pattern "\\{24\\}.*\\{6\\}.*\\{27\\}")
          (#match? @mfapattern "mfa.*\\{84\\}"))
composite_rules:
  - id: obfuscated-node-discord-token-extractor
    desc: Obfuscated Node payload extracts Discord credentials
    crit: hostile
    conf: 0.97
    all:
      - id: computed-dual-discord-token-extraction
      - id: metadata/import/builtin::require-fs-wrapper-arguments
      - id: objectives/anti-static/obfuscation/obfuscator/js-obfuscator::javascript-obfuscator-string-array-runtime
