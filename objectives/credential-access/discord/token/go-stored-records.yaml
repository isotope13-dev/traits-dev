defaults:
  for:
  - pe
  platforms:
  - windows
composite_rules:
- id: go-stored-discord-token-decryption
  desc: Stored Discord token search and GCM decryption
  crit: hostile
  conf: 0.98
  attack: T1528
  all:
  - id: micro-behaviors/data/format/credentials::discord-encrypted-token-prefix-bytes
  - id: micro-behaviors/os/application/target::discord-client-name-reference
  - id: micro-behaviors/data/string/search::go-encrypted-token-search-call
  - id: micro-behaviors/crypto/decrypt::go-aesgcm-decrypt-helper-call
