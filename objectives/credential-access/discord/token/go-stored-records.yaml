defaults:
  for:
  - pe
  platforms:
  - windows
composite_rules:
- id: go-stored-discord-token-decryption
  desc: Stored Discord token search and GCM decryption
  crit: hostile
  conf: 0.98
  attack: T1528
  all:
  - id: micro-behaviors/data/format/discord-token::discord-encrypted-token-prefix-bytes
  - id: micro-behaviors/os/application/target/network::discord-client-name-reference
  - id: micro-behaviors/data/string/search::go-encrypted-token-search-call
  - id: micro-behaviors/crypto/decrypt/transform/symmetric::go-aesgcm-decrypt-helper-call
- id: go-discord-token-harvester
  desc: Go implant harvests and decrypts stored Discord tokens
  crit: hostile
  conf: 0.98
  attack: T1555.003,T1528
  all:
  - id: micro-behaviors/os/application/target/network::discord-client-name-reference
  - id: objectives/credential-access/discord/token::go-token-harvest-symbol
  any:
  - id: micro-behaviors/fs/path/application/browser/profile::local-state
  - id: micro-behaviors/data/db/leveldb::leveldb-ref
  - id: micro-behaviors/fs/path/app-data/browser::chromium-leveldb-local-storage
  - id: micro-behaviors/fs/path/app-data/application::discord-local-storage-path
