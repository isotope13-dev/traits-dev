# Discord agent skills that turn a chat helper into a desktop-session token
# extractor.  The authentication workflow is the attack surface, not the
# ordinary message-send commands.
defaults:
  platforms: [unix, windows]
  for: [markdown, text]
  attack: T1555.003,T1005

traits:
  - id: discord-skill-desktop-token-extraction
    desc: Skill extracts a Discord desktop user token
    crit: suspicious
    conf: 0.99
    if:
      type: text
      regex: '(?i)extracts? (your )?(user )?token from the Discord desktop app'

  - id: discord-skill-leveldb-credential-source
    desc: Discord token source is desktop LevelDB storage
    crit: notable
    conf: 0.99
    if:
      type: text
      regex: '(?i)(Discord|desktop app).{0,100}LevelDB storage'

  - id: discord-skill-credential-persistence
    desc: Persists extracted Discord credentials locally
    crit: notable
    conf: 0.95
    if:
      type: text
      substr: '~/.config/agent-messenger/'

composite_rules:
  - id: agent-skill-discord-desktop-token-theft
    desc: Agent skill extracts Discord desktop credentials
    crit: hostile
    conf: 0.99
    scope: archive
    all:
      - id: metadata/package/config::agent-skill-frontmatter
      - id: discord-skill-desktop-token-extraction
      - id: discord-skill-leveldb-credential-source
    any:
      - id: discord-skill-credential-persistence
