defaults:
  platforms: [windows, unix]
  for: [class, java_class]

composite_rules:
  - id: java-stolen-discord-token-billing-access
    desc: Recovered Discord token queries account billing sources
    crit: hostile
    conf: 0.96
    mbc: B0030
    attack: T1528
    scope: file
    all:
      - id: java-discord-dpapi-stealer
      - id: micro-behaviors/communications/http/services/discord::api-payment-sources
