defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
composite_rules:
  - id: concealed-vm-discord-store-collector
    desc: Concealed VM pairs Discord stores and uploads
    crit: hostile
    conf: 0.98
    attack: T1555.003,T1027
    all:
      - id: objectives/anti-static/obfuscation/loader-profile::base64-vm-analysis-checks
      - id: micro-behaviors/fs/path/secret-store::base64-discord-storage-path-references
      - id: metadata/lang/source/naming/interface::base64-file-form-upload-constant-names
      - id: micro-behaviors/communications/http/services/discord::base64-discord-webhook-url-reference
