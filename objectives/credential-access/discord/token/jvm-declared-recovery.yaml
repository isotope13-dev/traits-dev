defaults:
  platforms: [windows, unix]
  for: [class]
  attack: T1555
  conf: 0.96
traits:
  - id: jvm-discord-recovery-decryption-identifiers
    desc: JVM names Discord token recovery and decryption
    crit: suspicious
    if:
      type: yara
      source: |
        rule jvm_discord_recovery_decryption_identifiers {
          strings:
            $recover = "getDiscordToken" ascii
            $check = "CheckDiscordToken" ascii
            $decrypt = "DecryptData" ascii
            $read = "ReadFile" ascii
          condition:
            uint32be(0) == 0xcafebabe and all of them
        }
  - id: jvm-declared-discord-token-recovery
    desc: Declares a Discord token recovery method
    crit: suspicious
    if:
      type: function
      regex: '^getDiscordTokens?$'
composite_rules:
  - id: jvm-credential-theft-discord-recovery-bundle
    desc: Credential-theft bundle declares Discord token recovery
    crit: hostile
    conf: 0.98
    for: [jar, zip]
    scope: archive
    all:
      - id: objectives/credential-access/browser/multi-target::jvm-declared-cookie-password-theft
      - id: jvm-discord-recovery-decryption-identifiers
      - id: jvm-declared-discord-token-recovery
