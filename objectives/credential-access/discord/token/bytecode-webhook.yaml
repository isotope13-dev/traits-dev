defaults:
  for: [pyc]
  platforms: [windows, unix]
composite_rules:
  - id: pyc-discord-billing-credential-webhook-collector
    desc: Discord billing and LevelDB in credential webhook collector
    crit: hostile
    conf: 0.98
    attack: T1528,T1555,T1567.002
    all:
      - id: micro-behaviors/communications/http/services/discord::discord-billing-payment-sources-path
      - id: micro-behaviors/fs/path/app-data::chromium-leveldb-local-storage
      - id: objectives/credential-access/browser/chromium::pyc-password-query-decrypt-webhook-client
