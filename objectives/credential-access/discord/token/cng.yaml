# The encrypted-record prefix is Discord's storage format, not a family token.
# Require the store and a complete native GCM API set; a Discord HTTP client
# or an unrelated CNG decryptor is insufficient. These are co-occurring static
# facts, not a claim that a particular buffer has been traced through the APIs.
defaults:
  platforms: [windows]
  for: [pe, dll, c, cpp, csharp, go, rust, python]
  attack: T1528

composite_rules:
  - id: discord-stored-token-cng-decryption
    desc: Discord token store with CNG GCM decryption
    crit: hostile
    conf: 0.97
    all:
      - id: micro-behaviors/data/format/credentials::discord-encrypted-token-prefix
      - id: micro-behaviors/fs/path/app-data::discord-local-storage-path
    any:
      - id: micro-behaviors/crypto/decrypt::cng-gcm-decrypt-source
      - id: micro-behaviors/crypto/library/cryptoapi::bcrypt-gcm-decrypt-api-set

  - id: native-stored-token-account-query
    desc: Discord token store and account API request
    crit: suspicious
    conf: 0.95
    for: [c, cpp, pe, dll]
    near_bytes: 8192
    all:
      - id: micro-behaviors/data/format/credentials::discord-encrypted-token-prefix
      - id: micro-behaviors/fs/path/app-data::discord-local-storage-path
      - id: micro-behaviors/communications/http/services/discord::discord-api-users-me-url
      - id: micro-behaviors/communications/http/client/winhttp::winhttp-send-request
      - id: micro-behaviors/communications/http/client/winhttp::winhttp-query-headers
