defaults:
  platforms: [windows, unix]
  for: [scripts, binaries]
  crit: notable
  conf: 0.8
  attack: T1552.001

composite_rules:
- id: crypto-json-filename-filter
  for: [javascript]
  desc: Filters JSON files by wallet keywords
  crit: suspicious
  conf: 0.88
  unless:
  - id: well-known/app/development/codeplane/
  - id: well-known/tool/detection/security-scanner/
  - id: well-known/lib/ai/coding-assistant::cline-extension-api-host
  all:
  - id: micro-behaviors/fs/search::javascript-json-filename-filter
  any:
  - id: objectives/credential-access/wallet/keywords::crypto-wallet-keyword-cluster
  - id: objectives/credential-access/wallet/keywords::hardware-wallet-keyword-cluster
- id: python-import-time-monero-wallet-archive
  desc: Python import archives a Monero wallet
  crit: hostile
  conf: 0.99
  attack: T1005,T1074.001,T1195.002
  for: [python]
  all:
  - id: micro-behaviors/fs/path/wallet::python-monero-wallet-directory
  - id: micro-behaviors/data/archive/create/zip::python-shutil-make-archive
  - id: micro-behaviors/data/control-flow/module-exec::module-level-side-effect-call
