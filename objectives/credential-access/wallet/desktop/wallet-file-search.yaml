defaults:
  platforms: [windows, unix]
  for: [scripts, binaries]
  crit: notable
  conf: 0.8
  attack: T1552.001

traits:
- id: shell-find-wallet-glob
  desc: Shell find targets wallet names
  crit: notable
  conf: 0.92
  platforms: [unix]
  for: [shell, python, javascript, typescript, ruby, go, applescript]
  if:
    type: text
    regex: '\bfind\b[^\n]{0,180}-iname\s+["'']\*wallet\*["'']'
- id: shell-find-keystore-glob
  desc: Shell find targets keystores
  crit: notable
  conf: 0.9
  platforms: [unix]
  for: [shell, python, javascript, typescript, ruby, go, applescript]
  if:
    type: text
    regex: '-iname\s+["'']\*keystore\*["'']'
- id: shell-find-id-json-name
  desc: Shell find targets id.json
  crit: notable
  conf: 0.86
  platforms: [unix]
  for: [shell, python, javascript, typescript, ruby, go, applescript]
  if:
    type: text
    regex: '-iname\s+["'']id\.json["'']'
- id: macho-shell-find-iname-filter
  desc: Mach-O shell find name filter
  crit: component
  conf: 0.9
  platforms: [macos]
  for: [macho]
  if:
    type: text
    substr: -iname
- id: macho-shell-find-maxdepth
  desc: Mach-O shell find depth limiter
  crit: component
  conf: 0.88
  platforms: [macos]
  for: [macho]
  if:
    type: text
    substr: -maxdepth
- id: applescript-find-command
  desc: AppleScript shell find command
  crit: component
  conf: 0.9
  platforms: [unix]
  for: [applescript]
  if:
    type: text
    word: find
- id: applescript-find-wallet-glob
  desc: AppleScript shell find targets wallets
  crit: component
  conf: 0.9
  platforms: [unix]
  for: [applescript]
  if:
    type: text
    substr: '*wallet*'
- id: applescript-find-keystore-glob
  desc: AppleScript shell find targets keystores
  crit: component
  conf: 0.88
  platforms: [unix]
  for: [applescript]
  if:
    type: text
    substr: '*keystore*'
- id: powershell-wallet-glob
  desc: PowerShell targets wallet names
  crit: component
  conf: 0.9
  for: [powershell]
  if:
    type: literal
    substr: '*wallet*'
- id: powershell-keystore-glob
  desc: PowerShell targets keystores
  crit: component
  conf: 0.88
  for: [powershell]
  if:
    type: literal
    substr: '*keystore*'
- id: python-monero-wallet-directory
  desc: Python targets a per-user Monero wallet
  crit: suspicious
  conf: 0.96
  for: [python]
  if:
    type: text
    regex: '(?i)(/home/[^/\s]{1,64}/Monero\b|[\\/]Documents[\\/]Monero\b)'

composite_rules:
- id: crypto-wallet-file-stealer
  for: [javascript]
  desc: Crypto wallet file stealer
  crit: hostile
  conf: 0.96
  unless:
  - id: well-known/lib/format/json-ts
  - id: well-known/tool/detection/security-scanner/
  - id: well-known/tool/detection/threat-intel/
  - id: well-known/lib/ai/coding-assistant::cline-extension-api-host
  all:
  - id: crypto-json-filename-filter
- id: crypto-json-filename-filter
  for: [javascript]
  desc: Filters JSON files by wallet keywords
  crit: suspicious
  conf: 0.88
  unless:
  - id: well-known/app/development/codeplane/
  - id: well-known/tool/detection/security-scanner/
  - id: well-known/lib/ai/coding-assistant::cline-extension-api-host
  all:
  - id: micro-behaviors/fs/enumerate/extension::javascript-json-filename-filter
  any:
  - id: objectives/credential-access/wallet/keywords::crypto-wallet-keyword-cluster
  - id: objectives/credential-access/wallet/keywords::hardware-wallet-keyword-cluster
- id: applescript-find-wallet-target
  desc: AppleScript find targets wallet names
  crit: component
  platforms: [unix]
  for: [applescript]
  near_bytes: 512
  all:
  - id: applescript-find-command
  - id: applescript-find-wallet-glob
- id: applescript-find-keystore-target
  desc: AppleScript find targets keystores
  crit: component
  platforms: [unix]
  for: [applescript]
  near_bytes: 512
  all:
  - id: applescript-find-command
  - id: applescript-find-keystore-glob
- id: applescript-find-id-json-target
  desc: AppleScript find targets id.json
  crit: component
  platforms: [unix]
  for: [applescript]
  near_bytes: 512
  all:
  - id: applescript-find-command
  - id: micro-behaviors/fs/path/config/app::id-json-filename-text
- id: shell-find-wallet-target
  desc: Shell find targets wallet names
  crit: component
  platforms: [unix]
  for: [shell, python, javascript, typescript, ruby, go, applescript]
  any:
  - id: shell-find-wallet-glob
  - id: applescript-find-wallet-target
- id: shell-find-keystore-target
  desc: Shell find targets keystores
  crit: component
  platforms: [unix]
  for: [shell, python, javascript, typescript, ruby, go, applescript]
  any:
  - id: shell-find-keystore-glob
  - id: applescript-find-keystore-target
- id: shell-find-id-json-target
  desc: Shell find targets id.json
  crit: component
  platforms: [unix]
  for: [shell, python, javascript, typescript, ruby, go, applescript]
  any:
  - id: shell-find-id-json-name
  - id: applescript-find-id-json-target
- id: crypto-wallet-shell-find
  desc: Shell searches for wallet files
  crit: suspicious
  conf: 0.94
  platforms: [unix]
  for: [shell, python, javascript, typescript, ruby, go, applescript]
  near_bytes: 512
  all:
  - id: shell-find-wallet-target
  any:
  - id: shell-find-keystore-target
  - id: shell-find-id-json-target
  unless:
  - id: well-known/tool/detection/security-scanner/
  - id: well-known/tool/detection/threat-intel/
- id: crypto-wallet-powershell-search
  desc: PowerShell searches for wallet files
  crit: suspicious
  conf: 0.94
  for: [powershell]
  near_bytes: 512
  all:
  - id: micro-behaviors/fs/directory/traverse::powershell-recursive-child-item
  - id: powershell-wallet-glob
  any:
  - id: powershell-keystore-glob
  - id: micro-behaviors/fs/path/config/app::id-json-filename-literal
  unless:
  - id: well-known/tool/detection/security-scanner/
  - id: well-known/tool/detection/threat-intel/
- id: crypto-wallet-macho-shell-find
  desc: Mach-O shell command searches for wallet files
  crit: suspicious
  conf: 0.94
  platforms: [macos]
  for: [macho]
  near_bytes: 512
  all:
  - id: macho-shell-find-maxdepth
  - id: macho-shell-find-iname-filter
  - id: micro-behaviors/fs/path/config/app::id-json-filename-text
  - id: micro-behaviors/os/console/io::stderr-to-dev-null
  unless:
  - id: well-known/tool/detection/security-scanner/
  - id: well-known/tool/detection/threat-intel/
- id: python-import-time-monero-wallet-archive
  desc: Python import archives a Monero wallet
  crit: hostile
  conf: 0.99
  attack: T1005,T1074.001,T1195.002
  for: [python]
  all:
  - id: python-monero-wallet-directory
  - id: micro-behaviors/data/archive/create/zip::python-shutil-make-archive
  - id: micro-behaviors/data/control-flow/module-exec::module-level-side-effect-call
