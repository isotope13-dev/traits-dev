defaults:
  for: [scripts, binaries, csharp]
  attack: T1555
  mbc: B0028
  crit: suspicious
  platforms:
  - macos
  - windows
  - linux
traits:
- id: go-wallet-stealing-routine
  desc: Go main-package wallet stealing routine
  conf: 0.94
  crit: suspicious
  for: [pe, elf, macho]
  if:
    type: text
    regex: '\bmain\.[Ss]tealWallets?\b'
- id: exodus-passphrase
  desc: exodus passphrase
  conf: 0.7
  crit: notable
  if:
    type: text
    regex: exodus.{0,30}passphrase
- id: node-require-seco-file
  desc: Requires Exodus seco-file package
  conf: 0.9
  for: [javascript, typescript]
  if:
    type: text
    regex: 'require\s*\(\s*[''"]seco-file[''"]\s*\)'
composite_rules:
- id: exodus
  for: [pe]
  desc: Exodus wallet targeting
  crit: suspicious
  conf: 0.94
  all:
  - id: micro-behaviors/fs/file/open::exodus-wallet-path
  - id: go-wallet-stealing-routine
- id: stealer
  desc: Desktop cryptocurrency wallet stealer
  crit: suspicious
  conf: 0.95
  needs: 3
  any:
  - id: micro-behaviors/fs/path/wallet::electrum
  - id: micro-behaviors/os/application/target::coinomi
  - id: exodus
  - id: micro-behaviors/os/application/target::atomic
  - id: micro-behaviors/fs/path/wallet::wasabi
  - id: micro-behaviors/os/application/target::binance
  - id: micro-behaviors/os/application/target::tonkeeper
  - id: micro-behaviors/os/application/target::ledger
  - id: micro-behaviors/fs/path/wallet::trezor
  - id: micro-behaviors/os/application/target::guarda
  - id: micro-behaviors/fs/path/wallet::bitcoin-core
  - id: micro-behaviors/fs/path/wallet::ethereum
  - id: micro-behaviors/fs/path/wallet::monero
  - id: micro-behaviors/fs/path/wallet::litecoin-core
  - id: micro-behaviors/fs/path/wallet::dash-core
  - id: micro-behaviors/fs/path/wallet::dogecoin-core
  - id: micro-behaviors/fs/path/wallet::electron-cash
  unless:
  - id: well-known/tool/detection/
  # A scanner ships the wallet paths it hunts for as data, so its corpus reads
  # as a target list. The sibling browser-wallet-stealer composite already
  # excludes this directory for the reason; convicted Atomdrift's own stng.
- id: applescript-mass-wallet-theft
  desc: Mass desktop crypto-wallet directory theft
  crit: hostile
  conf: 0.96
  attack: T1555.005
  for: [applescript, shell]
  platforms: [macos]
  all:
  - id: micro-behaviors/fs/path/wallet::wallet-target-bundle
  - id: objectives/collection/archive/stage::applescript-staging-layout
  unless:
  - id: micro-behaviors/communications/http/upload::macos-curl-tmp-upload-signal
- id: applescript-wallet-notes-theft
  desc: Mass wallet theft also grabs Apple Notes
  crit: hostile
  conf: 0.96
  attack: T1555.005,T1005
  for: [applescript, shell]
  platforms: [macos]
  all:
  - id: applescript-mass-wallet-theft
  - id: objectives/collection/app-data/notes/app::notes-theft
- id: applescript-wallet-safari-cookie-theft
  desc: Mass wallet theft also grabs Safari cookies
  crit: hostile
  conf: 0.96
  attack: T1555.005,T1539
  for: [applescript, shell]
  platforms: [macos]
  all:
  - id: applescript-mass-wallet-theft
  - id: micro-behaviors/fs/path/cookie::cookies-binarycookies
# Exodus stores the seed password with DPAPI and the seed in a SECO container.
# Requiring both the container reader and the DPAPI unwrap in one script is the
# decrypt step of a wallet stealer. Either import alone is a library.
- id: node-seco-dpapi-wallet-decrypt
  desc: Decrypts SECO wallet via DPAPI
  crit: hostile
  conf: 0.96
  for: [javascript, typescript]
  near_bytes: 4096
  all:
  - id: node-require-seco-file
  - id: micro-behaviors/os/security/dpapi::node-require-win-dpapi
  unless:
  - id: well-known/tool/detection/
