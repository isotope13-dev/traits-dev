# Counterfeit desktop-wallet Electron agents that kill the real app in
# /Applications, keep a stealth window ready, and exfiltrate BIP39 recovery
# phrases over Telegram. Inspired by Operation ASTERIX (fake Trezor Suite).
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript, shell, scripts, archives]
  attack: T1185,T1567,T1555

traits:
  - id: wallet-secret-phrase-header
    desc: Wallet SECRET PHRASE exfil label
    crit: suspicious
    conf: 0.97
    if:
      type: text
      regex: '(?i)(TREZOR|LEDGER|EXODUS|WALLET)\s+SECRET\s+PHRASE|SECRET\s+PHRASE\s*:'

  - id: electron-send-telegram-ipc
    desc: Electron IPC channel for Telegram send
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: '["'']send-telegram["'']|sendToTelegram'

  - id: wallet-app-path--trezor-ledger
    desc: macOS /Applications Trezor or Ledger path
    crit: component
    conf: 0.88
    if:
      type: text
      regex: '(?i)/Applications/(Trezor|Ledger)'

  - id: wallet-app-path--exodus-atomic
    desc: macOS /Applications Exodus or Atomic path
    crit: component
    conf: 0.88
    if:
      type: text
      regex: '(?i)/Applications/(Exodus|Atomic)'

  - id: wallet-app-path--metamask
    desc: macOS /Applications MetaMask path
    crit: component
    conf: 0.88
    if:
      type: text
      regex: '(?i)/Applications/MetaMask'

  - id: taskkill-wallet-image
    desc: taskkill force on wallet image name
    crit: suspicious
    conf: 0.94
    if:
      type: text
      regex: '(?i)taskkill.{0,80}/F.{0,80}(Trezor|Ledger|Exodus)'

  - id: fake-wallet-launchagent-label
    desc: LaunchAgent label spoofs wallet product
    crit: suspicious
    conf: 0.96
    for: [javascript, typescript, shell, plist, archives]
    if:
      type: text
      regex: '(?i)com\.(trezormovement|ledger\.live|exodusmovement)\.agent|io\.trezor\.agent'

composite_rules:
  - id: wallet-applications-path-marker
    desc: References macOS /Applications wallet app path
    crit: component
    conf: 0.88
    any:
      - id: wallet-app-path--trezor-ledger
      - id: wallet-app-path--exodus-atomic
      - id: wallet-app-path--metamask

  # The force-kill leg reuses the canonical process/terminate atoms. A local
  # `\bkill\s*-9\b` copy used to live here; because `browser-wallet-stealer`
  # folds this whole directory in as "wallet targeting" evidence, that generic
  # matcher turned any `kill -9` mention into wallet-stealer proof (it fired on
  # a `ps auxww` transcript in the CPAN.pm changelog).
  - id: applications-kill-nine-pair
    desc: Force kill near an Applications wallet path
    crit: component
    conf: 0.94
    near_bytes: 240
    all:
      - id: wallet-applications-path-marker
    any:
      - id: micro-behaviors/process/terminate/command::kill-force
      - id: micro-behaviors/process/terminate/command::js-kill-with-signal-flag

  - id: applications-wallet-process-kill
    desc: Force-kills wallet under /Applications
    crit: suspicious
    conf: 0.95
    attack: T1489,T1185
    any:
      - id: taskkill-wallet-image
      - id: applications-kill-nine-pair

  - id: electron-wallet-seed-telegram-exfil
    desc: Electron wallet sends seed via Telegram
    crit: hostile
    conf: 0.99
    attack: T1555,T1567,T1102
    all:
      - id: wallet-secret-phrase-header
      - id: micro-behaviors/communications/http/services/telegram::telegram-api-host
      - id: micro-behaviors/communications/messaging/send::telegram-bot-send-message
    any:
      - id: electron-send-telegram-ipc
      - id: objectives/command-and-control/channel/messaging::hardcoded-telegram-bot-token-literal
      - id: objectives/exfiltration/messaging/telegram::bot-token-pattern
    needs: 1

  - id: electron-wallet-process-replacement
    desc: Stealth Electron replaces killed wallet app
    crit: hostile
    conf: 0.98
    attack: T1185,T1564.003,T1489
    all:
      - id: micro-behaviors/ui/window/manage/electron::electron-stealth-browserwindow
      - id: applications-wallet-process-kill
    any:
      - id: objectives/lateral-movement/trojanize/app::wallet-app-path
      - id: fake-wallet-launchagent-label
    needs: 1

  - id: electron-fake-wallet-persistence
    desc: Fake wallet LaunchAgent with seed exfil
    crit: hostile
    conf: 0.97
    attack: T1543.001,T1555,T1567
    all:
      - id: fake-wallet-launchagent-label
      - id: wallet-secret-phrase-header
    any:
      - id: objectives/persistence/system/supervised::node-launchd-runatload-plist
      - id: micro-behaviors/os/service/config::launchagents-path
    needs: 1
