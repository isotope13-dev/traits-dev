defaults:
  platforms: [windows]
  for: [pe, dll]
composite_rules:
  # Local wallet acquisition remains credential access when network delivery
  # is disabled. These co-occurring references do not prove password recovery,
  # traversal of wallet directories, or a successful source-to-send chain.
  - id: managed-keylogger-wallet-file-records
    desc: Keylogger with wallet-file read and record references
    crit: hostile
    conf: 0.97
    attack: T1005
    all:
      - id: objectives/collection/keylog/hook::dotnet-hook-keylog-recording
      - id: micro-behaviors/fs/path/wallet::wallet-dat-filename
      - id: micro-behaviors/fs/read/file/full::dotnet-readallbytes-token
      - id: micro-behaviors/data/format/string::wallet-data-record-prefix
      - id: micro-behaviors/data/encode/base64::dotnet-to-base64string-text
