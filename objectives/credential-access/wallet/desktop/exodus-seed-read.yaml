defaults:
  platforms: [unix, windows]
  for: [scripts, binaries, typescript, go, rust]
  attack: T1555

composite_rules:
  - id: exodus-seed-file-read
    desc: File read and encoding near Exodus seed selection
    crit: suspicious
    conf: 0.95
    near_bytes: 1200
    all:
      - id: micro-behaviors/fs/path/wallet::exodus-seed-container-reference
      - id: micro-behaviors/fs/read/file/full::readfilesync-call
      - id: micro-behaviors/data/encode/base64::tostring-base64
