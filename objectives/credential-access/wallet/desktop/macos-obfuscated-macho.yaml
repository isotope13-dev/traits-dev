# macOS Wallet Stealer Behavior
# Detects cryptocurrency wallet stealers using specific execution patterns
# ATT&CK: T1555 (Credentials from Password Stores)
defaults:
  platforms: [macos]
  for: [macho]
  mbc: "B0028"
composite_rules:
  - id: macos-wallet-recovery-and-keychain-exfiltration
    desc: macOS wallet recovery lure targets stored wallet secrets
    crit: hostile
    conf: 0.98
    attack: T1555,T1041
    all:
      - id: objectives/credential-access/wallet/desktop::go-wallet-keychain-upload-methods
      - id: objectives/credential-access/wallet/desktop::wallet-recovery-phrase-input

  - id: macos-obfuscated-wallet-stealer
    desc: "Obfuscated macOS wallet stealer behavior"
    crit: hostile
    conf: 0.95
    # High-confidence: Minimal strings (obfuscated) + system() + wallet references
    all:
      - id: "metadata/file/profile/string-population::large-macho-strings-at-most-50"
      - id: micro-behaviors/process/create/shell/spawn::system-fn
    any:
      - id: micro-behaviors/os/application/target::multiple-desktop-wallet-references
      - id: micro-behaviors/browser-extension/lifecycle::multiple-wallet-extension-ids
      - id: micro-behaviors/fs/file/open::wallet-dat-path
      - id: micro-behaviors/crypto/mnemonic::mnemonic-terms
      - id: micro-behaviors/data/format/crypto-address::multi-crypto-regex
