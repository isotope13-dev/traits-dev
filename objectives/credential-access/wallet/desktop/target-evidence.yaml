# Store paths alone remain incomplete evidence of acquisition. Preserve the
# reviewed evidence union without depending on a developer-tool category.
defaults:
  attack: T1555
  mbc: B0028
  platforms:
  - linux
  - unix
  - macos
  - windows
  - android
  - ios
  for:
  - binaries
  - scripts
  - source
  - manifests
  - documents
  - media
  - data
composite_rules:
- id: desktop-wallet-target-evidence
  desc: Desktop wallet store and collection evidence
