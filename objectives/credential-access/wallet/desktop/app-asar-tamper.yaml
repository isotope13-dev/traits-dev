# Desktop-wallet app.asar unpacked, edited and repacked in place so that the
# wallet keeps working while a hook leaks the passphrase (Acevatex Exodus patcher).
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
  crit: hostile
  conf: 0.93
  attack: T1554,T1555.005

traits:
  - id: inserted-passphrase-event-hook
    desc: Global call inserted before passphrase event
    crit: suspicious
    conf: 0.9
    for: [c, cpp, pe, javascript, typescript]
    if:
      type: text
      regex: 'globalThis\.[\w$]{1,80}\s*\([^)]{1,80}\)\s*[;,]\s*this\.emit\(.{0,4}passphrase:set'

composite_rules:
  - id: wallet-app-asar-passphrase-hook-repack
    desc: Wallet app.asar repacked with passphrase hook
    near_bytes: 2500
    all:
      - id: micro-behaviors/fs/path/wallet::wallet-app-directory-literal
      - id: micro-behaviors/fs/path/application/bundle::electron-asar-path
      - id: micro-behaviors/data/archive/extract/asar::asar-extract
      - id: micro-behaviors/data/archive/create/asar::asar-pack
      - id: micro-behaviors/ui/controls/wallet::wallet-passphrase-set-event-literal
      - id: inserted-passphrase-event-hook

  - id: wallet-app-asar-patch-webhook-hook
    desc: Wallet app.asar patch posts to Discord webhook
    for: [javascript, typescript, pe]
    near_bytes: 4000
    all:
      - id: micro-behaviors/fs/path/wallet::wallet-app-directory-literal
      - id: micro-behaviors/fs/path/application/bundle::app-asar-path-mention
      - id: micro-behaviors/communications/http/webhook::discord-webhook-path-any
      - id: inserted-passphrase-event-hook
    any:
      - id: micro-behaviors/data/archive/extract/asar::asar-extract
      - id: micro-behaviors/data/archive/create/asar::asar-pack
      - id: micro-behaviors/ui/controls/wallet::wallet-passphrase-set-event-literal

  - id: asar-passphrase-hook-discord-patcher
    desc: Electron app.asar patched with passphrase hook
    for: [c, cpp, pe, javascript, typescript]
    near_bytes: 10000
    all:
      - id: micro-behaviors/fs/path/application/bundle::app-asar-path-mention
      - id: micro-behaviors/ui/controls/wallet::wallet-passphrase-set-event-literal
      - id: micro-behaviors/communications/http/webhook::discord-webhook-path-any
      - id: inserted-passphrase-event-hook
    any:
      - id: micro-behaviors/data/archive/create/asar::asar-pickle-format-strings
      - id: micro-behaviors/data/archive/create/asar::asar-pack
      - id: micro-behaviors/fs/path/wallet::wallet-app-directory-literal
