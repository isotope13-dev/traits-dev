defaults:
  platforms: [freebsd, unix]
  for: [ruby]
  attack: T1555

traits:
  - id: ruby-wallet-harvest-function
    desc: Ruby wallet-harvest function name
    crit: suspicious
    conf: 0.94
    if:
      type: symbol
      kind: function
      exact: harvest_wallets

composite_rules:
  - id: ruby-desktop-wallet-harvest
    desc: Ruby harvests desktop wallet files
    crit: hostile
    conf: 0.98
    all:
      - id: ruby-wallet-harvest-function
    any:
      - id: micro-behaviors/fs/path/sensitive/crypto::ruby-desktop-wallet-directory-a
      - id: micro-behaviors/fs/path/sensitive/crypto::ruby-desktop-wallet-directory-b
