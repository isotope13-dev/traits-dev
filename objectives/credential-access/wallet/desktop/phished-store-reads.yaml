defaults:
  platforms: [macos]
  for: [macho]
composite_rules:
  # A same-file acquisition profile, not a claim that every named wallet
  # exists or that a specific path is bound to the read operation.
  - id: password-phishing-desktop-wallet-read-profile
    desc: Password phishing with wallet stores and reads
    crit: hostile
    conf: 0.96
    attack: T1555,T1056.002
    all:
      - id: objectives/credential-access/phishing/lure::applescript-credential-phish-hostile
      - id: micro-behaviors/fs/path/wallet::multi-desktop-wallet-targets
      - id: micro-behaviors/fs/read/file/handle::applescript-read-result-assignment
