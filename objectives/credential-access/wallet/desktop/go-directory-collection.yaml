defaults:
  for:
  - pe
  platforms:
  - windows
composite_rules:
- id: go-wallet-directory-credential-sweep
  desc: Wallet copying with browser credential harvesting
  crit: hostile
  conf: 0.97
  all:
  - id: objectives/credential-access/browser/chromium::go-raw-browser-credentials-with-master-key
  - id: go-wallet-directory-copy-call
traits:
- id: go-wallet-directory-copy-call
  desc: Calls wallet-directory copying routine
  if:
    type: symbol
    kind: call
    substr: .copyWalletDir
  crit: suspicious
  conf: 0.94
