defaults:
  platforms: [windows, unix]
  for: [scripts, binaries]
  attack: T1056.002,T1555

composite_rules:
  - id: wallet-secret-key-input
    desc: Wallet-context secret-key prompt
    downgrade:
      scope: archive
      any:
        - id: micro-behaviors/crypto/mnemonic::browser-extension-bip39-wallet
    crit: suspicious
    conf: 0.94
    all:
      - id: micro-behaviors/ui/dialog/prompt::secret-key-input-prompt
      - id: metadata/lang/natural/vocabulary/content-word::wallet-word
    near_bytes: 1024
    unless:
      - id: well-known/app/finance/electron-cash/
      - id: well-known/app/finance/electrum-abc/
      - id: well-known/app/storage/frostwire/
      - id: metadata/package/testing/presence/path::conformance-test-path
