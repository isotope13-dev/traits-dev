defaults:
  platforms: [windows, unix]
  for: [scripts, binaries]
  attack: T1056.002,T1555

traits:
  - id: wallet-spoofer-daemon-ui-mode
    desc: Wallet payload daemon/UI modes
    crit: suspicious
    conf: 0.97
    if:
      type: text
      regex: '(?i)--daemon\b[\s\S]{0,160}--ui\b|--ui\b[\s\S]{0,160}--daemon\b'

  - id: wallet-recovery-secret-prompt
    desc: Wallet UI requests a recovery secret
    crit: suspicious
    conf: 0.94
    if:
      type: text
      regex: '(?i)\b(restore wallet|recovery phrase|seed phrase|secret key)\b'

  - id: multiple-desktop-wallet-brands
    desc: Multiple desktop wallet brands are embedded
    crit: notable
    conf: 0.92
    count_min: 2
    if:
      type: text
      regex: '(?i)\b(Ledger|Trezor|Exodus|Guarda|Zelcore)\b'

composite_rules:
  - id: desktop-wallet-spoofer
    desc: Desktop wallet recovery spoofer
    crit: hostile
    conf: 0.99
    all:
      - id: wallet-spoofer-daemon-ui-mode
      - id: wallet-recovery-secret-prompt
      - id: multiple-desktop-wallet-brands
