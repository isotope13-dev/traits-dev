defaults:
  platforms: [windows, unix]
  for: [scripts, binaries]
  attack: T1056.002,T1555

traits:
  - id: wallet-spoofer-daemon-ui-mode
    desc: Wallet payload daemon/UI modes
    crit: suspicious
    conf: 0.97
    if:
      type: text
      regex: '(?i)--daemon\b[\s\S]{0,160}--ui\b|--ui\b[\s\S]{0,160}--daemon\b'
    unless:
      - id: well-known/app/system/veila::veila-lockscreen-context

composite_rules:
  - id: wallet-recovery-phrase-input
    desc: Wallet-context recovery phrase prompt
    crit: suspicious
    conf: 0.94
    all:
      - id: micro-behaviors/ui/dialog/prompt::recovery-phrase-input-prompt
      - id: objectives/credential-access/wallet/keywords::wallet-token
    near_bytes: 1024
    unless:
      - id: well-known/app/finance/electron-cash/

  - id: wallet-secret-key-input
    desc: Wallet-context secret-key prompt
    crit: suspicious
    conf: 0.94
    all:
      - id: micro-behaviors/ui/dialog/prompt::secret-key-input-prompt
      - id: objectives/credential-access/wallet/keywords::wallet-token
    near_bytes: 1024

  - id: desktop-wallet-spoofer
    desc: Desktop wallet recovery spoofer
    crit: hostile
    conf: 0.99
    all:
      - id: wallet-spoofer-daemon-ui-mode
      - id: wallet-recovery-secret-prompt

  - id: wallet-recovery-secret-prompt
    desc: Wallet UI prompts for a recovery phrase or secret key
    crit: suspicious
    conf: 0.94
    any:
      - id: wallet-recovery-phrase-input
      - id: wallet-secret-key-input
