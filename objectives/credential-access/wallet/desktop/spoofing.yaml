defaults:
  platforms: [windows, unix]
  for: [scripts, binaries]
  attack: T1056.002,T1555

traits:
  - id: wallet-spoofer-daemon-ui-mode
    desc: Wallet payload daemon/UI modes
    crit: suspicious
    conf: 0.97
    if:
      type: text
      regex: '(?i)--daemon\b[\s\S]{0,160}--ui\b|--ui\b[\s\S]{0,160}--daemon\b'

  - id: wallet-recovery-phrase-input
    desc: Wallet UI prompts for recovery phrase
    crit: suspicious
    conf: 0.94
    if:
      type: text
      regex: '(?i)\b(enter|input|prompt)\b.{0,64}\b(seed|recovery)\s+phrase\b'

  - id: wallet-secret-key-input
    desc: Wallet UI prompts for secret key
    crit: suspicious
    conf: 0.94
    if:
      type: text
      regex: '(?i)\b(enter|input|prompt)\b.{0,64}\bsecret\s+key\b'

composite_rules:
  - id: desktop-wallet-spoofer
    desc: Desktop wallet recovery spoofer
    crit: hostile
    conf: 0.99
    all:
      - id: wallet-spoofer-daemon-ui-mode
      - id: wallet-recovery-secret-prompt

  - id: wallet-recovery-secret-prompt
    desc: Wallet UI prompts for a recovery phrase or secret key
    crit: suspicious
    conf: 0.94
    any:
      - id: wallet-recovery-phrase-input
      - id: wallet-secret-key-input
