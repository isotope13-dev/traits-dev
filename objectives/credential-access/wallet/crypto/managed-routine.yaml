# Managed cold-wallet collectors combine wallet-parser routines with file
# reads and network code to stage wallet material for transfer.
defaults:
  platforms: [windows]
  for: [pe, dll]
  attack: T1555

traits:
  - id: managed-cold-wallet-parser
    desc: Managed method named for parsing cold wallets
    crit: suspicious
    conf: 0.9
    if:
      type: text
      regex: '(?i)\bParseColdWallets\b'

composite_rules:
  - id: managed-cold-wallet-file-stealer
    desc: Managed cold-wallet collection with file and network APIs
    crit: hostile
    conf: 0.95
    all:
      - id: metadata/binary/framework::dotnet-assembly
      - id: managed-cold-wallet-parser
      - id: micro-behaviors/fs/read/file/full::dotnet-readallbytes-token
      - id: metadata/binary/symbols/name/token::dotnet-getfiles-method-name
      - id: micro-behaviors/communications/http/client/managed::httpwebrequest
      - id: micro-behaviors/communications/http/client/managed::webclient
