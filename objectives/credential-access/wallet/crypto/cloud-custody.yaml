# This combination mirrors cloud-custody key misuse without keying on a victim,
# actor, secret name or malware family. Each command is legitimate in isolation;
# their co-location is the suspicious behavior worth surfacing.
defaults:
  platforms: [unix, windows]
  for: [shell, scripts, source]
  attack: T1552.001

composite_rules:
  - id: cloud-secret-wallet-key-signing
    desc: Cloud secret used with wallet key signing
    crit: suspicious
    conf: 0.95
    near_bytes: 4096
    all:
      - id: objectives/credential-access/cloud/token/cli::aws-secretsmanager-get
      - id: micro-behaviors/crypto/library/blockchain/wallet::foundry-cast-address-from-private-key
      - id: micro-behaviors/crypto/asymmetric/signature::openssl-private-key-sign-command

  - id: instance-credential-backed-wallet-signing
    desc: Harvested wallet key signs transaction
    crit: hostile
    conf: 0.99
    near_bytes: 4096
    all:
      - id: cloud-secret-wallet-key-signing
      - id: objectives/credential-access/cloud/token/metadata::instance-role-secret-store-harvest
