# Keyring serializer legs must share one source file with the eval-literal
# HTTP exfiltration. An archive scope let a benign wallet library's serialize()
# in one member join an unrelated eval POST in another member of the same
# package. Scope to the file so the two legs describe the same code.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
composite_rules:
  - id: secret-keyring-serializers-with-hidden-http-export
    desc: Secret keyring serializers with HTTP POST eval
    crit: hostile
    conf: 0.99
    attack: T1555,T1041
    scope: file
    all:
      - id: objectives/exfiltration/stealer/credential/wallet/record::eval-literal-keyring-http-export
    any:
      - id: micro-behaviors/data/serialize/schema-credential::keyring-serializer-mnemonic-member
      - id: micro-behaviors/data/serialize/schema-credential::keyring-serializer-private-key-map
    needs: 1
