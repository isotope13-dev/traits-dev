defaults:
  platforms: [linux]
  for: [elf]
  attack: T1555,T1056.001,T1554

traits:
  - id: elf-exodus-wallet-index-target
    desc: References Exodus wallet JavaScript target
    crit: notable
    if:
      type: text
      substr: 'src/app/wallet/index.js'
  - id: elf-exodus-wallet-html-target
    desc: References Exodus wallet HTML target
    crit: notable
    if:
      type: text
      substr: 'src/static/wallet.html'
  - id: elf-exodus-wallet-xhr-collector
    desc: Injects browser POST to local collector
    crit: suspicious
    if:
      type: text
      substr: 'new XMLHttpRequest;r.open("POST","http://127.0.0.1:8738"'

composite_rules:
  - id: elf-exodus-wallet-injection-collector
    desc: Injects wallet script that posts to local collector
    crit: hostile
    conf: 0.99
    all:
      - id: elf-exodus-wallet-index-target
      - id: elf-exodus-wallet-html-target
      - id: elf-exodus-wallet-xhr-collector
