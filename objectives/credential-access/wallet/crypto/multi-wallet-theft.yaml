# Node stealers stage discovered desktop-wallet directories into a zip
# layout and report the hit list through a webhook. The staging folder
# name and copy helper are the durable shape, not the random client API.
defaults:
  platforms: [windows, unix]
  for: [javascript]
  attack: T1555.003,T1567.002

traits:
  - id: node-wallets-staging-folder
    desc: Creates a Wallets staging folder
    crit: notable
    conf: 0.93
    if:
      type: text
      regex: 'createFolder\(\s*[''"]\\+Wallets[''"]'
  - id: node-copy-wallet-folder
    desc: Copies folders into Wallets staging
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: 'copyFolder\(\s*[`''"]\\+Wallets'
  - id: found-wallets-report
    desc: Writes a Found Wallets inventory
    crit: notable
    conf: 0.95
    if:
      type: text
      substr: Found Wallets.txt

composite_rules:
  - id: node-wallet-folder-copy-stage
    desc: Copies wallet dirs into a staging folder
    crit: hostile
    conf: 0.96
    all:
      - id: node-wallets-staging-folder
      - id: node-copy-wallet-folder
  - id: node-wallet-copy-inventory
    desc: Copies wallets and writes an inventory
    crit: hostile
    conf: 0.96
    all:
      - id: node-copy-wallet-folder
      - id: found-wallets-report
  - id: node-wallet-stage-inventory
    desc: Stages wallets and writes an inventory
    crit: hostile
    conf: 0.95
    all:
      - id: node-wallets-staging-folder
      - id: found-wallets-report
