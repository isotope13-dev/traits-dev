# Python Infostealer Narratives
# High-confidence rules for identifying stealing behavior
#
# Note: Cross-directory references use directory paths which match ANY trait
# within that directory.
defaults:
  platforms: [windows, unix]
  crit: suspicious
  for: [python]
composite_rules:
- id: system-info-with-wallet
  desc: Host-information API call near a crypto-wallet marker
  crit: suspicious
  conf: 0.9
  all:
  - id: micro-behaviors/os/sysinfo/platform/runtime
  any:
  # Prefer product/path markers over the bare "wallet" keyword (payment APIs,
  # unit-test prose, and agent-toolkit docs all say "wallet").
  - id: objectives/credential-access/wallet/keywords::metamask-word
  - id: micro-behaviors/fs/file/open::wallet-dat-path
  - id: objectives/credential-access/wallet/desktop/
  - id: objectives/credential-access/wallet/extension/
  near_bytes: 512
  unless:
  - id: micro-behaviors/crypto/library/blockchain/
  - id: well-known/app/finance/electron-cash/
  - id: metadata/package/testing/
  - id: well-known/app/infrastructure/aws-agent-toolkit::agent-toolkit-context
  - id: well-known/tool/development/vscode-extension/touchfish::vscode-ffmpeg-replacer-script
