# Python Infostealer Narratives
# High-confidence rules for identifying stealing behavior
#
# Note: Cross-directory references use directory paths which match ANY trait
# within that directory.
defaults:
  platforms: [windows, unix]
  crit: suspicious
  for: [python]
composite_rules:
- id: system-info-with-wallet
  desc: Host-information API call near a crypto-wallet marker
  crit: suspicious
  conf: 0.9
  all:
  - id: micro-behaviors/os/sysinfo/platform/runtime
  any:
  - id: micro-behaviors/os/application/target::wallet-brand-metamask
  - id: micro-behaviors/fs/file/open::wallet-dat-path
  - id: objectives/credential-access/wallet/desktop/
  - id: objectives/credential-access/wallet/extension/
  - id: well-known/app/browser-extension/wallets::multiple-wallet-extension-ids
  - id: micro-behaviors/fs/path/wallet::node-ethereum-keystore-path
  - id: micro-behaviors/fs/path/wallet::node-wallet-vault-path
  - id: micro-behaviors/fs/path/wallet::node-wallet-store-path
  - id: micro-behaviors/fs/path/wallet::electrum-wallets-dir
  - id: micro-behaviors/fs/path/wallet::electrum-wallet-file
  - id: micro-behaviors/fs/path/wallet::electrum-default
  - id: micro-behaviors/fs/path/wallet::coinomi-wallets-dir
