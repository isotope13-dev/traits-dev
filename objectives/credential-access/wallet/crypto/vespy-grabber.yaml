defaults:
  platforms:
  - unix
  - windows
  crit: suspicious
  attack: T1649
  mbc: B0020
  for:
  - python
traits:
- id: procdump-download
  desc: Procdump tool download
  crit: suspicious
  conf: 0.95
  unless:
    - id: well-known/app/system/anthropic-cybersecurity-skills::defensive-cybersecurity-skills-repository
    - id: metadata/file/profile/identity::generated-attack-map-context
  if:
    type: text
    regex: '(?i)(https?://|cdn\.discordapp)[^\s"''<>]{0,160}\bprocdump(\.exe)?\b'
- id: procdump-execution
  desc: Procdump memory dump execution
  crit: suspicious
  conf: 0.98
  unless:
    - id: well-known/app/system/anthropic-cybersecurity-skills::defensive-cybersecurity-skills-repository
    - id: metadata/file/profile/identity::generated-attack-map-context
    - id: well-known/tool/offensive/bingo/
  if:
    type: text
    regex: procvesp111.{0,50}procdump|procdump.{0,50}-ma|procvesp.{0,50}-accepteula
# The old single regex was "a `.dmp` token within 50 characters of the word
# `write`", which is not memory-dump file creation: it matched a debugger's
# own dump-command format strings (radare2 ships
# `0x%08llx-0x%08llx-%s.dmp` right next to `Cannot write '%s'`). The two real
# signals are split apart -- the Exodus dump filename, which is
# wallet-specific on its own, and an actual binary-mode write of a `.dmp`
# path, which requires the write call rather than the English word.
- id: exodus-wallet-dump-file
  desc: Exodus wallet memory-dump filename
  crit: suspicious
  conf: 0.95
  if:
    type: text
    regex: (?i)\bexodus\.dmp\b
- id: dmp-file-write
  desc: Opens or writes a .dmp dump file
  crit: suspicious
  conf: 0.9
  if:
    type: text
    regex: '\.dmp["''][^\n]{0,40}(["'']wb["'']|\.write\()'
- id: exodus-process-enum
  desc: Exodus process enumeration
  crit: suspicious
  conf: 0.95
  if:
    type: text
    regex: Exodus\.exe.{0,50}process_iter|process_iter.{0,50}Exodus
- id: wallet-process-targeting
  desc: Wallet process targeting
  crit: suspicious
  conf: 0.9
  if:
    type: text
    regex: exodus\.wallet|process.{0,50}Exodus|Exodus.{0,50}pid
- id: atomic-wallet-target
  desc: Atomic wallet targeting
  crit: suspicious
  conf: 0.85
  if:
    type: text
    regex: (?i)\bAtomic\s+Wallet\b|\batomicwallet\b|\.atomicwallet\b
- id: electrum-wallet-target--rx-1
  desc: Regex component marker
  crit: component
  conf: 0.85
  if:
    type: text
    substr: Electrum.exe
  count_max: 1010861
- id: electrum-wallet-target--rx-2
  desc: Regex component marker
  crit: component
  conf: 0.85
  if:
    type: text
    substr: electrum_path
  count_max: 1010862
- id: electrum-wallet-target--rx-3
  desc: Regex component marker
  crit: component
  conf: 0.85
  if:
    type: text
    regex: electrum_wallet.{0,80}(process|pid|kill|terminate)
  count_max: 1010863
- id: electrum-wallet-target--rx-4
  desc: Regex component marker
  crit: component
  conf: 0.85
  if:
    type: text
    regex: (process|pid|kill|terminate).{0,80}electrum_wallet
  count_max: 1010864
- id: guarda-wallet-target
  desc: Guarda wallet targeting
  crit: suspicious
  conf: 0.85
  if:
    type: text
    regex: guarda.{0,50}wallet|GUARDA.{0,50}wallet
- id: bitpay-wallet-target
  desc: BitPay wallet targeting
  crit: suspicious
  conf: 0.85
  if:
    type: text
    regex: bitpay.{0,50}wallet|B1Tpay.{0,50}wallet
- id: coinomi-wallet-target
  desc: Coinomi wallet targeting
  crit: suspicious
  conf: 0.85
  if:
    type: text
    regex: coinomi.{0,50}wallet|coinomi.{0,50}path
- id: armory-wallet-target
  desc: Armory wallet targeting
  crit: suspicious
  conf: 0.85
  if:
    type: text
    regex: armory.{0,50}wallet|armory.{0,50}path
- id: vespy-marker-file-1
  desc: Vespy marker file (procvesp111)
  crit: suspicious
  conf: 0.98
  if:
    type: string_literal
    substr: procvesp111
- id: vespy-marker-file-2
  desc: Vespy marker file (vesp111)
  crit: suspicious
  conf: 0.98
  if:
    type: string_literal
    substr: vesp111
- id: vespy-path-marker
  desc: Vespy obfuscated wallet marker
  crit: suspicious
  conf: 0.9
  if:
    type: text
    regex: '(?i)\b(P4THF0LDR|W4ll3ts)\b'
composite_rules:
- id: vespy-marker-file
  desc: Vespy marker file
  crit: suspicious
  conf: 0.98
  any:
  - id: vespy-marker-file-1
  - id: vespy-marker-file-2
- id: vespy-wallet-stealer
  desc: Vespy wallet stealer
  crit: hostile
  conf: 0.99
  needs: 3
  any:
  - id: procdump-download
  - id: vespy-marker-file
  - id: exodus-process-enum
- id: crypto-wallet-stealer-suite
  desc: Multi-wallet cryptocurrency stealer
  crit: hostile
  conf: 0.95
  platforms:
  - windows
  needs: 3
  any:
  - id: atomic-wallet-target
  - id: electrum-wallet-target
  - id: guarda-wallet-target
  - id: bitpay-wallet-target
  - id: coinomi-wallet-target
  - id: armory-wallet-target
- id: dmp-file-creation
  desc: Creates a memory-dump (.dmp) file
  crit: suspicious
  conf: 0.9
  any:
  - id: exodus-wallet-dump-file
  - id: dmp-file-write
- id: memory-dump-wallet-theft
  desc: Memory dump wallet theft
  crit: hostile
  conf: 0.98
  attack: T1055
  all:
  - id: procdump-execution
  - id: dmp-file-creation
  - id: wallet-process-targeting
- id: electrum-wallet-target
  desc: Electrum wallet targeting
  crit: suspicious
  conf: 0.85
  unless:
  - id: well-known/app/finance/electron-cash/
  - id: metadata/package/testing/
  any:
  - id: electrum-wallet-target--rx-1
  - id: electrum-wallet-target--rx-2
  - id: electrum-wallet-target--rx-3
  - id: electrum-wallet-target--rx-4
