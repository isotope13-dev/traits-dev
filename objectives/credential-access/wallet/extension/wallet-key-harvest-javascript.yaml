# Browser-Side JavaScript Cookie Stealer / Skimmer
# Detects browser-injected JS that harvests cookies, UA, URL params and exfiltrates them
# ATT&CK: T1539 (Steal Web Session Cookie), T1185 (Browser Session Hijacking)
# MBC: E1005
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript, html]
  attack: "T1539"

composite_rules:
- id: browser-wallet-extension-key-harvest
  for: [javascript]
  desc: Browser extension harvests wallet files and sends key material
  crit: hostile
  conf: 0.98
  attack: T1555.004,T1041
  mbc: E1011
  all:
    - id: objectives/collection/file-targeting/filter::wallet-files
    - id: objectives/collection/file-targeting/filter::wallet-extension
    - id: micro-behaviors/communications/ipc/message::chrome-runtime-send-message
    - id: micro-behaviors/data/db/web-storage::dom-storage-getitem
