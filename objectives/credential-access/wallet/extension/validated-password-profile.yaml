defaults:
  platforms: [macos]
  for: [macho]

composite_rules:
  # Desktop wallet files and browser-extension stores are separate sources.
  # The existing extension profile supplies multiple wallet IDs, an extension
  # storage location and file-reading code. Require independently established
  # masked-password capture and directory-service validation before inferring
  # abuse. This is a same-file profile, not a binding of each ID to a read,
  # decryption, a successful copy or an exfiltration claim.
  - id: validated-password-wallet-extension-read-profile
    desc: Validated password phishing with wallet-extension read profile
    crit: hostile
    conf: 0.96
    attack: T1555.003,T1056.002
    all:
      - id: objectives/credential-access/phishing/lure::applescript-credential-phish-hostile
      - id: wallet-extension-store-targeting
