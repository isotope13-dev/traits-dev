defaults:
  for: [lua]
  platforms: [windows, unix]

composite_rules:
  - id: lua-wallet-extension-leveldb-read
    desc: Lua LevelDB read near browser wallet extension storage
    crit: suspicious
    attack: T1555.003
    near_bytes: 512
    all:
      - id: micro-behaviors/fs/path/application/extensions::chromium-local-extension-settings-path
      - id: objectives/credential-access/wallet/extension::any-browser-wallet-extension-id
      - id: micro-behaviors/data/db/leveldb::lua-read-leveldb-call
