# Routine names that say "copy the browser wallet extensions".
#
# Browser-extension wallets (MetaMask, Phantom, ...) keep their vaults in the
# extension's Local Extension Settings directory, so a stealer that "grabs
# plugins" is copying those vaults wholesale. A macOS C++ stealer (2026-09,
# bazaar 3b46e51bf7a7) encrypted every path it used but left
# `grab_pluginsRKNSt3__112basic_string...` in its stale export-trie bytes.
#
# The bound on the left keeps it off `autograb_extensions`-style words and
# still accepts the Itanium length prefix (`12grab_plugins`); no bound on the
# right, because the mangled parameter list follows with no separator.
defaults:
  platforms: [linux, macos, windows]
  for: [binaries]
  attack: T1555
  mbc: B0028

traits:
  - id: grab-extensions-routine-name
    desc: Routine named for grabbing browser plugins
    crit: suspicious
    conf: 0.85
    if:
      type: text
      regex: '(?i)(^|[^a-z])grab_?(wallet_?|browser_?)?(plugins|extensions)'
