defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
  attack: T1056.002,T1539

traits:
  - id: extension-wallet-secret-capture-marker
    desc: Extension captures a wallet secret
    crit: suspicious
    conf: 0.97
    if:
      type: text
      regex: '(?i)\bCAPTURED_(WALLET_)?(PASSWORD|SEED|SECRET|PHRASE)\b'

  - id: extension-wallet-secret-fetch
    desc: Extension sends wallet secret with fetch
    crit: suspicious
    conf: 0.97
    if:
      type: text
      regex: '(?is)\bCAPTURED_(WALLET_)?(PASSWORD|SEED|SECRET|PHRASE)\b.{0,240}\bfetch\s*\('

  - id: extension-wallet-secret-xhr
    desc: Extension sends wallet secret with XHR
    crit: suspicious
    conf: 0.97
    if:
      type: text
      regex: '(?is)\bCAPTURED_(WALLET_)?(PASSWORD|SEED|SECRET|PHRASE)\b.{0,240}\bXMLHttpRequest\b'

  # Find/replace hookers repeat the unlock signature on adjacent lines.
  # The wallet's own source names that function once.
  - id: duplicated-wallet-unlock-handler
    desc: Duplicated wallet unlock handler on next line
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: 'submitPasswordOrEncryptionKey\([^\n]{0,50}\n[^\n]{0,40}submitPasswordOrEncryptionKey'

composite_rules:
  - id: extension-wallet-secret-theft
    desc: Extension captures and sends wallet secrets
    crit: hostile
    conf: 0.99
    attack: T1056.002,T1539,T1041
    all:
      - id: extension-wallet-secret-capture-marker
      - id: micro-behaviors/communications/ipc/message::chrome-runtime-on-message
    any:
      - id: extension-wallet-secret-fetch
      - id: extension-wallet-secret-xhr
  # One script names several wallet extensions, builds fetch( as a string,
  # and splices that string into a duplicated unlock handler.
  - id: wallet-unlock-handler-fetch-splice
    desc: Script splices a stringified fetch into a duplicated wallet unlock handler
    crit: hostile
    conf: 0.97
    attack: T1555.003,T1056.002,T1041
    scope: file
    all:
      - id: duplicated-wallet-unlock-handler
      - id: metadata/lang/source/syntax/call/invocation::stringified-fetch-call
      - id: micro-behaviors/communications/http/request/verb::post-method-text
      - id: micro-behaviors/os/application/target/wallet::wallet-extension-id-cluster
    unless:
      - id: metadata/path::test-directory-component
      - id: well-known/tool/detection/
      - id: well-known/app/browser-extension/metamask::official-manifest
