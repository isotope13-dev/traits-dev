defaults:
  platforms:
  - unix
  - windows
  for:
  - javascript
  - typescript
composite_rules:
- id: wallet-targeted-obfuscated-process-dropper
  desc: Obfuscated wallet-targeting process context
  crit: suspicious
  conf: 0.98
  attack: T1027,T1059.007,T1555.003
  mbc: B0028
  all:
  - id: well-known/app/browser-extension/wallets::wallet-extension-id-cluster
  - id: micro-behaviors/process/exit/terminate::process-exit
  - id: objectives/anti-static/obfuscation/obfuscator/js-obfuscator::hex-name-mangling-with-string-table-rotation
  unless:
  - id: well-known/app/browser-extension/metamask::crx-member
  - id: well-known/app/browser-extension/metamask::official-manifest
  - id: well-known/app/browser-extension/metamask::lavamoat-webpack
  - id: well-known/app/browser-extension/lastpass::crx-member

- id: obfuscated-wallet-addon-remote-agent
  desc: Obfuscated agent targets several wallet addons
  crit: hostile
  conf: 0.98
  attack: T1555.003,T1219,T1027
  all:
  - id: well-known/app/browser-extension/wallets::several-wallet-addon-host-literals
  - id: objectives/anti-static/obfuscation/obfuscator/js-obfuscator::javascript-obfuscator-string-array-runtime
  - id: objectives/command-and-control/backdoor/control/relay-agent::remote-file-download-handler
  unless:
  - id: metadata/file/naming::test-directory-component
  - id: well-known/app/browser-extension/metamask::official-manifest
  - id: well-known/app/browser-extension/metamask::lavamoat-webpack

