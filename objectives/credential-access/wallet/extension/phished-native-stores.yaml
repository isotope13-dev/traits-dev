# The reconstructed native collector compares extension-directory names against
# its decoded wallet ID table and copies matching stores into the stolen-data
# staging tree. Combine that table and storage reference with the independently
# established password lure and browser decryption behavior.
defaults:
  platforms: [macos]
  for: [macho]

composite_rules:
  - id: phished-wallet-extension-stores
    desc: Password lure with wallet extension stores
    crit: hostile
    conf: 0.97
    attack: T1555,T1056.002
    all:
      - id: objectives/credential-access/browser/chromium::phished-login-and-card-decryption
      - id: well-known/app/browser-extension/wallets::wallet-extension-id-cluster
      - id: micro-behaviors/fs/path/app-data::chromium-local-extension-settings-path
