defaults:
  platforms:
    - linux
    - macos
    - windows
  for: [python, javascript, typescript, elf, macho, pe]
traits:
  - id: metamask-icon-url
    desc: MetaMask icon remote URL
    crit: suspicious
    conf: 0.9
    for: [binaries, scripts]
    if:
      type: text
      substr: https://i.ibb.co/VSXvxMr/metamask.png
  - id: wallet-name-field
    desc: Wallet name data field
    crit: component
    conf: 0.75
    for: [binaries, scripts]
    if:
      type: text
      exact: WalletName
  - id: wallet-address-field
    desc: Wallet address data field
    crit: component
    conf: 0.75
    for: [binaries, scripts]
    if:
      type: text
      exact: WalletAddress
  - id: phantom
    desc: Standalone Phantom extension ID
    crit: suspicious
    conf: 0.9
    attack: T1555.003
    mbc: B0028
    if:
      type: text
      # Exclude IDs embedded in browser-store paths. Wallet selectors link to
      # official install pages; standalone ID values are the targeting signal.
      regex: '(^|[^/a-z])bfnaelmomeimhlpmgjnjophhpkkoljpa([^a-z]|$)'
  - id: trust-wallet
    desc: Standalone Trust Wallet extension ID
    crit: suspicious
    conf: 0.9
    attack: T1555.003
    mbc: B0028
    if:
      type: text
      regex: '(^|[^/a-z])egjidjbpglichdcondbcbdnbeeppgdph([^a-z]|$)'
  - id: binance-dup
    desc: Binance Wallet extension ID
    crit: suspicious
    conf: 0.9
    attack: T1555.003
    mbc: B0028
    if:
      type: text
      substr: fhbohimaelbohpjbbldcngcnapndodjp
  - id: coinbase
    desc: Coinbase Wallet extension ID
    crit: suspicious
    conf: 0.9
    attack: T1555.003
    mbc: B0028
    if:
      type: text
      substr: hnfanknocfeofbddgcijnmhnfnkdnaad
    unless:
      - id: objectives/credential-access/wallet/extension::coinbase-solana-adapter-context
      - id: well-known/lib/crypto/connectkit::connectkit-wallet-integration-context
  - id: tronlink
