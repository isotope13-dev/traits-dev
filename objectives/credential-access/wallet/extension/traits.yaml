defaults:
  platforms:
    - linux
    - macos
    - windows
  for: [python, javascript, typescript, elf, macho, pe]
traits:
  - id: metamask-icon-url
    desc: MetaMask icon remote URL
    crit: suspicious
    conf: 0.9
    for: [binaries, scripts]
    if:
      type: text
      substr: https://i.ibb.co/VSXvxMr/metamask.png
  - id: wallet-name-field
    desc: Wallet name data field
    crit: notable
    conf: 0.75
    for: [binaries, scripts]
    if:
      type: text
      exact: WalletName
  - id: wallet-address-field
    desc: Wallet address data field
    crit: notable
    conf: 0.75
    for: [binaries, scripts]
    if:
      type: text
      exact: WalletAddress
composite_rules:
  - id: wallet-extension-store-targeting
    desc: Wallet extension storage targeting across Local, Sync, or IndexedDB stores
    crit: suspicious
    conf: 0.94
    for: [scripts, binaries]
    all:
      - id: micro-behaviors/browser-extension/lifecycle::multiple-wallet-extension-ids
      - id: micro-behaviors/fs/read/file/full::file-content-read-operation
    any:
      - id: micro-behaviors/fs/directory/traverse::node-dirent-directory-walk
      - id: micro-behaviors/fs/directory/traverse::filepath-walk
      - id: micro-behaviors/fs/directory/traverse::filepath-walk-pclntab
      - id: micro-behaviors/fs/path/app-data::chromium-local-extension-settings-path
      - id: micro-behaviors/fs/path/app-data::chromium-sync-extension-settings-path
      - id: micro-behaviors/fs/path/app-data::indexeddb-directory-path
    unless:
      - id: well-known/tool/detection/tirith::tirith-cli-binary-marker
  - id: browser-wallet-extension-store-read-profile
    desc: Wallet storage/key paths and file-read APIs
    crit: suspicious
    conf: 0.98
    attack: T1555.003
    for: [scripts, binaries]
    all:
      - id: micro-behaviors/fs/read/file
      - id: micro-behaviors/browser-extension/lifecycle::wallet-extension-id-cluster
      - id: micro-behaviors/fs/path/app-data::chromium-local-extension-settings-path
    any:
      - id: micro-behaviors/crypto/asymmetric/key::derivation-path-bip
      - id: micro-behaviors/crypto/key/representation::crypto-private-key-reference
      - id: micro-behaviors/fs/path/wallet::atomic-local-storage
      - id: micro-behaviors/fs/path/wallet::atomic-wallet-path
    unless:
      - id: well-known/tool/detection/
      - id: well-known/lib/
  - id: obfuscated-multi-wallet-stealer
    desc: Obfuscated code targets wallets and spawns child processes
    crit: hostile
    conf: 0.98
    attack: "T1027,T1555.003"
    mbc: B0028
    for: [javascript, typescript]
    all:
      - id: micro-behaviors/browser-extension/lifecycle::wallet-extension-id-cluster
      - id: objectives/anti-static/obfuscation/obfuscator/js-obfuscator::hex-name-mangling-with-string-table-rotation
      - id: micro-behaviors/process/create/exec::node-spawnsync-call
  - id: metamask-wallet-profile
    desc: MetaMask wallet data profile
    crit: suspicious
    conf: 0.95
    for: [binaries, scripts]
    all:
      - id: metamask-icon-url
      - id: wallet-name-field
      - id: wallet-address-field
