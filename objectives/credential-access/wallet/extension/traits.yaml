defaults:
  platforms:
  - linux
  - macos
  - windows
  for:
  - python
  - javascript
  - typescript
  - elf
  - macho
  - pe
traits:
- id: metamask-icon-url
  desc: MetaMask icon remote URL
  crit: suspicious
  conf: 0.9
  for:
  - binaries
  - scripts
  if:
    type: text
    substr: https://i.ibb.co/VSXvxMr/metamask.png
- id: wallet-name-field
  desc: Wallet name data field
  crit: notable
  conf: 0.75
  for:
  - binaries
  - scripts
  if:
    type: text
    exact: WalletName
- id: wallet-address-field
  desc: Wallet address data field
  crit: notable
  conf: 0.75
  for:
  - binaries
  - scripts
  if:
    type: text
    exact: WalletAddress
composite_rules:
- id: wallet-extension-store-targeting
  desc: Wallet extension storage targeting across Local, Sync, or IndexedDB stores
  crit: suspicious
  conf: 0.94
  for:
  - scripts
  - binaries
  all:
  - id: micro-behaviors/os/application/target/wallet::multiple-wallet-extension-ids
  - id: micro-behaviors/fs/read/file/content/unspecified::file-content-read-operation
  any:
  - id: micro-behaviors/fs/directory/enumerate::node-dirent-directory-walk
  - id: micro-behaviors/fs/directory/traverse::filepath-walk
  - id: metadata/binary/symbols/name/qualified/filesystem::filepath-walk-pclntab
  - id: micro-behaviors/fs/path/application/extensions::chromium-local-extension-settings-path
  - id: micro-behaviors/fs/path/application/extensions::chromium-sync-extension-settings-path
  - id: micro-behaviors/fs/path/app-data/browser::indexeddb-directory-path
  unless:
  - id: well-known/tool/detection/tirith::tirith-cli-binary-marker
- id: browser-wallet-extension-store-read-profile
  desc: Wallet storage/key paths and file-read APIs
  crit: suspicious
  conf: 0.98
  attack: T1555.003
  for:
  - scripts
  - binaries
  all:
  - id: micro-behaviors/fs/read/file
  - id: micro-behaviors/os/application/target/wallet::wallet-extension-id-cluster
  - id: micro-behaviors/fs/path/application/extensions::chromium-local-extension-settings-path
  any:
  - id: micro-behaviors/crypto/key/representation/encoded::derivation-path-bip
  - id: micro-behaviors/crypto/key/representation/reference::crypto-private-key-reference
  - id: micro-behaviors/fs/path/wallet::atomic-local-storage
  - id: micro-behaviors/fs/path/wallet::atomic-wallet-path
- id: obfuscated-multi-wallet-stealer
  desc: Obfuscated code targets wallets and spawns child processes
  crit: hostile
  conf: 0.98
  attack: T1027,T1555.003
  mbc: B0028
  for:
  - javascript
  - typescript
  all:
  - id: micro-behaviors/os/application/target/wallet::wallet-extension-id-cluster
  - id: objectives/anti-static/obfuscation/obfuscator/js-obfuscator::hex-name-mangling-with-string-table-rotation
  - id: micro-behaviors/process/create/exec::node-spawnsync-call
- id: metamask-wallet-profile
  desc: MetaMask wallet data profile
  crit: suspicious
  conf: 0.95
  for:
  - binaries
  - scripts
  all:
  - id: metamask-icon-url
  - id: wallet-name-field
  - id: wallet-address-field
- id: any-browser-wallet-extension-id
  desc: References a browser cryptocurrency wallet extension ID
  crit: component
  conf: 0.92
  for:
  - scripts
  - source
  - binaries
  any:
  - id: micro-behaviors/os/application/target/wallet::metamask-chrome-extension-id
  - id: micro-behaviors/os/application/target/wallet::phantom-chrome-extension-id
  - id: micro-behaviors/os/application/target/wallet::trust-wallet-chrome-extension-id
  - id: micro-behaviors/os/application/target/wallet::binance-chrome-extension-id
  - id: micro-behaviors/os/application/target/wallet::coinbase-wallet-chrome-extension-id
  - id: micro-behaviors/os/application/target/wallet::tronlink-chrome-extension-id
  - id: micro-behaviors/os/application/target/wallet::rabby-chrome-extension-id
  - id: micro-behaviors/os/application/target/wallet::solflare-chrome-extension-id
  - id: micro-behaviors/os/application/target/wallet::keplr-chrome-extension-id
  - id: micro-behaviors/os/application/target/wallet::exodus-chrome-extension-id
  - id: micro-behaviors/os/application/target/wallet::multiple-wallet-extension-ids
  unless:
  - id: well-known/tool/detection/llm-scanner::llm-scanner-context
  - id: well-known/lib/crypto/coinbase-wallet::coinbase-solana-adapter-context
  - id: well-known/app/browser/microsoft-edge::microsoft-edge-package-context
  - id: well-known/lib/crypto/connectkit::connectkit-wallet-integration-context
- id: wallet-extension-vault-http-exfil
  desc: Reads browser wallet extension storage and POSTs over HTTP
  crit: hostile
  conf: 0.98
  attack: T1555.003,T1041
  size_max: 25000000
  for:
  - scripts
  - source
  - pe
  - dll
  - elf
  - macho
  all:
  - id: any-browser-wallet-extension-id
  - id: micro-behaviors/fs/path/application/extensions::chromium-local-extension-settings-path
  - id: micro-behaviors/fs/read/file
  - id: wallet-vault-credential-store-access
  - id: micro-behaviors/communications/http/post/
  unless:
  - id: well-known/tool/detection/tirith::tirith-cli-binary-marker
  - id: well-known/lib/ui/cef::cef-browser-engine
  - id: well-known/app/system/microsoft/platform::microsoft-signed-edge-runtime-context
- id: wallet-vault-credential-store-access
  desc: Browser DPAPI or password store access accompanying wallet vault read
  crit: component
  conf: 0.9
  for:
  - scripts
  - source
  - binaries
  any:
  - id: micro-behaviors/os/security/dpapi::crypt-unprotect-data-api
  - id: micro-behaviors/fs/path/password-store::login-data
  - id: micro-behaviors/data/config/schema::encrypted-key-field-reference

