defaults:
  platforms:
    - linux
    - macos
    - windows
  for: [python, javascript, typescript, elf, macho, pe]
traits:
  - id: metamask-icon-url
    desc: MetaMask icon remote URL
    crit: suspicious
    conf: 0.9
    for: [binaries, scripts]
    if:
      type: text
      substr: https://i.ibb.co/VSXvxMr/metamask.png
  - id: wallet-name-field
    desc: Wallet name data field
    crit: notable
    conf: 0.75
    for: [binaries, scripts]
    if:
      type: text
      exact: WalletName
  - id: wallet-address-field
    desc: Wallet address data field
    crit: notable
    conf: 0.75
    for: [binaries, scripts]
    if:
      type: text
      exact: WalletAddress
  - id: sync-extension-settings-path
    desc: Chromium Sync Extension Settings path
    crit: suspicious
    conf: 0.85
    for:
      - applescript
      - shell
      - python
      - javascript
      - typescript
    if:
      type: text
      substr: /Sync Extension Settings/
  - id: indexeddb-extension-path
    desc: Chromium extension IndexedDB path fragment
    crit: notable
    conf: 0.8
    for:
      - applescript
      - shell
      - python
      - javascript
      - typescript
    if:
      type: text
      substr: /IndexedDB/
  - id: wallet-extension-path
    desc: Wallet extension settings path
    crit: suspicious
    conf: 1.0
    for: [scripts, binaries]
    if:
      type: text
      substr: /Local Extension Settings/
    unless:
      - id: well-known/tool/detection/malcontent::malcontent-defensive-scanner-context
composite_rules:
  - id: coinbase-solana-adapter-context
    desc: Coinbase Solana wallet adapter integration
    crit: exception
    conf: 0.98
    for: [javascript, typescript]
    all:
      - id: well-known/app/browser-extension/coinbase-wallet::extension-reference
      - id: micro-behaviors/crypto/library/blockchain/transaction::solana-library-reference
      - id: micro-behaviors/crypto/library/blockchain/transaction::web3-library-import
      - id: micro-behaviors/crypto/asymmetric/signature::wallet-transaction-sign-call
  - id: wallet-extension-store-targeting
    desc: Wallet extension storage targeting across Local, Sync, or IndexedDB stores
    crit: suspicious
    conf: 0.94
    for: [python, javascript]
    all:
      - id: well-known/app/browser-extension/wallets::multiple-wallet-extension-ids
    any:
      - id: wallet-extension-path
      - id: sync-extension-settings-path
      - id: indexeddb-extension-path
  - id: obfuscated-multi-wallet-stealer
    desc: Obfuscated code targets wallets and spawns child processes
    crit: hostile
    conf: 0.98
    attack: "T1027,T1555.003"
    mbc: B0028
    for: [javascript, typescript]
    all:
      - id: well-known/app/browser-extension/wallets::wallet-extension-id-cluster
      - id: objectives/anti-static/obfuscation/obfuscator/js-obfuscator::hex-name-mangling-with-string-table-rotation
      - id: micro-behaviors/process/create/shell/bridge::js-spawnsync
  - id: metamask-wallet-profile
    desc: MetaMask wallet data profile
    crit: suspicious
    conf: 0.95
    for: [binaries, scripts]
    all:
      - id: metamask-icon-url
      - id: wallet-name-field
      - id: wallet-address-field
