  - id: electrum-dup
    desc: Electrum wallet path/reference
    crit: suspicious
    conf: 0.8
    attack: T1555.005
    if:
      type: text
      regex: (?i)\.electrum/wallets
    unless:
      - id: well-known/tool/detection/cleave::cleave-static-analysis-context
      - id: well-known/tool/detection/litmus::litmus-classifier-context
  - id: sync-extension-settings-path
    desc: Chromium Sync Extension Settings path
    crit: suspicious
    conf: 0.85
    for:
      - applescript
      - shell
      - python
      - javascript
      - typescript
    if:
      type: text
      substr: /Sync Extension Settings/
  - id: indexeddb-extension-path
    desc: Chromium extension IndexedDB path fragment
    crit: component
    conf: 0.8
    for:
      - applescript
      - shell
      - python
      - javascript
      - typescript
    if:
      type: text
      substr: /IndexedDB/
  - id: wallet-extension-path
    desc: Wallet extension settings path
    crit: suspicious
    conf: 1.0
    for: [scripts, binaries]
    if:
      type: text
      substr: /Local Extension Settings/
    unless:
      - id: well-known/tool/detection/malcontent::malcontent-defensive-scanner-context
composite_rules:
  - id: coinbase-solana-adapter-context
    desc: Coinbase Solana wallet adapter integration
    crit: exception
    conf: 0.98
    for: [javascript, typescript]
    all:
      - id: well-known/app/browser-extension/coinbase-wallet::extension-reference
      - id: micro-behaviors/crypto/library/blockchain/transaction::solana-library-reference
      - id: micro-behaviors/crypto/library/blockchain/transaction::web3-library-import
      - id: micro-behaviors/crypto/library/blockchain/transaction::wallet-transaction-sign-call
  - id: browser-wallet-extensions
    desc: Multiple browser wallet extension IDs
    any:
      - id: well-known/app/browser-extension/metamask::chrome-extension-id
      - id: phantom
      - id: trust-wallet
      - id: objectives/credential-access/wallet/extension::binance-dup
      - id: coinbase
      - id: tronlink
      - id: nami
      - id: temple
      - id: petra
      - id: martian
      - id: pontem
      - id: objectives/credential-access/wallet/extension::exodus-dup
      - id: keplr
      - id: rabby
      - id: brave
      - id: well-known/app/browser-extension/metamask::edge-extension-id
      - id: coin98
      - id: mathwallet
      - id: safepal
      - id: solflare
      - id: wombat
    needs: 2
    crit: suspicious
    unless:
      - id: well-known/tool/detection/llm-scanner/
      - id: objectives/credential-access/wallet/extension::coinbase-solana-adapter-context
      - id: well-known/app/browser/microsoft-edge::microsoft-edge-package-context
      - id: well-known/lib/crypto/connectkit::connectkit-wallet-integration-context
  - id: desktop-wallets
    desc: Desktop wallet path references
    any:
      - id: objectives/credential-access/wallet/extension::coinomi-dup
      - id: objectives/credential-access/wallet/extension::atomic-dup
      - id: objectives/credential-access/wallet/extension::electrum-dup
    crit: suspicious
  - id: multi-wallet-targeting
    desc: Multiple crypto wallet extensions targeted
    crit: suspicious
    conf: 0.95
    attack: T1555.003
    mbc: B0028
    for:
      - python
      - javascript
      - elf
      - pe
      - macho
    needs: 3
    any:
      - id: well-known/app/browser-extension/metamask::chrome-extension-id
      - id: phantom
      - id: trust-wallet
      - id: objectives/credential-access/wallet/extension::binance-dup
      - id: coinbase
      - id: tronlink
      - id: objectives/credential-access/wallet/extension::exodus-dup
      - id: keplr
      - id: petra
      - id: martian
      - id: pontem
      - id: nami
      - id: temple
      - id: rabby
      - id: brave
      - id: well-known/app/browser-extension/metamask::edge-extension-id
      - id: coin98
      - id: mathwallet
      - id: safepal
      - id: solflare
      - id: wombat
  - id: wallet-extension-store-targeting
    desc: Wallet extension storage targeting across Local, Sync, or IndexedDB stores
    crit: suspicious
    conf: 0.94
    for:
      - applescript
      - shell
      - python
      - javascript
      - typescript
    all:
      - id: objectives/credential-access/wallet/extension::browser-wallet-extensions
    any:
      - id: wallet-extension-path
      - id: sync-extension-settings-path
      - id: indexeddb-extension-path
  - id: obfuscated-multi-wallet-stealer
    desc: Obfuscated code targets wallets and spawns child processes
    crit: hostile
    conf: 0.98
    attack: "T1027,T1555.003"
    mbc: B0028
    for: [javascript, typescript]
    all:
      - id: multi-wallet-targeting
      - id: objectives/anti-static/obfuscation/obfuscator/js-obfuscator::hex-name-mangling-with-string-table-rotation
      - id: micro-behaviors/process/create/shell/bridge::js-spawnsync
  - id: metamask-wallet-profile
    desc: MetaMask wallet data profile
    crit: suspicious
    conf: 0.95
    for: [binaries, scripts]
    all:
      - id: metamask-icon-url
      - id: wallet-name-field
      - id: wallet-address-field
