# Chromium "Local Extension Settings" holds the LevelDB vaults of wallet and
# password-manager extensions. A native module that walks that directory,
# writes it into a ZIP archive and has a Telegram bot document upload is
# harvesting extension secrets for offline cracking.
defaults:
  platforms: [linux, macos, windows]
  for: [elf, macho, pe, so, dylib, dll]
  attack: T1555.003,T1005,T1567

composite_rules:
  - id: native-extension-storage-walk-zip-bot-upload
    desc: Native code archives extension storage for bot upload
    crit: hostile
    conf: 0.96
    all:
      - id: micro-behaviors/fs/path/application/extensions::compiled-chromium-local-extension-settings-path
      - id: micro-behaviors/fs/directory/traverse::rust-walkdir-compiled-reference
      - id: micro-behaviors/data/archive/zip::rust-zipwriter-compiled-reference
      - id: micro-behaviors/communications/http/services/telegram::teloxide-compiled-document-upload
