defaults:
  platforms: [windows, linux, macos]
  for: [python, javascript, csharp, go, pe, elf]
  attack: T1555
  mbc: B0028
  crit: suspicious
traits:
- id: phantom-word
  desc: Phantom wallet reference
  crit: component
  conf: 0.5
  for:
  - python
  - javascript
  - csharp
  - go
  size_max: 10485760
  count_min: 2
  if:
    id: micro-behaviors/os/application/target::phantom-wallet-word
  unless:
  - type: text
    substr: paperSize
  - id: objectives/anti-analysis/sandbox-detect/tool-references/
  - id: micro-behaviors/os/sysinfo/platform/browser::nightmare-automation-global-reference
  - id: micro-behaviors/os/sysinfo/platform/browser::chrome-automation-global-reference
# Vocabulary leg: the wallet term only. "browser extension" / "browser addon"
# is every browser-agent, ad-blocker and chat app's settings copy (Element's
# "browser extension" hints), not wallet vocabulary.
- id: browser-word
  desc: Browser wallet term
  crit: component
  conf: 0.4
  if:
    type: text
    regex: \bbrowser[_-]?wallets?\b
  unless:
    - id: well-known/tool/detection/malcontent::malcontent-defensive-scanner-context
- id: private-key-theft-verb
  desc: Private key theft verb
  conf: 0.9
  crit: notable
  if:
    type: text
    regex: '(?i)\bprivate_?key\b.{0,80}\b(exfil|steal|harvest)\b'
- id: private-key-collection-verb
  desc: Private key collection or transfer verb
  conf: 0.9
  crit: notable
  if:
    type: text
    regex: '(?i)\bprivate_?key\b[^\r\n]{0,80}\b(collect|exfil|harvest|steal|upload|send)\b'
- id: phantom-word-unless-cond-1--rx-1
  desc: _phantom Go zero-size field marker
  crit: component
  conf: 0.5
  for:
  - python
  - csharp
  - go
  size_max: 10485760
  count_min: 2
  if:
    type: text
    substr: _phantom
- id: phantom-word-unless-cond-1--rx-3
  desc: phantom_soft recognized identifier
  crit: notable
  conf: 0.5
  for:
  - python
  - csharp
  - go
  size_max: 10485760
  count_min: 2
  if:
    type: text
    substr: phantom_soft
- id: native-wallet-seed-endpoint
  desc: Endpoint path for wallet seed phrases
  crit: suspicious
  conf: 0.95
  for: [pe, elf, macho]
  if:
    type: raw
    regex: '(?i)/(seed|mnemonic|recovery)[-_]phrase[s]?\b'
- id: native-wallet-valid-seed-launch-gate
  desc: Valid-seed wallet launch gate
  crit: suspicious
  conf: 0.94
  for: [pe, elf, macho]
  if:
    type: raw
    regex: '(?i)(valid[_ ]seed|checkseed).{0,180}(launch|report_launch|original_wallet)'

# micro-behaviors/crypto/asymmetric/key::crypto-private-key-reference is
# `for: [python, javascript, typescript, csharp, go]` only, so it can never
# match a compiled Pe/Elf. Local binary-compatible duplicate of the same
# text regex.
composite_rules:
- id: private-key-theft-language-source
  desc: Private-key theft or collection language (source)
  conf: 0.92
  crit: suspicious
  for: [python, javascript, csharp, go]
  near_lines: 80
  unless:
  # TLS and PEM implementations legitimately describe retrieving, parsing,
  # and decrypting private keys. node-forge has strong independent namespace
  # markers, so its API prose should not be interpreted as collection intent.
  - id: well-known/lib/crypto/node-forge::node-forge-crypto-library
  all:
  - id: micro-behaviors/crypto/asymmetric/key::crypto-private-key-reference
  any:
  - id: private-key-theft-verb
  - id: private-key-collection-verb
- id: private-key-theft-language-binary
  desc: Private-key theft or collection language (compiled)
  conf: 0.92
  crit: suspicious
  for: [pe, elf]
  near_lines: 80
  all:
  - id: micro-behaviors/crypto/asymmetric/key::crypto-private-key-reference
  any:
  - id: private-key-theft-verb
  - id: private-key-collection-verb
- id: private-key-theft-language
  desc: Private-key theft or collection language
  conf: 0.92
  crit: suspicious
  any:
  - id: private-key-theft-language-source
  - id: private-key-theft-language-binary
- id: derivation-path-with-key-theft
  desc: HD wallet path with private-key theft context
  crit: suspicious
  conf: 0.93
  unless:
  - id: well-known/app/finance/sidesail/
  all:
  - id: private-key-theft-language
  any:
    - id: micro-behaviors/crypto/asymmetric/key::derivation-path-bip
    - id: micro-behaviors/crypto/asymmetric/key::wallet-derivation-path-field
- id: wallet-marker
  desc: Wallet or cryptocurrency marker
  crit: notable
  conf: 0.7
  unless:
  - id: metadata/file/catalog/identity/
  - id: metadata/build/bundler/asset::js-large-module-bundle
  - id: metadata/package/testing/
  needs: 3
  any:
  - id: objectives/impact/cryptojacking/miner/signatures::wallet-ref
  - id: objectives/impact/crypto-manipulation/keywords::crypto-word
  - id: micro-behaviors/os/application/target::wallet-brand-metamask
  - id: phantom-word
  - id: browser-word
- id: comprehensive-stealer
  desc: Comprehensive wallet credential theft
  crit: hostile
  conf: 0.95
  for:
  - python
  - javascript
  - elf
  - pe
  - macho
  needs: 3
  any:
  - id: micro-behaviors/crypto/mnemonic::mnemonic-terms
  - id: private-key-theft-language
  - id: micro-behaviors/fs/path/wallet::keystore-file
  - id: derivation-path-with-key-theft
  - id: micro-behaviors/crypto/mnemonic::bip39-wordlist-reference
- id: native-bip39-seed-harvesting
  desc: Native BIP-39 seed harvesting from clipboard and files
  crit: hostile
  conf: 0.98
  for: [pe]
  attack: "T1005,T1115,T1555"
  all:
  - id: micro-behaviors/crypto/mnemonic::embedded-bip39-wordlist
  - id: micro-behaviors/os/clipboard/read::get-clipboard-data
  - id: micro-behaviors/fs/traversal/drives::get-logical-drives-text
  - id: micro-behaviors/fs/enumerate/directory::find-first-file
  any:
  - id: objectives/collection/file-targeting/filter::mnemonic-extension-wide-glob
  - id: objectives/collection/file-targeting/filter::seed-extension-wide-glob
- id: phantom-word-unless-cond-1--rx-helper-4
  desc: Regex component marker
  crit: component
  conf: 1.0
  for:
  - python
  - csharp
  - go
  size_max: 10485760
  any:
  - id: phantom-word-unless-cond-1--rx-1
  - id: micro-behaviors/os/sysinfo/platform/browser::callphantom-global-reference
  - id: phantom-word-unless-cond-1--rx-3

- id: native-multi-wallet-seed-harvester
  desc: Native multi-wallet seed harvesting workflow
  crit: hostile
  conf: 0.99
  for: [pe, elf, macho]
  all:
  - id: micro-behaviors/ui/controls/wallet::native-wallet-recovery-action
  - id: micro-behaviors/os/application/target::native-multi-wallet-brand-catalog
  - id: native-wallet-seed-endpoint
  - id: micro-behaviors/communications/http/auth::hardcoded-api-key-config
  any:
  - id: micro-behaviors/crypto/mnemonic::native-wallet-recovery-term
  - id: micro-behaviors/crypto/mnemonic::native-wallet-recovery-term-phrase-first
- id: native-valid-seed-wallet-theft
  desc: Native valid-seed wallet theft workflow
  crit: hostile
  conf: 0.99
  for: [pe, elf, macho]
  all:
  - id: native-wallet-valid-seed-launch-gate
  - id: native-wallet-seed-endpoint
  - id: micro-behaviors/communications/http/auth::hardcoded-api-key-config
  any:
  - id: micro-behaviors/crypto/mnemonic::native-wallet-recovery-term
  - id: micro-behaviors/crypto/mnemonic::native-wallet-recovery-term-phrase-first

- id: android-wallet-phrase-bridge-capture
  desc: Wallet phrase grid submits to Android app
  crit: hostile
  conf: 0.99
  platforms: [android]
  attack: T1417.002
  for: [html, javascript]
  all:
  - id: micro-behaviors/ui/controls/wallet::numbered-wallet-word-inputs
  - id: micro-behaviors/process/interpreter/webview::webview-injection-log-submit-bridge

- id: android-wallet-passphrase-bridge-capture
  desc: Mnemonic and passphrase sent to Android app
  crit: hostile
  conf: 0.99
  platforms: [android]
  attack: T1417.002
  for: [html, javascript]
  all:
  - id: micro-behaviors/ui/controls/wallet::wallet-mnemonic-entry-label
  - id: micro-behaviors/ui/controls/credential::credential-input-surface
  - id: micro-behaviors/process/interpreter/webview::webview-injection-log-submit-bridge
