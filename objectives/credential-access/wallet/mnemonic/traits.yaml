defaults:
  platforms: [windows, linux, macos]
  for: [python, javascript, csharp, go, pe, elf]
  attack: T1555
  mbc: B0028
  crit: suspicious
traits:
- id: derivation-path-word
  desc: HD wallet derivation path (keywords)
  crit: component
  conf: 0.8
  for:
  - python
  - javascript
  - csharp
  - go
  if:
    type: text
    regex: derivation_?path|derivationPath
- id: seed-phrase-underscore
  desc: seed_phrase term
  crit: notable
  conf: 0.5
  if:
    type: text
    substr: seed_phrase
  unless:
  - id: well-known/tool/detection/redaction::sensitive-data-scanner
- id: seedphrase-word
  desc: seedphrase term
  crit: notable
  conf: 0.5
  if:
    type: text
    substr: seedphrase
- id: recovery-phrase-word
  desc: recovery_phrase term
  crit: notable
  conf: 0.5
  if:
    type: text
    substr: recovery_phrase
  unless:
    - id: well-known/app/productivity/keepercommander/
- id: secret-words-word
  desc: secret_words term
  crit: notable
  conf: 0.5
  if:
    type: text
    substr: secret_words
- id: phantom-word
  desc: Phantom wallet reference
  crit: component
  conf: 0.5
  for:
  - python
  - javascript
  - csharp
  - go
  size_max: 10485760
  count_min: 2
  if:
    id: metadata/library/web3::phantom-wallet-word
  unless:
  - type: text
    substr: paperSize
  - id: objectives/anti-analysis/sandbox-detect/tool-references/
  - id: objectives/credential-access/wallet/mnemonic/
- id: browser-word
  desc: browser wallet marker
  crit: component
  conf: 0.4
  if:
    type: text
    regex: \bbrowser[_-]?(wallet|extension|addon)\b
- id: bip39-wordlist-start-cluster
  desc: UTF-16 BIP-39 wordlist start cluster
  crit: component
  conf: 0.88
  for: [pe, elf, macho]
  if:
    type: hex
    section: .rdata
    pattern: "61 00 62 00 61 00 6E 00 64 00 6F 00 6E 00 [0-16] 61 00 62 00 69 00 6C 00 69 00 74 00 79 00 [0-16] 61 00 62 00 6C 00 65 00 [0-16] 61 00 62 00 6F 00 75 00 74 00 [0-16] 61 00 62 00 6F 00 76 00 65 00"
- id: bip39-wordlist-mid-cluster
  desc: UTF-16 BIP-39 wordlist middle cluster
  crit: component
  conf: 0.88
  for: [pe, elf, macho]
  if:
    type: hex
    section: .rdata
    pattern: "63 00 61 00 63 00 74 00 75 00 73 00 [0-16] 63 00 61 00 67 00 65 00 [0-16] 63 00 61 00 6B 00 65 00 [0-16] 63 00 61 00 6C 00 6C 00 [0-16] 63 00 61 00 6C 00 6D 00"
- id: bip39-wordlist-crypto-cluster
  desc: UTF-16 BIP-39 wordlist later cluster
  crit: component
  conf: 0.88
  for: [pe, elf, macho]
  if:
    type: hex
    section: .rdata
    pattern: "73 00 61 00 64 00 64 00 6C 00 65 00 [0-16] 73 00 61 00 64 00 6E 00 65 00 73 00 73 00 [0-16] 73 00 61 00 66 00 65 00 [0-16] 73 00 61 00 69 00 6C 00 [0-16] 73 00 61 00 6C 00 61 00 64 00"
- id: bip39-wordlist-end-cluster
  desc: UTF-16 BIP-39 wordlist end cluster
  crit: component
  conf: 0.88
  for: [pe, elf, macho]
  if:
    type: hex
    section: .rdata
    pattern: "79 00 65 00 6C 00 6C 00 6F 00 77 00 [0-16] 79 00 6F 00 75 00 [0-16] 79 00 6F 00 75 00 6E 00 67 00 [0-16] 79 00 6F 00 75 00 74 00 68 00 [0-16] 7A 00 65 00 62 00 72 00 61 00"
- id: bip39-b64-bips-fragment
  desc: Base64 BIP-39 bips fragment
  crit: component
  conf: 0.9
  for: [powershell]
  if:
    type: text
    substr: Ymlwcy9tY
- id: bip39-b64-index-fragment
  desc: Base64 BIP-39 index fragment
  crit: component
  conf: 0.9
  for: [powershell]
  if:
    type: text
    substr: TAwMzkv
- id: bip39-b64-english-fragment
  desc: Base64 BIP-39 english.txt fragment
  crit: component
  conf: 0.9
  for: [powershell]
  if:
    type: text
    substr: ZW5nbGlzaC50eHQ
- id: wordlist-near-mnemonic
  desc: Wordlist near mnemonic terms
  crit: component
  conf: 0.85
  if:
    type: text
    regex: word_?list.{0,40}(mnemonic|bip-?39)
- id: wordlist-near-recovery
  desc: Wordlist near recovery phrase
  crit: component
  conf: 0.85
  if:
    type: text
    regex: word_?list.{0,40}recovery[_ -]?phrase
- id: mnemonic-near-wordlist
  desc: Mnemonic terms near wordlist
  crit: component
  conf: 0.85
  if:
    type: text
    regex: (mnemonic|bip-?39).{0,40}word_?list
  unless:
  - id: metadata/lang/scripted::dts-declaration-file
  - id: metadata/package/testing/presence/fixture::test-filename-pattern
  - id: well-known/app/finance/prysm::prysm-source-tree
- id: recovery-near-wordlist
  desc: Recovery phrase near wordlist
  crit: component
  conf: 0.85
  if:
    type: text
    regex: recovery[_ -]?phrase.{0,40}word_?list
- id: private-key-theft-verb
  desc: Private key theft verb
  conf: 0.9
  crit: component
  if:
    type: text
    regex: '(?i)\bprivate_?key\b.{0,80}\b(exfil|steal|harvest)\b'
- id: private-key-collection-verb
  desc: Private key collection or transfer verb
  conf: 0.9
  crit: component
  if:
    type: text
    regex: '(?i)\bprivate_?key\b[^\r\n]{0,80}\b(collect|exfil|harvest|steal|upload|send)\b'
- id: bitcoin-wif-format
  desc: Bitcoin WIF private key format (word)
  conf: 0.85
  crit: notable
  if:
    type: text
    word: wallet_import_format
- id: bitcoin-wif-pattern
  desc: Bitcoin WIF private key format reference
  conf: 0.85
  crit: notable
  if:
    type: text
    regex: \b(wif|bitcoin)\b.{0,20}\b(wif|key|private)\b
  unless:
  - id: metadata/lang/scripted::dts-declaration-file
  - id: metadata/package/testing/presence/fixture::test-filename-pattern
  - id: metadata/library/runtime::lean-intl-runtime-bundle
  - id: metadata/library/runtime::intl-polyfill-locale-data
- id: bitcoin-wif-uncompressed-literal
  desc: Uncompressed Bitcoin WIF private key literal
  conf: 0.85
  crit: suspicious
  if:
    type: text
    # WIF version bytes encode uncompressed keys as 5H/5J/5K (51 chars).
    # The short context window avoids generated identifiers such as
    # *PrivateAccessArgs that merely begin with a WIF-like character.
    regex: '(?i)(wif|private).{0,12}["'']5[HJK][1-9A-HJ-NP-Za-km-z]{49}["'']'
  unless:
  - id: metadata/package/testing/presence/harness::go-test-file
  - id: metadata/package/testing/presence/harness/
  - id: well-known/app/finance/sidesail/
  - type: path
    regex: '(^|[\\/])testchain([\\/]|$)'
  - type: path
    regex: '(^|[\\/])(internal[\\/](keytestcases|testcli|testchain)|pkg[\\/]neotest)([\\/]|$)'
- id: bitcoin-wif-compressed-literal
  desc: Compressed Bitcoin WIF private key literal
  conf: 0.85
  crit: suspicious
  if:
    type: text
    # Compressed WIF keys start with K/L and contain 52 Base58 characters.
    regex: '(?i)(wif|private).{0,12}["''][KL][1-9A-HJ-NP-Za-km-z]{51}["'']'
  unless:
  - id: metadata/package/testing/presence/harness::go-test-file
  - id: metadata/package/testing/presence/harness/
  - id: well-known/app/finance/sidesail/
  - type: path
    regex: '(^|[\\/])testchain([\\/]|$)'
  - type: path
    regex: '(^|[\\/])(internal[\\/](keytestcases|testcli|testchain)|pkg[\\/]neotest)([\\/]|$)'
- id: keystore-file
  desc: Ethereum UTC keystore filename
  crit: suspicious
  conf: 0.85
  if:
    type: text
    # The UTC--timestamp--address form is the distinctive Ethereum
    # keystore filename; generic `keystore.json` prose is too common.
    regex: '(?i)UTC--[0-9T:+-]+--[a-f0-9]{40}\b'
  unless:
  - id: well-known/tool/detection/
  - id: well-known/app/finance/sidesail/
  - id: well-known/app/finance/go-ethereum::go-ethereum-tool
  - id: metadata/package/testing/presence/harness/
  - id: well-known/app/ai/knowledge/animica::package-context
  - id: well-known/app/ai/knowledge/animica::package-source-path
- id: variable-names-1
  desc: "Mnemonic-related var names (mnemonic, seed)"
  crit: notable
  conf: 0.8
  size_max: 262144
  if:
    type: text
    regex: \b(mnemonic|seed_?phrase)\s*=
  unless:
  - id: metadata/library/structure::js-large-module-bundle
  - id: metadata/package/testing/presence/fixture::test-filename-pattern
  - id: well-known/app/finance/prysm::prysm-source-tree
  - id: micro-behaviors/crypto/library/blockchain/
  # Bazel/Starlark ctx.actions.run mnemonic= is an action short-name, not a
  # BIP-39 seed phrase (GoCompilePkg, RunNogo, ValidateNogo, …).
  - type: text
    regex: 'mnemonic\s*=\s*"[A-Z][A-Za-z0-9]+"'
  # ISA disassemblers assign opcode names (mnemonic = {0x00: "sll"} /
  # mnemonic = "jal"), not wallet seed phrases.
  - type: text
    regex: 'mnemonic\s*=\s*(\{|[A-Z][A-Z0-9_]*\[|"[a-z]{1,8}")'
- id: variable-names-2
  desc: 'Mnemonic-related variable names'
  crit: notable
  conf: 0.8
  if:
    type: text
    regex: \b(recovery_?phrase|secret_?words|wallet_?words)\s*[=:]
  unless:
    - id: well-known/app/productivity/keepercommander/
- id: phantom-word-unless-cond-1--rx-1
  desc: _phantom Go zero-size field marker
  crit: component
  conf: 0.5
  for:
  - python
  - csharp
  - go
  size_max: 10485760
  count_min: 2
  if:
    type: text
    substr: _phantom
  count_max: 1009804
- id: phantom-word-unless-cond-1--rx-2
  desc: callPhantom JS bot-detection global
  crit: component
  conf: 0.5
  for:
  - python
  - csharp
  - go
  size_max: 10485760
  count_min: 2
  if:
    type: text
    substr: callPhantom
  count_max: 1009805
- id: phantom-word-unless-cond-1--rx-3
  desc: phantom_soft recognized identifier
  crit: component
  conf: 0.5
  for:
  - python
  - csharp
  - go
  size_max: 10485760
  count_min: 2
  if:
    type: text
    substr: phantom_soft
  count_max: 1009806
- id: native-wallet-recovery-term
  desc: Wallet label followed by recovery phrase
  crit: notable
  conf: 0.94
  for: [pe, elf, macho]
  if:
    type: string_literal
    regex: '(?i)\bwallet\b.{0,60}\b(seed phrase|mnemonic phrase|recovery phrase)\b'
- id: native-wallet-recovery-term-phrase-first
  desc: Recovery phrase followed by wallet label
  crit: notable
  conf: 0.94
  for: [pe, elf, macho]
  if:
    type: string_literal
    regex: '(?i)\b(seed phrase|mnemonic phrase|recovery phrase)\b.{0,60}\bwallet\b'
- id: native-wallet-recovery-action
  desc: Native wallet recovery action language
  crit: component
  conf: 0.9
  for: [pe, elf, macho]
  if:
    # The verb must name what it acts on. The bare alternation
    # `(restore|enter|import|recover)` matched the word "enter" in
    # libselinux.so.1 and would match "import"/"restore" in most native
    # binaries ever built, so every one of them carried a wallet-mnemonic
    # component. Wallet UIs say "Restore wallet" / "Import seed"; the phrase
    # side is already covered by native-wallet-recovery-term above, which the
    # harvester composite requires alongside this.
    type: text
    regex: '(?i)\b(restore|recover|import)[ \t]{1,3}(wallet|seed)'
- id: native-hardware-wallet-brand-family
  desc: Hardware wallet brand family reference
  crit: component
  conf: 0.9
  for: [pe, elf, macho]
  if:
    type: text
    regex: '(?i)\b(Ledger|Trezor|BitBox|KeepKey)\b'
  # Icon/SVG catalogs: trezor","width":24 — brand key, not wallet targeting.
  not:
    - regex: "(?i)\\b(Ledger|Trezor|BitBox|KeepKey)\\b[\"']\\s*,\\s*[\"']width[\"']"
  unless:
    - id: well-known/tool/detection/security-scanner-identity::apple-xprotectd-scanner-context
    - id: well-known/tool/detection/cleave::cleave-static-analysis-context
- id: native-software-wallet-brand-family
  desc: Software wallet brand family reference
  crit: component
  conf: 0.9
  for: [pe, elf, macho]
  if:
    type: text
    regex: '(?i)\b(Exodus|Guarda|Coinomi)\b'
  # Spanish UI uses "Guarda …" / "guardar" for Save; icon packs use brand keys.
  not:
    - regex: '(?i)\bguarda\s+el\s+(documento|archivo)\b'
    - regex: '(?i)\bdesea\s+guardar\b'
    - regex: "(?i)\\b(Exodus|Guarda|Coinomi)\\b[\"']\\s*,\\s*[\"']width[\"']"
  unless:
    - id: well-known/tool/detection/security-scanner-identity::apple-xprotectd-scanner-context
    - id: well-known/tool/detection/cleave::cleave-static-analysis-context
- id: native-alt-wallet-brand-family
  desc: Alternative wallet brand family reference
  crit: component
  conf: 0.9
  for: [pe, elf, macho]
  if:
    type: text
    regex: '(?i)\b(Tonkeeper|Zelcore|Atomic\s+Wallet)\b'
  not:
    - regex: "(?i)\\b(Tonkeeper|Zelcore|Atomic\\s+Wallet)\\b[\"']\\s*,\\s*[\"']width[\"']"
  unless:
    - id: well-known/tool/detection/security-scanner-identity::apple-xprotectd-scanner-context
    - id: well-known/tool/detection/cleave::cleave-static-analysis-context
- id: native-wallet-seed-endpoint
  desc: Endpoint path for wallet seed phrases
  crit: suspicious
  conf: 0.95
  for: [pe, elf, macho]
  if:
    type: raw
    regex: '(?i)/(seed|mnemonic|recovery)[-_]phrase[s]?\b'
- id: native-wallet-valid-seed-launch-gate
  desc: Valid-seed wallet launch gate
  crit: suspicious
  conf: 0.94
  for: [pe, elf, macho]
  if:
    type: raw
    regex: '(?i)(valid[_ ]seed|checkseed).{0,180}(launch|report_launch|original_wallet)'

composite_rules:
- id: private-key-theft-language
  desc: Private-key theft or collection language
  conf: 0.92
  crit: suspicious
  near_lines: 80
  unless:
  # TLS and PEM implementations legitimately describe retrieving, parsing,
  # and decrypting private keys. node-forge has strong independent namespace
  # markers, so its API prose should not be interpreted as collection intent.
  - id: well-known/lib/crypto/node-forge::node-forge-crypto-library
  all:
  - id: micro-behaviors/crypto/asymmetric/key::crypto-private-key-reference
  any:
  - id: private-key-theft-verb
  - id: private-key-collection-verb
- id: derivation-path-with-key-theft
  desc: HD wallet path with private-key theft context
  crit: suspicious
  conf: 0.93
  unless:
  - id: well-known/app/finance/sidesail/
  all:
  - id: private-key-theft-language
  any:
    - id: micro-behaviors/crypto/library/blockchain/wallet::derivation-path-bip
    - id: derivation-path-word
- id: bitcoin-wif
  desc: Bitcoin WIF private key format
  conf: 0.85
  crit: notable
  any:
  - id: bitcoin-wif-format
  - id: bitcoin-wif-pattern
  - id: bitcoin-wif-uncompressed-literal
  - id: bitcoin-wif-compressed-literal
- id: bip39-wordlist-ref
  desc: Mnemonic wordlist reference
  crit: notable
  conf: 0.85
  any:
  - id: wordlist-near-mnemonic
  - id: wordlist-near-recovery
  - id: mnemonic-near-wordlist
  - id: recovery-near-wordlist
- id: embedded-bip39-wordlist
  desc: Embedded BIP-39 mnemonic wordlist
  crit: suspicious
  conf: 0.92
  for: [binaries]
  needs: 3
  any:
  - id: bip39-wordlist-start-cluster
  - id: bip39-wordlist-mid-cluster
  - id: bip39-wordlist-crypto-cluster
  - id: bip39-wordlist-end-cluster
- id: bip39-wordlist-encoded-fragments
  desc: Encoded BIP-39 wordlist reference
  crit: suspicious
  conf: 0.95
  for: [powershell]
  all:
  - id: bip39-b64-bips-fragment
  - id: bip39-b64-index-fragment
  - id: bip39-b64-english-fragment
- id: variable-names
  desc: Mnemonic-related variable or function names
  crit: notable
  conf: 0.8
  any:
  - id: variable-names-1
  - id: variable-names-2
  unless:
  - id: micro-behaviors/crypto/library/blockchain/
- id: mnemonic-terms
  desc: Mnemonic or seed phrase terminology
  crit: notable
  conf: 0.7
  needs: 2
  any:
  - id: objectives/credential-access/wallet/keywords::mnemonic-word
  - id: seed-phrase-underscore
  - id: seedphrase-word
  - id: recovery-phrase-word
  - id: secret-words-word
- id: wallet-marker
  desc: Wallet or cryptocurrency marker
  crit: notable
  conf: 0.7
  unless:
  - id: metadata/file/catalog/identity/
  - id: metadata/library/structure::js-large-module-bundle
  - id: metadata/package/testing/
  needs: 3
  any:
  - id: objectives/impact/cryptojacking/miner/signatures::wallet-ref
  - id: objectives/impact/crypto-manipulation/keywords::crypto-word
  - id: objectives/credential-access/wallet/keywords::metamask-word
  - id: phantom-word
  - id: browser-word
- id: comprehensive-stealer
  desc: Comprehensive wallet credential theft
  crit: hostile
  conf: 0.95
  for:
  - python
  - javascript
  - elf
  - pe
  - macho
  needs: 3
  any:
  - id: mnemonic-terms
  - id: private-key-theft-language
  - id: keystore-file
  - id: derivation-path-with-key-theft
  - id: micro-behaviors/crypto/library/blockchain/wallet::bip39-wordlist-reference
- id: native-bip39-seed-harvesting
  desc: Native BIP-39 seed harvesting from clipboard and files
  crit: hostile
  conf: 0.98
  for: [pe, elf, macho]
  attack: "T1005,T1115,T1555"
  all:
  - id: embedded-bip39-wordlist
  - id: micro-behaviors/os/clipboard/access::get-clipboard-data
  - id: micro-behaviors/fs/traversal/drives::get-logical-drives
  - id: micro-behaviors/fs/enumerate/directory::find-first-file
  any:
  - id: objectives/collection/file-targeting/filter::mnemonic-extension-wide-glob
  - id: objectives/collection/file-targeting/filter::seed-extension-wide-glob
- id: phantom-word-unless-cond-1--rx-helper-4
  desc: Regex component marker
  crit: component
  conf: 1.0
  for:
  - python
  - csharp
  - go
  size_max: 10485760
  any:
  - id: phantom-word-unless-cond-1--rx-1
  - id: phantom-word-unless-cond-1--rx-2
  - id: phantom-word-unless-cond-1--rx-3

- id: native-multi-wallet-brand-catalog
  # Brand-name co-occurrence alone is common in design tools, icon packs, and
  # localized UI. Seed-theft composites keep the hostile signal.
  desc: Native catalog of multiple wallet brands
  crit: notable
  conf: 0.94
  for: [pe, elf, macho]
  needs: 2
  any:
  - id: native-hardware-wallet-brand-family
  - id: native-software-wallet-brand-family
  - id: native-alt-wallet-brand-family
  # Keep brand evidence local; native dictionaries and resource catalogs can
  # scatter unrelated names across megabytes of read-only data.
  near_bytes: 4096
  unless:
    - id: well-known/tool/detection/security-scanner-identity::apple-xprotectd-scanner-context
    - id: well-known/tool/detection/cleave::cleave-static-analysis-context
- id: native-multi-wallet-seed-harvester
  desc: Native multi-wallet seed harvesting workflow
  crit: hostile
  conf: 0.99
  for: [pe, elf, macho]
  all:
  - id: native-wallet-recovery-action
  - id: native-multi-wallet-brand-catalog
  - id: native-wallet-seed-endpoint
  - id: micro-behaviors/communications/http/auth::hardcoded-api-key-config
  any:
  - id: native-wallet-recovery-term
  - id: native-wallet-recovery-term-phrase-first
- id: native-valid-seed-wallet-theft
  desc: Native valid-seed wallet theft workflow
  crit: hostile
  conf: 0.99
  for: [pe, elf, macho]
  all:
  - id: native-wallet-valid-seed-launch-gate
  - id: native-wallet-seed-endpoint
  - id: micro-behaviors/communications/http/auth::hardcoded-api-key-config
  any:
  - id: native-wallet-recovery-term
  - id: native-wallet-recovery-term-phrase-first
