# Predictable wallet-seed generation.  The article's failure mode is a
# hardware-RNG integration mistake that routes secret generation through a
# reproducible software PRNG.  Keep the generic weak-PRNG observation
# suspicious; the hostile composites require wallet-seed context and, for the
# stronger cases, the device-state or disabled-fallback structure.
defaults:
  platforms: [windows, linux, macos]
  for: [source, scripts, binaries]

composite_rules:
  - id: wallet-seed-weak-prng
    desc: Wallet seed generated from a non-cryptographic PRNG
    crit: suspicious
    conf: 0.96
    near_lines: 80
    all:
      - id: micro-behaviors/crypto/library/blockchain/wallet::wallet-key-material-generation
    any:
      - id: micro-behaviors/os/random/prng/stdlib::math-random-call
      - id: micro-behaviors/os/random/crypto::rand-symbol
      - id: micro-behaviors/crypto/library/blockchain/wallet::wallet-weak-prng-source-api
      - id: micro-behaviors/crypto/library/blockchain/wallet::wallet-seedrandom-source-api
      - id: micro-behaviors/crypto/library/blockchain/wallet::wallet-embedded-prng-source

  - id: wallet-seed-device-state-prng
    desc: Wallet seed PRNG initialized from device or timing state
    crit: hostile
    conf: 0.97
    near_lines: 80
    all:
      - id: wallet-seed-weak-prng
    any:
      - id: micro-behaviors/crypto/library/blockchain/wallet::wallet-seed-device-state-source
      - id: micro-behaviors/crypto/library/blockchain/wallet::wallet-seed-clock-state-source

  - id: wallet-seed-disabled-hardware-rng-fallback
    desc: Wallet seed generation reaches a software RNG after hardware RNG is disabled
    crit: hostile
    conf: 0.99
    near_lines: 100
    all:
      - id: wallet-seed-weak-prng
      - id: micro-behaviors/crypto/library/blockchain/wallet::wallet-rng-disabled-compile-config
      - id: micro-behaviors/crypto/library/blockchain/wallet::wallet-rng-fallback-branch
      - id: micro-behaviors/crypto/library/blockchain/wallet::wallet-rng-presence-guard

  - id: wallet-seed-32bit-reseed
    desc: Wallet seed PRNG receives only a 32-bit reseed
    crit: hostile
    conf: 0.97
    near_lines: 100
    all:
      - id: wallet-seed-weak-prng
      - id: micro-behaviors/crypto/library/blockchain/wallet::wallet-rng-reseed-call
    any:
      - id: micro-behaviors/crypto/library/blockchain/wallet::wallet-rng-32bit-reseed-input
      - id: micro-behaviors/crypto/library/blockchain/wallet::wallet-rng-32bit-unpack
