# Predictable wallet-seed generation.  The article's failure mode is a
# hardware-RNG integration mistake that routes secret generation through a
# reproducible software PRNG.  Keep the generic weak-PRNG observation
# suspicious; the hostile composites require wallet-seed context and, for the
# stronger cases, the device-state or disabled-fallback structure.
defaults:
  platforms: [windows, linux, macos]
  for: [source, scripts, binaries]

composite_rules:
  - id: wallet-seed-weak-prng
    desc: Wallet seed generated from a non-cryptographic PRNG
    crit: suspicious
    conf: 0.96
    # `near_bytes`, not `near_lines`: a minified wallet bundle is two lines
    # long, so an 80-*line* window is the whole 2 MB file and any Math.random
    # anywhere counts as adjacent to any key-generation symbol. Rabby was
    # accused of weak seed generation on the strength of a Fisher-Yates
    # shuffle helper sitting megabytes away from its keyring code. 4 KB is
    # the same span in ordinary source and is line-layout independent.
    near_bytes: 4096
    all:
      - id: micro-behaviors/crypto/library/blockchain/wallet::wallet-key-material-generation
    any:
      - id: micro-behaviors/os/random/prng/stdlib::math-random-call
      - id: micro-behaviors/os/random/crypto::rand-symbol
      - id: micro-behaviors/os/random/prng/stdlib::weak-random-source-call
      - id: micro-behaviors/os/random/prng/stdlib::seedrandom-call
      - id: micro-behaviors/os/random/prng/embedded::embedded-prng-source-api
    unless:
      - id: well-known/app/dbcode::extension-context

  - id: wallet-seed-device-state-prng
    desc: Wallet seed PRNG initialized from device or timing state
    crit: hostile
    conf: 0.97
    # `near_bytes`, not `near_lines`: a minified wallet bundle is two lines
    # long, so an 80-*line* window is the whole 2 MB file and any Math.random
    # anywhere counts as adjacent to any key-generation symbol. Rabby was
    # accused of weak seed generation on the strength of a Fisher-Yates
    # shuffle helper sitting megabytes away from its keyring code. 4 KB is
    # the same span in ordinary source and is line-layout independent.
    near_bytes: 4096
    all:
      - id: wallet-seed-weak-prng
    any:
      - id: micro-behaviors/os/random/prng/embedded::state-device-uid-assignment
      - id: micro-behaviors/os/random/prng/embedded::state-timer-assignment
      - id: micro-behaviors/os/random/prng/embedded::state-clock-assignment
      - id: micro-behaviors/os/random/prng/seed-source

  - id: wallet-seed-disabled-hardware-rng-fallback
    desc: Wallet seed generation reaches a software RNG after hardware RNG is disabled
    crit: hostile
    conf: 0.99
    near_lines: 100
    all:
      - id: wallet-seed-weak-prng
      - id: micro-behaviors/os/random/prng/embedded::hardware-rng-disabled-compile-config
      - id: micro-behaviors/os/random/prng/embedded::software-rng-fallback-branch
      - id: micro-behaviors/os/random/prng/embedded::rng-presence-guard

  - id: wallet-seed-32bit-reseed
    desc: Wallet seed PRNG receives only a 32-bit reseed
    crit: hostile
    conf: 0.97
    near_lines: 100
    all:
      - id: wallet-seed-weak-prng
      - id: micro-behaviors/os/random/prng/embedded::prng-reseed-call
    any:
      - id: micro-behaviors/os/random/prng/embedded::prng-32bit-reseed-input
      - id: micro-behaviors/os/random/prng/embedded::prng-32bit-unpack
