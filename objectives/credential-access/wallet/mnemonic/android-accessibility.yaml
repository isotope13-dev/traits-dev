defaults:
  platforms: [android]
  for: [dex]
  attack: T1552.001
traits:
  - id: dex-bitcoin-wallet-mnemonic-node-lookup
    desc: Looks up Bitcoin wallet mnemonic table
    crit: notable
    conf: 0.99
    if:
      type: symbol
      kind: call
      exact: Landroid/view/accessibility/AccessibilityNodeInfo;->findAccessibilityNodeInfosByViewId
      arg: {index: 0, kind: string, exact: 'com.bitcoin.mwallet:id/mnemonicTable'}
  - id: dex-trust-wallet-phrase-node-lookup
    desc: Looks up Trust Wallet recovery phrase
    crit: notable
    conf: 0.99
    if:
      type: symbol
      kind: call
      exact: Landroid/view/accessibility/AccessibilityNodeInfo;->findAccessibilityNodeInfosByViewId
      arg: {index: 0, kind: string, exact: 'com.wallet.crypto.trustapp:id/phrase'}
composite_rules:
  # Targeted queries for two independent third-party wallet recovery views,
  # plus text reads and UI actions, distinguish multi-wallet seed capture
  # from generic accessibility or a wallet's own recovery-screen strings.
  - id: dex-bitcoin-mnemonic-nearby-text-reads
    desc: Bitcoin mnemonic targeting with nearby text reads
    crit: notable
    conf: 0.98
    near_bytes: 512
    all:
      - id: dex-bitcoin-wallet-mnemonic-node-lookup
      - id: micro-behaviors/hardware/input/accessibility::dex-accessibility-node-text-read
  - id: dex-trust-phrase-nearby-text-reads
    desc: Trust Wallet phrase targeting with text reads
    crit: notable
    conf: 0.98
    near_bytes: 512
    all:
      - id: dex-trust-wallet-phrase-node-lookup
      - id: micro-behaviors/hardware/input/accessibility::dex-accessibility-node-text-read
  - id: android-multi-wallet-phrase-ui-capture
    desc: Wallet recovery targeting with accessibility reads
    crit: hostile
    conf: 0.98
    all:
      - id: dex-bitcoin-mnemonic-nearby-text-reads
      - id: dex-trust-phrase-nearby-text-reads
      - id: micro-behaviors/hardware/input/accessibility::dex-accessibility-node-action
