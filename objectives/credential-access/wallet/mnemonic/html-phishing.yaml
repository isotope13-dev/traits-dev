defaults:
  platforms: [windows, unix]
  for: [html, javascript]
  attack: T1555
  mbc: B0028
  crit: component
  conf: 0.86
traits:
  - id: wallet-key-dispatch-function
    desc: Wallet key backend function
    crit: suspicious
    conf: 0.98
    for: [javascript]
    if:
      type: text
      word: sendKeyToBackend
  - id: wallet-key-type-field
    desc: Wallet key type field
    # Bare `key_type` appears in compilers, maps, and APIs. Incomplete alone —
    # only meaningful with wallet brands/dispatch in the hostile composite.
    crit: notable
    conf: 0.96
    for: [javascript]
    if:
      type: text
      word: key_type
  - id: wallet-type-field
    desc: Wallet type field
    crit: notable
    conf: 0.96
    for: [javascript]
    if:
      type: text
      word: wallet_type

  # A phishing page that helps the victim type a valid phrase fetches the
  # BIP-39 wordlist for autocomplete (here api/bip39-english.txt). A bare
  # filename reference is also ordinary documentation, so the path alone
  # stays notable; the suspicious verdict comes from the fetch pairing
  # below, which covers both inline fetch('...') and constant indirection.
composite_rules:
  - id: wallet-key-payload-fields
    desc: Wallet key payload field names
    # Aggregates incomplete field-name fragments for the password-capture
    # composite; not a standalone observation (key_type alone is ubiquitous).
    crit: component
    conf: 0.96
    for: [javascript, crx, xpi, zip]
    any:
      - id: wallet-key-type-field
      - id: wallet-type-field

  - id: wallet-password-capture-flow
    desc: Branded wallet password forwarded by application code
    crit: hostile
    conf: 0.99
    attack: T1056.002,T1041
    for: [javascript, crx, xpi, zip, html]
    scope: archive
    all:
      - id: micro-behaviors/os/application/target::wallet-brand-catalog
      - id: wallet-key-dispatch-function
      - id: wallet-key-payload-fields
      - id: micro-behaviors/ui/window/password-field::password-input-field
      - id: micro-behaviors/ui/window/password-field::password-input-field-script

  # Requesting the wordlist at runtime (whether the URL sits inline in the
  # fetch or in a nearby constant) is the kit's autocomplete supply; a
  # document merely naming the file has no fetch call near the reference.
