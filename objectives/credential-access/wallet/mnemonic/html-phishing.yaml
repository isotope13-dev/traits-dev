defaults:
  platforms: [windows, unix]
  for: [html, javascript]
  attack: T1555
  mbc: B0028
  crit: component
  conf: 0.86
traits:
  - id: recovery-phrase-entry-prompt
    desc: Recovery phrase entry prompt
    crit: suspicious
    conf: 0.9
    if:
      type: text
      regex: 'Enter your 12 or 24[- ]word recovery phrase'
  - id: generic-recovery-phrase-entry-prompt
    desc: Generic recovery phrase entry prompt
    crit: suspicious
    conf: 0.88
    for: [html, javascript, archives]
    unless:
      - id: well-known/app/finance/pearl::pearl-wallet-app-context
    if:
      type: text
      substr: Enter your recovery phrase
  - id: twelve-or-twentyfour-phrase
    desc: Twelve or twenty-four word phrase
    crit: suspicious
    conf: 0.86
    if:
      type: text
      regex: '12 or 24[- ]word recovery phrase'
  - id: optional-passphrase-word
    desc: Optional wallet passphrase field
    crit: suspicious
    conf: 0.86
    if:
      type: text
      substr: 25th word
  - id: restore-from-recovery-copy
    desc: Restore from recovery phrase copy
    crit: component
    conf: 0.82
    if:
      type: text
      substr: Restore from recovery phrase
  - id: numbered-seedword-inputs
    desc: Numbered seedword input grid
    crit: suspicious
    conf: 0.92
    for: [html, javascript, archives]
    count_min: 12
    if:
      type: text
      regex: 'id=["'']seedword[0-9]{1,2}["'']'
  - id: seedword-input-name
    desc: Seedword input identifier
    crit: component
    conf: 0.86
    for: [html, javascript, archives]
    if:
      type: text
      substr: seedword

  - id: wallet-mnemonic-textarea
    desc: Wallet mnemonic textarea input
    crit: suspicious
    conf: 0.96
    for: [html, javascript, archives]
    if:
      type: text
      regex: '<textarea\b[\s\S]{0,500}\bmnemonic\b'

  - id: wallet-seed-textarea
    desc: Wallet seed textarea input
    crit: suspicious
    conf: 0.96
    for: [html, javascript, archives]
    unless:
      - id: well-known/app/finance/pearl::pearl-wallet-app-context
    if:
      type: text
      regex: '(?i)<textarea[^>]{0,160}(id|name|placeholder|aria-label)\s*=\s*[^>]{0,60}seed'

  - id: wallet-recovery-textarea
    desc: Wallet recovery-phrase textarea input
    crit: suspicious
    conf: 0.96
    for: [html, javascript, archives]
    unless:
      - id: well-known/app/finance/pearl::pearl-wallet-app-context
    if:
      type: text
      regex: '(?i)<textarea\b[\s\S]{0,500}\b(recovery phrase|seed phrase|mnemonic)\b'

  - id: wallet-seed-phrase-entry-label
    desc: Wallet seed phrase entry label
    crit: notable
    conf: 0.96
    unless:
      - id: well-known/app/finance/did-wallet::did-wallet-extension-context
      - id: well-known/app/finance/did-wallet::did-wallet-secret-safety-warning
      - id: well-known/app/finance/pearl::pearl-wallet-app-context
    if:
      type: text
      regex: '\b(import|enter|restore|recover)\b.{0,60}\bseed phrase\b'
      case_insensitive: true

  - id: wallet-secret-phrase-entry-label
    desc: Wallet secret phrase entry label
    crit: notable
    conf: 0.96
    unless:
      - id: well-known/app/finance/did-wallet::did-wallet-extension-context
      - id: well-known/app/finance/did-wallet::did-wallet-secret-safety-warning
    if:
      type: text
      regex: '\b(import|enter|restore|recover)\b.{0,60}\bsecret phrase\b'
      case_insensitive: true

  - id: wallet-recovery-phrase-entry-label
    desc: Wallet recovery phrase entry label
    crit: notable
    conf: 0.96
    unless:
      - id: well-known/app/finance/did-wallet::did-wallet-extension-context
      - id: well-known/app/finance/did-wallet::did-wallet-secret-safety-warning
      - id: well-known/app/finance/pearl::pearl-wallet-app-context
    if:
      type: text
      regex: '\b(import|enter|restore|recover)\b.{0,60}\brecovery phrase\b'
      case_insensitive: true

  - id: wallet-mnemonic-entry-label
    desc: Wallet mnemonic entry label
    crit: notable
    conf: 0.96
    unless:
      - id: well-known/app/finance/did-wallet::did-wallet-extension-context
      - id: well-known/app/finance/did-wallet::did-wallet-secret-safety-warning
      - id: metadata/package/quality/benign-context::openchamber-credential-import-context
      - id: metadata/package/quality/benign-context::openchamber-assembly-grammar-context
      - id: well-known/app/finance/pearl::pearl-wallet-app-context
    if:
      type: text
      regex: '\b(import|enter|restore|recover)\b.{0,60}\bmnemonic\b'
      case_insensitive: true
    not:
      - substr: mnemonic.general-purpose
      - substr: keyword.operator.word.mnemonic
      - substr: mnemonics-intel-isa

  - id: wallet-private-key-import-label
    desc: Wallet private-key import label
    crit: notable
    conf: 0.96
    for: [html, javascript, svg, archives]
    unless:
      - id: metadata/build/scaffold::openapi-javascript-required-parameter-template
    if:
      type: text
      # Only allow short direct-entry fillers.  This must not match prose such
      # as “private-key import fails” in an unrelated test or error message.
      # The leading `[^-\w]` also rules out a hyphenated verb: WebCrypto code
      # comments like `// Re-import private key to make it unextractable`
      # describe a CryptoKey round-trip, not a wallet-entry label.
      # A label ends at a quote, tag, label colon/asterisk, or line boundary;
      # prose such as "Import a private key to create a wallet" does not.
      regex: '(?m)[^-\w]import\s+((your|the|a|wallet)\s+)?private[ _-]*key(\s*[:*]|[<"''`]|$)'
      case_insensitive: true

  - id: wallet-private-key-enter-label
    # This atom cannot establish that "private key" means a wallet key. API
    # clients also use that wording; wallet intent is added by composites.
    desc: Private-key entry label
    crit: notable
    conf: 0.96
    for: [html, javascript, svg, archives]
    if:
      type: text
      regex: '\benter\s+((your|the|a|wallet)\s+)?private[ _-]*key\b'
      case_insensitive: true

  - id: wallet-private-key-input-label
    desc: Wallet private-key input label
    crit: notable
    conf: 0.96
    for: [html, javascript, svg, archives]
    if:
      type: text
      regex: '\binput\s+((your|the|a|wallet)\s+)?private[ _-]*key\b'
      case_insensitive: true

  - id: wallet-private-key-recovery-label
    desc: Wallet private-key recovery label
    crit: notable
    conf: 0.96
    unless:
      - id: well-known/app/finance/did-wallet::did-wallet-extension-context
      - id: well-known/app/finance/did-wallet::did-wallet-secret-safety-warning
      - id: well-known/lib/cloud/aws-sdk-js/
      - id: well-known/lib/format/bitgo-js::bitgo-js-archive-context
      - id: well-known/app/finance/canopy::canopy-wallet-app-context
    for: [html, javascript, svg, archives]
    if:
      type: text
      regex: '\b(restore|recover)\b.{0,60}\bprivate[ _-]*key\b'
      case_insensitive: true

  - id: numbered-wallet-word-inputs
    desc: Numbered wallet word input grid
    crit: suspicious
    conf: 0.95
    count_min: 12
    if:
      type: text
      regex: 'name=["'']word[0-9]{1,2}["'']'

  - id: numbered-seed-word-inputs
    desc: Numbered seed-word input grid
    crit: suspicious
    conf: 0.97
    count_min: 12
    if:
      type: text
      regex: 'name=["'']seed[-_ ]word[-_ ]?[0-9]{1,2}["'']'

  - id: wallet-seed-word-field-code
    desc: Seed-word field code with collected inputs
    crit: suspicious
    conf: 0.96
    unless:
      - id: well-known/app/finance/did-wallet::did-wallet-extension-context
      - id: well-known/app/finance/did-wallet::did-wallet-secret-safety-warning
    if:
      type: text
      regex: '\bseedInputs\b.{0,180}\bseed[-_ ]word\b'

  - id: wallet-key-dispatch-function
    desc: Wallet key backend function
    crit: suspicious
    conf: 0.98
    for: [javascript, archives]
    if:
      type: text
      word: sendKeyToBackend
  - id: wallet-key-type-field
    desc: Wallet key type field
    # Bare `key_type` appears in compilers, maps, and APIs. Incomplete alone —
    # only meaningful with wallet brands/dispatch in the hostile composite.
    crit: component
    conf: 0.96
    for: [javascript, archives]
    if:
      type: text
      word: key_type
  - id: wallet-type-field
    desc: Wallet type field
    crit: component
    conf: 0.96
    for: [javascript, archives]
    if:
      type: text
      word: wallet_type

composite_rules:
  - id: wallet-private-key-entry-label
    desc: Wallet private-key entry label
    crit: notable
    conf: 0.96
    for: [html, javascript, svg, archives]
    unless:
      - id: well-known/app/finance/did-wallet::did-wallet-extension-context
      - id: well-known/app/finance/did-wallet::did-wallet-secret-safety-warning
      - id: well-known/lib/cloud/aws-sdk-js/
      - id: well-known/lib/format/bitgo-js::bitgo-js-archive-context
      - id: well-known/app/finance/canopy::canopy-wallet-app-context
      - id: well-known/lib/crypto/openpgp-js::openpgp-extension-ui-context
    any:
      - id: wallet-private-key-import-label
      - id: wallet-private-key-enter-label
      - id: wallet-private-key-input-label

  - id: web-mnemonic-entry-form
    desc: Web recovery phrase capture form
    crit: suspicious
    conf: 0.93
    all:
      - id: recovery-phrase-entry-prompt
      - id: objectives/credential-access/wallet/keywords::seed-phrase-word
    any:
      - id: twelve-or-twentyfour-phrase
      - id: optional-passphrase-word
      - id: restore-from-recovery-copy
  - id: web-seedword-entry-form
    desc: Web seedword recovery phrase capture form
    crit: suspicious
    conf: 0.94
    for: [html, javascript, archives]
    all:
      - id: generic-recovery-phrase-entry-prompt
      - id: numbered-seedword-inputs
      - id: seedword-input-name

  - id: wallet-credential-entry-page
    desc: Wallet private-key or phrase entry page
    crit: suspicious
    conf: 0.97
    for: [html, javascript, svg, xpi, archives]
    scope: archive
    unless:
      - id: well-known/app/finance/did-wallet::did-wallet-extension-context
      - id: well-known/app/finance/did-wallet::did-wallet-secret-safety-warning
      - id: well-known/app/finance/rabby::rabby-wallet-extension-context
    all:
      - id: wallet-credential-entry-label
      - id: wallet-credential-input-surface

  - id: wallet-credential-entry-label
    desc: Wallet secret-entry label
    crit: notable
    conf: 0.97
    for: [html, javascript, svg, archives]
    unless:
      - id: well-known/app/finance/did-wallet::did-wallet-extension-context
      - id: well-known/app/finance/did-wallet::did-wallet-secret-safety-warning
      - id: well-known/app/finance/pearl::pearl-wallet-app-context
      - id: well-known/app/finance/canopy::canopy-wallet-app-context
      - id: well-known/app/enterprise/egroupware/
    any:
      - id: wallet-seed-phrase-entry-label
      - id: wallet-secret-phrase-entry-label
      - id: wallet-recovery-phrase-entry-label
      - id: wallet-mnemonic-entry-label
      - id: wallet-private-key-entry-label
      - id: wallet-private-key-recovery-label

  - id: wallet-credential-input-surface
    desc: Wallet secret input surface
    crit: suspicious
    conf: 0.96
    for: [html, javascript, svg, archives]
    unless:
      - id: well-known/app/finance/did-wallet::did-wallet-extension-context
      - id: well-known/app/finance/did-wallet::did-wallet-secret-safety-warning
      - id: well-known/app/finance/rabby::rabby-wallet-extension-context
      - id: well-known/app/finance/canopy::canopy-wallet-app-context
      - id: well-known/lib/crypto/openpgp-js::openpgp-extension-ui-context
      - id: well-known/app/enterprise/egroupware/
    all:
      - id: wallet-credential-entry-label
    any:
      - id: numbered-wallet-word-inputs
      - id: numbered-seed-word-inputs
      - id: wallet-secret-textarea
      - id: micro-behaviors/ui/window/manage/dom::password-input-field
      - id: micro-behaviors/ui/window/form-input::password-input-field-script

  - id: wallet-secret-textarea
    desc: Wallet recovery secret textarea input
    crit: suspicious
    conf: 0.96
    for: [html, javascript, archives]
    unless:
      - id: well-known/app/finance/did-wallet::did-wallet-extension-context
      - id: well-known/app/finance/did-wallet::did-wallet-secret-safety-warning
      - id: well-known/app/finance/canopy::canopy-wallet-app-context
      - id: well-known/app/finance/pearl::pearl-wallet-app-context
    any:
      - id: wallet-mnemonic-textarea
      - id: wallet-seed-textarea
      - id: wallet-recovery-textarea

  - id: wallet-credential-http-exfil
    desc: Wallet credential entry data sent to a remote HTTP endpoint
    crit: hostile
    conf: 0.99
    attack: T1056.002,T1041
    for: [html, javascript, typescript]
    scope: file
    all:
      - id: objectives/exfiltration/sensitive-data::js-private-key-input-and-request-field
      - id: micro-behaviors/data/source/property/read::js-value-property-read
      - id: objectives/exfiltration/sensitive-data::js-remote-http-post-json

  - id: wallet-seed-http-exfil
    desc: Collected wallet seed words sent to a remote HTTP endpoint
    crit: hostile
    conf: 0.99
    attack: T1056.002,T1041
    for: [html, javascript, typescript]
    scope: file
    near_lines: 120
    all:
      - id: wallet-seed-word-field-code
      - id: micro-behaviors/data/source/property/read::js-value-property-read
      - id: micro-behaviors/communications/http/request/client::js-fetch-call
      - id: micro-behaviors/communications/http/request/client::post-method-text
      - id: micro-behaviors/communications/http/header/content-type::json-header
      - id: micro-behaviors/communications/http/url/domain::js-remote-host-url

  - id: wallet-credential-encoded-http-exfil
    desc: Wallet secret entry paired with encoded HTTP exfiltration
    crit: hostile
    conf: 0.99
    attack: T1056.002,T1041,T1027
    for: [crx, xpi, archives]
    scope: archive
    all:
      - id: wallet-credential-entry-page
      - id: objectives/exfiltration/http/encoded::js-xor-base64-http-post

  - id: wallet-key-payload-fields
    desc: Wallet key payload field names
    # Aggregates incomplete field-name fragments for the password-capture
    # composite; not a standalone observation (key_type alone is ubiquitous).
    crit: component
    conf: 0.96
    for: [javascript, archives]
    any:
      - id: wallet-key-type-field
      - id: wallet-type-field

  - id: wallet-password-capture-flow
    desc: Branded wallet password forwarded by application code
    crit: hostile
    conf: 0.99
    attack: T1056.002,T1041
    for: [javascript, archives]
    scope: archive
    all:
      - id: micro-behaviors/crypto/library/blockchain/wallet-brand::wallet-brand-catalog
      - id: wallet-key-dispatch-function
      - id: wallet-key-payload-fields
      - id: micro-behaviors/ui/window/manage/dom::password-input-field
      - id: micro-behaviors/ui/window/form-input::password-input-field-script
