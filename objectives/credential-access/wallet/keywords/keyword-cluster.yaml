defaults:
  platforms: [windows, unix]
  for: [scripts, binaries]
  crit: notable
  conf: 0.8
  attack: T1552.001

traits:
- id: hardware-wallet-file-read-call
  desc: Wallet-related file read or metadata API call
  crit: notable
  conf: 0.85
  if:
    type: text
    regex: '(?i)\b(readFile|readdir|stat)\s*\([^)]{0,60}\b(wallet|keystore)\b'
- id: hardware-wallet-file-copy-call
  desc: Wallet-related file copy API call
  crit: notable
  conf: 0.82
  if:
    type: text
    regex: '(?i)\bcopyFile(Sync)?\s*\([^)]{0,60}\b(wallet|keystore)\b'
composite_rules:
- id: hardware-wallet-file-access
  desc: Reads or searches local files
  crit: component
  conf: 0.9
  any:
  - id: hardware-wallet-file-read-call
  - id: micro-behaviors/fs/search::wallet-path-glob-or-walk-call
  - id: hardware-wallet-file-copy-call
- id: crypto-wallet-keyword-cluster
  desc: Repeated wallet names with wallet paths and file reads
  crit: suspicious
  conf: 0.9
  # Brand repetition also occurs in UI routes, provider selection and SDKs.
  # Require local artifact and acquisition evidence in this same file.
  # This is co-occurrence, not a proven path-to-read data-flow relationship.
  all:
  - id: micro-behaviors/fs/path/wallet
  - id: micro-behaviors/fs/read/file
  unless:
  # yt-dlp extractor vocabulary, not wallet targeting.
  - id: well-known/tool/media/yt-dlp::yt-dlp-package-context
  - id: well-known/tool/detection/
  - id: well-known/app/development/codeplane/
  - id: metadata/build/
  - id: well-known/tool/reverse-engineering/radare2/
  - id: well-known/lib/ai/coding-assistant::cline-extension-api-host
  - id: well-known/app/finance/
  - id: metadata/package/testing/
  # Wallet SDK documentation names the wallets it integrates (Phantom, Zcash)
  # by design.
  - id: metadata/package/documentation/source::documentation-dir-path
  any:
  - id: micro-behaviors/os/application/target::crypto-wallet-keyword-cluster--rx-1
  - id: micro-behaviors/os/application/target::crypto-wallet-keyword-cluster--rx-2
- id: hardware-wallet-keyword-cluster
  desc: Targets hardware wallet backup files
  crit: suspicious
  conf: 0.88
  unless:
  - id: well-known/tool/detection/security-scanner/
  - id: well-known/tool/detection/threat-intel/
  - id: well-known/lib/ai/coding-assistant::cline-extension-api-host
  near_bytes: 160
  all:
  - id: micro-behaviors/fs/path/credential::wallet-keystore-file-path-wording
  - id: hardware-wallet-file-access
  any:
  - id: micro-behaviors/os/application/target::hardware-wallet-keyword-cluster--rx-6
  - id: micro-behaviors/os/application/target::hardware-wallet-keyword-cluster--rx-7
  - id: micro-behaviors/os/application/target::hardware-wallet-keyword-cluster--rx-8
  - id: micro-behaviors/os/application/target::hardware-wallet-keyword-cluster--rx-9
  - id: micro-behaviors/os/application/target::hardware-wallet-keyword-cluster--rx-10
