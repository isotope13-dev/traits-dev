# Crypto wallet-drainer vocabulary. "drainer" alone is an ordinary English
# word (zxcvbn's password dictionary, plumbing, queue drainers), so only the
# crypto-theft compounds match: wallet/NFT/token drainer, drainer kit/panel.
# Replaces objectives/command-and-control/backdoor/keywords::drainer-word
# (2026-09), a bare-word atom filed under C2 backdoor keywords.
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
  attack: T1552.001

traits:
  - id: wallet-drainer-term
    desc: Crypto wallet drainer term
    crit: notable
    conf: 0.6
    if:
      type: text
      regex: '(?i)\b((crypto|wallet|nft|token|web3)[ _-]?drainer|drainer[ _-]?(kit|panel|contract))\b'
