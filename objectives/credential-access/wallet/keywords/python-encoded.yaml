defaults:
  platforms: [unix]
  for: [elf]
  attack: "T1555.003,T1041"
  mbc: "F1014"

traits:
  - id: python-encoded-wallet-store-path
    desc: Decoded content references wallet paths
    crit: suspicious
    conf: 0.96
    for: [python]
    if:
      type: encoded
      encoding: base64
      regex: '(?i)(/\.config/solana/|/\.ethereum/keystore|metamask|phantom)'
  # Generic references to a wallet also describe ordinary UI and payment
  # features. Require terminology that identifies secret wallet material; the
  # composite legs below carry the exfiltration intent.
  - id: python-encoded-wallet-secret-terms
    desc: Decoded content references wallet secret terms
    crit: suspicious
    conf: 0.94
    for: [python]
    if:
      type: encoded
      encoding: base64
      regex: '(?i)\b(mnemonic|private key)\b'
    unless:
      - id: metadata/package/testing/presence/harness::test-directory-path
      - id: metadata/package/testing/presence/harness::python-test-file
  - id: python-encoded-wallet-recovery-terms
    desc: Decoded wallet recovery phrases
    crit: suspicious
    conf: 0.94
    for: [python]
    if:
      type: encoded
      encoding: base64
      regex: '(?i)\b(seed phrase|recovery phrase)\b'
