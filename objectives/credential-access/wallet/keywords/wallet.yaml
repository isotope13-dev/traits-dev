defaults:
  platforms:
  - unix
  - windows
  for: [scripts, binaries]
traits:
- id: wallet-token
  desc: Wallet keyword
  crit: component
  conf: 0.4
  if:
    type: text
    word: wallet
  unless:
  - id: well-known/lib/cloud/supabase::auth-js-web3-module
# Relocated from objectives/supply-chain/recon-exfil/ai-cli/, which named it
# `prompt-wallets-word`. `wallet-token` above already owns the singular; this is
# the plural the word-boundary matcher misses. The LLM-prompt composites that
# used to define it locally reference it from here.
- id: wallets-word
  desc: Wallets keyword
  crit: notable
  conf: 0.5
  for: [javascript, typescript]
  if:
    type: string_literal
    word: wallets
    case_insensitive: true
- id: solana-lamports-per-sol
  desc: Solana LAMPORTS_PER_SOL constant
  conf: 0.8
  crit: baseline
  for: [javascript, typescript]
  if:
    type: text
    substr: LAMPORTS_PER_SOL
# Desktop and hardware wallet product names. Individually these are just
# product words; a stealer or an LLM harvesting prompt names several at once,
# which is what the cluster composite below measures.
