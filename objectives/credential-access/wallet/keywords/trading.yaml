defaults:
  platforms:
  - unix
  - windows
  crit: notable
  conf: 0.5
  for: [scripts, binaries]
traits:
- id: defi-protocol-aave
  desc: DeFi lending protocol reference (Aave)
  if:
    type: text
    word: aave
    case_insensitive: false
  unless:
    - id: metadata/library/structure::vscode-js-distribution-bundle
- id: defi-protocol-compound-core
  desc: "DeFi lending protocol reference"
  if:
    type: text
    regex: (?i)\bcompound\s*(finance|protocol|v2|v3)\b
- id: defi-protocol-compound-ecosystem
  desc: 'DeFi lending protocol ref (Compound ecosystem)'
  if:
    type: text
    regex: (?i)\bcompound\s*(comet|governance|market)\b
- id: defi-protocol-compound-token
  desc: "DeFi lending protocol ref"
  if:
    type: text
    regex: (?i)\bcompound\s*(usdc|ctoken)\b
- id: defi-protocol-curve-finance
  desc: DeFi Curve Finance protocol reference
  if:
    type: text
    regex: (?i)curve\s*(finance|pool|swap)
- id: defi-protocol-curve-defi
  desc: DeFi Curve governance/LP reference
  if:
    type: text
    regex: (?i)curve\s*(dao|gauge|lp)
- id: swap-operations
  desc: Token swap operation patterns
  if:
    type: text
    regex: (?i)(swapExact|swap_tokens|swapTokensFor)
- id: contract-query--getreserves
  desc: Smart contract query methods (getReserves)
  if:
    type: text
    word: getReserves
- id: contract-query--getpaircontract
  desc: Smart contract query methods (getPairContract)
  if:
    type: text
    word: getPairContract
- id: contract-query--gettokenandcontract
  desc: Smart contract query (getTokenAndContract)
  if:
    type: text
    word: getTokenAndContract
composite_rules:
- id: contract-query
  desc: "Smart contract query methods"
  any:
  - id: contract-query--getreserves
  - id: contract-query--getpaircontract
  - id: contract-query--gettokenandcontract
- id: defi-protocol-lending
  desc: DeFi lending protocol references (Aave/Compound)
  any:
  - id: defi-protocol-aave
  - id: defi-protocol-compound-core
  - id: defi-protocol-compound-ecosystem
  - id: defi-protocol-compound-token
  unless:
    - id: metadata/library/structure::vscode-js-distribution-bundle
