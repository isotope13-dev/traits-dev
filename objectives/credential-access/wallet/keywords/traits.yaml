defaults:
  platforms: [windows, unix]
  for: [scripts, source, binaries]

traits:
  - id: rust-wallet-keyword-privatekey
    desc: Rust private key keyword
    crit: notable
    conf: 0.85
    if:
      type: text
      word: privatekey
    unless:
    # A name reached through a string is the reflective spelling; where the
    # direct form is already recorded, this would be the same call twice.
    - id: well-known/lib/network/wireguard::wgquick-privatekey-directive
  - id: rust-wallet-keyword-trustwallet
    desc: Rust TrustWallet keyword
    crit: notable
    conf: 0.85
    if:
      type: text
      word: trustwallet
