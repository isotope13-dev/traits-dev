# Wallet-key harvesting by documentation: the package's own instructions
# walk the user through handing a real private key to the tool, while the
# manifest ships a database driver for a backend the documentation never
# mentions. Each leg is observable in the distributed archive.
defaults:
  platforms: [unix, windows]
  for: [markdown, package.json, npm]
  attack: T1552.001

traits:
  - id: docs-private-key-placeholder-submission
    desc: Docs assign a placeholder wallet private key
    crit: notable
    conf: 0.9
    for: [markdown, text]
    if:
      type: text
      regex: '(?i)\b(from[_-]?private[_-]?key|private[_-]?key)\s*[:=]\s*["''][A-Z_][A-Z0-9_ ]{4,}["'']'

  - id: sql-private-key-column-reference
    desc: SQL text names a private_key column
    crit: suspicious
    conf: 0.92
    for: [javascript, typescript]
    if:
      type: text
      regex: '(?i)\bprivate_key\b'

  - id: private-key-value-reference
    desc: References a privateKey value
    crit: suspicious
    conf: 0.9
    for: [javascript, typescript]
    if:
      type: text
      word: privateKey

composite_rules:
  - id: wallet-private-key-sql-storage
    desc: SQL insert writes a privateKey value
    crit: suspicious
    conf: 0.94
    for: [javascript, typescript]
    near_bytes: 256
    all:
      - id: micro-behaviors/data/db/write/row::sql-insert-into-statement
      - id: sql-private-key-column-reference
      - id: private-key-value-reference

  - id: key-submission-with-database-driver
    desc: Wallet-key submission docs feed into SQL key storage
    crit: hostile
    conf: 0.88
    scope: archive
    for: [markdown, package.json, npm, javascript]
    all:
      - id: docs-private-key-placeholder-submission
      - id: metadata/package/dependencies/manifest/identity::npm-dependency-mysql2
      - id: wallet-private-key-sql-storage

  - id: obfuscated-javascript-mysql2-backend
    desc: Obfuscated JavaScript accompanies a MySQL driver dependency
    crit: suspicious
    conf: 0.9
    for: [npm, package.json, javascript]
    scope: archive
    all:
      - id: metadata/package/dependencies/manifest/identity::npm-dependency-mysql2
      - id: objectives/anti-static/obfuscation/obfuscator/js-obfuscator::javascript-obfuscator-string-array-runtime
