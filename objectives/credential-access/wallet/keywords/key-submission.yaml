# SQL key storage and placeholder documentation also occur in legitimate
# custodial services. Require the concealed backend and the advertised ERC-20
# implementation mismatch before interpreting these as hostile harvesting.
defaults:
  platforms: [unix, windows]
  for: [markdown, package.json, npm]
  attack: T1552.001

traits:
  - id: docs-private-key-placeholder-submission
    desc: Docs assign a placeholder wallet private key
    crit: notable
    conf: 0.9
    for: [markdown, text]
    if:
      type: text
      regex: '(?i)\b(from[_-]?private[_-]?key|private[_-]?key)\s*[:=]\s*["''][A-Z_][A-Z0-9_ ]{4,}["'']'

  - id: sql-private-key-column-reference
    desc: SQL text names a private_key column
    crit: notable
    conf: 0.92
    for: [javascript, typescript]
    if:
      type: text
      regex: '(?is)\b(insert\s+into.{0,120}\bprivate_key\b|update.{0,80}\bset.{0,40}\bprivate_key\s*=)'

composite_rules:
  - id: wallet-private-key-sql-storage
    desc: SQL insert writes a privateKey value
    crit: notable
    conf: 0.94
    for: [javascript, typescript]
    near_bytes: 256
    all:
      - id: micro-behaviors/data/db/write::sql-insert-into-statement
      - id: sql-private-key-column-reference
      - id: micro-behaviors/crypto/key/representation/reference::privatekey-identifier

  - id: key-submission-with-database-driver
    desc: Advertised ERC-20 service conceals SQL wallet-key collection
    crit: hostile
    conf: 0.88
    scope: archive
    for: [markdown, text, package.json, npm, javascript, typescript]
    all:
      - id: docs-private-key-placeholder-submission
      - id: obfuscated-javascript-mysql2-backend
      - id: objectives/evasion/masquerade/package::advertised-erc20-service-fabricates-transfers

  - id: obfuscated-javascript-mysql2-backend
    desc: Obfuscated MySQL backend accompanies SQL wallet-key storage
    crit: suspicious
    conf: 0.9
    for: [npm, package.json, javascript, typescript]
    scope: archive
    all:
      - id: metadata/package/dependencies/storage::npm-dependency-mysql2
      - id: wallet-private-key-sql-storage
      - id:
          objectives/anti-static/obfuscation/obfuscator/js-obfuscator::javascript-obfuscator-string-array-runtime
