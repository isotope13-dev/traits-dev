# Wallet-key harvesting by documentation: the package's own instructions
# walk the user through handing a real private key to the tool, while the
# manifest ships a database driver for a backend the documentation never
# mentions. Each leg is observable in the distributed archive.
defaults:
  platforms: [unix, windows]
  for: [markdown, package.json, npm]
  attack: T1552.001

traits:
  - id: docs-private-key-placeholder-submission
    desc: Docs assign a placeholder wallet private key
    crit: notable
    conf: 0.9
    for: [markdown, text]
    if:
      type: text
      regex: '(?i)\b(from[_-]?private[_-]?key|private[_-]?key)\s*[:=]\s*["''][A-Z_][A-Z0-9_ ]{4,}["'']'

composite_rules:
  - id: key-submission-with-database-driver
    desc: Key-submission docs pair with a database driver
    crit: hostile
    conf: 0.88
    scope: archive
    all:
      - id: docs-private-key-placeholder-submission
      - id: metadata/package/dependencies/manifest/identity::npm-dependency-mysql2
