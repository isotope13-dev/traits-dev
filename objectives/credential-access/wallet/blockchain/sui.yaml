# Sui blockchain wallet credential paths.
defaults:
  platforms: [unix, windows]
  for: [python, python_bytecode, pyc, shell]
  attack: T1555
  mbc: B0028

traits:
  - id: sui-wallet-keystore-path-ref
    desc: References Sui wallet keystore paths
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: '\.suiz|sui\.keystore|sui_config\.yaml'
