# Sui blockchain wallet credential paths.
defaults:
  platforms: [unix, windows]
  for: [python, python_bytecode, pyc, shell]
  attack: T1555
  mbc: B0028

traits:
  - id: sui-wallet-keystore-path-ref
    desc: References Sui wallet keystore paths
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: '\.suiz|sui\.keystore|sui_config\.yaml'

composite_rules:
  - id: sourceless-pyc-wallet-keystore
    desc: Sourceless pyc references a wallet keystore
    crit: hostile
    conf: 0.96
    attack: T1027,T1555
    for: [python, python-sdist, whl, zip, pyc]
    scope: archive
    all:
      - id: micro-behaviors/os/api-resolution/dynamic::python-sourceless-file-loader
      - id: sui-wallet-keystore-path-ref

  # The generic sourceless-pyc loader composite used to live here. Its legs
  # carry no wallet content, so it now lives with the hidden-payload
  # techniques it detects:
  # objectives/supply-chain/hidden-payload/runtime::import-sourceless-pyc-loader.
