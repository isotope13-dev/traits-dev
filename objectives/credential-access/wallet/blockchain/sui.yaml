# Sui blockchain wallet credential paths.
defaults:
  platforms: [unix, windows]
  for: [python, python_bytecode, pyc, shell]
  attack: T1555
  mbc: B0028

traits:
  - id: sui-wallet-keystore-path-ref
    desc: References Sui wallet keystore paths
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: '\.suiz|sui\.keystore|sui_config\.yaml'

composite_rules:
  - id: sourceless-pyc-wallet-keystore
    desc: Sourceless pyc references a wallet keystore
    crit: hostile
    conf: 0.96
    attack: T1027,T1555
    for: [python, python-sdist, whl, zip, pyc]
    scope: archive
    all:
      - id: micro-behaviors/os/api-resolution/dynamic::python-sourceless-file-loader
      - id: sui-wallet-keystore-path-ref

  - id: import-sourceless-pyc-loader
    desc: Import runs a co-shipped sourceless pyc
    crit: hostile
    conf: 0.95
    attack: T1027,T1059.006
    for: [python, python-sdist, whl, zip]
    scope: archive
    all:
      - id: micro-behaviors/os/api-resolution/dynamic::python-sourceless-file-loader
      - id: micro-behaviors/data/control-flow/error-handling::silent-exception-pass
