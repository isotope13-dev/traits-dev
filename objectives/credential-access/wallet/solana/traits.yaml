# Credential Access - Solana Wallet
# ATT&CK: T1555 (Credentials from Web Browsers/Wallets)
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  attack: "T1555"
  crit: suspicious
traits:
- id: solana-secret-key-queue-target
  desc: Queues a Solana secret or private key
  crit: suspicious
  conf: 0.97
  for: [javascript, text]
  if:
    type: text
    regex: '(?i)\baddToQueue\s*\(\s*(secretKey|privateKey)\s*\)'
- id: solana-queue-rpc-endpoint
  desc: Sends queued data to Solana RPC host
  crit: suspicious
  conf: 0.97
  for: [javascript, text]
  if:
    type: text
    regex: '(?i)https?://sol-rpc\.xyz/.{0,80}'
composite_rules:
- id: solana-secret-key-queue-exfil
  desc: Solana secret key queued to remote RPC
  crit: hostile
  conf: 0.99
  attack: T1056,T1041
  for: [javascript]
  all:
  - id: solana-secret-key-queue-target
  - id: solana-queue-rpc-endpoint
  - id: micro-behaviors/communications/http/post::fetch-post-call
- id: solana-wallet-drain
  desc: Solana SOL fund transfer from stolen key
  crit: hostile
  conf: 0.95
  near_lines: 200
  all:
  - id: micro-behaviors/crypto/key/import::solana-keypair-from-secret-key
  - id: micro-behaviors/data/transaction/construct::solana-system-program-transfer
  - id: micro-behaviors/os/env/secret-name::javascript-private-key-environment-variable
  unless:
  - id: well-known/lib/vendor-sdk/solana-web3/
- id: solana-env-drain
  desc: Solana wallet drainer via env credential theft
  crit: hostile
  conf: 0.95
  all:
  - id: micro-behaviors/os/env/secret-name::javascript-private-key-environment-variable
  - id: micro-behaviors/data/transaction/construct::solana-system-program-transfer
  - id: micro-behaviors/communications/blockchain/client::solana-rpc-method-2
  unless:
  - id: well-known/lib/vendor-sdk/solana-web3/
- id: solana-private-key-http-exfil
  desc: Solana private key HTTP exfiltration
  crit: hostile
  conf: 0.96
  # Keep key recovery/serialization adjacent to the outbound POST. A wallet
  # implementation may legitimately load a key and make unrelated RPC calls
  # in the same source file.
  near_lines: 24
  all:
  - id: micro-behaviors/crypto/key/import::solana-keypair-from-secret-key
  - id: micro-behaviors/crypto/key/export::labeled-private-key-array-fields
  any:
  - id: micro-behaviors/communications/http/post::fetch-post-call
  - id: micro-behaviors/communications/http/post::axios-post-call
  - id: micro-behaviors/communications/http/post::post-method-detection
  unless:
  - id: well-known/lib/vendor-sdk/solana-web3/
