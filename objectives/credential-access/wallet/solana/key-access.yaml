defaults:
  platforms:
    - unix
    - windows
  for: [scripts, binaries]

composite_rules:
  - id: solana-key-access
    desc: Solana wallet secret-material operation
    conf: 0.8
    crit: notable
    any:
      - id: micro-behaviors/crypto/asymmetric/key::solana-keypair-from-secret-key
      - id: micro-behaviors/crypto/mnemonic::bip39-mnemonic-validation
      - id: micro-behaviors/data/decode/base58::bs58-decode
