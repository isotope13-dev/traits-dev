defaults:
  platforms: [windows, unix]
  for: [scripts, binaries]
  crit: notable
  conf: 0.8
  attack: T1552.001

traits:
# solana-config-path relocated to
# micro-behaviors/fs/path/wallet::solana-cli-default-keypair-path. Its matcher only
# detected the Solana CLI's documented default keypair location, which every
# Solana SDK, tutorial and node operator's runbook names; a bare path token is a
# filesystem reference, not wallet collection, and nothing here referenced it.
- id: solana-config-b64
  desc: Base64 encoded Solana config path
  crit: suspicious
  if:
    type: text
    substr: Ly5jb25maWcvc29sYW5hL2lkLmpzb24

composite_rules:
- id: solana-stealer
  desc: Solana wallet stealer
  crit: hostile
  conf: 0.95
  all:
  - id: solana-config-b64
  any:
  - id: micro-behaviors/fs/write/file/full::js-file-write
  - id: micro-behaviors/fs/file/copy::fs-copy
  - id: metadata/lang/javascript-features::js-comma-sequence-count-5
