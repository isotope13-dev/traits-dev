defaults:
  platforms: [unix, windows]
  for: [python]
  attack: T1552
traits:
  - id: signed-transaction-field
    desc: Signed crypto transaction field
    crit: notable
    conf: 0.92
    if:
      type: text
      regex: 'signedTransaction(Hex|B64)'
  - id: private-key-base58-name
    desc: Base58 private key field name
    crit: notable
    conf: 0.9
    if:
      type: text
      substr: PRIVATE_KEY_BASE58
  - id: keyring-get-password
    desc: Python keyring password retrieval
    crit: notable
    conf: 0.9
    if:
      type: text
      substr: keyring.get_password
  - id: keyring-set-password
    desc: Python keyring password storage
    crit: notable
    conf: 0.9
    if:
      type: text
      substr: keyring.set_password
  - id: mcp-signed-transaction-tool
    desc: MCP signed transaction tool
    crit: notable
    conf: 0.9
    if:
      type: text
      substr: FunctionTool(get_signed_transaction)
  - id: wallet-server-name
    desc: Wallet server name
    crit: notable
    conf: 0.85
    if:
      type: text
      regex: 'Server\s*\(["''][^"'']{0,80}wallet'
  - id: python-long-token-character-run
    desc: Regex for a long token character run
    crit: notable
    conf: 0.9
    if:
      type: string_literal
      regex: '\\w\{([3-9][0-9]|[1-9][0-9]{2})\}'
composite_rules:
  - id: wallet-private-key-keyring
    desc: Wallet private key stored in keyring
    crit: suspicious
    conf: 0.95
    all:
      - id: private-key-base58-name
    any:
      - id: keyring-get-password
      - id: keyring-set-password
  - id: mcp-wallet-tool-server
    desc: MCP wallet signing tool server
    crit: suspicious
    conf: 0.95
    all:
      - id: mcp-signed-transaction-tool
      - id: wallet-server-name
  - id: mcp-wallet-transaction-signer
    desc: MCP server exposes wallet transaction signing
    crit: suspicious
    conf: 0.97
    all:
      - id: signed-transaction-field
      - id: mcp-wallet-tool-server
  - id: mcp-wallet-private-key-signer
    desc: MCP wallet signer uses stored private key
    crit: suspicious
    conf: 0.98
    all:
      - id: wallet-private-key-keyring
      - id: mcp-wallet-transaction-signer

  - id: python-web3-key-http-exfil
    desc: Posts a Web3 private key over HTTP
    crit: hostile
    conf: 0.97
    attack: T1552.001,T1041
    all:
      - id: micro-behaviors/crypto/library/blockchain/client::python-account-from-key
      - id: micro-behaviors/communications/http/lib/requests::requests-post
      - id: micro-behaviors/data/encode/base64::b64encode-call

  - id: python-solana-key-http-exfil
    desc: Posts a Solana secret over HTTP
    crit: hostile
    conf: 0.97
    attack: T1552.001,T1041
    all:
      - id: micro-behaviors/crypto/library/blockchain/client::python-keypair-from-base58
      - id: micro-behaviors/communications/http/lib/requests::requests-post
      - id: micro-behaviors/data/encode/base64::b64encode-call
