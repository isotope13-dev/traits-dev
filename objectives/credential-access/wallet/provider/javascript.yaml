# NOTE on matcher type: these were written as `string_literal`, which reads
# only the parser's extracted string constants. A wallet drainer injected into
# a multi-megabyte minified bundle -- the lottie-player 2024 compromise, 3.2 MB
# -- is exactly the case where that index comes back without them, so every
# rule in this file went silent on the artifacts it exists to catch. The RPC
# method names and ERC-20 selectors below are unambiguous tokens that never
# occur in ordinary prose, so `text` costs no precision and sees the whole file.
defaults:
  platforms: [windows, unix]
  for:
    - javascript
    - html
  attack: T1555.003
  crit: suspicious
traits:
  - id: function-drain
    desc: Wallet draining function name marker
    crit: suspicious
    conf: 0.7
    if:
      type: string_literal
      regex: 'function\s+drain(Wallet|Account|Funds|Tokens)'
    unless:
      - id: "metadata/lang/source/syntax::yara-rule-source"
  - id: function-steal
    desc: Wallet-specific steal routine name
    crit: suspicious
    conf: 0.8
    if:
      type: string_literal
      regex: 'function\s+steal(Wallet|Account|Funds|Tokens?)\w*\s*\('
    unless:
      - id: "metadata/lang/source/syntax::yara-rule-source"
  - id: function-grab
    desc: Wallet-specific grab routine name
    crit: suspicious
    conf: 0.7
    if:
      type: string_literal
      regex: 'function\s+grab(Wallet|Account|Funds|Tokens?)\w*\s*\('
    unless:
      - id: "metadata/lang/source/syntax::yara-rule-source"
  - id: function-hijack
    desc: Wallet-related hijack function definition
    crit: suspicious
    conf: 0.8
    if:
      type: string_literal
      regex: 'function\s+hijack(Wallet|Account|Eth|Token)\w*\s*\('
    unless:
      - id: "metadata/lang/source/syntax::yara-rule-source"
  # These match declared or called routine names (type: function), not string
  # constants: drainer kits invoke runmask/newdlocal/checkethereumw as
  # identifiers, which a string-literal matcher never sees.
  - id: runmask-function
    desc: runmask drainer-kit routine name
    crit: suspicious
    conf: 0.8
    if:
      type: function
      substr: runmask
    unless:
      - id: "metadata/lang/source/syntax::yara-rule-source"
  - id: newdlocal-function
    desc: newdlocal drainer-kit routine name
    crit: suspicious
    conf: 0.8
    if:
      type: function
      substr: newdlocal
    unless:
      - id: "metadata/lang/source/syntax::yara-rule-source"
  - id: checkethereumw-function
    desc: checkethereumw drainer-kit probe name
    crit: suspicious
    conf: 0.8
    if:
      type: function
      substr: checkethereumw
    unless:
      - id: "metadata/lang/source/syntax::yara-rule-source"
  - id: max-uint256-approval
    desc: MAX_UINT256 constant for unlimited approval
    conf: 0.8
    crit: suspicious
    if:
      type: string_literal
      substr: MAX_UINT256
    unless:
    - id: well-known/lib/development/vscode-webview::acquire-vscode-api
    - id: metadata/build/
    - id: "metadata/file/naming::test-directory-component"
  # `setApprovalForAll` itself moved to
  # micro-behaviors/data/transaction/authorize/ : the blanket-approval call is
  # a neutral ERC-721/1155 protocol verb (every marketplace and wrapper
  # performs it -- the official ENS deploy tasks approve their own NameWrapper,
  # for one), so its invocation is notable capability evidence, not a
  # credential-access claim. Drainer weight comes from converging it with a
  # second independent indicator below.
  - id: xsdk-main-bootstrap
    desc: XSDK bootstrap entrypoint call
    crit: suspicious
    conf: 0.9
    if:
      type: text
      substr: window?.XSDK?.main
  - id: xsdk-assignment
    desc: Encoded XSDK bootstrap payload
    crit: suspicious
    conf: 0.94
    if:
      type: text
      substr: window.XSDK = "
  - id: jsdelivr-jh5o-loader
    desc: jsDelivr jh5o drainer loader
    crit: suspicious
    conf: 0.98
    if:
      type: text
      substr: cdn.jsdelivr.net/npm/jh5o@
  - id: xsdk-wallet-connect-fragment
    desc: XSDK Wallet Connect config fragment
    crit: suspicious
    conf: 0.95
    if:
      type: text
      substr: Im5hbWUiOiJXYWxsZXQgQ29ubmVj
  - id: xsdk-solana-program-fragment
    desc: XSDK Solana program config fragment
    crit: suspicious
    conf: 0.98
    if:
      type: text
      substr: InByb2dyYW0iOiJUb2tlbnpRZEJOYkxxUDVWRWhka0FTNkVQ
composite_rules:
  - id: drainer-function-names
    desc: Suspicious wallet drainer function names
    conf: 0.9
    crit: suspicious
    any:
      - id: function-drain
      - id: function-steal
      - id: function-grab
      - id: function-hijack
      - id: runmask-function
      - id: newdlocal-function
      - id: checkethereumw-function
    unless:
      - id: "metadata/lang/source/syntax::yara-rule-source"
  - id: drainer-action-functions
    desc: Drainer action function patterns
    conf: 0.85
    crit: suspicious
    any:
      - id: function-drain
      - id: function-steal
      - id: function-grab
  # One indicator is not a drainer signal: a blanket approval call or a
  # max-uint constant appears in every marketplace SDK and contract-admin
  # script. Require two independent indicators to converge.
  - id: drainer-indicator
    desc: Converging wallet drainer indicators
    conf: 0.85
    any:
      - id: drainer-function-names
      - id: max-uint256-approval
      - id: micro-behaviors/data/transaction/authorize::erc721-blanket-approval
    needs: 2
  - id: xsdk-bootstrap-signal
    desc: XSDK bootstrap call or wallet-connect config
    crit: notable
    conf: 0.9
    any:
      - id: xsdk-main-bootstrap
      - id: xsdk-wallet-connect-fragment
  - id: wallet-connect-bootstrap
    desc: External XSDK wallet-connect bootstrap
    crit: suspicious
    conf: 0.96
    all:
      - id: xsdk-assignment
      - id: xsdk-bootstrap-signal
    any:
      - id: jsdelivr-jh5o-loader
      - id: micro-behaviors/communications/http/url/cdn::jsdelivr-npm-script-url
  - id: solana-wallet-drainer-config
    desc: Encoded Solana wallet drainer config
    crit: hostile
    conf: 0.995
    mbc: B0028
    all:
      - id: wallet-connect-bootstrap
      - id: xsdk-wallet-connect-fragment
      - id: xsdk-solana-program-fragment
  - id: wallet-drainer
    desc: Cryptocurrency wallet drainer (provider access and transaction method)
    crit: hostile
    conf: 0.95
    mbc: B0028
    all:
      - id: micro-behaviors/communications/blockchain/client::ethereum-provider-or-request
      - id: drainer-indicator
    any:
      - id: micro-behaviors/communications/rpc::wallet-provider-send-method
      - id: micro-behaviors/data/transaction/authorize::erc20-approve
      - id: micro-behaviors/data/transaction/construct::erc20-transfer
      - id: micro-behaviors/data/transaction/construct::erc20-transferFrom
      - id: micro-behaviors/data/transaction/authorize::erc721-blanket-approval

  # A hooked response rewrite fronted by known drainer-kit routines.
  #
  # Either leg alone leaves room: kit routine names can surface in detection
  # rules and scanner signatures (see the yara-rule-source guards above),
  # while the hooked rewrite is judged on its own in hijack-transfer/. The
  # combination is the kit-shaped drainer: the response hook from the
  # Qix/chalk playbook with runmask/newdlocal-style routines behind it,
  # rather than an anonymous clipper.
  - id: drainer-kit-hooked-response-rewrite
    desc: Drainer-kit routines with hooked response rewrite
    crit: hostile
    conf: 0.96
    mbc: B0028
    for: [javascript, typescript]
    scope: file
    all:
      - id: drainer-function-names
      - id: objectives/impact/crypto-manipulation/hijack-transfer::hooked-response-address-rewrite

  # An obfuscated controller riding along with a wallet SDK.
  #
  # A dApp bundles wagmi/viem/WalletConnect and performs the full signing flow;
  # that is the neutral provider RPC flow. What no honest bundle carries is a
  # *custom string-table
  # obfuscator* wrapped around that SDK, with every string in the injected
  # portion unreadable. The trojanized @lottiefiles/lottie-player builds
  # (2024) were a wagmi+viem bundle plus ~99KB of obfuscated drain logic
  # appended past the library code.
  #
  # Neither leg alone convicts: obfuscated bundles exist, and wallet flows
  # exist. Together they describe code that talks to a user's wallet and hides
  # what it says.
  - id: obfuscated-wallet-signing-bundle
    for: [javascript]
    desc: Obfuscated bundle drives a wallet signing flow
    crit: hostile
    conf: 0.95
    attack: T1027,T1657
    all:
      - id: micro-behaviors/communications/rpc::wallet-provider-full-signing-flow
      - id: objectives/anti-static/obfuscation/obfuscator/index-shift::custom-string-table-obfuscator
