defaults:
  platforms:
    - windows
    - unix
  for:
    - javascript
    - html
  attack: T1555.003
  crit: suspicious
traits:
  - id: function-drain
    desc: Wallet draining function name marker
    crit: suspicious
    conf: 0.7
    if:
      type: string_literal
      regex: function\s+drain(Wallet|Account|Funds|Tokens)
    unless:
      - id: metadata/lang/source/shape::yara-rule-source
  - id: function-steal
    desc: Wallet-specific steal routine name
    crit: suspicious
    conf: 0.8
    if:
      type: string_literal
      regex: function\s+steal(Wallet|Account|Funds|Tokens?)\w*\s*\(
    unless:
      - id: metadata/lang/source/shape::yara-rule-source
  - id: function-grab
    desc: Wallet-specific grab routine name
    crit: suspicious
    conf: 0.7
    if:
      type: string_literal
      regex: function\s+grab(Wallet|Account|Funds|Tokens?)\w*\s*\(
    unless:
      - id: metadata/lang/source/shape::yara-rule-source
  - id: function-hijack
    desc: Wallet-related hijack function definition
    crit: suspicious
    conf: 0.8
    if:
      type: string_literal
      regex: function\s+hijack(Wallet|Account|Eth|Token)\w*\s*\(
    unless:
      - id: metadata/lang/source/shape::yara-rule-source
  - id: runmask-function
    desc: runmask drainer-kit routine name
    crit: suspicious
    conf: 0.8
    if:
      type: function
      substr: runmask
    unless:
      - id: metadata/lang/source/shape::yara-rule-source
  - id: newdlocal-function
    desc: newdlocal drainer-kit routine name
    crit: suspicious
    conf: 0.8
    if:
      type: function
      substr: newdlocal
    unless:
      - id: metadata/lang/source/shape::yara-rule-source
  - id: checkethereumw-function
    desc: checkethereumw drainer-kit probe name
    crit: suspicious
    conf: 0.8
    if:
      type: function
      substr: checkethereumw
    unless:
      - id: metadata/lang/source/shape::yara-rule-source
  - id: stealth-proxy-control-surface
    desc: stealthProxyControl drainer control surface
    crit: suspicious
    conf: 0.85
    if:
      type: text
      regex: stealthProxyControl|["'`]stealthPro["'`]
    unless:
      - id: metadata/lang/source/shape::yara-rule-source
  - id: xsdk-main-bootstrap
    desc: XSDK bootstrap entrypoint call
    crit: suspicious
    conf: 0.9
    if:
      type: text
      substr: window?.XSDK?.main
  - id: xsdk-assignment
    desc: Encoded XSDK bootstrap payload
    crit: suspicious
    conf: 0.94
    if:
      type: text
      substr: window.XSDK = "
  - id: jsdelivr-jh5o-loader
    desc: jsDelivr jh5o drainer loader
    crit: suspicious
    conf: 0.98
    if:
      type: text
      substr: cdn.jsdelivr.net/npm/jh5o@
  - id: xsdk-wallet-connect-fragment
    desc: XSDK Wallet Connect config fragment
    crit: suspicious
    conf: 0.95
    if:
      type: text
      substr: Im5hbWUiOiJXYWxsZXQgQ29ubmVj
  - id: xsdk-solana-program-fragment
    desc: XSDK Solana program config fragment
    crit: suspicious
    conf: 0.98
    if:
      type: text
      substr: InByb2dyYW0iOiJUb2tlbnpRZEJOYkxxUDVWRWhka0FTNkVQ
composite_rules:
  - id: drainer-function-names
    desc: Suspicious wallet drainer function names
    conf: 0.9
    crit: suspicious
    any:
      - id: function-drain
      - id: function-steal
      - id: function-grab
      - id: function-hijack
      - id: runmask-function
      - id: newdlocal-function
      - id: checkethereumw-function
    unless:
      - id: metadata/lang/source/shape::yara-rule-source
  - id: drainer-action-functions
    desc: Drainer action function patterns
    conf: 0.85
    crit: suspicious
    any:
      - id: function-drain
      - id: function-steal
      - id: function-grab
  - id: xsdk-bootstrap-signal
    desc: XSDK bootstrap call or wallet-connect config
    crit: notable
    conf: 0.9
    any:
      - id: xsdk-main-bootstrap
      - id: xsdk-wallet-connect-fragment
  - id: wallet-connect-bootstrap
    desc: External XSDK wallet-connect bootstrap
    crit: suspicious
    conf: 0.96
    all:
      - id: xsdk-assignment
      - id: xsdk-bootstrap-signal
    any:
      - id: jsdelivr-jh5o-loader
      - id: well-known/app/infrastructure/content-delivery/jsdelivr::jsdelivr-npm-script-url
  - id: solana-wallet-drainer-config
    desc: Encoded Solana wallet drainer config
    crit: hostile
    conf: 0.995
    mbc: B0028
    all:
      - id: wallet-connect-bootstrap
      - id: xsdk-wallet-connect-fragment
      - id: xsdk-solana-program-fragment
