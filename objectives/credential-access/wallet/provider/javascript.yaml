# NOTE on matcher type: these were written as `string_literal`, which reads
# only the parser's extracted string constants. A wallet drainer injected into
# a multi-megabyte minified bundle -- the lottie-player 2024 compromise, 3.2 MB
# -- is exactly the case where that index comes back without them, so every
# rule in this file went silent on the artifacts it exists to catch. The RPC
# method names and ERC-20 selectors below are unambiguous tokens that never
# occur in ordinary prose, so `text` costs no precision and sees the whole file.
defaults:
  platforms: [windows, unix]
  for:
    - javascript
    - html
  attack: T1555.003
  crit: suspicious
traits:
  - id: window-dot-ethereum
    desc: window.ethereum access
    crit: notable
    conf: 0.6
    if:
      type: text
      substr: window.ethereum
    unless:
      - id: well-known/lib/web/nextjs::next-server-build-path
      - id: well-known/lib/cloud/supabase::auth-js-web3-module
  - id: window-bracket-ethereum
    desc: window["ethereum"] access
    crit: notable
    conf: 0.6
    if:
      type: text
      regex: window\[['"]ethereum['"]\]
  - id: ethereum-request-call
    desc: ethereum.request() call
    crit: notable
    conf: 0.6
    if:
      type: text
      regex: ethereum\.request\s*\(
  - id: request-bracket-call
    desc: '["request"]() call pattern'
    crit: notable
    conf: 0.5
    if:
      type: string_literal
      regex: \['"]request['"]\]\s*\(
  - id: eth-request-accounts-method
    desc: eth_requestAccounts method
    crit: notable
    conf: 0.6
    if:
      type: text
      substr: eth_requestAccounts
    unless:
      - id: well-known/lib/web/nextjs::next-server-build-path
      - id: well-known/lib/cloud/supabase::auth-js-web3-module
  - id: eth-accounts-method
    desc: eth_accounts method
    crit: notable
    conf: 0.5
    if:
      type: text
      substr: eth_accounts
  - id: erc20-approve
    desc: ERC-20 token approve function selector
    conf: 0.85
    crit: notable
    if:
      type: text
      substr: '0x095ea7b3'
  - id: erc20-transfer
    desc: ERC-20 token transfer function selector
    crit: notable
    conf: 0.8
    if:
      type: text
      substr: '0xa9059cbb'
    unless:
  - id: erc20-transferFrom
    desc: ERC-20 token transferFrom function selector
    conf: 0.85
    crit: notable
    if:
      type: text
      substr: '0x23b872dd'
  # The verbs a drain actually uses. `wallet-transaction-method` previously
  # knew only the ERC-20 call selectors, so a drainer that works entirely
  # through provider RPC -- ask for a signature, then submit the transfer --
  # satisfied none of its legs.
  - id: eth-send-transaction-method
    desc: eth_sendTransaction method
    crit: notable
    conf: 0.7
    if:
      type: text
      substr: eth_sendTransaction
  - id: eth-sign-typed-data-method
    desc: eth_signTypedData method
    crit: notable
    conf: 0.7
    if:
      type: text
      substr: eth_signTypedData
  - id: function-drain
    desc: Wallet draining function name marker
    crit: suspicious
    conf: 0.7
    if:
      type: string_literal
      regex: 'function\s+drain(Wallet|Account|Funds|Tokens)'
    unless:
      - id: metadata/lang/source::yara-rule-source
  - id: function-steal
    desc: Wallet-specific steal routine name
    crit: suspicious
    conf: 0.8
    if:
      type: string_literal
      regex: 'function\s+steal(Wallet|Account|Funds|Tokens?)\w*\s*\('
    unless:
      - id: metadata/lang/source::yara-rule-source
  - id: function-grab
    desc: Wallet-specific grab routine name
    crit: suspicious
    conf: 0.7
    if:
      type: string_literal
      regex: 'function\s+grab(Wallet|Account|Funds|Tokens?)\w*\s*\('
    unless:
      - id: metadata/lang/source::yara-rule-source
  - id: function-hijack
    desc: Wallet-related hijack function definition
    crit: suspicious
    conf: 0.8
    if:
      type: string_literal
      regex: 'function\s+hijack(Wallet|Account|Eth|Token)\w*\s*\('
    unless:
      - id: metadata/lang/source::yara-rule-source
  - id: runmask-function
    desc: runmask MetaMask drainer routine
    crit: suspicious
    conf: 0.8
    if:
      type: string_literal
      substr: runmask
    unless:
      - id: metadata/lang/source::yara-rule-source
  - id: newdlocal-function
    desc: newdlocal wallet drainer routine
    crit: suspicious
    conf: 0.8
    if:
      type: string_literal
      substr: newdlocal
    unless:
      - id: metadata/lang/source::yara-rule-source
  - id: checkethereumw-function
    desc: checkethereumw drainer probe routine
    crit: suspicious
    conf: 0.8
    if:
      type: string_literal
      substr: checkethereumw
    unless:
      - id: metadata/lang/source::yara-rule-source
  - id: max-uint256-approval
    desc: MAX_UINT256 constant for unlimited approval
    conf: 0.8
    crit: suspicious
    if:
      type: string_literal
      substr: MAX_UINT256
    unless:
    - id: metadata/library/structure::js-vite-rollup-vendor-chunk
    - id: metadata/library/runtime::acquire-vscode-api
    - id: metadata/library/structure/
  - id: set-approval-for-all
    desc: NFT setApprovalForAll method invocation
    conf: 0.85
    crit: notable
    if:
      type: text
      regex: '\.\s*setApprovalForAll\s*\('
    unless:
      - id: metadata/library/web3/
  - id: xsdk-main-bootstrap
    desc: XSDK bootstrap entrypoint call
    crit: suspicious
    conf: 0.9
    if:
      type: text
      substr: window?.XSDK?.main
  - id: xsdk-assignment
    desc: Encoded XSDK bootstrap payload
    crit: suspicious
    conf: 0.94
    if:
      type: text
      substr: window.XSDK = "
  - id: jsdelivr-jh5o-loader
    desc: jsDelivr jh5o drainer loader
    crit: suspicious
    conf: 0.98
    if:
      type: text
      substr: cdn.jsdelivr.net/npm/jh5o@
  - id: xsdk-wallet-connect-fragment
    desc: XSDK Wallet Connect config fragment
    crit: suspicious
    conf: 0.95
    if:
      type: text
      substr: Im5hbWUiOiJXYWxsZXQgQ29ubmVj
  - id: xsdk-solana-program-fragment
    desc: XSDK Solana program config fragment
    crit: suspicious
    conf: 0.98
    if:
      type: text
      substr: InByb2dyYW0iOiJUb2tlbnpRZEJOYkxxUDVWRWhka0FTNkVQ
composite_rules:
  - id: ethereum-provider
    desc: Web3 wallet provider access (window.ethereum)
    crit: notable
    conf: 0.75
    any:
      - id: window-dot-ethereum
      - id: window-bracket-ethereum
  - id: ethereum-request
    desc: Ethereum wallet request API
    crit: notable
    conf: 0.8
    any:
      - id: ethereum-request-call
      - id: request-bracket-call
  - id: ethereum-provider-or-request
    desc: Ethereum provider access or request
    crit: notable
    conf: 0.75
    any:
      - id: ethereum-provider
      - id: ethereum-request
  - id: eth-request-accounts
    desc: Request wallet accounts (eth_requestAccounts)
    crit: notable
    conf: 0.85
    any:
      - id: eth-request-accounts-method
      - id: eth-accounts-method
  - id: wallet-transaction-method
    desc: Wallet transaction methods
    crit: notable
    conf: 0.8
    any:
      - id: micro-behaviors/communications/ipc/rpc::wallet-provider-send-method
      - id: erc20-approve
      - id: erc20-transfer
      - id: erc20-transferFrom
      - id: set-approval-for-all
      - id: eth-send-transaction-method
  - id: drainer-function-names
    desc: Suspicious wallet drainer function names
    conf: 0.9
    crit: suspicious
    any:
      - id: function-drain
      - id: function-steal
      - id: function-grab
      - id: function-hijack
      - id: runmask-function
      - id: newdlocal-function
      - id: checkethereumw-function
    unless:
      - id: metadata/lang/source::yara-rule-source
  - id: drainer-action-functions
    desc: Drainer action function patterns
    conf: 0.85
    crit: suspicious
    any:
      - id: function-drain
      - id: function-steal
      - id: function-grab
  - id: drainer-indicator
    desc: Wallet drainer indicators
    conf: 0.85
    any:
      - id: drainer-function-names
      - id: max-uint256-approval
      - id: set-approval-for-all
    unless:
  - id: wallet-connect-bootstrap
    desc: External wallet drainer bootstrap
    crit: suspicious
    conf: 0.96
    all:
      - id: jsdelivr-jh5o-loader
      - id: xsdk-assignment
    any:
      - id: xsdk-main-bootstrap
      - id: xsdk-wallet-connect-fragment
  - id: solana-wallet-drainer-config
    desc: Encoded Solana wallet drainer config
    crit: hostile
    conf: 0.995
    mbc: B0028
    all:
      - id: wallet-connect-bootstrap
      - id: xsdk-wallet-connect-fragment
      - id: xsdk-solana-program-fragment
  - id: wallet-drainer
    desc: Cryptocurrency wallet drainer (provider access
    crit: hostile
    conf: 0.95
    mbc: B0028
    all:
      - id: ethereum-provider-or-request
      - id: wallet-transaction-method
      - id: drainer-indicator

  # Account discovery, an off-chain signature request, and a transaction
  # submission in one file is the complete wallet-drain interaction. A real
  # dapp front-end legitimately does all three, so this stays suspicious on its
  # own; `wallet-drainer` above adds the indicator that separates the two.
  - id: wallet-full-signing-flow
    desc: Full wallet sign-and-send interaction
    crit: suspicious
    conf: 0.85
    scope: file
    all:
      - id: eth-request-accounts
      - id: eth-send-transaction-method
    any:
      - id: micro-behaviors/communications/ipc/rpc::wallet-provider-personal-sign
      - id: eth-sign-typed-data-method


  # An obfuscated controller riding along with a wallet SDK.
  #
  # A dApp bundles wagmi/viem/WalletConnect and performs the full signing flow;
  # that is `wallet-full-signing-flow` above, and it stays suspicious for good
  # reason. What no honest bundle carries is a *custom string-table
  # obfuscator* wrapped around that SDK, with every string in the injected
  # portion unreadable. The trojanized @lottiefiles/lottie-player builds
  # (2024) were a wagmi+viem bundle plus ~99KB of obfuscated drain logic
  # appended past the library code.
  #
  # Neither leg alone convicts: obfuscated bundles exist, and wallet flows
  # exist. Together they describe code that talks to a user's wallet and hides
  # what it says.
  - id: obfuscated-wallet-signing-bundle
    desc: Obfuscated bundle drives a wallet signing flow
    crit: hostile
    conf: 0.95
    attack: T1027,T1657
    all:
      - id: wallet-full-signing-flow
      - id: objectives/anti-static/obfuscation/obfuscator/index-shift::custom-string-table-obfuscator
