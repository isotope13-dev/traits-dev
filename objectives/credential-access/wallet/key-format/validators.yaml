# Regexes that validate wallet private-key material shapes (ETH hex-64 and
# Base58 length windows used by Solana-style secrets). Alone these appear in
# legitimate wallet libraries; hostile intent comes from composites that pair
# them with obfuscation and paste-bin / dead-drop exfiltration.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  attack: "T1555"
  crit: notable

traits:
  - id: eth-hex64-private-key-regex
    desc: Ethereum 64-hex private-key validation regex
    conf: 0.9
    if:
      type: text
      substr: '0x[a-fA-F0-9]{64}'

  - id: base58-44to88-key-regex
    desc: Base58 wallet key length 44-88 validation regex
    conf: 0.9
    if:
      type: text
      substr: '[1-9A-HJ-NP-Za-km-z]{44,88}'

  - id: generic-wallet-secret-hex64-regex
    desc: Regex captures generic wallet secret names
    crit: suspicious
    conf: 0.96
    if:
      type: text
      substr: '(PRIVATE_KEY|SECRET|MNEMONIC)[=:]\s*([a-fA-F0-9]{64})'

composite_rules:
  - id: dual-wallet-private-key-validators
    desc: Validates both hex-64 and Base58 private-key formats
    crit: suspicious
    conf: 0.93
    near_bytes: 400
    all:
      - id: eth-hex64-private-key-regex
      - id: base58-44to88-key-regex

  - id: obfuscated-dual-key-format-paste-exfil
    desc: Obfuscated dual private-key validators with paste-bin exfil
    crit: hostile
    conf: 0.97
    attack: T1555,T1041,T1102.001
    mbc: B0028
    all:
      - id: dual-wallet-private-key-validators
      - id: objectives/command-and-control/infrastructure/paste::jsonbin
      - id: objectives/anti-static/obfuscation/obfuscator/js-obfuscator::jsjiami-hex-obfuscation
