defaults:
  platforms: [windows, unix]
  for: [python, javascript, php, html]
  attack: T1005
  mbc: B0030
traits:
- id: autofill-db
  desc: Chromium autofill table query
  crit: suspicious
  conf: 0.85
  for: [python, pyc, javascript, typescript]
  if:
    type: literal
    kind: string
    regex: '(?is)\b(from|join)\s+autofill(_profiles?)?\b'
  unless:
    - id: well-known/tool/reverse-engineering/aleapp::aleapp-source-tree
    - id: well-known/app/system/anthropic-cybersecurity-skills::defensive-cybersecurity-skills-repository
    - id: well-known/app/communication/thunderbird::firefox-chrome-profile-migrator-module
    - id: well-known/app/communication/thunderbird::firefox-chrome-migration-utils-module
- id: storybook-story-file
  desc: Storybook story file
  crit: baseline
  conf: 0.9
  if:
    type: path
    basename: true
    regex: '(?i)\.stories\.[jt]sx?$'
- id: fake-stripe-checkout-demo
  desc: Fake Stripe Checkout demo text
  crit: baseline
  conf: 0.9
  if:
    type: text
    substr: "Fake Stripe Checkout"
composite_rules:
- id: mastercard-billing-marker
  desc: Mastercard detection in billing marker
  crit: component
  conf: 0.82
  any:
  # `mastercard-bin--rx-5` was removed from here and from the trait list: it
  # matched the bare phrase "card type" anywhere within 40 bytes of either
  # ordering, which is a UI label, not a payment-card fact. It reported
  # credential-access/financial at notable on a React component library's Card
  # props, a data framework's monorepo and a CRM's message-card renderer. What
  # remains genuinely names a payment card.
  - id: objectives/credential-access/financial/credit-card/card-number::mastercard-bin--rx-1
  - id: objectives/credential-access/financial/credit-card/card-number::mastercard-bin--rx-2
- id: card-validation
  desc: Credit card validation logic
  crit: notable
  conf: 0.9
  any:
  - id: objectives/credential-access/financial/credit-card/validation::luhn-algorithm
  - id: objectives/credential-access/financial/credit-card/validation::mod10-regex-combo
- id: credit-card-stealer
  desc: Credit card data stealer
  crit: hostile
  conf: 0.95
  all:
  # Card-brand routing and a CVC/CVV label are normal payment-form logic.
  # Require a card-field capture path plus an outbound request before calling
  # the behavior theft.
  - id: objectives/credential-access/financial/credit-card/form-capture::credit-card-form-capture
  - id: micro-behaviors/communications/http/request/client::js-fetch-call
  unless:
  - id: metadata/package/testing/presence/scripted::faker-word
  - id: well-known/app/system/amplify-backend/
