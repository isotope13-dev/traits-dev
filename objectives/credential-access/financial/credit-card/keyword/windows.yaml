# Credit card phishing-form detection in PE binaries. The first group is
# resource-dialog specific; the legacy banking-trojan prompts below may be
# runtime-decoded from an ordinary data section.
# ATT&CK: T1056.002 (GUI Input Capture)
defaults:
  for: [pe]
  platforms: [windows]
  attack: T1056.002
traits:
  - id: pe-payment-info-dialog
    desc: Payment information dialog string
    crit: suspicious
    conf: 0.88
    if:
      type: text
      substr: "Payment Information"
      section: rsrc
    not:
      - substr: "Royalty Payment Information"
  - id: pe-credit-card-info-dialog
    desc: Credit card information dialog string
    crit: suspicious
    conf: 0.88
    if:
      type: text
      substr: "Credit Card Information"
      section: rsrc
  - id: pe-atm-pin-prompt
    desc: ATM PIN phishing prompt
    crit: suspicious
    conf: 0.95
    if:
      type: text
      exact: "Please, enter your ATM PIN"
  - id: pe-cvv2-prompt
    desc: CVV2 phishing prompt
    crit: suspicious
    conf: 0.95
    if:
      type: text
      exact: "Please, enter your CVV2 (3-digit code on back of card)"
  - id: pe-card-number-prompt
    desc: Card number phishing prompt
    crit: suspicious
    conf: 0.94
    if:
      type: text
      exact: "Please, enter your Card Number"
  - id: pe-auth-failed-banking-lure
    desc: Authorization failure banking lure
    crit: suspicious
    conf: 0.9
    if:
      type: text
      exact: "Unable to authorize. ATM PIN-Code is required to complete the transaction."
composite_rules:
  - id: pe-payment-phishing-form
    desc: Payment phishing form in PE resources
    crit: hostile
    conf: 0.93
    all:
      - id: pe-payment-info-dialog
    any:
      - id: pe-credit-card-info-dialog
      - id: objectives/credential-access/financial/credit-card/form-field::pe-card-number-field
      - id: objectives/credential-access/financial/credit-card/form-field::pe-payment-account-field
  - id: pe-card-verification-phish
    desc: Card-verification phishing prompt set
    crit: hostile
    conf: 0.98
    all:
      - id: pe-atm-pin-prompt
      - id: pe-cvv2-prompt
      - id: pe-card-number-prompt
    any:
      - id: objectives/credential-access/financial/credit-card/card-number::pe-card-brand-choice
      - id: pe-auth-failed-banking-lure
