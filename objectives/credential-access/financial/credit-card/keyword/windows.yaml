# Credit card phishing-form detection in PE binaries. The first group is
# resource-dialog specific; the authorization lure is restricted to mapped
# image sections so a carved launcher cannot inherit parent overlay text.
# ATT&CK: T1056.002 (GUI Input Capture)
defaults:
  for: [pe]
  platforms: [windows]
  attack: T1056.002
traits:
  - id: pe-payment-info-dialog
    desc: Payment information dialog string
    crit: suspicious
    conf: 0.88
    if:
      type: text
      substr: "Payment Information"
      section: rsrc
    not:
      - substr: "Royalty Payment Information"
  - id: pe-credit-card-info-dialog
    desc: Credit card information dialog string
    crit: suspicious
    conf: 0.88
    if:
      type: text
      substr: "Credit Card Information"
      section: rsrc
  - id: pe-auth-failed-banking-lure
    desc: Authorization failure banking lure
    crit: suspicious
    conf: 0.9
    if:
      type: text
      exact: "Unable to authorize. ATM PIN-Code is required to complete the transaction."
      section: any
composite_rules:
  - id: pe-payment-phishing-form
    desc: Payment phishing form in PE resources
    crit: hostile
    conf: 0.93
    all:
      - id: pe-payment-info-dialog
    any:
      - id: pe-credit-card-info-dialog
      - id: objectives/credential-access/financial/credit-card/form-field::pe-card-number-field
      - id: objectives/credential-access/financial/credit-card/form-field::pe-payment-account-field
  - id: pe-card-verification-phish
    desc: Card-verification phishing prompt set
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/ui/dialog/prompt::pe-atm-pin-prompt
      - id: micro-behaviors/ui/dialog/prompt::pe-cvv2-prompt
      - id: micro-behaviors/ui/dialog/prompt::pe-card-number-prompt
      - id: pe-auth-failed-banking-lure
    any:
      - id: micro-behaviors/ui/dialog/prompt::pe-card-brand-choice
