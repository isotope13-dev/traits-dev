# Card data lifted out of a rendered page rather than typed into a form.
#
# The sibling rules here model phishing surfaces — dialogs and forms that ask a
# victim for a PAN, CVV or PIN. This file covers the other direction: code that
# reads the *masked* card a site already displays on an order, account or
# receipt page. The last four digits plus the brand are not a usable card
# number, which is why the store shows them, but they are exactly what an
# order-history scraper collects alongside the buyer's name and address, and
# what account-recovery and callback fraud run on.
#
# Parsing the display form is the discriminator. A page that merely renders
# "Visa ending in 1234" matches nothing here; these fire on source that carries
# a pattern for pulling the digits back out, which is a scraper's job and not a
# storefront's.
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript, html, python]
  crit: notable
  conf: 0.9
  attack: T1005

traits:
  - id: masked-card-ending-in-pattern
    desc: Pattern extracts card ending-in digits
    if:
      type: text
      regex: '(?i)ending\s+in[^\n]{0,16}\\d\{4\}'

  # The glyph form of the same display: `•••• 1234`, `**** 1234`, `···· 1234`.
  # Requires the digit-capturing construct for the same reason as above.
  - id: masked-card-bullet-digits-pattern
    desc: Pattern extracts bullet-masked card digits
    if:
      type: text
      regex: '[•*·][^\n]{0,8}\{2,\}[^\n]{0,20}\\d\{4\}'
