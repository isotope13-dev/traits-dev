# Bulk card-list validation against a remote checking API with live-hit
# persistence, live-card stealth checkout at randomized merchants, and
# threaded proxy-rotated POST checks of pipe-delimited records have no
# authorized payment-testing equivalent: test harnesses use gateway
# sandboxes with test PANs, not bulk pipe-delimited records with CVVs,
# live/dead sorting, hit files, proxy rotation, and automation-evasion.
# The composites below are carding-fraud convictions, not review signals.
defaults:
  platforms: [windows, unix]
  for: [python]
  conf: 0.95

composite_rules:
  - id: objectives/credential-access/financial/credit-card::bulk-card-api-live-hit-storage
    desc: Card-list POST checks accompany live-result writes
    crit: hostile
    all:
      - id: micro-behaviors/ui/dialog/prompt::card-list-label
      - id: micro-behaviors/communications/http/post::requests-post
      - id: micro-behaviors/process/work/pool::parallel-thread-executor
      - id: micro-behaviors/data/control-flow/branch::live-status-write-branch
      - id: micro-behaviors/data/parse/payment::pipe-card-record-format

  - id: objectives/credential-access/financial/credit-card::live-card-random-merchant-stealth-checkout
    desc: Card probing accompanies randomized stealth checkout
    crit: hostile
    all:
      - id: objectives/credential-access/financial/credit-card::bulk-card-api-live-hit-storage
      - id: objectives/evasion/security-bypass/anti-bot/fingerprint-spoof::navigator-webdriver-override
      - id: micro-behaviors/data/parse/payment::cvv-cvc-name-reference
      - id: micro-behaviors/ui/controls/widget::python-browser-label-lookup
      - id: micro-behaviors/ui/controls/button::pay-now-button-selector
      - id: micro-behaviors/data/collection/map::random-choice-domain-field-pair

  # Threaded bulk checking with proxy rotation: the card list is fanned out
  # over a worker pool, each check POSTs a full pipe-delimited record, and
  # egress proxies rotate by pool index to spread the validation traffic
  # across source addresses. Each role (transfer, record shape, bulk
  # concurrency, rotation) is required separately; a threaded POST client
  # without card records and rotation is not a checker.
  # Worked example: saeka 15.0 saeka/chk.py (ThreadPoolExecutor over card
  # list, api_check POSTs each record, pool.next() proxy rotation).
  - id: objectives/credential-access/financial/credit-card::threaded-proxy-rotated-card-record-post-checks
    desc: Threaded card-record POST checks rotate egress proxies
    crit: hostile
    all:
      - id: micro-behaviors/communications/http/post::requests-post
      - id: micro-behaviors/data/parse/payment::pipe-card-record-format
      - id: micro-behaviors/process/work/pool::parallel-thread-executor
      - id: micro-behaviors/communications/http/proxy::proxy-pool-rotation
