defaults:
  conf: 0.8
  platforms: [windows, unix]
  for: [python, javascript, php, html]
  attack: T1005
  mbc: B0030
traits:
- id: credit-card-form-capture--rx-7
  desc: "Matches 'php://input'"
  crit: notable
  conf: 0.8
  if:
    type: text
    regex: (?is)\b(cvv|cvc)\b.{0,500}(\bfetch\s*\(|\bXMLHttpRequest\b)
- id: credit-card-form-capture--rx-8
  desc: "Matches 'http.post'"
  crit: notable
  conf: 0.8
  if:
    type: text
    regex: (?is)\b(card.?number|cc.?num)\b.{0,500}(\bfetch\s*\(|\bXMLHttpRequest\b)
- id: credit-card-form-capture--rx-9
  desc: "Matches 'http.post'"
  crit: notable
  conf: 0.8
  if:
    type: text
    regex: (?is)\b(card_exp|mm/yy)\b.{0,500}(\bfetch\s*\(|\bXMLHttpRequest\b)
# A bare `expiry`/`expiration` token is not a card field: token, licence and
# cache expiry are everywhere, and an API-key service that reads `expiration`
# near a fetch() was being called a card stealer. The capture legs below
# require the word to be card-qualified (`cardExpiry`, `card_expiration`);
# unqualified expiry components stay covered by the `expiry-field` traits.
- id: credit-card-form-capture--rx-10
  desc: "Matches 'http.post'"
  crit: notable
  conf: 0.8
  if:
    type: text
    regex: (?is)\bcard.{0,3}expir.{0,500}(\bfetch\s*\(|\bXMLHttpRequest\b)
- id: credit-card-form-capture--rx-11
  desc: "Matches 'http.post'"
  crit: notable
  conf: 0.8
  if:
    type: text
    regex: (?is)\b(cvv|cvc)\b.{0,500}(\bFormData\b|method\s*[:=]\s*['"]?POST)
