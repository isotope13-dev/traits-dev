defaults:
  platforms: [windows, unix]
  for: [javascript, typescript, html]
  attack: "T1539"

composite_rules:
# Collection is a separate objective from the transport rule in the
# exfiltration tree: a payment form is first turned into attacker-readable
# JSON, then may be sent by any HTTP client. Keeping the acquisition signal
# here lets future skimmers that change their transport remain detectable.
- id: browser-payment-form-capture
  for: [javascript]
  desc: Browser script serializes a payment form for collection
  crit: hostile
  conf: 0.90
  attack: T1056.002
  mbc: E1005
  all:
    - id: payment-form-serialize-array
    - id: micro-behaviors/data/serialize/json::json-stringify-identifier
    - id: micro-behaviors/communications/http/url/domain::js-remote-host-url
