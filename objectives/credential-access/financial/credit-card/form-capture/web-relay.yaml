# Card fields harvested from a rendered page and relayed to an absolute URL.
# A checkout page also pairs card inputs with a POST, but it submits to its
# own payment processor through its own form action; a scripted jQuery POST
# of the PAN and expiry to a hardcoded third-party URL is the skimmer's
# collection path, not a checkout's.
defaults:
  platforms: [unix, windows]
  for: [html]
  attack: T1056.001,T1041,T1566.002
composite_rules:
  - id: card-data-ajax-harvest-relay
    desc: Card fields relayed via jQuery ajax POST
    crit: hostile
    conf: 0.97
    all:
      - id: micro-behaviors/data/parse/payment::card-number-name-reference
      - id: micro-behaviors/data/parse/payment::card-expiry-mm-yy-input
      - id: micro-behaviors/communications/http/request/html::html-jquery-ajax-post-call
