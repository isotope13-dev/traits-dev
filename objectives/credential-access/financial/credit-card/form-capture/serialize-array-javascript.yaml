defaults:
  platforms: [linux, macos, windows, unix, android, ios]
  attack: "T1041"

traits:
  - id: payment-form-serialize-array
    desc: Serializes payment form fields
    crit: suspicious
    conf: 0.9
    platforms: [unix, windows]
    for: [javascript, typescript, html]
    if:
      type: text
      regex: '(?is)(payment|checkout|billing)[A-Za-z0-9_$-]{0,24}.{0,100}serializeArray\s*\('
