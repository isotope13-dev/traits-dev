defaults:
  platforms: [windows, unix]
  for: [python, javascript, php, html]
  attack: T1005
  mbc: B0030
traits:
- id: luhn-algorithm
  desc: Luhn algorithm implementation
  crit: notable
  conf: 0.85
  if:
    type: text
    word: luhn
    case_insensitive: false
  unless:
  - id: metadata/file/catalog/identity/
  - id: metadata/build/recognized-contexts::benign-trojanized-fp-context
- id: mod10-check
  desc: Modulo 10 check (Luhn)
  crit: component
  conf: 0.7
  if:
    type: text
    regex: (?i)\bmod[_\-\s]?10\b
- id: checksum-digit
  desc: Checksum digit validation
  crit: baseline
  conf: 0.6
  if:
    type: text
    regex: (?i)check.?sum.?digit
composite_rules:
- id: mod10-regex-combo
  desc: Mod10 check with card regex
  crit: notable
  all:
  - id: mod10-check
  - id: objectives/credential-access/financial/credit-card/card-number::cc-regex-16digit
