defaults:
  platforms:
  - windows
  - unix
  for:
  - python
  - javascript
  - php
  - html
  attack: T1005
  mbc: B0030
traits:
- id: cc-regex-16digit
  desc: 16-digit card regex near card field
  crit: notable
  conf: 0.85
  if:
    type: text
    regex: (?i)(card|pan)[^\n]{0,80}\[0-9\]\{16\}
  unless:
  - id: micro-behaviors/os/security/scan/signature::scanner-module-wording-context
  downgrade:
    any:
    - id: metadata/build/bundler/asset::js-large-module-bundle
    - id: metadata/package/testing/presence/scripted::faker-word
- id: visa-bin
  desc: Matches 'card.'
  crit: notable
  conf: 0.75
  if:
    type: text
    regex: (?i)(card|pan|number|bin)[^\n]{0,24}startsWith\s*\(\s*["']4["']\)
  unless:
  - type: text
    substr: profiler-kv-row
  - type: text
    regex: (?i)(statusCode|httpStatus)\w*\.startsWith\s*\(\s*["']4["']
composite_rules:
- id: visa-bin-card-payment-check
  desc: Visa prefix with card marker
  crit: suspicious
  conf: 0.7
  all:
  - id: objectives/credential-access/financial/credit-card::visa-bin
  - id: micro-behaviors/data/serialize/schema-payment::card-number-field-assignment
  near_lines: 100
- id: mastercard-bin
  for:
  - javascript
  desc: Mastercard BIN range (51-55, 2221-2720)
  crit: suspicious
  conf: 0.75
  all:
  - id: micro-behaviors/data/parse/payment::mastercard-card-number-context
  - id: micro-behaviors/data/string/search::numeric-prefix-22-27-or-51-55
  near_bytes: 512
  unless:
  - id: well-known/lib/ui/ckeditor/distribution/
  - id: well-known/lib/vendor-sdk/freemius
