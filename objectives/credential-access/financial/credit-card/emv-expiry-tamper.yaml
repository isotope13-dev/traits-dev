# The Zombie Card technique changes only the terminal-facing Application
# Expiration Date (tag 5F24) while relaying a real card's APDUs. Function-symbol
# matching keeps the rewrite capability out of comments and prose; the protocol
# tags and READ RECORD command anchor it to the actual EMV structure. The generic
# composite remains suspicious because a conformance harness can exercise the
# same mutation. Pairing it with a live Android NFC/WebSocket relay is hostile.
defaults:
  platforms: [android, linux, windows]
  for: [python, java, kotlin]
  attack: T1565.002

composite_rules:
  - id: emv-application-expiry-relay-tampering
    desc: EMV READ RECORD expiry field rewritten in an APDU relay
    crit: suspicious
    conf: 0.98
    all:
      - id: micro-behaviors/hardware/smartcard/access::emv-application-expiry-tlv-tag
      - id: micro-behaviors/hardware/smartcard/access::emv-read-record-command
      - id: micro-behaviors/hardware/smartcard/access::emv-apdu-relay-routine
      - id: micro-behaviors/data/manipulation::application-expiry-rewrite-routine

  - id: android-source-emv-expiry-rewrite-relay
    desc: Android NFC relay rewrites the terminal-facing EMV expiry date
    crit: hostile
    conf: 0.995
    platforms: [android]
    for: [java, kotlin]
    all:
      - id: objectives/command-and-control/channel/proxy::android-source-nfc-relay-channel
      - id: micro-behaviors/hardware/smartcard/access::emv-application-expiry-tlv-tag
      - id: micro-behaviors/hardware/smartcard/access::emv-read-record-command
      - id: micro-behaviors/hardware/smartcard/access::emv-apdu-relay-routine
      - id: micro-behaviors/data/manipulation::application-expiry-rewrite-routine
