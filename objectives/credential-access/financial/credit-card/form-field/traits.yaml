defaults:
  platforms: [windows, unix]
  for: [python, javascript, php, html]
  attack: T1005
  mbc: B0030
traits:
  # `cv2` (the OpenCV module) is deliberately absent: it matched the import
  # in every computer-vision file (face alignment, camera capture) and never
  # denotes a card-security-code field.
  - id: cvv-field
    desc: CVV or CVC field name
    crit: notable
    conf: 0.7
    if:
      type: text
      regex: (?i)\b(cvv|cvc)\b
    unless:
      - id: metadata/build/recognized-contexts/
      - id: metadata/package/testing/
      - type: text
        substr: ").registerCommand("
      - type: metrics
        field: text.non_ascii_ratio
        min: 0.8
  - id: expiry-field
    desc: Card expiry month or year field
    crit: notable
    conf: 0.6
    if:
      type: text
      regex: (?i)\b(exp_month|exp_year|exp_date)\b
  - id: expiry-field-ru
    desc: Russian card expiry field label
    crit: notable
    conf: 0.6
    if:
      type: text
      regex: "Срок\\s+действия"
  - id: expiry-field-short
    desc: Short-form card expiry field
    crit: notable
    conf: 0.6
    if:
      type: text
      regex: (?i)\b(card_exp|mm/yy)\b
  - id: card-number-field
    desc: Card number field name
    crit: component
    conf: 0.5
    if:
      type: text
      regex: (?i)\b(card.?number|cc.?num)\b
    unless:
    - id: metadata/file/catalog/identity/
    - id: metadata/build/recognized-contexts/
  - id: card-filter-name-regex
    desc: "Matches 'bactions'"
    crit: baseline
    conf: 0.9
    for: [javascript, typescript]
    if:
      type: text
      substr: "card|cc|cvv|cvc|expir"
  - id: card-filter-autocomplete-regex
    desc: "Matches 'php://input'"
    crit: baseline
    conf: 0.9
    for: [javascript, typescript]
    if:
      type: text
      substr: "cc-|card-number|cvv|cvc|expiry|exp-date"
  - id: card-filter-return-true
    desc: "Matches 'php://input'"
    crit: notable
    conf: 0.3
    for: [javascript, typescript]
    if:
      type: text
      regex: '(?is)\b(card|cc|cvv|cvc)\b[^\n]{0,120}return\s+true'
  - id: card-number-field-ru
    desc: "Matches 'php://input'"
    crit: component
    conf: 0.5
    if:
      type: text
      regex: "Номер\\s+карты"
composite_rules:
  - id: credit-card-form-fields
    desc: Credit card form fields collection
    crit: suspicious
    conf: 0.9
    all:
    - id: cvv-field
    - id: objectives/credential-access/financial/credit-card/form-capture::credit-card-form-capture
    any:
    - id: expiry-field
    - id: expiry-field-ru
    - id: expiry-field-short
    - id: card-number-field
    - id: card-number-field-ru
    - id: objectives/credential-access/financial/credit-card/validation::luhn-algorithm
    - id: objectives/credential-access/financial/credit-card/card-number::mastercard-brand
    unless:
    - id: well-known/lib/ai/inspect-evals::eval-corpus-context
    downgrade:
      any:
      - id: metadata/package/testing/presence/scripted::faker-word
  - id: credit-card-form-fields-carveouts
    desc: Recognized credit-card form-field markers
    crit: component
    conf: 0.9
    any:
    - id: metadata/lang/generated::generated-do-not-edit-text
    - id: well-known/app/productivity/n8n::stripe-card-token-description
    - id: metadata/package/completeness::has-tests-or-declarations
    - id: metadata/package/testing/harness/runtime::is-test
    - id: metadata/package/testing/presence/fixture::test-filename-pattern
    - id: metadata/package/testing/presence/harness::test-directory
    - id: metadata/lang/scripted::dts-declaration-file
    - id: objectives/credential-access/financial/credit-card/keyword::storybook-story-file
    - id: objectives/credential-access/financial/credit-card/keyword::fake-stripe-checkout-demo
  - id: credit-card-field-exclusion-filter
    for: [javascript]
    desc: Payment-field exclusion filter
    crit: baseline
    conf: 0.92
    near_bytes: 800
    all:
    - id: card-filter-return-true
    any:
    - id: card-filter-name-regex
    - id: card-filter-autocomplete-regex
