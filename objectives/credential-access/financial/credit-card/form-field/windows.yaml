# Credit card phishing-form detection in PE binaries. The first group is
# resource-dialog specific; the legacy banking-trojan prompts below may be
# runtime-decoded from an ordinary data section.
# ATT&CK: T1056.002 (GUI Input Capture)
defaults:
  crit: notable
  conf: 0.8
  for: [pe]
  platforms: [windows]
  attack: T1056.002
traits:
  - id: pe-card-number-field
    desc: Card number field in PE resource
    if:
      type: text
      substr: "Card Number:"
      section: rsrc
  - id: pe-payment-account-field
    desc: Payment account field in PE resource
    if:
      type: text
      substr: "Payment Account:"
      section: rsrc
