# Rewriting an EMV contactless transaction in flight (ATT&CK T1565.002,
# Transmitted Data Manipulation). Filed beside android.yaml because this is the
# tree's home for payment-card objectives and the EMV-relay family belongs in
# one place, but it detects something android.yaml does not: that file models
# moving APDUs to an operator and harvesting the PIN, whereas these detect the
# app *editing* the card's own answers before forwarding them.
#
# Three edits carry the fraud, and each is named for the EMV field it touches:
#
#   * Card Transaction Qualifiers (tag 9F6C) and the CVM list are where the
#     card states whether cardholder verification is required. Clearing those
#     bits downgrades the tap to "no CVM required", so a relayed transaction
#     clears without the cardholder's PIN. Nothing legitimate rewrites a card's
#     own CVM decision — a terminal reads that decision, it does not author it.
#   * Track 2 Equivalent Data (tag 57) carries the PAN, expiry and service
#     code. Substituting it makes the relayed card present an identity other
#     than the one that was physically tapped.
#   * The Application Identifier (tag 4F/84) is what the card answers a SELECT
#     with, and it is how the terminal decides which scheme's rules to run.
#     Rewriting the AID on the way back — `modifyAidToVisa` in the 2026
#     dashboardcloud.app relay variants — routes the transaction to a scheme
#     the tapped card never claimed, so its CVM and floor-limit policy is used
#     instead. A reader reads an AID; only a man-in-the-middle authors one.
#
# Keyed on the EMV field acronyms rather than on any one sample's identifiers:
# AID, CTQ, CVM and Track 2 are the specification's own names for these objects,
# so they persist across rebuilds of a variant family, and an obfuscator that
# renames them also destroys the developer's own ability to work on the code.
# Suspicious as atoms because an EMV conformance-test harness may legitimately
# name a routine this way; the hostile reading needs a live card underneath it.
defaults:
  platforms: [android]
  for: [apk, zip]
  crit: suspicious
  conf: 0.94
  attack: T1565.002

traits:
  - id: emv-cvm-bypass-routine
    desc: EMV cardholder verification bypass routine
    conf: 0.96
    if:
      type: text
      regex: '(?i)(ctq|cvm)[A-Za-z_]{0,16}bypass'

  - id: emv-track2-substitution-routine
    desc: EMV Track 2 data substitution routine
    if:
      type: text
      regex: '(?i)(inject|replace|modify)track ?2'

  # The `to`/`as` connector is what makes this a rewrite rather than a lookup:
  # a reader that merely resolves an AID names the routine getAid/selectAid/
  # parseAid, never modifyAidTo. Requiring the verb immediately before "aid"
  # keeps words that merely end in -aid (paid, raid, unpaid) out.
  - id: emv-aid-substitution-routine
    desc: EMV application identifier substitution routine
    conf: 0.95
    if:
      type: text
      regex: '(?i)(modify|replace|spoof)_?aid_?(to|as)'

composite_rules:
  # An app that speaks ISO-DEP to a physical contactless card, runs a real EMV
  # command flow, and edits the card's transaction fields on the way past is
  # payment-fraud tooling. The two transport legs are what separate it from a
  # test harness reasoning about EMV data it was handed offline.
  - id: emv-contactless-transaction-tampering
    desc: Contactless EMV card responses rewritten in flight
    crit: hostile
    conf: 0.99
    all:
      - id: micro-behaviors/hardware/smartcard/access::android-isodep-technology-reference
      - id: micro-behaviors/hardware/smartcard/access::android-nfc-transceive-reference
      - id: micro-behaviors/hardware/smartcard/access::android-emv-transaction-marker
    any:
      - id: emv-cvm-bypass-routine
      - id: emv-track2-substitution-routine
      - id: emv-aid-substitution-routine
