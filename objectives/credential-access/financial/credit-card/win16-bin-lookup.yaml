# Win16 card checker: a table of Visa BIN prefixes mapped to bank names, and a
# prompt that asks for a card number with no letters or hyphens. A checker
# uses the table to name the issuer of a number it is testing. The table and
# the prompt are carding tooling; a legitimate payment form does not carry a
# BIN-to-bank list.
defaults:
  for: [ne]
  platforms: [windows]
  attack: T1565

traits:
  # Five or more "4xxx - Bank name" (Visa) or "5xxx - Bank name" (MasterCard)
  # lines: a card-prefix table.
  - id: win16-bin-prefix-bank-lines
    desc: Card BIN prefixes listed with bank names
    crit: notable
    conf: 0.9
    count_min: 5
    if:
      type: text
      regex: '\b[45][0-9]{3} - [A-Za-z][A-Za-z .&/]{2,40}'

  - id: win16-card-number-entry-prompt
    desc: Prompt asks for card number without hyphens
    crit: notable
    conf: 0.9
    if:
      type: text
      case_insensitive: true
      substr: 'card number with no letters'

composite_rules:
  - id: win16-bin-lookup-checker
    desc: Win16 card checker maps card BIN prefixes to bank names
    crit: hostile
    conf: 0.94
    all:
      - id: win16-bin-prefix-bank-lines
      - id: win16-card-number-entry-prompt
