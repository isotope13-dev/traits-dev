defaults:
  platforms: [android]
  for: [apk, binaries]
  attack: T1056

composite_rules:
  - id: android-emv-pin-relay
    desc: Android EMV payment-card APDUs relayed with a remote PIN step
    crit: hostile
    conf: 0.995
    all:
      - id: micro-behaviors/hardware/smartcard/access::android-isodep-technology-reference
      - id: micro-behaviors/hardware/smartcard/access::android-nfc-transceive-reference
      - id: micro-behaviors/hardware/smartcard/access::android-emv-transaction-marker
      - id: micro-behaviors/communications/http/websocket::android-okhttp-websocket-client
      - id: micro-behaviors/communications/websocket/endpoints::android-wss-endpoint
      - id: objectives/credential-access/phishing/credential::android-remote-credential-step
      - id: objectives/credential-access/phishing/credential::android-pin-forwarding-reference
