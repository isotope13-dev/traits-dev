# Banker manifests bind every privileged role a remote operator needs:
# accessibility (screen read and gestures), device admin (uninstall
# resistance), notification access (OTP capture) plus SMS read and
# sideload rights. Parental-control and MDM apps rarely combine all five.
defaults:
  platforms: [android]
  for: [xml]
  attack: T1453,T1517,T1626.001

composite_rules:
  - id: android-manifest-banker-role-stack
    desc: Manifest binds banker remote-control roles
    crit: hostile
    conf: 0.93
    all:
      - id: micro-behaviors/os/privilege/manifest::axml-accessibility-service-binding
      - id: micro-behaviors/os/privilege/manifest::axml-device-admin-receiver-binding
      - id: micro-behaviors/os/privilege/manifest::axml-notification-listener-binding
      - id: metadata/permission/storage::android-read-sms-request-axml
      - id: metadata/permission/management::android-request-install-packages-request
