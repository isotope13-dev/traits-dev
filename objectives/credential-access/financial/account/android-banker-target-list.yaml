# Android banker: an accessibility service watches which app is in the
# foreground and the APK carries a list of dozens of banking app ids, so a
# matching overlay or injected page can be raised over each one.
defaults:
  platforms: [android]
  for: [dex]
  crit: hostile
  attack: T1417.002,T1453

composite_rules:
  - id: android-accessibility-banking-overlay-targets
    desc: Accessibility service paired with a list of dozens of banking apps
    conf: 0.94
    all:
      - id: micro-behaviors/os/application/target/finance::dex-many-banking-app-ids
      - id: micro-behaviors/hardware/input/accessibility::android-dex-accessibility-service-subclass
