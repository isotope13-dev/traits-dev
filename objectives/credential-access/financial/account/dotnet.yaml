# Payment-gateway credential theft in a compiled/managed binary. Neutral field
# handling lives under micro-behaviors/data/parse/payment; this objective pairs
# the complete credential set with HTTP and high-confidence external-C2 evidence.
#
# In the Braintree.Net sample, GraphQL.GatewayInput.AddAccountAsync serializes
# merchantId + publicKey + privateKey into a JSON body and POSTs it to
# https://api.348672-shakepay.com/api/account, granting full gateway API access.
defaults:
  platforms: [windows, linux, macos]
  for: [pe, dll, macho, elf]
  attack: T1552
  mbc: B0030

composite_rules:
  - id: dotnet-gateway-credential-exfil
    desc: Compiled SDK exfiltrates gateway keys
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/data/parse/payment::managed-gateway-credential-triple
      - id: micro-behaviors/communications/http/client/managed::httpclient
    any:
      - id: objectives/command-and-control/infrastructure/domain/malicious::numeric-lookalike-c2-host
      - id: objectives/credential-access/financial/credit-card::skimmer-c2-static-api-key
