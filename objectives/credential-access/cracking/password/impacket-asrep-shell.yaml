# GetNPUsers without -request can enumerate accounts; requesting AS-REP
# material is the credential-harvesting distinction. Authorized audits remain
# possible, so this is suspicious, not hostile. Parsed calls exclude comments,
# printed examples and a request flag passed to an unrelated command.
defaults:
  platforms: [unix]
  for: [shell]
  crit: suspicious
  conf: 0.98
  attack: T1558.004

traits:
  - id: impacket-asrep-request
    desc: Requests AS-REP hashes through Impacket
    if:
      type: symbol
      kind: call
      regex: '(^|/)(GetNPUsers\.py|impacket-GetNPUsers)$'
      arg:
        kind: identifier
        name: -request

  - id: python-impacket-asrep-request
    desc: Python launches Impacket AS-REP requests
    if:
      type: symbol
      kind: call
      regex: '(^|/)python(3(\.[0-9]+)?)?$'
      args:
        - kind: identifier
          name_regex: '(^|/)GetNPUsers\.py$'
        - kind: identifier
          name: -request
