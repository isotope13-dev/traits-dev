# Online password guessing against remote services. Keep these rules on Mach-O
# binaries so documentation discussing password recovery is not itself treated
# as an implemented attack tool.
defaults:
  platforms: [macos]
  for: [macho]
  attack: T1110.001
  mbc: E1110

traits:
  - id: pop3-password-cracking
    desc: Claims POP3 password cracking
    crit: component
    conf: 0.96
    if:
      type: text
      exact: 'Uses POP3 protocol to crack passwords.'

  - id: ftp-password-cracking
    desc: Claims FTP password cracking
    crit: component
    conf: 0.96
    if:
      type: text
      exact: 'Uses FTP protocol to crack passwords.'

  - id: hotline-password-cracking
    desc: Claims Hotline password cracking
    crit: component
    conf: 0.96
    if:
      type: text
      exact: 'Uses Hotline protocol to crack passwords.'

  - id: msn-password-cracking
    desc: Claims MSN password cracking
    crit: component
    conf: 0.96
    if:
      type: text
      substr: 'Uses MSN protocol to crack passwords.'

  - id: aim-icq-password-cracking
    desc: Claims AIM or ICQ password cracking
    crit: component
    conf: 0.96
    if:
      type: text
      exact: 'Uses AIM/ICQ2000 protocol to crack passwords.'

  - id: username-dictionary-input
    desc: Uses a username dictionary for guessing
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)(path to |choose (a )?)?username dictionary file'

  - id: password-dictionary-input
    desc: Uses a password dictionary for guessing
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)(path to |choose (a )?)?password dictionary file'

  - id: login-attempt-series-control
    desc: Controls repeated login-attempt series
    crit: notable
    conf: 0.9
    if:
      type: text
      substr: 'login attempts per series'

  - id: tcp-network-cracking-routine
    desc: Implements TCP account cracking routines
    crit: component
    conf: 0.97
    if:
      type: text
      regex: '_MethodsAndProperties\.TCPCracking(Init)?'

  - id: web-network-cracking-routine
    desc: Implements web-form cracking routines
    crit: component
    conf: 0.97
    if:
      type: text
      substr: '_MethodsAndProperties.WFCracking'

  - id: messaging-network-cracking-routine
    desc: Implements messaging-account cracking routines
    crit: component
    conf: 0.97
    if:
      type: text
      regex: '_MethodsAndProperties\.(MSN|IA)Cracking'

  - id: proxy-network-cracking-routine
    desc: Implements proxied account cracking
    crit: component
    conf: 0.97
    if:
      type: text
      substr: '_ProxyModule.ProxyingCracking'

  - id: concurrent-attack-sockets
    desc: Configures concurrent password-attack sockets
    crit: suspicious
    conf: 0.95
    if:
      type: text
      regex: '(?i)(how many sockets to create for the attack|open up to [0-9]{2,4} connections)'

  - id: recovered-password-result
    desc: Reports a password recovered by the attack
    crit: suspicious
    conf: 0.94
    if:
      type: text
      exact: 'The password was recovered.'

  - id: attack-power-ui
    desc: Displays password-attack concurrency controls
    crit: component
    conf: 0.82
    if:
      type: text
      substr: 'attack power'

  - id: attack-progress-ui
    desc: Displays password-attack progress
    crit: component
    conf: 0.82
    if:
      type: text
      substr: 'attack progress'

  - id: attack-log-ui
    desc: Displays a password-attack log
    crit: component
    conf: 0.82
    if:
      type: text
      substr: 'attack log'

  - id: socket-status-ui
    desc: Displays per-socket password-attack status
    crit: component
    conf: 0.82
    if:
      type: text
      substr: 'sockets status'

composite_rules:
  - id: remote-protocol-password-cracking
    desc: Claims cracking for multiple remote protocols
    crit: suspicious
    conf: 0.98
    needs: 2
    any:
      - id: pop3-password-cracking
      - id: ftp-password-cracking
      - id: hotline-password-cracking
      - id: msn-password-cracking
      - id: aim-icq-password-cracking

  - id: network-cracking-routines
    desc: Implements multiple online cracking routines
    crit: suspicious
    conf: 0.98
    needs: 2
    any:
      - id: tcp-network-cracking-routine
      - id: web-network-cracking-routine
      - id: messaging-network-cracking-routine
      - id: proxy-network-cracking-routine

  - id: remote-service-dictionary-password-cracking
    desc: Dictionary-guesses remote-service credentials
    crit: hostile
    conf: 0.99
    all:
      - id: remote-protocol-password-cracking
      - id: username-dictionary-input
      - id: password-dictionary-input
      - id: login-attempt-series-control
      - id: network-cracking-routines

  - id: multi-socket-online-password-guessing
    desc: Guesses passwords over concurrent sockets
    crit: hostile
    conf: 0.99
    all:
      - id: remote-protocol-password-cracking
      - id: network-cracking-routines
      - id: concurrent-attack-sockets
      - id: recovered-password-result
    any:
      - id: attack-power-ui
      - id: attack-progress-ui
      - id: attack-log-ui
      - id: socket-status-ui
    needs: 2
