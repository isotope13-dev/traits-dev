# Source-level indicators for Kerberoasting.  The article's network rule
# correlates many unique non-system SPNs and successful TGS replies from one
# client; source code can expose the same intent when it enumerates several
# service principals, requests TGS tickets, exports their roastable form, and
# invokes an offline password cracker.
defaults:
  platforms: [windows, unix]
  for: [python, powershell, javascript, typescript, go, csharp, perl, ruby, php]
  attack: T1558.003

traits:
  - id: kerberos-spn-enumeration
    desc: Enumerates SPN service accounts
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)\b(GetUserSPNs|servicePrincipalName|SERVICE_SPNS|enum_spns)\b'

  - id: multiple-kerberos-spn-targets
    desc: Lists multiple Kerberos SPN targets
    crit: suspicious
    conf: 0.94
    count_min: 3
    if:
      type: text
      regex: '(?i)\b(MSSQLSvc|HTTP|CIFS|LDAP|HOST|WSMAN)/[A-Za-z0-9_.:-]{2,}'

  - id: kerberos-tgs-api-request
    desc: Requests a Kerberos TGS ticket
    crit: notable
    conf: 0.92
    if:
      type: text
      word: getKerberosTGS

  - id: windows-kerberos-tgs-request
    desc: Windows Kerberos TGS request API
    crit: notable
    conf: 0.92
    for: [powershell, csharp]
    if:
      type: text
      regex: '(?i)\b(KerberosRequestorSecurityToken|RequestServiceTicket)\b'

  - id: kerberos-tgs-request-marker
    desc: Kerberos TGS request marker
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)\b(asktgs|KRB_TGS_REQ|TGS-REQ)\b'

  - id: kerberos-tgs-hash-format
    desc: Roastable Kerberos TGS hash format
    crit: suspicious
    conf: 0.96
    if:
      type: text
      substr: '$krb5tgs$'

  - id: kerberos-tgs-response-marker
    desc: Kerberos TGS response marker
    crit: suspicious
    conf: 0.94
    if:
      type: text
      word: KRB_TGS_REP

  - id: kerberos-weak-encryption
    desc: Weak Kerberos ticket encryption marker
    crit: suspicious
    conf: 0.95
    if:
      type: text
      regex: '(?i)(RC4[-_ ]?HMAC|weak[_ -]?encryption|etype\s*[:=]\s*23)'

  - id: kerberos-ticket-hash-variable
    desc: Kerberos ticket hash variable
    crit: suspicious
    conf: 0.92
    if:
      type: text
      regex: '(?i)\btgs[_ -]?hash\b'

  - id: kerberos-ticket-export-call
    desc: Kerberos ticket export operation
    crit: suspicious
    conf: 0.93
    if:
      type: text
      regex: '(?i)\bticket.{0,80}(write|dump|export|save)'

  - id: hashcat-kerberos-mode
    desc: Hashcat Kerberos cracking mode
    crit: suspicious
    conf: 0.97
    if:
      type: text
      regex: '(?i)\bhashcat\b.{0,120}\b13100\b'

  - id: kerberos-hash-cracker
    desc: Cracks Kerberos ticket hashes
    crit: suspicious
    conf: 0.96
    if:
      type: text
      regex: '(?i)\b(krb5tgs|tgs[_ -]?hash)\b.{0,120}\b(hashcat|john)\b'

composite_rules:
  - id: kerberos-tgs-request
    desc: Kerberos service-ticket request capability
    crit: notable
    conf: 0.94
    any:
      - id: kerberos-tgs-api-request
      - id: windows-kerberos-tgs-request
      - id: kerberos-tgs-request-marker

  - id: kerberos-ticket-roast-format
    desc: Exports a roastable TGS hash
    crit: suspicious
    conf: 0.97
    any:
      - id: kerberos-tgs-hash-format
      - id: kerberos-tgs-response-marker
      - id: kerberos-ticket-hash-variable
      - id: kerberos-ticket-export-call

  - id: kerberos-offline-cracker
    desc: Uses an offline Kerberos cracker
    crit: suspicious
    conf: 0.98
    any:
      - id: hashcat-kerberos-mode
      - id: kerberos-hash-cracker

  - id: kerberos-spn-tgs-harvest
    desc: Harvests service tickets across SPNs
    crit: hostile
    conf: 0.98
    near_lines: 100
    all:
      - id: kerberos-spn-enumeration
      - id: multiple-kerberos-spn-targets
      - id: kerberos-tgs-request

  - id: kerberoasting-offline-crack
    desc: Offline-cracks Kerberos ticket hashes
    crit: hostile
    conf: 0.99
    attack: T1558.003,T1110.002
    near_lines: 100
    all:
      - id: kerberos-spn-tgs-harvest
      - id: kerberos-ticket-roast-format
      - id: kerberos-offline-cracker
