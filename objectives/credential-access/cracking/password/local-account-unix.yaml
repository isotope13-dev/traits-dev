# Guessing the passwords of local accounts on the host the code is already
# running on. This is the local-cracking side of T1110: the account list comes
# from the machine's own directory service, and each candidate is tried by
# driving an interactive authentication prompt -- `su`, `login`, `sudo` --
# through an expect script, because those tools refuse to read a password from
# a pipe.
#
# Automating an interactive password prompt is the part with no benign
# reading. Test harnesses drive `expect` against services they own; nothing
# legitimate drives it against `su` for every account on the box.
defaults:
  platforms: [unix]
  for: [scripts, source]
  attack: T1110.001
  mbc: B0031

traits:
  - id: expect-driven-su-authentication
    desc: Drives su through an expect script
    crit: suspicious
    conf: 0.94
    unless:
      - type: text
        substr: dpkg-reconfigure
    if:
      # `expect -c 'spawn su <user>' -c 'expect Password: {send <pw>\n}'`
      type: text
      regex: '(?i)expect\s+-c[^\n]{0,30}spawn\s+(su|login|sudo)\b'

  - id: expect-password-prompt-reply
    desc: Answers a password prompt from a script
    crit: suspicious
    conf: 0.9
    if:
      # The reply half of the same idiom, which also covers the multi-line
      # spelling where the spawn and the expect are separate lines.
      type: text
      regex: '(?i)expect\s+[Pp]assword:?\s*\{\s*send\b'


composite_rules:
  # Enumerate the accounts that have passwords, then drive an authentication
  # prompt against them. That is a local password spray, whatever it calls
  # itself.
  - id: local-account-password-spray
    for: [shell, python, javascript, ruby, php, lua, perl, applescript]
    desc: Sprays passwords at local accounts
    crit: hostile
    conf: 0.96
    attack: T1110.001,T1087.001
    all:
      - id: micro-behaviors/os/user/lookup::macos-list-local-accounts
    any:
      - id: expect-driven-su-authentication
      - id: expect-password-prompt-reply

  - id: cracked-credential-collection
    desc: Records credentials guessed by a spray
    crit: hostile
    conf: 0.95
    attack: T1110.001,T1552
    all:
      - id: micro-behaviors/fs/write/credential::shell-user-password-pair-append
    any:
      - id: expect-driven-su-authentication
      - id: expect-password-prompt-reply
