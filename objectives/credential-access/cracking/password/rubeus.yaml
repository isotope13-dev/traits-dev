defaults:
  platforms: [windows]
  for: [pe, dll]
  attack: T1558.003

traits:
  - id: asrep-roasting-command
    desc: AS-REP roasting command capability
    crit: notable
    conf: 0.96
    if:
      type: text
      word: asreproast

composite_rules:
  # An identified executable that implements both Kerberoasting modes and
  # emits their crackable hash formats is credential harvesting tooling, not
  # merely a parser or a document that names the techniques.
  - id: rubeus-kerberos-roasting-toolset
    desc: Rubeus offers roasting with crackable Kerberos hash output
    crit: notable
    conf: 0.99
    attack: T1558.003,T1558.004
    all:
      - id: well-known/tool/offensive/rubeus::rubeus-tool
      - id: micro-behaviors/os/security/auth/session::kerberoast-command-name
      - id: asrep-roasting-command
      - id: micro-behaviors/data/format/string::kerberos-roastable-hash-format
