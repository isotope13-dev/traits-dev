# CloudSEK's FortiBleed operator screenshot shows nested account/password
# trials using getTGT followed by successful credential reporting. Co-occurrence
# is file-level; authorized auditing remains possible, so these are suspicious.
defaults:
  platforms: [unix]
  for: [shell]
  crit: suspicious
  attack: T1110.001
composite_rules:
  - id: shell-nested-kerberos-password-trials
    desc: Nested credential trials using Kerberos
    conf: 0.95
    scope: file
    all:
      - id: micro-behaviors/data/control-flow/loop::shell-nested-value-loops
      - id: micro-behaviors/process/argument/authentication::gettgt-variable-credential-pair
  - id: shell-kerberos-success-credential-report
    desc: Kerberos trials report successful credentials
    conf: 0.95
    scope: file
    all:
      - id: shell-nested-kerberos-password-trials
      - id: micro-behaviors/data/control-flow/branch::shell-ticket-save-success-test
      - id: micro-behaviors/process/fd/stdio::shell-echo-variable-pair
