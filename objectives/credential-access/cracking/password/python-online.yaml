# Online password spraying from Python: a named password list is walked and
# each entry is submitted to a login request. Numeric account ids minted from
# random digits are the companion technique when the target identifier is
# guessed rather than harvested.
defaults:
  platforms: [unix, windows]
  for: [python]
  attack: T1110.003
  crit: notable

traits:
  - id: python-password-list-loop
    desc: Loops over a password list
    conf: 0.9
    if:
      type: text
      regex: '(?i)for\s+\w+\s+in\s+\w*passwords?\w*\s*:'

  - id: python-random-numeric-account-id
    desc: Mints a numeric account id
    conf: 0.9
    if:
      type: text
      regex: 'random\.choices\(\s*["'']0123456789["'']'

composite_rules:
  - id: python-password-list-login
    desc: Tries each password in a login request
    crit: hostile
    conf: 0.96
    scope: file
    near_lines: 40
    all:
      - id: python-password-list-loop
    any:
      - id: micro-behaviors/communications/http/lib/requests::requests-post
      - id: micro-behaviors/communications/http/lib/requests::requests-get
      - id: micro-behaviors/communications/http/post::session-post
    needs: 1

  - id: python-numeric-id-password-spray
    desc: Tries passwords for minted numeric ids
    crit: hostile
    conf: 0.95
    scope: archive
    for: [python, python-sdist, whl, zip]
    all:
      - id: python-random-numeric-account-id
      - id: python-password-list-login
