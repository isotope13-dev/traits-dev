# Online password spraying from Python: a named password list is walked and
# each entry is submitted to a login request. Random digit generation is a
# neutral capability, defined in micro-behaviors/os/random.
defaults:
  platforms: [unix, windows]
  for: [python]
  attack: T1110.003
  crit: notable

traits:
  # The driver call that consumes the minted identifiers. Account-cracking
  # toolkits split the generator from the attack loop, so the only evidence
  # left in the generator module is the handoff of an id collection to a
  # crack routine.
  - id: python-id-list-crack-call
    desc: Passes account ids to a cracker
    conf: 0.9
    if:
      type: text
      regex: '(?i)\b\w*crack\w*\(\s*\w*(user_?ids?|account_?ids?|uids?|targets?|victims?)\w*\s*[,)]'

composite_rules:
  - id: python-password-list-login
    desc: Tries each password in a login request
    crit: hostile
    conf: 0.96
    scope: file
    near_lines: 40
    all:
    - id: micro-behaviors/data/collection/wordlist::python-password-list-loop
    any:
    - id: micro-behaviors/communications/http/post::requests-post
    - id: micro-behaviors/communications/http/get::requests-get
    - id: micro-behaviors/communications/http/post::session-post
    needs: 1
    unless:
    - id: well-known/app/ai/coding-agent/yana-ai::yana-ai-security-audit-product-context
    - id: well-known/app/system/anthropic-cybersecurity-skills::cybersecurity-skill-documentation
    - id: well-known/tool/offensive/exploitdb::published-script-wrapper
    # An auth-policy verification module (pytest marks/parametrize driving
    # wrong-credential requests against the deployment under test) is the
    # recognized benign shape for this pairing; standalone crackers do not
    # ship as pytest modules with assertions.
    - id: metadata/package/testing/scripted::pytest
    - id: micro-behaviors/os/security/keychain::python-keyring-delete-password
  - id: python-numeric-id-password-spray
    desc: Tries passwords for minted numeric ids
    crit: hostile
    conf: 0.95
    scope: archive
    for: [python, python-sdist, whl, zip]
    all:
      - id: micro-behaviors/os/random/prng/stdlib::python-random-digit-choices
      - id: python-password-list-login

  # Identifiers are not harvested but minted from a fixed numeric series and
  # then fed straight into the cracking driver -- account enumeration wired
  # to a credential attack, with no legitimate use.
  - id: python-minted-id-cracking-driver
    desc: Feeds minted account ids into a credential cracking routine
    crit: hostile
    conf: 0.95
    scope: file
    all:
      - id: micro-behaviors/os/random/prng/stdlib::python-random-digit-choices
      - id: python-id-list-crack-call
