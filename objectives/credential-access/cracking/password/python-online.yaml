# Numeric identifier generation combined with credential-attack evidence.
# HTTP password spraying is defined under lateral-movement/brute-force; a
# password-named loop next to an unrelated HTTP call is insufficient evidence.
defaults:
  platforms: [unix, windows]
  for: [python]
  attack: T1110.003
  crit: notable

traits:
  # The driver call that consumes the minted identifiers. Account-cracking
  # toolkits split the generator from the attack loop, so the only evidence
  # left in the generator module is the handoff of an id collection to a
  # crack routine.
  - id: python-id-list-crack-call
    desc: Passes account ids to a cracker
    conf: 0.9
    if:
      type: text
      regex: '(?i)\b\w*crack\w*\(\s*\w*(user_?ids?|account_?ids?|uids?|targets?|victims?)\w*\s*[,)]'

composite_rules:
  - id: python-numeric-id-password-spray
    desc: Tries passwords for minted numeric ids
    crit: hostile
    conf: 0.95
    scope: archive
    for: [python, python-sdist, whl, zip]
    all:
      - id: micro-behaviors/os/random/prng/stdlib::python-random-digit-choices
      - id: objectives/lateral-movement/brute-force/password/web::python-bound-http-password-spray

  # Identifiers are not harvested but minted from a fixed numeric series and
  # then fed straight into the cracking driver -- account enumeration wired
  # to a credential attack, with no legitimate use.
  - id: python-minted-id-cracking-driver
    desc: Feeds minted account ids into a credential cracking routine
    crit: hostile
    conf: 0.95
    scope: file
    all:
      - id: micro-behaviors/os/random/prng/stdlib::python-random-digit-choices
      - id: python-id-list-crack-call
