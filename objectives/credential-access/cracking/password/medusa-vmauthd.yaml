defaults:
  platforms: [linux]
  for: [c]
traits:
- id: medusa-credential-set-fetch
  desc: Fetches the next supplied credential
  crit: notable
  if:
    type: text
    substr: getNextCredSet
- id: medusa-login-attempt
  desc: Attempts a supplied login
  crit: suspicious
  conf: 0.97
  attack: T1110.001
  if:
    type: text
    substr: tryLogin
- id: vmauthd-brute-force-module
  desc: VMware vmauthd credential brute-force module
  crit: suspicious
  conf: 0.98
  attack: T1110.001
  if:
    type: text
    regex: 'MODULE_SUMMARY_USAGE\s+"Brute force module for the VMware Authentication Daemon"'
- id: vmauthd-default-port
  desc: VMware Authentication Daemon port 902
  crit: notable
  if:
    type: text
    regex: 'PORT_VMAUTHD\s+902'
composite_rules:
- id: medusa-vmauthd-credential-attack
  desc: Medusa guesses VMware vmauthd credentials
  crit: suspicious
  conf: 0.99
  attack: T1110.001
  all:
  - id: objectives/credential-access/cracking/password::medusa-credential-set-fetch
  - id: objectives/credential-access/cracking/password::medusa-login-attempt
  - id: objectives/credential-access/cracking/password::vmauthd-brute-force-module
  - id: objectives/credential-access/cracking/password::vmauthd-default-port
