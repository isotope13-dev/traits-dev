# Code that drives THC-Hydra, the online password guesser, with username
# and password wordlists against a network service. Hydra is single-purpose
# — unlike a generic HTTP client it exists only to guess credentials — so
# the tool plus the wordlist pair is the credential attack (T1110.001),
# whether the target is the operator's own box or not. Prose naming Hydra
# (write-ups, reports) stays out via the code-only `for:` scope.
defaults:
  platforms: [unix, windows]
  for: [python, shell]
  attack: T1110.001

traits:
  - id: hydra-tool-invocation
    desc: Invokes the Hydra online guesser
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: '(?i)\bhydra\b'

  - id: hydra-wordlist-pair-flags
    desc: Hydra user and password list flags
    crit: notable
    conf: 0.94
    if:
      type: text
      # A user source (-l name or -L file) and a password source (-p or -P)
      # in either order on the same command line.
      regex: '(?i)-[lL]\s+\S+.{0,80}-[pP]\s+\S+|-[pP]\s+\S+.{0,80}-[lL]\s+\S+'

composite_rules:
  - id: hydra-wordlist-online-guessing
    desc: Hydra guesses logins from wordlists
    crit: suspicious
    conf: 0.96
    all:
      - id: hydra-tool-invocation
      - id: hydra-wordlist-pair-flags
