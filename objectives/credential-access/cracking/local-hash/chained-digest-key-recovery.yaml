# Offline recovery of PRNG-seeded or public-prefix-derived hex signing keys
# verified against a captured message-authentication digest (e.g. InfiniteWP
# NOSSL K = md5(base64(pubkey) || N) verified via md5(action || id || K)).
defaults:
  platforms: [unix, windows]
  attack: T1110.002
  mbc: B0005
  for: [scripts, source]

composite_rules:
  - id: digest-midstate-prng-keyspace-search
    desc: Parallel 31-bit PRNG hash midstate search
    crit: suspicious
    conf: 0.96
    all:
      - id: micro-behaviors/crypto/key/recover::midstate-digest-optimization
      - id: micro-behaviors/crypto/key/recover::rand31-search-space
    any:
      - id: micro-behaviors/process/thread/runtime::concurrent-worker-execution
      - id: micro-behaviors/process/work/pool::parallel-process-executor
      - id: micro-behaviors/process/work/pool::parallel-thread-executor
      - id: micro-behaviors/process/work/pool::worker-pool

  - id: chained-md5-signing-key-bruteforce
    desc: Brute-forces MD5 signing key via signature
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/crypto/key/recover::chained-hex-digest-verification
      - id: micro-behaviors/crypto/hash/digest/md5
      - id: micro-behaviors/crypto/key/recover::rand31-search-space
    any:
      - id: micro-behaviors/crypto/key/representation/encoded::pem-public-key-header
      - id: micro-behaviors/data/encode/base64
      - id: micro-behaviors/data/decode/base64
      - id: micro-behaviors/data/decode/hex::native-sscanf-hex-byte-decode
    unless:
      - id: well-known/app/publishing/wordpress-plugins/site-admin::iwp-client-server-class

