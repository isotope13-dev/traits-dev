defaults:
  platforms: [aix, unix]
  for: [rust]
  attack: T1110.002
traits:
  - id: rust-aix-security-passwd-read
    desc: Rust reads AIX security passwd
    crit: suspicious
    conf: 0.92
    if:
      type: text
      substr: /etc/security/passwd
  - id: rust-password-dictionary-core
    desc: Rust core password dictionary
    crit: component
    conf: 0.9
    if:
      type: text
      regex: '"(password|passw0rd|letmein|changeme|qwerty)"'
    unless:
      - type: text
        regex: 'ResponseValidationHook::new|test_response_validation|detects_sensitive_content'
  # db2inst1 and c2admin are AIX/DB2 default service accounts -- naming one is
  # narrow enough to stand alone. "qwerty" is not: it moved to the component
  # dictionary above after cargo's own testsuite tripped this rule on a
  # `name = "qwerty"` fixture in tests/testsuite/rename_deps.rs.
  - id: rust-password-dictionary-aix
    desc: Rust AIX password dictionary
    crit: suspicious
    conf: 0.9
    if:
      type: text
      regex: '"(db2inst1|c2admin)"'
    unless:
      - id: well-known/app/communication/thunderbird::firefox-source-tree-path
      - id: metadata/package/testing/harness/unit::rust-test
      - id: well-known/lib/data/rusqlite::crate-context
  - id: rust-bruteforce-password-loop
    desc: Rust brute-force password loop
    crit: suspicious
    conf: 0.9
    if:
      type: text
      regex: 'attempt_brute_force[\s\S]{0,260}simple_hash'
composite_rules:
  - id: rust-aix-local-hash-cracking
    desc: Rust AIX local hash cracking
    crit: hostile
    conf: 0.97
    all:
      - id: rust-aix-security-passwd-read
      - id: rust-password-dictionary-core
    any:
      - id: rust-password-dictionary-aix
      - id: rust-bruteforce-password-loop
    needs: 1
