defaults:
  platforms: [unix, windows]
  for: [python, c, cpp, rust, go, shell, javascript, typescript]

composite_rules:
  - id: lattice-public-key-recovery-attack
    desc: Lattice attack recovers a secret key from a public key
    crit: hostile
    conf: 0.99
    all:
      - id: micro-behaviors/crypto/asymmetric/key::public-key-secret-key-recovery-flow
      - id: micro-behaviors/crypto/asymmetric/key::lattice-short-vector-search

  - id: verified-lattice-key-recovery-attack
    desc: Lattice key-recovery attack validates the recovered signing key
    crit: hostile
    conf: 0.99
    all:
      - id: micro-behaviors/crypto/asymmetric/key::public-key-secret-key-recovery-flow
      - id: micro-behaviors/crypto/asymmetric/key::lattice-short-vector-search
      - id: micro-behaviors/crypto/asymmetric/key::recovered-key-signature-verification

  - id: reduced-round-cipher-cryptanalysis
    desc: Reduced-round cipher meet-in-the-middle cryptanalysis
    crit: suspicious
    conf: 0.96
    all:
      - id: micro-behaviors/crypto/symmetric/analysis::reduced-round-chosen-plaintext-analysis
      - id: micro-behaviors/crypto/symmetric/analysis::invariant-fingerprint-key-guess-elimination

  - id: reduced-round-table-key-guess-attack
    desc: Reduced-round cipher table key-guess attack
    crit: suspicious
    conf: 0.95
    all:
      - id: micro-behaviors/crypto/symmetric/analysis::reduced-round-chosen-plaintext-analysis
      - id: micro-behaviors/crypto/symmetric/analysis::offline-table-key-guess-search
