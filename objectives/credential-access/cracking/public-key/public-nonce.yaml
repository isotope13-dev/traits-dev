defaults:
  platforms: [unix, windows]
  for: [go, python]
composite_rules:
  - id: tor-public-nonce-scalar-recovery
    desc: Tor public nonce with signature split and inverse/subtraction math
    crit: suspicious
    conf: 0.98
    # Co-occurrence, not a claim of executed data flow or service takeover.
    near_bytes: 4096
    all:
      - id: micro-behaviors/crypto/kdf/public-prefix
      - id: micro-behaviors/data/buffer/carve::split-at-32
      - id: micro-behaviors/data/arithmetic::difference-with-inverse
