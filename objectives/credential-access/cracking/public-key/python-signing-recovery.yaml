defaults:
  for:
  - python
  platforms:
  - unix
  - windows
composite_rules:
- id: tor-public-nonce-signing-key-recovery
  desc: Tor public-nonce recovery uses repeated scalar inversion
  crit: hostile
  conf: 0.98
  all:
  - id: objectives/credential-access/cracking/public-key::tor-public-nonce-scalar-recovery
  - id: micro-behaviors/data/arithmetic::python-repeated-modular-inverse
  - id: micro-behaviors/crypto/asymmetric/ed25519::python-ed25519-base-point
  unless:
  - id: metadata/lang/source/shape::python-literal-module-quoted-source
