# Recovering a wireless network's WPS PIN, and through it the WPA passphrase.
#
# Every mainstream tool for this — Dumpper, WPSApp, WPSPin, OneShot, Waircut,
# routersploit's wps modules — works the same way: derive the router's factory
# default PIN from its BSSID using a per-vendor algorithm, then register with
# it. The vendor algorithm names are the durable part; the tooling around them
# is rewritten constantly and in whatever language is convenient, which is why
# this reads the algorithm table rather than any one program's structure.
#
# The name alone is not the finding. "EasyBox" is a consumer router brand and
# appears in support documentation, inventory tools and firmware images that
# attack nothing, so the wireless-enumeration context has to be present too.
defaults:
  platforms: [windows, linux, unix]
  for: [pe, elf, macho, csharp, python, shell, c, cpp]
  attack: T1110
  mbc: E1110

composite_rules:
  - id: wps-default-pin-recovery
    desc: Derives WPS PINs from router defaults
    crit: suspicious
    conf: 0.9
    all:
      - id: micro-behaviors/hardware/wireless/network::wps-default-pin-algorithm-name
    any:
      - id: micro-behaviors/hardware/wireless/network::bssid
      - id: micro-behaviors/hardware/wireless/network::bssid-token-reference
      - id: micro-behaviors/hardware/wireless/network::wps-supplicant

  - id: wps-pin-generator-implementation
    desc: Implements a WPS PIN generator
    crit: suspicious
    conf: 0.95
    any:
      - id: micro-behaviors/hardware/wireless/network::wps-pin-checksum-digit
      - id: micro-behaviors/hardware/wireless/network::wps-pin-from-bssid-heuristic
