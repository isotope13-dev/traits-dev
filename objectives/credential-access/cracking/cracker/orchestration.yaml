# Front ends and job runners for offline password cracking (hashcat-style
# engines). They configure wordlist/mask attacks against uploaded hash lists
# and track the recovered plaintexts in a potfile. That is offensive tooling
# for authorized audits, not an implant, so the composites stay suspicious.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, go, python]
  attack: T1110.002

traits:
  - id: hybrid-attack-mode-pair
    desc: Names both hybrid wordlist/mask attack modes
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)hybrid\W{0,3}wordlist\W{0,5}mask[\s\S]{0,600}hybrid\W{0,3}mask\W{0,5}wordlist'

  - id: mask-charset-placeholder-run
    desc: Cracking mask with charset placeholders
    crit: notable
    conf: 0.85
    if:
      type: text
      regex: '(\?[ludsabh]){4,}'

  - id: potfile-reference
    desc: References a cracked-hash potfile
    crit: notable
    conf: 0.85
    if:
      type: text
      regex: '(?i)\bpot_?file\b'

  - id: hashlist-reference
    desc: References uploaded hash lists
    crit: notable
    conf: 0.8
    if:
      type: text
      regex: '(?i)\bhash_?lists?\b'

  - id: cracked-hash-wording
    desc: Reports cracked hashes
    crit: notable
    conf: 0.8
    if:
      type: text
      regex: '(?i)\bcracked\b'

composite_rules:
  - id: cracking-attack-mode-builder
    desc: Configures wordlist and mask cracking attacks
    crit: suspicious
    conf: 0.9
    all:
      - id: hybrid-attack-mode-pair
      - id: mask-charset-placeholder-run

  - id: cracked-hash-potfile-management
    desc: Manages hash lists and cracked potfile
    crit: suspicious
    conf: 0.88
    all:
      - id: potfile-reference
      - id: hashlist-reference
      - id: cracked-hash-wording
