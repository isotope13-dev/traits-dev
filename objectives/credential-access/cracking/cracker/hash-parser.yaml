# Credential Cracking Tools
# Detects tools used for credential cracking or hash manipulation
defaults:
  platforms: [unix, windows]
  for: [python]
composite_rules:
  # A Tk window that names hash algorithms and touches the clipboard is any
  # GUI toolkit with a checksum helper -- it fired on FreeSimpleGUI. The
  # cracking claim has to come from cracking vocabulary, not from the widgets.
  - id: gui-hash-parser
    desc: "GUI-based Hash Parser/Generator"
    crit: suspicious
    conf: 0.85
    all:
      - id: micro-behaviors/ui/window/lifecycle::tkinter-init
      - id: micro-behaviors/data/parse/analysis::hash-algo-strings
      - id: micro-behaviors/os/clipboard/write::tkinter-clipboard-append
      - id: micro-behaviors/data/parse/vocabulary::hash-cracking-vocabulary
