defaults:
  platforms: [linux]
  crit: suspicious
  conf: 0.95
  attack: T1552.003

traits:
  - id: shell-history-source-copy
    desc: Copies a user shell history file
    for: [shell]
    if:
      type: tree-sitter
      language: shell
      query: |
        ((command name: (command_name) @tool
           argument: (_) @source
           argument: (_) @following) @copy
         (#match? @tool "^(/(usr/)?bin/)?cp$")
         (#match? @source "^[\"']?/(root|home/[^/\"' ]+)/\\.(bash|zsh|sh)_history[\"']?$")
         (#not-match? @following "^[\"']?-")
         (#not-match? @copy "[ \\t](-[A-Za-z]*t|--target-directory)"))
  - id: call-history-source-copy
    desc: Copies a user shell history file
    for: [python]
    if:
      type: symbol
      kind: call
      regex: '^shutil\.(copy|copy2|copyfile)$'
      arg:
        index: 0
        from:
          whole_value: '^/(root|home/[^/]+)/\.(bash|zsh|sh)_history$'
  - id: php-history-source-copy
    desc: Copies a user shell history file
    for: [php]
    if:
      type: symbol
      kind: call
      exact: copy
      arg:
        index: 0
        regex: '^/(root|home/[^/]+)/\.(bash|zsh|sh)_history$'
