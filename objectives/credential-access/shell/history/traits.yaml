defaults:
  attack: T1552.003
  for:
  - shell
  - python
  - elf
  - macho
  - go
  - c
  - cpp
  - objc
  platforms:
  - unix
traits:
- id: jvm-bash-history-bytecode-path
  desc: JVM bytecode bash history path
  crit: notable
  conf: 0.92
  for: [class, java_class]
  if:
    type: value
    path: class.strings[*]
    regex: '(^|[/\\])\.bash_history$'
- id: jvm-zsh-history-bytecode-path
  desc: JVM bytecode zsh history path
  crit: notable
  conf: 0.92
  for: [class, java_class]
  if:
    type: value
    path: class.strings[*]
    regex: '(^|[/\\])\.zsh_history$'
- id: shell-history
  desc: Bash shell history file access
  crit: notable
  conf: 0.8
  if:
    type: literal
    regex: "(^|[~/\\\\'\"`=\\s])\\.bash_history\\b|/commandhistory/\\.bash_history\\b"
  unless:
  - type: basename
    regex: ^(bash|test_.*)\.py$
  - id: metadata/file/string/identity::system-shell-basename
  - id: well-known/tool/detection/llm-scanner/
  downgrade:
    any:
    - type: basename
      regex: ^shell$
    - type: basename
      regex: ^sh$
    - type: text
      substr: $("$fuzzy" < "$hist_file")
- id: zsh-history
  desc: Zsh shell history file access
  crit: notable
  conf: 0.8
  if:
    type: text
    regex: "(^|[~/\\\\'\"`=\\s])\\.zsh_history\\b"
  unless:
  - type: basename
    regex: ^(zsh|test_.*)\.py$
  # Terminal-emulator shell integration (VS Code, Qt Creator, iTerm2) configures
  # HISTFILE to the canonical history path via ZDOTDIR — that is setup, not theft.
  - type: text
    regex: 'HISTFILE=[^\n]{0,40}\.zsh_history'
  downgrade:
    any:
    - type: basename
      exact: zsh
    - type: basename
      regex: n?vim
    - type: text
      substr: $("$fuzzy" < "$hist_file")
    - type: text
      regex: com\.apple\.[a-z][a-z0-9.-]+
- id: fish-history
  desc: Fish shell history file access
  crit: notable
  conf: 0.8
  if:
    type: text
    substr: .local/share/fish/fish_history
  unless:
  - id: metadata/package/testing/presence/harness::go-test-file
  - id: well-known/tool/detection/bagel::bagel-go-module-path
  downgrade:
    any:
    - type: basename
      exact: fish
    - type: text
      substr: $("$fuzzy" < "$hist_file")
- id: mysql-history
  desc: MySQL client history file access
  crit: suspicious
  conf: 0.85
  if:
    type: text
    regex: '(?i)\\b(c(at|p)|rm|grep)\\b[^\\n]{0,80}\\.mysql_history\\b'
  unless:
  - id: well-known/tool/detection/malcontent::malcontent-defensive-scanner-context
  - type: basename
    exact: mysql
  - type: basename
    exact: mariadb
  - type: basename
    regex: ^n?vim$
- id: psql-history
  desc: Reads PostgreSQL psql history file
  crit: suspicious
  conf: 0.85
  if:
    type: text
    # A scanner's deny-list can contain this filename without touching it.
    # Require a file-reading/copying operation on the same source line so a
    # literal target list is not classified as history theft.
    regex: '(?i)\b(cat|cp|grep)\s+.{0,60}\.psql_history\b'
  unless:
  - id: well-known/tool/detection/tool-guard-core::defensive-attack-corpus-context
  - id: well-known/tool/detection/tool-guard-core::postgres-attack-fixture
  - type: basename
    exact: psql
  - id: well-known/app/data/postgresql::postgresql-source-tree
  - id: metadata/package/testing/presence/harness::go-test-file
  - id: well-known/tool/detection/bagel::bagel-go-module-path
- id: python-history
  desc: Python REPL history file access
  crit: notable
  conf: 0.8
  if:
    type: text
    # Capture the stdlib's "register ~/.python_history" wording in the
    # evidence span so it can be excluded without suppressing other paths in
    # a frozen Python application.
    regex: '(?i)\bregister\s+~/\.python_history\b|(^|[~/\\"''`=\s])\.python_history\b'
  not:
  - regex: '(?i)^register\s+~/\.python_history$'
  unless:
  - type: basename
    regex: '^python\d+(\.\d+)*$'
- id: history-cmd
  desc: Shell history builtin invocation
    # Use the shell symbol table (cleave extracts command invocations as
    # symbols) — avoids collisions with `"history"` dict keys, attribute
    # access (`resp.history`), type annotations (`history: List[…]`), etc.
  crit: notable
  conf: 0.78
  for: [shell]
  unless:
  - id: metadata/package/testing/presence/harness/
  - id: metadata/build/package/maintainer-scripts::cloud-marketplace-cleanup-script
  - id: well-known/app/enterprise/egroupware/
  if:
    type: symbol
    exact: history
- id: shell-history-unless-cond-1--rx-1
  desc: Regex component marker
  crit: component
  conf: 0.8
  if:
    type: text
    regex: '\{\s*glob = "\.bash_history"\s*\}'
- id: shell-history-unless-cond-1--rx-2
  desc: Exports HISTFILE to a shared path
  crit: notable
  conf: 0.8
  if:
    type: text
    substr: export HISTFILE=/commandhistory/.bash_history
- id: deny-block-list-vocabulary
  desc: Deny/block list vocabulary
  crit: component
  conf: 0.3
  if:
    type: text
    regex: '(?i)(deny|block)(list|patterns)\b'
  unless:
  - type: trait
    id: metadata/file/extension/identity::linux-kernel-package-artifact-basename
  - id: well-known/app/system/drivers/
- id: allow-list-vocabulary
  desc: Allow-list vocabulary
  crit: component
  conf: 0.3
  if:
    type: text
    regex: '(?i)(allow|white)(list|patterns)\b'
  unless:
  - type: trait
    id: metadata/file/extension/identity::linux-kernel-package-artifact-basename
  - id: well-known/app/system/drivers/
- id: blocklist-vocabulary
  desc: Blocklist vocabulary
  crit: component
  conf: 0.3
  if:
    type: text
    regex: '(?i)(black)(list|patterns)\b'
  unless:
  - type: trait
    id: metadata/file/extension/identity::linux-kernel-package-artifact-basename
  - id: well-known/app/system/drivers/
composite_rules:
- id: shell-history-file-reference
  desc: References a shell history file
  crit: notable
  conf: 0.9
  for: [scripts, source, class, java_class]
  any:
  - id: objectives/credential-access/files/config::login-secret-file-paths--rx-7
  - id: jvm-bash-history-bytecode-path
  - id: jvm-zsh-history-bytecode-path

- id: shell-history-file-read
  desc: Reads a referenced shell history file
  crit: notable
  conf: 0.94
  for: [scripts, source]
  near_bytes: 800
  all:
  - id: shell-history-file-reference
  any:
  - id: micro-behaviors/fs/read/file/full/
  - id: micro-behaviors/fs/read/file/handle/

- id: history-theft
  desc: Shell history path or copy command reference
  # Most legs are path or command references; actual theft requires a nearby
  # read/copy and should be inferred by a more specific composite.
  crit: notable
  conf: 0.8
  mbc: E1552
  all:
  - id: micro-behaviors/fs/read/
  any:
  - id: shell-history
  - id: zsh-history
  - id: fish-history
  - id: mysql-history
  - id: psql-history
  - id: python-history
  - id: objectives/credential-access/shell/history::powershell-history-theft
  downgrade:
    any:
    - id: metadata/binary/vendor/
    - id: metadata/vendor/identity::apple-what-version-banner
  unless:
    - id: well-known/app/utility/cmdchamp/
    - id: well-known/app/utility/iris::iris-autocomplete-context
    - id: well-known/tool/detection/llm-scanner/
- id: shell-history-unless-cond-1--rx-helper-6
  desc: Regex component marker
  crit: component
  conf: 1.0
  any:
  - id: shell-history-unless-cond-1--rx-1
  - id: shell-history-unless-cond-1--rx-2
  - id: deny-block-list-vocabulary
  - id: allow-list-vocabulary
  - id: blocklist-vocabulary
- id: zsh-history-unless-cond-2--rx-helper-10
  desc: Regex component marker
  crit: component
  conf: 1.0
  any:
  - id: objectives/credential-access/shell/history::deny-block-list-vocabulary
  - id: objectives/credential-access/shell/history::allow-list-vocabulary
  - id: objectives/credential-access/shell/history::blocklist-vocabulary
