defaults:
  attack: T1552.003
  for:
  - shell
  - python
  - elf
  - macho
  - go
  - c
  - cpp
  - objc
  platforms:
  - unix
traits:
- id: jvm-bash-history-bytecode-path
  desc: JVM bytecode bash history path
  crit: notable
  conf: 0.92
  for: [class, java_class]
  if:
    type: value
    path: class.strings[*]
    regex: '(^|[/\\])\.bash_history$'
- id: jvm-zsh-history-bytecode-path
  desc: JVM bytecode zsh history path
  crit: notable
  conf: 0.92
  for: [class, java_class]
  if:
    type: value
    path: class.strings[*]
    regex: '(^|[/\\])\.zsh_history$'
- id: shell-history
  desc: Bash shell history file access
  crit: notable
  conf: 0.8
  if:
    type: literal
    regex: "(^|[~/\\\\'\"`=\\s])\\.bash_history\\b|/commandhistory/\\.bash_history\\b"
  unless:
  - type: basename
    regex: ^(bash|test_.*)\.py$
  - id: metadata/file/string/identity::system-shell-basename
  - id: well-known/tool/detection/llm-scanner/
  downgrade:
    any:
    - type: basename
      regex: ^shell$
    - type: basename
      regex: ^sh$
    - id: micro-behaviors/fs/path/personal::fuzzy-history-picker-source
- id: mysql-history
  desc: MySQL client history file access
  crit: suspicious
  conf: 0.85
  if:
    type: text
    regex: '(?i)\\b(c(at|p)|rm|grep)\\b[^\\n]{0,80}\\.mysql_history\\b'
  unless:
  - id: well-known/tool/detection/malcontent::malcontent-defensive-scanner-context
  - type: basename
    exact: mysql
  - type: basename
    exact: mariadb
  - type: basename
    regex: ^n?vim$
- id: psql-history
  desc: Reads PostgreSQL psql history file
  crit: suspicious
  conf: 0.85
  if:
    type: text
    # A scanner's deny-list can contain this filename without touching it.
    # Require a file-reading/copying operation on the same source line so a
    # literal target list is not classified as history theft.
    regex: '(?i)\b(cat|cp|grep)\s+.{0,60}\.psql_history\b'
  unless:
  - id: well-known/tool/detection/tool-guard-core::defensive-attack-corpus-context
  - id: well-known/tool/detection/tool-guard-core::postgres-attack-fixture
  - type: basename
    exact: psql
  - id: well-known/app/data/postgresql::postgresql-source-tree
  - id: metadata/package/testing/presence/harness::go-test-file
  - id: well-known/tool/detection/bagel::bagel-go-module-path
- id: history-cmd
  desc: Shell history builtin invocation
    # Use the shell symbol table (cleave extracts command invocations as
    # symbols) — avoids collisions with `"history"` dict keys, attribute
    # access (`resp.history`), type annotations (`history: List[…]`), etc.
  crit: notable
  conf: 0.78
  for: [shell]
  unless:
  - id: metadata/package/testing/presence/harness/
  - id: metadata/build/package/maintainer-scripts::cloud-marketplace-cleanup-script
  - id: well-known/app/enterprise/egroupware/
  if:
    type: symbol
    exact: history
- id: shell-history-unless-cond-1--rx-1
  desc: Regex component marker
  crit: component
  conf: 0.8
  if:
    type: text
    regex: '\{\s*glob = "\.bash_history"\s*\}'
- id: shell-history-unless-cond-1--rx-2
  desc: Exports HISTFILE to a shared path
  crit: notable
  conf: 0.8
  if:
    type: text
    substr: export HISTFILE=/commandhistory/.bash_history
- id: deny-block-list-vocabulary
  desc: Deny/block list vocabulary
  crit: component
  conf: 0.3
  if:
    type: text
    regex: '(?i)(deny|block)(list|patterns)\b'
  unless:
  - type: trait
    id: metadata/file/extension/identity::linux-kernel-package-artifact-basename
  - id: well-known/app/system/drivers/
- id: allow-list-vocabulary
  desc: Allow-list vocabulary
  crit: component
  conf: 0.3
  if:
    type: text
    regex: '(?i)(allow|white)(list|patterns)\b'
  unless:
  - type: trait
    id: metadata/file/extension/identity::linux-kernel-package-artifact-basename
  - id: well-known/app/system/drivers/
- id: blocklist-vocabulary
  desc: Blocklist vocabulary
  crit: component
  conf: 0.3
  if:
    type: text
    regex: '(?i)(black)(list|patterns)\b'
  unless:
  - type: trait
    id: metadata/file/extension/identity::linux-kernel-package-artifact-basename
  - id: well-known/app/system/drivers/
composite_rules:
- id: shell-history-file-reference
  desc: References a shell history file
  crit: notable
  conf: 0.9
  for: [scripts, source, class, java_class]
  any:
  - id: micro-behaviors/fs/path/personal::bash-zsh-history-path-text
  - id: jvm-bash-history-bytecode-path
  - id: jvm-zsh-history-bytecode-path

- id: shell-history-file-read
  desc: Reads a referenced shell history file
  crit: notable
  conf: 0.94
  for: [scripts, source]
  near_bytes: 800
  all:
  - id: shell-history-file-reference
  any:
  - id: micro-behaviors/fs/read/file/full/
  - id: micro-behaviors/fs/read/file/handle/

- id: shell-history-unless-cond-1--rx-helper-6
  desc: Regex component marker
  crit: component
  conf: 1.0
  any:
  - id: shell-history-unless-cond-1--rx-1
  - id: shell-history-unless-cond-1--rx-2
  - id: deny-block-list-vocabulary
  - id: allow-list-vocabulary
  - id: blocklist-vocabulary
- id: zsh-history-unless-cond-2--rx-helper-10
  desc: Regex component marker
  crit: component
  conf: 1.0
  any:
  - id: deny-block-list-vocabulary
  - id: allow-list-vocabulary
  - id: blocklist-vocabulary
