defaults:
  platforms: [qnx, unix]
  for: [typescript, javascript]
  attack: T1552.003

traits:
  - id: commented-shell-history-command
    desc: History command named in a comment
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?m)^\s*(\*|//).{0,200}cat ~/\.(bash|zsh)_history'
  - id: qnx-ts-shell-history-cat
    desc: QNX TS shell history cat
    crit: suspicious
    conf: 0.9
    if:
      type: text
      regex: 'cat ~/\.(bash|zsh)_history'
    unless:
      # Agent-runtime security tests enumerate blocked commands (e.g. an
      # intervention checker asserting `cat ~/.bash_history` is denied);
      # the pattern is the test subject, not an instruction to run it.
      - id: metadata/package/testing/presence/harness::tests-path-filename
      - id: well-known/tool/detection/ai-guardrail::command-rule-corpus
      # A guardrail policy doc names the command inside a comment to
      # document the rule covering it; the mention is prose, not theft.
      - id: commented-shell-history-command

composite_rules:
  - id: qnx-ts-shell-history-exfil
    desc: QNX TS shell history exfil
    crit: hostile
    conf: 0.96
    all:
      - id: qnx-ts-shell-history-cat
      - id: objectives/command-and-control/remote-command/appliance::qnx-ts-automation-cmd-log
      - id: objectives/command-and-control/remote-command/appliance::qnx-ts-https-collect-post
