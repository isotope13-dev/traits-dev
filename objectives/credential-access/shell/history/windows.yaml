# Windows Shell History Theft
# Detects access to PowerShell ConsoleHost_history and similar files
# ATT&CK: T1552.003 (Credentials from Password Stores: Bash History)
# Used by: OtterCookie, various infostealers
defaults:
  attack: T1552.003
  for:
  - scripts
  - binaries
  platforms:
  - windows
  - unix
traits: []
composite_rules:
- id: powershell-history-path
  desc: PowerShell history path marker
  crit: component
  conf: 0.85
  any:
  - id: micro-behaviors/fs/path/personal::consolehost-history-path-reference
  - id: micro-behaviors/fs/path/personal::psreadline-history-path-reference
- id: powershell-history-theft
  desc: PowerShell command history theft
  crit: suspicious
  conf: 0.85
  mbc: E1552
  all:
  - id: micro-behaviors/fs/path/personal::consolehost-history-reference
  - id: powershell-history-path
  any:
  - id: objectives/exfiltration/stealer/wallet::networked-wallet-and-credential-file-stealer
  - id: objectives/exfiltration/messaging/
  - id: micro-behaviors/communications/http/upload/
  # UploadData used to reach this list through the telegram directory.
  unless:
  - id: metadata/file/naming::generated-attack-map-context
  - id: well-known/app/ai/coding-agent/
