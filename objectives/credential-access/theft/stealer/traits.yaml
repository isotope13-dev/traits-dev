defaults:
  attack: T1555
  mbc: B0028
  platforms:
    - unix
    - windows
  for: [scripts, binaries]

traits:
  - id: family-layout-redline
    desc: Redline, Vidar, or Lumma layout marker
    crit: suspicious
    conf: 0.97
    for: [go]
    if:
      type: text
      regex: '(?i)\bStealer(Redline|Vidar|Lumma)\b'

  - id: family-layout-stealc
    desc: StealC, Katz, or Remus layout marker
    crit: suspicious
    conf: 0.97
    for: [go]
    if:
      type: text
      regex: '(?i)\bStealer(StealC|Katz|Remus)\b'

  - id: family-layout-shapeshifter
    desc: ShapeShifter or Bee layout marker
    crit: suspicious
    conf: 0.97
    for: [go]
    if:
      type: text
      regex: '(?i)\bStealer(ShapeShifter|Bee)\b'

  - id: block-parser-symbol
    desc: Credential block parser symbol
    crit: notable
    conf: 0.95
    for: [go]
    if:
      type: text
      substr: ParseBlockFormat

  - id: url-key
    desc: URL credential field key
    crit: component
    conf: 0.95
    for: [go]
    if:
      type: text
      substr: urlKey

  - id: login-key
    desc: Login credential field key
    crit: component
    conf: 0.95
    for: [go]
    if:
      type: text
      substr: loginKey

  - id: password-key
    desc: Password credential field key
    crit: component
    conf: 0.95
    for: [go]
    if:
      type: text
      substr: passwordKey

  - id: url-login-pass-output
    desc: URL-login-password output schema
    crit: notable
    conf: 0.95
    for: [go]
    if:
      type: text
      substr: URL:LOGIN:PASS

  - id: credential-entry-output
    desc: Credential entry output symbol
    crit: notable
    conf: 0.95
    for: [go]
    if:
      type: text
      substr: PasswordEntry

composite_rules:
  - id: infostealer-family-layout
    desc: Named infostealer layout family
    crit: suspicious
    conf: 0.97
    for: [go]
    any:
      - id: family-layout-redline
      - id: family-layout-stealc
      - id: family-layout-shapeshifter

  - id: credential-record-block-parser
    desc: URL-login-password block parser
    crit: notable
    conf: 0.95
    for: [go]
    all:
      - id: block-parser-symbol
      - id: url-key
      - id: login-key
      - id: password-key

  - id: credential-record-output
    desc: Extracted credential output
    crit: notable
    conf: 0.95
    for: [go]
    any:
      - id: url-login-pass-output
      - id: credential-entry-output

  - id: go-infostealer-log-credential-extractor
    desc: Go source extracts credentials from infostealer logs
    crit: hostile
    conf: 0.995
    for: [go]
    all:
      - id: infostealer-family-layout
      - id: credential-record-block-parser
      - id: credential-record-output

  - id: archive-infostealer-log-extractor
    desc: Archive bundles an infostealer log extractor
    crit: hostile
    conf: 0.995
    for: [zip]
    scope: archive
    all:
      - id: infostealer-family-layout
      - id: credential-record-block-parser
      - id: credential-record-output
