# A PhaaS victim-submission record couples full payment-card data with
# purchase-item context in one server-side record: the card tuple
# (`card_number` plus `expiry_date` and/or `verify_code`) stored next to the
# order tuple (`goods_name`, `goods_price`, `SelectGoods`). Retaining raw PAN
# beside merchandise fields is what a harvest controller does; payment
# processors tokenize instead, which is why processor SDKs and test fixtures
# are carved out below rather than counted as evidence.
#
# Both composites require the two roles separately: an `all:` leg pins the
# card tuple, an `any:` leg pins the goods context, so two card fields alone
# (an ordinary card form) or two goods fields alone (an ordinary catalog)
# cannot convict.
#
# ATT&CK: T1555 (Credentials from Password Stores), T1005 (Data from Local System)
defaults:
  platforms: [unix, windows]
  for: [go, python, javascript, typescript, php, ruby, java]
  attack: T1555
  mbc: B0028

composite_rules:
  - id: full-card-data-goods-paired-harvest
    desc: Full card data paired with purchase-item record
    crit: hostile
    conf: 0.92
    scope: file
    all:
      - id: micro-behaviors/data/parse/payment::card-number-snake-field
      - id: micro-behaviors/data/parse/payment::card-expiry-date-field
    any:
      - id: micro-behaviors/data/property/assign::goods-name-field
      - id: micro-behaviors/data/property/assign::goods-price-field
      - id: micro-behaviors/data/property/assign::select-goods-record
    unless:
      - id: well-known/lib/vendor-sdk/stripe/
      - id: well-known/lib/vendor-sdk/braintree/
      - id: metadata/package/testing/presence/fixture::test-filename-pattern
      - id: metadata/package/testing/presence/harness::python-test-file

  - id: verify-code-card-data-goods-paired-harvest
    desc: Card number and verification code paired with purchase-item record
    crit: hostile
    conf: 0.9
    scope: file
    all:
      - id: micro-behaviors/data/parse/payment::card-number-snake-field
      - id: micro-behaviors/data/parse/payment::card-verify-code-field
    any:
      - id: micro-behaviors/data/property/assign::goods-name-field
      - id: micro-behaviors/data/property/assign::goods-price-field
      - id: micro-behaviors/data/property/assign::select-goods-record
    unless:
      - id: well-known/lib/vendor-sdk/stripe/
      - id: well-known/lib/vendor-sdk/braintree/
      - id: metadata/package/testing/presence/fixture::test-filename-pattern
      - id: metadata/package/testing/presence/harness::python-test-file
