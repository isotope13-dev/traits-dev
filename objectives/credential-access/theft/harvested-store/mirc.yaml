# Announcing "Username:" and "Password:" on an IRC message, in a script
# that also mounts a share with `/user:`, is the worm reporting the
# credential it just used. Either half alone is only a claim.
defaults:
  platforms: [windows, unix]
  for: [mirc]
  attack: T1552
composite_rules:
  - id: mirc-announces-share-credentials
    desc: mIRC reports share username and password
    crit: hostile
    conf: 0.94
    all:
      - id: objectives/command-and-control/channel/irc/client::mirc-msg-username-password
      - id: micro-behaviors/os/network/share::net-use-explicit-user
  # A password dialog whose entry is messaged to NickServ steals the
  # victim's services password: the dialog harvests it, `.msg ns identify`
  # walks it out, and the help-named log keeps a second copy. The dialog
  # plus the NickServ send alone is ordinary auto-identify scripting.
  - id: mirc-password-dialog-credential-theft
    desc: mIRC password dialog steals services credentials
    crit: hostile
    conf: 0.95
    for: [mirc, text, data]
    all:
      - id: objectives/command-and-control/channel/irc/client::mirc-password-dialog-open
      - id: objectives/command-and-control/channel/irc/client::mirc-ns-identify-send
    any:
      - id: objectives/command-and-control/channel/irc/client::mirc-password-log-write
