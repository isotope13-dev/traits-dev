# Correlation of separately stored AWS access-key and secret-key records. The
# SQL mechanics live under micro-behaviors/data/db/sql; this objective gives
# their combination weight as a harvested-credential pairing operation.
defaults:
  platforms: [unix, windows]
  for: [scripts, source]
  attack: T1552.005

composite_rules:
  - id: aws-credential-record-pair-correlation
    desc: Correlates stored AWS credential records
    crit: suspicious
    conf: 0.97
    near_lines: 24
    all:
      - id: micro-behaviors/data/db/access::aws-credential-pair-select-projection
      - id: micro-behaviors/data/db/access::credential-record-join
      - id: micro-behaviors/data/db/access::aws-access-key-kind-predicate
      - id: micro-behaviors/data/db/access::aws-secret-key-kind-predicate
    unless:
      - id: well-known/tool/detection/security-scanner/
      - id: well-known/tool/detection/threat-intel/
