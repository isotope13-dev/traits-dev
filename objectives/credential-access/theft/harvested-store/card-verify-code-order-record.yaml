# A server-side record that retains the card verification code (CVV/CVC)
# beside the card number and purchase-item context (`goods_name`,
# `goods_price`, `SelectGoods`). PCI DSS forbids storing the verification
# code after authorization, so keeping it in an order record is unusual;
# PhaaS harvest panels do this, but so do naive shop checkouts. Card number
# plus expiry beside goods fields is an ordinary checkout and is not
# counted. Without exfiltration or brand impersonation this is suspicious,
# not hostile.
#
# The `all:` leg pins the card tuple, the `any:` leg pins the goods context,
# so a card form alone or a catalog alone cannot fire.
#
# ATT&CK: T1005 (Data from Local System)
defaults:
  platforms: [unix, windows]
  for: [go, python, javascript, typescript, php, ruby, java]
  attack: T1005

composite_rules:
  - id: verify-code-card-data-goods-record
    desc: Card verification code kept in order record
    crit: suspicious
    conf: 0.8
    scope: file
    all:
      - id: micro-behaviors/data/parse/payment::card-number-snake-field
      - id: micro-behaviors/data/parse/payment::card-verify-code-field
    any:
      - id: micro-behaviors/data/property/assign::goods-name-field
      - id: micro-behaviors/data/property/assign::goods-price-field
      - id: micro-behaviors/data/property/assign::select-goods-record
    unless:
      - id: well-known/lib/vendor-sdk/stripe/
      - id: well-known/lib/vendor-sdk/braintree/
      - id: metadata/package/testing/presence/fixture::test-filename-pattern
      - id: metadata/package/testing/presence/harness::python-test-file
