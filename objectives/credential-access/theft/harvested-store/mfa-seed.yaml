# Seed material for time-based one-time passwords. A TOTP seed is the whole of
# the second factor: whoever holds it can generate valid codes indefinitely, so
# an actor who reaches an appliance's seed store keeps working access even
# after every password is rotated. Naming a seed store is ordinary for an
# authentication product; reading one out in bulk, or sweeping a config tree
# for it, is what the composite requires.
defaults:
  platforms: [unix, windows]
  for: [shell, python, javascript, go, ruby, perl, java]
  attack: T1111
  mbc: E1111

traits:
  - id: totp-seed-store-identifier
    desc: TOTP or MFA seed store identifier
    crit: notable
    conf: 0.85
    if:
      type: text
      regex: '(?i)(for\s+\w+\s+in.{0,96}(totp|mfa)[_-]?seeds?\b|["''/_](totp|mfa)[_-]?seeds?["''/])'

composite_rules:
  - id: mfa-seed-bulk-harvest
    desc: MFA seed store read in bulk
    crit: suspicious
    conf: 0.92
    all:
      - id: totp-seed-store-identifier
    any:
      - id: objectives/execution/exploit/service-command-injection::couchdb-bulk-document-read
      - id: micro-behaviors/fs/search::recursive-secret-key-grep
    needs: 1
