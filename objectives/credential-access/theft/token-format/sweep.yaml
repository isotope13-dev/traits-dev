# Live-token format sweep patterns.
#
# Credential stealers that harvest whatever they find — sckit's agent package,
# cross-ecosystem npm worms, generic infostealers — carry one matching pattern
# that recognizes the live token formats of many unrelated providers at once:
# JSON Web Tokens plus AWS access keys, GitHub (PAT and gh* app tokens),
# GitLab, npm, PyPI, Hugging Face, Vault, Slack, Stripe and SendGrid. The
# pattern runs over environment values and swept file contents, so it
# survives porting between languages and appears verbatim in compiled
# binaries. No service consumes a rival's credentials: a matcher for
# four-plus unrelated providers' token formats in one file is a harvesting
# instrument (or a secret scanner, which the exceptions cover).
#
# Each atom below matches the *pattern form* of one provider's token: the
# prefix immediately followed by the character class of a scanning regex
# (`github_pat_[A-Za-z0-9_]`, `(AKIA|ASIA)[A-Z0-9]{16}`). Live tokens are the
# hardcoded-secret atoms' territory elsewhere in this tree; what identifies
# the sweep instrument is the breadth of formats its one pattern knows.
defaults:
  platforms: [unix, windows]
  for: [scripts, source, binaries]
  crit: notable
  conf: 0.9
  attack: T1552.001
  mbc: E1552

traits:
  - id: github-token-format-pattern
    desc: GitHub token-format scan pattern
    if:
      type: text
      regex: 'github_pat_[\[\\]|gh[opusr]_[\[\\]'
  - id: gitlab-token-format-pattern
    desc: GitLab token-format scan pattern
    if:
      type: text
      substr: glpat-[
  - id: npm-token-format-pattern
    desc: npm token-format scan pattern
    if:
      type: text
      substr: npm_[
  - id: pypi-token-format-pattern
    desc: PyPI token-format scan pattern
    if:
      type: text
      substr: pypi-[
  - id: huggingface-token-format-pattern
    desc: Hugging Face token-format pattern
    if:
      type: text
      substr: hf_[
  - id: vault-token-format-pattern
    desc: Vault token-format scan pattern
    if:
      type: text
      substr: hvs.[
  - id: slack-token-format-pattern
    desc: Slack token-format scan pattern
    if:
      type: text
      regex: 'xox[abprs]-\['
  - id: stripe-token-format-pattern
    desc: Stripe token-format scan pattern
    if:
      type: text
      substr: sk_live_[
  - id: sendgrid-token-format-pattern
    desc: SendGrid token-format scan pattern
    if:
      type: text
      substr: SG.[
  - id: aws-key-format-pattern
    desc: AWS access-key-format scan pattern
    if:
      type: text
      regex: '(AKIA|ASIA)\['
  - id: jwt-format-pattern
    desc: JWT structure scan pattern
    if:
      type: text
      substr: eyJ[

composite_rules:
  # The breadth claim: one file that knows how to recognize four-plus
  # unrelated providers' token formats is built to collect whatever it
  # finds, not to use the credentials it owns.
  - id: multi-provider-token-format-scan
    desc: Token formats for four plus unrelated providers
    crit: suspicious
    conf: 0.92
    needs: 4
    any:
      - id: github-token-format-pattern
      - id: gitlab-token-format-pattern
      - id: npm-token-format-pattern
      - id: pypi-token-format-pattern
      - id: huggingface-token-format-pattern
      - id: vault-token-format-pattern
      - id: slack-token-format-pattern
      - id: stripe-token-format-pattern
      - id: sendgrid-token-format-pattern
      - id: aws-key-format-pattern
      - id: jwt-format-pattern
    unless:
      - id: well-known/tool/detection/redaction/
      - id: well-known/tool/detection/security-scanner/

  # The sweep in context: the multi-provider token pattern next to code that
  # walks the environment or the filesystem is the collector reaching its
  # input. The pattern alone could be a documentation table; paired with an
  # env enumeration or directory walk it is harvesting.
  - id: credential-token-format-sweep
    desc: Sweeps environment or files for live tokens
    crit: suspicious
    conf: 0.95
    near_bytes: 8192
    all:
      - id: multi-provider-token-format-scan
    any:
      - id: micro-behaviors/os/env/enumeration/
      - id: micro-behaviors/fs/directory/traverse/
      - id: micro-behaviors/fs/read/
    unless:
      - id: well-known/tool/detection/redaction/
      - id: well-known/tool/detection/security-scanner/
