# Scripted password relay: page script reads typed field values and POSTs
# them to a hardcoded absolute http(s) collector URL. Same-origin apps
# normally submit login forms to relative paths; an absolute URL carried
# next to the POST verb means the credential leaves for a fixed outside
# collector. A bare `.val()` read is ordinary web code, so conviction
# requires the value read, the absolute-URL POST, and the password field
# together. `[\s\S]` spans are deliberate: decoded mail windows keep
# `\r\n` line breaks inside the 76-char match windows. The `makefile`
# scope is deliberate: mailed phish bodies mistype as makefile in the file
# sniffer, so html-only scoping would leave them blind.
defaults:
  platforms: [windows, unix]
  for: [html, makefile]
  attack: T1041,T1566.002
  mbc: B0030

traits:
  - id: script-value-read
    desc: Script reads a form field value
    crit: notable
    conf: 0.8
    if:
      type: text
      regex: '\.val\s*\(\s*\)'
  - id: script-post-absolute-url
    desc: Scripted POST to a hardcoded absolute URL
    crit: notable
    conf: 0.88
    if:
      type: text
      regex: '''POST''[\s\S]{0,40}url:[\s\S]{0,20}https?://'

composite_rules:
  - id: ajax-password-exfil-post
    desc: Typed password relayed by scripted POST to absolute URL
    crit: hostile
    conf: 0.95
    all:
      - id: micro-behaviors/ui/controls/credential::html-password-input-tag
      - id: script-value-read
      - id: script-post-absolute-url
