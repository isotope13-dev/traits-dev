      - id: micro-behaviors/os/clipboard/reference::macos-nspasteboard-access
      - id: micro-behaviors/hardware/display/camera::avfoundation-capture
    unless:
      - id: well-known/tool/detection/
  # One script that names Chrome profile storage, the Discord token shape,
  # and Steam's loginusers file is collecting three session stores.
  - id: js-browser-discord-steam-sessions
    desc: Collects Chrome Discord and Steam sessions
    crit: hostile
    conf: 0.96
    platforms: [windows]
    for: [javascript, typescript]
    all:
      - id: micro-behaviors/fs/path/application/browser::chrome-windows-profile
      - id: objectives/collection/messaging/app::discord-token-regex-source
      - id: micro-behaviors/fs/path/account-db::steam-loginusers-file
    unless:
      - id: well-known/tool/detection/
  # An obfuscated bundle that scrapes the Discord token-store prefix
  # (dQw4w9WgXcQ: Local Storage key) out of LevelDB, names wallet or browser
  # credential stores alongside it, and ships an HTTP client is harvesting
  # credentials from multiple sources: the separator literal has no
  # legitimate use outside Discord token handling, and the surrounding
  # string obfuscation defeats the plaintext family matchers above.
  - id: js-obfuscated-discord-token-store-harvest
    desc: Obfuscated Discord token-store harvest with credential exfil
    crit: hostile
    conf: 0.97
    attack: "T1555,T1555.003,T1041,T1027"
    platforms: [windows, unix]
    for: [javascript, typescript]
    all:
      - id: objectives/credential-access/discord/token::discord-token-dqw-separator
      - id: micro-behaviors/data/db/leveldb::leveldb-ref
      - id: micro-behaviors/communications/http/request/client::http-client-usage
      - id: objectives/anti-static/obfuscation/string/encoding::js-strong-obfuscation
    any:
      - id: objectives/credential-access/wallet/keywords::wallets-word
      - id: micro-behaviors/os/application/target::exodus-word
      - id: micro-behaviors/communications/http/cookie-store::document-cookie-read
      - id: micro-behaviors/communications/http/cookies::cookie-object-field
      - id: objectives/discovery/system/fingerprint/hardware::systeminformation-import
    unless:
      - id: well-known/tool/detection/
  # One native binary with a routine named for the Chromium master key AND one
  # named for grabbing browser wallet extensions: two different credential
  # stores, each by the routine that loots it. These names survive string
  # encryption (C++ mangled names, Go/Rust symbols), which is why they are the
  # last readable evidence in a stealer like bazaar 3b46e51bf7a7. A cookie
  # exporter needs the first and never the second.
