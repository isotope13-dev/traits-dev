defaults:
  platforms: [linux, macos, windows, unix, android, ios]
  attack: "T1041"

composite_rules:
  - id: js-browser-wallet-credential-source
    desc: "Browser or wallet credential acquisition evidence"
    crit: notable
    conf: 0.94
    # Only JS/TS consumers exist. Unscoped, the multi-target directory below
    # let its Python host-information alias surface this on any .py file.
    for: [javascript, typescript]
    any:
      # Reference the positive stealer composites explicitly — a bare directory
      # prefix also matched the baseline `multi-app-stealer-benign-context`
      # marker (e.g. detection-tool vocabulary), firing the hostile upload
      # composite on benign frameworks that merely touch credential categories.
      # The same holds for the multi-target directory: it contains component
      # fragments such as `browser-termination-api` (a bare TerminateProcess
      # wrapper), which fired this source roll-up on binaries with no browser
      # content at all. List only the intent-bearing composites instead.
      - id: micro-behaviors/fs/path/app-data::browser-wallet-storage-references
      - id: objectives/credential-access/theft/multi-app::multi-app-credential-stealer
      - id: objectives/credential-access/browser/multi-target::browser-data-theft
      - id: objectives/credential-access/browser/multi-target::chromium-brand-target-table
      - id: objectives/credential-access/browser/multi-target::multi-brand-chromium-abe-harvest
      - id: objectives/credential-access/browser/multi-target::native-browser-handle-copy-log
      - id: objectives/credential-access/browser/multi-target::native-browser-key-material-theft
      - id: objectives/credential-access/browser/multi-target::native-browser-file-handle-theft
      - id: objectives/credential-access/browser/multi-target::browser-cred-harvest
      - id: objectives/credential-access/browser/multi-target::python-obfuscated-browser-stealer
      - id: objectives/credential-access/browser/multi-target::browser-store-external-termination-apis-source
      - id: objectives/credential-access/browser/multi-target::browser-store-external-termination-apis-pe
      - id: micro-behaviors/os/application/target::multiple-desktop-wallet-references
      - id: objectives/credential-access/wallet/extension::wallet-extension-store-targeting
      - id: objectives/credential-access/wallet/extension::metamask-wallet-profile
      - id: objectives/credential-access/wallet/mnemonic::comprehensive-stealer
      - id: objectives/credential-access/wallet/provider::solana-wallet-drainer-config
      - id: objectives/credential-access/wallet/provider::wallet-drainer
      - id: objectives/credential-access/wallet/solana::solana-wallet-drain
      - id: objectives/credential-access/wallet/solana::solana-env-drain
      - id: objectives/credential-access/wallet/solana::solana-private-key-http-exfil
