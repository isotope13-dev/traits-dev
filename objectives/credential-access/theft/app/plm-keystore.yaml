# Application-integrated credential theft: read a PLM/struct properties file
# and decrypt keystore-held secrets (LDAP manager, site admin, object storage)
# through an application utility.  Observed on Windchill via
# ieStructProperties.txt + WTKeyStoreUtil; keep the path and decrypt call as
# separate atoms so future PLM implants that rename the util still trip the
# properties-file leg when paired with a webshell channel.
defaults:
  platforms: [unix, windows]
  for: [java, kotlin, groovy, scala, html, javascript, python, vbs]
  attack: T1552.004,T1003
  mbc: E1552

traits:
  - id: iestruct-properties-path
    desc: ieStructProperties.txt application config path
    crit: suspicious
    conf: 0.96
    if:
      type: text
      substr: ieStructProperties.txt

  - id: wtkeystore-util-decrypt
    desc: WTKeyStoreUtil credential decrypt call
    crit: suspicious
    conf: 0.97
    if:
      type: text
      regex: 'WTKeyStoreUtil\s*\.\s*decrypt(Property)?\s*\('

  - id: ldap-manager-password-property
    desc: LDAP manager password property key
    crit: component
    conf: 0.94
    if:
      type: string_literal
      regex: '(?i)ldapManagerPassword|wt\.federation\.ie\.ldapManagerPassword'

composite_rules:
  - id: plm-keystore-credential-harvest
    desc: Decrypts PLM/app keystore credentials from struct properties
    crit: hostile
    conf: 0.97
    all:
      - id: iestruct-properties-path
      - id: wtkeystore-util-decrypt
    any:
      - id: ldap-manager-password-property
      - id: micro-behaviors/fs/write/file/direct::java-filewriter-source
      - id: micro-behaviors/communications/http/header/custom::servlet-get-header-call
      - id: micro-behaviors/communications/http/header/custom::windchill-command-header
    needs: 1
    near_bytes: 8000
