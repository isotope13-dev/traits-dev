defaults:
  platforms: [windows]
  for: [pe, dll, scripts, source]
  attack: T1552.001
  mbc: B0028

traits:
  - id: anydesk-system-conf-path
    desc: AnyDesk system.conf credential path
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: '(?i)ProgramData\\AnyDesk\\system\.conf'

  - id: anydesk-service-conf-path
    desc: AnyDesk service.conf credential path
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: '(?i)ProgramData\\AnyDesk\\service\.conf'

  - id: taskkill-anydesk-image
    desc: Force-kills AnyDesk process image
    crit: suspicious
    conf: 0.94
    attack: T1489
    if:
      type: text
      regex: '(?i)\btaskkill\b[^\r\n]{0,80}/im\s+AnyDesk'

composite_rules:
  - id: anydesk-config-theft-and-terminate
    desc: Reads AnyDesk configs and kills AnyDesk
    crit: hostile
    conf: 0.98
    attack: T1552.001,T1489
    all:
      - id: taskkill-anydesk-image
    any:
      - id: anydesk-system-conf-path
      - id: anydesk-service-conf-path
    unless:
      - id: well-known/dual-use/remote-admin/anydesk/
