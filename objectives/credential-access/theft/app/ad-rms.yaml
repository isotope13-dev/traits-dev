# The DRM directory holds the user's DPAPI-protected Rights Account Certificate
# and private key; MSIPC holds cached use licenses. Staging both trees into an
# archive is credential/license collection, not ordinary RMS client behavior.
defaults:
  platforms: [windows]
  for: [scripts, source, binaries]
  attack: T1552.001,T1560.001
  mbc: B0028

composite_rules:
  - id: ad-rms-credential-cache-harvest
    desc: Stages AD RMS identities and licenses into archive
    crit: hostile
    conf: 0.99
    all:
      - id: micro-behaviors/fs/path/token::ad-rms-drm-identity-cache-path
      - id: micro-behaviors/fs/path/token::ad-rms-msipc-license-cache-path
    any:
      - id: micro-behaviors/fs/file/copy::shutil-copytree
      - id: micro-behaviors/data/archive/create/zip/
      - id: micro-behaviors/data/archive/create/tar/
      - id: micro-behaviors/data/archive/create/utility/
      - id: micro-behaviors/data/archive/zip::zip-create
      - id: objectives/collection/archive/compress::powershell-compress-archive
    near_bytes: 10000

  - id: ad-rms-post-compromise-workflow
    desc: Reconnoiters AD RMS key storage and harvests user caches
    crit: hostile
    conf: 0.99
    all:
      - id: ad-rms-credential-cache-harvest
      - id: objectives/discovery/network/enumeration::ad-rms-multi-source-deployment-recon
      - id: objectives/discovery/network/enumeration::ad-rms-key-storage-recon
