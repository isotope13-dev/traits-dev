# This combines a command channel with configuration enumeration and explicit
# decryption of a password field. None of those APIs alone establishes theft.
defaults:
  platforms: [unix, windows]
  for: [cfml]
composite_rules:
  - id: cfml-webshell-datasource-password-decryption
    desc: CFML shell enumerates datasources and decrypts passwords
    crit: hostile
    conf: 0.93
    all:
      - id: objectives/command-and-control/backdoor/webshell/request/command::cfml-request-command-shell
      - id: micro-behaviors/process/interpreter/runtime/jvm::cfml-service-factory-createobject
      - id: micro-behaviors/data/db/config::cfml-datasource-service-enumeration
      - id: micro-behaviors/crypto/symmetric/decrypt::cfml-decrypt-password-member
