defaults:
  crit: suspicious
  platforms: [unix, windows, macos]
composite_rules:
  - id: deezer-credential-harvester-args
    desc: Python script harvesting Deezer credentials via click arguments
    all:
      - id: metadata/import/python/click
      - id: micro-behaviors/process/argument/credential::suspicious-arg-gmail
      - id: micro-behaviors/process/argument/credential::suspicious-arg-passw