# Stolen-hash validation oracle.
#
# After extracting Windows domain credential material, theft tooling often
# carries its own answer key: hardcoded expected NT/SHA1 hashes that the
# run's findings are compared against (in tests, to prove the extractor
# works; in operations, to confirm the target). A bare hash constant can be
# benign (integrity pins, test vectors), so the oracle alone is only
# suspicious — it convicts together with the extraction legs that produce
# the credentials being validated.
defaults:
  platforms: [windows, unix]
  for: [scripts, source, rust]
  attack: T1003.001
  mbc: E1003

traits:
  - id: expected-hash-credential-oracle
    desc: Compares credentials against an expected hash
    crit: suspicious
    conf: 0.9
    # NT hashes only. An `expected_sha1` field is the standard
    # optimistic-concurrency write guard in application code (compare the
    # current content hash before replacing it) and is not a credential
    # oracle; it fired on an AI-theme-editor's CSS replace guard.
    if:
      type: text
      case_insensitive: true
      regex: 'expected_nt(_hash)?\b'

composite_rules:
  # Stolen NT hashes checked against hardcoded expected values: the
  # extraction call yields the credentials, the NT-hash fields name the
  # loot, and the expected-hash oracle confirms the take. Test scaffolding
  # does not change the verdict — a theft test that needs real victim
  # hashes to pass is still theft tooling.
  - id: stolen-nt-hash-validation-oracle
    desc: Validates stolen NT hashes against hardcoded values
    crit: hostile
    conf: 0.94
    all:
      - id: micro-behaviors/os/security/auth/ntlm::nt-hash-field
      - id: expected-hash-credential-oracle
      - id: objectives/credential-access/dump/memory-image::minidump-credential-extraction-call
      - id: objectives/credential-access/dump/memory-image::lsass-dump-file-reference
