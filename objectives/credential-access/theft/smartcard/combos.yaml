# Smart Card Credential Theft
# Detecting smart card access combined with other suspicious indicators
# ATT&CK: T1552.004 (Unsecured Credentials: Private Keys)
defaults:
  for: [pe, dll]
  platforms: [windows]
  attack: "T1552.004"
composite_rules:
  - id: smartcard-credential-theft
    desc: Smart card access with suspicious indicators
    crit: suspicious
    conf: 0.85
    all:
      - id: micro-behaviors/hardware/smartcard/access::smartcard-access
    any:
      - id: micro-behaviors/dylib/load/runtime::load-library-a
      - id: micro-behaviors/dylib/lookup::get-proc-address
      - id: micro-behaviors/mem/protect/modify::virtual-protect-ex
      - id: micro-behaviors/fs/temp/directory::get-temp-path-dup
      - id: metadata/file/profile/locale::locale-ru-ru-dash
      - id: metadata/file/profile/locale::locale-ru-ru-underscore
    needs: 2
    downgrade:
      any:
        - id: metadata/signed/platform/

  - id: android-nfc-web-credential-relay
    desc: Android NFC reader paired with privileged remote credential UI
    crit: hostile
    conf: 0.995
    platforms: [android]
    for: [apk, zip]
    all:
      - id: micro-behaviors/hardware/smartcard/access::android-nfc-card-reader-reference
      - id: micro-behaviors/hardware/smartcard/access::android-nfc-tech-discovered-intent
      - id: micro-behaviors/process/interpreter/webview::webview-remote-content-shell
      - id: objectives/credential-access/phishing/credential::android-remote-credential-step
    any:
      - id: objectives/command-and-control/channel/deaddrop/cloud-storage::android-okhttp-client-reference
      - id: micro-behaviors/communications/socket/create::java-socket-bytecode-reference
