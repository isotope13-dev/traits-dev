defaults:
  platforms: [windows]
  for: [c, cpp]
  attack: T1556
composite_rules:
  - id: native-cleartext-password-file-log
    desc: Plaintext password buffer written to file
    crit: suspicious
    conf: 0.95
    all:
      - id: micro-behaviors/fs/write/credential::native-password-buffer-file-write
      - id: micro-behaviors/fs/file/open::native-file-open-disposition
  - id: network-provider-cleartext-credential-log
    desc: Network provider extracts and logs passwords
    crit: hostile
    conf: 0.97
    all:
      - id: micro-behaviors/os/security/auth/provider::network-provider-logon-callback-definition
      - id: micro-behaviors/os/security/auth/provider::interactive-logon-password-field-read
      - id: native-cleartext-password-file-log
