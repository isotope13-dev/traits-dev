# One DLL registering itself into several different Windows authentication
# extension points at once.
#
# Windows offers a handful of documented interfaces that hand a third-party
# module live logon credentials: a Security Support Provider (SpLsaModeInitialize)
# runs inside LSASS, a password filter (InitializeChangeNotify /
# PasswordChangeNotify) sees every password change in cleartext, an MSV1_0
# subauthentication package (Msv1_0SubAuthenticationRoutine) sits in the NTLM
# logon path, and a network provider (NPLogonNotify) is handed the account name
# and password at each interactive logon.
#
# A real product implements exactly one of these -- the one matching what it
# does. An SSO agent ships an SSP; a password-policy product ships a filter; a
# VPN client ships a network provider. A single binary that exports three or
# more is not extending authentication, it is standing in the path of it,
# which is why the count is the rule rather than any individual export. This is
# the shape of mimikatz's mimilib.dll and of the credential-logging DLLs that
# copy it.
defaults:
  platforms: [windows]
  for: [pe, dll]
  attack: T1556.002,T1547.005
  mbc: B0005

composite_rules:
  - id: multi-interface-credential-provider-dll
    desc: DLL hooks several Windows logon interfaces
    crit: hostile
    conf: 0.96
    any:
      - id: micro-behaviors/os/security/sspi::ssp-lsa-mode-initialize
      - id: micro-behaviors/os/security/auth/provider::msv1-0-subauthentication-routine
      - id: micro-behaviors/os/security/auth/provider::network-provider-logon-notify
      - id: micro-behaviors/os/security/lsa::password-filter-change-notify
    needs: 3
