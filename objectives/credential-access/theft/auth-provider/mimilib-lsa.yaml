# Mimikatz mimilib.dll registered as an LSA Security Package so plaintext
# passwords land in kiwissp.log — observed in Medusa and related intrusions.
defaults:
  platforms: [windows]
  for: [batch, powershell, scripts]
  attack: T1003,T1556.002
  mbc: B0005

traits:
  - id: lsa-security-packages-mimilib
    desc: LSA Security Packages value includes mimilib
    crit: suspicious
    conf: 0.97
    if:
      type: text
      regex: '(?i)Security Packages[^\r\n]{0,220}mimilib|mimilib[^\r\n]{0,220}Security Packages'

  - id: kiwissp-log-path
    desc: Mimikatz kiwissp.log credential log path
    crit: suspicious
    conf: 0.96
    if:
      type: text
      regex: '(?i)\bkiwissp\.log\b'

composite_rules:
  - id: mimilib-lsa-security-package-inject
    desc: Registers mimilib into LSA Security Packages
    crit: hostile
    conf: 0.99
    all:
      - id: lsa-security-packages-mimilib
    any:
      - id: micro-behaviors/os/registry/manipulate::reg-cli-command
      - id: micro-behaviors/os/registry/write/property::powershell-registry-property-cmd
