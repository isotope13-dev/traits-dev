# Cross-app token theft through an exposed Android ContentProvider. Provider
# calls and Bundle reads are legitimate in isolation; the suspicious shape is
# a provider RPC whose response exposes an authentication field, especially
# when that value is logged or immediately reused as an HTTP credential.
defaults:
  platforms: [android]
  for: [java, kotlin]
  attack: T1552

traits:
  - id: android-bundle-credential-field-read-source
    desc: Reads credential field from Android Bundle
    crit: notable
    conf: 0.92
    if:
      type: text
      regex: '(?i)\??\.\s*getString\s*\(\s*["''][^"'']{0,40}(token|session|credential|auth)'

  - id: android-credential-value-log-source
    desc: Logs credential-named value on Android
    crit: suspicious
    conf: 0.94
    if:
      type: text
      regex: '(?i)\bLog\s*\.\s*[vdiew]\s*\([^;\r\n]{0,120}\b(token|session|credential|auth)\w*'

composite_rules:
  - id: android-content-provider-credential-read
    desc: Android app extracts a credential field from a ContentProvider response
    crit: suspicious
    conf: 0.96
    all:
      - id: micro-behaviors/communications/ipc/content-provider::android-content-provider-rpc-source
      - id: android-bundle-credential-field-read-source

  - id: android-content-provider-credential-log
    desc: Android app logs a credential obtained through a ContentProvider
    crit: suspicious
    conf: 0.98
    all:
      - id: android-content-provider-credential-read
      - id: android-credential-value-log-source

  - id: android-content-provider-credential-http-relay
    desc: Android app forwards a ContentProvider credential in a custom HTTP header
    crit: suspicious
    conf: 0.98
    all:
      - id: android-content-provider-credential-read
      - id: micro-behaviors/communications/http/header/custom::android-custom-token-header-source
