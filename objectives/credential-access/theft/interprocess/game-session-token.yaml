# A game client captures a live authentication token from its Vanguard-facing
# named-pipe exchange and reuses it in a gateway authentication flow. Token
# field names alone are common; the composite requires capture, reuse, and the
# game anti-cheat IPC and gateway context together.
defaults:
  platforms: [windows]
  for: [pe, dll]
  attack: T1550

traits:
  - id: game-auth-token-capture-marker
    desc: Game authentication token capture marker
    crit: notable
    conf: 0.96
    if:
      type: text
      regex: '(?i)\b(auth[_ -]?token|jwt)\b.{0,40}\b(captur\w*|sav\w*)'

  - id: game-auth-token-gateway-reuse-marker
    desc: Game authentication token forwarded to a gateway
    crit: notable
    conf: 0.96
    if:
      type: text
      regex: '(?i)\bforward\w*.{0,50}\btoken\b.{0,50}\bgateway\b'

  - id: game-session-auth-marker
    desc: Game session authentication protocol marker
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)\bSESSION[_ -]AUTH\b'

composite_rules:
  - id: game-session-token-capture-and-replay
    desc: Captures a game session token from anti-cheat IPC and replays it to its gateway
    crit: hostile
    conf: 0.98
    all:
      - id: game-auth-token-capture-marker
      - id: game-auth-token-gateway-reuse-marker
      - id: game-session-auth-marker
      - id: micro-behaviors/communications/ipc/named-pipe::named-pipe-server
      - id: well-known/game/anti-cheat::vanguard-gateway-endpoint
      - id: micro-behaviors/communications/http/client/winhttp::winhttp-request-flow
