# Native Windows stealers (LokiBot-class) query Firefox moz_logins, call NSS
# decrypt APIs, and sweep FileZilla profile paths from one packed image.
defaults:
  platforms: [windows]
  for: [pe, dll]
  attack: T1555.003,T1552.001

composite_rules:
  - id: native-windows-nss-moz-filezilla-credential-theft
    desc: Native PE harvests Firefox logins, NSS secrets, and FileZilla stores
    crit: hostile
    conf: 0.98
    all:
      - id: objectives/credential-access/browser/firefox::moz-logins-sql
      - id: micro-behaviors/crypto/decrypt::nss-secret-decrypt-reference
      - id: micro-behaviors/fs/path/password-store::filezilla-configuration-path-references
      - id: metadata/binary/layout/embedded::sqlite-format-header-reference
    unless:
      - id: well-known/lib/crypto/nss/
      - id: metadata/signed/platform/
