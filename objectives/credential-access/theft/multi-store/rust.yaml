defaults:
  platforms: [unix, windows]
  for: [rust]

traits:
  # Filenames alone do not establish access: agent runtimes and security tools
  # commonly keep the same paths in protective deny/allow lists. Exfiltration
  # rules may use this incomplete target-list evidence only with a transport.
  - id: rust-developer-credential-filename-cluster
    desc: Rust developer credential filename cluster
    crit: component
    conf: 0.94
    if:
      type: text
      regex: '\.git-credentials[\s\S]{0,260}\.npmrc[\s\S]{0,260}\.env'
