defaults:
  platforms:
    - unix
    - windows
  for: [scripts, binaries]
composite_rules:
  # Keep the concrete phishing-plus-browser-store behavior below. The former
  # credential-harvest wrapper only forwarded one browser child after its AWS
  # child proved unreachable, so it added no distinct detection.
  - id: phish-and-browser-store-harvest
    desc: Phish plus browser store queries
    crit: hostile
    conf: 0.96
    attack: T1056.002,T1555.003
    scope: file
    all:
      - id: objectives/credential-access/phishing/lure::password-phishing-comp
      - id: objectives/credential-access/browser/multi-target::browser-cred-harvest
      - id: micro-behaviors/data/db/access::chromium-credit-card-sql
