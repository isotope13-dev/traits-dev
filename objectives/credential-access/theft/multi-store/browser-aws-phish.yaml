defaults:
  platforms:
    - unix
    - windows
  for: [scripts, binaries]
composite_rules:
  - id: credential-harvest
    desc: Credential harvesting patterns
    crit: suspicious
    conf: 0.85
    any:
      - id: objectives/credential-access/browser/multi-target::browser-cred-harvest
      - id: objectives/credential-access/env/secrets/cloud-access::aws-cred-harvest
    downgrade:
      any:
        - id: metadata/package/completeness/
  - id: phish-and-browser-store-harvest
    desc: Phish plus browser store queries
    crit: hostile
    conf: 0.96
    attack: T1056.002,T1555.003
    scope: file
    all:
      - id: objectives/credential-access/phishing/lure::password-phishing-comp
      - id: objectives/credential-access/browser/multi-target::browser-cred-harvest
      - id: objectives/credential-access/browser/chromium::credit-card-sql
