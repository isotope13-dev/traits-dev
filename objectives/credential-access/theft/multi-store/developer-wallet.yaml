defaults:
  attack: T1555
  mbc: B0028
  platforms:
    - linux
    - unix
    - macos
    - windows
    - android
    - ios
  for:
    - binaries
    - scripts
    - source
    - manifests
    - documents
    - media
    - data
composite_rules:
  - id: developer-and-wallet-credential-harvester
    desc: Targets wallet, SSH, and registry credentials
    crit: hostile
    conf: 0.98
    attack: "T1555.003,T1552.004"
    all:
      - id: objectives/credential-access/wallet/extension::multi-wallet-targeting
      - id: micro-behaviors/fs/path/private-key::ssh-private-key-filename-enum
      - id: micro-behaviors/fs/path/secret-config::pypirc-credentials-file
    unless:
      - id: well-known/tool/detection/
