# A secret-hunting catalog pointed at the developer's own credential stores.
#
# The multi-vendor token-format scanner alone is a catalog (it stays
# suspicious: secret scanners and redaction tools carry one, and it excludes
# them). What turns it into theft is where it looks: a program that walks the
# filesystem, knows the paths of the git credential store, a Vault token, SSH
# private keys and registry/netrc credential files, and carries regexes for
# the tokens those files hold is collecting them. Secret scanners search the
# tree they are pointed at; they do not hard-code another user's key paths.
# Seen in the sckit worm's Go implant (npm @memtensor, PyPI MemoryOS), whose
# every build carries all four legs.
defaults:
  platforms: [unix, windows]
  for: [elf, macho, pe]
  attack: T1552.001,T1552.004

composite_rules:
  - id: developer-store-token-sweep
    desc: Walks files and scans developer credential stores for tokens
    crit: hostile
    conf: 0.96
    all:
      - id: objectives/credential-access/api-harvest/format::multi-vendor-token-format-scanner
      - id: micro-behaviors/fs/directory/traverse::filepath-walk-pclntab
    any:
      - id: micro-behaviors/fs/path/token::git-credentials
      - id: micro-behaviors/fs/path/token::vault-token-file
      - id: micro-behaviors/fs/path/private-key::ssh-private-key-filename-enum
      - id: micro-behaviors/fs/path/secret-config::package-or-netrc-credential-file
    needs: 3
    unless:
      - id: well-known/tool/detection/security-scanner/
      - id: well-known/tool/detection/redaction/
