# A secret-hunting catalog pointed at the developer's own credential stores.
#
# A multi-vendor format catalog is neutral. The theft inference requires
# traversal plus at least three developer credential-store path classes.
# Seen in the sckit worm's Go implant (npm @memtensor, PyPI MemoryOS), whose
# every build carries all four legs.
defaults:
  platforms: [unix, windows]
  for: [elf, macho, pe]
  attack: T1552.001,T1552.004

composite_rules:
  - id: developer-store-token-sweep
    desc: Walks files and scans developer credential stores for tokens
    crit: hostile
    conf: 0.96
    all:
      - id: micro-behaviors/data/format/credentials::multi-vendor-token-format-catalog
      - id: micro-behaviors/fs/directory/traverse::filepath-walk-pclntab
    any:
      - id: micro-behaviors/fs/path/token::git-credentials
      - id: micro-behaviors/fs/path/token::vault-token-file
      - id: micro-behaviors/fs/path/private-key::ssh-private-key-filename-enum
      - id: micro-behaviors/fs/path/secret-config::package-or-netrc-credential-file
    needs: 3
    unless:
      - id: well-known/tool/detection/security-scanner/
      - id: micro-behaviors/data/string/redact/
