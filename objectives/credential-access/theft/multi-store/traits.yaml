defaults:
  platforms: [unix, windows]
  for: [scripts, binaries, python, pyc, rust, go, c, cpp, objc, javascript, typescript]
  attack: "T1555,T1552.001,T1552.004"
  mbc: E1552

traits:
  # Requiring two extraction branches distinguishes code that walks several
  # AWS profiles from a schema or example that merely names these fields.
  - id: js-aws-shared-credential-record-extraction
    desc: Extracts multiple AWS shared-credential records
    crit: notable
    conf: 0.98
    count_min: 2
    for: [javascript, typescript]
    if:
      type: text
      regex: '\?\.aws_access_key_id&&\w+\?\.aws_secret_access_key\)\{return\{'
  # This token prefix is used by GitHub server-to-server tokens. It does not,
  # by itself, establish that the program is running on an Actions runner.
  - id: js-github-server-token-prefix
    desc: References GitHub server-token prefix
    crit: component
    conf: 0.94
    for: [javascript, typescript]
    if:
      type: text
      substr: ghs_
  - id: native-ssh-key-store-sweep
    desc: Sweeps SSH keys and agent inventory
    crit: suspicious
    conf: 0.99
    platforms: [linux]
    for: [elf]
    if:
      type: text
      regex: 'for d in ~/\.ssh[^\r\n]{0,900}authorized_keys[^\r\n]{0,500}ssh-add -l'
  - id: native-chromium-store-sweep
    desc: Sweeps installed Chromium credential stores
    crit: suspicious
    conf: 0.99
    platforms: [linux]
    for: [elf]
    if:
      type: text
      regex: 'for b in google-chrome chromium[^\r\n]{0,400}Login\\ Data'
  - id: native-database-secret-sweep
    desc: Sweeps database histories and credentials
    crit: suspicious
    conf: 0.98
    platforms: [linux]
    for: [elf]
    if:
      type: text
      regex: '\.mysql_history[^\r\n]{0,500}\.pgpass[^\r\n]{0,500}\.my\.cnf[^\r\n]{0,500}DATABASE_'

composite_rules:
  - id: browser-ftp-credential-targeting
    for: [binaries, '!dex', scripts, '!jcl']
    desc: Targets browser and FTP client credential stores
    crit: suspicious
    conf: 0.98
    attack: "T1555.003,T1552.001"
    all:
      - id: objectives/credential-access/browser/firefox::password-theft-comp
      - id: objectives/credential-access/ftp/filezilla::filezilla-stealer
  - id: native-browser-store-sweep
    desc: Sweeps Chromium and Firefox credential stores
    crit: suspicious
    conf: 0.99
    platforms: [linux]
    for: [elf]
    all:
      - id: native-chromium-store-sweep
      - id: objectives/credential-access/browser/multi-target::native-firefox-logins-path
      - id: objectives/credential-access/browser/multi-target::native-firefox-key4-path
  - id: native-cross-store-credential-harvester
    desc: Native implant sweeps browser, SSH, and database credentials
    crit: hostile
    conf: 0.99
    platforms: [linux]
    for: [elf]
    any:
      - id: native-ssh-key-store-sweep
      - id: native-browser-store-sweep
      - id: native-database-secret-sweep
    needs: 2
  - id: multi-store-credential-targeting
    desc: Targets browser, developer/cloud, and SSH credential stores
    crit: suspicious
    conf: 0.96
    all:
      - id: browser-store-target
      - id: micro-behaviors/fs/path/token::developer-credential-stores
      - id: ssh-store-target
    unless:
      - id: well-known/app/utility/siw::siw-family-identity
      - id: well-known/tool/detection/pattern-catalog::embedded-deny-policy-catalog
  - id: browser-store-target
    desc: Browser credential store target
    crit: notable
    conf: 0.9
    any:
      - id: micro-behaviors/fs/path/cookie::browser-sensitive-data
      - id: micro-behaviors/fs/path/password-store::login-data
      - id: micro-behaviors/fs/path/cookie::browser-cookies-file-path
      - id: objectives/credential-access/browser/firefox::profiles-ini
  - id: ssh-store-target
    desc: SSH private-key or host inventory target
    crit: notable
    conf: 0.92
    any:
      - id: micro-behaviors/fs/path/private-key::ssh-private-key
      - id: micro-behaviors/fs/path/private-key::ssh-private-key-filename-enum
      - id: micro-behaviors/fs/path/public-key::python-ssh-known-hosts-read
      - id: objectives/credential-access/ssh/key::private-key-path
    unless:
      - id: well-known/app/network/openssh::openssh-package
      # libcurl embeds default SSH key paths to support authenticated SFTP/SCP;
      # that capability is not evidence that the library inventories keys.
      - id: well-known/lib/network/curl::windows-runtime-library
  - id: credential-stealer-ssh-worm
    desc: Multi-store credential harvester also propagates a payload over SSH
    crit: hostile
    conf: 0.99
    attack: "T1555,T1552.001,T1552.004,T1021.004,T1105"
    all:
      - id: multi-store-credential-targeting
      - id: micro-behaviors/communications/ssh/transfer::scp-remote-temp-upload
      - id: objectives/lateral-movement/ssh/propagation::ssh-chmod-command
      - id: micro-behaviors/fs/chmod/executable/mode::chmod-make-executable
      - id: micro-behaviors/process/create/local-exec::detached-temp-path-launch
      - id: micro-behaviors/communications/ssh/client::strict-host-disable
  - id: obfuscated-cloud-github-credential-sweep
    desc: Obfuscated JavaScript targets AWS and GitHub credentials
    crit: hostile
    conf: 0.99
    attack: "T1552.001,T1528,T1195.002"
    for: [javascript, typescript]
    all:
      - id: js-aws-shared-credential-record-extraction
      - id: js-github-server-token-prefix
      - id: objectives/anti-static/obfuscation/eval/function::string-table-function-constructor
      - id: micro-behaviors/process/interpreter/eval/direct::js-eval-raw
