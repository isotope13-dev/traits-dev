# Cross-language multi-store credential harvesting.
#
# The AUR second stage targets unrelated browser, cloud/developer, and SSH
# stores from one agent. The individual path traits remain neutral
# capabilities; this file infers a stealer only from the breadth of stores and
# the separate SSH payload-propagation behavior.
defaults:
  platforms: [unix, windows]
  for: [scripts, binaries, python, pyc, rust, go, c, cpp, objc, javascript, typescript]
  attack: "T1555,T1552.001,T1552.004"
  mbc: E1552

traits:
  # These are attack-context markers, not standalone claims that a field is a
  # live credential.  The hostile composite below requires both cloud key
  # fields and a GitHub Actions token prefix in the same obfuscated loader.
  - id: js-aws-access-key-field
    desc: JavaScript references the AWS access-key field
    crit: component
    conf: 0.95
    for: [javascript, typescript]
    if:
      type: text
      substr: aws_access_key_id

  - id: js-aws-secret-key-field
    desc: JavaScript references the AWS secret-key field
    crit: component
    conf: 0.95
    for: [javascript, typescript]
    if:
      type: text
      substr: aws_secret_access_key

  - id: js-github-runner-token-prefix
    desc: JavaScript checks GitHub Actions token prefixes
    crit: component
    conf: 0.94
    for: [javascript, typescript]
    if:
      type: text
      substr: ghs_

composite_rules:
  - id: multi-store-credential-targeting
    desc: Targets browser, developer/cloud, and SSH credential stores
    crit: suspicious
    conf: 0.96
    all:
      - id: browser-store-target
      - id: developer-store-target
      - id: ssh-store-target

  - id: browser-store-target
    desc: Browser credential store target
    crit: notable
    conf: 0.9
    any:
      - id: micro-behaviors/fs/path/sensitive/browser::browser-sensitive-data
      - id: micro-behaviors/fs/path/sensitive/browser::login-data
      - id: micro-behaviors/fs/path/sensitive/browser::browser-cookies-file-path
      - id: objectives/credential-access/browser/firefox::profiles-ini

  - id: developer-store-target
    desc: Developer or cloud credential store target
    crit: notable
    conf: 0.92
    any:
      - id: micro-behaviors/fs/path/sensitive/credentials::cloud-credentials
      - id: micro-behaviors/fs/path/sensitive/credentials::orchestration-credentials
      - id: micro-behaviors/fs/path/sensitive/credentials::package-or-netrc-credential-file

  - id: ssh-store-target
    desc: SSH private-key or host inventory target
    crit: notable
    conf: 0.92
    any:
      - id: micro-behaviors/fs/path/sensitive/credentials::ssh-private-key
      - id: micro-behaviors/fs/path/sensitive/credentials::ssh-private-key-filename-enum
      - id: micro-behaviors/fs/path/sensitive/credentials::python-ssh-known-hosts-read
      - id: objectives/credential-access/ssh/key::private-key-path

  - id: credential-stealer-ssh-worm
    desc: Multi-store credential harvester also propagates a payload over SSH
    crit: hostile
    conf: 0.99
    attack: "T1555,T1552.001,T1552.004,T1021.004,T1105"
    all:
      - id: multi-store-credential-targeting
      - id: objectives/lateral-movement/ssh/propagation::scp-payload-destination
      - id: objectives/lateral-movement/ssh/propagation::ssh-chmod-command
      - id: micro-behaviors/fs/chmod/executable/mode::chmod-make-executable
      - id: objectives/lateral-movement/ssh/propagation::detached-payload-launch
      - id: micro-behaviors/communications/ssh/client::strict-host-disable

  - id: obfuscated-cloud-runner-credential-sweep
    desc: Obfuscated JavaScript targets AWS and GitHub runner credentials
    crit: hostile
    conf: 0.99
    attack: "T1552.001,T1528,T1195.002"
    for: [javascript, typescript]
    all:
      - id: js-aws-access-key-field
      - id: js-aws-secret-key-field
      - id: js-github-runner-token-prefix
      - id: objectives/supply-chain/hidden-payload/eval::string-table-function-loader
      - id: micro-behaviors/process/interpreter/eval::js-eval-raw
