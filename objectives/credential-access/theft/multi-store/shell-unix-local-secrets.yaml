defaults:
  platforms: [unix]
  for: [shell]
  attack: T1552.001

composite_rules:
  - id: shell-local-secret-collector
    desc: Shell local secret collector
    crit: hostile
    conf: 0.98
    all:
      - id: objectives/exfiltration/ftp::shell-root-shadow-archive
      - id: objectives/credential-access/ssh/key::shell-ssh-key-copy-loop
      - id: objectives/credential-access/shell/history::shell-history-copy-loop
  - id: shell-credential-bundle-collector
    desc: Shell credential bundle collector
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/fs/path/credential::shell-cloud-browser-token-bundle
      - id: objectives/credential-access/theft/file::shell-package-token-bundle
    any:
      - id: objectives/credential-access/ssh/key::shell-ssh-key-copy-loop
      - id: objectives/credential-access/shell/history::shell-history-copy-loop
