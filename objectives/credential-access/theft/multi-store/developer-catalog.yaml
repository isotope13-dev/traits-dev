# Cross-ecosystem developer credential filename catalogs.
#
# The sckit agent package and the npm worms before it sweep the same short
# list of developer credential files: npm, PyPI and Git credentials, netrc,
# SSH private keys, Vault tokens. The individual path atoms are neutral —
# provisioning and dotfiles tooling legitimately reference one or two. A
# single file that names credential stores from four-plus *unrelated*
# ecosystems is inventorying everything on the machine worth stealing, which
# is the collection breadth of a credential stealer, not of a tool that uses
# the credentials it owns.
defaults:
  platforms: [unix, windows]
  for: [scripts, source, binaries]
  attack: T1552.001
  mbc: E1552

composite_rules:
  - id: developer-credential-filename-catalog
    desc: Catalogs credential files across four plus ecosystems
    crit: suspicious
    conf: 0.92
    needs: 4
    any:
      # npm publish token file
      - id: micro-behaviors/fs/path/secret-config::npmrc-credentials
      # PyPI upload credentials
      - id: micro-behaviors/fs/path/secret-config::pypirc-credentials-file
      # shared plaintext credentials for any network service
      - id: micro-behaviors/fs/path/secret-config::netrc
      # Git credential store
      - id: micro-behaviors/fs/path/token::git-credentials
      # SSH private key filename set (id_rsa / id_ecdsa / id_ed25519)
      - id: micro-behaviors/fs/path/private-key::ssh-private-key-filename-enum
      # HashiCorp Vault token file
      - id: objectives/credential-access/credential-manager/store-api::vault-token-sources
    unless:
      # an ignore/exclude list names secret files to keep them OUT of builds
      - id: metadata/package/config::sensitive-file-exclusion-list
      - id: well-known/tool/detection/security-scanner/
      - id: well-known/tool/detection/redaction/
