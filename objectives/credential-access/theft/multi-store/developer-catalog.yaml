# Credential acquisition objectives; path catalogs live in fs/path/credential.
defaults:
  platforms: [unix, windows]
  for: [scripts, source, binaries]
  attack: T1552.001
  mbc: E1552

composite_rules:
  # A stealer resolves a credential store under the victim's home directory
  # and catalogs many more; a deny-list that keeps stores out of an uploaded
  # project archive walks the project tree it was handed and never joins a
  # store path to HOME. Requiring the home-joined store path (not any home
  # reference) separates the two on behavior rather than on what the list
  # variable happens to be called.
  - id: cross-ecosystem-developer-credential-theft-catalog
    desc: Resolves a home credential store, catalogs 5+ stores
    crit: hostile
    conf: 0.96
    all:
      - id: micro-behaviors/fs/path/credential::home-joined-credential-store-path
    needs: 5
    any:
      - id: micro-behaviors/fs/path/secret-config::npmrc-credentials
      - id: micro-behaviors/fs/path/secret-config::pypirc-credentials-file
      - id: micro-behaviors/fs/path/secret-config::netrc
      - id: micro-behaviors/fs/path/token::git-credentials
      - id: micro-behaviors/fs/path/private-key::ssh-private-key-filename-enum
      - id: micro-behaviors/fs/path/token::vault-token-file
      - id: micro-behaviors/os/security/auth/secret::vault-authentication-source-reference
    unless:
      - id: metadata/package/config::sensitive-file-exclusion-list
      - id: well-known/tool/detection/security-scanner/
      - id: well-known/tool/detection/redaction/
      - id: well-known/app/ai/coding-agent/
      - id: well-known/app/ai/agent-runtime/
