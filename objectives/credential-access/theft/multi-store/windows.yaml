defaults:
  platforms: [windows]
  for: [scripts, source, binaries]
  attack: T1003.001,T1555.003

composite_rules:
  # A managed module that names both Chromium and Firefox credential stores
  # and reaches for store decryption (NSS, CNG, or the SQLite engine that
  # backs them) is a browser credential stealer, not a sync client: vendors
  # ship signed, and sync clients do not dig in a competitor's profile.
  - id: managed-multi-browser-credential-stealer
    desc: Managed stealer decrypts Chromium and Firefox credential stores
    crit: hostile
    conf: 0.95
    attack: T1555.003
    all:
      - id: micro-behaviors/fs/path/password-store::chromium-login-store-paths
      - id: micro-behaviors/fs/path/application/browser::firefox-profile-directory
    any:
      - id: micro-behaviors/crypto/decrypt::nss-secret-decrypt-reference
      - id: micro-behaviors/crypto/library/cryptoapi::bcrypt-decrypt-api
      - id: micro-behaviors/data/db/sqlite::sqlite-format
    needs: 2
    unless:
      - id: metadata/signed/platform/
      - id: well-known/tool/browser
      - id: metadata/binary/installer/family/
  # Mail, FTP, and VPN clients keep credentials in disjoint stores; one
  # unsigned module naming two or more of them harvests across
  # applications. Each vendor reads only its own store, and signed.
  - id: managed-mail-ftp-vpn-credential-stealer
    desc: Managed stealer reads mail, FTP, and VPN credential stores
    crit: hostile
    conf: 0.95
    attack: T1555
    all:
      - id: metadata/signed/trust-level::unsigned-missing-signature-record
    any:
      - id: micro-behaviors/os/registry/keys/credential::outlook-profile-registry-key
      - id: micro-behaviors/fs/path/password-store::filezilla-recentservers-path
      - id: micro-behaviors/fs/path/app-data::nordvpn-path
    needs: 2
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/installer/family/
  - id: browser-and-lsass-credential-dump
    for: [binaries, '!dex', '!elf', '!macho', scripts, '!applescript', '!jcl', '!shell']
    desc: Copies browser credential stores and dumps LSASS process memory
    crit: hostile
    conf: 0.99
    all:
      - id: objectives/credential-access/browser/loot::esentutl-browser-credential-copy
      - id: micro-behaviors/mem/read/dump::comsvcs-lsass-memory-dump
    near_lines: 10
