defaults:
  platforms: [macos]
  for: [applescript, shell]
  attack: T1005
  mbc: B0028

composite_rules:
- id: applescript-grabber-collection-signal
  desc: AppleScript grabber collection target
  crit: suspicious
  conf: 0.93
  any:
  - id: objectives/collection/file-targeting/filter::office-secret-extension-list
  - id: applescript-browser-wallet-collection
  - id: micro-behaviors/fs/path/personal::apple-notes-store
- id: applescript-browser-wallet-collection
  desc: AppleScript browser wallet data theft
  crit: suspicious
  conf: 0.95
  attack: T1555.003
  needs: 3
  any:
  - id: objectives/credential-access/browser/chromium::chromium-browser-targets
  - id: objectives/credential-access/browser/firefox::firefox-profiles-path
  - id: objectives/credential-access/browser/firefox::waterfox-profiles-path
  - id: objectives/credential-access/browser/safari::cookies-binarycookies
  - id: objectives/credential-access/wallet/desktop::wallet-target-bundle
  - id: objectives/credential-access/keychain/extract::chrome-generic-password-query
  - id: micro-behaviors/fs/path/personal::apple-notes-store
  - id: micro-behaviors/fs/path/password-store::macos-login-keychain-db
- id: applescript-staged-credential-stealer
  desc: AppleScript staged credential stealer
  crit: hostile
  conf: 0.97
  attack: T1555
  all:
  - id: applescript-browser-wallet-collection
  - id: objectives/collection/archive/stage::tmp-infostealer-layout
  - id: objectives/credential-access/phishing/lure::applescript-password-phish-validate
  any:
  - id: objectives/evasion/indicator-removal/cleanup::killall-terminal
  - id: micro-behaviors/process/create/script/osascript::do-shell-rm-binary
  - id: objectives/credential-access/theft/keywords::stealer-word
  needs: 1
