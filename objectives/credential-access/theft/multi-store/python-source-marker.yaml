defaults:
  platforms: [unix, windows]
  for: [python]

composite_rules:
  - id: credential-acquisition-objective-indicators
    desc: Python credential-acquisition objective indicators
    crit: component
    conf: 0.85
    any:
    - id: objectives/credential-access/browser/
    - id: objectives/credential-access/cloud/session/
    - id: objectives/credential-access/discord/
    - id: objectives/credential-access/files/config/
    - id: objectives/credential-access/keychain/
    - id: objectives/credential-access/ssh/key/
    - id: objectives/credential-access/wallet/
    - id: objectives/exfiltration/stealer/browser/
    - id: objectives/exfiltration/stealer/wallet/
    - id: objectives/exfiltration/stealer/credential::secret-phrase-telegram-send
    - id: objectives/exfiltration/stealer/credential::private-key-input-http-export
    - id: objectives/exfiltration/stealer/credential::secret-entry-encoded-http-export
    - id: objectives/impact/degrade/process::hidden-window-wallet-process-interference
    unless:
    - id: objectives/exfiltration/stealer/token/
    - id: objectives/exfiltration/stealer/cloud/
