defaults:
  platforms: [windows, unix, macos]
  for: [kotlin, class, java_class, jar]
  attack: T1041

composite_rules:
  - id: kotlin-windows-credential-sweep
    desc: Kotlin Windows credential sweep
    crit: suspicious
    conf: 0.95
    platforms: [windows]
    any:
      - id: micro-behaviors/fs/path/credential::kotlin-ssh-aws-path-cluster
      - id: objectives/credential-access/credential-manager/cli::kotlin-cmdkey-wifi-cluster
      - id: micro-behaviors/fs/path/credential::kotlin-gcloud-browser-cluster
      - id: micro-behaviors/fs/path/credential::developer-auth-file-reference
    unless:
      - id: metadata/file/extension/identity::markdown-file-basename
  - id: kotlin-developer-credential-theft
    desc: Kotlin targets developer credential files
    crit: hostile
    conf: 0.98
    platforms: [windows, unix]
    for: [kotlin]
    attack: T1552.001
    mbc: E1552
    all:
      - id: micro-behaviors/fs/read/file/target::credential-path-near-file-input
    any:
      - id: micro-behaviors/fs/path/credential::kotlin-ssh-aws-path-cluster
      - id: micro-behaviors/fs/path/credential::developer-auth-file-reference
    unless:
      - id: metadata/package/testing/
      - id: metadata/path::test-directory-component
      - id: well-known/tool/detection/
      - id: metadata/file/extension/identity::markdown-file-basename
