# Database credentials lifted out of a CMS configuration file by parsing it.
#
# `wp-config.php` holds `DB_NAME`, `DB_USER`, `DB_PASSWORD` and the table
# prefix. Code running inside WordPress already has all of them as PHP
# constants -- it never needs to locate the file, read it as text and regex
# the values back out. Doing so is how a plugin turns a site compromise into
# database access usable from anywhere, and it is what the June 2024
# WordPress.org source compromise did alongside its browser form grabber.
#
# The shape generalises past WordPress: the same walk-up, read, regex-the-
# secrets sequence serves Joomla `configuration.php`, Drupal `settings.php`
# and `.env`.
defaults:
  platforms: [windows, unix]
  for: [php]
  attack: T1552.001
  mbc: E1552

traits:
  - id: db-credential-define-extraction
    desc: Regex extracts DB credential constants
    crit: suspicious
    conf: 0.93
    if:
      type: text
      regex: 'preg_match[^;\n]{0,60}DB_(PASSWORD|USER|NAME)'
    unless:
      - id: metadata/package/testing/harness/unit/

  # Climbing to the filesystem root looking for a file. An application knows
  # where its own config lives; searching upward is what code does when it was
  # dropped somewhere it does not own.
  - id: parent-walk-to-root
    desc: Walks parent directories to the root
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: 'while\s*\(\s*\$\w+\s*!==?\s*[''"]/[''"]'
    unless:
      - id: metadata/package/testing/harness/unit/

composite_rules:
  - id: cms-config-credential-harvest
    desc: Parses CMS config for database credentials
    crit: hostile
    conf: 0.95
    scope: file
    all:
      - id: db-credential-define-extraction
      - id: micro-behaviors/fs/path/config/web::wordpress-config-path
      - id: micro-behaviors/fs/read/file::file-get-contents
    unless:
      - id: metadata/package/testing/harness/unit/
      - id: well-known/lib/runtime/php-runtime::source-tree
