# A case-insensitive findstr sweep of user files for password keywords whose
# matches are POSTed to an out-of-band collector. Sweeping alone is an audit
# idiom; pairing it with an OOB exfiltration channel is credential theft.
#
# Worked example: rank4222wun preinstall.js, which runs
# dir %USERPROFILE%\OneDrive /s /b | findstr /i "password secret config"
# on Windows and POSTs the output as JSON to an oastify.com collector.
defaults:
  crit: hostile
  platforms: [windows]
  for: [javascript, typescript]
  attack: T1552.001,T1041
  mbc: E1041

composite_rules:
  - id: password-sweep-oast-exfil
    desc: Password keyword sweep posted to OOB collector
    conf: 0.97
    scope: file
    all:
      - id: micro-behaviors/fs/search::findstr-password-keyword-sweep
      - id: micro-behaviors/communications/url/host/oob::oastify
      - id: micro-behaviors/communications/http/request/client::https-request
      - id: micro-behaviors/communications/http/request/verb::post-method-text
    unless:
      - id: metadata/package/testing/harness/runtime/
