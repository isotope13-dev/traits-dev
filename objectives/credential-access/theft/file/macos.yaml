  # A C++ collector that keeps every string encrypted in __TEXT,__const.
  # bazaar 3b46e51bf7a7 (2026-09): 59 bytes of __cstring against 123 KB of
  # code, a 14 KB __TEXT,__const at entropy 7.8, not one sentence, and yet
  # system()/popen() plus std::filesystem copy. The concealed-shell siblings
  # above never saw it: its lambda typeinfo and weak-def exports push the
  # string count past their `binary.string_count` / `exports.count` escapes.
  # Measuring where the strings went (a cipher-entropy constant blob beside an
  # emptied cstring section) does not depend on either count.
  - id: cipher-const-shell-file-collector
    desc: Encrypted-string Mach-O shells out and copies files
    crit: suspicious
    conf: 0.93
    for: [macho]
    size_max: 4194304
    attack: T1005,T1027
    all:
      - id: metadata/binary/section/entropy::high-entropy-const-region
      - id: metadata/binary/section/ratio::macho-extreme-sparse-cstring-section
      - id: metadata/file/profile/string-population::sparse-sentence-strings
      - id: micro-behaviors/fs/file/copy::cpp-filesystem-copy-file
    any:
      - id: micro-behaviors/process/create/shell/spawn::system-fn
      - id: micro-behaviors/process/create/shell/native::c-popen
    downgrade:
      any:
        - id: metadata/signed/platform::apple
  # The encrypted collector above, plus a routine the author named after what
  # it steals. The names corroborate; the conviction rests on the structure.
  - id: named-routine-cipher-const-stealer
    desc: Encrypted-string collector names stealer routines
    crit: hostile
    conf: 0.96
    for: [macho]
    size_max: 4194304
    attack: T1555
