# macOS Information Stealer Detection
# Detects macOS-specific information stealer patterns
# Combines hardware fingerprinting, credential targeting, and network exfiltration
defaults:
  platforms: [macos]
traits:
  - id: copy-directory-with-exclusions
    desc: Custom directory copying with exclusion logic
    crit: suspicious
    conf: 0.9
    mbc: E1083
    for: [macho]
    if:
      type: symbol
      substr: "copyDirectoryWithExclusions"
  # objectives/credential-access/theft/keywords::stealer-word is `for:
  # [scripts, source]` only, so it can never match a compiled Mach-O. Local
  # Macho-compatible duplicate of the same text regex, referenced by
  # stealer-labeled-obfuscated-collector below and by
  # objectives/credential-access/theft/stealer::stealer-word-obfuscated-macos-collector.
  - id: stealer-word-macho
    desc: Explicit infostealer terminology (compiled)
    crit: notable
    conf: 0.75
    for: [macho]
    if:
      type: text
      regex: '\b(info|credential)[-_ ]?stealer\b'
      case_insensitive: true
composite_rules:
  # Full stealer pattern: fingerprint + targeting + obfuscation + network
  - id: comprehensive-stealer-macos
    desc: "Comprehensive macOS information stealer"
    crit: hostile
    conf: 0.98
    attack: "T1555"
    mbc: "B0028"
    for: [macho]
    all:
      - id: objectives/discovery/system/fingerprint/machine-id::macos-hardware-uuid
      - id: objectives/anti-static/obfuscation/encoding/xor::string-decrypt
      - id: objectives/credential-access/validation/check::csidentity-password-auth
      - id: micro-behaviors/fs/path/password-store::chromium-safe-storage-service-name
  # macOS C++ stealer with custom directory copying logic
  - id: macos-cpp-stealer-copy-logic
    desc: "MacOS C++ Stealer with custom directory copy"
    crit: hostile
    conf: 0.95
    for: [macho]
    all:
      - id: copy-directory-with-exclusions
    any:
      - id: micro-behaviors/process/create/shell/spawn::shell-execution
      - id: micro-behaviors/process/daemonize/detach::fork-new-session
      - id: objectives/evasion/masquerade/naming::generic-bundle-id-pattern
      - id: metadata/signed/id::com.utils.application
      - id: metadata/signed/entitlements::highly-privileged
  # AppleScript-based browser credential stealer
  - id: applescript-browser-stealer
    desc: AppleScript-based browser credential stealer
    crit: hostile
    conf: 0.95
    attack: "T1555.003"
    for: [applescript, macho]
    all:
      - id: objectives/evasion/tcc-manipulation/db::tcc-db-alias
      - id: objectives/credential-access/browser/multi-target::browser-data-theft
  # TCC bypass with browser data theft
  - id: tcc-browser-theft
    desc: TCC database access for browser credential theft
    crit: hostile
    conf: 0.95
    attack: "T1555.003"
    for: [applescript, macho]
    needs: 2
    all:
      - id: objectives/evasion/tcc-manipulation/db::tcc-db-alias
    any:
      - id: micro-behaviors/fs/path/app-data::extension-settings-path
      - id: micro-behaviors/fs/path/cookie::cookies-path-concat
      - id: micro-behaviors/fs/path/password-store::login-data-path-concat
      - id: objectives/evasion/tcc-manipulation/db::tccclickjack-string
  - id: obfuscated-exceptions-shell-stealer
    desc: Obfuscated macOS entitlement shell stealer
    crit: suspicious
    conf: 0.97
    for: [macho]
    attack: T1555
    all:
      - id: micro-behaviors/process/create/shell/native::file-read-entitlement-shell-apis
      - id: objectives/anti-static/obfuscation/payload/shell::concealed-shell-execution-macho
      - id: metadata/signed/trust-level::adhoc
    any:
      - id: metadata/signed/entitlements::temporary-exception-mach-lookup
      - id: metadata/signed/entitlements::highly-privileged
    downgrade:
      any:
        - id: metadata/signed/platform::apple
  - id: entitled-daemon-screen-capture-stealer
