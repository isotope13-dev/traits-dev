composite_rules:
- platforms:
  - unix
  - windows
  for:
  - javascript
  - typescript
  id: developer-secret-name-cluster
  desc: References multiple developer credential names
  crit: notable
  conf: 0.94
  needs: 3
  near_bytes: 8192
  any:
  - id: micro-behaviors/crypto/asymmetric/key::private-key-identifier
  - id: micro-behaviors/crypto/asymmetric/key::node-wallet-key-token
  - id: micro-behaviors/crypto/mnemonic::node-mnemonic-token
  - id: micro-behaviors/crypto/mnemonic::node-seed-phrase-token
  - id: micro-behaviors/os/package-manager/config::node-auth-token-token
  - id: micro-behaviors/os/env/secret-name::aws-secret-access-key-var
