# RSBot stores game accounts in Settings/Accounts.ini as USERNAME= and
# PASSWORD= lines. Copying those lines into data.sqm is the stealer stage.
defaults:
  platforms: [windows, unix]
  for: [java_class, class]
traits:
  - id: rsbot-accounts-ini-path
    desc: References an RSBot accounts file
    crit: notable
    conf: 0.9
    if:
      type: text
      substr: /Settings/Accounts.ini
  - id: password-report-label
    desc: Report line labels a password
    crit: notable
    conf: 0.86
    if:
      type: text
      substr: ' Password: '
  - id: staged-data-sqm-path
    desc: Stages output in a data.sqm file
    crit: notable
    conf: 0.9
    if:
      type: text
      substr: /data.sqm
  - id: irc-class-reference
    desc: Imports a class named IRC
    crit: notable
    conf: 0.88
    if:
      type: symbol
      kind: import
      exact: IRC
  - id: sendmessage-method-name
    desc: Names a sendMessage method
    crit: notable
    conf: 0.8
    if:
      type: text
      substr: sendMessage
  - id: username-report-label
    desc: Report line labels a username
    crit: notable
    conf: 0.84
    if:
      type: text
      substr: 'Username: '
composite_rules:
  - id: rsbot-accounts-staged-to-sqm
    desc: Reads RSBot accounts into data.sqm
    crit: hostile
    conf: 0.93
    attack: T1552.001
    near_bytes: 4000
    all:
      - id: objectives/credential-access/theft/keywords::rsbot-accounts-ini-path
      - id: objectives/credential-access/theft/keywords::password-report-label
      - id: objectives/credential-access/theft/keywords::username-report-label
      - id: objectives/credential-access/theft/keywords::staged-data-sqm-path
