# Environment-variable names of high-value CI/CD secrets.
defaults:
  platforms: [unix]
  for: [shell, python, javascript, typescript, rust, github-actions]
traits:
- id: npm-docker-credential-var-name
  desc: NPM or Docker credential variable name
  crit: notable
  conf: 0.9
  if:
    type: text
    regex: '\b(NPM_TOKEN|NPM_AUTH_TOKEN|DOCKER_PASSWORD|DOCKER_TOKEN)\b'
- id: cloudflare-database-credential-var-name
  desc: Cloudflare or database credential variable name
  crit: notable
  conf: 0.9
  if:
    type: text
    regex: '\b(CLOUDFLARE_(API_TOKEN|API_KEY)|DATABASE_(URL|PASSWORD))\b'
- id: netlify-openai-credential-var-name
  desc: Netlify or OpenAI credential variable name
  crit: notable
  conf: 0.9
  if:
    type: text
    regex: '\b(NETLIFY_(AUTH_TOKEN|API_TOKEN)|OPENAI_(API_KEY|ORG_ID))\b'
- id: ssh-key-credential-var-name
  desc: SSH private-key credential variable name
  crit: notable
  conf: 0.9
  if:
    type: text
    regex: '\b(SSH_PRIVATE_KEY|SSH_KEY|PRIVATE_KEY_FILE)\b'
