# A grep/awk/sed invocation within a few bytes of a *_KEY shell variable.
# Credential-word proximity only; the CI-tampering composites in
# objectives/supply-chain/trojanized/build-pipeline add the exfiltration.
defaults:
  platforms: [unix]
  for: [shell]
traits:
# The KEY pair requires a `*_KEY` variable shape, matching the $PASS/$PASSWORD
# siblings in objectives/supply-chain/trojanized/build-pipeline. A bare `\bKEY\b` matched ordinary prose that happens to end in
# the word, e.g. `grep -q "BEGIN PUBLIC KEY"` in a PEM-handling script.
- id: shell-text-tool-near-key-variable
  desc: Grep-like tool reads a KEY-suffixed variable
  crit: notable
  conf: 0.75
  if:
    type: text
    regex: '\b(grep|awk|sed)\b.{0,50}\$?[A-Z0-9]+_KEY\b'
  unless:
    - id: metadata/lang/upstream::linux-kernel-secondary-tree-path
    - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-scripts
    - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-extra
    - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-mmfs
    - id: metadata/lang/upstream::linux-kernel-primary-tree-path
# Both KEY traits anchor the tool name on word boundaries: without them `sed`
# matched inside ordinary words, so a shell line like
# `[ -n "${FREE_KEY:-}" ] || { echo "no api_key parsed"; ... }` was reported as
# a key handed to a grep-like tool. The match is proximity, not a pipe, so the
# descriptions say "near" rather than "piped to".
- id: shell-key-variable-near-text-tool
  desc: KEY-suffixed variable near a grep-like tool
  crit: notable
  conf: 0.75
  if:
    type: text
    regex: '\$?[A-Z0-9]+_KEY\b.{0,50}\b(grep|awk|sed)\b'
