# Sensitive field NAMES as they appear in structured data — JSON/YAML keys,
# hash literals, form bodies. Each matcher sees only the key, never a value,
# a read, or a destination: any config file, SDK, test fixture, or installer
# blueprint that has a credential field trips them. They are therefore
# component-level vocabulary, useful only when a composite adds the operation
# (a transcript replay, an upload sink, an exfil transport).
#
# These four were defined inside objectives/evasion/security-bypass/llm/prompt/,
# which made a plain `"password":` key read as an LLM prompt-injection finding;
# the reasoning-replay composite there references them cross-directory instead.
defaults:
  platforms: [unix, windows]
  for: [scripts, source, json]
  crit: component
  conf: 0.96

traits:
  - id: api-key-field-name
    desc: API-key field name in structured data
    if:
      type: text
      regex: '["'']api[_-]?key["'']'
      case_insensitive: true

  - id: access-token-field-name
    desc: Access-token field name in structured data
    if:
      type: text
      regex: '["'']access[_-]?token["'']'
      case_insensitive: true

  - id: password-field-name
    desc: Password field name in structured data
    if:
      type: text
      regex: '["'']password["'']\s*(:|=>)'
      case_insensitive: true

  - id: private-key-field-name
    desc: Private-key field name in structured data
    if:
      type: text
      regex: '["'']private[_-]?key["'']'
      case_insensitive: true

composite_rules:
  # Two *different* credential field names in one file. Still only vocabulary —
  # an .env sample or an SDK config carries both — so it stays a component that
  # composites elsewhere combine with the operation performed on the data.
  - id: multiple-sensitive-field-names
    desc: Two distinct credential field names in structured data
    crit: component
    conf: 0.9
    needs: 2
    any:
      - id: api-key-field-name
      - id: access-token-field-name
      - id: password-field-name
      - id: private-key-field-name
