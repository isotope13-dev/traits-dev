---
defaults:
  platforms:
  - windows
  - unix
  crit: component
  conf: 0.2
  for:
  - scripts
  - source
traits:
- id: two-factor-auth-keyword
  desc: 'Bare keyword: 2fa'
  conf: 0.3
  if:
    type: string_literal
    exact: 2fa
- id: password
  desc: Password targeted by theft action
  crit: notable
  conf: 0.75
  if:
    type: text
    regex: '\b(steal|harvest|dump)\b.{0,40}\bpassword\b'
    case_insensitive: true
  unless:
  - id: metadata/package/testing/
  - type: text
    regex: '\bparsed\.username\s*!==\s*""\s*\|\|\s*parsed\.password\s*!==\s*""'
  - type: text
    regex: '\bURL\.password\b.{0,160}\bSSRF\b|\bSSRF\b.{0,160}\bURL\.password\b'
  - type: text
    regex: '"password"\s*:\s*"123"[\s\S]{0,240}"database"\s*:'
  - type: text
    regex: '"password"\s*:\s*"123"'
  - id: metadata/path::test-directory-component
composite_rules:
- id: credential-keywords
  desc: Credential-access vocabulary component
  crit: component
  conf: 0.3
  any:
  - id: micro-behaviors/data/parse/vocabulary::token-extraction-wording
  - id: metadata/lang/natural/phrasing::secret-acquisition-wording
  - id: password
  - id: metadata/lang/source/naming/action::credential-acquisition-wording
