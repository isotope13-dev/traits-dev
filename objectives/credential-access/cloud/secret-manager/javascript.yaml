# Secret Manager access with a hard-coded service-account key is a risky
# application configuration, but it does not by itself establish credential
# theft. The capability composite now lives beside the cloud-auth atoms.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]

composite_rules:
  # Ordinary applications enumerate and read secrets. The independently
  # established credential-export and registry propagation supply the abuse
  # context; bundled SDK method definitions alone do not satisfy the AWS leg.
  - id: registry-worm-cloud-secret-collection
    desc: Credential-exporting registry worm reads cloud secrets
    crit: hostile
    conf: 0.98
    attack: T1555.006,T1195.002
    all:
      - id: objectives/lateral-movement/worm/registry::npm-maintainer-credential-worm
      - id: micro-behaviors/os/security/credential-manager::cloud-secret-value-requests
    any:
      - id: objectives/exfiltration/http/github::github-repo-contents-exfil
      - id: objectives/exfiltration/http/github::github-repo-harvested-env-exfil
