# A distributed JavaScript package embeds a GCP service-account private key
# and uses that identity to retrieve cloud secrets. Requiring both the key
# structure and the secret read call distinguishes this from libraries that
# merely ship credential examples or PEM parsing support.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  crit: hostile
  conf: 0.97
  attack: T1552.001,T1552.004

composite_rules:
  - id: embedded-gcp-key-secret-read
    desc: Embedded GCP service-account key retrieves cloud secrets
    conf: 0.97
    near_lines: 30
    all:
      - id: micro-behaviors/crypto/key/representation::pem-private-key-header
      - id: micro-behaviors/crypto/key/representation::pem-private-key-body
      - id: micro-behaviors/crypto/key/representation::pem-private-key-footer
      - id: micro-behaviors/data/parse/vocabulary::private-key-field-name
      - id: micro-behaviors/os/security/auth/cloud::gcp-service-account-email
      - id: objectives/credential-access/cloud/datastore::service-account-type-field
      - id: micro-behaviors/os/security/auth/cloud::gcp-secret-version-access
    unless:
      - id: metadata/package/testing/
      - id: metadata/file/naming::test-directory-component
