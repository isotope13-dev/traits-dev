# Kaggle's api-key secret RPC is an authenticated secret-store query. A
# package that reads the account identifier out of that RPC's error and
# uploads the notebook identity with user data spends the notebook's secret
# session to identify the account and host. The notable legs stay separate
# so SDK-only observations remain reviewable.
defaults:
  platforms: [unix, windows]
  for: [python, whl, python-sdist, zip]

composite_rules:
  - id: kaggle-secret-query-with-notebook-identity-upload
    desc: Kaggle api-key secret query uploads notebook identity
    crit: hostile
    conf: 0.96
    attack: T1552.001,T1589
    scope: archive
    all:
      - id: micro-behaviors/communications/http/telemetry::kaggle-secret-query-notebook-upload-context
      - id: micro-behaviors/data/parse/regex::secret-rpc-error-visitor-identity-context
