defaults:
  platforms: [unix, windows]
  for: [python]
  attack: T1552.001

traits:
  - id: kaggle-api-key-secret-request
    desc: Requests Kaggle's api-key user secret
    crit: notable
    conf: 0.98
    if:
      type: text
      regex: 'GetUserSecretByLabelRequest[\s\S]{0,1000}post\(url,[\s\S]{0,100}api-key'

composite_rules:
  - id: kaggle-api-key-secret-request-in-package
    desc: Kaggle api-key secret request in a Python package
    crit: notable
    conf: 0.98
    for: [python, whl, python-sdist, zip]
    scope: archive
    all:
      - id: kaggle-api-key-secret-request
      - id: micro-behaviors/communications/http/request/body::tracking-metrics-json-payload

  # The hostile chain requires a specific authenticated secret-store query
  # and a separate cross-layer identity profile upload. It does not claim the
  # Kaggle secret value itself is sent to the tracking endpoint.
  - id: kaggle-secret-query-with-notebook-identity-upload
    desc: Queries Kaggle's API-key secret and uploads a notebook identity profile
    crit: hostile
    conf: 0.96
    for: [python, whl, python-sdist, zip]
    scope: archive
    all:
      - id: kaggle-api-key-secret-request
      - id: micro-behaviors/communications/rpc::secret-read-rpc-session-token-context
      - id: micro-behaviors/communications/http/telemetry::python-remote-fingerprint-host-profile-upload

