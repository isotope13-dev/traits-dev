defaults:
  platforms: [unix, windows]
  for: [python]
  attack: T1552.001

traits:
  - id: kaggle-api-key-secret-request
    desc: Requests Kaggle's api-key user secret
    crit: notable
    conf: 0.98
    if:
      type: text
      regex: 'GetUserSecretByLabelRequest[\s\S]{0,1000}post\(url,[\s\S]{0,100}api-key'

composite_rules:
  - id: kaggle-api-key-request-with-notebook-tracking
    desc: Requests Kaggle api-key secret with identity upload
    crit: hostile
    conf: 0.98
    attack: T1552.001,T1589
    for: [python, whl, python-sdist, zip]
    scope: archive
    all:
      - id: kaggle-api-key-secret-request
      - id: micro-behaviors/communications/http/telemetry::python-notebook-identity-tracking-upload
