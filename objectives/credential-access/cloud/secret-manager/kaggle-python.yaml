defaults:
  platforms: [unix, windows]
  for: [python]
  attack: T1552.001

traits:
  - id: kaggle-api-key-secret-request
    desc: Requests Kaggle's api-key user secret
    crit: notable
    conf: 0.98
    if:
      type: text
      regex: 'GetUserSecretByLabelRequest[\s\S]{0,1000}post\(url,[\s\S]{0,100}api-key'

