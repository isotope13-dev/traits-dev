# Same-command operand binding prevents an unrelated /tmp variable or a
# separate copy operation from turning an ordinary profile backup into staging.
# Another assignment ends the local staging window; do not infer dataflow
# through reassigned variables.
defaults:
  platforms: [unix]
  for: [shell]
  crit: suspicious
traits:
  - id: shell-cloud-profile-temp-staging
    desc: Stages cloud profiles in a temporary directory
    conf: 0.98
    attack: T1552.001
    if:
      type: tree-sitter
      language: shell
      query: |
        ((program
           (variable_assignment name: (variable_name) @stage value: (_) @temporary) .
           [(comment) (command) (redirected_statement)]* .
           [(command name: (command_name) @copy
              argument: (_) @source
              argument: [(string [(simple_expansion (variable_name) @stage_use)
                                 (expansion (variable_name) @stage_use)])
                         (concatenation [(simple_expansion (variable_name) @stage_use)
                                        (expansion (variable_name) @stage_use)])] @destination)
            (redirected_statement body:
              (command name: (command_name) @copy
                argument: (_) @source
                argument: [(string [(simple_expansion (variable_name) @stage_use)
                                 (expansion (variable_name) @stage_use)])
                         (concatenation [(simple_expansion (variable_name) @stage_use)
                                        (expansion (variable_name) @stage_use)])] @destination))])
         (#match? @temporary "^[\"']?/(var/)?tmp/")
         (#eq? @stage @stage_use)
         (#match? @copy "^(/(usr/)?bin/)?cp$")
         (#match? @source "^[\"']?(~|\\$HOME|\\$\\{HOME\\})/\\.(aws|docker|config/gcloud)/?[\"']?$")
         (#match? @destination "^[\"']?\\$\\{?[A-Za-z_][A-Za-z0-9_]*\\}?/[^\"']+[\"']?$"))
