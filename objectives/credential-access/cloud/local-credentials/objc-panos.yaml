defaults:
  platforms: [panos, appliance, unix]
  for: [objc, c, elf, macho]
  attack: T1552

traits:
  - id: objc-panos-aws-creds-home-var
    desc: ObjC AWS creds HOME path
    crit: notable
    conf: 0.9
    if:
      type: text
      substr: $HOME/.aws/credentials

  - id: objc-panos-aws-creds-root
    desc: ObjC AWS creds root path
    crit: notable
    conf: 0.9
    if:
      type: text
      substr: /root/.aws/credentials

  - id: objc-panos-aws-creds-userhome
    desc: ObjC AWS creds user-home path
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '/home/.{1,64}/\.aws/credentials'

  - id: objc-panos-aws-creds-format
    desc: ObjC AWS creds format path
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '%[s@]/\.aws/credentials'

  - id: objc-panos-aws-creds-tilde
    desc: ObjC AWS creds tilde path
    crit: notable
    conf: 0.9
    if:
      type: text
      substr: ~/.aws/credentials

  - id: objc-panos-cloud-env-token-set
    desc: ObjC PAN-OS cloud env token set
    crit: suspicious
    conf: 0.94
    if:
      type: text
      regex: 'PAN-OS[\s\S]{0,260}AWS_SECRET_ACCESS_KEY[\s\S]{0,260}AZURE_CLIENT_SECRET'

composite_rules:
  # Renamed and demoted from `objc-panos-aws-creds-file` / suspicious. Every
  # leg is a spelling of the AWS shared-credentials path, which each AWS SDK
  # embeds as its default profile location -- litellm's Rust bridge carries
  # `~/.aws/config~/.aws/credentials` because it talks to Bedrock. Referencing
  # the path is a sensitive-file capability, not PAN-OS credential theft; the
  # hostile composites below add the token-cache evidence that is.
  - id: aws-shared-credentials-path-reference
    desc: References the AWS shared credentials path
    crit: notable
    conf: 0.94
    any:
      - id: objc-panos-aws-creds-home-var
      - id: objc-panos-aws-creds-root
      - id: objc-panos-aws-creds-userhome
      - id: objc-panos-aws-creds-format
      - id: objc-panos-aws-creds-tilde
    unless:
      - id: well-known/tool/detection/skillmap::skillmap-supply-chain-auditor
      - id: well-known/tool/detection/innerwarden::innerwarden-defensive-tool-context
      - id: well-known/lib/cloud/aws-crt::python-native-addon-path

  - id: objc-panos-cloud-file-token-harvest
    desc: ObjC PAN-OS cloud file token
    crit: hostile
    conf: 0.98
    all:
      - id: aws-shared-credentials-path-reference
      - id: micro-behaviors/fs/path/token::azure-msal-token-cache
    unless:
      - id: well-known/app/infrastructure/teleport::go-module

  - id: objc-panos-cloud-token-harvest
    desc: ObjC PAN-OS cloud token harvest
    crit: hostile
    conf: 0.98
    all:
      - id: objc-panos-cloud-env-token-set
      - id: micro-behaviors/os/container/runtime::serviceaccount-token
