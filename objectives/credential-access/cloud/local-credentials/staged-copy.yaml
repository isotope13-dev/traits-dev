defaults:
  platforms: [unix]
  for: [shell, applescript]

traits:
  - id: aws-directory-copy-to-tmp
    desc: Copies AWS profile directory into /tmp
    crit: suspicious
    conf: 0.94
    attack: T1552.001
    if:
      type: text
      regex: '\bcp\s+-[A-Za-z]*[Rr][A-Za-z]*\s+(~|\$HOME)/\.aws/?\s+/tmp/'
