defaults:
  platforms: [unix]
  for: [shell, applescript, javascript, typescript, python]
  crit: suspicious
  attack: T1552.001
traits:
  # Embedded commands in other source languages retain their prior coverage.
  # Native shell uses a parsed command so quoted examples are not operations.
  - id: aws-directory-copy-to-tmp-command-text
    desc: AWS profile copy command text targets /tmp
    for: [applescript, javascript, typescript, python]
    conf: 0.94
    if:
      type: text
      regex: "\\bcp\\s+-[A-Za-z]*[Rr][A-Za-z]*\\s+[\"']?(~|\\$HOME|\\$\\{HOME\\})/\\.aws/?[\"']?\\s+[\"']?/tmp/"
  - id: shell-aws-directory-copy-to-tmp
    desc: Copies AWS profile directory into /tmp
    for: [shell]
    conf: 0.98
    if:
      type: tree-sitter
      language: shell
      query: |
        ((command name: (command_name) @copy
           argument: (_) @flags argument: (_) @source argument: (_) @destination)
         (#match? @copy "^(/(usr/)?bin/)?cp$")
         (#match? @flags "^-[A-Za-z]*[Rr][A-Za-z]*$")
         (#match? @source "^[\"']?(~|\\$HOME|\\$\\{HOME\\})/\\.aws/?[\"']?$")
         (#match? @destination "^[\"']?/tmp/"))
composite_rules:
  - id: aws-directory-copy-to-tmp
    desc: Copies AWS profile directory into /tmp
    conf: 0.94
    any:
      - id: aws-directory-copy-to-tmp-command-text
      - id: shell-aws-directory-copy-to-tmp
