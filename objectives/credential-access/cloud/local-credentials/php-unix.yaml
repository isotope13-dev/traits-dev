defaults:
  platforms: [unix]
  for: [php]
  attack: T1552.001

traits:
  - id: php-cloud-credential-files
    desc: PHP cloud credential files
    crit: suspicious
    conf: 0.92
    if:
      type: text
      regex: '\.aws/credentials[\s\S]{0,180}\.kube/config'

composite_rules:
  - id: php-cloud-local-credential-sweep
    desc: PHP cloud credential sweep
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/os/env/vars/credentials::php-cloud-secret-env-list
    any:
      - id: php-cloud-credential-files
      - id: metadata/file/string/cloud::cloud-instance-metadata-link-local-host
