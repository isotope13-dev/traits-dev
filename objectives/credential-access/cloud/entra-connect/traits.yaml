defaults:
  for: [scripts, source, pe, dll]
  platforms: [windows]
  attack: T1003

composite_rules:
  - id: encrypted-connector-configuration-dump
    desc: Extracts Entra Connect connector secrets
    crit: hostile
    conf: 0.99
    all:
      - id: micro-behaviors/data/db/sql::entra-connect-connector-configuration
      - id: micro-behaviors/data/db/sql::entra-connect-key-metadata
      - id: micro-behaviors/os/registry/read::entra-connect-database-parameters

  - id: connector-key-decryption
    desc: Decrypts Entra Connect connector key
    crit: hostile
    conf: 0.99
    all:
      - id: micro-behaviors/data/db/sql::entra-connect-connector-configuration
      - id: micro-behaviors/data/db/sql::entra-connect-key-metadata
      - id: micro-behaviors/os/registry/read::entra-connect-shared-key
    any:
      - id: micro-behaviors/os/security/dpapi::dotnet-protected-data-unprotect
      - id: micro-behaviors/os/security/dpapi::crypt-unprotect-data-api
      - id: micro-behaviors/os/security/dpapi::crypt-unprotect-data-source-reference
    needs: 1
