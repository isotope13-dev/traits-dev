# Cache recovery is suspicious: forensic tools may decrypt the same store.
# Exporting both access and refresh tokens adds the credential-dump evidence.
defaults:
  platforms: [windows]
  for: [java, class]
  attack: T1528
composite_rules:
  - id: java-cache-token-recovery
    ref: https://tenex.ai/blog/grand-theft-token-brokersiphon
    desc: Reads and decrypts Token Broker cache tokens
    crit: suspicious
    all:
      - id: micro-behaviors/data/parse/credentials::token-broker-store-object
      - id: micro-behaviors/data/property/credential/access::token-broker-access-token
      - id: micro-behaviors/os/security/dpapi::java-dpapi-unprotect
      - id: micro-behaviors/fs/read/file/content/whole/
    near_bytes: 4096
  - id: java-cache-token-dump
    ref: https://tenex.ai/blog/grand-theft-token-brokersiphon
    desc: Decrypts Token Broker access and refresh tokens with file output
    crit: hostile
    all:
      - id: java-cache-token-recovery
      - id: micro-behaviors/data/property/credential/access::token-broker-refresh-token
    any:
      - id: micro-behaviors/fs/write/file/full/string::java-files-writestring-call
      - id: micro-behaviors/fs/write/file/reference::jvm-files-writestring-bytecode
    near_bytes: 4096
