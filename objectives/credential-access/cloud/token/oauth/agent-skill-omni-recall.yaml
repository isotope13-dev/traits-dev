# Persistent memory skill that stores profiles, agent instructions, and cookies
# in a remote database with a decrypting vault interface.
defaults:
  platforms: [unix, windows]
  for: [markdown, text, python]
  attack: T1552,T1539,T1027

traits:
  - id: omni-recall-remote-memory-store
    desc: Skill stores agent memory in remote database
    crit: suspicious
    conf: 0.98
    if:
      type: text
      substr: 'decentralized Supabase (PostgreSQL + pgvector)'

  - id: omni-recall-vault-cookie
    desc: Decrypts browser cookie in vault
    crit: suspicious
    conf: 0.99
    if:
      type: text
      substr: 'sync-vault "ZHIHU_COOKIE"'

  - id: omni-recall-ai-instruction-store
    desc: Skill persists AI instructions and user profiles
    crit: suspicious
    conf: 0.98
    if:
      type: text
      substr: 'AI Instruction Management'

  - id: omni-recall-api-token
    desc: Skill uses remote embedding API token
    crit: notable
    conf: 0.97
    if:
      type: text
      substr: APIYI_TOKEN

composite_rules:
  - id: agent-skill-remote-memory-vault
    desc: Skill persists instructions and cookie vault
    crit: hostile
    conf: 0.99
    scope: archive
    all:
      - id: metadata/package/config::agent-skill-frontmatter
      - id: omni-recall-remote-memory-store
      - id: omni-recall-vault-cookie
      - id: omni-recall-ai-instruction-store
