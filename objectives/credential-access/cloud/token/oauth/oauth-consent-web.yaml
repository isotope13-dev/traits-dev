defaults:
  platforms: [unix, windows]
  for: [html, javascript]
  attack: T1528

traits:
# The three `--rx-N` atoms are alternatives split out of one signature for the
# oauth-redirect-with-target-email composite below. Each is a bare fragment
# (`GoogleVerify` is also a gRPC method name in ordinary Google sign-in
# clients), so none carries a claim of its own; the hostile composite below
# requires a target marker with the Gmail scope and authorize URL.
- id: oauth-redirect-with-target-email--rx-7
  desc: Regex component marker
  crit: component
  conf: 0.86
  if:
    type: text
    substr: '[TARGET EMAIL'
- id: oauth-redirect-with-target-email--rx-8
  desc: Regex component marker
  crit: component
  conf: 0.86
  if:
    type: text
    substr: GoogleVerify
- id: oauth-redirect-with-target-email--rx-9
  desc: Regex component marker
  crit: component
  conf: 0.86
  if:
    type: text
    substr: GoogleCert
composite_rules:
- id: targeted-google-oauth-consent-phish
  for: [javascript]
  desc: Targeted Google OAuth consent phishing URL
  crit: hostile
  conf: 0.97
  attack: T1566.002
  all:
  - id: micro-behaviors/communications/http/oauth::google-oauth-authorize-url
  - id: oauth-redirect-with-target-email
  - id: micro-behaviors/communications/http/oauth::google-gmail-scope-mail
  any:
  - id: micro-behaviors/communications/http/oauth::oauth-offline-access-url
  - id: micro-behaviors/communications/http/oauth::oauth-consent-prompt-parameter
- id: google-basic-identity-offline-consent
  for: [javascript]
  desc: Google OAuth limited identity scopes with offline forced consent
  crit: suspicious
  conf: 0.9
  all:
  - id: micro-behaviors/communications/http/oauth::google-oauth-authorize-url
  - id: micro-behaviors/communications/http/oauth::google-basic-identity-scopes
  - id: micro-behaviors/communications/http/oauth::oauth-offline-access-url
  - id: micro-behaviors/communications/http/oauth::oauth-consent-prompt-parameter
# Grouped alternative of the fragments above, consumed by the consent-phish
# composites; on its own it states no behaviour.
- id: oauth-redirect-with-target-email
  desc: OAuth redirect carries target email
  crit: component
  conf: 0.86
  any:
  - id: oauth-redirect-with-target-email--rx-7
  - id: oauth-redirect-with-target-email--rx-8
  - id: oauth-redirect-with-target-email--rx-9
