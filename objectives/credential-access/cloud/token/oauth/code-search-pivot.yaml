# Automated code-forge secret scraping coupled with Microsoft Entra OAuth
# client-credentials sign-in and downstream tenant resource access (Microsoft
# Threat Intelligence / Todyl, November 2026). Defensive secret scanners query
# code search or validate isolated tokens, whereas intrusion crawlers combine
# code-search harvesting with unattended service-principal sign-in and Azure or
# Microsoft Graph resource access in the same workflow.
defaults:
  platforms: [unix, windows]
  for: [scripts, source, binaries]
  crit: hostile
  conf: 0.98
  attack: T1552.001,T1078.004,T1550.001

composite_rules:
  - id: code-search-secret-scrape-oauth-pivot
    desc: Scrapes code-forge search for OAuth secrets and pivots into Entra resources
    all:
      - id: micro-behaviors/communications/http/services/code-forge::code-forge-code-search-endpoint
      - id: micro-behaviors/communications/http/oauth::microsoft-oauth-token-endpoint
      - id: micro-behaviors/communications/http/services/azure::microsoft-service-principal-token-request
      - id: micro-behaviors/communications/http/oauth::oauth-client-secret-field
    any:
      - id: micro-behaviors/communications/http/services/azure::arm-management-host
      - id: micro-behaviors/communications/http/services/keyvault-azure::vault-service-reference
      - id: micro-behaviors/communications/http/services/microsoft::graph-service-host
      - id: micro-behaviors/communications/http/services/microsoft::microsoft-graph-domain
    near_bytes: 131072
