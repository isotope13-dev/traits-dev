# FOCI-style token probing can use developer clients, without the Office or
# broker IDs required by bulk-first-party-refresh-token-replay. A normal
# single-client refresh is a near miss. Co-occurrence does not prove that a
# token was stolen, that the requests succeeded, or that a cache was read.
defaults:
  platforms: [unix]
  for: [shell]

composite_rules:
  - id: microsoft-cli-multi-client-refresh
    desc: Refresh grants beside multiple Microsoft CLI client identities
    crit: suspicious
    conf: 0.95
    attack: T1550.001
    scope: file
    near_bytes: 2400
    all:
      - id: micro-behaviors/communications/http/oauth::azure-cli-client-id
      - id: micro-behaviors/communications/http/oauth::azure-powershell-client-id
      - id: micro-behaviors/communications/http/request/oauth2::curl-microsoft-refresh-grant
