# The new application password is written to stdout next to the Global
# Administrator role id and the addPassword call. This is collection of the
# minted secret. It does not itself require the role-creation composite, so a
# read of that role id cannot satisfy it without the printed secret.
defaults:
  platforms: [unix, windows]
  for: [python, javascript, typescript, powershell, go, php, ruby, csharp]
  attack: T1528

composite_rules:
  - id: graph-admin-grant-secret-stdout
    desc: Prints Graph app secret beside Global Administrator role
    crit: hostile
    conf: 0.96
    attack: T1528,T1098.001
    scope: leaf
    near_bytes: 1600
    all:
      - id: micro-behaviors/os/security/auth/rbac::entra-global-admin-role-id
      - id: micro-behaviors/communications/http/services/microsoft::graph-application-credential-add-path
    any:
      - id: micro-behaviors/os/console/io::prints-graph-password-secret-text
      - id: micro-behaviors/os/console/io::go-prints-read-http-body
    needs: 1
