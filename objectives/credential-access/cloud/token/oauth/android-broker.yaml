defaults:
  platforms: [android]
  for: [java]

composite_rules:
  # This is an impersonating broker request, not ordinary OAuth sign-in.
  # The caller supplies an installed app's UID and reconstructs its redirect.
  - id: installed-identity-broker-token-capture
    desc: Collects broker result using installed package caller identity
    crit: hostile
    conf: 0.97
    attack: T1528
    all:
      - id: objectives/evasion/masquerade/identity/app::installed-package-uid-as-broker-caller
      - id: micro-behaviors/os/message/intent::android-authenticator-account-chooser-target
      - id: micro-behaviors/os/message/intent::android-broker-compressed-result-read
      - id: micro-behaviors/communications/url/scheme::android-msauth-redirect-literal
      - id: micro-behaviors/os/package-manager/management::android-package-info-query
      - id: micro-behaviors/os/package-manager/management::android-signing-cert-flag
      - id: micro-behaviors/crypto/hash/digest::java-md5-or-sha1-digest-initialize
