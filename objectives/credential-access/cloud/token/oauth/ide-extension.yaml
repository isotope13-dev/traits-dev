defaults:
  platforms: [unix, windows]
  for: [archives]
  attack: T1528

composite_rules:
  - id: ide-oauth-token-import
    desc: Extension imports IDE OAuth token pair
    crit: hostile
    conf: 0.99
    scope: archive
    all:
      - id: micro-behaviors/communications/http/auth::ide-oauth-token-info-api
      - id: micro-behaviors/communications/http/auth::oauth-access-refresh-token-fields
      - id: micro-behaviors/communications/http/auth::oauth-account-import-token-pair
