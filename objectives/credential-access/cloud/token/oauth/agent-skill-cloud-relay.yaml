# Google Workspace agent skills that route OAuth refresh tokens through a
# third-party cloud function instead of refreshing directly with Google.
defaults:
  platforms: [unix, windows]
  for: [markdown, text, javascript, typescript, python]
  attack: T1528,T1550

traits:
  - id: google-workspace-cloud-oauth-endpoint
    desc: References Gemini Workspace OAuth relay
    crit: notable
    conf: 0.98
    if:
      type: text
      regex: '(?i)google-workspace-extension\.geminicli\.com'

  - id: google-workspace-refresh-token-relay
    desc: Posts refresh token to cloud relay
    crit: suspicious
    conf: 0.99
    if:
      type: text
      substr: refreshViaCloudFunction

  - id: python-refresh-token-json-request-field
    desc: Python JSON request carries refresh token
    crit: component
    conf: 0.94
    for: [python]
    if:
      type: text
      regex: '(?i)["'']refresh_token["'']\s*:\s*refresh_token'

composite_rules:
  - id: google-workspace-refresh-token-broker-implementation
    desc: Relays Google refresh tokens via custom HTTP
    crit: suspicious
    conf: 0.995
    for: [python]
    scope: file
    all:
      - id: google-workspace-cloud-oauth-endpoint
      - id: python-refresh-token-json-request-field
      - id: micro-behaviors/communications/http/client/initialize::urllib-request-symbol
      - id: micro-behaviors/communications/http/client/exchange::urllib-urlopen-call-symbol

  - id: agent-skill-google-token-cloud-relay
    for: [markdown, text, javascript, typescript, python, zip, npm, whl, tar]
    desc: Agent skill relays Google refresh tokens
    crit: hostile
    conf: 0.98
    scope: archive
    all:
      - id: metadata/package/agent-skill::agent-skill-frontmatter
      - id: google-workspace-refresh-token-broker-implementation
      # A Gmail scope is neutral on its own. The suspicious relay endpoint and
      # refresh-token flow above supply the security-relevant intent.
      - id: micro-behaviors/communications/http/oauth::google-gmail-scope-mail

  - id: agent-skill-google-workspace-cloud-relay
    for: [markdown, text, javascript, typescript, python, zip, npm, whl, tar]
    desc: Agent skill routes Workspace tokens through cloud
    crit: hostile
    conf: 0.99
    scope: archive
    all:
      - id: metadata/package/agent-skill::agent-skill-frontmatter
      - id: google-workspace-refresh-token-broker-implementation

  - id: agent-skill-google-oauth-code-and-token-relay
    for: [markdown, text, python, javascript, typescript, zip, npm, whl, tar]
    desc: Agent skill relays Google OAuth credentials
    crit: hostile
    conf: 0.99
    scope: archive
    all:
      - id: metadata/package/agent-skill::agent-skill-frontmatter
      - id: google-workspace-cloud-oauth-endpoint
      - id: micro-behaviors/communications/http/oauth::oauth-redirect-uri-url-variable
      - id: micro-behaviors/data/serialize/schema-credential::python-refresh-token-json-body
