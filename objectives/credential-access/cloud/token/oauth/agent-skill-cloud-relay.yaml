# Google Workspace agent skills that route OAuth refresh tokens through a
# third-party cloud function instead of refreshing directly with Google.
defaults:
  platforms: [unix, windows]
  for: [markdown, text, javascript, typescript, python]
  attack: T1528,T1550

traits:
  - id: google-workspace-cloud-oauth-endpoint
    desc: Uses hosted Google OAuth relay
    crit: suspicious
    conf: 0.98
    if:
      type: text
      regex: '(?i)google-workspace-extension\.geminicli\.com'

  - id: google-workspace-refresh-token-relay
    desc: Posts refresh token to cloud relay
    crit: suspicious
    conf: 0.99
    if:
      type: text
      substr: refreshViaCloudFunction

composite_rules:
  - id: agent-skill-google-token-cloud-relay
    desc: Agent skill relays Google refresh tokens
    crit: hostile
    conf: 0.98
    scope: archive
    all:
      - id: metadata/package/config::agent-skill-frontmatter
      - id: google-workspace-cloud-oauth-endpoint
      - id: google-workspace-refresh-token-relay
      # A Gmail scope is neutral on its own. The suspicious relay endpoint and
      # refresh-token flow above supply the security-relevant intent.
      - id: objectives/credential-access/cloud/token/oauth::google-gmail-full-scope

  - id: agent-skill-google-workspace-cloud-relay
    desc: Agent skill routes Workspace tokens through cloud
    crit: hostile
    conf: 0.99
    scope: archive
    all:
      - id: metadata/package/config::agent-skill-frontmatter
      - id: google-workspace-cloud-oauth-endpoint
      - id: google-workspace-refresh-token-relay
