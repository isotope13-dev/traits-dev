defaults:
  platforms: [windows]
  for: [pe]
  attack: T1528
traits:
  - id: sharex-uploaderslib-assembly
    desc: ShareX uploader library assembly
    crit: component
    conf: 0.95
    if:
      type: text
      substr: ShareX.UploadersLib

composite_rules:
  - id: google-oauth-credential-scope-pack
    desc: Google OAuth scopes target mailbox and contacts
    crit: suspicious
    conf: 0.95
    all:
      - id: micro-behaviors/communications/http/oauth::google-accounts
    any:
      - id: micro-behaviors/communications/http/services/google::google-drive-auth-scope
      - id: micro-behaviors/communications/http/oauth::google-gmail-compose-scope
      - id: micro-behaviors/communications/http/services/google::contacts-readonly-scope
      - id: micro-behaviors/communications/http/oauth::google-userinfo-profile-scope
    needs: 2
    unless:
      - id: sharex-uploaderslib-assembly
      - id: well-known/lib/runtime/electron::electron-chromium-runtime-strong
      - id: well-known/app/storage/syncback/
      - id: well-known/app/media/screenpipe::screenpipe-known-app-context
      - id: well-known/app/enterprise/microsoft-office-c2r::microsoft-office-c2r-client-context

  - id: cloud-oauth-injection-token-stealer
    desc: Cloud OAuth surface injects process
    crit: hostile
    conf: 0.97
    all:
      - id: micro-behaviors/communications/http/oauth::multi-provider-oauth-endpoints
    any:
      - id: objectives/evasion/process/injection/memory::process-inject-api
      - id: objectives/evasion/fileless/memory::remote-injection
      - id: objectives/evasion/process/injection/toolkit::cross-process-injector-runtime-dll-target
      - id: micro-behaviors/mem/create/shared::nt-section-map-dynamic-apis
    needs: 2
    unless:
      - id: sharex-uploaderslib-assembly
      # Appending already-built PE hosts makes their OAuth and injection
      # surfaces visible in the infector's overlay. Do not combine those
      # independent programs into a token-theft claim.
      - id: objectives/impact/infect/binary/rewrite::repeated-standard-pe-overlay-infector
      - id: objectives/impact/infect/binary/rewrite::self-copying-repeated-pe-image-stack
