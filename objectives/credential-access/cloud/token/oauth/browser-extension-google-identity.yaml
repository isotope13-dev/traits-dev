defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]

traits:
  - id: google-userinfo-endpoint
    desc: Google OAuth userinfo endpoint
    crit: component
    conf: 0.9
    if:
      type: text
      substr: https://www.googleapis.com/oauth2/v3/userinfo

  - id: profile-json-email-field
    desc: Serialized profile email field
    crit: component
    conf: 0.88
    if:
      type: text
      regex: 'JSON\.stringify\s*\([^)]{0,260}\bemail\s*:'
    unless:
      - id: metadata/package/testing/harness/runtime/
      - id: metadata/package/testing/presence/fixture::test-filename-pattern

  - id: profile-json-identity-field
    desc: Serialized profile picture or subject field
    crit: component
    conf: 0.88
    if:
      type: text
      regex: 'JSON\.stringify\s*\([^)]{0,260}\b(picture|sub)\s*:'
    unless:
      - id: metadata/package/testing/harness/runtime/
      - id: metadata/package/testing/presence/fixture::test-filename-pattern

composite_rules:
  - id: profile-json-stringify
    desc: JSON body with email and profile identifier
    crit: component
    conf: 0.9
    near_bytes: 512
    all:
      - id: profile-json-email-field
      - id: profile-json-identity-field

  - id: extension-google-identity-harvest
    desc: Extension harvests Google profile identity
    crit: suspicious
    conf: 0.96
    near_bytes: 1200
    all:
      - id: metadata/permission/identity::identity-get-auth-token
      - id: google-userinfo-endpoint
      - id: micro-behaviors/communications/http/oauth::bearer-auth-header-template
      - id: profile-json-stringify
      - id: micro-behaviors/communications/http/request/client::js-fetch-call
