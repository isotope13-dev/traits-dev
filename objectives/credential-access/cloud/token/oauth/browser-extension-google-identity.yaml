defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]

traits:
  - id: google-userinfo-endpoint
    desc: Google OAuth userinfo endpoint
    crit: notable
    conf: 0.9
    if:
      type: text
      substr: https://www.googleapis.com/oauth2/v3/userinfo


composite_rules:
  - id: profile-json-stringify
    desc: JSON body with email and profile identifier
    crit: component
    conf: 0.9
    near_bytes: 512
    all:
      - id: micro-behaviors/data/serialize/schema-object::json-stringify-email-field
      - id: micro-behaviors/data/serialize/json::oauth-profile-identity-fields-in-json

  - id: extension-google-identity-harvest
    desc: Extension harvests Google profile identity
    crit: suspicious
    conf: 0.96
    near_bytes: 1200
    all:
      - id: "micro-behaviors/os/security/auth/session::browser-identity-auth-token-call"
      - id: google-userinfo-endpoint
      - id: micro-behaviors/communications/http/oauth::bearer-auth-header-template
      - id: profile-json-stringify
      - id: micro-behaviors/communications/http/request/client::js-fetch-call
