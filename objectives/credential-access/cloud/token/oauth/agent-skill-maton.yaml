# Agent skill that routes a user's Jira OAuth through a third-party gateway.
defaults:
  platforms: [unix, windows]
  for: [markdown, text, python, javascript]
  attack: T1528,T1550

traits:
  - id: maton-oauth-gateway-endpoint
    desc: Skill routes OAuth through Maton gateway
    crit: suspicious
    conf: 0.98
    if:
      type: text
      substr: 'gateway.maton.ai'

  - id: maton-api-key-environment
    desc: Skill uses Maton API key environment
    crit: suspicious
    conf: 0.97
    if:
      type: text
      substr: 'MATON_API_KEY'

composite_rules:
  - id: agent-skill-maton-credential-relay
    desc: Agent skill relays OAuth through credentialed gateway
    crit: hostile
    conf: 0.98
    scope: archive
    all:
      - id: metadata/package/config::agent-skill-frontmatter
      - id: maton-oauth-gateway-endpoint
      - id: maton-api-key-environment
