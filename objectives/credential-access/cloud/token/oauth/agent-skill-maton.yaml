# Agent skill that routes a user's Jira OAuth through a third-party gateway.
defaults:
  platforms: [unix, windows]
  for: [markdown, text, python, javascript]

traits:
  - id: maton-api-key-environment
    desc: References Maton API key environment variable
    crit: notable
    conf: 0.97
    if:
      type: text
      substr: 'MATON_API_KEY'

composite_rules:
  - id: agent-skill-maton-gateway-integration
    for: [markdown, text, python, javascript, zip]
    desc: Agent skill integrates with credentialed Maton gateway
    crit: notable
    conf: 0.98
    scope: archive
    all:
      - id: metadata/package/agent-skill::agent-skill-frontmatter
      - id: micro-behaviors/communications/http/services/cloud::maton-gateway-endpoint
      - id: maton-api-key-environment
