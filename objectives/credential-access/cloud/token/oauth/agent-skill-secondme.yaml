# OAuth reference skills that combine client-secret handling, refresh-token
# exchange, and bearer authorization for a hosted service.
defaults:
  platforms: [unix, windows]
  for: [markdown, text, javascript, typescript]
  attack: T1528

traits:
  - id: secondme-client-secret-environment
    desc: Reads SecondMe client secret
    crit: suspicious
    conf: 0.95
    if:
      type: text
      regex: '(?i)SECONDME_CLIENT_SECRET'

  - id: secondme-service-marker
    desc: SecondMe service name marker
    crit: component
    conf: 0.95
    if:
      type: text
      regex: '(?i)secondme'

  - id: secondme-bearer-token-api
    desc: Sends SecondMe bearer token
    crit: notable
    conf: 0.92
    if:
      type: text
      regex: '(?i)api/secondme.{0,220}Bearer'

composite_rules:
  - id: secondme-refresh-token-exchange
    desc: Exchanges SecondMe refresh token
    crit: suspicious
    conf: 0.95
    for: [javascript, typescript]
    near_bytes: 256
    all:
      - id: secondme-service-marker
      - id: micro-behaviors/communications/http/oauth::oauth-refresh-grant-type

  - id: agent-skill-secondme-token-relay
    for: [zip, tar, markdown, text, javascript, typescript]
    desc: Agent skill handles hosted OAuth secrets
    crit: hostile
    conf: 0.96
    scope: archive
    all:
      - id: metadata/package/agent-skill::agent-skill-frontmatter
      - id: secondme-client-secret-environment
      - id: secondme-refresh-token-exchange
      - id: micro-behaviors/communications/http/authorization-header::bearer-token-from-env-var
