defaults:
  platforms: [windows, unix]
  for: [javascript, typescript, chrome-manifest, crx, archives]
  attack: T1550

composite_rules:
  - id: extension-oauth-calendar-token-broker
    desc: Extension brokers calendar tokens
    crit: suspicious
    conf: 0.96
    attack: T1528
    ref: sha256:b1b67c99d61609933fd4b7cc7a7a9fa1cdd193cc290590b3d377ab282aae4488
    scope: archive
    all:
      - id: micro-behaviors/os/security/webextension::extension-identity-permission
      - id: metadata/permission/identity::google-calendar-oauth-scope
      - id: micro-behaviors/communications/http/oauth::supabase-google-oauth-flow
      - id: micro-behaviors/communications/http/oauth::oauth-provider-token-storage
    any:
      - id: micro-behaviors/communications/http/services/google::google-calendar-bearer-api
      - id: micro-behaviors/communications/http/oauth::supabase-auth-storage-bridge
