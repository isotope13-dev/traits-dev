# Live guessing and retaining a reusable token are separate observations.
# The record matcher binds the attempted user/password to the returned token.
defaults:
  platforms: [unix, windows]
  for: [python]
composite_rules:
  - id: password-spray-retains-refresh-token-records
    desc: OAuth spray records credentials and refresh tokens
    crit: hostile
    conf: 0.98
    attack: T1528,T1110.003
    near_lines: 65
    all:
      - id: objectives/lateral-movement/brute-force/password/web::microsoft-oauth-password-spray
      - id: micro-behaviors/communications/http/token-auth::python-appends-refresh-token-credential-record
