defaults:
  for: [pyc]
  platforms: [windows]
composite_rules:
  - id: browser-password-collector-extracts-facebook-token
    desc: Facebook browser token extraction in Telegram credential collector
    crit: hostile
    conf: 0.98
    attack: T1528
    all:
      - id: micro-behaviors/data/parse/credentials::facebook-window-access-token-assignment
      - id: objectives/credential-access/browser/chromium::pyc-browser-password-decrypt-telegram-upload
