# OAuth client secrets embedded in source, including charcode-array obfuscation
# used to hide third-party application credentials inside npm packages.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  attack: T1552,T1027

traits:
  - id: client-secret-constant-identifier
    desc: OAuth client secret constant identifier
    crit: notable
    conf: 0.92
    if:
      type: text
      regex: '\b[A-Z0-9_]*CLIENT_SECRET\b'

  - id: charcode-spread-array-decoder
    desc: Spread fromCharCode array decoder helper
    crit: notable
    conf: 0.9
    if:
      type: text
      substr: String.fromCharCode(...

composite_rules:
  - id: obfuscated-embedded-oauth-client-secret
    desc: Obfuscated embedded OAuth client secret
    crit: hostile
    conf: 0.97
    attack: T1528
    scope: file
    all:
      - id: client-secret-constant-identifier
      - id: charcode-spread-array-decoder
      - id: micro-behaviors/communications/http/oauth::oauth-client-secret-field
      - id: micro-behaviors/data/encode/char-code::fromcharcode-call
    unless:
      - id: metadata/package/testing/harness/runtime::test-basename-suffix
      - id: metadata/package/testing/harness/runtime::test-basename-prefix
