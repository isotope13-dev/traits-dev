# ThreatMon reports an XXE-to-instance-metadata credential pivot. The report
# does not publish the request bytes or identify the cloud provider. These
# rules cover an EC2-compatible credential path in the SYSTEM
# identifier itself, not a loose combination of XML and a nearby metadata URL.
# The host and entity names are not required. A custom host or proxy can
# expose the same credential API path. Role suffixes are irrelevant.
# Resolution still depends on
# the receiving XML parser; a declaration does not prove credential retrieval.
defaults:
  platforms: [unix, windows]
  crit: suspicious
  conf: 0.97
  attack: T1190,T1552.005

traits:
  - id: xxe-imds-credential-source
    desc: XML entity targets metadata IAM credential path
    for: [scripts, source]
    if:
      type: literal
      exclude_docstrings: true
      regex: '<!ENTITY[^>"'']{1,80}SYSTEM\s+["''][^"''<>]{1,120}/meta-data/iam/security-credentials[/"'']'

  - id: xxe-imds-credential-document
    desc: XML entity targets metadata IAM credential path
    for: [xml, html]
    if:
      type: text
      exclude_html_comments: true
      regex: '<!ENTITY[^>"'']{1,80}SYSTEM\s+["''][^"''<>]{1,120}/meta-data/iam/security-credentials[/"'']'

  - id: cloud-imds-token-endpoint-path
    desc: Azure or GCP IMDS token endpoint path
    crit: notable
    conf: 0.94
    for: [scripts, source, binaries, xml, html]
    if:
      type: text
      exclude_html_comments: true
      regex: '(/metadata/identity/oauth2/token|/computeMetadata/v1/instance/service-accounts/)'

composite_rules:
  - id: cloud-imds-credential-endpoint-any
    desc: Cloud instance metadata credential endpoint reference
    crit: component
    conf: 0.94
    for: [scripts, source, binaries, xml, html]
    any:
      - id: micro-behaviors/communications/http/services/aws::ec2-imds-iam-credentials-endpoint
      - id: micro-behaviors/communications/http/services/aws::iam-credentials-path-reference
      - id: micro-behaviors/communications/ip/ipv4::metadata-service-link-local-address
      - id: cloud-imds-token-endpoint-path

  - id: xxe-cloud-imds-credential-harvest
    desc: Constructs XML external entity targeting cloud IMDS and submits over HTTP
    crit: hostile
    conf: 0.98
    for: [scripts, source, binaries]
    all:
      - id: micro-behaviors/data/format/xml::doctype-internal-subset
      - id: micro-behaviors/data/format/xml::external-entity-system-declaration
      - id: cloud-imds-credential-endpoint-any
    any:
      - id: micro-behaviors/communications/http/post
      - id: micro-behaviors/communications/http/client
      - id: micro-behaviors/communications/http/lib
    unless:
      - id: metadata/package/documentation/source::javascript-exported-documentation-records
      - id: metadata/lang/source/declaration::go-constant-only-file
      - id: metadata/package/documentation/security-exercise::scoped-security-test-documentation
      - id: metadata/package/documentation/security-testing::defensive-review-documentation
      - id: objectives/execution/exploit/xxe::xxe-example-in-skill-catalog
      - id: metadata/file/extension/identity::markdown-file-basename
    near_bytes: 16384
