# Require forwarding-object scheme disparity, cloud target and token protocol
# evidence together. Ordinary SDK IMDS requests have no independent DNS base
# host. Proxy route, application, role name and source language stay unbound.
defaults:
  platforms: [unix, windows]
  for: [scripts, source, text, data, json]
  attack: T1190,T1552.005

composite_rules:
  - id: scheme-case-proxy-imdsv2-token-acquisition
    desc: Scheme-case proxy bypass requests IMDSv2 token
    crit: hostile
    conf: 0.99
    all:
      - id: objectives/execution/exploit/parser-confusion::uppercase-scheme-metadata-base-override
      - id: micro-behaviors/communications/http/services/aws::aws-imds-v2-token-endpoint
      - id: micro-behaviors/communications/http/header/custom::aws-imds-token-ttl-header
    near_lines: 12

  - id: scheme-case-proxy-instance-role-credential-access
    desc: Scheme-case proxy requests role credentials
    crit: hostile
    conf: 0.99
    all:
      - id: objectives/execution/exploit/parser-confusion::uppercase-scheme-metadata-base-override
      - id: micro-behaviors/communications/http/services/aws::ec2-imds-iam-credentials-endpoint
    near_lines: 12
