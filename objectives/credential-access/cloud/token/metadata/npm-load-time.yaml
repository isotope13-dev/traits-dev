# Load-time AWS IMDS token and role reconnaissance from an npm package entry
# module. The entry requests an IMDSv2 session token and then lists the
# instance role via the IAM security-credentials path, all through calls that
# run the moment the module loads -- no install hook required. Naming both
# the token endpoint and the credential-listing path in one load-time module
# is the credential-access half of cloud recon: the token half authenticates
# to IMDS, the path half enumerates whose credentials to take next.
#
# Stopping one request short of the credentials (role name only, token length
# only) does not make this benign: the probe already proves IMDS reachability
# and exfiltrates the recon result through whatever channel the package owns,
# and nothing technical prevents the next request. Genuine SDK provider
# modules are excluded through their recognized provider context; ordinary
# documentation that merely names the path lacks the load-time call leg.
defaults:
  platforms: [unix, windows]
  for: [npm, tar, package.json, javascript, typescript]
  attack: T1552.005,T1195.002
  mbc: E1552
  conf: 0.97

composite_rules:
  - id: npm-load-time-imds-token-role-recon
    desc: npm load-time IMDS token and role recon
    crit: hostile
    scope: archive
    all:
      - id: micro-behaviors/data/control-flow/module-exec::module-level-imported-method-call
      - id: micro-behaviors/communications/http/services/aws::aws-imds-v2-token-path
      - id: micro-behaviors/communications/http/services/aws::iam-credentials-path-reference
    unless:
      - id: metadata/package/testing/presence/harness/
      - id: metadata/file/naming::test-directory-component
      - id: well-known/lib/cloud/aws-sdk-js::aws-sdk-js-v3-imds-provider
      - id: well-known/lib/data/mongodb/
