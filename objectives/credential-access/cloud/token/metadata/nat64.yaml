# Cloud-role credential access through an RFC 8215 /48 parser differential.
# The URL atom deliberately joins the NAT64 prefix and IAM path in one literal;
# ordinary cloud SDKs name the relative path but do not construct this target.
defaults:
  platforms: [windows, unix]
  for: [scripts, source, data, text]
  attack: T1190,T1552.005
  conf: 0.995

traits:
  - id: rfc8215-nat64-iam-credential-url
    desc: NAT64 URL targets AWS role credentials
    crit: suspicious
    if:
      type: literal
      regex: '(?i)^https?://\[64:ff9b:0*1:[^]]+\]/latest/meta-data/iam/security-credentials'

composite_rules:
  - id: rfc8215-nat64-iam-credential-ssrf
    desc: NAT64 parser differential requests AWS role credentials
    crit: hostile
    all:
      - id: objectives/execution/exploit/parser-confusion::rfc8215-nat64-private-decoy-ssrf
      - id: rfc8215-nat64-iam-credential-url
