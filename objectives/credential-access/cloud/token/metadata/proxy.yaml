# Application-level pass-through routes can be repointed at a link-local cloud
# metadata service. Header-prefix stripping is especially dangerous because it
# lets a remote caller complete IMDSv2's token exchange through the proxy.
defaults:
  platforms: [unix, windows]
  for: [text, data, scripts, source]
  attack: T1190,T1552.005

traits:
  - id: pass-through-target-to-aws-imds
    desc: Pass-through target points to AWS IMDS
    crit: suspicious
    conf: 0.98
    if:
      type: text
      regex: '(?i)["'']target["'']\s*:\s*["'']https?://169\.254\.169\.254/'
    unless:
      - id: well-known/tool/detection/

  - id: prefixed-forwarded-imdsv2-token-header
    desc: Prefixed forwarding header carries IMDSv2 token
    crit: suspicious
    conf: 0.99
    if:
      type: text
      regex: '(?im)^x-pass-x-aws-ec2-metadata-token(-ttl-seconds)?\s*:'
    unless:
      - id: well-known/tool/detection/

composite_rules:
  - id: gateway-pass-through-aws-role-credential-access
    desc: Gateway pass-through accesses AWS role credentials
    crit: hostile
    conf: 0.995
    all:
      - id: micro-behaviors/communications/http/request/route::pass-through-registration-post-request
      - id: pass-through-target-to-aws-imds
      - id: micro-behaviors/communications/http/services/aws::iam-credentials-path-reference
    near_lines: 20

  - id: gateway-forwarded-imdsv2-credential-request
    desc: Gateway forwards IMDSv2 token for credential request
    crit: hostile
    conf: 0.995
    all:
      - id: micro-behaviors/communications/http/request/route::pass-through-registration-post-request
      - id: prefixed-forwarded-imdsv2-token-header
      - id: micro-behaviors/communications/http/services/aws::iam-credentials-path-reference
    near_lines: 20
