defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  attack: T1552.005,T1041
  mbc: E1552

composite_rules:
  - id: js-gcp-metadata-token-external-exfil
    desc: GCP token request clues beside external transfer clues
    crit: hostile
    conf: 0.98
    scope: file
    # Keep the request and transfer clues together. Reference panels contain
    # metadata examples and unrelated external endpoints many pages apart.
    near_bytes: 1024
    all:
      - id: micro-behaviors/communications/http/services/gcp::gcp-service-account-token-path
      - id: micro-behaviors/communications/http/services/gcp::gcp-metadata-flavor-header
    any:
      - id: micro-behaviors/communications/ip/literal::external-ipv4-http-url
      - id: micro-behaviors/communications/http/request/query::node-base64-json-chunked-query-beacon
      - id: micro-behaviors/os/env/read/process::js-cross-proc-environ-reference
