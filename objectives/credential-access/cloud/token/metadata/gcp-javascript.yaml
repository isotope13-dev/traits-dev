defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  attack: T1552.005,T1041
  mbc: E1552

composite_rules:
  - id: js-gcp-metadata-token-external-exfil
    desc: Queries GCP service-account token and exfiltrates to external target
    crit: hostile
    conf: 0.98
    scope: file
    all:
      - id: micro-behaviors/communications/http/services/gcp::gcp-service-account-token-path
      - id: micro-behaviors/communications/http/services/gcp::gcp-metadata-flavor-header
      - id: micro-behaviors/communications/ip/literal::external-ipv4-http-url
