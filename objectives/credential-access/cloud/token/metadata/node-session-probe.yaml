defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  crit: suspicious
  attack: T1552.005

composite_rules:
  - id: startup-alibaba-session-role-probe
    desc: Startup authenticates to Alibaba role metadata
    conf: 0.98
    all:
      - id: micro-behaviors/data/control-flow/module-exec::startup-awaits-configured-helper
      - id: micro-behaviors/communications/http/services/alibaba::alibaba-imds-token-endpoint
      - id: micro-behaviors/communications/http/services/alibaba::alibaba-imds-session-header
      - id: micro-behaviors/communications/http/services/alibaba::alibaba-imds-session-ttl-header
      - id: micro-behaviors/communications/http/services/alibaba::alibaba-imds-ram-role-list
      - id: micro-behaviors/communications/http/request/client::http-client-usage

  - id: encoded-metadata-session-body-file
    desc: Startup collects encoded-target metadata session response
    conf: 0.98
    all:
      - id: objectives/anti-static/obfuscation/encoding/base64::encoded-imds-request-with-numeric-paths
      - id: micro-behaviors/data/control-flow/module-exec::startup-awaits-configured-helper
      - id: micro-behaviors/fs/write/file/response-body::request-result-body-collector-file

