# Cloud SDKs normally reach instance metadata through an HTTP client. Directly
# framing the credential request on a socket is an unusual footprint-reduction
# technique that also survives implementation changes across source languages.
defaults:
  platforms: [unix, windows]
  for: [scripts, source]
  attack: T1552.005

composite_rules:
  - id: instance-credentials-over-direct-socket
    desc: Requests cloud instance credentials through a direct socket
    crit: suspicious
    conf: 0.96
    all:
      - id: cloud-credential-endpoint-reference
    any:
      # Bash exposes a TCP connection as a redirected file descriptor and can
      # construct the request line dynamically, leaving no literal GET line.
      - id: micro-behaviors/communications/socket/connect::dev-tcp-fd-redirect
      # Other languages retain a socket connect plus a literal raw request.
      - id: micro-behaviors/communications/http/request/client::direct-socket-http-request-script
      - id: micro-behaviors/communications/http/request/client::direct-socket-http-request-source
