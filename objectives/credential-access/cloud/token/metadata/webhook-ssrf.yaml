# Webhook delivery redirected to cloud instance metadata. This models the
# reusable technique: an attacker-controlled callback emits a redirect to a
# link-local credential endpoint, and a vulnerable webhook tester reflects
# the fetched response body.
defaults:
  platforms: [unix, windows]
  for: [scripts, source, text]
  attack: T1190,T1552.005
  mbc: E1190

traits:
  - id: return-redirect-to-aws-imds
    desc: Return redirect targets AWS metadata
    crit: suspicious
    conf: 0.98
    if:
      type: text
      regex: '(?i)\breturn\s+30[278]\s+["'']?https?://169\.254\.169\.254/'

  - id: redirect-call-to-aws-imds
    desc: Redirect call targets AWS metadata
    crit: suspicious
    conf: 0.98
    for: [javascript, python]
    unless:
      - id: micro-behaviors/communications/http/url/tld::reserved-documentation-tld-url
    if:
      type: symbol
      kind: call
      regex: '(?i)(^|\.)redirect$'
      arg:
        kind: string
        substr: 'http://169.254.169.254/'

  - id: location-header-text-to-aws-imds
    desc: Location header targets AWS metadata
    crit: suspicious
    conf: 0.98
    if:
      type: text
      regex: '(?i)\bLocation\s*:\s*https?://169\.254\.169\.254/'

composite_rules:
  - id: python-location-header-to-aws-imds
    desc: Python Location response targets AWS instance metadata
    crit: suspicious
    conf: 0.97
    for: [python]
    all:
      - id: micro-behaviors/communications/http/response::python-location-header-call
      - id: metadata/file/string/cloud::cloud-instance-metadata-link-local-host
    near_lines: 30

  - id: mlflow-webhook-test-full-read-ssrf
    desc: MLflow webhook test reads AWS instance-role credentials via SSRF
    crit: hostile
    conf: 0.99
    unless:
      - id: micro-behaviors/communications/http/url/tld::reserved-documentation-tld-url
    all:
      - id: well-known/app/ai/mlflow::webhook-test-route
      - id: micro-behaviors/communications/http/request/client::http-response
      - id: aws-imds-credential-endpoint-redirect
