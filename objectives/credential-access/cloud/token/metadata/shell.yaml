defaults:
  platforms: [unix, windows]
  for: [shell, github-actions]
  attack: T1552.005

composite_rules:
  - id: shell-multi-cloud-metadata-credential-sweep
    desc: Shell sweeps multiple cloud metadata credential endpoints
    crit: hostile
    conf: 0.98
    needs: 2
    any:
      - id: micro-behaviors/communications/http/services/cloud::curl-aws-metadata-query
      - id: micro-behaviors/communications/http/services/gcp::gcp-service-account-token-path
      - id: micro-behaviors/communications/http/services/azure::azure-managed-identity-token-path
    unless:
      - id: well-known/tool/
      - id: well-known/lib/
      - id: well-known/app/
