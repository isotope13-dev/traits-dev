defaults:
  platforms:
  - unix
  - windows
  for:
  - shell
  - github-actions
  attack: T1552.005
  crit: hostile
composite_rules:
- id: shell-aws-imdsv2-role-credential-harvest
  desc: Shell harvests AWS instance-role credentials via IMDSv2
  conf: 0.97
  for:
  - shell
  all:
  - id: micro-behaviors/communications/http/services/aws::aws-imds-v2-token-endpoint
  - id: micro-behaviors/communications/http/header/security::aws-imds-token-ttl-header
  - id: micro-behaviors/communications/http/services/aws::ec2-imds-iam-credentials-endpoint
  unless:
  - id: well-known/tool
  - id: well-known/lib
  - id: well-known/app
- id: shell-multi-cloud-metadata-credential-sweep
  desc: Shell sweeps multiple cloud metadata credential endpoints
  conf: 0.98
  needs: 2
  any:
  - id: micro-behaviors/communications/http/services/cloud::curl-aws-metadata-query
  - id: micro-behaviors/communications/http/services/gcp::gcp-service-account-token-path
  - id: micro-behaviors/communications/http/services/azure::azure-managed-identity-token-path
  unless:
  - id: well-known/tool
  - id: well-known/lib
  - id: well-known/app
