defaults:
  platforms: [unix]
  for: [rust]
  attack: T1552

composite_rules:
  - id: rust-cloud-credential-sweep
    desc: Rust cloud credential sweep
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/os/security/auth/cloud::rust-cloud-metadata-endpoint-reference
    any:
      - id: micro-behaviors/os/env/cloud::cloud-secret-environment-name-set
      - id: micro-behaviors/fs/path/credential::cloud-config-path-set
    unless:
      - id: well-known/lib/format/deb-package::gdal-shared-library
      - id: well-known/app/storage/pgbackrest::pgbackrest-backup-tool
      - id: well-known/app/data/datui/
      - id: well-known/app/data/vector/
      - id: well-known/tool/packaging/uv/
      - id: well-known/tool/sysadmin/alpine-packages/binary::alpine-redpanda-binary
      - id: well-known/tool/development/agent/openai-codex/
      - id: well-known/app/ai/coding-agent/

  # The Rust language label on source files is direct. For ELF binaries, also
  # require the compiler signature: common provider endpoint strings otherwise
  # receive a false Rust attribution in native cloud/database libraries.
  - id: rust-elf-aws-env-credential-sweep
    desc: Rust ELF cloud credential sweep
    crit: hostile
    conf: 0.98
    for: [elf]
    all:
      - id: metadata/lang/compiler/systems::rust-binary
      - id: micro-behaviors/communications/http/services/aws::iam-credentials-path-reference
      - id: micro-behaviors/os/env/cloud::cloud-secret-environment-name-set
    unless:
      - id: well-known/lib/format/deb-package::gdal-shared-library
      - id: well-known/app/storage/pgbackrest::pgbackrest-backup-tool
      - id: well-known/app/data/datui/
      - id: well-known/app/data/vector/
      - id: well-known/tool/packaging/uv/
      - id: well-known/tool/sysadmin/alpine-packages/binary::alpine-redpanda-binary
      - id: well-known/tool/development/agent/openai-codex/
      - id: well-known/app/ai/coding-agent/

  - id: rust-elf-aws-config-credential-sweep
    desc: Rust ELF cloud credential sweep
    crit: hostile
    conf: 0.98
    for: [elf]
    all:
      - id: metadata/lang/compiler/systems::rust-binary
      - id: micro-behaviors/communications/http/services/aws::iam-credentials-path-reference
      - id: micro-behaviors/fs/path/credential::cloud-config-path-set
    unless:
      - id: well-known/lib/format/deb-package::gdal-shared-library
      - id: well-known/app/storage/pgbackrest::pgbackrest-backup-tool
      - id: well-known/app/data/datui/
      - id: well-known/app/data/vector/
      - id: well-known/tool/packaging/uv/
      - id: well-known/tool/sysadmin/alpine-packages/binary::alpine-redpanda-binary
      - id: well-known/tool/development/agent/openai-codex/
      - id: well-known/app/ai/coding-agent/

  - id: rust-elf-gcp-env-credential-sweep
    desc: Rust ELF cloud credential sweep
    crit: hostile
    conf: 0.98
    for: [elf]
    all:
      - id: metadata/lang/compiler/systems::rust-binary
      - id: micro-behaviors/communications/http/services/gcp::gcp-service-accounts-metadata-path
      - id: micro-behaviors/os/env/cloud::cloud-secret-environment-name-set
    unless:
      - id: well-known/lib/format/deb-package::gdal-shared-library
      - id: well-known/app/storage/pgbackrest::pgbackrest-backup-tool
      - id: well-known/app/data/datui/
      - id: well-known/app/data/vector/
      - id: well-known/tool/packaging/uv/
      - id: well-known/tool/sysadmin/alpine-packages/binary::alpine-redpanda-binary
      - id: well-known/tool/development/agent/openai-codex/
      - id: well-known/app/ai/coding-agent/

  - id: rust-elf-gcp-config-credential-sweep
    desc: Rust ELF cloud credential sweep
    crit: hostile
    conf: 0.98
    for: [elf]
    all:
      - id: metadata/lang/compiler/systems::rust-binary
      - id: micro-behaviors/communications/http/services/gcp::gcp-service-accounts-metadata-path
      - id: micro-behaviors/fs/path/credential::cloud-config-path-set
    unless:
      - id: well-known/lib/format/deb-package::gdal-shared-library
      - id: well-known/app/storage/pgbackrest::pgbackrest-backup-tool
      - id: well-known/app/data/datui/
      - id: well-known/app/data/vector/
      - id: well-known/tool/packaging/uv/
      - id: well-known/tool/sysadmin/alpine-packages/binary::alpine-redpanda-binary
      - id: well-known/tool/development/agent/openai-codex/
      - id: well-known/app/ai/coding-agent/
