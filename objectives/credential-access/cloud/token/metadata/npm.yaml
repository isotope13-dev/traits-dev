defaults:
  platforms: [unix, windows]
  for: [package.json]
  attack: T1552.005

composite_rules:
  - id: npm-postinstall-aws-imds-credential-access
    desc: npm postinstall accesses AWS IAM metadata
    crit: hostile
    conf: 0.99
    attack: "T1552.005,T1195.002"
    all:
      - id: objectives/supply-chain/install-hook/package/manifest::postinstall-hook-key
      - id: objectives/supply-chain/recon-exfil/install-hook::postinstall-aws-iam-metadata-script
      - id: micro-behaviors/communications/http/post::npm-script-node-http-post
