defaults:
  platforms: [unix, windows]
  for: [package.json]
  attack: T1552.005

composite_rules:
  - id: npm-postinstall-aws-imds-credential-access
    desc: npm postinstall accesses AWS IAM metadata
    crit: hostile
    conf: 0.99
    attack: "T1552.005,T1195.002"
    all:
      - id: objectives/supply-chain/install-hook/package/manifest::postinstall-hook-key
      - id: objectives/supply-chain/recon-exfil/install-hook::postinstall-aws-iam-metadata-script
      - id: micro-behaviors/communications/http/post::npm-script-node-http-post

  - id: npm-lifecycle-aws-ecs-credential-access
    desc: npm lifecycle hook accesses AWS ECS task credentials
    crit: hostile
    conf: 0.995
    attack: T1552.005,T1195.002
    all:
      - id: metadata/package/scripts/lifecycle::install-hooks
      - id: objectives/supply-chain/recon-exfil/install-hook::npm-lifecycle-aws-ecs-credential-query
    unless:
      - id: metadata/package/testing/harness/runtime/
      - id: metadata/package/testing/presence/fixture/
