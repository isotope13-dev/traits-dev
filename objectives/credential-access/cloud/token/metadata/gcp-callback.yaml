defaults:
  platforms: [unix, windows]
  for: [python]
  attack: T1552.005,T1041
  mbc: E1552

composite_rules:
  - id: python-gcp-metadata-token-oob-exfil-payload
    desc: Harvests GCP service-account token with HTTP and DNS callback exfiltration
    crit: hostile
    conf: 0.99
    scope: file
    all:
      - id: objectives/exfiltration/dns/tunnel::python-gcp-token-dns-callback-source
      - id: objectives/exfiltration/stealer/credential/value/token::python-serviceaccount-token-exfil-post
