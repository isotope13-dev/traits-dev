defaults:
  platforms: [unix, windows]
  for: [python]
  attack: T1552.005,T1041
  mbc: E1552

composite_rules:
  - id: python-install-hook-gcp-metadata-token-ngrok-exfil
    desc: Install hook forwards GCP service-account token to an ngrok collector
    crit: hostile
    conf: 0.99
    attack: T1552.005,T1041,T1195.002
    scope: file
    all:
      - id: metadata/package/files/included::setup-py-basename
      - id: metadata/build/package/recipe/setup-hooks::setup-cmdclass-install
      - id: micro-behaviors/communications/http/services/gcp::gcp-named-service-account-token-path
      - id: micro-behaviors/communications/http/services/gcp::gcp-metadata-flavor-header
      - id: micro-behaviors/communications/http/lib/urllib::urllib-request-object-call
      - id: micro-behaviors/communications/url/host/name::ngrok-free-domain

  - id: python-install-hook-gcp-token-webhook-exfil
    desc: Install hook sends GCP token to webhook
    crit: hostile
    conf: 0.99
    attack: T1552.005,T1041,T1195.002
    scope: file
    all:
      - id: metadata/build/package/recipe/setup-hooks::setup-cmdclass-install
      - id: micro-behaviors/communications/http/services/gcp::gcp-named-service-account-token-path
      - id: micro-behaviors/communications/http/services/gcp::gcp-metadata-flavor-header
      - id: micro-behaviors/communications/http/webhook::curl-post-webhook-command

  - id: python-gcp-metadata-token-oob-exfil-payload
    desc: Harvests GCP service-account token with HTTP and DNS callback exfiltration
    crit: hostile
    conf: 0.99
    scope: file
    all:
      - id: objectives/exfiltration/dns/tunnel::python-gcp-token-dns-callback-source
      - id: objectives/exfiltration/stealer/credential/value/token::python-serviceaccount-token-exfil-post
