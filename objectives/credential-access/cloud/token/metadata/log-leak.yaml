# Cloud metadata credential responses written to error logs on parse failure.
#
# CAN-2026-2039459 (regression of CVE-2020-8563): auth-provider-gcp logged
# the raw GCE metadata token response via klog.Errorf when JSON parsing of
# the token blob failed, exposing the node's OAuth access token to anyone
# able to read kubelet logs. The same binary deliberately omits credentials
# from errors elsewhere, so interpolating the raw response into an error
# is the defect, not ordinary error handling.
#
# The reusable technique, not the one call site: fetch a cloud credential
# response, fail to parse it, and interpolate the raw response body into an
# error call. Variants reuse it with other formatters (log/slog, Python
# logging) and other clouds. Atoms key on API names (Errorf,
# json.Unmarshal/json.loads) plus a credential/response variable as the
# formatted/parsed argument — never on the log message prose. Hostile
# verdicts require the cloud endpoint or the parse-plus-log pair nearby.
defaults:
  platforms: [unix, windows]
  attack: T1552.005
  mbc: E1552

composite_rules:
  - id: gcp-metadata-token-error-log-leak
    desc: GCP metadata token response written to error log
    crit: hostile
    conf: 0.98
    for: [go]
    near_lines: 60
    all:
      - id: micro-behaviors/os/telemetry/logging/event::go-error-log-credential-argument
      - id: micro-behaviors/communications/http/services/gcp::gcp-metadata-endpoint-go-source

  - id: go-token-parse-failure-log-leak
    desc: Go logs raw token parse input on JSON failure
    crit: hostile
    conf: 0.97
    for: [go]
    near_lines: 20
    all:
      - id: micro-behaviors/os/telemetry/logging/event::go-error-log-credential-argument
      - id: micro-behaviors/data/serialize/json::go-credential-json-unmarshal

  # Suspicious, not hostile: interpolating the raw token response into an
  # error call exposes the credential to log readers (CAN-2026-2039459 class
  # defect), but the code's purpose remains legitimate credential handling
  # with no exfiltration — an attack pattern this is not.
  - id: python-token-parse-failure-log-leak
    desc: Python logs raw token response on JSON failure
    crit: suspicious
    conf: 0.97
    for: [python]
    near_lines: 20
    all:
      - id: micro-behaviors/os/telemetry/logging/event::python-credential-error-log
      - id: micro-behaviors/data/serialize/json::python-credential-json-parse
