defaults:
  for: [scripts, source]
  platforms: [unix, windows]
  attack: T1190,T1552.005
traits:
  - id: nextjs-image-imds-url
    desc: Image optimizer URL targets cloud metadata
    crit: suspicious
    conf: 0.99
    if:
      type: literal
      exclude_docstrings: true
      regex: '(?i)/_next/image\?url=https?(://|%3a%2f%2f)169\.254\.169\.254(/|%2f)latest(/|%2f)'

composite_rules:
  - id: nextjs-image-role-credential-ssrf
    desc: Image optimizer SSRF seeks IAM credentials
    crit: hostile
    conf: 0.99
    near_lines: 12
    all:
      - id: nextjs-image-imds-url
      - id: micro-behaviors/communications/http/services/aws::iam-credentials-path-reference
