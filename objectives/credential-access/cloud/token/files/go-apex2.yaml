# Apex2's recon package reads the local shared AWS credentials file and places
# the result in the encrypted host-recon report sent by the bot.
defaults:
  platforms: [linux]
  for: [elf]
  attack: T1552.001,T1041

traits:
  - id: apex2-recon-aws-reader
    desc: Apex2 recon AWS credential reader function
    crit: notable
    conf: 0.97
    if:
      type: symbol
      kind: function
      regex: 'apex2_internal_recon\.AWS$'

  - id: apex2-recon-collector
    desc: Apex2 host reconnaissance collector function
    crit: component
    conf: 0.97
    if:
      type: symbol
      kind: function
      regex: 'apex2_internal_recon\.Collect$'

  - id: aws-config-directory-token
    desc: AWS config directory path token
    crit: component
    conf: 0.95
    if:
      type: text
      exact: .aws

  - id: aws-credentials-file-token
    desc: AWS credentials filename token
    crit: component
    conf: 0.95
    if:
      type: text
      exact: credentials

composite_rules:
  - id: apex2-aws-credentials-in-encrypted-recon
    desc: Apex2 sends local AWS credentials in encrypted reconnaissance
    crit: hostile
    conf: 0.99
    all:
      - id: apex2-recon-aws-reader
      - id: apex2-recon-collector
      - id: aws-config-directory-token
      - id: aws-credentials-file-token
      - id: objectives/command-and-control/botnet/polling::go-apex2-remote-attack-recon-c2
