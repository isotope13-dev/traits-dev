defaults:
  platforms:
  - unix
  - windows
  for: [scripts, binaries]
  attack: T1552.001
  crit: suspicious
traits:
- id: aws-config-dup
  desc: AWS credential directory reference
  crit: notable
  conf: 0.75
  for:
  - shell
  - python
  - ruby
  - perl
  - javascript
  - typescript
  if:
    type: string_literal
    exact: .aws
  unless:
  # Was `well-known/lib/data/`, now dissolved into well-known/ and the
  # package-file facts. A bundled cloud SDK carries its own config-path literals.
  - id: well-known/lib/cloud/
  - id: well-known/tool/detection/security-scanner/
  - id: well-known/tool/detection/proxy-sandbox
  - id: well-known/app/storage/akm::akm-stash-safety-sensitive-dirs
  - id: objectives/credential-access/theft/keywords::kiro-auth-token-filename
  # Amazon Q Developer (AI coding assistant) keeps its MCP server config under
  # ~/.aws/amazonq/mcp.json — an agent-config path, not AWS credential access.
  - id: micro-behaviors/fs/path/agent-config/mcp::amazonq-mcp-json-path
- id: aws-access-key
  desc: AWS access key ID pattern
  conf: 0.85
  if:
    type: text
    # Require an AWS-specific field name so MinIO, Ceph, and other S3-compatible
    # test credentials named e.g. MINIO_ACCESS_KEY are not called AWS keys.
    regex: '(?i)\baws[_-]access[_-]key([_-]id)?\b\s*[:=]\s*["'']?AKIA[0-9A-Z]{16}'
  unless:
  - type: text
    substr: AKIAIOSFODNN7EXAMPLE
  - type: text
    regex: AKIA[0-9A-Z]{12}EXAMPLE
  - type: text
    substr: AKIAI6X4TYCIXM2B7MUQ
  - id: metadata/package/testing/
  - id: well-known/tool/development/toolchain/go-toolchain::go-module-source-path
  - id: well-known/tool/detection/redaction::sensitive-data-scanner
  # Secret scanners intentionally carry credential regexes as data; a
  # catalog entry is not a credential present in the scanned artifact.
  - id: well-known/tool/detection/mcp-fence::context
  # Loom deliberately embeds a fake AWS-shaped honeytoken to detect whether an
  # agent reads or exfiltrates canary data.  It is test input, not a credential.
  - id: well-known/tool/detection/llm-scanner::loom-canary-context
  # ELF core dumps capture the crashed process environ (HOME=, SHLVL=,
  # AWS_ACCESS_KEY_ID=, …). A key string there is incidental memory, not a
  # credential the package is harvesting or shipping for use.
  - type: value
    path: elf.type
    exact: core
- id: github-classic-pat
  desc: GitHub classic personal access token literal
  crit: notable
  conf: 0.88
  for: [python, javascript, typescript, powershell]
  unless:
  - id: well-known/tool/detection/sast::python-secret-rule-catalog
  - id: objectives/credential-access/api-harvest/catalog::redaction-credentials-marker
  - id: metadata/package/testing/
  # UI/documentation placeholders commonly use a run of x characters; they
  # are not GitHub credentials and should not satisfy the token detector.
  - type: string_literal
    regex: 'ghp_x{8,}'
  # So is a straight run of the alphabet (ghp_0123456789abcdefghij...), the
  # shape a fixture uses when it needs something token-shaped to redact.
  - type: string_literal
    regex: 'ghp_0123456789abcdef'
  if:
    type: string_literal
    regex: 'ghp_[A-Za-z0-9]{36}'
- id: azure-config
  desc: Azure CLI token cache path
  # A path in a remote-exposure scanner is not local token access. Keep the
  # path observable, but reserve suspicious severity for an actual read/use.
  crit: notable
  conf: 0.85
  for:
  - shell
  - python
  - ruby
  - perl
  - javascript
  - typescript
  if:
    type: string_literal
    regex: '/\.azure/(accessTokens\.json|msal_token_cache(\.json)?)\b'
  unless:
  - id: well-known/app/infrastructure/skypilot::skypilot-source-file
  - id: well-known/tool/detection/vtk/
- id: dotenv-request
  desc: HTTP request for .env file
  conf: 0.85
  if:
    type: text
    substr: GET /.env
  unless:
  - id: well-known/app/utility/cmdchamp/
  - id: well-known/tool/detection/malcontent::malcontent-defensive-scanner-context
# Notable, not suspicious. One provider's metadata endpoint in a JVM class
# is what that provider's own SDK is for: msal4j's IMDSManagedIdentitySource
# and azure-identity's IdentityClient carry the Azure IMDS path, and
# aws-java-sdk's EC2MetadataUtils/EC2MetadataClient carry the AWS one. That
# is exactly the benign case `jvm-cloud-metadata-token-harvest` below was
# built to separate out -- it stays hostile and still requires *two*
# providers inside a single class, which no single-cloud SDK has.
- id: jvm-aws-iam-credential-path
  desc: JVM AWS IAM credential path
  crit: notable
  conf: 0.9
  attack: T1552.005
  for: [class]
  if:
    type: hex
    pattern: 69 61 6D 2F 73 65 63 75 72 69 74 79 2D 63 72 65 64 65 6E 74 69 61 6C 73
  unless:
  - id: metadata/package/files/system-package::container-image-tar-name
  - type: basename
    regex: '\.(?:asar|7z)$'
  # The MongoDB Java driver's MONGODB-AWS mechanism reads EC2/ECS instance
  # credentials from this path by design (BuiltInAwsCredentialSupplier).
  - id: well-known/lib/data/mongodb::mongodb-java-internal-auth-http-helper
  - id: well-known/lib/data/snowflake-jdbc::jdbc-driver-context
# Notable, not suspicious. One provider's metadata endpoint in a JVM class
# is what that provider's own SDK is for: msal4j's IMDSManagedIdentitySource
# and azure-identity's IdentityClient carry the Azure IMDS path, and
# aws-java-sdk's EC2MetadataUtils/EC2MetadataClient carry the AWS one. That
# is exactly the benign case `jvm-cloud-metadata-token-harvest` below was
# built to separate out -- it stays hostile and still requires *two*
# providers inside a single class, which no single-cloud SDK has.
- id: jvm-gcp-metadata-host
  desc: JVM GCP metadata host
  crit: notable
  conf: 0.9
  attack: T1552.005
  for: [class]
  if:
    type: hex
    pattern: 6D 65 74 61 64 61 74 61 2E 67 6F 6F 67 6C 65 2E 69 6E 74 65 72 6E 61 6C
  unless:
  - id: metadata/package/files/system-package::container-image-tar-name
  - type: basename
    regex: '\.(?:asar|7z)$'
  - id: well-known/app/data/opensearch::gce-plugin-context
  - id: well-known/app/data/opensearch::gce-metadata-service-class
  - id: well-known/app/data/opensearch::gce-plugin-path
  # The MongoDB Java driver's MONGODB-OIDC GCP mechanism reads the GCE
  # service-account token from this host by design (GcpCredentialHelper).
  - id: well-known/lib/data/mongodb::mongodb-java-internal-auth-http-helper
  - id: well-known/lib/data/snowflake-jdbc::jdbc-driver-context
  # OpenTelemetry Java's bundled com.google.cloud.opentelemetry.detection
  # resource detector reads the GCE metadata host by design, to populate
  # cloud.* resource attributes for observability — not credential theft.
  - id: well-known/lib/network/opentelemetry-javaagent::opentelemetry-javaagent-context
  # google-auth-library-java's ComputeEngineCredentials is the documented way
  # to fetch a service-account token when running on GCE — the library's
  # entire purpose, not a harvester embedding the endpoint.
  - id: well-known/lib/crypto/google-auth::java-compute-engine-credentials-class
# Notable, not suspicious. One provider's metadata endpoint in a JVM class
# is what that provider's own SDK is for: msal4j's IMDSManagedIdentitySource
# and azure-identity's IdentityClient carry the Azure IMDS path, and
# aws-java-sdk's EC2MetadataUtils/EC2MetadataClient carry the AWS one. That
# is exactly the benign case `jvm-cloud-metadata-token-harvest` below was
# built to separate out -- it stays hostile and still requires *two*
# providers inside a single class, which no single-cloud SDK has.
- id: jvm-azure-imds-token-path
  desc: JVM Azure IMDS OAuth2 token path
  crit: notable
  conf: 0.9
  attack: T1552.005
  for: [class]
  if:
    # "metadata/identity/oauth2/token" — the Azure Instance Metadata Service
    # managed-identity token endpoint.
    type: hex
    pattern: 6D 65 74 61 64 61 74 61 2F 69 64 65 6E 74 69 74 79 2F 6F 61 75 74 68 32 2F 74 6F 6B 65 6E
  unless:
  - id: metadata/package/files/system-package::container-image-tar-name
  # Azure Identity ships this endpoint as a normal cloud SDK dependency; the
  # Java/bytecode rule must not treat its bundled JavaScript source as a JVM
  # credential harvester.
  - id: well-known/lib/cloud/azure-identity::azure-identity-js-sdk
  - id: well-known/lib/cloud/azure-identity::package-path
  # The MongoDB Java driver's MONGODB-OIDC Azure mechanism reads the managed
  # identity token from this path by design (AzureCredentialHelper).
  - id: well-known/lib/data/mongodb::mongodb-java-internal-auth-http-helper
  # MSSQL JDBC ActiveDirectoryAuthentication reads Azure IMDS by design.
  - id: well-known/lib/data/mssql-jdbc::mssql-jdbc-driver-context
  - id: well-known/lib/data/snowflake-jdbc::jdbc-driver-context
- id: awsie-import
  desc: youtube-dl AWS helper import
  crit: baseline
  conf: 0.2
  for:
  - python
  if:
    type: text
    substr: "from .aws import AWSIE"
- id: aws-secretsmanager-endpoint
  desc: AWS Secrets Manager endpoint
  crit: notable
  conf: 0.88
  for: [javascript, typescript, python, shell]
  if:
    type: text
    regex: 'secretsmanager\.[a-z0-9-]+\.amazonaws\.com|secretsmanager\.ListSecrets'
- id: aws-ssm-parameters-endpoint
  desc: AWS SSM parameters endpoint
  crit: notable
  conf: 0.86
  for: [javascript, typescript, python, shell]
  if:
    type: text
    regex: 'ssm\.[a-z0-9-]+\.amazonaws\.com|AmazonSSM\.DescribeParameters'
- id: gcp-secretmanager-api
  desc: GCP Secret Manager API
  crit: notable
  conf: 0.88
  for: [javascript, typescript, python, shell]
  if:
    type: text
    regex: 'secretmanager\.googleapis\.com|google\.cloud\.secretmanager'
- id: python-refresh-token-json-get
  desc: Python reads refresh_token JSON key
  crit: notable
  conf: 0.94
  attack: T1528
  for: [python]
  if:
    type: text
    regex: '\.get\s*\(\s*["'']refresh_token["'']\s*\)'
- id: python-token-set-add
  desc: Python adds token to set
  crit: notable
  conf: 0.82
  for: [python]
  if:
    type: text
    regex: '\.add\s*\(\s*token\s*\)'
- id: python-print-token
  desc: Python prints token variable
  crit: notable
  conf: 0.82
  for: [python]
  if:
    type: text
    regex: '\bprint\s*\(\s*token\s*\)'
- id: windows-token-broker-tbres-cache
  desc: Reads Token Broker .tbres cache file
  crit: suspicious
  conf: 0.94
  attack: T1552.001,T1528
  platforms: [windows]
  for: [powershell, scripts, binaries, source]
  if:
    type: text
    regex: '(?i)(TokenBroker|Token\s+Broker).{0,180}\.tbres\b'
- id: aliyun-access-key-id-assigned
  desc: Aliyun access key id assigned
  conf: 0.94
  if:
    type: text
    regex: '(?i)\b\w*ACCESS_KEY_ID\b\s*=\s*["'']LTAI[A-Za-z0-9]{12,}["'']'
  unless:
    - id: metadata/package/testing/
    - id: well-known/tool/detection/redaction::sensitive-data-scanner
- id: google-api-key-fragment
  desc: Short Google API key fragment
  crit: notable
  conf: 0.9
  if:
    type: text
    regex: '["'']AIzaSy[A-Za-z0-9_-]{2,20}["'']'
- id: gemini-api-key-fragment
  desc: Short Gemini API key fragment
  crit: notable
  conf: 0.9
  if:
    type: text
    regex: '["'']AQ\.Ab8[A-Za-z0-9_-]{4,24}["'']'
- id: python-joins-key-parts
  desc: Concatenates numbered key parts
  crit: notable
  conf: 0.92
  for: [python]
  if:
    type: text
    regex: '\[["'']p1["'']\]\s*\+.{0,48}\[["'']p2["'']\]'
- id: google-api-key-assigned
  desc: Assigns a Google API key literal
  conf: 0.94
  if:
    type: text
    # Word-boundary anchored so a compound settings field (default_api_key,
    # maps_api_key) is app config, not an api_key assignment by the code itself.
    regex: '\bapi_key\s*=\s*["'']AIzaSy[A-Za-z0-9_-]{20,}["'']'
- id: gemini-api-key-assigned
  desc: Assigns a Gemini API key literal
  conf: 0.94
  if:
    type: text
    regex: '\bapi_key\s*=\s*["'']AQ\.Ab8[A-Za-z0-9_-]{12,}["'']'
- id: url-api-key-query
  desc: URL query carries an API key
  crit: notable
  conf: 0.9
  if:
    type: text
    regex: '[?&]api-key=[A-Za-z0-9-]{20,}'
- id: python-client-https-literal
  desc: Client call takes an HTTPS literal
  crit: notable
  conf: 0.86
  for: [python]
  if:
    type: text
    regex: 'Client\(\s*["'']https?://'
- id: python-client-api-key-arg
  desc: Client constructor takes an API key
  crit: notable
  conf: 0.88
  for: [python]
  if:
    type: text
    regex: '\.Client\(\s*api_key\s*='
- id: aliyun-access-key-secret-assigned
  desc: Aliyun key secret assigned
  crit: notable
  conf: 0.9
  if:
    type: text
    regex: '(?i)\b\w*KEY_SECRET\b\s*=\s*["''][A-Za-z0-9]{16,}["'']'
  unless:
    - id: metadata/package/testing/
    - id: well-known/tool/detection/redaction::sensitive-data-scanner
- id: groq-api-key-literal
  desc: Quoted Groq API key literal
  crit: notable
  conf: 0.93
  if:
    type: text
    regex: '["'']gsk_[A-Za-z0-9]{20,}["'']'
- id: python-groq-api-key-arg
  desc: Groq client takes an API key
  crit: notable
  conf: 0.9
  for: [python]
  if:
    type: text
    regex: 'Groq\(\s*api_key\s*='
- id: huggingface-token-literal
  desc: Quoted Hugging Face token literal
  crit: notable
  conf: 0.93
  if:
    type: text
    regex: '["'']hf_[A-Za-z0-9]{20,}["'']'
- id: python-hf-token-assignment
  desc: Assigns a Hugging Face token name
  crit: notable
  conf: 0.88
  for: [python]
  if:
    type: text
    regex: '(?i)\bhf_token\s*='
composite_rules:
- id: python-groq-client-ships-api-key
  desc: Groq client ships an API key
  crit: hostile
  conf: 0.96
  for: [python]
  scope: file
  all:
    - id: groq-api-key-literal
    - id: python-groq-api-key-arg
- id: python-assigns-huggingface-token
  desc: Assigns a quoted Hugging Face token
  crit: hostile
  conf: 0.96
  for: [python]
  scope: file
  all:
    - id: huggingface-token-literal
    - id: python-hf-token-assignment
- id: python-split-google-api-key
  desc: Rejoins a split Google API key
  crit: hostile
  conf: 0.96
  for: [python]
  scope: file
  near_lines: 30
  all:
    - id: python-joins-key-parts
  any:
    - id: google-api-key-fragment
    - id: gemini-api-key-fragment
  needs: 1
- id: python-client-ships-url-api-key
  desc: Client URL embeds an API key
  crit: hostile
  conf: 0.95
  for: [python]
  scope: file
  all:
    - id: url-api-key-query
    - id: python-client-https-literal
- id: python-client-ships-api-key
  desc: Client is constructed with an API key
  crit: hostile
  conf: 0.96
  for: [python]
  scope: file
  near_lines: 6
  all:
    - id: python-client-api-key-arg
  any:
    - id: google-api-key-assigned
    - id: gemini-api-key-assigned
  needs: 1
- id: aliyun-embedded-access-key-pair
  desc: Embedded Aliyun access key pair
  crit: hostile
  conf: 0.97
  scope: file
  near_lines: 8
  all:
    - id: aliyun-access-key-id-assigned
    - id: aliyun-access-key-secret-assigned
- id: hardcoded-github-pat-used-for-api-auth
  desc: Shipped GitHub PAT authenticates repository API
  crit: hostile
  conf: 0.98
  for: [javascript, typescript]
  near_lines: 100
  all:
  - id: micro-behaviors/communications/http/services/github::github-contents-api-endpoint
  - id: micro-behaviors/communications/http/request/credentials::js-token-header-from-variable
  any:
  - id: github-classic-pat
  - id: metadata/file/string/credential::github-fine-grained-pat
- id: js-recursive-cloud-credential-scan
  desc: Recursive cloud credential path scan
  crit: notable
  conf: 0.94
  for: [javascript, typescript]
  near_bytes: 8192
  unless:
  - id: well-known/tool/development/agent/anthropic-claude-agent/
  - id: well-known/lib/development/typescript-compiler::compiler-diagnostics-bundle
  - id: well-known/lib/crypto/google-auth::js-sdk-bundle
  all:
  - id: micro-behaviors/fs/directory/traverse::node-recursive-dirent-walk
  any:
  - id: metadata/file/string/cloud::gcp-default-credentials
  - id: objectives/discovery/cloud/metadata::metadata-harvesting
- id: js-ci-container-aware-cloud-credential-scan
  desc: CI/container-aware cloud credential scan
  crit: notable
  conf: 0.94
  for: [javascript, typescript]
  all:
  - id: js-recursive-cloud-credential-scan
  any:
  - id: micro-behaviors/os/env/cicd/
  - id: micro-behaviors/os/container/runtime::dockerenv
  - id: micro-behaviors/fs/proc/container::container-self-cgroup
  unless:
  - id: well-known/tool/development/agent/anthropic-claude-agent/
- id: multi-cloud-imds-exfil
  desc: Multi-cloud metadata access with HTTP exfiltration
  crit: hostile
  conf: 0.97
  attack: T1552.005
  for: [javascript]
  near_lines: 80
  all:
  - id: micro-behaviors/os/security/auth/cloud::aws-imds-credential-reference
  - id: micro-behaviors/communications/http/request/client::http-request
  any:
  - id: micro-behaviors/os/security/auth/cloud::gcp-metadata-credential-reference
  - id: micro-behaviors/communications/http/request/client::js-fetch-call
- id: python-json-refresh-token-harvest
  desc: Python harvests refresh tokens from JSON files
  crit: hostile
  conf: 0.97
  attack: T1528
  for: [python]
  all:
  - id: python-refresh-token-json-get
  - id: micro-behaviors/data/serialize/json::json-load-call
  - id: micro-behaviors/fs/enumerate/directory::python-json-glob
  - id: micro-behaviors/fs/file/open::generic-dup
  any:
  - id: python-token-set-add
  - id: python-print-token
- id: jvm-cloud-metadata-token-harvest
  desc: JVM class harvests two clouds' metadata tokens
  crit: hostile
  conf: 0.98
  attack: T1552.005
  # Deliberately class-scoped, never jar-scoped. A shaded uber-JAR aggregates
  # hundreds of libraries, so "somewhere in these 70MB there is an AWS IMDS
  # path and a GCE metadata host" describes ordinary cloud-SDK bundling
  # (MongoDB driver, Hadoop connectors, Spark) rather than a behavior. Two
  # providers' credential endpoints inside a *single* class is the harvester.
  for: [class]
  any:
  - id: jvm-aws-iam-credential-path
  - id: jvm-gcp-metadata-host
  - id: jvm-azure-imds-token-path
  needs: 2
  scope: leaf
- id: multi-cloud-secret-service-targeting
  desc: Multi-cloud secret service targeting
  crit: hostile
  conf: 0.97
  attack: T1552.005
  mbc: E1552
  needs: 3
  any:
  - id: aws-secretsmanager-endpoint
  - id: aws-ssm-parameters-endpoint
  - id: micro-behaviors/communications/http/services/keyvault-azure::token-scope
  - id: micro-behaviors/communications/http/oauth::microsoft-login
  - id: gcp-secretmanager-api
  - id: micro-behaviors/communications/http/services/gcp::cloud-kms-endpoint
  downgrade:
    any:
    - id: objectives/discovery/cloud/metadata/
    - id: metadata/package/testing/
- id: azure-imds-access
  desc: Azure instance metadata identity request
  crit: suspicious
  conf: 0.95
  attack: T1552.005
  for:
  - javascript
  - typescript
  - python
  - shell
  all:
  - id: metadata/file/string/cloud::azure-managed-identity-token-path
  any:
  - id: micro-behaviors/communications/http/request/configuration::azure-imds-object-header
  - id: micro-behaviors/communications/http/request/configuration::azure-imds-cli-header
  unless:
  # MSAL Node bundles the Azure managed-identity/IMDS implementation as a
  # normal authentication feature; its library identity is stronger context
  # than the embedded token endpoint path alone.
  - id: well-known/lib/crypto/msal-node::library-context
  - id: well-known/lib/cloud/azure-identity::azure-identity-js-sdk
  - id: well-known/lib/cloud/azure-identity::package-path
  - id: metadata/package/scripts/lifecycle::azure-imds-benign-context
  - id: well-known/lib/data/mongodb::mongodb-js-driver-bundle
  - id: metadata/package/tooling::azure-agentbaker-tree
- id: aws-credential-theft
  for: [shell, python, javascript, ruby, perl]
  desc: AWS credential theft
  conf: 0.85
  any:
  - id: micro-behaviors/fs/path/token::aws-credentials
  - id: aws-access-key
  all:
  - id: objectives/credential-access/cloud/token/files::aws-config-dup
- id: gcp-credential-theft
  desc: Reads a GCP credential file path
  crit: suspicious
  conf: 0.85
  all:
  - id: micro-behaviors/fs/path/token::gcloud-credentials
  - id: micro-behaviors/fs/read/file
  near_bytes: 512
  any:
  - id: metadata/file/string/cloud::gcp-default-credentials
  unless:
  - id: objectives/discovery/cloud/metadata/
  - id: metadata/binary/layout/size::massive-executable
  - id: well-known/app/security/eeg-security/
  - id: well-known/lib/crypto/google-auth
  - id: well-known/tool/detection/agent-sentry/
  - id: well-known/app/storage/restic::restic-binary-name
- id: kubernetes-serviceaccount-abuse
  desc: Kubernetes token with API access
  crit: suspicious
  conf: 0.96
  attack: T1552.007
  all:
  - id: micro-behaviors/os/container/runtime::serviceaccount-files
  any:
  - id: micro-behaviors/os/container/runtime::api-enumeration
  - id: micro-behaviors/os/container/exec::pod-exec
  unless:
  - id: metadata/build/recognized-contexts::benign-app-fp-context
  - id: well-known/app/system/replicated-kots::replicated-kots-binary
  # Official clients and cluster-management tools legitimately combine the
  # in-cluster service-account paths with enumeration and pod exec endpoints.
  - id: well-known/lib/cloud/kubernetes::legitimate-kubernetes-incluster-client-marker
  - id: well-known/app/infrastructure/podman-desktop::builtin-podman-extension-path
  - id: well-known/app/infrastructure/podman-desktop::podman-desktop-main-bundle
- id: windows-token-broker-cache-exfil
  desc: Windows Token Broker SSO token collection with HTTP exfiltration
  crit: hostile
  conf: 0.98
  attack: T1528,T1041
  platforms: [windows]
  for: [powershell]
  all:
  - id: windows-token-broker-tbres-cache
  - id: micro-behaviors/communications/http/post::powershell-post-method
  near_lines: 25
