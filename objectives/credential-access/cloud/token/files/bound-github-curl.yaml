defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  crit: suspicious
traits:
  - id: github-regex-match-curl-transfer
    desc: Sends GitHub-token regex matches via curl
    conf: 0.98
    attack: T1552.001,T1041
    if:
      type: tree-sitter
      query: |
        ((program
          (lexical_declaration "const" (variable_declarator
            name: (object_pattern (shorthand_property_identifier_pattern) @bound_exec)
            value: (call_expression function: (identifier) @require
              arguments: (arguments (string (string_fragment) @module)))))
          (lexical_declaration "const" (variable_declarator
            name: (identifier) @regex_binding value: (regex) @pattern))
          (for_in_statement body: (statement_block
            (lexical_declaration "const" (variable_declarator
              name: (identifier) @match_binding
              value: (call_expression function: (member_expression
                property: (property_identifier) @match_method)
                arguments: (arguments (identifier) @used_regex))))
            (if_statement condition: (parenthesized_expression (identifier) @tested)
              consequence: (expression_statement (call_expression
                function: (identifier) @called_exec
                arguments: (arguments (binary_expression
                  right: (subscript_expression object: (identifier) @sent
                    index: (number) @index)) @command))))))) @evidence
          (#eq? @require "require")
          (#match? @module "^(node:)?child_process$")
          (#eq? @bound_exec @called_exec)
          (#any-of? @called_exec "exec" "execSync")
          (#match? @pattern "^/(gh[opusr]_|github_pat_)")
          (#eq? @regex_binding @used_regex)
          (#eq? @match_method "match")
          (#eq? @match_binding @tested) (#eq? @match_binding @sent)
          (#eq? @index "0")
          (#match? @command "^['\"]curl\\s")
          (#match? @command "https?://"))
