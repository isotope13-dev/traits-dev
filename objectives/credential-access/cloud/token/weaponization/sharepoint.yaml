# Follow-on access after a SharePoint machine key is recovered: the key is used
# to create authentication cookies that impersonate another account.
defaults:
  platforms: [windows, unix]
  for: [powershell, csharp, javascript, typescript, python, shell, php, java, c, cpp]

composite_rules:
  - id: sharepoint-machine-key-auth-token-forgery
    desc: SharePoint machine key auth-token forgery
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/communications/http/auth::sharepoint-machine-key-material
      - id: micro-behaviors/communications/http/auth::sharepoint-machine-key-protection-api
      - id: micro-behaviors/communications/http/auth::sharepoint-auth-session-cookie
    near_lines: 100
