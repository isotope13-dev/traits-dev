# Microsoft NAA/BroCI permits a broker application to redeem a refresh token
# for a nested application's resource token. Requiring an externally supplied
# credential, the broker-only request fields, the Entra token endpoint, and a
# Key Vault scope distinguishes manual post-compromise brokering from ordinary
# OAuth refresh handling.
defaults:
  platforms: [windows, unix]
  for: [scripts, source]
  attack: T1528,T1550.001

composite_rules:
  - id: microsoft-keyvault-refresh-token-brokering
    desc: Brokers an external refresh token into an Azure Key Vault token
    crit: hostile
    conf: 0.99
    all:
      - id: micro-behaviors/os/env/vars/credentials::refresh-token-env-name
      - id: micro-behaviors/os/env/access/
      - id: micro-behaviors/communications/http/oauth::microsoft-oauth-token-endpoint
      - id: micro-behaviors/communications/http/oauth::oauth-refresh-grant-type
      - id: micro-behaviors/communications/http/auth::microsoft-brokered-client-request
      - id: micro-behaviors/communications/http/services/azure-keyvault::token-scope
    near_bytes: 8192
    unless:
      - id: well-known/tool/detection/

  - id: brokered-keyvault-token-use
    desc: Uses a brokered OAuth token against Azure Key Vault
    crit: hostile
    conf: 0.99
    all:
      - id: microsoft-keyvault-refresh-token-brokering
      - id: micro-behaviors/communications/http/services/azure-keyvault::data-plane-host
      - id: micro-behaviors/communications/http/token-auth::access-token-field-source
      - id: micro-behaviors/communications/http/token-auth::bearer-header-from-variable
    near_bytes: 12000
    unless:
      - id: well-known/tool/detection/
