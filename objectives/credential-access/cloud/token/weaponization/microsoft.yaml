# Microsoft cloud-token weaponization.  The source article describes a
# reusable post-compromise sequence: exchange a refresh token for a PRT, then
# mint Microsoft browser-session cookies so the account can be used without a
# password or interactive MFA.
defaults:
  platforms: [unix, windows]
  # These matchers describe JavaScript/HTML kit code, not arbitrary scripts.
  # Keeping the scope narrow preserves hostile precision for the composite.
  for: [javascript, typescript, html]
  attack: T1528,T1550.004

traits:
  - id: microsoft-prt-conversion-route
    desc: Microsoft PRT conversion or exchange route
    crit: suspicious
    conf: 0.96
    if:
      type: text
      regex: '[/"'']api/prt/(convert|exchange|refresh)\b'

  - id: microsoft-prt-cookie-route
    desc: Microsoft PRT browser-cookie route
    crit: suspicious
    conf: 0.97
    if:
      type: text
      regex: '[/"'']api/prt/(cookie|owa-session)\b'

  - id: microsoft-prt-recon-route
    desc: Microsoft PRT Graph or Azure recon route
    crit: suspicious
    conf: 0.96
    if:
      type: text
      regex: '[/"'']api/prt/(recon|azure)\b'

  - id: microsoft-prt-conversion-function
    desc: Converts refresh token to Microsoft PRT
    crit: suspicious
    conf: 0.97
    if:
      type: text
      regex: '\bconvertToPRT\s*\('

  - id: microsoft-prt-cookie-function
    desc: Creates a Microsoft PRT browser cookie
    crit: suspicious
    conf: 0.97
    if:
      type: text
      regex: '\bcreatePRTCookie\s*\('

  - id: microsoft-prt-browser-cookie-field
    desc: Microsoft PRT browser-session cookie field
    crit: suspicious
    conf: 0.97
    if:
      type: text
      regex: 'x-ms-(RefreshTokenCredential|DeviceCredential)\b'

  - id: microsoft-prt-refresh-function
    desc: Refreshes access token via Microsoft PRT
    crit: suspicious
    conf: 0.95
    if:
      type: text
      regex: '\brefreshWithPRT\s*\('

composite_rules:
  - id: microsoft-prt-conversion-mechanism
    desc: Microsoft PRT conversion operation
    crit: suspicious
    conf: 0.98
    any:
      - id: microsoft-prt-conversion-route
      - id: microsoft-prt-conversion-function
      - id: microsoft-prt-refresh-function

  - id: microsoft-prt-cookie-mechanism
    desc: Microsoft PRT browser-cookie operation
    crit: suspicious
    conf: 0.98
    any:
      - id: microsoft-prt-cookie-route
      - id: microsoft-prt-cookie-function

  - id: microsoft-prt-token-to-browser-session
    desc: Refresh token to Microsoft browser cookie
    crit: hostile
    conf: 0.99
    # Prefer leaf refresh-token matchers: auth::refresh-token-field is a
    # needs<=1 `any` composite and is filtered from findings, so parents that
    # depend on it never see it.
    all:
      - id: microsoft-prt-browser-cookie-field
      - id: microsoft-prt-conversion-mechanism
      - id: microsoft-prt-cookie-mechanism
    any:
      - id: micro-behaviors/communications/http/auth::refresh-token-camel-field
      - id: micro-behaviors/communications/http/oauth::refresh-token
      - id: micro-behaviors/communications/http/auth::token-object-field
    near_bytes: 8192

  - id: microsoft-prt-recon-after-conversion
    desc: PRT conversion paired with Graph or Azure recon
    crit: hostile
    conf: 0.97
    all:
      - id: microsoft-prt-conversion-mechanism
      - id: microsoft-prt-recon-route
      - id: micro-behaviors/communications/http/auth::refresh-token-field
    near_bytes: 8192
