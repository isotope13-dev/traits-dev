defaults:
  platforms:
  - windows
  - unix
  for:
  - scripts
  - source
  attack: T1552.001
traits:
- id: kubectl-config-view
  desc: kubectl raw kubeconfig read
  crit: notable
  conf: 0.95
  if:
    type: text
    regex: kubectl\s+config\s+view.{0,160}--raw
  unless:
  # Same single-operation rule as the gh legs above: the shell-form command
  # string next to split argv is one kubeconfig read described twice, not two
  # independent extractions.
  - id: objectives/credential-access/cloud/token/cli::kubectl-config-split
  - id: well-known/tool/detection/security-scanner/
  - id: well-known/app/infrastructure/skypilot::skypilot-source-file
  - id: well-known/app/infrastructure/skypilot::skypilot-kubeconfig-helper
- id: kubectl-client-key-data
  desc: Kubernetes client private key field
  crit: component
  conf: 0.97
  ref: sha256:e4445eaa3155940f60991241a809409aa70b708303a0d07aa35b2e3d2bf76885
  if:
    type: text
    substr: client-key-data
- id: shell-base64-decode-to-cert-file
  desc: Shell decodes certificate to file
  crit: notable
  conf: 0.9
  for:
  - shell
  ref: sha256:e4445eaa3155940f60991241a809409aa70b708303a0d07aa35b2e3d2bf76885
  if:
    type: text
    regex: 'base64\s+--decode\s*>\s*["''].{0,120}\.(crt|key)["'']'
# Shelling out to the vendor's own CLI to read the token it already holds is how
# deploy tooling authenticates on the user's behalf -- travis.rb's
# `travis setup heroku` runs it to pre-fill .travis.yml, and prompts the user
# when it comes back empty. Unlike an identity-state query, this command returns
# reusable credential material, so it remains credential-access evidence.
- id: heroku-auth-token
  desc: Heroku token read (heroku auth:token)
  crit: notable
  conf: 0.95
  if:
    type: text
    substr: heroku auth:token
- id: go-github-token-required-error
  desc: Go GitHub token required error
  crit: notable
  conf: 0.94
  for:
  - go
  if:
    type: text
    substr: ErrGitHubTokenRequired
- id: go-github-finding-type-secret
  desc: Go GitHub finding type secret
  crit: notable
  conf: 0.94
  for:
  - go
  if:
    type: text
    substr: FindingTypeSecret
- id: kubectl-config-split
  desc: "kubectl raw kubeconfig read (split args)"
  crit: notable
  conf: 0.9
  for:
  - go
  - rust
  - java
  - csharp
  if:
    type: text
    regex: '"kubectl"[,\s]+"config"[,\s]+"view"(?s:.{0,120})"--raw"'
  unless:
  - id: metadata/package/testing/presence/harness::go-test-file
- id: gh-auth-tempfile
  desc: GitHub auth token stored in tempfile
  crit: notable
  conf: 0.95
  for:
  - shell
  if:
    type: text
    regex: '(GH_TOKEN=\$\(mktemp\))'
- id: gh-auth-cleanup-trap
  desc: GitHub auth token cleanup trap
  crit: notable
  conf: 0.95
  for:
  - shell
  if:
    type: text
    substr: trap cleanup_token EXIT
- id: gh-auth-token-path-handoff
  desc: GitHub auth token passed by path
  crit: notable
  conf: 0.95
  for:
  - shell
  if:
    type: text
    substr: --token-path "$GH_TOKEN"
- id: docker-config-auth-evidence--auths
  desc: Docker config auths field
  crit: notable
  conf: 0.9
  if:
    type: text
    regex: '["'']auths["'']\s*:'
- id: docker-config-auth-evidence--credsstore
  desc: Docker auth config evidence (credsStore)
  crit: notable
  conf: 0.9
  if:
    type: text
    regex: '["'']credsStore["'']\s*:'
- id: docker-config-auth-evidence--credhelpers
  desc: Docker auth config evidence (credHelpers)
  crit: notable
  conf: 0.9
  if:
    type: text
    regex: '["'']credHelpers["'']\s*:'
composite_rules:
- id: docker-config-auth-evidence
  desc: Docker auth config evidence
  crit: component
  conf: 0.9
  any:
  - id: docker-config-auth-evidence--auths
  - id: docker-config-auth-evidence--credsstore
  - id: docker-config-auth-evidence--credhelpers
- id: docker-config-json
  desc: Docker credential file access
  crit: component
  conf: 0.9
  near_bytes: 256
  all:
  - id: micro-behaviors/fs/path/credential::docker-config-path-reference
  any:
  - id: micro-behaviors/fs/read/file
  unless:
  - id: well-known/tool/sysadmin/container/
  - id: well-known/tool/detection/security-scanner/
  - id: micro-behaviors/os/container/oci/
  - id: micro-behaviors/os/container/image/
  - id: metadata/lang/generated::python-protobuf-stub
  - id: metadata/lang/generated::python-mypy-protobuf-generated
- id: docker-config-auth-marker
  desc: Reads Docker configuration authentication fields
  crit: notable
  conf: 0.92
  near_bytes: 512
  all:
  - id: docker-config-json
  any:
  - id: docker-config-auth-evidence
- id: release-notes-token-tempfile-handoff
  desc: Release notes passes GitHub token by tempfile
  crit: component
  conf: 0.95
  for:
  - shell
  all:
  - id: gh-auth-tempfile
  - id: gh-auth-cleanup-trap
  - id: gh-auth-token-path-handoff
# A Rust unit-test module whose cloud CLI strings are all inputs to the
# predicate under test is a fixture table, not a harvester: the crate is
# classifying command lines, not running them. A test attribute is always
# required, so a real harvester without tests still trips this rule; the
# fixture leg accepts either an assert argument or a `let cases = [...]`
# table element, since table-driven tests assert inside the loop.
- id: rust-test-cloud-cli-string-fixture
  desc: Rust test asserts on cloud CLI strings
  crit: exception
  conf: 0.95
  for: [rust]
  all:
  - id: metadata/package/testing/harness/unit::rust-test
  any:
  - id: metadata/package/testing/harness/unit::rust-assert-cloud-cli-command-fixture
  - id: metadata/package/testing/harness/unit::rust-cloud-cli-command-fixture-table
- id: mass-cloud-credential-harvest
  desc: Multiple cloud credential extraction operations
  crit: hostile
  conf: 0.95
  needs: 2
  unless:
  - id: well-known/tool/detection/security-scanner/
  - id: rust-test-cloud-cli-string-fixture
  any:
  - id: micro-behaviors/os/security/auth/secret::gh-auth-token-raw
  - id: micro-behaviors/os/security/auth/secret::gh-auth-token-split
  - id: objectives/credential-access/cloud/token/cli::gh-auth-token
  - id: micro-behaviors/process/create/vcs/git::go-git-credential-helper
  # Listing and retrieving entries are two phases of one Secrets Manager
  # workflow, not two independent credential sources. Count the combined
  # operation once so a single-store inventory does not satisfy `needs: 2`.
  - id: micro-behaviors/os/security/auth/secret::aws-secretsmanager-inventory-read
  - id: kubectl-config-view
  - id: kubectl-config-split
  - id: heroku-auth-token
# Decoding the caller's own kubeconfig client key/cert to local files is the
# standard first step of any script that needs to present a client cert --
# CI mTLS smoke tests, cluster-bootstrap helpers, and cert-rotation tooling
# all do this against their own current kubeconfig, with clear legitimate
# use. Extraction alone isn't credential theft; escalate to hostile only
# once the extracted material is validated against (or sent to) a remote
# host — see kubernetes-client-cert-mtls-validation.
- id: kubernetes-client-key-materialization
  for: [shell]
  desc: Kubernetes client key extracted from kubeconfig to a local file
  crit: notable
  conf: 0.99
  ref: sha256:e4445eaa3155940f60991241a809409aa70b708303a0d07aa35b2e3d2bf76885
  all:
  - id: kubectl-config-view
  - id: kubectl-client-key-data
  - id: micro-behaviors/crypto/certificate/usage::kubeconfig-client-certificate-field
  - id: shell-base64-decode-to-cert-file
- id: kubernetes-client-cert-bundle-materialization
  for: [shell]
  desc: Kubernetes client key/cert/CA bundle extracted to files
  crit: notable
  conf: 0.99
  ref: sha256:e4445eaa3155940f60991241a809409aa70b708303a0d07aa35b2e3d2bf76885
  all:
  - id: kubernetes-client-key-materialization
  - id: micro-behaviors/crypto/certificate/usage::kubeconfig-ca-certificate-field
- id: go-github-token-env-fallback-helper
  desc: Go GitHub token helper with env fallback
  crit: component
  conf: 0.94
  for:
  - go
  all:
  - id: micro-behaviors/os/security/auth/secret::go-github-token-env-fallback-call
  - id: go-github-token-required-error
- id: go-github-token-security-probe
  desc: Go GitHub token security probe
  crit: component
  conf: 0.94
  for:
  - go
  all:
  - id: micro-behaviors/os/security/auth/secret::go-github-token-discard-comment
  - id: go-github-finding-type-secret
- id: registry-token-theft
  desc: Docker and package registry credential access
  crit: hostile
  conf: 0.95
  near_bytes: 8192
  unless:
  - id: well-known/tool/sysadmin/container/
  - id: well-known/tool/detection/security-scanner/
  - id: well-known/tool/detection/threat-intel/
  - id: metadata/lang/generated::python-protobuf-stub
  - id: metadata/lang/generated::python-mypy-protobuf-generated
  - id: well-known/tool/detection/agent-sentry/
  - id: well-known/lib/format/conda-package/
  # A directory reference here used to count generic helper components such as
  # "uses os.homedir()" and "calls readFile()" as two independent registries.
  # Require the Docker credential file plus an actual second package-registry
  # credential access/exfiltration behavior in the same file.
  all:
  - id: docker-config-json
  any:
  - id: micro-behaviors/fs/read/file/target::home-credential-path-near-read
  - id: objectives/exfiltration/stealer/credential::credential-file-http-flow-with-client-clues
  - id: objectives/supply-chain/credential-theft/registry::supply-chain-credential-theft
- id: sandbox-aware-credential-harvest
  for: [javascript]
  desc: Credential harvest with remote environment evasion
  crit: hostile
  conf: 0.95
  all:
  - id: well-known/lib/development/vscode::remote-name
  any:
  - id: micro-behaviors/os/security/auth/secret::gh-auth-token-raw
  - id: objectives/credential-access/cloud/token/cli::gh-auth-token
  - id: micro-behaviors/process/create/vcs/git::go-git-credential-helper
- id: vscode-cloud-cli-dropper
  for: [javascript]
  desc: VSCode cloud CLI harvest triggers package dropper
  crit: hostile
  conf: 0.99
  all:
  - id: mass-cloud-credential-harvest
  - id: well-known/lib/development/vscode::remote-name
  - id: objectives/command-and-control/dropper/delivery/download::package-runner-fallback-dropper
