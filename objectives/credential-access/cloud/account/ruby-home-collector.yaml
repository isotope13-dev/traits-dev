defaults:
  for: [ruby]
  platforms: [unix, windows]
traits:
  - id: ruby-aws-credential-call-in-data-hash
    desc: Reads AWS credential path into data hash
    crit: suspicious
    conf: 0.96
    if:
      type: tree-sitter
      query: |
        ((_ [(method name: (identifier) @reader parameters: (method_parameters (identifier) @param)
                  body: (body_statement (call receiver: (call receiver: (constant) @file method: (identifier) @read
                    arguments: (argument_list (call receiver: (constant) @file2 method: (identifier) @join
                      arguments: (argument_list (call receiver: (constant) @dir method: (identifier) @home) (identifier) @rel))))
                    method: (identifier) @slice)))
                (singleton_method name: (identifier) @reader parameters: (method_parameters (identifier) @param)
                  body: (body_statement (call receiver: (call receiver: (constant) @file method: (identifier) @read
                    arguments: (argument_list (call receiver: (constant) @file2 method: (identifier) @join
                      arguments: (argument_list (call receiver: (constant) @dir method: (identifier) @home) (identifier) @rel))))
                    method: (identifier) @slice)))] [ (hash (pair value: (hash (pair value: (call method: (identifier) @reader_use
                      arguments: (argument_list (string (string_content) @path))))))) (assignment right: (hash (pair value: (hash (pair value: (call method: (identifier) @reader_use
                      arguments: (argument_list (string (string_content) @path)))))))) (call arguments: (argument_list (hash (pair value: (hash (pair value: (call method: (identifier) @reader_use
                      arguments: (argument_list (string (string_content) @path))))))))) (method body: (body_statement [ (hash (pair value: (hash (pair value: (call method: (identifier) @reader_use
                      arguments: (argument_list (string (string_content) @path))))))) (assignment right: (hash (pair value: (hash (pair value: (call method: (identifier) @reader_use
                      arguments: (argument_list (string (string_content) @path)))))))) (call arguments: (argument_list (hash (pair value: (hash (pair value: (call method: (identifier) @reader_use
                      arguments: (argument_list (string (string_content) @path))))))))) ])) (singleton_method body: (body_statement [ (hash (pair value: (hash (pair value: (call method: (identifier) @reader_use
                      arguments: (argument_list (string (string_content) @path))))))) (assignment right: (hash (pair value: (hash (pair value: (call method: (identifier) @reader_use
                      arguments: (argument_list (string (string_content) @path)))))))) (call arguments: (argument_list (hash (pair value: (hash (pair value: (call method: (identifier) @reader_use
                      arguments: (argument_list (string (string_content) @path))))))))) ])) ])
         (#eq? @file "File") (#eq? @read "read") (#eq? @file2 "File") (#eq? @join "join")
         (#eq? @dir "Dir") (#eq? @home "home") (#eq? @slice "slice")
         (#eq? @param @rel) (#eq? @reader @reader_use) (#eq? @path ".aws/credentials"))
composite_rules:
  - id: ruby-home-aws-credential-post-collector
    desc: AWS credential collector with JSON POST sender
    crit: hostile
    conf: 0.98
    all:
      - id: ruby-aws-credential-call-in-data-hash
      - id: micro-behaviors/communications/http/request/credential-body-flow::ruby-json-body-request-send
