defaults:
  platforms: [unix, windows]
  for: [python]
  attack: T1552.005
traits:
- id: aws-sigv4-helper-symbol
  desc: AWS SigV4 helper call
  crit: suspicious
  conf: 0.9
  unless:
  - id: metadata/package/testing/
  - id: "metadata/file/naming::test-directory-component"
  if:
    type: symbol
    exact: generate_aws_headers
- id: aws-configure-helper-symbol
  desc: AWS configure helper symbol
  crit: baseline
  conf: 0.9
  if:
    type: text
    regex: 'aws_configure_(get|set)'
- id: aws-shared-credentials-file-env
  desc: AWS shared credentials env lookup
  crit: notable
  conf: 0.9
  unless:
  - id: well-known/lib/cloud/botocore::aws-python-sdk-source
  if:
    type: text
    regex: '(environ\s*(\[|\.get\s*\()|getenv\s*\()\s*[''\"]AWS_SHARED_CREDENTIALS_FILE[''\"]'
- id: aws-shared-credentials-doc-write
  desc: AWS shared credentials doc write
  crit: baseline
  conf: 0.9
  if:
    type: text
    regex: 'writes?\s+directly\s+to\s+``~/.aws/credentials``'
- id: aws-config-resolver-helper
  desc: AWS config resolver helper
  crit: baseline
  conf: 0.9
  if:
    type: text
    regex: 'AwsConfigResolver|Read AWS CLI config'
composite_rules:
- id: aws-shared-credentials-config-helper
  desc: AWS shared credentials config helper
  crit: baseline
  conf: 0.9
  any:
  - id: aws-configure-helper-symbol
  - id: aws-shared-credentials-file-env
  - id: aws-shared-credentials-doc-write
  - id: aws-config-resolver-helper
- id: python-aws-imds-secret-inventory
  desc: Python AWS credential inventory theft
  crit: hostile
  conf: 0.97
  all:
  - id: micro-behaviors/communications/http/services/aws::aws-imds-v2-token-endpoint
  - id: objectives/credential-access/cloud/secret-inventory::secrets-manager-inventory-api
  any:
  - id: micro-behaviors/communications/http/services/aws::python-aws-authentication-header-reference
  - id: aws-sigv4-helper-symbol
