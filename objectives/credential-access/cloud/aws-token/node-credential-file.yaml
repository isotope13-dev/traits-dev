defaults:
  platforms: [unix]
  for: [javascript, typescript]
  attack: T1041

traits:
  - id: node-aws-credential-readfile
    desc: Node readFile accesses AWS credentials
    crit: notable
    conf: 0.94
    if:
      type: symbol
      kind: call
      regex: '(^|\.)readFile(Sync)?$'
      arg:
        kind: string
        regex: '(?i)(^|[~/])\.aws[/\\]credentials$'
  - id: node-aws-credential-open
    desc: Node open accesses AWS credentials
    crit: notable
    conf: 0.94
    if:
      type: symbol
      kind: call
      regex: '(^|\.)open(Sync)?$'
      arg:
        kind: string
        regex: '(?i)(^|[~/])\.aws[/\\]credentials$'
  - id: node-aws-credential-stream
    desc: Node streams AWS credential file
    crit: notable
    conf: 0.94
    if:
      type: symbol
      kind: call
      exact: createReadStream
      arg:
        kind: string
        regex: '(?i)(^|[~/])\.aws[/\\]credentials$'
