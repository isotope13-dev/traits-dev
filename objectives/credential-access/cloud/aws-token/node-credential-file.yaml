defaults:
  platforms: [unix]
  for: [javascript, typescript]
  attack: T1041

traits:
  - id: node-aws-credential-readfile
    desc: Node readFile accesses AWS credentials
    crit: suspicious
    conf: 0.94
    unless:
      - id: well-known/tool/detection/ai-guardrail/
      - id: well-known/lib/cloud/aws-sdk-js/
      - id: metadata/lang/scripted::dts-declaration-file
      - id: metadata/package/documentation/page::generated-documentation-page
      - id: well-known/lib/format/stacksjs-ts-cloud::ts-cloud-aws-runtime-context
    if:
      type: symbol
      kind: call
      regex: '(^|\.)readFile(Sync)?$'
      arg:
        kind: string
        regex: '(?i)(^|[~/])\.aws[/\\]credentials$'
  - id: node-aws-credential-open
    desc: Node open accesses AWS credentials
    crit: suspicious
    conf: 0.94
    unless:
      - id: well-known/tool/detection/ai-guardrail/
      - id: well-known/lib/cloud/aws-sdk-js/
      - id: metadata/lang/scripted::dts-declaration-file
      - id: metadata/package/documentation/page::generated-documentation-page
      - id: well-known/lib/format/stacksjs-ts-cloud::ts-cloud-aws-runtime-context
    if:
      type: symbol
      kind: call
      regex: '(^|\.)open(Sync)?$'
      arg:
        kind: string
        regex: '(?i)(^|[~/])\.aws[/\\]credentials$'
  - id: node-aws-credential-stream
    desc: Node streams AWS credential file
    crit: suspicious
    conf: 0.94
    unless:
      - id: well-known/tool/detection/ai-guardrail/
      - id: well-known/lib/cloud/aws-sdk-js/
      - id: metadata/lang/scripted::dts-declaration-file
      - id: metadata/package/documentation/page::generated-documentation-page
      - id: well-known/lib/format/stacksjs-ts-cloud::ts-cloud-aws-runtime-context
    if:
      type: symbol
      kind: call
      exact: createReadStream
      arg:
        kind: string
        regex: '(?i)(^|[~/])\.aws[/\\]credentials$'
