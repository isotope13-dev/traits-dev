defaults:
  platforms: [unix]
  for: [javascript, typescript]
  attack: T1041

composite_rules:
- id: node-aws-credential-file-read
  desc: Node reads AWS credential file
  crit: suspicious
  conf: 0.94
  any:
  - id: objectives/credential-access/cloud/aws-token::node-aws-credential-readfile
  - id: objectives/credential-access/cloud/aws-token::node-aws-credential-open
  - id: objectives/credential-access/cloud/aws-token::node-aws-credential-stream
