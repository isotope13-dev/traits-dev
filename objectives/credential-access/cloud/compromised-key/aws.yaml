defaults:
  platforms: [unix, windows]
  for: [scripts, source, json]

composite_rules:
  - id: aws-compromised-access-key-quarantine
    desc: AWS flags a compromised access key through AttachUserPolicy
    crit: hostile
    conf: 0.99
    near_lines: 16
    all:
      - id: micro-behaviors/communications/http/services/aws-iam::iam-attach-user-policy-operation
      - id: micro-behaviors/communications/http/services/aws-iam::iam-compromised-key-quarantine-policy-reference

  - id: github-validated-exposed-aws-access-key
    desc: GitHub validates an exposed AWS access key through STS
    crit: suspicious
    conf: 0.99
    near_lines: 16
    all:
      - id: micro-behaviors/communications/http/services/aws-iam::sts-caller-identity-operation
      - id: micro-behaviors/communications/http/user-agent::github-aws-key-validation-user-agent
