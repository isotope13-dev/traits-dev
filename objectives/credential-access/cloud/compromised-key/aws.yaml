defaults:
  platforms: [unix, windows]
  for: [scripts, source, json]

composite_rules:
  - id: aws-compromised-access-key-quarantine
    desc: AWS flags a compromised access key through AttachUserPolicy
    crit: hostile
    conf: 0.99
    all:
      - id: micro-behaviors/communications/http/services/aws::iam-attach-user-policy-operation
      - id: micro-behaviors/communications/http/services/aws::iam-deny-all-policy-reference
