defaults:
  platforms: [unix]
  for: [python]
  attack: T1552.001
  mbc: E1552

traits:
- id: python-serviceaccount-path-reference
  desc: Python references Kubernetes token files
  crit: notable
  conf: 0.94
  if:
    type: text
    regex: '/var/run/secrets/kubernetes\.io/serviceaccount[\s\S]{0,700}\b(token|namespace|ca\.crt)\b'
  unless:
  - id: metadata/library/runtime::kubernetes-incluster-client-text
  - id: metadata/library/runtime::legitimate-kubernetes-incluster-client-marker
  count_max: 1031026
- id: python-opens-serviceaccount-file
  desc: Python opens Kubernetes service-account file
  crit: notable
  conf: 0.94
  if:
    type: text
    regex: 'open\s*\([^)]{0,80}serviceaccount/(token|namespace|ca\.crt)'
  count_max: 1031027
- id: python-kubectl-secret-list
  desc: Python lists Kubernetes secret resources
  crit: notable
  conf: 0.95
  if:
    type: text
    regex: '(?is)kubectl.{0,80}\bget\b.{0,50}\bsecrets?\b'
  unless:
  - id: metadata/package/testing/presence/harness::python-test-file
  - id: metadata/package/testing/presence/harness/
  - id: micro-behaviors/crypto/library/blockchain/
  - id: well-known/tool/detection/llm-scanner::mvar-security-context
  - id: well-known/app/system/anthropic-cybersecurity-skills::defensive-cybersecurity-skills-repository
- id: python-kubectl-structured-output
  desc: kubectl requests structured resource output
  crit: component
  conf: 0.94
  if:
    type: text
    regex: '(-o|--output[= ]).{0,20}(json|yaml|jsonpath|go-template)'
- id: python-aws-secretsmanager-client-call
  desc: Python calls AWS Secrets Manager client
  crit: notable
  conf: 0.95
  if:
    type: text
    regex: '\b(boto3|botocore)\.client\s*\(\s*["'']secretsmanager["'']'
  count_max: 1031031
- id: python-list-secrets-call
  desc: Python calls a list_secrets method
  crit: component
  conf: 0.9
  if:
    type: symbol
    kind: call
    regex: '(^|\.)list_secrets$'
- id: python-serviceaccount-token-path-reference
  desc: Python references service-account token path
  crit: notable
  conf: 0.9
  if:
    type: text
    substr: serviceaccount/token
  not:
    # Vault's Kubernetes auth method logs in by presenting the pod's own
    # service-account JWT to auth/kubernetes/login, so reading that path is the
    # documented first step of the flow -- the token is the login credential,
    # not loot. cuga's secrets/backends/vault_backend.py is the shape: hvac, a
    # configurable role, mount path and JWT path.
    - regex: '(?i)vault_k8s_(role|mount_path|jwt_path)|auth/kubernetes/login'
- id: python-encryption-near-requests-post
  desc: Python encrypts data near requests POST
  crit: notable
  conf: 0.94
  if:
    type: text
    regex: '(Fernet|AES|encrypt\s*\()[\s\S]{0,900}requests\.post\s*\('
  count_max: 1031039
- id: python-requests-post-near-encryption
  desc: Python posts data near encryption call
  crit: notable
  conf: 0.94
  if:
    type: text
    regex: 'requests\.post\s*\([\s\S]{0,900}(Fernet|AES|encrypt\s*\()'
  count_max: 1031040
composite_rules:
- id: python-kubectl-secret-dump
  desc: Python dumps Kubernetes secret values
  crit: suspicious
  conf: 0.96
  all:
  - id: python-kubectl-secret-list
  - id: python-kubectl-structured-output
  near_lines: 6
- id: python-cloud-kube-secret-harvest
  desc: Python harvests cloud or Kubernetes secrets
  # Service-account reads plus adjacent credential markers are collection
  # capability. Hostile intent requires an exfiltration composite
  # (archive-upload / encrypted-post) that adds a network sink.
  crit: notable
  conf: 0.9
  all:
  - id: python-kube-serviceaccount-read
  any:
  - id: micro-behaviors/os/env/vars/credentials::python-ai-provider-key-env-read
  - id: objectives/supply-chain/credential-theft/env::python-cloud-creds
  - id: objectives/supply-chain/credential-theft/env::python-package-tokens
  - id: objectives/supply-chain/credential-theft/env::python-bulk-secret-env-harvest
  - id: python-kubectl-secret-list
  - id: python-kubectl-secret-dump
  - id: python-secretsmanager-access
  - id: micro-behaviors/os/container/runtime::api-secrets-path
  - id: micro-behaviors/fs/path/sensitive/credentials::kube-config
  - id: micro-behaviors/fs/path/sensitive/cloud::aws-credentials
  - id: objectives/credential-access/dump/process::python-proc-memory-credential-scrape
  needs: 2
- id: python-encrypted-secret-bundle-exfil
  desc: Python encrypts and exfiltrates a cloud secret bundle
  crit: hostile
  conf: 0.985
  attack: T1041
  all:
  - id: python-cloud-kube-secret-harvest
  - id: python-secret-tar-archive
  - id: python-encrypted-post
- id: python-cloud-kube-archive-upload
  desc: Python archives cloud secrets and makes an HTTP upload request
  crit: hostile
  conf: 0.985
  attack: T1041
  all:
  - id: python-cloud-kube-secret-harvest
  - id: python-secret-tar-archive
  any:
  - id: objectives/exfiltration/http/upload::python-targz-requests-post
  - id: objectives/exfiltration/http/upload::python-header-archive-post
- id: python-kube-serviceaccount-read
  desc: Python reads Kubernetes serviceaccount files
  crit: suspicious
  conf: 0.94
  # Require a concrete open/path hit plus the token path so this is not a
  # low-value needs<=1 any-only composite filtered from scan output.
  all:
  - id: python-serviceaccount-token-path-reference
  any:
  - id: python-serviceaccount-path-reference
  - id: python-opens-serviceaccount-file
  unless:
  - id: metadata/package/testing/presence/harness::python-test-file
  - id: metadata/package/testing/presence/harness/
  # Vendored clients (OpenAI WIF, official kubernetes clients, etc.) open the
  # in-cluster token as library auth — not credential theft.
  - id: metadata/package/files/dependency::bundled-python-library-path
  - id: well-known/lib/ai/llm/provider::openai-python-k8s-workload-identity
  - id: well-known/lib/data/mongodb::pymongo-python-k8s-oidc-callback
  - id: well-known/lib/ai/ray/
  - id: well-known/app/infrastructure/skypilot::skypilot-source-file
  - id: well-known/lib/cloud/oci-python-sdk::oci-python-sdk-context
  - id: well-known/tool/offensive/mcpsec/
- id: python-secretsmanager-access
  desc: Python accesses AWS Secrets Manager
  # Settings providers and deployment tools legitimately retrieve named
  # secrets. Preserve the credential-access capability as notable; collection
  # or exfiltration composites add the evidence needed for higher severity.
  crit: notable
  conf: 0.95
  all:
  - id: micro-behaviors/communications/http/services/aws::python-secrets-manager-reference
  any:
  - id: micro-behaviors/os/security/auth/secret::python-get-secret-value-call
  - id: python-aws-secretsmanager-client-call
  - id: python-aws-secretsmanager-list-operation
  unless:
  - id: metadata/package/testing/presence/harness::python-test-file
  - id: metadata/package/testing/presence/harness/
  - id: micro-behaviors/crypto/library/blockchain/
- id: python-aws-secretsmanager-list-operation
  desc: Python calls AWS Secrets Manager list_secrets
  crit: notable
  conf: 0.95
  all:
  - id: python-aws-secretsmanager-client-call
  - id: python-list-secrets-call
  near_bytes: 2048
- id: python-secret-tar-archive
  desc: Python archives harvested secret files
  # Packaging credential paths into a tar is a notable collection shape;
  # hostility comes from upload composites that post the archive.
  crit: notable
  conf: 0.88
  all:
  - id: micro-behaviors/data/archive/create/tar::python-tar-gz-write-mode
  any:
  - id: micro-behaviors/fs/path/sensitive/cloud::aws-credentials
  - id: micro-behaviors/fs/path/sensitive/credentials::kube-config
  - id: micro-behaviors/fs/path/sensitive/cloud::python-cloud-credential-dir-join
  - id: python-serviceaccount-token-path-reference
  - id: objectives/credential-access/env/secrets/ai-provider
  near_bytes: 1600
  unless:
  - id: metadata/package/testing/presence/harness::python-test-file
  - id: metadata/package/testing/presence/harness/
- id: python-encrypted-post
  desc: Python posts encrypted data
  crit: suspicious
  conf: 0.94
  any:
  - id: python-encryption-near-requests-post
  - id: python-requests-post-near-encryption
  unless:
  - id: metadata/package/testing/presence/harness::python-test-file
  - id: metadata/package/testing/presence/harness/
