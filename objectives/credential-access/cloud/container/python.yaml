defaults:
  platforms: [unix]
  for: [python]
  attack: T1552.001
  mbc: E1552

composite_rules:
- id: python-cloud-kube-secret-harvest
  desc: Python harvests cloud or Kubernetes secrets
  # Service-account reads plus adjacent credential markers are collection
  # capability. Hostile intent requires an exfiltration composite
  # (archive-upload / encrypted-post) that adds a network sink.
  crit: notable
  conf: 0.9
  all:
  - id: micro-behaviors/fs/read/file/handle::python-open-serviceaccount-token
  any:
  - id: micro-behaviors/os/env/ai-provider::python-ai-provider-key-env-read
  - id: micro-behaviors/os/env/cloud::python-cloud-creds
  - id: micro-behaviors/os/env/package-manager::python-package-tokens
  - id: objectives/credential-access/env/secrets/filtered-access::python-bulk-secret-env-harvest
  - id: micro-behaviors/os/container/orchestration::python-kubectl-get-secret
  - id: micro-behaviors/os/container/orchestration::python-kubectl-structured-secret-read
  - id: python-secretsmanager-access
  - id: micro-behaviors/os/container/orchestration::api-secrets-path
  - id: micro-behaviors/fs/path/secret-config::kube-config
  - id: micro-behaviors/fs/path/secret-config::kube-config-path-components
  - id: micro-behaviors/fs/path/token::aws-credentials
  - id: micro-behaviors/fs/path/token::python-cloud-credential-dir-join
  - id: micro-behaviors/fs/path/secret-config::docker-config-path-components
  - id: objectives/credential-access/memory::python-proc-memory-credential-scrape
  needs: 2
- id: python-encrypted-secret-bundle-exfil
  desc: Python encrypts and exfiltrates a cloud secret bundle
  crit: hostile
  conf: 0.985
  attack: T1041
  all:
  - id: python-cloud-kube-secret-harvest
  - id: python-secret-tar-archive
  - id: micro-behaviors/communications/http/request/body/construction::python-encrypted-post
- id: python-cloud-kube-archive-upload
  desc: Python archives cloud secrets and makes an HTTP upload request
  crit: hostile
  conf: 0.985
  attack: T1041
  all:
  - id: python-cloud-kube-secret-harvest
  - id: python-secret-tar-archive
  any:
  - id: micro-behaviors/communications/http/client/exchange::python-targz-requests-post
  - id: objectives/exfiltration/http/archive::python-header-archive-post
- id: python-secretsmanager-access
  desc: Python accesses AWS Secrets Manager
  # Settings providers and deployment tools legitimately retrieve named
  # secrets. Preserve the credential-access capability as notable; collection
  # or exfiltration composites add the evidence needed for higher severity.
  crit: notable
  conf: 0.95
  all:
  - id: micro-behaviors/communications/http/services/aws::python-secrets-manager-reference
  any:
  - id: micro-behaviors/os/security/auth/secret::python-get-secret-value-call
  - id: micro-behaviors/os/security/auth/secret::python-aws-secretsmanager-client-call
  - id: python-aws-secretsmanager-list-operation
  unless:
  - id: metadata/path/directory::test-directory-component
- id: python-aws-secretsmanager-list-operation
  desc: Python calls AWS Secrets Manager list_secrets
  crit: notable
  conf: 0.95
  all:
  - id: micro-behaviors/os/security/auth/secret::python-aws-secretsmanager-client-call
  - id: micro-behaviors/os/security/auth/secret::python-list-secrets-call
  near_bytes: 2048
- id: python-secret-tar-archive
  desc: Python archives harvested secret files
  # Packaging credential paths into a tar is a notable collection shape;
  # hostility comes from upload composites that post the archive.
  crit: notable
  conf: 0.88
  all:
  - id: micro-behaviors/data/archive/create/tar::python-tar-gz-write-mode
  any:
  - id: micro-behaviors/fs/path/token::aws-credentials
  - id: micro-behaviors/fs/path/secret-config::kube-config
  - id: micro-behaviors/fs/path/token::python-cloud-credential-dir-join
  - id: micro-behaviors/fs/path/token::serviceaccount-token-path
  - id: objectives/credential-access/env/secrets/ai-provider
  near_bytes: 1600
  unless:
  - id: metadata/path/directory::test-directory-component
