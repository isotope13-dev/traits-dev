defaults:
  platforms: [unix]
  for: [javascript, typescript]
  attack: T1041

traits:
  - id: node-kubeconfig-readfile
    desc: Node reads a Kubernetes kubeconfig file
    crit: suspicious
    conf: 0.94
    unless:
      - id: well-known/tool/development/cli/capsurface::capsurface-distribution
    if:
      type: text
      regex: '(?i)\.kube[/\\]config[\s\S]{0,180}readFile(Sync)?'
