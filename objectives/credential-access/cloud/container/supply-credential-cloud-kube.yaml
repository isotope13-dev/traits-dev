defaults:
  platforms: [unix]
  for: [python]
  attack: "T1552.001, T1041"
  mbc: E1552

composite_rules:
- id: packaged-python-cloud-kube-secret-harvest
  desc: Python cloud Kubernetes secret harvest
  # Standalone collectors live under credential-access. This supply-chain
  # variant requires an install/startup packaging surface so PyPI/.pth
  # droppers are attributed here without double-counting bare scripts.
  crit: notable
  conf: 0.9
  all:
  - id: objectives/credential-access/cloud/container::python-cloud-kube-secret-harvest
  any:
  - id: metadata/build/pip::setup-py
  - id: metadata/filename/identity::pyproject-toml-basename
  - id: "metadata/package/scripts/entrypoint::console-header-in-entry-points-file"
  - id: micro-behaviors/process/interpreter/python::pth-startup-import
