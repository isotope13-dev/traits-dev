defaults:
  platforms: [unix]
  for: [shell]
  crit: suspicious
  conf: 0.94
  attack: T1552.007

traits:
  - id: shell-kube-wallet-secret-filter
    desc: Filters Kubernetes secrets for wallet terms
    if:
      type: tree-sitter
      query: |
        (pipeline
          (command name: (command_name) @source) @source_cmd
          . (command name: (command_name) @filter
              argument: [(raw_string) (string)] @pattern) @filter_cmd
          (#eq? @source "kubectl")
          (#match? @source_cmd "\\bget\\s+secrets?\\b")
          (#match? @source_cmd "\\s(-o[ =]|--output[ =])(json|yaml)\\b")
          (#match? @filter "^(grep|egrep)$")
          (#match? @pattern "(?i)\\b(wallet|mnemonic|seed)\\b")
          (#not-match? @filter_cmd "\\s(-[A-Za-z]*v[A-Za-z]*|--invert-match)\\b")
        ) @match

composite_rules:
  - id: kube-host-root-credential-read
    desc: Host-root pod with credential file reads
    # Co-location does not prove the read uses the hostPath destination.
    # Recovery and incident-response pods can legitimately do the same work.
    attack: T1552.001
    near_lines: 40
    all:
      - id: micro-behaviors/os/container/orchestration::host-root-hostpath-volume
      - id: micro-behaviors/fs/read/file/target::shell-read-credential-file
