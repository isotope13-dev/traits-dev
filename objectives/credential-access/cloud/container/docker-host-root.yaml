# A container started with the host root filesystem mounted, alongside
# reads of credential files, repeats a credential search on the host
# from inside the container. A host-root mount alone (backup, DinD) is
# only the notable/suspicious atoms; the credential-read co-occurrence
# carries the theft claim.
defaults:
  platforms: [unix, windows]
  for: [shell]
  crit: hostile
  conf: 0.96
  attack: T1552.001,T1611

composite_rules:
  - id: docker-host-root-credential-search
    desc: Host-root container mount with credential file reads
    all:
      - id: micro-behaviors/os/container/runtime::docker-cli-host-root-volume-mount
    any:
      - id: micro-behaviors/fs/read/file/target::shell-read-credential-file
      - id: micro-behaviors/fs/path/token::aws-credentials-text-reference
      - id: micro-behaviors/data/format/credentials::github-token-format-pattern
