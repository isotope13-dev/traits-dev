defaults:
  for: [shell]
  platforms: [unix]
  crit: notable

traits:
- id: shell-kube-token-read-fragments-first
  desc: Stores fragments of token file read
  if:
    type: text
    substr: "f='ILE=$(cat /v';g='ar/run/sec';h='rets/kubern'"

- id: shell-kube-token-read-fragments-last
  desc: Stores remaining token path fragments
  if:
    type: text
    substr: "i='etes.io/se';j='rviceac';k='count/tok';l='en 2>/de';m='v/null)'"

- id: shell-oc-login-token-fragments-first
  desc: Stores fragments of oc token login
  if:
    type: text
    substr: "n='./oc lo';o='gin --tok';p='en=$DEBUG_F';q='ILE --ser'"

- id: shell-oc-login-tls-fragments-last
  desc: Stores oc TLS verification flag fragments
  if:
    type: text
    substr: "s='--insecu';t='re-skip-tls-v';u='erify'"

composite_rules:
- id: obfuscated-shell-kube-token-oc-login
  desc: Attempts OpenShift login with Kubernetes token
  crit: hostile
  conf: 0.99
  attack: T1552.007
  all:
  - id: shell-kube-token-read-fragments-first
  - id: shell-kube-token-read-fragments-last
  - id: shell-oc-login-token-fragments-first
  - id: shell-oc-login-tls-fragments-last
  - id: micro-behaviors/process/interpreter/eval/direct::shell-eval-variable
