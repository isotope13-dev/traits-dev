defaults:
  platforms: [unix]
  for: [scripts, source]
  attack: T1552.001
  mbc: E1552

traits:
- id: docker-config-env-field
  desc: Docker container Config.Env extraction
  crit: notable
  conf: 0.92
  if:
    type: string_literal
    substr: Config.Env
# Docker inspect exposes a container's env at `.Config.Env`. Match that key
# chain as property, subscript, or chained-get access rather than the bare
# words "Config"/"Env", which are ubiquitous and would let unrelated programs
# register a spurious credential-access finding.
- id: docker-config-env-property-chain
  desc: Docker Config.Env property access
  crit: component
  conf: 0.86
  if:
    type: text
    regex: '\bConfig\s*\.\s*Env\b'
- id: docker-config-env-subscript
  desc: Docker Config.Env subscript access
  crit: component
  conf: 0.86
  if:
    type: text
    regex: '\[\s*["'']Config["'']\s*\]\s*\[\s*["'']Env["'']\s*\]'
- id: docker-config-env-get-chain
  desc: Docker Config.Env chained get access
  crit: component
  conf: 0.88
  for: [python]
  if:
    type: text
    regex: '\.get\(\s*["'']Config["''].{0,30}\)\s*\.get\(\s*["'']Env["'']'
- id: docker-inspect-env-format
  desc: docker inspect Config.Env format string
  crit: suspicious
  conf: 0.92
  unless:
  - id: well-known/tool/development/luma::archive-member
  - id: well-known/tool/development/ai-cli/agent-container::module-doc-marker
  if:
    type: string_literal
    exact: "{{json .Config.Env}}"

composite_rules:
- id: docker-socket-api-env-harvest
  desc: Docker socket API container env harvest
  crit: hostile
  conf: 0.95
  unless:
  - id: well-known/tool/development/luma::archive-member
  - id: well-known/tool/development/ai-cli/agent-container::module-doc-marker
  all:
  - id: micro-behaviors/os/container/runtime::docker-socket-path
  - id: micro-behaviors/os/container/runtime::docker-api-container-list-path
  - id: micro-behaviors/os/container/runtime::docker-api-container-inspect-path
  any:
  - id: docker-config-env-field
  - id: docker-config-env-property-chain
  - id: docker-config-env-subscript
  - id: docker-config-env-get-chain
  near_lines: 90
- id: docker-cli-env-harvest
  desc: Docker CLI container env harvest
  crit: hostile
  conf: 0.95
  unless:
  - id: well-known/tool/development/luma::archive-member
  - id: well-known/tool/development/ai-cli/agent-container::module-doc-marker
  all:
  - id: docker-inspect-env-format
  - id: micro-behaviors/process/create/subprocess::run-content
  near_lines: 20
