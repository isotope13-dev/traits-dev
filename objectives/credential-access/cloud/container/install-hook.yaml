# Migrated from the legacy install-hook trigger bucket; the result owns this path.
defaults:
  platforms: [unix, windows]
  for: [javascript, package.json, shell]
  attack: T1195.002
  mbc: E1041


composite_rules:
- id: npm-postinstall-cloud-container-secret-stage
  desc: Npm postinstall stages cloud and container secret files
  crit: hostile
  conf: 0.995
  attack: T1552.005
  scope: archive
  for: [javascript, package.json, tar, zip]
  all:
  - id: metadata/package/scripts/lifecycle::postinstall-runs-node-script
  - id: micro-behaviors/os/security/auth/cloud::aws-imds-credential-reference
  - id: micro-behaviors/fs/path/token::serviceaccount-token-path
  - id: micro-behaviors/process/create/shell/bridge::execSync-call
  - id: micro-behaviors/fs/write/file/full::write-file-sync
  any:
  - id: micro-behaviors/fs/path/config/accounts::etc-passwd
  - id: micro-behaviors/os/env/read::javascript
  - id: micro-behaviors/fs/path/credential::container-credentials
  unless:
  - id: metadata/package/testing/harness/runtime/
