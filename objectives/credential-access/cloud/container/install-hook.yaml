# Migrated from the legacy install-hook trigger bucket; the result owns this path.
defaults:
  platforms: [unix, windows]
  for: [javascript, package.json, shell]
  attack: T1195.002
  mbc: E1041


composite_rules:
- id: npm-postinstall-cloud-container-secret-stage
  desc: Npm postinstall stages cloud and container secret files
  crit: hostile
  conf: 0.995
  attack: T1552.005
  scope: archive
  for: [javascript, package.json, tar, zip]
  all:
  - id: metadata/package/scripts/entrypoint::postinstall-runs-node-script
  - id: micro-behaviors/communications/http/services/aws::iam-credentials-path-reference
  - id: micro-behaviors/fs/path/credential/container::serviceaccount-token-path
  - id: micro-behaviors/process/create/shell/command-string::execSync-call
  - id: micro-behaviors/fs/write/file/full/call::write-file-sync
  any:
  - id: micro-behaviors/fs/path/credential/account-db::etc-passwd
  - id: micro-behaviors/os/env/read/current::javascript
  - id: micro-behaviors/fs/path/credential/container::container-credentials
