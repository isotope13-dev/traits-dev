# Reconstructed from the node-level collector described by Wiz. These
# operations individually also occur in incident response. A privileged
# host-root pod collecting both node PKI and other pods' tokens is a
# host credential harvester, even without a network exfiltration command.
defaults:
  for: [shell]
  platforms: [unix]
  crit: suspicious
  conf: 0.95
  attack: T1552.007

traits:
  - id: shell-kubelet-pki-archive
    desc: Archives a kubelet PKI directory
    ref: https://www.wiz.io/blog/agentic-attacks-artex-offensive-ai-frameworks
    if:
      type: text
      exclude_comments: true
      # The archive output precedes the source operand. Do not match a
      # kubelet/pki spelling used only as the archive's output filename.
      # Heredoc bodies do not have shell comment facts. Require a command
      # boundary so a commented-out inner command is not a credential read.
      regex: '(^|[;\n|&(])\s*tar\s+-?[a-z]*c[a-z]*f\s+\S+\s+["'']?/\S{0,60}/kubelet/pki(/|["''\s;]|$)'

  - id: shell-projected-token-cat-selection
    desc: Projected token selection with cat execution
    ref: https://www.wiz.io/blog/agentic-attacks-artex-offensive-ai-frameworks
    if:
      type: text
      exclude_comments: true
      # Kubernetes' on-node projected-volume layout, rather than a pod's
      # own /var/run/secrets token. Require the selection and read action.
      regex: '(^|[;\n|&(])\s*find\s+.{0,160}kubernetes\.io~projected/\S*/token["'']?\s+-exec\s+cat\s+\{\}'

composite_rules:
  - id: privileged-node-credential-collection
    desc: Privileged host-root pod harvests node keys and tokens
    crit: hostile
    conf: 0.98
    scope: file
    near_lines: 40
    all:
      - id: micro-behaviors/os/container/orchestration::host-root-hostpath-volume
      - id: metadata/lang/source/syntax/decision-field::privileged-field-text
      - id: shell-kubelet-pki-archive
      - id: shell-projected-token-cat-selection
