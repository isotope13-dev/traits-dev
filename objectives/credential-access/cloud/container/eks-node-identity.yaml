defaults:
  platforms: [unix, windows]
  for: [python, javascript, typescript]

composite_rules:
  - id: eks-node-identity-serviceaccount-token-mint
    # These SDKs expose a stable, statically visible STS presigning operation;
    # shell clients perform the same work inside opaque vendor binaries.
    desc: EKS node identity and service-account minting
    crit: hostile
    conf: 0.995
    attack: "T1552.005,T1552.007,T1078.004,T1613"
    all:
      - id: micro-behaviors/communications/http/services/aws::ec2-imds-iam-credentials-endpoint
      - id: micro-behaviors/os/security/auth/cloud::presigned-sts-caller-identity
      - id: micro-behaviors/os/security/auth/cloud::eks-aws-iam-token-prefix
      - id: micro-behaviors/os/container/runtime::serviceaccount-tokenrequest-path
      - id: micro-behaviors/os/container/runtime::selfsubjectrulesreview-path
      - id: micro-behaviors/os/container/runtime::api-pods-path
      - id: micro-behaviors/communications/http/authorization-header::bearer-prefix
    near_lines: 100
