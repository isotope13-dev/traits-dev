defaults:
  platforms: [unix, windows]
  for: [python]

traits:
- id: kaggle-user-secrets-token-name
  desc: Kaggle user secrets token name
  crit: component
  conf: 0.95
  if:
    type: string_literal
    exact: KAGGLE_USER_SECRETS_TOKEN
- id: kaggle-api-key-secret-label
  desc: Kaggle API key secret label
  crit: component
  conf: 0.95
  if:
    type: string_literal
    exact: api-key

composite_rules:
- id: python-kaggle-api-key-secret-request
  desc: Reads Kaggle API key via user secrets
  crit: hostile
  conf: 0.97
  near_lines: 30
  all:
  - id: micro-behaviors/communications/rpc::named-secret-read-rpc-reference
  - id: micro-behaviors/os/env/read::python-os-getenv-call
  - id: kaggle-user-secrets-token-name
  - id: kaggle-api-key-secret-label
