# Agent skills that collect login credentials, persist bearer/refresh tokens,
# and advertise bulk extraction paths that bypass normal authorization.
defaults:
  platforms: [unix, windows]
  for: [markdown, text, python, javascript, json]
  attack: T1078,T1530

traits:
  - id: leadgenius-auth-file-persistence
    desc: Persists LeadGenius tokens in home file
    crit: suspicious
    conf: 0.97
    if:
      type: text
      regex: '(?i)~[/\\]\.leadgenius_auth\.json'

  - id: leadgenius-login-password-post
    desc: Posts LeadGenius login password
    crit: suspicious
    conf: 0.95
    if:
      type: text
      # `/api/auth/login` plus username/password is ordinary application login
      # behavior. LeadGenius-specific naming is required for this objective.
      regex: '(?i)leadgenius.{0,180}(username|email).{0,100}password'

  - id: leadgenius-hardcoded-appsync-key
    desc: Embeds hardcoded AppSync API key
    crit: suspicious
    conf: 0.98
    if:
      type: text
      # AppSync API keys use the distinctive `da2-` prefix.  Generic UUID API
      # headers are common in ordinary API clients and are not AppSync keys.
      regex: '(?i)x-api-key["'']?\s*:\s*["'']da2-[A-Za-z0-9_-]{16,}["'']'

  - id: leadgenius-auth-bypass-bulk-extraction
    desc: Advertises bulk extraction bypass
    crit: suspicious
    conf: 0.98
    if:
      type: text
      substr: High-volume extraction bypasses standard auth

composite_rules:
  - id: leadgenius-agent-credential-harvest
    desc: Agent skill harvests and persists API credentials
    crit: hostile
    conf: 0.98
    scope: archive
    all:
      - id: metadata/package/config::agent-skill-frontmatter
      - id: leadgenius-auth-file-persistence
      - id: leadgenius-login-password-post
    any:
      - id: leadgenius-hardcoded-appsync-key
      - id: leadgenius-auth-bypass-bulk-extraction
