defaults:
  platforms: [unix, windows]
  for: [python]
  attack: T1552.005
  mbc: E1552

traits:
- id: gcp-secretmanager-latest-access
  desc: GCP Secret Manager latest version access
  crit: notable
  conf: 0.92
  if:
    type: string_literal
    substr: /versions/latest:access

composite_rules:
- id: python-azure-keyvault-secret-sweep
  desc: Python Azure Key Vault secret sweep
  crit: hostile
  conf: 0.97
  all:
  - id: micro-behaviors/communications/http/services/keyvault-azure::resource-url
  - id: micro-behaviors/communications/http/services/keyvault-azure::management-vault-list-path
  - id: micro-behaviors/communications/http/services/keyvault-azure::secret-list-path
  any:
  - id: micro-behaviors/communications/http/services/keyvault-azure::secret-value-path
  - id: "metadata/lang/source/naming/action::python-get-secret-value-symbol"
  - id: "metadata/lang/source/naming/action::python-list-secret-names-identifier"
  - id: "metadata/lang/source/naming/action::python-list-secrets-identifier"
  - id: micro-behaviors/fs/path/token::azure-cli-token-cache-path
  near_lines: 220
- id: python-gcp-secretmanager-secret-sweep
  desc: Python GCP Secret Manager secret sweep
  crit: hostile
  conf: 0.97
  all:
  - id: micro-behaviors/communications/http/services/gcp::secretmanager-v1-endpoint
  - id: gcp-secretmanager-latest-access
  any:
  - id: "metadata/lang/source/naming/action::python-get-secret-value-symbol"
  - id: "metadata/lang/source/naming/action::python-list-secret-names-identifier"
  - id: "metadata/lang/source/naming/action::python-list-secrets-identifier"
  - id: micro-behaviors/fs/path/secret-config::gcp-default-credentials
  - id: micro-behaviors/os/security/auth/cloud::gcp-metadata-credential-reference
  near_lines: 180
- id: python-multi-cloud-secret-sweep
  desc: Python multi-cloud managed secret sweep
  crit: hostile
  conf: 0.985
  for: [python, whl, python-sdist, zip]
  needs: 2
  any:
  - id: micro-behaviors/communications/http/services/aws::python-imds-secret-inventory-references
  - id: python-azure-keyvault-secret-sweep
  - id: python-gcp-secretmanager-secret-sweep
  - id: objectives/credential-access/cloud/container::python-cloud-kube-secret-harvest
  scope: archive
