# Python Apple-ID clients that pair the real authentication service with an
# unrelated Anisette relay and collect a password are credential-access tools,
# not ordinary iCloud API consumers.
defaults:
  platforms: [unix, windows]
  for: [python]
  attack: T1056.002,T1071.001
  crit: suspicious
  conf: 0.94

traits:
  - id: python-apple-gsa-auth-service
    desc: Python client targets Apple GSA login
    crit: notable
    conf: 0.97
    if:
      type: text
      substr: https://gsa.apple.com/grandslam/GsService2

  - id: python-apple-anisette-relay
    desc: Python client uses Anisette relay
    crit: suspicious
    conf: 0.98
    if:
      type: text
      substr: https://sign.rheaa.xyz/

  # The password leg must itself be Apple-specific. A bare
  # `getpass.getpass(...password...)` alternative used to live here and fired
  # on every stdlib password prompt shipped in a bundled interpreter
  # (distutils register, imaplib, urllib) -- none of which mentions Apple.
  # Keep the Apple-ID env var and Apple-named prompts only.
  - id: python-apple-password-collection
    desc: Python client collects Apple password
    crit: suspicious
    conf: 0.97
    if:
      type: text
      regex: '(?i)(APPLE_ID_PASSWORD|getpass\s*\.\s*getpass\s*\([^)]{0,80}apple)'

composite_rules:
  - id: python-apple-anisette-credential-client
    desc: Apple credential client uses relay service
    crit: hostile
    conf: 0.99
    scope: archive
    all:
      - id: python-apple-gsa-auth-service
      - id: python-apple-anisette-relay
      - id: python-apple-password-collection
      - id: micro-behaviors/communications/http/request/client::requests-post-url-literal
