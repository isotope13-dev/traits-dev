defaults:
  platforms: [windows, unix]
  for: [scripts, source]
  attack: T1552.001

composite_rules:
  - id: aws-secretsmanager-inventory-extraction
    desc: Enumerates and retrieves AWS Secrets Manager entries
    # Backup, migration, rotation and audit tooling can legitimately perform
    # both operations. The indiscriminate inventory is still unusual enough
    # to merit review, but it is not a no-legitimate-use attack pattern.
    crit: suspicious
    conf: 0.96
    all:
      - id: micro-behaviors/os/security/auth/secret::aws-secretsmanager-list
      - id: micro-behaviors/os/security/auth/secret::aws-secretsmanager-get
