# Constructor names are missing from the installed JavaScript flow graph.
# A sibling AST pattern ties the actual SecretClient construction to its loop;
# the composite supplies the real SDK import context for both clients.
defaults:
  platforms: [unix, windows]
  for: [javascript]
  crit: notable
  conf: 0.95

traits:
  - id: javascript-enumerated-secret-client-credential
    desc: Vault values feed application token clients
    if:
      type: tree-sitter
      language: javascript
      query: |
        ((lexical_declaration (variable_declarator
          name: (identifier) @constructed_store
          value: (new_expression constructor: (_) @vault_constructor)))
         . (for_in_statement
          left: (identifier) @entry
          right: (call_expression function: (member_expression
            object: (identifier) @store property: (property_identifier) @listing))
          body: (statement_block
            . (lexical_declaration (variable_declarator
              name: (identifier) @secret
              value: (await_expression (call_expression
                function: (member_expression object: (identifier) @reader
                  property: (property_identifier) @read)
                arguments: (arguments (member_expression
                  object: (identifier) @entry_use
                  property: (property_identifier) @name))))))
            . (lexical_declaration (variable_declarator
              name: (identifier) @application
              value: (new_expression constructor: (_) @constructor
                arguments: (arguments (object (pair
                  key: (property_identifier) @auth
                  value: (object (pair
                    key: (property_identifier) @credential
                    value: (member_expression object: (identifier) @secret_use
                      property: (property_identifier) @value)))))))))
            . [
              (lexical_declaration (variable_declarator
                value: (await_expression (call_expression
                  function: (member_expression object: (identifier) @application_use
                    property: (property_identifier) @token_method)))))
              (while_statement body: (statement_block
                . (try_statement body: (statement_block
                  . (lexical_declaration (variable_declarator
                    value: (await_expression (call_expression
                      function: (member_expression object: (identifier) @application_use
                        property: (property_identifier) @token_method)))))))))
            ])) @pivot
          (#match? @vault_constructor "(^|\\.)SecretClient$")
          (#eq? @constructed_store @store)
          (#eq? @listing "listPropertiesOfSecrets")
          (#eq? @read "getSecret")
          (#eq? @store @reader)
          (#eq? @entry @entry_use)
          (#eq? @name "name")
          (#eq? @value "value")
          (#match? @constructor "(^|\\.)ConfidentialClientApplication$")
          (#eq? @auth "auth")
          (#eq? @credential "clientSecret")
          (#eq? @secret @secret_use)
          (#eq? @application @application_use)
          (#eq? @token_method "acquireTokenByClientCredential")
          (#set! cleave.ignore-comments "true"))

composite_rules:
  - id: javascript-keyvault-application-credential-probing
    desc: Probes application authentication with enumerated vault secrets
    crit: suspicious
    all:
      - id: javascript-enumerated-secret-client-credential
      - id: metadata/import/npm/azure/keyvault-secrets
      - id: metadata/import/npm/azure/msal-node
