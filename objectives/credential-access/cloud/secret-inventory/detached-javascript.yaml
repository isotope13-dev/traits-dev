defaults:
  crit: hostile
  platforms: [unix, windows]
  for: [javascript]

composite_rules:
  # Require concealed detached execution and credential-file access.
  - id: detached-cloud-credential-collector
    desc: Obfuscated detached cloud credential collection
    conf: 0.95
    attack: T1552.001,T1526
    all:
      - id: micro-behaviors/process/create/spawn::daemon-guarded-detached-child
      - id: objectives/anti-static/obfuscation/obfuscator/js-obfuscator::javascript-obfuscator-string-array-runtime
      - id: micro-behaviors/fs/path/credential::developer-cloud-credential-path-cluster
      - id: micro-behaviors/fs/read/file/full::file-content-read-operation
    # Multiple credential-source observations may refer to one provider.
    needs: 2
    any:
      - id: micro-behaviors/os/env/cloud::aws-secret-access-key-env-read
      - id: micro-behaviors/communications/http/services/gcp::gcp-secretmanager-api
      - id: micro-behaviors/os/security/auth/cloud::node-aws-container-metadata-ip
      - id: micro-behaviors/communications/ip/literal::metadata-service-link-local-address
      - id: micro-behaviors/os/env/vcs::github-credentials-encoded
      - id: micro-behaviors/os/env/cloud::aws-secret-access-key-var-encoded
      - id: micro-behaviors/os/env/vcs::github-credentials
      - id: micro-behaviors/os/env/cloud::node-aws-secret-member
    unless:
      - id: metadata/package/testing/harness/runtime/

  # The Mini Shai-Hulud payload variant carries no credential-file paths: its
  # string-array-obfuscated daemon mints a GitHub Actions OIDC token, requests
  # an IMDSv2 session token, reads the Vault token and regex-scans for GitHub
  # and npm token formats. Each source is a legitimate SDK concern on its own;
  # a concealed, detached child probing three of them is credential harvest.
  - id: detached-ci-cloud-token-harvester
    desc: Obfuscated detached child harvests CI, cloud and registry tokens
    conf: 0.95
    attack: T1552.001,T1552.005,T1528
    all:
      - id: micro-behaviors/process/create/spawn::daemon-guarded-detached-child
      - id: objectives/anti-static/obfuscation/obfuscator/js-obfuscator::javascript-obfuscator-string-array-runtime
    needs: 3
    any:
      - id: micro-behaviors/os/env/ci-credentials::github-actions-oidc-token-request-env
      - id: micro-behaviors/communications/http/header/custom::aws-imds-token-header
      - id: micro-behaviors/os/env/service-api::vault-token-env-name
      - id: micro-behaviors/data/format/credentials::github-token-format-pattern
      - id: micro-behaviors/data/format/credentials::npm-token-format-pattern
    unless:
      - id: metadata/package/testing/harness/runtime/
