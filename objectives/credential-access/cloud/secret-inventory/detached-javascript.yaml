defaults:
  crit: hostile
  platforms: [unix, windows]
  for: [javascript]

composite_rules:
  # Require concealed detached execution and credential-file access.
  - id: detached-cloud-credential-collector
    desc: Obfuscated detached cloud credential collection
    conf: 0.95
    attack: T1552.001,T1526
    all:
      - id: micro-behaviors/process/create/spawn::daemon-guarded-detached-child
      - id: objectives/anti-static/obfuscation/obfuscator/js-obfuscator::javascript-obfuscator-string-array-runtime
      - id: micro-behaviors/fs/path/credential::developer-cloud-credential-path-cluster
      - id: micro-behaviors/fs/read/file/full::file-content-read-operation
    # Multiple credential-source observations may refer to one provider.
    needs: 2
    any:
      - id: micro-behaviors/os/env/cloud::aws-secret-access-key-env-read
      - id: objectives/credential-access/cloud/token/files::gcp-secretmanager-api
      - id: micro-behaviors/os/security/auth/cloud::node-aws-container-metadata-ip
      - id: micro-behaviors/communications/http/services/cloud::cloud-instance-metadata-link-local-host
      - id: micro-behaviors/os/env/vcs::github-credentials-encoded
      - id: micro-behaviors/os/env/cloud::aws-secret-access-key-var-encoded
      - id: micro-behaviors/os/env/vcs::github-credentials
      - id: micro-behaviors/os/env/cloud::node-aws-secret-member
    unless:
      - id: metadata/package/testing/harness/runtime/
