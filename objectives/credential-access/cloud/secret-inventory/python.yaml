defaults:
  conf: 0.95
  platforms: [unix, windows]
  for: [python]
  attack: T1552.005

traits:
  # These literals are API method names, not proof that a call occurs. They
  # acquire meaning only when multiple secret-inventory actions occur together.
  - id: list-secrets-method-name
    desc: ListSecrets API method name
    crit: notable
    if:
      type: literal
      exact: ListSecrets

  - id: get-secret-value-method-name
    desc: GetSecretValue API method name
    crit: notable
    if:
      type: literal
      exact: GetSecretValue

  - id: describe-parameters-method-name
    desc: DescribeParameters API method name
    crit: notable
    if:
      type: literal
      exact: DescribeParameters

  # Lifecycle-management names below mark the provider side of a secrets
  # manager: code that creates, stores, deletes, and restores secrets is a
  # management SDK, not an inventory-only reader. They acquire meaning the
  # same way the inventory names above do -- only as a set.
  - id: create-secret-method-name
    desc: CreateSecret API method name
    crit: notable
    if:
      type: literal
      exact: CreateSecret

  - id: put-secret-value-method-name
    desc: PutSecretValue API method name
    crit: notable
    if:
      type: literal
      exact: PutSecretValue

  - id: delete-secret-method-name
    desc: DeleteSecret API method name
    crit: notable
    if:
      type: literal
      exact: DeleteSecret

  - id: restore-secret-method-name
    desc: RestoreSecret API method name
    crit: notable
    if:
      type: literal
      exact: RestoreSecret

composite_rules:
  - id: secrets-manager-inventory-api
    desc: Cloud secret inventory API method set
    crit: suspicious
    needs: 2
    any:
      - id: list-secrets-method-name
      - id: get-secret-value-method-name
      - id: describe-parameters-method-name
    # Generated protobuf/OpenAPI clients define methods without invoking them.
    unless:
      - id: metadata/lang/generated::python-protobuf-generated
      - id: well-known/lib/cloud/api-codegen::cloud-sdk-api-model
      - id: well-known/tool/sysadmin/tccli::tccli-generated-service-client
      - id: well-known/lib/cloud/cloud-sdk::tencentcloud-python-sdk
      - id: objectives/credential-access/cloud/secret-inventory::secret-lifecycle-management-method-set

  # A module implementing the secret lifecycle (create, store, delete,
  # restore) is the secrets manager's own SDK surface: its list/describe/get
  # calls manage the operator's vault through an authenticated client, which
  # reverses the inventory reading rather than corroborating it.
  - id: secret-lifecycle-management-method-set
    desc: Secret lifecycle management API method set
    crit: exception
    conf: 0.97
    needs: 2
    any:
      - id: create-secret-method-name
      - id: put-secret-value-method-name
      - id: delete-secret-method-name
      - id: restore-secret-method-name
