defaults:
  conf: 0.95
  platforms: [unix, windows]
  for: [python]
  attack: T1552.005

composite_rules:
  - id: secrets-manager-inventory-api
    desc: Cloud secret inventory API method set
    crit: suspicious
    needs: 2
    any:
    - id: micro-behaviors/communications/http/services/aws::list-secrets-method-name
    - id: micro-behaviors/communications/http/services/aws::get-secret-value-method-name
    - id: micro-behaviors/communications/http/services/aws::describe-parameters-method-name
    unless:
    - id: metadata/lang/generated::python-protobuf-generated
    - id: well-known/lib/cloud/api-codegen::cloud-sdk-api-model
    - id: well-known/tool/sysadmin/tccli::tccli-generated-service-client
    - id: well-known/lib/cloud/cloud-sdk::tencentcloud-python-sdk
    - id: micro-behaviors/communications/http/services/aws::secret-lifecycle-management-method-set
