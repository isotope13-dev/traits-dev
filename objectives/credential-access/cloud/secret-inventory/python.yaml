defaults:
  platforms: [unix, windows]
  for: [python]
  attack: T1552.005

traits:
  # These literals are API method names, not proof that a call occurs. They
  # acquire meaning only when multiple secret-inventory actions occur together.
  - id: list-secrets-method-name
    desc: ListSecrets API method name
    crit: component
    conf: 0.95
    if:
      type: literal
      exact: ListSecrets

  - id: get-secret-value-method-name
    desc: GetSecretValue API method name
    crit: component
    conf: 0.95
    if:
      type: literal
      exact: GetSecretValue

  - id: describe-parameters-method-name
    desc: DescribeParameters API method name
    crit: component
    conf: 0.95
    if:
      type: literal
      exact: DescribeParameters

composite_rules:
  - id: secrets-manager-inventory-api
    desc: Cloud secret inventory API method set
    crit: suspicious
    conf: 0.95
    needs: 2
    any:
      - id: list-secrets-method-name
      - id: get-secret-value-method-name
      - id: describe-parameters-method-name
    # Generated protobuf/OpenAPI clients define methods without invoking them.
    unless:
      - id: metadata/lang/source::python-protobuf-generated
      - id: well-known/lib/cloud/api-codegen::cloud-sdk-api-model
      - id: well-known/tool/sysadmin/tccli::tccli-generated-service-client
