# Cross-service Azure Resource Manager (ARM) credential pillaging and non-Python
# Azure Key Vault bulk secret sweeps (Microsoft Threat Intelligence / Todyl,
# November 2026). Read-only CSPM auditors inspect resource configuration
# properties, and ordinary workloads access a single service; invoking three or
# more distinct ARM cleartext-secret operations or sweeping all subscription Key
# Vaults and reading secret values reflects automated cloud credential theft.
defaults:
  platforms: [unix, windows]
  for: [scripts, source, binaries]
  crit: hostile
  attack: T1552.005,T1528
  mbc: E1552

composite_rules:
  - id: azure-arm-multi-service-credential-pillage
    desc: Harvests credentials across multiple Azure ARM service types
    conf: 0.98
    all:
      - id: micro-behaviors/communications/http/services/azure::arm-management-host
      - id: micro-behaviors/communications/http/services/azure::arm-authenticated-client
    needs: 3
    any:
      - id: micro-behaviors/communications/http/services/azure::arm-list-keys-operation
      - id: micro-behaviors/communications/http/services/azure::arm-webapp-secrets-list-operation
      - id: micro-behaviors/communications/http/services/azure::arm-aks-cluster-credentials-operation
      - id: micro-behaviors/communications/http/services/azure::arm-ml-datastore-secrets-operation
      - id: micro-behaviors/communications/http/services/keyvault-azure::secret-list-path
    near_bytes: 131072
    unless:
      - id: micro-behaviors/communications/http/oauth::generated-api-model-field-context

  # Python Key Vault sweeps are covered by
  # objectives/credential-access/cloud/session::python-azure-keyvault-secret-sweep.
  - id: azure-keyvault-secret-sweep
    desc: Enumerates Azure Key Vaults and bulk-reads vault secrets
    conf: 0.97
    for: [scripts, source, binaries, -python]
    all:
      - id: micro-behaviors/communications/http/services/azure::arm-management-host
      - id: micro-behaviors/communications/http/services/keyvault-azure::vault-service-reference
      - id: micro-behaviors/communications/http/services/keyvault-azure::management-vault-list-path
      - id: micro-behaviors/communications/http/services/keyvault-azure::secret-list-path
      - id: micro-behaviors/communications/http/services/keyvault-azure::secret-value-access-reference
    near_bytes: 131072
    unless:
      - id: micro-behaviors/communications/http/oauth::generated-api-model-field-context
