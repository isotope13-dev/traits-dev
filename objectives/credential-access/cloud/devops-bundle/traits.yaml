defaults:
  platforms: [linux, macos, windows]
  for: [binaries, scripts]
  attack: T1552.001
composite_rules:
  - id: developer-credential-sweep
    desc: Developer/cloud credential path cluster
    crit: suspicious
    conf: 0.96
    mbc: E1552
    needs: 3
    any:
      - id: micro-behaviors/fs/path/sensitive/credentials::cloud-credentials
      - id: micro-behaviors/fs/path/sensitive/credentials::container-credentials
      - id: micro-behaviors/fs/path/sensitive/credentials::orchestration-credentials
    unless:
      - id: well-known/tool/detection/
      - id: well-known/lib/
      - id: well-known/app/ai/gateway/ollama::ollama-windows-signed-context
      - id: metadata/library/runtime::legitimate-kubernetes-incluster-client-marker
      - id: metadata/package/documentation/
      - id: metadata/package/testing/
      - id: metadata/package/config::sensitive-file-exclusion-list
    downgrade:
      any:
        - id: metadata/build/recognized-contexts::benign-build-tooling-context
