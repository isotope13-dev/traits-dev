# An explicit stolen/compromised password label is attack-context evidence,
# while the connector import and call establish that the label is used for a
# Snowflake login rather than appearing in prose or an unrelated test string.
defaults:
  platforms: [unix, windows]
  for: [python]
  attack: T1078.004

traits:
  - id: stolen-password-marker
    desc: Explicit stolen or compromised password marker
    crit: suspicious
    conf: 0.92
    if:
      type: literal
      regex: '(?i)\b(stolen|compromised)[_-]?password\b'

composite_rules:
  - id: snowflake-stolen-password-connect
    desc: Snowflake connection uses explicitly stolen credential
    crit: hostile
    conf: 0.99
    all:
      - id: micro-behaviors/data/db/snowflake::python-connector-import
      - id: micro-behaviors/data/db/snowflake::python-connect-call
      - id: stolen-password-marker
