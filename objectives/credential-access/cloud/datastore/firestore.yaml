# Unauthenticated Firestore REST harvest of wallet key material.
# Attackers pull firebaseConfig from frontend JS, then read documents over
# firestore.googleapis.com with no security rules — the class of exposure
# used to scrape private keys and mnemonics from open cloud databases.
defaults:
  platforms: [unix, windows]
  for: [python, javascript, typescript, go]
  attack: T1552.001,T1555
  mbc: E1552

traits:
  - id: quoted-private-key-field
    desc: Quoted private_key document field
    crit: component
    conf: 0.9
    if:
      type: text
      regex: '["'']private_key["'']'

  - id: quoted-mnemonic-field
    desc: Quoted mnemonic document field
    crit: component
    conf: 0.9
    if:
      type: text
      regex: '["'']mnemonic["'']'

composite_rules:
  - id: firestore-rest-private-key-harvest
    desc: Firestore REST API reads private-key fields
    crit: hostile
    conf: 0.97
    near_bytes: 4096
    all:
      - id: micro-behaviors/communications/http/services/firebase::firestore-rest-documents
      - id: quoted-private-key-field

  - id: firestore-rest-mnemonic-harvest
    desc: Firestore REST API reads mnemonic seed fields
    crit: hostile
    conf: 0.97
    near_bytes: 4096
    all:
      - id: micro-behaviors/communications/http/services/firebase::firestore-rest-documents
    any:
      - id: quoted-mnemonic-field
      - id: objectives/credential-access/wallet/mnemonic::seed-phrase-underscore
