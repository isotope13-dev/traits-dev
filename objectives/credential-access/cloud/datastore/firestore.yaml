# Unauthenticated Firestore REST harvest of wallet key material.
# Attackers pull firebaseConfig from frontend JS, then read documents over
# firestore.googleapis.com with no security rules — the class of exposure
# used to scrape private keys and mnemonics from open cloud databases.
defaults:
  platforms: [unix, windows]
  for: [python, javascript, typescript, go]
  attack: T1552.001,T1555
  mbc: E1552

traits:
  - id: json-service-account-type
    unless:
      - id: metadata/package/testing/corpus::inert-security-input-module
    desc: JSON service-account type field
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '["'']type["'']\s*:\s*["'']service_account["'']'

  - id: quoted-mnemonic-field
    desc: Quoted mnemonic document field
    crit: component
    conf: 0.9
    if:
      type: text
      regex: '["'']mnemonic["'']'

composite_rules:
  - id: firestore-rest-private-key-harvest
    for: [python, javascript]
    desc: Firestore REST API reads private-key fields
    crit: hostile
    conf: 0.97
    near_bytes: 4096
    all:
      - id: micro-behaviors/communications/http/services/firebase::firestore-rest-documents
      - id: micro-behaviors/data/parse/vocabulary::private-key-field-name

  - id: firestore-rest-mnemonic-harvest
    for: [python, javascript]
    desc: Firestore REST API reads mnemonic seed fields
    crit: hostile
    conf: 0.97
    near_bytes: 4096
    all:
      - id: micro-behaviors/communications/http/services/firebase::firestore-rest-documents
    any:
      - id: quoted-mnemonic-field
      - id: micro-behaviors/crypto/mnemonic::seed-phrase-underscore

  - id: python-embedded-service-account-key
    desc: Source embeds a service-account key
    crit: hostile
    conf: 0.98
    for: [python]
    attack: T1552.001
    near_lines: 12
    all:
      - id: micro-behaviors/crypto/asymmetric/key::pem-private-key-header
      - id: micro-behaviors/crypto/asymmetric/key::pem-private-key-body
      - id: micro-behaviors/crypto/asymmetric/key::pem-private-key-footer
      - id: micro-behaviors/data/parse/vocabulary::private-key-field-name
      - id: json-service-account-type
    unless:
      - id: metadata/package/testing/
      - id: "metadata/file/naming::test-directory-component"
