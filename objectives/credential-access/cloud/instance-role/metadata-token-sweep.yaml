# One script curling the instance-credential endpoints of two or more
# distinct clouds is a metadata credential sweep. Legitimate metadata
# clients target their own provider only; each leg below is exactly one
# provider's token/credential endpoint, so one provider cannot satisfy
# the threshold alone.
defaults:
  platforms: [unix, windows]
  for: [shell]
  crit: hostile
  conf: 0.96
  attack: T1552.005

composite_rules:
  - id: multi-provider-metadata-credential-sweep
    desc: Curl fetches instance credentials from multiple clouds
    near_lines: 10
    needs: 2
    all:
      - id: micro-behaviors/communications/http/curl::curl-command-call
      - id: micro-behaviors/communications/ip/literal::metadata-service-link-local-address
    any:
      - id: micro-behaviors/communications/http/services/aws::ec2-imds-iam-credentials-endpoint
      - id: micro-behaviors/communications/http/services/gcp::gcp-service-account-token-path
      - id: micro-behaviors/communications/http/services/azure::azure-managed-identity-token-path
