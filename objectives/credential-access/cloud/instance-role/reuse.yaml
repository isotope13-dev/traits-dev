# CloudTrail exposes a strong signal when instance-role credentials stolen
# from one operating system are replayed from another: Boto3's explicit
# credential-provider marker accompanies an OS token that disagrees with the
# instance's normal runtime.
defaults:
  platforms: [unix, windows]
  for: [json]
  attack: T1078.004,T1552.005

composite_rules:
  - id: aws-instance-role-credential-reuse
    desc: AWS instance-role credential reuse from OS mismatch
    crit: hostile
    conf: 0.995
    all:
      - id: micro-behaviors/communications/http/user-agent::boto3-cloudtrail-user-agent
      - id: micro-behaviors/communications/http/user-agent::boto3-cloudtrail-windows-os-marker
      - id: micro-behaviors/communications/http/user-agent::boto3-explicit-credentials-code
      - id: micro-behaviors/communications/http/user-agent::cloudtrail-assumed-role-session
    near_bytes: 4096
