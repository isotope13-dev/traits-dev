# A Python script that references the instance-credential endpoints of
# several clouds, can issue the HTTP requests, and also seals data with
# AES + RSA-OAEP before a POST is collecting cloud identity secrets for
# upload. Multi-cloud endpoint context alone is a neutral capability
# (workload-identity SDKs ship one provider per cloud); the hybrid
# encryption + POST leg supplies the exfiltration intent.
defaults:
  platforms: [unix, windows]
  for: [python]
  crit: hostile
  conf: 0.95
  attack: T1552.005,T1041

composite_rules:
  - id: multi-cloud-metadata-credentials-sealed-upload
    desc: Multi-cloud metadata credentials sealed with AES/RSA and posted
    all:
      - id: micro-behaviors/communications/http/services/cloud::multi-cloud-credential-endpoint-context
      - id: micro-behaviors/crypto/hybrid::python-aes-encryptor-rsa-oaep-cooccurrence
      - id: micro-behaviors/communications/http/request/verb::python-http-post-any
