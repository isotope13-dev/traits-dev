defaults:
  platforms: [unix, windows]
  for: [python]

composite_rules:
  - id: stealer-requests-managed-identity
    desc: Stealer requests managed identity tokens
    crit: hostile
    conf: 0.97
    attack: T1552.005
    # Ordinary identity SDKs also request tokens. The required credential
    # sweep and encoded upload supply theft context, independently of IOCs.
    all:
      - id: objectives/exfiltration/stealer::encoded-multi-developer-secret-exfil
      - id: micro-behaviors/communications/http/client/exchange::urllib-urlopen-call-symbol
    any:
      - id: micro-behaviors/communications/http/services/azure::python-managed-identity-request
      - id: micro-behaviors/communications/http/services/azure::python-app-service-identity-request
