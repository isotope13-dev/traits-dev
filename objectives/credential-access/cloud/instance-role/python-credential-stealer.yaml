defaults:
  platforms: [unix, windows]
  for: [python]

composite_rules:
  - id: python-azure-identity-request
    desc: Builds an Azure identity token request
    crit: component
    any:
      - id: micro-behaviors/communications/http/services/azure::python-managed-identity-request
      - id: micro-behaviors/communications/http/services/azure::python-app-service-identity-request

  - id: stealer-requests-managed-identity
    desc: Stealer requests managed identity tokens
    crit: hostile
    conf: 0.97
    attack: T1552.005
    scope: leaf
    # Ordinary SDK token requests need independent credential export context.
    all:
      - id: python-azure-identity-request
    any:
      - id: objectives/exfiltration/stealer/credential/developer::encoded-multi-developer-secret-exfil
      - id: objectives/exfiltration/stealer/credential/environment/current-process::python-env-sweep-concealed-upload
      - id: objectives/exfiltration/stealer/credential/environment/other-process::python-proc-secrets-encoded-upload
      - id: objectives/exfiltration/http/env::python-full-environment-callback-post
