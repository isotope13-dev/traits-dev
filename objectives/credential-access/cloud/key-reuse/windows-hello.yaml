# Abuse of a Windows Hello for Business user key from an already signed-in
# Windows session. The key remains hardware-bound; the observable behavior is
# resolving the user's Hello certificate/key through CNG and signing cloud
# authentication material with it.
defaults:
  platforms: [windows]
  for: [scripts, source, binaries]

composite_rules:
  - id: windows-hello-cng-cloud-key-signing
    desc: Signs cloud authentication data with Hello CNG key
    crit: hostile
    conf: 0.97
    all:
      - id: micro-behaviors/crypto/library/provider::ncrypt-open-key
      - id: micro-behaviors/crypto/library/provider::ncrypt-sign-hash
    any:
      - id: micro-behaviors/crypto/library/provider::passport-key-storage-provider
      - id: micro-behaviors/crypto/certificate/store::powershell-current-user-my-certificate-store
    near_bytes: 8192

  - id: windows-hello-webauthn-assertion
    desc: Uses Hello CNG key for WebAuthn assertion
    crit: hostile
    conf: 0.98
    all:
      - id: windows-hello-cng-cloud-key-signing
      - id: micro-behaviors/os/security/auth/passkey::webauthn-get-operation
      - id: micro-behaviors/os/security/auth/passkey::webauthn-assertion-response-fields
    near_bytes: 8192

  - id: windows-hello-prt-assertion
    desc: Uses Hello CNG key for PRT assertion
    crit: hostile
    conf: 0.98
    all:
      - id: windows-hello-cng-cloud-key-signing
      - id: micro-behaviors/communications/http/oauth::microsoft-oauth-token-endpoint
      - id: micro-behaviors/communications/http/oauth::microsoft-oauth-server-challenge-grant
    any:
      - id: micro-behaviors/communications/http/oauth::microsoft-ngc-jwt-use-claim
      - id: micro-behaviors/communications/http/oauth::microsoft-aza-ugs-scope
    near_bytes: 8192
