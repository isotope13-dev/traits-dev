defaults:
  platforms: [macos]
  for: [applescript, shell]
composite_rules:
  - id: applescript-keychain-copy-loop-profile
    desc: Keychain source list near file-copy command
    crit: suspicious
    conf: 0.95
    near_lines: 4
    all:
      - id: micro-behaviors/fs/path/password-store::applescript-keychain-source-list
      - id: micro-behaviors/fs/file/copy::cp-command-text
