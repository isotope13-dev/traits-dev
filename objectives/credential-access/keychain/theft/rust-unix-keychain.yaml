defaults:
  platforms: [unix]
  for: [rust, macho, elf]
  attack: T1041

composite_rules:
  - id: password-prompt-with-keychain-path
    desc: "Password prompt with login keychain path"
    crit: hostile
    conf: 0.97
    attack: T1056.002,T1555.001
    for: [macho]
    scope: file
    all:
      - id: micro-behaviors/ui/dialog/apple::compiled-osascript-password-prompt
      - id: micro-behaviors/fs/path/password-store::macos-login-keychain-db
