defaults:
  platforms: [macos]
  for: [macho]

composite_rules:
  - id: compatibility-phished-keychain
    desc: Password lure targets login keychain secrets
    crit: hostile
    conf: 0.96
    attack: T1555.001,T1056.002
    all:
      - id: objectives/credential-access/phishing/lure::compatibility-password-harvest
      - id: micro-behaviors/fs/path/password-store::macos-login-keychain
      - id: micro-behaviors/fs/path/password-store::chrome-safe-storage
      - id: micro-behaviors/crypto/kdf/algorithm::chrome-compatible-kdf-salt
