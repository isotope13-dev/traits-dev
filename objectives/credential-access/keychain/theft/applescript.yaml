defaults:
  platforms: [macos]
  for: [applescript]
  attack: T1555.003

composite_rules:
  # A browser migration may query Safe Storage. Access-partition changes,
  # keychain unlocking, password validation and credential staging supply the
  # theft context; the call atom binds the service name to shell execution.
  - id: chrome-keychain-staging
    desc: Chrome keychain extraction with credential staging
    crit: hostile
    conf: 0.97
    all:
      - id: micro-behaviors/os/security/keychain::applescript-chrome-safe-storage-call
      - id: micro-behaviors/os/security/keychain::safe-storage-command-reference
      - id: micro-behaviors/os/security/keychain::generic-password-partition-list-command
      - id: micro-behaviors/os/security/keychain::macos-keychain-unlock-command
      - id: micro-behaviors/fs/path/password-store::macos-login-keychain-db
      - id: objectives/credential-access/validation/check::dscl-authonly-comp
      - id: objectives/collection/archive/stage::tmp-infostealer-layout
