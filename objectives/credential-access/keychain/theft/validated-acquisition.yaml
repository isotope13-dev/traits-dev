defaults:
  platforms: [macos]
  for: [applescript, shell, javascript, typescript, python]

traits:
  # Require both the sensitive helper argument and the helper's cat-copy
  # scaffold. This is bounded source evidence, not interprocedural flow proof.
  - id: applescript-keychain-db-readwrite-call
    desc: Keychain DB call with file-copy helper
    crit: suspicious
    conf: 0.94
    if:
      type: yara
      source: |
        rule applescript_keychain_copy_helper {
          strings:
            $source = /\breadwrite\([^\r\n]{0,120}Keychains\/login\.keychain-db/
            $helper = /on readwrite\([^\r\n]{1,100}\)[\s\S]{0,500}do shell script "cat " & quoted form/
          condition:
            $source and $helper
        }

composite_rules:
  - id: keychain-db-acquisition-reference
    desc: Keychain copy command or readwrite argument
    crit: suspicious
    conf: 0.95
    any:
      - id: keychain-directory-copy-to-tmp
      - id: applescript-keychain-db-readwrite-call

  # Require acquisition evidence, rather than treating a store pathname and
  # a temporary ZIP as proof of theft. The phish and source are separate roles.
  - id: phished-keychain-db-acquisition
    desc: Password phish with Keychain DB acquisition
    crit: hostile
    conf: 0.97
    attack: T1056.002,T1555.001
    all:
      - id: objectives/credential-access/phishing/lure::applescript-credential-phish-hostile
      - id: keychain-db-acquisition-reference
