defaults:
  platforms: [macos]
  for: [applescript, shell, javascript, typescript]

traits:
  - id: keychain-directory-copy-to-tmp
    desc: Copies Keychain directory files into /tmp
    crit: suspicious
    conf: 0.95
    attack: T1555.001
    if:
      type: text
      regex: '\bcp\s+[^\r\n]{0,100}/Library/Keychains/[^\r\n]{1,100}\s+/tmp/'
