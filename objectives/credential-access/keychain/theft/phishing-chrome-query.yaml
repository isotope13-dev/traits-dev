defaults:
  platforms: [macos]
  for: [applescript, shell, macho]
composite_rules:
  # The named query is a separate acquisition mechanism from copying a
  # Keychain database. Require validated hidden-input credential phishing;
  # a standalone lookup or an ordinary password dialog does not qualify.
  - id: password-phishing-chrome-keychain-query
    desc: Validated password phishing with Chrome Keychain query
    crit: hostile
    conf: 0.97
    attack: T1555.001,T1056.002
    all:
      - id: objectives/credential-access/phishing/lure::applescript-credential-phish-hostile
      - id: micro-behaviors/os/security/keychain::chrome-generic-password-query
