defaults:
  platforms: [macos]
  for: [applescript, shell, macho]

composite_rules:
  # The validated credential phish supplies the attack context. Store and
  # read observations are independent roles; this does not bind the store to
  # a particular read, prove copying, or claim successful secret decryption.
  # Unlike the named readwrite-helper rule, this also covers renamed handlers
  # carried in a decoded native command.
  - id: password-phishing-keychain-store-read-profile
    desc: Password phishing with Keychain DB and reads
    crit: hostile
    conf: 0.96
    attack: T1555.001,T1056.002
    all:
      - id: objectives/credential-access/phishing/lure::applescript-credential-phish-hostile
      - id: micro-behaviors/fs/path/password-store::macos-keychain-db-reference
      - id: micro-behaviors/fs/read/file/handle::applescript-read-result-assignment
