defaults:
  platforms: [linux, unix, macos, android, ios, windows]
  crit: suspicious
  conf: 0.9
  attack: T1555.001
  for: [shell, applescript, macho, python]
composite_rules:
  # MacSync (and any stealer copying it) rewrites a keychain item's
  # partition-list so apple/apple-tool/teamid-signed callers read the browser
  # Safe Storage secret without a prompt. The command paired with a named
  # browser Safe Storage service is the keychain-ACL bypass, not maintenance.
  - id: keychain-partition-list-browser-secret-bypass
    desc: Keychain ACL rewritten to expose browser Safe Storage secret
    crit: hostile
    conf: 0.95
    attack: T1555.001,T1555.003
    platforms: [macos]
    for: [scripts, source, macho]
    all:
      - id: micro-behaviors/os/security/keychain::generic-password-partition-list-command
      - id: micro-behaviors/os/security/keychain::partition-list-teamid-grant
      - id: micro-behaviors/fs/path/password-store::chromium-safe-storage-service-name
  - id: source-browser-keychain-exfil
    desc: Source uploads browser keychain material
    crit: hostile
    conf: 0.97
    attack: T1555.001,T1555.003,T1041
    platforms: [macos]
    for: [elixir]
    scope: file
    all:
      - id: micro-behaviors/fs/path/password-store::chromium-safe-storage-service-name
      - id: micro-behaviors/os/security/keychain::macos-keychain-generic-password-command-reference
      - id: micro-behaviors/communications/http/post::elixir-httpc-post
  # The walk has to be rooted at the keychain store. Without proximity this
  # was "the word Keychains appears somewhere" AND "os.walk appears
  # somewhere", which two unrelated files pooled into one analysis unit
  # satisfy trivially -- radare2's macOS code-signing documentation names the
  # Keychain Access "Keychains" pane, and its clang-format helper walks a
  # source tree, 34 MB apart in the same installer payload.
  - id: keychain-theft
    for: [python]
    desc: Filesystem walk over the macOS Keychain store
    near_lines: 30
    unless:
      - id: well-known/tool/detection/clawseccheck::defensive-scanner-archive-context
    all:
      - id: micro-behaviors/fs/path/password-store::keychain-data
      - id: micro-behaviors/fs/directory/traverse::traverse-walk
  - id: keychain-db-validated-prompt
    desc: Keychain DB with validated password prompt
    crit: suspicious
    conf: 0.95
    all:
      - id: micro-behaviors/fs/path/password-store::macos-keychain-db-reference
      - id: micro-behaviors/os/security/auth/verify::dscl-password-verification
    any:
      - id: micro-behaviors/ui/dialog/apple::hidden-answer
      - id: micro-behaviors/ui/dialog/prompt::password-prompt-pattern
  # A database reference, authentication check and staging clue do not prove
  # that the database or the prompted password is copied or transmitted.
  # Keep this co-occurrence signal; actual secret-store copies and export are
  # detected separately, including Python carriers of the same AppleScript.
  - id: keychain-db-validated-prompt-staging
    desc: Keychain DB, validated prompt and staging
    crit: suspicious
    conf: 0.96
    platforms: [macos]
    all:
      - id: keychain-db-validated-prompt
    any:
      - id: objectives/collection/archive/stage::applescript-staging-layout
      - id: objectives/exfiltration/http/upload::applescript-buildid-databinary-exfil
      - id: micro-behaviors/fs/path/archive::unix-temp-archive-path

  # Password laundering: phish the login password behind a native-looking
  # prompt, confirm it really authenticates against the local directory
  # service, then spend it on the keychain and on root.
  #
  # `dscl -authonly` is the tell. Software that legitimately needs the user's
  # password asks the OS to do the work — Authorization Services, a signed
  # installer package, `security -i`, or an askpass helper that hands the
  # secret straight to sudo. None of them verify the password themselves
  # first, because none of them care whether it is correct: the privileged
  # call either succeeds or it doesn't. Pre-validating only makes sense when
  # the point is to keep the victim in a retry loop until a password worth
  # keeping is captured, and to avoid exfiltrating a typo.
  - id: validated-phished-password-privileged-replay
    desc: Validated phished password replayed to a privileged command
    crit: hostile
    conf: 0.95
    attack: T1555.001,T1110.001,T1548.004
    mbc: E1110
    for: [scripts, source, macho]
    platforms: [macos]
    all:
      - id: micro-behaviors/os/security/auth/verify::dscl-password-verification
      - id: micro-behaviors/ui/dialog/prompt::password-prompt-pattern
    any:
      - id: micro-behaviors/os/security/keychain::macos-keychain-unlock-command
      - id: micro-behaviors/process/create/sudo::sudo-password-on-stdin
      - id: objectives/persistence/system/launchd/submit::sudo-pipe-launchdaemon
    # Prefer the more specific login-keychain theft verdict when it is present.
    unless:
      - id: keychain-db-validated-prompt

  # A native binary that queries the login keychain through the `security`
  # Require the keychain query, broad secret-store targeting, authentication
  # verification, AppleScript execution, and recursive-copy API references.
  # This is a co-occurrence signature for a collector; it does not bind the
  # dialog result to dscl or prove decryption or export of every named store.
  - id: native-secret-store-harvest
    desc: Keychain query with browser and wallet collection
    crit: hostile
    conf: 0.95
    platforms: [macos]
    for: [macho]
    attack: T1555.001,T1555.003
    all:
      - id: micro-behaviors/os/security/keychain::security-cli-keychain-password-query
      - id: micro-behaviors/fs/path/password-store::macos-keychain-db-reference
      - id: micro-behaviors/fs/path/password-store::chrome-safe-storage
      - id: micro-behaviors/os/application/target::multiple-desktop-wallet-references
      - id: micro-behaviors/os/security/auth/verify::dscl-authonly
      - id: micro-behaviors/process/create/script/osascript::osascript-exec
      - id: micro-behaviors/fs/directory/traverse::cpp-recursive-copy-scaffold
