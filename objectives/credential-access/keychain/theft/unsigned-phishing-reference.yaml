defaults:
  for: [macho]
  platforms: [macos]
  attack: T1555.001,T1056.002
composite_rules:
  # Signature, dialog and keychain evidence need not share a call path.
  - id: unsigned-keychain-password-phishing-indicators
    desc: Unsigned Mach-O with keychain and phishing clues
    crit: suspicious
    conf: 0.88
    all:
      - id: objectives/credential-access/phishing/lure::password-phishing-comp
      - id: metadata/signature/absent::unsigned-macho
    any:
      - id: micro-behaviors/os/security/keychain::seckeychain-find-generic-password-api
      - id: metadata/binary/symbols/name/qualified/collection::go-chainbreaker-generic-password-dump-reference
  - id: adhoc-keychain-password-phishing-indicators
    desc: Ad-hoc Mach-O with keychain and phishing clues
    crit: suspicious
    conf: 0.88
    all:
      - id: objectives/credential-access/phishing/lure::password-phishing-comp
      - id: metadata/signature/ad-hoc::adhoc
    any:
      - id: micro-behaviors/os/security/keychain::seckeychain-find-generic-password-api
      - id: metadata/binary/symbols/name/qualified/collection::go-chainbreaker-generic-password-dump-reference
