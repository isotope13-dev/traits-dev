# Packaging recipes build and install software; none needs the key that
# decrypts a browser's saved passwords and cookies. The existence test is the
# host-specific marker that keeps the read dormant on build machines; an
# ungated read stays with the notable controls.
defaults:
  for: [ruby]
  platforms: [macos]

composite_rules:
  - id: formula-gated-browser-safe-storage-read
    desc: Marker-gated formula reads Safe Storage key
    crit: hostile
    conf: 0.97
    attack: T1555.001,T1195.002
    all:
      - id: metadata/package/manager::homebrew-formula-class
      - id: micro-behaviors/os/security/keychain::ruby-security-password-print-command
      - id: micro-behaviors/os/security/keychain::chrome-safe-storage-service-literal
      - id: micro-behaviors/fs/file/stat::ruby-file-exists
