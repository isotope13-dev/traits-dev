# Secret Service's unfiltered item iterator, with secret extraction from that
# same loop item. Reading one selected application credential does not qualify.
# The decode wrapper is optional in practice; both observed source forms are
# represented below. No campaign names, output filenames or endpoints gate it.
defaults:
  platforms: [linux]
  for: [python]
  crit: suspicious
  conf: 0.96
  attack: T1555

traits:
  - id: secret-service-bulk-secret-records
    desc: Collects secrets from every keyring item
    if:
      type: tree-sitter
      language: python
      query: |
        ((for_statement
          left: (identifier) @item
          right: (call
            function: (attribute attribute: (identifier) @enumerate))
          body: (block
            (expression_statement
              (call
                function: (attribute attribute: (identifier) @append)
                arguments: (argument_list
                  (dictionary
                    (pair value: (call
                      function: (attribute
                        object: (call
                          function: (attribute object: (identifier) @read_item
                            attribute: (identifier) @secret))
                        attribute: (identifier) @decode)))))))))
          (#eq? @enumerate "get_all_items")
          (#eq? @append "append")
          (#eq? @item @read_item)
          (#eq? @secret "get_secret")
          (#eq? @decode "decode"))
        ((for_statement
          left: (identifier) @item
          right: (call
            function: (attribute attribute: (identifier) @enumerate))
          body: (block
            (expression_statement
              (call
                function: (attribute attribute: (identifier) @append)
                arguments: (argument_list
                  (dictionary
                    (pair value: (call
                      function: (attribute object: (identifier) @read_item
                        attribute: (identifier) @secret)))))))))
          (#eq? @enumerate "get_all_items")
          (#eq? @append "append")
          (#eq? @item @read_item)
          (#eq? @secret "get_secret"))
