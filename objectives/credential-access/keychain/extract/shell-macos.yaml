defaults:
  platforms: [unix]
  for: [shell]
  attack: T1555.001

composite_rules:
  - id: shell-keychain-dump-with-secret-queries
    desc: "Keychain dump with additional secret queries"
    crit: hostile
    conf: 0.98
    all:
      - id: objectives/credential-access/keychain/extract::shell-keychain-dump-command
    any:
      - id: objectives/credential-access/keychain/extract::shell-keychain-password-queries
      - id: objectives/credential-access/theft/multi-store::shell-macos-ssh-browser-secrets
    needs: 1
