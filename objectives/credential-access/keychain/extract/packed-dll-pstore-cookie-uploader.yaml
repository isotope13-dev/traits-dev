# Protected Storage is where Internet Explorer and Outlook kept saved
# passwords before Windows Vista. A UPX-packed DLL that instantiates the
# PStore COM object, names the Shell Folders registry path used to find the
# Cookies directory, presents an MSIE user agent and uploads with multipart
# POST is a credential and cookie stealer, not a browser add-in.
defaults:
  platforms: [windows]
  for: [pe, dll]
  attack: T1555.003,T1539,T1041
composite_rules:
  - id: packed-dll-pstore-cookie-folder-multipart-uploader
    desc: Packed DLL reading PStore and cookies then uploading
    crit: hostile
    conf: 0.88
    all:
      - id: metadata/binary/section/label::upx-section-pair
      - id: micro-behaviors/os/security/protected-storage::pstore-create-instance-reference
      - id: micro-behaviors/os/registry/keys/path::explorer-shell-folders-regpath
      - id: micro-behaviors/communications/http/upload::multipart-form-data-upload
      - id: micro-behaviors/communications/http/user-agent::msie-compatible-mozilla4-ua
    unless:
      - id: metadata/signed/platform/
