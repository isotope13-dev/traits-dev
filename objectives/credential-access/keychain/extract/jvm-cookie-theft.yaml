defaults:
  platforms:
  - macos
composite_rules:
- id: jvm-safe-storage-query-with-cookie-theft
  desc: Safe Storage query with bound cookie export
  crit: hostile
  conf: 0.98
  for:
  - kotlin
  scope: file
  attack: T1555.001,T1539,T1041
  all:
  - id: micro-behaviors/os/security/keychain::macos-keychain-generic-password-command-reference
  - id: micro-behaviors/fs/path/password-store::chromium-safe-storage-service-name
  - id: objectives/exfiltration/stealer/application-state/cookie::kotlin-browser-cookie-http-exfil
  - id: micro-behaviors/process/create/subprocess::java-processbuilder-start-source
