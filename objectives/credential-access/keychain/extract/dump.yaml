defaults:
  attack: T1555.001
  mbc: T1555.001
  platforms:
    - macos
    - ios
  for:
    - shell
    - python
    - javascript
    - typescript
    - applescript
    - lua
    - ruby
  crit: suspicious
traits:
  - id: find-generic-password
    desc: Invokes macOS Keychain generic-password lookup
    crit: notable
    conf: 0.8
    for:
      - javascript
    if:
      type: tree-sitter
      kind: call
      regex: '_runNative\([\s\S]{0,400}find-generic-password'
    unless:
      - id: well-known/tool/detection/security-scanner/
      - id: metadata/package/quality/benign-context::benign-trojanized-fp-context
      - id: well-known/app/ai/agent-runtime/bobi/
      - id: metadata/package/testing/
  - id: python-find-generic-password
    desc: Python reads a named macOS Keychain item
    crit: notable
    conf: 0.9
    for: [python]
    if:
      type: tree-sitter
      kind: call
      regex: 'subprocess\.run\([\s\S]{0,260}find-generic-password'
    unless:
      - id: well-known/tool/detection/security-scanner/
      - id: metadata/package/quality/benign-context::benign-trojanized-fp-context
      - id: well-known/app/ai/agent-runtime/bobi/
      - id: well-known/app/development/specterqa-ios::specterqa-ios-context
      - type: text
        substr: "[REDACTED]"
  - id: find-internet-password
    desc: Find internet password via security utility
    for: [javascript, typescript]
    conf: 0.8
    if:
      type: symbol
      kind: call
      exact: exec.quiet
      arg:
        kind: string
        exact: security find-internet-password -s github.com -w
    unless:
      - id: well-known/tool/detection/security-scanner/
      - id: well-known/lib/format/cadence::update-tool-context
  - id: export-keychain
    desc: "Export items keychain via security utility"
    conf: 0.8
    if:
      type: string_literal
      substr: security export
    unless:
      - id: well-known/tool/detection/security-scanner/
    # A documentation page demonstrating the command is not a program running
    # it: App Store Connect CLI's `commands/certificates.mdx` walks through
    # Apple's own procedure for moving a signing identity between machines,
    # and because `.mdx` parses as JavaScript its fenced block lands in the
    # literal index. Downgraded rather than suppressed — an agent-instruction
    # markdown file that tells a coding assistant to export the keychain is
    # worth surfacing, just not as a credential-theft technique.
    downgrade:
      any:
        - id: metadata/file/extension/identity::markdown-file-basename
