defaults:
  attack: T1555.001
  platforms:
    - macos
    - ios
  for:
    - shell
    - python
    - javascript
    - typescript
    - applescript
    - lua
    - ruby
  crit: suspicious
traits:
  # Plain dump-keychain enumerates attributes; -d requests secret decryption.
  # Require that flag on the command redirected to a non-null output.
  - id: whole-keychain-dump-to-file
    desc: Writes decrypted macOS Keychain dump
    crit: suspicious
    conf: 0.98
    platforms: [macos]
    for: [shell]
    if:
      type: tree-sitter
      language: bash
      query: |
        ((redirected_statement
           body: (command
             name: (command_name (word) @command)
             (word) @subcommand
             (word) @decrypt)
           redirect: (file_redirect
             [">" ">>"]
             destination: (_) @destination))
         (#eq? @command "security")
         (#eq? @subcommand "dump-keychain")
         (#eq? @decrypt "-d")
         (#not-match? @destination "^/dev/null$"))

  - id: python-decrypted-keychain-dump
    desc: Python Keychain secret-decryption command
    crit: suspicious
    conf: 0.94
    platforms: [macos]
    for: [python]
    if:
      type: tree-sitter
      language: python
      query: |
        ((list
           (string) @executable
           (string) @subcommand
           (string) @decrypt)
         (#match? @executable "^.(/usr/bin/)?security.$")
         (#match? @subcommand "^.dump-keychain.$")
         (#match? @decrypt "^.-d.$"))

  - id: find-generic-password
    desc: Invokes macOS Keychain generic-password lookup
    crit: notable
    conf: 0.8
    for:
      - javascript
    if:
      type: tree-sitter
      kind: call
      regex: '_runNative\([\s\S]{0,400}find-generic-password'
    unless:
      - id: well-known/tool/detection/security-scanner/
      - id: metadata/build/recognized-contexts::benign-trojanized-fp-context
      - id: well-known/app/ai/agent-runtime/bobi/
      - id: metadata/package/testing/
      - id: "metadata/file/naming::test-directory-component"
  - id: find-internet-password
    desc: Find internet password via security utility
    for: [javascript, typescript]
    conf: 0.8
    if:
      type: symbol
      kind: call
      exact: exec.quiet
      arg:
        kind: string
        exact: security find-internet-password -s github.com -w
    unless:
      - id: well-known/tool/detection/security-scanner/
      - id: well-known/lib/format/cadence::update-tool-context
  - id: export-keychain
    desc: "Export items keychain via security utility"
    conf: 0.8
    if:
      type: string_literal
      regex: '(?i)(^|\s|[;&|])security\s+export\b'
    unless:
      - id: well-known/tool/detection/security-scanner/
      - id: metadata/package/testing/
    # A documentation page demonstrating the command is not a program running
    # it: App Store Connect CLI's `commands/certificates.mdx` walks through
    # Apple's own procedure for moving a signing identity between machines,
    # and because `.mdx` parses as JavaScript its fenced block lands in the
    # literal index. Downgraded rather than suppressed — an agent-instruction
    # markdown file that tells a coding assistant to export the keychain is
    # worth surfacing, just not as a credential-theft technique.
      - id: "metadata/file/naming::test-directory-component"
    downgrade:
      any:
        - id: metadata/file/extension/identity::markdown-file-basename
