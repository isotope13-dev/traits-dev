# Native code that parses and decrypts a macOS keychain database itself
# (the chainbreaker approach) rather than asking securityd for one item.
#
# A macOS C++ stealer (2026-11, e8b7503f40fb) kept mangled routine names such
# as `8KeychainParser15decrypt_db_blob`, `22decrypt_symmetric_keys`,
# `21all_generic_passwords`, and `22all_internet_passwords`, and named the
# routines that drive the keychain password dialog through Accessibility
# (`handleKeychainDialog`, `waitForPasswordField`).
defaults:
  platforms: [macos]
  for: [macho]
  attack: T1555.001
traits:
  - id: keychain-db-decrypt-routine-name
    desc: Routine named for decrypting keychain records
    crit: suspicious
    conf: 0.85
    if:
      type: text
      regex: '(?i)(^|[^a-z])(decrypt_(db_blob|symmetric_keys)|all_(generic|internet)_passwords)'
  - id: keychain-dialog-automation-routine-name
    desc: Routine named for driving keychain dialog
    crit: suspicious
    conf: 0.85
    if:
      type: text
      regex: '(?i)(handle|dismiss|click|bypass)_?keychain_?(dialog|prompt)|wait_?for_?password_?field'
composite_rules:
  # Offline record decryption of the user's keychain file, joined to prompt
  # suppression or automated answering of the keychain dialog, removes the
  # user from the only consent step guarding those secrets.
  - id: native-keychain-db-decryption-without-consent
    desc: Decrypts keychain database while suppressing consent
    crit: hostile
    conf: 0.95
    all:
      - id: keychain-db-decrypt-routine-name
      - id: micro-behaviors/fs/path/password-store::macos-keychain-db-reference
    any:
      - id: keychain-dialog-automation-routine-name
      - id: micro-behaviors/os/security/keychain::seckeychain-user-interaction-toggle
      - id: micro-behaviors/os/security/keychain::secitem-no-auth-ui
