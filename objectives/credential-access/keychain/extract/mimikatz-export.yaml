defaults:
  for: [powershell]
  platforms: [windows]
  crit: hostile
  conf: 0.99
  attack: T1552.004

composite_rules:
  - id: powershell-protected-certificate-export
    desc: Loads code to bypass private-key export protections
    all:
      - id: well-known/tool/offensive/mimikatz::certificate-export-command-literal
      - id: well-known/tool/offensive/mimikatz::certificate-export-protection-patch-commands
      - id: micro-behaviors/dylib/load/runtime::powershell-memory-library-loader-call
