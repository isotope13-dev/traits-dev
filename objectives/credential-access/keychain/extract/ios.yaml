defaults:
  platforms: [unix, windows]
  for: [scripts, source]
  attack: T1555.001

traits:
  - id: network-agent-keychain-extract-command
    desc: Network agent extracts device keychain
    crit: suspicious
    conf: 0.96
    if:
      type: text
      regex: '(?m)^\s*(sudo\s+)?\S+\s+agent\s+keychain\s+-i\s+\S+\s+-o\s+\S+'

composite_rules:
  - id: network-agent-keychain-filesystem-extraction
    desc: Network agent extracts keychain and filesystem
    crit: suspicious
    conf: 0.98
    all:
      - id: network-agent-keychain-extract-command
      - id: objectives/collection/archive/create::network-agent-filesystem-archive-command
