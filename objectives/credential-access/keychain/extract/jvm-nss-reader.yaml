defaults:
  platforms: [windows]
  for: [class]
composite_rules:
  - id: jvm-nss-json-secret-reader
    desc: JVM NSS secret decoding with JSON and file copying
    crit: suspicious
    conf: 0.96
    # Authorized password migration remains plausible. This supplies the
    # source role to a collector rule; it is not hostile by itself.
    all:
      - id: micro-behaviors/crypto/decrypt::nss-secret-decrypt-reference
      - id: metadata/import/jvm::java-base64-decoder-class
      - id: micro-behaviors/data/format/json::gson-jsonobject-add-property
      - id: micro-behaviors/fs/file/copy::java-files-copy
