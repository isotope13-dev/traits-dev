defaults:
  platforms: [windows]
  for: [pe, dll]
  attack: T1555
  mbc: B0028

traits:
composite_rules:
  - id: pstore-category-sweep
    desc: Enumerates Protected Storage credential categories
    crit: suspicious
    conf: 0.9
    all:
      - id: micro-behaviors/os/security/protected-storage::pstore-category-inetcomm-passwords
    any:
      - id: micro-behaviors/os/security/protected-storage::pstore-category-internet-explorer
      - id: micro-behaviors/os/security/protected-storage::pstore-category-identification
    needs: 1
    unless:
      - id: well-known/tool/sysadmin/nirsoft/
      - id: well-known/lib/platform/wine/

  - id: pstore-password-report-acquisition
    desc: PStore credential-report formats in an autorun self-copy worm
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/os/security/protected-storage::pstore-factory-reference
      # Password-recovery utilities also use PStore and format credentials.
      # Require independent propagation abuse before grading acquisition
      # as hostile; API/report co-occurrence alone is insufficient.
      - id: objectives/lateral-movement/usb-worm/autorun::compiled-linewise-autorun-self-copy-worm
    any:
      - id: micro-behaviors/data/format/credentials::pstore-pass-sites-report-label
      - id: micro-behaviors/data/format/credentials::pstore-autocomplete-password-report-label
      - id: micro-behaviors/data/format/credentials::username-password-report-format
    needs: 2
    unless:
      - id: well-known/lib/platform/wine/
      - id: well-known/app/utility/siw::siw-family-identity
      - id: well-known/tool/sysadmin/sandboxie/
      - id: metadata/file/profile/source-indications/
