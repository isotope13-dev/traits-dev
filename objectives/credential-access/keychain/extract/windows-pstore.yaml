defaults:
  platforms: [windows]
  for: [pe, dll]
  attack: T1555
  mbc: B0028

traits:
composite_rules:
  - id: pstore-password-report-acquisition
    desc: Autorun worm with PStore reads and reports
    crit: hostile
    conf: 0.98
    all:
      # A factory name and report labels do not evidence acquisition alone.
      # Require the enumeration and ReadItem ABI, including the factory.
      - id: micro-behaviors/os/security/protected-storage::x86-pstore-enumerate-read-wrappers
      # Password-recovery utilities also use PStore and format credentials.
      # Require three report formats plus either native worm implementation,
      # or both propagation implementations plus at least two report formats.
      # This keeps API/report co-occurrence alone below hostile criticality.
    any:
      - id: micro-behaviors/data/format/credentials::pstore-pass-sites-report-label
      - id: micro-behaviors/data/format/credentials::pstore-autocomplete-password-report-label
      - id: micro-behaviors/data/format/credentials::username-password-report-format
      - id: objectives/lateral-movement/usb-worm/autorun::compiled-linewise-autorun-self-copy-worm
      - id: objectives/lateral-movement/usb-worm/autorun::compiled-stream-autorun-self-copy-worm
    needs: 4
    unless:
      - id: well-known/lib/platform/wine/
      - id: well-known/app/utility/siw::siw-family-identity
      - id: well-known/tool/sysadmin/sandboxie/
      - id: metadata/file/profile/source-indications/
