# QQ session hijack (common in Chinese Gh0st forks): ask the local QQ client
# for logged-in UINs and a client key, convert it via ptlogin /jump into web
# cookies, then use them for QQ group or friend APIs. Tencent's web login JS
# carries the same endpoints, so JavaScript is out of scope.
defaults:
  crit: hostile
  platforms: [windows]
  for: [pe, dll, python, powershell]
  attack: T1539,T1550.004

composite_rules:
  - id: qq-client-key-web-session-hijack
    desc: Mints QQ web session from local client key and reuses it
    conf: 0.95
    near_bytes: 4096
    all:
      - id: micro-behaviors/communications/http/services/tencent::ptlogin-client-key-request
      - id: micro-behaviors/communications/http/services/tencent::ptlogin-jump-client-key
    any:
      - id: micro-behaviors/communications/http/services/tencent::ptlogin-account-list-request
      - id: micro-behaviors/communications/http/services/tencent::qun-manager-member-api
    needs: 1
