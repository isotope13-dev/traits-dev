# WhatsApp Web's encrypted IndexedDB stores contain live device/session
# material.  A script that reads those stores and decrypts their key records
# is credential access even when it is packaged as an extension.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, crx, xpi]
  attack: T1539

traits:
  - id: whatsapp-web-store-target
    desc: Targets WhatsApp Web session storage
    crit: suspicious
    conf: 0.97
    for: [javascript, typescript]
    if:
      type: text
      regex: '\b(openDb|indexedDB\.open)\s*\(\s*["'']wawc_db_enc["'']'

  - id: whatsapp-signal-store-target
    desc: Targets WhatsApp Signal session storage
    crit: suspicious
    conf: 0.97
    for: [javascript, typescript]
    if:
      type: text
      regex: '\b(openDb|openDatabase)\s*\(\s*["'']signal-storage["'']'

  - id: noise-key-field
    desc: Reads WhatsApp Noise key material
    crit: notable
    conf: 0.98
    for: [javascript, typescript]
    if:
      type: text
      regex: '\b(WANoiseInfo|noise\.(privKey|pubKey))\b'

  - id: identity-key-field
    desc: Reads WhatsApp Signal identity keys
    crit: notable
    conf: 0.98
    for: [javascript, typescript]
    if:
      type: text
      regex: '\bsignal_static_(priv|pub)key\b'

  - id: signed-prekey-store
    desc: Reads WhatsApp signed prekeys
    crit: notable
    conf: 0.98
    for: [javascript, typescript]
    if:
      type: text
      regex: '\bsigned-prekey-store\b|\bkeyPair\.(privKey|pubKey)\b'

  - id: registration-id-field
    desc: WhatsApp registration ID field
    crit: notable
    conf: 0.98
    for: [javascript, typescript]
    # CDP and service-worker typings use the same property name for a
    # registration handle. That file is not a WhatsApp session store.
    unless:
      - id: metadata/lang/scripted::dts-declaration-file
      - type: text
        substr: ServiceWorker.RegistrationID
    if:
      type: text
      word: registrationId

  - id: registration-store-id-field
    desc: Reads WhatsApp registration store ID
    crit: notable
    conf: 0.98
    for: [javascript, typescript]
    if:
      type: text
      word: signal_reg_id

  - id: me-jid-field
    desc: WhatsApp account JID field
    crit: notable
    conf: 0.98
    for: [javascript, typescript]
    if:
      type: text
      regex: '\b(last-wid-md|WALid)\b'

composite_rules:
  - id: whatsapp-session-key-fields
    desc: WhatsApp device session key fields
    crit: component
    conf: 0.98
    for: [javascript, typescript]
    any:
      - id: noise-key-field
      - id: identity-key-field
      - id: signed-prekey-store

  - id: whatsapp-session-device-fields
    desc: WhatsApp session device identifiers
    crit: component
    conf: 0.98
    for: [javascript, typescript]
    any:
      - id: registration-id-field
      - id: registration-store-id-field
      - id: me-jid-field

  - id: whatsapp-web-session-material-theft
    for: [javascript]
    desc: Extracts and decrypts WhatsApp Web session material
    crit: hostile
    conf: 0.99
    scope: file
    all:
      - id: whatsapp-session-key-fields
      - id: whatsapp-session-device-fields
      - id: micro-behaviors/crypto/library/provider::subtle-encrypt-decrypt
    any:
      - id: whatsapp-web-store-target
      - id: whatsapp-signal-store-target
    unless:
      - id: well-known/app/system/vendora-connect::disclosed-integration-context
      - id: well-known/app/system/vendora-connect::bridge-script-context
      - id: well-known/app/communication/leona-session-connector::disclosed-integration-context
      - id: well-known/app/communication/leona-session-connector::bridge-script-context

  # The 8-character pairing code links a new companion device to the
  # account, so it is a credential: upstream Baileys randomizes it on every
  # request (`customPairingCode ?? bytesToCrockford(randomBytes(5))`). A
  # client that assigns a fixed literal and then runs the link-code
  # companion registration with it makes the linking secret predictable to
  # anyone who reads the dependency, enabling an outsider to race or replay
  # the pairing ceremony. Fixtures quote example codes too, so the hostile
  # reading requires the registration stanza in the same function: the pair
  # establishes the constant is the secret actually sent, not a placeholder.
  # Worked example: @chatest/baileys 4.4.0, whose requestPairingCode falls
  # back to a constant code when the caller supplies none.
  - id: fixed-whatsapp-pairing-code-in-socket-client
    desc: Socket client pins a fixed pairing code
    crit: hostile
    conf: 0.97
    for: [javascript, typescript]
    attack: T1078
    all:
      - id: micro-behaviors/communications/messaging/channel::whatsapp-hardcoded-pairing-code
      - id: micro-behaviors/communications/messaging/channel::whatsapp-pairing-link-code-registration
    near_bytes: 3000
