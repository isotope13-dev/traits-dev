defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  crit: notable
  conf: 0.96

traits:
  - id: facebook-c-user-cookie-key
    desc: References Facebook c_user cookie
    if:
      type: text
      word: c_user

  - id: facebook-xs-cookie-key
    desc: References Facebook xs cookie
    if:
      type: text
      regex: "(^|[,{;]\\s*)xs\\s*[:=]|(\"xs\"|'xs'|[?&;]xs=)"

  - id: facebook-appstate-normalizer
    desc: Defines normalizeAppState
    if:
      type: symbol
      kind: function
      exact: normalizeAppState

  - id: facebook-session-recognizer
    desc: Defines looksLikeSession
    if:
      type: symbol
      kind: function
      exact: looksLikeSession

composite_rules:
  - id: facebook-appstate-cookie-normalization
    desc: Normalizes and recognizes Facebook session cookies
    all:
      - id: facebook-appstate-normalizer
      - id: facebook-session-recognizer
      - id: facebook-c-user-cookie-key
      - id: facebook-xs-cookie-key

