# JavaScript collectors that search for Telegram Desktop session artifacts,
# archive them, and upload the result through the Telegram Bot API.
defaults:
  platforms: [windows]
  for: [javascript, typescript]
  attack: T1539,T1005,T1560.001,T1041,T1567.002

composite_rules:
  - id: javascript-telegram-session-filename-shapes
    desc: References tdata and session filename shapes
    crit: suspicious
    conf: 0.96
    near_bytes: 5000
    all:
      - id: micro-behaviors/fs/path/application/messaging::javascript-tdata-directory-reference
      - id: micro-behaviors/data/string/search::javascript-session-shape-fragment

  - id: javascript-telegram-tdata-archive-upload
    desc: Targets Telegram sessions for bot upload
    crit: hostile
    conf: 0.99
    near_bytes: 5000
    all:
      - id: micro-behaviors/fs/path/application/messaging::javascript-tdata-directory-reference
      - id: micro-behaviors/data/string/search::javascript-session-shape-fragment
      - id: micro-behaviors/communications/messaging/send::telegram-bot-api-file-upload
