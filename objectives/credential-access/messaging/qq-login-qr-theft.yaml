# Capturing the desktop QQ login QR from its in-process login service lets an
# operator pair another device to the victim's account.
defaults:
  crit: component
  platforms: [windows]
  for: [dll, pe, javascript]

traits:
  - id: qq-login-service-interface
    desc: References QQ desktop login service
    conf: 0.97
    if:
      type: text
      substr: NodeIKernelLoginService

  - id: qq-login-qr-callback-fields
    desc: References QQ login QR callback
    crit: notable
    conf: 0.98
    if:
      type: text
      substr: onQRCodeGetPicture

  - id: qq-login-qr-payload-field
    desc: References base64 QQ login QR data
    crit: notable
    conf: 0.98
    if:
      type: text
      substr: pngBase64QrcodeData

  - id: qq-login-ipc-send-helper
    desc: Defines a named pipe message sender
    conf: 0.96
    if:
      type: text
      substr: sendToPipe

composite_rules:
  - id: qq-login-qr-session-theft
    desc: Intercepts and relays QQ login QR credentials
    crit: hostile
    conf: 0.99
    all:
      - id: qq-login-service-interface
      - id: qq-login-qr-callback-fields
      - id: qq-login-qr-payload-field
      - id: qq-login-ipc-send-helper
