# Telegram Desktop tdata theft via Windows backup privileges / Robocopy /B.
# Class covered by Still Sync (Armored Likho): locked session files opened with
# FILE_FLAG_BACKUP_SEMANTICS after SeBackupPrivilege, or copied with robocopy /B.
defaults:
  platforms: [windows]
  for: [scripts, source, python, batch, cmd, pe, dll]
  attack: T1539,T1003,T1134.001

traits:
  - id: telegram-session-preference-target
    desc: References Telegram account preferences
    crit: notable
    conf: 0.97
    if:
      type: text
      # Telegram Android keeps account state in shared_prefs/userconf*.xml.
      # A bare shared_prefs path is every Android app's preference store.
      regex: '(?i)["'']userconf(ing|ig|\d)?(\.xml)?["'']'

  - id: session-file-archive-construction
    desc: Archives selected session files before transfer
    crit: notable
    conf: 0.96
    if:
      type: text
      regex: '(?is)(ZipFile\([^\n]{0,100}writestr|writestr\([^\n]{0,160}open\([^\n]{0,80}"rb")'

  - id: telegram-session-directory-recursion
    desc: Walks Telegram session storage recursively
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: '(?is)os\.walk\([^\n]{0,160}(tgnet\.dat|accounts_map\.json|userconf)'

  - id: telegram-session-file-list
    desc: References Telegram session and account files
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: '(?is)(tgnet\.dat.{0,160}accounts_map\.json|accounts_map\.json.{0,160}tgnet\.dat)'

  - id: telegram-key-datas-file
    desc: Telegram key_datas session file name
    crit: suspicious
    conf: 0.93
    if:
      type: text
      # Telegram session key file lives under tdata/; reject Python locals like key_datas =
      regex: '(?i)([/\\]tdata[/\\]key_datas\b|Telegram[^\n'']{0,48}[/\\]key_datas\b)'

composite_rules:
  # Android Telegram clients keep their account authorization state in the
  # app-private files directory and shared_prefs. Requiring the file walk,
  # Telegram-specific session filenames, archive construction, and outbound
  # transfer avoids treating generic backup libraries as theft.
  - id: android-telegram-session-archive-upload
    for: [python, source]
    desc: Collects Telegram Android session files into an uploaded archive
    crit: hostile
    conf: 0.98
    attack: T1539,T1005,T1041
    all:
      - id: objectives/credential-access/messaging::telegram-session-file-list
      - id: objectives/credential-access/messaging::telegram-session-preference-target
      - id: objectives/credential-access/messaging::session-file-archive-construction
      - id: micro-behaviors/communications/http/client/exchange::urllib-urlopen-call
    any:
      - id: objectives/credential-access/messaging::telegram-session-directory-recursion
      - id: objectives/credential-access/messaging::telegram-session-file-list

  - id: tdata-backup-privilege-read
    for: [scripts, '!applescript', '!jcl', '!shell']
    desc: Reads Telegram tdata via backup privilege
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/fs/path/application/messaging::telegram-session-data-location
      - id: micro-behaviors/os/privilege/reference::se-backup-privilege-name-source
      - id: metadata/lang/source/naming/flag::file-flag-backup-semantics

  - id: tdata-robocopy-backup-copy
    for: [scripts, '!applescript', '!jcl', '!shell']
    desc: Robocopy backup-mode copies Telegram tdata
    crit: hostile
    conf: 0.97
    attack: T1539,T1005
    all:
      - id: micro-behaviors/fs/path/application/messaging::telegram-session-data-location
      - id: micro-behaviors/fs/file/copy/source-destination::robocopy-backup-mode

  - id: tdata-backup-key-datas-open
    desc: Opens Telegram key_datas with backup semantics
    crit: hostile
    conf: 0.97
    attack: T1539,T1003
    all:
      - id: objectives/credential-access/messaging::telegram-key-datas-file
      - id: metadata/lang/source/naming/flag::file-flag-backup-semantics
    any:
      - id: micro-behaviors/fs/path/application/messaging::telegram-session-data-location
      - id: micro-behaviors/os/privilege/reference::se-backup-privilege-name-source
