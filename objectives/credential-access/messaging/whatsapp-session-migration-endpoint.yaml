defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, xpi, crx, zip]
  attack: T1041

traits:
  - id: whatsapp-session-migration-endpoint
    desc: Targets a WhatsApp session import endpoint
    crit: notable
    conf: 0.98
    for: [javascript, typescript]
    if:
      type: text
      regex: '/(whatsapp/(migrar-sessao|session)|instance/import-web-session)'

  - id: whatsapp-session-api-host
    desc: References the NextTrack service host
    crit: notable
    conf: 0.99
    for: [javascript, typescript]
    if:
      type: text
      substr: service.nexttrack.com.br

  - id: whatsapp-session-import-path
    desc: References a WhatsApp session import route
    crit: notable
    conf: 0.98
    for: [javascript, typescript]
    if:
      type: text
      substr: /api/instances/import-session

composite_rules:
  - id: nexttrack-session-import-endpoint
    desc: Targets the NextTrack session import API
    crit: notable
    conf: 0.99
    for: [javascript, typescript]
    all:
      - id: objectives/credential-access/messaging::whatsapp-session-api-host
      - id: objectives/credential-access/messaging::whatsapp-session-import-path
