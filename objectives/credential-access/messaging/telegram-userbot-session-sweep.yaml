# Hunting .session files across several userbot install directories (Hikka,
# Legacy) collects other programs' Telegram logins; a userbot only needs its
# own session.
defaults:
  platforms: [windows, unix]
  for: [python]

composite_rules:
  - id: python-userbot-session-file-sweep
    desc: Sweeps Telegram userbot directories for .session files
    crit: hostile
    conf: 0.95
    attack: T1539
    all:
      - id: micro-behaviors/fs/path/token::hikka-userbot-directory-literal
      - id: micro-behaviors/fs/path/token::legacy-userbot-directory-literal
      - id: micro-behaviors/data/string/compare::python-session-suffix-test
      - id: micro-behaviors/fs/directory/readdir/language::python-directory-listing
