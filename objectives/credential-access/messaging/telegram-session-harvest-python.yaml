defaults:
  crit: suspicious
  platforms: [windows, unix]
  for: [scripts, binaries]
traits:
  - id: telegram-tdata-directory-target
    desc: Targets Telegram Desktop tdata directory
    conf: 0.95
    for: [python]
    if:
      type: text
      regex: '(?i)["'']tdata["'']\s+in\s+\w+'
composite_rules:
  - id: python-telegram-session-artifact-harvest
    desc: Recursively harvests and validates Telegram session artifacts
    conf: 0.99
    attack: T1539,T1083
    for: [python, whl, zip, python-sdist]
    scope: archive
    all:
      - id: micro-behaviors/data/string/compare::python-session-suffix-test
      - id: objectives/credential-access/messaging::telegram-tdata-directory-target
      - id: micro-behaviors/communications/http/services/telegram::telegram-session-client-validation
      - id: micro-behaviors/fs/directory/traverse::traverse-walk-call
