    desc: Session file collection beside fixed bot upload
    crit: hostile
    conf: 0.98
    scope: file
    all:
      - id: objectives/collection/archive/create::rust-sensitive-appdata-zip-staging
      - id: micro-behaviors/fs/file/open/unspecified::rust-file-open
    any:
      - id: objectives/exfiltration/stealer/application-state/chat::rust-fixed-bot-session-archive-upload
      - id: objectives/exfiltration/stealer/application-state::rust-appdata-archive-fixed-multipart-upload
      - id: objectives/exfiltration/stealer/application-state/chat::rust-xor-bot-session-archive-upload
