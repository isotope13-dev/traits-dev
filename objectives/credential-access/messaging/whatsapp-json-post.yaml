# Previously exfiltration/http/report::whatsapp-session-remote-post. These
# archive-scoped clues neither bind the extracted value to the request nor
# establish unauthorized transfer: user-invoked session migration matches too.
# Keep the sensitive acquisition visible without asserting hostile exfiltration.
defaults:
  platforms: [unix, windows]
  for: [crx, xpi, zip, javascript]

composite_rules:
  - id: whatsapp-session-extraction-with-json-post
    desc: WhatsApp session extraction and JSON POST clues co-occur
    crit: suspicious
    conf: 0.995
    scope: archive
    all:
      - id: objectives/credential-access/messaging::whatsapp-web-session-material-extraction
      - id: micro-behaviors/communications/http/request/client::fetch-post-pattern
      - id: micro-behaviors/communications/http/header/content-type::json-header
    any:
      - id: metadata/lang/source/syntax/object::json-body-session-or-hash-key-text
      - id: objectives/exfiltration/http/report::extension-registration-token-json-post-body
    unless:
      - id: well-known/app/system/vendora-connect::disclosed-integration-context
      - id: well-known/app/system/vendora-connect::bridge-script-context
      - id: well-known/app/communication/leona-session-connector::disclosed-integration-context
      - id: well-known/app/communication/leona-session-connector::bridge-script-context
      - id: well-known/app/communication/letalk-whatsapp-bridge::disclosed-integration-context
      - id: well-known/app/communication/letalk-whatsapp-bridge::bridge-script-context
