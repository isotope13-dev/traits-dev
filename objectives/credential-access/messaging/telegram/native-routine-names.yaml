# A compiled routine named for Telegram that takes an archive writer: the
# collector that zips Telegram Desktop's tdata session store. Seen in a macOS
# C++ stealer (2026-09, bfc96a7fa7aa) whose paths were all encrypted but whose
# stale export-trie bytes kept `8telegramRKNSt3__112basic_string...RN9miniz_cpp8zip_fileE`.
# The archive-type leg is what separates a collector from a Telegram client.
defaults:
  platforms: [linux, macos, windows]
  for: [macho, elf, pe]
  attack: T1539,T1005
traits:
  - id: telegram-archive-routine
    desc: Telegram routine writes into an archive
    crit: suspicious
    conf: 0.85
    if:
      type: text
      regex: '(?i)(^|[^a-z])(telegram|tdata)_?[A-Z]{0,2}R.{0,120}zip_?(file|archive|writer)'
