defaults:
  platforms: [windows, unix]
  for: [scripts, binaries, csharp]
  crit: notable
  conf: 0.85
  attack: T1555
traits:
  # Telegram Web keeps the authenticated account record in this field.  The
  # field read alone is only notable; the composites below require storage
  # serialization or remote restoration before escalating the behavior.
  - id: telegram-web-auth-state-parse
    desc: Parses Telegram Web authentication state
    crit: notable
    conf: 0.98
    attack: T1539
    for: [javascript, typescript]
    if:
      type: text
      regex: 'JSON\.parse\s*\(\s*[A-Za-z_$][A-Za-z0-9_$]*\.user_auth\b'
  - id: telegram-web-storage-clear
    desc: Clears Telegram Web local storage
    crit: notable
    conf: 0.96
    attack: T1539
    for: [javascript, typescript]
    if:
      type: text
      regex: 'localStorage\.clear\s*\(\s*\)'
  - id: telegram-web-session-storage-clear
    desc: Clears both Telegram Web storages
    crit: notable
    conf: 0.98
    attack: T1539
    for: [javascript, typescript]
    if:
      type: text
      regex: 'localStorage\.clear\s*\(\s*\)[\s\S]{0,80}sessionStorage\.clear\s*\('
  - id: telegram-web-storage-state-serialize
    desc: Serializes an aliased web-storage object
    crit: notable
    conf: 0.97
    attack: T1539
    for: [javascript, typescript]
    if:
      type: text
      regex: 'JSON\.stringify\s*\(\s*(LS|storage|store)\s*\)'
  - id: telegram-web-data-key-loop
    desc: Iterates keys from remote account data
    crit: notable
    conf: 0.96
    attack: T1539
    for: [javascript, typescript]
    if:
      type: text
      regex: 'for\s*\(\s*(var|let)\s+k\s+in\s+data\s*\)'
  - id: telegram-web-remote-storage-key-write
    desc: Writes remote account keys to storage
    crit: notable
    conf: 0.97
    attack: T1539
    for: [javascript, typescript]
    if:
      type: text
      regex: 'localStorage\.setItem\s*\(\s*k\s*,'
  - id: tdata-directory
    desc: Telegram tdata directory token
    crit: component
    conf: 0.7
    if:
      type: text
      regex: (^|[^A-Za-z0-9_.-])tdata([^A-Za-z0-9_.-]|$)
    unless:
    - type: trait
      id: metadata/file/extension/identity::linux-kernel-package-artifact-basename
  - id: tdata-path
    desc: Telegram tdata full path
    crit: suspicious
    conf: 0.95
    if:
      type: text
      regex: Telegram Desktop[/\\]+tdata
  - id: d877f783-file
    desc: Telegram D877F783 session directory
    crit: suspicious
    conf: 0.9
    if:
      type: text
      substr: D877F783
composite_rules:
  - id: telegram-web-authenticated-storage-serialization
    desc: Serializes Telegram Web authenticated storage
    crit: suspicious
    conf: 0.98
    attack: T1539
    for: [javascript, typescript]
    all:
      - id: telegram-web-auth-state-parse
      - id: micro-behaviors/data/db/web-storage::localstorage-alias-assignment
      - id: telegram-web-storage-state-serialize
    near_bytes: 256

  - id: telegram-web-remote-session-restore
    desc: Replaces Telegram Web storage remotely
    crit: suspicious
    conf: 0.98
    attack: T1539
    for: [javascript, typescript]
    all:
      - id: telegram-web-session-storage-clear
      - id: micro-behaviors/data/parse/json::json-data-property-parse
      - id: telegram-web-data-key-loop
      - id: telegram-web-remote-storage-key-write
    near_bytes: 4096

  - id: telegram-web-remote-session-replacement
    desc: Extension replaces Telegram Web session remotely
    crit: hostile
    conf: 0.995
    attack: T1539
    scope: archive
    for: [crx, xpi, zip, archives]
    all:
      - id: telegram-web-remote-session-restore
      - id: micro-behaviors/communications/http/websocket::websocket-constructor-call
      - id: micro-behaviors/process/inject/webextension::extension-page-script-injection
      - id: metadata/permission/host::content-script-matches-im-web-app

  - id: telegram-stealer
    desc: Telegram session data reference
    crit: notable
    conf: 0.95
    all:
      - id: micro-behaviors/fs/path/application/state::telegram-desktop-data-path
    any:
      - id: tdata-directory
      - id: tdata-path
      - id: objectives/collection/messaging/app::telegram-key-datas
    unless:
      - id: well-known/app/telegram::telegram-desktop-official-client
