defaults:
  platforms: [windows, unix]
  for: [scripts, binaries, csharp]
  crit: notable
  conf: 0.85
  attack: T1555
traits:
  # Telegram Web keeps the authenticated account record in this field.  The
  # field read alone is only notable; the composites below require storage
  # serialization or remote restoration before escalating the behavior.
  - id: telegram-web-auth-state-parse
    desc: Parses Telegram Web authentication state
    crit: notable
    conf: 0.98
    attack: T1539
    for: [javascript, typescript]
    if:
      type: text
      regex: 'JSON\.parse\s*\(\s*[A-Za-z_$][A-Za-z0-9_$]*\.user_auth\b'
  - id: telegram-web-auth-storage-marker
    desc: Telegram Web authentication storage marker
    crit: notable
    conf: 0.95
    for: [javascript, typescript]
    if:
      type: text
      # `user_auth` alone matched `need_user_authorization`, a Lark/Slack OAuth
      # error code. The Telegram storage key must appear beside Telegram
      # itself; the JSON.parse shape stays in telegram-web-auth-state-parse.
      regex: '(?i)web\.telegram\.org|(telegram|tgweb)[^;\n]{0,80}user_auth'
  - id: d877f783-file
    desc: Telegram D877F783 session directory
    crit: suspicious
    conf: 0.9
    if:
      type: text
      substr: D877F783
composite_rules:
  - id: telegram-web-storage-clear
    desc: Clears Telegram Web local storage
    crit: notable
    conf: 0.96
    attack: T1539
    for: [javascript, typescript]
    all:
      - id: micro-behaviors/data/db/web-storage::dom-localstorage-clear-call
      - id: telegram-web-auth-storage-marker

  - id: telegram-web-session-storage-clear
    desc: Clears both Telegram Web storages
    crit: notable
    conf: 0.98
    attack: T1539
    for: [javascript, typescript]
    all:
      - id: micro-behaviors/data/db/web-storage::dom-localstorage-clear-call
      - id: micro-behaviors/data/db/web-storage::dom-sessionstorage-clear-call
      - id: telegram-web-auth-storage-marker
    near_bytes: 80

  - id: telegram-web-authenticated-storage-serialization
    desc: Serializes Telegram Web authenticated storage
    crit: suspicious
    conf: 0.98
    attack: T1539
    for: [javascript, typescript]
    all:
      - id: telegram-web-auth-state-parse
      - id: micro-behaviors/data/db/web-storage::localstorage-alias-assignment
      - id: micro-behaviors/data/serialize/json::json-stringify-identifier
    near_bytes: 256

  - id: telegram-web-remote-session-restore
    desc: Replaces Telegram Web storage remotely
    crit: suspicious
    conf: 0.98
    attack: T1539
    for: [javascript, typescript]
    all:
      - id: telegram-web-session-storage-clear
      - id: micro-behaviors/data/serialize/json::json-data-property-parse
      - id: micro-behaviors/data/control-flow/loop::js-object-key-in-loop
      - id: micro-behaviors/data/db/web-storage::dom-storage-setitem-variable-key
    near_bytes: 4096

  - id: telegram-web-remote-session-replacement
    desc: Extension replaces Telegram Web session remotely
    crit: hostile
    conf: 0.995
    attack: T1539
    scope: archive
    for: [crx, xpi, zip, javascript, chrome-manifest]
    all:
      - id: telegram-web-remote-session-restore
      - id: micro-behaviors/communications/http/websocket::websocket-constructor-call
      - id: micro-behaviors/process/inject/webextension::extension-page-script-injection
      - id: metadata/permission/host::content-script-matches-im-web-app
