# Telegram Desktop tdata theft via Windows backup privileges / Robocopy /B.
# Class covered by Still Sync (Armored Likho): locked session files opened with
# FILE_FLAG_BACKUP_SEMANTICS after SeBackupPrivilege, or copied with robocopy /B.
defaults:
  platforms: [windows]
  for: [scripts, source, python, batch, cmd, pe, dll]
  attack: T1539,T1003,T1134.001

traits:
  - id: telegram-key-datas-file
    desc: Telegram key_datas session file name
    crit: suspicious
    conf: 0.93
    if:
      type: text
      # Telegram session key file lives under tdata/; reject Python locals like key_datas =
      regex: '(?i)([/\\]tdata[/\\]key_datas\b|Telegram[^\n'']{0,48}[/\\]key_datas\b)'

composite_rules:
  - id: tdata-backup-privilege-read
    desc: Reads Telegram tdata via backup privilege
    crit: hostile
    conf: 0.98
    all:
      - id: objectives/collection/stealer/session::telegram-tdata-access
      - id: micro-behaviors/os/privilege/token::se-backup-privilege-name-source
      - id: micro-behaviors/fs/file/open::file-flag-backup-semantics

  - id: tdata-robocopy-backup-copy
    desc: Robocopy backup-mode copies Telegram tdata
    crit: hostile
    conf: 0.97
    attack: T1539,T1005
    all:
      - id: objectives/collection/stealer/session::telegram-tdata-access
      - id: micro-behaviors/fs/file/copy::robocopy-backup-mode

  - id: tdata-backup-key-datas-open
    desc: Opens Telegram key_datas with backup semantics
    crit: hostile
    conf: 0.97
    attack: T1539,T1003
    all:
      - id: telegram-key-datas-file
      - id: micro-behaviors/fs/file/open::file-flag-backup-semantics
    any:
      - id: objectives/collection/stealer/session::telegram-tdata-access
      - id: micro-behaviors/os/privilege/token::se-backup-privilege-name-source
