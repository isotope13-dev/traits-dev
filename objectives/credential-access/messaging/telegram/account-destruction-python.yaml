defaults:
  platforms: [unix, windows]
  for: [python, whl, zip, python-sdist]
  crit: hostile
  conf: 0.98
  attack: T1531,T1555.003

composite_rules:
  - id: python-goygram-telegram-account-deletion
    desc: GoyGram client invokes Telegram account deletion
    all:
      - id: micro-behaviors/communications/http/services/telegram::goygram-import-reference
      - id: micro-behaviors/communications/messaging/telegram::mtproto-delete-account-rpc

  - id: python-telegram-vault-account-destruction
    desc: Harvests vault sessions then deletes Telegram accounts
    scope: archive
    all:
      - id: micro-behaviors/communications/http/services/telegram::telegram-session-vault-glob
      - id: micro-behaviors/communications/http/services/telegram::goygram-import-reference
      - id: micro-behaviors/communications/messaging/telegram::mtproto-delete-account-rpc

  - id: python-import-detached-telegram-destructor
    desc: Import-time detached child deletes Telegram accounts
    for: [python]
    all:
      - id: micro-behaviors/communications/http/services/telegram::goygram-import-reference
      - id: micro-behaviors/communications/messaging/telegram::mtproto-delete-account-rpc
      - id: micro-behaviors/process/create/subprocess::qualified-popen-call
      - id: micro-behaviors/process/daemonize/detach::python-subprocess-new-session-option
