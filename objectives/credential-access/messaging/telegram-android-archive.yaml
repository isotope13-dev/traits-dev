# Android Python uses Linux; the engine rejects Android-only Python scope.
defaults:
  for:
  - python
  platforms:
  - linux
  - android
composite_rules:
- id: python-telegram-android-auth-archive
  desc: Telegram Android auth-store search and ZIP collection clues
  crit: suspicious
  conf: 0.97
  attack: T1555,T1560.001
  all:
  - id: micro-behaviors/fs/path/token::telegram-android-auth-store
  - id: metadata/import/python/org/telegram/messenger/applicationloader
  - id: micro-behaviors/fs/directory/traverse::traverse-walk-call
  - id: micro-behaviors/data/archive/zip::python-zipfile-writer
