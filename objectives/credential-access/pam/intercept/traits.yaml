defaults:
  platforms:
  - unix
  attack: T1556.003
  for:
  - elf
traits:
- id: libpam-basename
  desc: Filename is libpam.so
  crit: notable
  if:
    type: path
    basename: true
    regex: ^libpam\.so(\.[0-9]+)?$
- id: pam-hidden-credential-path
  desc: Hidden PAM credential path
  crit: notable
  conf: 0.95
  for: [elf, so, c, cpp, shell, scripts]
  if:
    type: text
    regex: '/(tmp|var/log)/\.pam[A-Za-z0-9_-]{0,32}\b'
- id: sshd-credential-log-path
  desc: Hidden sshd credential log path
  crit: notable
  conf: 0.92
  for: [elf, so, c, cpp, shell, scripts]
  if:
    type: text
    # auth|cred|log|pass after a -, _ or . separator; the trailing class
    # absorbs "ential"/"word" as the old optional groups did.
    regex: '/(tmp|var/log)/\.sshd[-_.](auth|cred|log|pass)[A-Za-z0-9_-]{0,24}\b'
- id: login-credential-log-path
  desc: Hidden login credential log path
  crit: notable
  conf: 0.9
  for: [elf, so, c, cpp, shell, scripts]
  if:
    type: text
    regex: '/(tmp|var/log)/\.(su(do)?|login)[-_.](auth|cred|log|pass|pw|unix)([-_.]\w{1,16})?\b'
- id: auth-credential-log-path
  desc: Hidden auth credential log path
  crit: notable
  conf: 0.9
  for: [elf, so, c, cpp, shell, scripts]
  if:
    type: text
    regex: '/(tmp|var/log)/\.(passwd|auth)[A-Za-z0-9_-]{0,24}(-unix|\.log)?\b'
  not:
    # s3fs-fuse's documented credentials file (`.passwd-s3fs`), written to
    # mount a bucket, is not a captured-password log.
    - regex: '\.passwd-s3fs'
    # authorized_keys staging paths (provisioning tools uploading the SSH
    # key that grants them access) are key installs, not captured passwords.
    - regex: 'authorized_keys'
- id: compile-pam-shared-module--rx-8
  desc: Regex component marker
  crit: suspicious
  conf: 0.94
  for: [elf, c, cpp, shell, scripts]
  if:
    type: text
    regex: '\bgcc\b[^\n]{0,260}-shared[^\n]{0,160}-fPIC[^\n]{0,260}-lpam'
- id: compile-pam-shared-module--rx-9
  desc: Regex component marker
  crit: suspicious
  conf: 0.94
  for: [elf, c, cpp, shell, scripts]
  if:
    type: text
    regex: '/usr/lib/\.[A-Za-z0-9._-]{1,80}\.so[\s\S]{0,260}-lpam'
- id: pam-source-tempfile
  desc: Temporary PAM module source file
  crit: suspicious
  conf: 0.88
  for: [elf, c, cpp, shell, scripts]
  if:
    type: text
    regex: '/tmp/\.(pam_src|pcs|hide_src)_[A-Za-z0-9_*-]{4,48}'
- id: pam-response-dup-call
  desc: PAM response duplicated into another buffer
  crit: notable
  conf: 0.88
  for: [c, cpp]
  if:
    type: text
    regex: '\b(strdup|strcpy|memcpy|memmove)\s*\([^;]{0,80}reply\s*\[\w+\]\.resp\b'
- id: pam-response-log-call
  desc: PAM response written to log output
  crit: notable
  conf: 0.88
  for: [c, cpp]
  if:
    type: text
    regex: '\b(fprintf|fputs|fwrite|syslog)\s*\([^;]{0,80}reply\s*\[\w+\]\.resp\b'
- id: pam-response-send-call
  desc: PAM response sent over a descriptor
  crit: notable
  conf: 0.88
  for: [c, cpp]
  if:
    type: text
    regex: '\b(send|sendto|write)\s*\([^;]{0,80}reply\s*\[\w+\]\.resp\b'
- id: pam-response-stash-assign
  desc: PAM response stored into another variable
  crit: notable
  conf: 0.88
  for: [c, cpp]
  if:
    type: text
    regex: '[^=!<>]=\s*reply\s*\[\w+\]\.resp\b'

- id: pam-start-root-source
  desc: pam_start targets root account
  crit: suspicious
  conf: 0.9
  for: [c, cpp]
  if:
    type: text
    regex: '\bpam_start\s*\(.{0,80}"root"'
- id: pam-auth-root-success-text
  desc: PAM root authentication message
  crit: suspicious
  conf: 0.84
  for: [elf, macho, c, cpp]
  if:
    type: text
    substr: authentication succeeded for root
- id: pam-response-password-log-call
  desc: Logs a PAM response as a password
  crit: suspicious
  conf: 0.99
  for: [c, cpp]
  if:
    type: text
    regex: 'pam_log_password\s*\(\s*user\s*,\s*pwd->resp\s*\)'
composite_rules:
- id: pam-credential-log-path
  desc: Hidden credential log path
  crit: suspicious
  conf: 0.95
  for: [elf, so, c, cpp, shell, scripts]
  any:
  - id: pam-hidden-credential-path
  - id: sshd-credential-log-path
  - id: login-credential-log-path
  - id: auth-credential-log-path
  unless:
  - id: micro-behaviors/fs/path/socket::x11-display-socket-directory
  - id: metadata/path/software::cachyos-installer-binary
- id: pam-reference-source-context
  desc: Reference PAM consumer source tree
  crit: exception
  conf: 0.95
  for: [c, cpp]
  any:
  - id: well-known/app/network/openssh::source-tree-path
  - id: well-known/app/system/samba::samba-source-tree
  - id: well-known/app/utility/sudo::source-tree
  - id: well-known/app/data/postgresql::postgresql-source-tree
  - id: well-known/app/system/netatalk::netatalk-source-tree
  - id: well-known/app/network/freeradius::freeradius-pam-module-context
  - id: well-known/lib/testing/modernc-ccorpus2::source-archive-path
  - id: well-known/tool/sysadmin/linux-pam::linux-pam-source-tree
- id: pam-response-copy-source
  desc: PAM response buffer copied out
  crit: suspicious
  conf: 0.88
  for: [c, cpp]
  any:
  - id: pam-response-dup-call
  - id: pam-response-log-call
  - id: pam-response-send-call
  - id: pam-response-stash-assign
  downgrade:
    any:
    - id: pam-reference-source-context
- id: pam-prompt-response-copy
  desc: PAM prompt response copying
  crit: suspicious
  conf: 0.92
  for: [c, cpp]
  downgrade:
    any:
    - id: pam-reference-source-context
  all:
  - id: micro-behaviors/os/pam/client::pam-prompt-echo-source
  - id: pam-response-copy-source

- id: pam-root-auth-target
  desc: PAM authentication targets root
  crit: suspicious
  conf: 0.9
  for: [elf, macho, c, cpp]
  any:
  - id: pam-start-root-source
  - id: pam-auth-root-success-text
- id: pam-local-account-map
  desc: PAM configuration with local account databases
  crit: suspicious
  conf: 0.94
  for: [elf, macho]
  all:
  - id: micro-behaviors/os/pam/auth::pam-config-paths
  - id: micro-behaviors/os/privilege/paths::etc-shadow
  any:
  - id: micro-behaviors/fs/path/config/accounts::etc-passwd
  - id: metadata/lang/source/literal/string/label::bracketed-account-database-label
- id: pam-client-root-credential-harvester
  desc: PAM client captures root credential prompts
  crit: hostile
  conf: 0.98
  for: [elf, macho, c, cpp]
  all:
  - id: micro-behaviors/os/pam/client::pam-client-api-sequence
  - id: pam-root-auth-target
  any:
  - id: pam-prompt-response-copy
  - id: micro-behaviors/os/pam/client::pam-conversation-callback-name
  - id: pam-local-account-map
- id: pam-config-and-shadow-harvester
  desc: PAM configuration and shadow database harvesting
  crit: hostile
  conf: 0.97
  for: [elf, macho]
  all:
  - id: pam-local-account-map
  any:
  - id: micro-behaviors/os/pam/client::pam-client-api-sequence
  - id: micro-behaviors/os/pam/client::pam-auth-functions
- id: pam-root-password-change-probe
  desc: PAM root password change probe
  crit: hostile
  conf: 0.97
  for: [elf, macho, c, cpp]
  all:
  - id: pam-root-auth-target
  - id: micro-behaviors/os/pam/client::pam-chauthtok-api
  any:
  - id: micro-behaviors/os/user/modify::chpasswd-command
- id: pam-token-log-stealer
  desc: PAM module captures authentication tokens
  crit: hostile
  conf: 0.98
  for: [elf, so, c, cpp]
  all:
  - id: micro-behaviors/os/pam/client::pam-token-access
  - id: pam-credential-log-path
  any:
  - id: compile-pam-shared-module
  - id: pam-source-tempfile
  - id: micro-behaviors/os/pam/auth::module
- id: pam-response-credential-logger
  desc: PAM authentication hook records a password prompt response
  crit: hostile
  conf: 0.995
  for: [c, cpp]
  all:
  - id: pam-response-password-log-call
  - id: micro-behaviors/os/pam/client::pam-conversation-callback-name
- id: compile-pam-shared-module
  desc: Compiles PAM shared object module
  crit: suspicious
  conf: 0.94
  for: [elf, c, cpp, shell, scripts]
  any:
  - id: compile-pam-shared-module--rx-8
  - id: compile-pam-shared-module--rx-9
