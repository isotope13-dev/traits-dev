defaults:
  platforms:
  - unix
  attack: T1556.003
  for:
  - elf
traits:
- id: libpam-so-versioned
  desc: libpam.so.0 versioned library
  crit: component
  conf: 0.7
  if:
    type: text
    regex: libpam\.so\.\d+
- id: pam-get-authtok
  desc: pam_get_authtok function
  crit: notable
  conf: 0.8
  if:
    type: symbol
    exact: pam_get_authtok
- id: pam-authtok-constant
  desc: PAM_AUTHTOK constant
  crit: notable
  conf: 0.75
  # PAM_AUTHTOK is a compile-time constant.  In native binaries it commonly
  # survives only inside diagnostic strings, which are not constant use.
  for: [c, cpp]
  if:
    type: text
    substr: PAM_AUTHTOK
- id: pam-get-item-source
  desc: pam_get_item token access
  crit: notable
  conf: 0.84
  for: [c, cpp]
  if:
    type: symbol
    exact: pam_get_item
- id: pam-open-session
  desc: pam_open_session function
  crit: component
  conf: 0.7
  if:
    type: symbol
    exact: pam_open_session
- id: libpam-basename
  desc: Filename is libpam.so
  crit: component
  if:
    type: path
    basename: true
    regex: ^libpam\.so(\.[0-9]+)?$
- id: pam-d-write--rx-1
  desc: Regex component marker
  crit: component
  conf: 0.85
  for: [c, macho, elf, shell, scripts]
  if:
    type: text
    regex: '(>>?|tee\s+-a?).{0,120}/etc/pam\.d/[a-z]{1,20}'
  count_max: 1013872
- id: pam-d-write--rx-2
  desc: Regex component marker
  crit: component
  conf: 0.85
  for: [c, macho, elf, shell, scripts]
  if:
    type: text
    regex: '(sed\s+-i|perl\s+-pi).{0,120}/etc/pam\.d/[a-z]{1,20}'
  count_max: 1013873
- id: pam-d-write--rx-3
  desc: Regex component marker
  crit: component
  conf: 0.85
  for: [c, macho, elf, shell, scripts]
  if:
    type: text
    regex: '(install\s+-m|cp\s+).{0,120}/etc/pam\.d/[a-z]{1,20}'
  count_max: 1013874
- id: pam-d-write--rx-4
  desc: Regex component marker
  crit: component
  conf: 0.85
  for: [c, macho, elf, shell, scripts]
  if:
    type: text
    regex: '(mv\s+|fopen\s*\().{0,120}/etc/pam\.d/[a-z]{1,20}'
  count_max: 1013875
- id: pam-d-write--rx-5
  desc: Regex component marker
  crit: component
  conf: 0.85
  for: [c, macho, elf, shell, scripts]
  if:
    type: text
    regex: '(open\s*\(|creat\s*\().{0,120}/etc/pam\.d/[a-z]{1,20}'
  count_max: 1013876
- id: pam-d-write--rx-6
  desc: Regex component marker
  crit: component
  conf: 0.85
  for: [c, macho, elf, shell, scripts]
  if:
    type: text
    regex: '/etc/pam\.d/[a-z]{1,20}.{0,120}(>>?|auth\s+optional\s+\S+\.so)'
  count_max: 1013877
- id: pam-d-write--rx-7
  desc: Regex component marker
  crit: component
  conf: 0.85
  for: [c, macho, elf, shell, scripts]
  if:
    type: text
    regex: '/etc/pam\.d/[a-z]{1,20}.{0,120}(account\s+optional\s+\S+\.so)'
  count_max: 1013878
- id: pam-hidden-credential-path
  desc: Hidden PAM credential path
  crit: component
  conf: 0.95
  for: [elf, so, c, cpp, shell, scripts]
  if:
    type: text
    regex: '/(tmp|var/log)/\.pam[A-Za-z0-9_-]{0,32}\b'
- id: sshd-credential-log-path
  desc: Hidden sshd credential log path
  crit: component
  conf: 0.92
  for: [elf, so, c, cpp, shell, scripts]
  if:
    type: text
    regex: '/(tmp|var/log)/\.sshd([-_][A-Za-z0-9_-]{0,24}|\.log)?\b'
- id: login-credential-log-path
  desc: Hidden login credential log path
  crit: component
  conf: 0.9
  for: [elf, so, c, cpp, shell, scripts]
  if:
    type: text
    regex: '/(tmp|var/log)/\.(su(do)?|login)[A-Za-z0-9_-]{0,24}(-unix|\.log)?\b'
- id: auth-credential-log-path
  desc: Hidden auth credential log path
  crit: component
  conf: 0.9
  for: [elf, so, c, cpp, shell, scripts]
  if:
    type: text
    regex: '/(tmp|var/log)/\.(passwd|auth)[A-Za-z0-9_-]{0,24}(-unix|\.log)?\b'
- id: x11-hidden-unix-socket-path
  desc: X11 hidden unix socket path
  crit: component
  conf: 0.95
  for: [elf, so, c, cpp, shell, scripts]
  if:
    type: text
    regex: '/tmp/\.(X[0-9]+-unix|ICE-unix|XIM-unix|font-unix)\b'
- id: compile-pam-shared-module--rx-8
  desc: Regex component marker
  crit: component
  conf: 0.94
  for: [elf, c, cpp, shell, scripts]
  if:
    type: text
    regex: '\bgcc\b[^\n]{0,260}-shared[^\n]{0,160}-fPIC[^\n]{0,260}-lpam'
  count_max: 1013881
- id: compile-pam-shared-module--rx-9
  desc: Regex component marker
  crit: component
  conf: 0.94
  for: [elf, c, cpp, shell, scripts]
  if:
    type: text
    regex: '/usr/lib/\.[A-Za-z0-9._-]{1,80}\.so[\s\S]{0,260}-lpam'
  count_max: 1013882
- id: pam-source-tempfile
  desc: Temporary PAM module source file
  crit: suspicious
  conf: 0.88
  for: [elf, c, cpp, shell, scripts]
  if:
    type: text
    regex: '/tmp/\.(pam_src|pcs|hide_src)_[A-Za-z0-9_*-]{4,48}'
- id: pam-get-item-call
  desc: pam_get_item call in C source
  crit: notable
  conf: 0.85
  # Keep source-text evidence out of binaries: native PAM modules retain
  # diagnostic strings such as "pam_get_item (PAM_AUTHTOK) failed".
  for: [c, cpp]
  if:
    type: symbol
    kind: call
    exact: pam_get_item
- id: pam-get-authtok-call
  desc: pam_get_authtok call in C source
  crit: notable
  conf: 0.85
  for: [c, cpp]
  if:
    type: symbol
    kind: call
    exact: pam_get_authtok
- id: pam-response-copy-source
  desc: PAM response buffer assignment
  crit: suspicious
  conf: 0.88
  for: [c, cpp]
  if:
    type: text
    regex: 'reply\s*\[[A-Za-z0-9_]+\]\.resp'
  unless:
    - id: well-known/app/system/samba::samba-source-tree
    - id: well-known/app/utility/sudo::source-tree
    - id: well-known/app/data/postgresql::postgresql-source-tree
    - id: well-known/app/system/netatalk::netatalk-source-tree
    - id: well-known/app/network/freeradius::freeradius-pam-module-context
    - id: well-known/lib/development/modernc-ccorpus2::source-archive-path
- id: pam-start-root-source
  desc: pam_start targets root account
  crit: suspicious
  conf: 0.9
  for: [c, cpp]
  if:
    type: text
    regex: '\bpam_start\s*\(.{0,80}"root"'
- id: pam-auth-root-success-text
  desc: PAM root authentication message
  crit: suspicious
  conf: 0.84
  for: [elf, macho, c, cpp]
  if:
    type: text
    substr: authentication succeeded for root
- id: pam-response-password-log-call
  desc: Logs a PAM response as a password
  crit: suspicious
  conf: 0.99
  for: [c, cpp]
  if:
    type: text
    regex: 'pam_log_password\s*\(\s*user\s*,\s*pwd->resp\s*\)'
composite_rules:
- id: pam-credential-log-path
  desc: Hidden credential log path
  crit: suspicious
  conf: 0.95
  for: [elf, so, c, cpp, shell, scripts]
  any:
  - id: pam-hidden-credential-path
  - id: sshd-credential-log-path
  - id: login-credential-log-path
  - id: auth-credential-log-path
  unless:
  - id: x11-hidden-unix-socket-path
- id: pam-library
  desc: PAM library references
  crit: notable
  any:
  - id: micro-behaviors/os/pam/auth::libpam-so-string
  - id: libpam-so-versioned
- id: pam-token-access
  desc: PAM token access functions
  crit: notable
  for: [elf, so, c, cpp]
  # pam_get_item/pam_set_item also handle non-secret PAM state.  Restrict this
  # objective building block to APIs and constants that specifically name the
  # authentication token, leaving generic handle access in micro-behaviors.
  any:
  - id: pam-get-authtok
  - id: pam-authtok-constant
  - id: pam-get-authtok-call
# The authenticate and chauthtok legs used to be listed twice over — once as a
# compiled symbol and once as a C call site. The `*-api` composites already
# union those two spellings, so referencing them says the same thing in half
# the legs and picks up the chauthtok symbol form that was missing here.
- id: pam-auth-functions
  desc: PAM authentication functions
  crit: notable
  any:
  - id: micro-behaviors/os/pam/client::pam-authenticate-api
  - id: micro-behaviors/os/pam/client::pam-chauthtok-api
  - id: micro-behaviors/os/pam/auth::pam-acct-mgmt
  - id: micro-behaviors/os/pam/auth::pam-setcred-symbol
  - id: pam-open-session
- id: pam-prompt-response-copy
  desc: PAM prompt response copying
  crit: suspicious
  conf: 0.92
  for: [c, cpp]
  unless:
  - id: well-known/app/system/samba::samba-source-tree
  - id: well-known/app/utility/sudo::source-tree
  - id: well-known/app/data/postgresql::postgresql-source-tree
  - id: well-known/app/system/netatalk::netatalk-source-tree
  - id: well-known/app/network/freeradius::freeradius-pam-module-context
  - id: well-known/lib/development/modernc-ccorpus2::source-archive-path
  all:
  - id: micro-behaviors/os/pam/client::pam-prompt-echo-source
  - id: pam-response-copy-source
- id: pam-root-auth-target
  desc: PAM authentication targets root
  crit: suspicious
  conf: 0.9
  for: [elf, macho, c, cpp]
  any:
  - id: pam-start-root-source
  - id: pam-auth-root-success-text
- id: pam-local-account-map
  desc: PAM configuration with local account databases
  crit: suspicious
  conf: 0.94
  for: [elf, macho, c, cpp]
  all:
  - id: micro-behaviors/os/pam/auth::pam-config-paths
  - id: micro-behaviors/os/privilege/paths::etc-shadow
  any:
  - id: micro-behaviors/fs/path/config/accounts::etc-passwd
  - id: objectives/exfiltration/http/upload::native-elf-account-file-path
- id: pam-client-root-credential-harvester
  desc: PAM client captures root credential prompts
  crit: hostile
  conf: 0.98
  for: [elf, macho, c, cpp]
  all:
  - id: micro-behaviors/os/pam/client::pam-client-api-sequence
  - id: pam-root-auth-target
  any:
  - id: pam-prompt-response-copy
  - id: micro-behaviors/os/pam/client::pam-conversation-callback-name
  - id: pam-local-account-map
- id: pam-config-and-shadow-harvester
  desc: PAM configuration and shadow database harvesting
  crit: hostile
  conf: 0.97
  for: [elf, macho, c, cpp]
  all:
  - id: pam-local-account-map
  any:
  - id: micro-behaviors/os/pam/client::pam-client-api-sequence
  - id: pam-auth-functions
- id: pam-root-password-change-probe
  desc: PAM root password change probe
  crit: hostile
  conf: 0.97
  for: [elf, macho, c, cpp]
  all:
  - id: pam-root-auth-target
  - id: micro-behaviors/os/pam/client::pam-chauthtok-api
  any:
  - id: micro-behaviors/os/user/account::chpasswd-command
- id: interceptor
  desc: PAM credential token access
  crit: suspicious
  conf: 0.8
  for: [so, dylib, macho, c, cpp]
  all:
  - id: pam-library
  any:
      # Real credential interception should touch credential-bearing token APIs.
      # Ordinary login tools commonly combine libpam, pam_authenticate,
      # pam_acct_mgmt, pam_open_session, pam_setcred, and pam_set_item.
  - id: pam-get-authtok
  - id: pam-authtok-constant
  unless:
  - id: well-known/app/network/openssh::openssh-server
  - id: libpam-basename
  - id: micro-behaviors/os/pam/auth/
  downgrade:
    any:
    - id: metadata/binary/provenance/
- id: pam-config-injector
  desc: PAM module config injector
  crit: suspicious
  conf: 0.9
  for: [c, macho, elf, scripts]
  unless:
  - id: well-known/app/utility/sudo::source-tree
  - id: well-known/lib/core/omdev::omdev-library
  # ntfy serves embedded documentation that intentionally shows how an
  # administrator can add pam_exec.so login notifications; the binary does
  # not modify PAM configuration itself.
  - id: well-known/app/communication/ntfy::ntfy-binary
  all:
  - id: pam-d-write
  any:
  - id: micro-behaviors/os/pam/auth::pam-optional-control
- id: pam-token-log-stealer
  desc: PAM module captures authentication tokens
  crit: hostile
  conf: 0.98
  for: [elf, so, c, cpp]
  all:
  - id: pam-token-access
  - id: pam-credential-log-path
  any:
  - id: compile-pam-shared-module
  - id: pam-source-tempfile
  - id: micro-behaviors/os/pam/auth::module
- id: pam-response-credential-logger
  desc: PAM authentication hook records a password prompt response
  crit: hostile
  conf: 0.995
  for: [c, cpp]
  all:
  - id: pam-response-password-log-call
  - id: micro-behaviors/os/pam/client::pam-conversation-callback-name
- id: pam-d-write
  desc: PAM config directory reference with write context
  crit: notable
  conf: 0.85
  for: [c, macho, elf, shell, scripts]
  any:
  - id: pam-d-write--rx-1
  - id: pam-d-write--rx-2
  - id: pam-d-write--rx-3
  - id: pam-d-write--rx-4
  - id: pam-d-write--rx-5
  - id: pam-d-write--rx-6
  - id: pam-d-write--rx-7
- id: compile-pam-shared-module
  desc: Compiles PAM shared object module
  crit: suspicious
  conf: 0.94
  for: [elf, c, cpp, shell, scripts]
  any:
  - id: compile-pam-shared-module--rx-8
  - id: compile-pam-shared-module--rx-9
