defaults:
  for:
  - elf
  platforms:
  - linux
  attack: T1556.003
traits:
- id: tmp-hidden-file-dup--rx-1
  desc: Regex component marker
  crit: suspicious
  conf: 0.85
  if:
    type: text
    regex: '(/tmp/|/var/tmp/)\.[A-Za-z0-9._-]*(pass|cred)[A-Za-z0-9._-]*\b'
- id: tmp-hidden-file-dup--rx-2
  desc: Regex component marker
  crit: suspicious
  conf: 0.85
  if:
    type: text
    regex: '(/tmp/|/var/tmp/)\.[A-Za-z0-9._-]*(login|keylog)[A-Za-z0-9._-]*\b'
- id: tmp-hidden-file-dup--rx-3
  desc: Regex component marker
  crit: suspicious
  conf: 0.85
  if:
    type: text
    regex: '(/tmp/|/var/tmp/)\.[A-Za-z0-9._-]*(keystroke|pam)[A-Za-z0-9._-]*\b'
composite_rules:
- id: pam-with-curl
  desc: PAM module with HTTP client capability
  crit: suspicious
  conf: 0.85
  all:
  - id: micro-behaviors/os/pam/auth::module
  any:
  - id: micro-behaviors/communications/http/download/curl::curl-easy-perform
  - id: micro-behaviors/communications/http/download/curl::curl-easy-init
  - id: micro-behaviors/dylib/library/family::libcurl-ref
- id: pam-with-socket
  desc: PAM module with raw socket capability
  crit: suspicious
  conf: 0.85
  all:
  - id: micro-behaviors/os/pam/auth::module
  any:
  - id: micro-behaviors/communications/socket/create::posix-socket-import
  - id: micro-behaviors/communications/socket/connect::connect-symbol
  - id: micro-behaviors/communications/socket/send::send-symbol
  - id: micro-behaviors/communications/socket/send::sendto-symbol
  needs: 2
- id: pam-credential-logger
  desc: PAM module logging credentials to file
  crit: suspicious
  conf: 0.9
  all:
  - id: objectives/credential-access/pam/intercept::interceptor
  any:
  - id: objectives/credential-access/pam/intercept::tmp-hidden-file-dup
  - id: objectives/evasion/file-hiding/staging::suspicious-hidden-log
- id: pam-credential-stealer
  desc: PAM module steals and exfiltrates credentials
  crit: hostile
  conf: 0.95
  mbc: E1003
  all:
  - id: objectives/credential-access/pam/intercept::interceptor
  - id: pam-with-curl
  - id: pam-credential-logger
- id: tmp-hidden-file-dup
  desc: Hidden credential log path
  crit: suspicious
  conf: 0.85
  any:
  - id: tmp-hidden-file-dup--rx-1
  - id: tmp-hidden-file-dup--rx-2
  - id: tmp-hidden-file-dup--rx-3
