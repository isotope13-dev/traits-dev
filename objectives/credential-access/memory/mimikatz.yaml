# Credential extraction from live LSASS process memory.
defaults:
  crit: notable
  conf: 0.99
  platforms: [windows]
  for: [pe, dll]
  attack: "T1003.001"
  mbc: E1003

composite_rules:
  - id: mimilove-lsass-memory-credential-dump
    desc: Mimilove reads LSASS memory for credentials
    all:
      - id: well-known/tool/offensive/mimikatz::mimilove-identity
      - id: micro-behaviors/process/info/name::lsass-executable-reference
      - id: micro-behaviors/mem/read/cross-process::read-process-memory
  - id: mimikatz-credential-memory-dump
    desc: Mimikatz reads process memory for LSA credentials
    crit: hostile
    all:
      - id: well-known/tool/offensive/mimikatz::mimikatz-process-string
      - id: well-known/tool/offensive/mimikatz::mimikatz-error
    any:
      - id: micro-behaviors/mem/read/cross-process::read-process-memory
      - id: micro-behaviors/mem/combined::remote-process-memory-api-cluster
      - id: micro-behaviors/os/privilege/token::open-process-token
      - id: micro-behaviors/process/info/name::lsass-executable-reference
    needs: 2
    unless:
      - id: metadata/file/encoded::powershell-base64-dominated-body
      - id: metadata/lang/scripted::ps-valid
  - id: mimikatz-golden-ticket-capability
    desc: Mimikatz forged Kerberos ticket capability
    crit: hostile
    conf: 0.98
    attack: T1558.001
    all:
      - id: well-known/tool/offensive/mimikatz::kerberos-golden-invocation
    any:
      - id: well-known/tool/offensive/mimikatz::mimikatz-process-string
      - id: well-known/tool/offensive/mimikatz::mimikatz-error
      - id: micro-behaviors/os/security/auth/session::kerberos-protocol-name-reference
    unless:
      - id: metadata/file/encoded::powershell-base64-dominated-body
      - id: metadata/lang/scripted::ps-valid
