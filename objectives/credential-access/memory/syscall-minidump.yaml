defaults:
  platforms: [windows]
  for: [pe, dll]
composite_rules:
  - id: direct-syscall-lsass-minidump
    desc: LSASS minidump references with direct syscall stubs
    crit: hostile
    conf: 0.97
    attack: T1003.001
    all:
      - id: micro-behaviors/os/syscall/raw::windows-x64-syscall-stub
      - id: micro-behaviors/process/info/name::lsass-executable-reference
      - id: micro-behaviors/mem/read/cross-process::nt-read-virtual-memory-reference
    any:
      - id: micro-behaviors/process/debug/dump::minidump-write-dump-name
      - id: micro-behaviors/process/debug/dump::minidump-write-dump-symbol
