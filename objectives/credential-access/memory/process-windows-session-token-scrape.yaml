# Harvesting a live session cookie out of another Windows process's memory.
#
# The Unix sibling (process-token-scrape.yaml) reads /proc/<pid>/mem. A Windows
# script has no procfs, so it opens a chosen process with PROCESS_VM_READ, walks
# the region map, and runs a substring search over each readable page. The
# search needle is cookie-shaped session material: an openid= field followed by
# accesstoken=, the pair an app's own login cookie carries.
#
# The pairing is what convicts. Debuggers, crash handlers and profilers read
# process memory legitimately, and an openid/accesstoken pair appears in code
# that parses its own login cookie. Neither half is evidence of theft alone.
defaults:
  platforms: [windows]
  for: [javascript, typescript]
  attack: T1528
  mbc: B0005

traits:
  - id: session-cookie-token-pair
    desc: Carries an openid and accesstoken cookie pair
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: 'openid=[^\r\n]{0,60}accesstoken='

composite_rules:
  - id: windows-process-memory-session-token-scrape
    desc: Sifts another process's memory for an access-token cookie
    crit: hostile
    conf: 0.95
    # Bind the search to the memory read that feeds it. The read and the
    # cookie pattern sit about 1.2 KB apart in the reviewed sample.
    near_bytes: 4000
    all:
      - id: micro-behaviors/mem/read/cross-process::read-process-memory-text
      - id: session-cookie-token-pair
