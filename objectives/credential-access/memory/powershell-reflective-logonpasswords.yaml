defaults:
  for: [powershell]
  platforms: [windows]
  crit: hostile
  conf: 0.99
  attack: T1003.001

composite_rules:
  - id: powershell-reflective-logonpasswords
    desc: Loads native code with an LSASS password-dump command
    all:
      - id: well-known/tool/offensive/credential-access/mimikatz::logonpasswords-command-literal
      - id: micro-behaviors/dylib/load/memory::powershell-memory-library-loader-call
      - id: micro-behaviors/data/decode/base64/reference::dotnet-frombase64string-text
