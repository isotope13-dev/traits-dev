defaults:
  platforms: [windows]
  for: [go]
composite_rules:
  - id: go-tspkg-credential-decryption
    desc: TSPkg memory reads with LSA decryption
    crit: suspicious
    conf: 0.98
    attack: T1003.001
    # Includes offline dump parsers; does not establish a live LSASS handle.
    all:
      - id: micro-behaviors/os/security/auth/provider::go-tspkg-provider-label
      - id: micro-behaviors/mem/read/arbitrary::go-readva-helper-call
      - id: micro-behaviors/crypto/decrypt::go-lsa-decrypt-helper-call
