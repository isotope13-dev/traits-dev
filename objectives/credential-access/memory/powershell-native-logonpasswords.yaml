# The call relation matters: a quoted command in a log or a separate data
# literal beside an ordinary process invocation must not establish dumping.
defaults:
  for: [powershell]
  platforms: [windows]
  conf: 0.99
  attack: T1003.001
traits:
  - id: powershell-native-logonpasswords
    desc: Invokes native logon-password dumping
    crit: hostile
    if:
      type: tree-sitter
      query: |
        ((command
          command_name: [(command_name) (command_name_expr)] @exe
          command_elements: (command_elements
            [(generic_token) @debug
             (array_literal_expression (unary_expression (string_literal) @debug))]
            [(generic_token) @dump
             (array_literal_expression (unary_expression (string_literal) @dump))]))
          (#match? @exe "(?i)\\.exe['\"]?$")
          (#match? @debug "(?i)^['\"]?privilege::debug['\"]?$")
          (#match? @dump "(?i)^['\"]?sekurlsa::logonpasswords['\"]?$"))
