defaults:
  platforms: [windows]
  for: [pe, dll]
  attack: T1558

traits:
  - id: ticket-extraction-help
    desc: Kerberos ticket-harvesting help text
    crit: notable
    conf: 0.97
    if:
      type: text
      substr: Ticket extraction and harvesting

composite_rules:
  # The Rubeus identity is a known red-team tool. Its ticket harvest and
  # pass-the-ticket help plus the command syntax is the operator surface of
  # Kerberos ticket theft, not a document that names it.
  - id: rubeus-ticket-harvest-and-injection
    desc: Rubeus offers ticket harvesting and pass-the-ticket
    crit: hostile
    conf: 0.99
    attack: T1550.003,T1558
    all:
      - id: well-known/tool/offensive/credential-access/rubeus::rubeus-tool
      - id: ticket-extraction-help
      - id: micro-behaviors/os/security/auth/session::pass-the-ticket-command-syntax
