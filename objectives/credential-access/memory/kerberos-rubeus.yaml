defaults:
  platforms: [windows]
  for: [pe, dll]
  attack: T1558

traits:
  - id: ticket-extraction-help
    desc: Kerberos ticket-harvesting help text
    crit: notable
    conf: 0.97
    if:
      type: text
      substr: Ticket extraction and harvesting

composite_rules:
  - id: rubeus-ticket-harvest-and-injection
    desc: Rubeus offers ticket harvesting and pass-the-ticket
    crit: notable
    conf: 0.99
    attack: T1550.003,T1558
    all:
      - id: well-known/tool/offensive/rubeus::rubeus-tool
      - id: ticket-extraction-help
      - id: micro-behaviors/os/security/auth/session::pass-the-ticket-command-syntax
