# A process-name or credential marker plus proc-memory paths is suspicious
# context. The hostile Python dump patterns additionally require actual stream
# seeking and a bound proc-memory read-to-write chain. Enumeration and
# credential context remain bounded co-occurrences with that chain.
defaults:
  for: [python, javascript]
  platforms: [unix]
  attack: T1003.007

composite_rules:
  - id: proc-memory-cmdline-credential-dump
    for: [python]
    desc: Walks /proc cmdline and dumps process memory
    crit: hostile
    conf: 0.99
    near_bytes: 2048
    all:
      - id: micro-behaviors/mem/read/cross-process::python-proc-region-read-to-write
      - id: micro-behaviors/process/io/stream::python-read-result-to-stream-write
      - id: micro-behaviors/fs/file/seek::python-stream-seek-call
      - id: proc-memory-credential-indications
      - id: micro-behaviors/fs/proc/info/listing::python-proc-enumerate-cmdline
  - id: proc-enumeration-memory-credential-dump
    for: [python]
    desc: Enumerates Linux processes and dumps process memory
    crit: hostile
    conf: 0.95
    near_bytes: 2048
    all:
      - id: micro-behaviors/mem/read/cross-process::python-proc-region-read-to-write
      - id: micro-behaviors/process/io/stream::python-read-result-to-stream-write
      - id: micro-behaviors/fs/file/seek::python-stream-seek-call
      - id: proc-memory-credential-indications
      - id: micro-behaviors/fs/proc/info/listing::python-proc-enumerate
      - id: micro-behaviors/fs/proc/info/path::python-proc-path-join
  - id: proc-memory-credential-indications
    desc: Proc-memory path cluster with credential context
    crit: suspicious
    conf: 0.9
    all:
      - id: micro-behaviors/fs/proc/memory::process-memory-path-cluster
    any:
      - id: well-known/tool/sysadmin/github-runner::worker
      - id: micro-behaviors/data/serialize/schema-credential::secret-record-true-field
      - id: objectives/credential-access/dump/process::python-proc-memory-secret-search
    unless:
      # AI-agent observability tools read /proc to monitor agent processes;
      # security scanners reference these paths as signatures.
      - id: well-known/tool/detection/ai-guardrail/
