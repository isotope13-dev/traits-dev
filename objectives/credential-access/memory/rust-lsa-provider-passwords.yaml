defaults:
  platforms: [windows]
  for: [rust]
  attack: T1003.001
  crit: notable
  conf: 0.95

traits:
  - id: rust-logon-provider-credential-record
    desc: Handles a Windows provider credential record
    if:
      type: text
      regex: '(?i)\b(LiveSsp|WDigest|Tspkg|Kerberos)Credential\b'
  - id: rust-credential-virtual-memory-input
    desc: Receives virtual memory as an input
    if:
      type: text
      regex: ':\s*&\s*(dyn\s+)?(VirtualMemory|ProcessMemoryReader)\b'
  - id: rust-lsa-password-decryption-call
    desc: Invokes LSA password decryption
    if:
      type: symbol
      kind: call
      regex: '(^|::)(decrypt_unicode_string_password(_arch)?|decrypt_lsa_password)$'

composite_rules:
  - id: rust-memory-provider-password-recovery
    desc: Recovers Windows logon provider passwords from virtual memory
    crit: hostile
    conf: 0.98
    all:
      - id: rust-logon-provider-credential-record
      - id: rust-credential-virtual-memory-input
      - id: rust-lsa-password-decryption-call
