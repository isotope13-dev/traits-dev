defaults:
  platforms: [unix, windows]
  for: [python]
traits:
  - id: python-pypykatz-lsa-subprocess
    desc: Runs pypykatz LSA credential extraction
    crit: suspicious
    conf: 0.97
    attack: T1003.001
    if:
      type: tree-sitter
      language: python
      query: |
        ((block
          (expression_statement (assignment left: (identifier) @argv
            right: (list . (string) @tool . (string) @lsa (_)*)))
          . (try_statement body: (block
            (expression_statement (assignment right: (call function: (attribute
              object: (identifier) @module attribute: (identifier) @run)
              arguments: (argument_list . (identifier) @command (_)*))))))) @extraction
          (#match? @tool "^[\"']pypykatz[\"']$")
          (#match? @lsa "^[\"']lsa[\"']$")
          (#eq? @module "subprocess") (#eq? @run "run")
          (#eq? @argv @command))
