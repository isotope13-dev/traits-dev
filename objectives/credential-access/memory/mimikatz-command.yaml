traits:
- id: mimikatz-memory-dump-command-text
  desc: Mimikatz memory-dump command text
  crit: notable
  conf: 0.97
  size_min: 0
  platforms:
  - windows
  for:
  - c
  - cpp
  - batch
  - python
  - javascript
  - powershell
  if:
    type: literal
    # A bare mention of Mimikatz occurs in loader documentation and security
    # prose. Require an actual credential command or command-line form.
    regex: '\bsekurlsa::(logonpasswords|minidump)\b(\\?"\s+nocase)?|\bmimikatz(\.exe)?\s+["'']?\w+::'
    case_insensitive: true
  # Exclude only a command string followed by a YARA nocase modifier.
  # A PowerShell variable assignment alone is not a YARA definition.
  not:
    - regex: '\\?"\s+nocase$'
  unless:
    - id: metadata/build/generated::generated-attack-map-context
    - id: metadata/package/integrity::debian-md5sums-manifest
    # The token listed beside ordinary Windows process names is sample
    # telemetry vocabulary, not the tool: Kibana's endpoint alert generator
    # picks from `['lsass.exe', 'notepad.exe', 'mimikatz.exe',
    # 'powershell.exe', ...]` to render detections. Whoever actually runs
    # Mimikatz does not also enumerate notepad.
    - type: text
      regex: 'mimikatz\.exe[^\n]{0,80}(notepad|explorer|svchost|winword)\.exe'
    - type: text
      regex: '(notepad|explorer|svchost|winword)\.exe[^\n]{0,80}mimikatz\.exe'
