defaults:
  platforms:
  - windows
  for:
  - scripts
  - pe
  - dll
  - c
  - cpp
  - csharp
  - python
  - javascript
  - java
  - go
  - rust
  attack: T1003
composite_rules:
- id: hiberfil-copy-operation
  desc: Copies the Windows hibernation image
  crit: suspicious
  conf: 0.95
  all:
  - id: micro-behaviors/fs/path/system::hiberfil-path-literal
  - id: micro-behaviors/fs/file/copy
  scope: file
- id: plaintext-hiberfile-staging
  desc: Clears dump encryption then stages hiberfil.sys
  crit: hostile
  conf: 0.98
  all:
  - id: micro-behaviors/os/registry/keys/policy::crash-control-registry-path
  - id: micro-behaviors/os/registry/write::dump-filters-value-clear
  - id: hiberfil-copy-operation
  scope: file
