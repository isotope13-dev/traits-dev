defaults:
  for:
  - python
  - shell
  - javascript
  platforms:
  - unix
  attack: T1003.007
composite_rules:
- id: github-runner-process-memory-secret-dump
  desc: Scrapes a GitHub Actions runner process for secrets
  crit: hostile
  conf: 0.99
  attack: T1003.007,T1552.001,T1195.002
  for:
  - source
  - '!clojure'
  - '!elixir'
  - applescript
  - class
  - elf
  - javascript
  - lua
  - macho
  - perl
  - php
  - python
  - ruby
  - shell
  near_lines: 80
  all:
  - id: well-known/tool/sysadmin/github-runner::worker
  - id: micro-behaviors/data/serialize/schema-credential::secret-record-true-field
  unless:
  - id: metadata/package/documentation/security-advisory::threat-intel-label
  any:
  - id: micro-behaviors/fs/proc/memory::process-memory-path-cluster
  - id: micro-behaviors/fs/proc/memory::python-fragmented-proc-memory-dump
  - id: micro-behaviors/data/string/search::shell-secret-record-grep
