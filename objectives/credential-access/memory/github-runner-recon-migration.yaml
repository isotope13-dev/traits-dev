defaults:
  platforms: [unix, windows]
composite_rules:
  - id: github-runner-memory-dumper
    desc: Runner and memory-dump command clues
    crit: suspicious
    conf: 0.95
    for: [scripts, binaries]
    needs: 2
    any:
      - id: micro-behaviors/communications/http/download/curl::memdump-script-download-command
      - id: metadata/lang/source/syntax/command/pipeline::sudo-interpreter-pipeline-text
    all:
      - id: objectives/credential-access/dev-tools/ci::github-actions-targeting
  - id: github-actions-secret-harvest
    desc: Runner or token and memory-dump clues
    crit: hostile
    conf: 0.95
    for: [shell, javascript]
    all:
      - id: micro-behaviors/communications/http/download/curl::memdump-script-download-command
      - id: metadata/lang/source/syntax/command/pipeline::sudo-interpreter-pipeline-text
      - id: objectives/credential-access/dev-tools/ci::github-actions-targeting
