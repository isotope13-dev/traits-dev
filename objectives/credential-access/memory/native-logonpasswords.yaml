defaults:
  platforms: [windows]
  for: [pe, dll]

traits:
  - id: debug-logonpasswords-command
    desc: Debug privilege with logon-password dump command
    crit: suspicious
    conf: 0.98
    attack: T1003.001
    if:
      type: text
      section: any
      regex: '(?i)privilege::debug\s+sekurlsa::logonpasswords\b'
