# Managed LSASS memory access through System.Diagnostics.Process.
#
# Native LSASS scrapers enumerate with the Toolhelp snapshot and open
# C:\Windows\System32\lsass.exe directly (see lsass-memory-scrape in
# windows.yaml). Managed stealers take a different path: they resolve the
# target with Process.GetProcessesByName, enable SeDebugPrivilege, and reach
# across the process boundary with P/Invoke memory APIs. Each leg is neutral
# alone -- process lookup, a privilege name, remote-memory API names -- but
# the five together, aimed at LSASS, establish a credential-dump attempt.
#
# This records co-occurring references, not a bound OpenProcess/ReadProcessMemory
# call pair or a successful dump. Keep it suspicious until runtime success or
# an exfil sink is shown.
defaults:
  platforms: [windows]
  for: [pe, dll]
  attack: T1003.001
  mbc: B0005
composite_rules:
  - id: managed-lsass-memory-scrape
    desc: Managed LSASS-targeted memory access
    crit: suspicious
    conf: 0.93
    all:
      - id: metadata/binary/framework::dotnet-assembly
      - id: micro-behaviors/process/info/name::lsass-target-token
      - id: micro-behaviors/process/enumerate/managed::get-processes-by-name
      - id: micro-behaviors/os/privilege/token::sedebug-privilege-name
      - id: micro-behaviors/mem/combined::remote-process-memory-api-cluster
    unless:
      - id: metadata/signed/platform/
