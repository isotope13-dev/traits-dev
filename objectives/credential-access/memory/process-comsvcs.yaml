# The LSASS target and dump command must occur in one bounded span.
defaults:
  platforms: [windows]
  for: [scripts, binaries]
  attack: T1003.001
composite_rules:
  - id: comsvcs-lsass-credential-dump
    desc: Comsvcs dump command targets LSASS
    crit: hostile
    conf: 0.99
    near_bytes: 256
    all:
      - id: micro-behaviors/mem/read/dump::comsvcs-lsass-memory-dump
      - id: micro-behaviors/process/create/shell/command-mode::tasklist-loop-rundll32-command
    unless:
      - id: metadata/file/format/log::windows-event-csv-records
  # Operators usually resolve the LSASS PID first (tasklist/findstr or
  # Get-Process) and pass it to MiniDump through a variable, so the loop-form
  # composite above never sees `for /f ... do rundll32`.
  - id: comsvcs-minidump-resolved-lsass-pid
    desc: Comsvcs MiniDump follows an LSASS PID lookup
    crit: hostile
    conf: 0.97
    near_bytes: 400
    all:
      - id: micro-behaviors/mem/read/dump::comsvcs-dump
    any:
      - id: micro-behaviors/process/enumerate/shell::tasklist-pipe-findstr-lsass
      - id: micro-behaviors/process/enumerate/shell::for-f-tasklist-lsass-pid-capture
      - id: micro-behaviors/process/enumerate/shell::powershell-get-process-lsass
    unless:
      - id: metadata/file/format/log::windows-event-csv-records
  # Compiled Windows executables resolve the lsass.exe PID via Win32 or .NET
  # process enumeration APIs and launch rundll32 comsvcs.dll MiniDump against it.
  - id: pe-comsvcs-lsass-dump
    desc: Executable enumerates processes and dumps LSASS via comsvcs
    crit: hostile
    conf: 0.98
    for: [pe, dll]
    all:
      - id: micro-behaviors/mem/read/dump::comsvcs-lsass-memory-dump
      - id: micro-behaviors/process/create/exec::child-process-execution
    any:
      - id: micro-behaviors/process/enumerate/managed::dotnet-process-discovery
      - id: micro-behaviors/process/enumerate/snapshot::create-toolhelp32-snapshot
      - id: micro-behaviors/process/enumerate/wmi::win32-process-wql-enumeration
