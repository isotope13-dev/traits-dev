# The LSASS target and dump command must occur in one bounded span.
defaults:
  platforms: [windows]
  for: [scripts, binaries]
  attack: T1003.001
composite_rules:
  - id: comsvcs-lsass-credential-dump
    desc: Comsvcs dump command targets LSASS
    crit: hostile
    conf: 0.99
    near_bytes: 256
    all:
      - id: micro-behaviors/mem/read/dump::comsvcs-lsass-memory-dump
      - id: micro-behaviors/process/create/shell/command-mode::tasklist-loop-rundll32-command
    unless:
      - id: metadata/file/format/log::windows-event-csv-records
