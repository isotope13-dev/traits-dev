# Rubeus-style Kerberos ticket theft without the Rubeus name: walk every
# logon session, pull each session's encoded tickets through the Kerberos
# package, and submit tickets back into a session (pass-the-ticket). Reading
# other sessions' tickets needs a trusted LSA connection or SYSTEM, which is
# why these tools pair it with token theft.
#
# klist enumerates and retrieves but never submits; Kerberos.NET retrieves
# and submits but never walks sessions. P/Invoke binding catalogs (Vanara)
# declare all four names because secur32 exports them, so they are excluded.
defaults:
  platforms: [windows]
  for: [pe, dll, csharp, powershell]
  attack: T1558,T1550.003
  mbc: E1003

composite_rules:
  - id: kerberos-session-ticket-harvest-and-injection
    desc: Harvests Kerberos tickets from all logon sessions and submits tickets
    crit: hostile
    conf: 0.95
    all:
      - id: micro-behaviors/os/security/lsa::lsa-enumerate-logon-sessions-any
      - id: micro-behaviors/os/security/lsa::lsa-call-authentication-package-name
      - id: micro-behaviors/os/security/lsa::kerb-retrieve-ticket-message
      - id: micro-behaviors/os/security/lsa::kerb-submit-ticket-message
    unless:
      - id: well-known/lib/platform/pinvoke-net::pinvoke-binding-assembly
      - id: well-known/lib/platform/vanara::vanara-strong-name-token
