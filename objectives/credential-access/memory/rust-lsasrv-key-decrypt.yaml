defaults:
  platforms: [windows]
  for: [rust]
  attack: T1003.001

traits:
  - id: rust-lsasrv-key-patterns
    desc: Rust references LSASRV key patterns
    crit: notable
    if:
      type: text
      word: 'LSASRV_KEY_PATTERNS'
  - id: rust-lsasrv-memory-extraction
    desc: Rust extracts keys from LSASRV memory
    crit: notable
    if:
      type: text
      regex: '(?s)fn\s+extract_crypto_keys\s*\([^)]{0,200}VirtualMemory[^)]{0,100}lsasrv'
  - id: rust-lsa-credential-decrypt
    desc: Rust decrypts LSA credential blobs
    crit: notable
    if:
      type: text
      regex: 'fn\s+decrypt_credential\s*\([^)]{0,200}CryptoKeys'

composite_rules:
  - id: rust-lsasrv-memory-key-credential-decrypt
    desc: Rust extracts LSASRV keys to decrypt credentials
    crit: hostile
    conf: 0.98
    all:
      - id: rust-lsasrv-key-patterns
      - id: rust-lsasrv-memory-extraction
      - id: rust-lsa-credential-decrypt
