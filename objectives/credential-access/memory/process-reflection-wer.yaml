# Credential access via LSASS process cloning/reflection and Windows Error
# Reporting SilentProcessExit local dump configuration.
defaults:
  platforms: [windows]
  attack: T1003.001
  mbc: B0005

composite_rules:
  - id: lsass-clone-or-snapshot-minidump
    for: [binaries, scripts, source]
    desc: Clones or snapshots LSASS and dumps its memory via MiniDumpWriteDump
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/process/debug/dump::lsass-process-or-query-target
      - id: micro-behaviors/process/attach/rights::process-handle-open-any
      - id: micro-behaviors/process/debug/dump::minidump-write-dump-any
    any:
      - id: micro-behaviors/process/create/fork::windows-process-clone-api-any
      - id: micro-behaviors/process/debug/dump::pss-capture-snapshot-reference
    unless:
      - id: well-known/app/system/microsoft/platform::microsoft-signed-system-component-context
      # LSASS listed among the processes a sandbox must never touch.
      - id: micro-behaviors/process/info/name::protected-system-process-roster

  - id: toolhelp-lsass-full-minidump
    for: [binaries, scripts, source]
    desc: Enumerates LSASS via Toolhelp32 snapshot and writes a full-memory minidump
    crit: hostile
    conf: 0.97
    near_bytes: 4096
    all:
      - id: micro-behaviors/process/debug/dump::toolhelp-snapshot-enum-any
      - id: micro-behaviors/process/info/name::lsass-executable-reference
      - id: micro-behaviors/process/attach/rights::process-handle-open-any
      - id: micro-behaviors/process/debug/dump::minidump-write-dump-any
      - id: micro-behaviors/process/debug/dump::minidump-full-memory-any
    unless:
      - id: well-known/app/system/microsoft/platform::microsoft-signed-system-component-context

  - id: silentprocessexit-lsass-dump-config
    for: [binaries, scripts, source, reg]
    desc: Configures SilentProcessExit local memory dump collection for LSASS
    crit: hostile
    conf: 0.98
    attack: T1003.001,T1546.012
    all:
      - id: micro-behaviors/os/registry/process/reference::silentprocessexit-registry-path-reference
      - id: micro-behaviors/os/registry/process/reference::silentprocessexit-dump-config-value
      - id: micro-behaviors/os/registry/process/write::registry-mutation-surface
    any:
      - id: micro-behaviors/process/info/name::lsass-executable-reference
      - id: micro-behaviors/process/info/name::lsass-target-token
    unless:
      - id: metadata/file/format/log::windows-event-csv-records
      - id: well-known/tool/sysadmin/gflags::gflags-tool-identity
