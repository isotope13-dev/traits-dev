defaults:
  platforms: [openbsd, bsd, unix]
  for: [go, elf]
  attack: T1552.001

traits:
  - id: go-openbsd-mygate-path
    desc: Go OpenBSD mygate path reference
    crit: notable
    conf: 0.94
    if:
      type: text
      substr: /etc/mygate

  - id: go-openbsd-mygate-secret-path
    desc: Go OpenBSD mygate secret path reference
    crit: notable
    conf: 0.96
    if:
      type: text
      substr: /etc/mygate.secret

composite_rules:
  - id: go-openbsd-vpn-config-theft
    desc: OpenBSD network configuration path references
    crit: notable
    conf: 0.98
    needs: 2
    any:
      - id: go-openbsd-mygate-path
      - id: go-openbsd-mygate-secret-path
      - id: micro-behaviors/os/firewall/pf::pf-conf-path
