# SonicWall SMA (SMA1000/SRA) VPN appliances store LDAP directory-service
# credentials inside the WorkPlace policy configuration at
# /usr/local/extranet/etc/policy_file.xml, encrypted under a firmware-wide
# fixed AES key embedded in the ASAPPasswordUtil firmware class. The key is
# constant across the product line, so one recovered key decrypts every
# appliance's stored directory credentials. Observed in the 2026
# CVE-2026-15409 mass-exploitation campaign (Hunt.io), where an
# ldap_extract.py-style tool decrypted Active Directory credentials used
# for follow-on secretsdump/DCSync attacks launched from the appliances.
defaults:
  platforms: [unix, appliance]
  for: [scripts, binaries]
  attack: T1552.001

traits:
  - id: sma-policy-config-path
    desc: SMA appliance LDAP policy configuration path
    crit: suspicious
    conf: 0.94
    if:
      type: text
      regex: '/usr/local/extranet/etc/policy_file\.xml'

  - id: asap-password-util-reference
    desc: ASAPPasswordUtil firmware password utility
    crit: suspicious
    conf: 0.93
    if:
      # The firmware class implementing the policy-file password
      # encryption; tooling referencing it works with the embedded key.
      type: text
      regex: '(?i)\bASAPPasswordUtil\b'

composite_rules:
  - id: sma-policy-credential-decrypt
    desc: Decrypts SMA policy credential store
    crit: hostile
    conf: 0.93
    all:
      - id: sma-policy-config-path
    any:
      - id: micro-behaviors/crypto/symmetric/decrypt/
      - id: micro-behaviors/crypto/symmetric/key::aes-key-hex-assignment
      - id: asap-password-util-reference
