defaults:
  platforms: [openbsd, bsd, unix]
  for: [shell]
  attack: T1552.001
  mbc: E1552

composite_rules:
  - id: openbsd-shell-vpn-secret-harvest
    desc: OpenBSD shell harvests VPN secrets
    crit: hostile
    conf: 0.98
    needs: 2
    any:
      - id: micro-behaviors/fs/path/config/system::openbsd-ipsec-secret-path
      - id: micro-behaviors/fs/path/config/system::bsd-ppp-config-path
      - id: micro-behaviors/fs/path/config/system::openbsd-ssl-private-pem
      - id: micro-behaviors/fs/path/application/vpn::openvpn-path
