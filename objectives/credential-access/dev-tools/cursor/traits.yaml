defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  attack: T1552.001

traits:
- id: cursor-auth-access-token-key
  desc: Cursor access token key
  # A bare storage key does not establish that code reads or steals the token.
  # The composites below add the SQLite/process/transport evidence needed to
  # infer credential access or exfiltration.
  crit: component
  conf: 0.98
  if:
    type: text
    substr: cursorAuth/accessToken
  unless:
  - id: metadata/package/quality/benign-context::openchamber-credential-import-context
  - id: metadata/package/quality/benign-context::openchamber-extension-manager-context
  - id: well-known/app/ai/usage/vibe-cafe-vibe-usage::vibe-usage-archive-context
  - id: well-known/app/ai/usage/vibe-cafe-vibe-usage::vibe-usage-cursor-source-context
  - id: well-known/app/ai/usage/cursor-token-monitor::cursor-token-monitor-context
  - id: well-known/app/ai/usage/openusage-cli::openusage-cli-archive-context
  - id: well-known/app/ai/usage/openusage-cli::openusage-cursor-plugin-context
  - id: well-known/app/ai/usage/ai-box::ai-box-extension-context
  # Cursor's own usage endpoint is the destination for this token in a
  # usage/rate-limit client, not an exfiltration destination.
  - type: text
    substr: api2.cursor.sh/aiserver.v1.DashboardService/GetCurrentPeriodUsage

- id: cursor-auth-refresh-token-key
  desc: Cursor refresh token key
  crit: component
  conf: 0.98
  if:
    type: text
    substr: cursorAuth/refreshToken
  unless:
  - id: metadata/package/quality/benign-context::openchamber-credential-import-context
  - id: metadata/package/quality/benign-context::openchamber-extension-manager-context
  - id: well-known/app/ai/usage/cursor-token-monitor::cursor-token-monitor-context
  - id: well-known/app/ai/usage/openusage-cli::openusage-cli-archive-context
  - id: well-known/app/ai/usage/openusage-cli::openusage-cursor-plugin-context
  - id: well-known/app/ai/usage/ai-box::ai-box-extension-context

- id: cursor-state-vscdb-path
  desc: Cursor state database path
  crit: notable
  conf: 0.95
  for: [scripts, source]
  if:
    type: text
    regex: 'Cursor[\s\S]{0,160}state\.vscdb'

- id: cursor-itemtable-value-query
  desc: Cursor auth-key ItemTable query
  crit: notable
  conf: 0.95
  for: [scripts, source]
  if:
    type: text
    regex: "(?i)SELECT\\s+key,\\s*value\\s+FROM\\s+ItemTable\\s+WHERE\\s+key\\s+LIKE\\s+['\"]%?cursorAuth[/%]"

- id: cursor-auth-sqlite-reader-function
  desc: Cursor auth state SQLite reader function
  crit: notable
  conf: 0.99
  if:
    type: symbol
    kind: function
    exact: readStateFromSqlite

- id: cursor-state-database-discovery-function
  desc: Cursor state database discovery function
  crit: notable
  conf: 0.99
  if:
    type: symbol
    kind: function
    exact: findStateVscdb

- id: cursor-auth-key-list-identifier
  desc: Cursor authentication key list identifier
  crit: notable
  conf: 0.99
  if:
    type: symbol
    kind: identifier
    exact: CURSOR_AUTH_KEYS

composite_rules:
- id: cursor-auth-namespace-sqlite-extraction
  desc: Extracts Cursor auth namespace from its state database
  crit: suspicious
  conf: 0.99
  for: [scripts, source]
  all:
  - id: cursor-state-vscdb-path
  - id: cursor-itemtable-value-query
  unless:
  - id: metadata/package/quality/benign-context::openchamber-credential-import-context
  - id: metadata/package/quality/benign-context::openchamber-extension-manager-context
  - id: well-known/app/ai/usage/claude-code-exporter::claude-code-exporter-cursor-context
  - id: well-known/app/ai/usage/cursor-token-monitor::cursor-token-monitor-context
  - id: well-known/app/ai/usage/openusage-cli::openusage-cli-archive-context
  - id: well-known/app/ai/usage/openusage-cli::openusage-cursor-plugin-context
  - id: well-known/app/ai/usage/ai-box::ai-box-extension-context

- id: cursor-extension-auth-store-access
  desc: VS Code extension extracts Cursor authentication records
  crit: hostile
  conf: 0.99
  attack: T1552.001,T1005
  all:
  - id: cursor-auth-namespace-sqlite-extraction
  - id: metadata/library/vscode::vscode-extension-marker
  unless:
  - id: metadata/package/quality/benign-context::openchamber-credential-import-context
  - id: metadata/package/quality/benign-context::openchamber-extension-manager-context
  - id: well-known/app/ai/usage/cursor-token-monitor::cursor-token-monitor-context
  - id: well-known/app/ai/usage/openusage-cli::openusage-cli-archive-context
  - id: well-known/app/ai/usage/openusage-cli::openusage-cursor-plugin-context
  - id: well-known/app/ai/usage/ai-box::ai-box-extension-context

- id: cursor-auth-token-reader-with-process
  desc: Cursor auth tokens read through an SQLite process helper
  crit: hostile
  conf: 0.99
  attack: T1552.001,T1005,T1027
  all:
  - id: cursor-auth-access-token-key
  - id: cursor-auth-refresh-token-key
  - id: cursor-auth-sqlite-reader-function
  - id: micro-behaviors/process/create/shell/bridge::child-process-compiled-computed-call
  any:
  - id: cursor-auth-key-list-identifier
  - id: cursor-state-database-discovery-function

- id: cursor-auth-token-sqlite-extraction
  desc: Cursor auth token SQLite extraction
  crit: suspicious
  conf: 0.99
  all:
  - id: cursor-auth-access-token-key
  - id: cursor-auth-refresh-token-key
  - id: cursor-state-vscdb-path
  - id: cursor-itemtable-value-query
  any:
  - id: micro-behaviors/os/sysinfo/machine-id::machineid-identifier-field
  - id: micro-behaviors/data/db/sql::sql-select
  - id: micro-behaviors/process/create/shell/bridge::js-execsync
  unless:
  - id: metadata/package/quality/benign-context::openchamber-credential-import-context
  - id: metadata/package/quality/benign-context::openchamber-extension-manager-context
  - id: well-known/app/ai/usage/claude-code-exporter::claude-code-exporter-cursor-context
  - id: well-known/app/ai/usage/cursor-token-monitor::cursor-token-monitor-context
  - id: well-known/app/ai/usage/openusage-cli::openusage-cli-archive-context
  - id: well-known/app/ai/usage/openusage-cli::openusage-cursor-plugin-context
  - id: well-known/app/ai/usage/ai-box::ai-box-extension-context
