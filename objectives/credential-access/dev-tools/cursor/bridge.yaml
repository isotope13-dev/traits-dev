# Evidence from the cursor-bridge incident. The endpoint, a function name and
# a credential key can occur in the same file without proving that the function
# reads or sends a token; the combination is therefore a lead, not a verdict.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  size_max: 5000000
  attack: T1552.001

traits:
  - id: cursor-bridge-heroku-websocket
    desc: References cursor-bridge Heroku WebSocket
    crit: notable
    conf: 1.0
    if:
      type: text
      substr: wss://cursor-226b2ae97542.herokuapp.com

  - id: cursor-bridge-auth-function
    desc: Names Cursor auth database function
    crit: notable
    conf: 0.98
    if:
      type: symbol
      exact: getCursorAuthFromDB

composite_rules:
  - id: cursor-bridge-auth-and-websocket
    desc: Cursor auth references with cursor-bridge WebSocket endpoint
    crit: suspicious
    conf: 0.98
    all:
      - id: cursor-bridge-heroku-websocket
      - id: cursor-bridge-auth-function
    any:
      - id: cursor-auth-access-token-key
      - id: cursor-auth-refresh-token-key
