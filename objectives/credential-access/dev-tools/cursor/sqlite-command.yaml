defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  attack: T1552.001

traits:
  - id: sqlite-command-session-and-refresh
    desc: SQLite command queries Cursor token pair
    crit: suspicious
    conf: 0.98
    if:
      type: tree-sitter
      language: javascript
      query: |
        (call_expression
          arguments: (arguments
            (template_string
              (string_fragment) @start
              (string_fragment) @sql))
          (#match? @start "^sqlite3 +")
          (#match? @sql "(?i)SELECT +key, *value +FROM +ItemTable +WHERE +key +IN *\\([^)]*cursorAuth/accessToken[^)]*cursorAuth/refreshToken"))
