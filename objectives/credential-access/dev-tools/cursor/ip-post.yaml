# File-wide co-occurrence cannot prove theft: analytics bundles authenticate to
# Cursor and separately upload usage to their own service. Require a local
# credential query and transport span; this still signals risk, not data flow.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  attack: T1552.001
traits:
- id: cursor-access-token-select
  desc: SQLite SELECT targets Cursor access token
  crit: notable
  conf: 0.99
  if:
    type: literal
    regex: "(?i)SELECT\\s+value\\s+FROM\\s+ItemTable\\s+WHERE\\s+key\\s*=\\s*['\"]cursorAuth/accessToken\\b"
composite_rules:
- id: cursor-token-query-near-ip-post
  desc: Cursor token query/IP POST co-occurrence
  crit: suspicious
  conf: 0.9
  near_bytes: 2048
  all:
  - id: cursor-access-token-select
  - id: micro-behaviors/communications/ip/literal::javascript-external-http-ip-url
  - id: micro-behaviors/communications/http/request/json::http-post-json
  - id: micro-behaviors/communications/http/request/client::js-fetch-call
