# Credential Access - Dev Tools
# ATT&CK: T1552.001 (Unsecured Credentials: Credentials In Files)
defaults:
  platforms: [linux, macos, windows, unix, android, ios]
  attack: "T1552.001"
  crit: suspicious
composite_rules:
  - id: jfrog-credential-theft
    desc: JFrog CLI credential extraction
    conf: 1.0
    for: [javascript, typescript, shell, python]
    all:
      - id: micro-behaviors/process/create/shell/build::jfrog-cli-export
      - id: micro-behaviors/data/encode/base64/

  - id: artifactory-cluster-join-key-read
    desc: Reads Artifactory cluster join key over API
    # The join key is the shared secret Artifactory nodes use to register with
    # one another (Wiz, Sept 2026); operators pulled it straight from the
    # join-key API after taking over an instance. Legitimate rotation tooling
    # can hit the same route, so correlate with the requesting context.
    conf: 0.92
    for: [scripts, source]
    platforms: [unix, windows]
    attack: "T1552.001,T1552.007"
    all:
      - id: micro-behaviors/communications/http/services/artifactory::join-key-route
      - id: micro-behaviors/communications/http/lib/requests::requests-get
    any:
      - id: micro-behaviors/communications/http/get/
      - id: micro-behaviors/communications/http/curl/
      - id: micro-behaviors/communications/http/lib/requests/

  - id: artifactory-system-configuration-read
    desc: Reads Artifactory system configuration over API
    # The system configuration document carries the deployment's secrets
    # (database, proxy, integration credentials) in addition to topology;
    # every CVE-2026-82329 operator Wiz observed read it after minting an
    # admin token. Operations automation polls this route during upgrades,
    # so treat an unpaired hit as an audit lead.
    conf: 0.85
    for: [scripts, source]
    platforms: [unix, windows]
    attack: "T1552.001,T1087.003"
    all:
      - id: micro-behaviors/communications/http/services/artifactory::system-configuration-route
      - id: micro-behaviors/communications/http/lib/requests::requests-get
    any:
      - id: micro-behaviors/communications/http/get/
      - id: micro-behaviors/communications/http/curl/
      - id: micro-behaviors/communications/http/lib/requests/
