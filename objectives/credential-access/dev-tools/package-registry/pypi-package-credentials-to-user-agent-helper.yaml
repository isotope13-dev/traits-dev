defaults:
  platforms:
    - unix
    - windows
  crit: notable
  for:
    - python
composite_rules:
  - id: objectives/credential-access/dev-tools/package-registry::pypi-package-credentials-to-user-agent-helper
    desc: Package passes key fields to user agent helper
    crit: suspicious
    conf: 0.99
    for: [python-sdist, python]
    scope: archive
    all:
      - id: metadata/import/module::python-user-agent-helper-import
      - id: metadata/lang/source/syntax/call/member::python-user-agent-helper-key-pair
      - id: metadata/build/pip::setup-py
