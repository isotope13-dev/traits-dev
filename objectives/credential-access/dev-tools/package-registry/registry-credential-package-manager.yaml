defaults:
  platforms:
  - unix
  - windows
  for:
  - scripts
  - binaries
  crit: suspicious
  attack: T1552.001
composite_rules:
- id: supply-chain-credential-theft
  desc: Registry credential access or export clues
  crit: suspicious
  conf: 0.98
  mbc: E1552
  any:
  - id: objectives/exfiltration/stealer/credential/file::pypi-credential-theft
  - id: objectives/exfiltration/stealer/credential/value::cargo-credential-theft
  - id: micro-behaviors/os/security/auth/secret::gem-credential-theft-comp
