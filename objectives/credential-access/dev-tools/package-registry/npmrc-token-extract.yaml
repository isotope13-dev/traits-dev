defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  attack: T1552.001

traits:
  - id: npmrc-module-level-pattern-match
    desc: Module-level pattern match on .npmrc contents
    crit: notable
    conf: 0.96
    if:
      type: symbol
      kind: call
      module_level: true
      regex: '\.(match|matchAll|replace|split)$'
      receiver:
        from:
          call: '(^|\.)readFile(Sync)?$'
          literal: '(^|[/\\])\.npmrc$'
          through:
            - call: '(^|\.)(join|resolve)$'
              arguments: [0, 1, 2, 3]
            - call: '\.(toString|trim)$'
              receiver: true

composite_rules:
  - id: node-module-load-npmrc-authtoken-extract
    desc: Extracts _authToken from .npmrc at module load
    crit: hostile
    conf: 0.98
    near_bytes: 512
    all:
      - id: npmrc-module-level-pattern-match
      - id: micro-behaviors/os/package-manager/config::node-auth-token-token
      - id: micro-behaviors/fs/path/hidden::node-homedir-hidden-entry
