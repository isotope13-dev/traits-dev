defaults:
  for: [manifests]
  platforms: [windows, unix]
  size_min: 100
  size_max: 1048576
traits:
  - id: npmrc-credential-read
    desc: Lifecycle hook reads .npmrc credentials
    crit: suspicious
    conf: 0.98
    attack: T1552.001
    if:
      type: text
      regex: "cat\\s+(~|/root|/home/[^/\\s]{1,60})/\\.npmrc"
    unless:
      - id: well-known/tool/detection/tracebit::community-action-step
      - id: micro-behaviors/os/package-manager/publish::npm-publish-command
      # Guardrail prose quotes the command as a prohibition ("do not run
      # `cat ~/.npmrc`; no registry credentials are required") — CI policy
      # for agents, the opposite of a credential read.
      - type: text
        regex: '(?i)do\s+not\s+(run\s+)?[`"'']?(cat\s+)?(~|/root)/\.npmrc'
      - type: text
        regex: '(?i)(don''t|never)\s+(cat\s+)?(~/|/home/[^/\s]{1,60}/)\.npmrc'

      - id: metadata/file/catalog/pattern-rules::cleave-trait-definition-file
