defaults:
  platforms: [windows, linux]
  for: [npm, tar]

composite_rules:
  - id: npm-install-hook-credential-store-clues
    platforms: [windows, linux, android]
    desc: npm install hook and credential store clues
    crit: suspicious
    conf: 0.97
    scope: archive
    for: [binaries, source, manifests, documents, media, data, scripts, '!jcl', npm, tar]
    all:
      - id: metadata/package/scripts/lifecycle::install-hooks
    any:
      - id: objectives/credential-access/dev-tools/application::multi-app-credential-stealer
      - id: objectives/credential-access/discord/token::native-discord-local-token-harvester
