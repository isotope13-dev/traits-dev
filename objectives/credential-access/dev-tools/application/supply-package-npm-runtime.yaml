# NPM install-hook credential theft.
#
# Archive membership alone does not connect a lifecycle script to a payload.
# Environment exfiltration is reported by the canonical file-level traits in
# objectives/exfiltration/stealer/env, without duplicate hook wrappers.
defaults:
  crit: hostile
  conf: 0.99
  platforms: [windows, linux]
  for: [npm]
  attack: "T1195.002,T1552.001,T1552.004,T1041"
  mbc: E1552,E1041

composite_rules:
  - id: objectives/credential-access/dev-tools/application::npm-install-hook-multi-app-credential-stealer
    desc: Install hook and multiple credential-store clues
    crit: suspicious
    scope: archive
    platforms: [windows, linux, android]
    for: [binaries, source, manifests, documents, media, data, scripts, '!jcl', npm]
    all:
      - id: metadata/package/scripts/lifecycle::install-hooks
      - id: objectives/credential-access/dev-tools/application::multi-app-credential-stealer
