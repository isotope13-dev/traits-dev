# Veeam Backup & Replication stores managed credentials in its SQL Server
# configuration database. Ransomware affiliates query this table and use
# DPAPI to recover reusable backup, hypervisor, and domain credentials.
# A decryptor's filename is identity evidence, not evidence of decryption.
defaults:
  platforms: [windows]
  for: [scripts, source, binaries]
  attack: T1555
  mbc: B0028

traits:
  - id: veeam-credential-table-select
    desc: Selects records from Veeam credential store
    crit: suspicious
    conf: 0.97
    if:
      type: text
      regex: '(?is)\bSELECT\b.{0,600}\bFROM\s+\[?VeeamBackup\]?\.\[?dbo\]?\.\[?Credentials\b\]?'

composite_rules:
  - id: veeam-configured-credential-query
    desc: Queries credential records with Veeam configuration
    crit: suspicious
    conf: 0.96
    all:
      - id: well-known/app/infrastructure/veeam::configuration-reference
      - id: micro-behaviors/data/db/read/records::dbo-credentials-from
      - id: micro-behaviors/data/db/read/column::password-column-select
    near_bytes: 3000

  - id: veeam-stored-credential-decryption
    desc: Veeam credential query with DPAPI recovery
    crit: suspicious
    conf: 0.97
    all:
      - id: micro-behaviors/os/security/dpapi::unprotect-api
    any:
      - id: veeam-credential-table-select
      - id: veeam-configured-credential-query
    near_bytes: 4000

  - id: veeam-credential-records-file-export
    desc: Exports Veeam credential records into file
    crit: hostile
    conf: 0.98
    for: [powershell]
    all:
      - id: veeam-credential-table-select
      - id: micro-behaviors/data/format/csv/export::powershell-convertto-csv-call
      - id: micro-behaviors/fs/write/file/redirect::out-file
    near_bytes: 3000

  - id: veeam-credential-store-cli-access
    for: [source, '!objectivec', batch, javascript, lua, perl, php, powershell, python, ruby, vbs]
    desc: Queries Veeam credential store through SQL client
    crit: suspicious
    conf: 0.97
    all:
      - id: veeam-credential-table-select
      - id: micro-behaviors/data/db/access::sqlserver-cli-client
    near_bytes: 3000
