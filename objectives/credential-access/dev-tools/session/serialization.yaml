defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  conf: 0.98
composite_rules:
  - id: serializer-extension-identity-rewrite
    desc: Serializer patch rewrites extension identity
    crit: suspicious
    near_bytes: 4096
    all:
      - id: micro-behaviors/process/hook/instrumentation::stringify-function-reassigned
      - id: micro-behaviors/data/property/assign::conditional-indexed-extension-identity-rewrite
  - id: silent-auth-session-with-identity-rewrite
    desc: Silent session request with identity tampering
    crit: suspicious
    near_bytes: 8192
    all:
      - id: serializer-extension-identity-rewrite
      - id: micro-behaviors/os/security/auth/session::editor-silent-existing-auth-session-request
  # The serializer rewrite targets an extension identity while requesting an
  # existing session. An access-token reference and authenticated GitHub API
  # request alongside that combination turn the tampering into a credential
  # access attempt. The match does not assert that the request succeeded.
  - id: identity-rewrite-silent-session-github-request
    desc: Identity rewrite and silent session with GitHub
    crit: hostile
    conf: 0.96
    attack: T1550,T1036
    near_bytes: 8192
    all:
      - id: silent-auth-session-with-identity-rewrite
      - id: metadata/lang/source/naming/setting::access-token-camel-name-text
      - id: micro-behaviors/communications/http/token-auth::github-api-token-live-check
