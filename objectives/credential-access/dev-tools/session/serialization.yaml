defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  conf: 0.98
composite_rules:
  - id: serializer-extension-identity-rewrite
    desc: Serializer patch rewrites extension identity
    crit: suspicious
    near_bytes: 4096
    all:
      - id: micro-behaviors/process/hook/instrumentation::stringify-function-reassigned
      - id: micro-behaviors/data/property/assign::conditional-indexed-extension-identity-rewrite
  - id: silent-auth-session-with-identity-rewrite
    desc: Silent session request with identity tampering
    crit: suspicious
    near_bytes: 8192
    all:
      - id: serializer-extension-identity-rewrite
      - id: micro-behaviors/os/security/auth/session::editor-silent-existing-auth-session-request
