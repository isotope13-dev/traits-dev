# Native import tables and string pools do not preserve source proximity.
# This is a file-wide co-occurrence, not a bound read or proof of theft.
defaults:
  platforms: [unix, windows]
  for: [binaries]
  attack: T1552.001

composite_rules:
  - id: native-multi-ai-auth-paths-with-file-read
    desc: Native file reads coexist with cross-agent authentication paths
    crit: suspicious
    conf: 0.97
    all:
      - id: micro-behaviors/fs/read/file/full::file-content-read-operation
    needs: 3
    any:
      - id: micro-behaviors/fs/path/credential::codex-auth-artifact-path
      - id: micro-behaviors/fs/path/credential::claude-auth-artifact-path
      - id: micro-behaviors/fs/path/credential::copilot-hosts-auth-artifact-path
      - id: micro-behaviors/fs/path/token::kiro-sso-auth-artifact-path
      - id: micro-behaviors/fs/path/password-store::gemini-workspace-auth-artifact-path
