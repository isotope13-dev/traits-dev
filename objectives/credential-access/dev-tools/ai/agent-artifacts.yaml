# Collection of local AI-agent authentication, configuration, and session
# artifacts. The path atoms are neutral; intent is inferred only when they are
# paired with filesystem enumeration, content reads, or transfer.
defaults:
  platforms: [unix, windows]
  for: [scripts, binaries, source, javascript, typescript, python, powershell, shell, go, rust, c, cpp]
  attack: T1005,T1041,T1552.001

composite_rules:
  - id: ai-agent-auth-artifact-target
    desc: Targets a local AI-agent authentication artifact
    # A path target is a capability, not evidence of credential theft.  The
    # hostile outcome is reserved for the read-plus-transfer composite below.
    crit: notable
    conf: 0.96
    any:
      - id: micro-behaviors/fs/path/agent-artifacts/auth

  - id: ai-agent-auth-and-session-access
    desc: Targets authentication artifacts while reading session stores
    crit: suspicious
    conf: 0.96
    all:
      - id: ai-agent-auth-artifact-target
      - id: objectives/collection/app-data/session::ai-agent-session-artifact-read

  - id: ai-agent-artifact-sweep
    desc: Enumerates multiple AI-agent artifact families
    crit: suspicious
    conf: 0.97
    near_bytes: 4096
    all:
      - id: ai-agent-auth-and-session-access
      - id: micro-behaviors/fs/path/application/config::ai-coding-tool-config-directory-cluster
    any:
      - id: micro-behaviors/fs/enumerate/directory::node-readdir-sync-call
      - id: micro-behaviors/fs/directory/traverse::traverse-rglob-call
      - id: micro-behaviors/fs/directory/traverse::traverse-walk-call
      - id: micro-behaviors/fs/enumerate/directory::powershell-recursive-file-enumeration

  - id: ai-agent-auth-artifact-read
    desc: Reads a local AI-agent authentication artifact
    # Reading a local artifact is dual-use.  It becomes hostile only when the
    # upload composite proves collection followed by transfer.
    crit: notable
    conf: 0.98
    attack: T1005,T1552.001
    near_bytes: 4096
    all:
      - id: ai-agent-auth-artifact-target
    any:
      - id: micro-behaviors/fs/file/read::file-content-read-operation
      - id: micro-behaviors/fs/read/file::python-pathlib-read-bytes
      - id: micro-behaviors/fs/read/file::python-pathlib-read-text
      - id: micro-behaviors/fs/read/file::get-content
      - id: micro-behaviors/fs/file/read::dotnet-readallbytes-token

  # HTTP POST alone is not AI-agent exfil — require a paired artifact read.
  # (A prior intermediate that was only "any HTTP POST client" falsely labeled
  # every fetch/requests POST as credential-access AI exfil.)
  - id: ai-agent-artifact-upload
    desc: Uploads collected AI-agent authentication artifacts in an HTTP body
    crit: hostile
    conf: 0.99
    near_bytes: 8192
    all:
      - id: ai-agent-auth-artifact-read
      - id: micro-behaviors/communications/http/request/client/
    any:
      - id: micro-behaviors/communications/http/request/body::oauth-token-field-in-body
      - id: objectives/exfiltration/sensitive-data::json-stringify-creds-body
      - id: objectives/exfiltration/sensitive-data::http-body-credential-variable
      - id: objectives/exfiltration/sensitive-data::request-write-secret-variable

  - id: ai-agent-session-artifact-upload
    desc: Uploads collected AI-agent session artifacts in an HTTP body
    crit: hostile
    conf: 0.99
    near_bytes: 8192
    all:
      - id: objectives/collection/app-data/session::ai-agent-session-artifact-read
      - id: micro-behaviors/communications/http/request/client/
    any:
      - id: objectives/exfiltration/sensitive-data::json-stringify-file-data-body
      - id: objectives/exfiltration/sensitive-data::http-body-raw-data-variable
      - id: objectives/exfiltration/sensitive-data::request-write-content-file-variable

  # Blacklight-class static catalogs hard-code high-value auth and session paths
  # across multiple vendor agent homes, then walk the filesystem to collect them.
  # A single-product manager only knows one family's layout; the cross-tool
  # catalog is the post-exploitation reconnaissance shape.
  - id: ai-agent-cross-tool-artifact-catalog
    desc: Cross-tool AI-agent auth and session path catalog
    crit: hostile
    conf: 0.98
    attack: T1005,T1083,T1552.001
    near_bytes: 8192
    all:
      - id: micro-behaviors/fs/path/agent-artifacts/auth::codex-auth-artifact-path
      - id: micro-behaviors/fs/path/agent-artifacts/auth::claude-auth-artifact-path
      - id: micro-behaviors/fs/path/agent-artifacts/sessions::cursor-chat-store-artifact-path
      - id: micro-behaviors/fs/path/agent-artifacts/sessions::antigravity-session-store-artifact-path
    any:
      - id: micro-behaviors/fs/enumerate/directory::node-readdir-sync-call
      - id: micro-behaviors/fs/directory/traverse::traverse-rglob-call
      - id: micro-behaviors/fs/directory/traverse::traverse-walk-call
      - id: micro-behaviors/fs/enumerate/directory::powershell-recursive-file-enumeration
