# Collection of local AI-agent authentication, configuration, and session
# artifacts. The path atoms are neutral; intent is inferred only when they are
# paired with filesystem enumeration, content reads, or transfer.
defaults:
  platforms: [unix, windows]
  for: [scripts, binaries, source]
  attack: T1005,T1041,T1552.001

composite_rules:

  - id: ai-agent-artifact-sweep
    for: [shell, python, javascript]
    desc: Enumerates multiple AI-agent artifact families
    crit: suspicious
    conf: 0.97
    near_bytes: 4096
    all:
      - id: micro-behaviors/fs/read/file/target::ai-agent-auth-and-session-path-reads
      - id: micro-behaviors/fs/path/agent-config/directory::ai-coding-tool-config-directory-cluster
    any:
      - id: micro-behaviors/fs/directory/readdir::node-readdir-sync-call
      - id: micro-behaviors/fs/directory/traverse::traverse-rglob-call
      - id: micro-behaviors/fs/directory/traverse::traverse-walk-call
      - id: micro-behaviors/fs/directory/traverse::powershell-recursive-file-enumeration
    unless:
      # CodeAM CLI is a session-continuity bridge for coding agents: reading
      # the user's own Codex/Claude session stores is its stated function.
      - id: well-known/app/development/codeam-cli::codeam-cli-bundle-content-context
      - id: well-known/app/ai/coding-agent/jcode::jcode-cli-context

  - id: multi-ai-agent-auth-artifact-catalog
    desc: Reads authentication artifacts for multiple AI agents
    crit: hostile
    conf: 0.99
    attack: T1005,T1552.001
    near_bytes: 8192
    all:
      - id: micro-behaviors/fs/read/file/full::file-content-read-operation
    needs: 3
    any:
      - id: micro-behaviors/fs/path/credential::codex-auth-artifact-path
      - id: micro-behaviors/fs/path/credential::claude-auth-artifact-path
      - id: micro-behaviors/fs/path/credential::copilot-hosts-auth-artifact-path
      - id: micro-behaviors/fs/path/credential::kiro-sso-auth-artifact-path
      - id: micro-behaviors/fs/path/password-store::gemini-workspace-auth-artifact-path
    unless:
      # Legitimate coding-agent harnesses and session bridges manage or link
      # credentials for multiple AI agents across seats and sessions.
      - id: well-known/app/ai/coding-agent/jcode::jcode-cli-context
      - id: well-known/app/development/codeam-cli::codeam-cli-bundle-content-context
  - id: multi-ai-agent-config-artifact-catalog
    desc: Reads sensitive configuration artifacts for multiple AI agents
    crit: hostile
    conf: 0.99
    attack: T1005,T1552.001
    near_bytes: 8192
    all:
      - id: micro-behaviors/fs/read/file/full::file-content-read-operation
    needs: 3
    any:
      - id: micro-behaviors/fs/path/config/app::claude-root-config-artifact-path
      - id: micro-behaviors/fs/path/config/app::codex-sensitive-config-artifact-path
      - id: micro-behaviors/fs/path/config/app::copilot-config-artifact-path
      - id: micro-behaviors/fs/path/config/app::gemini-sensitive-config-artifact-path
      - id: micro-behaviors/fs/path/config/app::codeium-config-artifact-path
    unless:
      # Legitimate coding-agent harnesses and session bridges manage or link
      # credentials for multiple AI agents across seats and sessions.
      - id: well-known/app/ai/coding-agent/jcode::jcode-cli-context
      - id: well-known/app/development/codeam-cli::codeam-cli-bundle-content-context
  - id: multi-ai-agent-credential-collection-catalog
    desc: Collects cross-vendor AI-agent authentication and configuration stores
    crit: hostile
    conf: 0.99
    attack: T1005,T1552.001
    all:
      - id: multi-ai-agent-auth-artifact-catalog
      - id: multi-ai-agent-config-artifact-catalog

  # HTTP POST alone is not AI-agent exfil — require a paired artifact read.
  # (A prior intermediate that was only "any HTTP POST client" falsely labeled
  # every fetch/requests POST as credential-access AI exfil.)
  - id: ai-agent-artifact-upload
    desc: Uploads collected AI-agent authentication artifacts in an HTTP body
    crit: hostile
    conf: 0.99
    near_bytes: 8192
    all:
      - id: micro-behaviors/fs/read/file/target::ai-agent-auth-path-near-file-read
      - id: micro-behaviors/communications/http/client/exchange::http-client-markers-or-response-stream
    any:
      - id: micro-behaviors/communications/http/request/body::oauth-token-reference-in-body
      - id: micro-behaviors/data/serialize/json::json-stringify-creds-body
      - id: "metadata/lang/source/syntax/key-value::body-field-credential-variable"
      - id: objectives/exfiltration/sensitive-data/source::request-write-secret-variable
    unless:
      # A usage/quota client that reads its own locally-stored OAuth token and
      # sends it back to the token's own first-party issuing endpoint (e.g. a
      # standard refresh_token grant) is round-tripping the credential to its
      # rightful owner, not exfiltrating it to a third party. Claude Code's
      # issuer lives on platform.claude.com; older builds used
      # console.anthropic.com — both are the same first-party token endpoint.
      # Kiro gateways refresh the local SSO token against Kiro's own issuer
      # and AWS IAM Identity Center OIDC -- same first-party round-trip.
      - id: micro-behaviors/communications/http/services/openai::oauth-token-endpoint
      - id: micro-behaviors/communications/http/services/openai::authentication-host
      - id: micro-behaviors/communications/http/services/anthropic::oauth-token-endpoint
      - id: micro-behaviors/communications/http/services/anthropic::claude-platform-oauth-token-endpoint
      - id: micro-behaviors/communications/http/services/kiro::desktop-social-refresh-endpoint
      - id: micro-behaviors/communications/http/services/aws::oidc-regional-token-endpoint

  - id: ai-agent-session-artifact-upload
    desc: Uploads collected AI-agent session artifacts in an HTTP body
    crit: hostile
    conf: 0.99
    near_bytes: 8192
    all:
      - id: micro-behaviors/fs/read/file/target::ai-agent-session-path-near-file-read
      - id: micro-behaviors/communications/http/client/exchange::http-client-markers-or-response-stream
    any:
      - id: micro-behaviors/data/serialize/json::json-stringify-file-data-body
      - id: micro-behaviors/communications/http/request/body::raw-data-variable
      - id: micro-behaviors/communications/http/request/body::request-write-post-content-variable

  # Blacklight-class static catalogs hard-code high-value auth and session paths
  # across multiple vendor agent homes, then walk the filesystem to collect them.
  # A single-product manager only knows one family's layout; the cross-tool
  # catalog is the post-exploitation reconnaissance shape.
  - id: ai-agent-cross-tool-artifact-catalog
    desc: Cross-tool AI-agent auth and session path catalog
    crit: hostile
    conf: 0.98
    attack: T1005,T1083,T1552.001
    near_bytes: 8192
    all:
      - id: micro-behaviors/fs/path/credential::codex-auth-artifact-path
      - id: micro-behaviors/fs/path/credential::claude-auth-artifact-path
      - id: micro-behaviors/fs/path/personal::cursor-chat-store-artifact-path
      - id: micro-behaviors/fs/path/personal::antigravity-session-store-artifact-path
    any:
      - id: micro-behaviors/fs/directory/readdir::node-readdir-sync-call
      - id: micro-behaviors/fs/directory/traverse::traverse-rglob-call
      - id: micro-behaviors/fs/directory/traverse::traverse-walk-call
      - id: micro-behaviors/fs/directory/traverse::powershell-recursive-file-enumeration

  # The bundled-runtime sibling of the catalogs above: a minified or compiled
  # module that references two or more agent auth stores through runtime-joined
  # literals and also reaches Claude Code's macOS keychain item. Credential-sync
  # helpers (a signed-in CLI importing the operator's coding-agent tokens into
  # its own service) do exactly this, and so do stealers; the boundary crossing
  # is real either way, which is why this stays suspicious -- the hostile
  # composites above key on reads and transfers instead.
  - id: bundled-multi-agent-auth-store-catalog
    desc: Bundled module catalogs agent auth stores plus keychain
    crit: suspicious
    conf: 0.93
    for: [javascript, typescript, binaries]
    # No proximity window: compiled runtimes scatter these literals across
    # their string tables, so file scope is the binding, not adjacency.
    all:
      - id: micro-behaviors/fs/path/credential::agent-config-dir-adjacent-auth-filename
      - id: micro-behaviors/os/security/keychain::claude-code-keychain-service-name
    unless:
      # The handoff composite below states the same catalog plus where the
      # tokens go; report the stronger claim once rather than both.
      - id: agent-auth-store-subscription-handoff
      # The Reason CLI implements an advertised login integration that reads
      # these stores only after the user connects a local computer.
      - id: well-known/app/ai/coding-agent/reason-machines::reason-machines-cli-context

  # Some worker clients import third-party OAuth access tokens into the
  # signed-in account's own API: the localLogins handoff loops over every
  # discovered token and calls client.localSubscription, which posts each
  # {provider, access, expires} record to the account service's
  # device-authenticated /local-subscription endpoint. Reason ships this
  # default-on for signed-in personal computers (--local-logins defaults on
  # unless API-key auth is used). The store catalog alone is only suspicious
  # discovery; paired with that transfer call it establishes credential
  # movement across the vendor trust boundary. Keep this suspicious because an
  # explicit, documented integration can be legitimate, while default-on
  # cross-vendor token transfer still merits analyst attention.
  - id: agent-auth-store-subscription-handoff
    desc: Sends collected agent tokens to its account subscription endpoint
    crit: suspicious
    conf: 0.95
    for: [javascript, typescript, binaries]
    all:
      - id: micro-behaviors/fs/path/credential::agent-config-dir-adjacent-auth-filename
      - id: micro-behaviors/os/security/keychain::claude-code-keychain-service-name
    # The call site (JS chunks) or the route table (compiled runtime); a
    # code-split bundle can carry them in different chunks.
    any:
      - id: well-known/app/ai/coding-agent/reason-machines::local-subscription-api-call
      - id: well-known/app/ai/coding-agent/reason-machines::local-subscription-api-route
    unless:
      # This credential handoff is an advertised Reason CLI feature enabled
      # when a user connects a local computer. Suppress the intent inference
      # when the same artifact carries the product's established identity.
      - id: well-known/app/ai/coding-agent/reason-machines::reason-machines-cli-context

  - id: multi-coding-agent-auth-harvest
    desc: Harvests authentication credentials across multiple AI coding agents
    crit: hostile
    conf: 0.97
    attack: T1552.001
    for: [javascript, typescript]
    near_bytes: 4096
    all:
      - id: micro-behaviors/fs/path/filename-credential::codex-auth-json-path-join
      - id: micro-behaviors/fs/path/token::claude-cli-oauth-credentials-file
      - id: objectives/exfiltration/stealer/credential::agent-auth-file-raw-read

  # The OpenClaw gateway config (openclaw.json) carries the agent's provider
  # API keys and gateway token. A script that names that file next to a
  # hardcoded Discord webhook is shipping the agent's secrets to a chat
  # channel; no OpenClaw tooling reports its own config to Discord.
  - id: openclaw-config-discord-webhook-exfil
    desc: OpenClaw agent config sent to Discord webhook
    crit: hostile
    conf: 0.93
    for: [shell, javascript, typescript, python]
    attack: T1552.001,T1567
    near_bytes: 2048
    all:
      - id: micro-behaviors/fs/path/agent-config/file::openclaw-config-json-literal
      - id: micro-behaviors/communications/http/webhook::discord-webhook-path-any
    unless:
      - id: metadata/package/testing/harness/runtime/
