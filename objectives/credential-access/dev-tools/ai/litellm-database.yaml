# The real LiteLLM database schema is context. Neither DATABASE_URL alone nor
# generic SELECT/query APIs establish this collection profile.
defaults:
  platforms: [unix, windows]
  for: [python, javascript, typescript, go, ruby, java, php]
composite_rules:
  - id: litellm-provider-database-dump
    desc: Queries both LiteLLM credential and model stores
    crit: suspicious
    conf: 0.95
    attack: T1552.001
    all:
      - id: micro-behaviors/data/db/read/records::litellm-credential-values-query
      - id: micro-behaviors/data/db/read/records::litellm-model-params-query
  # The credential-stealer variant embeds its SQL inside the script handed to
  # a child interpreter instead of calling the database API in-process, so
  # the query-call atoms above cannot bind it. Pair the credentials-table SQL
  # text with a nearby interpreter executable + "-c" argument list; proximity
  # is context, not proven data flow between the SQL and the spawned child.
  - id: litellm-credential-store-child-interpreter-dump
    desc: Spawns an inline-code interpreter child near LiteLLM credential-store SQL
    crit: suspicious
    conf: 0.96
    attack: T1552.001,T1059.006
    for: [python]
    near_bytes: 2048
    all:
      - id: micro-behaviors/data/db/read/records::litellm-credentials-from-clause
      - id: micro-behaviors/process/deploy/interpreter-command::sys-executable-c-arg-list
