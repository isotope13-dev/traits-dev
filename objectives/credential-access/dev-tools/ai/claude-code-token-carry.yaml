defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  attack: T1552.001

traits:
  # An object field that carries an OAuth token value. Common in OAuth code,
  # so it only counts alongside the stored-credential legs below.
  - id: oauth-token-object-field
    desc: Object field carries an OAuth token value
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '\boauthToken\s{0,3}:'

composite_rules:
  # The file reads a Claude Code token from the keychain, reads other AI-agent
  # credential stores, and holds the token in a field that can be serialized.
  # The composite does not show that the token leaves the machine.
  - id: claude-code-token-carried-with-agent-stores
    desc: Reads Claude Code keychain token and carries it in an object field
    crit: suspicious
    conf: 0.9
    scope: file
    all:
      - id: micro-behaviors/os/security/keychain::claude-code-keychain-token-read
      - id: micro-behaviors/fs/path/credential/ai-agent::ai-agent-auth-artifact-reference
      - id: oauth-token-object-field
