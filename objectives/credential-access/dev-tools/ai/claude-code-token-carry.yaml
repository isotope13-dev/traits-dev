defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  attack: T1552.001

traits:
  # An object field that holds an OAuth token value. The value must be a
  # variable or property, so ORM relation declarations such as
  # `oauthToken: t(Table, {...})` do not count. Common in OAuth code, so it
  # only counts alongside the stored-credential legs below.
  - id: oauth-token-object-field
    desc: Object field carries an OAuth token value
    crit: component
    conf: 0.9
    if:
      type: text
      regex: '\boauthToken\s{0,3}:\s{0,3}[\w$."''`]{1,60}[,}]'

composite_rules:
  # The token is held in a field or placed in a bearer Authorization header.
  # Either form counts as carrying it. Neither shows the token leaves the machine.
  - id: oauth-token-carried-in-field-or-bearer
    desc: Holds an OAuth token value in a field or bearer header
    crit: component
    scope: file
    any:
      - id: oauth-token-object-field
      - id: micro-behaviors/communications/http/authorization-header::bearer-header-from-variable

  # The file reads a Claude Code token from the keychain, reads other AI-agent
  # credential stores, and carries the token in a bearer header or a field.
  # The composite does not show that the token leaves the machine.
  - id: claude-code-token-carried-with-agent-stores
    desc: Reads Claude Code keychain token into a bearer header or object field
    crit: suspicious
    conf: 0.9
    scope: file
    all:
      - id: micro-behaviors/os/security/keychain::claude-code-keychain-token-read
      - id: micro-behaviors/fs/path/credential/ai-agent::ai-agent-auth-artifact-reference
      - id: oauth-token-carried-in-field-or-bearer
