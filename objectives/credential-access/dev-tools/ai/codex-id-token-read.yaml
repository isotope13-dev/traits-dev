# Record the credential access separately from its later transfer. The
# auth-file path, file read, and id_token field are required together.
# Unrelated modules in a package must not supply pieces of this read.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  attack: T1552.001

composite_rules:
  - id: codex-id-token-read-from-auth-file
    desc: Reads Codex ID token from auth file
    crit: notable
    conf: 0.99
    scope: file
    all:
      - id: micro-behaviors/fs/path/agent-config/directory::codex-home-join-argument
      - id: micro-behaviors/fs/path/credential/generic-basename::auth-json-join-argument
      - id: micro-behaviors/fs/read/file/content/whole::read-node-symbol
      - id: micro-behaviors/fs/read/file/content/whole::codex-id-token-field-reference
