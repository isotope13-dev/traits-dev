defaults:
  platforms: [unix]
  for: [shell, python, javascript, typescript, rust, github-actions]
  attack: "T1195.002, T1552.001"
composite_rules:
- id: gha-temp-workflow-secret-capture
  for: [shell, python, javascript, githubactions]
  desc: Temporary workflow secret capture
  crit: hostile
  conf: 0.99
  all:
  - id: micro-behaviors/communications/http/services/github/automation::github-workflow-file-write-api
  - id: micro-behaviors/communications/http/services/github/automation::github-workflow-dispatch-api
  any:
  - id: micro-behaviors/communications/http/services/github/security::github-actions-secret-inventory-endpoint
  - id: micro-behaviors/communications/http/services/github/security::secret-names-with-actions-api
  - id: metadata/build/ci/secret::multiple-secret-references

