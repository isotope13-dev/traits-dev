defaults:
  platforms: [linux, unix, macos, android, ios]
  for: [shell]
composite_rules:
  - id: shell-env-dump-exfil
    desc: GitHub token and Socket.IO client clues
    crit: component
    conf: 0.95
    scope: archive
    for: [shell, javascript, npm, package.json]
    any:
      - id: micro-behaviors/os/env/vcs::shell-github-token-reference
    all:
      - id: well-known/lib/network/socketio::client
