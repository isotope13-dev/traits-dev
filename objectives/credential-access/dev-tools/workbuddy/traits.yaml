defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, scripts, source]
  attack: T1552.001

traits:
  - id: workbuddy-desktop-auth-file-reference
    desc: WorkBuddy desktop authentication file reference
    crit: notable
    conf: 0.97
    if:
      type: text
      substr: workbuddy-desktop.info

  - id: workbuddy-legacy-session-key-reference
    desc: WorkBuddy legacy session database key reference
    crit: notable
    conf: 0.96
    if:
      type: text
      substr: planning-genie.new.accessTokencn

  - id: workbuddy-access-token-field
    desc: WorkBuddy access token field reference
    crit: notable
    conf: 0.97
    if:
      type: text
      substr: accessToken

composite_rules:
  - id: workbuddy-local-auth-token-read
    desc: Reads WorkBuddy local authentication token
    crit: suspicious
    conf: 0.98
    all:
      - id: workbuddy-desktop-auth-file-reference
      - id: micro-behaviors/fs/read/file/full::readfilesync-call
      - id: workbuddy-access-token-field
    any:
      - id: well-known/app/system/electron-auth::electron-safe-storage-decrypt
      - id: workbuddy-legacy-session-key-reference
