# Sweeping an application's on-disk configuration tree for stored secrets.
#
# Post-exploitation operators who land on an application server rarely know
# where that product keeps its credentials, so they run the platform's own
# search tool over the install directory with a battery of credential
# keywords -- password, secret, ldap, token -- restricted to configuration
# file types. The gate is the combination of a search utility, a credential
# keyword, and a configuration-file target: any one alone is ordinary,
# together they describe a hunt for stored secrets. The `\.(conf|ini|propert)`
# tail is deliberately unanchored so it covers .conf, .config and .properties.
defaults:
  platforms: [windows, unix]
  crit: suspicious
  conf: 0.95
  attack: T1552.001
  for: [scripts, binaries]
traits:
  - id: findstr-config-credential-search
    desc: findstr scans config for credential keywords
    platforms: [windows]
    if:
      type: text
      regex: '(?i)findstr\b.{0,60}\b(password|secret|ldap|token)\b.{0,80}\.(conf|ini|propert)'

  # A sweep, not a lookup. `grep "pq.password" hg.conf` is a program reading
  # its own credential out of its own config file -- the UCSC genome browser's
  # QA scripts do exactly that -- and matching it made every application that
  # stores a database password look like a credential harvester. What the
  # attack does instead is search *across* config files it does not own, which
  # needs either a recursive flag or a wildcard path.
  - id: grep-recursive-config-credential-search
    desc: Recursive text search for credentials
    if:
      type: text
      regex: '(?i)\b(grep|rg|ag) -[a-z]{0,4}[rR][a-z]{0,4}\b.{0,50}(password|secret|token)'
    downgrade:
      any:
        - id: metadata/build/package/recipe::gentoo-ebuild-recipe

  - id: grep-glob-config-credential-search
    desc: Wildcard config search for credentials
    if:
      type: text
      regex: '(?i)\b(grep|rg|ag)[ \t]+.{0,60}(password|secret|ldap|token).{0,60}\*\.(conf|ini)'
    downgrade:
      any:
        - id: metadata/build/package/recipe::gentoo-ebuild-recipe

  - id: select-string-config-credential-search
    desc: Select-String scans config for credentials
    platforms: [windows]
    for: [powershell, batch, pe, dll]
    if:
      type: text
      regex: '(?i)Select-String.{0,80}\.(conf|ini|propert).{0,80}\b(password|secret|ldap|token)\b'

composite_rules:
  # A config-tree secret hunt on its own can be an administrator auditing
  # their own server. Paired with registry hive theft it is the credential
  # harvesting stage of a server-side intrusion -- the PaperCut print-server
  # chain swept *.config for LDAP/AD bind secrets and saved the SAM/SYSTEM
  # hives on the same host, in the same session.
  - id: config-secret-sweep-with-hive-dump
    desc: Config secret sweep with hive dumping
    crit: hostile
    conf: 0.97
    attack: T1552.001,T1003.002
    platforms: [windows]
    all:
      - id: objectives/credential-access/windows-registry/hive/
    any:
      - id: findstr-config-credential-search
      - id: grep-recursive-config-credential-search
      - id: grep-glob-config-credential-search
      - id: select-string-config-credential-search
    needs: 1
