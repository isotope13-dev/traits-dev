# Agent-directed secret sweep: a locally installed AI coding agent CLI is
# launched unattended with its permission prompts bypassed and handed a
# natural-language task to search the home directory for wallet keystores,
# environment files and private keys. The agent does the file walking, so the
# harvester needs no search code of its own.
#
# Each leg is notable alone. The prompt leg names the secret-file search task;
# the permission leg removes the human approval step; the process leg shows
# the agent is started by the program that carries the prompt.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, shell, python]
  attack: T1552.001

composite_rules:
  # The prompt, the bypassed approval flag and the launch must all be present
  # in one program. A documented agent invocation with the same flag but no
  # secret-search task does not match.
  - id: agent-directed-secret-harvest
    desc: Unattended AI agent searches for secrets
    crit: hostile
    conf: 0.97
    all:
      - id: micro-behaviors/data/llm/permission::ai-agent-dangerous-permission-flag
      - id: micro-behaviors/fs/search/sensitive-file::agent-prompt-secret-search
      - id: micro-behaviors/process/create/exec::child-process-execution
    scope: file
    unless:
      - id: well-known/tool/detection/llm-scanner::llm-scanner-context
      - id: micro-behaviors/os/security/scan/documentation/
