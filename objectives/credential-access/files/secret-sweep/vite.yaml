defaults:
  platforms: [linux, macos, windows]
  for: [scripts, source]
  attack: T1190,T1552.001
  conf: 0.98

traits:
  - id: vite-fs-dotenv-target
    desc: Vite dotenv path reference
    crit: notable
    if:
      type: literal
      kind: string
      regex: '(?i)/@fs/[^?]{0,240}\.env([.?]|$)'

  - id: vite-fs-cloud-credential-target
    desc: Vite cloud credential path reference
    crit: notable
    if:
      type: literal
      kind: string
      regex: '(?i)/@fs/[^?]{0,240}\.(aws|azure)/[^?]{1,80}'

  - id: vite-fs-process-environment-target
    desc: Vite process environment path reference
    crit: notable
    if:
      type: literal
      kind: string
      regex: '(?i)/@fs/[^?]{0,240}proc/(self|1)/environ'

  - id: vite-fs-infrastructure-state-target
    desc: Vite infrastructure state path reference
    crit: notable
    if:
      type: literal
      kind: string
      regex: '(?i)/@fs/[^?]{0,240}(terraform\.tf(state|vars)|serverless\.ya?ml)'

  - id: vite-fs-passwd-target
    desc: Vite Unix account database path reference
    crit: notable
    if:
      type: literal
      kind: string
      regex: '(?i)/@fs/[^?]{0,240}etc/passwd'

composite_rules:
  - id: vite-fs-sensitive-target
    desc: Vite sensitive file path reference
    crit: notable
    any:
      - id: vite-fs-dotenv-target
      - id: vite-fs-cloud-credential-target
      - id: vite-fs-process-environment-target
      - id: vite-fs-infrastructure-state-target
      - id: vite-fs-passwd-target

  - id: vite-fs-sensitive-file-bypass-request
    for: [scripts, '!jcl']
    desc: Requests sensitive file through Vite bypass
    crit: hostile
    near_bytes: 700
    all:
      - id: vite-fs-sensitive-target
      - id: well-known/tool/development/build/vite::vite-fs-bypass-query-catalog
      - id: micro-behaviors/communications/http/message::raw-http-safe-request-line
      - id: micro-behaviors/communications/http/direct-socket::direct-socket-http-request

  - id: vite-fs-double-encoded-traversal-bypass
    for: [scripts, '!jcl']
    desc: Uses double-encoded Vite traversal bypass
    crit: hostile
    attack: T1190,T1027
    near_bytes: 500
    all:
      - id: well-known/tool/development/build/vite::vite-fs-double-encoded-traversal
      - id: well-known/tool/development/build/vite::vite-fs-bypass-query-catalog
      - id: micro-behaviors/communications/http/message::raw-http-safe-request-line
      - id: micro-behaviors/communications/http/direct-socket::direct-socket-http-request

  - id: vite-fs-secret-wordlist-scanner
    for: [scripts, '!jcl']
    desc: Scans Vite for sensitive credential files
    crit: hostile
    all:
      - id: well-known/tool/development/build/vite::vite-fs-bypass-query-catalog
      - id: micro-behaviors/communications/http/message::raw-http-safe-request-line
      - id: micro-behaviors/communications/http/direct-socket::direct-socket-http-request
    needs: 3
    any:
      - id: vite-fs-dotenv-target
      - id: vite-fs-cloud-credential-target
      - id: vite-fs-process-environment-target
      - id: vite-fs-infrastructure-state-target
      - id: vite-fs-passwd-target
