# Fragment decoding beside a PHP rename alone remains suspicious. Coupling
# that concealed deployment with reads of unrelated CMS credential stores and
# dotenv files supports a post-exploitation stager inference. These legs do
# not assert that the decoded data flows into PHP or that secrets leave the host.
defaults:
  platforms: [unix]
  for: [shell]

composite_rules:
  - id: shell-fragment-php-credential-sweep
    desc: Web credential sweep beside concealed PHP staging
    crit: hostile
    conf: 0.95
    attack: T1552.001
    near_lines: 16
    all:
      - id: objectives/execution/staging/reconstruct::shell-fragment-decode-php-deployment
      - id: objectives/credential-access/files/secret-sweep::shell-multi-cms-config-read
      - id: micro-behaviors/fs/read/file/target::shell-cat-dotenv-file
