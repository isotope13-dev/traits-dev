defaults:
  for: [ruby]
  platforms: [unix, windows]
traits:
  - id: ruby-secret-file-hash-inventory
    desc: Finds and hashes sensitive file matches
    crit: suspicious
    conf: 0.98
    if:
      type: tree-sitter
      query: |
        ((_ (assignment left: (identifier) @patterns right: (array
              (string (string_content) @key_pattern)
              (string (string_content) @shadow_pattern)))
            (call receiver: (identifier) @pattern_source method: (identifier) @each
              block: (do_block parameters: (block_parameters (identifier) @pattern)
                body: (body_statement
                  (assignment left: (identifier) @expanded right: (call receiver: (constant) @file
                    method: (identifier) @expand arguments: (argument_list (identifier) @input)))
                  (call receiver: (call receiver: (constant) @dir method: (identifier) @glob
                    arguments: (argument_list (identifier) @glob_pattern)) method: (identifier) @each_match
                    block: (do_block parameters: (block_parameters (identifier) @path)
                      body: (body_statement (begin
                        (assignment left: (identifier) @content right: (call receiver: (constant) @reader
                          method: (identifier) @read arguments: (argument_list (identifier) @read_path)))
                        (binary right: (hash (pair value: (call receiver: (scope_resolution) @digest
                          method: (identifier) @hash arguments: (argument_list (identifier) @hashed)))))))))))))
          (#match? @key_pattern "^~/[.]ssh/id_.*[*]$")
          (#match? @shadow_pattern "^/etc/(shadow|master[.]passwd)$")
          (#eq? @patterns @pattern_source) (#eq? @each "each")
          (#eq? @file "File") (#eq? @expand "expand_path") (#eq? @pattern @input)
          (#eq? @dir "Dir") (#eq? @glob "glob") (#eq? @expanded @glob_pattern)
          (#eq? @each_match "each") (#eq? @reader "File") (#eq? @read "read")
          (#eq? @path @read_path) (#eq? @digest "Digest::SHA256")
          (#eq? @hash "hexdigest") (#eq? @content @hashed))
