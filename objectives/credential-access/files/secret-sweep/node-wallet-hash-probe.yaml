# A targeted wallet-key file probe reads candidate secrets and computes a
# digest, even though the observed helper discards the digest and returns true.
defaults:
  platforms: [unix, windows]
  for: [javascript]
  attack: T1552.001
traits:
  - id: credential-config-path-prefix
    desc: References a keys directory
    crit: notable
    conf: 0.9
    if:
      type: text
      substr: 'keys/'
  - id: digest-call
    desc: Calls a cryptographic digest API
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '\b(createHash|sha256|deepHash)\s*\('
composite_rules:
  - id: wallet-key-file-read-and-hash-probe
    desc: Reads wallet-key files and hashes their contents
    crit: suspicious
    conf: 0.96
    near_bytes: 1200
    all:
      - id: credential-config-path-prefix
      - id: micro-behaviors/fs/read/file/content/unspecified::read-node
      - id: digest-call
