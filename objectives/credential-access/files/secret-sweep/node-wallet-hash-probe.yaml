# A targeted wallet-key file probe reads candidate secrets and computes a
# digest, even though the observed helper discards the digest and returns true.
defaults:
  platforms: [unix, windows]
  for: [javascript]
  attack: T1552.001
traits:
composite_rules:
  - id: wallet-key-file-read-and-hash-probe
    desc: Reads wallet-key files and hashes their contents
    crit: suspicious
    conf: 0.96
    near_bytes: 1200
    all:
      - id: micro-behaviors/fs/path/credential::keys-directory-reference
      - id: micro-behaviors/fs/read/file/content/unspecified::read-node
      - id: micro-behaviors/crypto/hash/digest/unnamed-algorithm::node-createhash-call

  # Keep the prepared batch's named-digest coverage alongside the more
  # specific incoming Node createHash requirement above.
  - id: wallet-key-file-read-and-named-digest-probe
    desc: Reads wallet-key files and calls a named digest API
    crit: suspicious
    conf: 0.96
    near_bytes: 1200
    all:
      - id: micro-behaviors/fs/path/credential::keys-directory-reference
      - id: micro-behaviors/fs/read/file/content/unspecified::read-node
      - id: micro-behaviors/crypto/hash/digest/unnamed-algorithm::digest-api-call
