# Reads of multiple unrelated CMS credential stores are a collection cue.
# No network transfer or malicious intent is established by these reads alone.
defaults:
  platforms: [unix]
  for: [shell]
  attack: T1552.001

composite_rules:
  - id: shell-multi-cms-config-read
    desc: Shell reads configuration from several CMS products
    crit: suspicious
    conf: 0.95
    near_lines: 12
    needs: 2
    any:
      - id: micro-behaviors/fs/read/file/target::shell-cat-wordpress-config
      - id: micro-behaviors/fs/read/file/target::shell-cat-magento-config
      - id: micro-behaviors/fs/read/file/target::shell-cat-drupal-config
