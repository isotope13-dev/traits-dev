# An obfuscated loader stage that carries a named catalog of credential
# regexes and walks directories re-matching file contents against them.
# Naming the table (SECRET_PATTERNS) is filter-shaped, which is why the
# catalog atom is only notable; the surrounding whitespace-padded obfuscation
# plus the dynamic RegExp and directory-walk plumbing is what no benign
# scanner ships, and the four legs together read as a hidden credential
# hunter embedded in a distributed package.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  attack: T1552.001

composite_rules:
  - id: obfuscated-secret-catalog-sweep
    desc: Obfuscated module sweeps files for secrets
    crit: suspicious
    conf: 0.94
    scope: file
    all:
      - id: objectives/anti-static/obfuscation/instruction/insertion-junk::whitespace-padded-obfuscator-payload
      - id: micro-behaviors/data/string/search::secret-pattern-catalog-definition
      - id: micro-behaviors/data/parse/regex::js-regexp-constructor-call
      - id: micro-behaviors/fs/directory/async-enumeration::node-readdir-async-call
