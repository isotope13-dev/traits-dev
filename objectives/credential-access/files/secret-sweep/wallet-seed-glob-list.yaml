# Stealer file hunts carry a glob list of wallet and recovery-phrase names
# ("*mnemonic*", "*seed*", "*phrase*", "*keypair*") and walk the whole disk
# with it. Backup tools match by path or extension, not by these words.
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript, python]
  attack: T1552.001,T1005
traits:
  - id: recovery-phrase-glob-patterns
    desc: Glob patterns for seed and mnemonic files
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '"\*mnemonic\*"[^\]]{0,200}"\*seed\*"|"\*seed\*"[^\]]{0,200}"\*mnemonic\*"'
  - id: wallet-keypair-glob-patterns
    desc: Glob patterns for wallet and keypair files
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '"\*(keypair|wallet|metamask|phantom)\*"'
composite_rules:
  - id: disk-wide-recovery-phrase-file-hunt
    desc: Hunts disk for seed phrase and wallet files
    crit: hostile
    conf: 0.95
    near_bytes: 1024
    all:
      - id: recovery-phrase-glob-patterns
      - id: wallet-keypair-glob-patterns
      - id: micro-behaviors/os/application/target/wallet::wallet-brand-metamask
