defaults:
  platforms:
  - unix
  - windows
  for:
  - python
traits:
- id: python-developer-key-file-content-collection
  desc: Collects developer credential and SSH key files
  crit: suspicious
  conf: 0.98
  attack: T1552.001,T1552.004
  if:
    type: tree-sitter
    query: |2

      ((module
        (expression_statement (assignment left: (identifier) @catalog right: (list
      [(string) @config (call arguments: (argument_list (string) @config))]
      [(string) @ssh (call arguments: (argument_list (string) @ssh))])))
        (function_definition body: (block
          (for_statement left: (identifier) @path right: (identifier) @selected
            body: (block (if_statement consequence: (block
              (with_statement
                (with_clause (with_item value: (as_pattern
                  (call function: (identifier) @open arguments: (argument_list (identifier) @opened))
                  alias: (as_pattern_target (identifier) @handle))))
                body: (block (expression_statement (assignment
                  left: (subscript subscript: (identifier) @indexed)
                  right: (subscript value: (call function: (attribute object: (identifier) @readhandle attribute: (identifier) @read)))))))))))))) @collection
        (#eq? @catalog @selected) (#eq? @path @opened) (#eq? @path @indexed)
        (#eq? @open "open") (#eq? @handle @readhandle) (#eq? @read "read")
        (#match? @config "\\.(npmrc|pypirc|git-credentials)")
        (#match? @ssh "id_(rsa|ecdsa|ed25519)"))
