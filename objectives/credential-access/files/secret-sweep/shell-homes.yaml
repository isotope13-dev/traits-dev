defaults:
  platforms:
  - unix
  for:
  - shell
  attack: T1552.001
  crit: hostile
  conf: 0.92
composite_rules:
- id: cross-user-claude-aws-history-harvest
  desc: Harvests Claude and AWS credentials plus shell histories across users
  all:
  - id: micro-behaviors/fs/path/agent-auth::claude-auth-artifact-path
  - id: micro-behaviors/fs/path/token::aws-credentials-text-reference
  - id: micro-behaviors/fs/path/personal::bash-history-artifact
  any:
  - id: micro-behaviors/fs/path/config/environment::env-file-path
  - id: micro-behaviors/fs/search/command::grep-token-or-secret-keyword
- id: shell-cluster-developer-credential-harvest
  desc: Harvests Kubernetes cluster tokens and developer credentials from shell
  conf: 0.96
  all:
  - id: micro-behaviors/fs/read/file/target::shell-cat-root-or-home-path
  needs: 2
  any:
  - id: micro-behaviors/fs/path/secret-config::kube-config
  - id: micro-behaviors/fs/path/token::serviceaccount-token
  - id: micro-behaviors/fs/path/token::gh-cli-hosts
  near_lines: 10
# Each leg binds cp to a distinct credential store as its source operand.
# One store is ordinary administration; three distinct stores copied within
# a few lines is a harvest. Backups copy whole trees, not these selections.
- id: shell-multi-credential-store-copy
  desc: Copies three or more credential stores
  crit: suspicious
  conf: 0.93
  attack: T1552.001,T1003.008
  near_lines: 12
  needs: 3
  any:
  - id: objectives/credential-access/files/password-database::shell-shadow-source-copy
  - id: objectives/credential-access/shell/history::shell-history-source-copy
  - id: micro-behaviors/fs/file/copy/source-destination::shell-copy-ssh-directory
  - id: micro-behaviors/fs/file/copy/source-destination::shell-root-client-config-copy
  - id: micro-behaviors/fs/file/copy/source-destination::shell-copy-cloud-cli-credentials
  - id: micro-behaviors/fs/file/copy/source-destination::shell-copy-npmrc
