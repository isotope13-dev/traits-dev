# Cross-user secret harvesting from shell.
#
# Post-exploitation operators sweep other users' credential stores: the
# combination of Claude credential paths, AWS credential files and shell
# histories across /root and /home in one script is a harvest, not
# administration. Any one leg alone is ordinary (backup tools read homes,
# apps read their own creds); together they describe hunting credentials
# the operator does not own.
defaults:
  platforms: [unix]
  attack: T1552.001
  crit: hostile
  conf: 0.92

composite_rules:
  - id: cross-user-claude-aws-history-harvest
    desc: Harvests Claude and AWS credentials plus shell histories across users
    all:
      - id: micro-behaviors/fs/path/credential::claude-auth-artifact-path
      - id: micro-behaviors/fs/path/token::aws-credentials-text-reference
      - id: micro-behaviors/fs/path/personal::bash-history-artifact
    any:
      - id: micro-behaviors/fs/path/config/environment::env-file-path
      - id: micro-behaviors/fs/search::grep-token-or-secret-keyword
