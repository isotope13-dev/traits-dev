defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, shell]
  attack: T1552.001

composite_rules:
- id: prompt-private-credential-phrase
  desc: Private term near credential prompt words
  crit: component
  conf: 0.9
  near_bytes: 80
  needs: 2
  any:
  - id: metadata/lang/source/literal/string/label::private-literal-word
  - id: metadata/lang/natural/credential::secret-acquisition-wording
  - id: micro-behaviors/fs/path/credential::keystore-path-literal
  - id: metadata/lang/source/literal/string/label::wallets-word
- id: prompt-amazon-credential-phrase
  desc: Amazon term near secret prompt words
  crit: component
  conf: 0.9
  near_bytes: 80
  needs: 2
  any:
  - id: metadata/lang/natural/vocabulary/content-word::amazon-provider-word
  - id: metadata/lang/natural/credential::secret-acquisition-wording
  - id: micro-behaviors/fs/path/credential::keystore-path-literal
  - id: metadata/lang/natural/vocabulary/configuration::configuration-word
- id: credential-inventory-wording
  desc: Credential inventory wording near secret names
  crit: suspicious
  conf: 0.94
  near_bytes: 240
    # Require both an inventory action and >=2 credential fragments so a
    # report template saying "wallets" and "keystore" is not enough.
  all:
  - id: micro-behaviors/ui/help/message::llm-inventory-action-cluster
  needs: 2
  any:
  - id: micro-behaviors/os/env/package-manager::node-auth-token-name
  - id: micro-behaviors/os/env/package-manager::npm-token-name
  - id: micro-behaviors/os/env/vcs::gh-token-name-reference
  - id: micro-behaviors/data/db/access::indexeddb-name-literal
  - id: micro-behaviors/fs/path/credential::keystore-path-literal
  - id: objectives/credential-access/files/secret-sweep::prompt-private-credential-phrase
  - id: metadata/lang/source/literal/string/label::wallets-word
  - id: metadata/lang/source/naming/secret::github-token-name-reference
- id: child-process-credential-search-wording
  for: [javascript]
  desc: Child process with credential search wording
  crit: suspicious
  conf: 0.96
  near_bytes: 400
    # Pairs distinctive credential-store tokens and inventory/prompt language
    # with a child_process spawn API. This avoids benign token resolvers that
    # call `gh auth token` or similar CLIs without an LLM search prompt.
  all:
  - id: micro-behaviors/process/create/exec::child-process-execution
  - id: micro-behaviors/ui/help/message::llm-inventory-action-cluster
  any:
  - id: micro-behaviors/os/env/package-manager::node-auth-token-name
  - id: micro-behaviors/os/env/package-manager::npm-token-name
  - id: micro-behaviors/os/env/vcs::gh-token-name-reference
  - id: micro-behaviors/data/db/access::indexeddb-name-literal
  - id: metadata/lang/source/naming/secret::github-token-name-reference
