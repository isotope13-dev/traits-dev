defaults:
  platforms: [panos, appliance, unix]
  for: [c, elf]
  attack: T1041

traits:
  - id: c-panos-cloud-browser-paths
    desc: C PAN-OS cloud browser paths
    crit: suspicious
    conf: 0.94
    unless:
      - id: well-known/tool/detection/innerwarden::innerwarden-defensive-tool-context
    if:
      type: text
      regex: '\.docker/config\.json[\s\S]{0,160}\.npmrc[\s\S]{0,160}\.pypirc'
