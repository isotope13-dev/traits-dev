# PHP post-exploitation payloads that enumerate user home directories
# on Windows and Unix to locate named credential files.
defaults:
  platforms: [windows, unix]
  for: [php]
  attack: T1083,T1552.001

traits:
  - id: php-windows-users-dir
    desc: References Windows Users directory path
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)C:\\+Users'
  - id: php-etc-passwd-read
    desc: Reads /etc/passwd for home directories
    crit: notable
    conf: 0.92
    if:
      type: text
      regex: 'file_get_contents\s*\(\s*["'']/etc/passwd["'']'
  - id: php-glob-onlydir
    desc: Uses GLOB_ONLYDIR constant
    crit: notable
    conf: 0.88
    if:
      type: text
      word: GLOB_ONLYDIR

composite_rules:
  - id: php-cross-os-home-enum
    desc: Enumerates Windows and Unix home directories
    crit: hostile
    conf: 0.96
    all:
      - id: php-windows-users-dir
      - id: php-etc-passwd-read
    unless:
      - id: well-known/tool/
      - id: well-known/lib/
      - id: well-known/app/
  - id: php-windows-users-glob
    desc: GLOB_ONLYDIR listing of Windows Users
    crit: hostile
    conf: 0.94
    near_bytes: 300
    all:
      - id: php-windows-users-dir
      - id: php-glob-onlydir
    unless:
      - id: well-known/tool/
      - id: well-known/lib/
      - id: well-known/app/
  - id: php-passwd-home-glob
    desc: Passwd homes plus GLOB_ONLYDIR listing
    crit: hostile
    conf: 0.94
    near_bytes: 300
    all:
      - id: php-etc-passwd-read
      - id: php-glob-onlydir
    unless:
      - id: well-known/tool/
      - id: well-known/lib/
      - id: well-known/app/
