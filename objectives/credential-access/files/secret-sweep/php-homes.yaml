defaults:
  platforms:
  - windows
  - unix
  for:
  - php
  attack: T1083,T1552.001
traits:
- id: php-windows-users-dir
  desc: References Windows Users directory path
  crit: notable
  conf: 0.9
  if:
    type: text
    regex: (?i)C:\\+Users
  unless:
  - id: well-known/app/system/anthropic-cybersecurity-skills::defensive-cybersecurity-skills-repository
  - id: metadata/package/documentation/agent-safety::security-example-documentation
- id: php-etc-passwd-read
  desc: Reads /etc/passwd for home directories
  crit: notable
  conf: 0.92
  if:
    type: text
    regex: file_get_contents\s*\(\s*["']/etc/passwd["']
composite_rules:
- id: php-cross-os-home-enum
  desc: Enumerates Windows and Unix home directories
  crit: hostile
  conf: 0.96
  all:
  - id: php-windows-users-dir
  - id: php-etc-passwd-read
- id: php-windows-users-glob
  desc: GLOB_ONLYDIR listing of Windows Users
  crit: hostile
  conf: 0.94
  near_bytes: 300
  all:
  - id: php-windows-users-dir
  - id: micro-behaviors/fs/directory/readdir/language::php-glob-onlydir
- id: php-passwd-home-glob
  desc: Passwd homes plus GLOB_ONLYDIR listing
  crit: hostile
  conf: 0.94
  near_bytes: 300
  all:
  - id: php-etc-passwd-read
  - id: micro-behaviors/fs/directory/readdir/language::php-glob-onlydir
