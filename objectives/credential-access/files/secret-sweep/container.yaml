# Extortion crews sweep broad file shares for reusable authentication material
# before encryption or publication. Require recursive traversal plus several
# independent credential-container families so ordinary TLS configuration,
# password-manager backup, and certificate-maintenance scripts remain below
# this verdict on their own.
defaults:
  platforms: [windows, unix]
  for: [scripts, source, binaries]
  attack: T1552.001,T1552.004,T1555.005

composite_rules:
  - id: recursive-credential-container-sweep
    desc: Recursively targets multiple credential-container families
    crit: suspicious
    conf: 0.97
    all:
      - id: micro-behaviors/fs/directory/traverse/
    needs: 3
    any:
      - id: micro-behaviors/fs/path/private-key::keystore-suffix
      - id: micro-behaviors/fs/path/private-key::pem-file-extension-reference
      - id: micro-behaviors/fs/path/private-key::private-key-suffix
      - id: metadata/file/string/file::credential-file-pattern--kdbx
      - id: metadata/file/string/file::credential-file-pattern--psafe3
    near_bytes: 1600
