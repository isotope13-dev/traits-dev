# HDF5 external raw-storage abuse in data-processing workers technique.
# An HDF5 container can declare that dataset bytes live at an arbitrary local
# path; a consumer that reads the dataset can then access that path's contents.
defaults:
  platforms: [unix, windows]
  # The disclosure primitive is the HDF5 external target, independent of the
  # language used to construct the container. Native and managed builders use
  # the same stable API/path combination as scripting-language bindings.
  for: [scripts, source]

traits:
  - id: hdf5-runtime-environ-target
    desc: HDF5 external target reads process environment
    crit: suspicious
    conf: 0.95
    if:
      type: text
      # Bindings expose `set_external`; native HDF5 uses the equivalent
      # `H5Pset_external` symbol. Both create the same External File List.
      regex: '(?is)\b(H5P)?set_external\b.{0,180}/proc/self/environ'

composite_rules:
  - id: hdf5-external-local-reference
    desc: HDF5 external API with a local file target
    crit: suspicious
    conf: 0.95
    all:
      - id: micro-behaviors/data/format/container::hdf5-external-api-call
    any:
      - id: worker-source-file-target
      - id: micro-behaviors/fs/proc/info/path::process-self-environ
      - id: micro-behaviors/fs/path/token::serviceaccount-token-path
      - id: hdf5-runtime-environ-target
    near_bytes: 4096

  - id: hdf5-external-credential-reference
    desc: HDF5 external storage targets a credential path
    crit: suspicious
    conf: 0.96
    attack: T1552.001
    all:
      - id: micro-behaviors/data/format/container::hdf5-external-api-call
      - id: micro-behaviors/fs/path/credential::any-credential-path
    near_bytes: 4096

  # This narrow native-source pattern maps two high-value Unix credential
  # files into an HDF5 external dataset. It detects the hostile setup intent;
  # it does not claim that this file reads or exfiltrates the dataset.
  - id: hdf5-external-unix-secret-dataset
    desc: HDF5 external dataset maps shadow and root SSH key files
    crit: hostile
    conf: 0.97
    attack: T1552.001
    for: [c, cpp]
    all:
      - id: micro-behaviors/data/format/container::hdf5-external-api-call
      - id: objectives/credential-access/files/config::native-unix-secret-path-bundle
    near_bytes: 4096

  - id: worker-source-file-target
    for: [scripts, source, -batch, -jcl, -powershell, -vbs]
    # A path-shaped source target is only an incomplete clue until it is
    # paired with the HDF5 external-storage primitive below.
    desc: Nearby worker source path and script markers
    crit: component
    conf: 0.9
    all:
      # The absolute app/source-root atoms are ordinary filesystem literals;
      # they live at micro-behaviors/fs/path/application/prefix:: and only
      # become a target here, paired with the HDF5 external-storage call.
      - id: micro-behaviors/fs/path/application/prefix::absolute-app-source-root-path
      - id: micro-behaviors/fs/path/application/prefix::absolute-app-source-script-path
    near_bytes: 1024

  # Same-file proximity establishes a sensitive external-storage reference,
  # not that another worker opens the container or discloses the data.
  - id: hdf5-external-runtime-secret-reference
    desc: HDF5 external API near runtime secret paths
    crit: suspicious
    conf: 0.995
    all:
      - id: hdf5-external-local-reference
    any:
      - id: micro-behaviors/fs/proc/info/path::process-self-environ
      - id: micro-behaviors/fs/path/token::serviceaccount-token-path
      - id: hdf5-runtime-environ-target
    near_bytes: 4096

  - id: hdf5-worker-source-disclosure
    for: [source, '!typescript', applescript, javascript, lua, perl, php, python, ruby, shell]
    desc: HDF5 external path discloses worker source
    crit: hostile
    conf: 0.98
    attack: T1005
    all:
      - id: hdf5-external-local-reference
      - id: worker-source-file-target
    near_bytes: 4096
