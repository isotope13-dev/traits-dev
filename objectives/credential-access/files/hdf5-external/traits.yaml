# HDF5 external raw-storage abuse in data-processing workers technique.
# An HDF5 container can declare that its bytes live at an arbitrary local path;
# when a service opens it, the service discloses that path's contents.
defaults:
  platforms: [unix, windows]
  for: [scripts]
  attack: "T1005,T1210"

traits:
  - id: hdf5-library-marker
    desc: HDF5 library marker
    crit: component
    conf: 0.9
    if:
      type: text
      regex: '(?i)\b(h5py|HDF5)\b'

  - id: hdf5-file-marker
    desc: HDF5 file reference
    crit: component
    conf: 0.9
    if:
      type: text
      regex: '(?i)\.(h5|hdf5)\b'

  - id: external-storage-marker
    desc: HDF5 external storage marker
    crit: component
    conf: 0.9
    if:
      type: text
      regex: '(?i)external[_ -]?(raw[_ -]?)?(path|storage)'

  - id: worker-source-path
    desc: Worker source directory path
    crit: component
    conf: 0.9
    if:
      type: text
      regex: '(?i)/(src|srv|app|opt)/'

  - id: worker-source-script-target
    desc: Worker source script target
    crit: component
    conf: 0.9
    if:
      type: text
      regex: '(?i)\.(py|js|ts|go)\b'

composite_rules:
  - id: hdf5-external-local-reference
    desc: HDF5 external local storage reference
    crit: suspicious
    conf: 0.95
    all:
      - id: external-storage-marker
    any:
      - id: hdf5-library-marker
      - id: hdf5-file-marker
    near_bytes: 1024

  - id: sensitive-worker-file-target
    desc: Sensitive runtime file target
    crit: suspicious
    conf: 0.94
    any:
      - id: micro-behaviors/fs/proc/info/path::process-self-environ
      - id: micro-behaviors/os/container/runtime::serviceaccount-files
    near_bytes: 1024

  - id: worker-source-file-target
    desc: Worker source file target
    crit: suspicious
    conf: 0.9
    all:
      - id: worker-source-path
      - id: worker-source-script-target
    near_bytes: 1024

  - id: hdf5-runtime-secret-disclosure
    desc: HDF5 external path discloses runtime secrets
    crit: hostile
    conf: 0.995
    mbc: "B0046"
    all:
      - id: hdf5-external-local-reference
      - id: sensitive-worker-file-target
    near_bytes: 4096

  - id: hdf5-worker-source-disclosure
    desc: HDF5 external path discloses worker source
    crit: hostile
    conf: 0.98
    all:
      - id: hdf5-external-local-reference
      - id: worker-source-file-target
    near_bytes: 4096
