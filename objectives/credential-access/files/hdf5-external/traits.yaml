# HDF5 external raw-storage abuse in data-processing workers technique.
# An HDF5 container can declare that its bytes live at an arbitrary local path;
# when a service opens it, the service discloses that path's contents.
defaults:
  platforms: [unix, windows]
  for: [scripts]
  attack: "T1005,T1210"

traits:
  - id: hdf5-runtime-environ-target
    desc: HDF5 external target reads process environment
    crit: suspicious
    conf: 0.95
    if:
      type: text
      regex: '(?is)\bset_external\b.{0,180}/proc/self/environ'

composite_rules:
  - id: hdf5-external-local-reference
    desc: HDF5 external API with a local file target
    crit: suspicious
    conf: 0.95
    all:
      - id: micro-behaviors/data/format/container::hdf5-external-api-call
    any:
      - id: worker-source-file-target
      - id: sensitive-worker-file-target
    near_bytes: 4096

  - id: sensitive-worker-file-target
    desc: Sensitive runtime file target
    crit: suspicious
    conf: 0.94
    any:
      - id: micro-behaviors/fs/proc/info/path::process-self-environ
      - id: micro-behaviors/os/container/runtime::serviceaccount-files
      - id: hdf5-runtime-environ-target
    near_bytes: 1024

  - id: worker-source-file-target
    # A path-shaped source target is only an incomplete clue until it is
    # paired with the HDF5 external-storage primitive below.
    desc: Nearby worker source path and script markers
    crit: component
    conf: 0.9
    all:
      # The container-root path atoms are ordinary filesystem-path literals;
      # they live at micro-behaviors/fs/path/application/prefix:: and only
      # become a target here, paired with the HDF5 external-storage call.
      - id: micro-behaviors/fs/path/application/prefix::container-app-root-path
      - id: micro-behaviors/fs/path/application/prefix::container-app-script-path
    near_bytes: 1024

  - id: hdf5-runtime-secret-disclosure
    desc: HDF5 external path discloses runtime secrets
    crit: hostile
    conf: 0.995
    mbc: "B0046"
    all:
      - id: hdf5-external-local-reference
      - id: sensitive-worker-file-target
    near_bytes: 4096

  - id: hdf5-worker-source-disclosure
    desc: HDF5 external path discloses worker source
    crit: hostile
    conf: 0.98
    all:
      - id: hdf5-external-local-reference
      - id: worker-source-file-target
    near_bytes: 4096
