# FortiOS configuration secrets include reversible ENC values for local VPN
# users and LDAP binds. Administrator passwords normally use SH2/PB2 hashes;
# the ENC field format itself is a neutral observation in data/format.
defaults:
  platforms: [fortios, appliance, unix]
  for: [scripts, binaries]
  attack: T1552.001
traits:
  - id: fortios-encrypted-password-filter
    desc: Filters FortiOS encrypted password field
    crit: suspicious
    conf: 0.96
    if:
      type: text
      regex: '(?i)\bgrep(\s+-[A-Za-z]+)?\s+["'']?password\s+ENC\b'
composite_rules:
  # The neutral admin-config read supplies the source; selecting the encrypted
  # password field supplies the credential-access intent.
  - id: fortios-admin-encrypted-password-query
    desc: Queries a FortiOS administrator password
    crit: suspicious
    conf: 0.98
    near_lines: 2
    all:
      - id: micro-behaviors/os/user/account::fortios-admin-config-read
      - id: fortios-encrypted-password-filter
  # FortiOS keeps ENC values in the VDOM archive while the device-specific
  # secret required by newer encryption schemes resides in fsv_sync.dat.
  # Referencing and reading both is a stable, language-independent credential
  # harvesting pattern; the surrounding framed command agent establishes that
  # the collected material is controlled remotely rather than backed up by an
  # administrator.
  - id: fortios-vdom-device-secret-bundle
    desc: FortiOS VDOM config and device secret
    crit: suspicious
    conf: 0.99
    near_bytes: 4096
    all:
      - id: micro-behaviors/fs/path/secret-config::fortios-vdom-config-archive-path
      - id: micro-behaviors/fs/path/password-store::fortios-device-secret-path
  - id: fortios-vdom-device-secret-read
    desc: Reads FortiOS VDOM config and device secret
    crit: suspicious
    conf: 0.99
    near_bytes: 8192
    all:
      - id: fortios-vdom-device-secret-bundle
      - id: micro-behaviors/fs/read/file/
  - id: fortios-credential-harvesting-command-agent
    for: [javascript]
    desc: Remote agent harvests FortiOS credentials
    crit: hostile
    conf: 0.995
    near_bytes: 16384
    all:
      - id: fortios-vdom-device-secret-read
    any:
      - id: objectives/command-and-control/channel/transport::node-framed-tls-command-agent
      - id: objectives/command-and-control/backdoor/rat/remote-agent::node-tls-shell-network-task-agent
  - id: fortios-default-key-config-password-decrypt
    desc: FortiOS ENC fields with default-key decryptor
    crit: suspicious
    conf: 0.99
    platforms: [fortios, unix, windows]
    for: [python, javascript, typescript, powershell, csharp, go]
    attack: T1552.001,T1602.002
    near_bytes: 4096
    all:
      - id: micro-behaviors/crypto/key/representation::fortios-cve-2019-6693-default-aes-key
      - id: micro-behaviors/data/decode/base64::base64-decoding
      - id: micro-behaviors/data/format/credentials::fortios-enc-password-field
    any:
      - id: micro-behaviors/crypto/symmetric/decrypt::python-decrypt-method-call
      - id: micro-behaviors/crypto/decrypt::python-cipher-decryptor-call
      - id: micro-behaviors/crypto/decrypt::createDecipheriv
      - id: micro-behaviors/crypto/decrypt::csharp-create-decryptor-symbol
      - id: micro-behaviors/crypto/decrypt::powershell-create-decryptor-call
      - id: micro-behaviors/crypto/decrypt::go-cbc-decrypter-name-reference
