defaults:
  platforms: [unix, windows]
  for: [go]
  attack: T1552.001

traits:
  # Protocol method, config table and credential fields are invariant; helper
  # names, response/map variables, users, addresses and ports are not required.
  # The Go flow producer loses map keys. A text/proximity composite cannot
  # exclude quoted code or require both credential fields from the same map.
  # This joins a real request and same-map reads in its enclosing block;
  # it does not claim interprocedural flow or successful authentication.
  - id: go-dahua-remotedevice-credential-reads
    desc: Reads RemoteDevice username/password fields
    crit: suspicious
    conf: 0.96
    if:
      type: tree-sitter
      query: |
        ((statement_list
          (short_var_declaration right: (expression_list
            (call_expression
              function: (selector_expression field: (field_identifier) @rpc)
              arguments: (argument_list
                [(interpreted_string_literal) (raw_string_literal)] @method
                (composite_literal body: (literal_value
                  (keyed_element
                    key: (literal_element [(interpreted_string_literal) (raw_string_literal)] @name)
                    value: (literal_element [(interpreted_string_literal) (raw_string_literal)] @table))))))))
          (for_statement body: (block (statement_list
            (short_var_declaration right: (expression_list
              (type_assertion_expression
                operand: (index_expression
                  operand: (identifier) @record1
                  index: [(interpreted_string_literal) (raw_string_literal)] @field1)
                type: (type_identifier) @type1)))
            (short_var_declaration right: (expression_list
              (type_assertion_expression
                operand: (index_expression
                  operand: (identifier) @record2
                  index: [(interpreted_string_literal) (raw_string_literal)] @field2)
                type: (type_identifier) @type2))))))) @evidence
          (#match? @rpc "^CallT?$")
          (#match? @method "^[\"`]configManager[.]getConfig[\"`]$")
          (#match? @name "^[\"`]name[\"`]$")
          (#match? @table "^[\"`]RemoteDevice[\"`]$")
          (#eq? @record1 @record2)
          (#match? @field1 "^[\"`]UserName[\"`]$")
          (#match? @field2 "^[\"`]Password[\"`]$")
          (#not-eq? @field1 @field2)
          (#eq? @type1 "string") (#eq? @type2 "string"))
        ((statement_list
          (short_var_declaration right: (expression_list
            (call_expression
              function: (selector_expression field: (field_identifier) @rpc)
              arguments: (argument_list
                [(interpreted_string_literal) (raw_string_literal)] @method
                (composite_literal body: (literal_value
                  (keyed_element
                    key: (literal_element [(interpreted_string_literal) (raw_string_literal)] @name)
                    value: (literal_element [(interpreted_string_literal) (raw_string_literal)] @table))))))))
          (for_statement body: (block (statement_list
            (short_var_declaration right: (expression_list
              (type_assertion_expression
                operand: (index_expression
                  operand: (identifier) @record1
                  index: [(interpreted_string_literal) (raw_string_literal)] @field1)
                type: (type_identifier) @type1)))
            (short_var_declaration right: (expression_list
              (type_assertion_expression
                operand: (index_expression
                  operand: (identifier) @record2
                  index: [(interpreted_string_literal) (raw_string_literal)] @field2)
                type: (type_identifier) @type2))))))) @evidence
          (#match? @rpc "^CallT?$")
          (#match? @method "^[\"`]configManager[.]getConfig[\"`]$")
          (#match? @name "^[\"`]name[\"`]$")
          (#match? @table "^[\"`]RemoteDevice[\"`]$")
          (#eq? @record1 @record2)
          (#match? @field1 "^[\"`]Password[\"`]$")
          (#match? @field2 "^[\"`]UserName[\"`]$")
          (#not-eq? @field1 @field2)
          (#eq? @type1 "string") (#eq? @type2 "string"))

composite_rules:
  - id: go-dahua-bypass-config-credential-extraction
    desc: Dahua login bypass with RemoteDevice credential reads
    crit: hostile
    conf: 0.98
    attack: T1210,T1552.001
    all:
      - id: go-dahua-remotedevice-credential-reads
    any:
      - id: objectives/lateral-movement/exploit/network-device/auth-bypass::dahua-netkeyboard-auth-bypass
      - id: objectives/lateral-movement/exploit/network-device/auth-bypass::dahua-loopback-auth-bypass
