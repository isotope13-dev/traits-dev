defaults:
  platforms: [unix, windows]
  for: [go]
  attack: T1552.001

traits:
  - id: onvif-user-dump-command
    desc: ONVIF user credential dump command
    crit: suspicious
    conf: 0.95
    if:
      type: literal
      regex: '^OnvifUser\s+-[ul]$'

composite_rules:
  # The RPC console is explicitly asked to run the credential-dump command;
  # unrelated OnvifUser prose and generic console clients are insufficient.
  - id: go-onvif-console-credential-extraction
    desc: Camera bypass with ONVIF credential dumping
    crit: hostile
    conf: 0.98
    all:
      - id: onvif-user-dump-command
      - id: micro-behaviors/communications/rpc::go-dahua-console-run-command
    any:
      - id: objectives/lateral-movement/exploit/network-device/auth-bypass::dahua-netkeyboard-auth-bypass
      - id: objectives/lateral-movement/exploit/network-device/auth-bypass::dahua-loopback-auth-bypass
