defaults:
  platforms: [routeros, appliance, unix]
  for: [text, shell, python, javascript]
  attack: T1552

traits:
- id: routeros-sensitive-config-export
  desc: RouterOS sensitive config export
  crit: suspicious
  conf: 0.94
  if:
    type: text
    # `security-profiles export` only counts as a RouterOS command with its menu
    # path (`/interface wireless security-profiles export`); the bare words are
    # also Google Cloud's `network-security security-profiles export` command.
    regex: '(/(export|user print) show-sensitive|/[a-z -]{1,40}security-profiles\s+export\b)'
  unless:
    - id: well-known/app/infrastructure/ansible::ansible-module-source-context
    - id: well-known/app/infrastructure/ansible::ansible-collections-wheel-context
