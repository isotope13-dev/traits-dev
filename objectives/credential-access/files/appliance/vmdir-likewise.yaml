# vCenter Directory Service (vmdir) stores the machine-account DN and password
# in the Likewise registry hive. Querying those values through lwregshell is
# credential access against the SSO plane, not ordinary service config reads.
defaults:
  platforms: [unix]
  for: [shell, python, perl, go]
  attack: T1552.002,T1003
  mbc: C0051
traits:
  - id: likewise-lwregshell-path
    desc: Likewise lwregshell binary path
    crit: notable
    conf: 0.9
    if:
      type: text
      substr: /opt/likewise/bin/lwregshell
  - id: vmdir-services-registry-key
    desc: Likewise vmdir services registry key
    crit: notable
    conf: 0.92
    if:
      type: text
      regex: '(?i)HKEY_THIS_MACHINE\\Services\\vmdir'
  - id: vmdir-dc-account-password-value
    desc: vmdir dcAccountPassword registry value
    crit: suspicious
    conf: 0.95
    if:
      type: text
      substr: dcAccountPassword
  - id: vmdir-dc-account-dn-value
    desc: vmdir dcAccountDN registry value
    crit: notable
    conf: 0.9
    if:
      type: text
      substr: dcAccountDN
composite_rules:
  - id: lwregshell-vmdir-credential-query
    desc: lwregshell queries vmdir machine-account credentials
    crit: hostile
    conf: 0.98
    all:
      - id: likewise-lwregshell-path
      - id: vmdir-services-registry-key
      - id: vmdir-dc-account-password-value
    near_lines: 12
  - id: vmdir-credential-ldap-reuse
    desc: Stolen vmdir credentials reused for LDAP bind
    crit: hostile
    conf: 0.97
    attack: T1552.002,T1078
    all:
      - id: lwregshell-vmdir-credential-query
      - id: micro-behaviors/os/security/directory-service::ldap-directory-modify-command
    near_lines: 20
