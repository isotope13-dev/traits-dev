# Source: https://sec-consult.com/vulnerability-lab/advisory/multiple-critical-vulnerabilities-in-multiple-tp-link-device-series/
# The transport and sensitive source co-occur; no decryption is inferred.
# USB mount names, symlink names, router addresses and ports may vary.
defaults:
  for: [shell, python, javascript, typescript]
  platforms: [unix, windows]
  attack: T1552.001
composite_rules:
  - id: http-router-credential-config-read
    desc: HTTP client near router credential-config URL
    crit: suspicious
    conf: 0.95
    near_bytes: 160
    all:
      - id: micro-behaviors/fs/path/credential::router-active-config-http-url
    any:
      - id: micro-behaviors/communications/http/download/shell::shell-curl-url-call
      - id: micro-behaviors/communications/http/download/shell::shell-wget-url-call
      - id: micro-behaviors/communications/http/lib/urllib::urllib-urlopen-call-symbol
      - id: micro-behaviors/communications/http/request/client::fetch-http-scheme-url
