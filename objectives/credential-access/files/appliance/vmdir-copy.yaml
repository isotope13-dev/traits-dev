# A database copy may be an administrator's backup. The SSH key installation
# consumer supplies the additional evidence of a compromised virtualization plane.
defaults:
  for: [shell]
  platforms: [unix]
  attack: T1003

traits:
  - id: vmdir-database-copy
    desc: Copies vCenter directory database
    crit: suspicious
    conf: 0.95
    if:
      type: tree-sitter
      language: shell
      query: |
        ((command
          name: (command_name) @command
          argument: (_) @source . argument: (_)) @evidence
          (#match? @command "(^|/)cp$")
          (#match? @source "^[\"']?/storage/db/vmware-vmdir/data\\.mdb[\"']?$"))
