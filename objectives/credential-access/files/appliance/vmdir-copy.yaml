# A database copy may be an administrator's backup. The SSH key installation
# consumer supplies the additional evidence of a compromised virtualization plane.
defaults:
  for: [shell]
  platforms: [unix]
  attack: T1003

traits:
  - id: vmdir-database-copy
    desc: Copies vCenter directory database
    crit: suspicious
    conf: 0.95
    if:
      type: tree-sitter
      language: shell
      query: |
        ((command
          name: (command_name) @command
          argument: (_) @source . argument: (_)) @evidence
          (#match? @command "(^|/)cp$")
          (#match? @source "^[\"']?/storage/db/vmware-vmdir/data\\.mdb[\"']?$"))

composite_rules:
  # The vmdirdbcp interface also serves legitimate directory replication, so
  # an export is only hostile when paired with the unauthenticated SRP bypass
  # that produced the authenticated connection in the same script.
  - id: vmdir-rpc-database-export
    desc: Exports vmdir database over RPC after an SRP session-key bypass
    crit: hostile
    conf: 0.97
    for: [python]
    platforms: [unix, windows]
    attack: T1003,T1552.004
    all:
      - id: micro-behaviors/fs/path/credential/account-db::vmdir-database-path
      - id: micro-behaviors/communications/rpc::vmdir-dbcp-interface-uuid
      - id: objectives/credential-access/validation/session::vmdir-srp-session-key-disclosure-bypass
