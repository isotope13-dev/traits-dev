defaults:
  platforms: [routeros, appliance]
  for: [javascript]
  attack: T1041


composite_rules:
- id: routeros-js-secret-query-set
  desc: RouterOS JS secret query set
  crit: suspicious
  conf: 0.95
  needs: 2
  any:
  - id: objectives/credential-access/vpn/config::routeros-api-ppp-secret-query
  - id: objectives/credential-access/vpn/config::routeros-js-wireguard-key-query
  - id: objectives/credential-access/vpn/config::routeros-js-user-manager-query
  - id: objectives/credential-access/vpn/config::routeros-js-radius-query
  - id: objectives/credential-access/files/appliance::routeros-js-certificate-list-call
  - id: objectives/credential-access/vpn/config::routeros-js-user-profile-call
  - id: objectives/credential-access/files/appliance::routeros-js-flash-ssh-path

