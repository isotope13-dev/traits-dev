# A post-exploitation script staging Check Point's SIC/Internal CA trust
# material alongside the OS password database is collecting the management
# server's crown-jewel credentials, not performing routine administration.
defaults:
  platforms: [linux]
  for: [python, shell, text]
  attack: T1552.001,T1003.008

traits:
  - id: checkpoint-sic-internal-ca-reference
    desc: References Check Point SIC/Internal CA files
    crit: suspicious
    conf: 0.95
    if:
      type: text
      regex: '\$FWDIR/database/(InternalCA|sic_cert\.p12|SIC_DB|fwauth\.NDB)'

  - id: inline-text-shadow-variable-copy
    desc: Inline text copies shadow to a variable
    crit: suspicious
    conf: 0.95
    if:
      type: text
      regex: '\bcp\s+(-\w+\s+){0,2}/etc/shadow(\s+\S+){0,2}\s+["\x27]?\$[A-Za-z_]\w*/'

composite_rules:
  - id: checkpoint-sic-credential-harvest
    desc: Harvests Check Point SIC and OS credential material
    crit: hostile
    conf: 0.98
    near_lines: 25
    all:
      - id: checkpoint-sic-internal-ca-reference
      - id: inline-text-shadow-variable-copy
