defaults:
  platforms: [routeros, appliance, unix]
  for: [rust, elf]
composite_rules:
- id: rust-routeros-secret-config-path-set
  desc: RouterOS secret and backup configuration paths
  crit: notable
  conf: 0.92
  any:
  - id: micro-behaviors/fs/path/config/backup::rust-rw-config-backup-path
  - id: micro-behaviors/fs/path/secret-config::routeros-config-backup-path
  - id: objectives/credential-access/files/appliance::rust-routeros-api-token-path
