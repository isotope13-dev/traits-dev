defaults:
  platforms: [netscaler, appliance, unix]
  for: [perl]
  attack: T1552

traits:
  - id: perl-nsconfig-credential-paths
    desc: Perl references NetScaler nsconfig secret files
    crit: suspicious
    conf: 0.92
    if:
      type: text
      regex: '/nsconfig/(ns\.conf|nsrootkey|license\.lic)'
