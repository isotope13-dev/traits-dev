# Win16 AOL automation that opens the saved sign-on list. AOL 3.0 keeps stored
# passwords behind its Edit Stored Passwords dialog. A 16-bit program that
# finds the AOL frame and drives that dialog through keystrokes or its edit
# control is reading saved credentials. The AOL client carries the same dialog
# text, so the composite stays suspicious and does not convict on its own.
defaults:
  for: [ne]
  platforms: [windows]
  attack: T1555

traits:
  - id: aol-stored-password-dialog-text
    desc: References AOL Edit Stored Passwords dialog
    crit: notable
    conf: 0.9
    if:
      type: text
      case_insensitive: true
      substr: Edit Stored Passwords

composite_rules:
  - id: win16-aol-stored-password-read
    desc: Win16 AOL automation opens the stored-password dialog
    crit: suspicious
    conf: 0.9
    all:
      - id: aol-stored-password-dialog-text
      - id: objectives/impact/ui/manipulation/harassment/chat::aol-frame-window-lookup
    any:
      - id: micro-behaviors/hardware/input/keyboard/simulate::win16-sendkeys-key-name
      - id: objectives/impact/spam/chat::aol-edit-control-class
    needs: 1
