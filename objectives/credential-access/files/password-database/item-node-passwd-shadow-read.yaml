defaults:
  platforms: [unix]
  for: [javascript, typescript]

traits:
- id: node-passwd-shadow-access-denied-throw
  desc: Throws error denying passwd or shadow read
  crit: baseline
  conf: 0.9
  if:
    type: text
    regex: '(?is)(/etc/passwd|/etc/shadow).{0,90}\bthrow\b.{0,40}(denied|cannot read|blocked)'

composite_rules:
- id: node-passwd-shadow-read
  desc: Node reads passwd and shadow files
  crit: suspicious
  conf: 0.92
  attack: T1041
  near_bytes: 512
  all:
  - id: micro-behaviors/fs/path/credential/account-db::node-passwd-path-reference
  - id: micro-behaviors/fs/path/credential/account-db::node-shadow-path-reference
  - id: micro-behaviors/fs/read/file/content/whole::read-node
  unless:
  - id: node-passwd-shadow-access-denied-throw
  # Security regression tests name /etc/passwd and /etc/shadow as expected
  # denial targets; they assert the path is refused, never read it.
  - id: metadata/path/directory::test-directory-component

