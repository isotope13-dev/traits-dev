defaults:
  platforms: [unix]
  for: [javascript, typescript]
  attack: T1041

composite_rules:
- id: node-passwd-shadow-read
  desc: Node reads passwd and shadow files
  crit: suspicious
  unless:
  - id: well-known/tool/offensive/pentestkit::local-storage-panel
  - id: well-known/app/system/freddie::benign-archive-context
  - id: well-known/tool/offensive/promptfoo::redteam-eval-corpus-context
  conf: 0.92
  near_bytes: 512
  all:
  - id: micro-behaviors/fs/path/account-db::node-passwd-path-reference
  - id: micro-behaviors/fs/path/account-db::node-shadow-path-reference
  - id: micro-behaviors/fs/read/file/full::read-node

