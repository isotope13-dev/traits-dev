# Plain shell copies are already covered by shell-shadow-source-copy's AST.
# Decoded script text has no shell AST in the parent. Match its staging copy
# separately without duplicating the plain-source finding or in-place backups.
defaults:
  platforms: [linux]
  for: [shell]
  attack: T1003.008
traits:
  - id: encoded-shadow-variable-copy
    desc: Decoded script copies shadow into variable path
    crit: suspicious
    if:
      type: encoded
      regex: '\bcp\s+(-\w+\s+){0,2}/etc/shadow\s+["'']?\$[A-Za-z_]\w*/'
      encoding: base64
