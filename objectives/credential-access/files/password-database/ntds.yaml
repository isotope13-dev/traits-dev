# Source argument binding distinguishes acquisition of the credential database
# from a mention, an unrelated download, or a backup destination filename.
defaults:
  platforms: [unix, windows]
  for: [python, ruby, javascript, typescript, php, java, csharp]
  attack: T1003.003

traits:
  - id: ntds-database-download
    desc: Downloads the NTDS credential database
    crit: suspicious
    conf: 0.96
    if:
      type: symbol
      kind: call
      regex: '(^|\.)download$'
      arg:
        index: 0
        kind: string
        regex: '(?i)(^|[/\\])ntds\.dit$'
