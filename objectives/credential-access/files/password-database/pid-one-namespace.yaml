# PID 1 namespace entry and a shadow read suggest local credential access,
# not movement to another machine. Host-root access is not proven without
# mount/root context. Require the read in the actual
# launched command, rather than a nearby authorized_keys or shadow path mention.
defaults:
  platforms: [unix]
  crit: suspicious
  conf: 0.98
  attack: T1003.008,T1611
traits:
  - id: nsenter-pid-one-shadow-command-call
    desc: Launched PID 1 nsenter reads shadow
    for: [python]
    if:
      type: symbol
      kind: call
      regex: '^(os\.system|subprocess\.run)$'
      arg:
        index: 0
        kind: string
        regex: '\bnsenter\s+(-t|--target)\s+1\b[^\n]{0,160}\bcat\s+/etc/shadow\b'
  - id: nsenter-pid-one-shadow-command-node
    desc: Node PID 1 nsenter command reads shadow
    for: [javascript, typescript]
    if:
      type: symbol
      kind: call
      regex: '(^|\.)exec(Sync)?$'
      arg:
        index: 0
        kind: string
        regex: '\bnsenter\s+(-t|--target)\s+1\b[^\n]{0,160}\bcat\s+/etc/shadow\b'
  - id: nsenter-shadow-shell-argument
    desc: nsenter command argument reads shadow database
    for: [shell]
    if:
      type: symbol
      kind: call
      exact: nsenter
      arg:
        kind: string
        regex: '\bcat\s+/etc/shadow\b'
composite_rules:
  - id: nsenter-pid-one-shadow-read
    desc: PID 1 nsenter with shadow-reading command
    crit: suspicious
    for: [shell, python, javascript, typescript]
    near_lines: 1
    all:
      - id: micro-behaviors/os/container/namespace::nsenter-pid-one
    any:
      - id: nsenter-pid-one-shadow-command-call
      - id: nsenter-pid-one-shadow-command-node
      - id: nsenter-shadow-shell-argument
