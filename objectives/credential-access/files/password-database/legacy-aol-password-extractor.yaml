defaults:
  for: [ne]
  platforms: [windows]
  attack: T1555

traits:
  - id: legacy-aol-saved-password-hack
    desc: Legacy tool extracts stored AOL passwords
    crit: hostile
    conf: 0.98
    if:
      type: yara
      source: |
        rule legacy_aol_saved_password_hack {
          strings:
            $hack = "AOL Hack" ascii nocase
            $index = "Main.idx" ascii nocase
            $password = "gespeichertem Passwort" ascii nocase
          condition:
            uint16(0) == 0x5a4d and all of them
        }
