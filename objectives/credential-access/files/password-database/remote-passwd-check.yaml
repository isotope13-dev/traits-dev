defaults:
  platforms: [unix, windows]
  for: [python, javascript, typescript, shell]

traits:
  - id: passwd-content-fingerprint-check
    desc: Checks text for passwd entry markers
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: 'root:x:0:0|b?["'']root:["''][^;\r\n]{0,80}b?["'']/bin/["'']'

composite_rules:
  - id: remote-passwd-disclosure-probe
    desc: Probes remote target and verifies passwd content
    crit: suspicious
    conf: 0.95
    attack: T1005,T1552.001
    all:
      - id: passwd-content-fingerprint-check
      - id: micro-behaviors/fs/path/credential/account-db::unix-account-database-path-reference
    any:
      - id: micro-behaviors/communications/http/client/exchange::http-request-markers-or-response-stream
      - id: micro-behaviors/communications/http/request/client/call::request-python
      - id: micro-behaviors/communications/http/request/client/call::http-get-or-post-operation
    unless:
      - id: metadata/path/directory::test-directory-component
      - id: well-known/tool/detection/defensive-scanner-context::published-defensive-scanner-context
