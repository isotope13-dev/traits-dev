defaults:
  platforms: [windows]
  for: [scripts, source, binaries]
  mbc: B0005

composite_rules:
  - id: domain-recon-ntds-dump
    desc: Domain reconnaissance accompanies VSS NTDS copying
    crit: hostile
    conf: 0.98
    attack: T1087.002,T1003.003
    all:
      - id: objectives/credential-access/files/password-database::shadow-copy-ntds-dump
    any:
      - id: micro-behaviors/network/share::net-view-domain-flag
      - id: micro-behaviors/os/user/lookup::windows-net-domain-user-query
      - id: micro-behaviors/os/user/lookup::windows-net-domain-group-query
    near_bytes: 8192
