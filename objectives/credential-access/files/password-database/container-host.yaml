# Recovery/forensics can use the same operations, so retain suspicious severity.
# This is co-occurrence in a command, not a proven bind-destination data flow.
defaults:
  platforms: [unix]
  for: [scripts, source]
  attack: T1003.008
composite_rules:
  - id: container-host-root-password-database-read
    desc: Host-root mount with password database read
    crit: suspicious
    conf: 0.95
    near_lines: 1
    all:
      - id: micro-behaviors/os/container/runtime::docker-cli-host-root-volume-mount
      - id: micro-behaviors/fs/read/file/target::prefixed-password-database-read-command
