# Collection, not a backdoor identity. Shell source operands require a following
# operand: cp's final operand is its destination. The call projection cannot
# express that relation for a variable-length source list, so use the AST here.
defaults:
  platforms: [linux]
  crit: suspicious
  conf: 0.97
  attack: T1003.008

traits:
  - id: shell-shadow-source-copy
    desc: Copies the Linux password hash database
    for: [shell]
    if:
      type: tree-sitter
      language: shell
      query: |
        ((command name: (command_name) @tool
           argument: (_) @source
           argument: (_) @following) @copy
         (#match? @tool "^(/(usr/)?bin/)?cp$")
         (#match? @source "^[\"']?/etc/shadow[\"']?$")
         (#not-match? @following "^[\"']?-")
         (#not-match? @copy "[ \\t](-[A-Za-z]*t|--target-directory)"))
  - id: call-shadow-source-copy
    desc: Copies the Linux password hash database
    for: [python]
    if:
      type: symbol
      kind: call
      regex: '^shutil\.(copy|copy2|copyfile)$'
      arg:
        index: 0
        from:
          whole_value: '^/etc/shadow$'
  - id: php-shadow-source-copy
    desc: Copies the Linux password hash database
    for: [php]
    if:
      type: symbol
      kind: call
      exact: copy
      arg:
        index: 0
        regex: '^/etc/shadow$'
