defaults:
  platforms: [unix, windows]
  for: [csharp, pe]
  attack: T1552.001

traits:
  # The names alone are a notable observation, not evidence of access.
  - id: unix-shadow-passwd-path-pair-observed
    desc: Unix shadow and passwd path names
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: '/etc/shadow[\s\S]{0,140}/etc/passwd'

composite_rules:
  # Bind the existing suspicious finding to the .NET context it required.
  - id: unix-shadow-passwd-path-pair
    desc: Unix shadow and passwd names in .NET
    crit: suspicious
    conf: 0.94
    for: [pe]
    all:
      - id: unix-shadow-passwd-path-pair-observed
      - id: metadata/binary/framework::dotnet-assembly
