defaults:
  platforms: [unix, windows]
  attack: T1552.001

traits:
  - id: unix-shadow-passwd-path-pair
    desc: Unix shadow and passwd database path pair
    crit: suspicious
    conf: 0.94
    for: [csharp, pe]
    if:
      type: text
      regex: '/etc/shadow[\s\S]{0,140}/etc/passwd'
    # A path pair alone is still useful sensitive-file context. It becomes
    # suspicious only in the .NET context this detector was designed for;
    # native compilers such as Go coalesce unrelated literals into one pool.
    downgrade:
      none:
        - id: metadata/binary/framework::dotnet-assembly
