defaults:
  platforms: [windows]
  for: [powershell]

traits:
  - id: raw-copy-of-sam-or-ntds-variable
    desc: Raw copy targets SAM or NTDS variable
    crit: notable
    conf: 0.96
    if:
      type: text
      regex: '(?i)\bCopy-RawItem\s+\$(SamPath|NTDSPath)\b'

composite_rules:
  - id: wmi-snapshot-credential-file-copy
    desc: WMI shadow copy stages credential databases
    crit: hostile
    conf: 0.98
    attack: T1003.002,T1003.003
    all:
      - id: micro-behaviors/os/wmi/query::shadowcopy-cmdlet-query
      - id: micro-behaviors/fs/path/account-db::windows-sam-hive-path
      - id: micro-behaviors/fs/path/account-db::windows-ntds-database-path-text
      - id: micro-behaviors/fs/path/config/system::windows-system-hive-path
      - id: raw-copy-of-sam-or-ntds-variable
