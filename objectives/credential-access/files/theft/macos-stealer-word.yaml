defaults:
  for:
    - macho
    - objc
    - swift
    - applescript
  platforms:
    - macos
composite_rules:
  - id: stealer-word-obfuscated-macos-collector
    desc: Stealer keyword obfuscated macOS collector
    crit: hostile
    conf: 0.95
    for: [macho]
    attack: T1555
    all:
      - id: stealer-word-macho
      - id: stealer-labeled-obfuscated-collector
    downgrade:
      any:
        - id: metadata/signed/platform::apple
