defaults:
  platforms: [windows, unix]
  for: [java_class, class]
composite_rules:
  - id: account-report-data-sqm-clues
    desc: Account, password and data.sqm clues
    crit: hostile
    conf: 0.93
    attack: T1552.001
    near_bytes: 4000
    all:
      - id: micro-behaviors/fs/path/account-db::accounts-ini-settings-path
      - id: metadata/lang/natural/credential::password-report-label
      - id: metadata/lang/natural/credential::username-report-label
      - id: metadata/path/storage::data-sqm-path-reference
