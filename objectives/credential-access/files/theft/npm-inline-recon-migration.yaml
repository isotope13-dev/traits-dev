defaults:
  platforms: [unix, windows]
  for: [package.json]
  crit: suspicious
  conf: 0.85

composite_rules:
- id: postinstall-docker-host-shadow-access
  desc: Postinstall host mount and shadow path
  crit: suspicious
  conf: 0.99
  attack: "T1195.002,T1611,T1005"
  mbc: "E1005"
  all:
  - id: metadata/package/scripts/command::postinstall-inline-node-const-reference
  - id: micro-behaviors/fs/volume/mount::postinstall-docker-root-host-mount
  - id: micro-behaviors/fs/path/account-db::postinstall-host-shadow-file-read
