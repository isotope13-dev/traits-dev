defaults:
  for: [go]
  platforms: [unix, windows]
traits:
  - id: go-cloud-ssh-credential-zip-upload
    desc: Archives cloud and SSH credentials for upload
    crit: hostile
    conf: 0.99
    if:
      type: yara
      source: |
        rule go_cloud_ssh_credential_zip_upload {
          strings:
            $cloud = ".config/gcloud/application_default_credentials.json"
            $ssh = ".ssh/id_rsa"
            $zip = "z := zip.NewWriter(buf)"
            $open = "os.Open(p)"
            $entry = "z.Create(p)"
            $copy = "io.Copy(w, r)"
            $post = "http.Post("
            $body = ", buf)"
          condition:
            all of them and @zip < @open and @open < @entry and @entry < @copy and @copy < @post
        }
