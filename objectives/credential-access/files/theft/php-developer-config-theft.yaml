defaults:
  platforms: [unix, windows]
  for: [php]
  attack: T1552.001
  mbc: E1552

composite_rules:
  - id: php-developer-credential-file-harvest
    desc: PHP harvests developer and container credential files
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/fs/read/file/target::registry-credential-path-read-cluster
      - id: micro-behaviors/os/env/read/named::php-getenv-home
      - id: micro-behaviors/fs/read/file/content/unspecified::php-file-get-variable-source
    unless:
      - id: metadata/path/directory::test-directory-component
