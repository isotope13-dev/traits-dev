defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, shell]

composite_rules:
- id: vscode-extension-llm-secret-harvest
  desc: VSCode extension with credential search clues
  crit: suspicious
  conf: 0.99
  for: [javascript, typescript]
  all:
  - id: well-known/lib/development/vscode::require-vscode
  - id: objectives/credential-access/files/secret-sweep::child-process-credential-search-wording
