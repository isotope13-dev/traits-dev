defaults:
  platforms: [unix]
  for: [shell]

traits:
  - id: shell-add-shadow-sync-file
    desc: Adds shadow path to sync-file helper
    crit: notable
    conf: 0.94
    if:
      type: tree-sitter
      language: shell
      query: |
        (command name: (command_name (word) @cmd)
          argument: (word) @path
          (#eq? @cmd "add_sync_file")
          (#match? @path "^/etc/(g?shadow)$"))
