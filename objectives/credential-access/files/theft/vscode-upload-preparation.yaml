# Credential search, a sensitive-file clue and multipart assembly support likely
# credential collection and upload preparation. No completed transfer, LLM use
# or binding between the file and multipart body is required.
composite_rules:
- platforms:
  - unix
  - windows
  for:
  - javascript
  - typescript
  id: vscode-credential-search-upload-preparation
  desc: Credential search with sensitive files and upload preparation
  crit: notable
  conf: 0.99
  all:
  - id: objectives/credential-access/files/theft::vscode-extension-llm-secret-harvest
  - id: micro-behaviors/communications/http/form::form-data-append
  any:
  - id: micro-behaviors/fs/path/private-key::ssh-id-rsa-filename-reference
  - id: micro-behaviors/fs/read/file/content/configuration::node-npmrc-read-reference
  - id: micro-behaviors/fs/read/file/target::github-token-pattern-file-operations
  - id: micro-behaviors/fs/read/file/target::github-npm-pattern-file-operations
