# A module that reads a vendor CLI's credentials.json and attaches the access
# token as a Bearer header reuses that token for an outbound request. Vendor
# clients do this for their own service, so the composite is suspicious: it
# marks token reuse, not theft. The file name is a generic credential name, so
# it cannot prove which service issued the token.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  attack: T1552.001

composite_rules:
  - id: cli-credentials-file-bearer-reuse
    desc: Reads a credentials.json token into a Bearer header
    crit: suspicious
    conf: 0.9
    near_bytes: 12000
    all:
      - id: micro-behaviors/fs/path/credential/generic-basename::credentials-json-path-segment
      - id: micro-behaviors/fs/read/file/content/whole::read-node-symbol
      - id: micro-behaviors/communications/http/authorization-header::js-bearer-header-from-auth-token
