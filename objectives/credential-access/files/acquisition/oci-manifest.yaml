defaults:
  for: [json]
  platforms: [linux]

traits:
  - id: registry-config-system-secret-traversal
    desc: Config digest traversal targets system secrets
    crit: notable
    if:
      type: value
      path: config.digest
      regex: '^(\.\./){2,}(etc/shadow|proc/self/environ)$'

  - id: registry-config-ollama-secret-traversal
    desc: Config digest traversal targets Ollama key
    crit: notable
    if:
      type: value
      path: config.digest
      regex: '^(\.\./){2,}(root|home/[^/\r\n]{1,64})/\.ollama/id_ed25519$'

  - id: registry-config-aws-secret-traversal
    desc: Config digest traversal targets AWS credentials
    crit: notable
    if:
      type: value
      path: config.digest
      regex: '^(\.\./){2,}(root|home/[^/\r\n]{1,64})/\.aws/(config|credentials)$'

  - id: registry-config-ssh-secret-traversal
    desc: Config digest traversal targets SSH private key
    crit: notable
    if:
      type: value
      path: config.digest
      regex: '^(\.\./){2,}(root|home/[^/\r\n]{1,64})/\.ssh/id_(rsa|ed25519)$'

  - id: registry-layer-system-secret-traversal
    desc: Layer digest traversal targets system secrets
    crit: notable
    if:
      type: value
      path: layers[*].digest
      regex: '^(\.\./){2,}(etc/shadow|proc/self/environ)$'

  - id: registry-layer-ollama-secret-traversal
    desc: Layer digest traversal targets Ollama key
    crit: notable
    if:
      type: value
      path: layers[*].digest
      regex: '^(\.\./){2,}(root|home/[^/\r\n]{1,64})/\.ollama/id_ed25519$'

  - id: registry-layer-aws-secret-traversal
    desc: Layer digest traversal targets AWS credentials
    crit: notable
    if:
      type: value
      path: layers[*].digest
      regex: '^(\.\./){2,}(root|home/[^/\r\n]{1,64})/\.aws/(config|credentials)$'

  - id: registry-layer-ssh-secret-traversal
    desc: Layer digest traversal targets SSH private key
    crit: notable
    if:
      type: value
      path: layers[*].digest
      regex: '^(\.\./){2,}(root|home/[^/\r\n]{1,64})/\.ssh/id_(rsa|ed25519)$'

composite_rules:
  - id: registry-config-secret-traversal
    desc: Config digest traversal targets secrets
    crit: notable
    any:
      - id: registry-config-system-secret-traversal
      - id: registry-config-ollama-secret-traversal
      - id: registry-config-aws-secret-traversal
      - id: registry-config-ssh-secret-traversal

  - id: registry-layer-secret-traversal
    desc: Layer digest traversal targets secrets
    crit: notable
    any:
      - id: registry-layer-system-secret-traversal
      - id: registry-layer-ollama-secret-traversal
      - id: registry-layer-aws-secret-traversal
      - id: registry-layer-ssh-secret-traversal

  - id: registry-manifest-secret-target
    desc: Registry traversal targets credential files
    ref: https://www.rapid7.com/blog/post/tr-self-hosted-ai-renting-compute-exposed-servers/
    crit: hostile
    attack: T1552.001
    all:
      - id: objectives/execution/exploit/path-traversal::oci-manifest-digest-traversal
    any:
      - id: registry-config-secret-traversal
      - id: registry-layer-secret-traversal
