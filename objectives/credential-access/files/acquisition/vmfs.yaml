# Require the sensitive path as the source operand of extraction on the same
# parsed command. A destination named NTDS and an ls/info operation do not qualify.
defaults:
  platforms: [unix]
  for: [shell]
  attack: T1003.003
traits:
  - id: vmfs-extract-ntds
    desc: Extracts NTDS from a guest disk
    crit: suspicious
    if:
      type: symbol
      kind: call
      regex: '^(/usr/(local/)?bin/)?python([23](\.[0-9]{1,2})?)?$'
      args:
        - index: 1
          kind: identifier
          name: '-d'
        - index: 3
          kind: identifier
          name: extract
        - index: 4
          kind: string
          regex: '(?i)\.vmdk:part[0-9]+/Windows/NTDS(/ntds\.dit)?$'
  - id: vmfs-extract-system-hive
    desc: Extracts SYSTEM hive from guest disk
    crit: suspicious
    attack: T1003
    if:
      type: symbol
      kind: call
      regex: '^(/usr/(local/)?bin/)?python([23](\.[0-9]{1,2})?)?$'
      args:
        - index: 1
          kind: identifier
          name: '-d'
        - index: 3
          kind: identifier
          name: extract
        - index: 4
          kind: string
          regex: '(?i)\.vmdk:part[0-9]+/Windows/System32/config/SYSTEM$'
  - id: vmfs-extract-security-hive
    desc: Extracts SECURITY hive from guest disk
    crit: suspicious
    attack: T1003.004
    if:
      type: symbol
      kind: call
      regex: '^(/usr/(local/)?bin/)?python([23](\.[0-9]{1,2})?)?$'
      args:
        - index: 1
          kind: identifier
          name: '-d'
        - index: 3
          kind: identifier
          name: extract
        - index: 4
          kind: string
          regex: '(?i)\.vmdk:part[0-9]+/Windows/System32/config/SECURITY$'
composite_rules:
  - id: vmfs-guest-credential-extraction
    desc: Extracts guest NTDS database and SYSTEM hive from virtual disks
    crit: hostile
    conf: 0.98
    near_lines: 10
    all:
      - id: vmfs-extract-ntds
      - id: vmfs-extract-system-hive
  - id: vmfs-guest-lsa-hive-extraction
    desc: Extracts guest SECURITY and SYSTEM hives from virtual disks
    crit: hostile
    conf: 0.98
    attack: T1003.004
    near_lines: 10
    all:
      - id: vmfs-extract-security-hive
      - id: vmfs-extract-system-hive
