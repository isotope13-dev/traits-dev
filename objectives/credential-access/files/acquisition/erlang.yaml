defaults:
  platforms: [windows]
  for: [powershell]
  attack: T1552.001

traits:
  - id: powershell-read-erlang-cookie
    desc: Reads Erlang distribution cookie file
    crit: suspicious
    conf: 0.97
    ref: https://www.security.com/threat-intelligence/ai-assisted-attack-us-retailer
    if:
      type: text
      regex: '(?i)\bGet-Content\s+[''"][^''"\r\n]{0,200}\.erlang\.cookie[''"]'
      exclude_comments: true
