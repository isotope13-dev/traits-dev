# Filesystem markers for credential-dump output files, and the composites that
# convict a routine writing captured credentials to one.
#
# A file literally named credentials.txt / password.txt is where a credential
# harvester spills what it collected. On its own the name is only a weak hint
# (a fixture or a doc can mention it), so the markers stay low and earn a
# verdict only inside a composite that pairs them with the collection itself --
# here, a hook of the Windows NTLM validation routine.
defaults:
  platforms: [windows, unix]
  for: [scripts, source, binaries]
  attack: T1003

composite_rules:
  # Authentication, hooking, dump-file and write evidence can indicate a
  # credential capture routine. The co-occurrence does not bind the write to
  # the hook or prove the file contains captured credentials.
  - id: ntlm-validation-hook-credential-dump
    desc: NTLM hook, credential filename and write APIs
    crit: hostile
    conf: 0.96
    attack: T1003.001,T1056.004
    for: [c, cpp, pe, dll]
    all:
      - id: micro-behaviors/os/security/auth/verify::msv1-0-password-validate
      - id: micro-behaviors/fs/path/filename-credential::credentials-text-filename
      - id: micro-behaviors/process/hook/interception::windows-inline-hook-mechanic
    any:
      - id: micro-behaviors/fs/write/file/handle/unspecified::write-file
      - id: micro-behaviors/fs/write/file/handle/unspecified::write-file-source
      - id: micro-behaviors/fs/write/file/handle/unspecified::write--fwrite
