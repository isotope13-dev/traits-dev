defaults:
  for: [python, javascript]
  platforms: [unix, windows]
traits:
  - id: coauthoring-session-secret-selection
    desc: Select CoAuthoring session signing secret
    crit: notable
    conf: 1.0
    if:
      type: text
      regex: '\[["\x27]CoAuthoring["\x27]\]\s*\[["\x27]secret["\x27]\]\s*\[["\x27]session["\x27]\]'
composite_rules:
  - id: docbuilder-session-secret-read
    for: [python, javascript, zip]
    desc: DocBuilder reads session signing secrets
    scope: file
    crit: hostile
    conf: 0.98
    all:
      - id: coauthoring-session-secret-selection
      - id: micro-behaviors/fs/read/file/content/unspecified::native-font-binary-read
    near_bytes: 5000
