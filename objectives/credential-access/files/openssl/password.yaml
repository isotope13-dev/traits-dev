defaults:
  platforms: [windows, unix]
  for: [scripts, binaries, source]
traits:
  - id: openssl-hardcoded-pass
    desc: OpenSSL command with hardcoded password
    crit: suspicious
    conf: 0.8
    for: [scripts, source]
    if:
      type: literal
      kind: string
      regex: 'openssl\s+.{0,100}-pass\s+pass:[^<>"''\s\$\{][^<>"''\s\$]{2,99}'
    unless:
      - id: metadata/package/testing/
      - id: metadata/package/documentation/manpage::unix-manpage
      - type: basename
        regex: ^.{0,500}[\\/](examples?|demos?)[\\/].{0,500}$
      - type: text
        substr: "Demo to do the rough equivalent"
      - id: "metadata/file/naming::test-directory-component"
