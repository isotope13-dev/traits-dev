defaults:
  platforms: [linux, macos, windows, unix, android, ios]
  for: [python]
  attack: "T1041"

traits:
- id: encoded-package-secret-collector
  desc: Encoded package secret collector
  crit: suspicious
  conf: 0.95
  platforms: [unix]
  if:
    type: encoded
    regex: '\.docker/config\.json|\.pypirc|\.npmrc|\.netrc'
- id: b64-package-credential-files--rx-1
  desc: Regex component marker
  crit: suspicious
  conf: 0.93
  platforms: [unix]
  if:
    type: text
    substr: Lm5wbXJj
- id: b64-package-credential-files--rx-2
  desc: Regex component marker
  crit: suspicious
  conf: 0.93
  platforms: [unix]
  if:
    type: text
    substr: LnB5cGlyYw
- id: b64-package-credential-files--rx-3
  desc: Regex component marker
  crit: suspicious
  conf: 0.93
  platforms: [unix]
  if:
    type: text
    substr: Lm5ldHJj
- id: b64-package-credential-files--rx-4
  desc: Regex component marker
  crit: suspicious
  conf: 0.93
  platforms: [unix]
  if:
    type: text
    substr: LmRvY2tlci9jb25maWcuanNvbg
