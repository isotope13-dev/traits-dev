defaults:
  platforms: [windows, unix]
  for: [rust]
  attack: T1552.001
traits:
  - id: rust-dotenv-file-target
    desc: Rust targets dotenv files
    crit: notable
    conf: 0.9
    if:
      type: text
      substr: '".env"'
  - id: rust-document-secret-extensions
    desc: Rust document secret extensions
    crit: notable
    conf: 0.85
    if:
      type: text
      substr: 'const DOC_EXTENSIONS'
composite_rules:
  - id: rust-credential-file-scanner
    desc: Rust credential file scanner
    crit: suspicious
    conf: 0.95
    all:
    - id: rust-dotenv-file-target
    - id: rust-document-secret-extensions
    any:
    - id: objectives/credential-access/wallet/keywords
    - id: micro-behaviors/os/application/target::wallet-brand-metamask
    - id: micro-behaviors/os/application/target::electrum-word
    - id: micro-behaviors/os/application/target::exodus-word
    - id: micro-behaviors/os/application/target::trezor-word
    - id: micro-behaviors/os/application/target::rust-wallet-keyword-trustwallet
    - id: micro-behaviors/os/application/target::wallet-app-name-cluster
    - id: micro-behaviors/os/application/target::crypto-wallet-keyword-cluster--rx-1
    - id: micro-behaviors/os/application/target::crypto-wallet-keyword-cluster--rx-2
    - id: micro-behaviors/os/application/target::hardware-wallet-keyword-cluster--rx-6
    - id: micro-behaviors/os/application/target::hardware-wallet-keyword-cluster--rx-7
    - id: micro-behaviors/os/application/target::hardware-wallet-keyword-cluster--rx-8
    - id: micro-behaviors/os/application/target::hardware-wallet-keyword-cluster--rx-9
    - id: micro-behaviors/os/application/target::hardware-wallet-keyword-cluster--rx-10
    - id: micro-behaviors/crypto/asymmetric/key::private-key-word
    - id: micro-behaviors/crypto/asymmetric/key::xrpl-seed-literal
    - id: micro-behaviors/crypto/asymmetric/key::node-wallet-key-token
    - id: micro-behaviors/fs/path/wallet::node-wallet-json-target
    - id: micro-behaviors/fs/path/private-key::node-keypair-json-target
    - id: micro-behaviors/crypto/mnemonic::node-mnemonic-token
    - id: micro-behaviors/crypto/mnemonic::node-seed-phrase-token
