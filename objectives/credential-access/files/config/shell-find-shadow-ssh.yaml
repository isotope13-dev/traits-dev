defaults:
  platforms: [panos, appliance, unix]
  for: [shell]
  attack: T1041

traits:
  - id: panos-shell-sensitive-file-harvest
    desc: PAN-OS shell sensitive file harvest
    crit: suspicious
    conf: 0.94
    if:
      type: text
      substr: 'find /etc/shadow /etc/gshadow /etc/ssh /root/.ssh /home'
