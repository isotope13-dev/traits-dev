# The standard ASP.NET configuration names are runtime conventions, not
# incident-specific filenames. Match the traversal and target in one literal
# so unrelated configuration references cannot complete the observation.
defaults:
  platforms: [windows, unix]
  for: [scripts, source]

traits:
  - id: dotnet-config-parent-traversal
    desc: Traversal targets ASP.NET configuration
    crit: suspicious
    conf: 0.97
    attack: T1552.001,T1190
    if:
      type: string_literal
      regex: '(?i)(\.\.([\\/]|%5c|%2f)){2,}(appsettings(\.[\w-]{1,40})?\.json|web\.config)($|[?&#])'
    unless:
      - id: well-known/tool/offensive/payload-corpus::scanner-request-payload-context
