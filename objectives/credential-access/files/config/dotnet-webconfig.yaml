defaults:
  platforms: [windows]
  for: [csharp, javascript, aspx]

traits:
  # The standard configuration filename, reader construction, full read and
  # password-key helper argument must occur in this order within short spans.
  # This does not bind the reader result to the helper's first argument;
  # legitimate credential audits remain possible, hence suspicious.
  - id: dotnet-webconfig-password-reader
    desc: Web.config read with password-key helper call
    crit: suspicious
    conf: 0.95
    attack: T1552.001
    if:
      type: text
      exclude_html_comments: true
      regex: '(?is)web\.config.{0,160}StreamReader.{0,80}ReadToEnd.{0,80}\(\w+,\s*"password"'
