# A package that goes looking for the environment's secrets as it is imported.
#
# The PyPI package `cubesat-upstream-driver` opens each of `/flag`,
# `/flag.txt`, `/root/flag.txt` and friends, globs `/**/flag*` when none of
# them exist, then filters the environment for names containing flag, secret,
# ctf, key or token, and falls back to returning the whole environment. The
# result is assigned at module level, so importing the package is enough.
#
# Reading one of those paths is a challenge solution; reading the list of them
# and then dumping the environment is a sweep, and it does not become benign
# because the box it runs on happens to be a lab.
defaults:
  platforms: [unix]
  for: [scripts, source]
  attack: T1552.001,T1083
  mbc: C0032

composite_rules:
  - id: canonical-secret-path-sweep
    desc: Sweeps canonical flag paths and the environment
    crit: hostile
    conf: 0.94
    all:
      - id: micro-behaviors/fs/path/secret-config::ctf-flag-file-path-list
    any:
      - id: micro-behaviors/os/env/enumeration::python-environ-items-loop
      - id: micro-behaviors/fs/directory/traverse::traverse-glob-call
    needs: 2

  - id: import-time-secret-path-sweep
    desc: Import assigns a secret path sweep
    crit: hostile
    conf: 0.96
    for: [python]
    scope: file
    near_lines: 60
    all:
      - id: canonical-secret-path-sweep
      - id: micro-behaviors/data/control-flow/module-exec::python-module-level-call-assignment
