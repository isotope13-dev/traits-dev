defaults:
  for:
  - powershell
  platforms:
  - windows
  crit: notable
  conf: 0.98
composite_rules:
- id: powershell-sitelist-password-decryptor
  desc: Recovers SiteList XML passwords into plaintext output
  crit: hostile
  all:
  - id: micro-behaviors/data/format/xml::powershell-sitelist-entry-selector
  - id: micro-behaviors/data/property/assign::powershell-decpassword-field-assignment
  - id: micro-behaviors/crypto/hash/digest::dotnet-computehash
  - id: micro-behaviors/crypto/cipher::dotnet-transform-final-block
  - id: micro-behaviors/fs/read/file/full::get-content
