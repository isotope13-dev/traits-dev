# The GitHub CLI stores its OAuth token in ~/.config/gh/hosts.yml as a plain
# `oauth_token:` YAML field, so stealers read that file and pull the field back
# out with a regex.
#
# `oauth_token` by itself is an ordinary OAuth 1.0a parameter name: every OAuth1
# client carries it in request objects, option bags and JSDoc (twitter-api-v2's
# generateAuthLink docs are what a bare `oauth_token:\s*` matcher fires on).
# The field name convicts nothing on its own -- the extraction shape plus the gh
# config path is what makes this credential harvesting rather than OAuth code.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  attack: T1552.001
  mbc: B0029

traits:
  - id: oauth-token-yaml-field-regex
    desc: Regex extracts an oauth_token config field
    crit: notable
    conf: 0.92
    if:
      type: text
      regex: 'match\s*\(\s*/oauth_token:'
    unless:
      - id: well-known/tool/detection/threat-intel/
      - id: well-known/app/storage/akm/

composite_rules:
  - id: gh-cli-token-file-harvest
    desc: Reads the GitHub CLI hosts file and extracts its oauth_token
    crit: suspicious
    conf: 0.95
    all:
      - id: micro-behaviors/fs/path/sensitive/credentials::gh-cli-hosts
      - id: oauth-token-yaml-field-regex
