composite_rules:
- platforms:
  - unix
  - windows
  for:
  - php
  - c
  - cpp
  - python
  - shell
  attack: T1552
  id: database-credential-harvesting
  desc: Harvesting database credentials
  crit: hostile
  conf: 0.95
  all:
  - id: micro-behaviors/fs/path/config/web::database-config-path
  - id: metadata/lang/source/syntax/key-value::connection-like-field-literals
  - id: micro-behaviors/fs/read/file/
  near_bytes: 4096
  near_lines: 32
  unless:
  - id: well-known/lib/format/deb-package/
  - id: well-known/app/publishing/civicrm/
  - id: well-known/tool/offensive/sic-security/
  - id: well-known/tool/development/cli/charm-tools::charm-tools-test-layer-path
  - id: well-known/app/publishing/wordpress-plugins/
  - id: micro-behaviors/data/db/config::wordpress-database-client
  - id: well-known/lib/runtime/scripted/php-libraries::upstream-php-source
  - id: micro-behaviors/data/db/mysql::pymysql
  - id: well-known/lib/data/pymysql::pymysql-package-path
