composite_rules:
- platforms:
  - unix
  - windows
  for:
  - php
  - c
  - cpp
  - python
  - shell
  attack: T1552
  id: database-credential-harvesting
  desc: Database configuration and credential fields near file reads
  crit: suspicious
  conf: 0.95
  all:
  - id: micro-behaviors/fs/path/config/web::database-config-path
  - id: metadata/lang/source/literal/string/property::connection-like-field-literals
  - id: micro-behaviors/fs/read/file/
  near_bytes: 4096
  near_lines: 32
