# FortiOS stores local administrator passwords as encrypted configuration
# values. Reading an administrator record and filtering specifically for the
# `password ENC` field extracts that reusable secret material from the device
# configuration. The command shape is stable whether it appears directly in a
# FortiOS CLI task or is embedded in another language.
defaults:
  platforms: [fortios, appliance, unix]
  for: [scripts, binaries]
  attack: T1552.001

traits:
  - id: fortios-encrypted-password-filter
    desc: Filters FortiOS encrypted password field
    crit: suspicious
    conf: 0.96
    if:
      type: text
      regex: '(?i)\bgrep(\s+-[A-Za-z]+)?\s+["'']?password\s+ENC\b'

composite_rules:
  # The neutral admin-config read supplies the source; selecting the encrypted
  # password field supplies the credential-access intent.
  - id: fortios-admin-encrypted-password-query
    desc: Queries a FortiOS administrator password
    crit: suspicious
    conf: 0.98
    near_lines: 2
    all:
      - id: micro-behaviors/os/user/account::fortios-admin-config-read
      - id: fortios-encrypted-password-filter
