defaults:
  platforms: [freebsd, netbsd, unix]
  for: [c, cpp, objc, elf]
  attack: T1552.001

composite_rules:
  - id: native-user-secret-dotfiles
    desc: Native reads multiple credential dotfiles
    crit: suspicious
    conf: 0.92
    near_bytes: 512
    all:
      - id: micro-behaviors/fs/read/file
    any:
      - id: micro-behaviors/fs/path/sensitive/credentials::netrc
      - id: micro-behaviors/fs/path/sensitive/credential-filenames::pgpass
      - id: micro-behaviors/fs/path/sensitive/credential-filenames::mycnf
    needs: 2
    unless:
      - id: well-known/app/infrastructure/terraform::terraform-core-binary
      - id: well-known/app/infrastructure/opentofu::opentofu-core-binary

  - id: native-bsd-credential-sweep
    desc: Native BSD credential sweep
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/fs/path/config/accounts::bsd-master-passwd-path
    any:
      - id: native-user-secret-dotfiles
      - id: objectives/credential-access/ssh/key::native-ssh-private-key-paths
      - id: micro-behaviors/fs/path/sensitive/credentials::ssh-authorized-keys
