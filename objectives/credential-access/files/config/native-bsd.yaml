defaults:
  platforms: [freebsd, netbsd, unix]
  for: [c, cpp, objc, elf]
  attack: T1552.001

composite_rules:
  - id: native-user-secret-dotfiles
    desc: Native reads multiple credential dotfiles
    crit: suspicious
    conf: 0.92
    near_bytes: 512
    all:
      - id: micro-behaviors/fs/read/file
    any:
      - id: micro-behaviors/fs/path/credential/registry::netrc
      - id: micro-behaviors/fs/path/credential/database::pgpass
      - id: micro-behaviors/fs/path/credential/database::mycnf
    needs: 2
    # AI coding agents ship a protected-dotfile inventory (.netrc, .pgpass,
    # .my.cnf, .ssh/*) as literal deny/ignore lists. Those strings are policy
    # data, not reads of the credential files.
    unless:
      - id: well-known/app/infrastructure/terraform::terraform-core-binary
      - id: well-known/app/infrastructure/opentofu::opentofu-core-binary
      - id: well-known/app/ai/coding-agent/vtcode::vtcode-agent-package
      - id: well-known/app/ai/coding-agent/vtcode::vtcode-binary-agent

  - id: native-bsd-credential-sweep
    desc: Native BSD credential file sweep
    crit: hostile
    conf: 0.98
    # In statically linked binaries, path inventories and generic read symbols
    # can be far apart. Require the path and read evidence to describe one
    # local operation rather than unrelated embedded tables.
    near_bytes: 4096
    all:
      - id: micro-behaviors/fs/path/credential/account-db::bsd-master-passwd-path
      # Two sensitive path strings alone are common in release notes and
      # configuration-parser corpora. Require native file-read behavior before
      # inferring that the paths form a credential sweep.
      - id: micro-behaviors/fs/read/file
    any:
      - id: native-user-secret-dotfiles
      - id: micro-behaviors/fs/path/credential/private-key::native-ssh-private-key-paths
      - id: micro-behaviors/fs/path/public-key::ssh-authorized-keys
    unless:
      - id: well-known/tool/detection/innerwarden::innerwarden-embedded-detector-corpus
      - id: well-known/tool/development/agent/ai-cli/daedalus::daedalus-threat-shield-corpus
