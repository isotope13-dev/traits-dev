defaults:
  for: [ruby]
  platforms: [windows]
  attack: T1552.001,T1190
composite_rules:
  - id: server-action-manifest-key-traversal
    desc: Exploit traverses to server-action key manifest
    crit: hostile
    conf: 0.99
    all:
      - id: well-known/tool/offensive/metasploit::remote-exploit-class-declaration
      - id: micro-behaviors/communications/http/lib/rex::rex-http-request-call
      - id: micro-behaviors/fs/path/secret-config::server-action-manifest-path
      - id: micro-behaviors/fs/path/traversal::encoded-parent-directory-segment
      - id: micro-behaviors/data/property/access::encryption-key-property-access
