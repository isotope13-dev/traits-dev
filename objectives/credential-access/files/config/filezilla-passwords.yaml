defaults:
  for:
  - powershell
  platforms:
  - windows
  crit: notable
  conf: 0.98
traits:
- id: filezilla-password-result-decode
  desc: Base64 decodes a saved session password
  if:
    type: text
    substr: ASCII.GetString([System.Convert]::FromBase64String($Session.Password))
composite_rules:
- id: powershell-filezilla-session-password-recovery
  desc: Recovers FileZilla saved session passwords
  crit: hostile
  all:
  - id: filezilla-password-result-decode
  - id: well-known/tool/offensive/sessiongopher::saved-session-password-extraction
  - id: micro-behaviors/fs/read
