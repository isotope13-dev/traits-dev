defaults:
  platforms: [unix, windows]
  for: [scripts, source]
  attack: T1552.001
composite_rules:
  - id: crowd-config-traversal-read
    desc: Crowd traversal with password key and body read
    crit: hostile
    conf: 0.99
    all:
      - id: objectives/execution/exploit/network-service/service-api-abuse::double-colon-traversal-request
      - id: micro-behaviors/fs/path/credential::crowd-application-credential-config
      - id: micro-behaviors/data/parse/vocabulary::crowd-application-password-key
      - id: micro-behaviors/communications/http/client/response-body/
    near_bytes: 1024

  - id: webxml-config-traversal-read
    desc: HTTP traversal targets Java web.xml
    crit: hostile
    conf: 0.99
    all:
      - id: objectives/execution/exploit/network-service/service-api-abuse::double-colon-traversal-request
      - id: micro-behaviors/fs/path/config/web::web-inf-web-xml-path
    near_bytes: 1024
