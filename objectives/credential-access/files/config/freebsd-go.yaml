defaults:
  platforms: [freebsd, unix]
  for: [go]
  attack: T1552.001

traits:
  - id: go-freebsd-master-passwd-read
    desc: Go directly reads BSD master password database
    crit: suspicious
    conf: 0.94
    if:
      type: symbol
      kind: call
      regex: '^os\\.(ReadFile|Open|OpenFile)$'
      arg:
        kind: string
        regex: '^/(private/)?etc/master\\.passwd$'
    unless:
      - id: well-known/lib/native/modernc-libc::source-tree
      - id: metadata/package/testing/harness/unit::go-test

composite_rules:
  - id: go-freebsd-credential-sweep
    desc: Go sweeps FreeBSD credentials
    crit: hostile
    conf: 0.98
    all:
      - id: go-freebsd-master-passwd-read
    any:
      - id: micro-behaviors/fs/path/developer-credential::go-user-secret-dotfiles
      - id: micro-behaviors/fs/path/private-key::go-user-ssh-private-key-paths
      - id: micro-behaviors/fs/path/public-key::ssh-authorized-keys
