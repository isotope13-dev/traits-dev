# Harvesting the IIS anonymous identity out of the metabase.
#
# A web shell dropped on a Windows server walks `IIS://localhost/w3svc`, and
# for every site prints the physical path and the account IIS serves anonymous
# requests as -- username and plaintext password. That account is usually a
# real domain or local user, so the output is a credential set and a map of
# every site root on the box in one page.
defaults:
  platforms: [windows]
  for: [scripts, source, binaries]
  attack: T1552.001,T1505.003
  mbc: C0032

composite_rules:
  - id: iis-metabase-anonymous-credential-read
    desc: Reads IIS anonymous credentials from metabase
    crit: hostile
    conf: 0.94
    all:
      - id: micro-behaviors/communications/http/server/module::iis-metabase-adsi-path
      - id: micro-behaviors/communications/http/server/module::iis-anonymous-user-password-property
