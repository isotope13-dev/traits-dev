defaults:
  platforms: [freebsd, netbsd, unix]
  for: [objc]
  attack: T1552.001

traits:
- id: objc-bsd-master-passwd-path
  desc: ObjC references BSD master.passwd
  crit: suspicious
  conf: 0.94
  if:
    type: text
    regex: '(/etc/master\.passwd|_PATH_MASTERPASSWD)'

- id: objc-browser-credential-paths
  desc: ObjC references browser credential paths
  crit: suspicious
  conf: 0.9
  if:
    type: text
    regex: '(Login Data|logins\.json|key4\.db)'

- id: objc-keychain-gpg-paths
  desc: ObjC references keychain or GPG paths
  crit: suspicious
  conf: 0.9
  if:
    type: text
    regex: '(Library/Keychains|secring\.gpg|SSH_AUTH_SOCK)'

- id: objc-bsd-config-paths
  desc: ObjC references BSD config paths
  crit: suspicious
  conf: 0.9
  if:
    type: text
    regex: '(/etc/rc\.conf|/boot/loader\.conf|/var/cron/tabs/root)'

- id: objc-ssh-key-paths--id-rsa
  desc: ObjC reads an SSH private-key filename
  crit: component
  conf: 0.7
  if:
    type: text
    word: id_rsa
- id: objc-ssh-key-paths--id-ed25519
  desc: ObjC reads an SSH private-key filename
  crit: component
  conf: 0.7
  if:
    type: text
    word: id_ed25519
- id: objc-ssh-key-paths--authorized-keys
  desc: ObjC reads an SSH authorized_keys filename
  crit: component
  conf: 0.7
  if:
    type: text
    word: authorized_keys
- id: objc-ssh-key-paths--known-hosts
  desc: ObjC reads an SSH known_hosts filename
  crit: component
  conf: 0.7
  if:
    type: text
    word: known_hosts

- id: objc-ssh-read-api--contents
  desc: ObjC calls a file-content read API
  crit: notable
  conf: 0.8
  if:
    type: symbol
    kind: call
    exact: 'contentsOfFile:'
- id: objc-ssh-read-api--data
  desc: ObjC calls a file-data read API
  crit: notable
  conf: 0.8
  if:
    type: symbol
    kind: call
    exact: 'dataWithContentsOfFile:'
- id: objc-ssh-read-api--exists
  desc: ObjC checks a file path
  crit: notable
  conf: 0.8
  if:
    type: symbol
    kind: call
    exact: 'fileExistsAtPath:'
- id: objc-ssh-read-api--open
  desc: ObjC opens a file stream
  crit: notable
  conf: 0.8
  if:
    type: symbol
    kind: call
    exact: fopen
  unless:
    # Google Breakpad mac test app uses fopen for crash-dump plumbing, not SSH.
    - id: well-known/game/openlierox::google-crash-tooling-path
    - id: well-known/game/openlierox/
composite_rules:
- id: objc-ssh-key-paths
  desc: ObjC reads an SSH-related file
  crit: notable
  conf: 0.8
  all:
  - id: objc-ssh-read-api
  any:
  - id: objc-ssh-key-paths--id-rsa
  - id: objc-ssh-key-paths--id-ed25519
  - id: objc-ssh-key-paths--authorized-keys
  - id: objc-ssh-key-paths--known-hosts
  near_lines: 30
- id: objc-ssh-read-api
  desc: ObjC calls a file-read API
  crit: notable
  conf: 0.8
  any:
  - id: objc-ssh-read-api--contents
  - id: objc-ssh-read-api--data
  - id: objc-ssh-read-api--exists
  - id: objc-ssh-read-api--open
- id: objc-bsd-credential-sweep
  desc: ObjC sweeps BSD credentials
  crit: hostile
  conf: 0.98
  all:
  - id: objc-bsd-master-passwd-path
  any:
  - id: objc-ssh-key-paths
  - id: objc-browser-credential-paths
  - id: objc-keychain-gpg-paths
  - id: objc-bsd-config-paths
  - id: micro-behaviors/os/privilege/paths::etc-shadow
  needs: 2
- id: objc-browser-keychain-http-stealer
  desc: ObjC browser keychain HTTP stealer
  crit: hostile
  conf: 0.98
  platforms: [macos]
  attack: T1555.003
  for: [objc, archives]
  scope: archive
  all:
  - id: objc-browser-credential-paths
  - id: objc-keychain-gpg-paths
  any:
  - id: micro-behaviors/communications/http/lib/nsurlsession::nsurlsession-post
  - id: micro-behaviors/communications/http/lib/nsurlsession::nsurlrequest-init
