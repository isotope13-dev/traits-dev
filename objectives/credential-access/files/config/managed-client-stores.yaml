defaults:
  platforms: [windows]
  for: [pe, dll]

composite_rules:
  # Two client stores plus file-reading and DPAPI references suggest credential
  # extraction, but also fit legitimate recovery utilities. These are same-file
  # observations, not a proven path-to-read or decrypt-to-report flow.
  - id: managed-multi-client-credential-store-access
    desc: Multiple client credential stores with managed read and DPAPI APIs
    crit: suspicious
    conf: 0.93
    attack: T1555
    all:
      - id: metadata/binary/framework::dotnet-assembly
      - id: metadata/signed/trust-level::unsigned-missing-signature-record
      - id: micro-behaviors/fs/read/file/full::dotnet-read-all-text
      - id: micro-behaviors/os/security/dpapi::dotnet-protected-data-reference
    any:
      - id: micro-behaviors/os/registry/keys/credential::outlook-profile-registry-key
      - id: micro-behaviors/fs/path/password-store::filezilla-recentservers-path
      - id: micro-behaviors/fs/path/app-data::nordvpn-path
    needs: 2
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/installer/family/
