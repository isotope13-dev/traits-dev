# These assignments construct credential-recovery commands. They need not
# execute at import time, and legitimate IIS credential audits use them too.
# Match parsed assignments rather than comments or documentation examples.
# Full-node queries are intentional: the simple kind matcher currently tests
# cached, 100-character display evidence and misses longer command strings.
defaults:
  for: [powershell]
  platforms: [windows]
  crit: suspicious
  conf: 0.95
  attack: T1552.001

traits:
  - id: powershell-iis-apppool-password-command
    desc: Builds AppCmd pool-password query
    if:
      type: tree-sitter
      query: |
        ((assignment_expression) @command
          (#match? @command "(?is)\\bappcmd(\\.exe)?\\s+list\\s+apppool\\b.{0,96}/text:processmodel\\.password\\b"))

  - id: powershell-iis-vdir-password-command
    desc: Builds AppCmd vdir-password query
    if:
      type: tree-sitter
      query: |
        ((assignment_expression) @command
          (#match? @command "(?is)\\bappcmd(\\.exe)?\\s+list\\s+vdir\\b.{0,96}/text:password\\b"))

  - id: powershell-webconfig-connectionstrings-decrypt-command
    desc: Builds connectionStrings decryption command
    if:
      type: tree-sitter
      query: |
        ((assignment_expression) @command
          (#match? @command "(?i)-pdf\\s+[\"']connectionStrings[\"']"))
