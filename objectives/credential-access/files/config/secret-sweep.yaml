# A recursive grep across a configuration tree for the keys that hold secrets —
# directory bind passwords, federation shared secrets, seed material. The
# matcher keys on the command shape (recursive grep, quoted pattern naming a
# secret-bearing key), not on the words alone, so a document that merely
# mentions passwords does not qualify.
defaults:
  platforms: [unix]
  for: [shell, python, javascript, go, ruby, perl]
  attack: T1552.001

traits:
  - id: recursive-config-secret-grep
    desc: Recursive grep for secret config keys
    crit: suspicious
    conf: 0.9
    if:
      type: text
      regex: 'grep\s+-[A-Za-z]{0,4}r[A-Za-z]{0,4}\s+[''"][^''"]{0,48}(assword|ecret|Seed)'
