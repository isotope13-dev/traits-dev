# ServiceNow MID server credential configuration file (config.xml).
#
# Each MID server keeps the credentials of its service account in the
# config.xml under its agent directory. Attackers who can insert ECC queue
# records run OS commands on a named MID server to print this file,
# recovering the MID service account (typically import_admin) for
# re-entry and proxy details for further implants (MDSec, "When it Snows
# it Pours", 2026). A bare config.xml reference means nothing; one
# addressed to a MID server — via an ecc_queue record, a JavascriptProbe,
# or a mid.server agent — is aimed at the MID credential store.
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript, json, text, data]
  attack: T1552.001

traits:
  - id: servicenow-mid-config-file-ref
    desc: References a config.xml file path
    crit: component
    conf: 0.85
    if:
      type: text
      regex: '[''"][^''"\n]{0,120}config\.xml[''"]'

composite_rules:
  - id: servicenow-mid-config-credential-file-access
    desc: Targets MID server config.xml credential file
    crit: suspicious
    conf: 0.94
    all:
      - id: servicenow-mid-config-file-ref
    any:
      - id: objectives/command-and-control/remote-command/saas::servicenow-mid-server-agent-target
      - id: objectives/command-and-control/remote-command/saas::servicenow-ecc-queue-write
      - id: objectives/command-and-control/remote-command/saas::servicenow-javascriptprobe
    near_bytes: 1200
