# Raw environment disclosure plus cross-process environment and registry-auth
# targeting, captured in a distributable build artifact. Ordinary diagnostic
# logging or cloud SDK endpoint references alone do not satisfy this rule.
defaults:
  platforms: [linux]
  for: [python]
  attack: T1552.001

composite_rules:
  - id: python-credential-artifact-report
    desc: Captures environment and credentials in package logs
    crit: hostile
    conf: 0.96
    all:
      - id: micro-behaviors/os/env/dump::python-print-environment-values
      - id: micro-behaviors/fs/proc/info/path::process-var-environ
      - id: micro-behaviors/fs/path/secret-config::docker-config
      - id: micro-behaviors/fs/file/read-write::python-read-file-function
      - id: micro-behaviors/os/telemetry/logging/event::python-package-artifact-log
      - id: micro-behaviors/os/telemetry/logging/event::python-print-replacement
