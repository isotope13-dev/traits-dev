defaults:
  platforms: [unix]
  for: [shell, php]
  attack: T1552.001

traits:
  - id: encoded-asterisk-auth-config-target
    desc: Encoded Asterisk authentication config paths
    crit: suspicious
    conf: 0.97
    if:
      type: encoded
      regex: '/etc/asterisk/(manager|pjsip\.auth|sip_registrations)\.conf'
