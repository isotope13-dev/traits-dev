defaults:
  for:
  - powershell
  platforms:
  - windows
  crit: notable
  conf: 0.98
traits:
- id: sitelist-recursive-secret-file-search
  desc: Recursively locates SiteList credential XML
  if:
    type: text
    regex: Get-ChildItem -Path \$_ -Recurse -Include [\x27]SiteList\.xml[\x27]
composite_rules:
- id: powershell-sitelist-profile-credential-sweep
  desc: Sweeps profiles for SiteList credentials
  crit: hostile
  all:
  - id: sitelist-recursive-secret-file-search
  - id: objectives/credential-access/files/config::powershell-sitelist-password-decryptor
