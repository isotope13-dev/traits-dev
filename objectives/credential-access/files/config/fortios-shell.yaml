defaults:
  platforms: [fortios, unix]
  for: [shell]
  attack: T1552.001

traits:
  - id: fortios-admin-encrypted-password-query
    desc: Queries FortiOS encrypted admin password
    crit: suspicious
    conf: 0.98
    if:
      type: text
      regex: 'show system admin[^\n|]{1,80}\|\s*grep\s+["'']password ENC["'']'
