defaults:
  platforms: [unix, windows]
  for: [go]
  attack: T1552.001
  mbc: B0029
traits:
- id: home-dir-read--rx-1
  desc: "Matches 'os.ReadFile'"
  crit: notable
  conf: 0.85
  if:
    type: text
    regex: 'os\.ReadFile\([^)]{0,80}HomeDir'
- id: home-dir-read--rx-2
  desc: "Matches 'os.ReadFile' with 'filepath.Join'"
  crit: notable
  conf: 0.85
  if:
    type: text
    regex: 'os\.ReadFile\([^)]{0,80}filepath\.Join\([^)]{0,40}HomeDir'
- id: home-dir-read--rx-3
  desc: "Matches 'usr.HomeDir'"
  crit: notable
  conf: 0.85
  if:
    type: text
    regex: 'usr\.HomeDir[^)]{0,80}os\.ReadFile'
- id: home-dir-readfile-helper
  desc: ReadFile call against a home-directory path
  crit: notable
  conf: 0.85
  if:
    type: text
    regex: '\b\w*[Rr]ead[Ff]ile\s*\([^)]{0,200}(HomeDir|UserHomeDir|os\.Getenv\(\s*["`]HOME["`])'
- id: npmrc-fragment
  desc: .npmrc filename fragment
  crit: notable
  conf: 0.85
  if:
    type: text
    word: npmrc
- id: netrc-fragment
  desc: .netrc filename fragment
  crit: notable
  conf: 0.85
  if:
    type: text
    word: netrc
  unless:
  - id: metadata/lang/compiled::go-command-usage-line
- id: kube-fragment
  desc: kube config fragment
  crit: component
  conf: 0.85
  if:
    type: text
    word: kube
  unless:
  # Kubernetes source code is full of "kube" references that have
  # nothing to do with reading ~/.kube/config credential files.
  - type: text
    regex: 'k8s\.io/|kubernetes/|k8s\.io/client-go|"k8s\.'
  - id: metadata/package/testing/
  - id: "metadata/file/naming::test-directory-component"
composite_rules:
- id: go-multi-credential-file-harvest
  desc: Go program harvests multiple developer credential files
  crit: hostile
  conf: 0.96
  all:
  - id: home-dir-readfile-helper
  any:
  - id: micro-behaviors/fs/path/credential::any-credential-path
  - id: npmrc-fragment
  - id: netrc-fragment
  - id: kube-fragment
  needs: 2
- id: home-dir-read
  desc: Reads file under user home directory
  crit: component
  conf: 0.85
  any:
  - id: home-dir-read--rx-1
  - id: home-dir-read--rx-2
  - id: home-dir-read--rx-3
