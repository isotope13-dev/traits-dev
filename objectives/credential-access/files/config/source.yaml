defaults:
  platforms:
  - unix
  - windows
  for:
  - source
  - scripts
  attack: T1552.001
  mbc: B0029
traits:
- id: python-gh-host-file-read
  desc: Python reads GitHub CLI hosts file
  crit: notable
  conf: 0.94
  for:
  - python
  if:
    type: text
    regex: (?i)\bopen\s*\([^(]{0,180}\.config/gh/hosts\.yml\b
- id: python-git-credentials-file-read
  desc: Python reads Git credentials file
  crit: notable
  conf: 0.94
  for:
  - python
  if:
    type: text
    regex: (?i)\bopen\s*\([^(]{0,180}\.git-credentials\b
- id: python-netrc-file-read
  desc: Python reads netrc credentials file
  crit: notable
  conf: 0.94
  for:
  - python
  if:
    type: text
    regex: (?i)\bopen\s*\([^(]{0,180}\.netrc\b
- id: maven-server-password-open
  desc: Maven settings server block with password
  crit: notable
  conf: 0.8
  if:
    type: text
    regex: <server>[\s\S]{0,200}<(id|username)>[\s\S]{0,200}<password>
- id: maven-server-password-close
  desc: Maven settings password inside server block
  crit: notable
  conf: 0.8
  if:
    type: text
    regex: <password>[\s\S]{0,200}</password>[\s\S]{0,80}</server>
composite_rules:
- id: python-source-control-file-read
  desc: Python reads source-control credential files
  crit: notable
  for:
  - python
  any:
  - id: python-gh-host-file-read
  - id: python-git-credentials-file-read
- id: python-developer-credential-file-read
  desc: Python reads developer credential files
  crit: notable
  for:
  - python
  any:
  - id: python-source-control-file-read
  - id: python-netrc-file-read
- id: npm-credential-http-marker
  desc: NPM credential path with HTTP
  crit: notable
  conf: 0.95
  for:
  - javascript
  - typescript
  any:
  - id: micro-behaviors/fs/read/file/content/configuration::node-package-credential-read-reference
  - id: micro-behaviors/fs/read/file/target::home-credential-path-near-read
  all:
  - id: objectives/exfiltration/stealer/credential/file::credential-file-http-flow-with-client-clues
- id: developer-credential-sweep
  desc: Sweeps developer and cloud credentials
  crit: hostile
  conf: 0.98
  # Keep credential path references and file-input evidence in one operation.
  # Bundled scanners can embed many independent rule examples that otherwise
  # combine into a false credential sweep.
  near_bytes: 512
  all:
  - id: micro-behaviors/fs/path/credential/collection::developer-credential-path-reference
  - id: micro-behaviors/fs/read/file/target::credential-path-near-file-input
  needs: 3
  any:
  - id: micro-behaviors/fs/path/credential/registry::package-manager-or-netrc-config-path
  - id: micro-behaviors/fs/path/vcs::source-control-config-or-token-path-reference
  - id: micro-behaviors/fs/path/credential/collection::login-auth-or-history-file-reference
  - id: micro-behaviors/os/clipboard/read::clipboard-read-command
  # Defensive code quotes the same paths it refuses or detects: a test tree, a
  # vendored detector pattern pack, or a path validator's blocked-name arrays.
  unless:
  - id: metadata/package/testing/harness/unit::go-test-source-file
  - id: metadata/path/directory::test-directory-component
  - id: objectives/credential-access/files/absence::rootfs-forbidden-path-check
  - id: metadata/file/catalog/pattern-rules::js-detection-pattern-pack
  - id: micro-behaviors/os/security/policy::js-path-validator-blocklist-context
  downgrade:
    scope: archive
    any:
    - id: well-known/tool/detection/opencode-v2-security::package-name
- id: python-developer-credential-hex-encode
  desc: Python reads developer credentials and encodes them to hexadecimal
  crit: hostile
  conf: 0.98
  attack: T1552.001,T1027
  mbc: E1552,C0026
  for:
  - python
  near_bytes: 4096
  all:
  - id: micro-behaviors/data/encode/hex::python-bytes-hex-call
  any:
  - id: python-netrc-file-read
  - id: python-gh-host-file-read
  - id: python-git-credentials-file-read
  - id: micro-behaviors/fs/read/file/target::credential-path-near-file-input
  unless:
  - id: metadata/path/directory::test-directory-component
# Reading a credential file near Base64 encoding also occurs in normal
# HTTP Basic Auth clients. Proximity proves neither obfuscation nor export.
- id: python-developer-credential-base64-encode
  desc: Credential-file read near Base64 encoding
  crit: notable
  conf: 0.98
  mbc: E1552,C0026
  for:
  - python
  near_bytes: 4096
  all:
  - id: micro-behaviors/data/encode/base64/primitive::base64-encoding
  - id: micro-behaviors/fs/read/file/target::credential-path-near-file-input
  any:
  - id: python-netrc-file-read
  - id: python-gh-host-file-read
  - id: python-git-credentials-file-read
  - id: micro-behaviors/fs/path/credential/registry::npm-pypi-credential-file-reference
  - id: micro-behaviors/fs/path/credential/registry::package-manager-or-netrc-config-path
  unless:
  - id: metadata/path/directory::test-directory-component
  - id: micro-behaviors/fs/path/credential/private-key::ssh-private-key
# Credential-file reads and hex encoding also occur in diagnostic tools.
# Proximity alone establishes neither encoded credential flow nor obfuscation.
- id: c-developer-credential-hex-encode
  desc: Credential-file read near manual hex encoding
  crit: notable
  conf: 0.98
  mbc: E1552,C0026
  for:
  - c
  - cpp
  near_bytes: 4096
  all:
  - id: micro-behaviors/data/encode/hex::manual-lowercase-byte-hex-encoder
  - id: micro-behaviors/fs/read/file/target::credential-path-near-file-input
  unless:
  - id: metadata/path/directory::test-directory-component
- id: dotnet-developer-credential-hex-encode
  desc: Credential-file input near .NET hex encoding
  crit: notable
  conf: 0.98
  mbc: E1552,C0026
  for:
  - csharp
  near_bytes: 4096
  all:
  - id: micro-behaviors/data/encode/hex::dotnet-tohexstring-call
  - id: micro-behaviors/fs/read/file/target::credential-path-near-file-input
  unless:
  - id: metadata/path/directory::test-directory-component
