defaults:
  platforms:
  - unix
  - windows
  for:
  - source
  - scripts
  attack: T1552.001
  mbc: B0029
traits:
- id: python-gh-host-file-read
  desc: Python reads GitHub CLI hosts file
  crit: notable
  conf: 0.94
  for:
  - python
  if:
    type: text
    regex: (?i)\bopen\s*\([^(]{0,180}\.config/gh/hosts\.yml\b
- id: python-git-credentials-file-read
  desc: Python reads Git credentials file
  crit: notable
  conf: 0.94
  for:
  - python
  if:
    type: text
    regex: (?i)\bopen\s*\([^(]{0,180}\.git-credentials\b
- id: python-netrc-file-read
  desc: Python reads netrc credentials file
  crit: notable
  conf: 0.94
  for:
  - python
  if:
    type: text
    regex: (?i)\bopen\s*\([^(]{0,180}\.netrc\b
- id: maven-server-password-open
  desc: Maven settings server block with password
  crit: notable
  conf: 0.8
  if:
    type: text
    regex: <server>[\s\S]{0,200}<(id|username)>[\s\S]{0,200}<password>
- id: maven-server-password-close
  desc: Maven settings password inside server block
  crit: notable
  conf: 0.8
  if:
    type: text
    regex: <password>[\s\S]{0,200}</password>[\s\S]{0,80}</server>
composite_rules:
- id: python-source-control-file-read
  desc: Python reads source-control credential files
  crit: notable
  for:
  - python
  any:
  - id: python-gh-host-file-read
  - id: python-git-credentials-file-read
- id: python-developer-credential-file-read
  desc: Python reads developer credential files
  crit: notable
  for:
  - python
  any:
  - id: python-source-control-file-read
  - id: python-netrc-file-read
- id: npm-credential-http-marker
  desc: NPM credential path with HTTP
  crit: notable
  conf: 0.95
  for:
  - javascript
  - typescript
  any:
  - id: micro-behaviors/fs/read/file/content/configuration::node-package-credential-read-reference
  - id: micro-behaviors/fs/read/file/target::home-credential-path-near-read
  all:
  - id: objectives/exfiltration/stealer/credential::credential-file-http-flow-with-client-clues
- id: developer-credential-sweep
  desc: Sweeps developer and cloud credentials
  crit: hostile
  conf: 0.98
  near_bytes: 32768
  all:
  - id: micro-behaviors/fs/path/developer-credential::developer-credential-path-reference
  - id: micro-behaviors/fs/read/file/target::credential-path-near-file-input
  needs: 3
  any:
  - id: micro-behaviors/fs/path/config/app::package-manager-or-netrc-config-path
  - id: micro-behaviors/fs/path/vcs::source-control-config-or-token-path-reference
  - id: micro-behaviors/fs/path/credential::login-auth-or-history-file-reference
  - id: micro-behaviors/os/clipboard/read::clipboard-read-command
  unless:
  - id: metadata/package/testing/harness/unit::go-test-source-file
  downgrade:
    scope: archive
    any:
    - id: well-known/tool/detection/opencode-v2-security::package-name
- id: python-developer-credential-hex-encode
  desc: Python reads developer credentials and encodes them to hexadecimal
  crit: hostile
  conf: 0.98
  attack: T1552.001,T1027
  mbc: E1552,C0026
  for:
  - python
  near_bytes: 4096
  all:
  - id: micro-behaviors/data/encode/hex::python-bytes-hex-call
  any:
  - id: python-netrc-file-read
  - id: python-gh-host-file-read
  - id: python-git-credentials-file-read
  - id: micro-behaviors/fs/read/file/target::credential-path-near-file-input
  unless:
  - id: metadata/path/directory::test-directory-component
- id: python-developer-credential-base64-encode
  desc: Python reads developer credentials and encodes them to base64
  crit: hostile
  conf: 0.98
  attack: T1552.001,T1027
  mbc: E1552,C0026
  for:
  - python
  near_bytes: 4096
  all:
  - id: micro-behaviors/data/encode/base64/primitive::base64-encoding
  - id: micro-behaviors/fs/read/file/target::credential-path-near-file-input
  any:
  - id: python-netrc-file-read
  - id: python-gh-host-file-read
  - id: python-git-credentials-file-read
  - id: micro-behaviors/fs/path/secret-config::npm-pypi-credential-file-reference
  - id: micro-behaviors/fs/path/config/app::package-manager-or-netrc-config-path
  unless:
  - id: metadata/path/directory::test-directory-component
  - id: micro-behaviors/fs/path/private-key::ssh-private-key
- id: c-developer-credential-hex-encode
  desc: C reads developer credentials and encodes them to hexadecimal
  crit: hostile
  conf: 0.98
  attack: T1552.001,T1027
  mbc: E1552,C0026
  for:
  - c
  - cpp
  near_bytes: 4096
  all:
  - id: micro-behaviors/data/encode/hex::manual-lowercase-byte-hex-encoder
  - id: micro-behaviors/fs/read/file/target::credential-path-near-file-input
  unless:
  - id: metadata/path/directory::test-directory-component
- id: dotnet-developer-credential-hex-encode
  desc: .NET reads developer credentials and encodes them to hexadecimal
  crit: hostile
  conf: 0.98
  attack: T1552.001,T1027
  mbc: E1552,C0026
  for:
  - csharp
  near_bytes: 4096
  all:
  - id: micro-behaviors/data/encode/hex::dotnet-tohexstring-call
  - id: micro-behaviors/fs/read/file/target::credential-path-near-file-input
  unless:
  - id: metadata/path/directory::test-directory-component
