defaults:
  platforms: [unix, windows]
  for: [source, scripts]
  attack: T1552.001
  mbc: B0029

traits:
- id: gcloud-config-path-ref
  desc: References gcloud application credentials path
  crit: notable
  conf: 0.9
  if:
    type: text
    regex: '(?i)\.config[/\\]gcloud'

- id: azure-credentials-path-ref
  desc: References Azure credentials file
  crit: notable
  conf: 0.9
  if:
    type: text
    regex: '(?i)\.azure[/\\]credentials'

- id: terraform-creds-path-ref
  desc: References Terraform Cloud credentials file
  crit: notable
  conf: 0.92
  if:
    type: text
    regex: '(?i)\.terraform\.d[/\\]credentials\.tfrc\.json'

- id: python-gh-host-file-read
  desc: Python reads GitHub CLI hosts file
  crit: notable
  conf: 0.94
  for: [python]
  if:
    type: text
    regex: '(?i)\bopen\s*\([\s\S]{0,180}\.config/gh/hosts\.yml\b'

- id: python-git-credentials-file-read
  desc: Python reads Git credentials file
  crit: notable
  conf: 0.94
  for: [python]
  if:
    type: text
    regex: '(?i)\bopen\s*\([\s\S]{0,180}\.git-credentials\b'

- id: node-project-secret-file-targets
  desc: "Project credential & manifest file targets"
  crit: component
  conf: 0.9
  for: [javascript, typescript]
  if:
    type: string_literal
    regex: "^(\\.env|package\\.json|package-lock\\.json)$"
  unless:
  - id: well-known/lib/format/json-ts/
  - id: micro-behaviors/process/interpreter/vm/
  - id: metadata/library/runtime::acquire-vscode-api
  - id: well-known/tool/detection/sast::vscode-marketplace-publish-script
  - id: well-known/tool/detection/sast/
- id: source-control-token-paths
  desc: Source control credential paths
  crit: component
  conf: 0.9
  if:
    type: text
    regex: '(\.git-credentials|\.config/gh/hosts\.yml|\.gitconfig)\b'
  unless:
  - id: metadata/library/structure/
- id: login-secret-file-paths--rx-4
  desc: SSH private-key or known-hosts path literal
  crit: component
  conf: 0.9
  unless:
  - id: well-known/tool/detection/llm-scanner/
  - type: text
    regex: '(?i)(stub_secret_store|planted canary|harness only)'
  if:
    type: text
    regex: '(\.ssh/id_(rsa|dsa)([^A-Za-z0-9_.]|$)|\.ssh/known_hosts)\b'
  count_max: 1009232
- id: login-secret-file-paths--rx-5
  desc: ECDSA or Ed25519 SSH key path literal
  crit: component
  conf: 0.9
  unless:
  - id: well-known/tool/detection/llm-scanner/
  - id: well-known/app/ai/coding-agent/openclaw::openclaw-general-settings-source
  - type: text
    regex: '(?i)(stub_secret_store|planted canary|harness only)'
  if:
    type: text
    regex: '(\.ssh/id_(ecdsa|ed25519)([^A-Za-z0-9_.]|$)|\.ssh/known_hosts)\b'
  count_max: 1009233
- id: login-secret-file-paths--rx-6
  desc: Authorized-keys or shadow-file path literal
  crit: component
  conf: 0.9
  unless:
  - id: well-known/tool/detection/llm-scanner/
  - type: text
    regex: '(?i)(stub_secret_store|planted canary|harness only)'
  if:
    type: text
    regex: '(\.ssh/authorized_keys|/etc/shadow)\b'
  count_max: 1009234
- id: login-secret-file-paths--rx-7
  desc: Shell history file path literal
  crit: component
  conf: 0.9
  unless:
  - id: well-known/tool/detection/llm-scanner/
  - type: text
    regex: '(?i)(stub_secret_store|planted canary|harness only)'
  if:
    type: text
    regex: '(\.bash_history|\.zsh_history)\b'
  count_max: 1009235
- id: credential-path-table--rx-8
  desc: NPM or PyPI credential-file path literal
  crit: component
  conf: 0.9
  if:
    type: text
    regex: '(\.npmrc|\.pypirc)'
  count_max: 1009236
- id: credential-path-table--rx-9
  desc: Git credential-file path literal
  crit: component
  conf: 0.9
  if:
    type: text
    regex: '(\.git-credentials|\.config/gh/hosts\.yml)'
  count_max: 1009237
- id: credential-path-table--rx-12
  desc: Terraform or RSA/DSA SSH-key path literal
  crit: component
  conf: 0.9
  if:
    type: text
    regex: '(\.terraform\.d/credentials\.tfrc\.json|\.ssh/id_(rsa|dsa)([^A-Za-z0-9_.]|$))'
  count_max: 1009240
- id: credential-path-table--rx-13
  desc: Terraform or ECDSA/Ed25519 SSH-key path literal
  crit: component
  conf: 0.9
  if:
    type: text
    regex: '(\.terraform\.d/credentials\.tfrc\.json|\.ssh/id_(ecdsa|ed25519)([^A-Za-z0-9_.]|$))'
  count_max: 1009241
- id: credential-path-table--rx-14
  desc: /etc/shadow path literal
  crit: component
  conf: 0.9
  count_min: 5
  if:
    type: text
    regex: '(/etc/shadow)'
  count_max: 1009242
- id: clipboard-read-command
  desc: X11 clipboard read command
  crit: component
  conf: 0.84
  platforms: [linux]
  if:
    type: text
    regex: '\b(xclip|xsel)\b[^\n]{0,100}(\s-o\b|\s--out(put)?\b)'

composite_rules:
- id: developer-credential-file-source
  desc: References a developer credential file
  crit: component
  conf: 0.92
  any:
  - id: micro-behaviors/fs/path/sensitive/cloud::aws-credentials-text-reference
  - id: micro-behaviors/fs/path/sensitive/credentials::ssh-private-key
  - id: micro-behaviors/os/container/image::docker-config-json
  - id: micro-behaviors/fs/path/sensitive/credentials::kube-config
  - id: gcloud-config-path-ref
  - id: azure-credentials-path-ref
  - id: terraform-creds-path-ref
  - id: micro-behaviors/fs/path/sensitive/cloud::aws-credentials
  - id: micro-behaviors/fs/path/sensitive/credentials::package-or-netrc-credential-file
  - id: source-control-token-paths

- id: developer-credential-file-read
  desc: Reads a referenced developer credential file
  crit: notable
  conf: 0.92
  near_bytes: 2048
  all:
  - id: developer-credential-file-source
  any:
  - id: micro-behaviors/fs/file/read::file-content-read-operation
  - id: micro-behaviors/fs/file/read::shell-cat-absolute-path-read
  - id: micro-behaviors/fs/file/read::powershell-get-content-command
  - id: micro-behaviors/fs/file/open::os-open
  - id: micro-behaviors/communications/http/upload::curl-data-binary
  - id: micro-behaviors/data/archive/create/tar::tar-create

- id: python-source-control-file-read
  desc: Python reads source-control credential files
  crit: component
  for: [python]
  any:
  - id: python-gh-host-file-read
  - id: python-git-credentials-file-read

- id: npm-credential-http-marker
  desc: NPM credential path with HTTP
  crit: notable
  conf: 0.95
  for: [javascript, typescript]
  any:
      - id: objectives/supply-chain/credential-theft/registry::js-homedir-cred
      - id: objectives/supply-chain/credential-theft/registry::js-env-home-cred
  all:
      - id: objectives/supply-chain/credential-theft/registry::cred-to-http-js
  unless:
  - id: well-known/lib/cloud/aws-sdk-ruby
  - id: well-known/dual-use/transfer/alist::release-path
  - id: micro-behaviors/process/interpreter/vm/
  - id: well-known/lib/network/urllib3::urllib3-name
- id: developer-credential-sweep
  desc: Sweeps developer and cloud credentials
  crit: hostile
  conf: 0.98
  near_bytes: 32768
  all:
  - id: credential-path-table
  needs: 3
  any:
  - id: micro-behaviors/fs/path/sensitive/credentials::package-or-netrc-credential-file
  - id: source-control-token-paths
  - id: login-secret-file-paths
  - id: clipboard-read-command
  unless:
  - id: well-known/lib/ai/unsloth::unsloth-package-context
  - id: micro-behaviors/process/interpreter/vm/
  - id: metadata/package/testing/
  - id: metadata/library/sandbox-runtime/
  # Permission runtimes define protected credential paths for a deny gate;
  # the denylist is policy data, not evidence that the module sweeps files.
  - id: metadata/library/runtime::acquire-vscode-api
  - id: well-known/tool/detection/
  # js-any-bundle-output subsumes js-large-module-bundle and the minified
  # webview-bundle forms, collapsing two JS-bundle legs into one umbrella.
  - id: metadata/library/structure/
  - id: well-known/tool/development/aube::aube-lifecycle-scanner-source
  - id: well-known/app/productivity/nxplora/
- id: python-github-credential-file-harvest
  desc: Python exfiltrates GitHub credential files
  crit: hostile
  conf: 0.98
  attack: "T1552.001,T1041"
  mbc: "E1552"
  for: [python]
  near_bytes: 32768
  all:
  - id: source-control-token-paths
  - id: python-source-control-file-read
  - id: micro-behaviors/communications/http/lib/requests::requests-post
- id: login-secret-file-paths
  desc: Login secret file paths
  crit: component
  conf: 0.9
  any:
  - id: login-secret-file-paths--rx-4
  - id: login-secret-file-paths--rx-5
  - id: login-secret-file-paths--rx-6
  - id: login-secret-file-paths--rx-7
- id: credential-path-table
  desc: Credential path table in source
  crit: component
  conf: 0.9
  any:
  - id: credential-path-table--rx-8
  - id: credential-path-table--rx-9
  - id: credential-path-table--rx-12
  - id: credential-path-table--rx-13
  - id: credential-path-table--rx-14
