defaults:
  platforms: [unix, windows]
  for: [source, scripts]
  attack: T1552.001
  mbc: B0029

traits:
- id: python-gh-host-file-read
  desc: Python reads GitHub CLI hosts file
  crit: notable
  conf: 0.94
  for: [python]
  if:
    type: text
    regex: '(?i)\bopen\s*\([^(]{0,180}\.config/gh/hosts\.yml\b'

- id: python-git-credentials-file-read
  desc: Python reads Git credentials file
  crit: notable
  conf: 0.94
  for: [python]
  if:
    type: text
    regex: '(?i)\bopen\s*\([^(]{0,180}\.git-credentials\b'

# REMOVED: node-project-secret-file-targets ("Project credential & manifest
# file targets").  Its matcher was a bare string literal `.env`, `package.json`
# or `package-lock.json`.  Only `.env` is a credential file, and that literal is
# already matched -- once, canonically -- by
# micro-behaviors/fs/path/secret-config::dotenv-filename-literal.  The other two
# are the most common string literals in the entire Node ecosystem: every
# resolver, bundler, monorepo walker and install script names them, so the trait
# reported "credential file targets" (T1552.001) on ordinary project-root
# discovery such as `join(dir, 'package.json')`.  Consumers now reference the
# dotenv literal directly.
# REMOVED: ssh-private-key-path. A bare `.ssh/id_<type>` path literal is a
# sensitive-path capability that duplicated the canonical
# micro-behaviors/fs/path/private-key::ssh-private-key; consumers reference it.
- id: clipboard-read-command
  desc: X11 clipboard read command
  crit: notable
  conf: 0.84
  platforms: [linux]
  if:
    type: text
    regex: '\b(xclip|xsel)\b[^\n]{0,100}(\s-o\b|\s--out(put)?\b)'


# Maven publish credentials: a `<server>` block carrying a `<password>` is
# the settings.xml credential-store shape. Release automation writes it
# (OSSRH publishing) and stealers read it; the block identifies the store,
# not the direction.
- id: maven-server-password-open
  desc: Maven settings server block with password
  crit: notable
  conf: 0.8
  if:
    type: text
    regex: <server>[\s\S]{0,200}<password>
- id: maven-server-password-close
  desc: Maven settings password inside server block
  crit: notable
  conf: 0.8
  if:
    type: text
    regex: <password>[\s\S]{0,200}</server>

composite_rules:
- id: python-source-control-file-read
  desc: Python reads source-control credential files
  crit: component
  for: [python]
  any:
  - id: python-gh-host-file-read
  - id: python-git-credentials-file-read

- id: npm-credential-http-marker
  desc: NPM credential path with HTTP
  crit: notable
  conf: 0.95
  for: [javascript, typescript]
  any:
      - id: micro-behaviors/fs/read/file/full::node-package-credential-read-reference
      - id: micro-behaviors/fs/read/file/target::home-credential-path-near-read
  all:
      - id: objectives/exfiltration/stealer/credential::credential-file-http-flow-with-client-clues
  unless:
  - id: well-known/lib/cloud/aws-sdk-ruby
  - id: well-known/dual-use/transfer/alist::release-path
  - id: micro-behaviors/process/interpreter/vm/
  - id: metadata/import/python/urllib3
- id: developer-credential-sweep
  desc: Sweeps developer and cloud credentials
  crit: hostile
  conf: 0.98
  near_bytes: 32768
  all:
  - id: micro-behaviors/fs/path/credential::developer-credential-path-reference
  # A table of protected paths can also be a defensive denylist. Require code
  # that actually reads file contents before inferring a credential sweep.
  - id: micro-behaviors/fs/read/file/target::credential-path-near-file-input
  needs: 3
  any:
  - id: micro-behaviors/fs/path/secret-config::package-or-netrc-credential-file
  - id: micro-behaviors/fs/path/vcs::source-control-config-or-token-path-reference
  - id: micro-behaviors/fs/path/credential::login-auth-or-history-file-reference
  - id: clipboard-read-command
  unless:
  - id: well-known/lib/ai/unsloth::unsloth-package-context
  - id: micro-behaviors/process/interpreter/vm/
  - id: metadata/file/profile/test-indications/
  - id: well-known/lib/runtime/
  - id: well-known/lib/development/vscode-webview::acquire-vscode-api
  - id: well-known/tool/detection/
  - id: metadata/build/
  - id: well-known/tool/development/aube::aube-lifecycle-scanner-source
  - id: well-known/app/productivity/nxplora/
- id: python-github-credential-file-harvest
  desc: Python exfiltrates GitHub credential files
  crit: hostile
  conf: 0.98
  attack: "T1552.001,T1041"
  mbc: "E1552"
  for: [python]
  near_bytes: 32768
  all:
  - id: micro-behaviors/fs/path/vcs::source-control-config-or-token-path-reference
  - id: python-source-control-file-read
  - id: micro-behaviors/communications/http/post::requests-post
