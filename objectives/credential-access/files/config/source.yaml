defaults:
  platforms:
  - unix
  - windows
  for:
  - source
  - scripts
  attack: T1552.001
  mbc: B0029
traits:
- id: python-gh-host-file-read
  desc: Python reads GitHub CLI hosts file
  crit: notable
  conf: 0.94
  for:
  - python
  if:
    type: text
    regex: (?i)\bopen\s*\([^(]{0,180}\.config/gh/hosts\.yml\b
- id: python-git-credentials-file-read
  desc: Python reads Git credentials file
  crit: notable
  conf: 0.94
  for:
  - python
  if:
    type: text
    regex: (?i)\bopen\s*\([^(]{0,180}\.git-credentials\b
- id: python-netrc-file-read
  desc: Python reads netrc credentials file
  crit: notable
  conf: 0.94
  for:
  - python
  if:
    type: text
    regex: (?i)\bopen\s*\([^(]{0,180}\.netrc\b
- id: clipboard-read-command
  desc: X11 clipboard read command
  crit: notable
  conf: 0.84
  platforms:
  - linux
  if:
    type: text
    regex: \b(xclip|xsel)\b[^\n]{0,100}(\s-o\b|\s--out(put)?\b)
- id: maven-server-password-open
  desc: Maven settings server block with password
  crit: notable
  conf: 0.8
  if:
    type: text
    regex: <server>[\s\S]{0,200}<(id|username)>[\s\S]{0,200}<password>
- id: maven-server-password-close
  desc: Maven settings password inside server block
  crit: notable
  conf: 0.8
  if:
    type: text
    regex: <password>[\s\S]{0,200}</password>[\s\S]{0,80}</server>
composite_rules:
- id: python-source-control-file-read
  desc: Python reads source-control credential files
  crit: notable
  for:
  - python
  any:
  - id: python-gh-host-file-read
  - id: python-git-credentials-file-read
- id: python-developer-credential-file-read
  desc: Python reads developer credential files
  crit: notable
  for:
  - python
  any:
  - id: python-source-control-file-read
  - id: python-netrc-file-read
- id: npm-credential-http-marker
  desc: NPM credential path with HTTP
  crit: notable
  conf: 0.95
  for:
  - javascript
  - typescript
  any:
  - id: micro-behaviors/fs/read/file/full::node-package-credential-read-reference
  - id: micro-behaviors/fs/read/file/target::home-credential-path-near-read
  all:
  - id: objectives/exfiltration/stealer/credential::credential-file-http-flow-with-client-clues
  unless:
  - id: well-known/lib/cloud/aws-sdk-ruby
  - id: well-known/dual-use/transfer/alist::release-path
  - id: micro-behaviors/process/interpreter/vm/
- id: developer-credential-sweep
  desc: Sweeps developer and cloud credentials
  crit: hostile
  conf: 0.98
  near_bytes: 32768
  all:
  - id: micro-behaviors/fs/path/credential::developer-credential-path-reference
  - id: micro-behaviors/fs/read/file/target::credential-path-near-file-input
  needs: 3
  any:
  - id: micro-behaviors/fs/path/config/app::package-manager-or-netrc-config-path
  - id: micro-behaviors/fs/path/vcs::source-control-config-or-token-path-reference
  - id: micro-behaviors/fs/path/credential::login-auth-or-history-file-reference
  - id: clipboard-read-command
  unless:
  - id: vendored-product-source-contexts
  - id: micro-behaviors/process/interpreter/vm/
  - id: metadata/file/profile/test-indications/
  - id: well-known/lib/runtime
  - id: well-known/lib/development/vscode-webview::acquire-vscode-api
  - id: well-known/tool/detection/
  - id: metadata/build
  - id: well-known/app/productivity/nxplora/
  downgrade:
    scope: archive
    any:
    - id: well-known/tool/detection/opencode-v2-security::package-name
- id: python-developer-credential-hex-encode
  desc: Python reads developer credentials and encodes them to hexadecimal
  crit: hostile
  conf: 0.98
  attack: T1552.001,T1027
  mbc: E1552,C0026
  for:
  - python
  near_bytes: 4096
  all:
  - id: micro-behaviors/data/encode/hex::python-bytes-hex-call
  any:
  - id: python-netrc-file-read
  - id: python-gh-host-file-read
  - id: python-git-credentials-file-read
  - id: micro-behaviors/fs/read/file/target::credential-path-near-file-input
  unless:
  - id: well-known/tool/detection/
  - id: metadata/package/testing/
  - id: metadata/path::test-directory-component
- id: vendored-product-source-contexts
  desc: Vendored product source recognised as benign
  crit: exception
  conf: 0.95
  any:
  - id: well-known/lib/ai/unsloth::unsloth-package-context
  - id: well-known/tool/development/aube::aube-lifecycle-scanner-source
