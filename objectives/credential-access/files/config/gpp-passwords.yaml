defaults:
  for:
  - powershell
  platforms:
  - windows
  crit: notable
  conf: 0.98
traits:
- id: gpp-cpassword-xml-selector
  desc: Selects GPP password ciphertext in XML
  if:
    type: literal
    substr: /Groups/User/Properties/@cpassword
- id: gpp-password-decrypt-call
  desc: Decrypts a selected GPP password
  if:
    type: text
    regex: \$DecryptedPassword = Get-DecryptedCpassword \$Pass\b
composite_rules:
- id: powershell-gpp-password-recovery
  desc: Decrypts exposed GPP passwords
  crit: hostile
  all:
  - id: gpp-cpassword-xml-selector
  - id: gpp-password-decrypt-call
  - id: micro-behaviors/crypto/decrypt::powershell-base64-decryption-cooccurrence
- id: powershell-sysvol-gpp-sweep
  desc: SYSVOL preference sweep recovers GPP passwords
  crit: hostile
  all:
  - id: micro-behaviors/os/security/policy::sysvol-policies-share-path
  - id: micro-behaviors/os/security/gpo::sysvol-scheduledtasks-path
  - id: micro-behaviors/fs/directory/traverse::powershell-recursive-child-item
  - id: powershell-gpp-password-recovery
