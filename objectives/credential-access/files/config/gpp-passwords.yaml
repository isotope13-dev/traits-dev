defaults:
  for:
  - powershell
  - html
  platforms:
  - windows
  crit: notable
  conf: 0.98
traits:
- id: gpp-cpassword-xml-selector
  desc: Selects GPP password ciphertext in XML
  if:
    type: text
    regex: /Groups/User/Properties/@cpassword|\.cpassword\b|@cpassword\b
- id: gpp-password-decrypt-call
  desc: Decrypts a selected GPP password
  if:
    type: text
    regex: \$\w{1,32} = Get-DecryptedCpassword \$\w{1,32}\b
- id: gpp-aes-key-constant
  desc: Published GPP AES key bytes
  if:
    type: text
    regex: 0x4e,0x99,0x06,0xe8|4e9906e8fcb66cc9faf49310620ffee8
composite_rules:
- id: gpp-password-decryption
  desc: Decrypts GPP cpassword with helper or key
  crit: component
  any:
  - id: gpp-password-decrypt-call
  - id: gpp-aes-key-constant
- id: powershell-gpp-password-recovery
  desc: Decrypts exposed GPP passwords
  crit: hostile
  all:
  - id: gpp-cpassword-xml-selector
  - id: gpp-password-decryption
- id: powershell-sysvol-gpp-sweep
  desc: SYSVOL preference sweep recovers GPP passwords
  crit: hostile
  for:
  - powershell
  all:
  - id: micro-behaviors/os/security/gpo::sysvol-policies-share-path
  - id: micro-behaviors/os/security/gpo::sysvol-scheduledtasks-path
  - id: micro-behaviors/fs/directory/traverse::powershell-recursive-child-item
  - id: powershell-gpp-password-recovery
