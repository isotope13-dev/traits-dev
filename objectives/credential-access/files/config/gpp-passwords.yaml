defaults:
  for:
  - powershell
  platforms:
  - windows
  crit: notable
  conf: 0.98
traits:
- id: gpp-cpassword-xml-selector
  desc: Selects GPP password ciphertext in XML
  if:
    type: literal
    substr: /Groups/User/Properties/@cpassword
- id: gpp-password-decrypt-call
  desc: Decrypts a selected GPP password
  if:
    type: text
    regex: \$DecryptedPassword = Get-DecryptedCpassword \$Pass\b
composite_rules:
- id: powershell-gpp-password-recovery
  desc: Decrypts exposed GPP passwords
  crit: hostile
  all:
  - id: gpp-cpassword-xml-selector
  - id: gpp-password-decrypt-call
  - id: micro-behaviors/data/decode/base64::powershell-base64-symmetric-decrypt
