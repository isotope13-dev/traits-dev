defaults:
  platforms:
  - unix
  - windows
  for:
  - shell
  attack: T1552.001
  mbc: B0029

traits:
- id: rootfs-forbidden-path-report
  desc: Verifier reports a forbidden rootfs path present
  crit: notable
  conf: 0.9
  if:
    type: text
    substr: 'forbidden enclave rootfs path present for'
- id: rootfs-forbidden-path-stat
  desc: Verifier stats each forbidden path via debugfs
  crit: notable
  conf: 0.9
  if:
    type: text
    substr: 'debugfs -R "stat $forbidden"'
composite_rules:
- id: rootfs-forbidden-path-check
  desc: Image verifier asserts credential files are absent from a rootfs
  crit: exception
  conf: 0.9
  all:
  - id: rootfs-forbidden-path-report
  - id: rootfs-forbidden-path-stat
