# Android credential and account-endpoint co-occurrence; no write is established.
defaults:
  platforms: [android]
  for: [java, kotlin]

composite_rules:
  - id: android-token-user-info-clues
    desc: Android token header and user-info endpoint clues
    crit: suspicious
    conf: 0.98
    all:
      - id: objectives/credential-access/memory::android-content-provider-credential-read
      - id: micro-behaviors/communications/http/token-auth::android-custom-token-header-source
      - id: micro-behaviors/communications/url/resource-path/identity::user-info-endpoint
      - id: micro-behaviors/communications/http/client/library::android-okhttp-client-reference
