# CVE-2026-123890: vmdir's SRP session-key getter answers before any password
# proof, and the RPC runtime resolves a context handle without checking
# ownership. An attacker who brackets a pending login with two reference
# verifiers can narrow its UUIDv1 handle and read its key unauthenticated.
defaults:
  platforms: [unix, windows]
  for: [python, go]
  crit: hostile
  conf: 0.97
  attack: T1212

composite_rules:
  - id: vmdir-srp-session-key-disclosure-bypass
    desc: Discloses a pending vmdir SRP session key via handle guessing
    all:
      - id: micro-behaviors/communications/rpc::vmdir-srp-verifier-interface-uuid
      - id: micro-behaviors/communications/rpc::vmdir-srp-session-key-getter-call
      - id: micro-behaviors/communications/rpc::vmdir-srp-handle-window-brute-force
    near_bytes: 4000
