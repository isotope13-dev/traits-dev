# Prefix-searching DOM private keys distinguishes external introspection from
# React's own creation of those keys. Require the trading interface and the
# separate credential-store read; ordinary React applications are insufficient.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]

composite_rules:
  - id: react-trading-session-scavenging
    desc: React client introspection with stored trading credentials
    crit: suspicious
    conf: 0.97
    near_bytes: 4096
    all:
      - id: micro-behaviors/ui/window/dom/access::react-fiber-key-search
      - id: micro-behaviors/data/db/read/key-value::browser-storage-api-key-read
      - id: micro-behaviors/data/transaction/submit::trading-post-order-method-test
      - id: micro-behaviors/data/transaction/construct::trading-order-constructor-reference
    any:
      - id: micro-behaviors/ui/window/dom/access::hook-state-member
      - id: micro-behaviors/ui/window/dom/access::memoized-props-member
