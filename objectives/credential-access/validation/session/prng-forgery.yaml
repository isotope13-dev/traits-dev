# Detect the published building blocks without claiming startup-key
# reconstruction or remote execution from isolated API names.
defaults:
  platforms: [linux, macos, windows]
  for: [scripts, source]
  crit: suspicious
  conf: 0.98
  attack: T1550.004
composite_rules:
  - id: cookie-prng-state-recovery
    desc: PRNG solving with decoded signed cookies
    all:
      - id: micro-behaviors/os/random/prng/custom::symbolic-xorshift128-state-solving
      - id: micro-behaviors/communications/http/cookies::signature-cookie-assignment
      - id: micro-behaviors/crypto/hash/hmac::hmac-new
    any:
      - id: micro-behaviors/data/decode/base64::b64decode-call
      - id: micro-behaviors/data/decode/base64::python-urlsafe-base64-decode
    near_bytes: 2048
  - id: signed-admin-session-ip-bypass
    desc: Signs HFS admin cookie disabling IP binding
    all:
      - id: micro-behaviors/os/security/auth/session::session-ip-change-enabled
      - id: micro-behaviors/os/security/auth/session::administrator-session-username
      - id: micro-behaviors/communications/http/cookies::signature-cookie-assignment
    any:
      - id: micro-behaviors/crypto/hash/hmac::hmac-new
      - id: micro-behaviors/crypto/hash/hmac::node-createhmac
      - id: micro-behaviors/crypto/hash/hmac::node-createhmac-text-call
    near_bytes: 2048
