# HMAC canonicalization-confusion clients obtain a signature over one logical
# field layout, then submit the same bytes under a different layout accepted by
# a verifier.  The generic rules match response-derived data flow and protocol
# field structure, independent of language, product, endpoint, or CVE.  The
# WPMU DEV rules specialize that technique with the published AJAX actions.
defaults:
  platforms: [unix, windows]
  for: [scripts, source]
  attack: T1190,T1078
  mbc: E1190

composite_rules:
  - id: signed-authentication-field-reinterpretation
    desc: Reinterprets signed authentication fields across requests
    crit: suspicious
    conf: 0.99
    all:
      - id: micro-behaviors/communications/http/auth::signature-field-to-field-assignment
      - id: micro-behaviors/communications/http/auth::token-field-to-field-assignment
      - id: micro-behaviors/communications/http/auth::state-field-to-field-assignment
      - id: micro-behaviors/communications/http/auth::origin-to-redirect-field-assignment
    near_bytes: 1200

  - id: empty-redirect-signing-oracle-replay
    desc: Replays signed authentication fields from empty redirect oracle
    crit: hostile
    conf: 0.995
    all:
      - id: signed-authentication-field-reinterpretation
      - id: micro-behaviors/communications/http/auth::empty-redirect-field-assignment
    any:
      - id: micro-behaviors/communications/http/post::session-post
      - id: micro-behaviors/communications/http/lib/requests::requests-post
      - id: micro-behaviors/communications/http/post::axios-post-source
      - id: micro-behaviors/communications/http/post::fetch-post-call
    near_bytes: 2400

  - id: wpmudev-sso-hmac-confusion-payload
    desc: WPMU DEV SSO HMAC field-confusion payload
    crit: hostile
    conf: 0.999
    all:
      - id: micro-behaviors/communications/http/request/wordpress::admin-ajax-endpoint
      - id: micro-behaviors/communications/http/request/wordpress::wpmudev-sso-step2-action
      - id: micro-behaviors/communications/http/auth::empty-redirect-field-assignment
      - id: signed-authentication-field-reinterpretation
    near_bytes: 2400

  - id: wpmudev-two-step-signing-oracle-chain
    desc: WPMU DEV two-step SSO signing-oracle replay
    crit: hostile
    conf: 0.999
    all:
      - id: micro-behaviors/communications/http/request/wordpress::wpmudev-sso-step1-action
      - id: micro-behaviors/communications/http/request/wordpress::wpmudev-sso-step2-action
      - id: micro-behaviors/communications/http/auth::empty-redirect-field-assignment
      - id: signed-authentication-field-reinterpretation
    near_bytes: 3000
