# CVE-2026-0257 GlobalProtect authentication-override cookie forgery: encrypts
# the `<user>;;<os>;;<timestamp>;0.0.0.0` session plaintext with the target's
# X.509 public key, Base64-encodes it, and submits it as portal-userauthcookie
# to /ssl-vpn/login.esp.
defaults:
  platforms: [panos, unix, windows]
  for: [scripts, binaries]
  attack: T1550.004,T1190
  mbc: E1190

composite_rules:
  - id: globalprotect-auth-override-cookie-forgery
    desc: Forges GlobalProtect auth-override cookie
    crit: hostile
    conf: 0.99
    near_bytes: 1024
    needs: 2
    all:
      - id: micro-behaviors/communications/http/url/api-path::globalprotect-sslvpn-login-esp
      - id: micro-behaviors/os/security/auth/session::globalprotect-portal-userauthcookie-field
      - id: micro-behaviors/os/security/auth/session::globalprotect-auth-override-cookie-cleartext
      - id: micro-behaviors/data/encode/base64::base64-encoding
    any:
      - id: micro-behaviors/crypto/certificate/usage::x509-string
      - id: micro-behaviors/communications/http/post::http-post-client-call
      - id: micro-behaviors/data/serialize/schema-credential::pwd-passwd-field-key
