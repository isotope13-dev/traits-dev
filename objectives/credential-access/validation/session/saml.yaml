# Forged SAML assertions used to obtain authenticated sessions.  The rules are
# based on protocol and cryptographic structure rather than a CVE, vendor,
# endpoint, implementation language, or targeted application.
defaults:
  platforms: [unix, windows]
  for: [scripts, source]
  attack: T1190,T1078

composite_rules:
  - id: saml-hmac-public-key-signature-forgery
    desc: Forges a SAML HMAC signature with public-key material
    crit: hostile
    conf: 0.995
    all:
      - id: micro-behaviors/communications/http/saml::saml-hmac-sha1-signature-method
      - id: micro-behaviors/communications/http/saml::saml-signature-value-element
      - id: micro-behaviors/communications/http/saml::saml-nameid-element
    any:
      - id: micro-behaviors/crypto/hash/hmac::php-hmac-public-material
      - id: micro-behaviors/crypto/hash/hmac::javascript-hmac-public-material
      - id: micro-behaviors/crypto/hash/hmac::python-hmac-public-material
    near_bytes: 4096

  - id: saml-malformed-signature-authentication-bypass
    desc: Builds a malformed SAML signature for authentication bypass
    crit: hostile
    conf: 0.995
    all:
      - id: micro-behaviors/communications/http/saml::saml-signature-value-element
      - id: micro-behaviors/communications/http/saml::saml-nameid-element
    any:
      - id: micro-behaviors/data/buffer::repeated-ff-signature-buffer
      - id: micro-behaviors/data/buffer::repeated-ff-byte-buffer
    near_bytes: 32768

  - id: forged-saml-assertion-delivery
    desc: Delivers a forged SAML assertion to an authentication endpoint
    crit: hostile
    conf: 0.995
    all:
      - id: micro-behaviors/communications/http/saml::saml-response-form-field
      - id: micro-behaviors/communications/http/saml::saml-nameid-element
    any:
      - id: saml-hmac-public-key-signature-forgery
      - id: saml-malformed-signature-authentication-bypass
    near_bytes: 32768
