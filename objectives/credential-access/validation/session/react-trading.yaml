# Probing private framework state for a live trading client crosses the
# application's authority boundary. Ordinary storage reads and order APIs do
# not establish this behavior.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  crit: suspicious
  conf: 0.96

composite_rules:
  - id: react-hook-trading-authority-discovery
    desc: Probes React hook state for trading authority
    all:
      - id: micro-behaviors/ui/window/dom/access::fiber-key-prefix-test
      - id: micro-behaviors/ui/window/dom/access::hook-state-member
      - id: micro-behaviors/data/transaction/submit::trading-post-order-type-test
    near_bytes: 4096
