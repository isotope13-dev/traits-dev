defaults:
  platforms: [linux, macos, windows]
  for: [python, javascript, typescript, ruby, java, csharp, go]
  crit: suspicious
  conf: 0.95

composite_rules:
  - id: source-token-privileged-session-bypass
    desc: Hardcoded token grants a privileged web session
    crit: hostile
    conf: 0.98
    attack: T1078
    all:
      - id: micro-behaviors/communications/http/request/params::source-authentication-token-parameter
      - id: micro-behaviors/crypto/hash/digest::source-fixed-sha256-comparison
      - id: micro-behaviors/os/security/auth/session::source-privileged-session-setup
    near_bytes: 4096

  - id: source-early-token-session-bypass
    desc: Early request hook grants privileged web session by token
    crit: hostile
    conf: 0.98
    attack: T1505.003
    all:
      - id: source-token-privileged-session-bypass
      - id: micro-behaviors/process/hook/event::source-web-request-hook
    near_bytes: 4096

  - id: source-token-admin-redirect
    desc: Token session backdoor redirects to admin area
    crit: hostile
    conf: 0.98
    attack: T1505.003
    all:
      - id: source-token-privileged-session-bypass
      - id: micro-behaviors/communications/http/response::source-admin-redirect
    near_bytes: 4096
