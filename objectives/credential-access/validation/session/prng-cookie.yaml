# Predictable-random signing-key attacks combine generator reconstruction,
# signed privileged-cookie construction, and an unauthenticated login oracle.
defaults:
  platforms: [unix, windows]
  for: [python, javascript, typescript]
  attack: T1190,T1078
composite_rules:
  - id: prng-signed-admin-cookie-forgery
    desc: PRNG recovery with signed admin cookie
    crit: hostile
    conf: 0.99
    all:
      - id: micro-behaviors/os/random/prng/custom::symbolic-xorshift128-state-solving
      - id: micro-behaviors/os/security/auth/session::admin-session-username
      - id: micro-behaviors/os/security/auth/session::koa-cookie-signature-pair
      - id: micro-behaviors/os/security/auth/session::srp-login-first-stage
    any:
      - id: micro-behaviors/crypto/hash/hmac::hmac-new
      - id: micro-behaviors/crypto/hash/hmac::node-createhmac-text-call
    near_bytes: 8500
  - id: forged-cookie-server-config-shell-execution
    desc: Forged cookie with server-code shell payload
    crit: hostile
    conf: 0.99
    all:
      - id: prng-signed-admin-cookie-forgery
      - id: micro-behaviors/data/config/write::hfs-server-code-config-write
      - id: micro-behaviors/process/create/shell/command-string::embedded-node-shell-exec
    near_bytes: 11000
