# Replay of a captured signed request envelope after mutating unsigned params
# while preserving the original signature field across outbound HTTP POSTs.
defaults:
  platforms: [unix, windows]
  for: [scripts, source]
  attack: T1550.004
  mbc: E1190

composite_rules:
  - id: unsigned-parameter-signature-replay
    desc: Mutates unsigned params and replays signature
    crit: hostile
    conf: 0.98
    # The legs are generic and only meaningful together in a focused replay
    # script; multi-megabyte webview bundles carry each one independently.
    size_max: 262144
    all:
      - id: micro-behaviors/data/decode/base64
      - id: micro-behaviors/data/parse/json
      - id: micro-behaviors/data/property/write::mutated-params-map-write
      - id: micro-behaviors/communications/http/request/encoded::json-base64-envelope-post
    any:
      - id: micro-behaviors/data/property/write::preserved-signature-field-copy
      - id: micro-behaviors/data/property/write::unquoted-signature-field-copy
      - id: micro-behaviors/data/property/assign::signature-field-to-field-assignment
    unless:
      - id: well-known/app/publishing/wordpress-plugins/site-admin::iwp-client-server-class
      - id: well-known/lib/ai/coding-assistant::bundled-copilot-lsp-path
