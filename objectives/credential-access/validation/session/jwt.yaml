# Forged nested JWTs used to reach a protected web session.  The atoms remain
# protocol observations in micro-behaviors; these composites require the
# unsecured token and actor-token/key-identifier structure before inferring
# authentication-bypass intent.
defaults:
  platforms: [windows, unix]
  for: [scripts, source]
  attack: T1190,T1078
  mbc: E1190

composite_rules:
  - id: nested-jwt-authentication-bypass
    desc: Nested unsecured JWT used to bypass web authentication
    crit: hostile
    conf: 0.99
    all:
      - id: micro-behaviors/communications/http/token-auth::jwt-unsecured-algorithm
      - id: micro-behaviors/communications/http/token-auth::jwt-actor-token-claim
      - id: micro-behaviors/communications/http/token-auth::jwt-rsa-algorithm-field
      - id: micro-behaviors/communications/http/token-auth::jwt-x5t-key-identifier-field
      - id: micro-behaviors/communications/http/token-auth::bearer-header-from-variable
    near_bytes: 2048

  - id: jwt-authentication-bypass-structure
    desc: Constructs unsecured JWT for Bearer authentication
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/communications/http/token-auth::jwt-unsecured-algorithm
      - id: micro-behaviors/communications/http/token-auth::bearer-header-from-variable
    any:
      - id: micro-behaviors/communications/http/token-auth::jwt-array-segment-join
      - id: micro-behaviors/communications/http/token-auth::jwt-python-segment-join
      - id: micro-behaviors/data/encode/jwt::jwt-empty-signature-construction
    near_bytes: 2048

  - id: unsigned-jwt-subject-impersonation
    desc: Uses an unsigned JWT to impersonate an asserted subject
    crit: hostile
    conf: 0.99
    all:
      - id: micro-behaviors/communications/http/token-auth::jwt-unsecured-algorithm
      - id: micro-behaviors/data/serialize/json::quoted-sub-field
      - id: micro-behaviors/data/encode/jwt::jwt-empty-signature-construction
      - id: micro-behaviors/communications/http/token-auth::bearer-header-from-variable
    near_bytes: 2048

  # SharePoint actor-token forgery (CVE-2026-55040 class): an unsigned outer
  # token wrapping a nested actor token whose RS256/x5t inner header points at a
  # signing key the vulnerable handler resolves but never verifies.  Anchored on
  # the SharePoint STS metadata endpoint or the service-principal GUID rather
  # than the outbound Bearer use, so it fires on Python, PowerShell, Go and
  # other rewrites regardless of how the HTTP request is assembled.
  - id: sharepoint-nested-jwt-authentication-bypass
    desc: SharePoint nested unsigned actor-token forgery
    crit: hostile
    conf: 0.99
    all:
      - id: micro-behaviors/communications/http/token-auth::jwt-unsecured-algorithm
      - id: micro-behaviors/communications/http/token-auth::jwt-actor-token-claim
      - id: micro-behaviors/communications/http/token-auth::jwt-rsa-algorithm-field
      - id: micro-behaviors/communications/http/token-auth::jwt-x5t-key-identifier-field
    any:
      - id: micro-behaviors/communications/http/auth::sharepoint-sts-metadata-endpoint
      - id: micro-behaviors/communications/http/auth::sharepoint-principal-app-id
    near_bytes: 4096

  - id: sharepoint-jwt-user-impersonation
    desc: SharePoint forged JWT user impersonation
    crit: hostile
    conf: 0.99
    all:
      - id: sharepoint-nested-jwt-authentication-bypass
      - id: micro-behaviors/communications/http/sharepoint::sharepoint-active-directory-identity-provider
    any:
      - id: micro-behaviors/communications/http/jwt::jwt-windows-sid-identity-claim
      - id: micro-behaviors/communications/http/jwt::jwt-user-principal-name-claim
    near_bytes: 4096

  - id: sharepoint-nested-jwt-api-access
    desc: Forged SharePoint JWT used on API
    crit: hostile
    conf: 0.99
    all:
      - id: sharepoint-nested-jwt-authentication-bypass
    any:
      - id: micro-behaviors/communications/http/sharepoint::sharepoint-current-user-api-endpoint
      - id: micro-behaviors/communications/http/sharepoint::sharepoint-context-info-api-endpoint
    near_bytes: 4096
