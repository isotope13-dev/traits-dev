# A length-selected nFactor failure on a Gateway enters post-login processing.
# The returned NSC_AAAC cookie and clientless-mode transition distinguish the
# usable anonymous-session bypass from probes that stop at the SAML response.
defaults:
  platforms: [unix, windows, appliance]
  for: [scripts, source, text, data]
  attack: T1190,T1078
  mbc: E1190

composite_rules:
  - id: netscaler-nfactor-anonymous-session-bypass
    desc: Crafted nFactor context enters NetScaler clientless session
    crit: hostile
    conf: 0.999
    all:
      - id: objectives/execution/exploit/deserialization::netscaler-nfactor-relaystate-branch-exploit
      - id: objectives/execution/exploit/deserialization::netscaler-nfactor-session-branch-payload
      - id: micro-behaviors/communications/http/services/netscaler::netscaler-clientless-mode-endpoint
      - id: micro-behaviors/communications/http/services/netscaler::netscaler-aaac-session-cookie
    near_bytes: 4096
