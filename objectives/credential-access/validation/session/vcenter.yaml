defaults:
  platforms: [unix, windows]
  for: [python]
  crit: hostile
  conf: 0.99
  attack: T1606.002

composite_rules:
  - id: vcenter-golden-saml-login
    desc: Signs administrator SAML assertions alongside vmdir key recovery and login
    all:
      - id: objectives/credential-access/credential-manager/system::vmdir-idp-private-key-extraction
      - id: micro-behaviors/communications/http/saml::saml-administrator-nameid
      - id: micro-behaviors/communications/http/saml::vcenter-saml-consumer-path
      - id: micro-behaviors/communications/http/saml::saml-response-field
      - id: micro-behaviors/crypto/sign::python-signxml-sign-call
      - id: micro-behaviors/communications/http/post
