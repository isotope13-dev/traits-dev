defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]

composite_rules:
  # These fields and routes can indicate reset abuse but do not bind a request.
  - id: browser-wordpress-account-reset-clues
    desc: WordPress account reset and out-of-band endpoint clues
    crit: suspicious
    conf: 0.99
    near_bytes: 16000
    all:
      - id: metadata/lang/source/naming/account::wordpress-account-email-field-any
      - id: metadata/lang/source/naming/account::wordpress-account-details-nonce-field-any
      - id: well-known/app/publishing/wordpress::wordpress-lost-password-route-any
      - id: micro-behaviors/communications/http/request/credentials/literal::fetch-credentials-include-any
      - id: micro-behaviors/communications/url/host/oob/endpoint::oob-endpoint-any
    unless:
      - id: micro-behaviors/os/security/scan/documentation/
