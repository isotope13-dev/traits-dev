# CVE-2026-123710: ordinary registry tokens were accepted for key rotation.
# These are suspicious client combinations, not proof of token provenance or
# a successful takeover. Normal dedicated key-rotation JWTs have no access claim.
defaults:
  for: [python]
  platforms: [unix, windows]
  crit: suspicious

composite_rules:
  - id: registry-auth-key-upload
    desc: Registry token request beside Quay signing-key upload
    conf: 0.98
    all:
      - id: micro-behaviors/communications/http/services/quay::registry-auth-request
      - id: micro-behaviors/communications/http/services/quay::service-key-upload
      - id: micro-behaviors/communications/http/authorization-header::authorization-header-map-entry
    near_lines: 12

  - id: registry-grant-signing-key-upload
    desc: Signs registry access grants beside Quay signing-key upload
    conf: 0.98
    all:
      - id: micro-behaviors/communications/http/services/quay::service-key-upload
      - id: micro-behaviors/data/encode/jwt::jwt-library-signing-call
      - id: micro-behaviors/communications/http/jwt::registry-repository-grant
      - id: micro-behaviors/communications/http/jwt::registry-access-claim
      - id: micro-behaviors/communications/http/jwt::registry-action-grants
    near_lines: 24
