defaults:
  platforms: [unix, windows]
  for: [php]
  crit: suspicious
  conf: 0.95
traits:
  - id: wp-session-tokens-admin-marker
    desc: WordPress admin session tokens marker
    crit: baseline
    conf: 0.8
    if:
      type: text
      regex: 'session_tokens.{0,240}administrator'
  - id: wp-get-users-session-tokens-marker
    desc: WordPress get_users session tokens marker
    crit: baseline
    conf: 0.8
    if:
      type: text
      substr: session_tokens
composite_rules:
  - id: wp-token-authentication-bypass
    desc: WordPress admin authentication bypass via hardcoded token
    crit: hostile
    conf: 0.99
    attack: T1078
    all:
      - id: micro-behaviors/crypto/hash/digest::php-hardcoded-sha256-comparison
      - id: micro-behaviors/os/user/lookup::wordpress-list-administrators
      - id: micro-behaviors/os/security/auth/session::wordpress-auth-cookie
      - id: micro-behaviors/os/security/auth/session::wordpress-current-user
    any:
      - id: micro-behaviors/communications/http/request/params::wordpress-auth-token-parameter
      - id: micro-behaviors/communications/http/request/params::php-authentication-token-parameter
    near_bytes: 2048

  - id: wp-early-token-authentication-bypass
    desc: WordPress token authentication bypass on earliest init hook
    crit: hostile
    conf: 0.99
    attack: T1505.003
    all:
      - id: wp-token-authentication-bypass
      - id: micro-behaviors/process/hook/event::wordpress-early-init-hook
    near_bytes: 4096

  - id: wp-token-auth-admin-redirect
    desc: WordPress token backdoor redirects into the admin dashboard
    crit: hostile
    conf: 0.99
    attack: T1505.003
    all:
      - id: wp-token-authentication-bypass
      - id: micro-behaviors/communications/http/response::wordpress-admin-redirect
    near_bytes: 2048

  # The administrator-lookup leg is the canonical neutral atom in
  # micro-behaviors/os/user/lookup; the session-token markers that used to
  # suppress it live here instead, so they gate the backdoor verdict rather
  # than the observation.
  - id: wp-auto-login-backdoor
    desc: WordPress auto-login backdoor
    crit: hostile
    attack: T1505.003
    all:
      - id: micro-behaviors/os/security/auth/session::wordpress-auth-session-setup
      - id: micro-behaviors/os/user/lookup::wordpress-list-administrators
      - id: metadata/library/web-frameworks::wordpress-bootstrap-loader-reference
    unless:
      - id: metadata/library/web-frameworks::wordpress-core-package-doc
      - id: metadata/library/web-frameworks::wordpress-core-include-bootstrap
      - id: wp-session-tokens-admin-marker
      - id: wp-get-users-session-tokens-marker
