# Issabel installations before the published fix shared one HS256 signing key.
# An exploit client that combines that key with HS256 token construction and a
# Bearer header can mint its own authenticated PBX API session. The structural
# JWT and header legs keep the key literal from convicting vulnerable server
# source by itself.
defaults:
  platforms: [unix, windows]
  for: [scripts, source]
  attack: T1190,T1078
  mbc: E1190

traits:
  - id: issabel-default-jwt-signing-key
    desc: Issabel PBX default JWT signing key
    crit: notable
    conf: 0.999
    if:
      type: string_literal
      exact: da893kasdfam43k29akdkfaFFlsdfhj23rasdf

composite_rules:
  - id: issabel-default-key-jwt-forgery
    desc: Forges Issabel JWT with shared signing key
    crit: hostile
    conf: 0.999
    all:
      - id: issabel-default-jwt-signing-key
      - id: micro-behaviors/communications/http/jwt::jwt-hs256-algorithm-field
      - id: micro-behaviors/data/encode/jwt::jwt-library-signing-call
      - id: micro-behaviors/communications/http/token-auth::bearer-header-from-variable
    near_bytes: 2048
