# A bulk checker accepts candidate token lists, routes checks through proxies,
# and persists the usable results. Requiring the input, check, proxy, result,
# and output roles keeps this from matching ordinary token parsers or clients.
defaults:
  platforms: [windows, linux, macos]
  for: [binaries]
  attack: T1110.001
  mbc: E1110

traits:
  - id: go-start-candidate-check
    desc: Start candidate token checks
    crit: notable
    conf: 0.9
    if:
      type: text
      substr: StartCheck

  - id: go-proxy-count-method
    desc: Counts proxy list entries
    crit: component
    conf: 0.9
    if:
      type: text
      substr: GetProxyCount

  - id: go-proxy-bypass-method
    desc: Disables checker proxy use
    crit: component
    conf: 0.9
    if:
      type: text
      substr: SetProxyless

  - id: go-save-valid-results
    desc: Saves valid token results
    crit: notable
    conf: 0.9
    if:
      type: text
      substr: SaveValidKeys

composite_rules:
  - id: go-token-check-proxy-controls
    desc: Go checker proxy controls
    crit: component
    conf: 0.9
    all:
      - id: go-proxy-count-method
      - id: go-proxy-bypass-method

  - id: go-proxied-token-hit-checker
    desc: Proxied Go token checker saves valid results
    crit: hostile
    conf: 0.96
    all:
      - id: metadata/lang/compiler/systems::go-binary-comp
      - id: go-start-candidate-check
      - id: go-token-check-proxy-controls
      - id: go-save-valid-results
