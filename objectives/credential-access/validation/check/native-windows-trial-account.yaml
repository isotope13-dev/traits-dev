# ESET update account validation in a native Windows update relay.
# The relay retrieves candidate accounts, submits Basic authentication to an
# ESET update manifest, and has explicit success and no-valid-account paths.
defaults:
  platforms: [windows]
  for: [pe, dll]
  attack: T1110.001
  mbc: E1110

traits:
  - id: eset-account-auth-success-diagnostic
    desc: ESET account authentication success result
    crit: notable
    conf: 0.96
    if:
      type: text
      substr: 'proxy: cred ok'

  - id: eset-account-list-exhausted-diagnostic
    desc: ESET account-list exhaustion result
    crit: notable
    conf: 0.96
    if:
      type: text
      substr: 'proxy: cred: no working account in list'

composite_rules:
  - id: native-eset-trial-account-validator
    desc: Validates candidate accounts against ESET update authentication
    crit: hostile
    conf: 0.97
    all:
      - id: micro-behaviors/communications/proxy/auth::account-list-rotation-diagnostic
      - id: micro-behaviors/communications/http/basic-auth::authorization-basic-header-token
      - id: micro-behaviors/communications/http/url/api-path::eset-update-manifest-path
      - id: eset-account-auth-success-diagnostic
      - id: eset-account-list-exhausted-diagnostic
    any:
      - id: micro-behaviors/communications/proxy/auth::trial-account-identifier-prefix
