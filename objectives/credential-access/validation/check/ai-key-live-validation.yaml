# Live validation of harvested AI provider keys from shell.
#
# Checking a bearer key against a provider models endpoint is ordinary in an
# application's own health check. Pairing it with a cross-user credential
# harvest in the same script is key validation: confirming which stolen keys
# are live before exfiltration or sale.
defaults:
  platforms: [unix]
  attack: T1552.001
  crit: hostile
  conf: 0.9

composite_rules:
  - id: harvested-ai-key-live-probe
    desc: Validates harvested AI keys against provider endpoints
    all:
      - id: objectives/credential-access/files/secret-sweep::cross-user-claude-aws-history-harvest
      - id: micro-behaviors/communications/http/authorization-header::bearer-prefix
    any:
      - id: micro-behaviors/communications/http/services/openai::models-list-endpoint
      - id: micro-behaviors/communications/http/llm-proxy::llm-provider-anthropic-messages-endpoint
