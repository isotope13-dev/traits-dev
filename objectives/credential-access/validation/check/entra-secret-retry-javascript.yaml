defaults:
  platforms: [unix, windows]
  for: [javascript]
  crit: suspicious
  conf: 0.94

traits:
  - id: javascript-entra-invalid-secret-retry
    desc: Retries token requests on rejected secrets
    if:
      type: tree-sitter
      language: javascript
      query: |
        ((while_statement condition: (parenthesized_expression (true))
          body: (statement_block
            . (try_statement
              body: (statement_block
                . (lexical_declaration (variable_declarator
                  value: (await_expression (call_expression
                    function: (member_expression
                      property: (property_identifier) @token_method))))))
              handler: (catch_clause parameter: (identifier) @error
                body: (statement_block
                  . (if_statement
                    condition: (parenthesized_expression (call_expression
                      function: (member_expression
                        object: (member_expression object: (identifier) @error_use
                          property: (property_identifier) @error_field)
                        property: (property_identifier) @includes)
                      arguments: (arguments (string (string_fragment) @error_code))))
                    consequence: (statement_block
                      . (expression_statement (await_expression (call_expression)))
                      . (continue_statement) .))))))) @retry
          (#eq? @token_method "acquireTokenByClientCredential")
          (#eq? @error @error_use)
          (#eq? @error_field "errorMessage")
          (#eq? @includes "includes")
          (#match? @error_code "^AADSTS70002(15|22)$")
          (#set! cleave.ignore-comments "true"))
