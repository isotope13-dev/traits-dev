defaults:
  # Local password-validation probes are carrier-agnostic: the same
  # `dscl . -authonly` / dslocal / ShadowHashData work appears in shell one-
  # liners, AppleScript droppers, and compiled Rust/Go/Swift stealers. The
  # per-trait `for:` overrides below keep the CoreServices symbol matchers
  # native-only.
  for: [scripts, source, macho]
  attack: T1110
  platforms:
    - macos
  crit: suspicious
traits:
  - id: dslocal-db
    desc: Local user/password hash database path
    crit: suspicious
    conf: 0.7
    attack: T1003.008
    if:
      type: text
      substr: /var/db/dslocal
    unless:
      # Known tooling whose dslocal references are management, inventory or
      # documentation context, not a stealer reading the store.
      - id: objectives/credential-access/validation/check::dslocal-store-tooling-context
      - id: metadata/package/testing/
      # Permission libraries validate candidate paths; this call is a guard,
      # not a read of the local account database.
      - type: symbol
        kind: call
        exact: normalized.startsWith
        arg:
          kind: string
          exact: /var/db/dslocal/
      # A sandbox-exec profile deny rule forbids touching the store; the
      # reference exists to block access, not to perform it.
      - type: text
        regex: '\(\s*deny\s+file-(read|write)\*?\s+\(subpath\s+"/var/db/dslocal'
      # DirectoryService is the process that owns this database. Also cover
      # versioned Darling source checkout roots where it documents the path.
      - type: path
        regex: '(^|[\\/])(DirectoryService|OpenDirectory|DSTools)[\\/]'
      - type: path
        regex: 'darling-DirectoryService-[^/]+/'
      - id: "metadata/file/naming::test-directory-component"
  - id: shadow-hash-data
    desc: macOS password hash blob key
    crit: suspicious
    conf: 0.7
    attack: T1003.008
    if:
      # Match executable string literals, not a source comment saying that
      # ShadowHashData parsing is still TODO.
      type: literal
      substr: ShadowHashData
    unless:
      # A hash-format parser walks a caller-supplied plist. It does not open
      # the local directory-services store.
      - id: objectives/credential-access/validation/check::supplied-plist-from-input
      - id: well-known/app/infrastructure/puppet::puppet-source-context
      # Chef's user provider writes ShadowHashData to set account passwords;
      # it is the management action itself, not a hash dump.
      - id: well-known/app/infrastructure/chef::chef-source-context
      - id: metadata/package/testing/
      - type: path
        regex: '(^|[\\/])(DirectoryService|OpenDirectory|DSTools)[\\/]'
      - type: path
        regex: 'darling-DirectoryService-[^/]+/'
      - id: "metadata/file/naming::test-directory-component"
  - id: supplied-plist-from-input
    desc: Parses a plist from supplied input
    crit: notable
    conf: 0.9
    for: [rust]
    if:
      type: text
      regex: 'from_reader\([^\n]{0,60}input\.data'
composite_rules:
  # Recognized tooling whose dslocal references are account management
  # (Puppet, Chef), backup/inventory (Carbon Copy Cloner), privilege-
  # auditing (PEAS) or utility context (CmdChamp), not stealer reads.
  - id: dslocal-store-tooling-context
    desc: Known tooling referencing the dslocal store
    crit: exception
    conf: 0.9
    any:
      - id: well-known/tool/offensive/peas/
      - id: well-known/app/utility/cmdchamp/
      - id: well-known/app/storage/carbon-copy-cloner::official-carbon-copy-cloner-member
      - id: well-known/app/infrastructure/puppet::puppet-source-context
      - id: well-known/app/infrastructure/chef::chef-source-context

  - id: shadow-hash
    desc: Accesses shadow password hashes
    crit: suspicious
    conf: 0.85
    attack: T1003.008
    for:
      - macho
      - applescript
    any:
      - id: dslocal-db
      - id: shadow-hash-data
      - id: micro-behaviors/os/privilege/paths::etc-shadow
  - id: csidentity-password-auth
    desc: macOS CoreServices password authentication
    crit: suspicious
    conf: 0.95
    attack: T1110.001
    mbc: E1110
    for:
      - macho
    all:
      - id: micro-behaviors/os/security/auth/verify::csidentity-auth
    any:
      - id: micro-behaviors/os/security/directory-service::csidentity-query-create
      - id: micro-behaviors/os/security/directory-service::csidentity-authority
  - id: validation-theft
    desc: macOS credential capture validation
    crit: suspicious
    conf: 0.95
    attack: T1110.001
    for:
      - shell
      - applescript
      - python
    all:
      - id: micro-behaviors/os/security/auth/verify::dscl-password-verification
      - id: objectives/credential-access/phishing/ui::jxa-password-prompt
    any:
      - id: objectives/evasion/process/hidden/window::password-dialog
