defaults:
  # Local password-validation probes are carrier-agnostic: the same
  # `dscl . -authonly` / dslocal / ShadowHashData work appears in shell one-
  # liners, AppleScript droppers, and compiled Rust/Go/Swift stealers. The
  # per-trait `for:` overrides below keep the CoreServices symbol matchers
  # native-only.
  for: [scripts, source, macho]
  attack: T1110
  platforms:
    - macos
  crit: suspicious
traits:
  - id: dscl-dot-authonly
    desc: Validates user password via dscl
    crit: suspicious
    conf: 0.85
    attack: T1110.001
    mbc: E1110
    for:
      - shell
      - applescript
    if:
      # dscl accepts the verb with or without the leading dash; `-authonly` is
      # the documented spelling and the one macOS stealer scripts actually use.
      type: text
      regex: dscl\s+\.\s+-?authonly\b
  - id: dslocal-db
    desc: Local user/password hash database path
    crit: suspicious
    conf: 0.7
    attack: T1003.008
    if:
      type: text
      substr: /var/db/dslocal
    unless:
      - id: well-known/app/utility/cmdchamp/
      - id: well-known/app/storage/carbon-copy-cloner::official-carbon-copy-cloner-member
      - id: well-known/app/infrastructure/puppet::puppet-source-context
      # Chef's user provider manages macOS accounts, which means reading and
      # writing the same directory services store a stealer targets.
      - id: well-known/app/infrastructure/chef::chef-source-context
      # Permission libraries validate candidate paths; this call is a guard,
      # not a read of the local account database.
      - type: symbol
        kind: call
        exact: normalized.startsWith
        arg:
          kind: string
          exact: /var/db/dslocal/
  - id: shadow-hash-data
    desc: macOS password hash blob key
    crit: suspicious
    conf: 0.7
    attack: T1003.008
    if:
      type: text
      substr: ShadowHashData
    unless:
      - id: well-known/app/infrastructure/puppet::puppet-source-context
      # Chef's user provider writes ShadowHashData to set account passwords;
      # it is the management action itself, not a hash dump.
      - id: well-known/app/infrastructure/chef::chef-source-context
  - id: csidentity-query-create
    desc: Searches macOS user directory
    crit: suspicious
    conf: 0.75
    attack: T1087.001
    for:
      - macho
    if:
      type: symbol
      regex: CSIdentityQueryCreateForName
  - id: csidentity-query-execute
    desc: Executes macOS directory search
    crit: suspicious
    conf: 0.75
    attack: T1087.001
    for:
      - macho
    if:
      type: symbol
      regex: CSIdentityQueryExecute
  - id: csidentity-query-results
    desc: Retrieves macOS account results
    crit: suspicious
    conf: 0.75
    attack: T1087.001
    for:
      - macho
    if:
      type: symbol
      regex: CSIdentityQueryCopyResults
  - id: csidentity-authority
    desc: Accesses macOS user authority
    crit: suspicious
    conf: 0.7
    attack: T1087.001
    for:
      - macho
    if:
      type: symbol
      regex: CSGetDefaultIdentityAuthority
composite_rules:
  - id: dscl-authonly-comp
    desc: macOS password validation
    crit: suspicious
    conf: 0.95
    attack: T1110.001
    mbc: E1110
    any:
      - id: dscl-dot-authonly
      - id: micro-behaviors/os/security/auth/verify::dscl-authonly
      - id: micro-behaviors/os/security/auth/verify::dscl-authonly-argv
  - id: shadow-hash
    desc: Accesses shadow password hashes
    crit: suspicious
    conf: 0.85
    attack: T1003.008
    for:
      - macho
      - applescript
    any:
      - id: dslocal-db
      - id: shadow-hash-data
      - id: micro-behaviors/os/privilege/paths::etc-shadow
  - id: csidentity-query
    desc: macOS CoreServices user enumeration
    crit: suspicious
    conf: 0.85
    attack: T1087.001
    for:
      - macho
    all:
      - id: csidentity-query-create
    any:
      - id: csidentity-query-execute
      - id: csidentity-query-results
  - id: csidentity-password-auth
    desc: macOS CoreServices password authentication
    crit: suspicious
    conf: 0.95
    attack: T1110.001
    mbc: E1110
    for:
      - macho
    all:
      - id: micro-behaviors/os/security/auth/verify::csidentity-auth
    any:
      - id: csidentity-query-create
      - id: csidentity-authority
  - id: validation-theft
    desc: macOS credential capture validation
    crit: suspicious
    conf: 0.95
    attack: T1110.001
    for:
      - shell
      - applescript
      - python
    all:
      - id: dscl-authonly
      - id: objectives/credential-access/phishing/ui::jxa-password-prompt
    any:
      - id: objectives/evasion/process/hidden/window::password-dialog
