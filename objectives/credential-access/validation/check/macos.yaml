defaults:
  # Local password-validation probes are carrier-agnostic: the same
  # `dscl . -authonly` / dslocal / ShadowHashData work appears in shell one-
  # liners, AppleScript droppers, and compiled Rust/Go/Swift stealers. The
  # per-trait `for:` overrides below keep the CoreServices symbol matchers
  # native-only.
  for: [scripts, source, macho]
  attack: T1110
  platforms:
    - macos
  crit: suspicious
traits:
  - id: dslocal-db
    desc: Local user database path reference
    crit: notable
    conf: 0.7
    attack: T1003.008
    if:
      type: text
      substr: /var/db/dslocal
  - id: shadow-hash-data
    desc: macOS password hash blob key reference
    crit: notable
    conf: 0.7
    attack: T1003.008
    if:
      # Match executable string literals, not a source comment saying that
      # ShadowHashData parsing is still TODO.
      type: literal
      substr: ShadowHashData
  - id: supplied-plist-from-input
    desc: Parses a plist from supplied input
    crit: notable
    conf: 0.9
    for: [rust]
    if:
      type: text
      regex: 'from_reader\([^\n]{0,60}input\.data'
composite_rules:
  - id: shadow-hash
    desc: Shadow password store reference
    crit: notable
    conf: 0.85
    attack: T1003.008
    for:
      - macho
      - applescript
    any:
      - id: dslocal-db
      - id: shadow-hash-data
      - id: micro-behaviors/os/privilege/paths::etc-shadow
  - id: validation-theft
    desc: macOS credential capture validation
    crit: suspicious
    conf: 0.95
    attack: T1110.001
    for:
      - shell
      - applescript
      - python
    all:
      - id: micro-behaviors/os/security/auth/verify::dscl-password-verification
      - id: micro-behaviors/ui/dialog/apple::jxa-password-prompt
    any:
      - id: objectives/evasion/process/hidden/window::password-dialog
