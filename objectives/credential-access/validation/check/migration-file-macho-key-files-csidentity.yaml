defaults:
  platforms:
  - macos
  for:
  - macho
composite_rules:
- id: macos-credential-targeting-authentication
  desc: Credential targeting and authentication
  crit: suspicious
  conf: 0.95
  attack: T1555
  mbc: B0028
  all:
  - id: objectives/discovery/system/fingerprint/machine-id::macos-hardware-uuid
  - id: micro-behaviors/os/security/auth/verify::csidentity-password-auth
  - id: objectives/collection/file-targeting/filter::macos-credential-file-targeting
  - id: micro-behaviors/communications/socket/create/
