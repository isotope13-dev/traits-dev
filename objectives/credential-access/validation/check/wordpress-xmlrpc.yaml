# A normal WordPress client may invoke wp.getUsersBlogs once. Explicitly
# interpreting a fault-free raw XML-RPC response as successful authentication
# is stronger evidence of a credential checker.
defaults:
  platforms: [unix, windows]
  for: [python]
  attack: T1110.001
  mbc: E1110

composite_rules:
  - id: python-wordpress-xmlrpc-credential-validation
    desc: Python validates credentials through WordPress XML-RPC
    crit: suspicious
    conf: 0.98
    near_bytes: 1800
    all:
      - id: micro-behaviors/communications/http/xmlrpc::wordpress-login-method
      - id: micro-behaviors/communications/http/xmlrpc::python-fault-absence-success-check
      - id: micro-behaviors/communications/http/lib/requests::requests-post
