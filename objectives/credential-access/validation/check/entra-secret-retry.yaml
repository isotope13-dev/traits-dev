# A known permanent secret error triggers a delay and another request in the
# same unconditional loop. Neither ordinary token refresh nor fail-fast error
# handling meets this shape. No claim of successful sign-in is made.
defaults:
  platforms: [unix, windows]
  for: [python]
  crit: suspicious
  conf: 0.94

traits:
  - id: python-entra-invalid-secret-retry
    desc: Retries token requests on rejected secrets
    if:
      type: tree-sitter
      language: python
      query: |
        ((while_statement condition: (true)
          body: (block
            . (expression_statement (assignment
              left: (identifier) @result
              right: (call function: (attribute
                attribute: (identifier) @token_method))))
            (if_statement condition: (comparison_operator
              (string (string_content) @error_code)
              operators: "in"
              (call function: (attribute object: (identifier) @result_use
                  attribute: (identifier) @getter)
                arguments: (argument_list
                  . (string (string_content) @error_field))))
              consequence: (block
                . (expression_statement (call function: (attribute
                    object: (identifier) @timer
                    attribute: (identifier) @sleep)))
                . (continue_statement) .)))) @retry
          (#eq? @token_method "acquire_token_for_client")
          (#eq? @result @result_use)
          (#eq? @getter "get")
          (#eq? @error_field "error_description")
          (#match? @error_code "^AADSTS70002(15|22)$")
          (#eq? @sleep "sleep")
          (#set! cleave.ignore-comments "true"))
