# The protocol master password is fixed by SubSeven, not a campaign token.
# https://www.giac.org/paper/gcih/287/seven-risk-internet-security/102981
defaults:
  for: [mirc]
  platforms: [windows]
traits:
  - id: mirc-subseven-master-password-send
    desc: mIRC socket sends SubSeven master password
    crit: suspicious
    conf: 0.99
    if:
      type: text
      regex: '(?i)\bsockwrite\s+\$sockname\s+PWD\s+\$\+\s+14438136782715101980\b'
composite_rules:
  - id: mirc-subseven-master-password-login
    desc: SubSeven master-password login over mIRC socket
    crit: hostile
    conf: 0.99
    all:
      - id: mirc-subseven-master-password-send
      - id: micro-behaviors/communications/socket/connect::mirc-sockopen
      - id: micro-behaviors/communications/socket/receive::mirc-sockread-event
