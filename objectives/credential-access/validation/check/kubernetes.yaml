defaults:
  platforms: [unix]
  for: [shell]
  attack: T1552.001

traits:
- id: kubernetes-livez-client-cert-external-url
  desc: Kubernetes livez probe targets external host
  crit: notable
  conf: 0.9
  if:
    type: text
    regex: 'https://.{1,120}:443/livez\?verbose'
    is: external_ip

composite_rules:
# A client-cert mTLS probe against a private/LAN address (RFC1918, loopback)
# is the standard way infra test scripts verify their own cluster or load
# balancer -- e.g. a helm chart's own smoke test hitting the VIP it just
# provisioned. Requiring an external target keeps this hostile composite for
# the credential-validation-against-a-remote-server pattern (attacker
# checking whether harvested client creds still work) without convicting
# same-network self-tests.
- id: kubernetes-client-cert-mtls-validation
  desc: Kubernetes client certificate validated against an external host
  crit: hostile
  conf: 0.99
  ref: sha256:e4445eaa3155940f60991241a809409aa70b708303a0d07aa35b2e3d2bf76885
  all:
  - id: objectives/credential-access/cloud/token/cli::kubernetes-client-cert-bundle-materialization
  - id: micro-behaviors/communications/http/tls::curl-mutual-tls
  - id: kubernetes-livez-client-cert-external-url
