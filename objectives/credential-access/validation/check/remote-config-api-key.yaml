defaults:
  platforms:
  - unix
  - windows
  for:
  - python
composite_rules:
- id: remote-response-api-key-validation
  desc: HTTP response key extraction with bearer API validation
  crit: suspicious
  conf: 0.95
  attack: T1528
  near_lines: 60
  all:
  - id: objectives/credential-access/api-harvest/token::python-http-response-api-key-regex
  - id: micro-behaviors/communications/http/llm::python-compatible-models-request
  - id: micro-behaviors/communications/http/authorization-header::bearer-header-from-variable
