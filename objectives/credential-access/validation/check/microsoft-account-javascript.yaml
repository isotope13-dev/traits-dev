# Microsoft account credential checking.
#
# A checker takes email/password pairs from a combo list, posts each pair to
# Microsoft's live login endpoint with the email substituted into the URL,
# classifies each reply as hit, bad, two-factor, or rotate (retry on another
# proxy), then searches a hit's mailbox for keywords and clears account-security
# interrupts. A consumer mail client posts to the same login host, but it does
# not enumerate those outcomes or sweep the mailbox of other accounts.
#
# The hostile verdict lives in the composite. Its atoms are common web-client
# vocabulary on their own; the login host must co-occur with the outcome
# vocabulary and at least two checker-specific signals in the same file.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  attack: T1110.004
  mbc: E1110

traits:
  - id: microsoft-live-login-post
    desc: Posts credentials to Microsoft live login
    crit: notable
    conf: 0.9
    if:
      type: text
      substr: login.live.com/ppsecure/post.srf
  - id: combo-email-url-placeholder
    desc: Login URL substitutes an email placeholder
    crit: suspicious
    conf: 0.9
    if:
      type: text
      substr: username=%7bemail%7d
      case_insensitive: true
  - id: outlook-mailbox-search-api
    desc: Queries the Outlook mailbox search API
    crit: notable
    conf: 0.9
    if:
      type: text
      substr: outlook.live.com/search/api/v2/query
  - id: account-security-interrupt-bypass
    desc: Clears Microsoft account security interrupts
    crit: notable
    conf: 0.85
    if:
      type: text
      regex: 'bypass(Proofs|Privacy|Update)|account\.microsoft\.com/auth/complete-silent-delegate'

composite_rules:
  - id: checker-engine-signals
    desc: Two checker-specific account signals in one file
    crit: notable
    any:
      - id: combo-email-url-placeholder
      - id: outlook-mailbox-search-api
      - id: account-security-interrupt-bypass
    needs: 2
  - id: microsoft-account-credential-checker
    desc: Microsoft account checker validates login outcomes
    crit: hostile
    conf: 0.95
    all:
      - id: microsoft-live-login-post
      - id: metadata/lang/source/literal/string/fragment::twofa-and-rotate-literals
      - id: checker-engine-signals
