# Compiled PE account credential checkers (combo/ULP/cookie checkers).
#
# These tools load email:password combo lists or browser cookie archives,
# authenticate against target services (Microsoft/Hotmail, Xbox, Minecraft,
# Discord) at high concurrency, report Checks Per Minute (CPM), and sort
# valid hits, tokens, and invalid/rate-limited accounts into output files.
defaults:
  platforms: [windows]
  for: [pe]
  attack: T1110.004
  mbc: E1110

traits:
  - id: cpm-combo-checker-metrics
    desc: Reports combo-list and CPM checker metrics
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: 'Checked %d/%d \| CPM: %d|Loaded %d combos|Dedupe combos'

  - id: checker-gaming-hit-outputs
    desc: Writes Minecraft or Xbox checker hit files
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: 'mc_hits\.txt|mctoken\.txt|Xbox_Ultimate'

  - id: checker-outcome-buckets
    desc: Sorts invalid or rate-limited accounts to files
    crit: notable
    conf: 0.85
    if:
      type: text
      regex: 'Microsoft/invalid\.txt|Microsoft/unknown\.txt|rate_limited\.txt'

composite_rules:
  - id: pe-account-credential-checker
    desc: PE account checker validates combos and writes hits
    crit: hostile
    conf: 0.95
    all:
      - id: cpm-combo-checker-metrics
      - id: checker-gaming-hit-outputs
      - id: checker-outcome-buckets
