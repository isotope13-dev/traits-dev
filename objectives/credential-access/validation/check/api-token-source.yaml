# Provider-side live checks used to separate usable harvested credentials from
# dead entries. Individual authenticated identity/profile requests are ordinary
# API behavior; the multi-provider combination is the suspicious behavior, and
# the hostile verdict additionally requires a harvested-secret inventory that
# is updated with the validation result.
defaults:
  platforms: [unix, windows]
  for: [scripts, source]
  attack: T1528

traits:
  - id: secret-inventory-provider-fields
    desc: Provider and secret schema fields
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?is)\b(provider|service)\s+TEXT.{0,120}\b(secret|token|api_key)\s+TEXT'

  - id: secret-inventory-source-status-fields
    desc: Secret source and status schema fields
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?is)\b(source_url|origin)\s+TEXT.{0,120}\bstatus\s+TEXT'

  - id: secret-validation-state-triad
    desc: Unchecked valid invalid state triad
    crit: notable
    conf: 0.92
    if:
      type: text
      regex: '(?is)\bunchecked\b.{0,80}\bvalid\b.{0,80}\binvalid\b'

  - id: secret-table-status-update
    desc: Updates secret table status
    crit: notable
    conf: 0.92
    if:
      type: text
      regex: '(?i)UPDATE\s+\w*(secret|credential|token)\w*\s+SET\s+status\s*='

  - id: last-checked-sql-assignment
    desc: Assigns SQL last-checked field
    crit: notable
    conf: 0.9
    if:
      type: text
      # SQL column context only (`SET last_checked =`, `, last_checked =`);
      # a Python attribute such as robotparser's `self.last_checked = 0` is not
      # an SQL assignment.
      regex: '(?i)(\bSET\s+|,\s*)last_checked\s*='

composite_rules:
  - id: secret-validation-inventory-schema
    for: [scripts, '!jcl']
    desc: Secret inventory with validation states
    crit: suspicious
    conf: 0.97
    near_lines: 32
    all:
      - id: micro-behaviors/data/db/schema/relational::sql-create-table
      - id: secret-inventory-provider-fields
      - id: secret-inventory-source-status-fields
      - id: secret-validation-state-triad
    unless:
      - id: well-known/tool/detection/security-scanner/
      - id: well-known/tool/detection/threat-intel/

  - id: secret-validation-status-update
    desc: Updates stored secret validation state
    crit: suspicious
    conf: 0.96
    near_lines: 12
    all:
      - id: secret-table-status-update
      - id: last-checked-sql-assignment
    unless:
      - id: well-known/tool/detection/security-scanner/
      - id: well-known/tool/detection/threat-intel/

  - id: aws-bedrock-credential-capacity-probe
    desc: Explicit AWS credentials probe Bedrock model capacity
    crit: suspicious
    conf: 0.97
    all:
      - id: micro-behaviors/communications/http/token-auth::aws-access-key-live-check
      - id: micro-behaviors/communications/http/services/aws::bedrock-model-discovery-operation
      - id: micro-behaviors/communications/http/services/aws::bedrock-model-invocation-operation

  - id: harvested-aws-credential-live-validation
    desc: Correlated harvested AWS credentials are live-validated and tracked
    crit: hostile
    conf: 0.99
    all:
      - id: secret-validation-inventory-schema
      - id: secret-validation-status-update
      - id: objectives/credential-access/theft/harvested-store::aws-credential-record-pair-correlation
      - id: micro-behaviors/communications/http/token-auth::aws-access-key-live-check

  - id: multi-provider-api-token-live-check
    desc: Secret inventory with multiple provider validation APIs
    crit: suspicious
    conf: 0.97
    all:
      - id: secret-validation-inventory-schema
    needs: 2
    any:
      - id: micro-behaviors/communications/http/token-auth::github-api-token-live-check
      - id: micro-behaviors/communications/http/token-auth::sendgrid-api-token-live-check
      - id: micro-behaviors/communications/http/token-auth::openai-api-token-live-check
      - id: micro-behaviors/communications/http/token-auth::aws-access-key-live-check
    unless:
      - id: well-known/tool/detection/cordon-scanner::cordon-defensive-scanner-context

  - id: harvested-secret-live-validation-manager
    for: [python]
    desc: Maintains validation state for harvested multi-provider secrets
    crit: hostile
    conf: 0.99
    all:
      - id: secret-validation-inventory-schema
      - id: secret-validation-status-update
      - id: multi-provider-api-token-live-check
      - id: objectives/credential-access/api-harvest/token::python-provider-secret-regex-extractor
