defaults:
  platforms: [windows, unix]
  for: [scripts, binaries, c, cpp]
  attack: T1115
  mbc: E1510
traits: []
composite_rules:
  - id: clipboard-rw
    for: [pe, c]
    desc: Clipboard read and write APIs
    crit: component
    conf: 0.8
    all:
      - id: micro-behaviors/os/clipboard/read::get-clipboard-data
      - id: micro-behaviors/os/clipboard/write::set-clipboard-data
  - id: clipboard-hijacker
    for: [pe, c]
    desc: Cryptocurrency clipboard hijacker
    crit: hostile
    conf: 0.95
    all:
      - id: clipboard-rw
    any:
      - id: micro-behaviors/data/format/crypto-address::btc-address-regex
      - id: micro-behaviors/data/format/crypto-address::btc-base58-range-regex
      - id: micro-behaviors/data/format/crypto-address::bch-address-regex
      - id: micro-behaviors/data/format/crypto-address::btc-bech32-regex
      - id: micro-behaviors/data/format/crypto-address::btc-chaos-regex
      - id: micro-behaviors/data/format/crypto-address::eth-address-regex
      - id: micro-behaviors/data/format/crypto-address::trx-address-regex
      - id: micro-behaviors/data/format/crypto-address::xmr-address-regex
      - id: micro-behaviors/data/format/crypto-address::ltc-range-or-bech32-address-regex
      - id: micro-behaviors/data/format/crypto-address::ltc-literal-prefix-address-regex
      - id: micro-behaviors/data/format/crypto-address::doge-address-regex
      - id: micro-behaviors/data/format/crypto-address::sol-address-regex
      - id: micro-behaviors/data/format/crypto-address::hardcoded-btc-addr
      - id: micro-behaviors/data/format/crypto-address::example-btc-unspendable-address
      - id: micro-behaviors/data/format/crypto-address::example-eth-zero-burn-address
      - id: micro-behaviors/data/format/crypto-address::hardcoded-monero-address
      - id: micro-behaviors/data/format/crypto-address::hardcoded-eth-addr
      - id: micro-behaviors/data/format/crypto-address::hardcoded-sol-addr
      - id: micro-behaviors/data/format/crypto-address::hardcoded-eth-address-table
      - id: micro-behaviors/data/format/crypto-address::hardcoded-tron-address-table
      - id: micro-behaviors/data/format/crypto-address::hardcoded-bch-address-table
      - id: micro-behaviors/data/format/crypto-address::hardcoded-litecoin-address-table
      - id: micro-behaviors/data/format/crypto-address::rust-ethereum-address-regex
      - id: micro-behaviors/data/format/crypto-address::rust-bitcoin-address-regex
      - id: micro-behaviors/data/format/crypto-address::embedded-btc-address-regex
      - id: micro-behaviors/data/format/crypto-address::class-eth-address-regex
      - id: micro-behaviors/data/format/crypto-address::class-btc-address-regex
      - id: micro-behaviors/data/format/crypto-address::ltc-address-regex
      - id: micro-behaviors/data/format/crypto-address::single-chain-address-regex
      - id: micro-behaviors/data/format/crypto-address::multi-chain-address-regex
      - id: micro-behaviors/data/format/crypto-address::ethereum-validation-regex-literal
      - id: micro-behaviors/data/format/crypto-address::multi-chain-address-table
      - id: micro-behaviors/data/format/crypto-address::rust-single-chain-address-regex
      - id: micro-behaviors/data/format/crypto-address::rust-multi-chain-address-regex
      - id: micro-behaviors/data/format/crypto-address::ethereum-address-literal
      - id: micro-behaviors/data/format/crypto-address::hardcoded-eth-wallet-constant
      - id: micro-behaviors/data/format/crypto-address::btc-family-address-matcher
      - id: micro-behaviors/data/format/crypto-address::account-model-address-matcher
      - id: micro-behaviors/data/format/crypto-address::altcoin-address-matcher
      - id: micro-behaviors/data/format/crypto-address::multi-chain-address-matchers
      - id: micro-behaviors/data/format/crypto-address::bech32-validation-regex-literal
      - id: micro-behaviors/data/format/crypto-address::tron-validation-regex-literal
      - id: micro-behaviors/data/format/crypto-address::monero-validation-regex-literal
      - id: micro-behaviors/data/format/crypto-address::litecoin-validation-regex-literal
      - id: micro-behaviors/data/format/crypto-address::base58-legacy-btc-validation-regex-literal
      - id: micro-behaviors/data/format/crypto-address::multi-chain-address-validation-regex-set
      - id: micro-behaviors/data/format/crypto-address::ss58-address-literal
      - id: micro-behaviors/data/format/crypto-address::ethereum-address-variable-assignment
      - id: micro-behaviors/data/format/crypto-address::ethereum-wallet-variable-assignment
      - id: micro-behaviors/data/format/crypto-address::javascript-ethereum-address-reference
    unless:
      # Scylla's UI exposes its own Bitcoin donation address and uses the
      # clipboard for ordinary copy operations; these do not establish
      # address replacement.
      - id: well-known/tool/reverse-engineering/scylla::scylla-debugger-tool-context
