# FlashFXP saved-session credential reads. The routine name is the product
# name, so the atom needs the declaration shape (a function taking one int).
# A product mention alone is documentation; it does not establish theft.
defaults:
  platforms: [windows]
  for: [c, cpp]
  crit: notable
  conf: 0.85
  attack: T1555

traits:
  - id: flashfxp-session-routine
    desc: FlashFXP session-parse routine declared
    if:
      type: text
      regex: '\bFlashFXP\s*\(\s*int\s+\w{1,20}\s*\)'
