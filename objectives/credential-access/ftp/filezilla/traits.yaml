defaults:
  platforms: [windows, unix]
  for: [scripts, binaries, csharp]
  crit: notable
  conf: 0.85
  attack: T1555
traits:
  - id: packed-password-user-fields
    desc: Packed FTP credential field grammar
    crit: notable
    conf: 0.95
    for: [pe, dll]
    platforms: [windows]
    if:
      type: text
      exact: "*;passwor|;user"
composite_rules:
  - id: packed-wininet-ftp-stealer
    desc: Packed WinINet FTP credential stealer
    crit: hostile
    conf: 0.95
    for: [pe, dll]
    platforms: [windows]
    all:
      - id: metadata/binary/section/label::upx-section
      - id: micro-behaviors/communications/http/client/wininet::internet-open
      - id: packed-password-user-fields
