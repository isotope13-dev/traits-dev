# Authentication attribute names are protocol/schema fields, not campaign IOCs.
# Administrative rotation and diagnostics can also query these secrets: keep
# collection suspicious; require transfer evidence for an exfiltration verdict.
defaults:
  platforms: [unix, windows]
  for: [scripts, binaries]
  conf: 0.95
  attack: T1552.001
composite_rules:
  - id: zimbra-authentication-secret-query
    desc: Queries Zimbra authentication secrets
    crit: suspicious
    all:
      - id: micro-behaviors/os/security/directory-service::authentication-key-attribute
    any:
      - id: micro-behaviors/os/security/directory-service::ldapsearch-command
      - id: micro-behaviors/os/security/directory-service::zmprov-domain-query
    near_lines: 1
  - id: zimbra-service-and-authentication-secret-collection
    desc: Reveals service and authentication secrets
    crit: suspicious
    all:
      - id: micro-behaviors/os/security/directory-service::zmlocalconfig-secret-command
      - id: zimbra-authentication-secret-query
    near_lines: 12
