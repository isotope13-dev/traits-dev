# Ruby that reads a desktop mail client's account file, pulls the stored SMTP
# password out of it and opens an authenticated SMTP session with it. The mail
# client keeps the passwords in plain text next to the server names; reading
# them to send as the user is credential use, not mail handling.
defaults:
  platforms: [unix]
  for: [ruby]
  attack: T1555,T1114.001

traits:
  - id: mail-client-accountrc-read
    desc: Reads a mail client accountrc file
    crit: notable
    conf: 0.92
    if:
      type: text
      regex: 'File\.(read|open)\(\s*"[^"\n]{0,60}accountrc"'

composite_rules:
  - id: ruby-mail-client-credential-smtp-login
    desc: Ruby logs in to SMTP with stored mail-client password
    crit: hostile
    conf: 0.95
    near_lines: 30
    all:
      - id: mail-client-accountrc-read
      - id: objectives/lateral-movement/worm/email::ruby-mail-config-password
      - id: objectives/lateral-movement/worm/email::ruby-net-smtp-start
