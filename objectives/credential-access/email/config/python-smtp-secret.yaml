# A Python module that imports smtplib and assigns a live application
# password is shipping a mailbox credential, not configuring a mailer.
defaults:
  platforms: [unix, windows]
  for: [python]
  attack: T1552.001
  crit: notable

composite_rules:
  - id: python-smtp-ships-app-password
    desc: SMTP client ships an application password
    crit: hostile
    conf: 0.96
    scope: file
    all:
      - id: micro-behaviors/communications/email/send/smtp::python-smtplib-import
      - id: micro-behaviors/communications/email/send/smtp::python-app-password-literal
