# Outlook Web Access browser implant behavior.
#
# These traits describe the mechanics reported for OWAReaper: an injected
# script persists in OWA's page state, captures autofill values, and uses OWA's
# own client APIs to obtain a mailbox token and change folder permissions.
# They intentionally do not key on a malware family name, URL, or hash.
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
  attack: "T1056.001,T1114,T1098"

traits:
  - id: owa-default-settings-state-key
    desc: OWA page-state key for default user settings
    crit: notable
    conf: 0.97
    if:
      type: text
      regex: '\bPageDataPayload\.[A-Za-z_$][A-Za-z0-9_$]*UserDefaultSettings\b'

  - id: owa-client-access-token-call
    desc: Calls an OWA client access-token API
    crit: notable
    conf: 0.97
    if:
      type: text
      regex: '(?i)\bGetClientAccessToken\s*\('

  - id: owa-update-folder-call
    desc: Calls an OWA folder-update API
    crit: notable
    conf: 0.96
    if:
      type: text
      regex: '(?i)\bUpdateFolder\s*\('

  - id: owa-default-folder-marker
    desc: OWA default-folder marker
    crit: component
    conf: 0.94
    if:
      type: text
      word: Default

  - id: owa-owner-role-marker
    desc: OWA folder Owner role marker
    crit: component
    conf: 0.94
    if:
      type: text
      word: Owner

  - id: owa-input-element
    desc: Creates an input element in OWA
    crit: component
    conf: 0.9
    if:
      type: text
      regex: 'createElement\s*\(\s*[''\"]input[''\"]\s*\)'

  - id: owa-autocomplete-username
    desc: Sets a username autofill field
    crit: component
    conf: 0.92
    if:
      type: text
      regex: 'autocomplete\s*=\s*[''\"]username[''\"]'

  - id: owa-autocomplete-password
    desc: Sets a password autofill field
    crit: component
    conf: 0.92
    if:
      type: text
      regex: 'autocomplete\s*=\s*[''\"]current-password[''\"]'

  - id: owa-body-click-handler
    desc: Registers an OWA body click handler
    crit: component
    conf: 0.9
    if:
      type: text
      regex: 'document\.body\.addEventListener\s*\(\s*[''\"]click[''\"]'

  - id: owa-autofill-value-read
    desc: Reads values from autofill variables
    crit: component
    conf: 0.94
    if:
      type: text
      regex: '\b(user|pass)\.value\b'

composite_rules:
  - id: owa-browser-state-credential-implant
    desc: OWA page-state persistence combined with hidden autofill capture
    crit: hostile
    conf: 0.99
    attack: "T1056.001,T1114"
    near_bytes: 8192
    all:
      - id: owa-default-settings-state-key
      - id: micro-behaviors/data/db/web-storage::dom-storage-setitem
      - id: owa-input-element
      - id: owa-autocomplete-username
      - id: owa-autocomplete-password
      - id: owa-body-click-handler
      - id: owa-autofill-value-read
      - id: micro-behaviors/communications/http/request/client::js-fetch-call

  - id: owa-mailbox-token-folder-takeover
    desc: OWA token access followed by default-folder Owner permission change
    crit: hostile
    conf: 0.99
    attack: "T1528,T1098"
    near_bytes: 2400
    all:
      - id: owa-client-access-token-call
      - id: owa-update-folder-call
      - id: owa-default-folder-marker
      - id: owa-owner-role-marker
