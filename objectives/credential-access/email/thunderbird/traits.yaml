defaults:
  platforms: [windows, unix]
  for: [scripts, binaries, csharp]
  attack: T1555
traits:
  - id: profiles-path
    desc: Thunderbird Profiles directory
    crit: suspicious
    conf: 0.85
    if:
      type: text
      regex: Thunderbird[/\\]Profiles
    unless:
      - id: well-known/app/utility/siw::siw-family-identity
      # PortableApps / Thunderbird installers reference the profile directory for
      # cleanup and migration, not credential theft.
      - id: well-known/app/communication/thunderbird/
      - id: metadata/signed/platform::mozilla
      - id: metadata/signed/leaf::mozilla-corporation
