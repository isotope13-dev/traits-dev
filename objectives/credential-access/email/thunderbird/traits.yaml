defaults:
  platforms: [windows, unix]
  for: [scripts, binaries, csharp]
  attack: T1555
traits:
  - id: profiles-path
    desc: Thunderbird Profiles directory
    crit: suspicious
    conf: 0.85
    if:
      type: text
      regex: Thunderbird[/\\]Profiles
    unless:
      - id: well-known/app/siw::siw-family-identity
