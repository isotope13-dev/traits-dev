defaults:
  platforms: [windows]
  for: [pe, dll]
composite_rules:
  - id: native-keylogger-outlook-password-decryption
    desc: Keylogger with Outlook password-decryption APIs
    crit: hostile
    conf: 0.98
    attack: T1552.002
    all:
      - id: objectives/collection/keylog/hook::native-keyboard-hook-recording
      - id: micro-behaviors/os/registry/keys/credential::outlook-profile-registry-key
      - id: micro-behaviors/os/registry/value-name::pop3-password-value
      - id: micro-behaviors/os/registry/value-name::smtp-password-value
      - id: micro-behaviors/os/registry/read::reg-query-value-ex-w-symbol
      - id: micro-behaviors/os/security/dpapi::crypt-unprotect-data-api
