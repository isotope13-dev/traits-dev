# Domain cached credentials are derived from registry-held LSA secrets.
defaults:
  platforms: [windows]
  for: [pe, dll]
  attack: "T1003.005"
  mbc: "B0005"
  # Sized past the 220 KiB ceiling so carved extents of small cache dumpers
  # still match: a cachedump64 extent carves at ~232 KiB with trailing parent
  # bytes. The NL$KM-plus-decrypt-plus-service triple below is specific
  # enough that the ceiling is only defense in depth, not the precision.
  size_max: 300000

composite_rules:
  - id: mscache-nlkm-service-dumper
    desc: Domain cache dumper reads NL$KM via a service
    crit: suspicious
    conf: 0.98
    all:
      - id: micro-behaviors/os/registry/keys::nlkm-lsa-secret-path
      - id: micro-behaviors/os/service/create::create-service
    any:
      - id: micro-behaviors/os/security/lsa::lsasrv-library-reference
      - id: micro-behaviors/process/info/name::lsass-process-reference

    downgrade:
      any:
        - id: well-known/dual-use/credentials/fgdump::credential-auditing-tool-context
  - id: mscache-lsa-key-decrypt-service
    desc: Domain cache dumper decrypts LSA secrets in a service
    crit: suspicious
    conf: 0.97
    all:
      - id: micro-behaviors/os/registry/keys::nlkm-lsa-secret-path
      - id: micro-behaviors/os/security/lsa::lsa-systemfunction005
      - id: micro-behaviors/os/service/dispatch::start-service-dispatcher

    downgrade:
      any:
        - id: well-known/dual-use/credentials/fgdump::credential-auditing-tool-context
