defaults:
  crit: suspicious
  platforms: [windows]
  for: [powershell]
  attack: T1552.002
  mbc: B0028

composite_rules:
  - id: ps-lsa-secrets-registry-access
    desc: PowerShell LSA secrets access
    conf: 0.95
    near_bytes: 192
    all:
      - id: micro-behaviors/os/registry/keys::ps-lsa-path-variable-assignment
      - id: micro-behaviors/os/registry/read::ps-lsa-get-childitem

