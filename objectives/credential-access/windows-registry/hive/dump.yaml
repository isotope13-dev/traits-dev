defaults:
  platforms: [windows]
  for: [scripts, binaries]
  attack: T1003.002

traits:
  - id: reg-save-sam-hive
    desc: Saves Windows SAM registry hive
    crit: suspicious
    conf: 0.95
    if:
      type: text
      regex: '(?i)\breg(\.exe)?\s+save\s+HKLM\\SAM\b'
    unless:
      - id: well-known/lib/vendor-sdk/sogen/
  - id: reg-save-system-hive
    desc: Saves Windows SYSTEM registry hive
    crit: suspicious
    conf: 0.95
    if:
      type: text
      regex: '(?i)\breg(\.exe)?\s+save\s+HKLM\\SYSTEM\b'
    unless:
      - id: well-known/lib/vendor-sdk/sogen/
  - id: reg-save-security-hive
    desc: Saves Windows SECURITY registry hive
    crit: suspicious
    conf: 0.95
    if:
      type: text
      regex: '(?i)\breg(\.exe)?\s+save\s+HKLM\\SECURITY\b'
    unless:
      - id: well-known/lib/vendor-sdk/sogen/
composite_rules:
  - id: evasive-sam-system-hive-dump
    for: [pe]
    desc: Evasive SAM and SYSTEM hive dump
    crit: hostile
    conf: 0.99
    all:
      - id: reg-save-sam-hive
      - id: reg-save-system-hive
      - id: micro-behaviors/os/api-resolution/manual::peb-export-resolver-x64
  - id: sam-system-hive-extraction
    desc: SAM and SYSTEM hive extraction
    crit: hostile
    conf: 0.99
    all:
      - id: reg-save-sam-hive
      - id: reg-save-system-hive
    any:
      - id: micro-behaviors/fs/path/credential::windows-temp-sam-hive-staging
      - id: micro-behaviors/fs/path/credential::windows-temp-system-hive-staging
      - id: micro-behaviors/fs/path/credential::windows-temp-security-hive-staging
      - id: objectives/command-and-control/backdoor/webshell/request/command::aspnet-request-command-webshell
  - id: sam-system-security-hive-dump
    desc: SAM SYSTEM SECURITY hive dump
    crit: hostile
    conf: 0.99
    all:
      - id: reg-save-sam-hive
      - id: reg-save-system-hive
      - id: reg-save-security-hive

  - id: system-security-hive-dump
    desc: SYSTEM and SECURITY hive dump
    crit: hostile
    conf: 0.98
    all:
      - id: reg-save-system-hive
      - id: reg-save-security-hive

  - id: system-security-hive-base64-staging
    for: [batch, powershell]
    desc: Base64-stages dumped SYSTEM and SECURITY registry hives
    crit: hostile
    conf: 0.99
    attack: T1003.002,T1132.001
    all:
      - id: system-security-hive-dump
      - id: micro-behaviors/data/encode/command::certutil-base64-encode-command
