defaults:
  for: [text]
  platforms: [windows]
traits:
  - id: builder-form-token-stealer-option
    desc: Token stealer form option
    crit: notable
    if:
      type: text
      regex: '\.Text\s*=\s*"Token Stealer"'
  - id: builder-form-disable-defender-option
    desc: Defender service disabling form option
    crit: notable
    if:
      type: text
      regex: '\.Text\s*=\s*"Disable WD Services"'
  - id: builder-form-payload-link
    desc: Payload link form field
    crit: notable
    if:
      type: text
      regex: '\.PlaceholderText\s*=\s*"Payload Link"'
  - id: builder-form-build-button
    desc: Build form button
    crit: notable
    if:
      type: text
      regex: '\.Text\s*=\s*"Build"'
composite_rules:
  - id: token-stealer-builder-form
    desc: Builder form offers token stealing and Defender service disabling
    crit: hostile
    all:
      - id: builder-form-token-stealer-option
      - id: builder-form-disable-defender-option
      - id: builder-form-payload-link
      - id: builder-form-build-button
