# Cloud credentials embedded as runtime configuration in distributed packages.
# These match credential-shaped assignments, not variable-name references or
# example placeholders. Distribution is suspicious exposure; use or theft
# intent requires separate execution or exfiltration evidence.
defaults:
  platforms: [unix, windows]
  attack: T1552.001,T1528
  crit: notable
  conf: 0.98

traits:
  - id: alibaba-cloud-access-key-id
    desc: Embedded Alibaba Cloud access-key ID
    for: [text, data, json]
    if:
      type: raw
      regex: '\bALIBABA_CLOUD_ACCESS_KEY_ID\s*=\s*[''\"]?LTAI[A-Za-z0-9]{16,24}'

  - id: alibaba-cloud-access-key-secret
    desc: Embedded Alibaba Cloud access-key secret
    for: [text, data, json]
    if:
      type: raw
      regex: '\bALIBABA_CLOUD_ACCESS_KEY_SECRET\s*=\s*[''\"]?[A-Za-z0-9]{24,40}'

  - id: supabase-service-role-key-jwt
    desc: Supabase service-role key has JWT value
    for: [text, data, json]
    if:
      type: raw
      regex: '\bSUPABASE_SERVICE_ROLE_KEY\s*=\s*[''\"]?eyJ[A-Za-z0-9_-]{20,}\.'

composite_rules:
  - id: alibaba-cloud-access-key-pair
    desc: Embedded Alibaba Cloud access-key pair
    crit: suspicious
    near_lines: 4
    all:
      - id: alibaba-cloud-access-key-id
      - id: alibaba-cloud-access-key-secret

  - id: supabase-service-role-jwt
    desc: Embedded Supabase service-role JWT
    crit: suspicious
    near_bytes: 512
    all:
      - id: supabase-service-role-key-jwt
      - id: micro-behaviors/communications/http/token-auth::compact-jwt-token-literal

  - id: shell-uses-bundled-cloud-credentials
    desc: Shell uses bundled cloud credential file
    crit: suspicious
    near_lines: 100
    all:
      - id: micro-behaviors/fs/read/file/target::shell-source-secret-dotenv
      - id: micro-behaviors/os/security/auth/cloud::aliyun-ak-auth-mode
      - id: micro-behaviors/os/security/auth/cloud::aliyun-access-key-cli-flags
