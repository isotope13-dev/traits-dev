# Mining third-party Android packages for live embedded credentials.  APK
# decompilation and verified secret scanning are individually legitimate
# security operations; their combination is sufficiently unusual to warrant
# triage, while the Telegram sink is handled by the exfiltration objective.
defaults:
  platforms: [windows, unix]
  for: [scripts, source]
  attack: T1552.001

composite_rules:
  - id: apk-decompile-verified-secret-scan
    desc: Decompiled APK scanned for live credentials
    crit: suspicious
    conf: 0.96
    near_bytes: 4096
    all:
      - id: micro-behaviors/data/archive/extract/app-package::android-app-decompiler-cli
      - id: well-known/tool/detection/sast::trufflehog-verified-filesystem-command
