defaults:
  platforms: [unix, windows]
  for: [scripts, source, binaries]
  attack: T1528

composite_rules:
  - id: decompiled-android-package-secret-harvest
    desc: Scans JADX-decompiled Android packages for verified secrets
    crit: suspicious
    conf: 0.97
    near_bytes: 3072
    all:
      - id: well-known/tool/reverse-engineering/jadx::output-decompile-command
      - id: micro-behaviors/fs/path/extension::android-apk-reference
      - id: well-known/tool/detection/sast::trufflehog-verified-filesystem-json-scan
