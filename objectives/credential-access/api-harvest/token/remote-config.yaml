defaults:
  platforms:
  - unix
  - windows
  for:
  - python
  crit: suspicious
  conf: 0.95
  attack: T1552
traits:
- id: python-http-response-api-key-regex
  desc: Searches HTTP responses for credential fields
  if:
    type: symbol
    kind: call
    regex: ^re\.find(all|iter)$
    args:
    - index: 0
      regex: (?i)(API[_-]?KEY|TOKEN|SECRET)
    - index: 1
      from:
        call: ^(requests|httpx)\.get$
composite_rules:
- id: python-exposed-config-key-extraction
  desc: Dotenv path targeting with HTTP response API key extraction
  near_lines: 60
  all:
  - id: micro-behaviors/fs/path/config/environment::dotenv-variant-path
  - id: python-http-response-api-key-regex
  attack: T1552.001
