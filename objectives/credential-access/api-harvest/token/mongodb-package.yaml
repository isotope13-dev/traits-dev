# A published package whose shipped source embeds a live MongoDB URL with
# authentication info discloses a service credential to every installer.
# Distribution is the suspicious exposure; use or theft intent requires
# separate execution or exfiltration evidence. Documentation placeholder
# URLs are excluded by the credential atom's not: list.
defaults:
  platforms: [unix, windows]
  for: [npm, javascript, typescript]
  attack: T1552.001

composite_rules:
  - id: published-mongodb-credential
    desc: Published package source embeds an authenticated MongoDB connection URL
    crit: suspicious
    conf: 0.96
    for: [npm, javascript]
    scope: archive
    all:
      - id: metadata/package/files/included::npm-publish-root-manifest
      - id: micro-behaviors/data/db/mongodb::credentialed-mongodb-url
