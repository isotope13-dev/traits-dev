defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
  attack: T1528
traits:
  # `trufflehog filesystem <path>` is the tool's normal, defensive invocation:
  # CI configs, Dockerfiles and remediation copy all tell the reader to scan a
  # bounded path (`/repo`, `/app`, `/src`). Sweeping the whole filesystem root
  # or the user's home directory is the credential-harvesting shape, and is
  # what this trait's name has always claimed to detect.
  - id: trufflehog-filesystem-root-scan
    desc: TruffleHog scan of filesystem root or home
    crit: suspicious
    unless:
      - id: well-known/tool/offensive/pentestkit/
    conf: 0.96
    for: [javascript, typescript, shell]
    platforms: [unix]
    if:
      type: text
      regex: 'trufflehog\s+filesystem\s+(/|~|\$HOME)[\s"''/]'
