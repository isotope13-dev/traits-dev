defaults:
  crit: hostile
  platforms: [unix, windows]
  for: [javascript]

composite_rules:
  - id: js-daemonized-credential-collector
    desc: Detached JavaScript credential collector
    conf: 0.96
    all:
      - id: metadata/file/profile/execution-api::daemon-guarded-detached-child
      - id: objectives/anti-static/obfuscation/obfuscator/js-obfuscator::javascript-obfuscator-string-array-runtime
      - id: micro-behaviors/data/format/credentials::npm-token-regex-format
    any:
      - id: micro-behaviors/fs/read/file/target::js-token-pattern-file-process-apis
      - id: objectives/exfiltration/http/upload::github-repo-contents-exfil
