# A CSS attribute selector can only match text that is already on the page, so
# to steal a token an injected stylesheet has to name the URL prefix the token
# is appended to (`[href^="https://…/reset?token=0"]`) and repeat the rule once
# per candidate character. The selector value therefore carries the credential
# keyword, which is what distinguishes token harvesting from the generic
# selector oracle in objectives/exfiltration/sensitive-data/css.yaml.
defaults:
  platforms: [windows, unix]
  for: [html, text]
  attack: T1528

traits:
  - id: token-bearing-attribute-selector
    desc: Attribute selector matches token-bearing value
    crit: suspicious
    conf: 0.94
    if:
      type: text
      case_insensitive: true
      regex: '\[[a-z-]{2,12}[\^$*]=["''][^"'']{0,80}(token|secret|otp|passwd)'

composite_rules:
  - id: css-token-prefix-selector-oracle
    desc: CSS oracle sweeps a token-bearing URL prefix to a remote host
    crit: hostile
    conf: 0.97
    attack: T1528,T1041
    all:
      - id: token-bearing-attribute-selector
      - id: micro-behaviors/data/format/css::content-attribute-selector-sweep
      - id: micro-behaviors/communications/http/client/resource::stylesheet-remote-url-value
    near_bytes: 256
