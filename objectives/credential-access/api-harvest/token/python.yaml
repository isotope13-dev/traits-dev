defaults:
  platforms: [windows, unix]
  for:
    - python
  attack: T1528
traits:
  - id: wildcard-oauth-scope
    desc: Wildcard OAuth scope request
    crit: suspicious
    conf: 0.88
    for: [scripts]
    ref: sha256:6f3972835d9ebdf69f562a91e68091769d80de62467e6c129d53f810de7f539a
    if:
      type: text
      regex: 'scope\s*=\s*["'']\*:\*:\*["'']|body\s*:\s*`scope=\$\{scope\}`'
composite_rules:
  # Future coverage: catches network-facing handlers that accept a
  # credential field and persist it, independent of the token's provider or
  # destination filename. Ordinary authenticated APIs do not write submitted
  # credentials to a local file.
  - id: python-request-credential-field
    desc: Reads credential field from request data
    crit: notable
    conf: 0.9
    any:
      - id: micro-behaviors/communications/http/server/request::python-request-auth-field
      - id: micro-behaviors/communications/http/server/request::python-request-key-field
  - id: network-http-credential-token-capture
    desc: HTTP credential capture and file storage
    crit: hostile
    conf: 0.97
    all:
      - id: micro-behaviors/communications/socket/bind/address::python-http-server-all-interfaces
      - id: micro-behaviors/communications/http/server/request::python-http-request-body-read
      - id: python-request-credential-field
      - id: micro-behaviors/fs/write/credential
    near_lines: 100
  - id: browser-storage-oauth-token-harvest
    desc: Browser storage OAuth token harvesting
    crit: hostile
    conf: 0.96
    mbc: B0028
    for: [scripts]
    ref: sha256:6f3972835d9ebdf69f562a91e68091769d80de62467e6c129d53f810de7f539a
    all:
      - id: micro-behaviors/data/db/web-storage::window-localstorage-getitem
      - id: micro-behaviors/communications/http/oauth::access-token
    any:
      - id: micro-behaviors/process/create/script/automation::playwright-page-evaluate
      - id: wildcard-oauth-scope
    unless:
      - id: well-known/app/litellm::litellm-package-path
  - id: browser-profile-jwt-token-harvest
    desc: Browser profile JWT token harvesting
    crit: hostile
    conf: 0.97
    mbc: B0028
    for: [scripts]
    ref: sha256:6f3972835d9ebdf69f562a91e68091769d80de62467e6c129d53f810de7f539a
    all:
      - id: micro-behaviors/data/string/search::jwt-compact-regex
      - id: micro-behaviors/fs/path/sensitive/browser::chromium-leveldb-local-storage
    any:
      - id: micro-behaviors/fs/read/file::python-pathlib-read-bytes
      - id: micro-behaviors/fs/enumerate/directory/
