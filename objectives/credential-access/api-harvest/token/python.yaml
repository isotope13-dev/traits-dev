defaults:
  platforms: [windows, unix]
  for:
    - python
  attack: T1528

traits:
  - id: credential-regex-map-binding
    desc: Credential regex map binding
    crit: component
    conf: 0.9
    if:
      type: text
      regex: '(?i)\b[A-Z_]*(SECRET|TOKEN|CREDENTIAL)[A-Z_]*(PATTERN|REGEX)'

# OAuth scope syntax is a capability.  It is not credential theft without
# evidence that a recovered token is sent to an unrelated endpoint.
composite_rules:
  - id: python-provider-secret-regex-extractor
    desc: Extracts provider secrets with regex maps
    crit: suspicious
    conf: 0.96
    near_lines: 48
    all:
      - id: credential-regex-map-binding
      - id: micro-behaviors/data/string/search::compiled-python-pattern-set
      - id: micro-behaviors/data/string/search::regex-map-findall-loop
    unless:
      - id: well-known/tool/detection/security-scanner/
      - id: well-known/tool/detection/sast/
      - id: well-known/tool/detection/redaction/

  - id: concurrent-exposed-secret-harvest-pipeline
    desc: Concurrent exposed-file secret harvesting with provider-side validation
    crit: hostile
    conf: 0.98
    attack: T1595.002,T1528
    all:
      - id: objectives/discovery/network/scan/http::python-concurrent-exposed-config-probe
      - id: python-provider-secret-regex-extractor
      - id: objectives/credential-access/validation/check::multi-provider-api-token-live-check

  # Future coverage: catches network-facing handlers that accept a
  # credential field and persist it, independent of the token's provider or
  # destination filename. Ordinary authenticated APIs do not write submitted
  # credentials to a local file.
  - id: python-request-credential-field
    desc: Reads credential field from request data
    crit: notable
    conf: 0.9
    any:
      - id: micro-behaviors/communications/http/server/request::python-request-auth-field
      - id: micro-behaviors/communications/http/server/request::python-request-key-field
  - id: network-http-credential-token-capture
    desc: HTTP credential capture and file storage
    crit: hostile
    conf: 0.97
    all:
      - id: micro-behaviors/communications/socket/bind/address::python-http-server-all-interfaces
      - id: micro-behaviors/communications/http/server/request::python-http-request-body-read
      - id: python-request-credential-field
      - id: micro-behaviors/fs/write/credential
    near_lines: 100
  - id: browser-oauth-token-exfiltration
    desc: Browser OAuth token sent to a literal remote HTTP endpoint
    crit: hostile
    conf: 0.96
    attack: T1041
    mbc: B0028
    for: [python, scripts, source]
    all:
      - id: micro-behaviors/communications/http/oauth::browser-token-access
      - id: micro-behaviors/communications/http/request/client::requests-post-url-literal
