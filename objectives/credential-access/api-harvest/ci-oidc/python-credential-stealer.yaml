defaults:
  platforms: [unix, windows]
  for: [python]

composite_rules:
  - id: stealer-requests-ci-federation
    desc: Stealer requests CI federation tokens
    crit: hostile
    conf: 0.97
    attack: T1528
    all:
      - id: objectives/exfiltration/stealer::encoded-multi-developer-secret-exfil
      - id: micro-behaviors/communications/http/client/exchange::urllib-urlopen-call-symbol
    any:
      - id: micro-behaviors/communications/http/services/azure::python-ado-oidc-request
      - id: micro-behaviors/os/env/ci-credentials::python-actions-oidc-request
