defaults:
  platforms: [unix, windows]
  for: [python]

composite_rules:
  - id: python-ci-federation-request
    desc: Builds a CI federation token request
    crit: component
    any:
      - id: micro-behaviors/communications/http/services/azure::python-ado-oidc-request
      - id: micro-behaviors/os/env/credential/ci::python-actions-oidc-request

  - id: stealer-requests-ci-federation
    desc: Stealer requests CI federation tokens
    crit: hostile
    conf: 0.97
    attack: T1528
    scope: leaf
    all:
      - id: python-ci-federation-request
    any:
      - id: objectives/exfiltration/stealer/credential/developer::encoded-multi-developer-secret-exfil
      - id: objectives/exfiltration/stealer/credential/environment/current-process::python-env-sweep-concealed-upload
      - id: objectives/exfiltration/stealer/credential/environment/other-process::python-proc-secrets-encoded-upload
      - id: objectives/exfiltration/http/env::python-full-environment-callback-post
