defaults:
  platforms: [unix, windows]
  for: [scripts]
  attack: T1528
traits:
  - id: token-prefix-ai-cloud
    desc: AI cloud token prefixes
    crit: component
    conf: 0.88
    if:
      type: text
      regex: '(sk-ant-|sk-\(proj-\)|dop_v1_)'
  - id: token-prefix-saas
    desc: SaaS token prefixes
    crit: component
    conf: 0.88
    if:
      type: text
      regex: '(xox\[baprs\]|SG\\\.|hvs\\\.)'
  - id: secret-env-grafana-cloud-api-key
    desc: Grafana Cloud API-key environment variable
    crit: component
    if:
      type: text
      word: GRAFANA_CLOUD_API_KEY
  - id: secret-env-vault-token
    desc: Vault-token environment variable
    crit: component
    if:
      type: text
      word: VAULT_TOKEN
  - id: secret-env-digitalocean-access-token
    desc: DigitalOcean access-token environment variable
    crit: component
    if:
      type: text
      word: DIGITALOCEAN_ACCESS_TOKEN
  - id: secret-env-discord-token
    desc: Discord-token environment variable
    crit: component
    if:
      type: text
      word: DISCORD_TOKEN
  - id: secret-env-op-service-account-token
    desc: 1Password service-account token variable
    crit: component
    if:
      type: text
      word: OP_SERVICE_ACCOUNT_TOKEN
  - id: redaction-credentials-marker
    desc: Credential redaction marker
    crit: component
    conf: 0.9
    if:
      type: text
      regex: 'redact(ed)?_credentials|RedactionHit|\[REDACTED:'
composite_rules:
  - id: secret-env-ai-vault
    desc: AI vault environment secrets
    crit: component
    conf: 0.86
    any:
      - id: objectives/credential-access/env/secrets/ai-provider::anthropic-api-key
      - id: objectives/credential-access/env/secrets/ai-provider::openai-api-key
      - id: secret-env-grafana-cloud-api-key
      - id: secret-env-vault-token
  - id: secret-env-digital-discord
    desc: Digital Discord environment secrets
    crit: component
    conf: 0.86
    any:
      - id: secret-env-digitalocean-access-token
      - id: secret-env-discord-token
  - id: secret-env-account-aws
    desc: Account AWS environment secrets
    crit: component
    conf: 0.86
    any:
      - id: secret-env-op-service-account-token
      - id: micro-behaviors/os/env/vars/credentials::aws-secret-access-key-var
  - id: multi-service-secret-service-catalog
    desc: Multi-service API names catalog
    crit: component
    conf: 0.92
    needs: 2
    any:
      - id: metadata/file/catalog/service::ai-vault-service-names
      - id: metadata/file/catalog/service::messaging-mail-service-names
      - id: metadata/file/catalog/service::finance-service-names
      - id: metadata/file/catalog/service::cloud-saas-service-names
    unless:
      - id: redaction-credentials-marker
      - id: metadata/package/quality/benign-context::benign-app-fp-context
  - id: multi-service-api-key-harvest-catalog
    desc: Multi-service API key harvest catalog
    crit: suspicious
    conf: 0.9
    all:
      - id: multi-service-secret-service-catalog
      - id: objectives/credential-access/env/harvesting::credential-access-notable
    any:
      - id: token-prefix-ai-cloud
      - id: token-prefix-saas
      - id: secret-env-ai-vault
      - id: secret-env-digital-discord
      - id: secret-env-account-aws
    unless:
      - id: well-known/tool/detection/sast/
      - id: well-known/tool/detection/sast/
      - id: micro-behaviors/process/interpreter/vm/
      - id: metadata/library/runtime::vscode-webview-bundle
      - id: metadata/library/runtime::acquire-vscode-api
      - id: well-known/tool/detection/llm-scanner/
      - id: redaction-credentials-marker
