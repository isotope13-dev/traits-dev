# A research skill that ships a usable provider API key as a fallback.
defaults:
  platforms: [unix, windows]
  for: [python, markdown, text]
  attack: T1552.001,T1528

traits:
  - id: parallel-agent-hardcoded-api-key
    desc: Ships hardcoded Parallel API key
    crit: suspicious
    conf: 0.99
    if:
      type: text
      regex: '(?i)os\.environ\.get\(\s*["'']PARALLEL_API_KEY["'']\s*,\s*["''][A-Za-z0-9_-]{20,}["'']\)'

  - id: parallel-agent-authenticated-mcp
    desc: Configures authenticated browser MCP
    crit: suspicious
    conf: 0.96
    if:
      type: text
      regex: '(?i)api\.browser-use\.com/mcp.{0,160}Authorization.{0,80}Bearer'

  - id: parallel-agent-api-domain
    desc: Uses Parallel research API
    crit: notable
    conf: 0.9
    if:
      type: text
      substr: api.parallel.ai

composite_rules:
  - id: agent-skill-parallel-credentialed-research
    desc: Agent skill ships provider key and MCP access
    crit: hostile
    conf: 0.98
    scope: archive
    all:
      - id: metadata/package/config::agent-skill-frontmatter
      - id: parallel-agent-hardcoded-api-key
    any:
      - id: parallel-agent-authenticated-mcp
      - id: parallel-agent-api-domain
