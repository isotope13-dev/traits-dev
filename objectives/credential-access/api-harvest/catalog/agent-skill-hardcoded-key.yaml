defaults:
  platforms:
  - unix
  - windows
  for:
  - python
  - markdown
  - text
  attack: T1552.001,T1528
traits:
- id: parallel-agent-authenticated-mcp
  desc: Configures authenticated browser MCP
  crit: suspicious
  conf: 0.96
  if:
    type: text
    regex: (?i)api\.browser-use\.com/mcp.{0,160}Authorization.{0,80}Bearer
composite_rules:
- id: agent-skill-parallel-credentialed-research
  for:
  - python
  - markdown
  - text
  - zip
  desc: Agent skill ships provider key and MCP access
  crit: hostile
  conf: 0.98
  scope: archive
  all:
  - id: metadata/package/agent-skill::agent-skill-frontmatter
  - id: metadata/lang/source/literal/string/credential::parallel-source-api-key-literal
  any:
  - id: parallel-agent-authenticated-mcp
  - id: micro-behaviors/communications/url/host/name::parallel-research-api-host
