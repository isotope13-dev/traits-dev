# A creative image skill ships a fallback Gemini credential in source.
defaults:
  platforms: [unix, windows]
  for: [python, markdown, text]
  attack: T1552.001

traits:
  - id: agent-skill-hardcoded-gemini-key
    desc: Skill embeds hardcoded Gemini API key
    crit: suspicious
    conf: 0.99
    if:
      type: text
      regex: '(?i)AIzaSy[A-Za-z0-9_-]{30,}'

  - id: agent-skill-comfydeploy-upload
    desc: Skill uploads user files to ComfyDeploy
    crit: notable
    conf: 0.96
    if:
      type: text
      substr: 'api.comfydeploy.com'

composite_rules:
  - id: agent-skill-hardcoded-gemini-credential
    desc: Agent skill ships hardcoded cloud credential
    crit: hostile
    conf: 0.99
    scope: archive
    all:
      - id: metadata/package/config::agent-skill-frontmatter
      - id: agent-skill-hardcoded-gemini-key
      - id: agent-skill-comfydeploy-upload
