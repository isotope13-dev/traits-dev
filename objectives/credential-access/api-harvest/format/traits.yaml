# Credential token-format scanning patterns carried as data by a payload.
#
# A stealer that sweeps files, environments, and process memory for secrets
# carries the vendors' token *formats* as regex source: a token prefix
# immediately followed by regex class/quantifier syntax (`github_pat_[A-Za-z0-9_
# -]+`, `(AKIA|ASIA)[A-Z0-9]{16}`), never by a literal credential. Each atom
# below keys on that prefix-plus-quantifier shape, so it fires on the hunting
# pattern and not on a real token that happens to be present. Quoted from the
# sckit/supplychain.local Go worm's embedded secret-hunting regex; the same
# catalog shape recurs in Raccoon/Redline-class stealers.
#
# Secret scanners (trufflehog, gitleaks, detect-secrets) legitimately ship
# these patterns, so the composite excludes recognized detection tooling and
# redaction contexts.
defaults:
  platforms: [unix, windows]
  for: [scripts, binaries]
  attack: T1528
  mbc: E1528

traits:
  - id: gh-token-class-format-scan-regex
    desc: GitHub token class format regex
    crit: notable
    conf: 0.88
    if:
      type: text
      regex: 'gh\[?opusr\]?\s*_\S{0,12}\+'
  - id: gitlab-token-format-scan-regex
    desc: GitLab token format regex
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: 'glpat-\S{0,16}\+'
  - id: pypi-token-format-scan-regex
    desc: PyPI API-token format regex
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: 'pypi-\S{0,16}\+'
  - id: stripe-live-key-format-scan-regex
    desc: Stripe live key format regex
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: 'sk_live_\S{0,16}\+'
composite_rules:
  # Three or more distinct vendors' token formats in one artifact is a
  # secret-hunting catalog, not incidental regex use. Single-vendor patterns
  # appear in validators and docs, so they stay as notable atoms only.
  - id: multi-vendor-token-format-scanner
    desc: Scans content against several vendors' token formats
    crit: suspicious
    conf: 0.92
    needs: 3
    any:
      - id: micro-behaviors/data/format/credentials::aws-access-key-length-pattern
      - id: micro-behaviors/data/format/credentials::github-pat-format-scan-regex
      - id: gh-token-class-format-scan-regex
      - id: gitlab-token-format-scan-regex
      - id: micro-behaviors/data/format/credentials::npm-token-format-scan-regex
      - id: pypi-token-format-scan-regex
      - id: micro-behaviors/data/format/credentials::slack-token-format-scan-regex
      - id: stripe-live-key-format-scan-regex
      - id: micro-behaviors/data/format/credentials::jwt-length-pattern
    unless:
      - id: well-known/tool/detection/security-scanner/
      - id: well-known/tool/detection/redaction::sensitive-data-scanner
      - id: well-known/tool/detection/sast/
      - id: well-known/tool/detection/llm-scanner/
      - id: well-known/tool/detection/securevector/
      - id: objectives/credential-access/api-harvest/catalog::redaction-credentials-marker
      - id: well-known/tool/detection/ai-guardrail/
      - id: well-known/app/ai/coding-agent/
