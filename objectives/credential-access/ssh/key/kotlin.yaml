defaults:
  platforms: [freebsd, unix]
  for: [kotlin, class]
  attack: T1552.004

traits:
  - id: jvm-ssh-known-hosts-string
    desc: SSH known_hosts filename string
    crit: notable
    conf: 0.92
    if:
      type: text
      substr: known_hosts

composite_rules:
  # Single merged collection rule (was two near-duplicate Kotlin-named
  # hostiles, one generic and one class-scoped). "Collects" now requires
  # file-read machinery: bare filename constants in a methodless class husk
  # are strings, not a theft. The hex known_hosts atom was the same bytes
  # as the substr above through a different condition type, so it merged
  # here instead of double-counting one signal.
  - id: jvm-ssh-credential-collection
    desc: JVM code collects SSH credential files
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/fs/path/private-key::jvm-ssh-key-filename-strings
      - id: micro-behaviors/fs/read/file/handle::jvm-file-read-machinery
    any:
      - id: jvm-ssh-known-hosts-string
      - id: micro-behaviors/os/env/ssh::ssh-auth-sock-var
      - id: micro-behaviors/fs/path/public-key::ssh-authorized-keys
    unless:
      - id: well-known/lib/network/jsch/
      - id: well-known/lib/network/sshj/
      - id: well-known/lib/network/trilead-ssh2/
