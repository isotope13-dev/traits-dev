defaults:
  platforms: [freebsd, unix]
  for: [kotlin, class]
  attack: T1552.004

traits:
  # Named for the matcher: SSH key *filename strings* in a JVM artifact. The
  # old "Kotlin reads ... paths" name claimed both a language (these fire on
  # Java classes too) and a read behavior (a bare constant is not a read).
  - id: jvm-ssh-private-key-strings
    desc: SSH private-key filename strings
    crit: suspicious
    conf: 0.92
    if:
      type: text
      # The trailing boundary keeps the trait on SSH key *filenames*. Without
      # it, every ASN.1 algorithm-identifier constant matched: X9's `id_dsa`
      # and `id_dsa_with_sha1`, NIST's `id_ecdsa_with_sha3_256` and the rest
      # of that table. Those are OID names, not a path anyone reads a key from.
      regex: 'id_(rsa|ecdsa|ed25519|dsa)($|[^0-9A-Za-z_])'
    unless:
      # A class with no method references contains no executable code, so its
      # key-filename constants cannot be read by anything in it. Scoped to
      # class files; source findings are unaffected by the out-of-scope leg.
      - id: metadata/file/function::jvm-class-no-code
      # Implementers, not callers: the SSH and crypto libraries whose job is
      # to know these filenames. `well-known/lib/network/jsch/` was already
      # excluded on both composites below but never on this leaf, which is
      # what produced the standalone suspicious finding. Bouncy Castle is here
      # for the bare `id_dsa` its X9 OID table still carries after the
      # boundary fix; JGit's SshConstants is literally the constant list.
      # sshj (net.schmizz.sshj) is the same kind of implementer as JSch: the
      # SSH client JetBrains IDEs and Jenkins plugins ship, carrying default
      # key-file names for authentication rather than collection.
      - id: well-known/lib/network/jsch/
      - id: well-known/lib/network/sshj/
      - id: well-known/lib/network/trilead-ssh2/
      - id: well-known/lib/crypto/jgit/
      - id: well-known/lib/crypto/bouncycastle/
      - type: path
        basename: true
        regex: '^kubectl-.*\.1$'
      # An RPM spec listing the key files a package installs is packaging
      # metadata, not a Kotlin program reading a private key: OpenSSH's
      # contrib/redhat/openssh.spec names id_rsa in its %files section.
      - type: path
        basename: true
        regex: '\.spec$'
      # Generated Markdown/MDX documentation often shows id_rsa examples;
      # extension-mismatched prose must not be treated as Kotlin bytecode or
      # Kotlin source merely because the heuristic language detector sees a
      # Kotlin-like token.
      - type: basename
        regex: '(?i)\.(md|mdx|markdown|mkd|txt|rst|adoc|asciidoc|nix)$'

  - id: jvm-ssh-known-hosts-string
    desc: SSH known_hosts filename string
    crit: notable
    conf: 0.92
    if:
      type: text
      substr: known_hosts

composite_rules:
  # Single merged collection rule (was two near-duplicate Kotlin-named
  # hostiles, one generic and one class-scoped). "Collects" now requires
  # file-read machinery: bare filename constants in a methodless class husk
  # are strings, not a theft. The hex known_hosts atom was the same bytes
  # as the substr above through a different condition type, so it merged
  # here instead of double-counting one signal.
  - id: jvm-ssh-credential-collection
    desc: JVM code collects SSH credential files
    crit: hostile
    conf: 0.98
    all:
      - id: jvm-ssh-private-key-strings
      - id: micro-behaviors/fs/read/file/handle::jvm-file-read-machinery
    any:
      - id: jvm-ssh-known-hosts-string
      - id: micro-behaviors/os/env/ssh::ssh-auth-sock-var
      - id: micro-behaviors/fs/path/public-key::ssh-authorized-keys
    unless:
      - id: well-known/lib/network/jsch/
      - id: well-known/lib/network/sshj/
      - id: well-known/lib/network/trilead-ssh2/
