defaults:
  platforms: [freebsd, unix]
  for: [kotlin, class]
  attack: T1552.004

traits:
  - id: kotlin-ssh-private-key-paths
    desc: Kotlin reads SSH private key paths
    crit: suspicious
    conf: 0.92
    if:
      type: text
      # The trailing boundary keeps the trait on SSH key *filenames*. Without
      # it, every ASN.1 algorithm-identifier constant matched: X9's `id_dsa`
      # and `id_dsa_with_sha1`, NIST's `id_ecdsa_with_sha3_256` and the rest
      # of that table. Those are OID names, not a path anyone reads a key from.
      regex: 'id_(rsa|ecdsa|ed25519|dsa)($|[^0-9A-Za-z_])'
    unless:
      # Implementers, not callers: the SSH and crypto libraries whose job is
      # to know these filenames. `well-known/lib/network/jsch/` was already
      # excluded on both composites below but never on this leaf, which is
      # what produced the standalone suspicious finding. Bouncy Castle is here
      # for the bare `id_dsa` its X9 OID table still carries after the
      # boundary fix; JGit's SshConstants is literally the constant list.
      - id: well-known/lib/network/jsch/
      - id: well-known/lib/crypto/jgit/
      - id: well-known/lib/crypto/bouncycastle/
      - type: path
        basename: true
        regex: '^kubectl-.*\.1$'
      # An RPM spec listing the key files a package installs is packaging
      # metadata, not a Kotlin program reading a private key: OpenSSH's
      # contrib/redhat/openssh.spec names id_rsa in its %files section.
      - type: path
        basename: true
        regex: '\.spec$'
      # Generated Markdown/MDX documentation often shows id_rsa examples;
      # extension-mismatched prose must not be treated as Kotlin bytecode or
      # Kotlin source merely because the heuristic language detector sees a
      # Kotlin-like token.
      - type: basename
        regex: '(?i)\.(md|mdx|markdown|mkd)$'

  - id: kotlin-ssh-known-auth-files
    desc: Kotlin reads SSH known and auth files
    crit: notable
    conf: 0.92
    if:
      type: text
      substr: known_hosts

  - id: kotlin-known-hosts-bytecode
    desc: Kotlin bytecode SSH known hosts path
    crit: notable
    conf: 0.92
    for: [class]
    if:
      type: hex
      pattern: 6B 6E 6F 77 6E 5F 68 6F 73 74 73

composite_rules:
  - id: kotlin-ssh-credential-collection
    desc: Kotlin collects SSH credential files
    crit: hostile
    conf: 0.98
    all:
      - id: kotlin-ssh-private-key-paths
    any:
      - id: kotlin-ssh-known-auth-files
      - id: micro-behaviors/os/env/ssh::ssh-auth-sock-var
      - id: micro-behaviors/fs/path/public-key::ssh-authorized-keys
    unless:
      - id: well-known/lib/network/jsch/

  - id: kotlin-bytecode-ssh-credential-collection
    desc: Kotlin bytecode collects SSH key files
    crit: hostile
    conf: 0.98
    for: [class]
    all:
      - id: kotlin-ssh-private-key-paths
    any:
      - id: kotlin-known-hosts-bytecode
      - id: micro-behaviors/os/env/ssh::ssh-auth-sock-var
    unless:
      - id: well-known/lib/network/jsch/
