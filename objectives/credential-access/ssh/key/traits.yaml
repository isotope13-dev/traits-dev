defaults:
  for: [shell, python, javascript, powershell, c, cpp]
  platforms:
  - linux
  - macos
  - windows
traits:
- id: dot-dot-ssh
  desc: Path traversal to .ssh directory
  crit: suspicious
  conf: 0.5
  attack: T1552.004
  if:
    type: text
    substr: ..ssh/
- id: ln-symlink-ssh-private-key
  desc: Symlinks SSH private key into staging path
  crit: suspicious
  conf: 0.97
  attack: T1552.004
  for: [shell]
  if:
    type: text
    regex: '\bln\s+-s\s+\S{0,80}\.ssh/id_(rsa|dsa|ecdsa|ed25519)'
- id: sshd-net-bracket
  desc: sshd net worker process title
  crit: suspicious
  conf: 0.7
  if:
    type: text
    substr: 'sshd: [net]'
- id: sshd-accepted-bracket
  desc: sshd accepted-connection process title
  crit: suspicious
  conf: 0.7
  if:
    type: text
    substr: 'sshd: [accepted]'
- id: sniff-ssh-lower
  desc: SSH traffic sniffer routine (lowercase)
  crit: suspicious
  conf: 0.85
  if:
    type: text
    substr: sniff_ssh
- id: sniff-ssh-title
  desc: SSH traffic sniffer routine (titlecase)
  crit: suspicious
  conf: 0.85
  if:
    type: text
    substr: Sniff_ssh
- id: sniff-ssh-upper
  desc: SSH traffic sniffer constant (uppercase)
  crit: suspicious
  conf: 0.85
  if:
    type: text
    substr: SNIFF_SSH
- id: ssh-sniff-lower
  desc: SSH traffic sniffer routine (lowercase)
  crit: suspicious
  conf: 0.85
  if:
    type: text
    substr: ssh_sniff
- id: ssh-sniff-title
  desc: SSH traffic sniffer routine (titlecase)
  crit: suspicious
  conf: 0.85
  if:
    type: text
    substr: Ssh_sniff
- id: ssh-sniff-upper
  desc: SSH traffic sniffer constant (uppercase)
  crit: suspicious
  conf: 0.85
  if:
    type: text
    substr: SSH_SNIFF
- id: sshpass-txt-file
  desc: Harvested SSH password drop file
  crit: suspicious
  conf: 0.85
  if:
    type: text
    regex: sshpass\d?\.txt
- id: ssh-pass-log-file
  desc: SSH password capture log file
  crit: suspicious
  conf: 0.85
  if:
    type: text
    substr: ssh_pass.log
- id: password-pattern-1b
  desc: Password-steal or password-dump identifier
  crit: suspicious
  conf: 0.3
  if:
    # Match a code identifier, not prose such as “password-stealing”.
    type: symbol
    kind: identifier
    regex: '^passw(or)?d[_-]?(steal|dump)$'
- id: password-pattern-2
  desc: steal/dump_password identifier
  crit: component
  conf: 0.3
  if:
    type: text
    regex: (steal|dump)[_-]?passw(or)?d
- id: ssh-xor-fixture-ref
  desc: SSH XOR fixture reference
  crit: notable
  conf: 0.8
  if:
    type: text
    substr: stng::xor::classify
- id: ssh-fixture-key-ref
  desc: SSH fixture key reference
  crit: notable
  conf: 0.8
  if:
    type: text
    regex: sshpk-(sign|verify)|eg id_rsa([^A-Za-z0-9_.]|$)
# REMOVED: private-key-path-{rsa,dsa,ecdsa,ed25519} and their private-key-path
# roll-up. Each was a bare `.ssh/id_<type>` path literal -- a sensitive-path
# capability, not an objective -- and duplicated the canonical
# micro-behaviors/fs/path/private-key::ssh-private-key. Consumers reference that.
# Package payloads do not need to name id_rsa or another key file: walking the
# user's .ssh directory and excluding known_hosts/authorized_keys is already a
# precise credential-collection shape. Keep the syntax-specific atoms here so
# exfiltration composites can reuse the technique across package ecosystems.
- id: python-path-home-ssh-walk
  desc: Python walks .ssh after Path.home()
  crit: suspicious
  conf: 0.95
  for: [python]
  attack: T1083,T1552.004
  if:
    type: text
    regex: 'Path\.home\(\)[\s\S]{0,180}["'']\.ssh["''][\s\S]{0,100}(glob|iterdir)\s*\([^)]{0,12}'
    # Globbing only `*.pub` lists public keys (see python-ssh-pubkey-inventory).
  not:
  - regex: glob\s*\(\s*["'']\*\.pub["'']
  unless:
  - id: well-known/app/ai/coding-agent/
    # e2e harnesses inside a recognized product source tree stage test SSH
    # keys; the walk is test setup, not collection.
  - id: well-known/app/infrastructure/datadog-agent::source-context

- id: python-ssh-pubkey-inventory
  desc: Python lists home .ssh public keys
  # Listing `*.pub` names is how a CLI offers identities to pass to ssh; it
  # reads no private key and sends nothing. Mirrors node-ssh-pubkey-inventory.
  crit: notable
  conf: 0.95
  for: [python]
  attack: T1083
  if:
    type: text
    regex: 'Path\.home\(\)[\s\S]{0,180}["'']\.ssh["''][\s\S]{0,100}glob\s*\(\s*["'']\*\.pub["'']'

- id: python-expanduser-ssh-walk
  desc: Python walks an expanded .ssh path
  crit: suspicious
  conf: 0.94
  for: [python]
  attack: T1083,T1552.004
  if:
    type: text
    regex: 'expanduser\s*\(\s*["'']~[/\\]\.ssh["'']\s*\)[\s\S]{0,70}(glob|iterdir)\s*\('

- id: python-expanduser-ssh-list
  desc: Python lists an expanded .ssh path
  crit: suspicious
  conf: 0.94
  for: [python]
  attack: T1083,T1552.004
  unless:
  - id: well-known/tool/sysadmin/multissh::multissh-context
  if:
    type: text
    regex: 'expanduser\s*\(\s*["'']~[/\\]\.ssh["'']\s*\)[\s\S]{0,70}(listdir|scandir)\s*\('

- id: python-os-ssh-list
  desc: Python lists an OS .ssh path
  crit: suspicious
  conf: 0.94
  for: [python]
  attack: T1083,T1552.004
  if:
    type: text
    # The .ssh path has to be an argument of the listing call. A later
    # comment that names ~/.ssh is not a directory listing.
    regex: 'os\.(listdir|scandir)\s*\([^)\n]{0,80}[/\\]\.ssh'

- id: python-expanduser-ssh-path
  desc: Python expands a user's .ssh path
  crit: notable
  conf: 0.9
  for: [python]
  attack: T1552.004
  if:
    type: text
    regex: 'os\.path\.expanduser\s*\(\s*["'']~[/\\]\.ssh["'']\s*\)'

- id: node-ssh-key-read-loop
  desc: Node reads selected SSH key files
  crit: suspicious
  conf: 0.94
  for: [javascript, typescript]
  attack: T1552.004
  if:
    type: text
    regex: 'discoverSSHKeys[\s\S]{0,700}fs\.readFileSync\(keyPath'
composite_rules:
- id: python-ssh-directory-enumeration
  desc: Python enumerates a user's SSH directory
  crit: suspicious
  conf: 0.95
  for: [python]
  attack: T1083,T1552.004
  any:
  - id: python-path-home-ssh-walk
  - id: python-expanduser-ssh-walk
  - id: python-expanduser-ssh-list
  - id: python-os-ssh-list
  - id: python-expanduser-ssh-directory-enumeration
  unless:
  - id: well-known/app/ai/coding-agent/
  - id: well-known/tool/sysadmin/multissh::multissh-context

- id: python-expanduser-ssh-directory-enumeration
  desc: Python enumerates an expanded .ssh directory
  crit: suspicious
  conf: 0.94
  for: [python]
  attack: T1083,T1552.004
  near_bytes: 512
  all:
  - id: python-expanduser-ssh-path
  - id: micro-behaviors/fs/directory/readdir::python-directory-listing
  unless:
  - id: well-known/tool/sysadmin/multissh::multissh-context
- id: node-ssh-pubkey-inventory
  desc: Node inventories home .ssh public keys
  # Listing `*.pub` names is how an ssh front-end picks identities to pass to
  # `ssh -i`; alone it neither reads a key nor sends anything. The hostile
  # reading below pairs it with a hardcoded endpoint and a request.
  crit: notable
  conf: 0.94
  for: [javascript, typescript]
  attack: T1552.004
  all:
  - id: micro-behaviors/fs/enumerate/directory::node-dot-ssh-readdir
  - id: micro-behaviors/data/string/search::node-pub-suffix-check
- id: node-ssh-inventory-hardcoded-ip-exfil
  desc: Node SSH inventory posts to hardcoded IP
  crit: hostile
  conf: 0.98
  for: [javascript, typescript]
  attack: T1552.004,T1041
  all:
  - id: node-ssh-pubkey-inventory
  - id: objectives/command-and-control/infrastructure/ip-port::hardcoded-js-ip-port-endpoint
  - id: micro-behaviors/communications/http/request/client::https-request
- id: password-pattern
  desc: Password pattern reference
  crit: component
  conf: 0.3
  any:
  - id: password-pattern-1b
  - id: password-pattern-2
- id: sniff-ssh-variants
  desc: sniff_ssh case variants
  any:
  - id: sniff-ssh-lower
  - id: sniff-ssh-title
  - id: sniff-ssh-upper
  crit: suspicious
- id: ssh-sniff-variants
  desc: ssh_sniff case variants
  any:
  - id: ssh-sniff-lower
  - id: ssh-sniff-title
  - id: ssh-sniff-upper
  crit: suspicious
- id: ssh-sniffing-indicators
  desc: SSH sniffing function identifiers
  any:
  - id: sniff-ssh-variants
  - id: ssh-sniff-variants
  crit: suspicious
  unless:
  - id: well-known/tool/sysadmin/alpine-packages/package::alpine-ansible-core-package
- id: ssh-password-files
  desc: SSH password file patterns
  crit: component
  any:
  - id: sshpass-txt-file
  - id: ssh-pass-log-file
- id: ssh-key-recognized-marker
  desc: SSH key recognized marker
  crit: component
  conf: 0.85
  any:
  - id: micro-behaviors/os/env/ssh::ssh-private-key-dup
  - id: ssh-xor-fixture-ref
  - id: ssh-fixture-key-ref
  - id: micro-behaviors/fs/write/credential::ssh-deploy-key-provisioning
- id: sshd-net-proc
  desc: SSHD network process reference
  crit: suspicious
  conf: 0.8
  any:
  - id: sshd-net-bracket
  - id: sshd-accepted-bracket
- id: sshd-password-trace
  for: [shell, javascript]
  desc: SSHD memory tracing for passwords
  crit: suspicious
  conf: 0.85
  attack: T1552.004 - linux
  all:
  - id: objectives/anti-analysis/debugger-detect/check::tracerpid-string
  - id: password-pattern
  - id: micro-behaviors/os/service/remote::sshd-ref
- id: python-ssh-harvest-exfil
  desc: Python enumerates .ssh keys and posts data to a remote endpoint
  crit: hostile
  conf: 0.97
  for: [python]
  attack: T1552.004,T1041
  # The key walk and the POST are one routine. In a large module the SSH
  # enumerator and an unrelated HTTP login probe (a POST with deliberately wrong
  # credentials, a request builder) sit thousands of lines apart and describe
  # no exfiltration.
  near_lines: 60
  all:
  - id: python-ssh-directory-enumeration
  any:
  - id: micro-behaviors/communications/http/request/body::http-upload-or-body-sink
  - id: micro-behaviors/communications/http/post::script-post-method-literal
  unless:
  - id: metadata/package/testing/presence/harness::test-directory
- id: credential-theft
  for: [shell, python, javascript, powershell]
  desc: SSH key credential theft
  crit: suspicious
  unless:
  - id: well-known/tool/offensive/pentestkit/
  conf: 0.95
  attack: T1556
  mbc: E1056 - linux
  any:
  - id: ssh-sniffing-indicators
  - id: ssh-password-files
  all:
  - id: micro-behaviors/os/service/remote::sshd-ref
