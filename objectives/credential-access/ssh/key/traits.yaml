defaults:
  for: [shell, python, javascript, powershell, c, cpp]
  platforms:
  - linux
  - macos
  - windows
traits:
- id: slash-dot-ssh
  desc: SSH config or known_hosts path reference
  crit: component
  conf: 0.5
  attack: T1552.004
  if:
    type: text
    regex: /(\.ssh/(config|known_hosts))\b
  unless:
  - id: metadata/package/testing/
  - id: well-known/tool/detection/llm-scanner/
  - id: well-known/lib/runtime/jruby
  downgrade:
    any:
    - id: micro-behaviors/communications/ssh/connect::openssh
    - id: well-known/tool/sysadmin/kubernetes
    - type: text
      regex: '(?i)~?/\.ssh/config'
- id: dot-dot-ssh
  desc: Path traversal to .ssh directory
  crit: suspicious
  conf: 0.5
  attack: T1552.004
  if:
    type: text
    substr: ..ssh/
- id: ssh-deploy-key-provisioning
  desc: CI provisions SSH deploy key from secret
  crit: component
  conf: 0.9
  for: [shell, powershell]
  # `echo "$SSH_DEPLOY_KEY" > ~/.ssh/id_rsa` writes a key supplied by a CI
  # secret INTO the keystore — provisioning, the inverse of theft (theft reads
  # the key OUT and exfiltrates it). Standard pattern in *.github/sync scripts.
  if:
    type: text
    regex: '(echo|printf)\s+"?\$\w*(DEPLOY|SSH)\w*"?\s*>+\s*~?/?\.ssh/id_[a-z0-9]+'
- id: id-rsa
  desc: SSH id_rsa key filename reference
  crit: notable
  conf: 0.6
  attack: T1552.004
  if:
    type: text
    regex: '(\.ssh[/\\]|[/\\])id_rsa$|^id_rsa$'
  downgrade:
    any:
    - id: micro-behaviors/communications/ssh/connect::openssh
    - id: ssh-deploy-key-provisioning
    - id: well-known/tool/detection/ai-guardrail/
    - type: basename
      regex: ^ssh(-.{1,32})?(\.exe)?$
  unless:
    - id: well-known/tool/detection/installtime-audit::installtime-audit-defensive-scanner-context
- id: id-dsa
  desc: SSH id_dsa key filename reference
  crit: notable
  conf: 0.6
  attack: T1552.004
  if:
    type: text
    regex: (\.ssh[/\\]|[/\\])id_dsa$|^id_dsa$
  downgrade:
    any:
    - id: micro-behaviors/communications/ssh/connect::openssh
    - type: basename
      regex: ^ssh(-.{1,32})?(\.exe)?$
  unless:
    - id: well-known/tool/detection/installtime-audit::installtime-audit-defensive-scanner-context
- id: id-ecdsa
  desc: SSH id_ecdsa key filename reference
  crit: notable
  conf: 0.6
  attack: T1552.004
  if:
    type: text
    regex: (\.ssh[/\\]|[/\\])id_ecdsa$|^id_ecdsa$
  downgrade:
    any:
    - id: micro-behaviors/communications/ssh/connect::openssh
    - type: basename
      regex: ^ssh(-.{1,32})?(\.exe)?$
  unless:
    - id: well-known/tool/detection/installtime-audit::installtime-audit-defensive-scanner-context
- id: id-ed25519
  desc: SSH id_ed25519 key filename reference
  crit: notable
  conf: 0.6
  attack: T1552.004
  if:
    type: text
    regex: (\.ssh[/\\]|[/\\])id_ed25519$|^id_ed25519$
  downgrade:
    any:
    - id: micro-behaviors/communications/ssh/connect::openssh
    - type: basename
      regex: ^ssh(-.{1,32})?(\.exe)?$
  unless:
    - id: metadata/lang/source::linux-kernel-secondary-tree-path
    - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-scripts
    - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-extra
    - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-mmfs
    - id: well-known/tool/detection/installtime-audit::installtime-audit-defensive-scanner-context
- id: ln-symlink-ssh-private-key
  desc: Symlinks SSH private key into staging path
  crit: suspicious
  conf: 0.97
  attack: T1552.004
  for: [shell]
  if:
    type: text
    regex: '\bln\s+-s\s+\S{0,80}\.ssh/id_(rsa|dsa|ecdsa|ed25519)'
- id: known-hosts
  desc: SSH .ssh/known_hosts path reference
  crit: component
  conf: 0.5
  attack: T1552.004
  if:
    type: text
    regex: '(?i)\.ssh[/\\]known_hosts\b'
  downgrade:
    any:
    - type: text
      substr: sublime-syntax
    - id: micro-behaviors/communications/ssh/connect::openssh
    - type: basename
      regex: ^ssh(-.{1,32})?(\.exe)?$
- id: sshd-net-bracket
  desc: sshd net worker process title
  crit: suspicious
  conf: 0.7
  if:
    type: text
    substr: 'sshd: [net]'
- id: sshd-accepted-bracket
  desc: sshd accepted-connection process title
  crit: suspicious
  conf: 0.7
  if:
    type: text
    substr: 'sshd: [accepted]'
- id: sshd-proc-ref
  desc: sshd_proc identifier reference
  crit: suspicious
  conf: 0.75
  if:
    type: text
    regex: sshd_?proc
- id: sniff-ssh-lower
  desc: SSH traffic sniffer routine (lowercase)
  crit: suspicious
  conf: 0.85
  if:
    type: text
    substr: sniff_ssh
- id: sniff-ssh-title
  desc: SSH traffic sniffer routine (titlecase)
  crit: suspicious
  conf: 0.85
  if:
    type: text
    substr: Sniff_ssh
- id: sniff-ssh-upper
  desc: SSH traffic sniffer constant (uppercase)
  crit: suspicious
  conf: 0.85
  if:
    type: text
    substr: SNIFF_SSH
- id: ssh-sniff-lower
  desc: SSH traffic sniffer routine (lowercase)
  crit: suspicious
  conf: 0.85
  if:
    type: text
    substr: ssh_sniff
- id: ssh-sniff-title
  desc: SSH traffic sniffer routine (titlecase)
  crit: suspicious
  conf: 0.85
  if:
    type: text
    substr: Ssh_sniff
- id: ssh-sniff-upper
  desc: SSH traffic sniffer constant (uppercase)
  crit: suspicious
  conf: 0.85
  if:
    type: text
    substr: SSH_SNIFF
- id: sshpass-txt-file
  desc: Harvested SSH password drop file
  crit: suspicious
  conf: 0.85
  if:
    type: text
    regex: sshpass\d?\.txt
- id: ssh-pass-log-file
  desc: SSH password capture log file
  crit: suspicious
  conf: 0.85
  if:
    type: text
    substr: ssh_pass.log
- id: password-txt-file
  desc: Plaintext password dump file
  crit: component
  conf: 0.75
  if:
    type: text
    substr: password.txt
- id: credentials-txt-file
  desc: Plaintext credentials dump file
  crit: component
  conf: 0.75
  if:
    type: text
    substr: credentials.txt
- id: password-pattern-1b
  desc: Password-steal or password-dump identifier
  crit: suspicious
  conf: 0.3
  if:
    # Match a code identifier, not prose such as “password-stealing”.
    type: symbol
    kind: identifier
    regex: '^passw(or)?d[_-]?(steal|dump)$'
- id: password-pattern-2
  desc: steal/dump_password identifier
  crit: component
  conf: 0.3
  if:
    type: text
    regex: (steal|dump)[_-]?passw(or)?d
- id: ssh-xor-fixture-ref
  desc: SSH XOR fixture reference
  crit: component
  conf: 0.8
  if:
    type: text
    substr: stng::xor::classify
- id: ssh-fixture-key-ref
  desc: SSH fixture key reference
  crit: component
  conf: 0.8
  if:
    type: text
    regex: sshpk-(sign|verify)|eg id_rsa([^A-Za-z0-9_.]|$)
- id: private-key-path-rsa
  desc: SSH RSA private-key path literal
  crit: component
  conf: 0.6
  unless:
  - id: well-known/tool/detection/security-scanner/
  if:
    type: text
    regex: \.ssh/id_rsa([^A-Za-z0-9_.]|$)
- id: private-key-path-dsa
  desc: SSH DSA private-key path literal
  crit: component
  conf: 0.6
  unless:
  - id: well-known/tool/detection/security-scanner/
  if:
    type: text
    regex: \.ssh/id_dsa([^A-Za-z0-9_.]|$)
- id: private-key-path-ecdsa
  desc: SSH ECDSA private-key path literal
  crit: component
  conf: 0.6
  unless:
  - id: well-known/tool/detection/security-scanner/
  if:
    type: text
    regex: \.ssh/id_ecdsa([^A-Za-z0-9_.]|$)
- id: private-key-path-ed25519
  desc: SSH Ed25519 private-key path literal
  crit: component
  conf: 0.6
  unless:
  - id: metadata/package/testing/
  - id: metadata/lang/source::linux-kernel-secondary-tree-path
  - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-scripts
  - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-extra
  - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-mmfs
  - id: well-known/tool/detection/security-scanner/
  if:
    type: text
    regex: \.ssh/id_ed25519([^A-Za-z0-9_.]|$)

# Package payloads do not need to name id_rsa or another key file: walking the
# user's .ssh directory and excluding known_hosts/authorized_keys is already a
# precise credential-collection shape. Keep the syntax-specific atoms here so
# exfiltration composites can reuse the technique across package ecosystems.
- id: python-path-home-ssh-walk
  desc: Python walks .ssh after Path.home()
  crit: suspicious
  conf: 0.95
  for: [python]
  attack: T1083,T1552.004
  if:
    type: text
    regex: 'Path\.home\(\)[\s\S]{0,180}["'']\.ssh["''][\s\S]{0,100}(glob|iterdir)\s*\('
  unless:
    - id: metadata/package/testing/presence/harness::test-directory

- id: python-expanduser-ssh-walk
  desc: Python walks an expanded .ssh path
  crit: suspicious
  conf: 0.94
  for: [python]
  attack: T1083,T1552.004
  if:
    type: text
    regex: 'expanduser\s*\(\s*["'']~[/\\]\.ssh["'']\s*\)[\s\S]{0,70}(glob|iterdir)\s*\('

- id: python-expanduser-ssh-list
  desc: Python lists an expanded .ssh path
  crit: suspicious
  conf: 0.94
  for: [python]
  attack: T1083,T1552.004
  if:
    type: text
    regex: 'expanduser\s*\(\s*["'']~[/\\]\.ssh["'']\s*\)[\s\S]{0,70}(listdir|scandir)\s*\('

- id: python-os-ssh-list
  desc: Python lists an OS .ssh path
  crit: suspicious
  conf: 0.94
  for: [python]
  attack: T1083,T1552.004
  if:
    type: text
    regex: 'os\.(listdir|scandir)\s*\(.{0,80}[/\\]\.ssh'

- id: python-expanduser-ssh-path
  desc: Python expands a user's .ssh path
  crit: component
  conf: 0.9
  for: [python]
  attack: T1552.004
  if:
    type: text
    regex: 'os\.path\.expanduser\s*\(\s*["'']~[/\\]\.ssh["'']\s*\)'

- id: node-ssh-key-read-loop
  desc: Node reads selected SSH key files
  crit: suspicious
  conf: 0.94
  for: [javascript, typescript]
  attack: T1552.004
  if:
    type: text
    regex: 'discoverSSHKeys[\s\S]{0,700}fs\.readFileSync\(keyPath'
composite_rules:
- id: python-ssh-directory-enumeration
  desc: Python enumerates a user's SSH directory
  crit: suspicious
  conf: 0.95
  for: [python]
  attack: T1083,T1552.004
  any:
    - id: python-path-home-ssh-walk
    - id: python-expanduser-ssh-walk
    - id: python-expanduser-ssh-list
    - id: python-os-ssh-list
    - id: python-expanduser-ssh-directory-enumeration
  unless:
    - id: metadata/package/testing/presence/harness::test-directory

- id: python-expanduser-ssh-directory-enumeration
  desc: Python enumerates an expanded .ssh directory
  crit: suspicious
  conf: 0.94
  for: [python]
  attack: T1083,T1552.004
  near_bytes: 512
  all:
    - id: python-expanduser-ssh-path
    - id: micro-behaviors/fs/enumerate/directory::python-directory-listing
- id: node-ssh-pubkey-inventory
  desc: Node inventories home .ssh public keys
  crit: suspicious
  conf: 0.94
  for: [javascript, typescript]
  attack: T1552.004
  all:
    - id: micro-behaviors/fs/enumerate/directory::node-dot-ssh-readdir
    - id: micro-behaviors/data/string/search::node-pub-suffix-check
- id: node-ssh-inventory-hardcoded-ip-exfil
  desc: Node SSH inventory posts to hardcoded IP
  crit: hostile
  conf: 0.98
  for: [javascript, typescript]
  attack: T1552.004,T1041
  all:
    - id: node-ssh-pubkey-inventory
    - id: objectives/command-and-control/infrastructure/ip-port::hardcoded-js-ip-port-endpoint
    - id: micro-behaviors/communications/http/request/client::https-request
- id: password-pattern
  desc: Password pattern reference
  crit: component
  conf: 0.3
  any:
  - id: password-pattern-1b
  - id: password-pattern-2
- id: sniff-ssh-variants
  desc: sniff_ssh case variants
  any:
  - id: sniff-ssh-lower
  - id: sniff-ssh-title
  - id: sniff-ssh-upper
  crit: suspicious
- id: ssh-sniff-variants
  desc: ssh_sniff case variants
  any:
  - id: ssh-sniff-lower
  - id: ssh-sniff-title
  - id: ssh-sniff-upper
  crit: suspicious
- id: ssh-sniffing-indicators
  desc: SSH sniffing function identifiers
  any:
  - id: sniff-ssh-variants
  - id: ssh-sniff-variants
  crit: suspicious
  unless:
  - id: well-known/tool/sysadmin/alpine-packages::alpine-ansible-core-package
- id: ssh-password-files
  desc: SSH password file patterns
  crit: component
  any:
  - id: sshpass-txt-file
  - id: ssh-pass-log-file
  - id: password-txt-file
  - id: credentials-txt-file
- id: ssh-key-recognized-marker
  desc: SSH key recognized marker
  crit: component
  conf: 0.85
  any:
  - id: micro-behaviors/os/env/vars/credentials::ssh-private-key-dup
  - id: ssh-xor-fixture-ref
  - id: ssh-fixture-key-ref
  - id: ssh-deploy-key-provisioning
- id: private-key-path
  desc: SSH private-key path literal set
  crit: component
  conf: 0.6
  any:
  - id: private-key-path-rsa
  - id: private-key-path-dsa
  - id: private-key-path-ecdsa
  - id: private-key-path-ed25519
  unless:
  - id: well-known/tool/detection/llm-scanner/
- id: private-key-material
  desc: SSH private key material paths
  crit: component
  conf: 0.7
  attack: T1552.004
  any:
  - id: id-rsa
  - id: id-dsa
  - id: id-ecdsa
  - id: id-ed25519
- id: sshd-net-proc
  desc: SSHD network process reference
  crit: suspicious
  conf: 0.8
  any:
  - id: sshd-net-bracket
  - id: sshd-accepted-bracket
- id: private-key-theft
  desc: SSH private key theft
  # Notable, not suspicious. The legs below prove only that a file *names* a
  # private-key path and one of the standard key filenames -- there is no read,
  # copy or send in the rule, so it cannot distinguish theft from an SSH client,
  # a backup script, or a security benchmark that documents the paths. It was
  # previously held down by an `unless:` naming its own directory, which its own
  # `any:` legs satisfied, so the over-pitch never showed. The exfiltration
  # composites that pair a key path with a transport carry the conviction.
  crit: notable
  conf: 0.85
  attack: T1552.004
  mbc: E1552
  all:
  - id: private-key-path
  any:
  - id: id-rsa
  - id: id-dsa
  - id: id-ecdsa
  - id: id-ed25519
  unless:
  # Was this rule's own directory, which its own `any:` legs satisfied, so the
  # rule never fired. The recognized-marker component is the carve-out meant.
  - id: ssh-key-recognized-marker
  downgrade:
    any:
    - id: metadata/signed/platform::apple
    - id: micro-behaviors/communications/ssh/client/
    - id: micro-behaviors/process/interpreter/vm/
    - id: micro-behaviors/os/service/remote::sshd-ref
- id: sshd-password-trace
  desc: SSHD memory tracing for passwords
  crit: suspicious
  conf: 0.85
  attack: T1552.004 - linux
  all:
  - id: objectives/anti-analysis/debugger-detect/check::tracerpid-string
  - id: password-pattern
  - id: micro-behaviors/os/service/remote::sshd-ref
- id: credential-theft
  desc: SSH key credential theft
  crit: suspicious
  unless:
    - id: well-known/tool/offensive/pentestkit/
  conf: 0.95
  attack: T1556
  mbc: E1056 - linux
  any:
  - id: ssh-sniffing-indicators
  - id: ssh-password-files
  all:
  - id: micro-behaviors/os/service/remote::sshd-ref
