defaults:
  for: [python]
  platforms: [windows, unix]
composite_rules:
  - id: python-silent-ssh-key-and-history-collection
    desc: Silently collects SSH key and shell history
    crit: hostile
    conf: 0.98
    attack: T1552.004,T1552.003
    near_lines: 60
    all:
      - id: micro-behaviors/fs/read/file/private-key::python-ssh-private-key-read-accumulate
      - id: micro-behaviors/fs/read/file/history::python-shell-history-read-accumulate
      - id: micro-behaviors/process/stdio/configure::python-both-streams-devnull
      - id: micro-behaviors/data/control-flow/module-exec::module-level-side-effect-call
