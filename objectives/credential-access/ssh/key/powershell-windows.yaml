defaults:
  platforms: [windows]
  for: [powershell]
  attack: T1552.004
  mbc: B0028

composite_rules:
  - id: powershell-ssh-private-key-harvest
    desc: PowerShell SSH key harvest
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/fs/path/secret-config::powershell-userprofile-ssh-dir
      - id: micro-behaviors/fs/path/private-key::powershell-ssh-key-name-set
      - id: micro-behaviors/fs/read/file/full::get-content
