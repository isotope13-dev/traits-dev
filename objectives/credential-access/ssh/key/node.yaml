defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  attack: T1552.004

composite_rules:
  - id: node-ssh-key-path-and-file-read
    desc: Node reads files and references SSH key paths
    crit: notable
    conf: 0.9
    all:
      - id: micro-behaviors/fs/path/credential/ssh::js-ssh-homedir-path
      - id: micro-behaviors/fs/read/file/content/whole::read-node
      - id: micro-behaviors/fs/path/credential/private-key::ssh-private-key-filename-enum
