defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  attack: T1552.004

composite_rules:
  - id: node-ssh-key-file-harvest
    desc: Node harvests SSH private keys from user home
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/fs/path/secret-config::js-ssh-homedir-path
      - id: micro-behaviors/fs/read/file/content/unspecified::read-node
      - id: micro-behaviors/fs/path/private-key::ssh-private-key-filename-enum
