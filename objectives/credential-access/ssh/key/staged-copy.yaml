defaults:
  platforms: [unix]
  for: [shell, applescript, javascript, typescript]

traits:
  - id: ssh-directory-copy-to-tmp
    desc: Copies SSH directory into /tmp
    crit: suspicious
    conf: 0.94
    attack: T1552.004
    if:
      type: text
      regex: '\bcp\s+-[A-Za-z]*[Rr][A-Za-z]*\s+(~|\$HOME)/\.ssh/?\s+/tmp/'
