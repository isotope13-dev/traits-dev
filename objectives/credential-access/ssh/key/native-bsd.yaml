defaults:
  platforms: [freebsd, netbsd, unix]
  for: [c, cpp, objc, elf]
  attack: T1552.004

traits:
  - id: native-dotssh-private-key-path
    desc: Native .ssh private key path
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '\.ssh[/\\]id_(rsa|ed25519)$'

  - id: native-private-key-path-name
    desc: Native private key path name
    crit: notable
    conf: 0.88
    if:
      type: text
      regex: '[/\\]id_(rsa|ed25519)$'

  - id: native-private-key-basename
    desc: Native private key basename
    crit: notable
    conf: 0.86
    if:
      type: text
      regex: '^id_(rsa|ed25519)$'

composite_rules:
  # Notable, not suspicious -- the tier all three legs already carry. Naming a
  # key path is not reading one, and the binaries that name it hardest are the
  # SSH implementations: vagrant's bundled libcurl.so carries ~/.ssh/id_rsa as
  # curl's default SCP/SFTP key, and rancher-tiller links an SSH client. The
  # three consumers all pair this with stealer or exfil behaviour, which is
  # where the credential-access claim belongs.
  - id: native-ssh-private-key-paths
    desc: Native SSH private key paths
    crit: notable
    conf: 0.92
    any:
      - id: native-dotssh-private-key-path
      - id: native-private-key-path-name
      - id: native-private-key-basename
    downgrade:
      any:
        - id: micro-behaviors/communications/ssh/connect::openssh
        - type: basename
          regex: ^ssh(-.{1,32})?$
