defaults:
  platforms: [unix]
  for: [php]
  attack: T1552.004

traits:
  - id: php-read-ssh-path
    desc: PHP read call references .ssh
    crit: component
    conf: 0.9
    if:
      type: text
      regex: '(?i)\b(file_get_contents|readfile|fopen|file)\s*\([^)]{0,80}\.ssh[/\\]'

  - id: php-private-key-name
    desc: SSH private-key basename
    crit: component
    conf: 0.9
    if:
      type: text
      regex: 'id_(rsa|dsa|ecdsa|ed25519)(["'')\s]|$)'

composite_rules:
  - id: php-ssh-private-key-read-path
    desc: PHP read call targets SSH private key
    crit: suspicious
    conf: 0.97
    near_lines: 40
    all:
      - id: php-read-ssh-path
      - id: php-private-key-name

  - id: php-ssh-key-harvesting
    desc: PHP reads an SSH private key from disk
    crit: hostile
    conf: 0.98
    near_lines: 40
    all:
      - id: php-ssh-private-key-read-path
      - id: micro-behaviors/fs/read/file::file-get-contents
