# Python reads the SSH private key and the shell history file into memory. This
# is acquisition: nothing here sends the data anywhere, so it lives with
# credential-access rather than exfiltration. The silent, import-time collector
# is the hostile composite in python-silent-key-history.yaml. Suppress this
# weaker reading when that composite already explains the same file.
defaults:
  platforms: [unix]
  for: [python]
  attack: T1552.004,T1005

composite_rules:
  - id: python-ssh-key-and-history-collection
    desc: Python reads SSH private key and shell history
    crit: suspicious
    conf: 0.9
    all:
      - id: micro-behaviors/fs/read/file/private-key::python-ssh-private-key-read-accumulate
      - id: micro-behaviors/fs/read/file/history::python-shell-history-read-accumulate
    unless:
      - id: objectives/credential-access/ssh/key::python-silent-ssh-key-and-history-collection
