defaults:
  platforms: [unix]
  for: [javascript, typescript]
  attack: T1041

traits:
  - id: node-ssh-private-key-command
    desc: Node shell command reads SSH key
    crit: suspicious
    conf: 0.94
    if:
      type: symbol
      kind: call
      regex: '(^|\.)((exec|spawn)(File)?(Sync)?)$'
      arg:
        kind: string
        regex: '(?i)\\.ssh[/\\\\]id_(rsa|dsa|ecdsa|ed25519)\\b'
