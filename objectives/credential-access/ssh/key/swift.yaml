defaults:
  platforms: [android, unix, windows]
  for: [swift]
  attack: T1552.004

traits:
  - id: swift-ssh-hostkey-disabled
    desc: Swift SSH hostkey disabled
    crit: suspicious
    conf: 0.93
    if:
      type: text
      substr: "StrictHostKeyChecking=no"

  - id: swift-ssh-dir-enumeration
    desc: Swift SSH directory enumeration
    crit: suspicious
    conf: 0.9
    if:
      type: text
      regex: '\.ssh[\s\S]{0,220}contentsOfDirectory'

composite_rules:
  # swift-ssh-key-harvest (hostile) was removed: its required evidence was
  # `StrictHostKeyChecking=no` plus any `~/.ssh` key-filename token, with no
  # proximity bound and no key access. An SSH client that documents
  # `--identity ~/.ssh/id_ed25519` in help text and separately opts out of
  # host-key checking for ephemeral gateways (manaflow-ai/cmux CLI) fired it.
  # Reading a key filename token proves no collection; actual harvest coverage
  # remains in swift-ssh-key-file-harvest below, which requires directory
  # enumeration plus a file read.
  - id: swift-ssh-key-file-harvest
    desc: Swift SSH key file harvest
    crit: hostile
    conf: 0.98
    all:
      - id: swift-ssh-dir-enumeration
      - id: micro-behaviors/fs/read/file/full::swift-data-file-read
    needs: 2
    any:
      - id: objectives/credential-access/ssh/path
