# Local credential collection, not exfiltration: no network sender is required.
# Read, redirect and destination must occur in the postinstall value itself.
# Merely naming a key beside an unrelated /tmp path does not establish a read.
defaults:
  platforms: [unix]
  for: [package.json]
  attack: T1552.004

traits:
  - id: postinstall-private-key-tmp-redirect
    desc: Postinstall redirects SSH private key into /tmp
    crit: suspicious
    conf: 0.97
    if:
      type: value
      path: scripts.postinstall
      regex: '(^|[;&|])\s*cat\s+\S{1,40}/\.ssh/id_(rsa|ed25519|ecdsa)\s*>+\s*/tmp/'

composite_rules:
  - id: postinstall-ssh-private-key-staging
    desc: Install hook stages SSH private-key contents
    crit: hostile
    conf: 0.97
    all:
      - id: metadata/package/scripts/lifecycle::postinstall-hook-declaration
      - id: postinstall-private-key-tmp-redirect

  - id: postinstall-ssh-private-key-fallback-harvest
    desc: Install hook stages keys with fallback reads
    crit: hostile
    conf: 0.97
    all:
      - id: postinstall-ssh-private-key-staging
      - id: micro-behaviors/fs/read/file/target::postinstall-ssh-private-key-fallback-read
