defaults:
  platforms: [unix]
  for: [package.json]
composite_rules:
  - id: npm-install-hook-prints-private-key
    desc: npm install hook prints SSH private key
    crit: hostile
    conf: 0.98
    attack: T1552.004
    all:
      - id: metadata/filename/identity::package-json-basename
    any:
      - id: micro-behaviors/fs/read/file/target::preinstall-cat-ssh-private-key
      - id: micro-behaviors/fs/read/file/target::install-cat-ssh-private-key
      - id: micro-behaviors/fs/read/file/target::postinstall-cat-ssh-private-key
