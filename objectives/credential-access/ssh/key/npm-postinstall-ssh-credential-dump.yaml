defaults:
  platforms: [unix, windows]
  for: [package.json]
composite_rules:
- id: postinstall-ssh-credential-dump
  desc: postinstall dumps SSH credential files
  crit: hostile
  conf: 0.99
  attack: "T1552.004"
  mbc: "E1552"
  all:
  - id: metadata/package/scripts/lifecycle::filtered-postinstall-hook
  - id: micro-behaviors/fs/read/file/credential::postinstall-ssh-key-dump-pipeline
  any:
  - id: micro-behaviors/fs/path/config/ssh::ssh-directory-slash-reference
  - id: micro-behaviors/fs/search/sensitive-file::postinstall-find-dot-ssh
  - id: micro-behaviors/fs/read/file/target::postinstall-xargs-cat
