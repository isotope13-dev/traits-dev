defaults:
  platforms: [linux]
  for: [shell]
traits:
  - id: shell-private-key-type-search
    desc: Searches SSH trees for private-key file types
    crit: suspicious
    conf: 0.98
    attack: T1552.004
    if:
      type: text
      regex: 'file [^\n]{1,100}/\.ssh/\*\*[^\n]{0,60}OpenSSH private key'
