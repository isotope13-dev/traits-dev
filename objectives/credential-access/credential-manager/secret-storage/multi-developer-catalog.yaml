# Credential acquisition objectives; path catalogs live in fs/path/credential.
defaults:
  platforms: [unix, windows]
  for: [scripts, source, binaries]
  attack: T1552.001
  mbc: E1552

composite_rules:
  # Require both a home-scoped store reference and nearby file-input evidence;
  # a list of credential paths alone also appears in defensive exclusions.
  - id: cross-ecosystem-developer-credential-theft-catalog
    desc: Home credential paths and file-input sweep
    crit: hostile
    conf: 0.96
    # A node:test unit file lists the credential store paths as guard test
    # cases. The sweep stays visible as suspicious rather than hostile.
    downgrade:
      any:
        - id: metadata/package/testing/harness/unit::javascript-node-test-unit-test-context
    all:
      - id: micro-behaviors/fs/path/credential/collection::home-joined-credential-store-path
      - id: micro-behaviors/fs/read/file/target::credential-path-near-file-input
    needs: 5
    any:
      - id: micro-behaviors/fs/path/credential/registry::npmrc-path-literal
      - id: micro-behaviors/fs/path/credential/registry::pypirc-credentials-file
      - id: micro-behaviors/fs/path/credential/registry::netrc
      - id: micro-behaviors/fs/path/credential/vcs::git-credentials
      - id: micro-behaviors/fs/path/credential/private-key::ssh-private-key-filename-enum
      - id: micro-behaviors/fs/path/credential/application::vault-token-file
      - id: micro-behaviors/os/security/auth/secret::vault-authentication-source-reference
