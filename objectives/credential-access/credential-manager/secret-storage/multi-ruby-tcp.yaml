defaults:
  for:
    - ruby
  platforms:
    - unix
    - windows

traits:
  - id: ruby-host-and-secret-targets
    desc: Ruby hostname and account/SSH target references
    crit: suspicious
    conf: 0.92
    if:
      type: text
      regex: 'Socket\.gethostname[\s\S]{0,800}/etc/passwd[\s\S]{0,800}/etc/shadow[\s\S]{0,800}\.ssh/\*'
