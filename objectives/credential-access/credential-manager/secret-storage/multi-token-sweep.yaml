# Co-occurrence alone does not establish that traversal scans the stores;
# security scanners and secret-redaction tools also carry these patterns.
defaults:
  platforms: [unix, windows]
  for: [elf, macho, pe]
  attack: T1552.001,T1552.004

composite_rules:
  - id: developer-store-token-sweep
    desc: File traversal and developer credential token patterns
    crit: notable
    conf: 0.9
    all:
      - id: micro-behaviors/data/format/credentials::multi-vendor-token-format-catalog
      - id: metadata/lang/source/naming/function/file::filepath-walk-pclntab
    any:
      - id: micro-behaviors/fs/path/credential/vcs::git-credentials
      - id: micro-behaviors/fs/path/credential/application::vault-token-file
      - id: micro-behaviors/fs/path/credential/private-key::ssh-private-key-filename-enum
      - id: micro-behaviors/fs/path/credential/registry::package-manager-or-netrc-config-path
    needs: 3
    unless:
      - id: micro-behaviors/os/security/scan/documentation/
      - id: micro-behaviors/data/string/redact/
