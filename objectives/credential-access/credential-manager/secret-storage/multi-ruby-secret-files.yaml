defaults:
  for:
    - ruby
  platforms:
    - unix
    - windows
traits:
  - id: ruby-base64-encoded-read
    desc: Base64-encodes a file it read
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?s)File\.read\([^)\n]{0,60}\).{0,300}Base64\.strict_encode64\b'
  - id: ruby-shadow-file-literal
    desc: Names the system shadow file
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '[''"]/etc/(shadow|master\.passwd)[''"]'
  - id: ruby-user-secret-glob
    desc: Globs user secret files
    crit: suspicious
    conf: 0.92
    if:
      type: text
      regex: '~/\.ssh/id_[A-Za-z0-9_-]{0,20}\*|~/\.aws/\*|gcloud/credentials\.db'

composite_rules:
  - id: ruby-encoded-credential-file-read
    desc: Encodes credential files it reads
    crit: hostile
    conf: 0.96
    attack: T1552.001
    near_lines: 40
    all:
      - id: ruby-base64-encoded-read
      - id: objectives/supply-chain/install-hook/package/rubygems::credential-path-access
  - id: ruby-shadow-and-key-read
    desc: Reads shadow and user secret files
    crit: hostile
    conf: 0.96
    attack: T1552.001
    near_lines: 30
    all:
      - id: ruby-shadow-file-literal
      - id: ruby-user-secret-glob
