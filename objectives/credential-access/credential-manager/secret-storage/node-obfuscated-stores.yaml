defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
composite_rules:
  # Account-store locations, a Python command, file-writing API references
  # and a runtime obfuscator jointly distinguish a concealed collector from
  # an encoded configuration or a general encoding/network helper.
  - id: obfuscated-browser-wallet-python-payload
    desc: Obfuscated browser and wallet store targets
    crit: hostile
    conf: 0.97
    attack: T1555.003,T1005,T1059.006
    all:
      - id: micro-behaviors/fs/path/secret-store::chromium-login-data-path-fragment
      - id: micro-behaviors/fs/path/secret-store::exodus-wallet-path-fragment
      - id: metadata/lang/source/literal/fragment::python-three-command-string
      - id: metadata/lang/source/literal/fragment::write-file-sync-string-prefix
    any:
      - id: objectives/anti-static/obfuscation/obfuscator/js-obfuscator::javascript-obfuscator-string-array-runtime
      - id: objectives/anti-static/obfuscation/obfuscator/js-obfuscator::plain-javascript-obfuscator-string-array-runtime
