composite_rules:
- crit: hostile
  platforms:
  - unix
  - windows
  for:
  - javascript
  id: obfuscated-multi-source-credential-harvester
  desc: Obfuscated script harvests multi-provider and saved credentials
  conf: 0.96
  attack: T1555.003,T1552.001
  all:
  - id: objectives/anti-static/obfuscation/obfuscator/js-obfuscator::javascript-obfuscator-string-array-runtime
  - id: micro-behaviors/data/format/credentials::multi-provider-token-format-scan
  - id: micro-behaviors/data/format/credentials::token-patterns-with-input-access
  - id: micro-behaviors/fs/read/file/full::file-content-read-operation
  - id: metadata/file/catalog/service::bitwarden-name-string
  - id: "metadata/lang/source/syntax/key-value::password-field-name"
  unless:
  - id: well-known/tool/detection/
  - id: metadata/package/testing/harness/runtime/
