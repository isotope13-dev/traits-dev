defaults:
  platforms: [unix, windows]
  for: [rust]
  attack: T1552.001,T1195.002,T1041
  mbc: E1041

composite_rules:
  - id: cargo-build-hook-developer-credential-harvest-upload
    desc: Cargo build hook collects developer credentials and uploads the snapshot
    crit: hostile
    conf: 0.98
    scope: file
    near_bytes: 8192
    all:
      - id: micro-behaviors/fs/path/credential::developer-credential-filename-catalog
      - id: micro-behaviors/fs/read/file/content/unspecified::rust-read-to-string
      - id: micro-behaviors/os/security/credential-manager::git-credential-helper-invocation
      - id: objectives/exfiltration/http/env::rust-build-script-env-curl-exfil
