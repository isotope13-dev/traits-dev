defaults:
  for: [python]
  platforms: [unix]
composite_rules:
  - id: python-multi-store-credential-read-commands
    desc: Passes multi-store credential read commands
    crit: suspicious
    conf: 0.97
    attack: T1552.001
    # Three distinct credential sources, not three spellings of one source.
    # This does not claim exfiltration or bind unrelated values to a sink.
    all:
      - id: micro-behaviors/fs/read/file/target::python-git-credential-read-command
      - id: micro-behaviors/fs/read/file/target::python-aws-credential-read-command
      - id: micro-behaviors/fs/read/file/target::python-pgpass-read-command
