defaults:
  platforms: [unix, windows]
  for: [python]
  attack: T1552.001
  mbc: E1552

traits:
- id: vault-url-source
  desc: HashiCorp Vault URL source reference
  crit: notable
  conf: 0.9
  if:
    type: string_literal
    exact: VAULT_URL
composite_rules:
- id: vault-cli-print-token-command
  desc: HashiCorp Vault CLI token print command
  crit: notable
  conf: 0.9
  all:
  - id: micro-behaviors/process/argument/positional::vault-command-argv
  - id: micro-behaviors/process/argument/subcommand::cli-verb-print
  - id: micro-behaviors/process/argument/subcommand::cli-verb-token
  near_lines: 8
  # Reading VAULT_TOKEN + VAULT_URL together is just Vault client bootstrap --
  # HashiCorp's own CLI and every Vault SDK read exactly this pair, because
  # you need both to open a connection. Apache Arrow's own documented
  # sample_vault_kms_client.py (a Parquet encryption KMS example) does this to
  # build its OWN client, with no exfiltration in sight. The two atoms below
  # are independently notable identity facts; co-occurrence alone doesn't
  # add intent -- real suspicion needs the token to leave via a leg like
  # vault-env-http-exfiltration, which requires actual network egress of the
  # value on top of this atom.
- id: vault-env-targeting
  desc: Targets Vault env token and URL
  crit: notable
  conf: 0.95
  all:
  - id: micro-behaviors/os/security/auth/secret::vault-authentication-source-reference
  - id: vault-url-source
  near_lines: 12
- id: python-vault-kv-secret-sweep
  desc: Python walks HashiCorp Vault KV secrets
  crit: hostile
  conf: 0.975
  # sys/mounts plus an HTTP client is client bootstrap and restore. Walking
  # the KV tree uses Vault's list=true query. A restore that only writes
  # secrets back does not.
  all:
  - id: micro-behaviors/communications/http/token-auth::vault-token-header
  - id: micro-behaviors/communications/http/services/hashicorp::vault-sys-mounts-api
  - id: micro-behaviors/os/security/auth/secret::vault-authentication-source-reference
  - id: micro-behaviors/communications/http/services/hashicorp::vault-kv-list-parameter
  any:
  - id: micro-behaviors/communications/http/services/hashicorp::vault-kv-data-api
  - id: vault-cli-print-token-command
  - id: micro-behaviors/communications/http/lib/urllib::urllib-request-object
  near_lines: 160
  unless:
  # A backup pipeline, not theft: the swept KV tree is serialized to a
  # staging file, encrypted (openssl AES + PBKDF2 pass), and the encrypted
  # archive uploaded to the operator's S3 — the sweep output never leaves
  # in cleartext and the destination is infrastructure-managed storage.
  - id: python-vault-kv-sweep-encrypted-s3-backup

# Vault KV sweep staged to an encrypted org-S3 backup: the same file that
# enumerates the KV tree also encrypts the staging copy (PBKDF2-derived
# pass) and assembles an `aws s3 cp` upload of the ciphertext. Encryption
# before egress to infrastructure-managed storage is the operator-consent
# tell that separates a backup tool from a secret harvester.
- id: python-vault-kv-sweep-encrypted-s3-backup
  desc: Vault KV sweep staged to encrypted org-S3 backup
  crit: exception
  conf: 0.95
  all:
  - id: micro-behaviors/communications/http/services/hashicorp::vault-sys-mounts-api
  - id: micro-behaviors/crypto/kdf/algorithm::pbkdf2
  - id: micro-behaviors/communications/http/services/aws-s3::aws-cli-s3-copy-command-list
