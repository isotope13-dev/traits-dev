defaults:
  platforms: [unix, windows]
  for: [python]
  attack: T1552.001
  mbc: E1552

traits:
- id: vault-token-header
  desc: HashiCorp Vault token header
  crit: notable
  conf: 0.9
  if:
    type: string_literal
    exact: X-Vault-Token
- id: vault-token-sources
  desc: HashiCorp Vault token source references
  crit: notable
  conf: 0.88
  if:
    type: string_literal
    regex: 'VAULT_(TOKEN|ROLE_ID|SECRET_ID)|\.vault-token'
- id: vault-url-source
  desc: HashiCorp Vault URL source reference
  crit: notable
  conf: 0.9
  if:
    type: string_literal
    exact: VAULT_URL
# `vault` names the specific credential tool, so it stays here as the anchor;
# the generic "print"/"token" subcommand tokens live in the neutral
# micro-behaviors/process/argument/subcommand tier (referenced below) so a bare
# "print"/"token" literal never registers as a credential-access finding.
- id: vault-cli-print-token
  desc: HashiCorp Vault CLI name
  crit: component
  conf: 0.84
  if:
    type: string_literal
    exact: vault

composite_rules:
- id: vault-cli-print-token-command
  desc: HashiCorp Vault CLI token print command
  crit: notable
  conf: 0.9
  all:
  - id: vault-cli-print-token
  - id: micro-behaviors/process/argument/subcommand::cli-verb-print
  - id: micro-behaviors/process/argument/subcommand::cli-verb-token
  near_lines: 8
- id: vault-env-targeting
  desc: Targets Vault env token and URL
  crit: suspicious
  conf: 0.95
  all:
  - id: vault-token-sources
  - id: vault-url-source
  near_lines: 12
- id: python-vault-kv-secret-sweep
  desc: Python walks HashiCorp Vault KV secrets
  crit: hostile
  conf: 0.975
  all:
  - id: vault-token-header
  - id: micro-behaviors/communications/http/services/hashicorp::vault-sys-mounts-api
  - id: vault-token-sources
  any:
  - id: micro-behaviors/communications/http/services/hashicorp::vault-kv-data-api
  - id: vault-cli-print-token-command
  - id: micro-behaviors/communications/http/lib/urllib::urllib-request-object
  near_lines: 160
