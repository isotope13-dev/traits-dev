# In the reviewed CIL, a LocalApplicationData/Microsoft/Credentials directory
# is enumerated and its files copied. The matcher records file-scoped clues;
# it does not bind the Copy call to a path or imply decrypted passwords.
defaults:
  platforms: [windows]
  for: [pe, dll]

composite_rules:
  - id: managed-keylogger-credential-directory-copy-references
    desc: Keylogger with credential-directory, enumeration and copy references
    crit: hostile
    conf: 0.95
    attack: T1555.004
    all:
      - id: objectives/collection/keylog/hook::dotnet-hook-keylog-recording
      - id: micro-behaviors/fs/path/password-store::managed-microsoft-credentials-path-components
      - id: metadata/binary/symbols/name::dotnet-getfiles-method-name
      - id: metadata/binary/symbols/name::copy-member-name
