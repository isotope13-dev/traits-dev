defaults:
  platforms: [unix, windows]
  for: [python, whl, python-sdist, zip]
  crit: hostile
  conf: 0.99
  attack: T1552.001,T1087,T1041

composite_rules:
  - id: notebook-secret-error-identity-exfil
    desc: Secret-store error yields exfiltrated visitor identity
    scope: archive
    all:
      - id: platform-secrets-token-replay
      - id: micro-behaviors/data/parse/regex::error-response-number-to-visitor-id
      - id: objectives/discovery/system/fingerprint/notebook::notebook-hosted-execution-gate
      - id: objectives/exfiltration/stealer/system-info::python-tracking-metrics-json-upload
