defaults:
  platforms: [unix, windows]
  for: [python, whl, python-sdist, zip]
  crit: hostile
  conf: 0.99
  attack: T1552.001,T1087,T1041

composite_rules:
  - id: notebook-secret-error-identity-exfil
    desc: Secret-store error yields exfiltrated visitor identity
    scope: archive
    all:
      - id: platform-secrets-token-replay
      - id: micro-behaviors/data/parse/regex::error-response-number-to-visitor-id
      - id: objectives/discovery/system/fingerprint/notebook::notebook-hosted-execution-gate
      - id: micro-behaviors/communications/http/telemetry::python-tracking-metrics-json-upload

  # Single-module variant of the rule above. track_info.py-style helpers derive
  # the visitor identity and return it to the caller (get_track_metrics), so a
  # lone-file scan never sees the tracking.json upload leg that lives in the
  # importing module. Spending the platform secrets token on a by-label store
  # RPC and then scraping the error reply for a visitor id is already credential
  # misuse gated on hosted-notebook execution -- no legitimate store client
  # reaches a stable per-user number that way -- so this variant convicts
  # without the upload leg.
  - id: notebook-secret-error-identity-theft
    desc: Derives visitor identity from secret-store error with platform token
    scope: archive
    all:
      - id: platform-secrets-token-replay
      - id: micro-behaviors/data/parse/regex::error-response-number-to-visitor-id
      - id: objectives/discovery/system/fingerprint/notebook::notebook-hosted-execution-gate
