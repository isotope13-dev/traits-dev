# Spending a platform secret-store session token on a by-label secret RPC and
# taking a numeric visitor id from the error is an identity oracle, not a
# secret read. Doing that in the same helper that executes a remote ES module
# through the notebook JavaScript bridge is a covert identity collector.
# A client that reads the returned secret, or a remote import with no oracle,
# does not match.
defaults:
  platforms: [unix, windows]
  for: [python]
  crit: hostile
  conf: 0.96
  attack: T1555

composite_rules:
  - id: secret-error-visitor-with-remote-notebook-code
    desc: Secret-store error identity with remote notebook code
    near_lines: 120
    all:
      - id: micro-behaviors/data/parse/regex::secret-rpc-error-visitor-identity-context
      - id: micro-behaviors/process/interpreter/eval/indirect::notebook-remote-js-result-roundtrip
