# Windows Credential Manager and Vault API Access
# Stealers use these APIs to enumerate and read credentials stored in
# the Windows Credential Manager (Control Panel > Credential Manager).
# ATT&CK: T1555.004 (Credentials from Password Stores: Windows Credential Manager)
# MBC: B0028 (Credential Theft)
defaults:
  platforms: [windows]
  attack: "T1555.004"
  mbc: "B0028"

composite_rules:
  - id: dpapi-master-key-store-access
    desc: Accesses Windows DPAPI master-key store
    crit: suspicious
    conf: 0.94
    all:
      - id: micro-behaviors/os/security/dpapi::crypt-unprotect-data-api
      - id: micro-behaviors/fs/path/private-key::windows-dpapi-master-key-path

  - id: credential-manager-access
    desc: Credential Manager enumerate and read APIs
    crit: notable
    conf: 0.9
    all:
      - id: micro-behaviors/os/security/credential-manager::cred-enumerate
      - id: micro-behaviors/os/security/credential-manager::cred-read
    unless:
      # Export-heavy provider DLLs legitimately implement these APIs and
      # should not be treated as suspicious credential access clients.
      - id: metadata/binary/symbols/count::many-exports-100
      # The keytar native add-on is itself a credential storage library; keep
      # the individual API observations, but don't infer stealer-like access.
      - id: micro-behaviors/os/security/keychain::keytar-native-addon
    downgrade:
      # Require verified Microsoft platform signing.
      any:
        - id: metadata/signature/verified/platform::microsoft

  # Reading every entry out of the credential store and then handing the blobs
  # to DPAPI is the whole of a credential-store stealer: enumerate, read,
  # decrypt. A password manager or keyring binding does the same calls, which is
  # why the parent composite's exclusions carry through here and why a verified
  # signature disqualifies the match -- shipped credential software is signed,
  # and this leaves the rule to catch the unsigned copies of that behaviour.
  - id: unsigned-credential-store-dpapi-sweep
    desc: Unsigned binary sweeps and decrypts credentials
    crit: hostile
    conf: 0.96
    attack: "T1555.004,T1555"
    for: [pe, dll]
    all:
      - id: credential-manager-access
      - id: micro-behaviors/os/security/dpapi::crypt-unprotect-data-api
    unless:
      - id: metadata/signature/verified/
      - id: well-known/app/storage/syncback::syncback-backup-benign-context

  # VaultGetItem returns the authenticator field itself; unrelated DPAPI/AES
  # helpers elsewhere in an assembly do not decrypt that item. Require the
  # secret-field extraction context rather than unsigned status plus crypto.
  - id: vault-authenticator-extraction
    desc: Retrieves Windows Vault authenticator fields
    crit: hostile
    conf: 0.96
    for: [pe, dll]
    all:
      - id: micro-behaviors/os/security/credential-manager::vault-open
      - id: micro-behaviors/os/security/credential-manager::vault-enumerate
      - id: micro-behaviors/os/security/credential-manager::vault-get-item
      - id: micro-behaviors/os/security/credential-manager::vault-authenticator-field
      - id: micro-behaviors/mem/read/arbitrary::dotnet-ptr-to-structure-reference
    unless:
      - id: well-known/lib/platform/windows-vault/
      - id: well-known/tool/offensive/peas/

  # Script counterpart of the unsigned-binary sweep above: enumerate the store
  # through P/Invoke and print the credential blobs. Unlike a password
  # manager round-tripping its own entries, a dumper's output template hands
  # every stored password to the console.
  - id: powershell-credential-store-dump
    desc: PowerShell dumps Credential Manager passwords
    crit: hostile
    conf: 0.97
    for: [powershell]
    all:
      - id: micro-behaviors/os/security/credential-manager::powershell-credential-enumeration-pinvoke
      - id: micro-behaviors/os/security/credential-manager::powershell-credential-password-output-template
