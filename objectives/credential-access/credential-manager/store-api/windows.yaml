# Windows Credential Manager and Vault API Access
# Stealers use these APIs to enumerate and read credentials stored in
# the Windows Credential Manager (Control Panel > Credential Manager).
# ATT&CK: T1555.004 (Credentials from Password Stores: Windows Credential Manager)
# MBC: B0028 (Credential Theft)
defaults:
  platforms: [windows]
  attack: "T1555.004"
  mbc: "B0028"

composite_rules:
  - id: credential-manager-access
    desc: Windows Credential Manager enumeration and reading
    crit: suspicious
    conf: 0.9
    all:
      - id: micro-behaviors/os/security/credential-manager::cred-enumerate
      - id: micro-behaviors/os/security/credential-manager::cred-read
    unless:
      # Export-heavy provider DLLs legitimately implement these APIs and
      # should not be treated as suspicious credential access clients.
      - id: metadata/binary/metrics/threshold::many-exports-100
      # The keytar native add-on is itself a credential storage library; keep
      # the individual API observations, but don't infer stealer-like access.
      - id: micro-behaviors/os/security/keychain::keytar-native-addon
      - id: well-known/lib/crypto/keyring::native-keyring-package-version
      - id: well-known/lib/crypto/keyring::zowe-secrets-native-keyring-source
      - id: metadata/library/pywin32::pywin32-binding-module
    downgrade:
      # The vendor claim has to be corroborated by a signature that actually
      # verifies. metadata/binary/vendor/ is a directory of *claims* -- several
      # of its traits say so in their own descriptions ("Claims Microsoft in
      # version resource") -- and a version resource is a handful of strings any
      # author can copy. On its own it handed every impostor a free downgrade:
      # a 12 MB unsigned dropper that filled in `CompanyName: Adobe Inc.` and
      # `ProductName: Adobe Installer` dropped this rule from suspicious to
      # notable while enumerating and reading the credential store.
      all:
        - id: metadata/binary/vendor/
        - id: metadata/signed/certificate/identity::pe-signature-verified-kv

  # Reading every entry out of the credential store and then handing the blobs
  # to DPAPI is the whole of a credential-store stealer: enumerate, read,
  # decrypt. A password manager or keyring binding does the same calls, which is
  # why the parent composite's exclusions carry through here and why a verified
  # signature disqualifies the match -- shipped credential software is signed,
  # and this leaves the rule to catch the unsigned copies of that behaviour.
  - id: unsigned-credential-store-dpapi-sweep
    desc: Unsigned binary sweeps and decrypts credentials
    crit: hostile
    conf: 0.96
    attack: "T1555.004,T1555"
    for: [pe, dll]
    all:
      - id: credential-manager-access
      - id: micro-behaviors/os/security/dpapi::crypt-unprotect-data-api
    unless:
      - id: metadata/signed/certificate/identity::pe-signature-verified-kv

  - id: vault-credential-access
    desc: Windows Credential Vault access
    crit: suspicious
    conf: 0.9
    all:
      - id: micro-behaviors/os/security/credential-manager::vault-open
    any:
      - id: micro-behaviors/os/security/credential-manager::vault-enumerate
      - id: micro-behaviors/os/security/credential-manager::vault-get-item
    unless:
      - id: well-known/lib/platform/windows-vault/
