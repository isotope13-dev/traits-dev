defaults:
  platforms: [windows]
  for: [pe]
  attack: T1552.004

traits:
  - id: cert-find-cert-in-store
    desc: CertFindCertificateInStore symbol
    crit: component
    conf: 0.9
    if:
      type: symbol
      exact: CertFindCertificateInStore

  - id: cert-duplicate-marker
    desc: CertDuplicateCertificateContext symbol
    crit: component
    conf: 0.9
    if:
      type: symbol
      exact: CertDuplicateCertificateContext

composite_rules:
  - id: cert-store-full-enumeration-chain
    desc: Windows cert store full enumeration chain
    crit: suspicious
    conf: 0.85
    all:
      - id: micro-behaviors/crypto/certificate/store::cert-open-store
      - id: micro-behaviors/crypto/certificate/store::cert-enum-certificates
      - id: cert-find-cert-in-store
    any:
      - id: cert-duplicate-marker
      - id: micro-behaviors/crypto/certificate/store::cert-close-store
    unless:
      - id: metadata/binary/vendor/
      - id: well-known/tool/reverse-engineering/frida/
      # Opening the system store, walking it and looking a certificate up in it
      # is how a TLS stack builds its trust store from the Windows roots.
      # Tellico bundles OpenSSL's libcrypto and Qt's Chromium-based
      # Qt6WebEngineCore, and both do exactly that at startup.
      - id: well-known/lib/crypto/openssl/
      - id: well-known/lib/runtime/electron::chromium-network-mojom-marker
    downgrade:
      any:
        - id: metadata/lang/compiler/systems::rustc-path
  - id: cert-store-recognized-marker
    desc: Recognized Windows cert-store enumeration marker
    crit: component
    conf: 0.9
    any:
      - id: metadata/signed/platform::microsoft
      - id: metadata/binary/framework::dotnet-metadata
      - id: metadata/signed/certificate/identity::pe-signature-verified
      - id: metadata/lang/compiler/systems::rustc-path
      - id: well-known/lib/web/dioxus::dioxus-runtime
      - id: well-known/app/productivity/notepad-plus-plus::notepad-plus-plus-portable-component
      - id: well-known/app/system/drivers/nvidia::ngx-dll-basename
      # OpenSSL/pyca-cryptography wraps the Windows cert store to load system CAs.
      - id: well-known/lib/crypto/openssl::openssl-cryptogams
