defaults:
  platforms: [windows]
  for: [pe]
  attack: T1552.004

composite_rules:
  - id: cert-store-recognized-marker
    desc: Recognized Windows cert-store enumeration marker
    crit: component
    conf: 0.9
    any:
      - id: metadata/signed/platform::microsoft
      - id: metadata/binary/framework::dotnet-metadata
      - id: metadata/signed/certificate/signature::pe-signature-verified
      - id: metadata/lang/compiler/systems::rustc-path
      - id: well-known/lib/web/dioxus::dioxus-runtime
      - id: well-known/app/productivity/notepad-plus-plus::notepad-plus-plus-portable-component
      - id: well-known/app/system/drivers/nvidia::ngx-dll-basename
      # OpenSSL/pyca-cryptography wraps the Windows cert store to load system CAs.
      - id: well-known/lib/crypto/openssl::openssl-cryptogams
