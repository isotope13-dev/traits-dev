defaults:
  platforms: [windows]
  for: [binaries, source, scripts]
  attack: T1555.004
composite_rules:
  - id: office-credential-enumeration-with-dpapi
    desc: Office credential enumeration with DPAPI
    crit: suspicious
    conf: 0.97
    # File-scoped evidence, not a claim that a particular blob reaches DPAPI.
    all:
      - id: micro-behaviors/os/security/credential-manager::enumeration-api
      - id: micro-behaviors/os/security/dpapi::unprotect-api
    any:
      - id: micro-behaviors/os/security/credential-manager::office-data-credential-target
      - id: micro-behaviors/os/security/credential-manager::outlook-credential-target
      - id: micro-behaviors/os/security/credential-manager::windows-live-credential-target
