# Hosted notebooks hand a short-lived session token to user code so it can
# fetch secrets the user configured. The env-var naming convention
# (`*_SECRET(S)_TOKEN`) plus a by-name store RPC is the documented client
# bootstrap -- Kaggle's own UserSecretsClient reads `KAGGLE_USER_SECRETS_TOKEN`
# and POSTs `GetUserSecretByLabelRequest`. Co-occurrence of those two atoms is
# therefore a notable store-client fact, not token replay: every legitimate
# SDK does the same thing to open a connection. Hostile credential-access
# needs the retrieved secret to leave via an exfil leg, not merely that the
# platform client was used.
defaults:
  platforms: [unix, windows]
  for: [python]
  attack: T1552.001
  mbc: C0032

traits:
  # The platform's session credential, read out of the environment.
  - id: platform-secrets-token-env-read
    desc: Reads a platform secrets session token
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '\b[A-Z][A-Z0-9_]{0,32}_(USER_)?SECRETS?_TOKEN\b'

  # A request aimed at the secret store rather than the product API. The
  # "by label"/"by name" spelling is how these endpoints address one stored
  # secret.
  - id: platform-secrets-endpoint-request
    desc: Requests a named secret from a store
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '\b(Get|Fetch|Read)[A-Za-z]{0,20}Secret[A-Za-z]{0,24}(Request|ByLabel|ByName)\b'

composite_rules:
  # Token env + by-name store RPC is how the platform client authenticates.
  # Same reasoning as vault-env-targeting: bootstrap, not replay.
  - id: platform-secrets-token-replay
    desc: Uses a platform token at its secret store
    crit: notable
    conf: 0.95
    near_lines: 40
    all:
      - id: platform-secrets-token-env-read
      - id: platform-secrets-endpoint-request
