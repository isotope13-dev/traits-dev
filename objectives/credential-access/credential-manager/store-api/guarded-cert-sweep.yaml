# A payload that checks whether it is being watched, then reads the machine's
# certificate store.
#
# The Scavenger family reached npm and PyPI through several compromised
# maintainer accounts in 2025 -- eslint-plugin-prettier, got-fetch, pkgr-core,
# num2words -- and each dropped a Windows PE that does both of these things.
#
# The certificate-store walk on its own is already stated as a chain and kept
# `suspicious`, correctly: enterprise software enumerates certificates for
# ordinary reasons, and so does anything that needs to find a client cert.
# What no such program does is read the PEB's BeingDebugged byte first.
#
# The pairing is the finding, and it is a credential-access finding rather
# than an anti-analysis one: the debugger check only tells you the collection
# was meant to go unobserved. Certificates in that store are identities --
# client certificates, code-signing keys, whatever the user enrolled -- and
# they outlive any password rotation, so a responder needs this called out
# separately from whatever else the package did.
defaults:
  platforms: [windows]
  for: [pe]
  attack: T1552.004,T1622
  mbc: E1552

composite_rules:
  - id: analysis-aware-certificate-store-sweep
    desc: Debug-checked certificate store sweep
    crit: hostile
    conf: 0.95
    # The debugger leg is the direct PEB read and nothing else. Referencing the
    # whole `anti-analysis/debugger-detect/` and `anti-analysis/sandbox-detect/`
    # trees pulled in their baseline atoms, so the "analysis-aware" half was
    # satisfied by facts that check for no debugger at all: Telegram Desktop's
    # 218 MB Windows build matched on `mscoree-runtime-resolve-string` (the
    # .NET host DLL name) and `runtime-process-enumeration`, both baseline,
    # while its actual debugger references are the documented
    # IsDebuggerPresent/CheckRemoteDebuggerPresent imports that the CRT and
    # every crash reporter carry.
    #
    # Reading BeingDebugged out of the PEB is the evasive spelling -- it exists
    # to avoid the API a defender can hook -- and it is what the note above
    # means by "no such program does this first".
    all:
      - id: objectives/credential-access/credential-manager/store-api::cert-store-full-enumeration-chain
      - id: micro-behaviors/os/api-resolution/hash-based::peb-being-debugged-byte
    unless:
      - id: metadata/package/testing/
