# ServiceNow credential-store access from Glide script.
#
# Two scripted primitives harvest credentials that legitimate tenant users
# cannot read:
#
# 1. Credentials installed in ServiceNow are stored encrypted with "no
#    legitimate way from the UI to decrypt them"; the MID server's
#    snc-automation-api.jar exposes CredentialsProviderFactory /
#    getCredentialByID, which an attacker reaches from a JavascriptProbe or
#    an ecc_queue entry (MDSec, "When it Snows it Pours", 2026).
# 2. Vault integrations (e.g. CyberArk) are invoked as named REST messages
#    whose function retrieves a password ('Get Password'); a script that
#    calls the integration and captures the body is dumping vault
#    credentials through the tenant.
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript, json, text, data, python]
  attack: T1555

traits:
  - id: servicenow-credential-provider-decrypt
    desc: Calls ServiceNow credential decrypt API
    crit: suspicious
    conf: 0.95
    attack: T1552
    if:
      type: text
      # `getCredentialByID`/`getCredentialByAlias` are the MID server's own
      # credential API names. `CredentialsProviderFactory` used to be in this
      # alternation and is not ServiceNow's: it is ordinary OO naming that any
      # library reaches for -- google-auth-library declares a class by exactly
      # that name for its JSON/PEM/P12 key loaders, and MiniMax Code bundles it.
      regex: '\bgetCredentialBy(ID|Alias)\b'

  - id: servicenow-vault-password-restmessage
    desc: ServiceNow REST message fetches vault password
    crit: notable
    conf: 0.92
    if:
      type: text
      # Two-argument RESTMessageV2 constructor (named message, function)
      # whose function retrieves a password, e.g. CyberArk 'Get Password'.
      regex: 'sn_ws\.RESTMessageV2\(\s*[''"][^''"]{0,40}[''"]\s*,\s*[''"][^''"]{0,20}(?i:get[ _]?password)'

  - id: servicenow-password2-field-decrypt
    desc: Decrypts ServiceNow Password2 field
    crit: notable
    conf: 0.92
    if:
      type: text
      # Documented decryption API for two-way encrypted password fields;
      # legitimate for integrations, and the primitive for secret dumps.
      regex: '\.getDecryptedValue\s*\('

  - id: servicenow-discovery-credentials-read
    desc: Reads ServiceNow discovery credentials
    crit: notable
    conf: 0.92
    if:
      type: text
      # Encrypted discovery credential store (27 credential types: Windows
      # accounts, SSH keys, cloud keys), as a quoted table name or a
      # table REST API path.
      regex: '([''"]discovery_credentials[''"]|table/discovery_credentials)'

  - id: servicenow-ldap-config-query
    desc: Queries ServiceNow LDAP config table
    crit: notable
    conf: 0.9
    if:
      type: text
      # Holds LDAP bind DN and Password2-encrypted bind password.
      regex: '[''"]ldap_server_config[''"]'

composite_rules:
  - id: servicenow-vault-password-retrieval
    desc: Password pulled from vault via ServiceNow
    crit: suspicious
    conf: 0.93
    attack: T1555,T1552.001
    all:
      - id: servicenow-vault-password-restmessage
      - id: micro-behaviors/communications/http/client/service::servicenow-restmessage-body-capture
    near_bytes: 500

  - id: servicenow-ldap-password-dump
    desc: Dumps decrypted LDAP bind passwords
    crit: suspicious
    conf: 0.93
    all:
      - id: servicenow-ldap-config-query
      - id: servicenow-password2-field-decrypt
    near_bytes: 600

  - id: servicenow-discovery-credential-dump
    desc: Dumps ServiceNow discovery credentials
    crit: hostile
    conf: 0.95
    all:
      - id: servicenow-discovery-credentials-read
      - id: servicenow-credential-provider-decrypt
    near_bytes: 4000
