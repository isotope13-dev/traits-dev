# Shared-mode reads do not bypass a denying file lock. Network delivery
# distinguishes this sweep from a local vault backup, but not an online backup.
defaults:
  for: [powershell]
  platforms: [windows]
  crit: suspicious
  attack: T1555

composite_rules:
  - id: powershell-keepass-shared-read-sweep
    desc: KeePass vault sweep and shared file opens accompany HTTP uploads
    near_lines: 30
    all:
      - id: micro-behaviors/fs/path/credential/password-store::kdbx-extension-reference
      - id: micro-behaviors/fs/path/credential/password-store::keepass-config-path
      - id: micro-behaviors/fs/directory/traverse::powershell-recursive-child-item
      - id: micro-behaviors/fs/file/open/call::dotnet-file-open
      - id: micro-behaviors/fs/file/open/flags::powershell-readwrite-file-sharing
      - id: micro-behaviors/communications/http/request/payload::powershell-http-post-body
