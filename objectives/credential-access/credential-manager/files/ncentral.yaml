defaults:
  platforms: [linux]
  for: [shell]
  attack: T1552.001
traits:
  - id: ncentral-master-password-copy
    desc: Copies the N-central master password
    crit: suspicious
    if:
      type: text
      regex: '\bcp\s+(-[a-zA-Z]+\s+){0,2}["'']?/opt/nable/etc/masterPassword["'']?\s+'
      exclude_comments: true
