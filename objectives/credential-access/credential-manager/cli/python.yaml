defaults:
  platforms: [unix, windows]
  for: [python]
  attack: T1555
  mbc: E1555

traits:
- id: bitwarden-cli-name
  desc: Bitwarden CLI name literal
  crit: notable
  conf: 0.88
  if:
    type: tree-sitter
    query: |
      ((call
        arguments: (argument_list
          (string) @cmd))
       (#match? @cmd "^['\"]bw['\"]$"))
composite_rules:
- id: onepassword-item-get-cli
  desc: 1Password CLI item retrieval
  crit: suspicious
  conf: 0.94
  all:
  - id: micro-behaviors/process/argument/subcommand::onepassword-cli-name
  - id: micro-behaviors/process/argument/subcommand::cli-verb-item
  - id: micro-behaviors/process/argument/subcommand::cli-verb-get
  - id: micro-behaviors/process/argument/subcommand::cli-format-json-flag
  near_lines: 20
- id: bitwarden-list-items-cli
  desc: Bitwarden CLI item listing
  crit: suspicious
  conf: 0.94
  all:
  - id: bitwarden-cli-name
  - id: micro-behaviors/process/argument/subcommand::cli-verb-list
  - id: micro-behaviors/process/argument/subcommand::python-subprocess-items-argument
  near_lines: 12
- id: python-password-manager-cli-dump
  desc: Python dumps password manager stores through CLIs
  crit: hostile
  conf: 0.975
  needs: 2
  any:
  - id: onepassword-item-get-cli
  - id: bitwarden-list-items-cli
  - id: micro-behaviors/os/security/credential-manager::python-pass-show
  - id: objectives/credential-access/credential-manager/cli::python-gopass-show
  all:
  - id: micro-behaviors/process/create/exec::python-subprocess-run-call-text
