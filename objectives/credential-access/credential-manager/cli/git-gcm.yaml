# Git Credential Manager exposes provider-specific account operations through
# `git credential-manager <provider> ...`.  Attackers can execute the GitHub
# list operation non-interactively alongside other token helpers to enumerate
# every GitHub identity available on a developer host or CI runner.
defaults:
  platforms: [windows, unix]
  for: [scripts, source]
  attack: T1555

traits:
  - id: gcm-github-list-command-string
    desc: Git Credential Manager GitHub list command
    crit: suspicious
    conf: 0.96
    if:
      type: string_literal
      regex: '^\s*git(\.exe)?\s+credential-manager(-core)?\s+github\s+list(\s+--no-ui)?\s*$'

  - id: gcm-git-argv-prefix
    desc: Git Credential Manager argv prefix
    crit: component
    conf: 0.96
    for: [python, javascript, typescript, go, rust, ruby, java, csharp]
    if:
      type: text
      regex: '["'']git(\.exe)?["'']\s*,\s*["'']credential-manager(-core)?["'']'

  - id: gcm-github-list-argv-tail
    desc: GitHub list argv tail
    crit: component
    conf: 0.96
    for: [python, javascript, typescript, go, rust, ruby, java, csharp]
    if:
      type: text
      regex: '["'']github["'']\s*,\s*["'']list["'']'

composite_rules:
  - id: gcm-github-list-argv
    desc: Git Credential Manager GitHub list argv
    crit: suspicious
    conf: 0.97
    near_lines: 2
    all:
      - id: gcm-git-argv-prefix
      - id: gcm-github-list-argv-tail

  - id: github-cli-credential-sweep
    desc: Extracts GitHub CLI token and enumerates Git Credential Manager accounts
    crit: suspicious
    conf: 0.98
    near_lines: 40
    all:
      - id: objectives/credential-access/cloud/token/cli::gh-auth-token-raw
    any:
      - id: gcm-github-list-command-string
      - id: gcm-github-list-argv
