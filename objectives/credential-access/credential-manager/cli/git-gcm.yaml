# Combining GitHub CLI token extraction with account enumeration across Git
# Credential Manager is a credential sweep. The neutral account-listing atoms
# live under objectives/discovery/account/enum/ and remain notable on their own.
defaults:
  platforms: [windows, unix]
  for: [scripts, source]

composite_rules:
  - id: github-cli-credential-sweep
    desc: Extracts GitHub CLI token and enumerates Git Credential Manager accounts
    crit: suspicious
    conf: 0.98
    attack: T1555,T1087
    near_lines: 40
    all:
      - id: objectives/credential-access/cloud/token/cli::gh-auth-token-raw
    any:
      - id: objectives/discovery/account/enum::gcm-github-list-command-string
      - id: objectives/discovery/account/enum::gcm-github-list-argv
