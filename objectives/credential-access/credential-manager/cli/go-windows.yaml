defaults:
  conf: 0.95
  platforms: [windows]
  for: [go]
  attack: T1555

traits:
  - id: go-cmdkey-list-command-string
    desc: Go contains cmdkey list command
    crit: notable
    if:
      type: literal
      exact: cmdkey /list
  - id: go-exec-cmdkey-list
    desc: Go executes cmdkey credential listing
    crit: suspicious
    if:
      type: text
      regex: 'exec\.Command\(.{0,80}"cmdkey",\s*"/list"'
