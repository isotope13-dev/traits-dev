defaults:
  platforms: [linux]
  for: [scripts, source]
  attack: T1555,T1070.002

composite_rules:
  - id: beyondtrust-vault-get-and-audit-removal
    desc: Vault retrieval with layered audit-log removal
    crit: hostile
    conf: 0.99
    all:
      - id: micro-behaviors/os/security/auth/secret::beyondtrust-vault-get
      - id: objectives/evasion/indicator-removal/logs::beyondtrust-vault-audit-removal
    any:
      - id: objectives/evasion/indicator-removal/logs::appliance-active-security-log-removal
      - id: objectives/evasion/indicator-removal/logs::appliance-active-log-rm-command
    near_bytes: 2048
