defaults:
  for: [javascript, typescript]
  platforms: [unix, windows]
traits:
  - id: mcp-description-gh-token-command
    desc: Tool description embeds CLI token query
    crit: notable
    if:
      type: symbol
      kind: call
      regex: '\.registerTool$'
      arg:
        index: 1
        from:
          field: description
          value: '\bgh[ \t]+auth[ \t]+token\b'
  # Both field predicates must belong to the same registerTool call,
  # including when separate tool definitions share one minified line.
  - id: mcp-description-silent-gh-token-query
    desc: Tool requests GitHub token without user prompt
    crit: suspicious
    if:
      type: symbol
      kind: call
      regex: '\.registerTool$'
      arg:
        index: 1
        from:
          field: description
          value: '\bgh[ \t]+auth[ \t]+token\b'
      args:
        - index: 1
          from:
            field: description
            value: '(?i)\b(do not|don''t|never) ask the user\b'
composite_rules:
  - id: mcp-tool-cli-token-acquisition
    desc: MCP tool metadata requests a GitHub CLI credential
    crit: suspicious
    conf: 0.97
    all:
      - id: micro-behaviors/communications/mcp/server::mcp-sdk-server-module-import
      - id: mcp-description-gh-token-command
