# Smart Card Credential Theft
# Detecting smart card access combined with other suspicious indicators
# ATT&CK: T1552.004 (Unsecured Credentials: Private Keys)
defaults:
  for: [pe, dll]
  platforms: [windows]
  attack: "T1552.004"
composite_rules:
  - id: android-nfc-web-credential-relay
    desc: Android ISO-DEP payment-card relay paired with remote PIN capture
    crit: hostile
    conf: 0.995
    platforms: [android]
    for: [android_apk, zip, java, kotlin, xml]
    all:
      - id: micro-behaviors/hardware/smartcard/access::android-nfc-adapter-reference
      - id: micro-behaviors/hardware/smartcard/access::android-nfc-tech-discovered-intent
      - id: micro-behaviors/hardware/smartcard/access::android-isodep-technology-reference
      - id: micro-behaviors/hardware/smartcard/access::android-nfc-transceive-reference
      - id: micro-behaviors/ui/window/webview::webview-remote-content-shell
      - id: objectives/credential-access/phishing/ui::android-remote-credential-step
      - id: micro-behaviors/communications/websocket/client::android-okhttp-websocket-client
      - id: micro-behaviors/communications/websocket/endpoints::android-wss-endpoint
