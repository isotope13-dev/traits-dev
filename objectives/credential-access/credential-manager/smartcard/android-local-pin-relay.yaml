defaults:
  platforms: [android]
  attack: T1056.002,T1041
traits:
  - id: portuguese-card-detected-prompt
    desc: Portuguese card-detected prompt
    crit: notable
    conf: 0.98
    for: [html, javascript]
    if:
      type: text
      regex: '(?i)cart[aã]o\s+detectado'
  - id: portuguese-card-pin-length-prompt
    desc: Portuguese four- or six-digit PIN prompt
    crit: notable
    conf: 0.98
    for: [html, javascript]
    if:
      type: text
      regex: '(?i)\bPIN\s+de\s+[46]\s+d[ií]gitos\b'
composite_rules:
  # NFC card-data transfer and a local PIN prompt are distinct pieces of
  # evidence; this does not assert that the entered PIN leaves the device.
  - id: android-nfc-relay-local-pin-prompt
    desc: NFC card relay with local PIN prompt
    crit: hostile
    conf: 0.98
    for: [android_apk, apk_android, apk, zip, dex, html, javascript]
    scope: outer
    all:
      - id: objectives/credential-access/credential-manager/smartcard::android-card-data-websocket-references
      - id: portuguese-card-detected-prompt
      - id: portuguese-card-pin-length-prompt
