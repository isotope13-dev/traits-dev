# Cross-language Windows Credential Manager enumeration paired with DPAPI decryption
# and multi-store developer/SSH/application credential file harvesting.
defaults:
  platforms: [windows]
  for: [source, scripts]
  attack: T1555.004,T1552.001
  mbc: B0028

composite_rules:
  - id: script-credential-manager-dpapi-secret-sweep
    desc: Sweeps CredMan, DPAPI, and secret files
    crit: hostile
    conf: 0.97
    needs: 2
    all:
      - id: micro-behaviors/os/security/credential-manager::cred-enumerate
      - id: micro-behaviors/os/security/dpapi::crypt-unprotect-data-source-reference
    any:
      - id: micro-behaviors/fs/path/private-key::ssh-private-key-filename-ed25519
      - id: micro-behaviors/fs/path/private-key::gnupg-private-key-store-path
      - id: micro-behaviors/fs/path/password-store::filezilla-sitemanager-path
      - id: micro-behaviors/fs/path/agent-auth::claude-auth-artifact-path
    unless:
      - id: micro-behaviors/os/security/keychain::keytar-native-addon
