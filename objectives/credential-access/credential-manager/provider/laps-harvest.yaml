# Active Directory Local Administrator Password Solution (LAPS) credential
# harvesting over LDAP (ms-Mcs-AdmPwd, msLAPS-Password, msLAPS-EncryptedPassword).
# Raw LDAP queries for LAPS password attributes on computer objects are
# suspicious; writing harvested LAPS secrets to loot files or pairing them with
# lateral share checks or delegation takeover is hostile.
defaults:
  platforms: [windows, unix]
  for: [powershell, python, csharp, go, scripts, source]
  attack: T1555

traits:
  - id: python-ldap-search-call
    desc: Python LDAP connection search call
    crit: component
    conf: 0.88
    for: [python, scripts, source]
    if:
      type: text
      exclude_comments: true
      regex: '(?i)(\bconn(ection)?\.search\s*\(|\bsearch_ext(_s)?\s*\()'

  - id: go-or-cli-ldap-search-call
    desc: Go or CLI LDAP search call
    crit: component
    conf: 0.88
    for: [go, scripts, source]
    if:
      type: text
      exclude_comments: true
      regex: '\b(SearchWithPaging|NewSearchRequest|ldapsearch)\b'

composite_rules:
  - id: ldap-directory-query-surface
    desc: Active Directory or LDAP search client surface
    crit: component
    conf: 0.9
    any:
      - id: micro-behaviors/os/security/directory-service::powershell-directory-searcher
      - id: micro-behaviors/os/security/directory-service::directory-searcher-properties-to-load
      - id: micro-behaviors/communications/url/scheme::ldap-url-scheme
      - id: python-ldap-search-call
      - id: go-or-cli-ldap-search-call

  - id: ldap-laps-password-query
    desc: Queries Active Directory LDAP computer objects for LAPS passwords
    crit: suspicious
    conf: 0.94
    all:
      - id: micro-behaviors/os/security/directory-service::laps-password-attribute
      - id: ldap-directory-query-surface
    unless:
      - id: well-known/tool/offensive/impacket::source-tree-member
    downgrade:
      scope: file-or-parent
      any:
        # microsoft.ad's laps_password lookup is the admin-side LAPS reader.
        - id: well-known/app/infrastructure/ansible::ansible-community-sdist-context

  - id: ldap-laps-credential-harvest
    desc: Harvests Active Directory LAPS passwords and stages loot or pivots laterally
    crit: hostile
    conf: 0.98
    all:
      - id: ldap-laps-password-query
    any:
      - id: objectives/discovery/host/security::remote-edr-sensor-inventory
      - id: micro-behaviors/os/security/directory-service::resource-based-delegation-attribute
      - id: micro-behaviors/fs/path/application/state::programdata-directory-path
      - id: micro-behaviors/network/share::ps-admin-c-share-path
    unless:
      - id: well-known/tool/offensive/impacket::source-tree-member
