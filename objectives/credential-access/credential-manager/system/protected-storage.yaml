defaults:
  attack: T1555
  mbc: B0028
  for:
  - pe
  - dll
  - c
  - cpp
  platforms:
  - windows
traits:
- id: cached-password-enumeration-marker
  desc: Cached password enumeration marker
  crit: suspicious
  conf: 0.96
  for:
  - pe
  - dll
  if:
    type: text
    word: WNetEnumCachedPasswords
  unless:
  - id: well-known/app/system/reactos::system-component
- id: protected-storage-dump-success
  desc: Protected Storage dump success status
  crit: notable
  conf: 0.96
  for:
  - pe
  - dll
  size_max: 80000
  if:
    type: text
    substr: Successfully dumped protected storage
composite_rules:

- id: legacy-ie-protected-storage-stealer
  desc: Legacy IE Protected Storage credential theft
  crit: hostile
  conf: 0.99
  attack: T1555.003,T1003
  for:
  - pe
  - dll
  all:
  - id: micro-behaviors/os/security/protected-storage::pstore-create-instance-reference
  - id: cached-password-enumeration-marker
  - id: micro-behaviors/os/registry/value-name::ie-password-autocomplete-setting
  unless:
  - id: well-known/app/utility/siw::siw-family-identity
- id: pstore-ie-password-protected-sites-stealer
  desc: Steals IE password-protected sites credentials from Protected Storage
  crit: hostile
  conf: 0.98
  attack: T1555.003
  for:
  - pe
  - dll
  all:
  - id: micro-behaviors/os/security/protected-storage::pstore-factory-reference
  - id: micro-behaviors/os/security/protected-storage::ie-password-protected-sites-label
  unless:
  - id: well-known/app/utility/siw::siw-family-identity
- id: pstore-dump-success-tool
  desc: Protected Storage API with dump-success diagnostic
  crit: suspicious
  conf: 0.98
  # Both legs are compiled-binary string labels; no C/C++ source spelling.
  for: [pe, dll]
  size_max: 80000
  all:
  - id: micro-behaviors/os/security/protected-storage::pstore-create-instance-reference
  - id: protected-storage-dump-success

  downgrade:
    any:
      - id: well-known/dual-use/credentials/fgdump::credential-auditing-tool-context
- id: pstore-ie-autocomplete-dumper
  desc: Protected Storage dumper reads IE AutoComplete secrets
  crit: suspicious
  conf: 0.97
  # Both legs are compiled-binary string labels; no C/C++ source spelling.
  for: [pe, dll]
  size_max: 80000
  all:
  - id: micro-behaviors/os/security/protected-storage::pstore-create-instance-reference
  - id: micro-behaviors/os/security/protected-storage::ie-autocomplete-passwords-label


  downgrade:
    any:
      - id: well-known/dual-use/credentials/fgdump::credential-auditing-tool-context
