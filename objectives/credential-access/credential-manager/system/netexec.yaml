# NetExec is dual-use. The explicit NTDS dump operation crosses a credential
# boundary, but does not by itself establish unauthorized access. Match command
# syntax (including argv arrays), never an actor name or the word NetExec alone.
defaults:
  platforms: [unix, windows]
  for: [scripts, binaries, typescript, go, csharp, java, c, cpp, rust]
  crit: suspicious
  conf: 0.97
  attack: T1003.003

traits:
  - id: netexec-smb-ntds-command
    desc: NetExec SMB command requests NTDS dumping
    if:
      type: text
      regex: '(?s)\b(nxc|netexec)(\.exe)?[''"]?[\s,''"\[\]]+smb\b.{0,240}--ntds([\s,''";)]|$)'
