# RODC cached-credential abuse. An RODC only caches the secrets its
# reveal-on-demand policy (msDS-RevealOnDemandGroup) permits; the cached list
# is readable from msDS-RevealedUsers. The attack rewrites that policy to admit
# a privileged principal, forces replication, then reads the now-cached
# credential material back out. Read-only RODC auditing touches
# msDS-RevealedUsers but never rewrites the policy, so requiring the policy
# write alongside the cache read keeps this clear of benign enumeration.
# Tool-, host- and language-independent: the schema fixes both attribute names.
defaults:
  platforms: [unix, windows]
  for: [scripts, source]
  attack: T1003

composite_rules:
  - id: rodc-reveal-on-demand-cache-abuse
    desc: Expands RODC cache then reads cached secrets
    crit: hostile
    conf: 0.97
    all:
      - id: micro-behaviors/os/security/directory-service::reveal-on-demand-group-attribute
      - id: micro-behaviors/os/security/directory-service::revealed-users-attribute
    any:
      - id: micro-behaviors/os/security/directory-service::ldap-object-set-command
      - id: micro-behaviors/os/security/directory-service::ldif-modify-changetype
      - id: micro-behaviors/os/security/directory-service::powershell-ad-object-write-call
    near_bytes: 1200
