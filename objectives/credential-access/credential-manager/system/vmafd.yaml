defaults:
  platforms: [unix]
  for: [shell, python]
composite_rules:
  - id: vmafd-machine-password-query
    desc: Retrieves a local vCenter machine-account password through vmafd
    crit: suspicious
    conf: 0.98
    attack: T1555
    near_lines: 6
    all:
      - id: micro-behaviors/os/security/credential-manager::vmafd-local-client
      - id: micro-behaviors/os/security/credential-manager::machine-password-getter
