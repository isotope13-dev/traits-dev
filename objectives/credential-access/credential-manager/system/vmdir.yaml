# Offline parsing of vmdir certificate records with private-key reconstruction.
# Both record markers are schema fields, not malware-specific identifiers.
defaults:
  platforms: [unix, windows]
  for: [python]
  attack: T1552.004

composite_rules:
  - id: vmdir-idp-private-key-extraction
    desc: Parses vmdir signing records and reconstructs a PEM private key
    crit: suspicious
    conf: 0.98
    all:
      - id: micro-behaviors/crypto/certificate/usage::vmdir-trusted-chain-marker
      - id: micro-behaviors/crypto/certificate/usage::vmdir-sso-signing-certificate-marker
      - id: micro-behaviors/data/buffer/read::python-bitstring-byte-read
      - id: micro-behaviors/crypto/key/representation/encoded::pem-private-key-header
