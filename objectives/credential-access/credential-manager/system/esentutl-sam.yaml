defaults:
  platforms: [windows]
  for: [batch, powershell, scripts]
  attack: T1003.002
  mbc: B0005

composite_rules:
  - id: esentutl-sam-hive-dump
    desc: Esentutl copies SAM hive via VSS
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/fs/file/copy/source-destination::esentutl-raw-file-copy
      - id: micro-behaviors/fs/path/account-db::windows-sam-hive-path
    any:
      - id: micro-behaviors/fs/file/copy/source-destination::esentutl-vss-copy
      - id: micro-behaviors/fs/path/config/system::windows-system-hive-path

  - id: esentutl-system-hive-dump
    desc: Esentutl copies SYSTEM hive via VSS
    crit: hostile
    conf: 0.97
    all:
      - id: micro-behaviors/fs/file/copy/source-destination::esentutl-raw-file-copy
      - id: micro-behaviors/fs/file/copy/source-destination::esentutl-vss-copy
      - id: micro-behaviors/fs/path/config/system::windows-system-hive-path
  - id: esentutl-sam-system-pair-dump
    desc: Esentutl copies SAM and SYSTEM hives
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/fs/file/copy/source-destination::esentutl-raw-file-copy
      - id: micro-behaviors/fs/path/account-db::windows-sam-hive-path
      - id: micro-behaviors/fs/path/config/system::windows-system-hive-path
