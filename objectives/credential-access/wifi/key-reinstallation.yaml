defaults:
  platforms: [unix, windows]
  for: [python, c, cpp, go, rust]

traits:
  - id: key-reinstallation-handler
    desc: Implements a KRACK protocol handler
    crit: notable
    if:
      type: function
      regex: '(?i)^_?krack_?(dispatch(er)?|proceed|attack)$'

  - id: eapol-key-builder
    desc: Defines an EAPOL key frame builder
    crit: notable
    if:
      type: function
      regex: '(?i)^(build|craft|make)_?eapol_?key\w*$'

  - id: eapol-key-builder-call
    desc: Calls an EAPOL key frame builder
    crit: notable
    if:
      type: symbol
      kind: call
      regex: '(?i)(^|[.:])(build|craft|make)_?eapol_?key\w*$'

composite_rules:
  - id: wpa-key-reinstallation-implementation
    desc: Implements WPA key reinstallation attack
    crit: hostile
    conf: 0.98
    all:
      - id: key-reinstallation-handler
      - id: eapol-key-builder
      - id: eapol-key-builder-call
