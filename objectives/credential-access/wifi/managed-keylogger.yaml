defaults:
  platforms: [windows]
  for: [pe, dll]
composite_rules:
  # Netsh and its arguments are separate CLR strings. Recording supplies
  # abuse context; output capture corroborates acquisition. No send is
  # required, and a query need not return an actual plaintext password.
  - id: managed-keylogger-plaintext-wlan-query
    desc: Keylogger with plaintext Wi-Fi profile query references
    crit: hostile
    conf: 0.96
    attack: T1555
    all:
      - id: objectives/collection/keylog/hook::dotnet-hook-keylog-recording
      - id: micro-behaviors/process/create/spawn::redirect-standard-output-dotnet
    any:
      - id: micro-behaviors/hardware/wireless/network::wlan-plaintext-key-query-arguments
      - id: micro-behaviors/hardware/wireless/network::split-plaintext-wlan-query-arguments
