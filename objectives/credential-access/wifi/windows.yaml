defaults:
  platforms: [windows]
  for: [python, batch, powershell, pe]
  attack: T1555
traits:
  - id: netsh-wlan-show-profiles
    desc: Netsh saved Wi-Fi profile enumeration
    crit: notable
    conf: 0.88
    if:
      type: text
      regex: 'netsh\s+wlan\s+show\s+profiles?\b'
  - id: netsh-wlan-key-clear
    desc: Netsh Wi-Fi key extraction
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: 'netsh\s+wlan\s+show\s+profile\b[^\n]{0,180}\bkey\s*\^?=\s*clear\b'
  - id: netsh-wlan-key-content-parse
    desc: Parses netsh Wi-Fi key content
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: 'Key Content|محتوى المفتاح'
  - id: python-netsh-key-clear-argument
    desc: Python requests plaintext Wi-Fi keys
    crit: notable
    conf: 0.94
    for: [python]
    if:
      type: text
      regex: '["'']key\s*=\s*clear["'']'
  - id: python-wifi-password-parse
    desc: Python parses Wi-Fi password output
    crit: notable
    conf: 0.94
    for: [python]
    if:
      type: text
      regex: '\bpassword_match\s*=\s*re\.search\s*\('
  - id: wlan-profile-plaintext-key-flag
    desc: WLAN plaintext profile key flag
    crit: notable
    conf: 0.95
    for: [source, binaries]
    if:
      type: text
      exact: WLAN_PROFILE_GET_PLAINTEXT_KEY
  - id: go-netsh-wlan-show-profiles
    desc: Go netsh saved Wi-Fi profiles
    crit: notable
    conf: 0.9
    for: [go]
    if:
      type: text
      regex: 'exec\.Command\("netsh",\s*"wlan",\s*"show",\s*"profiles?"'
  - id: go-netsh-wlan-key-clear
    desc: Go netsh Wi-Fi key extraction
    crit: notable
    conf: 0.94
    for: [go]
    if:
      type: text
      regex: 'exec\.Command\("netsh",\s*"wlan",\s*"show",\s*"profiles?",[\s\S]{0,160}"key=clear"'
  - id: js-wlan-profiles-key-clear
    desc: Shows WLAN profiles with clear keys
    crit: notable
    conf: 0.95
    for: [javascript, typescript]
    platforms: [windows, unix]
    if:
      type: text
      regex: 'wlan\s+show\s+profiles?[\s\S]{0,80}key\s*=\s*clear'
  # Command and its first arguments all supplied through variables, so no
  # literal command name appears. On its own this is only an obfuscated
  # invocation; the Wi-Fi claim comes from the composite below.
  - id: powershell-variable-command-invocation
    desc: Invokes command entirely through variables
    crit: notable
    conf: 0.88
    for: [powershell]
    if:
      type: text
      regex: '&\$[A-Za-z_]\w*\s+\$[A-Za-z_]\w*\s+\$[A-Za-z_]\w*\s+\$[A-Za-z_]\w*'
composite_rules:
  - id: netsh-wifi-password-extraction
    desc: Netsh saved Wi-Fi password extraction
    crit: notable
    conf: 0.96
    all:
      - id: netsh-wlan-key-clear
    any:
      - id: netsh-wlan-key-content-parse
      - id: netsh-wlan-show-profiles
      - id: micro-behaviors/process/create/shell-subprocess::shell-true
  # A compiled binary that enumerates saved profiles and parses the "Key
  # Content" line of `netsh wlan show profile ... key=clear` output is
  # harvesting Wi-Fi passphrases: inventory tooling lists profiles but never
  # parses the recovered plaintext key. Script carriers stay on the notable
  # composite above, where admin recovery scripts are plausible.
  - id: native-netsh-wifi-password-harvest
    desc: Native binary harvests Wi-Fi passwords via netsh
    crit: hostile
    conf: 0.96
    mbc: E1003
    for: [pe, dll]
    all:
      - id: netsh-wlan-key-content-parse
    any:
      - id: netsh-wlan-show-profiles
      - id: netsh-wlan-key-clear
  - id: wlan-api-plaintext-profile-key
    desc: Windows WLAN API plaintext profile key retrieval
    crit: suspicious
    conf: 0.96
    for: [source, binaries]
    all:
      - id: micro-behaviors/hardware/wireless/network::wlan-get-profile
      - id: wlan-profile-plaintext-key-flag
    unless:
      - id: metadata/build/generated::winmd-metadata
  - id: go-netsh-wifi-password-extraction
    desc: Go netsh Wi-Fi password extraction
    crit: notable
    conf: 0.96
    for: [go]
    all:
      - id: go-netsh-wlan-show-profiles
      - id: go-netsh-wlan-key-clear
  - id: python-wifi-password-harvest-backdoor
    desc: Wi-Fi password harvesting through HTTP backdoor
    crit: hostile
    conf: 0.99
    mbc: E1003
    attack: T1555,T1059.006,T1505.003
    for: [whl, python]
    scope: archive
    all:
      - id: python-netsh-key-clear-argument
      - id: python-wifi-password-parse
      - id: objectives/command-and-control/backdoor/tasking/http::python-http-url-eval-backdoor
  # Obfuscated script variant: the netsh invocation is built entirely
  # from variables (typically single-character fragments) so the literal
  # netsh-wlan-key-clear legs never appear, but the script still parses
  # the Key Content line that only a key=clear query produces. Plain
  # admin recovery scripts name netsh literally and stay notable above;
  # hiding the command name is what earns the hostile level here.
  - id: powershell-obfuscated-wifi-password-extraction
    desc: Obfuscated PowerShell extracts saved Wi-Fi passwords
    crit: hostile
    conf: 0.95
    mbc: E1003
    for: [powershell]
    all:
      - id: powershell-variable-command-invocation
      - id: netsh-wlan-key-content-parse
