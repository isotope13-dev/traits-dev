# Outlook Express / Windows Mail account credentials. The Internet Account
# Manager registry store and its POP3/IMAP Password2 values are
# platform-mandated names; reading them is credential acquisition from a
# targeted store. Recovery utilities read the same store, so the harvest
# atom alone stays suspicious and known dual-use readers are excluded.
defaults:
  platforms: [windows]
  for: [pe, dll]
traits:
  - id: internet-account-manager-accounts-path
    desc: Internet Account Manager Accounts key path
    crit: notable
    conf: 0.95
    if:
      type: text
      substr: 'Internet Account Manager\Accounts'

  - id: pop3-imap-protected-password-value
    desc: Outlook Express stored mail password value name
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: '(?i)\b(POP3|IMAP) Password2\b'

composite_rules:
  - id: outlook-express-account-password-harvest
    desc: Outlook Express mail-account password harvest from the registry
    crit: suspicious
    conf: 0.9
    attack: T1555
    all:
      - id: internet-account-manager-accounts-path
      - id: pop3-imap-protected-password-value
    unless:
      - id: well-known/tool/sysadmin/nirsoft/
      - id: well-known/lib/platform/wine/
