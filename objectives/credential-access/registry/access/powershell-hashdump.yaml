# The PowerShell offline-hashdump lineage derives the boot key from the
# double-SAM path (HKLM:\SAM\SAM\Domains\Account) and enumerates the user
# subkeys to decrypt NTLM hashes — an implemented dumper, not a template.
defaults:
  platforms: [windows]
  for: [powershell]

traits:
- id: powershell-sam-bootkey-helper
  desc: PowerShell boot-key derivation helper declared
  crit: notable
  conf: 0.94
  # `function Get-BootKey` is the canonical helper of the PowerShell
  # offline-hashdump lineage (reads HKLM:\SAM\SAM\Domains\Account to
  # rebuild the syskey for NTLM hash decryption).
  if:
    type: text
    regex: '(?i)function\s+Get-BootKey\b'

composite_rules:
- id: powershell-sam-bootkey-hashdump
  desc: PowerShell reads SAM boot-key user keys for hashdump
  crit: suspicious
  conf: 0.95
  attack: T1003.002
  near_bytes: 8192
  all:
  - id: micro-behaviors/os/registry/keys/credential::powershell-sam-account-users-path
  - id: powershell-sam-bootkey-helper
