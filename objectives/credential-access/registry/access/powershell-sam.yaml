composite_rules:
- id: powershell-sam-des-hash-decryption
  desc: PowerShell decrypts SAM account hash records
  crit: hostile
  conf: 0.97
  for:
  - powershell
  platforms:
  - windows
  attack: T1003.002
  all:
  - id: micro-behaviors/os/registry/read::powershell-sam-account-data-read
  - id: "micro-behaviors/os/registry/credential/reference::powershell-sam-account-users-path"
  - id: "micro-behaviors/os/security/lsa::lsa-control-key-path"
  - id: micro-behaviors/crypto/decrypt/initialize::dotnet-create-decryptor
  - id: micro-behaviors/crypto/cipher/unspecified::dotnet-transform-final-block
  any:
  - id: micro-behaviors/crypto/symmetric/des::powershell-des-create
  - id: micro-behaviors/crypto/symmetric/des::powershell-des-provider-create
