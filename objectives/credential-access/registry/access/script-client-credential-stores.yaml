# A web-page script that runs under WSH or a COM bridge and reads the account
# stores of several mail and FTP clients, then builds one report string, is
# harvesting credentials. Each store is ordinary for its own client; reading
# two unrelated ones from a script is the theft signal. The matchers read
# source text, so both single and doubled backslashes in string literals match.
defaults:
  platforms: [windows]
  for: [javascript, html, vbs]
  attack: T1555,T1552.001
traits:
  - id: script-oe-account-store-path
    desc: Script names the Outlook Express accounts key
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)Internet Account Manager\\{1,2}Accounts'

  - id: script-the-bat-registry-path
    desc: Script names The Bat! mail client key
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)Software\\{1,2}RIT\\{1,2}The Bat'

  - id: script-total-commander-ftp-ini
    desc: Script names the Total Commander FTP list
    crit: notable
    conf: 0.9
    if:
      type: text
      substr: wcx_ftp.ini
      case_insensitive: true

composite_rules:
  - id: script-registry-or-file-read
    desc: Script reads a registry value or a text file
    crit: component
    any:
      - id: micro-behaviors/os/registry/read::js-regread-method-call
      - id: micro-behaviors/os/registry/read::wscript-regread
      - id: micro-behaviors/fs/read/file/handle::open-text-file-call

  - id: script-mail-ftp-client-credential-harvest
    desc: Script reads several mail and FTP client credential stores
    crit: hostile
    conf: 0.93
    all:
      - id: script-registry-or-file-read
    any:
      - id: script-oe-account-store-path
      - id: script-the-bat-registry-path
      - id: script-total-commander-ftp-ini
    needs: 2
