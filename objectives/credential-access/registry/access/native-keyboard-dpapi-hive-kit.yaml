defaults:
  platforms: [windows]
  for: [pe, dll]
composite_rules:
  # Keyboard-state polling, DPAPI unprotect and registry hive save in one
  # unsigned native image is a local credential-harvest capability set. Each
  # leg is common in legitimate software on its own; the combination with no
  # signer is not. The rule claims the capability, not a completed theft.
  - id: native-keyboard-dpapi-hive-kit
    desc: Unsigned native PE polls keys, unprotects DPAPI and saves hives
    crit: hostile
    conf: 0.9
    attack: T1555,T1056.001,T1003.002
    all:
      - id: micro-behaviors/hardware/input/keyboard/poll::get-async-key-state
      - id: micro-behaviors/os/security/dpapi::crypt-unprotect-data-api
      - id: micro-behaviors/os/registry/hive/save::reg-save-key
      - id: metadata/signature/absent::unsigned-missing-signature-record
