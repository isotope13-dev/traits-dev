defaults:
  platforms: [windows]
  for: [pe, dll]
  conf: 0.98

traits:
  - id: sam-hash-report-heading
    desc: SAM password-hash report heading
    crit: notable
    if:
      type: text
      exact: '[*] SAM hashes'
      section: .text

  - id: lsa-secret-report-heading
    desc: LSA secret-dump report heading
    crit: notable
    if:
      type: text
      exact: '[*] LSA Secrets'
      case_insensitive: true
      section: .text

composite_rules:
  - id: managed-sam-hash-recovery
    desc: SAM hive parser with hash decryption and hash-report output
    crit: hostile
    attack: T1003.002
    all:
      - id: micro-behaviors/os/registry/credential/reference::sam-domains-account-subpath
      - id: metadata/binary/symbols/name/registry/hive::sam-hive-parser-reference
      - id: micro-behaviors/crypto/decrypt/transform/unspecified::hash-record-decryption-helper-reference
      - id: sam-hash-report-heading

  - id: managed-remote-lsa-secret-recovery
    desc: Remote hive-dump helper with LSA secret parsing and report output
    crit: hostile
    attack: T1003.004
    all:
      - id: micro-behaviors/os/registry/credential/reference::lsa-policy-secrets-subpath
      - id: metadata/binary/symbols/name/registry/hive::lsa-hive-parser-reference
      - id: metadata/binary/symbols/name/registry/hive::remote-hive-dump-helper-reference
      - id: lsa-secret-report-heading
