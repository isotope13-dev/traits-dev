# Offline SAM reads plus a hash-authorized password change, as in BlueHammer
# Stage 7. Co-occurrence does not prove which recovered bytes reach SAMR.
defaults:
  platforms: [windows]
  for: [source, scripts]

composite_rules:
  - id: offline-sam-read-password-replacement
    desc: Offline SAM reads accompany SAMR password replacement
    crit: hostile
    conf: 0.98
    attack: T1003.002,T1098
    all:
      - id: micro-behaviors/os/registry/offline-hive::offreg-open-hive-by-handle-call
      - id: micro-behaviors/os/registry/read::offreg-get-value-call
      - id: micro-behaviors/os/registry/credential/reference::sam-domains-account-subpath
      - id: micro-behaviors/fs/path/account-db::windows-sam-hive-path
      - id: micro-behaviors/os/user/modify::sam-password-change-api-reference
    near_bytes: 16384
