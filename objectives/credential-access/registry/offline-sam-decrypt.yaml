# BlueHammer stage 7 reads an offline SAM, obtains LSA bootkey material
# from registry key classes, and decrypts account material with CryptoAPI.
# This conjunction also permits legitimate credential-recovery software.
# It describes co-occurrence, not a proven buffer or handle data-flow binding.
defaults:
  platforms: [windows]
  for: [source, scripts]

composite_rules:
  - id: offline-sam-reads-with-lsa-decryption
    desc: Offline SAM reads with LSA key queries and decryption
    crit: suspicious
    conf: 0.97
    attack: T1003.002
    all:
      - id: micro-behaviors/os/registry/hive::offreg-open-hive-by-handle-call
      - id: micro-behaviors/os/registry/read::offreg-get-value-call
      - id: micro-behaviors/os/registry/keys/credential::sam-domains-account-subpath
      - id: micro-behaviors/fs/path/account-db::windows-sam-hive-path
      - id: micro-behaviors/os/registry/keys/policy::lsa-control-key-path
      - id: micro-behaviors/os/registry/read::query-key-info-call
      - id: micro-behaviors/crypto/decrypt::crypt-decrypt
    near_bytes: 16384
