# Desktop capture and input APIs alone also describe remote administration.
# Require the targeted Outlook store, registry queries, enumeration and DPAPI
# as independent evidence. This remains a file-scoped API profile, not a
# source-to-decryption proof or evidence of unauthorized remote control.
defaults:
  platforms: [windows]
  for: [pe, dll]

composite_rules:
  - id: desktop-control-outlook-dpapi-profile
    desc: Desktop-control APIs with Outlook registry and DPAPI references
    crit: suspicious
    conf: 0.93
    attack: T1555
    all:
      - id: micro-behaviors/hardware/input/keyboard/poll::get-keyboard-state
      - id: micro-behaviors/hardware/display/screenshot::gdi-screen-capture-primitives
      - id: micro-behaviors/hardware/input/event::synthetic-user-input
      - id: micro-behaviors/os/registry/keys/credential::outlook-profile-registry-key
      - id: micro-behaviors/os/registry/access::reg-query-value-ex-a-symbol
      - id: micro-behaviors/os/registry/access::reg-enum-key-ex-a-symbol
      - id: micro-behaviors/os/security/dpapi::crypt-unprotect-data-api
    unless:
      - id: metadata/signed/platform/
      - id: well-known/dual-use/
