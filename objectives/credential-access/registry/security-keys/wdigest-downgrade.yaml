# WDigest plaintext-caching downgrade: the UseLogonCredential value forces
# LSASS to cache passwords in cleartext, so the next credential dump harvests
# them. Malware enables it with a reg add command or PowerShell; documentation
# that only discusses the setting never carries the executed command shape.
defaults:
  for: [binaries, scripts, source]
  platforms: [windows]
  attack: T1112

traits:
  - id: wdigest-uselogoncredential-reg-add-command
    desc: reg add enables WDigest UseLogonCredential
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)\breg\s+add\s+"?[^"\r\n]{0,120}WDigest[^\r\n]{0,40}UseLogonCredential'

composite_rules:
  - id: wdigest-uselogoncredential-downgrade
    desc: WDigest downgrade beside autostart persistence setup
    crit: hostile
    conf: 0.95
    all:
      - id: objectives/credential-access/registry/security-keys::wdigest-uselogoncredential-reg-add-command
    any:
      - id: micro-behaviors/os/registry/write::x86-windows-logon-run-value-write
      - id: micro-behaviors/os/registry/keys/autostart::currentversion-run-key-path
