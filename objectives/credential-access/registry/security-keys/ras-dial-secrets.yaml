# Saved RAS dial-up / VPN passwords live as LSA private data under fixed
# secret names (`L$_RasDefaultCredentials#0`, `RasDialParams!<SID>#0`), backed
# by HKLM\SECURITY\Policy\Secrets. Gh0st-lineage "Bjlog" password stealers
# (sha 2271192a) XOR-hide both names beside the rasphone.pbk path and parse
# the phonebook's PhoneNumber/Device/DialParamsUID entries to pair each entry
# with its secret; the LSA calls are hash-resolved, LsaFreeMemory is imported.
defaults:
  platforms: [windows]
  for: [pe, dll]
  attack: T1003.004

composite_rules:
  # Password-recovery utilities read the same secrets in the clear; that
  # stays suspicious. Windows' own RAS libraries are excluded by signature.
  - id: ras-credential-secret-reader
    desc: Reads RAS dial-up passwords from LSA secrets
    crit: suspicious
    conf: 0.9
    all:
      - id: micro-behaviors/os/security/lsa::ras-credential-secret-name
    any:
      - id: micro-behaviors/os/security/lsa::lsa-retrieve-private-data-import
      - id: micro-behaviors/os/security/lsa::lsa-secret-or-rights-api-reference
      - id: micro-behaviors/communications/socket/ras::ras-phonebook-path
    needs: 1
    unless:
      - id: metadata/signature/verified/platform::microsoft

  # Admission: the secret name is recoverable only by decoding, so the reader
  # conceals which credential store it opens, and LSA API use is present.
  # No RAS client or recovery utility needs to hide this constant.
  - id: concealed-ras-credential-secret-reader
    desc: Hidden RAS password secret with LSA calls
    crit: hostile
    conf: 0.93
    all:
      - id: micro-behaviors/os/security/lsa::ras-credential-secret-name-encoded
    any:
      - id: micro-behaviors/os/security/lsa::lsa-retrieve-private-data-import
      - id: micro-behaviors/os/security/lsa::lsa-secret-or-rights-api-reference
      - id: micro-behaviors/os/security/lsa::lsa-open-policy
      - id: micro-behaviors/os/security/lsa::lsa-free-memory-import
    needs: 1
    unless:
      - id: metadata/signature/verified/platform::microsoft
