defaults:
  platforms: [windows]
  for: [pe, dll]
  attack: T1555.003
  mbc: B0028

traits:
composite_rules:
  - id: ie-protected-storage-credential-theft
    desc: IE Protected Storage credential theft
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/os/security/protected-storage::pstore-factory-reference
    any:
      - id: micro-behaviors/data/format/credentials::pstore-pass-sites-report-label
      - id: micro-behaviors/data/format/credentials::pstore-autocomplete-password-report-label
      - id: micro-behaviors/data/format/credentials::username-password-report-format
    needs: 2
    unless:
      - id: well-known/tool/sysadmin/sandboxie/
      - id: metadata/file/profile/source-indications/
