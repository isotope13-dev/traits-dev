defaults:
  platforms: [windows]
  for: [pe, dll]
  attack: T1555.003
  mbc: B0028

traits:
  - id: pstore-browser-pass-sites
    desc: IE Protected Storage pass_sites
    crit: suspicious
    conf: 0.96
    if:
      type: text
      exact: pass_sites
  - id: pstore-autocomplete-pass
    desc: IE autocomplete password store
    crit: suspicious
    conf: 0.96
    if:
      type: text
      exact: auto_complete_pass

composite_rules:
  - id: ie-protected-storage-credential-theft
    desc: IE Protected Storage credential theft
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/os/security/protected-storage::pstore-factory-reference
    any:
      - id: pstore-browser-pass-sites
      - id: pstore-autocomplete-pass
      - id: micro-behaviors/data/format/credentials::username-password-report-format
    needs: 2
    unless:
      - id: well-known/tool/sysadmin/sandboxie/
      - id: metadata/lang/source/
