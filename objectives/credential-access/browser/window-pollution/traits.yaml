defaults:
  platforms: [windows, unix]
  for:
    - javascript
    - typescript
traits:
  - id: window-expose-sensitive-1
    desc: Assigns sensitive property on window
    crit: suspicious
    conf: 0.7
    if:
      type: symbol
      kind: bind
      regex: '^window\.(getToken|login|auth)$'
  - id: window-expose-sensitive-2
    desc: Assigns sensitive property on window
    crit: suspicious
    conf: 0.75
    if:
      type: symbol
      kind: bind
      regex: '^window\.(key|secret|token)$'
