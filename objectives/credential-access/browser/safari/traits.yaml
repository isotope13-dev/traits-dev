defaults:
  attack: T1555.003
  platforms:
    - unix
    - windows
    - macos
  for:
    - shell
    - applescript
    - macho
traits:
  - id: objectivec-facebook-session-cookie-fields
    desc: "Facebook session-cookie field references"
    crit: suspicious
    conf: 0.98
    platforms: [macos]
    for: [objectivec]
    if:
      type: text
      regex: 'getFacebook[\s\S]{0,500}c_user[\s\S]{0,300}\bxs\b'
