defaults:
  attack: T1555.003
  platforms:
    - unix
    - windows
    - macos
  for:
    - shell
    - applescript
    - macho
traits:
  - id: objectivec-binarycookies-path
    desc: Objective-C reads the macOS binary cookie jar
    crit: notable
    conf: 0.95
    platforms: [macos]
    for: [objectivec]
    if:
      type: text
      substr: /Library/Cookies/Cookies.binarycookies

  - id: objectivec-facebook-session-cookie-fields
    desc: Objective-C extracts Facebook cookie fields
    crit: suspicious
    conf: 0.98
    platforms: [macos]
    for: [objectivec]
    if:
      type: text
      regex: 'getFacebook[\s\S]{0,500}c_user[\s\S]{0,300}\bxs\b'

  - id: objectivec-ssl-cookie-send
    desc: Objective-C sends data through SSL_write
    crit: notable
    conf: 0.94
    platforms: [macos]
    for: [objectivec]
    if:
      type: text
      word: SSL_write

  - id: cookies-path
    desc: macOS system cookies path
    crit: component
    conf: 0.8
    platforms:
      - macos
    for:
      - python
      - javascript
      - shell
    if:
      type: string_literal
      substr: /Library/Cookies
  - id: binarycookies
    desc: References a macOS browser binary cookies file
    crit: suspicious
    conf: 0.8
    platforms:
      - macos
    if:
      type: text
      regex: '(?i)(Safari[/\\]+|/Library/Cookies[/\\]+)[^/\\\n]{1,80}\.binarycookies\b'
    unless:
      - id: well-known/lib/ai/unsloth::unsloth-package-context
      - id: well-known/app/ai/media/comfy-desktop::comfy-reset-mac-path
      - id: well-known/app/storage/carbon-copy-cloner::official-carbon-copy-cloner-member
  - id: cookies-binarycookies
    desc: References Safari Cookies.binarycookies path
    crit: suspicious
    conf: 0.85
    platforms:
      - macos
    if:
      type: text
      regex: '(?i)(Safari[/\\]+|/Library/Cookies[/\\]+)Cookies\.binarycookies\b'
    unless:
      - id: well-known/app/storage/carbon-copy-cloner::official-carbon-copy-cloner-member
  - id: localstorage
    desc: Safari LocalStorage path
    crit: suspicious
    conf: 0.75
    platforms:
      - macos
    if:
      type: text
      substr: Safari/LocalStorage
    unless:
      - id: well-known/app/utility/macos-cleaners::macos-cleaner-app
composite_rules:
  - id: objectivec-facebook-session-cookie-theft
    desc: Objective-C steals Facebook session cookies and sends them over TLS
    crit: hostile
    conf: 0.995
    attack: T1539
    platforms: [macos]
    for: [objectivec]
    all:
      - id: objectivec-binarycookies-path
      - id: objectivec-facebook-session-cookie-fields
      - id: objectivec-ssl-cookie-send

  - id: safari-cookie-artifact-reference
    desc: Safari cookie artifact reference
    crit: suspicious
    conf: 0.85
    platforms:
      - macos
    any:
      - id: cookies-path
      - id: binarycookies
      - id: cookies-binarycookies
    unless:
      - id: well-known/app/storage/carbon-copy-cloner::official-carbon-copy-cloner-member
