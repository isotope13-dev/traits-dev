defaults:
  platforms: [macos]
  for: [applescript, shell, macho]
  conf: 0.96
  attack: T1539

traits:
  # The filename is the Safari store's platform-defined name. Require the
  # duplication operation and destination, not merely a cookie-store path.
  # Optional escapes cover source embedded in an osascript command string.
  - id: applescript-safari-cookie-duplicate
    desc: AppleScript duplicates Safari cookie database
    crit: suspicious
    if:
      type: text
      regex: '\bduplicate file.{0,100}Cookies\.binarycookies\\?".{0,40}to folder\b'

composite_rules:
  - id: phished-password-safari-cookie-copy
    desc: Validated password prompt with Safari cookie copying
    crit: hostile
    attack: T1056.002,T1539
    all:
      - id: applescript-safari-cookie-duplicate
      - id: objectives/credential-access/phishing/lure::password-phishing-comp
