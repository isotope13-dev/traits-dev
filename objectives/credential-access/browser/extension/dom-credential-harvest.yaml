# Browser extensions that inject content scripts to capture login credentials
# (passwords and usernames) from the DOM and forward them.
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript, chrome-manifest, crx, zip]
  attack: T1056.003
  mbc: B0030

composite_rules:
  - id: extension-dom-credential-harvest
    desc: Browser extension captures and forwards web page login credentials
    crit: hostile
    conf: 0.98
    scope: archive
    for: [crx, zip, javascript, chrome-manifest]
    all:
      - id: metadata/file/format/browser-extension::web-extension-root-manifest
      - id: micro-behaviors/ui/window/password-field::browser-credential-field-pair
      - id: micro-behaviors/data/serialize/json::json-stringify-key-password-body
      - id: micro-behaviors/communications/http/request/client::fetch-post-pattern
    any:
      - id: metadata/permission/host::broad-host-access
      - id: metadata/permission/manifest::permission-all-urls
