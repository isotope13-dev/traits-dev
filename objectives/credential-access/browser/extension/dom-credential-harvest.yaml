# Browser extensions that inject content scripts to capture login credentials
# (passwords and usernames) from the DOM and forward them.
defaults:
  platforms: [windows, unix]
  attack: T1056.003
  mbc: B0030

composite_rules:
  # Benign context: the password body is aimed at the application's own
  # account authentication API (the conventional `/api/auth/...` route
  # family), i.e. the script implements its own sign-in form, not a channel
  # for page-credential harvesting. A stealer POSTs harvested page
  # credentials to a collector endpoint, not to an account-auth route.
  - id: first-party-account-auth-signin
    desc: First-party account auth API sign-in flow
    crit: exception
    conf: 0.95
    for: [javascript, typescript]
    all:
      - id: micro-behaviors/data/serialize/json::json-stringify-password-body
      - id: micro-behaviors/communications/http/login::account-auth-api-route

  - id: extension-dom-credential-harvest
    desc: Browser extension captures and forwards web page login credentials
    crit: hostile
    conf: 0.98
    scope: archive
    for: [crx, xpi, zip, javascript, chrome-manifest]
    all:
      - id: metadata/file/format/browser-extension::web-extension-root-manifest
      - id: micro-behaviors/communications/http/form::script-dom-credential-post
      - id: micro-behaviors/communications/http/request/credentials::page-password-fields-remote-json-post
    any:
      - id: metadata/permission/host::broad-host-access
      - id: metadata/permission/manifest::permission-all-urls
    unless:
      - id: first-party-account-auth-signin
