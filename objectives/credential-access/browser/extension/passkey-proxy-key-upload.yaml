# An all-site extension that takes over WebAuthn registration through
# chrome.webAuthenticationProxy, mints the credential itself, exports the
# private key as JWK and POSTs it to a network service. Every passkey the user
# "creates" on any site is then a key the remote service holds. Remote-desktop
# clients (the API's intended user) forward the request instead of minting
# and exporting keys; vault-style managers inject navigator.credentials rather
# than attaching the proxy.
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript, chrome-manifest, crx, xpi, zip, npm]
  attack: T1556,T1555.003

composite_rules:
  - id: extension-webauthn-proxy-private-key-upload
    desc: Extension uploads proxied passkey private keys
    crit: hostile
    conf: 0.95
    scope: archive
    all:
      - id: metadata/permission/manifest::host-permission-all-urls
      - id: micro-behaviors/os/security/auth/passkey::webauthn-proxy-create-request-listener
      - id: micro-behaviors/crypto/key/representation::webcrypto-private-key-jwk-export
    any:
      - id: micro-behaviors/communications/http/post::fetch-post-call
      - id: micro-behaviors/communications/http/post::fetch-flow-json-post-body
      - id: micro-behaviors/communications/http/request/json::fetch-json-stringify-body
