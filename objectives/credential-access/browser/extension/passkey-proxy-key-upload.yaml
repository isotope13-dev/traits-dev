# An all-site extension that answers WebAuthn creation through
# chrome.webAuthenticationProxy, mints the credential itself, exports the
# private key as JWK and can POST it to a network service. That is a
# security-boundary crossing: the extension becomes the browser's sole
# authenticator and the minted keys are extractable by design. A software
# passkey vault can use the same proxy, so the hostile finding requires
# evidence that the item returned by the credential constructor itself is
# serialized into an outbound request. Remote-desktop forwarders, the API's
# other intended user, relay requests instead of minting keys.
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript, chrome-manifest, crx, xpi, zip, npm]
  attack: T1556,T1555.003

composite_rules:
  - id: extension-webauthn-proxy-private-key-upload
    desc: Extension uploads proxied passkey private keys
    crit: hostile
    conf: 0.9
    scope: archive
    all:
      - id: metadata/permission/host::host-permission-all-urls
      - id: micro-behaviors/os/security/auth/passkey::webauthn-proxy-create-request-listener
      - id: micro-behaviors/crypto/key/representation::webcrypto-private-key-jwk-export
      - id: micro-behaviors/os/security/auth/passkey::webauthn-created-item-post
    any:
      - id: micro-behaviors/communications/http/post::fetch-post-call
      - id: micro-behaviors/communications/http/post::fetch-flow-json-post-body
      - id: micro-behaviors/communications/http/request/json::fetch-json-stringify-body

