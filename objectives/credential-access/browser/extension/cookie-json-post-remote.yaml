defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  attack: T1539,T1185

composite_rules:
  # Extension enumerates the browser's cookies for a site, serializes the
  # cookie field into a JSON body, and POSTs it to a remote host. Session
  # cookies leaving the browser for a third-party API is account takeover.
  # Cookie-sync helpers with a first-party endpoint are not separated here;
  # the cookie-body atom needs the cookie named in the same object literal.
  - id: extension-cookie-json-post-remote
    desc: Extension posts enumerated site cookies to a remote host
    crit: hostile
    conf: 0.95
    all:
      - id: micro-behaviors/communications/http/cookie-store::chrome-cookies-get-all
      - id: micro-behaviors/communications/http/cookies::cookie-stringify-body
      - id: micro-behaviors/communications/http/post::request-options-post-method
      - id: micro-behaviors/communications/url/host/domain-http::js-remote-host-url
