defaults:
  platforms: [windows, unix]
  for: [javascript]

traits:
  - id: session-dump-task-case
    desc: Dispatches a browser session dump task
    crit: notable
    if:
      type: text
      regex: 'case\s+["'']dump(Session|Cookies)["'']\s*:'

composite_rules:
  - id: cdp-cookie-session-dump-task
    desc: Extension cookie extraction beside session dump task dispatch
    crit: suspicious
    conf: 0.96
    attack: T1539
    near_bytes: 2000
    all:
      - id: session-dump-task-case
      - id: micro-behaviors/process/attach/webextension::chrome-debugger-attach
      - id: micro-behaviors/communications/http/devtools/client::cdp-cookie-getter-literal
