# A browser extension that can read every site's cookies *and* talk to a
# native program on the host. Either half is ordinary on its own -- session
# managers read cookies, password managers speak native messaging -- but
# together they are the browser-to-host pivot: session tokens for every site
# the user is signed into, handed to a binary outside the browser's sandbox
# where no extension policy or store review can see what happens next.
#
# The pairing is what is unusual. The mainstream password managers that use
# native messaging (1Password, Bitwarden, KeePassXC) do not request the
# `cookies` permission -- they fill forms, they do not harvest sessions.
defaults:
  platforms: [unix, windows]
  for: [chrome-manifest, crx, xpi, zip]
  attack: T1539
  mbc: E1539

composite_rules:
  - id: extension-native-bridge-cookie-access
    desc: Extension can bridge all-site cookies to a native host
    crit: suspicious
    conf: 0.9
    scope: archive
    all:
      - id: metadata/permission/extension-api::permission-native-messaging
      - id: metadata/permission/cookie::permission-cookies
    any:
      - id: metadata/permission/manifest::host-permission-all-urls
      - id: metadata/permission/host::content-script-all-urls
