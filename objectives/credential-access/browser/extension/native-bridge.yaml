# Browser extensions that request all-site cookie access and native messaging
# combine two sensitive capabilities. This permission pairing identifies the
# browser-to-host risk surface; it does not prove that cookie data actually
# flows to the native program.
#
# Password managers that use native messaging generally do not request the
# `cookies` permission. A cookie manager or downloader may need both for
# separate first-party functions, so treat this capability pairing as
# suspicious evidence rather than proof of credential theft.
defaults:
  platforms: [unix, windows]
  for: [chrome-manifest, crx, xpi, zip]
  attack: T1539
  mbc: E1539

composite_rules:
  - id: extension-native-bridge-cookie-access
    desc: Extension combines cookie access and native messaging
    crit: suspicious
    conf: 0.9
    scope: archive
    all:
      - id: metadata/permission/extension-api::permission-native-messaging
      - id: metadata/permission/cookie::permission-cookies
    any:
      - id: metadata/permission/manifest::host-permission-all-urls
      - id: metadata/permission/host::content-script-all-urls
