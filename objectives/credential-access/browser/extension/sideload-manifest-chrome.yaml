# A browser-extension manifest built for out-of-store distribution and browser
# data theft. Two facts combine into an unusual shape:
#
#   * a pinned extension identity — the `key` field carries the RSA public key
#     that fixes the extension ID. A store-published extension does not ship
#     `key`: Chrome assigns its ID. Shipping the key pins the ID so an external
#     installer (or an enterprise policy) can predict and register it — the
#     defining need of a sideloaded extension, and
#   * a browser-data-theft permission set — cookies, request interception, and
#     an all-URLs content-script reach.
#
# Either fact alone is benign (developers pin keys; privacy tools read cookies).
# Together they describe an extension that is both distributed outside the store
# and equipped to harvest sessions from every site — the KREMLIN "AVSync" /
# "FrameSync" extension and its lineage. This is JSON, so it holds even when the
# extension's JavaScript is obfuscated.
defaults:
  platforms: [windows, unix]
  for: [chrome-manifest]
  attack: T1176.001,T1539

traits:
  # The `key` field is a base64 RSA SubjectPublicKeyInfo that pins the extension
  # ID. Present in unpacked/dev and sideloaded extensions; absent from the
  # manifest of anything the Web Store publishes. The length floor rejects a
  # stray short `key` used for some unrelated purpose.
  - id: manifest-pinned-extension-key
    desc: Manifest pins extension ID via key
    crit: notable
    conf: 0.9
    if:
      type: value
      path: key
      regex: '^[A-Za-z0-9+/]{100,}={0,2}$'

composite_rules:
  # Pinned-for-sideload identity plus the cookie-theft + request-interception +
  # all-sites reach that a session stealer needs. No legitimate store extension
  # combines an out-of-store pinned key with this permission set.
  - id: sideload-pinned-browser-stealer-manifest
    desc: Sideloaded all-sites cookie-stealer manifest
    crit: hostile
    conf: 0.95
    all:
      - id: manifest-pinned-extension-key
      - id: metadata/permission/cookie::permission-cookies
      - id: metadata/permission/manifest::host-permission-all-urls
    any:
      - id: metadata/permission/network::network-request-modification
      - id: metadata/permission/network::web-request
    needs: 1
