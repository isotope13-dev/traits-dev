# Automatic unfiltered acquisition at a lifecycle event is unusual for a
# cookie utility. This does not assert that host permissions were granted.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
traits:
  - id: extension-install-unfiltered-cookie-read
    desc: Install/update requests unfiltered cookies
    crit: suspicious
    conf: 0.96
    attack: T1539
    if:
      type: tree-sitter
      query: |
        ((call_expression
          function: (member_expression
            object: (member_expression
              object: (member_expression
                object: (identifier) @browser
                property: (property_identifier) @runtime)
              property: (property_identifier) @event)
            property: (property_identifier) @listen)
          arguments: (arguments
            . (arrow_function
              parameters: (formal_parameters) @params
              body: (statement_block
                . (expression_statement
                  (call_expression
                    function: (member_expression
                      object: (member_expression
                        object: (identifier) @browser_read
                        property: (property_identifier) @store)
                      property: (property_identifier) @get)
                    arguments: (arguments . (object) @filter . (arrow_function)))))))) @read
          (#match? @browser "^(chrome|browser)$")
          (#eq? @browser @browser_read)
          (#match? @params "^\\(\\s*\\)$")
          (#eq? @runtime "runtime")
          (#eq? @event "onInstalled")
          (#eq? @listen "addListener")
          (#match? @filter "^\\{\\s*\\}$")
          (#eq? @store "cookies")
          (#eq? @get "getAll"))
