# A content script that re-reads the page's password field on a timer and
# ships each value to the background worker. Password managers capture a
# login on submit; polling the live field every second or two captures the
# secret as it is typed, whether or not the user ever submits.
defaults:
  platforms: [unix, windows]
  attack: T1056.003

composite_rules:
  - id: timer-polled-password-relay
    desc: Content script polls password field and messages its value
    crit: hostile
    conf: 0.9
    scope: leaf
    for: [javascript, typescript]
    near_bytes: 500
    all:
      - id: micro-behaviors/time/schedule/interval::setInterval
      - id: micro-behaviors/ui/controls/credential::password-input-value-read
      - id: micro-behaviors/communications/ipc/extension-message::runtime-message-password-member
