# Browser extensions that enumerate the cookie store and POST the jar to a
# remote API. Covers Avito/Telegram-Ads session helpers (avistorm, tele-scope)
# and similar site-scoped stealers that never request <all_urls>.
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
  attack: T1539,T1041

traits:
  - id: jquery-post-stringified-cookies
    desc: jQuery POSTs stringified cookies object
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: '\$\.post\s*\(\s*\{[\s\S]{0,400}JSON\.stringify\s*\(\s*cookies\b'

composite_rules:
  # Some extensions send selected cookie fields rather than a serialized
  # cookie jar, so the existing `cookies-json-body` rule does not see them.
  # Broad host authority, the cookies permission, cookie-store enumeration,
  # and an off-site POST together identify the same session-collection shape.
  - id: broad-extension-cookie-api-remote-post
    desc: Broad-access extension posts extension-store cookies remotely
    crit: suspicious
    conf: 0.97
    scope: archive
    for: [crx, xpi, zip, javascript, chrome-manifest]
    all:
      - id: metadata/permission/host::broad-host-access
      - id: metadata/permission/cookie::permission-cookies
      - id: micro-behaviors/communications/http/request/client::fetch-post-pattern
      - id: micro-behaviors/communications/http/url/domain::js-remote-host-url
    # The description claims cookies are what gets posted, so require evidence
    # of that: either a profile-wide read (no legitimate caller needs one) or
    # cookie material placed in a request body. A `cookies.getAll({url: tab})`
    # -- the scoped read a shortlink resolver uses to pull one value off the
    # page it is already on -- is not that, and previously matched on its own.
    any:
      - id: objectives/supply-chain/hidden-payload/extensions/backdoor::extension-cookie-read-upload-handler
      - id: micro-behaviors/communications/http/cookies::cookie-field-in-request-object
      - id: micro-behaviors/data/serialize/schema-object::cookies-json-body
      - id: micro-behaviors/communications/http/cookies::cookie-map-name-value
    needs: 1
    unless:
      - id: micro-behaviors/communications/http/cookies::same-origin-extension-cookie-request

  - id: extension-cookie-store-remote-post
    desc: Extension POSTs enumerated cookie jar cross-origin
    crit: suspicious
    conf: 0.98
    all:
      - id: micro-behaviors/communications/http/cookies::chrome-cookies-get-all-text
      - id: micro-behaviors/communications/http/request/client::fetch-post-pattern
      - id: micro-behaviors/data/serialize/schema-object::cookies-json-body
      - id: micro-behaviors/communications/http/url/domain::js-remote-host-url
    any:
      - id: micro-behaviors/communications/http/cookies::cookie-map-name-value
      - id: micro-behaviors/communications/http/request/client::http-post-json
    needs: 1
    unless:
      - id: micro-behaviors/communications/http/cookies::same-origin-extension-cookie-request

  - id: extension-cookie-jar-jquery-upload
    desc: Extension jQuery-uploads cookie jar remotely
    crit: hostile
    conf: 0.97
    all:
      - id: micro-behaviors/communications/http/cookies::chrome-cookies-get-all-text
      - id: jquery-post-stringified-cookies
      - id: micro-behaviors/communications/http/url/domain::js-remote-host-url
    unless:
      - id: micro-behaviors/communications/http/cookies::same-origin-extension-cookie-request
