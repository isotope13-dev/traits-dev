# Browser extensions that enumerate the cookie store and POST the jar to a
# remote API. Covers Avito/Telegram-Ads session helpers (avistorm, tele-scope)
# and similar site-scoped stealers that never request <all_urls>.
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
  attack: T1539,T1041

traits:
  - id: jquery-post-stringified-cookies
    desc: jQuery POSTs stringified cookies object
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: '\$\.post\s*\(\s*\{[\s\S]{0,400}JSON\.stringify\s*\(\s*cookies\b'

composite_rules:
  - id: extension-cookie-store-remote-post
    desc: Extension POSTs enumerated cookie jar cross-origin
    crit: suspicious
    conf: 0.98
    all:
      - id: micro-behaviors/communications/http/cookies::chrome-cookies-get-all-text
      - id: micro-behaviors/communications/http/request/client::fetch-post-pattern
      - id: micro-behaviors/data/serialize/schema-object::cookies-json-body
      - id: micro-behaviors/communications/http/url/domain::js-remote-host-url
    any:
      - id: micro-behaviors/communications/http/cookies::cookie-map-name-value
      - id: micro-behaviors/communications/http/request/json::http-post-json
    needs: 1
    unless:
      - id: micro-behaviors/communications/http/cookies::same-origin-extension-cookie-request
    # Suppressors are file-scoped; the vendor identity lives in the manifest.
    downgrade:
      scope: archive
      any:
        - id: well-known/app/browser-extension/notionhub::notionhub-extension-context

  - id: extension-cookie-jar-jquery-upload
    desc: Extension jQuery-uploads cookie jar remotely
    crit: hostile
    conf: 0.97
    all:
      - id: micro-behaviors/communications/http/cookies::chrome-cookies-get-all-text
      - id: jquery-post-stringified-cookies
      - id: micro-behaviors/communications/http/url/domain::js-remote-host-url
    unless:
      - id: micro-behaviors/communications/http/cookies::same-origin-extension-cookie-request

  - id: extension-all-urls-cookie-store-remote-upload
    desc: All-urls extension enumerates cookie store and POSTs to remote host
    crit: hostile
    conf: 0.98
    scope: archive
    for: [crx, zip, chrome-manifest, javascript]
    all:
      - id: metadata/permission/host::host-permission-all-urls
      - id: metadata/permission/cookie::permission-cookies
      - id: micro-behaviors/communications/http/cookies::chrome-cookies-get-all
      - id: micro-behaviors/communications/http/post::js-fetch-post-request
    any:
      - id: micro-behaviors/communications/http/url/domain::js-hardcoded-remote-endpoint
      - id: micro-behaviors/communications/ip/literal::http-ip-url-source-literal
      - id: micro-behaviors/communications/http/url/domain::js-remote-host-url
    needs: 1
    unless:
      - id: micro-behaviors/communications/http/cookies::same-origin-extension-cookie-request
    downgrade:
      scope: archive
      any:
        - id: well-known/app/browser-extension/notionhub::notionhub-extension-context
