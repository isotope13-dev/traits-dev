# A browser extension that reads the extension cookie jar and posts it to a
# loopback HTTP listener. Download-manager bridges do this on purpose to fetch
# logged-in files, so the composite is suspicious, not hostile: the destination
# is 127.0.0.1, and a port found by scanning can be answered by any local program.
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript, xpi, crx, zip]
  attack: T1539

composite_rules:
  - id: cookie-local-app-relay
    desc: Extension reads cookies and posts them to a loopback app
    crit: suspicious
    conf: 0.85
    scope: archive
    all:
      - id: micro-behaviors/communications/http/cookie-store::chrome-cookies-get-all
      - id: micro-behaviors/communications/url/host/http::loopback-http-url-reference
      - id: micro-behaviors/communications/http/request/body/construction::fetch-json-bracket-body-text
