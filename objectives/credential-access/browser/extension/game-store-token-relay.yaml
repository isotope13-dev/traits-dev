# Browser extensions on game-store login pages that lift a store token out of
# the page (a PlayStation npsso SSO token, or an OAuth authorization code) and
# relay it through the extension runtime to another site. The PSN npsso grants
# long-lived account access; store codes are reusable for the sign-in flow.
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript, chrome-manifest, crx, zip]
  attack: T1539,T1041

traits:
  - id: runtime-message-send-object
    desc: Extension sends a runtime message object
    crit: notable
    conf: 0.85
    for: [javascript, typescript]
    if:
      type: text
      substr: chrome.runtime.sendMessage({

  - id: game-store-npsso-token
    desc: Names the PlayStation npsso SSO token
    crit: notable
    conf: 0.9
    for: [javascript, typescript]
    if:
      type: text
      substr: npsso

  - id: game-store-auth-code-field
    desc: Reads an OAuth authorization code field
    crit: notable
    conf: 0.85
    for: [javascript, typescript]
    if:
      type: text
      regex: '(authorizationCode|\.get\("code"\))'

composite_rules:
  - id: game-store-token-extension-relay
    desc: Extension relays a game-store login token to a remote site
    crit: hostile
    conf: 0.96
    near_lines: 12
    all:
      - id: runtime-message-send-object
    any:
      - id: game-store-npsso-token
      - id: game-store-auth-code-field
    needs: 1
