# Browser extensions on game-store login pages that lift a store token out of
# the page (a PlayStation npsso SSO token, or an OAuth authorization code) and
# relay it through the extension runtime to another site. The PSN npsso grants
# long-lived account access; store codes are reusable for the sign-in flow.
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript, chrome-manifest, crx, zip]
  attack: T1539,T1041

traits:
  - id: runtime-message-send-object
    desc: Extension sends a runtime message object
    crit: component
    conf: 0.85
    for: [javascript, typescript]
    if:
      type: text
      substr: chrome.runtime.sendMessage({

  - id: game-store-npsso-token
    desc: Names the PlayStation npsso SSO token
    crit: notable
    conf: 0.9
    for: [javascript, typescript]
    if:
      type: text
      substr: npsso

  - id: game-store-auth-code-field
    desc: Reads an OAuth authorization code field
    crit: notable
    conf: 0.85
    for: [javascript, typescript]
    if:
      type: text
      # Whole name: `authorizationCodeOf(socket.authorizationError)` is TLS.
      regex: '(authorizationCode\b|\.get\("code"\))'

  # The PSN token page is a JSON viewer page. A declarativeNetRequest rule that
  # rewrites its response type to text/plain exists so a script can read the raw
  # body, which carries the npsso token.
  - id: psn-token-page-content-type-override
    desc: Rewrites PSN token page response type
    crit: notable
    conf: 0.9
    for: [json]
    if:
      type: text
      substr: account.sony.com/api/v1/ssocookie

composite_rules:
  - id: game-store-token-extension-relay
    desc: Extension relays a game-store login token to a remote site
    crit: hostile
    conf: 0.96
    near_lines: 12
    all:
      - id: runtime-message-send-object
    any:
      - id: game-store-npsso-token
      - id: game-store-auth-code-field
    needs: 1

  - id: psn-npsso-scrape-via-header-override
    desc: Extension rewrites PSN token page type to read npsso
    crit: hostile
    conf: 0.95
    attack: T1539,T1557
    for: [crx, zip, javascript, json]
    scope: archive
    all:
      - id: game-store-npsso-token
      - id: psn-token-page-content-type-override
