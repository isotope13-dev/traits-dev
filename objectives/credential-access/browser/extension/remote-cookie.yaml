# Remote-tasked browser-extension cookie harvest. An all_urls extension that
# both speaks to a remote channel and collects cookies via chrome.debugger CDP
# (Network.getAllCookies) is session theft, not a first-party auth helper. The
# debugger leg must be the cookie-extraction command, not any attach: legit
# seller/automation tools attach the debugger purely for page screenshots or
# input dispatch, which does not read cookies.
#
# Require a page-JS cookie read (`document.cookie`) in addition to the CDP
# extract. A bare `get_cookies` identifier is too common in auth helpers and
# demo agents to stand as the second leg on its own.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, chrome-manifest, crx, archives]
  attack: T1539,T1185

traits:
  - id: extension-get-cookies-command
    desc: Extension exposes get_cookies command
    crit: notable
    conf: 0.92
    if:
      type: text
      regex: '\bget[_-]?cookies\b|["'']get_cookies["'']'

composite_rules:
  - id: extension-remote-page-cookie-control
    desc: Remote extension controls page cookies
    crit: hostile
    conf: 0.99
    attack: T1539,T1059.007,T1185
    scope: archive
    all:
      - id: metadata/permission/manifest::host-permission-all-urls
      - id: micro-behaviors/communications/http/websocket::wss-scheme
      - id: objectives/execution/interpreter/eval/dynamic::js-embedded-interpreter-evaluate
      - id: micro-behaviors/communications/http/cookies::document-cookie-read

  - id: extension-remote-cookie-control
    desc: Remotely tasked all-site extension harvests cookies
    crit: hostile
    conf: 0.97
    scope: archive
    all:
      - id: metadata/permission/manifest::host-permission-all-urls
      - id: micro-behaviors/communications/http/websocket::wss-scheme
      - id: micro-behaviors/process/attach/webextension::chrome-debugger-cookie-extract
      - id: micro-behaviors/communications/http/cookies::document-cookie-read

  # Live cookie-change streaming plus a native host is the implant bridge shape
  # when paired with a reflective chrome.* RPC channel (api_call). Cookie sync
  # helpers that merely open a WebSocket without that RPC surface stay below
  # this composite.
  - id: extension-live-cookie-native-bridge
    desc: All-site extension streams live cookie changes through a remote or native bridge
    crit: hostile
    conf: 0.99
    attack: T1539,T1185,T1219
    scope: archive
    all:
      - id: metadata/permission/manifest::host-permission-all-urls
      - id: metadata/permission/cookie::permission-cookies
      - id: micro-behaviors/communications/http/cookies::chrome-cookies-get-all
      - id: micro-behaviors/communications/http/cookies::chrome-cookies-on-changed-listener
      - id: micro-behaviors/communications/http/websocket::wss-scheme
      - id: objectives/command-and-control/remote-command/extension::extension-api-call-task-type
    any:
      - id: micro-behaviors/communications/ipc/native-host::browser-extension-native-connect
      - id: micro-behaviors/communications/ipc/native-host::browser-extension-native-message

  # CDP Network.getAllCookies over a WebSocket control channel does not need
  # document.cookie: the debugger extract is the jar read. Require an explicit
  # get_cookies task vocabulary so screenshot-only debugger users stay out.
  - id: extension-wss-cdp-cookie-harvest
    desc: All-site extension harvests cookies over CDP to a WebSocket channel
    crit: hostile
    conf: 0.98
    attack: T1539,T1185,T1071.001
    scope: archive
    all:
      - id: metadata/permission/manifest::host-permission-all-urls
      - id: micro-behaviors/communications/http/websocket::wss-scheme
      - id: micro-behaviors/process/attach/webextension::chrome-debugger-cookie-extract
      - id: extension-get-cookies-command
    any:
      - id: micro-behaviors/communications/http/cookies::chrome-cookies-get-all
      - id: micro-behaviors/communications/http/cookies::chrome-cookies-on-changed-listener
    needs: 1
