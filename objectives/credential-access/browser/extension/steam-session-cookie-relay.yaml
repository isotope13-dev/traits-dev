# Browser extensions that read the Steam login session cookie (steamLoginSecure)
# with the extension cookie API and post it to a remote backend. The value
# grants the account's Steam session, so the relay is account takeover.
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript, chrome-manifest, crx, zip]
  attack: T1539,T1041

traits:
  - id: chrome-cookie-named-get-text
    desc: Reads a named cookie via extension API
    crit: notable
    conf: 0.9
    for: [javascript, typescript]
    if:
      type: text
      regex: '\.cookies\.get\(\{\s{0,3}url:[^}]{1,100}name:'

  - id: steam-login-secure-cookie-name
    desc: Names the Steam login session cookie
    crit: notable
    conf: 0.95
    for: [javascript, typescript]
    if:
      type: text
      substr: steamLoginSecure

  - id: steam-session-cookie-json-relay
    desc: JSON body carries Steam login cookie
    crit: notable
    conf: 0.95
    for: [javascript, typescript]
    if:
      type: text
      regex: 'JSON\.stringify\(\{[^}]{0,160}steamLoginSecure:'

  - id: steam-session-cookie-form-relay
    desc: Form or query carries Steam login cookie
    crit: notable
    conf: 0.9
    for: [javascript, typescript]
    if:
      type: text
      regex: '(append|set)\([`''"]steamLoginSecure[`''"],|[?&]steamLoginSecure=\$\{'

composite_rules:
  - id: extension-steam-session-cookie-relay
    desc: Extension sends Steam login session cookie to a remote host
    crit: hostile
    conf: 0.95
    scope: archive
    all:
      - id: chrome-cookie-named-get-text
      - id: steam-login-secure-cookie-name
      - id: steam-session-cookie-json-relay

  # Same account takeover when the cookie rides a form or query string
  # instead of a JSON body.
  - id: extension-steam-session-cookie-form-relay
    desc: Extension sends Steam login cookie in a form or query
    crit: hostile
    conf: 0.92
    scope: archive
    all:
      - id: chrome-cookie-named-get-text
      - id: steam-login-secure-cookie-name
      - id: steam-session-cookie-form-relay
