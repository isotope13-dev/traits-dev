# Browser extensions that harvest Instagram session cookies (sessionid,
# ds_user_id) via chrome.cookies.getAll for the instagram.com domain.
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript, chrome-manifest, crx, zip]
  attack: T1539,T1041

traits:
  - id: chrome-cookies-instagram-domain
    desc: Enumerates cookies for Instagram domain
    crit: notable
    conf: 0.97
    for: [javascript, typescript]
    if:
      type: text
      regex: 'cookies\.getAll\s*\(\s*\{[^}]{0,120}instagram\.com'

  - id: extension-fetch-cookies-action
    desc: Extension message requests cookie harvest
    crit: notable
    conf: 0.94
    for: [javascript, typescript]
    if:
      type: text
      regex: '["'']fetchCookies["'']|fetchPageCookies\s*\('

composite_rules:
  - id: extension-instagram-session-cookie-harvest
    desc: Extension harvests Instagram session cookies
    crit: hostile
    conf: 0.98
    scope: archive
    all:
      - id: micro-behaviors/communications/http/cookies::chrome-cookies-get-all-text
      - id: chrome-cookies-instagram-domain
    # The cookies must be handed on: an extension message that returns them,
    # or a name/value mapping built for transport. Testing that `sessionid`
    # or `ds_user_id` exists is how an Instagram automation tool checks the
    # user is logged in (and reads only the numeric user id from the result);
    # it takes no cookie value off the page.
    any:
      - id: extension-fetch-cookies-action
      - id: micro-behaviors/communications/http/cookies::cookie-map-name-value
