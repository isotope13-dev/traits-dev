# Browser extensions that harvest Instagram session cookies (sessionid,
# ds_user_id) via chrome.cookies.getAll for the instagram.com domain.
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript, chrome-manifest, crx, archives]
  attack: T1539,T1041

traits:
  - id: chrome-cookies-instagram-domain
    desc: Enumerates cookies for Instagram domain
    crit: notable
    conf: 0.97
    for: [javascript, typescript]
    if:
      type: text
      regex: 'cookies\.getAll\s*\(\s*\{[^}]{0,120}instagram\.com'

  - id: extension-fetch-cookies-action
    desc: Extension message requests cookie harvest
    crit: notable
    conf: 0.94
    for: [javascript, typescript]
    if:
      type: text
      regex: '["'']fetchCookies["'']|fetchPageCookies\s*\('

composite_rules:
  - id: extension-instagram-session-cookie-harvest
    desc: Extension harvests Instagram session cookies
    crit: hostile
    conf: 0.98
    scope: archive
    all:
      - id: micro-behaviors/communications/http/cookies::chrome-cookies-get-all-text
      - id: chrome-cookies-instagram-domain
    any:
      - id: micro-behaviors/communications/http/cookies::instagram-session-cookie-check
      - id: micro-behaviors/communications/http/cookies::instagram-session-cookie-name
      - id: extension-fetch-cookies-action
