# Browser extensions that put LinkedIn session-cookie (li_at) values into a
# remote request body. Site-scoped commercial LinkedIn tools (sales-assist,
# automation suites) forward the signed-in user's cookies to their own
# authenticated backend to read profiles server-side, so the required evidence
# cannot separate those integrations from same-shaped stealers: the composite
# claims the forwarding, not theft. Stealers with a distinctive hostile shape
# (cookie-jar streaming over WSS, CDP debugger extraction, form-callback
# forwarding) keep their hostile homes elsewhere in this family.
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript, chrome-manifest, crx, zip]
  attack: T1539

traits:
  - id: chrome-cookies-domain-linkedin
    desc: Reads cookies for the LinkedIn domain
    crit: notable
    conf: 0.97
    for: [javascript, typescript]
    if:
      type: text
      # Minified extensions commonly bind the site domain to a short variable
      # before calling getAll({domain: variable}); accept either source order.
      regex: '(?s)(cookies\.getAll.{0,120}linkedin\.com|linkedin\.com.{0,120}cookies\.getAll)'

  - id: browser-fingerprint-payload
    unless:
      - id: metadata/package/testing/corpus::inert-security-input-module
    desc: Collects browser fingerprint for registration
    crit: notable
    conf: 0.9
    for: [javascript, typescript]
    if:
      type: text
      regex: '(?i)browserFingerprint|userAgent.{0,40}platform.{0,40}languages'

composite_rules:
  - id: linkedin-session-cookie-remote-upload
    desc: Extension uploads LinkedIn session cookies to a remote API
    crit: suspicious
    conf: 0.97
    scope: archive
    for: [crx, zip, javascript, html, chrome-manifest]
    all:
      - id: micro-behaviors/communications/http/cookie-name::linkedin-session-cookie-name
      - id: metadata/permission/host::content-script-linkedin
      - id: metadata/permission/cookie::permission-cookies
      - id: micro-behaviors/communications/http/cookies::cookie-value-request-payload
      - id: micro-behaviors/communications/http/request/client::js-fetch-call
    any:
      - id: micro-behaviors/communications/http/services/supabase::rest-api-endpoint
      - id: micro-behaviors/communications/http/request/client::fetch-post-pattern
    needs: 1
