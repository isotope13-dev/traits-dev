defaults:
  for:
    - pe
    - dll
  platforms:
    - windows
  attack: T1555.003
  mbc: E1555.003
traits:
  - id: bcrypt-aes-gcm
    desc: BCrypt AES-GCM algorithm
    crit: suspicious
    conf: 0.75
    if:
      type: text
      substr: BCRYPT_AES_GCM
    unless:
      - id: metadata/library/generated::winmd-metadata
  - id: chromium-v10-prefix
    desc: Chromium v10 encryption prefix
    crit: component
    conf: 0.7
    if:
      type: text
      exact: v10
  - id: chromium-v11-prefix
    desc: Chromium v11 encryption prefix
    crit: component
    conf: 0.7
    if:
      type: text
      exact: v11
  - id: master-key-path
    desc: DPAPI master key path
    crit: suspicious
    conf: 0.9
    if:
      type: text
      regex: (?i)Protect[/\\]+S-1-
  - id: roaming-credentials
    desc: Roaming credentials path
    crit: suspicious
    conf: 0.75
    if:
      type: text
      regex: (?i)AppData[/\\]+Roaming[/\\]+Microsoft[/\\]+Credentials
composite_rules:
  - id: chromium-encryption-prefix
    desc: Chromium encryption version prefix
    crit: component
    conf: 0.75
    any:
      - id: chromium-v10-prefix
      - id: chromium-v11-prefix
  - id: dpapi-usage
    desc: DPAPI access with browser credential markers
    crit: suspicious
    conf: 0.9
    all:
      - id: micro-behaviors/os/security/dpapi::crypt-unprotect-data-api
    any:
      # DATA_BLOB is the ordinary DPAPI parameter type and is also present in
      # statically linked runtimes; require credential-store context instead.
      - id: chromium-encryption-prefix
      - id: master-key-path
      - id: roaming-credentials
    unless:
      - id: well-known/lib/platform/wine/
      - id: well-known/app/security/bitwarden::bitwarden-app
