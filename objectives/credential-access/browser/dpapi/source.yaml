# DPAPI CryptUnprotectData in source code
# Detects credential decryption APIs used in password stealers
defaults:
  for: [source]
  platforms: [windows]
  attack: T1555.003
  mbc: E1555.003
traits:
composite_rules:
  - id: dpapi-source-usage
    desc: DPAPI credential decryption in source
    crit: notable
    conf: 0.9
    all:
      - id: micro-behaviors/os/security/dpapi::crypt-unprotect-data-source-reference
      - id: micro-behaviors/os/security/dpapi::data-blob-declaration-source
    unless:
      - id: well-known/tool/sysadmin/sandboxie/
      - id: metadata/file/profile/source-indications/
      - id: well-known/lib/platform/rust-system-bindings/
