defaults:
  platforms: [windows]
  for: [pe, dll]
  attack: T1555.003
  mbc: B0028

composite_rules:
  - id: node-addon-dpapi-credential-decryptor
    desc: Node native addon imports Windows DPAPI unprotect API
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/os/security/dpapi::crypt-unprotect-data-api
    any:
      - id: metadata/binary/symbols/abi-name::node-api-function-name-cluster
      - id: metadata/binary/symbols/imports::node-api-symbol-table-families
      - id: metadata/binary/symbols/abi-name::node-native-abi-name-reference
      - id: metadata/binary/symbols/exports::node-api-addon-export
