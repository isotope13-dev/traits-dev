defaults:
  platforms: [windows]
  for: [pe, dll]
  attack: T1555.003
  mbc: B0028

composite_rules:
  # DPAPI unprotect alone is ordinary secret storage (Microsoft's MSAL
  # dpapi.node imports it). The hostile shape is the Chromium App-Bound key
  # recipe: impersonate another token, DPAPI-unprotect, then open CNG keys.
  # Addon shape only: host runtimes (node.exe, Electron) carry napi_* names
  # as exports and text, so name-text legs alone convicted stock Electron.
  - id: node-addon-dpapi-credential-decryptor
    desc: Node addon impersonates tokens for DPAPI/CNG decrypt
    crit: hostile
    conf: 0.9
    all:
      - id: micro-behaviors/os/security/dpapi::crypt-unprotect-data-api
      - id: micro-behaviors/crypto/provider/cryptoapi::ncrypt-open-storage-provider
      - id: micro-behaviors/crypto/provider/cryptoapi::ncrypt-open-key
      - id: addon-shape
      - id: token-impersonation
    unless:
      - id: metadata/binary/symbols/exports::node-api-runtime-host-export
  - id: addon-shape
    desc: PE imports Node-API or exports addon registration
    crit: component
    any:
      - id: metadata/binary/symbols/imports::node-api-symbol-table-families
      - id: metadata/binary/symbols/exports::node-api-addon-export
  - id: token-impersonation
    desc: Binary imports a token impersonation API
    crit: component
    any:
      - id: micro-behaviors/os/privilege/token/use::impersonate-logged-on-user-import
      - id: micro-behaviors/os/privilege/token/use::set-thread-token
