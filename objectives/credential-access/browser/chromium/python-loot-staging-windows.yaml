defaults:
  platforms:
    - unix
    - windows
  for: [scripts, binaries]
  attack: T1555.003

composite_rules:
  - id: python-windows-chromium-loot-staging
    desc: Python Chromium loot staging on Windows
    crit: suspicious
    conf: 0.96
    for: [python]
    platforms: [windows]
    all:
      - id: micro-behaviors/process/terminate/command::taskkill-browser-image
      - id: micro-behaviors/fs/path/application/browser::brave-path
      - id: micro-behaviors/fs/path/application/browser::chrome-path
      - id: micro-behaviors/fs/path/application/browser::edge-path
      - id: micro-behaviors/fs/path/application/browser::opera-path
      - id: micro-behaviors/fs/path/application/browser::local-state

  - id: python-windows-chromium-loot-posted-to-webhook
    desc: Python stages Chromium data, posts webhook
    crit: hostile
    conf: 0.95
    mbc: E1041
    for: [python]
    platforms: [windows]
    all:
      - id: micro-behaviors/process/terminate/command::taskkill-browser-image
      - id: micro-behaviors/fs/path/password-store::chromium-login-store-paths
      - id: micro-behaviors/fs/path/cookie::chromium-network-cookies-path
      - id: micro-behaviors/communications/http/webhook::python-webhook-post

