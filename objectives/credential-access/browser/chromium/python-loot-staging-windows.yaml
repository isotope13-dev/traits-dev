defaults:
  platforms:
    - unix
    - windows
  for: [scripts, binaries]

composite_rules:
  - id: python-windows-chromium-loot-staging
    desc: Python Chromium loot staging on Windows
    crit: suspicious
    conf: 0.96
    attack: T1555.003
    for: [python]
    platforms: [windows]
    all:
      - id: micro-behaviors/process/terminate/command::taskkill-browser-image
      - id: brave-path
      - id: chrome-path
      - id: edge-path
      - id: opera-path
      - id: local-state