defaults:
  for:
    - shell
    - python
    - javascript
    - applescript
  platforms:
    - macos
  attack: T1555.003
traits:
  - id: chrome-keychain-query
    desc: Queries Keychain for Chrome Safe Storage key
    crit: suspicious
    conf: 0.95
    if:
      type: text
      regex: security\s+find-generic-password\s+-wa.{0,50}'?Chrome'?
    unless:
      - id: metadata/library/automation::browser-profile-import-crypto-helper
      - id: metadata/library/automation::browser-profile-import-workflow
  - id: chrome-safe-storage-keychain-query
    desc: Queries Keychain for Chrome Safe Storage
    # Browser migration and cookie portability tools legitimately request this
    # item.  A theft/exfiltration chain must supply the suspicious intent.
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: find-generic-password.{0,80}Chrome Safe Storage
    unless:
      - id: metadata/library/automation::browser-profile-import-crypto-helper
      - id: metadata/library/automation::browser-profile-import-workflow
      - id: well-known/app/ai/coding-agent/kombai::kombai-browser-session-import-context
  - id: chromium-safe-storage-service-name
    desc: Chromium Safe Storage service name
    # Every Chromium fork stores its os_crypt master key under a keychain
    # service named "<Product> Safe Storage" — Chrome, Brave, Chromium,
    # Microsoft Edge, Arc, Opera, Vivaldi, Yandex. Matching the shape rather
    # than the Chrome spelling covers the forks a builder-configured stealer
    # iterates over, and forks that do not exist yet.
    #
    # The service-name literal is also present in legitimate browser-cookie
    # importers.  Keychain access and browser decryption have separate,
    # stronger signals below and in the shared micro-behaviors.
    crit: notable
    conf: 0.8
    for: [scripts, source, macho]
    if:
      type: string_literal
      regex: '\b[A-Z][A-Za-z]{1,14}( [A-Z][A-Za-z]{1,14})? Safe Storage\b'
    unless:
      - id: metadata/library/automation::google-flow-browser-auth-client
      # Redundant with chrome-safe-storage-keychain-query above, which stays
      # suspicious for this package and carries the signal on its own.
      - id: well-known/app/ai/gateway/kimi-chat-opencode::kimi-chat-opencode-context
      - id: metadata/package/testing/presence/harness::test-directory
      - id: well-known/app/ai/tool-server/linkedin-mcp-server::browser-import-source-context
      - id: well-known/app/ai/tool-server/linkedin-mcp-server::browser-import-archive-context
      - id: well-known/app/ai/usage/ai-box::ai-box-extension-context
  - id: openssl-aes-decryption-cmd
    desc: OpenSSL AES decryption for Chrome
    crit: suspicious
    conf: 0.8
    if:
      type: text
      regex: openssl\s+enc\s+.{0,100}-aes-128-cbc\s+-iv\s+.{0,100}-K\s+
    unless:
composite_rules:
  # Newer macOS releases refuse to hand a Chromium fork's Safe Storage secret
  # to any other caller, so reading the key out of the keychain stops working.
  # The answer stealers reached for is to overwrite it: delete the entry the
  # browser created and add one back whose value the operator already knows,
  # after which every cookie and password the browser writes is decryptable
  # offline. It is also destructive — everything encrypted under the original
  # key becomes permanently unrecoverable.
  #
  # Deleting *and* re-adding another application's os_crypt master key has no
  # benign form. A browser creates its own entry once and never removes it; a
  # credential importer only ever reads. Requiring both halves plus the
  # service-name anchor keeps ordinary keychain automation (which unlocks and
  # adds its own codesigning items) out.
  - id: chromium-safe-storage-key-replacement
    desc: Chromium Safe Storage key overwritten
    crit: hostile
    conf: 0.97
    attack: T1555.003,T1565.001
    mbc: B0028
    for: [scripts, source, macho]
    # Bind all three operations to one key-management routine. Large account
    # managers may read a browser Safe Storage service in one module section
    # and separately add/delete their own unrelated Keychain records.
    near_lines: 240
    all:
      - id: micro-behaviors/os/security/keychain::macos-keychain-generic-password-delete-command
      - id: micro-behaviors/os/security/keychain::macos-keychain-generic-password-add-command
      - id: chromium-safe-storage-service-name

  # Renamed from `chrome-password-theft-macos`. The description and the note
  # below already said this is a capability rather than theft, but the id --
  # which is what an analyst reads in the finding line -- still asserted
  # "password theft" on every hit. Nothing in the legs establishes a sink, and
  # no leg touches a password store: the KDF salt plus a keychain or cookie-DB
  # read is a *decryption chain*. Browser-automation and session-sync tools
  # that legitimately decrypt the user's own profile were being reported as
  # password thieves.
  - id: chrome-cookie-decryption-chain-macos
    desc: macOS Chrome cookie decryption chain
    # Keychain access plus Chrome's KDF identifies a sensitive capability, not
    # theft. A hostile verdict needs a separate staging or exfiltration sink.
    crit: notable
    conf: 0.95
    mbc: B0028
    all:
      - id: micro-behaviors/crypto/kdf/algorithm::chrome-compatible-kdf-salt
    any:
      - id: chrome-keychain-query
      - id: chrome-safe-storage-keychain-query
      - id: openssl-aes-decryption-cmd
      - id: micro-behaviors/fs/path/sensitive/browser::login-data
      - id: micro-behaviors/fs/path/sensitive/browser::chromium-web-data-file
    unless:
      - id: well-known/tool/reverse-engineering/aleapp::aleapp-source-tree
      - id: metadata/package/testing/presence/harness::test-directory
      - id: metadata/library/automation::browser-profile-import-workflow
      # Reads one session cookie scoped to its own service and replays it only
      # to that service; no password store is touched, so "password theft"
      # misdescribes it. The Safe Storage keychain query stays suspicious.
      - id: well-known/app/ai/gateway/kimi-chat-opencode::kimi-chat-opencode-context
      - id: well-known/app/ai/coding-agent/kombai::kombai-browser-session-import-context
