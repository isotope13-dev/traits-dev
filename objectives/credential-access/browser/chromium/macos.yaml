defaults:
  for:
    - shell
    - python
    - javascript
    - applescript
  platforms:
    - macos
  attack: T1555.003
traits:
  - id: chrome-keychain-query
    desc: Queries Keychain for Chrome Safe Storage key
    crit: suspicious
    conf: 0.95
    if:
      type: text
      regex: security\s+find-generic-password\s+-wa.{0,50}'?Chrome'?
    unless:
      - id: well-known/lib/platform/browser-automation/drivers/selenium::browser-profile-import-crypto-helper
      - id: well-known/lib/platform/browser-automation/drivers/selenium::browser-profile-import-workflow
  - id: openssl-aes-decryption-cmd
    desc: OpenSSL AES decryption for Chrome
    crit: suspicious
    conf: 0.8
    if:
      type: text
      regex: openssl\s+enc\s+.{0,100}-aes-128-cbc\s+-iv\s+.{0,100}-K\s+
    unless:
composite_rules:
  # Newer macOS releases refuse to hand a Chromium fork's Safe Storage secret
  # to any other caller, so reading the key out of the keychain stops working.
  # The answer stealers reached for is to overwrite it: delete the entry the
  # browser created and add one back whose value the operator already knows,
  # after which every cookie and password the browser writes is decryptable
  # offline. It is also destructive — everything encrypted under the original
  # key becomes permanently unrecoverable.
  #
  # Deleting *and* re-adding another application's os_crypt master key has no
  # benign form. A browser creates its own entry once and never removes it; a
  # credential importer only ever reads. Requiring both halves plus the
  # service-name anchor keeps ordinary keychain automation (which unlocks and
  # adds its own codesigning items) out.
  - id: chromium-safe-storage-key-replacement
    desc: Chromium Safe Storage key overwritten
    crit: hostile
    conf: 0.97
    attack: T1555.003,T1565.001
    for: [scripts, source, macho]
    # Bind all three operations to one key-management routine. Large account
    # managers may read a browser Safe Storage service in one module section
    # and separately add/delete their own unrelated Keychain records.
    near_lines: 240
    all:
      - id: micro-behaviors/os/security/keychain::macos-keychain-generic-password-delete-command
      - id: micro-behaviors/os/security/keychain::macos-keychain-generic-password-add-command
      - id: micro-behaviors/fs/path/password-store::chromium-safe-storage-service-name

  # Renamed from `chrome-password-theft-macos`. The description and the note
  # These indicators describe a decryption capability, not a proven dataflow:
  # the selectors cannot show that the keychain value feeds the KDF or that the
  # selected ciphertext reaches the decryptor. Require every observable leg so
  # a key query plus the KDF marker alone does not imply cookie decryption.
  - id: chrome-cookie-decryption-capability-macos
    for: [javascript]
    desc: macOS Chromium cookie decryption capability indicators co-occur
    # A hostile verdict needs a separate staging or exfiltration sink.
    crit: notable
    conf: 0.95
    all:
      - id: micro-behaviors/crypto/kdf/algorithm::chrome-compatible-kdf-salt
      - id: micro-behaviors/data/db/sql::chromium-cookie-select-query
      - id: micro-behaviors/crypto/symmetric/decrypt::createDecipheriv
    any:
      - id: chrome-keychain-query
      - id: micro-behaviors/os/security/keychain::chrome-safe-storage-query
    unless:
      - id: well-known/tool/reverse-engineering/aleapp::aleapp-source-tree
      - id: metadata/package/testing/presence/harness::test-directory
      - id: well-known/lib/platform/browser-automation/drivers/selenium::browser-profile-import-workflow
      # Reads one session cookie scoped to its own service and replays it only
      # to that service; no password store is touched, so "password theft"
      # misdescribes it. The Safe Storage keychain query stays suspicious.
      - id: well-known/app/ai/gateway/kimi-chat-opencode::kimi-chat-opencode-context
      - id: well-known/app/ai/coding-agent/kombai::kombai-browser-session-import-context
