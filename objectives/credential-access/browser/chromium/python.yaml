defaults:
  platforms: [windows, unix]
  for: [python]
  attack: T1555.003

traits:
  - id: python-browser-cookie-extraction
    desc: Browser cookie extraction symbol reference
    crit: notable
    conf: 0.96
    if:
      type: symbol
      exact: extract_cookies_from_browser

composite_rules:
  - id: python-multibrowser-cookie-json-export
    desc: Python exports cookies from multiple browsers to JSON
    crit: suspicious
    conf: 0.96
    all:
      - id: micro-behaviors/communications/http/cookies::browser-cookie3-import
      - id: micro-behaviors/os/application/target/browser::multiple-browser-names
      - id: micro-behaviors/data/serialize/object::json-dump
      - id: micro-behaviors/data/serialize/schema-object::domain-field-key
      - id: micro-behaviors/fs/file/io-mode::write-append-create-mode
  - id: ecommerce-platform-cookie-domains
    desc: Multiple e-commerce platform domain references
    crit: notable
    conf: 0.95
    needs: 2
    any:
      - id: micro-behaviors/communications/url/host/domain-http::taobao-commerce-domain
      - id: micro-behaviors/communications/url/host/domain-http::sycm-taobao-domain
      - id: micro-behaviors/communications/url/host/domain-http::amazon-commerce-domain
  - id: browser-cookie3-ecommerce-login
    desc: browser-cookie3 and e-commerce domain references
    crit: notable
    conf: 0.97
    all:
      - id: micro-behaviors/communications/http/cookies::browser-cookie3-import
      - id: ecommerce-platform-cookie-domains
  - id: python-browser-cookie-harvest-backdoor
    desc: Browser cookie harvesting through HTTP backdoor
    crit: hostile
    conf: 0.99
    mbc: E1003
    attack: T1555.003,T1059.006,T1505.003
    for: [whl, python]
    scope: archive
    all:
      - id: micro-behaviors/fs/path/application/browser/profile::edge-path
      - id: python-browser-cookie-extraction
      - id: objectives/command-and-control/backdoor/webshell/request/eval::python-http-url-eval-backdoor
  - id: python-dpapi-chromium-login-decrypt
    desc: Python decrypts Chromium logins via DPAPI
    crit: hostile
    conf: 0.98
    platforms: [windows]
    all:
      - id: micro-behaviors/os/security/dpapi::python-chromium-key-unprotect
      - id: micro-behaviors/data/db/read/column::chromium-login-sql
    any:
      - id: micro-behaviors/crypto/symmetric/aes/initialize::aes-new-symbol-reference
      - id: micro-behaviors/crypto/symmetric/aes/reference::cryptography-aes
      - id: micro-behaviors/crypto/symmetric/aes/reference::aesgcm-name-reference
      - id: micro-behaviors/crypto/decrypt/transform/unspecified::python-decrypt-method-call
  # Linux and macOS Chromium wrap saved passwords with PBKDF2 and the
  # fixed salt "saltysalt". Querying the logins table and decrypting with
  # that key is password theft; cookie libraries that only know the salt
  # do not select password_value.
  - id: python-os-crypt-chromium-login-decrypt
    desc: Chromium login decrypt via OS KDF
    crit: hostile
    conf: 0.98
    platforms: [unix]
    all:
      - id: micro-behaviors/data/db/read/column::chromium-login-sql
      - id: micro-behaviors/crypto/kdf/algorithm::chrome-compatible-kdf-source-salt
      - id: micro-behaviors/crypto/kdf/algorithm::python-hashlib-pbkdf2-hmac
    any:
      - id: micro-behaviors/crypto/symmetric/aes/reference::cryptography-aes
      - id: micro-behaviors/crypto/symmetric/aes/reference::aesgcm-name-reference
      - id: micro-behaviors/crypto/symmetric/aes/initialize::aes-new-symbol-reference
      - id: micro-behaviors/crypto/decrypt/transform/unspecified::python-decrypt-method-call

