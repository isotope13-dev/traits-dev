defaults:
  platforms: [windows, unix]
  for: [python]
  attack: T1555.003

traits:
  - id: python-browser-cookie-extraction
    desc: Python extracts browser cookies
    crit: suspicious
    conf: 0.96
    unless:
      - id: well-known/app/ai/assistant/sealclaw::local-browser-cookie-auth-context
      - id: browser-cookie3-ecommerce-login
      - id: well-known/tool/media/yt-dlp/
    if:
      type: symbol
      exact: extract_cookies_from_browser

composite_rules:
  - id: ecommerce-platform-cookie-domains
    desc: Multiple e-commerce platform domain references
    crit: notable
    conf: 0.95
    needs: 2
    any:
      - id: micro-behaviors/communications/http/url/domain::taobao-commerce-domain
      - id: micro-behaviors/communications/http/url/domain::sycm-taobao-domain
      - id: micro-behaviors/communications/http/url/domain::amazon-commerce-domain
  - id: browser-cookie3-ecommerce-login
    desc: browser-cookie3 reads cookies for e-commerce login
    crit: exception
    conf: 0.97
    all:
      - id: micro-behaviors/communications/http/cookies::browser-cookie3-import
      - id: ecommerce-platform-cookie-domains
  - id: python-browser-cookie-harvest-backdoor
    desc: Browser cookie harvesting through HTTP backdoor
    crit: hostile
    conf: 0.99
    mbc: E1003
    attack: T1555.003,T1059.006,T1505.003
    for: [whl, python]
    scope: archive
    all:
      - id: micro-behaviors/fs/path/application/browser::edge-path
      - id: python-browser-cookie-extraction
      - id: objectives/command-and-control/backdoor/tasking/http::python-http-url-eval-backdoor
  - id: python-dpapi-chromium-login-decrypt
    desc: Python decrypts Chromium logins via DPAPI
    crit: hostile
    conf: 0.98
    platforms: [windows]
    all:
      - id: micro-behaviors/os/security/dpapi::python-chromium-key-unprotect
      - id: micro-behaviors/data/db/access::chromium-login-sql
    any:
      - id: micro-behaviors/crypto/symmetric/aes/library::pycrypto-aes-new
      - id: micro-behaviors/crypto/symmetric/aes/library::cryptography-aes
      - id: micro-behaviors/crypto/symmetric/aes/library::cryptography-aesgcm-api
      - id: micro-behaviors/crypto/symmetric/decrypt::python-decrypt-method-call
    unless:
      - id: metadata/package/testing/presence/harness::test-directory
      - id: well-known/tool/detection/malcontent::malcontent-defensive-scanner-context
      - id: well-known/tool/reverse-engineering/forenselab::browser-forensics-module
      - id: well-known/tool/media/yt-dlp/
      - id: well-known/app/ai/agent-runtime/ghostchimera::ghostchimera-browser-vault-context
  # Linux and macOS Chromium wrap saved passwords with PBKDF2 and the
  # fixed salt "saltysalt". Querying the logins table and decrypting with
  # that key is password theft; cookie libraries that only know the salt
  # do not select password_value.
  - id: python-os-crypt-chromium-login-decrypt
    desc: Chromium login decrypt via OS KDF
    crit: hostile
    conf: 0.98
    platforms: [unix]
    all:
      - id: micro-behaviors/data/db/access::chromium-login-sql
      - id: micro-behaviors/crypto/kdf/algorithm::chrome-compatible-kdf-source-salt
      - id: micro-behaviors/crypto/kdf/algorithm::python-hashlib-pbkdf2-hmac
    any:
      - id: micro-behaviors/crypto/symmetric/aes/library::cryptography-aes
      - id: micro-behaviors/crypto/symmetric/aes/library::cryptography-aesgcm-api
      - id: micro-behaviors/crypto/symmetric/aes/library::pycrypto-aes-new
      - id: micro-behaviors/crypto/symmetric/decrypt::python-decrypt-method-call
    unless:
      - id: metadata/package/testing/presence/harness::test-directory
      - id: well-known/tool/detection/malcontent::malcontent-defensive-scanner-context
      - id: well-known/tool/reverse-engineering/forenselab::browser-forensics-module
      - id: well-known/tool/media/yt-dlp/
      - id: well-known/app/ai/agent-runtime/ghostchimera::ghostchimera-browser-vault-context
      - id: well-known/lib/development/browser-cookie3::browser-cookie3-library-context

