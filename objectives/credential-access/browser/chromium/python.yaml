defaults:
  platforms: [windows, unix]
  for: [python]
  attack: T1555.003

traits:
  - id: taobao-cookie-domain
    desc: Taobao commerce cookie domain
    crit: component
    if:
      type: text
      substr: taobao.com

  - id: sycm-taobao-cookie-domain
    desc: Sycm Taobao analytics cookie domain
    crit: component
    if:
      type: text
      substr: sycm.taobao

  - id: amazon-cookie-domain
    desc: Amazon commerce cookie domain
    crit: component
    if:
      type: text
      substr: amazon.com

  - id: python-browser-cookie-extraction
    desc: Python extracts browser cookies
    crit: suspicious
    conf: 0.96
    unless:
      - id: well-known/app/ai/assistant/sealclaw::local-browser-cookie-auth-context
      - id: objectives/credential-access/browser/chromium::browser-cookie3-ecommerce-login
      - id: well-known/lib/core/yt-dlp/
      - id: well-known/lib/core/yt-dlp::yt-dlp-member-path
      - id: well-known/lib/core/yt-dlp::yt-dlp-wheel-path
    if:
      type: text
      regex: '\b(extract_cookies_from_browser|_extract_chrome_cookies)\s*\('

composite_rules:
  - id: ecommerce-platform-cookie-domains
    desc: E-commerce platform cookie login target domains
    crit: notable
    conf: 0.95
    needs: 2
    any:
      - id: taobao-cookie-domain
      - id: sycm-taobao-cookie-domain
      - id: amazon-cookie-domain

  - id: browser-cookie3-ecommerce-login
    desc: browser-cookie3 reads cookies for e-commerce login
    crit: exception
    conf: 0.97
    all:
      - id: micro-behaviors/communications/http/cookies::browser-cookie3-import
      - id: ecommerce-platform-cookie-domains
  - id: python-browser-cookie-harvest-backdoor
    desc: Browser cookie harvesting through HTTP backdoor
    crit: hostile
    conf: 0.99
    mbc: E1003
    attack: T1555.003,T1059.006,T1505.003
    for: [whl]
    scope: archive
    all:
      - id: edge-path
      - id: python-browser-cookie-extraction
      - id: objectives/command-and-control/backdoor/tasking/http::python-http-url-eval-backdoor
