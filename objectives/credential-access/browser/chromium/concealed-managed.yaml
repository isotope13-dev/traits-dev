defaults:
  platforms: [windows]
  for: [pe, dll]
  attack: T1555.003

composite_rules:
  # This records the concealed assembly's browser-key decryption capability.
  # It does not claim the imported DPAPI call's argument was flow-resolved.
  - id: concealed-clr-browser-key-decryption
    desc: Concealed CLR browser-key metadata with DPAPI and BCrypt decryption
    crit: hostile
    conf: 0.96
    all:
      - id: objectives/anti-static/obfuscation/control-flow/indirect::clr-resource-and-call-concealer
      - id: micro-behaviors/data/config/browser-preference::chromium-encrypted-key-metadata
      - id: micro-behaviors/os/security/dpapi::dotnet-qualified-unprotect-import
      - id: micro-behaviors/crypto/library/cryptoapi::bcrypt-decrypt-api
