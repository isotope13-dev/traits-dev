defaults:
  platforms: [windows]
  for: [pe, dll]

composite_rules:
  - id: managed-card-store-read-decrypt-references
    desc: Chromium encrypted-card stores with file-read and DPAPI references
    crit: suspicious
    conf: 0.94
    attack: T1555.003
    # Table/path names alone are not theft. Require the encrypted card field,
    # Local State key store, managed file reads and DPAPI as well. This is
    # same-file capability context; legitimate recovery remains possible.
    all:
      - id: metadata/binary/framework::dotnet-assembly
      - id: micro-behaviors/fs/path/personal::chromium-web-data-file
      - id: micro-behaviors/fs/path/password-store::browser-credit-cards
      - id: micro-behaviors/data/db/schema/relational::chromium-encrypted-card-number-column
      - id: micro-behaviors/fs/path/application/browser::local-state
      - id: micro-behaviors/fs/read/file/full::dotnet-read-all-text
      - id: micro-behaviors/os/security/dpapi::dotnet-protected-data-reference
