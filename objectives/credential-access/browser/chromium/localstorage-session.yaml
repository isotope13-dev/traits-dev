defaults:
  platforms: [linux, macos, windows]
  for: [javascript, typescript]

traits:
  - id: browser-authorization-record-key
    desc: Browser storage authorization record key
    crit: notable
    conf: 0.96
    if:
      type: text
      substr: '"key":"authorization"'

  - id: browser-organization-record-key
    desc: Browser storage organization record key
    crit: notable
    conf: 0.96
    if:
      type: text
      substr: '"key":"organizationCode'

  - id: browser-leveldb-file-read
    desc: Reads LevelDB files as Latin-1 text
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: 'readFileSync\(join\(dir, f\)\)[\s\S]{0,100}toString\("latin1"\)'

composite_rules:
  - id: chromium-leveldb-session-token-read
    desc: Reads a browser session token from LevelDB
    crit: suspicious
    conf: 0.98
    attack: T1539
    all:
      - id: browser-authorization-record-key
      - id: browser-organization-record-key
      - id: browser-leveldb-file-read
      - id: micro-behaviors/fs/path/app-data::chromium-leveldb-local-storage
      - id: micro-behaviors/data/db/leveldb::leveldb-ref

  - id: chromium-leveldb-session-token-replay
    desc: Replays a LevelDB token through authenticated requests
    crit: suspicious
    conf: 0.98
    attack: T1539
    scope: archive
    for: [npm, tar, tgz, zip, javascript, typescript]
    all:
      - id: chromium-leveldb-session-token-read
      - id: micro-behaviors/communications/http/token-auth::js-bearer-header-from-auth-token
