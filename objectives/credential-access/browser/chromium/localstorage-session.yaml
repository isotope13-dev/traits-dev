defaults:
  attack: T1539
  platforms: [linux, macos, windows]
  for: [javascript, typescript]

composite_rules:
  - id: chromium-leveldb-session-token-read
    desc: Chromium LevelDB and session-record clues
    crit: suspicious
    conf: 0.98
    all:
      - id: metadata/lang/source/syntax/key-value::authorization-record-key
      - id: metadata/lang/source/syntax/key-value::organization-record-key
      - id: micro-behaviors/fs/read/file/full::node-latin1-file-read
      - id: micro-behaviors/fs/path/app-data::chromium-leveldb-local-storage
      - id: micro-behaviors/data/db/leveldb::leveldb-ref

  - id: chromium-leveldb-session-token-replay
    desc: LevelDB session and bearer-auth clues
    crit: suspicious
    conf: 0.98
    scope: archive
    for: [npm, tar, tgz, zip, javascript, typescript]
    all:
      - id: chromium-leveldb-session-token-read
      - id: micro-behaviors/communications/http/authorization-header::js-bearer-header-from-auth-token
