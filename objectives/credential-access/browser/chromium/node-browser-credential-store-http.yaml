defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]

composite_rules:
- id: browser-credential-store-http-access
  desc: Browser credential-store access near HTTP client calls
  crit: suspicious
  conf: 0.94
  attack: T1555.003
  near_lines: 120
  all:
  - id: micro-behaviors/fs/path/application/browser::browser-data-path
  - id: metadata/import/package::node-filesystem-imports
  - id: micro-behaviors/fs/read/file/full::read-node
  - id: micro-behaviors/communications/http/request/client::node-http-client-imports
  - id: micro-behaviors/communications/http/request/client::http-method-calls
  any:
  - id: micro-behaviors/fs/path/password-store::login-data
  - id: micro-behaviors/fs/path/password-store::logins
  - id: micro-behaviors/fs/path/cookie::firefox-cookie-db-path-reference
  - id: micro-behaviors/data/db/leveldb::leveldb-ref
