# A JVM program that unwraps a secret with Windows DPAPI, opens a SQLite
# database over JDBC and runs a Cipher (AES-GCM or a raw DPAPI blob): the
# Chromium Login Data / Cookies decryption recipe. Previously expressed only
# as carLambo family composites (dpapi-sqlite-stack-text,
# archive-dpapi-browser-theft-text, carlambo-dpapi-sql-class), so any Java
# browser-credential stealer was reported as carLambo. The family composites
# now add a carLambo anchor on top of this.
defaults:
  platforms: [windows]
  attack: T1555.003
  for: [class, java_class]
composite_rules:
  - id: jvm-dpapi-sqlite-secret-decrypt
    desc: JVM decrypts DPAPI-protected SQLite secrets
    crit: suspicious
    conf: 0.93
    # One class, not the whole JAR: pooled across a fat application JAR these
    # legs come from unrelated vendored libraries (Murglar Desktop 6.5.160
    # assembled them from JNA, JCEF, log4j and kotlin-stdlib classes).
    all:
      - id: micro-behaviors/os/security/dpapi::jna-crypt32util-class
      - id: micro-behaviors/data/db/sql::jvm-jdbc-driver-manager
    any:
      - id: micro-behaviors/crypto/library/provider::jvm-gcm-parameter-spec
      - id: micro-behaviors/os/security/dpapi::jvm-crypt-unprotect-data-name
  # The same single-class recipe plus a spawned child process the class waits
  # on. Browsers hold exclusive locks on Login Data and Cookies while running,
  # so stealers launch a kill or copy command and wait for it before opening
  # the database; a plain Java password manager has no reason to.
  - id: jvm-dpapi-sqlite-decrypt-with-child-process
    desc: JVM unwraps DPAPI SQLite secrets after running a child process
    crit: hostile
    conf: 0.88
    all:
      - id: jvm-dpapi-sqlite-secret-decrypt
      - id: micro-behaviors/crypto/library/provider::jvm-gcm-parameter-spec
      - id: micro-behaviors/process/create/subprocess::java-processbuilder-start-bytecode
      - id: micro-behaviors/process/control/wait::java-process-waitfor-bytecode

  # Chromium's "Local State" key recipe in one class: the base64 os_crypt key
  # is unwrapped with DPAPI through JNA and used for AES-GCM, with the profile
  # location taken from the environment. Strings can be encrypted, so no
  # SQLite or path literal is required.
  - id: jvm-dpapi-env-base64-key-gcm-decrypt
    desc: JVM unwraps base64 key with DPAPI for AES-GCM
    crit: hostile
    conf: 0.8
    all:
      - id: micro-behaviors/os/security/dpapi::jna-crypt32util-class
      - id: micro-behaviors/os/security/dpapi::jvm-crypt-unprotect-data-name
      - id: micro-behaviors/crypto/library/provider::jvm-gcm-parameter-spec
      - id: micro-behaviors/crypto/key/representation::secretkeyspec
      - id: micro-behaviors/data/decode/base64::java-base64-decoder-class
      - id: micro-behaviors/os/env/read::jvm-getenv-method
