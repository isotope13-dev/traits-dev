defaults:
  platforms: [windows, unix]
  for: [class]
  attack: T1555.003
composite_rules:
  # Require the source and operations in one class. A store filename alone,
  # a JDBC library or a cipher implementation must never satisfy this.
  # Password export/recovery tools can implement the same recipe, so this
  # static capability remains suspicious despite the reviewed stealer verdict.
  - id: jvm-login-store-copy-and-gcm
    desc: JVM login-store copy and GCM helper co-occur
    crit: suspicious
    conf: 0.96
    all:
      - id: micro-behaviors/fs/path/password-store::jvm-login-data-bytes
      - id: micro-behaviors/fs/file/copy::java-files-copy
      - id: micro-behaviors/data/db/query::jvm-resultset-getbytes
      - id: micro-behaviors/crypto/decrypt::jvm-gcm-decrypt-helper-reference
