# File reads plus browser-specific store and secret-column evidence. A backup
# path alone is insufficient. This does not assert decryption or transmission.
defaults:
  platforms: [windows]
  for: [c, cpp]

composite_rules:
  - id: native-login-store-secret-inspection
    desc: Native file reads with Chromium login-secret columns
    crit: suspicious
    conf: 0.95
    attack: T1555.003
    all:
      - id: micro-behaviors/fs/path/password-store::chromium-login-data-browser-path-profile
      - id: micro-behaviors/fs/read/file/handle::win32-readfile-source-call
      - id: micro-behaviors/data/db/schema/relational::chromium-password-value-column
      - id: micro-behaviors/data/db/schema/relational::chromium-username-value-column
