# File reads plus browser-specific store and secret-column evidence. A backup
# path alone is insufficient. This does not assert decryption or transmission.
defaults:
  platforms: [windows]
  for: [c, cpp]
  attack: T1555.003

composite_rules:
  - id: native-login-store-secret-inspection
    desc: Native file reads with Chromium login-secret columns
    crit: suspicious
    conf: 0.95
    all:
      - id: micro-behaviors/fs/path/credential/password-store::chromium-login-store-paths
      - id: micro-behaviors/fs/read/file/handle::win32-readfile-source-call
      - id: micro-behaviors/data/db/schema/relational::chromium-password-value-column
      - id: micro-behaviors/data/db/schema/relational::chromium-username-value-column

  # Co-occurrence supports credential recovery, but does not prove data flow
  # between the read, helper and report, or transmission of the report.
  - id: native-login-store-decrypt-password-report
    desc: Chromium login reads with decrypt helper and password JSON
    crit: suspicious
    conf: 0.97
    all:
      - id: native-login-store-secret-inspection
      - id: micro-behaviors/crypto/decrypt/transform/call::native-decrypt-helper-call
      - id: micro-behaviors/data/serialize/schema-credential::native-json-password-key-literal
