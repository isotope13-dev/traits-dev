defaults:
  for:
  - powershell
  platforms:
  - windows
  crit: notable
  conf: 0.98
  attack: T1555.003
composite_rules:
- id: sharpchromium-saved-login-export
  desc: PowerShell retrieves and exports SharpChromium saved passwords
  crit: hostile
  all:
  - id: well-known/tool/offensive/sharpchromium::credential-manager-class
  - id: micro-behaviors/os/security/auth/secret::powershell-saved-login-call
  - id: micro-behaviors/os/security/auth/secret::powershell-password-record-format
