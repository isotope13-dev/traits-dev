defaults:
  platforms: [windows]
  for: [pe, dll]
  attack: T1555.003

composite_rules:
  # Credential-store targeting belongs with the browser store, not keylogging.
  # Copy alone can refer to self-installation. Require whole-file reads and
  # file-data records instead. These are co-occurring references: neither
  # password decryption nor successful network delivery is established.
  - id: managed-keylogger-browser-store-read-references
    desc: Keylogger with Chromium credential-store and file-read references
    crit: hostile
    conf: 0.97
    all:
      - id: micro-behaviors/fs/path/password-store::login-data
      - id: micro-behaviors/fs/read/file/full::dotnet-readallbytes-token
      - id: micro-behaviors/data/format/string::file-data-record-prefix
    any:
      - id: objectives/collection/keylog/hook::dotnet-hook-keylog-recording
      - id: objectives/collection/keylog/hook::managed-low-level-hook-file-keylogger

  # Copying stores does not need a FILE: record or a whole-file read.
  # The suffix/destination call layout strengthens the Copy-name evidence;
  # this remains same-file evidence, not a bound browser-path-to-copy flow.
  # Do not report it twice when the read/record profile already fired.
  - id: managed-keylogger-browser-store-copy-references
    desc: Keylogger, Chromium store and copy-call layout
    crit: hostile
    conf: 0.96
    all:
      - id: micro-behaviors/fs/path/password-store::login-data
      - id: metadata/binary/symbols/name::copy-member-name
      - id: metadata/binary/instruction/sequence::cil-field-root-suffixed-path-true-call
    any:
      - id: objectives/collection/keylog/hook::dotnet-hook-keylog-recording
      - id: objectives/collection/keylog/hook::managed-low-level-hook-file-keylogger
    unless:
      - id: managed-keylogger-browser-store-read-references
