defaults:
  platforms: [windows]
  for: [pe, dll]

composite_rules:
  - id: dotnet-login-data-keylogger-read
    desc: Managed keylogger with Login Data and file-read or Copy references
    crit: hostile
    conf: 0.97
    attack: T1056.001,T1555.003
    all:
      - id: metadata/binary/framework::dotnet-assembly
      - id: metadata/signed/trust-level::unsigned-missing-signature-record
      - id: micro-behaviors/fs/path/password-store::login-data-string
      - id: objectives/collection/keylog/hook::dotnet-hook-keylog-recording
    any:
      - id: micro-behaviors/fs/read/file/full::dotnet-readallbytes-token
      - id: micro-behaviors/fs/file/copy::managed-copy-member-token
    unless:
      - id: metadata/signed/platform/
      - id: objectives/exfiltration/stealer/input::dotnet-chromium-surveillance-stealer
