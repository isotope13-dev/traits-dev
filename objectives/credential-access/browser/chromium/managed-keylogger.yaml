defaults:
  platforms: [windows]
  for: [pe, dll]

composite_rules:
  - id: dotnet-login-data-keylogger-read
    desc: Managed keylogger with Login Data and Copy references
    crit: hostile
    conf: 0.97
    attack: T1056.001,T1555.003
    all:
      - id: metadata/binary/framework::dotnet-assembly
      - id: metadata/signed/trust-level::unsigned-missing-signature-record
      - id: micro-behaviors/fs/path/password-store::login-data-string
      - id: metadata/binary/symbols/name::copy-member-name
    any:
      - id: objectives/collection/keylog/hook::dotnet-hook-keylog-recording
      - id: objectives/collection/keylog/hook::managed-file-keylogger-with-hook
    unless:
      - id: metadata/signed/platform/
      - id: objectives/exfiltration/stealer/input::dotnet-chromium-surveillance-stealer
