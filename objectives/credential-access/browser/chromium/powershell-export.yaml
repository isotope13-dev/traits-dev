# PowerShell Chromium Login Data theft mirrors the Firefox export shape: the
# Empire browser-credential module entrypoint plus managed DPAPI decryption
# plus a Chrome profile credential-store query. The column-order leg used by
# powershell-chromium-login-dpapi-decrypt requires secret columns to precede
# the logins reference, which misses modules that SELECT * FROM logins first
# and read password_value rows afterwards; the module entrypoint supplies the
# equivalent specificity here instead.
defaults:
  for:
  - powershell
  platforms:
  - windows
  crit: notable
  conf: 0.98
  attack: T1555.003
traits:
- id: chromium-password-value-column
  desc: Chromium logins password_value column reference
  if:
    type: text
    word: password_value
composite_rules:
- id: powershell-chromium-dpapi-login-export
  desc: PowerShell decrypts Chromium logins with DPAPI and exports them
  crit: hostile
  all:
  - id: well-known/tool/offensive/powershell-empire::browser-credential-module-functions
  - id: micro-behaviors/os/security/dpapi::dotnet-dpapi-unprotect
  - id: objectives/credential-access/browser/chromium::chromium-profile-credential-query
- id: powershell-chromium-plaintext-file-stage
  desc: Writes decrypted Chromium passwords to disk
  crit: hostile
  all:
  - id: powershell-chromium-dpapi-login-export
  - id: micro-behaviors/fs/write/file/redirect::powershell-credential-report-heading-write
# Raw-byte variant: the Login Data store is copied out from under the
# running browser, read as bytes, and scanned for credential columns
# without any DPAPI/SQLite library call. Copy + raw read + the
# password_value column together are credential extraction, not backup.
- id: powershell-chromium-login-data-byte-extraction
  desc: PowerShell extracts Chromium logins from copied Login Data bytes
  crit: hostile
  all:
  - id: micro-behaviors/fs/path/password-store::login-data
  - id: micro-behaviors/fs/file/copy::powershell-copy-item-command
  - id: micro-behaviors/fs/read/file/full::powershell-file-readallbytes
  - id: chromium-password-value-column
