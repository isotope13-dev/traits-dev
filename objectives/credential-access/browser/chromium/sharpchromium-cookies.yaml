defaults:
  for:
  - powershell
  platforms:
  - windows
  crit: notable
  conf: 0.98
traits:
- id: sharpchromium-host-cookie-json-export
  desc: Serializes Chromium session cookies as JSON
  if:
    type: text
    regex: \[SharpChromium\.HostCookies\]::FilterHostCookies\(.{0,40}\.Tojson\(\)
composite_rules:
- id: sharpchromium-session-cookie-export
  desc: Exports collected Chromium session cookies
  crit: hostile
  all:
  - id: sharpchromium-host-cookie-json-export
  - id: sharpchromium-saved-login-export
