defaults:
  platforms: [windows]
  for: [pyc]
composite_rules:
  - id: pyc-browser-password-decryption-webhook
    desc: Password decryption with webhook references
    crit: hostile
    conf: 0.95
    # Co-occurring credential-decryption and webhook code is an intent
    # indicator. This rule does not prove a source-to-sink data flow.
    attack: T1555.003,T1041
    all:
      - id: micro-behaviors/data/db/access::chromium-login-sql
      - id: micro-behaviors/os/security/dpapi::crypt-unprotect-data-source-reference
      - id: micro-behaviors/crypto/symmetric/aes/library::python-bytecode-gcm-mode-ref
      - id: objectives/exfiltration/messaging/webhook::discord-exfiltration
