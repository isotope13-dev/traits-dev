defaults:
  platforms:
  - windows
  for:
  - pe
  - dll
  attack: T1555
composite_rules:
- id: managed-discord-leveldb-token-harvest
  desc: Browser LevelDB Discord token harvesting
  crit: hostile
  conf: 0.98
  all:
  - id: micro-behaviors/data/format/credentials::discord-encrypted-token-prefix
  - id: micro-behaviors/data/format/credentials::discord-token-regex-source
  - id: micro-behaviors/fs/path/app-data::chromium-leveldb-local-storage
  - id: micro-behaviors/fs/read/file/full::dotnet-read-all-text
  - id: micro-behaviors/communications/http/services/discord::discord-api-users-me-url
  - id: micro-behaviors/fs/path/application/browser::chrome-google-profile-path
- id: managed-discord-protected-token-recovery
  desc: Browser Discord tokens with DPAPI/GCM recovery
  crit: hostile
  conf: 0.98
  all:
  - id: managed-discord-leveldb-token-harvest
  - id: micro-behaviors/os/security/dpapi::managed-prefixed-key-unprotect
  - id: micro-behaviors/crypto/cipher::bouncycastle-gcm-block-cipher-reference
- id: managed-chromium-login-appbound-extraction
  desc: Chromium Login Data extraction with app-bound key recovery
  crit: hostile
  conf: 0.98
  attack: T1555.003
  all:
  - id: micro-behaviors/data/db/access::chromium-login-sql
  - id: micro-behaviors/os/security/dpapi::dotnet-protected-data-reference
  - id: objectives/credential-access/browser/app-bound::app-bound-key-remote-injection-apis
