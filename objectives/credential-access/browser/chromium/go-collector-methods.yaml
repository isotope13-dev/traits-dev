# Garbled Go stealer builds collect browser data through methods named
# GetCookies/GetHistory on garbled receiver types, e.g.
# `a4fWtnl4qq.(*RZFXkKGcikXJ).GetCookies`. The package prefix is randomized
# on every build (garble -literals), so the matcher anchors on the stable
# core: Go method-receiver syntax `(*T).GetCookies|GetHistory`. Ordinary Go
# programs never spell this in their string table: the standard library
# exposes `(*http.Request).Cookies`, not GetCookies/GetHistory, and
# non-browser code has no reason to define such methods.
defaults:
  platforms: [windows]
  for: [pe]
  attack: T1555.003
traits:
  - id: go-browser-data-collector-methods
    desc: Go GetCookies/GetHistory collectors
    crit: suspicious
    conf: 0.9
    if:
      type: text
      regex: '\(\*[A-Za-z0-9]{2,}\)\.(GetCookies|GetHistory)'
