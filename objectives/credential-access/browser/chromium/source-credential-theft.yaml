# Source-level browser credential theft: a Chromium login-store path plus
# DPAPI unprotection plus collection or delivery in one file. The hostile
# composites in traits.yaml are scoped to PE, PowerShell, or C/C++ and
# require SQL or encrypted-key legs, so a C# agent that copies Login Data
# and unprotects it only surfaced as separate notable capabilities.
defaults:
  platforms: [windows]
  for: [csharp]
  attack: T1555.003

composite_rules:
  - id: csharp-browser-login-dpapi-theft
    desc: C# code unprotects browser login-store credentials
    crit: hostile
    conf: 0.96
    attack: T1555.003,T1041
    all:
      - id: micro-behaviors/fs/path/password-store::login-data
      - id: micro-behaviors/os/security/dpapi::dotnet-protected-data-unprotect
    any:
      - id: micro-behaviors/fs/file/copy/source-destination::file-copy-source
      - id: micro-behaviors/communications/http/post::postasync
      - id: micro-behaviors/fs/path/password-store::firefox-profile-credential-stores
    unless:
      - id: well-known/tool/reverse-engineering/forenselab::browser-forensics-module
      - id: well-known/tool/detection/malcontent::malcontent-defensive-scanner-context
