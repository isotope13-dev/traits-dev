defaults:
  for: [pyc]
  platforms: [windows]
  attack: T1555.003,T1567
composite_rules:
  - id: pyc-browser-password-decrypt-telegram-upload
    desc: Password query and DPAPI with embedded Telegram upload credentials
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/data/db/access::chromium-login-sql
      - id: micro-behaviors/os/security/dpapi::crypt-unprotect-data-source-reference
      - id: micro-behaviors/communications/http/auth::hardcoded-telegram-bot-token-bytecode
      - id: micro-behaviors/communications/messaging/send::telegram-bot-api-file-upload
  - id: pyc-browser-payment-decrypt-telegram-upload
    desc: Payment-card query and DPAPI with Telegram upload credentials
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/data/db/access::chromium-credit-card-sql
      - id: micro-behaviors/os/security/dpapi::crypt-unprotect-data-source-reference
      - id: micro-behaviors/communications/http/auth::hardcoded-telegram-bot-token-bytecode
      - id: micro-behaviors/communications/messaging/send::telegram-bot-api-file-upload
