# JavaScript stealers that read stored credential material: browser login data,
# npm and GitHub tokens, cloud and CI credential files, Discord tokens. Split
# from the live-capture bundles now in ../surveillance/javascript.yaml.
defaults:
  crit: hostile
  platforms: [linux, macos, windows, unix, android, ios]
  for: [javascript]
composite_rules:
  - id: js-browser-login-data-stealer
    desc: JavaScript browser credential stealer
    conf: 0.98
    attack: "T1555.003"
    all:
      - id: micro-behaviors/fs/directory/traverse::node-recursive-dirent-walk
      - id: micro-behaviors/fs/path/password-store::login-data
