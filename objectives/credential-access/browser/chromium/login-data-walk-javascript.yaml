# JavaScript stealers that read stored credential material: browser login data,
# npm and GitHub tokens, cloud and CI credential files, Discord tokens. Split
# from the live-capture bundles now in ../surveillance/javascript.yaml.
defaults:
  crit: hostile
  platforms: [linux, macos, windows, unix, android, ios]
  for: [javascript]
  attack: T1555.003
composite_rules:
  - id: js-browser-login-data-stealer
    desc: JavaScript browser credential stealer
    conf: 0.98
    all:
      - id: micro-behaviors/fs/directory/traverse::node-recursive-dirent-walk
      - id: micro-behaviors/fs/path/password-store::login-data
  - id: js-dpapi-aesgcm-login-decrypt
    desc: DPAPI key decrypts Chromium login rows
    conf: 0.97
    for: [javascript, typescript]
    all:
      - id: objectives/credential-access/browser/chromium::password-sql
      - id: objectives/credential-access/browser/chromium::encrypted-key
      - id: objectives/credential-access/browser/chromium::os-crypt
      - id: objectives/credential-access/browser/chromium::local-state
      - id: objectives/credential-access/browser/dpapi::node-dpapi-unprotect
      - id: micro-behaviors/crypto/symmetric/aes/runtime-library::createDecipheriv
