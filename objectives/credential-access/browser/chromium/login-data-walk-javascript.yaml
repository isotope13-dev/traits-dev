# JavaScript stealers that read stored credential material: browser login data,
# npm and GitHub tokens, cloud and CI credential files, Discord tokens. Split
# from the live-capture bundles now in ../surveillance/javascript.yaml.
defaults:
  crit: hostile
  platforms: [linux, macos, windows, unix, android, ios]
  for: [javascript]
  attack: T1555.003
traits:
  - id: chromium-cookie-row-select
    desc: SQL reads encrypted cookie rows
    crit: suspicious
    conf: 0.95
    platforms: [unix, windows]
    if:
      type: text
      regex: 'SELECT[\s\S]{0,160}encrypted_value[\s\S]{0,120}FROM\s+cookies\b'
composite_rules:
  - id: js-browser-login-store-walk
    desc: JavaScript directory walk references Chromium Login Data
    crit: suspicious
    conf: 0.98
    near_lines: 60
    all:
      - id: micro-behaviors/fs/directory/traverse::node-dirent-directory-walk
      - id: micro-behaviors/fs/path/password-store::login-data
    unless:
      - id: well-known/tool/detection/
      - id: well-known/app/ai/coding-agent/
      - id: well-known/app/development/a11ign-screenreader-worker::capture-protocol-export
      - id: micro-behaviors/fs/path/password-store::profile-file-exclusion-list
  - id: js-dpapi-aesgcm-login-decrypt
    desc: DPAPI key decrypts Chromium login rows
    platforms: [windows]
    conf: 0.97
    for: [javascript, typescript]
    all:
      - id: micro-behaviors/data/db/access::chromium-login-sql
      - id: micro-behaviors/data/config/schema::encrypted-key-field-reference
      - id: micro-behaviors/data/config/browser-preference::chromium-os-crypt-reference
      - id: micro-behaviors/fs/path/application/browser::local-state
      - id: micro-behaviors/os/security/dpapi::node-dpapi-unprotect-data-call
      - id: micro-behaviors/crypto/decrypt::node-aes-gcm-decipher-initialization
      - id: micro-behaviors/crypto/decrypt::set-auth-tag
  - id: js-cdp-imported-decrypted-cookie-store
    desc: Decrypts stored cookies into CDP session
    conf: 0.96
    platforms: [unix, windows]
    attack: T1555.003,T1185
    near_bytes: 16384
    all:
      - id: chromium-cookie-row-select
      - id: micro-behaviors/communications/http/devtools/client::cdp-method-network-set-cookies
    any:
      - id: micro-behaviors/data/config/browser-preference::chromium-os-crypt-reference
      - id: micro-behaviors/fs/path/password-store::chrome-safe-storage
