# Chromium ABE helper DLL template markers used by stealers that patch
# configuration into an embedded unsigned DLL before in-browser injection.
# These reserved strings are structural patch sites, not English prose.
defaults:
  platforms: [windows]
  for: [go, pe, dll, c, cpp, rust]
  attack: T1555.003
  mbc: B0028

traits:
  - id: abe-browser-config-mark
    desc: ABE helper DLL browser-config patch mark
    crit: suspicious
    conf: 0.97
    if:
      type: text
      substr: ABE_BROWSER_CONFIG_MARK

  - id: abe-debug-path-placeholder
    desc: ABE helper DLL debug-path patch placeholder
    crit: suspicious
    conf: 0.96
    if:
      type: text
      substr: ABE_DEBUG_PATH_PLACEHOLDER

  - id: abe-key-path-placeholder
    desc: ABE helper DLL key-path patch placeholder
    crit: suspicious
    conf: 0.96
    if:
      type: text
      substr: ABE_KEY_PATH_PLACEHOLDER

  - id: abe-pipe-name-placeholder
    desc: ABE helper DLL named-pipe patch placeholder
    crit: suspicious
    conf: 0.95
    if:
      type: text
      substr: PIPE_NAME_PLACEHOLDER

  - id: abe-blob-data-placeholder
    desc: ABE helper DLL encrypted-blob patch placeholder
    crit: suspicious
    conf: 0.95
    if:
      type: text
      substr: BLOB_DATA_PLACEHOLDER

  - id: abe-payload-export-name
    desc: ABE helper DLL export ABEPayload
    crit: suspicious
    conf: 0.94
    if:
      type: text
      word: ABEPayload

composite_rules:
  - id: abe-helper-dll-patch-template
    desc: Chromium ABE helper DLL multi-site config patch template
    crit: hostile
    conf: 0.99
    all:
      - id: abe-browser-config-mark
      - id: abe-debug-path-placeholder
      - id: abe-key-path-placeholder
    any:
      - id: abe-pipe-name-placeholder
      - id: abe-blob-data-placeholder
      - id: abe-payload-export-name
