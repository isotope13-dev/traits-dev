defaults:
  platforms: [macos]
  for: [applescript, shell, macho]

composite_rules:
  # Require both Chromium stores and its profile location, together with
  # file-reading code and an independently established credential phish.
  # This records co-occurrence, not a source-to-read binding or decryption.
  - id: password-phishing-chromium-store-read-profile
    desc: Password phishing with Chromium stores and reads
    crit: hostile
    conf: 0.96
    attack: T1555.003,T1056.002
    all:
      - id: objectives/credential-access/phishing/lure::applescript-credential-phish-hostile
      - id: micro-behaviors/fs/path/application/browser::chrome-directory
      - id: micro-behaviors/fs/path/password-store::login-data
      - id: micro-behaviors/fs/path/personal::chromium-web-data-file
      - id: micro-behaviors/fs/read/file/handle::applescript-read-result-assignment
