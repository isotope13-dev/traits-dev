defaults:
  for: [pyc]
  platforms: [windows, unix]
  attack: T1555.003,T1567.002
composite_rules:
  - id: pyc-password-query-decrypt-webhook-client
    desc: Browser password query and DPAPI with webhook client
    crit: hostile
    conf: 0.98
    # Static co-occurrence in the application bytecode, not a flow claim.
    all:
      - id: micro-behaviors/data/db/access::chromium-login-sql
      - id: micro-behaviors/os/security/dpapi::crypt-unprotect-data-source-reference
      - id: micro-behaviors/communications/http/webhook::discord-webhook-path
      - id: micro-behaviors/communications/http/webhook::pyc-discord-webhook-client
  - id: pyc-payment-query-decrypt-webhook-client
    desc: Card-number query and DPAPI with webhook client
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/data/db/access::chromium-credit-card-sql
      - id: micro-behaviors/os/security/dpapi::crypt-unprotect-data-source-reference
      - id: micro-behaviors/communications/http/webhook::discord-webhook-path
      - id: micro-behaviors/communications/http/webhook::pyc-discord-webhook-client
