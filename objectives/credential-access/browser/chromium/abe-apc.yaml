# Chromium App-Bound Encryption bypass through a browser memory snapshot and
# same-process decryption. The API names are intentionally language-neutral so
# the composite applies to native and managed implementations alike.
defaults:
  platforms: [windows]
  for: [pe, dll, c, cpp, csharp, rust, go, python]
  attack: T1555.003,T1055.004
  mbc: B0028

traits:
  - id: v20-master-key-name
    desc: Chromium v20 master-key name
    crit: suspicious
    conf: 0.97
    if:
      type: text
      regex: '(?i)\bv20[_-]?master[_-]?key\b'

  - id: v20-key-prefix-bytes
    desc: Chromium v20 key prefix bytes
    crit: suspicious
    conf: 0.95
    if:
      type: text
      regex: '0x76\s*,\s*0x32\s*,\s*0x30\s*,\s*0x00'

  - id: v20-key-structure-tail
    desc: Chromium key structure tail bytes
    # This is only the second half of the signature; generic byte arrays can
    # contain it by chance. The v20 composite supplies the required prefix.
    crit: component
    conf: 0.95
    if:
      type: text
      regex: '0x03\s*,\s*0x00\s*,\s*0x00\s*,\s*0x00\s*,\s*0x00\s*,\s*0x01'

  # The label Chrome gives the App-Bound Encryption key it stores through its
  # elevation service. Naming it is unavoidable for a tool that wants that key:
  # ABE binds the cookie/password key to the browser executable, so the only way
  # to reach it is to ask the elevation service for the key under this exact
  # name, or to lift it out of a browser process that already has it. Chrome
  # itself and legitimate browser code contain it too, which is what the
  # multi-brand and pipe-server legs of the composite below are for.
  - id: chromium-abe-key-label
    desc: Chromium App-Bound Encryption key label
    crit: suspicious
    conf: 0.95
    if:
      type: text
      substr: App-Bound Encryption Key

  # A dumper's own output protocol. Requiring the coordinated sequence keeps
  # ordinary identifiers such as Django's HttpRequest.COOKIES annotation from
  # being mistaken for a browser-secret wire format.
  - id: browser-secret-record-tags
    desc: Browser secret dump record tags
    crit: suspicious
    conf: 0.94
    if:
      type: text
      regex: '(?s)\bMASTER_KEY:.{0,512}\bPASSWORDS:.{0,512}\bCOOKIES:'
    unless:
      - id: well-known/app/utility/siw::chrome-password-helper-marker

  - id: chromium-browser-store-set
    desc: Chromium credential-store filename literals
    crit: suspicious
    conf: 0.92
    if:
      # Login Data and Local State are distinctive Chromium store names.  The
      # generic Cookies label is intentionally excluded: HTML clients and
      # cookie-jar helpers commonly use that word without touching Chromium.
      type: literal
      regex: '^(Login Data|Local State)$'
    unless:
      - id: well-known/app/system/anthropic-cybersecurity-skills::defensive-cybersecurity-skills-repository
      - id: well-known/tool/detection/security-scanner/
      - id: well-known/lib/core/chrome-agent::copy-chrome-cookies-routine
      - id: micro-behaviors/process/create/script/automation::chrome-profile-clone-routine
      - id: micro-behaviors/process/create/script/automation::playwright-persistent-browser-context

composite_rules:
  - id: v20-memory-key-signature
    desc: Chromium v20 master-key memory signature
    crit: suspicious
    conf: 0.98
    all:
      - id: v20-key-prefix-bytes
      - id: v20-key-structure-tail
    near_lines: 40

  - id: chromium-abe-memory-apc-bypass
    desc: Chromium ABE key recovered through process cloning and APC decryption
    crit: hostile
    conf: 0.99
    all:
      - id: v20-memory-key-signature
      - id: micro-behaviors/process/create/fork::nt-create-process-ex-reference
      - id: micro-behaviors/os/security/dpapi::crypt-unprotect-memory-reference
      - id: micro-behaviors/os/security/dpapi::cryptprotectmemory-same-process-flag
      - id: micro-behaviors/process/inject/runtime/call::nt-read-virtual-memory-reference
    any:
      - id: micro-behaviors/process/inject/apc::nt-queue-apc-thread-reference
      - id: micro-behaviors/process/inject/apc::nt-queue-apc-thread-ex2-reference
    near_lines: 100

  - id: chromium-abe-browser-store-access
    desc: Chromium ABE bypass paired with browser credential-store collection
    crit: hostile
    conf: 0.99
    attack: T1555.003
    all:
      - id: chromium-abe-memory-apc-bypass
      - id: chromium-browser-store-set
    near_lines: 140

  # An App-Bound Encryption bypass helper. ABE ties the cookie and password key
  # to the browser binary, so a stealer can no longer just read Local State: it
  # has to get code running with the browser's identity and talk the key back
  # out. That is what this shape is -- the ABE key named explicitly, a
  # named-pipe server for the helper to report through, and its own record tags
  # for the master key and the harvested categories.
  #
  # Chrome's own binaries name the ABE key and speak over named pipes, so
  # neither leg convicts alone; a program that also frames MASTER_KEY,
  # COOKIES and PASSWORDS as its output records is the collector, not the
  # browser.
  - id: chromium-abe-bypass-secret-dumper
    desc: App-Bound Encryption bypass dumps browser secrets
    crit: hostile
    conf: 0.96
    for: [pe, dll]
    all:
      - id: chromium-abe-key-label
      - id: browser-secret-record-tags
    any:
      - id: micro-behaviors/communications/ipc/named-pipe::create-named-pipe
      - id: micro-behaviors/communications/ipc/named-pipe::connect-named-pipe
    unless:
      - id: metadata/signed/platform/
      - id: well-known/app/browser/
