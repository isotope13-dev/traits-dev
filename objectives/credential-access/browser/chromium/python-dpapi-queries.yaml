defaults:
  for:
  - python
  platforms:
  - unix
  - windows
composite_rules:
- id: python-chrome-dpapi-credential-recovery
  desc: Chrome credential queries accompany DPAPI password recovery
  crit: hostile
  conf: 0.98
  all:
  - id: objectives/credential-access/browser/chromium::chromium-profile-credential-query
  - id: micro-behaviors/crypto/decrypt/transform/unspecified::python-dpapi-decrypt-blob
  - id: micro-behaviors/crypto/decrypt/transform/unspecified::python-chrome-decrypt-password
  unless:
  - id: metadata/lang/source/shape::python-literal-module-quoted-source
