defaults:
  platforms: [macos]
  for: [applescript, shell]
  attack: T1005
  mbc: B0028

composite_rules:
- id: chromium-browser-targets
  desc: Multiple Chromium browser targets
  crit: suspicious
  conf: 0.95
  attack: T1555.003
  needs: 4
  any:
  - id: micro-behaviors/fs/path/application/browser::chrome-profile-path
  # A browser name alone is not collection evidence. Require the existing
  # credential-store matcher, which also names Login Data or Cookies.
  - id: brave-path
  - id: micro-behaviors/fs/path/password-store::edge-credential-store-path
  - id: micro-behaviors/fs/path/password-store::vivaldi-credential-store-path
  - id: micro-behaviors/fs/path/application/browser::arc-profile-path
