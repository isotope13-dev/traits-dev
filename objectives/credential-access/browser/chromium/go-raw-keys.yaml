defaults:
  for:
  - pe
  platforms:
  - windows
composite_rules:
- id: go-raw-browser-credentials-with-master-key
  desc: Raw browser credentials with master-key extraction
  crit: hostile
  conf: 0.98
  attack: T1555.003
  all:
  - id: micro-behaviors/fs/path/password-store::login-data
  - id: micro-behaviors/data/config/browser-preference::chromium-app-bound-encrypted-key-field
  - id: micro-behaviors/crypto/key/export::go-versioned-master-key-extraction-call
  - id: micro-behaviors/fs/read/file/full::go-locked-file-read-call
