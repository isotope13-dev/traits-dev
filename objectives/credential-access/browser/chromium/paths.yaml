defaults:
  platforms:
    - unix
    - windows
  for: [scripts, binaries]
  crit: suspicious
  conf: 0.8
  mbc: OB0003
  attack: T1555.003
composite_rules:
  - id: silent-headless-browser-profile
    desc: Multiple browsers configured for silent headless profile access
    crit: suspicious
    conf: 0.97
    for: [source, applescript, elf, javascript, lua, macho, pe, perl, php, powershell, python, ruby, shell]
    all:
      - id: micro-behaviors/fs/path/application/executable::installed-browser-executable-paths
      - id: micro-behaviors/process/create/flags::headless-option
      - id: micro-behaviors/process/create/flags::browser-disable-logging-option
      - id: micro-behaviors/process/create/flags::chromium-user-data-dir
    unless:
      - id: well-known/lib/platform/browser-automation/
      - id: well-known/lib/platform/browser-automation/drivers/selenium::browser-profile-import-workflow
