defaults:
  platforms: [windows]
  for: [python]
composite_rules:
  - id: python-dpapi-browser-query-multipart-upload
    desc: DPAPI browser queries coexist with multipart upload
    crit: suspicious
    conf: 0.98
    attack: T1555.003
    all:
      - id: micro-behaviors/data/db/sql::browser-record-table-select
      - id: micro-behaviors/os/security/dpapi::python-chromium-key-unprotect
      - id: micro-behaviors/communications/http/upload::python-http-files-parameter
