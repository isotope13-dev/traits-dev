defaults:
  for: [lua]
  platforms: [windows]

composite_rules:
  # These references establish a credential-recovery profile. Migration and
  # forensic tools can do the same work, so do not infer theft or exfiltration.
  - id: lua-chromium-password-dpapi-profile
    desc: Lua Chromium password query with master-key and DPAPI references
    crit: suspicious
    conf: 0.96
    attack: T1555.003
    near_bytes: 4096
    all:
      - id: micro-behaviors/data/db/read/column::chromium-login-sql
      - id: micro-behaviors/fs/path/application/browser/profile::local-state
      - id: micro-behaviors/data/config/browser-preference::chromium-encrypted-key-metadata
      - id: micro-behaviors/os/security/dpapi::crypt-unprotect-data-source-reference
