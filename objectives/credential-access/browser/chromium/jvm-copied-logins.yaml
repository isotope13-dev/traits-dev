defaults:
  platforms: [windows]
  for: [class]
composite_rules:
  - id: jvm-chromium-copied-login-reader
    desc: Login Data copying accompanies JDBC byte-column reads
    crit: suspicious
    conf: 0.96
    # The path supplies the browser-store role. The imports and copy are
    # class-local evidence of probable extraction, not a bound SQL data flow.
    all:
      - id: micro-behaviors/fs/path/password-store::jvm-login-data-bytes
      - id: micro-behaviors/fs/file/copy::java-files-copy
      - id: micro-behaviors/data/db/query::jvm-jdbc-statement-query-reference
      - id: micro-behaviors/data/db/query::jvm-jdbc-byte-column-reference
