defaults:
  platforms: [windows]
  for: [pe, dll]
  attack: T1555.003
  mbc: E1555

composite_rules:
  # Login Data selects the credential-access subject. The required byte-read,
  # encoding and POST references are file-scoped: they do not establish that
  # Login Data is the transmitted buffer. Reviewed CIL sends Cookies instead.
  - id: managed-ransom-browser-store-read-send-references
    desc: Ransom recorder with browser-store read, encoding and POST references
    crit: hostile
    conf: 0.96
    all:
      - id: micro-behaviors/fs/path/password-store::login-data
      - id: micro-behaviors/fs/read/file/content/unspecified::dotnet-readallbytes-token
      - id: micro-behaviors/data/encode/base64/primitive::dotnet-to-base64string-text
      - id: micro-behaviors/communications/http/post::postasync
      - id: objectives/exfiltration/stealer/input::managed-ransom-hook-keylog-form-post
