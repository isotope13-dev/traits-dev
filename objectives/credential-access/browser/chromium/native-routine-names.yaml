# Routine names that say "fetch the Chromium master key".
#
# Native stealers encrypt their string tables, but the names of their own
# functions still leak: C++ lambda typeinfo, a stale export trie left in
# __LINKEDIT after `strip`, a Go pclntab, Rust v0 symbols. A macOS C++ stealer
# (2026-09, bazaar 3b46e51bf7a7) kept every path and command encrypted in
# __TEXT,__const yet left `7chrome_masterpassRKNSt3__112basic_string...` in
# its export-trie bytes. The same routine is `getChromeMasterKey` in Go and
# `chrome_master_key` in Rust, so the matcher accepts the snake and camel
# spellings of browser + master + pass/key and no mangling suffix.
#
# The Chromium master key (Safe Storage password on macOS, the DPAPI-wrapped
# `encrypted_key` on Windows) exists only to decrypt Login Data and Cookies;
# a program naming a routine after fetching it is a cookie/password
# decryptor. Suspicious rather than hostile: it is a name the author chose,
# and cookie-export utilities use it too.
defaults:
  platforms: [linux, macos, windows]
  for: [binaries]
  attack: T1555.003
  mbc: B0028

traits:
  - id: master-key-routine-name
    desc: Routine named for Chromium master key
    crit: suspicious
    conf: 0.85
    if:
      type: text
      regex: '(?i)(chrome|chromium|browser)_?master_?(pass(word)?|key)'
