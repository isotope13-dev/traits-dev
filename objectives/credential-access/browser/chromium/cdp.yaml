defaults:
  platforms: [windows, unix]
  for: [scripts, binaries, source]
  attack: T1555.003

# Chromium's remote debugging interface can expose browser session material
# without opening the on-disk cookie database. These are technique-level
# joins, independent of a malware family, language, or C2 address.
#
# The discriminator is the SCOPE of the cookie read, not the debug channel.
# Launching Chromium with --remote-debugging-port and reading cookies is the
# normal shape of every CDP automation client: media sniffers, scrapers, and
# print-to-PDF helpers all drive a browser they spawned themselves and call
# `Network.getCookies {urls:[<page>]}` to rebuild the request header for the
# one resource they are fetching. Pairing the launch flag with that scoped
# read convicted a VS Code video-downloader extension that only ever looked up
# cookies for the media URL it was about to download, in a throwaway profile
# directory it had just created.
#
# A whole-jar read has no such reading: `Network.getAllCookies` and
# `Storage.getCookies` take no URL filter and return every cookie the browser
# holds, for every site. Code that spawns a debuggable browser and then asks
# for the entire jar is harvesting sessions.
composite_rules:
  - id: chromium-cdp-cookie-theft
    desc: Whole Chromium cookie jar dumped through remote debugging
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/process/create/flags::chromium-remote-debugging-port
    any:
      - id: micro-behaviors/communications/http/devtools/client::cdp-method-network-get-all-cookies
      - id: micro-behaviors/communications/http/devtools/client::cdp-method-storage-get-cookies
    near_bytes: 1600
