defaults:
  platforms: [windows, unix]
  for: [scripts, binaries, source]
  attack: T1555.003

# Chromium's remote debugging interface can expose browser session material
# without opening the on-disk cookie database. These are technique-level
# joins, independent of a malware family, language, or C2 address.
composite_rules:
  - id: chromium-cdp-cookie-theft
    desc: Chromium cookies retrieved through remote debugging
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/process/create/flags::chromium-remote-debugging-port
      - id: micro-behaviors/communications/http/devtools/client::cdp-method-network-get-cookies
    near_bytes: 1600
