defaults:
  crit: hostile
  platforms: [windows, unix]
  for: [scripts, binaries, source]
  attack: T1555.003

# Chromium's remote debugging interface can expose browser session material
# without opening the on-disk cookie database. These are technique-level
# joins, independent of a malware family, language, or C2 address.
#
# The discriminator is the SCOPE of the cookie read, not the debug channel.
# Launching Chromium with --remote-debugging-port and reading cookies is the
# normal shape of every CDP automation client: media sniffers, scrapers, and
# print-to-PDF helpers all drive a browser they spawned themselves and call
# `Network.getCookies {urls:[<page>]}` to rebuild the request header for the
# one resource they are fetching. Pairing the launch flag with that scoped
# read convicted a VS Code video-downloader extension that only ever looked up
# cookies for the media URL it was about to download, in a throwaway profile
# directory it had just created.
#
# A whole-jar read has no such reading: `Network.getAllCookies` and
# `Storage.getCookies` take no URL filter and return every cookie the browser
# holds, for every site. Code that spawns a debuggable browser and then asks
# for the entire jar is harvesting sessions. The article's in-process variant
# does not need the launch flag; it enables the internal server inside an
# already-running browser and then uses the same whole-jar operation.
#
# The "which browser is being driven" leg is supplied by the canonical browser
# executable-name union in micro-behaviors/fs/path/application/executable::browser-apps.
# A local alias over the same process names used to live here, which meant a
# bare `chrome.exe` mention in a Selenium test surfaced as a
# credential-access/browser finding even though the matcher only ever read a
# process name.
composite_rules:
  - id: chromium-cdp-cookie-theft
    for: [elf, macho, pe, shell, python, javascript, typescript, rust, java, ruby, c, cpp, go, php, csharp, lua, perl, powershell, swift, objectivec, groovy, kotlin, scala, zig, elixir, clojure, applescript]
    desc: Whole Chromium cookie jar dumped through remote debugging
    conf: 0.98
    all:
      - id: micro-behaviors/process/create/flags::chromium-remote-debugging-port
    any:
      - id: micro-behaviors/communications/http/devtools/client::cdp-method-network-get-all-cookies
      - id: micro-behaviors/communications/http/devtools/client::cdp-method-storage-get-cookies
    near_bytes: 1600

  - id: chromium-cdp-live-storage-cookie-harvest
    for: [elf, macho, pe, shell, python, javascript, typescript, rust, java, ruby, c, cpp, go, php, csharp, lua, perl, powershell, swift, objectivec, groovy, kotlin, scala, zig, elixir, clojure, applescript]
    desc: Live CDP Storage cookie-jar harvest
    conf: 0.98
    attack: T1555.003,T1185
    all:
      - id: micro-behaviors/communications/http/devtools/client::cdp-loopback-endpoint
      - id: micro-behaviors/communications/http/devtools/client::cdp-method-storage-get-cookies
    near_bytes: 1600

  - id: chromium-cdp-live-network-cookie-harvest
    for: [elf, macho, pe, shell, python, javascript, typescript, rust, java, ruby, c, cpp, go, php, csharp, lua, perl, powershell, swift, objectivec, groovy, kotlin, scala, zig, elixir, clojure, applescript]
    desc: Live CDP Network cookie-jar harvest
    conf: 0.98
    attack: T1555.003,T1185
    all:
      - id: micro-behaviors/communications/http/devtools/client::cdp-loopback-endpoint
      - id: micro-behaviors/communications/http/devtools/client::cdp-method-network-get-all-cookies
    near_bytes: 1600

  - id: chromium-in-process-cdp-cookie-theft
    for: [pe, python, javascript, c, go, powershell]
    desc: In-process Chromium CDP server used to dump the browser cookie jar
    conf: 0.99
    attack: T1055,T1555.003,T1185
    all:
      - id: micro-behaviors/communications/http/devtools/server::chromium-internal-devtools-server-routine
      - id: micro-behaviors/fs/path/application/executable::browser-apps
    any:
      - id: micro-behaviors/communications/http/devtools/client::cdp-method-network-get-all-cookies
      - id: micro-behaviors/communications/http/devtools/client::cdp-method-storage-get-cookies
    near_bytes: 2400

  - id: chromium-in-process-cdp-server-enable
    for: [pe, python, javascript, c, go, powershell]
    desc: Chromium internal CDP server enabled through browser-process access
    conf: 0.99
    attack: T1055,T1185
    all:
      - id: micro-behaviors/communications/http/devtools/server::chromium-internal-devtools-server-routine
      - id: micro-behaviors/fs/path/application/executable::browser-apps
    any:
      - id: micro-behaviors/process/attach/rights::open-process-cdp-access-mask
      - id: micro-behaviors/process/inject/dll::create-remote-thread-source
      - id: micro-behaviors/process/inject/runtime/call::create-remote-thread-dup
    near_bytes: 1800
