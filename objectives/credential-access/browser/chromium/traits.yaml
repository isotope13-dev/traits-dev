- id: chromium-profile-credential-query
  desc: Source queries Chrome profile credential tables
  crit: suspicious
  conf: 0.95
  attack: T1555.003
  mbc: B0028
  for: [scripts, source]
  # A Chrome profile path paired with SQL against logins/cookies establishes
  # credential-store access, but not theft by itself: forensic tools, session
  # importers, and profile migration utilities can perform the same query.
  # Decryption or exfiltration composites supply the hostile intent.
  all:
  - id: micro-behaviors/fs/path/application/browser::chrome-user-data
  - id: micro-behaviors/data/db/sql::browser-record-table-select
  any:
  - id: micro-behaviors/fs/path/password-store::login-data
  - id: micro-behaviors/fs/path/cookie::browser-cookies-file-path
