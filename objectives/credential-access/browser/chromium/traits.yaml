defaults:
  platforms:
  - linux
  - macos
  - windows
  for: [scripts, binaries, source]
traits:
# A path string only proves the code knows where Chrome keeps Login Data /
# Cookies. Reading that store is what the eleven composites referencing this
# atom establish, each supplying its own intent leg (decryption, a stealer
# manifest, exfil transport). Standing alone the string is equally the shape of
# `--cookies-from-browser` session import, a profile backup tool, or a browser
# forensics utility -- which is why this atom had grown a list of per-app
# `unless:` allowlists, the usual sign that a bare locator is levelled too
# high. Notable keeps it in every triage and every version diff without letting
# the string alone read as a verdict.
- id: chrome-path
  desc: Chrome credential database path reference
  crit: notable
  conf: 0.7
  attack: T1555.003
  unless:
  - id: well-known/app/system/anthropic-cybersecurity-skills::defensive-cybersecurity-skills-repository
  - id: well-known/app/media/kopuz::music-player-context
  if:
    type: text
    regex: (?i)Google[/\\]Chrome[/\\]User Data[/\\].{0,40}(Login Data|Cookies)
# Same rationale as chrome-path: a Brave/Edge/Opera profile locator alone is
# inventory evidence used by download managers and session-import tools, not
# theft. Composites below supply the credential-access intent legs.
- id: brave-path
  desc: Brave browser profile path
  crit: notable
  conf: 0.7
  attack: T1555.003
  unless:
  - id: well-known/app/system/anthropic-cybersecurity-skills::defensive-cybersecurity-skills-repository
  - id: well-known/app/media/kopuz::kopuz-isolated-cookie-module
  - id: well-known/app/media/kopuz::kopuz-isolated-cookie-leaf
  - id: well-known/app/media/kopuz::music-player-context
  - id: well-known/tool/browser::idm-download-manager-context
  if:
    type: text
    regex: (?i)BraveSoftware[/\\]Brave-Browser.{0,80}(Login Data|Cookies)
  downgrade:
    any:
    - id: metadata/binary/metrics/size::massive-executable
- id: edge-path
  desc: Microsoft Edge browser profile path
  crit: notable
  conf: 0.7
  attack: T1555.003
  unless:
    - id: well-known/app/system/anthropic-cybersecurity-skills::defensive-cybersecurity-skills-repository
    - id: well-known/app/browser/microsoft-edge::microsoft-edge-package-context
    - id: well-known/app/media/kopuz::kopuz-isolated-cookie-module
    - id: well-known/app/media/kopuz::kopuz-isolated-cookie-leaf
    - id: well-known/app/media/kopuz::music-player-context
    - id: well-known/tool/browser::idm-download-manager-context
  if:
    type: text
    regex: (?i)Microsoft[/\\]Edge.{0,80}(Login Data|Cookies)
    case_insensitive: true
- id: opera-macos-path
  desc: Opera macOS profile path
  crit: suspicious
  conf: 0.6
  attack: T1555.003
  if:
    type: text
    substr: /com.operasoftware.Opera/
  unless:
    - id: well-known/app/media/kopuz::kopuz-isolated-cookie-module
    - id: well-known/app/media/kopuz::kopuz-isolated-cookie-leaf
    - id: well-known/app/media/kopuz::music-player-context
    - id: well-known/lib/development/browser-cookie3::browser-cookie3-library-context
- id: opera-windows-path
  desc: Opera Windows profile path
  crit: notable
  conf: 0.7
  attack: T1555.003
  unless:
    - id: well-known/app/system/anthropic-cybersecurity-skills::defensive-cybersecurity-skills-repository
    - id: well-known/app/media/kopuz::kopuz-isolated-cookie-module
    - id: well-known/app/media/kopuz::kopuz-isolated-cookie-leaf
    - id: well-known/app/media/kopuz::music-player-context
    - id: well-known/tool/browser::idm-download-manager-context
  if:
    type: text
    regex: (?i)Opera Software[/\\](Opera|Opera GX Stable).{0,80}(Login Data|Cookies)
- id: operagx-path
  desc: Opera GX browser profile path
  crit: suspicious
  conf: 0.7
  attack: T1555.003
  if:
    type: text
    regex: (?i)(/com\.operasoftware\.OperaGX/|Opera GX Stable.{0,80}(Login Data|Cookies))
  unless:
    - id: well-known/app/media/kopuz::kopuz-isolated-cookie-module
    - id: well-known/app/media/kopuz::kopuz-isolated-cookie-leaf
    - id: well-known/app/media/kopuz::music-player-context
    - id: well-known/lib/development/browser-cookie3/
- id: vivaldi-path
  desc: Vivaldi browser profile path
  crit: suspicious
  conf: 0.7
  attack: T1555.003
  unless:
  - id: well-known/app/media/kopuz::music-player-context
  if:
    type: text
    substr: User Data/Vivaldi
- id: yandex-path
  desc: Yandex browser profile path
  crit: suspicious
  conf: 0.7
  attack: T1555.003
  unless:
  - id: well-known/app/media/kopuz::music-player-context
  - id: metadata/package/testing/presence/harness::test-directory
  - id: well-known/app/ai/linkedin-mcp-server::browser-import-discovery-context
  - id: well-known/app/ai/linkedin-mcp-server::browser-import-archive-context
  if:
    type: text
    substr: Yandex/YandexBrowser
  downgrade:
    any:
    - id: metadata/binary/metrics/size::massive-executable
- id: coccoc-path
  desc: Coccoc browser profile path
  crit: suspicious
  conf: 0.7
  attack: T1555.003
  unless:
  - id: well-known/app/media/kopuz::music-player-context
  if:
    type: text
    substr: /com.coccoc.Coccoc/
- id: encrypted-key
  desc: Chromium encrypted_key field
  crit: component
  conf: 0.85
  attack: T1555.003
  if:
    type: text
    word: encrypted_key
  unless:
  - type: text
    substr: JWE Compact Serialization
  - type: text
    substr: Unsupported JWE alg requested
  - id: metadata/library/data::overwolf-vendor-string
  - id: metadata/lang/scripted::dts-declaration-file
  - type: trait
    id: metadata/file/extension/identity::linux-kernel-package-artifact-basename
  downgrade:
    any:
    - id: metadata/signed/platform::apple
- id: os-crypt
  desc: Chromium os_crypt structure
  crit: notable
  conf: 0.85
  attack: T1555.003
  if:
    type: text
    regex: '(?i)\bos_crypt\s*(::|\.|\()'
  unless:
  - id: metadata/library/data::overwolf-vendor-string
  - id: well-known/lib/runtime/electron::electron-chromium-runtime-strong
  downgrade:
    any:
    - id: metadata/signed/platform::apple
- id: login-data-string
  desc: Login Data artifact string
  crit: component
  conf: 0.75
  attack: T1555.003
  if:
    type: text
    regex: (?i)Login\s+Data
  unless:
  - type: trait
    id: metadata/file/extension/identity::linux-kernel-package-artifact-basename
- id: chromium-cookie-sql
  desc: Chromium cookies table SQL query
  crit: suspicious
  conf: 0.8
  attack: T1555.003
  for: [scripts, source, powershell]
  if:
    type: text
    regex: SELECT.{0,30}host_key.{0,30}encrypted_value.{0,30}FROM\s+cookies
    case_insensitive: true
  unless:
    - id: well-known/app/ai/pi-web-access::browser-cookie-reader-context
    - id: well-known/app/ai/pi-web-access::gemini-cookie-reader-module
    - id: well-known/app/media/kopuz::kopuz-isolated-cookie-module
    - id: well-known/app/media/kopuz::kopuz-isolated-cookie-leaf
    - id: well-known/app/media/kopuz::music-player-context
- id: browser-creds-table-sql
  desc: SQL query against a browser credential table
  # A column-agnostic table query also occurs in forensic and browser
  # integration code; retain it as useful context without asserting intent.
  crit: notable
  conf: 0.9
  attack: T1555.003
  for: [scripts, source, powershell]
  # Matches column-agnostic queries (e.g. `SELECT * FROM `logins``) that the
  # column-specific password-sql/cookie-sql atoms miss. The targeted table name
  # (logins/cookies/credit_cards) carries the credential-theft intent.
  if:
    type: text
    regex: (?i)SELECT\b.{0,80}FROM\s+[`'"]?(logins|cookies|credit_cards)\b
  unless:
  - id: well-known/app/communication/thunderbird::firefox-omni-runtime-path
  - id: metadata/library/automation::google-flow-browser-auth-client
  - id: well-known/app/media/kopuz::kopuz-isolated-cookie-module
  - id: well-known/app/media/kopuz::kopuz-isolated-cookie-leaf
  - id: well-known/app/media/kopuz::music-player-context
  # Selects a single first-party session cookie, not the cookies table.
  - id: well-known/app/ai/kimi-chat-opencode::kimi-chat-opencode-context
# Renamed from `node-kimi-cookie-sql`: the matcher is a generic Chromium
# cookie-store read and has nothing to do with any one vendor. The sibling
# `node-kimi-auth-cookie-name` and `node-kimi-cookie-host-filter` traits were
# removed outright — they hardcoded a single service's cookie name
# (`kimi-auth`) and host (`kimi.com`), so they could never fire on anything but
# that one package, and what they actually matched was a lookup narrowed to one
# first-party domain, which is evidence *against* harvesting rather than for
# it. Those product-specific strings now live where vendor identifiers belong,
# in well-known/app/ai/kimi-chat-opencode.
- id: chromium-encrypted-cookie-sql-select
  desc: SQL selects encrypted browser cookies
  crit: suspicious
  conf: 0.96
  attack: T1555.003
  mbc: B0028
  for: [javascript, typescript]
  if:
    type: text
    regex: 'SELECT\s+quote\(encrypted_value\)\s+FROM\s+cookies'
  unless:
    - id: well-known/app/ai/kimi-chat-opencode::kimi-chat-opencode-context
- id: powershell-cookie-sql
  desc: PowerShell queries the Chromium cookies table
  crit: suspicious
  conf: 0.95
  for: [powershell]
  platforms: [windows]
  attack: T1555.003
  if:
    type: text
    regex: '(?i)\bSELECT\b.{0,180}\bFROM\s+cookies\b'
- id: firefox-cookie-sql
  desc: Firefox moz_cookies table SQL query
  crit: suspicious
  conf: 0.8
  attack: T1555.003
  if:
    type: text
    regex: SELECT.{0,30}host_key.{0,30}encrypted_value.{0,30}FROM\s+moz_cookies
    case_insensitive: true
- id: credit-card-sql
  desc: Chromium credit-card database query
  crit: suspicious
  conf: 0.95
  attack: T1555.003
  mbc: B0028
  if:
    type: text
    regex: SELECT.{0,100}card_number.{0,80}FROM\s+credit_cards
    case_insensitive: true
  unless:
    - id: metadata/package/testing/presence/fixture::php-security-regression-phpunit-context
- id: password-sql
  desc: Chromium Login Data SQL query
  crit: suspicious
  conf: 0.95
  attack: T1555.003
  mbc: B0028
  if:
    type: text
    regex: SELECT.{0,40}origin_url.{0,40}password_value.{0,40}FROM\s+logins
    case_insensitive: true
  downgrade:
    any:
    - id: metadata/signed/certificate/identity::bitdefender-brand-text
  unless:
  - id: well-known/tool/detection/malcontent::malcontent-defensive-scanner-context
  - id: well-known/tool/reverse-engineering/forenselab::browser-forensics-module
- id: chromium-v10-v20-secret-decrypt-reference
  desc: Chromium V10 or V20 secret decryption routine
  crit: notable
  conf: 0.95
  for: [c, cpp]
  platforms: [windows]
  attack: T1555.003
  if:
    type: text
    regex: '\bDecryptChromiumV(10|20)Secret\b'
- id: chromium-dpapi-blob-decrypt-reference
  desc: Chromium DPAPI blob decryption routine
  crit: notable
  conf: 0.95
  for: [c, cpp]
  platforms: [windows]
  attack: T1555.003
  if:
    type: text
    word: DecryptDpapiBlob
- id: chromium-password-extractor-symbol
  desc: Chromium password extraction routine
  crit: suspicious
  conf: 0.94
  for: [binaries]
  platforms: [windows]
  attack: T1555.003
  if:
    type: text
    word: extractChromiumPasswords
- id: chromium-cookie-extractor-symbol
  desc: Chromium cookie extraction routine
  crit: suspicious
  conf: 0.92
  for: [binaries]
  platforms: [windows]
  attack: T1555.003
  if:
    type: text
    word: extractChromiumCookies
- id: chromium-abe-marker
  desc: Chromium ABE bypass marker
  crit: suspicious
  conf: 0.95
  if:
    type: text
    substr: "OSCrypt.AppBoundProvider.Decrypt.ResultCode"
- id: chromium-app-bound-key-name
  desc: Chromium app-bound key name
  crit: suspicious
  conf: 0.95
  platforms: [windows]
  attack: T1555.003
  if:
    type: text
    substr: Google Chromekey1
- id: chromium-app-bound-key-name-wide
  desc: Chromium app-bound key name in UTF-16
  crit: suspicious
  conf: 0.95
  for: [pe, dll]
  platforms: [windows]
  attack: T1555.003
  if:
    type: encoded
    encoding: wide
    exact: Google Chromekey1
- id: app-bound-encrypted-key-field
  desc: Chromium app-bound encrypted key
  crit: suspicious
  conf: 0.95
  platforms: [windows]
  attack: T1555.003
  if:
    type: text
    word: app_bound_encrypted_key
  unless:
  - id: well-known/app/security/bitwarden::bitwarden-app
  - id: well-known/app/media/kopuz::kopuz-isolated-cookie-module
  - id: well-known/app/media/kopuz::kopuz-isolated-cookie-leaf
  - id: well-known/app/media/kopuz::music-player-context
- id: edge-ielevator-iid
  desc: Edge IElevator credential interface
  crit: suspicious
  conf: 0.94
  platforms: [windows]
  for: [binaries]
  attack: T1555.003
  if:
    type: text
    exact: '{c9c2b807-7731-4f34-81b7-44ff7779522b}'
- id: cng-ncrypt-decrypt
  desc: Windows CNG NCryptDecrypt call
  crit: suspicious
  conf: 0.9
  for: [python]
  platforms: [windows]
  if:
    type: symbol
    exact: ncrypt.NCryptDecrypt
- id: browser-key-pipe-tag
  desc: Browser key named pipe tag
  crit: component
  conf: 0.85
  for: [python]
  platforms: [windows]
  if:
    type: text
    regex: pid_to_tag|\\\\\.\\pipe\\
- id: browser-key-pipe-symbol
  desc: Browser key pipe helper symbol
  crit: component
  conf: 0.9
  for: [python]
  platforms: [windows]
  if:
    type: symbol
    exact: pid_to_tag
- id: abe-bypass-set-thread-context-setup
  desc: SetThreadContext setup for ABE bypass (DR7=1)
  crit: suspicious
  conf: 0.95
  for: [pe]
  if:
    type: hex
    pattern: "48 c7 84 24 90 00 00 00 01 00 00 00 48 8d 54 24 20"
    section: .text
- id: abe-bypass-register-extraction
  desc: 'Register-based ABE key extraction'
  crit: suspicious
  conf: 0.95
  for: [pe]
  if:
    type: hex
      # 48 8b 94 24 30 01 00 00 : mov rdx, qword [rsp + 0x130] (R15 in CONTEXT @ 0x20)
      # 85 ed                   : test ebp, ebp
      # 48 0f 45 94 24 28 01 00 : cmovne rdx, qword [rsp + 0x128] (R14 in CONTEXT @ 0x20)
      # 00
    pattern: "48 8b 94 24 30 01 00 00 85 ed 48 0f 45 94 24 28 01 00 00"
    section: .text
- id: target-browser-library
  desc: Targets Chromium or Edge main library
  crit: component
  conf: 0.8
  if:
    type: text
    regex: "(chrome|msedge)\\.dll"
- id: suspicious-browser-launch-flags
  desc: Headless no-sandbox browser launch flags
  crit: suspicious
  conf: 0.85
  if:
    type: text
    substr: "--no-first-run --disable-default-apps --disable-extensions --disable-gpu --no-sandbox"

- id: chromium-master-key-dpapi-symbols--getchromiummasterkey
  desc: DPAPI-decrypts Chromium (getChromiumMasterKey)
