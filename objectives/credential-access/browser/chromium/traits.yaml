- id: native-browser-session-token-log
  # A bare "Session Token:" label is also used by unrelated GUI/network
  # clients.  Keep it as a review clue; browser credential theft requires the
  # stronger extraction/decryption markers below.
  desc: Generic session-token log marker
  crit: notable
  conf: 0.8
  attack: T1555.003
  for: [pe, dll]
  platforms: [windows]
  if:
    type: text
    regex: '(?i)(failed\s+to\s+set\s+)?(Session|Sync)\s+Token:'
  not:
  - substr: 'failed to set session token:'
- id: native-browser-process-discovery-log
  desc: Native browser process discovery log
  crit: notable
  conf: 0.96
  attack: T1555.003
  for: [pe, dll]
  platforms: [windows]
  if:
    type: text
    regex: '(?i)(Found\s+[^\r\n]{0,24}Running\s+Browser\s+Processes|Detected\s+Browser:)'
