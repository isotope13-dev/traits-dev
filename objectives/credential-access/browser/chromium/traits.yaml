  - id: micro-behaviors/data/db/access::chromium-login-sql
  - id: micro-behaviors/communications/http/cookie-store::chromium-app-bound-encrypted-key-field
  - id: micro-behaviors/os/security/dpapi::crypt-unprotect-data-source-reference
  - id: chromium-v10-v20-secret-decrypt-reference
  - id: chromium-dpapi-blob-decrypt-reference
  unless:
  - id: well-known/tool/detection/malcontent::malcontent-defensive-scanner-context
  - id: well-known/tool/reverse-engineering/forenselab::browser-forensics-module

# Duplicating the on-disk Chromium Cookies database into a second profile is
# worth surfacing: a credential store gets copied out of the profile that owns
# it. But these legs stop short of theft. They describe the standard way a
# scraper inherits the user's existing login -- hand the cookie DB to a local
# Chrome and drive it -- and every step stays on the host: the copy's
# destination is a profile this same process launches, and the cookies are read
# back through the browser's own context.
#
# The stealer discriminators are absent by construction. A thief must decrypt
# (Chromium cookie values are DPAPI/AES-GCM sealed), so it needs `local-state`
# + `encrypted-key`, DPAPI, CNG, or an app-bound-key leg -- that is what the
# hostile composites above require -- and it must send the result to a host
# that does not own the session. Neither is checked here, so this cannot carry
# a hostile verdict; suspicious is the honest level for "a credential store was
# duplicated." Same doctrine as the REMOVED note below: session reuse and theft
# are separated by breadth of query and by destination.
- id: python-chromium-cookie-store-copy-to-profile
  desc: Copies Chrome cookie DB into automation profile
  crit: suspicious
  conf: 0.95
  attack: T1185
  for: [python]
  all:
  - id: micro-behaviors/fs/path/application/browser::chrome-path
  - id: micro-behaviors/fs/file/copy::shutil-copy
  - id: micro-behaviors/process/create/flags::chromium-user-data-dir
  - id: micro-behaviors/communications/http/cookies::playwright-browser-context-cookie-read
  near_bytes: 12000
# REMOVED: `node-kimi-browser-session-theft` (hostile) and its `node-kimi-auth-
# cookie-sql` leg. Both were mined from a single package and keyed on one
# vendor's cookie name and host, so they could not fire on any other artifact
# — they detected a named product, not a technique.
#
# They were also mis-described. The legs proved a lookup narrowed to exactly
# one cookie on one first-party domain, which is the shape of a client reusing
# the user's own session with that same service, not of "theft": a stealer
# dumps the cookies table and ships it elsewhere. Calling first-party session
# reuse "theft" in the finding text sends a triager the wrong way.
#
# The generic technique is still covered: `chromium-encrypted-cookie-sql-select`
# above (encrypted cookie-store read), `chrome-safe-storage-keychain-query`,
# and the macOS `chrome-cookie-decryption-chain-macos` composite, which requires the
# Chrome KDF salt plus a keychain/credential-store leg. Genuine theft is
# separated from session reuse by breadth of the query and by the destination
# the recovered secret is sent to.
- id: vscode-extension-chromium-credential-theft
  desc: VS Code extension imports Chromium credential stores
  # An extension may import a user's own browser session into a local
  # automation profile. This capability alone does not establish theft.
  crit: suspicious
  conf: 0.97
  attack: T1555.003
  mbc: B0028
  for: [javascript, typescript]
  all:
  - id: well-known/lib/development/vscode::vscode-extension-marker
  - id: micro-behaviors/communications/http/cookie-store::chromium-encrypted-key-metadata
  any:
  - id: micro-behaviors/data/db/sql::browser-record-table-select
  - id: micro-behaviors/data/db/access::chromium-login-sql
  - id: micro-behaviors/data/db/sql::chromium-cookie-select-query
  - id: chrome-keychain-query
  - id: micro-behaviors/os/security/keychain::chrome-safe-storage-query
  - id: micro-behaviors/fs/path/password-store::chromium-safe-storage-service-name
  - id: micro-behaviors/crypto/kdf/algorithm::chrome-compatible-kdf-salt
  - id: objectives/credential-access/browser/dpapi::node-dpapi-unprotect
  unless:
  - id: well-known/lib/platform/browser-automation/drivers/selenium::browser-profile-import-workflow
  - id: well-known/app/ai/coding-agent/kombai::kombai-browser-session-import-context
