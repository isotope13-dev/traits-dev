defaults:
  platforms:
  - linux
  - macos
  - windows
  for: [scripts, binaries, source]
traits:
- id: chrome-get-local-name-method
  desc: Chromium profile local-name resolver method
  crit: notable
  conf: 0.9
  size_min: 512
  size_max: 500000000
  if:
    type: text
    substr: ChromeGetLocalName
    section: ".text"
- id: chromium-encrypted-cookie-sql-select
  desc: SQL selects encrypted browser cookies
  crit: suspicious
  conf: 0.96
  attack: T1555.003
  mbc: B0028
  for: [javascript, typescript]
  if:
    type: text
    regex: 'SELECT\s+quote\(encrypted_value\)\s+FROM\s+cookies'
  unless:
    - id: well-known/app/ai/gateway/kimi-chat-opencode::kimi-chat-opencode-context
- id: firefox-cookie-sql
  desc: Firefox moz_cookies table SQL query
  crit: suspicious
  conf: 0.8
  attack: T1555.003
  if:
    type: text
    regex: SELECT.{0,30}host_key.{0,30}encrypted_value.{0,30}FROM\s+moz_cookies
    case_insensitive: true
- id: slash-encoded-password-value-field
  desc: Slash-encoded Chromium password database field
  crit: suspicious
  conf: 0.99
  for: [pyc]
  platforms: [windows]
  attack: T1555.003,T1027
  if:
    type: text
    substr: f0aba5af/f0aba4b9/f0aba5b2/f0aba5b6/f0aba5ae/f0aba5b1/f0aba5a3/f0aba59f/f0aba5b5/f0aba4b9/f0aba5ab/f0aba5b4/f0aba5a4
- id: chromium-v10-v20-secret-decrypt-reference
  desc: Chromium V10 or V20 secret decryption routine
  crit: notable
  conf: 0.95
  for: [c, cpp]
  platforms: [windows]
  attack: T1555.003
  if:
    type: text
    regex: '\bDecryptChromiumV(10|20)Secret\b'
- id: chromium-dpapi-blob-decrypt-reference
  desc: Chromium DPAPI blob decryption routine
  crit: notable
  conf: 0.95
  for: [c, cpp]
  platforms: [windows]
  attack: T1555.003
  if:
    type: text
    word: DecryptDpapiBlob
- id: chromium-password-extractor-symbol
  desc: Chromium password extraction routine
  crit: suspicious
  conf: 0.94
  for: [binaries]
  platforms: [windows]
  attack: T1555.003
  if:
    type: text
    word: extractChromiumPasswords
- id: chromium-cookie-extractor-symbol
  desc: Chromium cookie extraction routine
  crit: suspicious
  conf: 0.92
  for: [binaries]
  platforms: [windows]
  attack: T1555.003
  if:
    type: text
    word: extractChromiumCookies
- id: cng-ncrypt-decrypt
  desc: Windows CNG NCryptDecrypt call
  crit: suspicious
  conf: 0.9
  for: [python]
  platforms: [windows]
  if:
    type: symbol
    exact: ncrypt.NCryptDecrypt
- id: browser-key-pipe-tag
  desc: Browser key named pipe tag
  crit: notable
  conf: 0.85
  for: [python]
  platforms: [windows]
  if:
    type: text
    regex: pid_to_tag|\\\\\.\\pipe\\
- id: browser-key-pipe-symbol
  desc: Browser key pipe helper symbol
  crit: notable
  conf: 0.9
  for: [python]
  platforms: [windows]
  if:
    type: symbol
    exact: pid_to_tag
- id: suspicious-browser-launch-flags
  desc: Headless no-sandbox browser launch flags
  crit: suspicious
  conf: 0.85
  if:
    type: text
    substr: "--no-first-run --disable-default-apps --disable-extensions --disable-gpu --no-sandbox"

- id: chromium-master-key-dpapi-symbols--getchromiummasterkey
  desc: DPAPI-decrypts Chromium (getChromiumMasterKey)
  crit: suspicious
  conf: 0.94
  for: [pe, dll]
  platforms: [windows]
  if:
    type: text
    word: getChromiumMasterKey
- id: chromium-master-key-dpapi-symbols--decryptchromiumpassword
  desc: DPAPI-decrypts (decryptChromiumPassword)
  crit: suspicious
  conf: 0.94
  for: [pe, dll]
  platforms: [windows]
  if:
    type: text
    word: decryptChromiumPassword
- id: native-browser-decrypted-key-log
  desc: Native browser decrypted-key log
  crit: suspicious
  conf: 0.97
  attack: T1555.003
  for: [pe, dll]
  platforms: [windows]
  if:
    type: text
    regex: '(?i)V(10|20)\s+Decrypted\s+Key'
- id: native-browser-key-extraction-log
  desc: Native browser key extraction log
  crit: suspicious
  conf: 0.97
  attack: T1555.003
  for: [pe, dll]
  platforms: [windows]
  if:
    type: text
    regex: '(?i)ExtractDecryptedV(10|20)KeyFromLocalState'
- id: native-browser-key-record-send-log
  desc: Native browser key-record send log
  crit: suspicious
  conf: 0.97
  attack: T1555.003
  for: [pe, dll]
  platforms: [windows]
  if:
    type: text
    regex: '(?i)Send(AppBoundKey|Dpapi)KeyRecord'
- id: native-browser-secret-decryption-log
  desc: Native browser secret decryption log
  crit: suspicious
  conf: 0.97
  attack: T1555.003
  for: [pe, dll]
  platforms: [windows]
  if:
    type: text
    regex: '(?i)DecryptChromiumV(10|20)Secret'
- id: native-browser-firefox-key-log
  desc: Native Firefox master-key log
  crit: suspicious
  conf: 0.97
  attack: T1555.003
  for: [pe, dll]
  platforms: [windows]
  if:
    type: text
    regex: '(?i)Firefox\s+Master\s+Key'
- id: native-browser-session-token-log
  # A bare "Session Token:" label is also used by unrelated GUI/network
  # clients.  Keep it as a review clue; browser credential theft requires the
  # stronger extraction/decryption markers below.
  desc: Generic session-token log marker
  crit: notable
  conf: 0.8
  attack: T1555.003
  for: [pe, dll]
  platforms: [windows]
  if:
    type: text
    regex: '(?i)(failed\s+to\s+set\s+)?(Session|Sync)\s+Token:'
  not:
  - substr: 'failed to set session token:'
- id: native-browser-process-discovery-log
  desc: Native browser process discovery log
  crit: notable
  conf: 0.96
  attack: T1555.003
  for: [pe, dll]
  platforms: [windows]
  if:
    type: text
    regex: '(?i:Found\s+[^\r\n]{0,24}Running\s+Browser\s+Processes)|Detected\s+Browser:'
  unless:
  - id: well-known/app/ai/coding-agent/anthropic-claude-code::native-windows-package-context
- id: chromium-login-row-secret-fields
  desc: Chromium login row secret fields
  crit: notable
  conf: 0.97
  for: [scripts, source]
  if:
    type: text
    regex: '(?is)\bpassword_value\b.{0,160}\busername_value\b'
