  - id: metadata/package/testing/corpus/
  - id: well-known/tool/detection/malcontent::malcontent-defensive-scanner-context
  - id: well-known/tool/reverse-engineering/forenselab::browser-forensics-module
  - id: well-known/tool/media/yt-dlp/
  - id: well-known/app/finance/emoney-mcp::session-reuse-context
  downgrade:
    any:
    - id: well-known/tool/offensive/psbits::source-tree-member
