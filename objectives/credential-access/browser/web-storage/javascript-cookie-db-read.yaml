# Reads session cookies out of a Chromium-family profile database from Node.
#
# The composite needs a cookie-table SELECT and a Cookies database path in the
# same file. A session-cookie lookup keyed on host_key is how a copied profile
# is turned into an account token. Copying the database alone is not enough;
# that stays with the copy-to-profile rule above. Without decryption or a
# destination check, the honest level is suspicious.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  attack: T1555.003

traits:
  - id: js-cookie-table-host-select
    desc: Selects name and value by host
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: 'SELECT\s+name,\s*value\s+FROM\s+cookies\s+WHERE\s+host_key'

  - id: js-network-cookies-db-path
    desc: Path names a Network Cookies database
    crit: notable
    conf: 0.85
    if:
      type: text
      regex: 'Network["''`,\s/\\]{1,12}Cookies["''`]'

composite_rules:
  - id: js-cookie-db-select-read
    desc: Reads session cookies from a browser profile database
    crit: suspicious
    conf: 0.9
    near_bytes: 4096
    all:
      - id: js-cookie-table-host-select
      - id: js-network-cookies-db-path
