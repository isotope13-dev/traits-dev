# Recovers the user's profile root from its own install path and walks the
# Local Storage LevelDB stores of several browsers and Electron chat clients.
# Those stores hold session tokens for every signed-in web app; no program
# needs to read other applications' Local Storage across a list of profiles.
defaults:
  platforms: [windows]
  for: [javascript, typescript]
  attack: T1539,T1555.003
composite_rules:
  - id: path-derived-profile-local-storage-sweep
    desc: Path-derived profile root used to sweep browser Local Storage stores
    crit: hostile
    conf: 0.94
    all:
      - id: micro-behaviors/fs/path/app-data/browser::many-local-storage-leveldb-paths
      - id: micro-behaviors/process/identity/query/principal::js-username-from-module-path
    any:
      - id: micro-behaviors/fs/directory/readdir/language::node-readdir-repeated
      - id: micro-behaviors/fs/directory/async-enumeration::node-readdir-async-call
