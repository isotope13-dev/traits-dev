defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
  crit: suspicious
  conf: 0.95
composite_rules:
  - id: injected-page-auth-storage-sweep
    desc: Injected page code sweeps browser token stores
    all:
      - id: micro-behaviors/process/inject/webextension::webextension-scripting-execute
      - id: micro-behaviors/data/db/web-storage::browser-storage-sweep-loop
      - id: micro-behaviors/data/db/web-storage::dom-sessionstorage
      - id: micro-behaviors/data/string/search::auth-token-session-key-filter
  - id: injected-page-cookie-and-token-sweep
    desc: Injected code combines cookie and token reads
    all:
      - id: injected-page-auth-storage-sweep
      - id: micro-behaviors/communications/http/cookie-store::document-cookie-read
