defaults:
  platforms: [android]
  for: [java, kotlin]
  attack: T1056.003,T1411

composite_rules:
  - id: android-webview-injected-form-capture
    desc: Android WebView evaluates DOM input-capture script
    crit: suspicious
    conf: 0.94
    all:
      - id: micro-behaviors/communications/ipc/bridge::source-webview-js-bridge
      - id: micro-behaviors/process/interpreter/eval/direct::webview-evaluate-javascript-source
      - id: micro-behaviors/ui/window/webview::webview-dom-input-selector
      - id: micro-behaviors/ui/window/webview::webview-dom-submit-or-input-listener
    unless:
      - id: well-known/app/system/react-native-webview::react-native-webview-package-context

  - id: android-webview-injected-credential-form-grabber
    desc: Android WebView injects credential and storage harvester
    crit: hostile
    conf: 0.98
    all:
      - id: android-webview-injected-form-capture
      - id: micro-behaviors/ui/window/webview::webview-dom-password-field-check
    any:
      - id: micro-behaviors/ui/window/webview::webview-dom-storage-read
      - id: micro-behaviors/fs/write/file/stream::java-fileoutputstream-source
      - id: micro-behaviors/communications/socket/connect/tcp::java-address-socket-connect
    unless:
      - id: well-known/app/system/react-native-webview::react-native-webview-package-context
