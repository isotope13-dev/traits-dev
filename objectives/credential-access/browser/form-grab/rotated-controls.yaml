defaults:
  for: [pe]
  platforms: [windows]
composite_rules:
  - id: concealed-password-selector-global-hook
    desc: Rotated password selectors, hook and HTTP URL
    crit: hostile
    conf: 0.98
    attack: T1056.003
    all:
      - id: micro-behaviors/ui/controls/credential::rotated-password-control-selectors
      - id: micro-behaviors/ui/window/hook::rotated-global-hook-api-name
      - id: micro-behaviors/communications/http/request/encoded::rotated-http-url-prefix
