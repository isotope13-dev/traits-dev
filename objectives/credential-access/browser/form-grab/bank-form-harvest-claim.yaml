defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  crit: notable
  conf: 0.96

traits:
  - id: bank-form-harvest-claim
    desc: Comment claims banking form-field harvesting
    if:
      type: tree-sitter
      query: |
        ((comment) @claim
          (#match? @claim "(?i)(harvest|steal|exfiltrat|collect)[^\n]{0,90}form[ -]?fields[^\n]{0,90}bank"))
