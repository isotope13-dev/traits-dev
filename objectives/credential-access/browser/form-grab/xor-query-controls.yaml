defaults:
  for: [pe]
  platforms: [windows]
composite_rules:
  - id: concealed-login-query-child-window-reader
    desc: Concealed login queries with edit-control reads
    crit: hostile
    conf: 0.96
    attack: T1056.003,T1041
    all:
      - id: micro-behaviors/communications/http/request/encoded::xor-numbered-login-query
      - id: micro-behaviors/communications/http/request/encoded::xor-numbered-password-query
      - id: micro-behaviors/communications/socket/send::xor-wsasend-name
      - id: micro-behaviors/ui/window/enumerate::enum-child-windows-import
      - id: micro-behaviors/ui/window/enumerate::get-window-text
