defaults:
  for: [pe, dll]
  platforms: [windows]
composite_rules:
  - id: native-login-form-credential-query-transport
    desc: Login form fields with credential URL query and HTTP send
    crit: hostile
    conf: 0.99
    attack: T1056.003,T1041
    all:
      - id: micro-behaviors/ui/controls/credential::native-login-email-password-field-pair
      - id: micro-behaviors/data/format/credentials::credential-query-string-format
      - id: micro-behaviors/communications/http/client/wininet::http-send-request
