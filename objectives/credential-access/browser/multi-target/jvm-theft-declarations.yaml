defaults:
  platforms: [windows, unix]
  for: [class]
  attack: T1555.003
  conf: 0.97
traits:
  # The raw identifier set also makes protected classes eligible for the JAR
  # prepass. The hostile rule separately requires actual method declarations;
  # quoted strings or imported method names cannot satisfy those legs.
  - id: jvm-cookie-password-theft-identifiers
    desc: JVM constants name cookie and password theft
    crit: suspicious
    if:
      type: yara
      source: |
        rule jvm_cookie_password_theft_identifiers {
          strings:
            $cookie = /steal_?cookies/ nocase ascii
            $password = /steal_?passwords/ nocase ascii
            $export = /extract(AndWrite|_and_write)_?Passwords/ nocase ascii
          condition:
            uint32be(0) == 0xcafebabe and $cookie and ($password or $export)
        }
  - id: jvm-cookie-theft-method
    desc: Declares a cookie-theft method
    crit: suspicious
    if:
      type: function
      regex: '(?i)^steal_?cookies$'
  - id: jvm-password-theft-method
    desc: Declares a password-theft method
    crit: suspicious
    if:
      type: function
      regex: '(?i)^steal_?passwords$'
  - id: jvm-password-export-method
    desc: Declares a password extraction/export method
    crit: suspicious
    if:
      type: function
      regex: '(?i)^extract(AndWrite|_and_write)_?Passwords$'
composite_rules:
  - id: jvm-declared-cookie-password-theft
    desc: Declares cookie theft and password extraction
    crit: hostile
    conf: 0.98
    all:
      - id: jvm-cookie-theft-method
    any:
      - id: jvm-password-theft-method
      - id: jvm-password-export-method
