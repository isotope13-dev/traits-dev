defaults:
  platforms: [windows, unix]
  for: [pyc]
  crit: notable
  conf: 0.95
  attack: T1555.003

traits:
  - id: pyc-chromium-key-recovery-name
    desc: Bytecode names Chromium key retrieval
    if:
      type: symbol
      kind: identifier
      regex: '(?i)^_?(read_|get_|decrypt_)?chrom(e|ium)_(master_)?key$'

  - id: pyc-firefox-logins-routine-name
    desc: Bytecode names Firefox login retrieval
    if:
      type: symbol
      kind: identifier
      regex: '(?i)^_?(read_|get_|decrypt_)?firefox_(logins|passwords)$'

  - id: pyc-dpapi-unprotect-api
    desc: Bytecode names Windows DPAPI unprotect API
    if:
      type: symbol
      kind: identifier
      exact: CryptUnprotectData

composite_rules:
  - id: pyc-multiple-browser-secret-recovery
    desc: Bytecode names Chromium key and Firefox login recovery with DPAPI
    crit: suspicious
    conf: 0.97
    all:
      - id: pyc-chromium-key-recovery-name
      - id: pyc-firefox-logins-routine-name
      - id: pyc-dpapi-unprotect-api
