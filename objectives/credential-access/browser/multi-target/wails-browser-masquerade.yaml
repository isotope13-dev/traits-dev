defaults:
  platforms: [macos]
  for: [dmg, zip, plist, macho]
  attack: T1036,T1555.003

composite_rules:
  - id: wails-chrome-bundle-keychain-browser-target
    desc: Chrome-branded Wails bundle targets browser stores and keychain
    crit: hostile
    conf: 0.99
    scope: archive
    all:
      - id: metadata/package/files/included::chrome-app-plist-path
      - id: metadata/build/framework::wails-bundle-id
      - id: objectives/credential-access/phishing/ui::compiled-keychain-password-flow
      - id: objectives/credential-access/browser/multi-target::vivaldi-target
      - id: objectives/anti-static/obfuscation/obfuscator/garble::go-garble-indicators
