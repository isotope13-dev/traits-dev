defaults:
  platforms: [windows]
  for: [batch]
  attack: T1555.003
  crit: suspicious
  conf: 0.98

composite_rules:
  - id: batch-browser-credential-copy
    desc: Batch copies a browser credential or cookie store
    all:
      - id: micro-behaviors/fs/file/copy/source-destination::batch-browser-store-copy
    any:
      - id: micro-behaviors/fs/path/password-store::login-data
      - id: micro-behaviors/fs/path/cookie::browser-cookies-file-path
      - id: micro-behaviors/fs/path/cookie::chromium-network-cookies-path
      - id: micro-behaviors/fs/path/password-store::batch-firefox-credential-store-locations
    unless:
      - id: well-known/tool/detection/
      - id: metadata/package/testing/
