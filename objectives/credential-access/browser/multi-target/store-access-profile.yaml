composite_rules:
- platforms:
  - windows
  for:
  - scripts
  - binaries
  - source
  attack: T1555.003
  id: credential-store-access-api-profile
  desc: Credential stores near copy or SQLite APIs
  crit: suspicious
  conf: 0.96
  near_bytes: 262144
  all:
  - id: micro-behaviors/fs/path/password-store::login-data-string
  - id: micro-behaviors/fs/path/cookie::browser-cookies-file-path
  any:
  - id: micro-behaviors/fs/file/copy::copy
  - id: micro-behaviors/data/db/sqlite::sqlite3-cgo-open
  unless:
  - id: well-known/app/system/iobit::iobit-signed-component-context
  - id: well-known/app/security/itop-vpn::benign-context
