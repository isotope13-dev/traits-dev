defaults:
  platforms: [windows]
  for: [pe, dll]

composite_rules:
  # These are co-occurring targeting and acquisition references. The CLR
  # metadata does not prove which runtime handle was read or duplicated.
  - id: managed-browser-store-handle-copy-references
    desc: Browser stores with handle-copy API references
    crit: suspicious
    conf: 0.96
    attack: T1555.003
    all:
      - id: metadata/binary/framework::dotnet-assembly
      - id: micro-behaviors/fs/path/password-store::chromium-login-store-paths
      - id: micro-behaviors/os/syscall/invoke::nt-query-system-information-cstring
      - id: micro-behaviors/process/fd/dup::duplicate-handle-api-name-reference
      - id: micro-behaviors/fs/read/file/handle::read-file-api-name-reference
