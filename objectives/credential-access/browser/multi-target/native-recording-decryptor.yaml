defaults:
  platforms: [windows]
  for: [pe, dll]
composite_rules:
  # Recording supplies surveillance context; paths and DPAPI alone also
  # occur in legitimate recovery utilities. No browser-killing or outbound
  # password-transfer claim is made by this combination.
  - id: keyboard-recorder-browser-password-decryption
    desc: Keyboard recorder with browser password-decryption APIs
    crit: hostile
    conf: 0.98
    attack: T1555.003
    all:
      - id: objectives/collection/keylog/hook::native-keyboard-hook-recording
      - id: micro-behaviors/data/db/access::select-all-login-table
      - id: micro-behaviors/os/security/dpapi::dpapi-with-chromium-login-data-reference
      - id: micro-behaviors/crypto/decrypt::nss-secret-decrypt-reference
