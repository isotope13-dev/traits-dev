# A native binary carrying Opera, Firefox and Chromium credential-store
# filenames together is a profile-sweeping stealer's target list. Three of the
# four store names are required so one browser's own code never matches.
defaults:
  attack: T1555.003
  platforms: [windows]
  for: [pe, dll]
composite_rules:
  - id: native-browser-store-name-list
    desc: Native target list names several browsers' credential stores
    crit: hostile
    conf: 0.9
    needs: 3
    any:
      - id: micro-behaviors/fs/path/credential/password-store::opera-wand-dat-name
      - id: micro-behaviors/fs/path/credential/password-store::firefox-signons-sqlite-name
      - id: micro-behaviors/fs/path/credential/password-store::firefox-key3-db-name
      - id: micro-behaviors/fs/path/credential/password-store::chromium-login-data-journal-name
    unless:
      - id: well-known/tool/sysadmin/nirsoft/
