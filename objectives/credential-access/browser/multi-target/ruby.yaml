# Ruby script reads both the Firefox saved-login store and the Chromium
# "Login Data" database and captures their contents.
defaults:
  for: [ruby]
  platforms: [unix, windows]
  attack: T1555.003

composite_rules:
  - id: ruby-firefox-chromium-login-store-read
    desc: Reads Firefox and Chromium saved logins
    crit: hostile
    conf: 0.95
    all:
      - id: micro-behaviors/fs/path/password-store::firefox-logins-json-target
      - id: micro-behaviors/fs/path/password-store::login-data
    any:
      - id: micro-behaviors/fs/read/file/content/unspecified::ruby-file-content-base64-value-flow
      - id: micro-behaviors/fs/read/file/target::credential-path-near-file-input
