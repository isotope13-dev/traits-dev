defaults:
  attack: T1555.003
  platforms: [unix, windows, macos]
# Browser Credential Stealer Composite Rules
# Aggregates individual browser data access traits into a high-confidence malware finding
composite_rules:
  - id: composite
    desc: "Comprehensive Browser Data Stealer (Targeting"
    crit: suspicious
    conf: 0.92
    mbc: "E1005"
    for: [elf, macho, pe, python, javascript]
    needs: 2
    all:
      - id: micro-behaviors/os/application/target::multiple-browser-names
    any:
      - id: micro-behaviors/data/config/browser-preference::chromium-encrypted-key-metadata
      - id: micro-behaviors/communications/http/cookie-store::chromium-cookie-query-with-browser-path
      - id: micro-behaviors/fs/path/password-store::firefox-profile-credential-stores
      - id: objectives/credential-access/browser/firefox::nss-decrypt
      - id: objectives/credential-access/browser/firefox::moz-logins-sql
      - id: micro-behaviors/fs/path/cookie::cookies-path
    unless:
      # Media downloaders and cookie-jar libraries legitimately import browser cookies.
      - id: well-known/tool/media/
      - id: well-known/lib/development/browser-cookie3/
  - id: native-dpapi-browser-collector
    desc: DPAPI, browser stores and file APIs co-occur
    crit: suspicious
    conf: 0.92
    mbc: "E1555.003"
    for: [pe, dll]
    platforms: [windows]
    all:
      - id: micro-behaviors/os/security/dpapi::dpapi-with-chromium-login-data-reference
      - id: micro-behaviors/fs/file/open::file-create-win
    any:
      - id: micro-behaviors/data/config/browser-preference::chromium-encrypted-key-metadata
      - id: micro-behaviors/communications/http/cookie-store::chromium-cookie-query-with-browser-path
      - id: micro-behaviors/fs/path/password-store::firefox-profile-credential-stores
      - id: objectives/credential-access/browser/firefox::nss-decrypt
    downgrade:
      any:
        - id: metadata/binary/vendor/
        - id: metadata/binary/resource/identity::pe-version-resource

  - id: hostile-browser-stealer
    desc: Hostile browser data stealer (multi-targeting + exfil/bypass)
    crit: hostile
    conf: 0.98
    for: [elf, macho, pe, python, javascript]
    all:
      - id: objectives/discovery/host/browser/identity::multi-browser-profile-targeting
    any:
      - id: micro-behaviors/communications/http/client/
      - id: objectives/exfiltration/
      - id: micro-behaviors/data/llm/agent::ai-agent-addressing-phrase
      - id: micro-behaviors/data/llm/agent::tool-result-history-append
      - id: objectives/credential-access/browser/app-bound::abe-bypass-hardware-breakpoint
      - id: objectives/anti-analysis/debugger-detect/hardware-breakpoints/
      - id: objectives/anti-analysis/debugger-detect/thread-hide::hide-thread-from-debugger-marker
      - id: micro-behaviors/communications/http/upload::encoded-curl-file-upload
    unless:
      - id: well-known/lib/format/deb-package/
      - id: well-known/tool/detection/
      - id: metadata/package/testing/
      - id: well-known/tool/media/
      - id: well-known/lib/development/browser-cookie3/
      - id: well-known/app/ai/agent-runtime/shardflux-cli::shardflux-browser-import-context
      - id: well-known/app/system/anthropic-cybersecurity-skills::skill-corpus-script-path
      - id: "metadata/file/naming::test-directory-component"
  - id: cookie-store-transfer-stealer
    desc: Browser cookie store transfer stealer
    crit: hostile
    conf: 0.96
    for: [elf, macho, pe]
    ref: sha256:25645bc6bc084101de911c528b795604dedc79647fd7011693f49a8f347cfd3b
    all:
      - id: micro-behaviors/fs/path/cookie::browser-cookies-file-path
      - id: micro-behaviors/communications/http/cookies::domain-attribute
      - id: micro-behaviors/communications/http/upload::multipart-form-data-upload
    any:
      - id: micro-behaviors/fs/path/application/browser::firefox-profile-directory
      - id: micro-behaviors/fs/path/cookie::chromium-network-cookies-path
      - id: micro-behaviors/fs/path/application/browser::chrome-path
      - id: micro-behaviors/fs/path/application/browser::edge-path
    unless:
      - id: well-known/app/communication/thunderbird/
      - id: well-known/tool/detection/
      - id: metadata/package/testing/
      - id: metadata/binary/installer/family/
      - id: "metadata/file/naming::test-directory-component"
