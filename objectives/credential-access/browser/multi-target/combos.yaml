defaults:
  attack: T1555.003
  platforms:
  - unix
  - windows
  - macos
composite_rules:
- id: composite
  desc: Multiple browser credential-store indicators
  crit: suspicious
  conf: 0.92
  mbc: E1005
  for:
  - elf
  - macho
  - pe
  - python
  - javascript
  needs: 2
  all:
  - id: micro-behaviors/os/application/target/browser::multiple-browser-names
  any:
  - id: micro-behaviors/data/config/browser-preference::chromium-encrypted-key-metadata
  - id: micro-behaviors/communications/http/cookie-store::chromium-cookie-query-with-browser-path
  - id: micro-behaviors/fs/path/password-store::firefox-profile-credential-stores
  - id: objectives/credential-access/browser/firefox::nss-decrypt
  - id: objectives/credential-access/browser/firefox::moz-logins-sql
  - id: micro-behaviors/fs/path/cookie::cookies-path
  unless:
  - id: well-known/lib/development/browser-cookie3::browser-cookie3-library-context
  - id: well-known/tool/media/youtube-dl::yt-dlp-browser-cookie-importer
- id: native-dpapi-browser-collector
  desc: DPAPI, browser stores and file APIs co-occur
  crit: suspicious
  conf: 0.92
  mbc: E1555.003
  for:
  - pe
  - dll
  platforms:
  - windows
  all:
  - id: micro-behaviors/os/security/dpapi::dpapi-with-chromium-login-data-reference
  - id: micro-behaviors/fs/file/open/unspecified::file-create-win
  any:
  - id: micro-behaviors/data/config/browser-preference::chromium-encrypted-key-metadata
  - id: micro-behaviors/communications/http/cookie-store::chromium-cookie-query-with-browser-path
  - id: micro-behaviors/fs/path/password-store::firefox-profile-credential-stores
  - id: objectives/credential-access/browser/firefox::nss-decrypt
  unless:
    # libcef.dll manages its own Login Data via DPAPI: the browser engine's
    # own credential handling, not theft (cf. ClassIn installer QA).
    - id: well-known/lib/ui/cef::cef-runtime-binary-context
  downgrade:
    any:
    - id: metadata/binary/resource/identity::pe-version-resource
- id: cookie-store-transfer-stealer
  desc: Browser cookie paths and HTTP upload markers
  crit: suspicious
  conf: 0.96
  for:
  - elf
  - macho
  - pe
  ref: sha256:25645bc6bc084101de911c528b795604dedc79647fd7011693f49a8f347cfd3b
  all:
  - id: micro-behaviors/fs/path/cookie::browser-cookies-file-path
  - id: micro-behaviors/communications/http/cookies::domain-attribute
  - id: micro-behaviors/communications/http/upload/multipart::multipart-form-data-upload
  any:
  - id: micro-behaviors/fs/path/application/browser/profile::firefox-profile-directory
  - id: micro-behaviors/fs/path/cookie::chromium-network-cookies-path
  - id: micro-behaviors/fs/path/application/browser/storage::chrome-path
  - id: micro-behaviors/fs/path/application/browser/profile::edge-path
