defaults:
  platforms: [windows, unix]
  crit: suspicious
  for: [python]

traits:
- id: browser-cookie-database-target
  desc: Browser cookie or login database target
  crit: notable
  conf: 0.9
  if:
    type: text
    regex: '(?i)browser_cookie3|cookies\.sqlite|login data'
- id: browser-credential-term-target
  desc: Browser credential collection target
  crit: notable
  conf: 0.9
  if:
    type: text
    regex: '(?i)browser.{0,40}(cookie|password|history)'
- id: browser-credential-report-format
  desc: Browser credential report fields
  crit: notable
  conf: 0.88
  if:
    type: text
    regex: URL:\s*\{.{0,80}Username:\s*\{.{0,80}Password:\s*\{
- id: credit-card-report-format
  desc: Credit card report fields
  crit: notable
  conf: 0.86
  if:
    type: text
    regex: "Card:.{0,120}CVC:"

composite_rules:
- id: system-info-with-browser
  desc: Host information query beside browser credential targeting
  crit: suspicious
  conf: 0.8
  all:
  - id: browser-credential-target
  # Referenced directly: an alias filed here made every sys.platform check a
  # member of objectives/credential-access/browser/, which
  # stealer-data-source-marker folds in wholesale (aistudio_sdk's zip helper
  # became "data staging for exfiltration").
  - id: micro-behaviors/os/sysinfo/platform/runtime
  near_bytes: 512
  unless:
  - id: metadata/lang/javascript-features::sourcemap-sources-content
  # A cookie library's own test suite reports the platform it is running on
  # next to the browser paths it is exercising -- browser_cookie3's
  # tests/test_browsers.py is that file, not a stealer narrative.
  - id: metadata/package/testing/
  - id: well-known/lib/development/browser-cookie3::browser-cookie3-library-context
- id: browser-credential-target
  desc: Browser credential data target
  crit: component
  conf: 0.9
  any:
  - id: browser-cookie-database-target
  - id: browser-credential-term-target
- id: python-credential-report-stealer
  desc: Python credential report stealer
  crit: hostile
  conf: 0.95
  attack: T1555
  all:
  - id: browser-credential-report-format
  any:
  - id: objectives/credential-access/browser/chromium::password-sql
  - id: objectives/credential-access/browser/firefox::nss-private
  - id: objectives/exfiltration/messaging/telegram::telegram-archive-exfil
- id: python-payment-card-stealer
  desc: Python payment card stealer
  crit: hostile
  conf: 0.95
  attack: T1555.003
  all:
  - id: credit-card-report-format
  - id: micro-behaviors/fs/path/password-store::browser-credit-cards
  any:
  - id: objectives/credential-access/browser/chromium::credit-card-sql
  - id: objectives/exfiltration/messaging/telegram::telegram-archive-exfil
