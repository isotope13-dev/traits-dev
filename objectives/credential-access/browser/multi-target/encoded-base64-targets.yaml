defaults:
  platforms: [linux, macos, windows, unix, android, ios]
  for: [python]
  attack: "T1041"

traits:
- id: encoded-browser-credential-targets
  desc: Encoded payload targets browser credentials
  crit: suspicious
  conf: 0.97
  platforms: [linux, macos, windows]
  for: [data]
  if:
    type: encoded
    encoding: base64
    regex: '(?is)\b(chrome|firefox|edge|brave)\b.{0,800}\b(cookies?|login data|passwords?|autofill)\b'
