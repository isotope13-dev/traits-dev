defaults:
  platforms: [windows, unix]
  for: [java, class, java_class, jar]
  attack: T1555.003

traits:
  - id: java-browser-login-stores
    desc: Java browser login stores
    crit: suspicious
    conf: 0.94
    for: [java, class, java_class]
    if:
      type: text
      regex: 'Login Data[\s\S]{0,220}logins\.json'
    unless:
      - id: well-known/app/communication/thunderbird::librewolf-omni-runtime-path
      - id: well-known/app/communication/thunderbird::librewolf-omni-basename
  - id: jvm-login-data-bytes
    desc: JVM browser Login Data bytes
    crit: suspicious
    conf: 0.94
    for: [class]
    if:
      type: hex
      pattern: 4C 6F 67 69 6E 20 44 61 74 61
    unless:
      - id: well-known/app/communication/thunderbird::librewolf-omni-runtime-path
      - id: well-known/app/communication/thunderbird::librewolf-omni-basename
