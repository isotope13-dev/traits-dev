# Compiled routines named for a browser engine that take an archive writer.
#
# A macOS C++ stealer (2026-09, bfc96a7fa7aa) encrypted every path it used,
# but its stale export-trie bytes kept the mangled collectors:
# `8chromiumRKNSt3__13map<...>RN9miniz_cpp8zip_fileE` and
# `5geckoRKNSt3__112basic_string...RN9miniz_cpp8zip_fileE`. One routine per
# browser engine whose only other argument is the archive being filled is the
# shape of a profile grabber in any language that keeps parameter types in
# its symbols (Itanium C++, Swift, Rust v0). Browsers and their SDKs name
# routines after the engine too, but never hand them a zip writer.
defaults:
  platforms: [linux, macos, windows]
  for: [macho, elf, pe]
  attack: T1555.003,T1005
  mbc: B0028
traits:
  - id: browser-engine-archive-routine
    desc: Browser-engine routine writes into an archive
    crit: suspicious
    conf: 0.85
    if:
      type: text
      regex: '(?i)(^|[^a-z])(chromium|gecko|firefox|safari|webkit)_?R.{0,200}zip_?(file|archive|writer)'
composite_rules:
  # Browser profiles and wallet extensions zipped by their own routines is
  # the core of a commodity stealer; two more collectors or credential
  # probes rule out a lone backup helper.
  - id: native-browser-archive-stealer
    desc: Zips browser profiles and wallet extensions
    crit: hostile
    conf: 0.95
    all:
      - id: browser-engine-archive-routine
      - id: micro-behaviors/browser-extension/management::grab-extensions-routine-name
    needs: 2
    any:
      - id: objectives/credential-access/messaging/telegram::telegram-archive-routine
      - id: objectives/credential-access/phishing/ui::native-fake-authorization-prompt
      - id: micro-behaviors/os/security/auth/verify::opendirectory-user-password-check
      - id: micro-behaviors/os/security/auth/verify::csidentity-auth
      - id: micro-behaviors/os/security/keychain::secitem-no-auth-ui
