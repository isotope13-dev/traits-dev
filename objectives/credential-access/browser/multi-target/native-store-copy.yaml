defaults:
  platforms: [windows]
  for: [pe, dll]
composite_rules:
  - id: native-browser-store-copy-dpapi-clues
    desc: Browser login stores with file-copy and DPAPI decryption APIs
    crit: suspicious
    conf: 0.94
    attack: T1555.003
    all:
      - id: micro-behaviors/fs/path/password-store::chromium-login-store-paths
      - id: micro-behaviors/fs/path/password-store::firefox-logins-json-target
      - id: micro-behaviors/fs/path/application/browser/profile::local-state
      - id: micro-behaviors/fs/file/copy/call::copyfile-w
      - id: micro-behaviors/os/security/dpapi::crypt-unprotect-data-api
