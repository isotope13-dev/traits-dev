# A browser helper resolves Chromium profile brands, invokes a COM
# DecryptData handler, and exchanges length-prefixed requests over a named
# pipe. This composite requires the targeting and handler markers together
# with the native pipe client APIs; it does not infer network exfiltration.
defaults:
  platforms: [windows]
  for: [pe, dll]
  attack: T1555.003

composite_rules:
  - id: chromium-profile-com-decrypt-helper-over-pipe
    desc: Chromium profile COM decryption helper over named-pipe IPC
    crit: hostile
    conf: 0.94
    all:
      - id: micro-behaviors/os/application/target/browser::chromium-brand-target-table
      - id: micro-behaviors/fs/path/app-data::chromium-user-data-directory-text
      - id: metadata/binary/symbols/name/token::decryptdata-name-reference
      - id: micro-behaviors/os/com/invoke::co-create-instance
      - id: micro-behaviors/os/com/invoke::co-set-proxy-blanket
      - id: micro-behaviors/communications/ipc/named-pipe::wait-named-pipe
      - id: micro-behaviors/communications/ipc/pipe::peek-named-pipe
    unless:
      - id: metadata/signed/platform/
      - id: well-known/app/browser/
      - id: well-known/app/security/bitwarden::bitwarden-app
      - id: well-known/app/utility/siw::chrome-password-helper-marker
