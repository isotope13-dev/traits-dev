# A native binary that knows the profile directories of several Chromium
# browsers, kills running processes in a toolhelp loop (browsers lock their
# cookie and login databases) and unwraps secrets with CryptUnprotectData.
# Any one leg belongs to backup or migration tools; the set is a stealer.
defaults:
  platforms: [windows]
  for: [pe]
  attack: T1555.003,T1539
composite_rules:
  - id: native-multi-browser-kill-and-dpapi-unwrap
    desc: Native multi-browser profiles, process kill and DPAPI
    crit: hostile
    conf: 0.9
    all:
      - id: micro-behaviors/fs/path/app-data::chromium-profile-user-data-path
      - id: micro-behaviors/os/security/dpapi::crypt-unprotect-data-api
      - id: micro-behaviors/process/terminate/kill::toolhelp-kill-loop-source
    any:
      - id: micro-behaviors/fs/path/application/browser::brave-profile-directory
      - id: micro-behaviors/fs/path/application/browser::chrome-google-profile-path
      - id: micro-behaviors/fs/path/application/browser::edge-windows-profile
      - id: micro-behaviors/fs/path/application/browser::opera-windows-profile-directory
      - id: micro-behaviors/fs/path/application/browser::vivaldi-profile-directory
    needs: 3
    unless:
      - id: metadata/signed/platform/
      - id: metadata/package/testing/
      - id: well-known/app/security/bitwarden::verified-bitwarden-windows-binary

