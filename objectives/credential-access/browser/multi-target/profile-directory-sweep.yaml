# Browser paths and capture APIs also occur in ordinary applications.
# Require explicit secret decryption and a recovered-account response field
# before combining them with independent capture capabilities.
defaults:
  platforms: [windows]
  for: [binaries, scripts, source]
  attack: T1555.003

composite_rules:
  - id: browser-secret-recovery-with-capture-cluster
    desc: Browser secret reports beside capture, task or cookie APIs
    crit: hostile
    conf: 0.95
    needs: 2
    all:
      - id: micro-behaviors/fs/path/application/browser::browser-data-path
      - id: micro-behaviors/crypto/decrypt::nss-secret-decrypt-reference
      - id: micro-behaviors/data/serialize/schema-credential::recovered-accounts-response-accessor
    any:
      - id: micro-behaviors/hardware/input/keyboard/poll::polling-keyboard-api-cluster
      - id: micro-behaviors/hardware/display/screenshot::gdi-screen-capture-primitives
      - id: micro-behaviors/os/clipboard/read::get-clipboard-data
      - id: micro-behaviors/os/autorun/scheduled::schtasks-utility-token
      - id: micro-behaviors/communications/http/cookies::internet-get-cookie
    unless:
      - id: well-known/app/browser/
      # Two broad directory guards were in the first draft and both
      # suppressed this rule on the stealer itself: `metadata/package/testing/`
      # because the bundle ships a `tests/` path like every Python bundle, and
      # `well-known/tool/detection/` because the strings carry threat-intel
      # vocabulary. A directory `unless:` matches on any member of the
      # subtree, and malware contains the vocabulary of the thing you are
      # trying to exclude. Name the specific contexts instead -- grouped in
      # browser-profile-capture-known-benign-context.
      - id: browser-profile-capture-known-benign-context
      - id: well-known/tool/media/yt-dlp/
      - id: well-known/tool/media/gallery-dl::package-context
      - id: metadata/binary/debug::pdb-remcos-backdoor-tree

  # Named benign software that reads a browser profile store and also touches
  # input, screen, clipboard or scheduling APIs for its own features.
  - id: browser-profile-capture-known-benign-context
    desc: Recognized software reading browser profiles
    crit: exception
    conf: 0.95
    any:
      - id: well-known/tool/detection/cleave::cleave-static-analysis-context
      - id: well-known/dual-use/remote-admin/tightvnc::tightvnc-viewer-verified-identity
      - id: well-known/lib/development/browser-cookie3::browser-cookie3-library-context
      - id: well-known/app/storage/syncback::syncback-backup-benign-context
      - id: well-known/app/ai/coding-agent/anthropic-claude-code::native-windows-package-context
      # Bun embeds a browser-launch table (`...\User Data\DevToolsActivePort`
      # per Chromium fork) for its open/inspect integration, a clipboard API
      # (GetClipboardData import), and Shiki TextMate grammars whose batch
      # command wordlist names schtasks -- so a compiled Bun app assembles the
      # profile anchor plus two companion legs with no credential access at
      # all. hunk.exe (Bun 1.3.14 terminal diff viewer) is the measured case.
      - id: well-known/lib/runtime/scripted/bun-runtime::bun-windows-runtime-binary
      - id: well-known/app/ai/agent-runtime/cua-driver::cua-driver-binary-identity

  # Retired discord-token-validation-with-credential-access: an account URL
  # and a browser profile path do not establish token validation or theft.
