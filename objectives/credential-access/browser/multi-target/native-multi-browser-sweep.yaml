# Native multi-browser credential-store sweeping: one binary querying the
# Firefox login database while also naming the Chromium credential store (and
# legacy signon files) is the stealer signature. A browser reads only its own
# store; recovery utilities that legitimately sweep every store carry the
# NirSoft vendor context and are excluded.
defaults:
  attack: T1555.003
  platforms: [windows]
  for: [pe, dll]
composite_rules:
  - id: native-multi-browser-store-sweep
    desc: Native code sweeps Firefox and Chromium credential stores
    crit: hostile
    conf: 0.9
    all:
      - id: objectives/credential-access/browser/firefox::moz-logins-sql
      - id: micro-behaviors/fs/path/application/browser::chrome-path
    any:
      - id: micro-behaviors/fs/path/password-store::firefox-legacy-signons-file
      - id: micro-behaviors/fs/path/password-store::firefox-logins
    unless:
      - id: well-known/tool/sysadmin/nirsoft/
