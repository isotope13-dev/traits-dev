# Cross-language multi-store credential harvesting.
#
# The AUR second stage targets unrelated browser, cloud/developer, and SSH
# stores from one agent. The individual path traits remain neutral
# capabilities; this file infers a stealer only from the breadth of stores and
# the separate SSH payload-propagation behavior.
defaults:
  platforms: [unix, windows]
  for: [scripts, binaries, python, pyc, rust, go, c, cpp, objc, javascript, typescript]
  attack: "T1555,T1552.001,T1552.004"
  mbc: E1552

traits:
  # Chromium browser *display* names, matched as whole extracted runs rather
  # than substrings, so these are table entries and not prose. A program that
  # carries the brand list is iterating installed Chromium builds; each has its
  # own user-data directory and its own App-Bound key, so a harvester has to
  # enumerate them by name to reach all of them.
  #
  # Component tier: browsers, password-manager importers and installer bundles
  # legitimately carry brand tables. The composite supplies the intent.
  - id: chromium-brand-name-chrome-beta
    desc: Chrome Beta browser brand name
    crit: notable
    conf: 0.9
    for: [pe, dll]
    if:
      type: text
      exact: Chrome Beta
  - id: chromium-brand-name-edge
    desc: Edge browser brand name
    crit: component
    conf: 0.9
    for: [pe, dll]
    if:
      type: text
      exact: Edge
  - id: chromium-user-data-directory-text
    desc: Chromium User Data directory label
    crit: component
    conf: 0.88
    for: [pe, dll]
    if:
      type: text
      exact: User Data

composite_rules:

  - id: chromium-brand-target-table
    desc: Table of Chromium browser brand names
    crit: suspicious
    conf: 0.9
    for:
    - pe
    - dll
    any:
    - id: chromium-brand-name-chrome-beta
    - id: micro-behaviors/os/application/target::chromium-brand-name-brave
    - id: chromium-brand-name-edge
    needs: 3
    unless:
    - id: well-known/app/utility/siw::chrome-password-helper-marker
  - id: multi-brand-chromium-abe-harvest
    desc: Sweeps Chromium brands for App-Bound keys
    crit: hostile
    conf: 0.95
    for: [pe, dll]
    attack: T1555.003
    all:
      - id: chromium-brand-target-table
      - id: objectives/credential-access/browser/app-bound::chromium-abe-key-label
    unless:
      - id: metadata/signed/platform/
      - id: well-known/app/browser/
      - id: well-known/app/security/bitwarden::bitwarden-app
  - id: chromium-multi-brand-cookie-harvest-pe
    desc: PE enumerates Chromium brands and User Data
    crit: hostile
    conf: 0.93
    for: [pe, dll]
    platforms: [windows]
    attack: T1555.003
    all:
      - id: chromium-brand-target-table
      - id: chromium-user-data-directory-text
      - id: micro-behaviors/fs/path/basename::browser-process-name-main
    unless:
      - id: metadata/signed/platform/
      - id: well-known/app/browser/
      - id: well-known/app/utility/siw::chrome-password-helper-marker
