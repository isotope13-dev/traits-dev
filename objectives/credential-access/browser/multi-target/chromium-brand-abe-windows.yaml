# Browser brand references are neutral; key/cookie evidence supplies intent.
defaults:
  platforms: [unix, windows]
  for: [scripts, binaries, python, pyc, rust, go, c, cpp, objc, javascript, typescript]
  attack: "T1555,T1552.001,T1552.004"
  mbc: E1552

composite_rules:

  - id: multi-brand-chromium-abe-harvest
    desc: Sweeps Chromium brands for App-Bound keys
    crit: hostile
    conf: 0.95
    for: [pe, dll]
    attack: T1555.003
    all:
      - id: micro-behaviors/os/application/target::chromium-brand-target-table
      - id: objectives/credential-access/browser/app-bound::chromium-abe-key-label
    unless:
      - id: metadata/signed/platform/
      - id: well-known/app/browser/
      - id: well-known/app/security/bitwarden::bitwarden-app
  - id: chromium-multi-brand-cookie-harvest-pe
    desc: PE targets Chromium brands and queries encrypted cookies
    crit: hostile
    conf: 0.93
    for: [pe, dll]
    platforms: [windows]
    attack: T1555.003
    all:
      - id: micro-behaviors/os/application/target::chromium-brand-target-table
      - id: micro-behaviors/fs/path/app-data::chromium-user-data-directory-text
      - id: micro-behaviors/process/info/name::browser-process-name-main
      - id: micro-behaviors/data/db/access::chromium-encrypted-cookie-sql
    unless:
      - id: metadata/signed/platform/
      - id: well-known/app/browser/
      - id: well-known/app/utility/siw::chrome-password-helper-marker
