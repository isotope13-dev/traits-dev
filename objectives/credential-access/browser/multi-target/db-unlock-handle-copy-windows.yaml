defaults:
  platforms:
    - unix
    - windows
  for: [scripts, binaries]

traits:
  - id: native-browser-handle-copy-start-log
    desc: Native browser handle-copy start log
    crit: suspicious
    conf: 0.97
    attack: T1555.003
    for: [pe, dll]
    platforms: [windows]
    if:
      type: text
      regex: '(?i)Attempting\s+To\s+Steal\s+Opened\s+File\s+Handles'
  - id: native-browser-handle-copy-result-log
    desc: Native browser handle-copy result log
    crit: suspicious
    conf: 0.97
    attack: T1555.003
    for: [pe, dll]
    platforms: [windows]
    if:
      type: text
      regex: '(?i)Successfully\s+Copied\s+File\s+Via\s+Duplicated\s+Handle'
  - id: native-browser-target-handle-log
    desc: Native browser target-handle log
    crit: suspicious
    conf: 0.97
    attack: T1555.003
    for: [pe, dll]
    platforms: [windows]
    if:
      type: text
      regex: '(?i)Found\s+Target\s+File\s+Handle\s+In\s+Process'
  - id: managed-browser-stealer-scan-label
    desc: Managed browser and wallet scan labels
    crit: notable
    conf: 0.97
    attack: T1555.003,T1552.001
    for: [data, oledoc, pe, dll]
    platforms: [windows]
    if:
      type: text
      regex: '(?i)(ScanBrowsers|ScanWallets)'
  # The stealer's result-record field only. `get_Cookies` is the compiler-
  # generated getter of every .NET HttpRequest/HttpResponse.Cookies property
  # (System.Web, System.Runtime.Remoting in the .NET 3.5 feature package), so
  # it said nothing about browsers.
  - id: managed-browser-cookie-label
    desc: Stealer ScannedCookie record label
    crit: notable
    conf: 0.97
    attack: T1555.003
    for: [data, oledoc, pe, dll]
    platforms: [windows]
    if:
      type: text
      regex: '(?i)ScannedCookie'
  - id: managed-browser-credential-label
    desc: Managed credential-related API or field label
    crit: component
    conf: 0.97
    attack: T1555.003
    for: [data, oledoc, pe, dll]
    platforms: [windows]
    if:
      type: text
      regex: '(?i)(get_Password|ScannedPassword|PasswordVault|Login[ _]Data)'

composite_rules:
  - id: managed-stealer-browser-target-cluster
    desc: Managed browser stealer target cluster
    crit: hostile
    conf: 0.99
    attack: T1555.003,T1552.001
    for: [data, oledoc, pe, dll]
    platforms: [windows]
    all:
      - id: managed-browser-stealer-scan-label
      - id: managed-browser-cookie-label
      - id: managed-browser-credential-label
  - id: native-browser-handle-copy-log
    desc: Native browser file-handle copy
    crit: suspicious
    conf: 0.98
    attack: T1555.003
    for: [pe, dll]
    platforms: [windows]
    any:
      - id: native-browser-handle-copy-start-log
      - id: native-browser-handle-copy-result-log
      - id: native-browser-target-handle-log
  - id: native-browser-key-material-theft
    desc: Native browser key-material theft
    crit: hostile
    conf: 0.99
    attack: T1555.003
    for: [pe, dll]
    platforms: [windows]
    all:
      - id: objectives/credential-access/browser/chromium::native-browser-key-extraction
      - id: objectives/credential-access/browser/chromium::native-browser-process-discovery-log
  - id: native-browser-file-handle-theft
    desc: Native browser file-handle theft
    crit: hostile
    conf: 0.99
    attack: T1555.003
    for: [pe, dll]
    platforms: [windows]
    all:
      - id: native-browser-handle-copy-log
      - id: objectives/credential-access/browser/chromium::native-browser-process-discovery-log
  - id: browser-cred-harvest
    desc: Browser credential database harvesting
    crit: suspicious
    conf: 0.85
    attack: T1555.003
    unless:
      - id: well-known/dual-use/transfer/alist::release-path
    all:
      - id: micro-behaviors/fs/path/password-store::browser-process-or-credential-store-reference
      - id: micro-behaviors/data/db/sqlite::go-sqlite3
