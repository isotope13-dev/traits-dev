defaults:
  platforms: [windows]
  for: [scripts, source, binaries]
  attack: T1555.003

composite_rules:
  - id: esentutl-multi-browser-credential-copy
    desc: Raw-copies Firefox and Chromium credential databases with Esentutl
    crit: hostile
    conf: 0.99
    all:
      - id: micro-behaviors/fs/file/copy::esentutl-raw-file-copy
      - id: micro-behaviors/fs/path/password-store::chromium-login-data-browser-path-profile
      - id: micro-behaviors/fs/path/password-store::firefox-profile-credential-stores
    near_lines: 4
