defaults:
  platforms: [windows]
  for: [data]
composite_rules:
  # Required recording code establishes surveillance context. Each credential
  # source is required separately; this is co-occurrence, not a bound transfer.
  - id: native-keylogger-substituted-browser-password-stores
    desc: Keylogger with concealed Firefox and Chromium credential recovery
    crit: hostile
    conf: 0.98
    attack: T1555.003
    all:
      - id: objectives/collection/keylog/device::native-translated-scrambled-key-log-data
      - id: objectives/credential-access/browser/firefox::substituted-moz-logins-sql
      - id: micro-behaviors/crypto/decrypt::substituted-nss-secret-decrypt-reference
      - id: micro-behaviors/fs/path/password-store::substituted-chromium-default-login-store
      - id: micro-behaviors/os/security/dpapi::crypt-unprotect-data-container-string
