defaults:
  platforms: [macos]
  for: [macho]
  attack: T1555.003
  mbc: B0028
traits:
  - id: parse-profile-symbol
    desc: Browser profile parser symbol
    crit: suspicious
    conf: 0.95
    if:
      type: symbol
      regex: ^main\.\(\*[A-Za-z0-9_]{4,}\)\.ParseProfile$
  - id: parse-extension-symbol
    desc: Browser extension parser symbol
    crit: suspicious
    conf: 0.95
    if:
      type: symbol
      regex: ^main\.\(\*[A-Za-z0-9_]{4,}\)\.ParseExt$
  - id: profiles-symbol
    desc: Browser profiles enumeration symbol
    crit: suspicious
    conf: 0.9
    if:
      type: symbol
      regex: ^main\.\(\*[A-Za-z0-9_]{4,}\)\.Profiles$
  - id: cookiesnamed-symbol
    desc: Named cookie access symbol
    crit: notable
    conf: 0.95
    if:
      type: symbol
      regex: ^main\.\(\*[A-Za-z0-9_]{4,}\)\.CookiesNamed$
  - id: setcookies-symbol
    desc: Cookie staging setter symbol
    crit: suspicious
    conf: 0.9
    if:
      type: symbol
      regex: ^main\.\(\*[A-Za-z0-9_]{4,}\)\.SetCookies$
  - id: extra-extensions
    desc: Extra browser extensions target
    crit: notable
    conf: 0.9
    if:
      type: text
      exact: ExtraExtensions
  - id: vivaldi-target
    desc: Vivaldi browser target reference
    crit: suspicious
    conf: 0.85
    if:
      type: text
      regex: Vivaldi.{0,20}(Cookies|key4\.db)
  - id: key4-db
    desc: Firefox key4.db target reference
    crit: suspicious
    conf: 0.95
    if:
      type: text
      exact: key4.db
    unless:
      - id: well-known/tool/detection/security-scanner-identity::apple-xprotectd-scanner-context
composite_rules:
  - id: browser-profile-collection
    desc: Native browser profile collection
    crit: suspicious
    conf: 0.95
    all:
      - id: parse-profile-symbol
    any:
      - id: profiles-symbol
      - id: vivaldi-target
      - id: key4-db
  - id: browser-extension-collection
    desc: Native browser extension collection
    crit: suspicious
    conf: 0.95
    all:
      - id: parse-extension-symbol
    any:
      - id: extra-extensions
      - id: vivaldi-target
  - id: browser-cookie-collection
    desc: Native browser cookie collection
    crit: suspicious
    conf: 0.95
    all:
      - id: browser-profile-collection
    any:
      - id: cookiesnamed-symbol
      - id: setcookies-symbol
  - id: native-browser-data-stealer
    desc: Native multi-browser data stealer
    crit: hostile
    conf: 0.98
    all:
      - id: browser-profile-collection
      - id: browser-extension-collection
      - id: browser-cookie-collection
    any:
      - id: key4-db
      - id: vivaldi-target

  - id: fake-app-wallet-file-read
    desc: Fake app reads wallet files
    crit: hostile
    conf: 0.96
    for: [dmg, macho, plist]
    scope: archive
    all:
      - id: objectives/credential-access/theft/multi-app::browser-wallet-stealer
      - id: objectives/evasion/masquerade/identity/bundle::fake-app-identity
      - id: objectives/credential-access/theft/file::exceptions-file-reader

  - id: wallet-launch-at-load
    desc: Wallet stealer loads at login
    crit: hostile
    conf: 0.95
    all:
      - id: objectives/credential-access/theft/multi-app::browser-wallet-stealer
      - id: objectives/persistence/system/install-marker::embedded-runatload-true-element
      - id: micro-behaviors/process/create/script/osascript::osascript-exec

  - id: browser-cookie-login-harvest
    desc: Reads browser cookies and logins
    crit: hostile
    conf: 0.96
    all:
      - id: objectives/credential-access/browser/safari::cookies-binarycookies
      - id: objectives/credential-access/browser/chromium::logins-table
      - id: objectives/credential-access/browser/chromium::opera-macos-path

  - id: hidden-dock-login-persist
    desc: Hides dock icon and persists
    crit: hostile
    conf: 0.95
    all:
      - id: objectives/evasion/process/hidden/window::hide-dock-icon-action
      - id: micro-behaviors/os/autorun/login-items::session-loginitems-key-reference
      - id: objectives/evasion/masquerade/binary::apple-cache-write

  - id: multi-desktop-wallet-targets
    desc: Targets several desktop wallet families
    crit: hostile
    conf: 0.96
    all:
      - id: objectives/credential-access/wallet/desktop::monero
      - id: objectives/credential-access/wallet/desktop::electrum
      - id: objectives/credential-access/wallet/desktop::wasabi

  - id: concealed-browser-store-harvest
    desc: Concealed binary reads browser stores
    crit: hostile
    conf: 0.96
    all:
      - id: objectives/credential-access/browser/safari::localstorage
      - id: objectives/anti-static/obfuscation/payload/import::macho-concealed-capability
      - id: micro-behaviors/fs/path/password-store::login-data
