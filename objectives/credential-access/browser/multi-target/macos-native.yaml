defaults:
  platforms: [macos]
  for: [macho]
  attack: T1555.003
traits:
  - id: parse-profile-symbol
    desc: Browser profile parser symbol
    crit: suspicious
    conf: 0.95
    if:
      type: symbol
      regex: ^main\.\(\*[A-Za-z0-9_]{4,}\)\.ParseProfile$
  - id: parse-extension-symbol
    desc: Browser extension parser symbol
    crit: suspicious
    conf: 0.95
    if:
      type: symbol
      regex: ^main\.\(\*[A-Za-z0-9_]{4,}\)\.ParseExt$
  - id: profiles-symbol
    desc: Browser profiles enumeration symbol
    crit: suspicious
    conf: 0.9
    if:
      type: symbol
      regex: ^main\.\(\*[A-Za-z0-9_]{4,}\)\.Profiles$
  - id: vivaldi-target
    desc: Vivaldi browser target reference
    crit: suspicious
    conf: 0.85
    if:
      type: text
      regex: Vivaldi.{0,20}(Cookies|key4\.db)
composite_rules:
  - id: browser-profile-collection
    desc: Native browser profile collection
    crit: suspicious
    conf: 0.95
    all:
      - id: parse-profile-symbol
    any:
      - id: profiles-symbol
      - id: vivaldi-target
      - id: micro-behaviors/fs/path/password-store::key4-db-basename
  - id: browser-extension-collection
    desc: Native browser extension collection
    crit: suspicious
    conf: 0.95
    all:
      - id: parse-extension-symbol
    any:
      - id: micro-behaviors/crypto/certificate/extensions::go-extra-extensions-field-reference
      - id: vivaldi-target
  - id: browser-cookie-collection
    desc: Native browser cookie collection
    crit: suspicious
    conf: 0.95
    all:
      - id: browser-profile-collection
    any:
      - id: micro-behaviors/communications/http/cookies::cookiesnamed-symbol
      - id: micro-behaviors/communications/http/cookies::setcookies-symbol
  - id: native-browser-data-stealer
    desc: Native multi-browser data stealer
    crit: hostile
    conf: 0.98
    all:
      - id: browser-profile-collection
      - id: browser-extension-collection
      - id: browser-cookie-collection
    any:
      - id: micro-behaviors/fs/path/password-store::key4-db-basename
      - id: vivaldi-target

  - id: fake-app-wallet-file-read
    desc: Generic bundle with wallet paths and read entitlement
    crit: suspicious
    conf: 0.96
    for: [dmg, macho, plist]
    scope: archive
    all:
      - id: micro-behaviors/fs/path/app-data/browser::browser-wallet-storage-references
      - id: objectives/evasion/masquerade/identity/bundle::fake-app-identity
      - id: micro-behaviors/process/create/subprocess/reference::file-read-entitlement-shell-apis
  - id: browser-cookie-login-harvest
    desc: Browser cookie and login store path references
    crit: suspicious
    conf: 0.96
    all:
      - id: micro-behaviors/fs/path/cookie::cookies-binarycookies
      - id: micro-behaviors/fs/path/password-store::chromium-login-store-paths
      - id: micro-behaviors/fs/path/application/browser/profile::opera-macos-path
  - id: hidden-dock-login-persist
    desc: Dock hiding, login-item, and cache references
    crit: suspicious
    conf: 0.95
    all:
      - id: objectives/evasion/process/hidden/window::hide-dock-icon-action
      - id: micro-behaviors/os/autorun/login-items::session-loginitems-key-reference
      - id: objectives/evasion/masquerade/binary/cache::apple-cache-write
  - id: browser-store-paths-dlsym-system
    desc: Browser store paths with dynamic symbol lookup and shell execution
    crit: suspicious
    conf: 0.96
    all:
      - id: micro-behaviors/fs/path/application/browser/storage::localstorage
      - id: micro-behaviors/dylib/lookup::macho-dlsym-and-system
      - id: micro-behaviors/fs/path/password-store::login-data
