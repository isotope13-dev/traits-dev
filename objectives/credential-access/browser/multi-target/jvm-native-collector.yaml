defaults:
  platforms: [windows]
  for: [jar, zip, class]
composite_rules:
  - id: jvm-native-injection-browser-secret-collector
    desc: Copied browser logins, NSS and DPAPI accompany native injection
    crit: hostile
    conf: 0.98
    scope: archive
    attack: T1555.003,T1055
    # Source and injection recipes must each be established in a leaf class.
    # The archive join records co-occurrence, not proven cross-class data flow.
    all:
      - id: objectives/credential-access/browser/chromium::jvm-chromium-copied-login-reader
      - id: objectives/credential-access/keychain/extract::jvm-nss-json-secret-reader
      - id: micro-behaviors/crypto/cipher::jvm-dpapi-base64-gcm-profile
      - id: micro-behaviors/process/inject/remote-thread::jvm-remote-allocation-write-thread
