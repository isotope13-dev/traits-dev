defaults:
  platforms: [windows]
  for: [jar, zip, class]
composite_rules:
  - id: jvm-chromium-recovery-with-remote-injection
    desc: Chromium credential recovery bundled with JVM remote-process injection
    crit: hostile
    conf: 0.98
    for: [jar, zip, pe, dll, java_class]
    scope: outer
    attack: T1555.003,T1055
    # Both behaviors must be implemented in the same JAR/ZIP. The native
    # helper performs Chromium decryption, while the JVM class implements the
    # remote allocation, memory write and thread-start sequence.
    all:
      - id: micro-behaviors/os/application/target/browser::chromium-brand-target-table
      - id: micro-behaviors/fs/path/app-data/browser::chromium-user-data-directory-text
      - id: metadata/binary/symbols/name/token/security::decryptdata-name-reference
      - id: micro-behaviors/os/com/instantiation::co-create-instance
      - id: micro-behaviors/os/com/invoke::co-set-proxy-blanket
      - id: micro-behaviors/communications/ipc/named-pipe::wait-named-pipe
      - id: micro-behaviors/communications/ipc/pipe::peek-named-pipe
      - id: micro-behaviors/process/inject/remote-thread::jvm-remote-allocation-write-thread

  - id: jvm-native-injection-browser-secret-collector
    desc: Copied browser logins, NSS and DPAPI accompany native injection
    crit: hostile
    conf: 0.98
    scope: archive
    attack: T1555.003,T1055
    # Source and injection recipes must each be established in a leaf class.
    # The archive join records co-occurrence, not proven cross-class data flow.
    all:
      - id: objectives/credential-access/browser/chromium::jvm-chromium-copied-login-reader
      - id: objectives/credential-access/keychain/extract::jvm-nss-json-secret-reader
      - id: micro-behaviors/crypto/cipher/unspecified::jvm-dpapi-base64-gcm-profile
      - id: micro-behaviors/process/inject/remote-thread::jvm-remote-allocation-write-thread

  - id: obfuscated-jvm-sqlite-gcm-browser-stealer
    desc: Obfuscated JAR with SQLite and GCM cipher
    crit: hostile
    conf: 0.98
    scope: archive
    attack: T1555.003
    all:
      - id: objectives/anti-static/obfuscation/name-mangling/class-folder::java-archive-lookalike-class-tree
      - id: metadata/package/dependencies/archive::bundled-xerial-sqlite-jdbc
      - id: micro-behaviors/crypto/cipher/mode::jvm-gcm-parameter-spec
      - id: micro-behaviors/crypto/key/representation/material::secretkeyspec
