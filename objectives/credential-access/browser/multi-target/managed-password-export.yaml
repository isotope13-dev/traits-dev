# Managed browser password collectors combine profile enumeration and parsing
# with local file access, cryptographic decoding, and network code.
defaults:
  platforms: [windows]
  for: [pe, dll]
  attack: T1555.003

traits:
  - id: managed-browser-password-parser
    desc: Managed method named for parsing saved passwords
    crit: suspicious
    conf: 0.9
    if:
      type: text
      regex: '(?i)\bParsePasswords\b'

composite_rules:
  - id: managed-browser-password-export
    desc: Managed browser password parsing with file, crypto, and network APIs
    crit: hostile
    conf: 0.96
    all:
      - id: metadata/binary/framework::dotnet-assembly
      - id: managed-browser-password-parser
      - id: micro-behaviors/fs/read/file/full::dotnet-read-all-text
      - id: micro-behaviors/crypto/decrypt::dotnet-rijndael-decryptor
      - id: metadata/lang/source/naming/resource::dotnet-frombase64string-text
      - id: micro-behaviors/communications/http/client/managed::httpwebrequest
      - id: micro-behaviors/communications/http/client/managed::webclient
