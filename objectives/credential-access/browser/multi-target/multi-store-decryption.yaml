defaults:
  platforms: [windows]
  for: [scripts, source, binaries]
composite_rules:
  # Require SQLite plus a decryption API beside both credential stores.
  # These references do not establish a managed runtime or bound data flow.
  - id: multi-browser-store-decryption
    desc: Multi-browser stores with decryption APIs
    crit: hostile
    conf: 0.95
    attack: T1555.003
    all:
      - id: micro-behaviors/fs/path/password-store::chromium-login-store-paths
      - id: micro-behaviors/fs/path/application/browser::firefox-profile-directory
      - id: metadata/binary/layout/embedded::sqlite-format-header-reference
    any:
      - id: micro-behaviors/crypto/decrypt::nss-secret-decrypt-reference
      - id: micro-behaviors/crypto/library/cryptoapi::bcrypt-decrypt-api
    needs: 1
    unless:
      - id: metadata/signed/platform/
      - id: well-known/tool/browser
      - id: metadata/binary/installer/family/
      - id: well-known/tool/offensive/peas/
