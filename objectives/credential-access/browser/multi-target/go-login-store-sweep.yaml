defaults:
  platforms: [windows]
  for: [go]
traits:
  - id: go-login-store-sweep
    desc: Go loop collects multiple browser login stores
    crit: suspicious
    conf: 0.98
    attack: T1555.003
    if:
      type: tree-sitter
      query: |
        ((function_declaration
          body: (block (statement_list
            (short_var_declaration
              left: (expression_list (identifier) @paths)
              right: (expression_list (composite_literal
                type: (slice_type element: (type_identifier) @element_type)
                body: (literal_value
                  (literal_element (call_expression
                    function: (selector_expression operand: (identifier) @fp1 field: (field_identifier) @join1)
                    arguments: (argument_list (_) [(raw_string_literal) (interpreted_string_literal)] @path1)))
                  (literal_element (call_expression
                    function: (selector_expression operand: (identifier) @fp2 field: (field_identifier) @join2)
                    arguments: (argument_list (_) [(raw_string_literal) (interpreted_string_literal)] @path2)))))))
            (for_statement
              (range_clause left: (expression_list (identifier) (identifier) @entry) right: (identifier) @paths_used)
              body: (block (statement_list
                (if_statement
                  initializer: (short_var_declaration
                    left: (expression_list (identifier) @bytes (identifier))
                    right: (expression_list (call_expression
                      function: (selector_expression operand: (identifier) @os field: (field_identifier) @read)
                      arguments: (argument_list (identifier) @entry_used))))
                  consequence: (block (statement_list
                    (assignment_statement
                      left: (expression_list (identifier) @output)
                      right: (expression_list (call_expression
                        function: (identifier) @append
                        arguments: (argument_list (identifier) @output_used (identifier) @bytes_used))))))))))))) @collector
          (#eq? @element_type "string")
          (#eq? @fp1 "filepath") (#eq? @fp2 "filepath")
          (#eq? @join1 "Join") (#eq? @join2 "Join")
          (#match? @path1 "(Chrome|Edge).{0,70}Login Data")
          (#match? @path2 "(Chrome|Edge).{0,70}Login Data")
          (#not-eq? @path1 @path2)
          (#eq? @paths @paths_used) (#eq? @entry @entry_used)
          (#eq? @os "os") (#eq? @read "ReadFile") (#eq? @append "append")
          (#eq? @output @output_used) (#eq? @bytes @bytes_used))
