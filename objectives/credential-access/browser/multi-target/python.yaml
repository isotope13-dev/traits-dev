defaults:
  platforms: [windows, unix]
  for: [python]
  attack: T1555.003
composite_rules:
  - id: browser-freedesktop-secrets
    desc: Browser-specific freedesktop secret schema access
    crit: suspicious
    conf: 0.92
    all:
      - id: micro-behaviors/communications/ipc/dbus::freedesktop-secret-service-reference
      - id: micro-behaviors/os/security/keyring::browser-libsecret-schema
    unless:
      - id: well-known/lib/development/browser-cookie3/

  - id: python-browser-keyring-targeting
    desc: Python browser keyring targeting
    crit: suspicious
    conf: 0.95
    all:
      - id: browser-freedesktop-secrets
    any:
      - id: micro-behaviors/os/security/keyring::browser-kwallet-service
      - id: micro-behaviors/os/security/keyring::browser-keys-wallet
      - id: micro-behaviors/fs/path/password-store::browser-safe-storage-label
    unless:
      - id: well-known/app/ai/tool-server/linkedin-mcp-server::browser-import-source-context
      - id: well-known/app/ai/tool-server/linkedin-mcp-server::browser-import-archive-context
      - id: well-known/lib/development/browser-cookie3/

  - id: python-macos-multi-browser-store-harvest
    desc: Python targets Chrome and Safari credentials
    crit: hostile
    conf: 0.98
    platforms: [macos, unix]
    all:
      - id: micro-behaviors/fs/path/password-store::login-data
      - id: micro-behaviors/fs/path/cookie::safari-binary-cookies
    any:
      - id: micro-behaviors/fs/path/application/browser::chrome-macos-support-path
      - id: micro-behaviors/fs/path/cookie::browser-cookies-file-path
    unless:
      - id: well-known/tool/detection/
      - id: metadata/package/testing/
      - id: well-known/lib/development/browser-cookie3/
