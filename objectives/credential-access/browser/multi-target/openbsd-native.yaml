defaults:
  platforms: [openbsd, bsd, unix]
  for: [cpp, elf]
  attack: T1555.003

traits:
  - id: native-browser-creds-endpoint
    desc: Native browser creds endpoint
    crit: suspicious
    conf: 0.9
    if:
      type: text
      substr: /api/v1/credentials
    unless:
      - id: metadata/package/testing/presence/harness::test-directory-path
      - id: metadata/package/testing/presence/harness::c-source-test-file

composite_rules:
  - id: openbsd-native-browser-credential-theft
    desc: OpenBSD native browser credential theft
    crit: hostile
    conf: 0.98
    all:
      - id: native-browser-creds-endpoint
    needs: 2
    any:
      - id: micro-behaviors/fs/path/password-store::native-firefox-logins-path
      - id: micro-behaviors/fs/path/password-store::native-firefox-key4-path
      - id: micro-behaviors/fs/path/password-store::native-chromium-login-data
