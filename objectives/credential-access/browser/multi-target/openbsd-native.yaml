defaults:
  platforms: [openbsd, bsd, unix]
  for: [cpp, elf]
  attack: T1555.003

traits:
  - id: native-firefox-logins-path
    desc: Native Firefox logins path
    crit: suspicious
    conf: 0.92
    if:
      type: text
      substr: /logins.json

    unless:
      - id: well-known/tool/detection/malcontent::malcontent-defensive-scanner-context
      - id: metadata/package/testing/presence/harness::test-directory-path
      - id: metadata/package/testing/presence/harness::c-source-test-file
  - id: native-firefox-key4-path
    desc: Native Firefox key4 path
    crit: suspicious
    conf: 0.92
    if:
      type: text
      substr: /key4.db
    unless:
      - id: metadata/package/testing/presence/harness::test-directory-path
      # A harness that *writes* an NSS profile rather than reading the user's:
      # LibreOffice's unotest/source/cpp/macros_test.cxx copies its own
      # cert9.db/key4.db into a target dir and points
      # MOZILLA_CERTIFICATE_FOLDER at it, so the signing tests have a profile.
      - id: metadata/package/testing/presence/harness::c-source-test-file
      - id: well-known/lib/crypto/nss::nss-source-tree

  - id: native-chromium-login-data
    platforms: [openbsd, bsd, unix, windows]
    desc: Native Chromium Login Data path
    crit: suspicious
    conf: 0.93
    for: [cpp, elf, csharp, pe]
    if:
      type: text
      substr: /Default/Login Data
    unless:
      - id: metadata/package/testing/presence/harness::test-directory-path
      - id: metadata/package/testing/presence/harness::c-source-test-file

  - id: native-browser-creds-endpoint
    desc: Native browser creds endpoint
    crit: suspicious
    conf: 0.9
    if:
      type: text
      substr: /api/v1/credentials
    unless:
      - id: metadata/package/testing/presence/harness::test-directory-path
      - id: metadata/package/testing/presence/harness::c-source-test-file

composite_rules:
  - id: openbsd-native-browser-credential-theft
    desc: OpenBSD native browser credential theft
    crit: hostile
    conf: 0.98
    all:
      - id: native-browser-creds-endpoint
    needs: 2
    any:
      - id: native-firefox-logins-path
      - id: native-firefox-key4-path
      - id: native-chromium-login-data
