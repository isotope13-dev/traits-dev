defaults:
  platforms: [windows]
  for: [pe, dll]
  arch: [x86-64]
composite_rules:
  # The clear profile table is actually consumed by native code, alongside
  # hundreds of separately concealed literals. This is deliberately narrower
  # than browser path strings plus generic crypto imports.
  - id: encrypted-native-multi-browser-collector
    desc: Concealed native multi-browser collection routine
    crit: hostile
    conf: 0.95
    attack: T1555.003,T1027
    all:
      - id: micro-behaviors/data/collection/create::native-multi-browser-profile-pointer-array
      - id: objectives/anti-static/obfuscation/string/runtime-decrypt::dense-xor-keyed-stack-literal-builders
