defaults:
  platforms: [netbsd, unix]
  for: [c, cpp, objc, elf]
  attack: T1552.001

traits:
  - id: native-browser-credential-paths
    desc: Native browser credential paths
    crit: suspicious
    conf: 0.94
    if:
      type: text
      regex: 'Login Data[\s\S]{0,420}logins\.json'

    unless:
      - id: well-known/tool/detection/malcontent::malcontent-defensive-scanner-context
