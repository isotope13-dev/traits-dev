# Live enrichment with stolen sessions: after taking browser credentials,
# the implant replays the victim's own tokens against account APIs --
# the messaging account profile and a mailbox search for merchant
# receipts -- to corroborate identity and address for the stolen bundle.
# Each API is benign alone; the hostile claim is the conjunction with
# Chromium credential-table theft in the same file.
defaults:
  platforms: [windows, unix]
  for: [scripts, source, pe, elf, macho]
  attack: T1555.003,T1539,T1078

composite_rules:
  - id: stolen-session-live-account-enrichment
    desc: Stolen sessions enrich accounts and mail
    crit: hostile
    conf: 0.97
    all:
      - id: micro-behaviors/data/db/read/column::chromium-login-sql
      - id: micro-behaviors/communications/http/services/discord::discord-api-users-me-url
    any:
      - id: micro-behaviors/communications/http/services/gmail::google-gmail-messages-rest-collection
      - id: micro-behaviors/communications/http/services/gmail::gmail-merchant-receipt-search-query
