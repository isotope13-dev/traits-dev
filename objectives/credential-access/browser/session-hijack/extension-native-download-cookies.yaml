defaults:
  for: [javascript]
  platforms: [unix, windows]
traits:
  - id: browser-cookie-native-download-handoff
    desc: Reads site cookies for native download client
    crit: suspicious
    conf: 0.98
    if:
      type: yara
      source: |
        rule browser_cookie_native_download_handoff {
          strings:
            $cookies = "browser.cookies.getAll(a).catch(()=>null)"
            $serialize = "b.push(c.name,\"=\",c.value)"
            $native = "browser.runtime.connectNative(\"com.tonec.idm\")"
            $permissions = "browser.extension.isAllowedIncognitoAccess()"
          condition:
            all of them
        }
