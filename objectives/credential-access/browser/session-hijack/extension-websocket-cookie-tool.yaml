defaults:
  for: [javascript]
  platforms: [unix, windows]
traits:
  - id: extension-remote-tool-cookie-prefixes
    desc: Remote tool can return browser cookie prefixes
    crit: notable
    conf: 0.98
    if:
      type: yara
      source: |
        rule extension_remote_tool_cookie_prefixes {
          strings:
            $ws = "ws.onmessage = async (event)"
            $tool = "await executeTool(msg.tool, msg.input)"
            $send = "ws.send(JSON.stringify({ type: \"tool_result\""
            $case = "case \"get_cookies\""
            $read = "chrome.cookies.getAll({ url: input.url })"
            $prefix = "c.value.slice(0, 30)"
          condition:
            all of them
        }
