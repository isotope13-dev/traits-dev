defaults:
  platforms: [windows, unix]
  for: [python]
  attack: T1539
  crit: suspicious

traits:
- id: jwt-file-or-browser-read--rx-3
  desc: Python accesses sessionStorage identifier
  crit: notable
  conf: 0.92
  if:
    type: tree-sitter
    kind: identifier
    exact: sessionStorage
composite_rules:
- id: python-bearer-session-replay
  desc: Python bearer client with session references
  crit: notable
  conf: 0.97
  all:
  - id: micro-behaviors/communications/http/authorization-header::bearer-header-from-token
  - id: jwt-file-or-browser-read
  any:
  - id: micro-behaviors/communications/http/lib/requests::requests-session
  - id: micro-behaviors/communications/http/client/initialize::httpx-client
  - id: micro-behaviors/communications/http/client/initialize::httpx-async-client
  - id: micro-behaviors/communications/http/lib/aiohttp::aiohttp-session

- id: python-authenticated-file-replay
  desc: Authenticated client with response and file references
  crit: notable
  conf: 0.97
  all:
  - id: python-bearer-session-replay
  - id: micro-behaviors/communications/http/client/response-body::response-stream-python
  any:
  - id: micro-behaviors/fs/file/open/unspecified::binary-write-mode
  - id: micro-behaviors/communications/http/token-auth::refresh-token-field-source
  - id: micro-behaviors/communications/http/services/aws::generate-presigned-url

- id: python-async-session-replay
  desc: Async bearer client with session references
  crit: notable
  conf: 0.97
  all:
  - id: micro-behaviors/communications/http/authorization-header::bearer-header-from-token
  - id: jwt-file-or-browser-read
  - id: micro-behaviors/data/stream/read::async-read-or-byte-iterator-call
  any:
  - id: micro-behaviors/communications/http/client/initialize::httpx-async-client
  - id: micro-behaviors/communications/http/lib/aiohttp::aiohttp-session
  - id: micro-behaviors/communications/http/services/aws::generate-presigned-url

- id: python-token-and-key-harvest
  desc: Bearer client with private-key function reference
  crit: notable
  conf: 0.98
  all:
  - id: python-bearer-session-replay
  - id: metadata/lang/source/naming/function/cryptography::private-key-function-name-reference
  any:
  - id: micro-behaviors/communications/http/token-auth::refresh-token-field-source
  - id: micro-behaviors/communications/http/client/response-body::response-stream-python
- id: jwt-file-or-browser-read
  desc: Browser session storage reference
  crit: component
  conf: 0.92
  any:
  - id: micro-behaviors/fs/path/cookie::firefox-cookies-sqlite-filename
  - id: micro-behaviors/data/db/access::python-localstorage-identifier
  - id: jwt-file-or-browser-read--rx-3
