# A packaged Brightspace browser session exposes the account state needed by
# the scraper to access the user's college portal.
defaults:
  platforms: [unix, windows]
  for: [json]

traits:
  - id: brightspace-session-tenant-domain
    desc: Brightspace college portal session domain
    crit: notable
    conf: 0.98
    if:
      type: text
      substr: brightspace.algonquincollege.com

  - id: brightspace-session-cookie-key
    desc: Brightspace session cookie storage key
    crit: notable
    conf: 0.99
    if:
      type: text
      substr: d2lSessionVal

  - id: brightspace-local-fetch-token-key
    desc: Brightspace local fetch token key
    crit: notable
    conf: 0.98
    if:
      type: text
      substr: D2L.Fetch.Tokens

composite_rules:
  - id: agent-skill-embeds-brightspace-session-state
    for: [markdown, json, zip, tar, npm, whl]
    desc: Agent skill packages Brightspace login state
    crit: hostile
    conf: 0.99
    scope: archive
    all:
      - id: metadata/package/agent-skill::agent-skill-frontmatter
      - id: brightspace-session-tenant-domain
      - id: brightspace-session-cookie-key
      - id: brightspace-local-fetch-token-key
