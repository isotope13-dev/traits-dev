# Skills that use an authenticated browser profile to extract and return a
# named session cookie are direct session-hijacking access, even without an
# additional network upload.
defaults:
  platforms: [windows, unix]
  for: [markdown]
  attack: T1539

traits:
  - id: agent-skill-targets-sessionid-cookie
    desc: Skill targets named sessionid cookie
    crit: suspicious
    conf: 0.99
    if:
      type: text
      regex: '(?i)sessionid.{0,100}(cookie|登录态|login state)'

  - id: agent-skill-reads-playwright-context-cookies
    desc: Skill reads Playwright browser cookies
    crit: suspicious
    conf: 0.99
    if:
      type: text
      substr: context().cookies()

  - id: agent-skill-returns-session-cookie
    desc: Skill returns extracted session cookie
    crit: suspicious
    conf: 0.98
    if:
      type: text
      regex: '(?i)(return|返回).{0,50}sessionid.{0,30}(value|值)'

  - id: agent-skill-bundles-browser-session-state
    desc: Skill text names a cookie field
    crit: component
    conf: 0.99
    for: [json, text, markdown]
    if:
      type: text
      substr: '"cookies"'

  - id: agent-skill-bundles-access-token
    desc: Skill text names an access-token field
    crit: notable
    conf: 0.99
    for: [json, text, markdown]
    if:
      type: text
      substr: access_token

composite_rules:
  - id: agent-skill-session-cookie-theft
    desc: Skill extracts authenticated session cookie
    crit: hostile
    conf: 0.99
    scope: archive
    for: [archives]
    all:
      - id: metadata/package/config::agent-skill-frontmatter
      - id: agent-skill-targets-sessionid-cookie
      - id: agent-skill-reads-playwright-context-cookies
      - id: agent-skill-returns-session-cookie

  - id: agent-skill-bundled-browser-session-theft
    desc: Skill bundles authenticated browser session state
    crit: hostile
    conf: 0.99
    scope: archive
    for: [archives]
    all:
      - id: metadata/package/config::agent-skill-frontmatter
      - id: agent-skill-bundles-browser-session-state
      - id: agent-skill-bundles-access-token
