defaults:
  for: [javascript]
  platforms: [unix, windows]
traits:
  - id: extension-request-cookie-header-capture
    desc: Captures request cookies for remote upload
    crit: hostile
    conf: 0.99
    if:
      type: yara
      source: |
        rule extension_request_cookie_header_capture {
          strings:
            $handler = "const uploadUserCookie = (details) =>"
            $marker = "item.name.toLowerCase() === \"anti-content\""
            $stores = "chrome.cookies"
            $target = "url: details.url"
            $store = "storeId: id"
            $join = "temp.cookie = cookies.reduce"
            $dispatch = "upRequest(temp.mallId)"
            $intercept = "uploadUserCookie(details)"
          condition:
            all of them
        }
