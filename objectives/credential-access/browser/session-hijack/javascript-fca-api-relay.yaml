# Unofficial Facebook/Messenger (FCA-style) npm clients that POST account
# secrets to a third-party login API instead of authenticating locally.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, npm, tar, zip]
  attack: T1056,T1552

composite_rules:
  - id: facebook-login-third-party-api-relay
    desc: Posts Facebook credentials to third-party API
    crit: hostile
    conf: 0.99
    scope: archive
    all:
      - id: micro-behaviors/communications/http/request/body::social-network-login-api-path
      - id: micro-behaviors/communications/http/request/body::js-email-password-request-object
      - id: micro-behaviors/communications/http/request/body::facebook-login-via-api-helper
    any:
      - id: micro-behaviors/communications/http/request/body::facebook-login-default-external-api-server
      - id: micro-behaviors/communications/http/post::axios-post-call
  # The same relay also carries the caller's long-lived TOTP shared secret
  # (`body.twoFactor`), not a one-time code. A stolen password grants access
  # until rotation; a stolen TOTP seed permanently defeats MFA for the
  # account, so the seed relay is a distinct theft even though it rides the
  # same POST. Required evidence differs from the password relay above by
  # the seed-on-body leg.
  - id: facebook-totp-seed-third-party-api-relay
    desc: Relays Facebook TOTP seed to third-party API
    crit: hostile
    conf: 0.99
    attack: T1552
    scope: archive
    all:
      - id: micro-behaviors/communications/http/request/body::social-network-login-api-path
      - id: micro-behaviors/communications/http/request/body::js-login-body-totp-secret
      - id: micro-behaviors/communications/http/request/body::facebook-login-via-api-helper
    any:
      - id: micro-behaviors/communications/http/request/body::facebook-login-default-external-api-server
      - id: micro-behaviors/communications/http/post::axios-post-call
