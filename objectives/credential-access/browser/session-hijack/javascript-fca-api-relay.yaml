defaults:
  platforms:
  - unix
  - windows
  for:
  - javascript
  - typescript
  - npm
  - tar
  - zip
  attack: T1056,T1552
  crit: hostile
  conf: 0.99
composite_rules:
- id: facebook-login-third-party-api-relay
  desc: Posts Facebook credentials to third-party API
  scope: archive
  all:
  - id: micro-behaviors/communications/http/url/api-path::social-network-login-api-path
  - id: micro-behaviors/data/serialize/schema-credential::js-identity-password-object-fields
  - id: metadata/lang/source/naming/function::facebook-login-via-api-helper
  any:
  - id: micro-behaviors/communications/url/construction/http::facebook-login-default-external-api-server
  - id: micro-behaviors/communications/http/post::axios-post-call
- id: facebook-totp-seed-third-party-api-relay
  desc: Relays Facebook TOTP seed to third-party API
  attack: T1552
  scope: archive
  all:
  - id: micro-behaviors/communications/http/url/api-path::social-network-login-api-path
  - id: micro-behaviors/communications/http/request/body/credential::js-login-body-totp-secret
  - id: metadata/lang/source/naming/function::facebook-login-via-api-helper
  any:
  - id: micro-behaviors/communications/url/construction/http::facebook-login-default-external-api-server
  - id: micro-behaviors/communications/http/post::axios-post-call
