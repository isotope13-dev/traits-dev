defaults:
  platforms: [windows, unix]
  for: [javascript, typescript, html]
  attack: "T1539"

traits:
- id: dom-cookie-value-assign
  desc: Assigns document.cookie to field
  crit: suspicious
  conf: 0.92
  if:
    type: text
    regex: \.value\s*=\s*document\.cookie

# The document-head append atom moved to
# micro-behaviors/ui/window/dom/create::document-head-append — a neutral DOM
# capability, referenced directly by the skimmer composite below instead of
# carrying a duplicate matcher under an intent directory.

composite_rules:
- id: js-cookie-form-field
  desc: Browser cookie copied to form field
  crit: suspicious
  conf: 0.94
  all:
  - id: micro-behaviors/communications/http/cookie-store::document-cookie-read
  - id: dom-cookie-value-assign
  downgrade:
    any:
    - id: metadata/package/testing/
    - id: metadata/signed/platform/
