defaults:
  platforms:
  - windows
  - unix
  for:
  - javascript
  - typescript
  - html
  attack: T1539
  crit: suspicious
traits:
- id: dom-cookie-value-assign
  desc: Assigns document.cookie to field
  conf: 0.92
  if:
    type: text
    regex: \.value\s*=\s*document\.cookie
composite_rules:
- id: js-cookie-form-field
  desc: Browser cookie copied to form field
  conf: 0.94
  all:
  - id: micro-behaviors/communications/http/cookie-store::document-cookie-reference
  - id: dom-cookie-value-assign
  downgrade:
    any:
    - id: metadata/package/testing/
    - id: metadata/signed/platform/
    - id: metadata/path::test-directory-component
