defaults:
  for: [javascript]
  platforms: [unix, windows]
traits:
  - id: extension-arbitrary-url-session-cookie-route
    desc: Returns browser cookies for a supplied URL
    crit: suspicious
    conf: 0.98
    if:
      type: yara
      source: |
        rule extension_arbitrary_url_session_cookie_route {
          strings:
            $route = "listCookies:h(function(e)"
            $get = "chrome.cookies.getAll({url:e.url})"
            $return = "Response.json({cookies:t})"
            $claude = "sessionKey"
            $chat = "__Secure-next-auth.session-token"
            $external = "chrome.runtime.onMessageExternal.addListener"
          condition:
            all of them
        }
