defaults:
  for: [javascript]
  platforms: [unix, windows]
traits:
  - id: extension-stores-entered-login-password
    desc: Stores entered login password without encryption
    crit: suspicious
    conf: 0.98
    if:
      type: yara
      source: |
        rule extension_stores_entered_login_password {
          strings:
            $input = "const emailPassWord = document.getElementById('emailPassWordInput').value"
            $store = "chrome.storage.local.set({ emailPassWord: emailPassWord })"
            $load = "chrome.storage.local.get('emailPassWord'"
            $restore = "document.getElementById('emailPassWordInput').value = items.emailPassWord"
          condition:
            all of them
        }
