# Local cookie recovery plus panel replay; not proof recovery succeeded.
# https://blackpointcyber.com/blog/screenconnect-attack-sckit/
defaults:
  for: [powershell]
  platforms: [windows]
  attack: T1539,T1550.004
composite_rules:
  - id: aspnet-browser-cookie-panel-replay
    desc: Browser cookie decryption with management panel session replay
    crit: suspicious
    conf: 0.97
    near_lines: 60
    all:
      - id: micro-behaviors/data/db/read/records::aspnet-auth-cookie-query
      - id: micro-behaviors/fs/path/application/browser/storage::chrome-path
      - id: micro-behaviors/os/security/dpapi::dotnet-protected-data-unprotect
      - id: micro-behaviors/communications/http/cookies::aspnet-cookie-header-assignment
      - id: micro-behaviors/communications/http/services/screenconnect::panel-live-data-uri
      - id: micro-behaviors/communications/http/client/library::powershell-rest-request
