# Session replay against the identity provider's own API.
#
# The stealer-to-identity bridge: a script reads the browser cookie store,
# picks out the IdP session cookies, and attaches the harvested session to an
# authenticated HTTP request against the provider's API. A replayed session
# cookie skips authentication entirely -- no password is checked, no MFA
# prompt appears, and conditional-access policy only re-evaluates when a
# refresh token is redeemed. This is why a stolen session succeeds where a
# stolen password is blocked, and why the technique survives password resets
# (the observed chain -- decrypt cookie store, extract Microsoft
# authentication cookies, make authenticated API requests -- was reported
# across infostealer incidents by Prophet Security, May-July 2026).
defaults:
  platforms: [windows, unix]
  for: [scripts, source]
  attack: T1539,T1550.004

composite_rules:
  - id: browser-cookie-store-query
    desc: Queries a browser cookie store
    crit: suspicious
    conf: 0.95
    attack: T1555.003
    any:
      - id: objectives/credential-access/browser/chromium::chromium-cookie-sql
      - id: objectives/credential-access/browser/chromium::powershell-cookie-sql
      - id: objectives/credential-access/browser/chromium::cookie-theft

  - id: http-request-cookie-header
    desc: Attaches a Cookie header to an HTTP request
    crit: notable
    conf: 0.92
    attack: T1071.001
    any:
      - id: micro-behaviors/communications/http/cookies::cookie-header
      - id: micro-behaviors/communications/http/client/webclient::add-cookie-header

  - id: idp-session-cookie-api-replay
    desc: Replays an IdP session cookie in an authenticated HTTP request
    crit: hostile
    conf: 0.98
    all:
      - id: browser-cookie-store-query
      - id: objectives/credential-access/browser/session-hijack::idp-session-cookie-named
      - id: http-request-cookie-header
    near_lines: 60
