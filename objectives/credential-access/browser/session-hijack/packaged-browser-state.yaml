# A distributable package that embeds authenticated browser cookies and has
# code wired to load Playwright storage state exposes a reusable user session.
defaults:
  platforms: [windows, unix]
  attack: T1539

traits:
  - id: playwright-storage-state-file-reference
    desc: References Playwright storage-state file
    crit: notable
    conf: 0.95
    for: [python]
    if:
      type: text
      regex: 'storage_state.{0,120}(SESSION_FILE|\.json)'

  - id: packaged-authenticated-browser-cookie
    desc: Browser state contains session cookies
    crit: notable
    conf: 0.95
    for: [json]
    if:
      type: value
      path: cookies[*].name
      regex: '(?i)(session|auth|token|sid)'

composite_rules:
  - id: packaged-playwright-session-state
    desc: Package embeds reusable browser session state
    crit: hostile
    conf: 0.96
    scope: archive
    all:
      - id: playwright-storage-state-file-reference
      - id: packaged-authenticated-browser-cookie
