# Unofficial Gemini Web clients that decrypt Chromium Google session cookies
# and replay them against the browser-only BardChatUi RPC surface.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, npm]
  attack: T1539,T1555.003

composite_rules:
  - id: node-chromium-cookie-gemini-web-abuse
    desc: Node harvests Chromium cookies for Gemini Web API calls
    crit: hostile
    conf: 0.97
    mbc: B0028
    scope: archive
    all:
      - id: micro-behaviors/data/db/sql::chromium-cookie-select-query
      - id: micro-behaviors/communications/http/services/gemini::gemini-web-bard-stream-api
    unless:
      - id: well-known/app/ai/browser-agent/pi-web-access::npm-package-name
      - id: well-known/app/ai/browser-agent/pi-web-access::browser-cookie-reader-context
      - id: well-known/app/ai/coding-agent/tau-pi-extension::npm-package-name
      - id: well-known/app/ai/coding-agent/tau-pi-extension::archive-context
      - id: well-known/app/ai/coding-agent/kendex-pi-extension::archive-context
