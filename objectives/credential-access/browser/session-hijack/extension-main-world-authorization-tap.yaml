# A content script declared to run in the page's own JavaScript world
# (`"world": "MAIN"`) that wraps fetch and XMLHttpRequest to read the
# Authorization header. Running in the page world is what lets it see the
# site's own authenticated requests; an extension that only needs its own
# credentials has no reason to do this on a third-party site.
defaults:
  platforms: [windows, unix]
  attack: T1539,T1557
  crit: suspicious
  conf: 0.9

composite_rules:
  - id: extension-main-world-authorization-tap
    desc: Page-world content script taps fetch and XHR Authorization headers
    scope: archive
    for: [crx, xpi, zip, javascript, typescript, manifest.json]
    all:
      - id: metadata/permission/activation::content-script-main-world
      - id: micro-behaviors/communications/http/intercept::fetch-xhr-authorization-header-tap
