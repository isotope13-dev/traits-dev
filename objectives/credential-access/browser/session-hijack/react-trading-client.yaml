# A site's own client normally comes from imports or application state. Looking
# for it by testing DOM-owned React internals crosses that interface boundary.
# No hostname, project ID, storage-key spelling or collector filename gates it.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]

composite_rules:
  - id: react-internal-trading-client-search
    desc: Searches React internals for a live trading client
    crit: suspicious
    conf: 0.97
    near_bytes: 8192
    all:
      - id: micro-behaviors/ui/window/dom/access::react-fiber-key-prefix-test
      - id: micro-behaviors/communications/blockchain/exchange::post-order-method-type-test
      - id: micro-behaviors/communications/blockchain/exchange::create-order-method-type-test
