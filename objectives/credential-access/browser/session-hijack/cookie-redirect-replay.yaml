# Harvested session cookies replayed across unchecked redirects.
#
# Replaying a cookie to the service that issued it is using that service, not
# stealing from it. This composite requires the additional trust-boundary
# crossing: the Cookie header built from the local store is re-attached while
# manually following redirect responses, so the session is disclosed to
# whatever origin a Location header names. A legitimate client following
# redirects with `redirect: "manual"` must re-validate each hop before
# re-attaching credentials; forwarding them blindly leaks the session to an
# attacker-influenced target. The pi-web-access gated-reader context clears
# this intent claim: an opt-in reader whose redirect loop starts at the
# advertised first-party Gemini Web endpoint replays the user's own session,
# a hardening defect at most, which the redirect composite reports while this
# hostile claim stays down.
#
# Benign controls: an opt-in first-party reader that queries the cookie store
# and calls its own API without the redirect-forwarding leg does not match.
# Test and documentation fixtures name cookie tables without decrypting the
# store or forwarding the header, so they fail the store-unlock leg.
# A documented Pi-extension gated reader replays the user's own session
# against the advertised first-party endpoint with the user's opt-in; that
# is first-party session use, not session hijacking, so the gated-reader
# context clears this hostile claim. The underlying cookie, redirect, and
# endpoint legs stay visible as notable capabilities for differential
# analysis.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, npm]
  attack: T1539

composite_rules:
  - id: harvested-session-cookie-unchecked-redirect-replay
    desc: Replays harvested browser session cookies across unchecked redirects
    crit: hostile
    conf: 0.97
    scope: archive
    all:
      - id: micro-behaviors/data/db/sql::chromium-cookie-select-query
      - id: micro-behaviors/communications/http/cookie-name::google-auth-cookie-name
      - id: micro-behaviors/communications/http/redirect::manual-redirect-cookie-forwarding
    any:
      - id: micro-behaviors/crypto/symmetric/decrypt::createDecipheriv
      - id: micro-behaviors/os/security/dpapi::powershell-unprotect-template-literal
      - id: micro-behaviors/os/security/keychain::macos-keychain-generic-password-command-reference
      - id: micro-behaviors/os/security/keyring::node-secret-tool-lookup-call
    unless:
      - id: well-known/app/ai/browser-agent/pi-web-access::pi-extension-gated-cookie-reader
