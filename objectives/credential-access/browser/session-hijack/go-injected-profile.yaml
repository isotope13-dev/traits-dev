defaults:
  for: [pe]
  platforms: [windows]
  attack: T1539,T1055
composite_rules:
  - id: go-backstage-browser-profile-injection
    desc: Backstage browser injector clones profiles
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/fs/directory/copy::go-browser-profile-clone-function
      - id: micro-behaviors/process/inject/runtime/call::go-backstage-browser-injection-function
      - id: micro-behaviors/process/inject/remote-thread::remote-alloc-write-thread-api-set
      - id: micro-behaviors/data/embedded/payload/rdi-env::rdi-env-var-cluster
