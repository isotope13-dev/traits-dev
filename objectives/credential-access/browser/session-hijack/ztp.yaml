# A compromised device-management page can inject an active HTML handler into
# an administrator's browser and forward the browser's session material.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, html]
  crit: notable
  conf: 0.92

composite_rules:
  - id: dom-script-injection-payload
    desc: Inserts HTML event-handler script payload
    crit: suspicious
    conf: 0.98
    all:
      - id: micro-behaviors/ui/window/manage/html::html-active-handler-marker
    any:
      - id: micro-behaviors/ui/window/manage/dom::browser-innerhtml-assignment
    near_bytes: 2048

  - id: ztp-browser-credential-forwarding
    desc: Posts browser session data to remote endpoint
    crit: hostile
    conf: 0.99
    all:
      - id: micro-behaviors/communications/http/cookies::cookie-field-in-request-object
      - id: micro-behaviors/data/db/web-storage::browser-storage-credential-key
      - id: micro-behaviors/communications/http/request/client::fetch-post-pattern
    near_bytes: 2048

  - id: ztp-browser-session-injection
    desc: Injects page script while harvesting session data
    crit: hostile
    conf: 0.99
    all:
      - id: dom-script-injection-payload
      - id: ztp-browser-credential-forwarding
    near_bytes: 4096
