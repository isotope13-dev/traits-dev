# A compromised device-management page can inject an active HTML handler into
# an administrator's browser and forward the browser's session material.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, html]
  crit: notable
  conf: 0.92

# The "inline handler written in with innerHTML" leg is the neutral DOM sink
# micro-behaviors/ui/window/manage/dom::innerhtml-inline-event-handler-write --
# ordinary UI code renders interactive controls that way, so it carries no
# session-hijack intent by itself and is referenced from there rather than
# restated here as a suspicious objective.
composite_rules:
  - id: ztp-browser-credential-forwarding
    desc: Posts browser session data to remote endpoint
    crit: hostile
    conf: 0.99
    all:
      - id: micro-behaviors/communications/http/cookies::cookie-field-in-request-object
      - id: micro-behaviors/data/db/web-storage::browser-storage-credential-key
      - id: micro-behaviors/communications/http/request/client::fetch-post-pattern
    near_bytes: 2048

  - id: ztp-browser-session-injection
    desc: Injects page script while harvesting session data
    crit: hostile
    conf: 0.99
    all:
      - id: micro-behaviors/ui/window/manage/dom::innerhtml-inline-event-handler-write
      - id: ztp-browser-credential-forwarding
    near_bytes: 4096
    unless:
      - id: metadata/library/runtime::acquire-vscode-api
