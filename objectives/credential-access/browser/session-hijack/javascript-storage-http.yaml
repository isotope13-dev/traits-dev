defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  attack: T1539
composite_rules:
  - id: js-storage-credential-sweep-near-http
    desc: Browser credential sweep near HTTP requests
    crit: suspicious
    conf: 0.98
    near_bytes: 4096
    all:
      - id: micro-behaviors/data/db/access::browser-storage-credential-key
      - id: micro-behaviors/data/db/enumerate::browser-storage-sweep-loop
      - id: micro-behaviors/communications/http/request/client::http-client-usage
    any:
      - id: micro-behaviors/communications/http/lib/axios::request-axios
      - id: micro-behaviors/communications/http/post
      - id: micro-behaviors/communications/http/upload
  - id: js-auth-state-near-http
    desc: Browser auth state near HTTP requests
    crit: suspicious
    conf: 0.98
    near_bytes: 4096
    all:
      - id: micro-behaviors/data/db/access::browser-storage-credential-key
      - id: micro-behaviors/communications/http/cookie-store::document-cookie-reference
      - id: micro-behaviors/communications/http/token-auth::access-token
      - id: micro-behaviors/communications/http/request/client::http-client-usage
    any:
      - id: micro-behaviors/communications/http/request/beacon::browser-send-beacon
      - id: micro-behaviors/communications/http/post
