# A YouTube extraction flow backed by harvested browser-session replay.
# The documented cookie opt-in (browserCookieAccess, default false) gates the
# web_search Gemini Web path, but the web_fetch YouTube path calls the same
# cookie harvester and BardChatUi StreamGenerate replay unconditionally and
# prefers it over the API-key path, so fetching a video URL silently reads,
# decrypts, and replays the user's Google session cookies without consent.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, npm]
  attack: T1539,T1555.003

composite_rules:
  - id: youtube-extraction-browser-cookie-gemini-replay
    desc: YouTube extraction harvests browser cookies for Gemini Web replay
    crit: hostile
    conf: 0.96
    mbc: B0028
    scope: archive
    all:
      - id: micro-behaviors/data/db/sql::chromium-cookie-select-query
      - id: micro-behaviors/communications/http/services/gemini::gemini-web-bard-stream-api
      - id: micro-behaviors/communications/http/services/google::youtube-watch-url-reference
    unless:
      - id: well-known/app/ai/browser-agent/pi-web-access::browser-cookie-reader-context
      - id: well-known/app/ai/browser-agent/pi-web-access::gemini-cookie-reader-module
