# Active pass-the-cookie workflows: data from a local browser credential store
# is inserted into an automated browser and then used to obtain authenticated
# state. The atoms remain useful across browser frameworks and source languages.
defaults:
  platforms: [windows, unix]
  for: [scripts, source]
  attack: T1539,T1550.004

composite_rules:
  - id: auth-token-cookie-collection-selection
    desc: Authentication token cookie selection
    crit: suspicious
    conf: 0.97
    all:
      - id: micro-behaviors/communications/http/browser-automation::named-cookie-collection-search
      - id: micro-behaviors/communications/http/browser-automation::authentication-token-name-literal

  - id: browser-cookie-store-session-replay
    desc: Inserts cookies read from a Chromium credential store into an automated browser
    crit: suspicious
    conf: 0.98
    all:
      - id: objectives/credential-access/browser/chromium::chromium-cookie-sql
      - id: micro-behaviors/communications/http/browser-automation::cookie-insertion-api-call
      - id: micro-behaviors/communications/http/browser-automation::browser-automation-cookie-read

  - id: browser-cookie-replay-auth-token-harvest
    desc: Replays stolen browser cookies and harvests the resulting authentication token
    crit: hostile
    conf: 0.99
    all:
      - id: objectives/credential-access/browser/chromium::chromium-cookie-sql
      - id: micro-behaviors/communications/http/browser-automation::cookie-insertion-api-call
      - id: micro-behaviors/communications/http/browser-automation::browser-automation-cookie-read
      - id: auth-token-cookie-collection-selection

  - id: browser-cookie-replay-password-bridge
    desc: Replays browser cookies with stolen profile passwords
    crit: hostile
    conf: 0.99
    all:
      - id: objectives/credential-access/browser/chromium::chromium-cookie-sql
      - id: objectives/credential-access/browser/chromium::password-sql
      - id: micro-behaviors/communications/http/browser-automation::cookie-insertion-api-call
      - id: micro-behaviors/communications/http/browser-automation::browser-automation-cookie-read
      - id: micro-behaviors/ui/window/form-input::browser-password-or-otp-entry
