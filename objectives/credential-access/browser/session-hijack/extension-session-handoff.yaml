defaults:
  for: [javascript, typescript]
  platforms: [unix, windows]

composite_rules:
  - id: extension-site-session-handoff
    desc: Extension collects site cookies and access token together
    crit: suspicious
    conf: 0.8
    near_lines: 16
    all:
      - id: micro-behaviors/browser-extension/management::cookies-getall-url-scoped
      - id: micro-behaviors/data/db/web-storage::web-storage-access-token-read
