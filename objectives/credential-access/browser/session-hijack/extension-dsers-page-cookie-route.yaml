defaults:
  for: [crx, xpi, zip, javascript]
  platforms: [unix, windows]
composite_rules:
  - id: dsers-page-bridge-cookie-function-access
    desc: Page bridge can reach cookie-reading function
    crit: suspicious
    conf: 0.98
    scope: archive
    all:
      - id: micro-behaviors/browser-extension/tabs::dsers-page-message-background-bridge
      - id: micro-behaviors/browser-extension/management::dsers-background-cookie-function-dispatch
