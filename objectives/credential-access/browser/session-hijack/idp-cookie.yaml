# Identity-provider session cookie names.
#
# These are the cookies an IdP sets once a sign-in — including every MFA step —
# has completed. Holding one is equivalent to holding the authenticated session:
# replaying it into a fresh browser lands inside the account without a password
# and without a second factor, which is why adversary-in-the-middle phishing
# targets them rather than the password. Entra ID issues `ESTSAUTH*` and
# `SignInStateCookie`; Google's account session rides on `SAPISID` and the
# `__Secure-*PSID` family.
#
# Naming one is explicable — an IdP SDK, a browser-automation login helper, or
# a security tool auditing session cookies all do. Naming several is useful
# review evidence, but session-health monitors, migration tools, and
# multi-provider browser clients also inventory the set. Actual cookie access
# or replay must provide suspicious intent.
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript, html, python, php]
  crit: notable
  conf: 0.9
  attack: T1539
  mbc: E1539

traits:
  - id: entra-session-cookie-name
    desc: Microsoft Entra ID session cookie name
    if:
      type: text
      regex: '\bESTSAUTH(PERSISTENT|LIGHT)?\b'
  - id: microsoft-signin-state-cookie-name
    desc: Microsoft sign-in state cookie name
    if:
      type: text
      word: SignInStateCookie
  - id: google-sapisid-cookie-name
    desc: Google account SAPISID session cookie
    if:
      type: text
      word: SAPISID
  - id: google-secure-psid-cookie-name
    desc: Google __Secure-PSID session cookie name
    if:
      type: text
      regex: '__Secure-[0-9]?PSID\b'

composite_rules:
  - id: idp-session-cookie-targeting
    desc: Names several IdP session cookies at once
    crit: notable
    conf: 0.94
    needs: 2
    any:
      - id: entra-session-cookie-name
      - id: microsoft-signin-state-cookie-name
      - id: google-sapisid-cookie-name
      - id: google-secure-psid-cookie-name
    unless:
      - id: metadata/library/microsoft-auth/
      - id: well-known/tool/detection/
      - id: metadata/package/testing/presence/fixture/
      - id: well-known/app/ai/pi-web-access::browser-cookie-reader-context
      - id: well-known/app/ai/pi-web-access::gemini-cookie-reader-module
