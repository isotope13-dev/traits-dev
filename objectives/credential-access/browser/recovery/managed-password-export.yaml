# Managed browser password collectors combine profile enumeration and parsing
# with local file access, cryptographic decoding, and network code.
defaults:
  platforms: [windows]
  for: [pe, dll]
  attack: T1555.003

composite_rules:
  - id: managed-browser-password-export
    desc: Managed browser password parsing with file, crypto, and network APIs
    crit: hostile
    conf: 0.96
    all:
      - id: metadata/lang/compiler/managed::dotnet-assembly
      - id: metadata/lang/source/naming/function/security::managed-browser-password-parser
      - id: micro-behaviors/fs/read/file/content/characters::dotnet-read-all-text
      - id: micro-behaviors/crypto/decrypt/initialize::dotnet-rijndael-decryptor
      - id: micro-behaviors/data/decode/base64/reference::dotnet-frombase64string-text
      - id: micro-behaviors/communications/http/client/managed::httpwebrequest
      - id: micro-behaviors/communications/http/client/managed::webclient
