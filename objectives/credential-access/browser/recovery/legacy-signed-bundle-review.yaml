defaults:
  platforms:
  - windows
  for:
  - pe
composite_rules:
- id: signed-adobe-java-browser-credential-profile
  desc: Signed Adobe or Java bundle with browser credential targets
  crit: hostile
  conf: 0.995
  all:
  - id: metadata/file/profile/embedded-binary::signed-adobe-java-bundle-references
  - id: objectives/credential-access/browser/multi-target::composite
  any:
  - id: metadata/binary/layout/ratio::largest-section-under-8pct
  - id: metadata/binary/installer/builder::wix-burn-bootstrapper
  - id: micro-behaviors/os/registry/keys/autostart::windows-run-key-path
  - id: micro-behaviors/os/registry/keys/autostart::currentversion-run
  needs: 2
