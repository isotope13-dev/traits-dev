defaults:
  platforms:
  - windows
  for:
  - pe
composite_rules:
- id: signed-adobe-java-browser-credential-profile
  desc: Signed Adobe or Java bundle with browser credential targets
  crit: hostile
  conf: 0.995
  all:
  - id: metadata/binary/layout/embedded::signed-adobe-java-bundle-references
  - id: objectives/credential-access/browser/multi-target::composite
  any:
  - id: metadata/binary/layout/ratio::largest-section-under-8pct
  - id: well-known/tool/packaging/wix::wix-burn-bootstrapper
  - id: micro-behaviors/os/registry/autostart/reference::windows-run-key-path
  - id: micro-behaviors/os/registry/autostart/reference::currentversion-run
  needs: 2
