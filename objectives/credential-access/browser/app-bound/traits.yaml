defaults:
  platforms:
  - linux
  - macos
  - windows
  for: [scripts, binaries, source]

traits:
- id: chromium-app-bound-key-name
  desc: Chromium app-bound key name
  crit: suspicious
  conf: 0.95
  platforms: [windows]
  attack: T1555.003
  if:
    type: text
    substr: Google Chromekey1
- id: chromium-app-bound-key-name-wide
  desc: Chromium app-bound key name in UTF-16
  crit: suspicious
  conf: 0.95
  for: [pe, dll]
  platforms: [windows]
  attack: T1555.003
  if:
    type: encoded
    encoding: wide
    exact: Google Chromekey1
- id: edge-ielevator-iid
  desc: Edge IElevator credential interface
  crit: suspicious
  conf: 0.94
  platforms: [windows]
  for: [binaries]
  attack: T1555.003
  if:
    type: text
    exact: '{c9c2b807-7731-4f34-81b7-44ff7779522b}'
- id: chromium-abe-config-v1-marker
  desc: Chromium ABE config block version tag
  crit: notable
  conf: 0.93
  platforms: [windows]
  for: [pe, dll]
  attack: T1555.003
  if:
    type: text
    exact: ABE_CFG_V1
composite_rules:
- id: chromium-app-bound-key-theft
  desc: Chromium app-bound key theft
  crit: hostile
  conf: 0.95
  attack: T1555.003
  for: [python]
  platforms: [windows]
  all:
  - id: micro-behaviors/communications/http/cookie-store::chromium-app-bound-encrypted-key-field
  - id: objectives/credential-access/browser/chromium::cng-ncrypt-decrypt
  any:
  - id: objectives/credential-access/browser/app-bound::chromium-app-bound-key-name
  - id: micro-behaviors/os/security/dpapi::python-dpapi-unprotect
  - id: micro-behaviors/fs/path/application/browser::local-state
- id: chromium-app-bound-key-theft-binary
  desc: Chromium app-bound key theft (compiled binary)
  crit: hostile
  conf: 0.96
  attack: T1555.003
  for: [pe, dll]
  platforms: [windows]
  all:
  - id: micro-behaviors/communications/http/cookie-store::chromium-app-bound-encrypted-key-field
  - id: objectives/credential-access/browser/app-bound::chromium-app-bound-key-name
  any:
  - id: micro-behaviors/crypto/library/cryptoapi::ncrypt-open-storage-provider
  - id: micro-behaviors/crypto/library/cryptoapi::ncrypt-open-key
- id: native-node-chromium-abe-credential-stealer
  desc: Native Node add-on steals Chromium App-Bound Encryption secrets
  crit: hostile
  conf: 0.97
  attack: T1555.003
  for: [pe, dll]
  platforms: [windows]
  all:
  - id: micro-behaviors/data/config/browser-preference::chromium-abe-result-code-marker
  any:
  - id: micro-behaviors/crypto/symmetric/aes/cng::bcrypt-aes-gcm-decrypt
  - id: micro-behaviors/crypto/library/cryptoapi::ncrypt-open-storage-provider
  - id: micro-behaviors/crypto/library/cryptoapi::ncrypt-open-key
  - id: objectives/supply-chain/hidden-payload/encoding::package-ships-bytenode-bytecode
  unless:
  - id: well-known/lib/ui/cef::cef-browser-engine

- id: browser-app-bound-key-injection
  desc: Browser app-bound key DLL injection
  crit: hostile
  conf: 0.96
  attack: T1055.001
  for: [python]
  platforms: [windows]
  all:
  - id: objectives/credential-access/browser/app-bound::chromium-app-bound-key-name
  - id: micro-behaviors/process/create/flags::create-suspended
  - id: micro-behaviors/process/inject/runtime/call::write-process-memory-dup
  - id: micro-behaviors/process/inject/dll::create-remote-thread
  any:
  - id: micro-behaviors/communications/ipc/named-pipe::named-pipe-server
  - id: micro-behaviors/communications/ipc/named-pipe::create-named-pipe
  - id: micro-behaviors/communications/ipc/named-pipe::pipe-path-prefix
  - id: objectives/credential-access/browser/chromium::browser-key-pipe-tag
  - id: objectives/credential-access/browser/chromium::browser-key-pipe-symbol
- id: abe-bypass-hardware-breakpoint
  desc: ABE bypass via hardware breakpoints
  crit: hostile
  conf: 0.95
  attack: T1555.003
  all:
  - id: micro-behaviors/data/config/browser-preference::chromium-abe-result-code-marker
  - id: objectives/anti-analysis/debugger-detect/hardware-breakpoints::debugger-attach-loop
  - id: micro-behaviors/process/info/thread::hardware-breakpoint-register-manipulation
- id: abe-bypass-thread-context-register-selection
  desc: Chromium ABE thread-context register selection
  crit: suspicious
  conf: 0.97
  attack: T1555.003
  for: [pe]
  all:
  - id: micro-behaviors/fs/path/application/browser::chromium-main-library-name
  - id: micro-behaviors/process/info/thread::set-thread-context-import
  - id: metadata/binary/instruction::x64-stack-structure-flag-init
  - id: metadata/binary/instruction::x64-adjacent-stack-pointer-select
- id: chromium-abe-config-reflective-stealer
  desc: ABE config on reflective AES loader
  crit: hostile
  conf: 0.97
  attack: T1555.003,T1620
  for: [pe, dll]
  platforms: [windows]
  all:
  - id: chromium-abe-config-v1-marker
  - id: objectives/command-and-control/backdoor/loader/native-reflect::in-memory-pe-loader-with-decryption
  - id: metadata/binary/provenance/version-info::pe-non-architecture-filename-mismatch
  unless:
  - id: metadata/signed/platform/
  - id: well-known/lib/ui/cef::cef-browser-engine
