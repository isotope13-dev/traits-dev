# Chromium app-bound keys cannot be unwrapped from outside the browser, so
# newer native stealers carry an in-process PE mapper and use a named pipe
# for results. A browser-profile walker that also walks PE headers inline,
# creates an NT named pipe and reads other processes' memory has both halves
# of that design. This is inferred from the combination, not from a traced
# injection.
defaults:
  platforms: [windows]
  for: [pe]
  attack: T1555.003,T1055
composite_rules:
  - id: native-browser-stealer-pe-mapper-named-pipe
    desc: Browser profile stealer with inline PE mapper and pipe
    crit: hostile
    conf: 0.88
    all:
      - id: micro-behaviors/fs/path/app-data::chromium-profile-user-data-path
      - id: micro-behaviors/os/security/dpapi::crypt-unprotect-data-api
      - id: micro-behaviors/data/format/pe-parser::x64-mov-e-lfanew-read
      - id: micro-behaviors/communications/ipc/named-pipe::nt-create-named-pipe
      - id: micro-behaviors/mem/read/cross-process::read-process-memory
    unless:
      - id: metadata/signed/platform/
      - id: metadata/package/testing/
