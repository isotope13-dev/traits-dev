# Chromium's elevation service decrypts app-bound (v20) keys for the browser
# itself. Non-vendor native helpers combining that interface, COM activation,
# proxy security and a DecryptData diagnostic warrant key-recovery triage.
# CoSetProxyBlanket configures COM security; it does not itself relax it.
defaults:
  platforms: [windows]
  for: [pe, dll]
  attack: T1555.003

composite_rules:
  - id: chromium-ielevator-com-decrypt-helper
    desc: Native module decrypts Chromium app-bound key via IElevator
    crit: hostile
    conf: 0.92
    all:
      - id: micro-behaviors/os/com/invoke::co-create-instance
      - id: micro-behaviors/os/com/invoke::co-set-proxy-blanket
      - id: metadata/binary/symbols/name/token::decryptdata-name-reference
    any:
      - id: micro-behaviors/os/com/invoke::chromium-ielevator-service-guid-readonly
      - id: micro-behaviors/os/com/invoke::chromium-ielevator-guid-stack-dwords
    unless:
      - id: metadata/signed/platform/
      - id: well-known/tool/browser::google-chrome-installer
      - id: well-known/tool/browser::google-chrome-runtime-component
  # Go ABE clients reach the same elevation service through go-ole or
  # LazyProc calls, keeping the interface GUID in writable data and the
  # vtable layout in Go type names; no COM import symbols exist to match.
  - id: go-ielevator-appbound-key-decrypt
    desc: Go module decrypts Chromium app-bound key via IElevator
    crit: hostile
    conf: 0.94
    all:
      - id: micro-behaviors/data/config/browser-preference::chromium-app-bound-encrypted-key-field
      - id: micro-behaviors/os/com/invoke::ielevator-vtbl-type-name
    any:
      - id: micro-behaviors/os/com/invoke::chromium-ielevator-service-guid
      - id: micro-behaviors/os/com/invoke::chromium-ielevator-service-guid-readonly
      - id: micro-behaviors/os/com/invoke::chromium-ielevator-guid-stack-dwords
    unless:
      - id: metadata/signed/platform/
      - id: well-known/tool/browser::google-chrome-installer
      - id: well-known/tool/browser::google-chrome-runtime-component
