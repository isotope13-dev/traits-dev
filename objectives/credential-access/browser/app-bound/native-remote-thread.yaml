# The IElevator/stdio helper alone can be used by an authorized importer.
# Require the credential-harvesting context and the remote allocation/write/
# thread imports in the same leaf file. No chosen DLL or temporary filename
# is needed. This is an API profile, not proof that every operation succeeds.
defaults:
  platforms: [windows]
  for: [pe, dll]
  attack: T1555.003,T1055.001

composite_rules:
  - id: chromium-app-bound-key-injection-harvester
    desc: Chromium credential harvester with IElevator and injection APIs
    crit: hostile
    conf: 0.96
    all:
      - id: objectives/credential-access/browser/chromium::native-browser-credential-store-decryption
      - id: micro-behaviors/data/config/browser-preference::chromium-app-bound-encrypted-key-field
      - id: micro-behaviors/os/com/invoke::chromium-ielevator-service-guid-readonly
      - id: micro-behaviors/mem/alloc/remote::virtual-alloc-ex
      - id: micro-behaviors/process/inject/runtime/call::write-process-memory-dup
      - id: micro-behaviors/process/inject/remote-thread::create-remote-thread
