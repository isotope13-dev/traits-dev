# Chromium App-Bound Encryption bypass through a short decryption stub injected
# into the browser process. The browser owns the CryptProtectMemory context, so
# the caller writes and starts a stub there, then reads the plaintext v20 key
# back from remote memory. This is distinct from APC/process-clone variants.
defaults:
  platforms: [windows]
  for: [pe, dll, c, cpp, csharp, rust, go, python]
  attack: T1555.003,T1055.001

composite_rules:
  - id: chromium-abe-memory-remote-thread-bypass
    for: [pe, c]
    desc: Chromium v20 key decrypted by an injected browser thread
    crit: hostile
    conf: 0.99
    near_lines: 140
    all:
      - id: objectives/credential-access/browser/app-bound::v20-memory-key-signature
      - id: micro-behaviors/os/security/dpapi::crypt-unprotect-memory-reference
      - id: micro-behaviors/os/security/dpapi::cryptprotectmemory-same-process-flag
      - id: micro-behaviors/mem/read/cross-process::nt-read-virtual-memory-reference
      - id: micro-behaviors/process/inject/runtime/call::rwx-remote-thread-api-set
    any:
      - id: micro-behaviors/process/inject/runtime/call::nt-write-virtual-memory-source
      - id: micro-behaviors/mem/write/arbitrary::remote-write-symbol-alternative
