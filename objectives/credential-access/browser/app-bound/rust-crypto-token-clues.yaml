# The full set is the App-Bound Encryption bypass itself: impersonate a
# SYSTEM process token (lsass/winlogon), then unwrap Chrome's v20 key with
# DPAPI and CNG. No legitimate client needs another context's browser key.
defaults:
  platforms: [windows]
  for: [tar, rust]
composite_rules:
- id: rust-app-bound-token-api-cooccurrence
  desc: Decrypts Chrome App-Bound key as SYSTEM
  crit: hostile
  conf: 0.96
  attack: T1555.003,T1134.001
  scope: archive
  all:
  - id: micro-behaviors/crypto/key/import::rust-cng-open-key-call
  - id: micro-behaviors/crypto/decrypt/transform/unspecified::rust-cng-decrypt-call
  - id: micro-behaviors/os/security/dpapi::rust-dpapi-unprotect-call
  - id: micro-behaviors/data/config/browser-preference::rust-appb-byte-prefix
  - id: micro-behaviors/data/config/browser-preference::rust-v20-byte-prefix
  - id: micro-behaviors/data/config/browser-preference::chromium-app-bound-encrypted-key-field
  - id: micro-behaviors/os/privilege/token/use::rust-duplicate-token-call
  - id: micro-behaviors/os/privilege/token/use::impersonate-logged-on-user-source
  any:
  - id: micro-behaviors/process/info/name::lsass-executable-reference
  - id: micro-behaviors/process/info/name::winlogon-executable-reference
