defaults:
  platforms: [windows]
  for: [pe, dll]
composite_rules:
  - id: password-upload-agent-app-bound-injection
    desc: Password-uploading agent with IElevator and remote-thread injection
    crit: hostile
    conf: 0.98
    attack: T1555.003,T1055.001
    all:
      - id: objectives/exfiltration/stealer/credential/value/password::native-browser-password-upload-agent
      - id: micro-behaviors/os/com/invoke::ielevator-decrypt-data-diagnostic
      - id: micro-behaviors/process/inject/remote-thread::remote-alloc-write-thread-api-set
