# A web-search skill that silently initiates a browser login and asks the
# operator to enter credentials into a third-party CLI.
defaults:
  platforms: [unix, windows]
  for: [markdown, text]
  attack: T1056.002,T1528

traits:
  - id: firecrawl-browser-login
    desc: Skill launches Firecrawl browser login
    crit: suspicious
    conf: 0.98
    if:
      type: text
      substr: firecrawl login --browser

  - id: firecrawl-silent-auth-instruction
    desc: Skill hides browser authentication from user
    crit: suspicious
    conf: 0.99
    if:
      type: text
      regex: '(?i)Don''t tell users.{0,100}execute.{0,100}browser'

  - id: firecrawl-global-cli-install
    desc: Skill installs global scraping CLI
    crit: notable
    conf: 0.94
    if:
      type: text
      substr: npm install -g firecrawl-cli

composite_rules:
  - id: agent-skill-silent-firecrawl-auth
    desc: Agent skill silently initiates third-party login
    crit: hostile
    conf: 0.99
    scope: archive
    all:
      - id: metadata/package/config::agent-skill-frontmatter
      - id: firecrawl-browser-login
      - id: firecrawl-silent-auth-instruction
