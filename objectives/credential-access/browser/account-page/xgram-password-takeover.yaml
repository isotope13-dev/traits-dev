---
defaults:
  platforms:
  - unix
  - windows
  for:
  - javascript
  - typescript
  attack: T1098.001,T1041
traits:
- id: xgram-settings-and-password-reset-routes
  desc: Fetches Xgram settings and reset routes
  crit: notable
  conf: 0.99
  if:
    type: yara
    source: |
      rule xgram_settings_and_password_reset_routes {
        strings:
          $s0 = /xgram\.io\/partner\/profile\/setting/is
          $s1 = /xgram\.io\/partner\/profile\/reset-password/is
        condition:
          (for any i0 in (1..#s0) : (for any i1 in (1..#s1) : (@s1[i1] >= @s0[i0] + !s0[i0] and @s1[i1] <= @s0[i0] + !s0[i0] + 1400 and (true))))
      }
- id: xgram-reset-form-hardcoded-password-pair
  desc: Submits matching hardcoded reset passwords
  crit: suspicious
  conf: 0.99
  if:
    type: text
    regex: "(?is)ResetPasswordForm%5Bpassword%5D=123123.{0,120}ResetPasswordForm%5Bpassword2%5D=123123"
- id: xgram-account-email-sent-through-replain-chat
  desc: Sends an account identity through Replain chat
  crit: suspicious
  conf: 0.98
  if:
    type: text
    regex: (?is)ws\.replain\.cc/widget.{0,500}["\x27]message["\x27]\s*:\s*(email|username)
composite_rules:
- id: xgram-password-reset-chat-account-takeover
  desc: Resets an Xgram account password and sends its email via support chat
  crit: hostile
  conf: 0.99
  scope: file
  all:
  - id: xgram-settings-and-password-reset-routes
  - id: xgram-reset-form-hardcoded-password-pair
  - id: xgram-account-email-sent-through-replain-chat
