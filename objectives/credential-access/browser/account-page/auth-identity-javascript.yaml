defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
  attack: T1119

traits:
  - id: browser-auth-route-pattern-name
    desc: Names an authentication route matcher
    crit: notable
    conf: 0.9
    if:
      type: text
      word: AUTH_URL_PATTERN

  # `browser-auth-route-terms` moved to
  # micro-behaviors/data/parse/vocabulary::auth-route-vocabulary -- four
  # occurrences of auth/login/session/token is vocabulary, not browser theft.

composite_rules:
  - id: browser-auth-response-identity-interception
    desc: Intercepts authentication responses to harvest user identity
    crit: suspicious
    conf: 0.98
    all:
      - id: browser-auth-route-pattern-name
      - id: micro-behaviors/data/parse/vocabulary::auth-route-vocabulary
      - id: metadata/lang/source/naming/person::identity-name-member-references
      - id: metadata/lang/source/naming/person::identity-email-member-references
      - id: micro-behaviors/communications/http/intercept::fetch-hook
      - id: micro-behaviors/communications/http/client/response-body::fetch-response-clone-json
    any:
      - id: micro-behaviors/communications/http/intercept::xhr-response-json-intercept
      - id: micro-behaviors/communications/http/intercept::open-hook
      - id: micro-behaviors/communications/http/intercept::send-hook

  - id: browser-auth-storage-identity-scan
    desc: Scans browser auth stores for user identity
    crit: suspicious
    conf: 0.98
    attack: T1119,T1539
    all:
      - id: micro-behaviors/communications/http/token-auth::access-token
      - id: micro-behaviors/communications/http/token-auth::refresh-token
      - id: micro-behaviors/data/db/access::okta-token-store-key
      - id: micro-behaviors/data/db/read::auth-token-getitem-source
    any:
      - id: micro-behaviors/data/db/enumerate::browser-storage-sweep-loop
      - id: micro-behaviors/communications/http/cookie-store::document-cookie-split-iterate
