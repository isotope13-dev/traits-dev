defaults:
  platforms: [windows, unix]
  for: [rust]
  attack: T1539,T1555.003

composite_rules:
  - id: rust-chromium-profile-cookie-extractor
    desc: Rust decrypts Chromium profile cookies
    crit: hostile
    conf: 0.98
    all:
      - id: metadata/lang/source/naming/security::rust-cookie-theft-name
      - id: micro-behaviors/fs/path/application/browser/profile::chromium-browser-store-set
      - id: micro-behaviors/fs/read/file/browser::rust-read-chromium-encrypted-key
      - id: micro-behaviors/crypto/decrypt/transform/unspecified::rust-decrypt-chromium-master-key
      - id: micro-behaviors/fs/read/file/browser::rust-read-cookies-with-master-key
