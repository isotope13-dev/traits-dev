# Product identity is corroborated by an actual remote execution command;
# a password-tool name alone is legitimate dual-use inventory evidence.
defaults:
  for: [scripts, source, pe, dll]
  platforms: [windows]
composite_rules:
  - id: remote-runfile-browser-password-tool
    desc: ScreenConnect RunFile references a browser password recovery executable
    crit: suspicious
    conf: 0.96
    attack: T1555.003,T1219
    near_lines: 1
    all:
      - id: well-known/dual-use/remote-admin/screenconnect::windows-client-runfile-command
      - id: well-known/dual-use/credentials/nirsoft-webbrowserpassview::executable-reference
