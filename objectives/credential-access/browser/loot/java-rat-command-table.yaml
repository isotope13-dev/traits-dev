# Java RAT command tables (STRRAT and kin) that dispatch browser and mail
# password dumps per product. A command word naming one browser could be a
# label; a RAT command table naming several is the stealer module.
defaults:
  platforms: [windows]
  for: [class]
  crit: hostile
  attack: T1555.003,T1219

composite_rules:
  - id: java-rat-multi-browser-password-commands
    desc: Java RAT command table dumps passwords from several browsers and mail clients
    conf: 0.95
    all:
      - id: objectives/command-and-control/backdoor/rat/command-set::rat-comprehensive
    any:
      - id: chrome-pass-string
      - id: firefox-pass-string
      - id: ie-pass-string
      - id: outlook-pass-string
      - id: thunderbird-pass-string
      - id: foxmail-pass-string
    needs: 3
