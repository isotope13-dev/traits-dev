# Raw-copying a live browser credential database with Esentutl bypasses the
# browser's file lock. The command shape is documented in CISA AA24-109A for
# both Firefox key4.db and Chromium Login Data stores.
defaults:
  platforms: [windows]
  for: [scripts, source, binaries]
  attack: T1555.003

composite_rules:
  - id: esentutl-browser-credential-copy
    desc: Copies a browser credential database with Esentutl raw-copy mode
    crit: suspicious
    conf: 0.97
    all:
      - id: micro-behaviors/fs/file/copy::esentutl-raw-file-copy
    any:
      - id: micro-behaviors/fs/path/password-store::chromium-login-data-browser-path-profile
      - id: micro-behaviors/fs/path/password-store::firefox-profile-credential-stores
    near_lines: 1
