# Compiled routines named for pulling secrets out of browser profiles.
#
# A macOS C++ stealer (2026-11, e8b7503f40fb, "cloudsync_impl") encrypted its
# path and service-name literals but kept exported mangled collectors such as
# `8chromium15extract_cookiesERKNS1_11BrowserInfo`,
# `8chromium20extract_credit_cards`, and `8chromium20get_safe_storage_key`.
# Languages that keep routine names in their symbols (Itanium C++, Rust,
# Swift, Go) leak the same verbs. Keep the Itanium length-prefix boundary:
# parameters may follow the name without a separator.
defaults:
  platforms: [linux, macos, windows]
  for: [macho, elf, pe]
  attack: T1555.003
traits:
  # Chromium encrypts cookies and logins under a Safe Storage secret the
  # browser keeps in the OS key store. A third-party routine retrieving that
  # key reads another application's encryption secret.
  - id: safe-storage-key-routine-name
    desc: Routine named for fetching Safe Storage key
    crit: suspicious
    conf: 0.85
    if:
      type: text
      regex: '(?i)(^|[^a-z_])(get_|read_|fetch_)?(safe_storage_(key|password)|master_key_via_security)'
    unless:
      - id: well-known/app/ai/tool-server/local-mcp::signed-binary-context
  - id: password-extract-routine-name
    desc: Routine named for extracting saved passwords
    crit: notable
    conf: 0.85
    if:
      type: text
      regex: '(?i)(^|[^a-z])(extract|grab|steal|dump)_(all_)?(passwords|logins)'
  - id: cookie-extract-routine-name
    desc: Routine named for extracting cookies
    crit: notable
    conf: 0.85
    if:
      type: text
      regex: '(?i)(^|[^a-z])(extract|grab|steal|dump)_(all_)?cookies'
  - id: card-extract-routine-name
    desc: Routine named for extracting saved payment cards
    crit: notable
    conf: 0.85
    if:
      type: text
      regex: '(?i)(^|[^a-z])(extract|grab|steal|dump)_(all_)?credit_?cards'
composite_rules:
  # Retrieving the browser's storage key together with routines that pull two
  # or more kinds of browser secret, in code that opens SQLite stores, is the
  # decrypt-and-harvest shape of a stealer; browsers and their SDKs never take
  # another browser's key.
  - id: native-browser-secret-harvest-routines
    desc: Native routines take browser key and extract secrets
    crit: hostile
    conf: 0.95
    all:
      - id: safe-storage-key-routine-name
      - id: micro-behaviors/data/db/sqlite::sqlite3-open
    needs: 2
    any:
      - id: password-extract-routine-name
      - id: cookie-extract-routine-name
      - id: card-extract-routine-name
      - id: micro-behaviors/browser-extension/management::grab-extensions-routine-name
