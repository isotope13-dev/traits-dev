defaults:
  for: [rust]
  platforms: [windows, unix]
  attack: T1555.003

traits:
  - id: rust-aes-decrypt-call
    desc: Rust invokes AES decryption helper
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '\.aes_decrypt\s*\('
  - id: rust-write-password-label
    desc: Rust writes a labeled password
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: 'writeln!\s*\([^\r\n]{0,120}Password:'

composite_rules:
  - id: rust-chromium-decrypted-login-export
    desc: Rust decrypts and exports browser logins
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/fs/path/password-store::login-data
      - id: micro-behaviors/data/db/access::chromium-login-password-table
      - id: micro-behaviors/data/db/sqlite::rust-rusqlite-import
      - id: rust-aes-decrypt-call
      - id: rust-write-password-label
