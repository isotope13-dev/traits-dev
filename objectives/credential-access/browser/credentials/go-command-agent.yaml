defaults:
  platforms: [unix, windows]
  for: [go, zip]
  attack: T1555.003

traits:
  - id: go-chrome-safe-storage-query
    desc: Go code queries Chrome Safe Storage
    crit: notable
    conf: 0.98
    for: [go]
    if:
      type: text
      regex: '(?s)find-generic-password.{0,100}Chrome Safe Storage'

composite_rules:
  - id: go-agent-chromium-credential-query
    desc: Command agent includes Chromium credential query
    crit: hostile
    conf: 0.99
    scope: archive
    all:
      - id: objectives/command-and-control/backdoor/agent::go-browser-collector-command-agent
      - id: micro-behaviors/data/db/read/column::chromium-login-sql
  - id: go-agent-chromium-keychain-decrypt
    desc: Command agent includes Chrome keychain decryption
    crit: hostile
    conf: 0.99
    scope: archive
    all:
      - id: objectives/command-and-control/backdoor/agent::go-browser-collector-command-agent
      - id: go-chrome-safe-storage-query
      - id: micro-behaviors/crypto/decrypt/initialize::go-cbc-decrypter-name-reference
      - id: micro-behaviors/data/db/read/column::chromium-login-sql
