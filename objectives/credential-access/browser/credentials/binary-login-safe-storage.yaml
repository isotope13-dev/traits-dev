defaults:
  platforms: [unix, windows]
  for: [pe, elf, macho, scripts, source]
  attack: T1555.003

composite_rules:
  # A compiled or embedded agent that names the Chromium saved-login database
  # and the Safe Storage key entry carries the decryption inputs for stored
  # browser passwords. Neither name alone proves a read of the database, and
  # password managers may name both, so the composite stays suspicious.
  - id: chromium-login-store-with-safe-storage-key
    desc: Names Chromium login store and Safe Storage key entry
    crit: suspicious
    conf: 0.9
    scope: file
    size_max: 50000000
    all:
      - id: micro-behaviors/fs/path/credential/password-store::login-data
      - id: micro-behaviors/fs/path/credential/password-store::chrome-safe-storage
