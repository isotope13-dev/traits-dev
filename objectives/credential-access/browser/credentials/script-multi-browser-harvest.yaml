# Cross-language multi-browser login, cookie, Local State, Firefox store, and
# Chromium wallet-extension harvesting combined with Windows DPAPI decryption.
defaults:
  platforms: [windows]
  for: [source, scripts]
  attack: T1555.003

composite_rules:
  - id: multi-browser-wallet-dpapi-harvester
    desc: Harvests multi-browser and wallet stores via DPAPI
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/os/application/target/browser::browser-store-and-three-browser-name-references
      - id: micro-behaviors/fs/path/password-store::login-data
      - id: micro-behaviors/fs/path/application/browser/profile::local-state
      - id: micro-behaviors/fs/path/password-store::firefox-profile-credential-stores
      - id: micro-behaviors/fs/path/application/extensions::chromium-local-extension-settings-path
      - id: micro-behaviors/os/security/dpapi::crypt-unprotect-data-source-reference
