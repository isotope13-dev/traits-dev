defaults:
  for: [mirc, text]
  platforms: [windows]
  attack: T1555.003,T1059

traits:
  - id: bof-browser-password-task
    desc: Beacon task requests browser passwords
    crit: notable
    conf: 0.96
    if:
      type: text
      regex: '(?i)get\s+browser\s+password'
  - id: bof-inline-execution
    desc: Executes a beacon object inline
    crit: notable
    conf: 0.97
    if:
      type: text
      regex: '\bbeacon_inline_execute\s*\('
  - id: bof-resource-loader
    desc: Reads a bundled beacon payload resource
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: '\bopenf\s*\(\s*script_resource\s*\('
  - id: bof-argument-pack
    desc: Packs payload bytes for beacon execution
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: '\bbof_pack\s*\('

composite_rules:
  - id: bof-browser-password-loader
    desc: Beacon task loads browser-password collection payload
    crit: hostile
    conf: 0.98
    all:
      - id: bof-browser-password-task
      - id: bof-inline-execution
      - id: bof-resource-loader
      - id: bof-argument-pack
