defaults:
  platforms: [macos, unix, windows]
  for: [go]
  attack: T1555.003

composite_rules:
  - id: go-browser-credential-archive-harvest
    desc: Go archives browser login and cookie stores
    crit: hostile
    conf: 0.98
    all:
      - id: objectives/exfiltration/stealer/application-state/browser-state::go-browser-store-bound-archive-body
      - id: micro-behaviors/fs/path/password-store::login-data
    unless:
      - id: metadata/path/directory::test-directory-component
