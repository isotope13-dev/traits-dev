defaults:
  platforms: [windows, unix]
  for: [java, class, java_class, jar]
  attack: T1555.003

traits:
  - id: jvm-firefox-logins-bytes
    desc: JVM Firefox logins bytes
    crit: suspicious
    conf: 0.94
    for: [class]
    if:
      type: hex
      pattern: 6C 6F 67 69 6E 73 2E 6A 73 6F 6E
    unless:
      - id: well-known/app/communication/thunderbird::librewolf-omni-runtime-path
      - id: well-known/app/communication/thunderbird::librewolf-omni-basename
      - id: well-known/app/ai/assistant/claude-desktop::official-package-context
