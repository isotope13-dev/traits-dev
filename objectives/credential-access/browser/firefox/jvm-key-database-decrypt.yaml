# A JVM class that reads a SQLite key database over JDBC, parses profile JSON,
# builds a triple-DES key and runs a Cipher: the Firefox key4.db / logins.json
# recovery path (NSS stores master keys as 3DES-wrapped PBE blobs). Located
# from the profile directory under an environment variable. Judged per class,
# not per JAR, so vendored libraries cannot assemble it.
defaults:
  platforms: [windows]
  attack: T1555.003
composite_rules:
  - id: jvm-firefox-key-database-3des-decrypt
    desc: JVM class decrypts profile SQLite and JSON with 3DES
    crit: hostile
    conf: 0.85
    for: [class, java_class]
    all:
      - id: micro-behaviors/crypto/key/representation::desede-keyspec
      - id: micro-behaviors/data/db/sql::jvm-jdbc-driver-manager
      - id: micro-behaviors/data/format/json::gson-json-parser-class
      - id: micro-behaviors/os/env/read::jvm-getenv-method
      - id: micro-behaviors/crypto/cipher::dofinal-method
    unless:
      - id: metadata/package/testing/
