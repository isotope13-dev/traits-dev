defaults:
  for:
  - powershell
  platforms:
  - windows
  crit: notable
  conf: 0.98
traits:
- id: password-record-file-output
  desc: Writes URL username and password records
  if:
    type: text
    regex: Format-List URL, UserName, Password \| Out-File\b
composite_rules:
- id: powershell-nss-plaintext-file-stage
  desc: Writes decrypted Firefox passwords to disk
  crit: hostile
  all:
  - id: powershell-nss-login-export
  - id: password-record-file-output
