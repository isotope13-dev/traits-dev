defaults:
  platforms: [windows]
  for: [pe, dll]
composite_rules:
  # Same-file store/read/recording evidence, without claiming decryption,
  # a bound path-to-read flow, or a successful transfer to a server.
  - id: managed-keylogger-firefox-store-read-references
    desc: Keylogger with Firefox store and read references
    crit: hostile
    conf: 0.96
    attack: T1555.003
    all:
      - id: micro-behaviors/fs/path/password-store::firefox-logins-json-target
      - id: micro-behaviors/fs/read/file/full::dotnet-readallbytes-token
      - id: objectives/collection/keylog/hook::dotnet-hook-keylog-recording
