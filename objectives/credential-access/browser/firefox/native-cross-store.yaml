# Co-occurring login-query, NSS-decryption and FTP-store references.
# This does not establish a send or exclude authorized password recovery.
defaults:
  platforms: [windows]
  for: [pe, dll]
  attack: T1555.003,T1552.001

composite_rules:
  - id: native-nss-mozilla-filezilla-store-targets
    desc: Native PE combines Mozilla login queries, NSS and FileZilla stores
    crit: suspicious
    conf: 0.98
    all:
      - id: objectives/credential-access/browser/firefox::moz-logins-sql
      - id: micro-behaviors/crypto/provider/nss::nss-secret-decrypt-reference
      - id: micro-behaviors/fs/path/password-store::filezilla-configuration-path-references
      - id: metadata/binary/layout/embedded::sqlite-format-header-reference
