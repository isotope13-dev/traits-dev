defaults:
  platforms: [macos]
  for: [applescript, shell, macho]
composite_rules:
  # Co-occurring store and read evidence with an independently established
  # credential phish. No decryption or source-to-read link is claimed.
  - id: password-phishing-gecko-store-read-profile
    desc: Password phishing with Gecko stores and reads
    crit: hostile
    conf: 0.96
    attack: T1555.003,T1056.002
    all:
      - id: objectives/credential-access/phishing/lure::applescript-credential-phish-hostile
      - id: micro-behaviors/fs/path/application/browser::firefox-profile-directory
      - id: micro-behaviors/fs/path/password-store::firefox-logins-json-target
      - id: micro-behaviors/fs/path/password-store::gecko-key4-database-path-reference
      - id: micro-behaviors/fs/read/file/handle::applescript-read-result-assignment
