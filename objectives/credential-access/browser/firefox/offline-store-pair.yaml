defaults:
  platforms: [unix, windows]
  for: [python, javascript, typescript, ruby]

composite_rules:
  # Both stores are needed for offline recovery. Authorized migration remains
  # possible: acquisition alone neither establishes a send nor warrants hostile.
  - id: offline-login-key-store-acquisition
    desc: Reads Firefox logins and offline decryption stores
    crit: suspicious
    conf: 0.98
    attack: T1555.003
    all:
      - id: micro-behaviors/fs/read/file/target::firefox-logins-content-read
      - id: micro-behaviors/fs/read/file/target::firefox-key-database-content-read
