defaults:
  platforms: [windows]
  for: [pe, dll, data]
traits:
  # Rotating the native decoder's 64-character alphabet by six recovers
  # "select *  from moz_logins". This identifies a targeted query, not a send.
  - id: substituted-moz-logins-sql
    desc: Substituted Firefox login-table SELECT query
    crit: suspicious
    conf: 0.98
    attack: T1555.003
    if:
      type: text
      exact: '6didY5 *  80Wl lWkpiWn4R6'
