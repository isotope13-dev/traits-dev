defaults:
  platforms:
    - unix
    - windows
  for: [scripts, binaries]

composite_rules:
  - id: rust-firefox-multi-store-collector
    desc: Rust Firefox multi-store browser data collector
    crit: hostile
    conf: 0.99
    attack: T1555.003,T1119,T1217
    for: [rust]
    all:
      - id: micro-behaviors/fs/path/application/browser::firefox-profile-directory
      - id: moz-cookies-sql
      - id: objectives/collection/activity/browser::firefox-history-sql-query
      - id: moz-formhistory-sql
      - id: micro-behaviors/fs/file/copy::rust-fs-copy
      - id: objectives/anti-static/obfuscation/string/conceal::obfuscate-macro-strings
