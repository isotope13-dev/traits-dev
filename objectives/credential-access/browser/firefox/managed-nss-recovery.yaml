defaults:
  platforms: [windows]
  for: [pe, dll]
composite_rules:
  # Recovery can serve an authorized importer; this is acquisition evidence,
  # with no claim that the fields reach the decryptor or leave the host.
  - id: managed-nss-login-recovery-references
    desc: Firefox login read and NSS recovery references
    crit: suspicious
    conf: 0.97
    attack: T1555.003
    all:
      - id: metadata/binary/framework::dotnet-assembly
      - id: micro-behaviors/fs/path/password-store::firefox-logins-json-target
      - id: micro-behaviors/fs/read/file/full::dotnet-read-all-text
      - id: micro-behaviors/data/serialize/schema-credential::encrypted-username-field-reference
      - id: micro-behaviors/data/serialize/schema-credential::encrypted-password-field-reference
      - id: micro-behaviors/crypto/decrypt::nss-secret-decrypt-reference
