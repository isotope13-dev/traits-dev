# C source or header that declares a Firefox signon dumper: NSS initialization,
# a master-password check, secret decryption, and a dump routine whose
# prototype takes a socket and a destination. The prototypes are identifier
# facts, so the names survive a header with no bodies. The socket-and-
# destination prototype is the transport leg; without it the names alone
# describe reading saved logins.
defaults:
  platforms: [windows]
  for: [c, cpp]
  attack: T1555.003

traits:
  - id: firefox-signon-dump-prototype
    desc: Declares a Firefox signon secret dumper
    crit: notable
    conf: 0.92
    if:
      type: symbol
      kind: identifier
      exact: DumpSignonSecrets

  - id: firefox-nss-init-prototype
    desc: Declares Firefox NSS library initializer
    crit: notable
    conf: 0.9
    if:
      type: symbol
      kind: identifier
      exact: InitializeNSSLibrary

  - id: firefox-master-password-prototype
    desc: Declares Firefox master password check
    crit: notable
    conf: 0.9
    if:
      type: symbol
      kind: identifier
      exact: CheckMasterPassword

  - id: firefox-secret-decrypt-prototype
    desc: Declares Firefox login secret decryption
    crit: notable
    conf: 0.9
    if:
      type: symbol
      kind: identifier
      exact: DecryptSecretString

  - id: firefox-pk11-decrypt-prototype
    desc: Declares NSS PK11 decryption helper
    crit: notable
    conf: 0.88
    if:
      type: symbol
      kind: identifier
      exact: PK11Decrypt

  # The dump routine reports to a remote endpoint through a socket and a
  # destination string passed in the same prototype.
  - id: firefox-socket-destination-prototype
    desc: Firefox dumper prototype takes socket and dest
    crit: notable
    conf: 0.9
    if:
      type: text
      substr: SOCKET sock, char *dest

composite_rules:
  - id: firefox-signon-socket-dumper
    desc: Firefox signon dumper declarations with socket destination
    crit: hostile
    conf: 0.95
    all:
      - id: firefox-signon-dump-prototype
      - id: firefox-socket-destination-prototype
    any:
      - id: firefox-nss-init-prototype
      - id: firefox-master-password-prototype
      - id: firefox-secret-decrypt-prototype
      - id: firefox-pk11-decrypt-prototype
    needs: 1
