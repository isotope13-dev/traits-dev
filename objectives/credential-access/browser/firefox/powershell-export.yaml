defaults:
  for:
  - powershell
  platforms:
  - windows
  crit: notable
  conf: 0.98
  attack: T1555.003
composite_rules:
- id: powershell-nss-login-export
  desc: PowerShell decrypts Firefox logins and exports password records
  crit: hostile
  all:
  - id: well-known/tool/offensive/powershell-empire::browser-credential-module-functions
  - id: nss-decrypt
  - id: micro-behaviors/os/security/auth/secret::powershell-password-record-format
