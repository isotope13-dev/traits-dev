defaults:
  attack: T1555.003
  platforms:
    - unix
    - windows
  for: [scripts, binaries, source]
traits:
  - id: cert9-db
    desc: Firefox cert9.db certificate store
    crit: suspicious
    conf: 0.8
    if:
      type: text
      regex: (?i)(Firefox|Waterfox|Pale Moon).{0,64}cert9\.db
    unless:
      - id: micro-behaviors/crypto/certificate/install/
      - id: micro-behaviors/crypto/certificate/store/
      - id: metadata/package/testing/
      - id: "metadata/file/naming::test-directory-component"
  - id: moz-logins-sql
    desc: Firefox moz_logins SQL query
    crit: suspicious
    conf: 0.95
    mbc: B0028
    if:
      type: text
      regex: 'SELECT\s+[^\r\n;]{1,160}\s+FROM\s+moz_logins\b'
      case_insensitive: true
    downgrade:
      any:
        - id: metadata/signed/certificate/identity::bitdefender-brand-text
    unless:
      - id: well-known/tool/offensive/peas/
      - id: well-known/app/browser/palemoon/
      - id: well-known/app/system/iobit::iobit-component-context
composite_rules:
  - id: nss-decrypt
    desc: NSS secret-decryption API with Firefox profile references
    for: [scripts, source]
    crit: suspicious
    conf: 0.95
    mbc: B0028
    all:
      - id: micro-behaviors/crypto/decrypt::nss-secret-decrypt-reference
      - id: micro-behaviors/fs/path/application/browser::firefox-profile-directory
    unless:
      - id: well-known/tool/offensive/peas/
      - id: micro-behaviors/crypto/certificate/usage::certutil-ca-bundle-export
  - id: firefox-cookie-database-collection
    desc: Firefox cookie database collection
    crit: hostile
    conf: 0.99
    attack: T1555.003,T1119
    for: [rust]
    all:
      - id: micro-behaviors/fs/path/application/browser::firefox-profile-directory
      - id: micro-behaviors/data/db/access::moz-cookies-sql
      - id: micro-behaviors/fs/file/copy::rust-fs-copy
      - id: objectives/anti-static/obfuscation/string/conceal::obfuscate-macro-strings

  # Credential decryption plus a copied Microsoft service-host identity
  # establishes covert harvesting rather than browser profile migration.
  - id: masqueraded-native-firefox-login-decryptor
    desc: Svchost disguise with Firefox login-decrypt APIs
    crit: hostile
    conf: 0.98
    for: [pe]
    platforms: [windows]
    all:
      - id: moz-logins-sql
      - id: micro-behaviors/crypto/decrypt::nss-secret-decrypt-reference
      - id: objectives/evasion/masquerade/version-resource/service-host::unsigned-service-host-version-resource
