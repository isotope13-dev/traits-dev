defaults:
  attack: T1555.003
  platforms:
    - unix
    - windows
  for: [scripts, binaries, source]
traits:
  - id: moz-logins-sql
    desc: Firefox moz_logins SQL query
    crit: suspicious
    conf: 0.95
    if:
      type: text
      regex: 'SELECT\s+[^\r\n;]{1,160}\s+FROM\s+moz_logins\b'
      case_insensitive: true
    downgrade:
      any:
        - id: metadata/signature/verified/signer::bitdefender-srl
    unless:
      - id: well-known/tool/offensive/peas/
      - id: well-known/app/browser/palemoon/
      - id: well-known/app/system/iobit::iobit-component-context
composite_rules:
  - id: js-cdp-imported-firefox-cookie-store
    desc: Imports Firefox cookies into a CDP session
    crit: hostile
    conf: 0.96
    for: [javascript, typescript]
    attack: T1555.003,T1185
    near_bytes: 16384
    all:
      - id: micro-behaviors/data/db/read/records::moz-cookies-sql
      - id: micro-behaviors/communications/http/devtools/client::cdp-method-network-set-cookies

  - id: nss-decrypt
    desc: NSS secret-decryption API with Firefox profile references
    for: [scripts, source]
    crit: suspicious
    conf: 0.95
    all:
      - id: micro-behaviors/crypto/provider/nss::nss-secret-decrypt-reference
      - id: micro-behaviors/fs/path/application/browser/profile::firefox-profile-directory
    unless:
      - id: well-known/tool/offensive/peas/
      - id: micro-behaviors/crypto/certificate/usage::certutil-ca-bundle-export
  - id: firefox-cookie-database-collection
    desc: Firefox cookie database collection
    crit: hostile
    conf: 0.99
    attack: T1555.003,T1119
    for: [rust]
    all:
      - id: micro-behaviors/fs/path/application/browser/profile::firefox-profile-directory
      - id: micro-behaviors/data/db/read/records::moz-cookies-sql
      - id: micro-behaviors/fs/file/copy/source-destination::rust-fs-copy
      - id: objectives/anti-static/obfuscation/string/conceal::obfuscate-macro-strings

  # Credential decryption plus a copied Microsoft service-host identity
  # establishes covert harvesting rather than browser profile migration.
  - id: masqueraded-native-firefox-login-decryptor
    desc: Svchost disguise with Firefox login-decrypt APIs
    crit: hostile
    conf: 0.98
    for: [pe]
    platforms: [windows]
    all:
      - id: moz-logins-sql
      - id: micro-behaviors/crypto/provider/nss::nss-secret-decrypt-reference
      - id: objectives/evasion/masquerade/version-resource/service-host::unsigned-service-host-version-resource
