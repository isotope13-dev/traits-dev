defaults:
  attack: T1555.003
  platforms:
    - unix
    - windows
  for: [scripts, binaries, source]
traits:
  - id: key4-db
    desc: Firefox key4.db (master password database)
    crit: suspicious
    conf: 0.9
    if:
      type: text
      regex: (?i)(Firefox|Waterfox|Pale Moon).{0,80}key4\.db
    unless:
      - id: well-known/tool/detection/pattern-catalog::embedded-deny-policy-catalog
  - id: cert9-db
    desc: Firefox cert9.db certificate store
    crit: suspicious
    conf: 0.8
    if:
      type: text
      regex: (?i)(Firefox|Waterfox|Pale Moon).{0,64}cert9\.db
    unless:
      - id: micro-behaviors/crypto/certificate/install/
      - id: micro-behaviors/crypto/certificate/store/
  - id: nss-private
    desc: Firefox NSS private key database
    crit: notable
    conf: 0.8
    for: [binaries, source]
    if:
      type: string_literal
      regex: (?i)\bnssPrivate\b
    unless:
      - id: well-known/lib/crypto/nss/
      - id: well-known/app/browser/palemoon/
  - id: pk11-decrypt
    desc: Firefox PK11SDR_Decrypt function
    crit: notable
    conf: 0.95
    mbc: B0028
    if:
      type: text
      substr: PK11SDR_Decrypt
    unless:
      - id: well-known/lib/crypto/nss/
      - id: well-known/app/browser/palemoon/
  - id: pl-base64decode-export
    desc: Firefox NSS base64 export
    crit: component
    conf: 0.84
    for: [scripts, source]
    if:
      type: text
      exact: PL_Base64Decode
    unless:
      - id: well-known/lib/runtime/mozilla-nspr/
  - id: pr-abort-export
    desc: Firefox NSS PR_Abort export
    crit: component
    conf: 0.84
    for: [scripts, source]
    if:
      type: text
      exact: PR_Abort
    unless:
      - id: well-known/lib/runtime/mozilla-nspr/
  - id: moz-cookies-sql
    desc: Firefox moz_cookies SQL query
    # Cookie exporters and profile-migration utilities issue this exact query.
    # Theft requires an untrusted sink or another intent-specific behavior.
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: SELECT.{0,80}FROM\s+moz_cookies
      case_insensitive: true
    unless:
      - id: well-known/app/browser/palemoon/
      - id: well-known/app/system/iobit/
      - id: well-known/app/security/itop-vpn::benign-context
      - id: well-known/dual-use/transfer/aria2::aria2-downloader-context
      - id: well-known/tool/browser::idm-download-manager-context
      - id: well-known/app/communication/thunderbird::thunderbird-xul-runtime
      - id: well-known/app/browser/mozilla-firefox::firefox-xul-runtime
      - id: well-known/lib/core/yt-dlp/
      - id: well-known/lib/development/browser-cookie3/
  - id: moz-formhistory-sql
    desc: Firefox form-history SQL query
    # Browsers and migration tools legitimately query this table. The query is
    # meaningful data-access evidence, but it does not establish theft intent.
    crit: notable
    conf: 0.92
    if:
      type: text
      regex: SELECT.{0,80}FROM\s+moz_formhistory
      case_insensitive: true
    unless:
      - id: well-known/app/browser/palemoon/
      - id: well-known/app/system/iobit::iobit-component-context
      - id: well-known/app/security/itop-vpn::benign-context
  - id: moz-logins-sql
    desc: Firefox moz_logins SQL query
    crit: suspicious
    conf: 0.95
    mbc: B0028
    if:
      type: text
      regex: SELECT.{0,50}FROM\s+moz_logins
      case_insensitive: true
    downgrade:
      any:
        - id: metadata/signed/certificate/identity::bitdefender-brand-text
    unless:
      - id: well-known/app/browser/palemoon/
      - id: well-known/app/system/iobit::iobit-component-context
  - id: webappsstore-db
    desc: Firefox webappsstore.sqlite database
    # A filename reference alone is inventory/cleanup evidence. Theft rules
    # combine it with profile traversal and access behavior below.
    crit: notable
    conf: 0.85
    if:
      type: text
      substr: webappsstore.sqlite
    unless:
      - id: well-known/app/browser/palemoon/
      - id: well-known/app/system/iobit::iobit-component-context
  - id: ls-archive-db
    desc: Firefox ls-archive.sqlite database
    crit: notable
    conf: 0.85
    if:
      type: text
      substr: ls-archive.sqlite
    unless:
      - id: well-known/app/browser/palemoon/
  - id: storage-default-path
    desc: Firefox storage/default path
    crit: notable
    conf: 0.8
    if:
      type: text
      regex: '(?i)(^|[\\/])storage[\\/]default([\\/]|$)'
    unless:
      - id: metadata/library/data::pulumi-python-provider-generated
      - id: well-known/app/communication/thunderbird::firefox-omni-runtime-path
      - id: well-known/app/communication/thunderbird::firefox-devtools-storage-actor
      - id: well-known/app/browser/palemoon/
  - id: ls-data-db
    desc: Firefox ls/data.sqlite database
    crit: notable
    conf: 0.85
    if:
      type: text
      substr: ls/data.sqlite
    unless:
      - id: well-known/app/browser/palemoon/
composite_rules:
  - id: cookie-query-comp
    desc: Firefox profile cookie database query
    # Profile discovery plus a moz_cookies SELECT establishes access, not
    # theft: cleanup, migration, and account-management tools do this too.
    # Exfiltration rules can promote this evidence when an outbound sink is
    # present.
    crit: notable
    conf: 0.9
    all:
      - id: micro-behaviors/fs/path/application/browser::firefox-profile-directory
      - id: moz-cookies-sql
    unless:
      - id: well-known/app/browser/palemoon/
      - id: well-known/app/system/iobit::iobit-component-context
      - id: well-known/tool/browser::idm-download-manager-context
      - id: well-known/lib/core/yt-dlp/
  - id: password-theft-comp
    desc: Firefox password/form history theft
    crit: suspicious
    conf: 0.85
    all:
      - id: micro-behaviors/fs/path/application/browser::firefox-profile-directory
    any:
      - id: nss-private
      - id: objectives/credential-access/browser/firefox::logins
      - id: key4-db
    unless:
      - id: well-known/tool/detection/malcontent::malcontent-defensive-scanner-context
      - id: well-known/app/browser/palemoon/
      - id: well-known/app/system/iobit::iobit-component-context
  - id: local-storage-access
    desc: Firefox browser storage database access
    crit: notable
    conf: 0.9
    for:
      - javascript
      - typescript
      - python
    any:
      - id: webappsstore-db
      - id: ls-archive-db
      - id: ls-data-db
  - id: nss-export-cluster
    desc: Firefox NSS export pair
    crit: component
    conf: 0.9
    all:
      - id: pl-base64decode-export
      - id: pr-abort-export
    unless:
      - id: well-known/lib/runtime/mozilla-nspr/
  - id: nss-decrypt
    desc: Firefox NSS database decryption
    for: [scripts, source]
    crit: suspicious
    conf: 0.95
    mbc: B0028
    any:
      - id: pk11-decrypt
      - id: micro-behaviors/dylib/library/ssl::nss3-word
      - id: micro-behaviors/dylib/library/ssl::libnss3-ref
      - id: nss-export-cluster
    all:
      - id: micro-behaviors/fs/path/application/browser::firefox-profile-directory
    unless:
      - id: micro-behaviors/crypto/certificate/usage::certutil-ca-bundle-export
  - id: firefox-cookie-database-collection
    desc: Firefox cookie database collection
    crit: hostile
    conf: 0.99
    attack: T1555.003,T1119
    for: [rust]
    all:
      - id: micro-behaviors/fs/path/application/browser::firefox-profile-directory
      - id: moz-cookies-sql
      - id: micro-behaviors/fs/file/copy::rust-fs-copy
      - id: objectives/anti-static/obfuscation/string/conceal::obfuscate-macro-strings
