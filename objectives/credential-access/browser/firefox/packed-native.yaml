defaults:
  for: [pe]
  platforms: [windows]
traits:
  # The hostname/username selection and moz_logins table prefix survive
  # Snappy compression; the full decoded query selects encrypted passwords.
  # Require binary breaks at both truncated words. An intact plaintext query
  # belongs to moz-logins-sql, not this packed-fragment observation.
  - id: packed-moz-login-query-fragments
    desc: Packed Firefox login-table SELECT fragments
    crit: suspicious
    conf: 0.93
    attack: T1555.003
    if:
      type: raw
      regex: 'select id, hostname, user[\x00-\x1f][\s\S]{0,96} from moz_l[\x00-\x1f]'
composite_rules:
  # A Chrome executable identity has no legitimate need for concealed native
  # code querying Firefox's login database and resolving NSS secret decryption.
  # This is a co-occurrence signature, not a static source-to-sink proof.
  - id: chrome-disguised-packed-firefox-decryptor
    desc: Chrome disguise with packed Firefox login decryptor
    crit: hostile
    conf: 0.98
    attack: T1555.003,T1036.005
    all:
      - id: packed-moz-login-query-fragments
      - id: micro-behaviors/crypto/decrypt::packed-nss-secret-decrypt-name-fragments
      - id: objectives/anti-static/obfuscation/control-flow/stack::saved-stack-native-payload-handoff
      - id: metadata/binary/resource/identity::chrome-executable-resource-string
      - id: metadata/binary/resource/identity::chrome-name-resource-string
  # The same login query and NSS decrypt names, without a chrome.exe resource.
  # OriginalFilename can be foobar.exe while the packed image still reads
  # moz_logins and calls SDR_Decrypt.
  - id: packed-firefox-nss-login-decryptor
    desc: Concealed native loader with Firefox login-decryption references
    crit: hostile
    conf: 0.97
    attack: T1555.003
    all:
      - id: packed-moz-login-query-fragments
      - id: micro-behaviors/crypto/decrypt::packed-nss-secret-decrypt-name-fragments
      - id: objectives/anti-static/obfuscation/control-flow/stack::saved-stack-native-payload-handoff
  # This variant lacks the stack handoff signature above, but carries the
  # login query and NSS decrypt markers in an unsigned image claiming Google
  # and chrome.exe identity, together with the ROR13 API resolver constants.
  - id: unsigned-chrome-firefox-login-decryptor
    desc: Unsigned Chrome disguise with Firefox login decryptor
    crit: hostile
    conf: 0.96
    attack: T1555.003,T1036.005,T1027.007
    all:
      - id: packed-moz-login-query-fragments
      - id: micro-behaviors/crypto/decrypt::packed-nss-secret-decrypt-name-fragments
      - id: metadata/signed/trust-level::unsigned-pe-google-version-fields
      - id: micro-behaviors/process/info/name::chrome-exe-process-name
      - id: objectives/anti-static/obfuscation/imports/api-hashing::getprocaddress-ror13-hash
      - id: objectives/anti-static/obfuscation/imports/api-hashing::loadlibrarya-ror13-hash
