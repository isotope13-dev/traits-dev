defaults:
  platforms:
  - linux
  - macos
  - windows
  for:
  - scripts
  - binaries
  - source

traits:
- id: firefox-cookie-sql
  desc: moz_cookies query with encrypted-value fields
  crit: suspicious
  conf: 0.8
  attack: T1555.003
  if:
    type: text
    regex: SELECT.{0,30}host_key.{0,30}encrypted_value.{0,30}FROM\s+moz_cookies
    case_insensitive: true
