defaults:
  platforms: [windows]
  for: [pe]
composite_rules:
  # Legacy credential-store targeting and NSS decryption in a process injector
  # distinguish this from an ordinary NSS user. Co-occurrence, not data flow.
  - id: native-signons-nss-injector-profile
    desc: Remote-thread injector with Firefox signons and NSS-decrypt references
    crit: hostile
    conf: 0.96
    attack: T1555.003
    all:
      - id: micro-behaviors/fs/path/password-store::firefox-legacy-signons-file
      - id: micro-behaviors/crypto/decrypt::nss-secret-decrypt-reference
      - id: micro-behaviors/dylib/lookup::get-proc-address-import
      - id: micro-behaviors/process/inject/runtime/call::remote-allocation-write-thread-api-references
    unless:
      - id: well-known/lib/crypto/nss/
      - id: well-known/lib/platform/wine/
