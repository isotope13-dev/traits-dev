defaults:
  platforms: [windows]
  for: [pe]
  attack: T1555.003
composite_rules:
  - id: go-multi-browser-credential-collection
    desc: Go collector queries Chromium logins, Firefox cookies, and decrypts Gecko logins
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/data/db/read/column::chromium-login-query-reference
      - id: micro-behaviors/data/db/read/records::moz-cookies-sql
      - id: micro-behaviors/crypto/decrypt/transform/unspecified::go-gecko-login-read-decrypt-calls

  - id: go-keylogging-stealer-gecko-login-decryption
    desc: Keylogging stealer with Gecko login decryption
    crit: hostile
    conf: 0.98
    all:
      - id: objectives/credential-access/browser/chromium::go-browser-login-query-with-keylogging
      - id: micro-behaviors/crypto/decrypt/transform/unspecified::go-gecko-login-read-decrypt-calls
      - id: micro-behaviors/data/db/read/column::firefox-nss-password-metadata-query
