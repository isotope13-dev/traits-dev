defaults:
  for: [powershell]
  platforms: [windows]
  conf: 0.97
  attack: T1557.001

composite_rules:
  # Separate the redirection from the already-detected hash formatting.
  # Requires response construction, delivery, and credential capture roles.
  - id: powershell-nbns-poisoning-ntlm-capture
    desc: Spoofed NBNS answers accompany NetNTLM credential capture
    crit: hostile
    all:
      - id: micro-behaviors/data/serialize/binary::powershell-nbns-answer-address
      - id: micro-behaviors/communications/socket/send/datagram::powershell-nbns-answer-send
      - id: objectives/credential-access/capture/network::powershell-netntlmv2-capture

  # LLMNR twin of the NBNS rule: forged multicast-name answers that steer the
  # victim's authentication to the spoofer, paired with NetNTLM hash capture.
  - id: powershell-llmnr-poisoning-ntlm-capture
    desc: Spoofed LLMNR answers accompany NetNTLM credential capture
    crit: hostile
    all:
      - id: micro-behaviors/data/serialize/binary::powershell-llmnr-answer-address
      - id: micro-behaviors/communications/socket/send/datagram::powershell-llmnr-answer-send
      - id: objectives/credential-access/capture/network::powershell-netntlmv2-capture
