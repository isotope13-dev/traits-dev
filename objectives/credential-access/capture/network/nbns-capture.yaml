defaults:
  for: [powershell]
  platforms: [windows]
  conf: 0.97

composite_rules:
  # Separate the redirection from the already-detected hash formatting.
  # Requires response construction, delivery, and credential capture roles.
  - id: powershell-nbns-poisoning-ntlm-capture
    desc: Spoofed NBNS answers accompany NetNTLM credential capture
    crit: hostile
    attack: T1557.001
    all:
      - id: micro-behaviors/data/serialize/binary::powershell-nbns-answer-address
      - id: micro-behaviors/communications/socket/send::powershell-nbns-answer-send
      - id: objectives/credential-access/capture/network::powershell-netntlmv2-capture
