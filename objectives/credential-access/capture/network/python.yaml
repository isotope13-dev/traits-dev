# Python that names Windows library and search-connector lure extensions
# and plants a UNC inside their <url> element is building an authentication-
# coercion file, not parsing a document the user already has.
defaults:
  platforms: [unix, windows]
  for: [python]
  attack: T1187
  crit: notable

composite_rules:
  - id: python-library-lure-unc-url
    desc: Library lure URL is a UNC path
    crit: hostile
    conf: 0.97
    scope: file
    all:
      - id: micro-behaviors/communications/http/webdav::python-library-and-search-connector
      - id: micro-behaviors/communications/http/webdav::python-url-element-unc
    # Operator tooling that takes credentials/hashes through Impacket's example
    # CLI helpers is a coercion assessment tool run by the tester, not an
    # implant planting lures on its own; keep it visible as suspicious.
    downgrade:
      scope: archive
      any:
        - id: metadata/import/python/impacket/examples/utils
