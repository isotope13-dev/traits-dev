# Offline forensic extraction and authorized audits remain plausible. These
# are suspicious capabilities, not hostile verdicts or BruteShark identities.
defaults:
  platforms: [unix, windows]
  for: [elf, macho, pe, dll]
  crit: suspicious
  conf: 0.92
  attack: T1040

composite_rules:
  - id: ntlm-wire-messages-with-response-record
    desc: NTLM challenge and response headers with cracking-record template
    # Same-file evidence supports a parser/serializer capability, not proof
    # that any specific session was captured or that output was exfiltrated.
    all:
      - id: micro-behaviors/os/security/auth/ntlm::challenge-message-header
      - id: micro-behaviors/os/security/auth/ntlm::authenticate-message-header
      - id: micro-behaviors/os/security/auth/ntlm::netntlm-record-template
  - id: pcap-with-kerberos-hash-output
    desc: Packet-capture APIs alongside crackable Kerberos output formats
    conf: 0.88
    # This requires packet-input evidence as well as standardized credential
    # formats. A format reader or ordinary packet monitor alone is insufficient.
    all:
      - id: micro-behaviors/communications/capture::pcap-packet-input
      - id: micro-behaviors/data/format/string::kerberos-roastable-hash-format
