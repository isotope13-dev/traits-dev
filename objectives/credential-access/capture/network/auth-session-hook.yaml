# Hooking an authentication daemon's accepted connections and handing those
# live descriptors to another process exposes authentication session traffic
# without requiring packet sniffing.
defaults:
  platforms: [linux]
  for: [c, cpp, elf, so]
  attack: T1056.004

composite_rules:
  # A ptrace writer that enumerates an authentication daemon and its memory
  # mappings is controlling the process, not merely debugging a generic PID.
  # Keep the target, maps walk, attach request, and remote-memory write as
  # separate structural legs so this covers renamed payloads and alternate
  # injector implementations without depending on one malware family.
  - id: authentication-daemon-ptrace-memory-injection
    desc: Injects into authentication daemon memory via ptrace
    crit: hostile
    conf: 0.995
    for: [c, cpp, rust, go]
    all:
      - id: micro-behaviors/fs/proc/info/path::auth-daemon-proc-comm-search
      - id: micro-behaviors/fs/proc/info/path::process-variable-pid-maps
      - id: micro-behaviors/process/attach/debugger::ptrace-attach-constant
      - id: micro-behaviors/process/inject/memory::ptrace-poke-source-call

  # Compiled injectors may lose source-level request names. An imported ptrace
  # API plus an embedded shared object, authentication-daemon enumeration, and
  # target map inspection retains the same high-confidence injection shape.
  - id: embedded-library-authentication-daemon-injection
    desc: Injects embedded shared object into authentication daemon
    crit: hostile
    conf: 0.995
    for: [elf]
    all:
      - id: micro-behaviors/fs/proc/info/path::auth-daemon-proc-comm-search
      - id: micro-behaviors/fs/proc/info/path::process-variable-pid-maps
      - id: micro-behaviors/os/syscall/invoke::ptrace-import
    any:
      - id: micro-behaviors/data/embedded/payload/native-elf::rodata-embedded-elf-dyn
      - id: micro-behaviors/data/embedded/payload/native-elf::rodata-embedded-elf32-le-dyn

  - id: authentication-daemon-accept-hook
    desc: Hooks authentication daemon connection acceptance
    crit: hostile
    conf: 0.99
    for: [c, cpp]
    all:
      - id: micro-behaviors/fs/proc/info/path::auth-daemon-proc-comm-search
      - id: micro-behaviors/process/hook/interception::posix-accept-interposition

  - id: authentication-session-descriptor-relay
    desc: Relays hooked authentication sessions to collector
    crit: hostile
    conf: 0.995
    for: [c, cpp]
    all:
      - id: authentication-daemon-accept-hook
      - id: micro-behaviors/communications/socket/handoff::unix-fd-handoff

  - id: binary-authentication-daemon-accept-hook
    desc: Binary hooks authentication daemon accepts
    crit: hostile
    conf: 0.995
    for: [elf, so]
    all:
      - id: micro-behaviors/fs/proc/info/path::auth-daemon-proc-comm-search
      - id: micro-behaviors/process/hook/interception::binary-accept-interposition

  - id: binary-authentication-session-relay
    desc: Binary relays hooked authentication sessions
    crit: hostile
    conf: 0.995
    for: [elf, so]
    all:
      - id: binary-authentication-daemon-accept-hook
      - id: micro-behaviors/process/hook/interception::binary-accept-sendmsg-relay
