# Authentication daemons see administrator credentials before downstream
# authorization and accounting. Hooking their accepted connections and handing
# those live descriptors to an out-of-process collector captures that trust
# boundary without requiring packet sniffing.
defaults:
  platforms: [linux]
  for: [c, cpp, elf, so]
  attack: T1056.003

composite_rules:
  - id: authentication-daemon-accept-hook
    desc: Hooks authentication daemon connection acceptance
    crit: hostile
    conf: 0.99
    for: [c, cpp]
    all:
      - id: micro-behaviors/fs/proc/info/path::auth-daemon-proc-comm-search
      - id: micro-behaviors/process/hook/interception::posix-accept-interposition

  - id: authentication-session-descriptor-relay
    desc: Relays hooked authentication sessions to collector
    crit: hostile
    conf: 0.995
    for: [c, cpp]
    all:
      - id: authentication-daemon-accept-hook
      - id: micro-behaviors/communications/socket/handoff::unix-fd-handoff

  - id: binary-authentication-daemon-accept-hook
    desc: Binary hooks authentication daemon accepts
    crit: hostile
    conf: 0.995
    for: [elf, so]
    all:
      - id: micro-behaviors/fs/proc/info/path::auth-daemon-proc-comm-search
      - id: micro-behaviors/process/hook/interception::binary-accept-interposition

  - id: binary-authentication-session-relay
    desc: Binary relays hooked authentication sessions
    crit: hostile
    conf: 0.995
    for: [elf, so]
    all:
      - id: binary-authentication-daemon-accept-hook
      - id: micro-behaviors/process/hook/interception::binary-accept-sendmsg-relay
