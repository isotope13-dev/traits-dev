# Hooking an authentication daemon's accepted connections and handing those
# live descriptors to another process exposes authentication session traffic
# without requiring packet sniffing.
defaults:
  crit: hostile
  platforms: [linux]
  for: [c, cpp, elf, so]
  attack: T1056.004

composite_rules:
  # Compiled injectors may lose source-level request names. An imported ptrace
  # API plus an embedded shared object, authentication-daemon enumeration, and
  # target map inspection retains the same high-confidence injection shape.
  - id: embedded-library-authentication-daemon-injection
    desc: Injects embedded shared object into authentication daemon
    conf: 0.995
    for: [elf]
    all:
      - id: micro-behaviors/fs/proc/info/path::auth-daemon-proc-comm-references
      - id: micro-behaviors/fs/proc/memory::process-variable-pid-maps
      - id: micro-behaviors/os/syscall/invoke::ptrace-import
    any:
      - id: micro-behaviors/data/embedded/payload/elf-native::rodata-embedded-elf-dyn
      - id: micro-behaviors/data/embedded/payload/elf-native::rodata-embedded-elf32-le-dyn

  - id: authentication-daemon-accept-hook
    desc: Attempts authentication daemon accept hooking
    conf: 0.99
    for: [c, cpp]
    all:
      - id: micro-behaviors/fs/proc/info/path::auth-daemon-proc-comm-references
      - id: micro-behaviors/process/hook/interception::posix-accept-interposition

  - id: authentication-session-descriptor-relay
    desc: Relays hooked authentication sessions to collector
    conf: 0.995
    for: [c, cpp]
    all:
      - id: authentication-daemon-accept-hook
      - id: micro-behaviors/communications/socket/handoff::unix-fd-handoff
