defaults:
  platforms: [unix]
  for: [c, cpp]

composite_rules:
  # The selectors identify the public IP, system IP and assessed AES-256 key
  # field. This establishes targeted parsing in a plaintext interposer, not
  # proof that every matching program steals or transmits a key.
  - id: sdwan-control-key-interposition
    desc: SD-WAN key parsing inside TLS interposer
    crit: suspicious
    conf: 0.97
    attack: T1557
    all:
      - id: micro-behaviors/process/hook/interception::openssl-read-interposition
      - id: micro-behaviors/data/parse/binary::sdwan-control-key-field-parser
