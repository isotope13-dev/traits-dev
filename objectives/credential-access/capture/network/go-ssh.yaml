defaults:
  platforms: [linux]
  for: [elf, go]
  attack: T1056.003

traits:
  - id: go-ssh-credential-record
    desc: Go SSH key and password record
    crit: component
    conf: 0.99
    if:
      type: text
      regex: '(?i)privatekey string; username string; ip string; password string'

  - id: go-ssh-credential-attack-queue
    desc: Go credential attack-queue identifier
    crit: component
    conf: 0.97
    if:
      type: text
      exact: attackqueue

composite_rules:
  - id: go-ssh-server-credential-capture
    desc: Go SSH server queues submitted passwords and private keys
    crit: suspicious
    conf: 0.99
    all:
      - id: go-ssh-credential-record
      - id: go-ssh-credential-attack-queue
      - id: micro-behaviors/communications/ssh/server::go-ssh-server-implementation
