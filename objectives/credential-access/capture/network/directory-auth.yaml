# Packet capture pointed at the ports directory authentication rides on. LDAP
# simple binds and Kerberos pre-auth carry credential material, so a capture
# filtered to 389/88 and written to a file is a credential collection step, not
# a bandwidth investigation.
defaults:
  platforms: [unix]
  for: [shell, python, javascript, go, ruby, perl, c]
  attack: T1040
  mbc: E1040

composite_rules:
  - id: directory-auth-traffic-capture
    desc: Packet capture aimed at directory auth
    crit: suspicious
    conf: 0.93
    all:
      - id: micro-behaviors/communications/capture/tcpdump::tcpdump-write-capture-file
    any:
      - id: micro-behaviors/communications/capture/tcpdump::bpf-filter-ldap-port
      - id: micro-behaviors/communications/capture/tcpdump::bpf-filter-kerberos-port
    needs: 1

  - id: rotating-directory-auth-capture
    desc: Detached rotating capture of directory authentication
    crit: hostile
    conf: 0.95
    all:
      - id: directory-auth-traffic-capture
      - id: micro-behaviors/process/daemonize/detach::nohup-command
      - id: micro-behaviors/communications/capture/tcpdump::tcpdump-ring-file-rotation
