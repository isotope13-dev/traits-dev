# Credential harvesting that reads the kernel TCP table and looks for HTTP
# Basic Authorization / Cookie header tokens, typically writing captures to a
# hidden /tmp path. Used by IoT/Linux bots that turn edge devices into
# opportunistic credential sniffers without a promiscuous capture stack.
defaults:
  platforms: [unix, android]
  for: [c, cpp, rust, go, elf, shell, python]
  attack: T1040,T1557
  mbc: C0001

composite_rules:
  - id: procfs-http-credential-harvest
    desc: Harvests HTTP Basic/Cookie credentials via /proc/net/tcp
    crit: hostile
    conf: 0.97
    attack: T1040,T1557.002
    all:
      - id: micro-behaviors/fs/proc/info/path::proc-net-tcp
      - id: micro-behaviors/fs/path/temp::hidden-tmp-path
    any:
      - id: micro-behaviors/communications/http/sniff::authorization-basic-header-token
      - id: micro-behaviors/communications/http/sniff::cookie-request-header-token
    near_bytes: 2400
