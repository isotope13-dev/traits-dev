# Rogue DHCPv6 DNS takeover (mitm6 technique). Windows prefers IPv6 and asks
# for DHCPv6 by default; answering those requests with the attacker as DNS
# server, then forging DNS answers, steers victims' WPAD, SMB, and LDAP
# authentication to the attacker for NTLM relay or capture.
defaults:
  platforms: [windows, unix]
  for: [python]
  attack: T1557.003
  mbc: none

composite_rules:
  - id: rogue-dhcpv6-dns-takeover
    desc: Rogue DHCPv6 server assigns itself as DNS and forges DNS answers
    crit: hostile
    conf: 0.95
    all:
      - id: micro-behaviors/communications/socket/udp::scapy-dhcpv6-server-response
      - id: micro-behaviors/communications/socket/udp::scapy-dhcpv6-dns-server-option
      - id: micro-behaviors/communications/dns/raw::scapy-dns-response-construction
