defaults:
  platforms: [unix, windows]
  for: [python, javascript, typescript, ruby]
  crit: suspicious
  conf: 0.96
  attack: T1539

composite_rules:
  - id: websocket-base-event-leak-probe
    desc: Sends base event to /ws and checks received text for missing-method errors
    all:
      - id: micro-behaviors/communications/websocket/send::base-event-send
      - id: micro-behaviors/communications/websocket/endpoints::root-ws-endpoint
      - id: micro-behaviors/data/control-flow/error-handling::missing-method-error-check
      - id: micro-behaviors/communications/websocket/receive/

  - id: websocket-exception-session-cookie-scrape
    desc: WebSocket receive with missing-method checks and session-cookie extraction
    # Co-occurrence, not a claim that static analysis proves value flow.
    all:
      - id: micro-behaviors/communications/websocket/receive/
      - id: micro-behaviors/data/control-flow/error-handling::missing-method-error-check
      - id: micro-behaviors/data/parse/regex::session-cookie-regex-extraction
