defaults:
  platforms: [unix]
  for: [perl]
  crit: notable

traits:
  - id: plaintext-user-command-pattern
    desc: Matches plaintext USER command
    if:
      type: text
      substr: '/^USER\ '
      exclude_comments: true
  - id: plaintext-pass-command-pattern
    desc: Matches plaintext PASS command
    if:
      type: text
      substr: '/^PASS '
      exclude_comments: true
  - id: plaintext-imap-login-pattern
    desc: Matches plaintext IMAP LOGIN command
    if:
      type: text
      substr: '/LOGIN ([^\s]+) ([^\s]+)'
      exclude_comments: true

composite_rules:
  - id: plaintext-login-log-parser
    desc: Matches plaintext login command patterns
    all:
      - id: plaintext-user-command-pattern
      - id: plaintext-pass-command-pattern
      - id: plaintext-imap-login-pattern
