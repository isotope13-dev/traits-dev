# The notification Address is actively rendered by a desktop client. A remote
# file URL through the Windows WebDAV redirector can negotiate NTLM credentials.
# Bind the URL to its PopWindow section; a URL in a comment or another section
# is insufficient. This is suspicious because an intranet deployment may be valid.
defaults:
  for: [text, python, powershell, cpp]
  platforms: [windows]
  attack: T1187
traits:
  - id: notification-popup-webdav-authentication
    desc: Popup WebDAV rendering risks NTLM disclosure
    crit: suspicious
    conf: 0.95
    if:
      type: yara
      source: |
        rule notification_popup_webdav_authentication {
          meta:
            filetypes = "text,python,powershell,cpp"
          strings:
            $popup = /(^|\n)[ \t]*\[PopWindow[0-9]+\][^\[]{0,2048}/ nocase
            $address = /\n[ \t]*Address[ \t]*=[ \t]*["']?file:\/\/[a-zA-Z0-9][a-zA-Z0-9.@_-]{0,252}\/DavWWWRoot\/[^\r\n"' \t]+/ nocase
            $local = /\n[ \t]*Address[ \t]*=[ \t]*["']?file:\/\/(localhost\.?|127\.[0-9.]+|0\.0\.0\.0)(@[a-zA-Z0-9]+){0,2}\// nocase
          condition:
            for any p in (1..#popup) : (
              for any a in (1..#address) : (
                not for any l in (1..#local) : (@local[l] == @address[a]) and
                @address[a] >= @popup[p] and
                @address[a] + !address[a] <= @popup[p] + !popup[p]
              )
            )
        }
