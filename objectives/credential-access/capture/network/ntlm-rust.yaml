defaults:
  platforms: [unix, windows]
  for: [rust]

traits:
  - id: rust-netntlmv2-type3-extraction
    desc: Rust extracts NetNTLMv2 Type 3 credentials
    crit: notable
    conf: 0.98
    if:
      type: symbol
      kind: call
      exact: netntlmv2_from_type3

  - id: rust-smb-capture-entrypoint
    desc: Rust exposes an SMB capture entrypoint
    crit: notable
    conf: 0.98
    if:
      type: symbol
      kind: function
      exact: capture

composite_rules:
  - id: rust-smb-netntlmv2-capture
    desc: Rust SMB server captures NetNTLMv2 credentials
    crit: hostile
    conf: 0.99
    all:
      - id: rust-netntlmv2-type3-extraction
      - id: rust-smb-capture-entrypoint
