defaults:
  platforms: [unix, windows]
  for: [rust]

traits:
  - id: rust-netntlmv2-type3-extraction
    desc: Rust extracts NetNTLMv2 from Type 3
    crit: notable
    conf: 0.98
    if:
      type: symbol
      kind: call
      exact: netntlmv2_from_type3

  - id: rust-smb-capture-listener
    desc: Capture function binds listener socket
    crit: notable
    conf: 0.98
    if:
      type: text
      regex: 'pub async fn capture(?s:.){0,400}TcpListener::bind'

composite_rules:
  - id: rust-smb-netntlmv2-capture
    desc: Rust SMB server captures NetNTLMv2 credentials
    crit: notable
    conf: 0.99
    all:
      - id: rust-netntlmv2-type3-extraction
      - id: rust-smb-capture-listener
