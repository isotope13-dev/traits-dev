# Local malware can rewrite a trusted application's service endpoint to a
# loopback listener, then collect credentials that the trusted client sends to
# its expected service. The generalized rule keys on the preference operation,
# local listener, Authorization framing, and credential persistence rather
# than a product or proof-of-concept name.
defaults:
  crit: hostile
  conf: 0.99
  platforms: [macos]
  for: [scripts, binaries]
  attack: T1557,T1528

composite_rules:
  - id: loopback-endpoint-bearer-token-capture
    desc: Rewrites an app endpoint and stores bearer credentials from a local listener
    all:
      - id: micro-behaviors/fs/config/preferences::defaults-loopback-service-endpoint-write
      - id: micro-behaviors/communications/socket/listen/
      - id: micro-behaviors/communications/http/authorization-header::bearer-prefix
      - id: micro-behaviors/fs/write/credential/

  - id: muse-dictation-endpoint-bearer-interception
    desc: Redirects Muse dictation to a local bearer-intercepting listener
    all:
      - id: well-known/app/ai/assistant/meta-muse::dictation-endpoint-preference
      - id: micro-behaviors/fs/config/preferences::defaults-loopback-service-endpoint-write
      - id: micro-behaviors/communications/socket/listen/
      - id: micro-behaviors/communications/http/authorization-header::bearer-prefix
