defaults:
  platforms: [windows, linux, macos]
  for: [javascript, typescript]

traits:
  - id: dynamic-login-url-path-value
    desc: Login URL path contains a dynamic value
    crit: notable
    conf: 0.91
    if:
      type: text
      regex: '/(login|authenticate)/\\?\$\{[A-Za-z_$][A-Za-z0-9_$]*\}'

composite_rules:
  - id: private-key-in-login-url-path
    desc: Private-key form sends its value in a login URL path
    crit: suspicious
    conf: 0.95
    attack: T1056.002
    all:
      - id: dynamic-login-url-path-value
      - id: objectives/credential-access/phishing/credential::vscode-private-key-password-field
