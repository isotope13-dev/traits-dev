defaults:
  platforms: [windows]
  for: [powershell, csharp]
  attack: T1187,T1557.001

composite_rules:
  - id: loopback-webdav-ntlm-coercion
    desc: Local NTLM listener alongside forced WebDAV authentication
    crit: suspicious
    conf: 0.97
    near_lines: 40
    all:
      - id: micro-behaviors/communications/http/server/managed::loopback-httplistener
      - id: micro-behaviors/communications/http/webdav::net-use-loopback-http-share
      - id: micro-behaviors/communications/http/auth::http-ntlm-auth-header

  - id: loopback-webdav-ntlm-credential-capture
    desc: Forces local NTLM authentication and records authorization material
    crit: hostile
    conf: 0.98
    near_lines: 40
    all:
      - id: loopback-webdav-ntlm-coercion
      - id: micro-behaviors/fs/write/credential::store-request-authorization
