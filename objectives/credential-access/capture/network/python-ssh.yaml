defaults:
  platforms: [unix, windows]
  for: [python, text]
  attack: T1552.004,T1041

traits:
  - id: python-ssh-credential-log
    desc: Python logs SSH credentials
    crit: suspicious
    conf: 0.98
    if:
      type: text
      regex: '(?is)log\s*\(\s*\{.{0,240}(pkey|private_key|password).{0,240}\}\s*\)'
    unless:
      - id: metadata/package/testing/presence/harness::test-directory-path

composite_rules:
  - id: python-ssh-credential-capture
    desc: Python captures and logs SSH credentials
    crit: hostile
    conf: 0.995
    all:
      - id: python-ssh-credential-log
    any:
      - id: micro-behaviors/communications/ssh/client::paramiko-private-key-file-load
      - id: micro-behaviors/communications/ssh/client::paramiko-password-connect-call
