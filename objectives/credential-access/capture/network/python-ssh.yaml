defaults:
  platforms: [unix, windows]
  for: [python, text]
  attack: T1552.004,T1041

traits:
  - id: python-ssh-private-key-file-read
    desc: Python reads an SSH private key file
    crit: suspicious
    conf: 0.97
    if:
      type: text
      substr: from_private_key_file
  - id: python-ssh-password-connect
    desc: Python connects SSH with password
    crit: suspicious
    conf: 0.97
    if:
      type: text
      regex: '\bssh_client\.connect\([^\n]{0,180}\bpassword\s*='
  - id: python-ssh-credential-log
    desc: Python logs SSH credentials
    crit: suspicious
    conf: 0.98
    if:
      type: text
      regex: '(?is)log\s*\(\s*\{.{0,240}(pkey|private_key|password).{0,240}\}\s*\)'

composite_rules:
  - id: python-ssh-credential-capture
    desc: Python captures and logs SSH credentials
    crit: hostile
    conf: 0.995
    all:
      - id: python-ssh-credential-log
    any:
      - id: python-ssh-private-key-file-read
      - id: python-ssh-password-connect
