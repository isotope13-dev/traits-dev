defaults:
  for:
  - powershell
  platforms:
  - windows
  crit: notable
  conf: 0.98
traits:
- id: ntlmv2-cracking-record-queue
  desc: Queues a captured NetNTLMv2 hash for cracking
  if:
    type: text
    substr: $inveigh.NTLMv2_list.Add($NTLMv2_hash)
- id: ntlmv2-cracking-record-build
  desc: Builds a NetNTLMv2 cracking record
  if:
    type: text
    substr: $NTLM_user_string + "::" + $NTLM_domain_string
- id: http-ntlmv2-cracking-record-queue
  desc: Queues an HTTP NetNTLMv2 cracking record
  if:
    type: text
    substr: $inveigh.NTLMv2_list.Add($HTTP_NTLM_hash)
- id: http-ntlmv2-cracking-record-build
  desc: Builds an HTTP NetNTLMv2 cracking record
  if:
    type: text
    substr: $HTTP_NTLM_user_string + "::" + $HTTP_NTLM_domain_string
composite_rules:
- id: powershell-netntlmv2-capture
  desc: Captures and queues NetNTLMv2 hashes
  crit: hostile
  all:
  - id: ntlmv2-cracking-record-queue
  - id: ntlmv2-cracking-record-build
  - id: micro-behaviors/os/security/auth/ntlm::ntlmssp-marker
- id: powershell-http-netntlmv2-capture
  desc: Captures and queues HTTP NetNTLMv2 hashes
  crit: hostile
  all:
  - id: http-ntlmv2-cracking-record-queue
  - id: http-ntlmv2-cracking-record-build
  - id: micro-behaviors/os/security/auth/ntlm::ntlmssp-marker
