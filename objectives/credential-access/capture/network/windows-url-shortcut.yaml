# A Windows Internet Shortcut that resolves a file: URL on an external-IP
# share causes the shell to negotiate remote authentication when the victim
# opens it. The remote file's type is irrelevant to credential coercion, so
# this objective intentionally composes the shortcut header with the generic
# external-share target rather than depending on one payload extension, path,
# campaign hostname, or collector-assigned filename.
defaults:
  platforms: [windows]
  for: [text]

composite_rules:
  - id: external-share-url-shortcut-auth-coercion
    desc: External-share shortcut coerces authentication
    crit: hostile
    conf: 0.97
    attack: T1187
    all:
      - id: metadata/file/format/structured::windows-internet-shortcut-header
      - id: objectives/command-and-control/dropper/delivery/url-shortcut::url-shortcut-remote-share-ip-target
