defaults:
  platforms: [unix, windows]
  for: [scripts, binaries, go]

traits:
  - id: rakp-hashcat-mode
    desc: Hashcat command uses RAKP mode
    crit: suspicious
    conf: 0.98
    if:
      type: text
      regex: '(?i)\bhashcat\b.{0,40}\b7300\b'

  - id: rakp-john-format
    desc: RAKP hash format output
    crit: suspicious
    conf: 0.97
    if:
      type: text
      regex: '\$rakp\$'

  # The two hex-formatted-HMAC-SHA1 atoms that used to live here observed no
  # RAKP, IPMI, RMCP+ or port-623 evidence at all -- only an HMAC-SHA1 token
  # near a printf hex conversion, which is how any HMAC test-vector printer or
  # OTP implementation looks. They are now neutral crypto-formatting atoms in
  # micro-behaviors/crypto/hash/hmac; the cracking composite below supplies the
  # RAKP intent by pairing them with the RAKP capture chain.

composite_rules:
  - id: ipmi-rakp-preauth-hash-retrieval
    desc: Retrieves an IPMI RAKP HMAC-SHA1 response before authentication
    crit: hostile
    conf: 0.99
    all:
      - id: micro-behaviors/communications/socket/udp::ipmi-udp-port-623
      - id: micro-behaviors/communications/socket/udp::rmcp-plus-protocol-marker
      - id: micro-behaviors/communications/socket/udp::rakp-message-marker
      - id: micro-behaviors/communications/socket/udp::ipmi-session-open-builder
      - id: micro-behaviors/communications/socket/udp::ipmi-rakp1-builder
      - id: micro-behaviors/communications/socket/udp::ipmi-rakp2-parser
      - id: micro-behaviors/crypto/hash/hmac::hmac-sha1-operation

  - id: ipmi-rakp-offline-cracking
    desc: Cracks captured IPMI RAKP password material offline
    crit: hostile
    conf: 0.99
    all:
      - id: ipmi-rakp-preauth-hash-retrieval
    any:
      - id: rakp-hashcat-mode
      - id: rakp-john-format
      # Emitting the captured digest as hex is the other way a RAKP tool hands
      # the material to a cracker.
      - id: micro-behaviors/crypto/hash/hmac::hmac-sha1-label-before-hex-format
      - id: micro-behaviors/crypto/hash/hmac::hex-format-before-hmac-sha1-label
