defaults:
  for: [powershell]
  platforms: [windows]
  crit: notable
  conf: 0.98
composite_rules:
  # The spoof loop without the reflection half: the same header, ID
  # assignments, send, and paired brute-force loops, but no local SMB
  # reflection leg, so it stays suspicious rather than hostile.
  - id: nbns-poisoning-loop
    desc: Loops NBNS responses with guessed transaction IDs
    crit: suspicious
    conf: 0.93
    near_lines: 30
    all:
      - id: micro-behaviors/data/serialize/binary::powershell-nbns-answer-header
      - id: micro-behaviors/data/property/assign::nbns-response-transaction-id-assignments
      - id: micro-behaviors/communications/socket/send::powershell-nbns-answer-send
      - id: micro-behaviors/data/arithmetic::powershell-paired-lt-255-comparisons
    unless:
      # Test and research contexts only. Tool-context suppressors are
      # deliberately absent: a skeleton carrying tool DNA (function name
      # plus relay-command line, as in Tater/Inveigh fragments) is exactly
      # what this rule must still catch.
      - id: metadata/package/testing/corpus/
      - id: metadata/package/testing/presence/harness/
      - id: metadata/path::test-directory-component
  - id: nbns-poisoning-staged
    desc: Stages NBNS response poisoning without delivery
    crit: suspicious
    conf: 0.9
    near_lines: 30
    all:
      - id: micro-behaviors/data/serialize/binary::powershell-nbns-answer-header
      - id: micro-behaviors/data/property/assign::nbns-response-transaction-id-assignments
      - id: micro-behaviors/data/arithmetic::powershell-paired-lt-255-comparisons
    unless:
      # The delivery leg lives in the sibling loop rule: once the packet is
      # sent, that finding carries the verdict and this staged form stays
      # silent, so one poisoning story is not counted twice.
      - id: micro-behaviors/communications/socket/send::powershell-nbns-answer-send
      - id: metadata/package/testing/corpus/
      - id: metadata/package/testing/presence/harness/
      - id: metadata/path::test-directory-component
  - id: nbns-poisoning-for-ntlm-reflection
    desc: Poisons name resolution with guessed NBNS IDs for NTLM reflection
    crit: hostile
    all:
      - id: micro-behaviors/data/serialize/binary::powershell-nbns-answer-header
      - id: micro-behaviors/data/property/assign::nbns-response-transaction-id-assignments
      - id: micro-behaviors/communications/socket/send::powershell-nbns-answer-send
      - id: micro-behaviors/data/arithmetic::powershell-paired-lt-255-comparisons
      - id: objectives/privilege-escalation/exploit/network-service::powershell-local-smb-ntlm-reflection
