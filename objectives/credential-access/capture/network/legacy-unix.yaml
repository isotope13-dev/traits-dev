defaults:
  platforms: [unix]
  for: [c]
  crit: suspicious
  conf: 0.88
  attack: T1040
  mbc: C0010
traits:
  - id: nit-device
    desc: Uses legacy NIT capture device
    crit: suspicious
    conf: 0.9
    if:
      type: string_literal
      exact: /dev/nit
    unless:
      - id: well-known/tool/offensive/nmap::nmap-source-tree
      - id: well-known/lib/network/libpcap::libpcap-source-tree
  - id: promiscuous-capture-flag
    desc: Enables NI_PROMISC capture mode
    crit: suspicious
    conf: 0.92
    if:
      type: text
      substr: NI_PROMISC
    unless:
      - id: metadata/lang/upstream::linux-kernel-primary-tree-path
      - id: well-known/tool/offensive/nmap::nmap-source-tree
      - id: well-known/lib/network/libpcap::libpcap-source-tree
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-source-context
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-spdx-source-context
  - id: nit-bind-ioctl
    desc: Binds interface with NIOCBIND
    crit: suspicious
    conf: 0.9
    if:
      type: text
      substr: NIOCBIND
    unless:
      - id: well-known/tool/offensive/nmap::nmap-source-tree
      - id: well-known/lib/network/libpcap::libpcap-source-tree
  - id: login-service-decoder
    desc: Maps plaintext login service ports
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: IPPORT_(LOGINSERVER|TELNET|SMTP|FTP)
  - id: tcp-log-banner
    desc: Emits TCP session log banner
    crit: suspicious
    conf: 0.92
    if:
      type: text
      substr: 'TCP/IP LOG -- TM:'
  - id: linsniffer-logfile-reference
    desc: References linsniffer tcp.log session file
    crit: notable
    conf: 0.90
    for: [c, shell, text]
    if:
      type: text
      regex: '\btcp\.log\b'
composite_rules:
  - id: legacy-nit-sniffer
    desc: Promiscuous STREAMS network sniffer
    crit: suspicious
    conf: 0.95
    needs: 3
    any:
      - id: nit-device
      - id: promiscuous-capture-flag
      - id: nit-bind-ioctl
      - id: tcp-log-banner
    unless:
      - id: well-known/tool/offensive/nmap::nmap-source-tree
      - id: well-known/lib/network/libpcap::libpcap-source-tree
  - id: plaintext-credential-sniffer
    desc: Sniffer targets plaintext login traffic
    crit: hostile
    conf: 0.97
    all:
      - id: legacy-nit-sniffer
      - id: login-service-decoder
  - id: linsniffer-session-sniffing
    desc: Sniffs network sessions to linsniffer log
    crit: hostile
    conf: 0.98
    for: [shell, text]
    all:
      - id: well-known/tool/offensive/linsniffer::linsniffer-tool-name
      - id: linsniffer-logfile-reference
  - id: linsniffer-lifecycle-runner
    desc: Purges and launches linsniffer sniffer process
    crit: hostile
    conf: 0.99
    attack: T1040,T1070.004
    for: [shell, text]
    all:
      - id: well-known/tool/offensive/linsniffer::linsniffer-tool-name
      - id: micro-behaviors/fs/delete/file/command::rm-local-named-file
      - id: micro-behaviors/fs/write/file/redirect::local-program-output-redirect
