defaults:
  platforms: [windows]
  for: [html]
  attack: T1187

composite_rules:
  - id: html-refresh-forces-remote-share-connection
    desc: HTML refresh forces connection to remote share
    crit: hostile
    conf: 0.92
    size_max: 4096
    all:
      - id: micro-behaviors/ui/window/navigation::meta-refresh-instant-file-url
      - id: micro-behaviors/communications/url/scheme::file-url-raw-ip-host
