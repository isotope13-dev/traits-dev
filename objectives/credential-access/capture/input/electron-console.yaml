# BIP-39 package paths and serialized seed fields establish the credential
# type without depending on translated UI text, wallet brands or relay tags.
defaults:
  platforms: [linux, macos, windows]
  for: [scripts, binaries, typescript, go, rust]
  conf: 0.97
  attack: T1056

composite_rules:
  - id: electron-recovery-seed-console-capture
    desc: Electron console relay captures recovery seeds
    crit: suspicious
    near_bytes: 24000
    all:
      - id: micro-behaviors/crypto/mnemonic::bip39-package-path-literal
      - id: micro-behaviors/communications/ipc/message::electron-console-message-listener
      - id: micro-behaviors/os/console/io::serialized-seed-console-emission
      - id: micro-behaviors/data/parse/json::parsed-seed-callback-dispatch
