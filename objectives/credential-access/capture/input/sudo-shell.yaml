defaults:
  platforms: [unix]
  for: [shell]
  attack: T1056
composite_rules:
  - id: sudo-shell-password-interception
    desc: sudo function prompts, logs credentials and forwards authentication
    crit: hostile
    conf: 0.98
    near_bytes: 600
    all:
      - id: micro-behaviors/process/hook/interception::shell-sudo-function-definition
      - id: micro-behaviors/ui/dialog/prompt::shell-read-sudo-password-prompt
      - id: micro-behaviors/fs/write/credential::shell-user-password-pair-append
      - id: micro-behaviors/process/create/sudo::sudo-stdin-password
