defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, chrome-manifest, crx, xpi, zip, npm]
  attack: T1056.003

composite_rules:
  - id: remote-controlled-extension-password-capture
    desc: Remotely controlled extension captures page password values
    crit: hostile
    conf: 0.97
    scope: archive
    # Actual password .value capture, plus all-site content injection and an
    # existing interactive remote-control channel. This does not allege that
    # a particular POST body contains the password: IPC/HTTP data flow across
    # separate members and helper functions is not established by these legs.
    all:
      - id: micro-behaviors/ui/window/form-input::password-input-value-returned-in-record
      - id: metadata/permission/host::content-script-all-urls
      - id: micro-behaviors/communications/ipc/message::chrome-runtime-send-message
      - id: objectives/command-and-control/remote-command/extension::extension-websocket-browser-remote-control
