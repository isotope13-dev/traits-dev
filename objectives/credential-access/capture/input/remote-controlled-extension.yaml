defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, chrome-manifest, crx, xpi, zip, npm]
  attack: T1056.003

composite_rules:
  # This is the source side of a locally saved account record. It establishes
  # that the password is read and placed in extension IPC, without yet
  # claiming where the worker sends it.
  - id: saved-login-password-forwarded-to-runtime
    desc: Forwards a saved login password to extension runtime
    crit: component
    conf: 0.98
    for: [javascript, typescript]
    near_bytes: 1800
    all:
      - id: objectives/credential-access/capture/input::extension-reads-saved-login-password
      - id: micro-behaviors/communications/ipc/extension-message::profile-password-record-sent-over-runtime

  - id: remote-controlled-extension-password-capture
    desc: Remotely controlled extension captures page password values
    crit: hostile
    conf: 0.97
    scope: archive
    # Actual password .value capture, plus all-site content injection and an
    # existing interactive remote-control channel. This does not allege that
    # a particular POST body contains the password: IPC/HTTP data flow across
    # separate members and helper functions is not established by these legs.
    all:
      - id: micro-behaviors/ui/window/form-input::password-input-value-returned-in-record
      - id: metadata/permission/dom::content-script-all-urls
      - id: micro-behaviors/communications/ipc/extension-message::chrome-runtime-send-message
      - id: objectives/command-and-control/remote-command/extension::extension-websocket-browser-remote-control

traits:
  - id: extension-reads-saved-login-password
    desc: Reads login password from extension storage
    crit: component
    conf: 0.98
    for: [javascript, typescript]
    if:
      type: text
      regex: 'chrome\.storage\.local\.get\(\["loginData"[\s\S]{0,220}\.loginData\.pass'
