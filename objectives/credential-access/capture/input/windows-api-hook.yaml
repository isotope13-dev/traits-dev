# ATT&CK T1056.004 — Credential API Hooking.
#
# Rewriting the prologue of a Windows authentication function inside the process
# that calls it puts attacker code between the user and the credential: the
# replacement sees the plaintext password, the logon token, or the freshly
# signed WebAuthn assertion, and the caller still gets the normal result, so
# nothing looks wrong to the user. Nothing legitimate needs that combination —
# authentication vendors extend Windows through credential providers, security
# support providers and authentication packages, all of which are registered
# with the OS rather than patched into it at runtime.
#
# Both legs are deliberately mechanic-agnostic and target-agnostic: any hooking
# library (Detours, MinHook, hand-rolled IAT or prologue patch) crossed with any
# credential-validation entry point (LSA logon, the NTLM password validator, the
# CredUI prompt, the OS WebAuthn assertion call).
defaults:
  platforms: [windows]
  for: [pe, dll, c, cpp]
  attack: T1056.004
  mbc: F0015

composite_rules:
  - id: windows-credential-api-inline-hook
    desc: Hooks a Windows credential-validation API in-process
    crit: hostile
    conf: 0.95
    all:
      - id: micro-behaviors/process/hook/interception::windows-inline-hook-mechanic
      - id: micro-behaviors/os/security/auth/verify::windows-authentication-entry-point
    unless:
      # Instrumentation and endpoint-security products hook by trade; their
      # identity is established elsewhere in the corpus.
      - id: well-known/tool/reverse-engineering/
      - id: well-known/app/security/
