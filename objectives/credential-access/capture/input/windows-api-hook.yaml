# ATT&CK T1056.004 — Credential API Hooking.
#
# Rewriting the prologue of a Windows authentication function inside the process
# that calls it can intercept credentials. Co-occurring hook and authentication
# API evidence does not establish that the hook targets a particular API.
#
# Both legs are deliberately mechanic-agnostic and target-agnostic: any hooking
# library (Detours, MinHook, hand-rolled IAT or prologue patch) crossed with any
# credential-validation entry point (LSA logon, the NTLM password validator, the
# CredUI prompt, the OS WebAuthn assertion call).
defaults:
  platforms: [windows]
  for: [pe, dll, c, cpp]
  attack: T1056.004
  mbc: F0015

composite_rules:
  - id: windows-credential-api-inline-hook
    desc: Windows auth API and inline-hook evidence
    crit: hostile
    conf: 0.95
    all:
      - id: micro-behaviors/process/hook/interception::windows-inline-hook-mechanic
      - id: micro-behaviors/os/security/auth/verify::windows-authentication-entry-point
