defaults:
  for:
  - javascript
  - typescript
  platforms:
  - windows
  - linux
  - macos
traits:
- id: wallet-password-hook-callback
  desc: Seed-file hook copies password to callback
  crit: suspicious
  conf: 0.98
  if:
    type: tree-sitter
    query: "((assignment_expression\n left: (member_expression property: (property_identifier) @method)\n right: (function_expression\n  parameters: (formal_parameters (identifier) @password)\n  body: (statement_block\n   (if_statement consequence: (statement_block\n    (expression_statement (assignment_expression\n     left: (identifier) @stash\n     right: (call_expression function: (identifier) @convert\n      arguments: (arguments (identifier) @source))))\n    (expression_statement (call_expression\n     arguments: (arguments (_) (object\n      (pair key: (property_identifier) @field value: (identifier) @sent)))))))))) @hook\n (#eq? @method \"getSeedFile\")\n (#eq? @convert \"String\")\n (#eq? @password @source)\n (#eq? @stash @sent)\n (#eq? @field \"pw\"))"
- id: wallet-mnemonic-hook-callback
  desc: Recovery hook copies mnemonic to callback
  crit: suspicious
  conf: 0.98
  if:
    type: tree-sitter
    query: "((assignment_expression\n left: (member_expression property: (property_identifier) @method)\n right: (function_expression\n  parameters: (formal_parameters (identifier) @mnemonic)\n  body: (statement_block\n   (expression_statement (assignment_expression\n    left: (identifier) @stash\n    right: (call_expression function: (identifier) @convert\n     arguments: (arguments (binary_expression left: (identifier) @source)))))\n   (expression_statement (call_expression\n    arguments: (arguments (_) (object\n     (pair key: (property_identifier) @field value: (identifier) @sent)))))))) @hook\n (#match? @method \"^(createFromMnemonicRecoveryPhrase|recoverWalletFromMnemonic)$\")\n (#eq? @convert \"String\")\n (#eq? @mnemonic @source)\n (#eq? @stash @sent)\n (#eq? @field \"mn\"))"
composite_rules:
- id: wallet-live-secrets-hook-export
  desc: Wallet secret hook with fixed-host JSON POST
  crit: hostile
  conf: 0.99
  attack: T1056
  all:
  - id: micro-behaviors/data/serialize/schema-credential::wallet-secret-record-fields
  - id: micro-behaviors/communications/http/request/json::node-host-user-hardcoded-post-script
  any:
  - id: wallet-password-hook-callback
  - id: wallet-mnemonic-hook-callback
