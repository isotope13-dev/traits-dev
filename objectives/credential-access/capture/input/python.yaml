defaults:
  platforms: [windows, unix]
  for: [python]

composite_rules:
  # A CLI credential prompt that posts with a hardcoded Discord bot token is
  # an input-capture flow.  The generic prompt and HTTP capabilities remain
  # neutral; this objective combines them with the suspicious channel.
  - id: python-discord-credential-capture
    desc: Python captures credentials for Discord delivery
    crit: hostile
    conf: 0.99
    attack: T1056.002
    all:
      - id: micro-behaviors/ui/dialog/prompt::python-credential-input-pair
      - id: micro-behaviors/communications/http/lib/requests::requests-post
      - id: objectives/command-and-control/channel/discord::discord-bot-token-literal
    near_lines: 30
