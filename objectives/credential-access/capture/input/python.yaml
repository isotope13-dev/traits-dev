defaults:
  platforms: [windows, unix]
  for: [python]

traits:
  - id: python-wallet-seed-phrase-input-prompt
    desc: Prompts for a wallet seed phrase
    crit: suspicious
    conf: 0.98
    if:
      # Require a prompt argument on an actual call, not prose about input.
      type: symbol
      kind: call
      exact: input
      arg:
        index: 0
        regex: '(?i)\b(seed[ /-]phrase|recovery phrase|wallet seed|mnemonic)\b'

  - id: python-selenium-telegram-wallet-seed-form
    desc: Enters seed phrase into Telegram wallet bot
    crit: suspicious
    conf: 0.99
    if:
      type: text
      regex: '(?is)herewalletbot.{0,600}input\s*\([^)]{0,160}(seed|phrase).{0,300}send_keys\(\s*seed\b'

  - id: python-herewalletbot-console-entrypoint
    desc: Console launches Telegram wallet automation
    crit: suspicious
    conf: 0.98
    if:
      type: text
      regex: '(?is)console_scripts[\s\S]{0,240}herewalletbot\s*=\s*herewalletbot\.herewalletbot:main'

composite_rules:
  # A CLI credential prompt that posts with a hardcoded Discord bot token is
  # an input-capture flow.  The generic prompt and HTTP capabilities remain
  # neutral; this objective combines them with the suspicious channel.
  - id: python-discord-credential-capture
    desc: Python captures credentials for Discord delivery
    crit: hostile
    conf: 0.99
    attack: T1056.002
    all:
      - id: micro-behaviors/ui/terminal::python-credential-input-pair
      - id: micro-behaviors/communications/http/post::requests-post
      - id: objectives/command-and-control/channel/discord::discord-bot-token-literal
    near_lines: 30

  - id: python-telegram-wallet-seed-phishing-cli
    desc: Console command captures a seed phrase for a Telegram wallet bot
    crit: hostile
    conf: 0.995
    attack: T1056.003,T1204.001,T1656
    for: [python, python-sdist, zip, whl]
    scope: archive
    all:
      - id: objectives/credential-access/capture/input::python-wallet-seed-phrase-input-prompt
      - id: objectives/credential-access/capture/input::python-selenium-telegram-wallet-seed-form
    any:
      - id: objectives/credential-access/capture/input::python-herewalletbot-console-entrypoint
      - id: micro-behaviors/data/control-flow/module-exec::python-main-guard
