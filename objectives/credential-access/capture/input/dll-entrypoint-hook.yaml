# Payloads that execute from a DLL's entry point, so merely loading the module
# into a process runs them -- no exported call required. The load itself is the
# trigger, whether the module arrives via AppInit_DLLs, a search-order hijack, a
# Detour-injected launch, or an authentication-package registration.
defaults:
  platforms: [windows]
  for: [c, cpp]
  attack: T1574.002

composite_rules:
  # HppDLL weaponization: DllMain installs a credential-API hook on
  # DLL_PROCESS_ATTACH, so injecting the module into LSASS arms the NTLM
  # password interception with no further action. The hook and the on-disk dump
  # are convicted under credential-access; this names the self-installing
  # delivery that turns a passive hook library into an implant. Pooled across
  # the module tree because DllMain and the installer are separate units.
  - id: dll-entrypoint-arms-credential-hook
    desc: DLL entry point auto-installs a credential-API hook
    crit: hostile
    conf: 0.95
    attack: T1574.002,T1056.004
    scope: outer
    # The DllMain unit and the hook installer are separate translation units,
    # so the pooling container is the source archive they ship in.
    for: [c, cpp, zip, tar]
    all:
      - id: micro-behaviors/process/lifecycle/auto-exec::dllmain-process-attach-runs-code
      - id: objectives/credential-access/capture/input::windows-credential-api-inline-hook
    unless:
      - id: well-known/tool/reverse-engineering/
      - id: well-known/app/security/
