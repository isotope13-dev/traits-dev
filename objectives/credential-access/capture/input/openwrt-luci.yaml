defaults:
  platforms: [openwrt]
  for: [shell, javascript]
  attack: T1056.001

traits:
  - id: luci-sendbeacon-creds
    desc: LuCI credential beacon endpoint
    crit: suspicious
    conf: 0.92
    if:
      type: text
      regex: 'navigator\.sendBeacon.{0,80}/api/v1/creds'

  # objectives/impact/deface/web::luci-static-resource-path is `for: [shell,
  # html]` (inherited defaults there), so it can never satisfy a standalone
  # injected-script composite. Local JS-scoped duplicate of the same substring.
  - id: luci-static-resource-path-js
    desc: OpenWrt LuCI static resource path (script)
    crit: notable
    conf: 0.82
    for: [javascript]
    if:
      type: text
      substr: /www/luci-static/resources

composite_rules:
  - id: luci-submit-listener
    for: [html]
    desc: LuCI form submit listener
    crit: notable
    conf: 0.86
    all:
      - id: micro-behaviors/communications/http/form::form-submit-listener
      - id: objectives/impact/deface/web::luci-static-resource-path

  # JS-only counterpart to luci-submit-listener above: form-submit-listener is
  # already `for: [javascript, typescript, html]`, but the html-only composite
  # can't be reused directly by a JS-scoped parent.
  - id: luci-submit-listener-js
    for: [javascript]
    desc: LuCI form submit listener (script)
    crit: notable
    conf: 0.86
    all:
      - id: micro-behaviors/communications/http/form::form-submit-listener
      - id: luci-static-resource-path-js

  - id: openwrt-luci-credential-interceptor
    for: [javascript]
    desc: OpenWrt LuCI credential interception script
    crit: hostile
    conf: 0.96
    all:
      - id: luci-submit-listener-js
      - id: micro-behaviors/communications/http/form::formdata-class
      - id: luci-sendbeacon-creds
    any:
      - id: objectives/impact/deface/web::luci-static-resource-path
      - id: micro-behaviors/fs/path/config/system::openwrt-uhttpd-redirect-setting
