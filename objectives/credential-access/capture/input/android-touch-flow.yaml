# Java's current flow projection loses chained receivers and constructors.
# Bind adjacent reader, event-array and coordinate-mapping declarations in AST.
# The shell stream must supply BOTH numeric arguments; helper names alone fail.
defaults:
  platforms: [android]
  for: [java]
traits:
  - id: android-adb-input-to-credential-mapping
    desc: ADB input feeds credential coordinate mapping
    crit: suspicious
    conf: 0.98
    attack: T1056.001
    if:
      type: tree-sitter
      query: |
        (block
          (local_variable_declaration declarator: (variable_declarator
            name: (identifier) @reader
            value: (object_creation_expression type: (type_identifier) @buffered
              arguments: (argument_list
                (object_creation_expression type: (type_identifier) @input_reader
                  arguments: (argument_list
                    (method_invocation name: (identifier) @open
                      arguments: (argument_list (string_literal
                        (string_fragment) @service)))))))))
          . (local_variable_declaration declarator: (variable_declarator
            name: (identifier) @x_array
            value: (method_invocation
              object: (method_invocation object: (identifier) @x_reader
                name: (identifier) @x_read)
              name: (identifier) @x_split)))
          . (local_variable_declaration declarator: (variable_declarator
            name: (identifier) @y_array
            value: (method_invocation
              object: (method_invocation object: (identifier) @y_reader
                name: (identifier) @y_read)
              name: (identifier) @y_split)))
          . (local_variable_declaration declarator: (variable_declarator
            value: (method_invocation name: (identifier) @mapping
              arguments: (argument_list
                (method_invocation object: (identifier) @x_integer
                  name: (identifier) @x_parse
                  arguments: (argument_list
                    (array_access array: (identifier) @mapped_x)))
                (method_invocation object: (identifier) @y_integer
                  name: (identifier) @y_parse
                  arguments: (argument_list
                    (array_access array: (identifier) @mapped_y)))))))
          (#eq? @buffered "BufferedReader")
          (#eq? @input_reader "InputStreamReader")
          (#eq? @open "openStream")
          (#match? @service "^shell:getevent[^\n]{0,80}/dev/input/event")
          (#eq? @reader @x_reader) (#eq? @reader @y_reader)
          (#eq? @x_read "readLine") (#eq? @y_read "readLine")
          (#eq? @x_split "split") (#eq? @y_split "split")
          (#eq? @x_integer "Integer") (#eq? @y_integer "Integer")
          (#eq? @x_parse "parseInt") (#eq? @y_parse "parseInt")
          (#eq? @x_array @mapped_x) (#eq? @y_array @mapped_y)
          (#match? @mapping "(?i)^(map|convert|resolve).*(touch|coord|point).*(pin|password|pattern)"))
