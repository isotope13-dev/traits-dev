defaults:
  platforms:
    - unix
    - windows
  for:
    - shell
traits:
  - id: password-variable
    desc: Password variable reference
    crit: component
    conf: 0.4
    if:
      type: string_literal
      regex: \$\{?password\}?

composite_rules:
  - id: password-capture-encode
    desc: Capture and encode password
    crit: hostile
    conf: 0.95
    attack: T1056
    mbc: E1056
    all:
      - id: micro-behaviors/ui/dialog/prompt::read-silent-password
      - id: password-variable
      - id: micro-behaviors/data/encode/base64::password-base64-pipeline

  - id: shell-sudo-credential-interception
    desc: Shell script intercepts sudo command to harvest credentials
    crit: hostile
    conf: 0.98
    attack: T1056.002,T1556
    all:
      - id: micro-behaviors/process/hook/interception::shell-sudo-command-override
      - id: micro-behaviors/ui/dialog/prompt::shell-read-or-password-prompt
      - id: micro-behaviors/fs/write/credential::shell-user-password-pair-append
    any:
      - id: micro-behaviors/process/create/sudo::sudo-stdin-password
      - id: micro-behaviors/fs/path/application/executable::sudo-command-path-reference
