defaults:
  platforms:
    - unix
    - windows
  for:
    - shell
traits:
  - id: read-silent-password
    desc: Silent password input capture
    crit: suspicious
    conf: 0.9
    attack: T1056
    mbc: E1056
    if:
      type: string_literal
      regex: read\s+-s\s+\w*password
  - id: password-variable
    desc: Password variable reference
    crit: component
    conf: 0.4
    if:
      type: string_literal
      regex: \$\{?password\}?
  - id: shell-sudo-command-override
    desc: Overrides sudo via alias or function
    crit: notable
    conf: 0.92
    if:
      type: text
      regex: '(?m)^\s*(alias\s+sudo\s*=|function\s+sudo\s*(\(\s*\))?\s*\{|sudo\s*\(\s*\)\s*\{)'
composite_rules:
  - id: password-capture-encode
    desc: Capture and encode password
    crit: hostile
    conf: 0.95
    attack: T1056
    mbc: E1056
    all:
      - id: read-silent-password
      - id: password-variable
      - id: micro-behaviors/data/encode/base64::password-base64-pipeline
  - id: shell-credential-prompt
    desc: Shell prompts or reads password
    crit: notable
    conf: 0.88
    any:
      - id: micro-behaviors/ui/dialog/prompt::shell-read-prompt-input
      - id: read-silent-password
      - id: micro-behaviors/os/privilege/elevation::sudo-password-prompt-text
  - id: shell-sudo-credential-interception
    desc: Shell script intercepts sudo command to harvest credentials
    crit: hostile
    conf: 0.98
    attack: T1056.002,T1556,T1546.004
    all:
      - id: shell-sudo-command-override
      - id: shell-credential-prompt
    any:
      - id: micro-behaviors/fs/write/credential::shell-user-password-pair-append
      - id: micro-behaviors/process/create/sudo::sudo-stdin-password
      - id: micro-behaviors/process/create/launch::sudo-command-path-reference
