defaults:
  platforms: [unix, windows]
  for: [php]
  attack: T1041

composite_rules:
  - id: php-submitted-password-file-dump
    desc: PHP stores submitted password data
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/fs/write/credential::php-file-dumps-submitted-password
      - id: micro-behaviors/communications/http/request/superglobal::php-post-password-field
  - id: php-redirecting-credential-phish
    desc: PHP credential phish redirect
    crit: hostile
    conf: 0.96
    all:
      - id: micro-behaviors/communications/http/request/superglobal::php-post-password-field
      - id: micro-behaviors/communications/http/response::php-location-redirect
    any:
      - id: objectives/credential-access/phishing/kit/source::php-post-challenge-response-fields
      - id: objectives/credential-access/phishing/kit/source::php-phish-result-banner
  - id: php-credential-dump-remote-unserialize
    desc: PHP credential dump also deserializes remote data
    crit: hostile
    conf: 0.99
    all:
      - id: micro-behaviors/fs/write/credential::php-file-dumps-submitted-password
      - id: micro-behaviors/data/serialize/object::remote-unserialize
