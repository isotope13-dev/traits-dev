# Protocol literals indicate capabilities, not proof of execution.
defaults:
  for: [source, javascript, python]
  platforms: [android, unix, windows]
  crit: notable
  conf: 0.95
traits:
  - id: password-monitoring-command
    desc: Command enables device password monitoring
    if:
      type: literal
      kind: string
      exact: "ENABLE_PASSWORD_MONITORING"
  - id: password-detection-command
    desc: Command starts automatic password detection
    if:
      type: literal
      kind: string
      exact: "AUTO_PASSWORD_DETECTION_START"
  - id: device-password-retrieval-command
    desc: Command requests the device password
    if:
      type: literal
      kind: string
      exact: "GET_DEVICE_PASSWORD"
composite_rules:
  - id: device-password-monitoring-command-set
    desc: Command set monitors, detects, and retrieves device passwords
    crit: suspicious
    conf: 0.97
    all:
      - id: password-monitoring-command
      - id: password-detection-command
      - id: device-password-retrieval-command
