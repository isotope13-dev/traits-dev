defaults:
  platforms: [android]
  for: [dex]
  attack: T1111
traits:
  - id: dex-authenticator-account-row-lookup
    desc: Looks up Google Authenticator account rows
    crit: notable
    conf: 0.99
    if:
      type: symbol
      kind: call
      exact: Landroid/view/accessibility/AccessibilityNodeInfo;->findAccessibilityNodeInfosByViewId
      arg: {index: 0, kind: string, exact: 'com.google.android.apps.authenticator2:id/user_row_drag_handle'}
composite_rules:
  - id: android-authenticator-ui-capture
    desc: Authenticator UI targeting and PIN/OTP records
    crit: hostile
    conf: 0.97
    near_bytes: 512
    all:
      - id: dex-authenticator-account-row-lookup
      - id: micro-behaviors/hardware/input/accessibility::dex-accessibility-node-text-read
      - id: metadata/lang/source/literal/string/property::dex-auth-code-prefix-append
      - id: micro-behaviors/data/serialize/json::dex-json-object-put-call
