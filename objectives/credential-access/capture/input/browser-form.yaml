defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
  attack: T1056.002
  crit: hostile
  conf: 0.96

composite_rules:
  - id: encoded-form-and-cookie-harvest
    desc: Encodes form fields and cookies
    near_bytes: 1200
    all:
      - id: micro-behaviors/ui/window/form-input::password-or-card-control-test
      - id: micro-behaviors/ui/window/form-input::form-control-name-value-join
      - id: micro-behaviors/data/encode/base64::btoa-symbol
      - id: micro-behaviors/communications/http/cookie-store::document-cookie-reference
    unless:
      - id: metadata/package/testing/
  - id: csp-gated-card-form-submit-hook
    desc: CSP check hooks card form submit
    near_bytes: 1200
    all:
      - id: micro-behaviors/communications/http/header/security::response-csp-header-read
      - id: micro-behaviors/ui/window/form-input::password-or-card-control-test
      - id: micro-behaviors/ui/window/form-input::jquery-form-submit-handler
    unless:
      - id: metadata/package/testing/
