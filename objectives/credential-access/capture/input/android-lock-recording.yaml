defaults:
  platforms: [android]
  for: [dex]
  attack: T1417.001,T1056.001
traits:
  - id: dex-lockscreen-type-detection-call
    desc: DEX calls lock-screen type detector
    crit: notable
    conf: 0.97
    if:
      type: symbol
      kind: call
      regex: '(?i)/(lockscreen|keyguard)[^;]*;->detect(lockscreen)?type$'
  - id: dex-input-recording-start-call
    desc: DEX calls input recording starter
    crit: notable
    conf: 0.97
    if:
      type: symbol
      kind: call
      regex: '(?i)/(input|gesture|touch)[^;]*;->(start|begin)recording$'
composite_rules:
  # Nearby call sites expose a structural relationship; neither proximity nor
  # the touch API references alone prove that captured coordinates were sent.
  - id: dex-lockscreen-input-recording-cluster
    desc: Lock-screen detection and input recording call cluster
    crit: notable
    conf: 0.97
    near_bytes: 512
    all:
      - id: dex-lockscreen-type-detection-call
      - id: dex-input-recording-start-call
  - id: android-lockscreen-input-recording
    desc: Lock-screen detection with input recording and touch reads
    crit: suspicious
    conf: 0.98
    all:
      - id: dex-lockscreen-input-recording-cluster
      - id: objectives/collection/keylog/capture::android-pattern-checks-touch-reads
