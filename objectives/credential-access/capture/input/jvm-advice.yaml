defaults:
  platforms: [unix, windows]
  for: [class]
  attack: T1056.004

traits:
  - id: jvm-advice-copies-password-pair
    desc: Call advice copies username and password
    crit: suspicious
    conf: 0.96
    if:
      type: value
      path: class.strings[*]
      regex: '\$proceed\s*\(\s*\$\$\s*\)\s*;[\s\S]{0,100}username\s*\+[^;]{0,80}\bpassword\b'

composite_rules:
  - id: jvm-encrypted-password-interception
    desc: Instrumented password capture with encrypted shell logging
    crit: hostile
    conf: 0.98
    platforms: [unix]
    all:
      - id: jvm-advice-copies-password-pair
      - id: micro-behaviors/process/hook/instrumentation::javassist-method-instrument-bytecode
      - id: micro-behaviors/crypto/encrypt::jvm-template-cipher-encrypt-init
      - id: micro-behaviors/fs/write/content::jvm-template-shell-echo-append
