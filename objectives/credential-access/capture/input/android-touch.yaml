defaults:
  platforms: [android]
  for: [java, kotlin, android_apk, zip, dex]
  attack: T1056.001

traits:
  # The identifiers are deliberately code-shaped rather than prose-shaped.
  # They cover enum/config values used to distinguish credentials recovered
  # from touch geometry, including the RatHat value documented by zLabs, while
  # avoiding sentences that merely discuss PIN or pattern coordinates.
  - id: touch-point-credential-type
    desc: Credential type denotes touch-point recovery
    crit: suspicious
    conf: 0.97
    for: [java, kotlin, go, rust, c, cpp, dex]
    if:
      type: literal
      kind: string
      regex: '(?i)^(password|pin|pattern)(_quality)?_?(touch_?points?|coordinates?)$'

  # This is an operation, not a vocabulary hit: the parser must expose a call
  # whose target maps or resolves a touch/coordinate into a keypad digit, PIN,
  # or unlock pattern. Legitimate lock-screen implementations can contain the
  # operation, so the hostile conclusion below also requires raw input capture
  # and the explicit touch-derived credential type.
  - id: touch-coordinate-keypad-mapping-call
    desc: Maps touch coordinates to credential keys
    crit: suspicious
    conf: 0.96
    for: [java, kotlin, go, rust, c, cpp, dex]
    if:
      type: symbol
      kind: call
      regex: '(?i)^(map|match|resolve|convert).*(touch|point|coord).*(keypad|pin|digit|pattern)'

composite_rules:
  - id: android-overlay-window-surface
    desc: Android runtime overlay window surface
    crit: component
    conf: 0.95
    any:
      - id: micro-behaviors/ui/window/overlay::android-source-runtime-overlay-window
      - id: micro-behaviors/ui/window/overlay::runtime-overlay-window

  - id: android-overlay-touch-coordinate-capture
    desc: Android overlay captures touch coordinates
    crit: component
    conf: 0.98
    all:
      - id: android-overlay-window-surface
      - id: micro-behaviors/hardware/input/event::android-view-touch-coordinate-capture

  - id: android-overlay-touch-credential-replay
    desc: Android overlay captures and replays credential touch coordinates
    crit: hostile
    conf: 0.995
    attack: T1056.001,T1417.001
    all:
      - id: android-overlay-touch-coordinate-capture
      - id: objectives/credential-access/phishing/credential::android-accessibility-service-surface
      - id: micro-behaviors/hardware/input/accessibility::android-accessibility-ui-action-source
      - id: objectives/credential-access/phishing/credential::android-sensitive-input-label

  # Hardware-level touch theft is distinct from overlay touch replay. The
  # collector reads the kernel's multitouch X/Y events and then converts those
  # points into a PIN/pattern credential by applying a keypad-layout mapping.
  # Requiring all three mechanics keeps diagnostics (`getevent`) and ordinary
  # lock-screen UI code from matching independently.
  - id: android-raw-touch-credential-reconstruction
    desc: Reconstructs credentials from raw touch geometry
    crit: hostile
    conf: 0.995
    for: [source, binaries]
    attack: T1056.001,T1417.001
    all:
      - id: objectives/collection/keylog/device::android-raw-touch-coordinate-capture
      - id: touch-point-credential-type
      - id: touch-coordinate-keypad-mapping-call
