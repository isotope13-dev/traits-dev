defaults:
  platforms: [android]
  for: [java, kotlin, android_apk, zip, dex]
  attack: T1056.001

traits:
  # Source identifier token; node-search composites supply lookup context.
  - id: android-pattern-lock-id-token
    desc: Pattern-lock identifier token
    crit: notable
    conf: 0.9
    for: [java, kotlin]
    if:
      type: text
      regex: '(?i)\block.?pattern\w*|\bpattern.?lock\w*'

  - id: android-touch-credential-buffering
    desc: Touch listener buffers credential digits
    crit: suspicious
    conf: 0.98
    for: [java]
    if:
      type: tree-sitter
      language: java
      query: |
        (class_body
          (field_declaration declarator: (variable_declarator
            value: (method_invocation arguments: (argument_list
              (string_literal (string_fragment) @payment_package)))))
          (method_declaration body: (block (expression_statement
              (method_invocation
                name: (identifier) @listener
                arguments: (argument_list
                  (lambda_expression body: (block
                    (local_variable_declaration
                      declarator: (variable_declarator
                        name: (identifier) @digit
                        value: (method_invocation
                          name: (identifier) @mapping
                          arguments: (argument_list
                            (method_invocation name: (identifier) @x)
                            (method_invocation name: (identifier) @y)))))
                    (expression_statement (method_invocation
                      object: (identifier) @buffer
                      name: (identifier) @append
                      arguments: (argument_list (identifier) @stored))))))
                (#eq? @listener "setOnTouchListener")
                (#match? @mapping "(?i)(coord|touch|point)")
                (#match? @x "^get(Raw)?X$")
                (#match? @y "^get(Raw)?Y$")
                (#match? @buffer "(?i)(pin|password|passcode)")
                (#eq? @append "append")
                (#eq? @digit @stored)))))
          (#match? @payment_package "^(com[.]phonepe[.]app|net[.]one97[.]paytm)$"))

composite_rules:
  - id: android-overlay-touch-credential-replay
    desc: Payment-targeting credential tap replay handlers
    crit: hostile
    conf: 0.99
    attack: T1056.001,T1417.001
    for: [java]
    all:
      - id: android-touch-credential-buffering
      - id: micro-behaviors/hardware/input/accessibility::android-accessibility-event-package-read
      - id: micro-behaviors/hardware/input/event::accessibility-overlay-touch-and-gesture

  # Hardware-level touch theft is distinct from overlay touch replay. The
  # collector reads the kernel's multitouch X/Y events and then converts those
  # points into a PIN/pattern credential by applying a keypad-layout mapping.
  # Require input-to-mapping provenance as well as credential context; disconnected
  # constants and unused helper methods do not reconstruct captured credentials.
  - id: android-raw-touch-credential-reconstruction
    desc: Reconstructs credentials from raw touch geometry
    crit: hostile
    conf: 0.995
    for: [java]
    attack: T1056.001,T1417.001
    all:
      - id: micro-behaviors/hardware/input/device::android-raw-touch-coordinate-capture
      - id: metadata/lang/source/literal::touch-point-credential-category-literal
      - id: metadata/lang/source/syntax/call/invocation::touch-coordinate-keypad-helper-name-call
      - id: android-adb-input-to-credential-mapping

  # Identifier token plus the actual ViewId tree search: the lookup half of
  # the harvest. A stock lock screen knows only its own layout; hunting
  # pattern views by id is the unlock-pattern theft shape.
  - id: android-oem-pattern-lock-view
    desc: Looks up OEM lock-pattern views
    crit: suspicious
    conf: 0.96
    for: [java, kotlin]
    near_bytes: 800
    all:
      - id: android-pattern-lock-id-token
      - id: micro-behaviors/hardware/input/accessibility::android-accessibility-node-search

  # Tree search for OEM pattern views inside an accessibility service,
  # paired with node text/coordinate reads: the harvest chain for unlock
  # patterns without touching the kernel touch pipeline.
  - id: android-pattern-lock-view-harvest
    desc: Accessibility service harvests OEM pattern-lock views
    crit: hostile
    conf: 0.97
    attack: T1056.001,T1417.001
    for: [java, kotlin]
    all:
      - id: android-oem-pattern-lock-view
      - id: micro-behaviors/hardware/input/accessibility::android-accessibility-service-source
