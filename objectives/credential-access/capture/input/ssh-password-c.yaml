defaults:
  platforms: [unix]
  for: [c, cpp]
  crit: suspicious
composite_rules:
  - id: ssh-auth-plaintext-password-logging
    desc: SSH authentication logs submitted passwords
    crit: hostile
    conf: 0.99
    near_bytes: 0
    all:
      - id: micro-behaviors/fs/write/credential::native-auth-plaintext-password-log
      - id: micro-behaviors/os/security/auth/password::native-ssh-password-handler
