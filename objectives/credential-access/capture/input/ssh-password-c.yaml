defaults:
  platforms: [unix]
  for: [c, cpp]
  crit: suspicious
traits:
  - id: ssh-client-plaintext-password-logging
    desc: SSH client writes plaintext passwords to file
    crit: hostile
    conf: 0.98
    attack: T1056
    if:
      type: tree-sitter
      language: c
      query: |
        ((function_definition
           declarator: (function_declarator declarator: (identifier) @function)
           body: (compound_statement) @body)
         (#match? @body "\\bread_passphrase[ \\t\\r\\n]*\\(")
         (#match? @body "\\bfprintf[ \\t\\r\\n]*\\([^;]{1,160}authctxt[ \\t]*->[ \\t]*server_user[ \\t]*,[ \\t]*password[ \\t]*[,)]")
         (#match? @body "\\bpacket_put_cstring[ \\t\\r\\n]*\\([ \\t]*password[ \\t]*\\)"))
composite_rules:
  - id: ssh-auth-plaintext-password-logging
    desc: SSH authentication logs submitted passwords
    crit: hostile
    conf: 0.99
    near_bytes: 0
    all:
      - id: micro-behaviors/fs/write/credential::native-auth-plaintext-password-log
      - id: micro-behaviors/os/security/auth/password::native-ssh-password-handler
