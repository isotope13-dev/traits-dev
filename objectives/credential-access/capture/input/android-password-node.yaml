defaults:
  platforms: [android]
  for: [java, kotlin]
  attack: T1417.001

composite_rules:
  - id: android-accessibility-password-node-read
    desc: Accessibility reads text in password branches
    crit: suspicious
    conf: 0.95
    all:
      - id: micro-behaviors/hardware/input/accessibility::android-accessibility-service-source
      - id: micro-behaviors/hardware/input/accessibility::android-accessibility-text-extraction
      - id: micro-behaviors/hardware/input/accessibility::android-node-password-flag-read
      - id: micro-behaviors/hardware/input/accessibility::password-branch-text-read-source
