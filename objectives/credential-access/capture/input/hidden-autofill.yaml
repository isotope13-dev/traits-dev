defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
  attack: T1056
traits:
- id: hidden-autofill-form-fields
  desc: "hidden autofill credential fields"
  crit: notable
  conf: 0.93
  if:
    type: text
    regex: autocomplete=['"](on|username|current-password)['"]
- id: body-append-credential-form
  desc: "document.body appends credential form"
  crit: notable
  conf: 0.88
  # Building block for hidden-autofill-click-credential-theft. Match full
  # credential tokens, not the substrings user/pass/cred, which collide with
  # benign UI ids like userInfo/loginView/compass and inflate false positives.
  if:
    type: text
    regex: document\.body\.appendChild.{0,120}(autocomplete|username|password|credential)
- id: body-click-credential-read--rx-1
  desc: document.body click handler reads user/pass
  crit: suspicious
  conf: 0.94
  if:
    type: text
    regex: document\.body\.(on|addEventListener\(\s*['"])click.{0,120}(user|pass)
  unless:
    - id: well-known/app/browser-extension/content-blocker::adblock-ruleset-resource
    # Scriptlet string pools (YouTube ad-skip tables quoting
    # document.body.onclick beside unrelated tokens) are not handlers.
    - id: well-known/app/browser-extension/ublock-origin::filter-bundle
- id: body-click-credential-read--rx-2
  desc: document.body click handler reads cred/login
  crit: suspicious
  conf: 0.94
  if:
    type: text
    regex: document\.body\.(on|addEventListener\(\s*['"])click.{0,120}(cred|login)
- id: username-password-read--rx-7
  desc: Username form field attribute
  crit: notable
  conf: 0.9
  if:
    type: text
    regex: '(?i)\b(name|id|autocomplete)\s*=\s*["'']username["'']'
- id: password-selector-exclusion
  desc: Password selector exclusion
  crit: notable
  conf: 0.9
  if:
    type: text
    substr: 'not([type="password"])'
- id: password-filter-return
  desc: Password filter returns true
  crit: notable
  conf: 0.85
  if:
    type: text
    # A predicate on a "password" field type that returns true (`!0` is the
    # minified spelling). The old `password ... return !?0` also took
    # `return 0` (false) after any use of the word: zxcvbn's strength scorer
    # in Element matched on `test(password.charAt(i)) ... return 0`.
    regex: '["'']password["''][^;\n]{0,40}\breturn\s*(!0|true)\b'
  unless:
    - id: well-known/lib/web/stacksjs/stacks::stacks-package-context
    - id: well-known/lib/web/stacksjs/stacks::stacks-monorepo-package-name
    - id: well-known/lib/web/stacksjs/stacks::stacks-database-runtime-marker
    - id: metadata/import/npm/stacksjs/query-builder::stacksjs/query-builder
    - type: text
      substr: hashMake
- id: credential-base64-or-formdata
  desc: "FormData packages username/password"
  crit: notable
  conf: 0.86
  if:
    type: text
    regex: \.append\(\s*['"](username|password)['"]

composite_rules:
- id: hidden-autofill-click-credential-theft
  desc: Hidden autofill click-based credential theft
  crit: hostile
  conf: 0.97
  all:
  - id: hidden-autofill-form-fields
  - id: micro-behaviors/ui/window/dom/create::browser-create-form-element
  - id: body-append-credential-form
  - id: body-click-credential-read
  - id: micro-behaviors/data/property/access::js-value-property-read
  - id: username-password-field-marker
  any:
  - id: micro-behaviors/ui/window/form-input::credential-element-id-lookup
  - id: credential-base64-or-formdata
  - id: micro-behaviors/data/encode/base64::btoa-symbol
  - id: micro-behaviors/communications/http/form::formdata-class
- id: body-click-credential-read
  desc: Reads credentials on body click
  crit: suspicious
  conf: 0.94
  any:
  - id: body-click-credential-read--rx-1
  - id: body-click-credential-read--rx-2
  unless:
    - id: well-known/app/browser-extension/content-blocker::adblock-filter-resource

- id: credential-field-exclusion-filter
  desc: Credential exclusion filter
  crit: component
  conf: 0.9
  any:
  - id: password-selector-exclusion
  - id: password-filter-return
- id: username-password-field-marker
  desc: Username or password field marker
  crit: component
  conf: 0.86
  any:
  - id: username-password-read--rx-7
  - id: micro-behaviors/ui/window/form-input::credential-element-id-lookup
  - id: credential-base64-or-formdata
