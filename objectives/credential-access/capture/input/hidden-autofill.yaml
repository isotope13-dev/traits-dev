defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
  attack: T1056
traits:
- id: password-filter-return
  desc: Password filter returns true
  crit: notable
  conf: 0.85
  if:
    type: text
    # A predicate on a "password" field type that returns true (`!0` is the
    # minified spelling). The old `password ... return !?0` also took
    # `return 0` (false) after any use of the word: zxcvbn's strength scorer
    # in Element matched on `test(password.charAt(i)) ... return 0`.
    regex: '["'']password["''][^;\n]{0,40}\breturn\s*(!0|true)\b'
  unless:
    - id: well-known/lib/web/site-platforms/stacksjs/stacks::stacks-package-context
    - id: well-known/lib/web/site-platforms/stacksjs/stacks::stacks-monorepo-package-name
    - id: well-known/lib/web/site-platforms/stacksjs/stacks::stacks-database-runtime-marker
    - id: metadata/import/npm/stacksjs/query-builder::stacksjs/query-builder
    - type: text
      substr: hashMake
- id: credential-base64-or-formdata
  desc: "FormData packages username/password"
  crit: notable
  conf: 0.86
  if:
    type: text
    regex: \.append\(\s*['"](username|password)['"]
  unless:
    - id: well-known/app/ai/coding-agent/openclaw::powpow-register-skill-script-context

composite_rules:
- id: body-click-password-value-read
  desc: Body click handler reads password field
  crit: suspicious
  conf: 0.93
  near_bytes: 400
  all:
  - id: micro-behaviors/ui/window/event::body-click-credential-words
  - id: micro-behaviors/ui/window/password-field::password-element-value-assignment
- id: hidden-autofill-click-credential-theft
  desc: Hidden autofill click-based credential theft
  crit: hostile
  conf: 0.97
  all:
  - id: micro-behaviors/ui/window/form-input::autocomplete-login-attribute
  - id: micro-behaviors/ui/window/dom/create::browser-create-form-element
  - id: micro-behaviors/data/collection/dom::body-append-near-credential-token
  - id: micro-behaviors/ui/window/event::body-click-credential-words
  - id: micro-behaviors/data/property/access::js-value-property-read
  - id: username-password-field-marker
  any:
  - id: micro-behaviors/ui/window/form-input::credential-element-id-lookup
  - id: credential-base64-or-formdata
  - id: micro-behaviors/data/encode/base64::btoa-symbol
  - id: micro-behaviors/communications/http/form::formdata-class
- id: credential-field-exclusion-filter
  desc: Credential exclusion filter
  crit: component
  conf: 0.9
  any:
  - id: micro-behaviors/ui/window/form-input::password-selector-exclusion
  - id: password-filter-return
- id: username-password-field-marker
  desc: Username or password field marker
  crit: component
  conf: 0.86
  any:
  - id: metadata/lang/source/syntax/attribute::username-attribute-value
  - id: micro-behaviors/ui/window/form-input::credential-element-id-lookup
  - id: credential-base64-or-formdata
