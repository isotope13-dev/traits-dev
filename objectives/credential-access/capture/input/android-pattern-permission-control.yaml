defaults:
  platforms: [android]
  for: [dex]
  attack: T1417.001,T1626.001
traits:
  - id: dex-lock-pattern-view-lookup
    desc: Looks up Android lock-pattern view
    crit: notable
    conf: 0.98
    if:
      type: symbol
      kind: call
      exact: 'Landroid/view/accessibility/AccessibilityNodeInfo;->findAccessibilityNodeInfosByViewId'
      arg: {index: 0, kind: string, regex: '(?i)^com\.android\.systemui:id/lockpatternview$'}
  - id: dex-permission-allow-view-lookup
    desc: Looks up Android permission allow button
    crit: notable
    conf: 0.98
    if:
      type: symbol
      kind: call
      exact: 'Landroid/view/accessibility/AccessibilityNodeInfo;->findAccessibilityNodeInfosByViewId'
      arg: {index: 0, kind: string, regex: '^com\.android\.(packageinstaller|permissioncontroller):id/permission_allow_button$'}
composite_rules:
  # Proximity provides structural evidence, not a complete data-flow proof.
  - id: dex-lock-pattern-node-json-cluster
    desc: Lock-pattern node, bounds and JSON call cluster
    crit: notable
    conf: 0.95
    near_bytes: 512
    all:
      - id: dex-lock-pattern-view-lookup
      - id: micro-behaviors/hardware/input/accessibility::dex-accessibility-node-bounds-call
      - id: micro-behaviors/hardware/input/accessibility::dex-accessibility-node-text-read
      - id: micro-behaviors/data/serialize/json::dex-json-object-put-call
  - id: dex-permission-allow-action-cluster
    desc: Permission-button lookup and node-action cluster
    crit: notable
    conf: 0.95
    near_bytes: 128
    all:
      - id: dex-permission-allow-view-lookup
      - id: micro-behaviors/hardware/input/accessibility::dex-accessibility-node-action
  - id: android-lock-pattern-permission-control-clues
    desc: Lock-pattern inspection with permission-control call clusters
    crit: hostile
    conf: 0.97
    near_bytes: 4096
    all:
      - id: dex-lock-pattern-node-json-cluster
      - id: dex-permission-allow-action-cluster
