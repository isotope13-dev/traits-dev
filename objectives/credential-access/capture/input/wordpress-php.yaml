defaults:
  platforms: [unix, windows]
  for: [php]
  attack: T1056.002
  mbc: F0007

composite_rules:
  # The authenticate callback receives the submitted plaintext password as its
  # third argument. Persistently mapping a callback value by user_login is the
  # credential-collection shape; ordinary authentication plugins verify the
  # value and return the user object without building such a password map.
  - id: wordpress-authenticate-password-option-capture
    desc: Captures WordPress login credentials into a persistent option
    crit: hostile
    conf: 0.98
    near_bytes: 1800
    all:
      - id: micro-behaviors/process/hook/event::wordpress-authenticate-filter
      - id: micro-behaviors/data/source/property/assignment::wordpress-login-keyed-value-assignment
      - id: micro-behaviors/data/db/access::php-update-option
