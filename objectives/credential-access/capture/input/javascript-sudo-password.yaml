# A program that asks the user for a sudo password in its own UI and then runs
# sudo. Desktop tools also ask for elevation legitimately, so this stays
# suspicious; the MITM kits above carry the hostile verdict.
defaults:
  platforms: [unix, windows]
  for: [npm, tar, package.json, javascript, typescript]
  attack: T1056.003
composite_rules:
  - id: javascript-sudo-password-prompt-then-sudo
    desc: UI collects a sudo password and a sudo command runs
    crit: suspicious
    conf: 0.85
    scope: archive
    all:
      - id: micro-behaviors/ui/dialog/prompt::javascript-sudo-password-prompt
      - id: micro-behaviors/os/privilege/elevation::sudo-command-string
