# A local web-UI launch token that a service prints into its own boot log is
# the access key to that UI. Reading the current boot journal and capturing
# the `?token=` value from it recovers the key without the host handing it
# over. Remote-access agents need a launch token too, so the pair is only
# suspicious: it is credential access with a plausible operational reason.
defaults:
  platforms: [unix]
  for: [javascript, typescript]

traits:
  - id: journalctl-boot-log-read
    desc: Reads the current boot journal with journalctl
    crit: notable
    conf: 0.9
    if:
      type: text
      substr: journalctl

  - id: web-launch-token-query-capture
    desc: Captures a ?token= value from log text
    crit: notable
    conf: 0.9
    if:
      type: text
      substr: '?token=([A-Za-z0-9_-]+)'

composite_rules:
  - id: launch-token-scraped-from-boot-journal
    desc: Scrapes a web launch token from the boot journal
    crit: suspicious
    conf: 0.9
    near_lines: 20
    all:
      - id: objectives/credential-access/capture/log::journalctl-boot-log-read
      - id: objectives/credential-access/capture/log::web-launch-token-query-capture
