# Credential records staged into concealed log files. System logs live in
# /var/log as named service files; a dotfile there hides from administrators
# browsing the directory, and bytewise obfuscation of the record hides it
# from string extraction. The combination — hidden log path, an XOR encode
# loop, a buffered record write, and authentication-daemon targeting in one
# delivery unit — has no legitimate logging use.
defaults:
  crit: hostile
  platforms: [linux]
  # `c-fopen-append-mode` is a C-family shape; Rust and Go were unreachable.
  for: [c, cpp]
  attack: T1056.004,T1027
composite_rules:
  - id: hidden-encoded-credential-log
    desc: Writes obfuscated authentication records to hidden log
    conf: 0.99
    near_bytes: 4096
    all:
      - id: micro-behaviors/fs/path/location::var-log-hidden-path-reference
      - id: micro-behaviors/fs/write/file/append::c-fopen-append-mode
      - id: micro-behaviors/data/source/arithmetic::source-xor-operation
      - id: micro-behaviors/fs/write/file/full::repeated-buffer-write-token
      - id: micro-behaviors/fs/proc/info/path::auth-daemon-proc-comm-search
