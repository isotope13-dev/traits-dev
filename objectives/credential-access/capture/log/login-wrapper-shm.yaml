# A login wrapper (for example a trojanized remote-desktop node login binary
# replaced by a shell script) reads the password, appends it to a file in
# /dev/shm and then hands over to the real program so the user notices nothing.
defaults:
  platforms: [unix]
  for: [shell]
  attack: T1056,T1556
  mbc: E1056

composite_rules:
  - id: login-wrapper-password-shm-capture
    desc: Login wrapper logs password to /dev/shm
    crit: hostile
    conf: 0.96
    near_lines: 25
    all:
      - id: micro-behaviors/fs/write/credential::shell-password-variable-shm-write
      - id: micro-behaviors/process/replace::shell-exec
    any:
      - id: micro-behaviors/ui/dialog/prompt::shell-interactive-password-prompt
      - id: micro-behaviors/ui/terminal::read-silent-password
      - id: micro-behaviors/fs/write/credential::shell-user-password-pair-append
