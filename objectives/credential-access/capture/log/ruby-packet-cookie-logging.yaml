defaults:
  for: [ruby]
  platforms: [unix, windows]
traits:
  - id: ruby-packet-http-cookie-logging
    desc: Logs HTTP cookies extracted from packets
    crit: suspicious
    conf: 0.98
    if:
      type: yara
      source: |
        rule ruby_packet_http_cookie_logging {
          strings:
            $packet = "def on_packet( pkt )"
            $split = "pkt.to_s.split(\"\\n\")"
            $cookie = "Cookie:\\s*(.+)"
            $parse = "$1.strip.split(';')"
            $log = "StreamLogger.log_raw( pkt, \"COOKIE\""
          condition:
            all of them
        }
