defaults:
  for: [objective_c]
  platforms: [ios]
  attack: T1056.001,T1555

traits:
  - id: objc-lockscreen-unlock-hook
    desc: Hook intercepts lock-screen passcode entry
    crit: notable
    conf: 0.97
    if:
      type: text
      regex: '%hook\s+SBLockScreenManager[\s\S]{0,180}attemptUnlockWithPasscode'
  - id: objc-capture-unlock-argument
    desc: Stores passcode from unlock argument
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: 'passcode\s*=\s*\[\[NSString\s+alloc\][^\n]{0,90}arg1'
  - id: objc-ipc-passcode-command
    desc: IPC command requests stored passcode
    crit: notable
    conf: 0.96
    if:
      type: text
      substr: 'isEqual:@"getpasscode"'
  - id: objc-distributed-message-server
    desc: Registers distributed messaging server
    crit: notable
    conf: 0.96
    if:
      type: text
      substr: 'registerForMessageName:'

composite_rules:
  - id: objc-passcode-hook-ipc-disclosure
    desc: Lock-screen hook exposes captured passcode over IPC
    crit: hostile
    conf: 0.99
    all:
      - id: objc-lockscreen-unlock-hook
      - id: objc-capture-unlock-argument
      - id: objc-ipc-passcode-command
      - id: objc-distributed-message-server
