defaults:
  platforms: [android, unix]
  for: [java, kotlin, shell, dex]
  attack: T1110.001

traits:
  - id: android-adb-locksettings-verify
    desc: Android locksettings verify credential check
    crit: notable
    conf: 0.97
    if:
      type: text
      regex: '(?i)\blocksettings\s+verify\s+--old\b'
