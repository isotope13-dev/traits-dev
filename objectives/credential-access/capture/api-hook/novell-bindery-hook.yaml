defaults:
  for: [data]
  platforms: [windows]
  size_min: 1024
  size_max: 524288
  attack: T1056.004
  mbc: B0003

traits:
  - id: x86-16-stack-frame-ds-es-ss-hook
    desc: Appended x86-16 hook sets DS/ES to SS
    crit: notable
    conf: 0.9
    if:
      type: hex
      pattern: '55 8B EC 81 EC ?? ?? 06 1E 56 57 8C D0 8E D8 8E C0'
      offset_range: [-512, null]

  - id: x86-16-tail-far-jmp-return
    desc: Appended x86-16 hook ends with far jump
    crit: notable
    conf: 0.9
    if:
      type: hex
      pattern: '5F 5E 1F 07 8B E5 5D EA ?? ?? ?? ??'
      offset_range: [-256, null]

composite_rules:
  - id: novell-login-password-hook
    desc: Trojanized Novell LOGIN appends x86-16 password hook
    crit: hostile
    conf: 0.96
    all:
      - id: micro-behaviors/os/msdos/netware::novell-netware-login-utility
      - id: x86-16-stack-frame-ds-es-ss-hook
      - id: x86-16-tail-far-jmp-return
