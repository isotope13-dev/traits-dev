defaults:
  for:
  - javascript
  - typescript
  platforms:
  - windows
  - linux
  - macos
traits:
- id: credentials-get-prototype-replace
  desc: Replaces navigator.credentials.get in page
  crit: suspicious
  conf: 0.9
  if:
    type: text
    regex: 'CredentialsContainer\.prototype\.get\s{0,4}=[^=]'
