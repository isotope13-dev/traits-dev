defaults:
  platforms: [windows, unix]
  for: [scripts, binaries, source]
  attack: T1555
traits:
  - id: epic-games-cache-target
    desc: Epic Games webcache target
    crit: notable
    conf: 0.82
    if:
      type: text
      regex: (?i)Epic Games.{0,80}(webcache|config|token)
  - id: battle-net-config-target
    desc: Battle.net config target
    crit: notable
    conf: 0.82
    if:
      type: text
      regex: (?i)Battle\.net.{0,80}(config|token|account)
  - id: ea-config-target
    desc: EA config target
    crit: notable
    conf: 0.8
    if:
      type: text
      regex: (?i)(Electronic Arts|EA Games|EA Desktop|Origin Games?).{0,80}(config|token|account)
  - id: origin-config-target
    desc: Origin config target
    crit: notable
    conf: 0.8
    if:
      type: text
      regex: (?i)(OriginClientService|Origin Games?).{0,80}(config|token|account)
  - id: gog-galaxy-target
    desc: GOG Galaxy config target
    crit: notable
    conf: 0.82
    if:
      type: text
      regex: (?i)GOG Galaxy.{0,80}(config|token|storage)
  - id: riot-games-target
    desc: Riot Games config target
    crit: notable
    conf: 0.82
    if:
      type: text
      regex: (?i)Riot Games.{0,80}(config|token|lockfile)
  - id: minecraft-launcher-target
    desc: Minecraft launcher account or token reference
    crit: notable
    conf: 0.82
    if:
      type: text
      # The launcher's account stores, not the bare word "launcher": the
      # minecraft_launcher_lib package name (and its PyInstaller hook) is a
      # library that launches the game.
      regex: (?i)Minecraft.{0,80}(launcher_(accounts|profiles|msa)\w*\.json|token|accounts\.json)
  - id: minecraft-launcher-account-store
    desc: Minecraft launcher account-store filename
    crit: notable
    conf: 0.98
    for: [javascript, typescript]
    if:
      type: literal
      kind: string
      regex: '^launcher_accounts(_microsoft_store)?\.json$'
  - id: itch-launcher-target
    desc: itch.io launcher config target
    crit: notable
    conf: 0.8
    if:
      type: text
      regex: (?i)itch\.io.{0,80}(config|token|cookies)
  - id: growtopia-save-path
    desc: Growtopia save data path
    crit: suspicious
    conf: 0.9
    if:
      type: text
      regex: (?i)(%APPDATA%|AppData[\\/]Roaming)[\\/]Growtopia[\\/]
  - id: growtopia-registry-path
    desc: Growtopia Software registry path
    crit: suspicious
    conf: 0.9
    platforms: [windows]
    if:
      type: text
      regex: (?i)Software[\\/]Growtopia
composite_rules:
  - id: growtopia-credential-targeting
    desc: Growtopia account data targeting
    crit: suspicious
    conf: 0.92
    any:
      - id: growtopia-save-path
      - id: growtopia-registry-path
  - id: multi-launcher-credential-targeting
    desc: Multi-launcher credential targeting
    crit: suspicious
    conf: 0.94
    needs: 4
    any:
      - id: objectives/credential-access/gaming/launcher::battle-net-config-target
      - id: objectives/credential-access/gaming/launcher::ea-config-target
      - id: objectives/credential-access/gaming/launcher::epic-games-cache-target
      - id: objectives/credential-access/gaming/launcher::gog-galaxy-target
      - id: objectives/credential-access/gaming/launcher::itch-launcher-target
      - id: objectives/credential-access/gaming/launcher::minecraft-launcher-target
      - id: objectives/credential-access/gaming/launcher::origin-config-target
      - id: objectives/credential-access/gaming/launcher::python-discord-leveldb-path
      - id: objectives/credential-access/keychain/extract::python-dump-keychain
      - id: objectives/credential-access/gaming/launcher::python-steam-loginusers
      - id: objectives/credential-access/gaming/launcher::riot-games-target
      - id: micro-behaviors/fs/path/app-data::ubisoft-launcher-data-path
      - id: micro-behaviors/fs/path/account-db::steam-account-config-references
      - id: growtopia-credential-targeting
  - id: node-minecraft-launcher-token-harvest
    desc: Node reads Minecraft launcher access and refresh tokens
    crit: hostile
    conf: 0.99
    for: [javascript, typescript]
    all:
      - id: minecraft-launcher-account-store
      - id: micro-behaviors/data/parse/json::jwt-access-token-source-regex
      - id: micro-behaviors/data/parse/json::refresh-token-field-source-regex
      - id: micro-behaviors/fs/read/file/full::read-node
  - id: gaming-session-stealer
    desc: Gaming session credential stealer
    crit: hostile
    conf: 0.97
    all:
      - id: multi-launcher-credential-targeting
    any:
      - id: micro-behaviors/communications/messaging/send::telegram-bot-api-file-upload
      - id: objectives/collection/archive/upload::sensitive-tree-zip-upload
      - id: micro-behaviors/data/archive/zip::miniz-zip-writer-api
