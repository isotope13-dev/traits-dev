defaults:
  platforms: [unix]
  for: [python, pyc]
  attack: T1555

traits:
  - id: python-steam-loginusers
    desc: Python Steam credential paths
    crit: suspicious
    conf: 0.94
    if:
      type: text
      substr: STEAM_CREDENTIAL_PATHS

  - id: python-discord-leveldb-path
    desc: Python Discord leveldb path
    crit: suspicious
    conf: 0.94
    if:
      type: text
      substr: discord/Local Storage/leveldb

composite_rules:
  - id: python-gaming-credential-harvest
    desc: Python gaming credential harvest
    crit: hostile
    conf: 0.98
    needs: 2
    any:
      - id: python-steam-loginusers
      - id: python-discord-leveldb-path
      # Whole-keychain dump is a keychain technique, not a gaming one: the
      # canonical atom lives in keychain/extract and is referenced here.
      - id: objectives/credential-access/keychain/extract::python-dump-keychain

  - id: python-gaming-credential-exfil
    desc: Python gaming credential exfil
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/communications/http/url/telemetry::api-report-path
    any:
      - id: python-gaming-credential-harvest
