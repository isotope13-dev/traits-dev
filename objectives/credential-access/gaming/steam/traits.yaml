# Steam account and client harvesting routines. The atoms name function
# declarations, not product mentions. The composite joins them with the FTP
# session routine, so one notable leg alone never reports hostile.
defaults:
  platforms: [windows]
  for: [c, cpp]
  crit: notable
  conf: 0.85
  attack: T1555

traits:
  - id: steam-client-module-grab
    desc: Steam client module grab routine declared
    if:
      type: symbol
      kind: identifier
      exact: GrabSteamClientModule

  - id: steam-login-command-handlers
    desc: Steam login and ID command handlers
    if:
      type: text
      regex: '\bCmd_(steamid|friendsname|slogininfo)\b'

composite_rules:
  - id: steam-ftp-harvest-command-surface
    desc: Steam and FTP credential harvesting command surface
    crit: hostile
    conf: 0.95
    needs: 2
    any:
      - id: objectives/credential-access/ftp/flashfxp::flashfxp-session-routine
      - id: objectives/credential-access/gaming/steam::steam-client-module-grab
      - id: objectives/credential-access/gaming/steam::steam-login-command-handlers
