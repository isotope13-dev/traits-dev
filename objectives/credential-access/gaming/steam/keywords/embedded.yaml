defaults:
  crit: suspicious
  platforms:
    - unix
    - windows
  for: [scripts, binaries]
traits:
  - id: extract-launch-steam
    desc: Contains ExtractAndLaunchSteam string
    if:
      type: text
      substr: ExtractAndLaunchSteam
  - id: get-embedded-steam
    desc: Contains GetEmbeddedSteam string
    if:
      type: text
      substr: GetEmbeddedSteam
  - id: extracting-steam-resources
    desc: "has Extracting Steam from resources"
    if:
      type: text
      substr: Extracting Steam from resources
