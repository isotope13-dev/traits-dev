defaults:
  platforms: [windows, unix]
  for: [scripts, binaries, csharp]
  attack: T1555
traits:
  - id: loginusers-vdf
    desc: Steam loginusers.vdf file access
    crit: suspicious
    conf: 0.9
    if:
      type: text
      substr: loginusers.vdf
    unless:
      - id: well-known/tool/detection/malcontent::malcontent-defensive-scanner-context
      - id: well-known/game/steamtools::member
      - id: metadata/package/manifest/ecosystem/
  - id: config-vdf
    desc: Steam localconfig/config.vdf file access
    crit: suspicious
    conf: 0.8
    if:
      type: text
      regex: (^|[^A-Za-z0-9_])(local)?config\.vdf([^A-Za-z0-9_]|$)
    unless:
      - id: well-known/game/steam/
      - id: metadata/package/manifest/ecosystem/
      - id: metadata/package/testing/presence/harness::test-directory
      - type: text
        regex: 'Path\.home\(\).{0,120}Steam.{0,80}config\.vdf'
      - id: well-known/game/steamtools::member
      - id: well-known/game/steamtools::gameaccount-plugin
      - id: well-known/lib/network/steamkit2::library
  - id: steam-tokens-artifact
    desc: Steam token collection artifact
    crit: suspicious
    conf: 0.95
    if:
      type: text
      exact: Soft\Steam\steam_tokens.txt
composite_rules:
  - id: steam-cred-theft
    desc: Steam account config targeting
    crit: suspicious
    conf: 0.8
    all:
      - id: loginusers-vdf
      - id: config-vdf
    unless:
      - id: well-known/game/steamtools::member
