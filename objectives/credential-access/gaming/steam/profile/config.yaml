defaults:
  platforms: [windows, unix]
  for: [scripts, binaries, csharp]
  attack: T1555
traits:
  - id: steam-tokens-artifact
    desc: Steam token collection artifact
    crit: suspicious
    conf: 0.95
    if:
      type: text
      exact: Soft\Steam\steam_tokens.txt
composite_rules:
  - id: steam-cred-theft
    desc: Steam account config targeting
    crit: suspicious
    conf: 0.8
    all:
      - id: micro-behaviors/fs/path/application/gaming::steam-loginusers-file
      - id: micro-behaviors/fs/path/application/gaming::steam-config-file
    unless:
      - id: well-known/game/steamtools::member
