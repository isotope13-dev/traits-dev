              (uint16be(@getter[s]+17) - uint16be(@getter[s]+20)) == 101 and
              uint8(@getter[s]+58) == 0x11 and
              uint8(@getter[s]+61) == 0x11 and
              (uint16be(@getter[s]+59) - uint16be(@getter[s]+62)) == 99 and
              uint8(@getter[s]+86) == 0x11 and
              uint8(@getter[s]+89) == 0x11 and
              (uint16be(@getter[s]+87) - uint16be(@getter[s]+90)) == 101 and
              uint8(@getter[s]+128) == 0x11 and
              uint8(@getter[s]+131) == 0x11 and
