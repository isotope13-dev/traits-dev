# Inline StringBuilder.append(char) variant of the array-store getter selector.
# Constant-pool operands remain unresolved. Five immediate differences spell
# e/c/e/T/k at the positions in getAccessToken; every remaining instruction
# must have the same difference/char/append form and builder receiver.
defaults:
  platforms: [unix, windows]
  for: [class]
traits:
  - id: difference-built-token-getter-builder
    desc: Token-getter fragments and reflection
    crit: suspicious
    conf: 0.96
    attack: T1528,T1027
    if:
      type: yara
      source: |
        rule difference_token_getter_builder {
          strings:
            $reflect = "java/lang/reflect/Method"
            $invoke = "invoke"
            $access = "setAccessible"
            $builder = "java/lang/StringBuilder"
            $getter = {
              19 ?? ( 11 | 13 ) ?? ?? ( 11 | 13 ) ?? ?? 64 92 B6 ?? ?? 57
              19 ?? ( 11 | 13 ) ?? ?? ( 11 | 13 ) ?? ?? 64 92 B6 ?? ?? 57
              19 ?? ( 11 | 13 ) ?? ?? ( 11 | 13 ) ?? ?? 64 92 B6 ?? ?? 57
              19 ?? ( 11 | 13 ) ?? ?? ( 11 | 13 ) ?? ?? 64 92 B6 ?? ?? 57
              19 ?? ( 11 | 13 ) ?? ?? ( 11 | 13 ) ?? ?? 64 92 B6 ?? ?? 57
              19 ?? ( 11 | 13 ) ?? ?? ( 11 | 13 ) ?? ?? 64 92 B6 ?? ?? 57
              19 ?? ( 11 | 13 ) ?? ?? ( 11 | 13 ) ?? ?? 64 92 B6 ?? ?? 57
              19 ?? ( 11 | 13 ) ?? ?? ( 11 | 13 ) ?? ?? 64 92 B6 ?? ?? 57
              19 ?? ( 11 | 13 ) ?? ?? ( 11 | 13 ) ?? ?? 64 92 B6 ?? ?? 57
              19 ?? ( 11 | 13 ) ?? ?? ( 11 | 13 ) ?? ?? 64 92 B6 ?? ?? 57
              19 ?? ( 11 | 13 ) ?? ?? ( 11 | 13 ) ?? ?? 64 92 B6 ?? ?? 57
              19 ?? ( 11 | 13 ) ?? ?? ( 11 | 13 ) ?? ?? 64 92 B6 ?? ?? 57
              19 ?? ( 11 | 13 ) ?? ?? ( 11 | 13 ) ?? ?? 64 92 B6 ?? ?? 57
              19 ?? ( 11 | 13 ) ?? ?? ( 11 | 13 ) ?? ?? 64 92 B6 ?? ?? 57
