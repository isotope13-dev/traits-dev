# Decode immediate-built token-getter fragments, independent of the operands.
# The XOR form recovers metho?_1674; the subtraction form recovers ccessT at
# positions 4..9 of getAccessToken. Constant-pool characters remain unresolved.
# Reflection and invocation corroborate a probable getter lookup.
defaults:
  platforms: [windows, unix]
  for: [class]
traits:
  - id: arithmetic-built-token-getter-reflection
    desc: Arithmetic token-getter fragments and reflection
    crit: suspicious
    conf: 0.97
    attack: T1528,T1027
    if:
      type: yara
      source: |
        rule xor_built_minecraft_getter_reflection {
          strings:
            $reflect = "java/lang/reflect/Method"
            $invoke = "invoke"
            $access = "setAccessible"
            $selector = {
              19 ?? 03 11 ?? ?? 11 ?? ?? 82 92 55
              19 ?? 04 11 ?? ?? 11 ?? ?? 82 92 55
              19 ?? 05 11 ?? ?? 11 ?? ?? 82 92 55
              19 ?? 06 11 ?? ?? 11 ?? ?? 82 92 55
              19 ?? 07 11 ?? ?? 11 ?? ?? 82 92 55
              19 ?? 08 13 ?? ?? 13 ?? ?? 82 92 55
              19 ?? 10 06 11 ?? ?? 11 ?? ?? 82 92 55
              19 ?? 10 07 11 ?? ?? 11 ?? ?? 82 92 55
              19 ?? 10 08 11 ?? ?? 11 ?? ?? 82 92 55
              19 ?? 10 09 11 ?? ?? 11 ?? ?? 82 92 55
              19 ?? 10 0A 11 ?? ?? 11 ?? ?? 82 92 55
            }
            $difference = {
              19 ?? 07 11 ?? ?? 11 ?? ?? 64 92 55
              19 ?? 08 11 ?? ?? 11 ?? ?? 64 92 55
              19 ?? 10 06 11 ?? ?? 11 ?? ?? 64 92 55
              19 ?? 10 07 11 ?? ?? 11 ?? ?? 64 92 55
              19 ?? 10 08 11 ?? ?? 11 ?? ?? 64 92 55
              19 ?? 10 09 11 ?? ?? 11 ?? ?? 64 92 55
            }
          condition:
            uint32be(0) == 0xcafebabe and all of ($reflect, $invoke, $access) and
            (for any s in (1..#selector) : (
              (uint16be(@selector[s]+4) ^ uint16be(@selector[s]+7)) == 109 and
              (uint16be(@selector[s]+16) ^ uint16be(@selector[s]+19)) == 101 and
              (uint16be(@selector[s]+28) ^ uint16be(@selector[s]+31)) == 116 and
              (uint16be(@selector[s]+40) ^ uint16be(@selector[s]+43)) == 104 and
              (uint16be(@selector[s]+52) ^ uint16be(@selector[s]+55)) == 111 and
              (uint16be(@selector[s]+77) ^ uint16be(@selector[s]+80)) == 95 and
              (uint16be(@selector[s]+90) ^ uint16be(@selector[s]+93)) == 49 and
              (uint16be(@selector[s]+103) ^ uint16be(@selector[s]+106)) == 54 and
              (uint16be(@selector[s]+116) ^ uint16be(@selector[s]+119)) == 55 and
              (uint16be(@selector[s]+129) ^ uint16be(@selector[s]+132)) == 52 and
              uint8(@selector[s]+1) == uint8(@selector[s]+13) and
              uint8(@selector[s]+1) == uint8(@selector[s]+25) and
              uint8(@selector[s]+1) == uint8(@selector[s]+37) and
              uint8(@selector[s]+1) == uint8(@selector[s]+49) and
              uint8(@selector[s]+1) == uint8(@selector[s]+73) and
              uint8(@selector[s]+1) == uint8(@selector[s]+86) and
              uint8(@selector[s]+1) == uint8(@selector[s]+99) and
              uint8(@selector[s]+1) == uint8(@selector[s]+112) and
              uint8(@selector[s]+1) == uint8(@selector[s]+125)
            )) or
            (uint32be(0) == 0xcafebabe and all of ($reflect, $invoke, $access) and
              for any s in (1..#difference) : (
                (uint16be(@difference[s]+4) - uint16be(@difference[s]+7)) == 99 and
                (uint16be(@difference[s]+16) - uint16be(@difference[s]+19)) == 99 and
                (uint16be(@difference[s]+29) - uint16be(@difference[s]+32)) == 101 and
                (uint16be(@difference[s]+42) - uint16be(@difference[s]+45)) == 115 and
                (uint16be(@difference[s]+55) - uint16be(@difference[s]+58)) == 115 and
                (uint16be(@difference[s]+68) - uint16be(@difference[s]+71)) == 84 and
                uint8(@difference[s]+1) == uint8(@difference[s]+13) and
                uint8(@difference[s]+1) == uint8(@difference[s]+25) and
                uint8(@difference[s]+1) == uint8(@difference[s]+38) and
                uint8(@difference[s]+1) == uint8(@difference[s]+51) and
                uint8(@difference[s]+1) == uint8(@difference[s]+64)
              )
            )
        }
