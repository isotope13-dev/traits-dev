# Minecraft's intermediary-mapped session API exposes the live access token
# directly to client mods. Profile identity calls live under well-known/game;
# this objective begins only at the credential-bearing token getter.
defaults:
  platforms: [unix, windows]
  for: [class, java_class]
  attack: T1528
  mbc: B0006

traits:
  - id: minecraft-token-getter-ref
    desc: Minecraft access token getter
    crit: notable
    conf: 0.92
    if:
      type: import
      exact: net/minecraft/class_320.method_1674

  - id: minecraft-session-getter-sess
    desc: Minecraft session getter helper
    crit: notable
    conf: 0.96
    if:
      type: value
      path: class.strings[*]
      exact: getSess

  - id: minecraft-session-getter-tok
    desc: Minecraft token getter helper
    crit: notable
    conf: 0.96
    if:
      type: value
      path: class.strings[*]
      exact: getTok

composite_rules:
  - id: minecraft-session-token-access
    desc: Minecraft session token and UUID access
    crit: suspicious
    conf: 0.96
    all:
      - id: well-known/game/mod::minecraft-session-access
      - id: minecraft-token-getter-ref
      - id: well-known/game/mod::minecraft-uuid-getter-ref

  - id: minecraft-token-child-process-stage
    desc: Session token handed to spawned child process
    crit: hostile
    conf: 0.99
    attack: "T1528, T1059"
    for: [jar, zip, class, java_class]
    scope: archive
    all:
      - id: minecraft-session-token-access
      - id: micro-behaviors/data/encode/base64::jvm-base64-encode-bytecode
      - id: micro-behaviors/process/create/subprocess::java-processbuilder-start-bytecode
      - id: micro-behaviors/process/fd/stdio::java-processbuilder-redirected-stdio

  # Session data reached through the live client singleton (named or
  # intermediary mappings, getters possibly hidden behind arithmetic) and
  # packaged for a detached child JVM. Base64-wrapping the session into a
  # spawned process command line with redirected stdio is a credential
  # handoff, not gameplay; benign mods never pass the token to a child.
  - id: minecraft-session-child-handoff
    desc: Client session access encoded into spawned child process
    crit: hostile
    conf: 0.97
    attack: "T1528,T1059,T1027"
    for: [jar, zip, class, java_class]
    scope: archive
    all:
      - id: well-known/game/mod::minecraft-session-access
      - id: micro-behaviors/data/encode/base64::jvm-base64-encode-bytecode
      - id: micro-behaviors/process/create/subprocess::java-processbuilder-start-bytecode
      - id: micro-behaviors/process/fd/stdio::java-processbuilder-redirected-stdio

  - id: minecraft-reflective-session-access
    desc: Fabric client reads Minecraft session fields through reflection
    crit: hostile
    conf: 0.98
    for: [jar, zip, class]
    scope: archive
    all:
      - id: metadata/package/config::fabric-mod-metadata
      - id: metadata/import/framework::minecraft-named-client-ref
      - id: minecraft-session-getter-sess
      - id: minecraft-session-getter-tok
      - id: micro-behaviors/metaprogramming/reflection::java-class-forname-bytecode
      - id: micro-behaviors/metaprogramming/reflection::java-class-getmethod-bytecode
      - id: micro-behaviors/metaprogramming/reflection::java-method-invoke-bytecode
      - id: "micro-behaviors/metaprogramming/reflection::set-accessible-reference"
    any:
      - id: well-known/game/mod::minecraft-uuid-getter-ref
      - id: metadata/lang/source/naming/function::jvm-getid-name
    needs: 1

  - id: native-minecraft-session-xor-c2-stealer
    desc: Native Minecraft session theft with XOR C2 URL
    crit: hostile
    conf: 0.98
    attack: T1528,T1071.001,T1027
    for: [pe, dll]
    all:
      - id: well-known/game/mod::minecraft-client-class-native-text
      - id: well-known/game/mod::minecraft-session-token-method-native-text
      - id: micro-behaviors/communications/http/url/external-ip::url-external-ip-xor-binary

  # method_1676 is the profile-name getter, a separate JNI call from the
  # token method. Both are copied out and the XOR URL is the exfil endpoint.
  - id: native-minecraft-profile-name-xor-exfil
    desc: Native profile name and token exfil
    crit: hostile
    conf: 0.97
    attack: T1528,T1071.001
    for: [pe, dll]
    all:
      - id: well-known/game/mod::minecraft-client-class-native-text
      - id: well-known/game/mod::minecraft-session-token-method-native-text
      - id: well-known/game/mod::minecraft-profile-name-method-native-text
      - id: micro-behaviors/communications/http/url/external-ip::url-external-ip-xor-binary
