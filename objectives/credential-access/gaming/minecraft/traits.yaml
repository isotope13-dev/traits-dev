# Minecraft's intermediary-mapped session API exposes the live access token
# directly to client mods. Profile identity calls live under well-known/game;
# this objective begins only at the credential-bearing token getter.
defaults:
  platforms: [unix, windows]
  for: [class, java_class, jar, zip]
  attack: T1528
  mbc: B0006

traits:
  - id: minecraft-token-getter-ref
    desc: Minecraft access token getter
    crit: notable
    conf: 0.92
    if:
      type: import
      exact: net/minecraft/class_320.method_1674

  - id: minecraft-named-client-ref
    desc: Named Minecraft client class reference
    crit: notable
    conf: 0.9
    if:
      type: import
      exact: net/minecraft/client/Minecraft

  - id: minecraft-session-getter-sess
    desc: Minecraft session getter helper
    crit: notable
    conf: 0.96
    if:
      type: value
      path: class.strings[*]
      exact: getSess

  - id: minecraft-session-getter-tok
    desc: Minecraft token getter helper
    crit: notable
    conf: 0.96
    if:
      type: value
      path: class.strings[*]
      exact: getTok

  - id: minecraft-session-getter-id
    desc: Minecraft account ID getter helper
    crit: notable
    conf: 0.96
    if:
      type: value
      path: class.strings[*]
      exact: getId

  - id: minecraft-gson-profile-builder
    desc: Gson builds a Minecraft profile object
    crit: notable
    conf: 0.9
    if:
      type: import
      exact: com/google/gson/JsonObject.addProperty

composite_rules:
  - id: minecraft-session-token-access
    desc: Minecraft session token and UUID access
    crit: suspicious
    conf: 0.96
    all:
      - id: well-known/game/mod::minecraft-session-access
      - id: minecraft-token-getter-ref
      - id: well-known/game/mod::minecraft-uuid-getter-ref

  - id: minecraft-token-child-process-stage
    desc: Minecraft token access alongside redirected child launch
    crit: hostile
    conf: 0.99
    attack: "T1528, T1059"
    for: [class, java_class]
    scope: leaf
    all:
      - id: minecraft-session-token-access
      - id: micro-behaviors/data/encode/base64::jvm-base64-encode-bytecode
      - id: micro-behaviors/process/create/spawn::java-processbuilder-start-bytecode
      - id: micro-behaviors/process/io/stream::java-processbuilder-redirected-stdio

  - id: minecraft-reflective-session-access
    desc: Fabric client reads Minecraft session fields through reflection
    crit: hostile
    conf: 0.98
    for: [jar, zip]
    scope: archive
    all:
      - id: metadata/package/config::fabric-mod-metadata
      - id: minecraft-named-client-ref
      - id: minecraft-session-getter-sess
      - id: minecraft-session-getter-tok
      - id: minecraft-session-getter-id
      - id: micro-behaviors/data/source/dynamic/reflect::java-class-forname-bytecode
      - id: micro-behaviors/data/source/dynamic/reflect::java-class-getmethod-bytecode
      - id: micro-behaviors/data/source/dynamic/reflect::java-method-invoke-bytecode
      - id: micro-behaviors/data/source/dynamic/reflect::set-accessible-reference
