composite_rules:
- platforms:
  - unix
  - windows
  id: minecraft-token-jar-handoff
  desc: Minecraft token JSON handed to reflected in-memory JAR class
  crit: hostile
  conf: 0.98
  attack: T1528,T1027
  for: [jar, zip, class, java_class]
  scope: archive
  all:
  - id: metadata/import/framework::minecraft-token-getter-ref
  - id: micro-behaviors/data/format/json::gson-jsonobject-add-property
  - id: micro-behaviors/data/serialize/json::jvm-gson-serialization-method-reference
  - id: micro-behaviors/metaprogramming/reflection/inspect/member::java-method-invoke-bytecode
  # Custom in-memory loaders either call ClassLoader.loadClass directly or
  # resolve and call ClassLoader.defineClass reflectively across members.
  any:
  - id: micro-behaviors/process/interpreter/runtime/jvm::in-memory-jar-entry-classload-archive
  - id: micro-behaviors/process/interpreter/runtime/jvm::in-memory-jar-entry-classload
