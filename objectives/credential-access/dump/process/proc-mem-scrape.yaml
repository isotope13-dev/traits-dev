# Process Memory/Environment Scraping via /proc
# Reads /proc/PID/maps+mem to dump process memory, or /proc/PID/environ
# to harvest environment variables. Used to extract secrets from CI runners.
# ATT&CK: T1003.007 (Proc Filesystem)
defaults:
  for: [python, shell, javascript]
  platforms: [unix]
  attack: T1003.007
traits:
  # GitHub Actions Runner.Worker serializes loaded secrets with an isSecret
  # boolean.  The exact record field is stable across scraper languages, while
  # the surrounding regex/parser syntax is not.
  - id: github-runner-secret-record-marker
    desc: GitHub runner secret-record field marker
    crit: component
    conf: 0.98
    for: [scripts, source, binaries, -beam, -wasm, -pyc, -staticlib, -elixir, -clojure]
    if:
      type: string_literal
      regex: '(?i)isSecret["'']?\s*[:=]\s*true'
  - id: python-proc-memory-secret-search
    desc: Python searches process memory for secrets
    # A regex over decoded /proc memory for token/secret/api_key is a notable
    # collection primitive used by scanners and demos; hostility requires the
    # scrape composite plus an exfiltration sink.
    crit: notable
    conf: 0.9
    for: [python]
    if:
      type: text
      regex: 're\.findall[\s\S]{0,100}(token|secret|api[_-]?key)[\s\S]{0,100}(blob|memory)\.decode'
      case_insensitive: true
composite_rules:
  - id: github-runner-process-memory-secret-dump
    desc: Scrapes a GitHub Actions runner process for secrets
    crit: hostile
    conf: 0.99
    attack: T1003.007,T1552.001,T1195.002
    for: [scripts, source, binaries]
    near_lines: 80
    all:
      - id: metadata/build/github-actions::github-runner-worker
      - id: micro-behaviors/fs/proc/info/path::process-variable-pid-maps
      - id: micro-behaviors/fs/proc/info/path::process-variable-pid-mem
      - id: github-runner-secret-record-marker
  - id: ci-runner-memory-and-file-secret-sweep
    desc: Sweeps runner memory and credential files
    crit: hostile
    conf: 0.995
    attack: T1003.007,T1552.001
    for: [scripts, source, binaries]
    all:
      - id: github-runner-process-memory-secret-dump
    any:
      - id: micro-behaviors/fs/path/sensitive/credentials::ssh-private-key-filename-enum
      - id: micro-behaviors/os/container/runtime::serviceaccount-files
      - id: micro-behaviors/os/container/runtime::k8s-service-account-path
      - id: objectives/credential-access/cloud/container::python-serviceaccount-path-reference
  - id: proc-memory-cmdline-credential-dump
    desc: Walks /proc cmdline and dumps process memory
    crit: hostile
    conf: 0.99
    all:
      - id: proc-memory-credential-dump
      - id: micro-behaviors/fs/proc/info/listing::python-proc-enumerate-cmdline
  - id: proc-environ-cmdline-harvest
    desc: Harvests both process environ and cmdline
    crit: hostile
    conf: 0.95
    all:
      - id: micro-behaviors/fs/proc/info/path::process-environ-targeting
      - id: micro-behaviors/fs/proc/info/path::proc-pid-cmdline-glob
  - id: proc-environ-exfil-c2
    desc: Harvests process environ and contacts HTTP C2
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/fs/proc/info/path::process-environ-targeting
      - id: objectives/command-and-control/beacon/network/http::direct-http-c2-ip-url
  - id: proc-enumeration-memory-credential-dump
    desc: Enumerates Linux processes and dumps process memory
    crit: hostile
    conf: 0.95
    all:
      - id: proc-memory-credential-dump
      - id: micro-behaviors/fs/proc/info/listing::python-proc-enumerate
      - id: micro-behaviors/fs/proc/info/path::python-proc-path-join
  - id: proc-memory-credential-dump
    desc: Dumps process memory via /proc for credential theft
    crit: suspicious
    conf: 0.9
    all:
      - id: micro-behaviors/fs/proc/info/path::process-memory-dumper
    any:
      - id: metadata/build/github-actions::github-runner-worker
      - id: github-runner-secret-record-marker
      - id: python-proc-memory-secret-search
    unless:
      # AI-agent observability tools read /proc to monitor agent processes;
      # security scanners reference these paths as signatures.
      - id: well-known/tool/detection/ai-guardrail/
  - id: python-proc-memory-credential-scrape
    desc: Python sweeps process memory for credential markers
    # /proc/*/mem glob plus a credential regex is suspicious collection, not
    # proven theft — hostile CI-runner scrapers add runner-specific markers
    # and exfil sinks in sibling composites.
    crit: suspicious
    conf: 0.94
    attack: T1003.007,T1552.001
    for: [python]
    all:
      - id: micro-behaviors/fs/proc/info/path::python-proc-memory-glob
      - id: python-proc-memory-secret-search
    near_bytes: 256
  - id: proc-environ-harvest
    desc: Targets process environ with secret context
    crit: suspicious
    conf: 0.88
    # Join the credential marker to the /proc environ read that consumes it.
    # Without proximity, unrelated UI/session tokens anywhere in a large
    # source file turn ordinary process inspection into credential harvesting.
    near_lines: 20
    all:
      - id: micro-behaviors/fs/proc/info/path::process-environ-targeting
    any:
      - id: micro-behaviors/os/env/vars/credentials/
      - id: objectives/credential-access/env/secrets/filtered-access/
      - id: micro-behaviors/os/env/vars/credentials::python-sensitive-env-read
    unless:
      - id: well-known/tool/offensive/pentestkit/
      - id: well-known/tool/detection/ai-guardrail/
      - id: well-known/app/infrastructure/walinuxagent::source-tree
