# Offline processing of an LSASS minidump through Mimikatz. The command works
# on a dump created by any acquisition method, so this objective deliberately
# composes the command and dump target rather than depending on ProcDump or
# comsvcs-specific acquisition markers.
defaults:
  platforms: [windows]
  for: [scripts]
  attack: T1003.001

composite_rules:
  - id: mimikatz-offline-lsass-dump
    desc: Processes an LSASS minidump with Mimikatz
    crit: hostile
    conf: 0.99
    all:
      - id: well-known/tool/offensive/mimikatz::sekurlsa-minidump-script
      - id: lsass-memory-dump-target
    near_bytes: 260
