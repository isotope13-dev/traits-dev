# Credential access via the Windows Error Reporting leak-diagnostic tool.
#
# rdrleakdiag.exe is the signed diagnostic binary Windows ships for memory-leak
# triage: pointed at a PID with -p it writes a full user-mode dump of that
# process into the folder given with -o. It yields the same LSASS payload as
# comsvcs MiniDump or ProcDump without touching a dump API, which is why it
# shows up when an operator wants credentials "using legitimate Windows tools"
# (accessibility utilities, task manager and error reporting services were the
# LSASS vectors named in Prophet Security's May-July 2026 quarterly report).
defaults:
  platforms: [windows]
  for: [scripts, binaries]
  attack: T1003.001
  mbc: B0005

traits:
  - id: rdrleakdiag-process-dump-command
    desc: rdrleakdiag dumps a process by PID
    crit: suspicious
    conf: 0.96
    if:
      type: text
      # -p takes the target PID: a literal digit or a shell/PowerShell
      # variable holding one resolved at runtime.
      regex: '(?i)\brdrleakdiag(\.exe)?\b[^\r\n;&|]{0,120}\s+-p\s+(\d+|%[A-Za-z_]\w*%|\$\w+)'

composite_rules:
  - id: rdrleakdiag-lsass-dump
    desc: Dumps LSASS via the Windows Error Reporting leak-diagnostic tool
    crit: hostile
    conf: 0.98
    all:
      - id: rdrleakdiag-process-dump-command
    any:
      - id: objectives/credential-access/dump/process::tasklist-lsass-filter
      - id: micro-behaviors/process/lifecycle/supervise::watchdog-process-filter
    near_lines: 40
