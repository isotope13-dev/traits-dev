defaults:
  platforms: [unix]
  for: [python, javascript, npm, tar]
composite_rules:
  - id: github-runner-fragmented-memory-secret-dump
    desc: Runner secrets with procfs memory dumping
    crit: hostile
    conf: 0.98
    attack: T1003.007,T1552.001
    scope: archive
    all:
      - id: micro-behaviors/fs/proc/memory::python-fragmented-proc-memory-dump
      - id: well-known/tool/sysadmin/github-runner::worker
      - id: objectives/credential-access/dump/process::github-runner-secret-record-marker
