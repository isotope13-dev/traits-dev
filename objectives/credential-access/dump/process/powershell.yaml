defaults:
  platforms: [windows]
  for: [powershell]
  attack: T1003.001
  mbc: B0005

traits:
  - id: powershell-fragmented-minidump-api
    desc: Fragmented MiniDumpWriteDump API name
    crit: notable
    conf: 0.96
    if:
      type: text
      regex: "(?i)MiniDum['\"+]{1,8}pWriteDump"

  - id: powershell-fragmented-nativemethods
    desc: Fragmented NativeMethods nested type
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: "(?i)GetNestedType\\s*\\(\\s*['\"]Nativ['\"+]{1,8}eMethods"

composite_rules:
  - id: powershell-lsass-minidump-reflection
    desc: PowerShell dumps LSASS via MiniDump
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/process/enumerate/shell::powershell-get-process-lsass
      - id: powershell-fragmented-minidump-api

  - id: powershell-wer-nativemethods-minidump
    desc: WER NativeMethods MiniDump reflection
    crit: hostile
    conf: 0.97
    all:
      - id: powershell-fragmented-nativemethods
      - id: powershell-fragmented-minidump-api
      - id: micro-behaviors/process/enumerate/shell::powershell-get-process-lsass

  - id: powershell-lsass-dump-filestream
    desc: LSASS dump written through FileStream
    crit: hostile
    conf: 0.96
    all:
      - id: micro-behaviors/process/enumerate/shell::powershell-get-process-lsass
      - id: micro-behaviors/fs/file/open::powershell-io-filestream-constructor
      - id: powershell-fragmented-minidump-api

  # Plain (unfragmented) MiniDumpWriteDump name resolved at runtime, e.g.
  # via GetProcAddress/GetDelegateForFunctionPointer, aimed at LSASS.
  # The fragmented sibling above misses scripts that keep the API name
  # intact and hide it behind dynamic resolution instead.
  - id: powershell-lsass-minidump-direct
    desc: PowerShell dumps LSASS via named MiniDump API
    crit: hostile
    conf: 0.97
    unless:
      - id: metadata/file/format/log::windows-event-csv-records
    all:
      - id: micro-behaviors/process/enumerate/shell::powershell-get-process-lsass
      - id: micro-behaviors/process/debug/dump::minidump-write-dump-name
