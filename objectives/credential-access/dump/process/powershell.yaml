defaults:
  platforms: [windows]
  for: [powershell]
  attack: T1003.001
  mbc: B0005

traits:
  - id: powershell-get-process-lsass
    desc: PowerShell targets the LSASS process
    crit: suspicious
    conf: 0.96
    if:
      type: text
      regex: '(?i)Get-Process\s+(-\w+\s+)?lsass\b'

  - id: powershell-fragmented-minidump-api
    desc: Fragmented MiniDumpWriteDump API name
    crit: notable
    conf: 0.96
    if:
      type: text
      regex: "(?i)MiniDum['\"+]{1,8}pWriteDump"

  - id: powershell-fragmented-nativemethods
    desc: Fragmented NativeMethods nested type
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: "(?i)GetNestedType\\s*\\(\\s*['\"]Nativ['\"+]{1,8}eMethods"

  - id: powershell-minidump-filestream
    desc: Creates a minidump FileStream
    crit: notable
    conf: 0.92
    if:
      type: text
      regex: '(?i)New-Object\s+IO\.FileStream\s*\('

composite_rules:
  - id: powershell-lsass-minidump-reflection
    desc: PowerShell dumps LSASS via MiniDump
    crit: hostile
    conf: 0.98
    all:
      - id: powershell-get-process-lsass
      - id: powershell-fragmented-minidump-api

  - id: powershell-wer-nativemethods-minidump
    desc: WER NativeMethods MiniDump reflection
    crit: hostile
    conf: 0.97
    all:
      - id: powershell-fragmented-nativemethods
      - id: powershell-fragmented-minidump-api
      - id: powershell-get-process-lsass

  - id: powershell-lsass-dump-filestream
    desc: LSASS dump written through FileStream
    crit: hostile
    conf: 0.96
    all:
      - id: powershell-get-process-lsass
      - id: powershell-minidump-filestream
      - id: powershell-fragmented-minidump-api
