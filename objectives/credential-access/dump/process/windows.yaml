defaults:
  for:
  - pe
  - dll
  platforms:
  - windows
  attack: T1003.001
  mbc: B0005
traits:
- id: lsass-system-path
  desc: LSASS system path reference
  crit: suspicious
  conf: 0.92
  if:
    type: text
    regex: (?i)systemroot[/\\]+system32[/\\]+lsass\.exe
  unless:
  - id: well-known/app/utility/360-file-guard::360-file-guard-identity
- id: minidump-write-dump
  desc: MiniDumpWriteDump dump API fragment
  crit: component
  conf: 0.85
  if:
    type: symbol
    exact: MiniDumpWriteDump
- id: minidump-write-dump-name
  desc: References MiniDump credential-dump API
  crit: notable
  conf: 0.9
  if:
    type: text
    word: MiniDumpWriteDump
composite_rules:
- id: lsass-memory-target
  desc: LSASS memory access target
  crit: suspicious
  conf: 0.94
  any:
  - id: objectives/privilege-escalation/process-injection::lsass-target
  - id: lsass-system-path
  unless:
  - id: well-known/app/utility/siw::siw-family-identity
- id: lsass-memory-scrape
  desc: LSASS process memory credential scraping
  crit: suspicious
  conf: 0.97
  all:
  - id: lsass-system-path
  - id: micro-behaviors/process/enumerate/snapshot::create-toolhelp32-snapshot
  - id: micro-behaviors/process/create/spawn::open-process
  - id: micro-behaviors/process/inject/runtime/call::read-process-memory
  unless:
  - id: metadata/signed/platform/
- id: minidump-admin-process-dump
  desc: Elevated MiniDump process dumping
  crit: suspicious
  conf: 0.95
  all:
  - id: minidump-write-dump
  - id: micro-behaviors/os/privilege/manifest::admin-manifest
  any:
  - id: lsass-memory-target
  - id: micro-behaviors/process/create/spawn::open-process
  unless:
  - id: metadata/signed/platform/
- id: lsass-memory-scrape-loader
  desc: LSASS scraping loader behavior
  crit: hostile
  conf: 0.99
  all:
  - id: lsass-memory-scrape
  any:
  - id: objectives/evasion/process/injection/hollowing::mstsc-ppid-loader
  - id: objectives/anti-static/obfuscation/payload/section::encrypted-loader-data-geometry
  - id: micro-behaviors/crypto/library/provider::capi-keyed-buffer-crypto-chain
- id: mimilove-lsass-process-access
  desc: Mimilove opens targeted LSASS process
  crit: hostile
  conf: 0.98
  mbc: E1003
  all:
  - id: well-known/tool/offensive/mimikatz::mimilove-identity
  - id: objectives/privilege-escalation/process-injection::lsass-target
  - id: micro-behaviors/process/create/spawn::open-process
# Generic MiniDump route to the same goal: the binary references the
# MiniDumpWriteDump API (import table or plain strings, which is how .NET
# P/Invoke and packed samples carry it) and names LSASS or a `*.dmp` output.
# Unsigned only — signed dump utilities are identified separately.
- id: minidump-lsass-memory-dump
  desc: LSASS memory dump via MiniDump API
  crit: hostile
  conf: 0.98
  # Both legs must come from one binary: a dumper does not span programs.
  # Without this, an installer that bundles a crash reporter (MiniDump API
  # plus its own crashdump.dmp vocabulary, e.g. SIW's CrashRpt-based
  # CrashSender1500.exe beside siw7-x64.exe) pools into a phantom LSASS dump.
  scope: file
  all:
  - id: lsass-memory-dump-target
  any:
  - id: minidump-write-dump
  - id: minidump-write-dump-name
  unless:
  - id: metadata/signed/platform/
  - id: well-known/app/utility/siw::siw-family-identity
