defaults:
  for:
  - pe
  - dll
  platforms:
  - windows
  attack: T1003.001
  mbc: B0005
composite_rules:
- id: lsass-memory-scrape
  desc: LSASS process memory credential scraping
  crit: suspicious
  conf: 0.97
  all:
  - id: micro-behaviors/fs/path/system::lsass-system-path
  - id: micro-behaviors/process/enumerate/snapshot::create-toolhelp32-snapshot
  - id: micro-behaviors/process/attach/rights::open-process
  - id: micro-behaviors/process/inject/runtime/call::read-process-memory
  unless:
  - id: metadata/signed/platform/
- id: minidump-admin-process-dump
  desc: Elevated MiniDump process dumping
  crit: suspicious
  conf: 0.95
  all:
  - id: micro-behaviors/process/debug/dump::minidump-write-dump-symbol
  - id: micro-behaviors/os/privilege/manifest::admin-manifest
  any:
  - id: micro-behaviors/process/info/name::lsass-process-reference
  - id: micro-behaviors/process/attach/rights::open-process
  unless:
  - id: metadata/signed/platform/
- id: service-lsass-memory-dumper
  desc: Service accesses LSASS process memory
  crit: suspicious
  conf: 0.97
  # The dispatch triplet means the code RUNS as a service (dispatcher,
  # control handler, status reporter) -- not a manager that merely opens
  # or stops other services. An unsigned service image that also targets
  # LSASS memory is a dumper or injector service; EDR and admin services
  # name LSASS too, but they ship signed.
  all:
  - id: micro-behaviors/os/service/dispatch::service-dispatch-triad
  - id: micro-behaviors/process/info/name::lsass-process-reference
  any:
  - id: micro-behaviors/process/inject/runtime/call::read-process-memory
  - id: micro-behaviors/process/inject/runtime/call::write-process-memory-binary
  unless:
  - id: metadata/signed/platform/

  downgrade:
    any:
      - id: well-known/dual-use/credentials/fgdump::credential-auditing-tool-context
- id: lsass-memory-scrape-loader
  desc: LSASS scraping loader behavior
  crit: hostile
  conf: 0.99
  all:
  - id: lsass-memory-scrape
  any:
  - id: objectives/evasion/process/injection/hollowing/process::mstsc-ppid-loader
  - id: objectives/anti-static/obfuscation/payload/section/content::encrypted-loader-data-geometry
  - id: micro-behaviors/crypto/library/cryptoapi::capi-keyed-buffer-crypto-chain
- id: mimilove-lsass-process-access
  desc: Mimilove opens targeted LSASS process
  crit: hostile
  conf: 0.98
  mbc: E1003
  all:
  - id: well-known/tool/offensive/mimikatz::mimilove-identity
  - id: micro-behaviors/process/info/name::lsass-target-token
  - id: micro-behaviors/process/attach/rights::open-process
# Generic MiniDump route to the same goal: the binary references the
# MiniDumpWriteDump API (import table or plain strings, which is how .NET
# P/Invoke and packed samples carry it) and names the LSASS process. A generic crashdump path is insufficient.
# Unsigned only — signed dump utilities are identified separately.
- id: minidump-lsass-memory-dump
  desc: LSASS memory dump via MiniDump API
  crit: hostile
  conf: 0.98
  # Both legs must come from one binary: a dumper does not span programs.
  # Without this, an installer that bundles a crash reporter (MiniDump API
  # plus its own crashdump.dmp vocabulary, e.g. SIW's CrashRpt-based
  # CrashSender1500.exe beside siw7-x64.exe) pools into a phantom LSASS dump.
  scope: file
  all:
  - id: micro-behaviors/process/info/name::lsass-target-token
  any:
  - id: micro-behaviors/process/debug/dump::minidump-write-dump-symbol
  - id: micro-behaviors/process/debug/dump::minidump-write-dump-name
  unless:
  - id: metadata/signed/platform/
  - id: well-known/app/utility/siw::siw-family-identity
  # The OS DLL that implements MiniDumpWriteDump names both legs by design:
  # KernelBase carries the API string and LSASS-management strings, but it
  # is the dump provider, not a dumper. Same provider exclusion the
  # lsass-memory-target composite already uses.
  - id: metadata/lang/upstream::windows-system-implementer-dll
  - id: well-known/lib/platform/microsoft-imagehlp/
  # The Aha sandbox lists lsass.exe and declares MiniDumpWriteDump as an API name.
  - id: well-known/app/ai/trae::aha-sandbox-pdb
  # File infectors can append unrelated whole PE programs. Their pooled facts
  # must not combine an LSASS string in one host with MiniDump in another.
  - id: metadata/binary/layout/embedded::repeated-standard-pe-images
  # An anti-malware engine names both legs for its day job: it scans and
  # protects LSASS, and it carries MiniDumpWriteDump for its own crash
  # reporting. IObit Malware Fighter's IMFsrv.exe is Authenticode-signed by
  # IObit and identified by company/product metadata, which is what this
  # exception rests on -- not on the API pair, which is genuinely there.
  - id: well-known/app/system/iobit::iobit-component-context
