defaults:
  platforms: [windows]
  for: [scripts, binaries]
  attack: T1003.001
  mbc: B0005

traits:
  - id: procdump-full-memory-eula-flags
    desc: Full-memory dump flags with EULA acceptance
    crit: suspicious
    conf: 0.96
    if:
      type: text
      regex: '(?i)(\s+-accepteula\b[^\r\n]{0,120}\s+-ma\b|\s+-ma\b[^\r\n]{0,120}\s+-accepteula\b)'
    unless:
      - id: well-known/tool/offensive/bingo/
  - id: lsass-memory-dump-target
    desc: LSASS or dump-file target reference
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: '(?i)\b(lsass(\.exe)?|[A-Za-z]:\\[^\r\n\\]{0,120}\.dmp)\b'
    unless:
      - id: well-known/app/utility/siw::siw-family-identity
      # A non-lsass executable inside a directory named lsass is a masquerade
      # drop path (a worm's system32\lsass\svhost.exe), never the LSASS
      # process a dumper would target. The engine has no lookaround, so the
      # lsass.exe self-name is kept out by its initial instead.
      - type: text
        regex: '(?i)\\lsass\\[^\\\r\nl][^\\\r\n]{0,60}\.exe\b'

composite_rules:
  - id: comsvcs-lsass-memory-dump
    desc: LSASS memory dump through comsvcs
    crit: hostile
    conf: 0.99
    all:
      - id: lsass-memory-dump-target
      - id: micro-behaviors/mem/read/dump::comsvcs-dump
    near_bytes: 160
  - id: procdump-style-lsass-dump
    desc: ProcDump-style LSASS memory dump
    crit: hostile
    conf: 0.99
    all:
      - id: procdump-full-memory-eula-flags
      - id: lsass-memory-dump-target
    near_lines: 2
