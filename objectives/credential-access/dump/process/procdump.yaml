defaults:
  platforms: [windows]
  for: [scripts, binaries]
  attack: T1003.001
  mbc: B0005

traits:
  - id: procdump-full-memory-eula-flags
    desc: Full-memory dump flags with EULA acceptance
    crit: suspicious
    conf: 0.96
    if:
      type: text
      regex: '(?i)(\s+-accepteula\b[^\r\n]{0,120}\s+-ma\b|\s+-ma\b[^\r\n]{0,120}\s+-accepteula\b)'

  - id: lsass-memory-dump-target
    desc: Targets LSASS or writes a dump file
    crit: suspicious
    conf: 0.94
    if:
      type: text
      regex: '(?i)\b(lsass(\.exe)?|[A-Za-z]:\\[^\r\n]{0,120}\.dmp)\b'

composite_rules:
  - id: renamed-procdump-lsass-dump
    desc: Renamed ProcDump-style LSASS memory dump
    crit: hostile
    conf: 0.99
    attack: T1003.001,T1036.007
    all:
      - id: procdump-full-memory-eula-flags
      - id: lsass-memory-dump-target
    near_lines: 2
