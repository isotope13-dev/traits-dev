defaults:
  platforms: [windows]
  for: [scripts, binaries]
  attack: T1003.001
  mbc: B0005

traits:
  # Relocated from objectives/credential-access/wallet/crypto/vespy-grabber.yaml:
  # procdump acquisition/execution are generic credential-dumping primitives
  # (T1003.001), not wallet behavior. Scope preserved from the previous home.
  - id: procdump-download
    desc: Procdump tool download
    crit: suspicious
    conf: 0.95
    for: [python]
    platforms: [unix, windows]
    unless:
      - id: well-known/app/system/anthropic-cybersecurity-skills::defensive-cybersecurity-skills-repository
      - id: metadata/build/generated::generated-attack-map-context
      - id: well-known/tool/detection/
    if:
      type: text
      regex: '(?i)(https?://|cdn\.discordapp)[^\s"''<>]{0,160}\bprocdump(\.exe)?\b'
composite_rules:
  - id: procdump-style-lsass-dump
    desc: ProcDump-style LSASS memory dump
    crit: hostile
    conf: 0.99
    unless:
      - id: metadata/file/format/log::windows-event-csv-records
    all:
      - id: micro-behaviors/process/debug/dump::procdump-full-memory-eula-flags
      - id: micro-behaviors/process/info/name::lsass-target-token
    near_lines: 2
