# LSASS memory dump via rundll32 comsvcs.dll MiniDump — living-off-the-land
# credential access used by Medusa and many ransomware affiliates.
defaults:
  platforms: [windows]
  for: [batch, powershell, scripts]
  attack: T1003.001
  mbc: B0005

traits:
  - id: rundll32-comsvcs-minidump
    desc: rundll32 invokes comsvcs MiniDump
    crit: suspicious
    conf: 0.97
    if:
      type: text
      regex: '(?i)\brundll32(\.exe)?\b[^\r\n]{0,120}\bcomsvcs\.dll\b[^\r\n]{0,80}MiniDump'

  - id: tasklist-lsass-filter
    desc: tasklist filters for lsass.exe
    crit: suspicious
    conf: 0.93
    if:
      type: text
      regex: '(?i)\btasklist\b[^\r\n]{0,80}\blsass\.exe\b'

composite_rules:
  - id: comsvcs-lsass-minidump
    desc: Dumps LSASS via comsvcs MiniDump
    crit: hostile
    conf: 0.98
    all:
      - id: rundll32-comsvcs-minidump
    any:
      - id: tasklist-lsass-filter
      - id: micro-behaviors/process/lifecycle/supervise::watchdog-process-filter
