# LSASS memory dump via rundll32 comsvcs.dll MiniDump — living-off-the-land
# credential access used by Medusa and many ransomware affiliates.
defaults:
  platforms: [windows]
  for: [batch, powershell, scripts]
  attack: T1003.001
  mbc: B0005

traits:
  - id: tasklist-lsass-filter
    desc: tasklist filters for lsass.exe
    crit: suspicious
    conf: 0.93
    if:
      type: text
      regex: '(?i)\btasklist\b[^\r\n]{0,80}\blsass\.exe\b'

composite_rules:
  - id: comsvcs-lsass-minidump
    desc: Dumps LSASS via comsvcs MiniDump
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/mem/read/dump::comsvcs-dump
      - id: tasklist-lsass-filter
    near_lines: 4
