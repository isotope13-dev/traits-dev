# A password-filter callback set is a supported Windows extension point, but
# registering it under LSA and pairing it with credentialed mail transport is
# a concrete credential-harvesting pattern. Keep the registration-only fact
# suspicious so legitimate enterprise password filters remain reviewable.
defaults:
  platforms: [windows]
  for: [csharp, powershell, c, cpp, pe, dll]

composite_rules:
  - id: windows-password-filter-credential-harvesting
    desc: LSA password filter registered to receive password changes
    crit: suspicious
    conf: 0.99
    attack: T1556.002
    all:
      - id: micro-behaviors/os/security/lsa::password-filter-callback-set
    any:
      - id: objectives/persistence/system/registry/surface::lsa-auth-package-registry
      - id: objectives/persistence/system/registry/surface::lsa-notification-package-source

  - id: windows-password-filter-ews-credential-exfiltration
    desc: LSA password filter forwards captured credentials through Exchange
    crit: hostile
    conf: 0.99
    attack: T1003,T1041
    all:
      - id: micro-behaviors/os/security/lsa::password-filter-callback-set
      - id: micro-behaviors/communications/email/send/exchange::exchange-credentialed-attachment-send
    any:
      - id: objectives/persistence/system/registry/surface::lsa-auth-package-registry
      - id: objectives/persistence/system/registry/surface::lsa-notification-package-source
