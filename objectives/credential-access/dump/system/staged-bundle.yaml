# Credential-dump tool bundles: a carrier that stages several embedded
# credential-dumping executables, installs them as services, and clears
# security software out of the way. The foofus fgdump family is the reference
# shape (fgdump.exe carries pwdump, cachedump, pstgdump, fgexec and servpw as
# resources, drops them to ADMIN$, installs the fgexec service, and stops
# Symantec/McAfee/Sophos/Trend services first) -- but the composite names no
# family strings, only the staging mechanics, so rebuilt bundles match too.
defaults:
  platforms: [windows]
  for: [pe, dll]
  attack: "T1003"
  mbc: "B0005"

composite_rules:
  - id: credential-dump-staged-bundle
    desc: Credential dump tool stages bundle and installs service
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/data/embedded/payload/resource::pe-magic-in-rsrc-multiple
      - id: objectives/persistence/system/service/install::service-copy-install-chain
    any:
      - id: objectives/credential-access/dump/system::pstore-create-instance
      - id: objectives/credential-access/dump/process::lsass-memory-target
      - id: micro-behaviors/os/registry/keys::nlkm-lsa-secret-path
      - id: objectives/impact/degrade/edr/teardown::multi-vendor-security-service-stop
    needs: 1
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/installer/family/
  # Remote dump clients (pwdump6, fgdump) locate a writable share, copy a
  # service image, install it, and read hashes back over a named pipe.
  # Family banners live in well-known/; this composite is the deploy
  # mechanic so rebuilt clients still match.
  - id: remote-share-service-hash-collector
    desc: Remote share service hash collector
    crit: hostile
    conf: 0.97
    all:
      - id: micro-behaviors/os/network/share::wnet-add-connection
      - id: objectives/persistence/system/service/install::service-copy-install-chain
    any:
      - id: micro-behaviors/communications/ipc/named-pipe::wait-named-pipe
      - id: micro-behaviors/communications/ipc/named-pipe::create-named-pipe
      - id: micro-behaviors/communications/ipc/named-pipe::call-named-pipe
    needs: 1
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/installer/family/
