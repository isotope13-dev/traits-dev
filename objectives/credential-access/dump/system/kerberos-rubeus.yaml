defaults:
  platforms: [windows]
  for: [pe, dll]
  attack: T1558

traits:
  - id: ticket-extraction-help
    desc: Kerberos ticket harvesting capability
    crit: notable
    conf: 0.97
    if:
      type: text
      substr: Ticket extraction and harvesting

  - id: pass-the-ticket-command-syntax
    desc: Pass-the-ticket command option
    crit: notable
    conf: 0.98
    attack: T1550.003
    if:
      type: text
      exact: /ptt

composite_rules:
  - id: rubeus-ticket-harvest-and-injection
    desc: Rubeus extracts and injects Kerberos tickets
    crit: hostile
    conf: 0.99
    attack: T1550.003,T1558
    all:
      - id: well-known/tool/offensive/rubeus::rubeus-tool
      - id: ticket-extraction-help
      - id: pass-the-ticket-command-syntax
