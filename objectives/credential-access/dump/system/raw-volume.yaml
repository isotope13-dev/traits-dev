# Reflective loading alone is not hostile. Pair it with an explicit Active
# Directory database target before asserting credential-dump intent.
defaults:
  platforms: [windows]
  for: [powershell]
  attack: T1003.003

composite_rules:
  - id: powershell-reflective-ntds-extractor
    desc: PowerShell reflectively loads an NTDS extractor
    crit: hostile
    conf: 0.99
    all:
      - id: windows-ntds-database-path
      - id: objectives/anti-static/obfuscation/eval/powershell-loader::powershell-reflective-shellcode-loader
