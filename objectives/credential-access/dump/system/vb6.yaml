defaults:
  platforms:
  - windows
  for:
  - pe
composite_rules:
- id: vb6-concealed-cached-password
  desc: Concealed APIs and cached-password marker
  attack: T1027,T1555
  all:
  - id: objectives/anti-static/obfuscation/imports/concealment::vb6-concealed-win32-apis
  - id: objectives/credential-access/dump/system::cached-password-enumeration-marker
  unless:
  - id: metadata/signed/platform/
  - id: well-known/lib/runtime/native-platform/vb-richclient::vb-richclient-runtime-library
  crit: suspicious
