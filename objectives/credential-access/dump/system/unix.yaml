defaults:
  platforms: [unix]
  for: [elf]
# Credential Dumping - Unix
# MBC: E1003 (OS Credential Dumping)
# ATT&CK: T1003 (OS Credential Dumping)
#
# NOTE: Basic user lookup functions (getpwnam, getpwuid) are defined in
# objectives/discovery/user/traits.yaml as they're legitimate user discovery.
# This file focuses on actual credential/shadow file access.
traits:
  # getpwnam/getpwuid removed - they're legitimate user lookup functions
  # used by countless system utilities. See objectives/discovery/user/traits.yaml.
  # getspnam moved to micro-behaviors/os/user/lookup::getspnam -- a neutral
  # libc shadow lookup, same rationale as the getpwnam/getpwuid note above.
  #
  # KNOWN DEAD RULE, not fixed here: `shadow-extraction` below excludes
  # canonical account tools with a directory-wide `unless:` on THIS directory,
  # but the directory also holds the capability atoms its own `all:`/`any:`
  # legs need, so the suppressor fires whenever the rule could. Verified by
  # renaming a shadow-utils binary (dropping the account-tool basename): both
  # legs matched and no composite was emitted. Moving getspnam out removes one
  # such atom; `crypt-password-verify` (type: symbol exact: crypt) is still in
  # here and still matches any binary that links crypt(), so the rule remains
  # unfirable. Finishing it means relocating that atom too -- it feeds the
  # hostile `procfs-shadow-credential-dump` -- and then narrowing this
  # `unless:` to the account-tool basename markers. Spelling those 20 leaf
  # traits out individually trips the "excessive unless: clauses" policy cap,
  # and a reference to the `unix-account-management-tool` umbrella did not
  # resolve on the scan path, so the basename markers likely need to move to
  # metadata/ and be referenced as one exception composite.
- id: crypt-password-verify
  desc: Unix password hash verification
  crit: component
  conf: 0.72
  if:
    type: symbol
    exact: "crypt"
- id: account-tool-basename-core--passwd
  desc: Unix account tool basename (passwd)
  crit: baseline
  conf: 0.95
  if:
    type: basename
    exact: passwd
- id: account-tool-basename-core--usermod
