defaults:
  platforms: [unix]
  for: [elf]
# Credential Dumping - Unix
# MBC: E1003 (OS Credential Dumping)
# ATT&CK: T1003 (OS Credential Dumping)
#
# NOTE: Basic user lookup functions (getpwnam, getpwuid) are defined in
# objectives/discovery/user/traits.yaml as they're legitimate user discovery.
# This file focuses on actual credential/shadow file access.
traits:
  # getpwnam/getpwuid removed - they're legitimate user lookup functions
  # used by countless system utilities. See objectives/discovery/user/traits.yaml.
  # getspnam moved to micro-behaviors/os/user/lookup::getspnam -- a neutral
  # libc shadow lookup, same rationale as the getpwnam/getpwuid note above.
  #
  # STATUS of `shadow-extraction` below -- this replaces an earlier note that
  # called it a "KNOWN DEAD RULE"; that note described the directory-wide
  # `unless:` it used to carry, which was indeed self-defeating (this directory
  # also holds the capability atoms the rule's own legs need). That `unless:` has
  # since been narrowed to the `unix-account-management-tool` umbrella, and the
  # earlier note's two conclusions do not hold against the current tree:
  #   - the umbrella reference DOES resolve at scan time, and
  #   - the rule IS firable.
  # Measured with one binary compiled to import `getspnam` and open
  # /etc/gshadow, then scanned under two names: as `notatool` shadow-extraction
  # MATCHES; as `passwd` it is suppressed. So the suppressor now discriminates on
  # account-tool identity alone, which is what it was written to do.
  # Consequently there is NO need to relocate `crypt-password-verify` (it feeds
  # the hostile procfs-shadow-credential-dump), nor to move the ~20 basename
  # markers to metadata/ behind an exception composite -- that plan was premised
  # on the two claims above.
  # The one real limitation left is documented at
  # micro-behaviors/os/privilege/paths::etc-shadow-access-call-before: that leg is
  # source-shaped (`fopen(`-adjacent), so on an ELF only the /etc/gshadow branch
  # of the `any:` can fire. Note also that stock chage/passwd on Debian do not
  # import getspnam at all, so they fail the `all:` leg before the guard is even
  # consulted.
- id: crypt-password-verify
  desc: Unix password hash verification
  crit: component
  conf: 0.72
  if:
    type: symbol
    exact: "crypt"
- id: account-tool-basename-core--passwd
  desc: Unix account tool basename (passwd)
  crit: baseline
  conf: 0.95
  if:
    type: basename
    exact: passwd
- id: account-tool-basename-core--usermod
  desc: Unix account tool basename (usermod)
  crit: baseline
  conf: 0.95
  if:
