# /usr/bin/expiry ships in the same shadow-utils/passwd package as every other
# basename listed here, checks password aging through getspnam, and reads
# /etc/shadow to do it — it was simply missing from the set, so a stock Debian
# base image scored a credential-dumping finding on it.
- id: account-tool-basename-check--expiry
