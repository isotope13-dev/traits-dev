defaults:
  platforms: [windows]
  for: [scripts, binaries, source]
  attack: T1003.002,T1559

composite_rules:
  - id: sam-read-request-via-named-pipe
    desc: Named-pipe client requests Windows SAM credential hive
    crit: hostile
    conf: 0.99
    all:
      - id: micro-behaviors/fs/path/sensitive/credential-filenames::windows-sam-hive-path
      - id: micro-behaviors/fs/file/read::file-read-request-token
    any:
      - id: micro-behaviors/communications/ipc/named-pipe::dotnet-named-pipe-client-stream
      - id: micro-behaviors/communications/ipc/named-pipe::pywin32-named-pipe-client
      - id: micro-behaviors/communications/ipc/named-pipe::wait-named-pipe
    needs: 1
    near_bytes: 4096
