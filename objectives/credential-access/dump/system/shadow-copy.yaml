# Credential access by copying the Active Directory database from a Volume
# Shadow Copy.  The command and path combination is more specific than a bare
# NTDS.dit reference and survives changes to hostnames, users, and destinations.
defaults:
  platforms: [windows]
  for: [scripts, binaries]
  attack: T1003.003
  mbc: B0005

traits:
  - id: shadow-copy-ntds-path
    desc: NTDS.dit inside a Volume Shadow Copy path
    crit: suspicious
    conf: 0.98
    if:
      type: text
      regex: '(?i)\\Device\\HarddiskVolumeShadowCopy\d+[\\/]Windows[\\/]NTDS[\\/]NTDS\.dit\b'

composite_rules:
  - id: shadow-copy-ntds-dump
    desc: Copies NTDS.dit from a VSS path
    crit: hostile
    conf: 0.99
    all:
      - id: micro-behaviors/fs/volume/shadow-copy::shadow-copy-file-copy-command
      - id: micro-behaviors/fs/volume/shadow-copy::vssadmin-shadow-operation
      - id: shadow-copy-ntds-path
    near_bytes: 4096

  - id: defender-disabled-ntds-dump
    desc: Disables Defender before a VSS NTDS dump
    crit: hostile
    conf: 0.99
    attack: T1562.001,T1003.003
    all:
      - id: objectives/evasion/anti-av/platform/defender::defender-disable-realtime
      - id: shadow-copy-ntds-dump
    near_bytes: 8192

  - id: shadow-copy-ntds-exfiltration
    desc: Exfiltrates a VSS NTDS dump
    crit: hostile
    conf: 0.99
    attack: T1003.003,T1567.002
    all:
      - id: shadow-copy-ntds-dump
      - id: objectives/exfiltration/cloud/object-store::rclone-cloud-transfer
    near_bytes: 8192

  - id: shadow-copy-ntds-then-wipe
    desc: Dumps NTDS from VSS then deletes shadows
    crit: hostile
    conf: 0.98
    attack: T1003.003,T1490
    all:
      - id: shadow-copy-ntds-dump
      - id: objectives/impact/ransom/tactics::vssadmin-delete
    near_lines: 30
