# Credential access through the legitimate Remote Registry service: the
# SAM/SECURITY hives (or the LSA key material beneath SYSTEM) read from
# another host's HKLM, optionally under an impersonated token. The technique
# never touches LSASS and uses a signed OS service, so dump-focused and
# process-anomaly monitoring see nothing -- attackers were observed "using a
# legitimate remote registry service with an impersonation token" as an
# LSASS bypass (Prophet Security quarterly report, May-July 2026).
defaults:
  platforms: [windows]
  for: [scripts, source, binaries]
  attack: T1003.002

traits:
  - id: hklm-sam-security-hive
    desc: HKLM SAM or SECURITY hive key
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)(HKLM|HKEY_LOCAL_MACHINE)\\+(SAM|SECURITY)\b'

  - id: sam-security-hive-subkey
    desc: SAM or SECURITY hive subkey string
    crit: notable
    conf: 0.9
    if:
      # The hive name opens a registry path: "SAM\Domains", "SECURITY\Policy\Secrets".
      type: text
      regex: '[''"](SAM|SECURITY)\\'

  - id: system-lsa-key-path
    desc: SYSTEM hive LSA key path
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)CurrentControlSet\\Control\\Lsa\b'

composite_rules:
  - id: sam-lsa-hive-material
    desc: References SAM/SECURITY/LSA hive material
    crit: notable
    conf: 0.92
    any:
      - id: hklm-sam-security-hive
      - id: sam-security-hive-subkey
      - id: system-lsa-key-path

  - id: remote-registry-hive-credential-read
    desc: Reads SAM/SECURITY/LSA credential material over remote registry
    crit: suspicious
    conf: 0.96
    attack: T1003.002,T1021
    all:
      - id: micro-behaviors/os/registry/access::remote-registry-session
      - id: sam-lsa-hive-material
    near_lines: 40

  - id: impersonated-remote-registry-hive-read
    desc: Impersonates a token to read credential hives via remote registry
    crit: suspicious
    conf: 0.97
    attack: T1003.002,T1134
    all:
      - id: remote-registry-hive-credential-read
      - id: micro-behaviors/os/privilege/token::dotnet-identity-impersonation
    near_lines: 60
