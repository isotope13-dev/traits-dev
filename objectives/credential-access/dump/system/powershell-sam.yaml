composite_rules:
- id: powershell-sam-des-hash-decryption
  desc: PowerShell decrypts SAM account hash records
  crit: hostile
  conf: 0.97
  for:
  - powershell
  platforms:
  - windows
  attack: T1003.002
  all:
  - id: micro-behaviors/os/registry/keys::powershell-sam-account-users-path
  - id: micro-behaviors/os/registry/keys::lsa-control-key-path
  - id: micro-behaviors/crypto/symmetric/decrypt::dotnet-create-decryptor
  - id: micro-behaviors/crypto/cipher::dotnet-transform-final-block
  any:
  - id: micro-behaviors/crypto/symmetric/des::powershell-des-create
  - id: micro-behaviors/crypto/symmetric/des::powershell-des-provider-create
