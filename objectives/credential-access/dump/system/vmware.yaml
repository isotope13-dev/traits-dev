# Credential harvesting from cloned or snapshotted virtual machines.
# A VM management operation is normal administration in isolation. It becomes
# a high-confidence credential-access pattern when the workflow reads Windows
# guest credential databases from the clone or snapshot.
defaults:
  platforms: [unix, windows]
  for: [scripts, binaries]
  attack: T1003

traits:
  - id: windows-ntds-database-path
    desc: Windows guest NTDS database path
    crit: suspicious
    conf: 0.97
    if:
      type: text
      regex: '(?i)Windows[/\\]NTDS[/\\]ntds\.dit\b'

  - id: windows-sam-hive-path
    desc: Windows SAM credential hive path
    crit: suspicious
    conf: 0.97
    for: [scripts, binaries, source]
    if:
      type: text
      regex: '(?i)Windows[/\\]System32[/\\]config[/\\]SAM\b'
    unless:
      - id: well-known/tool/sysadmin/win-unattended::signer
      - id: well-known/app/infrastructure/flyio::flyctl-cli-context
      - id: metadata/package/testing/presence/harness::go-test-file
      - id: metadata/package/testing/presence/harness::test-directory-path

      - id: well-known/tool/offensive/bingo/
      - id: well-known/tool/offensive/mcpsec/
composite_rules:
  - id: vmware-clone-credential-harvest
    desc: Cloned VMware guest used for credential harvest
    crit: hostile
    conf: 0.99
    all:
      - id: micro-behaviors/os/virtualization/hypervisor::vmware-vm-clone-operation
    any:
      - id: windows-ntds-database-path
      - id: windows-sam-hive-path
    needs: 1
    near_bytes: 4096

  - id: vmware-snapshot-credential-harvest
    desc: VMware snapshot used for credential harvest
    crit: hostile
    conf: 0.99
    all:
      - id: micro-behaviors/os/virtualization/hypervisor::vmware-vm-snapshot-create-operation
    any:
      - id: windows-ntds-database-path
      - id: windows-sam-hive-path
    needs: 1
    near_bytes: 4096
