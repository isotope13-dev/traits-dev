defaults:
  attack: T1555
  mbc: B0028
  for:
  - pe
  - dll
  - c
  - cpp
  platforms:
  - windows
traits:
- id: enum-pstorage
  desc: Protected Storage enumeration routine
  crit: suspicious
  conf: 0.96
  if:
    type: string_literal
    exact: EnumPStorage
- id: protected-storage-text
  desc: Protected Storage credential text
  crit: suspicious
  conf: 0.9
  if:
    type: string_literal
    substr: Protected Storage
- id: pstore-create-instance--fpstorecreateinstance
  desc: Protected Storage COM (fPStoreCreateInstance)
  crit: suspicious
  conf: 0.95
  if:
    type: text
    word: fPStoreCreateInstance
  unless:
  - type: path
    basename: true
    regex: '(?i).*\.(h|hh|hpp|hxx|inc)$'
  - id: well-known/app/utility/siw::siw-family-identity
- id: pstore-create-instance--pstorecreateinstance
  desc: Protected Storage COM (PStoreCreateInstance)
  # The imported COM factory is used by migration, cleanup, and inventory
  # software too; theft composites below require corroborating behaviors.
  crit: notable
  conf: 0.95
  if:
    type: text
    word: PStoreCreateInstance
  unless:
  - id: well-known/lib/platform/wine/
  - id: metadata/file/string/file::wine-include-source-path
  - type: path
    basename: true
    regex: '(?i).*\.(h|hh|hpp|hxx|inc)$'
  - id: well-known/app/utility/siw::siw-family-identity
- id: cached-password-enumeration-marker
  desc: Cached password enumeration marker
  crit: suspicious
  conf: 0.96
  for:
  - pe
  - dll
  if:
    type: text
    word: WNetEnumCachedPasswords
  unless:
  - id: well-known/lib/platform/wine/
- id: ie-password-autocomplete-marker
  desc: Internet Explorer saved-password marker
  crit: suspicious
  conf: 0.94
  for:
  - pe
  - dll
  if:
    type: text
    exact: FormSuggest Passwords
  unless:
  # IeRtUtil owns the FormSuggest Passwords IE Main registry value.
  - id: well-known/lib/platform/microsoft-iertutil::microsoft-iertutil-system-context
  - id: metadata/binary/vendor::microsoft-signed-system-component-context
composite_rules:
- id: pstore-create-instance
  desc: Protected Storage COM factory
  crit: suspicious
  conf: 0.95
  unless:
  - id: metadata/binary/vendor/
  - id: well-known/tool/sysadmin/sandboxie/
  - id: metadata/lang/source/
  - id: metadata/lang/security::win32-com-interface-declaration-header
  - id: well-known/app/utility/siw::siw-family-identity
  any:
  - id: pstore-create-instance--fpstorecreateinstance
  - id: pstore-create-instance--pstorecreateinstance
- id: protected-storage-credential-theft
  desc: Windows Protected Storage credential theft
  crit: suspicious
  conf: 0.98
  needs: 2
  any:
  - id: pstore-create-instance
  - id: enum-pstorage
  - id: protected-storage-text
  - id: micro-behaviors/os/security/protected-storage::ipstore-interface
  unless:
  - id: well-known/tool/sysadmin/sandboxie/
  - id: metadata/lang/source/
  - id: well-known/lib/platform/wine/
  - id: metadata/lang/security::win32-com-interface-declaration-header
  - id: well-known/app/utility/siw::siw-family-identity
- id: legacy-ie-protected-storage-stealer
  desc: Legacy IE Protected Storage credential theft
  crit: hostile
  conf: 0.99
  attack: T1555.003,T1003
  for:
  - pe
  - dll
  all:
  - id: pstore-create-instance--pstorecreateinstance
  - id: cached-password-enumeration-marker
  - id: ie-password-autocomplete-marker
  unless:
  - id: well-known/lib/platform/wine/
  - id: well-known/app/utility/siw::siw-family-identity
