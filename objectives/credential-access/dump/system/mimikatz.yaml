defaults:
  platforms: [windows]
  for: [pe, dll]
  attack: "T1003.001,T1005"
  mbc: E1003

composite_rules:
  - id: mimikatz-credential-memory-dump
    desc: Mimikatz reads process memory for LSA credentials
    crit: hostile
    conf: 0.99
    all:
      - id: well-known/tool/offensive/mimikatz::mimikatz
      - id: well-known/tool/offensive/mimikatz::mimikatz-error
      - id: micro-behaviors/process/inject/runtime/call::read-process-memory
      - id: micro-behaviors/os/privilege/token::open-process-token
