defaults:
  platforms: [windows]
  for: [pe, dll]
  attack: T1003.006

composite_rules:
  - id: mimikatz-dcsync-domain-dump
    desc: Mimikatz DCSync Active Directory domain dump
    crit: hostile
    conf: 0.98
    all:
      - id: well-known/tool/offensive/mimikatz::lsadump-dcsync
    any:
      - id: well-known/tool/offensive/mimikatz::mimikatz-process-string
      - id: well-known/tool/offensive/mimikatz::mimikatz-error
      - id: micro-behaviors/os/security/directory-service::ldap-computer-object-filter
    unless:
      - id: metadata/file/encoded::powershell-base64-dominated-body
      - id: metadata/lang/scripted::ps-valid

  - id: mimikatz-sam-credential-dump
    desc: Mimikatz SAM in-process credential dump
    crit: hostile
    conf: 0.98
    attack: T1003.002
    all:
      - id: well-known/tool/offensive/mimikatz::lsadump-sam
      - id: micro-behaviors/os/security/lsa::sami-connect-routine
      - id: micro-behaviors/os/security/lsa::samsrv-library-name
    unless:
      - id: metadata/file/encoded::powershell-base64-dominated-body
      - id: metadata/lang/scripted::ps-valid
