# A .NET assembly whose name came out of a generator and whose content is an
# LSA interop wrapper.
#
# Neither half convicts alone. `.NET` legitimately emits randomly-named
# assemblies -- XmlSerializer writes `xxxxxxxx.dll` into the temp directory on
# every process that serializes a type it has not seen -- and plenty of
# administrative tooling talks to the LSA policy database. What no legitimate
# build produces is both: a product assembly is named after the product, and a
# generated one is a serializer, not a privilege-enumeration wrapper.
#
# abuse.ch 1af33429697d is 5.6 KB of exactly this -- `jkpwfdrq.dll`, unsigned,
# version 0.0.0.0, whose whole surface is `LsaOpenPolicy`,
# `LsaEnumerateAccountsWithUserRight`, `CheckAccessTokenOfSid` and the structs
# to marshal them. It is a post-exploitation module a loader drops and calls,
# and it scored fifteen structural notables and nothing above them.
#
# The shape survives a rebuild: a kit that regenerates the module name per
# victim -- which is the point of generating it -- cannot avoid this rule by
# generating a different one, and dropping the interop means dropping the
# capability. Changing the API family is the only way out, which is why the
# interop leg names the marshalling structs rather than one function.
defaults:
  platforms: [windows]
  for: [pe, dll]
  attack: T1003
  mbc: C0037

composite_rules:
  - id: generated-name-managed-lsa-module
    desc: Generated-name .NET module does LSA interop
    crit: hostile
    conf: 0.93
    all:
      - id: metadata/lang/compiler/generated::dotnet-generated-dll-internal-name
      - id: micro-behaviors/os/security/lsa::managed-lsa-policy-interop
    # A handle is not an act. The interop declaration says the module can talk
    # to the LSA; this says it does something with it -- reads a secret, grants
    # a right, or enumerates who holds one.
    any:
      - id: micro-behaviors/os/security/lsa::managed-lsa-privileged-operation
      - id: micro-behaviors/os/security/lsa::lsa-enumerate-accounts-with-right
    unless:
      # The one benign producer of randomly-named managed assemblies.
      - id: metadata/lang/compiler/generated::dotnet-generated-xmlserializer
      - id: well-known/tool/detection/
