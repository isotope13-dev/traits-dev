defaults:
  platforms: [windows]
  for: [scripts, binaries]
  attack: T1003.003
  mbc: B0005

traits:
  - id: ntdsutil-ifm-create
    desc: ntdsutil IFM full-database creation
    crit: suspicious
    conf: 0.98
    unless:
      - id: metadata/file/format/log::windows-event-csv-records
      - id: well-known/app/system/anthropic-cybersecurity-skills::defensive-cybersecurity-skills-repository
      - id: well-known/tool/detection/
    downgrade:
      all:
        - id: well-known/tool/offensive/adpentest::project-marker
        - id: well-known/tool/offensive/adpentest::active-scope-option
        - id: well-known/tool/offensive/adpentest::dry-run-mode
    if:
      type: text
      regex: '(?i)\bntdsutil\b[^\r\n]{0,180}\bifm\b[^\r\n]{0,40}\bcreate\s+full\b'

  - id: ntdsutil-ntds-target
    desc: ntdsutil selects the NTDS instance
    crit: suspicious
    conf: 0.96
    unless:
      - id: well-known/app/system/anthropic-cybersecurity-skills::defensive-cybersecurity-skills-repository
      - id: well-known/tool/detection/
    if:
      type: text
      regex: '(?i)\bntdsutil(\.exe)?["'']?(\s+|,\s*["''])(ac i|activate instance)\s+ntds\b'

composite_rules:
  - id: ntdsutil-ifm-full-dump
    desc: ntdsutil creates a full NTDS IFM dump
    crit: hostile
    conf: 0.99
    all:
      - id: ntdsutil-ifm-create
      - id: ntdsutil-ntds-target
    near_lines: 2
