# Post-processing of credential-dump output to single out machine accounts
# (names ending in `$`) and their NTLM hashes. Machine-account hashes are
# the standard pivot from LSA-secret theft to DCSync: domain controllers'
# machine accounts hold directory-replication rights, so a harvested DC
# hash replays as pass-the-hash DCSync. The 2026 SonicWall SMA1000
# campaign (Hunt.io) automated exactly this step on top of a standalone
# Impacket secretsdump build run from compromised appliances.
defaults:
  platforms: [unix, windows]
  for: [scripts, binaries]
  attack: T1003.006

traits:
  - id: machine-account-hash-parse-regex
    desc: Regex harvests machine-account NTLM hashes
    crit: suspicious
    conf: 0.9
    if:
      type: text
      # A regex literal pairing an escaped trailing-$ capture with a
      # 32-hex-field quantifier parses `$`-suffixed account names against
      # NTLM hash material; prose never carries both tokens in one pattern.
      regex: '\\\$[^"''\r\n]{0,80}\{32\}'

composite_rules:
  - id: machine-account-pass-the-hash-staging
    desc: Stages machine-account hashes for pass-the-hash
    crit: hostile
    conf: 0.94
    attack: T1003.006,T1550.002
    all:
      - id: machine-account-hash-parse-regex
    any:
      - id: objectives/credential-access/dump/system::impacket-secretsdump-command
      - id: objectives/credential-access/dump/system::secretsdump-hash-authentication
    near_lines: 40
