# Impacket's secretsdump utility extracts domain credential material.  The
# utility is dual-use, so the named reference stays notable; the NTDS target
# conjunction expresses the credential-dumping objective.
#
# `kerberosLogin(...)` calls and `aesKey` auth options moved to
# micro-behaviors/os/security/auth/session/kerberos.yaml: those are neutral
# Kerberos-authentication mechanics present in any impacket-based tool
# (dump-related or not), not a dump-specific signal on their own.
defaults:
  platforms: [unix, windows]
  for: [scripts, binaries]
  attack: T1003.003
  mbc: B0005

traits:
  - id: impacket-secretsdump-command
    desc: Impacket secretsdump invocation
    crit: notable
    conf: 0.96
    if:
      type: text
      # Standalone builds and renamed wrappers commonly omit the upstream
      # `.py` suffix. Require following command whitespace so payload URLs and
      # output filenames do not masquerade as an invocation.
      regex: '(?i)(^|[[:space:]"''])([^[:space:]"'']{0,160}[/\\])?secretsdump(\.py)?[[:space:]]+'

  - id: secretsdump-hash-authentication
    desc: secretsdump hash-authentication option
    crit: suspicious
    conf: 0.95
    attack: T1550.002
    if:
      type: text
      # Impacket accepts LM:NT material after -hashes. The values may be
      # literals or script substitutions assembled at runtime.
      regex: '(?i)\bsecretsdump(\.py)?\b[^\r\n]{0,240}\s-hashes\s+[^\s:"'']{1,96}:[^\s"'']{1,96}'

  - id: secretsdump-domain-controller-mode
    desc: secretsdump domain-controller dump flag
    crit: suspicious
    conf: 0.93
    downgrade:
      all:
      - id: well-known/tool/offensive/adpentest::project-marker
      - id: well-known/tool/offensive/adpentest::active-scope-option
      - id: well-known/tool/offensive/adpentest::dry-run-mode
    if:
      type: text
      regex: (?i)(^|[[:space:]\"'])(-just-dc-ntlm|-just-dc|-ntds)\b
    unless:
    - id: well-known/tool/offensive/bingo/
    - id: well-known/tool/offensive/impacket::source-tree-member
    - id: well-known/app/system/anthropic-cybersecurity-skills::defensive-cybersecurity-skills-repository
    - id: metadata/file/profile/markup::assessment-playbook-examples
  - id: drsuapi-dump-reference
    desc: References the DRSUAPI replication interface
    crit: notable
    conf: 0.9
    unless:
      - id: well-known/tool/offensive/impacket::source-tree-member
    if:
      type: text
      substr: DRSUAPI
composite_rules:
  - id: impacket-dcsync-command
    desc: secretsdump domain-controller extraction command text
    crit: suspicious
    conf: 0.98
    downgrade:
      all:
      - id: well-known/tool/offensive/adpentest::project-marker
      - id: well-known/tool/offensive/adpentest::active-scope-option
      - id: well-known/tool/offensive/adpentest::dry-run-mode
    attack: T1003.006
    all:
    - id: impacket-secretsdump-command
    - id: secretsdump-domain-controller-mode
    near_lines: 4
    unless:
    - id: well-known/tool/offensive/impacket::source-tree-member
    - id: well-known/app/system/anthropic-cybersecurity-skills::defensive-cybersecurity-skills-repository
    - id: metadata/file/profile/markup::assessment-playbook-examples
  - id: impacket-hash-authenticated-dcsync
    desc: Impacket DCSync authenticates with hashes
    crit: hostile
    conf: 0.99
    attack: T1003.006,T1550.002
    all:
      - id: impacket-dcsync-command
      - id: secretsdump-hash-authentication
    near_lines: 4
    unless:
      - id: well-known/tool/offensive/impacket::source-tree-member
      - id: well-known/app/system/anthropic-cybersecurity-skills::defensive-cybersecurity-skills-repository

  - id: impacket-ntds-credential-dump
    desc: Impacket extracts domain credentials from NTDS
    crit: hostile
    conf: 0.99
    all:
      - id: impacket-secretsdump-command
      - id: micro-behaviors/fs/path/account-db::ntds-database-path-reference
    any:
      - id: secretsdump-domain-controller-mode
      - id: objectives/credential-access/dump/system::ntdsutil-ntds-target
    near_lines: 12
    unless:
      - id: well-known/tool/offensive/impacket::source-tree-member
  - id: dcsync-kerberos-domain-dump
    for: [elf, macho, pe, class, pyc, beam, wasm, staticlib]
    desc: DCSync replication with Kerberos key auth
    crit: hostile
    conf: 0.96
    all:
      - id: drsuapi-dump-reference
      - id: micro-behaviors/os/security/auth/session::kerberos-login-call
      - id: micro-behaviors/os/security/auth/session::kerberos-aeskey-auth-option
    any:
      - id: micro-behaviors/fs/path/account-db::ntds-database-path-reference
      - id: secretsdump-domain-controller-mode
    unless:
      - id: well-known/tool/offensive/impacket::source-tree-member
