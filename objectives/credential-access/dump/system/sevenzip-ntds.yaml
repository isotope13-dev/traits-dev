# 7-Zip file-manager registry markers for raw physical-disk browse used to
# stage NTDS.dit theft. Match registry value names and path shapes — not prose.
defaults:
  platforms: [windows]
  for: [powershell, batch, scripts]
  attack: T1003.003,T1560.001
  mbc: B0005

traits:
  - id: sevenzip-fm-registry-key
    desc: 7-Zip FM registry key path
    crit: suspicious
    conf: 0.94
    if:
      type: text
      regex: '(?i)Software\\7-Zip\\FM\b'

  - id: sevenzip-panelpath0-value
    desc: 7-Zip PanelPath0 registry value name
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)\bPanelPath0\b'

  - id: sevenzip-folderhistory-value
    desc: 7-Zip FolderHistory registry value name
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)\bFolderHistory\b'

  - id: sevenzip-panelpath-raw-root
    desc: PanelPath0 set to raw device root
    crit: suspicious
    conf: 0.97
    if:
      type: text
      # PanelPath0 … \\.  (raw device namespace root in 7-Zip FM)
      regex: "(?i)PanelPath0.{0,80}\\\\\\."

  - id: ntds-7z-archive-name
    desc: Stages NTDS dump as NTDS.7z
    crit: suspicious
    conf: 0.96
    if:
      type: text
      regex: '(?i)\bNTDS\.7z\b'

  - id: sevenzip-raw-volume-ntds-source
    desc: 7-Zip archives NTDS from raw volume
    crit: suspicious
    conf: 0.97
    if:
      type: text
      regex: '(?i)\\\\\.\\[^\r\n]{0,80}NTDS\.dit\b'

  - id: windows-system32-config-path
    desc: References System32 config hive path
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)\\Windows\\System32\\config\b'

composite_rules:
  - id: sevenzip-fm-raw-device-panel
    desc: 7-Zip FM PanelPath0 is raw device root
    crit: suspicious
    conf: 0.96
    all:
      - id: sevenzip-fm-registry-key
      - id: sevenzip-panelpath-raw-root

  - id: sevenzip-ntds-archive-stage
    desc: 7-Zip archives NTDS.dit into a 7z
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/data/archive/create/utility::archive-7z-create
      - id: windows-ntds-database-path
    any:
      - id: ntds-7z-archive-name
      - id: sevenzip-raw-volume-ntds-source

  - id: sevenzip-raw-ntds-volume-archive
    desc: 7-Zip packs NTDS.dit from raw volume
    crit: hostile
    conf: 0.99
    all:
      - id: micro-behaviors/data/archive/create/utility::archive-7z-create
      - id: sevenzip-raw-volume-ntds-source

  - id: sevenzip-fm-raw-ntds-history
    desc: 7-Zip raw browse with NTDS history
    crit: hostile
    conf: 0.98
    all:
      - id: sevenzip-fm-raw-device-panel
      - id: sevenzip-folderhistory-value
    any:
      - id: windows-ntds-database-path
      - id: ntds-7z-archive-name
      - id: windows-system32-config-path
      - id: ntds-database-file-target
