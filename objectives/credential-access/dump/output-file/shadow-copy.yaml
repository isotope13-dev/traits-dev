# Legacy VSS hive observations and NTDS consumers. Source-bound NTDS
# acquisition now lives under credential-access/files/password-database.
defaults:
  platforms: [windows]
  for: [scripts, source, binaries]
  attack: T1003.003
  mbc: B0005

composite_rules:
  - id: shadow-copy-registry-hive-dump
    desc: Copies SAM/SYSTEM registry hives from a VSS path
    crit: hostile
    conf: 0.98
    attack: T1003.002
    all:
      - id: micro-behaviors/fs/volume/shadow-copy::shadow-copy-file-copy-command
      - id: micro-behaviors/fs/volume/shadow-copy::vssadmin-shadow-operation
      - id: micro-behaviors/fs/path/config/system::shadow-copy-registry-hive-path
    near_bytes: 4096

  - id: defender-disabled-ntds-dump
    for: [batch, powershell]
    desc: Disables Defender before a VSS NTDS dump
    crit: hostile
    conf: 0.99
    attack: T1562.001,T1003.003
    all:
      - id: micro-behaviors/os/security/defender::defender-disable-realtime
      - id: objectives/credential-access/files/password-database::shadow-copy-ntds-dump
    near_bytes: 8192

  - id: shadow-copy-ntds-exfiltration
    for: [batch, powershell]
    desc: Exfiltrates a VSS NTDS dump
    crit: hostile
    conf: 0.99
    attack: T1003.003,T1567.002
    all:
      - id: objectives/credential-access/files/password-database::shadow-copy-ntds-dump
      - id: objectives/exfiltration/cloud/object-store::rclone-cloud-transfer
    near_bytes: 8192

  - id: shadow-copy-ntds-then-wipe
    desc: Dumps NTDS from VSS then deletes shadows
    crit: hostile
    conf: 0.98
    attack: T1003.003,T1490
    all:
      - id: objectives/credential-access/files/password-database::shadow-copy-ntds-dump
      # The recovery atom suppresses itself beside a shadow creation, but
      # deleting the snapshot after an NTDS copy is cleanup of the theft
      # regardless of who created it, so consume the neutral command here.
      - id: micro-behaviors/fs/volume/shadow-copy::vssadmin-shadow-delete-command
    near_lines: 30
