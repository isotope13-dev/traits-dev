# Filesystem markers for credential-dump output files, and the composites that
# convict a routine writing captured credentials to one.
#
# A file literally named credentials.txt / password.txt is where a credential
# harvester spills what it collected. On its own the name is only a weak hint
# (a fixture or a doc can mention it), so the markers stay low and earn a
# verdict only inside a composite that pairs them with the collection itself --
# here, a hook of the Windows NTLM validation routine.
defaults:
  platforms: [windows, unix]
  for: [scripts, source, binaries]
  attack: T1003

traits:
  # Relocated from credential-access/ssh/key, where the matcher (a bare
  # credentials.txt / password.txt filename) had nothing to do with SSH keys.
  # These are generic credential-dump output paths.
  - id: credentials-dump-file
    desc: References a credentials.txt dump file
    crit: notable
    conf: 0.75
    if:
      type: text
      substr: credentials.txt
  - id: password-dump-file
    desc: References a password.txt dump file
    crit: component
    conf: 0.75
    if:
      type: text
      substr: password.txt

composite_rules:
  # HppDLL-style LSASS credential theft: a routine that references the internal
  # NTLM password-validation function (MsvpPasswordValidate, an undocumented
  # NtlmShared.dll export legitimate code never calls) and writes to a
  # credentials dump file. This is the harvesting half -- the Detour hook that
  # redirects execution here is convicted separately under capture/input. The
  # pair generalizes to any validation-hook that spills the domain/username/NT
  # hash it intercepts, whatever the exact dump filename.
  - id: ntlm-validation-hook-credential-dump
    desc: NTLM validation hook writes captured credentials to disk
    crit: hostile
    conf: 0.96
    attack: T1003.001,T1056.004
    all:
      - id: micro-behaviors/os/security/auth/verify::msv1-0-password-validate
      - id: credentials-dump-file
    unless:
      # Endpoint-security and RE tooling reference these routines by trade;
      # their identity is established elsewhere in the corpus.
      - id: well-known/tool/reverse-engineering/
      - id: well-known/app/security/
