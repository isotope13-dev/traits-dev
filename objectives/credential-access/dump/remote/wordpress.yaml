# Remote WordPress account-hash extraction through a blind SQL injection.
# Require the user table's login/hash columns beside the existing REST SQLi
# toolkit evidence; ordinary SQL examples and user enumeration alone do not
# establish credential dumping.
defaults:
  platforms: [unix, windows]
  for: [scripts, source]

traits:
  - id: wordpress-users-table-suffix
    desc: Builds a prefixed WordPress users table name
    crit: suspicious
    conf: 0.96
    if:
      type: text
      substr: '}users'

  - id: wordpress-login-column-reference
    desc: References the WordPress login column
    crit: notable
    if:
      type: text
      regex: '(?i)\buser_login\b'

  - id: wordpress-password-hash-column-reference
    desc: References the WordPress password hash column
    crit: suspicious
    if:
      type: text
      regex: '(?i)\buser_pass\b'

composite_rules:
  - id: wordpress-blind-sqli-credential-dump
    desc: Blind SQLi extracts WordPress account credentials
    crit: hostile
    conf: 0.98
    scope: file
    near_bytes: 8192
    all:
      - id: micro-behaviors/communications/http/request/wordpress::rest-users-endpoint-url
      - id: objectives/execution/exploit/sql-injection::multi-vector-sqli-toolkit
      - id: wordpress-users-table-suffix
      - id: wordpress-login-column-reference
      - id: wordpress-password-hash-column-reference
