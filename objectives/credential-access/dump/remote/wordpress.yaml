# Remote WordPress account-hash extraction through a boolean blind SQL
# injection. The narrow evidence is the WordPress users table and credential
# columns, an injected boolean predicate, and character-by-character SQL
# extraction over a WordPress REST route.
defaults:
  platforms: [unix, windows]
  for: [scripts, source]

traits:
  - id: wordpress-users-table-suffix
    desc: Assigns a prefixed users table name
    crit: suspicious
    conf: 0.96
    if:
      type: text
      # Require an assignment to a table-named variable. A route such as
      # f"{BASE_URL}users/{login}" is not evidence of a SQL table name.
      regex: '(?i)\b\w*table\s*=\s*f["''].{0,50}\{[A-Za-z_]\w*\}users\b'

  - id: wordpress-password-hash-column-reference
    desc: References the WordPress password hash column
    crit: suspicious
    if:
      type: text
      regex: '(?i)\buser_pass\b'

composite_rules:
  - id: wordpress-blind-sqli-credential-dump
    desc: Blind SQLi extracts WordPress account credentials
    crit: hostile
    conf: 0.98
    scope: file
    all:
      - id: micro-behaviors/communications/http/request/wordpress::rest-endpoint-url
      - id: objectives/execution/exploit/sql-injection::boolean-sqli-context-templates
      - id: objectives/execution/exploit/sql-injection::blind-char-query-expression-template
      - id: wordpress-users-table-suffix
      - id: metadata/lang/source/naming/target::user-login-token
      - id: wordpress-password-hash-column-reference
