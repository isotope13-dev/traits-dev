# Credential extraction from an offline LSASS minidump.
#
# "Bring your own dump" credential access: instead of opening a handle to
# LSASS — which every EDR watches — the operator acquires an lsass.dmp with
# any out-of-band method and then parses the credential stores out of that
# file with a minidump library. The secrets land in the operator's hands
# without a single handle ever being opened to LSASS.
#
# The legs below name stable, tool-agnostic shapes, never one kit's strings:
# the conventional offline dump filename, a credential-extraction entry
# point, and the MSV/NT-hash credential fields that are the actual loot.
# Any one leg alone is weak (DFIR responders also open lsass.dmp, and NT
# hash fields appear in forensic parsers), so atoms stay suspicious and
# only the conjunction convicts.
defaults:
  platforms: [windows, unix]
  for: [scripts, source, rust]
  attack: T1003.001
  mbc: E1003

traits:
  - id: lsass-dump-file-reference
    desc: References an lsass.dmp dump file
    crit: suspicious
    conf: 0.88
    if:
      type: text
      regex: '(?i)\blsass\.dmp\b'

  - id: minidump-credential-extraction-call
    desc: Calls an extract-credentials-from-* routine
    crit: suspicious
    conf: 0.9
    if:
      type: text
      regex: 'extract_credentials_from_[A-Za-z0-9_]{1,32}'

composite_rules:
  # Parsing an offline LSASS dump and pulling MSV/NT-hash credentials out of
  # it is credential dumping whoever runs it: the dump filename proves which
  # store is opened, the extraction call proves it is parsed for logon
  # secrets, and the NT-hash fields prove what is carried away.
  - id: offline-lsass-minidump-credential-extraction
    desc: Extracts credentials from an offline LSASS minidump
    crit: hostile
    conf: 0.95
    all:
      - id: lsass-dump-file-reference
      - id: minidump-credential-extraction-call
      - id: micro-behaviors/os/security/auth/ntlm::nt-hash-field
    unless:
      - id: well-known/app/system/anthropic-cybersecurity-skills::defensive-cybersecurity-skills-repository
