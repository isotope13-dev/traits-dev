# hiberfil.sys is a serialized physical-memory image that can contain disk
# encryption keys and credentials.  Copying it can be legitimate forensics, so
# collection alone is suspicious; combining it with deliberate removal of the
# encryption-filter chain identifies hostile plaintext-memory staging.
defaults:
  platforms: [windows]
  for: [scripts, pe, dll, c, cpp, csharp, python, javascript, java, go, rust]
  attack: T1003

traits:
  - id: hiberfil-path-literal
    desc: References the Windows hibernation image
    crit: notable
    conf: 0.94
    if:
      type: string_literal
      regex: '(?i)^([A-Z]:)?[\\/]hiberfil\.sys$'

composite_rules:
  - id: hiberfil-copy-operation
    desc: Copies the Windows hibernation image
    crit: suspicious
    conf: 0.95
    all:
      - id: hiberfil-path-literal
      - id: micro-behaviors/fs/file/copy
    scope: file

  - id: plaintext-hiberfile-staging
    desc: Clears dump encryption then stages hiberfil.sys
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/os/registry/write/property::crash-control-registry-path
      - id: micro-behaviors/os/registry/write/property::dump-filters-value-clear
      - id: hiberfil-copy-operation
    scope: file
