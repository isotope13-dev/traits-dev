defaults:
  platforms:
  - unix
  - windows
  crit: notable
  attack: T1552.001
composite_rules:
- id: pypi-build-hook-environment-file-harvest
  desc: PyPI build hook writes complete environment
  crit: hostile
  conf: 0.99
  attack: T1195.002,T1552.001
  mbc: E1552
  for:
  - python
  all:
  - id: metadata/build/pip::root-setup-py-path
  - id: metadata/build/pip::packaging-setup-api-import
  - id: metadata/build/package/recipe/setup-hooks::setup-cmdclass-build-py
  - id: metadata/build/package/recipe/setup-hooks::setuptools-build-py-run-override
  - id: metadata/build/package/recipe/setup-hooks::run-override-calls-helper-after-super
  - id: micro-behaviors/os/env/enumerate::python-environ-items-loop
  - id: micro-behaviors/data/serialize/object::python-environ-items-text-join
  - id: micro-behaviors/fs/write/file/full/string::python-pathlib-write-text
