# Go bulk environment-variable credential harvesting.
# Detects programs that iterate os.Environ() and filter the keys against
# a credential keyword list (token / key / secret / password / npm / aws /
# github / stripe / kube / docker / api / auth) — a tell-tale stealer pattern.
defaults:
  platforms: [unix, windows]
  for: [go]
  attack: T1552.001
  mbc: B0029
traits:
# The fragment atoms below spell credential words split across a `+`
# concatenation ("pas" + "sword"). A fragment only counts when it is joined to
# a neighbour: a lone quoted "npm", "ap" or "au" is an ordinary string in any
# Go program that shells out to npm or names a package manager.
- id: go-env-credkeywords-fragments--rx-7
  desc: "Matches 'et pas'"
  crit: notable
  conf: 0.85
  if:
    type: text
    regex: '"(secr|et pas)"\s*\+|\+\s*"(secr|et pas)"'
- id: go-env-credkeywords-fragments--rx-8
  desc: Regex component marker
  crit: component
  conf: 0.85
  if:
    type: text
    regex: '"(pas|npm)"\s*\+|\+\s*"(pas|npm)"'
- id: go-env-credkeywords-fragments--rx-9
  desc: "Matches 's git'"
  crit: notable
  conf: 0.85
  if:
    type: text
    regex: '"(aw|s git)"\s*\+|\+\s*"(aw|s git)"'
- id: go-env-credkeywords-fragments--rx-10
  desc: Regex component marker
  crit: component
  conf: 0.85
  if:
    type: text
    regex: '"(hub|stri)"\s*\+|\+\s*"(hub|stri)"'
- id: go-env-credkeywords-fragments--rx-11
  desc: Regex component marker
  crit: component
  conf: 0.85
  if:
    type: text
    regex: '"(ku|be)"\s*\+|\+\s*"(ku|be)"'
- id: go-env-credkeywords-fragments--rx-12
  desc: Regex component marker
  crit: component
  conf: 0.85
  if:
    type: text
    regex: '"(doc|ker)"\s*\+|\+\s*"(doc|ker)"'
- id: go-env-credkeywords-fragments--rx-13
  desc: Regex component marker
  crit: component
  conf: 0.85
  if:
    type: text
    regex: '"(ap|au)"\s*\+|\+\s*"(ap|au)"'
- id: go-env-credkeywords-fragments--rx-14
  desc: Regex component marker
  crit: component
  conf: 0.85
  count_min: 3
  if:
    type: text
    regex: '"th"\s*\+'
composite_rules:
- id: go-env-credential-harvest
  desc: Go filters env vars for credentials
  crit: hostile
  conf: 0.96
  near_lines: 30
  all:
  - id: micro-behaviors/os/env/enumeration::go-environ-iteration
  any:
  - id: micro-behaviors/data/string/search::go-credential-keyword-filter
  - id: go-env-credkeywords-fragments
  # Diagnostic/configuration programs may enumerate their own namespace and
  # mask values before logging; that is not credential theft. The directory
  # also carries the git-isolation trait: a wrapper that clears
  # credential.helper/askPass and strips GIT_* enforces anonymous reads.
  unless:
  - id: metadata/package/testing/
  - id: micro-behaviors/os/env/config/
  - id: well-known/lib/cloud/hashicorp/nomad::nomad-archive-basename
  - id: well-known/lib/cloud/hashicorp/nomad::nomad-member-path
  - id: "metadata/file/naming::test-directory-component"
  - id: well-known/tool/offensive/raxuiscli::source-tree-path
- id: go-env-credential-exfil
  desc: Go env credential HTTP exfil
  crit: hostile
  conf: 0.98
  all:
  - id: go-env-credential-harvest
  - id: micro-behaviors/communications/http/client/library::go-http-newrequest
- id: go-env-credkeywords-fragments
  desc: Concatenated credential-keyword fragments
  crit: component
  conf: 0.85
  any:
  - id: micro-behaviors/data/string/concat::go-token-keyword-concatenation
  - id: go-env-credkeywords-fragments--rx-7
  - id: go-env-credkeywords-fragments--rx-8
  - id: go-env-credkeywords-fragments--rx-9
  - id: go-env-credkeywords-fragments--rx-10
  - id: go-env-credkeywords-fragments--rx-11
  - id: go-env-credkeywords-fragments--rx-12
  - id: go-env-credkeywords-fragments--rx-13
  - id: go-env-credkeywords-fragments--rx-14
