defaults:
  platforms: [windows, unix]
  for: [nupkg, xml]
  attack: T1195.002,T1552.001

traits:
  - id: msbuild-env-secret-filter-pattern
    desc: MSBuild filters secret environment variables
    crit: suspicious
    conf: 0.95
    for: [xml]
    if:
      type: text
      regex: 'Get-ChildItem\s+Env:[\s\S]{0,240}(PASS|SECRET|TOKEN|API_KEY|NUGET|PAT|GITHUB|AWS)'
      case_insensitive: true

  - id: msbuild-env-base64-curl-post
    desc: MSBuild posts Base64 environment data
    crit: suspicious
    conf: 0.96
    for: [xml]
    if:
      type: text
      regex: 'curl\s+-[^\r\n]{0,60}-X\s+POST[^\r\n]{0,160}--data-binary[^\r\n]{0,120}\benv\s*\|\s*base64'
      case_insensitive: true

composite_rules:
  - id: nuget-msbuild-afterbuild-env-secret-harvest
    desc: NuGet build hook harvests environment secrets
    crit: hostile
    conf: 0.98
    scope: archive
    all:
      - id: metadata/build/manifest::nuspec-file
      - id: metadata/build/manifest::msbuild-targets-file
      - id: metadata/build/msbuild::msbuild-after-build-target
      - id: micro-behaviors/process/create/shell/command-string::msbuild-exec-command
      - id: msbuild-env-secret-filter-pattern
      - id: msbuild-env-base64-curl-post

  # Restore-time hooks run on every `dotnet restore` / NuGet install of the
  # package, before any build output exists. Piping the build snapshot plus a
  # TOKEN/SECRET/PASSWORD-named property through curl --data-binary @- (stdin
  # heredoc) to an external collector is exfiltration, not telemetry: the
  # IgnoreExitCode/low-importance dressing keeps a failed or blocked upload
  # from ever surfacing in the build log.
  - id: nuget-msbuild-restore-stdin-token-exfil
    desc: NuGet restore hook exfiltrates token-bearing properties
    crit: hostile
    conf: 0.98
    scope: archive
    all:
      - id: metadata/build/msbuild::msbuild-after-restore-target
      - id: micro-behaviors/process/create/shell/command-string::msbuild-exec-command
      - id: micro-behaviors/communications/http/request/credentials/unspecified-origin::msbuild-stdin-token-upload-1
