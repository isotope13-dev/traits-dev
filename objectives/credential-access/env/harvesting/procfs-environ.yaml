# Iterating a procfs glob over every PID and splitting the NUL-separated
# environ blocks into lines dumps all processes' environments (tokens in
# worker and runner processes included) to stdout. Reading one named
# process or /proc/self stays a neutral capability.
defaults:
  platforms: [linux]
  for: [shell]
  crit: hostile
  conf: 0.96
  attack: T1552.001

composite_rules:
  - id: shell-all-process-environ-dump
    desc: Dumps every process environment via procfs
    near_lines: 3
    all:
      - id: micro-behaviors/os/env/enumerate::shell-procfs-all-process-environ
      - id: micro-behaviors/data/string/conversion::shell-tr-null-to-newline
