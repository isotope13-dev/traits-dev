defaults:
  platforms: [unix]
  for: [javascript, typescript]
  attack: T1552.001,T1041
  mbc: E1552,E1041

composite_rules:
  - id: node-proc-environ-credential-harvester
    desc: Harvests procfs environments over HTTP
    crit: hostile
    conf: 0.98
    # A process supervisor may inspect thread tags while its cloud client
    # references AWS keys elsewhere. Credential selection must be local.
    near_bytes: 8192
    all:
      - id: micro-behaviors/os/env/enumerate/process::js-cross-proc-environ-reference
      - id: micro-behaviors/communications/http/request/client::http-client-usage
      - id: micro-behaviors/data/serialize/json::json-stringify-call
    any:
      - id: micro-behaviors/os/env/secret/cloud::aws-secret-access-key-var
      - id: micro-behaviors/os/env/secret/cloud::js-aws-access-key-id-literal
      - id: micro-behaviors/os/env/secret/cloud::js-aws-session-token-literal
      - id: micro-behaviors/os/env/secret/registry::npm-token-name
      - id: micro-behaviors/os/env/secret/vcs::github-token-variable-reference
      - id: micro-behaviors/os/env/config/container::kubernetes-service-host-name
