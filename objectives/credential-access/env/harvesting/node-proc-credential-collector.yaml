defaults:
  platforms: [unix]
  for: [javascript, typescript]
  attack: T1552.001,T1041
  mbc: E1552,E1041

composite_rules:
  - id: node-proc-environ-credential-harvester
    desc: Harvests procfs environments over HTTP
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/os/env/procfs::js-cross-proc-environ-reference
      - id: micro-behaviors/communications/http/request/client::http-client-usage
      - id: micro-behaviors/data/serialize/json::json-stringify-call
    any:
      - id: micro-behaviors/os/env/cloud::aws-secret-access-key-var
      - id: micro-behaviors/os/env/package-manager::npm-token-name
      - id: micro-behaviors/os/env/vcs::github-token-variable-reference
      - id: micro-behaviors/os/env/provider::kubernetes-service-host-name
