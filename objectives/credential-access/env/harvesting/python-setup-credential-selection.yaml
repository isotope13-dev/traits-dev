defaults:
  platforms: [unix, windows]
  for: [python]
composite_rules:
  - id: python-setup-env-credential-selection
    desc: Setup file selects credential-named environment
    crit: suspicious
    conf: 0.98
    all:
      - id: metadata/package/files/included::setup-py-basename
      - id: micro-behaviors/os/env/secret-name::python-environ-credential-name-filter
    unless:
      # A security suite's install-attack simulation that only writes a local
      # /tmp marker file for its assertion.
      - id: metadata/package/testing/presence/attack-simulation::simulated-attack-marker-python

