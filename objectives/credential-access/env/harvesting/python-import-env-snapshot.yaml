defaults:
  platforms:
  - unix
  - windows
  for:
  - python
  attack: T1552.001
  crit: suspicious
  conf: 0.97
traits:
- id: python-full-env-snapshot-write-chain
  desc: Import-called full environment file write
  if:
    type: tree-sitter
    language: python
    query: |
      ((module
        (function_definition
          name: (identifier) @collector
          body: (block
            (expression_statement
              (assignment
                left: (identifier) @report
                right: (dictionary) @dict))
            (return_statement (identifier) @returned)))
        (function_definition
          name: (identifier) @writer
          body: (block
            (try_statement
              body: (block
                (expression_statement
                  (assignment
                    left: (identifier) @snap
                    right: (call function: (identifier) @called)))
                (expression_statement
                  (assignment
                    left: (identifier) @blob
                    right: (call
                      function: (attribute
                        object: (identifier) @json
                        attribute: (identifier) @dumps)
                      arguments: (argument_list . (identifier) @serialized))))
                (for_statement
                  body: (block
                    (try_statement
                      body: (block
                        (with_statement
                          body: (block
                            (expression_statement
                              (call
                                function: (attribute attribute: (identifier) @meth)
                                arguments: (argument_list . (identifier) @written)))))))))))))
        (expression_statement
          (call function: (identifier) @entry)))
        (#eq? @collector @called)
        (#eq? @report @returned)
        (#eq? @snap @serialized)
        (#eq? @blob @written)
        (#eq? @writer @entry)
        (#eq? @json "json")
        (#eq? @dumps "dumps")
        (#eq? @meth "write")
        (#match? @dict "environ\\.items\\(\\)\\s*\\}"))

      ((module
        (function_definition
          name: (identifier) @collector
          body: (block
            (expression_statement
              (assignment
                left: (identifier) @report
                right: (dictionary) @dict))
            (return_statement (identifier) @returned)))
        (function_definition
          name: (identifier) @writer
          body: (block
            (expression_statement
              (assignment
                left: (identifier) @snap
                right: (call function: (identifier) @called)))
            (expression_statement
              (assignment
                left: (identifier) @blob
                right: (call
                  function: (attribute
                    object: (identifier) @json
                    attribute: (identifier) @dumps)
                  arguments: (argument_list . (identifier) @serialized))))
            (with_statement
              body: (block
                (expression_statement
                  (call
                    function: (attribute attribute: (identifier) @meth)
                    arguments: (argument_list . (identifier) @written)))))))
        (expression_statement
          (call function: (identifier) @entry)))
        (#eq? @collector @called)
        (#eq? @report @returned)
        (#eq? @snap @serialized)
        (#eq? @blob @written)
        (#eq? @writer @entry)
        (#eq? @json "json")
        (#eq? @dumps "dumps")
        (#eq? @meth "write")
        (#match? @dict "environ\\.items\\(\\)\\s*\\}"))
  unless:
  - id: metadata/package/testing/
  - id: metadata/path::test-directory-component
composite_rules:
- id: python-import-writes-full-env-snapshot
  desc: Import writes full environment snapshot
  crit: hostile
  all:
  - id: python-full-env-snapshot-write-chain
  - id: micro-behaviors/os/env/enumeration::python-environ-items-loop
  unless:
  - id: metadata/package/testing/
  - id: metadata/path::test-directory-component
