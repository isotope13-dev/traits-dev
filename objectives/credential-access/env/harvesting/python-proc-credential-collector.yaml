defaults:
  platforms: [linux]
  for: [python]
  attack: T1552.001

composite_rules:
  - id: python-proc-environ-credential-collector
    desc: Stealer harvests other process environments
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/os/env/read/process::python-globbed-proc-environ-read
    any:
      - id: objectives/exfiltration/stealer/credential/record::cloud-config-stealer
      - id: objectives/exfiltration/stealer/credential/developer::encoded-multi-developer-secret-exfil

  - id: python-proc-environ-secret-name-selection
    desc: Reads process environs near secret-name selection
    crit: suspicious
    conf: 0.96
    near_lines: 80
    all:
      - id: micro-behaviors/os/env/read/process::python-globbed-proc-environ-read
      - id: micro-behaviors/os/env/credential/secret::python-environ-credential-name-filter
