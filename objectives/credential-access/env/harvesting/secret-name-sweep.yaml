# Harvesting credentials from a project's .env: load every assignment into
# the environment, then keep only credential-named variables.
defaults:
  platforms: [unix, windows]
  for: [markdown, shell, text]
  crit: hostile
  attack: T1552.001

composite_rules:
  - id: dotenv-loaded-then-filtered-for-secrets
    desc: Loads a project .env and filters the environment for credential names
    conf: 0.9
    near_lines: 20
    all:
      - id: micro-behaviors/os/env/read/collection::dotenv-exported-into-shell
      - id: micro-behaviors/os/env/read/collection::env-dump-filtered-to-secret-names
