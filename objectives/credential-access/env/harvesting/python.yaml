# Python environment credential harvesting
defaults:
  platforms: [linux, macos, windows, unix]
  for: [python]
  attack: T1552.001

composite_rules:
  - id: python-shell-agent-embeds-provider-key
    desc: Shell agent embeds a provider API key
    crit: hostile
    conf: 0.96
    attack: T1552.001,T1059.006
    scope: package
    for: [python, python-sdist]
    all:
      - id: micro-behaviors/communications/http/auth::nvidia-cloud-api-key-literal
      - id: micro-behaviors/process/create/shell/agent-runtime::python-run-command-tool-name
      - id: micro-behaviors/process/create/shell-subprocess::shell-true

  - id: python-multiple-provider-env-secret-reads
    desc: Python reads secrets for multiple service providers
    crit: suspicious
    conf: 0.97
    needs: 2
    any:
      - id: micro-behaviors/os/env/ai-provider::python-openai-anthropic-key-env-read
      - id: micro-behaviors/os/env/vcs::python-github-token-env-read
      - id: micro-behaviors/os/env/cloud::python-aws-secret-access-key-env-read
    unless:
      - id: llm-and-aws-sdk-client-context

  - id: python-aws-or-bedrock-client
    desc: AWS SDK session or Bedrock client constructor
    crit: notable
    conf: 0.9
    any:
      - id: micro-behaviors/communications/http/services/aws::python-aws-sdk-client-session
      - id: micro-behaviors/communications/http/llm::python-bedrock-sdk-client

  # A multi-provider LLM integration legitimately reads both LLM-provider and
  # AWS credentials when it constructs the corresponding authenticated SDK
  # clients. Requiring both read classes and both client classes keeps this
  # exception from hiding unrelated credential collection in an agent that
  # happens to use one provider SDK.
  - id: llm-and-aws-sdk-client-context
    desc: LLM gateway constructs matching provider and AWS clients
    crit: exception
    conf: 0.95
    all:
      - id: micro-behaviors/os/env/ai-provider::python-openai-anthropic-key-env-read
      - id: micro-behaviors/os/env/cloud::python-aws-secret-access-key-env-read
      - id: python-aws-or-bedrock-client
    any:
      - id: micro-behaviors/communications/http/llm::python-openai-sdk-client
      - id: micro-behaviors/communications/http/llm::python-anthropic-sdk-client

  - id: python-import-writes-host-env
    desc: Import writes host and key env data
    crit: hostile
    conf: 0.96
    near_lines: 80
    all:
      - id: micro-behaviors/os/sysinfo/hostname::python-socket-gethostname
      - id: micro-behaviors/os/env/secret-name::python-env-keyword-key
      - id: micro-behaviors/fs/write/file/handle::py-open-write-inline
