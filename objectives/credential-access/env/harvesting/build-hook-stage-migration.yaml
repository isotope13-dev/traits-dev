defaults:
  platforms:
  - unix
  - windows
  crit: suspicious
  attack: T1195.002
composite_rules:
- id: setup-build-hook-environment-temp-staging
  desc: Build hook stages captured environment in temporary file
  crit: hostile
  conf: 0.995
  for:
  - python
  attack: T1195.002,T1552.001
  all:
  - id: objectives/credential-access/env/harvesting::pypi-build-hook-environment-file-harvest
  - id: micro-behaviors/fs/file/open/unspecified::python-open-hardcoded-tmp-path
  - id: micro-behaviors/fs/write/file/full/string::python-pathlib-write-text
