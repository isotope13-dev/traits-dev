defaults:
  platforms: [unix]
  attack: T1552.001
  for: [shell, python, javascript, ruby]
traits:
- id: echo-aws-access-key-id
  desc: Echoes AWS access key ID
  crit: suspicious
  if:
    type: text
    regex: '(?m)^\s*echo\s+["'']?\$\{?AWS_ACCESS_KEY_ID\}?["'']?\s*$'
- id: echo-aws-secret-access-key
  desc: Echoes AWS secret access key
  crit: suspicious
  if:
    type: text
    regex: '(?m)^\s*echo\s+["'']?\$\{?AWS_SECRET_ACCESS_KEY\}?["'']?\s*$'
- id: echo-openai-api-key
  desc: Echoes OpenAI API key
  crit: suspicious
  if:
    type: text
    regex: '(?m)^\s*echo\s+["'']?\$\{?OPENAI_API_KEY\}?["'']?\s*$'
- id: echo-database-url
  desc: Echoes database URL variable
  crit: suspicious
  if:
    type: text
    regex: '(?m)^\s*echo\s+["'']?\$\{?DATABASE_URL\}?["'']?\s*$'
composite_rules:
- id: env-echo-secret-vars
  desc: Echoes credential environment variables
  crit: suspicious
  conf: 0.9
  any:
  - id: echo-aws-access-key-id
  - id: echo-aws-secret-access-key
  - id: echo-openai-api-key
  - id: echo-database-url
