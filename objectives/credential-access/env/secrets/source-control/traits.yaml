defaults:
  platforms:
  - windows
  - unix
  attack: T1552.001
  for:
  - javascript
  - typescript
  - python
  - shell
traits:
- id: env-github-pat
  desc: GitHub personal access token environment access
  crit: suspicious
  conf: 0.82
  if:
    type: text
    # Keep the identifier boundary explicit: GITHUB_PAT is a prefix of the
    # GitHub Actions runtime variable GITHUB_PATH.
    regex: 'process\.env\.GITHUB_PAT([^A-Za-z0-9_]|$)'
  unless:
  - id: well-known/tool/detection/security-scanner/
  - id: micro-behaviors/communications/http/services/github/
  - id: well-known/tool/development/aube::aube-external-tools-download-context
- id: env-gitlab-token
  desc: GITLAB_TOKEN env access
  crit: suspicious
  conf: 0.7
  if:
    type: string_literal
    substr: process.env.GITLAB_TOKEN
  unless:
  - id: well-known/lib/cloud/electron-publish::gitlab-publisher
- id: env-gh-token
  desc: GH_TOKEN env access
  crit: suspicious
  conf: 0.7
  if:
    type: string_literal
    substr: process.env.GH_TOKEN
  unless:
    - id: source-control-token-known-benign-context
    - id: well-known/tool/detection/agent-glovebox::archive-context
    - id: well-known/tool/detection/agent-sanitizer::agent-sanitizer-package-context
    - id: micro-behaviors/communications/http/services/github/
    - id: metadata/file/extension/identity::markdown-file-basename
    - id: metadata/file/format/structured::sourcemap-sources-content
    - id: well-known/tool/development/vcs/github-desktop/
- id: github-app-private-key
  desc: GitHub App private key env access
  crit: notable
  conf: 0.86
  if:
    type: text
    regex: process\.env\.GITHUB_APP_PRIVATE_KEY\b
- id: env-bitbucket-token
  desc: BITBUCKET_TOKEN env access
  crit: suspicious
  conf: 0.7
  if:
    type: string_literal
    substr: process.env.BITBUCKET_TOKEN
  unless:
  - id: well-known/lib/cloud/electron-publish::bitbucket-publisher
composite_rules:
# Release automation that reads a GitHub token while routing secret env values
# to log redaction is provisioning its own authentication, not harvesting
# credentials: a stealer ships the secret outbound instead of scrubbing it
# from logs.
- id: github-token-redaction-context
  desc: GitHub token use with secret redaction
  crit: exception
  conf: 0.85
  # `secret-env-value-redaction` is a JavaScript-only shape.
  for: [javascript, typescript]
  all:
  - id: micro-behaviors/os/env/vcs::github-token-name-reference
  - id: micro-behaviors/data/manipulation::secret-env-value-redaction
# Tooling that reads a source-control token to authenticate its own work:
# aube's external-tool downloader, release automation that redacts the token
# from its logs, and a source map's embedded `sourcesContent` copy of such code.
- id: source-control-token-known-benign-context
  desc: Recognized source-control token tooling
  crit: exception
  conf: 0.85
  any:
  - id: well-known/tool/development/aube::aube-external-tools-download-context
  - id: metadata/file/format/structured::sourcemap-sources-content
  - id: github-token-redaction-context
  - id: micro-behaviors/os/security/auth/secret::github-cli-token-helper-context
- id: node-git-token
  desc: Source-control token env access
  crit: suspicious
  conf: 0.9
  any:
  - id: env-gitlab-token
  - id: env-gh-token
  - id: env-bitbucket-token
  downgrade:
    any:
    - id: metadata/build/ci/github-actions::action-bundle-context
  unless:
  - id: source-control-token-known-benign-context
  - id: micro-behaviors/communications/http/services/github/
  - id: well-known/lib/cloud/electron-publish/
  - id: well-known/tool/development/vcs/github-desktop/
  - id: well-known/tool/detection/agent-glovebox::archive-context
  - id: well-known/tool/detection/agent-sanitizer::agent-sanitizer-package-context
- id: github-token-indicators
  desc: GitHub token variable indicators
  crit: notable
  conf: 0.7
  any:
  - id: micro-behaviors/os/env/vcs::github-token-name-reference
  - id: micro-behaviors/os/env/vcs::gh-token-name-reference
  unless:
  - id: metadata/package/testing/corpus::inert-security-input-module
  - id: well-known/app/ai/agent-runtime/bobi/
# metadata/lang/scripted::env-access is Lua's `_ENV`/getfenv composite
# (`for: [lua]`) -- an id collision, not a generic "reads an environment
# variable" atom. The equivalent for a JS/TS node is process-env.
- id: github-token
  unless:
    - id: metadata/package/testing/corpus::inert-security-input-module
  desc: GitHub token environment variable access
  crit: notable
  conf: 0.7
  for:
  - typescript
  all:
  - id: github-token-indicators
  - id: micro-behaviors/os/env/read::process-env
