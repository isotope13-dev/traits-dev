defaults:
  platforms:
  - windows
  - unix
  attack: T1552.001
  for:
  - javascript
  - typescript
  - python
  - shell
traits:
- id: env-github-token
  desc: Reads GITHUB_TOKEN via process.env
  crit: suspicious
  conf: 0.7
  if:
    type: string_literal
    substr: process.env.GITHUB_TOKEN
  unless:
  - id: well-known/tool/detection/security-scanner/
  - id: micro-behaviors/communications/http/services/github/
  - id: well-known/tool/development/aube::aube-external-tools-download-context
  - id: metadata/file/format/structured::sourcemap-sources-content
  - id: metadata/package/testing/presence/harness::test-directory
  - id: well-known/app/development/github-desktop/
  - id: metadata/library/github-actions::action-bundle-context
  downgrade:
    any:
    - id: metadata/library/github-actions::action-bundle-context
- id: env-github-pat
  desc: GitHub personal access token environment access
  crit: suspicious
  conf: 0.82
  if:
    type: text
    # Keep the identifier boundary explicit: GITHUB_PAT is a prefix of the
    # GitHub Actions runtime variable GITHUB_PATH.
    regex: 'process\.env\.GITHUB_PAT([^A-Za-z0-9_]|$)'
  unless:
  - id: well-known/tool/detection/security-scanner/
  - id: micro-behaviors/communications/http/services/github/
  - id: well-known/tool/development/aube::aube-external-tools-download-context
- id: env-gitlab-token
  desc: GITLAB_TOKEN env access
  crit: suspicious
  conf: 0.7
  if:
    type: string_literal
    substr: process.env.GITLAB_TOKEN
  unless:
  - id: well-known/lib/cloud/electron-publish::gitlab-publisher
- id: env-gh-token
  desc: GH_TOKEN env access
  crit: suspicious
  conf: 0.7
  if:
    type: string_literal
    substr: process.env.GH_TOKEN
  unless:
    - id: well-known/tool/detection/agent-glovebox::archive-context
    - id: well-known/tool/detection/agent-sanitizer::agent-sanitizer-package-context
    - id: micro-behaviors/communications/http/services/github/
    - id: metadata/file/format/structured::sourcemap-sources-content
    - id: well-known/app/development/github-desktop/
- id: github-app-private-key
  desc: GitHub App private key env access
  crit: notable
  conf: 0.86
  if:
    type: text
    regex: process\.env\.GITHUB_APP_PRIVATE_KEY\b
- id: env-bitbucket-token
  desc: BITBUCKET_TOKEN env access
  crit: suspicious
  conf: 0.7
  if:
    type: string_literal
    substr: process.env.BITBUCKET_TOKEN
  unless:
  - id: well-known/lib/cloud/electron-publish::bitbucket-publisher
- id: github-token-var
  desc: GITHUB_TOKEN env var name reference
  crit: component
  conf: 0.85
  for: [javascript, typescript, python, shell, go, rust, c, cpp, perl, powershell]
  if:
    type: text
    regex: '(^|[^A-Z0-9_])GITHUB_TOKEN([^A-Z0-9_]|$)'
  not:
  - substr: process.env.GITHUB_TOKEN
  - regex: 'env:\s*["'']GITHUB_TOKEN["'']'
  unless:
  - id: well-known/app/ai/bobi/
  - id: well-known/app/ai/feral-ai/
  - id: metadata/file/format/structured::sourcemap-sources-content
- id: gh-token-var
  desc: GH_TOKEN env var name reference
  crit: component
  conf: 0.85
  if:
    type: text
    regex: "(^|[^A-Z0-9_])GH_TOKEN([^A-Z0-9_]|$)"
  unless:
  - id: well-known/app/ai/bobi/
  - id: metadata/file/format/structured::sourcemap-sources-content
composite_rules:
- id: node-git-token
  desc: Source-control token env access
  crit: suspicious
  conf: 0.9
  any:
  - id: env-github-token
  - id: env-gitlab-token
  - id: env-gh-token
  - id: env-bitbucket-token
  downgrade:
    any:
    - id: metadata/library/github-actions::action-bundle-context
  unless:
  - id: well-known/tool/development/aube::aube-external-tools-download-context
  - id: metadata/file/format/structured::sourcemap-sources-content
  - id: micro-behaviors/communications/http/services/github/
  - id: well-known/lib/cloud/electron-publish/
  - id: well-known/app/development/github-desktop/
  - id: well-known/tool/detection/agent-glovebox::archive-context
  - id: well-known/tool/detection/agent-sanitizer::agent-sanitizer-package-context
- id: github-token-indicators
  desc: GitHub token variable indicators
  crit: notable
  conf: 0.7
  any:
  - id: github-token-var
  - id: gh-token-var
  unless:
  - id: well-known/app/ai/bobi/
- id: github-token
  desc: GitHub token environment variable access
  crit: notable
  conf: 0.7
  all:
  - id: github-token-indicators
  - id: metadata/lang/scripted::env-access
