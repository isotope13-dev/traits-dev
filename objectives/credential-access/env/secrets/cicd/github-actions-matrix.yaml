defaults:
  platforms: [unix, windows]
  for: [github-actions]
  attack: T1552.001

composite_rules:
  - id: gha-matrix-environment-secret-harvest
    desc: Actions workflow harvests serialized secrets across matrix environments
    crit: hostile
    conf: 0.98
    all:
      - id: metadata/build/ci/gate::environment-from-matrix
      - id: micro-behaviors/os/env/ci-credentials::complete-secrets-json-expression
      - id: micro-behaviors/os/env/ci-credentials::gha-shell-secrets-output-source
