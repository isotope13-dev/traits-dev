# Staged variant of the encoded-secrets log dump: the whole secrets map is
# bound into a workflow/job/step env var first, then a transformed
# whole-environment dump carries it into the log. The binding is what
# distinguishes this from the suspicious plain encoded environment dump
# (objectives/exfiltration/stealer/env): this dumped environment
# necessarily holds every Actions secret.
defaults:
  platforms: [unix, windows]
  for: [github-actions]
  crit: hostile
  conf: 0.98
  attack: T1552.001,T1564.008

composite_rules:
  - id: gha-encoded-secrets-bound-environment-log
    desc: Encoded environment log carries bound Actions secrets
    all:
      - id: micro-behaviors/os/env/ci-credentials::complete-secrets-json-expression
      - id: micro-behaviors/os/env/ci-credentials::complete-secrets-bound-to-env
    any:
      - id: micro-behaviors/os/env/enumerate::gha-shell-encoded-environment-output
      - id: micro-behaviors/os/env/enumerate::gha-shell-hex-environment-output
      - id: micro-behaviors/os/env/enumerate::gha-python-encoded-environment-output
      - id: micro-behaviors/os/env/enumerate::gha-node-encoded-environment-output
      - id: micro-behaviors/os/env/enumerate::gha-powershell-encoded-environment-output
      - id: micro-behaviors/os/env/enumerate::gha-ruby-encoded-environment-output
