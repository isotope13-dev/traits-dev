defaults:
  platforms: ["unix", "windows"]
  for: ["github-actions"]
  crit: "suspicious"
  attack: "T1552.001"
traits:
  - id: gha-printenv-github-token
    desc: Workflow greps GITHUB_TOKEN from printenv
    crit: suspicious
    conf: 0.96
    if:
      type: text
      regex: 'printenv.{0,24}\|\s*grep.{0,24}GITHUB_TOKEN'
  - id: gha-github-token-tmp-write
    desc: Workflow appends GITHUB_TOKEN into /tmp
    crit: suspicious
    conf: 0.95
    if:
      type: text
      regex: '\$GITHUB_TOKEN.{0,40}>>\s*/tmp/'
  - id: curl-with-secrets-marker
    desc: HTTP request with secrets marker nearby
    crit: suspicious
    conf: 0.85
    if:
      type: text
      regex: '\$\{\{\s*secrets\.[^\n]{0,80}curl\b'
    unless:
      - id: metadata/build/ci/github-actions::action-testdata-path
      - id: micro-behaviors/communications/http/authorization-header::workflow-secret-bearer-auth
    # === Webhook Abuse ===
composite_rules:
  - id: gha-runner-token-tmp-dump
    desc: Workflow dumps GITHUB_TOKEN into /tmp
    crit: hostile
    conf: 0.96
    all:
    - id: objectives/credential-access/env/secrets/cicd::gha-printenv-github-token
    - id: objectives/credential-access/env/secrets/cicd::gha-github-token-tmp-write
