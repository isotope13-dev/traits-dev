# A pull_request_target workflow must not pass secrets into repository-local
# actions after checking out the external PR head: the PR controls that action
# and can use the input to steal credentials.
defaults:
  platforms: [unix, windows]
  for: [github-actions]
  attack: "T1195.002,T1552.001"

composite_rules:
  - id: pr-target-head-local-action-secret
    desc: External PR head controls secret-fed local action
    crit: hostile
    conf: 0.99
    all:
      - id: metadata/build/ci/gate::gha-pr-target-external-head-checkout
      - id: metadata/build/ci/trigger::pull-request-target-trigger
      - id: metadata/build/ci/secret::local-composite-action-secret-input
    # Mirrors the sibling gha-pr-target-head-secret-exposure rule's carve-out:
    # a maintainer-reviewed approval or label gate ahead of the checkout
    # means the external head never reaches the secret-fed action
    # unreviewed. JFrog's build-info-go and Rook gate on a "safe to test"
    # label this way before running Artifactory/cluster integration tests.
    unless:
      - id: metadata/build/ci/gate::trust-gated-external-pr-checkout
      - id: metadata/build/ci/gate::output-selected-approval-gated-external-pr-checkout
      - id: metadata/build/ci/gate::safe-to-test-gated-external-pr-checkout
