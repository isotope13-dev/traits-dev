defaults:
  platforms: [unix, windows]
  crit: hostile
  for: [javascript, typescript]
composite_rules:
  - id: npm-postinstall-probes-actions-oidc-mint
    desc: Postinstall OIDC token name and curl clues
    crit: suspicious
    conf: 0.97
    attack: "T1195.002,T1552.001"
    for: [npm, tar, zip, package.json, javascript]
    scope: archive
    near_bytes: 8000
    all:
      - id: metadata/package/scripts/lifecycle::filtered-postinstall-hook
      - id: micro-behaviors/os/env/cicd/runner::process-env-ci
      - id: micro-behaviors/os/env/cicd/pipeline::process-env-github-workspace
      - id: micro-behaviors/os/env/ci-credentials::actions-oidc-request-token-name
      - id: micro-behaviors/communications/http/download/cli/curl-wget::node-execsync-curl-command
    unless:
      - id: metadata/build/ci/github-actions::actions-sdk
