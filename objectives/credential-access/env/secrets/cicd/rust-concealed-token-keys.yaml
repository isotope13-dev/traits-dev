defaults:
  platforms: [unix, windows]
  for: [rust]
composite_rules:
  # CI input tokens are read under names written as hex escapes, then a DNS
  # resolver CLI is spawned. Concealed key names with a network channel in the
  # same file read credentials on purpose.
  - id: rust-hex-escaped-env-key-with-dns-lookup
    desc: Rust reads env keys spelled with hex escapes then looks up DNS
    crit: hostile
    conf: 0.93
    attack: T1552.001,T1048.003
    scope: file
    near_bytes: 2500
    all:
      - id: micro-behaviors/data/string/encoding::rust-hex-escaped-printable-literal
      - id: micro-behaviors/os/env/read/current::std-env-var
      - id: micro-behaviors/communications/dns/cli::rust-dns-cli-command-new
