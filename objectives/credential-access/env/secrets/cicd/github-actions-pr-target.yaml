# GitHub Actions credentials exposed to untrusted pull-request code.
defaults:
  platforms: [unix, windows]
  for: [github-actions]
  attack: "T1195.002,T1528"

composite_rules:
- id: pr-target-head-oidc-credential-exposure
  # id-token:write plus an untrusted checkout is only hostile when secrets also
  # reach a repository-local action the PR head can rewrite. Bare permission,
  # trusted action inputs, and trusted run steps are common review-bot patterns.
  desc: pull_request_target exposes OIDC to PR head
  crit: hostile
  conf: 0.99
  all:
  - id: metadata/build/ci/gate::gha-pr-target-external-head-checkout
  - id: metadata/build/ci/trigger::pull-request-target-trigger
  - id: metadata/build/ci/permission::id-token-write-permission
  - id: metadata/build/ci/secret::local-composite-action-secret-input
  unless:
  - id: metadata/build/ci/gate::approval-gated-external-pr-checkout
  - id: metadata/build/ci/gate::output-selected-approval-gated-external-pr-checkout

- id: pr-target-head-write-secret-exposure
  # contents:write with secrets only in a trusted action input or run step is
  # common for review bots; require a repository-local action that the checked-
  # out PR head controls as the executable secret-fed surface.
  desc: PR head controls secret-fed write action
  crit: hostile
  conf: 0.98
  attack: "T1195.002,T1552.001"
  all:
  - id: metadata/build/ci/gate::gha-pr-target-external-head-checkout
  - id: metadata/build/ci/trigger::pull-request-target-trigger
  - id: metadata/build/ci/permission::workflow-or-job-contents-write
  - id: metadata/build/ci/secret::local-composite-action-secret-input
  unless:
  - id: metadata/build/ci/gate::approval-gated-external-pr-checkout
  - id: metadata/build/ci/gate::output-selected-approval-gated-external-pr-checkout
