# GitHub Actions credentials exposed to untrusted pull-request code.
defaults:
  platforms: [unix, windows]
  for: [github-actions]
  attack: "T1195.002,T1528"

composite_rules:
- id: pr-target-head-oidc-credential-exposure
  # id-token:write plus an untrusted checkout is only hostile when secrets also
  # reach an executable surface (env/run/local action) the PR head can abuse to
  # mint cloud credentials. Bare permission + checkout FPs on review bots.
  desc: pull_request_target exposes OIDC to PR head
  crit: hostile
  conf: 0.99
  all:
  - id: metadata/build/ci::gha-pr-target-external-head-checkout
  - id: metadata/build/github-actions::pull-request-target-trigger
  - id: metadata/build/github-actions::id-token-write-permission
  any:
  - id: metadata/build/github-actions::local-composite-action-secret-input
  - id: metadata/build/github-actions::job-environment-secret-reference
  - id: metadata/build/github-actions::step-environment-secret-reference
  - id: metadata/build/github-actions::run-secret-reference
  unless:
  - id: metadata/build/github-actions::approval-gated-external-pr-checkout
  - id: metadata/build/github-actions::output-selected-approval-gated-external-pr-checkout

- id: pr-target-head-write-secret-exposure
  # contents:write with secrets only in third-party action `with:` is common for
  # review bots; require secrets on an executable surface the checkout controls.
  desc: PR head controls secret-fed write action
  crit: hostile
  conf: 0.98
  attack: "T1195.002,T1552.001"
  all:
  - id: metadata/build/ci::gha-pr-target-external-head-checkout
  - id: metadata/build/github-actions::pull-request-target-trigger
  - id: metadata/build/github-actions::workflow-or-job-contents-write
  any:
  - id: metadata/build/github-actions::local-composite-action-secret-input
  - id: metadata/build/github-actions::job-environment-secret-reference
  - id: metadata/build/github-actions::step-environment-secret-reference
  - id: metadata/build/github-actions::run-secret-reference
  unless:
  - id: metadata/build/github-actions::approval-gated-external-pr-checkout
  - id: metadata/build/github-actions::output-selected-approval-gated-external-pr-checkout
