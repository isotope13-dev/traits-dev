defaults:
  platforms: [unix, windows]
  for: [npm, tar, zip, package.json, javascript]
composite_rules:
  - id: npm-postinstall-oidc-bearer-request
    desc: Postinstall requests runner OIDC token with bearer
    crit: hostile
    conf: 0.98
    scope: archive
    attack: T1195.002,T1552.001
    all:
      - id: objectives/credential-access/env/secrets/cicd::npm-postinstall-probes-actions-oidc-mint
      - id: micro-behaviors/os/env/ci-credentials::actions-oidc-curl-bearer-request
