# A comment-triggered workflow that interpolates untrusted comment text into a
# shell step while an Actions secret is in the step environment is risky, but
# maintainer bots (tag/release bots) routinely need GH_TOKEN for git push.
# Keep the combination notable; hostile credential access still comes from
# stagers such as gha-comment-shell-stager that exfiltrate or download-exec.
defaults:
  platforms: [unix, windows]
  for: [github-actions]
  attack: "T1059.004,T1552.001,T1195.002"

composite_rules:
  - id: gha-comment-body-secret-exposure
    desc: Comment-controlled shell receives an Actions secret
    crit: notable
    conf: 0.9
    all:
      - id: metadata/build/ci/trigger::issue-comment-trigger
      - id: objectives/execution/exploit/command-injection::gha-comment-body-run
      - id: metadata/build/ci/secret::step-environment-secret-reference
