# A comment-triggered workflow that interpolates attacker-controlled comment
# text into a shell step while exposing an Actions secret gives that comment
# code a direct credential-access path.
defaults:
  platforms: [unix, windows]
  for: [github-actions]
  attack: "T1059.004,T1552.001,T1195.002"

composite_rules:
  - id: gha-comment-body-secret-exposure
    desc: Comment-controlled shell receives an Actions secret
    crit: hostile
    conf: 0.99
    all:
      - id: metadata/build/github-actions::issue-comment-trigger
      - id: objectives/supply-chain/trojanized/build-pipeline::gha-comment-body-run
      - id: metadata/build/github-actions::step-environment-secret-reference
