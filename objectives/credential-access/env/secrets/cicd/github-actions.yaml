# GitHub Actions credential-store access. Serialization is sensitive access,
# but does not itself establish exfiltration; transport composites reference
# this atom from their own objective directories.
defaults:
  platforms: [unix, windows]
  for: [github-actions]
  attack: T1552.001

traits:
  - id: complete-secrets-json-expression
    desc: Serializes complete GitHub Actions secrets
    crit: suspicious
    conf: 0.97
    if:
      type: text
      regex: '\$\{\{\s*toJSON\(\s*secrets\s*\)\s*\}\}'
    unless:
      - id: well-known/app/infrastructure/pulumi::github-secrets-export-action
      - id: well-known/app/infrastructure/pytorch-test-infra::secrets-env-runner-script
      - id: well-known/app/infrastructure/wads::wads-ci-context
      # OpenRemote overlays the secrets map into SECRETS for its own
      # multi-repo deployment matrix; the sink is its deploy scripts.
      - id: well-known/app/infrastructure/openremote::openremote-deploy-context
