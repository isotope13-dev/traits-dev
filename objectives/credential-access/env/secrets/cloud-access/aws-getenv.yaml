defaults:
  platforms:
    - unix
    - windows
  for: [scripts, binaries]

composite_rules:
  - id: aws-env-vars
    desc: AWS environment variable names
    any:
      - id: aws-access-key-dup
      - id: aws-secret
    crit: component
  - id: aws-cred-harvest
    desc: AWS credential environment variable harvesting
    crit: suspicious
    conf: 0.85
    attack: T1552.001
    all:
      - id: micro-behaviors/os/env/read::os-getenv
      - id: aws-env-vars
