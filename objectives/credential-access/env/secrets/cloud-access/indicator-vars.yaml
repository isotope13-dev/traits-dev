defaults:
  platforms:
  - windows
  - unix
  attack: T1552.001
  for:
  - javascript
  - typescript
  - python
  - shell
  - ruby
traits:
- id: aws-secret-env-access
  desc: Reads AWS secret key from environment
  crit: notable
  conf: 0.88
  for: [shell, python, go, rust, perl, javascript, typescript, powershell, c, cpp]
  if:
    type: text
    regex: '(?i)(env(iron)?[\.\[:]|getenv\().{0,10}["'']?AWS_SECRET_ACCESS_KEY\b'

- id: aws-access-key-dup
  desc: AWS_ACCESS_KEY environment variable access
  crit: notable
  conf: 0.85
  if:
    type: text
    regex: "^AWS_ACCESS_KEY"
- id: aws-secret
  desc: AWS_SECRET environment variable access
  crit: notable
  conf: 0.85
  if:
    type: text
    regex: "^AWS_SECRET"
