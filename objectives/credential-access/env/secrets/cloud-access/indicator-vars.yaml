defaults:
  platforms:
  - windows
  - unix
  attack: T1552.001
  for:
  - javascript
  - typescript
  - python
  - shell
  - ruby
traits:
# aws-secret-env-access moved to micro-behaviors/os/env/cloud as
# aws-secret-access-key-env-read: one env read is a capability.
- id: aws-access-key-dup
  unless:
    - id: metadata/package/testing/corpus::inert-security-input-module
  desc: AWS_ACCESS_KEY environment variable access
  crit: notable
  conf: 0.85
  for: [javascript, typescript, python, shell, ruby, php]
  if:
    type: text
    regex: "^AWS_ACCESS_KEY"
- id: aws-secret
  unless:
    - id: metadata/package/testing/corpus::inert-security-input-module
  desc: AWS_SECRET environment variable access
  crit: notable
  conf: 0.85
  for: [javascript, typescript, python, shell, ruby, php]
  if:
    type: text
    regex: "^AWS_SECRET"

# A library class that reads the cloud keys and then hands them to a network
# call. The legit `ctx` package's constructor builds a dict; this clone's
# constructor additionally reads AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY
# into itself and GETs them to a known collector host. The env read alone is
# notable (tools do it); paired with a flagged collection endpoint there is
# no honest reader.
#
# Worked example: the PyPI `ctx` typosquat 0.2.2, whose `sendRequest()` GETs
# `anti-theft-web.herokuapp.com/hacked/<host>/<access>/<secret>`.
composite_rules:
  - id: cloud-secret-env-sent-to-collector
    for: [python, javascript]
    desc: Cloud secrets read from env reach a collector host
    crit: hostile
    conf: 0.96
    attack: T1552.001,T1041
    all:
      - id: micro-behaviors/os/env/cloud::aws-secret-access-key-env-read
      - id: objectives/command-and-control/infrastructure/domain/malicious::anti-theft-web-heroku
