# An unauthenticated serverless endpoint that evaluates request data lets an
# attacker read the temporary credentials injected into the function runtime.
# The request payloads below are code expressions, not ordinary application
# configuration reads: they dynamically import Python's os module and index a
# specific AWS execution-credential environment variable. Requiring the three
# components distinguishes theft of a complete temporary role session from a
# program reading one credential it was intentionally configured to use.
defaults:
  platforms: [unix, windows]
  for: [scripts, source]
  attack: T1552.001

traits:
  - id: python-import-aws-access-key-payload
    desc: Python payload reads AWS access-key ID env
    crit: suspicious
    conf: 0.99
    if:
      type: text
      regex: '__import__\s*\(\s*["'']os["'']\s*\)\s*\.\s*environ\s*\[\s*["'']AWS_ACCESS_KEY_ID["'']\s*\]'

  - id: python-import-aws-secret-key-payload
    desc: Python payload reads AWS secret-key env
    crit: suspicious
    conf: 0.99
    if:
      type: text
      regex: '__import__\s*\(\s*["'']os["'']\s*\)\s*\.\s*environ\s*\[\s*["'']AWS_SECRET_ACCESS_KEY["'']\s*\]'

  - id: python-import-aws-session-token-payload
    desc: Python payload reads AWS session-token env
    crit: suspicious
    conf: 0.99
    if:
      type: text
      regex: '__import__\s*\(\s*["'']os["'']\s*\)\s*\.\s*environ\s*\[\s*["'']AWS_SESSION_TOKEN["'']\s*\]'

composite_rules:
  - id: python-injection-aws-role-session-theft
    desc: Python injection payload steals a complete AWS role session
    # The complete credential set is highly suspicious, but without transport
    # or follow-on use this broad source matcher does not meet the hostile
    # precision bar. The composites below add those concrete attack contexts.
    crit: suspicious
    conf: 0.995
    near_bytes: 2048
    all:
      - id: python-import-aws-access-key-payload
      - id: python-import-aws-secret-key-payload
      - id: python-import-aws-session-token-payload

  - id: api-gateway-lambda-role-credential-theft
    desc: API Gateway requests inject code to steal Lambda role credentials
    crit: hostile
    conf: 0.995
    near_bytes: 4096
    all:
      - id: python-injection-aws-role-session-theft
      - id: micro-behaviors/communications/http/services/cloud::aws-api-gateway
      - id: micro-behaviors/communications/http/curl::curl-data-urlencode-option

  - id: stolen-aws-role-session-validation
    desc: Injected AWS role credentials are validated through STS
    crit: hostile
    conf: 0.995
    near_bytes: 4096
    all:
      - id: python-injection-aws-role-session-theft
      - id: micro-behaviors/communications/http/services/aws-iam::sts-get-caller-identity-cli

  - id: stolen-aws-role-session-secret-access
    desc: Injected AWS role credentials access Secrets Manager
    crit: hostile
    conf: 0.995
    near_bytes: 4096
    all:
      - id: python-injection-aws-role-session-theft
      - id: micro-behaviors/os/security/auth/secret::aws-secretsmanager-get
