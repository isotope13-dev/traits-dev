defaults:
  platforms: [windows, unix]
  for: [swift]
  attack: T1552.001

traits:
  - id: swift-aws-env-secret-access
    desc: Swift reads AWS credential env var
    crit: notable
    conf: 0.92
    if:
      type: text
      regex: 'ProcessInfo\.processInfo\.environment\s*\[\s*"AWS_(ACCESS_KEY_ID|SECRET_ACCESS_KEY)"\s*\]'
    # Swift test harnesses commonly pass CI credentials to a locally launched
    # service.  The path identifies test source rather than package runtime.
    unless:
      - type: path
        regex: '(?i)(^|[\\/])[^\\/]*(tests?|testsupport|test-suite)[^\\/]*([\\/]|$)'

  - id: swift-azure-env-secret-names
    desc: Swift Azure secret env names
    crit: suspicious
    conf: 0.9
    if:
      type: text
      regex: 'AZURE_CLIENT_ID[\s\S]{0,220}AZURE_CLIENT_SECRET'

  - id: swift-gcp-env-secret-names
    desc: Swift GCP credential env names
    crit: suspicious
    conf: 0.88
    if:
      type: text
      regex: 'GOOGLE_APPLICATION_CREDENTIALS[\s\S]{0,220}GOOGLE_CLOUD_PROJECT'

  - id: swift-secret-env-filter
    desc: Swift secret env suffix filter
    crit: suspicious
    conf: 0.86
    if:
      type: text
      regex: 'hasSuffix\("_SECRET"\)[\s\S]{0,220}hasSuffix\("_TOKEN"\)'

composite_rules:
  - id: swift-cloud-env-secret-harvest
    desc: Swift cloud env secret harvest
    crit: suspicious
    conf: 0.96
    needs: 2
    any:
      - id: swift-aws-env-secret-access
      - id: swift-azure-env-secret-names
      - id: swift-gcp-env-secret-names
      - id: swift-secret-env-filter
