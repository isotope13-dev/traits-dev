defaults:
  platforms: [windows, unix]
  for:
    - javascript
    - typescript
  mbc: E1059
  attack: T1552.001
traits:
  - id: npm-auth-token-extraction
    desc: NPM auth token extraction via string replace
    crit: suspicious
    conf: 1.0
    if:
      type: text
      regex: \.replace\(\s*['"]//registry\.npmjs\.org/:_authToken=['"]\s*,
    unless:
      - id: metadata/package/testing/presence/harness::test-directory
      - id: metadata/file/naming::test-directory-component
