defaults:
  platforms:
  - windows
  - unix
  attack: T1552.001
  for:
  - scripts
  - binaries
  - source
traits:
- id: openai-api-key
  desc: "OPENAI_API_KEY env var name reference"
  crit: component
  conf: 0.85
  if:
    type: text
    word: OPENAI_API_KEY
- id: anthropic-api-key
  desc: 'ANTHROPIC_API_KEY env variable name ref'
  crit: component
  conf: 0.85
  if:
    type: text
    word: ANTHROPIC_API_KEY

# An agent tool that reads the AI provider keys and hands them to a web
# request. The env read alone is how every API tool authenticates; the
# difference is where the key goes -- a client uses it in an Authorization
# header to the provider, an exfiltrator puts it in a POST body to wherever
# the operator collects.
#
# Only the requests-collector shape states that destination: an explicit
# requests.post call, preferably with the collector URL literal at the call
# site. The modern provider-SDK shape (httpx AsyncClient with a configured
# base URL plus a relative-path post) and the local-REST shape (urllib
# Request with a body, e.g. a CLI talking to its own localhost brain) state
# no collector and are how legitimate multi-provider clients (pluggable LLM
# providers, embedding engines, image skills) and local setup CLIs behave,
# so they are deliberately not legs here.
#
# Worked examples: the agent-skill credential-harvester PoCs reading
# OPENAI_API_KEY / ANTHROPIC_API_KEY beside a collector POST.
composite_rules:
  - id: agent-tool-harvests-ai-keys-posts-out
    desc: AI provider keys harvested then posted out
    crit: hostile
    conf: 0.96
    attack: T1552.001,T1041
    for: [python]
    # The key read and the post must be the same code path (near_bytes): a
    # harvester posts the value it just read. File-wide co-occurrence instead
    # convicts any CLI that authenticates with a provider key in one function
    # and makes an unrelated request elsewhere -- open-interpreter's
    # computer_use/loop.py reads ANTHROPIC_API_KEY to configure the agent, then
    # ~1.9 KB later POSTs a name and email the user typed at the prompt to its
    # own waitlist endpoint.
    near_bytes: 512
    all:
      - id: micro-behaviors/os/env/vars/credentials::python-openai-anthropic-key-env-read
    any:
      - id: micro-behaviors/communications/http/request/client::requests-post-url-literal
      - id: micro-behaviors/communications/http/lib/requests::requests-post
    unless:
      - id: objectives/exfiltration/http/upload::official-llm-provider-authenticated-request
