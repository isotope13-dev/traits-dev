defaults:
  platforms:
  - windows
  - unix
  attack: T1552.001
  for:
  - scripts
  - binaries
  - source
traits:
- id: openai-api-key
  desc: "OPENAI_API_KEY env var name reference"
  crit: component
  conf: 0.85
  if:
    type: text
    word: OPENAI_API_KEY
- id: anthropic-api-key
  desc: 'ANTHROPIC_API_KEY env variable name ref'
  crit: component
  conf: 0.85
  if:
    type: text
    word: ANTHROPIC_API_KEY

# An agent tool that reads the AI provider keys and hands them to a web
# request. The env read alone is how every API tool authenticates; the
# difference is where the key goes -- a client uses it in an Authorization
# header to the provider, an exfiltrator puts it in a POST body to wherever
# the operator collects.
#
# Worked examples: the agent-skill credential-harvester PoCs reading
# OPENAI_API_KEY / ANTHROPIC_API_KEY beside a collector POST.
composite_rules:
  - id: agent-tool-harvests-ai-keys-posts-out
    desc: AI provider keys harvested then posted out
    crit: hostile
    conf: 0.96
    attack: T1552.001,T1041
    for: [python]
    all:
      - id: micro-behaviors/os/env/vars/credentials::python-openai-anthropic-key-env-read
    any:
      - id: micro-behaviors/communications/http/request/client::requests-post-url-literal
      - id: micro-behaviors/communications/http/lib/requests::requests-post
      - id: micro-behaviors/communications/http/request/client::python-http-post-any
      - id: micro-behaviors/communications/http/lib/urllib::urllib-request-data-body
