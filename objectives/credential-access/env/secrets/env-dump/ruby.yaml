defaults:
  for:
    - ruby
  platforms:
    - unix
    - windows
traits:
  # ENV.to_h / HOST reads are routine in Ruby apps and the MRI stdlib.
  # Keep them as review signals only when they are not clearly interpreter
  # or known-runtime context; otherwise they belong with neutral env access.
  - id: env-to-hash
    desc: ENV to hash conversion
    crit: suspicious
    conf: 0.85
    attack: T1552.001
    if:
      type: string_literal
      regex: ENV\.to_hash|ENV\.to_h
    unless:
      - id: well-known/lib/runtime/scripted/cruby::source-tree
      - id: well-known/lib/runtime/scripted/cruby::rubygems-stdlib-path
      - id: well-known/lib/runtime/scripted/jruby::runtime-context
      - id: well-known/lib/runtime/scripted/jruby::module-marker
      - id: metadata/path::test-directory-component
      - id: metadata/path::test-spec-source-file-component
      - id: metadata/package/testing/presence/harness::ruby-test-file
  - id: env-bracket-access
    desc: ENV bracket access
    crit: notable
    conf: 0.65
    attack: T1018
    if:
      type: string_literal
      regex: ENV\[.{0,50}URL_HOST|ENV\[.{0,50}HOST
    unless:
      - id: well-known/lib/cloud/aws-sdk-ruby
      - type: text
        substr: VAGRANT_APPIMAGE_HOST_LD_LIBRARY_PATH
      - id: well-known/lib/runtime/scripted/cruby::source-tree
      - id: well-known/lib/runtime/scripted/jruby::runtime-context
      - id: well-known/lib/runtime/scripted/jruby::module-marker
      - id: metadata/path::test-directory-component
      - id: metadata/package/testing/presence/path::test-fixture-directory-path
      - id: metadata/package/testing/presence/harness::ruby-test-file
      - type: path
        regex: '[\\/]testdata[\\/]'
  - id: host-env-check
    desc: Host environment validation
    crit: suspicious
    conf: 0.7
    attack: T1016
    if:
      # The `localhost` alternative was dropped: `ENV.fetch('FRONTEND_URL',
      # 'http://localhost:3000')` is the standard Rails idiom for a
      # development default, not a check on what host the code is running
      # on. Chatwoot's enterprise SAML initializer scored suspicious for it.
      # The comparison argument is part of the matched span on purpose:
      # `not:` filters test the matched text only, and a span that stops at
      # `include?` cannot distinguish the localhost-scheme idiom from a real
      # host-environment fingerprint.
      type: string_literal
      regex: ENV.{0,50}include\?\(.{0,40}\)|ENV\[.{0,50}\]\[0\]
    not:
      # Same idiom spelled with a conditional instead of a fetch default:
      # `ENV.fetch('DOMAIN').include?('localhost')` picks http vs https for
      # callback URLs (DFE Digital teacher-vacancy-service), it does not
      # fingerprint the host environment.
      - regex: include\?\(['"](?:localhost|127\.0\.0\.1)
    unless:
      - id: well-known/tool/development/build/homebrew::source-tree
      - id: well-known/lib/runtime/scripted/cruby::source-tree
      - id: well-known/lib/runtime/scripted/jruby::runtime-context
      - id: well-known/lib/runtime/scripted/jruby::module-marker
      - id: metadata/path::test-directory-component
      - id: metadata/path::test-spec-source-file-component
      - id: metadata/package/testing/presence/harness::ruby-test-file
composite_rules:
  # Serializing the process environment is neutral on its own. Pairing the
  # complete snapshot with an HTTP POST establishes the exfiltration chain.
  - id: env-dump-faraday-post-exfil
    desc: Environment dump posted via Faraday
    crit: hostile
    conf: 0.93
    attack: T1552.001,T1041
    all:
      - id: micro-behaviors/os/env/enumerate::ruby-env-serialization
      - id: micro-behaviors/communications/http/lib/faraday::faraday-post-call
    unless:
      - id: metadata/path::test-directory-component
      - id: well-known/lib/runtime/scripted/cruby::source-tree
      - id: well-known/lib/runtime/scripted/jruby::runtime-context
