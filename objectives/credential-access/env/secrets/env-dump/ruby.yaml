defaults:
  for:
    - ruby
  platforms:
    - unix
    - windows
traits:
  # ENV.to_h / HOST reads are routine in Ruby apps and the MRI stdlib.
  # Keep them as review signals only when they are not clearly interpreter
  # or known-runtime context; otherwise they belong with neutral env access.
  - id: env-to-hash
    desc: ENV to hash conversion
    crit: suspicious
    conf: 0.85
    attack: T1552.001
    if:
      type: string_literal
      regex: ENV\.to_hash|ENV\.to_h
    unless:
      - id: well-known/lib/runtime/cruby::source-tree
      - id: well-known/lib/runtime/cruby::rubygems-stdlib-path
      - id: well-known/lib/runtime/jruby::runtime-context
      - id: well-known/lib/runtime/jruby::module-marker
      - id: metadata/package/testing/presence/harness::test-directory-path
      - id: metadata/package/testing/presence/harness::ruby-spec-file
      - id: metadata/package/testing/presence/harness::ruby-test-file
  - id: env-bracket-access
    desc: ENV bracket access
    crit: suspicious
    conf: 0.65
    attack: T1018
    if:
      type: string_literal
      regex: ENV\[.{0,50}URL_HOST|ENV\[.{0,50}HOST
    unless:
      - id: well-known/lib/cloud/aws-sdk-ruby
      - type: text
        substr: VAGRANT_APPIMAGE_HOST_LD_LIBRARY_PATH
      - id: well-known/lib/runtime/cruby::source-tree
      - id: well-known/lib/runtime/jruby::runtime-context
      - id: well-known/lib/runtime/jruby::module-marker
      - id: metadata/package/testing/presence/harness::test-directory-path
      - id: metadata/package/testing/presence/harness::ruby-test-file
  - id: host-env-check
    desc: Host environment validation
    crit: suspicious
    conf: 0.7
    attack: T1016
    if:
      type: string_literal
      regex: ENV.{0,50}localhost|ENV.{0,50}include\?|ENV\[.{0,50}\]\[0\]
    unless:
      - id: well-known/app/development/homebrew::source-tree
      - id: well-known/lib/runtime/cruby::source-tree
      - id: well-known/lib/runtime/jruby::runtime-context
      - id: well-known/lib/runtime/jruby::module-marker
      - id: metadata/package/testing/presence/harness::test-directory-path
      - id: metadata/package/testing/presence/harness::ruby-spec-file
      - id: metadata/package/testing/presence/harness::ruby-test-file
composite_rules:
  # Serializing the process environment is neutral on its own. Pairing the
  # complete snapshot with an HTTP POST establishes the exfiltration chain.
  - id: env-dump-faraday-post-exfil
    desc: Environment dump posted via Faraday
    crit: hostile
    conf: 0.93
    attack: T1552.001,T1041
    all:
      - id: micro-behaviors/os/env/dump::ruby-env-serialization
      - id: micro-behaviors/communications/http/lib/faraday::faraday-post-call
    unless:
      - id: metadata/package/testing/presence/harness::test-directory-path
      - id: well-known/lib/runtime/cruby::source-tree
      - id: well-known/lib/runtime/jruby::runtime-context
