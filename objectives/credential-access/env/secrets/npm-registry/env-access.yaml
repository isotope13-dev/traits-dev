defaults:
  platforms:
  - windows
  - unix
  attack: T1552.001
  for:
  - javascript
  - typescript
traits:
- id: node-npm-get-registry-url-marker
  desc: Node npm registry URL helper marker
  crit: component
  conf: 0.9
  if:
    type: text
    substr: getRegistryUrl
- id: node-npm-bearer-env-token-marker
  desc: Node npm bearer token header marker
  crit: component
  conf: 0.9
  if:
    type: text
    substr: headers.authorization = `Bearer ${process.env.NPM_TOKEN}`
composite_rules:
# A release helper that writes the official registry's _authToken line and then
# shells out to the npm CLI is provisioning publish credentials, not harvesting
# them: the token flows from the CI environment INTO npm config. Stealers read
# .npmrc and ship the value outbound instead.
- id: npm-publish-auth-bootstrap
  desc: Release script provisions npmjs registry auth then runs the npm CLI
  crit: exception
  conf: 0.9
  all:
  - id: micro-behaviors/os/package-manager/config::npmrc-registry-authtoken-line
  - id: micro-behaviors/os/package-manager/publish::npm-publish-command
# setup-node / CI registry helpers write `_authToken=${NODE_AUTH_TOKEN}` into
# .npmrc and touch process.env.NODE_AUTH_TOKEN so subsequent npm installs
# authenticate. That is inbound credential wiring, not token theft.
- id: npm-registry-authtoken-env-bootstrap
  desc: Provisions npmrc authToken from NODE_AUTH_TOKEN
  crit: exception
  conf: 0.95
  all:
  - id: micro-behaviors/os/package-manager/config::npmrc-authtoken-env-template
  - id: micro-behaviors/os/env/vars/credentials::node-auth-token-env-read
- id: env-npm-token
  desc: NPM_TOKEN environment variable access
  crit: suspicious
  conf: 0.7
  any:
  - id: micro-behaviors/os/env/vars/credentials::npm-token-env-read
  unless:
  - id: npm-publish-auth-bootstrap
  - id: well-known/tool/detection/security-scanner/
  - id: objectives/credential-access/env/secrets/npm-registry/
  - id: well-known/app/ai/coding-agent/qwen-code::qwen-code-benign-npm-updater-context
  - id: well-known/lib/web/nextjs::vercel-builder-benign-npm-auth-context
  - id: well-known/lib/web/nextjs::vercel-builder-benign-npm-auth-archive-context
  - id: well-known/tool/development/changesets-action::official-changesets-action-context
- id: env-npm-auth-token
  desc: NPM_AUTH_TOKEN environment variable access
  crit: suspicious
  conf: 0.7
  any:
  - id: micro-behaviors/os/env/vars/credentials::npm-auth-token-env-read
  unless:
  - id: micro-behaviors/os/package-manager/publish::npm-publish-command
  - id: npm-publish-auth-bootstrap
  - id: well-known/tool/development/yarn::yarn-cli-bundle-marker
  - id: well-known/lib/web/nextjs::vercel-builder-member-context
  - id: well-known/app/ai/coding-agent/qwen-code::qwen-code-benign-npm-updater-context
  - id: well-known/lib/web/nextjs::vercel-builder-benign-npm-auth-context
  - id: well-known/lib/web/nextjs::vercel-builder-benign-npm-auth-archive-context
  - id: well-known/tool/development/changesets-action::official-changesets-action-context
- id: node-npm-registry-client-auth-marker
  desc: Node npm registry client token marker
  crit: baseline
  conf: 0.9
  any:
  - id: micro-behaviors/os/env/vars/access::npmrc-registry-auth-token
  - id: node-npm-get-registry-url-marker
  - id: node-npm-bearer-env-token-marker
- id: node-npm-token
  desc: Accesses NPM authentication tokens
  crit: suspicious
  conf: 0.95
  any:
  - id: env-npm-token
  - id: env-npm-auth-token
  - id: node-auth-token
  unless:
  - id: npm-publish-auth-bootstrap
  - id: npm-registry-authtoken-env-bootstrap
  - id: metadata/package/testing/
  - id: well-known/tool/development/yarn::yarn-cli-bundle-marker
  - id: well-known/lib/web/nextjs::vercel-builder-member-context
  - id: well-known/app/ai/coding-agent/qwen-code::qwen-code-benign-npm-updater-context
  - id: well-known/lib/web/nextjs::vercel-builder-benign-npm-auth-context
  - id: well-known/lib/web/nextjs::vercel-builder-benign-npm-auth-archive-context
  - id: well-known/tool/development/changesets-action::official-changesets-action-context
