defaults:
  platforms:
    - unix
    - windows
  for:
    - javascript
    - typescript
  attack: T1195.002
composite_rules:
  - id: lifecycle-hook-credential-access
    desc: Lifecycle hook accesses npm credentials
    crit: suspicious
    conf: 0.85
    scope: archive
    for: [package.json, javascript, typescript, npm]
    all:
      - id: metadata/package/scripts/lifecycle::postinstall-hook-declaration
    any:
      - id: metadata/lang/source/literal/fragment/env-variable::process-env-npmrc-token
      - id: objectives/credential-access/env/secrets/npm-registry::npm-config-token
      - id: micro-behaviors/fs/read/file/content/configuration::node-npmrc-read-reference
      - id: micro-behaviors/data/string/replace::npm-auth-prefix-replacement
