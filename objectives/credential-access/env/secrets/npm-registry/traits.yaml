defaults:
  platforms: [windows, unix]
  attack: T1552.001
  for:
  - javascript
traits:
- id: npm-config-token-lower
  desc: Reads lowercase npm config token
  crit: notable
  conf: 0.8
  if:
    type: text
    regex: 'process\.env[.\[]["'']?npm_config_.{0,40}token'
    case_insensitive: true
- id: npm-config-token-upper
  desc: Reads uppercase npm config token
  crit: notable
  conf: 0.8
  if:
    type: text
    regex: 'process\.env[.\[]["'']?NPM_CONFIG_.{0,40}(TOKEN|AUTH)'
- id: npmrc-access
  desc: JavaScript directly reads .npmrc file
  crit: suspicious
  conf: 0.95
  if:
    type: text
    regex: '(readFile(Sync)?|createReadStream)\s*\([^)]{0,80}\.npmrc\b'
  unless:
  - id: metadata/lang/scripted::dts-declaration-file
  - id: well-known/app/ai/coding-agent/qwen-code::qwen-code-benign-npm-updater-context
  - id: well-known/lib/web/nextjs::vercel-builder-benign-npm-auth-context
  - id: well-known/lib/web/nextjs::vercel-builder-benign-npm-auth-archive-context
  - id: well-known/tool/development/changesets-action::official-changesets-action-context
  - id: well-known/app/ai/coding-agent/acuvo-code::official-package-context
composite_rules:
- id: npm-config-token
  desc: npm_config token access
  crit: suspicious
  conf: 0.9
  any:
  - id: npm-config-token-lower
  - id: npm-config-token-upper
- id: npm-token
  desc: NPM_TOKEN environment variable access
  crit: suspicious
  conf: 0.95
  any:
  - id: micro-behaviors/os/env/vars/credentials::npm-token-env-read
  unless:
  - id: objectives/credential-access/env/secrets/npm-registry::npm-publish-auth-bootstrap
  - id: micro-behaviors/os/package-manager/config::npm-token-local-release-fallback
  - id: well-known/tool/detection/security-scanner::secret-redactor-context
  - id: well-known/app/ai/coding-agent/qwen-code::qwen-code-benign-npm-updater-context
  - id: well-known/lib/web/nextjs::vercel-builder-benign-npm-auth-context
  - id: well-known/lib/web/nextjs::vercel-builder-benign-npm-auth-archive-context
  - id: well-known/tool/development/changesets-action::official-changesets-action-context
- id: node-auth-token
  desc: NODE_AUTH_TOKEN environment variable access
  crit: suspicious
  conf: 0.95
  any:
  - id: micro-behaviors/os/env/vars/credentials::node-auth-token-env-read
  unless:
  - id: micro-behaviors/os/package-manager/publish::npm-publish-command
  - id: objectives/credential-access/env/secrets/npm-registry::npm-registry-authtoken-env-bootstrap
  - id: metadata/package/testing/
  - id: well-known/app/ai/coding-agent/qwen-code::qwen-code-benign-npm-updater-context
  - id: well-known/lib/web/nextjs::vercel-builder-benign-npm-auth-context
  - id: well-known/lib/web/nextjs::vercel-builder-benign-npm-auth-archive-context
  - id: well-known/tool/development/changesets-action::official-changesets-action-context
