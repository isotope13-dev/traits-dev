defaults:
  conf: 0.95
  platforms:
  - windows
  - unix
  attack: T1552.001
  for:
  - javascript
traits:
- id: npm-config-auth-dot-access
  desc: Reads npm auth variable via dot access
  crit: notable
  if:
    type: text
    regex: process\.env\.NPM_CONFIG_(_AUTH(TOKEN)?|AUTH(_TOKEN)?|[A-Za-z0-9_]*TOKEN)\b
    case_insensitive: true
- id: npm-config-auth-bracket-access
  desc: Reads npm auth variable via bracket access
  crit: notable
  if:
    type: text
    regex: process\.env\[\s*["']NPM_CONFIG_(_AUTH(TOKEN)?|AUTH(_TOKEN)?|[^"']{0,40}TOKEN)["']\s*\]
    case_insensitive: true
- id: npm-auth-undefined-assertion
  desc: Asserts npm auth variable is absent
  crit: notable
  if:
    type: text
    regex: 'assert\.equal\(\s*undefined\s*,\s*process\.env\.npm_config__auth\b'
    case_insensitive: true
composite_rules:
- id: npm-auth-absence-test
  desc: Test asserts npm authentication is absent
  crit: notable
  all:
  - id: npm-auth-undefined-assertion
  - id: metadata/package/testing/presence/fixture::test-filename-pattern
- id: npm-config-token
  desc: npm config authentication variable access
  crit: suspicious
  any:
  - id: npm-config-auth-dot-access
  - id: npm-config-auth-bracket-access
  unless:
  - id: npm-auth-absence-test
  - id: well-known/tool/development/ci/changesets-action::official-changesets-action-context
  - id: micro-behaviors/os/package-manager/publish::npm-publish-command
  - id: micro-behaviors/os/package-manager/publish::js-npm-publish-template-command
  - id: metadata/build/ci/github-actions::action-path
  downgrade:
    any:
    - id: metadata/package/testing/harness/fixture::tap-auth-absence-test
    - id: metadata/package/testing/assertion::tap-auth-absence-test
