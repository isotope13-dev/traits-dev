defaults:
  conf: 0.95
  platforms: [windows, unix]
  attack: T1552.001
  for:
  - javascript
traits:
- id: npm-config-auth-dot-access
  desc: Reads npm auth variable via dot access
  crit: notable
  conf: 0.95
  if:
    type: text
    # Boolean feature flags end in _auth (npm_config_tailscale_auth); only the
    # bare auth forms and token-bearing names carry authentication material.
    regex: 'process\.env\.NPM_CONFIG_(_AUTH(TOKEN)?|AUTH(_TOKEN)?|[A-Za-z0-9_]*TOKEN)\b'
    case_insensitive: true
- id: npm-config-auth-bracket-access
  desc: Reads npm auth variable via bracket access
  crit: notable
  conf: 0.95
  if:
    type: text
    regex: 'process\.env\[\s*["'']NPM_CONFIG_(_AUTH(TOKEN)?|AUTH(_TOKEN)?|[^"'']{0,40}TOKEN)["'']\s*\]'
    case_insensitive: true
composite_rules:
- id: npm-config-token
  desc: npm config authentication variable access
  crit: suspicious
  conf: 0.95
  any:
  - id: npm-config-auth-dot-access
  - id: npm-config-auth-bracket-access
  unless:
  - id: "metadata/file/naming::test-directory-component"
  - id: well-known/tool/development/ci/changesets-action::official-changesets-action-context
  - id: micro-behaviors/os/package-manager/publish::npm-publish-command
  - id: micro-behaviors/os/package-manager/publish::js-npm-publish-template-command
  - id: metadata/build/ci/github-actions::action-path
