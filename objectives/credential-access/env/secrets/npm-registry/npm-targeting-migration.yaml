defaults:
  platforms: [unix, windows]
  for: [javascript, package.json]

composite_rules:
- id: obfuscated-postinstall-token-loader
  for:
  - javascript
  desc: Obfuscated hidden NODE_AUTH_TOKEN process launcher
  crit: hostile
  conf: 0.99
  attack: T1195.002
  mbc: B0024
  near_bytes: 65536
  all:
  - id: metadata/lang/source/syntax/control-flow::parseint-decoder-loop
  - id: micro-behaviors/os/env/package-manager::node-auth-token-env-read
  any:
  - id: objectives/anti-static/obfuscation/payload/fragmentation::js-large-array-eval-loop
  - id: micro-behaviors/process/argument/visibility::windowshide-obfuscated-expression
  - id: micro-behaviors/process/argument/visibility::windowshide-obfuscated-true
  needs: 2
