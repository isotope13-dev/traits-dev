# Bulk wallet-secret selection can also be an authorized audit.
# A structural pipeline binds the selected pattern to the environment filter;
# same-line text co-occurrence would accept an unrelated echo after a semicolon.
defaults:
  platforms: [unix]
  for: [shell]
  attack: T1552.001
traits:
  - id: shell-wallet-secret-env-filter
    desc: Filters environment for wallet secrets
    crit: suspicious
    conf: 0.94
    if:
      type: tree-sitter
      query: |
        (pipeline
          (command name: (command_name) @source)
          . (command name: (command_name) @filter
              argument: [(raw_string) (string)] @pattern) @filter_cmd
          (#match? @source "^(env|printenv|set)$")
          (#match? @filter "^(grep|egrep)$")
          (#match? @pattern "(?i)\\b(WALLET|MNEMONIC|SEED|PRIV)\\b.{0,40}\\b(WALLET|MNEMONIC|SEED|PRIV)\\b")
          (#match? @pattern "(?i)\\b(MNEMONIC|SEED|PRIV)\\b")
          (#not-match? @filter_cmd "\\s(-[A-Za-z]*v[A-Za-z]*|--invert-match)\\b")
        ) @match
