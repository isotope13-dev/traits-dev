defaults:
  platforms: [unix, windows]
  for: [rust]
  crit: suspicious
  conf: 0.95
  attack: T1552.001

traits:
  # Qualified Rust calls currently have arguments but no call target in facts.
  - id: rust-wallet-private-key-env-read
    desc: Reads wallet private key from environment
    if:
      type: text
      regex: 'env::var\s*\(\s*"(POLYMARKET|ETH|BTC|SOLANA)_PRIVATE_KEY"'
