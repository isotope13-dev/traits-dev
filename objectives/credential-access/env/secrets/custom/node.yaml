defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
  attack: T1552.001
traits:
  - id: env-my-secret-api-key
    desc: MY_SECRET_API_KEY env access
    crit: suspicious
    conf: 0.95
    if:
      type: text
      regex: process\.env\.MY_SECRET_API_KEY
  - id: n8n-encryption-key-reference
    desc: n8n encryption key environment reference
    crit: suspicious
    conf: 0.95
    if:
      type: text
      regex: '(^|[^A-Z0-9_])N8N_ENCRYPTION_KEY([^A-Z0-9_]|$)'

composite_rules:
  - id: node-obfuscated-environment-command-capture
    desc: Captures the complete environment through an obfuscated Node command
    crit: hostile
    conf: 0.99
    attack: "T1552.001,T1059.007"
    mbc: E1552
    near_bytes: 1800
    all:
      - id: micro-behaviors/process/create/exec::node-obfuscated-environment-command
      - id: micro-behaviors/process/create/exec::node-execfile-captures-stdout
  - id: n8n-node-encryption-key-shell-exposure
    desc: n8n node exposes its encryption key through shell execution
    crit: hostile
    conf: 0.995
    attack: "T1552.001,T1059.007"
    mbc: "E1552"
    scope: archive
    all:
      - id: metadata/package/manifest/freeform::npm-n8n-node-manifest
      - id: n8n-encryption-key-reference
      - id: micro-behaviors/os/env/access::node-process-env-object-field
      - id: micro-behaviors/process/create/shell/bridge::js-execsync
