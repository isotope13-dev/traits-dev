defaults:
  platforms:
  - unix
  - windows
  crit: notable
  attack: T1552.001
composite_rules:
# Two registry or source-control token reads in one file are abuse evidence
# with plausible benign use: CI publish and release tooling reads the same
# variables. Hostile needs the exfiltration leg that github-release-exfil
# supplies. Test sources quoting these reads (fixtures, detection literals)
# are demoted one step.
- id: package-token-harvest
  desc: Reads package registry and VCS tokens from env
  crit: suspicious
  conf: 0.95
  needs: 2
  any:
  - id: micro-behaviors/os/env/secret/registry::python-package-tokens
  - id: micro-behaviors/os/env/secret/registry::javascript-package-tokens
  downgrade:
    any:
    - id: metadata/package/testing/presence/fixture::test-filename-pattern
    - id: metadata/path/directory::jest-tests-directory-component
