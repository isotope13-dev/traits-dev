# Cross-language variants of the developer-secret catalog technique.
#
# The article's payload did not depend on one token provider: it read unrelated
# cloud, source-control/registry, infrastructure, and SaaS credentials from a
# process environment, then paired that catalog with filesystem collection.
# These atoms intentionally describe provider classes rather than a campaign
# name, so a Python, PowerShell, or shell rewrite remains visible.
defaults:
  platforms: [unix, windows]
  for: [python, powershell, shell]
  attack: T1552.001
  mbc: B0028

composite_rules:
  - id: script-cross-vendor-secret-catalog-harvest
    desc: Environment access with cross-vendor secret names
    crit: suspicious
    conf: 0.95
    near_bytes: 4096
    all:
      - id: micro-behaviors/os/env/read/
    any:
      - id: micro-behaviors/data/serialize/schema-credential::script-aws-credential-parameter-name
      - id: micro-behaviors/os/env/secret-name::script-azure-credential-env-name
      - id: micro-behaviors/os/env/secret-name::script-gcp-credential-env-name
      - id: micro-behaviors/os/env/secret-name::vcs-registry-token-name
      - id: micro-behaviors/os/env/secret-name::vault-terraform-token-name
      - id: micro-behaviors/os/env/secret-name::script-stripe-secret-env-name
      - id: micro-behaviors/os/env/secret-name::slack-token-environment-name-reference
      - id: micro-behaviors/os/env/secret-name::other-saas-secret-env-name
    needs: 4
    unless:
      - id: metadata/package/testing/
      - id: well-known/lib/ai/unsloth::unsloth-package-context
      - id: well-known/tool/detection/
      - id: well-known/app/infrastructure/skypilot::skypilot-source-file
      - id: well-known/app/ai/
      - id: well-known/tool/offensive/reconprobe/
      - id: micro-behaviors/data/string/redact/
      - id: "metadata/file/naming::test-directory-component"
      - id: well-known/app/infrastructure/wads::wads-ci-context
  - id: script-cross-vendor-filesystem-secret-sweep
    desc: Script sweeps filesystem after secret cataloging
    crit: hostile
    conf: 0.98
    near_bytes: 8192
    all:
      - id: script-cross-vendor-secret-catalog-harvest
      - id: micro-behaviors/fs/directory/traverse::directory-enumeration-or-traversal
    unless:
      - id: well-known/lib/ai/unsloth::unsloth-package-context
      - id: well-known/tool/detection/security-scanner/
      - id: micro-behaviors/data/string/redact/

  - id: script-cross-vendor-secret-exfiltration
    desc: Script exfiltrates cross-vendor secret sweep
    crit: hostile
    conf: 0.98
    near_bytes: 16384
    all:
      - id: script-cross-vendor-filesystem-secret-sweep
    any:
      - id: micro-behaviors/communications/http/post
    unless:
      - id: well-known/tool/detection/security-scanner/
      - id: micro-behaviors/data/string/redact/
