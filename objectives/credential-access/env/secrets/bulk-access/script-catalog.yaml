# Cross-language variants of the developer-secret catalog technique.
#
# The article's payload did not depend on one token provider: it read unrelated
# cloud, source-control/registry, infrastructure, and SaaS credentials from a
# process environment, then paired that catalog with filesystem collection.
# These atoms intentionally describe provider classes rather than a campaign
# name, so a Python, PowerShell, or shell rewrite remains visible.
defaults:
  platforms: [unix, windows]
  for: [python, powershell, shell]
  attack: T1552.001
  mbc: B0028

traits:
  # aws-credential-env-name moved to micro-behaviors/os/env/cloud as
  # script-aws-credential-env-name: the name alone is SDK configuration.

  - id: azure-credential-env-name
    desc: Azure credential environment name
    # A provider env-var name is a configuration reference, not acquisition
    # (same judgment that moved the AWS name to micro-behaviors/os/env/cloud);
    # catalog vocabulary for the composite below.
    crit: component
    conf: 0.9
    if:
      type: text
      regex: '(?i)\bAZURE_(CLIENT_ID|CLIENT_SECRET|TENANT_ID)\b'

  - id: gcp-credential-env-name
    desc: GCP credential environment name
    # A provider env-var name is a configuration reference, not acquisition
    # (cloud client libraries document it; pyarrow's GCS module mentions it in
    # a docstring); catalog vocabulary for the composite below.
    crit: component
    conf: 0.9
    if:
      type: text
      regex: '(?i)\bGOOGLE_APPLICATION_CREDENTIALS\b'

  - id: vcs-registry-secret-env-name
    desc: VCS and registry secret names
    crit: component
    conf: 0.9
    if:
      type: text
      regex: '(?i)\b(GITHUB_TOKEN|GH_TOKEN|NPM_TOKEN|NODE_AUTH_TOKEN|GITLAB_TOKEN)\b'

  - id: script-stripe-secret-env-name
    unless:
      - id: metadata/package/testing/corpus::inert-security-input-module
    desc: Stripe secret environment name
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)\bSTRIPE_(SECRET_KEY|API_KEY)\b'

  - id: other-saas-secret-env-name
    desc: Other SaaS secret environment name
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)\b(DISCORD_TOKEN|DIGITALOCEAN_ACCESS_TOKEN)\b'

composite_rules:
  - id: script-cross-vendor-secret-catalog-harvest
    desc: Environment access with cross-vendor secret names
    crit: suspicious
    conf: 0.95
    near_bytes: 4096
    all:
      - id: micro-behaviors/os/env/read/
    any:
      - id: micro-behaviors/os/env/cloud::script-aws-credential-env-name
      - id: azure-credential-env-name
      - id: gcp-credential-env-name
      - id: vcs-registry-secret-env-name
      - id: micro-behaviors/os/env/secret-name::vault-terraform-token-name
      - id: script-stripe-secret-env-name
      - id: micro-behaviors/os/env/secret-name::slack-token-environment-name-reference
      - id: other-saas-secret-env-name
    needs: 4
    unless:
      - id: metadata/package/testing/
      - id: well-known/lib/ai/unsloth::unsloth-package-context
      - id: well-known/tool/detection/cordon-scanner::cordon-defensive-scanner-context
      - id: well-known/tool/detection/
      - id: well-known/app/infrastructure/skypilot::skypilot-source-file
      - id: well-known/app/ai/coding-agent/
      - id: well-known/tool/offensive/reconprobe/

      - id: "metadata/file/naming::test-directory-component"
  - id: script-cross-vendor-filesystem-secret-sweep
    desc: Script sweeps filesystem after secret cataloging
    crit: hostile
    conf: 0.98
    near_bytes: 8192
    all:
      - id: script-cross-vendor-secret-catalog-harvest
      - id: micro-behaviors/fs/directory/traverse::directory-enumeration-or-traversal
    unless:
      - id: well-known/lib/ai/unsloth::unsloth-package-context
      - id: well-known/tool/detection/security-scanner/
      - id: micro-behaviors/data/string/redact/

  - id: script-cross-vendor-secret-exfiltration
    desc: Script exfiltrates cross-vendor secret sweep
    crit: hostile
    conf: 0.98
    near_bytes: 16384
    all:
      - id: script-cross-vendor-filesystem-secret-sweep
    any:
      - id: micro-behaviors/communications/http/post
    unless:
      - id: well-known/tool/detection/security-scanner/
      - id: micro-behaviors/data/string/redact/
