defaults:
  platforms: [unix]
  for: [c, cpp, objc, elf]
  attack: T1552.001

composite_rules:
  - id: native-env-secret-harvest
    desc: Native environment secret harvest
    crit: hostile
    conf: 0.97
    all:
      - id: micro-behaviors/os/env/access::native-environ-reference
      - id: micro-behaviors/os/env/vars/credentials::native-credential-like-identifiers
    unless:
      - id: well-known/tool/sysadmin/alpine-packages/
      - id: well-known/app/development/gitea::gitea-server-binary
      - id: well-known/app/development/kilocode::kilo-cli-binary-name
      - id: well-known/app/data/vector/
      - id: well-known/app/ai/assistant/jan/
      - id: well-known/app/infrastructure/flyio/
      - id: well-known/lib/native/systemd::systemd-native-library-context
