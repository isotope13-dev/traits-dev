# Co-occurrence only: no import-to-harvest or credential-to-send binding.
defaults:
  platforms:
  - unix
  - windows
  for:
  - python
composite_rules:
- id: secret-catalog-process-http-body-cooccurrence
  desc: Secret catalog, process and HTTP body coexist
  crit: suspicious
  conf: 0.96
  attack: T1552.001
  near_bytes: 6000
  all:
  - id: micro-behaviors/data/control-flow/module-exec::module-level-side-effect-call
  - id: micro-behaviors/process/create/subprocess::popen-ast
  - id: objectives/credential-access/env/secrets/bulk-access::script-cross-vendor-secret-catalog-harvest
  - id: micro-behaviors/communications/http/request/json::python-json-near-urllib-request
