defaults:
  platforms:
  - windows
  - unix
  for:
  - javascript
  - typescript
  attack: T1552.001
  mbc: B0028
composite_rules:
- id: node-multi-cred
  desc: Accesses multiple credential sources (credential
  crit: hostile
  conf: 0.95
  needs: 3
  any:
  - id: objectives/credential-access/env/secrets/cloud-access::node-aws
  - id: objectives/credential-access/env/secrets/source-control::node-git-token
  - id: objectives/credential-access/env/secrets/npm-registry::node-npm-token
  - id: objectives/credential-access/env/secrets/messaging::node-discord
  - id: micro-behaviors/os/env/config::database-connection-env-config
  - id: objectives/credential-access/env/secrets/wallet
  unless:
  - id: well-known/tool/detection/security-scanner/

# The Python spelling of the bulk harvest: walk the whole environment and
# keep only the entries whose names look like credentials. Iterating env vars
# is configuration loading; iterating them with a secret-keyword filter is
# credential collection, whatever happens to the values afterward.
#
# Worked example: b10connoisseur's env sweep, which filters os.environ
# against API_KEY|PRIVATE|CERT|DATABASE|DB_|REDIS|MONGO|MYSQL|POSTGRES|...
# beside its cloud-metadata walk.
#
# The filter leg must be loop-adjacent (near_lines: 3 inside the referenced
# composite), not merely present in the same file. A bare os.getenv call or a
# far-away credential word is not a filter: distutils _msvccompiler.py copies
# the whole environment when DISTUTILS_USE_SDK is set beside an unrelated
# os.getenv("DISTUTILS_USE_SDK"), and networkx backends.py selects its own
# NETWORKX_BACKEND_PRIORITY_ namespace the same way.
- id: python-env-bulk-secret-harvest
  desc: Bulk environment scan filtered for credential keywords
  crit: hostile
  conf: 0.95
  for: [python]
  all:
  - id: micro-behaviors/os/env/vars/access::python-environ-items-loop
  - id: micro-behaviors/os/env/vars/credentials::python-environ-items-credential-filter
  unless:
  - id: well-known/tool/detection/security-scanner/
  - id: well-known/tool/detection/llm-scanner/
  - id: well-known/app/ai/gateway/litellm::litellm-aws-kms-env-provider
