defaults:
  crit: hostile
  conf: 0.95
  platforms:
  - windows
  - unix
  for:
  - javascript
  - typescript
  attack: T1552.001
  mbc: B0028
composite_rules:
# The Python spelling of a bulk harvest: walk the whole environment, select
# entries whose names look like credentials, and copy them into a mapping.
# The copy requirement distinguishes collection from redaction routines that
# enumerate configured secrets only to replace their values in error text.
#
# Worked example: b10connoisseur's env sweep, which filters os.environ
# against API_KEY|PRIVATE|CERT|DATABASE|DB_|REDIS|MONGO|MYSQL|POSTGRES|...
# beside its cloud-metadata walk.
#
# The filter leg must be loop-adjacent (near_lines: 3 inside the referenced
# composite), not merely present in the same file. A bare os.getenv call or a
# far-away credential word is not a filter: distutils _msvccompiler.py copies
# the whole environment when DISTUTILS_USE_SDK is set beside an unrelated
# os.getenv("DISTUTILS_USE_SDK"), and networkx backends.py selects its own
# NETWORKX_BACKEND_PRIORITY_ namespace the same way.
- id: python-env-bulk-secret-harvest
  desc: Collects credential-named environment entries
  crit: hostile
  conf: 0.95
  for: [python]
  near_lines: 8
  all:
  - id: micro-behaviors/os/env/secret-name::python-environ-credential-selection
  - id: "metadata/lang/source/syntax/assignment::python-env-credential-named-mapping-assignment"
  unless:
  - id: metadata/package/testing/presence/harness::verified-python-test-file
  - id: well-known/tool/detection/security-scanner/
  - id: well-known/tool/detection/llm-scanner/
  - id: well-known/app/ai/gateway/litellm::litellm-aws-kms-env-provider
  - id: micro-behaviors/os/env/enumeration::python-environ-items-namespace-prefix-filter
  - id: micro-behaviors/data/manipulation::sensitive-value-masking
  - id: micro-behaviors/data/manipulation::sensitive-value-redaction
