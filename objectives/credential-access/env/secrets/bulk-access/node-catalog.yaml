# Broad cross-vendor developer-secret catalog harvesting (Node/JS).
#
# Install-time infostealers dropped into npm packages — Shai-Hulud "Here We Go
# Again" / ChainDrop and successors — collect a wide catalog of *unrelated*
# high-value secrets in one pass: cloud IAM, secrets managers, payment
# processors, chat platforms, orchestration and package registries. They
# typically iterate an array of env-var names with `process.env[k]` rather than
# reading each `process.env.NAME` directly, which evades the per-vendor
# direct-access atoms elsewhere in this tree. These name/prefix atoms fire on
# the catalog-array form and add the payment (Stripe), chat (Slack) and
# secrets-manager (Vault) categories that the existing Node breadth composite
# (`bulk-access::node-multi-cred`) does not cover. Each atom is individually
# benign; only the breadth composite — env-reading code that touches several
# unrelated credential categories at once — is suspicious.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  attack: T1552.001
  mbc: B0028
  size_min: 64

traits:
  # Matched as string literals (not raw text runs): install-time stealers list
  # the names in an array, so they land in the literal pool, and literal-scanned
  # atoms are not displaced by higher-severity text-run matches elsewhere in the
  # file (e.g. an embedded `trufflehog filesystem` command line).
  - id: vault-secret-env-name
    desc: Vault token env name or hvs prefix
    crit: component
    conf: 0.9
    if:
      type: string_literal
      regex: '^VAULT_TOKEN$|hvs\.[A-Za-z0-9]{20,}'

  - id: stripe-secret-env-name
    desc: Stripe key env name or sk_live prefix
    crit: component
    conf: 0.9
    if:
      type: string_literal
      regex: '^STRIPE_(SECRET_KEY|API_KEY)$|sk_live_[0-9A-Za-z]{16,}'

  - id: slack-secret-env-name
    desc: Slack token env name or xox prefix
    crit: component
    conf: 0.9
    if:
      type: string_literal
      regex: '^SLACK_(BOT_TOKEN|TOKEN|API_KEY)$|xox[baprs]-[0-9A-Za-z]{8,}'

composite_rules:
  # Env-reading code that references several unrelated high-value credential
  # categories (cloud + secrets-manager + payment + chat + orchestration +
  # registry/VCS) is the credential-catalog shape of a supply-chain
  # infostealer. A normal service reads one or two related secrets; four
  # unrelated vendor categories in one env-reading file is the harvest.
  - id: node-cross-vendor-secret-catalog-harvest
    desc: Node reads broad cross-vendor secret catalog
    crit: suspicious
    conf: 0.95
    near_bytes: 4096
    all:
      - id: micro-behaviors/os/env/access::javascript
    any:
      - id: objectives/credential-access/env/secrets/cloud-access::node-aws
      - id: micro-behaviors/os/container/namespace::kubeconfig-env-str
      - id: objectives/credential-access/env/secrets/npm-registry::node-npm-token
      - id: objectives/credential-access/env/secrets/source-control::node-git-token
      - id: vault-secret-env-name
      - id: stripe-secret-env-name
      - id: slack-secret-env-name
    needs: 4
    # Deliberately NOT excepting `well-known/tool/detection/sast/`: that context
    # fires on a bare `trufflehog` word, which is precisely the weaponized
    # filesystem-secret sweep this stealer performs — excepting it would blind
    # the composite to the ChainDrop technique. Genuine vulnerability scanners
    # and redaction libraries carry stronger tool signatures and are excepted.
    unless:
      - id: well-known/tool/detection/security-scanner/
      - id: well-known/tool/detection/redaction/
