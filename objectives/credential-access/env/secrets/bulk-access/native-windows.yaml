defaults:
  platforms: [windows]
  for: [c, cpp, pe, dll]
  attack: T1552.001

# The cloud-secret environment-name atoms moved to
# micro-behaviors/os/env/cloud (native-windows.yaml): a name alone is an SDK
# capability, not bulk secret access.

composite_rules:
  - id: windows-cloud-env-secret-cluster
    desc: Windows cloud secret env name cluster
    crit: notable
    conf: 0.94
    any:
      - id: micro-behaviors/os/env/cloud::native-aws-access-key-id-name
      - id: micro-behaviors/os/env/cloud::native-aws-secret-access-key-name
      - id: micro-behaviors/os/env/cloud::native-aws-session-token-name
      - id: micro-behaviors/os/env/cloud::native-azure-client-secret-name
      - id: micro-behaviors/os/env/cloud::native-gcp-credentials-name
      - id: micro-behaviors/os/env/cloud::native-service-account-key-name
    needs: 4
    unless:
      - id: well-known/lib/data/oracle-managed-data-access::oracle-managed-data-access-library

  # An imported environment API and cloud-secret names can both come from a
  # runtime or SDK.  They do not establish a harvest unless the observations
  # are local enough to plausibly describe one implementation path.
  - id: native-windows-cloud-env-secret-access-indicator
    desc: Native Windows cloud-secret env access indicator
    crit: suspicious
    conf: 0.92
    near_bytes: 16384
    all:
      - id: micro-behaviors/os/env/read::get-environment-variable
      - id: windows-cloud-env-secret-cluster
    unless:
      - id: well-known/tool/reverse-engineering/dotnet-debugger::remote-coreclr-debugger-runtime
