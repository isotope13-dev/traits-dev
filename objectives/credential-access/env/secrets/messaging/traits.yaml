defaults:
  platforms:
  - windows
  - unix
  attack: T1552.001
  for:
  - javascript
  - typescript
  - python
  - shell
traits:
- id: env-discord-token
  desc: Reads DISCORD_TOKEN from process.env
  crit: notable
  conf: 0.95
  for: [javascript, typescript]
  if:
    type: symbol
    kind: member
    exact: process.env.DISCORD_TOKEN
  unless:
  - id: well-known/tool/detection/security-scanner/
- id: env-discord-bot-token
  desc: Reads DISCORD_BOT_TOKEN from process.env
  crit: notable
  conf: 0.95
  for: [javascript, typescript]
  if:
    type: symbol
    kind: member
    exact: process.env.DISCORD_BOT_TOKEN
- id: env-discord-client-secret
  desc: Reads DISCORD_CLIENT_SECRET from process.env
  crit: notable
  conf: 0.95
  for: [javascript, typescript]
  if:
    type: symbol
    kind: member
    exact: process.env.DISCORD_CLIENT_SECRET
- id: env-slack-bot-token
  desc: Reads SLACK_BOT_TOKEN from process.env
  crit: notable
  conf: 0.95
  for: [javascript, typescript]
  if:
    type: symbol
    kind: member
    exact: process.env.SLACK_BOT_TOKEN
  unless:
  - id: well-known/tool/detection/security-scanner/
- id: env-slack-api-key
  desc: Reads SLACK_API_KEY from process.env
  crit: notable
  conf: 0.95
  for: [javascript, typescript]
  if:
    type: symbol
    kind: member
    exact: process.env.SLACK_API_KEY
  unless:
  - id: well-known/tool/detection/security-scanner/
- id: env-slack-webhook
  desc: Reads SLACK_WEBHOOK from process.env
  crit: notable
  conf: 0.95
  for: [javascript, typescript]
  if:
    type: symbol
    kind: member
    exact: process.env.SLACK_WEBHOOK
  unless:
  - id: well-known/tool/detection/security-scanner/
- id: python-discord-token-getenv
  desc: Python reads DISCORD_TOKEN via getenv
  crit: notable
  conf: 0.95
  for: [python]
  if:
    type: symbol
    kind: call
    regex: '^(os\.)?(getenv|environ\.get)$'
    arg:
      kind: string
      exact: DISCORD_TOKEN
  unless:
  - id: objectives/credential-access/api-harvest/catalog::redaction-credentials-marker
  - id: well-known/tool/detection/security-scanner/
  - id: well-known/tool/detection/redaction::sensitive-data-scanner
composite_rules:
- id: discord-token
  desc: Accesses DISCORD_TOKEN environment variable
  crit: notable
  conf: 0.95
  any:
  - id: env-discord-token
  - id: python-discord-token-getenv
- id: node-discord
  desc: Reads Discord credential environment variables
  crit: notable
  conf: 0.95
  any:
  - id: env-discord-token
  - id: env-discord-bot-token
  - id: env-discord-client-secret
