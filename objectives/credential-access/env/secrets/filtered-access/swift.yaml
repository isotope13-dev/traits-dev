defaults:
  platforms: [unix]
  for: [swift]
  attack: T1041

traits:
  - id: swift-filtered-env-secrets
    desc: Swift filters env names for secret markers
    crit: suspicious
    conf: 0.92
    if:
      type: text
      regex: 'key\.contains\("(TOKEN|KEY)"\)[\s\S]{0,220}key\.contains\("SECRET"\)'
