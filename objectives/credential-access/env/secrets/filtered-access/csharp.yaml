# C#/.NET VM-gated env credential harvest. The env-secret filter atom lives
# at micro-behaviors/os/env/enumeration::dotnet-env-secret-filter; this
# composite ties the harvest to the analysis-host gate, which is what makes
# the combination hostile rather than ordinary configuration handling.
defaults:
  platforms: [unix, windows]
  for: [csharp]
  attack: T1552.001
composite_rules:
  - id: csharp-vm-gated-env-credential-harvest
    desc: VM-gated C# env credential harvest
    crit: hostile
    conf: 0.94
    size_max: 262144
    all:
      - id: micro-behaviors/os/env/enumeration::dotnet-env-secret-filter
      - id: objectives/anti-analysis/environment-detect/check::csharp-vm-hostname-environment-gate
    downgrade:
      any:
        - id: metadata/package/testing/
        - id: metadata/signed/platform/
