# JVM environment credential harvesting (System.getenv filtered by keywords) —
# covers Java and Groovy (Gradle build scripts execute at build time).
defaults:
  platforms: [unix, windows]
  for: [java, groovy]
  attack: T1552.001
traits:
  - id: java-env-credential-harvest
    desc: System.getenv filtered by credential keys
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: 'System\.getenv\(\)[\s\S]{0,160}["''](SECRET|TOKEN|KEY)'
composite_rules:
  - id: groovy-filtered-env-credential-http-exfil
    desc: Groovy filters credential env vars and posts over HTTP
    crit: hostile
    conf: 0.97
    for: [groovy]
    scope: file
    near_bytes: 1024
    all:
      - id: java-env-credential-harvest
      - id: micro-behaviors/communications/http/lib/urlconnection::groovy-urlconnection-post-body
  - id: java-filtered-env-credential-collection
    for: [java]
    desc: Java copies credential-named environment values
    crit: suspicious
    conf: 0.96
    size_max: 262144
    near_bytes: 512
    all:
      - id: java-env-credential-harvest
      - id: micro-behaviors/os/env/read::java-environment-entry-map-copy
    downgrade:
      any:
        - id: metadata/package/testing/
        - id: metadata/signed/platform/
