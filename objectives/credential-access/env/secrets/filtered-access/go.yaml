# Go environment credential harvesting (obfuscated-stealer class).
defaults:
  platforms: [unix, windows]
  for: [go]
  attack: T1552.001
traits:
  - id: go-env-credential-harvest
    desc: os.Environ filtered by credential keywords
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: 'os\.Environ\(\)[\s\S]{0,160}["''](SECRET|TOKEN|KEY)'
    unless:
      - id: micro-behaviors/os/env/config::go-env-credential-name-skip
      - id: micro-behaviors/os/env/config::go-env-credential-word-prefix-skip
composite_rules:
  # Named for what it searches: the harvest plus concealment (static string
  # evasion) or host/user awareness. The previous "obfuscated" name was wrong
  # whenever only the identity-query leg fired -- reading the hostname and
  # username to gate on analysis names is environment awareness, not
  # obfuscation. Same rename as the PHP sibling.
  - id: go-evasive-env-credential-harvest
    desc: Go env credential harvest with decoding or host awareness
    crit: hostile
    conf: 0.94
    size_max: 262144
    all:
      - id: go-env-credential-harvest
    any:
      - id: objectives/anti-static/obfuscation/string/recovery::go-static-string-evasion
      - id: micro-behaviors/os/sysinfo/hostname::host-and-user-identity-query
    needs: 1
    downgrade:
      any:
        - id: metadata/package/testing/
        - id: metadata/signed/platform/
