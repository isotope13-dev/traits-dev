defaults:
  platforms:
  - unix
  - windows
  for:
  - go
  attack: T1552.001
traits:
- id: go-env-credential-harvest
  desc: os.Environ filtered by credential keywords
  crit: notable
  conf: 0.9
  if:
    type: text
    regex: os\.Environ\(\)[\s\S]{0,160}["'](SECRET|TOKEN|KEY)
    exclude_comments: true
  unless:
  - id: well-known/tool/offensive/raxuiscli::source-tree-path
  - id: micro-behaviors/os/env/config/application::go-environment-config-context
composite_rules:
- id: go-evasive-env-credential-harvest
  desc: Go env credential harvest with decoding or host awareness
  crit: hostile
  conf: 0.94
  size_max: 262144
  all:
  - id: go-env-credential-harvest
  any:
  - id: objectives/anti-static/obfuscation/string/recovery::go-static-string-evasion
  - id: micro-behaviors/os/sysinfo/hostname/query::host-and-user-identity-query
  needs: 1
  downgrade:
    any:
    - id: metadata/path/directory::test-directory-component
