defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
  attack: T1552.001
traits:
  - id: env-filter-method
    desc: process.env adjacent to filter or match
    crit: component
    conf: 0.82
    if:
      type: text
      regex: 'process\.env.{0,40}(filter|match)|(filter|match).{0,40}process\.env'
  - id: js-execsync-secret-env-grep
    desc: Shell filters environment for secret names
    crit: suspicious
    conf: 0.95
    if:
      type: symbol
      kind: call
      exact: execSync
      arg:
        kind: string
        regex: '\benv\s*\|\s*grep\b[\s\S]{0,120}\b(AWS|GCP|GOOGLE|AZURE|TOKEN|SECRET|KEY|PASS|CRED|ENCRYPTION)\b'
  - id: env-secret-filter-keyword-list
    desc: process.env filter regex over credential names
    crit: notable
    conf: 0.88
    if:
      type: text
      regex: 'Object\.keys\(process\.env\)[\s\S]{0,120}/KEY\|SECRET'
  - id: env-filter-pass-secret-regex
    desc: Environment enumeration with pass/secret filter
    crit: component
    conf: 0.88
    if:
      type: text
      regex: 'process\.env.{0,180}/.{0,40}(pass|secret).{0,40}/\w*\.(test|exec)\('

  - id: env-filter-key-token-regex
    desc: Environment enumeration with key/token filter
    crit: component
    conf: 0.88
    if:
      type: text
      regex: 'process\.env.{0,180}/.{0,40}(key|token).{0,40}/\w*\.(test|exec)\('

  - id: env-filter-auth-cred-regex
    desc: Environment enumeration with auth filter
    crit: component
    conf: 0.88
    if:
      type: text
      regex: 'process\.env.{0,180}/.{0,40}(auth|credential).{0,40}/\w*\.(test|exec)\('
  - id: debug-env-filter-marker
    desc: Debug namespace environment filter
    crit: baseline
    conf: 0.95
    if:
      type: text
      # Minifiers rename the callback variable (`key`, `Ee`, etc.); the
      # DEBUG_ namespace is the behavioral discriminator, not that identifier.
      regex: 'Object\.keys\(process\.env\)[\s\S]{0,160}/\^?debug_/i?\.test\(\s*\w+\s*\)'
  - id: js-env-secret-prefix-redaction
    desc: JavaScript redacts secret value prefixes
    crit: notable
    conf: 0.96
    if:
      type: text
      regex: 'substring\(0,3\)\+"\*\*\*"'
composite_rules:
  # Enumeration plus a credential-name token, in either source order. Stealers
  # often bind `/KEY|SECRET|TOKEN…/` before the Object.entries loop.
  - id: js-secret-keyword-list
    desc: JavaScript environment secret-keyword filter
    crit: notable
    conf: 0.96
    near_bytes: 400
    all:
      - id: objectives/credential-access/theft/keywords::credential-label-upper
    any:
      - id: micro-behaviors/os/env/vars/access::js-object-entries-env
      - id: micro-behaviors/os/env/vars/access::js-object-keys-env
  - id: js-env-entries-secret-keyword-sweep
    desc: Scans environment entries for secret names
    crit: notable
    conf: 0.96
    all:
      - id: micro-behaviors/os/env/vars/access::js-object-entries-env
      - id: js-secret-keyword-list
      - id: js-env-secret-prefix-redaction
  - id: env-secret-filter-credential
    desc: Env filtered for credential-keyword names
    crit: notable
    conf: 0.82
    near_bytes: 200
    all:
      - id: micro-behaviors/os/env/access::process-env
      - id: env-filter-method
    any:
      - id: objectives/credential-access/theft/keywords::secret-upper
      - id: objectives/credential-access/theft/keywords::token-upper
      - id: objectives/credential-access/theft/keywords::cred-upper
    unless:
      - id: well-known/app/ai/gateway/opencode-router
      - id: metadata/package/testing/harness/runtime/
      - id: metadata/package/testing/presence/harness/
      - id: metadata/package/testing/presence/fixture::test-filename-pattern
      - id: metadata/library/structure/
      - id: metadata/build/recognized-contexts::benign-build-tooling-context
  - id: node-env-secret-filter
    desc: Filters env vars for secrets
    crit: notable
    conf: 0.9
    unless:
      - id: well-known/app/ai/gateway/opencode-router
    any:
      - id: env-secret-filter-credential
      - id: env-secret-filter-keyword-list
      - id: env-secret-filter-regex-list
  - id: env-secret-filter-regex-list
    desc: process.env secret-name filter regex
    crit: notable
    conf: 0.9
    near_bytes: 240
    all:
      - id: micro-behaviors/os/env/vars/access::js-object-keys-env
    any:
      - id: env-filter-pass-secret-regex
      - id: env-filter-key-token-regex
      - id: env-filter-auth-cred-regex
    unless:
      - id: debug-env-filter-marker
  - id: node-filtered-secret-scan
    desc: Filters process.env for secret values
    crit: suspicious
    conf: 0.94
    unless:
      - id: micro-behaviors/process/interpreter/vm::yarn-release-bundle
      - id: objectives/credential-access/env/secrets/compat::yarn-debug-env-filter
      - id: metadata/library/runtime::acquire-vscode-api
      - id: micro-behaviors/process/interpreter/vm/
    all:
      - id: objectives/credential-access/env/secrets/bulk-access
      - id: node-env-secret-filter

  - id: node-host-identified-env-harvest
    desc: Copies filtered environment with host identity
    crit: suspicious
    conf: 0.94
    all:
      - id: micro-behaviors/os/env/access::js-filtered-env-copy
      - id: objectives/discovery/system/fingerprint/user::node-host-user-query-pair
    unless:
      - id: metadata/package/testing/
      - id: metadata/signed/platform/
      - id: well-known/app/development/vscode-extension/salesforce-vscode::salesforce-vscode
      - id: metadata/package/manifest/runtime::vscode-extension
      - id: metadata/library/vscode::require-vscode

  - id: node-secret-env-http-exfiltration
    desc: Node posts filtered credential-named environment variables
    crit: hostile
    conf: 0.99
    attack: T1552.001,T1041
    mbc: E1552,E1041
    near_bytes: 8192
    all:
      - id: env-secret-filter-keyword-list
      - id: micro-behaviors/os/env/access::process-env
      - id: micro-behaviors/communications/http/request/configuration::node-http-request-configured
      - id: micro-behaviors/communications/http/request/client::node-http-request-stream-body
      - id: micro-behaviors/data/serialize/json::json-stringify-call
    unless:
      - id: metadata/package/testing/harness/runtime/
      - id: metadata/package/testing/presence/harness/
      - id: metadata/package/testing/presence/fixture::test-filename-pattern

  - id: node-persistent-secret-scan
    desc: Node scans credential-named environment variables with persistence
    crit: hostile
    conf: 0.98
    attack: "T1552.001,T1053.003"
    all:
      - id: env-secret-filter-credential
      - id: objectives/persistence/system/cron/job::node-remote-download-cron
  - id: js-constructor-secret-env-dump
    desc: Constructor dumps filtered environment data
    crit: hostile
    conf: 0.99
    attack: "T1059.007,T1552.001"
    all:
      - id: micro-behaviors/process/create/shell/bridge::js-constructor-execsync
      - id: js-execsync-secret-env-grep
