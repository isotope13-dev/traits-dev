defaults:
  platforms:
  - windows
  - unix
  for:
  - javascript
  - typescript
  attack: T1552.001
traits:
- id: js-execsync-secret-env-grep
  desc: Shell filters environment for secret names
  crit: suspicious
  conf: 0.95
  if:
    type: symbol
    kind: call
    exact: execSync
    arg:
      kind: string
      regex: \benv\s*\|\s*grep\b[\s\S]{0,120}\b(AWS|GCP|GOOGLE|AZURE|TOKEN|SECRET|KEY|PASS|CRED|ENCRYPTION)\b
- id: js-env-secret-prefix-redaction
  desc: JavaScript redacts secret value prefixes
  crit: notable
  conf: 0.96
  if:
    type: text
    substr: substring(0,3)+"***"
composite_rules:
- id: js-env-entries-secret-keyword-sweep
  desc: Scans environment entries for secret names
  crit: notable
  conf: 0.96
  all:
  - id: micro-behaviors/os/env/enumerate::js-object-entries-env
  - id: micro-behaviors/os/env/secret-name::js-secret-keyword-list
  - id: js-env-secret-prefix-redaction
- id: node-filtered-secret-scan
  desc: Filters process.env for secret values
  crit: suspicious
  conf: 0.94
  unless:
  - id: well-known/lib/development/vscode-webview::acquire-vscode-api
  all:
  - id: objectives/credential-access/env/secrets/bulk-access
  - id: micro-behaviors/os/env/enumerate::js-env-name-credential-regex-filter
  - id: micro-behaviors/os/env/read/collection::js-filtered-env-copy
- id: node-host-identified-env-harvest
  desc: Collects credential-named environment with host identity
  crit: suspicious
  conf: 0.94
  all:
  - id: micro-behaviors/os/env/enumerate::js-env-name-credential-regex-filter
  - id: micro-behaviors/os/env/read/collection::js-filtered-env-copy
  - id: micro-behaviors/os/sysinfo/profile::node-host-user-query-pair
  unless:
  - id: well-known/lib/development/vscode::require-vscode
  downgrade:
    any:
    - id: well-known/tool/development/vscode-extension/salesforce-vscode::salesforce-vscode
    - id: metadata/package/runtime::vscode-extension
- id: node-secret-env-http-exfiltration
  desc: Node posts filtered credential-named environment variables
  crit: hostile
  conf: 0.99
  attack: T1552.001,T1041
  mbc: E1552,E1041
  near_bytes: 8192
  all:
  - id: micro-behaviors/os/env/enumerate::js-env-name-credential-regex-filter
  - id: micro-behaviors/os/env/read/collection::js-filtered-env-copy
  - id: micro-behaviors/communications/http/request/configuration::node-http-request-configured
  - id: micro-behaviors/communications/http/request/body/construction::node-http-request-stream-body
  - id: micro-behaviors/data/serialize/json::json-stringify-call
  unless:
  - id: metadata/package/testing/presence/fixture::test-filename-pattern
- id: js-constructor-secret-env-dump
  desc: Constructor dumps filtered environment data
  crit: hostile
  conf: 0.99
  attack: T1059.007,T1552.001
  all:
  - id: micro-behaviors/process/create/shell/command-string::js-constructor-execsync
  - id: js-execsync-secret-env-grep
