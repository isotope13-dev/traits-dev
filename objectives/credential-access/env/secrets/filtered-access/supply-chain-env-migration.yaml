defaults:
  platforms:
  - unix
  - windows
  crit: notable
  attack: T1552.001
composite_rules:
- id: npm-postinstall-jwt-env-harvest
  desc: npm hook extracts JWT-like env secrets
  crit: hostile
  conf: 0.99
  for:
  - package.json
  all:
  - id: micro-behaviors/os/env/enumerate::npm-postinstall-env-iteration
  - id: metadata/package/scripts/reference::npm-postinstall-jwt-pattern
- id: pypi-setup-credential-env-harvest
  desc: PyPI setup.py harvests credential-named environment entries
  crit: hostile
  conf: 0.98
  attack: T1195.002,T1552.001
  mbc: E1552
  for:
  - python
  scope: leaf
  all:
  - id: metadata/build/pip::setup-py
  - id: micro-behaviors/os/env/secret-name::python-environ-credential-name-filter
  unless:
  - id: metadata/package/testing/presence/attack-simulation::simulated-attack-marker-python
- id: python-bulk-secret-env-harvest
  desc: Python iterates env entries for secret names
  crit: notable
  conf: 0.9
  mbc: E1552
  for:
  - python
  all:
  - id: micro-behaviors/os/env/enumerate::python-environ-items-loop
  - id: micro-behaviors/os/env/secret-name::python-environ-credential-selection
  unless:
  - id: well-known/app/ai/knowledge/animica::package-context
  - id: well-known/app/ai/gateway/litellm::litellm-aws-kms-env-provider
  - id: metadata/path/directory::test-directory-component
