# Python environment credential harvesting (obfuscated-stealer class).
# Filtering os.environ names is a neutral observation because defensive tools
# may use it to redact secrets. The hostile composite requires that observation
# plus XOR decoding or user discovery before it becomes a credential-stealer signal.
defaults:
  platforms: [unix, windows]
  for: [python]
  attack: T1552.001
traits:
  - id: python-obfuscated-api-key-label
    desc: Python source names an API credential
    crit: component
    conf: 0.9
    if:
      type: text
      regex: '(?i)\b[A-Z][A-Z0-9_]{0,24}(API_KEY|TOKEN|SECRET)\b'

composite_rules:
  - id: py-obfuscated-env-credential-harvest
    desc: Obfuscated Python env credential harvest
    crit: hostile
    conf: 0.94
    size_max: 262144
    all:
      - id: micro-behaviors/os/env/vars/credentials::python-environ-credential-filter
      - id: micro-behaviors/crypto/symmetric/xor/loop::xor-modulo-key-loop
      - id: objectives/anti-static/obfuscation/encoding/layered::base64-xor-transform
    unless:
      - id: metadata/package/testing/harness/runtime/
    downgrade:
      any:
        - id: metadata/package/testing/
        - id: metadata/signed/platform/
  - id: python-obfuscated-api-credential
    desc: Python hides an API credential with XOR character reconstruction
    crit: hostile
    conf: 0.99
    attack: "T1027,T1552.001"
    mbc: "B0032,E1014"
    near_bytes: 16384
    all:
      - id: python-obfuscated-api-key-label
      - id: micro-behaviors/crypto/symmetric/xor/loop::xor-modulo-key-loop
      - id: micro-behaviors/data/string/conversion::python-chr-call
