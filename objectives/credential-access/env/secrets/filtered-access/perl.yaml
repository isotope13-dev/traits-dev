# Perl environment credential harvesting (grep credential names over keys %ENV).
defaults:
  platforms: [unix, windows]
  for: [perl]
  attack: T1552.001
composite_rules:
  - id: perl-obfuscated-env-credential-harvest
    desc: Obfuscated Perl env credential harvest
    crit: hostile
    conf: 0.94
    size_max: 262144
    # A bare `^ ... %` operator also appears in checksums, hashes, and PRNGs,
    # and a decode loop with no encoded input is dead scaffolding rather than
    # concealment. Require encoded data actually entering a decoder alongside
    # the loop so the "obfuscated" verdict means strings are hidden, not that
    # an operator exists somewhere in the file.
    all:
      - id: micro-behaviors/os/env/enumerate::perl-sensitive-name-env-filter
      - id: micro-behaviors/data/encode/xor::perl-xor-decode
    any:
      - id: micro-behaviors/data/decode/base64/unspecified::decode-base64-call
      - id: micro-behaviors/data/decode/hex::perl-packed-hex-byte-decode
    needs: 1
