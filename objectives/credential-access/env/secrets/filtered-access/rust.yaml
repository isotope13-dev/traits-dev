# Rust environment credential harvesting (obfuscated-stealer class).
defaults:
  platforms: [unix, windows]
  for: [rust]
  attack: T1552.001
traits:
composite_rules:
  - id: rust-obfuscated-env-credential-harvest
    desc: Obfuscated Rust env credential harvest
    crit: hostile
    conf: 0.94
    size_max: 262144
    all:
      - id: metadata/lang/source/shape::rust-env-vars-near-keyword-text
      - id: micro-behaviors/data/encode/xor::xor-index-modulo-generic
    downgrade:
      any:
        - id: metadata/package/testing/
        - id: metadata/signed/platform/
        - id: "metadata/file/naming::test-directory-component"
