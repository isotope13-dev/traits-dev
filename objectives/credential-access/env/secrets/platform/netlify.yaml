# NETLIFY_AUTH_TOKEN is a Netlify personal access token: full authority over
# every site on the account, including creating deploys. The vendor CLI and
# framework deploy commands read it legitimately, so reading it is notable
# rather than suspicious; exfiltration intent has to come from a composite that
# pairs this read with a destination that is not Netlify.
#
# NETLIFY_SITE_ID sits beside it in the same deploy configuration but is an
# identifier, not a secret, so it gets no trait here.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, python, shell]
  attack: T1552.001

traits:
  - id: netlify-auth-token-env-var
    desc: Netlify deploy token environment variable
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: '\bprocess\.env\.NETLIFY_AUTH_TOKEN\b'
