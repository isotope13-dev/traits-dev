# Hardcoded credential planting via environment variable assignment
# ATT&CK: T1552.001 (Credentials In Files)
defaults:
  crit: notable
  for: [javascript, typescript]
  platforms: [unix, windows]
  attack: T1552.001
traits:
  - id: hardcoded-credential-env-assignment
    unless:
      - id: metadata/file/naming::test-directory-component
      - id: metadata/file/naming::jest-tests-directory-component
      - id: well-known/lib/web/node-strava::node-strava-v3-package-identity
    desc: Hardcoded credential environment assignment
    crit: component
    conf: 0.92
    if:
      type: text
      regex: 'process\.env\.[A-Z0-9_]*(TOKEN|SECRET|PASSWORD|KEY)\s*=\s*["''][^"''\r\n]{8,}["'']'
composite_rules:
  - id: env-credential-plant
    desc: Hardcoded secret token planted in process.env
    conf: 0.9
    near_lines: 20
    near_bytes: 500
    all:
      - id: micro-behaviors/os/env/modify::js-process-env-write
      - id: hardcoded-credential-env-assignment
    unless:
      - id: metadata/file/naming::test-directory-component
      - id: metadata/file/naming::jest-tests-directory-component
      - id: well-known/lib/web/node-strava::node-strava-v3-package-identity
