defaults:
  platforms:
    - unix
    - windows
  for: [scripts, binaries]
traits:
  - id: x-auth-token-hex-32
    desc: Hardcoded X-Auth-Token hex secret
    crit: suspicious
    conf: 0.85
    if:
      type: text
      regex: (?i)X-Auth-Token["'\s:=]{0,16}[a-f0-9]{32,}
    unless:
      - id: metadata/package/testing/
      - id: metadata/path::test-directory-component
  - id: slack-xoxp-token
    desc: Hardcoded Slack user OAuth token
    crit: suspicious
    conf: 0.95
    # Gitpanda's checked-in .envrc.example uses an all-zero placeholder that
    # has the right shape but is not a credential. Keep live-looking tokens
    # detectable while excluding deterministic example values.
    unless:
      - id: "metadata/file/catalog/pattern-rules::secret-pattern-example-catalog"
      - id: well-known/tool/detection/security-scanner::titus-defensive-secret-scanner-context
      - id: well-known/tool/detection/checkmarx::ast-scanner-pattern-catalog
      - id: well-known/tool/detection/xgrep::xgrep-scanner-context
      - id: micro-behaviors/data/string/redact::secret-pattern-catalog-db
      - type: text
        regex: 'xoxp-(?:0+-){3}0{20,}'
    if:
      type: text
      regex: xoxp-\d{10,}-\d{10,}-\d{10,}-[a-f0-9]{20,}
  - id: slack-xoxa-token
    desc: Hardcoded Slack app-level token
    crit: suspicious
    conf: 0.95
    if:
      type: text
      regex: xoxa-\d+-[a-zA-Z0-9]{20,}
  - id: slack-xoxs-token
    desc: Hardcoded Slack session token
    crit: suspicious
    conf: 0.95
    if:
      type: text
      regex: xoxs-\d+-[a-zA-Z0-9]{20,}
  - id: hardcoded-emergent-project-token
    desc: Embedded Emergent project API token
    crit: notable
    conf: 0.94
    for: [scripts, source]
    if:
      type: text
      regex: '\bemt_[A-Za-z0-9]{40,}\b'
    unless:
      - type: text
        regex: '(?i)\bemt_(?:abc123|your[_-]?token|example)\b'

composite_rules:
  - id: embedded-signing-key-auth-client
    desc: Embedded signing key used by an auth client
    crit: hostile
    conf: 0.97
    for: [python]
    all:
      - id: micro-behaviors/crypto/key/representation::embedded-pem-private-key
      - id: micro-behaviors/communications/http/authorization-header::authorization-header-map-entry
      - id: micro-behaviors/communications/http/request/httpx::httpx-async-client-post
  - id: remote-emergent-graph-write-with-embedded-token
    for: [scripts, '!jcl']
    desc: Remote graph write uses embedded project token
    crit: suspicious
    conf: 0.95
    all:
      - id: micro-behaviors/communications/http/services/emergent::emergent-memory-service-url
      - id: micro-behaviors/communications/http/services/emergent::emergent-memory-graph-relationship-command
      - id: hardcoded-emergent-project-token
