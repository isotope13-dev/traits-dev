defaults:
  platforms: [unix, windows]
  for: [php]
  attack: T1552.001
  mbc: B0014

traits:
  - id: php-dotenv-read-into-variable
    desc: PHP reads dotenv contents into a variable
    crit: suspicious
    conf: 0.97
    if:
      type: text
      regex: '\$[A-Za-z_][A-Za-z0-9_]*\s*=\s*@?\s*file_get_contents\s*\([^;]{0,220}[/\\]\.env'

composite_rules:
  - id: php-dotenv-credential-disclosure
    desc: PHP returns dotenv credentials in response
    crit: hostile
    conf: 0.99
    attack: T1041,T1505.003,T1552.001
    scope: leaf
    near_bytes: 512
    all:
      - id: micro-behaviors/fs/read/file::file-get-contents
      - id: micro-behaviors/fs/path/sensitive/credentials::dotenv-filename-literal
      - id: micro-behaviors/communications/http/request/params::document-root-access
      - id: micro-behaviors/os/stdio::php-echo-statement
      - id: php-dotenv-read-into-variable
