defaults:
  platforms: [unix, windows]
  for: [php]
  attack: T1552.001
  mbc: B0014

composite_rules:
  - id: php-dotenv-credential-disclosure
    desc: PHP returns dotenv credentials in response
    crit: hostile
    conf: 0.99
    attack: T1041,T1505.003,T1552.001
    scope: leaf
    near_bytes: 512
    all:
      - id: micro-behaviors/fs/read/file/full::file-get-contents
      - id: micro-behaviors/fs/path/secret-config::dotenv-filename-literal
      - id: micro-behaviors/communications/http/request/superglobal::document-root-access
      - id: micro-behaviors/os/stdio::php-echo-statement
      - id: micro-behaviors/fs/read/file/target::php-dotenv-read-into-variable
