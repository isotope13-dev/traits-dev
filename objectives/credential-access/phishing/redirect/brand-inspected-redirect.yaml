defaults:
  platforms: [windows, unix]
  for: [html, javascript, typescript]
  attack: T1566.002
  mbc: B0030

composite_rules:
  - id: anti-inspection-external-redirect
    desc: External browser redirect pairs with inspection countermeasures
    crit: suspicious
    conf: 0.94
    near_bytes: 4096
    all:
      - id: objectives/anti-analysis/browser-detect::js-anti-inspection-suite
    any:
      - id: micro-behaviors/ui/window/navigation/location::variable-external-location-redirect
      - id: micro-behaviors/ui/window/navigation/location::browser-external-redirect
    unless:
      - id: well-known/lib/crypto/microsoft-auth::ests-login-runtime

  - id: branded-inspected-external-redirect
    desc: Branded document page blocks inspection and redirects externally
    for: [html]
    crit: hostile
    conf: 0.97
    attack: T1566.002,T1036
    near_bytes: 8192
    all:
      - id: anti-inspection-external-redirect
    any:
      - id: micro-behaviors/ui/window/html::sharepoint-page-title
      - id: micro-behaviors/ui/window/html::acrobat-page-title
      - id: micro-behaviors/ui/window/html::docusign-page-title
      - id: well-known/app/system/microsoft-brand::microsoft-collaboration-page-title
      - id: well-known/app/system/microsoft-brand::microsoft-onedrive-brand-element
    unless:
      - id: well-known/lib/crypto/microsoft-auth::ests-login-runtime
