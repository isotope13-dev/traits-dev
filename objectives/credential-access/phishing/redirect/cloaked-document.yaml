# A fake document-decryption progress sequence conceals a browser redirect.
# Require both automation rejection and compute-speed rejection: ordinary
# document viewers, navigation code and individual bot checks are insufficient.
# HTML is covered by its parsed JavaScript child, where comment exclusion and
# literal matching distinguish executable source from page documentation.
defaults:
  platforms: [windows, unix]
  for: [javascript]
  attack: T1566.002
composite_rules:
  - id: cloaked-document-decryption-redirect
    desc: Cloaked document-decryption lure redirects the browser
    crit: hostile
    conf: 0.98
    ref: https://cofense.com/blog/fake-deals,-real-threats-black-friday-phishing-targets-microsoft-accounts
    all:
      - id: micro-behaviors/ui/window/display::document-decryption-status
      - id: objectives/anti-analysis/sandbox-detect/tool-references::webdriver-false-return
      - id: objectives/anti-analysis/sandbox-detect/timing::browser-compute-speed-rejection
      - id: micro-behaviors/ui/window/navigation/location::browser-timer-delayed-location-redirect
