# Blank HTML "boleto"/"fatura" attachments that instantly redirect to a
# payment-and-document themed lure host. See
# micro-behaviors/ui/window/navigation/refresh/payment-document-host.yaml.
defaults:
  platforms: [windows, unix]
  crit: hostile
  attack: T1566.001,T1204.001
  mbc: B0030

composite_rules:
  - id: blank-page-redirect-to-payment-document-host
    desc: Blank HTML page instantly redirects to a payment-slip document lure host
    for: [html]
    conf: 0.93
    all:
      - id: micro-behaviors/ui/window/navigation/refresh::meta-refresh-instant-external
      - id: micro-behaviors/ui/window/navigation/refresh::meta-refresh-payment-and-document-host
      - id: micro-behaviors/ui/window/navigation/refresh::html-body-without-text

  # The mailed archive carries nothing but blank redirect pages.
  - id: archived-blank-redirect-attachment
    desc: Small archive delivers a blank HTML page that instantly redirects off-site
    crit: suspicious
    for: [zip, 7z, rar, html]
    scope: outer
    conf: 0.9
    all:
      - id: metadata/archive/layout::archive-one-to-three-members
      - id: micro-behaviors/ui/window/navigation/refresh::meta-refresh-instant-external
      - id: micro-behaviors/ui/window/navigation/refresh::html-body-without-text
