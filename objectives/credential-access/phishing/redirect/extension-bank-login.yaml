# A bank-login selector and an HTTP redirect support a phishing diversion.
# Permission evidence belongs to the manifest, so do not compare member offsets.
defaults:
  platforms: [unix, windows]

composite_rules:
- id: extension-diverts-bank-login
  desc: Extension redirects bank login traffic off site
  crit: hostile
  conf: 0.98
  attack: T1189,T1176
  for: [crx, xpi, zip, javascript, chrome-manifest]
  scope: archive
  all:
  - id: bank-login-http-redirect
  - id: metadata/permission/host::permission-all-urls

- id: bank-login-http-redirect
  desc: Bank-login URL filter near WebRequest HTTP redirect
  crit: notable
  conf: 0.96
  for: [javascript, typescript]
  scope: file
  near_bytes: 512
  all:
  - id: micro-behaviors/communications/http/intercept::bank-login-request-filter
  - id: micro-behaviors/communications/http/redirect::webrequest-external-redirect
