# Published Google Docs pages that abuse Google's editor click-tracking
# redirector (&source=editors) to launder a deceptive download pretext toward
# an external PHP endpoint.
defaults:
  platforms: [windows, unix]
  for: [html]
  attack: T1566.002,T1204.001
  mbc: B0030

traits:
  - id: google-editors-click-tracked-php-url
    desc: Google editor redirect targets a PHP URL
    crit: notable
    conf: 0.94
    if:
      type: text
      exclude_html_comments: true
      case_insensitive: true
      regex: 'google\.com/url\?q=https?://[^&"<>\s]{1,140}\.php[^"<>]{0,140}&(amp;)?source=editors'

composite_rules:
  - id: google-docs-published-php-lure
    desc: Published Google Doc launders a tracked PHP lure redirect
    crit: hostile
    conf: 0.96
    all:
      - id: metadata/document/html/generated::google-docs-published-page
      - id: google-editors-click-tracked-php-url
    any:
      - id: objectives/impact/ui/manipulation/traffic/navigation::automatic-redirect-failure-message
      - id: micro-behaviors/ui/dialog/error::document-preview-disabled
      - id: micro-behaviors/ui/keywords::macro-office-filename-markup-label
