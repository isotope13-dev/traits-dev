defaults:
  platforms:
  - windows
  - unix
  for:
  - html
  mbc: B0021
  attack: T1204.001,T1140
composite_rules:
  - id: turnstile-encrypted-next-hop-redirect
    desc: Decrypts the phishing redirect after CAPTCHA failure
    crit: hostile
    conf: 0.98
    all:
    - id: objectives/credential-access/phishing/captcha::cloudflare-turnstile-phishing-page
    - id: micro-behaviors/crypto/provider/webcrypto::webcrypto-decrypt-source-call
    - id: micro-behaviors/communications/url/construction/query::js-urlsearchparams-construction
    - id: micro-behaviors/ui/window/navigation/location::urlsearchparams-query-forwarding-iteration
    any:
    - id: micro-behaviors/data/control-flow/dispatch/computed::computed-target-url-params-call
    - id: micro-behaviors/ui/window/navigation/location::computed-window-target-url-call
    - id: micro-behaviors/data/control-flow/dispatch/computed::window-double-bracket-call
    - id: micro-behaviors/ui/window/navigation/location::browser-location-replace
  - id: browser-check-keyval-encrypted-next-hop-redirect
    desc: Browser-check page decrypts KV next hop and forwards query
    crit: hostile
    conf: 0.96
    for:
    - html
    - javascript
    all:
    - id: micro-behaviors/ui/controls/captcha::checking-browser-progress-text
    - id: micro-behaviors/communications/http/services/file-hosting::keyval-api-host
    - id: micro-behaviors/crypto/provider/webcrypto::webcrypto-decrypt-source-call
    - id: micro-behaviors/ui/window/navigation/location::urlsearchparams-query-forwarding-iteration
    - id: micro-behaviors/ui/window/navigation/location::browser-location-replace
  - id: obfuscated-turnstile-expiry-decrypt-redirect
    desc: Turnstile expiry completion with decryption and navigation
    crit: hostile
    conf: 0.96
    all:
    - id: micro-behaviors/communications/http/services/cloudflare::turnstile-challenge-api-script
    - id: micro-behaviors/ui/controls/captcha::turnstile-callback-handler
    - id: micro-behaviors/communications/url/construction/query::js-urlsearchparams-construction
    - id: micro-behaviors/ui/window/navigation/location::urlsearchparams-query-forwarding-iteration
    - id: micro-behaviors/ui/controls/captcha::turnstile-expired-completion-reference
    - id: micro-behaviors/crypto/provider/webcrypto::webcrypto-decrypt-source-call
    any:
    - id: micro-behaviors/data/control-flow/dispatch/computed::computed-target-url-params-call
    - id: micro-behaviors/ui/window/navigation/location::computed-window-target-url-call
    - id: micro-behaviors/data/control-flow/dispatch/computed::window-double-bracket-call
    - id: micro-behaviors/ui/window/navigation/location::browser-location-replace
