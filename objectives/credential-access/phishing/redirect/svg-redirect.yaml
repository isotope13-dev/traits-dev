defaults:
  crit: hostile
  platforms: [windows, unix]
  for: [svg]
  attack: T1056.002,T1041,T1566.002

composite_rules:
  - id: svg-obfuscated-external-redirector
    desc: SVG hides script logic and redirects the browser externally
    conf: 0.98
    attack: T1027,T1189,T1566.002
    all:
      - id: metadata/file/format/markup::inline-svg-script-body
      - id: micro-behaviors/data/encode/hex::svg-hex-escaped-member-call
      - id: micro-behaviors/communications/url/navigation-http::svg-location-external-assignment
    near_bytes: 2200

  # The redirect variant: the destination URL is assembled at runtime and
  # assigned from a variable, so the literal-URL redirector above cannot see
  # it. The reconstruction evidence plus the computed navigation write is the
  # campaign's "fetched a remote endpoint" leg.
  - id: svg-reconstructed-external-redirect
    desc: SVG redirects browser to runtime-reconstructed URL
    conf: 0.96
    attack: T1027,T1189,T1566.002
    all:
      - id: metadata/file/format/markup::inline-svg-script-body
      - id: micro-behaviors/communications/url/navigation-http::svg-location-variable-assignment
    any:
      - id: micro-behaviors/data/encode/hex::svg-hex-escaped-string-array
      - id: micro-behaviors/data/encode/hex::svg-hex-escaped-member-call
      - id: micro-behaviors/data/decode/base64/unspecified::base64-decode-call-text
      - id: micro-behaviors/data/decode/char-code::fromcharcode-apply-array
      - id: micro-behaviors/data/decode/char-code::fromcharcode-indexed-array
    near_bytes: 2200
