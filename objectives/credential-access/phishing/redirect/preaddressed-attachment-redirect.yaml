# Small HTML attachments that carry the recipient's address in a script
# variable and send the browser to a lure page whose URL is assembled at run
# time (base64 pieces, a letter-joined "atob", a part-joined "location").
# The address rides along so the credential page arrives pre-filled. A real
# page has no reason to hide either its own destination or the word
# "location".
defaults:
  platforms: [windows, unix]
  for: [html]
  crit: hostile
  attack: T1566.001,T1204.001

composite_rules:
  - id: preaddressed-attachment-hidden-redirect
    desc: Pre-addressed HTML attachment redirects to a run-time assembled URL
    conf: 0.93
    size_max: 8192
    all:
      - id: micro-behaviors/ui/controls/input::email-assigned-variable
      - id: metadata/lang/source/literal/fragment/sequence::location-name-joined-from-parts
    any:
      - id: metadata/lang/source/literal/fragment/sequence::atob-name-joined-from-letters
      - id: metadata/lang/source/literal/fragment/sequence::base64-fragment-array-reduce
