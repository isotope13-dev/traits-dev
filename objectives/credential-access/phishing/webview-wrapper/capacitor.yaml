# Capacitor remote-shell apps: the app UI is a remote site, not bundled assets.
# Build scripts and configs that disable the bundled web runtime and allowlist
# navigation to a remote host produce an APK whose content the operator can
# swap at any time. Used by legitimate in-house apps and by WebView phishing
# wrappers alike, so the composite is suspicious rather than hostile.
defaults:
  platforms: [unix, windows, android]
  for: [powershell, javascript, typescript]
  crit: notable
  conf: 0.8
  attack: "T1566"

traits:
  - id: capacitor-no-bundled-runtime
    desc: Capacitor config disables bundled web runtime
    conf: 0.8
    if:
      type: text
      regex: "bundledWebRuntime\"?\\s*:\\s*false"

  - id: capacitor-remote-navigation-hosts
    desc: Capacitor config sets remote navigation hosts
    conf: 0.8
    if:
      type: text
      substr: "allowNavigation"

composite_rules:
  - id: capacitor-remote-shell-config
    desc: Capacitor app UI served from remote host, no bundled assets
    crit: suspicious
    conf: 0.85
    all:
      - id: capacitor-no-bundled-runtime
      - id: capacitor-remote-navigation-hosts
