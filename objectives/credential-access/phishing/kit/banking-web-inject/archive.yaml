defaults:
  platforms: [windows]
  for: [rar]
  conf: 0.98

traits:
  - id: html-injection-admin-module
    desc: HTML-injection admin module path
    crit: suspicious
    if:
      type: raw
      regex: '(?i)[\\/]admin[\\/]modules[\\/]htmlinj\.inc'

  - id: grab-settings-admin-module
    desc: Grab-settings admin module path
    crit: suspicious
    if:
      type: raw
      regex: '(?i)[\\/]admin[\\/]modules[\\/]grabset\.inc'

  - id: screenshot-admin-module
    desc: Screenshot admin module path
    crit: suspicious
    if:
      type: raw
      regex: '(?i)[\\/]admin[\\/]modules[\\/]screenshots\.inc'

  - id: barclays-parser-module
    desc: Barclays parser module path
    crit: suspicious
    if:
      type: raw
      regex: '(?i)[\\/]modules[\\/]parser[\\/]barclays\.inc'

  - id: hsbc-parser-module
    desc: HSBC parser module path
    crit: suspicious
    if:
      type: raw
      regex: '(?i)[\\/]modules[\\/]parser[\\/]hsbc\.inc'

  - id: bot-browser-module
    desc: Bot browser control-panel path
    crit: suspicious
    if:
      type: raw
      regex: '(?i)[\\/]bot[\\/]browsebots\.php'

  - id: bot-parser-task-module
    desc: Bot parser task module path
    crit: suspicious
    if:
      type: raw
      regex: '(?i)[\\/]bot[\\/]pars_task\.php'

  - id: bot-parser-view-module
    desc: Bot parser view module path
    crit: suspicious
    if:
      type: raw
      regex: '(?i)[\\/]bot[\\/]pars_view\.php'

composite_rules:
  - id: banking-web-injection-phishing-kit
    desc: Banking web-injection and bot-control kit
    crit: hostile
    attack: T1056
    all:
      - id: html-injection-admin-module
      - id: grab-settings-admin-module
      - id: screenshot-admin-module
      - id: barclays-parser-module
      - id: hsbc-parser-module
      - id: bot-browser-module
      - id: bot-parser-task-module
      - id: bot-parser-view-module
