# A Python spear-phishing generator fills a lure template with a per-target
# phishing link and builds a sender identity that spoofs the target's own
# domain or a department. The link placeholder and the spoofed sender are
# the two required roles.
defaults:
  platforms: [unix, windows]
  for: [python]
  size_max: 1048576
  attack: T1566.002

traits:
  - id: phish-url-format-placeholder
    desc: Lure template takes a phish URL placeholder
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '\{phish(ing)?_url\}'

  - id: spoofed-sender-identity
    desc: Code builds a spoofed sender identity
    crit: notable
    conf: 0.88
    if:
      type: text
      regex: '(?i)\b(sender_spoof|spoofed_sender|spoof_sender)\b'

composite_rules:
  - id: python-spoofed-phishing-email-generator
    desc: Python builds spoofed-sender phishing email with a per-target link
    crit: hostile
    conf: 0.92
    all:
      - id: phish-url-format-placeholder
      - id: spoofed-sender-identity
