# A phishing campaign email template: an urgent subject, an HTML body asking
# the recipient to verify their identity or account through a link, and
# placeholders a campaign tool fills per target (tracked link, open-tracking
# pixel). Red-team phishing frameworks ship the same shape.
defaults:
  platforms: [linux, macos, windows]
  for: [yaml, json, text]
  size_max: 65536
  attack: T1566.002

traits:
  - id: verify-identity-link-request
    desc: Message asks recipient to verify via link
    crit: notable
    conf: 0.85
    if:
      type: text
      regex: '(?i)verify (your )?(identity|account).{0,80}\b(click|link below)'

  - id: per-target-link-placeholder
    desc: Template link takes a per-target URL placeholder
    crit: notable
    conf: 0.85
    if:
      type: text
      regex: '(?i)href=["'']\{\{?\s*\.?(beacon_url|phish(ing)?_url|tracking_url|URL)\s*\}?\}["'']'

  - id: tracking-pixel-placeholder
    desc: Template has a tracking-pixel placeholder
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)\{\{?\s*\.?(tracking_pixel|Tracker|TrackingPixel)\s*\}?\}'

  - id: email-template-subject-body
    desc: Defines an email subject and HTML body
    crit: notable
    conf: 0.8
    if:
      type: text
      regex: '(?ms)^subject:\s*\S.{0,200}^body:\s*[|>]?\s*\n\s*<!DOCTYPE html>'

composite_rules:
  - id: phishing-email-campaign-template
    desc: Phishing email template with tracked verify link
    crit: suspicious
    conf: 0.9
    all:
      - id: verify-identity-link-request
      - id: per-target-link-placeholder
    any:
      - id: tracking-pixel-placeholder
      - id: email-template-subject-body
