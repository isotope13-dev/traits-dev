defaults:
  platforms: [unix, windows]
  for: [html, php, javascript]
  attack: T1566.002
  mbc: B0030
traits:
- id: php-ip-logger-include
  desc: PHP include of IP-logging sidecar script
  crit: component
  conf: 0.8
  for: [php]
  if:
    type: string_literal
    regex: (?i)\bip\b.{0,20}\.php
- id: php-mock-fixture
  desc: PHP mock fixture basename
  crit: notable
  conf: 0.8
  for: [php]
  if:
    type: path
    basename: true
    exact: mock.php
- id: php-installer-setup-path
  desc: PHP web installer or setup script path
  crit: notable
  conf: 0.85
  for: [php]
  if:
    type: path
    regex: '(?i)(^|[\\/])(setup|install)([\\/]|\.php$)'
- id: php-post-file-write-flow
  desc: PHP POST data written with fwrite
  crit: notable
  conf: 0.86
  for: [php]
  if:
    type: text
    regex: '\$_POST.{0,120}fwrite\s*\('
- id: php-post-file-write-flow-fputs
  desc: PHP POST data written with fputs
  crit: notable
  conf: 0.86
  for: [php]
  if:
    type: text
    regex: '\$_POST.{0,120}fputs\s*\('
- id: php-post-file-write-flow-put-contents
  desc: PHP POST data written with file_put_contents
  crit: notable
  conf: 0.86
  for: [php]
  if:
    type: text
    regex: '\$_POST.{0,120}file_put_contents\s*\('
- id: php-post-file-write-flow-open
  desc: PHP POST data followed by writable fopen
  crit: notable
  conf: 0.84
  for: [php]
  if:
    type: text
    regex: '\$_POST.{0,120}fopen\s*\(.{0,80},\s*["''][wa]'
- id: paypal-obfuscated-brand-text
  desc: PayPal brand HTML entities
  crit: notable
  conf: 0.9
  for: [php, html]
  if:
    type: text
    substr: "&#80;&#97;y&#80;&#97;l"
composite_rules:
- id: php-credential-exfiltration
  for: [php]
  desc: PHP script writing POST data to local file
  crit: suspicious
  conf: 0.85
  all:
  - id: micro-behaviors/communications/http/request/superglobal::post-dup
  any:
  - id: php-post-file-write-flow
  - id: php-post-file-write-flow-fputs
  - id: php-post-file-write-flow-put-contents
  - id: php-post-file-write-flow-open
  unless:
  - id: php-mock-fixture
  - id: metadata/build/generated::php-manual-empty-function-stubs
  - id: metadata/file/profile/test-indications/
  - id: well-known/lib/web/server/wordpress-core/
  - id: "metadata/lang/source/shape::yara-rule-source"
  - id: well-known/tool/detection/security-scanner::anteumbra-package-tree-member
  - id: micro-behaviors/fs/chmod/modify::chmod-call
  - id: php-installer-setup-path
- id: web-phishing-kit-redirect
  for: [javascript, html]
  desc: Phishing kit with credit card capture and redirect
  crit: hostile
  conf: 0.95
  all:
  - id: micro-behaviors/ui/window/navigation::browser-meta-refresh-external-url
  - id: micro-behaviors/data/parse/payment::cvv-cvc-name-reference
- id: web-phishing-kit-exfil
  for: [php]
  desc: Phishing kit with credit card capture and PHP exfiltration
  crit: hostile
  conf: 0.95
  all:
  - id: php-credential-exfiltration
  - id: micro-behaviors/data/parse/payment::cvv-cvc-name-reference
- id: php-paypal-card-phishing-form
  for: [php, html]
  desc: PayPal card and 3DS phishing form
  crit: hostile
  conf: 0.98
  # Obfuscated PayPal branding beside a card-number and a CVV field is the
  # conviction; the step-up/bank half only corroborates, so it sits in `any:`.
  # It was an `all:` leg back when `three-ds-password-field` matched a bare
  # `type="password"` and every kit therefore satisfied it. That atom now means
  # an actual 3-D Secure field name, and the generic password input joins it
  # here under its own micro-behavior instead of being smuggled in as 3DS.
  all:
  - id: paypal-obfuscated-brand-text
  - id: objectives/credential-access/phishing/ui::card-number-input-field
  - id: objectives/credential-access/phishing/ui::cvv-input-field
  any:
  - id: objectives/credential-access/phishing/ui::three-ds-password-field
  - id: micro-behaviors/ui/controls/credential::password-input-field
  - id: objectives/credential-access/phishing/ui::bank-account-sort-code-field
  - id: micro-behaviors/ui/window/form-input::html-account-named-input
  - id: micro-behaviors/communications/http/request/verb::post-method-text
- id: php-paypal-session-logged-card-phish
  for: [php]
  desc: PayPal card phish with session-hashed logging
  crit: hostile
  conf: 0.97
  all:
  - id: php-paypal-card-phishing-form
  - id: micro-behaviors/communications/http/url/php-endpoint::php-log
  - id: micro-behaviors/communications/http/request/superglobal::session
- id: php-phishing-kit-entry
  for: [php]
  desc: Phishing kit entry page logs IP then redirects to login
  crit: suspicious
  conf: 0.9
  all:
  - id: php-ip-logger-include
  - id: micro-behaviors/communications/http/redirect::php-login-redirect
- id: php-labeled-credential-harvest
  for: [php]
  desc: PHP writes labeled social media credentials to file
  crit: hostile
  conf: 0.95
  all:
  - id: metadata/lang/locale::php-account-label-string
  - id: objectives/credential-access/phishing/ui::php-credential-label-pass
  - id: php-credential-exfiltration
- id: php-social-media-phishing-kit
  desc: PHP social media credential phishing kit
  crit: suspicious
  conf: 0.97
  any:
  - id: php-labeled-credential-harvest
  - id: php-phishing-kit-entry
# A contentless stub whose only job is an instant client redirect to a
# sign-in endpoint. Branded forwarders carry page content; a sub-2KB page
# doing nothing but bouncing to signin.php is kit delivery furniture.
- id: web-kit-instant-signin-redirect
  for: [html]
  desc: Kit stub instantly redirects to sign-in endpoint
  crit: hostile
  conf: 0.92
  size_max: 2048
  all:
  - id: micro-behaviors/ui/window/navigation::browser-meta-refresh-instant-relative-url
  - id: micro-behaviors/communications/http/url/php-endpoint::signin-php-endpoint
# Belt and braces: the stub rewrites location twice (replace plus
# assignment) so the bounce survives partial script blocking. One
# navigation call is ordinary routing; two spellings of the same hop to a
# sign-in endpoint in a stub page is kit stubbornness.
- id: web-kit-redundant-signin-navigation
  for: [html]
  desc: Kit stub redundantly navigates to sign-in endpoint
  crit: hostile
  conf: 0.9
  size_max: 2048
  all:
  - id: micro-behaviors/ui/window/navigation::browser-location-replace
  - id: micro-behaviors/ui/window/navigation::window-variable-location-assignment
  - id: micro-behaviors/communications/http/url/php-endpoint::signin-php-endpoint
# Some stubs repeat the same hex-tracked destination through multiple browser
# navigation mechanisms. This detects redundant navigation, not a three-hop
# redirect chain; the URL and small page provide the phishing hand-off context.
- id: web-kit-hex-tracked-multi-navigation-stub
  for: [html]
  desc: Hex-tracked target uses three browser navigation mechanisms
  crit: hostile
  conf: 0.93
  size_max: 2048
  all:
  - id: micro-behaviors/ui/window/navigation::browser-meta-refresh-instant-relative-url
  - id: micro-behaviors/ui/window/navigation::browser-location-replace
  - id: micro-behaviors/ui/window/navigation::window-variable-location-assignment
  - id: micro-behaviors/communications/url/query::token-key-long-hex-value
# Static prefilled-identity harvest: the page ships its victim's email
# address visibly preset in a text input beside a live password field and
# POSTs both to a same-directory PHP receiver. Remember-me fills the
# visitor's own address at runtime; a kit ships its target's, and
# legitimate logins submit to routed endpoints rather than sibling
# scripts, so the receiver leg carries the conviction.
- id: prefilled-email-relative-php-harvest
  for: [html]
  desc: Prefilled email posts password to relative PHP
  crit: hostile
  conf: 0.95
  all:
  - id: micro-behaviors/ui/controls/input::email-valued-input
  - id: micro-behaviors/ui/controls/credential::html-password-input-tag
  - id: micro-behaviors/communications/http/post::html-form-post-method
  - id: micro-behaviors/communications/http/form::relative-php-form-action
# Space-blocking collection: a keypress guard rejecting char 32 sits on a
# text input in a form POSTing to a same-directory PHP receiver. Ordinary
# text welcomes spaces; only card and banking fields filter them, so the
# guard plus the inputs plus the sibling-script receiver is a payment
# collection even when field names are gibberish.
- id: nospace-collection-relative-php-harvest
  for: [html]
  desc: Space-blocking field posts to relative PHP
  crit: hostile
  conf: 0.94
  all:
  - id: micro-behaviors/hardware/input/event::nospace-keypress-field-guard
  - id: micro-behaviors/ui/controls/input::text-input-tag
  - id: micro-behaviors/communications/http/post::html-form-post-method
  - id: micro-behaviors/communications/http/form::relative-php-form-action
