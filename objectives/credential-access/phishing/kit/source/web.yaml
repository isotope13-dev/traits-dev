defaults:
  platforms: [unix, windows]
  for: [html, php, javascript]
  attack: T1566.002
  mbc: B0030
traits:
- id: php-ip-logger-include
  desc: PHP include of IP-logging sidecar script
  crit: component
  conf: 0.8
  for: [php]
  if:
    type: string_literal
    regex: (?i)\bip\b.{0,20}\.php
- id: php-login-redirect
  desc: PHP header redirect to login page
  crit: notable
  conf: 0.75
  for: [php]
  if:
    type: string_literal
    regex: (?i)Location:\s*login\.(html|php)
- id: php-mock-fixture
  desc: PHP mock fixture basename
  crit: notable
  conf: 0.8
  for: [php]
  if:
    type: path
    basename: true
    exact: mock.php
- id: php-post-file-write-flow
  desc: PHP POST data written with fwrite
  crit: notable
  conf: 0.86
  for: [php]
  if:
    type: text
    regex: '\$_POST.{0,120}fwrite\s*\('
- id: php-post-file-write-flow-fputs
  desc: PHP POST data written with fputs
  crit: notable
  conf: 0.86
  for: [php]
  if:
    type: text
    regex: '\$_POST.{0,120}fputs\s*\('
- id: php-post-file-write-flow-put-contents
  desc: PHP POST data written with file_put_contents
  crit: notable
  conf: 0.86
  for: [php]
  if:
    type: text
    regex: '\$_POST.{0,120}file_put_contents\s*\('
- id: php-post-file-write-flow-open
  desc: PHP POST data followed by writable fopen
  crit: notable
  conf: 0.84
  for: [php]
  if:
    type: text
    regex: '\$_POST.{0,120}fopen\s*\(.{0,80},\s*["''][wa]'
- id: paypal-obfuscated-brand-text
  desc: PayPal brand HTML entities
  crit: notable
  conf: 0.9
  for: [php, html]
  if:
    type: text
    substr: "&#80;&#97;y&#80;&#97;l"
composite_rules:
- id: php-credential-exfiltration
  for: [php]
  desc: PHP script writing POST data to local file
  crit: suspicious
  conf: 0.85
  all:
  - id: micro-behaviors/communications/http/request/superglobal::post-dup
  any:
  - id: php-post-file-write-flow
  - id: php-post-file-write-flow-fputs
  - id: php-post-file-write-flow-put-contents
  - id: php-post-file-write-flow-open
  unless:
  - id: php-mock-fixture
  - id: metadata/build/generated::php-manual-empty-function-stubs
  - id: metadata/package/testing/
  - id: well-known/lib/web/wordpress-core::wordpress-core-package-doc
  - id: well-known/lib/web/wordpress-core::wordpress-core-include-bootstrap
  - id: well-known/lib/web/wordpress-core::wordpress-phpunit-test-case
  - id: well-known/lib/web/wordpress-core::wordpress-core-api-symbols
  - id: metadata/lang/source::yara-rule-source
  - id: well-known/tool/detection/security-scanner::anteumbra-package-tree-member
- id: web-phishing-kit-redirect
  for: [javascript, html]
  desc: Phishing kit with credit card capture and redirect
  crit: hostile
  conf: 0.95
  all:
  - id: micro-behaviors/ui/window/navigation::browser-meta-refresh-external-url
  - id: objectives/credential-access/financial/credit-card/form-field::cvv-field
- id: web-phishing-kit-exfil
  for: [php]
  desc: Phishing kit with credit card capture and PHP exfiltration
  crit: hostile
  conf: 0.95
  all:
  - id: php-credential-exfiltration
  - id: objectives/credential-access/financial/credit-card/form-field::cvv-field
- id: php-paypal-card-phishing-form
  for: [php, html]
  desc: PayPal card and 3DS phishing form
  crit: hostile
  conf: 0.98
  # Obfuscated PayPal branding beside a card-number and a CVV field is the
  # conviction; the step-up/bank half only corroborates, so it sits in `any:`.
  # It was an `all:` leg back when `three-ds-password-field` matched a bare
  # `type="password"` and every kit therefore satisfied it. That atom now means
  # an actual 3-D Secure field name, and the generic password input joins it
  # here under its own micro-behavior instead of being smuggled in as 3DS.
  all:
  - id: paypal-obfuscated-brand-text
  - id: objectives/credential-access/phishing/credential::card-number-input-field
  - id: objectives/credential-access/phishing/credential::cvv-input-field
  any:
  - id: objectives/credential-access/phishing/credential::three-ds-password-field
  - id: micro-behaviors/ui/window/password-field::password-input-field
  - id: objectives/credential-access/phishing/credential::bank-account-sort-code-field
  - id: objectives/credential-access/phishing/credential::bank-account-number-field
  - id: micro-behaviors/communications/http/request/client::post-method-text
- id: php-paypal-session-logged-card-phish
  for: [php]
  desc: PayPal card phish with session-hashed logging
  crit: hostile
  conf: 0.97
  all:
  - id: php-paypal-card-phishing-form
  - id: micro-behaviors/communications/http/url/php-endpoint::php-log
  - id: micro-behaviors/communications/http/request/superglobal::session
- id: php-phishing-kit-entry
  for: [php]
  desc: Phishing kit entry page logs IP then redirects to login
  crit: suspicious
  conf: 0.9
  all:
  - id: php-ip-logger-include
  - id: php-login-redirect
- id: php-labeled-credential-harvest
  for: [php]
  desc: PHP writes labeled social media credentials to file
  crit: hostile
  conf: 0.95
  all:
  - id: objectives/credential-access/phishing/credential::php-credential-label-account
  - id: objectives/credential-access/phishing/credential::php-credential-label-pass
  - id: php-credential-exfiltration
- id: php-social-media-phishing-kit
  desc: PHP social media credential phishing kit
  crit: suspicious
  conf: 0.97
  any:
  - id: php-labeled-credential-harvest
  - id: php-phishing-kit-entry
