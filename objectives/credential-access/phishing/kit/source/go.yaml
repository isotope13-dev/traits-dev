# Credential phishing backend - Go
# Detects Go HTTP services that accept a submitted login payload and relay it,
# with browser device fields, to a chat bot or webhook. Server-side counterpart
# to the browser harvest rules; a login-notification service without device
# fields or a chat relay does not match.
defaults:
  platforms: [windows, unix]
  for: [go]
  attack: T1056.002,T1041

traits:
  - id: go-login-device-screen-report
    desc: Login payload reports device screen dimensions
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '"screen"[\s\S]{0,160}"width"'

composite_rules:
  - id: go-login-chat-relay-phishing
    desc: Go login handler relays device data to a chat bot
    crit: hostile
    conf: 0.95
    all:
      - id: metadata/lang/source/syntax/credential-field::password-field-name
      - id: micro-behaviors/communications/http/server/listener::http-server-type
      - id: go-login-device-screen-report
    any:
      - id: micro-behaviors/communications/http/services/telegram::go-telegram-sendmessage-client
      - id: micro-behaviors/communications/http/webhook::discord-webhook-environment-variable
