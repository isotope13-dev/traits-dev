# Image-slice harvest pages: pixel-placed credential inputs overlaid on
# page imagery, a prefilled victim address, and a same-directory PHP
# receiver. Ordinary positioned layouts place the form, not each
# credential control; the overlay plus the preset identity plus the
# sibling-script receiver is the sliced-phish-kit shape. The prefilled
# twin without the overlay lives in web.yaml beside the other
# receiver-gated harvest rules.
defaults:
  platforms: [unix, windows]
  for: [html]
  attack: T1566.002
  mbc: B0030

composite_rules:
  - id: positioned-prefilled-credential-harvest
    desc: Positioned inputs harvest prefilled credentials
    crit: hostile
    conf: 0.95
    all:
      - id: micro-behaviors/ui/controls/credential::positioned-credential-input
      - id: micro-behaviors/ui/controls/input::email-valued-input
      - id: micro-behaviors/communications/http/post::html-form-post-method
      - id: micro-behaviors/communications/http/form::relative-php-form-action
