# JXA Credential Stealer Detection
# Detects JXA scripts that phish for passwords and validate them
# ATT&CK: T1056.002 (GUI Input Capture), T1552 (Unsecured Credentials)
defaults:
  platforms: [macos]
  for: [javascript]
composite_rules:
  - id: jxa-phishing-stealer
    desc: "JXA script phishing for credentials and validating them"
    crit: hostile
    conf: 1.0
    attack: "T1056.002"
    mbc: "B0032" # Obfuscation/UI
    all:
      - id: micro-behaviors/ui/dialog/apple::jxa-password-prompt
      - id: micro-behaviors/os/security/auth/verify::dscl-authonly-argv
    any:
      - id: metadata/lang/source/naming/variable::objc-import
      - id: micro-behaviors/os/application/control::app-current-app
