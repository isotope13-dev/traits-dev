# Banking-login harvest pages: a bank routing-code field beside a password
# input posting to a relative receiver. Legitimate bank logins submit to
# routed or absolute endpoints and name their own brand domain; a page that
# pairs account-routing material (sort code, Bankleitzahl) with a password
# POST into a same-directory script is the shared-hosting kit shape, the
# same conviction the Kerio mail.php rule makes for webmail kits.
defaults:
  platforms: [unix, windows]
  for: [html]
  attack: T1566.002
  mbc: B0030

composite_rules:
  - id: bank-code-credential-harvest
    desc: Bank-code login posts password to relative PHP
    crit: hostile
    conf: 0.96
    all:
      - id: micro-behaviors/ui/window/banking-field::german-bank-code-input
      - id: micro-behaviors/ui/controls/credential::html-password-input-tag
      - id: micro-behaviors/communications/http/post::html-form-post-method
      - id: micro-behaviors/communications/http/form::relative-php-form-action
