defaults:
  for: [text]
  platforms: [windows, macos, linux]

traits:
  - id: encoded-office-login-field
    desc: Encoded phishing kit login field
    crit: notable
    if:
      type: encoded
      encoding: base64
      substr: 'input%5Bname%3Dlogncovid%5D'

  - id: encoded-office-check-passy
    desc: Encoded password check function
    crit: notable
    if:
      type: encoded
      encoding: base64
      substr: 'checkPassy%28%29'

composite_rules:
  - id: encoded-office-credential-page
    desc: Encoded phishing kit login and password check
    crit: hostile
    all:
      - id: encoded-office-login-field
      - id: encoded-office-check-passy
