defaults:
  platforms: [android]
  for: [android_apk, zip]
  crit: notable
  conf: 0.88
  attack: T1566
traits:
  - id: capacitor-config-json
    desc: Capacitor app config bundled
    conf: 0.9
    if:
      type: text
      substr: "assets/capacitor.config.json"
composite_rules:
  - id: bundled-bank-phish-apk
    desc: APK bundles staged bank phishing workflow
    crit: hostile
    conf: 0.995
    mbc: "B0006"
    all:
      - id: capacitor-config-json
      - id: objectives/credential-access/phishing/webview-wrapper::staged-phish-pages
      - id: objectives/credential-access/phishing/webview-wrapper::next-static-phish-bundle
    any:
      - id: objectives/credential-access/phishing/webview-wrapper::fake-captcha-asset
      - id: objectives/credential-access/phishing/webview-wrapper::fake-trust-seal
  - id: obfuscated-accessibility-lure-apk
    desc: Obfuscated APK bundles accessibility lure
    crit: hostile
    conf: 0.98
    all:
      - id: objectives/credential-access/phishing/webview-wrapper::accessibility-enable-asset
      - id: objectives/anti-static/pack/archive::apk-obfuscated-resource-pack
    any:
      - id: metadata/package/files/mobile-package::apk-okhttp-publicsuffix-data
      - id: metadata/package/files/mobile-package::apk-secondary-dex
  - id: android-accessibility-abuse-lure-apk
    desc: Android accessibility abuse lure APK
    crit: suspicious
    conf: 0.96
    all:
      - id: micro-behaviors/hardware/input/accessibility::android-accessibility-surface-references
      - id: objectives/credential-access/phishing/webview-wrapper::android-abuse-lure-resource
    any:
      - id: metadata/package/files/mobile-package::apk-secondary-dex
      - id: metadata/package/files/mobile-package::apk-multiple-secondary-dex
  - id: android-social-bank-lure-artwork-apk
    desc: Android APK bundles social and bank lure artwork
    crit: suspicious
    conf: 0.95
    all:
      - id: metadata/package/files/mobile-package::android-apk-archive-layout
      - id: metadata/package/files/mobile-package::apk-secondary-dex
      - id: objectives/credential-access/phishing/webview-wrapper::android-social-brand-artwork
      - id: objectives/credential-access/phishing/webview-wrapper::android-bank-brand-artwork
  - id: android-accessibility-transaction-capture-dex
    for: [android_apk, zip, dex, xml]
    desc: Android accessibility, screen capture, and transaction protocol
    crit: suspicious
    conf: 0.99
    all:
      - id: metadata/binary/symbols/descriptor::android-accessibility-service-descriptor
      - id: micro-behaviors/hardware/display/stream::android-media-projection-manager
      - id: objectives/command-and-control/backdoor/rat/remote-agent::android-transaction-control-protocol
