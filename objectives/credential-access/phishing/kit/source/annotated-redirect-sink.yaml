# Kit-built web redirector sink: a hardcoded client-side navigation to
# an absolute URL whose sink line carries a Cyrillic operator note (the
# kit-builder "change the link here" annotation). Russian-language
# developers also comment their own redirects, so the note alone never
# convicts; lure context marks the kit-built landing.
defaults:
  platforms: [windows, unix]
  for: [html, javascript]
  attack: T1566.002
  mbc: B0030
traits:
  - id: operator-annotated-external-redirect-sink
    desc: Kit-annotated hardcoded external redirect sink
    crit: suspicious
    conf: 0.9
    if:
      type: text
      regex: '\bwindow\.location\s*=\s*[''"]https?://[^''"\r\n]{4,200}[''"]\s*;?.{0,200}[\x{400}-\x{4FF}]'
