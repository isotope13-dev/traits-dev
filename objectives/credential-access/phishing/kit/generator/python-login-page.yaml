# A Python phishing-kit generator keeps a login page as a format-string
# template: a password field, a script that posts the form to a placeholder
# collection endpoint, swallows any error so the victim sees nothing, and then
# sends the browser to a placeholder redirect URL. A real login page is served
# by the service it signs in to, reports failures, and has no
# caller-supplied collector.
defaults:
  platforms: [unix, windows]
  for: [python]
  attack: T1566.002,T1056.003
  mbc: B0030

traits:
  - id: password-input-in-string
    desc: Python string holds a password input tag
    crit: component
    conf: 0.85
    if:
      type: text
      regex: '(?i)<input[^>]{0,200}type\s*=\s*\W{0,3}password'

  - id: fetch-to-template-endpoint
    desc: Page script fetches a format-string endpoint
    crit: notable
    conf: 0.88
    if:
      type: text
      regex: 'fetch\(\s*["'']\{[a-z_]{3,24}\}["'']'

  - id: fetch-error-swallowed
    desc: Page script silently swallows request errors
    crit: component
    conf: 0.85
    if:
      type: text
      regex: '\.catch\(\s*\(\)\s*=>\s*\{\{?\s*\}\}?\s*\)'

  - id: location-to-template-url
    desc: Page script redirects to a format-string URL
    crit: notable
    conf: 0.88
    if:
      type: text
      # An XML attribute (`<plugin location="{lib_path}">`) is no redirect.
      regex: '(<\w+\s[^>]{0,80})?\blocation(\.href)?\s*=\s*["'']\{[a-z_]{3,24}\}["'']'
    not:
      - regex: '^<'

composite_rules:
  - id: python-credential-page-generator
    desc: Python template posts password to a placeholder collector and redirects
    crit: hostile
    conf: 0.93
    near_lines: 40
    all:
      - id: password-input-in-string
      - id: fetch-to-template-endpoint
      - id: fetch-error-swallowed
      - id: location-to-template-url
