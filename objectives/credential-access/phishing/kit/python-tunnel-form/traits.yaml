# A local web app that asks for browser credentials, accepts them in a POST,
# and exposes the collector through a public tunnel is a credential phishing
# kit even when the remote tunnel service is legitimate.
defaults:
  platforms: [unix, windows]
  for: [python]
  crit: hostile
  conf: 0.98
  attack: T1056.003,T1041,T1566.002
  mbc: B0030

composite_rules:
  - id: tunneled-web-form-credential-collector
    desc: Publicly tunneled web app captures login credentials
    all:
      - id: micro-behaviors/ui/controls/credential::browser-password-input-marker
      - id: micro-behaviors/communications/http/server/request::extract-from-request-form
      - id: micro-behaviors/communications/http/server/request::python-route-post-method
      - id: well-known/lib/network/pypi-packages/pyngrok::pyngrok-import
    near_bytes: 18000
