# Moved to the canonical mechanism leaf.
defaults:
  platforms: [unix, windows]
  for: [html, javascript, typescript]
  attack: T1566.002
  mbc: B0030

traits:
- id: cloud-put-upload
  desc: Browser window.fetch PUT request
  crit: notable
  conf: 0.84
  if:
    type: text
    regex: \bwindow\.fetch\s*\([^)]{0,500}\bmethod\s*:\s*['"]PUT['"]

- id: mailbox-repair-lure--rx-10
  desc: Imperative mailbox or email repair lure
  crit: notable
  conf: 0.86
  if:
    type: literal
    regex: '(?i)\b(repair|sync)\s+(your\s+)?(mailbox|email|outlook)\b'
- id: mailbox-repair-lure--rx-11
  desc: "Matches 'health check'"
  crit: notable
  conf: 0.86
  if:
    type: text
    regex: (?i)(mailbox|email|outlook).{0,80}(spam filter|health check)
# The lure's own phrasing (UNC6692's "Configuration Management Panel",
# "mailbox configuration update"), not any 80-char span between "email" and
# "configuration" -- that matched Prism's `email:` grammar token next to a
# "conditional-configuration" key in optuna-dashboard's bundle.
- id: mailbox-repair-lure--rx-12
  desc: Mailbox configuration-update lure wording
  crit: notable
  conf: 0.86
  if:
    type: text
    regex: (?i)(mailbox|email|outlook) configuration (update|repair)|configuration management panel
composite_rules:
- id: cloud-credential-upload
  desc: Credential phishing cloud upload
  crit: hostile
  conf: 0.96
  near_lines: 160
  all:
  - id: credential-form-fields
  - id: cloud-put-upload
  any:
  - id: micro-behaviors/communications/http/services/aws-s3::aws-s3-browser-upload
  - id: micro-behaviors/communications/http/services/aws-s3::amazonaws-domain
  - id: micro-behaviors/communications/http/services/aws-s3::regional-bucket-domain
  - id: micro-behaviors/ui/window/notify::password-retry-feedback
  - id: mailbox-repair-lure
  needs: 2
- id: credential-form-fields
  desc: Email password form fields
  crit: component
  conf: 0.86
  near_lines: 80
  any:
  - id: micro-behaviors/ui/controls/credential::email-password-inputs
  - id: micro-behaviors/ui/controls/credential::password-then-email-inputs
- id: mailbox-repair-lure
  desc: Mailbox repair lure wording
  crit: component
  conf: 0.86
  any:
  - id: mailbox-repair-lure--rx-10
  - id: mailbox-repair-lure--rx-11
  - id: mailbox-repair-lure--rx-12
  not:
  - regex: "(?i)(if this wasn'?t you|didn'?t change your password).{0,180}(change your password|contact support|support team)"
  unless:
  - id: metadata/build/bundler/asset::js-large-module-bundle
  - id: well-known/lib/web/nextjs::next-server-build-path
  - id: well-known/tool/development/vscode-extension/vscode-marketplace::openchamber-vsix
  - id: well-known/tool/development/agent/kilocode::kilo-code-js-bundle
