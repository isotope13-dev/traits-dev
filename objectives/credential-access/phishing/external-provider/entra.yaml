# Rogue external authentication providers place a credential form inside a
# legitimate Entra sign-in flow, store the submitted password, and return a
# signed assertion claiming hardware-backed MFA. The Microsoft callback and
# Graph policy API are legitimate EAM surfaces, so hostile rules require the
# observable password-capture behavior as well.
defaults:
  platforms: [windows, unix]
  for: [scripts, source]
  attack: T1056.002,T1556
  mbc: B0030

composite_rules:
  - id: entra-external-auth-provider-implementation
    desc: Implements an Entra external OIDC authentication provider
    crit: notable
    conf: 0.99
    near_bytes: 12000
    all:
      - id: micro-behaviors/communications/http/idp::oidc-id-token-form-post-provider
      - id: micro-behaviors/communications/http/services/microsoft::entra-external-auth-callback

  - id: entra-external-auth-password-file-capture
    desc: Entra external authentication provider stores a submitted password
    crit: hostile
    conf: 0.99
    near_bytes: 16000
    all:
      - id: entra-external-auth-provider-implementation
      - id: micro-behaviors/ui/window/password-field::browser-password-input-marker
    any:
      - id: micro-behaviors/fs/write/credential::python-auth-variable-file-write
      - id: micro-behaviors/fs/write/credential::js-password-variable-file-write
      - id: micro-behaviors/fs/write/credential::go-password-variable-file-write
      - id: micro-behaviors/fs/write/credential::php-file-dumps-submitted-password

  - id: entra-external-auth-fabricated-hardware-mfa
    desc: Credential-capturing Entra provider signs a hardware-MFA assertion
    crit: hostile
    conf: 0.99
    near_bytes: 18000
    all:
      - id: entra-external-auth-password-file-capture
      - id: micro-behaviors/communications/http/jwt::jwt-hardware-mfa-claim-pair
      - id: micro-behaviors/data/encode/jwt::jwt-library-signing-call

  - id: entra-external-auth-credential-trap-deployment
    desc: Registers a credential-capturing Entra external authentication method
    crit: hostile
    conf: 0.99
    near_bytes: 24000
    all:
      - id: entra-external-auth-password-file-capture
      - id: micro-behaviors/communications/http/services/microsoft::graph-external-auth-method-registration
      - id: objectives/persistence/login/oauth::all-principals-consent
