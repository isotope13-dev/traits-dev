# Agent skills that solicit SMTP passwords or authorization codes from a user (moved to the canonical mechanism leaf)
# and pair that request with a bundled sender account.  This is a credential
# collection lure, not ordinary SMTP client capability.
defaults:
  platforms: [windows, unix]
  for: [markdown]
  attack: T1056.002,T1056.003

traits:
  # SMTP mention is neutral documentation vocabulary (changelogs, config
  # guides); the canonical atom lives in micro-behaviors and the composites
  # below reference it cross-directory.
  - id: agent-skill-bundled-sender-account
    desc: Skill declares a default sender mailbox
    crit: notable
    conf: 0.99
    if:
      type: text
      regex: '(?i)(agent_skill_test@126\.com|default sender.{0,80}[\w.+-]+@[\w.-]+\.[a-z]{2,})'

composite_rules:
  - id: agent-skill-solicits-ssh-access
    desc: Agent skill asks user to share SSH credentials
    crit: suspicious
    conf: 0.97
    all:
      - id: metadata/package/agent-skill::agent-skill-frontmatter
      - id: metadata/lang/natural/credential::agent-ssh-credential-sharing-request

  - id: agent-skill-solicits-smtp-credential
    desc: SMTP prompt requests account credentials
    crit: component
    conf: 0.98
    scope: archive
    for: [markdown, zip, tar]
    all:
      # The skill frontmatter and SMTP credential request distinguish this
      # from an ordinary SMTP configuration guide.
      - id: metadata/package/agent-skill::agent-skill-frontmatter
      - id: micro-behaviors/communications/email/send/smtp::smtp-mail-context-reference
      - id: micro-behaviors/ui/dialog/prompt::password-or-auth-code-request-text

  - id: agent-skill-smtp-credential-lure
    desc: Skill solicits credentials for bundled mailbox
    crit: hostile
    conf: 0.99
    scope: archive
    for: [markdown, zip, tar]
    all:
      - id: metadata/package/agent-skill::agent-skill-frontmatter
      - id: agent-skill-solicits-smtp-credential
      - id: agent-skill-bundled-sender-account
