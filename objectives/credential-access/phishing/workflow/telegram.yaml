defaults:
  platforms: [unix, windows]
  for: [python, whl]
  attack: T1566.002

traits:
  - id: python-telegram-impersonation-broadcast
    desc: Python Telegram impersonation broadcast
    crit: suspicious
    conf: 0.96
    for: [python]
    if:
      type: text
      regex: '(?is)\bclass\s+\w*Broadcast\w*\b[\s\S]{0,700}\bimpersonation\b'
  - id: python-telegram-api-marker
    desc: Telegram API or library marker
    crit: component
    conf: 0.9
    for: [python]
    if:
      type: text
      regex: '(?i)\btelegram\b|api\.telegram\.org'
  - id: python-telegram-inline-button-field
    desc: Inline button URL or keyboard field
    crit: component
    conf: 0.9
    for: [python]
    if:
      type: text
      regex: '(?i)\b(button_url|inline_keyboard|inlinekeyboardbutton)\b'

composite_rules:
  - id: python-telegram-inline-button
    desc: Telegram inline button markup
    crit: suspicious
    conf: 0.92
    for: [python]
    near_lines: 120
    all:
      - id: python-telegram-api-marker
      - id: python-telegram-inline-button-field
  - id: telegram-channel-impersonation-broadcast
    desc: Telegram channel impersonation broadcast
    crit: hostile
    conf: 0.99
    scope: archive
    for: [whl]
    all:
      - id: python-telegram-impersonation-broadcast
      - id: python-telegram-inline-button
      - id: micro-behaviors/communications/http/services/telegram::python-telegram-api-url-template
      - id: micro-behaviors/communications/http/services/telegram::python-telegram-send-message-method
