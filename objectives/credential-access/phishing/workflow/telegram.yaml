defaults:
  platforms: [unix, windows]
  for: [python, whl]
  attack: T1566.002

traits:
  - id: python-telegram-impersonation-broadcast
    desc: Python Telegram impersonation broadcast
    crit: suspicious
    conf: 0.96
    for: [python]
    if:
      type: text
      regex: '(?is)\bclass\s+\w*Broadcast\w*\b[\s\S]{0,700}\bimpersonation\b'
  - id: python-telegram-auth-button-label
    desc: Telegram auth-themed button label
    crit: component
    conf: 0.94
    for: [python]
    if:
      type: text
      regex: '(?is)\bInlineKeyboardButton\s*\([^)]{0,120}\b(login|password|token)\b'
  - id: python-telegram-secret-button-label
    desc: Telegram secret-themed button label
    crit: component
    conf: 0.94
    for: [python]
    if:
      type: text
      regex: '(?is)\bInlineKeyboardButton\s*\([^)]{0,120}\b(passcode|seed|wallet)\b'
  - id: python-telegram-verification-button-label
    desc: Telegram verification button label
    crit: component
    conf: 0.94
    for: [python]
    if:
      type: text
      regex: '(?is)\bInlineKeyboardButton\s*\([^)]{0,120}\bverification\b'

composite_rules:
  - id: python-telegram-inline-button
    desc: Telegram credential-themed inline button
    crit: suspicious
    conf: 0.95
    for: [python]
    all:
      - id: micro-behaviors/communications/http/services/telegram::python-telegram-inline-button-constructor
    any:
      - id: python-telegram-auth-button-label
      - id: python-telegram-secret-button-label
      - id: python-telegram-verification-button-label
    unless:
      - id: well-known/app/ai/coding-agent/vibego::telegram-remote-cli-context
  - id: telegram-channel-impersonation-broadcast
    desc: Telegram channel impersonation broadcast
    crit: hostile
    conf: 0.99
    scope: archive
    for: [whl]
    all:
      - id: python-telegram-impersonation-broadcast
      - id: python-telegram-inline-button
      - id: micro-behaviors/communications/http/services/telegram::python-telegram-api-url-template
      - id: micro-behaviors/communications/http/services/telegram::python-telegram-send-message-method
