# Browser support-scam worksheets combine victim financial details, remote-
# access session credentials, and operator-only fields. These matchers use form
# structure and score-generation code rather than visible lure prose or brands.
defaults:
  platforms: [windows, unix]
  for: [html, javascript, typescript, php]
  attack: T1566.002
  mbc: B0030

traits:
  - id: low-security-score-assignment
    desc: Assigns a low score range
    crit: component
    conf: 0.9
    if:
      type: text
      regex: '(?i)\b[A-Za-z_$][\w$]{0,30}score\w*\s*=\s*(1[0-9]|2[0-9]|30)\s*\+'

  - id: security-score-identifier
    desc: Names a browser security score
    crit: component
    conf: 0.9
    if:
      type: text
      regex: '(?i)\b\w*(health|security|scan|risk)\w*score\b'

  - id: bounded-random-score-term
    desc: Adds a bounded random score term
    crit: component
    conf: 0.9
    if:
      type: text
      regex: 'Math\.floor\(\s*Math\.random\(\)\s*\*\s*(1[0-9]|2[0-9])\s*\)'

  - id: deep-security-finding-kernel-isolation
    desc: Browser data names kernel-isolation status
    crit: component
    conf: 0.9
    if:
      type: text
      regex: '(?i)\b(id|key)\s*:\s*["'']kernel[-_](page[-_]table[-_]?)?isolation["'']'

  - id: deep-security-finding-rowhammer
    desc: Browser data names Rowhammer status
    crit: component
    conf: 0.95
    if:
      type: text
      regex: '(?i)\b(id|key)\s*:\s*["'']rowhammer[-_](memory|status)["'']'

  - id: deep-security-finding-tpm
    desc: Browser result data names TPM presence status
    crit: component
    conf: 0.88
    if:
      type: text
      regex: '(?i)\b(id|key)\s*:\s*["''](tpm|trusted[-_]platform[-_]module)[-_](presence|status)["'']'

  - id: deep-security-finding-browser-sandbox
    desc: Browser result data names browser-sandbox status
    crit: component
    conf: 0.88
    if:
      type: text
      regex: '(?i)\b(id|key)\s*:\s*["'']browser[-_]sandbox["'']'

  - id: remote-session-record-id-read
    desc: Reads remote-session ID from form record
    crit: component
    conf: 0.92
    if:
      type: text
      regex: '(?i)\b[A-Za-z_$][\w$]*\.remote(access)?[-_]?(id|code)\b'

  - id: remote-session-record-secret-read
    desc: Reads remote-session secret from form record
    crit: component
    conf: 0.92
    if:
      type: text
      regex: '(?i)\b[A-Za-z_$][\w$]*\.remote(access)?[-_]?(password|passcode|secret)\b'

  - id: refund-amount-record-read
    desc: Reads refund amount from form record
    crit: component
    conf: 0.92
    if:
      type: text
      regex: '(?i)\b[A-Za-z_$][\w$]*\.refund[-_]?amount\b'

  - id: bank-name-record-read
    desc: Reads bank name from form record
    crit: component
    conf: 0.92
    if:
      type: text
      regex: '(?i)\b[A-Za-z_$][\w$]*\.bank[-_]?name\b'

  - id: crypto-account-record-read
    desc: Reads cryptocurrency account from form record
    crit: component
    conf: 0.92
    if:
      type: text
      regex: '(?i)\b[A-Za-z_$][\w$]*\.crypto[-_]?(user(name)?|account|wallet)\b'

composite_rules:
  - id: randomized-low-security-score
    desc: Generates a bounded low security score
    crit: suspicious
    conf: 0.94
    near_bytes: 180
    all:
      - id: low-security-score-assignment
      - id: bounded-random-score-term
      - id: security-score-identifier

  - id: remote-session-credential-record
    desc: Form record reads remote-session credentials
    crit: suspicious
    conf: 0.97
    near_bytes: 500
    all:
      - id: remote-session-record-id-read
      - id: remote-session-record-secret-read

  - id: refund-profile-record-read
    desc: Reads refund and financial form fields
    crit: suspicious
    conf: 0.96
    near_bytes: 500
    all:
      - id: refund-amount-record-read
      - id: bank-name-record-read
      - id: crypto-account-record-read

  - id: remote-support-session-credential-form
    desc: Browser form collects remote-session credentials
    crit: suspicious
    conf: 0.96
    near_bytes: 900
    all:
      - id: micro-behaviors/ui/window/form-input::remote-session-id-input
      - id: micro-behaviors/ui/window/form-input::remote-session-secret-input

  - id: support-agent-identity-form
    desc: Browser form includes support-agent identity fields
    crit: notable
    conf: 0.94
    near_bytes: 900
    all:
      - id: micro-behaviors/ui/window/form-input::support-agent-id-input
      - id: micro-behaviors/ui/window/form-input::support-agent-name-input

  - id: refund-bank-crypto-form
    desc: Browser refund form collects bank and cryptocurrency details
    crit: suspicious
    conf: 0.97
    near_bytes: 1200
    all:
      - id: micro-behaviors/ui/window/form-input::refund-amount-input
      - id: micro-behaviors/ui/window/form-input::bank-name-input
      - id: micro-behaviors/ui/window/form-input::crypto-account-input

  - id: deep-security-finding-catalog
    desc: Browser result data claims multiple deep host-security checks
    crit: suspicious
    conf: 0.96
    any:
      - id: deep-security-finding-kernel-isolation
      - id: deep-security-finding-rowhammer
      - id: deep-security-finding-tpm
      - id: deep-security-finding-browser-sandbox
    needs: 3

  - id: fabricated-browser-security-scan
    desc: Browser scan fabricates deep checks and forces a failing score
    crit: suspicious
    conf: 0.98
    near_bytes: 4096
    all:
      - id: randomized-low-security-score
      - id: deep-security-finding-catalog

  - id: operator-assisted-refund-scam-form
    desc: Refund worksheet combines remote credentials and operator fields
    crit: hostile
    conf: 0.99
    attack: T1566.002,T1056
    near_bytes: 4096
    all:
      - id: remote-support-session-credential-form
      - id: support-agent-identity-form
      - id: refund-bank-crypto-form
      - id: micro-behaviors/ui/window/form-input::antivirus-product-input

  - id: fake-security-refund-scam-workflow
    desc: Fabricated browser security scan leads to a refund-scam worksheet
    crit: hostile
    conf: 0.99
    attack: T1566.002,T1056
    near_bytes: 8192
    all:
      - id: fabricated-browser-security-scan
      - id: operator-assisted-refund-scam-form
