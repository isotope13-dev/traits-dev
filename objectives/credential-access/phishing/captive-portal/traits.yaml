defaults:
  platforms: [windows, unix]
  for: [html, javascript]
  conf: 0.96

traits:
  - id: external-form-action
    desc: HTML form has external action URL
    crit: notable
    for: [html]
    if:
      type: text
      regex: '<form\b[^>]{0,180}action\s*=\s*["'']https?://'

  - id: post-form-method
    desc: HTML form uses POST method
    crit: notable
    for: [html]
    if:
      type: text
      regex: '<form\b[^>]{0,180}method\s*=\s*["'']?post\b'

  - id: password-input-marker
    desc: Browser password input marker
    crit: notable
    for: [html]
    if:
      id: micro-behaviors/ui/window/form-input::browser-password-input-marker

  - id: username-input-marker
    desc: Browser username input marker
    crit: notable
    for: [html]
    if:
      type: text
      regex: '(?i)(type\s*=\s*["'']email["'']|\[name\s*=\s*["''](username|email)["''])'

  - id: html-formdata-constructor
    desc: HTML script constructs FormData
    crit: notable
    for: [html]
    if:
      type: text
      regex: '\b(new\s+)?FormData\s*\('

  - id: download-executable-link
    desc: Browser download names executable
    crit: notable
    if:
      type: text
      regex: '(?i)\bdownload\s*=\s*["''].{0,80}\.(exe|scr|com)["'']'

  - id: download-installer-link
    desc: Browser download names installer
    crit: notable
    if:
      type: text
      regex: '(?i)\bdownload\s*=\s*["''].{0,80}\.(msi|pkg|dmg)["'']'

  - id: download-command-link
    desc: Browser download names command script
    crit: notable
    if:
      type: text
      regex: '(?i)\bdownload\s*=\s*["''].{0,80}\.(bat|cmd|ps1)["'']'

  - id: download-wsh-link
    desc: Browser download names WSH script
    crit: notable
    if:
      type: text
      regex: '(?i)\bdownload\s*=\s*["''].{0,80}\.(vbs|hta)["'']'

  - id: download-archive-link
    desc: Browser download names archive
    crit: notable
    if:
      type: text
      regex: '(?i)\bdownload\s*=\s*["''].{0,80}\.(zip|7z|rar)["'']'

composite_rules:
  - id: captive-portal-redirect-after-probe
    desc: Redirects after connectivity probe
    crit: suspicious
    all:
      - id: micro-behaviors/communications/http/connectivity::connectivity-probe-url
    any:
      - id: micro-behaviors/ui/window/manage/dom::browser-location-assign
      - id: micro-behaviors/ui/window/manage/navigation::browser-location-replace
    near_lines: 80

  - id: external-login-form-action
    desc: Login form posts to external origin
    crit: notable
    for: [html]
    all:
      - id: external-form-action
      - id: post-form-method
    near_bytes: 240

  - id: portal-credential-field-pair
    desc: Portal page has username and password fields
    crit: notable
    for: [html]
    all:
      - id: password-input-marker
      - id: username-input-marker
    near_bytes: 700

  - id: credential-formdata-relay-js
    desc: JavaScript relays portal credentials
    crit: suspicious
    for: [javascript]
    all:
      - id: micro-behaviors/communications/http/request/client::js-fetch-call
      - id: portal-credential-field-pair
    any:
      - id: micro-behaviors/communications/http/post::formdata-class
      - id: micro-behaviors/data/encode/url::urlsearchparams-constructor
    near_bytes: 500

  - id: credential-formdata-relay-html
    desc: HTML script relays portal credentials
    crit: suspicious
    for: [html]
    all:
      - id: micro-behaviors/communications/http/request/html::html-fetch-call
      - id: html-formdata-constructor
      - id: portal-credential-field-pair
    near_bytes: 500

  - id: credential-formdata-relay
    desc: Relays portal credentials through browser request
    crit: suspicious
    any:
      - id: credential-formdata-relay-js
      - id: credential-formdata-relay-html

  - id: installer-download-link
    desc: Browser download names installer or script
    crit: notable
    any:
      - id: download-executable-link
      - id: download-installer-link
      - id: download-command-link
      - id: download-wsh-link
      - id: download-archive-link

  - id: captive-portal-credential-phish
    desc: Captive portal relays an external login form
    crit: hostile
    conf: 0.99
    all:
      - id: micro-behaviors/communications/http/connectivity::connectivity-probe-url
      - id: captive-portal-redirect-after-probe
      - id: portal-credential-field-pair
      - id: external-login-form-action
    near_lines: 120

  - id: captive-portal-credential-relay
    desc: Captive portal sends collected credentials
    crit: hostile
    conf: 0.99
    all:
      - id: micro-behaviors/communications/http/connectivity::connectivity-probe-url
      - id: captive-portal-redirect-after-probe
      - id: portal-credential-field-pair
      - id: credential-formdata-relay
    near_lines: 120

  - id: captive-portal-installer-delivery
    desc: Captive portal redirects to installer download
    crit: hostile
    conf: 0.99
    all:
      - id: captive-portal-redirect-after-probe
      - id: installer-download-link
    near_lines: 80
