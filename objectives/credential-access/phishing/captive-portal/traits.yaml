defaults:
  platforms: [windows, unix]
  # PHP- and TypeScript-backed pages can contain the same rendered form markup.
  for: [html, javascript, typescript, php]
  conf: 0.96

traits:
  # A form whose action is an absolute URL is neutral markup and now lives at
  # micro-behaviors/communications/http/request/html::html-form-external-action. It was
  # defined here as `external-form-action`, where the directory alone asserted
  # credential phishing for every newsletter signup, checkout, and search form,
  # and needed a per-site allowlist (payment processors, Mailchimp, a WordPress
  # plugin) to stay quiet. The composites below reference the neutral atom and
  # supply the credential evidence that makes it a login form.

  # A `<form method="post">` declaration is neutral transport markup and now
  # lives at micro-behaviors/communications/http/post::html-form-post-method;
  # the composites below reference it and add the portal context.

  # Constructing FormData is likewise neutral: the html spelling was a second
  # copy of micro-behaviors/communications/http/form::formdata-class, which now
  # covers html as well.

  # The login-form and credential-relay composites carried no captive-portal
  # evidence at all — no connectivity probe, nothing hotspot-specific — so they
  # asserted this attack setting for every off-origin login form. They now live
  # at objectives/credential-access/phishing/credential/external-form-relay.yaml
  # and are referenced below, where the probe legs supply the portal context.
  - id: download-executable-link
    desc: Browser download names executable
    crit: notable
    if:
      type: text
      regex: '(?i)\bdownload\s*=\s*["''].{0,80}\.(exe|scr|com)["'']'

  - id: download-installer-link
    desc: Browser download names installer
    crit: notable
    if:
      type: text
      regex: '(?i)\bdownload\s*=\s*["''].{0,80}\.(msi|pkg|dmg)["'']'

  - id: download-command-link
    desc: Browser download names command script
    crit: notable
    if:
      type: text
      regex: '(?i)\bdownload\s*=\s*["''].{0,80}\.(bat|cmd|ps1)["'']'

  - id: download-wsh-link
    desc: Browser download names WSH script
    crit: notable
    if:
      type: text
      regex: '(?i)\bdownload\s*=\s*["''].{0,80}\.(vbs|hta)["'']'

composite_rules:
  - id: connectivity-probe-near-navigation
    desc: Connectivity probe and browser navigation co-occur
    crit: suspicious
    # Keep the probe and navigation in one source file. Pooling across an
    # archive joins an extension's connectivity check to unrelated UI routes.
    scope: file
    for: [html, javascript, typescript]
    all:
      - id: micro-behaviors/communications/http/connectivity::connectivity-probe-url
    any:
      - id: micro-behaviors/ui/window/navigation::browser-location-assign
      - id: micro-behaviors/ui/window/navigation::browser-location-replace
    near_lines: 80
    # A minified bundle is a few very long lines, so the line window alone spans
    # the whole file: a dashboard's gstatic generate_204 latency-test URL and its
    # router's `location.assign` fallback sat 40 KB apart in one bundle.
    near_bytes: 1500
    unless:
      - id: well-known/dual-use/tunnel/metacubexd::metacubexd-dashboard-context
      - id: well-known/dual-use/tunnel/metacubexd::config-global
      - id: well-known/dual-use/tunnel/metacubexd::github-repo-path
      - id: well-known/dual-use/tunnel/metacubexd::mihomo-release-repo
      - id: well-known/dual-use/tunnel/metacubexd::html-title
      - id: micro-behaviors/communications/benchmark::speedtest

  - id: installer-download-link
    desc: Browser download names installer or script
    crit: notable
    any:
      - id: download-executable-link
      - id: download-installer-link
      - id: download-command-link
      - id: download-wsh-link
      - id: micro-behaviors/communications/http/download/browser::browser-compressed-archive-download-name

  - id: captive-portal-credential-phish
    for: [html]
    desc: Captive portal submits credentials to an absolute URL
    crit: hostile
    conf: 0.99
    all:
      - id: micro-behaviors/communications/http/connectivity::connectivity-probe-url
      - id: connectivity-probe-near-navigation
      - id: micro-behaviors/ui/controls/credential::browser-credential-field-pair
      - id: micro-behaviors/communications/http/form::browser-login-absolute-form-action
    near_lines: 120

  - id: captive-portal-credential-relay
    for: [javascript, html]
    desc: Captive portal sends collected credentials
    crit: hostile
    conf: 0.99
    all:
      - id: micro-behaviors/communications/http/connectivity::connectivity-probe-url
      - id: connectivity-probe-near-navigation
      - id: micro-behaviors/ui/controls/credential::browser-credential-field-pair
    any:
      - id: micro-behaviors/communications/http/form::browser-credential-absolute-fetch-js
      - id: micro-behaviors/communications/http/form::browser-credential-absolute-fetch-html
    near_lines: 120

  - id: captive-portal-installer-delivery
    for: [html, javascript, typescript]
    desc: Captive portal redirects to installer download
    crit: hostile
    conf: 0.99
    all:
      - id: connectivity-probe-near-navigation
      - id: installer-download-link
    near_lines: 80
