defaults:
  platforms: [windows, unix]
  # PHP- and TypeScript-backed pages can contain the same rendered form markup.
  for: [html, javascript, typescript, php]
  conf: 0.96

traits:
  # A form whose action is an absolute URL is neutral markup and now lives at
  # micro-behaviors/communications/http/request/html::html-form-external-action. It was
  # defined here as `external-form-action`, where the directory alone asserted
  # credential phishing for every newsletter signup, checkout, and search form,
  # and needed a per-site allowlist (payment processors, Mailchimp, a WordPress
  # plugin) to stay quiet. The composites below reference the neutral atom and
  # supply the credential evidence that makes it a login form.

  # A `<form method="post">` declaration is neutral transport markup and now
  # lives at micro-behaviors/communications/http/post::html-form-post-method;
  # the composites below reference it and add the portal context.
  - id: html-formdata-constructor
    desc: HTML script constructs FormData
    crit: notable
    for: [html]
    if:
      type: text
      regex: '\b(new\s+)?FormData\s*\('

  - id: download-executable-link
    desc: Browser download names executable
    crit: notable
    if:
      type: text
      regex: '(?i)\bdownload\s*=\s*["''].{0,80}\.(exe|scr|com)["'']'

  - id: download-installer-link
    desc: Browser download names installer
    crit: notable
    if:
      type: text
      regex: '(?i)\bdownload\s*=\s*["''].{0,80}\.(msi|pkg|dmg)["'']'

  - id: download-command-link
    desc: Browser download names command script
    crit: notable
    if:
      type: text
      regex: '(?i)\bdownload\s*=\s*["''].{0,80}\.(bat|cmd|ps1)["'']'

  - id: download-wsh-link
    desc: Browser download names WSH script
    crit: notable
    if:
      type: text
      regex: '(?i)\bdownload\s*=\s*["''].{0,80}\.(vbs|hta)["'']'

  - id: download-archive-link
    desc: Browser download names archive
    crit: notable
    if:
      type: text
      regex: '(?i)\bdownload\s*=\s*["''].{0,80}\.(zip|7z|rar)["'']'

composite_rules:
  - id: captive-portal-redirect-after-probe
    desc: Redirects after connectivity probe
    crit: suspicious
    scope: outer
    all:
      - id: micro-behaviors/communications/http/connectivity::connectivity-probe-url
    any:
      - id: micro-behaviors/ui/window/manage/dom::browser-location-assign
      - id: micro-behaviors/ui/window/manage/navigation::browser-location-replace
    near_lines: 80
    unless:
      - id: well-known/dual-use/tunnel/metacubexd::metacubexd-dashboard-context
      - id: well-known/dual-use/tunnel/metacubexd::config-global
      - id: well-known/dual-use/tunnel/metacubexd::github-repo-path
      - id: well-known/dual-use/tunnel/metacubexd::mihomo-release-repo
      - id: well-known/dual-use/tunnel/metacubexd::html-title
      - id: micro-behaviors/communications/benchmark/speedtest::speedtest

  # The password field is what makes this a *login* form: without it the two
  # markup legs matched any form that POSTs off-origin (newsletter subscribe,
  # checkout, site search), which is how ordinary WordPress plugins landed in
  # credential-access/phishing.
  - id: external-login-form-action
    desc: Login form posts to external origin
    crit: notable
    all:
      - id: micro-behaviors/communications/http/request/html::html-form-external-action
      - id: micro-behaviors/communications/http/post::html-form-post-method
      - id: micro-behaviors/ui/window/form-input::browser-password-input-marker
    near_bytes: 900

  - id: credential-formdata-relay-js
    desc: JavaScript relays portal credentials
    crit: suspicious
    for: [javascript]
    all:
      - id: micro-behaviors/communications/http/request/client::js-fetch-call
      - id: micro-behaviors/ui/window/form-input::browser-credential-field-pair
    any:
      - id: micro-behaviors/communications/http/post::formdata-class
      - id: micro-behaviors/data/encode/url::urlsearchparams-constructor
    near_bytes: 500

  - id: credential-formdata-relay-html
    desc: HTML script relays portal credentials
    crit: suspicious
    for: [html]
    all:
      - id: micro-behaviors/communications/http/request/html::html-fetch-call
      - id: html-formdata-constructor
      - id: micro-behaviors/ui/window/form-input::browser-credential-field-pair
    near_bytes: 500

  - id: credential-formdata-relay
    desc: Relays portal credentials through browser request
    crit: suspicious
    any:
      - id: credential-formdata-relay-js
      - id: credential-formdata-relay-html

  - id: installer-download-link
    desc: Browser download names installer or script
    crit: notable
    any:
      - id: download-executable-link
      - id: download-installer-link
      - id: download-command-link
      - id: download-wsh-link
      - id: download-archive-link

  - id: captive-portal-credential-phish
    desc: Captive portal relays an external login form
    crit: hostile
    conf: 0.99
    all:
      - id: micro-behaviors/communications/http/connectivity::connectivity-probe-url
      - id: captive-portal-redirect-after-probe
      - id: micro-behaviors/ui/window/form-input::browser-credential-field-pair
      - id: external-login-form-action
    near_lines: 120

  - id: captive-portal-credential-relay
    desc: Captive portal sends collected credentials
    crit: hostile
    conf: 0.99
    all:
      - id: micro-behaviors/communications/http/connectivity::connectivity-probe-url
      - id: captive-portal-redirect-after-probe
      - id: micro-behaviors/ui/window/form-input::browser-credential-field-pair
      - id: credential-formdata-relay
    near_lines: 120

  - id: external-form-credential-relay-redirect
    desc: External credential relay redirects to the provider
    crit: hostile
    conf: 0.99
    attack: T1056.002,T1041,T1566.002
    all:
      - id: external-login-form-action
      - id: credential-formdata-relay-html
      - id: micro-behaviors/communications/http/request/html::html-fetch-post-call
      - id: micro-behaviors/ui/window/manage/navigation::browser-location-replace
    near_lines: 180

  - id: captive-portal-installer-delivery
    desc: Captive portal redirects to installer download
    crit: hostile
    conf: 0.99
    all:
      - id: captive-portal-redirect-after-probe
      - id: installer-download-link
    near_lines: 80
