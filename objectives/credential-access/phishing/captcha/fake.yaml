defaults:
  platforms: [windows, unix]
  for:
    - javascript
    - typescript
    - html
traits:
  - id: cloudflare-ddos-protection-byline
    desc: Cloudflare DDoS protection byline
    crit: notable
    conf: 0.9
    if:
      type: text
      substr: DDoS protection by Cloudflare
  - id: security-check-heading
    desc: Security check heading in HTML
    crit: suspicious
    conf: 0.6
    if:
      type: text
      substr: <h1>Security Check</h1>
  - id: bot-check-element
    desc: Bot-widget marker fragment
    # `botCheck` is also used by legitimate in-app bot/help widgets.  It is
    # only phishing evidence when combined with verification UI and flow
    # markers in checkbox-verification-flow below.
    crit: notable
    conf: 0.6
    if:
      type: text
      substr: botCheck
  - id: verification-box-element
    desc: Verification box identifier fragment
    # A verification-box class is also used by legitimate KYC/account
    # verification widgets.  It is only a phishing component when combined
    # with the other fake-CAPTCHA flow markers below.
    crit: notable
    conf: 0.55
    if:
      type: text
      substr: verification-box
  - id: captcha-click-handler
    desc: CAPTCHA click opens redirect tab
    crit: notable
    conf: 0.92
    if:
      type: text
      substr: handleCaptchaClick

composite_rules:
  - id: captcha-click-window-open
    desc: CAPTCHA click opens redirect tab
    crit: suspicious
    conf: 0.92
    all:
      - id: captcha-click-handler
      - id: micro-behaviors/ui/window/navigation::browser-window-open-variable-blank
    near_bytes: 2500
  - id: cloudflare-turnstile-phishing-page
    desc: Cloudflare lure redirects despite CAPTCHA failure
    crit: hostile
    conf: 0.96
    mbc: B0021
    attack: T1204.001
    for:
    - html
    all:
    - id: micro-behaviors/ui/controls/captcha::cloudflare-branded-turnstile-navigation
    - id: micro-behaviors/ui/controls/captcha::turnstile-callback-handler
    - id: micro-behaviors/communications/http/url/query::js-urlsearchparams-construction
    - id: micro-behaviors/ui/window/navigation::urlsearchparams-query-forwarding-iteration
    - id: micro-behaviors/ui/controls/captcha::turnstile-unified-fallback-callbacks
    any:
    - id: micro-behaviors/communications/http/url/query::computed-target-url-params-call
    - id: micro-behaviors/ui/window/navigation::computed-window-target-url-call
    - id: micro-behaviors/data/control-flow/dispatch::window-double-bracket-call
    - id: micro-behaviors/ui/window/navigation::browser-location-replace
  - id: turnstile-keyval-deaddrop-redirect
    desc: Fake Turnstile page loads next hop from a KV dead drop
    crit: hostile
    conf: 0.96
    mbc: B0021
    attack: T1204.001,T1102
    for:
    - html
    - javascript
    all:
    - id: micro-behaviors/ui/controls/captcha::cloudflare-branded-turnstile-navigation
    - id: micro-behaviors/communications/http/services/file-hosting::keyval-api-host
    - id: micro-behaviors/ui/window/navigation::browser-location-replace
  - id: cloudflare-turnstile-click-redirect
    desc: Cloudflare Turnstile click redirect
    crit: hostile
    conf: 0.96
    mbc: B0021
    attack: T1204.001
    all:
    - id: micro-behaviors/ui/controls/captcha::cloudflare-branded-turnstile-navigation
    - id: captcha-click-window-open
  - id: fake-captcha-with-redirect
    desc: Fake CAPTCHA page with phishing redirect
    crit: hostile
    conf: 0.95
    mbc: B0021
    attack: T1204.001
    all:
      - id: micro-behaviors/ui/controls/captcha::not-a-robot-text
    any:
      - id: well-known/app/development/cloudflare::cloudflare-title-element
      - id: micro-behaviors/ui/controls/captcha::cloudflare-copyright-text
      - id: micro-behaviors/ui/controls/captcha::checking-browser-progress-text
      - id: security-check-heading
    needs: 2
  - id: recaptcha
    desc: Fake Google reCAPTCHA implementation
    crit: suspicious
    conf: 0.9
    mbc: B0021
    attack: T1204.001
    all:
      - id: micro-behaviors/ui/controls/captcha::not-a-robot-text
      - id: well-known/app/browser/google-web::google-recaptcha-checkbox-element
      - id: micro-behaviors/communications/http/services/google::google-recaptcha-url-reference
    unless:
      - id: metadata/build/bundler/asset::google-tag-manager-bundle
      - id: well-known/app/browser/google-web::google-recaptcha-api-loader
      - id: micro-behaviors/communications/http/services/google::google-recaptcha-api-script-url
      - id: well-known/app/browser/google-web::google-recaptcha-runtime
  - id: checkbox-verification-flow
    desc: Checkbox verification flow indicators
    crit: suspicious
    conf: 0.86
    needs: 3
    any:
      - id: bot-check-element
      - id: verification-box-element
      - id: micro-behaviors/ui/window/state::loading-spinner-identifier
      - id: micro-behaviors/ui/keywords::success-message-literal
  - id: fake-verification-deaddrop-redirect
    for: [javascript]
    desc: Fake verification redirects via GitHub deaddrop
    crit: hostile
    conf: 0.96
    mbc: B0021
    attack: T1204.001
    all:
      - id: checkbox-verification-flow
      - id: micro-behaviors/communications/http/download/github::github-raw-mutable-fetch
      - id: micro-behaviors/ui/window/navigation::browser-location-href-assign
  - id: browser-check-timer-absolute-redirect
    desc: Browser-check page timer redirects
    crit: hostile
    conf: 0.96
    mbc: B0021
    attack: T1204.001
    all:
      - id: micro-behaviors/ui/controls/captcha::just-a-moment-title
      - id: micro-behaviors/ui/controls/captcha::checking-browser-progress-text
      - id: micro-behaviors/ui/window/navigation::settimeout-string-absolute-location-redirect
  - id: cloudflare-byline-timer-redirect
    desc: Cloudflare byline page timer redirects
    crit: hostile
    conf: 0.96
    mbc: B0021
    attack: T1204.001
    all:
      - id: cloudflare-ddos-protection-byline
      - id: micro-behaviors/ui/controls/credential::browser-verification-status-text
      - id: micro-behaviors/ui/window/navigation::settimeout-string-absolute-location-redirect
