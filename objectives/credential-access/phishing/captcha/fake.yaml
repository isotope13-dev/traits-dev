defaults:
  platforms: [windows, unix]
  for:
    - javascript
    - typescript
    - html
traits:
  - id: spinner-i-element
    desc: Spinner UI element identifier
    crit: suspicious
    conf: 0.4
    if:
      type: text
      regex: '(^|[^A-Za-z0-9_-])spinner-i([^A-Za-z0-9_-]|$)'
  - id: vfclick-element
    desc: Verification click element identifier
    crit: suspicious
    conf: 0.5
    if:
      type: text
      substr: vfclick
  - id: not-a-robot-text
    desc: CAPTCHA "not a robot" checkbox text
    crit: notable
    conf: 0.6
    if:
      type: text
      regex: I('m|\s+am)\s+not\s+a\s+robot
      case_insensitive: true
  - id: turnstile-callback-handler
    desc: Turnstile completion callback handler
    crit: notable
    conf: 0.88
    if:
      type: text
      substr: function onTurnstileComplete
  - id: turnstile-error-callback-complete
    desc: Turnstile error callback uses completion handler
    crit: notable
    conf: 0.85
    if:
      type: text
      substr: data-error-callback="onTurnstileComplete"
  - id: turnstile-expired-callback-complete
    desc: Turnstile expired callback reuses completion
    crit: notable
    conf: 0.85
    if:
      type: text
      substr: data-expired-callback="onTurnstileComplete"
  - id: turnstile-error-callback-js-literal
    desc: Turnstile error callback in widget options
    crit: notable
    conf: 0.88
    if:
      type: text
      regex: '''error-callback''\s*:\s*function'
  - id: turnstile-expired-callback-js-literal
    desc: Turnstile expired callback in widget options
    crit: notable
    conf: 0.88
    if:
      type: text
      regex: '''expired-callback''\s*:\s*function'
  - id: turnstile-obfuscated-callback
    desc: Obfuscated Turnstile completion callback body
    crit: suspicious
    conf: 0.92
    if:
      type: text
      regex: 'function onTurnstileComplete[\s\S]{0,240}(function _0x|\(function\(_0x)'
  - id: checking-human-text
    desc: Challenge text checks for humanity
    crit: suspicious
    conf: 0.78
    if:
      type: text
      substr: Checking if you are human. This may take a few seconds.
  - id: review-security-connection-text
    desc: Review security of connection text
    crit: suspicious
    conf: 0.8
    if:
      type: text
      substr: review the security of your connection before proceeding
  - id: cloudflare-footer-branding
    desc: Cloudflare security footer branding
    crit: suspicious
    conf: 0.78
    if:
      type: text
      regex: Platform performance and security.{0,40}Cloudflare
  - id: cloudflare-ray-id
    desc: Cloudflare Ray ID marker
    crit: notable
    conf: 0.82
    if:
      type: text
      regex: Ray ID:\s*<code class=\"ray-id\">[a-z0-9]{12,20}</code>
  - id: fake-cloudflare-copyright
    desc: Fraudulent Cloudflare copyright notice
    crit: suspicious
    conf: 0.85
    if:
      type: text
      regex: "&copy;.{0,10}20[0-9]{2}.{0,10}Cloudflare"
  - id: security-check-heading
    desc: Security check heading in HTML
    crit: suspicious
    conf: 0.6
    if:
      type: text
      substr: <h1>Security Check</h1>
  - id: bot-check-element
    desc: Bot-widget marker fragment
    # `botCheck` is also used by legitimate in-app bot/help widgets.  It is
    # only phishing evidence when combined with verification UI and flow
    # markers in checkbox-verification-flow below.
    crit: notable
    conf: 0.6
    if:
      type: text
      substr: botCheck
  - id: verification-box-element
    desc: Verification box identifier fragment
    # A verification-box class is also used by legitimate KYC/account
    # verification widgets.  It is only a phishing component when combined
    # with the other fake-CAPTCHA flow markers below.
    crit: notable
    conf: 0.55
    if:
      type: text
      substr: verification-box
  - id: captcha-click-handler
    desc: CAPTCHA click opens redirect tab
    crit: notable
    conf: 0.92
    if:
      type: text
      substr: handleCaptchaClick
composite_rules:
  - id: captcha-click-window-open
    desc: CAPTCHA click opens redirect tab
    crit: suspicious
    conf: 0.92
    all:
      - id: captcha-click-handler
      - id: micro-behaviors/ui/window/navigation::browser-window-open-variable-blank
    near_bytes: 2500
  - id: turnstile-ui-elements
    desc: Cloudflare Turnstile UI elements present
    crit: suspicious
    conf: 0.6
    any:
      - id: spinner-i-element
      - id: vfclick-element
  - id: turnstile-verify-with-ui
    desc: Verify human text with UI
    crit: suspicious
    conf: 0.8
    all:
      - id: micro-behaviors/ui/controls/captcha::verify-human-text
      - id: turnstile-ui-elements
  - id: turnstile-error-fallback-callback
    desc: Turnstile error path wired to completion handler
    crit: component
    conf: 1.0
    any:
      - id: turnstile-error-callback-complete
      - id: turnstile-error-callback-js-literal
  - id: turnstile-expired-fallback-callback
    desc: Turnstile expiry path wired to completion handler
    crit: component
    conf: 1.0
    any:
      - id: turnstile-expired-callback-complete
      - id: turnstile-expired-callback-js-literal
  - id: turnstile-unified-fallback-callbacks
    desc: Turnstile failure callbacks reuse completion handler
    crit: suspicious
    conf: 0.9
    all:
      - id: turnstile-error-fallback-callback
      - id: turnstile-expired-fallback-callback
  - id: turnstile-post-challenge-navigation
    desc: Post-challenge browser navigation via open or replace
    crit: component
    conf: 1.0
    any:
      - id: micro-behaviors/ui/window/navigation::browser-window-open-variable-blank
      - id: micro-behaviors/ui/window/navigation::computed-location-replace

      - id: micro-behaviors/data/control-flow/dispatch::window-double-bracket-call
  - id: cloudflare-turnstile
    desc: Cloudflare Turnstile verification lure markers
    crit: suspicious
    conf: 0.95
    mbc: B0021
    attack: T1204.001
    any:
    - id: micro-behaviors/ui/controls/captcha::turnstile-verification-markers
    - id: turnstile-verify-with-ui
    all:
    - id: turnstile-post-challenge-navigation
  - id: cloudflare-turnstile-camouflaged
    desc: Cloudflare Turnstile lure with explicit Cloudflare branding
    crit: suspicious
    conf: 0.92
    all:
      - id: cloudflare-turnstile
    any:
      - id: well-known/app/development/cloudflare::cloudflare-title-element
      - id: micro-behaviors/communications/http/services/cloudflare::turnstile-integration-url
      - id: micro-behaviors/communications/http/services/cloudflare::turnstile-challenge-api-script
  - id: cloudflare-turnstile-phishing-page
    desc: Fake Cloudflare Turnstile page redirects after challenge
    crit: hostile
    conf: 0.96
    mbc: B0021
    attack: T1204.001
    for: [html]
    all:
      - id: cloudflare-turnstile-camouflaged
      - id: turnstile-callback-handler
      - id: micro-behaviors/ui/window/navigation::obfuscated-query-navigation
      - id: turnstile-unified-fallback-callbacks
  - id: cloudflare-turnstile-query-redirect
    desc: Obfuscated Turnstile callback redirects with query data
    crit: hostile
    conf: 0.97
    mbc: B0021
    attack: T1204.001
    for: [html]
    all:
      - id: cloudflare-turnstile-camouflaged
      - id: turnstile-obfuscated-callback
      - id: micro-behaviors/ui/window/navigation::obfuscated-query-navigation
  - id: turnstile-keyval-deaddrop-redirect
    desc: Fake Turnstile page loads next hop from a KV dead drop
    crit: hostile
    conf: 0.96
    mbc: B0021
    attack: T1204.001,T1102
    for: [html, javascript]
    all:
      - id: cloudflare-turnstile-camouflaged
      - id: micro-behaviors/communications/http/services/file-hosting::keyval-api-host
      - id: micro-behaviors/ui/window/navigation::browser-location-replace
  - id: cloudflare-turnstile-click-redirect
    desc: Cloudflare Turnstile click redirect
    crit: hostile
    conf: 0.96
    mbc: B0021
    attack: T1204.001
    all:
      - id: cloudflare-turnstile-camouflaged
      - id: captcha-click-window-open
  - id: cloudflare-style-verification-page
    desc: Cloudflare styled human verification page
    crit: suspicious
    conf: 0.94
    any:
      - id: micro-behaviors/ui/controls/captcha::verify-human-text
      - id: checking-human-text
      - id: review-security-connection-text
      - id: micro-behaviors/ui/controls/captcha::just-a-moment-title
      - id: cloudflare-footer-branding
      - id: cloudflare-ray-id
    needs: 4
  - id: fake-captcha-with-redirect
    desc: Fake CAPTCHA page with phishing redirect
    crit: hostile
    conf: 0.95
    mbc: B0021
    attack: T1204.001
    all:
      - id: not-a-robot-text
    any:
      - id: well-known/app/development/cloudflare::cloudflare-title-element
      - id: fake-cloudflare-copyright
      - id: micro-behaviors/ui/controls/credential::checking-browser-progress-text
      - id: security-check-heading
    needs: 2
  - id: recaptcha
    desc: Fake Google reCAPTCHA implementation
    crit: suspicious
    conf: 0.9
    mbc: B0021
    attack: T1204.001
    all:
      - id: not-a-robot-text
      - id: well-known/app/browser/google-web::google-recaptcha-checkbox-element
      - id: micro-behaviors/communications/http/services/google::google-recaptcha-url-reference
    unless:
      - id: metadata/build/bundler/asset::google-tag-manager-bundle
      - id: well-known/app/browser/google-web::google-recaptcha-api-loader
      - id: micro-behaviors/communications/http/services/google::google-recaptcha-api-script-url
      - id: well-known/app/browser/google-web::google-recaptcha-runtime
  - id: checkbox-verification-flow
    desc: Checkbox verification flow indicators
    crit: suspicious
    conf: 0.86
    needs: 3
    any:
      - id: bot-check-element
      - id: verification-box-element
      - id: micro-behaviors/ui/window/state::loading-spinner-identifier
      - id: micro-behaviors/ui/keywords::success-message-literal
  - id: fake-verification-deaddrop-redirect
    for: [javascript]
    desc: Fake verification redirects via GitHub deaddrop
    crit: hostile
    conf: 0.96
    mbc: B0021
    attack: T1204.001
    all:
      - id: checkbox-verification-flow
      - id: micro-behaviors/communications/http/download/github::github-raw-mutable-fetch
      - id: micro-behaviors/ui/window/navigation::browser-location-href-assign
