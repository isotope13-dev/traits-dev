# A "Verify you are human" prompt drawn as a full-viewport overlay that also
# carries a timer-driven redirect. A real CAPTCHA widget verifies in place and
# hands a token back to the page; it does not cover the site and then push the
# visitor to another host on a countdown. This is the traffic-distribution
# (Help TDS / Hotejka style) lure dropped into compromised sites. Keyed on the
# prompt + overlay + delayed redirect, not on any wording beyond the prompt or
# any campaign domain.
defaults:
  platforms: [windows, unix]
  for: [html, php, javascript]
  attack: T1204.001
  mbc: B0021

composite_rules:
  - id: fake-captcha-overlay-timed-redirect
    desc: Verify-human overlay auto-redirects the visitor from a timer
    crit: hostile
    conf: 0.9
    near_bytes: 2500
    all:
      - id: micro-behaviors/ui/window/dom/render::fixed-fullscreen-high-z-overlay-style
      - id: micro-behaviors/ui/window/navigation::browser-timer-delayed-location-redirect
      - id: micro-behaviors/ui/controls/captcha::verify-human-text
