defaults:
  platforms: [windows, unix]
  for: [html, javascript, typescript, php]

# The article's embedded FakeCaptchaVerification rule describes a page that
# presents one verification surface while carrying separate JavaScript and
# no-JavaScript flows. These atoms match DOM structure, not comments or prose.
traits:
  - id: hidden-nojs-link
    desc: Anchor with HTML hidden attribute
    crit: component
    conf: 0.9
    if:
      type: text
      regex: '(?i)<a\b[^>]{0,80}\shidden(\s|=|>)[^>]{0,80}\bhref\s*=\s*["'']'

  - id: challenge-container-tag
    desc: Challenge container tag
    crit: notable
    conf: 0.84
    if:
      type: text
      # Require a challenge-related token in an id/class attribute.  A bare
      # substring also matches ordinary UI labels such as collapseVerification.
      regex: '(?i)<[^>]{0,40}(id|class)\s*=\s*["''][^"''>]{0,24}\bchallenge-container\b'

  - id: captcha-container-tag
    desc: CAPTCHA container tag
    crit: notable
    conf: 0.84
    if:
      type: text
      regex: '(?i)<[^>]{0,40}(id|class)\s*=\s*["''][^"''>]{0,24}\bcaptcha-container\b'

  - id: verification-container-tag
    desc: Verification container tag
    crit: notable
    conf: 0.84
    if:
      type: text
      regex: '(?i)<[^>]{0,40}(id|class)\s*=\s*["''][^"''>]{0,24}\bverification-container\b'

  - id: hidden-js-form
    desc: Hidden JavaScript form
    crit: notable
    conf: 0.9
    if:
      type: text
      # HTML hidden attribute for no-JS fallback, not CSS-hidden admin panels.
      regex: '(?i)<form\b[^>]{0,80}\bhidden(\s|=|>)'

  - id: webdriver-field
    desc: Webdriver detection field
    crit: suspicious
    conf: 0.9
    if:
      type: text
      regex: '(?i)<input\b[^>]{0,80}\bname\s*=\s*["'']webdriver["'']'

  - id: automation-field
    desc: Automation detection field
    crit: suspicious
    conf: 0.9
    if:
      type: text
      regex: '(?i)<input\b[^>]{0,80}\bname\s*=\s*["'']automation["'']'

  - id: bot-score-field
    desc: Bot score field
    crit: suspicious
    conf: 0.9
    if:
      type: text
      regex: '(?i)<input\b[^>]{0,80}\bname\s*=\s*["'']bot[-_]score["'']'

  - id: honeypot-name
    desc: Honeypot field name
    crit: notable
    conf: 0.86
    if:
      type: text
      regex: '(?i)<input\b[^>]{0,80}\bname\s*=\s*["''](website|homepage|url)["'']'

  - id: negative-tabindex-input
    desc: Input removed from the keyboard tab order
    crit: component
    conf: 0.84
    if:
      type: text
      regex: '(?i)<input\b[^>]{0,80}\btabindex\s*=\s*["'']-1["'']'

  - id: aria-hidden-input
    desc: Aria-hidden input
    crit: notable
    conf: 0.84
    if:
      type: text
      regex: '(?i)<input\b[^>]{0,80}\baria-hidden\s*=\s*["'']?true'

  - id: hidden-style-input
    desc: Display-hidden input
    crit: notable
    conf: 0.84
    if:
      type: text
      regex: '(?i)<input\b(?![^>]{0,120}\btype\s*=\s*["'']?hidden)[^>]{0,120}display\s*:\s*none'

  - id: noscript-fallback-form
    desc: No-JavaScript form fallback
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?is)<noscript\b.{0,500}<form\b'

composite_rules:
  - id: verification-container-label
    desc: Verification container label
    crit: notable
    conf: 0.86
    any:
      - id: challenge-container-tag
      - id: captcha-container-tag
      - id: verification-container-tag

  - id: visible-verification-area
    desc: Visible challenge container
    crit: notable
    conf: 0.9
    all:
      - id: verification-container-label
      - id: micro-behaviors/data/format/html::aria-visible
    near_bytes: 220

  - id: bot-detection-fields
    desc: Multiple browser automation fields
    crit: suspicious
    conf: 0.92
    any:
      - id: webdriver-field
      - id: automation-field
      - id: bot-score-field
    needs: 2

  - id: hidden-honeypot-field
    desc: Hidden anti-automation honeypot
    crit: suspicious
    conf: 0.9
    all:
      - id: honeypot-name
    any:
      - id: negative-tabindex-input
      - id: aria-hidden-input
      - id: hidden-style-input
    near_bytes: 180

  - id: fake-captcha-structural-page
    desc: Fake CAPTCHA alternate-rendering page
    crit: hostile
    conf: 0.99
    all:
      - id: hidden-nojs-link
      - id: visible-verification-area
      - id: hidden-js-form
      - id: bot-detection-fields
      - id: hidden-honeypot-field
      - id: noscript-fallback-form

  - id: fake-captcha-credential-capture
    desc: Fake CAPTCHA credential capture form
    crit: hostile
    conf: 0.99
    all:
      - id: fake-captcha-structural-page
      - id: micro-behaviors/ui/window/form-input::browser-password-input-marker
      - id: micro-behaviors/ui/window/manage/dom::email-input-field
    near_bytes: 1800
