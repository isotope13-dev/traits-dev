defaults:
  platforms: [windows, unix]
  for: [html, javascript, typescript, php]

# The article's embedded FakeCaptchaVerification rule describes a page that
# presents one verification surface while carrying separate JavaScript and
# no-JavaScript flows. These atoms match DOM structure, not comments or prose.
traits:
  - id: webdriver-field
    desc: Webdriver detection field
    crit: suspicious
    conf: 0.9
    if:
      type: text
      regex: '(?i)<input\b[^>]{0,80}\bname\s*=\s*["'']webdriver["'']'

  - id: automation-field
    desc: Automation detection field
    crit: suspicious
    conf: 0.9
    if:
      type: text
      regex: '(?i)<input\b[^>]{0,80}\bname\s*=\s*["'']automation["'']'

  - id: bot-score-field
    desc: Bot score field
    crit: suspicious
    conf: 0.9
    if:
      type: text
      regex: '(?i)<input\b[^>]{0,80}\bname\s*=\s*["'']bot[-_]score["'']'

  # The field-name atom and the hidden-field capability live in
  # micro-behaviors/ui/window/form-input/. A honeypot is ordinary form
  # functionality; this objective uses it only as one leg of the complete
  # fake-verification page pattern below.
composite_rules:
  - id: bot-detection-fields
    desc: Multiple browser automation fields
    crit: suspicious
    conf: 0.92
    any:
      - id: webdriver-field
      - id: automation-field
      - id: bot-score-field
    needs: 2

  - id: fake-captcha-structural-page
    for: [javascript, html]
    desc: Fake CAPTCHA alternate-rendering page
    crit: hostile
    conf: 0.99
    all:
      - id: micro-behaviors/ui/window/visibility::hidden-anchor-with-href
      - id: micro-behaviors/ui/controls/captcha::visible-verification-area
      - id: micro-behaviors/data/format/html::form-hidden-attribute
      - id: bot-detection-fields
      - id: micro-behaviors/ui/window/hidden-input::url-field-with-concealed-input
      - id: micro-behaviors/ui/window/form-input::noscript-fallback-form

  - id: fake-captcha-credential-capture
    for: [javascript, html]
    desc: Fake CAPTCHA credential capture form
    crit: hostile
    conf: 0.99
    all:
      - id: fake-captcha-structural-page
      - id: micro-behaviors/ui/controls/credential::browser-password-input-marker
      - id: micro-behaviors/ui/window/username-field::email-input-field
    near_bytes: 1800
