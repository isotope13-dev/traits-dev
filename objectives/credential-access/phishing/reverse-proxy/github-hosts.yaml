# GitHub reverse-proxy phishing pages keep production paths and move them
# onto the phishing origin: collector.github.com/github/collect,
# api.github.com/_private/, and github.githubassets.com/assets/. One foreign
# host can be a quoted example. Two different GitHub services on non-GitHub
# hosts is the rewrite signature of the proxy, independent of the lookalike
# domain.
#
# ATT&CK: T1557 (Adversary-in-the-Middle), T1566.002 (Spearphishing Link)
defaults:
  platforms: [windows, unix]
  for: [html, javascript]
  attack: T1557,T1566.002

traits:
  - id: rewritten-github-collect-beacon
    desc: GitHub collect beacon off collector.github.com
    crit: suspicious
    conf: 0.96
    if:
      type: text
      regex: '(?i)https?://collector\.[a-z0-9.-]{1,80}/github/collect\b'
    not:
      - regex: '(?i)collector\.github\.com/'

  - id: rewritten-github-private-api
    desc: GitHub private API off api.github.com
    crit: suspicious
    conf: 0.95
    if:
      type: text
      regex: '(?i)https?://api\.[a-z0-9.-]{1,80}/_private/'
    not:
      - regex: '(?i)api\.github\.com/'

  - id: rewritten-github-assets-cdn
    desc: GitHub asset CDN off githubassets.com
    crit: suspicious
    conf: 0.93
    if:
      type: text
      regex: '(?i)https?://github\.[a-z0-9-]+\.[a-z0-9.-]{2,80}/assets/'
    not:
      - regex: '(?i)github\.githubassets\.com/'

composite_rules:
  # All three production services, not any pair: the asset path alone is a
  # common URL shape, and hostile precision needs the collect beacon and the
  # private API together with it.
  - id: github-reverse-proxy-service-hosts
    desc: GitHub service URLs hosted off GitHub
    crit: hostile
    conf: 0.97
    all:
      - id: rewritten-github-collect-beacon
      - id: rewritten-github-private-api
      - id: rewritten-github-assets-cdn
    near_lines: 40
