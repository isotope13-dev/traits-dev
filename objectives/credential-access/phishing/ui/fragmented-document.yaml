defaults:
  platforms: [windows, unix]
  for: [html]
composite_rules:
  - id: concealed-document-credential-form
    desc: Document password lure conceals external credential form with unescape
    crit: hostile
    conf: 0.99
    attack: T1056.003,T1027
    all:
      - id: objectives/credential-access/phishing/lure::fragmented-document-password-harvest
      - id: micro-behaviors/ui/window/insert-html::script-tag-document-write-unescape
      - id: micro-behaviors/ui/window/insert-html::browser-document-write-unescape
