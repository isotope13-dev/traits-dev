defaults:
  platforms: [macos]
  for: [macho]
  arch: [aarch64]
  attack: T1056.002
composite_rules:
  # The recovered evidence is incomplete: require dialog reconstruction,
  # password verification, wallet targeting and copying independently. This
  # is suspicious co-occurrence, not a claim that the dialog result reaches
  # dscl or that a particular wallet was stolen.
  - id: xor-dialog-password-check-wallet-copy
    desc: XOR dialog, password check, wallet-copy APIs
    crit: suspicious
    conf: 0.94
    all:
      - id: objectives/anti-static/obfuscation/encoding/xor::sparse-cstring-vector-xor-shell
      - id: micro-behaviors/ui/dialog/apple::osascript-display-dialog-command
      - id: micro-behaviors/os/security/auth/verify::dscl-authonly
      - id: micro-behaviors/os/application/target::native-hardware-wallet-brand-family
      - id: micro-behaviors/fs/directory/traverse::cpp-recursive-copy-scaffold
