defaults:
  platforms: [windows, unix]
  for: [svg]
  attack: T1566

traits:
  - id: svg-encoded-iframe-email-target
    desc: SVG hides iframe URL and embeds recipient
    crit: hostile
    conf: 0.97
    if:
      type: yara
      source: |
        rule svg_encoded_iframe_email_target {
          strings:
            $foreign = "<foreignObject" nocase
            $iframe = "<iframe" nocase
            $encoded = /%68%74%74%70(%73)?%3[aA]%2[fF]%2[fF]/ nocase
            $decode = "decodeURIComponent" nocase
            $assign = /\.src\s*=/
            $email = /[A-Za-z0-9._%+-]{1,64}@[A-Za-z0-9.-]{1,120}\.[A-Za-z]{2,24}/
            $delay = "setTimeout" nocase
          condition:
            all of them
        }
