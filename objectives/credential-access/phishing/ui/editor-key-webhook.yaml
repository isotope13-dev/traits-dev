defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  attack: T1056.002,T1567.004
composite_rules:
  - id: webhook-credential-storage-confirmation
    desc: Webhook credential export confirms storage
    crit: hostile
    conf: 0.98
    all:
      - id: objectives/exfiltration/messaging/discord::dialog-credential-discord-post
      - id: micro-behaviors/ui/window/notify::credential-storage-notification
  - id: editor-credential-reset-webhook-harvest
    desc: Editor credential reset with webhook harvesting
    crit: hostile
    conf: 0.98
    all:
      - id: objectives/exfiltration/messaging/discord::dialog-credential-discord-post
      - id: micro-behaviors/os/security/auth/secret::editor-credential-reset-command
