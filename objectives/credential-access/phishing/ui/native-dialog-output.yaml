defaults:
  for:
  - powershell
  platforms:
  - windows
  crit: notable
  conf: 0.98
  attack: T1056.002
traits:
- id: phished-credentials-output
  desc: Emits a phished-credentials result label
  if:
    type: text
    substr: Phished credentials
composite_rules:
- id: powershell-native-dialog-password-harvest
  desc: PowerShell captures Windows credential-dialog secrets as phished output
  crit: hostile
  all:
  - id: phished-credentials-output
  - id: micro-behaviors/ui/dialog/prompt::powershell-native-credential-dialog-call
  - id: well-known/tool/offensive/powershell-empire::input-capture-module-functions
