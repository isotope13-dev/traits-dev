# Wallet-brand lookalike harvesting recovery material: a confusable
# Latin/Cyrillic display name (mid-word script mix, so a marketplace listing
# renders as a known brand while occupying a different identifier) on an
# extension whose UI collects recovery words or private keys. The homoglyph
# leg is the deception — no vendor confuses its own brand in its own name —
# and the entry legs are the harvest target. Both halves are required:
# localized real wallets keep their scripts in separate words, and real
# wallets' own entry UI lacks the confusable name.
defaults:
  platforms: [unix, windows]
  attack: T1566.002,T1036.007

composite_rules:
  - id: homoglyph-wallet-secret-lure
    desc: Homoglyph wallet brand harvests recovery secrets
    crit: hostile
    conf: 0.96
    scope: archive
    for: [crx, xpi, zip, chrome-manifest, javascript, html]
    all:
      - id: objectives/evasion/masquerade/identity/display-name::extension-name-latin-cyrillic-mix
      - id: micro-behaviors/crypto/mnemonic::mnemonic-validate-check
    any:
      - id: micro-behaviors/ui/controls/credential::private-key-enter-label
      - id: micro-behaviors/ui/controls/wallet::wallet-mnemonic-entry-label
