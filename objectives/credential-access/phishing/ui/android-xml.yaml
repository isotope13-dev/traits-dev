# Android resources that ask for a payment-card secret.
defaults:
  platforms: [android]
  for: [xml]
  crit: suspicious
  conf: 0.96
  attack: T1056.002

traits:
  - id: android-card-password-after-card-prompt
    desc: Android card password prompt
    if:
      type: text
      # Require Android widget text or a named string resource, not app prose.
      regex: '(?i)(android:(text|hint)="|<string).{0,50}(card|cart[aã]o).{0,50}(password|senha|pin)'
    unless:
      # Hardware smart cards (OpenSC/PKCS#11/ISO 7816 tokens) use PINs to unlock
      # cryptographic keys, distinct from payment card credential phishing prompts.
      - type: text
        regex: '(?i)\bsmart\s*cards?\b'
      # SD host-controller register maps (CMSIS-SVD vendor files) describe
      # a card presence-detect pin: a physical GPIO signal, not a PIN code
      # prompt ("Card Presence Detect Pin level").
      - type: text
        regex: '(?i)\bcard (presence )?detect(ion)? pin\b'
      # .NET XML API documentation (csc <member name="..."> entries) discusses
      # sensitive value kinds in prose; it is never an Android credential prompt.
      - type: text
        regex: '<member name="'
      # Telegram's stored-card payment confirmation asks for the account's own
      # 2-Step-Verification password, not a secret belonging to the card.
      - type: text
        regex: '(?i)\b(2|two)[- ]step[- ]verification\b'
      # Browser sidebar/toolbar pinning promo elements (e.g. Firefox drag-to-pin-promo-card)
      - type: text
        regex: '(?i)\b(drag-to-pin|sidebar-pins)\b'
      # South Korean KCP (NHN KCP) payment gateway requires the first 2 digits
      # of the card password for card-not-present authentication.
      - type: text
        regex: '(?i)\b(checkout_)?kcp_password\b'
      - id: well-known/lib/vendor-sdk/adyen/
      # Localized server-side label bundles (<property key="...">) hold
      # checkout/web-UI text in Java applications (OFBiz, Struts); they are
      # rendered HTML strings, never an Android credential prompt layout.
      - type: text
        regex: '<property key="'

  - id: android-card-password-before-card-prompt
    desc: Android card password prompt
    if:
      type: text
      regex: '(?i)(android:(text|hint)="|<string).{0,50}(password|senha|pin).{0,50}(card|cart[aã]o)'
    unless:
      # Hardware smart cards (OpenSC/PKCS#11/ISO 7816 tokens) use PINs to unlock
      # cryptographic keys, distinct from payment card credential phishing prompts.
      - type: text
        regex: '(?i)\bsmart\s*cards?\b'
      # .NET XML API documentation (csc <member name="..."> entries) discusses
      # sensitive value kinds in prose; it is never an Android credential prompt.
      - type: text
        regex: '<member name="'
      # Telegram's stored-card payment confirmation asks for the account's own
      # 2-Step-Verification password, not a secret belonging to the card.
      - type: text
        regex: '(?i)\b(2|two)[- ]step[- ]verification\b'
      # Browser sidebar/toolbar pinning promo elements (e.g. Firefox drag-to-pin-promo-card)
      - type: text
        regex: '(?i)\b(drag-to-pin|sidebar-pins)\b'
      # South Korean KCP (NHN KCP) payment gateway requires the first 2 digits
      # of the card password for card-not-present authentication.
      - type: text
        regex: '(?i)\b(checkout_)?kcp_password\b'
      - id: well-known/lib/vendor-sdk/adyen/
      # Localized server-side label bundles (<property key="...">) hold
      # checkout/web-UI text in Java applications (OFBiz, Struts); they are
      # rendered HTML strings, never an Android credential prompt layout.
      - type: text
        regex: '<property key="'
