# Android resources that ask for a payment-card secret.
defaults:
  platforms: [android]
  for: [xml]
  crit: suspicious
  conf: 0.96
  attack: T1056.002

traits:
  - id: android-card-password-after-card-prompt
    desc: Card password prompt after card label
    if:
      type: text
      regex: '(?i)\b(cart[aã]o|card)\b[^\n]{0,48}\b(senha|password|pin)\b'
    unless:
      # Hardware smart cards (OpenSC/PKCS#11/ISO 7816 tokens) use PINs to unlock
      # cryptographic keys, distinct from payment card credential phishing prompts.
      - type: text
        regex: '(?i)\bsmart\s*cards?\b'
      # .NET XML API documentation (csc <member name="..."> entries) discusses
      # sensitive value kinds in prose; it is never an Android credential prompt.
      - type: text
        regex: '<member name="'
      # Telegram's stored-card payment confirmation asks for the account's own
      # 2-Step-Verification password, not a secret belonging to the card.
      - type: text
        regex: '(?i)\b(2|two)[- ]step[- ]verification\b'

  - id: android-card-password-before-card-prompt
    desc: Card password prompt before card label
    if:
      type: text
      regex: '(?i)\b(senha|password|pin)\b[^\n]{0,48}\b(cart[aã]o|card)\b'
    unless:
      # Hardware smart cards (OpenSC/PKCS#11/ISO 7816 tokens) use PINs to unlock
      # cryptographic keys, distinct from payment card credential phishing prompts.
      - type: text
        regex: '(?i)\bsmart\s*cards?\b'
      # .NET XML API documentation (csc <member name="..."> entries) discusses
      # sensitive value kinds in prose; it is never an Android credential prompt.
      - type: text
        regex: '<member name="'
      # Telegram's stored-card payment confirmation asks for the account's own
      # 2-Step-Verification password, not a secret belonging to the card.
      - type: text
        regex: '(?i)\b(2|two)[- ]step[- ]verification\b'
