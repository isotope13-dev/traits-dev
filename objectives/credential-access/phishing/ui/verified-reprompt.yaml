defaults:
  for:
  - powershell
  platforms:
  - windows
  crit: notable
  conf: 0.98
traits:
- id: credential-validation-reprompt-loop
  desc: Loops until supplied credentials validate
  if:
    type: text
    substr: while ($validCreds -eq $false -and $global:VerifyCreds -eq $true)
composite_rules:
- id: powershell-phishing-password-reprompt
  desc: Reprompts and exposes valid phished passwords
  crit: hostile
  all:
  - id: credential-validation-reprompt-loop
  - id: powershell-native-dialog-password-harvest
