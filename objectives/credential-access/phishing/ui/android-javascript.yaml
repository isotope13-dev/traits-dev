# Moved to the canonical mechanism leaf.
defaults:
  platforms: [unix, windows]
  for: [javascript]
  crit: notable
  conf: 0.9
  attack: T1566
traits:
  - id: bank-login-copy
    desc: Bank login phishing copy
    conf: 0.92
    if:
      type: text
      substr: "Login Online Banking"
  - id: pan-kyc-copy
    desc: PAN KYC banking lure
    conf: 0.9
    if:
      type: text
      substr: "PAN KYC"
  - id: cif-number-copy
    desc: CIF number field label
    crit: notable
    conf: 0.9
    if:
      type: text
      substr: "CIF Number"
  - id: date-of-birth-copy
    desc: Date of birth field label
    crit: notable
    conf: 0.9
    if:
      type: text
      substr: "Date of Birth"
  - id: cvv-copy
    desc: CVV harvest field
    crit: component
    conf: 0.94
    if:
      type: text
      word: "CVV"
  - id: atm-pin-copy
    desc: ATM PIN harvest field
    crit: suspicious
    conf: 0.94
    if:
      type: text
      substr: "ATM Pin"
  - id: invalid-otp-copy
    desc: Invalid OTP retry lure
    crit: suspicious
    conf: 0.95
    if:
      type: text
      substr: "Invalid one time password"

    unless:
composite_rules:
  - id: account-identity-copy
    desc: Account identity harvest copy
    crit: suspicious
    conf: 0.96
    all:
      - id: micro-behaviors/data/parse/payment::account-number-copy
      - id: cif-number-copy
      - id: date-of-birth-copy
  - id: card-pin-copy
    desc: Card and ATM PIN copy
    crit: suspicious
    conf: 0.97
    all:
      - id: micro-behaviors/data/parse/payment::card-number-copy
      - id: cvv-copy
      - id: atm-pin-copy
