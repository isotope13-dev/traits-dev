# Encoded script-to-frameset page takeover: a percent-encoded script tag,
# a full-page frameset, and a string-callback timer that fires the rewrite.
# Together they are the smuggled harvest-page primitive (the link carries
# the script, the script document.writes a remote frameset over the page).
# No legitimate page combines all three, hence hostile on conjunction.
defaults:
  platforms: [windows, unix]
  for: [html]
  attack: T1566.002
composite_rules:
  - id: encoded-script-frameset-takeover
    desc: Encoded script rewrites page as remote frameset
    crit: hostile
    conf: 0.95
    near_bytes: 2048
    all:
      - id: micro-behaviors/data/decode/url::url-encoded-markup-tag
      - id: metadata/document/html::frameset-opens-with-frame
      - id: micro-behaviors/time/schedule/callback::markup-timer-call-text
