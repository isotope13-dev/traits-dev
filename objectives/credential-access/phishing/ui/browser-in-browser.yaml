# Browser-in-the-Browser: a fake browser window drawn inside the page.
#
# The victim is shown what looks like a popped-out sign-in window — title bar,
# window buttons, padlock, and an address bar reading the identity provider's
# real URL. All of it is markup in the phishing page. The one check a careful
# user is taught to make, "look at the address bar", is answered by an element
# the attacker controls, and the fake window cannot be dragged outside the tab
# because it was never a window.
#
# It pairs naturally with a transparent proxy: the fake chrome supplies the
# trusted-looking URL while the frame underneath renders the genuine login page
# relayed through the operator.
#
# The atoms match markup structure — the class and id tokens a synthetic window
# needs — never rendered text or prose. Browser mockups in design systems and
# documentation use the same chrome, so neither atom convicts alone; the
# composite requires a real identity-provider login host in the same file,
# which a mockup has no reason to carry.
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript, html]
  attack: T1036
  mbc: B0030

traits:
  - id: external-login-frame
    desc: External login iframe
    crit: notable
    conf: 0.92
    for: [html]
    if:
      type: text
      regex: '(?i)<iframe\b[^>]{0,160}\bsrc\s*=\s*["'']https?://[^"''\s>]{1,120}/(login|auth)\b'

  - id: external-signin-frame
    desc: External sign-in iframe
    crit: notable
    conf: 0.92
    for: [html]
    if:
      type: text
      regex: '(?i)<iframe\b[^>]{0,160}\bsrc\s*=\s*["'']https?://[^"''\s>]{1,120}/sign[-_]?in\b'

composite_rules:
  - id: synthetic-browser-window-chrome
    desc: Page draws a fake browser window with a URL bar
    crit: suspicious
    conf: 0.9
    all:
      - id: micro-behaviors/ui/window/markup::synthetic-url-bar-markup
      - id: micro-behaviors/ui/window/markup::synthetic-window-chrome-markup

  - id: browser-in-the-browser-idp-spoof
    desc: Fake browser window spoofs an IdP login URL
    crit: hostile
    conf: 0.96
    attack: T1036,T1566.002
    all:
      - id: synthetic-browser-window-chrome
    needs: 1
    any:
      - id: micro-behaviors/communications/http/oauth::microsoft-login
      - id: micro-behaviors/communications/http/oauth::google-accounts
      - id: metadata/library/microsoft-auth::microsoft-live-auth-domain
    unless:
      - id: well-known/tool/detection/
      - id: metadata/package/testing/presence/fixture/

  - id: browser-in-browser-login-frame
    desc: Fake browser chrome frames login
    crit: hostile
    conf: 0.98
    attack: T1036,T1056.002,T1566.002
    all:
      - id: synthetic-browser-window-chrome
    any:
      - id: external-login-frame
      - id: external-signin-frame
    unless:
      - id: well-known/tool/detection/
      - id: metadata/package/testing/presence/fixture/
