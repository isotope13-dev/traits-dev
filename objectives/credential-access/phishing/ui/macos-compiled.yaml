defaults:
  platforms: [macos]
  for: [macho]
  attack: T1056.002
  mbc: B0028
traits:
  - id: prompt-symbol
    desc: Credential prompt handler symbol
    crit: suspicious
    conf: 0.95
    if:
      type: text
      regex: main\.\(\*[A-Za-z0-9_]{4,}\)\.Prompt
  - id: verify-symbol
    desc: Credential verify handler symbol
    crit: suspicious
    conf: 0.95
    if:
      type: text
      regex: main\.\(\*[A-Za-z0-9_]{4,}\)\.Verify
  - id: password-string
    desc: Password collection string
    crit: component
    conf: 0.85
    if:
      type: text
      word: Password
  - id: keychain-workflow-symbol
    desc: Keychain workflow handler symbol
    crit: suspicious
    conf: 0.9
    if:
      type: text
      regex: main\.\(\*[A-Za-z0-9_]{4,}\)\.Kch
composite_rules:
  - id: compiled-password-prompt
    desc: Native password prompt flow
    crit: suspicious
    conf: 0.95
    all:
      - id: prompt-symbol
      - id: verify-symbol
      - id: password-string
  - id: compiled-keychain-password-flow
    desc: Keychain-themed password harvest flow
    crit: suspicious
    conf: 0.96
    all:
      - id: compiled-password-prompt
      - id: keychain-workflow-symbol
  # A native app drawing its own copy of the macOS authorization sheet:
  # the window type plus a hand-masked field (no Secure Event Input) or an
  # invalid-attempt counter that keeps re-asking until the password is right.
  - id: native-fake-authorization-prompt
    desc: Draws a fake macOS authorization prompt
    crit: suspicious
    conf: 0.9
    for: [macho, swift, objc]
    all:
      - id: micro-behaviors/ui/window/password-field::authorization-prompt-view-type
    any:
      - id: micro-behaviors/ui/window/password-field::custom-masked-password-view
      - id: micro-behaviors/ui/window/password-field::password-attempt-counter
  # Checking the typed password against the local account is what turns a
  # lookalike dialog into a harvester: it only lets go once the victim has
  # typed the real login password, which then unlocks the keychain.
  - id: validated-native-password-phish
    desc: Fake prompt checks the login password
    crit: hostile
    conf: 0.96
    for: [macho, swift, objc]
    attack: T1056.002,T1110.001
    all:
      - id: micro-behaviors/ui/window/password-field::custom-masked-password-view
      - id: micro-behaviors/os/security/auth/verify::opendirectory-user-password-check
    any:
      - id: micro-behaviors/ui/window/password-field::authorization-prompt-view-type
      - id: micro-behaviors/ui/window/password-field::password-attempt-counter
      # A correct password is then spent on a prompt-free keychain read.
      - id: micro-behaviors/os/security/keychain::secitem-no-auth-ui
