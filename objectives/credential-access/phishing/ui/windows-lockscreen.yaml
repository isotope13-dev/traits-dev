# Fake Windows lock-screen credential phishing UI.
# Harvests passwords from a fullscreen always-on-top window populated with the
# real display name / account picture, then exfiltrates captures (commonly to
# a cloud dead-drop). Does not validate the entered password against Windows.
defaults:
  platforms: [windows]
  for: [python, scripts]
  attack: T1056.002,T1556
  mbc: B0030

traits:
  - id: getusernameex-api
    desc: Reads extended username via GetUserNameEx
    crit: notable
    conf: 0.92
    if:
      type: text
      regex: '(?i)\bGetUserNameEx[AW]?\b'

  - id: account-pictures-path
    desc: Windows AccountPictures profile photo path
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: '(?i)Microsoft\\Windows\\AccountPictures'

  - id: windows-lockscreen-password-incorrect
    desc: Windows lock-screen incorrect-password message
    crit: notable
    conf: 0.9
    if:
      type: text
      # Exact Windows lock-screen retry copy; keep structure-bound, not prose.
      substr: 'The password is incorrect. Try again.'

composite_rules:
  # Native Win32 implementation of the same technique as the Tkinter rule
  # below. The lock-screen artwork path and current account name distinguish
  # system-login impersonation from an ordinary full-screen password dialog.
  - id: fake-windows-lockscreen-native-credential-harvest
    desc: Native fake lock screen credential capture
    crit: hostile
    conf: 0.98
    for: [source]
    near_bytes: 16000
    all:
      - id: micro-behaviors/ui/window/manage/visibility::native-fullscreen-topmost-overlay
      - id: micro-behaviors/ui/window/form-input::windows-masked-password-control
      - id: micro-behaviors/ui/wallpaper::windows-lockscreen-background-directory
      - id: micro-behaviors/os/sysinfo/hostname::get-user-name

  - id: fake-windows-lockscreen-input-trap
    desc: Fake Windows lock screen traps keyboard focus
    crit: hostile
    conf: 0.99
    for: [source]
    near_bytes: 18000
    all:
      - id: fake-windows-lockscreen-native-credential-harvest
      - id: micro-behaviors/hardware/input/keyboard/hook::low-level-windows-keyboard-hook
      - id: micro-behaviors/ui/window/manage/activation::set-foreground-window-source

  - id: fake-windows-lockscreen-winhttp-upload
    desc: Fake Windows lock screen uses WinHTTP upload
    crit: hostile
    conf: 0.99
    for: [c, cpp]
    near_bytes: 18000
    all:
      - id: fake-windows-lockscreen-native-credential-harvest
      - id: micro-behaviors/communications/http/client/winhttp::winhttp-send-request

  # Compiled native implementations lose source-level style constants. This
  # variant instead requires the lock-screen asset path plus the complete API
  # cluster for user personalization, screen geometry, input capture, and a
  # keyboard hook. The conjunction is specific while surviving recompilation.
  - id: fake-windows-lockscreen-compiled-credential-harvest
    desc: Compiled fake lock screen credential capture
    crit: hostile
    conf: 0.98
    for: [pe, dll]
    all:
      - id: micro-behaviors/ui/wallpaper::windows-lockscreen-background-directory
      - id: micro-behaviors/os/sysinfo/hostname::get-user-name
      - id: micro-behaviors/ui/window/probe::get-desktop-window
      - id: micro-behaviors/ui/window/probe::get-client-rect
      - id: micro-behaviors/ui/window/manage/control::create-window-ex
      - id: micro-behaviors/ui/window/manage/control::get-window-text
      - id: micro-behaviors/hardware/input/keyboard/hook::windows-hook-install

  - id: tkinter-fullscreen-credential-overlay
    desc: Fullscreen topmost Tkinter credential overlay
    crit: suspicious
    conf: 0.94
    for: [python]
    all:
      - id: micro-behaviors/ui/window/manage/visibility::tkinter-fullscreen
      - id: micro-behaviors/ui/window/manage/visibility::tkinter-topmost
    any:
      - id: micro-behaviors/ui/window/manage/visibility::tkinter-overrideredirect
      - id: micro-behaviors/ui/framework/tkinter::tkinter-init

  - id: fake-windows-lockscreen-credential-harvest
    desc: Fake Windows lock screen harvests credentials
    crit: hostile
    conf: 0.97
    for: [python]
    near_bytes: 12000
    all:
      - id: tkinter-fullscreen-credential-overlay
      - id: windows-lockscreen-password-incorrect
    any:
      - id: getusernameex-api
      - id: account-pictures-path

  - id: fake-windows-lockscreen-cloud-exfil
    desc: Fake lock screen uploads passwords over HTTP
    crit: hostile
    conf: 0.98
    for: [python]
    near_bytes: 14000
    all:
      - id: fake-windows-lockscreen-credential-harvest
    any:
      - id: micro-behaviors/communications/http/oauth::microsoft-graph
      - id: micro-behaviors/communications/http/lib/urllib::urllib-request-data-body
      - id: micro-behaviors/communications/http/lib/requests::requests-put
      - id: micro-behaviors/communications/http/lib/requests::requests-post
      - id: micro-behaviors/communications/http/lib/urllib::urllib-urlopen-call
