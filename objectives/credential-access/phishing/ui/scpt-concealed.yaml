defaults:
  for: [applescript]
  platforms: [macos]
  attack: T1056.002
composite_rules:
  # File-level context; no claim that the static engine resolves the dialog's
  # dynamic result or proves its path to the keychain query. Concealment plus
  # a system-themed input dialog and secret extraction merits investigation.
  - id: scpt-concealed-system-keychain-dialog
    desc: Concealed system dialog with keychain query
    crit: suspicious
    conf: 0.95
    all:
      - id: objectives/anti-static/obfuscation/encoding/arithmetic::scpt-arithmetic-character-decoders
      - id: micro-behaviors/ui/dialog/apple::scpt-display-dialog-call
      - id: micro-behaviors/ui/dialog/apple::scpt-dialog-hidden-answer-parameter
      - id: metadata/file/string/application-name::system-preferences-name-reference
      - id: micro-behaviors/os/security/keychain::chrome-safe-storage-query
