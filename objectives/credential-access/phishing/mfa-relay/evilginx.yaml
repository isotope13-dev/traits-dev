# Evilginx phishlet configuration structure.
#
# The article identifies Evilginx as the reverse proxy used to capture first-
# factor credentials and session cookies. These rules match its configuration
# schema rather than campaign domains or the product name, so renamed phishlets
# and other hosted identity providers remain covered.
defaults:
  platforms: [windows, unix]
  for: [text]
  attack: T1056.002,T1539,T1557
  mbc: B0030

traits:
  - id: phishlet-phish-sub-field
    desc: Phishlet phishing subdomain field
    crit: notable
    conf: 0.96
    if:
      type: text
      regex: '(?i)\bphish_sub\s*:'

  - id: phishlet-origin-sub-field
    desc: Phishlet origin subdomain field
    crit: notable
    conf: 0.96
    if:
      type: text
      regex: '(?i)\borig_sub\s*:'

  - id: phishlet-session-field
    desc: Phishlet session capture field
    crit: suspicious
    conf: 0.96
    if:
      type: text
      regex: '(?i)\bsession\s*:\s*true\b'

  - id: phishlet-auth-token-section
    desc: Phishlet authentication-token section
    crit: suspicious
    conf: 0.98
    if:
      type: text
      regex: '(?i)^\s*auth_tokens\s*:'

  # A bare `keys: [...]` array is not phishlet evidence -- it is any YAML/JSON
  # config with a keys field, a JS object literal, or Python printing
  # `list(data.keys())`. An Evilginx auth_tokens entry always pairs the cookie
  # list with the domain it is captured from, so require that pairing:
  #   auth_tokens:
  #     - domain: '.github.com'
  #       keys: ['user_session','dotcom_user']
  - id: phishlet-cookie-key-list
    desc: Phishlet cookie key list for a domain
    crit: suspicious
    conf: 0.94
    if:
      type: text
      regex: '(?is)domain\s*:\s*[''"]?[\w.*-]{1,80}[''"]?\s*\n\s*keys\s*:\s*\['

  - id: phishlet-credential-section
    desc: Phishlet credential-capture section
    # A bare YAML `credentials:` key is incomplete on its own — connection
    # fixtures, Helm values, and cloud connection schemas use the same label.
    # Pair with username/password mapping fields via phishlet-credential-fields.
    crit: component
    conf: 0.98
    if:
      type: text
      regex: '(?i)^\s*credentials\s*:'

  - id: phishlet-username-field
    desc: Phishlet username mapping key
    crit: component
    conf: 0.96
    if:
      type: text
      regex: '(?i)^\s*username\s*:\s*$'

  - id: phishlet-password-field
    desc: Phishlet password mapping key
    crit: component
    conf: 0.96
    if:
      type: text
      regex: '(?i)^\s*password\s*:\s*$'

  - id: phishlet-post-capture-type
    desc: Phishlet POST capture type
    crit: suspicious
    conf: 0.96
    if:
      type: text
      regex: "(?i)\\btype\\s*:\\s*['\"]post['\"]"

  - id: phishlet-substitution-section
    desc: Phishlet response-rewrite section
    crit: suspicious
    conf: 0.96
    if:
      type: text
      regex: '(?i)^\s*sub_filters\s*:'

  - id: phishlet-search-replace-fields
    desc: Phishlet content search and replacement
    crit: suspicious
    conf: 0.94
    if:
      type: text
      regex: '(?i)\btriggers_on\s*:.{0,80}\bsearch\s*:.{0,60}\breplace\s*:'

composite_rules:
  - id: phishlet-credential-fields
    desc: Phishlet username and password fields
    crit: notable
    conf: 0.96
    all:
      - id: phishlet-credential-section
      - id: phishlet-username-field
      - id: phishlet-password-field
    near_lines: 40

  - id: phishlet-proxy-host-mapping
    desc: Maps phishing and origin hostnames
    crit: suspicious
    conf: 0.98
    all:
      - id: phishlet-phish-sub-field
      - id: phishlet-origin-sub-field
      - id: phishlet-session-field
    near_lines: 20

  - id: phishlet-session-cookie-relay
    desc: Phishlet relays captured session cookies
    crit: hostile
    conf: 0.99
    all:
      - id: phishlet-proxy-host-mapping
      - id: phishlet-auth-token-section
      - id: phishlet-cookie-key-list
    near_lines: 40

  - id: phishlet-credential-relay
    desc: Phishlet relays posted login credentials
    crit: hostile
    conf: 0.99
    attack: T1056.002,T1557
    all:
      - id: phishlet-proxy-host-mapping
      - id: phishlet-credential-fields
      - id: phishlet-post-capture-type
    near_lines: 80

  - id: phishlet-response-rewrite-relay
    desc: Phishlet rewrites proxied login content
    crit: hostile
    conf: 0.98
    attack: T1056.002,T1557
    all:
      - id: phishlet-proxy-host-mapping
      - id: phishlet-substitution-section
      - id: phishlet-search-replace-fields
      - id: phishlet-credential-relay
    near_lines: 120
