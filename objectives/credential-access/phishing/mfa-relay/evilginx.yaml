# Evilginx phishlet configuration structure.
#
# The article identifies Evilginx as the reverse proxy used to capture first-
# factor credentials and session cookies. These rules match its configuration
# schema rather than campaign domains or the product name, so renamed phishlets
# and other hosted identity providers remain covered.
defaults:
  platforms: [windows, unix]
  # Panels and kit builders often embed generated phishlets in implementation
  # source, so apply the schema matchers to source as well as standalone text.
  for: [scripts, source, text]
  attack: T1056.002,T1539,T1557
  mbc: B0030

traits:
  - id: phishlet-phish-sub-field
    desc: Phishlet phishing subdomain field
    crit: notable
    conf: 0.96
    if:
      type: text
      regex: '(?i)\bphish_sub\s*:'

  - id: phishlet-origin-sub-field
    desc: Phishlet origin subdomain field
    crit: notable
    conf: 0.96
    if:
      type: text
      regex: '(?i)\borig_sub\s*:'

  - id: phishlet-session-field
    desc: Phishlet session capture field
    crit: suspicious
    conf: 0.96
    if:
      type: text
      # A bare `session: true` is any config flag (CLI session sets, test
      # payloads). Evilginx only means it beside its own schema keys, so
      # require a proxy-host/subscriber anchor in the same region.
      regex: '(?is)(phish_sub|orig_sub|proxy_host|auth_token).{0,400}\bsession\s*:\s*true'

  - id: phishlet-auth-token-section
    desc: Phishlet authentication-token section
    crit: suspicious
    conf: 0.98
    if:
      type: text
      # A docstring parameter (`auth_tokens: List of valid tokens`) is prose.
      # An Evilginx section is the bare YAML key, with the domain list below it.
      regex: '(?im)^[ \t]{0,2}auth_tokens[ \t]*:[ \t]*$'

  # A bare `keys: [...]` array is not phishlet evidence -- it is any YAML/JSON
  # config with a keys field, a JS object literal, or Python printing
  # `list(data.keys())`. An Evilginx auth_tokens entry always pairs the cookie
  # list with the domain it is captured from, so require that pairing:
  #   auth_tokens:
  #     - domain: '.github.com'
  #       keys: ['user_session','dotcom_user']
  - id: phishlet-cookie-key-list
    desc: Phishlet cookie key list for a domain
    crit: suspicious
    conf: 0.94
    if:
      type: text
      regex: '(?is)domain\s*:\s*[''"]?[\w.*-]{1,80}[''"]?\s*\n\s*keys\s*:\s*\['

  - id: phishlet-credential-section
    desc: Phishlet credential-capture section
    # A bare YAML `credentials:` key is incomplete on its own — connection
    # fixtures, Helm values, and cloud connection schemas use the same label.
    # Require an empty, line-oriented mapping key so JavaScript object fields
    # such as `credentials: Os ? K : ...` in Fetch/Axios adapters do not look
    # like an Evilginx section. Pair with username/password mapping fields via
    # phishlet-credential-fields.
    crit: notable
    conf: 0.98
    if:
      type: text
      regex: '(?im)^\s*credentials\s*:\s*(#.{0,120})?$'

  # An empty `username:`/`password:` line is any YAML mapping, or a SQL loop
  # label (`password: LOOP` in MariaDB's parser.result). A phishlet credential
  # mapping opens with its own key/search/type fields on the next line.
  - id: phishlet-username-field
    desc: Phishlet username mapping key
    crit: notable
    conf: 0.96
    if:
      type: text
      regex: '(?im)^\s*username\s*:\s*\n\s*(key|search|type)\s*:'

  - id: phishlet-password-field
    desc: Phishlet password mapping key
    crit: notable
    conf: 0.96
    if:
      type: text
      regex: '(?im)^\s*password\s*:\s*\n\s*(key|search|type)\s*:'

  - id: phishlet-credential-post-types
    desc: Phishlet contains two POST capture types
    # A bare `type: post` is common configuration syntax. Requiring two within
    # the credential mapping and proxy-host composites gives it meaning.
    # Line-anchored so inline JS object fields such as `{ type: "post" }` in
    # processor config do not read as Evilginx credential-capture mappings.
    crit: notable
    conf: 0.96
    count_min: 2
    if:
      type: text
      regex: '(?im)^\s+type\s*:\s*[''"]?post[''"]?\s*$'

  - id: phishlet-substitution-section
    desc: Phishlet response-rewrite section
    crit: notable
    conf: 0.96
    if:
      type: text
      regex: '(?im)^[ \t]*sub_filters[ \t]*:'

  - id: phishlet-search-replace-fields
    desc: Phishlet content search and replacement
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: '(?i)\btriggers_on\s*:.{0,180}\bsearch\s*:.{0,140}\breplace\s*:'

  - id: phishlet-javascript-injection-section
    desc: Phishlet JavaScript injection section
    crit: suspicious
    conf: 0.98
    if:
      type: text
      regex: '(?im)^[ \t]*js_inject[ \t]*:'

  - id: phishlet-script-tag-replacement
    desc: Phishlet replacement inserts a script tag
    crit: notable
    conf: 0.96
    if:
      type: text
      regex: '(?i)\btriggers_on\s*:.{0,180}\breplace\s*:.{0,180}<script\b[^>]{0,120}\bsrc\s*='

composite_rules:
  # Injection into a proxy that captures authentication cookies gives the
  # operator control over the genuine login flow (including MFA). Require the
  # cookie-capture schema; ordinary response rewriting is insufficient.
  - id: phishlet-session-script-injection
    desc: Session-capturing proxy injects login scripts
    crit: hostile
    conf: 0.99
    attack: T1539,T1557
    all:
      - id: phishlet-session-cookie-relay
    any:
      - id: phishlet-script-tag-replacement
      - id: phishlet-javascript-injection-section

  - id: phishlet-credential-fields
    desc: Phishlet username and password fields
    crit: notable
    conf: 0.96
    all:
      - id: phishlet-credential-section
      - id: phishlet-username-field
      - id: phishlet-password-field
    near_lines: 40

  - id: phishlet-proxy-host-mapping
    desc: Maps phishing and origin hostnames
    crit: suspicious
    conf: 0.98
    all:
      - id: phishlet-phish-sub-field
      - id: phishlet-origin-sub-field
      - id: phishlet-session-field
    near_lines: 20

  - id: phishlet-session-cookie-relay
    desc: Configures phishing-host proxy and session-cookie capture
    crit: hostile
    conf: 0.99
    all:
      - id: phishlet-proxy-host-mapping
      - id: phishlet-auth-token-section
      - id: phishlet-cookie-key-list
    near_lines: 40

  - id: phishlet-credential-relay
    desc: Configures phishing-host proxy and POST credential capture
    crit: hostile
    conf: 0.99
    attack: T1056.002,T1557
    all:
      - id: phishlet-proxy-host-mapping
      - id: phishlet-credential-fields
      - id: phishlet-credential-post-types
    near_lines: 80

  - id: phishlet-response-rewrite-relay
    desc: Phishlet rewrites proxied login content
    crit: hostile
    conf: 0.98
    attack: T1056.002,T1557
    all:
      - id: phishlet-substitution-section
      - id: phishlet-search-replace-fields
      - id: phishlet-credential-relay
    near_lines: 120
