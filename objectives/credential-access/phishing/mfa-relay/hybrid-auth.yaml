# HTTP carries submitted credentials while a persistent socket controls the
# challenge UI. This is suspicious, not conclusive: a legitimate identity
# provider can implement the same architecture. The hostile rule additionally
# requires the phishing event protocol published by Talos (figures 12-17).
# https://blog.talosintelligence.com/uat-11985/
defaults:
  platforms: [unix, windows]
  for: [html, javascript, typescript, php]
  attack: T1557,T1111,T1056.002
  mbc: B0030

traits:
  - id: google-login-start-event
    desc: Google impersonation kit login-start event token
    crit: component
    conf: 0.99
    if:
      type: text
      regex: '["'']google_login_start["'']'
      exclude_html_comments: true

  - id: google-login-check-event
    desc: Google phishing credential-check event token
    crit: component
    conf: 0.99
    if:
      type: text
      regex: '["'']google_login_check["'']'
      exclude_html_comments: true

composite_rules:
  - id: google-event-credential-collection
    desc: Google phishing events with password POST
    crit: hostile
    conf: 0.99
    attack: T1056.002,T1566.002
    all:
      - id: google-login-start-event
      - id: google-login-check-event
      - id: micro-behaviors/communications/http/form::browser-credential-post
    near_lines: 100

  - id: hybrid-authentication-challenge-channel
    desc: Password/MFA POST with challenge control socket
    crit: suspicious
    conf: 0.95
    all:
      - id: micro-behaviors/communications/http/form::browser-two-factor-form-post
      - id: micro-behaviors/communications/websocket/handler::websocket-javascript-constructor
      - id: micro-behaviors/ui/window/state::challenge-dependent-panel-visibility
    any:
      - id: micro-behaviors/communications/ipc/message::js-message-event-listener
      - id: micro-behaviors/communications/ipc/message::browser-message-handler
    near_lines: 100

  - id: google-event-hybrid-authentication-relay
    desc: Google event protocol with hybrid MFA relay
    crit: hostile
    conf: 0.99
    all:
      - id: hybrid-authentication-challenge-channel
      - id: google-event-credential-collection
    near_lines: 100
