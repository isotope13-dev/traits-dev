# Browser-in-the-middle phishing relays that stream a victim's live input into
# a separate identity-provider browser. The decisive shape is bidirectional:
# the lure exports input over its operator channel while CDP injects that input
# into a remotely rendered login, then checks the provider's authenticated
# cookie pair. This is independent of a kit name or implementation language.
defaults:
  platforms: [windows, unix]
  for: [scripts, source]
  attack: T1557,T1056.002,T1111,T1539
  mbc: B0030

composite_rules:
  - id: cdp-google-bitm-input-relay
    desc: Relays live phished input into a CDP-controlled Google login
    crit: hostile
    conf: 0.99
    all:
      - id: objectives/credential-access/phishing/mfa-relay::browser-live-input-websocket-collection
      - id: micro-behaviors/communications/http/services/google::google-login-navigation
      - id: micro-behaviors/communications/http/devtools/client::cdp-input-event-injection
      - id: micro-behaviors/communications/http/devtools/client::cdp-method-page-start-screencast
      - id: micro-behaviors/communications/http/devtools/client::cdp-method-network-get-cookies
      - id: micro-behaviors/communications/http/cookies::google-auth-cookie-short-name
    near_lines: 220
