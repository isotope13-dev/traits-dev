# AiTM phishlets can suppress the browser interfaces used for WebAuthn so the
# identity provider offers a relayable fallback. Match the API mutations and
# require a credential-and-session-capturing phishlet before calling the result
# hostile; browser compatibility tests can legitimately mock either API alone.
defaults:
  platforms: [windows, unix]
  for: [scripts, source, html, text]
  attack: T1111
  mbc: B0030

traits:
  - id: browser-public-key-credential-directly-disabled
    desc: Nulls browser PublicKeyCredential interface
    crit: suspicious
    conf: 0.96
    if:
      type: text
      regex: '(?i)\b(window|globalThis)(\.|\[[''"])PublicKeyCredential([''"]\])?\s*=\s*(undefined|null)\b'

  - id: browser-public-key-credential-property-target
    desc: Targets PublicKeyCredential property
    crit: component
    conf: 0.98
    if:
      type: text
      regex: 'Object\.defineProperty\(\s*(window|globalThis)\s*,\s*[''"]PublicKeyCredential[''"]'

  - id: browser-disabled-property-descriptor
    desc: Property descriptor disables a value
    crit: component
    conf: 0.94
    if:
      type: text
      regex: '\bvalue\s*:\s*(undefined|null)\b'

  - id: browser-credential-get-disabled
    desc: Disables browser credential retrieval method
    crit: suspicious
    conf: 0.96
    if:
      type: text
      regex: '(?i)\bnavigator\.credentials\.get\s*=\s*(undefined|null)\b'
composite_rules:
  - id: browser-public-key-credential-property-disabled
    desc: Disables PublicKeyCredential with a property descriptor
    crit: suspicious
    conf: 0.99
    all:
      - id: browser-public-key-credential-property-target
      - id: browser-disabled-property-descriptor
    near_lines: 8

  - id: browser-public-key-credential-disabled
    desc: Disables browser PublicKeyCredential interface
    crit: suspicious
    conf: 0.99
    any:
      - id: browser-public-key-credential-directly-disabled
      - id: browser-public-key-credential-property-disabled

  - id: browser-public-key-credential-request-rejected
    desc: Rejects WebAuthn credential API requests
    crit: suspicious
    conf: 0.98
    all:
      - id: micro-behaviors/process/hook/interception::browser-credential-api-function-replacement
      - id: micro-behaviors/crypto/asymmetric/key::public-key-missing-rejection
    near_lines: 10

  - id: browser-webauthn-interfaces-disabled
    desc: Disables browser WebAuthn interfaces
    crit: suspicious
    conf: 0.98
    all:
      - id: browser-public-key-credential-disabled
    any:
      - id: browser-credential-get-disabled
      - id: browser-public-key-credential-request-rejected
    near_lines: 20

  - id: phishlet-webauthn-session-downgrade
    desc: Phishlet disables WebAuthn while capturing authenticated sessions
    crit: hostile
    conf: 0.99
    attack: T1056.002,T1111,T1539,T1557
    all:
      - id: phishlet-session-cookie-relay
      - id: phishlet-credential-relay
      - id: phishlet-javascript-injection-section
      - id: browser-webauthn-interfaces-disabled
    near_lines: 180
