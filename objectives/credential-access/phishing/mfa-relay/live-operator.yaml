# Browser phishing kits with a live operator channel.  The kit is more than a
# static form logger: it streams values as they are typed and lets the remote
# operator move the victim among credential, payment-card, and second-factor
# pages.  Match the implementation shape so renamed kits and different brands
# remain covered.
defaults:
  platforms: [unix, windows]
  for: [html, javascript, typescript]
  attack: T1056.002,T1111,T1041,T1566.002
  mbc: B0030

traits:
  # A bare `expiry` is not a payment-card field: SDK bundles (Azure Storage SAS
  # `Expiry`, token/lease/cache records) use it constantly, which made this leg
  # fire on ordinary dependency code. Require a spelling that only a card form
  # uses.
  - id: browser-card-data-property
    desc: Browser code names payment-card data fields
    crit: component
    conf: 0.92
    if:
      type: text
      regex: '(?i)\b(card(number|_number|_expiry)|cvv|cvc|expiry_date)\b[\s"''=:]'

  - id: browser-otp-data-property
    desc: Browser OTP data field names
    crit: component
    conf: 0.92
    if:
      type: text
      regex: '(?i)\b(otp|mfa|2fa)\b[\s"''=:]'

  - id: browser-verification-data-property
    desc: Browser verification data field names
    crit: component
    conf: 0.92
    if:
      type: text
      regex: '(?i)\b(verification|one[-_ ]?time|two[-_ ]?factor)[-_ ]?(code|password)\b[\s"''=:]'

  - id: browser-credential-data-property
    desc: Credential record field key
    crit: component
    conf: 0.9
    if:
      type: text
      # Require an object/record-key boundary.  This excludes neutral member
      # assignments such as `urlObject.password = ""` in URL normalizers.
      regex: '(?im)(^|[,{]\s*["'']?)(username|email|password)\b\s*["'']?\s*[:=]'

  # One adjacency regex, not two component legs 1200 bytes apart. The claim is
  # that page-control commands are *mapped to* page files, and only adjacency
  # shows that. The split form paired any `<verb>_<word>:` object key with any
  # `"....html"` string anywhere in the surrounding 1200 bytes, which a large
  # generated bundle satisfies by coincidence: the Kombai extension's 8 MB
  # webpack UI bundle matched on a media-player key `next_page:` sitting near an
  # unrelated `"/index.html"`, and was reported as a phishing route map. An
  # operator panel writes `to_otp: "otp.html"` literally, so the adjacency form
  # costs real kits nothing while removing that coincidence class outright.
  - id: browser-command-route-map
    desc: Maps page-control commands to HTML pages
    crit: suspicious
    conf: 0.96
    if:
      type: text
      regex: '(?i)\b(to|go|show|next)_\w{1,20}\s*:\s*["''][\w./-]{1,40}\.html?["'']'
    unless:
      # Docker's official build-push Action ships a generated ncc bundle whose
      # dependencies carried the old split form's generic tokens. The adjacency
      # matcher above should already exclude it; kept until that is confirmed
      # against the artifact rather than assumed.
      - id: well-known/tool/development/github-actions/docker-build-push-action::repository-url
      - id: well-known/tool/development/github-actions/docker-build-push-action::dist-tree
      # Admin SPA settings panels map show_* keys to settings/*.html routes.
      - type: text
        regex: ':\s*["'']settings/'

  - id: browser-instruction-index
    desc: Indexes a browser instruction field
    crit: component
    conf: 0.94
    if:
      type: text
      regex: '\b\w+\[\s*\w+\.(instruction|command|route)\s*\]'

  - id: browser-command-index
    desc: Indexes a browser command variable
    crit: component
    conf: 0.94
    if:
      type: text
      regex: '(?i)\b\w+\[\s*(instruction|command|route)\s*\]'

  # Bare `assign(`/`replace(` matched `Object.assign` and `String.replace` in
  # any script, and a bare `href` leg matched every anchor element, so this
  # fragment fired on ordinary DOM code. Navigation means the location object
  # is the thing being assigned or called.
  - id: browser-route-navigation
    desc: Browser route navigation call
    crit: component
    conf: 0.94
    if:
      type: text
      regex: '(?i)\blocation\s*\.\s*(assign|replace)\s*\(|\blocation\s*\.\s*href\s*='

  - id: form-value-member-read
    desc: Reads a browser form value member
    crit: component
    conf: 0.92
    if:
      type: text
      regex: '(?i)\b(input|option|form)\s*\.\s*(value|innerText)\b'

  - id: native-form-value-descriptor-read
    desc: Reads a native browser form value descriptor
    crit: component
    conf: 0.92
    if:
      type: text
      regex: 'getOwnPropertyDescriptor\s*\(\s*HTML(Input|TextArea)Element\.prototype'

  # Host-bridge PhaaS clients declare an explicit parent/iframe control mode,
  # open a QT session WebSocket, and dump the harvested form on a final panel
  # route. Match the structural tokens so renamed kits keep the shape.
  - id: browser-host-bridge-mode-flag
    desc: Declares a browser host-bridge phishing mode
    crit: suspicious
    conf: 0.95
    if:
      type: text
      regex: '\bwindow\s*\.\s*__HOST_MODE\b'

  - id: operator-qt-session-websocket-path
    desc: Uses a QT operator session WebSocket path
    crit: suspicious
    conf: 0.96
    if:
      type: text
      regex: '(?i)\bwebSocket/QT/'

  - id: phaas-final-interface-route
    desc: References a PhaaS final-interface harvest route
    crit: suspicious
    conf: 0.95
    if:
      type: text
      regex: '(?i)\bapi/open/the_final_interface\b'

composite_rules:
  - id: browser-form-value-read
    desc: Browser code reads a form value
    crit: component
    conf: 0.92
    any:
      - id: form-value-member-read
      - id: micro-behaviors/ui/window/form-input::browser-event-target-value-reference
      - id: native-form-value-descriptor-read

  - id: browser-card-otp-credential-record
    desc: Browser data record combines card, OTP, and login fields
    crit: suspicious
    conf: 0.98
    all:
      - id: browser-card-data-property
      - id: browser-credential-data-property
      - id: browser-form-value-read
    any:
      - id: browser-otp-data-property
      - id: browser-verification-data-property
    near_bytes: 1800

  - id: browser-live-input-websocket-collection
    desc: Streams browser credential input over a WebSocket
    crit: hostile
    conf: 0.99
    attack: T1056.002,T1041
    all:
      - id: micro-behaviors/ui/window/form-input::capture-phase-input-listener
      - id: micro-behaviors/communications/websocket/handler::websocket-javascript-constructor
      - id: micro-behaviors/ui/window/form-input::browser-credential-field-reference
    any:
      - id: micro-behaviors/ui/window/form-input::browser-event-value-send-call
      - id: micro-behaviors/ui/window/form-input::browser-json-event-value-send-call
      - id: micro-behaviors/ui/window/form-input::browser-value-socket-send
    near_bytes: 2400

  - id: browser-operator-directed-phishing-flow
    desc: Operator-directed phishing flow routes harvested data among pages
    crit: hostile
    conf: 0.99
    all:
      - id: browser-card-otp-credential-record
      - id: browser-command-route-map
      - id: browser-remote-route-dispatch
    any:
      - id: micro-behaviors/ui/window/form-input::browser-event-value-send-call
      - id: micro-behaviors/ui/window/form-input::browser-json-event-value-send-call
      - id: micro-behaviors/ui/window/form-input::browser-value-socket-send
    near_bytes: 5200

  - id: browser-encrypted-card-otp-channel
    desc: Encrypted browser channel carries payment and second-factor capture
    crit: hostile
    conf: 0.99
    attack: T1056.002,T1111,T1041
    all:
      - id: browser-card-otp-credential-record
      - id: micro-behaviors/communications/websocket/handler::websocket-javascript-constructor
      - id: micro-behaviors/crypto/symmetric/aes/ctr::aes-ctr-algorithm-marker
    any:
      - id: micro-behaviors/ui/window/form-input::browser-event-value-send-call
      - id: micro-behaviors/ui/window/form-input::browser-value-socket-send
    near_bytes: 5200
  - id: browser-remote-route-dispatch
    desc: Dispatches a remote browser route
    crit: suspicious
    conf: 0.96
    # Vendored browser libraries use indexed drawing commands and string
    # replacement for ordinary rendering; keep this phishing-flow inference
    # for application-owned browser code.
    unless:
      - id: metadata/package/files/dependency::node-modules-path
      # VSCodium's editor core owns this generic command/route plumbing;
      # an exact core-bundle path is stronger than archive-wide product context.
      - id: well-known/app/development/vscodium::vscodium-core-bundle-path
    any:
      - id: browser-instruction-index
      - id: browser-command-index
    all:
      # A route index plus navigation is common in charting and application
      # routers. Require the adjacent command-to-page map that gives this
      # behavior its operator-directed meaning.
      - id: browser-command-route-map
      - id: browser-route-navigation
    near_bytes: 500

  - id: browser-host-bridged-operator-channel
    desc: Host-bridged channel steers a live phishing session
    crit: hostile
    conf: 0.98
    attack: T1056.002,T1041,T1566.002
    all:
      - id: browser-host-bridge-mode-flag
      - id: operator-qt-session-websocket-path
      - id: micro-behaviors/communications/websocket/handler::websocket-javascript-constructor
      - id: micro-behaviors/ui/window/form-input::capture-phase-input-listener
    any:
      - id: phaas-final-interface-route
      - id: micro-behaviors/ui/window/form-input::browser-event-value-send-call
      - id: micro-behaviors/ui/window/form-input::browser-json-event-value-send-call
      - id: micro-behaviors/ui/window/form-input::browser-value-socket-send
    near_bytes: 6000
