# Browser phishing kits with a live operator channel.  The kit is more than a
# static form logger: it streams values as they are typed and lets the remote
# operator move the victim among credential, payment-card, and second-factor
# pages.  Match the implementation shape so renamed kits and different brands
# remain covered.
defaults:
  platforms: [unix, windows]
  for: [html, javascript, typescript]
  attack: T1056.002,T1111,T1041,T1566.002
  mbc: B0030

traits:
  - id: browser-host-bridge-mode-flag
    desc: Declares a browser host-bridge phishing mode
    crit: suspicious
    conf: 0.95
    if:
      type: text
      regex: '\bwindow\s*\.\s*__HOST_MODE\b'

  - id: operator-qt-session-websocket-path
    desc: Uses a QT operator session WebSocket path
    crit: suspicious
    conf: 0.96
    if:
      type: text
      regex: '(?i)\bwebSocket/QT/'

  - id: phaas-final-interface-route
    desc: References a PhaaS final-interface harvest route
    crit: suspicious
    conf: 0.95
    if:
      type: text
      regex: '(?i)\bapi/open/the_final_interface\b'

composite_rules:
  - id: browser-live-input-websocket-collection
    desc: Streams browser credential input over a WebSocket
    crit: hostile
    conf: 0.99
    attack: T1056.003,T1041
    all:
      # Capture phase is not required for document-wide form interception;
      # bubble-phase listeners receive the same input events. The generic
      # document listener covers both implementations.
      - id: micro-behaviors/ui/window/form-input::document-input-listener
      - id: micro-behaviors/communications/websocket/handler::websocket-javascript-constructor
      - id: micro-behaviors/ui/controls/credential::browser-login-or-card-otp-fields
    any:
      - id: micro-behaviors/ui/window/form-input::browser-event-value-send-call
      - id: micro-behaviors/ui/window/form-input::browser-json-event-value-send-call
      - id: micro-behaviors/ui/window/form-input::browser-value-read-and-socket-send
    near_bytes: 2400


  - id: browser-worker-live-sensitive-input-collection
    for: [javascript]
    desc: Streams browser payment and authentication input to a Web Worker
    crit: hostile
    conf: 0.99
    attack: T1056.003,T1111
    all:
      - id: micro-behaviors/ui/window/form-input::document-input-listener
      - id: micro-behaviors/ui/controls/credential::browser-login-card-otp-fields
      - id: micro-behaviors/process/create/workers::browser-worker-constructor
      - id: micro-behaviors/communications/ipc/message::postmessage-call
    near_bytes: 3600

  # Bind the received command to the same guarded page-table lookup used
  # by location navigation; local route tables alone are ordinary SPA code.
  - id: browser-operator-directed-phishing-flow
    for: [javascript, typescript]
    desc: Operator-directed phishing flow routes harvested data among pages
    crit: hostile
    conf: 0.99
    all:
      - id: micro-behaviors/ui/controls/credential::browser-login-card-otp-fields
      - id: micro-behaviors/ui/window/navigation::browser-command-route-map
      - id: micro-behaviors/ui/window/navigation::websocket-message-command-page-navigation
    any:
      - id: micro-behaviors/ui/window/form-input::browser-event-value-send-call
      - id: micro-behaviors/ui/window/form-input::browser-json-event-value-send-call
      - id: micro-behaviors/ui/window/form-input::browser-value-read-and-socket-send
    near_bytes: 5200

  - id: browser-encrypted-card-otp-channel
    for: [javascript]
    desc: Encrypted browser channel carries payment and second-factor capture
    crit: hostile
    conf: 0.99
    attack: T1056.003,T1111,T1041
    all:
      - id: micro-behaviors/ui/controls/credential::browser-login-card-otp-fields
      - id: micro-behaviors/communications/websocket/handler::websocket-javascript-constructor
      - id: micro-behaviors/crypto/symmetric/aes/ctr::aes-ctr-algorithm-marker
    any:
      - id: micro-behaviors/ui/window/form-input::browser-event-value-send-call
      - id: micro-behaviors/ui/window/form-input::browser-value-read-and-socket-send
    near_bytes: 5200

  - id: browser-host-bridged-operator-channel
    desc: Host-bridged channel steers a live phishing session
    crit: hostile
    conf: 0.98
    attack: T1056.002,T1041,T1566.002
    all:
      - id: browser-host-bridge-mode-flag
      - id: operator-qt-session-websocket-path
      - id: micro-behaviors/communications/websocket/handler::websocket-javascript-constructor
      - id: micro-behaviors/ui/window/form-input::capture-phase-input-listener
    any:
      - id: phaas-final-interface-route
      - id: micro-behaviors/ui/window/form-input::browser-event-value-send-call
      - id: micro-behaviors/ui/window/form-input::browser-json-event-value-send-call
      - id: micro-behaviors/ui/window/form-input::browser-value-read-and-socket-send
    near_bytes: 6000

# Preserve HTML and local page-routing capture from the former operator rule.
  - id: browser-page-routed-sensitive-input-collection
    desc: Sensitive input sends beside page-command routing
    crit: hostile
    conf: 0.99
    all:
    - id: micro-behaviors/ui/controls/credential::browser-login-card-otp-fields
    - id: micro-behaviors/ui/window/navigation::browser-command-route-map
    - id: micro-behaviors/ui/window/navigation::browser-page-command-dispatch
    any:
    - id: micro-behaviors/ui/window/form-input::browser-event-value-send-call
    - id: micro-behaviors/ui/window/form-input::browser-json-event-value-send-call
    - id: micro-behaviors/ui/window/form-input::browser-value-read-and-socket-send
    near_bytes: 5200
