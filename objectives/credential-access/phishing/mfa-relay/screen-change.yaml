# Live-operator banking PhaaS kits that steer victims through a SCREEN_CHANGE
# WebSocket protocol. Operators push OTP, card, and fake bank-protection screens
# (CODIGO / SMS_COMPRA / PROTECCION_BANCARIA …) before MFA codes expire.
# Match protocol identifiers and transport shape, not Spanish UI copy.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, html]
  attack: T1557,T1111,T1056.002,T1566.002
  mbc: B0030

traits:
  - id: phishing-screen-change-message-type
    desc: Phishing kit SCREEN_CHANGE control message
    crit: suspicious
    conf: 0.96
    if:
      type: text
      regex: '["'']SCREEN_CHANGE["'']|\btype\s*[:=]\s*["'']SCREEN_CHANGE["'']'

  - id: phishing-codigo-screen-id
    desc: Banking PhaaS CODIGO OTP screen id
    crit: component
    conf: 0.9
    if:
      type: text
      word: CODIGO

  - id: phishing-sms-compra-screen-id
    desc: Banking PhaaS SMS_COMPRA OTP screen id
    crit: component
    conf: 0.92
    if:
      type: text
      word: SMS_COMPRA

  - id: phishing-bank-protection-apk-screen-id
    desc: Fake bank-protection APK lure screen id
    crit: suspicious
    conf: 0.96
    if:
      type: text
      word: PROTECCION_BANCARIA

  - id: phishing-cardless-withdrawal-screen-id
    desc: Cardless withdrawal cancellation screen id
    crit: component
    conf: 0.92
    if:
      type: text
      word: CANCELACION_RETIRO

  - id: phishing-card-qr-scan-screen-id
    desc: Physical-card QR scan screen id
    crit: component
    conf: 0.92
    if:
      type: text
      word: ESCANEAR_QR

  - id: phishing-balance-protection-screen-id
    desc: Balance-protection harvest screen id
    crit: component
    conf: 0.9
    if:
      type: text
      word: PROTECCION_SALDO

  - id: phishing-id-verification-screen-id
    desc: ID/selfie camera harvest screen id
    crit: notable
    conf: 0.94
    if:
      type: text
      word: VERIFICACION_ID

composite_rules:
  - id: phishing-banking-otp-screen-ids
    desc: Banking PhaaS OTP and purchase-OTP screen ids
    crit: suspicious
    conf: 0.97
    near_bytes: 900
    all:
      - id: phishing-codigo-screen-id
      - id: phishing-sms-compra-screen-id

  - id: banking-phaas-screen-catalog
    desc: Banking PhaaS operator screen-id catalog
    crit: suspicious
    conf: 0.98
    near_bytes: 2400
    all:
      - id: phishing-banking-otp-screen-ids
      - id: phishing-bank-protection-apk-screen-id
    any:
      - id: phishing-cardless-withdrawal-screen-id
      - id: phishing-card-qr-scan-screen-id
      - id: phishing-balance-protection-screen-id
      - id: phishing-id-verification-screen-id

  - id: websocket-banking-screen-change-aitm
    desc: WebSocket SCREEN_CHANGE relays banking MFA screens
    crit: hostile
    conf: 0.99
    attack: T1557,T1111,T1056.002,T1041
    near_bytes: 6000
    all:
      - id: micro-behaviors/communications/websocket/handler::websocket-javascript-constructor
      - id: phishing-screen-change-message-type
      - id: phishing-banking-otp-screen-ids
      - id: phishing-bank-protection-apk-screen-id
    any:
      - id: micro-behaviors/communications/websocket/endpoints::relative-ws-endpoint-path
      - id: micro-behaviors/communications/socket/send::javascript-socket-send
      - id: micro-behaviors/ui/window/form-input::browser-event-value-send-call
