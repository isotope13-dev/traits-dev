# AiTM phishlets can force the provider's persistent-session option and submit
# it before the victim can decline. The DOM identifiers are Microsoft Entra
# authentication controls; the hostile conclusion also requires a phishlet
# that captures authenticated session cookies.
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript, html, scripts, source, text]
  attack: T1539,T1550.004,T1557
  mbc: B0030

traits:
  - id: entra-kmsi-checkbox-auto-click
    desc: Programmatically clicks the Entra KMSI checkbox
    crit: suspicious
    conf: 0.98
    if:
      type: text
      regex: '(?s)KmsiCheckboxField.{0,260}\b[A-Za-z_$][A-Za-z0-9_$]*\.click\s*\('

  - id: entra-signin-submit-delayed-click
    desc: Schedules an automatic Entra sign-in submission
    crit: suspicious
    conf: 0.98
    if:
      type: text
      regex: 'idSIButton9[''"]\)\??\.click\(\),\s*[1-9][0-9]{1,3}\)'

composite_rules:
  - id: phishlet-kmsi-session-extension
    desc: Phishlet forces persistent Entra session creation
    crit: hostile
    conf: 0.99
    all:
      - id: phishlet-session-cookie-relay
      - id: phishlet-javascript-injection-section
      - id: entra-kmsi-checkbox-auto-click
      - id: entra-signin-submit-delayed-click
    near_lines: 180
