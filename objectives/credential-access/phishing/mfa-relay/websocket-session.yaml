# AiTM phishing loaders that open a WebSocket, scrape password + MFA fields on
# submit, and ship session cookies with the harvested record. Distinct from
# live-operator keystroke streaming: the sink is a form-submit harvest plus
# cookie theft over the same socket (Mirage2FA-class session hijack).
defaults:
  platforms: [windows, unix]
  for: [html, javascript, typescript]
  attack: T1557,T1539,T1056.002,T1111
  mbc: B0030

composite_rules:
  - id: websocket-credential-mfa-cookie-relay
    desc: WebSocket relays password, MFA code, and session cookies
    crit: hostile
    conf: 0.99
    attack: T1557,T1539,T1056.002,T1111,T1041
    all:
      - id: micro-behaviors/communications/websocket/handler::websocket-javascript-constructor
      - id: micro-behaviors/communications/http/form::form-submit-listener
      - id: micro-behaviors/ui/window/form-input::browser-credential-field-pair
      - id: micro-behaviors/ui/window/form-input::entra-otc-field-reference
      - id: micro-behaviors/communications/http/cookies::browser-document-cookie-read
      - id: micro-behaviors/communications/http/cookies::cookie-json-send-call
    near_bytes: 2800
