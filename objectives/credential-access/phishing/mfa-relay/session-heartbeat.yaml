# Live-operator phishing-kit session loop.
#
# Kits in the Doko / Work Panel class keep an open session with a PHP backend
# by posting {action: ping|heartbeat, token, window_id, ...} on a timer and
# navigating the victim when the response carries a redirect. The randomized
# backend filename (backend.php, api_<build>.php) is not part of the shape —
# only the action vocabulary, window id, and operator-directed navigation are.
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript, html]
  attack: T1056.002,T1111,T1566.002
  mbc: B0030

traits:
  # Split leading/trailing-comma forms so each regex stays under the 90-byte
  # limit. A lone `{action:'ping'}` is a WebExtension health check; Doko kits
  # always include sibling fields (token, window_id, …).
  - id: phishing-kit-session-ping-before-comma
    desc: Session ping action before sibling field
    crit: component
    conf: 0.94
    if:
      type: text
      regex: '(["'']action["'']|\baction)\s*[:=]\s*["'']ping["'']\s*,'

  - id: phishing-kit-session-ping-after-comma
    desc: Session ping action after sibling field
    crit: component
    conf: 0.94
    if:
      type: text
      regex: ',\s*(["'']action["'']|\baction)\s*[:=]\s*["'']ping["'']'

  - id: phishing-kit-session-heartbeat-before-comma
    desc: Session heartbeat before sibling field
    crit: component
    conf: 0.94
    if:
      type: text
      regex: '(["'']action["'']|\baction)\s*[:=]\s*["'']heartbeat["'']\s*,'

  - id: phishing-kit-session-heartbeat-after-comma
    desc: Session heartbeat after sibling field
    crit: component
    conf: 0.94
    if:
      type: text
      regex: ',\s*(["'']action["'']|\baction)\s*[:=]\s*["'']heartbeat["'']'

  - id: phishing-kit-check-redirect-action
    desc: Phishing kit polls a check_redirect action
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: '(?i)\bcheck_redirect\b'

composite_rules:
  - id: phishing-kit-session-ping-action
    desc: Phishing kit posts a session ping action
    crit: notable
    conf: 0.94
    any:
      - id: phishing-kit-session-ping-before-comma
      - id: phishing-kit-session-ping-after-comma

  - id: phishing-kit-session-heartbeat-action
    desc: Phishing kit posts a session heartbeat action
    crit: notable
    conf: 0.94
    any:
      - id: phishing-kit-session-heartbeat-before-comma
      - id: phishing-kit-session-heartbeat-after-comma

  - id: phishing-kit-session-action
    desc: Phishing kit session ping or heartbeat action
    crit: component
    conf: 0.94
    any:
      - id: phishing-kit-session-ping-action
      - id: phishing-kit-session-heartbeat-action
      - id: phishing-kit-check-redirect-action

  - id: phishing-kit-operator-session-loop
    desc: Phishing kit loops session heartbeats and follows operator redirects
    crit: hostile
    conf: 0.98
    near_bytes: 4000
    all:
      - id: micro-behaviors/data/serialize/session-json::window-id-field
      - id: micro-behaviors/ui/window/manage/dom::browser-location-href-assign
      - id: phishing-kit-session-action
    any:
      - id: micro-behaviors/communications/http/request/client::js-fetch-call
      - id: micro-behaviors/communications/http/request/html::html-fetch-call
