# Live-operator phishing-kit session loop.
#
# Kits in the Doko / Work Panel class keep an open session with a PHP backend
# by posting {action: ping|heartbeat, token, window_id, ...} on a timer and
# navigating the victim when the response carries a redirect. The randomized
# backend filename (backend.php, api_<build>.php) is not part of the shape —
# only the action vocabulary, window id, and operator-directed navigation are.
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript, html]
  attack: T1056.002,T1111,T1566.002
  mbc: B0030

traits:
  - id: phishing-kit-session-ping-action
    desc: Phishing kit posts a session ping action
    crit: notable
    conf: 0.94
    if:
      type: text
      # Case-sensitive lowercase: Doko-class kits post action:"ping". Uppercase
      # PING/HEARTBEAT are routine WebExtension message enums (watch-party sync).
      regex: '(["'']action["'']|\baction)\s*[:=]\s*["'']ping["'']'

  - id: phishing-kit-session-heartbeat-action
    desc: Phishing kit posts a session heartbeat action
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: '(["'']action["'']|\baction)\s*[:=]\s*["'']heartbeat["'']'

  - id: phishing-kit-check-redirect-action
    desc: Phishing kit polls a check_redirect action
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: '(?i)\bcheck_redirect\b'

  - id: phishing-kit-window-id-field
    desc: Phishing kit carries a window_id session field
    crit: notable
    conf: 0.92
    if:
      type: text
      regex: '(?i)\bwindow_id\b'

  - id: phishing-kit-redirect-field
    desc: Reads an operator redirect response field
    crit: component
    conf: 0.9
    if:
      type: text
      regex: '(?i)\.redirect\b|\[["'']redirect["'']\]'

  - id: phishing-kit-location-navigation
    desc: Assigns browser location for navigation
    crit: component
    conf: 0.9
    if:
      type: text
      regex: '(?i)\blocation\s*\.\s*(href|assign|replace)\b'

composite_rules:
  - id: phishing-kit-redirect-navigation
    desc: Navigates after an operator redirect field
    crit: notable
    conf: 0.94
    near_bytes: 120
    all:
      - id: phishing-kit-redirect-field
      - id: phishing-kit-location-navigation

  - id: phishing-kit-session-http-transport
    desc: Phishing kit session loop uses browser HTTP fetch
    crit: component
    conf: 0.9
    any:
      - id: micro-behaviors/communications/http/request/client::js-fetch-call
      - id: micro-behaviors/communications/http/request/html::html-fetch-call

  - id: phishing-kit-session-action
    desc: Phishing kit session ping or heartbeat action
    crit: component
    conf: 0.94
    any:
      - id: phishing-kit-session-ping-action
      - id: phishing-kit-session-heartbeat-action
      - id: phishing-kit-check-redirect-action

  - id: phishing-kit-operator-session-loop
    desc: Phishing kit loops session heartbeats and follows operator redirects
    crit: hostile
    conf: 0.98
    near_bytes: 4000
    all:
      - id: phishing-kit-window-id-field
      - id: phishing-kit-redirect-navigation
      - id: phishing-kit-session-http-transport
      - id: phishing-kit-session-action
