# Backend authentication relay behavior described in the article. These rules
# intentionally match API workflow structure rather than provider names or
# campaign-specific keys.
defaults:
  platforms: [windows, unix]
  for: [python]
  attack: T1056.002,T1556.006
  mbc: B0030

traits:
  - id: python-login-field
    desc: Python login field in a request payload
    crit: component
    conf: 0.88
    if:
      type: text
      regex: '(?i)\b(data|payload)\s*=\s*\{[^{}\n]{0,180}["''](login|username)["'']\s*:'

  - id: python-password-field
    desc: Python password field in a request payload
    crit: component
    conf: 0.88
    if:
      type: text
      regex: '(?i)\b(data|payload)\s*=\s*\{[^{}\n]{0,180}["''](password|passwd|pass)["'']\s*:'

  - id: captcha-client-key
    desc: CAPTCHA solver client key
    crit: component
    conf: 0.9
    if:
      type: text
      regex: '(?i)client[_-]?key'

  - id: captcha-task-marker
    desc: CAPTCHA solver task marker
    crit: component
    conf: 0.9
    if:
      type: text
      regex: '(?i)(create[_-]?task|recaptcha|captcha)'

  - id: captcha-site-field
    desc: CAPTCHA target site field
    crit: component
    conf: 0.9
    if:
      type: text
      regex: '(?i)website[_-]?(url|key)'

  - id: captcha-result-marker
    desc: CAPTCHA result polling marker
    crit: component
    conf: 0.9
    if:
      type: text
      regex: '(?i)(get[_-]?task[_-]?result|task[_-]?result|res\.php)'

  - id: captcha-task-id
    desc: CAPTCHA task ID field
    crit: component
    conf: 0.9
    if:
      type: text
      regex: '(?i)task[_-]?id'

  # Word-bounded app-password field names only. An unbounded `imap` alternative
  # matched every `IMap`/`IMapWindow` identifier (it fired across GRASS GIS's
  # wxPython UI) and duplicated the real protocol atoms in
  # micro-behaviors/communications/email/access/imap/.
  - id: mailbox-password-path
    desc: Mailbox app-password field name
    crit: notable
    conf: 0.94
    unless:
      - id: well-known/app/productivity/keepercommander/
      - id: well-known/app/development/specterqa-ios::credential-context-class
    if:
      type: text
      regex: '(?i)["'']app[_-]?(pwds?|password)["'']\s*[:=]'

  # Quoted payload key only. A bare `raw_password` token is an ordinary
  # identifier: Werkzeug's URL parser exposes `def raw_password(self)` for the
  # userinfo half of `scheme://user:pass@host`, which the unanchored spelling
  # convicted as mailbox credential theft. The mailbox intent comes from the
  # `mailbox-password-path` leg of the composite, not from this field name.
  - id: raw-password-payload-field
    desc: Plaintext raw_password key in a request payload
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: '(?i)["'']raw[_-]?password["'']\s*[:=]'

  - id: mailbox-file-name
    desc: Mailbox credential filename
    crit: component
    conf: 0.9
    if:
      type: text
      regex: '(?i)open\s*\([^)]{0,100}(imap|mail|password)'

  - id: python-append-mode
    desc: Python append file mode
    crit: component
    conf: 0.9
    if:
      type: text
      regex: '(?i)open\s*\([^)]{0,180},\s*["'']a["'']'

  - id: mailbox-sender-field
    desc: Mailbox sender field
    crit: component
    conf: 0.9
    if:
      type: text
      regex: '(?i)["'']from["'']|\.from\b'

  - id: noreply-sender-address
    desc: No-reply sender address
    crit: notable
    conf: 0.9
    unless:
      - id: well-known/app/productivity/keepercommander/
    if:
      type: text
      regex: '(?i)(noreply|no-reply)@[A-Za-z0-9._-]{1,80}'

composite_rules:
  - id: python-captcha-solver-api
    desc: Python CAPTCHA solver workflow
    crit: suspicious
    conf: 0.97
    all:
      - id: captcha-client-key
      - id: captcha-task-marker
      - id: captcha-site-field
      - id: captcha-result-marker
      - id: captcha-task-id
    near_bytes: 900

  - id: python-mailbox-password-generation
    desc: Mailbox app-password generation
    crit: suspicious
    conf: 0.96
    all:
      - id: mailbox-password-path
      - id: raw-password-payload-field
    near_bytes: 420

  - id: python-mailbox-credential-file
    desc: Mailbox credential file write
    crit: suspicious
    conf: 0.94
    all:
      - id: mailbox-file-name
      - id: python-append-mode
    near_bytes: 260

  - id: mailbox-notification-filter
    desc: Mailbox no-reply notification filter
    crit: notable
    conf: 0.92
    all:
      - id: mailbox-sender-field
      - id: noreply-sender-address
    near_bytes: 180

  - id: python-authentication-relay
    desc: Python auth relay
    crit: hostile
    conf: 0.99
    attack: T1056.002,T1556.006,T1566.002
    all:
      - id: micro-behaviors/communications/http/lib/requests::requests-post
      - id: micro-behaviors/communications/http/auth::python-auth-endpoint-url
      - id: python-login-field
      - id: python-password-field
      - id: python-captcha-solver-api
    near_bytes: 2200

  - id: python-mailbox-credential-access
    desc: Mailbox access after auth relay
    crit: hostile
    conf: 0.99
    attack: T1056.002,T1556.006,T1078
    all:
      - id: python-authentication-relay
      - id: python-mailbox-password-generation
      - id: python-mailbox-credential-file
    near_bytes: 2600

  - id: python-mailbox-notification-suppression
    desc: Mailbox notification suppression
    crit: hostile
    conf: 0.98
    attack: T1070.008,T1056.002
    all:
      - id: mailbox-notification-filter
      - id: micro-behaviors/data/manipulation::message-collection-remove-call
      - id: micro-behaviors/communications/http/lib/requests::requests-post
    near_bytes: 900
