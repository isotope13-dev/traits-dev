# Front-end indicators for a phishing relay that uses an exposed router or
# other numeric-IP host as its CAPTCHA/authentication backend.
defaults:
  platforms: [windows, unix]
  for: [html, javascript, typescript]
  attack: T1566.002,T1056.002
  mbc: B0030

traits:

  - id: captcha-endpoint-path
    desc: CAPTCHA endpoint path
    crit: component
    conf: 0.88
    if:
      type: text
      regex: '(?i)/(captcha|recaptcha)\b'

composite_rules:
  - id: numeric-router-captcha-endpoint
    desc: Numeric host CAPTCHA request
    crit: suspicious
    conf: 0.95
    all:
      - id: micro-behaviors/communications/ip/literal::external-ipv4-url-script
      - id: captcha-endpoint-path
      - id: micro-behaviors/communications/http/client/xmlhttp::js-request-object-open-call
    near_bytes: 240

  - id: router-backed-credential-relay
    desc: Router-backed credential relay
    crit: hostile
    conf: 0.99
    attack: T1056.002,T1566.002
    all:
      - id: numeric-router-captcha-endpoint
      - id: micro-behaviors/ui/window/form-input::browser-credential-field-pair
    any:
      - id: micro-behaviors/communications/http/post::html-form-post-method
      - id: micro-behaviors/communications/http/request/client::fetch-post-pattern
      - id: micro-behaviors/communications/http/request/html::html-fetch-post-call
    near_lines: 100

  - id: router-backed-mfa-relay
    desc: Router-backed MFA relay
    crit: hostile
    conf: 0.99
    attack: T1056.002,T1566.002
    all:
      - id: numeric-router-captcha-endpoint
      - id: micro-behaviors/communications/http/form::browser-two-factor-absolute-post
    near_lines: 180
