# Front-end indicators for a phishing relay that uses an exposed router or
# other numeric-IP host as its CAPTCHA/authentication backend.
defaults:
  platforms: [windows, unix]
  for: [html, javascript, typescript]
  attack: T1566.002,T1056.002
  mbc: B0030

traits:
  - id: numeric-ip-url
    desc: Numeric IP URL
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)https?://(\d{1,3}\.){3}\d{1,3}(:\d{2,5})?'

  - id: captcha-endpoint-path
    desc: CAPTCHA endpoint path
    crit: component
    conf: 0.88
    if:
      type: text
      regex: '(?i)/(captcha|recaptcha)\b'

composite_rules:
  - id: numeric-router-captcha-endpoint
    desc: Numeric host CAPTCHA request
    crit: suspicious
    conf: 0.95
    all:
      - id: numeric-ip-url
      - id: captcha-endpoint-path
      - id: micro-behaviors/communications/http/client/xmlhttp::js-request-object-open-call
    near_bytes: 240

  - id: router-backed-credential-relay
    desc: Router-backed credential relay
    crit: hostile
    conf: 0.99
    attack: T1056.002,T1566.002
    all:
      - id: numeric-router-captcha-endpoint
      - id: objectives/credential-access/phishing/captive-portal::portal-credential-field-pair
      - id: objectives/credential-access/phishing/mfa-relay::browser-post-request
    near_lines: 100

  - id: router-backed-mfa-relay
    desc: Router-backed MFA relay
    crit: hostile
    conf: 0.99
    attack: T1056.002,T1566.002
    all:
      - id: numeric-router-captcha-endpoint
      - id: objectives/credential-access/phishing/mfa-relay::two-stage-mfa-collection
    near_lines: 180
