composite_rules:
  - id: live-otp-input-emission
    desc: OTP field with live socket input capture
    crit: suspicious
    conf: 0.9
    for: [javascript, typescript, html]
    platforms: [unix, windows]
    near_bytes: 1000
    all:
      - id: micro-behaviors/communications/websocket/handler::socketio-url-connect
      - id: micro-behaviors/ui/window/form-input::otp-autocomplete-selector
      - id: micro-behaviors/ui/window/form-input::edit-handler-emits-value
