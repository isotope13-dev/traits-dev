# Scripted capture of Microsoft Entra ID sign-in form fields.
#
# The Entra sign-in flow uses fixed field names across every tenant:
# `loginfmt` for the account name, `passwd` for the password, and `otc` for the
# one-time code prompted at the second factor. A kit that reproduces or proxies
# that page reads the values straight out of those named inputs.
#
# Referencing the names is not by itself an attack — browser automation that
# signs a service account into Microsoft 365 drives the same fields. The hostile
# composite therefore requires what automation does not do: read the account
# name, the password, and the second-factor code, and send them to a collector
# that is not the identity provider.
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript, html]
  crit: notable
  conf: 0.9
  attack: T1056.002
  mbc: B0030

traits:
  - id: entra-loginfmt-field-reference
    desc: References the Entra loginfmt account field
    if:
      type: text
      word: loginfmt
  # Kits reach these fields two ways: the rendered `name=` attribute on a cloned
  # page, and a bare field-name string passed to a selector on a proxied one.
  # `otc` and `passwd` are short enough to collide with unrelated text, so the
  # script-side form is matched as a parsed string constant rather than by
  # substring — that keeps it off comments, prose, and `/etc/passwd` paths.
  - id: entra-otc-markup-field
    desc: Markup names the Entra otc code field
    conf: 0.88
    if:
      type: text
      regex: '(?i)name\s*=\s*["'']?otc\b'
  - id: entra-otc-literal-field
    desc: String constant names the Entra otc field
    conf: 0.86
    if:
      type: literal
      kind: string
      exact: otc
  - id: entra-passwd-markup-field
    desc: Markup names the Entra passwd field
    conf: 0.85
    if:
      type: text
      regex: '(?i)name\s*=\s*["'']?passwd\b'
  - id: entra-passwd-literal-field
    desc: String constant names the passwd field
    conf: 0.8
    if:
      type: literal
      kind: string
      exact: passwd

composite_rules:
  - id: entra-otc-field-reference
    desc: References the Entra one-time-code field
    crit: notable
    conf: 0.88
    any:
      - id: entra-otc-markup-field
      - id: entra-otc-literal-field

  - id: entra-passwd-field-reference
    desc: References the Entra passwd field
    crit: notable
    conf: 0.85
    any:
      - id: entra-passwd-markup-field
      - id: entra-passwd-literal-field

  - id: entra-signin-field-capture
    desc: Reads Entra account, password and code fields
    crit: suspicious
    conf: 0.94
    needs: 3
    any:
      - id: entra-loginfmt-field-reference
      - id: entra-otc-field-reference
      - id: entra-passwd-field-reference

  # Account name, password, second-factor code and the browser's cookies, all
  # collected together and posted somewhere that is not the identity provider.
  - id: entra-credential-mfa-exfiltration
    desc: Exfiltrates Entra credentials, code and cookies
    crit: hostile
    conf: 0.97
    attack: T1056.002,T1539,T1041,T1111
    all:
      - id: entra-signin-field-capture
      - id: micro-behaviors/communications/http/cookies::document-cookie-read
    needs: 1
    any:
      - id: micro-behaviors/communications/http/request/beacon::browser-send-beacon
      - id: micro-behaviors/communications/http/post::fetch-post-call
      - id: micro-behaviors/communications/http/request/client::fetch-post-pattern
    unless:
      - id: well-known/tool/detection/
      - id: metadata/package/testing/presence/fixture/
