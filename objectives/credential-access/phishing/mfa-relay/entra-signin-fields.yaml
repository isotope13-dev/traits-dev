# The field observations live in the neutral form-input capability tier. This
# file keeps only the intent-bearing composite that combines them with cookie
# access and an explicitly off-origin submission.
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript, html]
  attack: T1056.002
  mbc: B0030

composite_rules:
  # Account name, password, second-factor code and the browser's cookies, all
  # collected together and posted somewhere that is not the serving origin.
  - id: entra-credential-mfa-exfiltration
    desc: Exfiltrates Entra credentials, code and cookies
    crit: hostile
    conf: 0.97
    attack: T1056.002,T1539,T1041,T1111
    all:
      - id: micro-behaviors/ui/window/form-input::entra-signin-field-set
      - id: micro-behaviors/communications/http/cookies::browser-document-cookie-read
      - id: micro-behaviors/communications/http/form::browser-absolute-submission-target
    needs: 1
    any:
      - id: micro-behaviors/communications/http/request/beacon::browser-send-beacon
      - id: micro-behaviors/communications/http/post::fetch-post-call
      - id: micro-behaviors/communications/http/request/client::fetch-post-pattern
      - id: micro-behaviors/communications/http/request/html::html-fetch-post-call
    unless:
      - id: well-known/tool/detection/
      - id: metadata/package/testing/presence/fixture/
