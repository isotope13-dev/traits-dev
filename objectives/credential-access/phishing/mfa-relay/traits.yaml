defaults:
  platforms: [windows, unix]
  # Web authentication forms are also commonly embedded in TypeScript sources.
  for: [html, javascript, typescript, php]
  attack: T1566.002
  mbc: B0030

# Browser phishing kits relay first-factor credentials, display a second-factor
# page, relay the code, and then redirect the victim to the real site. Keep the
# atoms structural so the same technique is covered across web implementations.
# The second-factor input atoms (`html-otp-input-field`,
# `html-verification-input-field`, `js-mfa-field-selector`) describe ordinary
# authentication markup — the real identity provider renders the same box — so
# they now live at micro-behaviors/ui/window/form-input/mfa.yaml together with
# their `browser-mfa-field-reference` umbrella. The composites below reference
# them and add the phishing evidence.
traits:
- id: php-redirect-variable
  desc: PHP redirect uses a variable
  crit: notable
  conf: 0.9
  for: [php]
  if:
    type: text
    regex: '(?is)location\.(replace|assign)\s*\([^)]{0,260}\$[A-Za-z_][A-Za-z0-9_]*'
- id: hidden-list-container
  desc: Hidden list markup outside common navigation
  crit: component
  conf: 0.9
  if:
    type: text
    regex: '(?is)(display\s*:\s*none|hidden\b)[\s\S]{0,200}<li\b'
  unless:
  - type: text
    regex: '(?i)(navbar|dropdown-menu|menuDropArrow|headerMenu)'
- id: provider-help-login-link
  desc: Provider help login link
  crit: notable
  conf: 0.9
  if:
    type: text
    regex: '(?i)<a\b.{0,160}href\s*=\s*["'']https?://.{0,100}/help/login'
- id: provider-help-link-marker
  desc: Provider help-link HTML marker
  crit: component
  conf: 0.9
  if:
    type: text
    regex: '(?i)(data-se\s*=\s*["'']help-link["'']|class\s*=\s*["''].{0,80}js-help-link)'

# The report identifies SVG attachments that redirect through either a
# xlink:href target or inline JavaScript. The xlink half is a neutral
# navigation fact — draw.io and Inkscape exports carry it — so it lives in
# micro-behaviors/data/format/html/svg-elements.yaml; the authentication-path
# composite below supplies the attack context.

# A bare `location=` spelling matched XML/XSD import attributes
# (`<xs:import ... location="http://www.w3.org/1999/xlink.xsd">` in the W3C
# XLink schema shipped by OpenSCAP), which are markup, not script navigation.
# Requiring the member-access form (`window.location`, `location.href`,
# `location.replace`) keeps every scripted-redirect spelling and drops the
# attribute.
- id: svg-location-external-assignment
  desc: SVG script assigns location to external URL
  crit: suspicious
  conf: 0.94
  for: [svg]
  if:
    type: text
    regex: '(?i)(\.location|location\.(href|replace))\s*(=|\()\s*["'']https?://'

- id: svg-authentication-endpoint-path
  desc: SVG contains an authentication endpoint path
  crit: notable
  conf: 0.9
  for: [svg]
  if:
    type: text
    regex: '(?i)/(common/(GetCredentialType|SAS/BeginAuth)|oauth2/v2\.0/authorize)\b'

composite_rules:
# `browser-credential-field-reference`, `browser-mfa-field-reference` and
# `browser-external-redirect` were neutral capability umbrellas — a password
# box, a code box, a cross-origin navigation — filed here, where the directory
# supplied a phishing claim none of their matchers tested. They now live under
# micro-behaviors/ (ui/window/form-input/ and ui/window/manage/navigation/) and
# are referenced from there.
- id: hidden-provider-help-link
  desc: Hidden provider help link
  crit: suspicious
  conf: 0.96
  all:
  - id: hidden-list-container
  - id: provider-help-login-link
  - id: provider-help-link-marker
  near_bytes: 700
- id: php-parameterized-external-redirect
  desc: PHP request-token redirector forwards to an external page
  crit: hostile
  conf: 0.98
  attack: T1566.002,T1041
  for: [php]
  all:
  - id: micro-behaviors/communications/http/response::php-inline-external-javascript-redirect
  - id: php-redirect-variable
  - id: micro-behaviors/communications/http/request/params::get-dup
  near_bytes: 1400
# A first-party sign-in page can still use an absolute form target and redirect
# to its own application. What it does not ordinarily do is hand the victim on
# to somebody *else's* identity provider after
# taking the password, scrape the session cookie, or sit on a domain that
# advertises passkey/SSO enrollment. One of those is required before this is
# called a relay.
- id: credential-mfa-relay-redirect
  desc: Collects password and MFA code then redirects to a provider sign-in
  crit: hostile
  conf: 0.99
  attack: T1056.002,T1041,T1566.002
  all:
  - id: micro-behaviors/communications/http/form::browser-two-factor-absolute-post
  - id: micro-behaviors/ui/window/manage/navigation::browser-external-redirect
  needs: 1
  any:
  - id: micro-behaviors/communications/http/cookies::browser-document-cookie-read
  - id: micro-behaviors/communications/http/oauth::microsoft-login
  - id: micro-behaviors/communications/http/oauth::google-accounts
  - id: objectives/credential-access/phishing/credential::social-engineering-auth-domain-pattern
  near_lines: 180

- id: credential-mfa-relay-with-focus-lock
  desc: Credential and MFA relay traps focus in the password field
  crit: hostile
  conf: 0.99
  attack: T1056.002,T1111,T1566.002
  all:
  - id: credential-mfa-relay-redirect
  - id: micro-behaviors/ui/window/form-input::password-focus-call
  - id: micro-behaviors/time/schedule/interval::timer-call-reference
  near_lines: 220
- id: hidden-help-link-mfa-kit
  desc: Hidden help-link MFA phishing kit
  crit: hostile
  conf: 0.99
  attack: T1056.002,T1566.002
  all:
  - id: hidden-provider-help-link
  - id: micro-behaviors/communications/http/form::browser-two-factor-absolute-post

# HTML attachments in the report execute JavaScript to render the relay page.
# External script loading is neutral on its own, so the attack interpretation
# is kept alongside the credential/MFA relay and post-auth navigation.
- id: html-attachment-mfa-relay
  desc: HTML attachment loads external script for credential and MFA relay
  crit: hostile
  conf: 0.98
  attack: T1056.002,T1041,T1566.002
  for: [html]
  all:
  - id: credential-mfa-relay-redirect
  any:
  - id: micro-behaviors/communications/http/client/resource::external-script-element-load
  - id: micro-behaviors/communications/http/client/resource::jquery-getscript-load
  near_lines: 80

- id: svg-auth-xlink-redirect
  desc: SVG xlink navigation targets an authentication endpoint
  crit: hostile
  conf: 0.97
  attack: T1056.002,T1041,T1566.002
  for: [svg]
  all:
  - id: micro-behaviors/data/format/html::svg-external-xlink-link
  - id: svg-authentication-endpoint-path
  near_bytes: 1600

- id: svg-auth-script-redirect
  desc: SVG script redirects to an authentication endpoint
  crit: hostile
  conf: 0.97
  attack: T1056.002,T1041,T1566.002
  for: [svg]
  all:
  - id: svg-location-external-assignment
  - id: svg-authentication-endpoint-path
  near_bytes: 1800
  near_lines: 180

# Some live AiTM kits use Beacon for the primary credential submission and
# retain XHR as a fallback.  Beacon is neutral telemetry by itself; pairing it
# with both first- and second-factor form references and a post-auth redirect
# identifies the relay workflow without depending on a kit-specific route.
- id: browser-sendbeacon-credential-mfa-relay
  desc: Browser credentials and MFA sent via Beacon relay
  crit: hostile
  conf: 0.99
  attack: T1056.002,T1111,T1041,T1566.002
  for: [html, javascript, typescript]
  all:
  - id: micro-behaviors/ui/window/form-input::browser-credential-field-reference
  - id: micro-behaviors/ui/window/form-input::browser-mfa-field-reference
  - id: micro-behaviors/communications/http/request/beacon::browser-send-beacon-call
  - id: micro-behaviors/ui/window/manage/navigation::browser-external-redirect
  near_lines: 180
