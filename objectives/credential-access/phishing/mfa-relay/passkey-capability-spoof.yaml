# The inverse of webauthn-downgrade.yaml: instead of hiding WebAuthn so the
# identity provider falls back to a relayable factor, the script tells the
# site the device has a user-verifying platform authenticator so it pushes the
# victim into a passkey challenge the operator is driving. Seen in the
# "PDF Identity Verifier" / "ID-less pay" Firefox add-on
# (pdf-para-texto@extensao.local, v2.3), which patched these checks on
# google.com while it automated Google sign-in and password reset.
#
# Passkey managers replace the same checks, but only as part of their own
# navigator.credentials.create/get implementation. A script that answers
# "yes, passkeys work here" without providing any credentials is lying to
# the page.
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
  attack: T1111
  mbc: B0030

composite_rules:
  - id: webauthn-capability-spoof
    desc: Fakes passkey support without a credential API
    crit: suspicious
    conf: 0.9
    ref: sha256:066016c5125772ae9a521a3393ebec3feedd2c56717ee9f90c1460d3db02deb2
    any:
      - id: micro-behaviors/os/security/auth/passkey::webauthn-capability-check-override
      - id: micro-behaviors/os/security/auth/passkey::webauthn-client-capabilities-override
    unless:
      - id: micro-behaviors/os/security/auth/passkey::navigator-credentials-reference
