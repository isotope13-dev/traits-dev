defaults:
  platforms: [unix, windows]
  for: [javascript]
  attack: T1566.002

traits:
  - id: js-onedrive-verification-title
    desc: Presents OneDrive verification page
    crit: notable
    if:
      type: text
      substr: '<title>OneDrive Verification</title>'

  - id: js-microsoft-session-expired
    desc: Prompts for Microsoft session renewal
    crit: notable
    if:
      type: text
      substr: 'Session timed out. Please sign in again to continue.'

  - id: js-optoi-login-redirect
    desc: Redirects visitor to Optoi login endpoint
    crit: suspicious
    if:
      type: text
      regex: 'window\.location\.href\s*=\s*["'']https://login\.optoi\.sbs/'

composite_rules:
  - id: js-onedrive-verification-phishing-redirect
    desc: Fake OneDrive verification redirects to login
    crit: hostile
    conf: 0.99
    scope: file
    all:
      - id: js-onedrive-verification-title
      - id: js-microsoft-session-expired
      - id: js-optoi-login-redirect
      - id: micro-behaviors/ui/window/dom/render::document-write-html
