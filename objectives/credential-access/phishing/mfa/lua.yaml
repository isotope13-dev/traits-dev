defaults:
  for:
    - "lua"
  platforms:
    - "unix"
    - "windows"
traits:
  - id: "lua-mfa-portal-pressure-message"
    desc: "Lua message demands MFA token at portal"
    crit: "notable"
    conf: 0.96
    if:
      type: "literal"
      regex: "(?is)entering your MFA token.{1,100}https://"
  - id: lua-mfa-lure-to-process-input
    desc: Writes MFA lure to process stdin
    crit: notable
    conf: 0.98
    if:
      type: symbol
      kind: call
      regex: '(^|\.)write$'
      receiver:
        from:
          call: '^io\.popen$'
      arg:
        index: 0
        from:
          call: '^string\.format$'
          argument: 0
          literal: '(?is)entering your MFA token.{1,100}https://'
composite_rules:
  - id: "lua-mfa-phishing-terminal-delivery"
    desc: "Lua writes an MFA-token lure to a process beside secret-file upload"
    crit: "hostile"
    conf: 0.97
    all:
      - id: "lua-mfa-portal-pressure-message"
      - id: lua-mfa-lure-to-process-input
      - id: "objectives/exfiltration/stealer/credential/raw-file::lua-secret-file-http-upload"
