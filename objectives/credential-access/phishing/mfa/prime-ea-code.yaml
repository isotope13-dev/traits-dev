# Second-factor capture is distinct from the password lure. This does not claim
# a backend AiTM proxy or successful authentication; neither was recovered.
defaults:
  platforms: [unix, windows]
  for: [html]
composite_rules:
  - id: prime-ea-otp-capture
    desc: Prime EA password lure also captures OTP
    crit: hostile
    conf: 0.98
    attack: T1111
    near_bytes: 6000
    all:
      - id: objectives/credential-access/phishing/lure::prime-ea-password-capture
      - id: micro-behaviors/ui/window/otp-field::html-one-time-code-autocomplete
      - id: micro-behaviors/ui/window/otp-field::otp-dom-value-argument
