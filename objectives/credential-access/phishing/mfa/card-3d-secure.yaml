defaults:
  platforms: [windows, unix]
  for: [html, javascript]
  attack: T1566.002,T1056.002
  mbc: B0030
  crit: notable
  conf: 0.94

traits:
  - id: three-d-secure-prompt-copy
    desc: 3D Secure verification prompt copy
    if:
      type: text
      exclude_html_comments: true
      regex: '(?i)3D[- ]?Secure.{0,80}(SMS|code|banque|achats)'

  - id: sms-otp-verification-code-prompt
    desc: SMS verification code prompt copy
    if:
      type: text
      exclude_html_comments: true
      regex: '(?i)(verification code received by sms|code d''accès reçu par sms)'

composite_rules:
  - id: three-d-secure-sms-otp-copy
    desc: 3D Secure or SMS OTP prompt copy
    any:
      - id: three-d-secure-prompt-copy
      - id: sms-otp-verification-code-prompt

  - id: card-3d-secure-otp-harvest
    desc: Card harvest with 3D Secure OTP interception
    crit: hostile
    conf: 0.98
    all:
      - id: three-d-secure-sms-otp-copy
      - id: micro-behaviors/data/parse/payment::card-number-name-reference
