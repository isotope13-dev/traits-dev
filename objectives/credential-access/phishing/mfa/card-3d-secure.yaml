defaults:
  platforms: [windows, unix]
  for: [html, javascript]
  attack: T1566.002,T1056.002
  mbc: B0030
  crit: notable
  conf: 0.94

traits:
  - id: three-d-secure-prompt-copy
    desc: 3D Secure and code wording
    if:
      type: text
      exclude_html_comments: true
      regex: '(?i)3D[- ]?Secure.{0,80}(SMS|code|banque|achats)'
    unless:
      - id: metadata/lang/scripted::dts-declaration-file

  - id: sms-otp-verification-code-prompt
    desc: SMS verification code prompt copy
    if:
      type: text
      exclude_html_comments: true
      regex: '(?i)(verification code received by sms|code d''accès reçu par sms)'

composite_rules:
  - id: three-d-secure-sms-otp-copy
    desc: 3D Secure code or SMS OTP wording
    any:
      - id: three-d-secure-prompt-copy
      - id: sms-otp-verification-code-prompt

  - id: card-3d-secure-code-references
    desc: Card number and 3D Secure or SMS code references
    crit: notable
    conf: 0.94
    all:
      - id: three-d-secure-sms-otp-copy
      - id: micro-behaviors/data/parse/payment::card-number-name-reference
