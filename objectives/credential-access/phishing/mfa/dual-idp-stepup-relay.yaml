# Dual-IdP (Google + Okta) credential and MFA step-up harvesting kits.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, html]
  attack: T1566.002,T1111,T1056.002
  mbc: B0030
  conf: 0.98

traits:
  - id: okta-verify-push-ui-copy
    desc: Okta Verify push notification UI prompt
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)(Powered by Okta|Send push automatically)'

composite_rules:
  - id: okta-relay-ui-or-step
    desc: Okta relay UI prompt or credential step
    crit: notable
    conf: 0.94
    any:
      - id: okta-verify-push-ui-copy
      - id: micro-behaviors/ui/window/otp-field::okta-signin-step-literals

  - id: dual-idp-google-okta-mfa-harvest
    desc: Phishing kit harvests Google credentials and Okta MFA steps
    crit: hostile
    conf: 0.99
    all:
      - id: micro-behaviors/ui/window/password-field::browser-password-field-any
      - id: micro-behaviors/ui/window/otp-field::mfa-step-command-literals
      - id: micro-behaviors/ui/window/otp-field::okta-mfa-step-command-literals
      - id: okta-relay-ui-or-step
    any:
      - id: micro-behaviors/communications/http/request/json::fetch-flow-json-post-body
      - id: micro-behaviors/communications/http/request/json::fetch-json-stringify-body
      - id: micro-behaviors/communications/http/post::html-fetch-post-call
      - id: micro-behaviors/communications/http/request/html::html-jquery-ajax-post-call
