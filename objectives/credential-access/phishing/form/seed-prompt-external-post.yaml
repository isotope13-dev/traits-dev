# A page that prompts for a wallet seed phrase or private key and also POSTs
# JSON (or a Telegram bot message) to a non-loopback host sends the secret to
# whoever runs that host. Wallets keep these secrets on the device, so unlike
# a login form there is no legitimate remote that needs to receive them. The
# public-webhook variant lives in external-provider/webhook.yaml; this one does
# not depend on the host being a known capture service.
defaults:
  platforms: [unix, windows]
  attack: T1566.002,T1056.003,T1041

composite_rules:
  - id: seed-prompt-with-external-post
    desc: Wallet secret prompt page POSTs data to a remote host
    crit: hostile
    conf: 0.93
    for: [html, javascript]
    near_bytes: 2400
    all:
      - id: micro-behaviors/ui/controls/wallet::wallet-phrase-entry-surface
      - id: micro-behaviors/ui/controls/wallet::wallet-secret-collection-terms
    any:
      - id: micro-behaviors/communications/http/request/json::html-non-loopback-json-post
      - id: micro-behaviors/communications/http/services/telegram::telegram-send-message-url
