# Corporate-account-targeted phishing forms that reject consumer webmail domains
# while mimicking IdP sign-in or MFA steps and posting harvested input.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, html]
  attack: T1566.002,T1056.002
  mbc: B0030
  conf: 0.97

composite_rules:
  - id: work-email-gated-credential-harvest
    desc: Corporate-only phishing gate rejects consumer webmail domains
    crit: hostile
    all:
      - id: micro-behaviors/ui/controls/input::consumer-webmail-domain-set
      - id: micro-behaviors/ui/controls/input::work-email-required-prompt
      - id: micro-behaviors/ui/window/password-field::browser-password-field-any
    any:
      - id: micro-behaviors/ui/window/username-field::google-identifier-id-prop
      - id: well-known/app/system/google-brand::google-signin-identifier-input
      - id: micro-behaviors/ui/window/password-field::passwd-field-reference
      - id: micro-behaviors/ui/window/otp-field::mfa-step-command-literals
      - id: micro-behaviors/ui/window/otp-field::okta-mfa-step-command-literals
