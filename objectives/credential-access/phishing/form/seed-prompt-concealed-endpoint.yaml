# A recovery-phrase prompt shipped beside an HTTP endpoint assembled from
# character codes. Hiding the destination of a page that asks for wallet
# recovery words has no benign wallet purpose.
defaults:
  platforms: [unix, windows]
  attack: T1566.002,T1056.003,T1027

composite_rules:
  - id: seed-prompt-with-charcode-assembled-endpoint
    desc: Seed-phrase prompt ships a char-code-hidden endpoint
    crit: hostile
    conf: 0.95
    scope: archive
    for: [crx, xpi, zip, chrome-manifest, javascript, html]
    all:
      - id: micro-behaviors/ui/controls/wallet::wallet-phrase-entry-surface
      - id: micro-behaviors/ui/controls/wallet::seed-field-values-collector-call
      - id: objectives/anti-static/obfuscation/string/charcode-url::js-runtime-assembled-http-endpoint
