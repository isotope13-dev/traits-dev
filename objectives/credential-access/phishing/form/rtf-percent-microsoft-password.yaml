defaults:
  platforms: [windows, unix]
  for: [rtf]
  attack: T1566,T1056.003,T1027

traits:
  - id: rtf-url-encoded-microsoft-password-prompt
    desc: RTF encodes a Microsoft password prompt
    crit: notable
    if:
      type: encoded
      encoding: url
      regex: '(?i)password for your Microsoft account'
  - id: rtf-url-encoded-password-input
    desc: RTF encodes an HTML password input
    crit: notable
    if:
      type: encoded
      encoding: url
      regex: '(?i)<input\b[^>]{0,200}type\s*=\s*["'']password["'']'
  - id: rtf-url-encoded-formdata
    desc: RTF encodes FormData construction
    crit: component
    if:
      type: encoded
      encoding: url
      regex: '(?i)new\s+FormData\s*\('
  - id: rtf-url-encoded-post-body
    desc: RTF encodes a POST with variable body
    crit: component
    if:
      type: encoded
      encoding: url
      regex: '(?is)method\s*:\s*["'']POST["''][^}]{0,150}body\s*:\s*formData'
  - id: rtf-encoded-fetch-http-syntax
    desc: RTF names percent-encoded fetch URL
    crit: notable
    if:
      type: raw
      regex: '(?i)fetch\(%27https?://'
  - id: rtf-encoded-fetch-microsoft-host
    desc: RTF encodes fetch to Microsoft host
    crit: component
    if:
      type: raw
      regex: '(?i)fetch\(%27https?://([a-z0-9-]{1,63}\.){0,5}microsoft(online)?\.com[/:?#]'
  - id: rtf-encoded-fetch-live-host
    desc: RTF encodes fetch to account host
    crit: component
    if:
      type: raw
      regex: '(?i)fetch\(%27https?://([a-z0-9-]{1,63}\.){0,5}(live|outlook)\.com[/:?#]'
  - id: rtf-encoded-fetch-local-host
    desc: RTF encodes fetch to local host
    crit: component
    if:
      type: raw
      regex: '(?i)fetch\(%27https?://(localhost|127\.0\.0\.1|[a-z0-9.-]+\.invalid)\b'
  - id: rtf-html-unescape-writer
    desc: RTF wraps HTML in unescape writer
    crit: notable
    if:
      type: raw
      regex: '(?is)document\.write\s*\(\s*unescape\s*\('

  - id: rtf-encoded-office365-signin
    desc: RTF encodes Office 365 sign-in
    crit: notable
    if:
      type: encoded
      encoding: url
      regex: '(?i)Sign in to your Office365 account'
  - id: rtf-encoded-script-link-http
    desc: RTF encodes an HTTP script endpoint
    crit: component
    if:
      type: encoded
      encoding: url
      regex: '(?i)Script_link\s*=\s*["'']https?://'
  - id: rtf-encoded-ajax-credential-post
    desc: RTF encodes AJAX credential submission
    crit: notable
    if:
      type: encoded
      encoding: url
      regex: '(?i)url:Script_link,type:["'']POST["''],data:\{email:[^,]{1,40},password:'

composite_rules:
  - id: rtf-percent-microsoft-password-exfil
    desc: RTF hides Microsoft credential POST page
    crit: hostile
    conf: 0.98
    all:
      - id: rtf-url-encoded-microsoft-password-prompt
      - id: rtf-url-encoded-password-input
      - id: rtf-url-encoded-formdata
      - id: rtf-url-encoded-post-body
      - id: rtf-encoded-fetch-http-syntax
      - id: rtf-html-unescape-writer
    unless:
      - id: rtf-encoded-fetch-microsoft-host
      - id: rtf-encoded-fetch-live-host
      - id: rtf-encoded-fetch-local-host

  - id: rtf-encoded-office365-ajax-credential-post
    desc: RTF hides Office 365 credential AJAX post
    crit: hostile
    conf: 0.98
    all:
      - id: rtf-html-unescape-writer
      - id: rtf-encoded-office365-signin
      - id: rtf-url-encoded-password-input
      - id: rtf-encoded-script-link-http
      - id: rtf-encoded-ajax-credential-post
