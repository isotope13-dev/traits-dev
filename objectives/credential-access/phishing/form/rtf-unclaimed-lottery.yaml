defaults:
  platforms: [windows, unix]
  for: [rtf]
  attack: T1566

traits:
  - id: german-unclaimed-prize
    desc: German notice claims unclaimed prize money
    crit: notable
    if:
      type: text
      regex: '(?i)nicht\s+beanspruch'
  - id: german-prize-money
    desc: German notice references prize money
    crit: notable
    if:
      type: text
      regex: '(?i)preisgeld'
  - id: german-lottery-reference
    desc: Document references a lottery
    crit: component
    if:
      type: text
      regex: '(?i)lot{1,2}er(ie|ia|y)'
  - id: german-email-reference
    desc: Document references email
    crit: component
    if:
      type: text
      regex: '(?i)e-?mail'

composite_rules:
  - id: german-unclaimed-lottery-data-lure
    desc: Unclaimed lottery notice requests personal data
    crit: hostile
    conf: 0.97
    all:
      - id: german-unclaimed-prize
      - id: german-prize-money
      - id: german-lottery-reference
      - id: german-email-reference
    any:
      - id: micro-behaviors/ui/window/personal-data-field::personal-data-questionnaire
      - id: micro-behaviors/ui/window/personal-data-field::rtf-german-personal-data-fields
