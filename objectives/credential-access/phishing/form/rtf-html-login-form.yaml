# An RTF whose body is an HTML sign-in page: opening it in a viewer that
# renders the HTML (or saving it as .html, the usual instruction) shows a
# password form that submits to an external script. A real document has no
# reason to carry a login form for another site.
defaults:
  platforms: [windows, unix]
  for: [rtf]
  attack: T1566.001,T1056.003

composite_rules:
  - id: rtf-html-password-form-remote-post
    desc: RTF HTML password form posts off-site
    crit: hostile
    conf: 0.94
    all:
      - id: metadata/document/ole::ole-html-body
      - id: micro-behaviors/ui/controls/credential::password-input-field
      - id: micro-behaviors/communications/http/form::form-action-absolute-script-url
