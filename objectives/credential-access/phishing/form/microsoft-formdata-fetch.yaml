defaults:
  platforms: [windows, unix]
  for: [html]
  attack: T1566,T1056.003

traits:
  - id: html-fetch-microsoft-host
    desc: HTML fetch targets a Microsoft host
    crit: component
    if:
      type: text
      regex: '(?i)fetch\s*\(\s*["'']https?://([a-z0-9-]{1,63}\.){0,5}microsoft(online)?\.com[/:?#]'
  - id: html-fetch-live-host
    desc: HTML fetch targets a Microsoft account host
    crit: component
    if:
      type: text
      regex: '(?i)fetch\s*\(\s*["'']https?://([a-z0-9-]{1,63}\.){0,5}(live|outlook)\.com[/:?#]'

composite_rules:
  - id: microsoft-password-form-external-fetch
    desc: Microsoft password form posts to external host
    crit: hostile
    conf: 0.97
    all:
      - id: well-known/app/system/microsoft-brand::microsoft-account-password-wording
      - id: micro-behaviors/communications/http/request/body/credential::browser-credential-post
      - id: micro-behaviors/communications/http/form::formdata-class
      - id: micro-behaviors/communications/http/request/body/construction::post-options-named-expression-body
      - id: micro-behaviors/communications/http/request/target::html-fetch-non-loopback-http-url
    unless:
      - id: html-fetch-microsoft-host
      - id: html-fetch-live-host
