defaults:
  platforms: [unix, windows]
  for: [javascript]
  crit: notable
  conf: 0.9
  attack: "T1566"

traits:
  - id: base64-c2-submit
    desc: Base64 hidden fetch submit
    crit: suspicious
    conf: 0.97
    if:
      type: text
      regex: 'fetch\(window\.atob\(.{0,40}\)\+"\?id="'

  - id: bank-login-copy
    desc: Bank login phishing copy
    conf: 0.92
    if:
      type: text
      substr: "Login Online Banking"

  - id: pan-kyc-copy
    desc: PAN KYC banking lure
    conf: 0.9
    if:
      type: text
      substr: "PAN KYC"

  - id: account-number-copy
    desc: Account number harvest field
    # Component: a bare "Account Number" label is a generic UI/PII string
    # (banking apps, PII-detection rulesets), not phishing on its own. The
    # phishing signal is the account-identity-copy composite, which requires
    # Account Number + CIF Number + Date of Birth together.
    crit: component
    conf: 0.9
    if:
      type: text
      substr: "Account Number"

  - id: cif-number-copy
    desc: CIF number field label
    crit: component
    conf: 0.9
    if:
      type: text
      substr: "CIF Number"

  - id: date-of-birth-copy
    desc: Date of birth field label
    crit: component
    conf: 0.9
    if:
      type: text
      substr: "Date of Birth"

  - id: card-number-copy
    desc: Card number harvest field
    crit: component
    conf: 0.94
    if:
      type: text
      substr: "Card Number"
    unless:
      - id: metadata/file/catalog/identity/
      - id: metadata/package/quality/

  - id: cvv-copy
    desc: CVV harvest field
    crit: component
    conf: 0.94
    if:
      type: text
      word: "CVV"

  - id: atm-pin-copy
    desc: ATM PIN harvest field
    crit: suspicious
    conf: 0.94
    if:
      type: text
      substr: "ATM Pin"

  - id: invalid-otp-copy
    desc: Invalid OTP retry lure
    crit: suspicious
    conf: 0.95
    if:
      type: text
      substr: "Invalid one time password"

    unless:
composite_rules:
  - id: account-identity-copy
    desc: Account identity harvest copy
    crit: suspicious
    conf: 0.96
    all:
      - id: account-number-copy
      - id: cif-number-copy
      - id: date-of-birth-copy

  - id: card-pin-copy
    desc: Card and ATM PIN copy
    crit: suspicious
    conf: 0.97
    all:
      - id: card-number-copy
      - id: cvv-copy
      - id: atm-pin-copy

  - id: staged-form-harvest-js
    desc: Banking credential harvest workflow in JS
    crit: hostile
    conf: 0.99
    all:
      - id: base64-c2-submit
      - id: micro-behaviors/data/encode/base64::json-stringify-base64
    any:
      - id: bank-login-copy
      - id: pan-kyc-copy
      - id: account-identity-copy
      - id: card-pin-copy
      - id: micro-behaviors/ui/window/form-input::browser-mfa-field-reference
      - id: invalid-otp-copy

  - id: otp-phish-submit-js
    desc: OTP phishing submit flow in JS
    crit: hostile
    conf: 0.98
    all:
      - id: base64-c2-submit
      - id: micro-behaviors/data/encode/base64::json-stringify-base64
    any:
      - id: micro-behaviors/ui/window/form-input::browser-mfa-field-reference
      - id: invalid-otp-copy
