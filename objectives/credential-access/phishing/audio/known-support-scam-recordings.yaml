# These fingerprints identify four reviewed encodings of two spoken support
# scams. Each recording falsely claims a security emergency and directs the
# listener to call support. Transcoding the speech changes the fingerprint.
defaults:
  for: [mp3]
  platforms: [windows, unix]
  attack: T1566

traits:
  - id: known-support-scam-speech-recording
    desc: Known fake support-alert speech recording
    crit: hostile
    conf: 0.99
    if:
      type: yara
      source: |
        rule known_support_scam_speech_recording {
          strings:
            $microsoft_a = { E8 55 FA 68 20 82 DC 33 9B 01 17 C0 AC 13 10 98 C3 1B 36 6A 45 89 0A 04 47 C5 CA 8C 50 2A 80 35 }
            $microsoft_b = { E5 4A E5 41 55 82 A5 A4 00 50 60 06 08 3A 1A 91 73 14 6D E0 60 6A 0A 87 71 2B B9 25 1E 50 F9 D5 }
            $locked_a = { D7 25 B2 9B 2B CA 77 9B CA BD 6C EC CC 55 D4 6D C7 F8 C5 EF DD 88 2A A3 5A DD 9E 49 05 F1 D6 97 }
            $locked_b = { C7 26 E4 05 0C 40 FF F3 80 C4 00 2C 03 CA 88 26 DA 45 AD 20 03 71 64 A8 01 64 80 4D CD DC 11 12 }
          condition:
            filesize > 100KB and filesize < 250KB and any of them
        }
