# These messages disguise external destinations as mailbox and document links.
defaults:
  platforms: [unix, windows]
  for: [text]
  crit: notable
  attack: T1566.002
  mbc: B0030

traits:
  - id: mime-html-body
    desc: MIME message carries an HTML part
    crit: component
    if:
      type: text
      regex: '(?im)^Content-Type:[ \t]+text/html\b'
  - id: ipfs-gateway-mail-link
    desc: Mail links to a public IPFS gateway
    if:
      type: text
      regex: '(?is)\bhref=(3D)?"https://[^"/]{0,85}\bipfs(\.io|\.dweb\.link)/'
  - id: ipfs-mailbox-link-target
    desc: Link targets a mailbox page or identity
    if:
      type: text
      regex: '(?i)href=(3D)?"https://[^"]{1,155}(\?login=|/inbox\.html#|filename=(3D)?login\.)'
  - id: mailbox-or-sharepoint-pretext
    desc: Mail cites a SharePoint or mailbox pretext
    crit: component
    if:
      type: text
      regex: '(?i)\b(SharePoint|e-mail storage bandwidth|permanent suspension)\b'
  - id: fax-document-pretext
    desc: Mail asks users to view fax documents
    crit: component
    if:
      type: text
      substr: Fax Documents
      case_insensitive: true
  - id: ipfs-mail-file-name
    desc: IPFS link assigns a mail filename
    if:
      type: text
      regex: '(?i)href=(3D)?"https://[^"]{1,135}[?&]filename=(3D)?mail%25'
  - id: mailbox-password-preservation-button
    desc: Mail offers to keep the same password
    if:
      type: text
      substr: Keep Same Password
      case_insensitive: true
  - id: mail-link-with-address-path
    desc: Mail link embeds an address in path
    if:
      type: text
      regex: '(?is)\bhref=(3D)?"https://[^"?#]{1,100}/[\w.=+\r\n-]{1,64}@[\w.-]+'
  - id: mailbox-security-threat
    desc: Mail claims unauthorized activity or suspension
    if:
      type: text
      regex: '(?i)\b(unauthorized security changes|your email will be suspended)\b'
  - id: fleek-personalized-mail-login
    desc: Hosted login URL carries an email fragment
    if:
      type: text
      regex: '(?i)\.on\.fleek\.co/login\.html#[^"\r\n]{1,64}@'
  - id: wordpress-core-mailbox-login-link
    desc: Mailbox login points inside WordPress core
    if:
      type: text
      regex: '(?i)\bhref=(3D)?"https://[^"/]{1,100}/wp-includes/[^"?]{1,90}\.php\?user='
  - id: account-recovery-lockout-pretext
    desc: Mail threatens lockout over account recovery
    if:
      type: text
      regex: '(?is)\baccount recovery\b.{0,500}\bw(=\r?\n)?ill be locked out\b'
  - id: cloud-storage-mail-recovery-page
    desc: Recovery link targets a cloud storage page
    if:
      type: text
      regex: '(?is)href=(3D)?"https://s3\.amazonaws\.com/[^"]{1,130}\.html\?err='

composite_rules:
  - id: mime-ipfs-mailbox-phish
    desc: Mailbox or SharePoint pretext links to an IPFS login
    crit: hostile
    conf: 0.98
    all:
      - id: mime-html-body
      - id: mailbox-or-sharepoint-pretext
      - id: ipfs-gateway-mail-link
      - id: ipfs-mailbox-link-target
  - id: mime-ipfs-fax-lure
    desc: Fax document lure links to a disguised IPFS mail page
    crit: hostile
    conf: 0.96
    all:
      - id: mime-html-body
      - id: fax-document-pretext
      - id: ipfs-gateway-mail-link
      - id: ipfs-mail-file-name
  - id: mime-password-expiry-phish
    desc: Password expiry lure passes recipient identity to an external site
    crit: hostile
    conf: 0.97
    all:
      - id: mime-html-body
      - id: mailbox-password-preservation-button
      - id: mail-link-with-address-path
    near_bytes: 4096
  - id: mime-security-alert-phish
    desc: Activity alert leads to an impersonated mailbox login
    crit: hostile
    conf: 0.98
    all:
      - id: mime-html-body
      - id: mailbox-security-threat
    any:
      - id: fleek-personalized-mail-login
      - id: wordpress-core-mailbox-login-link
    needs: 1
  - id: mime-account-recovery-phish
    desc: Mailbox lockout threat leads to a cloud-hosted recovery lure
    crit: hostile
    conf: 0.96
    all:
      - id: mime-html-body
      - id: account-recovery-lockout-pretext
      - id: cloud-storage-mail-recovery-page
