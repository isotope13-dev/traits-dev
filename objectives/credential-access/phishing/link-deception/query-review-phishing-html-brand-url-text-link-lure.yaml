defaults:
  platforms:
  - windows
  - unix
  for:
  - html
  attack: T1566.002

composite_rules:
  - id: url-text-dotcom-suffix-host-link
    desc: URL text hides a suffixed dot-com host
    crit: hostile
    conf: 0.96
    near_bytes: 400
    all:
      - id: micro-behaviors/ui/window/html::anchor-text-hides-dotcom-suffix-host
      - id: micro-behaviors/ui/window/html::url-text-anchor
    unless:
      - id: micro-behaviors/ui/window/html::bulk-mail-furniture-reference
  - id: url-text-path-embedded-host-link
    desc: URL text hides a path-embedded host
    crit: hostile
    conf: 0.96
    near_bytes: 400
    all:
      - id: micro-behaviors/ui/window/html::url-text-anchor
      - id: micro-behaviors/ui/window/html::href-path-embeds-hostname
    unless:
      - id: micro-behaviors/ui/window/html::bulk-mail-furniture-reference
      - id: metadata/package/documentation/page::documentation-web-page
  - id: formatted-url-path-embedded-host-link
    desc: Formatted URL hides a path-embedded host
    crit: hostile
    conf: 0.95
    near_bytes: 400
    all:
      - id: micro-behaviors/ui/window/html::url-text-anchor-inline-formatted
      - id: micro-behaviors/ui/window/html::href-path-embeds-hostname
    unless:
      - id: micro-behaviors/ui/window/html::bulk-mail-furniture-reference
      - id: metadata/package/documentation/page::documentation-web-page
  - id: url-text-offsite-ebay-path-link
    desc: URL text hides off-site eBay path
    crit: hostile
    conf: 0.96
    near_bytes: 800
    all:
      - id: micro-behaviors/ui/window/html::url-text-anchor
      - id: objectives/evasion/masquerade/brand/domain::offsite-host-ebay-named-path-link
