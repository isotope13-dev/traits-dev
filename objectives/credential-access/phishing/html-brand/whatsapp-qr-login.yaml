# WhatsApp linked-device QR pages that send the visitor to another host
# after the scan, or offer a phone-number login on that host.
defaults:
  platforms: [unix, windows]
  for: [html]
  attack: T1566.002

composite_rules:
  - id: whatsapp-qr-scan-offsite-redirect
    desc: WhatsApp QR page redirects after the scan
    crit: hostile
    conf: 0.96
    near_bytes: 4000
    all:
      - id: micro-behaviors/ui/help::whatsapp-authorization-heading
      - id: micro-behaviors/ui/help::whatsapp-linked-device-instructions
      - id: micro-behaviors/ui/help::html-absolute-data-redirect
  - id: whatsapp-qr-scan-number-login
    desc: WhatsApp QR page links a number login
    crit: hostile
    conf: 0.96
    near_bytes: 4000
    all:
      - id: micro-behaviors/ui/help::whatsapp-authorization-heading
      - id: micro-behaviors/ui/help::whatsapp-linked-device-instructions
      - id: micro-behaviors/ui/help::https-login-path-anchor
