# CID-embedded image-map lures: the mail embeds its own artwork (cid:)
# and overlays a full-image click map whose area points at a numeric IP,
# while the enclosing anchor shows a real bank URL. Same assembly as the
# deutsche-bank composites in traits.yaml, generalized past one brand.
defaults:
  platforms: [windows, unix]
  for: [html]
  attack: T1566.002
composite_rules:
  - id: cid-embedded-image-ip-imagemap-lure
    desc: Embedded image maps clicks to IP literal
    crit: hostile
    conf: 0.97
    near_bytes: 600
    all:
      - id: micro-behaviors/ui/window/html::cid-embedded-image
      - id: micro-behaviors/ui/window/html::html-image-usemap
    any:
      - id: micro-behaviors/ui/window/html::html-area-public-ip-href
      # Encoded leg is the dotted-decimal-specific atom, not the generic
      # percent-encoded-authority observation: an encoded hostname
      # (example.com bytes) must not convict as an IP lure.
      - id: micro-behaviors/communications/ip/literal::percent-encoded-ip-destination
