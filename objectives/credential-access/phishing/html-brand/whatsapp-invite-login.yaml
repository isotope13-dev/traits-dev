# This page presents a WhatsApp group invite, sends joiners to a local
# login.php route, and labels the script itself as WhatsApp group phishing.
# The route's contents are not present here, so this detects the credential
# phishing lure and handoff, not credential submission.
defaults:
  platforms: [windows, unix]
  for: [html]

composite_rules:
  - id: whatsapp-invite-local-login-phish
    desc: WhatsApp phishing invite routes joiners to login
    crit: hostile
    conf: 0.98
    attack: T1566.002
    all:
      - id: micro-behaviors/ui/window/markup::whatsapp-group-invite-claim
      - id: micro-behaviors/ui/window/navigation::scripted-local-login-route
      - id: metadata/file/comment::whatsapp-phishing-script-self-label
