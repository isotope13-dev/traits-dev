# A Google Drive sign-in page on a third-party host with an account field and
# a password field is a credential harvest. Google's own sign-in host
# does not carry a Drive-named title on a Sites or custom domain, so the
# title leg is the discriminator against genuine Google sign-in pages.
defaults:
  platforms: [windows, unix]
  for: [html]
  attack: T1566.002,T1056.002

composite_rules:
  - id: google-drive-signin-credential-harvest
    desc: Google Drive sign-in title with account and password field pair
    crit: hostile
    conf: 0.95
    all:
      - id: well-known/app/system/google-brand::google-signin-identifier-input
      - id: micro-behaviors/ui/controls/credential::browser-password-input-marker
      - id: well-known/app/system/google-brand::google-drive-signin-title
