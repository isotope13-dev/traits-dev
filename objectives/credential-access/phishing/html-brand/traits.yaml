# Brand impersonation requires a deceptive destination, not a bank URL alone.
# Legacy PayPal hex matchers also cover HTML misidentified as ELF.
defaults:
  platforms: [windows, unix]
  for: [html, elf]
  attack: T1566.002
  mbc: B0030

traits:
  - id: paypal-lookalike-login
    desc: PayPal lookalike login host
    crit: notable
    conf: 0.97
    if:
      type: hex
      pattern: 70 61 79 70 61 6c 2e 63 6f 6d 2e
      offset_range: [0, null]
  - id: dear-paypal-lure
    desc: Dear-PayPal account lure copy
    crit: notable
    conf: 0.94
    if:
      type: hex
      pattern: 44 65 61 72 20 50 61 79 50 61 6c
      offset_range: [0, null]
  - id: protect-password-lure
    desc: Protect-your-password lure copy
    crit: notable
    conf: 0.9
    if:
      type: hex
      pattern: 50 52 4f 54 45 43 54 20 59 4f 55 52 20 50 41 53 53 57 4f 52 44
      offset_range: [0, null]
  # Sparkasse online-banking vocabulary: the bank name itself plus its
  # pushTAN authorization system and the Legitimations-ID login handle.
  # Genuine Sparkasse pages carry these words too, so this stays a notable
  # brand marker; the harvest composites add the credential POST that
  # separates a kit copy from the bank's own login.
  - id: sparkasse-online-banking-copy
    desc: Sparkasse online-banking brand copy
    crit: notable
    conf: 0.92
    for: [html]
    if:
      type: text
      regex: '(?i)(sparkasse|pushtan|legitimations-id)'
      exclude_html_comments: true
  # DHL shipment vocabulary: the brand name that delivery-fee kits keep
  # readable while scrambling the surrounding copy against text-based
  # brand detection. Genuine DHL pages carry it too, so this stays a
  # notable brand marker; the harvest composites add the sibling-script
  # receiver the real site never uses for payment forms.
  - id: dhl-shipment-brand-copy
    desc: DHL shipment brand copy
    crit: notable
    conf: 0.9
    for: [html]
    if:
      type: text
      regex: '(?i)\bDHL\b'
      exclude_html_comments: true

composite_rules:
  - id: paypal-lookalike-dear-lure
    desc: PayPal lookalike with dear-PayPal
    crit: hostile
    conf: 0.98
    all:
      - id: paypal-lookalike-login
      - id: dear-paypal-lure
  - id: paypal-lookalike-password-lure
    desc: PayPal lookalike with password copy
    crit: hostile
    conf: 0.96
    all:
      - id: paypal-lookalike-login
      - id: protect-password-lure
  - id: dear-paypal-password-lure
    desc: Dear-PayPal copy with password lure
    crit: hostile
    conf: 0.94
    all:
      - id: dear-paypal-lure
      - id: protect-password-lure
  # A bank URL alone is legitimate. Require a mapped image whose clickable
  # area goes to a public numeric IP instead of the enclosing bank anchor.
  - id: deutsche-confirm-ip-imagemap-lure
    desc: Bank confirmation link masks IP image-map lure
    crit: hostile
    conf: 0.98
    for: [html]
    near_bytes: 600
    all:
      - id: micro-behaviors/ui/window/html::deutsche-bank-anchor
      - id: micro-behaviors/communications/url/path::wo-confirm-asp-path
      - id: micro-behaviors/ui/window/html::html-area-public-ip-href
      - id: micro-behaviors/ui/window/html::html-image-usemap
  - id: deutsche-cid-ip-imagemap-lure
    desc: Bank CID image links to IP image-map lure
    crit: hostile
    conf: 0.98
    for: [html]
    near_bytes: 600
    all:
      - id: micro-behaviors/ui/window/html::deutsche-bank-anchor
      - id: micro-behaviors/ui/window/html::deutsche-bank-cid-image
      - id: micro-behaviors/ui/window/html::html-area-public-ip-href
      - id: micro-behaviors/ui/window/html::html-image-usemap
  - id: ebay-lookalike-account-suspension-lure
    desc: eBay lookalike domain with account suspension scare
    crit: hostile
    conf: 0.98
    for: [html]
    all:
      - id: objectives/evasion/masquerade/brand/domain::ebay-lookalike-domain
      - id: micro-behaviors/ui/window/markup::account-suspension-pretext
