# Brand-impersonation HTML lures that send victims to a lookalike
# login host or a brand WebObjects path. Hex matchers still fire
# when a .ko extension causes the page to be typed as ELF.
defaults:
  platforms: [windows, unix]
  for: [html, elf]
  attack: T1566.002
  mbc: B0030

traits:
  - id: paypal-lookalike-login
    desc: PayPal lookalike login host
    crit: notable
    conf: 0.97
    if:
      type: hex
      pattern: 70 61 79 70 61 6c 2e 63 6f 6d 2e
      offset_range: [0, null]
  - id: dear-paypal-lure
    desc: Dear-PayPal account lure copy
    crit: notable
    conf: 0.94
    if:
      type: hex
      pattern: 44 65 61 72 20 50 61 79 50 61 6c
      offset_range: [0, null]
  - id: protect-password-lure
    desc: Protect-your-password lure copy
    crit: notable
    conf: 0.9
    if:
      type: hex
      pattern: 50 52 4f 54 45 43 54 20 59 4f 55 52 20 50 41 53 53 57 4f 52 44
      offset_range: [0, null]
  - id: deutsche-bank-webobjects
    desc: Deutsche-Bank WebObjects login path
    crit: notable
    conf: 0.93
    if:
      type: hex
      pattern: 6d 65 69 6e 65 2e 64 65 75 74 73 63 68 65 2d 62 61 6e 6b 2e 64 65
      offset_range: [0, null]
  - id: webobjects-confirm-asp
    desc: WebObjects confirm.asp login path
    crit: notable
    conf: 0.9
    if:
      type: hex
      pattern: 2f 77 6f 2f 63 6f 6e 66 69 72 6d 2e 61 73 70
      offset_range: [0, null]
  - id: imagemap-full-area
    desc: Full-page imagemap click overlay
    crit: notable
    conf: 0.88
    if:
      type: hex
      pattern: 3c 61 72 65 61 20 63 6f 6f 72 64 73 3d
      offset_range: [0, null]

composite_rules:
  - id: paypal-lookalike-dear-lure
    desc: PayPal lookalike with dear-PayPal
    crit: hostile
    conf: 0.98
    all:
      - id: paypal-lookalike-login
      - id: dear-paypal-lure
  - id: paypal-lookalike-password-lure
    desc: PayPal lookalike with password copy
    crit: hostile
    conf: 0.96
    all:
      - id: paypal-lookalike-login
      - id: protect-password-lure
  - id: dear-paypal-password-lure
    desc: Dear-PayPal copy with password lure
    crit: hostile
    conf: 0.94
    all:
      - id: dear-paypal-lure
      - id: protect-password-lure
  - id: deutsche-webobjects-confirm
    desc: Deutsche-Bank WebObjects confirm path
    crit: hostile
    conf: 0.96
    all:
      - id: deutsche-bank-webobjects
      - id: webobjects-confirm-asp
  - id: deutsche-webobjects-imagemap
    desc: Deutsche-Bank WebObjects imagemap lure
    crit: hostile
    conf: 0.94
    all:
      - id: deutsche-bank-webobjects
      - id: imagemap-full-area
  - id: webobjects-confirm-imagemap
    desc: WebObjects confirm with imagemap
    crit: hostile
    conf: 0.93
    all:
      - id: webobjects-confirm-asp
      - id: imagemap-full-area
