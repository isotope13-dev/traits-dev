# URL-text link lures: the mail embeds its own artwork (cid:) and its call to
# action shows an absolute URL as the anchor text, so the reader is shown one
# destination while the href sends another. Same assembly as the image-map
# lure in cid-imagemap-lure.yaml, generalized from click maps to link text:
# either half alone is ordinary markup, and bulk-mail furniture (unsubscribe
# and view-in-browser links) marks legitimate senders, so it exempts.
defaults:
  platforms: [windows, unix]
  for: [html]
  attack: T1566.002
composite_rules:
  - id: mailed-url-text-link-lure
    desc: Mailed page shows a URL as link text
    crit: hostile
    conf: 0.93
    all:
      - id: micro-behaviors/ui/window/html::url-text-anchor
      - id: micro-behaviors/ui/window/html::cid-embedded-image
    unless:
      - id: micro-behaviors/ui/window/html::bulk-mail-furniture-reference
  - id: account-scare-url-text-link-lure
    desc: Account-scare email shows a URL as link text
    crit: hostile
    conf: 0.96
    all:
      - id: micro-behaviors/ui/window/html::url-text-anchor
    any:
      - id: micro-behaviors/ui/window/markup::unauthorized-account-access-pretext
      - id: micro-behaviors/ui/window/markup::account-suspension-pretext
      - id: micro-behaviors/ui/window/markup::suspend-access-account-pretext
      - id: micro-behaviors/ui/window/markup::account-limitation-pretext
    unless:
      - id: micro-behaviors/ui/window/html::bulk-mail-furniture-reference
  # Same account-scare lure where the decoy URL text is wrapped in inline
  # formatting (`<a href=evil><font>https://brand/...</font></a>`).
  - id: account-scare-formatted-url-text-link-lure
    desc: Account-scare email shows formatted URL link text
    crit: hostile
    conf: 0.95
    all:
      - id: micro-behaviors/ui/window/html::url-text-anchor-inline-formatted
    any:
      - id: micro-behaviors/ui/window/markup::unauthorized-account-access-pretext
      - id: micro-behaviors/ui/window/markup::account-suspension-pretext
      - id: micro-behaviors/ui/window/markup::account-limitation-pretext
    unless:
      - id: micro-behaviors/ui/window/html::bulk-mail-furniture-reference
  # Label-bound variant: the visible URL sits in a <label for=...> whose
  # activation target is a separate, text-less anchor carrying its own
  # absolute-URI href, so the shown destination and the navigation destination
  # diverge without any mismatched anchor text for the reader to notice. The
  # label never needs to display a URL in legitimate markup, which is what
  # makes the shown destination a decoy.
  - id: label-url-activation-hijack-lure
    desc: Label-shown URL wired to hidden anchor
    crit: hostile
    conf: 0.9
    near_bytes: 500
    all:
      - id: micro-behaviors/ui/window/html::label-url-display-text
      - id: micro-behaviors/ui/window/html::empty-href-anchor
    unless:
      - id: micro-behaviors/ui/window/html::bulk-mail-furniture-reference
