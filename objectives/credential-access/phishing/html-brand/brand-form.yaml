# Brand-labelled credential entry forms: a recognizable account brand rendered (moved to the canonical mechanism leaf)
# next to a live password input. The brand word alone is not evidence -- setup
# guides, help text and provider pickers name Apple ID and "app-specific
# password" constantly -- so every trait here requires the actual input field.
defaults:
  platforms: [android, unix, windows]
  for: [javascript, typescript, python, php, html]
  attack: T1566.002
  crit: notable
  conf: 0.94

traits:
  # Relocated from objectives/anti-analysis/geofencing/browser (2026-08).
  # The matcher finds an Apple-branded password form, which is credential
  # phishing; the user-agent gating that made it geofencing lives in the
  # composite over in that directory, which references this atom.
  #
  # The old form ended in `(password|type\s*=\s*["']password)`, so the bare
  # word `password` within 180 characters of "Apple ID" was enough. That fired
  # on @bobfrankston/mailx's provider-picker help string
  # "Use an app-specific password: appleid.apple.com -> ... App-Specific
  # Passwords". Requiring the `type=password` input is what the name claims.
  - id: apple-id-password-input
    desc: Apple ID label beside a password input
    if:
      type: text
      regex: '(?is)(Apple\s*ID|appleId).{0,200}type\s*=\s*["'']?password'
  # Kerio Connect webmail names its login fields `kerio_u`/`kerio_p`. A page
  # carrying those exact field names beside a live password input renders
  # Kerio's login form; on a non-Kerio endpoint it is impersonation.
  - id: kerio-login-field-names
    desc: Kerio webmail login field names
    if:
      type: text
      regex: '(?i)name\s*=\s*["'']kerio_[up]["'']'
composite_rules:
  # Brand-impersonation twin of the harvest-form reconfirm rule: Kerio's
  # field names plus a password input plus a mail-script POST. The field
  # names alone could be a Kerio customization guide; posting the password
  # to mail.php instead of Kerio is the impersonation.
  - id: kerio-login-mail-php-harvest
    desc: Kerio login fields harvested via mail script
    crit: hostile
    conf: 0.97
    for: [html]
    all:
      - id: kerio-login-field-names
      - id: micro-behaviors/ui/controls/credential::html-password-input-tag
      - id: micro-behaviors/communications/http/post::html-form-post-method
      - id: micro-behaviors/communications/http/form::mail-php-form-action
  # Sparkasse twin of the Kerio rule above: the bank's brand vocabulary
  # beside a paired username/password login posting to a same-directory
  # PHP receiver. The brand words alone could be a help article; the
  # credential pair plus the relative receiver is the kit impersonation —
  # the bank's own login submits to its routed endpoints, not index.php.
  - id: sparkasse-brand-login-harvest
    desc: Sparkasse-branded login posts to relative PHP
    crit: hostile
    conf: 0.96
    for: [html]
    all:
      - id: objectives/credential-access/phishing/html-brand::sparkasse-online-banking-copy
      - id: micro-behaviors/ui/controls/credential::browser-credential-field-pair
      - id: micro-behaviors/communications/http/post::html-form-post-method
      - id: micro-behaviors/communications/http/form::relative-php-form-action
  # DHL twin for delivery-fee kits: the brand beside text inputs posting
  # to a same-directory PHP receiver. Card kits name their fields
  # gibberish (nm/nu/epx/vv) so no card vocabulary fires; the brand plus
  # the inputs plus the sibling-script receiver is the impersonation —
  # genuine DHL payment forms submit to routed endpoints.
  - id: dhl-brand-payment-harvest
    desc: DHL-branded form posts inputs to relative PHP
    crit: hostile
    conf: 0.94
    for: [html]
    all:
      - id: objectives/credential-access/phishing/html-brand::dhl-shipment-brand-copy
      - id: micro-behaviors/ui/controls/input::text-input-tag
      - id: micro-behaviors/communications/http/post::html-form-post-method
      - id: micro-behaviors/communications/http/form::relative-php-form-action
