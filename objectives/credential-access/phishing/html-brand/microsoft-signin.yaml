# Password controls and Microsoft URLs alone also occur in legitimate SSO.
# Require the deception of collecting two attempts with a forced rejection.
defaults:
  platforms: [windows, unix]
  for: [html, javascript]

composite_rules:
  - id: microsoft-signin-harvest-form
    desc: Microsoft sign-in reference with forced password retry collection
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/communications/http/services/microsoft::microsoft-login-domain
      - id: objectives/credential-access/phishing/operator-control::forced-password-retry-post
  # Brand marks plus runtime string decoding plus an identity-tagged POST:
  # the exfil half of kits that assemble their harvest off-static-view
  # (string tables, charCode decoders) and report each victim with an
  # operator identity parameter. The harvest form itself convicts in
  # landing::masked-brand-password-harvest; this names the concealment and
  # the tagged transport.
  - id: microsoft-obfuscated-identity-exfil
    desc: Branded page exfiltrates identity-tagged POST through decoding
    crit: hostile
    conf: 0.95
    attack: T1566.002,T1041
    for: [html]
    all:
      - id: well-known/app/system/microsoft-brand::ms-logo-brand-colours
      - id: micro-behaviors/data/string/conversion::fromcharcode-text-reference
      - id: micro-behaviors/communications/http/request/params::email-query-parameter
      - id: micro-behaviors/communications/http/post::post
