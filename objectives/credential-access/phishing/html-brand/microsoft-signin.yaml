# Microsoft-family sign-in brand claims beside a live password harvest: the
# pairing account-phish kits reuse (Microsoft-account-specific copy or the
# auth endpoints the real portal loads assets from, sitting next to a password
# input). The generic portal heading "sign in to your account" is not brand
# evidence -- every SSO and first-party login page uses it -- so the claim
# requires wording or endpoints that belong to Microsoft's sign-in surface.
# The `makefile` scope is deliberate: mailed phish bodies mistype as makefile
# in the file sniffer, so html-only scoping would leave the raw message blind.
defaults:
  platforms: [windows, unix]
  for: [html, makefile]
  attack: T1566.002
  mbc: B0030

traits:
  - id: microsoft-account-copy
    desc: Microsoft account sign-in brand copy
    crit: notable
    conf: 0.85
    if:
      type: text
      regex: '(?i)password for your microsoft account'
      case_insensitive: true
  - id: microsoft-auth-endpoint
    desc: Microsoft sign-in endpoint reference
    crit: notable
    conf: 0.85
    if:
      type: text
      regex: 'login\.microsoftonline\.|login\.live\.com|aadcdn\.|msftauth\.'

composite_rules:
  - id: microsoft-signin-claim
    desc: Microsoft sign-in brand evidence
    crit: notable
    conf: 0.9
    any:
      - id: microsoft-account-copy
      - id: microsoft-auth-endpoint
  - id: microsoft-signin-harvest-form
    desc: Microsoft-branded sign-in form harvesting a password
    crit: hostile
    conf: 0.96
    all:
      - id: micro-behaviors/ui/controls/credential::html-password-input-tag
      - id: microsoft-signin-claim
