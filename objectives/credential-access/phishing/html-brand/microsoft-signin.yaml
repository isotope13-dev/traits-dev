# Microsoft-family sign-in brand claims beside a live password harvest: the
# pairing account-phish kits reuse (copied sign-in title and error copy
# sitting next to a password input). The brand words alone also appear in
# setup guides and provider pickers, so conviction requires the password
# field; confirm the sender and container before triage. The `makefile`
# scope is deliberate: mailed phish bodies mistype as makefile in the file
# sniffer, so html-only scoping would leave the raw message blind.
defaults:
  platforms: [windows, unix]
  for: [html, makefile]
  attack: T1566.002
  mbc: B0030

traits:
  - id: microsoft-signin-claim
    desc: Microsoft account sign-in brand claim
    crit: notable
    conf: 0.85
    if:
      type: text
      regex: 'sign in to your account|password for your microsoft account'
      case_insensitive: true

composite_rules:
  - id: microsoft-signin-harvest-form
    desc: Microsoft-branded sign-in form harvesting a password
    crit: hostile
    conf: 0.96
    all:
      - id: objectives/credential-access/phishing/landing::harvest-password-input
      - id: microsoft-signin-claim
