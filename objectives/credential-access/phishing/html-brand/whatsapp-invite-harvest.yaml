# WhatsApp group-invite clone routing joiners to a local credential page.
# A genuine invite page links joining to a chat.whatsapp.com invite; routing
# the Join affordance to a same-directory login.php has no legitimate use, so
# the invite-plus-harvest pairing convicts. The adult-content hook alone only
# marks the traffic lure, hence suspicious.
defaults:
  platforms: [windows, unix]
  for: [html]
  attack: T1566.002
composite_rules:
  - id: whatsapp-invite-login-harvest
    desc: WhatsApp invite page routes join to a local login
    crit: hostile
    conf: 0.95
    near_bytes: 2000
    all:
      - id: micro-behaviors/ui/window/markup::whatsapp-group-invite-claim
      - id: micro-behaviors/ui/window/navigation::scripted-local-login-route
  - id: whatsapp-invite-adult-lure
    desc: Adult hook on a WhatsApp group invite page
    crit: suspicious
    conf: 0.88
    near_bytes: 1000
    all:
      - id: micro-behaviors/ui/window/markup::whatsapp-group-invite-claim
    any:
      - id: micro-behaviors/ui/window/markup::adult-hook-before-join
      - id: micro-behaviors/ui/window/markup::adult-hook-after-join
  - id: adult-hook-local-login-route
    desc: Adult-lured page routes to a local login
    crit: suspicious
    conf: 0.85
    near_bytes: 1000
    any:
      - id: micro-behaviors/ui/window/markup::adult-hook-before-join
      - id: micro-behaviors/ui/window/markup::adult-hook-after-join
    all:
      - id: micro-behaviors/ui/window/navigation::scripted-local-login-route
