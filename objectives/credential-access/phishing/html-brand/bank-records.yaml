defaults:
  platforms: [windows, unix]
  for: [html]
  crit: hostile
  conf: 0.98

composite_rules:
  - id: bank-record-confirmation-ip-lure
    desc: Bank confirmation threat links to external IP
    all:
      - id: micro-behaviors/ui/dialog/prompt::bank-account-record-confirmation
      - id: micro-behaviors/ui/dialog/prompt::account-confirmation-suspension-threat
      - id: micro-behaviors/communications/url/navigation-http::external-ip-bank-navigation-link
      - id: micro-behaviors/communications/http/download/browser::bank-domain-image-source

  - id: bank-certificate-update-subdomain-lure
    desc: Bank certificate update lure links to spoofed subdomain
    all:
      - id: micro-behaviors/ui/window/markup::certificate-wording-reference
      - id: micro-behaviors/communications/url/navigation-http::subdomain-spoofed-bank-navigation-link
    unless:
      - id: micro-behaviors/ui/window/html::bulk-mail-furniture-reference

  - id: bank-embedded-image-subdomain-lure
    desc: Embedded mail image links to spoofed bank subdomain
    near_bytes: 500
    all:
      - id: micro-behaviors/ui/window/html::cid-embedded-image
    any:
      - id: micro-behaviors/communications/url/navigation-http::subdomain-spoofed-bank-navigation-link
      - id: micro-behaviors/communications/url/navigation-http::bbt-nested-host-link
    unless:
      - id: micro-behaviors/ui/window/html::bulk-mail-furniture-reference


