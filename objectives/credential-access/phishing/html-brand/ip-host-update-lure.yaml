# Account and billing-update lures whose action link targets a raw-IP host.
# A brand's real account, billing or verification pages never live on a bare
# IP address, so an anchor wired to an IP-literal href marks harvest
# infrastructure rather than a legitimate brand notice. The pretext pairing
# distinguishes a lure from a private-administration page that happens to
# link an IP (private and loopback ranges are excluded on the atom).
defaults:
  platforms: [windows, unix]
  for: [html]
  attack: T1566.002
  mbc: B0030

traits:
  - id: ip-literal-action-anchor
    desc: Click or update anchor to IP host
    crit: suspicious
    conf: 0.9
    if:
      type: text
      regex: '<a[^>]{0,60}href=.?http://\d{1,3}(\.\d{1,3}){3}[^>]{0,60}>[^<]{0,60}(click here|update)'
      case_insensitive: true
      exclude_html_comments: true
    not:
      - regex: '//(192\.168\.|10\.|127\.|172\.(1[6-9]|2\d|3[01])\.)'
      - regex: '//0\.0\.0\.0'
    unless:
      # Parser corpora keep real archived pages under test/ and the
      # expected-output mirror under result/HTML/. Those are not lures.
      - id: metadata/file/naming::test-directory-component
      - type: path
        regex: '(^|[\\/])result[\\/]HTML[\\/]'

composite_rules:
  # The classic billing-update phish: record-update pretext beside an
  # IP-hosted action link. No legitimate sender pairs billing-update copy
  # with a bare-IP destination.
  - id: billing-update-ip-host-lure
    desc: Billing-update lure anchors to an IP host
    crit: hostile
    conf: 0.95
    near_bytes: 2000
    all:
      - id: ip-literal-action-anchor
      - id: micro-behaviors/ui/window/markup::billing-records-update-pretext
  # Same billing-update lure when the link text is a decoy URL rather than
  # the words "click here" or "update", and the href path is long. The
  # public-IP anchor atom already excludes private and loopback ranges.
  - id: billing-update-public-ipv4-link
    desc: Billing-update lure links a public IP
    crit: hostile
    conf: 0.95
    near_bytes: 2000
    all:
      - id: micro-behaviors/communications/ip/literal::html-anchor-public-ipv4-href
      - id: micro-behaviors/ui/window/markup::billing-records-update-pretext

  # Same deception where the urgency is a termination threat instead of a
  # records-update demand.
  - id: termination-threat-ip-host-lure
    desc: Termination-threat lure anchors to an IP host
    crit: hostile
    conf: 0.94
    near_bytes: 2000
    all:
      - id: ip-literal-action-anchor
      - id: micro-behaviors/ui/window/markup::account-termination-threat-pretext

  # Account-compromise scare ("your account may have been accessed by an
  # unauthorized third party") whose link goes to a bare public IP or user-home path. A bank's
  # real sign-in never lives on an IP literal, so the pretext plus the
  # IP-hosted link marks a credential-harvest lure.
  - id: account-compromise-ip-host-lure
    desc: Account-compromise lure links to an IP host
    crit: hostile
    conf: 0.94
    near_bytes: 3000
    all:
      - id: micro-behaviors/ui/window/markup::unauthorized-account-access-pretext
    any:
      - id: micro-behaviors/communications/ip/literal::html-anchor-public-ipv4-href
      - id: micro-behaviors/communications/url/path::ip-host-user-path

  # Security-standards update copy whose only action is a public-IP anchor.
  - id: bank-security-update-ip-host-lure
    desc: Bank-update lure links a raw IP
    crit: hostile
    conf: 0.95
    near_bytes: 2000
    all:
      - id: micro-behaviors/ui/window/markup::bank-payment-security-update-pretext
      - id: micro-behaviors/communications/ip/literal::html-anchor-public-ipv4-href

  # The same impersonal greeting, with the recipient mailbox stuffed into
  # that IP-hosted URL.
  - id: salutation-ip-href-embeds-mailbox
    desc: Dear-member lure embeds mailbox in URL
    crit: hostile
    conf: 0.95
    near_bytes: 2500
    all:
      - id: micro-behaviors/ui/window/markup::impersonal-brand-user-salutation
      - id: micro-behaviors/communications/ip/literal::html-anchor-public-ipv4-href
      - id: micro-behaviors/communications/ip/literal::href-query-embeds-mailbox


  - id: branded-account-suspension-public-ip-lure
    desc: Branded suspension threat links a public IP
    crit: hostile
    conf: 0.97
    near_bytes: 3000
    all:
      - id: micro-behaviors/ui/window/markup::ebay-brand-reference
      - id: micro-behaviors/ui/window/markup::suspend-access-account-pretext
      - id: micro-behaviors/communications/ip/literal::html-anchor-public-ipv4-href
