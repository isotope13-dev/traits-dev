defaults:
  platforms: [windows, unix]
  for: [html]
composite_rules:
  # This is evidence of an unusual copied login frontend, not proof of
  # credential theft. The JavaScript and PHP receivers must be inspected.
  - id: orange-login-php-receivers
    desc: Orange login UI uses PHP receivers
    crit: suspicious
    conf: 0.94
    all:
      - id: micro-behaviors/ui/window/markup::orange-account-login-copy
      - id: micro-behaviors/communications/http/url/php-endpoint::configured-login-php-resource
      - id: micro-behaviors/communications/http/form::relative-php-form-action
