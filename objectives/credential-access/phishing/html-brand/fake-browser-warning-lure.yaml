# Fake browser-protection warning: the Safe Browsing brand paired with a
# protection-unavailable message that pushes the visitor to download and run
# a file manually. The brand sits in hidden pretext while the visible page
# shows only branded artwork, so the two markers join in a proximity
# composite. Genuine Google support pages can name the brand near download
# wording, so the pairing alone stays suspicious; the cloaked-text and
# remote-script traits carry the delivery mechanism.
defaults:
  platforms: [windows, unix]
  for: [html]
  attack: T1566.002
  mbc: B0030
traits:
  - id: safe-browsing-brand-copy
    desc: Safe Browsing brand copy in page
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)\bsafe.?browsing\b'
  - id: protection-outage-download-copy
    desc: Protection outage urges manual download
    crit: notable
    conf: 0.85
    if:
      type: text
      regex: '(?i)service is unavailable[^<]{0,200}download[^<]{0,80}manually'
composite_rules:
  - id: fake-safe-browsing-outage-lure
    desc: Fake Safe Browsing outage download lure
    crit: suspicious
    conf: 0.85
    near_bytes: 4096
    all:
      - id: safe-browsing-brand-copy
      - id: protection-outage-download-copy
