# PayPal-brand lookalike harvest links: anchors whose host carries the
# brand string without belonging to the brand zone (letter-stuffed roots
# such as paypalllaa.biz, hyphen-suffixed mimics such as
# paypal.com-cgi-bin.biz). The brand's own zones are excluded, so the atom
# marks lookalike infrastructure, not legitimate brand links.
defaults:
  platforms: [windows, unix]
  for: [html]
  attack: T1566.002
  mbc: B0030
traits:
  - id: paypal-lookalike-domain
    desc: URL host mimics the PayPal brand zone
    crit: suspicious
    conf: 0.94
    for: [html, text, makefile]
    unless:
      # Phishing-URL signatures encode lookalike hosts as detection content.
      - id: well-known/tool/detection/malware-signature-table::antivirus-signature-database
      - id: metadata/file/format/structured::threat-indicator-data
    if:
      type: text
      regex: '(?i)https?://[A-Za-z0-9.-]*paypal[A-Za-z0-9.-]*\.[a-z]{2,}([:/?#]|$)'
    not:
      - regex: '(?i)//([A-Za-z0-9-]+\.)*paypal\.com([:/?#]|$)'
      - regex: '(?i)//([A-Za-z0-9-]+\.)*paypalobjects\.com([:/?#]|$)'
      - regex: '(?i)//([A-Za-z0-9-]+\.)*paypal\.me([:/?#]|$)'
      # PayPal's localized paypal.de and paypal.fr domains appear in obsolete
      # translations; modified labels and other country-code lookalikes remain.
      - regex: '(?i)//([A-Za-z0-9-]+\.)*paypal\.(de|fr)([:/?#]|$)'
      # RFC 2606 reserves example.com/.org/.net for documentation: a brand
      # link pointed there is a simulation template or an example, not
      # reachable lookalike infrastructure.
      - regex: '(?i)//([A-Za-z0-9-]+\.)*example\.(com|org|net)([:/?#]|$)'
  # Brand-image link content: the anchor's first content is PayPal artwork
  # (alt text or brand-asset source). Legitimate brand mail wraps its own
  # artwork the same way, so this stays neutral; the harvest composite
  # pairs it with a lookalike destination.
  - id: paypal-image-anchor-content
    desc: PayPal brand image inside anchor
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)<a[^>]{0,300}>[^<]{0,10}<img[^>]{0,120}(alt=PayPal|paypal\.com/images)'
      exclude_html_comments: true
  - id: paypal-dotted-path-segment
    desc: Path segment mimics a PayPal host
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)/\.paypal/'
      exclude_html_comments: true
  # Mail can show a PayPal URL while the anchor's actual destination is an
  # unrelated host. Tracking and redirect links can be legitimate, so the
  # atom stays suspicious; the phishing composite adds the account lure.
  - id: paypal-url-text-offsite-anchor
    desc: PayPal URL text links to another host
    crit: suspicious
    conf: 0.96
    if:
      type: text
      regex: '<a[^>]{0,80}href=["'']https?://.{1,200}["''][^>]{0,250}>https?://(www\.)?paypal\.com/'
      exclude_html_comments: true
      case_insensitive: true
    not:
      - regex: '<a\b[^>]{0,80}href=["'']https?://([a-z0-9-]+\.)*paypal\.com/[^"'']*["''][^>]*>\s*https?://(www\.)?paypal\.com/'
composite_rules:
  # Scare-driven lookalike harvest: a lookalike link paired with an
  # account-scare or identity-verification pretext. No legitimate sender
  # pairs brand-mimicking infrastructure with threats or verify demands.
  - id: paypal-lookalike-scare-harvest-link
    desc: Scare-driven PayPal lookalike harvest link
    crit: hostile
    conf: 0.95
    for: [html, text, makefile]
    near_bytes: 2000
    all:
      - id: paypal-lookalike-domain
    any:
      - id: micro-behaviors/ui/window/markup::unauthorized-account-access-pretext
      - id: micro-behaviors/ui/window/markup::account-suspension-claim
      - id: micro-behaviors/ui/window/markup::suspend-access-account-pretext
      - id: micro-behaviors/ui/window/markup::account-limitation-pretext
      - id: micro-behaviors/ui/window/markup::identity-confirmation-request-text
      - id: micro-behaviors/ui/window/markup::lost-stolen-card-pretext
  # Image-disguised lookalike harvest: PayPal artwork wired to a lookalike
  # host. Legitimate brand mail links its artwork to the brand zone, which
  # the lookalike atom excludes, so the pairing has no legitimate use.
  - id: paypal-image-lookalike-harvest-link
    desc: PayPal artwork disguises lookalike link
    crit: hostile
    conf: 0.95
    near_bytes: 500
    all:
      - id: paypal-lookalike-domain
      - id: paypal-image-anchor-content

  - id: paypal-path-behind-nested-url
    desc: PayPal path hidden in a nested URL
    crit: hostile
    conf: 0.94
    near_bytes: 800
    all:
      - id: paypal-dotted-path-segment
      - id: micro-behaviors/ui/window/html::url-text-anchor
      - id: micro-behaviors/communications/http/url/query::nested-remote-url-value
    unless:
      - id: micro-behaviors/ui/window/html::bulk-mail-furniture-reference
  - id: paypal-lookalike-percent-encoded-path
    desc: PayPal lookalike hides path in percent-encoding
    crit: hostile
    conf: 0.95
    near_bytes: 400
    all:
      - id: paypal-lookalike-domain
      - id: micro-behaviors/communications/http/url/encoded::href-percent-encoded-letter-run
  - id: paypal-account-information-offsite-lure
    desc: PayPal account-information lure links off-site
    crit: hostile
    conf: 0.96
    near_bytes: 2500
    all:
      - id: micro-behaviors/ui/window/markup::paypal-brand-reference
      - id: micro-behaviors/ui/window/markup::account-followed-by-more-information
      - id: paypal-url-text-offsite-anchor
    unless:
      - id: micro-behaviors/ui/window/html::bulk-mail-furniture-reference
