# LinkedIn file bait collecting a password through a WordPress admin handler
# is not a LinkedIn sign-in or an OAuth consent flow.
defaults:
  platforms: [windows, unix]
  for: [html]
composite_rules:
  - id: linkedin-file-wordpress-password-post
    desc: LinkedIn shared-file lure posts a password to WordPress admin PHP
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/ui/controls/credential::linkedin-business-network-copy
      - id: micro-behaviors/ui/controls/credential::shared-file-signin-copy
      - id: micro-behaviors/communications/http/form::wordpress-admin-php-form-action
      - id: micro-behaviors/communications/http/post::html-form-post-method
      - id: micro-behaviors/ui/controls/credential::html-password-input-tag
