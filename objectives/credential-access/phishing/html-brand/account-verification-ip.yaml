defaults:
  platforms: [windows, unix]
  for: [html]
  attack: T1566.002
composite_rules:
  - id: ebay-identity-verification-ip-lure
    desc: eBay identity verification lure links to an external IP
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/ui/window/markup::ebay-brand-reference
      - id: micro-behaviors/ui/window/markup::identity-confirmation-request-text
      - id: micro-behaviors/communications/ip/literal::http-ip-url-filtered-text
      - id: micro-behaviors/communications/url/path::ebay-isapi-cgi-path

  - id: ebay-suspension-public-ip-verification
    desc: eBay suspension lure directs verification to public IP
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/ui/window/markup::ebay-brand-reference
      - id: micro-behaviors/ui/window/markup::suspend-access-account-pretext
      - id: objectives/credential-access/phishing/html-brand::ip-literal-action-anchor
      - id: micro-behaviors/communications/ip/literal::html-anchor-public-ipv4-href
