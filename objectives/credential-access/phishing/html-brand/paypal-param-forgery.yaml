# Phishing pages reuse PayPal-style _login-run/dispatch parameters on a
# non-branded login.php hand-off. The matcher identifies this URL shape;
# it does not require or claim that PayPal branding appears in the file.
defaults:
  platforms: [windows, unix]
  for: [html]
  attack: T1566.002
  mbc: B0030
composite_rules:
  - id: paypal-style-login-run-dispatch-redirect
    desc: Redirect uses PayPal-style _login-run and dispatch parameters
    crit: hostile
    conf: 0.95
    all:
      - id: micro-behaviors/communications/url/query/credential::login-page-login-run-dispatch
    any:
      - id: micro-behaviors/ui/window/navigation/refresh::browser-meta-refresh-instant-relative-url
      - id: micro-behaviors/ui/window/navigation/location::browser-location-replace
      - id: micro-behaviors/data/property/assign::location-href-write-text
