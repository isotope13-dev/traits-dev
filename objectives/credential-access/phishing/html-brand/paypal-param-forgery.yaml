# PayPal's genuine sign-in flow is reached through URLs shaped
# ?cmd=_login-run&dispatch=<hex> on paypal.com hosts. Kits reproduce that
# parameter structure on their own bare login.php so the hand-off address
# looks like the brand's; only the brand's own host may carry it.
defaults:
  platforms: [windows, unix]
  for: [html]
  attack: T1566.002
  mbc: B0030
composite_rules:
  - id: paypal-login-params-forgery-redirect
    desc: Redirector forges PayPal login-flow URL parameters
    crit: hostile
    conf: 0.95
    all:
      - id: micro-behaviors/communications/http/url/php-endpoint::login-page-forged-login-run-params
    any:
      - id: micro-behaviors/ui/window/navigation::browser-meta-refresh-instant-relative-url
      - id: micro-behaviors/ui/window/navigation::browser-location-replace
      - id: micro-behaviors/ui/window/navigation::browser-location-href-assign
