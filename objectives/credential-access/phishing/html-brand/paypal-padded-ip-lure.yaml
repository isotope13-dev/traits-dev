defaults:
  platforms:
  - windows
  - unix
  for:
  - html
  attack: T1566.002
traits:
- id: paypal-label-ip-href
  desc: IP-hosted anchor displays a PayPal URL
  crit: suspicious
  conf: 0.98
  if:
    type: text
    regex: (?i)href=["']https?://[0-9.]+/[^"'<>]{1,240}["']>https?://(www[.])?paypal[.]com/
    is: external_ip
    exclude_html_comments: true
# Image-labelled variant: the anchor points at a numeric IP but its first
# content is a PayPal brand image (alt text or brand-asset source), so the
# victim sees PayPal artwork while the click goes to the attacker host.
# The href gap tolerates quoted-printable (`=3D`) and soft line breaks.
- id: paypal-image-ip-href
  desc: IP-hosted anchor wraps PayPal brand image
  crit: suspicious
  conf: 0.98
  if:
    type: text
    regex: href=(3D)?["']https?://[\d.]+/[^"']{0,300}["'][^<]{0,10}<img[^>]{0,80}PayPal
    is: external_ip
    case_insensitive: true
    exclude_html_comments: true
composite_rules:
- id: paypal-padded-ip-harvest-link
  desc: PayPal label disguises padded IP link
  crit: hostile
  conf: 0.97
  near_bytes: 256
  all:
  - id: micro-behaviors/communications/url/path::dot-space-path-padding
  any:
  - id: paypal-label-ip-href
  - id: paypal-image-ip-href
