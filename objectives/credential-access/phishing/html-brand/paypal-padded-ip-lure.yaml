# PayPal lure with a padded IP destination: the page shows official
# PayPal links as camouflage while its harvest link points at a numeric
# host through dot-space path padding. Brand plus attacker destination
# plus evasion padding; any two alone stay neutral.
defaults:
  platforms: [windows, unix]
  for: [html]
  attack: T1566.002
composite_rules:
  - id: paypal-padded-ip-harvest-link
    desc: PayPal lure links padded IP destination
    crit: hostile
    conf: 0.97
    all:
      - id: micro-behaviors/ui/window/html::paypal-official-anchor
      - id: micro-behaviors/communications/ip/literal::http-ip-url-filtered-text
      - id: micro-behaviors/communications/url/path::dot-space-path-padding
