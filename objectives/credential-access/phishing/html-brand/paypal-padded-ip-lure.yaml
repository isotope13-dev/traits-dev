defaults:
  platforms:
  - windows
  - unix
  for:
  - html
  attack: T1566.002
traits:
- id: paypal-label-ip-href
  desc: IP-hosted anchor displays a PayPal URL
  crit: suspicious
  conf: 0.98
  if:
    type: text
    regex: (?i)href=["']https?://[0-9.]+/[^"'<>]{1,240}["']>https?://(www[.])?paypal[.]com/
    is: external_ip
    exclude_html_comments: true
composite_rules:
- id: paypal-padded-ip-harvest-link
  desc: PayPal URL label disguises padded IP link
  crit: hostile
  conf: 0.97
  near_bytes: 256
  all:
  - id: paypal-label-ip-href
  - id: micro-behaviors/communications/url/path::dot-space-path-padding
