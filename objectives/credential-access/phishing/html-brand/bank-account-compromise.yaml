# Bank account-compromise scare lures: a financial brand rendered beside an
# unauthorized-access scare pretext ("account ... accessed by an unauthorized
# third party"), optionally with an impersonal "Dear <brand> user" salutation.
# Legitimate fraud alerts use the same vocabulary, so these stay suspicious:
# the hostility of a full Bankfraud page comes from its harvest form or
# deceptive link, which a truncated lure fragment does not contain.
defaults:
  platforms: [windows, unix]
  for: [html]
  attack: T1566.002
  mbc: B0030
  crit: suspicious
  conf: 0.92

composite_rules:
  - id: etrade-unauthorized-access-scare-lure
    desc: E*TRADE brand with unauthorized-access scare pretext
    all:
      - id: micro-behaviors/ui/window/markup::etrade-brand-reference
      - id: micro-behaviors/ui/window/markup::unauthorized-account-access-pretext
    near_bytes: 2000
  - id: impersonal-salutation-account-scare-lure
    desc: Impersonal salutation with account-compromise scare
    conf: 0.9
    all:
      - id: micro-behaviors/ui/window/markup::impersonal-brand-user-salutation
      - id: micro-behaviors/ui/window/markup::unauthorized-account-access-pretext
    near_bytes: 2000
  - id: usbank-unauthorized-access-scare-lure
    desc: U.S. Bank brand with unauthorized-access scare pretext
    all:
      - id: micro-behaviors/ui/window/markup::usbank-brand-reference
      - id: micro-behaviors/ui/window/markup::unauthorized-account-access-pretext
    near_bytes: 2000
  - id: suntrust-security-warning-scare-lure
    desc: SunTrust brand with security alert pretext
    all:
      - id: micro-behaviors/ui/window/markup::suntrust-brand-reference
    any:
      - id: micro-behaviors/ui/window/markup::bank-security-warning-pretext
      - id: micro-behaviors/ui/window/markup::bank-certificate-update-pretext
    near_bytes: 2000
  - id: citibank-agreement-update-scare-lure
    desc: Citibank brand with agreement-update pretext
    conf: 0.92
    all:
      - id: micro-behaviors/ui/window/markup::citibank-brand-reference
    any:
      - id: micro-behaviors/ui/window/markup::account-agreement-update-pretext
      - id: micro-behaviors/ui/window/markup::new-terms-conditions-pretext
    near_bytes: 2000
  # Full confirmation-page shape: the brand rides on an agreement-update
  # pretext whose call to action is a label-displayed URL. The deceptive-link
  # leg supplies the hostility the copy alone lacks.
  - id: citibank-agreement-label-link-lure
    desc: Citibank agreement lure shows URL in label
    crit: hostile
    conf: 0.93
    all:
      - id: micro-behaviors/ui/window/markup::citibank-brand-reference
      - id: micro-behaviors/ui/window/html::label-url-display-text
    any:
      - id: micro-behaviors/ui/window/markup::account-agreement-update-pretext
      - id: micro-behaviors/ui/window/markup::new-terms-conditions-pretext
    near_bytes: 2000
  - id: citibank-identity-confirmation-scare-lure
    desc: Citibank brand with identity-confirmation pretext
    conf: 0.9
    all:
      - id: micro-behaviors/ui/window/markup::citibank-brand-reference
      - id: micro-behaviors/ui/window/markup::identity-confirmation-request-pretext
    near_bytes: 2000
  # Verification phishes that skip compromise/suspension scare vocabulary and
  # open directly on unusual activity plus a verify directive. Same standing
  # as the scare pairings: genuine fraud alerts share the wording, so the
  # brand plus pretext pairing stays suspicious.
  # The SunTrust "Sunfraud" shape: brand plus a link whose display text is a
  # bank URL sending elsewhere, plus the lost-or-stolen card pretext. The
  # link label sits at the end while the brand rides in the head (3800+
  # bytes apart here), so these pairings get the wider window.
  - id: suntrust-link-lure
    desc: SunTrust brand with deceptive URL label
    conf: 0.9
    all:
      - id: micro-behaviors/ui/window/markup::suntrust-brand-reference
      - id: micro-behaviors/ui/window/html::url-text-anchor
      - id: micro-behaviors/ui/window/markup::lost-stolen-card-pretext
    near_bytes: 4096
  # Same lure through its redirect-laundering leg: the update link hides
  # behind a search-engine redirect (google.com/url?q=<kit>) while the card
  # pretext supplies the urgency.
  - id: suntrust-redirect-laundered-lure
    desc: SunTrust lure with laundered update link
    conf: 0.9
    all:
      - id: micro-behaviors/ui/window/markup::suntrust-brand-reference
      - id: micro-behaviors/ui/window/markup::lost-stolen-card-pretext
      - id: micro-behaviors/communications/http/url/query::nested-remote-url-value
    near_bytes: 4096
  - id: chase-unusual-activity-verify-lure
    desc: Chase brand with unusual-activity verify pretext
    all:
      - id: micro-behaviors/ui/window/markup::chase-brand-reference
      - id: micro-behaviors/ui/window/markup::unusual-activity-verify-pretext
    near_bytes: 2000
  # The same verify pretext paired with an Outlook-only VML fallback button:
  # kits serve one verification destination to browsers and another to mail
  # clients. Marketing mail uses VML buttons but rarely beside verify-lure
  # copy, so the pairing stays suspicious rather than hostile.
  - id: mso-fallback-verify-button-lure
    desc: Verify lure with Outlook-only fallback button
    conf: 0.88
    all:
      - id: micro-behaviors/ui/window/markup::mso-vml-cta-button
      - id: micro-behaviors/ui/window/markup::unusual-activity-verify-pretext
    # The fallback button rides at the end of the lure while the copy sits
    # mid-page (2600+ bytes apart here), so this pairing gets the wider
    # brand-in-head window rather than the file's usual 2000.
    near_bytes: 4096
  - id: washington-mutual-unauthorized-access-scare-lure
    desc: Washington Mutual brand with access scare
    all:
      - id: micro-behaviors/ui/window/markup::washington-mutual-brand-reference
      - id: micro-behaviors/ui/window/markup::unauthorized-account-access-pretext
    near_bytes: 2000
