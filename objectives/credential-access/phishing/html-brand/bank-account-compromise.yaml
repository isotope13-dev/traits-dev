# Bank account-compromise scare lures: a financial brand rendered beside an
# unauthorized-access scare pretext ("account ... accessed by an unauthorized
# third party"), optionally with an impersonal "Dear <brand> user" salutation.
# Legitimate fraud alerts use the same vocabulary, so these stay suspicious:
# the hostility of a full Bankfraud page comes from its harvest form or
# deceptive link, which a truncated lure fragment does not contain.
defaults:
  platforms: [windows, unix]
  for: [html]
  attack: T1566.002
  mbc: B0030
  crit: suspicious
  conf: 0.92

composite_rules:
  - id: etrade-unauthorized-access-scare-lure
    desc: E*TRADE brand with unauthorized-access scare pretext
    all:
      - id: micro-behaviors/ui/window/markup::etrade-brand-reference
      - id: micro-behaviors/ui/window/markup::unauthorized-account-access-pretext
    near_bytes: 2000
  - id: impersonal-salutation-account-scare-lure
    desc: Impersonal salutation with account-compromise scare
    conf: 0.9
    all:
      - id: micro-behaviors/ui/window/markup::impersonal-brand-user-salutation
      - id: micro-behaviors/ui/window/markup::unauthorized-account-access-pretext
    near_bytes: 2000
  - id: usbank-unauthorized-access-scare-lure
    desc: U.S. Bank brand with unauthorized-access scare pretext
    all:
      - id: micro-behaviors/ui/window/markup::usbank-brand-reference
      - id: micro-behaviors/ui/window/markup::unauthorized-account-access-pretext
    near_bytes: 2000
  - id: suntrust-security-warning-scare-lure
    desc: SunTrust brand with security alert pretext
    all:
      - id: micro-behaviors/ui/window/markup::suntrust-brand-reference
    any:
      - id: micro-behaviors/ui/window/markup::bank-security-warning-pretext
      - id: micro-behaviors/ui/window/markup::bank-certificate-update-pretext
    near_bytes: 2000
  - id: citibank-agreement-update-scare-lure
    desc: Citibank brand with agreement-update pretext
    conf: 0.92
    all:
      - id: micro-behaviors/ui/window/markup::citibank-brand-reference
    any:
      - id: micro-behaviors/ui/window/markup::account-agreement-update-pretext
      - id: micro-behaviors/ui/window/markup::new-terms-conditions-pretext
    near_bytes: 2000
  # Full confirmation-page shape: the brand rides on an agreement-update
  # pretext whose call to action is a label-displayed URL. The deceptive-link
  # leg supplies the hostility the copy alone lacks.
  - id: citibank-agreement-label-link-lure
    desc: Citibank agreement lure shows URL in label
    crit: hostile
    conf: 0.93
    all:
      - id: micro-behaviors/ui/window/markup::citibank-brand-reference
      - id: micro-behaviors/ui/window/html::label-url-display-text
    any:
      - id: micro-behaviors/ui/window/markup::account-agreement-update-pretext
      - id: micro-behaviors/ui/window/markup::new-terms-conditions-pretext
    near_bytes: 2000
  - id: citibank-identity-confirmation-scare-lure
    desc: Citibank brand with identity-confirmation pretext
    conf: 0.9
    all:
      - id: micro-behaviors/ui/window/markup::citibank-brand-reference
      - id: micro-behaviors/ui/window/markup::identity-confirmation-request-pretext
    near_bytes: 2000

