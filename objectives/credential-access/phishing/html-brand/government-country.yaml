# SARS refund lures use authority-country labels under unrelated hosting
# domains. Match that reusable URL structure, never a campaign hostname or
# display-language vocabulary. These bounded co-occurrences are suspicious;
# they do not prove which form owns each input, or backend exfiltration.
defaults:
  platforms: [windows, unix]
  for: [html, php, javascript, typescript]
  crit: suspicious
  conf: 0.9

composite_rules:
  - id: government-country-password-form
    desc: Password near government-lookalike form POST
    scope: file
    near_bytes: 900
    all:
      - id: micro-behaviors/communications/http/request/html::government-country-form-action
      - id: micro-behaviors/communications/http/form::html-form-post-method
    any:
      - id: micro-behaviors/ui/controls/credential::password-input-field
      - id: micro-behaviors/ui/controls/credential::password-input-field-script

  - id: government-country-card-form
    desc: Card inputs near government-lookalike form POST
    scope: file
    near_bytes: 900
    all:
      - id: micro-behaviors/communications/http/request/html::government-country-form-action
      - id: micro-behaviors/communications/http/form::html-form-post-method
      - id: micro-behaviors/ui/window/banking-field::card-number-autocomplete-input
      - id: micro-behaviors/ui/window/banking-field::card-security-autocomplete-input
