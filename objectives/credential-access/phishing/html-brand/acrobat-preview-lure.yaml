# Acrobat failed-preview lure copy: the brand name paired with a
# cannot-preview-here message that pushes the visitor to open or download
# the file elsewhere. The brand sits in the page head while the lure copy
# renders several kilobytes later, so the two markers join in a proximity
# composite. Genuine Adobe error and support pages can pair the same brand
# with similar wording, so the pairing alone stays suspicious; redirect
# composites supply the forced navigation a kit adds.
defaults:
  platforms: [windows, unix]
  for: [html]
  attack: T1566.002
  mbc: B0030
traits:
  - id: acrobat-brand-copy
    desc: Acrobat brand copy in page
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)\bacrobate?\b'
composite_rules:
  - id: acrobat-failed-preview-lure
    desc: Acrobat-branded failed file-preview lure
    crit: suspicious
    conf: 0.88
    near_bytes: 4096
    all:
      - id: acrobat-brand-copy
      - id: micro-behaviors/ui/dialog/prompt::preview-unavailable-wording
