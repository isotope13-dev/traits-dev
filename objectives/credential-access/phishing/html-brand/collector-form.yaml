defaults:
  platforms: [windows, unix]
  for: [html, rtf]
  crit: hostile
  conf: 0.98
  attack: T1056.003,T1566.001

composite_rules:
  - id: microsoft-password-form-collector
    desc: Microsoft password capture via form collector
    all:
      - id: well-known/app/system/microsoft-brand::microsoft-account-password-wording
      - id: objectives/exfiltration/stealer/credential/value/password::password-attempt-form-collector
