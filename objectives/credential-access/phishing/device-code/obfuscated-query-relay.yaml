defaults:
  platforms: [windows, unix]
  for: [html, scripts, source]
  crit: suspicious
  conf: 0.93
  attack: T1528

composite_rules:
  # Obscuring the relay adds concealment evidence, without requiring a brand,
  # an English lure, clipboard access, or one deployment's PHP script name.
  - id: obfuscated-device-code-query-relay
    desc: Device-code relay obscured by rotating string tables
    attack: T1027,T1528
    all:
      - id: micro-behaviors/communications/http/device-code::device-code-query-session-relay
    any:
      - id: objectives/anti-static/obfuscation/obfuscator/js-obfuscator::hex-name-mangling-with-string-table-rotation
      - id: objectives/anti-static/obfuscation/obfuscator/js-obfuscator::javascript-obfuscator-string-array-runtime
      - id: objectives/anti-static/obfuscation/obfuscator/js-obfuscator::plain-javascript-obfuscator-string-array-runtime
    near_lines: 100
