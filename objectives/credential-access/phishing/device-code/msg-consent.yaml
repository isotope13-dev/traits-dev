# OAuth consent phishing delivered as a mail message. The authorize
# URL lives in the UTF-16LE message body, so the atoms match wide
# character sequences in the raw message instead of extracted text.
# A bare authorize link is not hostile: legitimate SSO mail carries
# them. Hostility requires the silent-consent parameter set, or the
# link disguised as a document beside an authority freeze pretext.
defaults:
  platforms: [windows, unix]
  for: [msg, oledoc]
  attack: T1566.002,T1528

traits:
  - id: msg-oauth-authorize-link
    desc: Message body carries an OAuth authorize link
    crit: notable
    conf: 0.92
    if:
      type: hex
      pattern: "2F 00 6F 00 61 00 75 00 74 00 68 00 32 00 2F 00"

  - id: msg-oauth-prompt-none
    desc: Message OAuth link suppresses the prompt
    crit: notable
    conf: 0.92
    if:
      type: hex
      pattern: "70 00 72 00 6F 00 6D 00 70 00 74 00 3D 00 6E 00 6F 00 6E 00 65 00"

  - id: msg-oauth-redirect-uri
    desc: Message OAuth link sets a redirect URI
    crit: notable
    conf: 0.92
    if:
      type: hex
      pattern: "72 00 65 00 64 00 69 00 72 00 65 00 63 00 74 00 5F 00 75 00 72 00 69 00 3D 00 68 00 74 00 74 00 70 00"

  - id: msg-pdf-disguised-link
    desc: PDF filename presented before a bracketed link
    crit: notable
    conf: 0.9
    if:
      type: hex
      pattern: "2E 00 70 00 64 00 66 00 20 00 3C 00 68 00 74 00 74 00 70 00"

  - id: msg-debit-freeze-wording
    desc: Debit freeze wording in message
    crit: notable
    conf: 0.88
    if:
      type: hex
      pattern: "(64 00|44 00) 65 00 62 00 69 00 74 00 20 00 (66 00|46 00) 72 00 65 00 65 00 7A 00 65 00"

  - id: msg-account-freeze-wording
    desc: Account freeze wording in message
    crit: notable
    conf: 0.88
    if:
      type: hex
      pattern: "(61 00|41 00) 63 00 63 00 6F 00 75 00 6E 00 74 00 20 00 (66 00|46 00) 72 00 65 00 65 00 7A 00 65 00"

  - id: msg-freeze-request-wording
    desc: Freeze request wording in message
    crit: notable
    conf: 0.88
    if:
      type: hex
      pattern: "(66 00|46 00) 72 00 65 00 65 00 7A 00 65 00 20 00 (72 00|52 00) 65 00 71 00 75 00 65 00 73 00 74 00"

  - id: msg-police-wording
    desc: Police wording in message
    crit: notable
    conf: 0.85
    if:
      type: hex
      pattern: "(70 00|50 00) 6F 00 6C 00 69 00 63 00 65 00"

  - id: msg-court-wording
    desc: Court wording in message
    crit: notable
    conf: 0.85
    if:
      type: hex
      pattern: "(63 00|43 00) 6F 00 75 00 72 00 74 00"

composite_rules:
  - id: msg-freeze-wording
    desc: Freeze wording in message
    crit: notable
    conf: 0.88
    any:
      - id: msg-debit-freeze-wording
      - id: msg-account-freeze-wording
      - id: msg-freeze-request-wording

  - id: msg-authority-wording
    desc: Police or court wording in message
    crit: notable
    conf: 0.85
    any:
      - id: msg-police-wording
      - id: msg-court-wording

  - id: msg-oauth-silent-consent-params
    desc: Message OAuth link uses silent-consent params
    crit: notable
    conf: 0.94
    all:
      - id: msg-oauth-prompt-none
      - id: msg-oauth-redirect-uri

  - id: msg-account-freeze-pretext
    desc: Account freeze authority pretext in message
    crit: suspicious
    conf: 0.9
    all:
      - id: msg-freeze-wording
      - id: msg-authority-wording

  - id: msg-silent-oauth-consent-phish
    desc: Silent OAuth consent link in mail message
    crit: hostile
    conf: 0.97
    all:
      - id: msg-oauth-authorize-link
      - id: msg-oauth-silent-consent-params

  - id: msg-pdf-disguised-oauth-freeze-phish
    desc: PDF-disguised OAuth link with freeze pretext
    crit: hostile
    conf: 0.97
    all:
      - id: msg-oauth-authorize-link
      - id: msg-pdf-disguised-link
      - id: msg-account-freeze-pretext
