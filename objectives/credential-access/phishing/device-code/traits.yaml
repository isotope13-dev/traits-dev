defaults:
  platforms: [windows, unix]
  for: [html, scripts]
  attack: T1528

traits:
  - id: antibot-device-request-header
    desc: Anti-bot device request header
    crit: suspicious
    conf: 0.97
    if:
      type: text
      regex: '(?i)\bX-Antibot-Token\b'

composite_rules:
# Device-code authentication is legitimate.  The neutral flow capability lives
# under micro-behaviors; this objective requires it to appear after a captive
# portal redirect before reporting phishing.
  - id: captive-portal-device-code-phish
    desc: Captive portal redirects to device-code phishing
    crit: hostile
    conf: 0.98
    attack: T1566.002,T1528
    all:
      - id: objectives/credential-access/phishing/captive-portal::captive-portal-redirect-after-probe
      - id: micro-behaviors/communications/http/auth::oauth-device-login-flow
    near_lines: 120

  # A legitimate device-flow client can contain any one of these mechanics.
  # The combination below describes the abuse: a browser-facing handoff,
  # asynchronous authorization polling, and forwarding the resulting token to
  # infrastructure controlled by the kit.
  - id: device-code-token-harvest
    desc: Device-code phishing token harvest
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/communications/http/auth::device-code-user-handoff
      - id: micro-behaviors/communications/http/auth::device-code-polling-loop
      - id: micro-behaviors/communications/http/auth::oauth-token-in-http-request
    near_lines: 220

  - id: indexed-device-token-forward
    desc: Forwards indexed OAuth tokens after device polling
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/communications/http/auth::device-code-user-handoff
      - id: micro-behaviors/communications/http/auth::device-code-polling-loop
      - id: micro-behaviors/communications/http/auth::indexed-oauth-token-field
    any:
      - id: micro-behaviors/communications/http/request/client::js-fetch-call
      - id: micro-behaviors/communications/http/curl::exec
      - id: micro-behaviors/communications/http/curl::init
    near_lines: 220

  - id: device-code-antibot-gate
    desc: Time-gated anti-bot device-code phishing
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/communications/http/auth::device-code-user-handoff
      - id: micro-behaviors/communications/http/auth::device-code-polling-loop
      - id: time-hashed-antibot-gate
      - id: antibot-device-request-header
    near_lines: 220

  # A time-derived hash is common in integrity checks and license systems. It
  # becomes an anti-bot gate only when paired with the campaign's request
  # header, so keep the objective composite precise rather than classifying the
  # hash primitive itself as phishing.
  - id: time-hashed-antibot-gate
    desc: Time-hashed anti-bot request gate
    crit: suspicious
    conf: 0.96
    all:
      - id: micro-behaviors/crypto/hash/digest::time-derived-request-hash
      - id: antibot-device-request-header
    near_lines: 220

  # Clipboard copying is an optional accelerator used by the campaigns in the
  # source material. Keep it as a separate, high-confidence finding so variants
  # that omit clipboard access still receive the token-harvest finding.
  - id: device-code-clipboard-phish
    desc: Device-code phishing copies the authorization code
    crit: hostile
    conf: 0.98
    attack: T1528,T1115
    all:
      - id: device-code-token-harvest
    any:
      - id: micro-behaviors/os/clipboard/access::browser-clipboard-write
      - id: micro-behaviors/os/clipboard/browser::browser-html-clipboard-write
    near_bytes: 8192

  - id: device-code-interaction-start
    desc: Starts device-code token capture after browser interaction
    crit: hostile
    conf: 0.97
    attack: T1528,T1566.002
    all:
      - id: device-code-token-harvest
    any:
      - id: micro-behaviors/ui/window/manage/click::browser-click-listener
      - id: micro-behaviors/communications/http/form::form-submit-listener
    near_lines: 220
