defaults:
  platforms: [windows, unix]
  for: [html, scripts]
  attack: T1528

traits:
  # Literal salt used in time-hashed anti-bot request gates.
  - id: antibot-hash-salt-literal
    desc: Antibot literal used as hash salt material
    crit: component
    conf: 0.9
    if:
      type: text
      regex: '(?i)["'']antibot["'']'

composite_rules:
# Device-code authentication is legitimate. The neutral flow capability lives
# under micro-behaviors; hostile findings require a phishing-specific context.
  - id: microsoft-branded-device-code-copy-lure
    desc: Microsoft-branded page copies a device code
    crit: suspicious
    conf: 0.97
    attack: T1566.002,T1528
    all:
      - id: micro-behaviors/communications/http/device-code::device-code-clipboard-handoff
      - id: well-known/app/system/microsoft-brand::microsoft-collaboration-page-branding
    near_bytes: 8192
    unless:
      - id: well-known/lib/crypto/microsoft-auth::ests-login-runtime

  - id: device-code-target-validation
    desc: Validates Microsoft targets before device-code phishing
    crit: suspicious
    conf: 0.95
    attack: T1589.003,T1528
    all:
      - id: micro-behaviors/communications/http/device-code::microsoft-credential-type-endpoint
    any:
      - id: device-code-kit-indicators
      - id: micro-behaviors/communications/http/device-code::oauth-device-login-flow
      - id: micro-behaviors/communications/http/device-code::device-code-start-route
    near_lines: 220

  - id: captive-portal-device-code-phish
    for: [javascript, php, html]
    desc: Captive portal redirects to device-code phishing
    crit: hostile
    conf: 0.98
    attack: T1566.002,T1528
    all:
      - id: objectives/credential-access/phishing/captive-portal::captive-portal-redirect-after-probe
      - id: micro-behaviors/communications/http/device-code::oauth-device-login-flow
    near_lines: 120

  # A legitimate device-flow client can contain all of the token mechanics.
  # Require phishing-kit context before promoting that neutral capability to a
  # hostile token-harvest finding.
  - id: device-code-kit-indicators
    desc: Device-code phishing-kit indicators
    crit: suspicious
    conf: 0.95
    any:
      - id: time-hashed-antibot-gate
      - id: antibot-salted-time-gate
      - id: lure-parameterized-page-route
      - id: phishkit-provider-flow-selector
      - id: phishkit-brand-template-selector
      - id: verification-session-flow-profile-route
      - id: microsoft-branded-device-code-copy-lure

  - id: device-code-token-harvest
    desc: Device-code phishing token harvest
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/communications/http/device-code::device-code-token-request
      - id: device-code-kit-indicators
    near_lines: 96
    unless:
      - id: well-known/lib/crypto/msal-node::library-context
      - id: well-known/app/ai/coding-agent/vibecheck::vscode-package-context
      - id: well-known/app/ai/coding-agent/vibecheck::vscode-bundle-context

  # A phishing front end does not receive the stolen OAuth token itself. It
  # hands the victim a live code and polls the operator's session endpoint
  # while the backend completes the grant. A shared-document pretext and
  # token gate supply context beyond an ordinary device-flow web wrapper.
  - id: device-code-session-relay
    desc: Shared-document lure relays device authorization
    crit: hostile
    conf: 0.98
    attack: T1528,T1566.002
    all:
      - id: micro-behaviors/ui/window/display::shared-document-heading
      - id: micro-behaviors/communications/http/device-code::device-code-user-handoff
      - id: micro-behaviors/communications/http/device-code::device-code-polling-loop
      - id: micro-behaviors/communications/http/auth::antibot-token-header-assignment
    near_lines: 220
    unless:
      - id: well-known/lib/crypto/msal-node::library-context
      - id: well-known/app/ai/coding-agent/vibecheck::vscode-package-context
      - id: well-known/app/ai/coding-agent/vibecheck::vscode-bundle-context

  # Some relay pages have no stable anti-bot header. EvilTokens-style pages
  # present a provider device code, then repeatedly POST an opaque session
  # handle to their own root /state route while the victim completes the
  # provider-hosted sign-in. Keep this suspicious rather than hostile because
  # a legitimate web wrapper can broker device authorization through its own
  # backend; phishing branding or token forwarding supplies stronger intent.
  - id: device-code-session-state-relay
    desc: Relays device authorization through session state endpoint
    crit: suspicious
    conf: 0.96
    attack: T1528,T1566.002
    for: [html, scripts, source]
    all:
      - id: micro-behaviors/communications/http/device-code::device-code-user-handoff
      - id: micro-behaviors/communications/http/device-code::device-code-polling-loop
      - id: micro-behaviors/communications/http/auth::state-route-session-field
    near_lines: 120
    unless:
      - id: well-known/lib/crypto/msal-node::library-context
      - id: well-known/app/ai/coding-agent/vibecheck::vscode-package-context
      - id: well-known/app/ai/coding-agent/vibecheck::vscode-bundle-context

  - id: indexed-device-token-forward
    desc: Forwards indexed OAuth tokens after device polling
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/communications/http/device-code::device-code-user-handoff
      - id: micro-behaviors/communications/http/device-code::device-code-polling-loop
      - id: micro-behaviors/communications/http/device-code::indexed-oauth-token-field
      - id: device-code-kit-indicators
    any:
      - id: micro-behaviors/communications/http/request/client::js-fetch-call
      - id: micro-behaviors/communications/http/post::html-fetch-post-call
      - id: micro-behaviors/communications/http/curl::exec
      - id: micro-behaviors/communications/http/curl::init
    near_lines: 220
    unless:
      - id: well-known/app/ai/coding-agent/vibecheck::vscode-package-context
      - id: well-known/app/ai/coding-agent/vibecheck::vscode-bundle-context

  - id: device-code-antibot-gate
    desc: Time-gated anti-bot device-code phishing
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/communications/http/device-code::device-code-user-handoff
      - id: micro-behaviors/communications/http/device-code::device-code-polling-loop
      - id: time-hashed-antibot-gate
      - id: micro-behaviors/communications/http/auth::antibot-token-header-assignment
    near_lines: 220
    unless:
      - id: well-known/app/ai/coding-agent/vibecheck::vscode-package-context
      - id: well-known/app/ai/coding-agent/vibecheck::vscode-bundle-context

  # A time-derived hash is common in integrity checks and license systems. It
  # becomes an anti-bot gate only when paired with the campaign's request
  # header, so keep the objective composite precise rather than classifying the
  # hash primitive itself as phishing.
  - id: time-hashed-antibot-gate
    desc: Time-hashed anti-bot request gate
    crit: suspicious
    conf: 0.96
    all:
      - id: micro-behaviors/communications/http/auth::antibot-token-header-assignment
    any:
      - id: micro-behaviors/crypto/hash/digest::time-token-hash
      - id: micro-behaviors/crypto/hash/digest::node-createhash-time-update
    near_lines: 220

  # EvilTokens panels specifically salt the time hash with the literal "antibot".
  - id: antibot-salted-time-gate
    desc: Time-hash antibot gate with antibot salt
    crit: suspicious
    conf: 0.97
    all:
      - id: time-hashed-antibot-gate
      - id: antibot-hash-salt-literal
    near_lines: 220

  # Clipboard copying is an optional accelerator used by the campaigns in the
  # source material. Keep it as a separate, high-confidence finding so variants
  # that omit clipboard access still receive the token-harvest finding.
  - id: device-code-clipboard-phish
    desc: Device-code phishing copies the authorization code
    crit: hostile
    conf: 0.98
    attack: T1528,T1566.002
    all:
      - id: micro-behaviors/communications/http/device-code::device-code-clipboard-copy
    any:
      - id: device-code-token-harvest
      - id: device-code-session-relay
    near_bytes: 8192

  - id: device-code-interaction-start
    desc: Starts device-code token capture after browser interaction
    crit: hostile
    conf: 0.97
    attack: T1528,T1566.002
    all:
      - id: device-code-token-harvest
    any:
      - id: micro-behaviors/ui/window/click::browser-click-listener
      - id: micro-behaviors/ui/window/form-input::form-submit-listener
    near_lines: 220

  - id: encrypted-device-code-phishing-page
    for: [javascript, html]
    desc: Encrypted browser payload hides a device-code phishing page
    crit: hostile
    conf: 0.99
    attack: T1027,T1140,T1528,T1566.002
    all:
      - id: micro-behaviors/data/embedded/payload/encrypted::browser-aes-gcm-document-render
      - id: micro-behaviors/communications/http/device-code::device-code-user-handoff
    any:
      - id: micro-behaviors/communications/http/auth::antibot-token-header-assignment
      - id: micro-behaviors/communications/http/device-code::device-code-status-route
    near_bytes: 8192
    unless:
      - id: well-known/app/ai/coding-agent/vibecheck::vscode-package-context
      - id: well-known/app/ai/coding-agent/vibecheck::vscode-bundle-context

  - id: device-code-phaas-backend-broker
    desc: PhaaS backend brokers device-code tokens to a panel
    crit: hostile
    conf: 0.98
    attack: T1528,T1566.002
    for: [python]
    all:
      - id: objectives/exfiltration/stealer/token::device-code-oauth-panel-upload
      - id: lure-templated-device-code-panel

  # A backend that completes the device flow and sends the resulting OAuth
  # token body to a collection endpoint is credential theft even when the
  # companion lure page is absent from the analyzed file.
  - id: device-code-token-forwarding
    desc: Device-code OAuth token forwarding
    crit: hostile
    conf: 0.98
    attack: T1528,T1567.002
    for: [python]
    all:
      - id: micro-behaviors/communications/http/device-code::device-code-token-request
      - id: micro-behaviors/communications/http/upload::python-collect-post
    near_lines: 96
