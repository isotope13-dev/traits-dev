# Silent OAuth device-flow consent. A phishing reverse proxy already holds
# the victim's authenticated browser session, so injected script can start a
# device grant, submit the user code with authorize=1, poll the token
# endpoint, and beacon the access_token in a query string. The victim never
# sees the code. Campaign hostnames and client IDs are not part of the match.
#
# ATT&CK: T1528 (Steal Application Access Token), T1566.002 (Spearphishing Link)
defaults:
  platforms: [windows, unix]
  for: [html, scripts]
  crit: hostile
  conf: 0.97
  attack: T1528,T1566.002

composite_rules:
  - id: silent-device-consent-token-exfil
    desc: Auto-consents a device code and exfiltrates the token
    all:
      - id: micro-behaviors/communications/http/device-code::device-code-authorize-consent
      - id: micro-behaviors/communications/http/device-code::device-code-start-route
      - id: micro-behaviors/communications/http/oauth::oauth-device-grant-type
      - id: micro-behaviors/communications/http/token-auth::access-token-query-interpolation
    near_lines: 80

  # The workflow scope is GitHub's permission to add or update Actions
  # workflow files. Pairing that request with a device grant and a query-string
  # token send is the supply-chain step, including when the victim clicks
  # Authorize and the script only steals the resulting token.
  - id: workflow-scoped-device-token-exfil
    desc: Exfiltrates a workflow-scoped device-code token
    all:
      - id: micro-behaviors/communications/http/device-code::github-oauth-workflow-scope
      - id: micro-behaviors/communications/http/device-code::device-code-start-route
      - id: micro-behaviors/communications/http/oauth::oauth-device-grant-type
      - id: micro-behaviors/communications/http/token-auth::access-token-query-interpolation
    near_lines: 80
