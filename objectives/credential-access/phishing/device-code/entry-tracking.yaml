defaults:
  platforms: [windows, unix]
  for: [html, scripts, source]
  crit: suspicious
  conf: 0.97
  attack: T1528,T1566.002

composite_rules:
  # MadApe embeds the user code under arbitrary identifiers, without the
  # standard OAuth response fields. Do not require English instructions,
  # branding, cc()/ne(), a fixed domain, or evidence of a stolen token.
  # The observed frontend polling branch was disabled; these are route
  # references and clipboard behavior, not proof that polling executed.
  - id: device-code-entry-tracking-relay
    desc: Device-login clipboard page references entry and status tracking
    near_bytes: 4096
    all:
      - id: micro-behaviors/communications/http/device-code::microsoft-device-login-url
      - id: micro-behaviors/os/clipboard/write::browser-clipboard-write
      - id: micro-behaviors/communications/http/url/path::code-entry-route
      - id: micro-behaviors/communications/http/url/path::code-record-status-route
