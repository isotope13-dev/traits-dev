defaults:
  platforms: [windows, unix]
  for: [html, javascript, typescript]
  crit: suspicious
  conf: 0.97
  attack: T1528,T1566.002

composite_rules:
  # MadApe embeds the user code under arbitrary identifiers, without the
  # standard OAuth response fields. Do not require English instructions,
  # branding, cc()/ne(), a fixed domain, or evidence of a stolen token.
  # The observed frontend polling branch was disabled; these are route
  # references and clipboard behavior, not proof that polling executed.
  - id: device-code-entry-tracking-relay
    desc: Device-login clipboard page references entry and status tracking
    near_bytes: 4096
    all:
      - id: micro-behaviors/communications/http/device-code::microsoft-device-login-url
      - id: micro-behaviors/communications/http/url/api-path/route::code-entry-route
      - id: micro-behaviors/communications/http/url/api-path/route::code-record-status-route
    any:
      - id: micro-behaviors/os/clipboard/write::browser-clipboard-write
      - id: micro-behaviors/os/clipboard/write::browser-clipboard-copy-command

  - id: active-device-code-entry-tracking-relay
    desc: Active device-login relay polls status after clipboard entry tracking
    crit: hostile
    conf: 0.98
    near_bytes: 8192
    all:
      - id: device-code-entry-tracking-relay
      - id: micro-behaviors/communications/http/device-code::device-code-polling-loop
    any:
      - id: micro-behaviors/communications/http/redirect::response-driven-browser-navigation
      - id: objectives/anti-analysis/browser-detect::js-anti-inspection-suite
      - id: micro-behaviors/ui/window/html::sharepoint-page-title
      - id: micro-behaviors/ui/window/html::acrobat-page-title
      - id: micro-behaviors/ui/window/html::docusign-page-title
      - id: well-known/app/system/microsoft-brand::microsoft-collaboration-page-title
      - id: well-known/app/system/microsoft-brand::microsoft-onedrive-brand-element
    unless:
      - id: metadata/lang/source/syntax/conditional::literal-false-device-code-polling-branch
      - id: well-known/lib/crypto/microsoft-auth::ests-login-runtime
      - id: well-known/lib/crypto/msal-node::library-context
