defaults:
  platforms: [windows, unix]
  for: [html, scripts, source]

composite_rules:
  # A broker can also be legitimate. Report the relay architecture as
  # suspicious, without asserting token theft from route names alone.
  - id: start-status-device-session-relay
    desc: Device-code relay polls backend session status
    crit: suspicious
    conf: 0.95
    attack: T1528
    all:
      - id: micro-behaviors/communications/http/device-code::device-code-start-route
      - id: micro-behaviors/communications/http/device-code::device-code-status-route
      - id: micro-behaviors/communications/http/device-code::device-code-poll-identifier
      - id: micro-behaviors/communications/http/device-code::device-code-user-handoff
      - id: micro-behaviors/communications/http/device-code::device-code-polling-loop
    near_lines: 80
