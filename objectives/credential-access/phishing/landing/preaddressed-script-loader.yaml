# Single-file phishing attachments that carry only the victim's address and
# a base64 blob. document.write(atob(...)) injects the kit's remote script
# (usually parked in a hidden folder of a compromised site) and the drop
# URL; the login form itself is drawn by the remote script.
defaults:
  platforms: [windows, unix]
  for: [html]
  crit: hostile
  attack: T1566.001,T1027

composite_rules:
  - id: preaddressed-page-writes-encoded-remote-script
    desc: Pre-addressed page writes a base64-hidden remote script
    conf: 0.93
    all:
      - id: micro-behaviors/ui/controls/input::email-assigned-variable
      - id: micro-behaviors/communications/http/client/script::base64-encoded-script-element
      - id: micro-behaviors/data/decode/embedded/base64::atob-embedded-base64-literal
    unless:
      - id: micro-behaviors/ui/controls/form::html-multiple-form-elements

  - id: phishing-kit-drop-configuration
    desc: Page carries a kit template's result-drop setting
    conf: 0.92
    all:
      - id: metadata/lang/source/comment::kit-drop-link-placeholder-comment
    any:
      - id: micro-behaviors/ui/controls/input::email-assigned-variable
      - id: micro-behaviors/ui/controls/credential::html-password-input-tag
      - id: micro-behaviors/communications/http/services/form-backend::form-backend-endpoint-url

  - id: preaddressed-page-form-backend-drop
    desc: Page presets a victim address and posts to a hosted form backend
    conf: 0.93
    all:
      - id: micro-behaviors/communications/http/services/form-backend::form-backend-endpoint-url
    any:
      - id: micro-behaviors/ui/controls/input::email-assigned-variable
      - id: micro-behaviors/ui/controls/input::email-valued-input

  # Kits park their script in a dot-folder of a compromised site
  # (/.css/index2.js) where the site owner's file manager hides it.
  - id: preaddressed-page-hidden-folder-script
    desc: Pre-addressed page loads script from a remote dot-folder
    conf: 0.9
    all:
      - id: micro-behaviors/ui/controls/input::email-assigned-variable
      - id: micro-behaviors/communications/http/client/script::remote-script-hidden-dot-directory
