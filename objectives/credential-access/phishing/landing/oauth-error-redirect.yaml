# Abuse of standards-compliant OAuth error handling as a trusted redirect hop.
# A silent request with an explicitly invalid scope is the deliberate-failure
# form. The hostile aggregate requires the same redirect structure to coexist
# with an actual off-origin credential/MFA/cookie relay, avoiding a verdict on
# ordinary silent-auth clients.
defaults:
  platforms: [windows, unix]
  for: [html, javascript, typescript, php, python, ruby]
  attack: T1566.002

composite_rules:
  - id: oauth-deliberate-error-redirect
    desc: OAuth request deliberately triggers a silent error redirect
    crit: suspicious
    conf: 0.98
    all:
      - id: micro-behaviors/communications/http/oauth::oauth-authorization-endpoint-url
      - id: micro-behaviors/communications/http/oauth::oauth-redirect-state-pair
      - id: micro-behaviors/communications/http/oauth::oauth-silent-prompt-parameter
      - id: micro-behaviors/communications/http/oauth::oauth-explicit-invalid-scope-parameter
    near_bytes: 1200

  - id: oauth-silent-redirect-credential-relay
    desc: Silent OAuth redirect fronts an off-origin MFA credential relay
    crit: hostile
    conf: 0.99
    attack: T1566.002,T1056.002,T1111,T1041
    all:
      - id: micro-behaviors/communications/http/oauth::oauth-authorization-endpoint-url
      - id: micro-behaviors/communications/http/oauth::oauth-redirect-state-pair
      - id: micro-behaviors/communications/http/oauth::oauth-silent-prompt-parameter
    any:
      - id: objectives/credential-access/phishing/mfa-relay::entra-credential-mfa-exfiltration
      - id: objectives/credential-access/phishing/mfa-relay::credential-mfa-relay-redirect
      - id: objectives/credential-access/phishing/mfa-relay::browser-sendbeacon-credential-mfa-relay
    near_lines: 220
