# A lower-confidence precursor: file-selection UI and an email dialog alongside
# a Microsoft identity and GET form pointing outside that provider. This is co-occurrence,
# not a claim that arbitrary nearby input values are bound to that request.
defaults:
  platforms: [unix, windows]
  for: [html, php]

composite_rules:
  - id: document-selection-external-email-gate
    desc: Microsoft document gate uses non-provider form
    crit: suspicious
    conf: 0.8
    near_bytes: 2000
    all:
      - id: well-known/app/system/microsoft-brand::ms-logo-brand-colours
      - id: micro-behaviors/ui/controls/input::html-document-selection-inputs
      - id: micro-behaviors/ui/controls/widget::html-dialog-element
      - id: micro-behaviors/ui/controls/input::username-or-email-input-reference
      - id: micro-behaviors/communications/http/request/html::html-form-get-method
      - id: micro-behaviors/communications/http/request/html::html-form-non-microsoft-action
