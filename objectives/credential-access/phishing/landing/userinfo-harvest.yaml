# Userinfo-masked credential lures: the anchor shows a bank hostname but
# the userinfo @ hands the browser a numeric IP, the hover preview is
# pinned to the bank URL with a status-bar write, and the copy presses
# the victim to change a password. Each leg is ordinary alone; the three
# together are a masked-destination harvest link.
defaults:
  platforms: [windows, unix]
  for: [html]
  attack: T1566.002
traits:
  - id: bank-password-change-lure
    desc: Password-change lure copy
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)\bchange your\b[^<.]{0,60}\bpassword\b'
      exclude_html_comments: true
composite_rules:
  - id: userinfo-masked-password-lure
    desc: Masked link pairs password lure, spoofed preview
    crit: hostile
    conf: 0.96
    near_bytes: 1500
    all:
      - id: objectives/evasion/masquerade/traffic::anchor-userinfo-numeric-destination
      - id: micro-behaviors/ui/window/state::status-bar-url-assignment
      - id: bank-password-change-lure
