# Carrying the victim's identity across phishing stages in the URL fragment.
#
# A staged kit needs the target's email address to reach the final page, so the
# sign-in form can be pre-filled and the lure stays convincing. Putting it in a
# query parameter would write it into every hop's server logs and expose it to
# any scanner that fetches the URL. Putting it after `#` does not: the browser
# keeps the fragment client-side, so the landing page reads the address without
# the operator's host ever seeing a request that contains it.
#
# The pattern is read the fragment, persist it in browser storage so it survives
# the next navigation, then re-attach it to the following stage's URL. All three
# steps must be nearby: an unrelated hash router, OAuth client, and storage user
# elsewhere in a large application are not evidence of a relay.
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript, html]
  attack: T1566.002
  mbc: B0030

composite_rules:
  - id: url-fragment-identity-relay
    desc: Relays a fragment value across staged navigations
    crit: suspicious
    conf: 0.9
    all:
      - id: micro-behaviors/communications/http/url/fragment::location-hash-read
      - id: micro-behaviors/communications/http/url/fragment::fragment-append-encoded-value
      - id: micro-behaviors/data/db/web-storage::dom-storage-setitem
    near_bytes: 32768
    unless:
      - id: well-known/tool/detection/
      - id: metadata/package/testing/presence/fixture/
      - id: well-known/lib/format/pdfjs/
      - id: well-known/app/media/drawio::drawio-application-context
      - id: well-known/app/media/drawio::drawio-asar-context
