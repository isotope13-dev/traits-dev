defaults:
  platforms: [windows, unix]
  for: [html]
  attack: T1566.002
  mbc: B0030
  crit: notable
  conf: 0.94

traits:
  - id: english-parcel-delivery-payment-copy
    desc: Delivery payment confirmation copy
    if:
      type: text
      exclude_html_comments: true
      regex: '(?i)complete the delivery.{0,50}confirm the payment'

  - id: french-parcel-delivery-payment-copy
    desc: French delivery payment confirmation copy
    if:
      type: text
      exclude_html_comments: true
      regex: '(?i)terminer la livraison.{0,50}confirmer le paiement'

  - id: parcel-return-to-sender-warning
    desc: Warning that parcel will be returned
    if:
      type: text
      exclude_html_comments: true
      regex: '(?i)colis.{0,50}retourn[ée].{0,40}exp[ée]diteur'

composite_rules:
  - id: parcel-delivery-payment-demand-copy
    desc: Demands payment to complete delivery
    any:
      - id: english-parcel-delivery-payment-copy
      - id: french-parcel-delivery-payment-copy
      - id: parcel-return-to-sender-warning

  - id: parcel-delivery-payment-card-harvest
    desc: Parcel delivery pretext harvests payment card
    crit: hostile
    conf: 0.97
    all:
      - id: parcel-delivery-payment-demand-copy
      - id: micro-behaviors/data/parse/payment::card-number-name-reference
