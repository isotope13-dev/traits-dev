# Credential phishing in `about:blank` / empty popups populated dynamically via
# `document.write` or `innerHTML`. Legitimate SSO flows navigate the popup to an
# identity provider origin (`window.open("https://idp.example/authorize")`) rather
# than synthesizing a password form inside `about:blank` and posting off-origin.
defaults:
  platforms: [windows, unix]
  for: [html, javascript, typescript]
  attack: T1566.002,T1056.003
  mbc: B0030

composite_rules:
  - id: blank-popup-document-write-credential-phish
    desc: Blank popup injects credential form and submits off-origin
    crit: hostile
    conf: 0.98
    scope: file
    near_bytes: 4096
    all:
      - id: micro-behaviors/ui/window/navigation/open::blank-popup-window-open
      - id: micro-behaviors/ui/window/dom/render::popup-window-markup-injection
      - id: micro-behaviors/ui/controls/credential::browser-credential-field-pair
      - id: micro-behaviors/communications/http/request/target::browser-outbound-http-client-call
    any:
      - id: micro-behaviors/communications/http/post::request-options-post-method
      - id: micro-behaviors/communications/http/request/reference::literal-post-method
      - id: micro-behaviors/communications/url/host/http::fetch-absolute-url-target

  - id: escaped-popup-credential-harvest-redirect
    desc: Escaped popup posts credentials and redirects to external site
    crit: hostile
    conf: 0.99
    scope: file
    attack: T1566.002,T1056.003,T1562.001
    near_bytes: 4096
    all:
      - id: objectives/evasion/security-bypass/policy/browser::nested-iframe-popup-escape
      - id: micro-behaviors/ui/controls/credential::browser-password-input-marker
      - id: micro-behaviors/communications/http/request/target::browser-outbound-http-client-call
    any:
      - id: micro-behaviors/ui/window/navigation/location::browser-location-external-method
      - id: micro-behaviors/ui/window/navigation/location::browser-location-external-assign
      - id: micro-behaviors/ui/window/navigation/location::remote-page-location-assignment
