defaults:
  platforms: [unix, windows]
  for: [html, php, javascript]
  attack: T1566.002
  mbc: B0030
composite_rules:
- id: obfuscated-meta-refresh-redirect
  for: [javascript, html]
  desc: Meta-refresh redirects to an obfuscated external URL
  crit: suspicious
  conf: 0.95
  all:
  - id: micro-behaviors/ui/window/navigation::browser-meta-refresh-external-url
  - id: objectives/anti-static/obfuscation/string/fragmentation::line-break-scheme-separator-fragment
- id: suspicious-brand-redirect
  for: [javascript, html]
  desc: Redirect to known financial brand
  crit: suspicious
  conf: 0.8
  all:
  - id: micro-behaviors/ui/window/navigation::browser-meta-refresh-external-url
  - id: micro-behaviors/data/format/card::mastercard-detection
- id: email-routing-phishing-page
  desc: Email-bearing browser flow posts to an external endpoint and redirects
  crit: hostile
  conf: 0.99
  attack: T1041,T1566.002
  for: [javascript]
  all:
  - id: micro-behaviors/communications/http/url/query::js-email-parameter-mutation
  - id: micro-behaviors/communications/http/request/client::fetch-http-scheme-url
  - id: micro-behaviors/communications/http/request/verb::post-method-text
  any:
  - id: micro-behaviors/ui/window/navigation::browser-location-external-assign
  - id: micro-behaviors/ui/window/navigation::browser-location-external-method
  near_lines: 160
  # Brand impersonation plus a password field disguised as plain text (glyph
  # masking instead of type=password) plus a POST sink: the harvest shape of
  # kits that dodge type=password detectors. The masking atom alone is a
  # neutral capability; the brand and transport legs supply the intent.
- id: masked-brand-password-harvest
  desc: Branded page harvests through a masked text field
  crit: hostile
  conf: 0.97
  for: [html]
  all:
  - id: well-known/app/system/microsoft-brand::ms-logo-brand-colours
  - id: micro-behaviors/ui/controls/credential::masked-text-password-input
  - id: micro-behaviors/communications/http/post::post
  any:
  - id: micro-behaviors/data/string/conversion::fromcharcode-text-reference
  - id: objectives/anti-static/obfuscation/name-mangling/variables::hex-variable-names
  # A packed script sharing the page with a phone-plus-SMS-code harvest
  # pair: the smishing-funnel shape (spam doorway plus concealed redirect
  # plus OTP-bearing lead collection). Either half alone is only
  # suspicious; together they name the funnel.
- id: packed-smishing-harvest-funnel
  desc: Packed page pairs concealed code with SMS harvest
  crit: hostile
  conf: 0.95
  for: [html]
  all:
  - id: objectives/anti-static/obfuscation/obfuscator/js-obfuscator::packer-eval-pattern
  - id: micro-behaviors/ui/window/personal-data-field::phone-sms-code-harvest-pair
  # The whole page arrives as unescape() percent-encoding and evaluates a
  # password POST: nothing renders without the decoder, so static scanners
  # see only hex. Legitimate login pages ship plaintext markup; the
  # concealment plus the credential sink names the harvest.
- id: unescape-concealed-password-harvest
  desc: Unescape-concealed page posts a password
  crit: hostile
  conf: 0.97
  for: [html]
  all:
  - id: micro-behaviors/ui/window/insert-html::browser-document-write-unescape
  - id: micro-behaviors/ui/controls/credential::html-password-input-tag
  - id: micro-behaviors/communications/http/post::html-form-post-method
- id: document-view-credential-harvest-landing
  desc: Document lure solicits password and redirects
  crit: hostile
  conf: 0.96
  for: [html]
  size_max: 8192
  near_bytes: 2000
  all:
  - id: micro-behaviors/ui/window/markup::view-document-credential-pretext
  - id: micro-behaviors/ui/window/navigation::browser-external-redirect
