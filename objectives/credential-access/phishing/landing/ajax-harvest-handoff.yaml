# Single-file mailbox harvest pages (opened from an e-mail attachment).
#
# The page shows the victim's own address in a locked field and asks for
# the password. jQuery posts both to a form-collection endpoint hidden
# behind atob(), reports "wrong password" so the victim types it a second
# time, and finally hands the browser to https://<victim's mail domain> so
# the visit ends somewhere familiar. Legitimate login pages are served by
# the service they log in to; they do not decode their own endpoint, fake a
# failure after a successful submit, or redirect to the user's domain.
defaults:
  platforms: [windows, unix]
  for: [html]
  crit: hostile
  attack: T1566.001,T1056.003
  mbc: B0030

composite_rules:
  - id: prefilled-credential-post-to-encoded-endpoint
    desc: Prefilled login page posts the password to a base64-hidden endpoint
    conf: 0.95
    all:
      - id: micro-behaviors/ui/controls/input::email-valued-input
      - id: micro-behaviors/ui/controls/credential::html-password-input-tag
      - id: micro-behaviors/communications/http/request/client::ajax-url-atob-decoded
      - id: micro-behaviors/communications/http/post::request-options-post-method

  - id: credential-post-then-victim-domain-handoff
    desc: Login page posts password, then redirects to victim's mail domain
    conf: 0.95
    all:
      - id: micro-behaviors/ui/controls/credential::html-password-input-tag
      - id: micro-behaviors/communications/http/post::request-options-post-method
      # Atoms, not the email-domain-redirect composite: composites matched
      # in a decoded script layer do not reach composites on the page.
      - id: micro-behaviors/ui/window/navigation/location::email-domain-part-extraction
    any:
      - id: micro-behaviors/ui/window/navigation/location::scheme-prefixed-variable-host-call
      - id: micro-behaviors/ui/window/navigation/location::scheme-prefixed-variable-host-assignment

  - id: prefilled-credential-post-fake-retry
    desc: Prefilled login page wipes password after post to force re-entry
    conf: 0.9
    all:
      - id: micro-behaviors/ui/controls/input::email-valued-input
      - id: micro-behaviors/ui/controls/credential::html-password-input-tag
      - id: micro-behaviors/communications/http/post::request-options-post-method
      - id: micro-behaviors/communications/http/request/client::ajax-success-handler-opening
      - id: micro-behaviors/communications/http/request/client::jquery-field-value-cleared
