# Moved to the canonical mechanism leaf.
defaults:
  crit: hostile
  platforms: [windows, unix]
  for: [svg]
  attack: T1056.002,T1041,T1566.002

composite_rules:
  - id: svg-input-capture-exfiltration
    desc: SVG captures browser input and posts it to a remote host
    conf: 0.99
    all:
      - id: metadata/file/format/markup::inline-svg-script-body
      - id: micro-behaviors/hardware/input/event::svg-browser-input-event-listener
      - id: micro-behaviors/ui/window/form-input::svg-event-target-value-read
      - id: micro-behaviors/communications/http/post::svg-fetch-post-request
    near_bytes: 2200

  # Voicemail-lure campaigns (INKY-reported, June-August 2026) concealed the
  # loader behind deferred execution: the inline script sleeps briefly, then
  # injects a <script> element pointing at a remote endpoint. Each leg alone
  # has benign readings; an SVG that does all three is an attachment stager.
  - id: svg-deferred-remote-script-injection
    desc: SVG defers execution then injects a script element
    conf: 0.97
    attack: T1059.007,T1027,T1566.002
    all:
      - id: metadata/file/format/markup::inline-svg-script-body
      - id: micro-behaviors/data/collection/dom::script-create-near-src-assignment
      - id: micro-behaviors/time/schedule/callback::javascript-timer-call
    near_bytes: 2200

  # Fully obfuscated loader: the script element is built through a concealed
  # string table (`document[_0x4f2a[1]]('script')`), so createElement never
  # appears literally — only the computed src assignment and the decode
  # evidence remain. Covers hex string tables, hex-escaped member calls,
  # atob() and character-code reconstruction.
  - id: svg-string-table-remote-loader
    desc: SVG reconstructs concealed strings to load remote content
    conf: 0.97
    attack: T1027,T1059.007,T1566.002
    all:
      - id: metadata/file/format/markup::inline-svg-script-body
      - id: micro-behaviors/communications/http/client/resource::svg-element-src-computed-assignment
    any:
      - id: micro-behaviors/data/encode/hex::svg-hex-escaped-string-array
      - id: micro-behaviors/data/encode/hex::svg-hex-escaped-member-call
      - id: micro-behaviors/data/decode/base64/unspecified::base64-decode-call-text
      - id: micro-behaviors/data/decode/char-code::fromcharcode-apply-array
      - id: micro-behaviors/data/decode/char-code::fromcharcode-indexed-array
    near_bytes: 2200

  # The fully encrypted variant: both the next-stage URL and the loader
  # itself are hex ciphertext decrypted at runtime by a stream-cipher loop
  # (parseInt/substring/fromCharCode), then executed through a hex-concealed
  # Function constructor (`["\x63...\x72"]["\x63...\x72"](u,d)(c)`), which
  # injects a remote script element (createElementNS/setAttribute href/
  # append). No plaintext API, URL, or DOM call survives in the outer bytes,
  # so the src/navigation legs above cannot see it. The encrypted blobs plus
  # the concealed constructor invocation plus the charcode rebuild is the
  # campaign's "decrypts and runs a hidden loader" leg. Manual decode of the
  # reference specimen yields a remote `<script href>` injection; the rule
  # claims the decrypt-and-execute loader, not the decoded URL.
  - id: svg-encrypted-stage-function-execution
    desc: SVG decrypts hex stages and executes them via Function
    conf: 0.97
    attack: T1027,T1059.007,T1566.002
    all:
      - id: metadata/file/format/markup::inline-svg-script-body
      - id: micro-behaviors/data/encode/hex::svg-long-hex-string-literal
      - id: objectives/execution/interpreter/eval/dynamic::svg-hex-encoded-constructor-property
      - id: micro-behaviors/data/encode/hex::svg-hex-escaped-member-call
    near_bytes: 2200
