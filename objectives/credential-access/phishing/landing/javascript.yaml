# Moved to the canonical mechanism leaf.
defaults:
  platforms: [windows, unix]
  for:
    - javascript
traits:
  - id: js-microsoft-logo
    desc: Microsoft logo asset reference
    # A logo asset is only a branding fragment; the phishing objective is
    # inferred by the login-form and lure legs below.
    crit: notable
    conf: 0.85
    if:
      type: string_literal
      substr: Microsoft_logo.svg
    unless:
      - id: metadata/document/html/structure::html-root-at-start
      - id: well-known/lib/crypto/microsoft-auth::ests-login-runtime
  - id: js-password-retry-error
    desc: Password retry error lure
    crit: suspicious
    conf: 0.82
    if:
      type: string_literal
      substr: Verify your password and try again
  - id: js-honeypot-field
    desc: Honeypot form field (anti-bot)
    crit: notable
    conf: 0.8
    if:
      type: string_literal
      regex: honeypot-field|class="honeypot"
  - id: js-document-lure
    desc: Document sharing/preview lure
    crit: notable
    conf: 0.8
    unless:
      - type: basename
        regex: '\.po$'
    if:
      type: string_literal
      regex: Recent Files|RFQ\.pdf|CloudFiles|Specification\.pdf

composite_rules:
  - id: js-ms-branding-indicators
    desc: Microsoft branding indicators
    crit: component
    unless:
      - id: well-known/lib/crypto/microsoft-auth::ests-login-runtime
    any:
      - id: js-microsoft-logo
      - id: micro-behaviors/communications/http/services/microsoft::microsoft-login-domain
  - id: headlesschrome-checks
    desc: HeadlessChrome detection checks
    crit: component
    conf: 0.85
    any:
      - id: micro-behaviors/os/sysinfo/platform/browser::browser-headlesschrome-useragent-check
      - id: micro-behaviors/os/sysinfo/platform/browser::headlesschrome-string-test
  - id: js-bot-detection
    desc: Browser bot detection logic
    crit: component
    conf: 0.9
    any:
      - id: micro-behaviors/os/sysinfo/platform/browser::navigator-webdriver-read
      - id: headlesschrome-checks
      - id: micro-behaviors/os/sysinfo/platform/browser::browser-headless-detector-name
  - id: js-microsoft-phishing-page
    desc: Microsoft credential phishing page
    crit: hostile
    conf: 0.98
    attack: T1566.002
    all:
      - id: js-ms-branding-indicators
      - id: js-webmail-login-form
    any:
      - id: js-bot-detection
      - id: js-document-lure
      - id: js-honeypot-field
      - id: micro-behaviors/ui/window/username-field::session-sign-in-required-message
      - id: js-password-retry-error
  - id: js-webmail-login-form
    desc: Webmail login credential form
    crit: component
    conf: 0.9
    near_lines: 120
    all:
      - id: micro-behaviors/ui/window/username-field::email-input-field
      - id: micro-behaviors/ui/controls/credential::password-input-field-script
    any:
      - id: micro-behaviors/ui/window/username-field::signin-submit-label
      - id: micro-behaviors/ui/window/username-field::js-paired-email-password-identifiers

  # Native prompt() with a session-expired password lure, then Base64 of the
  # captured input. Browser dialogs are not a login page; encoding the return
  # value is the harvest, not a form POST.
  - id: native-prompt-session-password-phish
    desc: prompt() harvests a session-expired password
    crit: hostile
    conf: 0.97
    attack: T1056.002,T1566.002
    scope: file
    near_bytes: 1200
    all:
      - id: micro-behaviors/ui/dialog/prompt::javascript-string-prompt-call
      - id: micro-behaviors/ui/keywords::session-expired-password-message
      - id: micro-behaviors/data/encode/base64/primitive::btoa-symbol

  - id: js-login-credential-harvest-post
    desc: Intercepts and exfiltrates login credentials
    crit: hostile
    conf: 0.98
    attack: T1056.002,T1041
    all:
      - id: micro-behaviors/ui/controls/credential::auth-handler-object
      - id: micro-behaviors/ui/controls/credential::postlogin-credential-method
      - id: micro-behaviors/communications/http/request/computed::js-fetch-computed-helper-argument
