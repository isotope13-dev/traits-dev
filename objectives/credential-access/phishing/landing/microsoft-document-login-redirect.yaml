# A document-sharing page impersonates Microsoft's sign-in step and sends
# visitors to a separate login host after filtering automated browsers.
defaults:
  platforms: [unix, windows]
  for: [javascript]
  attack: T1566.002

traits:
  - id: shared-document-verification-lure
    desc: Shared-document email verification request
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)shared documents.{0,80}verify your email|verify your email.{0,80}shared documents'
  - id: microsoft-style-account-placeholder
    desc: Microsoft-style sign-in account placeholder
    crit: notable
    conf: 0.95
    if:
      type: text
      substr: 'Email, phone, or Skype'
  - id: external-login-host-redirect
    desc: Browser navigates to external login host
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: 'window\.location\.href\s*=\s*["'']https?://login\.'
    unless:
      - type: text
        regex: 'location\.href\s*=\s*["'']https?://login\.(microsoftonline|microsoft|live)\.com([/:"'']|$)'

composite_rules:
  - id: microsoft-document-login-handoff
    desc: Microsoft document lure forwards through filtered login page
    crit: hostile
    conf: 0.97
    scope: file
    all:
      - id: shared-document-verification-lure
      - id: microsoft-style-account-placeholder
      - id: external-login-host-redirect
      - id: objectives/credential-access/phishing/landing::js-microsoft-logo
      - id: objectives/credential-access/phishing/landing::js-honeypot-field
      - id: micro-behaviors/os/sysinfo/platform/browser::navigator-webdriver-read
