defaults:
  platforms:
  - windows
  - unix
  for:
  - npm
  - package.json
  - html
composite_rules:
- id: npm-turnstile-redirect-lure
  desc: npm HTML entrypoint ships CAPTCHA redirect lure
  crit: hostile
  conf: 0.98
  attack: T1204.001
  mbc: B0021
  scope: archive
  all:
  - id: metadata/package/entrypoint::main-html-entry
  - id: metadata/package/files/package-json::files-index-html-only
  any:
  - id: objectives/credential-access/phishing/captcha::cloudflare-turnstile-phishing-page
  - id: objectives/credential-access/phishing/captcha::turnstile-keyval-deaddrop-redirect
  - id: objectives/credential-access/phishing/landing::turnstile-encrypted-next-hop-redirect
