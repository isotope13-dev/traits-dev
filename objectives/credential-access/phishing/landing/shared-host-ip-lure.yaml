# Padded shared-host IP links: a bare numeric authority with a ~user
# account path, stretched with dot-space segments. No brand or lure copy
# is required: this URL craft is kit rotation idiom, and legitimate
# shared-host links live on domain names, not IP literals.
defaults:
  platforms: [windows, unix]
  for: [html]
  attack: T1566.002
composite_rules:
  - id: padded-shared-host-ip-link
    desc: Padded shared-host IP harvest link
    crit: hostile
    conf: 0.96
    all:
      - id: micro-behaviors/communications/ip/literal::http-ip-url-filtered-text
      - id: micro-behaviors/communications/url/path::dot-space-path-padding
      - id: micro-behaviors/communications/url/path::ip-host-user-path
