# A shared-host path alone does not establish credential harvesting.
defaults:
  platforms: [windows, unix]
  for: [html]
  attack: T1566.002
composite_rules:
  - id: padded-shared-host-ip-link
    desc: PayPal label hides padded IP user-home link
    crit: hostile
    conf: 0.96
    near_bytes: 256
    all:
      - id: objectives/credential-access/phishing/html-brand::paypal-label-ip-href
      - id: micro-behaviors/communications/ip/literal::http-ip-url-filtered-text
      - id: micro-behaviors/communications/url/path::dot-space-path-padding
      - id: micro-behaviors/communications/url/path::ip-host-user-path
