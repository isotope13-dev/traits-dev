# Hidden identity fields are normal in multi-step authentication. The hostile
# claim additionally requires a mailbox upgrade/shutdown credential lure.
defaults:
  platforms: [windows, unix]
  for: [html, makefile, text]
  attack: T1566.002
  mbc: B0030

composite_rules:
  - id: preaddressed-credential-harvest-form
    desc: Mailbox lure with preset email and password POST
    crit: hostile
    conf: 0.97
    all:
      - id: micro-behaviors/ui/controls/input::hidden-email-valued-input
      - id: micro-behaviors/ui/controls/credential::html-password-input-tag
      - id: micro-behaviors/communications/http/post::html-form-post-method
      - id: objectives/credential-access/phishing/lure::mailbox-verification-pretext

  - id: preaddressed-shared-file-wordpress-harvest
    desc: Preset mailbox and password POST with shared-file WordPress bait
    crit: hostile
    conf: 0.98
    for: [html]
    all:
      - id: micro-behaviors/ui/controls/input::hidden-email-valued-input
      - id: micro-behaviors/ui/controls/credential::shared-file-signin-copy
      - id: micro-behaviors/ui/controls/credential::html-password-input-tag
      - id: micro-behaviors/communications/http/post::html-form-post-method
      - id: micro-behaviors/communications/http/form::wordpress-admin-php-form-action
  # Reconfirmation twin of the mailbox rules above: the victim address
  # arrives visibly prefilled (not hidden) and the pretext asks to reconfirm
  # the login. Preset identity plus password POST plus reconfirm wording is
  # the targeted re-auth harvest.
  - id: reconfirm-prefilled-credential-harvest
    desc: Reconfirm lure with preset email and password POST
    crit: hostile
    conf: 0.97
    for: [html]
    all:
      - id: micro-behaviors/ui/controls/input::email-valued-input
      - id: micro-behaviors/ui/controls/credential::html-password-input-tag
      - id: micro-behaviors/communications/http/post::html-form-post-method
      - id: objectives/credential-access/phishing/lure::reconfirm-login-pretext
  # Same-origin ajax twin of the form-POST rules above: standalone phishing
  # pages exfiltrate with `$.ajax({url: "connect.php", type: "POST", ...})`
  # instead of a form action, so neither the form-POST leg nor an absolute
  # URL is present. The static prefilled victim address is what separates
  # this from a legitimate ajax sign-in form: remember-me fills the
  # visitor's own address at runtime, while a kit ships its target's.
  - id: ajax-prefilled-credential-harvest
    desc: Prefilled credentials exfiltrated by same-origin ajax POST
    crit: hostile
    conf: 0.96
    for: [html]
    near_bytes: 6000
    all:
      - id: micro-behaviors/ui/controls/input::email-valued-input
      - id: micro-behaviors/ui/controls/credential::html-password-input-tag
      - id: micro-behaviors/communications/http/request/html::html-jquery-ajax-relative-php-url
      - id: micro-behaviors/communications/http/post::request-options-post-method
  # Require evidence that a fragment-derived email-like variable is copied
  # into a form field. Merely parsing location.hash is common in OAuth callback
  # pages, where the fragment carries tokens and has no connection to the
  # visible login fields.
  - id: hash-targeted-credential-prefill
    desc: Login form prefilled from URL fragment target
    crit: hostile
    conf: 0.94
    for: [html]
    near_bytes: 6000
    all:
      - id: micro-behaviors/ui/controls/input::fragment-email-field-assignment
      - id: micro-behaviors/ui/controls/input::email-valued-input
      - id: micro-behaviors/ui/controls/credential::html-password-input-tag

  # Device-profiler harvest twin: the page instantiates the ClientJS profiler
  # and pours browser, OS, screen, plugin and font readings into hidden
  # fields that POST beside the password. Fraud-scoring scripts profile the
  # device in place; capturing the profile into submittable form state is
  # the harvest, pairing device impersonation material with the credential.
  - id: clientjs-fingerprint-harvest-form
    desc: Device profile harvested beside password POST
    crit: hostile
    conf: 0.95
    for: [html]
    all:
      - id: micro-behaviors/os/sysinfo/platform/browser::clientjs-instantiation
      - id: micro-behaviors/os/sysinfo/platform/browser::clientjs-filled-form-field
      - id: micro-behaviors/ui/controls/credential::html-password-input-tag
      - id: micro-behaviors/communications/http/post::html-form-post-method

  # Preaddressed protected-document lure: the victim's email address is already
  # prefilled into the form and the page lures the victim into submitting their
  # password to unlock or view a "protected" or "secured" document.
  - id: preaddressed-document-credential-harvest
    desc: Prefilled document lure with password POST
    crit: hostile
    conf: 0.98
    for: [html]
    all:
      - id: micro-behaviors/ui/controls/input::email-valued-input
      - id: micro-behaviors/ui/controls/credential::html-password-input-tag
      - id: micro-behaviors/communications/http/post::html-form-post-method
    any:
      - id: micro-behaviors/ui/controls/credential::secured-document-signin-copy
      - id: micro-behaviors/ui/controls/credential::protected-file-password-prompt-copy
      - id: micro-behaviors/ui/controls/credential::document-view-signin-copy


