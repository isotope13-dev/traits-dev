# Credential-harvest landing pages: a login form that smuggles the victim's
# own address in a *hidden* input beside a password field and POSTs both to
# a collector. Legitimate logins show the address visibly (or prefill
# nothing); a hidden pre-addressed identity exists so the stolen password
# arrives already keyed to its victim. The `makefile` scope is deliberate:
# extensionless kit pages mistype as makefile in the file sniffer, so
# html-only scoping would leave them invisible.
defaults:
  platforms: [windows, unix]
  for: [html, makefile, text]
  attack: T1566.002
  mbc: B0030

traits:
  - id: email-valued-input
    desc: Form input value carries an email address
    crit: notable
    conf: 0.85
    if:
      type: text
      regex: 'value\s*=\s*["''].{0,80}@'
  - id: harvest-form-post
    desc: Harvest form declares the POST method
    crit: notable
    conf: 0.88
    unless:
      - id: well-known/app/publishing/indiekit::indiekit-frontend-library
    if:
      type: text
      regex: '(?i)<form.{0,80}method\s*=\s*["'']?post'

composite_rules:
  - id: concealed-victim-email-field
    desc: Hidden form input carries an email address
    crit: suspicious
    conf: 0.92
    all:
      - id: micro-behaviors/ui/controls/input::html-hidden-input-tag
      - id: email-valued-input
    near_bytes: 160
  - id: preaddressed-credential-harvest-form
    desc: Hidden victim identity with password harvest POST
    crit: hostile
    conf: 0.97
    all:
      - id: concealed-victim-email-field
      - id: micro-behaviors/ui/controls/credential::html-password-input-tag
      - id: harvest-form-post
