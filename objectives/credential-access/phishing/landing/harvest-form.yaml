# Hidden identity fields are normal in multi-step authentication. The hostile
# claim additionally requires a mailbox upgrade/shutdown credential lure.
defaults:
  platforms: [windows, unix]
  for: [html, makefile, text]
  attack: T1566.002
  mbc: B0030

composite_rules:
  - id: preaddressed-credential-harvest-form
    desc: Mailbox lure with preset email and password POST
    crit: hostile
    conf: 0.97
    all:
      - id: micro-behaviors/ui/controls/input::hidden-email-valued-input
      - id: micro-behaviors/ui/controls/credential::html-password-input-tag
      - id: micro-behaviors/communications/http/post::html-form-post-method
      - id: objectives/credential-access/phishing/lure::mailbox-verification-pretext
