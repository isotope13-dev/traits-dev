# Hidden identity fields are normal in multi-step authentication. The hostile
# claim additionally requires a mailbox upgrade/shutdown credential lure.
defaults:
  platforms: [windows, unix]
  for: [html, makefile, text]
  attack: T1566.002
  mbc: B0030

composite_rules:
  - id: preaddressed-credential-harvest-form
    desc: Mailbox lure with preset email and password POST
    crit: hostile
    conf: 0.97
    all:
      - id: micro-behaviors/ui/controls/input::hidden-email-valued-input
      - id: micro-behaviors/ui/controls/credential::html-password-input-tag
      - id: micro-behaviors/communications/http/post::html-form-post-method
      - id: objectives/credential-access/phishing/lure::mailbox-verification-pretext

  - id: preaddressed-shared-file-wordpress-harvest
    desc: Preset mailbox and password POST with shared-file WordPress bait
    crit: hostile
    conf: 0.98
    for: [html]
    all:
      - id: micro-behaviors/ui/controls/input::hidden-email-valued-input
      - id: micro-behaviors/ui/controls/credential::shared-file-signin-copy
      - id: micro-behaviors/ui/controls/credential::html-password-input-tag
      - id: micro-behaviors/communications/http/post::html-form-post-method
      - id: micro-behaviors/communications/http/form::wordpress-admin-php-form-action
  # Reconfirmation twin of the mailbox rules above: the victim address
  # arrives visibly prefilled (not hidden) and the pretext asks to reconfirm
  # the login. Preset identity plus password POST plus reconfirm wording is
  # the targeted re-auth harvest.
  - id: reconfirm-prefilled-credential-harvest
    desc: Reconfirm lure with preset email and password POST
    crit: hostile
    conf: 0.97
    for: [html]
    all:
      - id: micro-behaviors/ui/controls/input::email-valued-input
      - id: micro-behaviors/ui/controls/credential::html-password-input-tag
      - id: micro-behaviors/communications/http/post::html-form-post-method
      - id: objectives/credential-access/phishing/lure::reconfirm-login-pretext
