defaults:
  platforms: [windows, unix]
  for: [javascript, html]
  attack: T1566.002
  mbc: B0030
  crit: suspicious
  conf: 0.9

traits:
  - id: click-endpoint-with-email
    desc: Click redirect carries email
    conf: 0.94
    if:
      type: text
      regex: 'https?://[^/\n]{1,160}/click\?[^?\n]{0,240}[&?]email='

  - id: dating-campaign-click-params
    desc: Dating campaign click parameters
    conf: 0.9
    if:
      type: text
      regex: '[?&]s1=[a-z0-9]{2,16}.{0,180}[?&]s3=[a-z0-9:]{4,40}.{0,180}[?&]v=dating'

  - id: browser-profile-query-fields--device
    desc: Browser device profile query field
    crit: component
    conf: 0.93
    if:
      type: text
      # `sc` is a common search/source parameter (for example Baidu search
      # URLs), not a fingerprint field. Keep only the less ambiguous profile
      # names so ordinary search templates do not inflate the field count.
      regex: '[^&]&(ph|vd|fp|ft)='
    unless:
      - type: text
        substr: 'ft=music'
      # Video-CDN playback URLs (TikTok/`ttcdn`, etc.) carry `&ft=<token>`,
      # `&sc=`, `&vd=` alongside `mime_type=video_*`; these collide with the
      # fingerprint-field names and inflate the count. A fingerprint-collection
      # landing page does not ship video-playback query strings.
      - type: text
        substr: 'mime_type=video'
  - id: browser-profile-query-fields--locale
    desc: Browser locale profile query field
    crit: component
    conf: 0.93
    if:
      type: text
      regex: '[^&]&(tz|lg|ua|gyro)='
    unless:
      - type: text
        substr: 'ft=music'
      - type: text
        substr: 'mime_type=video'

  - id: parklogic-router-endpoint
    desc: ParkLogic traffic router endpoint
    conf: 0.92
    if:
      type: text
      substr: "https://router.parklogic.com/"

  - id: browser-profile-router-fields
    desc: Browser profile fields posted to traffic router
    conf: 0.93
    if:
      type: text
      regex: 'adBlockingDetected[\s\S]{0,500}timezoneBrowser[\s\S]{0,500}webdriver[\s\S]{0,500}gpu'

  - id: xhr-response-location-redirect
    desc: XHR response-driven browser redirect
    conf: 0.93
    if:
      type: text
      regex: 'responseText\.startsWith\(["'']http["'']\)[\s\S]{0,400}window\.location\.replace\s*\('

  - id: constructed-location-redirect
    desc: Constructed window location redirect
    # Building-block for phishing composites; alone this is common in
    # authenticated frameworks (e.g. Aura no-access redirects).
    crit: component
    conf: 0.92
    if:
      type: text
      regex: 'redirectURL\s*=[\s\S]{0,600}window\.location\s*=\s*redirectURL'
    unless:
      - type: text
        substr: handleNoAccessException
      - type: text
        substr: 'markup://aura:noAccess'

  - id: fake-compliance-link-cluster
    desc: Fake compliance link cluster
    conf: 0.9
    if:
      type: text
      regex: 'href=["''].{1,180}/privacy["''][\s\S]{0,600}href=["''].{1,180}/unsub\?'

composite_rules:
  - id: google-s3-auth-redirect-chain
    desc: Google-S3 chain reaches Microsoft auth relay
    crit: hostile
    conf: 0.99
    attack: T1566.002,T1557,T1185
    all:
      - id: micro-behaviors/communications/http/redirect::google-meet-linkredirect
      - id: micro-behaviors/communications/http/redirect::google-ads-ddm-click-tracker
      - id: micro-behaviors/communications/http/redirect::s3-regional-path-style-url
      - id: micro-behaviors/communications/http/proxy::microsoft-auth-path-rewrite
    near_bytes: 4096

  - id: browser-profile-query-fields
    desc: Browser profile query fields
    crit: suspicious
    conf: 0.93
    all:
      - id: browser-profile-query-fields--device
      - id: browser-profile-query-fields--locale
  - id: profiled-click-redirect
    desc: Browser-profiled click redirect
    crit: hostile
    conf: 0.99
    all:
      - id: objectives/discovery/system/fingerprint/browser::browser-encoded-fingerprint-profile
      - id: click-endpoint-with-email
      - id: browser-profile-query-fields
    any:
      - id: micro-behaviors/ui/window/manage/dom::browser-location-external-assign
      - id: micro-behaviors/ui/window/manage/dom::browser-location-external-method
      - id: constructed-location-redirect

  - id: propagated-query-click-redirect
    desc: Propagated query click redirect
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/ui/window/manage/dom::browser-query-propagated-redirect
      - id: click-endpoint-with-email
      - id: dating-campaign-click-params
    any:
      - id: micro-behaviors/ui/window/manage/dom::browser-location-external-assign
      - id: micro-behaviors/ui/window/manage/dom::browser-location-external-method
      - id: constructed-location-redirect

  - id: traffic-broker-profile-harvest
    desc: Traffic broker profile harvest
    crit: hostile
    conf: 0.99
    all:
      - id: objectives/discovery/system/fingerprint/browser::browser-encoded-fingerprint-profile
      - id: browser-profile-query-fields
      - id: fake-compliance-link-cluster
    any:
      - id: click-endpoint-with-email
      - id: dating-campaign-click-params

  - id: email-bearing-post-redirect
    desc: Browser traffic broker posts an email field before redirecting
    crit: hostile
    conf: 0.99
    attack: T1041,T1566.002
    all:
      - id: micro-behaviors/communications/http/url/query::js-email-parameter-mutation
      - id: micro-behaviors/communications/http/request/client::post-method-text
      - id: micro-behaviors/ui/window/manage/dom::browser-location-external-assign
    near_lines: 140

  - id: parklogic-profiled-response-redirect
    desc: ParkLogic browser profile used for response redirect
    crit: hostile
    conf: 0.96
    all:
      - id: parklogic-router-endpoint
      - id: browser-profile-router-fields
      - id: xhr-response-location-redirect
    any:
      - id: micro-behaviors/data/encode/payload::large-encoded-blob-literal
      - id: micro-behaviors/data/encoded::base64-token

  - id: parklogic-profiled-response-html-injection
    desc: ParkLogic browser profile used to inject router HTML
    crit: hostile
    conf: 0.97
    attack: T1185,T1566.002
    all:
      - id: parklogic-router-endpoint
      - id: browser-profile-router-fields
      - id: micro-behaviors/ui/window/manage/dom::browser-innerhtml-assignment

  - id: premium-sms-phone-harvest-lure
    desc: Phone harvest page opens shortcode SMS subscription
    crit: hostile
    conf: 0.98
    attack: T1056.002,T1189
    all:
      - id: micro-behaviors/communications/url/scheme::sms-shortcode-message-uri
      - id: micro-behaviors/ui/window/form-input::browser-phone-input-marker
    near_bytes: 2400
