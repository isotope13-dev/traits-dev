defaults:
  platforms: [windows, unix]
  for: [javascript, html]
  attack: T1566.002
  mbc: B0030
  crit: suspicious
  conf: 0.9

traits:
  - id: dating-campaign-click-params
    desc: Dating campaign click parameters
    conf: 0.9
    if:
      type: text
      regex: '[?&]s1=[a-z0-9]{2,16}.{0,180}[?&]s3=[a-z0-9:]{4,40}.{0,180}[?&]v=dating'

composite_rules:
  - id: google-s3-auth-redirect-chain
    desc: Google-S3 chain reaches Microsoft auth relay
    crit: hostile
    conf: 0.99
    attack: T1566.002,T1557,T1185
    all:
      - id: micro-behaviors/communications/http/redirect::google-meet-linkredirect
      - id: micro-behaviors/communications/http/redirect::google-ads-ddm-click-tracker
      - id: micro-behaviors/communications/http/redirect::s3-regional-path-style-url
      - id: micro-behaviors/communications/http/proxy::microsoft-auth-path-rewrite
    near_bytes: 4096

  - id: profiled-click-redirect
    for: [javascript]
    desc: Browser-profiled click redirect
    crit: hostile
    conf: 0.99
    all:
      - id: objectives/discovery/system/fingerprint/browser::browser-encoded-fingerprint-profile
      - id: micro-behaviors/communications/url/query/mailbox::click-url-email-parameter
      - id: micro-behaviors/communications/url/query/structure::short-query-field-sets
    any:
      - id: micro-behaviors/ui/window/navigation::browser-location-external-assign
      - id: micro-behaviors/ui/window/navigation::browser-location-external-method
      - id: micro-behaviors/ui/window/navigation::constructed-location-redirect

  - id: propagated-query-click-redirect
    desc: Propagated query click redirect
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/ui/window/navigation::browser-query-propagated-redirect
      - id: micro-behaviors/communications/url/query/mailbox::click-url-email-parameter
      - id: dating-campaign-click-params
    any:
      - id: micro-behaviors/ui/window/navigation::browser-location-external-assign
      - id: micro-behaviors/ui/window/navigation::browser-location-external-method
      - id: micro-behaviors/ui/window/navigation::constructed-location-redirect

  - id: traffic-broker-profile-harvest
    for: [javascript]
    desc: Traffic broker profile harvest
    crit: hostile
    conf: 0.99
    all:
      - id: objectives/discovery/system/fingerprint/browser::browser-encoded-fingerprint-profile
      - id: micro-behaviors/communications/url/query/structure::short-query-field-sets
      - id: metadata/file/profile/markup::privacy-unsubscribe-link-pair
    any:
      - id: micro-behaviors/communications/url/query/mailbox::click-url-email-parameter
      - id: dating-campaign-click-params

  - id: email-bearing-post-redirect
    for: [javascript]
    desc: Browser traffic broker posts an email field before redirecting
    crit: hostile
    conf: 0.99
    attack: T1041,T1566.002
    all:
      - id: metadata/lang/source/syntax/call/arguments::js-email-parameter-mutation
      - id: micro-behaviors/communications/http/request/verb::post-method-text
      - id: micro-behaviors/ui/window/navigation::browser-location-external-assign
    near_lines: 140

  - id: premium-sms-phone-harvest-lure
    desc: Phone harvest page opens shortcode SMS subscription
    crit: hostile
    conf: 0.98
    attack: T1056.002,T1189
    all:
      - id: micro-behaviors/communications/url/scheme::sms-shortcode-message-uri
      - id: micro-behaviors/ui/window/personal-data-field::browser-phone-input-marker
    near_bytes: 2400
