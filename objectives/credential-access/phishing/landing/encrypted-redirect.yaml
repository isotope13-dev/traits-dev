defaults:
  platforms:
  - windows
  - unix
  for:
  - html
  mbc: B0021
  attack: T1204.001,T1140
composite_rules:
  - id: turnstile-encrypted-next-hop-redirect
    desc: CAPTCHA-failure lure uses Web Crypto decryption
    crit: hostile
    conf: 0.98
    all:
    - id: objectives/credential-access/phishing/captcha::cloudflare-turnstile-phishing-page
    - id: micro-behaviors/crypto/decrypt::webcrypto-decrypt-source-call
    - id: micro-behaviors/communications/http/url/query::js-urlsearchparams-construction
    - id: micro-behaviors/ui/window/navigation::urlsearchparams-query-forwarding-iteration
    any:
    - id: micro-behaviors/communications/http/url/query::computed-target-url-params-call
    - id: micro-behaviors/ui/window/navigation::computed-window-target-url-call
    - id: micro-behaviors/data/control-flow/dispatch::window-double-bracket-call
    - id: micro-behaviors/ui/window/navigation::browser-location-replace
  - id: obfuscated-turnstile-expiry-decrypt-redirect
    desc: Turnstile expiry completion with decryption and navigation
    crit: hostile
    conf: 0.96
    all:
    - id: micro-behaviors/communications/http/services/cloudflare::turnstile-challenge-api-script
    - id: micro-behaviors/ui/controls/captcha::turnstile-callback-handler
    - id: micro-behaviors/communications/http/url/query::js-urlsearchparams-construction
    - id: micro-behaviors/ui/window/navigation::urlsearchparams-query-forwarding-iteration
    - id: micro-behaviors/ui/controls/captcha::turnstile-expired-completion-reference
    - id: micro-behaviors/crypto/decrypt::webcrypto-decrypt-source-call
    any:
    - id: micro-behaviors/communications/http/url/query::computed-target-url-params-call
    - id: micro-behaviors/ui/window/navigation::computed-window-target-url-call
    - id: micro-behaviors/data/control-flow/dispatch::window-double-bracket-call
    - id: micro-behaviors/ui/window/navigation::browser-location-replace
