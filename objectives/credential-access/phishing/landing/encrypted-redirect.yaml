defaults:
  platforms: [windows, unix]
  for: [html, javascript]

composite_rules:
  - id: turnstile-lure-with-obfuscated-callback
    desc: Turnstile lure with obfuscated callback
    crit: notable
    all:
      - id: objectives/credential-access/phishing/captcha::turnstile-obfuscated-callback
    any:
      - id: objectives/credential-access/phishing/captcha::cloudflare-turnstile-camouflaged
      - id: objectives/credential-access/phishing/captcha::cloudflare-turnstile

  - id: turnstile-obfuscated-crypto-decrypt
    desc: Obfuscated decode or decrypt call
    crit: notable
    any:
      - id: micro-behaviors/crypto/symmetric/decrypt::webcrypto-bracket-decrypt-call
      - id: micro-behaviors/crypto/symmetric/decrypt::obfuscated-webcrypto-bracket-call
      - id: micro-behaviors/data/decode/utf8::textdecoder-bracket-decode-call

  - id: turnstile-obfuscated-browser-redirect
    desc: Obfuscated browser location access or redirect
    crit: notable
    any:
      - id: micro-behaviors/ui/window/navigation::computed-location-replace
      - id: micro-behaviors/data/source/property/computed::computed-window-member-call
      - id: micro-behaviors/data/source/property/computed::obfuscated-window-double-bracket-call

  - id: turnstile-encrypted-next-hop-redirect
    desc: Fake Turnstile decrypts an obfuscated next hop
    crit: hostile
    conf: 0.98
    mbc: B0021
    attack: T1204.001,T1140
    all:
      - id: turnstile-lure-with-obfuscated-callback
      - id: turnstile-obfuscated-crypto-decrypt
      - id: turnstile-obfuscated-browser-redirect
      - id: micro-behaviors/communications/http/url/query::obfuscated-urlsearchparams-iteration

  - id: turnstile-obfuscated-staged-redirect
    desc: Obfuscated Turnstile callback fetches staged redirect
    crit: hostile
    conf: 0.97
    mbc: B0021
    attack: T1204.001,T1140
    all:
      - id: objectives/credential-access/phishing/captcha::turnstile-obfuscated-callback
      - id: objectives/credential-access/phishing/captcha::cloudflare-turnstile
      - id: micro-behaviors/communications/http/post::post
      - id: micro-behaviors/communications/http/url/query::obfuscated-urlsearchparams-iteration
      - id: turnstile-obfuscated-browser-redirect
