defaults:
  platforms:
  - windows
  - unix
  for:
  - html
  mbc: B0021
  attack: T1204.001,T1140
composite_rules:
  - id: turnstile-encrypted-next-hop-redirect
    desc: CAPTCHA-failure lure uses Web Crypto decryption
    crit: hostile
    conf: 0.98
    all:
    - id: objectives/credential-access/phishing/captcha::cloudflare-turnstile-phishing-page
    - id: micro-behaviors/crypto/symmetric/decrypt::webcrypto-bracket-decrypt-call
    - id: micro-behaviors/communications/http/url/query::obfuscated-urlsearchparams-iteration
    any:
    - id: micro-behaviors/ui/window/navigation::browser-location-bracket-replace
    - id: micro-behaviors/data/control-flow/dispatch::window-double-bracket-call
  - id: obfuscated-turnstile-expiry-decrypt-redirect
    desc: Obfuscated Turnstile lure decrypts redirect and completes expired challenge
    crit: hostile
    conf: 0.96
    all:
    - id: micro-behaviors/communications/http/services/cloudflare::turnstile-challenge-api-script
    - id: micro-behaviors/ui/controls/captcha::turnstile-callback-handler
    - id: micro-behaviors/ui/window/navigation::obfuscated-query-navigation
    - id: micro-behaviors/crypto/symmetric/decrypt::webcrypto-bracket-decrypt-call
    - id: objectives/credential-access/phishing/captcha::turnstile-expired-completion-call
