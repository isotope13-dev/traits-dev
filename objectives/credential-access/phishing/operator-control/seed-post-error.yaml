defaults:
  platforms: [windows, unix]
  for: [html, javascript, typescript]
  crit: suspicious
  conf: 0.97

traits:
  - id: seed-post-unconditional-error
    desc: Seed JSON POST always reveals error
    if:
      type: yara
      source: |
        rule promise_fulfillment_reveals_error_element {
          strings:
            $then = /\bfetch\s*\([^;]{0,500}\bmethod\s*:\s*["']POST["'][^;]{0,500}\bbody\s*:\s*JSON\.stringify\(\s*\{\s*(seedPhrase|mnemonic)\s*:[^;]{0,300}\}\s*\)\s*\}\s*\)\.then\(\s*function\s*\(\s*\)\s*\{\s*(var|let|const)\s+/
            $then2 = /\bfetch\s*\([^;]{0,500}\bmethod\s*:\s*["']POST["'][^;]{0,500}\bbody\s*:\s*JSON\.stringify\(\s*\{\s*(seedPhrase|mnemonic)\s*:[^;]{0,300}\}\s*\)\s*\}\s*\)\.then\(\s*function\s*\(\s*\)\s*\{/
            $bind = /\b[A-Za-z_][A-Za-z0-9_]{0,63}\s*=\s*document\.getElementById\(\s*["'][^"']{0,40}[Ee][Rr][Rr][Oo][Rr][^"']{0,40}["']\s*\)\s*;\s*/
            $show = /\b[A-Za-z_][A-Za-z0-9_]{0,63}\.hidden\s*=\s*false\s*;/
            $direct = /document\.getElementById\(\s*["'][^"']{0,40}[Ee][Rr][Rr][Oo][Rr][^"']{0,40}["']\s*\)\.hidden\s*=\s*false\s*;/
          condition:
            (for any t in (1..#then2) : (
              for any d in (1..#direct) : (
                @direct[d] > @then2[t] and @direct[d] < @then2[t] + 1200
              )
            )) or
            for any t in (1..#then) : (
              for any d in (1..#bind) : (
                @bind[d] == @then[t] + !then[t] and
                for any s in (1..#show) : (
                  @show[s] == @bind[d] + !bind[d] and
                  for any n in (1..64) : (
                    (uint8(@bind[d]+n) <= 32 or uint8(@bind[d]+n) == 61) and
                    uint8(@show[s]+n) == 46 and
                    for all b in (0..n-1) : (
                      uint8(@bind[d]+b) == uint8(@show[s]+b)
                    )
                  )
                )
              )
            )
        }
