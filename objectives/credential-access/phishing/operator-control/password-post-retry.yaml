# Two separately retained password attempts, sent after a client-forced failure.
# A normal login may reject a server response; it does not blindly export both.
defaults:
  platforms: [windows, unix]
  for: [html, javascript, typescript]
composite_rules:
  - id: forced-password-retry-post
    desc: Collects two password attempts after locally forcing an error
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/communications/http/form::xhr-send-password-attempt-pair
      - id: micro-behaviors/communications/http/form::xhr-send-then-display-error
      - id: micro-behaviors/communications/http/post::xhr-post-open-send
      - id: micro-behaviors/ui/window/password-field::password-element-value-assignment
