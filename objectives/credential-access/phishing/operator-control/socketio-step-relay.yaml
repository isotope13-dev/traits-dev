# Live-operator credential and MFA relay kits using Socket.IO command channels
# alongside JSON step submissions and operator-directed browser redirects.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, html]
  attack: T1056.002,T1111,T1041,T1566.002
  mbc: B0030
  conf: 0.98

traits:
  - id: credential-error-command-literal
    desc: Credential retry error command literal
    crit: notable
    conf: 0.92
    if:
      type: text
      regex: '["''](login|password)_error["'']'

  - id: operator-redirect-case-branch
    desc: Operator command branch handles redirect
    crit: component
    conf: 0.9
    if:
      type: text
      regex: '(case\s+|===?\s*)["'']redirect["'']'

composite_rules:
  - id: socketio-operator-credential-mfa-relay
    desc: Socket.IO operator relay steers credential and MFA prompts
    crit: hostile
    conf: 0.99
    all:
      - id: micro-behaviors/communications/websocket/handler::socketio-client-relay-channel
      - id: credential-error-command-literal
      - id: micro-behaviors/ui/window/otp-field::mfa-step-command-literals
      - id: micro-behaviors/communications/url/navigation-http::location-update-or-compare-syntax
    any:
      - id: micro-behaviors/communications/http/request/json::fetch-flow-json-post-body
      - id: micro-behaviors/communications/http/request/json::fetch-json-stringify-body
      - id: micro-behaviors/communications/http/post::html-fetch-post-call
      - id: micro-behaviors/communications/http/request/html::html-jquery-ajax-post-call
