# Double-harvest login pages: the page POSTs the password, then shows a
# rejection it carries in its own markup so the victim types it again. The
# rejection copy is static, so it is shown whatever the server answered.
defaults:
  platforms: [windows, unix]
  for: [rtf]
  attack: T1056.003,T1566

composite_rules:
  - id: rtf-encoded-password-post-fake-rejection
    desc: Login posts password and ships fake rejection
    crit: hostile
    conf: 0.95
    all:
      - id: objectives/credential-access/phishing/form::rtf-url-encoded-password-input
      - id: micro-behaviors/ui/controls/credential::rtf-url-encoded-password-rejection
      - id: micro-behaviors/communications/http/request/html::rtf-url-encoded-script-post
