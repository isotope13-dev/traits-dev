# The report describes retained plaintext retries and remote MFA rejection.
# These are co-occurrence detections; they do not prove source-to-sink flow.
defaults:
  for: [javascript, typescript, html]
  platforms: [unix, windows]
  attack: T1056.003,T1111
  conf: 0.97
traits: []
composite_rules:
  - id: retained-password-retries-socket-export
    desc: Password retry slots co-occur with indexed input writes and emission
    crit: suspicious
    attack: T1056.003,T1041
    all:
    - id: micro-behaviors/data/serialize/object::separate-password-attempt-slots
    - id: micro-behaviors/ui/window/password-field::browser-password-input-marker
    - id: micro-behaviors/communications/websocket/handler::update-user-record-emission
    - id: micro-behaviors/data/serialize/object::indexed-input-value-record-write
    near_bytes: 4000
  - id: operator-controlled-mfa-retry-flow
    desc: Socket command handler, MFA retry keys and input-record emission
    crit: hostile
    all:
    - id: micro-behaviors/communications/websocket/handler::operator-command-event-handler
    - id: micro-behaviors/communications/websocket/handler::update-user-record-emission
    - id: micro-behaviors/ui/window/password-field::browser-password-input-marker
    - id: micro-behaviors/ui/window/otp-field::browser-mfa-field-reference
    - id: micro-behaviors/data/parse/vocabulary::mfa-rejection-command-key
    - id: micro-behaviors/data/parse/vocabulary::authenticator-request-command-key
    - id: micro-behaviors/data/serialize/object::indexed-input-value-record-write
    near_bytes: 5000
  - id: synthetic-idp-password-retry-export
    desc: IdP-spoof markup with password retry slots and socket emission
    crit: hostile
    conf: 0.98
    attack: T1056.003,T1041,T1036
    all:
    - id: objectives/credential-access/phishing/ui::browser-in-the-browser-idp-spoof
    - id: retained-password-retries-socket-export
    near_bytes: 5000
