defaults:
  platforms: [windows, unix]
  for: [html]
composite_rules:
  # This contentless script stub's only action is to forward the browser to a
  # tokenized Login.php endpoint. The SSL-channel flag plus long opaque
  # session token is a recurring credential-phishing hand-off pattern.
  - id: script-only-tokenized-ssl-login-redirect
    desc: Script-only page forwards to tokenized SSL login endpoint
    crit: hostile
    conf: 0.93
    size_max: 4096
    all:
      - id: micro-behaviors/ui/window/navigation::script-only-page-redirects-to-login
      - id: micro-behaviors/communications/http/url/php-endpoint::login-page-ssl-session-token
