# A zero-interaction forward to a tokenized login page is the kit
# hand-off stub: the lure link lands here, the victim never chooses to
# navigate, and the token (dispatch-style hex) tracks the phishing
# campaign rather than a real application session.
defaults:
  platforms: [windows, unix]
  for: [html]
  attack: T1566.002
  mbc: B0030
composite_rules:
  - id: instant-redirect-to-tokenized-login
    desc: Page instantly forwards browser to tokenized login URL
    crit: hostile
    conf: 0.92
    size_max: 4096
    near_bytes: 1500
    all:
      - id: micro-behaviors/ui/window/navigation::browser-meta-refresh-instant-relative-url
      - id: micro-behaviors/communications/http/url/php-endpoint::login-page-long-dispatch-token
  # Same hand-off as the dispatch twin, for the session-token spelling the
  # other brand kits use (hd_signin.php?...&_session;<hex>). A contentless
  # page bouncing the browser with zero interaction to a sign-in URL that
  # carries a 48+ hex token is campaign tracking on a credential-harvest
  # hand-off, not an application route.
  - id: instant-redirect-to-tokenized-signin
    desc: Page instantly forwards browser to tokenized sign-in URL
    crit: hostile
    conf: 0.92
    size_max: 4096
    near_bytes: 1500
    all:
      - id: micro-behaviors/ui/window/navigation::browser-meta-refresh-instant-relative-url
      - id: micro-behaviors/communications/http/url/php-endpoint::signin-page-long-hex-token
  # The kits also spell the hand-off without any login endpoint at all
  # (source/?cmd=<hex>): the instant zero-interaction bounce plus a 48+ hex
  # campaign token is the conviction, whatever the path names.
  - id: instant-redirect-to-hex-tracked-target
    desc: Page instantly forwards browser to a hex-tracked URL
    crit: hostile
    conf: 0.9
    size_max: 4096
    near_bytes: 1500
    all:
      - id: micro-behaviors/ui/window/navigation::browser-meta-refresh-instant-relative-url
      - id: micro-behaviors/communications/url/query::token-key-long-hex-value
  # Zero-interaction forward passing a victim mailbox parameter to an external
  # destination: kit landing stubs forward victims with their email pre-seeded.
  - id: instant-redirect-to-email-harvest
    desc: Forwards browser to email-parameterized target
    crit: hostile
    conf: 0.95
    size_max: 4096
    near_bytes: 1500
    all:
      - id: micro-behaviors/ui/window/navigation::browser-external-redirect
      - id: micro-behaviors/communications/ip/literal::href-query-embeds-mailbox
