# A zero-interaction forward to a tokenized login page is the kit
# hand-off stub: the lure link lands here, the victim never chooses to
# navigate, and the token (dispatch-style hex) tracks the phishing
# campaign rather than a real application session.
defaults:
  platforms: [windows, unix]
  for: [html]
  attack: T1566.002
  mbc: B0030
composite_rules:
  - id: instant-redirect-to-tokenized-login
    desc: Page instantly forwards browser to tokenized login URL
    crit: hostile
    conf: 0.92
    size_max: 4096
    near_bytes: 1500
    all:
      - id: micro-behaviors/ui/window/navigation/refresh::browser-meta-refresh-instant-relative-url
      - id: micro-behaviors/communications/url/query/credential::login-page-long-dispatch-token
  # Same hand-off for the sign-in spelling. The stub carries two independent
  # victim-tracking identifiers (a dotted action id and a 48+ hex session
  # token); a lone hex token on a redirect stub is only suspicious.
  - id: instant-redirect-to-dispatch-tracked-signin
    desc: Page instantly forwards to sign-in URL with tracking ids
    crit: hostile
    conf: 0.88
    size_max: 4096
    near_bytes: 1500
    all:
      - id: micro-behaviors/ui/window/navigation/refresh::browser-meta-refresh-instant-relative-url
      - id: micro-behaviors/communications/url/query/credential::signin-page-long-hex-token
      - id: micro-behaviors/communications/url/query/credential::signin-page-dotted-action-id
  # Zero-interaction forward passing a victim mailbox parameter to an external
  # destination: kit landing stubs forward victims with their email pre-seeded.
  - id: instant-redirect-to-email-harvest
    desc: Forwards browser to email-parameterized target
    crit: hostile
    conf: 0.95
    size_max: 4096
    near_bytes: 1500
    all:
      - id: micro-behaviors/ui/window/navigation/location::browser-external-redirect
      - id: micro-behaviors/communications/url/query/mailbox::query-embeds-mailbox
