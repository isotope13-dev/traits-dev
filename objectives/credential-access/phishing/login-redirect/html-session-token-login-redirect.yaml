defaults:
  platforms: [windows, unix]
  for: [html]
  attack: T1566.002
  mbc: B0030
composite_rules:
  - id: html-redirect-to-login-with-opaque-token
    desc: Page redirects to a login URL carrying a long opaque query token
    crit: hostile
    conf: 0.92
    size_max: 4096
    near_bytes: 1500
    all:
      - id: micro-behaviors/ui/window/navigation::browser-whole-window-navigation
      - id: micro-behaviors/communications/http/url/php-endpoint::login-page-long-opaque-query-token
