defaults:
  platforms: [windows, unix]
  for: [html]
  attack: T1566.002
  mbc: B0030
composite_rules:
  - id: html-redirect-to-login-with-session-token
    desc: Page forces window onto login URL with session token
    crit: hostile
    conf: 0.92
    size_max: 4096
    near_bytes: 1500
    all:
      - id: micro-behaviors/ui/window/navigation::top-location-assignment
      - id: micro-behaviors/communications/http/url/php-endpoint::login-page-long-session-token
