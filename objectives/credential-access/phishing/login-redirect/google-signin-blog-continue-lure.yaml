# A saved Google sign-in page whose continue= target is a free blog host.
# The page keeps Google's real sign-in form, so nothing is harvested here; the
# lure is the trusted sign-in flow handing the victim to a spam or counterfeit
# storefront after login. Both legs are required: the blog continue alone is
# common in ordinary blog markup, and the Google markers alone are every
# Google sign-in page.
defaults:
  platforms: [windows, unix]
  for: [html]
  attack: T1566.002

composite_rules:
  - id: google-signin-blog-continue-lure
    desc: Google sign-in page forwards victims to a blog host
    crit: hostile
    conf: 0.9
    all:
      - id: micro-behaviors/communications/url/query/structure::google-signin-blog-continue
      - id: micro-behaviors/communications/http/oauth::google-accounts
