defaults:
  platforms: [windows, unix]
  for: [html]
  attack: T1566.002

composite_rules:
  - id: instant-redirect-page-hides-encoded-token
    desc: Instant redirect page hides encoded token
    crit: hostile
    conf: 0.9
    size_max: 4096
    all:
      - id: micro-behaviors/ui/window/navigation::meta-refresh-instant-external
      - id: metadata/document/html::hidden-white-text-base64
