defaults:
  platforms: [android]
  for: [apk, zip]
  crit: notable
  conf: 0.88
  attack: T1056

traits:
  - id: android-remote-pin-step
    desc: Remote workflow requests a PIN step
    crit: suspicious
    conf: 0.94
    if:
      type: text
      regex: '(?i)[?&/]step=[^\x00\s]{0,64}pin'

  - id: android-remote-password-step
    desc: Remote workflow requests a password step
    crit: suspicious
    conf: 0.94
    if:
      type: text
      regex: '(?i)[?&/]step=[^\x00\s]{0,64}password'

  - id: android-remote-passcode-step
    desc: Remote workflow requests a passcode step
    crit: suspicious
    conf: 0.94
    if:
      type: text
      regex: '(?i)[?&/]step=[^\x00\s]{0,64}passcode'

  - id: android-remote-senha-step
    desc: Remote workflow requests a senha step
    crit: suspicious
    conf: 0.94
    if:
      type: text
      regex: '(?i)[?&/]step=[^\x00\s]{0,64}senha'

  - id: android-pin-forwarding-reference
    desc: Android app PIN forwarding method reference
    crit: suspicious
    conf: 0.96
    if:
      type: text
      exact: sendPin

  # The article's overlay names are randomized at build time. Keep the
  # credential evidence semantic: a service that inspects accessibility nodes
  # and handles password/PIN/OTP fields is more durable than family strings.
  - id: android-password-field-label
    desc: Android UI password field label
    crit: component
    conf: 0.9
    for: [java, kotlin, apk, zip]
    if:
      type: text
      regex: '(?i)\b(EditText|TextInput|inputType|setHint)\b[^\n]{0,80}\bpassword\b'

  - id: android-pin-field-label
    desc: Android PIN field label
    crit: component
    conf: 0.9
    for: [java, kotlin, apk, zip]
    if:
      type: text
      word: pin

  - id: android-otp-field-label
    desc: Android OTP field label
    crit: component
    conf: 0.9
    for: [java, kotlin, apk, zip]
    if:
      type: text
      word: otp

  - id: android-verification-field-label
    desc: Android verification field label
    crit: component
    conf: 0.9
    for: [java, kotlin, apk, zip]
    if:
      type: text
      regex: '(?i)\b(verification|security)\s+code\b'

composite_rules:
  - id: android-sensitive-input-label
    desc: Android credential or verification field label
    crit: component
    conf: 0.92
    for: [java, kotlin, apk, zip]
    any:
      - id: android-password-field-label
      - id: android-pin-field-label
      - id: android-otp-field-label
      - id: android-verification-field-label
      - id: micro-behaviors/data/parse/vocabulary::secret

  - id: android-webview-credential-bridge
    desc: Android WebView bridge handles credential fields
    crit: suspicious
    conf: 0.95
    all:
      - id: android-sensitive-input-label
      - id: micro-behaviors/process/interpreter/webview::webview-js-bridge
    near_lines: 40
    unless:
      - id: well-known/app/system/react-native-webview::react-native-webview-package-context
      - id: well-known/app/utility/cachesweeper::cachesweeper-app
      - id: well-known/app/utility/cachesweeper::cachesweeper-dex

  - id: android-source-webview-credential-bridge
    desc: Android WebView bridge handles named credential fields
    crit: suspicious
    conf: 0.98
    for: [java, kotlin]
    all:
      - id: micro-behaviors/process/interpreter/webview::source-webview-js-bridge
      - id: micro-behaviors/ui/window/form-input::username-field-identifier
      - id: micro-behaviors/ui/window/form-input::password-field-identifier
    unless:
      - id: well-known/app/system/react-native-webview::react-native-webview-package-context

  - id: android-webview-overlay-credential-phishing
    desc: Android overlay WebView handles credential fields
    crit: hostile
    conf: 0.99
    for: [java, kotlin]
    attack: T1411,T1056.002
    all:
      - id: android-source-webview-credential-bridge
      - id: micro-behaviors/process/interpreter/webview::source-webview-url-javascript-content
      - id: micro-behaviors/ui/window/manage/overlay::android-source-runtime-overlay-window

  - id: android-remote-credential-step
    desc: Remote workflow requests a credential step
    crit: suspicious
    conf: 0.94
    any:
      - id: android-remote-pin-step
      - id: android-remote-password-step
      - id: android-remote-passcode-step
      - id: android-remote-senha-step

  - id: android-accessibility-service-surface
    desc: Android accessibility service surface
    crit: notable
    conf: 0.96
    for: [java, kotlin, apk, zip]
    any:
      - id: micro-behaviors/hardware/input/accessibility::android-accessibility-service-source
      - id: micro-behaviors/hardware/input/accessibility::android-accessibility-service-config

  - id: android-credential-overlay-surface
    desc: Android credential overlay interaction surface
    crit: suspicious
    conf: 0.96
    for: [java, kotlin, apk, zip]
    any:
      - id: android-webview-credential-bridge
      - id: micro-behaviors/ui/window/manage/overlay::android-source-runtime-overlay-window
      - id: micro-behaviors/ui/window/manage/overlay::runtime-overlay-window
      - id: micro-behaviors/hardware/input/accessibility::android-accessibility-ui-action-source

  - id: android-accessibility-credential-overlay
    desc: Android accessibility credential overlay capture
    crit: hostile
    conf: 0.99
    for: [java, kotlin, apk, zip]
    attack: T1417.001,T1056.002
    all:
      - id: android-sensitive-input-label
      - id: micro-behaviors/hardware/input/accessibility::android-accessibility-text-extraction
      - id: android-accessibility-service-surface
      - id: android-credential-overlay-surface

  - id: android-accessibility-transparent-pin-capture
    desc: Accessibility plus transparent overlay captures PIN taps
    crit: hostile
    conf: 0.98
    for: [java, kotlin]
    attack: T1417.001,T1056.002
    all:
      - id: micro-behaviors/hardware/input/accessibility::android-accessibility-service-source
      - id: micro-behaviors/hardware/input/accessibility::android-accessibility-text-extraction
      - id: micro-behaviors/ui/window/manage/overlay::android-transparent-touch-capture-overlay
      - id: android-sensitive-input-label
