# UNC6671's help-desk pretext sends victims to organization-branded domains
# whose registrable label advertises passkey/SSO/MFA enrollment.  The domain
# vocabulary is a reusable infrastructure pattern, while the composites below
# require the credential form and external collection behavior before calling it
# a phishing page.
defaults:
  platforms: [windows, unix]
  for: [html, javascript, typescript, php]
  attack: T1566.002,T1056.002
  mbc: B0030

traits:
  - id: generic-auth-enrollment-domain
    desc: Generic auth-enrollment root domain
    crit: suspicious
    conf: 0.96
    if:
      type: text
      # UNC6671 used bare roots such as passkeyhelpdesk.com and
      # passkeydeploy.com, as well as victim-specific subdomains.  Match the
      # infrastructure naming shape, not one campaign's domain list.
      # Consume the hostname terminator so a label such as `bottosson` cannot
      # be split at its `sso` substring and treat the next label as the TLD.
      regex: '(?i)https?://[a-z0-9-]{0,63}(passkey|mfa|sso|okta)[a-z0-9-]{0,24}\.[a-z]{2,20}([:/?#]|$)'

  - id: organization-passkey-domain
    desc: Organization-branded passkey domain
    crit: suspicious
    conf: 0.96
    if:
      type: text
      # Covers the article's `company.createssopasskey.com` and
      # `company.addssopasskey.com` forms plus future victim labels.
      regex: '\b[a-z0-9-]{2,63}\.[a-z0-9-]{0,24}passkey[a-z0-9-]{0,24}\.[a-z]{2,20}\b'

  - id: organization-setup-sso-domain
    desc: Organization-branded SSO setup domain
    crit: suspicious
    conf: 0.96
    if:
      type: text
      # Avoid matching ordinary `organization.sso.<provider>` references;
      # the observed artifact uses an action word fused to the auth label.
      regex: '(?i)\b[a-z0-9-]{2,63}\.[a-z0-9-]{0,12}setupsso[a-z0-9-]{0,12}\.[a-z]{2,20}\b'

  - id: organization-enrollment-domain
    desc: Organization-branded enrollment domain
    crit: suspicious
    conf: 0.96
    if:
      type: text
      # Covers the linked GTIG `organization.enrollms.com` form.
      # Phishing labels are lowercase hostnames; do not use (?i) — camelCase
      # property chains such as `this.enrolledFactors.filter` false-positive.
      regex: 'https?://[a-z0-9-]{2,63}\.[a-z0-9-]{0,24}enroll[a-z0-9-]{0,24}\.[a-z]{2,20}\b'

composite_rules:
  - id: auth-enrollment-lookalike-domain
    desc: Auth-enrollment lookalike domain
    crit: suspicious
    conf: 0.98
    any:
      - id: generic-auth-enrollment-domain
      - id: organization-auth-lookalike-domain

  - id: organization-auth-lookalike-domain
    desc: Organization-branded auth lookalike domain
    crit: suspicious
    conf: 0.98
    any:
      - id: organization-passkey-domain
      - id: organization-setup-sso-domain
      - id: organization-enrollment-domain

  - id: lookalike-sso-login-surface
    desc: Lookalike SSO domain with credential fields
    crit: suspicious
    conf: 0.98
    all:
      - id: auth-enrollment-lookalike-domain
      - id: micro-behaviors/ui/window/form-input::browser-credential-field-pair
    near_bytes: 1200

  - id: lookalike-sso-credential-phish
    desc: Lookalike SSO domain posts credentials externally
    crit: hostile
    conf: 0.99
    attack: T1566.002,T1056.002,T1041
    all:
      - id: lookalike-sso-login-surface
      - id: objectives/credential-access/phishing/captive-portal::external-login-form-action
    near_bytes: 1400

  - id: lookalike-sso-mfa-phish
    desc: Lookalike SSO page posts MFA fields externally
    crit: hostile
    conf: 0.99
    attack: T1566.002,T1056.002,T1111,T1041
    all:
      - id: lookalike-sso-login-surface
      - id: objectives/credential-access/phishing/mfa-relay::browser-mfa-field-reference
      - id: objectives/credential-access/phishing/captive-portal::external-login-form-action
    near_bytes: 1600
