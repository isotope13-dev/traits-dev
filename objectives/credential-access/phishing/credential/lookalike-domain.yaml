# Help-desk impersonation campaigns send victims to organization-branded
# domains whose registrable label advertises passkey/SSO/MFA enrollment, or
# whose victim brand is the sole label beneath the .claims TLD. The domain
# shapes are reusable infrastructure patterns, while the composites below
# require credential-form and external-collection behavior before calling a
# page a credential phish.
defaults:
  platforms: [windows, unix]
  for: [html, javascript, typescript, php]
  attack: T1566.002,T1056.002
  mbc: B0030

traits:
  - id: generic-auth-enrollment-domain
    desc: URL uses an auth-enrollment keyword domain
    crit: suspicious
    conf: 0.96
    if:
      type: text
      # UNC6671 used roots such as passkeyhelpdesk.com and passkeydeploy.com,
      # plus hyphenated forms such as login-sso.example. This leg handles an
      # auth keyword at the start of the hostname label; the separator leg
      # handles subdomains and hyphenated labels. Consume the hostname
      # terminator so a match cannot stop inside a longer TLD.
      regex: '(?i)https?://(passkey|mfa|sso|okta)[a-z0-9-]*\.[a-z]{2,}([:/?#]|$)'

  - id: auth-enrollment-separator-domain
    desc: Auth keyword follows hostname separator
    crit: suspicious
    conf: 0.96
    if:
      type: text
      # The separator form covers victim-specific subdomains and hyphenated
      # roots such as login-sso.example. It cannot start the auth term in the
      # middle of an ordinary label such as lessonspace.com.
      regex: '(?i)https?://[a-z0-9.-]*[.-](passkey|mfa|sso|okta)[a-z0-9-]*\.[a-z]{2,}([:/?#]|$)'
    not:
      # A keyword that is itself the registrable label is provider/agency
      # infrastructure, not a lookalike. This removes URLs such as
      # developer.okta.com while retaining auth labels before another
      # organization domain, such as login.sso.example.com.
      - regex: '(?i)//[a-z0-9.-]+\.(passkey|mfa|sso|okta)\.[a-z]{2,}([:/?#]|$)'
      # Okta serves its supported browser SDK from global.oktacdn.com. The
      # `okta` prefix belongs to the registrable provider domain here; it is
      # not an auth-themed label added in front of a victim domain.
      - regex: '(?i)//([a-z0-9-]+\.)*oktacdn\.com([:/?#]|$)'

  - id: organization-passkey-domain
    desc: Organization-branded passkey domain
    crit: suspicious
    conf: 0.96
    if:
      type: text
      # Covers the article's `company.createssopasskey.com` and
      # `company.addssopasskey.com` forms plus future victim labels.
      # Require URL syntax: dotted JavaScript property chains such as
      # `reverification.passkey.title` are not hostnames.
      regex: '(?i)https?://[a-z0-9-]{2,63}\.[a-z0-9-]{0,24}passkey[a-z0-9-]{0,24}\.[a-z]{2,20}([:/?#]|$)'

  - id: organization-setup-sso-domain
    desc: Organization-branded SSO setup domain
    crit: suspicious
    conf: 0.96
    if:
      type: text
      # Avoid matching ordinary `organization.sso.<provider>` references;
      # the observed artifact uses an action word fused to the auth label.
      # Require URL syntax so dotted property names cannot be split into a
      # fake hostname and TLD.
      regex: '(?i)https?://[a-z0-9-]{2,63}\.[a-z0-9-]{0,24}setupsso[a-z0-9-]{0,12}\.[a-z]{2,20}\b'

  - id: organization-enrollment-domain
    desc: Organization-branded enrollment domain
    crit: suspicious
    conf: 0.96
    if:
      type: text
      # Covers the linked GTIG `organization.enrollms.com` form.
      # Phishing labels are lowercase hostnames; do not use (?i) — camelCase
      # property chains such as `this.enrolledFactors.filter` false-positive.
      regex: 'https?://[a-z0-9-]{2,63}\.[a-z0-9-]{0,24}enroll[a-z0-9-]{0,24}\.[a-z]{2,20}\b'

  # ShinyHunters used <target>.claims domains as throwaway help-desk and SSO
  # impersonation infrastructure. Match the reusable single-label hostname
  # shape, not the incident's victim name. A .claims URL is only a network
  # observation here; the composites below add the credential behavior.
  - id: single-label-claims-domain
    desc: URL uses a single-label .claims domain
    crit: notable
    conf: 0.98
    if:
      type: text
      regex: '(?i)https?://[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?\.claims([:/?#]|$)'

composite_rules:
  - id: auth-enrollment-domain-pattern
    desc: Auth-enrollment keyword domain pattern
    crit: suspicious
    conf: 0.98
    any:
      - id: generic-auth-enrollment-domain
      - id: auth-enrollment-separator-domain
      - id: organization-auth-lookalike-domain

  - id: social-engineering-auth-domain-pattern
    desc: Auth-themed or single-label .claims domain pattern
    crit: notable
    conf: 0.98
    any:
      - id: auth-enrollment-domain-pattern
      - id: single-label-claims-domain

  - id: organization-auth-lookalike-domain
    desc: Organization-branded auth lookalike domain
    crit: suspicious
    conf: 0.98
    any:
      - id: organization-passkey-domain
      - id: organization-setup-sso-domain
      - id: organization-enrollment-domain

  - id: lookalike-sso-login-surface
    desc: Lookalike SSO domain with credential fields
    crit: suspicious
    conf: 0.98
    all:
      - id: social-engineering-auth-domain-pattern
      - id: micro-behaviors/ui/window/form-input::browser-credential-field-pair
    near_bytes: 1200

  - id: lookalike-sso-credential-phish
    desc: Lookalike SSO domain posts credentials externally
    crit: hostile
    conf: 0.99
    attack: T1566.002,T1056.002,T1041
    all:
      - id: lookalike-sso-login-surface
      - id: external-login-form-action
    near_bytes: 1400
    unless:
      # When the page also prompts for the second factor, the MFA composite
      # below states everything this one does and more. Reporting both put the
      # same page in the output twice as two different hostile findings.
      - id: lookalike-sso-mfa-phish

  - id: lookalike-sso-mfa-phish
    desc: Lookalike SSO page posts MFA fields externally
    crit: hostile
    conf: 0.99
    attack: T1566.002,T1056.002,T1111,T1041
    all:
      - id: lookalike-sso-login-surface
      - id: micro-behaviors/ui/window/form-input::browser-mfa-field-reference
      - id: external-login-form-action
    near_bytes: 1600
