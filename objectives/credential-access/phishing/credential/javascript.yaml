defaults:
  platforms: [windows, unix]
  for:
    - javascript
traits:
  - id: js-microsoft-logo
    desc: Microsoft logo asset reference
    # A logo asset is only a branding fragment; the phishing objective is
    # inferred by the login-form and lure legs below.
    crit: component
    conf: 0.85
    if:
      type: string_literal
      substr: Microsoft_logo.svg
    unless:
      - id: metadata/file/profile/identity::static-html-shell
      - id: metadata/library/microsoft-auth::ests-login-runtime
  - id: js-microsoft-login-text
    desc: Microsoft login branding
    # Branding alone is incomplete phishing evidence (for example, a normal
    # connected-apps picker may contain "Microsoft 365").
    crit: component
    conf: 0.8
    if:
      type: string_literal
      regex: Microsoft\s+(account|login|sign.?in|365)
    unless:
      - id: metadata/file/profile/identity::static-html-shell
      - type: string_literal
        substr: Microsoft Visual
      - type: string_literal
        substr: Microsoft Corporation
      - id: well-known/app/development/vscode-extension/vscode-marketplace::m365-agents-toolkit-vsix
      - id: metadata/library/microsoft-auth::ests-login-runtime
  - id: js-mfa-code-field-read
    desc: Reads page MFA or verification code field
    crit: suspicious
    conf: 0.94
    if:
      # Require an actual value read of the OTP field (.value / .val()), i.e.
      # capturing the code the user typed. Parsing server-response HTML to
      # merely *detect* the MFA form (cheerio `.load(html)("#auth-mfa-otpcode")`)
      # is login-flow step detection, not code theft, so `load` is excluded.
      type: text
      regex: 'auth[-_]?mfa[-_]?otp[\s\S]{0,100}\.(value\b|val\s*\()'
      case_insensitive: true

  - id: extension-remote-auth-endpoint
    desc: Calls remote auth endpoint
    crit: notable
    conf: 0.98
    if:
      type: text
      regex: 'https?://[^"''\s]{1,180}/api/chrome-ext/auth|\$\{[^}]{1,160}\}/api/chrome-ext/auth'
      case_insensitive: true

  - id: extension-page-secret-selector
    desc: References Amazon MFA secret selector
    crit: component
    conf: 0.98
    if:
      type: text
      substr: '#sia-auth-app-formatted-secret'

  - id: extension-page-secret-value-read
    desc: Reads text following secret selector
    crit: component
    conf: 0.95
    if:
      type: text
      regex: 'secret[\s\S]{0,80}textContent'

  - id: js-sensitive-mfa-report
    desc: Report call tagged sensitive category
    # Matcher only proves a report()/log call passes a "sensitive" category
    # argument — a generic telemetry idiom (a seller tool reporting a
    # "needs verification code" status event tags it sensitive too). It is a
    # supporting fragment: theft intent comes from the paired OTP value-read
    # leg in the extension-mfa-code-collection composite, not this atom.
    crit: component
    conf: 0.8
    if:
      type: text
      regex: 'report\s*\(.{0,400}["'']sensitive["'']'
      case_insensitive: true
  - id: js-password-retry-error
    desc: Password retry error lure
    crit: suspicious
    conf: 0.82
    if:
      type: string_literal
      substr: Verify your password and try again
  - id: headlesschrome-match
    desc: Checks UA for HeadlessChrome bot
    crit: component
    conf: 0.8
    if:
      type: text
      regex: HeadlessChrome[\s\S]{0,80}(includes|indexOf|match)
  - id: js-honeypot-field
    desc: Honeypot form field (anti-bot)
    crit: notable
    conf: 0.8
    if:
      type: string_literal
      regex: honeypot-field|class="honeypot"
  - id: js-document-lure
    desc: Document sharing/preview lure
    crit: component
    conf: 0.8
    unless:
      - type: basename
        regex: '\.po$'
      - id: metadata/package/quality/benign-context::benign-trojanized-fp-context
    if:
      type: string_literal
      regex: Recent Files|RFQ\.pdf|CloudFiles|Specification\.pdf

  - id: extension-identity-label
    desc: Identity verification label
    crit: notable
    conf: 0.96
    if:
      type: text
      substr: Verify Identity

  - id: extension-email-label
    desc: Verification email input label
    crit: notable
    conf: 0.9
    if:
      type: text
      substr: Enter Email

  - id: extension-pin-label
    desc: Verification PIN input label
    crit: notable
    conf: 0.9
    unless:
      - id: metadata/package/testing/presence/harness::test-directory-path
    if:
      type: text
      substr: Enter PIN

  - id: extension-verification-email-path
    desc: Verification email endpoint path
    crit: notable
    conf: 0.96
    if:
      type: text
      substr: /send-email/

  - id: extension-verification-recipient
    desc: Recipient field uses email input
    crit: notable
    conf: 0.97
    if:
      type: text
      regex: '\brecipient\s*:\s*email\b'

  - id: extension-verification-email-storage
    desc: Stores email with disable setting
    crit: notable
    conf: 0.97
    if:
      type: text
      regex: '(?is)storage\.local\.set\s*\(.{0,180}disable_analysis.{0,120}userEmail'

composite_rules:
  - id: extension-email-pin-verification-lure
    desc: Email and PIN verification lure
    crit: notable
    conf: 0.98
    near_lines: 30
    all:
      - id: extension-identity-label
      - id: extension-email-label
      - id: extension-pin-label

  - id: extension-verification-email-request
    desc: Verification code email request
    crit: notable
    conf: 0.99
    near_lines: 30
    all:
      - id: micro-behaviors/communications/http/auth::verification-code-field
      - id: extension-verification-email-path
      - id: extension-verification-recipient
      - id: micro-behaviors/communications/http/request/client::fetch-post-pattern

  - id: js-ms-branding-indicators
    desc: Microsoft branding indicators
    crit: component
    unless:
      - id: metadata/library/microsoft-auth::ests-login-runtime
    any:
      - id: js-microsoft-logo
      - id: js-microsoft-login-text
  - id: headlesschrome-checks
    desc: HeadlessChrome detection checks
    crit: component
    conf: 0.85
    any:
      - id: micro-behaviors/os/sysinfo/platform/browser::browser-headlesschrome-useragent-check
      - id: headlesschrome-match
  - id: js-bot-detection
    desc: Browser bot detection logic
    crit: component
    conf: 0.9
    any:
      - id: micro-behaviors/os/sysinfo/platform/browser::navigator-webdriver-read
      - id: headlesschrome-checks
      - id: micro-behaviors/os/sysinfo/platform/browser::browser-headless-detector-name
  - id: js-microsoft-phishing-page
    desc: Microsoft credential phishing page
    crit: hostile
    conf: 0.98
    attack: T1566.002
    all:
      - id: js-ms-branding-indicators
      - id: js-webmail-login-form
    any:
      - id: js-bot-detection
      - id: js-document-lure
      - id: js-honeypot-field
      - id: micro-behaviors/ui/window/manage/dom::session-sign-in-required-message
      - id: js-password-retry-error
  - id: js-webmail-login-form
    desc: Webmail login credential form
    crit: component
    conf: 0.9
    near_lines: 120
    all:
      - id: micro-behaviors/ui/window/manage/dom::email-input-field
      - id: micro-behaviors/ui/window/form-input::password-input-field-script
    any:
      - id: micro-behaviors/ui/window/manage/dom::signin-submit-label
      - id: micro-behaviors/ui/window/manage/dom::js-paired-email-password-identifiers

  - id: extension-mfa-code-collection
    desc: Extension reads and reports page MFA codes
    crit: hostile
    conf: 0.98
    attack: T1056.002
    scope: archive
    all:
      - id: metadata/permission/runtime::is-extension
      - id: js-mfa-code-field-read
      - id: js-sensitive-mfa-report

  - id: extension-mfa-credential-phishing
    desc: MFA credential phishing in extension
    crit: hostile
    conf: 0.99
    attack: T1056.002,T1056.003,T1041
    scope: archive
    for: [crx, zip, archives]
    all:
      - id: metadata/file/format/browser-extension::web-extension-root-manifest
      - id: metadata/permission/host::host-shopping-sites
      - id: micro-behaviors/process/inject/webextension::webextension-scripting-execute
      - id: metadata/permission/manifest::permission-scripting
      - id: metadata/permission/active-tab::permission-active-tab
      - id: micro-behaviors/communications/http/request/client::js-fetch-call
      - id: micro-behaviors/communications/http/request/client::post-method-text
      - id: extension-remote-auth-endpoint
      - id: micro-behaviors/data/serialize/json::username-password-json-body
      - id: micro-behaviors/ui/window/manage/dom::dom-element-lookup--queryselector
      - id: extension-page-secret-selector
      - id: extension-page-secret-value-read

  - id: extension-page-mfa-secret-extraction
    desc: Reads MFA secret from page
    crit: suspicious
    conf: 0.98
    near_lines: 30
    all:
      - id: micro-behaviors/process/inject/webextension::webextension-scripting-execute
      - id: micro-behaviors/ui/window/manage/dom::dom-element-lookup--queryselector
      - id: extension-page-secret-selector
      - id: extension-page-secret-value-read

  - id: extension-verification-credential-lure
    desc: Email verification gates analysis disable
    crit: hostile
    conf: 0.99
    attack: T1056.002,T1041,T1562.001
    scope: archive
    for: [crx, xpi, zip, archives]
    all:
      - id: metadata/file/format/browser-extension::web-extension-root-manifest
      - id: metadata/permission/host::broad-host-access
      - id: extension-email-pin-verification-lure
      - id: extension-verification-email-request
      - id: extension-verification-email-storage
      - id: micro-behaviors/communications/http/request/client::fetch-post-pattern

  # Native prompt() with a session-expired password lure, then Base64 of the
  # captured input. Browser dialogs are not a login page; encoding the return
  # value is the harvest, not a form POST.
  - id: native-prompt-session-password-phish
    desc: prompt() harvests a session-expired password
    crit: hostile
    conf: 0.97
    attack: T1056.002,T1566.002
    near_bytes: 1200
    all:
      - id: micro-behaviors/ui/window/form-input::window-prompt-string-call
      - id: objectives/credential-access/phishing/lure::session-expired-password-lure
      - id: micro-behaviors/data/encode/base64::btoa-symbol
