defaults:
  platforms: [windows, unix]
  for: [svg]
  attack: T1056.002,T1041,T1566.002

composite_rules:
  - id: svg-input-capture-exfiltration
    desc: SVG captures browser input and posts it to a remote host
    crit: hostile
    conf: 0.99
    all:
      - id: micro-behaviors/data/format/html::inline-svg-script-body
      - id: micro-behaviors/hardware/input/event::svg-browser-input-event-listener
      - id: micro-behaviors/ui/window/form-input::svg-event-target-value-read
      - id: micro-behaviors/communications/http/post::svg-fetch-post-request
    near_bytes: 2200

  - id: svg-obfuscated-external-redirector
    desc: SVG hides script logic and redirects the browser externally
    crit: hostile
    conf: 0.98
    attack: T1027,T1189,T1566.002
    all:
      - id: micro-behaviors/data/format/html::inline-svg-script-body
      - id: micro-behaviors/data/encode/hex::svg-hex-escaped-member-call
      - id: objectives/credential-access/phishing/mfa-relay::svg-location-external-assignment
    near_bytes: 2200
