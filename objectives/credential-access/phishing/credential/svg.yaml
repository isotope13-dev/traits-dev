defaults:
  platforms: [windows, unix]
  for: [svg]
  attack: T1056.002,T1041,T1566.002

composite_rules:
  - id: svg-input-capture-exfiltration
    desc: SVG captures browser input and posts it to a remote host
    crit: hostile
    conf: 0.99
    all:
      - id: micro-behaviors/data/format/html::inline-svg-script-body
      - id: micro-behaviors/hardware/input/event::svg-browser-input-event-listener
      - id: micro-behaviors/ui/window/form-input::svg-event-target-value-read
      - id: micro-behaviors/communications/http/post::svg-fetch-post-request
    near_bytes: 2200

  - id: svg-obfuscated-external-redirector
    desc: SVG hides script logic and redirects the browser externally
    crit: hostile
    conf: 0.98
    attack: T1027,T1189,T1566.002
    all:
      - id: micro-behaviors/data/format/html::inline-svg-script-body
      - id: micro-behaviors/data/encode/hex::svg-hex-escaped-member-call
      - id: objectives/credential-access/phishing/mfa-relay::svg-location-external-assignment
    near_bytes: 2200

  # Voicemail-lure campaigns (INKY-reported, June-August 2026) concealed the
  # loader behind deferred execution: the inline script sleeps briefly, then
  # injects a <script> element pointing at a remote endpoint. Each leg alone
  # has benign readings; an SVG that does all three is an attachment stager.
  - id: svg-deferred-remote-script-injection
    desc: SVG defers execution then injects a script element
    crit: hostile
    conf: 0.97
    attack: T1059.007,T1027,T1566.002
    all:
      - id: micro-behaviors/data/format/html::inline-svg-script-body
      - id: micro-behaviors/communications/http/client/resource::dynamic-script-element-load
      - id: micro-behaviors/time/schedule/interval::timer-call-reference
    near_bytes: 2200

  # Fully obfuscated loader: the script element is built through a concealed
  # string table (`document[_0x4f2a[1]]('script')`), so createElement never
  # appears literally — only the computed src assignment and the decode
  # evidence remain. Covers hex string tables, hex-escaped member calls,
  # atob() and character-code reconstruction.
  - id: svg-string-table-remote-loader
    desc: SVG reconstructs concealed strings to load remote content
    crit: hostile
    conf: 0.97
    attack: T1027,T1059.007,T1566.002
    all:
      - id: micro-behaviors/data/format/html::inline-svg-script-body
      - id: micro-behaviors/communications/http/client/resource::svg-element-src-computed-assignment
    any:
      - id: micro-behaviors/data/encode/hex::svg-hex-escaped-string-array
      - id: micro-behaviors/data/encode/hex::svg-hex-escaped-member-call
      - id: micro-behaviors/data/decode/base64::base64-decode-call-text
      - id: micro-behaviors/data/decode/custom::fromcharcode-apply-array
      - id: micro-behaviors/data/decode/custom::fromcharcode-indexed-array
    near_bytes: 2200

  # The redirect variant: the destination URL is assembled at runtime and
  # assigned from a variable, so the literal-URL redirector above cannot see
  # it. The reconstruction evidence plus the computed navigation write is the
  # campaign's "fetched a remote endpoint" leg.
  - id: svg-reconstructed-external-redirect
    desc: SVG redirects browser to runtime-reconstructed URL
    crit: hostile
    conf: 0.96
    attack: T1027,T1189,T1566.002
    all:
      - id: micro-behaviors/data/format/html::inline-svg-script-body
      - id: objectives/credential-access/phishing/mfa-relay::svg-location-variable-assignment
    any:
      - id: micro-behaviors/data/encode/hex::svg-hex-escaped-string-array
      - id: micro-behaviors/data/encode/hex::svg-hex-escaped-member-call
      - id: micro-behaviors/data/decode/base64::base64-decode-call-text
      - id: micro-behaviors/data/decode/custom::fromcharcode-apply-array
      - id: micro-behaviors/data/decode/custom::fromcharcode-indexed-array
    near_bytes: 2200
