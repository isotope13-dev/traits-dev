# Credential phishing that uses public HTTP debugging/webhook services as the
# collection backend. The endpoint is a technique indicator; the hostile rule
# requires it to be paired with a browser login form and an outbound POST.
defaults:
  platforms: [windows, unix]
  for: [html, javascript, typescript]
  attack: T1566.002,T1056.002,T1041
  mbc: B0030

traits:
  # The bare open("POST")/send() pair is neutral XHR transport and now lives
  # at micro-behaviors/communications/http/post::xhr-post-open-send; only the
  # webhook endpoint below carries the phishing-backend meaning.
  - id: webhook-xhr-url
    desc: Webhook URL in XHR
    crit: notable
    conf: 0.92
    if:
      type: text
      regex: '(?is)\.open\s*\([^)]{0,180}(webhook\.site|pipedream\.(net|com))'

  - id: credential-value-payload
    desc: Browser login value payload
    crit: notable
    conf: 0.92
    if:
      type: text
      # Require a browser form value; generic auth option objects such as
      # Axios proxy credentials are not credential capture.
      regex: '\b(login|username)\s*:\s*[^,\n]{0,40}\.value\s*,\s*(pass|password)\s*:'
      case_insensitive: true

composite_rules:
  - id: public-webhook-form-capture
    desc: Webhook form captures login credentials
    crit: hostile
    conf: 0.99
    attack: T1056.002,T1041,T1566.002
    all:
      - id: objectives/exfiltration/oob/endpoint::web-content-oob-service-reference
      - id: micro-behaviors/communications/http/request/html::html-form-external-action
      - id: micro-behaviors/ui/window/form-input::browser-username-input-marker
      - id: micro-behaviors/ui/window/form-input::browser-password-input-marker
    near_bytes: 1200

  - id: public-webhook-xhr-capture
    desc: Webhook XHR captures login values
    crit: hostile
    conf: 0.99
    attack: T1056.002,T1041,T1566.002
    all:
      - id: webhook-xhr-url
      - id: micro-behaviors/communications/http/post::xhr-post-open-send
      - id: credential-value-payload
    near_bytes: 900
