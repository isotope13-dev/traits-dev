defaults:
  platforms: [unix, windows]
  for: [html, php, javascript]
  attack: T1566.002
  mbc: B0030
traits:
- id: php-credential-label-account
  desc: PHP writes Account label for credentials
  crit: notable
  conf: 0.9
  for: [php]
  if:
    type: string_literal
    substr: "Account: "
- id: php-credential-label-pass
  desc: PHP writes Pass label for credentials
  crit: notable
  conf: 0.9
  for: [php]
  if:
    type: string_literal
    substr: " Pass: "
- id: card-number-input-field
  desc: Card number input field
  crit: notable
  conf: 0.86
  for: [php, html]
  if:
    type: text
    substr: cardNumber
- id: cvv-field-token
  desc: CVV field token
  crit: component
  conf: 0.86
  for: [php, html]
  if:
    type: text
    word: cvv
- id: csc-number-field-token
  desc: CSC number field token
  crit: notable
  conf: 0.86
  for: [php, html]
  if:
    type: text
    word: cscNumber
- id: crd-cv-field-token
  desc: Card CV variable token
  crit: notable
  conf: 0.86
  for: [php, html]
  if:
    type: text
    word: crd_cv
- id: crd-ttcv-field-token
  desc: Card CVV title token
  crit: notable
  conf: 0.86
  for: [php, html]
  if:
    type: text
    word: crd_ttcv
- id: three-ds-password-field
  desc: 3DS password input field
  crit: notable
  conf: 0.88
  for: [php, html]
  if:
    type: text
    regex: '(type=["'']password["'']|crd_3ds)'
- id: bank-account-sort-code-field
  desc: HTML input names a bank sort code
  crit: notable
  conf: 0.86
  for: [php, html]
  if:
    type: text
    regex: '(?i)<input[^>]{0,240}(name|id)[^>]{0,120}sort[ _-]*code[^>]{0,120}>'
- id: bank-account-number-field
  desc: HTML input names a bank account number
  crit: notable
  conf: 0.86
  for: [php, html]
  if:
    type: text
    regex: '(?i)<input[^>]{0,240}(name|id)[^>]{0,120}(account|crd_acc)[^>]{0,120}>'
composite_rules:
- id: cvv-input-field
  desc: CVV input field
  crit: component
  conf: 0.88
  any:
  - id: cvv-field-token
  - id: csc-number-field-token
  - id: crd-cv-field-token
  - id: crd-ttcv-field-token
