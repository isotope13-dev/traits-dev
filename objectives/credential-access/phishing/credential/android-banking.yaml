defaults:
  platforms: [unix, windows]
  for: [javascript]
  crit: notable
  conf: 0.9
  attack: T1566
traits:
  - id: base64-c2-submit
    desc: Base64 hidden fetch submit
    crit: suspicious
    conf: 0.97
    if:
      type: text
      regex: 'fetch\(window\.atob\(.{0,40}\)\+"\?id="'
composite_rules:
  - id: staged-form-harvest-js
    desc: Banking credential harvest workflow in JS
    crit: hostile
    conf: 0.99
    all:
      - id: base64-c2-submit
      - id: micro-behaviors/data/encode/base64::json-stringify-base64
    any:
      - id: objectives/credential-access/phishing/credential::bank-login-copy
      - id: objectives/credential-access/phishing/credential::pan-kyc-copy
      - id: objectives/credential-access/phishing/credential::account-identity-copy
      - id: objectives/credential-access/phishing/credential::card-pin-copy
      - id: micro-behaviors/ui/window/otp-field::browser-mfa-field-reference
      - id: objectives/credential-access/phishing/credential::invalid-otp-copy
  - id: otp-phish-submit-js
    desc: OTP phishing submit flow in JS
    crit: hostile
    conf: 0.98
    all:
      - id: base64-c2-submit
      - id: micro-behaviors/data/encode/base64::json-stringify-base64
    any:
      - id: micro-behaviors/ui/window/otp-field::browser-mfa-field-reference
      - id: objectives/credential-access/phishing/credential::invalid-otp-copy
