# Activation-Lock / stolen-device phishing kits harvest a short device
# passcode, Apple ID password, and a live 2FA code, then ship the values
# to an operator inbox. Match the capture shape, not a storefront brand.
defaults:
  platforms: [unix, windows]
  for: [php, html]
  attack: T1566.002,T1111,T1056.002
  mbc: B0030

traits:
  - id: php-start-ai-call
    desc: PHP start_ai_call handler
    crit: notable
    conf: 0.95
    for: [php]
    if:
      type: text
      regex: 'function\s+start_ai_call\s*\('

  - id: php-start-call
    desc: PHP start_call handler
    crit: notable
    conf: 0.9
    for: [php]
    if:
      type: text
      regex: 'function\s+start_call\s*\('

  - id: php-send-sms
    desc: PHP send_sms handler
    crit: notable
    conf: 0.9
    for: [php]
    if:
      type: text
      regex: 'function\s+send_sms\s*\('

  - id: device-passcode-maxlength-input
    desc: Device passcode input maxlength
    crit: notable
    conf: 0.93
    if:
      type: text
      regex: '(?i)(name|id)=["'']passcode["''][^>]{0,72}maxlength=["''][46]["'']'

  # Victim pages in this kit family are tokenized as /help?<opaque>, not
  # /help?q=search. Require no '=' so ordinary help-desk query strings drop out.
  - id: opaque-help-query-path
    desc: Opaque /help query token path
    crit: notable
    conf: 0.93
    if:
      type: text
      regex: '(?i)["''/]help\?[A-Za-z0-9_-]{8,64}(["''?#\s]|$)'

  - id: fmi-findmy-lure-host
    desc: FMI or FindMy lure hostname
    crit: suspicious
    conf: 0.95
    if:
      type: text
      regex: '(?i)https?://(www\.)?(findmy|fmi)-[a-z0-9-]+\.[a-z]{2,24}'

composite_rules:
  - id: vapi-vishing-telegram-panel
    desc: VAPI vishing panel posts to Telegram
    crit: hostile
    conf: 0.99
    attack: T1566.004,T1071.001,T1041
    for: [php]
    all:
      - id: php-start-ai-call
      - id: micro-behaviors/communications/http/services/vapi::vapi-assistant-api-path
      - id: micro-behaviors/communications/http/services/telegram::telegram-api-host
    near_lines: 80

  - id: twilio-dtmf-passcode-panel
    desc: TwiML gathers a device passcode
    crit: hostile
    conf: 0.99
    attack: T1056.002,T1566.004
    for: [php]
    all:
      - id: php-start-call
      - id: micro-behaviors/communications/http/services/twilio::twilio-gather-short-pin
    any:
      - id: micro-behaviors/communications/http/url/php-endpoint::sms-api-pro-user-endpoint
      - id: micro-behaviors/communications/http/services/telegram::telegram-api-host
    near_lines: 80

  - id: sms-relay-telegram-panel
    desc: SMS relay panel posts to Telegram
    crit: hostile
    conf: 0.99
    attack: T1566.002,T1071.001,T1041
    for: [php]
    all:
      - id: php-send-sms
      - id: micro-behaviors/communications/http/url/php-endpoint::sms-api-pro-user-endpoint
      - id: micro-behaviors/communications/http/services/telegram::telegram-api-host
    near_lines: 80

  - id: apple-passcode-telegram-harvest
    desc: Apple ID form with passcode and Telegram
    crit: hostile
    conf: 0.99
    attack: T1566.002,T1111,T1041
    all:
      - id: objectives/credential-access/phishing/credential::apple-id-password-input
      - id: device-passcode-maxlength-input
      - id: micro-behaviors/communications/http/services/telegram::telegram-api-host
    near_bytes: 2500

  - id: help-token-passcode-telegram
    desc: Tokenized help path harvests passcode
    crit: hostile
    conf: 0.99
    attack: T1566.002,T1111,T1041
    all:
      - id: opaque-help-query-path
      - id: device-passcode-maxlength-input
      - id: micro-behaviors/communications/http/services/telegram::telegram-api-host
    near_bytes: 2500

  - id: help-token-apple-passcode-page
    desc: Tokenized help path with Apple passcode
    crit: suspicious
    conf: 0.97
    attack: T1566.002,T1111
    all:
      - id: opaque-help-query-path
      - id: objectives/credential-access/phishing/credential::apple-id-password-input
      - id: device-passcode-maxlength-input
    near_bytes: 2500

  - id: fmi-help-token-lure
    desc: FMI lure host with help token
    crit: suspicious
    conf: 0.96
    attack: T1566.002
    all:
      - id: fmi-findmy-lure-host
      - id: opaque-help-query-path
    near_bytes: 800
