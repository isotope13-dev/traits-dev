defaults:
  platforms: [unix, windows]
  for: [html, javascript, typescript]
  attack: T1566.002
  mbc: B0030

traits:
- id: cloud-put-upload
  desc: Browser PUT request
  crit: notable
  conf: 0.84
  if:
    type: text
    regex: \bfetch\s*\([^)]{0,500}\bmethod\s*:\s*['"]PUT['"]

- id: aws-s3-browser-upload--rx-1
  desc: Regex component marker
  crit: suspicious
  conf: 0.88
  if:
    type: text
    regex: \bfetch\s*\([^)]{0,500}s3\.[a-z0-9-]+\.amazonaws\.com

- id: aws-s3-browser-upload--rx-2
  desc: Regex component marker
  crit: suspicious
  conf: 0.88
  if:
    type: text
    regex: s3\.[a-z0-9-]+\.amazonaws\.com[\s\S]{0,500}\bfetch\s*\(

- id: credential-form-fields--rx-3
  desc: Email field followed by password field
  crit: notable
  conf: 0.86
  if:
    type: text
    regex: type\s*=\s*["']email["'][\s\S]{0,900}type\s*=\s*["']password["']

- id: credential-form-fields--rx-4
  desc: "Matches 'password'"
  crit: notable
  conf: 0.86
  if:
    type: text
    regex: type\s*=\s*["']password["'][\s\S]{0,900}type\s*=\s*["']email["']

- id: mailbox-repair-lure--rx-10
  desc: Imperative mailbox or email repair lure
  crit: notable
  conf: 0.86
  if:
    type: literal
    regex: '(?i)\b(repair|sync)\s+(your\s+)?(mailbox|email|outlook)\b'
- id: mailbox-repair-lure--rx-11
  desc: "Matches 'health check'"
  crit: notable
  conf: 0.86
  if:
    type: text
    regex: (?i)(mailbox|email|outlook).{0,80}(spam filter|health check)
- id: mailbox-repair-lure--rx-12
  desc: "Matches 'configuration'"
  crit: notable
  conf: 0.86
  if:
    type: text
    regex: (?i)(mailbox|email|outlook).{0,80}(configuration)
composite_rules:
- id: cloud-credential-upload
  desc: Credential phishing cloud upload
  crit: hostile
  conf: 0.96
  near_lines: 160
  all:
  - id: credential-form-fields
  - id: cloud-put-upload
  any:
  - id: aws-s3-browser-upload
  - id: micro-behaviors/communications/http/services/aws-s3::amazonaws-domain
  - id: micro-behaviors/communications/http/services/aws-s3::regional-bucket-domain
  - id: micro-behaviors/ui/window/notify/message::password-retry-feedback
  - id: mailbox-repair-lure
  needs: 2
- id: aws-s3-browser-upload
  desc: Browser upload to S3
  crit: suspicious
  conf: 0.88
  any:
  - id: aws-s3-browser-upload--rx-1
  - id: aws-s3-browser-upload--rx-2
- id: credential-form-fields
  desc: Email password form fields
  crit: component
  conf: 0.86
  near_lines: 80
  any:
  - id: credential-form-fields--rx-3
  - id: credential-form-fields--rx-4
- id: mailbox-repair-lure
  desc: Mailbox repair lure wording
  crit: component
  conf: 0.86
  any:
  - id: mailbox-repair-lure--rx-10
  - id: mailbox-repair-lure--rx-11
  - id: mailbox-repair-lure--rx-12
  not:
  - regex: "(?i)(if this wasn'?t you|didn'?t change your password).{0,180}(change your password|contact support|support team)"
  unless:
  - id: metadata/build/bundler/asset::js-large-module-bundle
  - id: well-known/lib/web/nextjs::next-server-build-path
  - id: well-known/tool/development/vscode-extension/vscode-marketplace::openchamber-vsix
  - id: well-known/tool/development/agent/kilocode::kilo-code-js-bundle
