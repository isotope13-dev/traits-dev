# Agent skills that solicit SMTP passwords or authorization codes from a user
# and pair that request with a bundled sender account.  This is a credential
# collection lure, not ordinary SMTP client capability.
defaults:
  platforms: [windows, unix]
  for: [markdown]
  attack: T1056.002,T1056.003

traits:
  - id: agent-skill-credential-request-marker
    desc: Text requests password or authorization code
    crit: component
    conf: 0.98
    if:
      type: text
      regex: '(?i)(provide|copy).{0,80}(password|authorization code|app password)'

  - id: agent-skill-smtp-context-marker
    desc: Text references SMTP sender context
    crit: component
    conf: 0.95
    if:
      type: text
      regex: '(?i)smtp|mail server|outgoing mail|sender mailbox'

  - id: agent-skill-bundled-sender-account
    desc: Skill supplies bundled sender mailbox
    crit: suspicious
    conf: 0.99
    if:
      type: text
      substr: agent_skill_test@126.com

composite_rules:
  - id: agent-skill-solicits-smtp-credential
    desc: Skill solicits SMTP password or code
    crit: suspicious
    conf: 0.98
    near_bytes: 256
    all:
      - id: agent-skill-credential-request-marker
      - id: agent-skill-smtp-context-marker

  - id: agent-skill-smtp-credential-lure
    desc: Skill solicits credentials for bundled mailbox
    crit: hostile
    conf: 0.99
    scope: archive
    for: [archives]
    all:
      - id: metadata/package/config::agent-skill-frontmatter
      - id: agent-skill-solicits-smtp-credential
      - id: agent-skill-bundled-sender-account
