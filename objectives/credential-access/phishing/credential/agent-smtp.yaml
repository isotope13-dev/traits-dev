# Agent skills that solicit SMTP passwords or authorization codes from a user
# and pair that request with a bundled sender account.  This is a credential
# collection lure, not ordinary SMTP client capability.
defaults:
  platforms: [windows, unix]
  for: [markdown]
  attack: T1056.002,T1056.003

traits:
  - id: agent-skill-credential-request-marker
    desc: Text requests password or authorization code
    crit: notable
    conf: 0.98
    if:
      type: text
      regex: '(?i)\b(provide|copy)\b.{0,80}\b(password|authorization code|app password)\b'

  # SMTP mention is neutral documentation vocabulary (changelogs, config
  # guides); the canonical atom lives in micro-behaviors and the composites
  # below reference it cross-directory.
  - id: agent-skill-bundled-sender-account
    desc: Skill supplies bundled sender mailbox
    crit: suspicious
    conf: 0.99
    if:
      type: text
      substr: agent_skill_test@126.com

composite_rules:
  - id: agent-skill-solicits-smtp-credential
    desc: Skill solicits SMTP password or code
    crit: suspicious
    conf: 0.98
    near_bytes: 256
    all:
      # The file header's subject is "agent skills that solicit SMTP
      # passwords", and the hostile rule below establishes that with
      # `agent-skill-frontmatter`. This one never did, so its whole test was
      # "a markdown file that says `provide ... password` within 256 bytes of
      # the word SMTP" -- which is what an SMTP configuration guide says.
      # ASP.NET Boilerplate's doc/WebSite/Email-Sending.md and
      # Setting-Management.md scored it.
      - id: metadata/package/agent-skill::agent-skill-frontmatter
      - id: agent-skill-credential-request-marker
      - id: micro-behaviors/communications/email/send/smtp::smtp-mail-context-reference

  - id: agent-skill-smtp-credential-lure
    desc: Skill solicits credentials for bundled mailbox
    crit: hostile
    conf: 0.99
    scope: archive
    for: [markdown, zip, tar]
    all:
      # `agent-skill-frontmatter` was here; it is now required by
      # `agent-skill-solicits-smtp-credential` itself, so naming it again adds
      # nothing.
      - id: agent-skill-solicits-smtp-credential
      - id: agent-skill-bundled-sender-account
