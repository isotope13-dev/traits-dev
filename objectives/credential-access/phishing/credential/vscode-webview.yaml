defaults:
  platforms: [windows, linux, macos]
  for: [javascript, typescript]

traits:
  - id: vscode-private-key-before-password-type
    desc: Private-key input precedes password type
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: '(?is)<input[^>]{0,180}private[ _-]*key[^>]{0,180}type\s*=\s*["'']password["'']'

  - id: vscode-password-type-before-private-key
    desc: Password type precedes private-key input
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: '(?is)<input[^>]{0,180}type\s*=\s*["'']password["''][^>]{0,180}private[ _-]*key'

composite_rules:
  - id: vscode-private-key-password-field
    desc: VS Code webview masks private-key input
    crit: notable
    conf: 0.94
    any:
      - id: vscode-private-key-before-password-type
      - id: vscode-password-type-before-private-key

  - id: vscode-remote-script-private-key-form
    desc: Remote-script VS Code webview accepts a private key
    crit: suspicious
    conf: 0.94
    attack: T1056.002
    all:
      - id: vscode-private-key-password-field
      - id: micro-behaviors/communications/http/client/resource::vscode-webview-remote-script-load
