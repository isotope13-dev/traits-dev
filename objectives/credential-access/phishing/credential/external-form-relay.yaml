# Login forms that hand the credentials they collect to a host other than the
# one that serves the page.
#
# These rules used to live in `objectives/credential-access/phishing/
# captive-portal/`, but none of them tests for a captive portal: every genuine
# captive-portal composite in that directory is gated on a connectivity-probe
# URL, and these carry no such leg. They describe the general credential-
# phishing surface — a login form whose action or fetch target is off-origin —
# so a hotspot page, a cloned SSO page and an adversary-in-the-middle relay all
# reach them. The captive-portal composites now reference them from their own
# directory and supply the probe evidence themselves.
defaults:
  platforms: [windows, unix]
  # PHP- and TypeScript-backed pages can contain the same rendered form markup.
  for: [html, javascript, typescript, php]
  conf: 0.96
  attack: T1566.002
  mbc: B0030

composite_rules:
  # The password field is what makes this a *login* form: without it the two
  # markup legs matched any form that POSTs off-origin (newsletter subscribe,
  # checkout, site search), which is how ordinary WordPress plugins landed in
  # credential-access/phishing.
  - id: external-login-form-action
    desc: Login form posts to external origin
    crit: notable
    all:
      - id: micro-behaviors/communications/http/request/html::html-form-external-action
      - id: micro-behaviors/communications/http/post::html-form-post-method
      - id: micro-behaviors/ui/window/form-input::browser-password-input-marker
    near_bytes: 900

  # Serialising a login form and handing it to `fetch` is how every AJAX sign-in
  # page works, so the off-origin leg carries the whole claim: a first-party
  # login posts to a site-relative path on its own host, a relay posts to a
  # hardcoded absolute URL. Without it these fired on ordinary intranet logins.
  - id: credential-form-relay-js
    desc: JavaScript sends login form fields to an off-origin URL
    crit: suspicious
    for: [javascript]
    all:
      - id: micro-behaviors/communications/http/request/client::js-fetch-call
      - id: micro-behaviors/communications/http/request/client::fetch-post-pattern
      - id: micro-behaviors/ui/window/form-input::browser-credential-field-pair
      - id: micro-behaviors/communications/http/form::browser-off-origin-submission-target
    any:
      - id: micro-behaviors/communications/http/post::formdata-class
      - id: micro-behaviors/communications/http/url/query::js-urlsearchparams-construction
    near_bytes: 500

  - id: credential-form-relay-html
    desc: HTML script sends login form fields to an off-origin URL
    crit: suspicious
    for: [html]
    all:
      - id: micro-behaviors/communications/http/request/html::html-fetch-call
      - id: micro-behaviors/communications/http/request/html::html-fetch-post-call
      - id: micro-behaviors/ui/window/form-input::browser-credential-field-pair
      - id: micro-behaviors/communications/http/form::browser-off-origin-submission-target
    any:
      - id: micro-behaviors/communications/http/post::formdata-class
      - id: micro-behaviors/communications/http/url/query::js-urlsearchparams-construction
    near_bytes: 500

  - id: credential-form-relay
    desc: Browser script relays login form fields off-origin
    crit: suspicious
    any:
      - id: credential-form-relay-js
      - id: credential-form-relay-html

  # Adversary-in-the-middle harvest page: the submit handler serialises the
  # login form, posts it to a host that is not the page's own, and then sends
  # the browser somewhere else so the victim lands on a working sign-in screen
  # and reads the detour as a glitch.
  #
  # The `any:` leg is what keeps a legitimate product off this rule. A SaaS
  # login that posts to its own `accounts.` host and then redirects to its own
  # app satisfies every `all:` leg; it does not additionally forward the victim
  # to a third party's identity provider, lift the session cookie, or live on a
  # domain named for passkey/SSO enrollment.
  - id: external-form-credential-relay-redirect
    desc: Login form relays credentials off-origin then redirects to a provider
    crit: hostile
    conf: 0.99
    attack: T1056.002,T1041,T1566.002
    all:
      - id: external-login-form-action
      - id: credential-form-relay-html
      - id: micro-behaviors/communications/http/request/html::html-fetch-post-call
      - id: micro-behaviors/ui/window/manage/navigation::browser-external-redirect
    needs: 1
    any:
      - id: micro-behaviors/communications/http/cookies::browser-document-cookie-read
      - id: micro-behaviors/communications/http/oauth::microsoft-login
      - id: micro-behaviors/communications/http/oauth::google-accounts
      - id: social-engineering-auth-domain-pattern
    near_lines: 180
