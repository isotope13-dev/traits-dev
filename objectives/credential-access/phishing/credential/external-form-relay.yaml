# Login forms that submit credentials to an absolute target before a suspicious
# provider handoff.
#
# These rules used to live in `objectives/credential-access/phishing/
# captive-portal/`, but none of them tests for a captive portal: every genuine
# captive-portal composite in that directory is gated on a connectivity-probe
# URL, and these carry no such leg. They describe the general credential-
# phishing surface — a login form with an absolute action or fetch target —
# so a hotspot page, a cloned SSO page and an adversary-in-the-middle relay all
# reach them. The captive-portal composites now reference them from their own
# directory and supply the probe evidence themselves.
defaults:
  platforms: [windows, unix]
  # PHP- and TypeScript-backed pages can contain the same rendered form markup.
  for: [html, javascript, typescript, php]
  conf: 0.96
  attack: T1566.002
  mbc: B0030

composite_rules:
  # Adversary-in-the-middle harvest page: the submit handler serialises the
  # login form, posts it to an absolute target, and then sends
  # the browser somewhere else so the victim lands on a working sign-in screen
  # and reads the detour as a glitch.
  #
  # The `any:` leg is what keeps a legitimate product off this rule. A SaaS
  # login that posts to its own `accounts.` host and then redirects to its own
  # app satisfies every `all:` leg; it does not additionally forward the victim
  # to a third party's identity provider, lift the session cookie, or live on a
  # domain named for passkey/SSO enrollment.
  - id: external-form-credential-relay-redirect
    desc: Login form submits credentials then redirects to a provider
    crit: hostile
    conf: 0.99
    attack: T1056.002,T1041,T1566.002
    all:
      - id: micro-behaviors/communications/http/form::browser-login-absolute-form-action
      - id: micro-behaviors/communications/http/form::browser-credential-absolute-fetch-html
      - id: micro-behaviors/communications/http/request/html::html-fetch-post-call
      - id: micro-behaviors/ui/window/manage/navigation::browser-external-redirect
    needs: 1
    any:
      - id: micro-behaviors/communications/http/cookies::browser-document-cookie-read
      - id: micro-behaviors/communications/http/oauth::microsoft-login
      - id: micro-behaviors/communications/http/oauth::google-accounts
      - id: social-engineering-auth-domain-pattern
    near_lines: 180
