# A masked password request justified by application compatibility, alongside
# access to saved credentials. No filename, product brand, or endpoint is required.
defaults:
  platforms: [macos]
  for: [scripts, source, macho]

composite_rules:
  - id: compatibility-password-harvest
    desc: Compatibility password lure with saved secrets
    crit: hostile
    conf: 0.97
    attack: T1056.002
    all:
      - id: micro-behaviors/ui/dialog/prompt::compatibility-password-message
      - id: micro-behaviors/ui/dialog/apple::display-dialog-password
      - id: micro-behaviors/ui/dialog/apple::hidden-answer
    any:
      - id: micro-behaviors/data/db/access::chromium-login-sql
      - id: micro-behaviors/fs/path/password-store::macos-login-keychain
