# Prime Gaming connects EA accounts by provider authorization. A page claiming
# that service while reading a password locally and handing off to EA is deceptive capture.
# Require actual credential markup and a value passed to code, not reward prose.
defaults:
  platforms: [unix, windows]
  for: [html]
composite_rules:
  - id: prime-ea-password-capture
    desc: Prime Gaming lure captures EA password
    crit: hostile
    conf: 0.98
    attack: T1056.003
    near_bytes: 6000
    all:
      - id: well-known/app/media/prime-gaming::page-title
      - id: micro-behaviors/ui/controls/credential::html-password-input-tag
      - id: micro-behaviors/ui/window/navigation/location::ea-provider-navigation
      - id: micro-behaviors/ui/controls/credential::password-dom-value-argument
      - id: micro-behaviors/communications/http/post::html-fetch-post-call
