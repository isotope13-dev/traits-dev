# A label in a comment is a claim, not proof the page performs phishing.
# Consumers should combine it with evidence of the claimed behavior.
defaults:
  platforms: [windows, unix]
  for: [html]

traits:
  - id: whatsapp-phishing-script-self-label
    desc: WhatsApp phishing script self-label
    crit: notable
    conf: 0.96
    if:
      type: text
      regex: '(?is)<!--.{0,700}\bscript\s+phi(sh|s)ing\s+whatsapp\s+group\s+invite\b.{0,700}-->'
