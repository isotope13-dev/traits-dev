defaults:
  platforms: [windows]
  for: [pdf]
  attack: T1566
traits:
  - id: pcsp-pcal-lure-metadata
    desc: PCSP/PCAL phishing lure title metadata
    crit: component
    conf: 0.98
    if:
      type: text
      substr: "<FEFF004F004600CD00430049004F00200052004500510055004900530049005400D300520049004F0020002D00200050004300530050002F005000430041004C>"

  - id: pcsp-pcal-lure-title
    desc: PCSP/PCAL police summons title
    crit: notable
    conf: 0.96
    if:
      type: value
      path: pdf.info.title
      regex: 'PCSP/PCAL'

  - id: pcsp-pcal-lure-text
    desc: PCSP/PCAL phishing lure text
    crit: component
    conf: 0.98
    if:
      type: text
      substr: "Liberação exclusiva mediante autenticação institucional"

  - id: pcsp-pcal-lure-target-real-pb
    desc: PCSP/PCAL lure target REAL P.B
    crit: component
    conf: 0.9
    if:
      type: text
      substr: "REAL P.B SOLUCOES E TECNOLOGIA LTDA"

  - id: pcsp-pcal-lure-target-lesley
    desc: PCSP/PCAL lure target Lesley Bezerra
    crit: component
    conf: 0.9
    if:
      type: text
      substr: "Lesley Bezerra"

composite_rules:
  - id: pcsp-pcal-phishing-lure
    desc: Brazilian Police (PCSP/PCAL) PDF Phishing Lure
    crit: hostile
    conf: 0.98
    all:
      - id: objectives/execution/interpreter/eval/document::pdf-uri-ip-phishing
      - id: micro-behaviors/communications/http/url/navigation::pdf-external-http-navigation
      - id: micro-behaviors/communications/http/url/navigation::pdf-http-external-ip-uri
    any:
      - id: pcsp-pcal-lure-title
      - id: pcsp-pcal-lure-metadata

  - id: pcsp-pcal-phishing-lure-text
    desc: PCSP/PCAL phishing lure text indicators
    crit: suspicious
    conf: 0.9
    any:
      - id: pcsp-pcal-lure-text
      - id: pcsp-pcal-lure-target-real-pb
      - id: pcsp-pcal-lure-target-lesley
