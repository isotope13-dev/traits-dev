# PDF link lures that imitate a failed file preview. The observable parts
# are the annotation/action structure, page padding, and service-shaped URL
# host, not the lure language.
defaults:
  crit: hostile
  platforms: [windows, macos, linux]
  for: [pdf]
  attack: T1566.002

composite_rules:
- id: pdf-file-service-preview-lure
  desc: PDF preview lure links to file-service host
  crit: hostile
  conf: 0.96
  all:
  - id: micro-behaviors/communications/url/navigation-http::pdf-external-http-navigation
  - id: metadata/document/pdf/action::pdf-five-or-more-pages
  - id: metadata/document/pdf/action::pdf-sparse-uri-pages
  - id: micro-behaviors/communications/url/host/label::file-service-label

- id: pdf-cloud-service-preview-lure
  desc: PDF preview lure links to cloud-service host
  crit: hostile
  conf: 0.97
  all:
  - id: micro-behaviors/communications/url/navigation-http::pdf-external-http-navigation
  - id: metadata/document/pdf/action::pdf-five-or-more-pages
  - id: metadata/document/pdf/action::pdf-sparse-uri-pages
  - id: micro-behaviors/communications/url/host/label::cloud-service-label-in-noncanonical-host
