# PDF link lures that imitate a failed file preview. The observable parts
# are the annotation/action structure, page padding, and service-shaped URL
# host, not the lure language.
defaults:
  platforms: [windows, macos, linux]
  for: [pdf]
  attack: T1566.002

composite_rules:
- id: pdf-external-link-annotation
  desc: PDF link annotation opens HTTP(S) URL
  crit: suspicious
  conf: 0.94
  all:
  - id: metadata/document/pdf/properties::pdf-link-annotation
  - id: metadata/document/pdf/properties::pdf-action-uri
  - id: metadata/document/pdf/properties::pdf-http-uri-action

- id: pdf-multi-page-sparse-link-lure
  desc: Multi-page PDF with sparse external link
  crit: suspicious
  conf: 0.93
  all:
  - id: pdf-external-link-annotation
  - id: metadata/document/pdf/properties::pdf-five-or-more-pages
  - id: metadata/document/pdf/properties::pdf-sparse-uri-pages

- id: pdf-file-service-preview-lure
  desc: PDF preview lure links to file-service host
  crit: hostile
  conf: 0.96
  all:
  - id: pdf-multi-page-sparse-link-lure
  - id: objectives/command-and-control/infrastructure/domain/brand-impersonation::file-service-label

- id: pdf-cloud-service-preview-lure
  desc: PDF preview lure links to cloud-service host
  crit: hostile
  conf: 0.97
  all:
  - id: pdf-multi-page-sparse-link-lure
  - id: objectives/command-and-control/infrastructure/domain/brand-impersonation::cloud-service-label-in-noncanonical-host
