# Credential solicitation pretexts, not generic mailbox or login vocabulary.
# Percent-u spelling is preserved by the facts URL decoder; match both forms.
defaults:
  platforms: [windows, unix]
  for: [html, makefile, text]
  crit: suspicious
  conf: 0.9

traits:
  - id: mailbox-upgrade-confirmation-pretext
    desc: Account confirmation for mailbox upgrade
    if:
      type: text
      regex: '(?i)confirm your account to upgrade your (mailbox|e-?mail)'
      exclude_html_comments: true
  - id: mailbox-shutdown-verification-pretext-cn
    desc: Chinese verify-to-prevent-email-closure lure
    if:
      type: text
      regex: '防止您的电子邮件关闭[^<]{0,80}验证'
  - id: mailbox-shutdown-verification-percent-u
    desc: Percent-u verify-to-prevent-email-closure lure
    if:
      type: text
      regex: '(?i)%u9632%u6B62[^;]{0,120}%u90AE%u4EF6%u5173%u95ED[^;]{0,80}%u9A8C%u8BC1'

composite_rules:
  - id: mailbox-verification-pretext
    desc: Mailbox upgrade or shutdown verification pretext
    any:
      - id: mailbox-upgrade-confirmation-pretext
      - id: mailbox-shutdown-verification-pretext-cn
      - id: mailbox-shutdown-verification-percent-u
  - id: mailbox-pretext-password-post
    desc: Mailbox upgrade or shutdown lure beside password POST
    crit: hostile
    conf: 0.96
    all:
      - id: mailbox-verification-pretext
      - id: micro-behaviors/ui/controls/credential::html-password-input-tag
      - id: micro-behaviors/communications/http/post::html-form-post-method
