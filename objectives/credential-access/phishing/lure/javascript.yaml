# Native-dialog session-expiry password lures. A legitimate app that needs a
# re-login navigates to a real sign-in page; phishing pages put the password
# request in the same string as the expiry claim and feed it to prompt().
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, html]
  attack: T1566.002
  mbc: B0030

traits:
  - id: session-expired-password-lure
    desc: Session-expired password prompt lure
    crit: suspicious
    conf: 0.92
    if:
      type: literal
      kind: string
      regex: '(?i)session.{0,40}expir.{0,80}password'
    unless:
      - id: metadata/package/testing/presence/harness::test-directory-path
      - id: well-known/tool/detection/
