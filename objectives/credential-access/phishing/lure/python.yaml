# Social media follower scam lure - Python
# Detects scripts posing as Instagram/social follower tools
defaults:
  crit: suspicious
  platforms: [windows, unix]
  for: [python]
  attack: T1204.002
traits:
  - id: follower-tool-lure
    desc: Social media follower tool lure text
    conf: 0.85
    if:
      type: string_literal
      regex: (?i)\bfollower(s)?\b.{0,24}\b(boost|free|hack)\b
    unless:
      - type: path
        regex: '(^|[!/])torch/distributed/rpc/api\.py$'
  - id: instagram-follower-promise
    # Require a promised follower benefit. Boosting an Instagram post is
    # ordinary advertising terminology and is not a follower-scam lure.
    desc: Instagram follower-scam lure text
    conf: 0.7
    if:
      type: string_literal
      regex: (?i)\binsta(gram)?\b.{0,24}\b(boost|hack|free)\b.{0,16}\bfollowers?\b
