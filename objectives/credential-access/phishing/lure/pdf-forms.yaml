defaults:
  platforms: [windows, macos, linux]
  for: [pdf]
composite_rules:
  # A Forms template link is legitimate on its own. Even producer metadata
  # and a missing signature can describe an unsigned draft. Require the
  # massive inert padding before calling their combination a lure signal.
  - id: padded-esignature-pdf-forms-template-lure
    desc: Padded unsigned eSignature PDF links to Forms template
    crit: suspicious
    conf: 0.97
    all:
      - id: metadata/document/pdf/properties::docusign-esignature-producer
      - id: micro-behaviors/communications/http/url/navigation::pdf-microsoft-forms-template-link
      - id: objectives/anti-static/obfuscation/string/junking::pdf-external-link-post-eof-hex-padding
    unless:
      - id: metadata/document/pdf/signature::pdf-signature-object
