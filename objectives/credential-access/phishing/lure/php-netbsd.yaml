defaults:
  platforms: [netbsd, unix]
  for: [php]
  attack: T1566

traits:
  - id: php-root-password-label
    desc: PHP root password label
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)(root|superuser)[^<\n]{0,40}(password|passwd)'

composite_rules:
  - id: php-root-password-form
    desc: PHP root password form
    crit: suspicious
    conf: 0.94
    all:
      - id: micro-behaviors/ui/window/password-field::password-input-field-script
    any:
      - id: php-root-password-label
      - id: micro-behaviors/ui/window/password-field::html-root-password-label
    near_lines: 60
