defaults:
  crit: hostile
  platforms: [windows, unix]
  for: [xml, html, pdf, rtf, text]

composite_rules:
  # The exact body signature above identifies the same questionnaire and mail
  # submission instructions that the text-level composite below proves from
  # decoded XML. Requiring the three-object wrapper keeps this bridge specific
  # to the distributed OOXML attachment profile.
  - id: award-scam-personal-data-harvest
    for: [xml]
    desc: Award scam solicits personal data by email
    conf: 0.99
    all:
      - id: objectives/evasion/decoy/document::unsolicited-award-scam-letter
      - id: micro-behaviors/ui/window/personal-data-field::personal-data-questionnaire
      - id: micro-behaviors/communications/email/send/direct::send-required-information-by-email
