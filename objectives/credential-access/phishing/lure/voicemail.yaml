# Fake voicemail notification lures. Large-scale email campaigns deliver SVG
# attachments (or standalone HTML pages) that render an "internal voicemail"
# card — notification phrase plus a play/listen call-to-action — while a hidden
# script redirects the browser or pulls a remote payload. The same pretext is
# reused across carriers, so the atoms match the notification UI itself, not
# any one campaign's strings.
#
# A genuine voicemail inbox is a server-rendered application surface, not a
# static SVG attachment; the phrase atom stays notable and the play CTA is a
# neutral label until the composite pairs them.
defaults:
  platforms: [windows, unix]
  for: [svg, html]
  attack: T1566.002
  mbc: B0030

traits:
  - id: voicemail-notification-phrase
    desc: Voicemail notification count phrase
    crit: notable
    conf: 0.88
    if:
      type: text
      regex: '(?i)\b(new|unread|missed)\s+(voicemails?|voice[\s_-]?mails?|voice[\s_-]?messages?)\b'

  - id: voicemail-play-cta
    desc: Play or listen action label in markup
    crit: notable
    conf: 0.85
    if:
      type: text
      regex: '(?i)>\s*(play|listen(\s+to)?)\b[^<>]{0,60}<'

composite_rules:
  - id: voicemail-notification-lure
    desc: Voicemail notification card with play call-to-action
    crit: suspicious
    conf: 0.94
    all:
      - id: voicemail-notification-phrase
      - id: voicemail-play-cta
    near_bytes: 2000

  # The attachment-campaign shape: the voicemail card is the graphic shell, the
  # inline script is the payload. No legitimate SVG asset ships a voicemail
  # inbox UI with scripted logic.
  - id: svg-voicemail-scripted-lure
    desc: SVG voicemail notification conceals inline script
    crit: hostile
    conf: 0.97
    for: [svg]
    attack: T1204.002,T1566.002
    all:
      - id: voicemail-notification-lure
      - id: micro-behaviors/data/format/html::inline-svg-script-body
    near_bytes: 2400
