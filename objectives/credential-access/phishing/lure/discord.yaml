defaults:
  platforms: [unix, windows]
  for: [python, whl]
  attack: T1566.002

traits:
  - id: python-discord-phishing-operation
    desc: Python Discord phishing operation
    crit: suspicious
    conf: 0.96
    for: [python]
    unless:
      # A Prowler check module is written in the shape of the control it audits.
      - id: well-known/tool/detection/prowler::scanner-check-corpus
      - id: well-known/app/system/anthropic-cybersecurity-skills::defensive-cybersecurity-skills-repository
    if:
      type: text
      regex: '(?is)\bclass\s+\w*Phish\w*\b[\s\S]{0,700}\b(phishing|impersonation)\b'

composite_rules:
  - id: discord-webhook-phishing-delivery
    desc: Discord webhook phishing delivery
    crit: hostile
    conf: 0.99
    scope: archive
    for: [whl]
    all:
      - id: python-discord-phishing-operation
      - id: micro-behaviors/communications/http/webhook::python-webhook-post
      - id: micro-behaviors/communications/http/webhook::discord-webhook-configuration
