defaults:
  platforms: [windows, unix]
  for: [html]
  conf: 0.97
traits:
  - id: parcel-recipient-email-password-demand
    desc: Demands email password for parcel recipientship
    crit: suspicious
    if:
      type: text
      exclude_html_comments: true
      regex: '(?is)email password.{0,100}prove.{0,80}recipient.{0,80}(package|parcel)'
composite_rules:
  - id: parcel-recipient-password-phishing
    desc: Parcel lure collects an email password
    crit: hostile
    all:
      - id: parcel-recipient-email-password-demand
      - id: micro-behaviors/ui/controls/credential::email-password-inputs
    near_bytes: 1500
