defaults:
  platforms: [windows, unix]
  for: [html]
composite_rules:
  - id: fragmented-document-password-harvest
    desc: Obfuscated confidential-file lure posts email and password
    crit: hostile
    conf: 0.99
    attack: T1056.003
    all:
      - id: objectives/anti-static/obfuscation/document/markup::fragmented-confidential-text
      - id: micro-behaviors/ui/controls/credential::email-password-inputs
      - id: micro-behaviors/communications/http/form::html-form-post-method
      - id: micro-behaviors/communications/http/request/html::html-form-external-action

  - id: split-array-onedrive-document-lure-stage
    for: [html, javascript]
    desc: Split-array stage loads OneDrive token JS
    crit: hostile
    conf: 0.99
    all:
      - id: micro-behaviors/ui/window/insert-html::split-https-scheme-array-join
      - id: micro-behaviors/ui/window/insert-html::split-array-cryptojs-cdn-url
      - id: micro-behaviors/ui/window/insert-html::split-array-mstoken-onedrive-lure
