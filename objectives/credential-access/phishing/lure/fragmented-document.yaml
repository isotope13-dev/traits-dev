defaults:
  platforms: [windows, unix]
  for: [html]
composite_rules:
  - id: fragmented-document-password-harvest
    desc: Obfuscated confidential-file lure posts email and password
    crit: hostile
    conf: 0.99
    attack: T1056.003
    all:
      - id: objectives/anti-static/obfuscation/document/markup::fragmented-confidential-text
      - id: micro-behaviors/ui/controls/credential::email-password-inputs
      - id: micro-behaviors/communications/http/post::html-form-post-method
      - id: micro-behaviors/communications/http/request/html::html-form-external-action
