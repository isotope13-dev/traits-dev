defaults:
  platforms: [windows, unix]
  for: [rtf]
  attack: T1566

traits:
  - id: rtf-atm-card-prize
    desc: Document discusses an ATM prize card
    crit: notable
    if:
      type: text
      regex: '(?i)\bATM\s+(visa\s+|master\s+)?card\b'
  - id: rtf-million-amount
    desc: Document references a million-scale amount
    crit: notable
    if:
      type: text
      regex: '(?i)\bmillion\b'
  - id: rtf-courier-delivery
    desc: Document discusses courier delivery
    crit: component
    if:
      type: text
      regex: '(?i)\bcourier\b'
  - id: rtf-send-contact-reconfirm
    desc: Document asks to send or confirm
    crit: component
    if:
      type: text
      regex: '(?i)\b(send|contact|reconfirm)\b'

composite_rules:
  - id: rtf-atm-courier-personal-data-lure
    desc: ATM prize courier lure requests personal details
    crit: hostile
    conf: 0.97
    all:
      - id: rtf-atm-card-prize
      - id: rtf-million-amount
      - id: rtf-courier-delivery
      - id: micro-behaviors/ui/window/personal-data-field::rtf-full-name
      - id: micro-behaviors/ui/window/personal-data-field::rtf-address
      - id: micro-behaviors/ui/window/personal-data-field::rtf-phone-number
      - id: rtf-send-contact-reconfirm
