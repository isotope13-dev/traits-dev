# The patterns here are AppleScript source fragments, but almost none of the
# malware that uses them ships a .scpt: the lure is handed to `osascript -e` as
# a string argument, so the carrier is whatever language spawned it. That is why
# shell/python/javascript/macho are already listed alongside applescript --
# swift and go are the same case and were missing. Both are mainstream for
# current macOS stealers (Atomic/AMOS and its clones), and a Swift file doing
#   Process().arguments = ["-e", "display dialog ... with hidden answer"]
# followed by a POST of the captured text scored *zero* traits before this.
#
# Measured over 34,604 .swift/.go/.ts/.rb/.m/.mm files under /usr/lib/go,
# /usr/share, /usr/lib, /usr/bin, /opt and the npm global tree: zero contain
# `with hidden answer`, and zero pair it with a password display-dialog, so the
# added carriers cost nothing in precision.
#
# The explicit list has since been replaced by groups: Rust joined the carrier
# set (AmnesiaStealer builds the same `display dialog ... with hidden answer`
# lure from Rust and hands it to `osascript -e`), which would have pushed the
# list past the 8-type limit. `scripts, source` covers every carrier language
# the lure has appeared in — including the typescript/ruby/objectivec cases
# this comment previously flagged as pending — and the macos platform filter
# drops the Windows-only script types automatically.
defaults:
  for: [scripts, source, macho]
  platforms:
    - macos
  attack: T1056.002
traits:
  - id: display-dialog-password
    desc: Display dialog asking for password
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: (?si)display dialog.{0,100}password
  - id: default-answer-password-dup
    desc: Default answer field for password
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: (?si)default answer.{0,100}password
  - id: icon-caution
    desc: Dialog with caution icon
    crit: component
    conf: 0.7
    if:
      type: text
      substr: with icon caution
  - id: icon-stop
    desc: Dialog with stop icon
    crit: component
    conf: 0.7
    if:
      type: text
      substr: with icon stop
  - id: title-system-preferences
    desc: Dialog title mimicking System Preferences
    crit: suspicious
    conf: 0.8
    if:
      type: text
      substr: with title "System Preferences"
  - id: enter-password-prompt
    desc: Prompts user to enter password
    crit: suspicious
    conf: 0.85
    for:
      - applescript
      - macho
      - shell
    if:
      type: text
      regex: (?i)(please\\s+)?enter(\\s+your)?\\s+password\\b
    downgrade:
      any:
        - id: metadata/import/ruby::highline
        - id: metadata/binary/vendor/
        - id: metadata/signed/platform::apple
  - id: shell-password-prompt-to-file
    desc: Shell prints password prompt to file
    crit: suspicious
    conf: 0.93
    for: [shell]
    if:
      type: text
      regex: '(?i)\b(printf|echo)\b[^\r\n|]{0,100}\bpassword\b[^\r\n|]{0,100}\|\s*tee\s+\S+'
  - id: enter-admin-password-prompt
    desc: Prompts user to enter admin password
    crit: suspicious
    conf: 0.85
    for:
      - applescript
      - macho
      - shell
    if:
      type: text
      regex: (?i)enter(\\s+your)?\\s+admin\\s+password\\b
    downgrade:
      any:
        - id: metadata/import/ruby::highline
        - id: metadata/binary/vendor/
        - id: metadata/signed/platform::apple
  - id: enter-system-password-prompt
    desc: Prompts user to enter system password
    crit: suspicious
    conf: 0.85
    for:
      - applescript
      - macho
      - shell
    if:
      type: text
      regex: (?i)enter(\\s+your)?\\s+system\\s+password\\b
    downgrade:
      any:
        - id: metadata/import/ruby::highline
        - id: metadata/binary/vendor/
        - id: metadata/signed/platform::apple
  - id: enter-login-password-prompt
    desc: Prompts user to enter login password
    crit: suspicious
    conf: 0.85
    for:
      - applescript
      - macho
      - shell
    if:
      type: text
      regex: (?i)enter(\\s+your)?\\s+login\\s+password\\b
    downgrade:
      any:
        - id: metadata/import/ruby::highline
        - id: metadata/binary/vendor/
        - id: metadata/signed/platform::apple
  - id: enter-account-password-prompt
    desc: Prompts user to enter account password
    crit: suspicious
    conf: 0.85
    for:
      - applescript
      - macho
      - shell
    if:
      type: text
      regex: (?i)enter(\\s+your)?\\s+account\\s+password\\b
    downgrade:
      any:
        - id: metadata/import/ruby::highline
        - id: metadata/binary/vendor/
        - id: metadata/signed/platform::apple
  - id: enter-keychain-password-prompt
    desc: Prompts user to enter keychain password
    crit: suspicious
    conf: 0.85
    for:
      - applescript
      - macho
      - shell
    if:
      type: text
      regex: (?i)enter(\\s+your)?\\s+keychain\\s+password\\b
    downgrade:
      any:
        - id: metadata/import/ruby::highline
        - id: metadata/binary/vendor/
        - id: metadata/signed/platform::apple
  - id: admin-password-dup
    desc: Admin password phrase
    crit: component
    conf: 0.85
    for:
      - applescript
      - shell
    if:
      type: text
      regex: (?i)\badmin(istrator)?\s+password\b
    unless:
      - type: text
        regex: (?i)admin password required to install
      - id: metadata/file/format/structured::sourcemap-sources-content
      - id: metadata/lang/javascript-features::sourcemap-sources-content
      # Provisioning/status output ("Admin user: X (password set: yes)") is not a
      # credential prompt — a lure asks for the password, it doesn't report one was
      # set/configured. `unless:` (scope-level) is required here; a `not:` only
      # filters the trait's own regex match, which ends at "password".
      - type: text
        regex: (?i)password\s+(set|configured)
      - id: admin-password-form-fixture-marker
  - id: admin-password-form-fixture-marker
    desc: Admin email password form fixture marker
    crit: baseline
    conf: 0.9
    if:
      type: text
      regex: (?is)admin@[A-Za-z0-9._%+-]+\.[A-Za-z]{2,}.{0,80}password
  - id: dumped-login-passphrase-file
    desc: Writes harvested password to ~/.passphrase
    crit: suspicious
    conf: 0.96
    attack: T1555.001
    if:
      type: text
      regex: '(?i)(~|\$HOME|\$\{HOME\})/\.passphrase\b'
  - id: hidden-answer
    desc: AppleScript hidden answer (password masking)
    crit: notable
    conf: 0.9
    if:
      type: text
      substr: with hidden answer
    unless:
      - id: well-known/tool/detection/security-scanner-identity::apple-xprotectd-scanner-context
      - id: well-known/tool/detection/cleave::cleave-static-analysis-context
  - id: applescript-pdf-export-password-prompt
    desc: AppleScript PDF export password prompt
    crit: baseline
    conf: 0.95
    if:
      type: text
      regex: (?i)password for the PDF
composite_rules:
  - id: password-prompt-pattern
    desc: Password dialog prompt
    crit: notable
    conf: 0.8
    any:
      - id: display-dialog-password
      - id: objectives/credential-access/phishing/lure::default-answer-password-dup
      - id: enter-password-prompt
      - id: enter-admin-password-prompt
      - id: enter-system-password-prompt
      - id: enter-login-password-prompt
      - id: enter-account-password-prompt
      - id: enter-keychain-password-prompt
    downgrade:
      any:
        - id: metadata/import/ruby::highline
  - id: fake-dialog-ui
    desc: Fake dialog UI element
    crit: component
    conf: 0.7
    any:
      - id: hidden-answer
      - id: icon-caution
      - id: icon-stop
      - id: title-system-preferences
  - id: system-cred-prompt
    desc: System credential prompt
    crit: suspicious
    conf: 0.85
    any:
      - id: enter-keychain-password-prompt
      - id: objectives/credential-access/phishing/lure::admin-password-dup
  - id: password-phishing-comp
    desc: AppleScript password phishing dialog
    crit: suspicious
    conf: 0.95
    unless:
      - id: metadata/file/string/identity/
      - id: applescript-pdf-export-password-prompt
      # Omnius uses an obscured AppleScript dialog as a temporary askpass
      # helper for an authenticated administrator update. Its bundled runtime
      # context is an explicit benign exception to this generic lure pattern.
      - id: well-known/app/ai/omnius::bundled-runtime-context
    all:
      - id: password-prompt-pattern
      - id: fake-dialog-ui
  - id: fake-system-prompt
    desc: Fake system password prompt
    crit: suspicious
    conf: 0.9
    all:
      - id: system-cred-prompt
      - id: fake-dialog-ui
  - id: phished-password-passphrase-dump
    desc: Phished password written to ~/.passphrase
    crit: hostile
    conf: 0.98
    attack: T1056.002,T1555
    all:
      - id: dumped-login-passphrase-file
      - id: hidden-answer
      - id: objectives/credential-access/validation/check::dscl-authonly-comp
