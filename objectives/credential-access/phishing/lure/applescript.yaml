# Phishing combinations; ordinary dialog observations live under ui/dialog.
defaults:
  for: [scripts, source, macho]
  platforms:
    - macos
  attack: T1056.002
composite_rules:
  - id: password-phishing-comp
    desc: AppleScript password phishing dialog
    crit: suspicious
    conf: 0.95
    unless:
      - id: metadata/file/string/identity::applescript-hidden-entry-snippet
      - id: micro-behaviors/ui/dialog/prompt::applescript-pdf-export-password-prompt
      # Omnius uses an obscured AppleScript dialog as a temporary askpass
      # helper for an authenticated administrator update. Its bundled runtime
      # context is an explicit benign exception to this generic lure pattern.
      - id: well-known/app/ai/coding-agent/omnius::bundled-runtime-context
    all:
      - id: micro-behaviors/ui/dialog/prompt::password-prompt-pattern
      - id: micro-behaviors/ui/dialog/apple::dialog-customization-options
    any:
      - id: micro-behaviors/ui/dialog/prompt::compatibility-password-message
      - id: micro-behaviors/ui/dialog/title::applescript-system-preferences-title
      - id: micro-behaviors/os/security/auth/verify::dscl-password-verification
  - id: fake-system-prompt
    desc: Fake system password prompt
    crit: suspicious
    conf: 0.9
    all:
      - id: micro-behaviors/ui/dialog/prompt::system-cred-prompt
      - id: micro-behaviors/ui/dialog/apple::dialog-customization-options
    any:
      - id: micro-behaviors/ui/dialog/prompt::compatibility-password-message
      - id: micro-behaviors/ui/dialog/title::applescript-system-preferences-title
      - id: micro-behaviors/os/security/auth/verify::dscl-password-verification
  - id: phished-password-passphrase-dump
    desc: Phished password written to ~/.passphrase
    crit: hostile
    conf: 0.98
    attack: T1056.002,T1555
    all:
      - id: micro-behaviors/fs/path/password-store::hidden-passphrase-file
      - id: micro-behaviors/ui/dialog/apple::hidden-answer
      - id: micro-behaviors/os/security/auth/verify::dscl-password-verification

  - id: applescript-phish-tcc-reset
    desc: Password phish then resets all TCC grants
    crit: hostile
    conf: 0.96
    attack: T1056.002,T1562.001
    for: [applescript]
    all:
      - id: password-phishing-comp
      - id: micro-behaviors/os/security/policy::tccutil-reset-all
  - id: compiled-osascript-browser-login-theft
    desc: Password prompt with browser login query
    crit: hostile
    conf: 0.97
    attack: T1056.002,T1555.003
    for: [macho]
    scope: file
    all:
      - id: micro-behaviors/ui/dialog/apple::compiled-osascript-password-prompt
      - id: micro-behaviors/data/db/access::chromium-login-sql
