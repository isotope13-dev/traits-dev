# Fake macOS password dialogs an AppleScript stealer shows to get the login
# keychain password. The prompt is the lure; what it unlocks is elsewhere.
defaults:
  platforms: [macos]
  for: [applescript, shell]
  attack: T1005
  mbc: B0028
traits:
- id: protection-service-title
  desc: Fake macOS Protection Service title
  crit: suspicious
  conf: 0.95
  attack: T1056.002
  if:
    type: text
    substr: macOS Protection Service
- id: device-password-authorize-prompt
  desc: Device password authorization lure
  crit: suspicious
  conf: 0.95
  attack: T1056.002
  if:
    type: text
    substr: Input device password to authorize your access
- id: macos-wants-change-prompt
  desc: Fake macOS change password prompt
  crit: suspicious
  conf: 0.95
  attack: T1056.002
  if:
    type: text
    substr: macOS wants to make changes
- id: macos-dialog-title
  desc: Dialog title mimicking macOS
  crit: suspicious
  conf: 0.85
  attack: T1056.002
  if:
    type: text
    substr: with title "macOS"
- id: password-prompt-wording-fragment
  desc: Generic password prompt wording fragment
  crit: notable
  conf: 0.9
  attack: T1056.002
  unless:
  - id: metadata/file/string/identity/
  - id: well-known/app/infrastructure/pihole::pihole-artifact
  if:
    type: text
    regex: '(?i)(provide|enter|input) your (\w{1,10} )?password'
composite_rules:
  # The five prompts above are one lure wearing different wording, so callers
  # want "a fake macOS password dialog", not a five-way `any:` repeated at every
  # call site. A directory reference would be wrong here -- it would accept any
  # lure in this directory, not specifically the macOS password prompt.
  - id: macos-password-prompt
    desc: Fake macOS password dialog
    crit: notable
    conf: 0.9
    any:
      - id: protection-service-title
      - id: device-password-authorize-prompt
      - id: macos-wants-change-prompt
      - id: macos-dialog-title
      - id: password-prompt-wording-fragment
