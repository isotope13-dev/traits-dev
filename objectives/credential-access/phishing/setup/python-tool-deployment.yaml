defaults:
  for:
  - python
  platforms:
  - unix
  - windows
composite_rules:
- id: python-socialfish-install-launch
  desc: Python shell calls install and launch a phishing framework
  crit: hostile
  conf: 0.98
  all:
  - id: well-known/tool/offensive/framework/socialfish::python-socialfish-install
  - id: well-known/tool/offensive/framework/socialfish::python-socialfish-launch
  unless:
  - id: metadata/lang/source/shape::python-literal-module-quoted-source
