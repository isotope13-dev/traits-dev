defaults:
  for: [ne]
  platforms: [windows]
  attack: T1566

traits:
  - id: aol-staff-impersonation-lure
    desc: Impersonates AOL staff department in lure
    crit: notable
    conf: 0.92
    if:
      type: text
      case_insensitive: true
      regex: 'America Online (Member Information|Billing) Department'

  # "I am with AOL System Security" style intro: a second staff-claim form.
  # The bounded gap admits department names such as "User Resource Department".
  # Split by the trailing department word to stay under the regex byte cap.
  - id: aol-staff-intro-lure
    desc: Claims AOL billing or security staff
    crit: notable
    conf: 0.92
    if:
      type: text
      case_insensitive: true
      regex: 'I am with (the )?(America Online|AOL) [A-Za-z ]{0,30}(Billing|Security|Staff)'

  - id: aol-staff-intro-dept-lure
    desc: Claims AOL department, group, or resource staff
    crit: notable
    conf: 0.92
    if:
      type: text
      case_insensitive: true
      regex: 'I am with (the )?(America Online|AOL) [A-Za-z ]{0,30}(Department|Group|Resource)'

  # "I am an America Online Billing Representative" and "I am with AOL's
  # Virus Protection Group": the staff claim uses a possessive or an article,
  # so the department word follows a short gap rather than a fixed phrase.
  - id: aol-staff-billing-virus-intro
    desc: Claims AOL billing or virus-protection staff
    crit: notable
    conf: 0.9
    if:
      type: text
      case_insensitive: true
      regex: 'am (an? |with )?(America Online|AOL)\S{0,3} ?(Billing|Virus Protection)'

  - id: aol-respond-password-lure
    desc: Lure requests password or credit card
    crit: notable
    conf: 0.92
    if:
      type: text
      case_insensitive: true
      regex: 'click the respond button.{0,60}(password|credit card)'

  # Lures that say a password or card was lost, not only "click respond".
  - id: aol-lost-credential-lure
    desc: Lure says password or card was lost
    crit: notable
    conf: 0.92
    if:
      type: text
      case_insensitive: true
      regex: '(lost|failed to rec[ie]{2}ve) your [a-z ]{0,16}(password|account information|credit card)'

  # A fake "account upgrade" program tells the member that a one-time upgrade
  # needs a request. The upgrade wording is the pretext; the form is the leg
  # below it, since real AOL utilities can name the upgrader too.
  - id: aol-account-upgrade-lure
    desc: Fake AOL account-upgrade lure text
    crit: notable
    conf: 0.9
    if:
      type: text
      case_insensitive: true
      regex: 'account upgrade (request|welcomes)|once in\s+a lifetime upgrade|account upgrader'

composite_rules:
  - id: win16-aol-account-upgrade-form
    desc: Fake AOL account upgrade asks for screen name
    crit: hostile
    conf: 0.93
    all:
      - id: aol-account-upgrade-lure
      - id: objectives/credential-access/phishing/prompt::aol-signon-screen-name-label

  - id: aol-staff-impersonation-any
    desc: Impersonates AOL staff department in lure
    crit: notable
    conf: 0.92
    any:
      - id: aol-staff-impersonation-lure
      - id: aol-staff-intro-lure
      - id: aol-staff-intro-dept-lure
      - id: aol-staff-billing-virus-intro

  - id: aol-credential-request-lure
    desc: Lure requests password or credit card
    crit: notable
    conf: 0.92
    any:
      - id: aol-respond-password-lure
      - id: aol-lost-credential-lure

  - id: win16-aol-staff-phishing-lure
    desc: Win16 AOL tool embeds staff-impersonation phishing lures
    crit: hostile
    conf: 0.95
    all:
      - id: aol-staff-impersonation-any
      - id: aol-credential-request-lure
