# Win16 AOL sign-on password capture label. A fake sign-on form labels its
# password box "pw(s):" and keeps it in a PWEDIT-style edit control. The label
# alone is not hostile, so it is a component leg of the AOL mail-exfil rule.
defaults:
  for: [ne]
  platforms: [windows]
  attack: T1566

traits:
  - id: win16-aol-signon-password-label
    desc: Sign-on form labels a password box pw(s)
    crit: component
    conf: 0.9
    # Six-character NE literal: the text view drops it, so match raw bytes.
    if:
      type: raw
      case_insensitive: true
      regex: 'pw\(s\):'
