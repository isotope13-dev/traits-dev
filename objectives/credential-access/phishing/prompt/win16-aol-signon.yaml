# Win16 AOL sign-on password capture label. A fake sign-on form labels its
# password box "pw(s):" and keeps it in a PWEDIT-style edit control. The label
# alone is not hostile, so it is a component leg of the AOL mail-exfil rule.
defaults:
  for: [ne]
  platforms: [windows]
  attack: T1566

traits:
  - id: win16-aol-signon-password-label
    desc: Sign-on form labels a password box pw(s)
    crit: component
    conf: 0.9
    # Six-character NE literal: the text view drops it, so match raw bytes.
    if:
      type: raw
      case_insensitive: true
      regex: 'pw\(s\):'

  # The AOL sign-on box labels, as a fake form draws them. Real AOL utilities
  # can carry the same labels, so the form needs a password lure as well.
  - id: aol-signon-screen-name-label
    desc: Sign-on form labels a Screen Name box
    crit: notable
    conf: 0.85
    if:
      type: text
      case_insensitive: true
      substr: 'screen name:'

  - id: aol-signon-password-label
    desc: Sign-on form labels a Password box
    crit: notable
    conf: 0.85
    if:
      type: text
      case_insensitive: true
      substr: 'password:'

  # AOL's sign-on reset text. Two Win16 AOL bots carry the same message, so
  # the text is generic; it resets sign-on to a NewUser screen name.
  - id: aol-newuser-reset-text
    desc: Resets AOL sign-on to NewUser state
    crit: notable
    conf: 0.9
    if:
      type: text
      case_insensitive: true
      substr: 'is already reset to NewUser'

composite_rules:
  - id: win16-aol-fake-signon-form
    desc: Win16 fake AOL sign-on form with a password lure
    crit: hostile
    conf: 0.93
    all:
      - id: aol-signon-screen-name-label
      - id: aol-signon-password-label
      - id: objectives/credential-access/phishing/prompt::aol-credential-request-lure
