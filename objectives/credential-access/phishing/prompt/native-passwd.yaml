defaults:
  for: [elf]
  platforms: [linux]
composite_rules:
  - id: trojan-passwd-http-query
    desc: Unix passwd impersonation with password-bearing HTTP requests
    crit: hostile
    conf: 0.98
    attack: T1056.001,T1041
    all:
      - id: micro-behaviors/ui/terminal::unix-current-password-prompt
      - id: micro-behaviors/ui/terminal::unix-passwd-success-message
      - id: micro-behaviors/communications/url/query/credential::native-pass-query-format
      - id: micro-behaviors/communications/http/request/get::native-get-request-format
