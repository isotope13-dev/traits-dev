# Win16 AOL billing-card phishing: a fake "billing information" form asks the
# user for card, bank, and expiry fields. The lure and the field labels are
# generic to this pretext, so copycats reuse them; the specimen's own form
# names stay in the family rule.
defaults:
  for: [ne]
  platforms: [windows]
  attack: T1566

traits:
  - id: win16-billing-problem-lure
    desc: Lure says billing information has a problem
    crit: notable
    conf: 0.93
    if:
      type: text
      case_insensitive: true
      substr: problems with your billing information

  # Each payment field label is an atom. One label alone is common in ordinary
  # software, so the composite below requires three distinct labels.
  - id: win16-card-number-label
    desc: Card field label
    crit: component
    conf: 0.92
    if:
      type: text
      case_insensitive: true
      substr: 'card:'

  - id: win16-expiration-label
    desc: Expiration field label
    crit: component
    conf: 0.92
    if:
      type: text
      case_insensitive: true
      regex: 'expiration( date)?:'

  - id: win16-bank-name-label
    desc: Bank name field label
    crit: component
    conf: 0.92
    if:
      type: text
      case_insensitive: true
      substr: 'bank name:'

  - id: win16-zip-label
    desc: Zip field label
    crit: component
    conf: 0.92
    if:
      type: text
      case_insensitive: true
      substr: 'zip:'

  # Password or screen-name entry field on the same form. "Enter your password"
  # alone is common in ordinary programs, so this is only a component leg.
  - id: win16-aol-password-prompt
    desc: AOL form requests password or screen name
    crit: component
    conf: 0.92
    if:
      type: text
      case_insensitive: true
      regex: 'enter your password|screen ?name: ?'

composite_rules:
  # Payment form: three of the four field labels together.
  - id: win16-card-form-labels
    desc: Payment form field labels (card, expiry, bank)
    crit: notable
    conf: 0.92
    any:
      - id: win16-card-number-label
      - id: win16-expiration-label
      - id: win16-bank-name-label
      - id: win16-zip-label
    needs: 3

  - id: win16-aol-billing-card-phish
    desc: Win16 fake AOL billing form collects card and password
    crit: hostile
    conf: 0.96
    all:
      - id: win16-billing-problem-lure
      - id: win16-card-form-labels
      - id: win16-aol-password-prompt
