# Win16 AOL billing-card phishing: a fake "billing information" form asks the
# user for card, bank, and expiry fields. The lure and the field labels are
# generic to this pretext, so copycats reuse them; the specimen's own form
# names stay in the family rule.
defaults:
  for: [ne]
  platforms: [windows]
  attack: T1566

traits:
  # "problems with your Account's Billing information" is the common wording;
  # the apostrophe-s form appears in the Sexy pretext.
  - id: win16-billing-problem-lure
    desc: Lure says billing information has a problem
    crit: notable
    conf: 0.93
    if:
      type: text
      case_insensitive: true
      regex: 'problems with your (account''?s )?billing information'

  # Each payment field label is an atom. One label alone is common in ordinary
  # software, so the composite below requires three distinct labels.
  - id: win16-card-number-label
    desc: Card field label
    crit: component
    conf: 0.92
    if:
      type: text
      case_insensitive: true
      substr: 'card:'

  - id: win16-expiration-label
    desc: Expiration field label
    crit: component
    conf: 0.92
    if:
      type: text
      case_insensitive: true
      regex: 'expiration( date)?:'

  - id: win16-bank-name-label
    desc: Bank name field label
    crit: component
    conf: 0.92
    if:
      type: text
      case_insensitive: true
      substr: 'bank name:'

  - id: win16-zip-label
    desc: Zip field label
    crit: component
    conf: 0.92
    if:
      type: text
      case_insensitive: true
      substr: 'zip:'

  # Password or screen-name entry field on the same form. "Enter your password"
  # alone is common in ordinary programs, so this is only a component leg.
  - id: win16-aol-password-prompt
    desc: AOL form requests password or screen name
    crit: component
    conf: 0.92
    if:
      type: text
      case_insensitive: true
      regex: 'enter your password|screen ?name: ?'

  # Billing-update wording that names the card on file or the billing change.
  - id: win16-billing-update-lure
    desc: Lure asks user to update billing details
    crit: notable
    conf: 0.9
    if:
      type: text
      case_insensitive: true
      # "card information on file" also matches inside "credit card information on file".
      regex: 'card information on file|update your billing information|before making billing changes'

  # Asks the user to verify the account password before a billing change.
  - id: win16-password-verify-text
    desc: Form asks user to verify account password
    crit: notable
    conf: 0.9
    if:
      type: text
      case_insensitive: true
      regex: 'verify your (current )?password'

composite_rules:
  # Payment form: three of the four field labels together.
  - id: win16-card-form-labels
    desc: Payment form field labels (card, expiry, bank)
    crit: notable
    conf: 0.92
    any:
      - id: win16-card-number-label
      - id: win16-expiration-label
      - id: win16-bank-name-label
      - id: win16-zip-label
    needs: 3

  - id: win16-aol-billing-card-phish
    desc: Win16 fake AOL billing form collects card and password
    crit: hostile
    conf: 0.96
    all:
      - id: win16-billing-problem-lure
      - id: win16-card-form-labels
      - id: win16-aol-password-prompt

  # A password-only billing update: the form asks for the password to confirm
  # billing changes and has no card labels. The lure names the card on file.
  - id: win16-aol-billing-password-phish
    desc: Win16 fake AOL billing update asks for the password
    crit: hostile
    conf: 0.94
    all:
      - id: win16-billing-update-lure
      - id: win16-password-verify-text
      - id: win16-aol-password-prompt
