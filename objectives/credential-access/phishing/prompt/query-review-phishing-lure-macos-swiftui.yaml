defaults:
  platforms:
  - macos
  for:
  - macho
  - swift
  - objc
  attack: T1056.002

traits:
  - id: app-authentication-password-prompt
    desc: Password authorization prompt text
    crit: component
    conf: 0.94
    if:
      type: text
      substr: Enter your password to allow this.
  - id: app-authentication-lure
    desc: App authentication prompt text
    crit: component
    conf: 0.9
    if:
      type: text
      substr: is trying to authenticate
  - id: fake-update-success
    desc: Update completion message text
    crit: component
    conf: 0.88
    if:
      type: text
      substr: Update Completed


composite_rules:
  - id: macos-password-phishing-prompt
    desc: Native password prompt with auth wording
    crit: notable
    conf: 0.98
    all:
      - id: micro-behaviors/ui/window/password-field::macos-secure-text-field-control
      - id: objectives/credential-access/phishing/prompt::app-authentication-password-prompt
    any:
      - id: objectives/credential-access/phishing/prompt::app-authentication-lure
      - id: objectives/credential-access/phishing/prompt::fake-update-success
  - id: macos-fake-update-password-phish
    desc: Password prompt with update message
    crit: notable
    conf: 0.98
    all:
      - id: objectives/credential-access/phishing/prompt::macos-password-phishing-prompt
      - id: objectives/credential-access/phishing/prompt::fake-update-success
