# Win16 AOL phishing: a fake upgrade form demands the screen name and password
# while threatening the user with deletion or harm if they comply slowly.
defaults:
  for: [ne]
  platforms: [windows]
  attack: T1566

traits:
  - id: aol-password-demand-text
    desc: Demands AOL screen name and password
    crit: notable
    conf: 0.93
    if:
      type: text
      case_insensitive: true
      substr: 'send your screen name and password'

  - id: password-coercion-threat-text
    desc: Threatens deletion or harm to force disclosure
    crit: notable
    conf: 0.92
    if:
      type: text
      case_insensitive: true
      regex: 'hunted down and destroy|delete your hole comp'

composite_rules:
  - id: win16-aol-password-coercion
    desc: Win16 prompt coerces AOL password under threat
    crit: hostile
    conf: 0.96
    all:
      - id: aol-password-demand-text
      - id: password-coercion-threat-text
