defaults:
  for: [pe]
  platforms: [windows]
  attack: T1566

traits:
  - id: aol-password-card-billing-prompt
    desc: AOL billing prompt requests password and card
    crit: hostile
    conf: 0.99
    if:
      type: yara
      source: |
        rule aol_password_card_billing_prompt {
          strings:
            $aol = "America Online Staff will never ask" ascii nocase
            $password = "enter your Screen Name and password" ascii nocase
            $card = "Credit Card Number" ascii nocase
            $expiry = "Expiration Date" ascii nocase
            $billing = "Billing Information" ascii nocase
          condition:
            uint16(0) == 0x5a4d and all of them
        }
