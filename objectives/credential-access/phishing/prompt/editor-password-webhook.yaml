# An editor extension that opens a masked input box asking for an account
# password in a module carrying a hard-coded chat webhook. Extensions that
# need a sign-in use the editor's authentication provider and never see the
# password; a hard-coded webhook is a drop box, not an integration the user
# configured.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  attack: T1056.002,T1567
composite_rules:
  - id: editor-password-prompt-chat-webhook
    desc: Editor masked password prompt beside a hard-coded chat webhook
    crit: hostile
    conf: 0.93
    all:
      - id: micro-behaviors/ui/controls/credential::vscode-masked-input-box
      - id: micro-behaviors/ui/dialog/prompt::enter-password-prompt
    any:
      - id: micro-behaviors/communications/http/webhook::discord-webhook-api
      - id: micro-behaviors/communications/http/webhook::discord-webhook-short-id-url
