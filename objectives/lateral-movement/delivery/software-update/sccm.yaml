# Abuse of Configuration Manager application deployment is distinguishable from
# ordinary WMI process creation by the SMS Provider objects it authors.  The
# application digest supplies the command, SMS_ApplicationAssignment scopes and
# forces delivery, and offensive implementations commonly hide the application
# from the console and delete both objects after the client checks in.  Match
# those protocol/object fields so ports of the technique remain visible.
defaults:
  platforms: [windows, unix]
  for: [source, scripts, binaries, -swift, -objectivec, -groovy, -scala, -elixir]
  attack: T1072

traits:
  - id: sccm-application-object-write
    desc: Authors an SCCM SMS_Application WMI object
    crit: notable
    conf: 0.92
    if:
      type: text
      regex: '(?is)\bSMS_Application\b.{0,400}\b(SDMPackageXML|CreateInstance)\b'

  - id: sccm-application-assignment-class
    desc: References SCCM application assignment class
    crit: notable
    conf: 0.98
    if:
      type: text
      word: SMS_ApplicationAssignment

  - id: sccm-target-collection-field
    desc: References SCCM target collection field
    crit: notable
    conf: 0.96
    if:
      type: text
      word: TargetCollectionID

  - id: sccm-app-management-digest
    desc: Contains SCCM application management digest
    crit: notable
    conf: 0.98
    if:
      type: text
      substr: <AppMgmtDigest

  - id: sccm-script-deployment-technology
    desc: Selects SCCM script deployment technology
    crit: notable
    conf: 0.99
    if:
      type: text
      substr: <DeploymentTechnology>GLOBAL/ScriptDeploymentTechnology</DeploymentTechnology>

  - id: sccm-install-command-field
    desc: References SCCM install command field
    crit: notable
    conf: 0.96
    if:
      type: text
      substr: <InstallCommandLine>

  - id: sccm-hidden-application-object
    desc: Hides SCCM application from management console
    crit: suspicious
    conf: 0.96
    if:
      type: text
      regex: '(?is)\bSMS_Application\b.{0,600}\bIsHidden\b.{0,80}(=|:|>)\s*(true|1)\b'

  - id: sccm-enforcement-deadline-field
    desc: References SCCM enforcement deadline field
    crit: notable
    conf: 0.96
    if:
      type: text
      word: EnforcementDeadline

  - id: sccm-service-window-override-enabled
    desc: Enables SCCM service window override
    crit: notable
    conf: 0.98
    if:
      type: text
      regex: '(?is)\bOverrideServiceWindows\b.{0,80}(=|:|>)\s*(true|1)\b'

  - id: sccm-user-notification-disabled
    desc: Disables SCCM assignment user notifications
    crit: notable
    conf: 0.97
    if:
      type: text
      regex: '(?is)\bNotifyUser\b.{0,80}(=|:|>)\s*(false|0)\b'

  - id: sccm-user-ui-disabled
    desc: Disables SCCM assignment user interface
    crit: notable
    conf: 0.97
    if:
      type: text
      regex: '(?is)\bUserUIExperience\b.{0,80}(=|:|>)\s*(false|0)\b'

  - id: sccm-application-assignment-delete
    desc: Deletes SCCM application assignment via WMI
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?is)\bSMS_ApplicationAssignment\b.{0,1000}\.Delete\s*\('

  - id: sccm-application-object-expire
    desc: Expires SCCM application object via WMI
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?is)\bSMS_Application\b.{0,999}\bSetIsExpired\b'

  - id: sccm-application-object-remove
    desc: Deletes SCCM application object via WMI
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?is)\bSMS_Application\b.{0,999}\.Delete\s*\('

composite_rules:
  - id: sccm-application-assignment-write
    desc: Authors SCCM assignment for target collection
    crit: notable
    conf: 0.94
    all:
      - id: sccm-application-assignment-class
      - id: sccm-target-collection-field
    near_bytes: 1400

  - id: sccm-script-application-command-digest
    desc: Defines SCCM script application install command
    crit: notable
    conf: 0.92
    all:
      - id: sccm-app-management-digest
      - id: sccm-script-deployment-technology
      - id: sccm-install-command-field
    near_bytes: 3800

  - id: sccm-assignment-forces-service-window-override
    desc: Overrides SCCM assignment service windows
    crit: suspicious
    conf: 0.95
    all:
      - id: sccm-application-assignment-class
      - id: sccm-enforcement-deadline-field
      - id: sccm-service-window-override-enabled
    near_bytes: 2300

  - id: sccm-assignment-suppresses-user-ui
    desc: Disables SCCM assignment notifications and UI
    crit: notable
    conf: 0.94
    all:
      - id: sccm-application-assignment-class
      - id: sccm-user-notification-disabled
      - id: sccm-user-ui-disabled
    near_bytes: 2300

  - id: sccm-application-object-delete
    desc: Expires or deletes SCCM application via WMI
    crit: notable
    conf: 0.9
    any:
      - id: sccm-application-object-expire
      - id: sccm-application-object-remove

  - id: sccm-concealed-command-application
    desc: Authors hidden command-running SCCM application
    crit: suspicious
    conf: 0.97
    all:
      - id: sccm-application-object-write
      - id: sccm-script-application-command-digest
      - id: sccm-hidden-application-object

  - id: sccm-forced-quiet-application-assignment
    desc: Forces quiet SCCM application assignment
    crit: suspicious
    conf: 0.97
    all:
      - id: sccm-application-assignment-write
      - id: sccm-assignment-forces-service-window-override
      - id: sccm-assignment-suppresses-user-ui

  - id: sccm-concealed-forced-command-deployment
    desc: Pushes concealed command through SCCM
    crit: suspicious
    conf: 0.98
    all:
      - id: sccm-concealed-command-application
      - id: sccm-forced-quiet-application-assignment

  - id: sccm-ephemeral-concealed-deployment
    desc: Removes concealed SCCM command deployment
    crit: hostile
    conf: 0.98
    all:
      - id: sccm-concealed-forced-command-deployment
      - id: sccm-application-assignment-delete
      - id: sccm-application-object-delete

  - id: sccm-encoded-powershell-deployment
    desc: Deploys hidden encoded PowerShell through SCCM
    crit: hostile
    conf: 0.99
    all:
      - id: sccm-concealed-forced-command-deployment
      - id: objectives/command-and-control/dropper/delivery/download-execute::powershell-hidden-bypass-encoded-command
