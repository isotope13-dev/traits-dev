# Remote service execution is a delivery mechanism when the service command
# also retrieves a payload.  This covers the remote sc.exe + curl pattern from
# the linked report without depending on its host, service name, or filename.
defaults:
  platforms: [windows]
  for: [batch, powershell, csharp]
  attack: T1021.002,T1105,T1569.002
  mbc: B0024

composite_rules:
  - id: remote-service-download-deployment
    desc: Remote service downloads a payload
    crit: hostile
    conf: 0.96
    all:
      - id: micro-behaviors/os/service/control::sc-remote-create-command
      - id: micro-behaviors/communications/http/download/curl::curl-output-file
    near_lines: 1
