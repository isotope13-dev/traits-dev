defaults:
  platforms: [windows]
  for: [powershell, batch, scripts, pe]
  attack: "T1484.001"
traits:
  - id: new-gpo-cmdlet
    desc: Creates new Group Policy
    crit: suspicious
    conf: 0.85
    if:
      type: text
      substr: New-GPO
      case_insensitive: true
    unless:
      - id: well-known/lib/ui/ace-editor
      - id: well-known/app/system/anthropic-cybersecurity-skills::defensive-cybersecurity-skills-repository
      - id: metadata/file/profile/identity::generated-attack-map-context
  - id: new-gplink-cmdlet
    desc: Links Group Policy object
    crit: suspicious
    conf: 0.85
    if:
      type: text
      substr: New-GPLink
      case_insensitive: true
    unless:
      - id: well-known/lib/ui/ace-editor
  - id: sysvol-scheduledtasks-path
    desc: SYSVOL scheduled task staging
    crit: suspicious
    conf: 0.9
    if:
      type: text
      regex: SYSVOL.{0,120}Policies.{0,120}ScheduledTasks
      case_insensitive: true
  - id: immediate-task-v2-clsid
    desc: GPP ImmediateTaskV2 CLSID
    crit: suspicious
    conf: 0.92
    if:
      type: text
      substr: 9756B581-76EC-4169-9AFC-0CA8D43ADB5F
      case_insensitive: true
  - id: scheduledtasks-clsid
    desc: GPP ScheduledTasks CLSID
    crit: suspicious
    conf: 0.86
    if:
      type: text
      substr: CC63F200-7309-4ba0-B154-A71CD118DBCC
      case_insensitive: true

  - id: netlogon-share-path
    desc: References a NETLOGON UNC path
    crit: component
    conf: 0.9
    for: [scripts]
    attack: T1570
    if:
      type: text
      regex: '(?i)\\\\.{0,80}\\NETLOGON\\'

  - id: sysvol-scripts-share-path
    desc: References a SYSVOL scripts UNC path
    crit: component
    conf: 0.92
    for: [scripts]
    attack: T1570
    if:
      type: text
      regex: '(?i)\\\\.{0,120}\\SYSVOL\\.{0,120}\\scripts\\'

composite_rules:
  - id: netlogon-payload-copy
    desc: Copies payload to NETLOGON
    crit: suspicious
    conf: 0.92
    attack: T1570
    all:
      - id: netlogon-share-path
    any:
      - id: micro-behaviors/fs/file/copy::windows-copy-command
      - id: micro-behaviors/fs/file/copy::powershell-copy-item-command
    needs: 1
    near_lines: 1

  - id: sysvol-payload-copy
    desc: Copies payload to SYSVOL scripts
    crit: suspicious
    conf: 0.92
    attack: T1570
    all:
      - id: sysvol-scripts-share-path
    any:
      - id: micro-behaviors/fs/file/copy::windows-copy-command
      - id: micro-behaviors/fs/file/copy::powershell-copy-item-command
    needs: 1
    near_lines: 2

  - id: privileged-group-netlogon-staging
    desc: Privileged group addition followed by NETLOGON staging
    crit: hostile
    conf: 0.97
    attack: T1098,T1570
    all:
      - id: micro-behaviors/os/group/membership::privileged-group-add
      - id: netlogon-payload-copy
    near_lines: 24

  - id: privileged-group-sysvol-staging
    desc: Privileged group addition followed by SYSVOL staging
    crit: hostile
    conf: 0.97
    attack: T1098,T1570
    all:
      - id: micro-behaviors/os/group/membership::privileged-group-add
      - id: sysvol-payload-copy
    near_lines: 32

  - id: gpo-scheduled-task-deploy
    desc: GPO scheduled task deployment
    crit: suspicious
    conf: 0.93
    all:
      - id: new-gpo-cmdlet
      - id: new-gplink-cmdlet
    any:
      - id: sysvol-scheduledtasks-path
      - id: immediate-task-v2-clsid
      - id: scheduledtasks-clsid
      - id: micro-behaviors/os/security/policy::gpupdate-force
  - id: gpo-ransomware-mass-deploy
    desc: Ransomware GPO mass deployment
    crit: hostile
    conf: 0.97
    all:
      - id: gpo-scheduled-task-deploy
      - id: netlogon-payload-copy
      - id: micro-behaviors/os/security/policy::gpupdate-force
    any:
      - id: micro-behaviors/os/module/load::powershell-ad-gpo-module
      - id: objectives/impact/ransom/encrypt/cli::password-gated-ransomware-cli
      - id: objectives/impact/ransom/encrypt/cli::password-gated-spread-locker
