defaults:
  platforms: [windows]
  for: [powershell, batch, scripts, pe]
  attack: "T1484.001"
traits:
  - id: secureboot-event-collection-script
    desc: Secure Boot event collection rollout
    crit: notable
    conf: 0.95
    for: [powershell]
    if:
      type: text
      substr: SecureBoot-EventCollection
  - id: gpo-disable-defender-policy
    desc: GPO disables Defender via Set-GPRegistryValue
    crit: suspicious
    conf: 0.97
    for: [powershell, batch, scripts, pe, dll, go, c]
    attack: T1562.001,T1484.001
    if:
      type: text
      regex: '(?i)Set-GPRegistryValue[^\r\n]{0,120}Disable(AntiSpyware|Realtime)[^\r\n]{0,48}\b1\b'
composite_rules:
  - id: linked-gpo-disables-defender
    desc: Linked GPO disables Microsoft Defender
    crit: hostile
    conf: 0.98
    for: [powershell, batch, scripts, pe, dll, go, c]
    attack: T1562.001,T1484.001
    all:
      - id: gpo-disable-defender-policy
      - id: micro-behaviors/os/security/policy::new-gplink-cmdlet
    any:
      - id: micro-behaviors/os/security/policy::new-gpo-cmdlet
      - id: micro-behaviors/os/security/gpo/
      - id: micro-behaviors/os/security/policy::gpupdate-force
  - id: domain-share-payload-copy
    for: [scripts, '!applescript', '!jcl', '!shell']
    desc: Copies payload to NETLOGON or SYSVOL scripts share
    crit: notable
    conf: 0.92
    attack: T1570
    any:
      - id: netlogon-payload-copy
      - id: micro-behaviors/fs/file/copy::sysvol-script-file-transfer
  - id: netlogon-payload-copy
    for: [scripts, '!applescript', '!jcl', '!shell']
    desc: Copies payload to NETLOGON
    crit: suspicious
    conf: 0.92
    attack: T1570
    all:
      - id: micro-behaviors/os/security/policy::netlogon-share-path
    any:
      - id: micro-behaviors/fs/file/copy::windows-copy-command
      - id: micro-behaviors/fs/file/copy::powershell-copy-item-command
    needs: 1
    near_lines: 1

  - id: privileged-group-netlogon-staging
    for: [scripts, '!applescript', '!jcl', '!shell']
    desc: Privileged group addition followed by NETLOGON staging
    crit: hostile
    conf: 0.97
    attack: T1098,T1570
    all:
      - id: netlogon-payload-copy
    any:
      - id: micro-behaviors/os/group/membership::net-privileged-group-add
      - id: micro-behaviors/os/group/membership::powershell-privileged-group-add
      - id: micro-behaviors/os/group/membership::net-localgroup-administrators-add
    needs: 1
    near_lines: 24

  - id: privileged-group-sysvol-staging
    for: [scripts, '!applescript', '!jcl', '!shell']
    desc: Privileged group addition near SYSVOL file copy
    crit: suspicious
    conf: 0.97
    attack: T1098,T1570
    all:
      - id: micro-behaviors/fs/file/copy::sysvol-script-file-transfer
    any:
      - id: micro-behaviors/os/group/membership::net-privileged-group-add
      - id: micro-behaviors/os/group/membership::powershell-privileged-group-add
      - id: micro-behaviors/os/group/membership::net-localgroup-administrators-add
    needs: 1
    near_lines: 32

  - id: gpo-scheduled-task-deploy
    for: [powershell]
    desc: GPO scheduled task deployment
    crit: suspicious
    conf: 0.93
    all:
      - id: micro-behaviors/os/security/policy::new-gpo-cmdlet
      - id: micro-behaviors/os/security/policy::new-gplink-cmdlet
    any:
      - id: micro-behaviors/os/security/gpo/
    unless:
      - id: secureboot-event-collection-script
  - id: gpo-ransomware-mass-deploy
    for: [powershell]
    desc: Ransomware GPO mass deployment
    crit: hostile
    conf: 0.97
    all:
      - id: gpo-scheduled-task-deploy
      - id: domain-share-payload-copy
      - id: micro-behaviors/os/security/policy::gpupdate-force
    any:
      - id: micro-behaviors/os/module/load::powershell-ad-gpo-module
      - id: objectives/impact/ransom/encrypt/cli::password-gated-ransomware-cli
      - id: objectives/impact/ransom/encrypt/cli::password-gated-spread-locker
  - id: gpo-sysvol-defender-disable-task-deploy
    for: [powershell]
    desc: GPO disables Defender and deploys SYSVOL task
    crit: hostile
    conf: 0.98
    all:
      - id: gpo-scheduled-task-deploy
      - id: micro-behaviors/fs/file/copy::sysvol-script-file-transfer
      - id: micro-behaviors/os/security/policy::set-gpregistryvalue-cmdlet
      - id: micro-behaviors/os/security/defender::defender-product-name-reference
      - id: micro-behaviors/os/security/policy::gpupdate-force
