# GPO-based delivery of an elevated destructive task. GPO administration is
# common in legitimate environments, so this requires policy XML mutation,
# a SYSTEM/highest task, a network-share payload, and task self-removal.
defaults:
  platforms: [windows]
  for: [powershell]
  attack: T1484.001

traits:
  - id: gpo-backup-xml-policy-mutation
    desc: Mutates GPO identity and version fields
    crit: suspicious
    conf: 0.95
    if:
      type: text
      regex: '(?is)\bGPOGuid\b[\s\S]{0,260}\bMachineVersionNumber\b'

composite_rules:
  - id: gpo-destructive-system-task-delivery
    desc: GPO mutates policy to deliver a self-removing SYSTEM task from a share
    crit: hostile
    conf: 0.998
    all:
      - id: micro-behaviors/os/security/policy::backup-gpo-cmdlet
      - id: gpo-backup-xml-policy-mutation
      - id: micro-behaviors/os/autorun/scheduled::new-scheduledtaskaction
      - id: micro-behaviors/os/autorun/scheduled::new-scheduledtask-principal-authority-system
      - id: micro-behaviors/os/autorun/scheduled::schtask-runlevel-highest
      - id: micro-behaviors/fs/path/network::unc-executable-or-script
      - id: micro-behaviors/os/autorun/control::schtasks-delete-force
