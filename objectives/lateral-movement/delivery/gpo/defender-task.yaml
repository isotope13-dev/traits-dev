defaults:
  platforms: [windows]
  for: [pe, dll, powershell, batch, go]
composite_rules:
  - id: linked-gpo-system-task-with-defender-suppression
    desc: Linked GPO carries SYSTEM tasks and Defender-disable policy
    crit: hostile
    conf: 0.97
    attack: T1484.001,T1053.005,T1562.001
    all:
      - id: objectives/evasion/anti-av/registry::linked-gpo-disables-defender
      - id: micro-behaviors/os/security/policy::gpp-scheduled-tasks-template-path
      - id: micro-behaviors/os/security/policy::task-xml-system-principal
