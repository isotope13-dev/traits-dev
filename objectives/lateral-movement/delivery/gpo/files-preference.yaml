# GPP Files can distribute arbitrary files from SYSVOL to every endpoint in a
# linked policy's scope. A drive-root target is uncommon and was used for the
# incident's read-only extortion note.
defaults:
  platforms: [windows]
  for: [powershell, batch, scripts]
  attack: T1484.001

traits:
  - id: gpp-properties-create-action
    desc: GPP Properties create action
    crit: component
    conf: 0.92
    if:
      type: text
      regex: '(?i)<Properties\b[^>\r\n]{0,192}\baction=["'']C["'']'

  - id: gpp-drive-root-target-path
    desc: GPP drive-root target path
    crit: component
    conf: 0.92
    if:
      type: text
      regex: '(?i)\btargetPath=["''][A-Z]:\\+[^\\/"''\r\n]{1,96}["'']'

composite_rules:
  - id: gpp-file-create-at-drive-root
    desc: GPP creates a file at a drive root
    crit: suspicious
    conf: 0.96
    all:
      - id: micro-behaviors/os/security/policy::gpp-files-template-path
      - id: gpp-properties-create-action
      - id: gpp-drive-root-target-path
    near_lines: 10

  - id: linked-gpo-drive-root-file-deployment
    desc: Creates and links a Group Policy object that deploys a file to a drive root
    crit: suspicious
    conf: 0.97
    all:
      - id: gpp-file-create-at-drive-root
      - id: micro-behaviors/os/security/policy::new-gpo-cmdlet
      - id: micro-behaviors/os/security/policy::new-gplink-cmdlet
      - id: micro-behaviors/os/security/policy::sysvol-policies-share-path
    near_lines: 48
