defaults:
  platforms: [windows]
  for: [pe]
  mbc: B0024
composite_rules:
  - id: multi-stage-loader
    desc: Multi-stage malware loader with obfuscation and injection
    crit: hostile
    conf: 0.9
    attack: T1545
    all:
      - id: metadata/file/encoded::large-base64-like-string
      - id: objectives/anti-static/obfuscation/reflection/class::dynamic-load-pattern
      - id: micro-behaviors/process/inject/runtime/call::remote-process-injection-api-set
    downgrade:
      any:
        - id: well-known/game/steam/
        - id: metadata/binary/section/label::upx-section
        - id: metadata/binary/installer/family/
        - id: well-known/app/system/crayens/
  - id: obfuscated-network-bootstrap-loader
    desc: Obfuscated loader with host fingerprinting
    crit: hostile
    conf: 0.94
    attack: T1105
    size_max: 450000
    unless:
      - id: metadata/signed/platform/
      - id: metadata/package/versioning/scheme::pe-version-resource
    all:
      - id: metadata/binary/section/entropy::high-entropy-exec-section
      - id: objectives/anti-analysis/debugger-detect/loader::anti-debug-network-bootstrap-loader
      - id: micro-behaviors/dylib/lookup::get-proc-address-import
