defaults:
  for:
  - csharp
  - pe
  - dll
  - powershell
  - python
  - javascript
  platforms:
  - windows
  - linux
  - macos
  attack: T1570,T1219
composite_rules:
- id: rmm-session-automatic-payload-execution
  desc: Queues script runs for new RMM Host sessions
  crit: hostile
  conf: 0.99
  all:
  - id: metadata/lang/source/syntax/member::endpoint-status-connection-list
  - id: metadata/lang/source/syntax/member::host-connection-field-cluster
  - id: micro-behaviors/communications/transfer::screenconnect-programmatic-run-file-transfer
  unless:
  - id: well-known/dual-use/remote-admin/screenconnect::screenconnect-vendor-binary-context
  near_bytes: 4096
- id: rmm-session-reconnect-payload-redelivery
  desc: RMM payload delivery rearms on disconnect
  crit: hostile
  conf: 0.99
  all:
  - id: rmm-session-automatic-payload-execution
  - id: micro-behaviors/data/control-flow/membership::connection-id-cache-pruning
