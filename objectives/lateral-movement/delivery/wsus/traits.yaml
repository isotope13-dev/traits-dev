# WSUS can be turned into a payload-delivery mechanism through its external
# SUSDB. These rules describe the concrete stored-procedure and update-XML
# shapes from the research across SQL, PowerShell, and source wrappers.
defaults:
  platforms: [windows]
  for: [text, source, scripts, powershell, python, batch, shell, csharp, javascript, typescript, go, rust]

traits:
  - id: wsus-update-import-procedure
    desc: WSUS imports an update definition
    crit: suspicious
    conf: 0.98
    if:
      type: text
      substr: spImportUpdate
      case_insensitive: true

  - id: wsus-xml-fragment-save-procedure
    desc: WSUS saves an update XML fragment
    crit: suspicious
    conf: 0.98
    if:
      type: text
      substr: spSaveXmlFragment
      case_insensitive: true

  - id: wsus-commandline-handler-marker
    desc: WSUS command-line installation handler
    crit: suspicious
    conf: 0.98
    if:
      type: text
      substr: CommandLineInstallation
      case_insensitive: true

  - id: wsus-install-command-program
    desc: WSUS install command names a program
    crit: suspicious
    conf: 0.98
    if:
      type: text
      regex: '(?i)<(cmd:)?InstallCommand.{0,160}Program\s*='

  - id: wsus-batch-url-procedure
    desc: WSUS batch URL procedure
    crit: suspicious
    conf: 0.99
    if:
      type: text
      substr: spSetBatchURL
      case_insensitive: true

  - id: wsus-muurl-http-value
    desc: WSUS update download URL
    crit: suspicious
    conf: 0.99
    if:
      type: text
      regex: '(?i)\bMUURL\s*=\s*["'']https?://.{1,180}["'']'

  - id: wsus-target-group-create-procedure
    desc: WSUS creates a computer target group
    crit: suspicious
    conf: 0.98
    if:
      type: text
      substr: spCreateTargetGroup
      case_insensitive: true

  - id: wsus-computer-target-lookup
    desc: WSUS resolves a named computer
    crit: suspicious
    conf: 0.96
    if:
      type: text
      substr: spGetComputerTargetByName
      case_insensitive: true

  - id: wsus-computer-target-add-procedure
    desc: WSUS adds computer to target group
    crit: suspicious
    conf: 0.99
    if:
      type: text
      substr: spAddComputerToTargetGroup
      case_insensitive: true

  - id: wsus-update-deploy-procedure
    desc: WSUS deploys an update
    crit: suspicious
    conf: 0.99
    if:
      type: text
      substr: spDeployUpdate
      case_insensitive: true

  - id: wsus-ntlmrelayx-mssql-target
    desc: ntlmrelayx targets MSSQL
    crit: suspicious
    conf: 0.99
    if:
      type: text
      regex: '(?i)\bntlmrelayx(\.py)?\b.{0,220}(-t|--target)\s*mssql://'

  - id: wsus-petitpotam-coercion-command
    desc: PetitPotam coercion command
    crit: suspicious
    conf: 0.98
    if:
      type: text
      regex: '(?i)\bPetitPotam(\.py)?\b.{0,260}\b\d{1,3}(\.\d{1,3}){3}\b'

  - id: wsus-susdb-reference
    desc: WSUS SUSDB database name
    crit: notable
    conf: 0.98
    if:
      type: text
      word: SUSDB

composite_rules:
  - id: wsus-commandline-update-xml
    desc: WSUS XML command installation handler
    crit: suspicious
    conf: 0.99
    near_lines: 2
    all:
      - id: wsus-commandline-handler-marker
      - id: wsus-install-command-program

  - id: wsus-update-batch-url
    desc: WSUS maps update file to HTTP URL
    crit: suspicious
    conf: 0.99
    near_lines: 4
    all:
      - id: wsus-batch-url-procedure
      - id: wsus-muurl-http-value

  - id: wsus-database-update-injection
    desc: WSUS update database injection
    crit: hostile
    conf: 0.995
    all:
      - id: wsus-update-import-procedure
      - id: wsus-xml-fragment-save-procedure
      - id: wsus-commandline-update-xml
      - id: wsus-update-batch-url

  - id: wsus-surgical-update-deployment
    desc: WSUS single-computer update deployment
    crit: hostile
    conf: 0.995
    all:
      - id: wsus-target-group-create-procedure
      - id: wsus-computer-target-lookup
      - id: wsus-computer-target-add-procedure
      - id: wsus-update-deploy-procedure

  - id: wsus-susdb-sql-session
    desc: SQL client connects to WSUS SUSDB
    crit: suspicious
    conf: 0.97
    near_lines: 20
    all:
      - id: micro-behaviors/data/db/access::sqlserver-cli-client
      - id: wsus-susdb-reference

  - id: wsus-ntlm-relay-to-update-database
    desc: NTLM relay to WSUS update database
    crit: hostile
    conf: 0.995
    all:
      - id: wsus-ntlmrelayx-mssql-target
      - id: wsus-petitpotam-coercion-command
      - id: wsus-susdb-sql-session
