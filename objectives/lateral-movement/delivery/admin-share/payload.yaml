# Administrative-share paths and remote management primitives are dual use.
# The SMB composites retain those observations and add attack context where
# supported; copying and remote execution alone do not establish hostile intent.
defaults:
  platforms: [windows]
  for: [pe, dll, batch, powershell]
  attack: T1021.002
  mbc: B0030
traits:
- id: admin-share-c-windows-temp-dll
  desc: Admin share Windows Temp DLL
  crit: suspicious
  conf: 0.94
  if:
    type: text
    regex: '\\\\[`$\w<>\.-]{1,80}\\C[`]?\$\\Windows\\Temp\\[^\\\s]{1,120}\.dll'
    case_insensitive: true
- id: schtasks-cross-host
  desc: schtasks remote /s flag
  crit: suspicious
  conf: 0.92
  unless:
    - id: metadata/file/format/log::windows-event-csv-records
  if:
    type: text
    regex: 'schtasks\s+/create\s+/s\s+\$?\w{1,40}'
    case_insensitive: true
- id: sc-exe-cross-host-create
  desc: sc.exe remote service create
  crit: suspicious
  conf: 0.95
  if:
    type: text
    regex: 'sc(\.exe)?\s+\\\\\$?\w{1,40}\s+create\s+\$?\w{1,40}\s+binPath'
    case_insensitive: true
composite_rules:
- id: batch-admin-share-payload-fanout
  desc: Batch fan-out through admin shares
  crit: hostile
  conf: 0.98
  for: [batch]
  attack: T1021.002,T1569.002
  all:
  - id: objectives/lateral-movement/smb::admin-share-copy-with-remote-execution
  - id: micro-behaviors/data/control-flow/loop::batch-for-f-file-iteration
  - id: micro-behaviors/fs/file/copy::windows-copy-command
  near_lines: 5
- id: psexec-remote-event-log-clear
  desc: PsExec remote event-log clearing
  crit: hostile
  conf: 0.99
  attack: T1021.002,T1070.001,T1569.002
  all:
  - id: micro-behaviors/process/create/launch::psexec-remote-invocation
  - id: micro-behaviors/os/event/log::wevtutil-clear-log-command
  near_lines: 2
