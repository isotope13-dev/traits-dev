# Cross-host payload deployment via admin shares + remote execution.
# Ransomware affiliates routinely write a copy of their payload to
# `\\<host>\C$\ProgramData\` (or admin$) on each enumerated host,
# then trigger execution via WMI/CIM/sc.exe/schtasks/Invoke-Command.
# The shape — path string with credential variable + remote-exec
# command in proximity — is hostile in its own right; observed in
# VECT, Conti, BlackBasta, Akira, LockBit, Qilin.
defaults:
  platforms: [windows]
  for: [pe, dll, batch, powershell]
  attack: T1021.002
  mbc: B0030
traits:
- id: admin-share-c-programdata
  desc: Admin share C$\ProgramData payload path
  crit: suspicious
  conf: 0.95
  if:
    type: text
    regex: '\\\\[`$A-Za-z0-9_]{1,40}\\C[`]?\$\\ProgramData\\'
- id: admin-share-c-windows-temp-dll
  desc: Admin share Windows Temp DLL
  crit: suspicious
  conf: 0.94
  if:
    type: text
    regex: '\\\\[`$\w<>\.-]{1,80}\\C[`]?\$\\Windows\\Temp\\[^\\\s]{1,120}\.dll'
    case_insensitive: true
- id: admin-share-c-windows-temp-executable
  desc: Admin share Windows Temp executable
  crit: suspicious
  conf: 0.95
  for: [binaries, scripts, source]
  if:
    type: text
    regex: '\\\\[\w.%${}<>-]{1,80}\\c\$\\windows\\temp\\[^\\\s]{1,120}\.(exe|dll|bin)\b'
    case_insensitive: true
- id: admin-share-admin-temp-executable
  desc: ADMIN$ Temp executable staging path
  crit: suspicious
  conf: 0.96
  for: [pe, dll, batch, powershell, c, cpp, csharp, go, rust, python]
  if:
    type: text
    regex: '\\{2,4}[\w<>.-]{1,80}\\{1,2}ADMIN\$\\{1,2}Temp\\{1,2}[^\\\s]{1,120}\.(exe|dll|bin)\b'
    case_insensitive: true
- id: schtasks-cross-host
  desc: schtasks remote /s flag
  crit: suspicious
  conf: 0.92
  if:
    type: text
    regex: 'schtasks\s+/create\s+/s\s+\$?\w{1,40}'
    case_insensitive: true
- id: sc-exe-cross-host-create
  desc: sc.exe remote service create
  crit: suspicious
  conf: 0.95
  if:
    type: text
    regex: 'sc(\.exe)?\s+\\\\\$?\w{1,40}\s+create\s+\$?\w{1,40}\s+binPath'
    case_insensitive: true
composite_rules:
- id: admin-share-payload-deployment
  desc: Cross-host payload via admin share + exec
  crit: hostile
  conf: 0.97
  for: [binaries, scripts, source]
  any:
  - id: admin-share-c-programdata
  - id: admin-share-c-windows-temp-executable
  - id: admin-share-admin-temp-executable
  all:
  - id: lateral-exec-method
- id: lateral-exec-method
  desc: Remote-host execution method
  crit: suspicious
  conf: 0.92
  for: [binaries, scripts, source]
  any:
  - id: schtasks-cross-host
  - id: sc-exe-cross-host-create
  # Canonical Win32_Process.Create atoms; this composite only supplies the
  # "one of the cross-host execution methods" role.
  - id: micro-behaviors/os/wmi/manipulate::create-process-wmi-cmdlet
  - id: micro-behaviors/os/wmi/manipulate::create-process-cim-cmdlet
  - id: objectives/lateral-movement/delivery/wmi::psexec-remote-command
  - id: psexec-cross-host-temp-execution

- id: psexec-cross-host-temp-execution
  desc: PsExec remote Windows Temp payload
  crit: suspicious
  conf: 0.97
  all:
  - id: objectives/lateral-movement/delivery/wmi::psexec-remote-command
  - id: micro-behaviors/fs/path/temp::windows-temp-executable-path
