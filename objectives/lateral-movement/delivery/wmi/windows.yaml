defaults:
  platforms: [windows]
  for: [batch, powershell, python, javascript, c, cpp, pe, dll]
  attack: T1047

traits:
  - id: wmic-remote-process-create
    desc: WMIC remote process creation
    crit: suspicious
    conf: 0.96
    unless:
      - id: well-known/app/system/anthropic-cybersecurity-skills::defensive-cybersecurity-skills-repository
    if:
      type: text
      regex: '(?i)\bwmic(\.exe)?\s+/node[:\s]+\S+\s+process\s+call\s+create\b'

  - id: psexec-remote-command
    desc: PsExec remote command execution
    crit: suspicious
    conf: 0.96
    attack: T1569.002
    for: [binaries, scripts, source]
    if:
      type: text
      regex: '(?i)\bpsexec(64)?(\.exe)?\b[^\r\n]{0,160}\s+\\\\[\w.%${}<>-]{1,80}(\s|["'']|$)'
    unless:
      - id: well-known/tool/sysadmin/microsoft-wpj::microsoft-wpj-cleanup-benign-context
      # ClusterFuzz uses PsExec to launch its bot startup as the clusterfuzz
      # user during GCE Windows VM provisioning - not lateral movement.
      - id: well-known/tool/sysadmin/clusterfuzz::gce-windows-provisioner
      - id: well-known/app/infrastructure/ansible::ansible-module-source-context

  - id: impacket-wmiexec-path
    desc: Impacket wmiexec utility path
    crit: notable
    if:
      type: text
      regex: '(?i)(impacket[\\/]examples[\\/]wmiexec\.py|wmiexec\.py)\b'

  - id: impacket-wmiexec-target
    desc: Impacket wmiexec remote target
    crit: suspicious
    conf: 0.96
    if:
      type: text
      regex: '(?i)\bwmiexec\.py\b[^\r\n]{0,180}@(\[[^\]\r\n]{1,40}\]|[A-Za-z0-9_.-]+)'
    unless:
      - id: well-known/tool/offensive/bingo/
      - id: metadata/file/extension/identity::markdown-file-basename
  - id: wmic-command-shell-target
    desc: WMIC process creation targets a shell
    crit: suspicious
    conf: 0.97
    for: [scripts, binaries]
    unless:
      - id: well-known/app/system/anthropic-cybersecurity-skills::defensive-cybersecurity-skills-repository
    if:
      type: text
      regex: '(?i)\bwmic\b[^\r\n]{0,80}\bprocess\s+call\s+create\b[^\r\n]{0,40}\b(cmd|powershell)\b'

  - id: quiet-cmd-output-redirect
    desc: Quiet cmd output redirect
    crit: suspicious
    conf: 0.96
    for: [scripts, binaries]
    if:
      type: text
      regex: '(?i)\bcmd(\.exe)?\s+/q\s+/c\b[^\r\n]{0,200}\b1>\s*'

  - id: admin-share-epoch-output
    desc: ADMIN$ epoch output file path
    crit: suspicious
    conf: 0.98
    for: [scripts, binaries]
    if:
      type: text
      regex: '(?i)\\\\[A-Za-z0-9_.-]{1,255}\\ADMIN\$\\__([0-9]{9,}|UNIX[_ ]+EPOCH[_ ]+DATETIME)\b'

composite_rules:
  - id: impacket-wmiexec-remote-command
    desc: Impacket wmiexec remote command execution
    crit: suspicious
    conf: 0.96
    all:
      - id: impacket-wmiexec-path
      - id: impacket-wmiexec-target
    unless:
      - id: well-known/tool/offensive/bingo/
      - id: metadata/file/extension/identity::markdown-file-basename
  - id: windows-wmi-or-psexec-remote-execution
    desc: Windows WMI or PsExec remote execution
    crit: suspicious
    conf: 0.98
    any:
      - id: wmic-remote-process-create
      - id: psexec-remote-command
      - id: impacket-wmiexec-remote-command
      # Canonical remote Win32_Process.Create lives in objectives/execution/wmi/.
      - id: objectives/execution/wmi::powershell-wmi-remote-process-spawn
    unless:
      - id: well-known/app/infrastructure/ansible::ansible-powershell-provenance
      - id: metadata/file/extension/identity::markdown-file-basename

  - id: wmic-remote-command-shell
    for: [pe, batch, python, javascript, powershell]
    desc: WMIC remotely creates a command shell
    crit: hostile
    conf: 0.98
    attack: T1047,T1059.001,T1059.003
    all:
      - id: wmic-remote-process-create
      - id: wmic-command-shell-target
    near_lines: 2
    unless:
      - id: well-known/app/system/anthropic-cybersecurity-skills::defensive-cybersecurity-skills-repository

  - id: impacket-wmiexec-admin-share-redirect
    for: [pe, batch, python, javascript, powershell]
    desc: Impacket-style ADMIN$ output redirect
    crit: hostile
    conf: 0.99
    attack: T1047,T1021.002
    all:
      - id: quiet-cmd-output-redirect
      - id: admin-share-epoch-output
    near_lines: 2
