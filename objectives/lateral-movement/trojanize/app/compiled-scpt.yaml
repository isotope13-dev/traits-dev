defaults:
  platforms: [macos]
  for: [applescript]

composite_rules:
  - id: compiled-stealer-wallet-app-replacement
    desc: Stealer downloads replacement desktop wallet apps
    crit: hostile
    conf: 0.96
    attack: T1554,T1105
    all:
      - id: objectives/credential-access/theft/multi-app::wallet-messaging-session-stealer
      - id: micro-behaviors/fs/path/application/bundle::wallet-app-bundle-path
      - id: micro-behaviors/process/terminate/command::scpt-pkill-wallet-application
      - id: micro-behaviors/fs/delete/directory::applescript-sudo-recursive-remove-command
      - id: micro-behaviors/communications/http/download/curl::curl-output-file
      - id: micro-behaviors/data/archive/extract/zip::macos-ditto-extract-zip
