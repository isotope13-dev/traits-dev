defaults:
  platforms: [macos]
  for: [applescript, shell]
  attack: T1005
  mbc: B0028

traits:
- id: toast-function
  desc: AppleScript toast handler
  crit: notable
  conf: 0.9
  if:
    type: text
    substr: on toast(
- id: sudo-app-delete
  desc: sudo delete application bundle
  crit: suspicious
  conf: 0.95
  attack: T1554
  if:
    type: text
    regex: sudo\s+-S\s+rm\s+-rf.{0,60}/Applications/
- id: sudo-app-copy
  desc: sudo copy application bundle
  crit: suspicious
  conf: 0.95
  attack: T1554
  if:
    type: text
    regex: sudo\s+-S\s+cp\s+-r

composite_rules:
- id: trojan-app-substitution
  for: [shell]
  desc: Downloaded app replacement via sudo
  crit: hostile
  conf: 0.96
  attack: T1554
  all:
  - id: toast-function
  - id: micro-behaviors/communications/http/download/cli::curl-download-l-o
  - id: micro-behaviors/data/archive/extract/zip::unzip-quiet-dir
  - id: micro-behaviors/fs/directory/traverse::find-app-bundle
  any:
  - id: sudo-app-delete
  - id: sudo-app-copy
