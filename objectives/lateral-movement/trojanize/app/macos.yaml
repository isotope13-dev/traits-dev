defaults:
  for:
    - macho
    - python
    - shell
    # AppleScript stealers (AMOS/Poseidon family) drive app replacement via
    # `do shell script` — the curl/pkill/rm/unzip patterns appear in-script.
    - applescript
  attack: T1574.001
  platforms:
    - macos
  crit: suspicious
traits:
  - id: app-contents-path
    desc: .app/Contents/ bundle path access
    crit: notable
    conf: 0.6
    if:
      type: text
      substr: .app/Contents/
  - id: ledger-app-path
    desc: Ledger Live application path reference
    conf: 0.85
    if:
      type: text
      substr: /Applications/Ledger Live.app
  - id: wallet-app-path
    desc: Cryptocurrency wallet application path
    conf: 0.85
    if:
      type: text
      regex: /Applications/(Ledger (Live|Wallet)|Trezor Suite|Exodus)\.app
  - id: pkill-ledger-live
    desc: Kills Ledger Live before swapping it
    crit: suspicious
    conf: 0.7
    if:
      type: text
      regex: pkill.{0,30}Ledger Live
  - id: killall-ledger
    desc: Kills Ledger desktop wallet app
    crit: suspicious
    conf: 0.7
    if:
      type: text
      regex: killall.{0,30}Ledger
  - id: unzip-to-applications
    desc: Unpacks an app into /Applications
    crit: suspicious
    conf: 0.7
    if:
      type: text
      regex: unzip.{0,50}/Applications
  - id: unzip-in-tmp
    desc: Unzips a staged archive in /tmp
    crit: suspicious
    conf: 0.88
    if:
      type: text
      substr: cd /tmp && unzip
  - id: unzip-d-applications
    desc: unzip -d extracts into /Applications
    crit: suspicious
    conf: 0.7
    if:
      type: text
      regex: unzip.{0,30}-d.{0,30}/Applications
  - id: curl-app-zip
    desc: Downloads trojanized .app.zip via curl
    crit: suspicious
    conf: 0.7
    if:
      type: text
      regex: curl.{0,50}\.app\.zip
  - id: curl-app-archive
    desc: Downloads replacement app.zip via curl
    crit: suspicious
    conf: 0.7
    if:
      type: text
      regex: curl.{0,50}app\.zip
  - id: wget-app-zip
    desc: Downloads trojanized .app.zip via wget
    crit: suspicious
    conf: 0.7
    if:
      type: text
      regex: wget.{0,50}\.app\.zip
  - id: rm-app-unzip
    desc: Replaces app via rm then unzip
    crit: suspicious
    conf: 0.7
    if:
      type: text
      regex: rm.{0,50}\.app.{0,30}&&.{0,30}unzip
  - id: rm-app-cp
    desc: Replaces app via rm then cp
    crit: suspicious
    conf: 0.7
    if:
      type: text
      regex: rm.{0,50}\.app.{0,30}&&.{0,30}cp
  - id: tmp-asar-stage
    desc: Stages app.asar under /tmp
    crit: suspicious
    conf: 0.9
    if:
      type: text
      substr: /tmp/app.asar
  - id: asar-zip-part-name
    desc: Split app.asar zip part name
    crit: suspicious
    conf: 0.92
    if:
      type: text
      substr: app.asar.zip.part
composite_rules:
  - id: pkill-ledger
    desc: Kill Ledger Live process
    conf: 0.9
    any:
      - id: pkill-ledger-live
      - id: killall-ledger
  - id: unzip-applications
    desc: Unzip to /Applications directory
    crit: suspicious
    conf: 0.85
    any:
      - id: unzip-to-applications
      - id: unzip-d-applications
  - id: download-app-zip
    desc: Download application archive
    crit: suspicious
    conf: 0.85
    any:
      - id: curl-app-zip
      - id: curl-app-archive
      - id: wget-app-zip
  - id: app-replacement
    desc: Application replacement pattern
    crit: suspicious
    conf: 0.8
    any:
      - id: rm-app-unzip
      - id: rm-app-cp
  - id: app-replace-action
    desc: App replacement action
    crit: suspicious
    conf: 0.8
    any:
      - id: unzip-applications
      - id: download-app-zip
  - id: downloaded-app-trojanizer
    desc: Replaces app with ad-hoc signed download
    crit: hostile
    conf: 0.98
    attack: T1195.002,T1574.001,T1553.001
    near_bytes: 1200
    all:
      - id: download-app-zip
      - id: unzip-applications
      - id: micro-behaviors/os/security/gatekeeper::codesign-force-adhoc
      - id: micro-behaviors/process/terminate/command::pkill
  - id: ledger-trojanize
    desc: Ledger Live application replacement attack
    crit: hostile
    conf: 0.95
    all:
      - id: ledger-app-path
      - id: pkill-ledger
      - id: app-replace-action
  - id: ledger-live-muted-replace
    desc: Mutes volume while replacing Ledger Live
    crit: hostile
    conf: 0.97
    for: [applescript]
    all:
      - id: ledger-app-path
      - id: pkill-ledger
      - id: objectives/evasion/process/hidden/audio::stealth-mute-unmute
  - id: ledger-asar-finder-implant
    desc: Finder overwrites Ledger Live app.asar
    crit: hostile
    conf: 0.97
    for: [applescript]
    all:
      - id: ledger-app-path
      - id: tmp-asar-stage
      - id: micro-behaviors/process/create/script/automation::finder-duplicate-replacing
  - id: ledger-split-asar-fetch
    desc: Fetches split asar parts for Ledger Live
    crit: hostile
    conf: 0.96
    for: [applescript]
    all:
      - id: ledger-app-path
      - id: asar-zip-part-name
      - id: micro-behaviors/communications/http/curl::curl-cmd
  - id: ledger-tmp-unzip-asar
    desc: Unzips staged asar then targets Ledger Live
    crit: hostile
    conf: 0.96
    for: [applescript]
    all:
      - id: ledger-app-path
      - id: tmp-asar-stage
      - id: unzip-in-tmp
  - id: compiled-wallet-unzip-with-password-prompt
    desc: Unpacks a wallet app and prompts for a password
    crit: hostile
    conf: 0.97
    attack: T1574.001,T1056.002
    for: [macho]
    scope: file
    all:
      - id: wallet-app-path
      - id: unzip-applications
      - id: objectives/credential-access/phishing/lure::compiled-osascript-password-prompt
  - id: wallet-app-trojanize
    for: [shell]
    desc: Cryptocurrency wallet application replacement
    crit: hostile
    conf: 0.95
    all:
      - id: wallet-app-path
      - id: micro-behaviors/fs/shell-ops::remove-application-from-applications
      - id: download-app-zip
    any:
      - id: unzip-applications
      - id: app-replacement
  - id: app-bundle-hijack
    desc: macOS app bundle executable hijacking
    crit: suspicious
    conf: 0.85
    all:
      - id: micro-behaviors/fs/config/bundle::cfbundle-executable-key-reference
      - id: app-contents-path
      - id: app-replace-action
    downgrade:
      any:
        - id: metadata/signed/platform::apple
    unless:
      - id: well-known/tool/development/mobile/pymobiledevice3
  - id: watchdog-relaunch
    for: [macho]
    desc: Process watchdog with app relaunch
    crit: hostile
    conf: 0.9
    attack: T1547.001
    all:
      - id: micro-behaviors/process/info/query::get-process-for-pid
      - id: micro-behaviors/process/create/shellexec::nsworkspace-app-launch
      - id: micro-behaviors/time/query::sleep
  - id: app-trojanize
    for: [shell]
    desc: macOS application replacement attack
    crit: suspicious
    conf: 0.9
    all:
      - id: micro-behaviors/fs/shell-ops::remove-application-from-applications
      - id: unzip-applications
