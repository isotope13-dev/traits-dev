defaults:
  for:
    - macho
    - python
    - shell
    # AppleScript stealers (AMOS/Poseidon family) drive app replacement via
    # `do shell script` — the curl/pkill/rm/unzip patterns appear in-script.
    - applescript
  attack: T1574.001
  platforms:
    - macos
  crit: suspicious
composite_rules:
  - id: downloaded-app-trojanizer
    desc: Replaces app with ad-hoc signed download
    crit: hostile
    conf: 0.98
    attack: T1195.002,T1574.001,T1553.001
    near_bytes: 1200
    all:
      - id: micro-behaviors/communications/http/download/cli::app-zip-command
      - id: micro-behaviors/data/archive/extract/zip::unzip-applications-destination
      - id: micro-behaviors/os/security/gatekeeper::codesign-force-adhoc
      - id: micro-behaviors/process/terminate/command::pkill
  - id: ledger-trojanize
    for: [macho, shell, applescript]
    desc: Ledger Live application replacement attack
    crit: hostile
    conf: 0.95
    all:
      - id: micro-behaviors/fs/path/application/bundle::wallet-app-bundle-path
      - id: micro-behaviors/process/terminate/command::terminate-ledger-command
      - id: micro-behaviors/communications/http/download/curl::curl-zip-output
      - id: micro-behaviors/data/archive/extract/zip::unzip-applications-destination
    any:
      - id: objectives/credential-access/phishing/lure::password-phishing-comp
      - id: objectives/collection/file-targeting/filter::applescript-sensitive-store-exfiltration
  - id: ledger-live-muted-replace
    desc: Mutes volume while replacing Ledger Live
    crit: hostile
    conf: 0.97
    for: [applescript]
    all:
      - id: micro-behaviors/fs/path/application/bundle::wallet-app-bundle-path
      - id: micro-behaviors/process/terminate/command::terminate-ledger-command
      - id: objectives/evasion/process/hidden/audio::stealth-mute-unmute
  - id: ledger-asar-finder-implant
    desc: Finder overwrites a wallet app.asar
    crit: hostile
    conf: 0.97
    for: [applescript]
    all:
      - id: micro-behaviors/fs/path/application/bundle::wallet-app-bundle-path
      - id: micro-behaviors/fs/path/application/bundle::tmp-app-asar
      - id: micro-behaviors/process/create/script/automation::finder-duplicate-replacing
  - id: ledger-split-asar-fetch
    desc: Fetches split asar parts for wallet app
    crit: hostile
    conf: 0.96
    for: [applescript]
    all:
      - id: micro-behaviors/fs/path/application/bundle::wallet-app-bundle-path
      - id: micro-behaviors/fs/path/application/bundle::asar-zip-part-name
      - id: micro-behaviors/communications/http/curl::curl-cmd
  - id: ledger-tmp-unzip-asar
    desc: Unzips staged asar then targets wallet app
    crit: hostile
    conf: 0.96
    for: [applescript]
    all:
      - id: micro-behaviors/fs/path/application/bundle::wallet-app-bundle-path
      - id: micro-behaviors/fs/path/application/bundle::tmp-app-asar
      - id: micro-behaviors/data/archive/extract/zip::unzip-in-tmp
  - id: compiled-wallet-unzip-with-password-prompt
    desc: Unpacks a wallet app and prompts for a password
    crit: hostile
    conf: 0.97
    attack: T1574.001,T1056.002
    for: [macho]
    scope: file
    all:
      - id: micro-behaviors/fs/path/application/bundle::wallet-app-bundle-path
      - id: micro-behaviors/data/archive/extract/zip::unzip-applications-destination
      - id: micro-behaviors/ui/dialog/apple::compiled-osascript-password-prompt
  - id: wallet-app-trojanize
    for: [shell]
    desc: Cryptocurrency wallet application replacement
    crit: hostile
    conf: 0.95
    all:
      - id: micro-behaviors/fs/path/application/bundle::wallet-app-bundle-path
      - id: micro-behaviors/fs/shell-ops::remove-application-from-applications
      - id: micro-behaviors/communications/http/download/cli::app-zip-command
    any:
      - id: micro-behaviors/data/archive/extract/zip::unzip-applications-destination
      - id: micro-behaviors/fs/shell-ops::remove-app-then-copy-or-unzip
  - id: app-bundle-hijack
    desc: macOS app bundle executable hijacking
    crit: suspicious
    conf: 0.85
    all:
      - id: micro-behaviors/fs/config/bundle::cfbundle-executable-key-reference
      - id: micro-behaviors/fs/path/application/bundle::app-contents-path
      - id: micro-behaviors/communications/http/download/cli::app-zip-command
      - id: micro-behaviors/data/archive/extract/zip::unzip-applications-destination
    downgrade:
      any:
        - id: metadata/signed/platform::apple
    unless:
      - id: well-known/tool/development/mobile/pymobiledevice3
  - id: watchdog-relaunch
    for: [macho]
    desc: Process watchdog with app relaunch
    crit: hostile
    conf: 0.9
    attack: T1547.001
    all:
      - id: micro-behaviors/process/info/query::get-process-for-pid
      - id: micro-behaviors/process/create/shellexec::nsworkspace-app-launch
      - id: micro-behaviors/time/sleep/interval::sleep
  - id: app-trojanize
    for: [shell]
    desc: macOS application replacement attack
    crit: suspicious
    conf: 0.9
    all:
      - id: micro-behaviors/fs/shell-ops::remove-application-from-applications
      - id: micro-behaviors/data/archive/extract/zip::unzip-applications-destination
