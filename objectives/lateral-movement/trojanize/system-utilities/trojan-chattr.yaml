defaults:
  platforms: [unix]
  for: [elf]
  attack: T1014
  mbc: F0015

traits:
  - id: chattr-usage-banner
    desc: chattr usage banner text
    crit: notable
    conf: 0.95
    if:
      type: text
      substr: "Usage: chattr [-RVf]"

  - id: pam-master-so-path
    desc: References pam_master.so backdoor path
    crit: suspicious
    conf: 0.98
    if:
      type: text
      substr: "pam_master.so"

  - id: chattr-hidden-stash-path
    desc: References hidden .chatattr binary
    crit: suspicious
    conf: 0.98
    if:
      type: text
      substr: "/usr/libexec/.chatattr"

composite_rules:
  - id: trojan-chattr-rootkit
    desc: Trojanized chattr protecting rootkit paths
    crit: hostile
    conf: 0.99
    all:
      - id: chattr-usage-banner
      - id: pam-master-so-path
