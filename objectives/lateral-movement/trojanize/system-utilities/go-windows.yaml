defaults:
  platforms: [windows]
  for: [go]
  attack: T1027.009

traits:
  - id: go-system32-utility-source
    desc: Go reads System32 utilities
    crit: suspicious
    conf: 0.94
    if:
      type: text
      regex: 'System32[^\n]{0,180}(notepad|calc|taskmgr|mspaint)\.exe'
    unless:
      # Launching calc/narrator as a visible distraction is not reading the
      # binary to copy or shadow it.
      - type: text
        regex: 'Start-Process[^\n]{0,80}System32[^\n]{0,40}(calc|notepad|mspaint|taskmgr)\.exe'
      - id: metadata/package/testing/presence/harness::go-test-file
      - id: metadata/package/testing/harness/unit::go-test
      - id: "metadata/file/naming::test-directory-component"

  - id: go-path-shadow-utility-write
    desc: Go writes PATH-shadow utilities
    crit: suspicious
    conf: 0.94
    if:
      type: text
      regex: 'os\.WriteFile\(filepath\.Join\((\.|localAppData), target\)'

composite_rules:
  - id: go-windows-system-utility-trojanize
    desc: Go Windows utility trojanize
    crit: hostile
    conf: 0.98
    all:
      - id: go-system32-utility-source
      - id: go-path-shadow-utility-write
    any:
      - id: micro-behaviors/fs/write/file/full::go-os-writefile
      - id: micro-behaviors/fs/path/system::system32-substr
