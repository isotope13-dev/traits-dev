# Userspace rootkit installers stash copies of ls/ps/netstat under a
# fake /dev path, strip chattr flags on /bin, then copy backdoored
# replacements back over the originals.
defaults:
  platforms: [unix]
  for: [elf]
  attack: T1014,T1574.001
  mbc: F0015

traits:
  - id: dev-rd-stash-path
    desc: Stashes binaries under /dev/rd
    crit: notable
    conf: 0.97
    if:
      type: text
      substr: /dev/rd/
  - id: copying-backdoored-banner
    desc: Copying-backdoored-files install banner
    crit: suspicious
    conf: 0.98
    if:
      type: text
      substr: Copying backdoored
  - id: chattr-bin-glob
    desc: Bulk chattr on /bin glob
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: 'chattr.{0,32}/bin/\*'
  - id: stash-copy-bin-ls
    desc: Copies /bin/ls into a /dev stash
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: 'cp.{0,24}/bin/ls.{0,40}/dev/'
  - id: hide-tty-device-copy
    desc: Copies hide/tty binaries onto /dev
    crit: notable
    conf: 0.96
    if:
      type: text
      regex: 'cp.{0,16}hide/tty'

composite_rules:
  - id: backdoored-dev-rd-trojanize
    desc: Backdoored copies stash under /dev/rd
    crit: hostile
    conf: 0.98
    all:
      - id: copying-backdoored-banner
      - id: dev-rd-stash-path
  - id: chattr-dev-rd-trojanize
    desc: Bulk chattr with a /dev/rd stash
    crit: hostile
    conf: 0.97
    all:
      - id: chattr-bin-glob
      - id: dev-rd-stash-path
  - id: ls-stash-dev-rd-trojanize
    desc: Stashes /bin/ls under /dev/rd
    crit: hostile
    conf: 0.96
    all:
      - id: stash-copy-bin-ls
      - id: dev-rd-stash-path
  - id: hide-tty-dev-rd-trojanize
    desc: hide/tty copies with a /dev/rd stash
    crit: hostile
    conf: 0.97
    all:
      - id: hide-tty-device-copy
      - id: dev-rd-stash-path
