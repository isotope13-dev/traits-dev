# Trojanized GNU Utilities Detection
# Spirit malware family trojanizes legitimate coreutils binaries
# ATT&CK: T1027.009 (Embedded Payloads)
defaults:
  platforms: [unix, android]
  for: [swift]
traits:
  - id: swift-apt-wrapper-script
    desc: Swift writes apt wrapper script
    crit: suspicious
    conf: 0.92
    if:
      type: text
      substr: "Impersonating: /usr/bin/apt"

  - id: swift-ld-wrapper-script
    desc: Swift writes ld wrapper script
    crit: suspicious
    conf: 0.92
    if:
      type: text
      substr: "Impersonating: /usr/bin/ld"

  # swift-path-prepend-wrapper-dir was removed: its matcher (`export PATH=
  # ...:$PATH`) detects any shell PATH prepend embedded in Swift text — the
  # standard install-bin-dir idiom (`export PATH="$HOME/.cargo/bin:$PATH"`,
  # cmux's remote-shell bootstrap) as well as a trojan wrapper dir. A PATH
  # prepend is a neutral env-modification capability, so the composites below
  # reference the canonical matcher
  # micro-behaviors/os/env/modify::shell-path-prepend-export and
  # supply the trojanize intent through the wrapper-script legs.
  - id: swift-bin-ls-backup
    desc: Swift backs up /bin/ls
    crit: suspicious
    conf: 0.9
    if:
      type: text
      substr: /bin/ls.real
  - id: swift-tmp-ls-wrapper
    desc: Swift writes /tmp/ls wrapper
    crit: suspicious
    conf: 0.9
    if:
      type: text
      regex: '/tmp/ls[\s\S]{0,260}/bin/ls\.real'

composite_rules:
  - id: swift-trojanized-system-utilities
    desc: Swift trojanized system utilities
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/os/env/modify::shell-path-prepend-export
    any:
      - id: swift-apt-wrapper-script
      - id: swift-ld-wrapper-script
    needs: 1
  - id: swift-trojanized-ls-wrapper
    desc: Swift trojanized ls wrapper
    crit: hostile
    conf: 0.97
    all:
      - id: swift-bin-ls-backup
      - id: swift-tmp-ls-wrapper

  - id: swift-apt-ld-wrapper-pair
    desc: Wraps both apt and the linker
    crit: hostile
    conf: 0.97
    all:
      - id: swift-apt-wrapper-script
      - id: swift-ld-wrapper-script
      - id: micro-behaviors/os/env/modify::shell-path-prepend-export
