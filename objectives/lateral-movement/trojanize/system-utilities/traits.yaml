# Trojanized GNU Utilities Detection
# Spirit malware family trojanizes legitimate coreutils binaries
# ATT&CK: T1027.009 (Embedded Payloads)
defaults:
  platforms: [unix, android]
  for: [swift]
traits:
  - id: swift-apt-wrapper-script
    desc: Swift writes apt wrapper script
    crit: suspicious
    conf: 0.92
    if:
      type: text
      substr: "Impersonating: /usr/bin/apt"

  - id: swift-ld-wrapper-script
    desc: Swift writes ld wrapper script
    crit: suspicious
    conf: 0.92
    if:
      type: text
      substr: "Impersonating: /usr/bin/ld"

  - id: swift-path-prepend-wrapper-dir
    desc: Swift prepends wrapper directory
    crit: suspicious
    conf: 0.9
    if:
      type: text
      substr: 'export PATH="\('
  - id: swift-bin-ls-backup
    desc: Swift backs up /bin/ls
    crit: suspicious
    conf: 0.9
    if:
      type: text
      substr: /bin/ls.real
  - id: swift-tmp-ls-wrapper
    desc: Swift writes /tmp/ls wrapper
    crit: suspicious
    conf: 0.9
    if:
      type: text
      regex: '/tmp/ls[\s\S]{0,260}/bin/ls\.real'

composite_rules:
  - id: swift-trojanized-system-utilities
    desc: Swift trojanized system utilities
    crit: hostile
    conf: 0.98
    all:
      - id: swift-path-prepend-wrapper-dir
    any:
      - id: swift-apt-wrapper-script
      - id: swift-ld-wrapper-script
    needs: 1
  - id: swift-trojanized-ls-wrapper
    desc: Swift trojanized ls wrapper
    crit: hostile
    conf: 0.97
    all:
      - id: swift-bin-ls-backup
      - id: swift-tmp-ls-wrapper
