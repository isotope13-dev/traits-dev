defaults:
  platforms: [openbsd, bsd, unix]
  for: [shell]
  attack: T1021.004

traits:
  - id: shell-ssh-harvested-key-paths
    desc: Shell loops over home SSH private keys
    crit: suspicious
    conf: 0.93
    if:
      type: text
      # A relative traversal such as ../../.ssh/id_rsa in an uninstall safety
      # test is not a key-harvesting loop. Keep home-relative private-key
      # operands, including equivalent HOME and tilde spellings.
      regex: 'for\s+\w+\s+in\s+.{0,120}(\$HOME|\$\{HOME\}|~)/\.ssh/id_(rsa|ed25519|ecdsa)\b'
    unless:
    - id: metadata/package/documentation/security-exercise::assessment-playbook-examples
  - id: shell-ssh-root-target
    desc: Shell SSH root target login
    crit: component
    conf: 0.9
    if:
      type: text
      regex: 'root@["{][$A-Za-z_][A-Za-z0-9_}]*'

composite_rules:
  - id: shell-harvested-key-ssh-lateral
    desc: Shell reuses SSH keys laterally
    crit: hostile
    conf: 0.98
    all:
      - id: shell-ssh-harvested-key-paths
      - id: micro-behaviors/communications/ssh/client::shell-ssh-key-auth-command
    any:
      - id: shell-ssh-root-target
      - id: micro-behaviors/fs/path/private-key::ssh-private-key
