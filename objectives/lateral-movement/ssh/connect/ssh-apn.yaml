# OT pivoting through a private APN. The report's distinctive technique is not
# the vendor hardware: it is an SSH forward that crosses an APN boundary and
# is followed by ICS protocol reconnaissance.
defaults:
  platforms: [windows, unix]
  for: [scripts]
  attack: T1572,T1046

traits:
composite_rules:
  - id: private-apn-ics-ssh-pivot
    for:
    - python
    desc: SSH local forward from private APN into ICS recon
    crit: hostile
    conf: 0.98
    all:
    - id: micro-behaviors/data/parse/vocabulary::apn-named-assignment
    - id: micro-behaviors/communications/socket/port::ics-protocol-and-port-references
    - id: micro-behaviors/communications/ssh/connect::ssh-local-forward-call
    near_lines: 80
  - id: private-apn-ics-ssh-cli-pivot
    desc: SSH port forward from private APN into ICS recon
    crit: hostile
    conf: 0.98
    all:
    - id: micro-behaviors/data/parse/vocabulary::apn-named-assignment
    - id: micro-behaviors/communications/socket/port::ics-protocol-and-port-references
    - id: micro-behaviors/communications/ssh/connect::ssh-local-forward-command
    near_lines: 80
  - id: private-apn-ics-ssh2-pivot
    desc: Node.js SSH forward from private APN into ICS recon
    crit: hostile
    conf: 0.98
    for:
    - javascript
    - typescript
    all:
    - id: micro-behaviors/data/parse/vocabulary::apn-named-assignment
    - id: micro-behaviors/communications/socket/port::ics-protocol-and-port-references
    - id: micro-behaviors/communications/ssh/connect::ssh2-forward-out-call
    near_lines: 80
