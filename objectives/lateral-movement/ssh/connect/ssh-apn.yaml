# OT pivoting through a private APN. The report's distinctive technique is not
# the vendor hardware: it is an SSH forward that crosses an APN boundary and
# is followed by ICS protocol reconnaissance.
defaults:
  platforms: [windows, unix]
  for: [scripts]
  attack: T1572,T1046

traits:
  - id: apn-network-assignment
    desc: Private APN assignment
    crit: component
    conf: 0.94
    for: [python, javascript, powershell, go, ruby, perl, php]
    if:
      type: symbol
      kind: bind
      regex: '(?i)^(private[_-]?)?apn([_-](name|profile|network|cidr))?$'

  - id: apn-network-assignment-shell
    desc: Shell assigns a private APN
    crit: component
    conf: 0.94
    for: [shell]
    if:
      type: text
      regex: '(?im)^\s*(private[_-]?)?apn([_-](name|profile|network|cidr))?\s*='

composite_rules:
  - id: apn-assignment
    desc: Private APN assignment evidence
    crit: component
    conf: 0.94
    any:
      - id: apn-network-assignment
      - id: apn-network-assignment-shell

  - id: private-apn-ics-ssh-pivot
    desc: SSH local forward from private APN into ICS recon
    crit: hostile
    conf: 0.98
    all:
      - id: apn-assignment
      - id: objectives/discovery/network/scan/ics::ics-network-recon
      - id: micro-behaviors/communications/ssh/connect::ssh-local-forward-call
    near_lines: 80

  - id: private-apn-ics-ssh-cli-pivot
    desc: SSH port forward from private APN into ICS recon
    crit: hostile
    conf: 0.98
    all:
      - id: apn-assignment
      - id: objectives/discovery/network/scan/ics::ics-network-recon
      - id: micro-behaviors/communications/ssh/connect::ssh-local-forward-command
    near_lines: 80

  - id: private-apn-ics-ssh2-pivot
    desc: Node.js SSH forward from private APN into ICS recon
    crit: hostile
    conf: 0.98
    for: [javascript, typescript]
    all:
      - id: apn-assignment
      - id: objectives/discovery/network/scan/ics::ics-network-recon
      - id: micro-behaviors/communications/ssh/connect::ssh2-forward-out-call
    near_lines: 80
