defaults:
  for: [shell, python, javascript, elf, macho, pe]
  platforms:
    - linux
    - macos
    - windows
traits:
  - id: ssh-config-parse
    desc: Parses SSH config for hostnames
    crit: suspicious
    conf: 0.8
    attack: T1021.004
    platforms:
      - unix
    for: [scripts, binaries]
    if:
      type: text
      regex: grep.{0,30}HostName.{0,30}/\.ssh/config
composite_rules:
  - id: go-native-ssh-attack-client
    desc: Go client with SSH attack tasking
    crit: hostile
    conf: 0.98
    attack: T1110.001,T1021.004
    for:
    - elf
    all:
    - id: micro-behaviors/data/parse/vocabulary::ssh-attack-suffix
    - type: trait
      id: micro-behaviors/communications/ssh/client::openssh-protocol-banner
    - type: trait
      id: micro-behaviors/communications/proxy/socks::socks4-string
