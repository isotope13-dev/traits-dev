defaults:
  for: [c]
  platforms: [linux]

traits:
  - id: ebpf-authorized-key-backdoor-branch
    desc: Authorized-key backdoor branch
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: 'file_type\s*==\s*AUTHORIZED_KEYS\s*&&\s*\w+->backdoor_type\s*==\s*AUTH_BACKDOOR'
  - id: source-backdoor-public-key-setup
    desc: Calls backdoor public-key setup
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: 'set_backdoor_pubkey\s*\(\s*backdoor_publickey\b'
  - id: source-auth-backdoor-port-setup
    desc: Configures an authentication backdoor port
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: 'set_port\s*\([^,;]{1,40},\s*AUTH_BACKDOOR\b'
composite_rules:
  - id: ebpf-authorized-key-read-backdoor
    desc: eBPF read hook, authorized-key backdoor branch and user-memory write
    crit: hostile
    conf: 0.98
    attack: T1556
    all:
      - id: ebpf-authorized-key-backdoor-branch
      - id: micro-behaviors/os/bpf/program/tracing::syscall-read-exit-tracepoint-section
      - id: micro-behaviors/os/bpf/program/tracing::bpf-probe-write-user
      - id: micro-behaviors/os/bpf/program/maps::bpf-map-lookup
  - id: ebpf-ssh-backdoor-controller
    desc: SSH backdoor key and trigger port with eBPF map updates
    crit: hostile
    conf: 0.98
    attack: T1556
    all:
      - id: source-backdoor-public-key-setup
      - id: source-auth-backdoor-port-setup
      - id: micro-behaviors/crypto/asymmetric/ssh::ed25519-public-key-literal
      - id: micro-behaviors/os/bpf/program/maps::bpf-map-update
      - id: micro-behaviors/os/bpf/program/loader::bpf-skeleton
