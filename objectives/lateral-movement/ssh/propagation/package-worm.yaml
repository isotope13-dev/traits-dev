defaults:
  platforms: [linux]
  for: [shell]
composite_rules:
  # A package-poisoning worm sweeps private keys, imports known hosts, and
  # configures unattended SSH with a selected identity. This captures the
  # credential-driven propagation machinery without naming its wrapper.
  - id: package-worm-private-key-ssh
    desc: Package worm sweeps private keys and uses unattended SSH
    crit: hostile
    conf: 0.98
    attack: T1021.004,T1552.004
    all:
      - id: objectives/credential-access/ssh/key::shell-private-key-type-search
      - id: micro-behaviors/fs/path/public-key::ssh-known-hosts-read-command
      - id: micro-behaviors/communications/ssh/client::ssh-batch-mode-option
      - id: micro-behaviors/communications/ssh/client::ssh-identity-file-flag
      - id: objectives/supply-chain/hidden-payload/worm::aur-install-script-poisoning-push
