# SSH payload propagation: transfer a local artifact, then launch it remotely.
# The combination is the behavior of an SSH worm or agent spreader; each
# component remains neutral/suspicious so ordinary SSH automation is not
# treated as lateral movement by itself.
defaults:
  platforms: [unix]
  for: [shell, python, rust, go, c, cpp, objc, elf]
  attack: "T1021.004, T1105"

traits:
  - id: ssh-remote-downloader-shell-command
    desc: SSH remote downloader shell command
    crit: suspicious
    conf: 0.97
    attack: T1021.004,T1105,T1059.004
    if:
      type: text
      regex: '(?m)^\s*ssh\b[^\n]{0,280}\b(curl|wget|lwp-download)\b[^\n]{0,140}\|\s*(ba)?sh\b'

  - id: python-ssh-detached-temp-launch
    desc: Python launches detached temp payload over SSH
    crit: suspicious
    conf: 0.94
    for: [python]
    if:
      type: text
      regex: '(?s)subprocess\.\w+\([^)]{0,100}\bssh\b[^)]{0,140}\bnohup\s+/(tmp|var/tmp|dev/shm)/'

  # Non-interactive password SSH that runs an interpreter on the far side.
  #
  # `sshpass -p` supplies a password to `ssh` from the command line, which is
  # the only way to script password authentication; `StrictHostKeyChecking=no`
  # then removes the one check that would stop the connection succeeding
  # against a host the caller has never seen. Together they describe a client
  # that expects to meet hosts it does not know and to authenticate to them
  # with credentials it was handed — a fan-out, not an administrator
  # connecting to their own server.
  #
  # The interpreter tail is what makes it propagation rather than a remote
  # `uptime`: the command launched on the far host is a script run through
  # python/perl/bash, so whatever the caller spreads runs there.
  #
  # Kept language-neutral. IoT bots build this string with printf templates in
  # C, but the same one-liner appears verbatim in shell droppers and in Python
  # `subprocess` argument lists, and the matcher does not care which.
  - id: sshpass-remote-interpreter-launch
    desc: Password SSH launches a remote interpreter
    crit: suspicious
    conf: 0.95
    attack: T1021.004,T1078.001
    if:
      type: text
      regex: 'sshpass -p .{0,60}StrictHostKeyChecking=no.{0,80}\b(python|perl|bash)\b'

composite_rules:
  - id: ssh-chmod-command
    desc: Executed SSH command contains chmod action
    crit: component
    conf: 0.9
    any:
      - id: micro-behaviors/fs/chmod/remote

  # Public face of the chmod-then-relaunch shape, split by evidence class:
  # in command-bearing types (shell, interpreters, compiled binaries) the
  # matched text is the command that runs; in C-family source a quoted
  # pipeline is inert data until an execution primitive consumes it, so the
  # source child additionally requires one.
  - id: ssh-remote-chmod-launch
    desc: SSH command changes mode then launches payload
    crit: suspicious
    conf: 0.94
    any:
      - id: ssh-remote-chmod-launch-command-text
      - id: ssh-remote-chmod-launch-source

  - id: ssh-remote-chmod-launch-command-text
    desc: Command text changes mode then launches payload
    crit: suspicious
    conf: 0.94
    for: [shell, python, rust, go, elf]
    near_bytes: 260
    all:
      - id: ssh-chmod-command
      - id: micro-behaviors/fs/chmod/executable/mode::chmod-make-executable
      - id: micro-behaviors/process/create/local-exec::detached-temp-path-launch

  # C-family counterpart: the same chmod-then-relaunch shape, but the source
  # must also hold an execution primitive (system/exec/popen), without which
  # the quoted SSH pipeline is only data — detection fixtures and recovered
  # command notes look like this.
  - id: ssh-remote-chmod-launch-source
    desc: C source changes mode then launches payload
    crit: suspicious
    conf: 0.94
    for: [c, cpp, objc]
    near_bytes: 260
    all:
      - id: ssh-chmod-command
      - id: micro-behaviors/fs/chmod/executable/mode::chmod-make-executable
      - id: micro-behaviors/process/create/local-exec::detached-temp-path-launch
      - id: micro-behaviors/process/create/shell/native::c-source-command-execution

  - id: python-ssh-temp-payload-propagation
    desc: Python transfers and launches a temporary payload over SSH
    crit: suspicious
    conf: 0.96
    for: [python]
    near_bytes: 1200
    all:
      - id: micro-behaviors/communications/ssh/transfer::python-subprocess-scp-temp-upload
      - id: python-ssh-detached-temp-launch

  - id: ssh-key-driven-payload-propagation
    desc: Transfers and launches a payload over SSH
    crit: hostile
    conf: 0.98
    mbc: B0040
    all:
      - id: micro-behaviors/communications/ssh/transfer::scp-remote-temp-upload
      - id: ssh-remote-chmod-launch
      - id: micro-behaviors/communications/ssh/client::strict-host-disable
    any:
      - id: micro-behaviors/fs/path/private-key::ssh-private-key
      - id: micro-behaviors/fs/path/public-key::python-ssh-known-hosts-read
      - id: micro-behaviors/fs/path/public-key::ssh-known-hosts-read-command

  # Source lockers often ship SSH worm templates as string data next to a
  # real encrypt_file() body. The quoted ssh/scp/chmod lines are not passed
  # to system(), so ssh-key-driven-payload-propagation (which requires a
  # launch primitive in C) misses them; pairing the templates with the
  # encryption routine is the locker-spreader shape.
  - id: ssh-temp-payload-file-encryptor-spread
    desc: File encryptor spreads via SSH temp payload
    crit: hostile
    conf: 0.97
    attack: T1021.004,T1105,T1486
    for: [c, cpp]
    all:
      - id: micro-behaviors/communications/ssh/transfer::scp-remote-temp-upload
      - id: micro-behaviors/communications/ssh/client::strict-host-disable
      - id: micro-behaviors/fs/file/encrypt::native-file-encryption-routine
      - id: micro-behaviors/process/create/local-exec::detached-temp-path-launch
  - id: ssh-host-artifact-payload-propagation
    desc: SSH propagation seeds a remote payload
    crit: hostile
    conf: 0.99
    attack: T1021.004,T1087,T1105,T1059.004
    near_bytes: 1200
    all:
      - id: micro-behaviors/fs/path/secret-config::ssh-host-artifact-cluster
      - id: ssh-remote-downloader-shell-command

  # The fan-out plus what it spreads. On its own the sshpass one-liner is a bad
  # habit an administrator might still have; carried by a binary that also
  # holds a hardcoded operator endpoint or a named flood mode, it is the
  # spreader half of a DDoS bot — the same code that floods on command also
  # walks credentials outward and starts the flood script on each new host.
  - id: ssh-password-fanout-bot-propagation
    desc: Password SSH fan-out spreads a flood bot
    crit: hostile
    conf: 0.96
    attack: T1021.004,T1105,T1498
    all:
      - id: sshpass-remote-interpreter-launch
    any:
      - id: objectives/impact/dos/attack/botnet/
      - id: micro-behaviors/communications/ip/endpoint::external-ipv4-port-elf-static
      - id: micro-behaviors/communications/ip/endpoint::external-ipv4-port-elf
