# SSH payload propagation: transfer a local artifact, then launch it remotely.
# The combination is the behavior of an SSH worm or agent spreader; each
# component remains neutral/suspicious so ordinary SSH automation is not
# treated as lateral movement by itself.
defaults:
  platforms: [unix]
  for: [shell, python, rust, go, c, cpp, objc, elf]
  attack: "T1021.004, T1105"

traits:
  - id: scp-payload-destination
    desc: SCP sends file to remote temp
    crit: suspicious
    conf: 0.92
    if:
      type: text
      regex: '(?im)(^|[;&|])\s*scp\b[^\n]{0,260}:[\s]*/(tmp|var/tmp|dev/shm)/[^/\s"'']{1,128}'
    unless:
      - id: well-known/app/infrastructure/openshift::openshift-release-ci-step-context

  - id: ssh-chmod-shell-command
    desc: Shell script runs remote SSH chmod command
    crit: suspicious
    conf: 0.9
    for: [shell]
    if:
      type: text
      regex: '(?im)^[ \t]*(ssh|sudo[ \t]+ssh)\b[^\n;]{0,180}\bchmod\b'
    not:
      - regex: '(?i)\bssh\s+keys?\b'
    unless:
      - id: metadata/package/testing/presence/harness::test-directory
      - id: metadata/package/testing/presence/fixture::php-test-file
      - id: well-known/app/system/hedgehog-fabricator::official-fabricator-context
      - id: well-known/app/infrastructure/openshift::openshift-release-ci-step-context

  - id: go-ssh-chmod-process-command
    desc: Go process API runs SSH chmod command
    crit: suspicious
    conf: 0.9
    for: [go]
    if:
      type: text
      regex: '(?is)\bexec\.Command\s*\([^)]{0,300}\bssh\b[^)]{0,300}\bchmod\b'
    unless:
      - id: well-known/app/system/hedgehog-fabricator::official-fabricator-context

  - id: python-ssh-chmod-process-command
    desc: Python process API runs SSH chmod command
    crit: suspicious
    conf: 0.9
    for: [python]
    if:
      type: text
      regex: '(?is)\bsubprocess\.(Popen|run|call)\s*\([^)]{0,300}\bssh\b[^)]{0,300}\bchmod\b'
    unless:
      - id: well-known/app/system/hedgehog-fabricator::official-fabricator-context

  - id: rust-ssh-chmod-process-command
    desc: Rust process API runs SSH chmod command
    crit: suspicious
    conf: 0.9
    for: [rust]
    if:
      type: text
      regex: '(?is)\bCommand::new\s*\([^)]{0,300}\bssh\b[^)]{0,300}\bchmod\b'
    unless:
      - id: well-known/app/system/hedgehog-fabricator::official-fabricator-context

  - id: detached-payload-launch
    desc: Detached temporary-path payload launch
    crit: suspicious
    conf: 0.86
    attack: T1059
    if:
      type: text
      regex: '(?i)\b(nohup|setsid|systemd-run)\s+/(var/)?(tmp|dev/shm)/[^\s;|&]{1,120}'

  - id: ssh-bash-history-artifact
    desc: Bash history artifact
    crit: component
    conf: 0.9
    if: { type: text, substr: .bash_history }
  - id: ssh-config-artifact
    desc: SSH config artifact
    crit: component
    conf: 0.9
    if: { type: text, substr: .ssh/config }

  - id: ssh-remote-downloader-shell-command
    desc: SSH remote downloader shell command
    crit: suspicious
    conf: 0.97
    attack: T1021.004,T1105,T1059.004
    if:
      type: text
      regex: '(?m)^\s*ssh\b[^\n]{0,280}\b(curl|wget|lwp-download)\b[^\n]{0,140}\|\s*(ba)?sh\b'

composite_rules:
  - id: ssh-host-artifact-cluster
    desc: SSH host-artifact path cluster
    crit: suspicious
    conf: 0.96
    attack: T1087,T1552.003,T1021.004
    needs: 2
    unless:
      # Bash embeds these two strings as ordinary shell functionality.
      - id: metadata/file/string/identity::system-shell-basename
      - id: well-known/app/ai/vtcode::vtcode-agent-package
    any:
      - id: ssh-bash-history-artifact
      - id: micro-behaviors/fs/path/config/system::config-hosts
      - id: ssh-config-artifact
  - id: ssh-chmod-command
    desc: Executed SSH command contains chmod action
    crit: suspicious
    conf: 0.9
    any:
      - id: ssh-chmod-shell-command
      - id: go-ssh-chmod-process-command
      - id: python-ssh-chmod-process-command
      - id: rust-ssh-chmod-process-command

  - id: ssh-remote-chmod-launch
    desc: SSH command changes mode then launches payload
    crit: suspicious
    conf: 0.94
    near_bytes: 260
    all:
      - id: ssh-chmod-command
      - id: micro-behaviors/fs/chmod/executable/mode::chmod-make-executable
      - id: detached-payload-launch

  - id: ssh-key-driven-payload-propagation
    desc: Transfers and launches a payload over SSH
    crit: hostile
    conf: 0.98
    mbc: B0040
    all:
      - id: scp-payload-destination
      - id: ssh-remote-chmod-launch
      - id: micro-behaviors/communications/ssh/client::strict-host-disable
    any:
      - id: micro-behaviors/fs/path/sensitive/credentials::ssh-private-key
      - id: micro-behaviors/fs/path/sensitive/credentials::python-ssh-known-hosts-read
      - id: micro-behaviors/fs/path/sensitive/credentials::ssh-known-hosts-read-command
  - id: ssh-host-artifact-payload-propagation
    desc: SSH propagation seeds a remote payload
    crit: hostile
    conf: 0.99
    attack: T1021.004,T1087,T1105,T1059.004
    near_bytes: 1200
    all:
      - id: ssh-host-artifact-cluster
      - id: ssh-remote-downloader-shell-command
