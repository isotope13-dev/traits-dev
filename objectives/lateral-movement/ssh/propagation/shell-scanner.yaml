defaults:
  platforms: [unix]
  for: [shell]
  attack: T1021.004,T1078.001
composite_rules:
  - id: irc-implant-password-ssh-deployment
    desc: IRC implant with password SSH deployment
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/fs/path/self::realpath-current-script
      - id: micro-behaviors/communications/ssh/client::sshpass-tool-reference
      - id: micro-behaviors/communications/ssh/transfer::scp-variable-temp-upload
      - id: micro-behaviors/communications/ssh/transfer::ssh-temp-execute
      - id: micro-behaviors/communications/ssh/client::strict-host-disable
      - id: micro-behaviors/communications/socket/port::cli-port-flag-legacy-service
      - id: objectives/command-and-control/channel/irc/bot::signed-shell-command-response
