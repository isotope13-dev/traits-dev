# Co-occurrence of a specific execution-control bypass with SSH transfer and
# remote-shell preparation. Administrative use remains possible; this does not
# assert data flow, successful execution, or ransomware identity.
defaults:
  platforms: [linux, macos, windows]
  for: [scripts, source, binaries]

composite_rules:
  - id: esxi-execution-bypass-ssh-deployment
    desc: ESXi bypass with SCP upload and SSH shell
    crit: suspicious
    conf: 0.97
    attack: T1021.004,T1570,T1562.001
    all:
      - id: micro-behaviors/communications/ssh/connect::posh-ssh-session
      - id: micro-behaviors/communications/ssh/client::posh-ssh-shell-stream
      - id: micro-behaviors/communications/ssh/transfer::posh-scp-upload
    any:
      - id: objectives/evasion/security-bypass/policy/execution::esxi-runtime-exec-installed-only-disable
      - id: objectives/evasion/security-bypass/policy/execution::esxi-runtime-exec-installed-only-disable-value-first
      - id: objectives/evasion/security-bypass/policy/execution::native-esxi-runtime-execution-bypass-command
