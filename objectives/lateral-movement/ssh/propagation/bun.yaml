defaults:
  platforms: [unix]
  for: [javascript, typescript]
  attack: T1021.004,T1105
composite_rules:
  - id: bun-self-read-ssh-payload-spread
    desc: Self-read with SSH transfer and Bash launch
    crit: suspicious
    conf: 0.96
    # Structural calls, not the author's choice of method or payload names.
    # Cooccurrence does not prove that the transferred bytes are the self-read.
    all:
      - id: micro-behaviors/fs/read/self::bun-read-main-entry
      - id: micro-behaviors/communications/ssh/transfer::bun-scp-stdin-transfer
      - id: micro-behaviors/communications/ssh/transfer::bun-ssh-bash-command
      - id: micro-behaviors/communications/ssh/client::strict-host-disable
