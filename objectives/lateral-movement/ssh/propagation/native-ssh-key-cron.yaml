defaults:
  for: [c, objective_c]
  platforms: [unix]
  attack: T1021.004,T1098.004,T1053.003

traits:
  - id: native-ssh-key-cron-propagation
    desc: SSH key deployment and remote cron execution
    crit: hostile
    conf: 0.98
    if:
      type: yara
      source: |
        rule native_ssh_key_cron_propagation {
          strings:
            $system = /system[ \t]*\(/
            $sshpass = "sshpass -p "
            $copy = "ssh-copy-id "
            $authorized = "/.ssh/authorized_keys"
            $cron = "| crontab -"
          condition:
            all of them
        }
