defaults:
  platforms: [unix]
  for: [elf, macho]

composite_rules:
  - id: go-ssh-credential-worm
    desc: Go SSH password worm with sudo escalation, key drop, and chmod staging
    crit: hostile
    conf: 0.97
    attack: T1110.001,T1098.004,T1210
    all:
      - id: micro-behaviors/communications/ssh/configure::go-bin-ssh-password-symbol
      - id: micro-behaviors/communications/ssh/configure::go-bin-ssh-session-exec-symbol
      - id: micro-behaviors/communications/ssh/client::go-bin-insecure-host-key
      - id: micro-behaviors/os/privilege/elevation::sudo-stdin-password
      - id: micro-behaviors/fs/path/public-key::ssh-authorized-keys
      - id: micro-behaviors/fs/chmod/executable/mode::chmod-make-executable
