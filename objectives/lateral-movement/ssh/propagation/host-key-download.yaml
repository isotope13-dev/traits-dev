# Host discovery and deployment templates coexist; no static data-flow claim.
defaults:
  platforms: [linux, macos]
  for: [elf, shell]
composite_rules:
  - id: ssh-host-discovery-detached-download
    desc: SSH host discovery with detached download deployment
    crit: suspicious
    conf: 0.97
    attack: T1021.004,T1105
    all:
      - id: micro-behaviors/fs/path/public-key::ssh-known-hosts-read-command
      - id: micro-behaviors/communications/ssh/client::ssh-key-detached-shell-command
      - id: micro-behaviors/communications/ssh/client::ssh-remote-download-command
