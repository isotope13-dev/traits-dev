defaults:
  platforms: [unix]
  for: [javascript, typescript]
composite_rules:
  # The matcher establishes local co-occurrence, not the identity of the SCP
  # input buffer. The reviewed specimen's execution path binds its own source
  # to the transferred buffer, but deployments can also use this machinery.
  - id: bun-self-source-scp-remote-shell
    desc: Self-source read, SCP, and remote shell
    crit: suspicious
    conf: 0.97
    attack: T1021.004,T1570
    all:
      - id: micro-behaviors/fs/read/file/full::bun-main-source-text-read
      - id: micro-behaviors/communications/ssh/transfer::bun-scp-stdin-source
      - id: micro-behaviors/communications/ssh/client::bun-ssh-remote-bash-command
      - id: micro-behaviors/communications/ssh/client::ssh-batch-mode-option
