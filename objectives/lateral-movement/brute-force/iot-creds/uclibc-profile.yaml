defaults:
  platforms: [linux, android]
  for: [elf]
composite_rules:
  - id: uclibc-iot-credential-attack-shell-profile
    desc: IoT credential-attack bot with uClibc and shell references
    crit: suspicious
    conf: 0.9
    attack: T1110.001
    all:
      - id: objectives/lateral-movement/brute-force/iot-creds::mirai-credential-telnet-attack-bot
      - id: metadata/binary/header/identity::elf-executable-type
      - id: well-known/lib/native/uclibc::static-uclibc-string-tables
      - id: micro-behaviors/fs/path/config/system
    any:
      - id: micro-behaviors/process/interpreter/shell::bin-sh
      - id: micro-behaviors/process/create/shell/spawn::bin-sh-binary-text
      - id: micro-behaviors/process/create/shell/spawn::system-fn
    unless:
      - id: well-known/tool/sysadmin/busybox::busybox-banner
      - id: well-known/tool/sysadmin/busybox::busybox-binary
      # Standalone ash/hush applets lack the multi-call banner but are BusyBox.
      - id: well-known/tool/sysadmin/busybox::busybox-standalone-applet
      - id: well-known/tool/sysadmin/unix-benign/

