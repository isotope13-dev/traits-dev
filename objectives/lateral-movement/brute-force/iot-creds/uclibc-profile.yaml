defaults:
  platforms: [linux, android]
  for: [elf]
composite_rules:
  # Preserve the original system-directory selector after scheduled paths
  # moved to their own subject category. Only its former members are added.
  - id: system-or-scheduled-config-reference
    desc: System or scheduled-job config path reference
    crit: component
    conf: 0.9
    any:
      - id: micro-behaviors/fs/path/config/system
      - id: micro-behaviors/fs/path/config/network::hosts-file-path
      - id: micro-behaviors/fs/path/config/network::managed-windows-hosts-path-components
      - id: micro-behaviors/fs/path/config/network::postinstall-etc-hosts-reference
      - id: micro-behaviors/fs/path/config/network::config-hosts
      - id: micro-behaviors/fs/path/config/network::config-hosts-bytecode
      - id: micro-behaviors/fs/path/config/network::hidden-hosts-backup-bytecode
      - id: micro-behaviors/fs/path/config/network::config-resolv
      - id: micro-behaviors/fs/path/config/network::config-resolv-xor
      - id: micro-behaviors/fs/path/config/network::config-resolv-xor62
      - id: micro-behaviors/fs/path/config/network::config-resolv-xor18
      - id: micro-behaviors/fs/path/config/network::windows-hosts-file
      - id: micro-behaviors/fs/path/config/network::windows-hosts-relative-path
      - id: micro-behaviors/fs/path/config/network::windows-hosts-template-path
      - id: micro-behaviors/fs/path/config/network::windows-hosts-backup-template
      - id: micro-behaviors/fs/path/config/scheduled::etc-cron-path
      - id: micro-behaviors/fs/path/config/scheduled::cron-configuration-path-reference
      - id: micro-behaviors/fs/path/config/scheduled::config-crontab
      - id: micro-behaviors/fs/path/config/scheduled::cron-d-path-reference
      - id: micro-behaviors/fs/path/config/scheduled::cron-periodic-directory-path
      - id: micro-behaviors/fs/path/config/scheduled::root-crontab-spool-path
      - id: micro-behaviors/fs/path/config/scheduled::var-spool-cron-path
      - id: micro-behaviors/fs/path/config/scheduled::root-at-crontab-path
      - id: micro-behaviors/fs/path/config/scheduled::openwrt-root-crontab-path
  - id: uclibc-iot-credential-attack-shell-profile
    desc: IoT credential-attack bot with uClibc and shell references
    crit: suspicious
    conf: 0.9
    attack: T1110.001
    all:
      - id: objectives/lateral-movement/brute-force/iot-creds::mirai-credential-telnet-attack-bot
      - id: metadata/binary/header/identity::elf-executable-type
      - id: well-known/lib/native/uclibc::static-uclibc-string-tables
      - id: system-or-scheduled-config-reference
    any:
      - id: micro-behaviors/fs/path/application/interpreter::unix-shell-executable-path
      - id: micro-behaviors/fs/path/application/interpreter::bin-sh-path-reference
      - id: micro-behaviors/process/create/subprocess/reference::system-command-api-clues
    unless:
      - id: well-known/tool/sysadmin/busybox::busybox-banner
      - id: well-known/tool/sysadmin/busybox::busybox-binary
      # Standalone ash/hush applets lack the multi-call banner but are BusyBox.
      - id: well-known/tool/sysadmin/busybox::busybox-standalone-applet
