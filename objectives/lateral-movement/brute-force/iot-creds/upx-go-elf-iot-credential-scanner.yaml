# A UPX-packed Go ELF that carries Mirai-family IoT default credentials, dials
# out with raw network syscalls and keeps a hidden lock file under /tmp is an
# IoT scanning bot: the credential table is the brute-force wordlist and the
# packer hides the rest of the program.
defaults:
  platforms: [linux]
  for: [elf]
  attack: T1110.001,T1027.002,T1595.001
composite_rules:
  - id: upx-go-elf-with-mirai-credentials-and-hidden-lock
    desc: UPX Go ELF with IoT credential list and hidden lock
    crit: hostile
    conf: 0.85
    all:
      - id: objectives/anti-static/pack/detect::upx-packed-elf
      - id: metadata/lang/compiler/systems::go-binary
      - id: objectives/lateral-movement/brute-force/iot-creds::mirai-credential-access
      - id: micro-behaviors/fs/path/temp::hidden-tmp-path
