defaults:
  platforms:
    - unix
    - android
  for:
    - elf
traits:
  - id: mirai-cred-admin
    desc: Mirai credential variant (7ujMko0admin)
    crit: suspicious
    conf: 0.8
    attack: T1110.001
    if:
      type: text
      substr: 7ujMko0admin
  - id: iot-password-vizxv
    desc: IoT default password token vizxv
    crit: suspicious
    conf: 0.8
    attack: T1110.001
    if:
      type: text
      substr: vizxv
  - id: mirai-cred-juantech
    desc: Mirai credential variant (juantech)
    crit: suspicious
    conf: 0.75
    attack: T1110.001
    if:
      type: text
      substr: juantech
  - id: mirai-cred-xc3511
    desc: Mirai credential variant (xc3511)
    crit: suspicious
    conf: 0.8
    attack: T1110.001
    if:
      type: text
      substr: xc3511
  - id: mirai-cred-jvbzd
    desc: Mirai credential variant (jvbzd)
    crit: suspicious
    conf: 0.8
    attack: T1110.001
    if:
      type: text
      substr: jvbzd
    unless:
      - id: well-known/tool/detection/malcontent::malcontent-defensive-scanner-context
  - id: mirai-cred-smcadmin
    desc: Mirai credential variant (smcadmin)
    crit: suspicious
    conf: 0.75
    attack: T1110.001
    if:
      type: text
      substr: smcadmin
  - id: mirai-cred-gm8182
    desc: Mirai credential variant (GM8182)
    crit: suspicious
    conf: 0.8
    attack: T1110.001
    if:
      type: text
      substr: GM8182
  - id: mirai-cred-oelinux
    desc: Mirai credential variant (oelinux123)
    crit: suspicious
    conf: 0.8
    attack: T1110.001
    if:
      type: text
      substr: oelinux123
  - id: mirai-cred-hi3518
    desc: Mirai credential variant (hi3518)
    crit: suspicious
    conf: 0.8
    attack: T1110.001
    if:
      type: text
      substr: hi3518
  - id: camera-cred-xmhdipc
    desc: IP camera credential (xmhdipc)
    crit: suspicious
    conf: 0.8
    attack: T1110.001
    if:
      type: text
      substr: xmhdipc
    unless:
      - id: well-known/tool/detection/malcontent::malcontent-defensive-scanner-context
  - id: router-cred-zte
    desc: Router credential (Zte521)
    crit: suspicious
    conf: 0.75
    attack: T1110.001
    if:
      type: text
      substr: Zte521
  - id: router-cred-huawei
    desc: Router credential (telecomadmin)
    crit: suspicious
    conf: 0.75
    attack: T1110.001
    if:
      type: text
      substr: telecomadmin
  - id: telnet-scanner-str
    desc: Telnet scanner string
    crit: suspicious
    conf: 0.6
    attack: T1110.001
    if:
      type: text
      regex: (?i)telnet scanner
  - id: telnet-brute-str
    desc: Telnet brute string
    crit: suspicious
    conf: 0.6
    attack: T1110.001
    if:
      type: text
      regex: (?i)telnet brute
  - id: mirai-cred-prefix
    desc: Mirai credential prefix (7ujMko0)
    crit: suspicious
    conf: 0.8
    attack: T1110.001
    if:
      type: text
      substr: 7ujMko0
  - id: telnet-port-scan
    desc: Telnet port 23 scanning indicator
    crit: suspicious
    conf: 0.75
    attack: T1110.001
    if:
      type: text
      substr: port 23 open
      case_insensitive: true
  - id: telnet-infection-outcome-report
    desc: Telnet infection outcome report over IRC
    crit: suspicious
    conf: 0.9
    attack: T1110.001,T1071.001
    if:
      type: text
      regex: '\[TELNET\] (CRACKED|INFECTED|FAILED TO INFECT)\b'
  - id: router-shell-enable
    desc: Router shell enable sequence
    crit: suspicious
    conf: 0.8
    attack: T1110.001
    if:
      type: text
      substr: 'enable

        shell

        sh'
  - id: iot-cred-neworang
    desc: NewOrange IoT default credential
    crit: suspicious
    conf: 0.9
    attack: T1110.001
    if:
      type: text
      exact: neworang
  - id: mirai-cred-loldongs
    desc: Mirai credential variant (loldongs)
    crit: suspicious
    conf: 0.85
    attack: T1110.001
    if:
      type: text
      substr: loldongs
  - id: router-cred-gpon
    desc: Router credential variant (Xpon@Olt9417#)
    crit: suspicious
    conf: 0.85
    attack: T1110.001
    if:
      type: text
      substr: Xpon@Olt9417#
  - id: router-cred-sugar
    desc: Router credential variant (SUGAR2A041)
    crit: suspicious
    conf: 0.85
    attack: T1110.001
    if:
      type: text
      substr: SUGAR2A041
  # Mirai-lineage bots XOR their telnet spray dictionary with a one-byte key
  # (tadashi.mips: key 0x45, NUL terminators become the key byte), so every
  # plaintext credential atom above stays dark. YARA's xor modifier tries all
  # keys per string; key 0 is excluded so a plaintext table -- already covered
  # above -- is not counted twice. The dictionary is one contiguous table:
  # three credentials must share a 4KB window. Separate 5-byte hits under
  # unrelated keys are ordinary in a large Go binary.
  - id: xor-encoded-iot-credential-table
    desc: XOR-hidden IoT default credential table
    crit: suspicious
    conf: 0.93
    attack: T1110.001,T1027
    size_max: 33554432
    if:
      type: yara
      source: |
        rule xor_encoded_iot_credential_table {
          strings:
            $c01 = "xc3511" xor(1-255)
            $c02 = "vizxv" xor(1-255)
            $c03 = "7ujMko0" xor(1-255)
            $c04 = "juantech" xor(1-255)
            $c05 = "jvbzd" xor(1-255)
            $c06 = "smcadmin" xor(1-255)
            $c07 = "oelinux123" xor(1-255)
            $c08 = "hi3518" xor(1-255)
            $c09 = "xmhdipc" xor(1-255)
            $c10 = "Zte521" xor(1-255)
            $c11 = "telecomadmin" xor(1-255)
            $c12 = "t0talc0ntr0l4!" xor(1-255)
            $c13 = "hunt5759" xor(1-255)
            $c14 = "ipcam_rt5350" xor(1-255)
            $c15 = "zlxx." xor(1-255)
            $c16 = "klv1234" xor(1-255)
            $c17 = "zsun1188" xor(1-255)
            $c18 = "1001chin" xor(1-255)
          condition:
            for any of ($c*) : (
              for any m in (1..#) : (
                3 of ($c*) in (@[m] .. @[m] + 4096)
              )
            )
        }
composite_rules:
  # Keyed on distinct *device-specific* credentials. This was one alternation
  # regex over root|admin|default|password|12345 with `count_min: 4`, which
  # counts repeats of the same match -- four occurrences of "default" satisfied
  # it, and GLib carries dozens (default handler, default value, tree roots),
  # so libglib-2.0 scored a suspicious IoT-brute-force finding. Those five are
  # ordinary vocabulary; naming them as atoms is not an option either, since a
  # bare `root` in an objectives/ tree is an intent finding that fires on
  # benign fixtures. The vendor credentials below cannot appear by accident,
  # and a real spray table carries several.
  - id: iot-default-credential-token-cluster
    desc: Multiple known IoT default credentials
    crit: suspicious
    conf: 0.92
    attack: T1110.001
    needs: 3
    unless:
      - id: mirai-credential-telnet-attack-bot
    any:
      - id: iot-password-vizxv
      - id: mirai-cred-juantech
      - id: mirai-cred-jvbzd
      - id: mirai-cred-smcadmin
      - id: mirai-cred-gm8182
      - id: mirai-cred-oelinux
      - id: mirai-cred-hi3518
      - id: camera-cred-xmhdipc
      - id: router-cred-zte
      - id: router-cred-huawei
  # An obfuscated IoT spray dictionary inside a binary that dials out through
  # raw socket/connect syscalls: the propagation half of a Mirai-lineage bot.
  - id: xor-credential-table-direct-network-bot
    desc: Hidden IoT credential table with raw-syscall dialer
    crit: hostile
    conf: 0.97
    attack: T1110.001,T1027
    mbc: E1017
    all:
      - id: xor-encoded-iot-credential-table
    any:
      - id: micro-behaviors/communications/socket/syscall::mips-direct-network-syscalls
      - id: micro-behaviors/communications/socket/syscall::arm-direct-network-syscalls
      - id: micro-behaviors/communications/socket/syscall::arm-oabi-direct-network-syscalls
      - id: micro-behaviors/communications/socket/syscall::arm-oabi-direct-socket-connect-pair
      - id: micro-behaviors/communications/socket/syscall::arm-literal-pool-network-syscalls
      - id: micro-behaviors/communications/socket/syscall::arm-literal-pool-socket-connect-pair
      - id: micro-behaviors/communications/socket/syscall::i386-socketcall-wrapper
      - id: micro-behaviors/communications/socket/syscall::aarch64-direct-network-syscalls

  - id: telnet-scan-or-brute-description
    desc: Telnet scanning or brute-force description
    crit: suspicious
    conf: 0.7
    attack: T1110.001
    any:
      - id: telnet-scanner-str
      - id: telnet-brute-str
  - id: busybox-download
    desc: BusyBox download exploitation
    crit: suspicious
    conf: 0.8
    attack: T1110.001
    all:
      - id: telnet-scan-or-brute-description
    any:
      - id: micro-behaviors/communications/http/download/curl::wget
      - id: micro-behaviors/communications/tftp/download::tftp
  - id: iot-credential-spray-command-injection-loader
    desc: IoT credential spray with command-injection payload loader
    crit: hostile
    conf: 0.99
    attack: T1110.001,T1190,T1105,T1059.004
    mbc: E1110
    all:
      - id: iot-default-credential-token-cluster
      - id: micro-behaviors/process/create/local-exec::embedded-download-chmod-execute-chain
      - id: micro-behaviors/process/argument/subcommand::busybox-bot-marker-command
    # The specific Mirai credential/stager detector describes the same
    # propagation routine with stronger evidence; avoid two hostile verdicts
    # for one behavior.
    downgrade:
      any:
        - id: mirai-credential-busybox-stager
  # Plaintext variant tables (no 7ujMko0 prefix) miss the vendor cluster
  # that gates the spray loader above, so the classic stager stays dark.
  # Two distinct vendor credentials with a piped download and a
  # chmod-and-execute chain is the same fetch-and-run propagation.
  - id: mirai-credential-pipe-chmod-stager
    desc: Mirai credentials with piped download and chmod-execute staging
    crit: hostile
    conf: 0.97
    attack: T1110.001,T1105
    mbc: E1017
    downgrade:
      any:
        - id: mirai-credential-busybox-stager
    all:
      - id: mirai-credential-access
      - id: micro-behaviors/process/create/shell/pipeline::shell-pipes-downloaded-script
      - id: micro-behaviors/process/create/local-exec::chmod-then-local-execute-command
    any:
      - id: micro-behaviors/fs/path/binary::bin-busybox-path
      - id: micro-behaviors/fs/proc/info/path::proc-net-tcp
    needs: 1
  # Credentials plus download syntax do not bind authentication to staging.
  # Keep this as a suspicious co-occurrence, including unpacked binaries.
  - id: iot-default-credentials-with-downloader
    desc: IoT default credentials with download-output syntax
    crit: suspicious
    conf: 0.96
    platforms: [linux]
    all:
      - id: mirai-credential-access
      - id: micro-behaviors/communications/http/download/cli::fetch-output-option-script
    downgrade:
      any:
        - id: mirai-credential-busybox-stager
        - id: mirai-credential-pipe-chmod-stager
    unless:
      - id: well-known/tool/detection/malcontent::malcontent-defensive-scanner-context
  - id: mirai-credential-access
    desc: Two distinct IoT default credential variants
    crit: suspicious
    conf: 0.95
    attack: T1110.001
    mbc: E1017
    needs: 2
    downgrade:
      any:
        - id: mirai-credential-telnet-attack-bot
    any:
      - id: mirai-cred-admin
      - id: iot-password-vizxv
      - id: mirai-cred-juantech
      - id: mirai-cred-xc3511
      - id: mirai-cred-jvbzd
      - id: mirai-cred-smcadmin
      - id: mirai-cred-gm8182
      - id: mirai-cred-oelinux
      - id: mirai-cred-hi3518
      - id: mirai-cred-loldongs
      - id: router-cred-gpon
      - id: router-cred-sugar
      - id: router-cred-zte
  - id: iot-credential-spray-profile
    desc: Known IoT credential spray table
    crit: hostile
    conf: 0.98
    attack: T1110.001,T1021.007
    mbc: E1017
    all:
      - id: mirai-cred-xc3511
      - id: iot-default-credential-token-cluster
      - id: iot-cred-neworang
  - id: mirai-credential-busybox-stager
    desc: Mirai credential list with BusyBox payload stager
    crit: hostile
    conf: 0.97
    attack: T1110.001,T1105
    mbc: E1017
    all:
      - id: mirai-cred-admin
      - id: iot-password-vizxv
      - id: mirai-cred-xc3511
      - id: objectives/lateral-movement/brute-force/iot::admin1234
      - id: micro-behaviors/fs/proc/info/path::proc-net-tcp
      - id: micro-behaviors/process/create/shell/pipeline::shell-pipes-downloaded-script
    any:
      - id: micro-behaviors/communications/http/download/busybox::busybox-wget-http-reference
      - id: micro-behaviors/communications/ftp/download/busybox::ftpget-elf-reference
      - id: micro-behaviors/communications/tftp/download::tftp-elf-reference
      - id: micro-behaviors/communications/http/download/cli::shell-chained-downloader-command
  - id: mirai-credential-static-endpoint
    desc: Static uClibc binary combines Mirai credentials and remote endpoint
    crit: suspicious
    conf: 0.92
    attack: T1110.001
    mbc: E1017
    all:
      - id: mirai-credential-access
      - id: well-known/lib/native/uclibc::static-uclibc-string-tables
    any:
      - id: micro-behaviors/communications/ip/literal::external-ipv4-binary
      - id: micro-behaviors/communications/ip/literal::external-ipv4-shaped-text-binary
      - id: micro-behaviors/communications/ip/literal::http-ip-url
  # A credential dictionary and a proxy banner do not establish brute force
  # or identify a bot. The former xc3511/proc-self-exe variant duplicated this
  # observation using one password and a generic self-image reference.
  - id: iot-default-credentials-with-proxy-banner
    desc: IoT default credentials with SOCKS banner
    crit: suspicious
    conf: 0.96
    platforms: [linux]
    all:
      - id: mirai-credential-access
      - id: micro-behaviors/communications/proxy/socks::socks5-proxy-status-banner
    unless:
      - id: well-known/tool/detection/malcontent::malcontent-defensive-scanner-context
  - id: mirai-telnet-credential-spray
    desc: Mirai credential spray with Telnet status and procfs scan
    crit: hostile
    conf: 0.98
    attack: T1110.001,T1046
    mbc: E1017
    platforms: [linux]
    all:
      - id: mirai-credential-access
      - id: micro-behaviors/communications/socket/telnet::telnet-deployment-status
      - id: micro-behaviors/fs/proc/info/pid::process-pid-exe-template

  - id: mirai-credential-shell-stager
    desc: Mirai credentials paired with Telnet shell injection
    crit: hostile
    conf: 0.99
    attack: T1110.001,T1059.004,T1021.007
    mbc: E1017
    platforms: [linux]
    all:
      - id: mirai-credential-access
      - id: micro-behaviors/process/create/shell/spawn::embedded-shell-launch-sequence
    any:
      - id: micro-behaviors/communications/socket/telnet::telnet-port-endpoint-reference
      - id: micro-behaviors/communications/socket/telnet::embedded-telnet-server-banner
      - id: telnet-attack
    needs: 1
    unless:
      - id: mirai-credential-telnet-attack-bot
  - id: mirai-credential-telnet-attack-bot
    desc: IoT credentials with Telnet shell launch
    crit: hostile
    conf: 0.98
    attack: T1110.001,T1021.007
    mbc: E1017
    platforms: [linux]
    all:
      - id: mirai-credential-access
      - id: telnet-attack
      - id: micro-behaviors/process/create/shell/spawn::embedded-shell-launch-sequence
  # Kaiten-lineage bots report each Telnet brute-force outcome to their IRC
  # channel ([TELNET] CRACKED / INFECTED / FAILED TO INFECT) instead of
  # Mirai's scanner dialogue, so the Mirai telnet-attack legs stay dark.
  # Credential table plus outcome reports over an IRC command channel is the
  # same spread routine with equivalent evidence in three roles.
  - id: telnet-spray-irc-infection-report-bot
    desc: Telnet spray bot reports infections over IRC
    crit: hostile
    conf: 0.97
    attack: T1110.001,T1071.001
    mbc: E1017
    platforms: [linux]
    all:
      - id: mirai-credential-access
      - id: telnet-infection-outcome-report
      - id: micro-behaviors/communications/irc/command::privmsg-command-bytes
    unless:
      - id: metadata/package/testing/
      - id: well-known/tool/offensive/
      - id: well-known/tool/detection/malcontent::malcontent-defensive-scanner-context
      - id: "metadata/file/naming::test-directory-component"
  - id: telnet-attack
    desc: IoT credentials with Telnet shell/scan dialogue
    crit: suspicious
    conf: 0.95
    attack: T1110.001
    all:
      - id: mirai-credential-access
    any:
      - id: telnet-port-scan
      - id: router-shell-enable
      - id: micro-behaviors/communications/socket/telnet::xor54-enable-shell-commands
    downgrade:
      any:
        - id: mirai-credential-telnet-attack-bot
  # These architecture-neutral profiles establish content co-occurrence.
  # A Source Engine query is also used by ordinary game clients; neither
  # profile proves scanning, command reception or packet flooding. Keep
  # those claims in rules requiring the corresponding implementation.
  - id: xor-credential-table-source-query-device-profile
    desc: Hidden IoT credentials, VSE query and device markers
    crit: suspicious
    conf: 0.95
    attack: T1110.001,T1027
    all:
      - id: xor-encoded-iot-credential-table
      - id: micro-behaviors/communications/socket/udp::source-engine-query-payload
    any:
      - id: micro-behaviors/fs/path/application/executable::sofia-executable-path
      - id: micro-behaviors/fs/path/device/special::dev-misc-watchdog-elf-text
      - id: micro-behaviors/fs/path/binary::bin-busybox-path
    needs: 2

  - id: xor-credential-table-device-profile
    desc: Hidden IoT credentials and device markers
    crit: suspicious
    conf: 0.98
    attack: T1110.001,T1027
    platforms: [linux]
    all:
      - id: xor-encoded-iot-credential-table
      - id: mirai-credential-access
    any:
      - id: micro-behaviors/fs/path/application/executable::sofia-executable-path
      - id: micro-behaviors/fs/path/device/special::dev-misc-watchdog-elf-text
      - id: micro-behaviors/fs/path/device/special::dev-watchdog-elf-text
      - id: micro-behaviors/fs/path/binary::bin-busybox-path
    needs: 2

  - id: dvr-executable-hidden-credential-table

    desc: DVR executable references with hidden credentials
    crit: suspicious
    conf: 0.95
    all:
      - id: micro-behaviors/fs/path/application/executable::dvr-platform-executable-references
      - id: xor-encoded-iot-credential-table
    unless:
      - id: metadata/signed/platform/

  # Independent implementation evidence: hidden device-specific credentials,
  # the bounded byte-XOR decoder, and construction of TCP SYNs to port 23.
  # No filename, controller address or platform executable name is required.
  - id: arm-hidden-telnet-credential-scanner
    desc: Hidden IoT credentials with ARM Telnet scanner code
    crit: hostile
    conf: 0.98
    attack: T1110.001,T1046
    all:
      - id: xor-encoded-iot-credential-table
      - id: micro-behaviors/data/arithmetic::arm-indexed-xor54-byte-loop
      - id: micro-behaviors/communications/socket/tcp::arm-tcp-syn-telnet-header

  # Obfuscated IoT credential table combined with an embedded SSH client:
  # the propagation half of an IoT SSH worm.
  - id: xor-credential-table-ssh-worm-spreader
    desc: Hidden IoT credentials with SSH spreader client
    crit: hostile
    conf: 0.98
    attack: T1110.001,T1021.004,T1105
    mbc: E1017,B0040
    all:
      - id: xor-encoded-iot-credential-table
    any:
      - id: micro-behaviors/communications/ssh/client::ssh-userauth
      - id: micro-behaviors/communications/ssh/client::libssh
      - id: micro-behaviors/communications/ssh/client::openssh-protocol-banner
    unless:
      - id: metadata/package/testing/
      - id: well-known/tool/

