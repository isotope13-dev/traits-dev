# Mutated Mirai builds split the textbook credential markers (xc3511,
# cat1029) with junk bytes so whole-token detectors miss them, but the
# surviving fragments co-occur with the downloader context: a BusyBox binary
# embedding a download URL that also carries two Mirai-table fragments is a
# brute-forcing downloader, not a coincidence. Neither fragment convicts
# alone; nothing references them outside this composite.
defaults:
  platforms:
    - unix
    - android
  for:
    - elf
  attack: T1110.001,T1105
composite_rules:
  - id: mutated-mirai-table-iot-downloader
    desc: Mutated Mirai table in IoT downloader
    crit: hostile
    conf: 0.9
    all:
      - id: mirai-cred-xc35-fragment
      - id: mirai-cred-t1029-fragment
      - id: micro-behaviors/process/argument/subcommand::busybox-name-reference
      - id: micro-behaviors/communications/http/url/scheme::cleartext-http-url-elf
    unless:
      - id: well-known/tool/detection/malcontent::malcontent-defensive-scanner-context
