defaults:
  platforms: [linux]
  for: [elf]
  arch: [x86-64]
composite_rules:
  - id: x64-hidden-telnet-credential-scanner
    desc: Hidden IoT credentials and Telnet SYN code
    crit: hostile
    conf: 0.98
    attack: T1110.001,T1046
    all:
      - id: xor-encoded-iot-credential-table
      - id: micro-behaviors/data/encoding/xor::x64-counted-byte-xor-cursor-loop
      - id: micro-behaviors/communications/socket/tcp::x64-tcp-syn-telnet-header
      - id: micro-behaviors/communications/socket/connect::socket-create-and-connect-syscalls
