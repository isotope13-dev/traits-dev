defaults:
  conf: 0.96
  platforms: [linux, android]
  for: [elf]
  attack: T1027
  mbc: B0032

composite_rules:
  - id: executable-stack-stripped-uclibc-elf
    desc: Credential-attack ELF with executable stack
    # Structural hardening gaps plus the static uClibc stager profile are
    # common on statically linked IoT toolchains; keep suspicious unless a
    # stronger botnet/persistence composite already establishes implant intent.
    crit: suspicious
    all:
      - id: objectives/lateral-movement/brute-force/iot-creds::uclibc-iot-credential-attack-shell-profile
      - id: metadata/binary/header/program::elf-executable-stack
      - id: "metadata/binary/symbols/table::full-symbol-table-absent-or-empty"
    any:
      - id: "metadata/binary/symbols/table::full-symbol-table-absent-or-empty-flag"
      - id: micro-behaviors/fs/path/application/interpreter::bin-sh-path-reference
    unless:
      - id: well-known/tool/sysadmin/busybox::busybox-binary
      - id: objectives/evasion/masquerade/process/system-name::http-flood-kworker-persistence-templates
      - id: objectives/persistence/system/service/systemd::native-arm-flood-bot-systemd-shell-staging
