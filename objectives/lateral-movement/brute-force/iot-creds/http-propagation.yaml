defaults:
  platforms: [linux]
  for: [elf]
composite_rules:
  - id: iot-credential-http-exec-stager
    desc: IoT credentials with HTTP execution commands
    crit: hostile
    conf: 0.97
    attack: T1110.001,T1105,T1059.006
    all:
      - id: objectives/lateral-movement/brute-force/iot-creds::iot-default-credential-token-cluster
      - id: micro-behaviors/process/create/eval::embedded-python-urllib-exec
      - id: micro-behaviors/communications/http/message::raw-http-safe-request-line
