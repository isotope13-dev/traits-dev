defaults:
  for: [elf]
  platforms: [linux]
traits:
  - id: self-propagation-option-description
    desc: Embedded self-propagation option description
    crit: suspicious
    conf: 0.95
    if:
      type: text
      regex: 'self[- ]propagat(e|ion)'
      section: .rodata
composite_rules:
  # Requires a propagation declaration, a multi-device spray dictionary and
  # both halves of the shell downloader, rather than Go/UPX/lockfile layout.
  - id: iot-credential-self-propagation-shell-loader
    desc: IoT credential table with self-propagation shell downloader
    crit: hostile
    conf: 0.98
    attack: T1110.001,T1059.004
    all:
      - id: mirai-credential-access
      - id: self-propagation-option-description
      - id: micro-behaviors/process/create/shell/pipeline::native-download-shell-pipeline-reference
