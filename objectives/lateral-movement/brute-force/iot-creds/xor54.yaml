defaults:
  platforms: [linux]
  for: [elf]
composite_rules:
  - id: xor54-telnet-credential-scanner
    desc: IoT credential table with encoded login dialogue and network dialer
    crit: hostile
    conf: 0.98
    attack: T1110.001
    all:
      - id: objectives/lateral-movement/brute-force/iot-creds::mirai-credential-access
      - id: micro-behaviors/communications/socket/telnet::xor54-login-prompt
      - id: micro-behaviors/communications/socket/telnet::xor54-password-prompt
      - id: micro-behaviors/communications/socket/telnet::xor54-login-failure
    any:
      - id: micro-behaviors/communications/socket/connect/attempt::socket-create-and-connect-syscalls
      - id: micro-behaviors/communications/socket/syscall/combined::arm-literal-pool-socket-connect-pair
      - id: micro-behaviors/communications/socket/syscall/combined::superh-direct-network-client
      - id: micro-behaviors/communications/socket/syscall/dispatch::i386-socketcall-wrapper
      - id: micro-behaviors/communications/socket/syscall/dispatch::sparc-socketcall-wrapper
      # 32-bit PowerPC Linux dials through socketcall(2) like the i386 and
      # SPARC builds above; stripped PPC IoT bots carry the same wrappers.
      - id: micro-behaviors/communications/socket/syscall/combined::ppc-socketcall-network-io
      # Dynamically linked IoT bots (e.g. uClibc builds) import connect directly.
      - id: micro-behaviors/communications/socket/connect/attempt::connect-import
