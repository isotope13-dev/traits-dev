defaults:
  platforms:
  - unix
  - windows
  for:
  - elf
  - shell

traits:
- id: telnet-target--rx-1
  desc: Telnet default credential token telnetadmin
  crit: notable
  conf: 0.8
  platforms:
  - linux
  if:
    type: text
    substr: telnetadmin
- id: telnet-target--rx-2
  desc: Dotted-quad IPv4 address with telnet port 23
  crit: component
  conf: 0.8
  platforms:
  - linux
  if:
    type: text
    regex: \b[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}:23\b
- id: telnet-target--rx-3
  desc: Hostname with telnet port 23
  crit: component
  conf: 0.8
  platforms:
  - linux
  if:
    type: text
    regex: \b[a-z0-9][a-z0-9-]{0,62}\.[a-z0-9][a-z0-9.-]{1,190}:23\b
  not:
  - regex: \.(rs|c|cc|cpp|h|hpp|go|py|js|ts|y|l|yy|ll|cs|rb|java|sh|properties|po|pot|txt|at|ml|mli):23\b

composite_rules:
- id: telnet-target
  desc: Telnet service targeting
  crit: suspicious
  conf: 0.8
  attack: T1021.007
  platforms:
  - linux
  any:
  - id: telnet-target--rx-1
  - id: telnet-target--rx-2
  - id: telnet-target--rx-3
  unless:
  - id: metadata/binary/provenance/source::rcs-ident-timestamp
  - id: metadata/package/testing/
  not:
  - substr: column:23
  - substr: line:23
  - substr: Interrupt:23
  - substr: accDescription:23
  - substr: escription:23
  - substr: QuickLook.Plugin.MarkdownViewer.Resources.js
  - regex: \.(rs|c|cc|cpp|h|hpp|go|py|js|ts|y|l|yy|ll|cs|rb|java|sh|properties|po|pot|txt|ml|mli):23\b
