defaults:
  platforms: [linux]
  for: [elf]
  attack: T1110.001
traits:
  - id: auth-combination-retry-status
    desc: Retrying a different authentication combination
    crit: suspicious
    conf: 0.95
    if:
      type: text
      substr: retrying with different auth combo
composite_rules:
  - id: xor-credential-table-direct-socket-bot
    desc: Hidden IoT credentials with direct socket activity
    crit: hostile
    conf: 0.97
    attack: T1110.001,T1105
    all:
      - id: xor-encoded-iot-credential-table
    any:
      - id: micro-behaviors/communications/socket/syscall/combined::arm-direct-network-syscalls
      - id: micro-behaviors/communications/socket/syscall/combined::aarch64-connect-send-recv-network-io
      - id: micro-behaviors/communications/socket/syscall/combined::mips-direct-network-syscalls
      - id: micro-behaviors/communications/socket/syscall/combined::ppc-socketcall-network-io
      - id: micro-behaviors/communications/socket/syscall/dispatch::m68k-socketcall-wrapper
    needs: 1

  - id: hidden-credential-telnet-retry-scanner
    desc: Hidden IoT credentials with Telnet authentication retries
    crit: hostile
    conf: 0.98
    all:
      - id: xor-encoded-iot-credential-table
      - id: auth-combination-retry-status
      - id: micro-behaviors/communications/socket/telnet::verified-telnet-login-status
      - id: micro-behaviors/communications/socket/connect/attempt::connect-import
      - id: micro-behaviors/communications/socket/send/reference::send-symbol
      - id: micro-behaviors/data/encoding/xor/unspecified-key::x64-paired-byte-xor-cursor-loop
