defaults:
  platforms: [linux]
  for: [elf]
  attack: T1110.001
traits:
  - id: auth-combination-retry-status
    desc: Retrying a different authentication combination
    crit: suspicious
    conf: 0.95
    if:
      type: text
      substr: retrying with different auth combo
composite_rules:
  - id: hidden-credential-telnet-retry-scanner
    desc: Hidden IoT credentials with Telnet authentication retries
    crit: hostile
    conf: 0.98
    all:
      - id: xor-encoded-iot-credential-table
      - id: auth-combination-retry-status
      - id: micro-behaviors/communications/socket/telnet::verified-telnet-login-status
      - id: micro-behaviors/communications/socket/connect::connect-import
      - id: micro-behaviors/communications/socket/send::send-symbol
      - id: micro-behaviors/data/encoding/xor::x64-paired-byte-xor-cursor-loop
