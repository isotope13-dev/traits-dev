# Native libssh password sprayers keep a user list, a work log, and
# SSH-2.0-libssh client banners.
defaults:
  platforms: [unix]
  for: [elf]
  attack: T1110.001
  mbc: F0007.002

traits:
  - id: bigsshf-log
    desc: Writes a bigsshf work log
    crit: notable
    conf: 0.96
    if:
      type: text
      substr: log.bigsshf
  - id: apophis-users-banner
    desc: Apophis 600-users spray banner
    crit: notable
    conf: 0.97
    if:
      type: text
      substr: '600users. m0difY bY Apophis'
  - id: libssh-client-banner
    desc: SSH-2.0-libssh client banner
    crit: notable
    conf: 0.9
    if:
      type: text
      substr: SSH-2.0-libssh-0.1

composite_rules:
  - id: bigsshf-apophis-spray
    desc: Bigsshf log with Apophis users
    crit: hostile
    conf: 0.98
    all:
      - id: bigsshf-log
      - id: apophis-users-banner
  - id: bigsshf-libssh-spray
    desc: Bigsshf log with libssh banner
    crit: hostile
    conf: 0.96
    all:
      - id: bigsshf-log
      - id: libssh-client-banner
  - id: apophis-libssh-spray
    desc: Apophis users with libssh banner
    crit: hostile
    conf: 0.96
    all:
      - id: apophis-users-banner
      - id: libssh-client-banner
