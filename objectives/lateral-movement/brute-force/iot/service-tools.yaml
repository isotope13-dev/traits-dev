defaults:
  platforms: [linux]
  for: [elf]
composite_rules:
- id: iot-credentials-with-service-tools
  desc: IoT credential table beside BusyBox or Telnet endpoint
  crit: suspicious
  conf: 0.95
  attack: T1110.001
  all:
  - id: objectives/lateral-movement/brute-force/iot-creds::mirai-credential-access
  any:
  - id: micro-behaviors/fs/path/binary::bin-busybox-path
  - id: micro-behaviors/communications/socket/telnet::telnet-port-endpoint-reference
