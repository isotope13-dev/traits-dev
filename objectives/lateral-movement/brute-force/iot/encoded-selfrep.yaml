    desc: RC4 credential table and Telnet propagation
    crit: hostile
    conf: 0.98
    attack: T1110.001,T1021.007,T1105
    all:
      - id: micro-behaviors/crypto/symmetric/stream/rc4::x64-stack-byte-state-prga
      - id: micro-behaviors/communications/socket/send::x64-credential-pair-send-sites
      - id: micro-behaviors/communications/socket/telnet::xor22-shell-probe-sequence
      - id: micro-behaviors/process/create/local-exec::chmod-then-local-execute-command
      - id: objectives/anti-static/obfuscation/encoding/content::encoded-wget-http
