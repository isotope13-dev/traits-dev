defaults:
  platforms: [unix, windows]
  crit: suspicious
  attack: T1110.001
  mbc: B0028
  for: [scripts, binaries]
traits:
  - id: shell-injection-pattern-2
    desc: Shell injection pattern (2)
    if:
      type: text
      exact: "system\nshell"
  - id: dahua-shell-escape
    desc: Dahua DVR shell escape sequence
    crit: suspicious
    conf: 0.9
    if:
      type: text
      regex: enable\n+system\n+shell\n+sh
  - id: shell-root-credential-list
    desc: Shell root account-password list
    crit: notable
    conf: 0.95
    for: [shell]
    count_min: 2
    if:
      type: text
      regex: '(?m)^\s*root:[^\r\n]{0,40}\r?\n'
  - id: shell-admin-credential-list
    desc: Shell admin account-password list
    crit: notable
    conf: 0.95
    for: [shell]
    count_min: 2
    if:
      type: text
      regex: '(?m)^\s*admin:[^\r\n]{0,40}\r?\n'
  - id: shell-credential-pair-netcat-login
    desc: Shell pipes credential pair to Netcat
    crit: suspicious
    conf: 0.95
    for: [shell]
    if:
      type: text
      regex: '(?s)\{\s*echo\s+"?\$\{?\w+\}?"?.{0,120}echo\s+"?\$\{?\w+\}?"?\s+\}\s*\|\s*nc\b'
  - id: shell-netcat-prompt-check
    desc: Shell checks Netcat login prompt
    crit: suspicious
    conf: 0.94
    for: [shell]
    if:
      type: text
      regex: '\}\s*\|\s*nc\b[^\n]{0,80}\|\s*grep\s+-q[^\n]{0,60}(#|>)'
composite_rules:
  - id: shell-default-credential-list
    desc: Shell default account-password list
    crit: suspicious
    conf: 0.95
    for: [shell]
    needs: 2
    any:
      - id: shell-root-credential-list
      - id: shell-admin-credential-list
      - id: metadata/lang/source/syntax/key-value::shell-repeated-user-label-lines

  - id: go-iot-default-credential-bruteforce
    desc: IoT default-credential brute-force workflow
    crit: hostile
    conf: 0.98
    mbc: E1110
    for: [go]
    all:
      - id: metadata/lang/source/syntax/assignment/name::credential-list-array-text
      - id: metadata/lang/source/syntax/assignment/name::repeated-login-config-text
      - id: metadata/lang/source/syntax/assignment/name::repeated-password-config-text
      - id: micro-behaviors/data/control-flow/loop::go-range-over-credential-collection
      - id: micro-behaviors/os/security/auth/secret::go-setauth-credential-call
  - id: shell-injection-pattern
    desc: IoT credential table beside service shell escape commands
    crit: suspicious
    conf: 0.9
    all:
      - id: objectives/lateral-movement/brute-force/iot-creds::mirai-credential-access
    unless:
      - id: objectives/lateral-movement/brute-force/iot-creds::mirai-credential-telnet-attack-bot
    any:
      - id: micro-behaviors/process/create/shell/spawn::embedded-shell-launch-sequence
      - id: shell-injection-pattern-2
      - id: dahua-shell-escape
  - id: iot-credential-spray
    desc: IoT default credentials beside executable download staging
    crit: hostile
    conf: 0.98
    platforms: [linux]
    for: [elf]
    all:
      - id: micro-behaviors/os/security/auth/password::admin1234
      - id: objectives/lateral-movement/brute-force/iot-creds::mirai-cred-admin
      - id: micro-behaviors/fs/path/application/executable::bin-busybox-path
      - id: micro-behaviors/process/create/local-exec::chmod-then-local-execute-command
      - id: micro-behaviors/communications/transfer::multiple-download-clients
    any:
      - id: micro-behaviors/fs/proc/info/path::proc-net-tcp
      - id: micro-behaviors/fs/proc/exe::process-self-exe-path
    # The specific Mirai credential/stager detector describes the same
    # propagation routine with stronger evidence; suppress this broader
    # verdict when it matches so one behavior is not convicted twice.
    unless:
      - id: objectives/lateral-movement/brute-force/iot-creds::mirai-credential-busybox-stager
      - id: objectives/lateral-movement/brute-force/iot-creds::mirai-credential-shell-stager
  - id: telnet-credential-payload-propagation
    desc: Telnet credential spray deploys a remote shell payload
    crit: hostile
    conf: 0.99
    for: [shell]
    all:
      - id: shell-default-credential-list
      - id: shell-credential-pair-netcat-login
      - id: shell-netcat-prompt-check
      - id: micro-behaviors/communications/http/download/shell::shell-wget-variable-script-output
      - id: micro-behaviors/process/create/script/file::nohup-shell-script-execution
      - id: micro-behaviors/fs/chmod/executable/mode::chmod-exec-literal-target
