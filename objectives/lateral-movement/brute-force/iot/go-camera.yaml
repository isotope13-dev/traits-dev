defaults:
  platforms: [unix, windows]
  for: [go]
  attack: T1110.001

composite_rules:
  - id: go-camera-credential-attempt-loop
    desc: Camera endpoints with repeated credential setup
    crit: suspicious
    conf: 0.95
    all:
      - id: micro-behaviors/data/control-flow/loop::go-range-over-credential-collection
      - id: micro-behaviors/os/security/auth/secret::go-setauth-credential-call
      - id: micro-behaviors/communications/http/url/endpoint::camera-management-cgi-endpoint
    near_bytes: 1200
