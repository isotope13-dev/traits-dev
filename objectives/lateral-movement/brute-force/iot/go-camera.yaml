defaults:
  platforms: [unix, windows]
  for: [go]
  attack: T1110.001

traits:
  # Facts retain the constructor arguments as opaque expressions. Require
  # the range variable's credential fields and the same client's Login call
  # inside that loop, rather than unrelated SDK setup elsewhere in the file.
  - id: go-camera-sdk-credential-loop
    desc: Loops over camera SDK credential logins
    crit: suspicious
    conf: 0.96
    if:
      type: tree-sitter
      language: go
      query: |
        ((for_statement
          (range_clause left: (expression_list (identifier) @candidate))
          body: (block (statement_list
            (short_var_declaration
              left: (expression_list (identifier) @client)
              right: (expression_list (call_expression
                function: (selector_expression field: (field_identifier) @constructor)
                arguments: (argument_list (_)
                  (selector_expression operand: (identifier) @user
                    field: (field_identifier) @user_field)
                  (selector_expression operand: (identifier) @password
                    field: (field_identifier) @password_field)))))
            (short_var_declaration
              right: (expression_list (call_expression
                function: (selector_expression operand: (identifier) @receiver
                  field: (field_identifier) @method))))))) @evidence
          (#eq? @constructor "NewSDKClient")
          (#eq? @user_field "Login")
          (#eq? @password_field "Password")
          (#eq? @method "Login")
          (#eq? @candidate @user)
          (#eq? @candidate @password)
          (#eq? @client @receiver))

composite_rules:
  - id: go-camera-credential-attempt-loop
    desc: Camera endpoints with repeated credential setup
    crit: suspicious
    conf: 0.95
    all:
      - id: micro-behaviors/data/control-flow/loop/collection::go-range-over-credential-collection
      - id: micro-behaviors/os/security/auth/secret::go-setauth-credential-call
      - id: micro-behaviors/communications/url/resource-path/administration::cgi-management-path
    near_bytes: 1200
