defaults:
  platforms:
  - unix
  - windows
  for: [python, javascript, powershell, pe, elf]
traits:
- id: python-common-users-list
  desc: Python common SSH username list
  crit: notable
  conf: 0.98
  for: [python]
  if:
    type: symbol
    kind: bind
    exact: COMMON_USERS
- id: python-common-passwords-list
  desc: Python common SSH password list
  crit: notable
  conf: 0.98
  for: [python]
  if:
    type: symbol
    kind: bind
    exact: COMMON_PASSWORDS
- id: root-root-cred
  desc: Default credential root:root literal
  crit: notable
  # A credential pair alone is incomplete evidence: defensive IoT
  # vulnerability checkers commonly enumerate the defaults they test.
  conf: 0.7
  if:
    type: text
    regex: '["''\\]root:root'
  unless:
  - type: text
    regex: 'user\s*=\s*["'']root:root'
  - type: text
    regex: '["'']owner["'']\s*:\s*["'']root:root'
  - type: text
    regex: '\bowner\s*:\s*[^\n]{0,100}["'']root:root'
  - type: text
    regex: '["'']chown["'']\s*(?:if|,|:|\\])?.{0,80}["'']root:root'
  - type: text
    regex: '(?i)default_owner\s*=\s*["'']root:root'
  - type: text
    regex: '(?i)syslog_fix_perms.{0,120}root:root'
  - type: text
    regex: '(?i)\bOWNER\s*=\s*["'']root:root'
  - id: well-known/tool/offensive/bbot::package-tree-member
- id: ubnt-ubnt-cred
  desc: Default Ubiquiti credential ubnt:ubnt literal
  crit: notable
  conf: 0.7
  if:
    type: text
    substr: ubnt:ubnt
- id: pi-raspberry-cred
  desc: Pi default pi:raspberry literal
  crit: notable
  conf: 0.7
  if:
    type: text
    substr: pi:raspberry
- id: admin-password-cred
  desc: Default credential admin:password literal
  crit: notable
  conf: 0.7
  if:
    type: text
    regex: '(^|[^A-Za-z0-9_])admin:password([^A-Za-z0-9_]|$)'
  not:
  - regex: ://admin:password@(localhost|127\.0\.0\.1|\[::1\])(?::\d+)?\b
  - regex: 'curl\s+-u\s+admin:password.{0,120}(localhost|127\.0\.0\.1|\[::1\])'
  - regex: '["'']admin:password[_A-Za-z0-9]'
  unless:
  - id: metadata/package/testing/corpus::inert-security-input-module
  - id: well-known/tool/offensive/pentestkit/
  - id: well-known/tool/offensive/bbot::package-tree-member
  # A documented PostgreSQL admin DSN example is configuration guidance, not
  # a credential in a brute-force wordlist.
  - type: text
    regex: '(?i)--admin-dsn\s+postgresql(?:\+\w+)?://admin:password@'
  # OpenAPI-generated client documentation commonly embeds a local curl
  # example using the service's illustrative default credentials.
  - type: text
    regex: 'curl -u admin:password.*(localhost|127\.0\.0\.1|\[::1\])'
  # A local auth handler comparing a supplied Basic-auth value is a test or
  # server fixture, not a credential list used to spray remote SSH services.
  - type: text
    regex: '(?i)(?:===|!==|==|!=)\s*["'']admin:password["'']'
  # Bruno ships this credential only in a package-test fixture; it is not an
  # SSH spraying dictionary or a runtime login attempt.
  - id: metadata/package/testing/presence/harness::test-directory
  - id: metadata/lang/generated::openapi-generator-source-banner
  - id: well-known/tool/offensive/decepticon::package-tree-member
- id: support-support-cred
  desc: Default credential support:support literal
  crit: notable
  conf: 0.7
  if:
    type: text
    regex: '["''\\]support:support'
  unless:
  - type: text
    substr: 'app-namespaced talent'
  - type: text
    substr: 'OUTBOUND_TALENTS = {"support"}'
- id: root-vizxv-cred
  desc: Telnet default credential root:vizxv literal
  crit: notable
  conf: 0.7
  if:
    type: text
    substr: root:vizxv
- id: root-xc3511-cred
  desc: Telnet default credential root:xc3511 literal
  crit: notable
  conf: 0.7
  if:
    type: text
    substr: root:xc3511
- id: root-888888-cred
  desc: Telnet default credential root:888888 literal
  crit: notable
  conf: 0.7
  if:
    type: text
    substr: root:888888
- id: root-juantech-cred
  desc: Telnet default credential root:juantech literal
  crit: notable
  conf: 0.7
  if:
    type: text
    substr: root:juantech
- id: admin-admin1234-cred
  desc: Camera admin:admin1234 literal
  crit: notable
  conf: 0.7
  if:
    type: text
    substr: admin:admin1234
- id: admin-smcadmin-cred
  desc: SMC default credential admin:smcadmin literal
  crit: notable
  conf: 0.7
  if:
    type: text
    substr: admin:smcadmin
- id: scanner-keyword-1
  desc: SSH scanner-related keyword reference
  crit: notable
  conf: 0.75
  if:
    type: text
    regex: \b(port|network|ssh)[_-]?scanner\b
    case_insensitive: true
composite_rules:
- id: scanner-keywords
  desc: Network scanner keywords
  any:
  - id: scanner-keyword-1
  - id: objectives/discovery/network/scan/port/probe::scanning-vocabulary
  crit: notable
  unless:
  - id: well-known/tool/sysadmin/netdoc-collector::netdoc-collector-library
  - id: metadata/package/documentation/page::static-html-shell
  - id: "metadata/package/documentation/page::documentation-web-page"
  - id: well-known/tool/offensive/reconprobe/
- id: ssh-with-auth
  desc: SSH protocol with authentication methods
  all:
  - id: micro-behaviors/communications/ssh/client::protocol
  any:
  - id: micro-behaviors/communications/ssh/client::password-auth-method
  - id: micro-behaviors/communications/ssh/client::keyboard-interactive
  crit: component
- id: auth-spray
  desc: SSH authentication failures with scanner or default-credential evidence
  crit: suspicious
  conf: 0.85
  mbc: E1110
  attack: T1110.001
  all:
  - id: micro-behaviors/communications/ssh/client::protocol
  - id: micro-behaviors/os/message/error::authentication-error-message
  any:
  - id: scanner-keywords
  - id: iot-credential-access
  unless:
  - id: well-known/app/
  - id: well-known/lib/
  downgrade:
    any:
    - id: micro-behaviors/os/pam/auth/
    - id: metadata/signed/platform::apple
    - id: metadata/binary/vendor/
    - id: well-known/lib/ui/react::library-identity
    # Multiple SSH references plus error messages; this is co-occurrence,
    # not proof of a complete SSH authentication implementation.
    - id: micro-behaviors/communications/ssh/client::ssh-client-reference-error-cluster
- id: iot-credential-access
  desc: Set of IoT default credential pair literals
  # Keep this as an attack-context fragment. The attack interpretation comes
  # from composites that also show authentication or propagation activity.
  crit: component
  conf: 0.9
  mbc: E1110
  attack: T1078.001
  unless:
  - id: well-known/tool/offensive/pentestkit/
  - id: well-known/tool/offensive/decepticon::package-tree-member
  - id: well-known/tool/offensive/bbot::package-tree-member
  needs: 3
  any:
  - id: micro-behaviors/data/format/credentials::admin-admin-pair
  - id: root-root-cred
  - id: micro-behaviors/data/format/credentials::admin-1234-cred
  - id: ubnt-ubnt-cred
  - id: pi-raspberry-cred
  - id: admin-password-cred
  - id: micro-behaviors/data/format/credentials::guest-guest-pair
  - id: support-support-cred
  - id: root-vizxv-cred
  - id: root-xc3511-cred
  - id: root-888888-cred
  - id: root-juantech-cred
  - id: admin-admin1234-cred
  - id: admin-smcadmin-cred
  - id: micro-behaviors/data/format/credentials::user-user-pair
- id: ssh-port-scanner
  desc: SSH port with scanner keywords
  all:
  - id: micro-behaviors/communications/ssh/connect::port-22-ref
  - id: scanner-keywords
  crit: suspicious
  unless:
  - id: well-known/tool/sysadmin/netdoc-collector::netdoc-collector-library
- id: scanner-comp
  for: [elf]
  desc: Threaded SSH network scanner
  crit: suspicious
  conf: 0.8
  mbc: E1110
  attack: T1046
  all:
  - id: ssh-port-scanner
  - id: micro-behaviors/process/threading/concurrency
  - id: micro-behaviors/communications/socket/connect::connect
  unless:
  - id: well-known/tool/sysadmin/netdoc-collector::netdoc-collector-library
- id: botnet
  desc: SSH brute-force botnet detected
  crit: hostile
  conf: 0.9
  mbc: E1110
  attack: T1110.001
  for:
  - elf
  all:
  - id: scanner-comp
  - id: iot-credential-access
  - id: auth-spray
- id: python-ssh-password-bruteforce
  desc: Python SSH password brute-force workflow
  crit: hostile
  conf: 0.99
  mbc: E1110
  attack: T1110.001
  for: [python]
  # Keep username/password lists, Paramiko login, and SSHClient evidence in
  # the same source member; package-level aggregation would mislabel a wheel
  # that merely ships a reusable SSH helper beside unrelated code.
  scope: leaf
  near_lines: 120
  all:
  - id: python-common-users-list
  - id: python-common-passwords-list
  - id: micro-behaviors/communications/ssh/connect::paramiko-sshclient-connect
  - id: well-known/lib/network/paramiko::paramiko-python-library
  - id: micro-behaviors/communications/ssh/connect::ssh-client
  unless:
  - id: well-known/tool/offensive/
- id: paramiko-spray-remote-payload-exec
  desc: SSH password spray executes a remote payload
  crit: hostile
  conf: 0.97
  mbc: E1110
  attack: T1110.001,T1059
  for: [python]
  # Spray scripts that only log in (no remote command) stay with the
  # brute-force workflow above; executing a payload on first login turns the
  # spray into compromise. Keep the pairs, the login, and the remote command
  # in the same source member so a wheel shipping an SSH helper beside
  # unrelated credential data does not convict.
  scope: leaf
  near_lines: 120
  all:
  - id: objectives/lateral-movement/brute-force/password/credential-list::embedded-default-account-pairs
  - id: micro-behaviors/communications/ssh/connect::paramiko-sshclient-connect
  - id: micro-behaviors/communications/ssh/connect::paramiko-exec-command
  unless:
  - id: well-known/tool/offensive/
  - id: well-known/tool/detection/security-scanner/
