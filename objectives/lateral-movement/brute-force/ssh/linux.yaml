defaults:
  platforms: [unix, android]
  for: [scripts, binaries]
traits:
- id: india-at-123
  desc: India@123 credential string
  crit: notable
  conf: 0.95
  attack: T1110.001
  if:
    type: text
    exact: India@123
- id: weak-login-pair-set--rx-1
  desc: postgres in credential/user collection
  crit: notable
  conf: 0.82
  if:
    type: text
    regex: "\\b(credential|user|login)\\w*\\s*[:=]\\s*[\\[(]\\s*['\"]([^\\n]{0,160}['\"])?postgres['\"]"
- id: weak-login-pair-set--rx-2
  desc: ubuntu in credential/user collection
  crit: notable
  conf: 0.82
  if:
    type: text
    regex: "\\b(credential|user|login)\\w*\\s*[:=]\\s*[\\[(]\\s*['\"]([^\\n]{0,160}['\"])?ubuntu['\"]"
- id: weak-login-pair-set--rx-3
  desc: admin in credential/user collection
  crit: notable
  conf: 0.82
  if:
    type: text
    regex: "\\b(credential|user|login)\\w*\\s*[:=]\\s*[\\[(]\\s*['\"]([^\\n]{0,160}['\"])?admin['\"]"
- id: weak-login-pair-set--rx-4
  desc: root in credential/user collection
  crit: notable
  conf: 0.82
  if:
    type: text
    regex: "\\b(credential|user|login)\\w*\\s*[:=]\\s*[\\[(]\\s*['\"]([^\\n]{0,160}['\"])?root['\"]"
composite_rules:
- id: embedded-ssh-credential-set
  desc: Embedded default credential pair set
  # A bare pair set establishes embedding, not brute force: IoT
  # vulnerability checkers enumerate the same defaults as detection
  # signatures and report them without attempting a login. The
  # brute-force claim comes from composites that add SSH connection or
  # authentication activity (auth-spray, internet-ssh-scanner,
  # python-ssh-password-bruteforce), so this roll-up stays at its legs'
  # level.
  crit: notable
  conf: 0.92
  attack: T1110.001
  any:
  - id: objectives/lateral-movement/brute-force/password/credential-list::dictionary
  - id: objectives/lateral-movement/brute-force/ssh::iot-credential-access
  - id: india-at-123
  - id: weak-login-pair-set
  unless:
  - id: well-known/tool/development/agent/kilocode::kilo-code-native-runtime
  - id: well-known/tool/sysadmin/alpine-packages/binary::alpine-filebrowser-binary
  - id: well-known/lib/ui/hqtui::hqtui-context
  - id: micro-behaviors/metaprogramming/generation::configured-assessment-plugin
- id: internet-ssh-scanner
  for: [binaries, '!dex', '!pe', applescript, javascript, lua, perl, php, python, ruby, shell]
  desc: Internet SSH brute-force scanner
  crit: suspicious
  conf: 0.95
  attack: T1110.001
  all:
  - id: micro-behaviors/communications/ssh/connect::connect-comp
  - id: embedded-ssh-credential-set
  - id: micro-behaviors/communications/ssh/connect::port-22-ref
  any:
  - id: metadata/lang/source/naming/function::ssh-scanner-name-text
  - id: objectives/lateral-movement/brute-force/ssh::scanner-comp
- id: weak-login-pair-set
  desc: Weak login usernames cluster
  crit: component
  conf: 0.82
  attack: T1110.001
  any:
  - id: weak-login-pair-set--rx-1
  - id: weak-login-pair-set--rx-2
  - id: weak-login-pair-set--rx-3
  - id: weak-login-pair-set--rx-4
  - id: objectives/discovery/account/keywords::root-keyword
  needs: 3
  unless:
  - id: micro-behaviors/process/interpreter/vm/
  - id: well-known/tool/detection/sast/
  - id: well-known/lib/ui/hqtui::hqtui-context
