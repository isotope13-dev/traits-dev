defaults:
  platforms: [unix, android]
  for: [scripts, binaries]
  attack: T1110.001
traits:
- id: india-at-123
  desc: India@123 credential string
  crit: notable
  conf: 0.95
  if:
    type: text
    exact: India@123
composite_rules:
- id: embedded-ssh-credential-set
  desc: Embedded default credential or account indicators
  # Account names and credential sets alone do not establish brute force: IoT
  # vulnerability checkers enumerate the same defaults as detection
  # signatures and report them without attempting a login. The
  # brute-force claim comes from composites that add SSH connection or
  # authentication activity (auth-spray, internet-ssh-scanner,
  # python-ssh-password-bruteforce), so this roll-up stays at its legs'
  # level.
  crit: notable
  conf: 0.92
  any:
  - id: objectives/lateral-movement/brute-force/password/credential-list::dictionary
  - id: objectives/lateral-movement/brute-force/ssh::iot-credential-access
  - id: india-at-123
  - id: metadata/lang/source/syntax/assignment/value::common-account-name-cluster
  unless:
  - id: well-known/tool/development/agent/kilocode::kilo-code-native-runtime
  - id: well-known/tool/sysadmin/alpine-packages/binary::alpine-filebrowser-binary
  - id: well-known/lib/ui/hqtui::hqtui-context
  - id: micro-behaviors/metaprogramming/generation/source::configured-assessment-plugin
- id: internet-ssh-scanner
  for: [binaries, '!dex', '!pe', applescript, javascript, lua, perl, php, python, ruby, shell]
  desc: Internet SSH brute-force scanner
  crit: suspicious
  conf: 0.95
  all:
  - id: micro-behaviors/communications/ssh/connect::connect-comp
  - id: embedded-ssh-credential-set
  - id: micro-behaviors/communications/ssh/connect::port-22-ref
  any:
  - id: metadata/lang/source/naming/function/communication::ssh-scanner-name-text
  - id: objectives/lateral-movement/brute-force/ssh::scanner-comp
