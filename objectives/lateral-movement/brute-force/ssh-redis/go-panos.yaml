defaults:
  platforms: [panos, appliance, unix]
  for: [go, elf]
  attack: T1110.001

traits:
  - id: go-default-ssh-admin-password
    desc: Go default SSH admin password
    crit: suspicious
    conf: 0.94
    if:
      type: text
      regex: 'sshBruteForce[\s\S]{0,900}\{"admin",\s*"password"\}'

  # Redis authorized_keys targeting is covered once, by the case-insensitive
  # objectives/persistence/login/ssh/backdoor::redis-dump-authorized-keys-filename
  # atom (which also accepts quoting and authorized_keys2 spellings).
  - id: go-panos-ssh-brute-force-func
    desc: Go PAN-OS SSH brute force func
    crit: suspicious
    conf: 0.94
    if:
      type: text
      substr: sshBruteForce

  - id: go-panos-redis-exploit-func
    desc: Go PAN-OS Redis exploit func
    crit: suspicious
    conf: 0.94
    if:
      type: text
      substr: exploitRedis

composite_rules:
  - id: go-panos-ssh-credential-spread
    desc: Go PAN-OS SSH credential spread
    crit: hostile
    conf: 0.98
    # The shared redis-dump leg covers scripts, elf and pe but not go sources.
    for: [elf]
    all:
      - id: go-default-ssh-admin-password
      - id: objectives/persistence/login/ssh/backdoor::redis-dump-authorized-keys-filename

  - id: go-panos-ssh-redis-spread
    desc: Go PAN-OS SSH Redis spread
    crit: hostile
    conf: 0.98
    all:
      - id: go-panos-ssh-brute-force-func
      - id: go-panos-redis-exploit-func
