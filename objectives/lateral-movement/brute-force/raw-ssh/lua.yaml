defaults:
  for:
    - "lua"
  platforms:
    - "unix"
    - "windows"
traits:
  - id: "lua-password-ssh-loop"
    desc: "Lua executes SSH over credential iterations"
    crit: "hostile"
    conf: 0.96
    if:
      type: "tree-sitter"
      language: "lua"
      query: |
        ((for_statement body: (block
         (variable_declaration (assignment_statement
          (variable_list (identifier) @cmd)
          (expression_list (function_call name: (dot_index_expression) @format
           arguments: (arguments (string) @ssh (dot_index_expression table: (identifier) @cred1) @password (dot_index_expression table: (identifier) @cred2) @user (_))))))
         (function_call name: (dot_index_expression) @execute arguments: (arguments (identifier) @used))))
         (#eq? @format "string.format") (#eq? @execute "os.execute") (#eq? @cmd @used)
         (#match? @ssh "sshpass -p") (#match? @ssh "ssh -o")
         (#eq? @cred1 @cred2))
