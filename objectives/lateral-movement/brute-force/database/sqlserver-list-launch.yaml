defaults:
  platforms: [windows]
  for: [pe, batch]
  attack: T1110.001
traits:
  - id: target-user-password-list-options
    desc: Target and credential list arguments
    crit: notable
    if:
      type: text
      regex: '\s-i\s+\S{1,80}\s+-u\s+\S{1,80}\s+-p\s+\S{1,80}\s+-t\s+\d{1,5}'
  - id: open-scan-result-gate
    desc: Findstr gates an open-port result
    for: [batch]
    crit: notable
    if:
      type: text
      regex: '(?i)findstr\.exe\s+" Open"[^\r\n]{1,80}&&\s*start\b'
composite_rules:
  - id: managed-sql-credential-list-launch
    desc: SQL client carries parallel target and credential-list arguments
    for: [pe]
    crit: suspicious
    all:
      - id: target-user-password-list-options
      - id: micro-behaviors/data/db/access::sql-connection-class
  - id: scan-gated-credential-list-launch
    desc: Open-port results gate parallel credential-list launcher
    for: [batch]
    crit: suspicious
    near_lines: 1
    all:
      - id: target-user-password-list-options
      - id: open-scan-result-gate
