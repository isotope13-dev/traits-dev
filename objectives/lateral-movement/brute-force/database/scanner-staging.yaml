defaults:
  platforms: [windows]
  for: [pe]
composite_rules:
  - id: scanner-stages-credential-lists
    desc: Port scanner contains username and password list download URLs
    crit: suspicious
    attack: T1046,T1110.001
    all:
      - id: objectives/discovery/network/scan/library::naabu-enumeration-function
      - id: micro-behaviors/communications/url/resource-path/file::user-list-download-url
      - id: micro-behaviors/communications/url/resource-path/file::password-list-download-url
