# MySQL credential brute-forcing and dictionary attack capabilities.
defaults:
  platforms: [windows, linux, macos]
  for: [binaries, c, cpp, html, text]
  attack: T1110.001

traits:
  - id: mysql-real-connect-call
    desc: mysql_real_connect C API call
    crit: component
    conf: 0.95
    for: [c, cpp, html, text]
    if:
      type: text
      substr: mysql_real_connect

  - id: cracking-target-indicator
    desc: Starting cracking on target indicator
    crit: notable
    conf: 0.95
    if:
      type: text
      substr: Starting cracking on

  - id: trying-credentials-indicator
    desc: Trying credential username and password
    crit: notable
    conf: 0.9
    if:
      type: text
      substr: "Trying -> ["

composite_rules:
  - id: mysql-real-connect-target
    desc: MySQL connection API target
    crit: component
    conf: 0.95
    any:
      - id: mysql-real-connect-call
      - id: micro-behaviors/data/db/mysql::mysql-real-connect

  - id: mysql-credential-bruteforce
    desc: MySQL credential brute-force attack
    crit: hostile
    conf: 0.98
    all:
      - id: mysql-real-connect-target
      - id: metadata/lang/natural/vocabulary/content-word::userlist-token
      - id: metadata/lang/natural/vocabulary/content-word::passlist-token
    any:
      - id: cracking-target-indicator
      - id: trying-credentials-indicator
