defaults:
  platforms: [windows]
  for: [pe, dll]

composite_rules:
  # Worm-style SMB spread: a built-in weak-password list is tried through the
  # WNet share-logon API, then the payload is staged on the administrative
  # share and started remotely by a task or service. Each leg occurs in
  # ordinary software (password-strength checkers, network mapping, installers);
  # together they describe credential spraying that ends in remote execution.
  - id: native-dictionary-share-logon-admin-share-spread
    desc: Weak-password list, share logon and admin-share staging with remote launch
    crit: hostile
    conf: 0.93
    attack: T1021.002,T1110.001
    all:
      - id: objectives/lateral-movement/brute-force/password/credential-list::weak-password-literal-cluster
      - id: micro-behaviors/network/share::wnet-add-connection
      - id: micro-behaviors/network/share::admin-share-unc-format-path
    any:
      - id: micro-behaviors/os/autorun/task-registration::windows-schtasks-create
      - id: micro-behaviors/os/service/create::create-service
      - id: micro-behaviors/os/wmi/remote::wmic-remote-process-create-command
    needs: 1
