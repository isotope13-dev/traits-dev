defaults:
  for: [pe, dll]
  platforms: [windows]
  arch: [x86]
  attack: T1110.001

traits:
  # Two independently advanced pointer arrays supply username/password pairs
  # to a helper resolving WNetAddConnection2A and authenticating to IPC$.
  # Binding the call, API argument and resource construction avoids treating
  # an embedded password vocabulary or ordinary share mapping as brute force.
  - id: native-ipc-share-credential-pair-loop
    desc: Iterates credential pairs against IPC shares
    crit: suspicious
    conf: 0.99
    if:
      type: yara
      source: |
        import "pe"
        rule native_ipc_share_credential_pair_loop {
          strings:
            $mpr = "mpr.dll" nocase
            $wnet = "WNetAddConnection2A"
            $ipc = "\\\\%s\\ipc$" nocase
            $loop = {
              FF 36 8D 85 ?? ?? FF FF FF 37 50 E8 ?? ?? ?? ??
              83 C6 04 83 C4 0C 83 3E 00 75 ??
              83 C7 04 83 3F 00 75 ??
            }
            $helper = {
              55 8B EC 81 EC ?? ?? 00 00 53 56 57 68 ?? ?? ?? ??
              FF 15 ?? ?? ?? ?? 68 ?? ?? ?? ?? 50 FF 15 ?? ?? ?? ??
              80 65 C8 00 89 45 FC
            }
            $format = { 8D 85 ?? ?? FF FF 68 ?? ?? ?? ?? 50 FF D6 }
            $auth = {
              C7 45 DC 02 00 00 00 57 89 45 F0 FF 75 0C 8D 45 DC
              89 7D E0 89 7D E4 FF 75 10 C7 45 E8 01 00 00 00
              89 5D EC 89 7D F8 50 89 7D F4 FF 55 FC
            }
          condition:
            pe.machine == pe.MACHINE_I386 and all of them and
            for any s in (0..pe.number_of_sections-1) : (
              (pe.sections[s].name == ".text" or pe.sections[s].name == ".data") and
              for all of ($loop, $helper, $format, $auth) : (
                @ >= pe.sections[s].raw_data_offset and
                @+! <= pe.sections[s].raw_data_offset+pe.sections[s].raw_data_size
              )
            ) and
            @loop+16+int32(@loop+12) == @helper and
            pe.rva_to_offset(uint32(@helper+13)-pe.image_base) == @mpr and
            pe.rva_to_offset(uint32(@helper+24)-pe.image_base) == @wnet and
            uint32(@helper+31) == pe.image_base+pe.import_rva("KERNEL32.dll", "GetProcAddress") and
            @format > @helper and @format < @helper+256 and
            pe.rva_to_offset(uint32(@format+7)-pe.image_base) == @ipc and
            @auth > @format and @auth < @format+96
        }
