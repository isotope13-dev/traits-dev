defaults:
  platforms: [windows]
  for: [batch]

traits:
  - id: batch-repeated-remote-credential-attempts
    desc: Repeated explicit remote credential attempts
    crit: suspicious
    conf: 0.97
    count_min: 8
    if:
      type: text
      regex: '(?im)^\S+\s+\\\\%[1-9]\s+-u\s+\S+\s+-p\s+\S+\s+-c\s+-f\s+-d\s+\S+\.exe\b'
  - id: batch-remote-empty-and-numeric-password-attempts
    desc: Trivial administrator password attempts
    crit: suspicious
    conf: 0.98
    count_min: 4
    if:
      type: text
      regex: '(?im)^\S+\s+\\\\%[1-9]\s+-u\s+administrator\s+-p\s+123[0-9]{0,5}\s+-c\s+-f\s+-d\s+'
composite_rules:
  - id: batch-password-dictionary-remote-deployment
    desc: Password dictionary used for remote deployment
    crit: hostile
    conf: 0.99
    all:
      - id: batch-repeated-remote-credential-attempts
      - id: batch-remote-empty-and-numeric-password-attempts
