defaults:
  for: [text, batch]
  platforms: [windows]
traits:
  - id: nested-user-password-loops
    desc: Iterates username and password lists
    crit: notable
    if:
      type: text
      regex: 'for %u in \([^)]{1,80}\) do @?for %p in \('
      case_insensitive: true
  - id: loop-credential-share-logon
    desc: Maps shares using looped credentials
    crit: suspicious
    if:
      type: text
      substr: 'net use %c "%p" /user:"%u"'
      case_insensitive: true
composite_rules:
  - id: dictionary-share-logon-loop
    desc: Tries username and password combinations against Windows shares
    crit: hostile
    conf: 0.99
    attack: T1110.001,T1021.002
    near_lines: 2
    all:
      - id: nested-user-password-loops
      - id: loop-credential-share-logon
