# Nested iteration over candidate usernames and passwords, each pair sent as
# an HTTP login attempt: online password guessing.
defaults:
  for: [ruby]
  platforms: [unix, windows]
  attack: T1110.001

traits:
  - id: ruby-nested-user-password-loop
    desc: Ruby loops passwords inside a user loop
    crit: suspicious
    conf: 0.9
    if:
      type: text
      regex: '\.each do \|(user|username|login)\w*\|[\s\S]{0,240}\.each do \|(pass|password|pwd)\w*\|'

  - id: ruby-user-password-pair-encode
    desc: Ruby encodes an interpolated user:password pair
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: 'encode64\(\s*"#\{\w{1,20}\}:#\{\w{1,20}\}"\s*\)'

composite_rules:
  - id: ruby-http-password-guessing-loop
    desc: Guesses passwords via HTTP logins
    crit: hostile
    conf: 0.95
    near_lines: 40
    all:
      - id: ruby-nested-user-password-loop
      - id: micro-behaviors/communications/http/post::net-http-post
    any:
      - id: ruby-user-password-pair-encode
      - id: micro-behaviors/communications/http/basic-auth::basic-scheme-literal
