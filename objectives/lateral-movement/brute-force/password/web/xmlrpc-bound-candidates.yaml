# A loop must feed its own candidate into the password argument of the
# WordPress authentication method. Proximity of a loop and a login alone
# cannot distinguish candidate testing from retrying one fixed credential.
# The call starts the loop/try body, preventing earlier candidate rewrites.
# Facts expose the calls, but not the enclosing loop binding: AST is needed.
defaults:
  platforms: [unix, windows]
  crit: suspicious
  conf: 0.98
  attack: T1110.001
  mbc: E1110
traits:
  - id: python-xmlrpc-password-candidates
    desc: WordPress XML-RPC password candidate loop
    for: [python]
    if:
      type: tree-sitter
      query: |-
        (for_statement
          left: (identifier) @candidate
          body: (block . (expression_statement (call
          function: (attribute
            object: (attribute attribute: (identifier) @namespace)
            attribute: (identifier) @method)
          arguments: (argument_list (_) (identifier) @used))))
          (#eq? @namespace "wp")
          (#eq? @method "getUsersBlogs")
          (#eq? @candidate @used))
        (for_statement
          left: (identifier) @candidate
          body: (block . (try_statement body: (block . (expression_statement (call
          function: (attribute
            object: (attribute attribute: (identifier) @namespace)
            attribute: (identifier) @method)
          arguments: (argument_list (_) (identifier) @used))))))
          (#eq? @namespace "wp")
          (#eq? @method "getUsersBlogs")
          (#eq? @candidate @used))
        (for_statement
          left: (identifier) @candidate
          body: (block . (expression_statement (assignment right: (call
          function: (attribute
            object: (attribute attribute: (identifier) @namespace)
            attribute: (identifier) @method)
          arguments: (argument_list (_) (identifier) @used)))))
          (#eq? @namespace "wp")
          (#eq? @method "getUsersBlogs")
          (#eq? @candidate @used))
        (for_statement
          left: (identifier) @candidate
          body: (block . (try_statement body: (block . (expression_statement (assignment right: (call
          function: (attribute
            object: (attribute attribute: (identifier) @namespace)
            attribute: (identifier) @method)
          arguments: (argument_list (_) (identifier) @used)))))))
          (#eq? @namespace "wp")
          (#eq? @method "getUsersBlogs")
          (#eq? @candidate @used))

  - id: javascript-xmlrpc-password-candidates
    desc: WordPress XML-RPC password candidate requests
    for: [javascript, typescript]
    if:
      type: tree-sitter
      query: |-
        (for_in_statement
          left: (identifier) @candidate
          body: (statement_block .
            (expression_statement
              (call_expression
                function: (member_expression property: (property_identifier) @method)
                arguments: (arguments
                  (string (string_fragment) @rpc)
                  (array (_) (identifier) @used)))))
          (#eq? @method "methodCall")
          (#eq? @rpc "wp.getUsersBlogs")
          (#eq? @candidate @used))
