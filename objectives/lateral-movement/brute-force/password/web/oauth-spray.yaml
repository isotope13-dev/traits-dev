defaults:
  platforms: [unix, windows]
  for: [python, shell]
  attack: T1110.003
  mbc: E1110

traits:
  - id: objectives/lateral-movement/brute-force/password/web::spray-user-password-list-env
    desc: Spray user/password list environment
    crit: suspicious
    conf: 0.94
    if:
      type: text
      regex: 'SPRAY_USERS_FILE[\s\S]{0,220}SPRAY_PASSES_FILE'
    unless:
      - id: well-known/tool/offensive/bughunter::bughunter-source-context

  - id: objectives/lateral-movement/brute-force/password/web::spray-delay-env
    desc: Password-spray delay environment
    crit: notable
    conf: 0.9
    if:
      type: text
      substr: SPRAY_DELAY

  - id: objectives/lateral-movement/brute-force/password/web::spray-jitter-env
    desc: Password-spray jitter environment
    crit: notable
    conf: 0.9
    if:
      type: text
      substr: SPRAY_JITTER

  - id: objectives/lateral-movement/brute-force/password/web::spray-randomized-round-wait
    desc: Password-spray randomized round wait
    crit: notable
    conf: 0.9
    for: [python]
    if:
      type: text
      regex: 'delay\s*\+\s*random\.randint\(\s*-jitter'

  - id: objectives/lateral-movement/brute-force/password/web::trevorspray-dispatch
    desc: TREVORspray credential attack dispatch
    crit: suspicious
    conf: 0.95
    for: [shell]
    if:
      type: text
      regex: '\btrevorspray\b[\s\S]{0,240}--users[\s\S]{0,120}--passlist'
    unless:
      - id: well-known/tool/offensive/bughunter::bughunter-source-context

composite_rules:
  - id: objectives/lateral-movement/brute-force/password/web::microsoft-oauth-password-spray
    desc: Password spray targets Microsoft OAuth password grant
    crit: hostile
    conf: 0.99
    for: [python, powershell, csharp]
    all:
      - id: objectives/lateral-movement/brute-force/password/web::http-password-spray
      - id: micro-behaviors/communications/http/oauth::password-grant-type
      - id: micro-behaviors/communications/http/oauth::microsoft-login
    any:
      - id: micro-behaviors/communications/http/oauth::access-token-presence-check
      - id: micro-behaviors/communications/http/oauth::microsoft-first-party-client-id
      - id: objectives/lateral-movement/brute-force/password/web::ws-trust-response-code-handling
    near_bytes: 4200

  - id: objectives/lateral-movement/brute-force/password/web::oauth-password-grant-spray
    desc: OAuth password-grant credential spray
    crit: hostile
    conf: 0.98
    for: [python]
    all:
      - id: micro-behaviors/communications/http/oauth::password-grant-type
      - id: micro-behaviors/data/serialize/object::python-variable-credential-object
      - id: micro-behaviors/communications/http/oauth::access-token-presence-check
      - id: objectives/lateral-movement/brute-force/password/web::spray-user-password-list-env
    any:
      - id: objectives/lateral-movement/brute-force/password/web::spray-randomized-round-wait
      - id: micro-behaviors/communications/socket/ssl::tls-validation-fully-disabled

  - id: objectives/lateral-movement/brute-force/password/web::credential-spray-orchestrator
    desc: Credential-spray orchestrator
    crit: hostile
    conf: 0.98
    for: [shell]
    all:
      - id: objectives/lateral-movement/brute-force/password/web::spray-user-password-list-env
      - id: objectives/lateral-movement/brute-force/password/web::spray-delay-env
      - id: objectives/lateral-movement/brute-force/password/web::spray-jitter-env
    any:
      - id: objectives/lateral-movement/brute-force/password/web::trevorspray-dispatch
      - id: objectives/lateral-movement/brute-force/password/web::spray-randomized-round-wait
    unless:
      - id: well-known/tool/offensive/bughunter::bughunter-source-context
