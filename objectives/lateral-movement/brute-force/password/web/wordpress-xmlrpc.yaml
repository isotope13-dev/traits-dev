# WordPress XML-RPC password guessing repeatedly substitutes candidates from a
# wordlist into wp.getUsersBlogs requests. The endpoint and protocol method are
# stable even when operators change usernames, wordlists, or target hosts.
defaults:
  platforms: [unix, windows]
  for: [python]
  attack: T1110.001
  mbc: E1110

traits:
  - id: objectives/lateral-movement/brute-force/password/web::python-named-wordlist-open
    desc: Python opens a named wordlist
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: 'with\s+open\(.{1,120}\)\s+as\s+(wordlist|passwords|candidates)\s*:'

  - id: objectives/lateral-movement/brute-force/password/web::python-enumerated-password-loop
    desc: Python enumerates wordlist password candidates
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: 'for\s+\w+,\s*(pass(word)?|pwd|candidate)\s+in\s+enumerate\((wordlist|passwords)\)'

  - id: objectives/lateral-movement/brute-force/password/web::python-direct-password-loop
    desc: Python loops over wordlist passwords
    crit: notable
    conf: 0.92
    if:
      type: text
      regex: 'for\s+(pass(word)?|pwd|candidate)\s+in\s+(wordlist|passwords|candidates)'
    not:
      # `for candidate in candidates` is the ordinary Python idiom for walking
      # a list of options — font paths, config locations, model names — and
      # names neither a password nor a wordlist on either side. `pwd` reads as
      # a working directory at least as often as a password, so it earns the
      # same treatment. Every other pairing still names one or the other.
      - regex: '(candidate|pwd)\s+in\s+candidates'

composite_rules:
  - id: objectives/lateral-movement/brute-force/password/web::python-password-wordlist-iteration
    desc: Python iterates wordlist password candidates
    crit: notable
    conf: 0.96
    near_lines: 8
    all:
      - id: objectives/lateral-movement/brute-force/password/web::python-named-wordlist-open
    any:
      - id: objectives/lateral-movement/brute-force/password/web::python-enumerated-password-loop
      - id: objectives/lateral-movement/brute-force/password/web::python-direct-password-loop

  - id: objectives/lateral-movement/brute-force/password/web::wordpress-xmlrpc-wordlist-password-guessing
    desc: Guesses WordPress passwords over XML-RPC from a wordlist
    crit: hostile
    conf: 0.995
    near_bytes: 2400
    all:
      - id: objectives/credential-access/validation/check::python-wordpress-xmlrpc-credential-validation
      - id: objectives/lateral-movement/brute-force/password/web::python-password-wordlist-iteration
