# Password-major HTTP submissions bind both loop variables to credential fields.
# Fixed protocol keys identify the fields; identifiers may use any language.
defaults:
  platforms:
  - unix
  - windows
  for:
  - python
  - javascript
  - typescript
  attack: T1110.003
  mbc: E1110
traits:
- id: python-bound-http-password-spray
  desc: Python binds account and password spray fields
  crit: suspicious
  conf: 0.98
  for:
  - python
  if:
    type: tree-sitter
    query: |-
      (for_statement
        left: (identifier) @candidate
        body: (block
          (for_statement
            left: (identifier) @account
            body: (block
              (expression_statement
                (assignment right: (call
                  function: (attribute attribute: (identifier) @post)
                  arguments: (argument_list
                    (keyword_argument name: (identifier) @payload
                      value: (dictionary
                        (pair key: (string (string_content) @user_key)
                              value: (identifier) @account_used)
                        (pair key: (string (string_content) @pass_key)
                              value: (identifier) @candidate_used))))))))))
        (#eq? @post "post")
        (#match? @payload "^(data|json)$")
        (#eq? @user_key "username") (#eq? @pass_key "password")
        (#eq? @account @account_used) (#eq? @candidate @candidate_used)
        (#not-eq? @account @candidate))
- id: javascript-bound-http-password-spray
  desc: JS binds account and password spray fields
  crit: suspicious
  conf: 0.98
  for:
  - javascript
  - typescript
  if:
    type: tree-sitter
    query: |-
      (for_in_statement
        left: (identifier) @candidate
        body: (statement_block
          (for_in_statement
            left: (identifier) @account
            body: (statement_block
              (lexical_declaration
                (variable_declarator value: (await_expression
                  (call_expression function: (identifier) @fetch
                    arguments: (arguments (_)
                      (object
                        (pair key: (property_identifier) @method
                          value: (string (string_fragment) @post))
                        (pair key: (property_identifier) @body
                          value: (new_expression constructor: (identifier) @encoder
                            arguments: (arguments (object
                              (pair key: (property_identifier) @user_key
                                value: (identifier) @account_used)
                              (pair key: (property_identifier) @pass_key
                                value: (identifier) @candidate_used))))))))))))))
        (#eq? @fetch "fetch") (#eq? @method "method") (#eq? @post "POST")
        (#eq? @body "body") (#eq? @encoder "URLSearchParams")
        (#eq? @user_key "username") (#eq? @pass_key "password")
        (#eq? @account @account_used) (#eq? @candidate @candidate_used)
        (#not-eq? @account @candidate))
