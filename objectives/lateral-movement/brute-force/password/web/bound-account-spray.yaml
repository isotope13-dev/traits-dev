# Password-major HTTP submissions bind both loop variables to credential fields.
# Fixed protocol keys identify the fields; identifiers may use any language.
defaults:
  platforms:
  - unix
  - windows
  for:
  - python
  - javascript
  - typescript
  - go
  attack: T1110.003
  mbc: E1110
traits:
- id: python-bound-http-password-spray
  desc: Python binds account and password spray fields
  crit: suspicious
  conf: 0.98
  for:
  - python
  if:
    type: tree-sitter
    query: |-
      (for_statement
        left: (identifier) @candidate
        body: (block
          (for_statement
            left: (identifier) @account
            body: (block
              (expression_statement
                (assignment right: (call
                  function: (attribute attribute: (identifier) @post)
                  arguments: (argument_list
                    (keyword_argument name: (identifier) @payload
                      value: (dictionary
                        (pair key: (string (string_content) @user_key)
                              value: (identifier) @account_used)
                        (pair key: (string (string_content) @pass_key)
                              value: (identifier) @candidate_used))))))))))
        (#eq? @post "post")
        (#match? @payload "^(data|json)$")
        (#eq? @user_key "username") (#eq? @pass_key "password")
        (#eq? @account @account_used) (#eq? @candidate @candidate_used)
        (#not-eq? @account @candidate))
- id: go-bound-http-password-spray
  desc: Go submits password-major account form rounds
  crit: suspicious
  conf: 0.98
  for: [go]
  if:
    type: tree-sitter
    query: |-
      (for_statement
        (range_clause left: (expression_list (identifier) (identifier) @candidate))
        body: (block (statement_list
          (for_statement
            (range_clause left: (expression_list (identifier) (identifier) @account))
            body: (block (statement_list
              (expression_statement (call_expression
                function: (selector_expression
                  operand: (identifier) @user_form field: (field_identifier) @user_set)
                arguments: (argument_list
                  (interpreted_string_literal) @user_key (identifier) @account_used)))
              (expression_statement (call_expression
                function: (selector_expression
                  operand: (identifier) @pass_form field: (field_identifier) @pass_set)
                arguments: (argument_list
                  (interpreted_string_literal) @pass_key (identifier) @candidate_used)))
              (short_var_declaration right: (expression_list (call_expression
                function: (selector_expression field: (field_identifier) @post)
                arguments: (argument_list (_) (identifier) @submitted_form)))))))))
        (#eq? @user_set "Set") (#eq? @pass_set "Set") (#eq? @post "PostForm")
        (#eq? @user_key "\"username\"") (#eq? @pass_key "\"password\"")
        (#eq? @account @account_used) (#eq? @candidate @candidate_used)
        (#not-eq? @account @candidate)
        (#eq? @user_form @pass_form) (#eq? @user_form @submitted_form))
- id: javascript-bound-http-password-spray
  desc: JS binds account and password spray fields
  crit: suspicious
  conf: 0.98
  for:
  - javascript
  - typescript
  if:
    type: tree-sitter
    query: |-
      (for_in_statement
        left: (identifier) @candidate
        body: (statement_block
          (for_in_statement
            left: (identifier) @account
            body: (statement_block
              (lexical_declaration
                (variable_declarator value: (await_expression
                  (call_expression function: (identifier) @fetch
                    arguments: (arguments (_)
                      (object
                        (pair key: (property_identifier) @method
                          value: (string (string_fragment) @post))
                        (pair key: (property_identifier) @body
                          value: (new_expression constructor: (identifier) @encoder
                            arguments: (arguments (object
                              (pair key: (property_identifier) @user_key
                                value: (identifier) @account_used)
                              (pair key: (property_identifier) @pass_key
                                value: (identifier) @candidate_used))))))))))))))
        (#eq? @fetch "fetch") (#eq? @method "method") (#eq? @post "POST")
        (#eq? @body "body") (#eq? @encoder "URLSearchParams")
        (#eq? @user_key "username") (#eq? @pass_key "password")
        (#eq? @account @account_used) (#eq? @candidate @candidate_used)
        (#not-eq? @account @candidate))
