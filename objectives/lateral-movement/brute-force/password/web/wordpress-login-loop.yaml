# The helper call receives the loop candidate. HTTP evidence is file-scoped;
# it is not an interprocedural proof that the helper submits this exact value.
defaults:
  platforms: [unix, windows]
  for: [python]
  attack: T1110.001
composite_rules:
  - id: python-wordpress-password-guessing-workflow
    desc: WordPress HTTP code with password-candidate loop
    crit: suspicious
    conf: 0.96
    all:
      - id: micro-behaviors/data/collection/wordlist::python-password-loop-login-helper
      - id: micro-behaviors/communications/http/request/body::http-post-with-body-argument
      - id: micro-behaviors/communications/http/url/endpoint::wp-admin-endpoint-url

  - id: python-wordpress-wordlist-credential-brute-force
    desc: Automated wordlist password guessing against WordPress login
    crit: hostile
    conf: 0.98
    all:
      - id: python-wordpress-password-guessing-workflow
      - id: micro-behaviors/data/collection/wordlist::python-password-list-loop
    any:
      - id: micro-behaviors/data/collection/wordlist::python-wordlist-reference
      - id: micro-behaviors/process/argument/authentication::python-password-option
      - id: micro-behaviors/os/security/auth/password::admin1234
