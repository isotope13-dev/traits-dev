defaults:
  for: [ruby]
  platforms: [unix, windows]
  attack: T1110.001
traits:
  - id: metasploit-userpass-candidate-loop
    desc: Iterates Metasploit username password candidates
    crit: suspicious
    if:
      type: text
      exclude_comments: true
      regex: '\beach_user_pass\(true\)\s+do\s+\|'
  - id: graphql-authenticate-input
    desc: Builds GraphQL account password login
    crit: notable
    if:
      type: text
      exclude_comments: true
      regex: 'authenticate\(authInput:\s*\{account:\s*\{accountBy:\s*name,'
  - id: graphql-interpolated-auth-alias
    desc: Builds indexed GraphQL login aliases
    crit: notable
    if:
      type: text
      exclude_comments: true
      regex: '[A-Za-z_]#\{\w{1,40}\}:\s*authenticate\('
composite_rules:
  - id: graphql-batched-password-guessing
    desc: Username password candidates feed aliased GraphQL authentication batches
    crit: hostile
    all:
      - id: metasploit-userpass-candidate-loop
      - id: graphql-authenticate-input
      - id: graphql-interpolated-auth-alias
