# Password spraying reverses ordinary per-account brute-force loop order: one
# password is submitted across an account collection before the password is
# changed. The nested-loop shapes below capture that executable structure;
# credential-form and HTTP-call mechanics remain in micro-behaviors.
defaults:
  platforms: [windows, unix]
  for: [python, powershell, csharp]
  attack: T1110.003
  mbc: E1110

traits:
  - id: objectives/lateral-movement/brute-force/password/web::python-password-major-account-loop
    desc: Python account loop under password loop
    crit: suspicious
    conf: 0.97
    for: [python]
    if:
      type: tree-sitter
      query: |
        (for_statement
          left: (identifier) @password_var
          right: (identifier) @passwords
          body: (block
            (for_statement
              left: (identifier) @account_var
              right: (identifier) @accounts))
          (#match? @password_var "^(password|passwd|pwd)$")
          (#match? @passwords "^(passwords|passwds|password_list|password_candidates)$")
          (#match? @account_var "^(user|username|account)$")
          (#match? @accounts "^(users|usernames|accounts|account_list)$"))
    unless:
      - id: well-known/tool/offensive/keris::package-tree-member

  - id: objectives/lateral-movement/brute-force/password/web::powershell-password-major-account-loop
    desc: PowerShell account loop under password loop
    crit: suspicious
    conf: 0.97
    for: [powershell]
    if:
      type: tree-sitter
      query: |
        (foreach_statement
          (variable) @password_var
          (pipeline) @passwords
          (statement_block
            (statement_list
              (foreach_statement
                (variable) @account_var
                (pipeline) @accounts)))
          (#match? @password_var "(?i)^\\$(password|passwd|pwd)$")
          (#match? @passwords "(?i)^\\$(passwords|passwds|password_list|password_candidates)$")
          (#match? @account_var "(?i)^\\$(user|username|account)$")
          (#match? @accounts "(?i)^\\$(users|usernames|accounts|account_list)$"))

  - id: objectives/lateral-movement/brute-force/password/web::csharp-password-outer-loop
    desc: C# password loop contains nested loop
    crit: component
    conf: 0.95
    for: [csharp]
    if:
      type: tree-sitter
      kind: loop
      regex: '(?is)\bforeach.{0,32}\bpassword\b.{0,24}\bpasswords\b.{0,640}\bforeach\s*\('

composite_rules:
  - id: objectives/lateral-movement/brute-force/password/web::csharp-password-major-account-loop
    desc: C# account loop under password loop
    crit: suspicious
    conf: 0.97
    for: [csharp]
    near_lines: 22
    all:
      - id: objectives/lateral-movement/brute-force/password/web::csharp-password-outer-loop
    any:
      - id: micro-behaviors/data/control-flow/loop::csharp-user-collection-loop
      - id: micro-behaviors/data/control-flow/loop::csharp-account-collection-loop

  - id: objectives/lateral-movement/brute-force/password/web::python-http-password-major-iteration
    desc: Python password-major loop submits account credentials over HTTP
    crit: suspicious
    conf: 0.98
    for: [python]
    near_lines: 55
    all:
      - id: objectives/lateral-movement/brute-force/password/web::python-password-major-account-loop
      - id: micro-behaviors/communications/http/form::python-variable-credential-form-post

  - id: objectives/lateral-movement/brute-force/password/web::powershell-http-password-major-iteration
    desc: PowerShell password-major loop submits account credentials over HTTP
    crit: suspicious
    conf: 0.98
    for: [powershell]
    near_lines: 55
    all:
      - id: objectives/lateral-movement/brute-force/password/web::powershell-password-major-account-loop
      - id: micro-behaviors/communications/http/form::powershell-variable-credential-form-post

  - id: objectives/lateral-movement/brute-force/password/web::csharp-http-password-major-iteration
    desc: C# password-major loop submits account credentials over HTTP
    crit: suspicious
    conf: 0.98
    for: [csharp]
    near_lines: 60
    all:
      - id: objectives/lateral-movement/brute-force/password/web::csharp-password-major-account-loop
      - id: micro-behaviors/communications/http/form::csharp-variable-credential-form-post

  - id: objectives/lateral-movement/brute-force/password/web::http-password-spray
    desc: Password-major account iteration submits credentials over HTTP
    crit: suspicious
    conf: 0.99
    any:
      - id: objectives/lateral-movement/brute-force/password/web::python-http-password-major-iteration
      - id: objectives/lateral-movement/brute-force/password/web::powershell-http-password-major-iteration
      - id: objectives/lateral-movement/brute-force/password/web::csharp-http-password-major-iteration

  - id: objectives/lateral-movement/brute-force/password/web::low-and-slow-http-password-spray
    desc: HTTP password spray randomizes delays between account rounds
    crit: hostile
    conf: 0.99
    near_lines: 65
    all:
      - id: objectives/lateral-movement/brute-force/password/web::http-password-spray
    any:
      - id: micro-behaviors/time/sleep/interval::python-randomized-sleep
      - id: micro-behaviors/time/sleep/interval::ps-randomized-sleep
      - id: micro-behaviors/time/sleep/interval::csharp-randomized-sleep
