# Ordinary per-account brute force (an outer account loop, an inner password
# loop) is the credential-stuffing complement to the password-major spray
# shapes in account-spray.yaml. The loop-collection and wordlist atoms are
# individually neutral, and so is a bare socket connection; a policy auditor
# or test-data generator can share any one of them. Require the loop shape
# to actually open a network connection before calling it a spray attempt.
defaults:
  platforms: [windows, unix]
  for: [python]
  attack: T1110.001
  mbc: E1110

composite_rules:
  - id: python-network-credential-spray-loop
    desc: Python loops accounts and passwords over a connection
    crit: suspicious
    conf: 0.95
    near_lines: 15
    all:
      - id: micro-behaviors/data/control-flow/loop/collection::source-account-range-loop
      - id: micro-behaviors/data/collection/wordlist::python-password-list-loop
      - id: micro-behaviors/communications/socket/connect/attempt::socket-create-connection-call

  - id: tls-bypassed-internal-credential-spray
    desc: Credential spray loop bypasses TLS verification
    crit: suspicious
    conf: 0.95
    near_lines: 25
    all:
      - id: python-network-credential-spray-loop
      - id: micro-behaviors/communications/tls/verify/disable::tls-validation-fully-disabled
