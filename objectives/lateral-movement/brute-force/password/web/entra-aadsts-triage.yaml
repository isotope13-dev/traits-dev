# Entra ID (Azure AD) sign-in error codes that a spraying tool must tell apart:
# AADSTS50126 means the password was wrong, AADSTS50053 means the account is
# now locked, and AADSTS50034 means the user does not exist. A tool that
# classifies all three is sorting the results of guessing, so it can stop
# before lockouts and keep the valid accounts. Ordinary sign-in code surfaces
# the error to the user without branching on lockout.
#
# Spraying tools often keep the code table, the password-grant request, and
# the loop in different files. The package-scoped rule joins them.
defaults:
  platforms: [unix, windows]
  for: [python, powershell, javascript, typescript]
  attack: T1110.003
  mbc: E1110

traits:
  - id: aadsts-invalid-password-code
    desc: Entra invalid-password error code AADSTS50126
    crit: notable
    conf: 0.95
    if:
      type: text
      word: AADSTS50126

  - id: aadsts-account-locked-code
    desc: Entra account-locked error code AADSTS50053
    crit: notable
    conf: 0.95
    if:
      type: text
      word: AADSTS50053

composite_rules:
  - id: entra-sign-in-result-triage
    desc: Classifies Entra wrong-password, locked-account, and unknown-user codes
    crit: suspicious
    conf: 0.92
    all:
      - id: aadsts-invalid-password-code
      - id: aadsts-account-locked-code
      - id: micro-behaviors/communications/http/ws-trust::aadsts-account-existence-response-code

  - id: entra-password-spray-package
    desc: Package sends Microsoft password grants and triages lockout results
    crit: hostile
    conf: 0.96
    for: [tar, zip, whl, python-sdist, python]
    scope: archive
    all:
      - id: micro-behaviors/communications/http/oauth::password-grant-type
      - id: micro-behaviors/communications/http/services/microsoft::microsoft-login-domain
      - id: entra-sign-in-result-triage
