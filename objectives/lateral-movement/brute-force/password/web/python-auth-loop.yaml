# A password candidate submitted inside the same loop to an HTTP login call is
# an online password-guessing attempt. Keep the loop-bound candidate, password
# field, and request together so unrelated list processing and HTTP calls do
# not combine into a finding. The field binding itself is the data-shape trait
# under data/property/assign; a single saved-password login is not guessing.
defaults:
  platforms: [unix, windows]
  for: [python]
  attack: T1110.001
  mbc: E1110

composite_rules:
  - id: python-online-password-guessing
    desc: Python guesses passwords against an HTTP login
    crit: hostile
    conf: 0.99
    near_bytes: 2400
    near_lines: 30
    all:
      - id: micro-behaviors/data/collection/wordlist::python-password-list-loop
      - id: micro-behaviors/data/property/assign::python-pw-password-field
      - id: micro-behaviors/communications/http/request/body::http-post-with-body-argument
