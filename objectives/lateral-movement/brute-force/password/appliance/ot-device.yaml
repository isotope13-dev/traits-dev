# Factory-default credentials shipped on industrial and cellular edge devices.
#
# CERT Polska's heat-plant report has the intruder reaching an OT network
# because a WAGO PFC200 controller answered its web management interface on the
# password it left the factory with, on the far side of a Teltonika cellular
# router. These pairs are published in the vendors' own manuals, so an embedded
# copy is durable evidence the code is knocking on OT gear rather than a
# building block that drifts between campaigns — the same rationale as the
# sibling ZTE/Mirai router-credential atoms.
#
# Each atom requires the account *and* the password adjacent, so the vendor's
# own SDK mentioning its product name in prose does not match.
defaults:
  platforms: [unix, windows, appliance]
  for: [python, javascript, typescript, ruby, shell, powershell, go, perl, elf]
  attack: T1078.001
  crit: suspicious
  conf: 0.92

traits: []
composite_rules: []
