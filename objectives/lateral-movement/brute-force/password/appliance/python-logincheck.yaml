defaults:
  platforms: [unix, windows]
  for: [python]
  attack: T1110.001
traits:
  - id: python-logincheck-credential-pair-loop
    desc: Credential pairs loop into logincheck requests
    crit: suspicious
    conf: 0.99
    if:
      type: tree-sitter
      query: |
        ((for_statement
          left: (pattern_list (identifier) @user (identifier) @password)
          body: (block
            (expression_statement (assignment
              right: (call function: (attribute attribute: (identifier) @post)
                arguments: (argument_list
                  (string (string_content) @endpoint)
                  (keyword_argument name: (identifier) @data
                    value: (dictionary
                      (pair key: (string (string_content) @userkey)
                        value: (identifier) @sentuser)
                      (pair key: (string (string_content) @passkey)
                        value: (identifier) @sentpass))))))))) @loop
          (#eq? @post "post")
          (#match? @endpoint "/logincheck$")
          (#eq? @data "data")
          (#eq? @userkey "username")
          (#eq? @passkey "secretkey")
          (#eq? @user @sentuser)
          (#eq? @password @sentpass))

composite_rules:
  - id: python-fortinet-online-credential-guessing
    desc: Guesses credential pairs against Fortinet login
    crit: hostile
    conf: 0.99
    all:
      - id: python-logincheck-credential-pair-loop
      - id: micro-behaviors/communications/http/lib/requests::requests-session
