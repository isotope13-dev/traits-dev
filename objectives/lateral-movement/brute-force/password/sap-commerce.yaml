# SAP Commerce Data Hub Adapter ships a documented OAuth client named `eic`
# with the illustrative/default secret `secret`. SAP recommends replacing it.
# The credential pair alone is suspicious because distributed code that retains
# it can authenticate anywhere an installation has also retained the defaults.
# The composite requires the product-specific token path and a client-credential
# token request before identifying active use of that client.
defaults:
  platforms: [unix, windows]
  for: [python, javascript, typescript, ruby, shell, powershell, go, perl, java]
  attack: T1078.001

traits:
  - id: sap-commerce-default-oauth-client-id
    desc: SAP Commerce default OAuth client identifier
    crit: component
    conf: 0.94
    if:
      type: text
      regex: '(?i)\bclient[_-]?id\b["'']?\s*(=>|[:,=])\s*["'']?eic\b'

  - id: sap-commerce-default-oauth-client-secret
    desc: SAP Commerce default OAuth client secret
    crit: component
    conf: 0.94
    if:
      type: text
      regex: '(?i)\bclient[_-]?secret\b["'']?\s*(=>|[:,=])\s*["'']?secret\b'

composite_rules:
  - id: sap-commerce-default-oauth-client-pair
    desc: Embeds SAP Commerce default OAuth credentials
    crit: suspicious
    conf: 0.96
    all:
      - id: sap-commerce-default-oauth-client-id
      - id: sap-commerce-default-oauth-client-secret
    near_bytes: 256

  - id: sap-commerce-default-oauth-token-request
    desc: Uses SAP default client in OAuth token request
    crit: suspicious
    conf: 0.98
    all:
      - id: sap-commerce-default-oauth-client-pair
      - id: micro-behaviors/communications/http/oauth::sap-commerce-authorization-token-path
      - id: micro-behaviors/communications/http/oauth::oauth-client-credentials-grant-type
