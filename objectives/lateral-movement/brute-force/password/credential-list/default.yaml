defaults:
  platforms:
    - unix
    - android
  for:
    - elf
traits:
  - id: objectives/lateral-movement/brute-force/password/credential-list::numeric-123456
    desc: 'Default credential: 123456'
    crit: component
    conf: 0.8
    attack: T1110.001
    count_min: 2
    if:
      type: text
      exact: '123456'
  - id: objectives/lateral-movement/brute-force/password/credential-list::literal-password
    desc: 'Default credential: password'
    crit: component
    conf: 0.4
    attack: T1110.001
    if:
      type: text
      regex: ([\x00-\x1f]password[\x00-\x1f]?)
  - id: objectives/lateral-movement/brute-force/password/credential-list::admin123
    desc: 'Default credential literal: admin123'
    crit: component
    conf: 0.65
    attack: T1110.001
    if:
      type: text
      regex: '(^|[^A-Za-z0-9_])admin123([^A-Za-z0-9_]|$)'
  # A lone common-password literal is a building block, not standalone intent:
  # it appears identically in brute-force wordlists, config defaults, test
  # fixtures, password-strength blocklists, and API docstring examples. Brute-force
  # intent comes from the `dictionary` composite (needs 4 creds), matching the
  # sibling `qwerty-script`/`admin123` atoms.
  - id: objectives/lateral-movement/brute-force/password/credential-list::qwerty123-script
    desc: 'Default credential literal: qwerty123'
    crit: component
    conf: 0.55
    attack: T1110.001
    for:
      - python
      - javascript
    if:
      type: string_literal
      regex: '(^|[^A-Za-z0-9])qwerty123([^A-Za-z0-9]|$)'
    unless:
      - id: metadata/build/recognized-contexts::password-strength-blocklist-context
      - id: well-known/lib/ui/redoc::library
      - type: text
        regex: 'COMMON_PASSWORDS[\s\S]{0,1200}qwerty123'
      - type: text
        regex: 'checkPasswordStrength[\s\S]{0,1600}qwerty123'
  # Relocated from objectives/credential-access/theft/keywords (2026-08). The
  # matcher finds one common-password literal; it observes nothing about theft,
  # so it belongs with the sibling wordlist atoms and carries their criticality.
  # `password123456789` is the canonical 16-char example in AWS ElastiCache
  # docs, so it is reproduced verbatim across every generated cloud SDK.
  - id: objectives/lateral-movement/brute-force/password/credential-list::password12345678-script
    desc: 'Default credential literal: password12345678'
    crit: notable
    conf: 0.55
    attack: T1110.001
    for:
      - scripts
      - source
    if:
      type: literal
      kind: string
      substr: password12345678
    unless:
      - id: metadata/build/recognized-contexts::password-strength-blocklist-context
      - id: metadata/package/testing/presence/fixture::test-filename-pattern
      - id: metadata/lang/compiler/generated::pulumi-language-python-generated
  - id: objectives/lateral-movement/brute-force/password/credential-list::qwerty-script
    desc: 'Default credential: qwerty'
    crit: component
    conf: 0.5
    attack: T1110.001
    for:
      - python
      - javascript
    if:
      type: string_literal
      regex: '(^|[^A-Za-z0-9])qwerty([^A-Za-z0-9]|$)'
    unless:
      - id: metadata/build/recognized-contexts::password-strength-blocklist-context
      - id: well-known/lib/ui/redoc::library
      - id: metadata/package/testing/presence/harness/
      - id: "metadata/file/naming::test-directory-component"
  - id: objectives/lateral-movement/brute-force/password/credential-list::literal-default
    desc: 'Default credential: default'
    crit: component
    conf: 0.5
    attack: T1110.001
    size_max: 5242880
    if:
      type: text
      regex: '[\x00-\x1f]default[\x00-\x1f]?'
    unless:
      - id: well-known/tool/sysadmin/busybox::busybox-binary
      - type: trait
        id: metadata/file/extension/identity::linux-kernel-package-artifact-basename
  - id: objectives/lateral-movement/brute-force/password/credential-list::guest
    # A bare guest token occurs in password-strength blocklists and ordinary
    # prose as well as credential dictionaries. It only acquires brute-force
    # meaning when the dictionary composite finds several independent tokens.
    desc: Isolated guest credential token
    crit: component
    conf: 0.55
    attack: T1110.001
    if:
      type: text
      regex: ([\x00-\x1f]guest[\x00-\x1f]?)
    unless:
      # Samba/SMB share-permission vocabulary ("guest ok", "guest_ok=",
      # "usershare allow guests", "lp_guest_account") is not a brute-force
      # credential token. A real dictionary embeds bare "guest", never these.
      - type: text
        regex: 'guest[ _]ok|guest_account|allow_guests'
      - type: text
        regex: 'allow guests|Guest user'
      - id: well-known/app/infrastructure/aws-vault/
      - id: well-known/tool/sysadmin/virtualization::lima-virtualization-tool
      - id: well-known/tool/sysadmin/alpine-packages/binary::alpine-filebrowser-binary
      - id: well-known/tool/sysadmin/proot::proot-binary
  - id: objectives/lateral-movement/brute-force/password/credential-list::iot-pte521
    desc: 'Default IoT credential: Pte521'
    crit: suspicious
    conf: 0.9
    attack: T1110.001
    if:
      type: text
      substr: Pte521
  - id: objectives/lateral-movement/brute-force/password/credential-list::iot-pon521
    desc: 'Default IoT credential: Pon521'
    crit: suspicious
    conf: 0.9
    attack: T1110.001
    if:
      type: text
      substr: Pon521
  - id: objectives/lateral-movement/brute-force/password/credential-list::iot-zxic521
    desc: 'Default IoT credential: Zxic521'
    crit: suspicious
    conf: 0.9
    attack: T1110.001
    if:
      type: text
      substr: Zxic521
  - id: objectives/lateral-movement/brute-force/password/credential-list::cred-word-admin
    desc: "Delimited credential word 'admin'"
    crit: component
    conf: 0.7
    if:
      type: text
      regex: '[\x00-\x1f]admin[\x00-\x1f]?'
  - id: objectives/lateral-movement/brute-force/password/credential-list::cred-word-root
    desc: "Delimited credential word 'root'"
    crit: component
    conf: 0.7
    if:
      type: text
      regex: '[\x00-\x1f]root[\x00-\x1f]?'
  - id: objectives/lateral-movement/brute-force/password/credential-list::cred-word-password
    desc: "Delimited credential word 'password'"
    crit: component
    conf: 0.7
    if:
      type: text
      regex: '[\x00-\x1f]password[\x00-\x1f]?'
  - id: objectives/lateral-movement/brute-force/password/credential-list::cred-word-default
    desc: "Delimited credential word 'default'"
    crit: component
    conf: 0.7
    if:
      type: text
      regex: '[\x00-\x1f]default[\x00-\x1f]?'
  - id: objectives/lateral-movement/brute-force/password/credential-list::cred-word-guest
    desc: "Delimited credential word 'guest'"
    crit: component
    conf: 0.7
    if:
      type: text
      regex: '[\x00-\x1f]guest[\x00-\x1f]?'
  - id: objectives/lateral-movement/brute-force/password/credential-list::cred-word-user
    desc: "Delimited credential word 'user'"
    crit: component
    conf: 0.7
    if:
      type: text
      regex: '[\x00-\x1f]user[\x00-\x1f]?'
  - id: objectives/lateral-movement/brute-force/password/credential-list::cred-word-1234
    desc: "Delimited credential word '1234'"
    crit: component
    conf: 0.7
    if:
      type: text
      regex: '[\x00-\x1f]1234[\x00-\x1f]?'
  - id: objectives/lateral-movement/brute-force/password/credential-list::cred-word-qwerty
    desc: "Delimited credential word 'qwerty'"
    crit: component
    conf: 0.7
    if:
      type: text
      regex: '[\x00-\x1f]qwerty[\x00-\x1f]?'
  - id: objectives/lateral-movement/brute-force/password/credential-list::weak-pass-admin123-upper
    desc: Weak password Admin123
    crit: notable
    conf: 0.5
    attack: T1110.001
    for:
      - python
      - javascript
    if:
      type: string_literal
      substr: Admin123
    unless:
      - id: metadata/build/recognized-contexts::password-strength-blocklist-context
  - id: objectives/lateral-movement/brute-force/password/credential-list::weak-pass-passw0rd
    desc: Weak password Passw0rd
    crit: notable
    conf: 0.7
    attack: T1110.001
    for:
      - python
      - javascript
    if:
      type: string_literal
      substr: Passw0rd
    unless:
      - id: metadata/build/recognized-contexts::password-strength-blocklist-context

  - id: objectives/lateral-movement/brute-force/password/credential-list::common-account-weak-password-pair
    desc: Common account paired with weak password
    crit: notable
    conf: 0.86
    for: [scripts]
    platforms: [unix, windows]
    attack: T1110.001
    if:
      type: text
      # Trailing ||/&& is folded into the span so the `not:` below can tell
      # a code fallback (`user: user || 'anon'`) from a static pair. The
      # regex engine has no lookaround, so this cannot be an assertion.
      # A pair needs a list separator (colon, comma, tab); 'admin password'
      # with only a space between is documentation prose.
      regex: '\b(admin|operator|root)\b[ \t]*[,:|\t][ \t,:|]{0,10}\b(password|1234)\b(\s*(\|\||&&))?'
      case_insensitive: true
    unless:
      - id: metadata/package/testing/corpus::inert-security-input-module
      - id: metadata/build/recognized-contexts::password-strength-blocklist-context
      - id: well-known/lib/ai/pyaigis/
      - id: well-known/tool/detection/llm-scanner/
      - id: well-known/tool/detection/security-scanner/
    not:
      - regex: '(?i)\b(admin|operator|root)\b\s*[/|]'
      # `user: password || 'anon'` is a default expression, not a pair.
      - regex: '(?i)\b(password|1234)\s*(\|\||&&)'

  - id: objectives/lateral-movement/brute-force/password/credential-list::common-account-root-password-pair
    desc: Common account paired with root password
    crit: notable
    conf: 0.86
    for: [scripts]
    platforms: [unix, windows]
    attack: T1110.001
    if:
      type: literal
      # Trailing ||/&& is folded into the span so the `not:` below can tell
      # a code fallback (`{ template: t, root: root || path }`) from a static
      # pair. The regex engine has no lookaround, so this cannot be an
      # assertion.
      # A leading ':param ' or 'chown [-R] ', and a trailing '.' (attribute
      # access: 'root: root.test'), are folded into the span for the not: list.
      regex: '^(admin|operator|root)\s*[,:|]{1,3} *(root|toor)\s*$'
      case_insensitive: true
    unless:
      - id: metadata/build/recognized-contexts::password-strength-blocklist-context
      - id: metadata/file/format/source-map::sourcemap-context
      - id: well-known/lib/ui/mermaid::mermaid-diagram-library
      - id: well-known/lib/ai/pyaigis/
      - id: well-known/tool/detection/llm-scanner/
      - id: well-known/tool/detection/security-scanner/
    not:
      - regex: '(?i)\b(admin|operator|root)\b\s*[/|]'
      # Owner/group arguments such as `chown root:root` are not credentials.
      - regex: '(?i)^chown '
      - regex: '^:param '
      - regex: '\.$'
      # Self-named root fields and tree-walk arguments are ambiguous.
      - regex: '(?i)\broot\s*[:,]\s*root\b'
      # `root: root || dir` is a default expression, not a pair.
      - regex: '(?i)\b(root|toor)\s*(\|\||&&)'

composite_rules:
  - id: objectives/lateral-movement/brute-force/password/credential-list::embedded-default-account-pairs
    desc: Embeds multiple default credential pairs
    crit: notable
    conf: 0.86
    for: [scripts]
    platforms: [unix, windows]
    attack: T1110.001
    needs: 2
    any:
      - id: objectives/lateral-movement/brute-force/password/credential-list::common-account-weak-password-pair
      - id: micro-behaviors/os/security/auth/password::common-account-pair-literal
      - id: objectives/lateral-movement/brute-force/password/credential-list::common-account-root-password-pair
    unless:
      - id: metadata/build/recognized-contexts::password-strength-blocklist-context
      - id: well-known/lib/ai/pyaigis/
      - id: well-known/tool/detection/llm-scanner/
      - id: well-known/tool/detection/security-scanner/

  - id: objectives/lateral-movement/brute-force/password/credential-list::credential-wordlist
    desc: Dense credential wordlist (brute-force dictionary)
    crit: suspicious
    conf: 0.92
    attack: T1110.001
    size_max: 200000
    # Four DISTINCT words, not one. A single control-char-delimited `root` or
    # `default` is an ordinary ELF string-table entry -- Python's grp, _curses
    # and fcntl modules and gpgme-json each carry one or two -- so the old
    # alternation reported a "dense dictionary" from a single common word.
    needs: 4
    unless:
      - id: micro-behaviors/ui/help::usage-help
    any:
      - id: objectives/lateral-movement/brute-force/password/credential-list::cred-word-admin
      - id: objectives/lateral-movement/brute-force/password/credential-list::cred-word-root
      - id: objectives/lateral-movement/brute-force/password/credential-list::cred-word-password
      - id: objectives/lateral-movement/brute-force/password/credential-list::cred-word-default
      - id: objectives/lateral-movement/brute-force/password/credential-list::cred-word-guest
      - id: objectives/lateral-movement/brute-force/password/credential-list::cred-word-user
      - id: objectives/lateral-movement/brute-force/password/credential-list::cred-word-1234
      - id: objectives/lateral-movement/brute-force/password/credential-list::cred-word-qwerty
    downgrade:
      any:
        - id: metadata/lang/compiler/systems::go-binary
  - id: objectives/lateral-movement/brute-force/password/credential-list::iot-zte
    desc: 'Default IoT credential: ZTE router'
    crit: suspicious
    conf: 0.95
    attack: T1110.001
    any:
      - id: objectives/lateral-movement/brute-force/iot-creds::router-cred-zte
      - id: objectives/lateral-movement/brute-force/password/credential-list::iot-pte521
      - id: objectives/lateral-movement/brute-force/password/credential-list::iot-pon521
      - id: objectives/lateral-movement/brute-force/password/credential-list::iot-zxic521
  - id: objectives/lateral-movement/brute-force/password/credential-list::dictionary
    desc: Embedded credential brute-force dictionary
    crit: suspicious
    conf: 0.9
    mbc: E1040
    attack: T1110.001
    needs: 4
    unless:
      - id: well-known/app/infrastructure/aws-vault/
      - id: well-known/tool/sysadmin/alpine-packages/binary::alpine-filebrowser-binary
    any:
      - id: objectives/discovery/account/keywords
      - id: objectives/lateral-movement/brute-force/password/credential-list::guest
      - id: objectives/lateral-movement/brute-force/password/credential-list::numeric-123456
      - id: objectives/lateral-movement/brute-force/password/credential-list::literal-password
      - id: objectives/lateral-movement/brute-force/password/credential-list::admin123
      - id: objectives/lateral-movement/brute-force/password/credential-list::literal-default
      - id: objectives/lateral-movement/brute-force/password/credential-list::qwerty123-script
      - id: objectives/lateral-movement/brute-force/password/credential-list::qwerty-script
      - id: objectives/lateral-movement/brute-force/password/credential-list::password12345678-script
