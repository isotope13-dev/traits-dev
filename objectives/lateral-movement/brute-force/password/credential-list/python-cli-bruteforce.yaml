defaults:
  platforms:
    - unix
    - windows
  for:
    - python
  attack: T1110.001

composite_rules:
  - id: python-cli-username-wordlist-bruteforce
    desc: Prompts for username and wordlist to run shell brute-force command
    crit: hostile
    conf: 0.98
    near_lines: 10
    all:
      - id: micro-behaviors/ui/terminal::python-username-input-prompt
      - id: micro-behaviors/data/collection/wordlist::python-wordlist-reference
      - id: micro-behaviors/process/create/shell/command-mode::python-os-system-interpolated-command
    unless:
      - id: metadata/lang/source/shape::python-literal-module-quoted-source
