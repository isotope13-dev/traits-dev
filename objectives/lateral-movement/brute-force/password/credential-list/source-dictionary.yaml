defaults:
  platforms: [unix, windows]
  for: [c, cpp]
  attack: T1110.001

# Credential dictionaries compiled from C source. The ELF default atoms cannot
# see string literals in source, so a header such as passwd.h carrying the same
# role-name and default-password tokens is evaluated here. Each atom is one
# distinctive token; the composite asks for several distinct tokens so a single
# common word cannot satisfy it.
traits:
  - id: source-cred-wwwadmin
    desc: "Default credential literal: wwwadmin"
    crit: component
    conf: 0.6
    if:
      type: literal
      kind: string
      exact: wwwadmin

  - id: source-cred-administrador
    desc: "Default credential literal: administrador"
    crit: component
    conf: 0.6
    if:
      type: literal
      kind: string
      exact: administrador

  - id: source-cred-administrateur
    desc: "Default credential literal: administrateur"
    crit: component
    conf: 0.6
    if:
      type: literal
      kind: string
      exact: administrateur

  - id: source-cred-administrat
    desc: "Default credential literal: administrat"
    crit: component
    conf: 0.6
    if:
      type: literal
      kind: string
      exact: administrat

  - id: source-cred-dba
    desc: "Default credential literal: dba"
    crit: component
    conf: 0.5
    if:
      type: literal
      kind: string
      exact: dba

  - id: source-cred-db2
    desc: "Default credential literal: db2"
    crit: component
    conf: 0.5
    if:
      type: literal
      kind: string
      exact: db2

  - id: source-cred-oracle
    desc: "Default credential literal: oracle"
    crit: component
    conf: 0.5
    if:
      type: literal
      kind: string
      exact: oracle

  - id: source-cred-teacher
    desc: "Default credential literal: teacher"
    crit: component
    conf: 0.5
    if:
      type: literal
      kind: string
      exact: teacher

  - id: source-cred-student
    desc: "Default credential literal: student"
    crit: component
    conf: 0.5
    if:
      type: literal
      kind: string
      exact: student

  - id: source-cred-admin123
    desc: "Default credential literal: admin123"
    crit: component
    conf: 0.6
    if:
      type: literal
      kind: string
      exact: admin123

composite_rules:
  - id: source-credential-dictionary
    desc: C source embeds a default credential dictionary
    crit: suspicious
    conf: 0.85
    needs: 4
    any:
      - id: source-cred-wwwadmin
      - id: source-cred-administrador
      - id: source-cred-administrateur
      - id: source-cred-administrat
      - id: source-cred-dba
      - id: source-cred-db2
      - id: source-cred-oracle
      - id: source-cred-teacher
      - id: source-cred-student
      - id: source-cred-admin123
