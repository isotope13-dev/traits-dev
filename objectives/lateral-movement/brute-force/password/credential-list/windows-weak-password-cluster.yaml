defaults:
  platforms: [windows]
  for: [pe, dll]
  attack: T1110.001

# Weak passwords stored as separate strings form a credential list, not UI
# text. Bare words such as "admin" or "user" are left out because they occur in
# ordinary binaries. Each atom is one family of entries; the composite asks for
# several families so one repeated literal cannot satisfy it.
traits:
  - id: weak-password-role-digits
    desc: Role-name password with 123 suffix
    crit: component
    conf: 0.6
    if:
      type: text
      regex: '(?im)^(admin(istrator)?|guest|user|test|root)123$'

  - id: weak-password-keyboard-walk
    desc: Keyboard-walk password literal
    crit: component
    conf: 0.6
    if:
      type: text
      regex: '(?im)^(qwerty(123)?|qwe(123|321))$'

  - id: weak-password-mixed-sequence
    desc: Short mixed alphanumeric password literal
    crit: component
    conf: 0.6
    if:
      type: text
      regex: '(?im)^(123qwe|1q2w3e|abc123|pass123)$'

  - id: weak-password-common-word
    desc: Common password word literal
    crit: component
    conf: 0.6
    if:
      type: text
      regex: '(?im)^(passw0rd|password1?|secret|admin1234)$'

  - id: weak-password-numeric-run
    desc: Long numeric-run password literal
    crit: component
    conf: 0.6
    if:
      type: text
      regex: '(?im)^(1234567|12345678|123456789|1234567890)$'

composite_rules:
  - id: weak-password-literal-cluster
    desc: Binary embeds several weak-password families
    crit: notable
    conf: 0.85
    needs: 3
    near_bytes: 4096
    any:
      - id: weak-password-role-digits
      - id: weak-password-keyboard-walk
      - id: weak-password-mixed-sequence
      - id: weak-password-common-word
      - id: weak-password-numeric-run
    unless:
      - id: metadata/build/recognized-contexts::password-strength-blocklist-context
