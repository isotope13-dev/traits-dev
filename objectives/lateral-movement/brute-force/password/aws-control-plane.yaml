# CloudTrail can expose AWS root-user password spraying without revealing the
# password or the sign-in request body. A single failed root login is security-
# relevant but ambiguous; repeated failures in one collected log are stronger
# evidence of credential guessing while remaining short of conclusive malice.
defaults:
  platforms: [unix, windows]
  for: [json]
  mbc: E1110

traits:
  - id: multiple-aws-console-login-failures
    desc: Multiple AWS console login failures
    crit: suspicious
    conf: 0.97
    attack: T1110
    count_min: 2
    if:
      type: text
      regex: '(?is)"responseElements"\s*:\s*\{[^\}]{0,256}"ConsoleLogin"\s*:\s*"Failure"'

composite_rules:
  - id: repeated-failed-aws-root-console-logins
    desc: Repeated failed AWS root console logins
    crit: suspicious
    conf: 0.99
    attack: T1110.003
    all:
      - id: multiple-aws-console-login-failures
      - id: micro-behaviors/communications/http/services/aws::multiple-aws-root-console-login-events
