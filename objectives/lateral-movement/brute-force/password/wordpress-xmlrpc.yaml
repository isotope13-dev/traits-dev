# WordPress XML-RPC password guessing repeatedly substitutes candidates from a
# wordlist into wp.getUsersBlogs requests. The endpoint and protocol method are
# stable even when operators change usernames, wordlists, or target hosts.
defaults:
  platforms: [unix, windows]
  for: [python]
  attack: T1110.001
  mbc: E1110

traits:
  - id: python-named-wordlist-open
    desc: Python opens a named wordlist
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: 'with\s+open\(.{1,120}\)\s+as\s+(wordlist|passwords|candidates)\s*:'

  - id: python-enumerated-password-loop
    desc: Python enumerates wordlist password candidates
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: 'for\s+\w+,\s*(pass(word)?|pwd|candidate)\s+in\s+enumerate\((wordlist|passwords)\)'

  - id: python-direct-password-loop
    desc: Python loops over wordlist passwords
    crit: notable
    conf: 0.92
    if:
      type: text
      regex: 'for\s+(pass(word)?|pwd|candidate)\s+in\s+(wordlist|passwords|candidates)'

composite_rules:
  - id: python-password-wordlist-iteration
    desc: Python iterates wordlist password candidates
    crit: notable
    conf: 0.96
    near_lines: 8
    all:
      - id: python-named-wordlist-open
    any:
      - id: python-enumerated-password-loop
      - id: python-direct-password-loop

  - id: wordpress-xmlrpc-wordlist-password-guessing
    desc: Guesses WordPress passwords over XML-RPC from a wordlist
    crit: hostile
    conf: 0.995
    near_bytes: 2400
    all:
      - id: objectives/credential-access/validation/check::python-wordpress-xmlrpc-credential-validation
      - id: python-password-wordlist-iteration
