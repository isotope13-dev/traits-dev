defaults:
  platforms: [unix, windows]
  for: [mirc, ircii]
  crit: notable
  conf: 0.94

traits:
  - id: mirc-ftp-user-commands
    desc: Multiple FTP USER commands via socket
    count_min: 2
    if:
      type: text
      regex: '(?im)^[ \t]*(n\d+=[ \t]*)?[/.]{0,2}sockwrite[ \t]+(-\w+[ \t]+)?\S+[ \t]+USER[ \t]+'

  - id: mirc-ftp-password-commands
    desc: Repeated FTP PASS commands via socket
    count_min: 3
    if:
      type: text
      regex: '(?im)^[ \t]*(n\d+=[ \t]*)?[/.]{0,2}sockwrite[ \t]+(-\w+[ \t]+)?\S+[ \t]+PASS[ \t]+'

composite_rules:
  - id: mirc-ftp-address-sweep-credential-guessing
    desc: mIRC probes numeric addresses and tries multiple FTP logins
    crit: hostile
    conf: 0.96
    attack: T1110
    all:
      - id: objectives/command-and-control/channel/irc/client::mirc-sockopen-longip-target
      - id: mirc-ftp-user-commands
      - id: mirc-ftp-password-commands
