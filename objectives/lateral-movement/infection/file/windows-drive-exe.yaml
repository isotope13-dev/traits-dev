# Native PE that reads its own image, walks fixed drives for *.exe, and
# rewrites victims while skipping OS/system directories — classic local
# file-infector / drive worm behavior (T1091 / T1083 / T1554).
defaults:
  platforms: [windows]
  for: [pe]
  attack: T1091,T1083,T1554
  size_max: 20971520

traits:
  - id: skip-program-files-dir
    desc: Skips Program Files during file walk
    crit: component
    conf: 0.9
    if:
      type: text
      regex: '(?i)\\program files(\s*\(x86\))?\\'
      section: ".rdata"

  - id: skip-recycle-bin-dir
    desc: Skips Recycle Bin during file walk
    crit: component
    conf: 0.9
    if:
      type: text
      regex: '(?i)\\\$recycle\.bin\\'
      section: ".rdata"

  - id: skip-system-volume-info-dir
    desc: Skips System Volume Information dir
    crit: component
    conf: 0.9
    if:
      type: text
      regex: '(?i)\\system volume information\\'
      section: ".rdata"

composite_rules:
  - id: fixed-drive-exe-walker-infector
    desc: Walks drives for *.exe after reading own image
    crit: hostile
    conf: 0.97
    all:
      - id: objectives/anti-static/obfuscation/payload/self-read::self-read-file-import-chain-ansi
      - id: micro-behaviors/fs/traversal/drives::get-logical-drives
      - id: micro-behaviors/fs/traversal/drives::get-drive-type
      - id: micro-behaviors/fs/enumerate/directory::find-file-walker
      - id: objectives/impact/infect/binary/rewrite::executable-wildcard-mask
      - id: micro-behaviors/fs/file/open::file-create-win
      - id: micro-behaviors/fs/file/read::read-file
      - id: micro-behaviors/fs/file/write/direct::write-file
    any:
      - id: skip-program-files-dir
      - id: skip-recycle-bin-dir
      - id: skip-system-volume-info-dir
    needs: 2
    unless:
      - id: metadata/signed/platform::microsoft-windows
      - id: metadata/signed/leaf::microsoft-corporation
      - id: metadata/binary/installer/family/

  - id: infection-taunt-notepad-overlay-carrier
    desc: Infection taunt opens notepad; PE overlay carrier
    crit: hostile
    conf: 0.96
    all:
      - id: objectives/impact/infect/terms::computer-done-for-taunt
      - id: micro-behaviors/process/create/exec::shell-execute-a
      - id: metadata/file/string/process-name::notepad-exe-name
      - id: metadata/binary/layout::overlay-over-30pct
      - id: metadata/binary/layout::multiple-pe-embedded
    unless:
      - id: metadata/signed/platform::microsoft-windows
      - id: metadata/signed/leaf::microsoft-corporation
