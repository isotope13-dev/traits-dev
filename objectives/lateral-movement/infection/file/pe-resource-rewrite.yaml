# PE resource-entrypoint loaders that also expose the file-rewrite scaffold
# used by direct-action viruses.  The structural legs keep ordinary resource
# compilers, packers, and file utilities out of this objective.
defaults:
  platforms: [windows]
  for: [pe, dll]

composite_rules:
  - id: resource-entrypoint-file-rewriter
    desc: Executable-resource PE exposes a direct file-rewrite scaffold
    crit: hostile
    conf: 0.97
    attack: T1083,T1554
    all:
      - id: metadata/binary/resource::executable-rsrc-section
      - id: metadata/binary/section/metrics::pe-entry-in-writable-section
      - id: micro-behaviors/data/embedded/payload/header::inline-pe-header-walk
      - id: micro-behaviors/fs/enumerate/directory::find-first-file-a
      - id: micro-behaviors/fs/file/read::read-file
      - id: micro-behaviors/fs/file/write/direct::write-file
      - id: micro-behaviors/fs/file/handle::set-file-pointer
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/installer/family/
      - id: objectives/anti-static/pack/
