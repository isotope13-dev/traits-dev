# PE resource-entrypoint loaders that also expose the file-rewrite scaffold
# used by direct-action viruses.  The structural legs keep ordinary resource
# compilers, packers, and file utilities out of this objective.
defaults:
  platforms: [windows]
  for: [pe, dll]

composite_rules:
  - id: resource-entrypoint-file-rewriter
    desc: Executable-resource PE exposes a direct file-rewrite scaffold
    crit: hostile
    conf: 0.97
    attack: T1083,T1554
    all:
      - id: metadata/binary/section/permission::executable-rsrc-section
      - id: metadata/binary/section/header::pe-entry-in-writable-section
      - id: metadata/binary/instruction/operand::x86-pointer-load-displacement-3c
      - id: micro-behaviors/fs/directory/readdir/native::find-first-file-a
      - id: micro-behaviors/fs/read/file/handle::read-file
      - id: micro-behaviors/fs/write/file/handle::write-file
      - id: micro-behaviors/fs/file/handle::set-file-pointer
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/installer/family/
      - id: metadata/lang/compiled::autoit-compiled-script
      - id: well-known/app/utility/silentall/
      - id: "objectives/anti-static/pack"
      - id: metadata/binary/section/label::enigma-numbered-section-label
      - id: metadata/binary/section/layout::winlicense-memory-section
      - id: metadata/binary/section/entropy::large-high-entropy-boot-section
      - id: metadata/binary/section/layout::winlicense-boot-loader-layout
  - id: oversized-resource-stub-pe-file-rewriter
    desc: Packed oversized resource stub rewrites PE hosts
    crit: hostile
    conf: 0.97
    attack: T1083,T1554,T1027.009
    all:
      - id: metadata/binary/section/header::pe-entry-in-writable-section
      - id: metadata/binary/resource/size::oversized-rsrc
      - id: metadata/binary/instruction/operand::x86-pointer-load-displacement-3c
      - id: micro-behaviors/fs/directory/readdir/native::find-first-file-ex
      - id: micro-behaviors/fs/read/file/handle::read-file
      - id: micro-behaviors/fs/write/file/handle::write-file
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/installer/family/
      - id: metadata/lang/compiled::autoit-compiled-script
      - id: well-known/app/utility/silentall/
