defaults:
  platforms: [windows]
  for: [html]
  attack: T1080, T1554
  mbc: B0032

composite_rules:
  - id: vbs-html-file-infector
    desc: VBScript infects HTML files with virus body
    crit: hostile
    conf: 0.99
    all:
      - id: micro-behaviors/process/interpreter/scripting::html-vbscript-block
      - id: micro-behaviors/os/com/automation::filesystemobject-constructor
      - id: micro-behaviors/fs/directory/readdir::fso-folder-files
      - id: micro-behaviors/ui/window/dom/access::document-body-innerhtml-reference
      - id: objectives/impact/infect/virus::html-prepender-body-write
    near_bytes: 1500
