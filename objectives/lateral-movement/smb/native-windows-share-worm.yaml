defaults:
  platforms: [windows]
  for: [pe, dll]
  attack: T1021.002

composite_rules:
  - id: native-share-module-copy
    desc: Enumerates SMB resources, connects to shares and copies its module
    crit: suspicious
    conf: 0.96
    all:
      - id: micro-behaviors/communications/socket/share::wnet-share-scan
      - id: micro-behaviors/os/network/share::wnet-add-connection
      - id: micro-behaviors/fs/file/copy::copyfile-module-path-api-pair
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/installer/family/
  - id: native-share-copy-with-process-injection
    desc: Remote-share module copy combined with process injection
    crit: hostile
    conf: 0.98
    attack: T1021.002,T1055.012
    all:
      - id: objectives/lateral-movement/smb::native-share-module-copy
      - id: objectives/evasion/process/injection/hollowing/process::native-suspended-process-injection-chain
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/installer/family/
  - id: native-admin-share-payload-launch
    desc: Admin-share self-copy and remote AT launch
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/fs/path/reference::admin-share-executable-path
      - id: micro-behaviors/fs/file/copy::copyfile-module-path-api-pair
      - id: micro-behaviors/os/autorun/scheduled::remote-at-command-template
      - id: micro-behaviors/process/create/exec::winexec
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/installer/family/
