defaults:
  platforms: [windows]
  for: [pe, dll]
  attack: T1021.002

traits:
  - id: native-share-executable-target
    desc: Executable target on a remote admin share
    crit: suspicious
    conf: 0.95
    if:
      type: text
      regex: '(?i)\\\\%s\\(C\$|[A-Z]\$|ADMIN\$)\\[^\r\n"'']{1,100}\.exe'

composite_rules:
  - id: native-admin-share-payload-launch
    desc: Admin-share payload staging and launch
    crit: hostile
    conf: 0.98
    all:
      - id: native-share-executable-target
      - id: micro-behaviors/process/create/exec::winexec
      - id: micro-behaviors/fs/path/config/autorun::autorun-inf-string
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/installer/family/
