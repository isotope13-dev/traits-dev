defaults:
  crit: suspicious
  for:
    - c
    - cpp
  platforms:
    - windows
  attack: T1021.002
traits:
  - id: admin-share-drop-path
    desc: Admin share payload path
    conf: 0.98
    if:
      type: text
      regex: Admin\\$\\\\system32\\\\GT\\.exe
  - id: legacy-system-drop-path
    desc: WinNT share payload path
    conf: 0.98
    if:
      type: text
      regex: c\\$\\\\winnt\\\\system32\\\\GT\\.exe
  - id: local-payload-stager
    desc: Local payload staging file
    conf: 0.98
    if:
      type: string_literal
      exact: moo.dat
  - id: vim-win32-source
    desc: Vim Win32 port source
    crit: notable
    conf: 0.95
    if:
      type: path
      regex: '(^|[\\/])(misc1|os_win32)\.c$'
composite_rules:
  - id: smb-share-propagation-primitives
    desc: SMB propagation API chain
    conf: 0.96
    needs: 3
    any:
      - id: micro-behaviors/os/network/share/
      - id: admin-share-drop-path
      - id: legacy-system-drop-path
      - id: local-payload-stager
  - id: remote-drop-or-enum
    desc: Remote share drop or enumeration
    conf: 0.96
    any:
      - id: admin-share-drop-path
      - id: legacy-system-drop-path
      - id: micro-behaviors/os/service/remote::net-user-enum-source
      - id: micro-behaviors/os/network/share::ipc-null-session-path

    unless:
      # SDK headers declare NetUserEnum and IPC paths; they do not use them.
      - id: metadata/lang/upstream::windows-sdk-header-file
      # Wine installs Win32 compatibility headers under include/wine/windows.
      - id: well-known/lib/platform/wine::wine-installed-sdk-header-path
      - id: vim-win32-source

  - id: wsh-enables-lanman-share
    desc: Script enables a LanMan admin share
    crit: hostile
    conf: 0.94
    for: [vbs, javascript, static-lib]
    all:
      - id: micro-behaviors/os/registry/write/wsh::wscript-regwrite
      - id: micro-behaviors/fs/path/reference::lanman-share-registry-path
