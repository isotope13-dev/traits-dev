defaults:
  platforms: [windows]
  for: [text, source, scripts, powershell, python, batch, shell, csharp, javascript, typescript, go, rust]
traits:
  - id: petitpotam-coercion-command
    desc: PetitPotam coercion command reference
    crit: suspicious
    conf: 0.98
    if:
      type: text
      regex: '(?i)\bPetitPotam(\.py)?\b.{0,260}\b\d{1,3}(\.\d{1,3}){3}\b'
