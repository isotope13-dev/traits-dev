defaults:
  platforms: [unix, windows]
  for: [go]
  conf: 0.95
traits:
  - id: go-smb-default-authentication-loop
    desc: Default authentication targets looped SMB hosts
    crit: suspicious
    if:
      type: tree-sitter
      query: |
        ((for_statement
          (range_clause
            left: (expression_list (identifier) (identifier) @host))
          body: (block (statement_list
            (short_var_declaration
              left: (expression_list . (identifier) @session)
              right: (expression_list . (call_expression
                function: (selector_expression
                  operand: (identifier) @smb field: (field_identifier) @new)
                arguments: (argument_list . (identifier) @target))))
            . (expression_statement (call_expression
              function: (selector_expression
                operand: (identifier) @used_session field: (field_identifier) @auth)
              arguments: (argument_list
                . (interpreted_string_literal) @user
                . (interpreted_string_literal) @password .)))))) @evidence
          (#eq? @host @target)
          (#eq? @session @used_session)
          (#eq? @smb "smb")
          (#eq? @new "NewSession")
          (#eq? @auth "Authenticate")
          (#eq? @user "\"administrator\"")
          (#eq? @password "\"password\""))
composite_rules:
  - id: go-smb-default-credential-authentication
    desc: SMB setup beside default authentication
    crit: suspicious
    all:
      - id: micro-behaviors/network/share::go-smb-session-call
      - id: micro-behaviors/os/security/auth/password::go-default-password-auth-call
  - id: go-smb-default-credential-spray
    desc: SMB setup with repeated default authentication
    crit: hostile
    all:
      - id: micro-behaviors/network/share::go-smb-session-call
      - id: micro-behaviors/os/security/auth/password::go-default-password-auth-call
      - id: go-smb-default-authentication-loop
