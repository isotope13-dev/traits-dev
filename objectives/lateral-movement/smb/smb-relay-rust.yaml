defaults:
  platforms: [unix, windows]
  for: [rust]

traits:
  - id: rust-smb-relay-victim-type1
    desc: Rust receives NTLM Type 1
    crit: notable
    conf: 0.98
    if:
      type: symbol
      kind: function
      exact: recv_type1

  - id: rust-smb-relay-victim-type3
    desc: Rust receives NTLM Type 3
    crit: notable
    conf: 0.98
    if:
      type: symbol
      kind: function
      exact: recv_type3

  - id: rust-smb-relay-target-challenge
    desc: Rust relays an NTLM target challenge
    crit: notable
    conf: 0.98
    if:
      type: symbol
      kind: function
      exact: send_challenge

composite_rules:
  - id: rust-smb-ntlm-relay
    desc: Rust SMB server relays victim NTLM authentication
    crit: hostile
    conf: 0.99
    all:
      - id: rust-smb-relay-victim-type1
      - id: rust-smb-relay-victim-type3
      - id: rust-smb-relay-target-challenge
