defaults:
  platforms: [unix, windows]
  for: [rust]

traits:
  - id: rust-smb-relay-victim-type1
    desc: Rust receives victim NTLM Type 1
    crit: notable
    conf: 0.98
    if:
      type: text
      regex: 'pub async fn recv_type1(?s:.){0,1000}find_ntlm'

  - id: rust-smb-relay-victim-type3
    desc: Rust rejects relayed NTLM Type 3
    crit: notable
    conf: 0.98
    if:
      type: text
      regex: 'pub async fn recv_type3(?s:.){0,500}STATUS_ACCESS_DENIED(?s:.){0,500}find_ntlm'

  - id: rust-smb-relay-target-challenge
    desc: Rust forwards target NTLM challenge
    crit: notable
    conf: 0.98
    if:
      type: text
      regex: 'pub async fn send_challenge(?s:.){0,400}challenge_resp'

composite_rules:
  - id: rust-smb-ntlm-relay
    desc: Rust relays victim NTLM via SMB
    crit: notable
    conf: 0.99
    all:
      - id: rust-smb-relay-victim-type1
      - id: rust-smb-relay-victim-type3
      - id: rust-smb-relay-target-challenge
