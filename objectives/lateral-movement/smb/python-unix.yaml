defaults:
  platforms: [unix]
  for: [python, pyc]
  attack: T1021.002

traits:
  - id: python-nmap-smb-scan
    desc: Python nmap SMB scan
    crit: suspicious
    conf: 0.94
    unless:
      - id: well-known/app/system/anthropic-cybersecurity-skills::defensive-cybersecurity-skills-repository
    if:
      type: text
      substr: '"nmap", "-p", "445"'

  - id: python-smb-payload-put
    desc: Python SMB payload put
    crit: suspicious
    conf: 0.94
    if:
      type: text
      regex: 'put \{payload_path\} \{remote_name\}'

composite_rules:
  - id: python-smbclient-null-session
    desc: Python anonymous SMB access with payload delivery
    crit: suspicious
    conf: 0.96
    all:
      - id: micro-behaviors/os/network/share::python-smbclient-no-password
      - id: python-smb-payload-put
    near_lines: 30

  - id: python-smb-lateral-payload
    desc: Python SMB lateral payload
    crit: hostile
    conf: 0.98
    all:
      - id: python-smbclient-null-session
      - id: python-nmap-smb-scan
    any:
      - id: python-smb-payload-put
