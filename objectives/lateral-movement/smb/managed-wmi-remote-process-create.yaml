# Managed remote WMI execution (SharpWMI, Apollo wmiexecute and similar): a
# ManagementScope opened with ConnectionOptions credentials, then
# Win32_Process.Create invoked through it to start a command on that host.
# Remote-administration consoles do the same, so the capability alone stays
# suspicious; scripted variants with a remote moniker live in execution/wmi.
defaults:
  platforms: [windows]
  for: [pe, dll]
  attack: T1047,T1021
  mbc: E1080

composite_rules:
  - id: managed-remote-wmi-process-create
    desc: Creates processes through credentialed remote WMI scope
    crit: suspicious
    conf: 0.88
    all:
      - id: micro-behaviors/os/wmi/manipulate::managed-wmi-process-method-api-profile
      - id: micro-behaviors/os/wmi/remote::managed-wmi-connection-options
      - id: micro-behaviors/os/wmi/remote::managed-wmi-management-scope
