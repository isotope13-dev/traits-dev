defaults:
  platforms: [unix, windows]
  for: [scripts]

traits:
  - id: ntlm-relay-operation
    desc: NTLM relay command or option
    crit: suspicious
    conf: 0.96
    if:
      type: text
      # Require command-like whitespace or end-of-command syntax after the
      # marker.  A dictionary key such as "ntlmrelay": "activedirectory"
      # is a vocabulary entry, not an NTLM relay operation.
      regex: '(?im)\b(ntlm[-_]?relayx?|relay[-_]?ntlm|forward[-_]?ntlm)(\s+[-A-Za-z0-9_/]|$)'

  - id: ntlm-relay-smb-target
    desc: References an SMB endpoint
    crit: notable
    conf: 0.97
    if:
      type: text
      regex: '(?i)smb://'

  - id: ntlm-relay-ldap-target
    desc: References an LDAP endpoint
    crit: notable
    conf: 0.97
    if:
      type: text
      regex: '(?i)ldap://'

  - id: ntlm-machine-account-abuse
    desc: Uses a machine account in relay chain
    crit: suspicious
    conf: 0.94
    if:
      type: text
      regex: '(?i)\b(machine[-_ ]account|computer[-_ ]account)\b'

  - id: rbcd-delegation-change
    desc: Changes resource-based delegation
    crit: suspicious
    conf: 0.96
    if:
      type: text
      regex: '(?i)\b(add|set|write|modify)[^A-Za-z0-9]{0,4}rbcd'

  - id: shadow-credential-change
    desc: Changes shadow credentials
    crit: suspicious
    conf: 0.96
    if:
      type: text
      regex: '(?i)(shadow[-_ ]credentials?|msDS-KeyCredentialLink)'

composite_rules:
  - id: http-ntlm-relay-to-smb
    desc: HTTP NTLM authentication is relayed to SMB
    crit: hostile
    conf: 0.99
    attack: T1187
    all:
      - id: micro-behaviors/communications/http/auth::http-ntlm-auth-header
      - id: ntlm-relay-operation
      - id: ntlm-relay-smb-target

  - id: http-ntlm-relay-to-ldap
    desc: HTTP NTLM authentication is relayed to LDAP
    crit: hostile
    conf: 0.99
    attack: T1187
    all:
      - id: micro-behaviors/communications/http/auth::http-ntlm-auth-header
      - id: ntlm-relay-operation
      - id: ntlm-relay-ldap-target

  - id: ntlm-relay-account-escalation
    desc: NTLM relay is followed by machine-account delegation or shadow-credential abuse
    crit: hostile
    conf: 0.99
    attack: "T1187, T1098.002"
    all:
      - id: ntlm-relay-operation
      - id: ntlm-machine-account-abuse
    any:
      - id: rbcd-delegation-change
      - id: shadow-credential-change
