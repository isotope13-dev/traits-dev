defaults:
  platforms: [unix, windows]
  for: [scripts]

traits:
  - id: ntlm-relay-operation
    desc: NTLM relay command or forwarding reference
    crit: suspicious
    conf: 0.96
    unless:
    - id: metadata/lang/source/shape::javascript-literal-tables-pure-helpers
    - id: well-known/app/system/anthropic-cybersecurity-skills::defensive-cybersecurity-skills-repository
    - id: well-known/tool/offensive/impacket::source-tree-member
    - id: well-known/tool/detection/openhound::openhound-collector-context
    - id: well-known/app/security/raes/
    - id: metadata/file/profile/markup::assessment-playbook-examples
    - id: micro-behaviors/metaprogramming/generation::configured-assessment-plugin
    if:
      type: text
      regex: (?im)\b(ntlmrelayx(\.py)?\s+--?[A-Za-z]|ntlm[-_]?relay\s+--?[A-Za-z]|forward[-_]?ntlm)\b
  - id: ntlm-machine-account-near-relay
    desc: Machine account near NTLM relay marker
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)\b(machine|computer)[-_ ]account\b.{0,200}\bntlm[-_ ]?relay'

  - id: ntlm-relay-near-machine-account
    desc: NTLM relay marker near machine account
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)\bntlm[-_ ]?relay.{0,200}\b(machine|computer)[-_ ]account\b'

composite_rules:
  - id: powershell-shadow-credential-change
    for: [powershell]
    desc: PowerShell changes shadow credentials
    crit: suspicious
    conf: 0.98
    all:
      - id: micro-behaviors/os/security/directory-service::key-credential-link-attribute
      - id: micro-behaviors/os/security/directory-service::powershell-ad-object-write-call
      - id: micro-behaviors/os/security/directory-service::powershell-ad-property-write-option
    near_lines: 8

  - id: directory-entry-shadow-credential-change
    for: [scripts, '!applescript', '!jcl', '!shell']
    desc: DirectoryEntry changes shadow credentials
    crit: suspicious
    conf: 0.97
    all:
      - id: micro-behaviors/os/security/directory-service::key-credential-link-attribute
      - id: micro-behaviors/os/security/directory-service::directory-entry-property-put-call
    near_lines: 4

  - id: shadow-credential-change
    desc: Changes shadow credentials
    crit: suspicious
    conf: 0.97
    any:
      - id: powershell-shadow-credential-change
      - id: directory-entry-shadow-credential-change

  - id: http-ntlm-relay-to-smb
    desc: HTTP NTLM authentication is relayed to SMB
    crit: hostile
    conf: 0.99
    attack: T1187
    all:
      - id: micro-behaviors/communications/http/auth::http-ntlm-auth-header
      - id: ntlm-relay-operation
      - id: micro-behaviors/communications/url/scheme::smb-url-scheme
    # Preserve the existing publisher-notice exclusion. It records a copyright
    # claim, not authenticated upstream identity or integrity.
    unless:
      - id: metadata/vendor/copyright::secureauth-fortra-copyright-notice

  - id: http-ntlm-relay-to-ldap
    desc: HTTP NTLM authentication is relayed to LDAP
    crit: hostile
    conf: 0.99
    attack: T1187
    all:
      - id: micro-behaviors/communications/http/auth::http-ntlm-auth-header
      - id: ntlm-relay-operation
      - id: micro-behaviors/communications/url/scheme::ldap-url-scheme

  - id: ntlm-machine-account-abuse
    desc: NTLM relay targets machine account
    crit: suspicious
    conf: 0.94
    all:
      - id: ntlm-relay-operation
    any:
      - id: ntlm-machine-account-near-relay
      - id: ntlm-relay-near-machine-account
    needs: 1

    unless:
      - id: metadata/lang/source/shape::javascript-literal-tables-pure-helpers
  - id: ntlm-relay-account-escalation
    desc: NTLM relay is followed by machine-account delegation or shadow-credential abuse
    crit: hostile
    conf: 0.99
    attack: "T1187, T1098.002"
    all:
      - id: ntlm-relay-operation
      - id: ntlm-machine-account-abuse
    any:
      - id: micro-behaviors/os/security/directory-service::rbcd-modification-reference
      - id: shadow-credential-change
    unless:
      - id: metadata/lang/source/shape::javascript-literal-tables-pure-helpers
