# Impacket's SMB utilities are common operator tooling.  Require the paired
# remote-execution and SMB-client operations before escalating to hostile.
defaults:
  platforms: [unix, windows]
  for: [scripts, binaries]
  attack: T1021.002

traits:
  - id: impacket-psexec-command
    desc: Impacket psexec remote execution
    crit: notable
    conf: 0.96
    if:
      type: text
      regex: '(?i)\bpsexec\.py\b'

  - id: impacket-smbclient-command
    desc: Impacket smbclient SMB utility invocation
    crit: notable
    conf: 0.96
    if:
      type: text
      regex: '(?i)\bsmbclient\.py\b'

  # Both traits detect a *reference* to an administrative share path, not an
  # operation against one. Windows admin shares are routine in backup,
  # deployment and file-path code, and the path form shows up verbatim in
  # documentation (vscode-uri's JSDoc documents
  # `URI.parse('file://server/c$/folder/file.txt')` and its `\\server\c$`
  # fsPath). Notable is the honest level for a path reference; the hostile
  # composite below supplies the lateral-movement intent.
  - id: smb-administrative-share-target
    desc: Slash-form SMB administrative share path
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: '(?i)//[A-Za-z0-9_.-]+/(ADMIN\$|C\$|IPC\$)'

  - id: smb-windows-administrative-share
    desc: UNC-form SMB administrative share path
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: '(?i)\\+[A-Za-z0-9_.-]+\\+(ADMIN\$|C\$|IPC\$)'

composite_rules:
  - id: impacket-smb-lateral-operations
    desc: Impacket SMB remote execution and administrative-share access
    crit: hostile
    conf: 0.99
    all:
      - id: impacket-psexec-command
      - id: impacket-smbclient-command
    any:
      - id: smb-administrative-share-target
      - id: smb-windows-administrative-share
    near_lines: 12
    unless:
      - id: well-known/tool/offensive/impacket::source-tree-member
