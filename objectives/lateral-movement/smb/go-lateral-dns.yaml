defaults:
  platforms: [windows]
  for: [go, pe]

composite_rules:
  - id: go-lateral-and-dns-references
    desc: Go lateral function names and DNS references
    crit: notable
    conf: 0.97
    for: [pe]
    all:
      - id: micro-behaviors/process/create/subprocess/reference::go-lateral-delivery-function-name-text
    any:
      - id: objectives/command-and-control/channel/dns::go-dns-c2-functions-pe
      - id: micro-behaviors/communications/dns/txt::go-dns-txt-mx-lookup
