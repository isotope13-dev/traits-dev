defaults:
  platforms: [windows]
  for: [powershell, batch]
  attack: T1047
composite_rules:
  - id: powershell-wmi-remote-process-spawn
    desc: WMI process and ComputerName clues
    crit: notable
    conf: 0.97
    any:
      - id: micro-behaviors/process/create/wmi::create-process-wmi-cmdlet
      - id: micro-behaviors/process/create/wmi::create-process-cim-cmdlet
    all:
      - id: metadata/lang/source/syntax/argument::computername-argument
    near_lines: 1
