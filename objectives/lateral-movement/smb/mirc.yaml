# An mIRC script that creates the C$ share with rmtshare and then maps it
# with `net use /user:` is spreading over SMB, not administering a server.
# Each command is a normal admin tool; together, inside a chat script, they
# are the classic IRC-worm "root" step.
defaults:
  platforms: [windows]
  for: [mirc]
  attack: T1021.002
composite_rules:
  - id: mirc-admin-share-with-credentials
    desc: mIRC maps C$ using supplied credentials
    crit: hostile
    conf: 0.96
    all:
      - id: micro-behaviors/os/network/share::net-use-explicit-user
      - id: micro-behaviors/os/network/share::admin-share-c-dollar
      - id: micro-behaviors/os/network/share::rmtshare-create-share
