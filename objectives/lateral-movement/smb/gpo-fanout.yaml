defaults:
  platforms:
  - windows
  for:
  - powershell
composite_rules:
- attack: T1484.001,T1021.002,T1569.002
  id: defender-suppressed-sysvol-remote-execution
  desc: SYSVOL copy, domain enumeration and PsExec with Defender suppression
  crit: hostile
  conf: 0.97
  all:
  - id: objectives/evasion/anti-av/registry::gpo-disable-defender-policy
  - id: micro-behaviors/os/security/policy::new-gplink-cmdlet
  - id: micro-behaviors/fs/file/copy/source-destination::sysvol-script-file-transfer
  - id: micro-behaviors/os/security/policy::gpupdate-force
  - id: micro-behaviors/os/security/directory-service::get-adcomputer-all-filter
  - id: micro-behaviors/process/create/launch::psexec-remote-invocation
- attack: T1484.001,T1053.005,T1562.001
  id: defender-suppressed-gpo-task-xml-write
  desc: Task XML write beside SYSVOL copy and Defender-off GPO
  crit: hostile
  conf: 0.98
  all:
  - id: micro-behaviors/os/security/gpo::linked-gpo-scheduled-task-path-context
  - id: micro-behaviors/fs/file/copy/source-destination::sysvol-script-file-transfer
  - id: objectives/evasion/anti-av/registry::gpo-disable-defender-policy
  - id: micro-behaviors/os/autorun/control::powershell-scheduledtasks-xml-write
  - id: micro-behaviors/os/security/policy::gpupdate-force
