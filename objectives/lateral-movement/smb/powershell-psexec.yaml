defaults:
  for:
  - powershell
  platforms:
  - windows
  crit: notable
  conf: 0.98
traits:
- id: remote-scm-computer-handle
  desc: Opens a remote service-control manager
  if:
    type: text
    substr: $OpenSCManagerA.Invoke("\\$ComputerName", "ServicesActive"
composite_rules:
- id: powershell-remote-service-command-execution
  desc: Runs a command service on a remote computer
  crit: hostile
  all:
  - id: remote-scm-computer-handle
  - id: micro-behaviors/os/service/create::powershell-create-service-delegate-call
  - id: well-known/tool/offensive/powershell-empire::lateral-module-functions
