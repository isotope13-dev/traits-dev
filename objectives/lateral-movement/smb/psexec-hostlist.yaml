# Sysinternals PsExec driven with an @<file> host list runs the same command
# on every host named in that file — the fan-out remote-execution step
# post-compromise crews run against freshly scanned subnets (Storm-2570 pushes
# payloads across @ip.txt). The @file argument is PsExec's own documented
# multi-target syntax, distinct from the impacket psexec.py already covered in
# this directory; pairing it with SYSTEM/copy execution flags is the mass
# remote-exec no interactive admin session produces.
defaults:
  platforms: [windows]
  for: [batch, powershell, scripts]
  attack: T1021.002,T1570
  mbc: E1570

traits:
  - id: psexec-host-list-argument
    desc: PsExec run against an @file host list
    crit: suspicious
    conf: 0.92
    if:
      type: text
      regex: '(?i)\bpsexec(64)?(\.exe)?\b[^\r\n]{0,120}\s@\S{1,64}'

composite_rules:
  - id: psexec-host-list-mass-exec
    desc: PsExec mass-executes across a host list
    crit: hostile
    conf: 0.97
    all:
      - id: psexec-host-list-argument
      - id: micro-behaviors/process/create/launch::psexec-system-copy-eula-options
    near_lines: 1
