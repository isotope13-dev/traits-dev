defaults:
  for:
  - powershell
  platforms:
  - windows
  crit: notable
  conf: 0.98
composite_rules:
- id: powershell-smbexec-service-command-execution
  desc: Raw SMB service-control command execution
  crit: hostile
  all:
  - id: micro-behaviors/os/service/create::scm-create-service-packet
  - id: micro-behaviors/os/security/auth/ntlm::ntlmssp-marker
  - id: metadata/lang/source/naming/function/system::lateral-module-functions
- id: powershell-ephemeral-smb-service
  desc: Raw SMB remote-service creation and deletion
  crit: hostile
  all:
  - id: micro-behaviors/os/service/create::scm-create-service-packet
  - id: micro-behaviors/os/service/delete::scm-delete-service-packet
  - id: metadata/lang/source/naming/function/system::lateral-module-functions
