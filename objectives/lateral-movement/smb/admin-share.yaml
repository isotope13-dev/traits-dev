defaults:
  platforms:
  - windows
  attack: T1021.002
  mbc: B0030
composite_rules:
- for:
  - pe
  - dll
  - batch
  - powershell
  id: psexec-cross-host-temp-execution
  desc: PsExec remote invocation beside Windows Temp executable path
  crit: suspicious
  conf: 0.97
  all:
  - id: micro-behaviors/process/create/launch::psexec-remote-invocation
  - id: micro-behaviors/fs/path/temp::windows-temp-executable-path
  near_lines: 1
- for:
  - binaries
  - scripts
  - source
  id: lateral-exec-method
  desc: Remote task, service or staged execution
  crit: suspicious
  conf: 0.92
  any:
  - id: objectives/lateral-movement/delivery/admin-share::schtasks-cross-host
  - id: objectives/lateral-movement/delivery/admin-share::sc-exe-cross-host-create
  - id: objectives/execution/wmi::powershell-wmi-remote-process-spawn
  - id: objectives/lateral-movement/delivery/wmi::quiet-remote-shell-execution
  - id: psexec-cross-host-temp-execution
  unless:
  - id: well-known/app/infrastructure/ansible::ansible-powershell-provenance
  - id: metadata/file/naming::test-directory-component
- for:
  - binaries
  - scripts
  - source
  id: admin-share-copy-with-remote-execution
  desc: Admin-share executable path, copy and remote execution co-occur
  crit: suspicious
  conf: 0.97
  any:
  - id: micro-behaviors/fs/path/reference::admin-share-programdata-path
  - id: micro-behaviors/network/share::admin-share-c-windows-temp-executable
  - id: objectives/lateral-movement/delivery/admin-share::admin-share-admin-temp-executable
  all:
  - id: lateral-exec-method
  - id: micro-behaviors/fs/file/copy
