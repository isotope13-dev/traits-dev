defaults:
  platforms: [openbsd, bsd, unix]
  for: [go, elf]
  attack: T1021.002

traits:
  - id: go-smb-drops-beacon-exe
    desc: Go SMB drops beacon exe
    crit: suspicious
    conf: 0.95
    if:
      type: text
      # Path/quoted drop name — keeps CS bare `beacon.exe` family ID orthogonal
      # and avoids metric tokens like "beacon.executed_blocks".
      regex: '(?i)([\\/]|["''])beacon\.exe\b'
    unless:
      - id: well-known/tool/offensive/raxuiscli::source-tree-path

composite_rules:
  - id: go-smb-share-beacon-drop
    desc: Go SMB share beacon drop
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/communications/socket/dial::go-smb2-dialer
      - id: micro-behaviors/network/share::go-session-list-shares
      - id: go-smb-drops-beacon-exe
