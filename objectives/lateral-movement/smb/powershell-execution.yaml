defaults:
  for:
  - powershell
  platforms:
  - windows
  crit: notable
  conf: 0.98
traits:
  - id: smb-relay-challenge-function
    desc: SMB NTLM relay challenge or response function
    crit: suspicious
    conf: 0.97
    if:
      type: text
      regex: '(?im)^\s*function\s+SMBRelay(Challenge|Response)\b'
composite_rules:
  - id: powershell-inveigh-smb-relay-service
    desc: Relays captured SMB authentication into a new service
    crit: hostile
    conf: 0.99
    attack: T1021.002
    all:
      - id: smb-relay-challenge-function
      - id: micro-behaviors/os/service/create::scm-create-service-packet
      - id: micro-behaviors/os/security/auth/ntlm::ntlmssp-marker

  - id: powershell-smb-authentication-relay-execution
    desc: Relays SMB authentication for service execution
    crit: hostile
    unless:
      - id: objectives/privilege-escalation/exploit/network-service::smb-relay-loopback-target
    all:
      - id: micro-behaviors/data/codec::powershell-utf16-hex-command-serialization
      - id: well-known/tool/offensive/powershell-empire::tater-inveigh-smb-relay-execute-function
      - id: micro-behaviors/os/security/auth/ntlm::ntlmssp-marker
