defaults:
  for: [perl]
  platforms: [unix]
traits:
- id: spoofed-from-input
  desc: Email From header set from user input
  crit: suspicious
  conf: 0.88
  attack: T1566.001
  if:
    type: text
    regex: 'From:.{0,120}\$input'
- id: spoofed-reply-to-input
  desc: Reply-To header set from user input
  crit: suspicious
  conf: 0.88
  attack: T1566.001
  if:
    type: text
    regex: 'Reply-To:.{0,120}\$input'
- id: shell-piped-sendmail
  desc: Pipes a file into sendmail
  crit: notable
  conf: 0.9
  for: [shell]
  if:
    type: text
    regex: 'cat\s+\$[0-9]\s*\|\s*sendmail\s+\$[0-9]'
- id: shell-counted-sendmail-loop
  desc: Counted loop resends the same mail
  crit: notable
  conf: 0.88
  for: [shell]
  if:
    type: text
    regex: 'while\s+\[\s*"\$[A-Za-z0-9]+"\s+-lt\s+\$[A-Za-z0-9]+'
composite_rules:
- id: shell-sendmail-mailbomb
  desc: Shell mailbomb loops sendmail
  crit: hostile
  conf: 0.96
  for: [shell]
  attack: T1498.002
  near_lines: 15
  all:
  - id: shell-piped-sendmail
  - id: shell-counted-sendmail-loop
- id: perl-anonymous-mailer
  desc: Perl CGI anonymous email sending tool
  crit: hostile
  conf: 0.95
  attack: T1566.001
  all:
  - id: micro-behaviors/communications/email/send/pipe::sendmail-pipe
  - id: micro-behaviors/communications/http/request/cgi::request-method-env
  any:
  - id: spoofed-from-input
  - id: spoofed-reply-to-input
  - id: micro-behaviors/communications/email/send/pipe::x-mailer-header
- id: sendmail-web-tool
  desc: Web-accessible sendmail email tool
  crit: suspicious
  conf: 0.9
  all:
  - id: micro-behaviors/communications/email/send/pipe::sendmail-pipe
  - id: micro-behaviors/communications/http/request/cgi::content-type-response
  any:
  - id: micro-behaviors/communications/http/request/cgi::html-form-output
  - id: micro-behaviors/communications/http/request/cgi::request-method-env
