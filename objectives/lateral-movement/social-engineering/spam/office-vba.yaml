defaults:
  platforms: [windows]
  for: [oledoc]
  attack: T1566.002

traits:
  # OleDoc strings=0; hex matches ASCII "whatsapp" in CFBF bytes.
  - id: vba-whatsapp-target
    desc: VBA targets WhatsApp automation
    crit: component
    conf: 0.95
    if:
      type: hex
      pattern: "77 68 61 74 73 61 70 70"

composite_rules:
  - id: vba-whatsapp-keystroke-automation
    desc: VBA automates repeated WhatsApp messaging
    crit: suspicious
    conf: 0.96
    all:
      - id: vba-whatsapp-target
      - id: micro-behaviors/hardware/input/keyboard/simulate::vba-sendkeys
      - id: micro-behaviors/ui/window/manage/activation::vba-appactivate
    near_bytes: 8192
  - id: encrypted-vba-whatsapp-automation
    desc: Encrypted VBA document automates WhatsApp messages
    crit: suspicious
    conf: 0.95
    all:
      - id: vba-whatsapp-keystroke-automation
      - id: metadata/document/ole::ole-encryption-feature
