# Browser extensions that inject a messaging-web-app automation runtime
# (WPPConnect/wa-js for WhatsApp Web, and its equivalents) into the live
# session and drive the victim's own account: enumerate every contact, then
# send to them programmatically.
#
# This is the engine behind WhatsApp bulk-marketing and "CRM" extensions. The
# messages originate from a real, trusted account, which is exactly why the
# technique is valuable for spam and social-engineering delivery and why the
# platform's own terms forbid it. It stops at suspicious rather than hostile
# because the operator is usually the account owner — but an extension that
# owns the send path of a logged-in messenger is a capability an analyst must
# see, and the same injection serves an attacker who ships it as something
# else.
#
# Keyed on the combination of messaging-site authority, contact enumeration,
# and programmatic send. Any one leg alone is an ordinary integration; a
# helper that only formats outgoing text, or a page that only reads its own
# chat list, does not match.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, crx, xpi, zip]
  attack: T1566
  mbc: B0020

composite_rules:
  - id: extension-injects-messaging-account-automation
    desc: Extension enumerates contacts and automates messaging
    crit: suspicious
    conf: 0.92
    scope: archive
    all:
      - id: metadata/permission/host::content-script-matches-im-web-app
      - id: micro-behaviors/communications/messaging/list::wppconnect-contact-list
    any:
      - id: micro-behaviors/communications/messaging/send

  # The same send path, driven from off-machine.
  #
  # `externally_connectable` lets named web origins call the extension's message
  # API directly. Combined with an external-message listener and the WhatsApp
  # automation runtime, the vendor's own site — not the person at the keyboard
  # — issues the sends, from an account the platform trusts because it really
  # is the user's. That is a materially different capability from a local bulk
  # sender: the campaign list, the timing and the copy all live on a server,
  # and none of it is in the reviewed bundle.
  #
  # Kept at suspicious for the same reason as the composite above — the account
  # owner did install the CRM — but recorded separately because "a remote site
  # can send as you" is the fact an analyst needs, and it survives any rebrand.
  - id: remote-site-drives-messaging-automation
    desc: Remote site drives the messaging send path
    crit: suspicious
    conf: 0.94
    scope: archive
    all:
      - id: metadata/permission/manifest::externally-connectable
      - id: micro-behaviors/communications/ipc/message::chrome-runtime-on-message-external
      - id: metadata/permission/host::content-script-matches-im-web-app
    any:
      - id: micro-behaviors/communications/messaging/send

  # Read every page, then send as the user.
  #
  # An `<all_urls>` content script plus all-HTTP host permission is total
  # read access to the victim's browsing; the WhatsApp automation runtime is an
  # authenticated send path out of it. An extension holding both can turn
  # anything it finds while you browse into messages from your own account,
  # which is what "scrape group links anywhere, then auto-join and bulk send"
  # means in manifest terms. Either half alone is ordinary — page tools read
  # pages, CRM tools send messages — so the pairing is the signal.
  - id: all-sites-harvest-with-messaging-automation
    desc: All-sites reader drives a messaging send path
    crit: suspicious
    conf: 0.94
    scope: archive
    all:
      - id: metadata/permission/host::content-script-all-urls
      - id: metadata/permission/host::host-permission-all-http
      - id: micro-behaviors/communications/messaging/list::wppconnect-contact-list
    any:
      - id: micro-behaviors/communications/messaging/send
