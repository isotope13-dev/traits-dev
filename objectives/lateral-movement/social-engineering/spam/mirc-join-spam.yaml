# A headless mIRC socket client that answers every JOIN or PART it sees
# with a PRIVMSG to that user is an advertising spambot: greeter scripts
# run inside the user's own session (`on *:JOIN:#chan`) and greet one
# channel, while this pattern parses raw server lines on a second hidden
# connection and messages anyone who moves.
defaults:
  platforms: [unix, windows]
  for: [mirc, ircii, scripts, data]
traits:
  - id: mirc-sockwrite-privmsg-on-join
    desc: mIRC socket messages users who join
    crit: suspicious
    conf: 0.9
    if:
      type: text
      case_insensitive: true
      # `if (... == JOIN) { sockwrite ... PRIVMSG <parsed nick>`: the JOIN
      # branch of a raw sockread handler writes a message back at once.
      regex: '==\s*(JOIN|PART)\)\s*\{\s*sockwrite\b[^\r\n}]{0,30}\bPRIVMSG\b'
  - id: mirc-numbered-chan-setter
    desc: Remote text sets several autojoin channels
    crit: suspicious
    conf: 0.9
    count_min: 4
    if:
      type: text
      # `on 10:TEXT:!chan1*:` / `!chan!0*:` — a panel of numbered channel
      # setters. One `!chan` alias is ordinary; a run of them is a joiner.
      regex: '(?i)on\s+[0-9]+:text:!chan[0-9!]'
composite_rules:
  - id: mirc-socket-join-spammer
    desc: Socket bot spams users on JOIN
    crit: hostile
    conf: 0.93
    all:
      - id: objectives/command-and-control/channel/irc/client::mirc-socket-ping-client
      - id: mirc-sockwrite-privmsg-on-join
  - id: mirc-remote-autojoin-panel
    desc: Remote commands set and join many channels
    crit: hostile
    conf: 0.94
    for: [mirc, ircii]
    all:
      - id: mirc-numbered-chan-setter
      - id: objectives/command-and-control/channel/irc/client::mirc-join-parameter
      - id: objectives/command-and-control/channel/irc/client::mirc-script-event-text
