# Skype4COM contact-list spam. The `.a` coverage is deliberate: malware sets
# arbitrary source extensions, and cleave classifies a plain-text `.a` entry as
# a static library from its suffix even when the bytes are VBScript.
defaults:
  platforms: [windows]
  for: [vbs, static-lib]
  attack: T1534
  mbc: B0020

composite_rules:
  - id: skype4com-contact-list-spam
    desc: Skype4COM spams the entire friend list
    crit: hostile
    conf: 0.99
    all:
      - id: micro-behaviors/communications/messaging/channel::skype4com-automation-object
      - id: micro-behaviors/communications/messaging/list::skype4com-friends-enumeration
      - id: micro-behaviors/communications/messaging/send::skype4com-send-message

  - id: skype-client-contact-list-spam
    desc: Started Skype client spams every friend
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/process/create/launch::skype4com-client-start
      - id: micro-behaviors/communications/messaging/list::skype4com-friends-enumeration
      - id: micro-behaviors/communications/messaging/send::skype4com-send-message
