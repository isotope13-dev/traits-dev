defaults:
  platforms: [windows, unix]
  for: [rtf]
  crit: suspicious
  conf: 0.95
  attack: T1566.001

composite_rules:
  - id: unclaimed-prize-personal-data-solicitation
    desc: Unclaimed prize letter requests a personal-data claim form
    all:
      - id: metadata/lang/natural/vocabulary/finance::unclaimed-prize-wording
      - id: metadata/lang/natural/vocabulary/finance::prize-claim-form-heading
      - id: micro-behaviors/ui/window/personal-data-field::personal-data-questionnaire

  - id: unclaimed-lottery-lawyer-referral
    desc: Unclaimed lottery money lure routes recipient to a lawyer
    all:
      - id: metadata/lang/natural/vocabulary/finance::unclaimed-prize-wording
      - id: metadata/lang/natural/vocabulary/finance::lottery-word
      - id: metadata/lang/natural/phrasing/contact::lawyer-contact-referral
