# Fraud operators distribute batches of payment URLs and may cash out through
# transferable email gift cards. These composites use URL structure only;
# they do not depend on prose, language, merchant names, campaign domains, or
# fixed transaction values.
defaults:
  platforms: [windows, unix]
  for: [html, scripts, source, data]
  crit: suspicious
  conf: 0.9
  attack: T1657
composite_rules:
  - id: mixed-payment-link-batch
    desc: Bulk pay-by-link and invoice URLs coexist
    all:
      - id: micro-behaviors/communications/url/reference::repeated-pay-by-link-urls
      - id: micro-behaviors/communications/url/reference::multiple-invoice-payment-urls
    near_bytes: 8192

  - id: payment-link-batch-with-gift-card-cashout
    desc: Bulk payment links accompany email gift-card checkout
    all:
      - id: micro-behaviors/communications/url/reference::repeated-pay-by-link-urls
      - id: micro-behaviors/communications/url/reference::email-delivery-gift-card-url
    near_bytes: 8192
