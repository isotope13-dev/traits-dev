# "Hack any account online, free" service pages. No site can return a third
# party's password, so the offer itself is the deception: the visitor is
# asked to submit a victim's profile URL and walked toward a paid
# verification/offer-wall payoff, while the page fabricates the proof of
# service. Each atom below is ordinary security-writing copy alone; the
# service claim next to the third-party targeting instruction is the scam.
defaults:
  platforms: [windows, unix]
  for: [html]
  crit: notable
  conf: 0.9

traits:
  - id: victim-profile-url-instruction
    desc: Instructs entering a victim's profile URL
    conf: 0.9
    if:
      type: text
      exclude_html_comments: true
      regex: '(?i)\b(victim|target)s?\b[^<>]{0,60}\b(profile|account)\b[^<>]{0,40}\b(url|link|address)\b'

  - id: account-hack-claim
    desc: Claims to hack an account or password
    conf: 0.9
    if:
      type: text
      exclude_html_comments: true
      regex: '(?i)hack(ing)?\s+(any\s+|a\s+|an\s+|the\s+)?[a-z]{2,20}\s+(account|password)\b'

  # The gallery is the fabricated proof: entries claiming an account was
  # "hacked 7 minutes ago". One such phrase can report a real breach; a
  # repeated, counting feed is manufactured activity.
  - id: fabricated-hack-activity-feed
    desc: Repeated hacked-N-ago activity claims
    conf: 0.88
    count_min: 2
    if:
      type: text
      exclude_html_comments: true
      regex: '(?i)hacked\s+\d{1,3}\s+[a-z]+\s+ago'

  - id: hacked-password-success-rate-claim
    desc: Success-rate promise for password hacking
    conf: 0.88
    if:
      type: text
      exclude_html_comments: true
      regex: '(?i)success\s+rate\b[^<>]{0,80}\b(password|hack)\b'

composite_rules:
  # The conviction is the offered service: a page that both claims to hack
  # accounts and instructs the visitor to submit a victim's profile URL is
  # selling unauthorized access that cannot exist. A fabrication leg (fake
  # live feed or success-rate promise) must corroborate, so security-writing
  # copy that merely discusses account compromise stays silent.
  - id: account-hacker-service-scam
    desc: Fake online account-hacking service page
    crit: hostile
    conf: 0.95
    all:
      - id: victim-profile-url-instruction
      - id: account-hack-claim
    any:
      - id: fabricated-hack-activity-feed
      - id: hacked-password-success-rate-claim
