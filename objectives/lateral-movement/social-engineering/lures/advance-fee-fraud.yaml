# Advance-fee fraud delivered as a document attachment.
#
# The letter carries no code: the payload is the reply. It tells the reader
# they are owed money -- a lottery win, a parcel holding a cash card, an
# estate with no heir -- and asks them to confirm who they are and where they
# live so it can be released. What follows is a fee.
#
# These are regenerated constantly and translated freely, so no single phrase
# survives. What does survive is the combination: an unearned payout, a
# reference number to quote back, and a request for the reader's details.
# Each atom below is ordinary on its own -- a real prize notification says
# `winner` too -- so nothing here means anything until two of them meet.
defaults:
  platforms: [windows, unix]
  for: [rtf, oledoc, ooxml, text, html]
  crit: component
  conf: 0.8
  attack: T1566.001

traits:
  - id: lottery-payout-notification
    crit: component
    desc: Names a lottery the reader has won
    if:
      # Spanish and German letters outnumber English ones; the noun is the
      # one word a translation cannot drop.
      type: text
      regex: '(?i)\b(lotter[iy]|loteria|lotto)\w{0,4}\b'

  - id: unclaimed-prize-money-claim
    crit: component
    desc: Offers unclaimed prize money
    if:
      type: text
      regex: '(?i)(unclaimed|beanspruchten) (prize|preisgeld)'

  - id: cash-card-delivery-claim
    crit: component
    desc: A cash card is waiting for delivery
    if:
      # `an ATM Master Card valued $7.5 Million USD`, `YOUR ATM VISA CARD IS
      # READY`. The card is the device that makes an untraceable payout
      # sound routine.
      type: text
      regex: '(?i)\bATM\b[ -]{0,3}\w{0,8}[ -]{0,3}\b(card|karte)\b'

  - id: courier-parcel-release-claim
    crit: component
    desc: A parcel is held awaiting details
    if:
      type: text
      regex: '(?i)\b(parcel|consignment|paket)\b[\s\S]{0,60}\b(deliver|courier)'

  - id: reconfirm-recipient-details-request
    crit: component
    desc: Asks the reader to reconfirm details
    if:
      # The reply is the point. `please reconfirm the below information, to
      # avoid delivery of your ATM Master Card to wrong hand`.
      type: text
      regex: '(?i)\bre-?confirm\b[\s\S]{0,40}\b(informa|detail|daten|angaben)'

  - id: claim-reference-number-quote
    desc: Supplies a reference number to quote
    if:
      # `Reference No: CTI/255125602/21`. A number the reader is asked to
      # repeat makes the exchange feel like an administrative process.
      type: text
      regex: '(?i)\bref(erence)?[ .:/-]+n(r|o|umber)\b'

  - id: claim-reference-number-german-quote
    crit: component
    desc: Supplies a German reference number to quote
    if:
      # `REFRENZ NR: CTI/255125602/21`, `Ticketnummer : REF79140J`.
      type: text
      regex: '(?i)\b(refe?renz[ .:/-]+nr|ticketnummer)\b'

  - id: unearned-profit-share-proposal
    crit: component
    desc: Proposes sharing unearned profits equally
    if:
      # Partnership-proposal 419s (`shared equally on equity between us`,
      # `netting ... as profits monthly`, `equity sharing ratio`). Equity
      # plans use the same words, so this means nothing alone.
      type: text
      regex: '(?i)equity sharing|shared equally|netting[^.<]{0,40}profits'

  - id: confidential-secrecy-plea
    crit: component
    desc: Asks to keep the deal confidential
    if:
      # `kept CONFIDENTIAL between the two of us`. Kits split the word
      # across tags (`CONFIDENTI</B>...AL`), so one gap is allowed.
      # Footers say this too, so this means nothing alone.
      type: text
      regex: '(?i)\bconfidenti\s?al\b'

  - id: fake-balance-claim-copy
    crit: component
    desc: Shows a payment-received account balance
    if:
      # `PAYMENT RECEIVED / ACCOUNT BALANCE: $5417.97`, but also the
      # sibling kit spelling (`TRANSFER RECEIVED / BONUS BALANS: $2466.12`).
      # Bank statements show balances too, so this means nothing alone.
      type: text
      regex: '(?i)(account|bonus) balan[cs]e?:\s*\$|(payment|transfer) received[\s\S]{0,120}balan[cs]e?'

  - id: claim-funds-cta-copy
    crit: component
    desc: Urges claiming funds through sign-up
    if:
      # `GET NOW / To Claim Funds, Please Sign-Up*`. Payout flows use
      # the same words, so this means nothing alone.
      type: text
      regex: '(?i)to claim funds|claim (your|these|the) (funds|balance|profits?)'

composite_rules:
  # English and German spellings of the same reference-number leg. Grouped so
  # one translated letter (or a gettext catalog pairing `reference number`
  # with `Referenz Nr.`) counts as one claim toward `needs: 2`, not two.
  - id: claim-reference-number
    desc: Supplies a reference number to quote
    crit: component
    conf: 0.8
    any:
      - id: claim-reference-number-quote
      - id: claim-reference-number-german-quote

  # Unearned payout, prize, parcel delivery or profit claim at the core of an
  # advance-fee fraud solicitation.
  - id: advance-fee-payout-lure
    desc: Advance-fee payout or unearned delivery lure
    crit: component
    conf: 0.8
    any:
      - id: lottery-payout-notification
      - id: unclaimed-prize-money-claim
      - id: cash-card-delivery-claim
      - id: courier-parcel-release-claim
      - id: unearned-profit-share-proposal
      - id: fake-balance-claim-copy

  # Administrative, secrecy, or claim-funds hook paired with an unearned payout lure.
  - id: advance-fee-corroboration-hook
    desc: Advance-fee administrative hook or claim call
    crit: component
    conf: 0.8
    any:
      - id: reconfirm-recipient-details-request
      - id: claim-reference-number
      - id: confidential-secrecy-plea
      - id: claim-funds-cta-copy
      - id: micro-behaviors/communications/email/address::consumer-webmail-address

  # Two of these in one document is a letter about money the reader has not
  # earned, addressed to whoever opens it. Requires both an unearned payout claim
  # and a corroborating reply or administrative hook.
  - id: advance-fee-fraud-letter
    desc: Advance-fee fraud solicitation
    crit: suspicious
    conf: 0.9
    # Content-blocker lists quote scam-page vocabulary as data to block. The
    # filter-list grammar establishes that these words are not a solicitation.
    unless:
      - id: metadata/file/format/markup::adblock-filter-list
      # Database dumps collapse distant records into a single SQL INSERT line.
      # A housing-lottery post and an unrelated user's webmail address are not
      # one solicitation merely because their records serialize adjacently.
      - id: metadata/file/format/database-dump::mysql-database-dump
      # A sorted password wordlist puts `loteria1` within 80 lines of
      # `hotmail1`; neither is a sentence addressed to anyone.
      - id: metadata/file/format/wordlist::one-token-per-line-list
      - id: metadata/file/format/wordlist::count-prefixed-token-list
      # Benchmark corpora and JSON lines serialize unrelated query/prompt
      # records line-by-line rather than forming a single solicitation.
      - id: metadata/package/testing/
      - id: "metadata/file/naming::test-directory-component"
      - id: metadata/file/extension/identity::jsonl-data-file
      - id: metadata/file/format/wordlist::search-ranking-csv-header
      # Detection-rule corpora quote fraud vocabulary as signature content.
      - id: well-known/tool/detection/emerging-threats::detection-ruleset
    # Scam claims and their reply route occur in one short letter. Requiring
    # locality prevents unrelated TLD names and contributor addresses in a
    # public-suffix database from combining across thousands of lines.
    near_lines: 80
    all:
      - id: advance-fee-payout-lure
      - id: advance-fee-corroboration-hook

  # Partnership-proposal 419s promise shared millions and route replies
  # through free webmail rather than the impersonated firm's domain. Either
  # leg alone is ordinary business mail, so the pairing stays suspicious.
  - id: profit-share-webmail-reply-lure
    desc: Profit-share lure via webmail reply
    crit: suspicious
    conf: 0.85
    near_lines: 80
    unless:
      - id: metadata/file/format/markup::adblock-filter-list
      - id: metadata/file/format/database-dump::mysql-database-dump
      - id: metadata/file/format/wordlist::one-token-per-line-list
      - id: metadata/file/format/wordlist::count-prefixed-token-list
      - id: metadata/package/testing/
      - id: "metadata/file/naming::test-directory-component"
      - id: metadata/file/extension/identity::jsonl-data-file
      - id: metadata/file/format/wordlist::search-ranking-csv-header
    all:
      - id: unearned-profit-share-proposal
      - id: micro-behaviors/communications/email/address::consumer-webmail-address

  # Fake-balance lures show a payment-received balance and push the reader
  # to claim it through sign-up. Statements show balances and payout flows
  # urge claims, so the pairing stays suspicious.
  - id: fake-balance-claim-lure
    desc: Fake balance with claim-funds call
    crit: suspicious
    conf: 0.85
    near_lines: 80
    unless:
      - id: metadata/file/format/markup::adblock-filter-list
      - id: metadata/file/format/database-dump::mysql-database-dump
      - id: metadata/file/format/wordlist::one-token-per-line-list
      - id: metadata/file/format/wordlist::count-prefixed-token-list
      - id: metadata/package/testing/
      - id: "metadata/file/naming::test-directory-component"
      - id: metadata/file/extension/identity::jsonl-data-file
      - id: metadata/file/format/wordlist::search-ranking-csv-header
    all:
      - id: fake-balance-claim-copy
      - id: claim-funds-cta-copy
