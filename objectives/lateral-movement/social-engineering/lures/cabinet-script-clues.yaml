defaults:
  platforms: [windows]
  for: [cab, pe]
  conf: 0.94

composite_rules:
  - id: cab-lure-script-variable-exe-clues
    desc: Cabinet lure script and variable EXE path
    scope: archive
    for: [cab, batch, pe]
    all:
      - id: metadata/file/format/structured::cab-container-format
      - id: metadata/archive/member/filename/lure::cab-lure-script-member-a
      - id: micro-behaviors/fs/path/application/executable::percent-variable-executable-name

    crit: suspicious
  - id: cab-numbered-po-script-clues
    desc: Cabinet and numbered purchase-order script
    scope: archive
    for: [cab, batch, pe]
    all:
      - id: metadata/archive/member/filename/shape::archive-po-numbered-script-member
      - id: metadata/archive/member/extension::cab-script-member-entry

    crit: suspicious
  - id: cab-enquiry-script-clues
    desc: Cabinet and enquiry-named script member
    scope: archive
    for: [cab, batch, pe]
    all:
      - id: metadata/archive/member/filename/shape::archive-enquiry-script-member
      - id: metadata/archive/member/extension::cab-script-member-entry

    crit: suspicious
  - id: cab-invoice-script-member-clues
    desc: Cabinet and invoice-themed script member
    scope: archive
    for: [cab, batch, pe]
    all:
      - id: metadata/archive/member/filename/lure::cab-lure-script-member-a
      - id: metadata/archive/member/extension::cab-script-member-entry

    crit: notable
  - id: cab-bank-script-clues
    desc: Cabinet and bank-named script member
    scope: archive
    for: [cab, batch, pe]
    all:
      - id: metadata/archive/member/filename/shape::archive-bank-script-member
      - id: metadata/archive/member/extension::cab-script-member-entry

    crit: suspicious
