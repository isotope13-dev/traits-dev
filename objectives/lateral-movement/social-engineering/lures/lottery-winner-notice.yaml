# Lottery / promotion "winner notification" letters.
#
# The letter announces a prize the reader never entered for, hands out a
# batch or winning number to quote back, and routes the reply to a "claims
# agent" who will release the funds once personal details (and later a fee)
# arrive. Brands, amounts, agents and reply addresses rotate every run; the
# administrative scaffolding of the claim does not. Each phrase below is
# ordinary copy for a genuine sweepstakes notice, so only the combination of
# an unsolicited win, quoted ticket numbers and an intermediary agent who
# releases the money is treated as the fraud.
defaults:
  platforms: [windows, unix]
  for: [rtf, text, pdf]
  crit: notable
  conf: 0.85
  attack: T1566.001

traits:
  - id: prize-money-win-announcement
    desc: Announces the reader won prize money
    if:
      type: text
      regex: '(?i)\b(have|has)\s+(won|been\s+awarded)\b[^.\n]{0,60}\b(prize|award|jackpot|lottery)'

  - id: winning-ticket-number-label
    desc: Quotes winning, batch or ticket numbers
    if:
      type: text
      regex: '(?i)\b(winning|ticket|batch)\s+(identification\s+)?(number|no)s?\s{0,3}[.:]'

  - id: prize-claim-agent-referral
    desc: Refers winner to a claims agent
    if:
      type: text
      regex: '(?i)\b(fiduciary|claims?|paying|remittance)\s+(agent|officer)\b'

  - id: winning-fund-release-promise
    desc: Promises release of the winning funds
    if:
      type: text
      regex: '(?i)\brelease\s+of\s+(your\s)?(winning|prize|lottery|award)s?\s+(funds?|money|sum|prize)'

composite_rules:
  - id: lottery-winner-claim-solicitation
    desc: Lottery win notice routes claim to agent
    crit: hostile
    conf: 0.93
    near_lines: 120
    all:
      - id: prize-money-win-announcement
      - id: winning-ticket-number-label
      - id: prize-claim-agent-referral
    any:
      - id: winning-fund-release-promise
      - id: micro-behaviors/communications/email/address::consumer-webmail-address
