defaults:
  platforms: [windows]
  for: [cab, pe]
  conf: 0.94

composite_rules:
  - id: cab-business-name-com-member-clues
    desc: Business-themed filename and cabinet COM member
    scope: archive
    all:
      - id: metadata/file/format/structured::cab-container-format
      - id: metadata/archive/member/extension::archive-com-member
      - id: metadata/filename/document-theme::business-document-themed-basename

    crit: notable
  - id: cab-payment-pif-png-clues
    desc: Payment-named PIF member and PNG clues
    scope: archive
    all:
      - id: metadata/archive/member/filename/lure::archive-payment-pif-member
      - id: metadata/file/magic/numbers::png-magic-in-text-section

    crit: suspicious
