# Structural coverage for executive/vendor invoice fraud delivered as HTML
# email.  No atom relies on lure sentences: the durable artifacts are RFC 822
# envelope fields, vendor-lookalike mailbox domains, HTML-rendered forwarded
# headers, and a presentation table holding an ACH routing/account pair.
defaults:
  platforms: [windows, unix]
  for: [html, text, data]
  attack: T1657

traits:
  - id: html-nine-digit-table-cell
    desc: HTML table cell holds nine digits
    crit: component
    conf: 0.92
    if:
      type: text
      regex: '(?i)<t[dh]\b.{0,80}>\s*\d{9}\s*</t[dh]>'

  - id: html-long-number-table-cell
    desc: HTML table cell holds long number
    crit: component
    conf: 0.9
    if:
      type: text
      regex: '(?i)<t[dh]\b.{0,80}>\s*\d{10,17}\s*</t[dh]>'

  - id: html-currency-amount-cell
    desc: HTML table cell holds currency amount
    crit: component
    conf: 0.86
    if:
      type: text
      regex: '(?i)<t[dh]\b.{0,80}>\s*[$€£]\s?\d{1,3}(,\d{3}){1,3}\.\d{2}\b'

composite_rules:
  - id: html-us-routing-account-row
    desc: HTML routing and account number table
    crit: component
    conf: 0.94
    all:
      - id: html-nine-digit-table-cell
      - id: html-long-number-table-cell
    near_lines: 2

  - id: lookalike-vendor-html-bank-invoice
    desc: Lookalike vendor HTML bank invoice
    crit: hostile
    conf: 0.97
    all:
      - id: metadata/file/format/markup::rfc822-html-body-headers
      - id: metadata/file/format/markup::html-presentation-table
      - id: objectives/command-and-control/infrastructure/domain/brand-impersonation::invoice-vendor-lookalike-email-domain
      - id: html-us-routing-account-row
      - id: html-currency-amount-cell

  - id: fabricated-forwarded-vendor-invoice
    desc: Fake forwarded vendor bank invoice
    crit: hostile
    conf: 0.98
    all:
      - id: metadata/file/format/markup::rfc822-html-body-headers
      - id: metadata/file/format/markup::html-rendered-from-label
      - id: metadata/file/format/markup::html-presentation-table
      - id: objectives/command-and-control/infrastructure/domain/brand-impersonation::invoice-vendor-lookalike-email-domain
      - id: html-us-routing-account-row

  - id: reply-to-vendor-invoice-fraud
    desc: Reply-To vendor bank invoice fraud
    crit: hostile
    conf: 0.97
    all:
      - id: metadata/file/format/markup::rfc822-from-reply-to-headers
      - id: metadata/file/format/markup::html-presentation-table
      - id: objectives/command-and-control/infrastructure/domain/brand-impersonation::invoice-vendor-lookalike-email-domain
      - id: html-us-routing-account-row
      - id: html-currency-amount-cell
