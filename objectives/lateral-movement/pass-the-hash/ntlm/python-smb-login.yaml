defaults:
  platforms: [unix, windows]
  for: [python]
  crit: suspicious
  conf: 0.96
  attack: T1550.002
traits:
  - id: python-smb-raw-hash-login
    desc: SMB login uses hash with empty password
    if:
      type: symbol
      kind: call
      regex: '\.login$'
      receiver:
        from:
          call: '(^|\.)SMBConnection$'
      args:
        - index: 1
          kind: string
          exact: ''
        - index: 4
          kind: identifier
          name: nt_hash
