defaults:
  platforms: [unix, windows]
  for: [rust]
  attack: T1550.002

traits:
  - id: rust-ntlm-hash-login-api
    desc: Rust exposes an NT hash login API
    crit: notable
    conf: 0.98
    if:
      type: symbol
      kind: function
      exact: login_hash

  - id: rust-ntlm-authenticate-hash-call
    desc: Rust authenticates NTLM with a supplied hash
    crit: notable
    conf: 0.98
    if:
      type: symbol
      kind: call
      exact: ntlm.authenticate_hash

composite_rules:
  - id: rust-ntlm-pass-the-hash
    desc: Rust SMB client performs pass-the-hash login
    crit: hostile
    conf: 0.99
    all:
      - id: rust-ntlm-hash-login-api
      - id: rust-ntlm-authenticate-hash-call
