defaults:
  platforms: [unix, windows]
  for: [rust]
  attack: T1550.002

traits:
  - id: rust-ntlm-hash-login-api
    desc: Rust exposes raw NT hash login
    crit: notable
    conf: 0.98
    if:
      type: text
      regex: 'pub async fn login_hash(?s:.){0,500}Cred::NtHash'

  - id: rust-ntlm-authenticate-hash-call
    desc: Rust calls NTLM hash authentication
    crit: notable
    conf: 0.98
    if:
      type: symbol
      kind: call
      exact: ntlm.authenticate_hash

composite_rules:
  - id: rust-ntlm-pass-the-hash
    desc: Rust performs NTLM pass-the-hash login
    crit: notable
    conf: 0.99
    all:
      - id: rust-ntlm-hash-login-api
      - id: rust-ntlm-authenticate-hash-call
