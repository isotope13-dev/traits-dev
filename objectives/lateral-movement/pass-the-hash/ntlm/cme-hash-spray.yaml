# A driver that authenticates a post-exploitation spray tool
# (CrackMapExec / NetExec) with an NTLM hash and works the hosts that
# accept it. Password guessing is brute force; handing a captured hash to
# a spray framework is pass-the-hash (T1550.002). The hash flag plus the
# tool plus its post-exploitation fruit (admin markers, share/user/session
# enumeration) is the complete shape — a bare tool mention or a defensive
# log parser matching `Pwn3d!` has no credential leg and stays out.
defaults:
  platforms: [unix, windows]
  for: [go, python, shell]
  attack: T1550.002

composite_rules:
  - id: cme-post-exploitation-evidence
    desc: CME admin or enumeration evidence
    crit: notable
    conf: 0.94
    all:
      - id: well-known/tool/offensive/netexec::cme-binary-name-reference
    any:
      - id: well-known/tool/offensive/netexec::cme-admin-success-marker
      - id: well-known/tool/offensive/netexec::cme-enum-module-flags

  - id: spray-tool-hash-auth-driver
    desc: Spray tool driven with captured hash
    crit: hostile
    conf: 0.97
    all:
      - id: well-known/tool/offensive/netexec::cme-binary-name-reference
      - id: well-known/tool/offensive/netexec::cme-hash-auth-flag
      - id: cme-post-exploitation-evidence
    unless:
      - id: well-known/app/system/anthropic-cybersecurity-skills::defensive-cybersecurity-skills-repository
