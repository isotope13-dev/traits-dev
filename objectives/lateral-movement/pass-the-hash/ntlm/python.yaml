defaults:
  platforms: [unix, appliance, windows]
  for: [python, pyc]
  attack: T1550.002

traits:
  - id: python-pass-hash-text
    desc: Python pass-the-hash command or option
    crit: suspicious
    conf: 0.92
    if:
      type: text
      regex: '(?i)\bpass[-_ ]the[-_ ]hash\b(\s+--?[A-Za-z0-9_/]|$)'
    not:
      - substr: not vulnerable to pass-the-hash
    unless:
      - id: well-known/lib/network/requests-ntlm::requests-ntlm-library-context
      - id: metadata/build/generated::generated-attack-map-context
      - id: well-known/app/system/anthropic-cybersecurity-skills::defensive-cybersecurity-skills-repository
      - id: well-known/tool/offensive/bingo/
      - id: well-known/tool/detection/openhound::openhound-collector-context
  - id: python-smb-445-target
    desc: Python SMB 445 target
    crit: suspicious
    conf: 0.91
    for: [python]
    if:
      type: text
      regex: 'port = 445[\s\S]{0,220}sock\.connect'

composite_rules:
  - id: python-ntlm-pass-the-hash
    desc: Python NTLM pass-the-hash
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/os/security/auth/ntlm::ntlmssp-marker
      - id: python-pass-hash-text
    any:
      - id: micro-behaviors/fs/file/open::python-account-password-db-open
      - id: micro-behaviors/fs/file/copy::python-account-password-db-copy
      - id: micro-behaviors/os/privilege/paths::etc-shadow
      - id: micro-behaviors/fs/path/config/accounts::bsd-master-passwd-path
      - id: python-smb-445-target
