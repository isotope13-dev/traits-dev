defaults:
  platforms: [windows]
  for: [powershell]
  attack: T1550.002
  crit: hostile
  conf: 0.98

composite_rules:
  # Require raw hash input, its preparation and its MAC-key use in an
  # already-admitted SMB command executor. HMAC-MD5/NTLM alone also occur in
  # ordinary clients that derive a hash from a password.
  - id: powershell-raw-hash-service-execution
    desc: Raw NTLM hash input with SMB command execution
    all:
      - id: metadata/lang/source/declaration::powershell-string-hash-declaration
      - id: micro-behaviors/os/security/auth/ntlm::powershell-hash-text-to-ntlm-buffer
      - id: micro-behaviors/os/security/auth/ntlm::powershell-ntlm-buffer-mac-key
      - id: micro-behaviors/crypto/hash/hmac::powershell-hmacmd5-constructor
      - id: objectives/lateral-movement/smb::powershell-smbexec-service-command-execution
