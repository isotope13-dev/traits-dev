# A Python helper that interpolates a stolen NT hash into the command lines of
# several operator tools (impacket, evil-winrm, xfreerdp, mimikatz) builds
# pass-the-hash commands from a credential object. A static cheat sheet writes
# placeholders such as <hash>; only generated commands interpolate a variable.
defaults:
  platforms: [unix, windows]
  for: [python]
  attack: T1550.002

traits:
  - id: impacket-hashes-interpolated
    desc: Impacket -hashes argument takes a variable
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '-hashes\s+:?\{[\w.]{2,24}\}'

  - id: evil-winrm-hash-interpolated
    desc: evil-winrm -H argument takes a variable
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: 'evil-winrm\s+-i\s[^"'']{0,60}\s-H\s+\{[\w.]{2,24}\}'

  - id: xfreerdp-pth-interpolated
    desc: xfreerdp /pth argument takes a variable
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '/pth:\{[\w.]{2,24}\}'

  - id: mimikatz-pth-interpolated
    desc: mimikatz sekurlsa::pth takes variables
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: 'sekurlsa::pth\s+/user:\{[\w.]{2,24}\}'

composite_rules:
  - id: python-pth-command-generator
    desc: Python interpolates an NT hash into several pass-the-hash commands
    crit: hostile
    conf: 0.93
    near_lines: 30
    needs: 2
    any:
      - id: impacket-hashes-interpolated
      - id: evil-winrm-hash-interpolated
      - id: xfreerdp-pth-interpolated
      - id: mimikatz-pth-interpolated
