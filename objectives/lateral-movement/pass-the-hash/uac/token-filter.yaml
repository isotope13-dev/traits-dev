# Disabling LocalAccountTokenFilterPolicy to enable Pass-the-Hash from any
# local administrator (not just RID 500). Setting this DWORD to 1 under
# HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System removes
# UAC remote token filtering, letting attackers reuse hashed creds for any
# local admin account over WMI/SMB/WinRM. Observed in SHADOW-EARTH-053.
defaults:
  platforms: [windows]
  for: [pe, dll, batch, powershell, csharp]
  attack: T1550.002
  mbc: E1078
traits:
  - id: localaccount-token-filter-name
    desc: LocalAccountTokenFilterPolicy registry value
    crit: notable
    conf: 0.95
    if:
      type: text
      word: LocalAccountTokenFilterPolicy
  - id: localaccount-token-filter-powershell-write
    desc: PowerShell writes a registry property
    crit: component
    conf: 0.95
    if:
      type: text
      regex: '(?i)\b(Set|New)-ItemProperty\b'
  - id: localaccount-token-filter-powershell-value-one
    desc: PowerShell registry value is one
    crit: component
    conf: 0.95
    if:
      type: text
      regex: '(?i)-Value\s+1\b'
  - id: localaccount-token-filter-reg-value-one
    desc: reg.exe data value is one
    crit: component
    conf: 0.95
    if:
      type: text
      regex: '(?i)\b/d\s+1\b'

composite_rules:
  - id: localaccount-token-filter-powershell-set
    desc: PowerShell sets LocalAccountTokenFilterPolicy to one
    crit: suspicious
    conf: 0.97
    all:
      - id: localaccount-token-filter-name
      - id: localaccount-token-filter-powershell-write
      - id: localaccount-token-filter-powershell-value-one
    near_lines: 1
  - id: localaccount-token-filter-reg-set
    desc: reg.exe sets LocalAccountTokenFilterPolicy to one
    crit: suspicious
    conf: 0.97
    all:
      - id: localaccount-token-filter-name
      - id: micro-behaviors/os/registry/manipulate::reg-exe-add-command
      - id: localaccount-token-filter-reg-value-one
    near_lines: 1
  - id: localaccount-token-filter-set
    desc: LocalAccountTokenFilterPolicy is set to one
    crit: suspicious
    conf: 0.97
    any:
      - id: localaccount-token-filter-powershell-set
      - id: localaccount-token-filter-reg-set
