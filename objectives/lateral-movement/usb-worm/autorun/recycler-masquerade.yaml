# A Recycler.exe-named payload launched by autorun directives: the worm
# names its dropper after the recycle-bin folder artifact so the drive's
# contents look like system recycling data. Software named for the recycle
# bin does not distribute itself through autorun.inf.
defaults:
  platforms: [windows]
  # Batch-classified files carry the directives echo-wrapped, which the
  # directive atom's line anchor cannot see; text is the realizable scope.
  for: [text]
  attack: T1091,T1036.005

composite_rules:
  - id: autorun-launches-recycler-masquerade
    desc: Autorun launches Recycler-masquerading payload
    crit: hostile
    conf: 0.95
    all:
      - id: micro-behaviors/os/autorun/media::autorun-inf-launch-program
      - id: micro-behaviors/fs/path/config/autorun::autorun-directive-targets-recycler-name
