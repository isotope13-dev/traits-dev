defaults:
  platforms: [windows]
  for: [vbs]
  attack: T1091,T1547.001
  mbc: B0016

composite_rules:
  - id: vbs-autorun-usb-worm
    desc: VBScript autorun worm on removable drives
    crit: hostile
    conf: 0.97
    all:
      - id: micro-behaviors/fs/path/config/autorun::autorun-shellexecute
      - id: micro-behaviors/fs/traversal/drives::vbs-drive-type-removable-check
      - id: micro-behaviors/fs/write/content::create-powershell-or-vbs-file

  - id: vbs-autorun-inf-self-copy
    desc: VBScript copies itself via autorun.inf
    crit: hostile
    conf: 0.96
    all:
      - id: micro-behaviors/fs/path/config/autorun::autorun-inf-string
      - id: micro-behaviors/fs/path/config/autorun::autorun-section
      - id: micro-behaviors/fs/traversal/drives::vbs-fso-drive-enumeration
