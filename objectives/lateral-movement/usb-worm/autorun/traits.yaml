defaults:
  platforms: [windows]
  for: [pe, batch, powershell, vbs]
  attack: T1091
composite_rules:
- id: recycler-copy-autorun-worm
  for: [pe]
  desc: Copies its executable under the Recycle Bin path and configures Autorun
  crit: hostile
  conf: 0.96
  all:
  - id: micro-behaviors/fs/path/system::recycler-path
  - id: micro-behaviors/fs/path/config/autorun::autorun-inf-string
  - id: micro-behaviors/fs/path/config/autorun::root-autorun-config-target
  - id: micro-behaviors/fs/file/copy/call::copyfile-a
  - id: micro-behaviors/process/info/current::get-module-filename
- id: autorun-drive-worm
  for: [pe]
  desc: Autorun worm with drive enumeration
  crit: hostile
  conf: 0.92
  all:
  - id: micro-behaviors/fs/path/config/autorun::autorun-open
  - id: micro-behaviors/fs/enumerate/drives::get-drive-type
  - id: micro-behaviors/process/info/current::get-module-filename
  - id: micro-behaviors/fs/file/copy/call::copyfile-a
  - id: micro-behaviors/os/autorun/media::autorun-shellexecute-executable
  any:
  - id: micro-behaviors/fs/path/config/autorun::autorun-inf-string
  - id: micro-behaviors/fs/path/system::recycler-path
  - id: micro-behaviors/os/registry/write::reg-add-run-command
  unless:
  - id: objectives/lateral-movement/usb-worm/autorun::native-windows-autorun-usb-worm
- id: mountpoint-autorun-worm
  for: [pe]
  desc: MountPoint autorun worm propagation
  crit: hostile
  conf: 0.96
  all:
  - id: micro-behaviors/fs/enumerate/drives::mountpoint-manager-device
  - id: micro-behaviors/fs/enumerate/drives::mountpoints2-volume-key
  - id: micro-behaviors/fs/path/config/autorun::autorun-inf-string
  - id: micro-behaviors/fs/path/drive-root::drive-root-executable-path
  any:
  - id: micro-behaviors/fs/enumerate/drives::mountmgr-ioctl-log
  - id: micro-behaviors/process/inject/remote-thread::remote-thread-api-reference
  - id: "micro-behaviors/os/registry/keys/autostart::winlogon-registry-path"
  - id: micro-behaviors/os/registry/access::registry-write-api-chain
- id: vb6-usb-worm
  for: [pe]
  desc: VB6 USB worm with reversed strings and Autorun.inf
  crit: hostile
  conf: 0.95
  all:
  - id: micro-behaviors/fs/path/config/autorun::autorun-directives-drive-context
  - id: objectives/anti-static/obfuscation/string/reverse::vb6-reversed-strings
