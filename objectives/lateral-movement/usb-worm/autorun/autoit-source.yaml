defaults:
  platforms: [windows]
  for: [data, text, vbs]
  attack: T1091
traits:
  - id: autoit-removable-executable-autorun-source
    desc: Removable-drive copy and executable autorun
    crit: suspicious
    conf: 0.98
    if:
      type: yara
      source: |
        rule autoit_removable_executable_autorun_source {
          strings:
            $drives = /DriveGetDrive[ \t]*\([ \t]*"removable"/ nocase
            $copy = /FileCopy[ \t]*\([ \t]*@AutoItExe[ \t]*,[^\r\n]{1,160}\.exe"/ nocase
            $autorun = /FileWrite[ \t]*\([^\r\n]{1,80}"\[AUTORUN\]"/ nocase
            $execute = /FileWrite[ \t]*\([^\r\n]{1,80}"shellexecute=[^"\r\n]{1,80}\.exe"/ nocase
          condition:
            all of them
        }
composite_rules:
  - id: autoit-document-lure-removable-worm
    desc: Document lure worm writes removable autoruns
    crit: hostile
    conf: 0.99
    all:
      - id: autoit-removable-executable-autorun-source
      - id: objectives/evasion/masquerade/file/double-ext::autoit-document-self-copy-lures
