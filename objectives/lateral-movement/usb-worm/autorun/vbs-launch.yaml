# An autorun.inf whose open/shellexecute directive targets a VBScript file:
# worms abuse WSH file associations to execute dropped or removable-media
# script payloads upon drive access. Legitimate media installers do not ship
# raw VBS launch targets.
defaults:
  platforms: [windows]
  for: [text]
  attack: T1091

composite_rules:
  - id: autorun-vbs-payload-launch
    desc: Autorun directives launch a VBScript payload
    crit: hostile
    conf: 0.95
    all:
      - id: micro-behaviors/os/autorun/media::autorun-inf-launch-program
      - id: micro-behaviors/fs/path/config/autorun::autorun-directive-targets-vbs

  - id: autorun-windows-vbs-payload-launch
    desc: Autorun directives launch Windows directory VBScript
    crit: hostile
    conf: 0.97
    all:
      - id: micro-behaviors/os/autorun/media::autorun-inf-launch-program
      - id: micro-behaviors/fs/path/config/autorun::autorun-directive-targets-vbs
      - id: micro-behaviors/fs/path/config/autorun::autorun-directive-targets-windows-directory
