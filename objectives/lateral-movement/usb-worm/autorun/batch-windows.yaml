defaults:
  platforms: [windows]
  for: [batch]
  attack: T1091

traits:
  - id: batch-wmic-removable-drive-check
    desc: Batch WMIC removable drive check
    crit: suspicious
    conf: 0.93
    if:
      type: text
      regex: 'wmic\s+logicaldisk\s+where.{0,80}DriveType.{0,40}findstr\s+"2"'
      case_insensitive: true

  - id: batch-drive-letter-loop
    desc: Batch drive-letter loop
    crit: suspicious
    conf: 0.9
    if:
      type: text
      regex: 'for\s+%%D\s+in\s+\(C D E F G'
      case_insensitive: true

  - id: batch-drive-letter-string
    desc: Batch stores a sequential drive-letter range
    crit: suspicious
    conf: 0.92
    if:
      type: text
      regex: '(?i)\bset\s+["'']?[A-Za-z_]\w*\s*=\s*CDEFGHIJKLMNOPQRSTUVWXYZ'

  - id: batch-drive-letter-index-read
    desc: Batch selects a drive letter by index
    crit: suspicious
    conf: 0.94
    if:
      type: text
      regex: '(?i)![A-Za-z_]\w*:~%[A-Za-z_]\w*%,1!:'

composite_rules:
  - id: batch-wmic-autorun-usb-worm
    desc: Batch WMIC autorun USB worm
    crit: hostile
    conf: 0.98
    all:
      - id: batch-wmic-removable-drive-check
      - id: batch-drive-letter-loop
      - id: micro-behaviors/fs/path/config/autorun::autorun-open
    any:
      - id: micro-behaviors/fs/path/config/autorun::autorun-shellexecute
      - id: micro-behaviors/fs/path/config/autorun::autorun-section

  - id: batch-indexed-drive-autorun-worm
    desc: Batch copies itself to indexed autorun drives
    crit: hostile
    conf: 0.99
    all:
      - id: batch-drive-letter-string
      - id: batch-drive-letter-index-read
      - id: micro-behaviors/fs/path/config/autorun::autorun-open
      - id: micro-behaviors/fs/path/config/autorun::autorun-section
      - id: objectives/persistence/login/self-install/script::batch-self-copy
      - id: micro-behaviors/fs/file/attributes::attrib-hidden-system
