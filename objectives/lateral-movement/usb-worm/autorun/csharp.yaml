# C#/VB.NET USB worm spreading via autorun
defaults:
  for: [csharp]
  platforms: [windows]
  attack: "T1091"
traits:
  - id: usb-infection-class
    desc: USB propagation helper class
    crit: suspicious
    conf: 0.95
    if:
      type: text
      regex: '(?i)\bclass\s+USB\w*(Infect|Spread|Worm)'
  - id: usb-lnk-wscript-lure
    desc: WScript shortcut creation for USB lure
    crit: suspicious
    conf: 0.92
    if:
      type: text
      regex: 'CreateShortcut\(.{0,80}\.lnk'
composite_rules:
  - id: usb-worm-dotnet
    desc: .NET USB worm spreading via removable drives
    crit: hostile
    conf: 0.96
    near_bytes: 2048
    all:
      - id: micro-behaviors/fs/enumerate/drives::dotnet-drive-enumeration
      - id: micro-behaviors/fs/enumerate/drives::dotnet-drive-type-reference
      - id: micro-behaviors/fs/file/copy/source-destination::file-copy-source
    any:
      - id: usb-infection-class
      - id: usb-lnk-wscript-lure
  - id: usb-lnk-lure-spreader
    desc: USB worm using LNK shortcuts as lures to hide real files
    crit: hostile
    conf: 0.97
    near_bytes: 2048
    all:
      - id: micro-behaviors/fs/enumerate/drives::dotnet-drive-enumeration
      - id: micro-behaviors/fs/enumerate/drives::dotnet-drive-type-reference
      - id: micro-behaviors/fs/file/copy/source-destination::file-copy-source
      - id: usb-lnk-wscript-lure
