# C#/VB.NET USB worm spreading via autorun
defaults:
  for: [csharp]
  platforms: [windows]
  attack: "T1091"
traits:
  - id: drivetype-removable
    desc: DriveType.Removable check
    crit: component
    conf: 0.88
    if:
      type: text
      substr: "DriveType.Removable"
  - id: getdrives-enum
    desc: DriveInfo.GetDrives enumeration
    crit: component
    conf: 0.85
    if:
      type: text
      substr: "DriveInfo.GetDrives"
  - id: usb-infection-class
    desc: USB propagation helper class
    crit: suspicious
    conf: 0.95
    if:
      type: text
      regex: '(?i)\bclass\s+USB\w*(Infect|Spread|Worm)'
  - id: usb-lnk-wscript-lure
    desc: WScript shortcut creation for USB lure
    crit: suspicious
    conf: 0.92
    if:
      type: text
      regex: 'CreateShortcut\(.{0,80}\.lnk'
composite_rules:
  - id: file-copy-to-drive
    desc: Copies files while enumerating removable drives
    crit: suspicious
    conf: 0.94
    near_bytes: 2048
    all:
      - id: drivetype-removable
      - id: getdrives-enum
      - id: micro-behaviors/fs/file/copy::file-copy-source

  - id: usb-worm-dotnet
    desc: .NET USB worm spreading via removable drives
    crit: hostile
    conf: 0.96
    all:
      - id: file-copy-to-drive
    any:
      - id: usb-infection-class
      - id: usb-lnk-wscript-lure
  - id: usb-lnk-lure-spreader
    desc: USB worm using LNK shortcuts as lures to hide real files
    crit: hostile
    conf: 0.97
    all:
      - id: file-copy-to-drive
      - id: usb-lnk-wscript-lure
