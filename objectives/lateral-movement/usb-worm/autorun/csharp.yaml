# C#/VB.NET USB worm spreading via autorun
defaults:
  for: [csharp]
  platforms: [windows]
  attack: "T1091"
traits:
  - id: usb-infection-class
    desc: USB propagation helper class
    crit: suspicious
    conf: 0.95
    if:
      type: text
      regex: '(?i)\bclass\s+USB\w*(Infect|Spread|Worm)'
  - id: usb-lnk-wscript-lure
    desc: WScript shortcut creation for USB lure
    crit: suspicious
    conf: 0.92
    if:
      type: text
      regex: 'CreateShortcut\(.{0,80}\.lnk'
composite_rules:
  - id: usb-worm-dotnet
    desc: .NET USB worm spreading via removable drives
    crit: hostile
    conf: 0.96
    near_bytes: 2048
    all:
      - id: micro-behaviors/fs/enumerate/drives::dotnet-drive-enumeration
      - id: micro-behaviors/fs/enumerate/drives::dotnet-drive-type-reference
      - id: micro-behaviors/fs/file/copy/source-destination::file-copy-source
    any:
      - id: usb-infection-class
      - id: usb-lnk-wscript-lure

  # Icon-lure variant: the worm extracts each victim file's icon, hides the
  # original in a hidden staging folder, and compiles a screen-saver-named
  # launcher that shows the original icon and starts both files. The helper
  # class name rotates; the icon extraction, the compiled decoy and the
  # drive spread do not.
  - id: usb-icon-lure-spreader
    desc: USB worm compiles icon-cloned decoy launchers
    crit: hostile
    conf: 0.96
    all:
      - id: micro-behaviors/fs/enumerate/drives::dotnet-drive-enumeration
      - id: micro-behaviors/fs/enumerate/drives::dotnet-drive-type-reference
      - id: micro-behaviors/fs/file/copy/source-destination::file-copy-source
      - id: micro-behaviors/metaprogramming/generation/compile::generate-executable
      - id: micro-behaviors/ui/graphics/icon::csharp-icon-extract-associated
    any:
      - id: micro-behaviors/ui/graphics/icon::csharp-win32icon-compiler-option
      - id: micro-behaviors/metaprogramming/generation/compile::csharp-scr-output-assembly
  - id: usb-lnk-lure-spreader
    desc: USB worm using LNK shortcuts as lures to hide real files
    crit: hostile
    conf: 0.97
    near_bytes: 2048
    all:
      - id: micro-behaviors/fs/enumerate/drives::dotnet-drive-enumeration
      - id: micro-behaviors/fs/enumerate/drives::dotnet-drive-type-reference
      - id: micro-behaviors/fs/file/copy/source-destination::file-copy-source
      - id: usb-lnk-wscript-lure
