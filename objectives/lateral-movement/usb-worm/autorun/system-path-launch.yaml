# An autorun.inf whose open/shellexecute directive points to an absolute path
# in the Windows system directory: removable-media autorun is designed to launch
# relative paths on the media itself. Hardcoding C:\Windows launches a pre-staged
# host payload.
defaults:
  platforms: [windows]
  for: [text]
  attack: T1091

composite_rules:
  - id: autorun-system-path-payload-launch
    desc: Autorun directives launch Windows directory payload
    crit: hostile
    conf: 0.95
    all:
      - id: micro-behaviors/os/autorun/media::autorun-inf-launch-program
      - id: micro-behaviors/fs/path/config/autorun::autorun-directive-targets-windows-directory
