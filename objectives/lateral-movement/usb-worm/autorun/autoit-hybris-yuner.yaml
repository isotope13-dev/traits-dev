# Hybris (Yuner) AutoIt worm: encrypted EA06 script drives USB autorun
# spreading, .doc companion infections, and CLV.Classes registry staging.
defaults:
  platforms: [windows]
  for: [pe]
  attack: T1091,T1036.007

traits:
  - id: hybris-yuner-ea06-ciphertext-prefix
    desc: Hybris Yuner EA06 script prefix
    crit: notable
    conf: 0.99
    size_min: 32768
    size_max: 1048576
    if:
      type: hex
      pattern: 'F2 F5 7B 45 12 EF E4 FF E8 93 BB C9 04 50 69 37 6B 43 CA 52 AF AD'
      section: overlay

  - id: hybris-yuner-worm-source
    desc: Hybris Yuner worm source markers
    crit: notable
    conf: 0.999
    for: [data, text, vbs]
    if:
      type: yara
      source: |
        rule autoit_hybris_yuner_worm_source {
          strings:
            $clv = "CLV.Classes" nocase
            $word = "open=Word.exe" nocase
            $rem = "DriveGetDrive" nocase
            $auto = "@AutoItExe" nocase
            $nal = ".nal" nocase
            $buddy = "HeY_BuDdY" nocase
          condition:
            all of them
        }

composite_rules:
  - id: autoit-hybris-yuner-compiled-worm
    desc: Hybris Yuner compiled AutoIt worm
    crit: hostile
    conf: 0.99
    all:
      - id: hybris-yuner-ea06-ciphertext-prefix
      - id: metadata/lang/compiled::autoit-ea06-encrypted-script-blob-text
