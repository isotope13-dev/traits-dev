# VB6 autorun worms pair a shell dropper with autorun.inf and a Run key.
defaults:
  platforms: [windows]
  for: [pe]
  attack: T1091,T1547.001
  crit: hostile
  conf: 0.94

composite_rules:
  - id: vb6-autorun-inf-worm
    desc: VB6 shell dropper writes autorun.inf
    all:
      - id: micro-behaviors/process/create/macro/office::vb6-shell-execution
      - id: micro-behaviors/fs/path/config/autorun::autorun-inf-string
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/installer/family/

  - id: vb6-autorun-runkey-worm
    desc: Autorun worm also writes a Run key
    all:
      - id: micro-behaviors/fs/path/config/autorun::autorun-inf-string
      - id: micro-behaviors/os/registry/keys::currentversion-run
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/installer/family/

  - id: vb6-concealed-autorun-worm
    desc: VB6 conceals Win32 APIs in an autorun worm
    all:
      - id: objectives/anti-static/obfuscation/imports::vb6-concealed-win32-apis
      - id: micro-behaviors/fs/path/config/autorun::autorun-inf-string
    unless:
      - id: metadata/signed/platform/
      - id: well-known/lib/runtime/native-platform/vb-richclient::vb-richclient-runtime-library

  - id: vb6-drive-spread-worm
    desc: VB6 shell dropper enumerates logical drives
    all:
      - id: micro-behaviors/process/create/macro/office::vb6-shell-execution
      - id: micro-behaviors/fs/traversal/drives::logical-drive-enumeration
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/installer/family/

  - id: vb6-findfile-shell-worm
    desc: VB6 shell dropper walks directories to spread
    all:
      - id: micro-behaviors/process/create/macro/office::vb6-shell-execution
      - id: micro-behaviors/fs/enumerate/directory::find-file-walker
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/installer/family/

  - id: vb6-shellexec-drive-worm
    desc: VB6 ShellExecute dropper enumerates logical drives
    all:
      - id: micro-behaviors/process/create/shellexec::shell-execute-call
      - id: micro-behaviors/fs/traversal/drives::logical-drive-enumeration
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/installer/family/
