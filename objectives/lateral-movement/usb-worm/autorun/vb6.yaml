# VB6 autorun worms pair a shell dropper with autorun.inf and a Run key.
defaults:
  platforms: [windows]
  for: [pe]
  attack: T1091,T1547.001
  crit: hostile
  conf: 0.94

composite_rules:
  - id: vb6-autorun-inf-worm
    desc: VB6 drive autorun with Run-key command
    all:
      - id: micro-behaviors/process/create/exec::vb6-shell-execution
      - id: micro-behaviors/fs/enumerate/drives::get-logical-drive-strings
      - id: micro-behaviors/fs/write/file/handle/unspecified::vb6-print-file
      - id: micro-behaviors/fs/path/config/autorun::autorun-section
      - id: micro-behaviors/os/registry/autostart/write::reg-add-run-command
      - id: micro-behaviors/fs/path/config/autorun::autorun-inf-string
    unless:
      - id: metadata/installer/product/

  - id: vb6-autorun-runkey-worm
    desc: VB6 self-copy AutoRun writer with Run-key clues
    all:
      - id: micro-behaviors/fs/path/config/autorun::autorun-inf-string
      - id: micro-behaviors/fs/path/config/autorun::autorun-section
      - id: metadata/binary/instruction/sequence/unspecified::x86-repeated-literal-argument-call-layout
      - id: micro-behaviors/fs/write/file/handle/unspecified::vb6-print-file-helper-reference
      - id: micro-behaviors/fs/path/self::vb6-app-executable-path-profile
      - id: micro-behaviors/os/registry/autostart/write::wscript-run-key-write-references
    any:
      - id: metadata/lang/runtime::vb6-runtime-dll
      - id: micro-behaviors/dylib/load/runtime::vb6-runtime-dll-reference
    unless:
      - id: metadata/installer/product/

  - id: vb6-concealed-autorun-worm
    desc: VB6 conceals Win32 APIs in an autorun worm
    all:
      - id: objectives/anti-static/obfuscation/imports/concealment::vb6-concealed-win32-apis
      - id: micro-behaviors/fs/path/config/autorun::autorun-inf-string
    unless:
      - id: well-known/lib/runtime/native-platform/vb-richclient::vb-richclient-runtime-library

  - id: vb6-shellexec-drive-worm
    desc: VB6 ShellExecute dropper enumerates logical drives
    all:
      - id: metadata/lang/runtime::vb6-runtime-dll
      - id: micro-behaviors/os/handler/open::shell-execute-api-text
      - id: micro-behaviors/fs/enumerate/drives::logical-drive-enumeration
      - id: micro-behaviors/fs/path/config/autorun::autorun-inf-string
    unless:
      - id: metadata/installer/product/
      - id: well-known/tool/sysadmin/7zip/utility::sevenzip-distribution-binary

  # VB6 worms copy their own image with FileCopy to each drive root and write
  # a root AUTORUN.INF whose launch verb names an executable. Requiring the
  # self-path profile plus Run-key or hidden-attribute evidence keeps AutoRun
  # menu builders, which copy a chosen setup program, out.
  - id: vb6-filecopy-self-autorun-drive-worm
    desc: VB6 self-copy to drive root with AutoRun launch
    all:
      - id: metadata/lang/runtime::vb6-application-framework
      - id: micro-behaviors/fs/file/copy/call::vb6-rtcfilecopy
      - id: micro-behaviors/fs/path/self::vb6-app-executable-path-profile
      - id: micro-behaviors/fs/path/config/autorun::root-autorun-config-target
      - id: autorun-executable-launch-verb
    any:
      - id: micro-behaviors/os/registry/autostart/write::wscript-run-key-write-references
      - id: micro-behaviors/fs/file/attributes::vb6-set-file-attributes
    unless:
      - id: metadata/installer/product/

  - id: autorun-executable-launch-verb
    desc: AutoRun section names a launched program
    crit: notable
    any:
      - id: micro-behaviors/fs/path/config/autorun::autorun-shell-directive
      - id: micro-behaviors/fs/path/config/autorun::autorun-shell-directive-alt
      - id: micro-behaviors/fs/path/config/autorun::autorun-shell-directive-wide
      - id: micro-behaviors/fs/path/config/autorun::autorun-open
      - id: micro-behaviors/fs/path/config/autorun::autorun-open-wide
      - id: micro-behaviors/fs/path/config/autorun::autorun-shellexecute
      - id: micro-behaviors/fs/path/config/autorun::autorun-shellexecute-wide

