defaults:
  platforms: [windows]
  for: [pe, dll]
composite_rules:
  - id: managed-keylogger-removable-autorun-replication
    desc: Managed keylogger has self-path, drive and executable AutoRun-write references
    crit: hostile
    conf: 0.97
    attack: T1091
    all:
      - id: objectives/collection/keylog/hook::dotnet-hook-keylog-upload-api-references
      - id: micro-behaviors/process/info/selfpath::managed-executable-path-getter
      - id: micro-behaviors/fs/traversal/drives::dotnet-drive-enumeration
      - id: micro-behaviors/fs/traversal/drives::get-drive-type-dotnet
      - id: micro-behaviors/fs/path/config/autorun::autorun-inf-string
      - id: micro-behaviors/fs/path/config/autorun::autorun-open-executable-template
      - id: micro-behaviors/fs/write/file/full::dotnet-writealltext-token
