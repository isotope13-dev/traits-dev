defaults:
  platforms: [windows]
  for: [text]
  attack: T1091
  crit: suspicious
  conf: 0.93

composite_rules:
  - id: autorun-launches-recycled-program
    desc: Autorun launches a Recycled program
    near_bytes: 256
    all:
      - id: micro-behaviors/os/autorun/media::autorun-inf-launch-program
      - id: micro-behaviors/os/autorun/media::recycled-directory-file
