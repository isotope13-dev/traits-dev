# An [Autorun] section whose Shell\<verb>\Command= line replaces the action
# Windows takes for that drive verb: opening (or exploring) the removable
# drive launches the program instead of showing the folder. The usual
# companion `Shell=Open` relabels the hijacked verb so the drive still looks
# normal. Ordinary installers and documents do not override drive verbs.
defaults:
  platforms: [windows]
  for: [text]
  attack: T1091

composite_rules:
  - id: autorun-drive-open-verb-hijack
    desc: Autorun section hijacks drive-open shell verb
    crit: hostile
    conf: 0.96
    all:
      - id: micro-behaviors/os/autorun/media::autorun-section-header
      - id: micro-behaviors/fs/path/config/autorun::autorun-shell-open-verb
  # Replacing both built-in navigation verbs leaves no drive action that
  # only opens the folder. A custom verb does not replace either navigation
  # action and is not evidence of this behavior.
  - id: autorun-open-and-explore-hijack
    desc: Autorun replaces both Open and Explore verbs
    crit: hostile
    conf: 0.97
    near_lines: 16
    all:
      - id: micro-behaviors/os/autorun/media::autorun-section-header
      - id: micro-behaviors/fs/path/config/autorun::autorun-shell-open-verb
      - id: micro-behaviors/fs/path/config/autorun::autorun-shell-explore-verb
