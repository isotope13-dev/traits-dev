# Managed (compiled .NET) USB worm. Compiled assemblies keep the managed
# member tokens of the propagation loop: enumerate drives, copy the running
# assembly's own file onto each volume, and plant an autorun.inf whose open
# directive names the copy. Each leg is an ordinary operation; the combination
# is the propagation claim.
defaults:
  for: [pe, dll]
  platforms: [windows]
  attack: T1091
composite_rules:
- id: dotnet-autorun-drive-worm
  desc: Seeds drives with self-copies plus autorun open
  crit: hostile
  conf: 0.95
  all:
  - id: micro-behaviors/fs/path/config/autorun::autorun-open-executable-template
  - id: micro-behaviors/fs/traversal/drives::dotnet-drive-enumeration
  - id: micro-behaviors/fs/file/copy::dotnet-self-assembly-copy
