# Keylogging supplies abuse context; drive, self-path and copy references
# alone can also appear in legitimate portable installers.
defaults:
  for: [pe, dll]
  platforms: [windows]
  attack: T1091
composite_rules:
- id: dotnet-autorun-drive-worm
  desc: Keylogger with drive-copy and executable AutoRun references
  crit: hostile
  conf: 0.95
  all:
  - id: micro-behaviors/fs/path/config/autorun::autorun-open-executable-template
  - id: micro-behaviors/fs/traversal/drives::dotnet-drive-enumeration
  - id: micro-behaviors/fs/file/copy::managed-assembly-path-copy-references
  any:
  - id: objectives/collection/keylog/hook::dotnet-hook-keylog-recording
  - id: objectives/collection/keylog/hook::managed-file-keylogger-with-hook
