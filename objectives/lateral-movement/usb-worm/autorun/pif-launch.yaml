# A PIF file exists to launch a program under a chosen icon; an autorun.inf
# whose open/shellexecute directives point at one turns every inserted drive
# into a launcher for the worm's dropper. No software distribution this
# century ships .pif installers, so the launch-program composite paired with
# a PIF target is the PIF-era autorun dropper (Hupigon-style).
defaults:
  platforms: [windows]
  # Batch-classified files carry hosts- and ftp-style lines echo-wrapped, so
  # the media launch-program leg (text-scoped) cannot see them; text is the
  # whole realizable scope.
  for: [text]
  attack: T1091

composite_rules:
  - id: autorun-pif-payload-launch
    desc: Autorun directives launch a PIF payload
    crit: hostile
    conf: 0.95
    all:
      - id: micro-behaviors/os/autorun/media::autorun-inf-launch-program
      - id: micro-behaviors/fs/path/config/autorun::autorun-directive-targets-pif
