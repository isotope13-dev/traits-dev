defaults:
  platforms: [windows]
  for: [c, cpp, pe, dll]
  attack: T1091

traits:
  - id: native-removable-drive-enum
    desc: Native removable drive enum
    crit: suspicious
    conf: 0.92
    if:
      type: text
      regex: 'GetLogicalDrives[\s\S]{0,420}GetDriveTypeA[\s\S]{0,180}DRIVE_REMOVABLE'

    unless:
    - id: well-known/lib/platform/wine::wine-source-tree
    - id: well-known/tool/reverse-engineering/radare2::radare2-release-source-tree
  - id: native-autorun-inf-write
    desc: Native autorun.inf write
    crit: suspicious
    conf: 0.93
    if:
      type: text
      regex: 'autorun\.inf[\s\S]{0,320}\[autorun\][\s\S]{0,160}open='
      case_insensitive: true

  # Compiled worms commonly build these two destinations by prefixing a
  # drive letter at runtime.  Keeping the fragments atomic lets the objective
  # below require the pair without assigning intent to either path alone.
  - id: native-root-autorun-executable-target
    desc: References root AutoRun executable target
    crit: notable
    conf: 0.96
    if:
      type: text
      exact: ':\AutoRun.exe'
      case_insensitive: true


  - id: autorun-open-setup-executable
    desc: Autorun open launches setup executable
    crit: notable
    conf: 0.96
    for: [pe, dll]
    if:
      type: text
      exact: open=setup.exe
      case_insensitive: true

  - id: autorun-shellexecute-setup-executable
    desc: Autorun ShellExecute launches setup executable
    crit: notable
    conf: 0.96
    for: [pe, dll]
    if:
      type: text
      exact: shellexecute=setup.exe
      case_insensitive: true

  - id: wsh-autorun-shellexecute
    desc: Autorun entry uses shellexecute
    crit: suspicious
    conf: 0.93
    for: [vbs, text, static-lib]
    if:
      type: text
      regex: '(?i)\[autorun\].{0,80}shellexecute'

  - id: wsh-createtextfile-autorun
    desc: Creates an autorun.inf file
    crit: suspicious
    conf: 0.92
    for: [vbs, text, static-lib]
    if:
      type: text
      regex: '(?i)createtextfile\s*\([^)\r\n]{0,80}autorun\.inf'

composite_rules:
  - id: wsh-autorun-inf-dropper
    desc: Drops an autorun.inf shellexecute
    crit: hostile
    conf: 0.95
    for: [vbs, text, static-lib]
    all:
      - id: wsh-autorun-shellexecute
      - id: wsh-createtextfile-autorun

  - id: compiled-setup-autorun-template
    desc: Compiled autorun launches setup executable
    crit: suspicious
    conf: 0.98
    for: [pe, dll]
    all:
      - id: autorun-open-setup-executable
      - id: autorun-shellexecute-setup-executable

  - id: native-root-autorun-target-pair
    desc: References root AutoRun executable and configuration targets
    crit: component
    conf: 0.98
    for: [pe, dll]
    all:
      - id: native-root-autorun-executable-target
      - id: micro-behaviors/fs/path/config/autorun::root-autorun-config-target

  - id: native-windows-autorun-usb-worm
    for: [pe]
    desc: Copies a root AutoRun payload and writes its drive configuration
    crit: hostile
    conf: 0.99
    all:
      - id: micro-behaviors/fs/traversal/drives::logical-drive-enumeration-api-set
      - id: micro-behaviors/fs/file/copy::copyfile-a
      - id: native-root-autorun-target-pair
      - id: micro-behaviors/fs/config/system::write-private-profile-ansi
    any:
      - id: native-autorun-inf-write
      - id: micro-behaviors/fs/path/config/autorun::autorun-open
      - id: micro-behaviors/fs/path/config/autorun::autorun-section

  - id: compiled-autorun-self-copy-worm
    desc: Native binary self-copies through autorun drives
    crit: hostile
    conf: 0.99
    for: [pe, dll]
    all:
      - id: compiled-setup-autorun-template
      - id: micro-behaviors/fs/traversal/drives::logical-drive-enumeration-api-set
      - id: micro-behaviors/process/info/current::get-module-filename
      - id: micro-behaviors/fs/file/copy::copyfile-a
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/installer/family/
      - id: well-known/tool/sysadmin/

  # Some compiled worms build autorun.inf one line at a time rather than
  # retaining a complete template. The independent executable directive,
  # drive enumeration, current-image lookup, and copy API still establish the
  # same self-propagation behavior without relying on a family filename.
  - id: compiled-linewise-autorun-self-copy-worm
    desc: Self-copying native autorun worm
    crit: hostile
    conf: 0.99
    for: [pe, dll]
    all:
      - id: micro-behaviors/fs/traversal/drives::logical-drive-enumeration-api-set
      - id: micro-behaviors/fs/path/config/autorun::autorun-inf-string
      - id: micro-behaviors/os/autorun/media::autorun-shellexecute-executable
    any:
      - id: micro-behaviors/fs/file/copy::copyfile-module-path-api-pair
      - id: micro-behaviors/os/api-resolution/dynamic::self-copy-api-name-cluster
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/installer/family/
      - id: well-known/tool/sysadmin/
      # The complete-template rule reports this behavior more precisely.
      - id: compiled-setup-autorun-template

  # Some native worms copy their current image through CRT streams instead of
  # importing CopyFile. Requiring both stream directions, current-image lookup,
  # drive classification, and an executable autorun directive distinguishes the
  # propagation path from programs that merely inspect removable media.
  - id: compiled-stream-autorun-self-copy-worm
    desc: Native binary stream-copies itself through autorun drives
    crit: hostile
    conf: 0.99
    for: [pe, dll]
    all:
      - id: micro-behaviors/fs/traversal/drives::logical-drive-enumeration-api-set
      - id: micro-behaviors/process/info/current::get-module-filename
      - id: micro-behaviors/fs/read/file/handle::c-fread
      - id: micro-behaviors/fs/write/file/handle::write--fwrite
      - id: micro-behaviors/os/autorun/media::autorun-shellexecute-executable
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/installer/family/
      - id: well-known/tool/sysadmin/

  # Older native worms retain the autorun template and drive-root destinations
  # but obfuscate the imports that perform the copy. Pair the launch directive
  # and explicit root executable target with self-copy and drive traversal.
  - id: native-root-autorun-executable-worm
    desc: Native worm stages an executable through drive-root AutoRun
    crit: hostile
    conf: 0.98
    for: [pe, dll]
    all:
      - id: micro-behaviors/fs/path/config/autorun::autorun-inf-string
      - id: micro-behaviors/fs/path/config/autorun::autorun-open
      - id: micro-behaviors/fs/path/drive-root::drive-root-executable-path
      - id: micro-behaviors/fs/file/copy::copyfile-module-path-api-pair
      - id: micro-behaviors/fs/traversal/drives::logical-drive-type-enumeration
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/installer/family/
      - id: well-known/tool/sysadmin/

  # RECYCLER-template worms keep the drive destinations and the autorun
  # directives as printf templates (RECYCLER\%s) filled per drive letter, so
  # the compiled-line and root-target atoms never see a literal name. The
  # template directive with drive traversal, self-copy and the section header
  # is the same self-propagation shape as the sibling rules.
  - id: compiled-template-autorun-self-copy-worm
    desc: Native worm self-copies through templated autorun drives
    crit: hostile
    conf: 0.99
    for: [pe, dll]
    all:
      - id: micro-behaviors/fs/traversal/drives::logical-drive-enumeration-api-set
      - id: micro-behaviors/fs/path/config/autorun::autorun-directive-runtime-template
      - id: micro-behaviors/fs/path/config/autorun::autorun-section
      - id: micro-behaviors/fs/file/copy::copyfile-module-path-api-pair
    any:
      - id: micro-behaviors/fs/path/system::recycler-literal
      - id: micro-behaviors/fs/file/timestamp::set-file-time-with-walk-and-self-path
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/installer/family/
      - id: well-known/tool/sysadmin/

  # Drive-letter worms call GetDriveType on each letter instead of
  # GetLogicalDriveStrings, and they store `:\autorun.inf` plus an Open=
  # directive rather than a ShellExecute= template. CopyFile together with
  # the current module path is the self-copy.
  - id: drive-type-autorun-self-copy-worm
    desc: Self-copies onto drives that it classifies and autoruns
    crit: hostile
    conf: 0.98
    for: [pe, dll]
    all:
      - id: micro-behaviors/fs/traversal/drives::get-drive-type
      - id: micro-behaviors/fs/path/config/autorun::autorun-inf-string
      - id: micro-behaviors/fs/path/config/autorun::autorun-open
      - id: micro-behaviors/fs/path/config/autorun::root-autorun-config-target
      - id: micro-behaviors/fs/file/copy::copyfile-module-path-api-pair
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/installer/family/
      - id: well-known/tool/sysadmin/

  # Some native drive worms emit a Shell section that replaces both built-in
  # navigation verbs. Pair the generated directive evidence with drive
  # enumeration and file writes; the embedded strings alone are not execution.
  - id: native-open-explore-autorun-drive-worm
    desc: Native binary writes autorun that hijacks drive navigation
    crit: hostile
    conf: 0.98
    for: [pe, dll]
    all:
      - id: micro-behaviors/fs/path/config/autorun::autorun-section
      - id: micro-behaviors/fs/path/config/autorun::autorun-shell-open-verb
      - id: micro-behaviors/fs/path/config/autorun::autorun-shell-explore-verb
      - id: micro-behaviors/fs/traversal/drives::logical-drive-type-enumeration
      - id: micro-behaviors/fs/write/file/handle::write-file
