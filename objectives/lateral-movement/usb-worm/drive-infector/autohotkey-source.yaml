# Retadup-style removable-drive spreader written in AutoHotkey: enumerate
# removable drives, hide the victim's files, drop LNK lures that start both the
# worm and the original file, and copy the running script onto the media.
defaults:
  platforms: [windows]
  for: [text]
  attack: T1091,T1564.001
composite_rules:
  - id: autohotkey-hidden-shortcut-drive-worm
    desc: AutoHotkey USB self-copy with LNK lures
    crit: hostile
    conf: 0.97
    all:
      - id: micro-behaviors/fs/enumerate/drives::autohotkey-removable-drive-list
      - id: micro-behaviors/fs/file/copy/source-destination::autohotkey-running-script-copy-source
      - id: micro-behaviors/fs/attributes/flags::autohotkey-set-hidden-system-attributes
      - id: micro-behaviors/fs/file/create::autohotkey-shortcut-chained-start
