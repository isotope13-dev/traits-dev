defaults:
  platforms: [windows]
  for: [javascript, vbs]
composite_rules:
  - id: wsh-hidden-shortcut-drive-worm
    desc: Self-copy on USB drives with hidden-file lures
    crit: hostile
    conf: 0.99
    attack: T1091,T1564.001
    all:
      - id: micro-behaviors/fs/file/copy/source-destination::copyfile-selfpath-source
      - id: micro-behaviors/fs/enumerate/drives::fso-drive-enumeration
      - id: micro-behaviors/fs/enumerate/drives::drive-type-removable-check
      - id: micro-behaviors/fs/attributes/flags::script-hidden-system-mask
      - id: micro-behaviors/fs/file/create::shortcut-creates-lnk
      - id: micro-behaviors/fs/file/create::lnk-arguments-chained-cmd-start
      - id: micro-behaviors/fs/file/create::shortcut-icon-location-assign
