defaults:
  platforms: [windows]
  for: [pe]
  attack: "T1091"
  mbc: "B0017"
  size_max: 52428800

traits:
  - id: vb6-get-drive-type-w
    desc: Windows drive type query
    crit: component
    conf: 0.88
    if:
      type: symbol
      substr: GetDriveTypeW
    unless:
      - id: metadata/signed/platform::microsoft-windows
      - id: metadata/binary/metrics/threshold::many-exports-200
      - id: metadata/signed/developer::oracle-america
      - id: metadata/binary/installer/family/
      - id: objectives/evasion/self-delete/cleanup/heartbeat::advanced-inf-setup-regpath

  - id: vb6-get-disk-free-space
    desc: VB6 disk free space check GetDiskFreeSpaceExW
    crit: component
    conf: 0.86
    if:
      type: symbol
      substr: GetDiskFreeSpaceExW
    unless:
      - id: metadata/binary/metrics/threshold::many-exports-200
      - id: well-known/lib/core/psutil/
      - id: metadata/binary/installer/family/
    downgrade:
      any:
        - id: metadata/signed/platform::microsoft-corporation

composite_rules:
  # This is the P-code counterpart to the Win32 drive-API profile below.
  # It identifies a whole-file record copy loop operating alongside explicit
  # A-Z drive construction and directory enumeration.
  - id: vb6-pcode-drive-worm-propagation
    desc: VB6 p-code copies binary records across enumerated drives
    crit: hostile
    conf: 0.98
    all:
      - id: metadata/binary/framework::vb6-application-framework
      - id: micro-behaviors/data/string/assembly::vb6-pcode-a-z-character-loop
      - id: micro-behaviors/fs/file/read::vb6-pcode-binary-record-read
      - id: micro-behaviors/fs/file/write/record::vb6-pcode-repeated-binary-record-write
    any:
      - id: micro-behaviors/fs/directory/readdir::vb6-rtcdir
      - id: micro-behaviors/fs/directory/readdir::vb6-ordinal-rtcdir
    needs: 1
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/installer/family/

  - id: vb6-usb-worm-propagation
    desc: VB6 USB/removable media worm propagation
    crit: hostile
    conf: 0.93
    all:
      - id: micro-behaviors/fs/traversal/drives::get-logical-drives
      - id: vb6-get-drive-type-w
      - id: vb6-get-disk-free-space
    any:
      - id: micro-behaviors/fs/shell-ops::shell-get-special-folder-path
      - id: micro-behaviors/fs/directory/readdir::vb6-rtcdir
    needs: 2
