# This compiled AutoIt script traverses fixed and removable drives, hides each
# directory, and copies itself beside it under the directory's name plus .exe.
# The encrypted-compressed script bytes remain visible to static scanners.
defaults:
  platforms: [windows]
  for: [pe]
  attack: T1091

traits:
  - id: killfiles-autoit-script-prefix
    desc: KillFiles AutoIt script prefix fingerprint
    crit: component
    conf: 0.999
    if:
      type: hex
      pattern: '6D FB FA 03 B3 8B 08 09 B7 77 78 8E 35 E6 DC 0D 6C F2 73 BB 6C CC 1C AF E2 C0 D6 75 C4 21 07 0C'
      section: .bldvar

composite_rules:
  - id: killfiles-autoit-folder-copy-worm
    desc: AutoIt worm hides drive folders behind lookalike executables
    crit: hostile
    conf: 0.999
    all:
      - id: killfiles-autoit-script-prefix
      - id: metadata/lang/compiled::autoit-ea06-encrypted-resource
