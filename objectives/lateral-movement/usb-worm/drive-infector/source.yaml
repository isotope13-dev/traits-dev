# USB/network drive infector worm pattern in source code
# ATT&CK: T1091 (Replication Through Removable Media)
defaults:
  for: [c, cpp]
  platforms: [windows]
  attack: T1091
traits:
- id: payload-write-function
  desc: Payload write function in source
  crit: suspicious
  conf: 0.9
  if:
    type: symbol
    regex: ^Write(Payload|Virus|Worm)
# NOTE: the bare `^Infect` / `^infect_` function-name prefixes that used to live
# here matched any routine whose name merely begins with "infect" -- including
# epidemic/contagion simulation code (SIS/SIR kernels, graph "infect a
# neighbour" propagation) -- while asserting removable-media replication that
# the regex never checked, and neither hostile composite below referenced them.
# The infection-function-name vocabulary now lives with its InfectExe/InfectDir
# siblings in micro-behaviors/data/source/function/names/infection.yaml, split
# per target and tightened to require an infection TARGET noun
# (infect_file / infect_elf / InfectDirectory / infect_host).
composite_rules:
- id: usb-drive-infector-source
  desc: USB drive infection worm in source
  crit: hostile
  conf: 0.95
  all:
  - id: micro-behaviors/fs/traversal/drives::get-logical-drives
  - id: micro-behaviors/fs/traversal/drives::drive-type-removable-source
  any:
  - id: micro-behaviors/fs/file/write/direct::write-file-source
  - id: micro-behaviors/fs/memory/mmap::create-file-w-source
  - id: objectives/evasion/file-hiding/attributes::file-attribute-hidden-source
  needs: 2
  unless:
  - id: metadata/lang/source/
- id: network-drive-spreader-source
  desc: Network drive spreading in source
  crit: hostile
  conf: 0.93
  all:
  - id: micro-behaviors/fs/traversal/drives::get-logical-drives
  - id: micro-behaviors/fs/traversal/drives::drive-type-remote-source
  any:
  - id: micro-behaviors/fs/file/write/direct::write-file-source
  - id: micro-behaviors/fs/memory/mmap::create-file-w-source
  - id: objectives/evasion/file-hiding/attributes::file-attribute-hidden-source
  needs: 2
  unless:
  - id: metadata/lang/source/
  - id: metadata/lang/source/
