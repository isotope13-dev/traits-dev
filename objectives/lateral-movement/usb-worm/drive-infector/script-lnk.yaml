# LNK-replacement worm in Windows Script Host (JScript/VBScript). The worm hides
# the victim's documents and drops same-named .lnk shortcuts that launch the
# payload via `cmd /c start <payload> && start <decoy>`, so the real file still
# opens. Generic across families that use the shortcut-replacement technique on
# removable/network drives.
defaults:
  platforms: [windows]
  for: [javascript, vbs, html]
  attack: T1091
  mbc: B0017
traits:
  - id: lnk-mshta-wscript-dual-execution
    desc: LNK opens decoy and script via mshta
    crit: suspicious
    conf: 0.96
    attack: T1218.005,T1059.005
    if:
      type: text
      regex: '(?is)\bmshta(\.exe)?\b.{0,320}\bexplorer(\.exe)?\b.{0,320}\b[wc]script(\.exe)?\b'
      case_insensitive: true
composite_rules:
  - id: vbs-hidden-lnk-removable-drive-worm
    desc: VBS worm hides files behind drive shortcuts
    crit: hostile
    conf: 0.99
    for: [vbs]
    attack: T1091,T1547.009,T1564.001
    all:
      - id: micro-behaviors/fs/traversal/drives::vbs-fso-drive-enumeration
      - id: micro-behaviors/fs/traversal/drives::vbs-drive-type-removable-check
      - id: micro-behaviors/fs/file/attributes::fso-vbs-set-hidden-system-attributes
      - id: micro-behaviors/os/wsh/file::wsh-create-shortcut-vbs
      - id: micro-behaviors/os/wsh/file::shortcut-icon-location-assign
      - id: micro-behaviors/fs/write/copy::self-copy-vbs
  - id: lnk-replacement-drive-worm
    desc: LNK-replacement removable drive worm
    crit: hostile
    conf: 0.95
    all:
      - id: micro-behaviors/os/wsh/file::create-shortcut
      - id: micro-behaviors/os/wsh/file::lnk-arguments-cmd-start
    any:
      - id: micro-behaviors/fs/file/attributes::fso-set-hidden-attribute
      - id: micro-behaviors/fs/traversal/drives::fso-drive-enumeration
      - id: micro-behaviors/data/format/office/document::document-extension-literal
    needs: 1
  - id: script-lnk-drive-dual-execution
    desc: Drive LNK with decoy and script execution
    crit: suspicious
    conf: 0.97
    attack: T1091,T1059.005,T1218.005
    all:
      - id: micro-behaviors/os/wsh/file::shortcut-creates-lnk
      - id: lnk-mshta-wscript-dual-execution
    any:
      - id: micro-behaviors/os/wmi/query::query-logical-disks
      - id: micro-behaviors/fs/traversal/drives::fso-drive-enumeration
  - id: script-lnk-drive-dual-execution-worm
    desc: Hidden drive folders replaced with LNKs
    crit: hostile
    conf: 0.98
    attack: T1091,T1059.005,T1218.005,T1564.001
    all:
      - id: script-lnk-drive-dual-execution
    any:
      - id: micro-behaviors/fs/file/attributes::attrib-hidden-system
      - id: micro-behaviors/fs/write/copy::self-copy-vbs
