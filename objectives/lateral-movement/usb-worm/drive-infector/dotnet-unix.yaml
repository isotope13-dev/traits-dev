defaults:
  platforms: [unix, windows]
  for: [csharp, pe]
  attack: T1091

traits:
  - id: dotnet-removable-mount-dirs
    desc: Lists three removable-mount roots together
    crit: suspicious
    conf: 0.92
    if:
      type: text
      regex: '/media[\s\S]{0,120}/run/media[\s\S]{0,120}/removable'

  - id: dotnet-hidden-agent-copy
    desc: Drops dot-prefixed .hidden_agent.exe payload
    crit: suspicious
    conf: 0.92
    if:
      type: text
      substr: .hidden_agent.exe

  - id: dotnet-autostart-script
    desc: Drops dot-prefixed .autostart.sh launcher
    crit: suspicious
    conf: 0.9
    if:
      type: text
      substr: .autostart.sh

composite_rules:
  - id: dotnet-usb-drive-infector
    desc: .NET USB drive infector
    crit: hostile
    conf: 0.98
    all:
      - id: dotnet-removable-mount-dirs
      - id: dotnet-hidden-agent-copy
      - id: dotnet-autostart-script

  - id: dotnet-pe-usb-drive-infector
    desc: .NET PE USB drive infector
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/fs/path/location::media-mount-path
      - id: micro-behaviors/fs/path/location::removable-mount-path
      - id: dotnet-hidden-agent-copy
      - id: dotnet-autostart-script
