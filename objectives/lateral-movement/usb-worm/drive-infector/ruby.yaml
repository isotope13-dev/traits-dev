defaults:
  platforms: [unix]
  for: [ruby]
  attack: T1091
  crit: notable
  conf: 0.9
traits:
  - id: ruby-read-current-file
    desc: Reads the current Ruby source
    if:
      type: text
      regex: 'File\.read\(\s*__FILE__\s*\)'
  - id: ruby-removable-volume-root
    desc: Names a removable volume root
    if:
      type: text
      regex: '/(Volumes|mnt/usb|media/usb)\b'
  - id: ruby-write-payload-variable
    desc: Writes a payload variable to disk
    if:
      type: text
      regex: 'File\.write\([^,\n]{0,80},\s*\w*payload\b'
composite_rules:
  - id: ruby-volume-self-copy-worm
    desc: Copies itself onto a mounted volume
    crit: hostile
    conf: 0.96
    near_lines: 40
    all:
      - id: ruby-read-current-file
      - id: ruby-removable-volume-root
      - id: ruby-write-payload-variable
