defaults:
  platforms: [unix]
  for: [ruby]
  attack: T1091
  crit: notable
  conf: 0.9
traits:
  - id: ruby-write-payload-variable
    desc: Writes a payload variable to disk
    if:
      type: text
      regex: 'File\.write\([^,\n]{0,80},\s*\w*payload\b'
composite_rules:
  - id: ruby-volume-self-copy-worm
    desc: Copies itself onto a mounted volume
    crit: hostile
    conf: 0.96
    near_lines: 40
    all:
      - id: micro-behaviors/fs/read/file/target::ruby-read-current-file
      - id: micro-behaviors/fs/path/location::volume-mount-root-path
      - id: ruby-write-payload-variable
