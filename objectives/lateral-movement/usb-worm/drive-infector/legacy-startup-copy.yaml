defaults:
  for: [ne]
  platforms: [windows]
  attack: T1091,T1547.001

traits:
  - id: legacy-drive-startup-copy-loop
    desc: Legacy program copies into drive startup paths
    crit: hostile
    conf: 0.98
    if:
      type: yara
      source: |
        rule legacy_drive_startup_copy_loop {
          strings:
            $startup = /[a-z]:\\windows\\startm~1\\programs\\startup\\[a-z0-9]{1,12}\.exe/ ascii nocase
            $drive_loop = { C6 86 ?? ?? 43 E9 ?? ?? 80 86 ?? ?? 01 8A 86 ?? ?? 98 3D 5B 00 }
          condition:
            uint16(0) == 0x5a4d and #startup >= 3 and $drive_loop
        }
