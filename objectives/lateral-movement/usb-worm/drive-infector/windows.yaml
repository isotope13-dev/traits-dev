defaults:
  crit: hostile
  conf: 0.95
  for: [pe]
  platforms: [windows]
  attack: T1091
  mbc: B0017

composite_rules:
  - id: pe-removable-drive-infector
    desc: PE infects removable/network drives
    size_max: 536870912
    all:
      - id: micro-behaviors/fs/enumerate/drives::get-logical-drive-strings
      - id: micro-behaviors/fs/traversal/drives::get-drive-type
      - id: micro-behaviors/fs/directory/readdir::find-file-walker-wide
      - id: micro-behaviors/process/create/thread::create-thread
      - id: micro-behaviors/fs/write/file/handle::write-file
    any:
      - id: objectives/impact/infect/binary/rewrite::cts-prepending-pe-infector
      - id: objectives/impact/infect/binary/rewrite::cts-trailer-marker
      - id: micro-behaviors/os/random/generator::crypt-gen-random
    needs: 2
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/installer/family/
  # Packed builds hide the import-level drive/file APIs the composites above
  # require, so those chains stay dark while the worm kit (drive enumeration
  # text, shortcut/exe twin names, self-delete fragments) ships in the open.
  - id: packed-drive-worm-dropper-kit
    desc: Packed PE carries drive-worm shortcut dropper kit
    conf: 0.96
    attack: T1091,T1027.002
    all:
      - id: metadata/build/protector::executable-packer-references
      - id: micro-behaviors/fs/traversal/drives::get-logical-drives-text
    any:
      - id: metadata/file/string/file::desktop-ini-filename
      - id: micro-behaviors/fs/path/extension::lnk-extension-reference
      - id: micro-behaviors/fs/delete/file/command::slash-c-del-fragment
    needs: 2
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/installer/family/
  - id: logical-drive-copy-worm
    desc: Logical-drive copy worm workflow
    size_max: 1048576
    all:
      - id: micro-behaviors/fs/traversal/drives::logical-drive-enumeration
      - id: micro-behaviors/fs/traversal/drives::get-drive-type
      - id: micro-behaviors/fs/directory/readdir::find-file-walker
      - id: micro-behaviors/fs/file/copy::windows-shell-copy-command
    any:
      - id: micro-behaviors/os/registry/write::reg-add-run-command
      - id: micro-behaviors/process/create/shell/command-mode::cmd-exe-c-command
      - id: micro-behaviors/process/create/exec::create-process-a
    downgrade:
      any:
        - id: metadata/signed/platform/
        - id: metadata/binary/installer/family/
