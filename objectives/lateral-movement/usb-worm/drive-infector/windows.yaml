defaults:
  crit: hostile
  conf: 0.95
  for: [pe]
  platforms: [windows]
  attack: T1091
  mbc: B0017

composite_rules:
  - id: pe-removable-drive-infector
    desc: PE infects removable/network drives
    size_max: 536870912
    all:
      - id: micro-behaviors/fs/enumerate/drives::get-logical-drive-strings
      - id: micro-behaviors/fs/traversal/drives::get-drive-type
      - id: micro-behaviors/fs/directory/readdir::find-file-walker-wide
      - id: micro-behaviors/process/create/thread::create-thread
      - id: micro-behaviors/fs/write/file/handle::write-file
    any:
      - id: objectives/impact/infect/binary/rewrite::cts-prepending-pe-infector
      - id: objectives/impact/infect/binary/rewrite::cts-trailer-marker
      - id: micro-behaviors/os/random/generator::crypt-gen-random
    needs: 2
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/installer/family/
  - id: logical-drive-copy-worm
    desc: Logical-drive copy worm workflow
    size_max: 1048576
    all:
      - id: micro-behaviors/fs/traversal/drives::logical-drive-enumeration
      - id: micro-behaviors/fs/directory/readdir::find-file-walker-any-variant
    any:
      - id: micro-behaviors/fs/traversal/drives::get-drive-type
      - id: micro-behaviors/fs/file/handle::device-io-control-win
      - id: micro-behaviors/fs/enumerate/volume::get-disk-free-space
      - id: micro-behaviors/fs/file/copy::windows-shell-copy-command
      - id: micro-behaviors/fs/file/copy::copyfile-w
      - id: micro-behaviors/os/registry/write::reg-add-run-command
      - id: micro-behaviors/process/create/shell/command-mode::cmd-exe-c-command
      - id: micro-behaviors/process/create/exec::create-process-a
    needs: 3
    downgrade:
      any:
        - id: metadata/signed/platform/
        - id: metadata/binary/installer/family/
  - id: copy-worm-explorer-pe-target-scan
    desc: Copy worm hides Explorer UI and scans for PE
    crit: hostile
    conf: 0.97
    attack: T1091,T1564.001
    size_max: 1048576
    all:
      - id: micro-behaviors/os/registry/explorer::hide-file-ext-value
      - id: micro-behaviors/os/registry/explorer::hidden-files-value
      - id: micro-behaviors/data/format/pe-parser::inline-mz-magic-check
      - id: metadata/binary/instruction/operand::mz-words-in-code
      - id: micro-behaviors/fs/file/copy::copyfile-w
  - id: hidden-drive-copy-and-cleanup-worm
    desc: Copies an executable to enumerated drives and hides or removes files
    crit: hostile
    conf: 0.98
    attack: T1091,T1564.001
    size_max: 1048576
    all:
      - id: micro-behaviors/fs/enumerate/drives::get-logical-drive-strings
      - id: micro-behaviors/fs/file/copy::copyfile-w
      - id: micro-behaviors/os/registry/explorer::superhidden-visibility-values
      - id: micro-behaviors/os/registry/explorer::hide-file-ext-value
      - id: micro-behaviors/fs/delete/file/command::slash-c-del-fragment
      - id: micro-behaviors/process/create/shell/command-mode::cmd-exe-c-command-text
