defaults:
  crit: hostile
  conf: 0.95
  for: [pe]
  platforms: [windows]
  attack: T1091
  mbc: B0017

composite_rules:
  - id: pe-removable-drive-infector
    desc: PE infects removable/network drives
    size_max: 536870912
    all:
      - id: micro-behaviors/fs/enumerate/drives::get-logical-drive-strings
      - id: micro-behaviors/fs/enumerate/drives::get-drive-type
      - id: micro-behaviors/fs/directory/readdir/native::find-file-walker-wide
      - id: micro-behaviors/process/thread/create::create-thread
      - id: micro-behaviors/fs/write/file/handle::write-file
    any:
      - id: objectives/impact/infect/binary/rewrite::cts-prepending-pe-infector
      - id: objectives/impact/infect/binary/rewrite::cts-trailer-marker
      - id: micro-behaviors/os/random/generator::crypt-gen-random
    needs: 2
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/installer/family/
  # The PE parser can belong to an unrelated parasitic loader. Require the
  # hidden-path/self-copy relationship, rather than inferring a worm from
  # Explorer value names, copying APIs and command text alone.
  - id: drive-enumerating-hidden-path-copy-worm
    desc: Hidden-path self-copy worm with drive enumeration
    crit: hostile
    conf: 0.98
    attack: T1091,T1564.001
    size_max: 1048576
    all:
      - id: objectives/evasion/masquerade/file/name::x86-hidden-path-exe-self-copy
      - id: micro-behaviors/fs/enumerate/drives::get-logical-drive-strings
      - id: micro-behaviors/os/registry/explorer::hide-file-ext-value
