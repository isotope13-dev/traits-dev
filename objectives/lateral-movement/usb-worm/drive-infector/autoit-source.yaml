# Self-copy and autorun-copy observations corroborate drive propagation.
defaults:
  platforms: [windows]
  for: [text]
  attack: T1091

composite_rules:
  - id: autoit-removable-drive-spreader
    desc: AutoIt source spreads its image across enumerated drives
    crit: hostile
    conf: 0.97
    all:
      - id: micro-behaviors/fs/enumerate/drives::autoit-drive-enumeration-source
      - id: micro-behaviors/fs/file/copy::autoit-running-image-copy-source
      - id: micro-behaviors/os/autorun/control::autoit-autorun-inf-copy-source
