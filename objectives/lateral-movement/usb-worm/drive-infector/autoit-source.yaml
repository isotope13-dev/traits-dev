# AutoIt source that enumerates local drives and propagates a copied running
# image with a hidden autorun configuration. The network variant enumerates
# the Windows WorkgroupCrawler share cache and copies the same payload there.
defaults:
  platforms: [windows]
  for: [text]
  attack: T1091

traits:
  - id: autoit-drive-enumeration-source
    desc: AutoIt source enumerates drives for propagation
    crit: notable
    conf: 0.96
    if:
      type: text
      regex: '(?i)\bDriveGetDrive\s*\('

  - id: autoit-share-cache-enumeration-source
    desc: AutoIt source enumerates network shares
    crit: notable
    conf: 0.96
    if:
      type: text
      regex: '(?is)RegEnumKey\s*\([^\r\n]{0,180}WorkgroupCrawler\\Shares'

  - id: autoit-autorun-payload-copy-source
    desc: AutoIt source copies autorun to drives
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: '(?is)FileCopy\s*\([^\r\n]{0,180}autorun\.ini[^\r\n]{0,180}autorun\.inf'

composite_rules:
  - id: autoit-removable-drive-spreader
    desc: AutoIt source spreads its image across enumerated drives
    crit: hostile
    conf: 0.97
    all:
      - id: autoit-drive-enumeration-source
      - id: micro-behaviors/fs/file/copy::autoit-running-image-copy-source
      - id: autoit-autorun-payload-copy-source

  - id: autoit-network-share-spreader
    desc: AutoIt source copies its image to enumerated network shares
    crit: hostile
    conf: 0.97
    all:
      - id: autoit-share-cache-enumeration-source
      - id: micro-behaviors/fs/file/copy::autoit-running-image-copy-source
      - id: autoit-autorun-payload-copy-source
