# A removable-drive worm that moves existing user files, leaves a hidden copy
# of its own executable, and compiles replacement launchers from embedded
# source. Require the full propagation and wrapper-building chain so ordinary
# drive inventory, file copying, or runtime compilation does not qualify.
defaults:
  platforms: [windows]
  attack: T1091
  mbc: B0017

composite_rules:
  - id: dotnet-removable-drive-runtime-file-infector
    desc: .NET worm compiles launchers while replacing files on removable drives
    crit: hostile
    conf: 0.98
    for: [csharp]
    all:
      - id: micro-behaviors/fs/enumerate/drives::dotnet-drive-enumeration
      - id: micro-behaviors/fs/enumerate/drives::dotnet-drive-type-reference
      - id: micro-behaviors/fs/directory/readdir/language::get-files
      - id: micro-behaviors/fs/directory/readdir/language::get-directories
      - id: micro-behaviors/fs/file/rename::file-move-source
      - id: micro-behaviors/fs/file/copy/source-destination::running-executable-copy
      - id: micro-behaviors/fs/file/attributes::hidden-attribute-usage
      - id: micro-behaviors/metaprogramming/generation/compile::compile-assembly-from-source-ref
      - id: micro-behaviors/data/decode/embedded/base64::dotnet-long-base64-literal-decode
