# pIRCh IRC worm spread: the payload rewrites the client's events.ini so it
# DCC-sends a self-copy planted beside it to everyone joining a channel.
# Each leg alone is weaker -- an events.ini reference can be documentation,
# and a self-copy is an ordinary installer step; together they install a
# spreading worm into the chat client.
defaults:
  platforms: [windows]
  attack: T1105
composite_rules:
  - id: pirch-self-copy-worm
    desc: Script plants its self-copy beside the pIRCh events config
    crit: hostile
    conf: 0.95
    all:
      - id: micro-behaviors/fs/path/config/app::pirch-events-config
      - id: micro-behaviors/fs/write/copy::self-copy-vbs
