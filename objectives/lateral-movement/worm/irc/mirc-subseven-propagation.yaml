defaults:
  for: [mirc]
  platforms: [windows]
  attack: T1021,T1105

traits:
  - id: mirc-subseven-ftp-enable
    desc: Sends SubSeven FTP enable command
    crit: notable
    conf: 0.96
    if:
      type: text
      substr: 'FTPenable!'
  - id: mirc-subseven-ftp-disable
    desc: Sends SubSeven FTP disable command
    crit: notable
    conf: 0.96
    if:
      type: text
      substr: FTPdisable
  - id: mirc-subseven-execute-vbs
    desc: Sends SubSeven command to execute VBScript
    crit: notable
    conf: 0.96
    if:
      type: text
      regex: '(?i)sockwrite[^\n]{0,120}\sFMX[^\s|]{1,120}\.vbs'
  - id: mirc-subseven-port-scan
    desc: Opens socket to SubSeven service port
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: '(?i)%[A-Za-z0-9_.]+\s*=\s*27374[^\n]{0,180}sockopen'

composite_rules:
  - id: mirc-subseven-ftp-vbs-propagation
    desc: IRC script uses SubSeven FTP and executes VBScript
    crit: hostile
    conf: 0.98
    all:
      - id: mirc-subseven-ftp-enable
      - id: mirc-subseven-ftp-disable
      - id: mirc-subseven-execute-vbs
      - id: mirc-subseven-port-scan
