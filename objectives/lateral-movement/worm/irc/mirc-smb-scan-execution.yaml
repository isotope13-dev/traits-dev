defaults:
  for: [mirc]
  platforms: [windows]
  attack: T1021,T1018

traits:
  - id: mirc-multi-target-smb-open
    desc: Opens multiple sockets to SMB port
    crit: notable
    conf: 0.96
    if:
      type: text
      regex: '(?i)sockopen\s+ip[0-9]+\s+%ip[0-9]+\s+445'
  - id: mirc-smb-open-launches-helper
    desc: Successful socket opens launch batch helper
    crit: notable
    conf: 0.96
    if:
      type: text
      regex: '(?i)\brun\s+[^\s]{1,120}\.exe\s+[^\n]{0,100}\.bat\s+%[0-9]+'
  - id: mirc-infection-attempt-status
    desc: Reports attempts to infect discovered host
    crit: notable
    conf: 0.95
    if:
      type: text
      substr: 'attempting to infect'

composite_rules:
  - id: mirc-smb-scan-infection-helper
    desc: IRC script scans SMB and launches infection helper
    crit: hostile
    conf: 0.98
    all:
      - id: mirc-multi-target-smb-open
      - id: mirc-smb-open-launches-helper
      - id: mirc-infection-attempt-status
