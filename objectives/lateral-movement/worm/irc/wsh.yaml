defaults:
  for:
    - "vbs"
  platforms:
    - "windows"
composite_rules:
  - id: "wsh-selfcopy-irc-join-propagation"
    desc: "Self-copying script sends a script copy to IRC channel joiners"
    crit: "hostile"
    conf: 0.97
    all:
      - id: micro-behaviors/communications/irc/handler::mirc-script-event-join
      - id: micro-behaviors/communications/irc/command::mirc-dcc-send-executable
      - id: objectives/impact/infect/script/self-copy::wsh-rewrite-files-from-self
