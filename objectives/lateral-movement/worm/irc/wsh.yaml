defaults:
  for:
    - "vbs"
  platforms:
    - "windows"
traits:
  - id: wsh-writes-mirc-script-ini
    desc: WSH script writes an mIRC script.ini
    for: [javascript, vbs]
    crit: notable
    conf: 0.93
    attack: T1105
    if:
      type: text
      regex: '(?i)CreateTextFile\s*\([^)\r\n]{0,60}script\.ini'

composite_rules:
  - id: "wsh-selfcopy-irc-join-propagation"
    desc: "Self-copying script sends a script copy to IRC channel joiners"
    crit: "hostile"
    conf: 0.97
    all:
      - id: micro-behaviors/communications/irc/handler::mirc-script-event-join
      - id: micro-behaviors/communications/irc/command::mirc-dcc-send-executable
      - id: objectives/impact/infect/script/self-copy::wsh-rewrite-files-from-self
  # JScript worms hide the `$` of `$nick` behind unescape("%24"), so the
  # executable-send leg above never sees a literal `$nick`; the join handler
  # and DCC send written into script.ini are the spreading mechanism.
  - id: "wsh-js-mirc-script-ini-join-dcc-spread"
    desc: "JScript writes mIRC script that sends files to channel joiners"
    for:
      - "javascript"
    crit: "hostile"
    conf: 0.95
    attack: T1105
    near_lines: 10
    all:
      - id: wsh-writes-mirc-script-ini
      - id: micro-behaviors/communications/irc/handler::mirc-script-event-join
      - id: micro-behaviors/communications/irc/command::mirc-dcc-send-command
