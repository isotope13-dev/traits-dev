defaults:
  for: [mirc]
  platforms: [windows]
  attack: T1105,T1027

traits:
  - id: mirc-join-event-source
    desc: mIRC handler responds to channel joins
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: '(?i)on\s+[^\n]{1,20}:join:#:'
  - id: mirc-dcc-send-token-definition
    desc: Script stores a send command token
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: '(?im)^n[0-9]+=%[A-Za-z0-9_]+\s+%[A-Za-z0-9_]+\s+send\s*$'
  - id: mirc-write-script-ini
    desc: Writes a replacement mIRC script
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: '(?i)\bwrite\s+-l[0-9]+\s+script\.ini'
  - id: mirc-load-script-ini
    desc: Loads mIRC script from script.ini
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: '(?i)\bload\s+-rs\s+script\.ini'
  - id: mirc-obfuscated-dcc-token
    desc: Obfuscation removes padding from DCC token
    crit: notable
    conf: 0.97
    if:
      type: text
      substr: '$remove(e.edecec,e)'
  - id: mirc-obfuscated-script-token
    desc: Obfuscation reconstructs script.ini token
    crit: notable
    conf: 0.97
    if:
      type: text
      substr: '$remove(slclrlilpltl.lilnlil,l)'
  - id: mirc-replicating-message-decode
    desc: Message contains encoded copy of own script
    crit: notable
    conf: 0.96
    if:
      type: text
      regex: '(?i)\.msg\s+\$nick[^\n]{0,120}\$encode\s*\(\s*\$read\s*\(\s*\$script'
  - id: mirc-replicating-message-load
    desc: Message asks recipient to load script
    crit: notable
    conf: 0.96
    if:
      type: text
      regex: '(?i)\.load\s+-rs\s+[A-Za-z0-9_.-]+'

composite_rules:
  - id: mirc-join-script-rewrite-propagation
    desc: Join handler rewrites and sends its IRC script
    crit: hostile
    conf: 0.98
    all:
      - id: mirc-join-event-source
      - id: mirc-dcc-send-token-definition
      - id: mirc-write-script-ini
      - id: mirc-load-script-ini
  - id: mirc-obfuscated-join-script-spread
    desc: Obfuscated join handler reconstructs DCC script spread
    crit: hostile
    conf: 0.98
    all:
      - id: mirc-join-event-source
      - id: mirc-obfuscated-dcc-token
      - id: mirc-obfuscated-script-token
  - id: mirc-encoded-self-copy-message
    desc: IRC message induces recipient to load encoded self-copy
    crit: hostile
    conf: 0.98
    all:
      - id: mirc-replicating-message-decode
      - id: mirc-replicating-message-load
