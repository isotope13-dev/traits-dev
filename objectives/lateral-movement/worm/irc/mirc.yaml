defaults:
  crit: hostile
  platforms: [unix, windows]
  for: [mirc, ircii, scripts, binaries, objectivec, lua, data, dos_com]
  attack: T1105
traits:
  - id: mirc-direct-update-pitch
    desc: IRC message pitches a client update file
    for: [mirc, ircii]
    crit: notable
    conf: 0.92
    if:
      type: text
      regex: '(?i)\bmsg[ \t]+\$nick\b.{0,80}\b(new update|accept the file)\b.{0,96}\bmirc\b'
  - id: mirc-direct-executable-look-link
    desc: IRC message pitches executable as content
    for: [mirc, ircii]
    crit: notable
    conf: 0.93
    if:
      type: text
      regex: '(?i)\bmsg\s+\$nick\b.{0,54}(look at|check out).{0,60}https?://\S{1,240}\.(exe|scr|pif)\b'
composite_rules:
  - id: mirc-worm
    near_lines: 1
    desc: mIRC JOIN handler sends script.ini to another user
    all:
      - id: micro-behaviors/communications/irc/command::mirc-join-handler-dcc-send
      - id: micro-behaviors/communications/irc/command::mirc-dcc-send-script-ini
  - id: mirc-worm-block
    near_lines: 3
    desc: mIRC JOIN/PART handler block sends script.ini to another user
    all:
      - id: micro-behaviors/communications/irc/handler::mirc-join-part-block-handler
      - id: micro-behaviors/communications/irc/command::mirc-dcc-send-script-ini
  - id: mirc-join-dcc-executable-worm
    near_lines: 1
    desc: mIRC JOIN handler sends executable to another user
    conf: 0.96
    all:
      - id: micro-behaviors/communications/irc/command::mirc-join-handler-dcc-send
      - id: micro-behaviors/communications/irc/command::mirc-dcc-send-executable
  - id: mirc-join-block-dcc-executable-worm
    near_lines: 3
    desc: mIRC JOIN/PART handler block sends executable to another user
    conf: 0.96
    all:
      - id: micro-behaviors/communications/irc/handler::mirc-join-part-block-handler
      - id: micro-behaviors/communications/irc/command::mirc-dcc-send-executable
  - id: mirc-join-dcc-client-update-lure
    desc: IRC join handler pitches a client update and sends an archive
    for: [mirc, ircii]
    near_lines: 4
    conf: 0.95
    all:
      - id: micro-behaviors/communications/irc/handler::mirc-join-part-block-handler
      - id: micro-behaviors/communications/irc/command::mirc-dcc-send-peer-archive
      - id: mirc-direct-update-pitch
  - id: mirc-join-executable-link-lure
    desc: IRC join handler disguises executable download as content
    for: [mirc, ircii]
    near_lines: 4
    conf: 0.94
    all:
      - id: micro-behaviors/communications/irc/handler::mirc-join-part-block-handler
      - id: mirc-direct-executable-look-link
