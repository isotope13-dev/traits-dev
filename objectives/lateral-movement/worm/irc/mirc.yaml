defaults:
  crit: hostile
  platforms: [unix, windows, macos]
  for: [mirc, ircii, scripts, binaries, objectivec, lua, data, dos_com]
  attack: T1105
composite_rules:
  - id: mirc-worm
    near_lines: 1
    desc: mIRC JOIN handler sends script.ini to another user
    all:
      - id: micro-behaviors/communications/transfer::mirc-join-handler-dcc-send
      - id: micro-behaviors/communications/transfer::mirc-dcc-send-script-ini
  - id: mirc-worm-block
    near_lines: 3
    desc: mIRC JOIN/PART handler block sends script.ini to another user
    all:
      - id: micro-behaviors/communications/transfer::mirc-join-part-block-handler
      - id: micro-behaviors/communications/transfer::mirc-dcc-send-script-ini
