defaults:
  platforms: [windows]
  for: [html]
traits:
  - id: htmlhelp-document-self-path
    desc: Retrieves containing HTML Help file path
    crit: baseline
    if:
      type: text
      regex: '(?i)mk:@MSITStore:'
  - id: mirc-help-event-send
    desc: IRC event handler sends Help file
    crit: notable
    if:
      type: text
      regex: '(?i)on\s+\d+:(join|part):[^\r\n]{0,180}[./]dcc\s+send\s+\$nick[^\r\n]{0,160}\.chm'
  - id: outlook-address-attachment-send
    desc: Outlook sends attachment to address book
    crit: notable
    if:
      type: text
      regex: '(?i)AddressEntries[^\r\n]{0,160}[\s\S]{0,900}\.Attachments\.Add\s+\w+[\s\S]{0,900}\.Send\b'
  - id: outlook-help-attachment
    desc: Outlook message attaches Help file
    crit: notable
    if:
      type: text
      regex: '(?i)\.Attachments\.Add\s+"[^"\r\n]{1,180}\.chm"'
  - id: outlook-address-entries-loop
    desc: Enumerates Outlook address entries
    crit: notable
    if:
      type: text
      regex: '(?i)For\s+\w+\s*=\s*\d+\s+To\s+\w+\.AddressEntries\.Count'
composite_rules:
  - id: htmlhelp-outlook-addressbook-worm
    desc: Sends Help file to Outlook contacts
    crit: hostile
    conf: 0.98
    all:
      - id: outlook-help-attachment
      - id: outlook-address-entries-loop
      - id: micro-behaviors/os/com/outlook::html-outlook-application-progid
      - id: micro-behaviors/os/com/outlook::outlook-mail-send-call
  - id: htmlhelp-self-mail-irc-worm
    desc: Help document spreads via IRC and Outlook
    crit: hostile
    conf: 0.99
    all:
      - id: htmlhelp-document-self-path
      - id: mirc-help-event-send
      - id: outlook-address-attachment-send
