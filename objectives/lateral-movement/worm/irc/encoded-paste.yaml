defaults:
  platforms: [windows]
  for: [mirc, text]
composite_rules:
  - id: mirc-self-copy-message-worm
    desc: JOIN handler sends encoded self-install commands
    crit: hostile
    conf: 0.99
    all:
      - id: micro-behaviors/fs/write/file/append::mirc-write-join-handler
      - id: micro-behaviors/data/encode/base64::mirc-encode-own-script-line
      - id: micro-behaviors/communications/messaging/send::mirc-msg-event-nick
      - id: micro-behaviors/os/module/load::mirc-load-remote-script
