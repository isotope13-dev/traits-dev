defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]

composite_rules:
  # Inference from a tightly bounded combination, not a proof that every
  # cloned repository was modified or that a registry accepted publication.
  # No TruffleHog, writable-package helper name, version-bump helper name or
  # attacker-selected sidecar filename is needed for this propagation path.
  - id: self-copying-npm-hook-publisher
    desc: Credential-exporting npm publisher rewrites install hooks
    crit: hostile
    conf: 0.96
    attack: T1195.002
    near_bytes: 2048
    all:
      - id: micro-behaviors/fs/file/copy/source-destination::node-copy-current-module
      - id: micro-behaviors/os/package-manager/hook-install::javascript-install-hook-assignment
      - id: micro-behaviors/fs/write/file/content::json-stringify-write-sync
      - id: micro-behaviors/os/package-manager/publish::npm-publish-command
      - id: micro-behaviors/revision-control/git/read::git-remote-url-capture
      - id: micro-behaviors/revision-control/git/transfer::node-git-clone-argv
      # Self-bootstrapping release tooling can share every ordinary operation
      # above. Require credential export as the independent malicious act.
      # This flow already requires an actual .npmrc read; a separate path/read
      # proximity gate would add no role and would lose renamed fs bindings.
      - id: objectives/exfiltration/stealer/credential::npmrc-data-http-body-export

  # The propagation act without the theft half: the running script copies
  # itself into a package, assigns that copy to an install lifecycle hook and
  # publishes. Release tooling publishes and scaffolders assign hooks, but
  # neither installs its own running file as the next package's install-time
  # payload. No exfiltration, git or manifest-variable-name leg is required, so
  # a variant that only spends a harvested token still lands here.
  - id: self-replicating-npm-install-hook
    desc: Plants itself as install hook and republishes
    crit: hostile
    conf: 0.95
    attack: T1195.002,T1080
    near_bytes: 2048
    all:
      - id: micro-behaviors/fs/file/copy/source-destination::node-copy-current-module
      - id: micro-behaviors/os/package-manager/hook-install::javascript-install-hook-assignment
      - id: micro-behaviors/os/package-manager/publish::npm-publish-command
