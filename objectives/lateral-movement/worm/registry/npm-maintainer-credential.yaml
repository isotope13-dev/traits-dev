# A worm that spreads through the npm maintainer graph.
#
# The three legs describe one propagation cycle rather than three separate
# misdeeds. It fetches TruffleHog — a real secret-scanning tool, pointed at the
# victim rather than run for them — and sweeps the machine against a list of
# developer-credential patterns; it enumerates the packages and maintainers
# reachable from whatever it finds; and, holding a publish token, it has
# everything needed to push itself into the next package. That is what turns a
# single compromised release into a self-sustaining one: each infected
# developer's tokens buy the next set of packages.
#
# This lives in lateral-movement rather than with the credential stealers
# because of where the stolen material goes. A stealer sends secrets to the
# operator and stops. This spends them locally to reach new hosts, so the
# defining property is propagation, not theft — and the theft half is already
# detected on its own by the multi-source stealer rules. Requiring maintainer
# enumeration alongside them is what says the loot is being used to spread,
# which is the fact those rules cannot state.
#
# Keyed on the capability triple rather than on the campaign's infrastructure or
# the marker strings of any one TruffleHog release, so a rebuilt bundle with
# fresh hosts still lands here.
#
# Worked example: the `bundle.js` shipped identically by the compromised
# `airchief`, `airpilot` and `ace-colorpicker-rpk` releases, where all three
# legs fire on the member but nothing convicted the package.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  attack: T1195.002,T1552.001,T1078
  mbc: B0024

composite_rules:
  - id: npm-maintainer-credential-worm
    desc: Republishes maintainer packages using harvested credentials
    crit: hostile
    conf: 0.95
    all:
      - id: well-known/tool/detection/sast::trufflehog-release-url
      - id: micro-behaviors/os/package-manager/management::npm-maintainer-package-enumeration
      - id: objectives/exfiltration/stealer/credential/multi-source::node-dev-secret-regex-list
      - id: micro-behaviors/os/package-manager/publish::js-npm-publish-template-command
