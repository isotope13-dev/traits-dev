defaults:
  platforms: [windows]
  for: [pe, dll, c, cpp]
  attack: T1021.002
traits:
- id: scm-wormlet-vocabulary--rx-1
  desc: Regex component marker
  crit: suspicious
  conf: 0.96
  count_min: 3
  if:
    type: text
    word: scm_wormlet
- id: scm-wormlet-vocabulary--rx-1--alt-2
  desc: Regex component marker
  crit: suspicious
  conf: 0.96
  count_min: 3
  if:
    type: text
    word: scm_copy_payload
- id: scm-wormlet-vocabulary--rx-2
  desc: Regex component marker
  crit: suspicious
  conf: 0.96
  count_min: 3
  if:
    type: text
    word: propagate_system
- id: scm-wormlet-vocabulary--rx-2--alt-2
  desc: Regex component marker
  crit: suspicious
  conf: 0.96
  count_min: 3
  if:
    type: text
    word: install_worm
- id: scm-wormlet-vocabulary--rx-3
  desc: Regex component marker
  crit: suspicious
  conf: 0.96
  count_min: 3
  if:
    type: text
    word: start_worm
- id: scm-wormlet-vocabulary--rx-3--alt-2
  desc: Regex component marker
  crit: suspicious
  conf: 0.96
  count_min: 3
  if:
    type: text
    word: worm_install_failure_action
composite_rules:
- id: smb-scm-service-worm
  desc: SMB SCM service worm
  crit: hostile
  conf: 0.98
  all:
  - id: scm-wormlet-vocabulary
  any:
  - id: micro-behaviors/fs/path/reference::admin-share-executable-path
  - id: objectives/lateral-movement/smb::smb-share-propagation-primitives
  - id: micro-behaviors/os/service/control::service-admin-import-cluster
  - id: micro-behaviors/os/service/create::create-service
- id: scm-wormlet-vocabulary
  desc: SCM wormlet propagation vocabulary
  crit: suspicious
  conf: 0.96
  any:
  - id: scm-wormlet-vocabulary--rx-1
  - id: scm-wormlet-vocabulary--rx-1--alt-2
  - id: scm-wormlet-vocabulary--rx-2
  - id: scm-wormlet-vocabulary--rx-2--alt-2
  - id: scm-wormlet-vocabulary--rx-3
  - id: scm-wormlet-vocabulary--rx-3--alt-2
