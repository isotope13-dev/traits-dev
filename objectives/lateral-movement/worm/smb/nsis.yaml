defaults:
  for: [text, batch]
  platforms: [windows]
traits:
  - id: nsis-share-self-copy
    desc: Copies installer image to remote shares
    crit: suspicious
    if:
      type: text
      regex: 'xcopy /y /d "\$EXEPATH" "\\\\![a-zA-Z]!\\%[a-zA-Z]\\\$EXEFILE"'
      case_insensitive: true
  - id: nsis-network-host-discovery
    desc: Discovers peers through shares and ARP
    crit: notable
    if:
      type: text
      regex: 'net view\^\|.{1,60}arp -a'
      case_insensitive: true
composite_rules:
  - id: nsis-network-share-self-propagation
    desc: Installer discovers peers and copies itself to their shares
    crit: hostile
    conf: 0.99
    attack: T1021.002,T1570
    all:
      - id: nsis-share-self-copy
      - id: nsis-network-host-discovery
    near_lines: 2
