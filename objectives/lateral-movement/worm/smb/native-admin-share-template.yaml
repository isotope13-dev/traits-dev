defaults:
  for: [pe, dll]
  platforms: [windows]
  attack: T1021.002

composite_rules:
  - id: native-admin-share-self-copy-worm
    desc: Native worm copies payload to host admin shares
    crit: hostile
    conf: 0.97
    attack: T1021.002,T1091
    all:
      - id: micro-behaviors/fs/path/reference::admin-share-drive-root-template
      - id: micro-behaviors/fs/path/reference::ipc-share-template
      - id: micro-behaviors/fs/path/config/autorun::autorun-inf-string
      - id: micro-behaviors/network/share::wnet-add-connection
    unless:
      - id: metadata/signed/platform/
      - id: well-known/tool/sysadmin/
