defaults:
  for: [pe, dll]
  platforms: [windows]
  attack: T1021.002

traits:
  - id: admin-share-drive-root-template
    desc: Per-host administrative share path template
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: '\\\\%s\\(admin\$|[A-Z]\$)\\[\w.-]{1,40}\.exe'
      case_insensitive: true

  - id: ipc-share-template
    desc: Per-host IPC$ share path template
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: '\\\\%s\\ipc\$'
      case_insensitive: true

  - id: ravmond-process-name
    desc: Names Rising antivirus monitor process
    crit: notable
    conf: 0.95
    if:
      type: text
      exact: ravmond.exe
      case_insensitive: true

  - id: qihoo-tray-process-name
    desc: Names Qihoo 360 tray process
    crit: notable
    conf: 0.95
    if:
      type: text
      exact: 360tray.exe
      case_insensitive: true

composite_rules:
  - id: native-admin-share-self-copy-worm
    desc: Native worm copies payload to host admin shares
    crit: hostile
    conf: 0.97
    attack: T1021.002,T1091
    all:
      - id: admin-share-drive-root-template
      - id: ipc-share-template
      - id: micro-behaviors/fs/path/config/autorun::autorun-inf-string
      - id: micro-behaviors/os/network/share::wnet-add-connection
    unless:
      - id: metadata/signed/platform/
      - id: well-known/tool/sysadmin/

  - id: native-worm-av-process-kill
    desc: Worm with admin shares names AV processes
    crit: hostile
    conf: 0.95
    attack: T1562.001
    all:
      - id: admin-share-drive-root-template
      - id: micro-behaviors/fs/path/config/autorun::autorun-inf-string
    any:
      - id: ravmond-process-name
      - id: qihoo-tray-process-name
    unless:
      - id: metadata/signed/platform/
