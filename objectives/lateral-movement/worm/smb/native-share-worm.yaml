defaults:
  platforms: [windows]
  for: [pe, dll]
  attack: T1021.002

composite_rules:
  - id: native-share-copy-with-process-injection
    desc: Remote-share module copy combined with process injection
    crit: hostile
    conf: 0.98
    attack: T1021.002,T1055
    all:
      - id: micro-behaviors/fs/file/copy/source-destination::native-share-module-copy
      - id: micro-behaviors/process/inject/runtime/thread-context::native-write-suspend-context-api-profile
    unless:
      - id: metadata/installer/product/
  - id: native-admin-share-payload-launch
    desc: Admin-share self-copy and remote AT launch
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/fs/path/reference::admin-share-executable-path
      - id: micro-behaviors/fs/file/copy/call::copyfile-module-path-api-pair
      - id: micro-behaviors/os/autorun/scheduled::remote-at-command-template
      - id: metadata/binary/symbols/name/process::winexec
    unless:
      - id: metadata/installer/product/
