defaults:
  for: [pe, dll]
  platforms: [windows]

composite_rules:
  - id: netbios-share-worm-propagation
    desc: NetBIOS worm copies a payload and schedules remote execution
    crit: hostile
    conf: 0.99
    attack: T1021.002,T1053.005,T1547.001
    mbc: OB0004
    all:
      - id: micro-behaviors/os/network/share::wnet-add-connection
      - id: micro-behaviors/os/service/remote::net-schedule-job-add-source
      - id: micro-behaviors/fs/file/copy::copyfile-a
      - id: objectives/persistence/login/startup/registry::windows-startup-folder
      - id: objectives/command-and-control/channel/irc/bot::irc-netbios-infection-report
