defaults:
  for: [pe]
  platforms: [windows]
  attack: T1091,T1547.001

traits:
  # desktop.ini InfoTip pointing at a local .htt web-view template makes
  # Explorer render attacker HTML (and run its script) whenever the folder is
  # opened, the folder-infection vector of Windows 9x/ME script worms.
  - id: desktop-ini-infotip-htt
    desc: desktop.ini web-view InfoTip template
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)HTMLInfoTipFile\s*=\s*file://'

composite_rules:
  - id: folder-infotip-worm-hidden-run-key
    desc: Folder-template worm hides itself, adds Run key
    crit: hostile
    conf: 0.95
    attack: T1091,T1547.001,T1564
    all:
      - id: desktop-ini-infotip-htt
      - id: micro-behaviors/os/service/dispatch::register-service-process-name
      - id: micro-behaviors/os/registry/keys/autostart::currentversion-run-key-path
    unless:
      - id: metadata/signed/platform/
