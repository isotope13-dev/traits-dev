# A native program that carries loaders for two package ecosystems.
#
# The sckit worm's implant infects the npm and PyPI packages its stolen
# tokens can publish, so every build embeds the source it plants: a Node
# launcher and a Python launcher, each mapping the host's OS and architecture
# to a bundled binary (x64 -> amd64 in Node, the Go GOARCH names in Python) and
# starting it detached so the host application never waits on it.
#
# Each leg is ordinary alone -- installers pick per-platform binaries, daemons
# detach. A compiled binary holding *both* ecosystems' detached platform
# launchers is not an installer for itself; it is a writer of loaders for
# other packages. The any: legs tie it to registry publishing: it knows the
# token formats or credential files that publishing requires.
defaults:
  platforms: [unix, windows]
  for: [elf, macho, pe]
  attack: T1195.002,T1080

composite_rules:
  - id: native-dual-ecosystem-launcher-writer
    desc: Binary embeds npm and PyPI detached platform launchers
    crit: hostile
    conf: 0.95
    # The Node and Python launchers are embedded members, not the binary's
    # own type. Pool them onto the container and name those member types so
    # each required leg can actually match.
    scope: archive
    for: [elf, macho, pe, javascript, typescript, python]
    all:
      - id: micro-behaviors/os/sysinfo/platform/runtime::node-arch-remap-amd64
      - id: micro-behaviors/process/create/spawn::detached-ignored-unref-spawn
      - id: micro-behaviors/os/sysinfo/platform/runtime::python-arch-alias-go-map
      - id: micro-behaviors/process/create/subprocess::subprocess-detached-session
    any:
      - id: objectives/credential-access/api-harvest/format::npm-token-format-scan-regex
      - id: objectives/credential-access/api-harvest/format::pypi-token-format-scan-regex
      - id: micro-behaviors/fs/path/secret-config::package-or-netrc-credential-file
    needs: 2
