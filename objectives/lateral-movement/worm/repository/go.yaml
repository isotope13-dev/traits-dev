# Credential-backed repository propagation routines retained in Go pclntab
# data. Each name is only a capability hint on its own; the hostile composite
# requires credential discovery, identity-bearing Git execution, explicit
# remote-repository preparation, and recursive publication in one binary.
defaults:
  platforms: [linux, macos, windows]
  for: [elf, macho, pe]
  crit: notable
  attack: T1195.002,T1552.001
  mbc: F0001

traits:
  - id: go-credential-path-enumeration-routine
    desc: Go credential-path enumeration routine
    conf: 0.92
    if:
      type: text
      regex: '(?i)(^|[/_.])credentialPaths([.$]|$)'

  - id: go-credential-file-read-routine
    desc: Go binary names credential-file read routine
    conf: 0.92
    if:
      type: text
      regex: '(?i)(^|[/_.])readCredentialFile([.$]|$)'

  - id: go-json-credential-extraction-routine
    desc: Go JSON credential extraction routine
    conf: 0.94
    if:
      type: text
      regex: '(?i)(^|[/_.])extractJSONCredentials([.$]|$)'

  - id: go-remote-repository-preparation-routine
    desc: Go remote repository preparation routine
    conf: 0.94
    if:
      type: text
      regex: '(?i)(^|[/_.])PrepareRemoteRepository(Target)?([.$]|$)'

  - id: go-git-identity-execution-routine
    desc: Go Git execution with supplied identity
    conf: 0.94
    if:
      type: text
      regex: '(?i)(^|[/_.])runGitWithIdentity([.$]|$)'

  - id: go-recursive-publication-routine
    desc: Go binary names recursive publication routine
    conf: 0.95
    if:
      type: text
      regex: '(?i)(^|[/_.])recursivePublish([.$]|$)'

composite_rules:
  - id: go-credential-backed-repository-propagation-worm
    desc: Go worm uses harvested credentials to republish repositories
    crit: hostile
    conf: 0.99
    all:
      - id: go-remote-repository-preparation-routine
      - id: go-git-identity-execution-routine
      - id: go-recursive-publication-routine
    any:
      - id: go-credential-path-enumeration-routine
      - id: go-credential-file-read-routine
      - id: go-json-credential-extraction-routine
    needs: 2
