# A COM image that increments the digit inside its own embedded target name
# (INC byte [name]), creates that file (AH=3Ch), writes its own image from
# 0100h, closes it and exits. Each run drops the next numbered copy ("1.COM",
# then "2.COM", ...), so the program spreads by self-copy without a host.
# Written as YARA so the tiny image is evaluated under the engine's size
# floor.
defaults:
  platforms: [windows, unix]
  for: [dos_com]
  attack: T1570
  size_max: 512

traits:
  - id: dos-increment-name-create-self-image
    desc: DOS bumps own name, writes own image
    crit: suspicious
    conf: 0.93
    if:
      type: yara
      source: |
        rule dos_increment_name_create_self_image {
          meta:
            filetypes = "dos_com"
          strings:
            $seq = { FE 06 ?? ?? B4 3C 32 C9 BA ?? ?? CD 21 93 B4 40 B1 ?? BA 00 01 CD 21 B4 3E CD 21 CD 20 }
          condition:
            $seq in (0..4)
        }

composite_rules:
  - id: dos-counter-named-self-image-copy
    desc: Tiny DOS image drops numbered copies of itself
    crit: hostile
    conf: 0.93
    all:
      - id: dos-increment-name-create-self-image
      - id: micro-behaviors/fs/write/file/handle::dos-int21-write-call
