# Modified ScreenConnect clients observed by Huntress selected every new Host
# connection, serialized a local script bundle, and queued it with FileAction
# Run. The product API identity stays in well-known/; these rules infer the
# automatic propagation objective from structural source and binary artifacts.
defaults:
  for: [csharp, pe, dll, powershell, python, javascript]
  platforms: [windows, linux, macos]
  attack: T1570,T1219

traits:
  - id: endpoint-status-connection-list
    desc: Endpoint status exposes connection list
    crit: component
    conf: 0.96
    if:
      type: text
      # PascalCase is the native .NET form; optional separators cover wrappers
      # that expose the same object model to Python or JavaScript.
      regex: '(?i)\bEnd_?Point_?Status_?Message\b[\s\S]{0,320}\bConnections\b'

  - id: host-connection-field-cluster
    desc: Host connection type and ID fields
    crit: component
    conf: 0.96
    if:
      type: text
      regex: '(?i)\bProcess_?Type\b[\s\S]{0,240}["'']Host["''][\s\S]{0,240}\bConnection_?ID\b'

  - id: dotnet-connection-id-cache-pruning
    desc: .NET Connection-ID cache membership and pruning
    crit: component
    conf: 0.94
    if:
      type: text
      regex: '(?is)Connection_?ID.{0,500}\.Contains\(.{0,500}\.(IntersectWith|Remove)\('

  - id: python-connection-id-cache-pruning
    desc: Python connection cache membership and pruning
    crit: component
    conf: 0.92
    if:
      type: text
      regex: '(?is)connection_?id.{0,500}not\s+in.{0,700}\.(intersection_update|discard)\('

  - id: javascript-connection-id-cache-pruning
    desc: JavaScript connection cache pruning
    crit: component
    conf: 0.9
    if:
      type: text
      regex: '(?is)\.has\(.{0,120}connection_?id.{0,700}\.delete\('

composite_rules:
  # A delivered-ID membership guard followed by deletion/intersection is the
  # reinfection mechanic: disconnected IDs leave the cache so a later
  # reconnect is eligible for delivery again.
  - id: connection-id-cache-pruning
    desc: Connection-ID cache membership and pruning
    crit: component
    conf: 0.94
    any:
      - id: dotnet-connection-id-cache-pruning
      - id: python-connection-id-cache-pruning
      - id: javascript-connection-id-cache-pruning

  - id: rmm-session-automatic-payload-execution
    desc: RMM Host sessions automatically receive executable payloads
    crit: hostile
    conf: 0.99
    all:
      - id: endpoint-status-connection-list
      - id: host-connection-field-cluster
      - id: well-known/dual-use/remote-admin/screenconnect::programmatic-run-file-transfer
    unless:
      - id: well-known/dual-use/remote-admin/screenconnect::screenconnect-vendor-binary-context
    near_bytes: 4096

  - id: rmm-session-reinfection-worm
    desc: RMM connection cache permits payload reinfection
    crit: hostile
    conf: 0.99
    all:
      - id: rmm-session-automatic-payload-execution
      - id: connection-id-cache-pruning
