# A tiny COM computes its own base with CALL/POP, creates a file, writes a
# buffer, closes it, and exits.
defaults:
  platforms: [windows, unix]
  for: [dos_com, data]
  attack: T1080
  size_max: 4096

composite_rules:
  - id: dos-delta-create-write-dropper
    desc: Delta base drops a written file
    crit: hostile
    conf: 0.96
    all:
      - id: micro-behaviors/fs/file/create::dos-call-pop-image-base
      - id: micro-behaviors/fs/file/create::dos-create-write-close-exit
  - id: dos-widened-length-write-dropper
    desc: Writes a widened restored length
    crit: hostile
    conf: 0.94
    all:
      - id: micro-behaviors/fs/file/create::dos-create-write-close-exit
      - id: micro-behaviors/fs/file/create::dos-popped-length-add-write
