defaults:
  for: [pe]
  platforms: [windows]
composite_rules:
  - id: drive-root-executable-copy-profile
    desc: Drive-root EXE table with current-image lookup and copy APIs
    crit: suspicious
    conf: 0.9
    attack: T1091
    all:
      - id: micro-behaviors/fs/path/drive-root::many-root-executable-paths
      - id: micro-behaviors/fs/file/copy/call::copyfile-module-path-api-pair

  # Require three independent roles: drive-root propagation candidates,
  # drivers-directory Run persistence, and named security-process targets.
  # CopyFile/GetModuleFileName imports alone also occur in benign installers.
  - id: drive-root-persistent-av-killer
    desc: Drive-root copy worm with Run persistence and antivirus kill targets
    crit: hostile
    conf: 0.95
    attack: T1091,T1547.001,T1562.001
    all:
      - id: drive-root-executable-copy-profile
      - id: objectives/persistence/login/registry/run-key::drivers-executable-run-key-copy-profile
      - id: objectives/evasion/anti-av/kill::rising-mcshield-termination-profile
