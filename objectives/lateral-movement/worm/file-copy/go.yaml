defaults:
  platforms: [windows]
  for: [pe]
  attack: T1091,T1570

# GoMiner keeps these descriptive function names in its Go pclntab. Requiring
# every provider-specific routine plus its removable-drive routine and an
# autorun.inf section distinguishes the propagation implementation from an
# ordinary cloud-sync client or removable-media utility.
traits:
  - id: go-removable-drive-infection-routine
    desc: Go removable-drive infection routine name
    crit: component
    conf: 0.96
    if:
      type: text
      exact: main.driveInfection
      section: rdata

  - id: go-dropbox-infection-routine
    desc: Go Dropbox infection routine name
    crit: component
    conf: 0.96
    if:
      type: text
      exact: main.dropboxInfection
      section: rdata

  - id: go-onedrive-infection-routine
    desc: Go OneDrive infection routine name
    crit: component
    conf: 0.96
    if:
      type: text
      exact: main.onedriveInfection
      section: rdata

  - id: go-google-drive-infection-routine
    desc: Go Google Drive infection routine name
    crit: component
    conf: 0.96
    if:
      type: text
      exact: main.googledriveInfection
      section: rdata

composite_rules:
  - id: go-cloud-removable-file-copy-worm
    desc: Go worm propagates through cloud folders and removable drives
    crit: hostile
    conf: 0.99
    all:
      - id: go-removable-drive-infection-routine
      - id: go-dropbox-infection-routine
      - id: go-onedrive-infection-routine
      - id: go-google-drive-infection-routine
      - id: micro-behaviors/fs/path/config/autorun::autorun-section
