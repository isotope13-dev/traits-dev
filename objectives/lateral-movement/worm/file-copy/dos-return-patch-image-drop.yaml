defaults:
  platforms: [windows, unix]
  for: [dos_com, data]
  attack: T1080
  size_max: 4096

composite_rules:
  - id: dos-com-patches-caller-then-drops-image
    desc: DOS COM patches caller, creates file with image
    crit: hostile
    conf: 0.92
    all:
      - id: micro-behaviors/os/msdos/interrupt::dos-psp-return-address-byte-patch
      - id: micro-behaviors/fs/file/create::dos-create-write-close-image
