defaults:
  platforms: [vmcms]
  for: [text, data]

composite_rules:
  # The source shows bulk EXEC distribution to two lists. It does not prove
  # delivery, identity of the running file, or that a recipient ran it.
  - id: cms-contact-netlog-exec-distribution
    desc: CMS contacts and logs drive EXEC distribution
    crit: hostile
    conf: 0.95
    near_bytes: 8192
    all:
      - id: micro-behaviors/fs/read/file/account::cms-names-file-read-command
      - id: micro-behaviors/fs/read/file/account::cms-netlog-file-read-command
      - id: micro-behaviors/communications/transfer::cms-send-exec-command
      - id: micro-behaviors/communications/transfer::cms-queued-contact-loop
