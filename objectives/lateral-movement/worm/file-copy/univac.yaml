# The 1975 UNIVAC PERVADE routine copied its host into writable files and
# quietly propagated through assigned directories.  These identifiers are
# source-level facts for that unusual assembly implementation.
defaults:
  platforms: [unix]
  for: [html, text]
  attack: T1570

traits:
  - id: univac-pervade-routine
    desc: UNIVAC source defines PERVADE routine
    crit: notable
    conf: 0.99
    if:
      type: text
      regex: '\bPERVADE\*\s+TS\s+PVCW'
  - id: univac-pervade-termination
    desc: UNIVAC source defines PERVADE termination
    crit: notable
    conf: 0.99
    if:
      type: text
      substr: PVTERM
  - id: univac-pervade-time-marker
    desc: PERVADE marks copied files with time
    crit: suspicious
    conf: 0.99
    if:
      type: text
      substr: '25*60*60+14*60+19'
  - id: univac-pervade-call
    desc: UNIVAC program calls PERVADE propagation
    crit: suspicious
    conf: 0.99
    if:
      type: text
      regex: 'LMJ\s+X11,PERVADE'
  - id: univac-pervade-filesystem-copy
    desc: UNIVAC program copies through file system
    crit: suspicious
    conf: 0.99
    if:
      type: text
      regex: '(?is)PERVADE.{0,80}THROUGHOUT THE FILE SYSTEM'

composite_rules:
  - id: univac-pervade-self-propagation
    desc: UNIVAC source implements hidden file propagation
    crit: hostile
    conf: 0.995
    all:
      - id: univac-pervade-routine
      - id: univac-pervade-termination
      - id: univac-pervade-time-marker
  - id: univac-pervade-host-integration
    desc: UNIVAC program integrates hidden propagation
    crit: hostile
    conf: 0.995
    all:
      - id: univac-pervade-call
      - id: univac-pervade-termination
      - id: univac-pervade-filesystem-copy
