defaults:
  platforms: [unix]
  for: [java, class, kotlin]
  attack: T1210
traits:
  # Matcher-accurate name: this finds an `ssh ... root@host` command string,
  # nothing about propagation — the worm intent comes from the composite's
  # java-runtime-exec leg. Roff man pages guess as Kotlin, so a documented
  # `oscap-ssh root@192.168.1.13` usage example in OpenSCAP's manual page was
  # being reported as a worm command; documentation is not code.
  - id: ssh-root-command-string
    desc: SSH command string targeting root account
    crit: notable
    conf: 0.88
    if:
      type: text
      regex: '\bssh\s+.{0,100}root@'
    unless:
      - id: metadata/package/documentation/manpage::unix-manpage
  - id: java-rcp-propagation-command
    desc: Java/Kotlin RCP propagation command
    crit: notable
    conf: 0.88
    if:
      type: text
      regex: '\brcp\s+.{0,160}root@'
composite_rules:
  - id: java-worm-propagation
    desc: Java agent attempting propagation via SSH or RCP
    crit: hostile
    conf: 0.95
    all:
      - id: micro-behaviors/process/create/shell/spawn::java-runtime-exec
    any:
      - id: ssh-root-command-string
      - id: java-rcp-propagation-command
    needs: 1
