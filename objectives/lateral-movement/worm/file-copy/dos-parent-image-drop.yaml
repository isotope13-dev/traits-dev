defaults:
  for:
  - dos_com
  platforms:
  - windows
  - unix
  size_max: 65536
composite_rules:
- id: dos-parent-directory-self-image-replication
  desc: Replicates own image while ascending parent dirs
  crit: hostile
  conf: 0.99
  all:
  - id: micro-behaviors/fs/directory/traverse::dos-parent-search-repeated-self-drop
  - id: micro-behaviors/fs/write/file/handle::dos-create-self-image-path-write
  - id: micro-behaviors/fs/write/file/handle::dos-dta-cell-sized-own-image-overwrite-loop
