# Win32 File-Copy Worm Behavior
# ATT&CK: T1091 (Replication Through Removable Media) / T1570 (Lateral Tool Transfer)
defaults:
  attack: T1091
  for: [pe]
  platforms: [windows]
composite_rules:
  # Drive enumeration + directory enumeration + WriteFile/CreateFile is the
  # shape of every Windows filesystem library (JNI/JNA shims, file managers,
  # backup tools), not of a worm: nothing in that set says the binary places a
  # copy of ITSELF on the drives it walked. The copy API and current-image
  # lookup can belong to unrelated file-management and resource-loading paths.
  # This composite therefore requires an autorun artifact; the more specific
  # compiled-*autorun-self-copy-worm rules cover binaries with a self-copy path.
  - id: win32-drive-enumeration-autorun-profile
    desc: Drive enumeration and autorun references
    crit: suspicious
    conf: 0.85
    scope: file
    all:
      - id: micro-behaviors/fs/enumerate/drives::get-logical-drive-strings
      - id: micro-behaviors/fs/enumerate/drives::get-drive-type
      - id: micro-behaviors/fs/directory/readdir/profile::directory-listing-evidence
      - id: micro-behaviors/process/info/current::get-module-filename
      - id: micro-behaviors/fs/path/config/autorun::autorun-indicators
    downgrade:
      any:
        - id: metadata/signed/platform/
