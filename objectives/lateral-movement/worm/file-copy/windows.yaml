# Win32 File-Copy Worm Behavior
# Detects the pattern of enumerating directories + copying self
# ATT&CK: T1091 (Replication Through Removable Media) / T1570 (Lateral Tool Transfer)
defaults:
  attack: T1091
  for: [pe]
  platforms: [windows]
composite_rules:
  - id: win32-file-copy-worm
    desc: Directory enumeration with self-copy propagation pattern
    crit: suspicious
    conf: 0.85
    size_max: 500000
    all:
      - id: micro-behaviors/fs/enumerate/directory/
      - id: micro-behaviors/fs/file/copy/
      - id: micro-behaviors/process/info/current::get-module-filename
    any:
      - id: micro-behaviors/os/sysinfo/directories::get-windows-directory
      - id: micro-behaviors/os/sysinfo/directories::get-system-directory
    downgrade:
      any:
        - id: metadata/binary/vendor/
        - id: metadata/binary/installer/
        - id: metadata/lang/compiler/
        - id: metadata/package/versioning::pe-version-resource
        - id: micro-behaviors/data/embedded/certificate::pkcs7-signeddata-oid
    unless:
      - id: well-known/app/iobit::iobit-signed-component-context
  # Drive enumeration + directory enumeration + WriteFile/CreateFile is the
  # shape of every Windows filesystem library (JNI/JNA shims, file managers,
  # backup tools), not of a worm: nothing in that set says the binary places a
  # copy of ITSELF on the drives it walked. Propagation evidence — a CopyFile
  # of the image whose path GetModuleFileName just returned, or an autorun.inf
  # drop — is therefore required rather than optional.
  - id: win32-drive-spread-worm
    desc: Walks all drives and self-copies or drops autorun.inf
    crit: suspicious
    conf: 0.85
    size_max: 500000
    all:
      - id: micro-behaviors/fs/traversal/drives::get-logical-drive-strings
      - id: micro-behaviors/fs/traversal/drives::get-drive-type
      - id: micro-behaviors/fs/enumerate/directory/
      - id: micro-behaviors/process/info/current::get-module-filename
    any:
      - id: micro-behaviors/fs/file/copy/
      - id: micro-behaviors/fs/path/config/autorun::autorun-indicators
    downgrade:
      any:
        - id: metadata/binary/installer/
        - id: metadata/lang/compiler/
        - id: well-known/tool/reverse-engineering/
        - id: well-known/tool/sysadmin/infozip
        - id: micro-behaviors/communications/ssh/connect::openssh
        - id: metadata/signed/platform/
        - id: metadata/binary/vendor/
