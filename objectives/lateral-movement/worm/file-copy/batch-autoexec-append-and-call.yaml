defaults:
  platforms: [windows]
  for: [batch]
  attack: T1059.003

composite_rules:
  - id: batch-appends-self-to-autoexec-and-runs-it
    desc: Batch appends self to AUTOEXEC, runs it
    crit: hostile
    conf: 0.93
    size_max: 4096
    near_lines: 6
    all:
      - id: micro-behaviors/fs/write/file/redirect::batch-type-self-append-autoexec
      - id: micro-behaviors/fs/write/file/redirect::batch-call-autoexec
