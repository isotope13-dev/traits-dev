# Share-cache propagation is network lateral movement, independent of USB.
defaults:
  platforms: [windows]
  for: [text]
  attack: T1021.002

composite_rules:
  - id: autoit-network-share-spreader
    desc: AutoIt source copies its image to enumerated network shares
    crit: hostile
    conf: 0.97
    all:
      - id: micro-behaviors/network/share::autoit-share-cache-enumeration-source
      - id: micro-behaviors/fs/file/copy/source-destination::autoit-running-image-copy-source
      - id: micro-behaviors/os/autorun/control::autoit-autorun-inf-copy-source
