# The loop searches for names that look like batch files (`*?.b*t`)
# and appends the running script onto each match with a binary copy.
defaults:
  platforms: [windows]
  for: [batch]
  attack: T1080
traits:
  - id: batch-for-disguised-b-ext
    desc: For loop targets disguised batch names
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: '(?i)for\s+%%\w{1,16}\s+in\s+\(\*\?\.b\*t\)'
  - id: batch-copy-append-self
    desc: Copy appends this script to a match
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: '(?i)\bcopy\s+%%\w{1,16}\+%0\s*/b'
composite_rules:
  - id: batch-appends-self-to-b-ext
    desc: Batch appends itself onto batch files
    crit: hostile
    conf: 0.97
    near_bytes: 200
    all:
      - id: batch-for-disguised-b-ext
      - id: batch-copy-append-self
  - id: batch-hidden-self-append
    desc: Hidden copy appends this script
    crit: hostile
    conf: 0.96
    near_bytes: 200
    all:
      - id: batch-copy-append-self
      - id: micro-behaviors/os/console/io::batch-command-stdout-nul
