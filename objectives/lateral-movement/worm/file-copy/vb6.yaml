# VB6 programs call the runtime for file copy and shell launch instead of
# importing CopyFile, so the worm shape is carried by the runtime helpers plus
# strings. Copying onto system-process names while probing drive types is the
# removable-media spreader: it drops itself as smss.exe/csrss.exe so a
# directory listing looks like Windows, and checks drive types to find USB.
defaults:
  platforms: [windows]
  for: [pe]
  attack: T1091,T1036.005

composite_rules:
  - id: vb6-system-process-named-drive-copy-worm
    desc: VB6 drive-type probe copies itself as system process
    crit: suspicious
    conf: 0.9
    all:
      - id: metadata/lang/runtime::vb6-runtime-core-helper
      - id: micro-behaviors/fs/file/copy::vb6-rtcfilecopy
      - id: micro-behaviors/os/sysinfo/disk::get-drive-type-api-name
    any:
      - id: objectives/evasion/masquerade/process/name::utf16-smss-exe-path-suffix
      - id: micro-behaviors/process/info/name::csrss-executable-reference
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/installer/family/
