# Contact-driven call propagation is the reusable behavior demonstrated by
# WeWorm: the program walks a trusted address book and originates a call to
# each reachable identity. The API atoms are neutral on their own; requiring
# both enumeration and call dispatch captures automated fanout rather than a
# user selecting one contact in a dialer.
defaults:
  platforms: [android, ios]
  for: [java, kotlin, swift]
  attack: T1534
  mbc: B0016

composite_rules:
  - id: android-contact-list-call-propagation
    desc: Android code calls contacts while iterating the address book
    crit: hostile
    conf: 0.97
    for: [java, kotlin]
    platforms: [android]
    all:
      - id: micro-behaviors/os/user/lookup::android-phone-contact-enumeration
      - id: micro-behaviors/communications/messaging/channel::android-telecom-outbound-call
    near_bytes: 1800

  - id: ios-contact-list-call-propagation
    desc: iOS code calls contacts while enumerating the address book
    crit: hostile
    conf: 0.97
    for: [swift]
    platforms: [ios]
    all:
      - id: micro-behaviors/os/user/lookup::ios-phone-contact-enumeration
      - id: micro-behaviors/communications/messaging/channel::ios-callkit-outbound-call
    near_bytes: 1800

  - id: recurring-android-contact-call-worm
    desc: Android contact-call propagation with idle alarm
    crit: hostile
    conf: 0.98
    for: [java, kotlin]
    platforms: [android]
    all:
      - id: android-contact-list-call-propagation
      - id: micro-behaviors/time/schedule/interval::android-source-idle-alarm-schedule

  - id: recurring-ios-contact-call-worm
    desc: iOS contact-call propagation with repeating timer
    crit: hostile
    conf: 0.98
    for: [swift]
    platforms: [ios]
    all:
      - id: ios-contact-list-call-propagation
      - id: micro-behaviors/time/schedule/interval::swift-repeating-scheduled-timer
