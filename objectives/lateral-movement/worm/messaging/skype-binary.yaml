  crit: hostile
  conf: 0.97
  all:
  - id: objectives/command-and-control/channel/messaging::skype-control-api-client-binary
  - id: objectives/command-and-control/channel/messaging::skype-chat-create-command-text
  - id: objectives/command-and-control/channel/messaging::skype-chatmessage-command-text
