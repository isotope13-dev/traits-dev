# Skype instant-messaging worm, as a shipped executable.
#
# skype-source.yaml in this directory already states the verdict for the source
# form. Its keystone, skype-im-worm-source, is assembled entirely from
# `string_literal` atoms scoped to `c`/`cpp`/`vbs`, so it recognises a worm's
# code and not the worm. This rule is the compiled counterpart, built from the
# binary-facing command atoms under
# objectives/command-and-control/channel/messaging.
#
# ATT&CK: T1534 (Internal Spearphishing) -- the messages arrive from a contact
# the recipient already trusts, which is the whole point of the channel.
defaults:
  platforms: [windows]
  for: [pe, dll]
  attack: T1534
  mbc: B0016

composite_rules:
  # Enumerate the contact list, open a chat, send into it -- driven through the
  # automation API rather than by a person at the keyboard. A legitimate Skype
  # add-on sends chat messages too, which is why the contact-enumeration leg is
  # required: an add-on messages the conversation the user is in, and a worm
  # walks the buddy list first. `SEARCH FRIENDS` returns the whole list, and
  # the GET USER/GET PROFILE tables are how the results get qualified before
  # the lure goes out.
  - id: skype-api-contact-list-propagation
    desc: Skype API messages the whole contact list
    crit: hostile
    conf: 0.97
    all:
      - id: objectives/command-and-control/channel/messaging::skype-control-api-client-binary
      - id: objectives/command-and-control/channel/messaging::skype-chat-create-command-text
      - id: objectives/command-and-control/channel/messaging::skype-chatmessage-command-text
    any:
      - id: objectives/command-and-control/channel/messaging::skype-search-friends-command
      - id: objectives/command-and-control/channel/messaging::skype-get-user-property-command
    unless:
      - id: metadata/signed/platform/
      - id: well-known/app/
      - id: well-known/lib/
      - id: well-known/tool/
    # Samples that also carry the concealment pair -- answering the client's own
    # "allow this program to use Skype" dialog so the grant is never seen, and
    # forcing presence to Do Not Disturb so the outgoing lures raise no toast --
    # are running the account outright rather than borrowing it. That is
    # reported by skype-api-presence-concealment in the channel file; it is not
    # required here, because a worm that spams the buddy list is a worm whether
    # or not it bothers to hide.
