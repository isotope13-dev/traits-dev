# OSX/Leap.A (Oompa-Loompa): an InputManager bundle swizzles iChat methods,
# watches buddy presence changes and pushes a file to each buddy who comes
# online. Method swizzling plus iChat's outgoing-file and presence selectors
# is a hooked messenger sending files on its own.
defaults:
  platforms: [macos]
  for: [macho]
  attack: T1534
  mbc: B0016

composite_rules:
  - id: swizzled-ichat-buddy-file-push
    desc: Swizzled iChat hook sends files to buddies as they come online
    crit: hostile
    conf: 0.95
    all:
      - id: micro-behaviors/dylib/load/runtime::objc-method-swizzle
      - id: micro-behaviors/communications/messaging/send::ichat-outgoing-file-selector
      - id: micro-behaviors/communications/messaging/contact::ichat-buddy-status-selector
