# Recovered scanner logs in remotely, tries router CLI shells, then sends
# these download-and-execute commands over the authenticated socket. Requiring
# the shell-entry/injection sequence distinguishes ordinary BusyBox installers.
defaults:
  platforms: [linux]
  for: [elf]
composite_rules:
  - id: router-shell-busybox-payload-propagation
    desc: Router shell entry with BusyBox propagation
    crit: hostile
    conf: 0.98
    attack: T1105,T1059.004
    all:
      - id: micro-behaviors/process/create/shell/interactive::router-cli-shell-entry-sequence
      - id: micro-behaviors/process/create/shell/command-string::router-ping-shell-command
      - id: micro-behaviors/process/create/local-exec::chmod-then-local-execute-command
      - id: micro-behaviors/communications/ftp/download/busybox::ftpget-elf-reference
      - id: micro-behaviors/communications/tftp/download::tftp-elf-reference
      - id: micro-behaviors/process/create/shell/pipeline::native-download-shell-pipeline-reference
