defaults:
  platforms:
  - linux
  - unix
  for:
  - elf
  attack: T1105,T1021.002
  crit: suspicious
composite_rules:
- id: native-linux-network-worm
  desc: Native Linux network worm spreader
  crit: hostile
  conf: 0.98
  all:
  - id: micro-behaviors/communications/socket/connect/attempt::socket-connect
  - id: metadata/file/profile/staging::embedded-download-chmod-execute-chain
  - id: micro-behaviors/process/terminate/command::pkill-or-force-kill
  any:
  - id: objectives/lateral-movement/pass-the-hash/ntlm::native-ntlmssp-auth-marker
  - id: micro-behaviors/os/security/auth/ntlm::ntlmssp-marker
  - id: micro-behaviors/fs/path/private-key::native-private-key-path-name
