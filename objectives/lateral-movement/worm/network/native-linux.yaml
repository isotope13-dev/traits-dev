# Native Linux network worm and spreader patterns.
# Combines outbound network socket connection and propagation credential material
# with embedded download, staging, and executable payload launching.
defaults:
  platforms: [linux, unix]
  for: [elf]
  attack: T1105,T1021.002
  crit: suspicious

composite_rules:
  - id: native-worm-credential-material
    desc: Native worm propagation credential material
    conf: 0.94
    any:
      - id: objectives/lateral-movement/pass-the-hash/ntlm::native-ntlmssp-auth-marker
      - id: micro-behaviors/os/security/auth/ntlm::ntlmssp-marker
      - id: objectives/credential-access/ssh/key::native-private-key-path-name

  - id: native-worm-process-cleanup
    desc: Forceful process termination commands
    conf: 0.92
    any:
      - id: micro-behaviors/process/terminate/command::pkill
      - id: micro-behaviors/process/terminate/command::kill-force

  - id: native-linux-network-worm
    desc: Native Linux network worm spreader
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/communications/socket/create::socket-connect
      - id: micro-behaviors/process/create/local-exec::embedded-download-chmod-execute-chain
      - id: native-worm-credential-material
      - id: native-worm-process-cleanup
    unless:
      - id: metadata/package/testing/
      - id: well-known/tool/
