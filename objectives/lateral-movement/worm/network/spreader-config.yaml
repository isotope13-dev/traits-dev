defaults:
  for: [c, cpp]
  platforms: [windows, unix]
  crit: notable
  attack: T1210

traits:
  - id: spreader-dcom-toggle
    desc: Declares DCOM spreader compile toggle
    if:
      type: text
      regex: '#define[ \t]+NO_DCOM2?\b'

  - id: spreader-lsass-toggle
    desc: Declares LSASS spreader compile toggle
    if:
      type: text
      regex: '#define[ \t]+NO_LSASS\b'

  - id: spreader-netbios-toggle
    desc: Declares NetBIOS spreader compile toggle
    if:
      type: text
      regex: '#define[ \t]+NO_NETBIOS\b'

  - id: spreader-mssql-toggle
    desc: Declares MSSQL spreader compile toggle
    if:
      type: text
      regex: '#define[ \t]+NO_MSSQL\b'

composite_rules:
  - id: worm-spreader-build-toggles
    desc: Configures multiple network exploit spreader modules
    crit: hostile
    needs: 2
    any:
      - id: spreader-dcom-toggle
      - id: spreader-lsass-toggle
      - id: spreader-netbios-toggle
      - id: spreader-mssql-toggle
