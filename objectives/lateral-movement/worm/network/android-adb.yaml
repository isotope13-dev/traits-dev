defaults:
  platforms: [android, unix, windows]
  for: [java, kotlin]
  attack: T1021,T1046,T1105

composite_rules:
  - id: adb-authenticated-apk-deployment
    desc: Custom ADB client authenticates, pushes, and installs an APK
    crit: suspicious
    conf: 0.98
    all:
      - id: micro-behaviors/communications/socket/tcp::adb-client-auth-handshake
      - id: micro-behaviors/communications/socket/tcp::adb-private-key-path
      - id: micro-behaviors/communications/socket/tcp::adb-sync-file-push
      - id: micro-behaviors/communications/socket/tcp::adb-shell-apk-install
    near_lines: 40

  - id: adb-mass-installer-propagation
    desc: Mass-scanning ADB client pushes and installs an APK on discovered hosts
    crit: hostile
    conf: 0.995
    all:
      - id: objectives/discovery/network/scan/port::java-concurrent-two-octet-connect-sweep
      - id: adb-authenticated-apk-deployment

  - id: adb-mass-system-persistence
    desc: Mass-scanning ADB client reconfigures ADB and plants a system APK
    crit: hostile
    conf: 0.995
    all:
      - id: objectives/discovery/network/scan/port::java-concurrent-two-octet-connect-sweep
      - id: micro-behaviors/communications/socket/tcp::adb-client-auth-handshake
      - id: micro-behaviors/communications/socket/tcp::adb-shell-port-reconfigure
      - id: micro-behaviors/communications/socket/tcp::adb-shell-system-apk-copy

  - id: adb-network-worm
    desc: ADB worm combines mass installation with privileged system persistence
    crit: hostile
    conf: 0.999
    all:
      - id: adb-mass-installer-propagation
      - id: adb-mass-system-persistence
