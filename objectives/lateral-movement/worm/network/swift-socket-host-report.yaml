defaults:
  platforms: [unix]
  for: [swift]
  attack: T1041,T1021

traits:
  - id: swift-socket-host-report-marker
    desc: Swift sends marked host report over socket
    crit: notable
    if:
      type: yara
      source: |
        rule swift_socket_host_report_marker {
          strings:
            $label = "EXFIL:DATA" nocase
            $host = "gethostname("
            $kernel = "uname("
            $send = /\bwrite\s*\(/ 
            $connect = /\bconnect\s*\(/
          condition:
            all of them
        }

composite_rules:
  - id: swift-subnet-worm-host-report
    desc: Subnet delivery tool sends host findings
    crit: hostile
    conf: 0.97
    all:
      - id: swift-socket-host-report-marker
      - id: swift-subnet-executable-delivery-attempt
