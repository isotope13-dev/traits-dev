# Network worms that pair active subnet discovery with exposed Docker daemon
# abuse. The deployment side requires a privileged host-root container and the
# create/start lifecycle, so ordinary Docker inventory and vulnerability
# scanners do not satisfy this propagation rule.
defaults:
  platforms: [linux, unix, windows]
  for: [scripts, binaries, c, cpp, csharp, python, javascript, typescript, go, java, kotlin, swift, perl, ruby, powershell]
  attack: T1046,T1210,T1105

composite_rules:
  - id: docker-api-subnet-worm-propagation
    desc: Docker API worm deploys privileged containers
    crit: hostile
    conf: 0.995
    all:
      - id: micro-behaviors/os/container/runtime::docker-api-container-lifecycle
      - id: micro-behaviors/os/container/runtime::docker-host-escape-spec
      - id: micro-behaviors/os/container/runtime::docker-api-port-2375
    any:
      - id: objectives/discovery/network/scan/port::shell-full-prefix-devtcp-sweep
      - id: objectives/discovery/network/scan/port::python-cidr-host-connect-sweep
      - id: objectives/discovery/network/scan/port::python-dynamic-cidr-host-connect-sweep
      - id: objectives/discovery/network/scan/port::parallel-host-sweep-source
      - id: objectives/discovery/network/scan/port::local-network-recon-tcp-connect
      - id: objectives/discovery/network/scan/port::java-concurrent-two-octet-connect-sweep
      - id: objectives/lateral-movement/worm/network::csharp-subnet-port-scan-loop
      - id: objectives/lateral-movement/worm/network::swift-subnet-port-scan
      - id: objectives/lateral-movement/worm/network::perl-subnet-port-worm-scan
    needs: 1
