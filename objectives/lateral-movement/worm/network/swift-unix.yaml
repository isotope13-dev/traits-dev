defaults:
  platforms: [unix]
  for: [swift]
  attack: T1105

composite_rules:
  - id: swift-subnet-executable-delivery-attempt
    desc: TCP scan with executable installation clues
    crit: suspicious
    conf: 0.97
    all:
      - id: micro-behaviors/communications/socket/connect/attempt::swift-range-tcp-connect-loop
      - id: metadata/lang/source/syntax/call/relationship::swift-loop-item-pair-call
      - id: micro-behaviors/fs/read/file/content/unspecified::swift-data-file-read
      - id: micro-behaviors/process/deploy/file-exec/command::swift-shell-executable-install-command
