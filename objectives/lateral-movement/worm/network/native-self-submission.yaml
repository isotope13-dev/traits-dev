# Autonomous executable reproduction through a node-targeted submission API.
# Requires the self-image buffer, mutation/write/upload binding and loop, plus
# PRNG-selected node routing. No endpoint or chosen executable name gates it.
defaults:
  platforms: [windows]
  for: [pe]
composite_rules:
  - id: native-mutating-node-self-propagation
    desc: Mutating self-copy submission to remote nodes
    crit: hostile
    conf: 0.98
    all:
      - id: objectives/anti-static/obfuscation/payload/polymorphic/generator::self-mutating-image-submission-loop
      - id: micro-behaviors/communications/http/form::native-random-node-form-value
    near_bytes: 2048
