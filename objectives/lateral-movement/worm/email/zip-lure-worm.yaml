# Non-English lure worm email carrying a ZIP payload.
#
# Scano-style worm emails pair a foreign-language social-engineering lure
# with a ZIP attachment holding the payload, composed with worm-favored
# Outlook Express tooling and a self-asserted spam-negative header.
defaults:
  platforms: [windows, unix]
  for: [text, makefile]
composite_rules:
  - id: lure-zip-worm-email
    desc: Lure email carries ZIP worm payload
    crit: hostile
    conf: 0.93
    attack: T1566.001
    all:
      - id: metadata/file/format/markup::eml-zip-attachment
      - id: metadata/file/encoding/compression::eml-base64-zip-magic
      - id: metadata/file/encoding/compression::eml-koi8r-charset
      - id: metadata/file/format/markup::eml-outlook-express-mailer
      - id: metadata/file/format/markup::eml-spam-negative-header
      - id: metadata/file/encoding/compression::eml-base64-pe-loader-imports
