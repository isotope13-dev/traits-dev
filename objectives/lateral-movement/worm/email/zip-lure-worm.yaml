# Non-English lure worm email carrying a ZIP payload.
#
# Scano-style worm emails pair a foreign-language social-engineering lure
# with a ZIP attachment holding the payload, composed with worm-favored
# Outlook Express tooling and a self-asserted spam-negative header. Either
# half is common alone; the five-way conjunction is the worm.
defaults:
  platforms: [windows]
composite_rules:
  - id: lure-zip-worm-email
    desc: Lure email carries ZIP worm payload
    crit: hostile
    conf: 0.93
    all:
      - id: micro-behaviors/communications/email/mime::eml-zip-attachment
      - id: micro-behaviors/communications/email/mime::eml-base64-zip-magic
      - id: micro-behaviors/communications/email/mime::eml-koi8r-charset
      - id: micro-behaviors/communications/email/mime::eml-outlook-express-mailer
      - id: micro-behaviors/communications/email/mime::eml-fake-spam-negative
