# A batch file that echoes a WSH script which builds an Outlook mail item,
# attaches a script or executable and sends it. Mail clients block those
# extensions on receipt, so composing such a message is shipping code: the
# batch is a mass-mailer worm carrier.
defaults:
  platforms: [windows]
  for: [batch]
  attack: T1566.001
composite_rules:
  - id: batch-outlook-script-attachment-mailer
    desc: Batch builds an Outlook mail that sends a script attachment
    crit: hostile
    conf: 0.93
    near_lines: 24
    all:
      - id: micro-behaviors/communications/email/compose/outlook::outlook-create-mailitem-text
      - id: micro-behaviors/communications/email/compose/outlook::outlook-attaches-executable-file
      - id: micro-behaviors/os/com/outlook::outlook-mail-send-call-wide-context
