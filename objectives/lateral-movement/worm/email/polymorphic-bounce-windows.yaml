# Native mail worms using polymorphic administrative and delivery-failure
# lures. Braced alternatives are generator syntax, not ordinary email text.
defaults:
  platforms: [windows]
  for: [pe, dll]
  attack: T1566.001

traits:
  - id: polymorphic-admin-infection-lure
    desc: Polymorphic infected-host lure
    crit: suspicious
    conf: 0.98
    if:
      type: text
      substr: 'your computer {had been|was} {compromised|infected'

  - id: polymorphic-undeliverable-lure
    desc: Polymorphic delivery-failure lure
    crit: suspicious
    conf: 0.98
    if:
      type: text
      substr: 'Your message {was not|could not be} delivered because'

  - id: polymorphic-smtp-transcript-lure
    desc: Polymorphic SMTP rejection lure
    crit: suspicious
    conf: 0.99
    if:
      type: text
      substr: '>>> MAIL F{rom|ROM}:$f'

composite_rules:
  - id: polymorphic-bounce-attachment-worm
    desc: Polymorphic bounce-lure ZIP mail worm
    crit: hostile
    conf: 0.99
    all:
      - id: polymorphic-admin-infection-lure
      - id: polymorphic-undeliverable-lure
      - id: polymorphic-smtp-transcript-lure
      - id: micro-behaviors/communications/email/mime::mime-zip-attachment-pe
