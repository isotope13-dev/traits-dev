# PE compiled email worm propagation (e.g., VB6 mass-mailers)
defaults:
  platforms: [windows]
  for: [pe]

traits:
  - id: format-autotest-flag
    desc: Destructive format /autotest flag in binary
    crit: suspicious
    conf: 0.97
    attack: T1485
    mbc: E1485
    if:
      type: text
      substr: /q /autotest

  # worm-marker (objectives/command-and-control/backdoor/keywords) is
  # deliberately `for: [scripts]` only -- native model/resource blobs can
  # contain the bare word "worm" ("book worm") with no malware meaning. That
  # concern does not apply here: near_bytes ties this to
  # mime-executable-attachment-pe, so a PE-native copy is scoped tightly to
  # this composite instead of widening the shared atom.
  - id: pe-worm-marker
    desc: Worm malware or propagation reference (native)
    crit: notable
    conf: 0.7
    attack: T1204
    if:
      type: text
      regex: '(?i)\bworm\b[^\n]{0,40}\b(malware|infect\w*|propagat\w*|spread\w*)\b'
    not:
      - substr: "Gregarious Worm"

  # outlook-application-progid / mapi-namespace-access
  # (micro-behaviors/os/com/object) carry `for: [text]` -- a leftover from
  # compat_missing.yaml that never covers Pe, even though their file default
  # is `[scripts, binaries]`. Native copies scoped for this file's type.
  - id: pe-outlook-application-progid
    desc: Outlook.Application COM ProgID string (native)
    crit: notable
    # Slightly below the source-scoped original's 0.94: a compiled binary's
    # string table can carry this ProgID as inert version-resource or
    # linked-library metadata rather than a live CreateObject() call site.
    conf: 0.9
    if:
      type: text
      regex: '(?i)\bOutlook\.Application(\.\d+)?\b'

composite_rules:
  - id: pe-mime-executable-worm
    desc: PE embeds executable email worm attachment
    crit: hostile
    conf: 0.97
    attack: T1566.001
    near_bytes: 8192
    all:
      - id: micro-behaviors/communications/email/mime::mime-executable-attachment-pe
      - id: pe-worm-marker
    any:
      - id: micro-behaviors/fs/file/copy::copyfile-a
      - id: micro-behaviors/process/create/exec::winexec
      - id: micro-behaviors/os/sysinfo/directories::get-system-directory
    needs: 2
  - id: vb6-pe-outlook-mass-mailer
    desc: VB6 PE Outlook mass-mailing worm
    crit: hostile
    conf: 0.98
    attack: T1566
    all:
      - id: pe-outlook-application-progid
      - id: metadata/binary/framework::vb6-runtime-dll
    any:
      - id: micro-behaviors/communications/email/send/outlook::outlook-mailitem-create
      - id: micro-behaviors/os/com/object::filesystemobject-progid
      - id: micro-behaviors/os/com/object::mapi-namespace-access
    needs: 2
  - id: pe-smtp-zip-attachment-worm
    desc: PE sends ZIP attachments through direct SMTP
    crit: hostile
    conf: 0.98
    attack: T1566.001
    all:
      - id: micro-behaviors/communications/email/send/direct::pe-direct-smtp-client
      - id: micro-behaviors/communications/email/mime::mime-zip-attachment-pe
      - id: micro-behaviors/communications/http/ip-discovery::icanhazip
  - id: pe-smtp-ip-discovery-motw-mailer
    desc: PE SMTP mailer discovers public IP and deletes web provenance
    crit: hostile
    conf: 0.99
    attack: T1071.003,T1553.005
    all:
      - id: micro-behaviors/communications/email/send/direct::pe-direct-smtp-client
      - id: micro-behaviors/communications/http/ip-discovery::icanhazip
      - id: objectives/evasion/indicator-removal/cleanup::motw-zone-identifier-reference
      - id: micro-behaviors/fs/delete/file/library::deletefile-w
      - id: micro-behaviors/communications/socket/init::connect-api-ordinal
