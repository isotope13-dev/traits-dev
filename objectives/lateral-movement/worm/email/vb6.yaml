# VB6 Outlook references co-occurring with executable, network, or registry text
# are leads for review, not proof of a mass-mailing worm.
defaults:
  platforms: [windows]
  for: [pe]
  attack: T1566.001,T1059
  crit: suspicious
  conf: 0.94

composite_rules:
  - id: vb6-outlook-exe-worm
    desc: VB6 Outlook and executable suffix references
    all:
      - id: metadata/lang/runtime::vb6-runtime-dll
      - id: micro-behaviors/os/com/automation::outlook-application-progid
      - id: micro-behaviors/fs/path/extension::utf16-exe-suffix-token
    unless:
      - id: well-known/lib/runtime/native-platform/vb-richclient::vb-richclient-runtime-library

  - id: vb6-outlook-wininet-worm
    desc: VB6 Outlook and WinInet DLL references
    all:
      - id: metadata/lang/runtime::vb6-runtime-dll
      - id: micro-behaviors/os/com/automation::outlook-application-progid
      - id: micro-behaviors/fs/path/system/library::wininet-dll-name-in-text
    unless:
      - id: well-known/lib/runtime/native-platform/vb-richclient::vb-richclient-runtime-library

  - id: vb6-outlook-regwrite-worm
    desc: VB6 Outlook and registry write references
    attack: T1566.001,T1547.001
    all:
      - id: metadata/lang/runtime::vb6-runtime-dll
      - id: micro-behaviors/os/com/automation::outlook-application-progid
      - id: micro-behaviors/os/registry/value/write::regwrite-pe-token
    unless:
      - id: well-known/lib/runtime/native-platform/vb-richclient::vb-richclient-runtime-library

  # Same worm family when the MZ header is truncated and the image sniffs as
  # dos_com: wide strings are only reachable as UTF-16 byte patterns. Walking
  # the Outlook address book while reading the mail-account registry store is
  # the harvest half of a mass-mailer, not ordinary Outlook automation.
  - id: vb6-outlook-harvest-worm-unparsed
    desc: Unparsed VB6 image harvests Outlook contacts
    crit: hostile
    for: [dos_com, static-lib, data]
    attack: T1566.001,T1114.001
    all:
      - id: metadata/lang/runtime::vb6-runtime-dll-unsectioned
      - id: well-known/app/productivity/microsoft-outlook::outlook-application-progid-utf16
      - id: micro-behaviors/communications/email/address::address-entries-utf16
      - id: micro-behaviors/os/registry/credential/reference::iam-accounts-key-utf16
