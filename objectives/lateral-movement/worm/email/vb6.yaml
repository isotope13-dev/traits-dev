# VB6 Outlook mass-mailers pair the Outlook.Application ProgID with an exe
# suffix and a WinInet or Run-key persistence string.
defaults:
  platforms: [windows]
  for: [pe]
  attack: T1566.001,T1059
  crit: hostile
  conf: 0.94

composite_rules:
  - id: vb6-outlook-exe-worm
    desc: VB6 Outlook worm stages an exe payload
    all:
      - id: objectives/lateral-movement/worm/email::pe-outlook-application-progid
      - id: micro-behaviors/fs/path/extension::utf16-exe-suffix-token
    unless:
      - id: metadata/signed/platform/
      - id: well-known/lib/runtime/native-platform/vb-richclient::vb-richclient-runtime-library

  - id: vb6-outlook-wininet-worm
    desc: VB6 Outlook worm talks WinInet
    all:
      - id: objectives/lateral-movement/worm/email::pe-outlook-application-progid
      - id: micro-behaviors/communications/http/client/wininet::wininet-library-stackstring
    unless:
      - id: metadata/signed/platform/
      - id: well-known/lib/runtime/native-platform/vb-richclient::vb-richclient-runtime-library

  - id: vb6-outlook-regwrite-worm
    desc: VB6 Outlook worm writes a Run key
    attack: T1566.001,T1547.001
    all:
      - id: objectives/lateral-movement/worm/email::pe-outlook-application-progid
      - id: objectives/persistence/login/registry/run-key::regwrite-token
    unless:
      - id: metadata/signed/platform/
      - id: well-known/lib/runtime/native-platform/vb-richclient::vb-richclient-runtime-library

  # Same worm family when the MZ header is truncated and the image sniffs as
  # dos_com: wide strings are only reachable as UTF-16 byte patterns. Walking
  # the Outlook address book while reading the mail-account registry store is
  # the harvest half of a mass-mailer, not ordinary Outlook automation.
  - id: vb6-outlook-harvest-worm-unparsed
    desc: Unparsed VB6 image harvests Outlook contacts
    for: [dos_com, static-lib]
    attack: T1566.001,T1114.001
    all:
      - id: metadata/binary/framework::vb6-runtime-dll-unsectioned
      - id: micro-behaviors/os/com/automation::outlook-application-progid-utf16
      - id: micro-behaviors/os/com/automation::address-entries-utf16
      - id: micro-behaviors/os/com/automation::iam-accounts-key-utf16
