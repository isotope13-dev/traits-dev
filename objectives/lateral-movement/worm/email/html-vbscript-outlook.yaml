defaults:
  platforms: [windows]
  for: [html, vbs]
  attack: T1566.001,T1114.001
composite_rules:
  - id: html-vbscript-outlook-contact-mailer
    desc: Script mails an attachment to every Outlook contact
    crit: hostile
    conf: 0.95
    all:
      - id: micro-behaviors/os/com/outlook::html-outlook-application-progid
      - id: micro-behaviors/os/com/outlook::outlook-contacts-folder-read
      - id: micro-behaviors/os/com/outlook::outlook-recipients-add-call
      - id: micro-behaviors/os/com/outlook::outlook-attachments-add-call
      - id: micro-behaviors/os/com/outlook::outlook-mail-send-call
