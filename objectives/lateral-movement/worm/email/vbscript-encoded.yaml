defaults:
  platforms: [windows]
  for: [vbs]
  attack: T1566.001

traits:
  - id: encoded-outlook-address-enumeration
    desc: Encoded Outlook address-book enumeration
    crit: notable
    conf: 0.95
    if:
      type: text
      case_insensitive: true
      regex: '426565736674744D6A747574.{0,120}42656573667474466F75736A6674'
  - id: encoded-outlook-address-bcc
    desc: Encoded Outlook recipient BCC collection
    crit: notable
    conf: 0.95
    if:
      type: text
      case_insensitive: true
      regex: '66312F434444.{0,50}6E626566732F42656573667474'
  - id: encoded-outlook-self-attachment-send
    desc: Encoded Outlook attachment add
    crit: notable
    conf: 0.96
    if:
      type: text
      case_insensitive: true
      substr: '4275756264696E666F75742F426565'
  - id: encoded-current-script-file-source
    desc: Encoded current script file passed to GetFile
    crit: component
    conf: 0.96
    if:
      type: text
      case_insensitive: true
      regex: '676D7A6A.{0,60}5464736A717547766D6D4F626E66'
  - id: encoded-outlook-delete-send
    desc: Encoded hidden-mail send sequence
    crit: notable
    conf: 0.96
    if:
      type: text
      case_insensitive: true
      regex: '45666D66756642677566735476636E6A75.{0,30}66312F74666F65'

composite_rules:
  - id: vbs-encoded-outlook-address-book-worm
    desc: Hex-decoded VBScript mass-mails itself to Outlook contacts
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/data/decode/custom::vbs-hex-offset-decode-execute
      - id: objectives/lateral-movement/worm/email::encoded-outlook-address-enumeration
      - id: objectives/lateral-movement/worm/email::encoded-outlook-address-bcc
      - id: objectives/lateral-movement/worm/email::encoded-outlook-self-attachment-send
      - id: objectives/lateral-movement/worm/email::encoded-current-script-file-source
      - id: objectives/lateral-movement/worm/email::encoded-outlook-delete-send
