defaults:
  platforms: [unix]
  for: [ruby]
  attack: T1566.001
  crit: notable
  conf: 0.9
traits:
  - id: ruby-self-source-base64-pack
    desc: Packs its own source as base64
    crit: suspicious
    conf: 0.94
    if:
      type: text
      regex: 'File\.new\(\s*\$0\s*\)\.read\(\)\]\.pack\(\s*["'']m'
  - id: ruby-mail-config-password
    desc: Parses a stored SMTP password
    crit: suspicious
    conf: 0.92
    if:
      type: text
      regex: 'smtp_server=.{0,80}password='
  - id: ruby-net-smtp-start
    desc: Opens a Ruby SMTP session
    if:
      type: text
      regex: '\bNet::SMTP\.start\b'
composite_rules:
  - id: ruby-sylpheed-self-mail-worm
    desc: Mails its own source to contacts
    crit: hostile
    conf: 0.97
    near_lines: 30
    all:
      - id: ruby-self-source-base64-pack
      - id: ruby-mail-config-password
      - id: ruby-net-smtp-start
