defaults:
  platforms: [windows]
  for: [vbs]
  attack: T1566.001
composite_rules:
  - id: encoded-outlook-selfcopy-hidden-mail
    desc: Encoded self-copy and hidden Outlook mail
    crit: hostile
    conf: 0.98
    scope: file
    all:
      - id: objectives/anti-static/obfuscation/encoding/script::microsoft-script-encoder-file
      - id: objectives/lateral-movement/worm/email::wsh-outlook-delete-after-submit
      - id: micro-behaviors/communications/email/compose/outlook::wsh-outlook-attachments-add
      - id: micro-behaviors/communications/email/send/outlook::addressentries-count
      - id: micro-behaviors/communications/email/send/outlook::mailitem-send
      - id: micro-behaviors/fs/file/copy/source-destination::wsh-copy-with-selfpath-reference
