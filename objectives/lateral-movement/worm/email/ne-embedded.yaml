# Outlook mass-mailer embedded in a 16-bit NE dropper.
#
# Yoyks-style worms ship their VBS mailer as data inside the executable:
# Outlook MAPI automation harvesting every address list, attaching the
# worm copy, and deleting the sent item afterwards. The harvest loop here
# is misspelled (Adress/AddressEntries), so harvest-count composites miss
# it; the MAPI automation plus attachment send plus delete-after-submit
# triple is the worm signature.
defaults:
  platforms: [windows]
  attack: T1566
composite_rules:
  - id: embedded-outlook-worm-blast
    desc: Embedded Outlook worm mass mailer
    crit: hostile
    conf: 0.95
    all:
      - id: micro-behaviors/communications/email/send/outlook::outlook-mapi-automation
      - id: micro-behaviors/communications/email/send/outlook::mailitem-create
      - id: micro-behaviors/communications/email/send/outlook::attachments-add
      - id: micro-behaviors/communications/email/send/outlook::delete-after-submit
