# Script email worm over Outlook COM: for each address-book entry it creates a
# mail item, addresses it to that entry, attaches a program (a script or
# executable path, or the running script itself) and sends it. Legitimate
# Outlook automation mails reports or documents to chosen recipients; mailing
# code that the recipient's client would execute to the whole address book is
# the self-propagation step. Carriers include .vbs droppers, batch files that
# echo the VBScript out, and bare text fragments of either.
defaults:
  platforms: [windows]
  for: [vbs, text, batch]
  attack: T1566.001

composite_rules:
  - id: script-outlook-address-entry-program-mailer
    desc: Mails a program to Outlook address entries
    crit: hostile
    conf: 0.96
    near_lines: 40
    all:
      - id: micro-behaviors/communications/email/access/mapi::wsh-outlook-address-entries
      - id: micro-behaviors/communications/email/compose/outlook::outlook-create-mailitem-text
      - id: micro-behaviors/communications/email/compose/outlook::wsh-outlook-recipient-add
      - id: micro-behaviors/os/com/outlook::outlook-mail-send-call-wide-context
    any:
      - id: micro-behaviors/communications/email/compose/outlook::outlook-attaches-executable-file
      - id: micro-behaviors/communications/email/compose/outlook::outlook-attaches-running-script
