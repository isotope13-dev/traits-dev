defaults:
  platforms: [windows]
  for: [dos_com, data]
  attack: T1566.001

traits:
  - id: debug-hex-outlook-worm
    desc: DOS wrapper stages encoded Outlook mass mailer
    crit: hostile
    conf: 0.98
    if:
      type: yara
      source: |
        rule debug_hex_outlook_worm {
          strings:
            $copy = "/C COPY %0" nocase
            $debug = "e 0100" nocase
            $addresses = "41 64 64 72 65 73 73 45 6e 74 72 69 65 73" nocase
            $attach = "41 74 74 61 63 68 6d 65 6e 74 73 2e 41 64 64" nocase
            $send = "2e 53 65 6e 64" nocase
          condition:
            all of them
        }
