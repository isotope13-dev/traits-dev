defaults:
  platforms: [windows]
  for: [vbs, text, oledoc, ooxml]
  attack: T1566.001

traits:
  - id: vba-outlook-mapi-address-loop
    desc: VBA loops Outlook address book
    crit: suspicious
    conf: 0.94
    if:
      type: text
      regex: 'GetNameSpace\("MAPI"\)[\s\S]{0,260}AddressLists\.Count'

  - id: vba-mails-active-document
    desc: VBA mails active document
    crit: suspicious
    conf: 0.96
    if:
      type: text
      regex: 'Attachments\.Add\s+ActiveDocument\.FullName[\s\S]{0,80}\.Send'

  - id: vba-disables-macro-security
    desc: VBA disables macro security
    crit: suspicious
    conf: 0.92
    if:
      type: text
      regex: 'CommandBars\("Macro"\)[\s\S]{0,180}VirusProtection'

  - id: vba-normaltemplate-replication
    desc: VBA references NormalTemplate VBProject
    crit: suspicious
    conf: 0.96
    downgrade:
      # Verbatim EICAR elsewhere in the same archive marks AV/scanner test
      # material (real malware never ships it): de-emphasize one level, keep
      # the finding visible. Hostile worm composites above still convict.
      scope: archive
      any:
        - id: well-known/tool/detection/security-scanner::eicar-test-string-reference
    if:
      type: text
      substr: 'NormalTemplate.VBProject.VBComponents'

  - id: vba-active-document-replication
    desc: VBA references ActiveDocument VBProject
    crit: suspicious
    conf: 0.96
    downgrade:
      # Same AV-test-corpus de-emphasis as the NormalTemplate sibling above.
      scope: archive
      any:
        - id: well-known/tool/detection/security-scanner::eicar-test-string-reference
    if:
      type: text
      substr: 'ActiveDocument.VBProject.VBComponents'

  - id: vba-codemodule-insertlines
    desc: VBA inserts lines into code module
    crit: suspicious
    conf: 0.95
    if:
      type: text
      regex: 'CodeModule\.InsertLines\s+[A-Za-z0-9_]+,\s*[A-Za-z0-9_]+\.CodeModule\.Lines'

composite_rules:
  - id: vba-word-outlook-mail-worm
    desc: VBA Word macro mails active document
    crit: hostile
    conf: 0.98
    all:
      - id: vba-outlook-mapi-address-loop
      - id: vba-mails-active-document
    any:
      - id: vba-disables-macro-security
      - id: vba-normaltemplate-replication
      - id: vba-active-document-replication

  - id: vba-word-template-infector
    desc: VBA Word template infector
    crit: hostile
    conf: 0.98
    all:
      - id: vba-normaltemplate-replication
      - id: vba-active-document-replication
      - id: vba-codemodule-insertlines
    any:
      - id: vba-disables-macro-security
      - id: vba-mails-active-document

  # A macro that rewrites its own project, in a file padded to be unreadable.
  #
  # `ActiveDocument.VBProject.VBComponents` reaches into the code of the
  # document the macro is running inside. Developer add-ins do use it, and that
  # is the whole of its legitimate audience -- run deliberately, from a button
  # or the IDE, in a project someone maintains. Alongside thousands of lines of
  # filler it is not a tool, it is the replication step: the macro copies
  # itself into the next document, and the padding is there so that whatever
  # reads the file gives up before reaching the part that does it.
  #
  # The two rules above want mail or the Normal template as well, because they
  # describe the complete Melissa-shaped worm. This is the replication step on
  # its own, which is what survives when the delivery changes.
  - id: vba-self-modifying-padded-project
    for: [vbs]
    desc: Padded macro rewrites its own VBA project
    crit: hostile
    conf: 0.95
    attack: T1559.001
    all:
      - id: vba-active-document-replication
      - id: objectives/anti-static/obfuscation/string/fragmentation::script-host-line-bloat
