# Client-agnostic P2P seeding: instead of reading a P2P client's registry key
# for its download directory, the worm walks the filesystem and drops a copy of
# itself into any directory whose name matches the usual share-folder names.
# Pairing the name table with a directory walker and a file-copy API is what
# separates it from a P2P client that merely carries those words as UI strings.
defaults:
  platforms: [windows]
  for: [pe]
  attack: T1091

traits:
  - id: vbscript-copy-to-double-extension
    desc: VBScript copy uses a double extension
    crit: notable
    conf: 0.96
    for: [vbs]
    if:
      type: text
      regex: '(?i)\.copyfile\s+\w+,\s*\w+\s*&\s*"[^"\r\n]{1,96}\.(jpg|exe|mp3)\.vbs"'

  - id: vbscript-legacy-p2p-share
    desc: VBScript names legacy P2P shares
    crit: notable
    conf: 0.95
    for: [vbs]
    if:
      type: text
      regex: '(?i)\\(KMD|KaZaA|Morpheus)\\My Shared Folder'

composite_rules:
  - id: vbscript-p2p-lure-seeding
    desc: VBScript seeds P2P shares with disguised script copies
    crit: hostile
    conf: 0.98
    for: [vbs]
    all:
      - id: micro-behaviors/fs/file/copy/source-destination::wsh-copy-with-selfpath-reference
      - id: vbscript-copy-to-double-extension
      - id: vbscript-legacy-p2p-share

  - id: share-folder-drop-scan
    desc: Walks disk copying files into share folders
    crit: suspicious
    conf: 0.9
    all:
      - id: micro-behaviors/fs/path/application/p2p::generic-share-folder-name-set
      - id: micro-behaviors/fs/directory/readdir/native::find-file-walker
      - id: micro-behaviors/fs/file/copy/call::copyfile-a

  # Unlike the generic name-set above (ordinary English words any program may
  # carry), a crack/password-stealer decoy filename has no legitimate reason
  # to exist in a binary's string table. Pairing it with a directory walker
  # and a file-copy API is the P2P worm's "drop a lure copy of myself"
  # behavior, not incidental string co-occurrence.
  - id: decoy-lure-copy-worm
    desc: Copies files into disk locations using crack/password decoy names
    crit: hostile
    conf: 0.95
    all:
      - id: micro-behaviors/fs/path/application/p2p::deceptive-lure-names-a4
      - id: micro-behaviors/fs/directory/readdir/native::find-file-walker
      - id: micro-behaviors/fs/file/copy/call::copyfile-a
