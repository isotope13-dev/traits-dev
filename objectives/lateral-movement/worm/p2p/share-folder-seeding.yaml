# Client-agnostic P2P seeding: instead of reading a P2P client's registry key
# for its download directory, the worm walks the filesystem and drops a copy of
# itself into any directory whose name matches the usual share-folder names.
# Pairing the name table with a directory walker and a file-copy API is what
# separates it from a P2P client that merely carries those words as UI strings.
defaults:
  platforms: [windows]
  for: [pe]
  attack: T1091

composite_rules:
  - id: share-folder-drop-scan
    desc: Walks disk copying files into share folders
    crit: suspicious
    conf: 0.9
    all:
      - id: micro-behaviors/fs/path/application/p2p::generic-share-folder-name-set
      - id: micro-behaviors/fs/enumerate/directory::find-file-walker
      - id: micro-behaviors/fs/file/copy::copyfile-a
