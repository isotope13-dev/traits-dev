# MyDoom-family P2P worm droppers ROT13-encode both the P2P share-folder key
# they target and the Run-key persistence path they write. Neither is
# something legitimate software has a reason to hide via ROT13; seeing both
# together is the obfuscated worm's install-and-spread routine, not
# coincidental string co-occurrence.
defaults:
  platforms: [windows]
  for: [pe, dll]

composite_rules:
  - id: rot13-obfuscated-p2p-worm-persistence
    desc: ROT13-obfuscated P2P worm targets shares and hides persistence
    crit: hostile
    conf: 0.96
    attack: T1027,T1091,T1547.001
    all:
      - id: micro-behaviors/fs/path/application/p2p::rot13-p2p-client-key-reference
      - id: micro-behaviors/data/encode/rot13::rot13-software-microsoft-fragments
