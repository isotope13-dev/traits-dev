defaults:
  platforms: [windows]
  for: [vbs]

traits:
  - id: encoded-registry-write-method
    desc: Encoded WScript registry write operation
    crit: component
    conf: 0.95
    if:
      type: text
      case_insensitive: true
      substr: '7366682F73666878736A7566'
  - id: encoded-special-folder-zero-reference
    desc: Encoded WSH special folder index zero
    crit: component
    conf: 0.95
    if:
      type: text
      case_insensitive: true
      substr: '7466752165626E6F3E677370786F2F686675747166646A626D67706D65667329312A'
  - id: encoded-kazaa-shared-dir2-path
    desc: Encoded Kazaa Dir2 shared-folder value
    crit: notable
    conf: 0.96
    if:
      type: text
      case_insensitive: true
      regex: '4C627B62625D4D7064626D44706F75666F755D456A7333.{0,40}233132333435363B232765626E6F'
  - id: encoded-kazaa-sharing-enabled
    desc: Encoded Kazaa sharing enabled by registry value
    crit: notable
    conf: 0.96
    if:
      type: text
      case_insensitive: true
      regex: '4C627B62625D4D7064626D44706F75666F755D456A7462636D66546962736A6F68.{0,8}233123'

composite_rules:
  - id: vbs-encoded-kazaa-shared-folder-exposure
    desc: Hex-decoded VBScript configures Kazaa file sharing
    crit: hostile
    conf: 0.97
    all:
      - id: micro-behaviors/data/decode/custom::vbs-hex-offset-decode-execute
      - id: objectives/lateral-movement/worm/p2p::encoded-kazaa-shared-dir2-path
      - id: objectives/lateral-movement/worm/p2p::encoded-kazaa-sharing-enabled
      - id: objectives/lateral-movement/worm/p2p::encoded-special-folder-zero-reference
      - id: objectives/lateral-movement/worm/p2p::encoded-registry-write-method
