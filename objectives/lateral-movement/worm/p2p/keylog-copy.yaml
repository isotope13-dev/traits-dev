# Email/P2P worms that self-copy under crack/lure names and also label
# themselves a keylogger or shell FTP are not file managers.
defaults:
  platforms: [windows]
  for: [pe]
  attack: T1091,T1056.001
  crit: hostile
  conf: 0.94

composite_rules:
  - id: keylogger-copyfile-spread
    desc: Self-labeled keylogger copies files to spread
    all:
      - id: objectives/collection/keylog/capture::keylogger-identity-label
      - id: micro-behaviors/fs/file/copy::copyfile-a
    unless:
      - id: metadata/signed/platform/
      - id: well-known/lib/

  - id: keylogger-ftp-worm
    desc: Self-labeled keylogger shells the FTP client
    all:
      - id: objectives/collection/keylog/capture::keylogger-identity-label
      - id: micro-behaviors/communications/ftp/control::ftp-client-command-invocation
    unless:
      - id: metadata/signed/platform/
      - id: well-known/lib/

  - id: p2p-lure-copyfile-worm
    desc: Copies files under crack or password lure names
    all:
      - id: micro-behaviors/fs/path/application/p2p::deceptive-lure-names-a3
      - id: micro-behaviors/fs/file/copy::copyfile-a
    unless:
      - id: metadata/signed/platform/
      - id: well-known/lib/

  - id: emule-incoming-copyfile-worm
    desc: Copies files into an eMule incoming folder
    all:
      - id: micro-behaviors/fs/path/application/p2p::emule-incoming-directory-value
      - id: micro-behaviors/fs/file/copy::copyfile-a
    unless:
      - id: metadata/signed/platform/
      - id: well-known/lib/
