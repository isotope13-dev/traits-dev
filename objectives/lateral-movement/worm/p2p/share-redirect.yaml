# Rather than copying itself into the victim's P2P share folder, the worm
# repoints the share folder at a directory of its own. One registry write and
# every file the worm has already staged is being served to the network.
#
# The technique survives translation: it is three lines in VBScript here, but
# the same value written from PowerShell, a batch `reg add`, or a compiled
# stub is the same attack, which is why the legs stay language-neutral.
defaults:
  platforms: [windows]
  for: [scripts, source, binaries]
  attack: T1091,T1112
  mbc: E1091

composite_rules:
  - id: p2p-download-directory-redirect
    desc: Repoints a P2P client download directory
    crit: hostile
    conf: 0.95
    all:
      - id: micro-behaviors/fs/path/application/p2p::fasttrack-download-directory-value
      - id: micro-behaviors/os/registry/write/wsh::wscript-regwrite

  - id: p2p-share-redirect-to-system-dir
    desc: Repoints P2P sharing into the Windows tree
    crit: hostile
    conf: 0.97
    all:
      - id: p2p-download-directory-redirect
      - id: micro-behaviors/fs/path/system::windows-dir
