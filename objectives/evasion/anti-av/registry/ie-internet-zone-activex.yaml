defaults:
  platforms: [windows]
  for: [reg]
  attack: T1112,T1562.001

traits:
  - id: ie-internet-zone-key
    desc: Registry targets Internet Explorer Internet zone
    crit: notable
    if:
      type: text
      regex: '(?i)Internet Settings\\Zones\\3\]'
  - id: ie-activex-run-allowed
    desc: Registry permits ActiveX controls
    crit: component
    if:
      type: text
      regex: '(?i)"1200"\s*=\s*dword:0{8}\b'
  - id: ie-unsafe-activex-script-allowed
    desc: Registry permits unsafe ActiveX initialization
    crit: notable
    if:
      type: text
      regex: '(?i)"1201"\s*=\s*dword:0{8}\b'
  - id: ie-safe-activex-script-allowed
    desc: Registry permits safe ActiveX scripting
    crit: component
    if:
      type: text
      regex: '(?i)"1405"\s*=\s*dword:0{8}\b'

composite_rules:
  - id: registry-internet-zone-allows-unsafe-activex
    desc: Registry lowers Internet zone ActiveX restrictions
    crit: suspicious
    conf: 0.97
    all:
      - id: ie-internet-zone-key
      - id: ie-activex-run-allowed
      - id: ie-unsafe-activex-script-allowed
      - id: ie-safe-activex-script-allowed
