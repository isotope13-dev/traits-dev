defaults:
  platforms: [windows]
  for: [scripts, binaries, data]
  attack: T1562.001
  mbc: E1562

traits:
- id: defender-realtime-registry-disable-value
  desc: Defender real-time registry disable value
  crit: suspicious
  conf: 0.97
  if:
    type: text
    regex: '(?i)\bDisableRealTimeProtection\b[\s\S]{0,120}(-Value|/d)\s+["'']?1\b'
- id: defender-antispyware-registry-disable-value
  desc: Defender AntiSpyware registry disable value
  crit: suspicious
  conf: 0.97
  unless:
    - id: well-known/tool/detection/pattern-catalog::command-pattern-guard-catalog
  if:
    type: text
    regex: '(?i)\bDisableAntiSpyware\b[\s\S]{0,120}(-Value|/d)\s+["'']?1\b'

composite_rules:
- id: defender-realtime-registry-tampering
  desc: Defender real-time protection disabled in registry
  crit: hostile
  conf: 0.98
  attack: T1112,T1562.001
  all:
  - id: micro-behaviors/os/registry/keys/policy::defender-realtime-registry-key-reference
  - id: defender-realtime-registry-disable-value
- id: defender-antispyware-registry-tampering
  desc: Defender AntiSpyware disabled in registry
  crit: hostile
  conf: 0.98
  attack: T1112,T1562.001
  all:
  - id: micro-behaviors/os/registry/keys/policy::defender-policy-registry-key-reference
  - id: defender-antispyware-registry-disable-value
  near_lines: 5
