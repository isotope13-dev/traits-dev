defaults:
  platforms: [windows]
  for: [scripts, binaries, data]
  attack: T1562.001
  mbc: E1562

traits:
- id: defender-realtime-registry-key
  desc: Defender real-time protection registry key
  crit: notable
  conf: 0.95
  if:
    type: text
    regex: '(?i)HKLM:\\SOFTWARE\\Microsoft\\Windows Defender\\Real-Time Protection'
- id: defender-realtime-registry-disable-value
  desc: Defender real-time registry disable value
  crit: suspicious
  conf: 0.97
  if:
    type: text
    regex: '(?i)\bDisableRealTimeProtection\b[\s\S]{0,120}(-Value|/d)\s+["'']?1\b'
- id: defender-policy-registry-key
  desc: Microsoft Defender policy registry key
  crit: notable
  conf: 0.95
  if:
    type: text
    regex: '(?i)(HKLM[:\\]\\?)?SOFTWARE\\Policies\\Microsoft\\Windows Defender\b'
- id: defender-antispyware-registry-disable-value
  desc: Defender AntiSpyware registry disable value
  crit: suspicious
  conf: 0.97
  if:
    type: text
    regex: '(?i)\bDisableAntiSpyware\b[\s\S]{0,120}(-Value|/d)\s+["'']?1\b'

composite_rules:
- id: defender-realtime-registry-tampering
  desc: Defender real-time protection disabled in registry
  crit: hostile
  conf: 0.98
  attack: T1112,T1562.001
  all:
  - id: defender-realtime-registry-key
  - id: defender-realtime-registry-disable-value
- id: defender-antispyware-registry-tampering
  desc: Defender AntiSpyware disabled in registry
  crit: hostile
  conf: 0.98
  attack: T1112,T1562.001
  all:
  - id: defender-policy-registry-key
  - id: defender-antispyware-registry-disable-value
  near_lines: 5
