defaults:
  platforms: [windows]
  for: [scripts, binaries, data]
  attack: T1562.001
  mbc: E1562

traits:
- id: defender-realtime-registry-disable-value
  desc: Defender real-time registry disable value
  crit: suspicious
  conf: 0.97
  if:
    type: text
    regex: '(?i)\bDisableRealTimeProtection\b[\s\S]{0,120}(-Value|/d)[\s"'',]+1\b'
- id: defender-antispyware-registry-disable-value
  desc: Defender AntiSpyware registry disable value
  crit: suspicious
  conf: 0.97
  unless:
    - id: well-known/tool/detection/pattern-catalog::command-pattern-guard-catalog
  if:
    type: text
    regex: '(?i)\bDisableAntiSpyware\b[\s\S]{0,120}(-Value|/d)[\s"'',]+1\b'
# Sibling toggles of the same reg-add mechanism: the monitoring and product
# DWORDs attackers set alongside (or instead of) DisableAntiSpyware. The
# alternation exceeds the single-regex budget, so the DWORD names and the
# set-to-one tail are atoms joined by the suspicious composite below.
- id: defender-realtime-monitoring-dword-names
  desc: Defender monitoring DWORD names
  crit: notable
  conf: 0.93
  if:
    type: text
    regex: '(?i)\bDisable(RealtimeMonitoring|BehaviorMonitoring)\b'
- id: defender-protection-dword-names
  desc: Defender protection DWORD names
  crit: notable
  conf: 0.93
  if:
    type: text
    regex: '(?i)\bDisable(OnAccessProtection|ScanOnRealtimeEnable|AntiVirus)\b'
- id: registry-dword-set-to-one
  desc: Registry DWORD assignment fragment
  crit: component
  conf: 0.9
  if:
    type: text
    regex: '(-Value|/d)[\s"'',]+1\b'

composite_rules:
- id: defender-monitoring-registry-disable-value
  desc: Defender protection registry disable value
  crit: suspicious
  conf: 0.96
  near_lines: 5
  all:
  - id: registry-dword-set-to-one
  any:
  - id: defender-realtime-monitoring-dword-names
  - id: defender-protection-dword-names
  unless:
  - id: well-known/tool/detection/pattern-catalog::command-pattern-guard-catalog
- id: defender-realtime-registry-tampering
  desc: Defender real-time protection disabled in registry
  crit: hostile
  conf: 0.98
  attack: T1112,T1562.001
  all:
  - id: micro-behaviors/os/registry/policy/reference::defender-realtime-registry-key-reference
  - id: defender-realtime-registry-disable-value
- id: defender-antispyware-registry-tampering
  desc: Defender AntiSpyware disabled in registry
  crit: hostile
  conf: 0.98
  attack: T1112,T1562.001
  all:
  - id: micro-behaviors/os/registry/policy/reference::defender-policy-registry-key-reference
  - id: defender-antispyware-registry-disable-value
  near_lines: 5
- id: defender-monitoring-registry-tampering
  desc: Defender monitoring disabled in registry
  crit: hostile
  conf: 0.97
  attack: T1112,T1562.001
  all:
  - id: micro-behaviors/os/registry/policy/reference::defender-policy-registry-key-reference
  - id: defender-monitoring-registry-disable-value
  near_lines: 5
