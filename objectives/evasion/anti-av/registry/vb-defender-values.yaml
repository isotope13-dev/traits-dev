# Visual Basic source writing Defender registry values through a helper
# call whose arguments are the key, value name and data. Tamper Protection
# cannot be switched off by an ordinary program write; attempting it next to
# Defender policy Disable* values is a Defender takedown, not configuration.
defaults:
  platforms: [windows]
  for: [vbs]
  attack: T1112,T1562.001
  mbc: E1562

traits:
  # RegistryEdit("SOFTWARE\Microsoft\Windows Defender\Features", "TamperProtection", "0")
  - id: vb-defender-tamper-protection-zero
    desc: VB call sets Defender TamperProtection to 0
    crit: suspicious
    conf: 0.95
    if:
      type: text
      regex: '(?i)\\Windows Defender\\Features"\s*,\s*"TamperProtection"\s*,\s*"?0\b'

composite_rules:
  - id: vb-defender-tamper-and-policy-disable
    desc: VB zeroes Tamper Protection and Defender policy
    crit: hostile
    conf: 0.97
    all:
      - id: vb-defender-tamper-protection-zero
      - id: objectives/evasion/anti-av/defender::vb-defender-policy-disable-value
