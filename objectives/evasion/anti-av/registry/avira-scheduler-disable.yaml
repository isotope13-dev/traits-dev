defaults:
  platforms: [windows]
  for: [reg]
  attack: T1562.001

traits:
  - id: avira-scheduler-service-key
    desc: Registry targets Avira scheduler service
    crit: notable
    if:
      type: text
      regex: '(?i)Services\\AntiVirScheduler\]'
  - id: registry-service-disabled-start
    desc: Registry sets service startup to disabled
    crit: notable
    if:
      type: text
      regex: '(?i)"Start"\s*=\s*dword:0{7}4\b'

composite_rules:
  - id: avira-scheduler-disabled-registry
    desc: Registry disables the Avira scheduler service
    crit: suspicious
    conf: 0.97
    all:
      - id: avira-scheduler-service-key
      - id: registry-service-disabled-start
