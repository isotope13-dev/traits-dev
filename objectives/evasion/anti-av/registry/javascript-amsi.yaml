defaults:
  platforms:
  - windows
  for:
  - javascript
  attack: T1562.001
composite_rules:
- id: javascript-obfuscated-wsh-amsi-disable
  desc: Obfuscated JavaScript disables WSH AMSI
  crit: hostile
  conf: 0.99
  attack: T1027,T1059.007,T1562.001
  all:
  - id: micro-behaviors/os/security/amsi::js-amsi-enable-letter-array
  - id: micro-behaviors/os/registry/value/write::wscript-regwrite
  any:
  - id: micro-behaviors/os/registry/policy/reference::wsh-script-settings-registry-path
  - id: metadata/lang/source/naming/interface/runtime::wmi-stdregprov-name-reference
