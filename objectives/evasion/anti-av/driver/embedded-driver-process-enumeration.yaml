defaults:
  platforms: [windows]
  for: [pe]

composite_rules:
  # An unsigned binary carrying an embedded executable image in its
  # data, walking the process snapshot, terminating processes, and
  # referencing kernel-module paths is staging a kernel payload while
  # clearing user-mode security products out of its way.
  - id: unsigned-embedded-driver-process-termination
    desc: Unsigned embedded-driver carrier enumerates and terminates processes
    crit: hostile
    conf: 0.95
    attack: T1014,T1562.001
    all:
      - id: micro-behaviors/data/embedded/payload/header::dos-executable-header-in-data
      - id: micro-behaviors/process/enumerate/snapshot::process32-first
      - id: micro-behaviors/process/terminate/kill::terminate-process
      - id: micro-behaviors/fs/path/library::windows-kernel-module-reference
      - id: metadata/signed/trust-level::unsigned-missing-signature-record
    unless:
      - id: metadata/signed/platform/
      - id: well-known/app/
      - id: well-known/tool/sysadmin/
