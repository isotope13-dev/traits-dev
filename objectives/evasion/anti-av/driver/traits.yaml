defaults:
  platforms: [windows]
  for: [pe, dll]
  attack: T1562.001
  mbc: F0004

traits:
  - id: protected-process-targeting-reference
    desc: Protected-process control reference
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: '(?i)\b(protected\s+process|process\s+protection)\b'

  # The ObRegisterCallbacks atom that used to live here duplicated
  # micro-behaviors/os/kernel/callback::object-handle-callback-registration;
  # the composites below reference that canonical atom instead.

  # These are method-name markers from a driver-backed security-process
  # controller. Each name is only a fragment; hostile judgments require
  # multiple markers alongside device I/O.
  - id: antivirus-process-enumeration-routine
    desc: Antivirus-process enumeration routine name
    crit: notable
    conf: 0.92
    if:
      type: text
      substr: GetAntivirusProcesses

  - id: driver-install-and-start-routine
    desc: Driver install-and-start routine name
    crit: notable
    conf: 0.88
    if:
      type: text
      substr: InstallAndStart

  - id: driver-stop-and-delete-routine
    desc: Driver stop-and-delete routine name
    crit: notable
    conf: 0.88
    if:
      type: text
      substr: StopAndDelete

  - id: driver-kill-control-routine
    desc: Driver process-kill control routine name
    crit: component
    conf: 0.9
    if:
      type: text
      regex: '(?i)(GetKill|BuildKill)[A-Za-z0-9_]+'

  # These identifiers name drivers with exposed kernel-memory primitives.
  # A name alone is useful analyst context, not proof that the driver is
  # being abused; the hostile client composite below supplies registration,
  # startup, device-handle, and IOCTL evidence.
  - id: vulnerable-driver-device--rtcore64
    desc: RTCore64 vulnerable-driver identifier
    crit: notable
    conf: 0.96
    if:
      type: text
      word: RTCore64
    unless:
      - id: metadata/signed/certificate/identity::pe-signature-verified-kv

  - id: vulnerable-driver-device--dbutil-2-3
    desc: DBUtil_2_3 vulnerable-driver identifier
    crit: notable
    conf: 0.96
    if:
      type: text
      word: DBUtil_2_3

  - id: vulnerable-driver-device--defaultrtcoreconfig
    desc: Default RTCore configuration identifier
    crit: notable
    conf: 0.96
    if:
      type: text
      word: DefaultRTCoreConfig

  - id: vulnerable-driver-device--defaultdbutilconfig
    desc: Default DBUtil configuration identifier
    crit: notable
    conf: 0.96
    if:
      type: text
      word: DefaultDBUtilConfig

  - id: vulnerable-driver-device--iqvw64
    desc: Intel iQVW64 vulnerable-driver reference
    crit: notable
    conf: 0.99
    for: [pe, dll, c, cpp, rust, go, csharp, powershell, python, batch]
    if:
      type: text
      regex: '(?i)\b(iQVW64\.SYS|iqvw64e\.sys|IQVW32\.sys|NalDrv\.sys)\b'

  - id: vulnerable-driver-device--pdfwkrnl
    desc: AMD PDFWKRNL vulnerable-driver reference
    crit: notable
    conf: 0.98
    for: [pe, dll, c, cpp, rust, go, csharp, powershell, python, batch]
    if:
      type: text
      regex: '(?i)\b(PDFWKRNL\.sys|PdFwKrnl)\b'

  - id: vulnerable-driver-image-source--rtcore64
    desc: RTCore64 vulnerable driver image reference
    crit: notable
    conf: 0.97
    for: [c, cpp, rust, go, csharp, powershell, python, batch]
    if:
      type: text
      word: RTCore64.sys

  - id: vulnerable-driver-image-source--dbutil-2-3
    desc: DBUtil_2_3 vulnerable driver image reference
    crit: notable
    conf: 0.97
    for: [c, cpp, rust, go, csharp, powershell, python, batch]
    if:
      type: text
      word: DBUtil_2_3.sys

composite_rules:
  - id: vulnerable-driver-device
    desc: Known vulnerable-driver identifier
    crit: notable
    conf: 0.96
    for: [pe, dll, c, cpp, rust, go, csharp, powershell, python, batch]
    any:
      - id: vulnerable-driver-device--rtcore64
      - id: vulnerable-driver-device--dbutil-2-3
      - id: vulnerable-driver-device--defaultrtcoreconfig
      - id: vulnerable-driver-device--defaultdbutilconfig
      - id: vulnerable-driver-device--iqvw64
      - id: vulnerable-driver-device--pdfwkrnl
      - id: vulnerable-driver-image-source--rtcore64
      - id: vulnerable-driver-image-source--dbutil-2-3

  - id: vulnerable-driver-device-client
    desc: Registers, starts, and controls a known vulnerable driver
    crit: hostile
    conf: 0.99
    for: [pe, c]
    attack: "T1068,T1562.001"
    all:
      - id: vulnerable-driver-device
      - id: micro-behaviors/os/service/driver::kernel-driver-service-registration
      - id: micro-behaviors/os/service/start::start-service
      - id: micro-behaviors/fs/file/handle::kernel-device-io-control

  - id: protected-process-driver-termination
    desc: Driver-backed termination of protected processes
    crit: hostile
    conf: 0.98
    all:
      - id: objectives/persistence/system/service/install::service-install-and-start
      - id: micro-behaviors/fs/file/handle::device-io-control-win
      - id: micro-behaviors/process/terminate/kill::kernel-terminate-process-reference
    any:
      - id: protected-process-targeting-reference
      - id: micro-behaviors/os/kernel/callback::object-handle-callback-registration
      - id: micro-behaviors/os/security/product::antivirus-product-term

  - id: object-callback-process-protection
    desc: Object callback strips process handle rights
    crit: suspicious
    conf: 0.95
    for: [c, cpp, rust]
    all:
      - id: micro-behaviors/os/kernel/callback::object-handle-callback-registration
      - id: micro-behaviors/os/kernel/callback::handle-access-mask-rewrite

  - id: driver-backed-antivirus-process-control
    desc: Driver-backed antivirus process control
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/fs/file/handle::device-io-control-win
      - id: antivirus-process-enumeration-routine
      - id: driver-kill-control-routine
    any:
      - id: driver-install-and-start-routine
      - id: driver-stop-and-delete-routine
    needs: 1
    unless:
      - id: metadata/signed/platform/

  # A legitimate hardware/vendor kernel driver manages a device; it has no
  # reason for its own code to open and terminate arbitrary processes, nor to
  # hide which kernel routines it calls behind runtime resolution instead of
  # a normal import table. A small, resource-less, unsigned driver whose
  # entire capability set is "kill something, and don't show imports doing
  # it" has no legitimate device to manage — this is the generic kill
  # primitive that BYOVD-manual-mapped AV/EDR/anti-cheat killers ship,
  # independent of which specific security product it targets or how it
  # gets loaded (service install vs. manual kernel mapping).
  - id: unsigned-kernel-kill-primitive-driver
    desc: Unsigned kernel driver exposes a generic process-kill primitive
    crit: hostile
    conf: 0.95
    all:
      - id: micro-behaviors/os/kernel/module::windows-kernel-driver
      - id: micro-behaviors/os/kernel/routines::kernel-process-termination
      - id: micro-behaviors/os/kernel/routines::dynamic-resolution-symbol
      - id: metadata/binary/resource/size::small-pe-no-resources
    unless:
      - id: metadata/signed/platform/
