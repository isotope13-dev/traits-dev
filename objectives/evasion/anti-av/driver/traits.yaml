defaults:
  platforms: [windows]
  for: [pe, dll]
  attack: T1562.001
  mbc: F0004

traits:
  - id: protected-process-targeting-reference
    desc: Protected-process control reference
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: '(?i)\b(protected\s+process|process\s+protection)\b'

  # The ObRegisterCallbacks atom that used to live here duplicated
  # micro-behaviors/os/kernel/callback::object-handle-callback-registration;
  # the composites below reference that canonical atom instead.

  # These are method-name markers from a driver-backed security-process
  # controller. Each name is only a fragment; hostile judgments require
  # multiple markers alongside device I/O.
  - id: antivirus-process-enumeration-routine
    desc: Antivirus-process enumeration routine name
    crit: component
    conf: 0.92
    if:
      type: text
      substr: GetAntivirusProcesses

  - id: driver-install-and-start-routine
    desc: Driver install-and-start routine name
    crit: component
    conf: 0.88
    if:
      type: text
      substr: InstallAndStart

  - id: driver-stop-and-delete-routine
    desc: Driver stop-and-delete routine name
    crit: component
    conf: 0.88
    if:
      type: text
      substr: StopAndDelete

  - id: driver-kill-control-routine
    desc: Driver process-kill control routine name
    crit: component
    conf: 0.9
    if:
      type: text
      regex: '(?i)(GetKill|BuildKill)[A-Za-z0-9_]+'

composite_rules:
  - id: protected-process-driver-termination
    desc: Driver-backed termination of protected processes
    crit: hostile
    conf: 0.98
    all:
      - id: objectives/persistence/system/service/install::service-install-and-start
      - id: micro-behaviors/fs/file/handle::device-io-control-win
      - id: micro-behaviors/process/terminate/kill::kernel-terminate-process-reference
    any:
      - id: protected-process-targeting-reference
      - id: micro-behaviors/os/kernel/callback::object-handle-callback-registration
      - id: micro-behaviors/os/security/product::antivirus-product-term

  - id: object-callback-process-protection
    desc: Object callback strips process handle rights
    crit: suspicious
    conf: 0.95
    for: [c, cpp, rust]
    all:
      - id: micro-behaviors/os/kernel/callback::object-handle-callback-registration
      - id: micro-behaviors/os/kernel/callback::handle-access-mask-rewrite

  - id: driver-backed-antivirus-process-control
    desc: Driver-backed antivirus process control
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/fs/file/handle::device-io-control-win
      - id: antivirus-process-enumeration-routine
      - id: driver-kill-control-routine
    any:
      - id: driver-install-and-start-routine
      - id: driver-stop-and-delete-routine
    needs: 1
    unless:
      - id: metadata/signed/platform/
