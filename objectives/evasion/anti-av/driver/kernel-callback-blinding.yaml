defaults:
  platforms: [windows]
  for: [pe, dll, c, cpp, rust, go, csharp, python, powershell]
  attack: T1562.001
  mbc: F0004

composite_rules:
  # User-mode tools have no legitimate API reason to resolve undocumented
  # Psp*NotifyRoutine or CmCallbackListHead kernel tables and issue
  # DeviceIoControl requests against a driver to inspect or zero them.
  - id: userland-driver-kernel-callback-tampering
    desc: User-mode client accesses internal kernel callbacks via driver IOCTL
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/os/kernel/callback::any-internal-kernel-callback-table
      - id: micro-behaviors/fs/file/handle::device-io-control-win32-or-nt
      - id: micro-behaviors/os/kernel/callback::kernel-base-or-image-resolution
    any:
      - id: micro-behaviors/dylib/lookup::get-proc-address-import
      - id: micro-behaviors/dylib/lookup::get-proc-address-source-call
      - id: micro-behaviors/os/kernel/device::vulnerable-driver-device
      - id: micro-behaviors/os/service/start::start-service
    unless:
      - id: well-known/app/system/microsoft/platform::microsoft-nt-kernel-image
      - id: metadata/signature/verified/platform::microsoft

  - id: byovd-service-load-kernel-callback-strip
    desc: Loads a kernel driver service and targets kernel notification callback arrays
    crit: hostile
    conf: 0.99
    attack: T1562.001,T1543.003
    for: [pe, dll, c, cpp]
    all:
      - id: micro-behaviors/os/service/create::create-service
      - id: micro-behaviors/os/service/start::start-service
      - id: micro-behaviors/fs/file/handle::device-io-control-win32-or-nt
      - id: micro-behaviors/os/kernel/callback::any-internal-kernel-callback-table
      - id: micro-behaviors/os/kernel/callback::kernel-base-or-image-resolution
    unless:
      - id: metadata/signature/verified/

  - id: vulnerable-driver-callback-blinding-client
    desc: Known vulnerable-driver client targets Windows kernel notification callbacks
    crit: hostile
    conf: 0.99
    all:
      - id: micro-behaviors/os/kernel/device::vulnerable-driver-device
      - id: micro-behaviors/fs/file/handle::device-io-control-win32-or-nt
      - id: micro-behaviors/os/kernel/callback::any-internal-kernel-callback-table
      - id: micro-behaviors/os/kernel/callback::kernel-base-or-image-resolution
    unless:
      - id: metadata/signature/verified/
