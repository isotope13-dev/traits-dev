defaults:
  platforms: [windows]
  for: [pe, dll, c, cpp, rust, go, csharp, python, powershell]
  attack: T1562.001
  mbc: F0004

composite_rules:
  # Reading Psp*/Cm* callback tables through a driver is shared by
  # anti-rootkit scanners and malware removers (see
  # micro-behaviors/os/kernel/callback::userland-driver-callback-array-access).
  # EDR killers additionally name the security components whose callbacks
  # they locate and remove; that target list supplies the intent.
  - id: driver-callback-client-edr-targeting
    desc: Driver callback client targets EDR components
    crit: hostile
    conf: 0.96
    for: [pe, dll, c, cpp, rust, go, csharp, powershell]
    all:
      - id: micro-behaviors/os/kernel/callback::userland-driver-callback-array-access
      - id: micro-behaviors/os/application/target/security::edr-component-image-reference

  - id: byovd-service-load-kernel-callback-strip
    desc: Loads a kernel driver service and targets kernel notification callback arrays
    crit: hostile
    conf: 0.99
    attack: T1562.001,T1543.003
    for: [pe, dll, c, cpp]
    all:
      - id: micro-behaviors/os/service/create::create-service
      - id: micro-behaviors/os/service/start::start-service
      - id: micro-behaviors/fs/file/handle::device-io-control-win32-or-nt
      - id: micro-behaviors/os/kernel/callback::any-internal-kernel-callback-table
      - id: micro-behaviors/os/kernel/callback::kernel-base-or-image-resolution
    unless:
      - id: metadata/signature/verified/

  - id: vulnerable-driver-callback-blinding-client
    desc: Known vulnerable-driver client targets Windows kernel notification callbacks
    crit: hostile
    conf: 0.99
    all:
      - id: micro-behaviors/os/kernel/device::vulnerable-driver-device
      - id: micro-behaviors/fs/file/handle::device-io-control-win32-or-nt
      - id: micro-behaviors/os/kernel/callback::any-internal-kernel-callback-table
      - id: micro-behaviors/os/kernel/callback::kernel-base-or-image-resolution
    # A removal tool may list an abused driver's device as a cleanup IOC
    # beside its own anti-rootkit callback scan. A blinding client also
    # loads the driver or names the security components it blinds.
    any:
      - id: micro-behaviors/os/kernel/driver::kernel-driver-service-configuration
      - id: micro-behaviors/os/application/target/security::edr-component-image-reference
    unless:
      - id: metadata/signature/verified/
