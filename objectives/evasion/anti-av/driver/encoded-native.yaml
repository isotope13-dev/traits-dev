defaults:
  platforms: [windows]
  for: [pe, dll]
  attack: T1562.001
  mbc: B0005

traits:
  - id: ntiolib-driver-name
    desc: NTIOLib kernel driver name
    crit: component
    conf: 0.97
    if:
      type: text
      regex: '(?i)\bNTIOLib[A-Za-z0-9]{0,40}\b'

  - id: procexp-driver-device
    desc: Process Explorer kernel driver device path
    crit: notable
    conf: 0.97
    if:
      type: text
      regex: '(?i)\\Device\\PROCEXP\d+\b'

  - id: procexp-driver-filename
    desc: Process Explorer kernel driver filename
    crit: component
    conf: 0.97
    if:
      type: text
      regex: '(?i)\bPROCEXP\d+\.sys\b'

  - id: ntoskrnl-system-path
    desc: Windows kernel image system path
    crit: notable
    conf: 0.9
    if:
      type: text
      exact: C:\Windows\System32\ntoskrnl.exe

composite_rules:
  - id: kernel-driver-tooling
    desc: Kernel driver artifact reference
    crit: suspicious
    conf: 0.97
    any:
      - id: ntiolib-driver-name
      - id: procexp-driver-device
      - id: procexp-driver-filename
      - id: ntoskrnl-system-path
    unless:
      # JetBrains' signed module inventory lists these driver names as data;
      # it does not load them or use them for security-product tampering.
      - id: well-known/tool/development/editor/jetbrains::signed-jetbrains-binary
      # Process Explorer embeds its own signed inspection driver and therefore
      # contains PROCEXP device names and normal kernel-driver references.
      # Handle ships the same driver, and the driver image is that driver.
      - id: well-known/tool/sysadmin/sysinternals::sysinternals-process-explorer
      - id: well-known/tool/sysadmin/sysinternals::process-explorer-build-identity
      - id: well-known/tool/sysadmin/sysinternals::sysinternals-process-explorer-driver
      - id: well-known/tool/sysadmin/sysinternals::sysinternals-handle
      - id: well-known/game/cs2::lust-cs2-cheat-loader

  - id: encoded-kernel-edr-tampering
    desc: Encoded kernel-assisted EDR tampering
    crit: hostile
    conf: 0.99
    all:
      - id: micro-behaviors/os/kernel/callback::process-lifecycle-callback
      - id: kernel-driver-tooling
      - id: objectives/impact/degrade/edr/teardown::encoded-security-process-target-list
    unless:
      - id: metadata/binary/vendor::microsoft-signed-system-component-context

  - id: kernel-assisted-persistent-tampering
    desc: Kernel-assisted persistent security tampering
    crit: hostile
    conf: 0.99
    all:
      - id: kernel-driver-tooling
      - id: objectives/persistence/login/startup/registry::encoded-run-key-persistence
    unless:
      - id: metadata/binary/vendor::microsoft-signed-system-component-context
