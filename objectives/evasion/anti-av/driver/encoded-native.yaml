defaults:
  platforms: [windows]
  for: [pe, dll]
  attack: T1562.001
  mbc: B0005

traits:
  - id: kernel-driver-tooling
    desc: Kernel driver tooling references
    crit: suspicious
    conf: 0.97
    if:
      type: text
      regex: '(?i)\b(NTIOLib[A-Za-z0-9]+|PROCEXP\d+)\b|C:\\Windows\\System32\\ntoskrnl\.exe'
    unless:
      # Process Explorer embeds its own signed inspection driver and therefore
      # contains PROCEXP device names and normal kernel-driver references.
      - id: well-known/tool/sysadmin/sysinternals::sysinternals-process-explorer

composite_rules:
  - id: encoded-kernel-edr-tampering
    desc: Encoded kernel-assisted EDR tampering
    crit: hostile
    conf: 0.99
    all:
      - id: micro-behaviors/os/kernel/callback::process-lifecycle-callback
      - id: kernel-driver-tooling
      - id: objectives/impact/degrade/edr/teardown::encoded-security-process-target-list
    unless:
      - id: metadata/binary/vendor::microsoft-signed-system-component-context

  - id: kernel-assisted-persistent-tampering
    desc: Kernel-assisted persistent security tampering
    crit: hostile
    conf: 0.99
    all:
      - id: kernel-driver-tooling
      - id: objectives/persistence/login/startup/registry::encoded-run-key-persistence
    unless:
      - id: metadata/binary/vendor::microsoft-signed-system-component-context
