# Security Center blinding - Windows
# Silencing the OS security-posture monitor (XP-era SOFTWARE\Microsoft\Security
# Center and its DisableNotify/Override values) so the user stops seeing that
# antivirus, firewall or update protection is off.
defaults:
  attack: T1562.001
  for: [pe, dll]
  platforms: [windows]

composite_rules:
  # Security products register with the Security Center through its API, not
  # by writing the raw DisableNotify/Override values; a program naming the key
  # plus two or more of those value names with the RegSetValueEx write chain
  # is switching the monitor off. Worm families (Sality, Kido, Brontok) use
  # this to hide their disabled defenses from the user.
  - id: security-center-notify-disabled
    desc: Disables Security Center monitoring via registry
    crit: hostile
    conf: 0.9
    all:
      - id: micro-behaviors/os/security/policy::security-center-key-path
      - id: micro-behaviors/os/security/policy::security-center-notify-values
      - id: micro-behaviors/os/registry/access::registry-write-api-chain
    unless:
      # These strings and API imports also occur in tiny PE controls whose
      # entry point immediately returns and whose only populated data
      # directory is the import table. Such an image cannot perform the
      # claimed registry change through its entry point.
      - id: metadata/binary/code/entry::inert-tiny-pe-entry
      - id: metadata/signed/platform/
      - id: metadata/vendor/string::microsoft-corporation-name-reference
