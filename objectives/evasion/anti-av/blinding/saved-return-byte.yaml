defaults:
  platforms: [windows]
  for: [pe, dll]
  arch: [x86-64]
composite_rules:
  # Export names and the patch helper are separate functions. This is a
  # probable ETW patch profile, not a statically bound source-to-write claim.
  - id: native-etw-saved-byte-return-patch
    desc: ETW API with saved-byte RET patch code
    crit: suspicious
    conf: 0.97
    attack: T1562.006
    all:
      - id: micro-behaviors/os/telemetry/logging/etw::etw-event-write-str
      - id: micro-behaviors/mem/write/arbitrary::x64-save-byte-overwrite-ret
      - id: micro-behaviors/mem/protect/modify::virtual-protect
