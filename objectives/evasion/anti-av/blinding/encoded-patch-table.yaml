defaults:
  platforms:
  - windows
  for:
  - pe
  - dll
composite_rules:
- id: encoded-amsi-etw-return-zero-patcher
  desc: Encoded AMSI/ETW targets and return-zero stubs
  crit: hostile
  conf: 0.98
  attack: T1562.001
  all:
  - id: micro-behaviors/os/security/amsi::scan-buffer-api-xor
  - id: micro-behaviors/os/telemetry/logging/etw::etw-event-write-xor
  - id: micro-behaviors/data/embedded/payload/patch-stubs::varied-return-zero-stubs
  - id: micro-behaviors/mem/protect/modify::virtual-protect
  - id: micro-behaviors/mem/copy::native-memcpy-import
- id: encoded-etw-zero-return-patch
  desc: Encoded ETW target with zero-return patch write
  crit: hostile
  conf: 0.98
  attack: T1562.006
  all:
  - id: micro-behaviors/os/telemetry/logging/etw::etw-event-write-xor
  - id: micro-behaviors/mem/write/arbitrary::x64-store-zero-return-stub
  - id: micro-behaviors/mem/protect/modify::virtual-protect
