defaults:
  platforms:
  - linux
  - macos
  - windows
  for:
  - java
  - class
  attack: T1562.001
traits:
- id: openrasp-disable-hooks-setter-name
  desc: OpenRASP disable-hooks setter name
  crit: component
  conf: 0.9
  for:
  - class
  if:
    type: value
    path: class.strings[*]
    exact: setDisableHooks
- id: openrasp-allow-all-setter-name
  desc: OpenRASP allow-all hooks setter name
  crit: component
  conf: 0.9
  for:
  - class
  if:
    type: value
    path: class.strings[*]
    exact: setHookWhiteAll
composite_rules:
- id: openrasp-hook-disable-blinding
  desc: OpenRASP hook-disabling reflective setters
  crit: hostile
  conf: 0.99
  for:
  - class
  - java_class
  all:
  - id: micro-behaviors/os/application/target::openrasp-internals-reference
  - id: micro-behaviors/metaprogramming/reflection::java-bytecode-reflective-method-invoke
  - id: openrasp-disable-hooks-setter-name
  - id: openrasp-allow-all-setter-name
- id: openrasp-reflective-tamper
  desc: OpenRASP hook guard reflective field write
  crit: hostile
  conf: 0.99
  for:
  - class
  - java_class
  all:
  - id: micro-behaviors/os/application/target::openrasp-internals-reference
  - id: micro-behaviors/metaprogramming/reflection::java-set-accessible-string
  - id: micro-behaviors/data/property/access::hook-enable-field-name
  - id: micro-behaviors/metaprogramming/reflection::java-reflect-field-set
