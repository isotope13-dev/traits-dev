# Java classes that blind OpenRASP from inside the JVM: reflective access to
# com.baidu.openrasp internals paired with hook-disable calls. Legitimate
# OpenRASP plugins reference the public API, not HookHandler/config fields
# plus setAccessible and disable-hooks vocabulary.
defaults:
  platforms: [linux, macos, windows]
  for: [java, class]
  attack: "T1562.001"

traits:
  - id: openrasp-internals-reference
    desc: OpenRASP internals package reference
    crit: component
    conf: 0.9
    for: [class, java_class]
    if:
      type: value
      path: class.strings[*]
      substr: 'com.baidu.openrasp.'
  - id: openrasp-hook-disable-vocabulary
    desc: OpenRASP hook-disable method vocabulary
    crit: component
    conf: 0.9
    for: [class, java_class]
    if:
      type: value
      path: class.strings[*]
      regex: 'setDisableHooks|setHookWhiteAll'

composite_rules:
  - id: openrasp-hook-disable-blinding
    desc: OpenRASP hook-disable blinding vocabulary
    crit: suspicious
    conf: 0.93
    for: [class, java_class]
    all:
      - id: openrasp-internals-reference
      - id: openrasp-hook-disable-vocabulary
  - id: openrasp-reflective-tamper
    desc: Reflective tampering with OpenRASP internals
    crit: suspicious
    conf: 0.92
    for: [class, java_class]
    all:
      - id: openrasp-internals-reference
      - id: "micro-behaviors/metaprogramming/reflection::java-set-accessible-string"
