defaults:
  platforms:
  - linux
  - macos
  - windows
  for:
  - java
  - class
  attack: T1562.001
traits:
- id: openrasp-disable-hooks-setter-name
  desc: OpenRASP disable-hooks setter name
  crit: component
  conf: 0.9
  for:
  - class
  if:
    type: value
    path: class.strings[*]
    exact: setDisableHooks
- id: openrasp-allow-all-setter-name
  desc: OpenRASP allow-all hooks setter name
  crit: component
  conf: 0.9
  for:
  - class
  if:
    type: value
    path: class.strings[*]
    exact: setHookWhiteAll
composite_rules:
- id: openrasp-hook-disable-blinding
  desc: OpenRASP disable-hooks and allow-all reflective calls
  crit: hostile
  conf: 0.99
  for:
  - class
  - java_class
  all:
  - id: well-known/lib/vendor-sdk/openrasp::openrasp-internals-reference
  - id: micro-behaviors/metaprogramming/reflection/invoke::java-bytecode-reflective-method-invoke
  - id: openrasp-disable-hooks-setter-name
  - id: openrasp-allow-all-setter-name
  - id: metadata/lang/source/literal/string/label::jvm-true-value-string
- id: openrasp-webshell-delivered-blinding
  desc: JSP-delivered payload disables OpenRASP hooks
  crit: hostile
  conf: 0.98
  for:
  - class
  - java_class
  all:
  - id: micro-behaviors/communications/http/server/request::jvm-jsp-request-accessor
  - id: micro-behaviors/process/interpreter/runtime/jvm::java-class-forname-bytecode
  any:
  - id: openrasp-hook-disable-blinding
  - id: openrasp-reflective-tamper
- id: openrasp-reflective-tamper
  desc: OpenRASP hook guard replaced with a disabled value
  crit: hostile
  conf: 0.99
  for:
  - class
  - java_class
  all:
  - id: well-known/lib/vendor-sdk/openrasp::openrasp-internals-reference
  - id: micro-behaviors/metaprogramming/reflection/modify/accessibility::set-accessible-reference
  - id: metadata/lang/source/naming/flag::hook-enable-field-name
  - id: micro-behaviors/metaprogramming/reflection/modify/member::java-reflect-field-set
  - id: metadata/binary/code/bytecode::jvm-null-target-false-object-call
