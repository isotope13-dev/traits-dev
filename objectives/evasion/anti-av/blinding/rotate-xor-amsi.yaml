defaults:
  platforms: [windows]
  for: [pe, dll]
  arch: [x86-64]
composite_rules:
  - id: concealed-amsi-session-local-patch
    desc: Concealed AMSI session target with local patch code
    crit: hostile
    conf: 0.99
    attack: T1562.001
    all:
      - id: micro-behaviors/os/security/amsi::rotate-xor-open-session-name
      - id: objectives/anti-static/obfuscation/imports/concealment::tls-rotate-xor-api-names
      - id: micro-behaviors/mem/write/arbitrary::x64-local-xor-rax-patch-write-profile
      - id: micro-behaviors/mem/protect/modify::virtual-protect
