defaults:
  platforms: [windows]
  for: [pe, go]
  attack: T1562.001

traits:
  - id: go-amsi-scanbuffer-name
    desc: Go AMSI patch helper
    crit: notable
    conf: 0.92
    if:
      type: symbol
      exact: main.getAmsiScanBufferName

  - id: go-etw-eventwrite-name
    desc: Go ETW patch helper
    crit: notable
    conf: 0.92
    if:
      type: symbol
      exact: main.getEtwEventWriteName

  - id: go-minidumpwritedump-patch
    desc: Go MiniDump patch helper
    crit: notable
    conf: 0.95
    if:
      type: symbol
      exact: main.patchMiniDumpWriteDump

  - id: go-minidumpwritedump-name
    desc: Go MiniDump name helper
    crit: notable
    conf: 0.9
    if:
      type: symbol
      exact: main.getMiniDumpWriteDumpName

composite_rules:
  - id: go-defender-disable-with-xor-masked-pe
    desc: Go Defender-disable commands with masked PE
    crit: hostile
    conf: 0.99
    for: [pe]
    attack: T1027,T1562.001,T1106
    all:
      - id: micro-behaviors/os/security/defender::defender-disable-realtime
      - id: micro-behaviors/os/security/defender::defender-exclusion-command
      - id: metadata/binary/layout/embedded::xor-dword-masked-pe-in-data
      - id: micro-behaviors/process/create/shellexec::shell-execute-call
      - id: metadata/lang/compiler/systems::go-buildinfo
      - id: micro-behaviors/process/create/spawn::go-os-exec-package-reference

  - id: go-telemetry-blinding-patches
    desc: Patches AMSI ETW and MiniDump
    crit: hostile
    conf: 0.98
    needs: 3
    any:
      - id: go-amsi-scanbuffer-name
      - id: go-etw-eventwrite-name
      - id: go-minidumpwritedump-patch
      - id: go-minidumpwritedump-name
    unless:
      - id: metadata/signed/platform/

