# A managed loader that blinds AMSI in its own process and also reads its own
# file or a base64 blob to recover a payload. The AMSI names and the encoded
# VirtualProtect name are each notable alone; their co-occurrence with a
# delegate-based native call and a self-read or base64 decode is the loader.
defaults:
  platforms: [windows]
  for: [pe]
  attack: T1562.001,T1027,T1620

composite_rules:
  - id: managed-amsi-blind-self-payload-loader
    desc: Managed loader blinds AMSI and decodes an embedded payload
    crit: hostile
    conf: 0.93
    all:
      - id: micro-behaviors/os/security/amsi::library-and-scan-buffer-name-pair
      - id: micro-behaviors/mem/protect/modify/encoded-reference::xor-decoded-virtual-protect-api
      - id: micro-behaviors/os/api-resolution/dynamic::managed-function-pointer-delegate
    any:
      - id: micro-behaviors/fs/read/file/content/whole::cil-file-readallbytes-call
      - id: micro-behaviors/data/decode/base64/reference::dotnet-frombase64string-text
    needs: 1
