defaults:
  platforms: [windows]
  for: [pe, dll]
traits:
  - id: managed-etw-zero-return-byte-write-profile
    desc: ETW APIs with managed zero-return byte writes
    crit: suspicious
    conf: 0.98
    attack: T1562.006
    if:
      type: yara
      source: |
        import "pe"
        rule managed_etw_zero_return_byte_write_profile {
          strings:
            $clr = "BSJB" ascii
            $etw = "EtwEventWrite" ascii wide fullword
            $protect = "VirtualProtect" ascii wide fullword
            $write = "WriteByte" ascii fullword
            // CIL call operands are MemberRef tokens, not build-specific IDs.
            // Pass 0x33 at offset zero, 0xc0 at one, and 0xc3 at two.
            $writes = { 06 1F 33 28 ?? ?? ?? 0A
                        06 17 20 C0 00 00 00 28 ?? ?? ?? 0A
                        06 18 20 C3 00 00 00 28 ?? ?? ?? 0A }
          condition:
            all of ($clr, $etw, $protect, $write) and
            for any i in (0 .. pe.number_of_sections - 1) : (
              pe.sections[i].name == ".text" and
              $writes in (pe.sections[i].raw_data_offset ..
                pe.sections[i].raw_data_offset + pe.sections[i].raw_data_size - 1)
            )
        }
