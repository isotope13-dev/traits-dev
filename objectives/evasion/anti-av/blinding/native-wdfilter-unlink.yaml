defaults:
  arch: [x86-64]
  platforms:
  - windows
  for:
  - pe
  - dll
  attack: T1562.001
traits:
- id: native-wdfilter-driver-copy-unlink-code
  desc: WdFilter unlink via kernel-memory copies
  crit: suspicious
  conf: 0.99
  if:
    type: yara
    source: |
      import "pe"
      rule native_wdfilter_driver_copy_unlink {
       strings:
        $target = "WdFilter.sys" ascii wide nocase
        $copy = { BA 07 20 86 80 [0-64] 49 C7 43 C0 33 00 00 00 [0-24] FF 15 ?? ?? ?? ?? }
        $unlink = { 48 8D 57 08 45 8B C7 48 8D 4D ?? E8 ?? ?? ?? ?? F6 D8 48 1B C9 48 23 4D ?? 48 89 4D ?? 48 8B 4D ?? 49 03 CF 45 8B C7 48 8D 55 ?? E8 ?? ?? ?? ?? 45 8B C7 48 8D 55 ?? 48 8B 4D ?? E8 ?? ?? ?? ?? }
       condition:
        pe.is_pe and $target and $copy and $unlink
      }
composite_rules:
- id: native-wdfilter-driver-copy-unlink
  desc: Loaded driver unlinks WdFilter kernel records
  crit: hostile
  conf: 0.99
  all:
  - id: native-wdfilter-driver-copy-unlink-code
  - id: micro-behaviors/os/kernel/module::load-driver-api
