# ETW Blinding Detection
# ATT&CK: T1562.006 (Indicator Removal: ETW Blinding)
defaults:
  platforms: [windows]
  for: [binaries, pe, dll]

traits:
  - id: etw-write-after-api-string
    desc: ETW API followed by native memory write
    crit: suspicious
    conf: 0.95
    for: [csharp, pe, dll]
    if:
      type: text
      regex: '(?is)EtwEventWrite.{0,320}(Marshal\.Copy|VirtualProtect|m_Writer\s*\()'

  - id: etw-patch-xor-ret
    desc: ETW patch bytes (xor eax,eax; ret)
    crit: component
    conf: 0.9
    if:
      type: text
      regex: '(?i)0x33\s*,?\s*0xC0\s*,?\s*0xC3'
    for: [c, cpp, csharp, pe, dll]

  - id: etw-event-write-symbol
    desc: EtwEventWrite symbol reference
    crit: component
    conf: 0.8
    if:
      type: symbol
      exact: EtwEventWrite

  - id: nttraceevent-api-reference
    desc: NtTraceEvent telemetry API reference
    crit: component
    conf: 0.95
    for: [pe, dll]
    if:
      type: text
      word: NtTraceEvent

  - id: nttraceevent-noop-patch
    desc: x86 NtTraceEvent no-op patch
    crit: suspicious
    conf: 0.99
    attack: T1562.006
    for: [pe, dll]
    arch: [x86]
    if:
      type: hex
      section: .text
      pattern: 'C7 03 48 33 C0 C3'

  - id: csharp-etw-api-resolution
    desc: C# resolves EtwEventWrite from ntdll
    crit: suspicious
    conf: 0.97
    attack: T1562.006
    for: [csharp]
    if:
      type: text
      regex: '(?s)LoadLibrary\("ntdll\.dll"\).{0,120}GetProcAddress.{0,50}"EtwEventWrite"'

  - id: native-etw-target-reference
    desc: Native PE links EtwEventWrite to ntdll.dll
    crit: component
    conf: 0.95
    for: [pe, dll]
    if:
      type: text
      regex: '(?is)(ntdll\.dll.{0,320}EtwEventWrite|EtwEventWrite.{0,320}ntdll\.dll)'

composite_rules:
  - id: etw-blinding-patch
    desc: Disables ETW by patching EtwEventWrite
    crit: hostile
    conf: 0.98
    all:
      - id: etw-write-after-api-string
    any:
      - id: etw-patch-xor-ret
      - id: etw-event-write-symbol
    unless:
      - id: metadata/signed/platform/

  - id: csharp-etw-dynamic-memory-patch
    desc: C# dynamically patches EtwEventWrite
    crit: hostile
    conf: 0.98
    attack: T1562.006
    for: [csharp]
    all:
      - id: csharp-etw-api-resolution
      - id: etw-write-after-api-string

  - id: nttraceevent-blinding-patch
    desc: Dynamically resolves and disables NtTraceEvent telemetry
    crit: hostile
    conf: 0.99
    attack: T1562.006
    mbc: B0030
    for: [pe, dll]
    all:
      - id: nttraceevent-api-reference
      - id: nttraceevent-noop-patch
      - id: micro-behaviors/os/module/load::get-proc-address-import
      - id: micro-behaviors/mem/protect/modify::virtual-protect

  - id: module-enumeration-with-nttraceevent-blinding
    desc: Module enumeration paired with NtTraceEvent telemetry blinding
    crit: hostile
    conf: 0.98
    attack: T1057,T1562.006
    mbc: B0030
    for: [pe, dll]
    all:
      - id: nttraceevent-blinding-patch
      - id: micro-behaviors/process/enumerate/snapshot::toolhelp-module-enumeration

  - id: native-etw-memory-blinding
    desc: Native PE patches EtwEventWrite in writable memory
    crit: hostile
    conf: 0.99
    attack: T1562.006
    all:
      - id: micro-behaviors/os/telemetry/logging/etw::etw-event-write-str
      - id: native-etw-target-reference
      - id: micro-behaviors/os/module/load::get-proc-address-import
      - id: micro-behaviors/mem/protect/modify::virtual-protect
    unless:
      - id: metadata/signed/platform/
      - id: well-known/tool/reverse-engineering/

  - id: native-source-etw-memory-blinding
    desc: Native source patches EtwEventWrite to blind ETW
    crit: hostile
    conf: 0.99
    attack: T1562.006
    mbc: B0030
    for: [c, cpp]
    all:
      - id: micro-behaviors/os/telemetry/logging/etw::etw-event-write-call
      - id: micro-behaviors/mem/protect/modify::virtual-protect
      - id: micro-behaviors/data/buffer::native-memcpy-byte-copy
    any:
      - id: etw-patch-xor-ret
      - id: etw-write-after-api-string

  - id: native-nttraceevent-context-blinding-loader
    desc: Native loader blinds NtTraceEvent via thread-context control
    crit: hostile
    conf: 0.99
    attack: T1055.003,T1562.006,T1622
    mbc: B0012,B0030
    for: [pe, dll]
    all:
      - id: micro-behaviors/os/exception/error-handling::add-vectored-exception-handler
      - id: micro-behaviors/process/inject/runtime/call::get-thread-context-dup
      - id: micro-behaviors/process/inject/runtime/call::set-thread-context-dup
      - id: micro-behaviors/mem/protect/modify::virtual-protect
      - id: micro-behaviors/os/module/load::get-proc-address-import
    any:
      - id: nttraceevent-api-reference
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/framework/
      - id: metadata/binary/installer/family/
      - id: well-known/tool/reverse-engineering/
