defaults:
  platforms: [windows]
  for: [lua]
  crit: hostile
  conf: 0.98
  attack: T1562.006
composite_rules:
  - id: lua-telemetry-return-patch-cluster
    desc: Telemetry names with protected return patches
    near_bytes: 1200
    all:
      - id: micro-behaviors/os/telemetry/logging/etw::lua-native-trace-event-name
      - id: micro-behaviors/mem/protect/modify::lua-page-protection-call
      - id: micro-behaviors/mem/write/arbitrary::lua-return-instruction-write
