defaults:
  platforms: [windows]
  for: [lua]
  crit: hostile
  conf: 0.98
  attack: T1562.006
composite_rules:
  - id: lua-telemetry-return-zero-patch-cluster
    desc: Telemetry and protected zero-return stores
    near_bytes: 1200
    all:
      - id: micro-behaviors/os/telemetry/logging/etw::lua-native-trace-event-name
      - id: micro-behaviors/mem/protect/modify::lua-virtual-protect-call
      - id: micro-behaviors/mem/write/arbitrary::lua-cast-pointer-zero-return-stores
