defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  attack: T1562.001
composite_rules:
  - id: security-runner-container-kill
    desc: Docker kill request near security-runner names
    crit: suspicious
    conf: 0.97
    near_bytes: 8192
    all:
      - id: micro-behaviors/os/container/runtime::stepsecurity-runner-reference
      - id: micro-behaviors/fs/path/socket::docker-socket-path-scripts-binaries
      - id: micro-behaviors/os/container/runtime::docker-api-container-kill-request
