# The separate event writer is patched with zero-status returns (five x86
# arguments), whereas the scan bypass returns E_INVALIDARG (six arguments).
# Require the scan patcher as context: a generic zero-return stub does not
# establish ETW impairment, and target names may themselves be encrypted.
defaults:
  platforms: [windows]
  for: [pe, dll]
composite_rules:
  - id: managed-event-status-patcher-with-scan-bypass
    desc: ETW bypass stubs accompany AMSI patching
    crit: hostile
    conf: 0.98
    attack: T1562.006
    all:
      - id: objectives/evasion/anti-av/amsi::managed-cross-architecture-scan-status-patcher
      - id: metadata/binary/instruction/sequence::cross-architecture-zero-status-return-stubs
