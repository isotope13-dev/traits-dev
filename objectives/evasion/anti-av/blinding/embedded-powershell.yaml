# Embedded payloads need the provider, enabled field, and zero write in one
# executable string literal. Token-only references do not establish disabling.
defaults:
  platforms: [windows]
  for: [python]
  crit: suspicious
  conf: 0.98
  attack: T1562.002
  mbc: E1562
traits:
  - id: embedded-powershell-etw-provider-zero
    desc: PowerShell payload zeros ETW provider field
    if:
      type: literal
      exclude_docstrings: true
      regex: '(?s)PSEtwLogProvider.{0,300}m_enabled.{0,160}SetValue\([^,\n]*,\s*0\s*\)'
