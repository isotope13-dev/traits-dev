# Electron applications that disable host defenses before staging a payload.
defaults:
  platforms: [windows]
  for: [javascript, typescript]
  attack: T1562.001,T1497.001,T1105
  mbc: B0007,B0024

traits:
  - id: electron-defender-exclusion-routine
    desc: Electron Defender exclusion routine
    crit: suspicious
    conf: 0.96
    if:
      type: symbol
      exact: prepareDefender
  - id: electron-anti-vm-routine
    desc: Electron anti-VM routine
    crit: suspicious
    conf: 0.93
    if:
      type: symbol
      exact: antiVmCheck
  - id: electron-admin-check-routine
    desc: Electron bundle checks for administrator access
    crit: notable
    conf: 0.88
    if:
      type: symbol
      exact: ensureAdmin

composite_rules:
  - id: electron-defense-evasion-dropper
    desc: Electron payload stages after anti-VM and Defender evasion
    crit: hostile
    conf: 0.99
    all:
      - id: electron-defender-exclusion-routine
      - id: electron-anti-vm-routine
      - id: objectives/exfiltration/messaging/telegram::electron-payload-materialization-routines
    unless:
      - id: metadata/signed/platform/
      - id: metadata/package/testing/
