defaults:
  platforms:
  - windows
  for:
  - pyc
  attack: T1562.006
traits:
- id: pyc-etw-ret-memory-patch-evidence
  desc: Bytecode ETW RET patch with memory-write APIs
  crit: suspicious
  conf: 0.98
  if:
    type: yara
    source: "rule pyc_etw_ret_patch {\n  strings:\n    $target = \"EtwEventWrite\"\n    $ret = { e9 c3 00 00 00 }\n    $protect = \"VirtualProtect\"\n    $write =\
      \ \"memset\"\n  condition:\n    all of them and\n    for any i in (1..#target): (\n      for any j in (1..#ret): (\n        @ret[j] > @target[i] and @ret[j]\
      \ - @target[i] < 128 and\n        for any k in (1..#protect): (\n          @protect[k] > @ret[j] and @protect[k] - @ret[j] < 512 and\n          for any m in\
      \ (1..#write): (\n            @write[m] > @ret[j] and @write[m] - @ret[j] < 512\n          )\n        )\n      )\n    )\n}\n"
composite_rules:
- id: pyc-etw-ret-memory-patch
  desc: Bytecode ETW RET patch with memory-write APIs
  crit: hostile
  conf: 0.98
  all:
  - id: pyc-etw-ret-memory-patch-evidence
  - id: micro-behaviors/dylib/lookup::pyc-dynamic-procedure-resolution
