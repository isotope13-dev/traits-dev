defaults:
  platforms: [windows]
  for: [powershell, batch, data]
  attack: T1562.001
traits:
  - id: byte-array-etw-ret-patch
    desc: Encoded ETW target with RET byte write
    crit: suspicious
    conf: 0.98
    if:
      type: yara
      source: |
        rule byte_array_etw_ret_patch {
          strings:
            $target_plain = "0x45,0x74,0x77,0x45,0x76,0x65,0x6E,0x74,0x57,0x72,0x69,0x74,0x65" ascii wide
            $target_b64 = "0x45,0x74,0x77,0x45,0x76,0x65,0x6E,0x74,0x57,0x72,0x69,0x74,0x65" wide base64
            $write_plain = "::WriteByte(" ascii wide
            $write_b64 = "::WriteByte(" wide base64
            $ret_plain = ", 0xC3)" ascii wide
            $ret_b64 = ", 0xC3)" wide base64
          condition:
            any of ($target_*) and any of ($write_*) and any of ($ret_*)
        }
