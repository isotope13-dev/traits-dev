defaults:
  platforms: [windows]
  for: [powershell, batch, vbs, data]
  attack: T1562.001
traits:
  - id: byte-array-etw-ret-patch
    desc: Encoded ETW target with RET byte write
    crit: suspicious
    conf: 0.98
    if:
      type: yara
      source: |
        rule byte_array_etw_ret_patch {
          strings:
            $target_plain = "0x45,0x74,0x77,0x45,0x76,0x65,0x6E,0x74,0x57,0x72" ascii wide
            $target_b64 = "0x45,0x74,0x77,0x45,0x76,0x65,0x6E,0x74,0x57,0x72" wide base64
            $write_plain = "::WriteByte(" ascii wide
            $write_b64 = "::WriteByte(" wide base64
            $x86_plain = "0xb8,0xff,0x55" ascii wide
            $x86_b64 = "0xb8,0xff,0x55" wide base64
            $ret_plain = ", 0xC3)" ascii wide
            $ret_b64 = ", 0xC3)" wide base64
          condition:
            any of ($target_*) and (any of ($write_*) or any of ($x86_*)) and any of ($ret_*)
        }

composite_rules:
  - id: byte-array-amsi-and-etw-memory-patch
    desc: Encoded byte-array AMSI and ETW memory patches
    crit: hostile
    conf: 0.99
    mbc: B0047
    all:
      - id: objectives/evasion/anti-av/amsi::byte-array-amsi-return-zero-patch
      - id: byte-array-etw-ret-patch
