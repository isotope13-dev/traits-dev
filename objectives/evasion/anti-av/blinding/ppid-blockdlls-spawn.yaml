# Cobalt Strike-style spawn hardening, reproduced by Apollo's Process module
# and most of its imitators: the child gets a spoofed parent so process-tree
# telemetry points at an innocent process, and the blockdlls mitigation so
# EDR user-mode hook DLLs cannot load into it. Browsers block non-Microsoft
# DLLs in their sandboxes but never re-parent the child; elevation helpers
# re-parent but leave DLL loading alone. Together they blind the defender.
defaults:
  platforms: [windows]
  attack: T1134.004,T1562.001
  mbc: F0004

composite_rules:
  - id: spoofed-parent-spawn-blocking-edr-dlls
    desc: Spawns children under a spoofed parent with non-Microsoft DLLs blocked
    crit: hostile
    conf: 0.94
    for: [pe, dll, csharp, powershell]
    all:
      - id: micro-behaviors/process/config/launch::block-non-microsoft-binaries-policy
    any:
      - id: micro-behaviors/process/config/parent::parent-process-attribute
      - id: micro-behaviors/process/config/launch::parent-process-attribute-source
    unless:
      - id: well-known/lib/platform/pinvoke-net::pinvoke-binding-assembly
      - id: well-known/lib/platform/vanara::vanara-strong-name-token
