defaults:
  platforms: [windows]
  for: [rust]

traits:
  - id: rust-overwrites-resolved-telemetry-with-return
    desc: Overwrites a resolved telemetry API with return
    crit: hostile
    conf: 0.98
    attack: T1562.006
    if:
      type: tree-sitter
      query: |
        ((block
          (let_declaration pattern: (identifier) @target value: (_) @resolve)
          (let_declaration pattern: (identifier) @process value: (_) @self)
          (let_declaration pattern: (identifier) @data value: (integer_literal) @byte)
          (let_declaration value: (unsafe_block (block
            (call_expression function: (_) @write arguments: (arguments
              . (identifier) @process_arg
              . (identifier) @target_arg
              . [
                (reference_expression value: (identifier) @buffer)
                (type_cast_expression value: (reference_expression value: (identifier) @buffer))
                (type_cast_expression value: (type_cast_expression
                  value: (reference_expression value: (identifier) @buffer)))
              ]))))))
          (#match? @resolve "(?s)\\b(resolve_address|GetProcAddress)\\s*\\(.{0,180}\"(NtTraceEvent|EtwEventWrite)\"")
          (#match? @self "\\bGetCurrentProcess\\s*\\(")
          (#match? @write "(^|::)WriteProcessMemory$")
          (#match? @byte "(?i)^(0xc3|195)(_?u8)?$")
          (#eq? @process @process_arg)
          (#eq? @target @target_arg)
          (#eq? @data @buffer))
