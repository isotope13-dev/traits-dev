defaults:
  for: [pe, dll]
  platforms: [windows]
  attack: T1562.001
composite_rules:
  - id: defender-disable-with-monitor-blinding
    desc: Defender disable policy with monitor blinding
    crit: hostile
    conf: 0.96
    # Mutation APIs alone do not establish a value of 1. The accompanying
    # Security Center suppression cluster supplies the attack context.
    all:
      - id: micro-behaviors/os/security/defender::defender-policies-registry-key
      - id: micro-behaviors/os/security/defender::defender-disable-antispyware-policy-value
      - id: micro-behaviors/os/registry/access::registry-write-api-chain
      - id: objectives/evasion/anti-av/blinding::security-center-notify-disabled
