defaults:
  platforms: [windows]
  for: [pe, dll]
  arch: [x86-64]
composite_rules:
  - id: native-etw-single-byte-return-patch
    desc: EtwEventWrite and VirtualProtect coexist with one-byte RET patch code
    crit: hostile
    conf: 0.98
    attack: T1562.006
    all:
      - id: micro-behaviors/os/telemetry/logging/etw::etw-event-write-str
      - id: micro-behaviors/mem/write/arbitrary::x64-ret-store-between-one-byte-calls
      - id: micro-behaviors/mem/protect/modify::virtual-protect
