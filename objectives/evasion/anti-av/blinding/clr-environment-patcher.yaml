defaults:
  platforms: [windows]
  for: [csharp]
  attack: T1562.006

composite_rules:
  # Disabling this documented switch alone can serve legitimate diagnostics.
  # Require independently established AMSI code replacement for hostile intent.
  - id: amsi-patcher-disables-clr-etw
    desc: AMSI patcher disables CLR ETW configuration
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/os/telemetry/logging/etw::clr-environment-etw-disabled
      - id: objectives/evasion/anti-av/amsi::csharp-com-vtable-return-zero-patch
