# Setting the WER registry key and the WER_FAULT_REPORTING variable
# together turns crash reporting off. The two strings sit in one helper.
defaults:
  platforms: [windows]
  for: [pe, dll, csharp]
  attack: T1562.006

composite_rules:
  - id: wer-fault-reporting-disabled
    desc: Disables Windows Error Reporting
    crit: hostile
    conf: 0.96
    near_bytes: 512
    all:
      - id: micro-behaviors/os/event/log::windows-error-reporting-key
      - id: micro-behaviors/os/event/log::wer-fault-reporting-env
    unless:
      - id: metadata/signed/platform/
