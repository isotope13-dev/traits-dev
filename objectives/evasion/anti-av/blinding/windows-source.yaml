defaults:
  crit: suspicious
  platforms: [windows]
  for: [source]
traits:
  - id: avp32-target-source
    desc: Targets avp32.exe in source
    conf: 0.88
    if:
      type: text
      word: avp32.exe
  - id: drweb32w-target-source
    desc: Targets drweb32w.exe in source
    conf: 0.88
    if:
      type: text
      word: drweb32w.exe
  - id: spidernt-target-source
    desc: Targets spidernt.exe in source
    conf: 0.88
    if:
      type: text
      word: spidernt.exe
  - id: avltmain-target-source
    desc: Targets avltmain.exe in source
    conf: 0.88
    if:
      type: text
      word: avltmain.exe
  - id: pavproxy-target-source
    desc: Targets pavproxy.exe in source
    conf: 0.88
    if:
      type: text
      word: pavproxy.exe
composite_rules:
  # Resolving all three internal notification arrays, opening the PDFWKRNL
  # arbitrary-memory device, and carrying its read/write IOCTL pair is the
  # kernel callback-blinding chain. This lives under AV/EDR blinding rather
  # than kernel hiding: its effect is to stop security notification callbacks,
  # not to conceal a process, file, or driver from enumeration.
  - id: pdb-guided-notify-callback-blinding
    desc: PDB-guided PDFWKRNL notification callback blinding
    crit: hostile
    conf: 0.99
    attack: "T1014,T1562.001"
    for: [pe, c]
    all:
      - id: objectives/evasion/anti-av/driver::vulnerable-driver-device-client
      - id: micro-behaviors/os/kernel/device::pdfwkrnl-kernel-memory-ioctl-pair
      - id: micro-behaviors/os/kernel/debug::windows-kernel-pdb-symbol-resolution
      - id: micro-behaviors/os/kernel/callback::internal-notify-callback-arrays

  - id: hardcoded-av-exclusion-list-source
    desc: Hardcoded AV filename exclusion list in source
    conf: 0.98
    needs: 4
    any:
      - id: avp32-target-source
      - id: drweb32w-target-source
      - id: spidernt-target-source
      - id: avltmain-target-source
      - id: pavproxy-target-source
