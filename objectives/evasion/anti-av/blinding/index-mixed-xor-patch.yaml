defaults:
  platforms: [windows]
  for: [pe, dll]
  arch: [x86-64]
composite_rules:
  - id: index-xor-etw-zero-return-patch
    desc: Concealed ETW target and return-zero patch
    crit: hostile
    conf: 0.99
    attack: T1562.001
    all:
      - id: micro-behaviors/os/telemetry/logging/event::index-mixed-xor-event-write-name
      - id: micro-behaviors/mem/write/arbitrary::x64-write-zero-return
      - id: micro-behaviors/mem/protect/modify::virtual-protect
