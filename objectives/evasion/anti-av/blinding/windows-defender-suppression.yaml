defaults:
  attack: T1562.001
  for:
  - pe
  - powershell
  - batch
  - vbs
  platforms:
  - windows
traits:
- id: defender-notification-disable-policy
  desc: Defender notification-disable policy reference
  crit: suspicious
  conf: 0.97
  for: [python, powershell, batch, vbs, javascript]
  if:
    type: text
    regex: '(?i)Defender Security Center\\\\Notifications.{0,80}DisableNotifications'
- id: defender-disable-sample-submission
  desc: Disable automatic Defender sample submission
  crit: suspicious
  conf: 0.98
  for: [pe, dll, batch, powershell]
  if:
    type: text
    regex: 'Set-MpPreference\s+.{0,80}-SubmitSamplesConsent\s+2\b'
    case_insensitive: true
- id: defender-disable-cloud-reporting
  desc: Disable Defender MAPS cloud reporting
  crit: suspicious
  conf: 0.98
  for: [pe, dll, batch, powershell]
  if:
    type: text
    regex: 'Set-MpPreference\s+.{0,80}-MAPSReporting\s+0\b'
    case_insensitive: true
- id: defender-spynet-reporting-disabled-registry
  desc: Defender cloud reporting disabled by registry
  crit: suspicious
  conf: 0.98
  for: [pe, dll, batch, powershell, vbs, javascript, csharp, python]
  if:
    type: text
    regex: '(?i)Defender\\Spynet.{0,120}SpynetReporting.{0,60}/d\s+0\b'
- id: defender-sample-submission-disabled-registry
  desc: Defender sample submission disabled by registry
  crit: suspicious
  conf: 0.98
  for: [pe, dll, batch, powershell, vbs, javascript, csharp, python]
  if:
    type: text
    regex: '(?i)Defender\\Spynet.{0,120}SubmitSamplesConsent.{0,60}/d\s+2\b'
- id: defender-disable-behavior
  desc: Disable behavior monitoring
  crit: suspicious
  conf: 0.95
  for:
  - batch
  - powershell
  if:
    type: text
    regex: Set-MpPreference\s+.{0,50}-DisableBehaviorMonitoring\s+\$?true
    case_insensitive: true
  unless:
  - id: well-known/app/ai/media/comfy-test::generated-vm-template
- id: defender-disable-ioav
  desc: Disable IOAV protection
  crit: suspicious
  conf: 0.9
  for:
  - batch
  - powershell
  if:
    type: text
    regex: Set-MpPreference\s+.{0,50}-DisableIOAVProtection\s+\$?true
    case_insensitive: true
  unless:
  - id: well-known/app/ai/media/comfy-test::generated-vm-template
- id: defender-disable-archive-scan
  desc: Disable Defender archive scanning
  crit: suspicious
  conf: 0.95
  for:
  - batch
  - powershell
  if:
    type: text
    regex: Set-MpPreference\s+.{0,80}-DisableArchiveScanning\s+\$?true
    case_insensitive: true
  unless:
  # A CI workflow on an ephemeral GitHub-hosted runner turns off real-time
  # scanning so it does not crawl every file a Windows test job touches.
  # Routine build tuning, and the config is public in the repository.
  - id: metadata/build/ci/github-actions::workflow-definition-path
  - id: well-known/app/ai/media/comfy-test::generated-vm-template
- id: defender-operational-log-channel
  desc: Defender Operational event log channel name
  crit: notable
  conf: 0.95
  for: [binaries, scripts, source]
  if:
    type: text
    regex: '(?i)Microsoft-Windows-(Windows\s+)?Defender/Operational\b'
composite_rules:
- id: python-defender-eventlog-clear
  desc: Python script clears Windows Defender event log
  crit: hostile
  conf: 0.99
  for: [python]
  attack: T1562.001,T1070.001
  all:
  - id: objectives/evasion/indicator-removal/logs::python-eventlog-clear-argv
  - id: defender-operational-log-channel
  unless:
  - id: metadata/package/testing/
