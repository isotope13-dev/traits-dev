# Script writes the .NET Framework ETWEnabled value (spelled as a charcode
# list) before staging a .NET payload, so CLR events never reach EDR.
defaults:
  platforms: [windows]
  for: [javascript, vbs, html]
  crit: hostile
  attack: T1562.006

composite_rules:
  - id: wsh-disables-dotnet-etw
    desc: Script turns off .NET ETW through a hidden registry value name
    conf: 0.94
    all:
      - id: micro-behaviors/os/security/amsi::charcode-dotnet-etwenabled-name
      - id: micro-behaviors/os/security/amsi::wsh-regwrite-dword-call
