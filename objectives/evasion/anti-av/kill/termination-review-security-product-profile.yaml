# A product reference and process-management imports suggest AV targeting,
# but do not establish which process the APIs terminate.
defaults:
  platforms: [windows]
  for: [pe, dll]
composite_rules:
  - id: chinese-av-reference-termination-api-profile
    desc: Chinese AV reference with process termination APIs
    crit: notable
    conf: 0.96
    all:
      - id: micro-behaviors/process/terminate/kill::toolhelp-kill-loop-source
      - id: micro-behaviors/os/security/product::chinese-av-product-extended
