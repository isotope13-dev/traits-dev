defaults:
  platforms:
    - "windows"
  for:
    - "batch"
composite_rules:
  - 
    id: "taskmgr-suppression-system-script-stage"
    desc: "Task Manager suppression stages and starts system scripts"
    crit: "hostile"
    conf: 0.96
    all:
      - 
        id: "micro-behaviors/process/terminate/command::force-taskkill-task-manager"
      - 
        id: "micro-behaviors/fs/file/copy/source-destination::batch-system-script-copy"
      - 
        id: "micro-behaviors/process/create/shell/batch::batch-starts-batch-file"
      - 
        id: "micro-behaviors/data/control-flow/branch::batch-goto-branch"
