defaults:
  for: [pe]
  platforms: [windows]
composite_rules:
  - id: reversed-antivirus-target-process-killer
    desc: Reversed AV target list with kill routines
    crit: hostile
    conf: 0.96
    attack: T1562.001
    all:
      - id: micro-behaviors/os/application/target/security::reversed-antivirus-process-target-list
      - id: micro-behaviors/process/terminate/kill::terminate-process
    any:
      - id: micro-behaviors/process/enumerate/snapshot::create-toolhelp32-snapshot
      - id: micro-behaviors/process/enumerate/snapshot::dynamic-toolhelp-process-traversal
