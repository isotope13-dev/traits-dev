defaults:
  platforms: [windows]
  for: [pe, dll]

composite_rules:
  - id: security-process-remote-memory-apis
    desc: Security process and remote-memory APIs
    crit: hostile
    conf: 0.93
    all:
      - id: micro-behaviors/mem/write/arbitrary::write-process-memory-dup
      - id: micro-behaviors/mem/alloc/virtual::virtual-alloc-ex
      - id: micro-behaviors/process/terminate/target::security-name-enumeration-termination-api-profile
    any:
      - id: objectives/anti-analysis/self-modify/runtime::memory-protection-with-modification-clues
      - id: objectives/anti-analysis/debugger-detect/check/
      - id: micro-behaviors/os/syscall/raw/
    unless:
      - id: metadata/binary/symbols/count::many-imports
      - id: metadata/binary/symbols/count::many-exports
    downgrade:
      any:
        - id: metadata/filename/name-form::is-microsoft-named
