defaults:
  platforms: [windows]
  for: [pe, dll]

composite_rules:
  - id: security-process-remote-memory-apis
    desc: Security process and remote-memory APIs
    crit: hostile
    conf: 0.93
    all:
      - id: micro-behaviors/mem/write/arbitrary::write-process-memory-dup
      - id: micro-behaviors/mem/alloc/remote::virtual-alloc-ex
      - id: micro-behaviors/process/terminate/kill::security-name-enumeration-termination-api-profile
    any:
      - id: metadata/file/profile/memory/operation-reference::memory-protection-with-modification-clues
      - id: objectives/anti-analysis/debugger-detect/check/
      - id: micro-behaviors/os/syscall/raw/
    unless:
      - id: metadata/binary/symbols/count::many-imports
      - id: metadata/binary/symbols/count::many-exports
    downgrade:
      any:
        - id: metadata/binary/vendor::is-microsoft-named
        - id: metadata/signed/platform/
