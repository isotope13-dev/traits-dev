defaults:
  platforms:
  - windows
  for:
  - pe
  - dll
composite_rules:
- id: security-names-with-debug-and-termination-apis
  desc: Security names, debug privilege, termination APIs
  crit: notable
  conf: 0.98
  all:
  - id: micro-behaviors/os/security/product::security-product-process-image
  - id: micro-behaviors/os/privilege/reference::sedebug-privilege-name
  - id: micro-behaviors/process/terminate/kill::terminate-process
  - id: micro-behaviors/process/attach/rights::open-process
  any:
  - id: micro-behaviors/process/enumerate/snapshot::toolhelp-process-enumeration
  - id: micro-behaviors/process/enumerate/snapshot::create-toolhelp32-snapshot
  - id: micro-behaviors/process/enumerate/psapi::enum-processes
- id: unverified-signature-security-name-termination
  desc: Unverified signature with security-process termination and debug privilege
  crit: suspicious
  conf: 0.9
  attack: T1562.001
  all:
  - id: security-names-with-debug-and-termination-apis
  any:
  - id: metadata/signature/absent::unsigned
  - id: metadata/signature/certificate/integrity::certificate-directory-without-parsed-signatures
  needs: 1
