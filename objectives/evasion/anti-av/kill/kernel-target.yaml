defaults:
  for: [pe]
  platforms: [windows]
composite_rules:
  - id: stack-targeted-antivirus-kernel-killer
    desc: Kernel process killer builds antivirus target name
    crit: hostile
    conf: 0.99
    attack: T1562.001
    all:
      - id: micro-behaviors/os/application/target/security::ravmon-stack-wide-name
      - id: micro-behaviors/process/terminate/kill::zw-terminate-process
      - id: micro-behaviors/process/terminate/kill::zw-open-process
      - id: micro-behaviors/os/sysinfo/process::zw-query-system-information
