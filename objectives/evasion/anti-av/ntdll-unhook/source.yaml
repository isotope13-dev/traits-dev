# Source-level coverage for restoring a clean ntdll image.  The existing PE
# rules cover compiled indicators; these rules recognize the same operation in
# C/C++ and source-level FFI without relying on a campaign's string literals.
defaults:
  platforms: [windows]
  for: [c, cpp, csharp, go, rust, python, powershell]
  attack: T1562.001

traits:
  # `ntdll-source-reference` moved to micro-behaviors/os/syscall/invoke, which
  # already owns the ntdll surface. Naming the module is how source reaches
  # RtlGetVersion/NtQuerySystemInformation at all — OpenSCAP's system_info
  # probe does `LoadLibraryW(L"ntdll.dll")` for the OS version — so the bare
  # reference is a capability, not an unhooking objective. The composites below
  # still require it alongside the clean-image / .text-copy legs.

  - id: clean-ntdll-image-marker
    desc: Clean or mapped NTDLL image marker
    crit: component
    conf: 0.92
    if:
      type: text
      regex: '(?i)\b(clean|fresh|mapped)[_-]?ntdll\b|\bntdll[_-]?(clean|fresh|mapped)\b'

  - id: ntdll-text-marker
    desc: ntdll text section marker
    crit: component
    conf: 0.84
    if:
      type: text
      regex: '(?i)\bntdll\b.{0,20}\.text\b|\b\.text\b.{0,20}\bntdll\b'

  - id: ntdll-copy-api-source
    desc: Ntdll-related memory copy in source
    crit: notable
    conf: 0.88
    if:
      type: text
      regex: '(?i)\bntdll\b.{0,40}\b(CopyMemory|RtlMoveMemory|memcpy)\b'

composite_rules:
  - id: source-ntdll-clean-map
    desc: Maps a clean ntdll image
    crit: suspicious
    conf: 0.95
    near_lines: 24
    all:
      - id: micro-behaviors/os/syscall/invoke::ntdll-module-name-source
      - id: clean-ntdll-image-marker
      - id: micro-behaviors/fs/memory/mmap::win32-file-mapping-pair-source

  - id: source-ntdll-text-restore
    desc: Copies over ntdll text
    crit: suspicious
    conf: 0.95
    near_lines: 24
    all:
      - id: micro-behaviors/os/syscall/invoke::ntdll-module-name-source
      - id: ntdll-text-marker
      - id: ntdll-copy-api-source

  - id: source-ntdll-unhook
    desc: Restores ntdll text from a clean mapped image
    crit: suspicious
    conf: 0.96
    all:
      - id: source-ntdll-clean-map
      - id: source-ntdll-text-restore
