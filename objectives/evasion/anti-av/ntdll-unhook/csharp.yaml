# A generic "unhook" substring also matches ordinary window-hook cleanup.
# Require an explicit ntdll-unhook label. Mapping and a label do not establish
# that code bytes were restored, so describe the references rather than success.
defaults:
  platforms: [windows]
  for: [pe, dll]
  attack: T1562.001
composite_rules:
  - id: dotnet-ntdll-unhooking
    desc: Managed ntdll-unhook label with file-mapping references
    crit: suspicious
    conf: 0.9
    all:
      - id: metadata/binary/framework::dotnet-assembly
      - id: metadata/binary/symbols/name::ntdll-unhook-routine-name
    any:
      - id: micro-behaviors/mem/map::dotnet-map-view-of-file-name
      - id: micro-behaviors/fs/memory/mmap::map-view-of-file
