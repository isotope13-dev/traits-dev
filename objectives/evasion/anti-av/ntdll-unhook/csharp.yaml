# A generic "unhook" substring also matches ordinary window-hook cleanup.
# Require an explicit ntdll-unhook label. Mapping and a label do not establish
# that code bytes were restored, so describe the references rather than success.
defaults:
  platforms: [windows]
  for: [pe, dll]
  attack: T1562.001
composite_rules:
  - id: dotnet-ntdll-unhooking
    desc: Managed ntdll-unhook label with file-mapping references
    crit: suspicious
    conf: 0.9
    all:
      - id: metadata/lang/compiler/managed::dotnet-assembly
      - id: metadata/binary/symbols/name/token/security::ntdll-unhook-routine-name
    any:
      - id: metadata/lang/source/naming/action/token::dotnet-map-view-of-file-name
      - id: micro-behaviors/mem/map::map-view-of-file

  # Disk-image restore without a telling routine name: map the on-disk copy
  # of a loaded module, find its code section, make the loaded copy writable
  # and copy the clean bytes over it. The ntdll name and the API set are
  # static co-occurrence; no completed restore is asserted.
  - id: dotnet-ntdll-disk-image-restore-apis
    desc: Managed ntdll disk-map, .text walk and patch APIs
    crit: suspicious
    conf: 0.9
    all:
      - id: metadata/lang/compiler/managed::dotnet-assembly
      - id: micro-behaviors/fs/path/system/library::ntdll-library-name-reference
      - id: micro-behaviors/mem/map::map-view-of-file
      - id: micro-behaviors/process/enumerate/psapi::get-module-information
      - id: micro-behaviors/data/parse/portable-executable::cil-text-section-name-compare
      - id: micro-behaviors/mem/protect/modify/unspecified::virtual-protect-import
      - id: micro-behaviors/mem/copy::memcpy
