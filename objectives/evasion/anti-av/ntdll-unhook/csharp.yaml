# .NET ntdll unhooking: the stager maps a clean on-disk ntdll image and copies
# its .text over the hooked in-memory copy. The native-string rules in
# windows.yaml do not see this, because a managed build keeps the technique
# name and the P/Invoke names as metadata strings without any fresh/clean
# ntdll prose. A defensive unhooker would still name the same three things,
# so this stays suspicious; conviction comes from what it accompanies.
defaults:
  platforms: [windows]
  for: [pe, dll]
  attack: T1562.001

traits:
  - id: dotnet-unhook-name-reference
    desc: Managed code names an unhook routine
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)unhook'
  # Component only: MapViewOfFile is a ubiquitous mapping API (Go runtimes
  # carry the name too); it counts solely inside the unhooking composite.
  - id: dotnet-mapped-view-reference
    desc: Managed code references a mapped file view
    crit: component
    conf: 0.85
    if:
      type: text
      substr: MapViewOfFile
    unless:
      # Native runtimes (Go in particular) embed the same API name as a
      # lazy-proc string; this atom is about managed P/Invoke declarations.
      - id: metadata/lang/compiler/systems::go-binary-comp

composite_rules:
  - id: dotnet-ntdll-unhooking
    desc: Managed assembly restores ntdll from mapped copy
    crit: suspicious
    conf: 0.94
    all:
      - id: dotnet-unhook-name-reference
      - id: dotnet-mapped-view-reference
      - id: micro-behaviors/os/syscall/invoke::ntdll-import
