# A native ESET update relay that rejects signed resources, strips update
# source sections, relaxes WinHTTP certificate checks, and persists as itself
# interferes with the integrity and provenance of security-product updates.
defaults:
  for: [pe]
  platforms: [windows]
  attack: T1562.001

composite_rules:
  - id: persistent-eset-update-integrity-tampering-proxy
    desc: Persistent ESET update proxy denies signatures and filters update sources
    crit: hostile
    conf: 0.99
    all:
      - id: micro-behaviors/communications/proxy/relay::eset-manifest-filtering-relay-profile
      - id: micro-behaviors/communications/tls/verify/disable::x86-winhttp-ignore-certificate-errors
      - id: micro-behaviors/os/registry/manipulate::own-image-hklm-run-write-success
