defaults:
  for: [pe]
  platforms: [windows]

composite_rules:
  # Signature-file denial and removal of the update manifest's server/link/
  # host sections, in an ESET proxy that rotates upstream accounts, admit
  # update-channel tampering. Neither a product name nor UPX is required.
  - id: eset-update-signature-suppression-proxy
    desc: ESET proxy blocks signatures and edits manifests
    crit: hostile
    conf: 0.99
    attack: T1562.001
    all:
      - id: micro-behaviors/communications/http/response::x86-signed-suffix-404-response
      - id: micro-behaviors/data/collection/filter::x86-server-link-host-section-filter
      - id: micro-behaviors/communications/http/url/api-path::eset-update-manifest-path
      - id: micro-behaviors/communications/proxy/auth::account-list-rotation-diagnostic
      - id: micro-behaviors/communications/socket/listen::winsock-listener-imports
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/installer/family/
      - id: well-known/app/security/eupdate-helper::eupdate-helper-binary
