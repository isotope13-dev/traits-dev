# A fixed-upstream ESET proxy can relay manifests without attacking clients.
# Suppressing every .signed resource and manifest routing sections while
# disabling upstream certificate checks establishes update-verification
# tampering; product identity does not make that behavior benign.
defaults:
  platforms: [windows]
  for: [pe]
  attack: T1562.001

composite_rules:
  - id: eset-update-signature-suppression-proxy
    desc: ESET update proxy suppresses signed resources and relaxes verification
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/communications/proxy/relay::eset-manifest-filtering-relay-profile
      - id: micro-behaviors/communications/tls/verify/disable::x86-winhttp-ignore-certificate-errors
