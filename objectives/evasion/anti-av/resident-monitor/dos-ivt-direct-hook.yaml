# DOS-era resident anti-virus monitors (FluShot, VSafe, TBAV's TbMem)
# watched INT 21h AH=25h to catch programs taking over the DOS vector.
# Writing the vector straight into 0:0084h skips that call; paired with a
# private install-check reply inside the new handler it is the resident
# virus install, not an ordinary TSR, which uses AH=25h and AH=31h.
defaults:
  platforms: [windows, unix]
  for: [dos_com, data]
  attack: T1562.001
  size_max: 65536

composite_rules:
  - id: dos-av-monitor-bypassing-int21-takeover
    desc: Takes over INT 21h behind DOS's back and answers a private install check
    crit: hostile
    conf: 0.92
    all:
      - id: micro-behaviors/os/msdos/memory::dos-direct-ivt-int21-write
      - id: micro-behaviors/process/lifecycle/single-instance::dos-handler-install-check-reply
    any:
      - id: objectives/impact/infect/binary/dos/sft::dos-int21-close-intercept
      - id: micro-behaviors/os/msdos/interrupt::dos-int21-exec-intercept
