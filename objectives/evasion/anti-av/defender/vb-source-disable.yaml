# Visual Basic source that turns Microsoft Defender off from inside a
# program: a helper call passes a Defender policy key, a `Disable*` value
# name and "1", and PowerShell preference switches are spawned as string
# arguments. VB.NET/VB6 source is matched as text: filefacts does not parse
# it into literals or call sites, so string-argument shape is the evidence.
defaults:
  platforms: [windows]
  for: [vbs]
  attack: T1562.001
  mbc: E1562

traits:
  # RegistryEdit("SOFTWARE\Policies\Microsoft\Windows Defender", "DisableAntiSpyware", "1")
  - id: vb-defender-policy-disable-value
    desc: VB sets Defender policy Disable value
    crit: suspicious
    conf: 0.95
    if:
      type: text
      regex: '(?i)\\Windows Defender[^"\r\n]{0,40}"\s*,\s*"Disable[A-Za-z]{4,40}"\s*,\s*"?1\b'

composite_rules:
  - id: vb-defender-policy-and-preference-disable
    desc: VB disables Defender by policy and preference
    crit: hostile
    conf: 0.97
    all:
      - id: vb-defender-policy-disable-value
    any:
      - id: micro-behaviors/os/security/defender::defender-disable-realtime
      - id: objectives/evasion/anti-av/blinding::defender-disable-behavior
      - id: objectives/evasion/anti-av/blinding::defender-disable-ioav
