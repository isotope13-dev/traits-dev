defaults:
  platforms: [unix, windows]
  for: [python]

composite_rules:
- id: pypi-sysargv-defender-disable-dropper
  desc: PyPI install tampers with Defender notifications and drops payload
  crit: hostile
  conf: 0.98
  mbc: E1204
  attack: T1562.001,T1105,T1204.002
  all:
  - id: metadata/build/pip::root-setup-py
  - id: metadata/build/package/recipe/setup-hooks::setup-py-sysargv-install-gate
  - id: objectives/evasion/anti-av/blinding::defender-notification-disable-policy
  - id: micro-behaviors/os/registry/value/write::reg-exe-add-command
  - id: micro-behaviors/communications/http/download/helper::setup-executable-url-retrieval-attempt
  - id: micro-behaviors/process/create/subprocess/launch::python-command-exec-any
