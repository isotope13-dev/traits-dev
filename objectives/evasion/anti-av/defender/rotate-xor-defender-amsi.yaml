defaults:
  platforms: [windows]
  for: [pe, dll]
  arch: [x86-64]
composite_rules:
  - id: concealed-defender-exclusion-and-amsi
    desc: Rotate-XOR concealed Defender exclusion and AMSI target
    crit: hostile
    conf: 0.99
    attack: T1562.001
    all:
      - id: micro-behaviors/os/security/amsi::rotate-xor-open-session-name
      - id: micro-behaviors/os/security/defender::rotate-xor-exclusion-command
      - id: objectives/anti-static/obfuscation/imports/concealment::tls-rotate-xor-api-names
