defaults:
  platforms: [windows]
  crit: suspicious
  conf: 0.94
  attack: T1562.001
composite_rules:
  - id: defender-exclusion-with-batch-download-launch
    desc: Process exclusion and downloaded binary launch
    for: [batch]
    all:
      - id: micro-behaviors/os/security/defender::defender-exclusion-process
      - id: micro-behaviors/process/deploy/file-exec/command::batch-iwr-cmd-same-filename
  - id: defender-exclusion-with-disabled-vbs
    desc: Defender exclusion with security policy changes
    for: [powershell, pe]
    all:
      - id: micro-behaviors/os/security/defender::defender-exclusion-command-reference
      - id: micro-behaviors/os/security/policy::vbs-zero-dword-command-text
      - id: micro-behaviors/os/virtualization/configure::bcdedit-disable-hypervisor-command
