defaults:
  platforms: [windows]
  for: [batch]
  crit: hostile
  conf: 0.99
  attack: T1562.001
composite_rules:
  - id: download-with-blanket-profile-exclusions
    desc: Download with blanket user-profile exclusions
    # Require parsed commands so ECHO advice and REM examples cannot supply
    # either the Defender mutations or the file download.
    near_bytes: 3072
    all:
      - id: micro-behaviors/os/security/defender::batch-profile-root-exclusion-commands
      - id: micro-behaviors/communications/http/download/cli::batch-powershell-iwr-outfile-command
