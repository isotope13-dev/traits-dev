defaults:
  platforms: [windows]
  for: [scripts, binaries, source]
  attack: T1562.001
  mbc: E1562

traits:
  - id: defender-service-list-all
    desc: Lists multiple Windows Defender services
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: '(?i)WinDefend[\s\S]{0,80}(Sense|WdBoot|WdFilter)[\s\S]{0,80}WdNisSvc'

  - id: wmic-service-stop-call
    desc: WMIC stops Windows service
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: '(?i)\bwmic\b[^\r\n]{0,30}Win32_BaseService[^\r\n]{0,50}Call\s+StopService\b'

  - id: wmic-service-disable-call
    desc: WMIC disables Windows service startup
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: '(?i)\bwmic\b[^\r\n]{0,30}Win32_BaseService[^\r\n]{0,50}ChangeStartMode\s+Disabled'

  - id: wmic-security-process-or-service-delete
    desc: WMIC deletes SecurityHealthService
    crit: suspicious
    conf: 0.97
    if:
      type: text
      regex: '(?i)wmic\s+(Process|Service)[^\r\n]{0,120}SecurityHealthService[^\r\n]{0,40}\bDelete\b'

  - id: hide-windows-defender-settings-ui
    desc: Hides Windows Defender Settings UI
    crit: suspicious
    conf: 0.96
    if:
      type: text
      regex: '(?i)\bSettingsPageVisibility\b[^\r\n]{0,60}\bhide:windowsdefender\b'

  - id: smartscreen-disable-command
    desc: Disables Windows SmartScreen via command
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: '(?i)(SmartScreenEnabled[^\r\n]{0,40}\bOff\b|EnableSmartScreen[^\r\n]{0,30}\b0\b)'

composite_rules:
  - id: wmic-defender-service-teardown
    desc: Tears down Windows Defender services via WMIC
    crit: hostile
    conf: 0.98
    for: [pe, dll, batch, powershell, vbs]
    attack: T1562.001,T1489
    all:
      - id: defender-service-list-all
      - id: wmic-service-stop-call
      - id: wmic-service-disable-call
      - id: wmic-security-process-or-service-delete

  - id: defender-ui-hide-and-smartscreen-disable
    desc: Hides Defender UI and disables SmartScreen and Defender policies
    crit: hostile
    conf: 0.98
    attack: T1562.001,T1112
    all:
      - id: hide-windows-defender-settings-ui
      - id: smartscreen-disable-command
    any:
      - id: objectives/evasion/anti-av/registry::defender-antispyware-registry-disable-value
      - id: objectives/evasion/anti-av/registry::defender-monitoring-registry-disable-value
      - id: wmic-defender-service-teardown
