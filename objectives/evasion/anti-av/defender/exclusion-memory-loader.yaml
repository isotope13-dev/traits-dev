defaults:
  platforms: [windows]

composite_rules:
  - id: defender-exclusion-wx-thread-loader
    desc: Defender exclusion command with executable-memory API and external-IP clues
    crit: hostile
    conf: 0.98
    for:
      - pe
    arch:
      - x86-64
    all:
      - id: micro-behaviors/os/security/defender::defender-exclusion-command
      - id: micro-behaviors/mem/protect/modify/api-reference::integer-loads-protection-thread-apis
      - id: micro-behaviors/communications/url/host/oob-http::url-external-ip-binary
