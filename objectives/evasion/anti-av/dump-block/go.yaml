# Anti-dump behavior in a Go loader is an evasion objective, not a generic
# Go-runtime property. The marker is combined with the hollowing chain before
# it is escalated to hostile.
defaults:
  for: [pe, dll]
  platforms: [windows]
  attack: T1562

traits:
  # The bare "anti-dump" phrase is language-neutral diagnostic text: the label
  # proves a dump-blocking routine exists and states its purpose, and claims
  # nothing about the implementation language, so its id stays unprefixed. The
  # go- prefixed legs below are that family's own routine identifiers.
  - id: anti-dump-diagnostic-label
    desc: Anti-dump routine diagnostic label
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)\banti[_-]?dump\b'
  - id: go-minidump-patch-marker
    desc: Go MiniDump patch routine marker
    crit: notable
    conf: 0.95
    if:
      type: text
      substr: patchMiniDump
  - id: go-external-process-block-marker
    desc: Go external-process access block marker
    crit: notable
    conf: 0.95
    if:
      type: text
      substr: denyExternalProcessAccess

composite_rules:
  - id: go-anti-dump-routine-marker
    desc: Go anti-dump or external-process access block
    crit: suspicious
    conf: 0.95
    all:
      - id: metadata/lang/compiler/systems::go-binary
    any:
      - id: anti-dump-diagnostic-label
      - id: go-minidump-patch-marker
      - id: go-external-process-block-marker
  - id: go-anti-dump-hollowing-loader
    desc: Go process hollowing loader with anti-dump defenses
    crit: hostile
    conf: 0.99
    all:
      - id: go-anti-dump-routine-marker
      - id: objectives/evasion/process/injection/hollowing/process::go-process-hollowing-api-chain
      - id: metadata/lang/go-build::go-cshared-dll
    unless:
      - id: metadata/signed/platform/
      - id: well-known/tool/reverse-engineering/
