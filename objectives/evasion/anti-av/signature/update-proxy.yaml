defaults:
  for: [pe]
  platforms: [windows]

composite_rules:
  - id: update-tamper-scheduled-image-hash-rotation
    desc: Update tamper proxy rotates its executable hash
    crit: hostile
    conf: 0.99
    attack: T1027.001,T1562.001
    all:
      - id: objectives/evasion/anti-av/verification::eset-update-signature-suppression-proxy
      - id: micro-behaviors/fs/write/file/executable::scheduled-self-image-rotation
    # The hash-rotating family composite restates this rotation for the same
    # program; step down when it fires so one behavior is not convicted twice.
    downgrade:
      any:
        - id: objectives/command-and-control/channel/proxy::hash-rotating-port-seizing-proxy
