# The standby routine appends random bytes to the running image specifically
# to avoid hash-based blocking. Requiring the Run-key diagnostic and the
# structured registry/file-operation profile binds that evasion to durable
# autostart behavior rather than a standalone updater mutation.
defaults:
  for: [pe]
  platforms: [windows]
  attack: T1562.001

composite_rules:
  - id: persistent-self-hash-rotation-evasion
    desc: Persists a self-mutating executable to evade hash-based blocking
    crit: hostile
    conf: 0.97
    all:
      - id: micro-behaviors/fs/write/file/executable::self-hash-rotation-relaunch
      - id: micro-behaviors/os/autorun/login-items::hklm-run-set-diagnostic
      - id: micro-behaviors/os/registry/manipulate::run-key-file-operation-api-profile
