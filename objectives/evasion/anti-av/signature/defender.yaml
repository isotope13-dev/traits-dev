defaults:
  platforms: [windows]
  for: [scripts, binaries, data]
  attack: T1562.001
  mbc: E1562

traits:
- id: mpcmdrun-signature-removal-option
  desc: MpCmdRun signature-removal command option
  crit: notable
  conf: 0.97
  if:
    type: text
    regex: '(?i)\-(RemoveDefinitions|RemoveDynamicSignature)\b'
  unless:
  - id: well-known/app/infrastructure/ansible::ansible-module-source-context
  - id: "metadata/file/naming::test-directory-component"
  - id: micro-behaviors/ui/help::mpcmdrun-signature-removal-help

composite_rules:
- id: mpcmdrun-removes-defender-signatures
  desc: MpCmdRun removes Defender signatures
  crit: hostile
  conf: 0.99
  all:
  - id: micro-behaviors/process/info/name::mpcmdrun-executable-reference
  - id: mpcmdrun-signature-removal-option
  unless:
  - id: well-known/app/infrastructure/ansible::ansible-module-source-context
  - id: "metadata/file/naming::test-directory-component"
  - id: micro-behaviors/ui/help::mpcmdrun-signature-removal-help
