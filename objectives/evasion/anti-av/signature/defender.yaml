defaults:
  platforms: [windows]
  for: [scripts, binaries, data]
  attack: T1562.001
  mbc: E1562

traits:
- id: mpcmdrun-defender-executable
  desc: Microsoft Defender command runner executable
  crit: notable
  conf: 0.95
  if:
    type: text
    regex: '(?i)\bMpCmdRun\.exe\b'
  unless:
  - id: well-known/app/utility/siw::siw-family-identity
- id: mpcmdrun-signature-removal-option
  desc: MpCmdRun signature removal option
  crit: suspicious
  conf: 0.97
  if:
    type: text
    regex: '(?i)\-(RemoveDefinitions|RemoveDynamicSignature)\b'
  unless:
  - id: well-known/app/infrastructure/ansible::ansible-module-source-context
  - id: metadata/package/testing/presence/harness::test-directory-path

composite_rules:
- id: mpcmdrun-removes-defender-signatures
  desc: MpCmdRun removes Defender signatures
  crit: hostile
  conf: 0.99
  all:
  - id: mpcmdrun-defender-executable
  - id: mpcmdrun-signature-removal-option
  unless:
  - id: well-known/app/infrastructure/ansible::ansible-module-source-context
  - id: metadata/package/testing/presence/harness::test-directory-path
