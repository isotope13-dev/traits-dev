defaults:
  for:
    - pe
    - dll
  platforms:
    - windows
composite_rules:
  - id: winmm-heuristic-pollution
    desc: Unusual multimedia import pollution
    crit: suspicious
    conf: 0.9
    # The function imports prove winmm is linked; the library-name string is
    # not required, since MinGW keeps it in .idata rather than .rdata.
    all:
      - id: micro-behaviors/hardware/input/audio::wave-in-reset
      - id: metadata/binary/symbols/imports::midi-out-long-msg
    any:
      - id: metadata/binary/symbols/imports::mmio-install-ioproc
      - id: micro-behaviors/hardware/input/audio::mixer-line-controls
    downgrade:
      any:
        - id: metadata/binary/symbols/count::many-exports
        - id: metadata/binary/resource/identity::pe-version-resource
        # Wine builtin multimedia components (e.g. mmsystem.dll16) legitimately
        # import the full winmm surface they thunk; the combination is their
        # declared function, not heuristic pollution. Downgrade rather than
        # suppress so the import pattern stays visible for differential analysis.
        - id: well-known/lib/platform/wine::wine-builtin-binary
  - id: packed-winmm-import-pollution
    desc: Packed binary with polluted winmm imports
    crit: suspicious
    conf: 0.93
    all:
      - id: winmm-heuristic-pollution
      - id: metadata/binary/layout/entropy::high-entropy-writable-executable-layout
