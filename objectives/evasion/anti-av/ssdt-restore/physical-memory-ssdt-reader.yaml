# A user-mode program that opens the PhysicalMemory section, names the kernel's
# service table and carries a security-product process name is positioned to
# read or rewrite the SSDT, undoing the hooks that security software installs.
defaults:
  platforms: [windows]
  for: [pe]
  attack: T1562.001,T1014
composite_rules:
  - id: physical-memory-ssdt-access-with-security-product-target
    desc: PhysicalMemory SSDT access aimed at security product
    crit: hostile
    conf: 0.85
    all:
      - id: micro-behaviors/os/kernel/ssdt-access::physical-memory-device-path
      - id: micro-behaviors/os/kernel/ssdt-access::ke-service-descriptor-table-name
      - id: micro-behaviors/os/security/product::qihoo-active-defense-process
