# A request to the user, not evidence that antivirus settings were changed.
# Use raw bytes: native Rust UI literals can be omitted by garbage-filtered
# string extraction even though the complete sentences are present in .rdata.
defaults:
  platforms: [windows]
  for: [pe, dll]
  crit: suspicious
  conf: 0.94
traits:
  - id: antivirus-blocking-disable-restart-prompt
    desc: Prompts disabling antivirus to restart an app
    attack: T1562.001
    if:
      type: raw
      regex: '(?i)anti-?virus is (blocking|preventing)[^\x00]{1,160}\. please disable it and restart'
