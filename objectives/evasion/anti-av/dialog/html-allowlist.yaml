# Install and download pages that talk the visitor past endpoint
# protection: directing a file, download or program through antivirus,
# Defender or SmartScreen. Firewall allowlisting guides name the firewall
# explicitly and are excluded.
defaults:
  platforms: [windows, unix]
  for: [html]
  attack: T1562.001
  crit: component
  conf: 0.85
traits:
  - id: av-bypass-verb-object
    desc: Bypass verb with file target
    if:
      type: text
      exclude_html_comments: true
      regex: '(?i)\b(allow|disable|exclude|turn off)[^<>]{0,50}\b(file|download\w*|software|app|tool)\b'
  - id: av-bypass-target
    desc: AV product after bypass preposition
    if:
      type: text
      exclude_html_comments: true
      regex: '(?i)\b(through|past|in|off)\b[^<>]{0,30}\b(antivirus|defender|smartscreen)\b'
composite_rules:
  - id: av-bypass-instruction
    desc: Page tells visitor to bypass antivirus
    crit: notable
    conf: 0.9
    near_bytes: 200
    all:
      - id: objectives/evasion/anti-av/dialog::av-bypass-verb-object
      - id: objectives/evasion/anti-av/dialog::av-bypass-target
