# Impair Defenses: Safe Mode Boot (MITRE T1562.009).
#
# Windows Safe Mode starts only the services enumerated under the
# HKLM\SYSTEM\CurrentControlSet\Control\SafeBoot\{Minimal,Network} allow-list
# keys. Third-party AV/EDR agents (Huntress, CrowdStrike, SentinelOne, ...) are
# not on that list and do not run in Safe Mode, and Defender real-time
# protection is suspended for the Safe Mode window. Ransomware affiliates
# (Akira, Snatch, AvosLocker, BlackBasta) weaponize this: they register their
# encryptor/loader as a SafeBoot-allowed service, flip the boot configuration
# with `bcdedit /set {...} safeboot {minimal|network}` (optionally swapping the
# Safe Mode shell for cmd.exe via `safebootalternateshell yes`), then reboot to
# detonate in an unmonitored window.
#
# These composites fire when the boot-config flip is paired with either the
# safe-mode service smuggling or the concurrent disabling of AV/EDR — the
# combination is what makes it an attack rather than benign troubleshooting.
# The force-safe-mode boot atom itself (bcdedit safeboot) lives in
# objectives/impact/degrade/edr/teardown; the safe-mode service allow-list
# registration lives in objectives/persistence/system/service/install.
defaults:
  platforms: [windows]
  for: [batch, powershell, pe, dll, csharp, vbs, javascript]
  attack: T1562.009
  mbc: F0004

traits:
  - id: safe-mode-network-boot-event
    desc: Safe Mode with Networking boot event
    crit: notable
    conf: 0.96
    for: [data, batch, powershell]
    # Windows Kernel-Boot records the load option when the host enters the
    # network-enabled Safe Mode state. This also works on copied event text,
    # not only on the command that originally changed the BCD.
    if:
      type: text
      regex: '(?i)\bKernel-Boot\s+EID\s+27\b[^\r\n]{0,180}\bSAFEBOOT\s*:\s*NETWORK\b'

  - id: safe-mode-bootmode-event
    desc: Windows Safe Mode boot-mode event
    crit: notable
    conf: 0.96
    for: [data, batch, powershell]
    if:
      type: text
      regex: '(?i)\bKernel-General\s+EID\s+12\b[^\r\n]{0,120}\bBootMode\s*=\s*2\b'

  - id: bcdedit-safeboot-alternate-shell
    desc: Swaps Safe Mode shell for cmd.exe
    crit: suspicious
    conf: 0.95
    # `safebootalternateshell yes` makes Safe Mode launch cmd.exe instead of
    # explorer.exe, giving an unattended command shell after the forced reboot.
    if:
      type: text
      regex: '(?i)\bbcdedit(\.exe)?\s+/set\s+\{[^}\r\n]{1,40}\}\s+safebootalternateshell\s+yes\b'

composite_rules:
  - id: force-safe-mode-boot
    desc: Forces the next boot into Windows Safe Mode
    crit: suspicious
    conf: 0.95
    any:
      - id: objectives/impact/degrade/edr/teardown::bcdedit-safeboot-minimal
      - id: bcdedit-safeboot-alternate-shell

  - id: safe-mode-service-persistence-blind
    desc: Smuggles a service into the SafeBoot allow-list then forces a Safe Mode reboot
    crit: hostile
    conf: 0.98
    all:
      - id: force-safe-mode-boot
      - id: objectives/persistence/system/service/install::safeboot-service-registration

  - id: safe-mode-boot-defense-blind
    desc: Forces a Safe Mode reboot while disabling AV/EDR to detonate unobserved
    crit: hostile
    conf: 0.98
    all:
      - id: force-safe-mode-boot
    any:
      - id: objectives/evasion/anti-av/platform/defender::defender-disable-realtime
      - id: objectives/evasion/anti-av/service::defender-service-teardown
      - id: objectives/evasion/anti-av/platform/defender::disable-windows-defender-service
      - id: objectives/impact/degrade/edr/teardown::target-crowdstrike-service
