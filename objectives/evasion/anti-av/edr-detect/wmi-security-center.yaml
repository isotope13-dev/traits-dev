defaults:
  for:
    - pe
    - dll
    - csharp
  crit: component
  conf: 0.9
  mbc: B0013
  platforms:
    - windows
traits:
  - id: renamed-wmic-binary
    desc: Renamed WMIC binary execution
    crit: suspicious
    conf: 0.96
    for: [batch, powershell, pe, dll, csharp]
    if:
      type: text
      regex: '(?i)wmic\.exe\.bak'
composite_rules:
  - id: renamed-wmic-security-enumeration
    desc: Renamed WMIC security enumeration
    crit: hostile
    conf: 0.98
    attack: "T1518.001, T1036"
    for: [batch, powershell, pe, dll, csharp]
    all:
      - id: renamed-wmic-binary
      - id: micro-behaviors/os/wmi/query::security-center2-namespace
    any:
      - id: micro-behaviors/os/wmi/query::antivirus-product-class
      - id: micro-behaviors/os/wmi/query::firewall-product-class
      - id: micro-behaviors/os/wmi/query::antispyware-product-class
