# Security-product discovery from the command line: list the running processes
# and filter the list for an endpoint-agent vendor.
#
# This is the first thing a hands-on-keyboard operator runs after landing on a
# host — "which agent am I fighting?" — and it decides everything that
# follows (whether to load a killer driver, which exclusion to add, whether to
# leave). The sibling wmi/ directory covers the SecurityCenter2 provider
# query, which is the API-shaped way to ask the same question.
#
# The vendor-name atoms in objectives/impact/degrade/edr/targeting/ cannot
# express this form: operators type a *stem* into the filter — `findstr soph`,
# `findstr crowd` — never the whole product name those atoms match on a word
# boundary. So each atom here carries the filter verb and the stem together,
# which is also what keeps `soph` off the word "sophisticated": the stem has
# to be sitting in a filter command's argument. Conviction still needs the
# process listing, supplied by the composite.
#
# ATT&CK: T1518.001 (Software Discovery: Security Software Discovery)
defaults:
  platforms: [windows]
  for: [batch, powershell, csharp, vbs]
  crit: notable
  conf: 0.9
  attack: T1518.001
  mbc: B0013

traits:
  - id: filter-argument-defender-stem
    desc: Output filter argument names Defender
    if:
      type: text
      regex: '(?i)\b(findstr|Select-String)\b[^\r\n]{0,24}(defend|msmpeng)'

  - id: filter-argument-sophos-stem
    desc: Output filter argument names Sophos
    if:
      type: text
      regex: '(?i)\b(findstr|Select-String)\b[^\r\n]{0,24}soph'

  - id: filter-argument-edr-vendor-stem
    desc: Output filter names CrowdStrike or SentinelOne
    if:
      type: text
      regex: '(?i)\b(findstr|Select-String)\b[^\r\n]{0,24}(crowd|sentinel|cylance)'

  - id: filter-argument-av-vendor-stem
    desc: Output filter names McAfee, Trend or Kaspersky
    if:
      type: text
      regex: '(?i)\b(findstr|Select-String)\b[^\r\n]{0,24}(mcafee|trend|kaspersk)'

  - id: filter-argument-av-suite-stem
    desc: Output filter names ESET, Bitdefender or MBAM
    if:
      type: text
      regex: '(?i)\b(findstr|Select-String)\b[^\r\n]{0,24}(eset|bitdef|malwarebyt)'

composite_rules:
  - id: security-vendor-filter-argument
    desc: Output filter argument names a security vendor
    crit: notable
    conf: 0.9
    any:
      - id: filter-argument-defender-stem
      - id: filter-argument-sophos-stem
      - id: filter-argument-edr-vendor-stem
      - id: filter-argument-av-vendor-stem
      - id: filter-argument-av-suite-stem

  - id: security-product-shell-enumeration
    desc: Security product enumerated from a shell
    # Filter-with-a-vendor-stem plus a process listing on the same command
    # line. Neither half convicts: `findstr soph` could be reading a log, and
    # `tasklist` is ordinary.
    crit: suspicious
    conf: 0.93
    all:
      - id: security-vendor-filter-argument
    any:
      - id: micro-behaviors/process/lifecycle/supervise::watchdog-process-filter
      - id: micro-behaviors/process/enumerate/shell::tasklist
      - id: micro-behaviors/process/enumerate/shell::get-process-by-name
    near_bytes: 160
    unless:
      - id: metadata/package/testing/presence/harness/
