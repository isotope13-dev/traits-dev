defaults:
  platforms: [windows]
  for: [javascript, typescript]
traits:
  - id: rtl-get-current-peb-reference
    desc: References RtlGetCurrentPeb API
    crit: notable
    conf: 0.9
    if:
      type: text
      word: RtlGetCurrentPeb

  - id: sentinelone-edr-dll-reference
    desc: References SentinelOne EDR DLL name
    crit: notable
    conf: 0.9
    if:
      type: text
      case_insensitive: true
      regex: '\b(sentinelone|sentinelagent|sentinelmonitor)\.dll\b'

  - id: bitdefender-edr-dll-reference
    desc: References Bitdefender EDR DLL name
    crit: notable
    conf: 0.9
    if:
      type: text
      case_insensitive: true
      regex: '\b(atcuf64|atcuf32|bdhkm64|bdsentry)\.dll\b'

  - id: sophos-edr-dll-reference
    desc: References Sophos EDR DLL name
    crit: notable
    conf: 0.9
    if:
      type: text
      case_insensitive: true
      regex: '\b(sophosmr|sophosed|hmpalert)\.dll\b'

composite_rules:
  - id: node-peb-edr-dll-enumeration
    desc: Enumerates PEB modules to detect EDR DLLs
    crit: hostile
    conf: 0.98
    attack: T1518.001,T1497
    all:
      - id: rtl-get-current-peb-reference
    any:
      - id: sentinelone-edr-dll-reference
      - id: bitdefender-edr-dll-reference
      - id: sophos-edr-dll-reference
    needs: 2
