# Security-product discovery on Android: the app hardcodes a list of
# third-party endpoint-security package names while carrying an encrypted
# native stage. A legitimate app has no reason to know which *other* vendors'
# AV products are installed; a packed stage does, because whether the payload
# runs can depend on the answer.
#
# The intent pairing lives here rather than in discovery/host/security/
# because "checks for security software while carrying an encrypted native
# payload" is an evasion objective, not reconnaissance.
#
# ATT&CK: T1518.001 (Security Software Discovery)
defaults:
  platforms: [android]
  for: [dex, apk, elf]

composite_rules:
  - id: android-packed-stage-av-check
    desc: Encrypted-stage Android app carries AV package inventory
    crit: hostile
    conf: 0.96
    scope: outer
    all:
      - id: objectives/discovery/host/security::android-security-product-package-list
      - id: objectives/command-and-control/dropper/staged-loader::android-native-encrypted-stage-writer
