# The command is a reference; the rule does not bind its execution or the
# allocation to a downloaded payload. Broad executable exclusions alongside
# encoded Lua and executable memory nevertheless warrant review.
defaults:
  platforms: [windows]
  for: [lua]
  attack: T1562.001

composite_rules:
  - id: encoded-lua-exclusion-rwx-references
    desc: Encoded Lua with exclusion and RWX references
    crit: suspicious
    conf: 0.93
    all:
      - id: metadata/lang/encoding/shape::lua-many-decimal-escaped-strings
      - id: micro-behaviors/os/security/defender::lua-executable-extension-exclusion-command
      - id: micro-behaviors/mem/alloc/virtual::lua-virtualalloc-rwx-alias-call
