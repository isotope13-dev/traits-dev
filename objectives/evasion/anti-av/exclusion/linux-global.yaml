# Linux global exclusions mute AV and EDR at the sensor. Ordinary epp
# exclusions, listing, and removals do not establish that effect. Keep the
# operation and scope in one command; a nearby unrelated --scope is not enough.
# Command strings also cover scripts and native launchers in other languages.
defaults:
  platforms: [linux]
  for: [scripts, source, binaries, data]
  crit: suspicious
  conf: 0.96
  attack: T1562.001

traits:
  - id: linux-global-path-exclusion-add
    desc: Adds sensor-level Defender path exclusion
    if:
      type: text
      regex: '\bmdatp\s+exclusion\s+(file|folder)\s+add\b[^\n;&|#]{1,99}--scope[\s''"]+global\b'

  - id: linux-global-process-exclusion-add
    desc: Adds sensor-level Defender process exclusion
    if:
      type: text
      regex: '\bmdatp\s+exclusion\s+process\s+add\b[^\n;&|#]{1,99}--scope[\s''"]+global\b'
