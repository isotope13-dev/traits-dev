defaults:
  platforms: [windows]
  for: [powershell]

composite_rules:
  - id: powershell-archive-execution-with-defender-exclusion
    desc: Archive launch with Defender path exclusion
    crit: suspicious
    conf: 0.96
    attack: T1562.001
    all:
      - id: micro-behaviors/process/deploy::powershell-download-extract-and-execute
      - id: micro-behaviors/os/security/defender::powershell-exclusion-assignment
      - id: micro-behaviors/os/security/defender::defender-exclusion-path-parameter
    near_lines: 40

  # Co-occurrence supplies suspicious context; it establishes neither ordering
  # nor that the fetched response is a malicious payload.
  - id: powershell-remote-eval-with-defender-exclusion
    desc: REST response eval co-occurs with Defender exclusion
    crit: suspicious
    conf: 0.96
    attack: T1562.001,T1059.001
    all:
      - id: micro-behaviors/process/deploy::powershell-rest-response-evaluator-call
      - id: micro-behaviors/os/security/defender::powershell-exclusion-assignment
    near_lines: 40
