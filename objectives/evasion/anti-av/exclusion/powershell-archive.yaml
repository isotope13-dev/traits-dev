defaults:
  platforms: [windows]
  for: [powershell]

composite_rules:
  - id: powershell-archive-execution-with-defender-exclusion
    desc: Archive launch with Defender path exclusion
    crit: suspicious
    conf: 0.96
    attack: T1562.001
    all:
      - id: micro-behaviors/process/deploy::powershell-download-extract-and-execute
      - id: micro-behaviors/os/security/defender::powershell-exclusion-assignment
      - id: micro-behaviors/os/security/defender::defender-exclusion-path-parameter
    near_lines: 40
