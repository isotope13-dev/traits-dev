# Node code that downloads an MSI, adds a Microsoft Defender exclusion
# for the staging path, and installs the package silently blinds the
# scanner to the one directory that matters for exactly as long as the
# unattended install needs. Managed software deployment does not carve
# ad-hoc exclusions around its own installer from a script. Hosts, file
# names and whether the exclusion is removed afterwards are not legs;
# the removal only hides that it was ever added.
defaults:
  platforms: [windows]
  for: [javascript, typescript]
  attack: T1562.001,T1218.007,T1105

composite_rules:
  - id: node-defender-exclusion-silent-msi-install
    desc: Defender-excluded staging silently installs downloaded MSI
    crit: hostile
    conf: 0.96
    near_bytes: 4096
    all:
      - id: micro-behaviors/communications/http/download/handler::node-https-get-write-stream-pipe
      - id: micro-behaviors/os/security/defender::defender-exclusion-path-parameter
      - id: micro-behaviors/os/package-manager/management::msiexec-package-verb
      - id: micro-behaviors/os/package-manager/config::msiexec-quiet-switch
