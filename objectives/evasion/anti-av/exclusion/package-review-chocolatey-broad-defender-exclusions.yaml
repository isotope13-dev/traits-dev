defaults:
  platforms: [windows]
  for: [nupkg]
  attack: T1195.002
composite_rules:
  - id: chocolatey-broad-defender-exclusions
    desc: Chocolatey hook excludes temp and a process
    crit: hostile
    conf: 0.99
    scope: archive
    for: [nupkg, pe, batch, python, javascript, powershell, vbs, data]
    all:
      - id: metadata/package/files/nuget::chocolatey-install-script-member
      - id: micro-behaviors/os/security/defender::defender-exclusion-command
      - id: micro-behaviors/os/security/defender::defender-exclusion-temp-environment
      - id: micro-behaviors/os/security/defender::defender-exclusion-process

