defaults:
  platforms: [windows]
  for: [powershell]
composite_rules:
  - id: powershell-users-tree-exclusion
    desc: Defender exclusion covers all user profiles
    crit: suspicious
    conf: 0.98
    attack: T1562.001
    near_lines: 1
    all:
      - id: micro-behaviors/os/security/defender::defender-preference-mutation-call
      - id: micro-behaviors/os/security/defender::defender-exclusion-users-root
