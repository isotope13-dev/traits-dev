defaults:
  attack: T1562.001
  for:
  - pe
  - powershell
  - batch
  - vbs
  platforms:
  - windows
composite_rules:
- id: defender-excludes-telegram-stage
  desc: Defender excludes Telegram and stage
  crit: hostile
  conf: 0.98
  all:
  - id: micro-behaviors/os/security/defender::defender-exclusion-command
  - id: micro-behaviors/fs/path/personal::telegram-desktop-download-path
  - id: micro-behaviors/fs/path/application/state::programdata-directory-path
- id: defender-exclusion-staged-native-payload
  desc: Defender exclusion with staged native payload
  crit: hostile
  conf: 0.98
  for:
  - pe
  all:
  - id: micro-behaviors/os/security/defender::defender-exclusion-command
  - id: micro-behaviors/communications/url/host/oob-http::url-external-ip-binary
  - id: micro-behaviors/communications/http/client/urlmon::url-download-to-file
  any:
  - id: metadata/binary/symbols/name/process::create-process-a
  - id: metadata/binary/symbols/name/process::shell-execute-ex-a
- id: defender-exclusion-with-encrypted-loader
  desc: Defender exclusion with encrypted process loader
  crit: hostile
  conf: 0.99
  for:
  - pe
  - dll
  all:
  - id: micro-behaviors/os/security/defender::defender-exclusion-command
  - id: metadata/binary/layout/entropy::low-entropy-binary-with-dense-region
  - id: micro-behaviors/mem/protect/modify/unspecified::virtual-protect-import
  - id: micro-behaviors/process/create/exec::child-process-creation-evidence
- id: defender-exclusion-with-named-pipe-loader
  desc: Defender exclusion with named-pipe process loader
  crit: hostile
  conf: 0.99
  for:
  - pe
  - dll
  all:
  - id: micro-behaviors/os/security/defender::defender-exclusion-command
  - id: micro-behaviors/communications/ipc/named-pipe::nt-create-named-pipe
  - id: micro-behaviors/process/create/exec::child-process-creation-evidence
  - id: metadata/binary/resource/identity::version-fields-with-short-identity-tokens
