defaults:
  for:
  - pe
  platforms:
  - windows
  attack: T1562.001
composite_rules:
- id: xor-hidden-defender-path-process-exclusions
  desc: Concealed PE mapper adds Defender exclusions
  crit: hostile
  conf: 0.98
  all:
  - id: xor-hidden-defender-exclusion-command
  - id: micro-behaviors/process/inject/runtime/call::go-x86-pe-map-entry-dispatch
traits:
- id: xor-hidden-defender-exclusion-command
  desc: XOR-hidden Defender path/process command
  crit: suspicious
  conf: 0.98
  if:
    type: yara
    source: |
      import "pe"
      rule xor_hidden_defender_path_process_exclusions {
        strings:
          $cmd = "-NoProfile -NonInteractive -WindowStyle Hidden -Command Add-MpPreference -ExclusionPath" xor(1-255)
          $process = "-ExclusionProcess" xor(1-255)
        condition:
          $cmd and $process and
          for any i in (1..#cmd) : (
            for any j in (1..#process) : (
              @process[j] > @cmd[i] and @process[j] < @cmd[i] + 256 and
              uint8(@cmd[i]) ^ 0x2d == uint8(@process[j]) ^ 0x2d and
              for any s in pe.sections : (
                s.characteristics & 0x20000000 == 0 and
                @cmd[i] >= s.raw_data_offset and
                @process[j] + !process[j] <= s.raw_data_offset + s.raw_data_size
              )
            )
          )
      }
