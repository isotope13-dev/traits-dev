# A Go loader that adds its own path to the Windows Defender exclusion
# list through MpCmdRun (falling back to PowerShell Add-MpPreference)
# and then AES-decrypts staged payload bodies has disabled the only
# scanner that would inspect those payloads. Admin tooling that manages
# exclusions does not pair the mutation with payload decryption stages.
defaults:
  platforms: [windows]
  for: [pe]
  attack: T1562.001,T1027
  mbc: B0023

composite_rules:
  - id: defender-exclusion-decrypted-payload-loader
    desc: Defender exclusion precedes AES payload decryption stages
    crit: hostile
    conf: 0.96
    all:
      - id: micro-behaviors/os/security/defender::scanner-path-exclusion-references
      - id: micro-behaviors/crypto/decrypt::go-cbc-decrypter-name-reference
      - id: metadata/binary/symbols/name::go-main-autorun-name
    unless:
      - id: metadata/signed/platform/
