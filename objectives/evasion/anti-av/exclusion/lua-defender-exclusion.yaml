defaults:
  for:
  - lua
  platforms:
  - windows
  attack: T1562.001
composite_rules:
- id: obfuscated-lua-persistence-root-exclusions
  desc: Obfuscated Lua persists and broadly excludes payloads from Defender
  crit: hostile
  conf: 0.97
  all:
  - id: metadata/lang/encoding/shape/escape::lua-many-decimal-escaped-strings
  - id: objectives/evasion/anti-av/platform/defender::defender-systemdrive-exclusion
  - id: micro-behaviors/os/security/defender::lua-executable-extension-exclusion-command
  - id: micro-behaviors/os/autorun/task-registration::schtasks-create-cmd
  - id: well-known/app/system/microsoft/rundll32::rundll32-command-text
- id: obfuscated-lua-defender-exclusion
  desc: Obfuscated Lua broadly excludes Defender scans
  crit: hostile
  conf: 0.99
  attack: T1059.011,T1562.001,T1027
  all:
  - id: micro-behaviors/os/security/defender::lua-executable-extension-exclusion-command
  - id: micro-behaviors/os/security/defender::lua-system-drive-exclusion-command
  any:
  - id: metadata/lang/encoding/shape/escape::lua-many-decimal-escaped-strings
  - id: metadata/lang/source/syntax/conditional::lua-parenthesized-if-comparisons
  - id: micro-behaviors/data/string/concat/expression::lua-double-indexed-concat-loop
  - id: micro-behaviors/data/control-flow/return::lua-return-vararg-wrapper
