# A cipher API token can originate in the bundled runtime. It does not
# establish that the application decrypts a payload. Preserve this exclusion
# profile without making a decryption or execution-order claim.
defaults:
  platforms: [windows]
  for: [pe]
  attack: T1562.001
composite_rules:
  - id: pkg-node-admin-defender-exclusion-cipher-reference
    desc: Admin-probing pkg has Defender exclusion and cipher reference
    crit: hostile
    conf: 0.88
    all:
      - id: micro-behaviors/fs/path/script::pkg-snapshot-entrypoint-path
      - id: micro-behaviors/os/privilege/check::net-session-admin-check-raw
      - id: micro-behaviors/os/security/defender::defender-exclusion-path-parameter
      - id: micro-behaviors/crypto/decrypt::embedded-createdecipheriv-reference
    unless:
      - id: metadata/signed/platform/
