# A Node.js application frozen with pkg whose bundle checks for administrator
# rights with `net session`, carries a Defender exclusion command and
# decrypts a payload with createDecipheriv is a dropper that excludes its
# drop folders from Defender before writing and running the decrypted file.
defaults:
  platforms: [windows]
  for: [pe]
  attack: T1562.001,T1140,T1059.001
composite_rules:
  - id: pkg-node-admin-check-defender-exclusion-and-decrypt
    desc: pkg Node bundle excludes paths from Defender, decrypts
    crit: hostile
    conf: 0.88
    all:
      - id: micro-behaviors/data/runtime/library::pkg-snapshot-entrypoint-path
      - id: micro-behaviors/os/privilege/check::net-session-admin-check-raw
      - id: micro-behaviors/os/security/defender::defender-exclusion-path-parameter
      - id: objectives/command-and-control/dropper/staging/memory::pe-createdecipheriv-text
    unless:
      - id: metadata/signed/platform/
