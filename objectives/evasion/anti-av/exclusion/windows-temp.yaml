# Excluding the shared Windows temporary directory weakens scanning of a
# common staging surface. Administrators can also configure this; suspicious,
# not proof of a malicious payload or successful configuration change.
defaults:
  platforms: [windows]
  for: [scripts, source, binaries]
  attack: T1562.001
traits:
  - id: defender-windows-temp-exclusion
    desc: Excludes Windows Temp from Defender scanning
    crit: suspicious
    conf: 0.96
    if:
      type: text
      regex: '(?i)\b(Set|Add)-MpPreference\s+-ExclusionPath\s+[''"]?[A-Z]:\\+Windows\\+Temp([\\''"\s]|$)'
