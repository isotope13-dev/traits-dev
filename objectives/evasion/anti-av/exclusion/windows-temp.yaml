# TEMP/TMP and the system Temp directory are shared staging surfaces.
# Administrative allowlisting is possible, so this remains suspicious.
defaults:
  platforms: [windows]
  for: [scripts, source, binaries]
  attack: T1562.001
composite_rules:
  - id: defender-windows-temp-exclusion
    desc: Defender exclusion mutation targets Windows temp
    crit: suspicious
    conf: 0.96
    near_lines: 0
    all:
      - id: micro-behaviors/os/security/defender/exclusion::defender-exclusion-command-reference
      - id: micro-behaviors/os/security/defender/exclusion::defender-exclusion-temp-environment
