defaults:
  platforms:
  - windows
  for:
  - vbs
  - javascript
  attack: T1059.001,T1059.005,T1105
  mbc: B0030
  crit: hostile
  conf: 0.98

composite_rules:
- id: wsh-encoded-defender-exclusion-download
  for:
  - vbs
  desc: Encoded PowerShell exclusion and executable URL clues
  attack: T1059.001,T1105,T1562.001
  all:
  - id: metadata/lang/source/syntax/command/launch::encoded-command-line
  - id: micro-behaviors/communications/http/download/cli/web-cmdlet::encoded-iwr-outfile-command
  - id: micro-behaviors/communications/url/resource-path/file::http-executable-url-reference
  - id: micro-behaviors/os/security/defender::defender-exclusion-command
  - id: micro-behaviors/os/security/policy::execution-policy-bypass
  - id: micro-behaviors/process/argument/visibility::powershell-hidden-window
