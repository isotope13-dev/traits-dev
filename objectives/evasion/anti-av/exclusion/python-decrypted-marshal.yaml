defaults:
  platforms: [windows]
  for: [python]
composite_rules:
  - id: python-exclusions-with-decrypted-marshal-exec
    desc: Defender exclusion beside decrypted bytecode
    crit: hostile
    conf: 0.99
    attack: T1562.001
    all:
      - id: micro-behaviors/process/deploy/script-eval/transformed::python-decrypted-marshal-exec
      - id: micro-behaviors/os/security/defender::python-interpreter-exclusion-argument
      - id: micro-behaviors/process/deploy/interpreter-command::python-powershell-command-argv
      - id: micro-behaviors/os/security/execution-policy::python-powershell-policy-bypass-argv-pair
      - id: micro-behaviors/process/config/launch::python-create-no-window-hex
