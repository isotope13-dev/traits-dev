# These required observations concern Defender evasion, not payload staging
# or a command channel. Carved V8 caches in a RET-only PE do not run: retain
# the command/path/encoding atoms, but do not infer this executable's evasion.
defaults:
  platforms: [windows]
  for: [pe]

composite_rules:
  - id: pkg-node-bundle-with-admin-check-and-hidden-defender-exclusion
    desc: pkg admin check with hidden Defender exclusion
    crit: hostile
    conf: 0.85
    attack: T1562.001,T1059.001
    all:
      - id: micro-behaviors/fs/path/script::pkg-snapshot-entrypoint-path
      - id: micro-behaviors/process/argument/option::powershell-hidden-command-text
      - id: micro-behaviors/os/security/defender::defender-exclusion-command
      - id: micro-behaviors/os/privilege/check::net-session-admin-check-raw
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/code/control-transfer::pe-return-entry-without-callbacks
