defaults:
  platforms: [windows]
  for: [pe]
composite_rules:
  - id: managed-temp-writer-defender-exclusion
    desc: Temp EXE writer with PowerShell AV exclusion
    crit: hostile
    conf: 0.96
    attack: T1562.001
    all:
      - id: micro-behaviors/process/create/flags::managed-temp-exe-launch-record
      - id: micro-behaviors/fs/write/file/full::dotnet-writeallbytes-token
      - id: metadata/binary/symbols/name::dotnet-filename-setter-name
      - id: micro-behaviors/process/create/spawn::dotnet-process-start-split-tokens
      - id: micro-behaviors/os/security/defender::defender-exclusion-command-reference
      - id: micro-behaviors/fs/path/application/executable::powershell-executable-token
