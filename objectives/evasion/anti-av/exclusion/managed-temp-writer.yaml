defaults:
  platforms: [windows]
  for: [pe]
composite_rules:
  - id: managed-temp-writer-defender-exclusion
    desc: Temp EXE writer with PowerShell AV exclusion
    crit: hostile
    conf: 0.96
    attack: T1562.001
    all:
      - id: micro-behaviors/process/config/launch::managed-temp-exe-launch-record
      - id: metadata/file/profile/file-operation/write-api::dotnet-writeallbytes-token
      - id: metadata/binary/symbols/name/token/filesystem::dotnet-filename-setter-name
      - id: metadata/file/profile/process/launch::dotnet-process-start-split-tokens
      - id: micro-behaviors/os/security/defender::defender-exclusion-command-reference
      - id: micro-behaviors/fs/path/application/interpreter::powershell-executable-token
