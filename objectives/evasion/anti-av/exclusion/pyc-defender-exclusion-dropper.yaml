defaults:
  for: [pyc]
  platforms: [windows]

traits:
  - id: pyc-anti-debug-apis
    desc: Python bytecode references anti-debug APIs
    crit: notable
    conf: 0.95
    if:
      type: raw
      regex: 'IsDebuggerPresent[\s\S]{0,64}RtlGetNtGlobalFlags'

  - id: pyc-is-user-an-admin
    desc: Python bytecode checks IsUserAnAdmin
    crit: notable
    conf: 0.90
    if:
      type: text
      substr: IsUserAnAdmin

  - id: pyc-shell-execute-w
    desc: Python bytecode calls ShellExecuteW
    crit: notable
    conf: 0.90
    if:
      type: text
      exact: ShellExecuteW

  - id: pyc-unblock-file-ps
    desc: Python bytecode runs PowerShell Unblock-File
    crit: notable
    conf: 0.95
    if:
      type: text
      substr: Unblock-File

composite_rules:
  - id: pyc-defender-exclusion-evasive-dropper
    desc: Python bytecode Defender exclusion and evasive dropper
    crit: hostile
    conf: 0.98
    attack: T1562.001,T1548.002,T1622
    all:
      - id: micro-behaviors/os/security/defender/exclusion::bytecode-defender-exclusion-option
      - id: pyc-anti-debug-apis
      - id: pyc-is-user-an-admin
      - id: pyc-shell-execute-w
      - id: pyc-unblock-file-ps
  # Independent of the Defender exclusion: a socket-fed loader that strips the
  # Mark-of-the-Web from what it received and then launches it.
  - id: pyc-socket-fetch-unblock-launch-loader
    desc: Python bytecode receives files by socket and launches them
    crit: hostile
    conf: 0.95
    attack: T1105,T1553.005
    all:
      - id: micro-behaviors/communications/socket/connect/attempt::socket-connect-pyc-name
      - id: micro-behaviors/communications/socket/receive::socket-recv-pyc-name
      - id: pyc-unblock-file-ps
      - id: pyc-shell-execute-w
