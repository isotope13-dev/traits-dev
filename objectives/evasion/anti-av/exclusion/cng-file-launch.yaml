# Defender exclusion with crypto, file and process API evidence.
defaults:
  platforms:
  - windows
  for:
  - pe
composite_rules:
- id: defender-exclusion-decrypt-file-launch-apis
  desc: Defender exclusion, decryption and launch APIs
  crit: hostile
  conf: 0.99
  for:
  - pe
  - dll
  attack: T1562.001
  all:
  - id: micro-behaviors/crypto/cipher/mode::bcrypt-cbc-mode-references
  - id: micro-behaviors/crypto/decrypt/transform/call::bcrypt-decrypt-api
  - id: micro-behaviors/os/security/defender/exclusion::defender-exclusion-command
  - id: micro-behaviors/process/argument/visibility::powershell-hidden-command-text
  - id: micro-behaviors/fs/write/file/handle/call::write-file
  - id: micro-behaviors/process/create/subprocess/reference::create-process-a-api-reference
