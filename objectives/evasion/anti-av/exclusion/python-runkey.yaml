defaults:
  platforms: [windows]
  for: [pyc]
  attack: T1562.001,T1547.001

composite_rules:
  - id: python-pyc-defender-exclusion-with-runkey
    desc: Python bytecode adds a Defender exclusion and Run-key startup
    crit: hostile
    conf: 0.97
    all:
      - id: micro-behaviors/os/security/defender::defender-exclusion-command-reference
      - id: micro-behaviors/os/security/defender::defender-exclusion-option-text
      - id: micro-behaviors/os/registry/keys/autostart::pyc-hkcu-run-key
      - id: micro-behaviors/os/registry/access::python-bytecode-winreg-value-write
