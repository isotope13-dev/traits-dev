defaults:
  platforms: [windows]
  for: [pyc]
  attack: T1562.001,T1547.001

composite_rules:
  - id: python-pyc-defender-exclusion-with-runkey
    desc: Bytecode references Defender exclusion and Run-key writes
    crit: hostile
    conf: 0.97
    all:
      - id: micro-behaviors/os/security/defender::defender-exclusion-command-reference
      - id: micro-behaviors/os/security/defender::defender-exclusion-option-text
      - id: micro-behaviors/os/registry/autostart/reference::currentversion-run-key-path
      - id: metadata/binary/code/bytecode::python-bytecode-winreg-value-write
