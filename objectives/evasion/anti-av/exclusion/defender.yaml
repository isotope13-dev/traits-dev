# Exclusion configuration and concealment. These settings can also be used
# administratively, so their static evidence is suspicious rather than hostile.
defaults:
  platforms: [windows]
  for: [scripts, source, binaries, data]
  attack: T1562.001
traits:
  - id: powershell-exclusion-assignment
    desc: Sets or adds a Defender scan exclusion
    crit: suspicious
    conf: 0.95
    if:
      type: text
      regex: (?i)\b(Set|Add)-MpPreference[\s`]{1,24}-Exclusion(Path|Extension|Process|IpAddress)\b
    unless:
    - id: well-known/dual-use/tunnel/frp/
    - id: well-known/tool/development/toolchain/go-x-build::go-x-build-infra-context
    - id: metadata/package/documentation/agent-safety::security-example-documentation
    - id: well-known/tool/sysadmin/kubernetes/bootstrap::kubernetes-windows-gce-script
    # Tirith detector sources catalog the exclusion strings they catch.
    - id: well-known/tool/detection/tirith::tirith-defensive-scanner-context
    - id: well-known/app/infrastructure/ansible/
  - id: python-hide-exclusions-enable
    desc: Writes enabled exclusion concealment policy
    crit: suspicious
    conf: 0.98
    for: [python]
    if:
      type: symbol
      kind: call
      exact: winreg.SetValueEx
      args:
        - index: 1
          exact: HideExclusionsFromLocalAdmins
        - index: 4
          kind: number
          value: 1
  - id: registry-exclusion-add
    desc: Adds a Defender registry policy exclusion
    crit: suspicious
    conf: 0.97
    attack: T1562.001,T1112
    if:
      type: text
      regex: '(?i)\breg(\.exe)?\s+add\s+"[^"\r\n]{1,80}Windows Defender\\+Exclusions\\+\w+"'
composite_rules:
  - id: cim-exclusion-assignment
    desc: Adds Defender exclusions through CIM
    crit: suspicious
    conf: 0.96
    near_lines: 1
    all:
      - id: micro-behaviors/os/security/defender::cim-preference-add-method
      - id: micro-behaviors/os/security/defender::cim-exclusion-argument
  - id: dotnet-registry-exclusion-write
    desc: .NET registry write near Defender exclusions
    crit: suspicious
    conf: 0.93
    near_bytes: 256
    all:
      - id: micro-behaviors/os/security/defender::exclusion-store-category
      - id: micro-behaviors/os/registry/manipulate::dotnet-registry-key-write
    unless:
      - id: well-known/tool/offensive/peas/

  - id: python-writable-exclusion-key
    desc: Opens Defender exclusions for registry writes
    crit: suspicious
    conf: 0.93
    for: [python]
    near_lines: 1
    all:
      - id: micro-behaviors/os/security/defender::python-exclusion-key-open
      - id: micro-behaviors/os/registry/permission::python-registry-write-permission
  - id: registry-hide-exclusions-enable
    desc: Enables Defender exclusion concealment policy
    crit: suspicious
    conf: 0.98
    near_lines: 1
    all:
      - id: micro-behaviors/os/registry/manipulate::machine-registry-add-command
      - id: micro-behaviors/os/security/defender::policy-registry-value-option
      - id: micro-behaviors/os/security/defender::hide-exclusions-enabled-option
