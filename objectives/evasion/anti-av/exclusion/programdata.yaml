# ProgramData contains ordinary application data too: this is suspicious
# exclusion mutation, not enough evidence to assert malware by itself.
defaults:
  platforms: [windows]
  for: [scripts, source, binaries, data]
  attack: T1562.001

composite_rules:
  - id: defender-programdata-subtree-exclusion
    desc: Defender exclusion mutation targets ProgramData subtree
    crit: suspicious
    conf: 0.95
    near_bytes: 192
    all:
      - id: micro-behaviors/os/security/defender::defender-exclusion-command-reference
      - id: micro-behaviors/os/security/defender::programdata-exclusion-path-argument-any
    any:
      - id: micro-behaviors/os/security/defender::defender-exclusion-cmdlet
      - id: micro-behaviors/os/security/defender::defender-preference-mutation-call
