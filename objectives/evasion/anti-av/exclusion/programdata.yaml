# ProgramData contains ordinary application data too: this is suspicious
# exclusion mutation, not enough evidence to assert malware by itself.
defaults:
  platforms: [windows]
  for: [scripts, source, binaries, data]
  attack: T1562.001

composite_rules:
  - id: defender-programdata-subtree-exclusion
    desc: Defender exclusion mutation targets ProgramData
    crit: suspicious
    conf: 0.95
    near_lines: 0
    all:
      - id: micro-behaviors/os/security/defender/exclusion::defender-exclusion-command-reference
      - id: micro-behaviors/os/security/defender/exclusion::programdata-exclusion-path-argument-any
    any:
      - id: micro-behaviors/os/security/defender/policy::defender-preference-mutation-cmdlet
      - id: micro-behaviors/os/security/defender/exclusion::defender-preference-mutation-call
    # Kubernetes node bootstrap adds Defender exclusions for its own kubelet
    # and CNI paths under C:\k (Azure/AgentBaker). That is vendor-intended.
    downgrade:
      scope: file-or-parent
      any:
        - id: metadata/path/software::azure-agentbaker-tree
