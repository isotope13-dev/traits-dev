defaults:
  for: [python]
  platforms: [windows]
composite_rules:
  - id: python-path-and-process-exclusion-command
    desc: Passes path and process AV exclusions
    crit: suspicious
    conf: 0.97
    attack: T1562.001
    near_lines: 20
    all:
      - id: micro-behaviors/os/security/defender::defender-preference-option-prefix
      - id: micro-behaviors/os/security/defender::defender-exclusion-path-parameter
      - id: micro-behaviors/os/security/defender::defender-exclusion-process-parameter

  - id: python-download-with-antivirus-exclusions
    desc: Downloads executable while configuring antivirus exclusions
    crit: hostile
    conf: 0.98
    attack: T1562.001,T1105
    all:
      - id: objectives/evasion/anti-av/exclusion::python-path-and-process-exclusion-command
      - id: micro-behaviors/communications/http/download/url::executable-url-reference-a
      - id: micro-behaviors/communications/http/client/exchange::python-http-request-file-write
    any:
      - id: micro-behaviors/process/create/subprocess/launch::popen-ast
      - id: micro-behaviors/os/handler/open::os-startfile-call
      - id: micro-behaviors/process/create/subprocess/launch::run-ast
