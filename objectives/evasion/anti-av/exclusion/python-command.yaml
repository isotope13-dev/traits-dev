defaults:
  for: [python]
  platforms: [windows]
traits:
  - id: python-path-and-process-exclusion-command
    desc: Passes path and process AV exclusions
    crit: suspicious
    conf: 0.97
    attack: T1562.001
    # Adjacent f-strings are an expression in the call facts. Require all
    # switches on that same concatenated argument, rather than file-wide text.
    if:
      type: tree-sitter
      query: |
        ((call
          function: [(identifier) (attribute)] @callee
          arguments: (argument_list
            (concatenated_string) @command)) @call
          (#not-match? @callee "(?i)^(print.*|log.*|warn.*|info|error|write|echo|display)$")
          (#match? @command "(?i)Add-MpPreference")
          (#match? @command "(?i)-ExclusionPath[ \\t]")
          (#match? @command "(?i)-ExclusionProcess[ \\t]"))
