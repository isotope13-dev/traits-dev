defaults:
  platforms: [windows]
  for: [javascript, typescript]

# An exclusion alone can be administrative. Admission here requires the
# existing linked download/launch chain with hidden elevated SAC disabling.
# Add-MpPreference is required: removing an exclusion must not satisfy this.
composite_rules:
  - id: defender-exclusion-policy-disabled-payload-launch
    desc: Defender exclusion beside policy-disabled payload launch
    crit: hostile
    conf: 0.99
    attack: T1562.001
    all:
      - id: objectives/execution/payload/file-exec::smart-app-control-disable-download-launch
      - id: micro-behaviors/os/security/defender::defender-exclusion-command-reference
      - id: micro-behaviors/os/security/defender::defender-preference-option-prefix
      - id: micro-behaviors/os/security/defender::defender-exclusion-path-parameter
