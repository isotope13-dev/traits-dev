defaults:
  platforms: [windows]
  for: [pe]
composite_rules:
  - id: go-clipper-defender-path-exclusion
    desc: Go clipper with Defender path-exclusion command
    crit: hostile
    conf: 0.98
    attack: T1562.001
    all:
      - id: objectives/impact/crypto-manipulation/clipboard::go-syscall-crypto-clipboard-replacer
      - id: micro-behaviors/os/security/defender::native-add-mppreference-reference
      - id: micro-behaviors/os/security/defender::defender-exclusion-path-parameter
      - id: metadata/binary/symbols/name/qualified::go-native-exec-command-reference
