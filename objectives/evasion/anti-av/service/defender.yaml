defaults:
  platforms: [windows]
  for: [scripts, binaries, data]
  attack: T1562.001
  mbc: E1562

traits:
- id: defender-service-stop-target
  desc: Defender service stop command
  crit: suspicious
  conf: 0.97
  if:
    type: text
    regex: '(?i)\b(sc(\.exe)?|net(\.exe)?)\s+stop\s+(WinDefend|Sense|WdNisSvc)\b'
- id: defender-service-config-command
  desc: Defender service config command
  crit: notable
  conf: 0.95
  if:
    type: text
    regex: '(?i)\b(sc(\.exe)?|net(\.exe)?)\s+config\b'
- id: defender-service-disabled-target
  desc: Defender service startup disabled
  crit: suspicious
  conf: 0.97
  if:
    type: text
    regex: '(?i)\b(WinDefend|Sense|WdNisSvc)\b[\s\S]{0,100}\bstart\s*=\s*disabled\b'
- id: defender-service-stop-primary
  desc: Primary Defender service stop command
  crit: suspicious
  conf: 0.97
  if:
    type: text
    regex: '(?i)\b(sc(\.exe)?|net(\.exe)?)\s+stop\s+WinDefend\b'
- id: defender-service-stop-secondary
  desc: Defender auxiliary service stop command
  crit: suspicious
  conf: 0.97
  if:
    type: text
    regex: '(?i)\b(sc(\.exe)?|net(\.exe)?)\s+stop\s+(Sense|WdNisSvc)\b'

composite_rules:
- id: defender-multiple-services-stopped
  desc: Multiple Microsoft Defender services stopped
  crit: hostile
  conf: 0.99
  attack: T1562.001,T1489
  all:
  - id: defender-service-stop-primary
  - id: defender-service-stop-secondary
- id: defender-service-teardown
  desc: Defender services stopped and disabled
  crit: hostile
  conf: 0.99
  attack: T1562.001,T1489
  all:
  - id: defender-service-stop-target
  - id: defender-service-config-command
  - id: defender-service-disabled-target

