# A shell script that stops and disables services, clears immutable flags,
# kills processes and deletes the install directory of a cloud provider's host
# security agent is removing the monitoring that would see its next stage.
defaults:
  platforms: [unix]
  for: [shell, scripts]
  attack: T1562.001
composite_rules:
  - id: shell-removes-cloud-security-agent
    desc: Shell disables and deletes cloud security agent
    crit: hostile
    conf: 0.9
    all:
      - id: micro-behaviors/os/service/control::systemd-stop-disable
      - id: micro-behaviors/fs/attributes/chattr::chattr-recursive-immutable-1
      - id: micro-behaviors/fs/delete/directory::shell-recursive-delete
      - id: micro-behaviors/process/terminate/command::pkill
    any:
      - id: micro-behaviors/os/security/product::aliyun-aegis-agent-path
      - id: micro-behaviors/os/security/product::tencent-qcloud-agent-path
