defaults:
  for: [pe, dll]
  platforms: [windows]
  arch: [x86]
traits:
  - id: obfuscated-reloc-export-name-walk-x86
    desc: Obfuscated export-name walk in reloc section
    crit: suspicious
    conf: 0.96
    if:
      type: hex
      section: .reloc
      # Biased NT-header pointer accesses export directory at +0x78;
      # biased export pointer accesses AddressOfNames at +0x17.
      pattern: 'FF 71 33 5A 03 4C 1A 78 5A 8B 79 17 8D 73 ?? 80 ED 00 42 8B 04 1F 83 C7 04 8D 74 18 FD 3B 51 0F'
composite_rules:
  - id: obfuscated-reloc-api-hash-resolver
    desc: Hidden reloc payload resolves APIs by hash
    crit: hostile
    conf: 0.98
    attack: T1027.007
    all:
      - id: obfuscated-reloc-export-name-walk-x86
      - id: micro-behaviors/data/encode/arithmetic::reloc-multiply-subtract-byte-hash-x86
      - id: metadata/binary/section/entropy::high-entropy-reloc-section
      - id: metadata/binary/section/permission::writable-text-section
