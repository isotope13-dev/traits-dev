defaults:
  for: [c]
  platforms: [windows]
  attack: T1027.007
composite_rules:
  - id: escaped-x64-apihash-shellcode
    desc: Escaped x64 payload walks the PEB and hashes export names
    crit: hostile
    conf: 0.98
    near_bytes: 2048
    all:
      - id: micro-behaviors/data/embedded/payload/array::quoted-byte-escape-rows
      - id: micro-behaviors/os/api-resolution/digest-export/encoded::escaped-x64-peb-load
      - id: micro-behaviors/os/api-resolution/digest-export/encoded::escaped-x64-ror13-export-loop
      - id: micro-behaviors/os/api-resolution/digest-export/encoded::escaped-x64-export-name-table
  - id: embedded-x64-apihash-shellcode
    for: [pe]
    arch: [x86-64]
    desc: Embedded x64 payload walks modules and hashes export names
    crit: hostile
    conf: 0.98
    near_bytes: 512
    all:
      - id: micro-behaviors/os/api-resolution/digest-export/encoded::embedded-x64-peb-walk
      - id: micro-behaviors/os/api-resolution/digest-export/encoded::embedded-x64-export-hash-loop
