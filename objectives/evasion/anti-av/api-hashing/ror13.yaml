# ROR13 API hashing is commonly paired with a PEB module walk and an
# executable network stager. Match the source-level structure shown in the
# article; do not rely on a family name or a single downloaded address.
defaults:
  platforms: [windows]
  for: [c, cpp]
  attack: T1027.002
  mbc: F0004

traits:
  - id: x64-gs-peb-access-source
    desc: GS-based x64 PEB access
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: '(?i)(__readgsqword\s*\(\s*0x60\s*\)|GS\s*:\s*0x60)'

  - id: ror13-rotate-source
    desc: ROR13 rotate instruction in source
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: '(?i)ror\s+[a-z0-9]+\s*,\s*0x[dD]'

  - id: rwx-stager-allocation-source
    desc: Source allocates a PAGE_EXECUTE_READWRITE buffer
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: '(?i)VirtualAlloc[AW]?\s*\([^;\r\n]{0,160}PAGE_EXECUTE_READWRITE'

composite_rules:
  - id: ror13-api-hash-loop-source
    desc: ROR13 API hash loop in source
    crit: notable
    conf: 0.96
    near_bytes: 160
    all:
      - id: ror13-rotate-source
      - id: micro-behaviors/data/source/arithmetic::asm-add-two-operand-instruction

  - id: ror13-peb-wininet-rwx-stager
    desc: ROR13 PEB resolver feeds a WinINet RWX memory stager
    crit: hostile
    conf: 0.99
    attack: T1027.002,T1105,T1055
    all:
      - id: x64-gs-peb-access-source
      - id: ror13-api-hash-loop-source
      - id: micro-behaviors/os/api-resolution/manual::peb-ldr-data
      - id: micro-behaviors/os/api-resolution/manual::module-list-walk
      - id: rwx-stager-allocation-source
      - id: micro-behaviors/communications/http/get::wininet-read-file-src
