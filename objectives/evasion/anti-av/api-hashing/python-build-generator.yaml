# Build-time helper for a native payload that resolves its imports by hash:
# a Python script computes seeded multiply/XOR hashes of the loader exports
# and writes them as C #define constants, with fresh random parameters on
# every build so the constants never form a signature. Source-level match
# on the generator; the payload it feeds is not in the file.
defaults:
  platforms: [windows]
  for: [python]
  attack: T1027.007,T1027.002

traits:
  - id: python-xor-multiply-hash-step
    desc: Python multiply-XOR hash step
    crit: component
    conf: 0.8
    if:
      type: text
      regex: '\(\w{1,12} \^ \w{1,12}\) \* \w{1,12}'
  - id: python-loader-export-name-loadlibrary
    desc: LoadLibrary export name in Python
    crit: component
    conf: 0.7
    if:
      type: text
      regex: '\bLoadLibrary[AW]\b'
  - id: python-random-32bit-parameter
    desc: Random 32-bit value generation in Python
    crit: component
    conf: 0.7
    if:
      type: text
      regex: '(secrets|random)\.(randbits|getrandbits)\(32\)'
  - id: python-c-define-hash-emission
    desc: Emits C define lines for hash constants
    crit: component
    conf: 0.8
    if:
      type: text
      regex: '#define\s+\S{0,24}HASH\w{0,16}\s'

composite_rules:
  - id: python-loader-export-hash-computation
    desc: Python hashes loader export names with multiply-XOR
    crit: notable
    conf: 0.85
    all:
      - id: python-xor-multiply-hash-step
      # Shared GetProcAddress literal trait supplies the export-name leg.
      - id: micro-behaviors/dylib/lookup::get-proc-address
      - id: python-loader-export-name-loadlibrary
  - id: python-randomized-hash-define-emission
    desc: Python writes randomized hash constants as C defines
    crit: notable
    conf: 0.85
    all:
      - id: python-random-32bit-parameter
      - id: python-c-define-hash-emission
  - id: python-api-hash-parameter-generator
    desc: Python generator of per-build API hash constants for loader exports
    crit: hostile
    conf: 0.9
    all:
      - id: python-loader-export-hash-computation
      - id: python-randomized-hash-define-emission
