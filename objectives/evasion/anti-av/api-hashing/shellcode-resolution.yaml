defaults:
  crit: suspicious
  platforms: [windows]
  for: [pe]
traits:
  - id: api-hash-kernel32-192299a5
    desc: 'KERNEL32.DLL shellcode hash (0x192299a5)'
    if:
      type: hex
      section: '.text'
      pattern: 'a5 99 22 19'
  - id: virtualprotect-suffix-resolution
    desc: "Resolve VirtualProtect via 'ect\0' suffix"
    if:
      type: hex
      section: '.text'
      pattern: '81 ?? 65 63 74 00 83 ?? 00'
  - id: wide-string-uppercase-mask
    desc: 'Wide string case-insensitive hashing trick'
    if:
      type: hex
      section: '.text'
      pattern: '81 ?? df 00 df 00'
    downgrade:
      any:
        - id: metadata/lang/compiler/managed::mscorlib
        # AND 0x00DF00DF is the ordinary UTF-16 uppercase mask; in a
        # managed (ReadyToRun/CoreLib/MSBuild) image it is string-hash
        # code from the framework, not shellcode API hashing.
        - id: metadata/lang/compiler/managed::dotnet-assembly
