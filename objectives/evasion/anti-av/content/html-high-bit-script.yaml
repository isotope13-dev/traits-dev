# Signature scanners and analysts searching the raw bytes for "<script",
# "unescape(" or "document.write(" find nothing when each character is stored
# as ASCII | 0x80; a US-ASCII-decoding browser strips the bit and runs it.
defaults:
  platforms: [windows, unix]
  attack: T1027
composite_rules:
  - id: high-bit-encoded-script-body
    desc: Script and unescape hidden in bit-7-set body
    crit: hostile
    conf: 0.93
    for: [html]
    all:
      - id: metadata/document/html::high-bit-encoded-script-tag
      - id: metadata/document/html::high-bit-encoded-unescape-call
      - id: metadata/document/html::high-bit-byte-run
