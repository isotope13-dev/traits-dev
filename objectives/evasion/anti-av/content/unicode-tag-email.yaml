# Financial advertising alone is ordinary. Repeated non-rendering Tags-block
# characters inside ASCII words deliberately fracture content-filter keywords.
# No URL, credential capture, attachment, or payload execution is inferred.
defaults:
  platforms: [linux, macos, windows]
  for: [text, html]
  attack: T1027
  mbc: B0032

composite_rules:
  - id: unicode-tag-spliced-financial-email
    desc: Financial offer email evades token filters
    crit: hostile
    conf: 0.97
    near_bytes: 2048
    all:
      - id: objectives/evasion/anti-av/content::unicode-tag-spliced-ascii-token
      - id: micro-behaviors/communications/email/content::subject-header-line
      - id: micro-behaviors/communications/email/content::financial-preapproval-offer
