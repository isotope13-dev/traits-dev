# Droppers that fetch a password-protected archive often sleep so on-access
# AV can inspect the ciphertext (and fail), then check whether the file was
# quarantined before extracting. The delay-plus-quarantine language is the
# tell; archive extraction alone is not.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  attack: T1027.002,T1562.001
  mbc: B0001

traits:
  - id: js-av-scan-language
    desc: Explicit AV scan message
    crit: component
    conf: 0.9
    if:
      # Literal matching avoids comments and generated code identifiers that
      # merely document a quarantine field or action.
      type: literal
      regex: '(?i)\b(real[- ]time|on[- ]access|anti[- ]virus|antivirus|AV)\s+scan\b'

  - id: js-av-outcome-language
    desc: AV reports caught or missed payload
    crit: component
    conf: 0.9
    if:
      type: literal
      regex: '(?i)\bAV\s+(caught|did not)\b'

  - id: js-payload-quarantine-language
    desc: File or archive quarantine outcome
    crit: component
    conf: 0.9
    if:
      type: literal
      regex: '(?i)\b(file|archive|payload)\s+(was|is|got)\s+quarantin(e|ed)\b'

  - id: js-quarantine-target-language
    desc: Quarantine names a payload target
    crit: component
    conf: 0.9
    if:
      type: literal
      regex: '(?i)\bquarantin(e|ed)\s+(the\s+)?(file|archive|payload)\b'

composite_rules:
  - id: js-av-quarantine-dwell-language
    desc: Explicit AV scan or payload quarantine message
    crit: suspicious
    conf: 0.93
    any:
      - id: js-av-scan-language
      - id: js-av-outcome-language
      - id: js-payload-quarantine-language
      - id: js-quarantine-target-language

  - id: passworded-archive-av-scan-dwell
    desc: Sleeps for AV on passworded archive
    crit: hostile
    conf: 0.97
    all:
      - id: objectives/command-and-control/dropper/node-bootstrap::sevenzip-password-stdout-extract
      - id: js-av-quarantine-dwell-language
      - id: micro-behaviors/time/sleep/interval::js-sleep-ms-delay
