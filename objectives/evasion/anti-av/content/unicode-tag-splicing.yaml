# Unicode Tags-block characters are normally non-rendering. Placing one
# between two ASCII token characters preserves what a person sees while
# breaking the byte sequence consumed by keyword, signature, and tokenizer
# based content filters. The matcher covers the entire U+E0000-U+E007F block,
# not only U+E0020 observed in the motivating phishing campaign, and cannot
# match subdivision-flag emoji because those tag sequences follow U+1F3F4
# rather than appearing between visible ASCII token characters.
defaults:
  conf: 0.99
  platforms: [linux, macos, windows]
  for: [html, javascript, text]
  attack: T1027
  mbc: B0032

traits:
composite_rules:
  # U+E0020 was the specific separator used in the observed campaign. Pairing
  # that rare artifact with token-interleaving proves it is being used as a
  # content-breaker rather than merely mentioned in a Unicode table.
  - id: unicode-tag-space-token-evasion
    for: [javascript, html]
    desc: TAG SPACE fractures visible token
    crit: hostile
    all:
      - id: metadata/lang/encoding/shape/character::unicode-tag-spliced-ascii-token
      - id: metadata/lang/encoding/shape/character::unicode-tag-space-character
      - id: metadata/document/html/structure::html-root-at-start
