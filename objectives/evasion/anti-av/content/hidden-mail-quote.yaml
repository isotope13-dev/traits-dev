# Concealed quoted correspondence alongside a branded offsite restore action
# supports mail-filter evasion; collapsed correspondence alone does not.
defaults:
  platforms: [windows, unix]
  for: [html]
composite_rules:
  - id: offsite-restore-lure-hidden-quote
    desc: Offsite mail lure conceals quoted content
    crit: suspicious
    conf: 0.9
    near_bytes: 2048
    all:
      - id: objectives/evasion/masquerade/brand/product::microsoft-offsite-mail-restore
    any:
      - id: micro-behaviors/data/format/html::display-none-quoted-block
      - id: micro-behaviors/data/format/html::hidden-attribute-quoted-block
