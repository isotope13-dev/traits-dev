defaults:
  conf: 0.95
  platforms:
  - linux
  - macos
  - windows
  for:
  - html
  - javascript
  - text
  - markdown
  - python
  attack: T1027
  mbc: B0032
traits:
- id: unicode-zero-width-bidi-spliced-token
  desc: Zero-width or bidi control splits token
  crit: suspicious
  for:
  - html
  - text
  - markdown
  if:
    type: text
    regex: (?-u:[^\\][0-9A-Za-z]{3}\xE2\x80[\x8B-\x8F\xAA-\xAE][0-9A-Za-z]{3})
  unless:
  - id: metadata/filename/name-form::fuzz-corpus-path
  - id: metadata/file/profile/test-indications/
  - id: parser-or-sanitizer-doc-example
  - id: metadata/package/documentation
  - id: micro-behaviors/data/string/unicode::bidi-mark-in-regex-character-class
  - id: metadata/lang/locale::message-catalog
  - id: known-unicode-data-file-context
  - id: well-known/tool/detection/openaudit/
  downgrade:
    scope: archive
    any:
    - id: well-known/lib/web/site-platforms/vona::vona-suite-package-name
- id: unicode-zero-width-bidi-initial-spliced-token
  desc: Zero-width or bidi control splits initial letter
  crit: suspicious
  for:
  - html
  - text
  - markdown
  if:
    type: text
    regex: (?-u:[\s>][A-Z]\xE2\x80[\x8B-\x8F\xAA-\xAE][a-z]{4,})
  unless:
  - id: metadata/filename/name-form::fuzz-corpus-path
  - id: metadata/file/profile/test-indications/
  - id: parser-or-sanitizer-doc-example
  - id: metadata/package/documentation
  - id: micro-behaviors/data/string/unicode::bidi-mark-in-regex-character-class
  - id: metadata/lang/locale::message-catalog
  - id: known-unicode-data-file-context
  - id: well-known/tool/detection/openaudit/
  downgrade:
    scope: archive
    any:
    - id: well-known/lib/web/site-platforms/vona::vona-suite-package-name
- id: unicode-source-string-spliced-token
  desc: Unicode control splits a source string token
  crit: suspicious
  for:
  - javascript
  - python
  if:
    type: literal
    regex: '[A-Za-z0-9]{3}[\x{200B}-\x{200F}\x{202A}-\x{202E}][A-Za-z0-9]{3}'
  unless:
  - id: metadata/filename/name-form::fuzz-corpus-path
  - id: metadata/file/profile/test-indications/
  - id: parser-or-sanitizer-doc-example
  - id: metadata/package/documentation
  - id: micro-behaviors/data/string/unicode::bidi-mark-in-regex-character-class
  - id: metadata/lang/locale::message-catalog
  - id: known-unicode-data-file-context
  - id: well-known/tool/detection/openaudit/
  downgrade:
    scope: archive
    any:
    - id: well-known/lib/web/site-platforms/vona::vona-suite-package-name
- id: unicode-invisible-format-char-spliced-token
  desc: Invisible format character splits visible token
  crit: suspicious
  if:
    type: text
    regex: (?-u:[^\\]\w{3}\xE2\x81[\xA0-\xAF]\w{3})
  unless:
  - id: metadata/file/format/wordlist::commented-injection-vector-list
  - id: metadata/file/format/wordlist::one-token-per-line-list
  - id: metadata/package/testing/
  - id: parser-or-sanitizer-doc-example
  - id: well-known/app/browser-extension/adguard::adguard-filters-source
  - id: metadata/package/documentation/source::documentation-dir-path
  - id: metadata/path::test-directory-component
- id: unicode-bom-spliced-token
  desc: Repeated BOM characters split visible tokens
  crit: suspicious
  count_min: 2
  if:
    type: text
    regex: (?-u:[^\\]\w\xEF\xBB\xBF\w)
  unless:
  - id: metadata/file/format/wordlist::commented-injection-vector-list
  - id: metadata/file/format/wordlist::one-token-per-line-list
  - id: metadata/package/testing/
  - id: parser-or-sanitizer-doc-example
  - id: well-known/app/browser-extension/adguard::adguard-filters-source
  - id: metadata/package/documentation/source::documentation-dir-path
  - id: metadata/path::test-directory-component
- id: unicode-bmp-variation-selector-spliced-token
  desc: BMP variation selector splits visible token
  crit: suspicious
  if:
    type: text
    regex: (?-u:[^\\]\w{3}\xEF\xB8[\x80-\x8F]\w{3}|[\s>][A-Z]\xEF\xB8[\x80-\x8F][a-z]{4,})
  unless:
  - id: metadata/package/testing/
  - id: well-known/tool/detection/clamav/
  - id: parser-or-sanitizer-doc-example
  - id: well-known/app/browser-extension/adguard::adguard-filters-source
  - id: metadata/package/documentation/source::documentation-dir-path
  - id: metadata/path::test-directory-component
  - id: known-unicode-data-file-context
composite_rules:
- id: known-unicode-data-file-context
  desc: Known data file with literal Unicode controls
  crit: exception
  conf: 0.9
  any:
  - id: well-known/game/mod::hmcl-mod-database
  - id: metadata/file/format/wordlist::g2p-pronunciation-dictionary
  - id: metadata/file/format/wordlist::geonames-place-dump-citation
  - id: metadata/file/format/wordlist::unicode-consortium-data-citation
- id: parser-or-sanitizer-doc-example
  desc: Scanner, extension, or parser doc example
  crit: notable
  conf: 0.9
  any:
  - id: metadata/file/comment::parser-normalization-comment-example
  - id: metadata/file/comment::sanitizer-fence-forgery-doc
  - id: sanitizer-filters-invisible-filename-char
  - id: well-known/tool/detection/llm-scanner/
  - id: well-known/app/browser-extension/
  - id: metadata/file/extension/identity::bittorrent-metainfo-filename
- id: sanitizer-filters-invisible-filename-char
  desc: Source defines filename and invisible-char checks
  crit: notable
  conf: 0.95
  for:
  - python
  all:
  - id: micro-behaviors/fs/path/construct::filename-sanitizer-function
  - id: micro-behaviors/data/string/unicode::zero-width-space-literal
  - id: micro-behaviors/data/string/unicode::invisible-character-set-exclusion
- id: unicode-multi-mechanism-token-splicing
  desc: Multiple invisible mechanisms fracture tokens
  crit: hostile
  needs: 2
  any:
  - id: objectives/evasion/anti-av/content::unicode-tag-spliced-ascii-token
  - id: unicode-zero-width-bidi-spliced-token
  - id: unicode-zero-width-bidi-initial-spliced-token
  - id: unicode-source-string-spliced-token
  - id: unicode-invisible-format-char-spliced-token
  - id: unicode-bom-spliced-token
  - id: unicode-bmp-variation-selector-spliced-token
  unless:
  - id: metadata/file/extension/identity::bittorrent-metainfo-filename
  - id: metadata/package/testing/corpus::fixed-unicode-scenario-generator
