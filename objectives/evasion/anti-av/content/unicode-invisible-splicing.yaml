# Invisible Unicode characters interleaved inside visible ASCII tokens
# fracture keyword, signature, and tokenizer based content filters while
# preserving what a person sees -- the same ASCII-smuggling class as the
# Tags-block splicing in unicode-tag-splicing.yaml, but with the code
# points other campaigns reuse: the U+200B-U+200F zero-width and direction
# marks plus the U+202A-U+202E bidi controls (the invisible-Unicode email
# Subject and SenderDisplayName hunting ranges; also the Trojan Source
# class), the U+2060-U+206F invisible format characters, and the BMP
# variation selectors. The supplementary variation-selector
# range (U+E0100-U+E01EF) is deliberately left out: interleaved singles
# there are byte-shape duplicates of the Tags-block pattern owned by
# unicode-tag-splicing.yaml, while bulk runs are already covered by
# metadata/file/invisible-unicode::supplementary-variation-selector-run.
# Each matcher requires the invisible code
# point strictly between two ASCII token characters, so emoji ZWJ sequences,
# a leading BOM, CJK/emoji variation sequences, and subdivision-flag tag
# runs (which follow U+1F3F4, never ASCII) cannot match. A bidi control
# strictly inside an ASCII word has no legitimate function: real RTL prose
# puts direction marks at run boundaries, around the Latin word, not
# between two of its letters. U+00AD SOFT HYPHEN
# is deliberately excluded: discretionary hyphenation inserts it inside
# words on purpose, so it is not evidence of filter evasion.
#
# Byte-mode patterns avoid inner groups (a validator quality rule) by
# spelling each alternative out as a full token-split pattern.
defaults:
  conf: 0.95
  platforms: [linux, macos, windows]
  # text covers saved email exports and message bodies; markdown covers
  # agent-readable documents; python covers kit generators that embed the
  # spliced strings in their mail templates.
  for: [html, javascript, text, markdown, python]
  attack: T1027
  mbc: B0032

traits:
  - id: parser-normalization-comment-example
    desc: Comment quotes parser-normalized text
    crit: notable
    conf: 0.88
    for: [javascript, typescript]
    if:
      type: text
      substr: reached the parser as
  - id: sanitizer-fence-forgery-doc
    desc: Text describes a forged fence or marker
    crit: notable
    conf: 0.9
    for: [javascript, typescript]
    if:
      type: text
      # Sanitizer hardening notes quote the attack they defeat: a bidi
      # override splitting a closing marker so the strip pass would
      # reconstitute it. The quoted forgery is the documented threat, not
      # a spliced token the file ships.
      regex: '(?i)forg(eable|ed)\s+(fence|marker|closing marker)'

  - id: unicode-zero-width-bidi-spliced-token
    desc: Zero-width or bidi control splits token
    crit: suspicious
    if:
      type: text
      regex: (?-u:[^\\][0-9A-Za-z]\xE2\x80[\x8B-\x8F\xAA-\xAE][0-9A-Za-z])
    unless:
    - id: metadata/file/naming::fuzz-corpus-path
    - id: metadata/file/profile/test-indications/
    - id: well-known/tool/detection/llm-scanner/
    - id: parser-or-sanitizer-doc-example
    - id: well-known/app/browser-extension/adguard::adguard-filters-source
    - id: well-known/app/browser-extension/notandia::citewatch-predatory-publishing-dataset
    - id: metadata/package/documentation/
    - id: micro-behaviors/data/string/unicode::bidi-mark-in-regex-character-class
    - id: metadata/file/format/structured::bittorrent-metainfo-filename
  - id: unicode-invisible-format-char-spliced-token
    desc: Invisible format character splits visible token
    crit: suspicious
    if:
      type: text
      # UTF-8 for U+2060-U+206F (E2 81 A0-AF): word joiner, invisible
      # operators, directional isolates, and deprecated format chars --
      # plus U+FEFF BOM (EF BB BF) between ASCII token characters.
      regex: '(?-u:[^\\]\w\xE2\x81[\xA0-\xAF]\w|[^\\]\w\xEF\xBB\xBF\w)'
    unless:
      - id: metadata/file/format/wordlist::commented-injection-vector-list
      - id: metadata/file/format/wordlist::one-token-per-line-list
      - id: metadata/package/testing/
      - id: well-known/tool/detection/llm-scanner/
      - id: parser-or-sanitizer-doc-example
      - id: well-known/app/browser-extension/adguard::adguard-filters-source
      - id: metadata/package/documentation/source::documentation-dir-path
      - id: metadata/file/format/structured::bittorrent-metainfo-filename
      - id: "metadata/file/naming::test-directory-component"
  - id: unicode-bmp-variation-selector-spliced-token
    desc: BMP variation selector splits visible token
    crit: suspicious
    if:
      type: text
      # UTF-8 for U+FE00-U+FE0F (EF B8 80-8F) between ASCII tokens.
      regex: '(?-u:[^\\]\w\xEF\xB8[\x80-\x8F]\w)'
    unless:
      - id: metadata/package/testing/
      - id: well-known/tool/detection/llm-scanner/
      - id: parser-or-sanitizer-doc-example
      - id: well-known/app/browser-extension/adguard::adguard-filters-source
      - id: metadata/package/documentation/source::documentation-dir-path
      - id: metadata/file/format/structured::bittorrent-metainfo-filename


      - id: "metadata/file/naming::test-directory-component"
composite_rules:
  - id: parser-or-sanitizer-doc-example
    desc: Documented parser normalization or sanitizer fence forgery example
    crit: notable
    conf: 0.9
    for: [javascript, typescript]
    any:
      - id: parser-normalization-comment-example
      - id: sanitizer-fence-forgery-doc

  # Two distinct invisible-splitting mechanisms fracturing tokens in one
  # file means the author reached for the technique twice, not a one-off
  # encoding accident -- the campaign shape (Tags block in the lure body,
  # zero-widths alongside it, bidi controls in the sender name). Each leg
  # alone is already suspicious; the combination has no legitimate use.
  - id: unicode-multi-mechanism-token-splicing
    desc: Multiple invisible mechanisms fracture tokens
    crit: hostile
    needs: 2
    any:
      - id: objectives/evasion/anti-av/content::unicode-tag-spliced-ascii-token
      - id: unicode-zero-width-bidi-spliced-token
      - id: unicode-invisible-format-char-spliced-token
      - id: unicode-bmp-variation-selector-spliced-token
    unless:
      - id: metadata/file/format/structured::bittorrent-metainfo-filename
