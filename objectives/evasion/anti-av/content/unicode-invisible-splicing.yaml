defaults:
  conf: 0.95
  platforms:
  - linux
  - macos
  - windows
  for:
  - html
  - javascript
  - text
  - markdown
  - python
  attack: T1027
  mbc: B0032
traits:
- id: unicode-zero-width-bidi-spliced-token
  desc: Zero-width or bidi control splits token
  crit: suspicious
  for:
  - html
  - text
  - markdown
  if:
    type: text
    regex: (?-u:[^\\][0-9A-Za-z]{3}\xE2\x80[\x8B-\x8F\xAA-\xAE][0-9A-Za-z]{3})
  unless:
  - id: metadata/file/line::hex-prefix-label-records
  - id: objectives/evasion/security-bypass/llm/override::prompt-injection-testing-methodology-examples
  downgrade:
    scope: archive
    any:
    - id: well-known/lib/web/site-platforms/vona::vona-suite-package-name
- id: unicode-zero-width-bidi-initial-spliced-token
  desc: Zero-width or bidi control splits initial letter
  crit: suspicious
  for:
  - html
  - text
  - markdown
  if:
    type: text
    regex: (?-u:[\s>][A-Z]\xE2\x80[\x8B-\x8F\xAA-\xAE][a-z]{4,})
  downgrade:
    scope: archive
    any:
    - id: well-known/lib/web/site-platforms/vona::vona-suite-package-name
- id: unicode-invisible-format-char-spliced-token
  desc: Invisible format character splits visible token
  crit: suspicious
  if:
    type: text
    regex: (?-u:[^\\]\w{3}\xE2\x81[\xA0-\xAF]\w{3})

- id: unicode-bom-spliced-token
  desc: Repeated BOM characters split visible tokens
  crit: suspicious
  count_min: 2
  if:
    type: text
    regex: (?-u:[^\\]\w\xEF\xBB\xBF\w)
  unless:
  - id: metadata/file/format/markup::adblock-filter-list

- id: unicode-bmp-variation-selector-spliced-token
  desc: BMP variation selector splits visible token
  crit: suspicious
  if:
    type: text
    regex: (?-u:[^\\]\w{3}\xEF\xB8[\x80-\x8F]\w{3}|[\s>][A-Z]\xEF\xB8[\x80-\x8F][a-z]{4,})

composite_rules:

- id: unicode-split-paypal-brand
  desc: Invisible character splits PayPal brand name
  crit: suspicious
  for: [text, html, markdown]
  all:
  - id: well-known/app/finance/paypal::unicode-split-brand
  - id: micro-behaviors/data/string/unicode::zero-width-space-text

- id: parser-or-sanitizer-doc-example
  desc: Scanner, extension, or parser doc example
  crit: notable
  conf: 0.9
  any:
  - id: metadata/file/comment::parser-normalization-comment-example
  - id: metadata/file/comment::sanitizer-fence-forgery-doc
  - id: sanitizer-filters-invisible-filename-char
  - id: well-known/tool/detection/llm-scanner/
  - id: well-known/app/browser-extension/
  - id: metadata/file/extension/asset::bittorrent-metainfo-filename
- id: sanitizer-filters-invisible-filename-char
  desc: Source defines filename and invisible-char checks
  crit: notable
  conf: 0.95
  for:
  - python
  all:
  - id: micro-behaviors/fs/path/construct::filename-sanitizer-function
  - id: micro-behaviors/data/string/unicode::zero-width-space-literal
  - id: micro-behaviors/data/string/unicode::invisible-character-set-exclusion
- id: unicode-multi-mechanism-token-splicing
  desc: Multiple invisible mechanisms fracture tokens
  crit: suspicious
  needs: 2
  any:
  - id: objectives/evasion/anti-av/content::unicode-tag-spliced-ascii-token
  - id: unicode-zero-width-bidi-spliced-token
  - id: unicode-zero-width-bidi-initial-spliced-token
  - id: unicode-invisible-format-char-spliced-token
  - id: unicode-bom-spliced-token
  - id: unicode-bmp-variation-selector-spliced-token
  unless:
  - id: metadata/file/extension/asset::bittorrent-metainfo-filename
  - id: metadata/package/testing/corpus/generation::fixed-unicode-scenario-generator
