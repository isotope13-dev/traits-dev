# Disable or remove Raccine (Neo23x0 anti-ransomware). Thanos-builder
# ransomware (Spook and siblings) tears it down before deleting shadow
# copies so the tool cannot kill the encryptor mid-wipe.
defaults:
  platforms: [windows]
  for: [batch, powershell, pe, python, javascript, csharp]
  attack: T1562.001
  mbc: E1562

traits:
  - id: taskkill-raccine-settings
    desc: Force-kills RaccineSettings.exe
    crit: suspicious
    conf: 0.97
    if:
      type: text
      regex: '(?i)\btaskkill(\.exe)?\b[^\r\n]{0,80}\bRaccineSettings\.exe\b'

  - id: reg-delete-raccine-tray
    desc: Deletes Raccine Tray Run-key value
    crit: suspicious
    conf: 0.97
    if:
      type: text
      regex: '(?i)\breg(\.exe)?\s+delete\b[^\r\n]{0,120}\bRaccine Tray\b'

  - id: reg-delete-raccine-software-key
    desc: Deletes HKCU Software Raccine key
    crit: suspicious
    conf: 0.96
    if:
      type: text
      regex: '(?i)\breg(\.exe)?\s+delete\b[^\r\n]{0,80}\\Software\\Raccine\b'

  - id: schtasks-delete-raccine-updater
    desc: Deletes Raccine Rules Updater scheduled task
    crit: suspicious
    conf: 0.97
    if:
      type: text
      regex: '(?i)\bschtasks(\.exe)?\b[^\r\n]{0,80}/DELETE\b[^\r\n]{0,80}\bRaccine Rules Updater\b'

composite_rules:
  - id: raccine-defense-impairment
    desc: Tears down Raccine anti-ransomware protections
    crit: hostile
    conf: 0.99
    needs: 2
    any:
      - id: taskkill-raccine-settings
      - id: reg-delete-raccine-tray
      - id: reg-delete-raccine-software-key
      - id: schtasks-delete-raccine-updater
