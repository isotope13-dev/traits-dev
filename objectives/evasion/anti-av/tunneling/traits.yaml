defaults:
  platforms:
    - windows
    - unix
  for: [source]
traits:
  - id: virus-library-comment
    desc: Virus library usage comment
    crit: suspicious
    conf: 0.90
    if:
      type: text
      regex: (?i)include it in a virus
  - id: anti-tunneling-term
    desc: Anti-anti-tunneling terminology
    crit: component
    if:
      type: text
      regex: '(?i)\banti-anti-tunnel(ing)?\b'

composite_rules:
  - id: anti-anti-tunneling
    desc: Comment links anti-anti-tunneling to antivirus evasion
    crit: suspicious
    conf: 0.92
    all:
      - id: anti-tunneling-term
      - id: metadata/lang/natural/vocabulary/content-word::antivirus-related-wording
    near_lines: 12

  - id: int21h-tunneler-source
    for: [c]
    desc: DOS INT 21h tunneler source code
    crit: hostile
    conf: 0.97
    all:
      - id: micro-behaviors/os/msdos/interrupt::list-of-lists
      - id: micro-behaviors/os/msdos/interrupt::tunneler-keyword
    any:
      - id: micro-behaviors/os/msdos/interrupt::trap-flag-hide
      - id: micro-behaviors/os/msdos/interrupt::tunneled-int21-result
      - id: micro-behaviors/os/msdos/interrupt::mcb-boundary-var
  - id: opcode-disasm-engine
    for: [c]
    desc: x86 opcode disassembly engine source
    crit: suspicious
    conf: 0.92
    all:
      - id: micro-behaviors/os/msdos/interrupt::x86-opcode-table
    any:
      - id: micro-behaviors/os/msdos/interrupt::tunneler-keyword
      - id: micro-behaviors/os/msdos/interrupt::trap-flag-hide
  # DOS virus macro kits wrap INT 86h/21h in MASM macros whose bodies emit
  # the call as raw db bytes, so scanners keyed on the CD 86 / CD 21 opcode
  # see no interrupt instruction at all.
  - id: int-opcode-less-macro-calls
    for: [text]
    desc: DOS calls without INT opcode in macros
    crit: hostile
    conf: 0.95
    attack: T1027
    all:
      - id: micro-behaviors/os/msdos/interrupt::int-macro-wrapper
      - id: micro-behaviors/os/msdos/interrupt::raw-opcode-db-emission
