# DOS viruses that switch off ThunderByte Anti-Virus resident modules.
# They take the DOS List of Lists (INT 21h AH=52h), follow the device
# driver chain from the NUL header, and compare each driver name against
# TbDriver's resident monitors (TBMEMXXX, TBCHKXXX, TBDSKXXX, TBFILXXX)
# so they can patch the matching driver out before infecting.
defaults:
  platforms: [windows, unix]
  for: [dos_com, static-lib, data]
  attack: T1562.001
  mbc: E1562

traits:
  - id: tbav-driver-name-table
    desc: Table of TbDriver resident device names
    crit: notable
    conf: 0.9
    if:
      type: hex
      pattern: "54 42 (4D 45 4D|43 48 4B|44 53 4B|46 49 4C) 58 58 58 54 42 (4D 45 4D|43 48 4B|44 53 4B|46 49 4C) 58 58 58"

  - id: dos-list-of-lists
    desc: DOS reads the List of Lists
    crit: notable
    conf: 0.85
    if:
      type: hex
      pattern: "B4 52 [0-4] CD 21"

composite_rules:
  - id: dos-tbav-driver-tamper
    desc: DOS walks drivers to disable TBAV
    crit: hostile
    conf: 0.95
    all:
      - id: tbav-driver-name-table
      - id: dos-list-of-lists
