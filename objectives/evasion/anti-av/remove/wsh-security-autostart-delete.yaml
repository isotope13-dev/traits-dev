# A script that deletes Run-key autostart values while naming more than one
# security product: the autostarts being removed are typically those of the
# antivirus or firewall, so protection does not come back after reboot.
# AV migration scripts can do the same, so this stays suspicious alone.
defaults:
  platforms: [windows]
  for: [vbs]
  attack: T1562.001

composite_rules:
  - id: wsh-security-product-autostart-removal
    desc: Deletes autostarts beside security product names
    crit: suspicious
    conf: 0.85
    all:
      - id: micro-behaviors/os/registry/delete::wsh-regdelete-run-value
      - id: micro-behaviors/os/security/product::edr-product-name
