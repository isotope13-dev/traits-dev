defaults:
  platforms: [windows, unix]
  for: [data, dos_com]
  size_min: 10000
  size_max: 65536
  attack: T1562.001,T1027

traits:
  - id: dos-additive-xor-byte-decoder
    desc: DOS decoder uses changing XOR key
    crit: suspicious
    conf: 0.98
    if:
      type: hex
      pattern: 'B4 AF BE 54 31 B9 37 00 2E 30 24 46 80 C4 6A E2 F7'
  - id: dos-encoded-checklist-ms-name
    desc: Encoded DOS antivirus checklist name
    crit: notable
    conf: 0.98
    if:
      type: hex
      pattern: 'AB 03 E5 5D 3D 84 6E B3 4D 30'
  - id: dos-encoded-antivir-dat-name
    desc: Encoded DOS antivirus data filename
    crit: notable
    conf: 0.98
    if:
      type: hex
      pattern: '8C 7E C7 BF 74 EA 56 D0 CB 0C EA 5A'
  - id: dos-encoded-clear-attributes-delete
    desc: Encoded DOS attribute-clear and delete calls
    crit: notable
    conf: 0.98
    if:
      type: hex
      pattern: '60 3A DD CC 45 73 6B 40 D1'

composite_rules:
  - id: dos-encoded-antivirus-data-deletion
    desc: Obfuscated DOS code deletes antivirus data files
    crit: hostile
    conf: 0.99
    near_bytes: 4096
    all:
      - id: dos-additive-xor-byte-decoder
      - id: dos-encoded-checklist-ms-name
      - id: dos-encoded-antivir-dat-name
      - id: dos-encoded-clear-attributes-delete
