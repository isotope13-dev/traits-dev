defaults:
  platforms: [windows]
  for: [pe, dll]
  attack: T1027.007,T1106
composite_rules:
  - id: dotnet-manual-pe-export-dinvoke
    desc: Unsigned .NET manually resolves PE exports via delegates
    crit: suspicious
    conf: 0.96
    all:
      - id: metadata/lang/compiler/managed::dotnet-assembly
      - id: metadata/signature/absent::unsigned-missing-signature-record
      - id: micro-behaviors/process/info/query::dotnet-process-module-name
      - id: micro-behaviors/os/api-resolution/dynamic::managed-module-base-address
      - id: micro-behaviors/mem/read/arbitrary::dotnet-ansi-pointer-string-read
      - id: micro-behaviors/data/buffer/integer-codec::managed-read-int32-reference
      - id: micro-behaviors/os/api-resolution/dynamic::managed-function-pointer-delegate
      - id: micro-behaviors/metaprogramming/reflection/inspect/class/construction::dotnet-delegate-dynamic-invoke-call
    unless:
      - id: well-known/lib/development/basic-reference-assemblies::framework-bundle
      - id: metadata/signature/verified/platform::microsoft
