defaults:
  platforms: [windows]
  for: [c, cpp, csharp, go, rust, python]
  attack: T1106,T1562.001

traits:
  - id: syscall-table-struct-source
    desc: SysWhispers syscall table struct
    crit: notable
    conf: 0.92
    for: [c, cpp, csharp, go, rust]
    if:
      type: text
      substr: SW2_SYSCALL_ENTRY

  - id: syscall-table-address-source
    desc: Syscall table address lookup
    crit: notable
    conf: 0.92
    for: [c, cpp, csharp, go, rust]
    if:
      type: text
      regex: '(?i)\bEntries\s*\[.{0,24}\]\s*\.\s*Address\b'

  - id: native-memory-syscall-source
    desc: Native memory syscall APIs
    crit: suspicious
    conf: 0.94
    count_min: 2
    if:
      type: text
      regex: '(?i)\bNt(AllocateVirtualMemory|ProtectVirtualMemory|WriteVirtualMemory)\b'

  - id: native-thread-syscall-source
    desc: Native thread syscall APIs
    crit: suspicious
    conf: 0.94
    if:
      type: text
      regex: '(?i)\bNt(GetContextThread|SetContextThread|ResumeThread)\b'

composite_rules:
  - id: syscall-dispatch-table-source
    desc: Hashed syscall dispatch table
    crit: suspicious
    conf: 0.96
    for: [c, cpp, csharp, go, rust]
    all:
      - id: syscall-table-struct-source
      - id: syscall-table-address-source
    near_lines: 200

  - id: native-memory-syscall-api-cluster-source
    desc: Native memory and thread syscall APIs
    crit: suspicious
    conf: 0.94
    for: [c, cpp, csharp, go, rust]
    all:
      - id: native-memory-syscall-source
      - id: native-thread-syscall-source
    near_lines: 80

  - id: source-direct-syscall-memory-loader
    desc: Syscall table and native APIs stage a payload
    crit: hostile
    conf: 0.98
    attack: T1106,T1055,T1562.001
    for: [c, cpp, csharp, go, rust]
    all:
      - id: objectives/evasion/anti-av/syscall::syscall-dispatch-table-source
      - id: objectives/evasion/anti-av/syscall::native-memory-syscall-api-cluster-source
      - id: micro-behaviors/os/syscall/invoke::go-syscall-wrapper-call
