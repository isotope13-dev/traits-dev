defaults:
  platforms: [windows]
  for: [c, cpp, csharp, go, rust, python]
  attack: T1106,T1562.001

traits:
  - id: syscall-table-struct-source
    desc: SysWhispers syscall table struct
    crit: notable
    conf: 0.92
    for: [c, cpp, csharp, go, rust]
    if:
      type: text
      substr: SW2_SYSCALL_ENTRY

  - id: syscall-table-address-source
    desc: SysWhispers syscall list address lookup
    crit: notable
    conf: 0.92
    for: [c, cpp, csharp, go, rust]
    if:
      type: text
      regex: '(?i)\bSW[23]_SyscallList\s*\.\s*Entries\s*\[.{0,24}\]\s*\.\s*Address\b'

# NOTE: the two ntdll-name atoms that used to live here searched only for
# `NtAllocateVirtualMemory`-style stub names. Naming a native API is a
# capability observation, not an EDR-bypass objective -- every Windows
# internals project, ReactOS/Wine tree, debugger, and RE tool with a syscall
# table hits it -- so they now live at
# micro-behaviors/os/syscall/invoke::nt-native-{memory,thread}-api-source and
# the cluster composite below supplies the intent by requiring both families
# within 80 lines of each other.

composite_rules:
  - id: syscall-dispatch-table-source
    desc: Hashed syscall dispatch table
    crit: suspicious
    conf: 0.96
    for: [c, cpp, csharp, go, rust]
    all:
      - id: syscall-table-struct-source
      - id: syscall-table-address-source
    near_lines: 200

  - id: native-memory-syscall-api-cluster-source
    desc: Native memory and thread syscall APIs
    crit: suspicious
    conf: 0.94
    for: [c, cpp, csharp, go, rust]
    all:
      - id: micro-behaviors/os/syscall/invoke::nt-native-memory-api-source
      - id: micro-behaviors/os/syscall/invoke::nt-native-thread-api-source
    near_lines: 80
    unless:
      - id: well-known/lib/platform/wine/
      - id: well-known/tool/reverse-engineering/radare2::radare2-source-identity
      - id: metadata/library/cobalt-strike::cobalt-strike-beacon-sdk-header

  - id: source-direct-syscall-memory-loader
    desc: Syscall table and native APIs stage a payload
    crit: hostile
    conf: 0.98
    attack: T1106,T1055,T1562.001
    for: [c, cpp, csharp, go, rust]
    all:
      - id: objectives/evasion/anti-av/syscall::syscall-dispatch-table-source
      - id: objectives/evasion/anti-av/syscall::native-memory-syscall-api-cluster-source
      - id: micro-behaviors/os/syscall/invoke::go-syscall-wrapper-call
