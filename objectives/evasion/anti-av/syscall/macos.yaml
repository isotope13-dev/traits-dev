# Anomalous System Calls
# Detect direct syscall instructions in executable Mach-O code. Bytes in
# __gcc_except_tab and __data are exception metadata and initialized data, not
# instructions; matching those sections produced false positives in normal C++
# and Node native addons.
defaults:
  platforms: [macos]
  for: [macho]
  crit: suspicious
  mbc: "B0032"

composite_rules:
  - id: concealed-shell-direct-syscall
    desc: Concealed shell with direct syscall
    crit: suspicious
    conf: 0.9
    size_max: 10485760
    all:
      - id: objectives/anti-static/obfuscation/payload/shell::concealed-shell-execution-macho
    any:
      - id: micro-behaviors/os/syscall/invoke::darwin-arm64-direct-syscall
      - id: micro-behaviors/os/syscall/invoke::macos-x86-64-direct-syscall
      - id: objectives/evasion/anti-av/syscall::syscall-evasion-macos-arm64
    downgrade:
      any:
        - id: metadata/signed/platform::apple
        - id: metadata/signed/developer
