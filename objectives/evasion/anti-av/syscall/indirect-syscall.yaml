defaults:
  platforms: [windows]
  for: [pe, dll]
  attack: T1562.001
  mbc: F0004
composite_rules:
- id: indirect-syscall-gate
  desc: Indirect syscall via stub validation
  crit: suspicious
  conf: 0.92
  all:
  - id: micro-behaviors/os/syscall/raw::ssn-stub-validation
  any:
  - id: micro-behaviors/os/syscall/raw::syscall-ret-gadget
  - id: objectives/evasion/anti-av/syscall::syscall-x64-instruction
  - id: micro-behaviors/os/syscall/raw::mov-eax-syscall
  unless:
  - id: metadata/binary/framework::bsjb-marker
  downgrade:
    any:
    - id: well-known/tool/browser/
    - id: metadata/binary/resource::kernel-driver-init
    - id: metadata/binary/resource::kernel-driver-idata
    - id: micro-behaviors/os/syscall/raw::direct-syscall-pattern-cond-0--inline-7330
    - id: well-known/lib/media/ffmpeg/
# Runtime variant: the binary extracts SSNs by byte-comparing ntdll stub
# prologues AND hunts for a syscall;ret gadget in mapped memory. Legitimate
# software has no reason to locate gadget addresses; together these are the
# staging steps of a direct/indirect-syscall EDR bypass.
- id: runtime-ssn-gadget-hunt
  desc: Runtime SSN extraction with syscall-gadget hunt
  crit: hostile
  conf: 0.95
  all:
  - id: micro-behaviors/os/syscall/raw::ssn-stub-runtime-bytecheck
  - id: micro-behaviors/os/syscall/raw::syscall-gadget-byte-scan
  unless:
  - id: metadata/binary/framework::bsjb-marker
  downgrade:
    any:
    - id: metadata/signed/platform/
# Direct-memory compiler variant of the same technique: validate the ntdll
# syscall prologue byte-by-byte and locate a syscall;ret instruction to invoke
# the recovered service number without entering the userland API stub.
- id: runtime-ssn-gadget-memory-hunt
  desc: Runtime SSN extraction with memory-scanned syscall gadget
  crit: hostile
  conf: 0.97
  all:
  - id: micro-behaviors/os/syscall/raw::ssn-stub-runtime-memory-compare
  - id: micro-behaviors/os/syscall/raw::syscall-gadget-runtime-memory-compare
  unless:
  - id: metadata/binary/framework::bsjb-marker
  downgrade:
    any:
    - id: metadata/signed/platform/
