# FlashHole repurposes MD4Update after changing its page protection through
# JScript's internal HeapPageAllocator::ProtectPages. Bind the patch target
# to the resolved API rather than accepting unrelated crypto/memory calls.
defaults:
  platforms: [windows]
  for: [c, cpp, python, csharp, rust, go]
  attack: T1562.001

traits:
  - id: md4update-code-overwrite
    desc: Overwrites a resolved MD4Update entry point
    crit: suspicious
    conf: 0.98
    if:
      type: symbol
      kind: call
      regex: '(^|[.:])(memcpy|memmove|CopyMemory)$'
      arg:
        index: 0
        from:
          call: '(^|[.:])GetProcAddress$'
          argument: 1
          literal: '^MD4Update$'

  - id: jscript-protect-md4update
    desc: JScript allocator protects resolved MD4Update
    crit: suspicious
    conf: 0.98
    if:
      type: symbol
      kind: call
      regex: '(^|[.:])HeapPageAllocator[._:]{1,2}ProtectPages$'
      arg:
        index: 0
        from:
          call: '(^|[.:])GetProcAddress$'
          argument: 1
          literal: '^MD4Update$'

composite_rules:
  - id: jscript-md4update-code-patch
    desc: Patches MD4Update using JScript allocator page protection
    crit: hostile
    conf: 0.99
    all:
      - id: md4update-code-overwrite
      - id: jscript-protect-md4update
    near_lines: 20
