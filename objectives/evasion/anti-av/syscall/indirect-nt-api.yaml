defaults:
  platforms:
    - windows
  for:
    - pe
    - dll
  attack: T1055.012
  mbc: F0004
traits: []
composite_rules:
  - id: indirect-nt-api-self-injection
    desc: Self-process injection via indirect NT API calls
    crit: suspicious
    conf: 0.88
    all:
      - id: metadata/binary/instruction/operand::x64-load-rcx-minus-one
      - id: micro-behaviors/fs/path/system/library::ntdll-library-name-reference
      - id: micro-behaviors/mem/combined::virtual-allocation-api-alternative
      - id: micro-behaviors/mem/write/arbitrary::remote-write-symbol-alternative
    any:
      - id: micro-behaviors/process/inject/runtime/call::ntdll-write-memory-api-references
      - id: micro-behaviors/mem/query::nt-query-virtual-memory
      - id: micro-behaviors/mem/protect/modify/api-reference::remote-protection-api-alternative
      - id: micro-behaviors/mem/protect/modify/unspecified::virtual-protect-import
      - id: micro-behaviors/mem/protect/constant::page-execute-readwrite
    unless:
      - id: metadata/binary/symbols/count::many-imports
      - id: micro-behaviors/os/event/loop::tokio-crate-path
      - id: micro-behaviors/data/db/postgresql/
  - id: concealed-endpoint-self-injection-loader
    desc: Concealed payload with hardcoded endpoint and self-process injection
    crit: hostile
    conf: 0.97
    attack: T1027,T1055.012,T1071
    all:
      - id: indirect-nt-api-self-injection
      - id: micro-behaviors/communications/ip/endpoint::external-ipv4-port-rdata-large
      - id: metadata/binary/layout/entropy::low-entropy-binary-with-dense-region
      - id: metadata/binary/layout/overlay::large-low-entropy-overlay-pe-profile
    unless:
      - id: metadata/installer/product/
