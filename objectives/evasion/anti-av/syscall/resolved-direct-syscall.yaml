defaults:
  platforms: [windows]
  for: [pe, dll]
  arch: [x86-64]
  attack: T1562.001,T1106
  mbc: F0004

composite_rules:
  - id: resolved-direct-syscall-gateway
    desc: Resolves NT syscalls via PEB walk and executes direct syscall gateway
    crit: hostile
    conf: 0.99
    all:
      - id: micro-behaviors/os/syscall/raw::x64-resolver-preserved-arguments-syscall
    any:
      - id: micro-behaviors/os/api-resolution/manual::gs-peb-ldr-access-x64
      - id: micro-behaviors/os/api-resolution/manual::teb-self-peb-ldr-access-x64
      - id: micro-behaviors/os/api-resolution/manual::x64-peb-access-immediate
      - id: micro-behaviors/os/api-resolution/manual::peb-export-resolver-x64
