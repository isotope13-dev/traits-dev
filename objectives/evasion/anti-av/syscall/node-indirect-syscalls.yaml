defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
composite_rules:
  - id: node-pe-stager-indirect-syscall-builder
    desc: Header-erasing PE stager builds indirect syscalls
    crit: hostile
    conf: 0.99
    attack: T1106,T1027,T1620
    all:
      - id: objectives/anti-static/obfuscation/payload/memory::node-ffi-pe-header-overwrite-loader
      - id: metadata/lang/source/syntax/argument::javascript-mov-r10-rcx-stub-write
      - id: metadata/lang/source/syntax/argument::javascript-indirect-jump-stub-write
