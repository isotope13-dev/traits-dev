defaults:
  platforms: [windows]
  for: [go]
traits:
- id: go-ntdll-zw-to-nt-export-rewrite
  desc: Rewrites Zw exports as Nt names
  crit: notable
  if:
    type: text
    regex: "(?s)fn\\[0\\]\\s*==\\s*'Z'.{0,80}fn\\[1\\]\\s*==\\s*'w'.{0,100}fn\\[0\\]\\s*=\\s*'N'"
- id: go-ntdll-syscall-record-fields
  desc: Records hashed syscall and trampoline fields
  crit: notable
  if:
    type: text
    regex: '(?s)NameHash\s+uint64.{0,160}SSN\s+uint16.{0,100}TrampolineAddr\s+uintptr'
- id: go-ntdll-export-address-tables
  desc: Reads NTDLL export address tables
  crit: notable
  if:
    type: text
    regex: '(?s)getModuleExportsDirAddr.{0,500}getExportsAddressOfNames'
- id: go-ntdll-api-name-hash
  desc: Hashes resolved NTDLL API names
  crit: notable
  if:
    type: text
    regex: 'NameHash\s*:\s*hashFn\(fn\)'
composite_rules:
- id: go-ntdll-hashed-syscall-catalog
  desc: Builds a hash-based NTDLL syscall catalog
  crit: suspicious
  conf: 0.97
  attack: T1027.007
  all:
  - id: objectives/evasion/anti-av/syscall::go-ntdll-zw-to-nt-export-rewrite
  - id: objectives/evasion/anti-av/syscall::go-ntdll-syscall-record-fields
  - id: objectives/evasion/anti-av/syscall::go-ntdll-export-address-tables
  - id: objectives/evasion/anti-av/syscall::go-ntdll-api-name-hash
- id: go-ntdll-zw-export-hash-resolution
  desc: Hashes renamed NTDLL syscall exports
  crit: suspicious
  conf: 0.96
  attack: T1562.001
  all:
  - id: micro-behaviors/os/syscall/invoke::ntdll-module-name-source
  - id: objectives/evasion/anti-av/syscall::go-ntdll-zw-to-nt-export-rewrite
  - id: objectives/evasion/anti-av/syscall::go-ntdll-api-name-hash
