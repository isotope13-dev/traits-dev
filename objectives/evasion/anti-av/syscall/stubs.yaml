defaults:
  platforms:
  - linux
  - macos
  - windows
  attack: T1106
  for:
  - elf
  - macho
  - pe
traits:
- id: int-80-instruction
  desc: Direct int 0x80 syscall (x86)
  crit: suspicious
  conf: 0.85
  platforms:
  - linux
  for:
  - elf
  count_min: 2
  size_max: 10485760
  if:
    type: hex
    section: text
    pattern: CD 80
- id: svc-macos-arm64
  desc: Direct SVC syscall stub (macOS ARM64)
  crit: suspicious
  conf: 0.65
  platforms:
  - macos
  for:
  - macho
  count_min: 6
  if:
    type: hex
    section: text
    pattern: 01 10 00 D4
  unless:
  - id: metadata/lang/compiler/systems::go-version-string
  - id: metadata/signed/platform::apple
  - id: well-known/tool/reverse-engineering/frida::frida-agent-macho
  - id: well-known/tool/reverse-engineering/frida::frida-gadget-macho
- id: windows-x64-xor-return-syscall-stub
  desc: Windows x64 XOR-return syscall stub
  crit: suspicious
  conf: 0.95
  platforms:
  - windows
  for:
  - pe
  arch:
  - x86-64
  if:
    type: hex
    section: .text
    pattern: 8B 05 ?? ?? ?? ?? 41 5A 4D 33 D7 41 52 4C 8B D1 0F 05 41 5A 4D 33 D7 41 FF E2
- id: create-target-process-status
  desc: Create target process status
  crit: notable
  conf: 0.9
  platforms:
  - windows
  for:
  - pe
  if:
    type: text
    exact: CreateTargetProcess successfully.
composite_rules:
- id: syscall-evasion-linux-x86
  desc: Direct syscall usage (EDR/hook evasion)
  crit: hostile
  conf: 0.95
  attack: T1562.001
  for:
  - elf
  platforms:
  - linux
  needs: 2
  unless:
  - id: metadata/lang/scripted::sbcl-runtime
  - id: metadata/binary/section/header::many-sections-20
  any:
  - id: micro-behaviors/os/syscall/raw::syscall-x64-instruction
  - id: int-80-instruction
  - id: micro-behaviors/os/syscall/raw::sysenter-instruction
  - id: micro-behaviors/os/syscall/invoke::immediate-number-x86-64
  - id: micro-behaviors/os/syscall/raw::dense-syscalls
- id: syscall-evasion-linux-arm64
  desc: Direct syscall usage (EDR/hook evasion)
  crit: hostile
  conf: 0.95
  attack: T1562.001
  for:
  - elf
  platforms:
  - linux
  needs: 2
  unless:
  - id: metadata/lang/scripted/
  any:
  - id: micro-behaviors/os/syscall/invoke::svc-linux-arm64
  - id: micro-behaviors/os/syscall/raw::dense-syscalls
- id: syscall-evasion-macos-arm64
  desc: Direct syscall usage (EDR/hook evasion)
  crit: hostile
  conf: 0.95
  attack: T1562.001
  for:
  - macho
  platforms:
  - macos
  all:
  - id: micro-behaviors/os/syscall/raw::dense-syscalls
  any:
  - id: svc-macos-arm64
  unless:
  - id: metadata/lang/scripted/
  - id: metadata/signed/platform::apple
- id: windows-direct-syscalls
  desc: Windows direct syscalls (EDR bypass)
  crit: hostile
  conf: 0.98
  attack: T1562.001
  for:
  - pe
  platforms:
  - windows
  all:
  - id: micro-behaviors/os/syscall/raw::windows-x64-syscall-stub
  any:
  - id: micro-behaviors/os/syscall/raw::dense-syscalls
  - id: micro-behaviors/dylib/lookup::sparse-pe-dynamic-linking
- id: heavens-gate-direct-syscalls
  desc: Heaven's Gate direct syscalls bypass user-mode hooks
  crit: hostile
  conf: 0.98
  attack: T1562.001
  for:
  - pe
  - dll
  platforms:
  - windows
  arch:
  - x86
  all:
  - id: micro-behaviors/os/compat/wow64::x86-heavens-gate-transition
  - id: micro-behaviors/os/compat/wow64::x86-heavens-gate-segment-read
  - id: micro-behaviors/os/compat/wow64::x86-heavens-gate-stack-syscall-sequence
- id: windows-syscall-privileged-process-create
  desc: Direct syscall privileged process creation
  crit: hostile
  conf: 0.96
  attack: T1562.001
  for:
  - pe
  platforms:
  - windows
  all:
  - id: windows-x64-xor-return-syscall-stub
  - id: micro-behaviors/process/create/exec::nt-create-user-process-reference
  - id: micro-behaviors/os/privilege/token::nt-open-process-token-ref
  - id: micro-behaviors/os/privilege/token::nt-adjust-privileges-token-ref
  - id: micro-behaviors/os/privilege/token::sedebug-privilege-name
  any:
  - id: metadata/build/manifest::admin-manifest
  - id: create-target-process-status
- id: self-modifying-x86-image-reads-x64-segment
  desc: Self-unpacking x86 image reaches x64 mode
  crit: suspicious
  conf: 0.92
  for:
  - pe
  - dll
  platforms:
  - windows
  arch:
  - x86
  attack: T1027.007,T1620
  all:
  - id: micro-behaviors/os/compat/wow64::x86-heavens-gate-segment-read
  - id: metadata/binary/section/header::pe-entry-in-writable-section
  unless:
  - id: metadata/signed/platform/
  - id: metadata/binary/installer/family/
  - id: well-known/tool
