defaults:
  platforms:
    - linux
    - macos
    - windows
  attack: T1106
  mbc: B0009
  for: [elf, macho, pe]
traits:
  - id: syscall-x64-instruction
    desc: Direct syscall instruction (x64)
    crit: suspicious
    conf: 0.8
    platforms:
      - linux
      - windows
    for:
      - pe
      - elf
    count_min: 8
    per_kb_min: 0.03
    size_max: 10485760
    if:
      type: hex
      section: text
      pattern: 0F 05
    unless:
      - id: metadata/binary/framework::dotnet-metadata
  - id: windows-direct-syscall-x64
    desc: Windows direct syscall (mov r10 rcx; syscall)
    crit: suspicious
    conf: 0.95
    platforms: [windows]
    for: [pe, dll]
    arch: [x86-64]
    size_max: 5242880
    if:
      type: hex
      section: .text
      pattern: 49 89 CA 0F 05
    unless:
      - id: metadata/binary/linking/runtime::ape-binary-marker
      - id: metadata/signed/platform/
      - id: metadata/binary/framework::dotnet-metadata
      - id: metadata/binary/linking/runtime::cosmopolitan-ape-runtime
      - id: metadata/binary/linking/runtime::cosmopolitan-marker
  - id: int-80-instruction
    desc: Direct int 0x80 syscall (x86)
    crit: suspicious
    conf: 0.85
    platforms:
      - linux
    for:
      - elf
    count_min: 2
    size_max: 10485760
    if:
      type: hex
      section: text
      pattern: CD 80
  - id: sysenter-instruction
    desc: Direct sysenter syscall
    crit: suspicious
    conf: 0.8
    platforms:
      - linux
      - windows
    for:
      - pe
      - elf
    count_min: 5
    per_kb_min: 0.03
    size_max: 10485760
    if:
      type: hex
      section: text
      pattern: 0F 34
  - id: svc-macos-arm64
    desc: Direct SVC syscall stub (macOS ARM64)
    crit: suspicious
    conf: 0.65
    platforms:
      - macos
    for:
      - macho
    count_min: 6
    if:
      type: hex
      section: text
      pattern: 01 10 00 D4
    unless:
      - id: metadata/lang/compiler/systems::go-version-string
      - id: metadata/signed/platform::apple
      - id: well-known/tool/reverse-engineering/frida::frida-agent-macho
      - id: well-known/tool/reverse-engineering/frida::frida-gadget-macho
  - id: syscall-with-number
    desc: Syscall with immediate number
    crit: component
    conf: 0.9
    platforms:
      - linux
      - windows
    for:
      - pe
      - elf
    size_max: 10485760
    count_min: 2
    per_kb_min: 0.002
    if:
      type: hex
      section: text
      pattern: B8 ?? ?? ?? ?? 0F 05
    unless:
      - type: raw
        substr: __APE1
      - id: metadata/lang/compiler/systems::go-version-string
      - id: metadata/lang/compiled/
      - id: objectives/evasion/hijack-execution-flow/linker/
    downgrade:
      any:
        - id: metadata/signed/platform::microsoft-windows
  - id: windows-x64-syscall-stub
    desc: Windows x64 syscall stub pattern
    crit: suspicious
    conf: 0.95
    platforms:
      - windows
    for:
      - pe
    if:
      type: hex
      section: text
      pattern: 4C 8B D1 B8 ?? ?? ?? 00 0F 05
    unless:
      - id: metadata/signed/platform/
      - id: well-known/lib/crypto/workink::workink-key-validation-anti-tamper
  - id: windows-x64-xor-return-syscall-stub
    desc: Windows x64 XOR-return syscall stub
    crit: suspicious
    conf: 0.95
    platforms:
      - windows
    for:
      - pe
    arch:
      - x86-64
    if:
      type: hex
      section: .text
      pattern: 8B 05 ?? ?? ?? ?? 41 5A 4D 33 D7 41 52 4C 8B D1 0F 05 41 5A 4D 33 D7 41 FF E2
  - id: nt-create-user-process-ref
    desc: NtCreateUserProcess string reference
    crit: component
    conf: 0.9
    platforms:
      - windows
    for:
      - pe
    if:
      type: text
      exact: NtCreateUserProcess
  - id: nt-open-process-token-ref
    desc: NtOpenProcessToken string reference
    crit: component
    conf: 0.9
    platforms:
      - windows
    for:
      - pe
    if:
      type: text
      exact: NtOpenProcessToken
  - id: nt-adjust-privileges-token-ref
    desc: NtAdjustPrivilegesToken string reference
    crit: component
    conf: 0.9
    platforms:
      - windows
    for:
      - pe
    if:
      type: text
      exact: NtAdjustPrivilegesToken
  - id: sedebug-privilege-ref
    desc: SeDebugPrivilege string reference
    crit: component
    conf: 0.9
    platforms:
      - windows
    for:
      - pe
    if:
      type: text
      exact: SeDebugPrivilege
  - id: create-target-process-status
    desc: Create target process status
    crit: component
    conf: 0.9
    platforms:
      - windows
    for:
      - pe
    if:
      type: text
      exact: CreateTargetProcess successfully.
  - id: dense-syscalls
    desc: High density of syscall instructions
    crit: suspicious
    conf: 0.85
    per_kb_min: 5.0
    size_max: 10485760
    if:
      type: hex
      section: text
      pattern: 0F 05
composite_rules:
  - id: linux-vdso-binary
    desc: Linux VDSO shared object stub
    crit: notable
    conf: 0.95
    all:
      - id: metadata/binary/layout::shared-object-type
    any:
      - id: metadata/binary/linking/runtime::linux-vdso-soname-reference
      - id: micro-behaviors/os/syscall/invoke::linux-vdso-symbol
  - id: syscall-evasion-linux-x86
    desc: Direct syscall usage (EDR/hook evasion)
    crit: hostile
    conf: 0.95
    attack: T1562.001
    for:
      - elf
    platforms:
      - linux
    needs: 2
    unless:
      - id: metadata/lang/scripted::sbcl-runtime
      - id: metadata/binary/metrics/threshold::many-sections-20
    any:
      - id: syscall-x64-instruction
      - id: int-80-instruction
      - id: sysenter-instruction
      - id: syscall-with-number
      - id: dense-syscalls
  - id: syscall-evasion-linux-arm64
    desc: Direct syscall usage (EDR/hook evasion)
    crit: hostile
    conf: 0.95
    attack: T1562.001
    for:
      - elf
    platforms:
      - linux
    needs: 2
    unless:
      - id: metadata/lang/scripted/
    any:
      - id: micro-behaviors/os/syscall/invoke::svc-linux-arm64
      - id: dense-syscalls
  - id: syscall-evasion-macos-arm64
    desc: Direct syscall usage (EDR/hook evasion)
    crit: hostile
    conf: 0.95
    attack: T1562.001
    for:
      - macho
    platforms:
      - macos
    all:
      - id: dense-syscalls
    any:
      - id: svc-macos-arm64
    unless:
      - id: metadata/lang/scripted/
      - id: metadata/signed/platform::apple
  - id: windows-direct-syscalls
    desc: Windows direct syscalls (EDR bypass)
    crit: hostile
    conf: 0.98
    attack: T1562.001
    for:
      - pe
    platforms:
      - windows
    all:
      - id: windows-x64-syscall-stub
    any:
      - id: dense-syscalls
      - id: objectives/anti-static/obfuscation/payload/import::minimal-pe-dynamic-load
  - id: syscall-evasion-windows
    desc: Direct syscall usage (EDR/hook evasion)
    crit: hostile
    conf: 0.95
    attack: T1562.001
    for:
      - pe
    platforms:
      - windows
    needs: 2
    any:
      - id: syscall-x64-instruction
      - id: sysenter-instruction
      - id: syscall-with-number
      - id: windows-x64-syscall-stub
      - id: dense-syscalls
    unless:
      - id: metadata/signed/platform/
  - id: heavens-gate-direct-syscalls
    desc: Heaven's Gate direct syscalls bypass user-mode hooks
    crit: hostile
    conf: 0.98
    attack: T1562.001
    for: [pe, dll]
    platforms: [windows]
    arch: [x86]
    all:
      - id: micro-behaviors/os/compat/wow64::x86-heavens-gate-transition
      - id: micro-behaviors/os/compat/wow64::x86-heavens-gate-segment-read
      - id: micro-behaviors/os/compat/wow64::x86-heavens-gate-stack-syscall-sequence
  - id: windows-syscall-privileged-process-create
    desc: Direct syscall privileged process creation
    crit: hostile
    conf: 0.96
    attack: T1562.001
    for:
      - pe
    platforms:
      - windows
    all:
      - id: windows-x64-xor-return-syscall-stub
      - id: nt-create-user-process-ref
      - id: nt-open-process-token-ref
      - id: nt-adjust-privileges-token-ref
      - id: sedebug-privilege-ref
    any:
      - id: micro-behaviors/os/privilege/manifest::admin-manifest
      - id: create-target-process-status

  # The segment read on its own, inside an image that unpacks itself.
  #
  # `heavens-gate-direct-syscalls` above and the importless variants in
  # anti-static/obfuscation/imports/ all need the full far-call sequence or an
  # empty import table. A packer that emits only the `0x33` selector read —
  # because the rest of the transition is built at runtime, after the stub has
  # rewritten its own pages — matches none of them, which is the case this
  # covers.
  #
  # The pairing is what carries it: a 32-bit image whose entry point is in a
  # writable section is going to modify itself before it runs, and reaching for
  # the x64 selector says part of what it runs will be outside the 32-bit view
  # that a WOW64 hook or an x86-only emulator can see. Neither fact is
  # remarkable in a commercial protector, which is what the exclusions are for;
  # together, in an unsigned image, they are two evasions stacked.
  - id: self-modifying-x86-image-reads-x64-segment
    desc: Self-unpacking x86 image reaches x64 mode
    crit: suspicious
    conf: 0.92
    for: [pe, dll]
    platforms: [windows]
    arch: [x86]
    attack: T1027.007,T1620
    all:
      - id: micro-behaviors/os/compat/wow64::x86-heavens-gate-segment-read
      - id: metadata/binary/section/metrics::pe-entry-in-writable-section
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/installer/family/
      - id: well-known/tool/
