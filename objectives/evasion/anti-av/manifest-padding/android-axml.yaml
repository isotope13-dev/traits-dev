# A binary AndroidManifest is a flat list of typed chunks, and the platform
# parser skips chunk types it does not know. Droppers insert one huge chunk of
# an unknown type (0x9999 here) filled with a repeated byte so the manifest
# balloons to ~1 MiB: tools that cap or buffer the manifest give up or time out,
# while Android installs the package normally. Real manifests are a few tens of
# kilobytes with no unknown chunk.
defaults:
  platforms: [android]
  for: [xml]
  attack: T1406,T1027.001
  mbc: F0001

traits:
  - id: axml-oversized-unknown-chunk
    desc: Manifest has oversized unknown chunk
    crit: suspicious
    conf: 0.9
    size_min: 131072
    if:
      type: yara
      source: |
        rule axml_oversized_unknown_chunk {
          strings:
            $u = { 99 99 08 00 }
          condition:
            uint16(0) == 3 and uint16(2) == 8 and
            for any i in (1..#u) : (uint32(@u[i] + 4) > 65536 and @u[i] + uint32(@u[i] + 4) <= filesize)
        }
