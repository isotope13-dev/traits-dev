defaults:
  for: [vbs]
  platforms: [windows]
  crit: suspicious
  attack: "T1562.001"
  conf: 0.92
traits:
  - id: vba-disable-macro-security
    desc: VBA disables macro security settings
    conf: 0.96
    if:
      type: text
      regex: '(?i)(AccessVBOM|VBAWarnings)\s*=\s*[0-9]'
  - id: vba-trust-access-setting
    desc: VBA Trust Access to VBA project
    conf: 0.95
    if:
      type: text
      regex: '(?i)AccessVBOM\s*=\s*1'
  - id: vba-disable-protected-view
    desc: VBA disables Protected View
    conf: 0.95
    if:
      type: text
      regex: '(?i)DisableAttachments(InPV|OpenFromNetwork|Protection)\s*=\s*[0-9]'

  - id: raw-vba-macro-protection-bypass
    desc: VBA disables Office macro virus protection
    crit: suspicious
    conf: 0.96
    for: [oledoc]
    if:
      type: raw
      regex: '(?i)PrivateProfileString\b[^\r\n]{0,120}\b(MacroVirusProtection|Options6)\b'

  - id: vba-disable-virus-protection
    desc: Disables Word macro virus protection
    conf: 0.96
    for: [vbs, html, text, oledoc, ooxml]
    if:
      type: text
      regex: '(?i)\.VirusProtection\s*=\s*(False|0)\b'

  - id: vba-permissive-warnings-registry-argument
    desc: VBAWarnings registry argument enables macros
    crit: notable
    if:
      type: text
      regex: '(?i)\\(Excel|Word)\\Security\\VBAWarnings"\s*,\s*1\s*,\s*"REG_DWORD"'

  - id: vba-accessvbom-registry-argument
    desc: AccessVBOM registry argument trusts VBA project
    crit: notable
    if:
      type: text
      regex: '(?i)\\Security\\AccessVBOM"\s*,\s*1\s*,\s*"REG_DWORD"'

  - id: vba-createobject-word-application
    desc: VBA creates a separate Word instance
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)CreateObject\s*\(\s*"Word\.Application"'

  - id: vba-vbproject-code-import
    desc: VBA imports code through the VBE project
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)\.VBE\.ActiveVBProject\.VBComponents\.(Import|Add)|CodeModule\.AddFromString'

composite_rules:
  - id: vba-permissive-warnings-registry-write
    desc: VBA registry writer supplies permissive Office macro policy
    crit: suspicious
    all:
      - id: vba-permissive-warnings-registry-argument
      - id: micro-behaviors/os/registry/value/write::wscript-regwrite

  - id: vba-disables-macro-virus-protection-stealth
    desc: Auto-open disables macro protection and prompts
    crit: hostile
    conf: 0.97
    for: [vbs, oledoc, ooxml]
    all:
      - id: vba-disable-virus-protection
      - id: micro-behaviors/ui/dialog/prompt::word-disable-template-save-prompt
      - id: micro-behaviors/os/application/hook/event::vba-auto-open-sub-decl

  - id: vba-security-bypass
    desc: VBA macro security bypass attempt
    crit: suspicious
    conf: 0.98
    any:
      - id: vba-trust-access-setting
      - id: vba-disable-protected-view

  - id: oledoc-macro-security-registry-tamper
    desc: OLE document tampers with macro security
    crit: hostile
    conf: 0.98
    for: [oledoc]
    all:
      - id: raw-vba-macro-protection-bypass
      - id: micro-behaviors/fs/path/document::raw-vba-powerpoint-template-reference

  - id: vba-accessvbom-word-code-injection
    desc: VBA trusts VBOM and injects code into Word
    crit: hostile
    conf: 0.92
    near_lines: 30
    all:
      - id: vba-accessvbom-registry-argument
      - id: vba-createobject-word-application
      - id: vba-vbproject-code-import
