defaults:
  for: [vbs]
  platforms: [windows]
  crit: suspicious
  attack: "T1562.001"
  conf: 0.92
traits:
  - id: vba-disable-macro-security
    desc: VBA disables macro security settings
    conf: 0.96
    if:
      type: text
      regex: '(?i)(AccessVBOM|VBAWarnings)\s*=\s*[0-9]'
  - id: vba-trust-access-setting
    desc: VBA Trust Access to VBA project
    conf: 0.95
    if:
      type: text
      regex: '(?i)AccessVBOM\s*=\s*1'
  - id: vba-disable-protected-view
    desc: VBA disables Protected View
    conf: 0.95
    if:
      type: text
      regex: '(?i)DisableAttachments(InPV|OpenFromNetwork|Protection)\s*=\s*[0-9]'

  - id: raw-vba-macro-protection-bypass
    desc: VBA disables Office macro virus protection
    crit: suspicious
    conf: 0.96
    for: [oledoc]
    if:
      type: raw
      regex: '(?i)PrivateProfileString\b[^\r\n]{0,120}\b(MacroVirusProtection|Options6)\b'

composite_rules:
  - id: vba-security-bypass
    desc: VBA macro security bypass attempt
    crit: suspicious
    conf: 0.98
    any:
      - id: vba-trust-access-setting
      - id: vba-disable-protected-view

  - id: oledoc-macro-security-registry-tamper
    desc: OLE document tampers with macro security
    crit: hostile
    conf: 0.98
    for: [oledoc]
    all:
      - id: raw-vba-macro-protection-bypass
      - id: micro-behaviors/process/create/macro/compressed-vba::raw-vba-powerpoint-template-reference
