# OpenOffice/LibreOffice Basic forcing MacroExecMode ALWAYS_EXECUTE_NO_WARN:
# documents opened or handled with this mode run their macros with no
# security prompt -- the StarOffice analogue of zeroing VBAWarnings.
defaults:
  for: [xml]
  platforms: [windows, unix]
  attack: T1562.001
  mbc: E1562

traits:
  - id: starbasic-macro-exec-no-warning
    desc: Basic forces macros to run without warning
    crit: suspicious
    conf: 0.95
    if:
      type: text
      regex: '\bMacroExecMode\.ALWAYS_EXECUTE_NO_WARN\b'

composite_rules:
  # A Basic module that silences macro warnings while it rewires suite-wide
  # events or inspects where macro libraries are installed: suppressing the
  # prompt is what lets an injected macro run unnoticed in other documents.
  - id: starbasic-silent-macro-exec-with-library-or-event-tamper
    desc: Basic silences macro prompts and tampers
    crit: hostile
    conf: 0.94
    all:
      - id: metadata/document/office/macro::starbasic-module-xml-root
      - id: starbasic-macro-exec-no-warning
    any:
      - id: micro-behaviors/os/application/hook/registration::starbasic-global-event-rebind
      - id: micro-behaviors/metaprogramming/reflection/inspect/class/inspection::starbasic-application-and-document-library-lookup
