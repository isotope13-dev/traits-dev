defaults:
  platforms: [windows]
  for: [oledoc]
  crit: hostile
  attack: T1562.001
  conf: 0.98

traits:
  - id: office-resiliency-registry-key
    desc: Office Resiliency registry key reference
    crit: suspicious
    conf: 0.95
    if:
      type: raw
      regex: '(?i)Software\\Microsoft\\Office\\(\d+\.0|Common)\\(PowerPoint|Word|Excel)\\Resiliency'

  - id: ole-reg-delete-key-import
    desc: OLE document references RegDeleteKey API
    crit: notable
    conf: 0.92
    if:
      type: raw
      regex: '(?i)\bRegDeleteKey(Ex)?[AW]?\b'

composite_rules:
  - id: ole-document-deletes-office-resiliency
    desc: OLE document deletes Office Resiliency key
    crit: hostile
    conf: 0.98
    all:
      - id: office-resiliency-registry-key
      - id: ole-reg-delete-key-import
