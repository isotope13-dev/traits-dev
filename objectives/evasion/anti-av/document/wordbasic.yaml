defaults:
  for: [oledoc]
  platforms: [windows]
  crit: suspicious
  attack: T1562.001
  conf: 0.92

traits:
  - id: wordbasic-macro-menu-stealth
    desc: WordBasic macro menu stealth override
    if:
      type: raw
      regex: '(?i)\b(ToolsMacro|ExtrasMakro|FileTemplates|DateiDokVorlagen|FileMacro)\b'

  - id: wordbasic-execute-only-auto-macro
    desc: WordBasic execute-only auto-macro descriptor
    if:
      type: raw
      regex: '(?s)\x10\xff\xff[\s\S]{0,48}(?i)(autoopen|autoclose|autoexec|autonew|autoexit)'

  - id: wordbasic-encrypted-macro-table
    desc: WordBasic encrypted macro table header
    crit: suspicious
    conf: 0.94
    attack: T1027
    if:
      type: raw
      regex: '(?s)\xff\x01[\s\S]{2}\x55[^\x00]\x00\x00\x00\x00'

composite_rules:
  - id: wordbasic-stealth-command-hijack
    desc: WordBasic stealth macro command hijack
    crit: hostile
    conf: 0.95
    all:
      - id: wordbasic-macro-menu-stealth
      - id: micro-behaviors/process/create/macro/office::wordbasic-command-hook

  - id: wordbasic-encrypted-macro-stealth
    desc: WordBasic encrypted macro stealth
    crit: hostile
    conf: 0.95
    all:
      - id: wordbasic-encrypted-macro-table
    any:
      - id: micro-behaviors/process/create/macro/office::wordbasic-autoopen
      - id: micro-behaviors/process/create/macro/office::wordbasic-command-hook

