# Set-MpPreference accepts both the enum name `Allow` and its numeric value 6
# for a threat default action. Administrators tune these actions toward
# Quarantine/Remove; setting them to Allow for several severities, while also
# cutting sample submission or MAPS reporting, leaves Defender detecting
# nothing it will act on or report.
defaults:
  platforms: [windows]
  for: [vbs, powershell, batch, pe]
  attack: T1562.001
  mbc: E1562

traits:
  - id: defender-threat-action-allow
    desc: Sets Defender threat default action Allow
    crit: suspicious
    conf: 0.95
    if:
      type: text
      regex: '(?i)Set-MpPreference\s+.{0,40}-(High|Moderate|Low|Severe)ThreatDefaultAction\s+(6|Allow)\b'

composite_rules:
  - id: defender-threat-actions-allowed-reporting-off
    desc: Defender allows threats and stops reporting them
    crit: hostile
    conf: 0.97
    all:
      - id: defender-threat-action-allow
    any:
      - id: objectives/evasion/anti-av/blinding::defender-disable-sample-submission
      - id: objectives/evasion/anti-av/blinding::defender-disable-cloud-reporting
