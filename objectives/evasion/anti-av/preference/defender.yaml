# Base64-encoded Defender preference changes are the low-noise form
# highlighted by the article. Match decoded command shapes so alternate
# Base64 wrappers and command-line logging surfaces are covered.
defaults:
  platforms: [windows]
  for: [scripts, data]
  attack: T1562.001
  mbc: E1562

traits:
- id: encoded-defender-preference-cmdlet
  desc: Base64-encoded Defender preference cmdlet
  crit: suspicious
  conf: 0.96
  if:
    type: encoded
    encoding: base64
    regex: '(?i)\b(Set|Add)-MpPreference\b'
- id: encoded-defender-disable-monitoring
  desc: Encoded Defender monitoring disable option
  crit: suspicious
  conf: 0.97
  if:
    type: encoded
    encoding: base64
    regex: '(?i)-Disable(BehaviorMonitoring|RealtimeMonitoring|IOAVProtection)\b'
- id: encoded-defender-disable-surface
  desc: Encoded Defender attack-surface disable option
  crit: suspicious
  conf: 0.97
  if:
    type: encoded
    encoding: base64
    regex: '(?i)-Disable(ScriptScanning|IntrusionPreventionSystem)\b'
- id: encoded-defender-enable-surface
  desc: Encoded Defender protection setting change
  crit: suspicious
  conf: 0.97
  if:
    type: encoded
    encoding: base64
    regex: '(?i)-Enable(ControlledFolderAccess|NetworkProtection)\b'
- id: encoded-defender-exclusion-option
  desc: Encoded Defender exclusion option
  crit: suspicious
  conf: 0.97
  if:
    type: encoded
    encoding: base64
    regex: '(?i)-Exclusion(Path|Extension|Process)\b'
- id: encoded-defender-reporting-option
  desc: Encoded Defender reporting option change
  crit: suspicious
  conf: 0.97
  if:
    type: encoded
    encoding: base64
    regex: '(?i)-(MAPSReporting|SubmitSamplesConsent)\b'
- id: encoded-defender-add-cmdlet-wide
  desc: Wide encoded Add-MpPreference cmdlet
  crit: suspicious
  conf: 0.97
  if:
    type: encoded
    encoding: base64
    regex: '(?i)A\x00d\x00d\x00-\x00M\x00p\x00P\x00r\x00e\x00f\x00e\x00r\x00e\x00n\x00c\x00e'
- id: encoded-defender-set-cmdlet-wide
  desc: Wide encoded Set-MpPreference cmdlet
  crit: suspicious
  conf: 0.97
  if:
    type: encoded
    encoding: base64
    regex: '(?i)S\x00e\x00t\x00-\x00M\x00p\x00P\x00r\x00e\x00f\x00e\x00r\x00e\x00n\x00c\x00e'
- id: encoded-defender-disable-wide
  desc: Wide encoded Defender disable option
  crit: suspicious
  conf: 0.97
  if:
    type: encoded
    encoding: base64
    regex: '(?i)-\x00D\x00i\x00s\x00a\x00b\x00l\x00e'
- id: encoded-defender-exclusion-wide
  desc: Wide encoded Defender exclusion option
  crit: suspicious
  conf: 0.97
  if:
    type: encoded
    encoding: base64
    regex: '(?i)-\x00E\x00x\x00c\x00l\x00u\x00s\x00i\x00o\x00n'
- id: encoded-defender-enable-wide
  desc: Wide encoded Defender enable option
  crit: suspicious
  conf: 0.97
  if:
    type: encoded
    encoding: base64
    regex: '(?i)-\x00E\x00n\x00a\x00b\x00l\x00e'
- id: encoded-defender-maps-wide
  desc: Wide encoded Defender MAPS option
  crit: suspicious
  conf: 0.97
  if:
    type: encoded
    encoding: base64
    regex: '(?i)-\x00M\x00A\x00P\x00S\x00R\x00e\x00p\x00o\x00r\x00t\x00i\x00n\x00g'
- id: encoded-defender-submit-wide
  desc: Wide encoded Defender sample option
  crit: suspicious
  conf: 0.97
  if:
    type: encoded
    encoding: base64
    regex: '(?i)-\x00S\x00u\x00b\x00m\x00i\x00t\x00S\x00a\x00m\x00p'

composite_rules:
- id: encoded-defender-preference-tampering
  desc: Base64-encoded Defender preference tampering
  crit: hostile
  conf: 0.99
  attack: T1027,T1562.001
  all:
  - id: encoded-defender-preference-cmdlet
  any:
  - id: encoded-defender-disable-monitoring
  - id: encoded-defender-disable-surface
  - id: encoded-defender-enable-surface
  - id: encoded-defender-exclusion-option
  - id: encoded-defender-reporting-option
- id: encoded-defender-preference-cmdlet-wide
  desc: Wide encoded Defender preference cmdlet
  crit: suspicious
  conf: 0.98
  any:
  - id: encoded-defender-add-cmdlet-wide
  - id: encoded-defender-set-cmdlet-wide
- id: encoded-defender-preference-tampering-wide
  desc: Wide Base64 Defender preference tampering
  crit: hostile
  conf: 0.99
  attack: T1027,T1562.001
  all:
  - id: encoded-defender-preference-cmdlet-wide
  any:
  - id: encoded-defender-disable-wide
  - id: encoded-defender-exclusion-wide
  - id: encoded-defender-enable-wide
  - id: encoded-defender-maps-wide
  - id: encoded-defender-submit-wide

