defaults:
  platforms: [windows]
  for: [batch, powershell]
  attack: T1562
composite_rules:
  - id: qemu-hidden-display
    desc: Hidden VM display suppression
    crit: component
    any:
      - id: micro-behaviors/os/virtualization/hypervisor::qemu-headless-args
      - id: micro-behaviors/os/virtualization/hypervisor::qemu-display-none-flag
  - id: qemu-sidecar-network
    desc: Sidecar VM network attachment
    crit: component
    any:
      - id: objectives/command-and-control/backdoor/control/vm::qemu-sidecar-networking
      - id: micro-behaviors/os/virtualization/hypervisor::hostfwd-guest-forward
  - id: qemu-sidecar-storage
    desc: Sidecar VM guest disk
    crit: component
    any:
      - id: micro-behaviors/os/virtualization/hypervisor::qemu-guest-disk
      - id: micro-behaviors/os/virtualization/hypervisor::qemu-hda-image
      - id: objectives/command-and-control/backdoor/control/vm::qemu-misleading-disk-ext
  - id: headless-qemu-vm
    desc: Headless QEMU virtual machine
    crit: suspicious
    conf: 0.92
    all:
      - id: qemu-hidden-display
      - id: qemu-sidecar-storage
      - id: micro-behaviors/os/virtualization/hypervisor::qemu-system-binary
  - id: qemu-vm-edr-evasion
    desc: Headless QEMU VM for EDR evasion
    crit: hostile
    conf: 0.95
    all:
      - id: headless-qemu-vm
      - id: qemu-sidecar-network
    any:
      - id: micro-behaviors/os/virtualization/hypervisor::qemu-cpu-max-flag
      - id: micro-behaviors/os/virtualization/hypervisor::hostfwd-guest-forward
