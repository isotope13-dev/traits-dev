defaults:
  platforms: [linux]
  for: [c, cpp]
  crit: suspicious
  conf: 0.96
  attack: T1562.001

traits:
  - id: kernel-apparmor-disable-pointer-write
    desc: Clears AppArmor enabled state through a pointer
    if:
      type: tree-sitter
      kind: assignment
      regex: '^\*\s*apparmor_enabled\s*=\s*(0[xX]0+|0)[uUlL]*$'

  - id: kernel-apparmor-audit-disable-pointer-write
    desc: Clears AppArmor audit state through a pointer
    if:
      type: tree-sitter
      kind: assignment
      regex: '^\*\s*apparmor_(audit|logsyscall)\s*=\s*(0[xX]0+|0)[uUlL]*$'
