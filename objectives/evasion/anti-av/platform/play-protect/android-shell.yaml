# The Play Store hosts the on-device Play Protect scanner. Keep commands
# on parsed source literals; comments and articles are not executable evidence.
defaults:
  platforms: [android, unix]
  for: [java, kotlin, go, rust, c, cpp, python, javascript, typescript]
  conf: 0.98
  attack: T1562.001

composite_rules:
  - id: android-source-disable-play-store
    desc: Play Store disable command with process launch
    crit: suspicious
    all:
      - id: micro-behaviors/os/package-manager/management::android-play-store-disable-literal
      - id: micro-behaviors/process/create

  - id: android-shell-store-suppression-install
    desc: Play Store disable plus APK install writes
    crit: hostile
    for: [java, kotlin]
    attack: T1562.001,T1631
    all:
      - id: android-source-disable-play-store
      - id: micro-behaviors/os/package-manager/sideload::android-programmatic-apk-install
      - id: micro-behaviors/os/package-manager/sideload::android-packageinstaller-open-write
      - id: micro-behaviors/process/create/subprocess::java-processbuilder-start-source
