# The component argument and disabling state must belong to the same call.
# Java facts expose constructor arguments but currently omit the constructor
# target in value flow, so separate symbol/literal matches lose this binding.
# Restrict this query to the inline ComponentName form actually tested.
defaults:
  for: [java]
  platforms: [android]
  attack: T1629.003

traits:
  - id: android-verifier-component-disable
    desc: Disables Google Play verifier component
    crit: suspicious
    conf: 0.98
    ref: https://www.cloudsek.com/blog/inside-party-panel-android-banking-trojan-targeting-indian-banks
    if:
      type: tree-sitter
      language: java
      query: |
        ((method_invocation
          name: (identifier) @method
          arguments: (argument_list
            . (object_creation_expression
                type: (_) @type
                arguments: (argument_list
                  . (_)
                  . (string_literal) @service .))
            . [(decimal_integer_literal) (field_access) (identifier)] @state
            . (_) .)) @call
        (#eq? @method "setComponentEnabledSetting")
        (#match? @type "(^|\\.)ComponentName$")
        (#eq? @service "\"com.google.android.verifier.integration.VerifierService\"")
        (#match? @state "^(2|PackageManager\\.COMPONENT_ENABLED_STATE_DISABLED)$"))

composite_rules:
  - id: android-verifier-component-disable-install
    desc: Disables Google Play verifier near staged APK installation
    crit: hostile
    conf: 0.98
    near_bytes: 1800
    all:
      - id: android-verifier-component-disable
      - id: micro-behaviors/os/package-manager/sideload::android-programmatic-apk-install
      - id: micro-behaviors/os/package-manager/sideload::android-packageinstaller-open-write
