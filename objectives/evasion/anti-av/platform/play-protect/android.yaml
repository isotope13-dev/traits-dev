# Droppers that stand up a VpnService solely to exclude Google Play /
# Play Services from the tunnel (blocking Play Protect telemetry) while
# silently installing a staged APK. Legitimate VPN clients rarely combine
# Play-package exclusion with PackageInstaller session writes.
defaults:
  platforms: [android]
  for: [java, kotlin]
  attack: T1629,T1631

composite_rules:
  - id: android-vpn-play-protect-exclusion-dropper
    desc: VPN excludes Play Protect while silently installing APK
    crit: hostile
    conf: 0.98
    attack: T1629.001,T1631
    all:
      - id: micro-behaviors/os/network/interface::android-vpn-play-services-exclusion
      - id: micro-behaviors/os/network/interface::android-vpn-service-source
      - id: micro-behaviors/os/package-manager/install::android-silent-apk-install
      - id: objectives/command-and-control/dropper/staging/embedded::android-install-session-write-apk
