# A VpnService allowlist sends the named applications into the local TUN.
# Combining explicit Google Play routing with a PackageInstaller session write
# captures droppers that isolate Play verification traffic while installing a
# staged APK. It does not depend on a malware-family name or C2 indicator.
defaults:
  crit: hostile
  conf: 0.98
  platforms: [android]
  for: [java, kotlin]
  attack: T1629,T1631

composite_rules:
  - id: android-vpn-play-services-routing-dropper
    desc: Dropper routes Google Play through local VPN
    all:
      - id: micro-behaviors/os/network/tunnel::android-vpn-play-services-allowlist-call
      - id: micro-behaviors/os/network/tunnel::android-vpn-service-source
      - id: micro-behaviors/os/network/tunnel::android-vpn-builder-source
      - id: micro-behaviors/os/network/tunnel::android-vpn-add-route-source
      - id: micro-behaviors/os/package-manager/sideload::android-programmatic-apk-install
      - id: micro-behaviors/os/package-manager/sideload::android-packageinstaller-open-write

  # StreamRat-class droppers cut the whole device off from the Internet by
  # establishing a deliberately non-functional VPN: every route is pulled into
  # a local TUN that processes and forwards nothing, with the dropper itself
  # excluded so its own download still works. The block stays up while the
  # downloaded payload is installed, denying cloud-based reputation and
  # code-analysis checks (e.g. Play Protect online verification) a chance to
  # inspect the unknown package, then is torn down so the payload can reach
  # its C2. A self-excluded full-route VPN plus a programmatic package-install
  # session is the observable artifact of that technique; no malware-family
  # name or C2 indicator is involved.
  - id: android-vpn-internet-block-install-dropper
    desc: Dropper installs APK while blocking internet via self-excluded VPN
    all:
      - id: micro-behaviors/os/network/tunnel::android-vpn-service-source
      - id: micro-behaviors/os/network/tunnel::android-vpn-builder-source
      - id: micro-behaviors/os/network/tunnel::android-vpn-add-route-source
      - id: micro-behaviors/os/network/tunnel::android-vpn-disallowed-application-source
      - id: micro-behaviors/os/package-manager/sideload::android-package-installer-session-mode
      - id: micro-behaviors/os/package-manager/sideload::android-packageinstaller-open-write
    any:
      - id: micro-behaviors/os/package-manager/sideload::android-can-request-package-installs
      - id: micro-behaviors/os/package-manager/sideload::android-package-installer-no-user-action

  # RemControl-class droppers take the narrower route: instead of cutting
  # the whole device off, they addDisallow only the Play Store package
  # (com.android.vending) so Play Protect verification traffic dies in the
  # TUN while everything else works. A VPN service that excludes Play from
  # the tunnel plus a staged package-install session is the observable
  # artifact; the allowlist sibling above cannot match this blocklist shape.
  - id: android-vpn-play-store-block-install-dropper
    desc: Dropper installs APK while VPN-blocking Play Store traffic
    all:
      - id: micro-behaviors/os/network/tunnel::android-vpn-service-source
      - id: micro-behaviors/os/network/tunnel::android-vpn-builder-source
      - id: micro-behaviors/os/network/tunnel::android-vpn-play-services-exclusion
      - id: micro-behaviors/os/package-manager/sideload::android-package-installer-session-mode
      - id: micro-behaviors/os/package-manager/sideload::android-packageinstaller-open-write

  # Some privileged droppers skip the VPN and go straight at the store: they
  # disable the Play Store package, drive a full PackageInstaller session for
  # a payload the store never saw, forge the installer identity so the
  # sideload reads as store-installed, and re-enable the store afterwards.
  # No legitimate updater disables the store to install something, and the
  # forged attribution is only useful to mislead provenance checks, so the
  # full combination is a hostile install-hiding technique rather than four
  # ordinary PackageManager calls.
  - id: android-store-disable-silent-install-dropper
    desc: Dropper disables the store to silently install a forged payload
    attack: T1631,T1562.001
    all:
      - id: micro-behaviors/os/package-manager/management::android-store-app-disable-call
      - id: micro-behaviors/os/application/target::android-play-store-package-literal
      - id: micro-behaviors/os/package-manager/sideload::android-programmatic-apk-install
      - id: micro-behaviors/os/package-manager/management::android-installer-identity-spoof-call
  # Disabling the store, driving an APK install, and restoring the store
  # together identify an attempted install-time verifier bypass. Disabling
  # the package alone is neutral. Static source cannot prove that the caller
  # has the required privileges, verification is skipped, or restoration runs.
  - id: android-store-disable-install-restore
    desc: Disables Play Store around an APK install
    crit: suspicious
    all:
    - id: micro-behaviors/os/package-manager/management::android-play-store-disable-command
    - id: micro-behaviors/os/package-manager/management::android-play-store-enable-command
    - id: micro-behaviors/os/package-manager/sideload::android-apk-session-commit
    - id: micro-behaviors/os/package-manager/sideload::android-store-disable-before-apk-write
    near_bytes: 1800
    attack: T1629.003

  # Requiring the restore command to follow the APK session commit confirms
  # the Store is kept disabled across the staged payload installation. The
  # launched disable command must precede the APK write, so unrelated store
  # management and installer code elsewhere in a source file cannot combine.
  - id: android-store-disabled-through-apk-install
    desc: Disables Play Store through a staged APK installation
    crit: hostile
    all:
      - id: micro-behaviors/os/package-manager/management::android-play-store-disable-command
      - id: micro-behaviors/os/package-manager/management::android-play-store-enable-command
      - id: micro-behaviors/os/package-manager/sideload::android-apk-session-commit
      - id: micro-behaviors/os/package-manager/sideload::android-store-disable-before-apk-write
      - id: micro-behaviors/os/package-manager/sideload::android-store-enable-after-apk-commit
    near_bytes: 1800
    attack: T1629.003
