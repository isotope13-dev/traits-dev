# A VpnService allowlist sends the named applications into the local TUN.
# Combining explicit Google Play routing with a PackageInstaller session write
# captures droppers that isolate Play verification traffic while installing a
# staged APK. It does not depend on a malware-family name or C2 indicator.
defaults:
  platforms: [android]
  for: [java, kotlin]
  attack: T1629,T1631

composite_rules:
  - id: android-vpn-play-services-routing-dropper
    desc: Dropper routes Google Play through local VPN
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/os/network/interface::android-vpn-play-services-allowlist-call
      - id: micro-behaviors/os/network/interface::android-vpn-service-source
      - id: micro-behaviors/os/network/interface::android-vpn-builder-source
      - id: micro-behaviors/os/network/interface::android-vpn-add-route-source
      - id: micro-behaviors/os/package-manager/install::android-silent-apk-install
      - id: micro-behaviors/os/package-manager/install::android-packageinstaller-open-write
