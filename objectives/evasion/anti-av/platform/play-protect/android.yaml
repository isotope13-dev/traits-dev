# A VpnService allowlist sends the named applications into the local TUN.
# Combining explicit Google Play routing with a PackageInstaller session write
# captures droppers that isolate Play verification traffic while installing a
# staged APK. It does not depend on a malware-family name or C2 indicator.
defaults:
  platforms: [android]
  for: [java, kotlin]
  attack: T1629,T1631

composite_rules:
  - id: android-vpn-play-services-routing-dropper
    desc: Dropper routes Google Play through local VPN
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/os/network/interface::android-vpn-play-services-allowlist-call
      - id: micro-behaviors/os/network/interface::android-vpn-service-source
      - id: micro-behaviors/os/network/interface::android-vpn-builder-source
      - id: micro-behaviors/os/network/interface::android-vpn-add-route-source
      - id: micro-behaviors/os/package-manager/install::android-silent-apk-install
      - id: micro-behaviors/os/package-manager/install::android-packageinstaller-open-write

  # StreamRat-class droppers cut the whole device off from the Internet by
  # establishing a deliberately non-functional VPN: every route is pulled into
  # a local TUN that processes and forwards nothing, with the dropper itself
  # excluded so its own download still works. The block stays up while the
  # downloaded payload is installed, denying cloud-based reputation and
  # code-analysis checks (e.g. Play Protect online verification) a chance to
  # inspect the unknown package, then is torn down so the payload can reach
  # its C2. A self-excluded full-route VPN plus a programmatic package-install
  # session is the observable artifact of that technique; no malware-family
  # name or C2 indicator is involved.
  - id: android-vpn-internet-block-install-dropper
    desc: Dropper installs APK while blocking internet via self-excluded VPN
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/os/network/interface::android-vpn-service-source
      - id: micro-behaviors/os/network/interface::android-vpn-builder-source
      - id: micro-behaviors/os/network/interface::android-vpn-add-route-source
      - id: micro-behaviors/os/network/interface::android-vpn-disallowed-application-source
      - id: micro-behaviors/os/package-manager/install::android-package-installer-session-mode
      - id: micro-behaviors/os/package-manager/install::android-packageinstaller-open-write
    any:
      - id: micro-behaviors/os/package-manager/install::android-can-request-package-installs
      - id: micro-behaviors/os/package-manager/install::android-package-installer-no-user-action
