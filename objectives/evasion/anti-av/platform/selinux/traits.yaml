defaults:
  attack: T1562.001
  platforms:
    - linux
traits:
  - id: kotlin-setenforce-zero
    desc: Kotlin setenforce zero command
    crit: suspicious
    conf: 0.9
    platforms: [android]
    for: [kotlin]
    if:
      type: text
      substr: "setenforce 0"
  - id: load-policy-command
    desc: Loads a custom SELinux policy
    crit: suspicious
    conf: 0.8
    for:
      - shell
    if:
      type: text
      regex: '(?m)^[ \t]*((sudo[ \t]+)?load_policy)([ \t]|$)'
    unless:
      - id: metadata/lang/source::linux-kernel-secondary-tree-path
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-scripts
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-extra
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-mmfs
      - id: metadata/lang/source::linux-kernel-primary-tree-path
  # Only module *removal* and *disabling* degrade the MAC policy. Installing or
  # enabling a module (`semodule -i/-e`, and the `-n`/`-B` reload flags) is what
  # every RPM %post scriptlet, container build, and Ansible SELinux role does to
  # ship its own policy — that neutral form lives in
  # micro-behaviors/os/security/selinux::semodule-install-command.
  - id: semodule-remove-command
    desc: Removes or disables an SELinux policy module
    crit: suspicious
    conf: 0.8
    for:
      - shell
    if:
      type: text
      regex: '(?m)^\s*(sudo\s+)?semodule\s+-[rd]\b'
    unless:
      - id: well-known/tool/detection/wazuh/
  - id: grubby-selinux-zero-argument
    desc: Grubby adds selinux=0 to kernel boot arguments
    crit: suspicious
    conf: 0.85
    for:
      - shell
    if:
      type: text
      regex: '(?m)\bgrubby\b[^\n]{0,120}--args[ =][^\n]{0,120}\bselinux=0\b'
    unless:
      - id: metadata/lang/source::linux-kernel-primary-tree-path
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-scripts
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-any
      - id: well-known/tool/detection/security-remediation::openscap-cis-remediation-script
  - id: grubby-enforcing-zero-argument
    desc: Grubby adds enforcing=0 to kernel boot arguments
    crit: suspicious
    conf: 0.85
    for:
      - shell
    if:
      type: text
      regex: '(?m)\bgrubby\b[^\n]{0,120}--args[ =][^\n]{0,120}\benforcing=0\b'
    unless:
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-scripts
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-any
      - id: well-known/tool/detection/security-remediation::openscap-cis-remediation-script
  # The write context is what makes this a disable rather than a mention. A
  # bare `SELINUX=disabled` literal also appears in every hardening AUDIT --
  # `grep -iqE "(SELINUX=enforcing|SELINUX=permissive)" /etc/selinux/config`
  # in the OpenSCAP test suite read as "sets SELinux permissive". Requiring
  # either a rewrite verb on the same line or the directive standing alone on
  # its own line (heredoc-written config) also picks up the unquoted
  # `echo SELINUX=disabled >` form that the string_literal matcher missed.
  - id: selinux-disabled-config
    desc: Writes SELINUX=disabled to the SELinux config
    crit: suspicious
    conf: 0.85
    for:
      - shell
    if:
      type: text
      regex: '(?m)(^[ \t]*|\b(sed|echo|printf)\b[^\n]{0,80})SELINUX=disabled'
    unless:
      - id: well-known/app/data/ease::installer-script-marker
      - id: well-known/tool/detection/security-remediation::openscap-cis-remediation-script
      - id: well-known/app/storage/clonezilla::drbl-locale-catalog-context
      - id: well-known/app/infrastructure/linuxmirrors::project-identity
    downgrade:
      any:
        - id: micro-behaviors/os/service/legitimate::installer-script
        - id: metadata/package/files/included::install-uninstall-shell-basename
        - id: well-known/app/infrastructure/fboss::fboss-image-tooling-source
  - id: selinux-permissive-config
    desc: Writes SELINUX=permissive to the SELinux config
    crit: suspicious
    conf: 0.8
    for:
      - shell
    if:
      type: text
      regex: '(?m)(^[ \t]*|\b(sed|echo|printf)\b[^\n]{0,80})SELINUX=permissive'
    unless:
      - id: well-known/tool/sysadmin/cubesandbox::cubesandbox-source-path
      - id: well-known/app/data/ease::installer-script-marker
      - id: well-known/tool/sysadmin/k3s::k3s-vagrant-provisioner
      - id: well-known/tool/detection/security-remediation::openscap-cis-remediation-script
      - type: text
        regex: '(?i)kube(adm|let|ctl)'
      - id: well-known/tool/sysadmin/kubernetes/bootstrap::kubernetes-deployment-script-basename
      - id: well-known/tool/sysadmin/kubernetes/bootstrap::kubernetes-linux-node-bootstrap
      - id: well-known/lib/crypto/gokrb5::testenv-bootstrap-script
  - id: selinux-state-symbol
    desc: selinux_state struct, runtime-patch target
    crit: suspicious
    conf: 0.75
    for:
      - c
      - elf
    if:
      type: symbol
      exact: selinux_state
  - id: enforcing-keyword
    desc: enforcing keyword
    crit: component
    conf: 0.6
    for:
      - shell
    if:
      type: string_literal
      word: enforcing
  - id: fake-enforce-identifier
    desc: fake_enforce spoofs SELinux enforcing
    crit: suspicious
    conf: 0.8
    for:
      - c
      - elf
    if:
      type: text
      substr: fake_enforce
  - id: sel-read-enforce-symbol
    desc: sel_read_enforce kernel enforce reader
    crit: suspicious
    conf: 0.8
    for:
      - c
      - elf
    if:
      type: symbol
      exact: sel_read_enforce
  - id: sel-write-enforce-symbol
    desc: Patches sel_write_enforce to disable SELinux
    crit: suspicious
    conf: 0.8
    for:
      - c
      - elf
    if:
      type: symbol
      exact: sel_write_enforce
composite_rules:
  - id: enforcement-commands
    desc: SELinux enforcement commands
    for: [scripts, binaries]
    any:
      - id: objectives/impact/degrade/mac::selinux-setenforce
      - id: micro-behaviors/os/security/selinux::permissive-keyword
    crit: baseline
    unless:
      - id: well-known/app/development/kilocode::kilo-code-native-runtime
      - id: well-known/tool/reverse-engineering/frida/
      - id: well-known/app/infrastructure/systemd::container-runtime-component-basename
      - id: well-known/app/publishing/matomo/
      - id: metadata/package/files/dependency::os-image-root-file-path
      - id: well-known/tool/sysadmin/cubesandbox::cubesandbox-source-path
      - id: metadata/package/files/wheel-sdist::python-wheel-vendored-shlib-dir
      - id: well-known/lib/native/selinux::official-libselinux
  - id: policy-commands
    desc: SELinux policy modification commands
    for:
      - shell
    any:
      - id: load-policy-command
      - id: semodule-remove-command
    crit: suspicious
    unless:
      - id: metadata/lang/source::linux-kernel-secondary-tree-path
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-scripts
      - id: metadata/lang/source::linux-kernel-primary-tree-path
      - id: metadata/build/recognized-contexts::benign-build-tooling-context
      - id: well-known/app/infrastructure/virtualbox::unattended-template
      - id: well-known/app/data/postgresql::postgresql-source-tree
      - id: well-known/tool/detection/wazuh/
  # Two of the four legs are /etc/selinux/config writes, not boot parameters,
  # so the description names both surfaces this umbrella actually covers.
  - id: kernel-parameters
    desc: SELinux turned off by boot param or config
    for:
      - shell
    any:
      - id: grubby-selinux-zero-argument
      - id: grubby-enforcing-zero-argument
      - id: selinux-disabled-config
      - id: selinux-permissive-config
    crit: suspicious
    unless:
      - id: metadata/lang/source::linux-kernel-primary-tree-path
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-scripts
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-any
      - id: well-known/tool/sysadmin/cubesandbox::cubesandbox-source-path
      - id: well-known/app/data/ease::installer-script-marker
      - id: well-known/tool/sysadmin/k3s::k3s-vagrant-provisioner
      - id: well-known/tool/detection/security-remediation::openscap-cis-remediation-script
      - id: well-known/lib/crypto/gokrb5::testenv-bootstrap-script
  - id: sel-enforce-symbols
    desc: SELinux enforcement symbols
    for:
      - c
      - elf
    all:
      - id: sel-read-enforce-symbol
      - id: sel-write-enforce-symbol
    crit: suspicious
  - id: policy-manipulation
    desc: SELinux policy load or manipulation
    crit: suspicious
    conf: 0.8
    for: [scripts, binaries]
    any:
      - id: policy-commands
      - id: micro-behaviors/os/security/selinux::selinux-config-path
    downgrade:
      any:
        - id: micro-behaviors/dylib/library/family/
        - id: metadata/package/testing/presence/platform_suites/
        - id: metadata/build/autotools
    unless:
      # libselinux itself reads /etc/selinux/config as part of normal policy
      # initialization; that library identity is not an AV-evasion signal.
      - id: well-known/lib/native/selinux::official-libselinux
      # libsystemd also consumes SELinux configuration while applying normal
      # labels; its shared runtime is not policy-tampering code.
      - id: well-known/lib/native/systemd::systemd-shared-library
      - id: well-known/tool/detection/wazuh/
      - id: well-known/tool/sysadmin/busybox::busybox-binary
  - id: selinux-state-enforcing
    desc: SELinux state with enforcing keyword
    for:
      - c
      - elf
    all:
      - id: selinux-state-symbol
      - id: enforcing-keyword
    crit: suspicious
  - id: fake-enforce-selinux
    desc: Fake enforce with SELinux state
    for:
      - c
      - elf
    all:
      - id: fake-enforce-identifier
      - id: selinux-state-symbol
    crit: suspicious
  - id: runtime-patch
    desc: Runtime kernel patch to disable SELinux
    crit: suspicious
    conf: 0.95
    for:
      - c
      - elf
    any:
      - id: selinux-state-enforcing
      - id: sel-enforce-symbols
      - id: fake-enforce-selinux
  - id: bypass-comp
    desc: SELinux enforcement-control indicators
    crit: notable
    conf: 0.95
    for: [scripts, binaries]
    needs: 2
    any:
      - id: enforcement-commands
      - id: kernel-parameters
      - id: runtime-patch
    unless:
      - id: metadata/lang/source::linux-kernel-primary-tree-path
      - id: well-known/tool/reverse-engineering/rizin::rz-test-usage
      - id: well-known/tool/reverse-engineering/frida/
      - id: metadata/package/files/wheel-sdist::python-wheel-vendored-shlib-dir
      - id: well-known/app/infrastructure/systemd::container-runtime-component-basename
      - id: metadata/package/files/dependency::os-image-root-file-path
      - id: well-known/tool/sysadmin/busybox::busybox-binary
      - id: well-known/tool/detection/security-remediation::openscap-cis-remediation-script
