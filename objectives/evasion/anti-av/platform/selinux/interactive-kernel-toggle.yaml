defaults:
  platforms: [linux]
  for: [shell, markdown]
  attack: T1562.001

traits:
  - id: selinux-permissive-command-source
    desc: Shell command sets SELinux permissive
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: '(?m)^\s*setenforce\s+0\s*$'
  - id: kernel-disable-aslr-lockdown-boot
    desc: Boot options disable KASLR and lockdown
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: 'nokaslr\s+lockdown=none'

composite_rules:
  - id: selinux-kernel-protections-toggle
    desc: Script toggles SELinux and kernel protections
    crit: suspicious
    conf: 0.96
    all:
      - id: selinux-permissive-command-source
      - id: kernel-disable-aslr-lockdown-boot
