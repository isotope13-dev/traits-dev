# Removal resistance in Android source. Banking RATs watch for navigation
# into system settings screens for app management, accessibility
# configuration, or factory reset, and fire back navigation before the
# victim can act. The detection spans localized UI strings; the durable
# code shape is an accessibility service that gates GLOBAL_ACTION_BACK on
# the Settings package.
defaults:
  platforms: [android]
  for: [java, kotlin]
  attack: T1629

traits:
  - id: android-settings-package-reference
    desc: References Android Settings package
    crit: notable
    conf: 0.9
    if:
      type: text
      substr: com.android.settings

composite_rules:
  - id: android-removal-screen-back-navigation
    desc: Accessibility service backs out of Settings removal screens
    crit: hostile
    conf: 0.96
    all:
      - id: micro-behaviors/hardware/input/accessibility::android-accessibility-service-source
      - id: android-settings-package-reference
      - id: micro-behaviors/hardware/input/accessibility::android-accessibility-back-navigation
