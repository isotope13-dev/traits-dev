# Multilingual button/label tables that an accessibility service matches against
# Settings screens so it can click through (or away from) them: uninstall,
# force-stop and clear-data buttons guard the implant against removal, and the
# Play Protect "turn off" text lets it dismiss the scanner prompt. The tables are
# keyed by purpose, one array per Settings control.
defaults:
  platforms: [android]
  for: [json]
  attack: T1629.001,T1629.003,T1453
  mbc: F0004

traits:
  - id: removal-control-keyword-tables
    desc: Uninstall and force-stop keyword tables
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '"(UNINSTALL|FORCE_STOP|CLEAR_DATA)_KEYWORDS"\s*:\s*\['

  - id: play-protect-dismiss-text-table
    desc: Keyword table for Play Protect turn-off prompt
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '"PLAY_PROTECT_[A-Z_]{0,20}TEXTS"\s*:\s*\['

composite_rules:
  - id: settings-button-keyword-tables-for-removal-guard
    desc: Settings keyword tables for removal guard and Play Protect dismissal
    crit: hostile
    conf: 0.9
    all:
      - id: removal-control-keyword-tables
      - id: play-protect-dismiss-text-table
