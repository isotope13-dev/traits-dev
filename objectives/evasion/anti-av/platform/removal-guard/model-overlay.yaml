- id: model-recents-removal-obstruction
  desc: Model UI with removal-obstructing overlays
  crit: hostile
  conf: 0.99
  all:
  - id: micro-behaviors/data/llm/decision::android-recents-model-gesture-context
  - id: objectives/evasion/anti-av/platform/removal-guard::accessibility-removal-control-overlay
