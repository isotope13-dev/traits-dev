defaults:
  platforms: [android]
  for: [java, kotlin]

traits:
  - id: android-package-installer-comparison
    desc: Tests for Android package installer
    crit: component
    conf: 0.95
    if:
      type: symbol
      kind: call
      regex: '^(contains|equals|startsWith|endsWith)$'
      arg:
        index: 0
        kind: string
        regex: '(^|\.)packageinstaller($|\.)'

composite_rules:
  - id: android-installer-back-navigation
    desc: Installer detection near accessibility Back action
    crit: suspicious
    conf: 0.96
    attack: T1629.003
    near_lines: 6
    all:
      - id: android-package-installer-comparison
      - id: micro-behaviors/hardware/input/accessibility::android-accessibility-back-navigation
