defaults:
  platforms: [windows]
  for: [javascript]

composite_rules:
  - id: obfuscated-download-to-chrome-profile-exe
    desc: Obfuscated downloader targets Chrome profile executable
    crit: hostile
    conf: 0.97
    all:
      - id: obfuscated-download-exclusion-elevation
      - id: micro-behaviors/fs/path/application/browser/profile::chrome-user-data-download-stream

  - id: obfuscated-download-chrome-path-fragments
    desc: Obfuscated downloader with Chrome path fragments
    crit: notable
    conf: 0.94
    all:
      - id: obfuscated-download-exclusion-elevation
      - id: micro-behaviors/fs/path/application/browser/profile::chrome-profile-executable-fragments-array

  - id: obfuscated-download-exclusion-elevation
    desc: Obfuscated download with Defender exclusion
    crit: hostile
    conf: 0.96
    attack: T1562.001,T1105,T1548.002
    all:
      - id: objectives/anti-static/obfuscation/obfuscator/js-obfuscator::javascript-obfuscator-string-array-runtime
      - id: micro-behaviors/os/security/defender::defender-exclusion-command
      - id: micro-behaviors/communications/http/download/handler::javascript-download-helper-call
      - id: micro-behaviors/communications/http/request/computed::js-computed-http-object-call
      - id: micro-behaviors/process/create/exec::js-execfile-call
      - id: objectives/privilege-escalation/elevation-control/uac-bypass/relaunch::start-process-runas-hidden-raw
