# Several writes through this native settings broker form the concrete
# defense-impairment sequence described in the article.
- id: defender-adminflows-broker
  desc: SystemSettingsAdminFlows broker
  crit: notable
  conf: 0.96
  for: [scripts, binaries]
  if:
    type: text
    regex: '(?i)\bSystemSettingsAdminFlows(\.exe)?\b'
- id: defender-adminflows-setting-a
  desc: Defender telemetry setting mutation
  crit: suspicious
  conf: 0.96
  for: [scripts, binaries]
  if:
    type: text
    regex: '(?i)\bDefender\s+(RTP|SpynetReporting)\s+[01]\b'
- id: defender-adminflows-setting-b
  desc: Defender sample setting mutation
  crit: suspicious
  conf: 0.96
  for: [scripts, binaries]
  if:
    type: text
    regex: '(?i)\bDefender\s+(SubmitSamplesConsent|DisableEnhancedNotifications)\s+[01]\b'

# Defender exclusion-tampering that also HIDES the exclusion from the machine's
# own administrators / the Security app UI. A legitimate installer that adds an
# exclusion has no reason to conceal it -- HideExclusionsFromLocalAdmins,
# HideExclusionsFromLocalUsers and HideExclusionsUI exist only to keep a
# defender-blind spot invisible to the person who could notice and remove it.
# Each is `notable` alone (an admin could set it deliberately); the composite
# pairs concealment with an actual exclusion write.
- id: defender-hide-exclusions-from-admins
  desc: Defender hides exclusions from local admins
  crit: notable
  conf: 0.95
  for: [batch, powershell, vbs, javascript, csharp, pe, dll]
  if:
    type: text
    substr: HideExclusionsFromLocalAdmins
    case_insensitive: true
- id: defender-hide-exclusions-from-users
  desc: Defender hides exclusions from local users
  crit: notable
  conf: 0.95
  for: [batch, powershell, vbs, javascript, csharp, pe, dll]
  if:
    type: text
    substr: HideExclusionsFromLocalUsers
    case_insensitive: true
- id: defender-hide-exclusions-ui
  desc: Defender hides the exclusions UI
  crit: notable
  conf: 0.93
  for: [batch, powershell, vbs, javascript, csharp, pe, dll]
  if:
    type: text
    substr: HideExclusionsUI
    case_insensitive: true

# Finding Defender's exclusion list without the rights to read it.
#
# `Get-MpPreference` returns the exclusions, and needs privileges. A script
# that has none can ask Defender to scan a path and read the answer instead:
# an excluded path comes back "was skipped". Run over a directory tree, that
# is a search for somewhere a payload can sit and not be looked at.
#
# The pair below is what separates it from ordinary scanning. Nothing
# administrative tests a scan's output for the skip message -- an
# administrator reads the list.
- id: defender-single-path-scan
  desc: Scans one path with MpCmdRun
  crit: component
  conf: 0.85
  for: [powershell, batch, csharp, python]
  if:
    type: text
    # The executable path and its argument string are commonly assigned to
    # separate variables, so the two halves sit on different lines.
    regex: 'MpCmdRun[\s\S]{0,150}-Scan\b[^\r\n]{0,50}-ScanType'
    case_insensitive: true
- id: defender-skip-response-test
  desc: Tests a scan result for skipped
  crit: component
  conf: 0.9
  for: [powershell, batch, csharp, python]
  if:
    type: text
    regex: '(-match|-like|contains)[^\r\n]{0,12}.was skipped'
    case_insensitive: true

composite_rules:
- id: defender-notification-policy-tamper
  desc: Adds Defender notification-disable policy
  crit: hostile
  conf: 0.99
  for: [python, powershell, batch, vbs, javascript]
  all:
  - id: defender-notification-disable-policy
  - id: micro-behaviors/os/registry/manipulate::reg-exe-add-command

- id: defender-exclusion-command-text
  desc: Defender exclusion addition command
  crit: suspicious
  conf: 0.98
  all:
  - id: defender-preference-option-prefix
  - id: defender-exclusion-option-text
  near_bytes: 256
  unless:
  - id: well-known/tool/sysadmin/kubernetes/bootstrap::kubernetes-windows-gce-script
  - id: well-known/tool/development/go-x-build::go-x-build-infra-context
  - id: well-known/app/enterprise/dotmatics-dtx::dtx-cloud-management-context
  - id: metadata/build/ci/agent::ci-runner-windows-configuration-context

- id: defender-systemdrive-exclusion
  desc: Defender exclusion targets system drive
  crit: suspicious
  conf: 0.99
  for: [scripts, binaries]
  all:
  - id: defender-exclusion-option-text
  any:
  - id: micro-behaviors/os/env/vars/system-info::systemdrive-percent-lookup
  - id: micro-behaviors/os/env/vars/system-info::systemdrive-powershell-lookup
  near_bytes: 128

- id: defender-whole-drive-exclusion
  desc: Adds an entire drive to Defender exclusions
  crit: hostile
  conf: 0.99
  for: [scripts, binaries]
  all:
  - id: defender-exclusion-command-text
  any:
  - id: defender-drive-exclusion
  - id: defender-systemdrive-exclusion
  near_bytes: 256

- id: defender-whole-drive-exclusion-edr-kill
  desc: Excludes an entire drive then force-kills a security process
  crit: hostile
  conf: 0.99
  for: [scripts, binaries]
  all:
  - id: defender-whole-drive-exclusion
  - id: objectives/impact/degrade/edr/targeting::edr-security-process-termination
  near_bytes: 1024

- id: native-defender-exclusion-loader
  desc: Native loader invokes PowerShell to add Defender exclusions
  crit: hostile
  conf: 0.99
  attack: T1059.001,T1562.001
  for: [pe, dll]
  all:
  - id: defender-exclusion-command-text
  - id: micro-behaviors/process/create/shell/lang::powershell-keyword
  - id: micro-behaviors/os/privilege/check::admin-sid-check
  unless:
  - id: metadata/signed/platform/
- id: dotnet-defender-kill-suite
  desc: .NET Defender suppression with process control
  crit: hostile
  conf: 0.99
  attack: T1562.001,T1562.006,T1057
  for: [pe, dll]
