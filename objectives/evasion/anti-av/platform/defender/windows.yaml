defaults:
  attack: T1562.001
  for:
  - pe
  - powershell
  - batch
  - vbs
  platforms:
  - windows
traits:
- id: defender-notification-disable-policy
  desc: Defender notification-disable policy reference
  crit: suspicious
  conf: 0.97
  for: [python, powershell, batch, vbs, javascript]
  if:
    type: text
    regex: '(?i)Defender Security Center\\\\Notifications.{0,80}DisableNotifications'
- id: dotnet-defender-service-suppression
  desc: .NET stops Defender services
  crit: suspicious
  conf: 0.97
  for: [pe, dll]
  if:
    type: text
    regex: '(?i)\b(StopDefenderServices|DisableDefenderRegistry)\b'
- id: dotnet-defender-tamper-suppression
  desc: .NET changes Defender tamper controls
  crit: suspicious
  conf: 0.97
  for: [pe, dll]
  if:
    type: text
    regex: '(?i)\b(DisableTamperProtection|BlockDefenderEtw)\b'
- id: dotnet-defender-process-suppression
  desc: .NET kills Defender processes
  crit: suspicious
  conf: 0.97
  for: [pe, dll]
  if:
    type: text
    exact: KillDefenderProcesses
- id: defender-preference-option-prefix
  desc: Defender Add-MpPreference option prefix
  crit: notable
  conf: 0.96
  for: [scripts, binaries, java]
  if:
    type: text
    regex: '(?i)\bAdd-MpPreference\b\s+-'
- id: defender-exclusion-option-text
  desc: Defender exclusion option
  crit: notable
  conf: 0.95
  for: [scripts, binaries]
  if:
    type: text
    regex: '(?i)\s+-(ExclusionPath|ExclusionProcess|ExclusionExtension)\b'
- id: defender-add-mppreference-hex
  desc: Hex encoded Defender exclusion cmdlet
  crit: suspicious
  conf: 0.95
  for: [data, pe, batch, powershell, javascript]
  if:
    type: text
    substr: "4164642d4d70507265666572656e6365"
- id: defender-exclusion-telegram-downloads
  desc: Telegram Desktop download path reference
  crit: component
  conf: 0.95
  if:
    type: text
    regex: (?i)(Downloads\\Telegram Desktop|Telegram Desktop)
- id: defender-programdata-stage-path
  desc: ProgramData staged payload directory reference
  crit: component
  conf: 0.88
  unless:
  - id: well-known/lib/crypto/openssl/
  if:
    type: text
    regex: (?i)(%ALLUSERSPROFILE%|C:\\ProgramData)(\\[A-Za-z0-9_. -]{3,96}){1,3}
- id: defender-add-mppreference-concat
  desc: Fragmented Add-MpPreference command
  crit: component
  conf: 0.95
  for:
  - powershell
  if:
    type: text
    substr: "'A'+'d'+'d'+'-M'+'p'+'P'+'r'"
- id: defender-exclusionpath-concat
  desc: Fragmented Defender exclusion path
  crit: component
  conf: 0.94
  for:
  - powershell
  if:
    type: text
    substr: "'-'+'E'+'x'+'c'+'l'+'u'+'s'+'i'"
- id: defender-exclusion-extension
  desc: Windows Defender extension exclusion
  crit: suspicious
  conf: 0.9
  for:
  - batch
  - powershell
  if:
    id: micro-behaviors/os/security/defender::defender-exclusion-extension-parameter
  unless:
  - id: metadata/build/ci/agent::ci-runner-windows-configuration-context
- id: defender-exclusion-process
  desc: Windows Defender process exclusion
  crit: suspicious
  conf: 0.9
  for:
  - batch
  - powershell
  - csharp
  - java
  unless:
  - id: well-known/app/ai/agent-runtime/aui-agent-builder/
  - id: well-known/tool/sysadmin/kubernetes/bootstrap::kubernetes-windows-gce-script
  - id: well-known/app/ai/media/comfy-test::generated-vm-template
  - id: well-known/tool/development/go-x-build::go-x-build-infra-context
  if:
    id: micro-behaviors/os/security/defender::defender-exclusion-process-parameter
# Excluding the entire user-profile tree (C:\Users) blinds Defender for every
# download, document, and roaming payload. Installers exclude a product folder,
# not the whole Users volume.
- id: defender-exclusion-users-root
  desc: Defender exclusion of the C:\Users profile root
  crit: suspicious
  conf: 0.96
  for: [batch, powershell, java, vbs, csharp]
  if:
    type: text
    regex: '(?i)-ExclusionPath\s+[''"]C:\\+Users[''"]'
- id: defender-exclusion-javaw-image
  desc: Defender process exclusion names javaw
  crit: notable
  conf: 0.94
  for: [batch, powershell, java, vbs, csharp]
  if:
    type: text
    regex: '(?i)-ExclusionProcess\s+[''"]javaw(\.exe)?[''"]'
- id: defender-disable-realtime
  desc: Disable Windows Defender realtime
  crit: suspicious
  conf: 0.95
  for:
  - batch
  - powershell
  if:
    type: text
    regex: Set-MpPreference\s+.{0,50}-DisableRealtimeMonitoring\s+\$?true
    case_insensitive: true
  unless:
  - id: well-known/app/ai/media/comfy-test::generated-vm-template
  - id: metadata/file/profile/metrics::powershell-no-parsed-call-sites
  - id: well-known/tool/development/go-x-build::go-x-build-infra-context
- id: defender-disable-realtime-reg
  desc: Defender realtime disabled by registry
  crit: suspicious
  conf: 0.95
  for:
  - batch
  - powershell
  if:
    type: text
    regex: 'reg\s+add.{0,120}DisableRealtimeMonitoring.{0,80}/d\s+1'
    case_insensitive: true
- id: defender-disable-antispyware-reg
  desc: Defender AntiSpyware disabled by registry
