# Apply to source recovered from encrypted Lua as well as readable variants.
# This is an attack profile, not a verdict on Prometheus or LuaJIT alone.
defaults:
  for: [lua]
  platforms: [windows]
  attack: T1562.001

traits:
  - id: lua-defender-excludes-exe-and-dll
    desc: Defender excludes executable and DLL extensions
    crit: suspicious
    conf: 0.99
    if:
      type: text
      regex: '(?i)-ExclusionExtension\s+\.exe\s*,\s*\.dll\b'

composite_rules:
  - id: obfuscated-lua-persistence-root-exclusions
    desc: Obfuscated Lua persists and broadly excludes payloads from Defender
    crit: hostile
    conf: 0.97
    all:
      - id: metadata/lang/encoding::lua-many-decimal-escaped-strings
      - id: defender-systemdrive-exclusion
      - id: lua-defender-excludes-exe-and-dll
      - id: micro-behaviors/os/autorun/scheduled::schtasks-create-cmd
      - id: micro-behaviors/process/create/shell/script-host::rundll32-command-text

  - id: obfuscated-lua-defender-exclusion
    desc: Obfuscated Lua script adds a Microsoft Defender exclusion
    crit: hostile
    conf: 0.99
    attack: T1059.004,T1562.001,T1027
    all:
      - id: lua-defender-excludes-exe-and-dll
    any:
      - id: metadata/lang/encoding::lua-many-decimal-escaped-strings
      - id: objectives/anti-static/obfuscation/obfuscator/lua-prometheus::lua-if-vm-branches
      - id: micro-behaviors/data/string/concat::lua-double-indexed-concat-loop
      - id: micro-behaviors/data/control-flow/return::lua-return-vararg-wrapper
