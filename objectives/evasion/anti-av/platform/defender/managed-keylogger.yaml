# The ransom hook/form-POST profile independently establishes key recording.
# Accept it alongside the existing recorder profiles; operation legs stay required.
defaults:
  platforms: [windows]
  for: [pe, dll]
  attack: T1562.001

composite_rules:
  # Exclusion commands also accompany standalone recorders without plugin
  # tasking. Either established attack context supplies admission.
  - id: managed-backdoor-or-keylogger-defender-exclusions
    desc: Managed backdoor or keylogger with Defender exclusions and hidden-launch setup
    crit: hostile
    conf: 0.97
    all:
      - id: micro-behaviors/os/security/defender::defender-exclusion-command-reference
      - id: micro-behaviors/process/create/hidden::dotnet-hidden-process-launch-setup
    any:
      - id: objectives/command-and-control/backdoor/dispatch/module::managed-plugin-tasking-backdoor
      - id: objectives/collection/keylog/hook::dotnet-hook-keylog-recording
      - id: objectives/collection/keylog/hook::managed-low-level-hook-file-keylogger
      - id: objectives/exfiltration/stealer/input::managed-ransom-hook-keylog-form-post

  # Disabling Defender alone can be an administrator's action. Keystroke
  # recording supplies attack admission. This does not assert elevation or
  # successful command execution under the victim's current privileges.
  # The cmdlet already identifies PowerShell semantics. Do not additionally
  # require a suffix or options in the launcher string: Process.Start can
  # receive "powershell" and its arguments as separate strings.
  - id: managed-keylogger-defender-disable-command
    desc: Managed keylogger with Defender-disable command and hidden-launch setup
    crit: hostile
    conf: 0.97
    all:
      - id: micro-behaviors/os/security/defender::defender-disable-realtime
      - id: micro-behaviors/process/create/hidden::dotnet-hidden-process-launch-setup

    any:
      - id: objectives/collection/keylog/hook::dotnet-hook-keylog-recording
      - id: objectives/collection/keylog/hook::managed-low-level-hook-file-keylogger
      - id: objectives/exfiltration/stealer/input::managed-ransom-hook-keylog-form-post
