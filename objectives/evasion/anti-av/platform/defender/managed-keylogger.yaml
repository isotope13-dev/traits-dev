defaults:
  platforms: [windows]
  for: [pe, dll]
  attack: T1562.001

composite_rules:
  # Disabling Defender alone can be an administrator's action. Keystroke
  # recording supplies attack admission. This does not assert elevation or
  # successful command execution under the victim's current privileges.
  - id: managed-keylogger-defender-disable-command
    desc: Managed keylogger with Defender-disable command and hidden-launch setup
    crit: hostile
    conf: 0.97
    all:
      - id: micro-behaviors/os/security/defender::defender-disable-realtime
      - id: micro-behaviors/fs/path/application/executable::powershell-executable-token
      - id: micro-behaviors/process/create/hidden::dotnet-hidden-process-launch-setup

    any:
      - id: objectives/collection/keylog/hook::dotnet-hook-keylog-recording
      - id: objectives/collection/keylog/hook::managed-low-level-hook-file-keylogger
