defaults:
  platforms: [windows]
  for: [class, java_class]
  attack: T1562.001

composite_rules:
  - id: jvm-payload-loader-defender-exclusion
    desc: JVM payload loader adds a Defender exclusion
    crit: hostile
    conf: 0.99
    all:
      - id: objectives/execution/payload/module-load::jvm-downloads-and-runs-pe-in-memory
      - id: micro-behaviors/os/security/defender::jvm-defender-exclusion-method
      - id: micro-behaviors/os/security/defender::jvm-defender-exclusion-state-check
