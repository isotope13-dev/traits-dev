  - macos
  for:
  - scripts
  - source
  - macho
composite_rules:
- id: download-passworded-archive-quarantine-removal
  desc: Downloaded password archive and quarantine removal
  crit: hostile
  conf: 0.97
  for:
  - shell
  attack: T1553.001
