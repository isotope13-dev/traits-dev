defaults:
  platforms:
  - macos
  for:
  - scripts
  - binaries
  attack: T1553.001
traits:
- id: macos-add-trusted-cert
  desc: macOS trusted certificate command
  crit: notable
  conf: 0.95
  attack: T1553.004
  for:
  - scripts
  if:
    id: micro-behaviors/crypto/certificate/install::security-add-trusted-cert
  unless:
  - type: text
    substr: Caddy Local CA Trust
  - id: micro-behaviors/crypto/certificate/install::ca-certificates-path
  - id: micro-behaviors/crypto/certificate/install::update-ca-certificates
- id: curl-xattr-chmod-chain
  desc: curl+xattr+chmod execution chain
  crit: suspicious
  conf: 0.95
  for:
  - shell
  if:
    type: text
    regex: curl.{0,100}xattr.{0,100}chmod.{0,100}\./
composite_rules:
- id: staged-app-xattr-clear
  for:
  - macho
  - shell
  desc: Clears attributes from a downloaded macOS app stage
  crit: suspicious
  conf: 0.95
  all:
  - id: micro-behaviors/fs/attributes/xattr::xattr-clear
  - id: objectives/command-and-control/dropper/delivery/download::macos-zip-app-download-staging
- id: dropper-gatekeeper-bypass
  desc: Download and execute with Gatekeeper bypass (hostile)
  crit: hostile
  conf: 0.95
  for:
  - shell
  all:
  - id: micro-behaviors/communications/http/curl::curl-command-url-or-option
  - id: micro-behaviors/fs/attributes/xattr::xattr-clear
  - id: micro-behaviors/fs/chmod/executable/mode::shell-plus-x
  - id: micro-behaviors/process/create/local-exec::execute-dot-slash-literal
  unless:
  # A CI job fetches its build toolchain, strips attributes and runs it on a
  # throwaway runner. curl never sets com.apple.quarantine, so there is no
  # Gatekeeper state to bypass, and the workflow is committed, reviewable code.
  - id: metadata/build/ci/github-actions::workflow-definition-path
- id: downloaded-app-adhoc-resign-launch
  desc: Ad-hoc re-signs a downloaded app then launches it from temp (hostile)
  crit: hostile
  conf: 0.95
  attack: T1553.001,T1204.002
  for:
  - shell
  all:
  - id: micro-behaviors/os/security/gatekeeper::codesign-ad-hoc-signing
  - id: micro-behaviors/communications/http/download/curl::curl-output-file
  any:
  - id: micro-behaviors/process/create/shellexec::open-app
  - id: micro-behaviors/data/archive/extract/tar::tar-extract-temp-destination
  - id: micro-behaviors/process/create/shell/tmp-exec::shell-tmp-execution
  needs: 1
  unless:
  - id: metadata/build/package/provenance::swift-app-bundle-code-sealing-context
  - id: well-known/tool/detection/stackrox::release-helper-context
