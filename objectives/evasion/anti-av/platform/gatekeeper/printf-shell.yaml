defaults:
  for: [shell]
  platforms: [macos]
composite_rules:
  - id: encoded-stager-clears-attributes
    desc: Encoded payload stager clears file attributes
    crit: hostile
    conf: 0.98
    attack: T1553.001
    all:
      - id: objectives/command-and-control/dropper/delivery/fetch-exec::printf-hidden-payload-execution
      - id: micro-behaviors/fs/attributes/xattr::printf-xattr-name
      - id: micro-behaviors/process/create/local-exec::variable-output-clear-mode-launch-chain
