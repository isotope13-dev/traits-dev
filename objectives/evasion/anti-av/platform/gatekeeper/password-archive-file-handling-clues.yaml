# Archive and macOS file-handling clues; no launch is required.
defaults:
  platforms:
  - macos
  for:
  - scripts
  - source
  - macho
composite_rules:
- id: passworded-archive-chmod-xattr
  for:
  - shell
  - python
  - javascript
  - ruby
  - php
  - lua
  - perl
  - applescript
  desc: Password archive extraction, chmod and xattr
  crit: suspicious
  conf: 0.97
  all:
  - id: micro-behaviors/data/archive/extract/password::cli-passworded-archive-extraction
  - id: micro-behaviors/fs/chmod/executable/evidence::executable-mode-evidence
  any:
  - id: micro-behaviors/fs/attributes/xattr::xattr-quarantine-remove
  - id: micro-behaviors/fs/attributes/xattr::xattr-clear
  - id: micro-behaviors/fs/attributes/xattr::xattr-recursive-quarantine-remove
- id: passworded-archive-download-adhoc-sign
  desc: Password archive download and ad-hoc signing
  crit: suspicious
  conf: 0.98
  for:
  - shell
  all:
  - id: micro-behaviors/data/archive/extract/password::cli-passworded-archive-extraction
  - id: micro-behaviors/crypto/sign::codesign-force-adhoc
  - id: micro-behaviors/fs/chmod/executable/evidence::executable-mode-evidence
  - id: micro-behaviors/communications/http/download/cli/curl-wget::curl-wget-command
  any:
  - id: objectives/evasion/masquerade/path::tmp-apple-devtools-style-path
  - id: micro-behaviors/fs/path/temp::unix-temp
  near_lines: 40
