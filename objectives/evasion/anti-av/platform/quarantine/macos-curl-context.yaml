# Removing quarantine is the required evasion action. Curl and assessment
# clues do not show a downloaded file being launched.
defaults:
  platforms: [macos]
  for: [macho]

composite_rules:
  - id: macos-curl-quarantine-removal-profile
    desc: Mach-O curl and quarantine-removal clues
    crit: suspicious
    conf: 0.95
    attack: T1553.001
    all:
      - id: micro-behaviors/process/create/shell/spawn::curl-cli-binary
      - id: objectives/evasion/anti-av/platform/quarantine::programmatic-quarantine-removal
    any:
      - id: micro-behaviors/os/security/gatekeeper::spctl-assess
      - id: micro-behaviors/os/security/gatekeeper::codesign-verify
      - id: micro-behaviors/fs/path/temp::unix-temp
