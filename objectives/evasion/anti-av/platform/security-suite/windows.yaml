defaults:
  platforms: [windows]
  for: [pe, dll]

composite_rules:
  # Referencing an exclusion store is legitimate for security-management
  # software. Writing both Defender path/process exclusions and a competing
  # vendor's exclusion store from the same managed executable is the hostile
  # cross-product self-whitelisting pattern used by RAT installers.
  - id: dotnet-process-av-exclusion-write
    desc: .NET writes process paths to Defender and Malwarebytes exclusions
    crit: hostile
    conf: 0.99
    attack: T1562.001
    all:
      - id: metadata/binary/framework::dotnet-assembly
      - id: micro-behaviors/os/registry/manipulate::dotnet-registry-key-write
      - id: micro-behaviors/process/info/selfpath::dotnet-process-module-name
      - id: micro-behaviors/os/security/defender::defender-path-exclusion-registry-key
      - id: micro-behaviors/os/security/defender::defender-process-exclusion-registry-key
      - id: micro-behaviors/os/security/malwarebytes::malwarebytes-exclusion-registry-key
