defaults:
  platforms: [android]
  for: [android_apk, zip]
  crit: component
  conf: 0.9
  attack: "T1629"

traits:
  - id: accessibility-manager-service-reflection
    crit: notable
    desc: Accessibility manager service reflection
    if:
      type: text
      substr: "android.view.accessibility.IAccessibilityManager"

  - id: accessibility-service-uids-field
    crit: notable
    desc: Accessibility service UIDs field
    conf: 0.92
    if:
      type: text
      substr: "mAccessibilityServiceUids"

  - id: enabled-accessibility-services-provider
    crit: notable
    desc: Enabled accessibility services provider
    conf: 0.9
    if:
      type: text
      substr: "enabled_accessibility_services"

  - id: proc-uid-accessibility-path
    crit: notable
    desc: Proc UID accessibility path
    conf: 0.92
    if:
      type: text
      substr: "/proc/uid_"

composite_rules:
  - id: android-accessibility-state-evasion
    desc: Android accessibility state evasion
    crit: hostile
    conf: 0.98
    all:
      - id: accessibility-manager-service-reflection
      - id: accessibility-service-uids-field
      - id: enabled-accessibility-services-provider
    any:
      - id: proc-uid-accessibility-path
      - id: micro-behaviors/hardware/input/accessibility::android-accessibility-service-config

  # A YAHFA hook is armed against the enabled-services query while the
  # same file reads that list: the hook can return an empty list so the
  # controlling accessibility service stays invisible to the app's own
  # checks. Source-level counterpart to the dex-level state evasion
  # above, for patched apps that blind the check from inside.
  - id: hooked-accessibility-service-list-hide
    desc: Hook hides the enabled accessibility service list
    crit: hostile
    conf: 0.97
    for: [java, kotlin]
    all:
      - id: micro-behaviors/process/hook/keywords::yahfa-hooks-accessibility-list
      - id: micro-behaviors/hardware/input/accessibility::android-enabled-accessibility-service-list-query
    near_bytes: 4096
