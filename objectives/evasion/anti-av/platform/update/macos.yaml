# macOS security-update and telemetry impairment.
#
# These match the security effect, not a campaign-specific preference domain
# or process name.  A single update opt-out is suspicious; the composite adds
# a second defense-impairment action before escalating to hostile.
defaults:
  platforms: [macos]
  for: [scripts, binaries]
  attack: T1562.001
  mbc: F0004

traits:
  - id: macos-software-update-preferences
    desc: macOS software update preference path
    crit: notable
    conf: 0.95
    if:
      type: text
      substr: com.apple.SoftwareUpdate.plist

  - id: macos-config-data-update-disabled
    desc: Disables macOS configuration-data updates
    crit: suspicious
    conf: 0.98
    if:
      type: text
      regex: '(?i)\bConfigDataInstall\s+-bool\s+false\b'

  - id: macos-rapid-response-update-disabled
    desc: Disables macOS rapid security responses
    crit: suspicious
    conf: 0.98
    if:
      type: text
      regex: '(?i)\bAllowRapidSecurityResponses\s+-bool\s+false\b'

  - id: macos-cloud-telemetry-termination
    desc: Terminates macOS cloud telemetry service
    crit: suspicious
    conf: 0.96
    if:
      type: text
      regex: '(?i)\b(killall|pkill)\s+CloudTelemetryService\b'

  - id: xprotect-signature-database-reference
    desc: References the macOS XProtect signature database
    crit: suspicious
    conf: 0.96
    platforms: [unix]
    for: [perl]
    if:
      type: text
      substr: XPdb

  - id: xprotect-signature-database-lock
    desc: Locks the macOS XProtect signature database
    crit: suspicious
    conf: 0.96
    platforms: [unix]
    for: [perl]
    if:
      type: text
      regex: '\bXPdb\b[\s\S]{0,240}\bflock\b|\bflock\b[\s\S]{0,240}\bXPdb\b'

composite_rules:
  - id: macos-security-update-channel-disabled
    desc: Disables macOS software update channels
    crit: suspicious
    conf: 0.98
    near_bytes: 320
    all:
      - id: micro-behaviors/fs/config/preferences::defaults-write-command
      - id: macos-software-update-preferences
    any:
      - id: macos-config-data-update-disabled
      - id: macos-rapid-response-update-disabled

  - id: macos-security-defense-impairment
    desc: Disables macOS updates and telemetry
    crit: hostile
    conf: 0.99
    near_bytes: 1200
    all:
      - id: macos-security-update-channel-disabled
    any:
      - id: macos-cloud-telemetry-termination
      - id: micro-behaviors/os/security/policy::tccutil-reset-appleevents-command

  - id: xprotect-signature-update-block
    desc: Holds the XProtect signature database open to block updates
    crit: hostile
    conf: 0.99
    platforms: [unix]
    for: [perl]
    near_bytes: 600
    all:
      - id: xprotect-signature-database-reference
      - id: xprotect-signature-database-lock
      - id: micro-behaviors/fs/lock/flock::flock-exclusive-blocking
