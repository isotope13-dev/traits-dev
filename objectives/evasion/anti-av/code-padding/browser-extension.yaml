# Browser extensions padded with tens of megabytes of media so that the
# shipped bundle dwarfs the code inside it.
#
# Store review pipelines, corporate CRX scanners, and ML classifiers all
# have per-artifact size ceilings; an extension that carries a 60 MB video
# alongside 10 KB of JavaScript sails past the ones that give up early and
# dilutes the code-derived features of the ones that don't. The payload is
# genuinely a video — that is the point. Nothing about a new-tab wallpaper or
# promo page needs to ship at that size when the same asset streams from the
# publisher's own CDN, which the extension already contacts.
#
# Gated on the promo/new-tab lifecycle so ordinary large extensions (offline
# language models, bundled runtimes, media editors) do not match: the shape
# being described is "trivial monetized extension, enormous artifact".
defaults:
  platforms: [unix, windows]
  for: [crx, xpi, zip]
  attack: T1027
  mbc: F0001

composite_rules:
  - id: oversized-promo-extension-bundle
    desc: Promo new-tab extension padded to tens of MB
    crit: suspicious
    conf: 0.9
    size_min: 20000000
    scope: archive
    all:
      - id: metadata/permission/manifest::chrome-newtab-override
      - id: micro-behaviors/communications/http/url/query::utm-source-medium-campaign-url
      - id: micro-behaviors/browser-extension/lifecycle::runtime-set-uninstall-url
