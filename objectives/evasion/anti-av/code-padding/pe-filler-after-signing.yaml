# A signed PE whose signature no longer matches the image and whose overlay is
# megabytes of uniform filler.  The filler is bytes the loader never reads; it
# lifts the file past scanner and sandbox upload limits, and because it sits
# inside the hashed range it breaks the Authenticode digest while the copied
# certificate keeps the file looking signed.
defaults:
  platforms: [windows]
  for: [pe, dll]
  attack: T1027.001,T1553.002
  mbc: E1027.001

composite_rules:
  - id: signed-pe-filler-padded-after-signing
    desc: Signed PE padded with filler; signature digest mismatch
    crit: hostile
    conf: 0.95
    all:
      - id: metadata/binary/layout/overlay::large-near-zero-entropy-overlay
      - id: metadata/binary/layout/checksum::cert-table-present
      - id: metadata/signed/certificate/signature::pe-signature-digest-mismatch
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/installer/family/
