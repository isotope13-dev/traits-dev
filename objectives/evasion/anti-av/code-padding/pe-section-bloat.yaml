# Scanner-limit padding must occupy bytes in the file that the loader does not
# need. A dominant non-certificate overlay provides that evidence directly.
# Do not use `pe.inflated_sections` here: that value records sections whose
# virtual size exceeds their raw size, the ordinary zero-initialized-data
# geometry used by large native applications, and does not inflate disk size.
defaults:
  platforms: [windows]
  for: [pe, dll]
  attack: T1027.001
  mbc: E1027.001

composite_rules:
  # Appending junk outside the mapped image clears scanner size caps whether
  # the program was built by Go, Rust, MSVC, or a .NET packer. Keyed on the
  # layout rather than any toolchain:
  #
  #   * over 50 MB, so it is past the caps that make padding worth doing;
  #   * over ninety percent of the file is overlay — data outside every
  #     mapped section, which the loader never reads;
  #   * that overlay is not the signature (`signed-pe-large-noncertificate-
  #     overlay`), so it is not a fat certificate chain or a timestamp;
  #   * the largest real section is under a tenth of the file, so the actual
  #     program is a rounding error next to its padding; and
  #   * the certificate is self-issued, which grants no trust on Windows and
  #     exists only to answer "is it signed?" and to change the file hash on
  #     demand.
  #
  # Installers legitimately carry enormous overlays and are legitimately
  # signed, so the recognised installer families are excluded — but a real
  # installer's certificate chains to a CA, and its overlay is the payload it
  # exists to deliver, not filler.
  - id: overlay-padded-self-signed-massive-binary
    desc: Massive self-signed PE is mostly overlay padding
    crit: hostile
    conf: 0.95
    attack: T1027.001,T1553.002
    size_min: 50000000
    all:
      # `size_min` above already carries the >50 MB half of massive-executable,
      # so that atom is not repeated here.
      - id: metadata/binary/layout::overlay-over-90pct
      - id: metadata/binary/anomaly/signing::signed-pe-large-noncertificate-overlay
      - id: metadata/binary/metrics/structural::pe-largest-section-under-ten-percent
    any:
      - id: metadata/signed/certificate/identity::pe-cert-leaf-self-issued
      - id: metadata/signed/certificate/identity::pe-cert-leaf-self-issued
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/installer/family/
      - id: metadata/binary/installer/script/
      - id: metadata/binary/installer/sfx/
      - id: well-known/tool/
