defaults:
  platforms: [windows]
  for: [pe]
  attack: T1027.001,T1036.008

composite_rules:
  - id: massive-padded-hidden-media-sfx
    desc: Hidden media-script SFX is inflated with massive near-zero-entropy overlay
    crit: hostile
    conf: 0.98
    size_min: 104857600
    scope: file
    all:
      - id: metadata/binary/layout/overlay::large-near-zero-entropy-overlay
      - id: metadata/binary/layout/overlay::overlay-dominates-80pct
      - id: objectives/command-and-control/dropper/delivery/sfx::sfx-runprogram-directive
      - id: micro-behaviors/process/create/hidden::sfx-hidcon-prefix
      - id: objectives/command-and-control/dropper/delivery/sfx::sfx-hidden-cmd-stdin
      - id: objectives/command-and-control/dropper/delivery/sfx::sfx-video-extension-stdin
    unless:
      - id: metadata/signed/platform/
      - id: metadata/signed/certificate/signature::pe-authenticode-digest-matches
