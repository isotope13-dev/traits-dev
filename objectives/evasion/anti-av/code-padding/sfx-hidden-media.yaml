defaults:
  platforms: [windows]
  for: [pe]
  attack: T1027.001,T1036.008

composite_rules:
  - id: massive-padded-hidden-media-sfx
    desc: Hidden media-script SFX is inflated with massive near-zero-entropy overlay
    crit: hostile
    conf: 0.98
    size_min: 104857600
    scope: file
    all:
      - id: metadata/binary/layout/overlay::large-near-zero-entropy-overlay
      - id: metadata/binary/layout/ratio::overlay-dominates-80pct
      - id: micro-behaviors/process/config/installer::sfx-runprogram-directive
      - id: micro-behaviors/process/config/window::sfx-hidcon-prefix
      - id: micro-behaviors/process/config/launch::sfx-hidden-cmd-stdin
      - id: micro-behaviors/fs/path/media::sfx-video-extension-stdin
    unless:
      - id: metadata/signature/verified/
