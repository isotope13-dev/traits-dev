# Scripts inflated with content that never runs. A dropper's real body is a
# few lines; padding it to tens or hundreds of kilobytes buys two things.
# Scanners with a per-file budget give up before reaching the payload, and a
# classifier reading token statistics sees a file dominated by dialog calls
# and whitespace rather than by the handful of statements that matter.
#
# Each atom describes one filler form and needs a high count, because the
# technique is defined by volume: one message box is a program talking to the
# user, forty identical ones are ballast.
defaults:
  platforms: [windows, unix]
  for: [scripts, documents]
  attack: T1027
  mbc: F0001

traits:
  - id: dense-message-box-padding
    desc: Script is filled with message-box calls
    crit: suspicious
    conf: 0.9
    count_min: 30
    per_kb_min: 0.25
    if:
      # A script cannot show thirty dialogs and still be a program someone
      # sits in front of. The calls are there to be counted, not run.
      type: text
      regex: '(?i)\bmsgbox\s*\('

  - id: empty-vb-statement-separator-padding
    desc: Runs of empty VB statement separators
    crit: suspicious
    conf: 0.88
    platforms: [windows]
    for: [vbs]
    count_min: 20
    # Only the VB family reads a bare colon as a statement separator, so the
    # padding reading holds only there: VBScript, HTAs, and Office macros.
    # Elsewhere a colon run is ordinary syntax -- a JavaScript bundle carrying
    # a jison lexer (`/^(?::::)/`) or minified object literals produced this
    # match on every large Electron app.
    for: [vbs, documents]
    if:
      # `:::: :::: ::::` -- VB's statement separator with no statements
      # between the colons. Syntactically legal, semantically nothing.  Other
      # languages commonly carry colon-delimited fixture data in strings, so
      # this syntax-specific signal is intentionally limited to VBScript.
      type: text
      regex: '(:[ \t]*){4,}'

  - id: whitespace-only-comment-padding
    desc: Comment lines holding only whitespace
    crit: suspicious
    conf: 0.88
    count_min: 20
    if:
      # `'` followed by nothing but tabs, repeated for hundreds of lines. The
      # cheapest way to make a 4 KB script arrive as a 1 MB one.
      type: text
      regex: "(?m)^[ \t]*'[ \t]{20,}$"
