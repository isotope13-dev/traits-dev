defaults:
  for: [pe]
  platforms: [windows]

composite_rules:
  # A normal updater replaces its image with a new version. These diagnostics
  # instead describe scheduled padding solely to change the current image's
  # hash, with a standby mutator so rotation survives the running-file lock.
  # Neither self-update nor a one-off hash-padding diagnostic suffices.
  - id: scheduled-self-image-hash-churn
    desc: Scheduled self-image padding with standby hash mutation
    crit: hostile
    conf: 0.98
    attack: T1027.001
    all:
      - id: micro-behaviors/fs/write/file/executable::self-hash-rotation-relaunch
      - id: micro-behaviors/fs/write/file/executable::scheduled-image-rotation-diagnostic
      - id: micro-behaviors/fs/write/file/executable::standby-image-mutation-command
