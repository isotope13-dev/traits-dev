defaults:
  platforms: [windows]
  for: [pe, dll]
  attack: T1027
traits:
  - id: punycode-idn-error-strings
    desc: Punycode/IDN parser error strings
    crit: component
    conf: 0.85
    size_max: 5242880
    if:
      type: text
      substr: PosOverflowNegOverflowZeroParseIntError
  - id: rust-stdio-error-enum-strings
    desc: Rust std::io::Error full enum strings
    crit: component
    conf: 0.85
    size_max: 5242880
    if:
      type: text
      substr: NotFoundPermissionDeniedConnectionRefusedConnectionReset
  - id: rust-fs-readdir-strings
    desc: Rust fs::read_dir error strings
    crit: component
    conf: 0.8
    size_max: 5242880
    if:
      type: text
      regex: \bread_dir\b|fs::ReadDir
  # --- Resource ballast (see the composite at the end of this file) ---
  #
  # A picture, not a payload: `.rsrc` holding most of the image at picture-like
  # entropy. The lower entropy bound matters as much as the upper one — a PE
  # whose headers fail to parse reports 0.00 for every section, and that must
  # not read as "low entropy".
  - id: low-entropy-dominant-resource-section
    desc: Large low-entropy PE resource section
    crit: component
    conf: 0.9
    size_min: 400000
    # Trait-level entropy bounds are file-wide, and file entropy is what
    # separates ballast from an ordinary self-extractor: a compressed payload
    # in .rsrc drives the whole image high, a bitmap leaves it low.
    entropy_max: 5.0
    if:
      type: section
      exact: .rsrc
      compare_to: total
      size_ratio_min: 0.65
      entropy_min: 0.5
      entropy_max: 3.5

  - id: small-code-section-in-large-pe
    desc: Small code section in large PE
    crit: component
    conf: 0.9
    size_min: 400000
    if:
      type: section
      exact: .text
      length_max: 200000


composite_rules:
  # Mixed detection-dilution corpus: long random strings inflate entropy while
  # a separate body of grammatical decoys makes the image look like a large
  # application. Requiring both populations, a large .rdata carrier, an
  # uncustomized manifest, and no signature excludes normal resource bundles.
  - id: mixed-string-corpus-detection-dilution
    desc: Unsigned template PE carries random and prose detection decoys
    crit: hostile
    conf: 0.96
    attack: T1027.001
    mbc: F0001
    all:
      - id: metadata/binary/metrics/structural::sentence-strings-1000-plus
      - id: metadata/binary/metrics/structural::high-entropy-strings-450-plus
      - id: metadata/binary/metrics/structural::average-string-length-200-plus
      - id: metadata/binary/section/entropy::large-elevated-entropy-rdata
      - id: metadata/binary/metrics/threshold::high-overall-entropy-70
      - id: metadata/build/manifest::pe-manifest-myapplication-template
      - id: metadata/binary/layout::pe-no-signature-record
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/installer/family/

  # Post-link detection dilution seen in adversarial PE variants: a stale
  # populated checksum shows that the linked image changed, while random mass
  # extends a discardable relocation section. Each geometric leg is neutral
  # alone; together they describe mutation rather than a normal reloc table.
  # Vendor identity (e.g. Bitvise VERSIONINFO) is not a suppressor here: these
  # legs already require an unsigned checksum-stale image, which genuine signed
  # vendor builds do not satisfy. Suppressing on brand metadata hides
  # trojanized hosts that keep the original version resource.
  - id: unsigned-pe-random-reloc-padding
    desc: Unsigned checksum-stale PE with random relocation padding
    crit: suspicious
    conf: 0.96
    all:
      - id: metadata/binary/section/metrics::large-reloc-section
      - id: metadata/binary/section/metrics::high-entropy-reloc-section
      - id: metadata/binary/layout::pe-checksum-mismatch
      - id: metadata/binary/layout::pe-no-signature-record
    unless:
      - id: metadata/binary/installer/family/
      - id: metadata/binary/installer/sfx/
      - id: objectives/anti-static/pack/detect::aspack-marker
      - id: objectives/anti-static/pack/detect::upx-marker
      - id: objectives/anti-static/pack/detect::themida-marker
      - id: objectives/anti-static/pack/detect::vmprotect-marker
      - id: objectives/anti-static/pack/detect::petite-marker

  # A random relocation trailer can be benign in a protector, while dense
  # generated arithmetic can be a standalone anti-disassembly layer. Their
  # combination in a checksum-stale unsigned image is post-link detection
  # dilution: both executable and discardable regions were deliberately
  # inflated after the vendor link step.
  - id: reloc-padding-with-generated-code-junk
    desc: Random reloc padding accompanies generated executable junk
    crit: hostile
    conf: 0.99
    attack: T1027.001
    mbc: F0001
    all:
      - id: unsigned-pe-random-reloc-padding
      - id: objectives/anti-static/obfuscation/instruction/junk::dense-generated-arithmetic-junk-x86

  # A single printable string spanning most of a native PE is not ordinary
  # application data when the same image uses runtime-derived branch targets.
  # This combination captures detection dilution without keying on the decoy
  # text or a sample-specific path.
  - id: opaque-loader-giant-string-padding
    desc: Opaque loader pads rdata with a file-dominating printable string
    crit: hostile
    conf: 0.99
    attack: T1027.001,T1027.002
    all:
      - id: metadata/binary/metrics/size::giant-string-blob-metric
      - id: metadata/binary/metrics/structural::average-string-length-200-plus
      - id: objectives/anti-static/obfuscation/payload/section::packed-loader-largest-section-dominates
      - id: metadata/binary/section/metrics::rdata-ratio-over-5x
      - id: micro-behaviors/data/control-flow/dispatch::rip-relative-opaque-jump-x64
      - id: metadata/binary/layout::pe-multiple-tls-callbacks
      - id: metadata/binary/layout::pe-no-signature-record
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/framework/
      - id: metadata/binary/installer/family/
      - id: well-known/tool/reverse-engineering/

  - id: ml-evasion-recognized-code-mass
    desc: Shellcode loader padded with unrelated recognized code paths
    crit: suspicious
    conf: 0.88
    size_max: 5242880
    all:
      - id: objectives/anti-static/obfuscation/imports::pe-walk-hash-resolver-x64
    needs: 2
    any:
      - id: punycode-idn-error-strings
      - id: rust-stdio-error-enum-strings
      - id: rust-fs-readdir-strings
    unless:
      - id: metadata/binary/framework::dotnet-metadata
      - id: metadata/binary/framework/
  # Brand-agnostic SilverFox/Winos dropper shape: a >16MB PE whose writable .data
  # is >=95% of the file at low entropy (NUL size-inflation to defeat size-capped
  # sandboxes) AND is stuffed with 50k+ ripped decoy strings to read as a complex
  # benign app. The two techniques are independent, so requiring both stays tight.
  - id: size-inflated-decoy-stuffed-pe
    desc: Size-inflated PE contains a very high decoy-string count
    crit: hostile
    conf: 0.92
    for: [pe]
    all:
      - id: objectives/anti-static/obfuscation/payload/section::low-entropy-data-padding-geometry
      - id: metadata/binary/metrics/structural::very-high-string-count
    unless:
      - id: metadata/signed/platform/
  # Go programs do not place nearly the entire image in one low-entropy writable
  # .data section. A valid Go module record in that geometry, coupled with a
  # post-link checksum mismatch, is copied code corpus used as detection ballast.
  - id: size-inflated-pe-with-go-build-decoy
    desc: Size-inflated PE carries copied Go build metadata as decoy ballast
    crit: hostile
    conf: 0.97
    attack: T1027.001
    for: [pe]
    all:
      - id: objectives/anti-static/obfuscation/payload/section::low-entropy-data-padding-geometry
      - id: metadata/lang/compiler/systems::go-module-path
      - id: metadata/binary/layout::pe-checksum-mismatch
    unless:
      - id: metadata/signed/platform/
  # The same size-inflating geometry can be paired with file-level entropy
  # windows. The padding legs observe the sparse carrier while the peak-region
  # measurements establish that a substantial dense byte range sits inside it;
  # they do not claim whether those bytes are compressed or encrypted.
  - id: size-inflated-data-with-dense-region
    desc: Size-inflated PE data surrounds a dense byte region
    crit: hostile
    conf: 0.95
    for: [pe]
    all:
      - id: objectives/anti-static/obfuscation/payload/section::low-entropy-data-padding-geometry
      - id: metadata/file/metrics::peak-region-cipher-entropy
      - id: metadata/binary/metrics/threshold::low-overall-entropy-binary
      - id: metadata/file/metrics::concealed-payload-mass-8k
    unless:
      - id: metadata/signed/platform/
  - id: dominant-high-entropy-overlay-before-7z-payload
    desc: Dominant high-entropy overlay precedes a late 7-Zip payload
    crit: suspicious
    conf: 0.97
    for: [pe]
    all:
      - id: metadata/binary/layout::large-overlay-1mb
      - id: metadata/binary/layout::high-entropy-overlay
      - id: metadata/binary/layout::overlay-over-90pct
      - id: micro-behaviors/data/embedded/payload/archive::late-embedded-7z-archive

  # Detection-dilution padding: the file is inflated with tens of thousands of
  # generated natural-language sentence strings (dictionary-word filler) so its
  # string profile reads as a large benign app and it exceeds size-capped
  # sandbox/AV scanners. Distinct from the null/overlay padding above — here the
  # padding IS the string corpus (sentence ratio ~1.0), which is why it slips a
  # raw string-count check. Suspicious rather than hostile because a genuine
  # text/localization/NLP data blob can also be sentence-dominant.
  - id: sentence-string-detection-dilution
    desc: PE bloated with natural-language sentence filler to dilute detection
    crit: suspicious
    conf: 0.9
    all:
      - id: metadata/binary/metrics/structural::sentence-string-dominant
      - id: metadata/binary/metrics/structural::extreme-string-count
    unless:
      - id: metadata/signed/platform/

  # Compact native loaders sometimes surround a small amount of real loader
  # logic with generated grammatical sentences and opaque arithmetic. The
  # loader objective proves the execution behavior; the sentence metrics and
  # sentence density distinguishes this evasion layer from normal PE loaders
  # and language runtimes with help or diagnostic text.
  - id: sentence-padded-manual-image-loader
    desc: Manual PE loader with sentence decoys
    crit: hostile
    conf: 0.99
    all:
      - id: objectives/evasion/process/loader::x86-file-backed-manual-image-loader
      - id: metadata/binary/metrics/threshold::rich-sentence-strings-20pct
      - id: metadata/binary/metrics/structural::sentence-strings-20-plus
    unless:
      - id: metadata/signed/platform/

  # The high-entropy counterpart of the null-padding rules above. A runtime
  # packer stub is a complete self-contained image — it emits no overlay — and
  # its own sections are compressed, which is what the code-entropy and paired
  # RWX-section legs establish. Bolting a multi-megabyte trailer of cipher-grade
  # bytes onto one leaves a file that is >90% appended cargo: it re-hashes the
  # sample on every build and pushes the artifact past the file-size ceiling AV
  # and sandbox scanners apply. Installers and self-extractors also carry huge
  # overlays, but their stub code is not compressed and they do not ship paired
  # writable-executable sections, so they never reach all four legs; signed and
  # installer-framework images are excluded outright.
  - id: packed-stub-multi-megabyte-random-trailer
    desc: Packed stub carries a multi-megabyte maximum-entropy trailer
    crit: hostile
    conf: 0.95
    attack: T1027.001
    mbc: F0001
    for: [pe]
    all:
      - id: metadata/binary/layout::large-overlay-1mb
      - id: metadata/binary/layout::high-entropy-overlay
      - id: metadata/binary/layout::overlay-over-90pct
      - id: metadata/binary/metrics/structural::pe-code-entropy-78
      - id: metadata/binary/section/metrics::pe-multiple-executable-writable-sections
    unless:
      - id: metadata/signed/platform/
      - id: metadata/signed/certificate/identity/
      - id: metadata/binary/installer/family/
      - id: metadata/binary/installer/sfx/

  # The executable image already contains the complete command surface. A
  # dominant maximum-entropy trailer on that image is therefore file-size and
  # hash dilution, not evidence that the trailer is an encrypted payload.
  - id: native-rat-random-overlay-padding
    desc: Native RAT carries file-dominating random overlay padding
    crit: hostile
    conf: 0.99
    attack: T1027.001
    mbc: F0001
    for: [pe]
    all:
      - id: objectives/command-and-control/backdoor/binary::native-profile-file-control-rat
      - id: metadata/binary/layout::large-overlay-1mb
      - id: metadata/binary/layout::large-high-entropy-overlay
      - id: metadata/binary/layout::overlay-over-90pct
      - id: metadata/binary/layout::pe-no-signature-record
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/installer/

  # Detection dilution by bulk: a Go image whose build metadata was stripped of
  # any real module identity (both the module path and the build path are
  # single random tokens, the shape mass-produced loader builders leave) that
  # additionally drags a multi-megabyte overlay containing a pile of unrelated
  # executables. The overlay contributes nothing the program declares and
  # exists to move the file's size, entropy and import profile away from the
  # small stub a classifier expects. Genuine Go self-extractors name their
  # module.
  - id: anonymized-go-image-padded-with-foreign-executables
    desc: Anonymized Go PE padded with an overlay of unrelated executables
    crit: hostile
    conf: 0.95
    attack: T1027.001
    for: [pe]
    all:
      - id: metadata/lang/compiler/systems::go-opaque-module-path
      - id: metadata/lang/compiler/systems::go-opaque-build-path
      - id: metadata/binary/layout::large-overlay-1mb
      - id: metadata/binary/layout::many-pe-embedded
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/installer/family/

  # Resource bloat: a PE whose .rsrc holds most of the file as low-entropy
  # bitmap/media while the actual code is a stub. Uploading a 1 MB image that
  # is 90% picture pushes the sample past the size ceilings of sandbox
  # submission portals, mail gateways, and inline scanners, and dilutes every
  # byte-histogram and section-statistics feature a classifier computes over
  # the whole file. Real resource-heavy applications carry many resources and
  # a proportionate amount of code; this shape is a stub plus ballast.
  - id: low-entropy-resource-ballast
    desc: Unsigned PE padded with a large low-entropy resource
    crit: suspicious
    conf: 0.88
    all:
      - id: low-entropy-dominant-resource-section
      - id: small-code-section-in-large-pe
      # Geometry alone does not separate ballast from a skinned UI component:
      # shell extensions, launchers and about-boxes are routinely a small
      # .text beside a megabyte of bitmaps, and ship code-signed. Ballast is a
      # scanner-evasion trick for images that cannot be signed, so require the
      # absence of a signature -- the same leg the other padding rules here use.
      - id: metadata/binary/layout::pe-no-signature-record
    unless:
      # Installer frameworks legitimately carry their whole payload in .rsrc.
      - id: metadata/binary/installer/
      - id: metadata/signed/platform/
