# AMSI bypass mechanisms; CoreCLR exclusions prevent matching runtime provider code.
defaults:
  attack: T1562.001
  for:
  - pe
  - powershell
  - batch
  - vbs
  platforms:
  - windows
composite_rules:
- id: amsi-bypass
  desc: AMSI bypass detected
  crit: suspicious
  conf: 0.9
  for:
  - batch
  - powershell
  any:
  - id: objectives/evasion/anti-av/amsi::amsi-bypass-reflection
  - id: objectives/evasion/anti-av/amsi::amsi-bypass-reflection-loop
  - id: objectives/evasion/anti-av/amsi::amsi-bypass-amsiutils-setvalue
  - id: objectives/evasion/anti-av/amsi::amsi-bypass-init-flag
  - id: objectives/evasion/anti-av/amsi::amsi-memory-patch-bypass
  - id: objectives/evasion/anti-av/amsi::amsi-memory-patch-bypass-encoded
  - id: objectives/evasion/anti-av/amsi::amsi-open-session-memory-patch
- id: amsi-memory-patch-hostile
  for:
  - pe
  desc: AMSI scan buffer memory patch (hostile intent)
  crit: hostile
  conf: 0.98
  scope: leaf
  all:
  - id: metadata/binary/instruction/sequence::invalidarg-return-stub
  any:
  - id: micro-behaviors/os/security/amsi::amsi-library-reference
  - id: micro-behaviors/os/security/amsi::amsi-scan-buffer-reference
  unless:
  - id: metadata/binary/framework::dotnet-singlefilehost-runtime
  - id: metadata/binary/framework::dotnet-selfcontained-bundle
  - id: well-known/lib/runtime/managed/dotnet-runtime::coreclr-runtime-context
- id: amsi-x64-memory-patch-hostile
  for:
  - pe
  desc: AMSI x64 scan buffer memory patch
  crit: hostile
  conf: 0.98
  scope: leaf
  all:
  - id: micro-behaviors/mem/write/arbitrary::x64-write-invalidarg-return
  any:
  - id: micro-behaviors/os/security/amsi::amsi-library-reference
  - id: micro-behaviors/os/security/amsi::amsi-scan-buffer-reference
  unless:
  - id: metadata/binary/framework::dotnet-singlefilehost-runtime
  - id: metadata/binary/framework::dotnet-selfcontained-bundle
  - id: well-known/lib/runtime/managed/dotnet-runtime::coreclr-runtime-context
- id: managed-amsi-memory-patch-hostile
  for:
  - pe
  desc: Managed PE patches AMSI in writable memory
  crit: hostile
  conf: 0.99
  scope: leaf
  all:
  - id: metadata/binary/framework::dotnet-assembly
  - id: micro-behaviors/mem/protect/modify::virtual-protect-text-pe
  - id: micro-behaviors/os/api-resolution/dynamic::get-proc-address-resolved-name
  any:
  - id: micro-behaviors/os/security/amsi::dll-reference
  - id: micro-behaviors/os/security/amsi::scan-buffer-api
  - id: micro-behaviors/os/security/amsi::open-session-api
  unless:
  - id: metadata/signed/platform/
  - id: well-known/lib/runtime/managed/dotnet-runtime::coreclr-runtime-context
- id: amsi-patch-manual-api-resolution
  desc: AMSI patch combined with concealed native API resolution
  crit: hostile
  conf: 0.99
  for:
  - pe
  all:
  - id: metadata/binary/instruction/sequence::invalidarg-return-stub
  - id: micro-behaviors/os/api-resolution/manual::peb-export-resolver-x64
- id: csharp-dinvoke-amsi-etw-patch
  desc: C# DInvoke AMSI ETW patch
  crit: hostile
  conf: 0.98
  for:
  - csharp
  all:
  - id: objectives/evasion/anti-av/amsi::csharp-amsi-scanbuffer-patch-map
  - id: objectives/evasion/anti-av/amsi::csharp-dinvoke-memory-patch
  - id: objectives/evasion/anti-av/amsi::csharp-nt-protect-virtualmemory-call
  - id: objectives/evasion/anti-av/amsi::csharp-nt-write-virtualmemory-call
  any:
  - id: micro-behaviors/os/security/amsi::dll-reference
  - id: micro-behaviors/os/security/policy::csharp-wldp-dll-reference
- id: amsi-memory-patch-bypass
  desc: AMSI scan buffer memory patch
  crit: suspicious
  conf: 0.97
  for:
  - powershell
  all:
  - id: micro-behaviors/os/security/amsi::dll-reference
  - id: objectives/evasion/anti-av/amsi::rtlmovememory-entrypoint
  - id: micro-behaviors/mem/protect/modify::powershell-virtualprotect-name
  - id: "micro-behaviors/mem/copy::powershell-movememory-name"
  - id: "micro-behaviors/mem/copy::marshal-copy"
  any:
  - id: micro-behaviors/os/security/amsi::scan-buffer-api
  - id: objectives/evasion/anti-av/amsi::amsi-scanbuffer-concat
- id: amsi-memory-patch-bypass-encoded
  desc: AMSI scan buffer patch in blob
  crit: suspicious
  conf: 0.98
  for:
  - powershell
  all:
  - id: objectives/evasion/anti-av/amsi::amsi-dll-reference-encoded
  - id: objectives/evasion/anti-av/amsi::rtlmovememory-entrypoint-encoded
  - id: micro-behaviors/mem/protect/modify::powershell-virtualprotect-name-encoded
  - id: "micro-behaviors/mem/copy::powershell-movememory-name-encoded"
  - id: "micro-behaviors/mem/copy::marshal-copy-encoded"
  any:
  - id: objectives/evasion/anti-av/amsi::amsi-bypass-init-scan-buffer-encoded
  - id: objectives/evasion/anti-av/amsi::amsi-scanbuffer-concat-encoded
- id: managed-amsi-handler-breakpoint-evasion
  desc: Managed AMSI evasion through a vectored breakpoint handler
  crit: hostile
  conf: 0.99
  for:
  - pe
  - dll
  all:
  - id: micro-behaviors/os/security/amsi::amsi-library-reference
  - id: micro-behaviors/os/security/amsi::amsi-scan-buffer-reference
  - id: micro-behaviors/os/exception/error-handling::vectored-exception-handler-api-reference
  - id: micro-behaviors/process/info/thread::thread-context-memory-field-setup
- id: amsi-bypass-in-memory-eval
  desc: AMSI bypass paired with dynamic in-memory execution
  crit: hostile
  conf: 0.98
  for:
  - powershell
  - batch
  all:
  - id: objectives/evasion/anti-av/amsi::amsi-bypass
  - id: objectives/execution/interpreter/eval/invoke::encoded-base64-decode-to-iex
