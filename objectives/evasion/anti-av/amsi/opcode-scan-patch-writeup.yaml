defaults:
  platforms: [windows]
  for: [powershell, markdown]
  attack: T1562.001
  mbc: E1562
traits:
  - id: amsi-je-to-jmp-patch-note
    desc: Notes patching amsi.dll JE to JMP
    crit: notable
    conf: 0.9
    # Walkthrough of the amsi.dll conditional-jump patch that skips scanning.
    if:
      type: text
      regex: (?is)patch.{0,40}first byte.{0,60}\bJE\b.{0,20}to.{0,10}\bJMP\b
  - id: amsi-disasm-opcode-pattern-note
    desc: amsi.dll disassembly with byte search pattern
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: (?is)\bje\s+amsi\.[0-9A-F]{8,16}.{0,600}0x74\s*,\s*['"]?\?
  - id: invoke-mimikatz-after-bypass-note
    desc: Notes running Invoke-Mimikatz after bypass
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: (?is)\b(can.?t|now we)\s+execute\s+.{0,3}Invoke-Mimikatz
composite_rules:
  - id: amsi-opcode-scan-patch-writeup
    desc: AMSI opcode-scan patch walkthrough enabling Invoke-Mimikatz
    crit: hostile
    conf: 0.9
    # Offensive tradecraft walkthrough: locate the amsi.dll jump by opcode
    # scan, patch it, then run Invoke-Mimikatz.
    needs: 3
    any:
      - id: amsi-je-to-jmp-patch-note
      - id: amsi-disasm-opcode-pattern-note
      - id: invoke-mimikatz-after-bypass-note
