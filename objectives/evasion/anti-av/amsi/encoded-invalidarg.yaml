defaults:
  for: [pyc, python, powershell, pe, dll, batch]
  platforms: [windows]
traits:
  - id: encoded-invalidarg-patch-byte-list
    desc: Encoded E_INVALIDARG return patch byte list
    crit: suspicious
    conf: 0.98
    if:
      type: encoded
      regex: '(?i)B8,.{0,5}57,.{0,5}00,.{0,5}07,.{0,5}80,.{0,5}C3'
  - id: encoded-fragmented-amsi-scanbuffer
    desc: Encoded fragmented AmsiScanBuffer name
    crit: notable
    conf: 0.99
    if:
      type: encoded
      substr: '"Am"+"s"+"iS"+"c"+"anBuff"+"e"+"r"'
composite_rules:
  - id: encoded-amsi-invalidarg-return-patch
    desc: Encoded AMSI scan target with E_INVALIDARG return patch
    crit: hostile
    conf: 0.99
    attack: T1562.001
    all:
      - id: encoded-invalidarg-patch-byte-list
      - id: encoded-fragmented-amsi-scanbuffer
