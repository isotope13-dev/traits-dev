defaults:
  platforms: [windows]
  for: [c, cpp]
composite_rules:
  - id: native-scan-buffer-clean-result-patch
    desc: Resolved AMSI target with clean-result patch
    crit: hostile
    conf: 0.98
    attack: T1562.001
    # Same-file patch evidence, including a resolved target used as an
    # argument. Does not assert that patching succeeded at runtime.
    all:
      - id: micro-behaviors/os/security/amsi::resolved-scan-buffer-argument
      - id: metadata/lang/source/literal::x86-clean-result-stub-array
      - id: micro-behaviors/mem/protect/modify::virtual-protect-source-call
      - id: micro-behaviors/mem/copy::native-memcpy-byte-copy
