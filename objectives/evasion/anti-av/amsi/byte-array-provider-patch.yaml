# Raw matching also covers UTF-16LE PowerShell inside Base64 disk residue.
# The API name is a byte-array representation of AmsiInitialize; the patch
# returns success without scanning. No function/variable or campaign name gates it.
defaults:
  platforms: [windows]
  for: [powershell, batch, vbs, data]
  attack: T1562.001
traits:
  - id: byte-array-amsi-return-zero-patch
    desc: Encoded AMSI target with return-zero patch
    crit: suspicious
    conf: 0.98
    if:
      type: yara
      source: |
        rule byte_array_amsi_return_zero_patch {
          strings:
            $target_plain = "0x41,0x6D,0x73,0x69,0x49,0x6E,0x69,0x74" ascii wide
            $target_b64 = "0x41,0x6D,0x73,0x69,0x49,0x6E,0x69,0x74" wide base64
            $patch_plain = "0xb8,0x0,0x00,0x00,0x00,0xC3" ascii wide
            $patch_b64 = "0xb8,0x0,0x00,0x00,0x00,0xC3" wide base64
            $copy_plain = "::Copy(" ascii wide
            $copy_b64 = "::Copy(" wide base64
          condition:
            any of ($target_*) and any of ($patch_*) and any of ($copy_*)
        }
