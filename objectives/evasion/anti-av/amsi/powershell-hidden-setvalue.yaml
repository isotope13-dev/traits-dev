# The AMSI bypass idiom is [Ref].Assembly.GetType(...).GetField(
# 'amsiInitFailed', ...).SetValue($null, $true). Obfuscators hide every name
# in it, leaving only the shape: a member resolved from a built string and
# invoked with ($null,$true). The shape alone is not proof, so it only counts
# beside heavy Remove/Insert string building, which ordinary scripts lack.
defaults:
  platforms: [windows]
  for: [powershell]
  attack: T1562.001,T1027.010
traits:
  - id: dynamic-member-call-null-true
    desc: Member call with null and true args
    crit: notable
    conf: 0.8
    if:
      type: text
      regex: '\)\(\$null,\s*\$true\)'
composite_rules:
  - id: obfuscated-powershell-null-true-setvalue
    desc: Hidden names ending in a null,true member call
    crit: hostile
    conf: 0.8
    all:
      - id: dynamic-member-call-null-true
      - id: objectives/anti-static/obfuscation/string/reconstruct::powershell-insert-remove-string-chain
    unless:
      - id: metadata/package/testing/
