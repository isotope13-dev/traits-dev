# WSH script turns AMSI off for Windows Script Host (AmsiEnable=0 under
# HKCU\Software\Microsoft\Windows Script\Settings) and relaunches itself
# through cscript -e:{JScript CLSID} so the new engine starts unscanned.
# The value name and the CLSID are both spelled as charcode lists.
defaults:
  platforms: [windows]
  for: [javascript, vbs, html]
  crit: hostile
  attack: T1562.001,T1059.007

composite_rules:
  - id: wsh-disables-amsi-and-relaunches
    desc: Script disables WSH AMSI scanning and relaunches under a fresh engine
    conf: 0.96
    all:
      - id: micro-behaviors/os/security/amsi::charcode-wsh-amsienable-name
      - id: micro-behaviors/os/security/amsi::wsh-regwrite-dword-call
      - id: micro-behaviors/os/security/amsi::charcode-jscript-engine-clsid
