composite_rules:
- platforms:
  - windows
  for:
  - pe
  - dll
  crit: suspicious
  conf: 0.98
  id: dotnet-amsi-etw-patch-name-profile
  desc: Managed AMSI, ETW and patch references
  all:
  - id: metadata/lang/compiler/managed::dotnet-assembly
  - id: micro-behaviors/os/security/amsi::dll-reference
  - id: micro-behaviors/os/telemetry/logging/etw::etw-event-write-str
  any:
  - id: metadata/lang/source/naming/function/security::dotnet-patch-amsi-name
  - id: micro-behaviors/mem/protect/modify/api-reference::virtual-protect-text-pe
