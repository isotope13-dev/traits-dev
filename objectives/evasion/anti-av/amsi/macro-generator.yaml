# Macro generators that ship an AMSI-bypass template: the Office
# trusted-location trick (SaveAs2 the document as a macro-enabled template into
# the user's Templates folder, then open a new document from it) so the VBA
# runs from a trusted location before AMSI inspection applies.
defaults:
  platforms: [windows]
  for: [oledoc, ooxml, python, javascript, ruby, php, perl, lua]
  attack: T1562.001

traits:
  - id: trusted-template-macroenabled-resave
    desc: Re-saves document as macro-enabled template
    crit: suspicious
    conf: 0.9
    if:
      type: text
      word: wdFormatXMLTemplateMacroEnabled

composite_rules:
  - id: macro-generator-amsi-bypass
    desc: Generates auto-open macro with trusted-location AMSI bypass
    crit: hostile
    conf: 0.96
    attack: T1562.001,T1204.002
    all:
      - id: micro-behaviors/process/create/macro/autoexec::auto-open-sub-decl
      - id: trusted-template-macroenabled-resave
