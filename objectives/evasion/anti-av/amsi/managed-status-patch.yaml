# Match the patch implementation even when its API target names are encrypted.
# The x86 cleanup counts correspond to the six-argument AMSI scan function
# and five-argument ETW writer; x64 and x86 error/zero stubs are stored together.
# Native protection, module addresses and delegate conversion corroborate an
# in-process patcher. A generic HRESULT return or CLR interop alone is insufficient.
defaults:
  platforms: [windows]
  for: [pe, dll]
composite_rules:
  - id: managed-cross-architecture-scan-status-patcher
    desc: Managed AMSI bypass using error-return stubs
    crit: hostile
    conf: 0.98
    attack: T1562.001
    all:
      - id: metadata/binary/framework::dotnet-assembly
      - id: metadata/binary/instruction::cross-architecture-invalidarg-return-stubs
      - id: micro-behaviors/mem/protect/modify::nt-protect-virtual-memory-name
      - id: micro-behaviors/os/api-resolution/dynamic::managed-module-base-address
      - id: micro-behaviors/os/api-resolution/dynamic::managed-function-pointer-delegate
