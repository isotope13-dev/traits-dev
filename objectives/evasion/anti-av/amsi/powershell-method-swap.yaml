# AmsiUtils.ScanContent method-handle swap: find the internal AmsiUtils type
# and its ScanContent method by name fragment, then overwrite the method's
# code pointer with that of a script-defined stub returning a clean result.
# AMSI then never scans subsequent script blocks. Unlike the amsiInitFailed
# and amsiContext variants, nothing is written to an AMSI field, so those
# rules miss it. Seen in the Vinci RAT stager (eSentire, 2026-11).
defaults:
  platforms: [windows]
  for: [powershell]
  attack: T1562.001
  mbc: F0004.005

traits:
  - id: scancontent-method-fragment
    desc: Names AmsiUtils.ScanContent by fragment
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '[''"*][A-Za-z]{0,4}canContent\b'

composite_rules:
  - id: amsi-scancontent-method-handle-swap
    desc: Overwrites AmsiUtils.ScanContent method pointer to blind AMSI
    crit: hostile
    conf: 0.97
    ref: https://www.esentire.com/blog/vinci-rat-lives-in-the-microsoft-store
    near_lines: 30
    all:
      - id: scancontent-method-fragment
      - id: micro-behaviors/metaprogramming/reflection/inspect/member::powershell-method-handle-value
    any:
      - id: micro-behaviors/mem/copy::marshal-copy-powershell
      - id: micro-behaviors/mem/copy::marshal-copy-via-type-variable
      - id: micro-behaviors/mem/copy::marshal-copy-via-string-type
      - id: micro-behaviors/mem/write/arbitrary::marshal-write-intptr
    unless:
      - id: metadata/package/documentation/security-exercise::technique-catalog-notes
