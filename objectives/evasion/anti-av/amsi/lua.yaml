defaults:
  platforms: [windows]
  for: [lua]
  crit: hostile
  conf: 0.98
  attack: T1562.001
traits:
  # Builders that decimal-escape every Lua string (\065\109...) defeat the
  # parsed-literal rules when the script is delivered under a non-Lua name
  # such as environment.ini. Text sees the escapes undecoded.
  - id: lua-escaped-amsi-scan-buffer-name
    desc: Lua source escapes the AmsiScanBuffer name
    crit: notable
    for: [text]
    if:
      type: text
      substr: '\065\109\115\105\083\099\097\110\066\117\102\102\101\114'
  - id: lua-escaped-nt-write-memory-name
    desc: Lua source escapes the NtWriteVirtualMemory name
    crit: notable
    for: [text]
    if:
      type: text
      substr: '\078\116\087\114\105\116\101\086\105\114\116\117\097\108\077\101\109\111\114\121'
  - id: lua-escaped-clr-dll-name
    desc: Lua source escapes the clr.dll name
    crit: notable
    for: [text]
    if:
      type: text
      substr: '\099\108\114\046\100\108\108'
composite_rules:
  # The required roles are independent. These descriptions deliberately state
  # co-occurrence: a native pointer's stores are bound in the atomic query,
  # but the target library/export is not data-flow bound to that pointer.
  - id: lua-amsi-return-zero-patch-cluster
    desc: AMSI loading with protected zero-return writes
    near_bytes: 1200
    all:
      - id: micro-behaviors/os/security/amsi::lua-load-amsi-module
      - id: micro-behaviors/os/security/amsi::lua-scan-buffer-name
      - id: micro-behaviors/mem/protect/modify/page::lua-page-protection-call
      - id: micro-behaviors/mem/write/arbitrary::lua-cast-pointer-zero-return-stores
  - id: lua-clr-amsi-memory-erasure-cluster
    desc: CLR AMSI names with memory-erasure routines
    near_bytes: 32768
    all:
      - id: micro-behaviors/fs/path/library::lua-clr-runtime-library-path
      - id: micro-behaviors/os/security/amsi::lua-scan-buffer-name
      - id: micro-behaviors/mem/compare::lua-rtl-compare-memory-name-argument
      - id: micro-behaviors/mem/write/arbitrary::lua-nt-write-memory-name-argument
      - id: micro-behaviors/mem/fill::lua-allocated-buffer-zero-fill
  - id: lua-escaped-clr-amsi-memory-erasure-cluster
    desc: Escaped Lua names CLR, AMSI scan and memory-write APIs
    for: [text]
    near_bytes: 32768
    all:
      - id: lua-escaped-clr-dll-name
      - id: lua-escaped-amsi-scan-buffer-name
      - id: lua-escaped-nt-write-memory-name
