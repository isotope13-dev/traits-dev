defaults:
  platforms: [windows]
  for: [lua]
  crit: hostile
  conf: 0.98
  attack: T1562.001
composite_rules:
  # The required roles are independent. These descriptions deliberately state
  # co-occurrence: a native pointer's stores are bound in the atomic query,
  # but the target library/export is not data-flow bound to that pointer.
  - id: lua-amsi-return-zero-patch-cluster
    desc: AMSI loading with protected zero-return writes
    near_bytes: 1200
    all:
      - id: micro-behaviors/os/security/amsi::lua-load-amsi-module
      - id: micro-behaviors/os/security/amsi::lua-scan-buffer-name
      - id: micro-behaviors/mem/protect/modify::lua-virtual-protect-call
      - id: micro-behaviors/mem/write/arbitrary::lua-cast-pointer-zero-return-stores
  - id: lua-clr-amsi-memory-erasure-cluster
    desc: CLR AMSI names with memory-erasure routines
    near_bytes: 32768
    all:
      - id: micro-behaviors/fs/path/library::lua-clr-runtime-library-path
      - id: micro-behaviors/os/security/amsi::lua-scan-buffer-name
      - id: micro-behaviors/mem/compare::lua-rtl-compare-memory-name-argument
      - id: micro-behaviors/mem/write/arbitrary::lua-nt-write-memory-name-argument
      - id: micro-behaviors/mem/fill::lua-allocated-buffer-zero-fill
