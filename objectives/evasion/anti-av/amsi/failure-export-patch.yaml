# The embedded script attempts to resolve a managed flag as a native export.
# This is hostile patch intent, not proof that the invalid script succeeds.
defaults:
  platforms: [windows]
  for: [powershell, pe]
  attack: T1562.001
traits:
  - id: failure-flag-export-lookup
    desc: Resolves AMSI failure flag as export
    crit: suspicious
    conf: 0.99
    if:
      type: text
      regex: 'GetProcAddress\s*\([^\r\n]{1,140}[''"]AmsiInitFailed[''"]\s*\)'
composite_rules:
  - id: failure-flag-invalidarg-patch-attempt
    desc: Attempts AMSI failure-flag patch with E_INVALIDARG stub
    crit: hostile
    conf: 0.99
    near_bytes: 1200
    all:
      - id: failure-flag-export-lookup
      - id: micro-behaviors/data/embedded/payload/patch-stubs::invalidarg-return-byte-array
      - id: micro-behaviors/mem/protect/modify/executable::powershell-virtualprotect-numeric-execute
      - id: micro-behaviors/mem/copy::marshal-copy-via-type-variable
