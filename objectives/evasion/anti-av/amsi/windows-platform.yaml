defaults:
  attack: T1562.001
  for:
  - pe
  - powershell
  - batch
  - vbs
  platforms:
  - windows
traits:
- id: windows-script-amsi-disable-registry
  desc: Disable Windows Script AMSI
  crit: suspicious
  conf: 0.98
  for:
  - batch
  - powershell
  - vbs
  - oledoc
  - ole
  if:
    type: text
    regex: Windows Script\\Settings.{0,120}AmsiEnable.{0,120}Value\s+0
    case_insensitive: true
- id: amsi-bypass-init-flag
  desc: AMSI initialization bypass
  crit: suspicious
  conf: 0.9
  for:
  - powershell
  - batch
  if:
    type: text
    word: amsiInitFailed
    case_insensitive: true
  unless:
  - id: metadata/file/extension/identity::markdown-file-basename
  - id: metadata/file/extension/identity::markdown-powershell-basename
- id: wldp-dll-reference-csharp
  desc: C# WLDP DLL reference
  crit: suspicious
  conf: 0.92
  for:
  - csharp
  if:
    type: text
    word: wldp.dll
    case_insensitive: true
  unless:
  # Roslyn's ExpressionEvaluator test tree references wldp.dll by name in
  # DkmExceptionCode.cs -- naming the DLL is not patching the policy.
  - id: metadata/package/testing/
  - id: "metadata/file/naming::test-directory-component"
- id: csharp-amsi-scanbuffer-patch-map
  desc: C# AMSI scan buffer patch map
  crit: suspicious
  conf: 0.95
  for:
  - csharp
  if:
    type: text
    regex: '"amsi\.dll"[\s\S]{0,180}"AmsiScanBuffer"[\s\S]{0,180}new\s+byte\[\]'
# Compiled-carrier twin: a .NET binary that string-tables both patch targets
# together is preparing the same impairment without C# source around it.
# Suspicious rather than hostile because AV/EDR products legitimately
# reference AmsiScanBuffer (they integrate with AMSI rather than patch it).
- id: amsi-dll-string-name
  desc: amsi.dll module name string
  crit: component
  conf: 0.85
  if:
    type: text
    substr: amsi.dll
- id: amsiscanbuffer-string-name
  desc: AmsiScanBuffer export name string
  crit: component
  conf: 0.85
  if:
    type: text
    substr: AmsiScanBuffer
- id: csharp-dinvoke-memory-patch
  desc: C# DInvoke memory patch
  crit: suspicious
  conf: 0.95
  for:
  - csharp
  if:
    type: text
    substr: DInvoke
- id: csharp-nt-protect-virtualmemory-call
  desc: C# NtProtectVirtualMemory call
  crit: notable
  conf: 0.95
  for:
  - csharp
  if:
    type: text
    word: NtProtectVirtualMemory
- id: csharp-nt-write-virtualmemory-call
  desc: C# NtWriteVirtualMemory call
  crit: notable
  conf: 0.95
  for:
  - csharp
  if:
    type: text
    word: NtWriteVirtualMemory
  unless:
  # The symbol records the API being used; this also sees the name sitting in
  # data. Standing down there keeps one use from counting twice.
  - id: objectives/evasion/process/injection/hollowing/runtime::csharp-nt-write-memory
  # The symbol records the API being used; this also sees the name sitting in
  # data. Standing down there keeps one use from counting twice.
  - id: micro-behaviors/process/inject/runtime/call::nt-write-virtual-memory-source
- id: amsi-dll-reference-encoded
  desc: AMSI DLL reference in decoded blob
  crit: suspicious
  conf: 0.94
  for:
  - powershell
  if:
    type: encoded
    substr: amsi.dll
    case_insensitive: true
- id: amsi-scanbuffer-concat
  desc: AmsiScanBuffer string concat
  crit: suspicious
  conf: 0.94
  for:
  - powershell
  if:
    type: text
    regex: '(?i)"Am"\s*\+\s*"si"\s*\+\s*"Scan"\s*\+\s*"Buffer"'
- id: amsi-scanbuffer-concat-encoded
  desc: AmsiScanBuffer concat in decoded blob
  crit: suspicious
  conf: 0.97
  for:
  - powershell
  if:
    type: encoded
    regex: '(?i)"Am"\s*\+\s*"si"\s*\+\s*"Scan"\s*\+\s*"Buffer"'
- id: rtlmovememory-entrypoint
  desc: RtlMoveMemory entry point
  crit: suspicious
  conf: 0.88
  for:
  - powershell
  if:
    type: text
    exact: 'EntryPoint = "RtlMoveMemory"'
- id: rtlmovememory-entrypoint-encoded
  desc: RtlMoveMemory entry point in decoded blob
  crit: suspicious
  conf: 0.94
  for:
  - powershell
  if:
    type: encoded
    substr: 'EntryPoint = "RtlMoveMemory"'
- id: amsi-bypass-init-scan-buffer-encoded
  desc: AmsiScanBuffer in decoded blob
  crit: suspicious
  conf: 0.94
  for:
  - powershell
  if:
    type: encoded
    word: AmsiScanBuffer
    case_insensitive: true
- id: amsi-bypass-reflection
  desc: AMSI bypass via reflection
  crit: suspicious
  conf: 0.9
  for:
  - powershell
  unless:
  - id: metadata/file/profile/markup::technique-catalog-notes
  if:
    type: text
    regex: \[Ref\]\.Assembly\.GetType.{0,50}amsi
    case_insensitive: true
- id: amsi-bypass-reflection-loop
  desc: AMSI bypass via GetTypes() loop
  crit: suspicious
  conf: 0.9
  for:
  - powershell
  unless:
  - id: metadata/file/profile/markup::technique-catalog-notes
  if:
    type: text
    regex: \[Ref\].{0,30}GetTypes.{0,400}(\*[a-z]?iUtils|amsi\w*Failed|\*F?ailed)
    case_insensitive: true
- id: amsi-bypass-amsiutils-setvalue
  desc: AmsiUtils field SetValue bypass
  crit: suspicious
  conf: 0.93
  for:
  - powershell
  unless:
  - id: metadata/file/profile/markup::technique-catalog-notes
  if:
    type: text
    regex: AmsiUtils[\s\S]{0,400}\.SetValue\(|SetValue\([^\n]{0,200}amsiInitFailed
    case_insensitive: true
composite_rules:
# The signed PowerShell engine assembly calls AmsiScanBuffer. The name pair
# is the scan provider, not a patch.
- id: powershell-engine-amsi-provider
  desc: Signed PowerShell engine assembly
  crit: exception
  conf: 0.97
  for: [pe, dll]
  all:
  - id: well-known/lib/runtime/managed/dotnet-runtime::microsoft-dotnet-system-assembly-original
  - id: metadata/signed/leaf::microsoft-corporation
  - id: micro-behaviors/process/interpreter/powershell/host::sma-namespace
# Compiled-carrier twin: a .NET binary that string-tables both patch targets
# together is preparing the same impairment without C# source around it.
# Suspicious rather than hostile because AV/EDR products legitimately
# reference AmsiScanBuffer (they integrate with AMSI rather than patch it).
- id: amsi-patch-name-pair-binary
  desc: AMSI patch API name pair in binary strings
  crit: suspicious
  conf: 0.9
  all:
  - id: amsi-dll-string-name
  - id: amsiscanbuffer-string-name
  unless:
  - id: well-known/lib/runtime/managed/dotnet-runtime::coreclr-runtime-context
  - id: well-known/lib/runtime/managed/dotnet-runtime::dotnet-singlefile-host-context
  - id: powershell-engine-amsi-provider
  - id: metadata/file/profile/markup::technique-catalog-notes
