defaults:
  attack: T1562.001
  for:
    - pe
    - powershell
    - batch
    - vbs
  platforms:
    - windows
traits:
  - id: windows-script-amsi-disable-registry
    desc: Disable Windows Script AMSI
    crit: suspicious
    conf: 0.98
    for:
      - batch
      - powershell
      - vbs
      - oledoc
      - ole
    if:
      type: text
      regex: Windows Script\\Settings.{0,120}AmsiEnable.{0,120}Value\s+0
      case_insensitive: true
  - id: amsi-bypass-init-flag
    desc: AMSI initialization bypass
    crit: suspicious
    conf: 0.9
    for:
      - powershell
      - batch
    if:
      type: text
      word: amsiInitFailed
      case_insensitive: true
    unless:
      - id: metadata/file/extension/identity::markdown-powershell-basename
  - id: csharp-amsi-scanbuffer-patch-map
    desc: C# AMSI scan buffer patch map
    crit: suspicious
    conf: 0.95
    for:
      - csharp
    if:
      type: text
      regex: '"amsi\.dll"[\s\S]{0,180}"AmsiScanBuffer"[\s\S]{0,180}new\s+byte\[\]'
# Compiled-carrier twin: a .NET binary that string-tables both patch targets
# together is preparing the same impairment without C# source around it.
# Suspicious rather than hostile because AV/EDR products legitimately
# reference AmsiScanBuffer (they integrate with AMSI rather than patch it).
  - id: amsi-dll-reference-encoded
    desc: AMSI DLL reference in decoded blob
    crit: suspicious
    conf: 0.94
    for:
      - powershell
    if:
      type: encoded
      substr: amsi.dll
      case_insensitive: true
  - id: amsi-scanbuffer-concat
    desc: AmsiScanBuffer string concat
    crit: suspicious
    conf: 0.94
    for:
      - powershell
    if:
      type: text
      regex: '(?i)"Am"\s*\+\s*"si"\s*\+\s*"Scan"\s*\+\s*"Buffer"'
  - id: amsi-scanbuffer-concat-encoded
    desc: AmsiScanBuffer concat in decoded blob
    crit: suspicious
    conf: 0.97
    for:
      - powershell
    if:
      type: encoded
      regex: '(?i)"Am"\s*\+\s*"si"\s*\+\s*"Scan"\s*\+\s*"Buffer"'
  - id: rtlmovememory-entrypoint
    desc: RtlMoveMemory entry point
    crit: suspicious
    conf: 0.88
    for:
      - powershell
    if:
      type: text
      exact: 'EntryPoint = "RtlMoveMemory"'
  - id: rtlmovememory-entrypoint-encoded
    desc: RtlMoveMemory entry point in decoded blob
    crit: suspicious
    conf: 0.94
    for:
      - powershell
    if:
      type: encoded
      substr: 'EntryPoint = "RtlMoveMemory"'
  - id: amsi-bypass-init-scan-buffer-encoded
    desc: AmsiScanBuffer in decoded blob
    crit: suspicious
    conf: 0.94
    for:
      - powershell
    if:
      type: encoded
      word: AmsiScanBuffer
      case_insensitive: true
  - id: amsi-bypass-reflection
    desc: AMSI bypass via reflection
    crit: suspicious
    conf: 0.9
    for:
      - powershell
    unless:
      - id: metadata/package/documentation/security-exercise::technique-catalog-notes
    if:
      type: text
      regex: \[Ref\]\.Assembly\.GetType.{0,50}amsi
      case_insensitive: true
  - id: amsi-bypass-reflection-loop
    desc: AMSI bypass via GetTypes() loop
    crit: suspicious
    conf: 0.9
    for:
      - powershell
    unless:
      - id: metadata/package/documentation/security-exercise::technique-catalog-notes
    if:
      type: text
      regex: \[Ref\].{0,30}GetTypes.{0,400}(\*[a-z]?iUtils|amsi\w*Failed|\*F?ailed)
      case_insensitive: true
  - id: amsi-bypass-amsiutils-setvalue
    desc: AmsiUtils reflection field-write references
    crit: suspicious
    conf: 0.93
    for:
      - powershell
      - ruby
    unless:
      - id: metadata/package/documentation/security-exercise::technique-catalog-notes
    if:
      type: text
      regex: AmsiUtils[\s\S]{0,400}\.SetValue\(|SetValue\([^\n]{0,200}amsiInitFailed
      case_insensitive: true
composite_rules:
  - id: python-amsi-memory-patch
    desc: Python patches AmsiScanBuffer via ctypes
    crit: hostile
    conf: 0.98
    for: [python, whl, python-sdist]
    all:
      - id: micro-behaviors/os/security/amsi::amsi-scan-buffer-reference
      - id: micro-behaviors/mem/protect/modify/unspecified::virtualprotect-ctypes
      - id: micro-behaviors/mem/copy::python-ctypes-memmove
  - id: native-amsi-memory-patch
    desc: Native code patches AmsiScanBuffer in memory
    crit: hostile
    conf: 0.98
    for: [c, cpp]
    all:
      - id: micro-behaviors/os/security/amsi::amsi-scan-buffer-reference
      - id: micro-behaviors/mem/protect/modify/unspecified::virtual-protect-source-call
      - id: micro-behaviors/mem/copy::native-memcpy-byte-copy
    unless:
      - id: well-known/lib/platform/microsoft-amsi::microsoft-amsi-system-context
  - id: native-amsi-memory-blinding
    desc: Native PE patches AMSI in writable memory
    crit: hostile
    conf: 0.99
    for: [pe, dll]
    all:
      - id: micro-behaviors/os/security/amsi::library-and-scan-buffer-name-pair
      - id: micro-behaviors/dylib/lookup::get-proc-address-import
      - id: micro-behaviors/mem/protect/modify/unspecified::virtual-protect-import
    any:
      - id: micro-behaviors/mem/write/arbitrary::x64-store-zero-return-stub
      - id: micro-behaviors/mem/write/arbitrary::x64-write-zero-return
      - id: micro-behaviors/mem/write/arbitrary::x64-ret-store-between-one-byte-calls
      - id: micro-behaviors/mem/write/arbitrary::x64-write-invalidarg-return
    unless:
      - id: well-known/lib/platform/microsoft-amsi::microsoft-amsi-system-context
