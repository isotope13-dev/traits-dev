# The report patches a COM vtable instead of the exported AmsiScanBuffer.
# Keep this suspicious: these calls co-occur, but static co-occurrence does
# not prove which object the pointer write targets or the replacement result.
defaults:
  platforms: [windows]
  for: [csharp, powershell, python]
  attack: T1562.001

composite_rules:
  - id: com-scanner-pointer-patching
    desc: AMSI COM class with protected pointer writes
    crit: suspicious
    conf: 0.96
    all:
      - id: micro-behaviors/os/security/amsi::antimalware-com-clsid
      - id: micro-behaviors/os/com/interface::marshal-iunknown-pointer
      - id: micro-behaviors/mem/read/arbitrary::marshal-read-intptr
      - id: micro-behaviors/mem/write/arbitrary::marshal-write-intptr
    any:
      - id: metadata/file/profile/memory-protection-api::virtual-protect-pinvoke
      - id: metadata/file/profile/memory-protection-api::powershell-virtualprotect-name
      - id: micro-behaviors/mem/protect/modify/unspecified::virtualprotect-ctypes
