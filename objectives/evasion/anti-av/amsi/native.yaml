# Native AMSI bypasses.
defaults:
  platforms: [windows]
  for: [pe, dll]
  attack: T1562.001
  mbc: E1562

composite_rules:
  - id: native-amsi-memory-patch
    desc: Native PE patches the AMSI scan-buffer path in memory
    crit: hostile
    conf: 0.995
    scope: leaf
    all:
      - id: micro-behaviors/os/security/amsi::dll-reference
      - id: micro-behaviors/os/security/amsi::scan-buffer-api
      - id: micro-behaviors/mem/protect/modify::virtual-protect
    unless:
      - id: metadata/signed/platform/
      # CoreCLR calls AmsiScanBuffer itself to scan assemblies it loads; the
      # single-file apphost statically links it next to unrelated VirtualProtect use.
      - id: metadata/binary/framework::dotnet-singlefilehost-runtime
      - id: well-known/tool/reverse-engineering/
      - id: well-known/lib/runtime/dotnet-runtime::coreclr-runtime-context
