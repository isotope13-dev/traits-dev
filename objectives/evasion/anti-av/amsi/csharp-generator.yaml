defaults:
  for: [csharp]
  platforms: [windows]
  attack: T1562.001

traits:
  - id: csharp-prints-transformed-amsi-bypass
    desc: Prints transformed AMSI bypass template
    crit: hostile
    conf: 0.97
    if:
      type: tree-sitter
      query: |
        ((class_declaration body: (declaration_list
          (method_declaration name: (identifier) @factory
            body: (block
              (local_declaration_statement (variable_declaration
                (variable_declarator name: (identifier) @payload (string_literal) @template)))
              (switch_statement body: (switch_body (switch_section
                (return_statement (invocation_expression
                  arguments: (argument_list (argument (identifier) @returned)))))))))
          (method_declaration name: (identifier) @entry
            body: (block (expression_statement (invocation_expression
              function: (member_access_expression expression: (identifier) @console name: (identifier) @print)
              arguments: (argument_list (argument (invocation_expression function: (identifier) @call)))))))))
        (#eq? @payload @returned)
        (#eq? @factory @call)
        (#eq? @entry "Main")
        (#eq? @console "Console")
        (#eq? @print "WriteLine")
        (#match? @template "AmsiUtils")
        (#match? @template "amsiInitFailed")
        (#match? @template "GetType")
        (#match? @template "GetField")
        (#match? @template "(?i)SetValue[(][$]null,[ ]*[$]true[)]")
        )
