defaults:
  platforms: [windows]
  for: [pe, dll]
  arch: [x86-64]
composite_rules:
  - id: index-xor-amsi-invalidarg-patch
    desc: Concealed AMSI target and invalid-argument patch
    crit: hostile
    conf: 0.99
    attack: T1562.001
    all:
      - id: micro-behaviors/os/security/amsi::index-mixed-xor-scan-buffer-name
      - id: micro-behaviors/mem/write/arbitrary::x64-write-invalidarg-return
      - id: micro-behaviors/mem/protect/modify::virtual-protect
