# C# AMSI memory-patching bypasses.
defaults:
  platforms: [windows]
  for: [csharp]
  attack: T1562.001
  mbc: E1562

composite_rules:
  - id: csharp-amsi-memory-patch
    desc: C# patches AmsiScanBuffer in memory
    crit: hostile
    conf: 0.99
    all:
      - id: micro-behaviors/os/security/amsi::dll-reference
      - id: micro-behaviors/os/security/amsi::scan-buffer-api
      - id: micro-behaviors/mem/protect/modify::virtual-protect-pinvoke
      - id: micro-behaviors/mem/c-runtime/functions::marshal-copy-csharp
