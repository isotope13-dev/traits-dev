# C# AMSI memory-patching bypasses.
defaults:
  platforms: [windows]
  for: [csharp]
  attack: T1562.001
  mbc: E1562

composite_rules:
  - id: csharp-amsi-memory-patch
    desc: C# patches AmsiScanBuffer in memory
    crit: hostile
    conf: 0.99
    all:
      - id: micro-behaviors/os/security/amsi::amsi-library-reference
      - id: micro-behaviors/os/security/amsi::amsi-scan-buffer-reference
      - id: micro-behaviors/mem/protect/modify::virtual-protect-pinvoke
      - id: micro-behaviors/mem/c-runtime/functions::marshal-copy-csharp
  - id: managed-amsi-hardware-breakpoint-bypass
    desc: Managed AMSI bypass via vectored hardware breakpoint
    crit: hostile
    conf: 0.99
    for: [pe, dll]
    attack: T1562.001,T1055.003
    all:
      - id: micro-behaviors/os/security/amsi::amsi-library-reference
      - id: micro-behaviors/os/security/amsi::amsi-scan-buffer-reference
      - id: micro-behaviors/os/exception/error-handling::managed-vectored-thread-context-setup
      - id: micro-behaviors/os/api-resolution/dynamic::managed-unmanaged-memory-marshalling
