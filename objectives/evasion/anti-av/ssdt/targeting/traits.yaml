# This profile co-occurs a PhysicalMemory device reference, the SSDT symbol,
# a named file-mapping API, and a Chinese security-product process marker. It
# supports probable SSDT access for AV evasion; it does not prove a write or
# restoration of the table.
defaults:
  platforms: [windows]
  for: [pe]
  attack: T1562.001,T1014
composite_rules:
  - id: physical-memory-ssdt-refs-with-security-product
    desc: PhysicalMemory/SSDT refs with AV marker
    crit: hostile
    conf: 0.85
    all:
      - id: micro-behaviors/os/kernel/ssdt-access::physical-memory-device-path
      - id: micro-behaviors/os/kernel/ssdt-access::ke-service-descriptor-table-name
      - id: micro-behaviors/communications/ipc/file-mapping::open-file-mapping-a
      - id: micro-behaviors/os/security/product::qihoo-active-defense-process
