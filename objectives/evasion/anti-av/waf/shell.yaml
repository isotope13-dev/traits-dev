defaults:
  platforms: [unix, windows]
  for: [shell]

traits:
  - id: waf-bypass-header-spoofing
    desc: Command-line WAF bypass header spoofing
    crit: suspicious
    conf: 0.93
    if:
      type: text
      regex: 'X-WAF-Bypass|\b(curl|wget)\b[^\n]{0,120}\bCF-Connecting-IP\b'
      case_insensitive: true

composite_rules:
  - id: authorized-waf-test-confirmations
    desc: WAF testing requires explicit owner consent and risk acceptance
    crit: exception
    conf: 0.98
    all:
      - id: micro-behaviors/ui/dialog/prompt::target-owner-consent-prompt
      - id: micro-behaviors/ui/dialog/prompt::explicit-risk-acceptance-prompt

  - id: waf-evasion-through-tor-rotation
    desc: WAF evasion with rotating Tor circuits
    crit: hostile
    conf: 0.98
    all:
      - id: waf-bypass-header-spoofing
      - id: micro-behaviors/communications/proxy/tor::tor-newnym-control-signal
      - id: micro-behaviors/communications/proxy/socks::shell-socks5-proxy-variable
    unless:
      - id: authorized-waf-test-confirmations
