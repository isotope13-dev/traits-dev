# The script writes a batch/script file, runs it through a hidden cmd /c and
# deletes a file right after: the launcher leaves no copy of the command it
# ran. Installers do the same with temporary helpers, so this stays
# suspicious.
defaults:
  platforms: [windows]
  for: [vbs]
  attack: T1070.004

composite_rules:
  - id: wsh-write-hidden-run-delete
    desc: Script writes, hidden-runs, then deletes a file
    crit: suspicious
    conf: 0.88
    near_bytes: 600
    all:
      - id: micro-behaviors/fs/write/content::create-text-file-method-name
      - id: micro-behaviors/process/create/hidden::wsh-hidden-cmd-run-variable-path
      - id: micro-behaviors/fs/delete/file/library::wsh-deletefile-call
