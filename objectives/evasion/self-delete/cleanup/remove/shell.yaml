# Shell Self-Delete Detection
# Detects shell scripts that delete themselves after execution
# ATT&CK: T1070.004 (Indicator Removal: File Deletion)
# MBC: F0007 (File Deletion)
defaults:
  platforms: [unix, android, ios]
  crit: suspicious
  attack: "T1070.004"
  mbc: "F0007"
  for: [shell]
traits:
  # Self-deletion using $0
  - id: rm-self-dollar-zero
    desc: Self-deletes using rm $0
    crit: suspicious
    conf: 0.95
    if:
      type: text
      # `$0` is the current script only when the command is a shell command
      # line. Inside a quoted `sh -c` helper it is that helper's argv[0].
      regex: '(?m)^\s*rm\s+(-[rf]+\s+)?(--)?\s*["\x27]?\$0["\x27]?'
    unless:
      - type: text
        regex: 'xargs -0 -r sh -c ''rm -[fi] -- "\$0" "\$@" </dev/tty'''
      - id: metadata/package/testing/
      - type: text
        substr: "Update process completed successfully"
      - id: well-known/app/
      - id: metadata/package/files/system-package::container-entrypoint-script
      - id: objectives/evasion/self-delete/cleanup/remove::recognized-shell-cleanup-context
      - id: metadata/build/recognized-contexts::github-release-macos-app-updater
    downgrade:
      any:
        - id: metadata/signed/platform::apple
  # Self-deletion using script name variable
  - id: rm-self-script-var
    desc: Self-deletes using script variable
    crit: suspicious
    conf: 0.9
    if:
      type: text
      regex: '(?m)^[ \t]*rm\s+(-[rf]+\s+)?(--\s+)?"\$\{?BASH_SOURCE(\[0\])?\}?"'
  # Self-deletion using basename
  - id: rm-self-basename
    desc: Self-deletes using basename
    crit: suspicious
    conf: 0.85
    if:
      type: text
      regex: 'rm\s+(-[rf]+\s+)?\$\(basename\s+\$0\)'
composite_rules:
  - id: rm-self-realpath-variable
    desc: Self-deletes a realpath-resolved script variable
    crit: suspicious
    conf: 0.97
    all:
      - id: micro-behaviors/fs/path/self::realpath-current-script
      - id: micro-behaviors/fs/file/delete::rm-force-variable-target
    unless:
      - id: well-known/lib/media/libjxl::libjxl-source-tree
    near_lines: 12
  - id: self-deleting-external-ip-loop-dropper
    desc: Self-deleting external-IP loop dropper
    crit: hostile
    conf: 0.99
    attack: "T1105, T1059.004, T1070.004, T1222.002"
    mbc: "B0024, F0007"
    all:
      - id: rm-self-dollar-zero
      - id: micro-behaviors/communications/ip/literal::external-ipv4-http-url
      - id: micro-behaviors/communications/http/download/shell::wget-loop-variable-download
      - id: micro-behaviors/fs/chmod/executable/mode::chmod-exec-var-target
      - id: micro-behaviors/process/create/local-exec::chmod-exec-var-local
  - id: self-deleting-raw-ip-variable-dropper
    desc: Self-deleting raw-IP variable dropper
    crit: hostile
    conf: 0.99
    attack: "T1105,T1059.004,T1070.004,T1222.002"
    mbc: "B0024,F0007"
    all:
      - id: micro-behaviors/fs/path/self::realpath-current-script
      - id: micro-behaviors/fs/file/delete::rm-force-variable-target
      - id: micro-behaviors/communications/ip/literal::external-ipv4-shell-endpoint
      - id: micro-behaviors/communications/http/download/cli::fetch-output-flag-script
      - id: micro-behaviors/fs/chmod/executable/mode::chmod-exec-var-target
      - id: micro-behaviors/process/daemonize/detach::background-ampersand-hidden
      - id: micro-behaviors/os/sysinfo/platform/arch::multi-arch-target
    near_lines: 70
  - id: self-deleting-raw-ip-multiarch-temp-dropper
    desc: Self-deleting raw-IP multi-architecture temporary dropper
    crit: hostile
    conf: 0.99
    attack: "T1105,T1059.004,T1070.004,T1222.002"
    mbc: "B0024,F0007"
    all:
      - id: objectives/command-and-control/dropper/delivery/download-execute::raw-ip-busybox-multiarch-dropper
      - id: rm-self-dollar-zero
