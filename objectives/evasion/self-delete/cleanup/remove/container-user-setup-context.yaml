defaults:
  platforms: [unix, windows]
  for: [shell]

traits:
  - id: user-setup-helper-basename
    desc: Container runtime user setup helper basename
    crit: notable
    conf: 0.99
    if:
      type: basename
      regex: '^user_setup(\.tmpl)?$'

  - id: user-setup-passwd-permission
    desc: Container setup grants passwd group write access
    crit: notable
    conf: 0.99
    if:
      type: text
      regex: '(?m)^\s*chmod\s+g\+rw\s+/etc/passwd\b'

  - id: user-setup-home-ownership
    desc: Container setup assigns runtime home ownership
    crit: notable
    conf: 0.99
    if:
      type: text
      regex: 'chown\s+\$\{?USER_UID\}?:0\s+\$\{?HOME\}?'

composite_rules:
  - id: user-setup-context
    desc: Recognized container runtime user setup helper
    crit: exception
    conf: 0.99
    all:
      - id: user-setup-helper-basename
      - id: user-setup-passwd-permission
      - id: user-setup-home-ownership
