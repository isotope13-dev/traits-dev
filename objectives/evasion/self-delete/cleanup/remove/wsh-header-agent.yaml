defaults:
  platforms: [windows, unix]
  for: [javascript]
  attack: T1070.004,T1112
composite_rules:
  - id: header-command-agent-removal-routines
    desc: Header command agent has removal routines
    crit: hostile
    conf: 0.96
    # Static capability profile: own-script path access plus file and registry
    # removal in a proved command-channel context. Dynamic paths are not
    # resolved here, and this does not assert that deletion already occurred.
    all:
      - id: objectives/command-and-control/remote-command/tasking::obfuscated-wsh-header-powershell-channel
      - id: micro-behaviors/process/info/selfpath::scriptfullname-literal
      - id: micro-behaviors/fs/delete/file/library::js-bracket-deletefile-call
      - id: micro-behaviors/os/registry/delete::js-regdelete-method-call
