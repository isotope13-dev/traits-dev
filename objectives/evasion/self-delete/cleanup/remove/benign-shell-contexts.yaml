defaults:
  platforms: [unix, macos]
  for: [shell]

composite_rules:
  - id: verified-release-fetch-helper
    desc: Verified release-fetch shell helper
    crit: exception
    conf: 0.99
    all:
      - id: micro-behaviors/communications/http/download/cli::wget-command-call
      - id: micro-behaviors/crypto/asymmetric/signature::gpg-verification-command
      - id: micro-behaviors/crypto/hash/digest::shell-sha256-checksum-command

  - id: recognized-shell-cleanup-context
    desc: Recognized benign shell cleanup context
    crit: exception
    conf: 0.98
    any:
      - id: objectives/evasion/self-delete/cleanup/remove::macos-app-updater-context
      - id: objectives/evasion/self-delete/cleanup/remove::user-setup-context
      - id: objectives/evasion/self-delete/cleanup/remove::verified-release-fetch-helper
      - id: metadata/build/recognized-contexts::github-release-macos-app-updater
