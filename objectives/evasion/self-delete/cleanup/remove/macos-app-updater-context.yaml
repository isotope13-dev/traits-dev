defaults:
  platforms: [macos]
  for: [shell]

composite_rules:
  - id: macos-app-updater-context
    desc: macOS disk-image application updater
    crit: exception
    conf: 0.98
    all:
      - id: micro-behaviors/fs/volume/mount::hdiutil-attach
      - id: micro-behaviors/fs/file/copy::macos-updater-app-copy
      - id: micro-behaviors/process/create/launch::macos-updater-app-launch
