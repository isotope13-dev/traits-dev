# A compact cleanup helper stops a WMI-selected process, waits for exit,
# removes a public executable and removes a public script. This recognizes
# the cleanup pattern, not the identity or prior actions of the removed binary.
# No claim of dynamic self-path resolution is made: the script path is literal.
defaults:
  for: [vbs]
  platforms: [windows]
composite_rules:
  - id: wsh-public-process-cleanup
    desc: WMI termination, sleep and public executable/script removal
    crit: hostile
    conf: 0.9
    attack: T1070.004
    size_max: 4096
    all:
      - id: micro-behaviors/process/terminate/enumerated::vbs-wmi-termination
      - id: micro-behaviors/os/com/instantiation::filesystemobject-constructor
      - id: micro-behaviors/os/wmi/query::getobject-winmgmts
      - id: micro-behaviors/fs/delete/file/public-profile::wsh-public-executable-delete
      - id: micro-behaviors/fs/delete/file/public-profile::wsh-public-script-delete
      - id: micro-behaviors/time/sleep/interval::wscript-sleep-call
      - id: metadata/lang/scripted::on-error-resume
