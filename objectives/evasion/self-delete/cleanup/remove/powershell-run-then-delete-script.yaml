defaults:
  platforms: [windows]
  for: [powershell]
  attack: T1070.004,T1059.001
  mbc: F0007
composite_rules:
  - id: powershell-decrypted-temp-run-delete
    desc: Decrypts and executes temp script then force-deletes it
    crit: hostile
    conf: 0.97
    all:
      - id: micro-behaviors/crypto/decrypt/initialize
      - id: micro-behaviors/fs/path/temp::env-temp
      - id: micro-behaviors/fs/write/file/full/bytes::write-all-bytes
      - id: micro-behaviors/process/sync/join::powershell-process-waitforexit
      - id: micro-behaviors/fs/delete/file/command::powershell-force-remove-variable-path
    any:
      - id: micro-behaviors/process/create/subprocess/launch::powershell-diagnostics-process-start
      - id: micro-behaviors/process/create/cmdlet::start-process-call
