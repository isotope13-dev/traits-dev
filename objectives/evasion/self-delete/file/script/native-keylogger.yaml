defaults:
  platforms: [windows]
  for: [pe, dll]

composite_rules:
  - id: native-keylogger-batch-self-cleanup
    desc: Raw-input keylogger with batch self-cleanup template
    crit: hostile
    conf: 0.98
    attack: T1070.004
    # The template explicitly deletes its batch's own path. Recording provides
    # abuse context; ordinary installer cleanup alone must remain neutral.
    # This profile does not claim a bound launch or successful deletion.
    all:
      - id: objectives/collection/keylog/device::native-translated-scrambled-key-log
      - id: micro-behaviors/fs/delete/file/self::batch-self-delete
      - id: micro-behaviors/process/create/exec::create-process-a
