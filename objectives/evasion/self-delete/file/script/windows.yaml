defaults:
  for:
    - powershell
    - batch
  mbc: F0007
  attack: T1070.004
  platforms:
    - windows
traits:
  - id: self-delete-windows
    desc: Self-deleting via DeleteFile
    crit: suspicious
    conf: 0.66
    if:
      type: text
      substr: DeleteFile(argv[0])
  - id: native-self-delete-argv
    desc: Native stub deletes argv[0]
    crit: suspicious
    conf: 0.94
    for: [c, cpp, pe, dll]
    if:
      type: text
      regex: '(?i)\bDeleteFile(A|W)?\s*\(\s*argv\s*\[\s*0\s*\]'
  - id: vbs-file-delete
    desc: Delete VBS files
    crit: suspicious
    conf: 0.85
    if:
      type: string_literal
      regex: '\bdel\s+[^\r\n]{0,50}\.vbs\b|Remove-Item.{0,50}\.vbs|DeleteFile.{0,50}\.vbs'
      case_insensitive: true
    not:
      - regex: (?i)getadmin\.vbs
  - id: timeout-del-self
    desc: Self-deletion via delayed cmd.exe del command
    crit: suspicious
    conf: 0.92
    if:
      type: string_literal
      regex: timeout\s+\d+\s*&\s*del\s+/f
composite_rules:
  - id: comspec-shortpath-self-delete
    desc: Launches COMSPEC to delete own short path
    crit: suspicious
    conf: 0.95
    for:
      - pe
      - dll
    all:
      - id: micro-behaviors/os/env/runtime::comspec-env-var
      - id: micro-behaviors/fs/path/check::get-short-path-name
      - id: micro-behaviors/process/create/shellexec::shell-execute-ex-a
    any:
      - id: micro-behaviors/process/info/current::get-module-filename
      - id: micro-behaviors/os/module/load::get-module-filename-ansi
    downgrade:
      any:
        - id: metadata/signed/platform/
    unless:
      - id: well-known/app/system/iobit::advanced-systemcare-component-context
      - id: well-known/app/system/far-manager::far-manager-versioninfo-company
  - id: module-path-delete
    desc: Native module path and shell-delete setup
    crit: suspicious
    conf: 0.96
    for: [pe, dll]
    all:
      - id: metadata/binary/instruction/sequence::x86-checked-maxpath-call-sequences
      - id: micro-behaviors/process/info/current::get-module-filename
      - id: micro-behaviors/os/env/runtime::comspec-env-var
      - id: micro-behaviors/fs/delete/file/command::slash-c-del-fragment
    any:
      - id: micro-behaviors/process/create/shellexec::shell-executeex-call
      - id: micro-behaviors/process/create/launch::create-process-api-name
    unless:
      - id: metadata/binary/installer/plugin/
      - id: well-known/dual-use/tunnel/swifttunnel_vpn/
    downgrade:
      any:
        - id: metadata/signed/platform/
  - id: padded-imports-self-delete
    desc: Self-delete with inflated import table (evasion via padding)
    crit: suspicious
    conf: 0.9
    for: [pe, dll]
    all:
      - id: micro-behaviors/process/info/current::get-module-filename
      - id: micro-behaviors/fs/delete/file/library::delete-win
      - id: metadata/binary/header/malformed::low-function-count-marker
      - id: metadata/binary/symbols/count::many-imports
