# Node.js Self-Deletion and Manifest Swap
# Detects Node.js scripts that delete themselves and swap package manifests
# Used by axios hijack (plain-crypto-js) and similar supply chain attacks
# ATT&CK: T1070.004 (Indicator Removal: File Deletion)
defaults:
  platforms: [windows, unix]
  for:
    - javascript
    - typescript
  attack: T1070.004
  mbc: F0007
traits:
  - id: obfuscated-rm-filename
    desc: Obfuscated self-delete function
    crit: suspicious
    conf: 0.88
    if:
      type: text
      regex: 'function\s+removeme\(\).{0,120}__filename'
  - id: unlink-package-json
    desc: Deletes package.json after execution
    crit: suspicious
    conf: 0.9
    if:
      type: text
      regex: (fs\.unlink|unlinkSync)\s*\(\s*"package\.json"
  - id: rename-package-md
    desc: Renames package.md to package.json
    crit: suspicious
    conf: 0.95
    if:
      type: text
      regex: (fs\.rename|renameSync)\s*\(\s*"package\.md"
  - id: node-source-line-splice
    desc: Splits lines and splices array
    crit: component
    conf: 0.9
    if:
      type: text
      # Require a line-separator delimiter (\n, \r\n, /\r?\n/) so chained
      # split/splice array juggling in minified libraries is not "splits lines".
      regex: 'split\s*\(\s*["''/](\\r\\n|\\r\?\\n|\\n)[^;]{0,40}\.splice\('
composite_rules:
  # A temporary updater can remove itself. Require the additional concealment
  # and file-writing roles before treating that cleanup as suspicious.
  - id: node-decoder-file-writer-self-removal
    desc: Self-removal with XOR/Base64 and file writes
    crit: suspicious
    conf: 0.95
    all:
      - id: micro-behaviors/fs/delete/file/self::node-self-delete
      - id: micro-behaviors/data/decode/xor::fromcharcode-xor-rebuild
      - id: micro-behaviors/data/decode/base64::buffer-from-base64
      - id: micro-behaviors/fs/write/file/full::node-write-file-sync-call
      - id: micro-behaviors/os/module/require::cjs-require-in-try
  - id: manifest-swap
    desc: Package manifest swap after execution
    crit: suspicious
    conf: 0.95
    all:
      - id: unlink-package-json
    any:
      - id: rename-package-md
  - id: dropper-self-cleanup
    desc: Dropper self-cleanup with manifest swap
    crit: hostile
    conf: 0.95
    all:
      - id: micro-behaviors/fs/delete/file/self::node-self-delete
      - id: manifest-swap
  - id: dropper-self-delete-source-scrub
    desc: Dropper deletes self and scrubs host source file
    crit: hostile
    conf: 0.98
    near_bytes: 2048
    all:
      - id: node-source-line-splice
    any:
      - id: micro-behaviors/fs/delete/file/self::unlink-filename
      - id: micro-behaviors/fs/delete/file/self::rm-filename
      - id: micro-behaviors/fs/delete/file/self::node-self-delete
  - id: node-eval-detached-child-self-delete
    desc: Evaluates payload, spawns child and deletes self
    crit: hostile
    conf: 0.97
    attack: T1070.004,T1059.007,T1564.003
    all:
      - id: micro-behaviors/fs/delete/file/library::fs-unlinkSync
      - id: micro-behaviors/process/create/spawn::detached-hidden-spawn
      - id: micro-behaviors/process/interpreter/eval/indirect::js-indirect-eval-variable
      - id: objectives/anti-static/obfuscation/instruction/insertion-junk::whitespace-padded-obfuscator-payload
