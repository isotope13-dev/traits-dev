# JScript Self-Deletion
# Detects scripts that delete themselves after execution or during startup
defaults:
  platforms: [windows, unix]
  crit: suspicious
  conf: 0.8
  for: [javascript]
traits:
  - id: js-self-deletion-pattern
    desc: "Self-deletion via ScriptFullName"
    mbc: "B0006" # Self-Deletion
    attack: "T1070.004"
    for: [javascript, html]
    if:
      type: text
      # Matches DeleteFile(ScriptFullName)
      regex: '\.DeleteFile\s*\([^)]{0,120}ScriptFullName[^)]{0,120}\)'
  # FileSystemObject FileExists/DeleteFile are neutral WSH file operations;
  # the canonical atoms live at micro-behaviors/fs/path/check::fso-file-exists
  # and micro-behaviors/fs/delete/file/library::wsh-deletefile-call.
composite_rules:
  - id: js-conditional-file-cleanup
    desc: JScript conditionally deletes its running script
    crit: suspicious
    conf: 0.9
    mbc: "B0006"
    attack: "T1070.004"
    for: [javascript, html]
    all:
      - id: js-self-deletion-pattern
      - id: micro-behaviors/fs/path/check::fso-file-exists
  - id: hta-decoded-loader-with-file-cleanup
    desc: HTA loader deletes a file after execution
    crit: hostile
    conf: 0.99
    attack: "T1027,T1059.007,T1070.004,T1140"
    # hta-hex-xor-string-decoder is HTML-only (hta-application-element);
    # js-eval-variable-text is a javascript-only tree-sitter query, so it
    # cannot join a leg that is hard-gated to html.
    for: [html]
    all:
      - id: micro-behaviors/data/decode/custom::hta-hex-xor-string-decoder
      - id: js-conditional-file-cleanup

  # Hex-left XOR padding plus numeric-array XOR reconstruction and FSO
  # DeleteFile is the cleanup half of XOR-encoded WSH droppers (staged
  # .vbs/.dat removed after Run). Distinct from the eval/dynamic dropper
  # composite so both obfuscation shape and post-exec cleanup score.
  - id: xor-hex-array-dropper-cleanup
    desc: Hex-XOR JavaScript dropper deletes staged files
    crit: hostile
    conf: 0.97
    attack: "T1027,T1059.007,T1070.004"
    all:
      - id: objectives/anti-static/obfuscation/string/reconstruct::js-xor-numeric-array-string-reconstruction
      - id: micro-behaviors/data/encode/hex_xor::fragmented-hex-xor-decoder
      - id: micro-behaviors/fs/delete/file/library::wsh-deletefile-call
