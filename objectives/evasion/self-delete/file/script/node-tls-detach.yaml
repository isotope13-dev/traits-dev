defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  attack: T1070.004,T1564.003
composite_rules:
  - id: tls-disabled-detached-child-self-removal
    desc: TLS-disabled detached child with self-removal
    crit: hostile
    conf: 0.98
    scope: leaf
    near_bytes: 2048
    all:
      - id: micro-behaviors/communications/tls/verify/disable::node-tls-verification-env-disable
      - id: micro-behaviors/process/create/spawn::detached-ignored-unref-spawn
      - id: micro-behaviors/fs/delete/file/self::unlink-filename
    any:
      - id: micro-behaviors/communications/http/download/handler::node-http-response-to-file
      - id: micro-behaviors/os/env/secret-name::node-env-secret-filter
