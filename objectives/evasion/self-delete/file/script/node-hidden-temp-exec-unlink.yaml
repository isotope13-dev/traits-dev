defaults:
  platforms: [unix]
  for: [javascript, typescript]
  attack: T1070.004,T1564.001
  mbc: F0007

composite_rules:
  # The launched file removes itself in the exec callback, so nothing is left
  # in /tmp after the run. Combined with a dot-prefixed name and an explicit
  # chmod +x, the cleanup hides a staged program rather than tidying a cache.
  - id: node-hidden-temp-exec-unlink
    desc: Node runs a hidden temp executable then deletes it
    crit: hostile
    conf: 0.93
    near_lines: 12
    all:
      - id: micro-behaviors/fs/path/temp::tmp-hidden-file
      - id: micro-behaviors/fs/chmod/executable/mode::node-chmod-exec-mode-755
      - id: micro-behaviors/process/create/exec::js-execfile-call
      - id: micro-behaviors/fs/delete/file/
    unless:
      - id: metadata/package/testing/
      - id: "metadata/file/naming::test-directory-component"
