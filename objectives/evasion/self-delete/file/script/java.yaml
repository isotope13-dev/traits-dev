defaults:
  platforms: [windows, unix]
  for: [class]
  attack: T1070.004
  mbc: F0007
traits:
  # Source form: a dropped class deleting the .class file it runs from —
  # the self-erasure step of PaperCut-style lib/ bridge payloads that
  # remove their own bytecode after executing staged commands.
  - id: java-own-class-file-delete
    desc: Deletes own compiled class file
    crit: suspicious
    conf: 0.9
    for: [java]
    if:
      type: text
      regex: '\.class[''"]\s*\)?\s*\.delete\s*\(|Files\.delete[A-Za-z]*\s*\([^)]{0,80}\.class[''"]'
  # NOTE: a `getCodeSource` text atom used to live here. It duplicated the
  # canonical `micro-behaviors/process/info/current::getlocation-ref` matcher
  # (same self-path lookup chain, already a neighboring leg below) while
  # sitting in the self-delete tier for a lookup that never deletes anything,
  # so the composite references the canonical trait instead.
  - id: java-jar-extension
    desc: Java JAR extension string
    crit: component
    conf: 0.72
    if:
      type: text
      substr: .jar
  - id: java-shutdown-hook
    desc: Java shutdown hook registration
    crit: notable
    conf: 0.8
    if:
      type: text
      substr: addShutdownHook
  - id: java-minute-schedule-format
    desc: Java minute schedule formatting
    crit: notable
    conf: 0.74
    if:
      type: text
      substr: plusMinutes
composite_rules:
  - id: java-own-jar-delayed-cleanup
    desc: Java own JAR delayed cleanup
    crit: suspicious
    conf: 0.9
    near_bytes: 65536
    unless:
      - id: well-known/lib/development/scala-compiler
    all:
      - id: micro-behaviors/process/info/selfpath::java-protection-domain
      - id: micro-behaviors/process/info/current::getlocation-ref
      - id: java-jar-extension
      - id: java-shutdown-hook
    any:
      - id: java-minute-schedule-format
      - id: micro-behaviors/process/create/spawn::java-processbuilder-bytecode
