defaults:
  platforms: [windows]
  for: [vbs]
  mbc: B0006

composite_rules:
  - id: vbs-downloader-self-delete
    desc: VBScript downloader deletes its source after payload execution
    crit: hostile
    conf: 0.99
    attack: T1070.004,T1105,T1059.005
    all:
      - id: objectives/command-and-control/dropper/file-exec/command/script-host-download::wsh-http-stream-save-run-dropper
      - id: micro-behaviors/fs/delete/file/self::fso-delete-scriptfullname

  - id: vbs-staged-script-self-cleanup
    desc: VBScript executes a staged temporary script hidden and deletes it
    crit: hostile
    conf: 0.98
    attack: T1070.004,T1059.005,T1564.003
    all:
      - id: micro-behaviors/fs/write/content::fso-text-file-write-api
      - id: micro-behaviors/fs/delete/file/library::wsh-deletefile-call
    any:
      - id: micro-behaviors/process/create/hidden::wsh-run-hidden-wait-statement
      - id: micro-behaviors/data/control-flow/dispatch::run-zero-style-argument
