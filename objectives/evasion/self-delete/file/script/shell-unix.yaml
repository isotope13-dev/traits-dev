defaults:
  platforms: [unix]
  for: [shell]
  attack: T1070.004

traits:
  - id: shell-trap-self-delete
    desc: Shell trap self-delete
    crit: suspicious
    conf: 0.92
    if:
      type: text
      substr: trap self_delete

  - id: shell-readlink-self-rm
    desc: Shell readlink self rm
    crit: suspicious
    conf: 0.92
    if:
      type: text
      regex: 'readlink -f "\$0"[\s\S]{0,160}rm -f "\$\{?self_path\}?"'

  - id: shell-history-clear-cleanup
    desc: Shell history cleanup
    crit: suspicious
    conf: 0.9
    if:
      type: text
      regex: 'HISTFILE[\s\S]{0,160}history -c'

composite_rules:
  - id: shell-trap-self-delete-cleanup
    desc: Shell trap self-delete cleanup
    crit: hostile
    conf: 0.98
    all:
      - id: shell-trap-self-delete
      - id: shell-readlink-self-rm
      - id: shell-history-clear-cleanup

# A build recipe that runs the helper it just compiled and then erases both
# the binary and its source. The build-recipe rules under supply-chain
# convict the trojanized recipe; this states the evasion -- a build system
# that destroys evidence of what it built has run something it expects to be
# investigated, and the recipe is the only place a reviewer would have
# looked.
#
# Worked example: the trojanized proftpd configure, which compiles a helper,
# executes it, and removes the compiled output and its source in the same
# recipe block.
  - id: build-recipe-runs-then-erases-helper
    desc: Build recipe executes then erases its helper
    crit: hostile
    conf: 0.96
    attack: T1070.004,T1059.004
    all:
      - id: objectives/supply-chain/hidden-payload/build-recipe::recipe-removes-c-source
      - id: micro-behaviors/process/create/local-exec::execute-dot-slash-literal
