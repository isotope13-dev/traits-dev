defaults:
  platforms: [unix]
  for: [shell]
  attack: T1070.004

traits:
  - id: shell-trap-self-delete
    desc: Shell trap self-delete
    crit: suspicious
    conf: 0.92
    if:
      type: text
      substr: trap self_delete

  - id: shell-readlink-self-rm
    desc: Shell readlink self rm
    crit: suspicious
    conf: 0.92
    if:
      type: text
      regex: 'readlink -f "\$0"[\s\S]{0,160}rm -f "\$\{?self_path\}?"'

  # Order is the claim: the helper runs, then its C file is removed. Deleting
  # generated sources and then running the compiler (V's vc bootstrap) is the
  # other direction and is not evidence removal.
composite_rules:
  - id: shell-trap-self-delete-cleanup
    desc: Shell trap self-delete cleanup
    crit: hostile
    conf: 0.98
    all:
      - id: shell-trap-self-delete
      - id: shell-readlink-self-rm
      # Use the canonical command matcher: HISTFILESIZE near a commented
      # history-sync example establishes neither clearing nor self-deletion.
      - id: objectives/evasion/indicator-removal/logs::history-clear-call

# A build recipe that executes a helper and then removes its source. This is
# also common during compiler probes, so it remains an observation rather than
# a conclusion that the recipe intended to destroy evidence.
#
# Worked example: the trojanized proftpd configure, which compiles a helper,
# executes it, and removes the compiled output and its source in the same
# recipe block.
#
# "In the same recipe block" is load-bearing and is now enforced. Both legs
# are things autoconf does constantly on its own -- it runs `./conftest` and
# then `rm -f conftest.c` hundreds of times while probing the compiler -- so
# without proximity this convicted pristine release scripts (fragrouter 1.6,
# UnrealIRCd 3.2.8.1) and no malicious sample.
  - id: build-recipe-runs-then-erases-helper
    desc: Build recipe executes then erases its helper
    crit: notable
    conf: 0.96
    attack: T1070.004,T1059.004
    near_lines: 4
    all:
      - id: micro-behaviors/fs/delete/file/command::rm-c-source-file
      - id: micro-behaviors/process/create/path-execution::execute-dot-slash-literal
      - id: micro-behaviors/fs/delete/file/command::shell-helper-before-c-source-removal
