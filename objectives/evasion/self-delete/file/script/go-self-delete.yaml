defaults:
  attack: T1070.004
  mbc: F0007
  platforms: [linux, windows]
  for: [elf, pe, go]
traits:
  - id: go-self-destruct-path
    desc: Hidden deletion script path
    crit: component
    if:
      type: text
      regex: '%s/\.del_.{1,10}\.sh'
  - id: go-self-destruct-msg
    desc: Self-destruct wait message (Chinese)
    crit: component
    conf: 0.95
    if:
      type: hex
      section: rodata
      pattern: E7 AD 89 E5 BE 85 E5 8E 9F E8 BF 9B E7 A8 8B E9 80 80 E5 87 BA
  - id: go-remove-self-helper-call
    desc: Go source invokes a RemoveSelf helper
    crit: notable
    conf: 0.93
    for: [go]
    if:
      type: symbol
      kind: call
      regex: '(^|\.)RemoveSelf$'
  - id: go-exit-command-sentinel
    desc: Go recognizes repeated exit sentinel
    crit: notable
    conf: 0.92
    for: [go]
    if:
      type: text
      regex: '\bexit(exit){2,}\b'
composite_rules:
  - id: go-self-destruct-sh
    desc: Drops a hidden shell script to delete self
    crit: notable
    conf: 0.9
    any:
      - id: objectives/evasion/self-delete/file/script::go-self-destruct-path
      - id: objectives/evasion/self-delete/file/script::go-self-destruct-msg
  - id: go-c2-commanded-self-removal
    desc: Go C2 agent accepts a kill command and removes itself
    crit: hostile
    conf: 0.995
    attack: "T1070.004,T1102.002"
    for: [go]
    all:
      - id: objectives/command-and-control/backdoor/implant::go-slack-history-poller
      - id: go-exit-command-sentinel
      - id: go-remove-self-helper-call
