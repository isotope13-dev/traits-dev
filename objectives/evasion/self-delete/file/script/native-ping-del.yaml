# A single loopback ping (-n 1) does not establish a delay. These observations
# belong with script-mediated self-deletion, including when native code builds
# and launches the command. Matcher scope and criticality are preserved.
defaults:
  platforms: [windows]
  for: [pe, dll]
  attack: T1070.004

composite_rules:
  - id: stack-built-ping-self-delete-x86
    desc: Own-path lookup with stack-built ping-del and WinExec references
    crit: suspicious
    conf: 0.98
    arch: [x86]
    all:
      - id: micro-behaviors/process/create/shell/script-host::stack-built-cmd-ping-x86
      - id: micro-behaviors/fs/delete/file/command::stack-built-del-format-x86
      - id: micro-behaviors/process/info/current::get-module-filename
      - id: micro-behaviors/process/create/exec::winexec
    unless:
      - id: metadata/signed/platform/

  - id: wininet-office-self-delete-rat
    desc: Office-disguised HTTP RAT with own-image deletion references
    crit: hostile
    conf: 0.99
    all:
      - id: stack-built-ping-self-delete-x86
      - id: objectives/evasion/masquerade/version-resource/office-suite::http-rat-office-version-masquerade
    unless:
      - id: metadata/signed/platform/
