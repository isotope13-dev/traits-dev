defaults:
  platforms: [windows]
  for: [powershell]
composite_rules:
  - id: offset-archive-stored-selfpath-removal
    desc: Concealed archive launcher attempts self-delete
    crit: hostile
    conf: 0.98
    attack: T1070.004
    # Bind the deleted environment variable to the cleartext self-path
    # assignment. Generic environment-path cleanup remains a separate finding.
    # This is an attempted effect: dynamic ScriptBlock invocation can change
    # MyInvocation.MyCommand.Path, and runtime deletion need not succeed.
    all:
      - id: objectives/execution/payload/file-exec/command/script-host-embedded::offset-passworded-archive-hidden-launch
      - id: metadata/lang/encoding/shape::negative-offset-stored-selfpath-removal
