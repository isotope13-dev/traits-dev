# Self-deletion is required, while the nearby fetch/decode/write/start calls
# do not establish an executed downloaded file.
defaults:
  platforms: [windows]
  for: [powershell]

composite_rules:
  - id: powershell-self-delete-http-decode-start-profile
    desc: PowerShell self-delete near HTTP/decode/start
    crit: suspicious
    conf: 0.99
    attack: T1070.004
    near_bytes: 16384
    all:
      - id: micro-behaviors/process/create/start-process::powershell-http-decode-write-start-profile
      - id: objectives/evasion/self-delete/file/script::self-delete-powershell
