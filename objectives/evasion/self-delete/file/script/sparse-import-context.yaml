# Self-deletion context does not establish an implant or a network relay.
composite_rules:
- for:
  - pe
  platforms:
  - windows
  attack: T1070.004
  id: api-hash-candidate-self-delete
  desc: Own-path deletion with API-hash candidate
  crit: suspicious
  conf: 0.9
  all:
  - id: objectives/anti-static/obfuscation/binary-metrics/sparse-imports::api-hash-candidate-code-dominant-profile
  - id: objectives/evasion/self-delete/file/script::module-path-delete
  unless:
  - id: metadata/signed/platform/
  - id: well-known/dual-use/tunnel/swifttunnel_vpn/
  downgrade:
    any:
    - id: metadata/binary/symbols/count::many-imports
