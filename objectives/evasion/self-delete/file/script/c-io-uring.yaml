defaults:
  platforms: [linux]
  for: [c, cpp, elf]
  attack: T1070.004
  mbc: F0007

traits:
  - id: selfdestruct-command-handler
    desc: Contains a self-destruction command keyword
    crit: notable
    conf: 0.98
    if:
      type: literal
      kind: string
      exact: selfdestruct

composite_rules:
  - id: commanded-io-uring-self-delete
    desc: Commanded agent deletes its own executable
    crit: hostile
    conf: 0.995
    all:
      - id: selfdestruct-command-handler
      - id: micro-behaviors/fs/proc/info/path::process-self-exe-path
      - id: micro-behaviors/fs/file/delete::io-uring-unlinkat
