defaults:
  platforms:
  - windows
  - unix
  for:
  - javascript
  - typescript
  attack: T1070
composite_rules:
- id: platform-url-self-delete-profile
  desc: Platform branch and URL with self-delete
  crit: suspicious
  conf: 0.9
  scope: file
  all:
  - id: micro-behaviors/os/sysinfo/platform/branch::node-os-platform-alias-branch
  - id: micro-behaviors/os/module/require::child-process-require
  - id: micro-behaviors/communications/http/url/domain::js-remote-host-url
  any:
  - id: objectives/evasion/self-delete/file/script::node-self-delete
- id: npm-platform-url-self-delete-profile
  for:
  - javascript
  - typescript
  - json
  - package.json
  - npm
  desc: Npm postinstall with platform URL cleanup
  crit: suspicious
  conf: 0.98
  scope: archive
  all:
  - id: metadata/package/scripts/lifecycle::postinstall-hook-declaration
  - id: objectives/evasion/self-delete/file/script::platform-url-self-delete-profile
  unless:
  - id: well-known/tool/development/editor/vscodium::archive-context
