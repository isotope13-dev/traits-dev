defaults:
  platforms:
    - unix
    - windows
  for:
    - powershell
    - batch
  mbc: F0007
  attack: T1070.004
traits:
  - id: remove-ps1
    desc: Remove current PowerShell script
    crit: suspicious
    conf: 0.8
    if:
      type: text
      regex: 'Remove-Item.{0,80}(\$PSCommandPath|\$MyInvocation\.MyCommand\.Path|%~f0)'
      case_insensitive: true
    unless:
      - id: well-known/app/ai/agent-runtime/aui-agent-builder/
      - id: metadata/package/testing/presence/harness::tests-path-filename
      - id: well-known/app/infrastructure/ansible::ansible-powershell-context
      - id: metadata/build/generated::powershell-generated-temp-runner
      # Lessons and skill docs sniffed as PowerShell still quote this cmdlet.
      - id: metadata/file/extension/identity::markdown-powershell-basename
    not:
      - substr: install-opentofu.ps1
  - id: remove-command-path
    desc: Remove script via PowerShell command path
    crit: suspicious
    conf: 0.85
    if:
      type: text
      regex: Remove-Item\s+\$PSCommandPath(\s|$)
      case_insensitive: true
    unless:
      - id: well-known/app/infrastructure/ansible::ansible-python-package-path
      - id: well-known/app/infrastructure/ansible::ansible-powershell-context
composite_rules:
  - id: powershell-self-delete-variable
    desc: PowerShell script deletes stored script path
    crit: suspicious
    conf: 0.9
    for: [powershell]
    all:
      - id: micro-behaviors/process/info/selfpath::powershell-script-path-stored
      - id: micro-behaviors/fs/delete/file/command::powershell-remove-item-force

  - id: self-delete-powershell
    desc: Self-deleting PowerShell
    crit: suspicious
    conf: 0.75
    any:
      - id: remove-ps1
      - id: remove-command-path
      - id: powershell-self-delete-variable

  - id: powershell-dropper-self-delete
    desc: PowerShell dropper executes staged payload and self-deletes
    crit: hostile
    conf: 0.98
    for: [powershell]
    attack: T1070.004,T1105,T1059.001
    all:
      - id: self-delete-powershell
      - id: micro-behaviors/process/create/hidden::start-process-windowstyle-hidden
    any:
      - id: micro-behaviors/process/create/installer::quiet-msi-process-start
      - id: micro-behaviors/process/create/start-process::start-process-filepath


