defaults:
  platforms:
    - unix
    - windows
  for:
    - powershell
    - batch
  mbc: F0007
  attack: T1070.004
traits:
  - id: remove-ps1
    desc: Remove current PowerShell script
    crit: notable
    conf: 0.8
    if:
      type: text
      regex: 'Remove-Item.{0,80}(\$PSCommandPath|\$MyInvocation\.MyCommand\.Path|%~f0)'
      case_insensitive: true
    not:
      - substr: install-opentofu.ps1
  - id: remove-command-path
    desc: Remove script via PowerShell command path
    crit: notable
    conf: 0.85
    if:
      type: text
      regex: Remove-Item\s+\$PSCommandPath(\s|$)
      case_insensitive: true
composite_rules:
  - id: powershell-self-delete-variable
    desc: PowerShell script deletes stored script path
    crit: suspicious
    conf: 0.9
    for: [powershell]
    near_lines: 30
    all:
      - id: micro-behaviors/process/info/selfpath::powershell-script-path-stored
      - id: micro-behaviors/fs/delete/file/command::powershell-remove-item-script-path
    unless:
      - id: well-known/app/ai/gateway/ccs::ccs-benign-context
      - id: well-known/tool/browser::network-scanner-context
      - id: micro-behaviors/os/package-manager/management::windows-uninstaller-completion-banner
      - id: well-known/tool/sysadmin/winutil::winutil-utility-context
      - id: well-known/app/infrastructure/cf-server-monitor::cf-server-monitor-context

  - id: self-delete-powershell
    desc: Self-deleting PowerShell
    crit: notable
    conf: 0.75
    any:
      - id: remove-ps1
      - id: remove-command-path
      - id: powershell-self-delete-variable

  - id: powershell-hidden-launch-self-delete
    desc: Self-deletion with hidden PowerShell process launch
    crit: suspicious
    conf: 0.98
    for: [powershell]
    near_lines: 30
    all:
      - id: self-delete-powershell
      - id: micro-behaviors/process/create/hidden::start-process-windowstyle-hidden
    any:
      - id: metadata/file/profile/installer/lifecycle::quiet-msi-process-start
      - id: micro-behaviors/process/create/cmdlet::start-process-call
    unless:
      # An uninstaller that announces completion removes its own install
      # directory including itself; the staged cleanup and hidden window
      # finish a declared removal, not a concealed payload execution.
      - id: micro-behaviors/os/package-manager/management::windows-uninstaller-completion-banner
      - id: well-known/tool/sysadmin/winutil::winutil-utility-context
      - id: well-known/app/infrastructure/cf-server-monitor::cf-server-monitor-context


