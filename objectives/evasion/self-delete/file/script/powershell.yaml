defaults:
  platforms:
    - unix
    - windows
  for:
    - powershell
    - batch
  mbc: F0007
  attack: T1070.004
traits:
  - id: remove-item
    desc: Remove-Item cmdlet
    crit: component
    conf: 0.6
    for:
      - powershell
    if:
      type: string_literal
      regex: Remove-Item|\bdel\b|\bri\b
      case_insensitive: true
  - id: remove-ps1
    desc: Remove current PowerShell script
    crit: suspicious
    conf: 0.8
    if:
      type: text
      regex: 'Remove-Item.{0,80}(\$PSCommandPath|\$MyInvocation\.MyCommand\.Path|%~f0)'
      case_insensitive: true
    unless:
      - id: well-known/app/ai/agent-runtime/aui-agent-builder/
      - id: metadata/package/testing/presence/harness::tests-path-filename
      - id: metadata/file/profile/identity::ansible-powershell-context
    not:
      - substr: install-opentofu.ps1
  - id: remove-command-path
    desc: Remove script via PowerShell command path
    crit: suspicious
    conf: 0.85
    if:
      type: text
      regex: Remove-Item\s+\$PSCommandPath(\s|$)
      case_insensitive: true
    unless:
      - id: metadata/file/profile/identity::ansible-python-package-path
      - id: metadata/file/profile/identity::ansible-powershell-context
composite_rules:
  - id: self-delete-powershell
    desc: Self-deleting PowerShell
    crit: suspicious
    conf: 0.75
    any:
      - id: remove-ps1
      - id: remove-command-path
