defaults:
  platforms: [windows]
  for: [go]
traits:
  - id: go-formatted-executable-and-batch-self-delete
    desc: Go batch deletes an executable and itself
    crit: suspicious
    conf: 0.99
    attack: T1070.004
    if:
      type: symbol
      kind: call
      exact: fmt.Sprintf
      arg:
        index: 0
        kind: string
        regex: 'del /f /q "%s"[\s\S]{0,80}del /f /q "%%~f0"'
