# Self-Deletion Detection - Unix
# MBC: F0007 (Self Deletion)
# ATT&CK: T1070.004
defaults:
  attack: T1070.004
  mbc: F0007
  platforms: [unix, android, ios]
  for: [binaries]
traits:
  - id: self-delete-unlink
    desc: Self-deleting via unlink
    crit: suspicious
    conf: 0.66
    if:
      type: text
      substr: "unlink(argv[0])"
  - id: native-rm-self-literal-target
    desc: rm -f names the running binary
    platforms: [unix]
    crit: notable
    conf: 0.9
    for: [c, cpp, objc, elf, macho]
    if:
      type: text
      regex: '(?i)\brm\s+-f\b[^;\n]{0,80}(\$0|/proc/self|argv\[0\])'
  - id: native-proc-self-path-unlink
    desc: Unlinks the buffer filled by self-exe readlink
    crit: suspicious
    conf: 0.95
    platforms: [linux]
    for: [c, cpp]
    # Proximity alone paired autostart-shortcut cleanup with a separate
    # executable lookup. Require adjacent statements using the same buffer;
    # the anchor prevents an intervening overwrite from changing its target.
    if:
      type: tree-sitter
      query: |
        ((compound_statement
          (expression_statement
            (call_expression
              function: (identifier) @readlink
              arguments: (argument_list
                . (string_literal) @path
                . (identifier) @buffer
                . (_))))
          . (expression_statement
            (call_expression
              function: (identifier) @unlink
              arguments: (argument_list . (identifier) @target .)))) @deletion
          (#eq? @readlink "readlink")
          (#eq? @path "\"/proc/self/exe\"")
          (#eq? @unlink "unlink")
          (#eq? @buffer @target))
composite_rules:
  - id: native-rm-self-command
    desc: Native rm self command
    crit: suspicious
    conf: 0.94
    platforms: [unix]
    for: [c, cpp, objc, elf, macho]
    all:
      - id: micro-behaviors/fs/delete/file/command::native-shell-rm-force
      - id: native-rm-self-literal-target
  - id: native-proc-rm-self-delete
    desc: Native proc self-delete
    crit: hostile
    conf: 0.98
    platforms: [unix]
    for: [c, cpp, objc, elf, macho]
    all:
      - id: micro-behaviors/fs/proc/exe::process-self-exe-path
      - id: native-rm-self-command
