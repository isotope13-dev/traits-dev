# A replacing process cannot delete its own image while it runs, so the
# PowerShell form of the delayed self-delete waits out the running process id
# and then removes the literal path. The same cleanup removes an installer's
# predecessor, so it stays suspicious rather than hostile.
defaults:
  platforms: [windows]
  for: [pe, dll, powershell, batch]
  attack: T1070.004
  mbc: F0007

traits:
  - id: wait-process-literal-path-delete
    desc: Waits out a pid, deletes literal path
    crit: suspicious
    conf: 0.93
    if:
      # The command pieces are separate literals beside each other in .rdata,
      # so scan raw bytes; the string extractor splits them apart.
      type: raw
      regex: '(?i)Wait-Process\s+-Id[\s\S]{0,160}Remove-Item\s+-LiteralPath'
    downgrade:
      any:
        - id: metadata/signed/platform/
