defaults:
  platforms: [windows, unix]
  for: [scripts, binaries]
  attack: T1070.004
traits:
- id: ping-zero-del-self-delete
  desc: Self-delete via ping 0 delay and del
  crit: suspicious
  conf: 0.95
  platforms: [windows]
  if:
    type: text
    regex: 'ping\s+0\s*&\s*del\b'
- id: command-com-del-self-delete
  desc: Self-delete via COMMAND.COM DEL command
  crit: suspicious
  conf: 0.92
  platforms: [windows]
  if:
    type: text
    exact: 'COMMAND.COM /C DEL %s'
- id: ping-testnet-delay-del-command
  desc: Ping testnet delay followed by file deletion
  crit: suspicious
  conf: 0.98
  platforms: [windows]
  for: [scripts, binaries, data]
  if:
    type: text
    regex: '(?is)ping\s+192\.0\.2\.\d+.{0,60}del\s+/s'

composite_rules:
- id: ping-self-delete
  desc: Ping delay pattern used by self-delete routines
  crit: notable
  conf: 0.95
  any:
  - id: ping-zero-del-self-delete
  - id: command-com-del-self-delete
  - id: ping-testnet-delay-del-command
  unless:
  # Redis and other network protocols use "PING" as a keepalive command —
  # not a shell ping. Exclude files that contain Redis/database client
  # protocol markers where PING is a protocol verb, not a shell command.
  - id: micro-behaviors/communications/ip/services::memcached-client-import
  - id: micro-behaviors/communications/ip/services::pymemcache-module
  - id: micro-behaviors/communications/ip/services::redis-ping-protocol
  - id: micro-behaviors/communications/http/websocket::ping-pong-json
  - id: micro-behaviors/communications/http/websocket::ping-pong-pair

- id: ping-delayed-batch-self-delete
  desc: Ping-delayed cascading batch self-delete
  crit: hostile
  conf: 0.99
  platforms: [windows]
  for: [scripts, binaries, data]
  all:
    - id: ping-testnet-delay-del-command
    - id: micro-behaviors/fs/delete/file/self::batch-self-delete
