defaults:
  platforms: [windows]
  for: [binaries, scripts]
  attack: T1070.004

traits:
  - id: cmd-ping-localhost-del-self-delete
    desc: Cmd ping delay self delete
    crit: suspicious
    conf: 0.98
    if:
      type: text
      regex: '(?i)cmd(\.exe)?\s+/c\s+ping\s+127\.0\.0\.1\s+-n\s+6\s*>\s*nul\s*&&\s*del\s+/f\s+/q'

  - id: native-timeout-del-self
    desc: Native delayed self-delete command
    crit: suspicious
    conf: 0.95
    for: [c, cpp, pe, dll]
    if:
      type: string_literal
      regex: '(?i)cmd(\.exe)?\s+/c\s+timeout\s+/t\s+\d+\s*&\s*del\s+/f\s+/q'

composite_rules:
  - id: stack-built-ping-self-delete-x86
    desc: Own-path deletion via a stack-built ping-del command
    crit: suspicious
    conf: 0.98
    for: [pe, dll]
    arch: [x86]
    all:
      - id: micro-behaviors/process/create/shell/script-host::stack-built-cmd-ping-x86
      - id: micro-behaviors/fs/file/delete::stack-built-del-format-x86
      - id: micro-behaviors/process/info/current::get-module-filename
      - id: micro-behaviors/process/create/exec::winexec
    unless:
      - id: metadata/signed/platform/

  - id: wininet-office-self-delete-loader
    desc: Office-masquerading WinInet loader self-deletes via hidden cmd
    crit: hostile
    conf: 0.99
    for: [pe, dll]
    all:
      - id: stack-built-ping-self-delete-x86
      - id: micro-behaviors/communications/http/dynamic::dynamic-wininet-http-api-cluster
      - id: objectives/evasion/masquerade/version-resource/claim::fake-microsoft-office-binary
    unless:
      - id: metadata/signed/platform/
