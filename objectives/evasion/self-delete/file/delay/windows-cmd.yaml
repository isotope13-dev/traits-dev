defaults:
  platforms: [windows]
  for: [binaries, scripts]
  attack: T1070.004

traits:
  - id: copy-ping-as-temp-executable
    desc: Copies ping.exe as temporary executable
    crit: notable
    conf: 0.97
    for: [pe, dll]
    if:
      type: text
      regex: '(?i)copy\s+/y.{0,80}\\ping\.exe.{0,80}\\[^\\\r\n"]{1,60}\.exe'

  - id: temp-executable-loopback-delay
    desc: Runs temporary executable as loopback delay
    crit: notable
    conf: 0.95
    for: [pe, dll]
    if:
      type: text
      regex: '(?i)%TEMP%\\[^"\r\n]{1,60}\.exe"?\s+127\.(0\.0\.)?1\s+-n\s+\d+'

  - id: batch-retry-target-delete-loop
    desc: Retries deleting batch argument
    crit: notable
    conf: 0.97
    for: [pe, dll]
    if:
      type: text
      regex: '(?is)del\s+%1.{0,200}if\s+exist\s+%1\s+goto'

  - id: cmd-ping-localhost-del-self-delete
    desc: Cmd ping delay self delete
    crit: suspicious
    conf: 0.98
    if:
      type: text
      regex: '(?i)cmd(\.exe)?\s+/c\s+ping\s+127\.0\.0\.1\s+-n\s+6\s*>\s*nul\s*&&\s*del\s+/f\s+/q'

  - id: native-timeout-del-self
    desc: Native delayed self-delete command
    crit: suspicious
    conf: 0.95
    for: [c, cpp, pe, dll]
    if:
      # The command may carry its cmd.exe prefix in the same literal, or be
      # split across a ShellExecute file/parameter pair ("/c timeout ...").
      # del flag order varies between builds (/f /q and /q /f both occur).
      type: text
      regex: '(?i)(^|[^a-z0-9_])(cmd(\.exe)?\s+)?(/c\s+)?timeout\s+/t\s+\d+\s*&\s*del\s+/[fq]\s+/[fq]'

composite_rules:
  - id: copied-ping-helper-delete-loop
    desc: Copied ping helper repeatedly deletes target
    crit: suspicious
    conf: 0.99
    for: [pe, dll]
    all:
      - id: copy-ping-as-temp-executable
      - id: temp-executable-loopback-delay
      - id: batch-retry-target-delete-loop
    near_bytes: 768

  - id: rwx-stage-choice-selfwipe
    desc: RWX in-memory stage with choice-delay self-wipe
    crit: hostile
    conf: 0.97
    attack: T1620,T1070.004
    for: [c, cpp]
    all:
      - id: micro-behaviors/mem/alloc/executable::virtualalloc-rwx-source
      - id: micro-behaviors/fs/delete/file/command::choice-delayed-file-delete-command
    near_lines: 200
