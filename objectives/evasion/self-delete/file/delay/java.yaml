defaults:
  platforms: [windows, unix, android]
  # Class-scoped: the delete/sleep/wait/exec legs are per-class bytecode
  # symbols. Allowing jar/apk lets an archive root pool them from unrelated
  # member jars, so any multi-library JVM distribution matches by coincidence.
  for: [class]
  attack: T1070.004
  mbc: F0007
composite_rules:
  - id: java-bytecode-delayed-file-delete
    desc: Java bytecode delayed file deletion
    crit: notable
    conf: 0.95
    all:
      - id: micro-behaviors/fs/delete/file::java-file-delete-bytecode
      - id: micro-behaviors/process/control/wait::java-process-waitfor-bytecode
      - id: micro-behaviors/time/sleep/interval::java-thread-sleep-bytecode
    any:
      - id: micro-behaviors/process/create/spawn::java-runtime-exec-bytecode-symbol
      - id: micro-behaviors/process/create/spawn::java-processbuilder-start-bytecode
    unless:
      - id: well-known/tool/development/gradle-wrapper::gradle-wrapper-jar
      - id: well-known/tool/development/gradle-wrapper::gradle-wrapper-archive-member
      - id: metadata/library/structure::vscode-language-server-library
