# Preserved from exfiltration/stealer/browser. The required result is delayed
# self-deletion; an HTTP client and browser SQL do not prove an upload.
defaults:
  crit: hostile
  platforms: [windows]
  for: [c, cpp]
composite_rules:
  - id: browser-helper-stage-delayed-self-delete
    desc: Browser helper staging with delayed self-delete
    conf: 0.98
    attack: T1105,T1070.004
    all:
      - id: micro-behaviors/data/db/access::chromium-login-sql
      - id: micro-behaviors/communications/http/client/wininet::wininet-staged-request-source
      - id: objectives/evasion/self-delete/file/delay::native-timeout-del-self
      - id: micro-behaviors/communications/http/client/wininet::wininet-http-client-src
