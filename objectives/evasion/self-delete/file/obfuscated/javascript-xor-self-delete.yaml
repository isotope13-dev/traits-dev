defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]

composite_rules:
  - id: self-cleaning-dropper
    desc: XOR decoding and script self-deletion clues
    crit: suspicious
    conf: 0.95
    attack: T1070.004
    all:
      - id: micro-behaviors/data/decode/xor/reconstruction::javascript-xor-string-decoding-clues
    any:
      - id: micro-behaviors/fs/delete/file/self::node-self-delete
      - id: objectives/evasion/self-delete/file/script::manifest-swap
