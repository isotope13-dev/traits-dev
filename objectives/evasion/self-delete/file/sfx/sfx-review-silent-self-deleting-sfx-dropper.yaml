defaults:
  platforms: [windows]
  for: [pe]

composite_rules:
- id: silent-self-deleting-sfx-dropper
  desc: Silent SFX runs payload then self-deletes
  crit: hostile
  conf: 0.97
  attack: T1204.002,T1070.004
  mbc: B0023
  all:
    - id: micro-behaviors/fs/delete/file/self::sfx-self-delete-directive
    - id: micro-behaviors/process/config/installer::sfx-runprogram-escaped-quote-value
    - id: micro-behaviors/ui/controls/progress::sfx-progress-disabled
    - id: metadata/signature/absent::unsigned-missing-signature-record
  unless:
    - id: metadata/installer/product/

