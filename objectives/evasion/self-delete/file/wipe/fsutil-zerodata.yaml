# Wipe-then-delete self-removal used by Thanos-builder ransomware (and
# LockBit): delay, zero the payload bytes with fsutil, then Del so the
# executable cannot be recovered from disk.
defaults:
  platforms: [windows]
  for: [batch, powershell, pe, python, javascript, csharp]
  attack: T1070.004
  mbc: F0007

traits:
  - id: fsutil-setzerodata
    desc: fsutil file setZeroData wipe
    crit: suspicious
    conf: 0.96
    if:
      type: text
      regex: '(?i)\bfsutil(\.exe)?\s+file\s+setZeroData\b'

  - id: ping-127-0-0-7-delay
    desc: Ping delay via 127.0.0.7 loopback
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: '(?i)\bping(\.exe)?\s+127\.0\.0\.7\b'

  - id: choice-timed-default-delay
    desc: choice timed default delay before delete
    crit: notable
    conf: 0.93
    if:
      type: text
      regex: '(?i)\bchoice(\.exe)?\s+/C\s*Y\s+/N\s+/D\s*Y\s+/T\s*\d+'

  - id: cmd-del-force-quiet
    desc: cmd force-quiet file delete
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)\b(Del|del|Erase)\s+/[Ff]\s+/[Qq]\b'

composite_rules:
  - id: fsutil-zerodata-self-delete
    desc: Zeros file contents then deletes the payload
    crit: hostile
    conf: 0.98
    all:
      - id: fsutil-setzerodata
    any:
      - id: cmd-del-force-quiet
      - id: micro-behaviors/fs/file/delete::batch-self-delete
    near_lines: 2

  - id: delayed-fsutil-zerodata-self-delete
    desc: Delayed wipe-and-delete of the running payload
    crit: hostile
    conf: 0.99
    all:
      - id: fsutil-zerodata-self-delete
    any:
      - id: ping-127-0-0-7-delay
      - id: choice-timed-default-delay
    near_lines: 2
