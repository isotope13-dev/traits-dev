# Wipe-then-delete self-removal used by Thanos-builder ransomware (and
# LockBit): delay, zero the payload bytes with fsutil, then Del so the
# executable cannot be recovered from disk.
defaults:
  platforms: [windows]
  for: [batch, powershell, pe, python, javascript, csharp]
  attack: T1070.004
  mbc: F0007

composite_rules:
  - id: fsutil-zerodata-self-delete
    desc: Zeros file contents then deletes the payload
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/fs/write/content::fsutil-file-setzerodata-command
    any:
      - id: micro-behaviors/fs/delete/file/command::cmd-del-force-quiet
      - id: micro-behaviors/fs/delete/file/self::batch-self-delete
    near_lines: 2

  - id: delayed-fsutil-zerodata-self-delete
    desc: Delayed wipe-and-delete of the running payload
    crit: hostile
    conf: 0.99
    all:
      - id: fsutil-zerodata-self-delete
    any:
      - id: micro-behaviors/time/sleep/interval::ping-127-0-0-7-delay
      - id: micro-behaviors/time/sleep/interval::choice-timed-default-delay
    near_lines: 2
