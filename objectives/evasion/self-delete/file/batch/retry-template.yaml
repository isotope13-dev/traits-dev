# Native self-deletion through a retry batch: the binary carries a batch
# template that deletes a path, loops back while the path still exists (the
# running image stays locked until its process exits), then removes the
# directory and the batch itself. The %s slots are filled with the program's
# own module path. Some uninstallers erase themselves this way, so the
# template alone is suspicious; paired with unpacking and launching an
# embedded payload and a hardcoded raw-IP endpoint it is a dropper wiping its
# own tracks.
#
# Worked example: Urelas, which extracts IDR_BINARY to %TEMP%, launches it,
# reports to 218.54.31.x and erases itself with ":Repeat / del / if exist
# goto Repeat / rmdir / del".
defaults:
  for: [pe, dll]
  platforms: [windows]
  attack: T1070.004
  mbc: F0007

traits:
  - id: native-retry-delete-batch-template
    desc: Retry-until-gone delete batch template
    crit: suspicious
    conf: 0.92
    if:
      type: raw
      regex: '(?i)del\s+"%s"\s*\r?\n\s*if\s+exist\s+"%s"\s+goto\s+\w+'

composite_rules:
  - id: resource-dropper-raw-ip-self-delete
    desc: Resource dropper with raw-IP endpoint self-deletes via batch
    crit: hostile
    conf: 0.95
    attack: T1070.004,T1027.009,T1105
    all:
      - id: native-retry-delete-batch-template
      - id: micro-behaviors/data/embedded/payload/resource::pe-resource-full-extraction
      - id: micro-behaviors/process/create/shellexec::shell-execute
      - id: micro-behaviors/communications/ip/literal::external-ipv4-host-literal-binary
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/installer/family/
