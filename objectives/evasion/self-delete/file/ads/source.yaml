# Self-delete by alternate data stream copy: the file's own bytes are
# copied into an NTFS named stream hanging off the same file, and the
# host file is then deleted. Nothing leaves a delete-the-stream call in
# behavior logs, and the copy rides inside the file record where few
# inventory tools look.
defaults:
  platforms: [windows]
  for: [c, cpp, csharp, rust, source, scripts, powershell]
  attack: T1070.004,T1564.004

composite_rules:
  - id: self-delete-via-ads-copy
    for: [c]
    desc: Copies self into an alternate data stream and deletes the host file
    crit: hostile
    conf: 0.96
    near_lines: 40
    all:
      - id: micro-behaviors/fs/path/stream::ntfs-stream-format-specifier
      - id: micro-behaviors/fs/delete/file/library::deletefile-a
