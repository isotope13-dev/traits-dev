defaults:
  platforms: [windows]
  for: [batch]
composite_rules:
- id: batch-registry-import-task-self-delete
  desc: Self-deleting batch imports registry and tasks
  crit: hostile
  conf: 0.9
  attack: T1070.004,T1112,T1053.005
  all:
  - id: objectives/evasion/self-delete/scripts::batch-percent-zero-self-delete
  - id: micro-behaviors/os/registry/import::reg-exe-import-command
  - id: micro-behaviors/os/autorun/scheduled::register-scheduledtask
  any:
  - id: micro-behaviors/os/sysinfo/platform/locale::registry-user-geo-key
  - id: micro-behaviors/process/argument/interpreter::powershell-windowstyle-hidden-option
