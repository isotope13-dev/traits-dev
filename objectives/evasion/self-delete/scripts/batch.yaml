# Classic CMD self-deletion: the script deletes its own image (%0 / %~f0),
# usually after a delay so CMD can read past the running line. Detects both
# native batch files and other sources that embed the idiom as a template
# (droppers carrying a self-cleaning helper script).
defaults:
  platforms: [windows]
  for: [batch, c, cpp, powershell]
  attack: T1070.004

traits:
  - id: batch-percent-zero-self-delete
    desc: Batch self-deletion command via %0
    crit: suspicious
    conf: 0.9
    for: [batch, c, cpp, powershell, text]
    if:
      type: text
      regex: '(?i)\bdel\s+[^%\r\n]{0,40}%(~f)?%?0\b'
