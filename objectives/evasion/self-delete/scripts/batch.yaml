# Classic CMD self-deletion: the script deletes its own image (%0 / %~f0),
# usually after a delay so CMD can read past the running line. Detects both
# native batch files and other sources that embed the idiom as a template
# (droppers carrying a self-cleaning helper script).
defaults:
  platforms: [windows]
  for: [batch, c, cpp, powershell]
  attack: T1070.004

traits:
  - id: batch-percent-zero-self-delete
    desc: Self-deletion command text via %0
    crit: suspicious
    conf: 0.9
    if:
      type: text
      regex: '(?i)\bdel\s+[^%\r\n]{0,40}%(~f)?%?0\b'
    unless:
      - id: well-known/game/amiberry::amiberry-emulator-context

  - id: batch-piped-script-delete
    desc: Batch pipes command into script deletion
    crit: suspicious
    conf: 0.92
    for: [batch, text]
    if:
      type: text
      regex: '(?i)\|\s*del\s+[^\r\n]{0,60}\.bat\b'

composite_rules:
  - id: batch-copy-and-delete-staging-script
    desc: Batch copies payload and deletes staging script
    crit: hostile
    conf: 0.96
    for: [batch]
    all:
      - id: micro-behaviors/fs/file/copy/source-destination::windows-copy-command
      - id: batch-piped-script-delete

  - id: self-deleting-ftp-dropper-batch
    desc: Self-deleting batch dropper using scripted FTP
    crit: hostile
    conf: 0.98
    for: [batch]
    attack: T1070.004,T1105
    all:
      - id: batch-percent-zero-self-delete
      - id: micro-behaviors/communications/ftp/client::windows-ftp-script-command
      - id: micro-behaviors/process/create/shell/command-mode::start-unquoted-executable-command

  - id: batch-powershell-exec-self-delete
    desc: Batch script launches payload and deletes itself via hidden PowerShell
    crit: hostile
    conf: 0.98
    for: [batch]
    attack: T1070.004,T1059.001,T1564.003
    all:
      - id: objectives/evasion/self-delete/file/script::remove-ps1
      - id: micro-behaviors/process/create/hidden::powershell-hidden-window
      - id: micro-behaviors/process/argument/option::powershell-c-flag

