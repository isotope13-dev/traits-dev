defaults:
  platforms: [windows]

composite_rules:
  - id: self-deleting-hidden-encoded-command-relay
    desc: Hidden EncodedCommand relay with self-delete
    crit: hostile
    conf: 0.99
    attack: T1027,T1059.001,T1564.003
    for: [javascript, typescript]
    all:
      - id: objectives/anti-static/obfuscation/string/fragmentation::js-powershell-encodedcommand-array-fragments
      - id: micro-behaviors/process/create/flags::wscript-shell-run-hidden-window
      - id: micro-behaviors/process/create/spawn::detached-ignored-unref-spawn
    any:
      - id: micro-behaviors/fs/delete/file/self::fso-delete-scriptfullname
      - id: micro-behaviors/fs/delete/file/self::createobject-delete-scriptfullname

  - id: wsh-cscript-relaunch-self-deleting-dropper
    desc: WSH dropper relaunches via cscript, pipes PowerShell and self-deletes
    crit: hostile
    conf: 0.99
    attack: T1070.004,T1059.007,T1059.001
    for: [javascript, vbs]
    all:
      - id: micro-behaviors/os/com/automation::filesystemobject-constructor
      - id: micro-behaviors/process/info/selfpath::wscript-scriptfullname
      - id: micro-behaviors/fs/delete/file/library::wsh-deletefile-call
      - id: micro-behaviors/process/create/flags::wscript-shell-hidden-run
      - id: micro-behaviors/process/io/stream::wsh-exec-stdin-write-close
