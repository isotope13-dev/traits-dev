defaults:
  platforms: [windows]

composite_rules:
  - id: self-deleting-hidden-encoded-command-relay
    desc: Hidden EncodedCommand relay with self-delete
    crit: hostile
    conf: 0.99
    attack: T1027,T1059.001,T1564.003
    for: [javascript, typescript]
    all:
      - id: objectives/anti-static/obfuscation/string/fragmentation::js-powershell-encodedcommand-array-fragments
      - id: micro-behaviors/process/create/flags::wscript-shell-run-hidden-window
      - id: micro-behaviors/process/create/spawn::detached-ignored-unref-spawn
    any:
      - id: micro-behaviors/fs/delete/file/self::fso-delete-scriptfullname
      - id: micro-behaviors/fs/delete/file/self::createobject-delete-scriptfullname

  - id: wsh-stdin-dropper-self-delete
    desc: WSH stdin loader deletes its own script
    crit: hostile
    conf: 0.99
    attack: T1070.004,T1059.007,T1059.001
    for:
    - javascript
    - vbs
    all:
    - id: objectives/execution/payload/script-eval::wsh-hidden-decode-download-eval
    any:
    - id: micro-behaviors/fs/delete/file/self::wsh-delete-bound-own-script
    - id: micro-behaviors/fs/delete/file/self::fso-delete-scriptfullname
    - id: micro-behaviors/fs/delete/file/self::createobject-delete-scriptfullname
