# Scripts that collect host identity or screenshots, transmit them over HTTP
# POST/multipart upload, and then delete their own source file (`__FILE__`,
# `__file__`, `__filename`) to remove evidence after execution.
defaults:
  platforms: [unix, windows]
  attack: T1070.004,T1041
  mbc: F0007

composite_rules:
  - id: ruby-http-exfil-then-self-delete
    for: [ruby]
    desc: Ruby HTTP exfiltration followed by self-delete
    crit: hostile
    conf: 0.98
    near_bytes: 4096
    all:
      - id: micro-behaviors/fs/delete/file/self::ruby-delete-self-file
      - id: micro-behaviors/communications/http/post::net-http-post
    any:
      - id: micro-behaviors/hardware/display/screenshot/unspecified::macos-screencapture-invocation
      - id: micro-behaviors/process/identity/query/command::whoami-command-backtick
      - id: micro-behaviors/communications/http/request/body/command-output::ruby-form-post-identity-command
      - id: micro-behaviors/communications/http/request/encoded::ruby-form-post-base64-destination

  - id: python-http-exfil-then-self-delete
    for: [python]
    desc: Python HTTP exfiltration followed by self-delete
    crit: hostile
    conf: 0.97
    near_bytes: 4096
    all:
      - id: micro-behaviors/fs/delete/file/self::python-delete-self-file
      - id: micro-behaviors/communications/http/post::python-http-post-request
    any:
      - id: micro-behaviors/process/identity/query/command::python-subprocess-identity-command
      - id: micro-behaviors/hardware/display/screenshot/unspecified::macos-screencapture-invocation

  - id: js-http-exfil-then-self-delete
    for: [javascript, typescript]
    desc: JS HTTP exfiltration followed by self-delete
    crit: hostile
    conf: 0.97
    near_bytes: 4096
    all:
      - id: micro-behaviors/fs/delete/file/self::unlink-filename
      - id: micro-behaviors/communications/http/post::js-http-post-request
    any:
      - id: micro-behaviors/process/identity/query/command::execsync-quoted-whoami
      - id: micro-behaviors/process/identity/query/command::node-shell-id-command
      - id: micro-behaviors/hardware/display/screenshot/unspecified::macos-screencapture-invocation
