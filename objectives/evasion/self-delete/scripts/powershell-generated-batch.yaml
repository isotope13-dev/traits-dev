# A cleanup command embedded in source is only suspicious by itself. Require
# the independently detected elevation payload and actual file-writing API
# before classifying it as removal of an attack launcher.
defaults:
  for: [powershell]
  platforms: [windows]
  attack: T1070.004
composite_rules:
  - id: powershell-uac-self-deleting-batch-launcher
    desc: UAC module writes self-deleting batch launcher
    crit: hostile
    conf: 0.97
    all:
      - id: objectives/privilege-escalation/elevation-control/uac-bypass/hijack::powershell-bypassuac-dll-hijack
      - id: objectives/evasion/self-delete/scripts::batch-percent-zero-self-delete
      - id: micro-behaviors/fs/write/file/full::out-file
