# Self-removal alone remains a neutral filesystem observation. The required
# encrypted Slack tasking context establishes cleanup by a code agent.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  attack: T1070.004

composite_rules:
  - id: slack-code-agent-self-delete
    desc: Encrypted Slack code agent deletes its script
    crit: hostile
    conf: 0.98
    all:
      - id: objectives/command-and-control/backdoor/control/slack::webcrypto-slack-code-tasking
      - id: micro-behaviors/fs/delete/file/self::unlink-filename
