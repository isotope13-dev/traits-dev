# A Go tasking agent that removes its own running executable. The provenance
# leg binds the os.Remove argument to the os.Executable() result, so two
# unrelated calls nearby do not satisfy it; the hostile composite adds the
# encrypted-tasking context that makes the removal commanded cleanup.
defaults:
  platforms: [windows, linux, macos]
  for: [go]
  attack: T1070.004
  mbc: F0007

composite_rules:
  - id: go-tasking-loop-self-delete
    desc: Encrypted-tasking implant deletes its own executable
    crit: hostile
    conf: 0.95
    near_bytes: 1024
    all:
      - id: micro-behaviors/fs/delete/file/self::go-remove-own-executable-path
      - id: micro-behaviors/crypto/decrypt::go-gcm-open
      - id: micro-behaviors/process/create/eval::go-open-result-node-code
