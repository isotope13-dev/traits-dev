# A Go tasking agent that removes its own running executable. The provenance
# legs identify os.Executable() or os.Args[0] as the removal argument.
# The encrypted-source execution context distinguishes agent cleanup; argv
# zero is a launch-time pathname, not proof of successful executable deletion.
defaults:
  platforms: [windows, linux, macos]
  for: [go]
  attack: T1070.004
  mbc: F0007

composite_rules:
  - id: go-tasking-loop-self-delete
    desc: Encrypted agent removes executable/argv path
    crit: hostile
    conf: 0.95
    near_bytes: 2048
    all:
      - id: micro-behaviors/crypto/decrypt::go-gcm-open
      - id: micro-behaviors/process/create/eval::go-open-result-node-code
    any:
      - id: micro-behaviors/fs/delete/file/self::go-remove-own-executable-path
      - id: micro-behaviors/fs/delete/file/self::go-remove-argv-zero
