defaults:
  platforms:
  - windows
composite_rules:
- id: batch-obfuscated-self-deletion
  desc: Obfuscated batch script deletes itself
  crit: hostile
  conf: 0.96
  attack: T1070.004
  # Own-path capture and `>nul` are not deletion. Require a command that
  # deletes this script; padding plus `%0` alone is not indicator removal.
  all:
  - id: objectives/anti-static/obfuscation/string/fragmentation::batch-fragmentation-metrics
  - id: micro-behaviors/process/info/selfpath::self-path-fragment
  - id: micro-behaviors/os/console/io::output-suppression
  any:
  - id: micro-behaviors/fs/delete/file/self::batch-self-delete
  - id: micro-behaviors/fs/delete/file/self::powershell-batch-self-delete-text
  - id: objectives/evasion/self-delete/scripts::batch-percent-zero-self-delete
  needs: 1
- id: batch-download-self-delete
  desc: Download commands accompany batch self-deletion
  crit: suspicious
  conf: 0.95
  for:
  - batch
  all:
  - id: micro-behaviors/fs/delete/file/self::batch-self-delete
  any:
  - id: micro-behaviors/communications/http/download/cli/web-cmdlet::iwr-outfile-download
  - id: micro-behaviors/communications/http/lib/invoke-webrequest::invoke-webrequest
  - id: micro-behaviors/communications/http/client/managed::webclient-download-method-text
  - id: micro-behaviors/communications/http/download/cli/multi-tool::certutil-urlcache
  - id: micro-behaviors/communications/http/download/cli/utility::bitsadmin-transfer-invocation
  - id: micro-behaviors/communications/http/download/cli/multi-tool::curl-wget-near-temp-path
  - id: micro-behaviors/communications/http/download/cli/multi-tool::batch-curl-output-launch-profile
  - id: objectives/anti-static/obfuscation/string/delimiter::rundll32-obfuscated-env-var
- id: batch-staged-loader-self-delete
  desc: Batch dropper deletes self after launch
  crit: hostile
  conf: 0.98
  attack: T1070.004
  for:
  - batch
  all:
  - id: micro-behaviors/fs/delete/file/self::batch-self-delete
  - id: micro-behaviors/process/create/path-execution::start-executable-command
  any:
  - id: micro-behaviors/communications/http/download/curl::batch-curl-download-to-temp
  - id: micro-behaviors/os/registry/autostart/write::batch-reg-add-run-key-direct
