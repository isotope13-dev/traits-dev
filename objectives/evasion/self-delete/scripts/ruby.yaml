# Ruby script opens itself, unlinks its own file and keeps running from the
# retained descriptor, addressed through /proc/<pid>/fd.
defaults:
  for: [ruby]
  platforms: [linux]
  attack: T1070.004

composite_rules:
  - id: ruby-unlinked-self-kept-via-proc-fd
    desc: Deletes own script but keeps /proc handle
    crit: hostile
    conf: 0.95
    near_lines: 12
    all:
      - id: micro-behaviors/fs/delete/file/self::ruby-delete-own-script
      - id: micro-behaviors/fs/proc/info/path::ruby-own-process-fd-path
