defaults:
  platforms: [linux, macos, windows, unix, android, ios]
  for: [javascript, typescript]
composite_rules:
- id: jscript-obfuscated-self-delete
  desc: Obfuscated JScript deletes itself
  crit: hostile
  conf: 0.95
  attack: T1070.004
  all:
  - id: micro-behaviors/os/com/runtime::wscript-host-object
  - id: micro-behaviors/os/com/instantiation::activex-constructor-call
  - id: micro-behaviors/data/encode/string::decimal-string-blob
  - id: micro-behaviors/data/control-flow/dispatch/computed::js-dynamic-method-call
  - id: micro-behaviors/fs/delete/file/self::js-self-delete-obfuscated
