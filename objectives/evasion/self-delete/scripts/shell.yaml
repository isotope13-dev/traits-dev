# A shell dropper that, after launching what it fetched, removes the fetched
# files and its own script. `rm "$0"` is the running script deleting itself;
# a single rm naming both a wildcard set and a `.sh` file is the cleanup line
# that ends Mirai-style loaders (`rm u* router.sh`). Ordinary installers
# clean up too, so the hostile composite also requires a raw-IP fetch and a
# local launch of the downloaded file.
defaults:
  platforms: [unix]
  for: [shell]
  attack: T1070.004
  mbc: F0007

traits:
  - id: shell-dollar-zero-self-delete
    desc: Shell script deletes itself via $0
    crit: suspicious
    conf: 0.9
    if:
      type: text
      regex: '(?m)\brm[ \t]+([^\s;&|]{1,80}[ \t]+){0,6}"?\$\{?0\}?"?([ \t;&|]|$)'

  - id: shell-rm-wildcard-then-script
    desc: rm removes wildcard files and script
    crit: notable
    conf: 0.85
    if:
      type: text
      regex: '(?m)\brm[ \t][^\n;&|]{0,120}\*[^\n;&|]{0,120}[ \t][\w.-]{1,60}\.sh([ \t;&|]|$)'

  - id: shell-rm-script-then-wildcard
    desc: rm removes script and wildcard files
    crit: notable
    conf: 0.85
    if:
      type: text
      regex: '(?m)\brm[ \t]+([^\n;&|]{0,120}[ \t])?[\w.-]{1,60}\.sh[ \t][^\n;&|]{0,120}\*'

composite_rules:
  - id: raw-ip-dropper-launch-then-self-delete
    desc: Raw-IP dropper launches payloads then deletes itself
    crit: hostile
    conf: 0.95
    attack: T1105,T1070.004
    all:
      - id: micro-behaviors/communications/url/host/oob-http::curl-wget-ipv4-url
      - id: micro-behaviors/process/create/path-execution::execute-dot-slash-literal
    any:
      - id: shell-dollar-zero-self-delete
      - id: shell-rm-wildcard-then-script
      - id: shell-rm-script-then-wildcard
