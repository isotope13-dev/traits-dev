defaults:
  platforms: [windows]
  for: [python]
  attack: T1070.004

composite_rules:
  # The 7+Z handler writes a batch that deletes the tool's caches and temp
  # files, a VBS wrapper that runs the batch hidden, then exits immediately.
  # Each leg is common alone in installers, so the composite stays suspicious.
  - id: python-self-wipe-hidden-wscript-cleanup
    desc: Python writes hidden-run cleanup script that wipes its files
    crit: suspicious
    conf: 0.9
    attack: T1070.004,T1059.005
    scope: file
    all:
      - id: micro-behaviors/fs/delete/file/command::cmd-del-force-quiet-text
      - id: micro-behaviors/process/info/name::windows-script-host-executable-reference
      - id: micro-behaviors/process/exit/terminate::python-os-immediate-exit
