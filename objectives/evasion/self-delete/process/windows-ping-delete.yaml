defaults:
  platforms: [windows]
  for: [pe, dll, csharp, batch]
  attack: T1070.004
  mbc: F0007
traits:
  - id: melted-filename-accessor
    desc: Melted filename accessor
    crit: notable
    conf: 0.92
    count_min: 1
    if:
      type: text
      regex: '[gs]et_MeltedFileName'
composite_rules:
  - id: dotnet-melt-delete-workflow
    for: [pe]
    desc: .NET melt self-delete workflow
    crit: suspicious
    conf: 0.96
    all:
      - id: metadata/binary/framework::dotnet-assembly
      - id: micro-behaviors/fs/path/application/executable::cmd-exe-image-name
      - id: micro-behaviors/fs/delete/file/command::windows-ping-delay-delete-fragment
    any:
      - id: micro-behaviors/fs/delete/file/self::dotnet-file-delete-api
      - id: micro-behaviors/fs/file/move::move-file-name-reference
      - id: melted-filename-accessor
    needs: 2
    unless:
      - id: metadata/binary/installer/
