# Native self-deletion by renaming the unnamed NTFS data stream and marking
# the renamed stream for deletion. This avoids the ordinary DeleteFile API.
defaults:
  platforms: [windows]
  for: [c, cpp, csharp, rust]
  attack: T1070.004
  mbc: F0007

composite_rules:
  - id: file-rename-to-alternate-data-stream
    desc: Renames file to alternate stream
    crit: suspicious
    conf: 0.98
    all:
      - id: micro-behaviors/fs/path/stream::ntfs-stream-basename-literal
      - id: micro-behaviors/fs/file/rename::windows-file-rename-info
    near_bytes: 1024

  - id: alternate-stream-rename-self-delete
    desc: Alternate-stream rename followed by delete disposition
    crit: hostile
    conf: 0.995
    all:
      - id: file-rename-to-alternate-data-stream
      - id: micro-behaviors/fs/file/handle::file-disposition-information
    near_bytes: 2048
