# Native self-deletion by renaming the unnamed NTFS data stream and marking
# the renamed stream for deletion. This avoids the ordinary DeleteFile API.
defaults:
  platforms: [windows]
  for: [c, cpp]
  attack: T1070.004
  mbc: F0007

composite_rules:
  - id: alternate-stream-rename-self-delete
    desc: Self-image path, ADS rename and delete request
    crit: suspicious
    conf: 0.95
    all:
      - id: micro-behaviors/fs/path/self::source-self-module-path-read
      - id: micro-behaviors/fs/file/rename::windows-file-rename-to-alternate-stream
      - id: micro-behaviors/fs/delete/file/library::windows-delete-disposition-request
    near_bytes: 2048

  - id: telegram-dispatch-hidden-self-image-delete
    desc: Telegram dispatch with hidden self-image delete
    crit: hostile
    conf: 0.98
    all:
    - id: micro-behaviors/fs/delete/file/self::native-cmd-self-image-delete
    - id: objectives/command-and-control/channel/messaging::host-gated-telegram-command-dispatch
    - id: micro-behaviors/process/create/flags::winexec-sw-hide-source
