defaults:
  platforms: [windows]
  for: [pe]
composite_rules:
  - id: concealed-http-shell-delete-command
    desc: Concealed HTTP shell with self-delete APIs
    crit: hostile
    conf: 0.97
    attack: T1070.004
    all:
      - id: objectives/command-and-control/backdoor/dispatch/shell/socket::xor-http-shell-command-interface
      - id: micro-behaviors/process/info/current::get-module-filename
      - id: micro-behaviors/os/env/runtime::comspec-env-var
      - id: micro-behaviors/fs/delete/file/command::slash-c-del-fragment
      - id: micro-behaviors/process/create/shellexec::shell-execute-call
