defaults:
  platforms: [windows]
  for: [data]

traits:
  - id: unparsed-pe-comspec-env
    desc: COMSPEC string in unparsed PE
    crit: component
    conf: 0.9
    if:
      type: text
      exact: COMSPEC

  - id: unparsed-pe-slash-c-del
    desc: cmd /c del fragment in unparsed PE
    crit: component
    conf: 0.9
    if:
      type: text
      regex: '/c\s+del\b'
      case_insensitive: true

  - id: unparsed-pe-get-short-path-name-a
    desc: GetShortPathNameA string in unparsed PE
    crit: component
    conf: 0.95
    if:
      type: text
      exact: GetShortPathNameA

composite_rules:
  - id: unparsed-pe-comspec-delete-profile
    desc: Unparsed PE COMSPEC self-deletion command profile
    crit: notable
    conf: 0.96
    all:
      - id: metadata/binary/header/malformed::overlapping-dos-pe-header
      - id: unparsed-pe-comspec-env
      - id: unparsed-pe-slash-c-del
      - id: unparsed-pe-get-short-path-name-a

  - id: unparsed-pe-comspec-self-delete
    desc: Unparsed PE self-deletion via COMSPEC cmd /c del
    crit: suspicious
    conf: 0.96
    attack: T1070.004
    all:
      - id: unparsed-pe-comspec-delete-profile
      - id: objectives/persistence/login/registry/active-setup::unparsed-pe-get-module-filename-a
      - id: objectives/persistence/login/registry/active-setup::unparsed-pe-create-process-a
