defaults:
  platforms: [windows]
  for: [powershell]
  attack: T1070.004
  mbc: F0007

composite_rules:
  - id: powershell-temp-payload-self-wipe-terminate
    desc: Force-removes temporary payload files and terminates its own PowerShell process
    crit: hostile
    conf: 0.97
    all:
      - id: micro-behaviors/process/exit/terminate::powershell-stop-self-pid
      - id: micro-behaviors/fs/path/temp::any-temp-path
    any:
      - id: micro-behaviors/fs/delete/file/command::powershell-force-remove-variable-path
      - id: micro-behaviors/fs/delete/file/command::powershell-remove-item-force
