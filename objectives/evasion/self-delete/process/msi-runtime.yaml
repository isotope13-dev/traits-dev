defaults:
  for: [msi]
  platforms: [windows]
composite_rules:
  - id: member-launch-with-silent-self-uninstall
    desc: MSI carries installed-file launch and silent self-uninstall commands
    crit: suspicious
    conf: 0.96
    all:
      - id: metadata/file/profile/operation-reference::msi-installed-exe-with-member-argument
      - id: micro-behaviors/os/package-manager/uninstall::silent-current-product-uninstall
