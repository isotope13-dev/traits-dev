defaults:
  platforms: [windows]
  for: [pe, dll]

composite_rules:
  # The required code handoff distinguishes this from mere injection API
  # imports. The cleanup profile includes the current module path, short-path
  # conversion, COMSPEC, /c del, and CreateProcess. Co-occurrence does not prove
  # that injection or cleanup succeeds; damaged loaders retain this evidence.
  - id: native-dll-injector-shell-cleanup
    desc: Resource DLL injector with shell self-delete
    crit: hostile
    conf: 0.96
    attack: T1070.004
    all:
      - id: micro-behaviors/fs/delete/file/self::x86-shortpath-comspec-self-delete-setup
      - id: micro-behaviors/process/inject/dll::x86-remote-dll-export-thread
      - id: micro-behaviors/fs/delete/file/command::comspec-process-delete-api-cluster
      - id: micro-behaviors/data/embedded/payload/resource::pe-resource-full-extraction
