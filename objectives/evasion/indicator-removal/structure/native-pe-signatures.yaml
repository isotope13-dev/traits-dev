defaults:
  platforms: [windows]
  for: [pe, dll]
  arch: [x86]
  attack: T1027.005
traits:
  - id: x86-erase-pe-dos-signatures
    desc: Clears PE/DOS signatures and e_lfanew
    crit: suspicious
    conf: 0.99
    if:
      type: hex
      section: .text
      # The same image base is loaded from one stack slot throughout:
      # derive NT headers via base+e_lfanew, zero the NT signature,
      # then clear the DOS magic and the pointer used to locate NT headers.
      # The image is the first stack argument; local NT-pointer slot is -8.
      # Both alternatives preserve register consistency across all three writes.
      # No image address, family string, or configuration value is required.
      pattern: '( 8B 45 08 8B 4D 08 03 48 3C 89 4D F8 8B 55 F8 C7 02 00 00 00 00 33 C0 8B 4D 08 66 89 01 8B 55 08 C7 42 3C 00 00 00 00 | 8B 4D 08 8B 55 08 03 51 3C 89 55 F8 8B 45 F8 C7 00 00 00 00 00 33 C9 8B 55 08 66 89 0A 8B 45 08 C7 40 3C 00 00 00 00 )'
composite_rules:
  - id: dns-tasking-image-header-erasure
    desc: DNS task implant erases PE identification headers
    crit: hostile
    conf: 0.99
    all:
      - id: x86-erase-pe-dos-signatures
      - id: objectives/command-and-control/dns/tunneling::numbered-hex-frame-tasking
