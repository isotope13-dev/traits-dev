defaults:
  platforms: [windows, unix]
  for: [pe, dll]
  crit: suspicious
composite_rules:
  # Names corroborate read/replace/write and delete API references. Neither
  # a cleanup helper's name nor a project-directory argument is an attack.
  - id: dotnet-package-reference-removal
    desc: Rewrites NuGet package-reference records
    conf: 0.96
    all:
      - id: metadata/binary/symbols/name/token/filesystem::package-reference-removal-helper
      - id: metadata/build/manifest::nuget-package-reference-regex
      - id: micro-behaviors/fs/read/file/full::dotnet-read-all-text
      - id: micro-behaviors/data/string/replace::dotnet-regex-replace-import
      - id: micro-behaviors/fs/write/file/full/unspecified::dotnet-writealltext-import
  - id: dotnet-restore-record-cleanup
    desc: Removes package references and restore traces
    conf: 0.97
    all:
      - id: dotnet-package-reference-removal
      - id: metadata/binary/symbols/name/token/filesystem::package-restore-cleanup-helper
      - id: metadata/build/manifest::nuget-project-assets-record
      - id: micro-behaviors/fs/delete/file/library::dotnet-file-delete-call
