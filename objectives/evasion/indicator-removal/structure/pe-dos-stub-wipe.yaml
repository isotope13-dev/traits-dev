# Post-link scripts that zero every byte between the DOS header and e_lfanew
# erase the DOS stub and the MSVC Rich header, removing the toolchain
# fingerprint analysts use to cluster builds of the same malware.
defaults:
  platforms: [windows]
  for: [python]
  attack: T1027.005

traits:
  - id: python-zero-bytes-from-0x40
    desc: Zeroes buffer bytes from offset 0x40 onward
    crit: component
    conf: 0.8
    if:
      type: text
      regex: 'range\(\s*0x40\s*,\s*\w+\s*\)\s*:\s*\w+\[\s*\w+\s*\]\s*=\s*0(x00)?\b'

composite_rules:
  - id: python-zero-dos-stub-to-lfanew
    desc: Zeroes PE DOS stub and Rich header
    crit: suspicious
    conf: 0.9
    near_lines: 12
    all:
      - id: micro-behaviors/data/format/pe-parser::python-struct-read-e-lfanew
      - id: python-zero-bytes-from-0x40
