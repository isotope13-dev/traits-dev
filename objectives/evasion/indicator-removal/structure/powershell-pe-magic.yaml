# The raw fill alone proves neither a PE nor concealment. Require a decoded
# PE buffer and a nearby real loader call before interpreting the cleared
# byte pair as removal of the image's MZ signature.
defaults:
  for: [powershell]
  platforms: [windows]
  crit: suspicious
  conf: 0.97

composite_rules:
  - id: powershell-reflective-pe-magic-erasure
    desc: Reflective loader clears decoded PE magic
    near_lines: 30
    all:
      - id: micro-behaviors/mem/fill::powershell-pebytes-initial-byte-pair-zero
      - id: micro-behaviors/data/decode/base64::powershell-pebytes-buffer-decode
      - id: micro-behaviors/dylib/load/runtime::powershell-memory-library-loader-call
