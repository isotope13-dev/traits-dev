defaults:
  platforms: [windows, unix]
  for: [nupkg, xml, pe, dll]
  attack: T1195.002,T1547
  mbc: F0012
composite_rules:
  - id: nuget-build-task-rewrites-consuming-project
    desc: NuGet build hook removes dependency traces
    crit: hostile
    conf: 0.93
    scope: archive
    all:
      - id: metadata/build/manifest::nuspec-file
      - id: metadata/build/manifest::msbuild-targets-file
      - id: metadata/build/msbuild::msbuild-property-task-assembly
      - id: metadata/build/msbuild::msbuild-task-given-project-directory
      - id: metadata/build/msbuild::msbuild-before-compile-target
      - id: objectives/evasion/indicator-removal/structure::dotnet-restore-record-cleanup
