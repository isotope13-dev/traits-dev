defaults:
  platforms: [windows, unix]
  for: [nupkg, xml, pe, dll]
  attack: T1195.002,T1070.004
composite_rules:
  - id: nuget-build-hook-cleanup-api-clues
    desc: NuGet build hook has dependency-cleanup APIs
    crit: suspicious
    conf: 0.93
    scope: archive
    all:
      - id: metadata/build/manifest::nuspec-file
      - id: metadata/build/manifest::msbuild-targets-file
      - id: metadata/build/msbuild::msbuild-property-task-assembly
      - id: metadata/build/msbuild::msbuild-task-given-project-directory
      - id: metadata/build/msbuild::msbuild-before-compile-target
      - id: micro-behaviors/fs/delete/file/library::dotnet-nuget-restore-cleanup-apis
