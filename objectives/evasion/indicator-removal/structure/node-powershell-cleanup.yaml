defaults:
  platforms: [windows]
  for: [javascript, typescript]
composite_rules:
  - id: node-hidden-shell-cleanup-clues
    desc: Hidden shell and package cleanup clues
    crit: suspicious
    conf: 0.99
    all:
      - id: micro-behaviors/process/create/shell/interpreter::powershell-exe-spawn
      - id: micro-behaviors/fs/path/script::dated-cleanup-script-name
      - id: micro-behaviors/data/config/write::node-package-lock-mutation
      - id: micro-behaviors/fs/delete/directory::fs-rm-recursive
    any:
      - id: micro-behaviors/communications/http/download/handler::powershell-download-xor-temp-write
      - id: micro-behaviors/process/control/wait::node-unref-handle
  - id: node-encoded-shell-cleanup-clues
    desc: Encoded shell and package cleanup clues
    crit: suspicious
    conf: 0.985
    all:
      - id: micro-behaviors/process/argument/visibility::hidden-encoded-powershell-command-text
      - id: micro-behaviors/data/config/write::node-package-lock-mutation
    any:
      - id: micro-behaviors/fs/delete/directory::fs-rm-recursive
      - id: micro-behaviors/fs/path/script::dated-cleanup-script-name
      - id: micro-behaviors/process/create/hidden::detached-hidden-spawn
