defaults:
  platforms: [windows]
  for: [go]
  crit: hostile
  conf: 0.98
composite_rules:
  - id: go-shellcode-pe-signature-removal
    desc: Shellcode PE injector clears certificate metadata
    all:
      - id: micro-behaviors/fs/file/section::pe-shellcode-section-entry-edits
      - id: micro-behaviors/fs/file/section::go-shellcode-return-jump-call
      - id: micro-behaviors/fs/file/section::pe-certificate-directory-cleared
