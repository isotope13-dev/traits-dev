defaults:
  for: [powershell]
  platforms: [windows]
  crit: hostile
  conf: 0.98
  attack: T1027

composite_rules:
  - id: powershell-offensive-image-signature-erasure
    desc: Erases PE magic before offensive image loading
    all:
      - id: powershell-reflective-pe-magic-erasure
    any:
      - id: objectives/credential-access/memory::powershell-reflective-logonpasswords
      - id: objectives/command-and-control/backdoor/control/rmm::powershell-reflective-vnc-access
