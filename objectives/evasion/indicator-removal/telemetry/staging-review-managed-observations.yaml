composite_rules:
- platforms:
  - windows
  for:
  - pe
  - dll
  attack: T1562.001,T1562.006
  crit: hostile
  conf: 0.98
  id: dotnet-security-patch-opaque-resource
  desc: Managed security patch names and opaque resource
  all:
  - id: metadata/lang/compiler/managed::dotnet-assembly
  - id: metadata/binary/resource/entropy::clr-resource-high-entropy
  - id: micro-behaviors/os/security/amsi::amsi-library-reference
  - id: micro-behaviors/os/security/amsi::amsi-scan-buffer-reference
  - id: micro-behaviors/os/telemetry/logging/etw::etw-event-write-str
  - id: micro-behaviors/data/embedded/resource::dotnet-managed-resource-access
  - id: metadata/lang/source/naming/function/security::dotnet-patch-amsi-name
  - id: metadata/lang/source/naming/function/security::dotnet-patch-etw-name
  - id: micro-behaviors/fs/path/file::dotnet-payload-enc-name
