# Network-device implants can make the management plane lie in two independent
# ways: silently acknowledge dropped control-plane logs, or rewrite show
# commands so tunnel state disappears from administrative output.
defaults:
  platforms: [appliance]
  for: [c, cpp]
  attack: T1562.001

traits:
  - id: queue-gate-fallthrough-success
    desc: Queue filter falls through as success
    crit: suspicious
    conf: 0.98
    if:
      type: text
      regex: 'mq_send\s*\([^;]{1,220}\);\s*\}\s*return\s+0\s*;'

composite_rules:
  - id: ios-xr-selective-syslog-suppression
    desc: Selectively suppresses IOS XR log delivery
    crit: hostile
    conf: 0.995
    near_lines: 8
    all:
      - id: micro-behaviors/os/telemetry/logging/syslog::ios-xr-evsyslog-library
      - id: micro-behaviors/communications/ipc/message::content-gated-posix-message-queue-send
      - id: queue-gate-fallthrough-success

  - id: ios-tunnel-command-output-concealment
    desc: Hides GRE and VRF config from IOS show output
    crit: hostile
    conf: 0.995
    near_lines: 10
    all:
      - id: micro-behaviors/process/create/shell/native::ios-show-exclude-command-flow
      - id: micro-behaviors/os/network/interface::ios-tunnel-configuration-vocabulary
