# Source evidence: Elastic's SANSAR report, NVML wrapper screenshot (image7).
# These are suspicious rather than hostile: instrumentation and test wrappers
# can deliberately replace readings too. Do not infer mining from NVML alone.
defaults:
  for: [c]
  platforms: [linux]
  crit: suspicious
  conf: 0.98
  attack: T1562.001

traits:
  - id: nvml-randomized-query-output
    desc: Replaces NVML readings with random values
    ref: https://www.elastic.co/security-labs/threat-command/sansar-linux-cryptomining-malware
    if:
      type: tree-sitter
      query: |
        ((function_definition
          declarator: (function_declarator
            declarator: (identifier) @function
            parameters: (parameter_list
              (parameter_declaration
                declarator: (pointer_declarator declarator: (identifier) @output))))
          body: (compound_statement
            (declaration declarator: (init_declarator
              value: (call_expression arguments: (argument_list (identifier) @passed))))
            (if_statement consequence: (compound_statement
              (expression_statement (assignment_expression
                left: (pointer_expression operator: "*" argument: (identifier) @written)
                operator: "=" right: (_) @replacement))))))
          (#match? @function "^nvmlDeviceGet(Temperature|PowerUsage)$")
          (#eq? @output @passed)
          (#eq? @output @written)
          (#match? @replacement "^\\(\\s*(rand|random)\\s*\\(\\s*\\)\\s*%\\s*[0-9]+\\s*\\)\\s*\\+\\s*[0-9]+$"))

  - id: nvml-zeroed-utilization-output
    desc: Overwrites returned GPU utilization with zero
    ref: https://www.elastic.co/security-labs/threat-command/sansar-linux-cryptomining-malware
    if:
      type: tree-sitter
      query: |
        ((function_definition
          declarator: (function_declarator
            declarator: (identifier) @function
            parameters: (parameter_list
              (parameter_declaration
                declarator: (pointer_declarator declarator: (identifier) @output))))
          body: (compound_statement
            (declaration declarator: (init_declarator
              value: (call_expression arguments: (argument_list (identifier) @passed))))
            (if_statement consequence: (compound_statement
              (declaration declarator: (init_declarator
                declarator: (pointer_declarator declarator: (identifier) @alias)
                value: (cast_expression value: (identifier) @source)))
              (expression_statement (assignment_expression
                left: (subscript_expression argument: (identifier) @written
                  index: (number_literal) @index)
                operator: "=" right: (number_literal) @zero))))))
          (#eq? @function "nvmlDeviceGetUtilizationRates")
          (#eq? @output @passed)
          (#eq? @output @source)
          (#eq? @alias @written)
          (#eq? @index "0")
          (#match? @zero "^(0|0x0+)[uUlL]*$"))

composite_rules:
  - id: nvml-telemetry-spoofing
    desc: Falsifies GPU utilization and thermal telemetry
    crit: suspicious
    conf: 0.99
    all:
      - id: nvml-zeroed-utilization-output
      - id: nvml-randomized-query-output
