defaults:
  platforms: [windows]
  for: [xml, csharp, powershell, python]
  attack: T1562.001

composite_rules:
  # Logging suppression alone can be a legitimate application setting. The
  # configuration must also override both sides of CLR manager activation.
  - id: appdomain-preload-suppresses-usage-logs
    desc: CLR manager preload suppresses usage logs
    crit: suspicious
    conf: 0.94
    all:
      - id: micro-behaviors/os/module/load/name::appdomain-manager-assembly
      - id: micro-behaviors/os/module/load/name::appdomain-manager-type
      - id: micro-behaviors/os/telemetry/logging/configure::clr-assembly-usage-log-disabled
