defaults:
  platforms:
  - windows
  for:
  - scripts
  - source
  - binaries
  crit: suspicious
  conf: 0.95
  attack: T1562.006

traits:
  - id: etw-provider-ignore-keyword-zero-command
    desc: ETW command suppresses keyword-zero events
    if:
      type: text
      regex: '\bSet-EtwTraceProvider\b[^;\n|&]{0,384}-Property[:\s]+[''"]?(0x11|17)([''"\s;|]|$)'
      case_insensitive: true

  - id: etw-eventlog-provider-removal-command
    desc: Removes provider from EventLog autologger
    if:
      type: text
      regex: '\bRemove-EtwTraceProvider\b[^;\n|&]{0,256}-AutologgerName\s+[''"]?EventLog-'
      case_insensitive: true

  - id: logman-trace-provider-removal-command
    desc: Logman trace update removes an ETW provider
    if:
      type: text
      regex: '\blogman(\.exe)?[''"]?\s+update\s+trace\b[^;\n|&]{0,256}\s--p\s+\S'
      case_insensitive: true
