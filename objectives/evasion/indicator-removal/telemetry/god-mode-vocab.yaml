# Kernel rootkit post-exploit status vocabulary observed across FudModule-class
# builds (Lazarus). Matching several of these log lines together is a strong
# signal of the telemetry-wipe / privilege-escalation toolkit, without needing
# a family-specific hash.
defaults:
  platforms: [windows]
  for: [pe, dll, c, cpp, binaries, source, data, txt]
  attack: T1562.001,T1068
  crit: suspicious

traits:
  - id: enable-god-mode-passed
    desc: enable_god_mode passed status string
    crit: suspicious
    conf: 0.97
    if:
      type: text
      substr: 'enable_god_mode passed.'

  - id: get-god-mode-failed
    desc: GetGodMode failed status string
    crit: suspicious
    conf: 0.96
    if:
      type: text
      substr: 'GetGodMode failed'

  - id: get-system-handle-passed
    desc: GetSystemHandle passed status string
    crit: suspicious
    conf: 0.96
    if:
      type: text
      substr: 'GetSystemHandle passed.'

  - id: create-remote-process-passed
    desc: CreateRemoteProcess passed status string
    crit: suspicious
    conf: 0.96
    if:
      type: text
      substr: 'CreateRemoteProcess passed.'

  - id: remote-dll-execute-passed
    desc: RemoteDllExecute passed status string
    crit: suspicious
    conf: 0.96
    if:
      type: text
      substr: 'RemoteDllExecute passed.'

composite_rules:
  - id: kernel-rootkit-god-mode-vocab
    desc: Kernel rootkit god-mode status vocabulary
    crit: hostile
    conf: 0.98
    needs: 3
    any:
      - id: enable-god-mode-passed
      - id: get-god-mode-failed
      - id: get-system-handle-passed
      - id: create-remote-process-passed
      - id: remote-dll-execute-passed
