# A workflow deleting its own current-run record or log archive. Generic
# retention jobs delete old run IDs supplied by a schedule or matrix; these
# composites resolve the live GITHUB_RUN_ID from inside that same run.
defaults:
  platforms: [unix, windows]
  for: [github-actions]
  attack: T1070.008

traits:
  - id: github-actions-log-api-route
    desc: GitHub Actions run-log API route
    crit: notable
    conf: 0.99
    if:
      type: value
      path: jobs.*.steps[*].run
      regex: '/actions/runs/[^\s"''/]{1,80}/logs'

  - id: curl-delete-request
    desc: curl sends an HTTP DELETE request
    crit: notable
    conf: 0.95
    if:
      type: value
      path: jobs.*.steps[*].run
      regex: '(?i)\bcurl\b.{0,220}(--request\s+DELETE|-X\s*DELETE)'

  - id: github-run-id-braced-variable
    desc: Braced current Actions run variable
    crit: notable
    conf: 0.99
    if:
      type: value
      path: jobs.*.steps[*].run
      substr: '${GITHUB_RUN_ID}'

  - id: github-run-id-simple-variable
    desc: Unbraced current Actions run variable
    crit: notable
    conf: 0.97
    if:
      type: value
      path: jobs.*.steps[*].run
      regex: '\$GITHUB_RUN_ID\b'

composite_rules:
  - id: github-current-run-id-reference
    desc: References current GitHub Actions run
    crit: component
    conf: 0.99
    any:
      - id: github-run-id-braced-variable
      - id: github-run-id-simple-variable

  - id: github-actions-current-run-log-api-delete
    desc: Deletes current Actions run logs via API
    crit: hostile
    conf: 0.99
    all:
      - id: github-actions-log-api-route
      - id: github-current-run-id-reference
      - id: curl-delete-request

  - id: github-actions-current-run-record-delete
    desc: Deletes current GitHub Actions run
    crit: hostile
    conf: 0.99
    all:
      - id: metadata/build/ci/step::workflow-run-delete-command
      - id: github-current-run-id-reference
