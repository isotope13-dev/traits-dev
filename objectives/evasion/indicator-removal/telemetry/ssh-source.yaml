defaults:
  platforms: [unix]
  for: [tar, gz, zip, npm, c, cpp]
composite_rules:
  - id: ssh-password-backdoor-audit-gating
    desc: SSH password backdoor also gates audit logging
    crit: hostile
    conf: 0.99
    attack: T1556.004,T1562.001
    scope: archive
    all:
      - id: micro-behaviors/os/security/auth/password::native-byte-password-success-branch
      - id: micro-behaviors/os/security/auth/password::native-ssh-password-handler
      - id: micro-behaviors/os/telemetry/logging/conditional::ssh-audit-boolean-flag-guard
