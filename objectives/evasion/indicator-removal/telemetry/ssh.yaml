# QUIET suppresses future sshd log records. This is distinct from deleting
# existing log files. UsePAM=no or an ordinary SSH configuration alone does
# not establish this behavior. Literal matching excludes source comments and
# keeps this portable across languages embedding the configuration. Python
# uses assignment syntax because docstrings following comments can lose their
# docstring tag in the literal extractor.
defaults:
  platforms: [unix, windows]
  for: [scripts, source, '!python']

traits:
  - id: sshd-quiet-logging
    desc: SSH configuration suppresses all server logging
    crit: suspicious
    conf: 0.95
    downgrade:
      scope: archive
      any:
        - id: well-known/tool/sysadmin/kubernetes/minikube::minikube-text
        # `ssh -o LogLevel=QUIET` (dokku's client) hushes the client's own
        # warnings; the remote sshd logs as configured.
        - id: ssh-client-quiet-option
    if:
      type: literal
      regex: '(?im)^\s*LogLevel[ \t=]+QUIET\s*$'

  - id: ssh-client-quiet-option
    desc: ssh client option silences its own output
    crit: component
    conf: 0.9
    if:
      type: text
      regex: '-o["'']?\s*["'']?\s*[,(]?\s*["'']?LogLevel=QUIET'

  - id: python-sshd-quiet-logging
    desc: Assigned SSH config suppresses server logs
    crit: suspicious
    conf: 0.95
    for: [python]
    downgrade:
      scope: archive
      any:
        - id: well-known/tool/sysadmin/kubernetes/minikube::minikube-text
    if:
      type: tree-sitter
      kind: assignment
      regex: '(?i)(["''\n]|\\n)\s*LogLevel([ =\t]|\\t)+QUIET["''\s\\]'

  - id: native-ssh-quiet-logging-directive
    desc: Native SSH quiet logging directive
    crit: component
    for: [elf, so, macho, dylib, pe, dll]
    if:
      type: text
      regex: '(?im)^[ \t]*LogLevel[ \t=]+QUIET[ \t]*\r?$'

  - id: native-ssh-client-config-directive
    desc: Native SSH client config directive
    crit: component
    for: [elf, so, macho, dylib, pe, dll]
    if:
      type: text
      regex: '(?im)^[ \t]*(UserKnownHostsFile|StrictHostKeyChecking|ProxyCommand)[ \t=]'

  - id: native-ssh-server-config-directive
    desc: Native SSH server config directive
    crit: component
    for: [elf, so, macho, dylib, pe, dll]
    if:
      type: text
      regex: '(?im)^[ \t]*(PermitRootLogin|AuthorizedKeysFile|UsePAM|ForceCommand)[ \t=]'

composite_rules:
  - id: native-ssh-client-quiet-config
    desc: Native SSH client config requests quiet logging
    crit: component
    for: [elf, so, macho, dylib, pe, dll]
    near_bytes: 300
    all:
      - id: native-ssh-quiet-logging-directive
      - id: native-ssh-client-config-directive
    unless:
      - id: native-ssh-server-config-directive

  - id: native-sshd-quiet-logging
    desc: Native SSH config requests quiet logging
    crit: suspicious
    conf: 0.95
    for: [elf, so, macho, dylib, pe, dll]
    all:
      - id: native-ssh-quiet-logging-directive
    unless:
      - id: native-ssh-client-quiet-config
    downgrade:
      scope: archive
      any:
        - id: well-known/tool/sysadmin/kubernetes/minikube::minikube-text
