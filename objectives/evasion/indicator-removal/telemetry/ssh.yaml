# QUIET suppresses future sshd log records. This is distinct from deleting
# existing log files. UsePAM=no or an ordinary SSH configuration alone does
# not establish this behavior. Literal matching excludes source comments and
# keeps this portable across languages embedding the configuration. Python
# uses assignment syntax because docstrings following comments can lose their
# docstring tag in the literal extractor.
defaults:
  platforms: [unix, windows]
  for: [scripts, source, '!python']

traits:
  - id: sshd-quiet-logging
    desc: SSH configuration suppresses all server logging
    crit: suspicious
    conf: 0.95
    if:
      type: literal
      regex: '(?im)^\s*LogLevel[ \t=]+QUIET\s*$'

  - id: python-sshd-quiet-logging
    desc: Assigned SSH config suppresses server logs
    crit: suspicious
    conf: 0.95
    for: [python]
    if:
      type: tree-sitter
      kind: assignment
      regex: '(?i)(["''\n]|\\n)\s*LogLevel([ =\t]|\\t)+QUIET["''\s\\]'

  # OpenSSH configuration has the same meaning in ELF, Mach-O and PE builds.
  # Native strings have no source-literal view; do not broaden source scans to
  # raw text, where a comment could be mistaken for configuration.
  - id: native-sshd-quiet-logging
    desc: Native SSH config suppresses server logging
    crit: suspicious
    conf: 0.95
    for: [elf, so, macho, dylib, pe, dll]
    if:
      type: text
      regex: '(?im)^[ \t]*LogLevel[ \t=]+QUIET[ \t]*\r?$'
