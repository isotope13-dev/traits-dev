defaults:
  platforms: [windows]
  for: [batch]
composite_rules:
  - id: defender-log-and-quarantine-cleanup
    desc: Clears event logs and deletes Defender quarantine files
    crit: suspicious
    conf: 0.96
    all:
      - id: micro-behaviors/os/event/log::wevtutil-clear-log-command
      - id: micro-behaviors/fs/delete/target::batch-delete-defender-quarantine
  - id: defender-log-history-and-quarantine-wipe
    desc: Clears Defender logs, scan history and quarantine
    crit: hostile
    conf: 0.98
    attack: T1070.001
    all:
      - id: micro-behaviors/os/event/log::batch-clear-defender-operational-log
      - id: micro-behaviors/fs/delete/target::batch-delete-defender-scan-history
      - id: micro-behaviors/fs/delete/target::batch-delete-defender-quarantine
