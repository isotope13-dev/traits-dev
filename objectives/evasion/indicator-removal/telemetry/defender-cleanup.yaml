defaults:
  platforms: [windows]
  for: [batch]
composite_rules:
  - id: defender-log-and-quarantine-cleanup
    desc: Clears event logs and deletes Defender quarantine files
    crit: suspicious
    conf: 0.96
    all:
      - id: micro-behaviors/os/event/log::wevtutil-clear-log-command
      - id: micro-behaviors/fs/delete/target::batch-delete-defender-quarantine
  - id: defender-log-history-and-quarantine-wipe
    desc: Clears Defender logs, scan history and quarantine
    crit: hostile
    conf: 0.98
    attack: T1070.001
    all:
      - id: micro-behaviors/os/event/log::batch-clear-defender-operational-log
      - id: micro-behaviors/fs/delete/target::batch-delete-defender-scan-history
      - id: micro-behaviors/fs/delete/target::batch-delete-defender-quarantine
  - id: scheduled-defender-history-cleanup
    desc: SYSTEM startup task near Defender history deletion
    crit: hostile
    conf: 0.97
    attack: T1070.001,T1053.005
    near_bytes: 4096
    all:
      - id: micro-behaviors/fs/path/app-data::defender-programdata-directory
      - id: micro-behaviors/fs/path/metadata-store::defender-scan-database-path
      - id: micro-behaviors/fs/path/reference::history-service-subdirectory
      - id: micro-behaviors/fs/delete/directory::windows-rd-recursive
      - id: micro-behaviors/os/autorun/scheduled::new-scheduledtaskaction
      - id: micro-behaviors/os/autorun/scheduled::new-scheduledtask-principal-system
      - id: micro-behaviors/os/autorun/task-trigger::schtask-trigger-at-startup
      - id: micro-behaviors/os/autorun/scheduled::register-scheduledtask
