# AiTM webinjects may hook browser request APIs and DOM mutation handling to
# prevent anti-phishing telemetry and canary resources from reaching their
# collectors. Generic hook and DOM capabilities remain in micro-behaviors;
# this objective requires multiple suppression mechanics inside a
# session-cookie-capturing phishlet.
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript, html, scripts, source, text]
  attack: T1562.001

traits:
  - id: microsoft-events-telemetry-host
    desc: Microsoft browser-events telemetry host
    crit: notable
    conf: 0.98
    if:
      type: text
      substr: 'events.data.microsoft.com'

  - id: microsoft-onecollector-telemetry-name
    desc: Microsoft OneCollector telemetry name
    crit: notable
    conf: 0.96
    if:
      type: text
      word: OneCollector

  - id: canary-token-target-name
    desc: Canary-token target name
    crit: notable
    conf: 0.94
    if:
      type: text
      word: canarytokens

composite_rules:
  - id: microsoft-canary-telemetry-target-group
    desc: Groups Microsoft and canary telemetry targets
    crit: component
    conf: 0.99
    needs: 2
    any:
      - id: microsoft-events-telemetry-host
      - id: microsoft-onecollector-telemetry-name
      - id: canary-token-target-name

  - id: phishlet-browser-telemetry-suppression
    desc: Phishlet suppresses browser security telemetry
    crit: hostile
    conf: 0.99
    all:
      - id: objectives/credential-access/phishing/mfa-relay::phishlet-session-cookie-relay
      - id: objectives/credential-access/phishing/mfa-relay::phishlet-javascript-injection-section
      - id: microsoft-canary-telemetry-target-group
    needs: 2
    any:
      - id: micro-behaviors/process/hook/xhr::fetch-hook
      - id: micro-behaviors/process/hook/xhr::xhr-current-request-abort
      - id: micro-behaviors/communications/http/response::javascript-synthetic-no-content-response
    near_lines: 180
