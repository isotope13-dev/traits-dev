# Session credential/configuration teardown, distinct from deleting logs,
# suppressing future telemetry, or deleting an executing file itself.
defaults:
  for: [shell]
  platforms: [unix]
composite_rules:
  - id: jump-relay-config-cleanup
    desc: SSH relay removes its config directory
    crit: suspicious
    conf: 0.95
    attack: T1070.004
    near_lines: 40
    all:
      - id: micro-behaviors/communications/ssh/connect::shell-multiple-jump-hosts
      - id: micro-behaviors/fs/delete/directory::shell-ssh-config-directory-removal
