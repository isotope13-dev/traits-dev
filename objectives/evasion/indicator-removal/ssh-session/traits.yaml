# Session credential/configuration teardown, distinct from deleting logs,
# suppressing future telemetry, or deleting an executing file itself.
defaults:
  for: [shell]
  platforms: [unix]
  attack: T1070.004
composite_rules:
  - id: jump-relay-config-cleanup
    desc: SSH relay removes its config directory
    crit: suspicious
    conf: 0.95
    near_lines: 40
    all:
      - id: micro-behaviors/communications/ssh/connect::shell-multiple-jump-hosts
      - id: micro-behaviors/fs/delete/directory::shell-ssh-config-directory-removal

  - id: ssh-askpass-exploit-helper-cleanup
    desc: Deletes staged SSH_ASKPASS exploit helper
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/communications/ssh/configure::ssh-staged-askpass-helper
      - id: micro-behaviors/fs/delete/file/command::rm-force-variable-target
      - id: objectives/lateral-movement/exploit/cve::ssh-askpass-two-stage-overlong-password-bypass
