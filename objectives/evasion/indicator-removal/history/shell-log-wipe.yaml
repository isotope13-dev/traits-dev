defaults:
  platforms: [unix]
  for: [shell]
  attack: T1070.003

traits:
  - id: shell-mass-bash-history-truncate
    desc: Clears root and every user's bash history
    crit: suspicious
    conf: 0.92
    if:
      type: text
      substr: '/root/.bash_history /home/*/.bash_history'
    unless:
      - id: metadata/package/testing/harness/runtime::benchmark-task-agent-record
