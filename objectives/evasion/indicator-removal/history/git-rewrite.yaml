defaults:
  platforms: [windows]
  for: [batch]
  crit: suspicious
composite_rules:
  # Clock manipulation beside a hook-skipping amend suggests timestamp
  # concealment. It does not alone prove an unauthorized repository change.
  - id: timestamped-amend-rewrite
    desc: Commit-date query and clock changes accompany hook-skipping amend
    conf: 0.93
    all:
      - id: micro-behaviors/revision-control/git::git-log-last-commit-metadata
      - id: micro-behaviors/os/sysinfo/config::batch-system-clock-from-variable
      - id: micro-behaviors/revision-control/git::git-amend-no-verify
  - id: git-history-rewrite-with-clock-changes
    desc: Clock changes accompany amended Git history and hook-skipping push
    conf: 0.97
    all:
      - id: timestamped-amend-rewrite
      - id: micro-behaviors/revision-control/git::git-push-no-verify
    any:
      - id: micro-behaviors/revision-control/git::git-local-author-rewrite
      - id: micro-behaviors/revision-control/git::git-current-branch-query
  - id: staged-git-history-rewrite
    desc: Stages all changes beside a clock-altering Git history rewrite
    conf: 0.98
    all:
      - id: micro-behaviors/process/create/vcs/git::git-stage-all-changes
      - id: git-history-rewrite-with-clock-changes
