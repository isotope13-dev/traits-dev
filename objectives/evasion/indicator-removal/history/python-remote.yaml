defaults:
  for: [python]
  platforms: [unix]
traits:
  - id: python-send-disable-shell-history
    desc: Sends memory and disk history suppression
    crit: suspicious
    conf: 0.97
    attack: T1070.003
    if:
      type: symbol
      kind: call
      regex: '\.(send|sendall|sendline)$'
      arg:
        index: 0
        regex: '\bHISTSIZE=0\b.{0,40}\bHISTFILESIZE=0\b'
