defaults:
  platforms: [linux]
  for: [elf]
  arch: [x86-64]

composite_rules:
  - id: encrypted-native-shell-history-suppression
    desc: Encrypted shell path with disabled PTY history
    crit: suspicious
    conf: 0.98
    attack: T1562.003
    all:
      - id: micro-behaviors/data/decode/xor::native-shell-path-byte-xor
      - id: micro-behaviors/os/env/modify::histfile-dev-null
      - id: micro-behaviors/process/tty/pty::dev-ptmx
      - id: micro-behaviors/process/create/exec::syscall-execve-elf
      - id: objectives/anti-static/obfuscation/string/encrypt::unrolled-rip-relative-byte-xor
