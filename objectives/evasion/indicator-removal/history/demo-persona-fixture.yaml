# A shell startup file that provisions a synthetic persona for a recorded or
# shared demo session: a fixed custom prompt and an explicit git commit
# identity, with shell history disabled so the fixture leaves nothing behind.
# Nothing of a real user is concealed -- there is no real user; the history
# isolation is fixture hygiene, not indicator removal.
defaults:
  platforms: [unix, windows]
  for: [scripts]
composite_rules:
  - id: demo-persona-shell-fixture
    desc: Demo shell fixture provisions synthetic identity
    crit: exception
    conf: 0.9
    all:
      - id: micro-behaviors/os/env/modify::histfile-dev-null
      - id: micro-behaviors/process/create/shell/interactive::ps1-custom-prompt
      - id: micro-behaviors/os/env/write::git-identity-env-export
  # One semantic for every recognized benign history-isolation context: a
  # runner, launcher, probe, or fixture that deliberately keeps a shell it
  # owns from recording history. Referenced as a single suppression entry.
  - id: history-isolation-benign-context
    desc: Benign shell history-isolation contexts
    crit: exception
    conf: 1.0
    any:
      - id: micro-behaviors/process/tty/pty::terminal-runner-history-isolation
      - id: micro-behaviors/process/create/shell/interactive::isolated-rcfile-history
      - id: micro-behaviors/process/create/shell/interactive::login-shell-probe-history-isolation
      - id: objectives/evasion/indicator-removal/history::demo-persona-shell-fixture
      - id: metadata/package/testing/harness/unit::node-test-runner-import
