defaults:
  platforms: [unix]
  for: [elf]
composite_rules:
  # Co-occurring string references do not establish that a shell was spawned,
  # that these commands were run, or that the history setting was malicious.
  - id: native-pty-history-suppression-text
    desc: PTY path and multiple history suppression strings
    crit: suspicious
    conf: 0.88
    all:
      - id: micro-behaviors/process/tty/pty::dev-ptmx
      - id: micro-behaviors/os/env/modify::histfile-dev-null
      - id: micro-behaviors/os/env/runtime::elf-histsize-zero-text
      - id: micro-behaviors/os/env/runtime::elf-unset-histfile-text
    unless:
      - id: well-known/tool/sysadmin/unix-benign::emacs-tramp-native-eln
