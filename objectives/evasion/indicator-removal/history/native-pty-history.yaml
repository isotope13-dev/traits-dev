defaults:
  platforms: [unix]
  for: [elf]
composite_rules:
  - id: native-extra-history-settings
    desc: Multiple history suppression string references
    crit: component
    all:
      - id: micro-behaviors/os/env/runtime::histsize-zero-setting
      - id: micro-behaviors/os/env/runtime::elf-unset-histfile-text

  - id: native-shell-history-disabled-capability
    desc: Native shell capability with disabled history setting
    crit: notable
    all:
      - id: micro-behaviors/os/env/runtime::histfile-dev-null
      - id: micro-behaviors/fs/path/application/interpreter::bin-sh-path-reference
      - id: micro-behaviors/process/replace::syscall-execve-elf

  # These references establish capability and configuration, not execution
  # of a session. Preserve the older multiple-settings path as an alternative.
  - id: native-pty-history-suppression-text
    desc: PTY shell capability with history suppression settings
    crit: suspicious
    conf: 0.88
    for: [elf, macho]
    all:
      - id: micro-behaviors/process/tty/pty::pty-master-open-capability
      - id: micro-behaviors/os/env/runtime::histfile-dev-null
    any:
      - id: native-extra-history-settings
      - id: native-shell-history-disabled-capability
      # A shell can retain in-memory history while disabling the disk file.
      # EasyShell uses HISTSIZE=500 with HISTFILESIZE=0 and a null HISTFILE.
      - id: micro-behaviors/os/env/runtime::histfilesize-zero-setting
    unless:
      - id: well-known/tool/sysadmin/unix-benign::emacs-tramp-native-eln
