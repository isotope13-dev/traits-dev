# A launcher that starts an interactive shell from a clean environment points
# both readline's init file and the history file at /dev/null so the shell
# reads nothing from a directory another account can write (the sandbox-root
# terminal of an agent benchmark runner). The paired INPUTRC=/dev/null shows
# the history setting is part of a read-nothing hardening list rather than
# concealment of an operator's commands.
defaults:
  platforms: [unix]
  for: [scripts]
composite_rules:
  - id: hardened-shell-readline-history-isolation
    desc: Shell env nulls both readline config and history
    crit: exception
    conf: 0.9
    near_lines: 6
    all:
      - id: micro-behaviors/os/env/runtime::histfile-dev-null
      - id: micro-behaviors/os/env/runtime::inputrc-dev-null
