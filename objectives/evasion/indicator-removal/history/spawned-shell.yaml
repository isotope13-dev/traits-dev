# A program that opens interactive shells for someone else (a PTY or a
# console host) and makes sure those shells record no history. An operator
# typing into a remote terminal leaves nothing in ~/.bash_history or the
# PSReadLine history file for the machine's owner to find.
defaults:
  platforms: [windows, linux, macos]
  for: [python, javascript, typescript, go, ruby]
  attack: T1562.003,T1070.003

composite_rules:
  - id: interactive-shell-history-suppressed
    desc: Spawns interactive shells with history disabled
    crit: suspicious
    conf: 0.9
    all:
      - id: micro-behaviors/process/tty/pty/
    any:
      - id: micro-behaviors/os/env/modify::python-env-histfile-dev-null
      - id: micro-behaviors/os/console/control::powershell-psreadline-save-nothing
      - id: micro-behaviors/os/env/modify::histfile-dev-null
    unless:
      - id: well-known/tool/detection/ai-guardrail::command-rule-corpus
      - id: "metadata/file/naming::test-directory-component"
      - id: objectives/evasion/indicator-removal/history::history-isolation-benign-context
