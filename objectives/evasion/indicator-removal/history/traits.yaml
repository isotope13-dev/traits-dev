defaults:
  platforms: [windows, unix]
  for: [scripts]
traits:
  - id: shell-history-entry-delete
    desc: Deletes shell history entry with history -d
    crit: suspicious
    conf: 0.94
    mbc: F0005
    attack: T1070.003
    for: [shell, macho, go, c, cpp, python, javascript, swift]
    if:
      type: text
      regex: '(?m)(^|[;&|]\s*)history\s+-d\b'
  - id: fc-null-history
    desc: fc -p redirects Bash history to /dev/null
    crit: suspicious
    conf: 0.96
    mbc: F0005
    attack: T1070.003
    for: [shell, macho, go, c, cpp, python, javascript, swift]
    if:
      type: text
      regex: '(?m)(^|[;&|]\s*)fc\s+-p\s+/dev/null\b'
  - id: histfile-devnull
    desc: HISTFILE=/dev/null redirection
    crit: suspicious
    conf: 0.9
    mbc: F0005
    attack: T1070.003
    if:
      type: text
      regex: (?i)HISTFILE=/dev/null
    unless:
      - id: well-known/tool/detection/security-scanner::auditr-defensive-signature-catalog
      - id: micro-behaviors/process/tty/pty::terminal-runner-history-isolation
      - id: micro-behaviors/process/create/shell/interactive::isolated-rcfile-history
  - id: export-histfile
    desc: export HISTFILE to evasive destination
    crit: suspicious
    conf: 0.85
    mbc: F0005
    attack: T1070.003
    if:
      type: text
      regex: export HISTFILE=(/dev/null|/tmp/.{1,40}|/var/tmp/.{1,40})
    unless:
      - id: micro-behaviors/process/create/shell/interactive::isolated-rcfile-history
  - id: histsize-zero
    desc: HISTSIZE=0 disables history
    crit: suspicious
    conf: 0.9
    mbc: F0005
    attack: T1070.003
    if:
      type: text
      substr: HISTSIZE=0
    unless:
      - id: well-known/tool/detection/malcontent::malcontent-defensive-scanner-context
      - id: well-known/tool/sysadmin/unix-benign::emacs-tramp-native-eln
      - id: well-known/app/ai/aui-agent-builder/
      - id: metadata/package/files/system-package::zsh-function-script
      - id: micro-behaviors/process/tty/pty::terminal-runner-history-isolation
      - id: metadata/build/package/maintainer-scripts::cloud-marketplace-cleanup-path
      - id: micro-behaviors/process/create/shell/interactive::isolated-rcfile-history
  - id: histfilesize-zero
    desc: HISTFILESIZE=0 disables history file
    crit: suspicious
    conf: 0.9
    mbc: F0005
    attack: T1070.003
    if:
      type: text
      substr: HISTFILESIZE=0
    unless:
      - id: metadata/file/profile/identity::generated-attack-map-context
      - id: well-known/tool/sysadmin/unix-benign::emacs-tramp-native-eln
  - id: mysql-histfile-devnull
    desc: MYSQL_HISTFILE=/dev/null redirection
    crit: suspicious
    conf: 0.9
    mbc: F0005
    attack: T1070.003
    if:
      type: text
      regex: (?i)MYSQL_HISTFILE=/dev/null
  - id: export-mysql-histfile-evasive-destination
    desc: Export MYSQL_HISTFILE to an evasive destination
    crit: suspicious
    conf: 0.85
    mbc: F0005
    attack: T1070.003
    if:
      type: text
      regex: '(?i)export\s+MYSQL_HISTFILE\s*=\s*(/dev/null|/tmp/\.|/var/tmp/\.)'
  - id: set-plus-o-history
    desc: set +o history to disable bash history
    crit: suspicious
    conf: 0.9
    mbc: F0005
    attack: T1070.003
    if:
      type: text
      substr: 'set +o history'
    unless:
      - id: well-known/tool/detection/malcontent::malcontent-defensive-scanner-context
      - id: well-known/tool/sysadmin/alpine-packages/
      - id: well-known/tool/development/swiftlint::swiftlint-release-binary
      - id: metadata/lang/compiler/systems::swift-argument-parser-shell-completion-artifacts
      - id: micro-behaviors/process/tty/pty::node-pty-history-isolation
  - id: powershell-psreadline-history-remove
    desc: PowerShell PSReadLine history delete
    crit: suspicious
    conf: 0.9
    mbc: F0005
    attack: T1070.003
    platforms: [windows]
    for: [powershell, batch, markdown, text]
    if:
      type: text
      regex: (?i)\bRemove-Item\b[^\r\n]{0,80}\bGet-PSReadLineOption\b[^\r\n]{0,80}\.HistorySavePath\b
composite_rules:
  - id: histfile-null
    desc: Redirects shell history to /dev/null
    crit: suspicious
    conf: 0.9
    mbc: F0005
    attack: T1070.003
    any:
      - id: histfile-devnull
      - id: export-histfile
      - id: objectives/evasion/indicator-removal/logs::unset-histfile
      - id: histsize-zero
      - id: histfilesize-zero
    unless:
      - id: metadata/file/profile/identity::generated-attack-map-context
      - id: well-known/tool/detection/malcontent::malcontent-defensive-scanner-context
      - id: well-known/tool/detection/security-scanner::auditr-defensive-signature-catalog
      - id: well-known/tool/sysadmin/unix-benign::emacs-tramp-native-eln
      - id: micro-behaviors/process/tty/pty::terminal-runner-history-isolation
      - id: metadata/build/package/maintainer-scripts::cloud-marketplace-cleanup-path
      - id: micro-behaviors/process/create/shell/interactive::isolated-rcfile-history
  - id: mysql-histfile-null
    desc: Clears MySQL command history
    crit: suspicious
    conf: 0.9
    mbc: F0005
    attack: T1070.003
    any:
      - id: mysql-histfile-devnull
      - id: export-mysql-histfile-evasive-destination
  - id: prompt-command-clear
    desc: Unsets PROMPT_COMMAND to evade logging
    crit: suspicious
    conf: 0.85
    mbc: F0005
    attack: T1070.003
    any:
      - id: micro-behaviors/os/env/vars/modify::prompt-command-unset
      - id: micro-behaviors/os/env/vars/modify::prompt-command-empty
      - id: micro-behaviors/os/env/vars/modify::prompt-command-empty-assignment
    unless:
      - id: well-known/tool/sysadmin/unix-benign::emacs-tramp-native-eln
      - id: micro-behaviors/process/create/shell/interactive::isolated-rcfile-history
  - id: history-clearing
    desc: Shell history clearing techniques
    crit: suspicious
    conf: 0.9
    any:
      - id: histfile-null
      - id: mysql-histfile-null
      - id: native-shell-history-truncate
    unless:
      - id: well-known/tool/sysadmin/unix-benign::emacs-tramp-native-eln
      - id: micro-behaviors/process/create/shell/interactive::isolated-rcfile-history
  - id: shell-history-entry-delete-and-null
    desc: Shell history entry deletion and redirection
    # History isolation can be legitimate in terminal runners; the combined
    # behavior is suspicious, but its measured precision is below the hostile
    # composite floor without adding brittle context-specific legs.
    crit: suspicious
    conf: 0.99
    mbc: F0005
    attack: T1070.003
    platforms: [unix]
    for: [shell]
    all:
      - id: shell-history-entry-delete
      - id: fc-null-history
    near_lines: 4
  - id: native-shell-history-truncate
    desc: Native shell history truncate
    crit: hostile
    conf: 0.96
    for: [c, cpp, objc]
    attack: T1070.003
    all:
      - id: objectives/credential-access/shell/history::shell-history
      - id: micro-behaviors/fs/file/truncate::open-o-trunc-flag
  - id: combined-history-prompt-suppression
    desc: Shell history and prompt logging disabled
    crit: suspicious
    conf: 0.95
    attack: T1070.003
    all:
      - id: history-clearing
      - id: prompt-command-clear
    unless:
      - id: well-known/tool/sysadmin/unix-benign::emacs-tramp-native-eln
      - id: micro-behaviors/process/create/shell/interactive::isolated-rcfile-history
