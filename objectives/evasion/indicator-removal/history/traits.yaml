defaults:
  platforms: [windows, unix]
  for: [scripts]
traits:
  - id: shell-history-entry-delete
    desc: Deletes shell history entry with history -d
    crit: suspicious
    conf: 0.94
    mbc: F0005
    attack: T1070.003
    for: [shell, macho, go, c, cpp, python, javascript, swift]
    if:
      type: text
      regex: '(?m)(^|[;&|]\s*)history\s+-d\b'
    unless:
      - id: "metadata/file/naming::test-directory-component"
      - id: metadata/package/testing/presence/harness::go-test-file
      - id: micro-behaviors/process/tty/pty::shell-prompt-history-entry-cleanup
  - id: fc-null-history
    desc: fc -p redirects Bash history to /dev/null
    crit: suspicious
    conf: 0.96
    mbc: F0005
    attack: T1070.003
    for: [shell, macho, go, c, cpp, python, javascript, swift]
    if:
      type: text
      regex: '(?m)(^|[;&|]\s*)fc\s+-p\s+/dev/null\b'
  # The remote command line of an admin wrapper that pipes a sudo password to
  # `sudo -S` first stops bash recording it (`HISTFILE=/dev/null ;
  # HISTCONTROL=ignorespace ; echo '<password>' | sudo -S ...`). That keeps a
  # credential out of history; an evasion script clears history without a
  # password riding the same line.
  - id: history-isolation-before-sudo-password
    desc: History off before piping a sudo password
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)HISTFILE=/dev/null\s*;\s*HISTCONTROL=ignore\w+\s*;[^\n]{0,120}\|\s*sudo\s+-S'
  - id: histfile-devnull
    desc: HISTFILE=/dev/null redirection
    crit: suspicious
    conf: 0.9
    mbc: F0005
    attack: T1070.003
    if:
      type: text
      regex: (?i)HISTFILE=/dev/null
    unless:
      - id: well-known/tool/detection/
      - id: history-isolation-before-sudo-password
      - id: "metadata/file/naming::test-directory-component"
      - id: metadata/lang/scripted::dts-declaration-file
      - id: metadata/file/catalog/identity::cleave-trait-definition-file
      - id: objectives/evasion/indicator-removal/history::history-isolation-benign-context
    downgrade:
      scope: archive
      any:
      - id: well-known/tool/detection/opencode-v2-security::package-name
  - id: go-compressed-bashrc-profile
    desc: Embeds a compressed Bash startup profile
    crit: suspicious
    conf: 0.96
    mbc: F0005
    attack: T1070.003
    platforms: [linux]
    for: [go]
    if:
      type: text
      regex: 'BashRC\s*=\s*`Qlpo'
  - id: export-histfile
    desc: export HISTFILE to evasive destination
    crit: suspicious
    conf: 0.85
    mbc: F0005
    attack: T1070.003
    # The /dev/null spelling belongs to histfile-devnull, which matches a
    # superset of it; this atom keeps the tmp dot-directory destinations so
    # one construct is not counted twice.
    if:
      type: text
      regex: export HISTFILE=(/tmp/.{1,40}|/var/tmp/.{1,40})
    unless:
      - id: history-isolation-before-sudo-password
      - id: well-known/tool/detection/ai-guardrail::command-rule-corpus
      - id: well-known/tool/development/devspace::devspace-dev-container-context
      - id: "metadata/file/naming::test-directory-component"
      - id: objectives/evasion/indicator-removal/history::history-isolation-benign-context
  - id: mysql-histfile-devnull
    desc: MYSQL_HISTFILE=/dev/null redirection
    crit: suspicious
    conf: 0.9
    mbc: F0005
    attack: T1070.003
    if:
      type: text
      regex: (?i)MYSQL_HISTFILE=/dev/null
  - id: export-mysql-histfile-evasive-destination
    desc: Export MYSQL_HISTFILE to an evasive destination
    crit: suspicious
    conf: 0.85
    mbc: F0005
    attack: T1070.003
    if:
      type: text
      regex: '(?i)export\s+MYSQL_HISTFILE\s*=\s*(/dev/null|/tmp/\.|/var/tmp/\.)'
  - id: set-plus-o-history
    desc: set +o history to disable bash history
    crit: suspicious
    conf: 0.9
    mbc: F0005
    attack: T1070.003
    if:
      type: text
      substr: 'set +o history'
    unless:
      - id: well-known/tool/detection/
      - id: well-known/tool/sysadmin/alpine-packages/
      - id: well-known/tool/development/lint/linter::swiftlint-release-binary
      - id: metadata/lang/compiler/systems::swift-argument-parser-shell-completion-artifacts
      - id: micro-behaviors/process/tty/pty::shell-history-suppression-context
      - id: metadata/lang/scripted::dts-declaration-file
      - id: metadata/package/testing/
  - id: powershell-psreadline-history-remove
    desc: PowerShell PSReadLine history delete
    crit: suspicious
    conf: 0.9
    mbc: F0005
    attack: T1070.003
    platforms:
    - windows
    for:
    - powershell
    - batch
    - markdown
    - text
    if:
      type: text
      regex: (?i)\bRemove-Item\b[^\r\n]{0,80}\bGet-PSReadLineOption\b[^\r\n]{0,80}\.HistorySavePath\b
    unless:
    - id: metadata/package/documentation/agent-safety::security-example-documentation
    - id: metadata/package/documentation/agent-safety::authorized-reference-exercise
composite_rules:
  - id: histfile-null
    desc: Redirects shell history to /dev/null
    crit: suspicious
    conf: 0.9
    mbc: F0005
    attack: T1070.003
    any:
      - id: histfile-devnull
      - id: export-histfile
      - id: objectives/evasion/indicator-removal/logs::unset-histfile
    unless:
      - id: metadata/build/generated::generated-attack-map-context
      - id: well-known/tool/detection/malcontent::malcontent-defensive-scanner-context
      - id: well-known/tool/detection/security-scanner::auditr-defensive-signature-catalog
      - id: well-known/tool/sysadmin/unix-benign::emacs-tramp-native-eln
      - id: micro-behaviors/process/tty/pty::terminal-runner-history-isolation
      - id: metadata/build/package/maintainer-scripts::cloud-marketplace-cleanup-path
      - id: metadata/package/tooling::azure-agentbaker-tree
      - id: objectives/evasion/indicator-removal/history::history-isolation-benign-context
  - id: mysql-histfile-null
    desc: Clears MySQL command history
    crit: suspicious
    conf: 0.9
    mbc: F0005
    attack: T1070.003
    any:
      - id: mysql-histfile-devnull
      - id: export-mysql-histfile-evasive-destination
  # Notable, not suspicious. Rewriting PROMPT_COMMAND is what a shell prompt
  # framework does for a living: Bash-it's liquidprompt theme clears it before
  # rebuilding it, and apptainer's action_script.sh resets it when it sets up
  # a container shell. The matcher cannot see whether an audit hook was
  # installed there first, which is the difference between housekeeping and
  # evasion. `history-evasion-setup` needs two of its three markers, so
  # clearing PROMPT_COMMAND alongside HISTSIZE=0 still reports.
  - id: prompt-command-clear
    desc: Unsets PROMPT_COMMAND to evade logging
    crit: notable
    conf: 0.85
    mbc: F0005
    attack: T1070.003
    any:
      - id: micro-behaviors/os/env/modify::prompt-command-unset
      - id: micro-behaviors/os/env/modify::prompt-command-empty
      - id: micro-behaviors/os/env/modify::prompt-command-empty-assignment
    unless:
      - id: well-known/tool/sysadmin/unix-benign::emacs-tramp-native-eln
      - id: micro-behaviors/process/create/shell/interactive::isolated-rcfile-history
      - id: micro-behaviors/process/create/shell/interactive::login-shell-probe-history-isolation
  - id: history-clearing
    desc: Shell history clearing techniques
    crit: suspicious
    conf: 0.9
    any:
      - id: histfile-null
      - id: mysql-histfile-null
      - id: native-shell-history-truncate
    unless:
      - id: well-known/tool/sysadmin/unix-benign::emacs-tramp-native-eln
      - id: objectives/evasion/indicator-removal/history::history-isolation-benign-context
  - id: shell-history-entry-delete-and-null
    desc: Shell history entry deletion and redirection
    # History isolation can be legitimate in terminal runners; the combined
    # behavior is suspicious, but its measured precision is below the hostile
    # composite floor without adding brittle context-specific legs.
    crit: suspicious
    conf: 0.99
    mbc: F0005
    attack: T1070.003
    platforms: [unix]
    for: [shell]
    all:
      - id: shell-history-entry-delete
      - id: fc-null-history
    near_lines: 4
  - id: native-shell-history-truncate
    desc: Native shell history truncate
    crit: hostile
    conf: 0.96
    for: [c, cpp, objc]
    attack: T1070.003
    all:
      - id: objectives/credential-access/shell/history::shell-history
      - id: micro-behaviors/fs/file/truncate::open-o-trunc-flag
  - id: combined-history-prompt-suppression
    desc: Shell history and prompt logging disabled
    crit: suspicious
    conf: 0.95
    attack: T1070.003
    all:
      - id: history-clearing
      - id: prompt-command-clear
    unless:
      - id: well-known/tool/sysadmin/unix-benign::emacs-tramp-native-eln
      - id: micro-behaviors/process/create/shell/interactive::isolated-rcfile-history
      - id: objectives/evasion/indicator-removal/history::history-isolation-benign-context
