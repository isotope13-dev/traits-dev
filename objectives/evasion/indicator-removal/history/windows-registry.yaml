# Windows Explorer records launched programs and user-opened files in these
# registry stores. A binary that both disables this instrumentation and carries
# the deletion API for every store is selectively erasing its execution trail.
# ATT&CK: T1070 (Indicator Removal)
defaults:
  platforms: [windows]
  for: [pe]
  attack: T1070

composite_rules:
  - id: selective-explorer-execution-history-erasure
    desc: Disables Explorer instrumentation and deletes its execution history
    crit: hostile
    conf: 0.99
    all:
      - id: micro-behaviors/os/registry/explorer/reference::explorer-userassist-history-path
      - id: micro-behaviors/os/registry/explorer/reference::explorer-open-save-history-path
      - id: micro-behaviors/os/registry/explorer/reference::explorer-no-instrumentation-value
      - id: micro-behaviors/os/registry/explorer/reference::explorer-runmru-history-path
      - id: micro-behaviors/os/registry/delete::reg-delete-value-a-symbol
      - id: micro-behaviors/os/registry/value/write::registry-set-value-api
