# Windows Explorer records launched programs and user-opened files in these
# registry stores. A binary that both disables this instrumentation and carries
# the deletion API for every store is selectively erasing its execution trail.
# ATT&CK: T1070 (Indicator Removal)
defaults:
  platforms: [windows]
  for: [pe]
  attack: T1070

traits:
  - id: explorer-runmru-history-path
    desc: References the Explorer Run dialog history
    crit: component
    conf: 0.92
    if:
      type: text
      substr: 'Explorer\RunMRU'

  - id: explorer-userassist-history-path
    desc: References Explorer UserAssist history
    crit: component
    conf: 0.94
    if:
      type: text
      substr: 'Explorer\UserAssist\'

  - id: explorer-open-save-history-path
    desc: References the Explorer OpenSavePidlMRU history
    crit: component
    conf: 0.94
    if:
      type: text
      substr: 'Explorer\ComDlg32\OpenSavePidlMRU'

  - id: explorer-no-instrumentation-value
    desc: References the Explorer NoInstrumentation value
    crit: component
    conf: 0.95
    if:
      type: text
      exact: NoInstrumentation

composite_rules:
  - id: selective-explorer-execution-history-erasure
    desc: Disables Explorer instrumentation and deletes its execution history
    crit: hostile
    conf: 0.99
    all:
      - id: explorer-userassist-history-path
      - id: explorer-open-save-history-path
      - id: explorer-no-instrumentation-value
      - id: explorer-runmru-history-path
      - id: micro-behaviors/os/registry/manipulate::reg-delete-value-a-symbol
      - id: micro-behaviors/os/registry/manipulate::registry-write-api-chain
