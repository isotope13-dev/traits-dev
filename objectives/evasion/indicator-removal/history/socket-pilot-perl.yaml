# Canonical placement from the socket-shell cohort audit.
defaults:
  for:
  - perl
  platforms:
  - unix
  - windows
  crit: suspicious
traits:
- id: perl-history-unset-prelude
  desc: History wipe shell prelude
  conf: 0.95
  attack: T1070.003
  if:
    type: string_literal
    substr: unset HISTFILE; unset SAVEHIST
composite_rules:
- id: perl-history-suppressed-recon
  desc: History suppression with host reconnaissance
  conf: 0.97
  all:
  - id: objectives/evasion/indicator-removal/history::perl-history-unset-prelude
  - id: micro-behaviors/os/sysinfo/command::perl-host-recon-command-list
