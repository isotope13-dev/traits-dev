# Walking the WinINet URL cache and deleting entries out of it.
#
# The cache is a record of what the machine fetched — every URL Internet
# Explorer, Edge in IE mode, and any WinINet-based component touched, with its
# response body still on disk. `FindFirstUrlCacheEntry`/`FindNextUrlCacheEntry`
# enumerate it; `DeleteUrlCacheEntry` removes a chosen entry.
#
# Enumeration alone is a privacy tool or a cache-inspection utility, and
# deletion alone is what a "clear browsing data" button does. Enumerating in
# order to delete *selected* entries is neither: it is a program deciding which
# of the machine's browsing records should stop existing, which is what an
# implant does to its own callback URLs and what click-fraud adware does to hide
# the traffic it generated.
#
# Browser-cleaner products do exactly this too, which is what the exclusions are
# for — a real one is signed and says who wrote it.
defaults:
  platforms: [windows]
  for: [pe, dll, csharp, powershell]
  attack: T1070.004
  mbc: E1070

composite_rules:
  - id: selective-url-cache-record-removal
    desc: Enumerates and deletes URL cache records
    crit: suspicious
    conf: 0.93
    all:
      - id: micro-behaviors/communications/http/get::url-cache-enumeration
      - id: micro-behaviors/communications/http/get::delete-url-cache-entry
    unless:
      - id: metadata/signed/platform/
      - id: well-known/tool/
      - id: metadata/package/testing/
