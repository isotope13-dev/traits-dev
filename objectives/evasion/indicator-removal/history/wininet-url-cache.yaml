defaults:
  platforms:
  - windows
  for:
  - pe
  - dll
  - csharp
  - powershell
  attack: T1070.004
  mbc: E1070
composite_rules:
- id: overlay-loader-cache-management-apis
  for:
  - pe
  desc: Overlay loader contains WinINet cache enumeration and deletion API references
  crit: suspicious
  conf: 0.93
  scope: file
  all:
  - id: micro-behaviors/communications/http/client/wininet::url-cache-enumeration
  - id: micro-behaviors/communications/http/client/wininet::delete-url-cache-entry
  - id: objectives/command-and-control/backdoor/loader/native-reflect::overlay-payload-manual-map-loader
  unless:
  - id: metadata/binary/vendor/
  - id: metadata/signed/platform/
  - id: well-known/tool
  - id: metadata/package/testing/
  - id: well-known/lib/native/pywin32::pywin32-binding-module
  - id: well-known/app/system/iobit::iobit-signer
  - id: well-known/app/system/winutilities::winutilities-signed-suite-component
  - id: well-known/app/system/reactos::system-component
  - id: metadata/path::test-directory-component
  attack: T1070.004,T1620
