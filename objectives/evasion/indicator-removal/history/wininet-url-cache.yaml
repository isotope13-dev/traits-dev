# Pair WinINet cache enumeration and deletion with a concealed payload loader.
# The API set alone is not evidence of indicator removal: browser cleaners and
# downloaders can use it legitimately. This objective requires the same PE to
# contain the hidden overlay manual-mapping loader. In this sample, the code
# walks the cache and deletes each enumerated entry without filtering, so the
# supported behavior is a cache purge rather than selective URL removal.
defaults:
  platforms: [windows]
  for: [pe, dll, csharp, powershell]
  attack: T1070.004
  mbc: E1070

composite_rules:
  - id: overlay-loader-cache-management-apis
    for: [pe]
    desc: Overlay loader contains WinINet cache enumeration and deletion API references
    crit: suspicious
    conf: 0.93
    scope: file
    all:
      - id: micro-behaviors/communications/http/client/wininet::url-cache-enumeration
      - id: micro-behaviors/communications/http/client/wininet::delete-url-cache-entry
      - id: objectives/command-and-control/backdoor/loader/native-reflect::overlay-payload-manual-map-loader
    unless:
      # A reimplementation of the Windows API exports this surface by
      # definition -- Wine and ReactOS ship the very component the rule
      # describes. The vendor directory is the established marker for that.
      - id: metadata/binary/vendor/
      - id: metadata/signed/platform/
      - id: well-known/tool/
      - id: metadata/package/testing/
      - id: well-known/lib/native/pywin32::pywin32-binding-module
      # IObit's PC-care suite (Advanced SystemCare, Driver Booster) ships
      # CareScan.exe, which imports the whole WinINet cache surface. Keyed on
      # the code-signing certificate, not on product strings an implant could
      # copy.
      - id: well-known/app/system/iobit::iobit-signer
      # Verified WinUtilities cleaners enumerate entries for their explicit
      # history/disk cleanup options. The suite identity is keyed on the
      # verified Authenticode digest and the suite's leaf signer.
      - id: well-known/app/system/winutilities::winutilities-signed-suite-component
      # WinINet itself implements cache enumeration and deletion.
      - id: well-known/app/system/reactos::system-component
      - id: "metadata/file/naming::test-directory-component"
    attack: T1070.004,T1620
