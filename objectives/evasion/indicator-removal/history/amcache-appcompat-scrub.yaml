# Windows records program execution in the Amcache hive and the AppCompatCache
# value. Flushing that cache and deleting its value erases the record. A reader
# that only opens the hive neither flushes nor deletes it, so the rule needs the
# flush API and the value deletion beside the hive reference.
# Windows' own kernel32 and KernelBase carry the same Amcache and appcompat
# spellings and a registry delete, so a verified Microsoft system component
# is exempt. A malicious copy cannot carry a Microsoft chain.
# ATT&CK: T1070 (Indicator Removal)
defaults:
  platforms: [windows]
  for: [pe]
  attack: T1070

traits:
  - id: amcache-hive-file-reference
    desc: References the Amcache.hve hive file
    crit: notable
    conf: 0.92
    if:
      type: text
      substr: Amcache.hve

  - id: appcompatcache-flush-api
    desc: References BaseFlushAppcompatCache API
    crit: notable
    conf: 0.94
    if:
      type: text
      substr: BaseFlushAppcompatCache

composite_rules:
  - id: amcache-appcompat-scrub
    desc: Flushes and deletes Amcache and AppCompatCache execution records
    crit: hostile
    conf: 0.9
    all:
      - id: amcache-hive-file-reference
      - id: appcompatcache-flush-api
      - id: micro-behaviors/os/registry/delete::reg-delete-value-w-symbol
    unless:
      - id: well-known/app/system/microsoft/platform::microsoft-signed-system-component-context
