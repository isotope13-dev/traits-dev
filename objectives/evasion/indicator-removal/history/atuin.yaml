# Atuin can suppress selected commands or working directories before they are
# written to its shell-history database.  The options are dual-use privacy
# controls; intent comes from combining them with ordinary shell-history
# suppression, which removes the second logging path described in the article.
defaults:
  platforms: [linux, macos, windows]
  for: [scripts, source, data]
  attack: T1070.003

traits:
  - id: atuin-history-filter-secret-pattern
    desc: Atuin filter targets secrets
    crit: suspicious
    conf: 0.96
    if:
      type: text
      regex: '(?is)^\s*history_filter\s*=\s*\[[^]]{0,500}\b(secret|token|password|credential)\b'

  - id: atuin-cwd-filter-sensitive-path
    desc: Atuin cwd filter targets sensitive paths
    crit: suspicious
    conf: 0.96
    if:
      type: text
      regex: '(?is)^\s*cwd_filter\s*=\s*\[[^]]{0,400}\b(secret|staging|loot|payload)\b'

composite_rules:
  - id: atuin-history-filtering
    desc: Atuin filters commands and working directories from shell history
    crit: suspicious
    conf: 0.94
    all:
      - id: well-known/tool/sysadmin/atuin::atuin-history-filter-option
      - id: well-known/tool/sysadmin/atuin::atuin-cwd-filter-option

  - id: atuin-sensitive-history-filter
    desc: Atuin omits secret-bearing commands from shell history
    crit: suspicious
    conf: 0.97
    all:
      - id: well-known/tool/sysadmin/atuin::atuin-history-filter-option
      - id: atuin-history-filter-secret-pattern

  - id: atuin-command-filter-with-shell-history-disable
    desc: Atuin command filter paired with disabled shell history
    crit: hostile
    conf: 0.98
    all:
      - id: well-known/tool/sysadmin/atuin::atuin-history-filter-option
      - id: atuin-history-filter-secret-pattern
      - id: objectives/evasion/indicator-removal/history::set-plus-o-history

  - id: atuin-cwd-filter-with-shell-history-disable
    desc: Atuin working-directory filter paired with disabled shell history
    crit: hostile
    conf: 0.98
    all:
      - id: well-known/tool/sysadmin/atuin::atuin-cwd-filter-option
      - id: atuin-cwd-filter-sensitive-path
      - id: objectives/evasion/indicator-removal/history::set-plus-o-history
