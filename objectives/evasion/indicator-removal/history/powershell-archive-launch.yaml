defaults:
  platforms: [windows]
  for: [powershell]

composite_rules:
  - id: powershell-excluded-payload-history-erasure
    desc: Excluded archive payload launch accompanies history erasure
    crit: hostile
    conf: 0.99
    attack: T1070.003,T1562.001
    all:
      - id: objectives/execution/payload/file-exec/command/script-host-embedded::powershell-defender-exclusion-iwr-7za-dropper
      - id: objectives/evasion/indicator-removal/history::powershell-psreadline-history-remove
      - id: micro-behaviors/os/console/control::powershell-psreadline-save-nothing
      - id: micro-behaviors/os/console/control::powershell-psreadline-clear-history
    near_bytes: 16384
