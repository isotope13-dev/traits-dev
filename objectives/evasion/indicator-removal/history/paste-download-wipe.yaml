# macOS/Linux ClickFix one-liners (DriveSurge) fetch a script into a temp
# file, run it with bash and then wipe the evidence the victim could see:
# the visible Terminal and its scrollback (clear + ESC[3J) and the pasted
# line in shell history (history -d, fc -p /dev/null).
defaults:
  platforms: [unix]
  for: [shell]
  attack: T1070.003,T1059.004,T1105
composite_rules:
  - id: download-run-then-history-and-screen-wipe
    desc: Downloaded script run, history and screen wiped
    crit: hostile
    conf: 0.95
    near_bytes: 1024
    all:
      - id: micro-behaviors/communications/http/download/curl::shell-curl-output-option-call
      - id: micro-behaviors/process/create/shell/interpreter::shell-variable-script-file
      - id: objectives/evasion/indicator-removal/history::shell-history-entry-delete
    any:
      - id: micro-behaviors/ui/terminal::ansi-erase-op
      - id: micro-behaviors/ui/terminal::ansi-terminal-control-command
