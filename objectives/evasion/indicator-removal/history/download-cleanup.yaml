defaults:
  platforms: [unix]
  for: [shell]
  attack: T1070.003

traits:
  - id: shell-history-last-line-delete
    desc: sed deletes last shell history entry
    crit: suspicious
    conf: 0.96
    if:
      type: text
      regex: 'sed\s+-i\s+(["'']{2}\s+)?["'']\$d["'']\s+["'']?\$HOME/\.(bash_history|zsh_history)["'']?'

composite_rules:
  - id: macos-payload-history-erasure
    desc: Remote payload staging followed by history erasure
    crit: hostile
    conf: 0.99
    attack: "T1070.003,T1105,T1553.001"
    all:
      - id: shell-history-last-line-delete
      - id: objectives/evasion/quarantine-removal/bypass::downloaded-payload-quarantine-bypass
    near_bytes: 4096
  - id: downloaded-stage-history-delete
    desc: Downloaded executable stage deletes history
    crit: hostile
    conf: 0.98
    attack: T1105,T1070.003
    all:
      - id: shell-history-last-line-delete
      - id: micro-behaviors/communications/http/download/shell::fetch-var-output-var
      - id: micro-behaviors/fs/chmod/executable/mode::chmod-exec-var-target
      - id: micro-behaviors/process/daemonize/detach::nohup-shell-launch
  - id: powershell-history-suppressed-remote-eval
    desc: PowerShell disables history and evaluates HTTP download
    crit: hostile
    conf: 0.98
    platforms: [windows, unix]
    for: [powershell]
    attack: T1070.003,T1059.001,T1105
    mbc: F0005,B0030,E1059
    near_lines: 30
    all:
      - id: micro-behaviors/os/env/modify::powershell-psreadline-save-nothing
      - id: micro-behaviors/communications/http/lib/invoke-webrequest::webclient-downloadstring
      - id: micro-behaviors/communications/http/lib/invoke-webrequest::downloadstring-cleartext-http-url
      - id: micro-behaviors/process/interpreter/eval/direct::powershell-iex-call

