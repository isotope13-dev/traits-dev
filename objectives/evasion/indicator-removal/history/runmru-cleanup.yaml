defaults:
  platforms: [windows]
  for: [powershell, batch, scripts]
  attack: T1112

composite_rules:
  - id: explorer-runmru-registry-wipe
    desc: Deletes Explorer Run dialog MRU history
    crit: suspicious
    conf: 0.95
    all:
      - id: micro-behaviors/os/registry/explorer/reference::explorer-runmru-history-path
    any:
      - id: micro-behaviors/os/registry/delete::powershell-registry-value-delete
      - id: micro-behaviors/data/property/write::powershell-remove-item-property-call

  - id: runmru-wipe-with-self-delete
    desc: Wipes Explorer RunMRU history and self-deletes
    crit: hostile
    conf: 0.98
    for: [powershell, scripts]
    attack: T1070.004,T1112
    all:
      - id: explorer-runmru-registry-wipe
      - id: micro-behaviors/fs/delete/file/self::powershell-self-delete
