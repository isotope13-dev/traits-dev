# Replaces the administrator's network view with an inverse-filtering wrapper.
# Keep ordinary ad hoc `netstat | grep -v` diagnostics below hostile.
defaults:
  platforms: [unix]
  for: [shell]
  attack: T1564
traits:
  - id: system-netstat-heredoc-write
    desc: Overwrites system netstat using heredoc
    crit: notable
    if:
      type: text
      regex: '(?m)^[ \t]*cat[ \t]*>[ \t]*["'']?/(usr/)?s?bin/netstat["'']?[ \t]*<<'
composite_rules:
  - id: replaced-netstat-hides-connections
    desc: Replaces system netstat with connection-filtering wrapper
    crit: hostile
    conf: 0.98
    near_lines: 5
    all:
      - id: system-netstat-heredoc-write
      - id: micro-behaviors/network/status::netstat-inverse-output-filter
      - id: micro-behaviors/network/status::grep-excludes-ipv4-lines
