defaults:
  platforms: [unix]
  for: [c, cpp]
  attack: T1562.006
  mbc: B0047

traits:
  - id: proxy-connection-counter-decrements
    desc: Decrements proxy connection counters
    crit: suspicious
    conf: 0.99
    if:
      type: text
      regex: '(?s)\bbeconn\s*--\s*;.{0,300}\bfeconn\s*--\s*;.{0,300}\bactconn\s*--\s*;'

  - id: proxy-request-counter-decrements
    desc: Decrements cumulative proxy requests
    crit: suspicious
    conf: 0.99
    if:
      type: text
      regex: '(?s)\bcum_conn\s*--\s*;.{0,300}\bcum_req\s*--\s*;'

  - id: proxy-byte-counter-decrements
    desc: Decrements cumulative proxy byte counters
    crit: suspicious
    conf: 0.99
    if:
      type: text
      regex: '(?s)\bbytes_in\s*--\s*;.{0,300}\bbytes_out\s*--\s*;'

composite_rules:
  - id: proxy-statistics-counter-scrub
    desc: Scrubs live and cumulative proxy statistics
    crit: suspicious
    conf: 0.99
    all:
      - id: proxy-connection-counter-decrements
      - id: proxy-request-counter-decrements
      - id: proxy-byte-counter-decrements
    near_lines: 40
