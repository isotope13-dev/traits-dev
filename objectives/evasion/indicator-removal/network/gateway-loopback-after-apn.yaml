# In the report, the gateway used for the APN pivot was later made difficult
# to recover by assigning an unreachable loopback address. The network-setting
# atom is neutral; the pivot context makes this a track-covering action.
defaults:
  platforms: [windows, unix]
  for: [scripts]
  attack: T1070

composite_rules:
  - id: gateway-loopback-after-private-apn-pivot
    desc: Hides a private-APN gateway at loopback after an OT pivot
    crit: hostile
    conf: 0.98
    attack: T1070,T1572
    all:
      - id: objectives/lateral-movement/ssh/connect::private-apn-ics-ssh-pivot
      - id: micro-behaviors/communications/ip/assignment::ip-set-to-loopback
    near_lines: 32
