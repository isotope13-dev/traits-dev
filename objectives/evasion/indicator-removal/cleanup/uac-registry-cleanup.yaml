defaults:
  for:
  - powershell
  platforms:
  - windows
  crit: notable
  conf: 0.98
composite_rules:
- id: powershell-uac-command-override-cleanup
  desc: UAC command override with property removal
  crit: hostile
  all:
  - id: micro-behaviors/data/property/write::powershell-remove-item-property-call
  any:
  - id: objectives/privilege-escalation/elevation-control/uac-bypass/hijack::powershell-uac-registry-override-module
  - id: objectives/privilege-escalation/elevation-control/uac-bypass/hijack::silentcleanup-windir-override
  - id: objectives/privilege-escalation/elevation-control/uac-bypass/hijack::powershell-silentcleanup-hidden-launcher
- id: powershell-fodhelper-command-cleanup
  desc: Removes FodHelper override properties
  crit: hostile
  all:
  - id: objectives/privilege-escalation/elevation-control/uac-bypass/hijack::fodhelper-delegateexecute-hijack
  - id: micro-behaviors/data/property/write::powershell-remove-item-property-call
