defaults:
  platforms: [windows]
  for: [powershell]
composite_rules:
  - id: offset-archive-environment-path-cleanup
    desc: Offset archive launcher includes environment-path deletion
    crit: suspicious
    conf: 0.96
    attack: T1070.004
    # These predicates do not bind the stored self path to the deleted path.
    # The sample does delete itself; this rule makes the narrower syntax claim.
    all:
      - id: objectives/execution/payload/file-exec/command/script-host-embedded::offset-passworded-archive-hidden-launch
      - id: micro-behaviors/process/info/selfpath::powershell-script-path-stored-env
      - id: metadata/lang/encoding::negative-offset-environment-path-removal
