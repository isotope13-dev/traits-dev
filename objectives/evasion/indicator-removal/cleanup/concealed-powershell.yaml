defaults:
  platforms: [windows]
  for: [powershell]
composite_rules:
  - id: concealed-downloader-path-cleanup
    desc: Concealed script downloader includes forced path cleanup
    crit: hostile
    conf: 0.96
    attack: T1070.004
    near_bytes: 1024
    all:
      - id: objectives/execution/payload/file-exec/download/script-host::concealed-account-reporting-script-launch
      - id: micro-behaviors/fs/delete/file/command::powershell-force-remove-variable-path
