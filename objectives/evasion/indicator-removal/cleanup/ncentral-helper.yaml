defaults:
  platforms: [linux]
  for: [python]
composite_rules:
  # Require the ownership-redirection exploit, not ordinary backup maintenance.
  # These are generated commands; proximity does not prove runtime data flow.
  - id: ncentral-helper-restore-cleanup
    desc: N-central exploit embeds copy, ownership reset, and cleanup commands
    crit: hostile
    conf: 0.97
    attack: T1070.004
    ref: https://huntback.io/blog/ncentral-4everable2shell-miners-on-live-servers
    near_lines: 30
    all:
      - id: objectives/privilege-escalation/exploit/vulnerabilities/appliance::ncentral-symlink-helper-escalation
      - id: micro-behaviors/fs/file/copy/command::python-formatted-force-copy
      - id: micro-behaviors/fs/chown::python-formatted-root-owner
      - id: micro-behaviors/fs/delete/file/command::python-formatted-force-remove
