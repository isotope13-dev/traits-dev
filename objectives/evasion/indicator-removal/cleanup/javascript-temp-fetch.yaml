# Cleanup is required; the fetch output, temp batch path and child-process
# capability are not bound into the ordered download-run-delete chain.
defaults:
  platforms: [windows]
  for: [javascript]

composite_rules:
  - id: javascript-temp-script-cleanup-fetch-profile
    desc: Temp script cleanup near fetch and shell clues
    crit: suspicious
    conf: 0.95
    attack: T1070.004
    mbc: B0024,E1105
    all:
      - id: micro-behaviors/fs/delete/file/command::quiet-delete-temp-script-command
      - id: micro-behaviors/fs/path/temp::temporary-batch-path-reference
      - id: micro-behaviors/os/module/require::child-process-require
    needs: 1
    any:
      - id: micro-behaviors/communications/http/download/curl::curl-output-file
      - id: micro-behaviors/communications/http/download/cli::fetch-output-flag-script
