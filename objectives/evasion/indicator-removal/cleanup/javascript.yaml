defaults:
  platforms: [windows]
  for: [javascript]

composite_rules:
  - id: js-wsh-staged-file-cleanup
    desc: JScript cleans a staged file after hidden PowerShell execution
    crit: hostile
    conf: 0.98
    attack: T1070.004,T1059.001,T1059.007
    mbc: B0006
    all:
      # The WSH DeleteFile call form, not a receiver-name literal: droppers
      # hold the FileSystemObject in any variable (`fso`, `fs`, `sh`), and the
      # staged-file cleanup claim needs the deletion, not one naming choice.
      - id: micro-behaviors/fs/delete/file/library::wsh-deletefile-call
      - id: objectives/execution/interpreter/script/dropper::wsh-powershell-dropper
    any:
      - id: micro-behaviors/process/create/exec::wsh-progid-near-run
      - id: micro-behaviors/process/create/hidden::wmi-hidden-process-startup
