defaults:
  platforms: [windows]
  for: [javascript]
  mbc: B0006

composite_rules:
  - id: js-wsh-staged-file-cleanup
    desc: WSH DeleteFile beside concealed PowerShell staging and launch
    crit: hostile
    conf: 0.98
    attack: T1070.004,T1059.001,T1059.007
    all:
      # The WSH DeleteFile call form, not a receiver-name literal: droppers
      # hold the FileSystemObject in any variable (`fso`, `fs`, `sh`), and the
      # staged-file cleanup claim needs the deletion, not one naming choice.
      - id: micro-behaviors/fs/delete/file/library::wsh-deletefile-call
      - id: objectives/execution/payload/file-exec::wsh-xor-base64-hidden-ps1-exec

  # Companion to the staged-file cleanup above: the same loader family stages
  # its decoded PowerShell stage in a WSH environment variable, launches it
  # through a hidden WMI process create, and then removes the variable with
  # the collection's Remove call, erasing the staging trace. Requiring the
  # raw WMI hidden-create idiom keeps ordinary environment variable cleanup
  # out of the claim.
  - id: js-wsh-staged-env-cleanup
    desc: WSH removes a staged environment variable beside a hidden WMI launch
    crit: hostile
    conf: 0.97
    attack: T1070.004,T1047
    all:
      - id: micro-behaviors/os/env/write::wsh-environment-remove-call
      - id: micro-behaviors/process/create/hidden::wmi-hidden-four-argument-process-create
