defaults:
  platforms: [windows]
  for: [png, powershell, batch]
  attack: T1070.004
traits:
  - id: powershell-marker-selected-script-delete
    desc: Deletes scripts selected by content marker
    crit: suspicious
    conf: 0.96
    if:
      type: yara
      source: |
        rule powershell_marker_selected_script_delete {
          strings:
            $select = "Select-String -LiteralPath $hit -Pattern $FirstMarker -SimpleMatch -Quiet" nocase
            $delete = /Remove-Item\s+-LiteralPath\s+\$hit\s+-Force/ nocase
            $scripts = "[IO.Directory]::EnumerateFiles($dir, '*.ps1')" nocase
          condition:
            // Raw code inside PNG is meaningful here only in the bundle carrier.
            (uint32be(0) != 0x89504e47 or
              uint32be(filesize-4) == 0x53544733) and
            for any s in (1..#select) : (
              $scripts in (@select[s]-256..@select[s]) and
              $delete in (@select[s]+!select[s]..@select[s]+!select[s]+256)
            )
        }
  - id: powershell-carrier-read-delete
    desc: Reads and deletes the carrier image
    crit: suspicious
    conf: 0.97
    if:
      type: yara
      source: |
        rule powershell_carrier_read_delete {
          strings:
            $read = "$bytes = [System.IO.File]::ReadAllBytes($imgPath)" nocase
            $map = "$entries = Get-StegoPayloadMap -Bytes $bytes" nocase
            $delete = /Remove-Item\s+-LiteralPath\s+\$imgPath\s+-Force/ nocase
          condition:
            // Raw code inside PNG is meaningful here only in the bundle carrier.
            (uint32be(0) != 0x89504e47 or
              uint32be(filesize-4) == 0x53544733) and
            for any r in (1..#read) : (
              $map in (@read[r]..@read[r]+256) and
              $delete in (@read[r]+!read[r]..@read[r]+8192)
            )
        }
