# Node writes a script file synchronously, executes it via execFile under
# ELECTRON_RUN_AS_NODE or cscript //nologo, and unlinks the file in the
# completion callback to remove staging artifacts from disk.
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
  mbc: B0006
  attack: T1070.004,T1059.007

composite_rules:
  - id: node-temp-script-exec-cleanup
    desc: Writes, executes, and deletes a temporary script
    crit: hostile
    conf: 0.94
    scope: file
    near_bytes: 4096
    all:
      - id: micro-behaviors/fs/write/file/full/call::write-file-sync
      - id: micro-behaviors/process/create/exec::js-execfile-call
      - id: micro-behaviors/fs/delete/file/library::fs-unlinkSync
    any:
      - id: micro-behaviors/os/env/runtime::electron-run-as-node-env-injection
      - id: micro-behaviors/process/interpreter/wsh::js-cscript-nologo
