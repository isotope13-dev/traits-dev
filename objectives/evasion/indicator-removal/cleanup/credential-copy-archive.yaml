# Same-file profile: upload and recursive removal are required, but the
# matcher does not bind the deleted operands to the uploaded archive path.
defaults:
  platforms: [macos]
  for: [applescript]
composite_rules:
  - id: phished-credential-archive-upload-rm-profile
    desc: Credential upload with recursive cleanup code
    crit: hostile
    conf: 0.96
    attack: T1070.004
    all:
      - id: objectives/exfiltration/stealer/credential/record::phished-keychain-copy-zip-upload-profile
      - id: micro-behaviors/fs/delete/directory::rm-rf
