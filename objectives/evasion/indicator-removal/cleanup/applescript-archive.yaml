defaults:
  platforms: [macos]
  for: [applescript, shell, macho]
  conf: 0.96
  attack: T1070.004

composite_rules:
  # This is deliberately a co-occurrence claim: the file-level rule does
  # not prove that the deleted path is the upload operand.
  - id: credential-exfiltration-temp-archive-removal
    desc: Credential exfiltration with temporary ZIP removal
    crit: hostile
    all:
      - id: objectives/exfiltration/stealer/file::applescript-buildid-databinary-exfil
      - id: micro-behaviors/fs/delete/file/command::applescript-temp-zip-removal

  # File-scoped co-occurrence does not bind the removed directory to the
  # upload operand. ZIP-file deletion remains a separate observation.
  - id: credential-exfiltration-recursive-directory-removal
    desc: Credential exfiltration with recursive directory removal
    crit: hostile
    all:
      - id: objectives/exfiltration/stealer/file::applescript-buildid-databinary-exfil
      - id: micro-behaviors/fs/delete/directory::applescript-recursive-rm-interpolated-target
