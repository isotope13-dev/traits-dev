defaults:
  platforms: [windows]
  for: [pe, dll]
  attack: T1070
composite_rules:
  - id: scrubbing-shellcode-loader
    desc: Shellcode loader with heap-scrub anti-forensic flow
    crit: hostile
    conf: 0.93
    arch: [x86-64]
    size_max: 5242880
    all:
      - id: micro-behaviors/os/api-resolution/manual::peb-pe-walk-memory-protection-clues-x64
      - id: "micro-behaviors/mem/free::heap-free"
      - id: "micro-behaviors/mem/fill::vectorized-zero-fill"
