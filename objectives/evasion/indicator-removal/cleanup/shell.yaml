defaults:
  platforms: [unix]
  for: [shell]
  attack: T1070.004
  mbc: F0007

composite_rules:
  - id: multiarch-loader-temp-script-cleanup
    desc: Multi-architecture loader removes temporary script
    crit: hostile
    conf: 0.99
    all:
      - id: micro-behaviors/communications/http/download/cli::curl-wget-ipv4-url
      - id: micro-behaviors/process/create/local-exec::tmp-path-execution
      - id: micro-behaviors/os/sysinfo/platform/arch::multi-arch-target
      - id: micro-behaviors/fs/file/delete::force-delete-temp-shell-script
    unless:
      - id: metadata/package/testing/
      - id: micro-behaviors/os/service/legitimate::installer-script
