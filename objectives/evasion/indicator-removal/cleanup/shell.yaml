defaults:
  platforms: [unix]
  for: [shell]
  attack: T1070.004
  mbc: F0007

composite_rules:
  - id: multiarch-loader-temp-script-cleanup
    desc: Multi-architecture loader removes temporary script
    crit: hostile
    conf: 0.99
    all:
      - id: micro-behaviors/communications/http/url/external-ip::curl-wget-ipv4-url
      - id: micro-behaviors/process/create/local-exec::tmp-path-execution
      - id: "micro-behaviors/os/sysinfo/platform/arch::multi-arch-target"
      - id: micro-behaviors/fs/delete/file/command::force-delete-temp-shell-script
    unless:
      - id: metadata/package/testing/
      - id: micro-behaviors/os/package-manager/installer-script::installer-script
      - id: metadata/path::test-directory-component
  - id: shell-stealer-hidden-temp-cleanup
    desc: Shell stealer removes hidden temporary payload
    crit: hostile
    conf: 0.98
    attack: T1070.004,T1041
    all:
      - id: micro-behaviors/fs/delete/file/command::hidden-tmp-rm-command
    any:
      - id: objectives/exfiltration/stealer/credential/value/key::shell-private-key-loop-http-upload
      - id: objectives/exfiltration/stealer/configuration::shell-dotenv-loop-http-upload
    unless:
      - id: metadata/package/testing/
      - id: metadata/path::test-directory-component
