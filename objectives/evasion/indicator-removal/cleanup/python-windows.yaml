# Rewriting the download-zone stream to ZoneId=0 removes the external-origin
# marker from a file. Match the stream write together with its value.
defaults:
  for: [python]
  platforms: [windows]

traits:
  - id: python-zone-identifier-reset
    desc: Python resets Zone.Identifier to ZoneId=0
    crit: suspicious
    conf: 0.98
    attack: T1553.005
    if:
      type: text
      regex: '(?s)open\([^)]{0,80}:Zone\.Identifier.{0,30}["'']w["'']\).{0,70}\.write.{0,60}ZoneId=0'
