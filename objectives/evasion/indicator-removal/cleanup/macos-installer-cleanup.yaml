defaults:
  platforms: [macos]
  for: [pkg, shell]
  attack: T1070.004

composite_rules:
  - id: macos-installer-receipt-catalog-cleanup
    desc: macOS package hook queries and removes system receipt database
    crit: hostile
    conf: 0.98
    scope: archive
    all:
      - id: micro-behaviors/os/package-manager/management::macos-pkg-forget-receipts
      - id: micro-behaviors/fs/file/stat::shell-missing-file-exit-guard
      - id: micro-behaviors/fs/path/cache::source-hidden-user-cache-entry
    unless:
      - id: micro-behaviors/os/package-manager/management::macos-remover-script-path
