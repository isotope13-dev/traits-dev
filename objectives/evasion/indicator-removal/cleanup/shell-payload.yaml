defaults:
  platforms: [unix]
  for: [shell]
  attack: T1070.004
composite_rules:
- id: shell-download-exec-delete
  desc: Multi-arch raw-IP launch and nearby deletion
  crit: hostile
  conf: 0.95
  # Require raw-IP and architecture context near download, launch and deletion.
  near_bytes: 176
  all:
  - id: micro-behaviors/process/deploy::shell-download-chmod-exec
  - id: micro-behaviors/communications/ip/literal::external-ipv4-shell-literal
  - id: micro-behaviors/os/sysinfo/platform/arch::multi-arch-target
  any:
  - id: micro-behaviors/fs/delete/file/command::delete-rm-hardcoded
  - id: micro-behaviors/fs/delete/file/command::rm-local-named-file
  unless:
  - id: metadata/package/files/archive-member::openshift-release-ci-step-context
