defaults:
  for: [javascript, typescript]
  platforms: [unix, windows]
  crit: suspicious
  conf: 0.98
traits:
- id: node-hidden-stage-timer-cleanup
  desc: Timed cleanup of hidden staged file
  size_max: 4096
  if:
    type: tree-sitter
    query: |
      ((program) @program
        (#match? @program "function activate\\s*\\([^)]*\\)\\s*\\{[^{}]*downloadAndExecutePayload\\s*\\(")
        (#not-match? @program "function activate\\s*\\([^)]*\\)\\s*\\{[^{}]*=>[^{}]*downloadAndExecutePayload")
        (#not-match? @program "function activate\\s*\\([^)]*\\)\\s*\\{[\\s\\S]{0,120}\\breturn\\s*;[\\s\\S]{0,200}downloadAndExecutePayload")
        (#match? @program "module\\.exports\\s*=\\s*\\{[^}]*\\bactivate\\b")
        (#match? @program "https://")
        (#match? @program "path\\.join\\s*\\(")
        (#match? @program "await\\s+downloadFile\\s*\\(\\s*payloadUrl\\s*,\\s*payloadPath\\s*\\)")
        (#match? @program "windowsHide\\s*:\\s*true")
        (#match? @program "Start-Process[^\\n]*\\$\\{payloadPath\\}")
        (#match? @program "setTimeout\\s*\\(")
        (#match? @program "unlinkSync\\s*\\(\\s*payloadPath\\s*\\)")
        (#match? @program "createWriteStream\\s*\\(\\s*destPath")
        (#match? @program "\\(response\\)\\s*=>[\\s\\S]{0,120}response\\.pipe\\s*\\(\\s*file\\s*\\)"))
