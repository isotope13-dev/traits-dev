defaults:
  platforms: [unix]
  for: [shell]

composite_rules:
  - id: compiled-root-shell-source-removal
    desc: Setuid root-shell source and compiled source removal
    crit: hostile
    conf: 0.96
    near_bytes: 1024
    all:
      - id: micro-behaviors/fs/delete/file/command::shell-remove-compiled-source
      - id: objectives/privilege-escalation/elevation-control/setuid/shell::compiled-setuid-root-shell
