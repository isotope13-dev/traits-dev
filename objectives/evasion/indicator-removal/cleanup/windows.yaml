# Anti-Forensics Evidence Removal - Windows
# Detects techniques for removing traces of malicious activity on Windows
# ATT&CK: T1070 (Indicator Removal), T1562.001 (Impair Defenses)
# MBC: B0047 (Defense Evasion)
defaults:
  for: [powershell, batch, pe, lua]
  platforms: [windows]
  mbc: "B0047"
  attack: "T1562.001"
traits:
- id: motw-removal-before-zone
  desc: Removal verb precedes Zone.Identifier
  crit: notable
  conf: 0.9
  for: [pe, dll]
  if:
    type: text
    regex: '(?i)\b(delete|remove|erase)\b[^\r\n]{0,80}Zone\.Identifier'
- id: motw-removal-after-zone
  desc: Removal verb follows Zone.Identifier
  crit: notable
  conf: 0.9
  for: [pe, dll]
  if:
    type: text
    regex: '(?i)Zone\.Identifier[^\r\n]{0,80}\b(delete|remove|erase)\b'
- id: windows-recent-files-delete
  desc: Deletes Windows recent files
  crit: suspicious
  conf: 0.92
  if:
    type: literal
    substr: '%APPDATA%\\Microsoft\\Windows\\Recent'
- id: windows-prefetch-delete
  desc: Deletes Windows Prefetch files
  crit: suspicious
  conf: 0.92
  if:
    type: literal
    substr: '%WINDIR%\\Prefetch'
- id: windows-defender-log-disable
  desc: Disables Defender logging
  crit: suspicious
  conf: 0.92
  if:
    type: literal
    substr: DisableLogging
  unless:
    # `DisableLogging` is also an ordinary cloud API operation name -- AWS
    # carries it in the service model every SDK embeds, so the Lua, Go and JS
    # bindings all matched on their vendored copy of AWS's own JSON.
    - id: well-known/lib/cloud/aws-api-model::aws-service-model
- id: lua-wevtutil-clear
  desc: Lua wevtutil log clear
  crit: suspicious
  conf: 0.92
  for: [lua]
  attack: "T1070.001"
  if:
    type: literal
    substr: wevtutil cl
- id: prefetch-force-delete-command
  desc: Force deletes Windows Prefetch
  crit: suspicious
  conf: 0.96
  ref: sha256:8a710cccc278dc81e3fda6081c71cfac7bcfa0099821d7d0a7fab7f415cfd411
  attack: "T1070.004"
  if:
    type: text
    regex: '(?i)\bdel\s+/f\s+/q\s+(%WINDIR%|[A-Z]:\\Windows)\\Prefetch\\\*\.\*'
- id: temp-force-delete-command
  desc: Force deletes temp contents
  crit: suspicious
  conf: 0.92
  ref: sha256:8a710cccc278dc81e3fda6081c71cfac7bcfa0099821d7d0a7fab7f415cfd411
  attack: "T1070.004"
  if:
    type: text
    regex: '(?i)\bdel\s+/f\s+/q\s+%temp%\\\*\.\*'
composite_rules:
- id: windows-indicator-removal
  desc: Windows indicator and defense removal
  crit: suspicious
  conf: 0.9
  for: [powershell, batch, lua]
  any:
  - id: motw-removal-stream
  # `unblock-file` is no longer a standalone leg. A single `Unblock-File` call
  # is the documented PowerShell way to make a file the user just downloaded
  # runnable, which is what MiniMax's docx skill installer does; on its own it
  # is not indicator or defense removal. The atom still reports at `notable`,
  # and `motw-removal-stream` still covers deleting the Zone.Identifier stream
  # directly.
  #
  # `clear-eventlog` is likewise no longer a standalone leg. A single
  # `Clear-EventLog` call is the documented PowerShell way to reset event logs
  # during administrative tasks and automated test harnesses (such as Chocolatey's
  # coreteampackages test runner). On its own it is an OS capability atom reporting
  # at notable (micro-behaviors/os/event/log::clear-eventlog); correlated attacks
  # (such as recovery inhibition) match it through recovery-inhibition-with-log-clear.
  - id: lua-wevtutil-clear
  - id: temp-msi-cleanup
- id: windows-user-trace-cleanup
  for: [pe]
  desc: Cleans Windows user traces
  crit: suspicious
  conf: 0.97
  all:
  - id: windows-recent-files-delete
  - id: windows-prefetch-delete
  - id: objectives/evasion/indicator-removal/history::explorer-runmru-history-path
  any:
  - id: windows-defender-log-disable
- id: lua-log-and-trace-cleanup
  # explorer-runmru-history-path (objectives/evasion/indicator-removal/history)
  # is scoped to [pe] only and structurally cannot match Lua (ft-impossible)
  # -- a leftover from cloning windows-user-trace-cleanup's leg list. The
  # remaining four legs (wevtutil clear + recent-files delete + prefetch
  # delete + Defender logging disable) already all support lua and are
  # sufficient corroboration on their own.
  desc: Lua log and trace cleanup
  crit: hostile
  conf: 0.98
  for: [lua]
  all:
  - id: lua-wevtutil-clear
  - id: windows-recent-files-delete
  - id: windows-prefetch-delete
  - id: windows-defender-log-disable
- id: motw-removal-stream
  desc: Deletes Mark-of-the-Web alternate stream
  crit: suspicious
  conf: 0.95
  for: [powershell, batch]
  attack: T1553.005
  # Set-Content can CREATE the Internet-zone mark (ZoneId=3), including in
  # preservation tests. Its ordinary write capability is already covered by
  # fs/write/file/full::powershell-set-content-call. Require actual deletion
  # of the stream here rather than a write near its name.
  all:
  - id: micro-behaviors/fs/path/stream::zone-identifier-reference
  any:
  - id: objectives/evasion/indicator-removal/ads::remove-zone-identifier-stream
  - id: micro-behaviors/fs/delete/file/command::cmd-deletes-zone-identifier-stream
  unless:
  - id: metadata/file/extension/identity::markdown-file-basename
  - id: metadata/file/extension/identity::markdown-powershell-basename
# Same removal through the cmd `del` verb, the form script-host droppers
# (HTA/JScript/VBScript) use when they cannot or will not call PowerShell.
# The PE variant additionally requires a native deletion API.
- id: pe-motw-removal
  desc: PE deletes its Mark-of-the-Web Zone.Identifier stream
  crit: suspicious
  conf: 0.97
  for: [pe, dll]
  attack: "T1553.005"
  all:
  - id: micro-behaviors/fs/path/stream::zone-identifier-reference
  - id: micro-behaviors/fs/delete/file/library::deletefile-w
  any:
  - id: motw-removal-before-zone
  - id: motw-removal-after-zone
  unless:
  - id: metadata/file/string/application-name::official-7zip-component
  - id: well-known/app/communication/telegram::telegram-desktop-official-client
- id: temp-msi-cleanup
  for: [powershell]
  desc: Removes staged MSI after install
  crit: suspicious
  conf: 0.94
  attack: "T1070.004"
  all:
  - id: micro-behaviors/fs/delete/file/command::powershell-force-remove-variable-path
  - id: micro-behaviors/fs/path/temp::temp-msi-staging
  - id: micro-behaviors/process/deploy/file-exec::powershell-temp-msi-install
- id: windows-prefetch-temp-recon-cleanup
  desc: Windows prefetch temp cleanup with recon
  crit: hostile
  conf: 0.97
  ref: sha256:8a710cccc278dc81e3fda6081c71cfac7bcfa0099821d7d0a7fab7f415cfd411
  for: [pe, batch, powershell]
  all:
  - id: prefetch-force-delete-command
  - id: temp-force-delete-command
  - id: micro-behaviors/process/create/shell/command-mode::cmd-exe-c-command
  any:
  - id: micro-behaviors/network/dns::flushdns-quiet-command
  - id: micro-behaviors/process/enumerate/shell::ps-aux
  - id: micro-behaviors/process/enumerate/shell::ps-ef
  - id: micro-behaviors/process/enumerate/shell::tasklist
  - id: micro-behaviors/os/sysinfo/profile::windows-systeminfo-command
  - id: micro-behaviors/communications/url/host/oob-http::url-external-ip-port-binary
  needs: 2

# After unpacking a payload from a carrier file's appended data, the loader
# deletes the earlier-stage scripts (found by a marker string they carry)
# and the carrier. Removing its own delivery chain is not something a
# legitimate reader of appended file data needs.
- id: powershell-trailer-loader-erases-delivery-chain
  desc: Erases stage scripts after unpacking appended payload
  crit: hostile
  conf: 0.95
  for: [powershell]
  attack: T1070.004,T1027.003
  all:
  - id: micro-behaviors/fs/delete/file/command::powershell-delete-scripts-containing-marker
  - id: micro-behaviors/data/embedded/payload/trailer/
  - id: micro-behaviors/fs/write/file/full::write-all-bytes
