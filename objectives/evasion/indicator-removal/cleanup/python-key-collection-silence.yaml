defaults:
  for: [python]
  platforms: [windows, unix]
composite_rules:
  - id: python-silent-ssh-key-collection
    desc: Suppresses console output while collecting SSH key
    crit: suspicious
    conf: 0.95
    attack: T1564
    near_lines: 25
    all:
      - id: micro-behaviors/fs/read/file/private-key::python-ssh-private-key-read-accumulate
      - id: micro-behaviors/process/stdio/configure::python-both-streams-devnull
