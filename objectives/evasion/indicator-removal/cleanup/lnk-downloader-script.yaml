defaults:
  platforms: [windows]
  for: [lnk]
traits:
  - id: lnk-writes-temp-vbscript
    desc: Shortcut writes temporary VBScript
    crit: notable
    if:
      type: value
      path: lnk.arguments
      regex: '(?i)>\s*%TEMP%\\[^\s&"]{1,80}\.vbs'
  - id: lnk-runs-temp-vbscript
    desc: Shortcut runs temporary VBScript via cscript
    crit: notable
    if:
      type: value
      path: lnk.arguments
      regex: '(?i)\bcscript\s+//b\s+%TEMP%\\[^\s&"]{1,80}\.vbs'
composite_rules:
  - id: lnk-com-downloader-temp-script-cleanup
    desc: Shortcut runs and removes temporary scripts with COM download clues
    crit: hostile
    conf: 0.99
    all:
      - id: lnk-writes-temp-vbscript
      - id: lnk-runs-temp-vbscript
      - id: micro-behaviors/fs/delete/file/script::lnk-arg-delete-temp-script
      - id: micro-behaviors/communications/http/client/xmlhttp::lnk-arg-msxml-serverhttp
      - id: micro-behaviors/data/stream/write::lnk-arg-savetofile
