defaults:
  platforms: [linux]
  for: [elf]
  attack: T1070.004

traits:
  - id: agent-files-deleted-while-monitoring-message
    desc: Diagnostic reports live-agent file deletion
    crit: suspicious
    conf: 0.98
    if:
      type: text
      regex: '(?i)agent files (deleted|removed|unlinked),? (monitoring|checking) for liveness'

composite_rules:
  - id: dead-drop-agent-live-file-removal
    desc: C2 resolver accompanies live-agent file deletion and unlink syscall
    crit: hostile
    conf: 0.99
    all:
      - id: agent-files-deleted-while-monitoring-message
      - id: micro-behaviors/fs/delete/file/syscall::unlink-syscall
    any:
      - id: objectives/command-and-control/infrastructure/dead-drop::youtube-comment-agent-c2-resolver
      - id: objectives/command-and-control/infrastructure/dead-drop::drive-text-agent-c2-resolver
