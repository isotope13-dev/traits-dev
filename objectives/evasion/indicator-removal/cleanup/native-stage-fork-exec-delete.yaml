# A native stage loader writes a payload to disk, marks it executable, forks,
# and concurrently attempts to execute and delete that same stage pathname
# without waiting. The operations race, so execution is not guaranteed.
# Requiring call-graph and same-pathname binding via
# native-fork-exec-delete-same-path keeps ordinary runtime libraries (such as
# liblxc) and synchronous compiler/installer helpers out of reach.
defaults:
  platforms: [linux, macos]
  for: [elf, macho]
  attack: T1070.004,T1105

composite_rules:
  - id: native-stage-fork-exec-delete
    desc: Forked loader attempts staged execution and deletion
    crit: hostile
    conf: 0.97
    all:
      - id: micro-behaviors/fs/delete/path::native-fork-exec-delete-same-path
      - id: micro-behaviors/process/deploy/file-exec/stage::native-stage-file-write-capability
      - id: micro-behaviors/process/deploy/file-exec/stage::native-stage-chmod-capability
      - id: micro-behaviors/process/deploy/file-exec/stage::native-stage-concealment-or-delivery
