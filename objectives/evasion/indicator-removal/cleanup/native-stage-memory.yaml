defaults:
  platforms:
  - linux
  for:
  - c
  attack: T1070
traits:
- id: native-executed-mapping-zero-unmap
  desc: Called code mapping is zeroed and unmapped
  crit: suspicious
  conf: 0.98
  if:
    type: tree-sitter
    query: "\n(compound_statement\n (expression_statement (call_expression function: (parenthesized_expression\n\
      \   (cast_expression value: (identifier) @called))))\n (expression_statement (call_expression\
      \ function: (identifier) @protect\n   arguments: (argument_list (identifier) @writable (_)\
      \ (_))))\n (expression_statement (call_expression function: (identifier) @zero\n   arguments:\
      \ (argument_list (identifier) @erased (number_literal) @value (identifier) @length)))\n (expression_statement\
      \ (call_expression function: (identifier) @unmap\n   arguments: (argument_list (identifier)\
      \ @unmapped (identifier) @unmap_length))) @cleanup\n (#eq? @called @writable)\n (#eq? @called\
      \ @erased)\n (#eq? @called @unmapped)\n (#eq? @length @unmap_length)\n (#eq? @protect \"mprotect\"\
      )\n (#eq? @zero \"memset\")\n (#eq? @value \"0\")\n (#eq? @unmap \"munmap\"))\n"
