defaults:
  platforms: [windows]
  for: [pe, dll]
  attack: T1070.004
  # A staged-library dropper is a compact loader; multi-megabyte vendor clients
  # (licensing agents, installers) match these generic atoms by accident.
  size_max: 10485760

composite_rules:
  - id: native-staged-library-cleanup
    desc: Native DLL staging includes removal of the staged library
    crit: hostile
    conf: 0.99
    all:
      - id: micro-behaviors/fs/path/app-data::localappdata-marker
      - id: micro-behaviors/fs/path/extension::dll-dup
      - id: metadata/binary/section/entropy::large-high-entropy-writable-data-section
      - id: micro-behaviors/fs/file/open::file-create-win
      - id: micro-behaviors/fs/write/file/handle::write-file
      - id: micro-behaviors/dylib/load/runtime::load-library-a
      - id: micro-behaviors/fs/delete/file/library::deletefile-a
