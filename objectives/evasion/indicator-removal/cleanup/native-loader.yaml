defaults:
  platforms: [windows]
  for: [pe, dll]
  attack: T1070.004

composite_rules:
  - id: native-staged-library-cleanup
    desc: Native DLL staging includes removal of the staged library
    crit: hostile
    conf: 0.99
    all:
      - id: micro-behaviors/fs/path/location::localappdata-marker
      - id: micro-behaviors/fs/path/extension::dll-dup
      - id: metadata/binary/section/metrics::large-high-entropy-writable-data-section
      - id: micro-behaviors/fs/file/open::file-create-win
      - id: micro-behaviors/fs/file/write/direct::write-file
      - id: micro-behaviors/dylib/load/runtime::load-library-a
      - id: micro-behaviors/fs/file/delete::deletefile-a
