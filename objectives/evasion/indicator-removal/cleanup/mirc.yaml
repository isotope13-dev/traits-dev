# Silent registry merge with staged-file cleanup in mIRC scripts.
#
# A chat-client script has no legitimate need to merge a Windows registry
# file, let alone delete the staged .reg on a timer afterwards. The start
# handler leg ties the merge to automatic execution at client launch rather
# than an operator-invoked command.
defaults:
  platforms: [windows]
  for: [mirc]
  attack: T1112
composite_rules:
  - id: mirc-startup-reg-merge-with-cleanup
    desc: Silent mIRC registry merge with cleanup
    crit: hostile
    conf: 0.94
    all:
      - id: micro-behaviors/os/registry/write::mirc-reg-import-with-cleanup
      - id: micro-behaviors/communications/irc/handler::mirc-script-event-start
