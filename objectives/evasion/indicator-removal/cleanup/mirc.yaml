# Staged registry import with timer cleanup.
#
# `regedit /s` applies a .reg file with no prompt, and a `.timer` that fires
# once to `remove` that same file deletes the staging artifact seconds after
# the import. The registry ends up modified with no command line recording
# the change and no file left to inspect -- the batch echo-generate variant
# of this shape is already hostile, and a pre-staged file needs no echo step.
defaults:
  platforms: [windows]
  for: [mirc]
  attack: T1070.004,T1112
composite_rules:
  - id: mirc-staged-reg-import-cleanup
    desc: Silent registry import with staged file cleanup
    crit: hostile
    conf: 0.92
    near_lines: 8
    all:
      - id: micro-behaviors/os/registry/write/property::regedit-silent-import
      - id: micro-behaviors/fs/delete/file/deferred::mirc-timer-deferred-remove
