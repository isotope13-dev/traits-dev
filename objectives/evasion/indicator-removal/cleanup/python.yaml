# Python Evidence Removal
# Detects Python scripts that delete files, especially after exfiltration
# ATT&CK: T1070.004 (Indicator Removal on Host: File Deletion)
defaults:
  platforms: [linux, macos, windows, unix, android, ios]
composite_rules:
  - id: upload-cleanup
    desc: "Python script uploads data and deletes files (cleanup)"
    crit: suspicious
    conf: 0.9
    attack: "T1070.004"
    for: [python]
    near_lines: 25
    all:
      - id: micro-behaviors/communications/http/request/client::py-post-generic
    any:
      - id: micro-behaviors/fs/delete/directory::shutil-rmtree
      - id: micro-behaviors/fs/delete/file/library::py-remove
    unless:
      - id: metadata/package/testing/
      - id: micro-behaviors/fs/temp/mktemp::python-tempfile
      - id: well-known/lib/ai/ray::ray-package-context
      - id: well-known/lib/data/apache-beam::beam-package-context
      - id: well-known/app/infrastructure/ansible::ansible-module-source-context
      - id: well-known/lib/ai/supervisely::supervisely-package-context
