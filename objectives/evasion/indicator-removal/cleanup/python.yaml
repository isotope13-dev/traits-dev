# Python Evidence Removal
# Detects Python scripts that delete files, especially after exfiltration
# ATT&CK: T1070.004 (Indicator Removal on Host: File Deletion)
defaults:
  platforms: [linux, macos, windows, unix, android, ios]

composite_rules:
  # A tool that walks a tree rewriting sibling Python sources through a
  # regular expression is editing recorded behavior in place - cleanup or
  # codemod. The walk plus the rewrite-back is the claim; what is stripped
  # is not visible to the matcher, so this stays suspicious.
  - id: python-walk-rewrite-source-strip
    desc: Python walks and regex-rewrites Python sources in place
    crit: suspicious
    conf: 0.9
    attack: T1070.006
    all:
      - id: micro-behaviors/fs/directory/traverse::traverse-walk-call
      - id: micro-behaviors/data/string/replace::python-re-sub-file-rewrite
    unless:
      - id: metadata/package/testing/
