defaults:
  platforms: [windows]
  for: [vbs]
  attack: T1070.004,T1059.005,T1105
  mbc: B0006

composite_rules:
  # Plain-text ADODB.Stream temp helpers (for example UTF-8 clipboard or CLI
  # input files) also call SaveToFile, synchronous hidden Run, and DeleteFile.
  # Require evidence that the dropped stage comes from an encrypted, XOR/Base64
  # decoded, byte-array assembled, obfuscated, or HTTP-downloaded payload.
  - id: vbs-staged-payload-hidden-run-cleanup
    desc: VBScript executes dropped stage hidden and removes payload file
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/fs/write/stream::adodb-save-to-file-observed
      - id: micro-behaviors/process/create/hidden::wsh-run-hidden-wait-statement
      - id: micro-behaviors/fs/delete/file/library::wsh-deletefile-call
    any:
      - id: micro-behaviors/crypto/symmetric/stream/rc4/cipher::vbs-rc4-stream-cipher
      - id: objectives/execution/payload/file-exec/command/script-host-download::wsh-vbs-xor-modulo-key
      - id: micro-behaviors/data/bitwise/xor-forms/scalar::vbs-numeric-code-xor
      - id: micro-behaviors/data/encode/char-code::array-payload-reconstruction
      - id: micro-behaviors/fs/write/stream::stream-write-response-body-observed
      - id: micro-behaviors/fs/write/stream::vbs-split-savetofile-observed
      - id: micro-behaviors/data/decode/base64/unspecified::powershell-frombase64string
      - id: micro-behaviors/data/decode/base64/unspecified::vbs-msxml-base64-to-bytes
