defaults:
  platforms: [windows]
  for: [batch]
  attack: T1070.004
  mbc: F0007
composite_rules:
  - id: photoviewer-cache-loader-temp-script-cleanup
    desc: PhotoViewer cache execution beside temporary BAT deletion
    crit: hostile
    conf: 0.98
    all:
      - id: objectives/execution/lolbin/rundll32::photoviewer-inetcache-conhost-execution
      - id: micro-behaviors/fs/delete/file/command::batch-temp-script-delete-command
