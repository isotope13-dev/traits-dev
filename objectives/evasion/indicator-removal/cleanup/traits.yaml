defaults:
  platforms:
  - unix
  - windows
  crit: notable
  attack: T1070.004
  mbc: F0005
  for:
  - python
  - shell
traits:
- id: marker-done-indicator--rx-1
  desc: "Matches 'status'"
  crit: notable
  conf: 0.75
  if:
    type: string_literal
    exclude_docstrings: true
    regex: (marker|tracker)[a-zA-Z0-9_.-]{0,20}(-done|\.done|_done)["']
- id: marker-done-indicator--rx-2
  desc: 'Matches ''status)(-done (state'''
  crit: notable
  conf: 0.75
  if:
    type: string_literal
    exclude_docstrings: true
    regex: (state|status)[a-zA-Z0-9_.-]{0,20}(-done|\.done|_done)["']
- id: marker-done-indicator-cond-0--inline-20274
  desc: 'Matches '')m4'''
  crit: notable
  conf: 0.75
  if:
    type: path
    regex: (^|[\\/])[^\\/]{0,120}\.m4$
- id: marker-done-indicator-cond-1--inline-20275
  desc: "Matches 'querySelector('#b.done')'"
  crit: component
  conf: 0.75
  if:
    type: text
    regex: \$[A-Za-z0-9_]{1,40}_done["']
- id: marker-done-indicator-cond-2--inline-20276
  desc: 'Matches "querySelector(''#b.done'')"'
  crit: notable
  conf: 0.75
  if:
    type: text
    substr: querySelector('#b.done')
composite_rules:
- id: marker-done-indicator
  desc: Marker file done indicator
  crit: suspicious
  conf: 0.75
  any:
  - id: marker-done-indicator--rx-1
  - id: marker-done-indicator--rx-2
  unless:
  - id: marker-done-indicator-cond-0--inline-20274
  - id: marker-done-indicator-cond-1--inline-20275
  - id: marker-done-indicator-cond-2--inline-20276
  # Agent-skill test suites keep done-marker bookkeeping in their fixtures
  # (an orchestration skill's GUI-recovery test sets MODEL_MARKER_DONE to a
  # tmp marker path); the indicator-cleanup reading belongs to runtime code,
  # not test-directory files.
  - id: metadata/file/naming::test-directory-component
