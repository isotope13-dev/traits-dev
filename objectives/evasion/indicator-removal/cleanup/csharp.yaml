# .NET cleanup after a trust-store modification.
# ATT&CK: T1070.004 (Indicator Removal: File Deletion)
defaults:
  platforms: [windows]
  for: [csharp]
  attack: T1070.004
  mbc: B0047

composite_rules:
  - id: dotnet-root-ca-staging-file-cleanup
    desc: .NET removes a staged certificate after root-store installation
    crit: hostile
    conf: 0.93
    # The delete leg must be the certificate-named one: with the generic
    # `File.Delete(x)` atom any unrelated deletion elsewhere in the same source
    # file satisfied a description that asserts the *certificate* was removed.
    all:
      - id: micro-behaviors/crypto/certificate/install::dotnet-machine-root-store-add
      - id: micro-behaviors/data/embedded/payload/resource::dotnet-source-manifest-resource-stream-call
      - id: micro-behaviors/fs/file/delete::dotnet-certificate-file-delete-call
