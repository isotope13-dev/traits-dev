# A command line that deletes the script it just ran out of the temp directory.
#
# `del /Q "%TEMP%\box.bat"` chained after the batch file executes is not
# housekeeping — the file is in the temp directory, which the OS clears anyway.
# It is there so that whoever looks afterwards finds nothing: no dropped
# artifact to hash, to submit, or to recover the second stage from. What ran is
# reconstructible only from whatever the server was serving at that moment.
#
# The `/Q` matters as much as the delete. It suppresses the confirmation prompt,
# which is what makes the whole chain runnable unattended from one command
# string; an interactive delete would stall waiting for a keypress nobody is
# there to give.
defaults:
  platforms: [windows]
  for: [scripts, source, batch]
  attack: T1070.004
  mbc: F0007

traits:
  - id: quiet-delete-temp-script
    desc: Quietly deletes a script from temp
    crit: suspicious
    conf: 0.9
    if:
      type: text
      regex: '(?i)\bdel\s+/[qQfF]{1,2}\s+"?%(TEMP|TMP)%[^"\n]{0,60}\.(bat|cmd|ps1|vbs|js)'

composite_rules:
  - id: encrypted-powershell-transient-script-cleanup
    desc: Encrypted PowerShell loader removes its transient script
    crit: hostile
    conf: 0.99
    attack: T1070.004,T1059.001
    all:
      - id: objectives/command-and-control/dropper/staging/encrypted::ps-aes-iex-stage-loader
      - id: micro-behaviors/process/create/exec::powershell-call-script
      - id: micro-behaviors/fs/file/delete::powershell-remove-item-force
      - id: micro-behaviors/fs/path/temp::win-temp-path
