defaults:
  platforms: [windows]
  for: [scripts, source, batch]
  attack: T1070.004
  mbc: F0007

traits:
composite_rules:
  - id: encrypted-powershell-transient-script-cleanup
    for: [powershell]
    desc: Encrypted PowerShell loader removes its transient script
    crit: hostile
    conf: 0.99
    attack: T1070.004,T1059.001
    all:
      - id: objectives/command-and-control/dropper/script-eval/embedded::ps-aes-iex-stage-loader
      - id: micro-behaviors/process/create/exec::powershell-call-script
      - id: micro-behaviors/fs/delete/file/command::powershell-remove-item-force
      - id: micro-behaviors/fs/path/temp::win-temp-path
