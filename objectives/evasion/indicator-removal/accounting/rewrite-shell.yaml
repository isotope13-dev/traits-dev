# Selective reconstruction of live Unix login records. Legitimate reporting
# reads these logs; this pattern rebuilds multiple accounting databases through
# a filter and then replaces the live files with the staged copies.
defaults:
  platforms: [unix]
  for: [shell]
  attack: T1070.002
  mbc: F0005

traits:
  - id: utmpdump-filtered-wtmp-rebuild
    desc: Rebuilds wtmp login history through sed
    crit: suspicious
    conf: 0.98
    if:
      type: text
      regex: 'utmpdump\s+/var/log/wtmp\s*\|\s*sed\b.{0,64}\|\s*utmpdump\s+-r\s*>'

  - id: utmpdump-filtered-btmp-rebuild
    desc: Rebuilds btmp failed logins through sed
    crit: suspicious
    conf: 0.98
    if:
      type: text
      regex: 'utmpdump\s+/var/log/btmp\s*\|\s*sed\b.{0,64}\|\s*utmpdump\s+-r\s*>'

  - id: hidden-temp-wtmp-overwrite
    desc: Overwrites wtmp from hidden temp file
    crit: suspicious
    conf: 0.98
    if:
      type: text
      regex: '\bmv\s+/tmp/\.\S{1,64}\s+/var/log/wtmp\b'

  - id: hidden-temp-btmp-overwrite
    desc: Overwrites btmp from hidden temp file
    crit: suspicious
    conf: 0.98
    if:
      type: text
      regex: '\bmv\s+/tmp/\.\S{1,64}\s+/var/log/btmp\b'

composite_rules:
  - id: live-login-accounting-rewrite
    desc: Rewrites multiple live login accounting logs
    crit: hostile
    conf: 0.995
    all:
      - id: utmpdump-filtered-wtmp-rebuild
      - id: utmpdump-filtered-btmp-rebuild
      - id: hidden-temp-wtmp-overwrite
      - id: hidden-temp-btmp-overwrite
    near_lines: 4
