defaults:
  platforms: [unix]
  for: [swift]
  attack: T1070

traits:
  - id: swift-login-accounting-zero-write
    desc: Writes empty content to login accounting records
    crit: suspicious
    conf: 0.97
    if:
      # The call node excludes documentation and commented-out examples.
      type: tree-sitter
      node: call_expression
      regex: '""\.write\(to:\s*URL\(fileURLWithPath:\s*"/var/adm/(wtmp|lastlog)"'
