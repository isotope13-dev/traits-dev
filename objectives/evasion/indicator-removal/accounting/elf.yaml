defaults:
  platforms: [linux]
  for: [elf]
  attack: T1070.002

traits:
  - id: temporary-accounting-rewrite-file
    desc: Uses temporary accounting rewrite files
    crit: suspicious
    conf: 0.95
    if:
      type: text
      regex: '^/tmp/(WTMP|UTMP)\.TMP$'
  - id: accounting-log-replace-command
    desc: Replaces accounting logs via shell
    crit: suspicious
    conf: 0.97
    if:
      type: text
      regex: 'mv\s+/tmp/(WTMP|UTMP)\.TMP.{0,160}chmod\s+644'
  - id: removed-accounting-record-output
    desc: Reports removed accounting records
    crit: suspicious
    conf: 0.94
    if:
      type: text
      section: rodata
      # Require login-accounting paths or log names; bare printf `%s` must not
      # match Kafka partition-list or other unrelated removal messages.
      regex: 'Removed.{0,80}(entry|entries).{0,100}(wtmp|utmp|WTMP|UTMP|lastlog|wtmpx|utmpx)'
  - id: login-record-modification-before-marker
    desc: Modification verb before login record
    crit: suspicious
    conf: 0.92
    if:
      type: text
      section: rodata
      regex: '(?i)\b(modified|changed|edited)\b.{0,32}\b(login|lastlog)\b.{0,32}\brecord\w*\b'
  - id: login-record-modification-after-marker
    desc: Modification verb after login record
    crit: suspicious
    conf: 0.92
    if:
      type: text
      section: rodata
      regex: '(?i)\b(login|lastlog)\b.{0,32}\b(modified|changed|edited)\b.{0,32}\brecord\w*\b'
  - id: fresh-log-wiper-banner
    desc: Names a binary login-log wiper
    crit: suspicious
    conf: 0.98
    if:
      type: text
      regex: '(?i)Binary Log-wiper'
  - id: utmp-removed-record
    desc: Reports a record removed from UTMP
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: '(?i)removed.{0,32}from UTMP'
  - id: wtmp-tmp-replace
    desc: Replaces wtmp via a wtmp.tmp copy
    crit: notable
    conf: 0.94
    if:
      type: text
      substr: wtmp.tmp

composite_rules:
  - id: elf-login-accounting-rewrite
    desc: Rewrites Unix login accounting records
    crit: hostile
    conf: 0.99
    all:
      - id: micro-behaviors/fs/path/log/accounting::login-accounting-files-binary
    needs: 2
    any:
      - id: temporary-accounting-rewrite-file
      - id: accounting-log-replace-command
      - id: removed-accounting-record-output
  - id: elf-lastlog-record-edit
    desc: Edits Unix lastlog login records
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/fs/path/log/accounting::lastlog-path-binary
    any:
      - id: login-record-modification-before-marker
      - id: login-record-modification-after-marker
  - id: fresh-utmp-log-wiper
    desc: Binary log-wiper removes UTMP records
    crit: hostile
    conf: 0.98
    all:
      - id: fresh-log-wiper-banner
      - id: utmp-removed-record
  - id: fresh-wtmp-tmp-wiper
    desc: Binary log-wiper replaces wtmp.tmp
    crit: hostile
    conf: 0.97
    all:
      - id: fresh-log-wiper-banner
      - id: wtmp-tmp-replace
  - id: utmp-wtmp-tmp-wiper
    desc: UTMP removal with wtmp.tmp replace
    crit: hostile
    conf: 0.96
    all:
      - id: utmp-removed-record
      - id: wtmp-tmp-replace
