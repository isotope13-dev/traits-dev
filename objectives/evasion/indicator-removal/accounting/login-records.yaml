# Destroying the login accounting files themselves. The sibling `elf.yaml`
# here recognizes compiled log-wiper utilities by their own status strings;
# this covers the same act performed inline by a script, which is how an
# operator with a shell does it.
defaults:
  platforms: [unix]
  for: [scripts]
  attack: T1070.004
  mbc: F0005

traits:
  - id: login-record-file-deletion
    desc: Deletes Unix login-accounting records
    crit: suspicious
    conf: 0.95
    if:
      # utmp/wtmp, btmp, and lastlog hold successful, failed, and last-login
      # records. Clearing them removes login history, though authorized reset
      # and recovery routines can deliberately clear it.
      type: text
      regex: '(?im)\brm\b[^\n]{0,60}/var/(run|log)/([uw]tmpx?|btmp|lastlog)\b'
    unless:
      - id: metadata/build/package/maintainer-scripts::cloud-marketplace-cleanup-script
      - id: objectives/impact/wipe/config::sonic-factory-reset-cleanup-context
      # A Dockerfile RUN that purges logs only reshapes the image layer being
      # built: there are no live login records to hide at build time, so
      # wiping wtmp/btmp there is layer hygiene, not track-covering.
      - id: metadata/build/docker::dockerfile-basename
      # System initialization scripts recreate /var/run/utmp at boot with correct permissions.
      - type: text
        regex: '(?m)\b(chgrp\s+utmp|chmod\s+0?[46][46][46])\s+/var/(run|log)/[uw]tmp'
      # SysV / BSD init boot scripts initialize runtime state at boot.
      - type: path
        regex: '(^|[\\/])rc\.(sysinit|local|boot)\b'

  - id: login-record-file-truncation
    desc: Truncates login accounting files via redirect
    crit: suspicious
    conf: 0.9
    if:
      # Redirect truncation of utmp, wtmp, btmp, or lastlog removes the
      # recorded history while leaving the file in place.
      # Rotation normally uses logrotate, while explicit reset routines may
      # deliberately truncate the records. The `>` is excluded from the token
      # prefix and the echo filler so an append (`>>`) cannot match.
      type: text
      regex: '(?im)(^|[;&|\s])(echo\b[^>\n]{0,20}\s+)?>\s*/var/(run|log)/([uw]tmpx?|btmp|lastlog)\b'
    unless:
      - id: metadata/build/package/maintainer-scripts::cloud-marketplace-cleanup-script
      - id: metadata/build/docker::dockerfile-basename
      - id: objectives/impact/wipe/config::sonic-factory-reset-cleanup-context
      # System initialization scripts recreate /var/run/utmp at boot with correct permissions.
      - type: text
        regex: '(?m)\b(chgrp\s+utmp|chmod\s+0?[46][46][46])\s+/var/(run|log)/[uw]tmp'
      # SysV / BSD init boot scripts initialize runtime state at boot.
      - type: path
        regex: '(^|[\\/])rc\.(sysinit|local|boot)\b'

composite_rules:
  - id: utmpdump-login-record-rewrite
    desc: Rewrites live login accounting records
    crit: hostile
    conf: 0.995
    for: [shell, python, javascript]
    attack: T1070.002
    near_lines: 4
    all:
      - id: micro-behaviors/fs/path/log/accounting::utmpdump-live-database-export
      - id: micro-behaviors/fs/path/log/accounting::utmpdump-record-rebuild
      - id: micro-behaviors/fs/path/log/accounting::login-database-replacement-move
      - id: micro-behaviors/process/create/unix-utils::sed-processing

  # Two different subsystems, cleaned in the same script. Deleting the login
  # accounting files answers "who was here"; walking /var/log through `sed`
  # answers "what did they do". Each is already suspicious alone, and each has
  # a thin legitimate story -- a disk-space panic, a privacy scrub. Neither
  # story covers doing both, and doing both is what an operator does on the
  # way out. The legs live in sibling directories (`accounting/` and `logs/`)
  # because they are genuinely different observations; this is the rule that
  # says they arrived together.
  - id: login-record-and-system-log-erasure
    desc: Erases login records and rewrites logs
    crit: hostile
    conf: 0.96
    attack: T1070.001,T1070.002
    all:
      - id: login-record-file-deletion
      - id: objectives/evasion/indicator-removal/logs::sed-inplace-log-line-delete

  # Loop-variable variant of the truncation above: `for log in ...wtmp...;`
  # then `echo > "$log"`. The variable indirection defeats literal-path
  # matching, so the two halves are bound by proximity instead -- the path
  # list names the accounting files, the redirect erases through the
  # variable. Rotation never names these files in a script at all.
  - id: login-record-loop-variable-truncation
    desc: Loop truncates login records through a variable path
    crit: suspicious
    conf: 0.9
    near_lines: 3
    all:
      - id: micro-behaviors/fs/path/log/accounting::multiple-log-files
      - id: micro-behaviors/fs/write/file/redirect::shell-truncating-redirect-variable-target
    unless:
      - id: metadata/build/package/maintainer-scripts::cloud-marketplace-cleanup-script
      - id: metadata/build/docker::dockerfile-basename

