# Destroying the login accounting files themselves. The sibling `elf.yaml`
# here recognizes compiled log-wiper utilities by their own status strings;
# this covers the same act performed inline by a script, which is how an
# operator with a shell does it.
defaults:
  platforms: [unix]
  for: [scripts]
  attack: T1070.004
  mbc: F0005

traits:
  - id: login-record-file-deletion
    desc: Deletes utmp or wtmp login records
    crit: suspicious
    conf: 0.95
    if:
      # `rm /var/run/utmp /var/run/utmpx /var/log/wtmp ...` -- these files are
      # the record of who logged in and when. Rotation truncates them;
      # administration never deletes them.
      type: text
      regex: '(?im)\brm\b[^\n]{0,60}/var/(run|log)/[uw]tmpx?\b'
    unless:
      - id: metadata/build/package/maintainer-scripts::cloud-marketplace-cleanup-script

composite_rules:
  - id: utmpdump-login-record-rewrite
    desc: Rewrites live login accounting records
    crit: hostile
    conf: 0.995
    for: [scripts, source]
    attack: T1070.002
    near_lines: 4
    all:
      - id: micro-behaviors/fs/path/log/accounting::utmpdump-live-database-export
      - id: micro-behaviors/fs/path/log/accounting::utmpdump-record-rebuild
      - id: micro-behaviors/fs/path/log/accounting::login-database-replacement-move
      - id: micro-behaviors/process/create/unix-utils::sed-processing
