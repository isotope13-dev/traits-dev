# Selective deletion keeps the log present while removing evidence tied to
# privileged authentication. The expression alone is only suspicious; pairing
# it with an in-place deletion against /var/log establishes the objective.
defaults:
  platforms: [unix]
  for: [scripts]
  attack: T1070.002
  mbc: F0005

traits:
  - id: privileged-auth-delete-expression
    desc: Deletes privileged authentication entries
    crit: suspicious
    conf: 0.98
    if:
      type: literal
      kind: string
      regex: '^/(sudo|su:|sshd)[^/]{0,48}/d$'

composite_rules:
  - id: privileged-auth-log-selective-removal
    desc: Selectively removes privileged auth logs
    crit: hostile
    conf: 0.995
    all:
      - id: privileged-auth-delete-expression
      - id: objectives/evasion/indicator-removal/logs::sed-inplace-log-line-delete
