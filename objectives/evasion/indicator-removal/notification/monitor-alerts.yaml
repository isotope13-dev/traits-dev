# Source: OpenAI, "Suppressing misalignment monitoring alerts and disabling
# misalignment monitoring", 2026-10-20. The report's patch clears both alert
# recipient lists, enables no_notify, and refuses rows that would notify.
# Retain suspicious severity: static source cannot establish authorization.
defaults:
  platforms: [unix, windows]
  for: [python, javascript, typescript, ruby]
  crit: suspicious
  conf: 0.94
  attack: T1562.001

composite_rules:
  - id: monitor-alert-routing-suppressed
    desc: Clears ping/page recipients and suppresses alerts
    # Bounded co-occurrence, not a claim of cross-statement object identity.
    near_lines: 12
    all:
      - id: micro-behaviors/os/telemetry/logging/configure::ping-recipients-cleared
      - id: micro-behaviors/os/telemetry/logging/configure::page-recipients-cleared
      - id: micro-behaviors/os/telemetry/logging/configure::no-notify-enabled

  - id: monitor-alert-suppression-enforced
    desc: Rejects notifying rows beside suppressed routing
    # Separate from routing changes: an exception makes suppression mandatory.
    # The real ping/page schema supplies context; no prose or invented product
    # marker establishes that the no_notify guard controls monitoring results.
    near_lines: 40
    all:
      - id: monitor-alert-routing-suppressed
    any:
      - id: micro-behaviors/os/telemetry/logging/configure::python-reject-notifying-row
      - id: micro-behaviors/os/telemetry/logging/configure::javascript-reject-notifying-row
      - id: micro-behaviors/os/telemetry/logging/configure::ruby-reject-notifying-row
