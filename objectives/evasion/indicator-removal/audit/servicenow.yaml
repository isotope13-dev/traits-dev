# ServiceNow audit-table purging via Glide script.
#
# A compromised tenant is cleaned up by deleting the rows that tie an
# attacker-controlled user to its activity: sys_user_login_history (all
# logon events with IP and user agent), sys_user_role_history (who granted
# which role), and syslog_transaction (UI interactions). There is no
# legitimate workflow that bulk-deletes a user's own audit history
# (MDSec, "When it Snows it Pours", 2026).
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript, json, text, data]
  attack: T1070

traits:
  - id: servicenow-login-history-query
    desc: Queries ServiceNow login history table
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: 'GlideRecord\s*\(\s*.{0,3}sys_user_login_history'

  - id: servicenow-role-history-query
    desc: Queries ServiceNow role history table
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: 'GlideRecord\s*\(\s*.{0,3}sys_user_role_history'

  - id: servicenow-transaction-log-query
    desc: Queries ServiceNow transaction log table
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: 'GlideRecord\s*\(\s*.{0,3}syslog_transaction'

  - id: servicenow-record-delete-loop
    desc: Deletes ServiceNow records in query loop
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: 'while\s*\([^)]{0,80}?\.next\s*\(\)\s*\)[\s\S]{0,200}\.deleteRecord\s*\('

composite_rules:
  - id: servicenow-login-history-purge
    desc: Purges ServiceNow user login history
    crit: suspicious
    conf: 0.94
    attack: T1070.002
    all:
      - id: servicenow-login-history-query
      - id: servicenow-record-delete-loop
    near_bytes: 600

  - id: servicenow-multi-audit-table-purge
    desc: Sweeps multiple ServiceNow audit tables
    crit: suspicious
    conf: 0.95
    all:
      - id: servicenow-record-delete-loop
    any:
      - id: servicenow-login-history-query
      - id: servicenow-role-history-query
      - id: servicenow-transaction-log-query
    needs: 2
    near_bytes: 1500
