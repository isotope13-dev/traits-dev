# Selective removal of privilege-use evidence from Unix authentication logs.
defaults:
  platforms: [unix]
  for: [shell, python, javascript, go, ruby, perl, c]
  attack: T1070.002
  mbc: F0005

traits:
  - id: repeated-sudo-delete-expression
    desc: Repeated sed expression selecting sudo lines
    crit: component
    conf: 0.99
    count_min: 2
    if:
      type: string_literal
      exact: /sudo/d

composite_rules:
  - id: sudo-audit-line-removal
    desc: Selectively deletes sudo authentication records
    crit: hostile
    conf: 0.995
    all:
      - id: objectives/evasion/indicator-removal/logs::sed-inplace-log-line-delete
      - id: repeated-sudo-delete-expression
      - id: micro-behaviors/fs/path/log/system::log-var
    near_lines: 2
