defaults:
  platforms: [unix, windows]
  for: [json]

traits:
  - id: aws-cloudtrail-audit-control
    desc: AWS CloudTrail audit-control event
    crit: notable
    conf: 0.95
    if:
      id: micro-behaviors/communications/http/services/aws::aws-cloudtrail-logging-operation

  # Bedrock invocation logging is a separate audit surface from CloudTrail
  # (off by default; it captures request-level model invocation detail that
  # CloudTrail redacts). Deleting it removes the only record of what was
  # prompted — the LLMjacking defense-evasion step. Scoped to the log-event
  # form; source/script artifacts get the corroboration composites under
  # objectives/impact/cryptojacking/remote-compute/ instead.
  - id: aws-bedrock-invocation-log-disable
    desc: Bedrock invocation logging deleted
    crit: suspicious
    conf: 0.9
    if:
      id: micro-behaviors/communications/http/services/aws::bedrock-invocation-logging-delete-event

composite_rules:

  - id: aws-telemetry-control-a
    desc: AWS Flow Logs or GuardDuty control event
    crit: notable
    conf: 0.95
    any:
      - id: micro-behaviors/communications/http/services/aws::aws-flow-logs-operation
      - id: micro-behaviors/communications/http/services/aws::aws-guardduty-detector-operation

  - id: aws-telemetry-control-b
    desc: AWS GuardDuty control event
    crit: notable
    conf: 0.95
    any:
      - id: micro-behaviors/communications/http/services/aws::aws-guardduty-detector-operation
      - id: micro-behaviors/communications/http/services/aws::aws-guardduty-ip-set-operation

  - id: aws-telemetry-audit-control
    desc: AWS cloud telemetry audit-control event
    crit: notable
    conf: 0.95
    any:
      - id: aws-telemetry-control-a
      - id: aws-telemetry-control-b

  - id: aws-multi-service-audit-disablement
    desc: AWS audit coverage disabled across services
    crit: hostile
    conf: 0.98
    all:
      - id: aws-cloudtrail-audit-control
      - id: aws-telemetry-audit-control

  # Cross-surface tampering: silencing both the account-level (CloudTrail)
  # and request-level (Bedrock invocation) audit trails at once.
  - id: aws-cloudtrail-and-bedrock-audit-disable
    desc: CloudTrail and Bedrock audit logging disabled
    crit: hostile
    conf: 0.96
    all:
      - id: micro-behaviors/communications/http/services/aws::aws-cloudtrail-logging-operation
      - id: micro-behaviors/communications/http/services/aws::bedrock-invocation-logging-delete-operation
