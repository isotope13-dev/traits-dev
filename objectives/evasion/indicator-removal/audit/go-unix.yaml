defaults:
  platforms: [unix, appliance]
  for: [go, elf]
  attack: T1070.002

traits:
  # `go-auditctl-disable` and `go-audit-rules-delete` moved to auditctl.yaml in
  # this directory as `auditctl-subsystem-disable` / `auditctl-rules-delete`:
  # both matched a bare command string, so the `for: [go, elf]` gate here hid
  # the technique in shell maintainer scripts. See that file for the rationale.
  # The composite below still references them; its own for: is unchanged.
  - id: go-audit-log-path
    desc: Go audit log path
    crit: component
    conf: 0.9
    if:
      type: text
      substr: /var/log/audit

  - id: go-audit-truncate-clear
    desc: Go audit log truncate clear
    crit: component
    conf: 0.9
    if:
      type: text
      regex: 'truncate\s+-s\s*0\s+'

  - id: go-audit-redirect-clear
    desc: Go audit log redirect clear
    crit: component
    conf: 0.88
    if:
      type: text
      regex: '(cat\s+/dev/null\s*>|:\s*>|>)\s*/var/log/'

  - id: go-audit-echo-clear
    desc: Go audit log echo clear
    crit: component
    conf: 0.88
    if:
      type: text
      regex: 'echo\s*(-n)?\s*("")?\s*>'

composite_rules:
  - id: go-audit-log-clear
    desc: Go audit log clear
    crit: suspicious
    conf: 0.92
    # The clear operation must target the audit log: require it adjacent to the
    # /var/log/audit reference. Without proximity this fired on the audit tools
    # themselves (auditd, aureport, ausearch), which reference /var/log/audit and
    # also contain unrelated redirect/`>` characters elsewhere in the binary.
    near_bytes: 80
    all:
      - id: go-audit-log-path
    any:
      - id: micro-behaviors/fs/shell-ops::rm-force-command-fragment
      - id: micro-behaviors/fs/shell-ops::shred-command-fragment
      - id: go-audit-truncate-clear
      - id: go-audit-redirect-clear
      - id: go-audit-echo-clear

  - id: go-audit-logging-tamper
    desc: Go audit logging tamper
    crit: hostile
    conf: 0.98
    all:
      - id: auditctl-subsystem-disable
    any:
      - id: go-audit-log-clear
      - id: auditctl-rules-delete
