defaults:
  platforms: [linux]
  for: [c, cpp]
  crit: suspicious
  conf: 0.96
  attack: T1562.012

traits:
  - id: kernel-audit-disable-pointer-write
    desc: Clears kernel audit_enabled through a pointer
    if:
      type: tree-sitter
      kind: assignment
      regex: '^\*\s*audit_enabled\s*=\s*(0[xX]0+|0)[uUlL]*$'
