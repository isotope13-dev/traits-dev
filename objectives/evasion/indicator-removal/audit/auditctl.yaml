# The two `auditctl` invocations that neutralise the Linux audit subsystem,
# matched as command text with no language gate.
#
# Both were previously defined in go-unix.yaml as `go-audit-rules-delete` /
# `go-auditctl-disable` under `for: [go, elf]`. The matchers are exact command
# spellings and check nothing about the language, so that gate made the whole
# technique invisible where it is most often written: a maintainer script
# (postinst/preinst) in a trojanised .deb, a post-exploitation shell script, or
# a CI step. A `.postinst` that ran `auditctl -D`, removed
# /etc/audit/rules.d/*.rules and stopped auditd scored nothing at all.
#
# Discriminator against admin tooling: hardening scripts LOAD rules
# (`auditctl -R <file>`) and query state (`auditctl -s`); only tampering
# deletes every rule or turns the subsystem off. The audit package's own
# rules loader, /usr/bin/augenrules, uses -R and -s -- neither spelling below
# appears in any script shipped under /usr/bin, /usr/share or /etc on a system
# with the audit package installed.
defaults:
  platforms: [unix, appliance]
  # Hand-picked rather than a group: the string is a command line, so the types
  # that matter are the ones that drive commands -- shell (maintainer scripts,
  # post-exploitation), the scripting languages that shell out, Go source, and
  # ELF for the compiled case. `go` + `elf` keep the coverage the Go composite
  # in go-unix.yaml relies on. Groups would expand past the type:text cap of 19.
  for: [shell, python, perl, ruby, go, elf]
  attack: T1070.002

traits:
  - id: auditctl-rules-delete
    desc: auditctl deletes all audit rules
    crit: suspicious
    conf: 0.92
    if:
      type: text
      regex: 'auditctl["'',\s]{1,6}-D\b'

  # Widened from `substr: auditctl -e 0` to absorb argv punctuation, so the one
  # canonical matcher covers both the shell spelling and the list spelling a
  # scripting language actually emits: `subprocess.run(["auditctl","-e","0"])`,
  # `exec.Command("auditctl","-e","0")`. That gap is why a *second*, Python-only
  # copy existed as `logs/python-linux::python-auditctl-disable`
  # (`substr: '"auditctl", "-e", "0"'` — that exact quoting, nothing else); it
  # has been deleted and its hostile composite now references this atom, per the
  # Single-Trait Rule.
  #
  # Requiring the literal 0 right after the separator is what preserves the
  # original discrimination: `-e 1` re-enables and `-e 2` LOCKS the config until
  # reboot (a hardening step), and neither can reach this pattern.
  #
  # No `\b` after the 0, deliberately. A trailing word-boundary reads as tighter
  # but silently drops the compiled case: Go packs its string table as one
  # contiguous blob, so the extracted run is `…prevstringauditctl -e 0nextstring…`
  # and `\b` fails against the following letter. Measured: with `0\b` a binary
  # carrying the command mid-run stopped matching. `for:` includes go and elf, so
  # that is the case this atom most needs to keep.
  #
  # DELIBERATELY NOT line-anchored, unlike the comment-leader guard on
  # `process/enumerate/shell::ps-ef`. Wrapping this in `(?m)^[^\n]{0,200}…` plus
  # `not: ^\s*(\*|//|#)` does remove the "a comment merely names the command"
  # FP — measured, it silences `# ...disable with auditctl -e 0 but we do not`.
  # It also, in the same measurement, silenced the compiled case: a binary whose
  # extracted run is `…Xauditctl -e 0nextstring…` (a Go-style contiguous string
  # blob, >200 bytes into the run) stopped matching, because `^` binds per
  # extracted run, not per file. `for:` includes go and elf, and the hostile
  # go-unix.yaml composite is built on precisely that case. A missed Go/ELF
  # audit-tamper implant costs more than a shell comment scoring one suspicious
  # atom that still needs a second leg to convict. Do not "fix" this to anchor.
  - id: auditctl-subsystem-disable
    desc: auditctl disables the audit subsystem
    crit: suspicious
    conf: 0.93
    if:
      type: text
      regex: 'auditctl["'',\s]{1,6}-e["'',\s]{1,6}0'

  # The header above describes the scenario "ran `auditctl -D`, removed
  # /etc/audit/rules.d/*.rules and stopped auditd" — but nothing here implemented
  # the last clause, and no trait anywhere matched it. Stopping or masking the
  # unit silences the subsystem without touching auditctl at all, and `mask` also
  # survives a reboot. Direction is the discriminator: hardening and CIS
  # benchmark scripts drive auditd the other way (`enable`/`start`).
  - id: auditd-service-disable
    desc: Stops, disables or masks the auditd unit
    crit: suspicious
    conf: 0.9
    attack: T1562.012
    if:
      type: text
      regex: 'systemctl["'',\s]{1,6}(stop|disable|mask)["'',\s]{1,6}auditd\b'

  # The file-level spelling of the same act, which `auditctl -D` misses: wipe
  # the rule set on disk so it does not come back on reload either.
  #
  # The target must be the rules DIRECTORY or a glob inside it, or the compiled
  # audit.rules -- `(\*|\s)` after the optional slash is what enforces that. A
  # package's own postrm removing the one file it shipped
  # (`rm -f /etc/audit/rules.d/30-vendor.rules`) is therefore not a match, which
  # is the difference between uninstalling a hardening package and disarming the
  # host's whole audit configuration.
  - id: audit-rules-store-delete
    desc: Deletes the audit rules directory or glob
    crit: suspicious
    conf: 0.9
    attack: T1070
    if:
      type: text
      regex: 'rm\s+-\S*[rf]\S*\s+/etc/audit/(audit\.rules|rules\.d/?(\*|\s))'
