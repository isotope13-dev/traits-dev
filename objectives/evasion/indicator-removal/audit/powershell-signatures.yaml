# This bypass clears the signatures that force logging of suspicious content.
# It does not disable every script-block logging policy. Require the empty-set
# write on the same reflected field; inspection or a populated set is different.
defaults:
  platforms: [windows]
  for: [powershell, ruby]
  attack: T1562.002
traits:
  - id: powershell-scriptblock-signatures-clear
    desc: Clears forced-logging ScriptBlock signatures
    crit: hostile
    conf: 0.99
    if:
      type: yara
      source: |
        rule powershell_scriptblock_signatures_clear {
          strings:
            $clear = /\[(System\.Management\.Automation\.)?ScriptBlock\]\s*\.GetField\s*\(\s*["']signatures["']\s*,\s*["'](NonPublic\s*,\s*Static|Static\s*,\s*NonPublic)["']\s*\)\s*\.SetValue\s*\(\s*\$null\s*,\s*\(?\s*New-Object\s+(System\.)?Collections\.Generic\.HashSet\s*\[\s*string\s*\]\s*\)?\s*\)/ nocase
            $ctor = /\[(System\.Management\.Automation\.)?ScriptBlock\]\s*\.GetField\s*\(\s*["']signatures["']\s*,\s*["'](NonPublic\s*,\s*Static|Static\s*,\s*NonPublic)["']\s*\)\s*\.SetValue\s*\(\s*\$null\s*,\s*\[(System\.)?Collections\.Generic\.HashSet\s*\[\s*string\s*\]\s*\]\s*::\s*new\s*\(\s*\)\s*\)/ nocase
          condition:
            any of them
        }
