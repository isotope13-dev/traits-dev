# Reconstructed from Huntress's hidden inbox-rule table. This configuration
# suppresses unread indicators and removes matching messages, but does not by
# itself prove account compromise or establish which messages match the rule.
# Require both enabled actions on the same parsed Exchange command; quoted
# examples, separate commands, and $false values do not establish this behavior.
defaults:
  for: [powershell]
  platforms: [windows]
  crit: suspicious
  conf: 0.96
  attack: T1564.008

traits:
  - id: inbox-rule-read-and-delete
    desc: Inbox rule marks read and deletes mail
    ref: https://www.huntress.com/blog/what-bec-looks-like
    if:
      type: tree-sitter
      query: |
        (command
          command_name: (command_name) @cmd
          command_elements: (command_elements
            (command_parameter) @read
            . (command_argument_sep) . (_) @read_value
            (command_parameter) @delete
            . (command_argument_sep) . (_) @delete_value)
          (#match? @cmd "(?i)^(New|Set)-InboxRule$")
          (#match? @read "(?i)^-MarkAsRead$")
          (#match? @delete "(?i)^-DeleteMessage$")
          (#match? @read_value "(?i)^\\$true$")
          (#match? @delete_value "(?i)^\\$true$")) @evidence
        (command
          command_name: (command_name) @cmd
          command_elements: (command_elements
            (command_parameter) @delete
            . (command_argument_sep) . (_) @delete_value
            (command_parameter) @read
            . (command_argument_sep) . (_) @read_value)
          (#match? @cmd "(?i)^(New|Set)-InboxRule$")
          (#match? @read "(?i)^-MarkAsRead$")
          (#match? @delete "(?i)^-DeleteMessage$")
          (#match? @read_value "(?i)^\\$true$")
          (#match? @delete_value "(?i)^\\$true$")) @evidence
