# Huntress, token-replay-spray (2026-10-22): the reported rules mark all
# incoming mail read, then delete it or relocate it to an obscure folder.
# These are suspicious configurations, not proof that the caller stole a token.
# Match real Outlook/Graph protocol fields rather than rule names, IPs, user
# agents, payroll vocabulary or Windows device-name conventions.
# Empty conditions and both actions must occur within ONE messageRule object.
# The two condition/action orders and both action orders are equivalent.
# Protocol fields are independent of client implementation and operating system.
defaults:
  for: [python, javascript, powershell, json]
  platforms: [windows, unix]
  crit: suspicious
  conf: 0.94
  attack: T1564.008

traits:
  - id: unconditional-inbox-read-and-delete
    desc: All inbox mail marked read and deleted
    if:
      type: yara
      source: |
        rule unconditional_inbox_read_and_delete {
          strings:
            $endpoint = /mailFolders\/[^\/"' \t\r\n]{1,64}\/messageRules\b/ nocase
            $rule0 = /\{[^{}]{0,256}conditions["']?\s*:\s*\{\s*\}[^{}]{0,256}actions["']?\s*:\s*\{[^{}]{0,256}markAsRead["']?\s*:\s*true\b[^{}]{0,256}delete["']?\s*:\s*true\b[^{}]{0,256}\}[^{}]{0,256}\}/ nocase
            $rule1 = /\{[^{}]{0,256}actions["']?\s*:\s*\{[^{}]{0,256}markAsRead["']?\s*:\s*true\b[^{}]{0,256}delete["']?\s*:\s*true\b[^{}]{0,256}\}[^{}]{0,256}conditions["']?\s*:\s*\{\s*\}[^{}]{0,256}\}/ nocase
            $rule2 = /\{[^{}]{0,256}conditions["']?\s*:\s*\{\s*\}[^{}]{0,256}actions["']?\s*:\s*\{[^{}]{0,256}delete["']?\s*:\s*true\b[^{}]{0,256}markAsRead["']?\s*:\s*true\b[^{}]{0,256}\}[^{}]{0,256}\}/ nocase
            $rule3 = /\{[^{}]{0,256}actions["']?\s*:\s*\{[^{}]{0,256}delete["']?\s*:\s*true\b[^{}]{0,256}markAsRead["']?\s*:\s*true\b[^{}]{0,256}\}[^{}]{0,256}conditions["']?\s*:\s*\{\s*\}[^{}]{0,256}\}/ nocase
            $disabled = /isEnabled["']?\s*:\s*false\b/ nocase
          condition:
            $endpoint and (
              for any i in (1..#rule0) : (not $disabled in (@rule0[i]..@rule0[i] + !rule0[i])) or
              for any i in (1..#rule1) : (not $disabled in (@rule1[i]..@rule1[i] + !rule1[i])) or
              for any i in (1..#rule2) : (not $disabled in (@rule2[i]..@rule2[i] + !rule2[i])) or
              for any i in (1..#rule3) : (not $disabled in (@rule3[i]..@rule3[i] + !rule3[i]))
            )
        }
  - id: unconditional-inbox-read-and-move
    desc: All inbox mail marked read and moved
    if:
      type: yara
      source: |
        rule unconditional_inbox_read_and_move {
          strings:
            $endpoint = /mailFolders\/[^\/"' \t\r\n]{1,64}\/messageRules\b/ nocase
            $rule0 = /\{[^{}]{0,256}conditions["']?\s*:\s*\{\s*\}[^{}]{0,256}actions["']?\s*:\s*\{[^{}]{0,256}markAsRead["']?\s*:\s*true\b[^{}]{0,256}moveToFolder["']?\s*:\s*(["\'][^"\'{}]{1,160}["\']|[a-zA-Z_][a-zA-Z0-9_]{0,63})[^{}]{0,256}\}[^{}]{0,256}\}/ nocase
            $rule1 = /\{[^{}]{0,256}actions["']?\s*:\s*\{[^{}]{0,256}markAsRead["']?\s*:\s*true\b[^{}]{0,256}moveToFolder["']?\s*:\s*(["\'][^"\'{}]{1,160}["\']|[a-zA-Z_][a-zA-Z0-9_]{0,63})[^{}]{0,256}\}[^{}]{0,256}conditions["']?\s*:\s*\{\s*\}[^{}]{0,256}\}/ nocase
            $rule2 = /\{[^{}]{0,256}conditions["']?\s*:\s*\{\s*\}[^{}]{0,256}actions["']?\s*:\s*\{[^{}]{0,256}moveToFolder["']?\s*:\s*(["\'][^"\'{}]{1,160}["\']|[a-zA-Z_][a-zA-Z0-9_]{0,63})[^{}]{0,256}markAsRead["']?\s*:\s*true\b[^{}]{0,256}\}[^{}]{0,256}\}/ nocase
            $rule3 = /\{[^{}]{0,256}actions["']?\s*:\s*\{[^{}]{0,256}moveToFolder["']?\s*:\s*(["\'][^"\'{}]{1,160}["\']|[a-zA-Z_][a-zA-Z0-9_]{0,63})[^{}]{0,256}markAsRead["']?\s*:\s*true\b[^{}]{0,256}\}[^{}]{0,256}conditions["']?\s*:\s*\{\s*\}[^{}]{0,256}\}/ nocase
            $disabled = /isEnabled["']?\s*:\s*false\b/ nocase
          condition:
            $endpoint and (
              for any i in (1..#rule0) : (not $disabled in (@rule0[i]..@rule0[i] + !rule0[i])) or
              for any i in (1..#rule1) : (not $disabled in (@rule1[i]..@rule1[i] + !rule1[i])) or
              for any i in (1..#rule2) : (not $disabled in (@rule2[i]..@rule2[i] + !rule2[i])) or
              for any i in (1..#rule3) : (not $disabled in (@rule3[i]..@rule3[i] + !rule3[i]))
            )
        }
