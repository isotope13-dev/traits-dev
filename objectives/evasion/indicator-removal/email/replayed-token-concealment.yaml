# Post-replay mailbox concealment: creating an inbox rule that hides
# incoming mail (marking all mail read and deleting/moving it, or filing
# mail to RSS Feeds / RSS Subscriptions / Conversation History) within a
# script that bulk-replays stolen refresh tokens as a Microsoft first-party
# client (Huntress, token-replay-spray, 2026-10-22).
#
# ATT&CK: T1564.008, T1550.001, T1528
defaults:
  platforms: [windows, unix]
  for: [scripts, source]
  attack: T1564.008,T1550.001,T1528

composite_rules:
  - id: replayed-token-inbox-rule-concealment
    desc: Creates hiding inbox rules using bulk-replayed refresh tokens
    crit: hostile
    conf: 0.98
    all:
      - id: objectives/credential-access/cloud/token/oauth::bulk-first-party-refresh-token-replay
    any:
      - id: unconditional-inbox-read-and-delete
      - id: unconditional-inbox-read-and-move
      - id: micro-behaviors/communications/email/rule::mail-rule-moves-mail-to-rss-folder
      - id: micro-behaviors/communications/email/rule::mail-rule-moves-mail-to-rss-subscriptions
      - id: micro-behaviors/communications/email/rule::mail-rule-moves-mail-to-conversation-history
    near_bytes: 8192
