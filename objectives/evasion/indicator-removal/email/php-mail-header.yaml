# Disabling mail.add_x_header at runtime suppresses the X-PHP-Originating-Script
# mail header that records the UID and script path of the sending file. Attackers
# running injected mailers and spam scripts disable this header to conceal the
# location of the compromised script from server administrators.
defaults:
  platforms: [windows, unix]
  for: [php, text]
  attack: T1562.001,T1070

composite_rules:
  - id: php-injected-mailer-header-suppression
    desc: Injected PHP script suppresses mail attribution header
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/communications/email/config::php-disable-mail-originating-header
    any:
      - id: micro-behaviors/communications/http/request/cgi::remote-addr-server-var
      - id: metadata/file/profile/operation-reference::eval-call-text

  - id: php-obfuscated-mailer-suppressed-header
    for: [text]
    desc: Obfuscated mailer suppresses mail header
    crit: hostile
    conf: 0.98
    attack: T1562.001,T1027
    all:
      - id: micro-behaviors/communications/email/config::php-disable-mail-originating-header
      - id: micro-behaviors/communications/url/http-encoded::base64-decoded-http-url
      - id: metadata/file/profile/operation-reference::eval-call-text
