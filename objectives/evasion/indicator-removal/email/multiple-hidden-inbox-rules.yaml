# Multiple Exchange rules that file mail into unusual folders are a stronger
# concealment signal than an isolated mail-routing rule. Require both the
# Exchange operation and a hiding action alongside the two destinations.
defaults:
  for: [powershell]
  platforms: [windows]
  attack: T1564.008,T1114.003

composite_rules:
  - id: exchange-rules-hide-mail-in-unusual-folders
    desc: Exchange rules hide mail in two unusual folders
    crit: hostile
    conf: 0.96
    all:
      - id: micro-behaviors/communications/email/rule::new-inbox-rule-cmdlet
      - id: micro-behaviors/communications/email/rule::inbox-rule-conceal-parameter
      - id: micro-behaviors/communications/email/rule::mail-rule-moves-mail-to-conversation-history
      - id: micro-behaviors/communications/email/rule::mail-rule-moves-mail-to-rss-subscriptions
    near_lines: 4
