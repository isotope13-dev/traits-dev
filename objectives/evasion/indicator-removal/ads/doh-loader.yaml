defaults:
  platforms: [windows]
  for: [javascript, typescript]
composite_rules:
  - id: doh-encrypted-loader-motw-stripping
    desc: MOTW stripping in encrypted DNS file loader
    crit: hostile
    conf: 0.98
    attack: T1027,T1140,T1553.005
    # The same-path write/launch is required, unlike generic co-occurrence of
    # file and process APIs. TXT lookup plus authenticated decryption and MOTW
    # stripping supplies concealment context absent from ordinary updaters.
    all:
      - id: micro-behaviors/process/deploy/file-exec::node-written-path-conditional-spawn
      - id: micro-behaviors/communications/dns/doh::doh-google-json
      - id: micro-behaviors/communications/dns/txt::json-answer-txt-filter
      - id: micro-behaviors/data/decode/base64::buffer-from-base64
      - id: micro-behaviors/crypto/decrypt::createDecipheriv
      - id: micro-behaviors/crypto/verify::node-crypto-verify
      - id: objectives/evasion/indicator-removal/ads::node-motw-stream-removal
