# NTFS Alternate Data Stream (ADS) Indicator Removal - JavaScript/Node
defaults:
  platforms: [windows]
  for: [javascript, typescript]
  attack: T1553.005,T1070.009

composite_rules:
  - id: node-motw-stream-removal
    desc: Node script removes Zone.Identifier ADS
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/fs/path/stream::zone-identifier-reference
      - id: micro-behaviors/fs/delete/file/library::fs-unlinkSync
    any:
      - id: micro-behaviors/process/create/spawn::bare-spawn-call
      - id: micro-behaviors/process/create/exec::spawn-variable-program
      - id: micro-behaviors/process/create/subprocess::fetch-write-exec
