# NTFS Alternate Data Stream (ADS) removal - JavaScript/Node
defaults:
  platforms: [windows]
  for: [javascript, typescript]
  attack: T1553.005

traits:
  - id: node-motw-stream-removal
    desc: Node deletes Zone.Identifier ADS
    crit: suspicious
    conf: 0.96
    if:
      type: text
      regex: '(?is)\b(unlinkSync|unlink|rmSync|rm)\s*\([^\n)]{0,180}Zone\.Identifier'
