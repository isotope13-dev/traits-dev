defaults:
  platforms: [windows]
  for: [powershell, batch, pe, dll]
  attack: T1070.009

traits:
  - id: remove-zone-identifier-stream
    desc: Removes Zone.Identifier ADS
    crit: suspicious
    conf: 0.98
    if:
      type: text
      regex: '(?i)\bRemove-Item\b[^\r\n]{0,220}-Stream\s+[''"'']?Zone\.Identifier\b'

composite_rules:
  - id: downloaded-file-motw-removal
    for: [powershell]
    desc: MOTW removal near hidden EXE URL and launch
    crit: suspicious
    conf: 0.99
    all:
      - id: remove-zone-identifier-stream
      - id: micro-behaviors/process/create/start-process::powershell-hidden-exe-url-start-profile
