defaults:
  platforms: [windows]
  for: [powershell, batch, pe, dll]
  attack: T1070.009

traits:
  - id: remove-zone-identifier-stream
    desc: Removes Zone.Identifier ADS
    crit: suspicious
    conf: 0.98
    if:
      type: text
      regex: '(?i)\bRemove-Item\b[^\r\n]{0,220}-Stream\s+[''"'']?Zone\.Identifier\b'

composite_rules:
  - id: downloaded-file-motw-removal
    desc: MOTW removal before hidden executable launch
    crit: hostile
    conf: 0.99
    attack: T1070.009,T1105,T1204.002
    all:
      - id: remove-zone-identifier-stream
      - id: objectives/command-and-control/dropper/execution/download-exec::powershell-hidden-exe-download-launch
