defaults:
  platforms: [windows]
  for: [javascript]

composite_rules:
  - id: wsh-concealed-zone-stream-overwrite
    desc: WSH self-path and concealed Zone stream with empty redirection
    crit: suspicious
    conf: 0.97
    attack: T1553.005
    # Same-file clues support probable MOTW stripping, not proven value flow
    # through an arbitrarily obfuscated string-table decoder.
    all:
      - id: micro-behaviors/fs/path/stream::punctuation-separated-zone-identifier
      - id: micro-behaviors/fs/write/content::cmd-empty-echo-redirection-literal
      - id: micro-behaviors/process/info/selfpath::scriptfullname-literal
      - id: micro-behaviors/os/com/instantiation::activex-object-variable-progid
      - id: micro-behaviors/data/property/access::wscript-bracket-member-access
  # Plain `WScript.ScriptFullName` spelling of the same MOTW self-strip: the
  # script blanks its own Zone.Identifier stream through a hidden cmd echo
  # redirect. The bracket-access sibling above needs computed member names.
  - id: wsh-self-zone-stream-overwrite
    desc: WSH blanks its own Zone stream via cmd echo
    crit: suspicious
    conf: 0.92
    attack: T1553.005
    all:
      - id: micro-behaviors/fs/write/content::cmd-empty-echo-redirection-literal
      - id: micro-behaviors/process/info/selfpath::wscript-scriptfullname
      - id: micro-behaviors/os/com/instantiation::activex-constructor-call
    any:
      - id: micro-behaviors/fs/path/stream::punctuation-separated-zone-identifier
      - id: micro-behaviors/fs/path/stream::zone-identifier-reference
  # Static co-occurrence: MOTW self-strip, a base64 blob decoded through MSXML
  # and written with ADODB.Stream, and a Run call. Values are not bound.
  - id: wsh-zone-strip-base64-stream-launcher
    desc: WSH strips own MOTW, writes decoded stream, runs
    crit: hostile
    conf: 0.95
    attack: T1553.005,T1027,T1140
    mbc: B0023,B0032
    all:
      - id: objectives/evasion/indicator-removal/ads::wsh-self-zone-stream-overwrite
      - id: micro-behaviors/data/property/access::msxml-node-typed-value
      - id: micro-behaviors/fs/write/file/stream::savetofile-method-token
      - id: micro-behaviors/data/control-flow/dispatch/run::script-run-method-call
