# Native programs that build "<path>:Zone.Identifier" and hand it to
# DeleteFileW remove the Mark-of-the-Web from a downloaded file, so
# SmartScreen and Office Protected View no longer see it as internet-sourced.
# Some unblock helpers do this; a process-hollowing loader has no such reason.
defaults:
  platforms: [windows]
  for: [pe]
  attack: T1553.005

composite_rules:
  - id: native-zone-identifier-delete
    desc: Native code deletes a Zone.Identifier stream
    crit: suspicious
    conf: 0.85
    all:
      - id: micro-behaviors/fs/path/stream::zone-identifier-reference
      - id: micro-behaviors/fs/delete/file/library::deletefile-w

  - id: motw-strip-process-hollowing-loader
    desc: Loader strips Mark-of-the-Web and hollows a suspended process
    crit: hostile
    conf: 0.96
    attack: T1553.005,T1055.012
    all:
      - id: native-zone-identifier-delete
      - id: micro-behaviors/process/inject/runtime/memory::suspended-launch-remote-memory-apis
