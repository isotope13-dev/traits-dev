# File-wide clues do not bind DeleteFileW to the stream path. Archive tools
# can handle Zone.Identifier streams and delete unrelated files.
defaults:
  platforms: [windows]
  for: [pe]

composite_rules:
  - id: native-zone-identifier-delete
    desc: Native Zone.Identifier and file deletion clues
    crit: notable
    conf: 0.85
    all:
      - id: micro-behaviors/fs/path/stream::zone-identifier-reference
      - id: micro-behaviors/fs/delete/file/library::deletefile-w

  - id: motw-strip-process-hollowing-loader
    desc: Suspended launch and remote writes with stream and deletion clues
    crit: hostile
    conf: 0.96
    attack: T1055
    all:
      - id: native-zone-identifier-delete
      - id: micro-behaviors/process/inject/runtime/memory::suspended-launch-remote-memory-apis
