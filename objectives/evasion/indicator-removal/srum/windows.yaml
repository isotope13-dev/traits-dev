# Stopping the Diagnostic Policy Service and naming SRUDB.dat is how a
# program reaches the System Resource Usage Monitor to delete rows. Naming
# the database alone is only a path.
defaults:
  platforms: [windows]
  for: [pe, dll, powershell]
  attack: T1070
traits:
  - id: dps-service-stop-command
    desc: Stops the DPS diagnostic service
    crit: notable
    conf: 0.9
    for: [binaries, scripts, source]
    if:
      type: text
      regex: '(?i)Stop-Service\s+-Name\s+''DPS'''
  - id: srudb-database-path
    desc: Windows SRUM database path
    crit: notable
    conf: 0.9
    for: [binaries, scripts, source]
    if:
      type: text
      substr: SRUDB.dat
composite_rules:
  - id: dps-stop-names-srum-database
    desc: Stops DPS and names SRUM database
    crit: hostile
    conf: 0.97
    attack: T1070,T1562.001
    near_bytes: 512
    all:
      - id: dps-service-stop-command
      - id: srudb-database-path
    unless:
      - id: metadata/signed/platform/
      - id: well-known/tool/sysadmin/
