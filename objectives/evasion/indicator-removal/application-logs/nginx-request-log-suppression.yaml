defaults:
  platforms: [unix, windows]
  for: [elf, macho, pe, c, cpp]
  attack: T1070.002,T1505.003
  mbc: F0006

composite_rules:
  - id: nginx-module-ctx-log-suppression-backdoor
    desc: Nginx log-module reference alongside verified decryption and command exec
    crit: hostile
    conf: 0.96
    all:
      - id: micro-behaviors/communications/http/server/module::nginx-http-log-module-ref
      - id: micro-behaviors/crypto/verify/
      - id: micro-behaviors/crypto/decrypt/
    any:
      - id: metadata/binary/symbols/name/process::c-popen
      - id: micro-behaviors/process/create/subprocess/capture::c-popen-call
      - id: micro-behaviors/process/create/shell/
