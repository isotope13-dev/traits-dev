defaults:
  platforms: [unix]
  for: [shell]
  crit: hostile
  conf: 0.97
  attack: T1070.002

composite_rules:
  - id: go2rtc-log-clearing-miner
    desc: Concealed miner also erases go2rtc logs
    # The unrelated camera server's log buffer is erased alongside miner
    # setup. API use alone, including ordinary log maintenance, is neutral.
    all:
      - id: micro-behaviors/communications/http/delete::go2rtc-log-buffer-clear
      - id: objectives/impact/cryptojacking/miner/config::xmrig-configured-argument-line
      - id: objectives/impact/cryptojacking/miner/pool::dotfile-pool-wallet-command
