defaults:
  for: [text]
  platforms: [windows]
  crit: component

traits:
  - id: incoming-connections-disabled
    desc: Disables incoming connection logging
    if:
      type: text
      regex: '(?im)^LogIncomingConnections\s*=\s*0\r?$'

  - id: outgoing-connections-disabled
    desc: Disables outgoing connection logging
    if:
      type: text
      regex: '(?im)^LogOutgoingConnections\s*=\s*0\r?$'

  - id: connection-log-disabled
    desc: Disables writing connection logs
    if:
      type: text
      regex: '(?im)^writeconnectionlog\s*=\s*0\r?$'

composite_rules:
  - id: teamviewer-connection-logs-disabled
    desc: TeamViewer configuration disables connection logging
    crit: suspicious
    conf: 0.98
    all:
      - id: well-known/dual-use/remote-admin/teamviewer::portable-config
      - id: incoming-connections-disabled
      - id: outgoing-connections-disabled
      - id: connection-log-disabled
