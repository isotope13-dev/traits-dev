# Deleting application logs is ordinary retention work on its own. It becomes
# hostile indicator removal here only when the same code is a Base64 file-backed
# shell-tasking implant. The neutral cleanup mechanics live under
# micro-behaviors/fs/log-rotation/.
defaults:
  platforms: [unix, windows]
  for: [java]
  attack: T1070.001
  mbc: F0005

composite_rules:
  - id: java-application-database-log-wipe
    desc: Command-tasking Java wipes application and database logs
    crit: hostile
    conf: 0.995
    all:
      - id: objectives/command-and-control/remote-command/control::java-filesystem-base64-shell-tasking
      - id: micro-behaviors/fs/log-rotation::java-server-log-family-delete
    any:
      - id: micro-behaviors/fs/log-rotation::java-derby-log-delete
      - id: micro-behaviors/fs/log-rotation::java-nio-derby-log-delete
    needs: 1

  - id: jvm-application-database-log-wipe
    desc: Command-tasking JVM carries server and Derby log cleanup
    crit: hostile
    conf: 0.995
    for: [class, jar, zip]
    scope: outer
    all:
      - id: objectives/command-and-control/remote-command/control::jvm-filesystem-base64-shell-tasking
      - id: micro-behaviors/fs/log-rotation::jvm-server-log-family-delete
      - id: metadata/file/string/file::jvm-derby-log-path
