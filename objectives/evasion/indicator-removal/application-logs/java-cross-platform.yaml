# Deleting application logs is ordinary retention work on its own. It becomes
# hostile indicator removal here only when the same code is a Base64 file-backed
# shell-tasking implant. The neutral cleanup mechanics live under
# micro-behaviors/fs/delete/file/library/.
defaults:
  crit: hostile
  conf: 0.995
  platforms: [unix, windows]
  for: [java]
  attack: T1070.004
  mbc: F0005

composite_rules:
  - id: java-command-tasking-log-deletion
    desc: Shell-tasking Java deletes server and Derby logs
    all:
      - id: objectives/command-and-control/remote-command/dispatch/command::java-filesystem-base64-shell-tasking
      - id: micro-behaviors/fs/delete/file/library::java-server-log-family-delete
    any:
      - id: micro-behaviors/fs/delete/file/library::java-derby-log-delete
      - id: micro-behaviors/fs/delete/file/library::java-nio-derby-log-delete
    needs: 1

  - id: jvm-application-database-log-wipe
    desc: Command-tasking JVM carries server and Derby log cleanup
    for: [class, jar, zip]
    scope: outer
    all:
      - id: objectives/command-and-control/remote-command/dispatch/command::jvm-filesystem-base64-shell-tasking
      - id: micro-behaviors/fs/delete/file/library::jvm-server-log-family-delete
      - id: metadata/file/string/file::jvm-derby-log-path
