defaults:
  platforms: [unix, windows]
  attack: T1070.002,T1505.003
  mbc: F0006

composite_rules:
  - id: apache-dontlog-command-backdoor
    desc: Apache module sets dontlog flag alongside payload decryption and command exec
    crit: hostile
    conf: 0.96
    for: [c, cpp, elf, macho, so, dylib]
    all:
      - id: micro-behaviors/communications/http/server/module::apache-subprocess-env-dontlog
      - id: micro-behaviors/crypto/decrypt/
    any:
      - id: metadata/binary/symbols/name/process::c-popen
      - id: micro-behaviors/process/create/subprocess/capture::c-popen-call
      - id: micro-behaviors/process/create/shell/

  - id: php-apache-dontlog-webshell
    desc: PHP handler suppresses Apache request logging while executing header commands
    crit: hostile
    conf: 0.97
    for: [php]
    near_lines: 120
    all:
      - id: micro-behaviors/communications/http/server/module::php-apache-setenv-dontlog
      - id: micro-behaviors/communications/http/server/request::server-request-header-read
    any:
      - id: micro-behaviors/process/create/shell/
      - id: micro-behaviors/process/create/subprocess/
      - id: micro-behaviors/process/create/exec/

  - id: python-http-log-suppressed-command-backdoor
    desc: Python HTTP handler suppresses access logging alongside encrypted command exec
    crit: hostile
    conf: 0.97
    for: [python]
    near_lines: 200
    all:
      - id: micro-behaviors/communications/http/server/request::server-request-header-read
      - id: micro-behaviors/crypto/decrypt/
      - id: micro-behaviors/process/create/subprocess/
    any:
      - id: micro-behaviors/communications/http/server/middleware::python-http-access-logger-disable
      - id: micro-behaviors/communications/http/server/middleware::python-basehttp-log-message-override

  - id: js-http-log-suppressed-command-backdoor
    desc: Node HTTP handler skips access logging alongside encrypted command exec
    crit: hostile
    conf: 0.97
    for: [javascript, typescript]
    near_lines: 200
    all:
      - id: micro-behaviors/communications/http/server/middleware::js-http-logger-header-skip
      - id: micro-behaviors/communications/http/server/request::server-request-header-read
      - id: micro-behaviors/crypto/decrypt/
    any:
      - id: micro-behaviors/process/create/subprocess/
      - id: micro-behaviors/process/create/shell/
      - id: micro-behaviors/process/create/exec/
