defaults:
  for:
  - dos_com
  platforms:
  - windows
  - unix
  size_max: 65536
composite_rules:
- id: dos-appended-host-time-seconds-marker
  desc: Host appender reapplies time with seconds marker
  crit: hostile
  conf: 0.99
  all:
  - id: micro-behaviors/fs/write/file/handle::dos-encrypted-body-append-header-redirect
  - id: micro-behaviors/fs/file/timestamp::dos-saved-time-seconds-marker
