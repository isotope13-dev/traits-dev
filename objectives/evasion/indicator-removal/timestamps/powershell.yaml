defaults:
  platforms: [windows]
  for: [powershell]
  attack: T1070.006,T1070.003
  mbc: F0006,F0005

composite_rules:
  - id: powershell-timestomp-setter
    desc: PowerShell modifies file timestamps via property or .NET API
    crit: notable
    conf: 0.9
    any:
      - id: micro-behaviors/fs/file/timestamp::powershell-filetime-property-set
      - id: micro-behaviors/fs/file/timestamp::powershell-dotnet-set-file-time

  - id: powershell-timestomp-with-history-erasure
    desc: PowerShell modifies file timestamps and erases command history
    crit: hostile
    conf: 0.97
    all:
      - id: powershell-timestomp-setter
      - id: micro-behaviors/communications/http/
    any:
      - id: objectives/evasion/indicator-removal/history::powershell-psreadline-history-remove
      - id: micro-behaviors/os/console/control::powershell-clear-history-command
