                        (variable_name
                          (name) @request)) operator: "." right:
                      (function_call_expression function:
                        (name) @read arguments:
                        (arguments
                          (argument
                            (variable_name) @readpath)))))))) ]) .
          (expression_statement [
            (function_call_expression function:
              (name) @touch arguments:
              (arguments
                (argument
                  (variable_name) @touchpath) .
                (argument
                  (variable_name) @restoretime)))
            (error_suppression_expression
              (function_call_expression function:
                (name) @touch arguments:
                (arguments
                  (argument
                    (variable_name) @touchpath) .
                  (argument
                    (variable_name) @restoretime)))) ]))
        (#eq? @write "file_put_contents")
        (#eq? @read "file_get_contents")
        (#eq? @path @writepath)
        (#eq? @path @readpath)
        (#any-of? @request "_POST" "_GET" "_REQUEST")
        (#match? @script "(?i)\\.php['\\\"]$")
        (#eq? @stat "filemtime")
        (#eq? @statpath @path)
        (#not-eq? @mtime @path)
        (#eq? @touch "touch")
        (#eq? @touchpath @path)
        (#eq? @restoretime @mtime)) @conceal
