defaults:
  crit: hostile
  platforms: [unix, windows]
  for: [php]
  attack: T1070.006
  conf: 0.95

composite_rules:
  # Same capture / overwrite / restore shape as php-stealth-file-rewrite, with
  # the PHP @ operator muting failures on the calls: the author expects to run
  # unattended against files it may not fully control and wants no trace.
  - id: php-silenced-rewrite-mtime-restore
    desc: PHP silently rewrites a file and restores mtime
    near_bytes: 512
    all:
      - id: micro-behaviors/fs/file/timestamp::php-filemtime-call
      - id: micro-behaviors/fs/file/timestamp::php-touch-restores-captured-mtime
      - id: micro-behaviors/fs/write/file/full::php-file-put-contents
      - id: micro-behaviors/os/stdio::error-suppress-prefix
    unless:
      - id: metadata/package/testing/harness/unit/
      - id: well-known/lib/runtime/scripted/php-runtime::source-tree
      - id: well-known/lib/web/symfony::symfony-framework
      - id: well-known/app/publishing/wordpress-plugins/security::snapshot-restore-context

  # Request-supplied bytes are spliced onto the file's existing contents and
  # the file's mtime is put back, so the injected code is neither visible in
  # a listing nor in modification-time based integrity checks.
  - id: php-request-injection-mtime-restore
    desc: Request data injected into file; mtime restored
    near_bytes: 512
    all:
      - id: micro-behaviors/fs/file/timestamp::php-touch-restores-captured-mtime
      - id: micro-behaviors/fs/write/file/full::php-file-put-contents
      - id: micro-behaviors/fs/read/file/full::php-file-get-variable-source
      - id: micro-behaviors/communications/http/request/superglobal::php-request-parameter-access
    unless:
      - id: metadata/package/testing/harness/unit/
      - id: well-known/lib/runtime/scripted/php-runtime::source-tree
      - id: well-known/lib/web/symfony::symfony-framework
      - id: well-known/app/publishing/wordpress-plugins/security::snapshot-restore-context
