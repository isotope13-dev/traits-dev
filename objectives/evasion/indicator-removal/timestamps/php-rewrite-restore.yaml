defaults:
  crit: hostile
  platforms:
  - unix
  - windows
  for:
  - php
  attack: T1070.006
composite_rules:
- id: php-request-injection-mtime-restore
  desc: Restores mtime after request-driven PHP injection
  conf: 0.97
  all:
  - id: objectives/impact/infect/script/inject::php-request-script-prepend
  - id: php-request-script-restored-mtime-bound-paths
traits:
- id: php-request-script-restored-mtime-bound-paths
  desc: Request prepend restores same PHP script mtime
  crit: suspicious
  conf: 0.98
  if:
    type: tree-sitter
    query: |
      (
        (program
          (expression_statement
            (assignment_expression left:
              (variable_name) @path right: [
              (string)
              (encapsed_string) ] @script)) .
          (expression_statement
            (assignment_expression left:
              (variable_name) @mtime right: [
              (function_call_expression function:
                (name) @stat arguments:
                (arguments
                  (argument
                    (variable_name) @statpath)))
              (error_suppression_expression
                (function_call_expression function:
                  (name) @stat arguments:
                  (arguments
                    (argument
                      (variable_name) @statpath)))) ])) .
          (expression_statement [
            (function_call_expression function:
              (name) @write arguments:
              (arguments
                (argument
                  (variable_name) @writepath) .
                (argument
                  (binary_expression left:
                    (subscript_expression
                      (variable_name
                        (name) @request)) operator: "." right:
                    (function_call_expression function:
                      (name) @read arguments:
                      (arguments
                        (argument
                          (variable_name) @readpath)))))))
            (error_suppression_expression
              (function_call_expression function:
                (name) @write arguments:
                (arguments
                  (argument
                    (variable_name) @writepath) .
                  (argument
                    (binary_expression left:
