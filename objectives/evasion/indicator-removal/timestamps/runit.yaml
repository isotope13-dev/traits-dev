defaults:
  platforms: [unix]
  for: [scripts, source, binaries]

composite_rules:
  - id: runit-launcher-edit-timestamp-copy
    desc: Runit launcher edit with timestamp copying
    crit: suspicious
    conf: 0.95
    attack: T1070.006
    near_lines: 16
    all:
      - id: micro-behaviors/os/service/configure::sed-inplace-runit-launcher
      - id: micro-behaviors/fs/file/timestamp::touch-runit-launcher-reference
