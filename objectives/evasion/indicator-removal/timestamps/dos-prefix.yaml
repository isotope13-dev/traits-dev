defaults:
  for: [batch]
  platforms: [windows]
  size_max: 65536
  attack: T1070.006
composite_rules:
  - id: dos-preserve-time-after-host-prefix-write
    desc: DOS host prefix writer includes time writeback
    crit: suspicious
    conf: 0.98
    all:
      - id: micro-behaviors/fs/search::dos-entry-bat-walk-calls-mover
      - id: micro-behaviors/fs/write/file/handle::dos-backward-file-shift-and-image-prefix
      - id: micro-behaviors/fs/file/timestamp::dos-handle-time-read-writeback-close
