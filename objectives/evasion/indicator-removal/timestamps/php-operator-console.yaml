defaults:
  crit: hostile
  platforms: [unix, windows]
  for: [php]
  attack: T1070.006

composite_rules:
  # Timestamp copying becomes an indicator-removal finding in an uploaded,
  # encoded shell console with disabled audit logging. It is not a generic
  # touch verdict.
  - id: php-dual-execution-timestamp-concealment
    desc: Timestamp concealment in an encoded uploaded shell console
    conf: 0.97
    all:
      - id: objectives/command-and-control/backdoor/webshell/exec::php-encoded-timestamp-shell-console
      - id: micro-behaviors/fs/write/file/copy::move-uploaded-file
      - id: micro-behaviors/fs/file/timestamp::php-dispatched-mtime-copy-profile
