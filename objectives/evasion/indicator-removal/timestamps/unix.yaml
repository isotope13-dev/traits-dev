defaults:
  crit: suspicious
  platforms: [unix]
  for: [binaries, c]
composite_rules:
  - id: backdoor-timestamp-modification
    for: [elf, macho, c]
    desc: Backdoor indicators and timestamp APIs co-occur
    conf: 0.82
    mbc: F0006
    attack: T1070.006
    unless:
      - id: well-known/lib/native/ell::libell-binary
    all:
      - id: micro-behaviors/fs/file/timestamp::unix-timestamp-modification
    any:
      - id: objectives/command-and-control/backdoor/signal::native-filter-stealth-backdoor
      - id: objectives/command-and-control/backdoor/signal::pty-iptables-history-backdoor
      - id: objectives/command-and-control/backdoor/signal::stealth-backdoor-history-suppression
