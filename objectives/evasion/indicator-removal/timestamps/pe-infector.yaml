defaults:
  platforms: [windows]
  for: [pe, dll]
composite_rules:
  - id: pe-infector-file-time-preservation
    desc: PE infector has file-time save/restore APIs
    crit: hostile
    conf: 0.98
    attack: T1070.006
    all:
      - id: objectives/impact/infect/virus::mapped-pe-infection-header-mutation
      - id: micro-behaviors/fs/file/timestamp::set-file-time
