# Timestomping Detection - Python
# Behavioral composites for timestamp manipulation in evasion context
# MBC: F0006 (Timestomp)
# ATT&CK: T1070.006
defaults:
  platforms: [windows, unix]
  for: [python]
  mbc: "F0006"
  attack: "T1070.006"
composite_rules:
  - id: timestomp
    desc: File timestamp modification (evasion)
    crit: suspicious
    conf: 0.8
    all:
      - id: micro-behaviors/fs/file/timestamp::timestamp-preserve
      - id: micro-behaviors/fs/file/timestamp::os-utime
    unless:
      - id: well-known/lib/runtime/scripted/pallets-click::termui-impl-module-filename
      - id: well-known/lib/runtime/scripted/pallets-click::editor-mtime-backdate
      - id: well-known/lib/runtime/scripted/pallets-click::editor-require-save-option
      # Restoring access time while retaining the target's current mtime is
      # normal filesystem bookkeeping, not evidence of timestomping.
      - id: micro-behaviors/fs/file/timestamp::os-utime-preserve-mtime
      - id: well-known/lib/development/paver::paver-module-path
      # Test suites preserve timestamps to model ordering and storage behavior;
      # that is not indicator removal.
      - id: metadata/path::test-directory-component
