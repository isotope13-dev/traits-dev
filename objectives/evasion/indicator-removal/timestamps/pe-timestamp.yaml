defaults:
  platforms: [windows]
  for: [pe]
  attack: "T1070.006"
traits:
  - id: export-timestamp-absent
    desc: Export timestamp is absent
    crit: baseline
    conf: 0.9
    if:
      type: value
      path: pe.export_timestamp
      exists: false
    unless:
      - id: metadata/lang/compiler/systems/


composite_rules:
  - id: packed-pe-max-export-timestamp
    desc: Packed PE uses maximum export timestamp
    crit: suspicious
    conf: 0.98
    all:
      - id: metadata/binary/provenance/build::pe-export-timestamp-all-ones
      - id: objectives/anti-static/obfuscation/payload/section/layout::empty-text-section
      - id: metadata/binary/header/malformed::pe-bss-like-sections-multiple
      - id: metadata/binary/section/ratio::pe-near-total-code-data
      - id: metadata/binary/code/entropy::high-code-entropy
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/framework/
      - id: metadata/binary/installer/family/

  # Was the `pe.timestamp_anomaly` roll-up metric. Same statement, assembled
  # from the concrete stamp anomalies measured above.
  - id: timestamp-anomaly
    desc: PE timestamp anomaly detected
    crit: baseline
    conf: 0.7
    any:
      - id: metadata/build/reproducible::zero-header-timestamp
      - id: metadata/binary/provenance/build::header-timestamp-pre-2000
      - id: metadata/binary/provenance/build::header-timestamp-post-2030
    unless:
      # Go's linker sets PE timestamp=0 by default (reproducible builds);
      # every Go PE has a "timestamp anomaly" that doesn't indicate removal.
      - id: metadata/lang/compiled/
      - id: metadata/lang/compiler/systems/

  - id: future-pe-debug-timestamps
    desc: Far-future PE and debug timestamps
    crit: notable
    conf: 0.9
    all:
      - id: metadata/binary/provenance/build::header-timestamp-post-2030
      - id: metadata/binary/provenance/build::debug-timestamp-post-2024
    unless:
      - id: metadata/binary/framework/
      - id: metadata/binary/installer/family/
      - id: metadata/binary/installer/sfx/
      - id: metadata/binary/installer/script/
      - id: metadata/signed/platform/
      - id: well-known/app/browser/internet-explorer/
      - id: well-known/lib/platform/windows-vault/

  - id: inno-55-pre2000-timestamp
    desc: Inno 5.5 installer with impossible timestamp
    crit: suspicious
    conf: 0.91
    all:
      - id: metadata/binary/provenance/build::header-timestamp-pre-2000
      - id: metadata/binary/installer/script::inno-setup-550-data-marker
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/installer/family/

  - id: packed-loader-future-provenance
    desc: Themida-packed loader with implausible future provenance
    crit: hostile
    conf: 0.98
    attack: "T1027.002,T1070.006"
    mbc: "F0001"
    all:
      - id: objectives/anti-static/pack/detect::themida-boot-loader-layout
      - id: metadata/binary/provenance/build::pe-far-future-timestamp
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/installer/family/
