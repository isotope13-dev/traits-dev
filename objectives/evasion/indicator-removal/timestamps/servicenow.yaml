# ServiceNow record provenance forgery.
#
# GlideRecord.autoSysFields(false) disables automatic auditing on a record
# write, after which sys_created_by / sys_updated_by / sys_created_on /
# sys_updated_on can be set to arbitrary values. Attackers use this to
# make backdoor users and persistence records appear to have been created
# long ago by the "system" user, defeating suspicion during incident
# response (MDSec, "When it Snows it Pours", 2026). No legitimate workflow
# backdates audit identity fields alongside disabled auto-fields.
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript, json, text, data]
  attack: T1070.006
  mbc: F0006

traits:
  - id: servicenow-autosysfields-disabled
    desc: Disables ServiceNow automatic audit fields
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: 'autoSysFields\s*\(\s*false\s*\)'

  - id: servicenow-sysfield-set
    desc: Sets ServiceNow record audit field
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(setValue|setDisplayValue)\s*\(\s*[''"]sys_(created|updated)_(by|on)[''"]\s*,'

  - id: servicenow-system-creator-impersonation
    desc: Sets ServiceNow record creator to system
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: 'setValue\s*\(\s*[''"]sys_(created|updated)_by[''"]\s*,\s*[''"]system[''"]'

composite_rules:
  - id: servicenow-audit-sysfield-forgery
    desc: Forges ServiceNow record audit fields
    crit: suspicious
    conf: 0.95
    all:
      - id: servicenow-autosysfields-disabled
      - id: servicenow-sysfield-set
    near_bytes: 500
