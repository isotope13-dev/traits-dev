defaults:
  for: [dos_com, static-lib, data]
  platforms: [windows, unix]
  size_max: 65536
composite_rules:
  - id: dos-com-appender-restores-marked-time
    desc: DOS appender restores time with marker
    crit: suspicious
    conf: 0.98
    all:
      - id: micro-behaviors/fs/write/file/append::dos-xor-buffer-append-prefix-rewrite
      - id: micro-behaviors/fs/file/timestamp::dos-memory-saved-time-seconds-marker
