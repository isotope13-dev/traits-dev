# Timestomping Detection - Windows
# Behavioral composites for timestamp manipulation in evasion context
# MBC: F0006 (Timestomp)
# ATT&CK: T1070.006
#
# Note: Atomic Windows API traits moved to fs/file/timestamp/windows.yaml
# This file contains only behavioral composites
defaults:
  platforms: [windows]
  for: [pe, dll]
  mbc: "F0006"
  attack: "T1070.006"
composite_rules:
  - id: classic-asp-request-timestomp
    desc: Obfuscated Classic ASP request changes file timestamps
    crit: hostile
    conf: 0.97
    for: [vbs, html, javascript]
    all:
      - id: micro-behaviors/communications/http/request/params::classic-asp-request-field
      - id: micro-behaviors/fs/file/timestamp::shell-application-modify-date
      - id: micro-behaviors/os/com/object::shell-application-progid
      - id: objectives/anti-static/obfuscation/string/concat::vbs-createobject-concat

  - id: timestomp-with-file-copy
    desc: File timestamp modification with file operations
    crit: suspicious
    conf: 0.85
    all:
      - id: micro-behaviors/fs/file/timestamp::set-file-time
      - id: micro-behaviors/fs/enumerate/directory::find-first-file
      - id: micro-behaviors/process/info/current::get-module-filename
    any:
      - id: micro-behaviors/fs/file/write/direct::write-file
      - id: micro-behaviors/fs/file/open::file-create-win
    unless:
      # Stock 7-Zip SFX restores archived timestamps after extraction.
      - id: metadata/binary/installer/sfx::7zs2-runtime-stub
      - id: well-known/app/productivity/ruexcel::ruexcel-inno-uninstaller
      - id: well-known/tool/reverse-engineering/frida/
      - id: well-known/app/communication/telegram::telegram-desktop-signed-client-context
      - id: well-known/app/system/miktex::miktex-setup-wizard
    downgrade:
      any:
        - id: metadata/binary/installer/script/
        - id: metadata/binary/installer/family/
        - id: metadata/library/python-runtime::python-runtime
        - id: metadata/binary/metrics/structural::many-imports
