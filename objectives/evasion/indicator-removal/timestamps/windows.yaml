# Timestomping Detection - Windows
# Behavioral composites for timestamp manipulation in evasion context
# MBC: F0006 (Timestomp)
# ATT&CK: T1070.006
#
# Note: Atomic Windows API traits moved to fs/file/timestamp/windows.yaml
# This file contains only behavioral composites
defaults:
  platforms: [windows]
  for: [pe, dll]
  mbc: "F0006"
  attack: "T1070.006"
composite_rules:
  - id: classic-asp-request-timestomp
    desc: Obfuscated Classic ASP request changes file timestamps
    crit: hostile
    conf: 0.97
    for: [vbs]
    all:
      - id: micro-behaviors/communications/http/request/superglobal::classic-asp-request-field
      - id: micro-behaviors/fs/file/timestamp::shell-application-modify-date
      - id: micro-behaviors/os/com/automation::shell-application-progid
      - id: objectives/anti-static/obfuscation/string/concat::vbs-createobject-concat

  # Timestamp APIs with hash-based import resolution. The
  # stager resolves GetModuleHandle/GetProcAddress and then its real
  # imports by hash behind junk-fused strings. Backup tools and runtimes
  # do not hunt debuggers while hash-resolving imports, so the existing
  # benign exclusions carry over without the framework-specific ones.
  - id: hash-concealed-timestomp-stager
    desc: Timestomped staging with hash-concealed imports
    crit: hostile
    conf: 0.93
    all:
      - id: micro-behaviors/fs/file/timestamp::set-file-time
      - id: micro-behaviors/fs/write/file/handle::write-file
      - id: micro-behaviors/process/debug/detect::is-debugger-present-any
      - id: micro-behaviors/dylib/lookup::module-export-resolution-imports
      - id: micro-behaviors/os/api-resolution/hash-based::multiplicative-hash-loop-x64
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/installer/family/
      # A binary statically importing 200+ APIs is not concealing its
      # imports: the legs co-occur in large runtimes (Rust panic path
      # references IsDebuggerPresent; archivers preserve mtimes via
      # SetFileTime; CRC/checksum code matches the generic hash loop).
      - id: metadata/binary/symbols/count::many-imports-200

  # A carved, fully importless stage that builds its API set from string
  # references (LoadLibraryA/GetProcAddress without an import table), gates
  # on IsDebuggerPresent, flips .text protections, and timestomps while
  # writing files — the decoded body profile of a packed malware chain.
  # Constrained to unsigned, checksum-zeroed images so signed vendor
  # builds that merely co-locate these capability strings stay out.
  - id: importless-decoded-stage-timestomp
    desc: Importless decoded stage with debugger gate and timestomping
    crit: hostile
    conf: 0.9
    all:
      - id: metadata/binary/symbols/count::no-imports
      - id: micro-behaviors/dylib/load/runtime::load-library-a-string-no-import
      - id: micro-behaviors/os/api-resolution/dynamic::get-proc-address-resolved-name
      - id: micro-behaviors/process/debug/detect::is-debugger-present-string
      - id: micro-behaviors/mem/protect/modify::virtual-protect-text-pe
      - id: micro-behaviors/fs/file/timestamp::set-file-time
      - id: micro-behaviors/fs/write/file/handle::writefile-api-text-reference
      - id: metadata/binary/layout/checksum::pe-checksum-zeroed
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/installer/family/
