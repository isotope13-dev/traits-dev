# Timestomping Detection - Windows
# Behavioral composites for timestamp manipulation in evasion context
# MBC: F0006 (Timestomp)
# ATT&CK: T1070.006
#
# Note: Atomic Windows API traits moved to fs/file/timestamp/windows.yaml
# This file contains only behavioral composites
defaults:
  platforms: [windows]
  for: [pe, dll]
  mbc: "F0006"
  attack: "T1070.006"
composite_rules:
  - id: classic-asp-request-timestomp
    desc: Obfuscated Classic ASP request changes file timestamps
    crit: hostile
    conf: 0.97
    for: [vbs]
    all:
      - id: micro-behaviors/communications/http/request/superglobal::classic-asp-request-field
      - id: micro-behaviors/fs/file/timestamp::shell-application-modify-date
      - id: micro-behaviors/os/com/automation::shell-application-progid
      - id: objectives/anti-static/obfuscation/string/concat::vbs-createobject-concat

  # Timestomping plus active analysis evasion and hidden imports: the binary
  # writes files, resets their timestamps, probes for a debugger, and
  # resolves its real imports at runtime behind GetProcAddress. Defragmenters
  # and backup tools preserve timestamps but neither hunt debuggers nor hide
  # their import tables; installers are excluded below.
  - id: debugger-evasive-timestomp-stager
    desc: Evasive timestomped file staging
    crit: hostile
    conf: 0.96
    all:
      - id: micro-behaviors/fs/file/timestamp::set-file-time
      - id: micro-behaviors/fs/write/file/handle::write-file
      - id: micro-behaviors/process/debug/detect::is-debugger-present-any
      - id: micro-behaviors/dylib/load/runtime::win32-system-library-loader-references
    unless:
      - id: metadata/binary/installer/sfx::7zs2-runtime-stub
      - id: metadata/signed/platform::microsoft
      - id: metadata/signed/leaf::microsoft-corporation
      - id: metadata/binary/installer/family/
      - id: well-known/tool/packaging/wix::wix-dutil-utility-module
      - id: well-known/tool/reverse-engineering/frida/
