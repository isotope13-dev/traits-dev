defaults:
  platforms: [windows]
  for: [batch, text]
  attack: T1070.006

composite_rules:
  - id: batch-sets-system-date-then-deletes-itself
    for: [batch]
    desc: Batch sets system date then deletes itself
    crit: hostile
    conf: 0.88
    size_max: 1024
    all:
      - id: micro-behaviors/os/sysinfo/command::batch-date-set-literal
      - id: objectives/evasion/self-delete/scripts::batch-percent-zero-self-delete

  # Some reduced fixtures retain the batch commands but have a nonstandard
  # filename, so file identification yields plain text rather than batch. Keep
  # this path content-driven and require both the old date and %0 self-delete.
  - id: text-backdate-and-self-delete
    for: [text]
    desc: Text sets an old system date and contains a batch self-delete command
    crit: hostile
    conf: 0.9
    attack: T1070.006,T1070.004
    size_max: 1024
    all:
      - id: micro-behaviors/os/sysinfo/command::batch-date-year-before-2010
      - id: objectives/evasion/self-delete/scripts::text-batch-percent-zero-self-delete
  - id: batch-backdates-clock-and-cleans-scripts
    desc: Batch backdates clock and deletes scripts
    crit: hostile
    conf: 0.92
    size_max: 1024
    all:
      - id: micro-behaviors/os/sysinfo/command::batch-date-year-before-2010
      - id: micro-behaviors/fs/delete/file/command::batch-del-script-target
