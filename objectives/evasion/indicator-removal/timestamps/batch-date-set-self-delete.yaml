defaults:
  platforms: [windows]
  for: [batch, text]
  attack: T1070.006

composite_rules:
  - id: batch-sets-system-date-then-deletes-itself
    desc: Batch sets system date then deletes itself
    crit: hostile
    conf: 0.88
    size_max: 1024
    all:
      - id: micro-behaviors/os/sysinfo/command::batch-date-set-literal
      - id: objectives/evasion/self-delete/scripts::batch-percent-zero-self-delete
  - id: batch-backdates-clock-and-cleans-scripts
    desc: Batch backdates clock and deletes scripts
    crit: hostile
    conf: 0.92
    size_max: 1024
    all:
      - id: micro-behaviors/os/sysinfo/command::batch-date-year-before-2010
      - id: micro-behaviors/fs/delete/file/command::batch-del-script-target
