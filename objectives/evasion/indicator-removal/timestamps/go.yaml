defaults:
  crit: suspicious
  conf: 0.95
  platforms: [windows, linux, macos]
  for: [elf, macho, pe, go]
  attack: T1070.006
traits:
  - id: go-timestomp-change-self-time
    desc: Go timestomping function
    for: [go]
    if:
      type: text
      word: ChangeSelfTime
  - id: go-timestomp-modify-timestamp
    desc: Go timestomping function
    if:
      type: symbol
      exact: modifyTimestamp
  - id: go-timestomp-touch-time
    desc: Go source TouchTime timestamp helper
    for: [go]
    if:
      type: text
      word: TouchTime
    unless:
      - id: well-known/app/productivity/winmerge::winmerge-signed-main-binary
composite_rules:
  - id: go-timestomp
    desc: Go timestomping function
    any:
      - id: go-timestomp-change-self-time
      - id: go-timestomp-modify-timestamp
      - id: go-timestomp-touch-time
