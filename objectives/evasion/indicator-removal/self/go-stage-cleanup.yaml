# Unsigned Go stage loader deletes its autostart Run key entry after execution.
defaults:
  platforms: [windows]
  for: [pe]
  attack: T1070.004,T1112

composite_rules:
  - id: go-staged-loader-registry-cleanup
    desc: Go staged loader deletes autostart key
    crit: hostile
    conf: 0.97
    all:
      - id: micro-behaviors/os/registry/autostart/reference::ansi-run-key-path
      - id: micro-behaviors/os/registry/delete::go-registry-delete-value-reference
      - id: metadata/signature/absent::unsigned-missing-signature-record
    any:
      - id: micro-behaviors/communications/http/get::go-native-http-get-reference
      - id: micro-behaviors/process/inject/runtime/call::remote-process-injection-api-set
      - id: micro-behaviors/mem/combined::remote-process-memory-api-cluster
      - id: micro-behaviors/process/info/thread::thread-context-triple-no-suspend
    unless:
      - id: metadata/signature/verified/
