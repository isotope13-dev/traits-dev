# A stage loader that forks around the execution of a dot-hidden /tmp stage
# and deletes that stage erases its own dropped artifact as it hands off to
# the payload. Ordinary build and install tools also fork, exec and clean
# temporary files, but they neither stage nor run dot-hidden /tmp binaries,
# so the hidden path leg keeps this claim out of their reach.
defaults:
  platforms: [linux, macos]
  for: [elf, macho]
  attack: T1070.004,T1105

composite_rules:
  - id: native-stage-fork-exec-self-delete
    desc: Forked loader runs hidden stage and deletes it
    crit: hostile
    conf: 0.95
    all:
      - id: metadata/binary/symbols/name/process::fork
      - id: metadata/binary/symbols/name/process::c-exec-variants
      - id: metadata/binary/symbols/name/function::remove-binary-symbol
      - id: micro-behaviors/fs/path/hidden::hidden-tmp-dotfile-path
