# Self-cleanup routines that inspect candidate files for a LuaJIT bytecode header
# (\x1bLJ\x01 / \x1bLJ\x02) before unlinking the staged payload from disk.
defaults:
  platforms: [windows, unix]
  for: [lua, python, javascript, typescript]
  attack: T1070.004

traits:
  - id: luajit-bytecode-magic-escape
    desc: Escaped LuaJIT bytecode header (\x1bLJ)
    crit: notable
    conf: 0.95
    for: [source, scripts]
    if:
      type: text
      regex: '(\\x1b|\\027)LJ(\\x0[12]|\\00[12])'

composite_rules:
  - id: luajit-magic-verified-stage-cleanup
    desc: Deletes files matching LuaJIT bytecode magic
    crit: hostile
    conf: 0.97
    near_bytes: 320
    all:
      - id: luajit-bytecode-magic-escape
      - id: micro-behaviors/fs/delete/path::script-file-unlink-call
