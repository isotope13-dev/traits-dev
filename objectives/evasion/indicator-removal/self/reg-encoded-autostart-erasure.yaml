# A .reg script whose Base64 PowerShell, once read back out of the registry
# and run, deletes the Run value that launched it. The stage removes its own
# autostart trace after execution. A legitimate uninstaller removing a Run
# value ships as a plain command, not as encoded data inside the same .reg.
defaults:
  platforms: [windows]
  for: [reg]
  attack: T1070.009,T1112

traits:
  - id: reg-encoded-run-value-delete
    desc: Encoded reg data deletes a Run value
    crit: notable
    conf: 0.92
    if:
      type: encoded
      encoding: base64
      regex: '(?i)reg(\.exe)?\s+delete\s+"?HK\w{0,20}\\[^"\s]{0,60}\\CurrentVersion\\Run"?\s+/v\s'

composite_rules:
  - id: reg-encoded-stage-erases-run-value
    desc: Registry-stored stage deletes its Run value
    crit: hostile
    conf: 0.95
    all:
      - id: metadata/file/format/structured::reg-script-header-and-key-section
      - id: micro-behaviors/os/registry/autostart/reference::windows-run-key-path
      - id: reg-encoded-run-value-delete
      - id: objectives/command-and-control/remote-command/dispatch/eval::registry-encoded-property-read
