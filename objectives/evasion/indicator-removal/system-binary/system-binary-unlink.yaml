defaults:
  platforms: [unix]
  for: [shell]
  crit: suspicious
  attack: T1070.004

composite_rules:
  - id: background-system-binary-delayed-removal
    desc: Background system executable launch followed by delayed binary removal
    conf: 0.95
    near_lines: 4
    all:
      - id: micro-behaviors/process/daemonize/background::system-binary-background-launch
      - id: micro-behaviors/fs/delete/file/command::delayed-system-binary-removal
