defaults:
  platforms: [unix]
  for: [shell]
  attack: T1070.003,T1070.004,T1543
  mbc: F0005,F0007

composite_rules:
  - id: service-binary-swap-history-cleanup
    desc: Stops service to swap downloaded binary, deletes staging, and wipes history
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/communications/http/download/cli/curl-wget::curl-wget-command
      - id: micro-behaviors/os/service/stop/
      - id: micro-behaviors/fs/delete/file/command::rm-force-variable-target
      - id: objectives/evasion/indicator-removal/history/
