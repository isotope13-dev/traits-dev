# Enumerate every wevtapi channel and clear it (T1070.001). Event-log clients
# and bindings (pywin32 win32evtlog, viewers, wevtutil-like tools) import the
# same enumerate/clear APIs beside query/render or export; in binaries that
# read surface separates a client from a channel wiper. Source must show the
# clear call inside the channel-iterator loop instead of mere co-occurrence.
defaults:
  platforms: [windows]
  for: [binaries, source, scripts]
  attack: T1070.001

composite_rules:
  - id: wevtapi-enumerated-channel-wipe
    desc: Enumerates and clears Windows Event Log channels
    crit: hostile
    conf: 0.98
    for: [binaries]
    all:
      - id: micro-behaviors/os/event/log::evt-open-channel-enum
      - id: micro-behaviors/os/event/log::evt-next-channel-path
      - id: micro-behaviors/os/event/log::evt-clear-log
    unless:
      - id: micro-behaviors/os/event/log::evt-event-read-surface
      - id: micro-behaviors/os/event/log::evt-export-log-reference
      - id: micro-behaviors/os/event/log::wevtapi-full-binding-surface

  - id: wevtapi-channel-iterator-clear-loop
    desc: Clears each enumerated event channel in a loop
    crit: hostile
    conf: 0.97
    for: [c, cpp, csharp, python, go, rust, powershell]
    all:
      - id: micro-behaviors/os/event/log::evt-open-channel-enum-call
      - id: micro-behaviors/os/event/log::evt-next-channel-path-call
      - id: micro-behaviors/os/event/log::evt-clear-log-call
    near_lines: 10

  - id: dynamic-wevtapi-channel-wipe
    desc: Dynamically resolves wevtapi APIs to clear event channels
    crit: hostile
    conf: 0.99
    for: [source]
    attack: T1070.001,T1027
    all:
      - id: micro-behaviors/os/event/log::wevtapi-library-reference
      - id: micro-behaviors/os/event/log::evt-open-channel-enum
      - id: micro-behaviors/os/event/log::evt-next-channel-path
      - id: micro-behaviors/os/event/log::evt-clear-log
    any:
      - id: micro-behaviors/dylib/lookup::get-proc-address-source-call
      - id: micro-behaviors/dylib/lookup::get-proc-address-import
    unless:
      - id: micro-behaviors/os/event/log::evt-event-read-surface
      - id: micro-behaviors/os/event/log::evt-export-log-reference
