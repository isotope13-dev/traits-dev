defaults:
  for: [powershell]
  platforms: [windows]
  attack: T1070.001
composite_rules:
  - id: powershell-enumerated-log-clear
    desc: Clears enumerated Windows logs through the global session
    crit: hostile
    conf: 0.96
    near_bytes: 320
    all:
      - id: micro-behaviors/os/event/log::winevent-all-log-pipeline
      - id: micro-behaviors/os/event/log::dotnet-eventlog-session-type
      - id: micro-behaviors/os/event/log::dotnet-global-session-clear-call
      - id: micro-behaviors/os/event/log::clear-current-log-name
