# Anti-forensic truncation and removal of VMware ESXi hypervisor logs.
defaults:
  platforms: [unix]
  for: [elf, macho, c, cpp, go, rust, python, shell, perl]
  attack: T1070.002

composite_rules:
  - id: esxi-hypervisor-log-removal
    desc: ESXi hypervisor log path paired with file truncation or deletion
    crit: suspicious
    conf: 0.92
    all:
      - id: micro-behaviors/fs/path/log/system::esxi-hypervisor-log-path
    any:
      - id: micro-behaviors/fs/file/truncate::file-truncate-capability
      - id: micro-behaviors/fs/delete/path::file-unlink-capability

  - id: esxi-hypervisor-log-truncate-and-unlink
    desc: Truncates and unlinks multiple ESXi hypervisor and audit logs
    crit: hostile
    conf: 0.98
    for: [elf, macho, c, cpp, go, rust, python]
    all:
      - id: micro-behaviors/fs/path/log/system::esxi-vmkernel-log-path
      - id: micro-behaviors/fs/path/log/system::esxi-hostd-vobd-log-path
      - id: micro-behaviors/fs/path/log/system::esxi-shell-log-path
      - id: micro-behaviors/fs/file/truncate::file-truncate-capability
      - id: micro-behaviors/fs/delete/path::file-unlink-capability
