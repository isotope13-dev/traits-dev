# Active appliance log removal and execution-bound command carriers.
defaults:
  platforms:
  - unix
  for:
  - scripts
  - source
  crit: suspicious
  conf: 0.96
  attack: T1070.002
traits:
- id: beyondtrust-vault-audit-removal
  desc: Removes the vault audit log
  platforms:
  - linux
  if:
    type: text
    regex: (?m)^[^#\n]{0,40}\brm\b[^\n;|]{0,80}/home/bomgar/log/bt-secrets\.log
- id: appliance-active-security-log-removal
  desc: Deletes active appliance log through call
  for:
  - shell
  - c
  - cpp
  - python
  - php
  if:
    type: symbol
    kind: call
    regex: ^["']?(/(usr/)?bin/)?rm["']?$|^(os\.)?(unlink|remove)$
    arg:
      regex: ^/ns/log/[\w-]+\.log$
- id: appliance-unquoted-rm-log-target
  desc: Shell rm targets active appliance log
  if:
    type: symbol
    kind: call
    regex: ^(/(usr/)?s?bin/)?rm$
    arg:
      kind: identifier
      name_regex: ^/ns/log/[\w-]+\.log$
  for:
  - shell
- id: appliance-shell-command-log-removal
  desc: Shell command removes active appliance log
  if:
    type: symbol
    kind: call
    regex: ^(/(usr/)?s?bin/)?(ba|z)?sh$
    args:
    - index: 0
      kind: identifier
      name: -c
    - index: 1
      regex: ^\s*(sudo\s+)?rm\s+[^\n;|]{0,64}/ns/log/[\w-]+\.log([\s;"']|$)
  for:
  - shell
- id: appliance-system-command-log-removal
  desc: system() carries appliance log deletion
  if:
    type: symbol
    kind: call
    regex: (^|\.)(system|shell_exec|passthru)$
    arg:
      index: 0
      regex: ^\s*(sudo\s+)?rm\s+[^\n;|]{0,64}/ns/log/[\w-]+\.log([\s;"']|$)
  for:
  - python
  - php
  - ruby
  - c
  - cpp
  - perl
  - lua
- id: appliance-exec-command-log-removal
  desc: Exec API carries appliance log deletion
  if:
    type: symbol
    kind: call
    regex: (^|\.)(exec|execSync|popen)$
    arg:
      index: 0
      regex: ^\s*(sudo\s+)?rm\s+[^\n;|]{0,64}/ns/log/[\w-]+\.log([\s;"']|$)
  for:
  - javascript
  - typescript
  - python
  - ruby
  - php
  - perl
  - java
- id: appliance-subprocess-log-removal
  desc: Subprocess carries appliance log deletion
  if:
    type: symbol
    kind: call
    regex: ^subprocess\.(run|call|Popen)$
    arg:
      index: 0
      from:
        value: ^\s*(sudo\s+)?rm\s+[^\n;|]{0,64}/ns/log/[\w-]+\.log([\s;"']|$)
  for:
  - python
composite_rules:
- id: appliance-active-log-rm-command
  desc: Supplies active appliance log removal command
  any:
  - id: appliance-unquoted-rm-log-target
  - id: appliance-shell-command-log-removal
  - id: appliance-system-command-log-removal
  - id: appliance-exec-command-log-removal
  - id: appliance-subprocess-log-removal
  for:
  - scripts
  - source
  - -rust
  - -go
  - -csharp
  - -swift
  - -objectivec
  - -groovy
  - -kotlin
  - -scala
  - -zig
  - -elixir
  - -clojure
  - -applescript
  - -ircii
