defaults:
  platforms: [windows]
  for: [batch]
  crit: suspicious
  attack: T1070.004
traits:
  - id: batch-defender-support-delete-command
    desc: Deletes Windows Defender support files
    if:
      type: text
      regex: '(?i)\bdel\s+/[fq]\s+/[fq]\s+[^\r\n]{0,50}Windows Defender\\Support\\\*\.\*'
  - id: batch-rdp-log-delete-command
    desc: Deletes Remote Desktop protocol log files
    if:
      type: text
      regex: '(?i)\bdel\s+/[fq]\s+/[fq]\s+[^\r\n]{0,50}System32\\LogFiles\\RDP\*?\\\*\.\*'
