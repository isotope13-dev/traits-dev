defaults:
  crit: suspicious
  platforms:
  - unix
  for:
  - shell
  - python
  - javascript
  - go
  - ruby
  - perl
  - c
  attack: T1070.002
  mbc: F0005

traits:
  - id: sed-inplace-log-line-delete
    desc: In-place sed deletes log lines
    conf: 0.93
    if:
      type: text
      regex: '(?m)^[ \t]*(sudo[ \t]+)?sed\s+-i\S*\s.{0,48}/d[''"]?\s+/var/log/'

