defaults:
  platforms: [unix]
  for: [go, elf, macho]
  attack: T1070.002
  mbc: F0005

traits:
  - id: casaos-binary-path
    desc: CasaOS binary path
    crit: baseline
    conf: 0.96
    if:
      type: path
      substr: /casaos
composite_rules:
  - id: go-recursive-var-log-removal
    for: [go]
    desc: Go recursively removes system log directory
    crit: suspicious
    conf: 0.98
    all:
      - id: micro-behaviors/fs/delete/directory::os-RemoveAll
      - id: micro-behaviors/fs/directory/readdir/target::go-readdir-var-log
    near_bytes: 256
  - id: recursive-var-log-removal-symbols
    desc: Recursive system log removal symbols
    crit: notable
    conf: 0.97
    for: [elf, macho]
    all:
      - id: micro-behaviors/fs/delete/directory::os-RemoveAll-string
      - id: micro-behaviors/fs/path/log/system::var-log-directory-text
    # Keep unrelated Go symbols and a /var/log help entry from combining
    # across a large command catalog.
    near_bytes: 256
