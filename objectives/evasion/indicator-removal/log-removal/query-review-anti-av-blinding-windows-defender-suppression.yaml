defaults:
  attack: T1562.001
  for:
  - pe
  - powershell
  - batch
  - vbs
  platforms:
  - windows

composite_rules:
- id: python-defender-eventlog-clear
  desc: Python script clears Windows Defender event log
  crit: hostile
  conf: 0.99
  for: [python]
  attack: T1562.001,T1070.001
  all:
  - id: objectives/evasion/indicator-removal/logs::python-eventlog-clear-argv
  - id: micro-behaviors/os/event/log::defender-operational-log-channel
  unless:
  - id: metadata/path/directory::test-directory-component
