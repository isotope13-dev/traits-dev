defaults:
  platforms: [linux]
  for: [shell]
  attack: T1195.002,T1105,T1059.004
composite_rules:
  - id: rpm-scriptlet-journal-wipe
    desc: RPM scriptlet vacuums the system journal
    crit: hostile
    conf: 0.98
    scope: leaf
    all:
      - id: metadata/build/package/maintainer-scripts::rpm-install-scriptlet-body
      - id: objectives/evasion/indicator-removal/log-removal::shell-journalctl-vacuum-immediate

