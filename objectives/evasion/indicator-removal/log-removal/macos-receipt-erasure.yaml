defaults:
  platforms: [macos]
  for: [pkg, shell]
  attack: T1070.004

composite_rules:
  - id: macpkg-silent-receipt-catalog-erasure
    desc: Installer hook silently wipes package receipts from system database
    crit: hostile
    conf: 0.98
    scope: archive
    all:
      - id: micro-behaviors/os/package-manager/management::macpkg-receipt-erasure-hook
      - id: micro-behaviors/data/control-flow/error-handling/suppress::shell-failure-suppress-or-true
      - id: micro-behaviors/fs/write/file/redirect::shell-file-output-and-stderr-merge
    unless:
      - id: micro-behaviors/os/package-manager/management::macos-remover-script-path
