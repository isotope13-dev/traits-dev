# A batch script that adds an entire drive to Defender exclusions and clears
# Windows event logs in the same few lines hides activity from both the
# scanner and the event record. Each leg alone has administrative uses, so
# the proximity composite carries the evasion claim.
defaults:
  platforms: [windows]
  for: [batch]
  attack: T1562.001,T1070.001

composite_rules:
  - id: batch-defender-drive-exclusion-log-wipe
    desc: Batch excludes a whole drive from Defender and clears event logs
    crit: hostile
    conf: 0.96
    near_lines: 10
    all:
      - id: objectives/evasion/anti-av/platform/defender::defender-whole-drive-exclusion
      - id: micro-behaviors/os/event/log::wevtutil-clear-log-command
