defaults:
  platforms: [unix]
  for: [shell]
  attack: T1070.002

traits:
  - id: shell-auth-lastlog-clear-pair
    desc: Clears auth.log together with lastlog
    crit: suspicious
    conf: 0.92
    if:
      type: text
      regex: '/var/log/auth\.log[\s\S]{0,220}/var/log/lastlog'
    unless:
      # An image provisioner uninstalls the build-time package, then empties
      # auth.log, wtmp, and lastlog so the builder's login is not published
      # in the image.
      - id: image-login-accounting-scrub
  - id: shell-journalctl-vacuum-immediate
    desc: Vacuums the entire systemd journal
    crit: notable
    conf: 0.9
    if:
      type: text
      substr: journalctl --vacuum-time=1s

  - id: login-accounting-truncate-trio
    desc: Truncates auth, wtmp, and lastlog
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: 'auth\.log[^\n]{0,24}\n[^\n]{0,32}wtmp[^\n]{0,24}\n[^\n]{0,32}lastlog'
composite_rules:
  - id: image-login-accounting-scrub
    desc: Image build clears login accounting
    crit: exception
    conf: 0.93
    near_lines: 40
    all:
      - id: login-accounting-truncate-trio
      - id: micro-behaviors/os/package-manager/install::pip-uninstall
  - id: shell-multi-log-and-history-wipe
    desc: Shell wipes auth logs, shell history and the journal
    crit: hostile
    conf: 0.98
    all:
      - id: objectives/evasion/indicator-removal/history::shell-mass-bash-history-truncate
      - id: shell-auth-lastlog-clear-pair
      - id: shell-journalctl-vacuum-immediate
