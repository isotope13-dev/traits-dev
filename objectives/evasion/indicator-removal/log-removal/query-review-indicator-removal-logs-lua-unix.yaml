defaults:
  platforms:
  - unix
  - fortios
  for:
  - lua
  attack: T1070.002

composite_rules:
  - id: lua-unix-log-truncate
    desc: Lua truncates Unix logs
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/fs/path/log/system::lua-var-log-paths
      - id: micro-behaviors/fs/write/file/handle::lua-open-write-mode
