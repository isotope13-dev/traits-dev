# AI-agent settings that intentionally reduce local forensic visibility are
# only hostile when paired with the offensive autonomous workflow. The atomic
# setting remains in the agent capability directory so its matcher describes
# exactly what it finds.
defaults:
  platforms: [windows, unix]
  for: [python, javascript, typescript, shell, powershell, go, rust, java, json]
  attack: T1070.003

composite_rules:
  - id: unattended-offensive-agent-suppresses-response-storage
    desc: Unattended offensive agent suppresses model response storage
    crit: hostile
    conf: 0.97
    attack: T1070.003,T1059,T1190
    all:
      - id: objectives/execution/automation/agent::agent-unattended-execution-mode
      - id: objectives/execution/automation/agent::agent-exploit-tasking
      - id: objectives/execution/automation/agent::public-exploit-acquisition
      - id: micro-behaviors/process/create/agent::ai-agent-response-storage-disabled
      - id: micro-behaviors/process/create/exec::cross-language-process-execution
    near_lines: 96
