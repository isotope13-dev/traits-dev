# Removing only the operator's own traces rather than wiping a log wholesale:
# an in-place sed delete keyed to the request pattern that got them in, or a
# log path pointed at /dev/null so writes are discarded while the file still
# appears to exist. Both leave the log present and plausible, which is the
# point — a truncated or missing log is itself an alert.
defaults:
  platforms: [unix]
  for: [shell, python, javascript, go, ruby, perl, c]
  attack: T1070.002
  mbc: F0005

traits:
  - id: sed-inplace-log-line-delete
    desc: In-place sed deletes log lines
    crit: suspicious
    conf: 0.93
    if:
      type: text
      regex: '(?m)^[ \t]*(sudo[ \t]+)?sed\s+-i\S*\s.{0,48}/d[''"]?\s+/var/log/'

  - id: log-path-symlinked-to-devnull
    desc: Log path symlinked to /dev/null
    crit: suspicious
    conf: 0.92
    if:
      type: text
      regex: 'symlink\s*\(\s*["'']/dev/null["''][^)]{0,40}log'

  - id: log-path-linked-to-devnull-shell
    desc: Shell links a log path to /dev/null
    crit: suspicious
    conf: 0.92
    if:
      type: text
      regex: 'ln\s+-s\S*\s+/dev/null\s+\S{0,56}log'
