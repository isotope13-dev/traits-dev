defaults:
  platforms: [unix, netbsd]
  for: [shell]
  attack: T1070.002

composite_rules:
  - id: shell-history-authlog-clear
    desc: Shell removes history and truncates system logs
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/fs/path/personal::zsh-history-path
      - id: var-log-auth
      - id: shell-history-file-removal
      - id: shell-find-truncate-logs
    unless:
      - id: well-known/app/utility/cmdchamp/
