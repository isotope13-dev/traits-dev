defaults:
  platforms: [unix]
  for: [ruby]
  attack: T1070.002

traits:
  - id: ruby-file-truncate-zero
    desc: Ruby truncates a log path to zero
    crit: suspicious
    conf: 0.92
    if:
      type: text
      substr: File.truncate(log_path, 0)
  - id: ruby-log-write-empty
    desc: Ruby empties a file under /var/log
    crit: suspicious
    conf: 0.92
    if:
      type: text
      regex: 'File\.write\(\s*[''"]/var/log/[^,\n]{1,80}[''"]\s*,\s*[''"]{2}\s*\)'

composite_rules:
  - id: ruby-freebsd-log-truncation
    desc: Ruby truncates Unix logs
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/fs/path/log/system::four-var-log-path-references
    any:
      - id: ruby-file-truncate-zero
      - id: ruby-log-write-empty
