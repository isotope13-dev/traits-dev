defaults:
  platforms: [linux]
  for: [javascript]
  attack: T1070.001

traits:
  - id: javascript-journal-vacuum
    desc: JavaScript vacuums the system journal
    crit: suspicious
    conf: 0.94
    if:
      type: text
      regex: '["''](/usr/bin/)?journalctl["'']\s*,\s*\[\s*["'']--vacuum-time=1s["'']'
      exclude_comments: true
