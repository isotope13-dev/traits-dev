defaults:
  platforms: [linux]
  for: [elf]
  attack: T1070.001,T1070.003

traits:
  - id: home-shell-history-removal
    desc: Removes HOME shell history
    crit: suspicious
    conf: 0.98
    if:
      type: text
      regex: '(?i)\brm\s+-f\s+["]?\$HOME/\.bash_history\b'

  - id: package-log-removal
    desc: Removes apt/yum package logs
    crit: suspicious
    conf: 0.98
    if:
      type: text
      regex: '(?i)\brm\s+-f\b[^\n]{0,180}/var/tmp/(apt|yum)\.log\b'

composite_rules:
  - id: native-history-and-login-log-wipe
    # login-record-file-deletion (objectives/evasion/indicator-removal/accounting)
    # is scoped to [scripts] and structurally cannot match Elf (ft-impossible).
    # login-accounting-files-binary is the ELF-scoped sibling used by
    # accounting/elf.yaml's own elf-login-accounting-rewrite for the same
    # compiled-binary case: it recognizes the utmp/wtmp/btmp path references a
    # native log-wiper embeds, corroborating the shell-history removal string.
    desc: Erases shell and login history
    crit: hostile
    conf: 0.995
    mbc: F0005
    all:
      - id: shell-history-file-removal
      - id: micro-behaviors/fs/path/log/accounting::login-accounting-files-binary

  - id: native-history-and-package-log-wipe
    desc: Erases shell history and package logs
    crit: hostile
    conf: 0.99
    mbc: F0005
    all:
      - id: home-shell-history-removal
      - id: package-log-removal
