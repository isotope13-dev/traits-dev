defaults:
  platforms: [junos, appliance, unix]
  for: [shell]
  attack: T1070.001

traits:
  - id: shell-junos-log-clear-set
    desc: Shell clears Junos log set
    crit: suspicious
    conf: 0.94
    if:
      type: text
      regex: '/var/log/messages[\s\S]{0,120}/var/log/syslog[\s\S]{0,120}/var/log/auth\.log'
    unless:
      # Diagnostic collectors tail standard logs into report files; not clearing.
      - type: text
        regex: '\btail\s+(-[a-zA-Z]+\s+)*[0-9]+\s+["'']?\$?(?:logfile|/var/log/)'
      - type: text
        regex: 'safe_exec\s+"[^"]+/logs/[^"]+"\s+tail\b'
  - id: shell-find-truncate-logs
    desc: Shell find truncates log files
    crit: suspicious
    conf: 0.92
    if:
      type: text
      regex: 'find /var/log[\s\S]{0,120}truncate -s 0'
    unless:
      - id: metadata/build/package/maintainer-scripts::cloud-marketplace-cleanup-script
      # Image-minimization cleanup scripts truncate build-time logs to shrink
      # the shipped image (bento/packer `*-cleanup.sh`); the basename alone
      # already establishes the file's job. Same suppression the
      # history-clearing sibling `histsize-zero` carries.
      - id: metadata/build/package/maintainer-scripts::cloud-marketplace-cleanup-path
      # System-maintenance scripts clean package-manager caches beside
      # rotating logs; cache cleaning frees disk and never hides activity,
      # so the truncation alongside it is maintenance, not anti-forensics.
      - id: micro-behaviors/os/package-manager/management::package-manager-cache-clean-command
      # Disk-reclamation scripts can clear disposable logs together with
      # configured container-image cleanup and swap disable operations.
      - type: text
        regex: '(?s)CLEAN_LOGS.*df.*docker system prune.*swapoff'

composite_rules:
  - id: shell-junos-log-clearing
    desc: Shell Junos log clearing
    crit: hostile
    conf: 0.96
    all:
      - id: shell-junos-log-clear-set
      - id: shell-find-truncate-logs
