defaults:
  platforms: [windows]
  for: [batch]
  attack: T1070.001

traits:
  - id: batch-windows-wevtutil-clear
    desc: Batch script clears Security or Application logs
    crit: suspicious
    conf: 0.94
    if:
      type: text
      regex: 'wevtutil cl (Security|Application)'

  - id: batch-windows-eventlog-disable
    desc: Batch disables the Windows Event Log service
    crit: suspicious
    conf: 0.94
    if:
      type: text
      substr: sc config eventlog start= disabled

composite_rules:
  - id: batch-windows-log-clear-disable
    desc: Batch clears logs and disables the Event Log service
    crit: hostile
    conf: 0.98
    all:
      - id: batch-windows-wevtutil-clear
      - id: batch-windows-eventlog-disable

  - id: batch-windows-log-history-removal
    desc: Batch clears logs and references console history
    crit: hostile
    conf: 0.98
    all:
      - id: batch-windows-wevtutil-clear
      - id: micro-behaviors/fs/path/personal::consolehost-history-reference
