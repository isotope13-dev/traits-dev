# A Ruby script lists system logs together with login accounting records or
# shell history and truncates each entry to zero bytes.
defaults:
  for: [ruby]
  platforms: [unix]
  attack: T1070.002

composite_rules:
  - id: ruby-system-log-and-history-truncation
    desc: Empties system logs and login records
    crit: hostile
    conf: 0.96
    all:
      - id: micro-behaviors/fs/path/log/system::four-var-log-path-references
      - id: micro-behaviors/fs/write/file/content::ruby-file-write-empty-string
    any:
      - id: micro-behaviors/fs/path/log/accounting::wtmp-log-path-text
      - id: micro-behaviors/fs/path/log/accounting::btmp-log-path-text
      - id: micro-behaviors/fs/path/activity-history::bash-zsh-history-path-text
