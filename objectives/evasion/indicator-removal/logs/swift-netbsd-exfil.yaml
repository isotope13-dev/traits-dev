defaults:
  platforms: [freebsd, netbsd, unix]
  for: [swift]
  attack: T1041

composite_rules:
  - id: swift-log-clear-exfil
    desc: Log wipe paired with an exfil URL
    crit: hostile
    conf: 0.96
    all:
      - id: swift-netbsd-log-list
      - id: objectives/exfiltration/http/collect::rust-exfil-path-marker
      - id: micro-behaviors/communications/http/post::swift-urlsession-data-task
