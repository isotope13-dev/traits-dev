# Reflection that zeros EventProvider.m_enabled on PSEtwLogProvider, the
# standard ScriptBlock logging disable used by PowerShell implants.
defaults:
  platforms: [windows]
  for: [powershell, text]
  attack: T1562.002
  mbc: E1562

traits:
  - id: psetwlogprovider-type
    desc: PSEtwLogProvider type token
    crit: notable
    conf: 0.94
    if:
      type: text
      word: PSEtwLogProvider
  - id: etw-provider-enabled-field
    desc: ETW provider m_enabled field
    crit: notable
    conf: 0.9
    if:
      type: text
      substr: m_enabled
  - id: etwprovider-static-field
    desc: ETW provider static field token
    crit: notable
    conf: 0.9
    if:
      type: text
      word: etwProvider

composite_rules:
  - id: powershell-etw-log-provider-disable
    desc: Disables PSEtwLogProvider via m_enabled
    crit: hostile
    conf: 0.97
    all:
      - id: psetwlogprovider-type
      - id: etw-provider-enabled-field
  - id: powershell-etwprovider-field-disable
    desc: Disables ETW provider via etwProvider
    crit: hostile
    conf: 0.96
    all:
      - id: psetwlogprovider-type
      - id: etwprovider-static-field
  - id: powershell-etw-m-enabled-zero
    desc: Zeros ETW m_enabled through etwProvider
    crit: hostile
    conf: 0.95
    all:
      - id: etw-provider-enabled-field
      - id: etwprovider-static-field
