defaults:
  platforms:
    - unix
    - android
    - ios
  for:
    - shell
traits:
  - id: var-log-lastlog
    desc: /var/log/lastlog last login
    crit: suspicious
    conf: 0.7
    if:
      type: string_literal
      exact: /var/log/lastlog
  - id: var-log-auth
    desc: /var/log/auth authentication log
    crit: notable
    conf: 0.7
    if:
      type: text
      substr: /var/log/auth
  - id: var-log-cron
    desc: /var/log/cron cron log
    crit: notable
    conf: 0.7
    if:
      type: text
      substr: /var/log/cron
  - id: empty-echo-truncate-var-log
    desc: Empty echo truncates system log
    crit: suspicious
    conf: 0.9
    mbc: F0005
    attack: T1070.001
    if:
      type: text
      regex: '(?m)^\s*echo\s+(-n\s+)?(["'']{2})?\s*>\s*/var/log/'
    unless:
      - id: well-known/tool/development/observability/datadog-system-tests::system-tests-path
  - id: echo-redirect-var-spool
    desc: echo overwrite to /var/spool
    crit: suspicious
    conf: 0.9
    mbc: F0005
    attack: T1070.001
    if:
      type: text
      regex: echo\s+\S+\s*>\s*/var/spool/
  - id: redirect-var-log
    desc: '>/var/log/ redirect to log file'
    crit: suspicious
    conf: 0.85
    mbc: F0005
    attack: T1070.001
    if:
      type: text
      regex: '(^|\n)>\s*/var/log/(auth|secure|syslog)\b'
  - id: history-c
    desc: history -c clear history command
    crit: suspicious
    conf: 0.85
    mbc: F0005
    attack: T1070.003
    if:
      type: string_literal
      substr: history -c
    unless:
      - id: well-known/app/utility/cmdchamp/
      - id: metadata/build/package/maintainer-scripts::cloud-marketplace-cleanup-script
      - id: metadata/file/extension/identity::markdown-file-basename
  - id: history-clear-call
    desc: Shell clears command history
    crit: suspicious
    conf: 0.94
    mbc: F0005
    attack: T1070.003
    if:
      type: symbol
      kind: call
      exact: history
      arg:
        kind: identifier
        name: -c
    unless:
      - id: metadata/build/package/maintainer-scripts::cloud-marketplace-cleanup-script
      - id: well-known/app/infrastructure/dokku::dokku-source-tree
      - id: well-known/app/utility/cmdchamp/
      - id: metadata/package/testing/harness/fixture::shell-spec-case-file-context
      - type: path
        regex: '(^|[\/])(vagrant|packer)[\/]'
      # `history -c` immediately re-seeded with `history -s <value>` is the
      # readline prompt-suggestion idiom (clear the in-session list, push the
      # current default so UP-arrow offers it). Slackware/Gentoo superadduser
      # uses it at its interactive group prompt; nothing is written to any
      # history file, so no evidence is removed. Disk-wiping forgers pair
      # `history -c && history -w`, which does not match this pattern and
      # stays covered by rust-panos-history-clear.
      - type: text
        regex: 'history\s+-c[\s\S]{0,16}history\s+-s\b'
      # Image-prep scripts run cloud-init clean and then drop the build
      # shell's history so a clone does not inherit it. That is template
      # hygiene, not removal of intrusion evidence.
      - type: text
        regex: 'cloud-init\s+clean[\s\S]{0,600}history\s+-c'
  # `history -r` used to sit beside these as a suspicious indicator-removal
  # trait. It REMOVES nothing — it reads the history file back into the
  # session — and its own description said "reload history command". What it
  # actually matches is the standard share-history-across-terminals idiom,
  # `PROMPT_COMMAND="history -a;history -r"`, used by byobu, oh-my-bash,
  # bash-it and countless dotfiles; byobu's autolaunch snippet scored
  # anti-forensics on it. Every real form of history destruction is still
  # covered here by history-c and unset-histfile.
  - id: unset-histfile
    desc: unset HISTFILE command
    crit: suspicious
    conf: 0.85
    mbc: F0005
    attack: T1070.003
    if:
      type: string_literal
      substr: unset HISTFILE
  - id: truncate-var-log
    desc: truncate /var/log command
    crit: suspicious
    conf: 0.9
    mbc: F0005
    attack: T1070.001
    if:
      type: text
      regex: truncate\s+(-s\s*0\s+)?/var/log
    unless:
      # Provisioning initializes an app-owned log right before the service's
      # first write: create it, truncate-to-empty, chown it to the service
      # user (GCE startup scripts). Anti-forensics clears system logs
      # instead and does not re-create and re-own the file.
      - type: text
        regex: 'touch\s+/var/log/\S+[\s\S]{0,120}truncate\s+-s0?\s+/var/log/[^;]{0,60}chown\s'
      # A provisioning script that creates its own log directory
      # (`mkdir -p /var/log/traefik`) and later empties a log inside it is
      # managing an app log it owns. Wiping evidence targets system logs.
      - id: app-owned-log-directory-truncate
      # Test harnesses empty the log they are about to assert on.
      - id: metadata/package/testing/presence/harness::test-directory
      - id: objectives/evasion/indicator-removal/log-removal::image-login-accounting-scrub
  - id: audit-account-gid-suppression-source
    desc: Suppresses audit events for a selected GID
    crit: suspicious
    conf: 0.99
    attack: T1070.002
    for: [c, cpp]
    if:
      type: text
      regex: 'audit_log_acct_message[\s\S]{0,500}SYS_GETGID[\s\S]{0,60}return\s+0'
  # The two halves of an app that manages a log it owns: it creates the
  # `/var/log/<app>/` directory, and later empties a file inside one.
  - id: var-log-subdir-created
    desc: Creates a /var/log application subdirectory
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: 'mkdir\s+(-p\s+)?/var/log/\w+'
  - id: var-log-subdir-truncated
    desc: Truncates a log inside a /var/log subdirectory
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: 'truncate\s+(-s\s*0\s+)?/var/log/\w+/'
composite_rules:
  - id: app-owned-log-directory-truncate
    desc: Script empties a log in a directory it created
    crit: exception
    all:
      - id: var-log-subdir-created
      - id: var-log-subdir-truncated
  - id: system-log
    desc: Reference to system log file
    crit: notable
    conf: 0.66
    any:
      - id: micro-behaviors/fs/path/log/accounting::multiple-log-files
      - id: var-log-lastlog
      - id: var-log-auth
      - id: micro-behaviors/fs/path/log/system::log-var
      - id: var-log-cron
    unless:
      - id: well-known/app/utility/cmdchamp/
      - id: metadata/build/package/maintainer-scripts::cloud-marketplace-cleanup-script
      - id: well-known/app/infrastructure/dokku::dokku-source-tree
      - id: well-known/tool/sysadmin/server-guardian-mcp/
  - id: log-clear
    desc: System log clearing
    crit: suspicious
    conf: 0.65
    any:
      - id: redirect-var-log
      - id: empty-echo-truncate-var-log
      - id: echo-redirect-var-spool
      - id: history-c
      - id: unset-histfile
      - id: truncate-var-log
    unless:
      - id: well-known/app/utility/cmdchamp/
  - id: multi-log-wipe
    desc: Overwrites multiple log files
    crit: suspicious
    conf: 0.95
    mbc: F0005
    attack: T1070.001
    all:
      - id: log-clear
    unless:
      - id: metadata/build/package/maintainer-scripts::cloud-marketplace-cleanup-script
      - id: well-known/app/utility/cmdchamp/
    needs: 2
    any:
      - id: micro-behaviors/fs/path/log/accounting::multiple-log-files
      - id: var-log-lastlog
      - id: var-log-auth
      - id: micro-behaviors/fs/path/log/system::log-var
      - id: var-log-cron

  - id: downloaded-payload-history-clear
    desc: Downloaded payload clears shell history
    crit: hostile
    conf: 0.995
    attack: "T1105,T1070.003"
    near_bytes: 256
    all:
      - id: micro-behaviors/process/create/local-exec::raw-ip-redirected-download-chmod-exec
      - id: history-clear-call

  - id: audit-account-event-suppression-hook
    desc: Interposed libaudit hook drops account events for a selected GID
    crit: hostile
    conf: 0.995
    attack: T1070.002
    for: [c, cpp]
    all:
      - id: audit-account-gid-suppression-source
      - id: micro-behaviors/dylib/lookup::rtld-next-source
