defaults:
  platforms: [windows]
  for: [pe, dll]
  arch: [x86]
composite_rules:
  # ClearEventLog(handle, NULL), then CloseEventLog(handle), in the native
  # byte-command implant. The API names alone do not establish tampering.
  - id: native-byte-control-eventlog-cleanup
    desc: Native capture implant with event-log clear and handle-call code
    crit: hostile
    conf: 0.98
    attack: T1070.001
    all:
      - id: objectives/command-and-control/remote-command/tasking::native-byte-dispatch-capture-implant
      - id: metadata/binary/instruction::x86-null-and-repeated-esi-call-pair
      - id: micro-behaviors/os/event/log::open-event-log-import
