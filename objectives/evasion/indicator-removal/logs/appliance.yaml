defaults:
  platforms: [unix]
  for: [scripts, source]
  crit: suspicious
  conf: 0.96
  attack: T1070.002

traits:
  - id: beyondtrust-vault-audit-removal
    desc: Removes the vault audit log
    platforms: [linux]
    # Shell scripts run the rm directly. A quoted sh -c payload contains the
    # same command as text. A leading hash keeps comment lines out.
    if:
      type: text
      regex: '(?m)^[^#\n]{0,40}\brm\b[^\n;|]{0,80}/home/bomgar/log/bt-secrets\.log'

  - id: appliance-active-security-log-removal
    desc: Deletes active appliance log through call
    for: [shell, c, cpp, python, php]
    # Bind the deletion action to its target, excluding comments, read-only
    # access and unrelated collection.remove calls. Covers shell rm as well
    # as POSIX/Python/PHP unlink/remove without implant-specific names.
    if:
      type: symbol
      kind: call
      regex: '^["'']?(/(usr/)?bin/)?rm["'']?$|^(os\.)?(unlink|remove)$'
      arg:
        regex: '^/ns/log/[\w-]+\.log$'

  - id: appliance-active-log-rm-command
    desc: Command string removes active appliance log
    # Match active logs, including ssl, proto-handler and php-fpm logs from
    # the published command. Require a complete .log target; rotated logs
    # alone and similarly named non-log files do not establish this action.
    # Parsed literals cover sh -c and commands carried by other languages;
    # comments cannot supply this evidence.
    if:
      type: literal
      exclude_docstrings: true
      regex: '^\s*(sudo\s+)?rm\s+[^\n;|]{0,64}/ns/log/[\w-]+\.log([\s;"'']|$)'

