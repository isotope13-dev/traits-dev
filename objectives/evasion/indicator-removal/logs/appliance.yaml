defaults:
  platforms: [unix]
  for: [scripts, source]
  crit: suspicious
  conf: 0.96
  attack: T1070.002

traits:
  - id: beyondtrust-vault-audit-removal
    desc: Vault audit-log removal in command string
    platforms: [linux]
    # The recovered cleanup is a sh -c argument. Parsed command buffers also
    # cover other language carriers without treating shell comments as code.
    if:
      type: literal
      regex: '\brm\b[^\n;|]{0,96}/home/bomgar/log/bt-secrets\.log([\s;"'']|$)'

  - id: appliance-active-security-log-removal
    desc: Removes active appliance security logs
    if:
      type: text
      regex: '\brm\b[^\n;|]{0,64}/ns/log/(auth|http-access)\.log([\s;"'']|$)'
