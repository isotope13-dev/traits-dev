defaults:
  platforms: [unix]
  for: [scripts, source]
  crit: suspicious
  conf: 0.96
  attack: T1070.002

traits:
  - id: beyondtrust-vault-audit-removal
    desc: Removes the vault audit log
    platforms: [linux]
    # Shell scripts run the rm directly. A quoted sh -c payload contains the
    # same command as text. A leading hash keeps comment lines out.
    if:
      type: text
      regex: '(?m)^[^#\n]{0,40}\brm\b[^\n;|]{0,80}/home/bomgar/log/bt-secrets\.log'

  - id: appliance-active-security-log-removal
    desc: Removes active appliance security logs
    if:
      type: text
      regex: '\brm\b[^\n;|]{0,64}/ns/log/(auth|http-access)\.log([\s;"'']|$)'
