defaults:
  platforms: [unix]
  for: [shell]
  crit: suspicious
traits:
  - id: shell-operator-selected-log-redaction
    desc: Removes operator-selected lines from system logs
    conf: 0.98
    attack: T1070.002
    if:
      type: tree-sitter
      language: shell
      query: |
        ((for_statement body: (do_group
           (redirected_statement
             body: (command name: (command_name) @filter
               argument: (word) @flag argument: (_) @selection argument: (_) @log)
             redirect: (file_redirect ">" destination: (_) @temporary))
           (command name: (command_name) @replace argument: (word) @move_flag
             argument: (_) @saved argument: (_) @destination)))
         (#eq? @filter "grep") (#eq? @flag "-v")
         (#match? @selection "^\"?\\$(\\{[1-9]\\}|[1-9])\"?$")
         (#match? @log "^[\"']?/var/log/")
         (#eq? @replace "mv") (#eq? @move_flag "-f")
         (#eq? @log @destination) (#eq? @temporary @saved))
