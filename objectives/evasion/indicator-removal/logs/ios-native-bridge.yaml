traits:
  - id: apple-diagnostic-log-deletion
    desc: Deletes Apple diagnostic-log path
    crit: suspicious
    conf: 0.95
    platforms: [ios, macos]
    for: [objectivec, python, c, cpp, javascript, typescript]
    attack: T1070.004
    # Bind the target to the deletion call. Reading a log beside unrelated
    # cache cleanup must not be classified as log removal.
    if:
      type: symbol
      kind: call
      regex: '(^|\.)(deleteFileAtPath|unlink(Sync)?|remove(Item)?)$'
      arg:
        regex: '^(/private)?/var/(mobile/Library/Logs/CrashReporter/|log/com\.apple\.xpc\.launchd/)'
