composite_rules:
  - id: ios-crash-report-native-deletion
    desc: iOS crash-report path near native file deletion
    crit: suspicious
    conf: 0.95
    platforms: [ios, macos]
    for: [javascript, typescript, html]
    attack: T1070.004
    near_bytes: 700
    all:
      - id: micro-behaviors/fs/path/log/system::ios-crash-report-directory
      - id: micro-behaviors/fs/delete/file/library::native-bridge-delete-file-at-path
