defaults:
  attack: "T1070.001"
  mbc: "F0005"
  for: [pe, dll, c, cpp]
  platforms: [windows]
traits:
- id: fsctl-delete-usn-journal--rx-1
  desc: Regex component marker
  crit: component
  conf: 0.96
  if:
    type: text
    substr: FSCTL_DELETE_USN_JOURNAL
  count_max: 1020156
- id: fsctl-delete-usn-journal--rx-2
  desc: Regex component marker
  crit: component
  conf: 0.96
  if:
    type: text
    substr: USN_DELETE_FLAG_DELETE
  count_max: 1020157
- id: fsctl-delete-usn-journal--rx-3
  desc: Regex component marker
  crit: component
  conf: 0.96
  if:
    type: text
    substr: DeleteUsnJournalData
  count_max: 1020158
composite_rules:
- id: clear-windows-event-logs-native
  desc: Clear Windows event logs natively
  crit: suspicious
  conf: 0.97
  all:
  - id: micro-behaviors/os/event/log::event-log-clear
  - id: micro-behaviors/os/event/log::event-log-open
  unless:
  - id: well-known/lib/platform/microsoft-imagehlp::microsoft-debug-helper-dll
  - id: well-known/lib/platform/wine/
  downgrade:
    any:
    - id: metadata/lang/source/
- id: native-usn-journal-clearing
  desc: Clears NTFS change journal natively
  crit: suspicious
  conf: 0.97
  attack: "T1070.004"
  all:
  - id: fsctl-delete-usn-journal
  - id: micro-behaviors/fs/file/handle::device-io-control-win
  unless:
  - id: well-known/app/utility/everything::verified-everything-app-identity
- id: fsctl-delete-usn-journal
  desc: Deletes NTFS change journal
  crit: suspicious
  conf: 0.96
  attack: "T1070.004"
  any:
  - id: fsctl-delete-usn-journal--rx-1
  - id: fsctl-delete-usn-journal--rx-2
  - id: fsctl-delete-usn-journal--rx-3
  unless:
  - id: well-known/app/utility/everything::verified-everything-app-identity
