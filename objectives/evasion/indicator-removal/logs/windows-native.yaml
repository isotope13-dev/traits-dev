# A diagnostic control-code name does not issue a deletion request.
defaults:
  platforms: [windows]
  for: [scripts, source, binaries]
composite_rules:
  - id: fsctl-delete-usn-journal
    desc: Explicit NTFS journal deletion request
    crit: suspicious
    conf: 0.97
    attack: T1070.004
    any:
      - id: micro-behaviors/fs/delete/journal::device-io-usn-delete-name
      - id: micro-behaviors/fs/delete/journal::device-io-usn-delete-code
      - id: micro-behaviors/fs/delete/journal::native-fs-usn-delete-name
      - id: micro-behaviors/fs/delete/journal::native-fs-usn-delete-code
      - id: micro-behaviors/fs/delete/file/command::fsutil-usn-deletejournal
    unless:
      - id: metadata/package/testing/presence/corpus::binary-test-fixture-member
      - id: micro-behaviors/process/create/shell/guard/
      - id: metadata/filename/name-form::sha256-hex-basename
