defaults:
  attack: T1070.001
  mbc: F0005
  platforms: [windows]
  for:
    - powershell
    - batch
    - c
    - cpp
    - pe
    - dll
traits:
  - id: btr-delete-call-action-one
    desc: BTR delete action constructor
    crit: component
    conf: 0.94
    for: [c, cpp, csharp, go, rust, python]
    if:
      type: text
      regex: '(?i)\b(ConstructItem|append_btr_action)\s*\(\s*1\b'

  - id: btr-serialized-bootclean-delete
    desc: Serialized BTR BootClean delete action
    crit: component
    conf: 0.98
    for: [scripts, powershell, batch]
    if:
      type: text
      regex: '(?i)[''"'']1\|\\SystemRoot\\Temp\\BootClean\.log'

  - id: wevtutil-cl
    desc: wevtutil cl command
    crit: suspicious
    conf: 0.9
    if:
      type: text
      regex: '(?i)\bwevtutil(\.exe)?\s+cl\b'
    unless:
      - id: metadata/build/docker::windows-container-agent-image-marker
  - id: clear-eventlog
    desc: Clear-EventLog cmdlet
    crit: suspicious
    conf: 0.56
    for: [powershell]
    if:
      type: text
      substr: Clear-EventLog
    unless:
      - id: well-known/tool/detection/owasp-modsecurity-crs::owasp-crs-powershell-catalog-context
      - id: well-known/app/utility/quicklook::release-path
      # Ansible's win_eventlog module manages event logs, clearing included.
      - id: well-known/app/infrastructure/ansible::ansible-module-source-context
  - id: fsutil-usn-deletejournal
    desc: Deletes NTFS USN change journal with fsutil
    crit: suspicious
    conf: 0.97
    attack: T1070.004
    if:
      type: text
      regex: '(?i)\bfsutil(\.exe)?\s+usn\s+deletejournal\s+/(D|N)\s+[A-Z]:'

  - id: python-eventlog-clear-argv
    desc: Python wevtutil event-log clear
    crit: suspicious
    conf: 0.98
    for: [python]
    if:
      type: text
      regex: '(?i)["'']wevtutil["'']\s*,\s*["'']cl["'']'
composite_rules:
  - id: btr-bootclean-log-removal
    desc: Deletes the BTR driver log from its own kernel transaction
    crit: hostile
    conf: 0.99
    for: [binaries, scripts, c, cpp, csharp, powershell, batch, go, rust, python]
    attack: T1070.001,T1562.001
    all:
      - id: objectives/impact/degrade/edr/teardown::btr-remediation-driver-manual-staging
      - id: well-known/app/security/defender::btr-bootclean-log-path
    any:
      - id: btr-delete-call-action-one
      - id: btr-serialized-bootclean-delete

  - id: log-clear-windows
    desc: Clear Windows event logs
    crit: suspicious
    conf: 0.66
    any:
      - id: wevtutil-cl
      - id: clear-eventlog

  - id: python-downloaded-stage-eventlog-clear
    desc: Python downloaded-stage package clears Windows event logs
    crit: hostile
    conf: 0.99
    for: [whl, python-sdist]
    scope: archive
    attack: T1195.002,T1105,T1070.001
    all:
      - id: objectives/command-and-control/dropper/staging/stager::python-remote-asset-config
      - id: micro-behaviors/communications/http/lib/urllib::urlopen-response-body-read
      - id: python-eventlog-clear-argv
