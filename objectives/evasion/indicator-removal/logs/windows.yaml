defaults:
  attack: T1070.001
  mbc: F0005
  platforms: [windows]
  for:
    - powershell
    - batch
    - c
    - cpp
    - pe
    - dll
traits:
  - id: btr-delete-call-action-one
    desc: BTR delete action constructor
    crit: notable
    conf: 0.94
    for: [c, cpp, csharp, go, rust, python]
    if:
      type: text
      regex: '(?i)\b(ConstructItem|append_btr_action)\s*\(\s*1\b'

  - id: btr-serialized-bootclean-delete
    desc: Serialized BTR BootClean delete action
    crit: notable
    conf: 0.98
    for: [scripts, powershell, batch]
    if:
      type: text
      regex: '(?i)[''"'']1\|\\SystemRoot\\Temp\\BootClean\.log'

  - id: python-eventlog-clear-argv
    desc: Python wevtutil event-log clear
    crit: suspicious
    conf: 0.98
    for: [python]
    if:
      type: text
      regex: '(?i)["'']wevtutil["'']\s*,\s*["'']cl["'']'
composite_rules:
  - id: btr-bootclean-log-removal
    desc: Deletes the BTR driver log from its own kernel transaction
    crit: hostile
    conf: 0.99
    for: [binaries, scripts, c, cpp, csharp, powershell, batch, go, rust, python]
    attack: T1070.001,T1562.001
    all:
      - id: objectives/impact/degrade/edr/driver::btr-remediation-driver-manual-staging
      - id: well-known/app/security/defender::btr-bootclean-log-path
    any:
      - id: btr-delete-call-action-one
      - id: btr-serialized-bootclean-delete

  - id: remote-thread-injector-clears-event-logs
    desc: Remote-thread injector clears Windows event logs
    crit: hostile
    conf: 0.99
    for: [pe, dll]
    attack: T1055,T1070.001
    # remote-alloc-write-thread-api-set wants the text spellings, and those
    # stand down once the same APIs are real imports. Imported
    # VirtualAllocEx, WriteProcessMemory, and CreateRemoteThread are the
    # injector.
    all:
      - id: micro-behaviors/os/event/log::wevtutil-clear-log-command
      - id: micro-behaviors/process/inject/runtime/call::remote-process-injection-api-set
    unless:
      - id: metadata/signed/platform/
      - id: well-known/tool/reverse-engineering/
      - id: well-known/tool/sysadmin/

  - id: python-downloaded-stage-eventlog-clear
    desc: Python downloaded-stage package clears Windows event logs
    crit: hostile
    conf: 0.99
    for: [whl, python-sdist, python]
    scope: archive
    attack: T1195.002,T1105,T1070.001
    all:
      - id: micro-behaviors/communications/http/url/build::python-remote-asset-url-config
      - id: micro-behaviors/communications/http/lib/urllib::urlopen-response-body-read
      - id: python-eventlog-clear-argv
