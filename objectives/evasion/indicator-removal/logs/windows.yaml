defaults:
  attack: T1070.001
  mbc: F0005
  platforms: [windows]
  for:
    - powershell
    - batch
    - c
    - cpp
    - pe
    - dll
traits:
  - id: wevtutil-cl
    desc: wevtutil cl command
    crit: suspicious
    conf: 0.9
    if:
      type: text
      regex: '(?i)\bwevtutil(\.exe)?\s+cl\b'
  - id: clear-eventlog
    desc: Clear-EventLog cmdlet
    crit: suspicious
    conf: 0.56
    for: [powershell]
    if:
      type: text
      substr: Clear-EventLog
    unless:
      - id: well-known/tool/detection/owasp-modsecurity-crs::owasp-crs-powershell-catalog-context
      - id: well-known/app/utility/quicklook::release-path
      # Ansible's win_eventlog module manages event logs, clearing included.
      - id: well-known/app/infrastructure/ansible::ansible-module-source-context
composite_rules:
  - id: log-clear-windows
    desc: Clear Windows event logs
    crit: suspicious
    conf: 0.66
    any:
      - id: wevtutil-cl
      - id: clear-eventlog
