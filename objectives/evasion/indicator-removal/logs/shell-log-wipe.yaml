# Generic POSIX-shell log/history clearing. These matchers were previously
# named and platform-tagged for PAN-OS, but none of them inspects anything
# PAN-OS-specific — they are ordinary Linux log-wipe commands and fire on any
# shell script that runs them.
defaults:
  platforms: [unix]
  for: [shell]
  attack: T1070.002

traits:
  - id: shell-mass-bash-history-truncate
    desc: Clears root and every user's bash history
    crit: suspicious
    conf: 0.92
    attack: T1070.003
    if:
      type: text
      regex: '/root/\.bash_history /home/\*/\.bash_history'

  - id: shell-auth-lastlog-clear-pair
    desc: Clears auth.log together with lastlog
    crit: suspicious
    conf: 0.92
    if:
      type: text
      regex: '/var/log/auth\.log[\s\S]{0,220}/var/log/lastlog'

  # Dual-use on its own: `journalctl --vacuum-time=1s` is the standard idiom in
  # cloud-image prep, container slimming, disk-space recovery and uninstall
  # scripts, so it is a notable capability rather than a suspicious one. The
  # hostile composite below supplies the evasion intent.
  - id: shell-journalctl-vacuum-immediate
    desc: Vacuums the entire systemd journal
    crit: notable
    conf: 0.9
    if:
      type: text
      substr: journalctl --vacuum-time=1s

composite_rules:
  - id: shell-multi-log-and-history-wipe
    desc: Shell wipes auth logs, shell history and the journal
    crit: hostile
    conf: 0.98
    all:
      - id: shell-mass-bash-history-truncate
      - id: shell-auth-lastlog-clear-pair
      - id: shell-journalctl-vacuum-immediate
