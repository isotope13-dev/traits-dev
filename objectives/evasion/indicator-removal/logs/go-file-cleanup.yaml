defaults:
  platforms: [windows]
  for: [go]
  crit: suspicious
  conf: 0.98
  attack: T1070.004

traits:
  - id: go-defender-support-delete-command
    desc: Go forced Defender support-file deletion
    if:
      type: symbol
      kind: call
      exact: exec.Command
      args:
        - index: 0
          kind: string
          regex: '(?i)^cmd(\.exe)?$'
        - index: 1
          kind: string
          regex: '(?i)^/C$'
        - index: 2
          kind: string
          regex: '(?i)^del /f /q .{0,60}Windows Defender\\Support\\\*\.\*$'

  - id: go-rdp-log-delete-command
    desc: Go constructs forced RDP log-file deletion
    if:
      type: symbol
      kind: call
      exact: exec.Command
      args:
        - index: 0
          kind: string
          regex: '(?i)^cmd(\.exe)?$'
        - index: 1
          kind: string
          regex: '(?i)^/C$'
        - index: 2
          kind: string
          regex: '(?i)^del /f /q %SystemRoot%\\System32\\LogFiles\\RDP\\\*\.\*$'
