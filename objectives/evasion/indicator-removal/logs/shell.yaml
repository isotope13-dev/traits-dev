defaults:
  platforms:
  - unix
  - windows
  crit: suspicious
  conf: 0.85
  for:
  - shell
  - python
  - ruby
  - javascript
traits:
- id: shell-history-file-removal
  desc: Removes a Unix shell history file
  conf: 0.98
  attack: T1070.003
  platforms:
  - unix
  for:
  - scripts
  - source
  - binaries
  - -wasm
  if:
    type: text
    regex: (?i)\brm\s+(-[a-z]*f[a-z]*|--force)\s+["']?\S*\.(bash|zsh|sh)_history\b
  unless:
  - type: path
    regex: (^|[\\/])nix[\\/]test-guest[\\/]cache-seal\.sh$
  - id: metadata/build/package/maintainer-scripts::cloud-marketplace-cleanup-script
  - id: well-known/app/infrastructure/pritunl-cloud/
  - id: well-known/tool/detection/ai-guardrail::command-rule-corpus
  - id: metadata/package/testing/
  - id: metadata/path::test-directory-component
  - id: micro-behaviors/process/create/shell/guard::agent-bash-permission-deny-rule
- id: history-clear
  desc: Clears shell/shell history
  conf: 0.9
  attack: T1070.003
  if:
    type: text
    regex: '>\s*/root/\.bash_history|echo\s*>\s*[^\n]{0,30}\.bash_history'
  unless:
  - id: metadata/build/package/maintainer-scripts::cloud-marketplace-cleanup-script
  - id: well-known/app/infrastructure/dokku::dokku-source-tree
- id: wtmp-redirect-clear
  desc: Clears wtmp/utmp/btmp logs via redirect
  conf: 0.95
  attack: T1070.004
  if:
    type: text
    regex: (?m)^\s*>\s*/var/log/(wtmp|utmp|btmp)\b
  unless:
  - id: metadata/build/package/maintainer-scripts::cloud-marketplace-cleanup-script
  - id: well-known/app/infrastructure/dokku::dokku-source-tree
- id: wtmp-echo-clear
  desc: Clears wtmp/utmp/btmp logs via echo redirect
  conf: 0.95
  attack: T1070.004
  if:
    type: text
    regex: echo\s*>\s*/var/log/(wtmp|utmp|btmp)
  unless:
  - id: metadata/build/package/maintainer-scripts::cloud-marketplace-cleanup-script
  - id: well-known/app/infrastructure/dokku::dokku-source-tree
- id: find-exec-rm-log
  desc: Find and remove log files
  conf: 0.85
  attack: T1070.004
  if:
    type: text
    regex: find\s+(/|~|\$HOME|\$\(HOME\))[^;\n]{0,100}-name\s+["']\*\.log["']\s+-exec\s+rm
  unless:
  - id: metadata/build/package/maintainer-scripts::cloud-marketplace-cleanup-script
  - id: well-known/app/infrastructure/dokku::dokku-source-tree
  - id: well-known/lib/format/tinystring::tinystring-benchmark-archive-context
  - id: metadata/package/testing/
  - id: metadata/path::test-directory-component
