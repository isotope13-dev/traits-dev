# Shell-based Log Clearing Commands
# Detects shell commands used to clear history or logs
# ATT&CK: T1070.003 (Clear Command History), T1070.004 (File Deletion)
defaults:
  platforms: [unix, windows]
  crit: notable
  conf: 0.85
  for: [shell, python, ruby, javascript]
traits:
  # Selective removal, as opposed to the truncation the rest of this file
  # covers. `for:` widens to every scripting language because the commands
  # travel inside whatever wraps the shell -- an AppleScript `do shell
  # script`, a Perl backtick -- and the wrapper does not change what was done
  # to the log.
  - id: shell-history-file-removal
    desc: Removes a Unix shell history file
    crit: suspicious
    conf: 0.98
    attack: "T1070.003"
    platforms: [unix]
    for: [scripts, source, binaries, -wasm]
    if:
      type: text
      regex: '(?i)\brm\s+(-[a-z]*f[a-z]*|--force)\s+["'']?\S*\.(bash|zsh|sh)_history\b'
    unless:
      - type: path
        regex: '(^|[\\/])nix[\\/]test-guest[\\/]cache-seal\.sh$'
      - id: metadata/build/package/maintainer-scripts::cloud-marketplace-cleanup-script
      - id: well-known/app/infrastructure/pritunl-cloud/
      - id: well-known/tool/detection/ai-guardrail::command-rule-corpus
      - id: metadata/package/testing/
      - id: metadata/file/naming::test-directory-component
      - id: micro-behaviors/process/create/shell/guard::agent-bash-permission-deny-rule
  - id: history-clear
    desc: Clears shell/shell history
    crit: suspicious
    conf: 0.90
    attack: "T1070.003"
    if:
      type: text
      regex: '>\s*/root/\.bash_history|echo\s*>\s*[^\n]{0,30}\.bash_history'
    unless:
      - id: metadata/build/package/maintainer-scripts::cloud-marketplace-cleanup-script
      - id: well-known/app/infrastructure/dokku::dokku-source-tree
  - id: wtmp-redirect-clear
    desc: Clears wtmp/utmp/btmp logs via redirect
    crit: suspicious
    conf: 0.95
    attack: "T1070.004"
    if:
      type: text
      regex: '(?m)^\s*>\s*/var/log/(wtmp|utmp|btmp)\b'
    unless:
      - id: metadata/build/package/maintainer-scripts::cloud-marketplace-cleanup-script
      - id: well-known/app/infrastructure/dokku::dokku-source-tree
  - id: wtmp-echo-clear
    desc: Clears wtmp/utmp/btmp logs via echo redirect
    crit: suspicious
    conf: 0.95
    attack: "T1070.004"
    if:
      type: text
      regex: 'echo\s*>\s*/var/log/(wtmp|utmp|btmp)'
    unless:
      - id: metadata/build/package/maintainer-scripts::cloud-marketplace-cleanup-script
      - id: well-known/app/infrastructure/dokku::dokku-source-tree
  - id: find-exec-rm-log
    desc: Find and remove log files
    crit: suspicious
    conf: 0.85
    attack: "T1070.004"
    if:
      type: text
      # Evidence-bearing scopes only: sweeping a system root or home tree
      # destroys indicators. A project-relative `find . -name '*.log' -exec
      # rm` is CI/workspace cleanup of the project's own run artifacts.
      regex: 'find\s+(/|~|\$HOME|\$\(HOME\))[^;\n]{0,100}-name\s+["'']\*\.log["'']\s+-exec\s+rm'
    unless:
      - id: metadata/build/package/maintainer-scripts::cloud-marketplace-cleanup-script
      - id: well-known/app/infrastructure/dokku::dokku-source-tree
      - id: well-known/lib/format/tinystring::tinystring-benchmark-archive-context
      - id: metadata/package/testing/
      - id: metadata/file/naming::test-directory-component
