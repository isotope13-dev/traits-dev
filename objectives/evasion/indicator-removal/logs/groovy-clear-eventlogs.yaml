defaults:
  platforms: [windows, unix]
  for: [groovy]
  attack: T1070.001

traits:
  - id: groovy-clear-security-and-system-logs
    desc: Groovy clears Security and System logs
    crit: notable
    conf: 0.98
    if:
      type: text
      regex: '(?i)\bwevtutil\s+cl\s+Security\b.{0,40}\bwevtutil\s+cl\s+System\b'
  - id: groovy-clear-application-log
    desc: Groovy command clears Application event log
    crit: notable
    conf: 0.98
    if:
      type: text
      regex: '(?i)\bwevtutil\s+cl\s+Application\b'

composite_rules:
  - id: groovy-clear-multiple-windows-eventlogs
    desc: Groovy clears multiple Windows event logs
    crit: hostile
    conf: 0.99
    all:
      - id: groovy-clear-security-and-system-logs
      - id: groovy-clear-application-log
      - id: micro-behaviors/process/create/shell/command-string::groovy-cmd-c-execute
