defaults:
  platforms: [linux]
  for: [python, pyc]
  attack: T1070.001

# `python-auditctl-disable` used to live here as `substr: '"auditctl", "-e", "0"'` —
# that exact Python argv spelling and nothing else. It was deleted in favour of
# the canonical, language-agnostic
# `indicator-removal/audit::auditctl-subsystem-disable`, whose matcher was
# widened to absorb argv punctuation and so covers this form AND the plain shell
# `auditctl -e 0` the old substring could never see. The composite below
# references that atom directly rather than aliasing it.
traits:
  - id: python-journal-vacuum
    desc: Python vacuums journal logs
    crit: suspicious
    conf: 0.94
    if:
      type: text
      substr: '"journalctl", "--vacuum-time=1s"'

  - id: python-masks-security-units
    desc: Python masks security units
    crit: suspicious
    conf: 0.94
    if:
      type: text
      regex: 'auditd\.service[\s\S]{0,140}fail2ban\.service[\s\S]{0,140}ossec\.service'

composite_rules:
  - id: python-linux-security-log-evasion
    desc: Python Linux log evasion
    crit: hostile
    conf: 0.98
    needs: 2
    any:
      - id: objectives/evasion/indicator-removal/audit::auditctl-subsystem-disable
      - id: python-journal-vacuum
      - id: python-masks-security-units
