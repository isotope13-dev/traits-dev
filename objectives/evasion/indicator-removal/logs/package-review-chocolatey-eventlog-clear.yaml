defaults:
  platforms: [windows]
  for: [nupkg]
  attack: T1195.002
composite_rules:
  - id: chocolatey-eventlog-clear
    desc: Chocolatey hook clears event logs
    crit: hostile
    conf: 0.98
    scope: archive
    for: [source, '!objectivec', batch, beam, class, javascript, lua, nupkg, pe, perl, php, powershell, pyc, python, ruby, static-lib, vbs, wasm]
    all:
      - id: metadata/package/files/nuget::chocolatey-install-script-member
      - id: micro-behaviors/os/event/log::wevtutil-clear-log-command
      - id: micro-behaviors/fs/path/temp::env-temp
