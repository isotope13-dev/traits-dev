defaults:
  platforms:
  - windows
  for:
  - binaries
  - scripts
  - source
  attack: T1070.001
composite_rules:
- id: recovery-inhibition-with-log-clear
  desc: Recovery inhibition with log clearing
  crit: suspicious
  conf: 0.95
  attack: T1490,T1070.001
  all:
  - id: objectives/impact/degrade/system/recovery::shadow-delete
  any:
  - id: micro-behaviors/os/event/log::windows-eventlog-clear-command-reference
  - id: objectives/evasion/indicator-removal/cleanup::windows-indicator-removal
- id: multi-recovery-sabotage-clears-eventlog
  desc: Recovery sabotage with event-log clearing
  crit: hostile
  conf: 0.99
  attack: T1490,T1070.001
  near_lines: 8
  all:
  - id: objectives/impact/degrade/system/recovery::shadow-copy-delete
  - id: objectives/impact/degrade/system/recovery::bcdedit-recovery
  - id: micro-behaviors/os/event/log::wevtutil-clear-log-command
  unless:
  - id: well-known/tool/detection/pattern-catalog::attack-technique-map-module
  - id: well-known/tool/detection/pattern-catalog::command-pattern-guard-catalog
  - id: micro-behaviors/metaprogramming/generation::configured-source-builder
