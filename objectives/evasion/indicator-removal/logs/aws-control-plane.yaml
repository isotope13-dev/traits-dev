# CloudTrail, VPC Flow Logs and GuardDuty are the AWS monitoring surfaces
# named by the guide. Any one change can be administrative; cross-surface
# modification is the high-confidence defense-evasion pattern.
defaults:
  platforms: [unix, windows]
  for: [scripts, source, json]
  attack: T1562.008

composite_rules:
  - id: aws-cloud-control-plane-tampering
    desc: AWS CloudTrail and GuardDuty tampering
    crit: hostile
    conf: 0.97
    all:
      - id: micro-behaviors/communications/http/services/aws-audit::aws-cloudtrail-logging-operation
      - id: micro-behaviors/communications/http/services/aws-audit::aws-guardduty-detector-operation
      - id: micro-behaviors/communications/http/services/aws-audit::aws-guardduty-ip-set-operation

  # Notable, to match the two legs it rolls up (both lowered for the same
  # reason: the tooling built to manage GuardDuty calls these APIs by
  # definition -- cloud-custodian's c7n_guardian creates and configures
  # detectors across an org). A bare `any:` over them adds no filtering, so it
  # cannot outrank them; the hostile `aws-cloud-control-plane-tampering` above
  # requires CloudTrail tampering alongside both, which is the real claim.
  - id: aws-guardduty-detection-change
    desc: AWS GuardDuty detector or IP-set change
    crit: notable
    conf: 0.92
    any:
      - id: micro-behaviors/communications/http/services/aws-audit::aws-guardduty-detector-operation
      - id: micro-behaviors/communications/http/services/aws-audit::aws-guardduty-ip-set-operation
