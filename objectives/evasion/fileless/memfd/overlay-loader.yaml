# An ELF with a large high-entropy appended overlay that writes transformed
# bytes to an anonymous memfd and launches it with execveat/AT_EMPTY_PATH uses
# fileless staged execution. High entropy alone does not establish encryption.
# Recognized runtime contexts reduce the finding because they may use similar
# packaging techniques.
defaults:
  platforms: [linux]
  for: [elf]
  attack: T1620,T1027.002
  mbc: B0032
composite_rules:
  - id: high-entropy-overlay-memfd-exec
    desc: ELF runs high-entropy overlay from memfd
    crit: hostile
    conf: 0.95
    all:
      - id: micro-behaviors/mem/anonymous/create::x64-memfd-call-arguments
      - id: micro-behaviors/process/replace::execveat-empty-path-syscall
      - id: metadata/binary/layout/ratio::overlay-at-least-half
      - id: metadata/binary/layout/entropy::elf-overlay-entropy-over-75
    downgrade:
      any:
        - id: well-known/lib/runtime/native-platform/uruntime/
        - id: well-known/app/infrastructure/runc/
  - id: arm-overlay-memfd-exec
    desc: ARM ELF runs high-entropy overlay from memfd
    crit: hostile
    conf: 0.95
    arch: [arm]
    all:
      - id: micro-behaviors/mem/anonymous/create::arm-eabi-memfd-create-syscall
      - id: micro-behaviors/process/replace::arm-eabi-execveat-empty-path-syscall
      - id: metadata/binary/layout/ratio::overlay-at-least-half
      - id: metadata/binary/layout/entropy::elf-overlay-entropy-over-75
    downgrade:
      any:
        - id: well-known/lib/runtime/native-platform/uruntime/
        - id: well-known/app/infrastructure/runc/
