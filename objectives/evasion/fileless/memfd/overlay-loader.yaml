# An ELF whose file is mostly an appended high-entropy blob, which creates an
# anonymous memfd by raw syscall number and runs it through execveat with
# AT_EMPTY_PATH (fexecve), is a crypter stub: it decrypts the overlay in memory
# and launches it without the payload ever touching disk. Self-extractors that
# carry an overlay (PyInstaller, makeself, staticx) unpack to a directory;
# runc's memfd re-exec has no overlay. AppImage-style runtimes are excluded.
defaults:
  platforms: [linux]
  for: [elf]
  attack: T1620,T1027.002
  mbc: B0032
composite_rules:
  - id: encrypted-overlay-memfd-exec
    desc: ELF executes encrypted overlay from a memfd
    crit: hostile
    conf: 0.95
    all:
      - id: micro-behaviors/mem/anonymous/create::x64-memfd-call-arguments
      - id: micro-behaviors/process/create/exec::execveat-empty-path-syscall
      - id: metadata/binary/layout/overlay::overlay-at-least-half
      - id: metadata/binary/layout/overlay::elf-overlay-entropy-over-75
    unless:
      - id: well-known/lib/runtime/native-platform/uruntime/
      - id: well-known/app/infrastructure/runc/
