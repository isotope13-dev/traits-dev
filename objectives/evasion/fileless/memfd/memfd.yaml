defaults:
  platforms:
    - unix
    - windows
  attack: T1620
traits:
  - id: memfd-reexec-guard
    desc: memfd re-execution guard variable
    crit: suspicious
    conf: 0.86
    for: [c, cpp, rust, go, elf]
    if:
      type: text
      # Short env-var style guard (2-8 uppercase chars). Excludes the
      # common Linux kernel pattern `_MFD_<CHIPNAME>_<FILENAME>_H__`
      # (include guards for Multi-Function Device drivers), which are
      # long and always end in _H_ or _H__.
      regex: '(^|[^A-Z0-9_])_(MFD|MEMFD)_[A-Z0-9]{2,8}([^A-Z0-9_]|$)'
  - id: clears-memfd-cloexec
    desc: Clears close-on-exec on memfd
    crit: suspicious
    conf: 0.86
    for: [c, cpp, rust, go, elf]
    if:
      type: text
      regex: 'F_SETFD[\\s\\S]{0,120}(0|FD_CLOEXEC)_MALICIOUS'
  - id: ctypes-mod
    desc: ctypes module
    crit: component
    conf: 0.4
    for:
      - python
    if:
      type: string_literal
      substr: ctypes
  - id: ctypes-cdll-dup
    desc: ctypes CDLL native library loader
    crit: component
    conf: 0.5
    for:
      - python
    if:
      type: string_literal
      exact: CDLL
    unless:
      # The symbol records the API being used; this also sees the name sitting in
      # data. Standing down there keeps one use from counting twice.
      - id: micro-behaviors/dylib/load/runtime::cdll-paren
  - id: http-client-dup
    desc: http.client module
    crit: component
    conf: 0.3
    for:
      - python
    if:
      type: string_literal
      substr: http.client
  - id: shm-open
    desc: shm_open POSIX shared memory
    crit: notable
    conf: 0.5
    for: [scripts, binaries]
    unless:
      - id: well-known/lib/ai/lmcache::wheel-member-context
    if:
      type: string_literal
      substr: shm_open
  - id: native-memory-stage-command-menu
    desc: Memfd and shellcode staging menu
    crit: suspicious
    conf: 0.99
    platforms: [linux]
    for: [elf]
    if:
      type: text
      substr: '/memfd  /shellcode  /stage <url>  /dlopen <path.so>'
composite_rules:
  - id: native-commanded-memfd-shellcode-stage
    desc: Native agent remotely stages memfd and shellcode payloads
    crit: hostile
    conf: 0.99
    attack: T1105,T1620,T1055
    platforms:
    - linux
    for:
    - elf
    all:
    - id: native-memory-stage-command-menu
    - id: micro-behaviors/os/syscall/invoke::syscall-319-call
    - id: micro-behaviors/fs/proc/memory::process-fd-memfd-discovery
  - id: native-commanded-executable-memory-shellcode
    desc: Command agent maps shellcode into executable memory
    crit: hostile
    conf: 0.99
    attack: "T1055.001,T1620"
    platforms: [linux]
    for: [elf]
    all:
      - id: native-memory-stage-command-menu
      - id: "micro-behaviors/mem/map::mmap-symbol"
      - id: objectives/command-and-control/backdoor/rat/tasking::secure-beacon-frame

  - id: python-http-memfd-exec
    desc: Python downloads a stage into memfd and executes it
    crit: hostile
    conf: 0.99
    attack: "T1105, T1620"
    for: [python]
    all:
      - id: micro-behaviors/communications/http/lib/urllib::urlopen-response-body-assignment
      - id: micro-behaviors/mem/anonymous/create::memfd-create-python
      - id: micro-behaviors/fs/write/file/descriptor::python-os-write-fd
      - id: micro-behaviors/process/create/direct::python-os-execve-call

  - id: python-requests-http-memfd-exec
    desc: Python requests stage into libc memfd then executes
    crit: hostile
    conf: 0.99
    attack: "T1105, T1620"
    for: [python]
    all:
      - id: micro-behaviors/communications/http/get::requests-get
      - id: micro-behaviors/communications/http/client/response-body::python-client-response-body-cooccurrence
      - id: micro-behaviors/mem/anonymous/create::python-libc-memfd-create
      - id: micro-behaviors/fs/write/file/descriptor::python-os-write-fd
    any:
      - id: micro-behaviors/process/create/direct::python-os-execve-call
      - id: micro-behaviors/process/create/direct::python-os-execv-call

  - id: python-architecture-adaptive-memfd-stage
    desc: Python selects an architecture-specific stage and executes it from memfd
    crit: hostile
    conf: 0.99
    attack: "T1105, T1082, T1620"
    for: [python]
    all:
      - id: micro-behaviors/os/sysinfo/platform/arch::architecture-parameter-with-host-query
      - id: micro-behaviors/os/sysinfo/platform/host::python-platform-machine
      - id: micro-behaviors/mem/anonymous/create::memfd-create-python
      - id: micro-behaviors/process/create/direct::python-os-execve-call

  - id: python-shell-command-memfd-stage
    desc: Python downloads a stage into memfd through a shell command and executes it
    crit: hostile
    conf: 0.99
    attack: "T1105, T1620"
    for: [python]
    all:
      - id: micro-behaviors/mem/anonymous/create::memfd-create-python
      - id: micro-behaviors/fs/proc/info/path::python-self-process-fd-path
      - id: micro-behaviors/communications/http/download/cli::fetch-output-flag-script
      - id: micro-behaviors/process/create/local-exec::python-shell-variable-background-exec

  - id: python-shell-architecture-adaptive-memfd-stage
    desc: Python shell fetches architecture stage into memfd
    crit: hostile
    conf: 0.99
    attack: "T1105, T1082, T1620"
    for: [python]
    all:
      - id: python-shell-command-memfd-stage
      - id: micro-behaviors/os/sysinfo/platform/arch::architecture-parameter-with-host-query

  - id: shell-fileless-fd-stage
    desc: Shell streams a remote payload into a discovered memfd and executes it
    crit: hostile
    conf: 0.99
    attack: "T1105, T1620"
    for: [shell]
    all:
      - id: micro-behaviors/communications/http/download/cli::fetch-output-flag-script
      - id: micro-behaviors/fs/proc/info/path::process-variable-fd-path
      - id: micro-behaviors/fs/proc/memory::process-fd-memfd-discovery
      - id: micro-behaviors/process/create/local-exec::execute-variable-background

  - id: shell-user-process-memfd-stage
    desc: Shell overwrites a user-process memfd with remote stage
    crit: hostile
    conf: 0.99
    attack: "T1057, T1105, T1620"
    for: [shell]
    all:
      - id: shell-fileless-fd-stage
      - id: micro-behaviors/process/enumerate/shell::ps-current-user-process-list

  - id: shell-architecture-adaptive-fileless-stage
    desc: Shell selects an architecture-specific payload for fileless execution
    crit: hostile
    conf: 0.99
    attack: "T1105, T1082, T1620"
    for: [shell]
    all:
      - id: micro-behaviors/os/sysinfo/platform/arch::architecture-parameter-with-host-query
      - id: micro-behaviors/os/sysinfo/platform/arch::sh-uname-fingerprint
      - id: micro-behaviors/fs/proc/info/path::process-variable-fd-path
      - id: micro-behaviors/fs/proc/memory::process-fd-memfd-discovery
      - id: micro-behaviors/process/create/local-exec::execute-variable-background

  - id: http-download-python
    desc: Python HTTP download libraries for
    crit: component
    conf: 0.8
    attack: T1105
    for:
      - python
    any:
      - id: micro-behaviors/communications/http/get::requests-get
      - id: micro-behaviors/communications/http/lib/urllib::urllib2-word
      - id: micro-behaviors/communications/http/client/exchange::urllib-urlopen
      - id: objectives/evasion/fileless/memfd::http-client-dup
  - id: proc-fd-path
    desc: Proc descriptor path fragment
    crit: component
    conf: 0.5
    for: [scripts, binaries, c, cpp, rust, go, elf]
    any:
      - id: micro-behaviors/fs/proc/info/path::self-fd-directory-reference
      - id: micro-behaviors/fs/proc/info/path::self-fd-path-literal
    unless:
      - id: metadata/build/
      - id: well-known/lib/data/sql-js/
      - id: well-known/tool/sysadmin/unix-benign::kernelsu-daemon
      - id: well-known/tool/sysadmin/alpine-packages/package::alpine-ansible-core-package
      - id: well-known/tool/detection/cilium-tetragon::source-path
      - id: well-known/app/communication/telegram::telegram-desktop-third-party-source
  # Notable, not suspicious: a bare `any:` over a notable `execveat` API
  # reference and a /proc/self/fd exec path. Naming the syscall is what a
  # bindings crate does -- the `nix` crate's src/unistd.rs declares execveat
  # for every Rust program that vendors it -- and a debugger re-execs itself
  # through a descriptor by design (valgrind's cachegrind-arm64-linux). The
  # hostile composite below still requires memfd_create, /proc/self/exe and
  # the cleanup step alongside it, which is the fileless re-exec sequence.
  - id: memfd-reexec-target
    desc: Executes from memfd file descriptor
    crit: notable
    conf: 0.95
    for: [scripts, binaries, c, cpp, rust, go, elf]
    unless:
      - id: well-known/app/communication/telegram::telegram-desktop-third-party-source
    any:
      - id: micro-behaviors/process/create/exec::execveat-api-reference
      - id: proc-fd-exec
  # micro-behaviors/fs/delete/file/library::unlink is `for: [elf, macho,
  # shell, c, cpp]` -- it never covers Rust/Go source, which delete their own
  # file through the language stdlib call instead of the raw libc symbol.
  - id: memfd-cleanup-delete-call
    desc: Deletes own file before/after memfd re-exec
    crit: component
    conf: 0.5
    for: [c, cpp, rust, go, elf]
    any:
      - id: micro-behaviors/fs/delete/file/library::unlink
      - id: micro-behaviors/fs/delete/file/library::fs-remove_file
      - id: micro-behaviors/fs/delete/file/library::os-Remove
  - id: memfd-reexec-cleanup
    desc: Removes artifacts before memfd execution
    crit: suspicious
    conf: 0.92
    for: [c, cpp, rust, go, elf]
    unless:
      - id: well-known/tool/development/agent/kilocode::kilo-code-native-runtime
      - id: well-known/tool/reverse-engineering/frida/
    all:
      - id: memfd-cleanup-delete-call
    any:
      - id: clears-memfd-cloexec
      - id: memfd-reexec-guard
  - id: proc-fd-exec
    desc: Executes binary from /proc/self/fd
    crit: suspicious
    conf: 0.95
    for: [scripts, binaries]
    all:
      - id: proc-fd-path
      - id: micro-behaviors/process/create/execv::execve-fn
  - id: memfd-self-reexec
    desc: Re-executes itself from anonymous memory
    crit: hostile
    conf: 0.98
    attack: "T1620, T1070.004"
    for: [c, cpp, rust, go, elf]
    all:
      - id: micro-behaviors/mem/anonymous/create::memfd-create
      - id: micro-behaviors/fs/proc/exe::process-self-exe-path
      - id: memfd-reexec-target
      - id: memfd-reexec-cleanup
  - id: ctypes-syscall
    desc: Direct syscall invocation via ctypes
    crit: suspicious
    conf: 0.9
    attack: T1106
    for:
      - python
    all:
      - id: ctypes-mod
      - id: micro-behaviors/os/syscall/invoke::python-dot-syscall
      - id: objectives/evasion/fileless/memfd::ctypes-cdll-dup
  - id: download-memfd-exec
    desc: Downloads binary and executes via memfd
    crit: suspicious
    conf: 0.98
    for: [scripts, binaries]
    all:
      - id: http-download-python
      - id: micro-behaviors/mem/anonymous/create::memfd-create-python
    any:
      - id: objectives/evasion/fileless/memory::exec-function
      - id: micro-behaviors/fs/write/file/descriptor::python-os-write-fd
  - id: shm-exec
    desc: Uses shared memory for fileless
    crit: suspicious
    conf: 0.9
    for: [scripts, binaries]
    all:
      - id: shm-open
    any:
      - id: micro-behaviors/fs/path/device/special::dev-shm-bare
      - id: "micro-behaviors/mem/map::mmap-symbol"
      - id: micro-behaviors/process/create/execv::execve-fn
