# Mixed-mode entry alone is legitimate C++/CLI. This profile additionally
# requires implemented RC4, a disk byte read, assembly loading and invocation.
# Co-occurrence does not prove data flow: keep the assessment suspicious.
defaults:
  for: [pe, dll]
  platforms: [windows]
composite_rules:
  - id: native-entry-rc4-assembly-loader
    desc: Native CLR entry with RC4 assembly loading
    crit: suspicious
    conf: 0.97
    attack: T1140,T1620
    all:
      - id: metadata/binary/header/characteristics::pe-dotnet-native-entry
      - id: micro-behaviors/crypto/symmetric/stream/rc4/transform::cil-modulo-byte-prga-xor
      - id: micro-behaviors/fs/read/file/content/whole::dotnet-readallbytes-token
      - id: micro-behaviors/process/interpreter/runtime/clr::cil-assembly-load-call
      - id: micro-behaviors/metaprogramming/reflection/inspect/class/invocation::method-invoke
