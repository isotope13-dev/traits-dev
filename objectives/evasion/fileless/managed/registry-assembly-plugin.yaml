# Registry-resident managed plugin, loaded reflectively.
#
# The implant keeps its plugin modules off disk by writing the (compressed /
# encrypted) assembly bytes into a registry value, then later reads the value
# back and hands the bytes to Assembly.Load for reflective execution. QuickFox's
# FDMTP implant cached plugins under HKCU\SOFTWARE\Microsoft\IME\{HWID} and ran
# them by hash; the class is any .NET payload that stores an assembly in the
# registry and loads it from a byte buffer, independent of the specific key.
defaults:
  platforms: [windows]
  for: [csharp, pe, dll]
  attack: T1112,T1620,T1027.011
  mbc: B0032

composite_rules:
  - id: registry-resident-managed-plugin
    desc: Registry-stored .NET assembly loaded reflectively
    crit: hostile
    conf: 0.96
    scope: file
    near_lines: 80
    all:
      - id: micro-behaviors/os/registry/access::managed-registry-binary-write
      - id: micro-behaviors/os/registry/manipulate::registry-get-value
      - id: micro-behaviors/process/interpreter/reflection/resolve::assembly-load-buffer
