# Concealed PowerShell stage reflectively loading a managed assembly.
#
# The command text pairs policy bypass and a hidden window with
# `[Reflection.Assembly]::Load` over a byte buffer, so the payload assembly
# never appears as a normal process module or a script on disk. Signing in or
# shipping this shape inside a compiled stage is reflective code loading
# (T1620); installers that legitimately run PowerShell execute script files
# through the interpreter, they do not Assembly.Load raw bytes concealed from
# the console.
defaults:
  platforms: [windows]
  for: [pe, dll, powershell, batch]
  attack: T1620,T1059.001

composite_rules:
  # near_bytes keeps the three clues inside one command string: large
  # deployment assemblies carry unrelated PowerShell fragments, and only the
  # co-located shape is a concealed reflective stage.
  - id: concealed-powershell-reflective-load
    desc: Hidden policy-bypassed PowerShell loads assembly
    crit: hostile
    conf: 0.95
    near_bytes: 512
    all:
      - id: micro-behaviors/metaprogramming/reflection/resolve::powershell-assembly-load-operator
      - id: micro-behaviors/os/security/policy::powershell-policy-bypass-text
      - id: micro-behaviors/process/argument/interpreter::powershell-windowstyle-hidden-option
