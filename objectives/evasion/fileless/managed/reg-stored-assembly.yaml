# A .reg script that parks a Base64 Windows executable in a registry value
# and, in a second value, an encoded PowerShell command that reads registry
# data back and loads it as a .NET assembly. The executable never touches the
# file system: the registry is the payload store and Assembly.Load runs it in
# memory. Configuration exports carry settings, not PE images plus a loader.
defaults:
  platforms: [windows]
  for: [reg]
  attack: T1112,T1620,T1027.011
  mbc: B0032

traits:
  - id: reg-value-base64-pe-dos-stub
    desc: Reg value holds Base64 PE stub
    crit: notable
    conf: 0.93
    if:
      type: text
      regex: '"="[A-Za-z0-9+/]{16,400}VGhpcyBwcm9ncmFtIGNhbm5vdCBiZSBydW4g'
  - id: reg-encoded-reflective-assembly-load
    desc: Encoded reg data loads a .NET assembly
    crit: notable
    conf: 0.92
    if:
      type: encoded
      encoding: base64
      regex: '(?i)\[(System\.)?Reflection\.Assembly\]::Load\('

composite_rules:
  - id: reg-resident-pe-reflective-loader
    desc: Registry-stored PE loaded by encoded PowerShell
    crit: hostile
    conf: 0.96
    all:
      - id: metadata/file/format/structured::reg-script-header-and-key-section
      - id: reg-value-base64-pe-dos-stub
      - id: reg-encoded-reflective-assembly-load
      - id: objectives/command-and-control/remote-command/dispatch/eval::registry-encoded-property-read
