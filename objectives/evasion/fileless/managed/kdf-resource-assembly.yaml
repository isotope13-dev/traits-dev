---
# Password-derived in-memory assembly execution — the fileless twin of the
# encrypted-resource loader. The stub derives its payload key from a password
# (Rfc2898DeriveBytes), recovers a managed assembly from its own resources,
# and executes it purely in memory through AppDomain.Load plus late-bound
# invocation (Activator.CreateInstance / InvokeMember) inside an unsigned,
# packed body. No file is written and none needs to be: the payload never
# exists on disk in cleartext. A legitimate plugin host is neither unsigned
# and packed nor password-decrypting its own plugins.
defaults:
  crit: hostile
  platforms: [windows]
  for: [pe, dll]
  attack: T1027.009,T1620
  mbc: B0032,E1059

composite_rules:
  - id: dotnet-kdf-resource-fileless-loader
    desc: Unsigned packed .NET executes a password-decrypted resource in memory
    conf: 0.97
    all:
      - id: metadata/binary/framework::dotnet-assembly
      - id: metadata/signed/trust-level::unsigned-missing-signature-record
      - id: micro-behaviors/data/embedded/payload/resource::dotnet-managed-resource-access
      - id: micro-behaviors/crypto/kdf/password::rfc2898derivebytes-pe-reference
      - id: micro-behaviors/process/interpreter/reflection/runtime::dotnet-appdomain-load-instance-tokens
      - id: metadata/binary/section/entropy::near-maximum-code-section-entropy
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/installer/family/
      - id: well-known/lib/runtime/managed/dotnet-runtime::dotnet-corelib-assembly
