defaults:
  platforms: [windows]
  for: [pe, dll]
  attack: T1620
  mbc: E1059

composite_rules:
  # The AppDomain result is immediately treated as an Assembly: its types and
  # methods are enumerated and invoked. Requiring resource-bitmap byte recovery
  # and a packed code section distinguishes this from ordinary plugin hosts.
  - id: dotnet-bitmap-fileless-method-loader
    desc: .NET bitmap assembly invokes in memory
    crit: hostile
    conf: 0.99
    all:
      - id: metadata/binary/framework::dotnet-assembly
      - id: metadata/binary/metrics/structural::high-code-entropy
      - id: micro-behaviors/data/embedded/payload/resource::dotnet-managed-resource-access
      - id: micro-behaviors/data/embedded/payload/image::dotnet-resource-bitmap-pixel-readback
      - id: objectives/anti-static/obfuscation/reflection/invoke::dotnet-appdomain-type-method-invoke
