defaults:
  crit: hostile
  platforms: [windows]
  for: [pe, dll]
  attack: T1620
  mbc: E1059

composite_rules:
  - id: dotnet-fragmented-hex-appdomain-loader
    desc: Fragmented XOR payload loaded through AppDomain
    conf: 0.995
    attack: T1027,T1140,T1620
    mbc: B0032,C0043,E1059
    all:
      - id: objectives/anti-static/obfuscation/payload/encrypted::dotnet-fragmented-hex-xor-payload
      - id: micro-behaviors/process/interpreter/reflection/runtime::dotnet-appdomain-load-instance-tokens

  # Sized RGB recovery feeds the VB assembly-dispatch cast; type/method
  # invocation corroborates execution rather than unrelated plugin metadata.
  - id: dotnet-bitmap-fileless-method-loader
    desc: .NET bitmap assembly invokes in memory
    conf: 0.99
    all:
      - id: objectives/anti-static/obfuscation/steganography/image::vb-rgb-concealed-assembly
      - id: micro-behaviors/metaprogramming/reflection::appdomain-type-method-invoke-references
      - id: micro-behaviors/process/interpreter/reflection/vb::vb-latecall-token
