defaults:
  crit: hostile
  conf: 0.99
  platforms: [linux, windows]
  for: [elf, pe]
  attack: T1059,T1620,T1105
  mbc: B0022

composite_rules:
  - id: go-agent-fileless-remote-exec
    for: [elf]
    desc: Go agent remotely executes fileless payloads
    all:
      - id: metadata/binary/symbols/name/agent-routine::dispatcher-loop
      - id: metadata/binary/symbols/name/agent-routine::dispatcher-exec-handler
      - id: metadata/binary/symbols/name/agent-routine::fileless-exec-handler
      - id: micro-behaviors/mem/anonymous/create::memfd-create-go
      - id: metadata/binary/symbols/name/process::go-os-exec-package-reference

  - id: go-agent-windows-fileless-remote-exec
    desc: Go agent remotely executes a fileless payload on Windows
    platforms: [windows]
    for: [pe]
    all:
      - id: metadata/binary/symbols/name/agent-routine::dispatcher-loop
      - id: metadata/binary/symbols/name/agent-routine::dispatcher-exec-handler
      - id: metadata/binary/symbols/name/agent-routine::fileless-exec-handler
    any:
      - id: micro-behaviors/process/inject/remote-thread::remote-memory-thread-api-profile
      - id: micro-behaviors/mem/create/shared::nt-section-map-dynamic-apis
