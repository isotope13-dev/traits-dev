defaults:
  platforms:
    - unix
    - windows
  attack: T1620
traits:
  - id: sys-memfd-create
    desc: SYS_memfd_create syscall constant
    crit: suspicious
    conf: 0.6
    for: [scripts, pe, macho]
    if:
      type: string_literal
      substr: SYS_memfd_create
    unless:
      # pwntools ships syscall tables and shellcraft templates as reference data.
      - id: well-known/tool/offensive/pwntools::pwntools-distribution
  - id: sys-memfd-create-source
    desc: memfd_create syscall constant in source
    crit: component
    conf: 0.86
    for: [c, cpp, rust, go]
    if:
      type: text
      substr: SYS_memfd_create
    unless:
      - id: well-known/lib/platform/rust-system-bindings::rust-syscall-binding-crate
      - id: well-known/tool/sysadmin/cubesandbox::cubesandbox-source-path
      - type: text
        regex: 'Code generated for linux/[^ ]+ by .+--package-name=libc'
      # Vendored libc headers expose syscall constants but do not implement
      # fileless execution; the execution composites require stronger atoms.
      - type: path
        regex: '(?i)(^|[\\/])(libc|libcxx|libtsan)[\\/]'
  - id: syscall-319
    desc: memfd_create syscall number 319
    crit: suspicious
    conf: 0.4
    for: [scripts, binaries]
    if:
      type: text
      regex: syscall\s*\(\s*319
  - id: proc-self-fd-dup
    desc: /proc/self/fd descriptor path
    crit: component
    conf: 0.5
    for: [scripts, binaries]
    if:
      type: text
      substr: /proc/self/fd
    unless:
      - id: metadata/file/string/identity::chrome-sandbox-basename
      - id: well-known/app/ai/coding-agent/tabby::tabby-basename
      - type: text
        substr: gnulib/import/chdir-long.c
      - id: well-known/tool/reverse-engineering/windows-debugger/
      - id: metadata/library/structure/
      - id: well-known/app/development/calvyn-code
      - id: metadata/library/python-stdlib
  - id: proc-self-fd-dup-slash
    desc: /proc/self/fd/ path fragment
    crit: component
    conf: 0.5
    for: [scripts]
    if:
      type: string_literal
      substr: /proc/self/fd/
    unless:
      # AI-agent observability tools reference /proc/self/fd for stdout/tty
      # detection; security scanners list it as a signature.
      - id: well-known/tool/detection/ai-guardrail/
      - id: well-known/app/communication/telegram::telegram-desktop-third-party-source
      - id: well-known/app/development/calvyn-code
      - id: metadata/library/python-stdlib::python-stdlib-test-support
      - id: metadata/library/python-stdlib::python-stdlib-test-file
      - id: well-known/tool/detection/cilium-tetragon::source-path
      - id: well-known/app/system/omarchy::source-tree
  - id: unlink-argv0-source
    desc: Deletes argv0 executable path
    crit: suspicious
    conf: 0.86
    for: [c, cpp, elf]
    if:
      type: text
      regex: '\bunlink\s*\(\s*argv\s*\[\s*0\s*\]\s*\)'
    unless:
      - id: well-known/app/network/freeradius::freeradius-build-plugin-context
  - id: memfd-reexec-guard
    desc: memfd re-execution guard variable
    crit: suspicious
    conf: 0.86
    for: [c, cpp, rust, go, elf]
    if:
      type: text
      # Short env-var style guard (2-8 uppercase chars). Excludes the
      # common Linux kernel pattern `_MFD_<CHIPNAME>_<FILENAME>_H__`
      # (include guards for Multi-Function Device drivers), which are
      # long and always end in _H_ or _H__.
      regex: '(^|[^A-Z0-9_])_(MFD|MEMFD)_[A-Z0-9]{2,8}([^A-Z0-9_]|$)'
  - id: clears-memfd-cloexec
    desc: Clears close-on-exec on memfd
    crit: suspicious
    conf: 0.86
    for: [c, cpp, rust, go, elf]
    if:
      type: text
      regex: 'F_SETFD[\\s\\S]{0,120}(0|FD_CLOEXEC)_MALICIOUS'
  - id: ctypes-mod
    desc: ctypes module
    crit: component
    conf: 0.4
    for:
      - python
    if:
      type: string_literal
      substr: ctypes
  - id: ctypes-cdll-dup
    desc: ctypes CDLL native library loader
    crit: component
    conf: 0.5
    for:
      - python
    if:
      type: string_literal
      exact: CDLL
  - id: urllib-mod
    desc: urllib2 module
    crit: component
    conf: 0.3
    for:
      - python
    if:
      type: string_literal
      word: urllib2
  - id: http-client-dup
    desc: http.client module
    crit: component
    conf: 0.3
    for:
      - python
    if:
      type: string_literal
      substr: http.client
  - id: shm-open
    desc: shm_open POSIX shared memory
    crit: component
    conf: 0.5
    for: [scripts, binaries]
    if:
      type: string_literal
      substr: shm_open
  - id: native-memory-stage-command-menu
    desc: Memfd and shellcode staging menu
    crit: suspicious
    conf: 0.99
    platforms: [linux]
    for: [elf]
    if:
      type: text
      regex: '/memfd  /shellcode  /stage <url>  /dlopen <path\.so>'
composite_rules:
  - id: native-commanded-memfd-shellcode-stage
    desc: Native agent remotely stages memfd and shellcode payloads
    crit: hostile
    conf: 0.99
    attack: "T1105,T1620,T1055"
    platforms: [linux]
    for: [elf]
    all:
      - id: native-memory-stage-command-menu
      - id: syscall-319
      - id: micro-behaviors/fs/proc/info/path::process-fd-memfd-discovery

  - id: native-commanded-executable-memory-shellcode
    desc: Command agent maps shellcode into executable memory
    crit: hostile
    conf: 0.99
    attack: "T1055.001,T1620"
    platforms: [linux]
    for: [elf]
    all:
      - id: native-memory-stage-command-menu
      - id: micro-behaviors/mem/alloc/executable::mmap-symbol
      - id: objectives/command-and-control/backdoor/rat/tasking::secure-beacon-frame

  - id: python-http-memfd-exec
    desc: Python downloads a stage into memfd and executes it
    crit: hostile
    conf: 0.99
    attack: "T1105, T1620"
    for: [python]
    all:
      - id: micro-behaviors/communications/http/lib/urllib::urlopen-response-body-assignment
      - id: micro-behaviors/mem/anonymous/create::memfd-create-python
      - id: micro-behaviors/fs/file/write/direct::python-os-write-fd
      - id: micro-behaviors/process/create/direct::python-os-execve-call

  - id: python-requests-http-memfd-exec
    desc: Python requests stage into libc memfd then executes
    crit: hostile
    conf: 0.99
    attack: "T1105, T1620"
    for: [python]
    all:
      - id: micro-behaviors/communications/http/lib/requests::requests-get
      - id: micro-behaviors/communications/http/client/response-body::requests-response-body-access
      - id: micro-behaviors/mem/anonymous/create::python-libc-memfd-create
      - id: micro-behaviors/fs/file/write/direct::python-os-write-fd
    any:
      - id: micro-behaviors/process/create/direct::python-os-execve-call
      - id: micro-behaviors/process/create/direct::python-os-execv-call

  - id: python-architecture-adaptive-memfd-stage
    desc: Python selects an architecture-specific stage and executes it from memfd
    crit: hostile
    conf: 0.99
    attack: "T1105, T1082, T1620"
    for: [python]
    all:
      - id: micro-behaviors/os/sysinfo/platform/arch::arch-parameterized-variant
      - id: micro-behaviors/os/sysinfo/platform/runtime::python-platform-machine
      - id: micro-behaviors/mem/anonymous/create::memfd-create-python
      - id: micro-behaviors/process/create/direct::python-os-execve-call

  - id: python-shell-command-memfd-stage
    desc: Python downloads a stage into memfd through a shell command and executes it
    crit: hostile
    conf: 0.99
    attack: "T1105, T1620"
    for: [python]
    all:
      - id: micro-behaviors/mem/anonymous/create::memfd-create-python
      - id: micro-behaviors/fs/proc/info/path::python-self-process-fd-path
      - id: micro-behaviors/communications/http/download/cli::fetch-output-flag-script
      - id: micro-behaviors/process/create/local-exec::python-shell-variable-background-exec

  - id: python-shell-architecture-adaptive-memfd-stage
    desc: Python shell fetches architecture stage into memfd
    crit: hostile
    conf: 0.99
    attack: "T1105, T1082, T1620"
    for: [python]
    all:
      - id: python-shell-command-memfd-stage
      - id: micro-behaviors/os/sysinfo/platform/arch::arch-parameterized-variant

  - id: shell-fileless-fd-stage
    desc: Shell streams a remote payload into a discovered memfd and executes it
    crit: hostile
    conf: 0.99
    attack: "T1105, T1620"
    for: [shell]
    all:
      - id: micro-behaviors/communications/http/download/cli::fetch-output-flag-script
      - id: micro-behaviors/fs/proc/info/path::process-variable-fd-path
      - id: micro-behaviors/fs/proc/info/path::process-fd-memfd-discovery
      - id: micro-behaviors/process/create/local-exec::execute-variable-background

  - id: shell-user-process-memfd-stage
    desc: Shell overwrites a user-process memfd with remote stage
    crit: hostile
    conf: 0.99
    attack: "T1057, T1105, T1620"
    for: [shell]
    all:
      - id: shell-fileless-fd-stage
      - id: micro-behaviors/process/enumerate/shell::ps-current-user-process-list

  - id: shell-architecture-adaptive-fileless-stage
    desc: Shell selects an architecture-specific payload for fileless execution
    crit: hostile
    conf: 0.99
    attack: "T1105, T1082, T1620"
    for: [shell]
    all:
      - id: micro-behaviors/os/sysinfo/platform/arch::arch-parameterized-variant
      - id: micro-behaviors/os/sysinfo/platform/arch::sh-uname-fingerprint
      - id: micro-behaviors/fs/proc/info/path::process-variable-fd-path
      - id: micro-behaviors/fs/proc/info/path::process-fd-memfd-discovery
      - id: micro-behaviors/process/create/local-exec::execute-variable-background

  - id: http-download-python
    desc: Python HTTP download libraries for
    crit: component
    conf: 0.8
    attack: T1105
    for:
      - python
    any:
      - id: micro-behaviors/communications/http/lib/requests::requests-get
      - id: urllib-mod
      - id: micro-behaviors/communications/http/lib/urllib::urllib-urlopen
      - id: objectives/evasion/fileless/memory::http-client-dup
    unless:
      - id: micro-behaviors/crypto/library/blockchain/
  - id: proc-fd-path
    desc: Proc descriptor path fragment
    crit: component
    conf: 0.5
    for: [scripts, binaries, c, cpp, rust, go, elf]
    any:
      - id: objectives/evasion/fileless/memory::proc-self-fd-dup
      - id: objectives/evasion/fileless/memory::proc-self-fd-dup-slash
    unless:
      - id: metadata/library/structure/
      - id: well-known/lib/data/sql-js/
      - id: well-known/tool/sysadmin/unix-benign::kernelsu-daemon
      - id: well-known/tool/sysadmin/alpine-packages::alpine-ansible-core-package
      - id: well-known/tool/detection/cilium-tetragon::source-path
      - id: well-known/app/communication/telegram::telegram-desktop-third-party-source
  - id: memfd-reexec-target
    desc: Executes from memfd file descriptor
    crit: suspicious
    conf: 0.95
    for: [scripts, binaries, c, cpp, rust, go, elf]
    unless:
      - id: well-known/app/communication/telegram::telegram-desktop-third-party-source
    any:
      - id: micro-behaviors/process/create/exec::execveat-api-reference
      - id: proc-fd-exec
  - id: memfd-reexec-cleanup
    desc: Removes artifacts before memfd execution
    crit: suspicious
    conf: 0.92
    for: [c, cpp, rust, go, elf]
    unless:
      - id: well-known/app/development/kilocode::kilo-code-native-runtime
      - id: well-known/tool/reverse-engineering/frida/
    all:
      - id: micro-behaviors/fs/file/delete::unlink
    any:
      - id: clears-memfd-cloexec
      - id: memfd-reexec-guard
  - id: proc-fd-exec
    desc: Executes binary from /proc/self/fd
    crit: suspicious
    conf: 0.95
    for: [scripts, binaries]
    all:
      - id: proc-fd-path
      - id: exec-function
  - id: memfd-self-reexec
    desc: Re-executes itself from anonymous memory
    crit: hostile
    conf: 0.98
    attack: "T1620, T1070.004"
    for: [c, cpp, rust, go, elf]
    all:
      - id: micro-behaviors/mem/anonymous/create::memfd-create
      - id: micro-behaviors/fs/proc/info/path::process-self-exe-path
      - id: memfd-reexec-target
      - id: memfd-reexec-cleanup
  - id: ctypes-syscall
    desc: Direct syscall invocation via ctypes
    crit: suspicious
    conf: 0.9
    attack: T1106
    for:
      - python
    all:
      - id: ctypes-mod
      - id: micro-behaviors/os/syscall/invoke::python-dot-syscall
      - id: objectives/evasion/fileless/memory::ctypes-cdll-dup
  - id: download-memfd-exec
    desc: Downloads binary and executes via memfd
    crit: suspicious
    conf: 0.98
    for: [scripts, binaries]
    all:
      - id: http-download-python
      - id: memfd-create
    any:
      - id: exec-function
      - id: micro-behaviors/fs/file/write/direct::python-os-write-fd
  - id: shm-exec
    desc: Uses shared memory for fileless
    crit: suspicious
    conf: 0.9
    for: [scripts, binaries]
    all:
      - id: shm-open
    any:
      - id: micro-behaviors/fs/path/device/special::dev-shm-bare
      - id: micro-behaviors/mem/alloc/executable::mmap-symbol
      - id: micro-behaviors/process/create/execv::execve-fn
