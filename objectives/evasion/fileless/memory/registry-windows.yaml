# Registry-resident shellcode loaders keep a binary payload off disk and
# reconstruct it before an in-memory execution step.  The exact registry path
# and placeholder used by a campaign are intentionally not part of the rule.
defaults:
  platforms: [windows]
  for: [pe, dll, c, cpp, csharp, go, rust, python, powershell]
  attack: T1112,T1055,T1620

traits:
  - id: shellcode-marker
    desc: Shellcode marker
    crit: component
    conf: 0.84
    if:
      type: text
      regex: '(?i)\bshellcode\b'

  - id: registry-payload-forward
    desc: Registry then payload marker
    crit: component
    conf: 0.84
    if:
      type: text
      regex: '(?i)\bregistry\b.{0,80}\bpayload\b'

  - id: registry-payload-reverse
    desc: Payload then registry marker
    crit: component
    conf: 0.84
    if:
      type: text
      regex: '(?i)\bpayload\b.{0,80}\bregistry\b'

composite_rules:
  - id: registry-payload-marker
    desc: Registry-staged payload marker
    crit: component
    conf: 0.84
    any:
      - id: shellcode-marker
      - id: registry-payload-forward
      - id: registry-payload-reverse

  - id: encrypted-registry-pe-memory-loader
    desc: Encrypted registry PE stage injected into a remote process
    crit: hostile
    conf: 0.99
    attack: T1027,T1112,T1055,T1620
    all:
      - id: micro-behaviors/os/registry/access::registry-binary-value-write-source
      - id: micro-behaviors/crypto/symmetric/aes/cng::bcrypt-symmetric-crypto-source
      - id: micro-behaviors/data/embedded/payload/header::source-pe-header-validation
      - id: objectives/evasion/process/injection/memory::source-remote-thread-injection
    near_lines: 180

  - id: ntfs-ads-encrypted-memory-loader
    desc: Encrypted NTFS ADS stage executed from memory
    crit: hostile
    conf: 0.99
    attack: T1027,T1564.004,T1620
    all:
      - id: micro-behaviors/fs/path/stream::ntfs-ads-path-source
      - id: micro-behaviors/crypto/symmetric/aes/cng::bcrypt-symmetric-crypto-source
      - id: micro-behaviors/mem/protect/modify::virtual-alloc-source
      - id: micro-behaviors/process/thread/create::create-thread-source
    near_lines: 180

  - id: ntfs-ads-pe-memory-loader
    desc: NTFS ADS PE stage validated and executed in memory
    crit: hostile
    conf: 0.99
    attack: T1564.004,T1620
    all:
      - id: micro-behaviors/fs/path/stream::ntfs-ads-path-source
      - id: micro-behaviors/data/embedded/payload/header::source-pe-header-validation
      - id: micro-behaviors/mem/protect/modify::virtual-alloc-source
      - id: micro-behaviors/process/thread/create::create-thread-source
    near_lines: 180

  - id: registry-resident-shellcode-loader
    desc: Registry-stored payload with thread injection
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/os/registry/access::registry-binary-value-write-source
      - id: registry-payload-marker
      - id: objectives/evasion/process/injection/thread-hijacking::source-thread-context-hijack
    unless:
      - id: well-known/tool/reverse-engineering/
