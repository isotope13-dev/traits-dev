# Registry-resident shellcode loaders keep a binary payload off disk and
# reconstruct it before an in-memory execution step.  The exact registry path
# and placeholder used by a campaign are intentionally not part of the rule.
defaults:
  platforms: [windows]
  for: [pe, dll, c, cpp, csharp, go, rust, python, powershell]
  attack: T1112,T1055,T1620

traits:
  - id: registry-payload-marker
    desc: Shellcode or payload marker
    crit: component
    conf: 0.84
    if:
      type: text
      regex: '(?i)\b(shellcode|payload)\b'

  - id: user-registry-hive-staging
    desc: User registry hive in staged data
    crit: suspicious
    conf: 0.88
    if:
      type: text
      regex: '(?i)\b(HKCU|HKEY_CURRENT_USER)\b'

  - id: machine-registry-hive-staging
    desc: Machine registry hive in staged data
    crit: suspicious
    conf: 0.88
    if:
      type: text
      regex: '(?i)\b(HKLM|HKEY_LOCAL_MACHINE)\b'

composite_rules:
  - id: separate-user-machine-registry-staging
    desc: Separate user and machine registry staging
    crit: suspicious
    conf: 0.9
    all:
      - id: user-registry-hive-staging
      - id: machine-registry-hive-staging
    near_lines: 40

  - id: registry-resident-shellcode-loader
    desc: Registry payload with thread injection
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/os/registry/access::registry-binary-value-write-source
      - id: registry-payload-marker
      - id: separate-user-machine-registry-staging
      - id: objectives/evasion/process/injection/thread-hijacking::source-thread-context-hijack
    unless:
      - id: well-known/tool/reverse-engineering/
