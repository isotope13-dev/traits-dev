defaults:
  for: [pe]
  platforms: [windows]
  attack: T1055
  mbc: B0033
composite_rules:
  - id: rwx-threadpool-callback-stage-source
    desc: RWX memory stage executes through a thread-pool callback
    crit: hostile
    conf: 0.995
    attack: T1620
    for: [c, cpp]
    all:
      - id: micro-behaviors/mem/alloc/virtual::virtualalloc-rwx-source-reference
      - id: micro-behaviors/process/work/task::threadpool-work-lifecycle
      - id: micro-behaviors/process/work/task::threadpool-signature-near-pointer-call
    near_bytes: 2048

  - id: ntalloc-tiny-import-encrypted-stage-loader
    desc: Tiny-import NtAlloc host decrypts and calls an in-memory stage
    crit: hostile
    conf: 0.96
    attack: T1027,T1055,T1620
    for: [pe, dll]
    all:
      - id: micro-behaviors/mem/alloc/virtual::alloc-memory-sym--ntallocatevirtualmemory
      - id: micro-behaviors/mem/sync/cache::flush-instruction-cache
      - id: metadata/binary/section/entropy::high-entropy-rdata-section
      - id: metadata/binary/layout/size::tiny-pe
      - id: metadata/signature/absent::unsigned-missing-signature-record

  - id: fiber-xor-payload-loader
    desc: Fiber execution with bytewise payload decoding
    crit: hostile
    conf: 0.98
    attack: T1055,T1027,T1620
    for: [pe, dll]
    all:
      - id: micro-behaviors/process/fiber::switch-to-fiber
      - id: micro-behaviors/process/fiber::convert-thread-to-fiber
      - id: micro-behaviors/dylib/lookup::get-proc-address-import
      - id: micro-behaviors/data/decode/xor/transform::x64-byte-subtract-xor-store
  - id: encoded-self-loader
    desc: Self-reading encoded payload memory loader
    crit: hostile
    conf: 0.99
    all:
      - id: objectives/anti-static/obfuscation/payload/section/layout::m-padded-shellcode-rdata
      - id: micro-behaviors/fs/read/file/handle::pe-module-path-file-io-overlay
      - id: micro-behaviors/crypto/symmetric/stream/rc4/cipher::rc4-bytecode
    any:
      - id: micro-behaviors/mem/protect/modify/unspecified::virtual-protect-import
      - id: micro-behaviors/fs/read/file/handle::pe-module-path-large-overlay
      - id: metadata/binary/layout/size::medium-overlay-size
      - id: metadata/binary/layout/overlay::has-overlay
    needs: 2
  - id: raw-file-bytes-as-wait-callback
    desc: File bytes made executable via wait callback
    crit: hostile
    conf: 0.98
    attack: T1027.007,T1620
    size_max: 65536
    all:
      - id: objectives/anti-static/obfuscation/native-api-hash::djb2-native-ntdll-hash-profile
      - id: micro-behaviors/os/api-resolution/digest-export/walk::peb-ldr-list-access-x86
      - id: objectives/anti-static/obfuscation/native-api-hash::ntcreatefile-djb2-hash
      - id: objectives/anti-static/obfuscation/native-api-hash::ntqueryinformationfile-djb2-hash
      - id: objectives/anti-static/obfuscation/native-api-hash::ntreadfile-djb2-hash
      - id: objectives/anti-static/obfuscation/native-api-hash::ntclose-djb2-hash
      - id: objectives/anti-static/obfuscation/native-api-hash::ntprotectvirtualmemory-djb2-hash
      - id: objectives/anti-static/obfuscation/native-api-hash::rtlregisterwait-djb2-hash
