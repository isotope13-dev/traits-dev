# Amatera's decoded Python loader uses a raw allocated address as a fiber
# callback. See the Microsoft intrusion-chain analysis linked by ESET:
# https://www.microsoft.com/en-us/security/blog/2026/07/16/acr-stealer-two-observed-intrusion-chains-amid-increased-threat-activity/
defaults:
  platforms: [windows]
  for: [c, cpp, python]

composite_rules:
  - id: allocated-address-fiber-execution
    desc: Allocated fiber callback with fiber switching
    crit: suspicious
    conf: 0.96
    attack: T1620
    # Allocation-to-callback is bound by the atom. Fiber switching is nearby
    # corroboration; this does not prove which bytes populated the allocation.
    near_lines: 40
    all:
      - id: micro-behaviors/process/fiber::allocated-address-fiber-callback
      - id: micro-behaviors/process/fiber::source-switch-to-fiber
