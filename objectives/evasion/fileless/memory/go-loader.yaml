defaults:
  platforms:
  - unix
  for:
  - elf
traits:
- id: runmemfd-symbol
  desc: Go runMemfd function name
  crit: suspicious
  conf: 0.95
  if:
    type: text
    exact: main.runMemfd
- id: memfdcreate-symbol
  desc: Go memfdCreate function name
  crit: suspicious
  conf: 0.95
  if:
    type: text
    exact: main.memfdCreate
composite_rules:
- id: go-memfd-loader
  desc: Go memfd staging loader
  crit: suspicious
  conf: 0.96
  all:
  - id: objectives/evasion/fileless/memfd::proc-self-fd-dup
  needs: 2
  any:
  - id: runmemfd-symbol
  - id: memfdcreate-symbol
  - id: micro-behaviors/fs/proc/info/path::process-self-fd-path
- id: disguised-go-memfd-loader
  desc: Go memfd loader with masquerade
  crit: hostile
  conf: 0.98
  all:
  - id: go-memfd-loader
  - id: objectives/evasion/masquerade/process/system-name::fake-system-process
  any:
  - id: metadata/binary/section/size::go-large-noptrdata
  - id: metadata/lang/compiler/systems::go-elf-rich-runtime-metadata
- id: go-embedded-elf-memfd-loader
  desc: Go binary fileless-loads an embedded ELF
  crit: hostile
  conf: 0.96
  attack: T1620,T1027
  all:
  - id: micro-behaviors/data/embedded/payload/elf-native::base64-embedded-elf-image
  - id: micro-behaviors/mem/anonymous/create::memfd-create-go
  - id: micro-behaviors/data/decode/base64::go-base64-decode
  any:
  - id: micro-behaviors/process/create/system::go-os-exec-pclntab
  - id: micro-behaviors/process/create/system::go-os-exec
