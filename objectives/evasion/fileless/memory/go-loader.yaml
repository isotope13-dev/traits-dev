defaults:
  platforms:
    - unix
  for:
    - elf
traits:
  - id: runmemfd-symbol
    desc: Go runMemfd function name
    crit: suspicious
    conf: 0.95
    if:
      type: text
      exact: main.runMemfd
  - id: memfdcreate-symbol
    desc: Go memfdCreate function name
    crit: suspicious
    conf: 0.95
    if:
      type: text
      exact: main.memfdCreate
composite_rules:
  - id: go-memfd-loader
    desc: Go memfd staging loader
    crit: suspicious
    conf: 0.96
    all:
      - id: objectives/evasion/fileless/memory::proc-self-fd-dup
    needs: 2
    any:
      - id: runmemfd-symbol
      - id: memfdcreate-symbol
      - id: micro-behaviors/fs/proc/info/path::process-self-fd-path
  - id: disguised-go-memfd-loader
    desc: Go memfd loader with masquerade
    crit: hostile
    conf: 0.98
    all:
      - id: go-memfd-loader
      - id: objectives/evasion/masquerade/process/name::fake-system-process
    any:
      - id: metadata/binary/section/metrics::go-large-noptrdata
      - id: metadata/lang/compiler/systems::go-elf-rich-runtime-metadata
  # A Go binary that carries another ELF inside itself, decodes it, and has the
  # memfd + execve pair needed to run it without ever touching the filesystem.
  # The kong-ingress-controller image shipped a genuine controller with an
  # 8MB base64 XMRig appended and this loader wired into manager.open().
  #
  # The payload identity is deliberately not a leg: what convicts is that a
  # service binary carries and fileless-executes a second executable, which is
  # equally true when the passenger is a miner, a backdoor or a rootkit.
  - id: go-embedded-elf-memfd-loader
    desc: Go binary fileless-loads an embedded ELF
    crit: hostile
    conf: 0.96
    attack: T1620,T1027
    all:
      - id: micro-behaviors/data/embedded/payload/native-elf::base64-embedded-elf-image
      - id: micro-behaviors/mem/anonymous/create::memfd-create-go
      - id: micro-behaviors/data/decode/base64-symbol::go-base64-decode
    any:
      # The host binary's own way of launching the decoded image. The execve
      # syscall atoms belong to the passenger ELF, which is analyzed as a
      # separate unit, so they cannot serve as legs here.
      - id: micro-behaviors/process/create/system::go-os-exec-pclntab
      - id: micro-behaviors/process/create/system::go-os-exec
