# Process Ghosting: create an image section from a delete-pending file, map it
# into a suspended process, redirect its thread, and resume execution.
defaults:
  platforms: [windows]
  for: [pe, dll, c, cpp, csharp, go, rust, powershell]
  attack: T1055,T1620

composite_rules:
- id: process-ghosting
  for: [c, cpp]
  desc: Delete-disposition image section with suspended-thread redirection
  crit: hostile
  conf: 0.98
  all:
  - id: micro-behaviors/mem/create/shared::nt-create-section-api-string
  - id: micro-behaviors/mem/map::nt-map-view-section-api-string
  - id: micro-behaviors/mem/map::sec-image-mapping-flag
  - id: micro-behaviors/fs/file/handle::nt-set-information-file
  - id: micro-behaviors/fs/file/handle::file-disposition-information
  - id: micro-behaviors/fs/delete/file/library::windows-delete-file-flag
  - id: micro-behaviors/fs/write/file/handle::write-file-source
  - id: micro-behaviors/process/thread/config::context-rcx-offset-assignment
  - id: micro-behaviors/process/create/flags::create-suspended-flag-reference
  - id: micro-behaviors/process/thread/config::thread-context-write-source
  any:
  - id: micro-behaviors/process/thread/lifecycle::resume-thread
  - id: micro-behaviors/process/info/thread::resume-thread-source
  - id: micro-behaviors/process/inject/runtime/ntapi::nt-resume-thread
  needs: 1
