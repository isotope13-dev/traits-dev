defaults:
  platforms: [macos]
  for: [macho]
  attack: T1620
  mbc: B0033

composite_rules:
  - id: macos-memory-module-loader
    desc: Unsigned reflective Mach-O memory loader
    crit: hostile
    conf: 0.96
    all:
      - id: micro-behaviors/dylib/load/memory::mach-o-legacy-memory-module-loader
      - id: metadata/signed/trust-level::unsigned-macho
    any:
      - id: micro-behaviors/communications/socket/create::posix-socket-import
      - id: micro-behaviors/communications/http/client/initialize::cfhttp-create-request
      - id: micro-behaviors/process/create/shell/spawn::system-fn
      - id: micro-behaviors/process/create/shell/native::c-popen
      - id: micro-behaviors/process/create/fork::fork
    unless:
      - id: metadata/signed/platform::apple
