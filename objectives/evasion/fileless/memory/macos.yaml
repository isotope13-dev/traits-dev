defaults:
  platforms: [macos]
  for: [macho]
  attack: T1620
  mbc: B0033

composite_rules:
  - id: macos-memory-module-loader
    desc: Unsigned Mach-O memory loader with network or process APIs
    crit: suspicious
    conf: 0.9
    all:
      - id: micro-behaviors/dylib/load/memory::mach-o-legacy-memory-module-loader
      - id: metadata/signature/absent::unsigned-macho
    any:
      - id: micro-behaviors/communications/socket/create::posix-socket-import
      - id: micro-behaviors/communications/http/client/initialize::cfhttp-create-request
      - id: micro-behaviors/process/create/subprocess/reference::system-command-api-clues
      - id: metadata/binary/symbols/name/process::c-popen
      - id: micro-behaviors/process/create/fork::fork
    unless:
      - id: metadata/signature/verified/platform::apple
      - id: metadata/binary/header/identity::macho-dylib-stub
