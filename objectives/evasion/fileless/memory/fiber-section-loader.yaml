# Loaders that resolve CreateFiber from strings (often alongside LoadLibrary
# failures) and map a decrypted stage with NtCreateSection/NtMapViewOfSection.
defaults:
  platforms: [windows]
  for: [pe]
  attack: T1055,T1620
  mbc: B0033

composite_rules:
  - id: fiber-nt-section-map-loader
    desc: Fiber launch after Nt section mapping
    crit: hostile
    conf: 0.96
    all:
      - id: micro-behaviors/process/thread/lifecycle::create-fiber-api-string
      - id: micro-behaviors/mem/create/shared::nt-section-map-dynamic-apis
      - id: micro-behaviors/mem/protect/modify::virtual-protect
      - id: micro-behaviors/dylib/load/runtime::load-library-a
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/installer/family/
      - id: well-known/lib/crypto/openssl/
      - id: well-known/lib/runtime/mozilla-nspr/
