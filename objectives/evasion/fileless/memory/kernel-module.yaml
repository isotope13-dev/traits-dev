composite_rules:
- id: fileless-lkm-loading
  desc: Anonymous memory with kernel-module load APIs
  crit: suspicious
  conf: 1.0
  for:
  - elf
  - c
  all:
  - id: micro-behaviors/mem/anonymous/create::anonymous-file-reference-group
  - id: micro-behaviors/os/kernel/module::finit-module-operation
  unless:
  - id: metadata/package/files/system-package::libc-syscall-number-header
  downgrade:
    any:
    - id: well-known/tool/offensive/pwntools::pwntools-distribution
    - id: well-known/app/infrastructure/pihole::ftl-binary
    - id: well-known/lib/vendor-sdk/sogen/
    - id: well-known/tool/reverse-engineering/e9patch::source-context
    - id: well-known/tool/sysadmin/stress-ng::stress-ng-source-context
- id: source-fileless-lkm-loading
  desc: Anonymous memory and kernel-load API references
  crit: suspicious
  conf: 0.97
  for:
  - go
  - rust
  near_bytes: 4096
  all:
  - id: micro-behaviors/os/kernel/module::source-finit-module-api-reference
  any:
  - id: micro-behaviors/mem/anonymous/create::memfd-create
  - id: micro-behaviors/mem/anonymous/create::memfd-create-go
  unless:
  - id: micro-behaviors/os/security/sandbox::seccompiler-action-reference
defaults:
  platforms:
  - linux
  attack: T1620
