defaults:
  platforms: [windows]

composite_rules:
  - id: python-shellcode
    desc: Python decodes Base64 before changing memory protection with VirtualProtect
    crit: suspicious
    conf: 0.95
    attack: T1140,T1620
    mbc: B0033
    for:
      - python
    near_lines: 80
    all:
      - id: micro-behaviors/mem/protect/modify/page::virtualprotect-ctypes
    any:
      - id: micro-behaviors/data/encode/base64/primitive::b64encode-call
      - id: micro-behaviors/data/decode/base64/call::b64decode-call
