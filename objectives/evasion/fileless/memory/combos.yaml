traits:
- id: create-thread-sym
  desc: Remote thread creation symbol
  crit: component
  platforms:
  - windows
  for:
  - pe
  - dll
  if:
    id: micro-behaviors/process/inject/runtime/call::create-remote-thread-dup
- id: fexecve-symbol
  desc: 'Linux fexecve symbol ref (fileless execution)'
  crit: notable
  conf: 0.9
  platforms:
  - linux
  for:
  - elf
  if:
    type: symbol
    regex: ^_?fexecve$
- id: system-informer-marker
  desc: System Informer product marker
  crit: notable
  platforms:
  - windows
  for:
  - pe
  - dll
  if:
    type: text
    substr: System Informer
  unless:
  # Rufus credits System Informer code in its about dialog; that is not the
  # System Informer product itself.
  - id: well-known/app/utility/rufus::rufus-official-context
- id: protect-memory-sym--ntprotectvirtualmemory
  desc: VirtualProtectEx/NtProtectVirtualMemory (NtProte
  crit: notable
  for:
  - pe
  - dll
  platforms:
  - windows
  if:
    type: symbol
    exact: NtProtectVirtualMemory
  unless:
  - id: well-known/lib/platform/microsoft-wow64::microsoft-wow64-system-context
composite_rules:
- id: open-process-sym
  desc: OpenProcess/NtOpenProcess symbol
  crit: component
  platforms:
  - windows
  for:
  - pe
  - dll
  any:
  - id: micro-behaviors/process/create/spawn::open-process
  - id: micro-behaviors/os/syscall/raw::nt-open-process-ssn
- id: alloc-memory-sym
  desc: VirtualAllocEx/NtAllocateVirtualMemory symbol
  crit: component
  platforms:
  - windows
  for:
  - pe
  - dll
  any:
  - id: micro-behaviors/mem/alloc/remote::virtual-alloc-ex
  - id: micro-behaviors/mem/alloc/virtual::alloc-memory-sym--ntallocatevirtualmemory
- id: write-memory-sym
  desc: WriteProcessMemory/NtWriteVirtualMemory symbol
  crit: component
  platforms:
  - windows
  for:
  - pe
  - dll
  any:
  - id: micro-behaviors/process/inject/runtime/call::write-process-memory-binary
  - id: micro-behaviors/process/inject/runtime/call::write-memory-sym--ntwritevirtualmemory
- id: protect-memory-sym
  desc: VirtualProtectEx/NtProtectVirtualMemory symbol
  crit: component
  platforms:
  - windows
  for:
  - pe
  - dll
  any:
  - id: micro-behaviors/mem/protect/modify::virtual-protect-ex
  - id: protect-memory-sym--ntprotectvirtualmemory
- id: alloc-or-protect
  desc: Memory allocation or protection change
  crit: component
  platforms:
  - windows
  for:
  - pe
  - dll
  any:
  - id: alloc-memory-sym
  - id: protect-memory-sym
- id: remote-injection
  desc: Remote process memory manipulation
  crit: suspicious
  conf: 0.9
  attack: T1055
  platforms:
  - windows
  for:
  - pe
  - dll
  all:
  - id: open-process-sym
  - id: write-memory-sym
  - id: alloc-or-protect
  - id: create-thread-sym
  unless:
  - id: metadata/binary/symbols/count::many-exports
  - id: system-informer-marker
  - id: metadata/signed/leaf::google-inc
  - id: well-known/tool/reverse-engineering/exe2aut::exe2aut-decompiler
  downgrade:
    any:
    - id: well-known/game/steam::valve-corp-string
    - id: well-known/tool/development/debug/debugpy
    - id: well-known/game/mod/
- id: linux-memfd
  desc: Fileless execution via anonymous memory
  crit: suspicious
  conf: 0.9
  attack: T1055
  mbc: B0033
  platforms:
  - linux
  for:
  - elf
  all:
  - id: micro-behaviors/mem/anonymous/create::memfd-create
  any:
  - id: fexecve-symbol
  - id: micro-behaviors/process/create/direct::execve-import
  - id: micro-behaviors/mem/protect/modify::mprotect-import
  downgrade:
    any:
    - id: micro-behaviors/dylib/library/family/
- id: python-shellcode
  desc: Python shellcode injection via VirtualProtect
  crit: suspicious
  conf: 0.95
  attack: T1055
  mbc: B0033
  platforms:
  - windows
  for:
  - python
  all:
  - id: micro-behaviors/mem/protect/modify::virtualprotect-ctypes
  any:
  - id: micro-behaviors/data/encode/base64::b64encode-call
  - id: micro-behaviors/data/decode/symbol-base64::b64decode-call
