traits:
- id: create-thread-sym
  desc: Remote thread creation symbol
  crit: component
  platforms:
  - windows
  for:
  - pe
  - dll
  if:
    id: micro-behaviors/process/inject/runtime/call::create-remote-thread-dup
- id: fexecve-symbol
  desc: 'Linux fexecve symbol ref (fileless execution)'
  crit: notable
  conf: 0.9
  platforms:
  - linux
  for:
  - elf
  if:
    type: symbol
    regex: ^_?fexecve$
- id: system-informer-marker
  desc: System Informer product marker
  crit: notable
  platforms:
  - windows
  for:
  - pe
  - dll
  if:
    type: text
    substr: System Informer
  unless:
  # Rufus credits System Informer code in its about dialog; that is not the
  # System Informer product itself.
  - id: well-known/app/utility/rufus::rufus-official-context
- id: protect-memory-sym--ntprotectvirtualmemory
  desc: VirtualProtectEx/NtProtectVirtualMemory (NtProte
  crit: notable
  for:
  - pe
  - dll
  platforms:
  - windows
  if:
    type: symbol
    exact: NtProtectVirtualMemory
  unless:
  - id: well-known/lib/platform/microsoft-wow64::microsoft-wow64-system-context
composite_rules:
- id: open-process-sym
  desc: OpenProcess/NtOpenProcess symbol
  crit: component
  platforms:
  - windows
  for:
  - pe
  - dll
  any:
  - id: micro-behaviors/process/create/spawn::open-process
  - id: micro-behaviors/os/syscall/raw::nt-open-process-ssn
- id: alloc-memory-sym
  desc: VirtualAllocEx/NtAllocateVirtualMemory symbol
  crit: component
  platforms:
  - windows
  for:
  - pe
  - dll
  any:
  - id: micro-behaviors/mem/alloc/remote::virtual-alloc-ex
  - id: micro-behaviors/mem/alloc/virtual::alloc-memory-sym--ntallocatevirtualmemory
- id: write-memory-sym
  desc: WriteProcessMemory/NtWriteVirtualMemory symbol
  crit: component
  platforms:
  - windows
  for:
  - pe
  - dll
  any:
  - id: micro-behaviors/process/inject/runtime/call::write-process-memory-binary
  - id: micro-behaviors/process/inject/runtime/call::write-memory-sym--ntwritevirtualmemory
- id: protect-memory-sym
  desc: VirtualProtectEx/NtProtectVirtualMemory symbol
  crit: component
  platforms:
  - windows
  for:
  - pe
  - dll
  any:
  - id: micro-behaviors/mem/protect/modify::virtual-protect-ex
  - id: protect-memory-sym--ntprotectvirtualmemory
- id: alloc-or-protect
  desc: Memory allocation or protection change
  crit: component
  platforms:
  - windows
  for:
  - pe
  - dll
  any:
  - id: alloc-memory-sym
  - id: protect-memory-sym
- id: remote-injection
  desc: Remote process memory manipulation
  crit: suspicious
  conf: 0.9
  attack: T1055
  platforms:
  - windows
  for:
  - pe
  - dll
  all:
  - id: open-process-sym
  - id: write-memory-sym
  - id: alloc-or-protect
  - id: create-thread-sym
  unless:
  - id: metadata/binary/symbols/count::many-exports
  - id: system-informer-marker
  - id: metadata/signed/leaf::google-inc
  - id: well-known/tool/reverse-engineering/exe2aut::exe2aut-decompiler
  downgrade:
    any:
    - id: well-known/game/steam::valve-corp-string
    - id: well-known/tool/development/debug/debugpy
    - id: well-known/game/mod/
- id: linux-memfd
  desc: Fileless execution via anonymous memory
  crit: suspicious
  conf: 0.9
  attack: T1055
  mbc: B0033
  platforms:
  - linux
  for:
  - elf
  all:
  - id: micro-behaviors/mem/anonymous/create::memfd-create
  any:
  - id: fexecve-symbol
  - id: micro-behaviors/process/create/direct::execve-import
  - id: micro-behaviors/mem/protect/modify::mprotect-import
  unless:
  # glibc does not call memfd_create and execve, it IS memfd_create and
  # execve -- every leg of this rule is a function libc.so.6 exports. The
  # identity is content (libc SONAME plus the libc binary marker), not a
  # filename, so a dropper named libc.so.6 does not inherit it. Seen on the
  # official gcc:bookworm image's usr/lib/x86_64-linux-gnu/libc.so.6.
  - id: well-known/lib/native/glibc::libc-runtime
  # Same argument one level up: CPython *implements* os.memfd_create and
  # os.execve, so the interpreter binary carries every leg of this rule as
  # part of its published API. Debian's /usr/bin/python3.11 in the official
  # gcc:bookworm image scored suspicious on it.
  - id: well-known/lib/runtime/scripted/cpython::cpython-interpreter-binary
  # And libgo, gccgo's Go runtime library, which implements the syscall
  # package's memfd/exec wrappers for every gccgo-built program.
  - id: metadata/lang/runtime::go-runtime-marker
  # GLib's file-portal helper uses memfd_create and mprotect. The library
  # exports that API; it is not a fileless payload.
  - id: well-known/lib/runtime/native-platform/glib::libglib-basename
  downgrade:
    any:
    - id: micro-behaviors/dylib/library/family/
- id: python-shellcode
  desc: Python decodes Base64 before changing memory protection with VirtualProtect
  crit: suspicious
  conf: 0.95
  attack: T1140,T1620
  mbc: B0033
  platforms:
  - windows
  for:
  - python
  near_lines: 80
  all:
  - id: micro-behaviors/mem/protect/modify::virtualprotect-ctypes
  any:
  - id: micro-behaviors/data/encode/base64::b64encode-call
  - id: micro-behaviors/data/decode/symbol-base64::b64decode-call
