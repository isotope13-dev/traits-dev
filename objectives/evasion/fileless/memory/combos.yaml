traits:
- id: create-thread-sym
  desc: Remote thread creation symbol
  crit: component
  platforms:
  - windows
  for:
  - pe
  - dll
  if:
    id: micro-behaviors/process/inject/runtime/call::create-remote-thread-dup
- id: system-informer-marker
  desc: System Informer product marker
  crit: notable
  platforms:
  - windows
  for:
  - pe
  - dll
  if:
    type: text
    substr: System Informer
  unless:
  - id: well-known/app/utility/rufus::rufus-official-context
- id: protect-memory-sym--ntprotectvirtualmemory
  desc: VirtualProtectEx/NtProtectVirtualMemory (NtProte
  crit: notable
  for:
  - pe
  - dll
  platforms:
  - windows
  if:
    type: symbol
    exact: NtProtectVirtualMemory
  unless:
  - id: well-known/lib/platform/microsoft-wow64::microsoft-wow64-system-context
composite_rules:
- id: open-process-sym
  desc: OpenProcess/NtOpenProcess symbol
  crit: component
  platforms:
  - windows
  for:
  - pe
  - dll
  any:
  - id: micro-behaviors/process/attach/rights::open-process
  - id: micro-behaviors/os/syscall/raw::nt-open-process-ssn
- id: write-memory-sym
  desc: WriteProcessMemory/NtWriteVirtualMemory symbol
  crit: component
  platforms:
  - windows
  for:
  - pe
  - dll
  any:
  - id: micro-behaviors/process/inject/runtime/call::write-process-memory-binary
  - id: micro-behaviors/process/inject/runtime/call::write-memory-sym--ntwritevirtualmemory
- id: protect-memory-sym
  desc: VirtualProtectEx/NtProtectVirtualMemory symbol
  crit: component
  platforms:
  - windows
  for:
  - pe
  - dll
  any:
  - id: micro-behaviors/mem/protect/modify::virtual-protect-ex
  - id: protect-memory-sym--ntprotectvirtualmemory
- id: alloc-or-protect
  desc: Memory allocation or protection change
  crit: component
  platforms:
  - windows
  for:
  - pe
  - dll
  any:
  - id: micro-behaviors/mem/combined::virtual-allocation-api-alternative
  - id: protect-memory-sym
- id: remote-injection
  desc: Remote process memory manipulation
  crit: suspicious
  conf: 0.9
  attack: T1055
  platforms:
  - windows
  for:
  - pe
  - dll
  all:
  - id: open-process-sym
  - id: write-memory-sym
  - id: alloc-or-protect
  - id: create-thread-sym
  unless:
  - id: metadata/binary/symbols/count::many-exports
  - id: system-informer-marker
  - id: metadata/signed/leaf::google-inc
  - id: well-known/tool/reverse-engineering/exe2aut::exe2aut-decompiler
  downgrade:
    any:
    - id: well-known/game/steam::valve-corp-string
    - id: well-known/tool/development/debug/debugpy
    - id: well-known/game/mod/
- id: linux-memfd
  desc: Fileless execution via anonymous memory
  crit: suspicious
  conf: 0.9
  attack: T1055
  mbc: B0033
  platforms:
  - linux
  for:
  - elf
  all:
  - id: micro-behaviors/mem/anonymous/create::memfd-create
  any:
  # The canonical neutral fexecve reference lives in process/create; this
  # composite adds the memfd staging that makes the fd-execution fileless.
  - id: micro-behaviors/process/create/direct::fexecve-import
  - id: micro-behaviors/process/create/exec::execve-import
  # mprotect is not an execution leg: memfd + mmap + mprotect is how JITs
  # and FFI closure allocators (libjffi, libffi) double-map W^X trampolines.
  unless:
  - id: well-known/tool/development/agent/anthropic-claude-agent::claude-agent-native-runtime
  - id: well-known/lib/native/glibc::libc-runtime
  - id: well-known/lib/runtime/scripted/cpython::cpython-interpreter-binary
  - id: metadata/lang/runtime::go-runtime-marker
  - id: well-known/lib/runtime/native-platform/glib::libglib-basename
  - id: metadata/package/tooling::lxc-runtime
  downgrade:
    any:
    - id: micro-behaviors/dylib/library/family/
- id: python-shellcode
  desc: Python decodes Base64 before changing memory protection with VirtualProtect
  crit: suspicious
  conf: 0.95
  attack: T1140,T1620
  mbc: B0033
  platforms:
  - windows
  for:
  - python
  near_lines: 80
  all:
  - id: micro-behaviors/mem/protect/modify::virtualprotect-ctypes
  any:
  - id: micro-behaviors/data/encode/base64::b64encode-call
  - id: micro-behaviors/data/decode/base64::b64decode-call
