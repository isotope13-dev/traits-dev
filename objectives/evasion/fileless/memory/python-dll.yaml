# A user-writable embedded-DLL loader is suspicious by itself.  Combined with
# embedded PE observations plus a transfer-of-execution primitive, it is a
# high-confidence staged loader pattern.  Without execution transfer the same
# legs describe a documented helper library (bundled native component loaded
# for in-process calls), so the hostile verdict requires the transfer.
defaults:
  platforms: [windows]
  for: [python]
  attack: T1055.001

composite_rules:
  - id: python-embedded-appdata-dll-loader
    desc: Embedded APPDATA DLL staged for execution transfer
    crit: hostile
    conf: 0.98
    scope: file
    all:
      - id: micro-behaviors/fs/write/file/target::python-writes-dll-under-appdata
      - id: micro-behaviors/process/create/load/local::python-ctypes-windll-load
      - id: micro-behaviors/data/embedded/payload/array::python-references-embedded-pe-module
    any:
      - id: micro-behaviors/process/inject/dll::create-remote-thread-python-source
      - id: micro-behaviors/process/inject/apc::nt-queue-apc-thread-reference
