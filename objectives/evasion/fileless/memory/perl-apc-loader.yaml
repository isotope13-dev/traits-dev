defaults:
  platforms: [windows]
  for: [perl]

traits:
  - id: perl-queue-api-prefix-characters
    desc: Builds Queue API prefix from characters
    crit: notable
    conf: 0.98
    if:
      type: text
      regex: "['\"]Q['\"]\\s*,\\s*['\"]u['\"]\\s*,\\s*['\"]e['\"]\\s*,\\s*['\"]u['\"]\\s*,\\s*['\"]e['\"]"
  - id: perl-user-apc-api-suffix-characters
    desc: Builds UserAPC API suffix from characters
    crit: notable
    conf: 0.98
    if:
      type: text
      regex: "['\"]U['\"]\\s*,\\s*['\"]s['\"]\\s*,\\s*['\"]e['\"]\\s*,\\s*['\"]r['\"]\\s*,\\s*['\"]A['\"]"
  - id: perl-xor-byte-vector
    desc: XOR-decodes a Perl byte vector
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: '\bvec\s*\([^\r\n]{0,100},\s*8\s*\)\s*\^='
  - id: perl-rwx-allocation-call
    desc: Calls API with executable allocation flags
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: '->Call\s*\([^\r\n]{0,100}0x3000\s*,\s*0x40\s*\)'

composite_rules:
  - id: perl-obfuscated-apc-payload-loader
    desc: Perl decodes payload into APC execution
    crit: hostile
    conf: 0.99
    attack: T1027,T1055.004,T1620
    all:
      - id: perl-queue-api-prefix-characters
      - id: perl-user-apc-api-suffix-characters
      - id: perl-xor-byte-vector
      - id: perl-rwx-allocation-call
