# Python memory runners
defaults:
  platforms: [linux, macos, windows, unix, android, ios]
composite_rules:
  - id: python-shellcode-runner
    desc: Python makes a buffer RWX and invokes it through ctypes
    crit: hostile
    conf: 0.95
    for: [python]
    attack: T1620
    near_lines: 40
    all:
      - id: micro-behaviors/mem/protect/modify::python-virtualprotect-rwx
      - id: micro-behaviors/dylib/load/ffi::ctypes-callback-cast
