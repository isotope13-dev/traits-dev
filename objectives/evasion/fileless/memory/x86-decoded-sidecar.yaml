defaults:
  platforms: [windows]
  for: [pe, dll]
composite_rules:
  - id: x86-obfuscated-buffer-shellcode-loader
    desc: Concealed APIs decode and execute shellcode
    crit: hostile
    conf: 0.98
    attack: T1027,T1620
    all:
      - id: micro-behaviors/data/decode/xor::x86-stack-byte-sub-xor-add-loop
      - id: micro-behaviors/data/decode/xor::x86-rolling-xor-decrement-buffer
      - id: micro-behaviors/mem/protect/modify::x86-rx-protect-buffer-then-call
      - id: micro-behaviors/dylib/lookup::get-proc-address-import
