# Loaders that decrypt a stage with BCrypt, place it in memory obtained and
# re-protected through runtime-resolved NtAllocateVirtualMemory and
# NtProtectVirtualMemory, and start it with CreateFiber. The fiber API is
# named only as a string for GetProcAddress, so it never appears in the
# import table; the stage runs as raw code in the loader's own process.
defaults:
  platforms: [windows]
  for: [pe, dll]
  attack: T1620,T1106
  mbc: B0033

composite_rules:
  - id: bcrypt-decrypted-fiber-nt-alloc-loader
    desc: Decrypted stage run via fiber in Nt-allocated memory
    crit: hostile
    conf: 0.92
    all:
      - id: micro-behaviors/process/thread/lifecycle::create-fiber-api-string
      - id: micro-behaviors/mem/alloc/virtual::nt-allocate-virtual-memory-api
      - id: micro-behaviors/mem/protect/modify::nt-protect-virtual-memory-name
      - id: micro-behaviors/crypto/library/cryptoapi::bcrypt-decrypt-api
      - id: micro-behaviors/dylib/load/runtime::load-library-a
    unless:
      - id: metadata/signed/platform/
      - id: well-known/lib/crypto/openssl/
