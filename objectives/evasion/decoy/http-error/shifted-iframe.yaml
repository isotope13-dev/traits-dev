defaults:
  for: [html]
  platforms: [windows, unix]
composite_rules:
  - id: not-found-page-concealed-iframe-reconstruction
    desc: Error-titled page reconstructs concealed external iframe markup
    crit: suspicious
    conf: 0.99
    all:
      - id: metadata/document/html::not-found-error-title
      - id: objectives/anti-static/obfuscation/encoding/arithmetic::shifted-hidden-iframe-document-reconstruction
  - id: not-found-rot-hidden-iframe
    desc: Not-found page hides a decoded iframe
    crit: hostile
    conf: 0.96
    all:
      - id: metadata/document/html::not-found-error-title
      - id: micro-behaviors/data/decode/custom::js-charcode-minus-one
      - id: metadata/file/encoding::shifted-percent-char-iframe
    near_bytes: 4096
