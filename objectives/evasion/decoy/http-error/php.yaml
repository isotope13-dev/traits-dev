defaults:
  platforms: [windows, unix]
  for:
    - php
  mbc: B0011
  attack: T1036
traits:
  - id: header-404
    desc: Sets 404 via header() function
    crit: notable
    conf: 0.7
    if:
      type: string_literal
      regex: header\s*\(\s*['"]HTTP/[^"']{1,20}404
  - id: header-403
    desc: Sets 403 via header() function
    crit: notable
    conf: 0.7
    if:
      type: string_literal
      regex: header\s*\(\s*['"]HTTP/[^"']{1,20}403
  - id: fake-nginx-404
    desc: Fake nginx 404 error HTML
    crit: notable
    conf: 0.85
    for: [php, python, shell, source, text]
    if:
      type: text
      regex: <center><h1>404 Not Found</h1></center>[^<]{0,30}<hr><center>nginx
  - id: fake-apache-404
    desc: Fake Apache 404 error HTML
    crit: notable
    conf: 0.85
    if:
      type: string_literal
      regex: The requested URL[^<]{0,100}was not found on this server
  - id: fake-iis-404
    desc: Fake IIS 404 error HTML
    crit: notable
    conf: 0.85
    if:
      type: string_literal
      regex: HTTP Error 404[^<]{0,50}The resource you are looking for
  - id: nginx-unconditional-204-route
    desc: Nginx location returns 204 unconditionally
    crit: suspicious
    conf: 0.93
    for: [shell, source, text]
    if:
      type: text
      regex: '(?is)\blocation\s+\S{1,80}\s*\{.{0,120}\breturn\s+204\s*;'
composite_rules:
  - id: http-204-nginx-404-decoy
    desc: HTTP 204 response carries a stock Nginx 404 error body
    crit: hostile
    conf: 0.99
    attack: T1036,T1071.001
    for: [python]
    all:
      - id: micro-behaviors/communications/http/response::http-204-no-content-status
      - id: fake-nginx-404
    near_bytes: 2048

  - id: sni-gated-http-decoy-front-end
    desc: TLS SNI rejection is paired with an HTTP 204/404 decoy
    crit: hostile
    conf: 0.99
    attack: T1036,T1071.001,T1573.002
    for: [python]
    all:
      - id: micro-behaviors/communications/socket/ssl::tls-unrecognized-name-alert
      - id: http-204-nginx-404-decoy
    near_bytes: 4096

  - id: nginx-sni-204-front-end
    desc: Nginx SNI rejection is paired with an unconditional 204 route
    crit: suspicious
    conf: 0.96
    attack: T1036,T1071.001,T1573.002
    for: [shell]
    all:
      - id: micro-behaviors/communications/socket/ssl::nginx-ssl-reject-handshake
      - id: nginx-unconditional-204-route
    near_bytes: 2048

  - id: fake-404-decoy
    desc: Fake 404 error page decoy
    crit: suspicious
    conf: 0.9
    mbc: B0011.001
    all:
      - id: micro-behaviors/communications/http/response::php-http-response-code-404
    any:
      - id: fake-nginx-404
      - id: fake-apache-404
      - id: fake-iis-404
    unless:
      - id: well-known/app/publishing/wordpress-plugins/
  - id: fake-404-header-decoy
    desc: Fake 404 via header() with decoy HTML
    crit: suspicious
    conf: 0.9
    mbc: B0011.001
    all:
      - id: header-404
    any:
      - id: fake-nginx-404
      - id: fake-apache-404
      - id: fake-iis-404
  - id: server-targeted-decoy
    desc: Server-type targeted decoy page
    crit: suspicious
    conf: 0.9
    mbc: B0011.001
    all:
      - id: micro-behaviors/os/sysinfo/platform/runtime::server-software-access
      - id: micro-behaviors/os/sysinfo/platform/runtime::server-software-type-check
    any:
      - id: fake-404-decoy
      - id: fake-404-header-decoy
