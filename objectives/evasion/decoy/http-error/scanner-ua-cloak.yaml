# Scanner-denial cloaking: a PHP page that reads the inbound User-Agent,
# matches it against shell-tool/crawler vocabulary, and answers 404 hides
# its real content from crawlers and security scanners while serving it to
# browsers (webshell block_bot() gates are the canonical use). The same
# combination is also written by anti-scraping plugins, which keeps this
# suspicious rather than hostile; webshell context raises it.
defaults:
  platforms: [windows, unix]
  for: [php]

composite_rules:
  - id: scanner-ua-404-cloak
    desc: Serves 404 to scanner or shell-tool User-Agents
    crit: suspicious
    conf: 0.95
    near_bytes: 600
    all:
      - id: micro-behaviors/communications/http/user-agent::read-server-ua-php
      - id: micro-behaviors/communications/http/user-agent::scanner-tool-ua-denial-list
      - id: micro-behaviors/communications/http/response::php-header-status-404
