defaults:
  platforms: [unix, windows]
  for: [php, asp]
  crit: hostile
  conf: 0.96
  attack: T1036

composite_rules:
  # Whole-file co-occurrence: the shell's access filter can precede its
  # command handler by several kilobytes. A 404 alone is ordinary HTTP;
  # require the independently established command webshell and client-IP use.
  - id: php-ip-aware-command-shell-404
    desc: IP-aware command webshell includes 404 response
    for: [php]
    all:
      - id: objectives/command-and-control/backdoor/webshell/request/command::php-variable-command-webshell
      - id: micro-behaviors/communications/http/request/cgi::php-allowed-ip-array-client-reference
      - id: micro-behaviors/communications/http/response::php-header-status-404

  - id: asp-ip-aware-command-shell-404
    desc: IP-aware ASP command shell includes 404
    platforms: [windows]
    for: [asp]
    all:
      - id: objectives/command-and-control/backdoor/webshell/request/command::classic-asp-command-form-wsh-execution
      - id: micro-behaviors/communications/http/server/request::asp-remote-addr-read
      - id: micro-behaviors/communications/http/response::asp-404-status-response
