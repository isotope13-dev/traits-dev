defaults:
  platforms: [windows, unix]
  for: [php]

traits:
  # WordPress displays these descriptions on the native application-password
  # approval page.  Removing both descriptions changes the user's consent
  # context; the precise selector pair avoids treating ordinary display:none
  # CSS as deceptive behavior.
  - id: hides-wp-application-password-descriptions
    desc: Hides WP application-password descriptions
    crit: suspicious
    conf: 0.98
    if:
      type: text
      regex: '#description-approve,\s*#description-reject\s*\{[^}]{0,60}display\s*:\s*none'
