# A privacy product explicitly claiming that it collects no telemetry while
# its background worker exports identified browsing context is deceptive user
# consent, not merely an undocumented analytics event.
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript, html, chrome-manifest, crx, zip, archives]
  attack: T1036,T1041

composite_rules:
  - id: false-no-telemetry-extension-claim
    desc: Extension contradicts no-telemetry claim with navigation exfiltration
    crit: hostile
    conf: 0.99
    scope: archive
    all:
      - id: micro-behaviors/ui/help::no-telemetry-privacy-claim
      - id: objectives/exfiltration/http/browser-extension::extension-navigation-sentry-exfil
