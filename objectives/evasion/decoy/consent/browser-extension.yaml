# A privacy product explicitly claiming that it collects no telemetry while
# its background worker exports identified browsing context is deceptive user
# consent, not merely an undocumented analytics event.
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript, html, chrome-manifest, crx, zip]
  attack: T1036,T1041

composite_rules:
  - id: false-no-telemetry-extension-claim
    desc: Extension contradicts no-telemetry claim with navigation exfiltration
    crit: hostile
    conf: 0.99
    scope: archive
    all:
      - id: micro-behaviors/ui/help/message::no-telemetry-privacy-claim
      - id: objectives/exfiltration/http/browser-extension::extension-navigation-sentry-exfil

  # An extension UI form that hides a national-ID input while JavaScript
  # POSTs a national-ID field to a remote JSON endpoint.
  - id: extension-hidden-identity-input-upload
    desc: Extension form pairs hidden national ID input with JSON POST
    crit: suspicious
    conf: 0.96
    scope: archive
    for: [crx, xpi, zip, chrome-manifest, html, javascript, typescript]
    all:
      - id: metadata/file/format/browser-extension::is-chrome-manifest
      - id: micro-behaviors/ui/controls/input::hidden-national-id-input-tag
      - id: micro-behaviors/communications/http/request/json::json-body-post
      - id: micro-behaviors/communications/url/host/domain-http::extension-external-url-literal
      - id: objectives/exfiltration/stealer/account-identity::national-identity-number-field
