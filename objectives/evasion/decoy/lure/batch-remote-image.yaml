# BAT.Starter / phishing lure: open a remote image via Explorer to occupy the
# user, then START /B a local payload. The remote image open alone is suspicious;
# pairing it with a hidden executable start is hostile.
defaults:
  platforms: [windows]
  for: [batch, powershell]
  attack: T1036.005

traits:
  - id: explorer-remote-http-image
    desc: Explorer opens remote HTTP image
    crit: suspicious
    conf: 0.9
    if:
      type: text
      regex: '(?i)\bexplorer(\.exe)?\s+https?://\S+\.(png|jpe?g)\b'

composite_rules:
  - id: remote-image-decoy-background-exec
    desc: Remote image decoy covers background execution
    crit: hostile
    conf: 0.95
    all:
      - id: explorer-remote-http-image
      - id: micro-behaviors/process/daemonize/spawn::start-no-new-window
      - id: objectives/command-and-control/dropper/execution/batch::start-exe
