# The visible copy tells the reader the page is an account notice and
# to close it and reopen email, covering a script that loads beside it.
defaults:
  platforms: [windows, unix]
  for: [html]
  conf: 0.93
traits:
  - id: account-notice-reopen-email
    desc: Account notice says reopen email
    crit: notable
    if:
      type: text
      regex: '(?is)about your account[\s\S]{0,80}open your email'
      exclude_html_comments: true
composite_rules:
  - id: account-notice-remote-vbscript
    desc: Account notice page loads remote VBScript
    crit: hostile
    conf: 0.97
    attack: T1566.001,T1105
    near_bytes: 2000
    all:
      - id: account-notice-reopen-email
      - id: micro-behaviors/process/interpreter/scripting::html-vbscript-block
      - id: micro-behaviors/communications/http/client/resource::remote-script-element-source
    unless:
      - id: metadata/path::test-directory-component
      - id: metadata/path::example-directory-component
