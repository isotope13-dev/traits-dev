defaults:
  platforms:
    - unix
    - windows
  for: [scripts, binaries]
traits:
  - id: game-over-score-banner
    desc: Embedded console game score banner
    crit: suspicious
    conf: 0.88
    platforms: [windows]
    for: [pe]
    if:
      type: text
      exact: 'Game Over!! Score:'
composite_rules:
  - id: console-game-decoy
    for: [pe]
    desc: Console game decoy interaction
    crit: suspicious
    conf: 0.9
    all:
      - id: game-over-score-banner
      - id: micro-behaviors/os/console/control::pause-string
    any:
      - id: micro-behaviors/hardware/input/keyboard/poll::get-async-key-state
      - id: micro-behaviors/fs/path/application/executable::cmd-exe-image-name
      - id: micro-behaviors/process/create/spawn::create-process-w
