defaults:
  platforms: [windows, unix]
  for: [html]
composite_rules:
  - id: empty-blog-loading-shortener-handoff
    desc: Empty blog shows loading cover during a shortened redirect
    crit: suspicious
    conf: 0.94
    size_max: 32768
    all:
      - id: metadata/document/html::loading-only-title
      - id: metadata/document/html::empty-blogger-main-section
      - id: micro-behaviors/ui/window/navigation::instant-shortened-meta-refresh
