# An archive that carries an inner archive together with a note giving its
# password. Shipping the password beside the encrypted payload removes any
# confidentiality the password could offer; what remains is that scanners on
# the way in cannot open the inner archive. Seen with authority-themed lures
# (tax office, court, bank) where the inner archive is named like a document.
defaults:
  platforms: [windows]
  for: [zip, rar, 7z, text]
  attack: T1027.013,T1204.002
  mbc: F0008

# A game cheat that tells the user to open the game and "perform the
# injection" is asking for a loader that injects into the game process. Paired
# with a passworded inner archive no scanner can open, this is the cheat-loader
# delivery bundle that carries stealers; the instructions are the tell.
traits:
- id: game-injection-usage-steps
  desc: Usage steps instruct game injection
  crit: notable
  conf: 0.88
  for: [text]
  size_max: 2048
  if:
    type: text
    regex: '(?i)(open|launch|start) the game[^.\n]{0,30}inject'

composite_rules:
- id: nested-archive-with-password-note
  desc: Archive bundles inner archive with its password
  crit: suspicious
  conf: 0.9
  scope: archive
  all:
    - id: micro-behaviors/ui/window/display::archive-access-code-note
  any:
    - id: metadata/archive/member/extension::archive-nested-rar-member
    - id: metadata/archive/member/extension::archive-nested-zip-member
    - id: metadata/archive/member/extension::archive-nested-7z-member
  unless:
    # A Go module source archive is a fetched source tree. Its documentation
    # (for example a Vagrant setup guide's `Password: vagrant`) and its test
    # fixtures are unrelated members, not a lure bundling its own password.
    - id: metadata/package/manager::go-module-source-archive

- id: document-named-archive-with-password-note
  desc: Document-named inner archive ships with password
  crit: hostile
  conf: 0.92
  scope: archive
  all:
    - id: micro-behaviors/ui/window/display::plain-text-access-code-value
    - id: metadata/archive/member/extension::archive-document-named-nested-archive

- id: game-injection-bundle-with-password-note
  desc: Passworded inner archive with game-injection steps
  crit: hostile
  conf: 0.9
  scope: archive
  all:
    - id: micro-behaviors/ui/window/display::archive-access-code-note
    - id: game-injection-usage-steps
  any:
    - id: metadata/archive/member/extension::archive-nested-rar-member
    - id: metadata/archive/member/extension::archive-nested-zip-member
    - id: metadata/archive/member/extension::archive-nested-7z-member
