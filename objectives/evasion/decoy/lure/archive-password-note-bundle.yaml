# An archive that carries an inner archive together with a note giving its
# password. Shipping the password beside the encrypted payload removes any
# confidentiality the password could offer; what remains is that scanners on
# the way in cannot open the inner archive. Seen with authority-themed lures
# (tax office, court, bank) where the inner archive is named like a document.
defaults:
  platforms: [windows]
  for: [zip, rar, 7z, text]
  attack: T1027.013,T1204.002
  mbc: F0008

composite_rules:
- id: nested-archive-with-password-note
  desc: Archive bundles inner archive with its password
  crit: suspicious
  conf: 0.9
  scope: archive
  all:
    - id: micro-behaviors/ui/window/display::plain-text-access-code-value
  any:
    - id: metadata/archive/member/extension::archive-nested-rar-member
    - id: metadata/archive/member/extension::archive-nested-zip-member
    - id: metadata/archive/member/extension::archive-nested-7z-member

- id: document-named-archive-with-password-note
  desc: Document-named inner archive ships with password
  crit: hostile
  conf: 0.92
  scope: archive
  all:
    - id: micro-behaviors/ui/window/display::plain-text-access-code-value
    - id: metadata/archive/member/extension::archive-document-named-nested-archive
