# The password-protected-archive delivery page.
#
# The pattern is stable across campaigns because it solves a specific problem
# for the operator: an archive that a scanner cannot open is an archive that a
# scanner cannot judge. The cost is that the victim now needs the password, so
# the page that hands out the download has to hand out the password too --
# usually behind a "copy" button, because a password you can select and copy
# is one the user will actually paste.
#
# That is the tell. A legitimate "copy" button on a download page copies a
# link, a checksum or a share URL: something long, and usually a variable. A
# button that copies a short string literal next to a link to a public file
# host is handing over an archive password, and the only reason to protect a
# free download with a password is to stop it being read on the way in.
#
# Found on abuse.ch 59b40810 -- "Your File is Ready", a MediaFire link to
# `launcher.rar`, and `navigator.clipboard.writeText("1337")`. It scored six
# notables.
#
# Suspicious rather than hostile: the page is the delivery wrapper, not the
# payload, and a file-sharing service is a legitimate thing to link to. What
# is unusual is the pairing.
defaults:
  platforms: [windows, unix]
  for: [html, javascript, text]
  attack: T1566.002,T1027.013
  mbc: F0008

traits:



  - id: file-ready-download-title
    desc: Download page claims the file is ready
    crit: notable
    conf: 0.86
    if:
      type: text
      regex: '(?i)<title>[^<]{0,60}(your file is ready|file is ready|download ready)'

  - id: flagged-download-consent-gate
    desc: Download gate for a malware-flagged file
    crit: notable
    conf: 0.88
    if:
      type: text
      regex: '(?i)detected as malicious and I accept full responsibility|download anyway'

  - id: download-handler-password-literal
    desc: Download call carries a password literal
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: "(?i)\\{\\s*pass\\s*:\\s*'[^'\\\\\\r\\n]{3,16}'"

composite_rules:

  - id: archive-password-handoff-download-page
    desc: Download page hands over an archive password
    crit: suspicious
    conf: 0.92
    all:
      - id: micro-behaviors/communications/url/host/name::public-file-share-download-link
      - id: micro-behaviors/os/clipboard/write::clipboard-copies-short-literal
  - id: rar-password-file-share-drop
    desc: Passworded RAR on a public file host
    crit: hostile
    conf: 0.96
    all:
    - id: micro-behaviors/communications/url/host/name::public-file-share-download-link
    - id: micro-behaviors/os/clipboard/write::clipboard-copies-short-literal
    - id: micro-behaviors/communications/http/client/resource::rar-url-reference

  - id: file-ready-rar-password-lure
    desc: File-ready page hands a RAR password
    crit: hostile
    conf: 0.96
    all:
    - id: file-ready-download-title
    - id: micro-behaviors/communications/http/client/resource::rar-url-reference
    - id: micro-behaviors/os/clipboard/write::clipboard-copies-short-literal

  - id: file-ready-file-share-password
    desc: File-ready page copies a share password
    crit: hostile
    conf: 0.95
    all:
      - id: file-ready-download-title
      - id: micro-behaviors/communications/url/host/name::public-file-share-download-link
      - id: micro-behaviors/os/clipboard/write::clipboard-copies-short-literal

  # A saved file-host "malware advisory" page that still offers "Download
  # Anyway" and passes an archive password to its download handler. The page
  # itself says the file was detected as malicious, so the password is not a
  # convenience for the reader: it keeps the archive opaque to scanning.
  - id: flagged-download-password-handoff
    desc: Flagged file offered for download with password
    crit: hostile
    conf: 0.93
    all:
      - id: flagged-download-consent-gate
      - id: download-handler-password-literal
