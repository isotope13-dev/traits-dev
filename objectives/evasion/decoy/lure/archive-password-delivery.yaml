# The password-protected-archive delivery page.
#
# The pattern is stable across campaigns because it solves a specific problem
# for the operator: an archive that a scanner cannot open is an archive that a
# scanner cannot judge. The cost is that the victim now needs the password, so
# the page that hands out the download has to hand out the password too --
# usually behind a "copy" button, because a password you can select and copy
# is one the user will actually paste.
#
# That is the tell. A legitimate "copy" button on a download page copies a
# link, a checksum or a share URL: something long, and usually a variable. A
# button that copies a short string literal next to a link to a public file
# host is handing over an archive password, and the only reason to protect a
# free download with a password is to stop it being read on the way in.
#
# Found on abuse.ch 59b40810 -- "Your File is Ready", a MediaFire link to
# `launcher.rar`, and `navigator.clipboard.writeText("1337")`. It scored six
# notables.
#
# Suspicious rather than hostile: the page is the delivery wrapper, not the
# payload, and a file-sharing service is a legitimate thing to link to. What
# is unusual is the pairing.
defaults:
  platforms: [windows, unix]
  for: [html, javascript, text]
  attack: T1566.002,T1027.013
  mbc: F0008

traits:
  - id: public-file-share-host-primary
    desc: Links to a public file-sharing host
    crit: notable
    conf: 0.85
    if:
      type: text
      regex: '(?i)https?://(www\.)?(mediafire|gofile|anonfiles)\.'

  - id: public-file-share-host-secondary
    desc: Links to a public file-drop host
    crit: notable
    conf: 0.85
    if:
      type: text
      regex: '(?i)https?://(www\.)?(krakenfiles|pixeldrain|dropmefiles)\.'

  # A short *literal*, not a variable. `writeText(shareUrl)` is a share button;
  # `writeText("1337")` is a passphrase handed to the user.
  - id: clipboard-copies-short-literal
    desc: Copies a short literal to clipboard
    crit: notable
    conf: 0.88
    if:
      type: text
      regex: 'navigator\.clipboard\.writeText\s*\(\s*["''][^"'']{1,16}["'']'

composite_rules:
  - id: public-file-share-download-link
    desc: Page links to a public file-sharing host
    crit: notable
    conf: 0.88
    any:
      - id: public-file-share-host-primary
      - id: public-file-share-host-secondary

  - id: archive-password-handoff-download-page
    desc: Download page hands over an archive password
    crit: suspicious
    conf: 0.92
    all:
      - id: public-file-share-download-link
      - id: clipboard-copies-short-literal
    unless:
      - id: well-known/tool/detection/
