defaults:
  platforms: [unix]
  for: [shell]
composite_rules:
  # A success message alongside a concealed download-and-run chain can be
  # authentication theater. It does not prove credentials were checked or
  # identify the fetched payload; retain suspicious severity.
  - id: authentication-success-hidden-shell-payload
    desc: Authentication message with hidden shell payload
    crit: suspicious
    conf: 0.94
    near_lines: 35
    all:
      - id: micro-behaviors/ui/terminal::shell-authentication-success-output
      - id: objectives/execution/payload/file-exec::shell-curl-hidden-chmod-detached-script
