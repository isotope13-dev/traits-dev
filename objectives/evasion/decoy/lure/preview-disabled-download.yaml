# A preview error alone is ordinary UI. This combination instead urges the
# reader away from the displayed document to a Google-wrapped PHP endpoint.
# It detects the delivery pretext, without asserting what the endpoint serves.
composite_rules:
  - id: preview-disabled-document-download
    desc: Disabled-preview lure directs document download to a tracked PHP endpoint
    crit: hostile
    conf: 0.95
    platforms: [windows, unix]
    for: [html]
    attack: T1204.001
    near_bytes: 1800
    all:
      - id: micro-behaviors/ui/dialog/error::document-preview-disabled
      - id: micro-behaviors/ui/window/display::html-document-download-instruction
      - id: objectives/impact/ui/manipulation/traffic/navigation::google-click-tracked-php-download
