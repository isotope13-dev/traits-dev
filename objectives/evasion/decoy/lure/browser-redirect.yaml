defaults:
  platforms: [windows, unix]
  for: [html, javascript, markdown]

traits:
  - id: browser-verification-interstitial
    desc: Security-verification status page
    crit: component
    conf: 0.93
    for: [html, javascript]
    if:
      type: text
      regex: '(?i)(request is being verified|process is automatic|verify you are human)'

composite_rules:
  - id: obfuscated-verification-source-gate
    desc: Obfuscated verification source gate
    crit: hostile
    conf: 0.98
    attack: T1497.001,T1071.001,T1027
    for: [html, javascript]
    near_bytes: 8192
    all:
      - id: browser-verification-interstitial
      - id: objectives/anti-analysis/sandbox-detect/tool-references::js-anti-bot-browser-fingerprint
      - id: objectives/evasion/security-bypass/anti-bot::anti-bot-external-source-url
      - id: micro-behaviors/ui/window/manage/dom::browser-form-submit
      - id: objectives/anti-static/obfuscation/obfuscator/js-obfuscator::string-array-rotation

  - id: fake-install-completion-browser-redirect
    desc: Fake installer completion redirects browser to a decoded URL
    crit: hostile
    conf: 0.98
    scope: archive
    all:
      - id: objectives/evasion/masquerade/identity/installer::web-installer-verification-lure
      - id: micro-behaviors/data/decode/base64::atob-decode
      - id: micro-behaviors/ui/window/manage/dom::browser-location-href-assign
