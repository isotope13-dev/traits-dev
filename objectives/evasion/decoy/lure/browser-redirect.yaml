defaults:
  platforms: [windows, unix]
  for: [html, javascript, markdown]

traits:
  - id: browser-verification-interstitial
    desc: Security-verification status page
    crit: notable
    conf: 0.93
    for: [html, javascript]
    if:
      type: text
      regex: '(?i)(request is being verified|process is automatic|verify you are human)'

  - id: explicit-decoy-ui-comment
    desc: Source labels browser UI as decoy
    crit: suspicious
    conf: 0.99
    for: [html, javascript]
    if:
      type: text
      regex: '(?i)decoy\s+(classroom|login|portal|web|ui)\s+functionality'
    unless:
      - id: metadata/package/testing/harness/runtime/
      - id: metadata/package/testing/presence/fixture::test-filename-pattern
      - id: well-known/tool/detection/

composite_rules:
  - id: obfuscated-verification-source-gate
    desc: Obfuscated verification source gate
    crit: hostile
    conf: 0.98
    attack: T1497.001,T1071.001,T1027
    for: [javascript]
    near_bytes: 8192
    all:
      - id: browser-verification-interstitial
      - id: objectives/anti-analysis/sandbox-detect/tool-references::js-anti-bot-browser-fingerprint
      - id: objectives/evasion/security-bypass/anti-bot/automation::anti-bot-external-source-url
      - id: micro-behaviors/ui/window/navigation::browser-form-submit
      - id: objectives/anti-static/obfuscation/obfuscator/js-obfuscator::string-array-rotation

  # The lure copy and the redirect have to be the same page. Pooled at archive
  # scope, a monorepo joined a NIST control catalogue's "verified" prose with
  # a React landing page's location.href and an unrelated atob() elsewhere.
  - id: installer-lure-page-redirect
    for: [html, javascript]
    desc: Installer-verification lure page redirects browser
    crit: notable
    conf: 0.9
    all:
      - id: objectives/evasion/masquerade/identity/installer::web-installer-verification-lure
      - id: micro-behaviors/ui/window/navigation::browser-location-href-assign

  # Archive scope stays for the decode leg only: a landing-page kit may keep
  # the Base64 URL decoder in a script beside the page.
  - id: fake-install-completion-browser-redirect
    for: [html, javascript, zip]
    desc: Fake installer completion redirects browser to a decoded URL
    crit: hostile
    conf: 0.98
    scope: archive
    all:
      - id: installer-lure-page-redirect
      - id: micro-behaviors/data/decode/symbol-base64::atob-decode

  - id: branded-classroom-decoy-loader
    desc: Classroom-branded decoy loads remote HTML
    crit: hostile
    conf: 0.99
    attack: T1036,T1105
    for: [html, javascript]
    all:
      - id: explicit-decoy-ui-comment
      - id: well-known/app/productivity/google-classroom::product-icon-reference
      - id: micro-behaviors/communications/http/client/response-body::fetch-html-document-write
