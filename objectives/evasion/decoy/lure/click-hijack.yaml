# Download-button click hijacking: keep a legitimate href for hover, then
# cancel navigation and send the click through an affiliate/TDS redirect.
# Match DOM event APIs and decoy vendor download hosts — not advisory prose.
defaults:
  platforms: [unix, windows]
  for: [html, javascript, typescript]
  attack: T1189,T1204.001
  mbc: E1204

traits:
  - id: decoy-vendor-download-href
    desc: Embeds Steam or VideoLAN download URL
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)https?://(store\.steampowered\.com|get\.videolan\.org|download\.videolan\.org)/'

composite_rules:
  - id: click-hijack-event-takeover
    desc: Cancels link navigation then redirects click
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/ui/window/manage/click::cancel-event-then-navigate
    any:
      - id: objectives/command-and-control/infrastructure/domain/campaign::downloadstudio-affiliate-host
      - id: micro-behaviors/ui/window/manage/click::browser-mousedown-click-selection
      - id: micro-behaviors/ui/window/manage/navigation::browser-window-open-reference
      - id: decoy-vendor-download-href

  - id: download-decoy-href-click-hijack
    desc: Vendor download decoy href with click hijack
    crit: hostile
    conf: 0.99
    near_bytes: 4000
    all:
      - id: decoy-vendor-download-href
      - id: click-hijack-event-takeover

  - id: tds-click-hijack-staging
    desc: TDS staging hijacks clicks via capture listener
    crit: hostile
    conf: 0.98
    near_bytes: 2500
    all:
      - id: micro-behaviors/ui/window/manage/click::capture-phase-event-listener
      - id: click-hijack-event-takeover
    any:
      - id: micro-behaviors/ui/window/manage/click::browser-mousedown-click-selection
      - id: micro-behaviors/ui/window/manage/navigation::browser-window-open-reference
      - id: objectives/command-and-control/infrastructure/domain/campaign::downloadstudio-affiliate-host
