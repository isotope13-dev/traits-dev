# Download-button click hijacking: keep a legitimate href for hover, then
# cancel navigation and send the click through an affiliate/TDS redirect.
# Match DOM event APIs and decoy vendor download hosts — not advisory prose.
defaults:
  platforms: [unix, windows]
  for: [html, javascript, typescript]
  attack: T1189,T1204.001
  mbc: E1204

traits:
  - id: stop-immediate-propagation-call
    desc: Cancels further DOM event handlers
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '\.stopImmediatePropagation\s*\('

  - id: event-prevent-default-call
    desc: Cancels default DOM event action
    crit: notable
    conf: 0.88
    if:
      type: text
      regex: '\.preventDefault\s*\('

  - id: capture-phase-event-listener
    desc: Registers capture-phase DOM event listener
    crit: suspicious
    conf: 0.9
    if:
      type: text
      regex: '(?i)\.addEventListener\s*\([\s\S]{0,500},\s*true\s*\)'

  - id: chrome-mousedown-click-ternary
    desc: Forks mousedown versus click by browser
    crit: suspicious
    conf: 0.96
    if:
      type: text
      regex: '(?i)\?\s*["'']mousedown["'']\s*:\s*["'']click["'']'

  - id: cached-window-open-reference
    desc: Caches window.open for later invoke
    crit: suspicious
    conf: 0.93
    if:
      type: text
      regex: '(?i)\bcachedOpen\b|\b\w+\s*=\s*(window|w)\.open\b'

  - id: decoy-vendor-download-href
    desc: Embeds Steam or VideoLAN download URL
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)https?://(store\.steampowered\.com|get\.videolan\.org|download\.videolan\.org)/'

  - id: downloadstudio-api-host
    desc: References apis.downloadstud.io host
    crit: suspicious
    conf: 0.96
    if:
      type: text
      regex: '(?i)\bapis\.downloadstud\.io\b'

  - id: downloadstudio-byteengineering-host
    desc: References r.byteengineering.net host
    crit: suspicious
    conf: 0.96
    if:
      type: text
      regex: '(?i)\br\.byteengineering\.net\b'

  - id: downloadstudio-get-host
    desc: References getdownloadstudio.net host
    crit: suspicious
    conf: 0.96
    if:
      type: text
      regex: '(?i)\b(getdownloadstudio|downloadstudio)\.net\b|\bdstudio\.app\b'

composite_rules:
  - id: downloadstudio-affiliate-host
    desc: References Download Studio affiliate host
    crit: suspicious
    conf: 0.96
    any:
      - id: downloadstudio-api-host
      - id: downloadstudio-byteengineering-host
      - id: downloadstudio-get-host

  - id: click-hijack-event-takeover
    desc: Cancels link navigation then redirects click
    crit: hostile
    conf: 0.98
    near_bytes: 600
    all:
      - id: event-prevent-default-call
      - id: stop-immediate-propagation-call
    any:
      - id: micro-behaviors/ui/window/manage/dom::browser-location-href-assign
      - id: micro-behaviors/ui/window/manage/dom::browser-window-open
      - id: micro-behaviors/ui/window/manage/dom::browser-location-external-href-replace
      - id: micro-behaviors/ui/window/manage/popunder::browser-window-open-external-url
      - id: downloadstudio-affiliate-host

  - id: download-decoy-href-click-hijack
    desc: Vendor download decoy href with click hijack
    crit: hostile
    conf: 0.99
    near_bytes: 4000
    all:
      - id: decoy-vendor-download-href
      - id: click-hijack-event-takeover

  - id: tds-click-hijack-staging
    desc: TDS staging hijacks clicks via capture listener
    crit: hostile
    conf: 0.98
    near_bytes: 2500
    all:
      - id: capture-phase-event-listener
      - id: click-hijack-event-takeover
    any:
      - id: chrome-mousedown-click-ternary
      - id: cached-window-open-reference
      - id: downloadstudio-affiliate-host
