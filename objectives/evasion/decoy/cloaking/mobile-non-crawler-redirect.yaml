# Hacked-site mobile redirector (the `_mauthtoken` family and copies): only
# mobile browsers that are not Googlebot are redirected, and an expiring
# cookie limits it to one hit per window. Search engines and the desktop-
# using site owner keep seeing the normal page; phones are sent to a
# traffic-distribution URL.
defaults:
  platforms: [windows, unix, android]
  for: [html, javascript]
  attack: T1189,T1036

composite_rules:
  - id: non-googlebot-mobile-cookie-redirect
    desc: Redirects non-Googlebot mobile visitors once per cookie
    crit: hostile
    conf: 0.95
    near_bytes: 3000
    all:
      - id: micro-behaviors/communications/http/user-agent::googlebot-absent-ua-check
      - id: micro-behaviors/communications/http/user-agent::detectmobilebrowsers-ua-regex
      - id: micro-behaviors/ui/window/navigation::expiring-cookie-then-window-location
  - id: obfuscated-non-googlebot-mobile-cookie-redirect
    desc: Obfuscated redirect for non-Googlebot mobile visitors
    crit: hostile
    conf: 0.95
    near_bytes: 4000
    all:
      - id: metadata/lang/encoding::javascript-hex-escape-string-table
      - id: micro-behaviors/communications/http/user-agent::googlebot-string-table-token
      - id: micro-behaviors/data/control-flow/membership::negative-indexof-token-check
      - id: micro-behaviors/communications/http/user-agent::detectmobilebrowsers-ua-regex
      - id: micro-behaviors/ui/window/navigation::cookie-expiry-with-computed-browser-writes
  - id: mobile-regex-with-concealed-crawler-cookie-keys
    desc: Mobile regex with hidden crawler/cookie keys
    crit: suspicious
    conf: 0.9
    near_bytes: 4000
    all:
      - id: micro-behaviors/communications/http/user-agent::googlebot-string-table-token
      - id: micro-behaviors/communications/http/user-agent::detectmobilebrowsers-ua-regex
      - id: micro-behaviors/ui/window/navigation::cookie-expiry-with-computed-browser-writes
      - id: metadata/lang/encoding::javascript-hex-escape-string-table
    # A token does not prove that the crawler is excluded. Keep this
    # co-occurrence suspicious until the indexed values are resolved.
