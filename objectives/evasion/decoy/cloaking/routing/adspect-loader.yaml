defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
  attack: T1105
  mbc: E1105.016

composite_rules:
  - id: adspect-cloaked-content-routing
    desc: Adspect-controlled content routing clues
    crit: hostile
    conf: 0.98
    all:
      - id: objectives/evasion/decoy/cloaking/routing::adspect-server-controlled-routing
    any:
      - id: objectives/evasion/decoy/cloaking/routing::adspect-remote-js-execution
      - id: objectives/evasion/decoy/cloaking/routing::adspect-remote-content-injection
      - id: objectives/evasion/decoy/cloaking/routing::adspect-remote-content-actions
      - id: objectives/command-and-control/infrastructure/domain/tld::suspicious-php-endpoint
