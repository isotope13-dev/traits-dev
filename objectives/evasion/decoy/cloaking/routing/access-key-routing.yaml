defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
  attack: T1566.002,T1027
  mbc: B0030

composite_rules:
  - id: cloaked-access-key-url-generator
    desc: Generates cloaked URL with access key
    crit: hostile
    conf: 0.98
    all:
      - id: metadata/lang/source/naming/action/network::base-url-getter
      - id: metadata/lang/source/naming/secret::current-access-key-getter
      - id: micro-behaviors/communications/url/construction/query::js-urlsearchparams-construction
