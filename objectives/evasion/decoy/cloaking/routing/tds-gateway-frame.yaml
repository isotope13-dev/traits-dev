# A tiny remote iframe near an in.cgi URL suggests concealment. The clues do
# not establish that the URL is the frame target or a traffic-routing service.
defaults:
  platforms: [windows, unix]
  for: [html]
  attack: T1189

composite_rules:
  - id: tiny-frame-in-cgi-url-clues
    desc: Tiny remote iframe near an in.cgi URL
    crit: suspicious
    conf: 0.96
    attack: T1189,T1105
    near_bytes: 400
    all:
      - id: micro-behaviors/communications/url/resource-path/file::in-cgi-query-url
      - id: micro-behaviors/communications/http/client/frame::external-iframe-element-load
      - id: micro-behaviors/ui/window/visibility::tiny-iframe-unquoted-small
