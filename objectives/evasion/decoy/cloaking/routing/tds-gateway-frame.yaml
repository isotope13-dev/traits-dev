# A tiny remote iframe near a campaign-shaped in.cgi URL suggests hidden
# traffic routing. The clues do not establish that the URL is the frame target.
defaults:
  platforms: [windows, unix]
  for: [html]
  attack: T1189

composite_rules:
  - id: campaign-gateway-tiny-frame-clues
    desc: Tiny remote iframe and campaign gateway clues
    crit: suspicious
    conf: 0.96
    attack: T1189,T1105
    near_bytes: 400
    all:
      - id: micro-behaviors/communications/url/http-path/resource::in-cgi-gateway-script-url
      - id: micro-behaviors/communications/http/client/frame::external-iframe-element-load
      - id: micro-behaviors/ui/window/visibility::tiny-iframe-unquoted-small
