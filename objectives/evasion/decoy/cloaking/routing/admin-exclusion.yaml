# Web-inject cloaking: the payload deliberately spares the people who could
# notice it.
#
# Admin-cookie checks can accompany cloaked web redirects, but their mere
# co-occurrence does not establish the direction or effect of the condition.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, html, php]
  attack: T1497
  mbc: B0007

traits:
  - id: admin-session-cookie-probe
    desc: Tests for an administrator session cookie
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: 'cookie\s*\.\s*(indexOf|includes|match|search)\s*\(\s*["''][a-z_]{0,6}admin'
      case_insensitive: true
composite_rules:
  - id: admin-excluded-redirect
    for: [javascript, html]
    desc: Admin cookie check and location assignment
    crit: suspicious
    conf: 0.95
    scope: file
    all:
      - id: admin-session-cookie-probe
      - id: micro-behaviors/data/property/assign::location-href-write-text
    unless:
      - id: metadata/package/testing/presence/manifest::test-fixtures
