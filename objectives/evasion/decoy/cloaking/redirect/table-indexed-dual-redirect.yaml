# Injected WordPress-page stub: a javascript-obfuscator string table hides a
# once-per-visitor cookie check and the redirect calls, and the destination
# is spelled as character codes, so the page silently sends first-time
# visitors to the operator's site while the URL never appears in clear.
defaults:
  platforms: [windows, unix]
  for: [javascript]
composite_rules:
  - id: obfuscated-charcode-url-dual-redirect
    desc: Obfuscated stub redirects to char-coded URL
    crit: hostile
    conf: 0.95
    attack: T1027,T1189
    near_bytes: 1200
    all:
      - id: micro-behaviors/ui/window/navigation/location::table-indexed-window-and-document-redirect
      - id: micro-behaviors/communications/url/encoded::javascript-charcode-http-scheme
    any:
      - id: micro-behaviors/data/collection/array::javascript-bracket-array-rotation
      - id: objectives/anti-static/obfuscation/obfuscator/js-obfuscator::obfuscated-base64-codec
