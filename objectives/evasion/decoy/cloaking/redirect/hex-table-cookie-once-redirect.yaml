# Injected WordPress-site stub: a hex-escaped _0x string table hides a
# cookie setter/getter and a location redirect. Visitors without the
# marker cookie are sent to an ad/traffic broker once per cookie lifetime,
# so the site owner, already marked, rarely sees it happen.
defaults:
  platforms: [windows, unix]
  for: [javascript]
composite_rules:
  - id: hex-table-cookie-once-redirect
    desc: Hex-escaped stub redirects visitors once per cookie
    crit: hostile
    conf: 0.95
    attack: T1027,T1189
    near_bytes: 4000
    all:
      - id: metadata/lang/encoding/shape/escape::javascript-hex-escape-string-table
      - id: micro-behaviors/ui/window/navigation/location::hex-table-indexed-location-assignment
      - id: micro-behaviors/communications/http/cookies::cookie-expires-attribute-literal
      - id: micro-behaviors/os/sysinfo/platform/browser::navigator-cookie-enabled-read
