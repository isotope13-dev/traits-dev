# Extension UI that asks a server for a "mode" and, on the server's say-so,
# opens the server-supplied URL and closes itself. Otherwise it shows its
# advertised feature, so reviewers see the decoy while targeted users get
# redirected.
defaults:
  platforms: [windows, unix]
  attack: T1176,T1071.001

composite_rules:
  - id: server-mode-redirect-self-closing-ui
    desc: Server mode flips extension UI to open a server URL and close
    crit: hostile
    conf: 0.95
    scope: archive
    for: [crx, xpi, zip, javascript]
    all:
      - id: objectives/supply-chain/hidden-payload/extensions/backdoor::server-mode-navigation-decision
      - id: micro-behaviors/communications/http/client/response-body::js-response-text-read
      - id: micro-behaviors/ui/window/navigation/open::window-open-then-self-close
