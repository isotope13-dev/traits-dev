# Plain-text form of the doorway redirect that charcode-search-referrer.yaml
# catches when packed: visitors arriving from a search engine are sent to the
# operator's page, everyone else (crawlers, direct hits, the site owner) is
# bounced to a 404 page on the page's own host so the doorway looks dead.
defaults:
  platforms: [windows, unix]
  for: [html, javascript]
  attack: T1027

traits:
  - id: referrer-global-engine-indexof
    desc: Referrer test for Google, Bing or MSN
    crit: notable
    conf: 0.85
    if:
      type: text
      exclude_comments: true
      regex: 'indexOf\(\s*["''](google|bing|msn)\.'

  - id: referrer-regional-engine-indexof
    desc: Referrer test for Yahoo, AOL or Ask
    crit: notable
    conf: 0.85
    if:
      type: text
      exclude_comments: true
      regex: 'indexOf\(\s*["''](yahoo|aol|ask)\.'

  - id: own-host-404-location-assignment
    desc: Navigates to own-host 404 page
    crit: notable
    conf: 0.85
    if:
      type: text
      exclude_comments: true
      regex: '(location|href)\s*=[^;]{0,40}hostname\s*\+\s*["'']/(404|not[-_]?found)'

composite_rules:
  - id: search-referrer-404-decoy-redirect
    desc: Search-referrer redirect with 404 decoy path
    crit: hostile
    conf: 0.93
    near_bytes: 6000
    all:
      - id: objectives/evasion/decoy/cloaking/redirect::referrer-global-engine-indexof
      - id: objectives/evasion/decoy/cloaking/redirect::referrer-regional-engine-indexof
      - id: objectives/evasion/decoy/cloaking/redirect::own-host-404-location-assignment
    any:
      - id: micro-behaviors/ui/window/navigation/location::browser-location-external-assign
      - id: micro-behaviors/ui/window/navigation/location::remote-page-location-assignment
