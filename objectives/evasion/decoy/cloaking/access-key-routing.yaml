defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
  attack: T1566.002,T1027
  mbc: B0030

composite_rules:
  - id: cloaked-access-key-url-generator
    desc: Generates cloaked URL with access key
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/communications/http/url/construction::base-url-getter
      - id: micro-behaviors/communications/http/url/construction::current-access-key-getter
      - id: micro-behaviors/communications/http/url/query::js-urlsearchparams-construction
