# Hidden automatic search-referrer routing before an advertised replica-goods
# storefront supports a counterfeit-sales doorway/cloaking inference. A packed
# library, ordinary referral router, or counterfeit discussion alone cannot
# satisfy this rule. The capability binds the tested source, both navigation
# sinks, and their dictionary; token co-occurrence is insufficient.
defaults:
  platforms: [windows, unix]
  for: [html]
composite_rules:
  - id: packed-replica-search-doorway
    desc: Packed search cloaking on replica storefront
    crit: hostile
    conf: 0.96
    near_bytes: 2000
    all:
      - id: micro-behaviors/ui/window/navigation::packed-search-referrer-navigation
      - id: micro-behaviors/ui/keywords::replica-designer-sales-title
