# Hidden-link SEO: a stub decodes a CSS rule (e.g.
# `.dnn{position:absolute;top:-9999px}`) from digit-pair codes and writes
# it into the page, moving a link carrying that class off-screen so
# visitors never see it while crawlers still index it. Seen as the
# vendor backlink hider in the free Joomla mod_AutsonSlideShow module
# (function dnnViewState, bundled with jQuery Skitter). Deceptive toward
# the site owner, not harmful to the visitor, so it stays suspicious.
defaults:
  platforms: [windows, unix]
  for: [javascript, html]
composite_rules:
  - id: digit-coded-style-rule-written-to-page
    desc: Digit-coded style rule written to hide content
    crit: suspicious
    conf: 0.93
    attack: T1027,T1564
    near_bytes: 800
    all:
      - id: micro-behaviors/data/encode/char-code::digit-pair-charcode-shift-decoder
      - id: micro-behaviors/ui/window/insert-html::document-write-array-assembled-style-rule
