# Tab masking. A page overwrites its title and favicon with a school-platform
# identity so a glance at the browser tab shows a lesson or an LMS rather than
# the site. Each leg is routine alone; the composite pairs them with a
# school-platform host preset, which states the concealment result. Suspicious
# rather than hostile: kiosk and classroom apps can legitimately rebrand a tab.
defaults:
  platforms: [windows, unix]
  for: [html, javascript]

composite_rules:
  - id: tab-disguise-school-platform-preset
    desc: Tab masking swaps title and icon to school
    crit: suspicious
    conf: 0.9
    scope: file
    all:
      - id: micro-behaviors/ui/window/html::js-document-title-assignment
      - id: micro-behaviors/ui/window/html::js-favicon-link-rel-icon
      - id: micro-behaviors/communications/http/services/education::lms-school-platform-domain-preset
