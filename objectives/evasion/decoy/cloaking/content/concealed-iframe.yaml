defaults:
  platforms: [unix, windows]
  for: [html]
  attack: T1564

composite_rules:
  - id: a11y-suppressed-offscreen-remote-iframe
    desc: Off-screen 1px iframe suppressed from focus and screen readers
    crit: suspicious
    conf: 0.93
    near_bytes: 350
    all:
      - id: micro-behaviors/ui/window/style::iframe-inline-offscreen-style
      - id: micro-behaviors/ui/window/style::css-one-pixel-dimension
      - id: micro-behaviors/ui/window/html::negative-tabindex-iframe
      - id: micro-behaviors/data/format/html::aria-hidden
