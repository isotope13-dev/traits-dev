# Content cloaking: the visible document is only an AES library and a
# ciphertext; the page the visitor actually sees is decrypted and written
# at load time, so crawlers, URL scanners and takedown reviewers that read
# the source see no form, brand or text.
defaults:
  platforms: [windows, unix]
  for: [javascript, html]
composite_rules:
  - id: encrypted-document-body-written-at-load
    desc: Real page body hidden as AES ciphertext
    crit: hostile
    conf: 0.93
    attack: T1027.013,T1564
    all:
      - id: micro-behaviors/crypto/decrypt/transform/symmetric::veness-aes-ctr-decrypt-call
      - id: micro-behaviors/ui/window/insert-html::decrypted-output-document-write
    any:
      - id: metadata/lang/encoding/shape/character::long-base64-alphabet-literal-js
      - id: metadata/file/encoding/shape::large-base64-like-literal
