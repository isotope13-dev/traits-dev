# Gates an action on a specific foreign timezone's weekday-and-hour window.
# The Help TDS / Hotejka lure computes the U.S. call-center working hours in
# Moscow time and only shows the lure Monday-Friday during that window, so the
# scam page is invisible to scanners (and victims) outside call-center hours.
# Converting into a hardcoded foreign timezone and branching on both the ISO
# weekday and the hour is a display/time cloak: ordinary localisation reads the
# visitor's own locale, it does not pin a single overseas timezone and a
# business-hours window. Keyed on the timezone + weekday + hour combination,
# so it survives a change of window or timezone.
defaults:
  platforms: [windows, unix]
  for: [php]
  attack: T1497.003
  mbc: B0003

composite_rules:
  - id: foreign-timezone-business-hours-gate
    desc: Gates behavior on a foreign timezone business-hours window
    crit: suspicious
    conf: 0.9
    near_bytes: 600
    all:
      - id: micro-behaviors/time/query::php-named-timezone
      - id: micro-behaviors/time/query::php-weekday-of-week
      - id: micro-behaviors/time/query::php-hour-of-day
