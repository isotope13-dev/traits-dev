defaults:
  for: [html]
  platforms: [windows, unix]
composite_rules:
  - id: concealed-auto-submit-click-handoff
    desc: Concealed auto-submit form accompanies a click-account URL
    crit: suspicious
    conf: 0.98
    all:
      - id: objectives/anti-static/obfuscation/encoding/custom::percent-concealed-auto-submit-form
      - id: micro-behaviors/communications/http/url/path::affiliate-click-account-url
      - id: micro-behaviors/ui/window/hidden-input::hidden-style-input
