# Server-side traffic gate that resolves its redirect target from a remotely
# fetched config and caches it. A Help TDS / Hotejka affiliate loader (dropped
# into a compromised WordPress site) fetches a JSON document from a C2 URL,
# extracts the current TDS domain, base64-caches it with a short TTL, and
# redirects the visitor to it. A benign page redirects to a fixed, hardcoded
# destination; pulling the destination from a remote config at request time,
# then obfuscating the cached copy, is the defining shape of a disposable TDS
# node. Keyed on fetch + JSON parse + variable redirect + base64/TTL cache, not
# on any campaign domain or affiliate id, so it carries to the next build.
defaults:
  platforms: [windows, unix]
  for: [php]
  attack: T1102,T1608.004
  mbc: C0011

composite_rules:
  - id: php-remote-config-c2-redirect
    desc: PHP redirects to a domain resolved from a remote config
    crit: hostile
    conf: 0.9
    all:
      - id: micro-behaviors/fs/read/file/full::php-file-get-variable-source
      - id: micro-behaviors/data/serialize/json::php-json-decode
      - id: objectives/credential-access/phishing/mfa-relay::php-redirect-variable
    any:
      - id: micro-behaviors/data/encode/base64::php-base64-encode
      - id: micro-behaviors/data/decode/base64::php-base64-decode-call
      - id: micro-behaviors/fs/file/timestamp::php-filemtime-call
