defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
  attack: T1497.003
  crit: hostile
  conf: 0.94

composite_rules:
  - id: daytime-localhost-card-field-gate
    desc: Daytime localhost gate on card hook
    near_bytes: 3200
    all:
      - id: micro-behaviors/time/timing/check::saved-local-hour-range-branch
      - id: micro-behaviors/os/sysinfo/platform/browser::includes-localhost-string
      - id: micro-behaviors/ui/window/form-input::password-or-card-control-test
    unless:
      - id: metadata/package/testing/
