# SEO-doorway cloaking hidden by Dean Edwards Packer: the unpacked code tests
# document.referrer against Google/Bing/Yahoo/Yandex/AOL and sends search
# visitors to a target shop while everyone else (crawlers, reviewers) sees a
# different page. Packer leaves the identifiers in its token dictionary, so
# the wrapper plus referrer, location and search-engine tokens in that one
# dictionary name the concealed referral router.
defaults:
  platforms: [windows, unix]
  for: [html, javascript]
  attack: T1027.002,T1036

composite_rules:
  - id: packed-search-referrer-redirect
    desc: Packed script redirects by search-engine referrer
    crit: hostile
    conf: 0.95
    near_bytes: 2000
    all:
      - id: objectives/anti-static/obfuscation/obfuscator/js-obfuscator::packer-eval-pattern
      - id: micro-behaviors/communications/url/host/name::pipe-token-search-engine-names
      - id: micro-behaviors/communications/http/url/navigation::packer-dictionary-referrer-token
      - id: micro-behaviors/ui/window/navigation::packer-dictionary-location-token
