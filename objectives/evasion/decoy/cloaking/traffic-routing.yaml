# Generic traffic-distribution/cloaking behavior described by the Sekoia
# infostealer distribution survey: inspect request identity, reject automated
# or out-of-target traffic, and route selected users to the payload.
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript, php, html]
  attack: T1497.001,T1614,T1105
  mbc: B0007.003,B0030

traits:
  - id: country-list-membership-call
    desc: Checks country list membership
    crit: suspicious
    conf: 0.92
    if:
      type: text
      regex: '(?i)\b[A-Za-z_$][\w$]*Countries\s*\.\s*(includes|indexOf)\s*\('

  - id: country-code-membership-argument
    desc: Uses geolocation country in list check
    crit: suspicious
    conf: 0.92
    if:
      type: text
      regex: '(?i)\b(includes|indexOf)\s*\(.{0,50}\bcountry[_-]?code\b'

  - id: php-country-membership-call
    desc: PHP checks geolocation country list
    crit: suspicious
    conf: 0.92
    for: [php]
    if:
      type: text
      regex: '(?i)\bin_array\s*\(.{0,100}\bcountry[_-]?code\b'

  - id: javascript-request-duration-gate
    desc: JavaScript routes on request processing time
    crit: suspicious
    conf: 0.9
    for: [javascript, typescript, html]
    if:
      type: text
      regex: '(?i)(Date|performance)\.now\s*\(\s*\)\s*-\s*[A-Za-z_$][\w$]*\s*>\s*\d{3}'

  - id: php-request-duration-gate
    desc: PHP routes on request processing time
    crit: suspicious
    conf: 0.9
    for: [php]
    if:
      type: text
      regex: '(?i)microtime\s*\(\s*true\s*\)\s*-\s*\$?\w+\s*>\s*[\d.]+'

composite_rules:
  - id: javascript-country-selection-branch
    desc: JavaScript routes on geolocation country
    crit: suspicious
    conf: 0.92
    all:
      - id: country-list-membership-call
      - id: country-code-membership-argument
    near_bytes: 256

  - id: geo-country-selection-branch
    desc: Routes on geolocation country selection
    crit: suspicious
    conf: 0.92
    any:
      - id: javascript-country-selection-branch
      - id: php-country-membership-call
    near_bytes: 256

  - id: request-duration-gate
    desc: Routes on request processing time
    crit: suspicious
    conf: 0.9
    any:
      - id: javascript-request-duration-gate
      - id: php-request-duration-gate

  - id: traffic-distribution-filter
    desc: Filters traffic by crawler, geography, and timing
    crit: suspicious
    conf: 0.96
    all:
      - id: country-list-membership-call
      - id: country-code-membership-argument
      - id: request-duration-gate
      - id: micro-behaviors/communications/http/user-agent-routing/crawler
    near_lines: 80

  - id: server-traffic-distribution-filter
    desc: Server-side TDS filter inspects inbound User-Agent
    crit: suspicious
    conf: 0.97
    all:
      - id: micro-behaviors/communications/http/user-agent-routing/inbound
      - id: country-list-membership-call
      - id: country-code-membership-argument
      - id: request-duration-gate
      - id: micro-behaviors/communications/http/user-agent-routing/crawler
    near_lines: 80

  - id: server-cloaked-decoy-route
    desc: Server TDS diverts filtered traffic to HTTP 404 decoy
    crit: hostile
    conf: 0.99
    attack: T1497.001,T1614,T1036
    all:
      - id: micro-behaviors/communications/http/user-agent-routing/inbound
      - id: micro-behaviors/communications/http/user-agent-routing/crawler
      - id: country-list-membership-call
      - id: country-code-membership-argument
      - id: request-duration-gate
    any:
      - id: micro-behaviors/communications/http/response::server-response-not-found-status
      - id: micro-behaviors/communications/http/response::php-http-response-code-404
      - id: micro-behaviors/communications/http/response::source-http-404-status
    near_lines: 100

  - id: server-targeted-executable-route
    desc: Server TDS routes selected users to executable payload
    crit: hostile
    conf: 0.99
    all:
      - id: micro-behaviors/communications/http/user-agent-routing/inbound
      - id: micro-behaviors/communications/http/user-agent-routing/crawler
      - id: country-list-membership-call
      - id: country-code-membership-argument
      - id: request-duration-gate
      - id: micro-behaviors/communications/http/download/url::executable-url-reference-a
    any:
      - id: micro-behaviors/communications/http/response::server-response-method
      - id: micro-behaviors/communications/http/response::php-location-redirect
    near_lines: 100

  - id: server-php-traffic-distribution-filter
    desc: PHP TDS filter combines inbound identity, geography, and timing
    crit: suspicious
    conf: 0.97
    for: [php]
    all:
      - id: micro-behaviors/communications/http/user-agent-routing/inbound
      - id: micro-behaviors/communications/http/user-agent-routing/crawler
      - id: php-country-membership-call
      - id: php-request-duration-gate
    near_lines: 80

  - id: server-php-cloaked-decoy-route
    desc: PHP TDS diverts filtered traffic to HTTP 404 decoy
    crit: hostile
    conf: 0.99
    for: [php]
    attack: T1497.001,T1614,T1036
    all:
      - id: micro-behaviors/communications/http/user-agent-routing/inbound
      - id: micro-behaviors/communications/http/user-agent-routing/crawler
      - id: php-country-membership-call
      - id: php-request-duration-gate
    any:
      - id: micro-behaviors/communications/http/response::php-http-response-code-404
      - id: micro-behaviors/communications/http/response::source-http-404-status
    near_lines: 100

  - id: server-php-targeted-executable-route
    desc: PHP TDS routes selected users to executable payload
    crit: hostile
    conf: 0.99
    for: [php]
    all:
      - id: micro-behaviors/communications/http/user-agent-routing/inbound
      - id: micro-behaviors/communications/http/user-agent-routing/crawler
      - id: php-country-membership-call
      - id: php-request-duration-gate
      - id: micro-behaviors/communications/http/download/url::executable-url-reference-a
    any:
      - id: micro-behaviors/communications/http/response::php-location-redirect
      - id: micro-behaviors/communications/http/response::source-http-404-status
    near_lines: 100

  - id: browser-targeted-executable-route
    desc: Browser TDS routes selected users to executable download
    crit: hostile
    conf: 0.99
    for: [javascript, typescript, html]
    all:
      - id: micro-behaviors/communications/http/user-agent-routing/crawler
      - id: country-list-membership-call
      - id: country-code-membership-argument
      - id: request-duration-gate
      - id: objectives/credential-access/phishing/captive-portal::installer-download-link
    any:
      - id: micro-behaviors/ui/window/manage/dom::browser-location-href-assign
      - id: micro-behaviors/ui/window/manage/dom::browser-location-external-assign
      - id: micro-behaviors/ui/window/manage/dom::browser-location-external-href-replace
    near_lines: 100
