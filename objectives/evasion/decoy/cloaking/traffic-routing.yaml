# Generic traffic-distribution/cloaking behavior described by the Sekoia
# infostealer distribution survey: inspect request identity, reject automated
# or out-of-target traffic, and route selected users to the payload.
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript, php, html]
  attack: T1497.001,T1614,T1105
  mbc: B0007.003,B0030

composite_rules:
  - id: traffic-distribution-filter
    desc: Filters traffic by crawler, geography, and timing
    crit: suspicious
    conf: 0.96
    all:
      - id: micro-behaviors/data/control-flow/membership::country-list-membership-call
      - id: micro-behaviors/data/control-flow/membership::country-code-membership-argument
      - id: micro-behaviors/time/timing/check::request-duration-check
      - id: micro-behaviors/communications/http/user-agent-routing/crawler
    near_lines: 80

  - id: server-traffic-distribution-filter
    desc: Server-side TDS filter inspects inbound User-Agent
    crit: suspicious
    conf: 0.97
    all:
      - id: micro-behaviors/communications/http/user-agent-routing/inbound
      - id: micro-behaviors/data/control-flow/membership::country-list-membership-call
      - id: micro-behaviors/data/control-flow/membership::country-code-membership-argument
      - id: micro-behaviors/time/timing/check::request-duration-check
      - id: micro-behaviors/communications/http/user-agent-routing/crawler
    near_lines: 80

  - id: server-cloaked-decoy-route
    desc: Server TDS diverts filtered traffic to HTTP 404 decoy
    crit: hostile
    conf: 0.99
    attack: T1497.001,T1614,T1036
    all:
      - id: micro-behaviors/communications/http/user-agent-routing/inbound
      - id: micro-behaviors/communications/http/user-agent-routing/crawler
      - id: micro-behaviors/data/control-flow/membership::country-list-membership-call
      - id: micro-behaviors/data/control-flow/membership::country-code-membership-argument
      - id: micro-behaviors/time/timing/check::request-duration-check
    any:
      - id: micro-behaviors/communications/http/response::server-response-not-found-status
      - id: micro-behaviors/communications/http/response::php-http-response-code-404
      - id: micro-behaviors/communications/http/response::source-http-404-status
    near_lines: 100

  - id: server-targeted-executable-route
    desc: Server TDS routes selected users to executable payload
    crit: hostile
    conf: 0.99
    all:
      - id: micro-behaviors/communications/http/user-agent-routing/inbound
      - id: micro-behaviors/communications/http/user-agent-routing/crawler
      - id: micro-behaviors/data/control-flow/membership::country-list-membership-call
      - id: micro-behaviors/data/control-flow/membership::country-code-membership-argument
      - id: micro-behaviors/time/timing/check::request-duration-check
      - id: micro-behaviors/communications/http/download/url::executable-url-reference-a
    any:
      - id: micro-behaviors/communications/http/response::server-response-method
      - id: micro-behaviors/communications/http/response::php-location-redirect
    near_lines: 100

  - id: server-php-traffic-distribution-filter
    desc: PHP TDS filter combines inbound identity, geography, and timing
    crit: suspicious
    conf: 0.97
    for: [php]
    all:
      - id: micro-behaviors/communications/http/user-agent-routing/inbound
      - id: micro-behaviors/communications/http/user-agent-routing/crawler
      - id: micro-behaviors/data/control-flow/membership::country-code-list-membership
      - id: micro-behaviors/time/timing/check::php-microtime-elapsed-threshold
    near_lines: 80

  - id: server-php-cloaked-decoy-route
    desc: PHP TDS diverts filtered traffic to HTTP 404 decoy
    crit: hostile
    conf: 0.99
    for: [php]
    attack: T1497.001,T1614,T1036
    all:
      - id: micro-behaviors/communications/http/user-agent-routing/inbound
      - id: micro-behaviors/communications/http/user-agent-routing/crawler
      - id: micro-behaviors/data/control-flow/membership::country-code-list-membership
      - id: micro-behaviors/time/timing/check::php-microtime-elapsed-threshold
    any:
      - id: micro-behaviors/communications/http/response::php-http-response-code-404
      - id: micro-behaviors/communications/http/response::source-http-404-status
    near_lines: 100

  - id: server-php-targeted-executable-route
    desc: PHP TDS routes selected users to executable payload
    crit: hostile
    conf: 0.99
    for: [php]
    all:
      - id: micro-behaviors/communications/http/user-agent-routing/inbound
      - id: micro-behaviors/communications/http/user-agent-routing/crawler
      - id: micro-behaviors/data/control-flow/membership::country-code-list-membership
      - id: micro-behaviors/time/timing/check::php-microtime-elapsed-threshold
      - id: micro-behaviors/communications/http/download/url::executable-url-reference-a
    any:
      - id: micro-behaviors/communications/http/response::php-location-redirect
      - id: micro-behaviors/communications/http/response::source-http-404-status
    near_lines: 100

  - id: browser-targeted-executable-route
    desc: Browser TDS routes selected users to executable download
    crit: hostile
    conf: 0.99
    for: [javascript, typescript, html]
    all:
      - id: micro-behaviors/communications/http/user-agent-routing/crawler
      - id: micro-behaviors/data/control-flow/membership::country-list-membership-call
      - id: micro-behaviors/data/control-flow/membership::country-code-membership-argument
      - id: micro-behaviors/time/timing/check::request-duration-check
      - id: objectives/credential-access/phishing/captive-portal::installer-download-link
    any:
      - id: micro-behaviors/ui/window/manage/dom::browser-location-href-assign
      - id: micro-behaviors/ui/window/manage/dom::browser-location-external-assign
      - id: micro-behaviors/ui/window/manage/dom::browser-location-external-method
    near_lines: 100

  # Dropcatch traffic scavengers and similar client-side TDS operators only
  # activate from lingering links on compromised sites. They fingerprint the
  # visitor, ask a remote router for a decision, then either inject the next
  # script or redirect the selected browser. The full chain distinguishes this
  # from ordinary referrer analytics, browser compatibility checks, and static
  # third-party resource loading.
  - id: referrer-profiled-script-router
    desc: Referrer-gated fingerprint router injects remote script
    crit: hostile
    conf: 0.98
    for: [javascript, typescript]
    attack: T1189,T1497.001,T1105
    all:
      - id: micro-behaviors/communications/http/url/path::browser-document-referrer-conditional
      - id: objectives/discovery/system/fingerprint/browser::browser-fingerprint-bundle
      - id: micro-behaviors/communications/http/request/client::fetch-post-pattern
      - id: micro-behaviors/communications/http/request/json::fetch-json-response
      - id: micro-behaviors/process/create/load/remote-code::js-remote-script-element
    near_lines: 100

  - id: referrer-profiled-redirect-router
    desc: Referrer-gated fingerprint router redirects selected browser
    crit: hostile
    conf: 0.98
    for: [javascript, typescript]
    attack: T1189,T1497.001,T1105
    all:
      - id: micro-behaviors/communications/http/url/path::browser-document-referrer-conditional
      - id: objectives/discovery/system/fingerprint/browser::browser-fingerprint-bundle
      - id: micro-behaviors/communications/http/request/client::fetch-post-pattern
      - id: micro-behaviors/communications/http/request/json::fetch-json-response
      - id: micro-behaviors/ui/window/manage/dom::browser-location-external-method
    near_lines: 100

  # Keitaro-style client handoffs collect the current page context and ask a
  # remote tracker to return the next executable JavaScript stage. This exact
  # shape is used by dropcatch traffic scavengers, while the notable atoms stay
  # neutral enough to describe legitimate tracker deployments accurately.
  - id: keitaro-context-profiled-script-loader
    desc: Keitaro client profiles page context and injects a remote script
    crit: suspicious
    conf: 0.98
    attack: T1105,T1189
    all:
      - id: micro-behaviors/communications/http/url/query::keitaro-js-client-return-mode
      - id: micro-behaviors/communications/http/url/query::keitaro-browser-context-query-fields
      - id: micro-behaviors/communications/http/client/resource::dynamic-script-element-load
      - id: micro-behaviors/ui/window/manage/dom::browser-insert-before
    near_bytes: 2400

  - id: keitaro-persistent-campaign-script-loader
    desc: Keitaro client uses stored campaign state to inject a remote script
    crit: suspicious
    conf: 0.98
    attack: T1105,T1189
    all:
      - id: micro-behaviors/communications/http/url/query::keitaro-js-client-return-mode
      - id: micro-behaviors/data/db/web-storage::browser-storage-campaign-state-read
      - id: micro-behaviors/communications/http/client/resource::dynamic-script-element-load
      - id: micro-behaviors/ui/window/manage/dom::browser-insert-before
    near_bytes: 2400

  # Two-part Keitaro handoff (unique/ttl/R_PATH window config → return=js.client
  # script inject). Dropcatch scavengers and Help TDS affiliates reuse this
  # exact client shape across rotating domains.
  - id: keitaro-rpath-handoff-script-loader
    desc: Keitaro R_PATH handoff injects remote script
    crit: suspicious
    conf: 0.98
    attack: T1105,T1189
    all:
      - id: micro-behaviors/communications/http/url/query::keitaro-window-handoff-config
      - id: micro-behaviors/communications/http/url/query::keitaro-js-client-return-mode
      - id: micro-behaviors/communications/http/client/resource::dynamic-script-element-load
      - id: micro-behaviors/ui/window/manage/dom::browser-insert-before
    near_bytes: 2400

  # Swiping Squirrel-style affiliate cloaking: fingerprint the browser, POST to
  # a cloaker that returns an fw forward decision, then advance through the
  # /s/index stage path.
  - id: fingerprint-cloak-fw-stage
    desc: Fingerprint cloaker fw gate to /s/index
    crit: hostile
    conf: 0.98
    for: [javascript, typescript]
    attack: T1497.001,T1105,T1189
    all:
      - id: objectives/discovery/system/fingerprint/browser::browser-fingerprint-bundle
      - id: micro-behaviors/communications/http/request/client::fetch-post-pattern
      - id: micro-behaviors/communications/http/request/json::fetch-json-response
      - id: micro-behaviors/communications/http/url/path::affiliate-cloak-fw-field
      - id: micro-behaviors/communications/http/url/path::affiliate-cloak-stage-path
    near_bytes: 2400

  - id: fingerprint-cloak-relay-redirect
    desc: Fingerprint cloaker relays via /f/index
    crit: hostile
    conf: 0.98
    for: [javascript, typescript]
    attack: T1497.001,T1105,T1189
    all:
      - id: objectives/discovery/system/fingerprint/browser::browser-fingerprint-bundle
      - id: micro-behaviors/communications/http/request/client::fetch-post-pattern
      - id: micro-behaviors/communications/http/url/path::affiliate-relay-stage-path
      - id: micro-behaviors/ui/window/manage/navigation::browser-location-replace
    near_bytes: 2400

  # Stuffy Squirrel-style delivery: remote script loader plus a click-only
  # popunder that blurs the opened window and refocuses the opener so scanners
  # that never click never see the monetization stage.
  - id: click-gated-popunder-script-loader
    desc: Click popunder with remote script loader
    crit: hostile
    conf: 0.98
    for: [javascript, typescript]
    attack: T1189,T1105,T1059.007
    all:
      - id: micro-behaviors/ui/window/manage/click::browser-click-listener
      - id: micro-behaviors/ui/window/manage/popunder::browser-window-open-external-url
      - id: micro-behaviors/communications/http/client/resource::dynamic-script-element-load
      - id: micro-behaviors/ui/window/manage/dom::browser-node-remove
    near_bytes: 2400

  - id: click-gated-popunder-focus-steal
    desc: Click popunder blurs child, focuses opener
    crit: hostile
    conf: 0.97
    for: [javascript, typescript]
    attack: T1189,T1059.007
    all:
      - id: micro-behaviors/ui/window/manage/click::browser-click-listener
      - id: micro-behaviors/ui/window/manage/popunder::browser-window-open-external-url
      - id: micro-behaviors/ui/window/manage/visibility::browser-blur-call
      - id: micro-behaviors/ui/window/manage/dom::browser-window-focus
    near_bytes: 1200

  - id: script-load-failure-pixel-callback
    desc: Script load failure Image beacon callback
    crit: suspicious
    conf: 0.96
    for: [javascript, typescript]
    attack: T1041,T1105
    all:
      - id: micro-behaviors/communications/http/client/resource::dynamic-script-element-load
      - id: micro-behaviors/communications/http/client/resource::browser-image-http-beacon
      - id: micro-behaviors/time/schedule/interval::setTimeout
    near_bytes: 1200
