# SEO-doorway cloaking hidden by hash-delimited charcode packing: the twin
# of packed-search-referrer-redirect for the HTML-Guardian idiom. The blob
# conceals a referrer read, a search-engine name, and a location write; the
# visible page is keyword bait while the hidden script diverts the
# search-engine visitor to the spam target.
defaults:
  platforms: [windows, unix]
  for: [html, javascript]
  attack: T1027,T1036

composite_rules:
  - id: charcode-search-referrer-redirect
    desc: Charcode redirect by search-engine referrer
    crit: hostile
    conf: 0.95
    near_bytes: 6000
    all:
      - id: micro-behaviors/data/encode/charcode::hash-delimited-charcode-blob
      - id: micro-behaviors/communications/http/url/navigation::charcode-concealed-referrer
      - id: micro-behaviors/communications/url/host/name::charcode-concealed-engine-name
      - id: micro-behaviors/ui/window/navigation::charcode-concealed-location
