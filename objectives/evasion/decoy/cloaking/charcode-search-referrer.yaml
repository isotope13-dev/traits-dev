# Distinguish the 404 decoy from the canonical traffic-diversion finding.
# Search/referrer/location references alone established neither a write nor
# a decoy. The old three-token signature repeated the traffic rule.
defaults:
  platforms: [windows, unix]
  for: [html, javascript]
  attack: T1027

composite_rules:
  - id: charcode-search-referrer-redirect
    desc: Packed search redirect with 404 decoy path
    crit: hostile
    conf: 0.95
    near_bytes: 6000
    all:
      - id: objectives/impact/ui/manipulation/traffic::charcode-search-referrer-redirect
      - id: metadata/lang/source/literal::hash-decimal-quoted-404-html
