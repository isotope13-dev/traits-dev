# Hacked-site redirector: only a random fraction of visitors (one draw in N)
# is sent, after a delay, to a PHP endpoint on another host. Sampling keeps
# the site owner and repeat visitors from noticing; the delay lets the page
# render first. The remote PHP is typically a traffic-distribution script.
defaults:
  for: [javascript]
  platforms: [windows, unix]
  attack: T1189

composite_rules:
  - id: random-sampled-delayed-php-redirect
    desc: Randomly sampled delayed redirect to remote PHP
    crit: hostile
    conf: 0.93
    all:
      - id: micro-behaviors/data/control-flow/branch::random-integer-equality-gate
      - id: micro-behaviors/ui/window/navigation::settimeout-string-absolute-location-redirect
      - id: micro-behaviors/communications/http/url/php-endpoint::url-php-endpoint-script
