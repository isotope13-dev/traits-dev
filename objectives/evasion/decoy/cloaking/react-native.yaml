# Mobile store-review cloaking where a React Native component posts locally
# collected state to a remote server and only then renders a full-screen WebView
# at the URL returned in the response.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, npm]
  attack: T1195.002,T1497,T1036
  mbc: B0007.003

composite_rules:
  - id: react-native-server-driven-webview-cloak
    desc: React Native component gates full-screen WebView on remote HTTP response
    crit: hostile
    conf: 0.97
    scope: archive
    all:
      - id: micro-behaviors/communications/http/post::axios-post-source
      - id: micro-behaviors/ui/window/webview::react-native-webview-state-uri-source
      - id: micro-behaviors/ui/window/webview::react-native-modal-hosted-webview
    near_lines: 150
