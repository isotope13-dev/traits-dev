# The polyfill.io redirect controller, recognized through its obfuscation.
#
# The shipped payload is javascript-obfuscator output: hosts, cookie names and
# redirect targets all live in an RC4-encoded string table, so the rules that
# key on `googie-anaiytics.com` or `admin_id` only fire on a deobfuscated copy.
# What the obfuscator leaves alone is the top-level function and global names,
# because renaming those would break the page that calls them --
# `renameGlobals` is off by default.
#
# So the controller is identified by its own vocabulary: a cluster of
# analytics-presence flags (one per tracker it waits for) plus the redirect
# entry points. Those names are campaign-specific rather than generic, which
# is what makes the cluster meaningful; a variant that renames them loses
# nothing except this rule, while a variant that keeps them is the same
# operator's code.
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript, html]
  attack: T1189,T1027
  mbc: B0032
  crit: component
  conf: 0.9

traits:
  - id: analytics-flag-bdtjfg
    crit: notable
    desc: '"bdtjfg" analytics-presence flag'
    if:
      type: text
      word: bdtjfg
  - id: analytics-flag-cnzfg
    crit: notable
    desc: '"cnzfg" analytics-presence flag'
    if:
      type: text
      word: cnzfg
  - id: analytics-flag-wolafg
    crit: notable
    desc: '"wolafg" analytics-presence flag'
    if:
      type: text
      word: wolafg
  - id: analytics-flag-mattoo
    crit: notable
    desc: '"mattoo" analytics-presence flag'
    if:
      type: text
      word: mattoo
  - id: analytics-flag-aanaly
    crit: notable
    desc: '"aanaly" analytics-presence flag'
    if:
      type: text
      word: aanaly
  - id: analytics-flag-ggmana
    crit: notable
    desc: '"ggmana" analytics-presence flag'
    if:
      type: text
      word: ggmana
  - id: analytics-flag-aplausix
    crit: notable
    desc: '"aplausix" analytics-presence flag'
    if:
      type: text
      word: aplausix
  - id: analytics-flag-statcct
    crit: notable
    desc: '"statcct" analytics-presence flag'
    if:
      type: text
      word: statcct
  - id: entry-point-check-tiaozhuan
    crit: notable
    desc: '"check_tiaozhuan" redirect controller name'
    if:
      type: text
      word: check_tiaozhuan
  - id: entry-point-vfed-update
    crit: notable
    desc: '"vfed_update" redirect controller name'
    if:
      type: text
      word: vfed_update
  - id: entry-point-usercache
    crit: notable
    desc: '"usercache" redirect controller name'
    if:
      type: text
      word: usercache

composite_rules:
  # One flag is a coincidence; three of these eight together are the tracker
  # list the controller waits on before it redirects.
  - id: analytics-presence-flag-cluster
    desc: Analytics-presence flag variable cluster
    crit: notable
    conf: 0.9
    needs: 3
    any:
      - id: analytics-flag-bdtjfg
      - id: analytics-flag-cnzfg
      - id: analytics-flag-wolafg
      - id: analytics-flag-mattoo
      - id: analytics-flag-aanaly
      - id: analytics-flag-ggmana
      - id: analytics-flag-aplausix
      - id: analytics-flag-statcct

  - id: redirect-controller-entry-points
    desc: Redirect controller function names
    crit: notable
    conf: 0.92
    needs: 2
    any:
      - id: entry-point-check-tiaozhuan
      - id: entry-point-vfed-update
      - id: entry-point-usercache

  - id: obfuscated-analytics-gated-redirect
    desc: Obfuscated analytics-gated redirect controller
    crit: hostile
    conf: 0.96
    all:
      - id: analytics-presence-flag-cluster
      - id: redirect-controller-entry-points
