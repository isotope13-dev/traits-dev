# Web-inject cloaking: the payload deliberately spares the people who could
# notice it.
#
# A script injected into a site wants ordinary visitors and not the site's own
# staff -- an administrator who gets redirected files a ticket, and the inject
# is found the same day. The universal tell is a *negative* cookie test: the
# redirect runs only when no admin session cookie is present. The 2024
# polyfill.io injection gated on `admin_id` and `adminlevels` before sending
# mobile visitors to an attacker host; the same guard recurs across CMS
# web-injects regardless of the CMS or the destination.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, html, php]
  attack: T1497
  mbc: B0007

traits:
  - id: admin-session-cookie-probe
    desc: Tests for an administrator session cookie
    crit: suspicious
    conf: 0.9
    if:
      type: text
      regex: 'cookie[^;\n]{0,40}(indexOf|includes|match|search)\s*\(\s*["''][a-z_]{0,6}admin'
      case_insensitive: true
    unless:
      - id: metadata/package/testing/harness/unit/

composite_rules:
  # Navigating the visitor away only when they are not an administrator is
  # cloaking, not feature detection: no legitimate site hides a redirect from
  # its own operators.
  - id: admin-excluded-redirect
    desc: Redirect skipped for site administrators
    crit: hostile
    conf: 0.95
    scope: file
    all:
      - id: admin-session-cookie-probe
      - id: micro-behaviors/ui/window/manage/dom::browser-location-href-assign
    unless:
      - id: metadata/package/testing/harness/unit/
      - id: metadata/package/testing/presence/manifest::test-fixtures
