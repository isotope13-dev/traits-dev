defaults:
  platforms: [windows, unix]
  for: [html]
  attack: T1566.002,T1036
composite_rules:
  - id: delayed-base64-fragment-redirect
    desc: Timed redirect to a base64-fragment URL
    crit: hostile
    conf: 0.9
    all:
      - id: metadata/lang/source/literal/fragment/sequence::base64-fragment-array-reduce
      - id: micro-behaviors/ui/window/navigation/location::window-bracket-href-assignment
      - id: micro-behaviors/time/schedule/callback::markup-timer-call-text
