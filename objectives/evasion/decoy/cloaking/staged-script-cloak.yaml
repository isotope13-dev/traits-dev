# Cloaked execution of cipher-staged scripts. The concealment assembly (a
# re-keying substitution cipher fed paired kilobyte-scale blobs behind a
# content-free noscript frame) hides what the page runs; requiring the
# document.write execution sink as well states the evasion result: staged
# scripts execute while static inspection sees only ciphertext. Single-role
# subsets stay at their own levels — the bare rotating decoder is
# suspicious, an analytics noscript frame is notable — only the full
# hide-and-execute combination is hostile.
defaults:
  platforms: [windows, unix]
  for: [html]

composite_rules:
  - id: cloaked-cipher-script-execution
    desc: Cloak hides cipher-staged script execution
    crit: hostile
    conf: 0.96
    all:
      - id: objectives/anti-static/obfuscation/encoding/custom::rotating-substitution-document-writer
      - id: metadata/file/encoding::dense-backslash-escape-triples
      - id: micro-behaviors/ui/window/insert-html::browser-document-write
      - id: micro-behaviors/ui/window/html::noscript-empty-iframe
    near_bytes: 6000
