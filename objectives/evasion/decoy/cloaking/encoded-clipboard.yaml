# A referrer gate alone is legitimate traffic routing. This gate conceals an
# already admitted deceptive clipboard loader from direct visitors.
defaults:
  platforms: [macos]
  for: [html]
composite_rules:
  - id: referrer-gated-encoded-clipboard-decoy
    desc: Referrer gate conceals deceptive clipboard loader
    crit: hostile
    conf: 0.98
    near_bytes: 2048
    all:
      - id: objectives/execution/lure/clipboard/page::browser-clipboard-encoded-shell-loader
      - id: micro-behaviors/communications/http/redirect::referrer-regex-rejection-location-replace
