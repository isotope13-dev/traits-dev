defaults:
  platforms:
  - windows
composite_rules:
- id: batch-quiet-msi-fetch-install-error-decoy
  for:
  - batch
  desc: MSI fetch and quiet install beside error decoy
  crit: hostile
  conf: 0.99
  attack: T1105,T1218.007,T1036
  near_bytes: 2048
  all:
  - id: micro-behaviors/communications/http/url/github::github-web-raw-msi-url
  - id: micro-behaviors/communications/http/download/webclient::webclient-downloadfile-msi-url
  - id: micro-behaviors/process/create/installer::msiexec-package-verb
  - id: micro-behaviors/process/create/installer::msiexec-quiet-switch
  - id: micro-behaviors/ui/dialog/error::wsh-timed-error-popup
  - id: micro-behaviors/ui/dialog/error::wsh-document-popup-text
