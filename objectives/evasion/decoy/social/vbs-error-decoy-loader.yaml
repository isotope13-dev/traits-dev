# The script shows a context-free error dialog as it starts and goes on to
# execute an HTTP response body: the victim believes the attachment failed
# while the remote stage runs.
defaults:
  platforms: [windows]
  for: [vbs]
  attack: T1036,T1059.005

composite_rules:
  - id: vbs-fake-error-fronts-remote-execution
    desc: Fake error dialog fronts remote code execution
    crit: hostile
    conf: 0.95
    all:
      - id: micro-behaviors/ui/dialog/error::vbs-opening-bare-error-msgbox
      - id: objectives/execution/payload/script-eval/network/response-body::vbs-http-response-execute
