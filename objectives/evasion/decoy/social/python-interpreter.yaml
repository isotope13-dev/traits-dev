defaults:
  platforms:
  - unix
  - windows
  for:
  - python
traits:
- id: python-payload-error-cover-handler
  desc: Payload errors invoke interpreter error cover
  crit: suspicious
  conf: 0.98
  if:
    type: tree-sitter
    query: |-
      (module
        (function_definition name: (identifier) @cover
          body: (block (expression_statement (call function: (identifier) @printer) @message)))
        (function_definition body: (block
          (if_statement consequence: (block
            (try_statement
              body: (block (expression_statement (call function: (identifier) @exec)))
              (except_clause (block (expression_statement (call function: (identifier) @called_cover)))))))))
        (#eq? @printer "print")
        (#match? @message "python: can't open file")
        (#eq? @exec "exec")
        (#eq? @cover @called_cover)
      )
composite_rules:
- id: python-remote-payload-fake-interpreter-error
  desc: Remote payload failures mimic Python errors
  crit: hostile
  conf: 0.98
  attack: T1036
  all:
  - id: python-payload-error-cover-handler
  - id: micro-behaviors/process/deploy::python-gzip-base64-compile-exec
  - id: micro-behaviors/communications/http/lib/urllib::urllib-urlopen
