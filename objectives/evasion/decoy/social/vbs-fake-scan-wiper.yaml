# The script greets the user with a message box claiming to scan or disinfect
# the computer, then deletes the Windows folder or wildcard-deletes system
# files: the fake security dialog keeps the victim clicking while the
# destruction runs.
defaults:
  platforms: [windows]
  for: [vbs]
  attack: T1036,T1485

composite_rules:
  - id: vbs-fake-scan-dialog-with-system-wipe
    desc: Fake scan dialog fronts system file deletion
    crit: hostile
    conf: 0.96
    all:
      - id: micro-behaviors/ui/dialog/message::vbs-msgbox-computer-scan-claim
    any:
      - id: objectives/impact/destroy/filesystem::wsh-windows-folder-delete
      - id: objectives/impact/destroy/filesystem::wsh-system-directory-wildcard-delete
      - id: objectives/impact/destroy/filesystem::wsh-all-drives-file-wipe
