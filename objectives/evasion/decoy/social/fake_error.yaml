defaults:
  platforms: [unix, windows]
  crit: suspicious
  conf: 0.8
  mbc: B0011.001
  for: [scripts, pe, dll]
traits:
  - id: fake-error-document-corrupt-state
    for: [powershell, batch, vbs, javascript, html, pe, dll]
    desc: Fake document corrupt message
    crit: suspicious
    if:
      type: encoded
      # The noun has to be the subject of the lure, not the tail of a compound
      # ("bytecode executable program file appears to be corrupt" is a
      # js_of_ocaml runtime diagnostic, shipped inside xml2js's browser build).
      # So require a determiner, or the start of the string/line the message
      # was extracted from.
      regex: (?i)(this|the|your|[\n"'`(:>])\s*(document|pdf|file)\s(is|appears to be)\scorrupt(ed)?\b
    unless:
      - id: well-known/app/system/reactos::system-component
  - id: fake-error-document-damaged-state
    for: [powershell, batch, vbs, javascript, html, pe, dll]
    desc: Fake document damaged message
    crit: suspicious
    if:
      type: encoded
      regex: (?i)(this|the|your|[\n"'`(:>])\s*(document|pdf|file)\s(is|appears to be)\sdamaged\b
  - id: fake-error-dll-missing
    desc: Fake DLL missing lure
    attack: T1036
    for: [pe, scripts]
    if:
      type: text
      regex: '\b[A-Za-z][A-Za-z0-9_]+\.dll is missing from your computer'
  - id: fake-error-nvsix-not-installed
    desc: Fake nvsix DLL install failure
    crit: suspicious
    conf: 0.96
    attack: T1036
    for: [pe]
    if:
      type: text
      substr: Packet nvsix.dll not installed!
composite_rules:
  - id: fake-error-document-corrupted
    for: [powershell, batch, vbs, javascript, html, pe, dll]
    desc: Fake 'document corrupted' error message
    any:
      - id: fake-error-document-corrupt-state
      - id: fake-error-document-damaged-state
