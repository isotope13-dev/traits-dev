defaults:
  platforms: [unix, windows]
  crit: suspicious
  conf: 0.8
  mbc: B0011.001
  attack: T1036
  for: [scripts, pe, dll]
traits:
  - id: fake-error-dll-missing
    desc: Fake DLL missing lure
    for: [pe, scripts]
    if:
      type: text
      regex: '\b[A-Za-z][A-Za-z0-9_]+\.dll is missing from your computer'
  - id: fake-error-nvsix-not-installed
    desc: Fake nvsix DLL install failure
    crit: suspicious
    conf: 0.96
    for: [pe]
    if:
      type: text
      substr: Packet nvsix.dll not installed!

composite_rules:
  # The popup is not convicted by its wording. The structural timed WSH
  # dialog is paired with a downloaded RMM MSI, silent installation, and a
  # self-elevation request: the dialog exists to occupy the user while the
  # remote-access foothold is installed without installer UI.
  - id: timed-error-conceals-rmm-install
    desc: Timed WSH error conceals an elevated silent RMM install
    crit: hostile
    conf: 0.99
    for: [batch]
    attack: T1036,T1105,T1219,T1548.002
    near_bytes: 4096
    all:
      - id: micro-behaviors/ui/dialog/error::wsh-timed-error-popup
      - id: micro-behaviors/communications/http/download/webclient::webclient-downloadfile-msi-url
      - id: micro-behaviors/process/create/installer::msiexec-package-verb
      - id: micro-behaviors/process/create/installer::msiexec-quiet-switch
      - id: micro-behaviors/os/privilege/elevation::runas-verb
      - id: objectives/command-and-control/backdoor/control/rmm::remote-access-agent-reference
