defaults:
  platforms: [windows, unix]
  for: [javascript, typescript, chrome-manifest, crx, xpi, zip]
composite_rules:
  # Ordinary fullscreen dialogs retain their neutral style/DOM findings.
  # The intrusive browser controller supplies the hostile context here.
  - id: remote-browser-controller-iframe-overlay
    desc: Browser controller covers pages with iframe
    crit: hostile
    conf: 0.97
    scope: archive
    attack: T1185
    all:
      - id: objectives/command-and-control/remote-command/extension::extension-websocket-browser-remote-control
      - id: micro-behaviors/ui/window/insert-html::browser-create-iframe-element
      - id: micro-behaviors/ui/window/style::fixed-viewport-style
      - id: micro-behaviors/ui/window/style::viewport-width-css
      - id: micro-behaviors/ui/window/style::viewport-height-css
      - id: micro-behaviors/ui/window/style::high-z-index-style
      - id: micro-behaviors/ui/window/style::browser-dom-overflow-suppressed
