defaults:
  for: [pe]
  platforms: [windows]

traits:
- id: pinball-game-strings--rx-1
  desc: Regex component marker
  crit: component
  conf: 0.95
  if:
    type: text
    regex: (?i)(3d.?pinball|pinball\.hlp)

- id: pinball-game-strings--rx-2
  desc: Regex component marker
  crit: component
  conf: 0.95
  if:
    type: text
    regex: (?i)(pinball\.pdb|pinball\.dat)

- id: pinball-game-strings--rx-3
  desc: "Matches 'pinballtheme'"
  crit: notable
  conf: 0.95
  if:
    type: text
    regex: (?i)(pinballexe|pinballtheme)

- id: pinball-game-strings--rx-4
  desc: "Matches 'dlg_highscores'"
  crit: notable
  conf: 0.95
  if:
    type: text
    regex: (?i)(dlg_highscores|pinball\.exe)

composite_rules:
- id: pinball-overlay-camouflage
  desc: 3D Pinball game data camouflaging malware overlay
  crit: suspicious
  conf: 0.92
  all:
  - id: metadata/binary/layout/ratio::overlay-over-90pct
  any:
  - id: objectives/evasion/decoy/overlay::pinball-game-strings--rx-1
  - id: objectives/evasion/decoy/overlay::pinball-game-strings--rx-2
  - id: objectives/evasion/decoy/overlay::pinball-game-strings--rx-3
  - id: objectives/evasion/decoy/overlay::pinball-game-strings--rx-4
  unless:
  - id: metadata/signed/platform::microsoft-corporation
  - id: metadata/binary/vendor::microsoft-corp-versioninfo
