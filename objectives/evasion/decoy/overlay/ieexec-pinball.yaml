defaults:
  for: [pe]
  platforms: [windows]

composite_rules:
  - id: ieexec-pinball-overlay-registry-clues
    desc: IEExec/Pinball overlay with registry clues
    crit: suspicious
    conf: 0.97
    all:
      - id: objectives/evasion/decoy/overlay::ieexec-name-dominant-overlay
      - id: pinball-overlay-camouflage
      - id: metadata/binary/layout/embedded::pe-embedded
    any:
      - id: "micro-behaviors/os/registry/autostart/reference::currentversion-run-key-path"
      - id: micro-behaviors/os/registry/com/reference::clsid-registry-key-path
      - id: micro-behaviors/os/registry/com/reference::clsid-inprocserver32-key-path
