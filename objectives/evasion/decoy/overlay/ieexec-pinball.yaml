defaults:
  for: [pe]
  platforms: [windows]

composite_rules:
  - id: ieexec-pinball-overlay-registry-clues
    desc: IEExec/Pinball overlay with registry clues
    crit: suspicious
    conf: 0.97
    all:
      - id: objectives/anti-static/obfuscation/binary-metrics/profile::ieexec-name-dominant-overlay
      - id: pinball-overlay-camouflage
      - id: metadata/binary/layout/embedded::pe-embedded
    any:
      - id: objectives/persistence/login/startup/registry::software-run-key
      - id: objectives/persistence/system/registry/com-hijack::clsid-registry-path
      - id: objectives/persistence/system/registry/com-hijack::inprocserver32-write
