defaults:
  for: [pe]
  platforms: [windows]

composite_rules:
  - id: ieexec-pinball-overlay-registry-clues
    desc: IEExec/Pinball overlay with registry clues
    crit: suspicious
    conf: 0.97
    all:
      - id: objectives/anti-static/obfuscation/binary-metrics/profile::ieexec-name-dominant-overlay
      - id: pinball-overlay-camouflage
      - id: metadata/binary/layout/embedded::pe-embedded
    any:
      - id: micro-behaviors/os/registry/keys::software-run-key-reference
      - id: micro-behaviors/os/com/registration::clsid-registry-key-path
      - id: micro-behaviors/os/com/registration::clsid-inprocserver32-key-path
