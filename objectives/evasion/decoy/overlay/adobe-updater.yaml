# An unsigned PE (here an embedded RAT or a binder) with a complete, signed
# Adobe ARM updater executable appended after its image. The appended updater
# is a decoy carried in the overlay; the outer PE does not claim Adobe
# identity in its own version resource, so this is overlay camouflage rather
# than identity masquerade. Repackagers can also append vendor binaries, so
# this stays suspicious without a payload identity.
defaults:
  platforms: [windows]
  for: [pe]
  attack: T1036

composite_rules:
  - id: unsigned-pe-adobe-updater-overlay-camouflage
    desc: Unsigned PE appends Adobe updater decoy
    crit: suspicious
    conf: 0.93
    all:
      - id: well-known/app/productivity/adobe-reader::adobe-arm-component-names-in-overlay
      - id: well-known/app/productivity/adobe-reader::adobe-updater-window-title-in-overlay
      - id: metadata/binary/debug::adobe-product-pdb-reference
      - id: metadata/signed/trust-level::unsigned-missing-signature-record
    unless:
      - id: metadata/signed/platform/
