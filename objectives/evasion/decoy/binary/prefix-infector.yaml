# Self-extractors can copy an embedded file and open it. This claim additionally
# requires executable-prefix infection of other files, so the restored host is
# the infection's cover rather than an ordinary installer payload. Shell-open
# is file-scoped support, not a resolved argument-flow or runtime-success claim.
defaults:
  platforms: [windows]
  for: [pe]
composite_rules:
  - id: prefix-infector-host-restoration-shell-open
    desc: Infector host restoration with shell-open support
    crit: hostile
    conf: 0.97
    all:
      - id: objectives/impact/infect/binary/rewrite::drive-walking-executable-prefix-infector
      - id: micro-behaviors/data/reassembly::x86-tail-prefix-transform-body-copy
      - id: micro-behaviors/process/create/shellexec::shell-execute-a
