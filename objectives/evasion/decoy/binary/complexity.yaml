defaults:
  platforms: [windows]
  for: [pe]
composite_rules:
  - id: high-complexity-decoy-dll
    desc: High complexity but very few functions
    crit: notable
    for: [dll]
    all:
      - id: metadata/binary/metrics/anomaly::high-complexity-marker
      - id: metadata/binary/metrics/anomaly::low-function-count-marker
    unless:
      - id: metadata/binary/framework/
      - id: metadata/signed/certificate/identity::pe-signature-verified
      - id: metadata/build/manifest::msbuild-engine-binary
      - id: metadata/file/extension/identity::exe-extension
      - id: metadata/binary/installer/family/
      - id: metadata/binary/layout::efi-pe-subsystem
      # A DLL with no executable section carries no code to be complex about:
      # it is a resource-only library (MUI satellites, timezone and message
      # tables), and the complexity metric is measuring its resource blob.
      # Wine's tzres.dll is one of these, as is every Windows *.mui.
      - id: metadata/binary/metrics/structural::pe-no-executable-sections
    downgrade:
      any:
        - id: metadata/binary/section/names::upx-section
        - id: well-known/app/system/crayens/
