# Fraudulent award letters use a recognizable combination: an unexplained
# random beneficiary selection, a fictitious electronic selector, a payment
# beneficiary form, and an unsolicited entitlement claim. Each phrase is only a
# fragment; all four together describe the deceptive document, independent of
# the impersonated brand, named executive, amount, or reply address.
defaults:
  platforms: [windows, unix]
  for: [xml, html, pdf, rtf, text]
  crit: component
  conf: 0.94

traits:
  # Cleave deliberately keeps an OOXML package as one analysis unit and does
  # not surface word/document.xml as a child file. The ZIP directory still
  # exposes that member's CRC. This fingerprint therefore bridges the known
  # malicious body into the outer-document report and survives timestamp or
  # compression-level repacks of the attachment. The structural legs on the
  # composite below prevent an unrelated member with the same CRC from being
  # interpreted as the Word body.
  - id: google-grant-scam-document-body-crc32
    desc: Known Google grant scam XML body checksum
    crit: suspicious
    conf: 0.999
    for: [ooxml]
    ref: sha256:485bc6844a29d1b8e1ee90c33ca6731182a48cf410be075e73a1b62da9c9a429
    if:
      type: value
      path: archive.members[*].crc32
      regex: '^1491322602$'

  - id: random-beneficiary-selection-claim
    desc: Random beneficiary selection claim
    if:
      type: text
      substr: RANDOMLY SELECTED
      case_insensitive: true

  - id: electronic-email-selector-claim
    desc: Electronic email selection claim
    # This invented selection mechanism is recognizable scam copy even by
    # itself; the surrounding beneficiary and payment language supplies the
    # hostile verdict in the composite below.
    crit: suspicious
    if:
      type: text
      substr: Online E-mail Electronic Selection Programmer
      case_insensitive: true

  - id: payment-beneficiary-form-label
    desc: Payment beneficiary form label
    if:
      type: text
      substr: PAYMENT/BENEFICIARY
      case_insensitive: true

  - id: primary-recipient-entitlement-claim
    desc: Primary recipient entitlement claim
    if:
      type: text
      substr: primary recipient, you are entitled to
      case_insensitive: true

composite_rules:
  - id: known-google-grant-scam-ooxml
    desc: OOXML contains the known Google grant scam body
    crit: hostile
    conf: 0.999
    for: [ooxml]
    all:
      - id: google-grant-scam-document-body-crc32
      - id: metadata/document/office/markup::word-document-part
      - id: metadata/document/office/markup::ooxml-three-embedded-objects
      - id: metadata/file/extension/identity::document-content-extension-mismatch

  - id: unsolicited-award-scam-letter
    desc: Document presents a fabricated random-beneficiary award
    crit: hostile
    conf: 0.99
    all:
      - id: random-beneficiary-selection-claim
      - id: electronic-email-selector-claim
      - id: payment-beneficiary-form-label
      - id: primary-recipient-entitlement-claim
