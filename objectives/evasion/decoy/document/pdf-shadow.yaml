# PDF shadow attacks: content added to a signed document after signing, so a
# reader validates the signature while displaying different values.
#
# A certified form that a reader fills in and saves re-declares its widgets,
# and a dense AcroForm overlaps neighboring boxes on its own. Those two facts
# co-occur on Zurich's published tax and referral forms and on ordinary IRS
# fillable forms, so the combination is structural context. It is not, by
# itself, a second widget hidden behind the visible one.
defaults:
  platforms: [windows, unix]
  for: [pdf]
  attack: T1036

composite_rules:
  - id: pdf-shadow-hidden-form-field-after-signature
    desc: Signed PDF hides a duplicate form field
    crit: notable
    conf: 0.95
    all:
      - id: metadata/document/pdf/signature::pdf-signed-post-signature-incremental-update
      - id: metadata/document/pdf/form::pdf-overlapping-form-fields
      - id: metadata/document/pdf/form::pdf-duplicate-form-name-and-rect
