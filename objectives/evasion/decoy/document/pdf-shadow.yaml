# PDF shadow attacks: content added to a signed document after signing, so a
# reader validates the signature while displaying different values.
#
# Both legs are required. A certified form that a reader fills in and saves
# gains an incremental update that re-declares its widgets, so overlapping
# rectangles alone -- or a repeated field name and rectangle alone -- describe
# Zurich's published tax and referral forms as accurately as they describe an
# attack. Requiring the overlap *and* the duplicated name/rect narrows it to a
# second widget hidden behind the visible one.
defaults:
  platforms: [windows, unix]
  for: [pdf]
  attack: T1036

composite_rules:
  - id: pdf-shadow-hidden-form-field-after-signature
    desc: Signed PDF hides a duplicate form field
    crit: suspicious
    conf: 0.95
    all:
      - id: metadata/document/pdf/properties::pdf-signed-post-signature-incremental-update
      - id: metadata/document/pdf/properties::pdf-overlapping-form-fields
      - id: metadata/document/pdf/properties::pdf-duplicate-form-name-and-rect
