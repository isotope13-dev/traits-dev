# Document-side lure content — text and structural cues that
# appear inside an office document body to social-engineer the user
# into enabling macros or clicking through.
#
# These atomics scan the raw document bytes (works for both legacy
# OLE2 streams and OOXML XML parts) for the canonical phishing
# strings used by Emotet/IcedID/Qakbot/TrickBot droppers and recent
# Russian-state lures. Each atomic is `notable` standalone; the
# composite combines them with VBA presence to flag the lure-plus-
# payload pattern that's nearly always malicious.
defaults:
  for: [oledoc, ooxml, xlsx]
  platforms: [windows, unix]
  crit: notable
  conf: 0.9

traits:
  # --- "Enable Editing" / "Enable Content" lure banner text ---
- id: lure-enable-editing
  desc: Enable Editing lure banner text
  if:
    type: text
    substr: Enable Editing
    case_insensitive: true
- id: lure-enable-content
  desc: Enable Content lure banner text
  if:
    type: text
    substr: Enable Content
    case_insensitive: true
- id: lure-enable-macros
  desc: Enable Macros lure banner text
  if:
    type: text
    substr: Enable Macros
    case_insensitive: true
- id: lure-protected-view
  desc: Document references Protected View
  if:
    type: text
    substr: Protected View
    case_insensitive: true

  # --- Brand impersonation strings (DocuSign, Microsoft 365, Adobe
  #     are the canonical phishing brands for office-doc lures) ---
- id: lure-docusign-brand
  desc: DocuSign brand impersonation text
  if:
    type: text
    substr: DocuSign
    case_insensitive: true
- id: lure-office365-brand
  desc: Office 365 / Microsoft 365 brand text
  if:
    type: text
    regex: '(?i)(Microsoft|Office)\s+365'
- id: lure-adobe-brand
  desc: Adobe brand impersonation text
  unless:
    - id: metadata/file/format/appx::windows-appx-archive-context
  if:
    type: text
    substr: Adobe
    case_insensitive: true

  # --- "Created in newer version" classic Excel-XLM lure ---
- id: lure-newer-version-banner
  desc: Created-in-newer-version lure
  if:
    type: text
    regex: '(?i)created\s+in\s+(a\s+)?newer\s+version'

  # --- "Document protected" / "decryption required" lure ---
- id: lure-decryption-required
  desc: Decryption-required lure text
  if:
    type: text
    regex: '(?i)decryption\s+required'

  # --- "This document failed to open, do something" lure ---
  # The banner text above names the button the victim has to press. This pair
  # names the pretext instead: the document claims it could not render, then
  # tells the reader to take a step to fix it. Builders rotate the wording far
  # faster than they rotate the pretext, so matching the shape of the sentence
  # outlives matching any one campaign's copy -- and neither sentence has a
  # reason to appear in a spreadsheet that really does open.
- id: lure-problem-opening-document
  desc: Document claims it failed to open
  if:
    type: text
    regex: '(?i)(problem|error|issue)\s+(while\s+)?opening\s+th(e|is)\s+\w+'
- id: lure-perform-following-step
  desc: Document instructs the reader to act
  if:
    type: text
    regex: '(?i)(perform|follow|complete)\s+the\s+following\s+steps?'
composite_rules:
  # Generic lure-plus-macro: any lure banner combined with a VBA
  # project. This is the canonical phishing-document pattern.
- id: lure-banner-with-macros
  desc: Lure banner combined with VBA macros
  crit: suspicious
  unless:
    - id: metadata/file/format/appx::windows-appx-archive-context
  conf: 0.95
  attack: T1204.002
  all:
  - id: metadata/document/office/markup::ooxml-vba-project-content
  any:
  - id: lure-enable-editing
  - id: lure-enable-content
  - id: lure-enable-macros
  - id: lure-newer-version-banner
  # The same lure pattern behind the older interpreter. `lure-banner-with-macros`
  # above requires an OOXML VBA project, which an XLM dropper does not have --
  # its code is a BIFF macro sheet, so the rule that was written for exactly
  # this shape could never reach it. A workbook that both carries an Excel 4.0
  # macro sheet and argues with the reader about why it will not display is
  # making the argument to get the macro banner clicked.
# objectives/execution/interpreter/document::stored-excel4-macro-sheet checks
# a BOUNDSHEET record, a legacy BIFF/OLE-only structure -- `for: [oledoc]`,
# deliberately, per its own comment ("Excel still runs these but has not
# written one since the 1990s"). `xlsx` resolves to the same Ooxml FileType
# the BIFF record can never appear in, so it was never reachable here.
- id: lure-banner-with-macro-sheet
  desc: Lure banner with an Excel 4.0 macro sheet
  crit: hostile
  conf: 0.96
  attack: T1204.002,T1059.005
  for: [oledoc]
  all:
  - id: objectives/execution/interpreter/document::stored-excel4-macro-sheet
  any:
  - id: lure-enable-editing
  - id: lure-enable-content
  - id: lure-enable-macros
  - id: lure-newer-version-banner
  - id: lure-problem-opening-document
  - id: lure-perform-following-step
  - id: lure-decryption-required
- id: brand-lure-with-macros
  desc: Brand-impersonation lure with VBA macros
  crit: hostile
  conf: 0.96
  attack: T1204.002
  all:
  - id: metadata/document/office/markup::ooxml-vba-project-content
  any:
  - id: lure-docusign-brand
  - id: lure-office365-brand
  - id: lure-adobe-brand
