# An HTA whose visible body is an unpunctuated word list while a remote
# script element supplies the real code. A glossary page has punctuation
# and markup; this pairing is filler text over a staged script.
defaults:
  platforms: [windows]
  for: [html]
  attack: T1027
  crit: hostile
  conf: 0.95

composite_rules:
  - id: hta-word-run-remote-script
    desc: HTA word-list body hides a remote script
    near_bytes: 4000
    all:
      - id: metadata/file/extension/identity::hta-html-application-extension
      - id: metadata/document/html::untagged-body-word-run
      - id: micro-behaviors/communications/http/client/resource::remote-script-element-source
