# Fraudulent survey-reward solicitations: an unsolicited invitation to answer a
# questionnaire for a monetary account credit, with the call to action hidden
# behind URL display text. Each phrase alone is ordinary (market-research
# mail runs surveys; banks advertise credits); all three together describe
# the reward lure independent of the impersonated brand or amount, the same
# way the award-scam letter in award-scam.yaml generalizes past one campaign.
defaults:
  platforms: [windows, unix]
  for: [html]
  crit: notable
  conf: 0.9
traits:
  # One bare keyword, like the pharma-spam keyword fragments: ordinary copy
  # mentions surveys constantly, so alone it is evidence only inside the
  # composite below.
  - id: survey-reference
    desc: References a survey or questionnaire
    crit: component
    if:
      type: text
      regex: '(?i)\b(survey|questionnaire)\b'
      exclude_html_comments: true
  - id: monetary-account-credit-reference
    desc: References money credited to an account
    if:
      type: text
      # "credit" must name the payment. A bare "$20 ... account" is ordinary
      # news copy (a donation delivered to a campaign account) and does not
      # say the money was credited.
      regex: '(?is)\bcredit\w{0,4}\b.{0,40}\$\s*\d[\d,]*.{0,40}\baccount\b'
      exclude_html_comments: true
composite_rules:
  - id: fraudulent-survey-reward-lure
    desc: Survey reward lure with concealed link
    crit: hostile
    conf: 0.93
    attack: T1566.002
    near_bytes: 4000
    all:
      - id: survey-reference
      - id: monetary-account-credit-reference
      - id: micro-behaviors/ui/window/html::url-text-anchor
    # Legitimate survey promotions carry the same bulk-mail furniture as any
    # sender (unsubscribe and view-in-browser links); its absence is what
    # separates the unsolicited fraud lure from a real campaign. The three
    # phrases must also sit in one solicitation: a news page can mention a
    # survey, a campaign donation to an account, and a URL-as-text link in
    # unrelated sections.
    unless:
      - id: micro-behaviors/ui/window/html::bulk-mail-furniture-reference
