# Shortcut posing as a document: it carves a real document from its own
# body, saves it under its own name with the document extension and opens
# it, so the user sees the file they expected while the rest runs.
defaults:
  platforms: [windows]
  for: [lnk]
  crit: hostile
  attack: T1204.002,T1036.008

composite_rules:
  - id: lnk-opens-carved-decoy-document
    desc: Shortcut carves and opens a decoy document named after itself
    conf: 0.93
    all:
      - id: micro-behaviors/fs/file/seek::lnk-decoy-named-after-self
      - id: micro-behaviors/fs/file/seek::lnk-stream-seek
