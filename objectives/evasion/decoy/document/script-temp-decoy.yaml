# Script droppers that write a decoy document into a temporary directory, open
# it in the default viewer to distract the user, and delete their own running
# script file.
defaults:
  platforms: [windows, unix]
  for: [powershell, batch, python, javascript, typescript, vbs]
  attack: T1036,T1070.004,T1204.002
  mbc: F0007,F0008

composite_rules:
  - id: temp-decoy-document-open-and-self-delete
    desc: Opens temp decoy document and self-deletes
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/fs/path/temporary-artifact::temp-document-write-staging
      - id: micro-behaviors/process/create/cmdlet::script-viewer-open
    any:
      - id: micro-behaviors/fs/delete/file/self::powershell-self-delete
      - id: micro-behaviors/fs/delete/file/self::batch-self-delete
      - id: objectives/evasion/self-delete/file/script::self-delete-python
      - id: micro-behaviors/fs/delete/file/self::node-self-delete
      - id: micro-behaviors/fs/delete/file/self::fso-delete-scriptfullname
      - id: micro-behaviors/fs/delete/file/self::js-self-delete-literal
