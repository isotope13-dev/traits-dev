defaults:
  platforms: [windows]
  for: [pe, dll]
  attack: T1027.009
  mbc: B0032
  size_min: 200000

traits:
  - id: office-csi-cmigrate-pdb
    desc: Microsoft Office CSI cmigrate.pdb marker
    crit: component
    conf: 0.99
    if:
      type: text
      substr: 'cmigrate.pdb'

composite_rules:
  - id: office-c2r-tampered-rwx-overlay
    desc: Tampered Microsoft Office C2R binary with RWX overlay
    crit: hostile
    conf: 0.97
    all:
      - id: well-known/app/enterprise/microsoft-office-c2r::office-c2r-build-pdb-path
      - id: metadata/hardening/memory::wx-section
      - id: metadata/signed/trust-level::unsigned
    any:
      - id: objectives/anti-static/pack/section-anomaly::reloc-rwx-encrypted-payload
      - id: metadata/binary/section/names::suspicious-reloc-section
      - id: objectives/anti-static/obfuscation/payload/section::encrypted-data-section
      - id: office-csi-cmigrate-pdb

  # Authentic Office CSI ship build (cmigrate / client-sync tools). Unsigned
  # redistributions still carry the ship PDB path + Microsoft vendor strings.
  - id: microsoft-office-csi-ship-binary
    desc: Microsoft Office CSI ship build binary
    crit: notable
    conf: 0.98
    all:
      - id: well-known/app/enterprise/microsoft-office-c2r::office-c2r-build-pdb-path
      - id: metadata/binary/vendor::microsoft-corp-marker
    any:
      - id: office-csi-cmigrate-pdb
