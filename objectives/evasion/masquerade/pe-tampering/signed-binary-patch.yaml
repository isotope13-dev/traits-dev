defaults:
  platforms: [windows]
  for: [pe, dll]
  attack: T1553.002
composite_rules:
  - id: signed-pe-tampered-resource-etw-loader
    desc: Digest-mismatched signed PE combines opaque resources with ETW blinding
    crit: hostile
    conf: 0.97
    all:
      - id: metadata/binary/provenance/signature::pe-signature-digest-mismatch
      - id: metadata/signed/trust-level::signer-evidence-present
      - id: metadata/binary/resource/entropy::large-high-entropy-rsrc-section
      - id: objectives/evasion/anti-av/blinding::native-etw-single-byte-return-patch
