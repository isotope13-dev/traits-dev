# Vendor-independent counterpart to office-c2r.yaml in this directory.
#
# The delivery pattern: take a genuine, code-signed vendor executable, patch a
# loader over existing code, grow .rsrc and hide the payload in the slack past
# the last registered resource, then ship the vendor's original certificate
# table verbatim. Windows rejects the signature, but the file-properties dialog
# and any triage step that only reads the certificate subject still show the
# vendor's name. The link-time PE checksum is the tell: signtool rewrites it
# when it signs, so a signed image whose checksum no longer matches its bytes
# was modified after signing.
#
# Neither leg convicts alone, which is why both stay where they are: a stale
# checksum on its own is a build-pipeline quirk, and a large high-entropy .rsrc
# on its own is ordinary for packers and resource-heavy apps. Their conjunction
# is the trojanized-signed-binary shape.
defaults:
  platforms: [windows]
  for: [pe, dll]
  attack: T1553.002
  mbc: B0032

composite_rules:
  - id: signed-pe-patched-with-resource-payload
    desc: Signed PE patched with hidden resource payload
    crit: hostile
    conf: 0.95
    all:
      # Certificate table present AND stored checksum != computed checksum.
      - id: metadata/binary/layout::signed-pe-checksum-mismatch
      # >=192KB resource section at packed-data entropy. Already excludes
      # recognized installer families/scripts and known protected-benign PEs,
      # so those exclusions are inherited rather than repeated here.
      - id: objectives/anti-static/obfuscation/payload/encrypted::medium-entropy-large-rsrc
    unless:
      - id: well-known/app/stresstimulus::mschart-setup
