# Microsoft documentation, labs and SDK samples use a fixed cast of invented
# companies (Contoso, Fabrikam, Woodgrove, Northwind, Wide World Importers...).
# Real vendors do not ship under those names. Malware builders reach for them
# to fill a version resource with something plausible: TrojanPony's WinGUp
# side-load DLLs rotate "Woodgrove Media", "Wide World Importers" and "Contoso
# Instruments"; the vz stealer ships as "Northwind Device Service". A compiled
# sample can still carry the name, so the claim alone is only suspicious; the
# hostile rules pair it with loader behavior a sample has no reason to show.
defaults:
  platforms: [windows]
  for: [pe]
  attack: T1036.005
  crit: notable
  conf: 0.95

traits:
  - id: company-contoso-cast
    desc: Version company is a Contoso-cast sample name
    if:
      type: value
      path: pe.version.company
      regex: '^(Contoso|Fabrikam|Woodgrove|Northwind)\b'
  - id: company-litware-cast
    desc: Version company is a Litware-cast sample name
    if:
      type: value
      path: pe.version.company
      regex: '^(Litware|Proseware|Tailspin|Wingtip)\b'
  - id: company-adventure-works-cast
    desc: Version company is an Adventure Works-cast name
    if:
      type: value
      path: pe.version.company
      regex: '^(Adventure Works|Wide World Importers|Fourth Coffee|Trey Research)\b'
  - id: company-lucerne-cast
    desc: Version company is a Lucerne-cast sample name
    if:
      type: value
      path: pe.version.company
      regex: '^(Alpine Ski House|Lucerne Publishing|Humongous Insurance|Relecloud)\b'

composite_rules:
  - id: fictitious-sample-vendor-claim
    desc: Version resource names a Microsoft fictitious sample company
    crit: suspicious
    conf: 0.9
    any:
      - id: company-contoso-cast
      - id: company-litware-cast
      - id: company-adventure-works-cast
      - id: company-lucerne-cast
    # No CA issues code-signing certificates to these invented companies, so
    # a verified signature means the name is a real vendor's sample metadata.
    unless:
      - id: metadata/signature/verified/

  - id: fictitious-vendor-hollow-curl-dll
    desc: Hollow curl-export DLL claims a Microsoft fictitious sample company
    crit: hostile
    conf: 0.98
    attack: T1036.005,T1574.002
    all:
      - id: fictitious-sample-vendor-claim
      - id: objectives/evasion/masquerade/dll/proxy::curl-export-dll-without-network-import

  - id: fictitious-vendor-hidden-temp-launcher
    desc: Unsigned fictitious-vendor PE stages in temp and launches windowless processes
    crit: hostile
    conf: 0.92
    all:
      - id: fictitious-sample-vendor-claim
      - id: micro-behaviors/os/sysinfo/directories::win32-temp-path-import
      - id: micro-behaviors/process/config/window::x64-createprocess-no-window
      - id: micro-behaviors/process/create/exec::child-process-execution
    unless:
      - id: metadata/signature/verified/
