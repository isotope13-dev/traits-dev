defaults:
  attack: T1036.005
  for: [pe]
  platforms: [windows]
traits:
- id: winword-exe-string
  desc: WINWORD.EXE version string
  crit: notable
  conf: 0.9
  if:
    type: text
    substr: winword.exe
    case_insensitive: true
    section: .rsrc
- id: office-product-claim
  desc: Claims to be Microsoft Office product
  crit: notable
  conf: 0.9
  if:
    type: text
    regex: Microsoft Office (20|system)
    case_insensitive: true
    section: .rsrc
- id: office-installer-file-description
  desc: Microsoft Office Installer file description
  crit: notable
  conf: 0.97
  if:
    type: value
    path: pe.version.description
    exact: Microsoft Office Installer
- id: office-exe-original-filename
  desc: Office.exe original filename claim
  crit: notable
  conf: 0.97
  if:
    type: value
    path: pe.version.original_filename
    exact: Office.exe
- id: office-exe-internal-name
  desc: Office.exe internal name claim
  crit: notable
  conf: 0.97
  if:
    type: value
    path: pe.version.internal_name
    exact: Office.exe
- id: microsoft-office-word-string
  desc: Microsoft Office Word version string
  crit: notable
  conf: 0.96
  if:
    type: text
    exact: Microsoft Office Word
- id: winword-internal-name-string
  desc: WinWord internal name string
  crit: notable
  conf: 0.95
  if:
    type: text
    exact: WinWord
- id: office-source-engine-string
  desc: Office Source Engine version string
  crit: notable
  conf: 0.99
  if:
    type: text
    exact: Office Source Engine
    section: .rsrc
- id: ose-original-filename
  desc: ose.exe original filename string
  crit: notable
  conf: 0.99
  if:
    type: text
    exact: ose.exe
    section: .rsrc
- id: ose-internal-name
  desc: ose internal name string
  crit: component
  conf: 0.96
  if:
    type: text
    exact: ose
    section: .rsrc
composite_rules:
- id: winword-original-filename
  desc: Claims WINWORD.exe as original filename
  crit: component
  conf: 0.9
  all:
  - id: metadata/package/versioning/scheme::pe-originalfilename-field
  - id: winword-exe-string
  near_bytes: 256
- id: fake-winword-version-resource
  desc: Unsigned PE claims WinWord version identity
  crit: suspicious
  conf: 0.97
  all:
  - id: objectives/evasion/masquerade/version-resource/office-suite::microsoft-office-word-string
  - id: objectives/evasion/masquerade/version-resource/office-suite::winword-internal-name-string
  - id: winword-exe-string
  unless:
  - id: metadata/signed/platform/
- id: winword-hidden-temp-loader-masquerade
  desc: WinWord identity masks a self-extracting hidden Temp loader
  crit: hostile
  conf: 0.99
  attack: T1027.009,T1036.005
  all:
  - id: fake-winword-version-resource
  - id: objectives/anti-static/obfuscation/payload/self-read::pe-overlay-self-extractor
  - id: micro-behaviors/fs/temp/directory::temp-file-staging-primitives
  - id: micro-behaviors/process/create/flags::x86-create-no-window-immediate
  - id: micro-behaviors/process/create/spawn::create-process-w
  unless:
  - id: metadata/signed/platform/
- id: fake-microsoft-office-binary
  desc: PE masquerades as Microsoft Office in version metadata
  crit: suspicious
  conf: 0.88
  size_max: 800000
  any:
  - id: fake-winword-version-resource
  - id: winword-original-filename
  - id: office-product-claim
  unless:
  - id: metadata/signed/platform/
- id: unsigned-office-installer-office-exe
  desc: Unsigned PE masquerades as Office installer
  crit: suspicious
  conf: 0.97
  all:
  - id: office-installer-file-description
  - id: office-exe-original-filename
  - id: office-exe-internal-name
  - id: metadata/signed/trust-level::unsigned
  unless:
  - id: metadata/signed/platform/
- id: office-source-engine-version-resource
  desc: Office Source Engine version resource
  crit: component
  conf: 0.99
  all:
  - id: metadata/package/versioning/scheme::pe-version-resource
  - id: metadata/package/versioning/scheme::pe-companyname-field
  - id: metadata/package/versioning/scheme::pe-productname-field
  - id: metadata/package/versioning/scheme::pe-originalfilename-field
  - id: metadata/package/versioning/scheme::pe-internalname-field
  - id: metadata/binary/vendor::microsoft-corp-versioninfo
  - id: office-source-engine-string
  - id: ose-original-filename
  - id: ose-internal-name
- id: unsigned-office-source-engine-masquerade
  desc: Unsigned Office Source Engine masquerade
  crit: suspicious
  conf: 0.99
  all:
  - id: office-source-engine-version-resource
  any:
  - id: metadata/binary/debug::office-source-engine-pdb
  - id: micro-behaviors/os/service/dispatch::service-dispatch-triad
  - id: objectives/anti-static/pack/section-anomaly::rwx-reloc-service-loader
  - id: objectives/anti-static/pack/section-anomaly::reloc-self-reading-loader
  unless:
  - id: metadata/signed/platform/
