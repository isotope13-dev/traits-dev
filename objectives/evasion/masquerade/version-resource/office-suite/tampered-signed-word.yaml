defaults:
  for: [pe]
  platforms: [windows]
  attack: T1036.005,T1553.002

composite_rules:
  - id: modified-vendor-signed-word-impersonator
    desc: Modified vendor-signed binary impersonates Word
    crit: hostile
    conf: 0.97
    all:
      - id: objectives/evasion/masquerade/version-resource/office-suite::fake-winword-version-resource
      - id: metadata/signature/certificate/integrity::vendor-signature-digest-mismatch
      - id: metadata/binary/section/permission::anonymous-pe-section-high-entropy
