defaults:
  platforms: [windows]
  for: [pe, dll]
  attack: T1036.005,T1059.003,T1071.001

composite_rules:
  - id: unsigned-microsoft-shell-pipe-http-indicators
    desc: Unsigned Microsoft claim with shell, pipe and HTTP indicators
    crit: suspicious
    conf: 0.95
    all:
      - id: metadata/signature/absent::unsigned-pe-microsoft-version-fields
      - id: micro-behaviors/process/create/shell/command-mode::windows-command-shell-invocation
      - id: micro-behaviors/communications/ipc/pipe::pipe-io-redirect
    any:
      - id: micro-behaviors/communications/http/direct-socket::winsock-json-close-header-references
      - id: micro-behaviors/communications/http/form::multipart-form
    unless:
      - id: metadata/signature/verified/platform/
