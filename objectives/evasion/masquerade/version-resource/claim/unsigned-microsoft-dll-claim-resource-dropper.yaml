# An unsigned executable that copies a Microsoft DLL's version resource
# (here a component library, though the file is a GUI program) and carries
# a PE in its resources to write out and run is dressing a dropper as a
# system component.
defaults:
  platforms: [windows]
  for: [pe]
  attack: T1036.005,T1204.002
composite_rules:
  - id: unsigned-microsoft-dll-claim-resource-dropper
    desc: Unsigned Microsoft DLL claim extracting resource PE
    crit: hostile
    conf: 0.88
    all:
      - id: metadata/signed/trust-level::unsigned-pe-microsoft-version-fields
      - id: metadata/binary/provenance/version-info::pe-version-declares-dll
      - id: micro-behaviors/data/embedded/payload/resource::pe-resource-full-extraction
      - id: micro-behaviors/process/create/exec::winexec
    unless:
      - id: metadata/signed/platform/
