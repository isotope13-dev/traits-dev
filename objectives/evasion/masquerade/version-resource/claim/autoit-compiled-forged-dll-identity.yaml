# Compiled AutoIt scripts are stock interpreter executables with the script
# stored as an encrypted resource. A normal build keeps the interpreter's own
# version data. One whose version resource declares a DLL file type, names a
# company and product, and disagrees with the file name was edited by the
# builder to give the script an identity it does not have.
defaults:
  platforms: [windows]
  for: [pe]
  attack: T1036.005,T1059
composite_rules:
  - id: compiled-autoit-with-forged-version-identity
    desc: Compiled AutoIt with edited version identity
    crit: suspicious
    conf: 0.7
    all:
      - id: metadata/lang/compiled::autoit-resource-magic
      - id: metadata/binary/provenance/version-info::pe-version-declares-dll
      - id: metadata/binary/provenance/version-info::pe-original-filename-mismatch
      - id: metadata/binary/provenance/version-info::pe-companyname-field
    unless:
      - id: metadata/signed/platform/
