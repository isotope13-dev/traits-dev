# Compiled AutoIt images that wear third-party vendor version resources.
defaults:
  platforms: [windows]
  for: [pe]
  attack: T1036.005

composite_rules:
  - id: autoit-scite-version-masquerade
    desc: AutoIt binary masquerading as the SciTE text editor
    crit: hostile
    conf: 0.99
    all:
      - id: metadata/lang/compiled::autoit-compiled-script
      - id: scite-product-claim
      - id: scite-original-filename-claim
      - id: metadata/binary/layout::pe-no-signature-record
    unless:
      - id: metadata/signed/platform/

  - id: autoit-centrify-version-masquerade
    desc: AutoIt binary masquerading as Centrify Management Services
    crit: hostile
    conf: 0.97
    all:
      - id: metadata/lang/compiled::autoit-compiled-script
      - id: well-known/app/enterprise/delinea::centrify-management-services-description
      - id: well-known/app/enterprise/delinea::centrify-management-services-company
    unless:
      - id: metadata/signed/platform/
      - id: metadata/signed/developer/
      - id: metadata/signed/certificate/identity::pe-signature-verified

traits:
  - id: scite-product-claim
    desc: PE version resource claims the SciTE product
    crit: component
    conf: 0.98
    if:
      type: value
      path: pe.version.product_name
      exact: SciTE

  - id: scite-original-filename-claim
    desc: PE claims SciTE original filename
    crit: component
    conf: 0.98
    if:
      type: value
      path: pe.version.original_filename
      exact: SciTE.EXE
