# Compiled AutoIt images that wear third-party vendor version resources.
defaults:
  platforms: [windows]
  for: [pe]
  attack: T1036.005

composite_rules:
  - id: autoit-scite-version-masquerade
    desc: AutoIt binary masquerading as the SciTE text editor
    crit: hostile
    conf: 0.99
    all:
      - id: metadata/lang/compiled::autoit-compiled-script
      - id: well-known/tool/development/editor/scite::scite-product-claim
      - id: well-known/tool/development/editor/scite::scite-original-filename-claim
      - id: metadata/signature/absent::unsigned-missing-signature-record
    unless:
      - id: metadata/signature/verified/platform/

  # The interpreter bundles WinInet and BlockInput imports for its built-ins.
  # Those imports establish neither script HTTP staging nor input lockdown;
  # retain the masquerade finding above and the neutral import observations.

  - id: autoit-centrify-version-masquerade
    desc: AutoIt binary masquerading as Centrify Management Services
    crit: hostile
    conf: 0.97
    all:
      - id: metadata/lang/compiled::autoit-compiled-script
      - id: well-known/app/enterprise/delinea::centrify-management-services-description
      - id: well-known/app/enterprise/delinea::centrify-management-services-company
    unless:
      - id: metadata/signature/verified/

  - id: autoit-easeus-version-masquerade
    desc: AutoIt masquerades as EaseUS recovery wizard
    crit: hostile
    conf: 0.99
    all:
      - id: metadata/lang/compiled::autoit-compiled-script
      - id: easeus-product-claim
      - id: easeus-company-claim
      - id: metadata/signature/absent::unsigned-missing-signature-record
    unless:
      - id: metadata/signature/verified/

  - id: autoit-adobe-version-masquerade
    desc: AutoIt binary masquerading as Adobe Systems software
    crit: hostile
    conf: 0.99
    all:
      - id: metadata/lang/compiled::autoit-compiled-script
      - id: metadata/binary/provenance/version-info::adobe-organization-resource-text
      - id: metadata/signature/absent::unsigned-missing-signature-record
    unless:
      - id: metadata/signature/verified/

  - id: intel-amt-uns-version-claim
    desc: PE version claims Intel Active Management Technology UNS
    crit: notable
    conf: 0.98
    any:
      - id: intel-amt-product-claim
      - id: intel-uns-description-claim
      - id: intel-amt-comments-claim

  - id: autoit-intel-amt-version-masquerade
    desc: AutoIt binary masquerading as Intel AMT User Notification Service
    crit: hostile
    conf: 0.99
    all:
      - id: metadata/lang/compiled::autoit-binary
      - id: intel-amt-uns-version-claim
      - id: metadata/signature/absent::unsigned-missing-signature-record
    unless:
      - id: metadata/signature/verified/

traits:
  - id: intel-amt-product-claim
    desc: PE version claims Intel AMT product
    crit: notable
    conf: 0.98
    if:
      type: value
      path: pe.version.product_name
      regex: '(?i)Active Management Technology'

  - id: intel-uns-description-claim
    desc: PE version claims UNS description
    crit: notable
    conf: 0.98
    if:
      type: value
      path: pe.version.description
      regex: '(?i)User Notification Service'

  - id: intel-amt-comments-claim
    desc: PE version claims Intel AMT comment
    crit: notable
    conf: 0.98
    if:
      type: value
      path: pe.version.comments
      regex: '(?i)AMT.*(服务|Service)'

  - id: easeus-product-claim
    desc: PE version claims EaseUS product
    crit: notable
    conf: 0.98
    if:
      type: value
      path: pe.version.product_name
      exact: EaseUS Data Recovery Wizard

  - id: easeus-company-claim
    desc: PE version claims Chengdu Yiwo company
    crit: notable
    conf: 0.98
    if:
      type: value
      path: pe.version.company
      exact: CHENGDU YIWO Tech Development Co., Ltd
