# Compiled AutoIt images that wear third-party vendor version resources.
defaults:
  platforms: [windows]
  for: [pe]
  attack: T1036.005

composite_rules:
  - id: autoit-scite-version-masquerade
    desc: AutoIt binary masquerading as the SciTE text editor
    crit: hostile
    conf: 0.99
    all:
      - id: metadata/lang/compiled::autoit-compiled-script
      - id: metadata/binary/provenance/version-info::scite-product-claim
      - id: metadata/binary/provenance/version-info::scite-original-filename-claim
      - id: metadata/signed/trust-level::unsigned-missing-signature-record
    unless:
      - id: metadata/signed/platform/

  - id: autoit-scite-wininet-spyware-control
    desc: SciTE-disguised AutoIt with WinInet staging and input lockdown
    crit: hostile
    conf: 0.99
    attack: T1036.005,T1071.001,T1562.003
    all:
      - id: autoit-scite-version-masquerade
      - id: micro-behaviors/communications/http/client/wininet::wininet-http-flow
      - id: micro-behaviors/hardware/input/block::block-input-import

  - id: autoit-centrify-version-masquerade
    desc: AutoIt binary masquerading as Centrify Management Services
    crit: hostile
    conf: 0.97
    all:
      - id: metadata/lang/compiled::autoit-compiled-script
      - id: well-known/app/enterprise/delinea::centrify-management-services-description
      - id: well-known/app/enterprise/delinea::centrify-management-services-company
    unless:
      - id: metadata/signed/platform/
      - id: metadata/signed/developer/
      - id: metadata/signed/certificate/signature::pe-signature-verified

  - id: autoit-easeus-version-masquerade
    desc: AutoIt masquerades as EaseUS recovery wizard
    crit: hostile
    conf: 0.99
    all:
      - id: metadata/lang/compiled::autoit-compiled-script
      - id: easeus-product-claim
      - id: easeus-company-claim
      - id: metadata/signed/trust-level::unsigned-missing-signature-record
    unless:
      - id: metadata/signed/platform/
      - id: metadata/signed/developer/
      - id: metadata/signed/certificate/signature::pe-signature-verified

traits:
  - id: easeus-product-claim
    desc: PE version claims EaseUS product
    crit: notable
    conf: 0.98
    if:
      type: value
      path: pe.version.product_name
      exact: EaseUS Data Recovery Wizard

  - id: easeus-company-claim
    desc: PE version claims Chengdu Yiwo company
    crit: notable
    conf: 0.98
    if:
      type: value
      path: pe.version.company
      exact: CHENGDU YIWO Tech Development Co., Ltd
