# A fake Windows component: the version resource claims Microsoft authorship
# and the "Microsoft Windows Operating System" product, but the image has no
# signature and is a packed, high-entropy writable+executable layout -- no
# shipped Windows binary looks like that. When the same image also stages a
# payload to %TEMP% and starts a process, the borrowed identity is cover for
# a dropper, not an honest rebuild of Microsoft code.
#
# Worked example: the Jaku dropper posing as "Nt Module Starter"
# (ntmstart.exe 6.1.7600.16385) that decrypts its resource payload, writes it
# with GetTempFileNameW and launches it with CreateProcessW.
defaults:
  attack: T1036.005,T1027.002,T1105
  for: [pe]
  platforms: [windows]

composite_rules:
  - id: packed-fake-windows-component-temp-stager
    desc: Packed fake Windows component stages and launches a payload
    crit: hostile
    conf: 0.95
    all:
      - id: objectives/evasion/masquerade/version-resource/claim::unsigned-microsoft-masquerade-packed
      - id: metadata/binary/vendor::windows-os-product-name
      - id: metadata/signed/trust-level::unsigned-missing-signature-record
      - id: objectives/anti-static/obfuscation/eval/loader::packed-temp-staging-resource-payload
      - id: micro-behaviors/process/create/spawn::create-process-w
    unless:
      - id: metadata/signed/platform/
      - id: metadata/lang/upstream::windows-system-implementer-dll
