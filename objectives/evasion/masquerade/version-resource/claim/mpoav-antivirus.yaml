# An unsigned image claiming the MpOAV (Microsoft IOfficeAntiVirus provider)
# identity is not the Microsoft-signed AMSI component. The genuine MpOAV.dll
# is a signed system DLL; samples borrow its OriginalFilename, InternalName,
# and description while mangling the company/product strings so exact
# Microsoft-vendor matchers miss.
defaults:
  platforms: [windows]
  for: [pe]
  attack: T1036.005

traits:
  - id: mpoav-original-filename-claim
    desc: VERSIONINFO original filename MpOAV.dll
    crit: notable
    conf: 0.99
    if:
      type: value
      path: pe.version.original_filename
      exact: MpOAV.dll
      case_insensitive: true
  - id: mpoav-internal-name-claim
    desc: VERSIONINFO internal name MpOAV
    crit: notable
    conf: 0.99
    if:
      type: value
      path: pe.version.internal_name
      exact: MpOAV
      case_insensitive: true
  - id: iofficeantivirus-description-claim
    desc: VERSIONINFO IOfficeAntiVirus module description
    crit: notable
    conf: 0.98
    if:
      type: value
      path: pe.version.description
      exact: IOfficeAntiVirus Module

composite_rules:
  - id: unsigned-mpoav-antivirus-masquerade
    desc: Unsigned image masquerading as the MpOAV antivirus module
    crit: suspicious
    conf: 0.95
    all:
      - id: metadata/signed/trust-level::unsigned-missing-signature-record
      - id: mpoav-original-filename-claim
      - id: mpoav-internal-name-claim
    unless:
      - id: metadata/signed/platform/
