# A version resource that says "Microsoft ... DLL" on an image that is not a
# DLL was copied from a system component. Microsoft ships its executables
# with executable version resources and signs them; an unsigned program that
# insists it is a Microsoft library has borrowed the identity.
defaults:
  platforms: [windows]
  for: [pe]
  attack: T1036.005
composite_rules:
  - id: unsigned-microsoft-dll-claim-on-exe-image
    desc: Unsigned Microsoft DLL claim on non-DLL image
    crit: suspicious
    conf: 0.85
    all:
      - id: metadata/signed/trust-level::unsigned-pe-microsoft-version-fields
      - id: metadata/binary/provenance/version-info::pe-version-declares-dll
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/header/characteristics::pe-dll-characteristics

  - id: unsigned-microsoft-dll-claim-high-entropy-exe
    desc: Microsoft DLL disguise with nonstandard sections and high entropy
    crit: suspicious
    conf: 0.95
    all:
      - id: unsigned-microsoft-dll-claim-on-exe-image
      - id: metadata/binary/section/label::multiple-nonstandard-section-names
      - id: metadata/file/entropy::high-overall-entropy-70
    unless:
      - id: metadata/signed/platform/

