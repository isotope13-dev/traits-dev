# An executable (not a DLL) that carries a Microsoft component's version
# resource, such as a keyboard-layout DLL's, is not that component. With no
# signature, a file name that disagrees with the original name, custom
# section names, and service-control entry points, the copied resource is
# camouflage for a service implant.
defaults:
  platforms: [windows]
  for: [pe]
  attack: T1036.005,T1543.003
composite_rules:
  - id: unsigned-microsoft-version-exe-with-service-handler
    desc: Unsigned Microsoft-labelled exe with service handler
    crit: hostile
    conf: 0.9
    all:
      - id: metadata/signed/trust-level::unsigned-pe-microsoft-version-fields
      - id: metadata/binary/provenance/version-info::pe-non-architecture-filename-mismatch
      - id: metadata/binary/section/label::multiple-nonstandard-section-names
      - id: micro-behaviors/os/service/dispatch::register-service-handler
    unless:
      - id: metadata/signed/platform/
