# A utility-sounding company and product string on an image whose file name
# disagrees with its original name, with several TLS callbacks that run
# before main and the thread-context APIs used to redirect execution in
# another process. The version resource is the disguise; the TLS callbacks
# and thread control are the behavior.
defaults:
  platforms: [windows]
  for: [pe]
  attack: T1036.005,T1055.003,T1546.012
composite_rules:
  - id: vendor-claim-with-tls-callbacks-and-thread-context-control
    desc: Vendor claim, TLS callbacks and thread-context control
    crit: hostile
    conf: 0.85
    all:
      - id: metadata/binary/provenance/version-info::pe-non-architecture-filename-mismatch
      - id: metadata/binary/provenance/version-info::pe-companyname-field
      - id: metadata/binary/layout/tls::pe-multiple-tls-callbacks
      - id: micro-behaviors/process/info/thread::get-thread-context-import
      - id: micro-behaviors/process/info/thread::set-thread-context-import
    unless:
      - id: metadata/signed/platform/
      # winpthreads and libgcc unwinding import the thread-context APIs and
      # register TLS callbacks in every MinGW-built program.
      - id: metadata/lang/compiler/native::mingw-winpthreads-runtime
      - id: metadata/binary/framework::mingw-libgcc-runtime
      # Pristine OfficeC2RClient images carry TLS callbacks and thread-context
      # imports; platform trust alone does not reach carved embedded views.
      - id: well-known/app/enterprise/microsoft-office-c2r::microsoft-office-c2r-client-context
