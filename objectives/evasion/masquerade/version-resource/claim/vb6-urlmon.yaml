# Microsoft resource claim beside a URLMon API name; no staged-file handoff.
defaults:
  platforms:
  - windows
  for:
  - pe
composite_rules:
- id: vb6-urlmon-ms-claim
  desc: Microsoft version claim with URLMon name
  attack: T1036.005
  all:
  - id: micro-behaviors/communications/http/client/urlmon::url-download-to-file-str
  - id: metadata/binary/provenance/version-info::microsoft-exact-string-rsrc
  unless:
  - id: metadata/signed/platform/
  - id: metadata/binary/vendor::is-microsoft-named
  - id: well-known/lib/runtime/native-platform/vb-richclient::vb-richclient-runtime-library
  crit: suspicious
