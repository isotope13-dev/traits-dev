# A Microsoft label inside an embedded host is not the carrier's CompanyName.
# Require the parsed outer version claim rather than arbitrary resource text.
defaults:
  platforms:
  - windows
  for:
  - pe
composite_rules:
- id: microsoft-company-claim-with-urlmon-reference
  desc: Unverified Microsoft CompanyName with URLMon reference
  attack: T1036.005
  all:
  - id: micro-behaviors/communications/http/client/urlmon::url-download-to-file-str
  - id: metadata/binary/provenance/version-info::microsoft-company-name-claim
  unless:
  - id: metadata/signed/platform/
  - id: well-known/lib/runtime/native-platform/vb-richclient::vb-richclient-runtime-library
  crit: suspicious
