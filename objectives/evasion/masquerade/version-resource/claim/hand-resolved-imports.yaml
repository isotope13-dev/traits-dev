# A PE that wears a product identity in its version resource while resolving
# its imports by hand.
#
# The other rules in this directory each name a specific brand being
# impersonated, which only works once that brand has been seen. This one keys
# on the contradiction instead, so it holds for a claim nobody has catalogued
# yet: a program that ships ProductName/CompanyName metadata is a *product*,
# and products link against the import table like everything else. Walking the
# loaded module list and parsing export directories by hand is what code does
# when it does not want its API use visible in the IAT — shellcode, unpacking
# stubs, and loaders.
#
# The file legs are what make the contradiction worth acting on rather than
# merely odd: this binary also enumerates directories and deletes files. A
# packer stub hand-resolves APIs too, but it unpacks and jumps; it does not
# walk the filesystem. A file utility walks the filesystem, but it does not
# hide which APIs it calls.
#
# Seen on a 30 KB unsigned PE presenting itself as the "LookFor" search
# utility by "Sanny Ltd." — two version-resource strings anyone can copy —
# whose only other findings were a manual export walk and file enumeration
# plus deletion across AppData, ProgramData, Downloads, Temp and the drive
# root. Nothing rated the combination, so the sample's cleave findings read as
# a benign file-search tool.
defaults:
  platforms: [windows]
  for: [pe, dll]
  attack: T1036.005,T1027.007
  mbc: E1027

composite_rules:
  - id: product-claiming-unsigned-export-walk-file-tool
    desc: Product-claiming PE hand-resolves APIs
    crit: suspicious
    conf: 0.93
    # Bounded to small images: the shape is a stage, and a real application of
    # this size does not hand-roll its loader.
    size_max: 262144
    all:
      - id: micro-behaviors/os/api-resolution/manual::x86-backward-module-export-walk
      - id: metadata/binary/layout::pe-no-signature-record
      - id: metadata/package/versioning::pe-version-product-name-value
      - id: micro-behaviors/fs/enumerate/directory::find-file-walker
      - id: micro-behaviors/fs/file/delete::delete-win
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/installer/family/
      - id: metadata/binary/installer/script/
      - id: well-known/tool/reverse-engineering/
