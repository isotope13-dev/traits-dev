defaults:
  platforms: [windows]
  for: [pe]
composite_rules:
  # The same executable contains the remote-control client implementation
  # and a contradictory storage-management product identity. This does not
  # convict an ordinary RdViewer client, its service, or packing alone.
  - id: remote-client-storage-utility-disguise
    desc: Remote-control client disguised as storage manager
    crit: hostile
    conf: 0.98
    attack: T1036
    all:
      - id: well-known/dual-use/remote-admin/rdviewer::rdviewer-native-client
      - id: metadata/binary/resource/identity::storage-management-product-claim
