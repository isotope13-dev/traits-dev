defaults:
  platforms: [windows]
  for: [pe]
  attack: T1036
composite_rules:
  # The same executable contains the remote-control client implementation
  # and a contradictory storage-management product identity. This does not
  # convict an ordinary RdViewer client, its service, or packing alone.
  - id: remote-client-storage-utility-disguise
    desc: Remote-control client disguised as storage manager
    crit: hostile
    conf: 0.98
    all:
      - id: well-known/dual-use/remote-admin/rdviewer::rdviewer-native-client
      - id: metadata/binary/resource/identity::storage-management-product-claim

  - id: mesh-agent-browser-product-disguise
    desc: MeshCentral agent claims browser identity
    crit: hostile
    conf: 0.98
    # Require both the upstream implementation marker and its agent channel
    # in this PE. A browser merely mentioning MeshCentral is insufficient.
    all:
      - id: well-known/dual-use/remote-admin/meshcentral::meshcentral-agent-upstream-marker
      - id: well-known/dual-use/remote-admin/meshcentral::meshcentral-agent-channel-marker
      - id: metadata/binary/resource/identity::browser-product-name-claim
