defaults:
  attack: T1036.005
  for: [pe]
  platforms: [windows]
traits:
- id: mfc-template-default-filename
  desc: Default MSVC MFC wizard executable name
  crit: notable
  conf: 0.95
  if:
    type: text
    substr: "MFCApplication1.exe"
    section: .rsrc
- id: placeholder-assembly-identity
  desc: Placeholder assembly identity in resources
  crit: notable
  conf: 0.93
  if:
    type: text
    exact: name="CompanyName.ProductName.YourApp"
    section: .rsrc
- id: stationplaylist-typo-company
  desc: Typoed StationPlaylist company name
  crit: notable
  conf: 0.98
  if:
    type: text
    exact: Sta aaationPlaylist.com
    section: .rsrc
- id: mojibake-cyrillic-company-name
  desc: Mojibake Cyrillic company name
  crit: component
  conf: 0.96
  ref: sha256:f3e35b270f7b8aba8f24e4a97711e33d3ae748a5ad994c098513acfe7a9e4dc0
  if:
    type: value
    path: pe.version.company
    regex: '^[A-Za-z]{2,}(Рµ){2,}[A-Za-z]{2,}\.com$'
- id: track-tool-file-description
  desc: Track Tool file description
  crit: notable
  conf: 0.92
  if:
    type: text
    exact: Track Tool
    section: .rsrc
- id: random-lowercase-exe-name
  desc: Consonant-heavy lowercase executable name
  crit: component
  conf: 0.86
  if:
    type: text
    regex: ^[b-df-hj-np-tv-z]{8,16}\.exe$
    section: .rsrc
- id: random-alnum-exe-name
  desc: Alphanumeric randomized executable name
  crit: component
  conf: 0.86
  unless:
  - id: well-known/tool/detection/wireshark/
  if:
    type: value
    path: pe.version.original_filename
    regex: '^[a-z0-9]{4,}[0-9][a-z0-9]{4,}\.exe$'
- id: labs-inc-company-name
  desc: Labs Inc company metadata
  crit: notable
  conf: 0.95
  if:
    type: text
    substr: Labs Inc
    section: .rsrc
- id: qwe-original-filename
  desc: qwe.exe original filename string
  crit: notable
  conf: 0.95
  if:
    type: text
    exact: qwe.exe
    section: .rsrc
- id: stub-guid-string
  desc: '''stub'' with GUID pattern in version resource'
  crit: notable
  conf: 0.9
  if:
    type: text
    regex: stub_[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}
    case_insensitive: true
    section: .rsrc
- id: gif-image-filedesc-masquerade
  desc: GIF Image FileDescription masquerade
  crit: notable
  conf: 0.95
  if:
    type: text
    exact: GIF Image
    section: .rsrc
- id: flashfxp-version-resource
  desc: FlashFXP version resource identity
  crit: notable
  conf: 0.96
  if:
    type: text
    exact: FlashFXP.exe
    section: .rsrc
- id: ncstudio-product-string
  desc: NcStudio product identity string
  crit: notable
  conf: 0.98
  if:
    type: text
    exact: NcStudio
    section: .rsrc
- id: ncstudio-original-filename
  desc: NcStudio executable filename string
  crit: notable
  conf: 0.98
  if:
    type: text
    exact: NcStudio.exe
    section: .rsrc
- id: pcimc-6a-product-string
  desc: PCIMC-6A product identity string
  crit: notable
  conf: 0.98
  if:
    type: text
    exact: PCIMC-6A
    section: .rsrc
- id: pdf-exe-version-string
  desc: pdf.exe version string
  crit: notable
  conf: 0.95
  if:
    type: text
    exact: pdf.exe
    section: .rsrc
- id: microsoft-company-name-short
  desc: Microsoft short company name
  crit: notable
  conf: 0.82
  if:
    type: text
    exact: Microsoft
    section: .rsrc
- id: asus-company-name
  desc: ASUS company metadata string
  crit: component
  conf: 0.92
  if:
    type: text
    exact: ASUS
    section: .rsrc
- id: getdeviceversion-description
  desc: GetDeviceVersion file description
  crit: notable
  conf: 0.97
  if:
    type: text
    exact: GetDeviceVersion
    section: .rsrc
- id: getdevic-internal-name
  desc: GetDevic executable internal name
  crit: notable
  conf: 0.95
  if:
    type: text
    exact: GetDevic.exe
    section: .rsrc
- id: asustek-computer-inc-company-name
  desc: ASUSTeK Computer company name
  crit: notable
  conf: 0.96
  if:
    type: text
    exact: ASUSTeK Computer Inc.
    section: .rsrc
- id: aura-lighting-service-description
  desc: ASUS AURA Lighting Service description
  crit: notable
  conf: 0.97
  if:
    type: text
    exact: ASUS AURA Lighting Service
    section: .rsrc
- id: lightingservice-original-filename
  desc: LightingService executable filename
  crit: notable
  conf: 0.97
  if:
    type: text
    exact: LightingService.exe
    section: .rsrc
composite_rules:
- id: asus-getdeviceversion-version-resource
  desc: ASUS GetDeviceVersion version resource
  crit: component
  conf: 0.98
  all:
  - id: metadata/package/versioning/scheme::pe-version-resource
  - id: metadata/package/versioning/scheme::pe-companyname-field
  - id: metadata/package/versioning/scheme::pe-filedescription-field
  - id: asus-company-name
  - id: getdeviceversion-description
  any:
  - id: getdevic-internal-name
  - id: metadata/package/versioning/scheme::pe-internalname-field
- id: asus-lightingservice-version-resource
  desc: ASUS Lighting Service version resource
  crit: component
  conf: 0.99
  all:
  - id: metadata/package/versioning/scheme::pe-version-resource
  - id: metadata/package/versioning/scheme::pe-companyname-field
  - id: metadata/package/versioning/scheme::pe-filedescription-field
  - id: asustek-computer-inc-company-name
  - id: aura-lighting-service-description
  any:
  - id: lightingservice-original-filename
  - id: metadata/package/versioning/scheme::pe-originalfilename-field
  - id: metadata/package/versioning/scheme::pe-internalname-field
- id: low-import-pe-without-heavy-rsrc
  desc: Low-import PE without dominant resources
  crit: component
  conf: 0.82
  all:
  - id: objectives/anti-static/obfuscation/binary-metrics/imports::max-50-imports
  unless:
  - id: metadata/binary/resource/size::resource-heavy-rsrc
      # Go/Rust Windows binaries link their runtime statically and ship
      # without a version resource — matching this shape is the norm, not
      # masquerade intent. The `unsigned-microsoft-masquerade` composite
      # that consumes this component additionally requires Microsoft-Corp
      # versioninfo, so this suppression doesn't affect the composite's
      # actual masquerade conclusion for Go malware.
  - id: metadata/lang/compiled/
  - id: metadata/lang/compiler/systems/
- id: fake-windows-update-service-versioninfo
  desc: Fake Windows update service version info
  crit: suspicious
  conf: 0.97
  all:
  - id: metadata/package/versioning/scheme::pe-version-resource
  - id: objectives/evasion/masquerade/version-resource/microsoft-utility::windows-component-update-service
  - id: objectives/evasion/masquerade/version-resource/microsoft-utility::windows-software-foundation
  - id: objectives/evasion/masquerade/version-resource/microsoft-utility::winupdate-internal-name
  unless:
  - id: metadata/signed/platform/
- id: self-signed-mojibake-surveillance-pe
  desc: Self-signed mojibake surveillance PE
  crit: hostile
  conf: 0.98
  ref: sha256:f3e35b270f7b8aba8f24e4a97711e33d3ae748a5ad994c098513acfe7a9e4dc0
  all:
  - id: mojibake-cyrillic-company-name
  - id: metadata/signed/certificate/identity::pe-cert-leaf-self-issued
  - id: metadata/signed/certificate/identity::pe-signature-verified-kv
  any:
  - id: objectives/collection/keylog/hook::windows-hook-clipboard-screen-surveillance
  - id: objectives/collection/screenshot/capture::gdi-capture-clipboard-hook-surveillance
  - id: objectives/collection/clipboard/capture::windows-clipboard-screen-hook-surveillance
  unless:
  - id: metadata/signed/platform/
  - id: well-known/app/media/stationplaylist::track-tool-identity
- id: unsigned-microsoft-masquerade
  desc: Unsigned PE claims Microsoft Corporation in version resource
  crit: suspicious
  conf: 0.88
  all:
  - id: metadata/binary/vendor::microsoft-corp-versioninfo
  - id: low-import-pe-without-heavy-rsrc
  unless:
  - id: metadata/binary/symbols/compat::zero-import-count
  - id: metadata/signed/platform/
  - id: metadata/binary/vendor::is-microsoft-named
  - id: metadata/binary/framework/
  - id: well-known/lib/platform/wine/
  - id: well-known/tool/reverse-engineering/scyllahide/
  - id: well-known/tool/reverse-engineering/sharpod/
- id: unsigned-microsoft-masquerade-packed
  desc: Packed PE claims Microsoft Corporation in version resource
  crit: suspicious
  conf: 0.9
  all:
  - id: metadata/binary/vendor::microsoft-corp-versioninfo
  - id: objectives/anti-static/obfuscation/binary-metrics/shape::binary-packed
  unless:
  - id: metadata/signed/platform/
  - id: metadata/binary/vendor::is-microsoft-named
- id: unsigned-asus-lightingservice-masquerade
  desc: Unsigned PE masquerades as ASUS Lighting Service
  crit: suspicious
  conf: 0.98
  all:
  - id: asus-lightingservice-version-resource
  - id: metadata/signed/trust-level::unsigned-pe-executable
  any:
  - id: low-import-pe-without-heavy-rsrc
  - id: metadata/binary/symbols/count::max-30-imports
  unless:
  - id: metadata/signed/platform
  - id: metadata/signed/developer
- id: tiny-vb6-microsoft-masquerade
  desc: Tiny packed VB6 claims Microsoft
  crit: suspicious
  conf: 0.96
  all:
  - id: microsoft-company-name-short
  - id: metadata/binary/framework::vb6-application-framework
  - id: objectives/anti-static/pack/detect::tiny-upx-vb6-executable
  any:
  - id: metadata/package/versioning/scheme::pe-originalfilename-field
  - id: metadata/package/versioning/scheme::pe-version-resource
  unless:
  - id: metadata/signed/platform/
  - id: metadata/binary/vendor::is-microsoft-named
- id: packed-rider-loader-masquerade
  desc: Packed Rider-branded zero-import loader
  crit: hostile
  conf: 0.97
  all:
  - id: metadata/binary/symbols/count::no-imports
  - id: metadata/binary/layout/entropy::high-overall-entropy-70
  any:
  - id: metadata/binary/layout/entropy::very-high-overall-entropy-75
  - id: metadata/binary/layout/entropy::high-overall-entropy-binary
  - id: metadata/binary/symbols/count::max-25-imports
  unless:
  - id: well-known/tool/development/editor/jetbrains/
  - id: metadata/signed/platform
  - id: metadata/signed/developer
- id: stub-guid-internal-name
  desc: InternalName contains 'stub' with GUID
  crit: suspicious
  conf: 0.9
  all:
  - id: objectives/evasion/masquerade/version-resource/claim::stub-guid-string
  any:
  - id: metadata/package/versioning/scheme::pe-version-resource
- id: system-process-name-masquerade
  desc: PE contains well-known system process name
  crit: notable
  conf: 0.88
  all:
  - id: metadata/package/versioning/scheme::pe-originalfilename-field
  any:
  - id: objectives/evasion/masquerade/version-resource/microsoft-utility::onedrive-exe-string
  - id: objectives/evasion/masquerade/version-resource/microsoft-utility::jusched-exe-string
  unless:
  - id: metadata/signed/platform/
  - id: well-known/app/storage/onedrive::signed-onedrive-standalone-updater
- id: ncstudio-controller-masquerade
  desc: Trojanized NcStudio controller identity
  crit: suspicious
  conf: 0.97
  all:
  - id: metadata/package/versioning/scheme::pe-version-resource
  - id: ncstudio-product-string
  - id: ncstudio-original-filename
  - id: pcimc-6a-product-string
  any:
  - id: objectives/anti-static/pack/section-anomaly::reloc-rwx-encrypted-payload
  - id: objectives/anti-static/obfuscation/payload/section::unusual-alignment-pe
- id: randomized-version-identity
  desc: Randomized version resource identity
  crit: notable
  conf: 0.9
  all:
  - id: metadata/package/versioning/scheme::pe-version-resource
  - id: metadata/package/versioning/scheme::pe-originalfilename-field
  - id: metadata/package/versioning/scheme::pe-productname-field
  any:
  - id: random-lowercase-exe-name
  - id: random-alnum-exe-name
  - id: metadata/binary/resource/identity::short-titlecase-resource-words
  - id: metadata/binary/debug::pdb-random-basename
  needs: 2
  unless:
  - id: metadata/signed/platform/
  - id: metadata/binary/vendor::microsoft-corp-versioninfo
  - id: well-known/tool/detection/wireshark/
- id: stationplaylist-tracktool-masquerade
  desc: Typoed StationPlaylist version masquerade
  crit: suspicious
  conf: 0.96
  all:
  - id: metadata/package/versioning/scheme::pe-version-resource
  - id: metadata/package/versioning/scheme::pe-companyname-field
  - id: metadata/package/versioning/scheme::pe-filedescription-field
  - id: stationplaylist-typo-company
  - id: track-tool-file-description
  unless:
  - id: metadata/signed/platform
- id: unsigned-inno-gpu-driver-claim
  desc: Unsigned Inno loader claims a graphics-driver identity
  crit: hostile
  conf: 0.99
  all:
  - id: objectives/evasion/masquerade/identity/fabricated::gpu-vendor-driver-description-claim
  - id: metadata/binary/installer/family::inno-delphi-installer-foundation
  - id: metadata/binary/layout/overlay::overlay-dominates-third
  - id: metadata/binary/layout/overlay::low-entropy-large-overlay
  - id: metadata/signed/trust-level::unsigned-missing-signature-record
  - id: micro-behaviors/process/create/spawn::create-process-w
  unless:
  - id: metadata/signed/platform/
  - id: well-known/app/system/drivers/nvidia/
- id: contradictory-browser-pdf-versioninfo
  desc: Contradictory browser PDF version identity
  crit: suspicious
  conf: 0.98
  all:
  - id: metadata/package/versioning/scheme::pe-version-resource
  - id: metadata/package/versioning/scheme::pe-companyname-field
  - id: metadata/package/versioning/scheme::pe-productname-field
  - id: metadata/package/versioning/scheme::pe-originalfilename-field
  - id: objectives/evasion/masquerade/version-resource/google-chrome::google-company-string
  - id: objectives/evasion/masquerade/version-resource/google-chrome::chrome-exe-version-string
  - id: pdf-exe-version-string
  unless:
  - id: metadata/signed/platform/
- id: javaw-branded-memory-loader
  desc: Java-branded PE executes decoded memory stage
  crit: hostile
  conf: 0.98
  attack: T1036.005,T1140,T1620
  all:
  - id: objectives/command-and-control/dropper/execution/windows-loader::x64-xor-protected-memory-loader
  - id: metadata/vendor/string::java-platform-string
  unless:
  - id: metadata/signed/platform/
- id: signed-basic-loader-masquerade
  desc: Signed basic_loader AppFrameHost trojan
  crit: hostile
  conf: 0.99
  all:
  - id: objectives/evasion/masquerade/version-resource/applicationframehost::signed-applicationframehost-masquerade
  - id: metadata/binary/debug::basic-loader-pdb
- id: signature-theft-tampered-pe
  desc: Tampered Microsoft-claim PE (sig theft tell)
  crit: hostile
  conf: 0.95
  all:
  - id: metadata/signed/platform::microsoft
  - id: metadata/binary/layout/checksum::pe-checksum-mismatch
  any:
  - id: objectives/evasion/masquerade/version-resource/applicationframehost::signed-applicationframehost-masquerade
  - id: objectives/evasion/masquerade/version-resource/microsoft-utility
  - id: objectives/anti-static/obfuscation/imports::pe-walk-hash-resolver-x64
  unless:
  - id: metadata/binary/framework/
- id: javaw-shellcode-masquerade
  desc: Java GUI launcher identity on a decoded shellcode loader
  crit: hostile
  conf: 0.99
  attack: T1036.005,T1027,T1620
  all:
  - id: well-known/lib/runtime/managed/jvm::windows-java-gui-launcher-original-filename
  - id: well-known/lib/runtime/managed/jvm::windows-java-se-versioninfo
  - id: objectives/anti-static/obfuscation/payload/loader::x64-decoded-shellcode-loader
  unless:
  - id: metadata/signed/platform/
  - id: metadata/binary/framework/
