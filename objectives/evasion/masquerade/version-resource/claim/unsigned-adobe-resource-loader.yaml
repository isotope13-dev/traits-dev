# An Adobe product claim paired with a truncated certificate table, a VM
# probe, resource loading, and service control supports deliberate camouflage.
defaults:
  platforms: [windows]
  for: [pe]
  attack: T1036

composite_rules:
  # This loader carries an Adobe product claim, probes for VMware, accesses a
  # resource, uses service-management APIs, and launches a process.
  # Keep this behavior chain independent of certificate-table corruption: a
  # present certificate directory does not make an unverified Adobe claim real.
  - id: adobe-vm-aware-resource-service-loader
    desc: Adobe-claiming VM-aware resource loader with service management
    crit: hostile
    conf: 0.97
    attack: T1036.005,T1027.009,T1543.003,T1106,T1497.001
    all:
      - id: metadata/binary/resource/identity::adobe-installation-helper-resource-text
      - id: metadata/binary/provenance/version-info::adobe-organization-resource-text
      - id: micro-behaviors/os/virtualization/detect::vmware-version-port-query
      - id: micro-behaviors/data/embedded/payload/resource::pe-resource-full-extraction
      - id: micro-behaviors/os/service/create::create-service
      - id: micro-behaviors/os/service/configure::change-service-config
      - id: micro-behaviors/process/create/spawn::create-process-w
    unless:
      - id: metadata/signed/platform/
  - id: adobe-resource-loader-masquerade
    desc: Adobe-branded resource loader with malformed certificate and service control
    crit: hostile
    conf: 0.95
    all:
      - id: metadata/binary/resource/identity::adobe-installation-helper-resource-text
      - id: metadata/binary/provenance/version-info::adobe-organization-resource-text
      - id: metadata/binary/layout/checksum::cert-table-truncated
      - id: micro-behaviors/os/virtualization/detect::vmware-version-port-query
      - id: micro-behaviors/data/embedded/payload/resource::pe-resource-full-extraction
      - id: micro-behaviors/os/service/configure::service-reconfiguration-control-api-set
    unless:
      - id: metadata/signed/platform/
