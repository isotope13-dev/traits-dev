# An Adobe product claim paired with a truncated certificate table, a VM
# probe, resource loading, and service control supports deliberate camouflage.
defaults:
  platforms: [windows]
  for: [pe]
  attack: T1036

composite_rules:
  - id: adobe-resource-loader-masquerade
    desc: Adobe-branded resource loader with malformed certificate and service control
    crit: hostile
    conf: 0.95
    all:
      - id: metadata/binary/resource/identity::adobe-installation-helper-resource-text
      - id: metadata/binary/provenance/version-info::adobe-organization-resource-text
      - id: metadata/binary/layout/checksum::cert-table-truncated
      - id: micro-behaviors/os/virtualization/detect::vmware-version-port-query
      - id: micro-behaviors/data/embedded/payload/resource::pe-resource-full-extraction
      - id: micro-behaviors/os/service/configure::service-reconfiguration-control-api-set
    unless:
      - id: metadata/signed/platform/
