# An unsigned program that copies a Microsoft file's version data, has an
# extra non-standard section beside the usual ones, a root-directory .exe
# path in its strings, and code that checks the PE signature of other files
# fits an infected or trojanized system utility: the Microsoft identity is
# the host's, the added section and file checks are the infector's.
defaults:
  platforms: [windows]
  for: [pe]
  attack: T1036.005,T1027
composite_rules:
  - id: unsigned-microsoft-claim-with-extra-section-and-pe-check
    desc: Unsigned Microsoft-claim PE with added section
    crit: hostile
    conf: 0.78
    all:
      - id: metadata/signed/trust-level::unsigned-pe-microsoft-version-fields
      - id: metadata/binary/section/label::multiple-nonstandard-section-names
      - id: micro-behaviors/fs/path/system::path-suspicious-root-exe
      - id: micro-behaviors/data/format/pe-parser::inline-pe-signature-check
    unless:
      - id: metadata/signed/platform/
