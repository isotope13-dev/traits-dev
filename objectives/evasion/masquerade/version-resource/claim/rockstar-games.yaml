defaults:
  platforms: [windows]
  for: [pe]
  attack: T1036.005

composite_rules:
  - id: unsigned-rockstar-script-dropper
    desc: Unsigned script dropper claims Rockstar Games in its version resource
    crit: hostile
    conf: 0.99
    all:
      - id: metadata/binary/vendor::rockstar-games-version-company
      - id: objectives/execution/payload/file-exec/spawn/runtime::dotnet-remote-wsh-script-dropper
    unless:
      - id: metadata/signed/platform/
