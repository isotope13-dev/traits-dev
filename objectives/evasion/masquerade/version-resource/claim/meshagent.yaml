# Product identity conflicts with the resource claim. Neither a browser name
# nor ordinary MeshAgent capability is treated as hostile on its own.
defaults:
  platforms: [windows]
  for: [pe]
  attack: T1036.005
composite_rules:
  - id: meshagent-edge-version-masquerade
    desc: MeshAgent impersonates Edge in version resources
    crit: hostile
    conf: 0.99
    all:
      - id: well-known/dual-use/remote-admin/meshcentral::meshcentral-agent-upstream-marker
      - id: metadata/binary/resource/identity::pe-original-filename-msedge
