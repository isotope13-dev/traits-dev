# An unsigned executable that claims to be a Microsoft Office component in
# its version resource, runs from a writable and executable code section,
# and extracts a PE from its resources before launching it through WinExec
# uses the Office identity as cover for a dropper.
defaults:
  platforms: [windows]
  for: [pe]
  attack: T1036.005,T1204.002
composite_rules:
  - id: unsigned-office-claim-resource-dropper
    desc: Unsigned Office claim extracting resource PE
    crit: hostile
    conf: 0.85
    all:
      - id: metadata/signed/trust-level::unsigned-pe-microsoft-version-fields
      - id: metadata/binary/provenance/version-info::pe-resource-office-product-claim
      - id: metadata/binary/section/permission::writable-text-section
      - id: micro-behaviors/data/embedded/payload/resource::pe-resource-full-extraction
      - id: micro-behaviors/process/create/exec::winexec
    unless:
      - id: metadata/signed/platform/
