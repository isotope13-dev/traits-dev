defaults:
  platforms: [windows]
  for: [pe, dll]
composite_rules:
  - id: unsigned-defender-export-rwx-loader-list
    desc: Unsigned Defender facade with RWX loader insertion
    crit: hostile
    conf: 0.97
    all:
      - id: metadata/binary/symbols/exports::defender-mp-memory-export
      - id: metadata/binary/symbols/exports::defender-mp-client-export
      - id: metadata/signed/trust-level::unsigned-missing-signature-record
      - id: micro-behaviors/mem/alloc/virtual::x64-call-rwx-protect-fourth-arg
      - id: micro-behaviors/os/module/link::native-ldr-adjacent-list-insertion-x64
      - id: objectives/anti-static/obfuscation/control-flow/dispatch::tls-state-relative-table-flattening
