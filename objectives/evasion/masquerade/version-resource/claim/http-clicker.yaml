# Unsigned COM/clicker PEs that claim Microsoft or explorer.exe and also
# embed a cleartext HTTP URL are traffic-hijackers, not vendor components.
defaults:
  platforms: [windows]
  for: [pe, dll]
  attack: T1036.005,T1071.001
  crit: hostile
  conf: 0.94

composite_rules:
  - id: explorer-masquerade-http
    desc: Explorer-named PE embeds a cleartext HTTP URL
    all:
      - id: micro-behaviors/fs/path/application/executable::explorer-executable-reference
      - id: micro-behaviors/communications/http/url/scheme::cleartext-http-url
    any:
      - id: objectives/evasion/masquerade/process/name::explorer-original-filename-claim
      - id: objectives/evasion/masquerade/process/name::explorer-internal-name-claim
      - id: objectives/evasion/masquerade/process/name::explorer-file-basename
    needs: 1
    unless:
      - id: metadata/signed/platform/
      - id: well-known/lib/
      - id: metadata/binary/installer/family/

  - id: com-selfreg-http-clicker
    desc: Self-registering COM module embeds a cleartext HTTP URL
    scope: file
    all:
      - id: micro-behaviors/os/com/registration::com-inproc-self-registration
      - id: micro-behaviors/communications/http/url/scheme::cleartext-http-url
    any:
      - id: metadata/binary/vendor::microsoft-prefixed-company
      - id: micro-behaviors/fs/path/application/executable::explorer-executable-reference
      - id: metadata/binary/provenance/version-info::pe-version-original-filename-svchost
    needs: 1
    unless:
      - id: metadata/signed/platform/
      - id: well-known/lib/
      - id: metadata/binary/installer/family/

  - id: unsigned-com-selfreg-exec
    desc: Self-registering COM module creates a process
    attack: T1546.015,T1059
    scope: file
    all:
      - id: micro-behaviors/os/com/registration::com-inproc-self-registration
      - id: micro-behaviors/process/create/spawn::create-process-a
    unless:
      - id: metadata/signed/platform/
      - id: well-known/lib/
      - id: metadata/binary/installer/family/
      # These verified signed WinUtilities COM components expose system
      # settings, licensing, skinning, and history-cleaning features. Their
      # registration entries are inert HKCR class definitions; ShellExecute
      # occurs in a separate user-facing control method.
      - id: well-known/app/system/winutilities::winutilities-system-control-module-identity
      - id: well-known/app/system/winutilities::winutilities-license-module-identity
      - id: well-known/app/system/winutilities::winutilities-skin-module-identity
      - id: well-known/app/system/winutilities::winutilities-history-cleaner-module-identity

  - id: svchost-masquerade-http
    desc: svchost-named PE embeds a cleartext HTTP URL
    all:
      - id: metadata/binary/provenance/version-info::pe-version-original-filename-svchost
      - id: micro-behaviors/communications/http/url/scheme::cleartext-http-url
    unless:
      - id: metadata/signed/platform/
      - id: well-known/lib/
      - id: metadata/binary/installer/family/
      - id: metadata/package/tooling::cpuz-binary

  - id: svchost-masquerade-php
    desc: svchost-named PE embeds a PHP gate URL
    all:
      - id: micro-behaviors/fs/path/host-process::windows-svchost-name
      - id: micro-behaviors/communications/http/url/php-endpoint::url-php-endpoint-binary
    unless:
      - id: metadata/signed/platform/
      - id: well-known/lib/
      - id: metadata/binary/installer/family/
      - id: metadata/package/tooling::cpuz-binary

  - id: unsigned-ms-kv-http
    desc: Fake Microsoft version-info PE embeds HTTP
    all:
      - id: metadata/binary/provenance/version-info::company-microsoft-corporation
      - id: micro-behaviors/communications/http/url/scheme::cleartext-http-url
    unless:
      - id: metadata/signed/platform/
      - id: well-known/lib/
      - id: metadata/binary/vendor::is-microsoft-named

  - id: svchost-php-path
    desc: svchost-named PE posts to a PHP gate
    all:
      - id: micro-behaviors/fs/path/host-process::windows-svchost-name
      - id: micro-behaviors/communications/http/url/php-endpoint::url-php-endpoint-binary
    unless:
      - id: metadata/signed/platform/
      - id: well-known/lib/
      - id: metadata/package/tooling::cpuz-binary

  - id: unsigned-atl-create-process
    desc: Unsigned ATL COM module creates a process
    attack: T1546.015,T1059
    all:
      - id: micro-behaviors/os/com/automation::atl-library-import
      - id: micro-behaviors/process/create/spawn::create-process-a
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/installer/family/

  # Wine's builtin COM DLLs are unsigned by construction and self-register
  # with GUID-named sync objects; the runtime identity is not a masquerade.
  - id: unsigned-com-guid-mutex
    desc: Self-registering COM module uses a GUID mutex
    attack: T1546.015
    all:
      - id: micro-behaviors/os/com/registration::com-inproc-self-registration
      - id: micro-behaviors/process/sync/mutex::guid-mutex
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/installer/family/
      - id: well-known/tool/sysadmin/7zip::sevenzip-distribution-binary
      - id: well-known/lib/platform/wine/
