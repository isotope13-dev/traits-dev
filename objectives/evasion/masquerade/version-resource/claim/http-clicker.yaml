defaults:
  platforms:
  - windows
  for:
  - pe
  - dll
  attack: T1036.005,T1071.001
  crit: hostile
  conf: 0.94
composite_rules:
- id: explorer-masquerade-http
  desc: Explorer-named PE embeds a cleartext HTTP URL
  all:
  - id: micro-behaviors/os/application/target/system::explorer-executable-reference
  - id: micro-behaviors/communications/url/scheme::http-url-shaped-text
  any:
  - id: objectives/evasion/masquerade/process/name::explorer-original-filename-claim
  - id: objectives/evasion/masquerade/process/name::explorer-internal-name-claim
  - id: objectives/evasion/masquerade/process/name::explorer-file-basename
  needs: 1
  unless:
  - id: metadata/signature/verified/platform/
  - id: metadata/installer/product/
- id: svchost-masquerade-http
  desc: svchost-named PE embeds a cleartext HTTP URL
  all:
  - id: metadata/binary/provenance/version-info::pe-version-original-filename-svchost
  - id: micro-behaviors/communications/url/scheme::http-url-shaped-text
  unless:
  - id: metadata/signature/verified/platform/
  - id: metadata/installer/product/
  - id: micro-behaviors/communications/url/host/name::cpuz-binary
  - id: metadata/binary/instruction/opcode::pe-entrypoint-immediate-ret
- id: unsigned-ms-kv-http
  desc: Unsigned Microsoft claim beside HTTP and hook-keylog recording
  attack: T1036.005
  all:
  - id: metadata/binary/provenance/version-info::company-microsoft-corporation
  - id: metadata/signature/absent::unsigned-missing-signature-record
  - id: micro-behaviors/communications/url/scheme::http-url-shaped-text
  - id: objectives/collection/keylog/hook::dotnet-hook-keylog-recording
  unless:
  - id: metadata/signature/verified/platform/
  - id: metadata/filename/name-form::is-microsoft-named
  downgrade:
    scope: archive
    any:
    - id: metadata/package/testing/presence/corpus::binary-test-fixture-member
