defaults:
  platforms: [windows]
  for: [pe]
  attack: T1036.005
  mbc: F0004

traits:
  - id: windows-performance-analyzer-description
    desc: Windows Performance Analyzer description
    crit: notable
    conf: 0.97
    if:
      type: value
      path: pe.version.description
      exact: Windows Performance Analyzer

  - id: wpa-exe-original-filename
    desc: WPA.exe original filename claim
    crit: notable
    conf: 0.98
    if:
      type: value
      path: pe.version.original_filename
      regex: '(?i)^WPA\.exe$'

  - id: wpa-exe-internal-name
    desc: WPA.exe internal name claim
    crit: notable
    conf: 0.96
    if:
      type: value
      path: pe.version.internal_name
      regex: '(?i)^WPA\.exe$'

composite_rules:
  # Fake WPA branding on an unsigned, importless PE is a loader identity
  # wrapper — genuine Windows Performance Analyzer builds are signed and have
  # a normal import table.
  - id: unsigned-wpa-importless-masquerade
    desc: Unsigned importless PE claims to be WPA.exe
    crit: hostile
    conf: 0.98
    attack: T1036.005,T1027.007
    all:
      - id: objectives/evasion/masquerade/trust::unsigned-pe-microsoft-version-claim
      - id: wpa-exe-original-filename
      - id: wpa-exe-internal-name
      - id: windows-performance-analyzer-description
      - id: metadata/binary/metrics/structural::no-imports
    unless:
      - id: metadata/signed/platform/
      - id: metadata/signed/certificate/identity/
