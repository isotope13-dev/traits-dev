defaults:
  attack: T1036.005
  for: [pe]
  platforms: [windows]
traits:
- id: userinit-original-filename-claim
  desc: Claims Userinit original filename
  crit: component
  conf: 0.99
  if:
    type: value
    path: pe.version.original_filename
    regex: '(?i)^userinit\.exe$'
- id: userinit-logon-description-claim
  desc: Claims Userinit logon description
  crit: component
  conf: 0.99
  if:
    type: value
    path: pe.version.description
    exact: Userinit Logon Application
- id: clock-microsoft-product
  desc: Clock Microsoft product claim
  crit: notable
  conf: 0.95
  if:
    type: text
    exact: Clock Microsoft
    section: .rsrc
- id: clock-original-filename
  desc: Clock.EXE original filename
  crit: notable
  conf: 0.95
  if:
    type: text
    exact: Clock.EXE
    section: .rsrc
- id: onedrive-exe-string
  desc: OneDrive.exe name in binary
  crit: notable
  conf: 0.95
  if:
    type: text
    exact: OneDrive.exe
- id: jusched-exe-string
  desc: jusched.exe name in binary
  crit: notable
  conf: 0.95
  if:
    type: text
    exact: jusched.exe
- id: svcutil-original-filename
  desc: svcutil.exe original filename string
  crit: notable
  conf: 0.95
  if:
    type: text
    exact: svcutil.exe
    section: .rsrc
- id: system-configuration-utility
  desc: System Configuration Utility version string
  crit: notable
  conf: 0.94
  if:
    type: text
    exact: System Configuration Utility
    section: .rsrc
- id: system-configuration-tool
  desc: System Configuration Tool product string
  crit: notable
  conf: 0.94
  if:
    type: text
    exact: System Configuration Tool
    section: .rsrc
- id: system-applet-product-claim
  desc: System Applet product claim
  crit: notable
  conf: 0.95
  if:
    type: text
    exact: System Applet
    section: .rsrc
- id: system-applet-copyright
  desc: System Applet copyright string
  crit: notable
  conf: 0.92
  if:
    type: text
    substr: Copyright (C) 2013 System Applet
    section: .rsrc
- id: windows-component-update-service
  desc: Windows Component Update service claim
  crit: notable
  conf: 0.96
  if:
    type: text
    exact: Windows Component Update Service
    section: .rsrc
- id: windows-software-foundation
  desc: Windows Software Foundation claim
  crit: notable
  conf: 0.96
  if:
    type: text
    exact: Windows Software Foundation
    section: .rsrc
- id: winupdate-internal-name
  desc: WinUpdate internal name string
  crit: notable
  conf: 0.95
  if:
    type: text
    exact: WinUpdate
    section: .rsrc
- id: microsoft-windows-systemutility-manifest
  desc: Microsoft.Windows.SystemUtility manifest
  crit: notable
  conf: 0.97
  if:
    type: text
    substr: Microsoft.Windows.SystemUtility
    section: .rsrc
- id: scom-2007-product
  desc: SCOM 2007 product claim
  crit: notable
  conf: 0.98
  if:
    type: text
    exact: System Center Operations Manager 2007
    section: .rsrc
- id: momagentinstaller-filename
  desc: MOMAgent installer filename
  crit: notable
  conf: 0.98
  if:
    type: text
    exact: MOMAgentInstaller.exe
    section: .rsrc
- id: momagentinstaller-description
  desc: MOMAgent installer description
  crit: notable
  conf: 0.97
  if:
    type: text
    exact: MOMAgentInstaller Module
    section: .rsrc
- id: notification-helper-original-filename
  desc: "notification_helper.exe original filename"
  crit: notable
  conf: 0.99
  if:
    type: text
    exact: notification_helper.exe
    section: .rsrc
- id: notification-helper-internal-name
  desc: notification_helper_exe internal name string
  crit: notable
  conf: 0.98
  if:
    type: text
    exact: notification_helper_exe
    section: .rsrc
- id: notification-helper-pdb
  desc: notification_helper.exe PDB path
  crit: notable
  conf: 0.96
  if:
    type: text
    exact: notification_helper.exe.pdb
- id: getmac-original-filename
  desc: GetMac.exe original filename string
  crit: notable
  conf: 0.99
  if:
    type: text
    exact: GetMac.exe
    section: .rsrc
- id: getmac-file-description
  desc: GetMac utility file description
  crit: notable
  conf: 0.99
  if:
    type: text
    exact: Displays NIC MAC information
    section: .rsrc
composite_rules:
- id: unsigned-userinit-urlmon-downloader
  desc: Unsigned URLMon downloader claims Windows Userinit
  crit: hostile
  conf: 0.995
  attack: T1036.005,T1105,T1106
  size_max: 131072
  all:
  - id: userinit-original-filename-claim
  - id: userinit-logon-description-claim
  - id: metadata/binary/vendor::microsoft-corp-versioninfo
  - id: micro-behaviors/communications/http/client/urlmon::url-download-to-file
  - id: micro-behaviors/process/create/exec::winexec
  - id: metadata/signed/trust-level::unsigned-missing-signature-record
  unless:
  - id: metadata/signed/trust-level::signer-evidence-present
- id: clock-utility-masquerade
  desc: PE masquerades as Clock utility
  crit: suspicious
  conf: 0.92
  all:
  - id: metadata/package/versioning/scheme::pe-version-resource
  - id: metadata/package/versioning/scheme::pe-originalfilename-field
  - id: objectives/evasion/masquerade/version-resource/microsoft-utility::clock-microsoft-product
  - id: objectives/evasion/masquerade/version-resource/microsoft-utility::clock-original-filename
- id: svcutil-system-config-masquerade
  desc: Unsigned PE masquerades as Microsoft svcutil system utility
  crit: suspicious
  conf: 0.95
  all:
  - id: metadata/package/versioning/scheme::pe-version-resource
  - id: metadata/package/versioning/scheme::pe-originalfilename-field
  - id: svcutil-original-filename
  any:
  - id: system-configuration-utility
  - id: system-configuration-tool
  unless:
  - id: metadata/signed/platform/
  - id: metadata/binary/vendor::is-microsoft-named
- id: file-falcon-system-applet-masquerade
  desc: File Falcon System Applet masquerade
  crit: suspicious
  conf: 0.97
  size_max: 400000
  all:
  - id: metadata/package/versioning/scheme::pe-version-resource
  - id: metadata/package/versioning/scheme::pe-companyname-field
  - id: metadata/package/versioning/scheme::pe-productname-field
  - id: system-applet-product-claim
  - id: metadata/signed/unknown::file-falcon
  any:
  - id: system-applet-copyright
  - id: micro-behaviors/os/privilege/manifest::highest-available
  - id: objectives/anti-static/obfuscation/string/junking::repeated-padding-marker
  - id: metadata/binary/layout/ratio::overlay-size-metrics
  needs: 2
  downgrade:
    any:
    - id: metadata/signed/platform/
    - id: metadata/binary/vendor::microsoft-corp-versioninfo
- id: scom-installer-masquerade
  desc: Unsigned SCOM installer masquerade
  crit: suspicious
  conf: 0.98
  all:
  - id: metadata/package/versioning/scheme::pe-version-resource
  - id: metadata/binary/vendor::microsoft-corp-versioninfo
  - id: scom-2007-product
  - id: momagentinstaller-filename
  any:
  - id: momagentinstaller-description
  - id: objectives/evasion/indicator-removal/timestamps::timestamp-anomaly
  - id: metadata/hardening/mitigation::nx-disabled
  - id: metadata/binary/header/identity::binary-format-checked
  needs: 2
  downgrade:
    any:
    - id: metadata/signed/platform/
- id: getmac-version-resource
  desc: GetMac version resource identity
  crit: component
  conf: 0.99
  all:
  - id: metadata/package/versioning/scheme::pe-version-resource
  - id: metadata/package/versioning/scheme::pe-originalfilename-field
  - id: getmac-original-filename
  - id: getmac-file-description
  - id: metadata/binary/vendor::windows-os-product-name
- id: unsigned-getmac-masquerade
  desc: Unsigned PE masquerades as GetMac utility
  crit: suspicious
  conf: 0.98
  all:
  - id: getmac-version-resource
  - id: metadata/binary/vendor::microsoft-corp-versioninfo
  any:
  - id: objectives/anti-static/obfuscation/binary-metrics/shape::binary-packed
  - id: metadata/binary/section/label::upx-section
  - id: metadata/hardening/memory::wx-section
  unless:
  - id: metadata/signed/platform/
  - id: metadata/binary/vendor::is-microsoft-named
- id: trojan-getmac-masquerade-tampered
  desc: Trojanized getmac masquerade with tampered headers
  crit: hostile
  conf: 0.97
  all:
  - id: unsigned-getmac-masquerade
  any:
  - id: metadata/binary/layout/checksum::pe-checksum-mismatch
  - id: metadata/binary/layout/entropy::large-low-overall-entropy-binary
  - id: micro-behaviors/communications/ipc/mailslot::create-mailslot
  - id: micro-behaviors/communications/ipc/named-pipe::create-named-pipe
  needs: 2
  unless:
  - id: metadata/signed/platform/
  - id: metadata/binary/vendor::is-microsoft-named
