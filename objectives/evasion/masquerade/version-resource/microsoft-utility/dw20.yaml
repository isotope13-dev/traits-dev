defaults:
  platforms: [windows]
  for: [pe]
  attack: T1036.005
  mbc: F0004
traits:
  - id: dw20-microsoft-office-product
    desc: Microsoft Office product claim
    crit: component
    conf: 0.9
    if:
      type: value
      path: pe.version.product_name
      exact: Microsoft Office

  - id: dw20-host-unsigned
    desc: PE has no Authenticode signature
    crit: component
    conf: 0.97
    if:
      id: metadata/signed/trust-level::unsigned
    unless:
      - id: metadata/signed/certificate/identity::pe-signature-verified-kv

composite_rules:
  - id: dw20-watson-masquerade
    desc: PE masquerading as Microsoft Watson dw20.exe
    crit: hostile
    conf: 0.97
    all:
      - id: well-known/app/system/windows-error-reporting::dw20-original-filename
      - id: metadata/binary/vendor::microsoft-corp-versioninfo
      - id: dw20-host-unsigned
    any:
      - id: metadata/binary/metrics/pe-details::pe-console-subsystem
      - id: objectives/evasion/indicator-removal/timestamps::header-timestamp-pre-2000
      - id: dw20-microsoft-office-product
    needs: 2
