defaults:
  attack: T1036.005
  for: [pe]
  platforms: [windows]
traits:
composite_rules:
- id: fake-winrar-version-resource
  desc: Unsigned PE claims WinRAR version identity
  crit: suspicious
  conf: 0.96
  all:
  - id: metadata/binary/resource/identity::alexander-roshal-author
  any:
  - id: metadata/binary/resource/identity::winrar-archiver-filedesc
  - id: metadata/binary/resource/identity::winrar-original-filename
  # Genuine WinRAR is Authenticode-signed by win.rar GmbH; a masquerading PE can
  # copy the version strings but cannot reproduce the vendor certificate. The
  # previous developer/win-rar-gmbh id was never emitted by the engine, so this
  # never suppressed real WinRAR modules.
  unless:
  - id: metadata/signed/platform/
  - id: well-known/tool/sysadmin/winrar::winrar-authenticode-publisher
  # A built WinRAR self-extractor legitimately retains the vendor's version
  # resource while the resulting archive is unsigned. Treat that as packaging,
  # not a forged WinRAR identity; payload-specific SFX objectives score malice.
  - id: metadata/binary/installer/sfx::winrar-sfx
