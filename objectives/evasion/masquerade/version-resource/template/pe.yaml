# A VERSIONINFO resource that is half vendor claim, half unfilled build
# template. The AppWizard/template defaults ("TODO: <Product name>") are what
# a developer sees before filling in the fields; a shipped vendor binary never
# retains one. When a resource simultaneously declares a populated company and
# file description — the fields a victim reads on the Details tab to decide
# the file is legitimate — while its product name is still the template
# placeholder, the version information was fabricated for the payload rather
# than inherited from genuine vendor software. Observed on the later-stage
# payload of the counterfeit-installer campaign tracked by Microsoft Defender
# Experts (Speech Processing Solutions GmbH / Philips Speech masquerade).
# ATT&CK: T1036.005 (Match Legitimate Name or Location)
defaults:
  attack: T1036.005
  for: [pe, dll]
  platforms: [windows]

composite_rules:
- id: vendor-claim-with-template-placeholder
  desc: Vendor-branded version info retains TODO template field
  crit: suspicious
  conf: 0.9
  all:
  - id: metadata/package/versioning::pe-version-resource
  - id: metadata/package/versioning::pe-company-name-populated
  - id: metadata/package/versioning::pe-file-description-present
  any:
  - id: metadata/package/versioning::pe-todo-product-placeholder
  - id: metadata/package/versioning::pe-todo-company-placeholder
  - id: metadata/package/versioning::pe-todo-product-zh-placeholder
  - id: metadata/package/versioning::pe-todo-company-zh-placeholder
  unless:
  - id: metadata/signed/platform/
