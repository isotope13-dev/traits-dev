# A real company alongside an unfilled product field can
# indicate a fabricated vendor resource. All-template AppWizard builds make
# no vendor claim. Exclude the known company-name template placeholders.
defaults:
  attack: T1036.005
  for: [pe, dll]
  platforms: [windows]

composite_rules:
- id: vendor-claim-with-template-placeholder
  desc: Vendor-branded version info retains TODO template field
  crit: suspicious
  conf: 0.9
  all:
  - id: metadata/binary/resource/identity::pe-version-resource
  - id: metadata/package/versioning/scheme::pe-company-name-populated
  - id: metadata/package/versioning/scheme::pe-file-description-present
  any:
  - id: metadata/package/versioning/scheme::pe-todo-product-placeholder
  - id: metadata/package/versioning/scheme::pe-todo-product-zh-placeholder
  unless:
  - id: metadata/signed/platform/
  - id: metadata/package/versioning/scheme::pe-todo-company-placeholder
  - id: metadata/package/versioning/scheme::pe-todo-company-zh-placeholder
