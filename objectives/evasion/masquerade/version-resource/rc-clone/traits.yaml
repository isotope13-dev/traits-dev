# Windows .rc resource scripts that clone Microsoft/system-DLL VERSIONINFO
# fields for carrier proxies or DLL sideloading implants.
defaults:
  platforms: [windows]
  for: [text, c, cpp]
  attack: T1036.005

traits:
  - id: rc-cloned-windows-module-comment
    desc: Resource script cites cloned Windows path
    crit: suspicious
    conf: 0.94
    if:
      type: text
      regex: '(?i)\bcloned\s+from\s+[a-z]:\\windows\\'

  - id: rc-proxy-impersonation-comment
    desc: Source admits carrier proxy impersonation
    crit: suspicious
    conf: 0.94
    if:
      type: text
      regex: '(?i)(module\s+being\s+impersonated|carrier\s+proxy|impersonating\s+[a-z0-9_.-]+\.dll)'

  - id: rc-detection-evasion-comment
    desc: Comment tunes version fields to evade detection
    crit: notable
    conf: 0.92
    if:
      type: text
      regex: '(?i)(detection\s+rules[^\n]{0,60}signature|would\s+be\s+the\s+tell)'

  - id: rc-dotnet-clr-dll-original-filename
    desc: RC OriginalFilename names .NET runtime DLL
    crit: notable
    conf: 0.93
    if:
      type: text
      regex: '(?i)VALUE\s+"OriginalFilename"\s*,\s*"(mscorsvc|mscoree|clrjit|fusion)\.dll"'

  - id: rc-common-proxy-dll-original-filename
    desc: RC OriginalFilename names sideloaded DLL
    crit: notable
    conf: 0.92
    if:
      type: text
      regex: '(?i)VALUE\s+"OriginalFilename"\s*,\s*"(version|dbghelp|winmm|cryptbase)\.dll"'

composite_rules:
  - id: rc-microsoft-system-dll-versioninfo-clone
    desc: Windows RC script clones Microsoft system DLL VERSIONINFO
    crit: suspicious
    conf: 0.9
    all:
      - id: metadata/binary/provenance/version-fields::rc-microsoft-dll-versioninfo
    any:
      - id: rc-dotnet-clr-dll-original-filename
      - id: rc-common-proxy-dll-original-filename
      - id: metadata/binary/provenance/version-fields::rc-dotnet-framework-product
    unless:
      - id: metadata/lang/upstream::rc-upstream-compat-notice

  - id: rc-cloned-proxy-versioninfo-masquerade
    desc: Windows RC script clones system DLL VERSIONINFO for carrier proxy
    crit: hostile
    conf: 0.98
    attack: T1036.005,T1574.001
    mbc: F0004
    all:
      - id: metadata/binary/provenance/version-fields::rc-dll-versioninfo
    any:
      - id: rc-cloned-windows-module-comment
      - id: rc-proxy-impersonation-comment
      - id: rc-detection-evasion-comment
