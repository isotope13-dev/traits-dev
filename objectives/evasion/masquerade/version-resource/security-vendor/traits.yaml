defaults:
  for:
  - pe
  - dll
  platforms:
  - windows
  attack: T1036
traits:
- id: ioooiok-marker
  desc: IOOOIOOK junk marker string
  crit: notable
  conf: 0.95
  if:
    type: text
    exact: IOOOIOOKIOOOIOOKIOOOIOOKINU
- id: removal-tool-text
  desc: Security vendor removal tool text
  crit: notable
  conf: 0.9
  if:
    type: text
    regex: (?i)removal too?l?
    section: .rsrc
- id: symantec-site-text
  desc: Symantec website resource text
  crit: notable
  conf: 0.88
  if:
    type: text
    substr: http://www.symantec.com
    section: .rsrc
- id: antimalware-service-description
  desc: Antimalware service executable FileDescription
  crit: suspicious
  conf: 0.95
  attack: T1036.005
  if:
    type: value
    path: pe.version.description
    regex: '(?i)^Antimalware service executable$'
- id: msmpengcp-internal-name
  desc: MsMpEngCP InternalName or OriginalFilename
  crit: component
  conf: 0.94
  if:
    type: text
    regex: '(?i)\bMsMpEngCP(\.exe)?\b'
- id: malwarebytes-filedesc-typo
  desc: 'malwarebytes filedesc typo'
  crit: suspicious
  conf: 0.95
  attack: T1036.005
  if:
    type: text
    exact: Malwarebytes Anti-Malwar Pro
    section: .rsrc
- id: malwarebytes-corporation-versioninfo
  desc: 'malwarebytes corporation versioninfo'
  crit: notable
  conf: 0.85
  if:
    type: text
    exact: Malwarebytes Corporation
    section: .rsrc
- id: windows-defender-extension-versioninfo
  desc: Windows Defender extension versioninfo
  crit: suspicious
  conf: 0.96
  ref: sha256:e5321904c73fdf4c0dd39ad5ebb7da2a1837c67aa892d2a268203da3ead9afa1
  if:
    type: text
    exact: Windows Defender Extension
- id: windows-defender-extension-filename
  desc: Windows Defender extension filename
  crit: notable
  conf: 0.94
  ref: sha256:e5321904c73fdf4c0dd39ad5ebb7da2a1837c67aa892d2a268203da3ead9afa1
  if:
    type: text
    exact: WdExt.exe
- id: mbam-double-extension-masquerade
  desc: 'mbam double extension masquerade'
  crit: suspicious
  conf: 0.97
  attack: T1036.005
  if:
    type: text
    exact: MBAM.exe.exe
    section: .rsrc
  unless:
  - id: metadata/signed/platform/
- id: trend-micro-company-rsrc
  desc: Trend Micro company name in VERSIONINFO
  crit: notable
  conf: 0.9
  if:
    type: text
    substr: Trend Micro Inc.
    section: .rsrc
- id: trend-micro-antivirus-filedesc
  desc: Trend Micro AntiVirus FileDescription claim
  crit: notable
  conf: 0.92
  if:
    type: text
    regex: '(?i)Trend Micro AntiVirus'
    section: .rsrc
- id: pe-original-filename-7zsfx
  desc: PE OriginalFilename claims 7zsfx.exe
  crit: notable
  conf: 0.93
  if:
    type: text
    regex: '(?i)\b7zsfx\.exe\b'
    section: .rsrc
- id: offlinescanner-shell-original-filename
  desc: OfflineScannerShell.exe VERSIONINFO filename
  crit: notable
  conf: 0.98
  if:
    type: value
    path: pe.version.original_filename
    regex: '(?i)^OfflineScannerShell\.exe$'
- id: defender-offline-shell-description
  desc: Windows Defender Offline Shell FileDescription
  crit: suspicious
  conf: 0.98
  attack: T1036.005
  if:
    type: value
    path: pe.version.description
    regex: '(?i)^Windows Defender Offline Shell$'
- id: haozip-sfx-setup-pdb-path
  desc: HaoZip 7z SFX builder PDB path
  crit: notable
  conf: 0.97
  if:
    type: value
    path: pe.debug.pdb.path
    regex: '(?i)HaoZip7zSetup\.pdb'
composite_rules:
- id: security-vendor-version-resource-decoy
  desc: Fake security vendor version resource
  crit: suspicious
  conf: 0.92
  all:
  - id: metadata/binary/resource/identity::pe-version-resource
  - id: metadata/signed/certificate/identity::verisign-symantec-timestamp-chain
  - id: metadata/signed/certificate/identity::bitdefender-brand-text
  any:
  - id: metadata/signed/certificate/identity::verisign-logo-url
  - id: metadata/file/padding::paddingxxpadding-filler
  - id: ioooiok-marker
- id: security-vendor-removal-tool-decoy
  desc: Fake security vendor cleanup tool identity
  crit: suspicious
  conf: 0.94
  all:
  - id: metadata/binary/resource/identity::pe-version-resource
  - id: metadata/signed/certificate/identity::verisign-symantec-timestamp-chain
  - id: removal-tool-text
  any:
  - id: symantec-site-text
  - id: metadata/signed/certificate/identity::symantec-corporation-cert
- id: fake-antimalware-binary
  desc: Unsigned binary masquerades as Microsoft Antimalware service
  crit: suspicious
  conf: 0.96
  attack: T1036.005
  all:
  - id: antimalware-service-description
  - id: metadata/binary/vendor::microsoft-corp-versioninfo
  unless:
  - id: metadata/signed/platform/
# Unsigned host whose overlay/payload bytes claim Defender / MsMpEng identity
# while carrying a stack of standard PE images. Real Defender components are
# Microsoft-platform-signed and do not ship as an unsigned PE cascade.
- id: unsigned-defender-branded-pe-stack
  desc: Unsigned PE stacks Defender-branded payload images
  crit: hostile
  conf: 0.97
  attack: T1036.005,T1105
  all:
  - id: metadata/binary/layout/embedded::repeated-standard-pe-images
  - id: metadata/signed/trust-level::unsigned-missing-signature-record
  - id: well-known/app/security/defender::microsoft-malware-protection-product-name
  any:
  - id: antimalware-service-description
  - id: msmpengcp-internal-name
  unless:
  - id: metadata/signed/platform/
  - id: metadata/binary/installer/family/
  - id: metadata/binary/installer/sfx/
- id: malwarebytes-masquerade-typo
  desc: Unsigned binary masquerades as Malwarebytes with typo'd file description
  crit: suspicious
  conf: 0.97
  attack: T1036.005
  all:
  - id: malwarebytes-filedesc-typo
  - id: malwarebytes-corporation-versioninfo
  unless:
  - id: metadata/signed/platform/
- id: defender-extension-non-microsoft-signed
  desc: Non-Microsoft signed Defender extension masquerade
  crit: hostile
  conf: 0.97
  attack: T1036.005
  ref: sha256:e5321904c73fdf4c0dd39ad5ebb7da2a1837c67aa892d2a268203da3ead9afa1
  all:
  - id: windows-defender-extension-versioninfo
  - id: windows-defender-extension-filename
  - id: metadata/signed/certificate/signature::pe-signature-verified-kv
  unless:
  - id: metadata/signed/platform::microsoft
- id: unsigned-defender-extension-masquerade
  desc: Unsigned binary masquerades as Windows Defender Extension
  crit: hostile
  conf: 0.97
  attack: T1036.005
  ref: sha256:2e0ebc55174e4b6de9a2ff7ca4f1bd47c07af2e799f378320b3215961d1752db
  all:
  - id: windows-defender-extension-versioninfo
  - id: windows-defender-extension-filename
  - id: metadata/signed/trust-level::unsigned-missing-signature-record
  unless:
  - id: metadata/signed/platform::microsoft
- id: unsigned-trend-micro-7zsfx-masquerade
  desc: Unsigned Trend Micro 7zsfx masquerade
  crit: hostile
  conf: 0.97
  attack: T1036.005
  all:
  - id: trend-micro-company-rsrc
  - id: trend-micro-antivirus-filedesc
  - id: pe-original-filename-7zsfx
  - id: metadata/signed/trust-level::unsigned-missing-signature-record
  unless:
  - id: metadata/signed/platform/
- id: unsigned-defender-offline-haozip-sfx-dropper
  desc: Unsigned Defender Offline SFX built with HaoZip tooling
  crit: hostile
  conf: 0.98
  attack: T1036.005,T1204.002,T1105
  all:
  - id: defender-offline-shell-description
  - id: offlinescanner-shell-original-filename
  - id: haozip-sfx-setup-pdb-path
  - id: metadata/binary/vendor::microsoft-corp-versioninfo
  - id: micro-behaviors/ui/window/suppression::sfx-silent-raw-directive
  - id: micro-behaviors/process/create/shell/batch::sfx-setup-batch-script
  unless:
  - id: metadata/signed/platform/
- id: unsigned-avira-antivir-masquerade
  desc: Unsigned binary masquerades as Avira AntiVir engine
  crit: hostile
  conf: 0.97
  attack: T1036.005
  all:
  - id: metadata/binary/provenance/version-info::avira-company-field
  - id: metadata/binary/provenance/version-info::antivir-engine-description
  - id: metadata/signed/trust-level::unsigned-missing-signature-record
  - id: micro-behaviors/communications/socket/receive::x86-recv-buffer-task-dispatch
  unless:
  - id: metadata/signed/platform/

