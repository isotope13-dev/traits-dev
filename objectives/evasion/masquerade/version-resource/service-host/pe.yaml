defaults:
  for:
  - pe
  platforms:
  - windows
composite_rules:
- id: foreign-vendor-service-host-identity
  desc: Unsigned svchost identity attributed to a non-Microsoft vendor
  crit: suspicious
  conf: 0.94
  attack: T1036.005
  all:
  - id: metadata/binary/provenance/version-info::pe-version-original-filename-svchost
  - id: metadata/package/versioning/scheme::pe-company-name-populated
  - id: metadata/signed/trust-level::unsigned-missing-signature-record
  unless:
  - id: metadata/signed/platform/
  - id: metadata/binary/vendor::microsoft-prefixed-company
  - id: well-known/app/system/reactos::system-component
- id: foreign-vendor-service-host-packed-loader
  desc: Fake svchost identity over a packed dynamic-resolution loader
  crit: hostile
  conf: 0.97
  attack: T1036.005,T1027.002
  mbc: F0001
  all:
  - id: foreign-vendor-service-host-identity
  any:
  - id: micro-behaviors/process/info/query::peb-access-x64
  - id: metadata/binary/symbols/imports::pe-imports-max-six
  - id: metadata/binary/symbols/count::imported-functions-under-80
  - id: metadata/binary/section/label::multiple-nonstandard-section-names
  - id: metadata/binary/resource/entropy::large-high-entropy-rsrc-section
  needs: 2
  unless:
  - id: metadata/signed/platform/
  - id: metadata/binary/installer/family/
- id: unsigned-service-host-version-resource
  desc: Unsigned PE masquerades as service host
  crit: suspicious
  conf: 0.96
  size_max: 600000
  all:
  - id: metadata/binary/resource/identity::pe-version-resource
  - id: metadata/binary/vendor::microsoft-corp-versioninfo
  any:
  - id: metadata/binary/provenance/version-info::host-process-service-description
  - id: metadata/binary/provenance/version-info::service-host-file-description
  - id: metadata/binary/provenance/version-info::svchost-internal-name
  - id: micro-behaviors/fs/path/host-process::windows-svchost-name
  needs: 2
  unless:
  - id: metadata/signed/platform/
- id: trojanized-svchost-reloc-loader
  desc: Trojanized svchost with encrypted reloc loader
  crit: hostile
  conf: 0.995
  all:
  - id: objectives/evasion/masquerade/version-resource/service-host::unsigned-service-host-version-resource
  - id: metadata/binary/section/ratio::dominant-encrypted-reloc-service-layout
  any:
  - id: micro-behaviors/os/service/dispatch::service-dispatch-triad
  - id: micro-behaviors/os/service/host::service-dll-value-name
  - id: objectives/evasion/anti-av/api-hashing::wide-string-uppercase-mask
  needs: 2
- id: unsigned-service-host-overlay-loader
  desc: Unsigned PE with overlay masquerading as service host
  crit: suspicious
  conf: 0.95
  size_min: 500000
  all:
  - id: metadata/binary/resource/identity::pe-version-resource
  - id: metadata/binary/vendor::microsoft-corp-versioninfo
  - id: metadata/binary/provenance/version-info::host-process-service-description
  - id: metadata/binary/provenance/version-info::service-host-file-description
  - id: metadata/binary/provenance/version-info::svchost-internal-name
  - id: metadata/binary/layout/overlay::has-overlay
  - id: metadata/signed/trust-level::unsigned
  unless:
  - id: metadata/signed/platform/
- id: unsigned-host-path-inline-loader
  desc: Unsigned PE masquerades as svchost while validating another image
  crit: hostile
  conf: 0.98
  attack: T1036.005,T1620
  all:
  - id: micro-behaviors/fs/path/host-process::windows-svchost-name
  - id: metadata/binary/provenance/version-info::pe-basename-differs-from-original-filename
  - id: metadata/signed/trust-level::unsigned-missing-signature-record
  - id: micro-behaviors/fs/file/pe-inspect::inline-pe-signature-check
  any:
  - id: micro-behaviors/mem/protect/modify::virtual-protect
  - id: metadata/binary/layout/tls::pe-multiple-tls-callbacks
  unless:
  - id: metadata/signed/platform/
  - id: metadata/binary/installer/family/
  - id: well-known/tool/development
