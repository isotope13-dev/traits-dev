defaults:
  for: [pe]
  platforms: [windows]

traits:
  - id: host-process-service-description
    desc: Host Process for Windows Services
    crit: component
    conf: 0.97
    if:
      type: text
      exact: Host Process for Windows Services
      section: .rsrc
  - id: service-host-file-description
    desc: Generic Host Process description
    crit: component
    conf: 0.96
    if:
      type: text
      regex: Generic Host Process for Win32 Services\.?
      section: .rsrc
  - id: svchost-internal-name
    desc: svchost internal name string
    crit: component
    conf: 0.9
    if:
      type: text
      exact: svchost
      section: .rsrc

composite_rules:
  # Windows' service host is a Microsoft binary. A version resource that keeps
  # the svchost identity while attributing the file to some other company is
  # self-contradictory: no build pipeline produces it, and the pairing is what
  # a lazily-retooled crypter leaves behind when it swaps the vendor fields but
  # not the product fields (or the reverse). Both halves must be present — an
  # absent CompanyName is a different (and much more common) shape.
  - id: foreign-vendor-service-host-identity
    desc: Unsigned svchost identity attributed to a non-Microsoft vendor
    crit: suspicious
    conf: 0.94
    attack: T1036.005
    all:
      - id: metadata/binary/anomaly/provenance::pe-version-original-filename-svchost
      - id: metadata/package/versioning::pe-company-name-populated
      - id: metadata/binary/layout::pe-no-signature-record
    # CompanyName is the deciding field, so the exclusions read it directly
    # rather than any Microsoft mention elsewhere in the resource: a fake
    # svchost that copies the whole Microsoft version block is a different
    # shape, already covered by unsigned-service-host-version-resource below.
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/vendor::microsoft-prefixed-company

  # The contradictory identity plus the shape of a crypter stub: a code section
  # that never came from the real svchost build, APIs resolved by hand out of
  # the PEB instead of an import table, and a bulk encrypted blob to unpack.
  # Genuine svchost.exe is Microsoft-signed, imports normally, and carries no
  # high-entropy payload, so nothing benign lands here.
  - id: foreign-vendor-service-host-packed-loader
    desc: Fake svchost identity over a packed dynamic-resolution loader
    crit: hostile
    conf: 0.97
    attack: T1036.005,T1027.002
    mbc: F0001
    all:
      - id: foreign-vendor-service-host-identity
    any:
      - id: micro-behaviors/os/env/access::peb-access-x64
      - id: metadata/binary/symbols/imports::pe-imports-max-six
      - id: metadata/binary/section/metrics::multiple-nonstandard-section-names
      - id: metadata/binary/resource::large-high-entropy-rsrc-section
    needs: 2
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/installer/family/
  - id: unsigned-service-host-version-resource
    desc: Unsigned PE masquerades as service host
    crit: suspicious
    conf: 0.96
    size_max: 600000
    all:
      - id: metadata/package/versioning::pe-version-resource
      - id: metadata/binary/vendor::microsoft-corp-versioninfo
    any:
      - id: objectives/evasion/masquerade/version-resource/service-host::host-process-service-description
      - id: objectives/evasion/masquerade/version-resource/service-host::service-host-file-description
      - id: objectives/evasion/masquerade/version-resource/service-host::svchost-internal-name
      - id: objectives/evasion/masquerade/process/name::svchost-name
    needs: 2
    unless:
      - id: metadata/signed/platform/
  - id: trojanized-svchost-reloc-loader
    desc: Trojanized svchost with encrypted reloc loader
    crit: hostile
    conf: 0.995
    all:
      - id: objectives/evasion/masquerade/version-resource/service-host::unsigned-service-host-version-resource
      - id: metadata/binary/section/metrics::dominant-encrypted-reloc-service-layout
    any:
      - id: micro-behaviors/os/service/control::service-dispatch-triad
      - id: micro-behaviors/os/service/host::service-dll-value-name
      - id: objectives/evasion/anti-av/api-hashing::wide-string-uppercase-mask
    needs: 2
  - id: unsigned-service-host-overlay-loader
    desc: Unsigned PE with overlay masquerading as service host
    crit: suspicious
    conf: 0.95
    size_min: 500000
    all:
      - id: metadata/package/versioning::pe-version-resource
      - id: metadata/binary/vendor::microsoft-corp-versioninfo
      - id: objectives/evasion/masquerade/version-resource/service-host::host-process-service-description
      - id: objectives/evasion/masquerade/version-resource/service-host::service-host-file-description
      - id: objectives/evasion/masquerade/version-resource/service-host::svchost-internal-name
      - id: metadata/binary/layout::has-overlay
      - id: metadata/signed/trust-level::unsigned
    unless:
      - id: metadata/signed/platform/
  - id: unsigned-host-path-inline-loader
    desc: Unsigned PE masquerades as svchost while validating another image
    crit: hostile
    conf: 0.98
    attack: T1036.005,T1620
    all:
      - id: micro-behaviors/fs/path/host-process::windows-svchost-name
      - id: metadata/binary/anomaly/provenance::pe-basename-differs-from-original-filename
      - id: metadata/binary/layout::pe-no-signature-record
      - id: micro-behaviors/fs/file/pe-inspect::inline-pe-signature-check
    any:
      - id: micro-behaviors/mem/protect/modify::virtual-protect
      - id: metadata/binary/layout::pe-multiple-tls-callbacks
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/installer/family/
      - id: well-known/tool/development/
