defaults:
  platforms: [windows]
  for: [pe]
composite_rules:
  - id: garbled-go-microsoft-service-host-impersonation
    desc: Garbled Go binary impersonates Microsoft svchost
    crit: hostile
    conf: 0.99
    # The platform-mandated Windows service identity contradicts a randomized
    # Go implementation. No collector-assigned on-disk filename is required.
    all:
      - id: metadata/binary/provenance/version-info::pe-version-original-filename-svchost
      - id: metadata/binary/provenance/version-info::company-microsoft-corporation
      - id: objectives/anti-static/obfuscation/obfuscator/garble::go-garble-indicators
    unless:
      - id: metadata/signed/platform/
      - id: well-known/app/system/reactos::system-component
