defaults:
  for: [pe, dll]
  platforms: [windows]

composite_rules:
  - id: gentee-chrome-claim-dominant-overlay
    desc: Gentee overlay with Chrome resource claims
    crit: hostile
    conf: 0.99
    attack: T1036.005,T1027
    all:
      - id: micro-behaviors/process/interpreter/gentee::gentee-launcher-decode-apis
      - id: metadata/binary/layout/ratio::overlay-over-90pct
      - id: chrome-setup-description-claim
      - id: chrome-product-claim
