defaults:
  attack: T1036.005
  for: [pe]
  platforms: [windows]
traits:
- id: chrome-setup-description-claim
  desc: Claims Chrome Setup description
  crit: notable
  conf: 0.99
  if:
    type: value
    path: pe.version.description
    exact: Chrome Setup
- id: chrome-product-claim
  desc: Claims Chrome product name
  crit: notable
  conf: 0.99
  if:
    type: value
    path: pe.version.product_name
    exact: Chrome
- id: chrome-original-filename-claim
  desc: Claims Chrome.exe original filename
  crit: notable
  conf: 0.99
  if:
    type: value
    path: pe.version.original_filename
    exact: Chrome.exe
- id: chrome-updater-file-description
  desc: Chrome_Updater FileDescription masquerade
  crit: notable
  conf: 0.95
  if:
    type: text
    exact: Chrome_Updater
    section: .rsrc
- id: google-llc-company-string
  desc: Google LLC company string
  crit: notable
  conf: 0.98
  if:
    type: text
    exact: Google LLC
    section: .rsrc
- id: google-company-string
  desc: Google company string
  crit: notable
  conf: 0.95
  if:
    type: text
    exact: google
    section: .rsrc
- id: chrome-exe-version-string
  desc: chrome.exe version string
  crit: notable
  conf: 0.95
  if:
    type: text
    exact: chrome.exe
    section: .rsrc
- id: google-chrome-product-string
  desc: Google Chrome product string
  crit: notable
  conf: 0.98
  if:
    type: text
    exact: Google Chrome
    section: .rsrc
composite_rules:
- id: google-chrome-notification-helper-versioninfo
  desc: Chrome notification helper version resource
  crit: component
  conf: 0.99
  all:
  - id: metadata/package/versioning/scheme::pe-version-resource
  - id: metadata/package/versioning/scheme::pe-companyname-field
  - id: metadata/package/versioning/scheme::pe-productname-field
  - id: metadata/package/versioning/scheme::pe-originalfilename-field
  - id: google-llc-company-string
  - id: google-chrome-product-string
  - id: objectives/evasion/masquerade/version-resource/microsoft-utility::notification-helper-original-filename
- id: unsigned-google-chrome-reloc-carrier
  desc: Unsigned Chrome host with encrypted reloc
  crit: suspicious
  conf: 0.99
  all:
  - id: google-chrome-notification-helper-versioninfo
  - id: objectives/anti-static/obfuscation/payload/section::encrypted-reloc-payload-carrier
  any:
  - id: objectives/evasion/masquerade/version-resource/microsoft-utility::notification-helper-internal-name
  - id: objectives/evasion/masquerade/version-resource/microsoft-utility::notification-helper-pdb
- id: chrome-updater-dropper-masquerade
  desc: Dropper masquerading as Chrome Updater with unfilled metadata
  crit: suspicious
  conf: 0.97
  all:
  - id: chrome-updater-file-description
  - id: metadata/package/versioning/scheme::pe-version-resource
  any:
  - id: metadata/package/versioning/scheme::pe-todo-company-placeholder
  - id: metadata/package/versioning/scheme::pe-todo-product-placeholder
  downgrade:
    any:
    - id: metadata/signed/platform/
- id: signed-chrome-gentee-overlay-dropper
  desc: Verified-signed Chrome-branded Gentee overlay dropper
  crit: hostile
  conf: 0.99
  attack: "T1036.005,T1027,T1105"
  all:
  - id: chrome-setup-description-claim
  - id: chrome-product-claim
  - id: chrome-original-filename-claim
  - id: metadata/signed/certificate/identity::pe-signature-verified-kv
  - id: metadata/binary/layout/ratio::overlay-over-90pct
  - id: micro-behaviors/process/interpreter/gentee::gentee-launcher-decode-apis
# Unsigned Themida loaders that steal Google Chrome VERSIONINFO are a
# classic brand-masquerade delivery shape; verified Google-signed Chrome is
# excluded via google-chrome-browser-context.
- id: unsigned-themida-chrome-product-masquerade
  desc: Unsigned Themida claims Google Chrome product
  crit: hostile
  conf: 0.99
  attack: T1036.005,T1027.002
  mbc: F0001,F0004
  all:
  - id: objectives/anti-static/pack/detect::themida-boot-loader-layout
  - id: well-known/tool/browser::chrome-product-name
  - id: metadata/signed/trust-level::unsigned-missing-signature-record
  unless:
  - id: well-known/tool/browser::google-chrome-browser-context
  - id: metadata/signed/platform/
  - id: metadata/signed/leaf::google-inc
  - id: metadata/signed/leaf::google-llc
  - id: metadata/binary/installer/family/
