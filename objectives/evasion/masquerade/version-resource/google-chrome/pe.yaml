defaults:
  attack: T1036.005
  for: [pe]
  platforms: [windows]
traits:
- id: chrome-setup-description-claim
  desc: Claims Chrome Setup description
  crit: notable
  conf: 0.99
  if:
    type: value
    path: pe.version.description
    exact: Chrome Setup
- id: chrome-product-claim
  desc: Claims Chrome product name
  crit: notable
  conf: 0.99
  if:
    type: value
    path: pe.version.product_name
    exact: Chrome
- id: chrome-original-filename-claim
  desc: Claims Chrome.exe original filename
  crit: notable
  conf: 0.99
  if:
    type: value
    path: pe.version.original_filename
    exact: Chrome.exe
- id: chrome-updater-file-description
  desc: Chrome_Updater FileDescription masquerade
  crit: notable
  conf: 0.95
  if:
    type: text
    exact: Chrome_Updater
    section: .rsrc
- id: google-company-string
  desc: Google company string
  crit: notable
  conf: 0.95
  if:
    type: text
    exact: google
    section: .rsrc
composite_rules:
- id: google-branded-self-issued-opaque-overlay
  desc: Self-issued Google-branded PE carries a large appended payload
  crit: suspicious
  conf: 0.96
  attack: T1036.005,T1027
  all:
  - id: metadata/binary/resource/identity::google-llc-resource-string
  - id: metadata/signature/certificate/chain::pe-cert-leaf-self-issued
  - id: metadata/binary/layout/overlay::large-noncertificate-unclaimed-bytes
- id: google-branded-overlay-appdata-dropper
  desc: Google PE launches its opaque overlay payload from roaming AppData
  crit: hostile
  conf: 0.99
  attack: T1036.005,T1027
  all:
  - id: google-branded-self-issued-opaque-overlay
  - id: micro-behaviors/fs/read/file/handle::pe-wide-module-path-file-io-imports
  - id: micro-behaviors/fs/write/file/handle/unspecified::write-file
  - id: micro-behaviors/fs/path/app-data/platform::windows-user-roaming-path
  - id: metadata/binary/symbols/name/process::create-process-w
- id: google-chrome-notification-helper-versioninfo
  desc: Chrome notification helper version resource
  crit: component
  conf: 0.99
  all:
  - id: metadata/binary/resource/identity::pe-version-resource
  - id: metadata/binary/provenance/version-fields::pe-companyname-field
  - id: metadata/binary/provenance/version-fields::pe-productname-field
  - id: metadata/binary/provenance/version-fields::pe-originalfilename-field
  - id: metadata/binary/resource/identity::google-llc-resource-string
  - id: metadata/binary/resource/identity::google-chrome-resource-string
  - id: objectives/evasion/masquerade/version-resource/microsoft-utility::notification-helper-original-filename
- id: unsigned-google-chrome-reloc-carrier
  desc: Unsigned Chrome host with encrypted reloc
  crit: suspicious
  conf: 0.99
  all:
  - id: google-chrome-notification-helper-versioninfo
  - id: objectives/anti-static/obfuscation/payload/section/layout::encrypted-reloc-payload-carrier
  any:
  - id: objectives/evasion/masquerade/version-resource/microsoft-utility::notification-helper-internal-name
  - id: objectives/evasion/masquerade/version-resource/microsoft-utility::notification-helper-pdb
- id: chrome-updater-dropper-masquerade
  desc: Dropper masquerading as Chrome Updater with unfilled metadata
  crit: suspicious
  conf: 0.97
  all:
  - id: chrome-updater-file-description
  - id: metadata/binary/resource/identity::pe-version-resource
  any:
  - id: metadata/binary/provenance/version-fields::pe-todo-company-placeholder
  - id: metadata/binary/provenance/version-fields::pe-todo-product-placeholder
  downgrade:
    any:
    - id: metadata/signature/verified/platform/
- id: signed-chrome-gentee-overlay-dropper
  desc: Verified-signed Chrome-branded Gentee overlay dropper
  crit: hostile
  conf: 0.99
  attack: "T1036.005,T1027,T1105"
  all:
  - id: chrome-setup-description-claim
  - id: chrome-product-claim
  - id: chrome-original-filename-claim
  - id: metadata/signature/certificate/integrity::pe-signature-verified-kv
  - id: metadata/binary/layout/ratio::overlay-over-90pct
  - id: metadata/binary/symbols/name/function::gentee-launcher-decode-apis
# Unsigned Themida loaders that steal Google Chrome VERSIONINFO are a
# classic brand-masquerade delivery shape; verified Google-signed Chrome is
# excluded via google-chrome-browser-context.
- id: unsigned-themida-chrome-product-masquerade
  desc: Unsigned Themida claims Google Chrome product
  crit: hostile
  conf: 0.99
  attack: T1036.005,T1027.002
  mbc: F0001,F0004
  all:
  - id: objectives/anti-static/pack/detect::themida-boot-loader-layout
  - id: well-known/app/browser/google-chrome::google-chrome-product-name-claim
  - id: metadata/signature/absent::unsigned-missing-signature-record
  unless:
  - id: well-known/tool/browser::google-chrome-browser-context
  - id: metadata/signature/verified/platform/
  - id: metadata/signature/verified/signer::google-inc
  - id: metadata/signature/verified/signer::google-llc
  - id: metadata/installer/product/
# Unsigned executables that masquerade as Google Chrome while carrying a
# concealed native payload handoff and an embedded PE or large overlay are
# deceptive delivery loaders.
- id: unsigned-chrome-masquerade-concealed-loader
  desc: Unsigned Chrome disguise with concealed native payload handoff
  crit: hostile
  conf: 0.98
  attack: T1036.005,T1027
  all:
  - id: metadata/signature/absent::unsigned-pe-google-version-fields
  - id: micro-behaviors/os/application/target/browser::chrome-exe-process-name
  - id: objectives/anti-static/obfuscation/control-flow/stack::saved-stack-native-payload-handoff
  any:
  - id: metadata/binary/layout/size::large-overlay-1mb
  - id: metadata/binary/layout/embedded::pe-embedded
  unless:
  - id: well-known/tool/browser::google-chrome-browser-context
  - id: metadata/signature/verified/platform/
  - id: metadata/installer/product/
# Genuine Google Chrome components are signed by Google. An unsigned PE that
# claims Google LLC / Google Chrome version metadata while registering a
# Windows service dispatcher and making outbound HTTP requests is a masqueraded
# service implant (e.g. Backdoor.Lindnor healthcontroller64.exe).
- id: unsigned-chrome-masquerade-service-implant
  desc: Unsigned Google Chrome masquerade runs a networked Windows service
  crit: hostile
  conf: 0.98
  attack: T1036.005,T1543.003
  all:
  - id: metadata/signature/absent::unsigned-pe-google-version-fields
  - id: well-known/app/browser/google-chrome::google-chrome-product-name-claim
  - id: micro-behaviors/os/service/dispatch::service-control-dispatch
  - id: micro-behaviors/communications/http/client/
  unless:
  - id: well-known/tool/browser::google-chrome-browser-context
  - id: metadata/signature/verified/platform/
  - id: metadata/signature/verified/signer::google-inc
  - id: metadata/signature/verified/signer::google-llc
  - id: metadata/installer/product/
