defaults:
  for: [pe]
  platforms: [windows]
composite_rules:
  # A PE that presents a Google-branded identity on a self-issued leaf, then
  # creates and starts a service and polls keyboard state, is a service
  # impersonator. The self-issued leaf is the forgery; the Google strings are
  # the claim. A legitimate Google binary is issued by a public CA, so this
  # combination does not need the claimed signer to be verified.
  - id: self-issued-google-service-impersonator
    desc: Self-issued Google-branded PE creates a service and polls keys
    crit: hostile
    conf: 0.93
    attack: T1036.005,T1543.003,T1056.001
    all:
      - id: metadata/signature/certificate/chain::pe-cert-leaf-self-issued
      - id: metadata/signature/claim/signer::google-llc
      - id: micro-behaviors/os/service/configure::service-create-configure-start-api-set
      - id: micro-behaviors/hardware/input/keyboard/poll::get-async-key-state
