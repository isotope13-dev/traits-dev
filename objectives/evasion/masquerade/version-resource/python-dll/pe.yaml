defaults:
  attack: T1036.005
  for: [pe]
  platforms: [windows]
traits:
- id: python-launcher-string
  desc: Python Launcher version string
  crit: notable
  conf: 0.95
  if:
    type: text
    exact: Python Launcher
    section: .rsrc
- id: py-original-filename-string
  desc: py.exe original filename string
  crit: notable
  conf: 0.95
  if:
    type: text
    exact: py.exe
    section: .rsrc
composite_rules:
- id: python-launcher-version-resource
  desc: Python Launcher version resource identity
  crit: component
  conf: 0.97
  all:
  - id: metadata/package/versioning/scheme::pe-version-resource
  - id: metadata/package/versioning/scheme::pe-companyname-field
  - id: metadata/package/versioning/scheme::pe-originalfilename-field
  - id: python-launcher-string
  - id: metadata/binary/vendor::python-software-foundation-marker
  - id: py-original-filename-string
