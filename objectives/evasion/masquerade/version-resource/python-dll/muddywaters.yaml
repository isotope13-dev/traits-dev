defaults:
  platforms: [windows]
  for: [pe, dll]
  crit: hostile
  conf: 0.9
composite_rules:
  - id: spoofed-metadata-conflict
    desc: Trusted vendor metadata but high-entropy code/data (potential spoofing)
    crit: suspicious
    all:
      - id: metadata/binary/vendor/
    any:
      - id: metadata/binary/section/entropy::high-entropy-resource-small-pe
      - id: metadata/binary/section/ratio::oversized-rdata-ratio
    unless:
      # Vendor identity backed by an Authenticode signature that verifies is
      # not spoofed metadata. The vendor/ directory leg also counts signer
      # identities (game-publisher-signature, recognized-windows-binary), so
      # without this a genuinely Tencent-signed DLL (TSSafeEdit) read as a
      # spoof of itself. A stolen or bought certificate is a signing problem
      # the signing rules own, not a metadata conflict.
      - id: metadata/signed/certificate/signature::pe-signature-verified-kv
      # Wine builtin DLLs reimplement the Windows API surface and carry the originals metadata by design.
      - id: metadata/lang/upstream::windows-system-implementer-dll
      - id: micro-behaviors/fs/temp/pyinstaller/
      - id: well-known/lib/runtime/scripted/python-runtime::python-stable-abi-forwarder-basename
      - id: metadata/binary/header/malformed::vcruntime-dll-basename
      - id: metadata/binary/header/malformed::libcrypto-dll-basename
      - id: metadata/binary/header/malformed::libssl-dll-basename
      - id: well-known/app/system/reactos::system-component
      - id: micro-behaviors/data/archive/custom::pyinstaller-archive-cookie-read-error
