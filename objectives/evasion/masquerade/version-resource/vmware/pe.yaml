defaults:
  attack: T1036.005
  for: [pe]
  platforms: [windows]
traits:
- id: vmware-inc-company-string
  desc: VMware Inc company string
  crit: notable
  conf: 0.98
  if:
    type: text
    exact: VMware, Inc.
    section: .rsrc
- id: vmware-player-description
  desc: VMware Player file description
  crit: notable
  conf: 0.98
  if:
    type: text
    exact: VMware Player
    section: .rsrc
- id: vmplayer-original-filename
  desc: vmplayer.exe original filename
  crit: notable
  conf: 0.99
  if:
    type: text
    exact: vmplayer.exe
    section: .rsrc
- id: vmware-workstation-product
  desc: VMware Workstation product string
  crit: notable
  conf: 0.98
  if:
    type: text
    exact: VMware Workstation
    section: .rsrc
composite_rules:
- id: vmware-player-version-resource
  desc: VMware Player version resource identity
  crit: component
  conf: 0.99
  all:
  - id: metadata/package/versioning/scheme::pe-version-resource
  - id: metadata/package/versioning/scheme::pe-companyname-field
  - id: metadata/package/versioning/scheme::pe-productname-field
  - id: metadata/package/versioning/scheme::pe-originalfilename-field
  - id: vmware-inc-company-string
  - id: vmware-player-description
  - id: vmplayer-original-filename
  - id: vmware-workstation-product
- id: unsigned-vmware-player-masquerade
  desc: Unsigned VMware Player masquerade
  crit: suspicious
  conf: 0.98
  size_max: 200000
  all:
  - id: vmware-player-version-resource
  any:
  - id: objectives/anti-static/obfuscation/string/junking::repeated-padding-marker
  - id: metadata/binary/code/complexity::no-functions
  - id: metadata/binary/symbols/count::many-imports
