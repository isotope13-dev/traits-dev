defaults:
  attack: T1036.005
  for: [pe]
  platforms: [windows]
composite_rules:
- id: unsigned-vmware-player-masquerade
  desc: Unsigned VMware Player masquerade
  crit: suspicious
  conf: 0.98
  size_max: 200000
  all:
  - id: well-known/app/infrastructure/vmware-workstation::vmware-player-version-resource
  any:
  - id: metadata/binary/layout/padding::paddingxxpadding-filler
  - id: metadata/binary/code/complexity::no-functions
  - id: metadata/binary/symbols/count::many-imports
- id: unsigned-vmware-masquerade-service-implant
  desc: Unsigned VMware version-resource masquerade runs a networked Windows service
  crit: hostile
  conf: 0.98
  attack: T1036.005,T1543.003
  all:
  - id: metadata/binary/provenance/version-info::vmware-inc-company-string
  - id: metadata/signature/absent::unsigned-missing-signature-record
  - id: micro-behaviors/os/service/dispatch::service-control-dispatch
  - id: micro-behaviors/communications/http/client/
  unless:
  - id: metadata/signature/verified/platform/
  - id: metadata/signature/verified/signer::vmware-inc.
  - id: metadata/installer/product/
