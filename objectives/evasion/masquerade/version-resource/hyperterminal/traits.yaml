defaults:
  platforms: [windows]
  for: [pe]
  attack: T1036.005

traits:
  - id: hilgraeve-company-claim
    desc: Claims Hilgraeve publisher identity
    crit: component
    conf: 0.99
    if:
      type: value
      path: pe.version.company
      exact: Hilgraeve, Inc.

  - id: hyperterminal-applet-description
    desc: Claims HyperTerminal Applet description
    crit: component
    conf: 0.99
    if:
      type: value
      path: pe.version.description
      exact: HyperTerminal Applet

  - id: windows-xp-hyperterminal-version
    desc: Claims HyperTerminal version 5.1.2600.0
    crit: component
    conf: 0.99
    if:
      type: value
      path: pe.version.file_version
      exact: 5.1.2600.0

composite_rules:
  - id: packed-hyperterminal-identity-masquerade
    desc: Unsigned PECompact binary claims legacy HyperTerminal identity
    crit: hostile
    conf: 0.995
    all:
      - id: hilgraeve-company-claim
      - id: hyperterminal-applet-description
      - id: windows-xp-hyperterminal-version
      - id: micro-behaviors/data/encode/pecompact::pec2to-section-token
      - id: metadata/binary/layout::pe-no-signature-record
      - id: metadata/binary/section/metrics::pe-multiple-executable-writable-sections
    unless:
      - id: metadata/signed/platform/
