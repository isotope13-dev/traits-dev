defaults:
  conf: 0.98
  attack: T1036.005
  for: [pe]
  platforms: [windows]
traits:
- id: application-frame-host-description
  desc: Application Frame Host description
  crit: notable
  conf: 0.98
  if:
    type: text
    exact: Application Frame Host
    section: .rsrc
- id: applicationframehost-original-filename
  desc: ApplicationFrameHost executable claim
  crit: notable
  conf: 0.98
  if:
    type: text
    exact: ApplicationFrameHost.exe
    section: .rsrc
composite_rules:
- id: signed-applicationframehost-masquerade
  desc: Signed PE masquerades as ApplicationFrameHost
  crit: suspicious
  conf: 0.98
  all:
  - id: metadata/package/versioning/scheme::pe-version-resource
  - id: metadata/package/versioning/scheme::pe-originalfilename-field
  - id: metadata/binary/vendor::microsoft-corp-versioninfo
  - id: application-frame-host-description
  - id: applicationframehost-original-filename
  - id: objectives/evasion/masquerade/version-resource/microsoft-utility::microsoft-windows-systemutility-manifest
  - id: metadata/signed/platform::microsoft
  unless:
  - id: objectives/evasion/masquerade/version-resource/applicationframehost::basename
