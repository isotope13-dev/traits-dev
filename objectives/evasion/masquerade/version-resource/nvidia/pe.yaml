defaults:
  attack: T1036.005
  for: [pe]
  platforms: [windows]
traits:
- id: nvidia-gpu-compiler-driver-description
  desc: NVIDIA GPU compiler driver description
  crit: notable
  conf: 0.96
  if:
    type: text
    substr: Nvidia gpu compiler driver
    section: .rsrc
    case_insensitive: true
composite_rules:
- id: nvidia-labs-driver-version-masquerade
  desc: NVIDIA driver metadata masquerade
  crit: suspicious
  conf: 0.98
  all:
  - id: metadata/package/versioning/scheme::pe-version-resource
  - id: metadata/package/versioning/scheme::pe-companyname-field
  - id: metadata/package/versioning/scheme::pe-filedescription-field
  - id: metadata/package/versioning/scheme::pe-productname-field
  - id: nvidia-gpu-compiler-driver-description
  - id: objectives/evasion/masquerade/version-resource/claim::labs-inc-company-name
  unless:
  - id: metadata/signed/platform/
