defaults:
  platforms: [windows]
  for: [pe]

composite_rules:
- id: nvidia-claim-encrypted-inno-overlay
  desc: NVIDIA-claim Inno overlay with process API
  crit: suspicious
  conf: 0.99
  all:
  - id: objectives/anti-static/obfuscation/payload/encrypted::encrypted-inno-overlay-payload
  - id: objectives/evasion/masquerade/version-resource/nvidia::nvidia-labs-driver-version-masquerade
  - id: metadata/signed/trust-level::unsigned
  - id: micro-behaviors/process/create/spawn::create-process-w
  any:
  - id: micro-behaviors/fs/write/file/handle::write-file
  - id: micro-behaviors/fs/file/open::file-create-win
  - id: micro-behaviors/os/privilege/token::adjust-token-privileges
