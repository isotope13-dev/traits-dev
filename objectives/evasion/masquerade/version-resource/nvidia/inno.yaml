defaults:
  platforms: [windows]
  for: [pe]

composite_rules:
- id: nvidia-claim-encrypted-inno-overlay
  desc: NVIDIA-claim Inno overlay with process API
  crit: suspicious
  conf: 0.99
  all:
  - id: metadata/binary/layout/entropy::inno-high-entropy-overlay-profile
  - id: objectives/evasion/masquerade/version-resource/nvidia::nvidia-labs-driver-version-masquerade
  - id: metadata/signature/absent::unsigned
  - id: micro-behaviors/process/create/native-symbol::create-process-w
  any:
  - id: micro-behaviors/fs/write/file/handle/call::write-file
  - id: micro-behaviors/fs/file/open/call::file-create-win
  - id: micro-behaviors/os/privilege/token/use::adjust-token-privileges
