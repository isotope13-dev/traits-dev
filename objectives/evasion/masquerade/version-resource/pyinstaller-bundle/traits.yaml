defaults:
  platforms: [windows]
  for: [pe]
  attack: T1036.005,T1553.002

composite_rules:
  # A PyInstaller bootloader has no version resource or signature of its own.
  # Stealer builders copy a Windows component's version resource (here
  # SearchProtocolHost.exe, "Microsoft Windows Search Protocol Host") and its
  # Authenticode block onto the bundle so it looks like a signed system binary.
  # The borrowed name stays in the version resource while the image no longer
  # hashes to the signed digest, which the integrity check reports as tampered.
  - id: pyinstaller-bundle-forged-search-host-identity
    desc: PyInstaller bundle posing as signed Search host
    crit: hostile
    conf: 0.95
    all:
      - id: objectives/anti-static/obfuscation/payload/loader::pyinstaller-pe-bundle-marker
      - id: micro-behaviors/fs/path/host-process::windows-search-host-name
      - id: metadata/signed/certificate/signature::pe-signature-digest-mismatch
    unless:
      - id: metadata/signed/platform/

  # Unsigned PyInstaller carriers borrow Microsoft OneDrive updater VERSIONINFO
  # so the bundle looks like a vendor sync client. Real OneDrive updaters are
  # Authenticode-signed and are not PyInstaller one-file bootloaders.
  - id: pyinstaller-bundle-forged-onedrive-updater-identity
    desc: PyInstaller bundle poses as OneDrive updater
    crit: hostile
    conf: 0.96
    attack: T1036.005,T1027.002
    scope: outer
    all:
      - id: objectives/anti-static/obfuscation/payload/loader::pyinstaller-pe-bundle-marker
      - id: well-known/app/storage/onedrive::microsoft-onedrive-product
      - id: metadata/binary/provenance/version-info::company-microsoft-corporation
    unless:
      - id: well-known/app/storage/onedrive::signed-onedrive-standalone-updater
      - id: metadata/signed/platform/

  # Same masquerade pattern without naming a specific product string: a
  # Microsoft-branded version block on a huge opaque PyInstaller overlay is
  # not how Microsoft ships utilities. The composite is file-scoped on
  # purpose: the branding must be the bundle bootloader's own version
  # resource. Scope: outer would pool by presence, and every PyInstaller
  # bundle ships Microsoft runtime DLLs whose version resources would then
  # satisfy the CompanyName leg for an unbranded bundle.
  - id: pyinstaller-microsoft-branded-opaque-bundle
    desc: Microsoft-branded PyInstaller with dominant overlay
    crit: hostile
    conf: 0.95
    attack: T1036.005,T1027.002
    all:
      - id: objectives/anti-static/obfuscation/payload/loader::pyinstaller-pe-bundle-marker
      - id: metadata/binary/provenance/version-info::company-microsoft-corporation
      - id: metadata/binary/layout/ratio::overlay-over-90pct
    unless:
      - id: metadata/signed/platform/
      - id: well-known/app/storage/onedrive::signed-onedrive-standalone-updater
