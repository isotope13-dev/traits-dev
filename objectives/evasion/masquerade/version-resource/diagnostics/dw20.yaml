defaults:
  platforms: [windows]
  for: [pe]
  attack: T1036.005
  mbc: F0004
traits:
  - id: dw20-microsoft-office-product
    desc: Microsoft Office product claim
    crit: notable
    conf: 0.9
    if:
      type: value
      path: pe.version.product_name
      exact: Microsoft Office

  - id: dw20-host-unsigned
    desc: PE has no Authenticode signature
    crit: component
    conf: 0.97
    if:
      id: metadata/signature/absent::unsigned
    unless:
      - id: metadata/signature/verified/

composite_rules:
  - id: dw20-watson-masquerade
    desc: PE masquerading as Microsoft Watson dw20.exe
    crit: hostile
    conf: 0.97
    all:
      - id: well-known/app/system/microsoft/error-reporting::dw20-original-filename
      - id: metadata/vendor/identity::microsoft-corp-versioninfo
      - id: dw20-host-unsigned
    any:
      - id: metadata/binary/header/characteristics::pe-console-subsystem
      - id: metadata/binary/provenance/build::header-timestamp-pre-2000
      - id: dw20-microsoft-office-product
    needs: 2
