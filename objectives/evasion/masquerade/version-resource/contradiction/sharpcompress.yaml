defaults:
  for: [pe]
  platforms: [windows]
composite_rules:
  - id: native-sharpcompress-xor-thread
    desc: Native SharpCompress claimant combines byte transformation and threading
    crit: suspicious
    conf: 0.98
    attack: T1036.005
    ref: https://blackpointcyber.com/blog/romulus-cncmachinerms/
    all:
      - id: metadata/binary/resource/identity::sharpcompress-product-claim
      - id: micro-behaviors/data/bitwise/xor-forms/state::x64-position-state-byte-xor
      - id: micro-behaviors/process/thread/create::create-thread
    unless:
      - id: metadata/lang/compiler/managed::dotnet-assembly
