# A remote-administration agent shipped under somebody else's product name.
#
# Lookalike download sites for well-known brands hand the visitor a signed,
# genuine remote-management installer renamed after the app the page advertised.
# Nothing in the binary is modified, so signature checks pass and an endpoint
# suite has no grounds to block it; the only artefact of the swap is that the
# file on disk no longer answers to the name compiled into its version
# resource, which is what a responder is told to check on the Details tab.
#
# The version resource is the right anchor precisely because it survives the
# rename: rewriting it would invalidate the vendor signature the campaign
# depends on.  The name half is a filename shape, not a brand list — the set of
# impersonated brands is open-ended, and matching brand words would fire on
# every legitimate installer of that brand.
#
# ATT&CK: T1036.005 (Match Legitimate Name or Location), T1219 (Remote Access
# Software)
defaults:
  platforms: [windows]
  for: [pe, dll]
  attack: T1036.005,T1219
  mbc: B0030

composite_rules:
  # An agent that no longer answers to its vendor filename.  Support providers
  # do rebrand the installers they hand to customers, so this stops one tier
  # short of conviction and the lure-name composite below carries the rest.
  - id: renamed-remote-admin-agent
    desc: Remote-admin agent renamed from vendor name
    crit: suspicious
    conf: 0.92
    all:
      - id: metadata/binary/anomaly/provenance::pe-basename-differs-from-original-filename
    any:
      - id: well-known/dual-use/remote-admin/rmm::rmm-product-version-resource
      - id: well-known/dual-use/remote-admin/syspectr::syspectr-product-version-resource
      - id: well-known/dual-use/remote-admin/teamviewer::product-name
    unless:
      # Virtual archive members carry an @offset suffix, so their extracted
      # basename can differ from an otherwise matching OriginalFilename.
      - id: metadata/binary/layout::embedded-pe-child
      # Renamed, but not to anything a victim would click. Hash-named storage,
      # quarantine directories and renumbered research corpora all rename every
      # file they hold; scanning one would otherwise report an impersonation for
      # every RMM agent in it. The hostile composite below is unaffected — it
      # requires the replacement to be a branded application name.
      - id: metadata/file/profile/identity::opaque-identifier-pe-basename
      - id: well-known/dual-use/remote-admin/screenconnect::screenconnect-component-detected

  # The replacement name is not a rebrand, it is a different product: the file
  # presents itself as a consumer application's installer while the resource
  # inside names a remote-control agent.  Whoever runs it is consenting to an
  # app, not to unattended remote administration.
  - id: consumer-app-lure-remote-admin-agent
    desc: Remote-admin agent under consumer-app name
    crit: hostile
    conf: 0.97
    all:
      - id: renamed-remote-admin-agent
      - id: objectives/evasion/masquerade/file/lure::branded-app-installer-exe-name
