# Version resource names a large software vendor, but the Authenticode
# signer is a private individual. Vendors sign their own builds; a vendor
# DLL re-signed under a personal code-signing certificate is a modified or
# substitute binary wearing the vendor's identity.
defaults:
  platforms: [windows]
  for: [pe, dll]
  attack: T1036.001,T1553.002
composite_rules:
  - id: vendor-versioninfo-personal-signer
    desc: Vendor version info signed by an individual
    crit: hostile
    conf: 0.9
    all:
      - id: metadata/signed/certificate/subject::pe-signer-personal-name-subject
      - id: metadata/signed/certificate/signature::pe-authenticode-digest-matches
      - id: metadata/vendor/identity::tencent-version-company
    unless:
      - id: metadata/signed/platform/
