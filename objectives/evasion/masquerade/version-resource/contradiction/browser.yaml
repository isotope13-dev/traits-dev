# Browser-brand contradictions in PE identity metadata. Each brand claim is
# neutral alone; the conjunction identifies an internally inconsistent cover.
defaults:
  platforms: [windows]
  for: [pe, dll]
  attack: T1036.005

traits:
  - id: safari-browser-version-description
    desc: VERSIONINFO claims Safari Browser
    crit: component
    conf: 0.98
    if:
      type: value
      path: pe.version.description
      exact: Safari Browser

  - id: safari-exe-product-name
    desc: VERSIONINFO ProductName claims Safari.exe
    crit: component
    conf: 0.98
    if:
      type: value
      path: pe.version.product_name
      exact: Safari.exe

  - id: firefox-manifest-identity
    desc: PE manifest claims FireFox assembly identity
    crit: component
    conf: 0.98
    if:
      type: value
      path: pe.manifest.assembly_identity.name
      exact: FireFox

composite_rules:
  - id: safari-firefox-browser-identity-contradiction
    desc: Safari identity conflicts with FireFox manifest
    crit: suspicious
    conf: 0.99
    all:
      - id: safari-browser-version-description
      - id: safari-exe-product-name
      - id: firefox-manifest-identity

  - id: rogue-av-browser-identity-masquerade
    desc: Privileged process killer with browser disguise
    crit: hostile
    conf: 0.995
    all:
      - id: safari-firefox-browser-identity-contradiction
      - id: micro-behaviors/os/privilege/token::high-risk-privilege-name
      - id: micro-behaviors/process/terminate/kill::terminate-process
      - id: micro-behaviors/communications/http/get::wininet-http-api-cluster
      - id: metadata/binary/layout::pe-no-signature-record
