defaults:
  platforms: [windows]
  for: [pe, dll]

traits:
  - id: microsoft-namespace-product-claim
    desc: Claims Microsoft namespace product name
    crit: notable
    conf: 0.95
    if:
      type: value
      path: pe.version.product_name
      regex: '^Microsoft\.(Win32|Windows|VisualBasic)\.'

composite_rules:
  - id: unsigned-microsoft-namespace-obfuscated-injector
    desc: Unsigned obfuscated Microsoft-named assembly with injection APIs
    crit: hostile
    conf: 0.97
    attack: T1036.005,T1027.002,T1055
    all:
      - id: metadata/binary/provenance/version-info::blank-company-version-field
      - id: microsoft-namespace-product-claim
      - id: metadata/build/protector::dotnet-reactor-module-guid-type
      - id: micro-behaviors/mem/combined::remote-process-memory-api-cluster
    unless:
      - id: metadata/signature/verified/platform/
