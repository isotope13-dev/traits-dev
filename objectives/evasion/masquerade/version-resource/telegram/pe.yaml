defaults:
  for:
    - pe
  platforms:
    - windows
  attack: T1036.005
traits:
  - id: telegram-fz-llc-company
    desc: Telegram FZ-LLC company claim
    crit: component
    conf: 0.98
    if:
      type: text
      exact: Telegram FZ-LLC
      section: .rsrc
  - id: telegram-desktop-description
    desc: Telegram Desktop file description
    crit: component
    conf: 0.97
    if:
      type: text
      exact: Telegram Desktop
      section: .rsrc
  - id: telegram-desktop-version
    desc: Telegram Desktop 6.3.6.0 version
    crit: component
    conf: 0.95
    if:
      type: text
      exact: 6.3.6.0
      section: .rsrc
composite_rules:
  - id: telegram-desktop-version-resource
    desc: Telegram Desktop version resource identity
    crit: component
    conf: 0.99
    all:
      - id: metadata/package/versioning::pe-version-resource
      - id: metadata/package/versioning::pe-companyname-field
      - id: metadata/package/versioning::pe-filedescription-field
      - id: metadata/package/versioning::pe-productname-field
      - id: objectives/evasion/masquerade/version-resource/telegram::telegram-fz-llc-company
      - id: objectives/evasion/masquerade/version-resource/telegram::telegram-desktop-description
      - id: objectives/evasion/masquerade/version-resource/telegram::telegram-desktop-version

  - id: unsigned-telegram-http-loader
    desc: Unsigned Telegram-branded .NET HTTP loader
    crit: hostile
    conf: 0.99
    attack: "T1036.005,T1105,T1140,T1620"
    mbc: "B0009.014"
    all:
      - id: well-known/app/communication/telegram::telegram-desktop-product-identity
      - id: well-known/app/communication/telegram::telegram-desktop-company-identity
      - id: metadata/binary/layout::pe-no-signature-record
      - id: metadata/binary/anomaly/provenance::pe-basename-differs-from-original-filename
      - id: objectives/command-and-control/dropper/staging/memory::dotnet-http-download-decrypt-emit-cluster
      - id: objectives/anti-static/obfuscation/obfuscator/managed::reactor-module-guid
    unless:
      - id: well-known/app/communication/telegram::telegram-desktop-signed-client-context
      - id: metadata/signed/platform/
