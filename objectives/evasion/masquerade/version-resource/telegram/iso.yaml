defaults:
  platforms: [windows]
  for: [all]
  attack: T1036.005,T1105,T1140,T1620

composite_rules:
  - id: iso-telegram-branded-http-decrypt-reflective-loader
    desc: ISO Telegram-branded HTTP decrypting reflective loader
    crit: hostile
    conf: 0.99
    all:
      - id: metadata/file/format/structured::primary-volume-descriptor
      - id: metadata/file/format/structured::embedded-executable-member
      - id: metadata/file/format/structured::embedded-telegram-product-claim
      - id: metadata/file/format/structured::embedded-telegram-company-claim
      - id: metadata/file/format/structured::embedded-dotnet-runtime-marker
      - id: metadata/file/format/structured::embedded-dotnet-resource-loader
      - id: metadata/file/format/structured::embedded-dotnet-network-marker
      - id: metadata/file/format/structured::embedded-dotnet-crypto-marker
      - id: metadata/file/format/structured::embedded-dotnet-reflection-marker
