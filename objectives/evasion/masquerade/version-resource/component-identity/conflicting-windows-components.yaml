defaults:
  platforms: [windows]
  for: [pe, dll]

composite_rules:
  # Both fields must claim individual Windows executables. An ordinary
  # Microsoft Windows product name is not a conflicting component claim.
  # Requiring the DLL declaration also avoids ordinary executable branding.
  - id: unsigned-dll-identity-conflicting-windows-components
    desc: Unsigned DLL identity names conflicting Windows components
    crit: suspicious
    conf: 0.9
    attack: T1036.005
    all:
      - id: metadata/binary/provenance/version-info::description-names-windows-system-component
      - id: metadata/binary/provenance/version-info::product-names-windows-system-component
      - id: metadata/binary/provenance/version-info::pe-version-declares-dll
      - id: metadata/signed/trust-level::unsigned-missing-signature-record
      - id: metadata/binary/provenance/version-info::description-differs-from-product
