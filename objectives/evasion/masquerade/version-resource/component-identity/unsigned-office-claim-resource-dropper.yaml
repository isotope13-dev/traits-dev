# An unsigned executable that claims to be a Microsoft Office component in
# its version resource while carrying a three-phase resource decoder uses
# the Office identity as cover for a concealed payload. Launch mechanics
# belong to the separate execution composite, not this masquerade claim.
defaults:
  platforms: [windows]
  for: [pe]
  attack: T1036
composite_rules:
  - id: unsigned-office-claim-resource-dropper
    desc: Unsigned Office claim with three-phase resource decoder
    crit: hostile
    conf: 0.85
    all:
      - id: metadata/signed/trust-level::unsigned-pe-microsoft-version-fields
      - id: metadata/binary/provenance/version-info::pe-resource-office-product-claim
      - id: micro-behaviors/data/decode/custom::x86-three-phase-subtract-byte-decoder
      - id: micro-behaviors/data/embedded/payload/resource::pe-resource-full-extraction
    unless:
      - id: metadata/signed/platform/
