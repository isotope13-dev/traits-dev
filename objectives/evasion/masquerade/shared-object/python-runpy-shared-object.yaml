defaults:
  platforms: [unix, windows]
  for: [python]
  attack: T1036.008,T1059.006

composite_rules:
  - id: python-runpy-disguised-shared-object-script
    desc: Python executes a .so-named sibling file via runpy with suppressed stdio
    crit: hostile
    conf: 0.96
    scope: file
    all:
      - id: micro-behaviors/process/interpreter/python::runpy-run-path
      - id: metadata/file/profile/module-loading::python-so-path-runpy-profile
      - id: micro-behaviors/process/fd/stdio::python-stdio-stream-replacement
      - id: micro-behaviors/data/control-flow/error-handling::silent-exception-pass
