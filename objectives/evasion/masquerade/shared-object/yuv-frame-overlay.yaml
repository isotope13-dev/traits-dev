defaults:
  size_min: 131072

traits:
  - id: yuv-neutral-chroma-tail-64k
    desc: Trailing 64KB uniform 0x80 YUV chroma tail
    crit: notable
    conf: 0.95
    platforms: [linux, windows]
    for: [elf, pe, dll]
    count_min: 960
    if:
      type: hex
      pattern: "80 80 80 80 80 80 80 80 80 80 80 80 80 80 80 80 80 80 80 80 80 80 80 80 80 80 80 80 80 80 80 80 80 80 80 80 80 80 80 80 80 80 80 80 80 80 80 80 80 80 80 80 80 80 80 80 80 80 80 80 80 80 80 80"
      offset_range: [-65536, null]

composite_rules:
  - id: elf-shared-object-yuv-chroma-overlay
    desc: ELF shared object with YUV chroma overlay
    crit: suspicious
    conf: 0.97
    platforms: [linux]
    for: [elf]
    attack: T1027
    all:
      - id: metadata/binary/header/identity::shared-object-type
      - id: metadata/binary/layout/ratio::overlay-at-least-half
      - id: yuv-neutral-chroma-tail-64k
  - id: pe-dll-yuv-chroma-overlay
    desc: PE DLL padded with YUV chroma overlay
    crit: suspicious
    conf: 0.97
    platforms: [windows]
    for: [pe, dll]
    attack: T1027
    all:
      - id: metadata/binary/header/characteristics::pe-dll-characteristics
      - id: metadata/binary/layout/ratio::overlay-at-least-half
      - id: yuv-neutral-chroma-tail-64k
    unless:
      - id: metadata/signature/verified/platform::microsoft
  - id: elf-shared-object-repeated-frame-overlay
    desc: ELF shared object with repeated ELF overlay
    crit: suspicious
    conf: 0.96
    platforms: [linux]
    for: [elf]
    attack: T1027
    all:
      - id: metadata/binary/header/identity::shared-object-type
      - id: metadata/binary/layout/ratio::overlay-at-least-half
      - id: metadata/binary/layout/embedded::embedded-elf-after-prefix
  - id: pe-dll-repeated-frame-overlay
    desc: PE DLL with repeated PE header overlay
    crit: suspicious
    conf: 0.96
    platforms: [windows]
    for: [pe, dll]
    attack: T1027
    all:
      - id: metadata/binary/header/characteristics::pe-dll-characteristics
      - id: metadata/binary/layout/ratio::overlay-at-least-half
      - id: metadata/binary/layout/embedded::embedded-pe-multi
    unless:
      - id: metadata/signature/verified/platform::microsoft
