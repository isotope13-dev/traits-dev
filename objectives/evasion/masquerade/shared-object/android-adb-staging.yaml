# Native payload staged under a shared-library name.  Android's
# `/data/local/tmp` is the world-writable directory the shell UID can write and
# execute from, so an agent that has obtained an ADB shell drops its helper
# binaries there.  Naming them `lib<something>.so` makes them read as ordinary
# NDK artifacts in a file listing while they are in fact standalone programs
# the agent execs -- a Go service handler and a reverse-proxy client, in the
# shape this technique was first documented in.
defaults:
  platforms: [android]
  for: [java, kotlin, apk, zip, dex]
  attack: T1036.005

composite_rules:
  # The masquerade is the mismatch: the loader maps a `.so`, it does not run
  # one. An ADB shell exec of a `lib*.so` out of the drop directory is a
  # program pretending to be a library.
  - id: android-adb-shared-object-payload-staging
    desc: ADB stages and runs a payload named as a library
    crit: suspicious
    conf: 0.97
    all:
      - id: micro-behaviors/communications/socket/tcp::adb-shell-exec-staged-shared-object
      - id: micro-behaviors/communications/socket/tcp::android-adb-shell-command-service-request

  - id: android-adb-agent-native-payload-launch
    desc: Wireless ADB agent launches a disguised native payload
    crit: hostile
    conf: 0.995
    attack: T1036.005,T1105
    all:
      - id: objectives/command-and-control/remote-command/control::android-wireless-adb-c2-shell
      - id: micro-behaviors/communications/socket/tcp::adb-shell-exec-staged-shared-object
