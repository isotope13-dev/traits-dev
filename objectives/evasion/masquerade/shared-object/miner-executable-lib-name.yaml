# lib*.so names a shared library; an ELF that also carries a program
# interpreter is a launchable executable wearing a library's name. Pool
# miners dropped as "libsyslog.so"-style files blend into lib directories
# and process listings.
defaults:
  platforms: [linux]
  for: [elf]
traits:
  - id: elf-library-style-basename
    desc: ELF file named like a shared library
    crit: component
    conf: 0.85
    if:
      type: basename
      regex: '^lib[A-Za-z0-9_+.-]{1,60}\.so(\.[0-9]+)*$'
composite_rules:
  - id: miner-executable-named-as-library
    desc: Pool miner executable posing as a .so library
    crit: hostile
    conf: 0.92
    attack: T1036.005,T1496
    all:
      - id: elf-library-style-basename
      - id: metadata/binary/linking/runtime::interpreter
      - id: micro-behaviors/communications/rpc::stratum-submit-method
      - id: micro-behaviors/communications/blockchain/mining::randomx
