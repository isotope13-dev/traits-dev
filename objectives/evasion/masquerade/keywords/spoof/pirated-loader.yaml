defaults:
  platforms: [windows]
  for: [pe]
  attack: T1036.005

traits:
- id: cracked-software-claim
  desc: PE claims cracked software
  crit: suspicious
  conf: 0.9
  if:
    type: value
    path: pe.version.description
    regex: '(?i)\b(crack|keygen|warez)\b'
- id: pirated-tool-executable-product-claim
  desc: ProductName claims pirated-tool executable
  crit: suspicious
  conf: 0.96
  if:
    type: value
    path: pe.version.product_name
    regex: '(?i)\b(crack(ed)?|hack|cheat|keygen|activator)\b.{0,80}\.ex(e)?\s*$'
- id: pirated-tool-executable-copyright-claim
  desc: Copyright claims pirated-tool executable
  crit: component
  conf: 0.96
  if:
    type: value
    path: pe.version.copyright
    regex: '(?i)\b(crack(ed)?|hack|cheat|keygen|activator)\b.{0,80}\.exe\s*$'

composite_rules:
- id: inno-pirated-executable-lure-wrapper
  desc: Unsigned Inno wrapper uses pirated-tool lure
  crit: hostile
  conf: 0.985
  size_min: 1800000
  size_max: 2400000
  all:
  - id: pirated-tool-executable-product-claim
  - id: pirated-tool-executable-copyright-claim
  - id: objectives/evasion/masquerade/versioninfo::blank-company-version-field
  - id: metadata/binary/installer/script::inno-setup-header-670
  - id: metadata/binary/layout::pe-no-signature-record
- id: cracked-encrypted-bndl-loader
  desc: Cracked-software claim on encrypted loader
  crit: hostile
  conf: 0.98
  attack: "T1036.005,T1027,T1105"
  all:
  - id: cracked-software-claim
  - id: objectives/command-and-control/dropper/staging/encrypted::chacha-bndl-temp-exe-dropper
  unless:
  - id: metadata/signed/platform/
  - id: metadata/binary/installer/family/
