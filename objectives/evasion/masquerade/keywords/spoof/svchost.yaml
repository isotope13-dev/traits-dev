defaults:
  platforms:
    - unix
    - windows
  for: [scripts, binaries]
traits:
  - id: double-extension-svchost
    crit: suspicious
    desc: Double extension svchost evasion string
    if:
      type: text
      substr: svchost.svchost.exe
  # A script that names itself svchost.exe.<script extension>: the batch
  # self-copy in miner.bat writes svchost.exe.bat under AppData.
  - id: svchost-exe-script-double-extension
    crit: suspicious
    desc: svchost.exe followed by script extension
    if:
      type: text
      regex: '(?i)svchost\.exe\.(bat|cmd|vbs|js|ps1)\b'
