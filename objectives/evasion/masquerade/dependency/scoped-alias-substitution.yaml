# A well-known package name aliased to somebody else's package.
#
# npm lets a manifest say `"ink": "npm:@jrichman/ink@6.4.7"`. Everything that
# calls `require("ink")` then gets `@jrichman/ink` instead, and nothing at the
# call site changes. The trojanized cline release used exactly this, next to a
# postinstall that globally installs another package.
#
# The install-hook rules describe the postinstall. This describes the
# substitution, and the two are answered differently. A postinstall runs once
# and can be audited from the install log; an alias is permanent and silent --
# every import for the life of the install resolves to the attacker's code,
# and a reviewer reading the source sees only the well-known name they
# expected. Lockfiles record the alias, but the import statements do not, so
# code review is exactly the place this survives.
#
# Keyed on an alias pointing at a *scoped* package, which is what lets an
# attacker publish under a name nobody else controls. Aliasing is a legitimate
# npm feature -- monorepos and forks use it -- so this needs the second leg
# below rather than standing alone.
defaults:
  platforms: [unix, windows]
  for: [package.json]
  attack: T1036.005,T1195.002
  mbc: B0024

composite_rules:
  - id: scoped-alias-with-install-hook
    desc: Aliased dependency beside an install hook
    crit: hostile
    conf: 0.94
    # The alias plus a lifecycle script in the same manifest. A fork or a
    # monorepo alias arrives on its own; an alias shipped alongside a script
    # that installs something else globally is a package doing two unrelated
    # things to the machine at once.
    all:
      - id: metadata/package/dependencies/manifest::npm-scoped-runtime-alias
    any:
      - id: objectives/supply-chain/install-hook/scripts/lifecycle::postinstall-global-floating-npm-install
      - id: objectives/supply-chain/install-hook/dropper/obfuscation::obfuscated-postinstall-dropper
    unless:
      - id: metadata/package/testing/
