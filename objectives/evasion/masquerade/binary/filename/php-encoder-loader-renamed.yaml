# A commercial PHP encoder loader renamed after a stock PHP extension
# (SYS010: the ionCube loader as php_phpdbg.dll, the SourceGuardian loader as
# php_pdo.win) hides that encoded scripts run on the host. Vendors and
# hosting panels keep the vendor name in the file (ioncube_loader_win_7.2.dll,
# php_ioncube.dll, ixed.7.2.win), so a loader without it was disguised.
defaults:
  platforms: [windows, linux]
  for: [pe, elf]
  attack: T1036.005

traits:
  - id: stock-php-extension-basename
    desc: Basename styled as a stock php_ extension
    crit: component
    conf: 0.9
    if:
      type: value
      path: file.basename
      regex: '(?i)^php_[a-z0-9_]{2,40}\.(dll|so|win)$'
      not:
        - ioncube
        - ixed
        - sourceguardian

composite_rules:
  - id: ioncube-loader-renamed-as-php-extension
    desc: ionCube Loader binary named as a stock PHP extension
    crit: suspicious
    conf: 0.9
    all:
      - id: well-known/lib/runtime/scripted/php-encoder-loader::ioncube-loader-extension
      - id: stock-php-extension-basename

  - id: sourceguardian-loader-renamed-as-php-extension
    desc: SourceGuardian loader binary named as a stock PHP extension
    crit: suspicious
    conf: 0.9
    all:
      - id: well-known/lib/runtime/scripted/php-encoder-loader::sourceguardian-loader-extension
      - id: stock-php-extension-basename
