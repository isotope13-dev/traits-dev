defaults:
  crit: hostile
  for:
    - pe
  platforms:
    - windows
  attack: T1036.005,T1027.009
composite_rules:
  - id: objectives/evasion/masquerade/binary/filename::unsigned-renamed-rc2-resource-loader
    desc: Unsigned renamed .NET RC2 resource loader
    conf: 0.99
    attack: T1036.005,T1027.009,T1140,T1620
    all:
      - id: metadata/lang/compiler/managed::dotnet-assembly
      - id: metadata/signature/absent::unsigned-missing-signature-record
      - id: metadata/binary/provenance/version-info::pe-basename-differs-from-original-filename
      - id: objectives/anti-static/obfuscation/payload/resource::dotnet-rc2-resource-write-cluster
    unless:
      - id: metadata/signature/verified/platform/
      - id: metadata/installer/product/
      - id: well-known/lib/runtime/managed/jvm::windows-jdk-product-identity
      - id: well-known/app/system/quno::quno-benign-resource-game
  - id: objectives/evasion/masquerade/binary/filename::renamed-opaque-native-payload
    desc: Renamed opaque native payload with API concealment
    conf: 0.95
    all:
      - id: metadata/binary/provenance/version-info::pe-basename-differs-from-original-filename
      - id: objectives/anti-static/obfuscation/payload/section/layout::large-high-entropy-gfx-section
      - id: objectives/anti-static/obfuscation/imports/api-hashing::opaque-payload-api-concealment
    unless:
      - id: metadata/signature/verified/platform/
      - id: metadata/installer/product/
      - id: well-known/lib/runtime/managed/jvm::windows-jdk-product-identity
  - id: objectives/evasion/masquerade/binary/filename::renamed-opaque-overlay-child-launcher
    desc: Renamed PE with opaque child launcher
    conf: 0.97
    attack: T1036.005,T1027.009,T1106
    all:
      - id: metadata/binary/provenance/version-info::pe-basename-differs-from-original-filename
      - id: metadata/binary/layout/overlay::large-high-entropy-overlay
      - id: metadata/signature/absent::unsigned-missing-signature-record
      - id: micro-behaviors/fs/directory/readdir/native::find-file-walker-wide
      - id: metadata/binary/symbols/name/process::create-process-w
      - id: micro-behaviors/dylib/load/runtime::load-library-w
    unless:
      - id: metadata/signature/verified/platform/
      - id: well-known/lib/runtime/managed/dotnet-runtime::dotnet-singlefile-host-context
      - id: metadata/binary/layout/embedded::dotnet-selfcontained-bundle
      - id: well-known/tool/offensive/web-assessment/zaproxy::zed-attack-proxy-pe
      - id: well-known/app/utility/ccleaner::ccleaner-offline-installer
      - id: well-known/app/system/miktex::miktex-setup-wizard
  - id: objectives/evasion/masquerade/binary/filename::unsigned-renamed-native-loader-masquerade
    desc: Unsigned renamed native PE with concealed loader markers
    conf: 0.97
    attack: T1036.005,T1027.009,T1620
    all:
      - id: metadata/binary/provenance/version-info::pe-original-filename-mismatch
      - id: metadata/signature/absent::unsigned-missing-signature-record
      - id: metadata/binary/layout/checksum::pe-checksum-zeroed
      - id: metadata/binary/resource/table::pe-single-version-resource
      - id: metadata/binary/instruction/operand::x86-pointer-load-displacement-3c
    any:
      - id: micro-behaviors/data/bitwise/xor-forms/instruction::x64-xor-imm8-widen-loop
      - id: micro-behaviors/mem/protect/modify/executable::virtualprotect-executable-resolved-x64
      - id: micro-behaviors/mem/protect/modify/executable::virtualprotect-executable-read-register-x64
    needs: 1
    unless:
      - id: metadata/signature/verified/platform/
      - id: metadata/installer/product/
      - id: well-known/lib/runtime/managed/jvm::windows-jdk-product-identity
  - id: objectives/evasion/masquerade/binary/filename::renamed-pe-evasive-layout-cluster
    desc: Renamed PE with certificate, layout, and anti-debug anomalies
    conf: 0.97
    attack: T1036.005,T1622
    all:
      - id: metadata/binary/provenance/version-info::pe-basename-differs-from-original-filename
      - id: metadata/binary/layout/checksum::cert-table-present
      - id: metadata/binary/layout/checksum::pe-checksum-mismatch
      - id: metadata/binary/section/layout::multiple-nonstandard-section-names
      - id: micro-behaviors/process/debug/detect::is-debugger-present-import
      - id: micro-behaviors/mem/protect/modify/unspecified::virtual-protect-import
    unless:
      - id: metadata/binary/section/label/custom::cape-sandbox-dump-section
      - id: metadata/binary/section/label/packing::upx0-section-name
  - id: objectives/evasion/masquerade/binary/filename::renamed-dpapi-resource-payload
    desc: Renamed PE with high-entropy resource and DPAPI access
    conf: 0.98
    attack: T1036.005,T1027.009,T1555.003
    all:
      - id: metadata/binary/provenance/version-info::pe-basename-differs-from-original-filename
      - id: metadata/signature/absent::unsigned-missing-signature-record
      - id: metadata/binary/resource/entropy::large-high-entropy-rsrc-section
      - id: micro-behaviors/os/security/dpapi::crypt-unprotect-data-api
    unless:
      - id: metadata/signature/verified/platform/
