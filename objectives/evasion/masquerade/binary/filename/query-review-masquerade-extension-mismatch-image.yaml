defaults:
  platforms:
  - windows
  - linux
  - macos
  crit: suspicious
  conf: 0.9
  attack: T1036.008

traits:
  - id: binary-content-as-image-extension
    desc: Binary content under image extension
    crit: notable
    conf: 0.97
    for: [elf, macho, pe]
    if:
      type: metrics
      field: consistency.extension_content_mismatch.binary_as_image
      min: 1
  - id: binary-content-as-document-extension
    desc: Binary content under document extension
    crit: notable
    conf: 0.95
    for: [elf, macho, pe]
    if:
      type: metrics
      field: consistency.extension_content_mismatch.binary_as_document
      min: 1
  - id: binary-content-as-text-extension
    desc: Binary content under text extension
    crit: notable
    conf: 0.9
    for: [elf, macho, pe]
    if:
      type: metrics
      field: consistency.extension_content_mismatch.binary_as_text
      min: 1
  - id: binary-content-as-audio-extension
    desc: Executable content under an audio extension
    crit: notable
    conf: 0.98
    for: [elf, macho, pe]
    if:
      type: metrics
      field: consistency.extension_content_mismatch.binary_as_audio
      min: 1
  - id: binary-content-as-video-extension
    desc: Executable content under a video extension
    crit: notable
    conf: 0.98
    for: [elf, macho, pe]
    if:
      type: metrics
      field: consistency.extension_content_mismatch.binary_as_video
      min: 1
  - id: binary-masquerades-as-source-extension
    desc: Executable disguised as source code
    crit: suspicious
    conf: 0.97
    for: [elf, macho, pe]
    if:
      type: path
      basename: true
      regex: '(?i)\.(c|cc|cpp|cs|go|java|js|jsx|kt|m|mm|py|rb|rs|ts|tsx)$'
    unless:
      # GNU Guile compiled objects conventionally use .go and an ELF-like
      # container whose VM instruction stream is stored in .rtl-text.
      - type: section
        exact: .rtl-text
      # Windows also uses .rs for Rating System resources. These are
      # resource-only PE containers, not executable Rust-source disguises.
      - id: metadata/binary/section/ratio::pe-no-executable-sections
      # A CTF challenge binary is saved under a source name on purpose.
      - id: metadata/package/testing/presence/harness::ctf-challenge-asset-path
      # WiX Toolset internal file identifiers (fil<hash>) in MSI cabinet archives
      - type: path
        basename: true
        regex: '^fil[A-Za-z0-9_.]{16,}$'

composite_rules:
  - id: binary-disguised-as-image-extension
    desc: Executable disguised as an image file
    crit: suspicious
    conf: 0.97
    all:
      - id: objectives/evasion/masquerade/binary/filename::binary-content-as-image-extension
    any:
      - id: metadata/file/magic/identity::elf-header
      - id: metadata/file/magic/identity::macho-32
      - id: metadata/file/magic/identity::macho-64
      - id: metadata/file/magic/identity::cafebabe-magic
      - id: metadata/file/magic/identity::pe-dos-stub
    unless:
      - id: metadata/path/software::grass-gis-module
  # Notable, to the standard the sibling `binary-content-as-playable-extension`
  # states below: same tier as its legs. Both legs are notable
  # `consistency.extension_content_mismatch.*` metrics that already report on
  # their own, so this `any:` was a criticality bump and nothing else -- and
  # the mismatch map is generous about what counts as a document extension.
  # a-shell names its iOS frameworks after the Python module they hold, so
  # `pythonA-lxml.html.diff.framework/pythonA-lxml.html.diff` is a Mach-O
  # whose name ends in `.diff`.
  - id: binary-masquerades-as-document-extension
    desc: Executable disguised as document or text
    crit: notable
    conf: 0.95
    any:
      - id: objectives/evasion/masquerade/binary/filename::binary-content-as-document-extension
      - id: objectives/evasion/masquerade/binary/filename::binary-content-as-text-extension
  # Renamed from `script-masquerades-as-document-extension`: it already
  # matched the image transition as well as the document one, so the id
  # claimed a narrower surface than the rule covered — and it now takes the
  # audio and video transitions too. A `.wav` or `.ico` holding a shell or
  # PowerShell payload is the same masquerade as a `.png` holding one.
  # Notable, to the standard the sibling `binary-content-as-playable-extension`
  # below states for itself: "same tier as its legs". Every leg is a notable
  # `consistency.extension_content_mismatch.*` metric that already reports on
  # its own, so this `any:` adds a criticality bump and nothing else -- and
  # the mismatch map is generous about what counts: a gettext `.pot` template,
  # a `.ott` grammar file (ghc's CoreSyn.ott) and a `main.ico` all landed here.
  - id: binary-content-as-playable-extension
    desc: Executable content under playable extension
    crit: notable
    conf: 0.97
    any:
      - id: objectives/evasion/masquerade/binary/filename::binary-content-as-audio-extension
      - id: objectives/evasion/masquerade/binary/filename::binary-content-as-video-extension
  # Mirrors `binary-disguised-as-image-extension`: the group transition says
  # the extension lies, and the magic-identity leg confirms the bytes really
  # are an executable image rather than something the type guess got wrong.
  - id: binary-disguised-as-playable-extension
    desc: Executable disguised as audio or video
    crit: hostile
    conf: 0.97
    attack: "T1036.008,T1027"
    all:
      - id: objectives/evasion/masquerade/binary/filename::binary-content-as-playable-extension
    any:
      - id: metadata/file/magic/identity::elf-header
      - id: metadata/file/magic/identity::macho-32
      - id: metadata/file/magic/identity::macho-64
      - id: metadata/file/magic/identity::cafebabe-magic
      - id: metadata/file/magic/identity::pe-dos-stub
    unless:
      # A carved child is named for its extraction coordinate, so the
      # "extension" is cleave's, not the author's.
      - id: metadata/binary/layout/embedded::embedded-pe-child
  # An archive wearing a media name: a second stage packed for delivery, past
  # any reviewer who sees an asset and any scanner that skips media.
  # Same tier as its legs: this exists to give one id to "an archive is
  # wearing a media name", not to escalate. The package-scope rules supply the
  # intent, as they do for the font case.
  - id: media-named-file-is-executable
    desc: Padded executable under a media name
    crit: suspicious
    conf: 0.97
    attack: "T1036.008,T1027,T1027.001"
    for: [media]
    all:
      - id: metadata/file/format/media::media-content-is-executable
    unless:
      - id: metadata/file/format/media::media-container-recognized
      - id: metadata/file/format/media::png-signature-missing-cr

