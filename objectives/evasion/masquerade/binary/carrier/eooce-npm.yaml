defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  size_max: 5000000
composite_rules:
  # Running a local executable named npm is a concern, but the individual
  # references do not prove malicious intent or an end-to-end attack chain.
  - id: eooce-proxy-and-detached-local-npm
    desc: eooce proxy clues and detached local npm execution
    crit: suspicious
    conf: 0.95
    all:
      - id: well-known/tool/sysadmin/network::eooce-uuid-vless-proxy-context
      - id: well-known/app/system/nezha::nezha-agent-deployment-code-clues
      - id: micro-behaviors/fs/write/file/npm-masquerade::exec-local-npm-binary
