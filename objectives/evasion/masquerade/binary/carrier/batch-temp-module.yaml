defaults:
  platforms:
    - "windows"
  for:
    - "batch"
composite_rules:
  - 
    id: "batch-renamed-system-tool-module-entry"
    desc: Renamed system tool requests a module entry point
    crit: "hostile"
    conf: 0.96
    all:
      - 
        id: "micro-behaviors/fs/file/copy/source-destination::batch-variable-system-tool-to-temp"
      - 
        id: "micro-behaviors/process/deploy/library::batch-temp-module-entry-call"
      - 
        id: "micro-behaviors/process/interpreter/scripting::delayed-expansion"
  - 
    id: "batch-argument-system-tool-data-call"
    desc: Renamed system tool receives a data-file argument
    crit: "hostile"
    conf: 0.96
    all:
      - 
        id: "micro-behaviors/process/argument/executable::batch-argument-prefix-system-exe"
      - 
        id: "micro-behaviors/fs/file/copy/source-destination::copy-exe-to-temp"
      - 
        id: "micro-behaviors/process/deploy/library::batch-temp-exe-data-argument"
