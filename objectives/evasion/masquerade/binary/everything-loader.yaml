# A verified signature does not make a payload benign. This rule requires the
# full download/decode/memory-execution chain before treating the Everything
# identity as carrier masquerading; ordinary signed Everything releases only
# contribute the neutral identity trait.
defaults:
  platforms: [windows]
  for: [pe]

composite_rules:
  - id: signed-everything-managed-memory-loader
    desc: Everything-branded signed PE contains a managed in-memory loader
    crit: hostile
    conf: 0.99
    attack: "T1036,T1105,T1140,T1620"
    mbc: "B0030,B0032,E1059"
    all:
      - id: well-known/app/utility/everything::verified-everything-setup-identity
      - id: objectives/command-and-control/dropper/staging/memory::dotnet-integer-offset-http-memory-loader
