# A stub loader wearing a vendor's identity and padded to look like a real
# product install.
#
# The shape: a small code section that allocates executable memory and checks
# for a debugger, a version resource copied from a well-known vendor product,
# no signature to back that claim, and hundreds of kilobytes of low-entropy
# resource ballast that inflates the file past scanner size limits. The
# padding is the giveaway — a genuine vendor DLL of that size has code
# proportionate to it, and a genuine loader that small has no reason to weigh
# a megabyte.
#
# Delivery is usually sideloading: the file is dropped next to a signed host
# executable that resolves it by name, so the host's trust carries the load.
defaults:
  platforms: [windows]
  for: [pe, dll]
  attack: T1036.005
  mbc: F0001

composite_rules:
  - id: padded-unsigned-vendor-identity-loader
    desc: Padded unsigned vendor-branded memory loader
    crit: hostile
    conf: 0.94
    all:
      - id: objectives/evasion/masquerade/trust::unsigned-pe-microsoft-version-claim
      - id: objectives/evasion/anti-av/code-padding::low-entropy-resource-ballast
      - id: micro-behaviors/mem/alloc/executable::non-runtime-executable-allocation
    any:
      - id: micro-behaviors/process/debug/detect::is-debugger-present-import
      - id: micro-behaviors/os/env/access::peb-access-x86
      - id: micro-behaviors/process/terminate/kill::terminate-process

  # Same padded, unsigned, vendor-branded image, scored on the identity
  # inconsistency instead of the loader mechanics: the version resource does
  # not even agree with the image kind it is attached to.
  - id: padded-vendor-identity-kind-mismatch
    desc: Padded vendor-branded DLL misstates its identity
    crit: hostile
    conf: 0.93
    all:
      - id: objectives/evasion/masquerade/trust::unsigned-pe-microsoft-version-claim
      - id: objectives/evasion/anti-av/code-padding::low-entropy-resource-ballast
      - id: metadata/binary/anomaly/provenance::pe-dll-version-resource-claims-exe
