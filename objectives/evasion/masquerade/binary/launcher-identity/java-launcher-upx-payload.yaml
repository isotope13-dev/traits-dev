# The genuine Oracle javaw.exe launcher is a few hundred KB with no packed
# section. This file keeps the launcher's code, manifest and version
# resource, then carries a large, high-entropy, writable-and-executable
# UPX1 section after the resources. That is a trojanized launcher or a
# wrapper copying the Java identity to look like a runtime component.
defaults:
  platforms: [windows]
  for: [pe]
  attack: T1036.005,T1027.002
composite_rules:
  - id: oracle-java-launcher-identity-with-rwx-upx1-payload
    desc: Java launcher identity with a large RWX UPX1 payload
    crit: hostile
    conf: 0.92
    all:
      - id: well-known/lib/runtime/managed/jvm::windows-java-launcher
      - id: metadata/build/manifest::pe-oracle-java-manifest-identity
      - id: metadata/binary/section/entropy::large-rwx-upx1-section
      - id: metadata/binary/section/entropy::upx1-high-entropy-payload
    unless:
      - id: metadata/signed/platform/
