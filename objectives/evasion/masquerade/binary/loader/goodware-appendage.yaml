defaults:
  platforms: [windows]
  for: [pe]
  attack: T1036
  mbc: OB0006

traits:
- id: repeated-globalsign-cert-text
  desc: Repeated GlobalSign certificate text
  crit: notable
  conf: 0.9
  count_min: 8
  if:
    type: text
    substr: GlobalSign


- id: adobe-arm-appendage
  desc: Adobe ARM appendage marker
  crit: notable
  conf: 0.97
  if:
    type: text
    exact: AdobeARM.exe

- id: office-msosync-appendage
  desc: Office msosync appendage marker
  crit: notable
  conf: 0.96
  if:
    type: text
    substr: msosync.pdb

composite_rules:
- id: multi-vendor-goodware-appendage
  desc: Multi-vendor goodware appendage
  crit: suspicious
  conf: 0.98
  all:
  - id: metadata/binary/layout/ratio::multiple-pe-embedded
  - id: objectives/evasion/masquerade/binary/loader::repeated-globalsign-cert-text
  - id: metadata/vendor/string::repeated-microsoft-company-name
  any:
  - id: micro-behaviors/process/info/name::java-unpack200-name
  - id: objectives/evasion/masquerade/binary/loader::adobe-arm-appendage
  - id: objectives/evasion/masquerade/binary/loader::office-msosync-appendage
  needs: 2
  unless:
  - id: metadata/binary/installer/script/

- id: modified-signed-goodware-appendage-carrier
  desc: Modified signed goodware appendage carrier
  crit: hostile
  conf: 0.99
  all:
  - id: metadata/binary/layout/ratio::multiple-pe-embedded
  - id: objectives/evasion/masquerade/binary/loader::repeated-globalsign-cert-text
  - id: metadata/vendor/string::repeated-microsoft-company-name
  - id: objectives/anti-static/obfuscation/payload/container::modified-autoit-png-resource-carrier
  - id: metadata/binary/layout/checksum::pe-checksum-mismatch
  any:
  - id: micro-behaviors/process/info/name::java-unpack200-name
  - id: objectives/evasion/masquerade/binary/loader::adobe-arm-appendage
  - id: objectives/evasion/masquerade/binary/loader::office-msosync-appendage
  needs: 2
  unless:
  - id: metadata/binary/installer/script/

- id: modified-microsoft-adobe-updater-carrier
  desc: Modified Microsoft Adobe updater carrier
  crit: hostile
  conf: 0.995
  all:
  - id: metadata/signed/platform::microsoft
  - id: metadata/binary/layout/checksum::certificate-directory-checksum-mismatch
  - id: metadata/binary/layout/overlay::compact-image-with-embedded-pes
  - id: objectives/evasion/masquerade/binary/loader::adobe-arm-appendage
  - id: objectives/evasion/masquerade/brand/wrapper::adobe-acrobat-updater-claim
  any:
  - id: well-known/app/enterprise/microsoft-office-c2r::click2run-build-path
  - id: objectives/privilege-escalation/token-manipulation::token-spawn-api-chain
  - id: micro-behaviors/process/create/sudo::create-process-as-user
  unless:
  - id: metadata/binary/installer/script/

- id: packed-stub-multi-vendor-overlay-camouflage
  desc: Packed stub with multi-vendor overlay camouflage
  crit: suspicious
  conf: 0.92
  all:
  - id: metadata/binary/layout/embedded::embedded-pe-three-plus
  needs: 3
  any:
  - id: well-known/lib/platform/cygwin::cygwin-runtime
  - id: metadata/binary/vendor::adobe-systems-inc-marker
  - id: metadata/vendor/string::oracle-america-string
  - id: metadata/vendor/string::oracle-corporation-string
  unless:
  - id: metadata/signed/platform/
  - id: metadata/binary/installer/family/
