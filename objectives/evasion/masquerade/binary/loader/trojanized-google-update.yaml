defaults:
  platforms: [windows]
  for: [pe]
  attack: T1036.005,T1140

composite_rules:
  - id: objectives/evasion/masquerade/binary/loader::unsigned-google-update-reloc-loader
    desc: Google Update host with reloc loader
    crit: hostile
    conf: 0.995
    all:
      - id: well-known/app/system/google-update::google-update-product
      - id: well-known/app/system/google-update::google-update-setup-description
      - id: metadata/signed/trust-level::unsigned-missing-signature-record
      - id: objectives/anti-static/obfuscation/binary-structure::self-decoding-reloc-overhang-loader

  - id: unsigned-google-update-coff-reloc-infector
    desc: Unsigned Google Update metadata on COFF reloc infector
    crit: hostile
    conf: 0.998
    attack: T1036.005,T1554,T1140
    all:
      - id: well-known/app/system/google-update::google-update-product
      - id: well-known/app/system/google-update::google-update-setup-description
      - id: metadata/signed/trust-level::unsigned-missing-signature-record
      - id: objectives/impact/infect/binary/rewrite::coff-symbol-pointer-20260317-infector-marker
      - id: metadata/binary/section/header::reloc-overhang-dominant
    unless:
      - id: well-known/app/system/google-update::signed-google-update-setup
