defaults:
  platforms: [windows]
  for: [pe]
  attack: T1036.005,T1140

composite_rules:
  # This loader-shaped PE combines Google Update version-resource claims with
  # a high-entropy PE resource, resource extraction APIs, temporary-file and
  # file cleanup APIs, and a service create/configure/start API set. The static
  # imports show available operations, not successful calls; the spoofed
  # unsigned identity and opaque resource provide the hostile context.
  - id: unsigned-google-update-opaque-service-loader
    desc: Unsigned Google Update claim with opaque resource and service API set
    crit: hostile
    conf: 0.90
    attack: "T1036.005,T1027.002,T1543.003"
    all:
      - id: well-known/app/system/google-update::google-update-product
      - id: well-known/app/system/google-update::google-update-setup-description
      - id: metadata/binary/vendor::google-corp-versioninfo
      - id: metadata/signed/trust-level::unsigned-missing-signature-record
      - id: metadata/binary/resource/entropy::large-high-entropy-rsrc-section
      - id: micro-behaviors/data/embedded/payload/resource::find-resource-w
      - id: micro-behaviors/data/embedded/payload/resource::load-resource
      - id: micro-behaviors/data/embedded/payload/resource::sizeof-resource
      - id: micro-behaviors/fs/temp/file::get-temp-file-name
      - id: micro-behaviors/fs/file/open::file-create-win
      - id: micro-behaviors/fs/file/move::move-file
      - id: micro-behaviors/fs/delete/file/library::deletefile-w
      - id: micro-behaviors/os/service/create::create-service-w-import
      - id: micro-behaviors/os/service/start::start-service
      - id: micro-behaviors/os/service/configure::change-service-config
    any:
      - id: micro-behaviors/process/create/spawn::create-process-w
      - id: micro-behaviors/process/create/shellexec::shell-execute

  - id: objectives/evasion/masquerade/binary/loader::unsigned-google-update-reloc-loader
    desc: Google Update host with reloc loader
    crit: hostile
    conf: 0.995
    all:
      - id: well-known/app/system/google-update::google-update-product
      - id: well-known/app/system/google-update::google-update-setup-description
      - id: metadata/signed/trust-level::unsigned-missing-signature-record
      - id: objectives/anti-static/obfuscation/binary-structure::self-decoding-reloc-overhang-loader

  - id: unsigned-google-update-coff-reloc-infector
    desc: Unsigned Google Update metadata on COFF reloc infector
    crit: hostile
    conf: 0.998
    attack: T1036.005,T1554,T1140
    all:
      - id: well-known/app/system/google-update::google-update-product
      - id: well-known/app/system/google-update::google-update-setup-description
      - id: metadata/signed/trust-level::unsigned-missing-signature-record
      - id: objectives/impact/infect/binary/rewrite::coff-symbol-pointer-date-infector-marker
      - id: metadata/binary/section/header::reloc-overhang-dominant
    unless:
      - id: well-known/app/system/google-update::signed-google-update-setup

  - id: objectives/evasion/masquerade/binary/loader::signed-google-update-mingw-overlay-dropper
    desc: Signed Google LLC MinGW PE with concealed overlay
    crit: hostile
    conf: 0.98
    attack: T1553.002,T1036.005,T1027.002
    all:
      - id: metadata/signed/leaf::google-llc
      - id: metadata/signed/certificate/signature::pe-signature-verified-kv
      - id: metadata/lang/compiler/native::mingw-runtime-marker
      - id: metadata/binary/layout/overlay::signed-pe-large-noncertificate-overlay
      - id: metadata/binary/layout/overlay::overlay-dominates-80pct
    any:
      - id: objectives/evasion/masquerade/version-resource/google-chrome::chrome-original-filename-claim
      - id: well-known/app/system/google-update::google-update-setup-x86-description
    unless:
      - id: well-known/app/system/google-update::signed-google-update-setup
