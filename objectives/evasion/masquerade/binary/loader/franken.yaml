defaults:
  for:
    - pe
    - dll
  platforms:
    - windows
  attack: T1036
traits:
  - id: objectives/evasion/masquerade/binary/loader::oracle-java-strings
    desc: Oracle/Java related strings
    crit: notable
    conf: 0.8
    if:
      type: text
      substr: sun.launcher.rmid
      case_insensitive: true
composite_rules:
  - id: objectives/evasion/masquerade/binary/loader::multi-vendor-metadata-mix
    desc: Binary contains metadata from 3+ vendors
    crit: suspicious
    conf: 0.95
    all:
      - id: objectives/evasion/masquerade/version-resource/contradiction::microsoft-adobe-contradiction
      - id: objectives/evasion/masquerade/binary/loader::oracle-java-strings
