defaults:
  platforms: [windows]
  for: [pe]
  attack: T1036.005

traits:
  - id: objectives/evasion/masquerade/binary/loader::sfxmod-green-software-manifest
    desc: 7zSfxMod default Green software manifest
    crit: notable
    conf: 0.97
    if:
      type: value
      path: pe.manifest.assembly_identity.name
      exact: "Green software"

  - id: objectives/evasion/masquerade/binary/loader::1by1-product-name
    desc: 1by1 Directory Player ProductName claim
    crit: notable
    conf: 0.95
    if:
      type: value
      path: pe.version.product_name
      regex: '(?i)1by1\b'

composite_rules:
  - id: objectives/evasion/masquerade/binary/loader::sfxmod-green-software-elevation
    desc: 7zSfxMod admin-requiring Green software stub
    crit: suspicious
    conf: 0.95
    all:
      - id: objectives/evasion/masquerade/binary/loader::sfxmod-green-software-manifest
      - id: metadata/build/manifest::pe-requires-admin

  - id: objectives/evasion/masquerade/binary/loader::sfxmod-1by1-cover-mismatch
    desc: 1by1 VersionInfo with 7zSfxMod manifest cover
    crit: hostile
    conf: 0.98
    all:
      - id: objectives/evasion/masquerade/binary/loader::1by1-product-name
      - id: objectives/evasion/masquerade/binary/loader::sfxmod-green-software-manifest

  - id: objectives/evasion/masquerade/binary/loader::sfxmod-build-2712-elevation-dropper
    desc: 7zSfxMod build-2712 elevation dropper
    crit: hostile
    conf: 0.97
    all:
      - id: metadata/binary/provenance/build::sfxmod-build-2712-banner
      - id: metadata/binary/provenance/build::sfxmod-oleg-scherbakov-banner
      - id: objectives/evasion/masquerade/binary/loader::sfxmod-green-software-manifest
      - id: metadata/build/manifest::pe-requires-admin
      - id: metadata/binary/layout/overlay::7z-sfx-config-marker
      - id: metadata/binary/layout/overlay::7z-sfx-config-end-marker
    unless:
      - id: metadata/signed/platform/
