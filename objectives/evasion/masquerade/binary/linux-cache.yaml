# Linux User-Cache Library Masquerade
# Detects payloads dropped under ~/.cache/ disguised as common system
# libraries (libssh, libssl, libcrypto). Legitimate distributions install
# these libraries to /usr/lib or /lib, never to a user-writable cache dir.
# ATT&CK: T1036.005 (Masquerading: Match Legitimate Name or Location)
defaults:
  platforms: [linux]
  for: [go, elf]
  attack: T1036.005
  mbc: F0004
traits:
  - id: font-cache-executable-path
    desc: Executable uses font cache data path
    crit: suspicious
    conf: 0.98
    for: [source, binaries]
    if:
      type: text
      substr: .cache/fontconfig/fc-cache
  - id: hidden-gvfs-executable-path
    desc: Executable uses hidden GVFS data path
    crit: suspicious
    conf: 0.98
    for: [source, binaries]
    if:
      type: text
      substr: .local/share/.gvfsd/gvfsd-user
  - id: temporary-font-cache-executable
    desc: fc-cache executes from randomized temp directory
    crit: suspicious
    conf: 0.98
    for: [source, binaries]
    if:
      type: text
      regex: '/tmp/\.fc-[0-9A-Fa-f]{8}/fc-cache'
  - id: temporary-chronyd-executable
    desc: chronyd executes from randomized temp directory
    crit: suspicious
    conf: 0.98
    for: [source, binaries]
    if:
      type: text
      regex: '/tmp/\.chrony-[0-9A-Fa-f]{8}/chronyd'
  - id: masquerade-libssh
    desc: Masquerade as libssh in cache
    crit: suspicious
    conf: 0.85
    if:
      type: text
      substr: .cache/libssh
  - id: masquerade-libssl
    desc: Masquerade as libssl in cache
    crit: suspicious
    conf: 0.85
    if:
      type: text
      substr: .cache/libssl
  - id: masquerade-libcrypto
    desc: Masquerade as libcrypto in cache
    crit: suspicious
    conf: 0.85
    if:
      type: text
      substr: .cache/libcrypto
composite_rules:
  - id: user-cache-system-daemon-path
    desc: Daemon impostor in writable cache path
    crit: suspicious
    conf: 0.98
    for: [source, binaries]
    any:
      - id: font-cache-executable-path
      - id: hidden-gvfs-executable-path
      - id: temporary-font-cache-executable
      - id: temporary-chronyd-executable
  - id: masquerade-lib
    desc: Masquerade as system library
    crit: suspicious
    conf: 0.85
    any:
      - id: masquerade-libssh
      - id: masquerade-libssl
      - id: masquerade-libcrypto
