# A filename mismatch is neutral metadata; this composite adds attack-specific
# payload concealment signals before inferring masquerade.
defaults:
  for: [pe]
  platforms: [windows]
  attack: T1036.005,T1027.009

composite_rules:
  - id: renamed-capi-manual-pe-loader
    desc: Renamed DLL decrypts and manual-maps PE payload
    crit: hostile
    conf: 0.99
    attack: T1036.005,T1140,T1620
    for: [dll]
    all:
      - id: metadata/binary/anomaly/provenance::pe-basename-differs-from-original-filename
      - id: objectives/command-and-control/dropper/staging/encrypted::capi-hash-decrypt-manual-pe-loader
    unless:
      - id: metadata/signed/platform/
      - id: well-known/app/
      - id: well-known/lib/
      - id: well-known/tool/

  - id: unsigned-renamed-dotnet-reflective-resource-payload
    desc: Unsigned renamed .NET reflective resource payload
    crit: hostile
    conf: 0.97
    attack: T1036.005,T1027.009,T1620
    all:
      - id: objectives/anti-static/obfuscation/payload/resource::dotnet-obfuscated-reflective-resource-payload
      - id: metadata/binary/anomaly/provenance::pe-basename-differs-from-original-filename
      - id: metadata/binary/layout::pe-no-signature-record
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/installer/family/
      - id: well-known/app/
      - id: well-known/lib/
      - id: well-known/tool/

  - id: unsigned-renamed-rc2-resource-loader
    desc: Unsigned renamed .NET RC2 resource loader
    crit: hostile
    conf: 0.99
    attack: "T1036.005,T1027.009,T1140,T1620"
    all:
      - id: metadata/binary/framework::dotnet-assembly
      - id: metadata/binary/layout::pe-no-signature-record
      - id: metadata/binary/anomaly/provenance::pe-basename-differs-from-original-filename
      - id: objectives/anti-static/obfuscation/payload/resource::dotnet-rc2-resource-write-cluster
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/installer/family/
      - id: well-known/app/
      - id: well-known/app/system/quno::quno-benign-resource-game
      - id: well-known/lib/
      - id: well-known/tool/

  - id: renamed-opaque-native-payload
    desc: Renamed opaque native payload with API concealment
    crit: hostile
    conf: 0.95
    all:
      - id: metadata/binary/anomaly/provenance::pe-basename-differs-from-original-filename
      - id: objectives/anti-static/obfuscation/payload/section::large-high-entropy-gfx-section
      - id: objectives/anti-static/obfuscation/imports::opaque-payload-api-concealment
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/installer/family/
  - id: renamed-opaque-overlay-child-launcher
    desc: Renamed PE with opaque child launcher
    crit: hostile
    conf: 0.97
    attack: T1036.005,T1027.009,T1106
    all:
      - id: metadata/binary/anomaly/provenance::pe-basename-differs-from-original-filename
      - id: metadata/binary/layout::large-high-entropy-overlay
      - id: metadata/binary/layout::pe-no-signature-record
      - id: micro-behaviors/fs/enumerate/directory::find-file-walker-wide
      - id: micro-behaviors/process/create/spawn::create-process-w
      - id: micro-behaviors/dylib/load/runtime::load-library-w
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/installer/family/
      - id: metadata/binary/framework::dotnet-singlefilehost-runtime
      - id: metadata/binary/framework::dotnet-selfcontained-bundle
      - id: well-known/tool/reverse-engineering/
      - id: well-known/tool/offensive/zaproxy::zed-attack-proxy-pe
      - id: well-known/app/utility/ccleaner::ccleaner-offline-installer
      - id: well-known/app/system/miktex::miktex-setup-wizard
  - id: unsigned-microsoft-branded-rwx-loader
    desc: Unsigned Microsoft-branded PE with custom RWX loader section
    crit: hostile
    conf: 0.99
    all:
      - id: metadata/binary/anomaly/provenance::pe-basename-differs-from-original-filename
      - id: metadata/binary/vendor::microsoft-corp-marker
      - id: metadata/signed/trust-level::unsigned
      - id: metadata/hardening/memory::wx-section
    any:
      - id: metadata/binary/section/metrics::pe-nonstandard-entry
      - id: metadata/binary/section/metrics::multiple-nonstandard-section-names
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/installer/family/

  # A renamed unsigned PE with a zero checksum and embedded-PE/XOR loader
  # markers is an attack-shaped identity wrapper. The gates avoid turning
  # ordinary renamed releases or static native utilities into masquerades.
  - id: unsigned-renamed-native-loader-masquerade
    desc: Unsigned renamed native PE with concealed loader markers
    crit: hostile
    conf: 0.97
    attack: T1036.005,T1027.009,T1620
    all:
      - id: metadata/binary/anomaly/provenance::pe-basename-differs-from-original-filename
      - id: metadata/binary/layout::pe-no-signature-record
      - id: metadata/binary/layout::pe-checksum-zeroed
      - id: metadata/binary/resource::pe-single-version-resource
      - id: micro-behaviors/data/embedded/payload/header::inline-pe-header-walk
    any:
      - id: micro-behaviors/crypto/symmetric/xor/loop::x64-xor-imm8-widen-loop
      - id: micro-behaviors/mem/protect/modify::virtualprotect-executable-resolved-x64
      - id: micro-behaviors/mem/protect/modify::virtualprotect-executable-read-register-x64
    needs: 1
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/installer/family/
      - id: well-known/app/
      - id: well-known/lib/
      - id: metadata/library/qt/
      - id: well-known/tool/

  # A certificate table is only an identity claim, not proof of trustworthy
  # provenance. This catches renamed, post-link-modified PEs that combine
  # that claim with unusual sections and runtime anti-analysis behavior;
  # known software families remain excluded to avoid penalizing their builds.
  - id: renamed-pe-evasive-layout-cluster
    desc: Renamed PE with certificate, layout, and anti-debug anomalies
    crit: hostile
    conf: 0.97
    attack: T1036.005,T1622
    all:
      - id: metadata/binary/anomaly/provenance::pe-basename-differs-from-original-filename
      - id: metadata/binary/layout::cert-table-present
      - id: metadata/binary/layout::pe-checksum-mismatch
      - id: metadata/binary/section/metrics::multiple-nonstandard-section-names
      - id: micro-behaviors/process/debug/detect::is-debugger-present-import
      - id: micro-behaviors/mem/protect/modify::virtual-protect
    unless:
      - id: metadata/binary/installer/family/
      - id: well-known/app/
      - id: well-known/lib/
      - id: well-known/tool/reverse-engineering/
