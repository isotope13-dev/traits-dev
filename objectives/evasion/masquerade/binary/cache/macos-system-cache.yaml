# macOS System Cache Path Masquerade
# Detects dropping malicious files disguised as Apple system cache entries,
# fake LaunchAgent/LaunchDaemon plists with com.apple.* names, and hidden
# /private/tmp payloads using Apple-style naming conventions.
# ATT&CK: T1036.005 (Masquerading: Match Legitimate Name or Location)
defaults:
  platforms:
    - macos
  for: [scripts, binaries]
  attack: T1036.005
  mbc: F0004
traits:
  - id: objectives/evasion/masquerade/binary/cache::launchagents-fake-apple
    desc: Fake Apple name in LaunchAgents/Daemons path
    crit: suspicious
    conf: 0.9
    if:
      type: text
      regex: (LaunchAgents|LaunchDaemons)/com\.apple\.[a-z][a-z0-9.-]{2,40}\.plist
    not:
      - regex: com\.apple\.(SoftwareUpdate|metadata|InstallAssistant|installer)
      - regex: com\.apple\.(Safari|appstore|commerce|dt\.)
      # Apple ships protected launch agents under /System/Library; that is
      # an existing system path, not a user-writable masquerade location.
      - regex: /System/Library/Launch(Agents|Daemons)/com\.apple\.
      - exact: LaunchDaemons/com.apple.postfixsetup.plist
      - exact: LaunchDaemons/com.apple.smbd.plist
      - substr: com.apple.smb.preferences
    unless:
      - id: metadata/file/naming::generated-attack-map-context
      - id: metadata/signed/platform::apple
      - id: metadata/binary/vendor/
      - type: text
        regex: /System/Library/Launch(Agents|Daemons)/
  - id: objectives/evasion/masquerade/binary/cache::app-support-hidden-apple
    desc: Hidden Application Support Apple path
    crit: suspicious
    conf: 0.9
    if:
      type: text
      regex: /Application Support/\.com\.apple\.[a-z][a-z0-9.-]{2,40}
    unless:
      - id: metadata/signed/platform::apple
      - id: metadata/binary/vendor/
  - id: objectives/evasion/masquerade/binary/cache::app-support-google-update
    desc: GoogleUpdate in Application Support
    crit: suspicious
    conf: 0.9
    for: [scripts, binaries, plist]
    if:
      type: text
      substr: /Application Support/Google/GoogleUpdate.app/
    unless:
      - id: metadata/signed/platform::apple
      - id: metadata/binary/vendor/
  - id: objectives/evasion/masquerade/binary/cache::private-tmp-hidden-apple
    desc: Hidden /private/tmp path with Apple-style name
    crit: suspicious
    conf: 0.88
    if:
      type: text
      regex: /private/tmp/\.[a-z][a-z0-9]{3,8}(\.scpt|\.plist|\.dylib|\.app)?
    not:
      # AppImage/FUSE mount points use a `.mount_<random>` prefix under
      # /tmp (and thus /private/tmp on macOS) -- a cross-platform packaging
      # convention, not an Apple-style masquerade name. The trailing "_"
      # falls outside the [a-z0-9] class above, so the captured evidence
      # is truncated to "/private/tmp/.mount".
      - substr: /private/tmp/.mount
    unless:
      - id: metadata/signed/platform::apple
      - id: metadata/binary/vendor/
  - id: objectives/evasion/masquerade/binary/cache::launchd-user-library-apple-service-path
    desc: Launchd uses user-writable Apple service path
    crit: suspicious
    conf: 0.97
    for: [plist]
    if:
      type: value
      path: ProgramArguments[0]
      regex: '^/Users/[^/]{1,80}/Library/com\.apple\.[a-z0-9.-]{2,60}/[^/]{1,120}$'
  - id: objectives/evasion/masquerade/binary/cache::applescript-curl-chmod-zsh
    desc: AppleScript curl download chmod zsh launch
    crit: suspicious
    conf: 0.9
    attack: T1059.002
    if:
      type: text
      regex: do shell script.{0,200}curl.{0,200}chmod.{0,200}zsh
    unless:
      - id: metadata/signed/platform::apple
      - id: metadata/binary/vendor/
  # A user Application Support folder named after a bundled macOS utility
  # (~/Library/Application Support/diskutility). Apple's own tools keep no
  # state there under those names; a script that creates one is borrowing a
  # system tool's name for its staging directory.
  - id: objectives/evasion/masquerade/binary/cache::app-support-apple-utility-name
    desc: Apple utility name as Application Support dir
    crit: suspicious
    conf: 0.85
    for: [scripts]
    if:
      type: text
      regex: '(?i)Application Support/(diskutility|softwareupdate|keychainaccess|activitymonitor)\b'
    unless:
      - id: metadata/signed/platform::apple
composite_rules:
  - id: objectives/evasion/masquerade/binary/cache::apple-cache-write
    desc: Writes to an Apple-named macOS cache path
    crit: suspicious
    conf: 0.85
    all:
      - id: micro-behaviors/fs/write/file/
    any:
      - id: micro-behaviors/fs/path/cache::apple-named-system-library-cache-path
      - id: micro-behaviors/fs/path/cache::apple-named-user-library-cache-path
    unless:
      - id: metadata/file/format/structured::serialized-news-article-catalog
      - id: well-known/lib/ai/onnxruntime::onnxruntime-dylib-filename
      # Browser engines and Electron runtimes legitimately interact with
      # Apple media/cache services; keep the suppressor grouped by runtime.
      - id: well-known/lib/runtime/scripted/electron/
      - id: metadata/signed/platform::apple
      - id: well-known/app/utility/macos-cleaners::macos-cleaner-app
      - id: well-known/app/utility/macos-cleaners::deepcleanmac-developer-id-signed-app
      - id: well-known/tool/development/toolchain/darling/
      - id: well-known/lib/runtime/scripted/php-runtime::runtime-library-cache-exception
      - id: well-known/lib/media/ffmpeg::ffmpeg-lib-marker
  - id: objectives/evasion/masquerade/binary/cache::fake-apple-cache-drop
    desc: Fake Apple cache path file drop
    crit: suspicious
    conf: 0.85
    any:
      - id: objectives/evasion/masquerade/binary/cache::apple-cache-write
      - id: objectives/evasion/masquerade/binary/cache::launchagents-fake-apple
    unless:
      - id: well-known/app/media/mastergo::mastergo-application-context
  - id: objectives/evasion/masquerade/binary/cache::macos-payload-staging
    desc: Hidden tmp drop or fake Apple system path
    crit: suspicious
    conf: 0.88
    any:
      - id: objectives/evasion/masquerade/binary/cache::apple-cache-write
      - id: objectives/evasion/masquerade/binary/cache::launchagents-fake-apple
      - id: objectives/evasion/masquerade/binary/cache::app-support-hidden-apple
      - id: objectives/evasion/masquerade/binary/cache::app-support-google-update
      - id: objectives/evasion/masquerade/binary/cache::private-tmp-hidden-apple
  - id: objectives/evasion/masquerade/binary/cache::fake-apple-appsupport-helper
    desc: Fake Apple Application Support helper
    crit: hostile
    conf: 0.96
    all:
      - id: objectives/evasion/masquerade/binary/cache::app-support-hidden-apple
      - id: objectives/evasion/masquerade/identity/service::apple-helper-namespace
    unless:
      - id: well-known/tool/development/mobile/pymobiledevice3
  - id: objectives/evasion/masquerade/binary/cache::fake-apple-launchd-runatload
    desc: Fake Apple launchd job runs at load
    crit: hostile
    conf: 0.96
    attack: T1543.004
    near_lines: 40
    all:
      - id: objectives/evasion/masquerade/binary/cache::launchagents-fake-apple
      - id: micro-behaviors/os/service/launchagent::source-runatload-key
  - id: objectives/evasion/masquerade/binary/cache::applescript-library-cache-drop-chain
    desc: AppleScript curl drop to fake Apple cache path
    crit: hostile
    conf: 0.97
    attack: T1059.002
    all:
      - id: objectives/evasion/masquerade/binary/cache::applescript-curl-chmod-zsh
      - id: objectives/evasion/masquerade/binary/cache::apple-cache-write
  - id: objectives/evasion/masquerade/binary/cache::applescript-drop-and-erase
    for: [macho]
    desc: AppleScript payload drop then self-delete
    crit: hostile
    conf: 0.95
    attack: T1070.004
    all:
      - id: objectives/evasion/masquerade/binary/cache::applescript-curl-chmod-zsh
      - id: micro-behaviors/process/create/script/osascript::do-shell-rm-binary
