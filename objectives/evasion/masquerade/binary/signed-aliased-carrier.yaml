defaults:
  crit: hostile
  platforms: [windows]
  for: [pe]
  attack: T1036,T1027

# A valid signature does not make a binary benign when its signed image has a
# zeroed DOS stub, hundreds of aliased exports, and a high-entropy overlay.
# This is a structural signed-carrier pattern, not a signer-name allowlist.
composite_rules:
  - id: signed-aliased-high-entropy-carrier
    desc: Signed PE with aliased exports and opaque payload
    conf: 0.98
    all:
      - id: metadata/signed/certificate/identity::pe-signature-verified-kv
      - id: metadata/binary/header/malformed::pe-dos-stub-zeroed
      - id: metadata/binary/header/characteristics::many-aliased-exports
      - id: objectives/anti-static/obfuscation/binary-metrics/shape::high-entropy-overlay-raw
      - id: micro-behaviors/os/api-resolution/hash-based::multiplicative-hash-loop
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/framework/
      - id: metadata/binary/installer/

  - id: cert-table-aliased-amsi-payload
    desc: PE certificate table with aliased anti-analysis payload
    conf: 0.99
    attack: T1027,T1027.007,T1562.001
    all:
      - id: metadata/binary/layout/checksum::cert-table-present
      - id: metadata/binary/header/characteristics::many-aliased-exports
      - id: metadata/binary/section/entropy::large-high-entropy-writable-data-section
      - id: micro-behaviors/os/api-resolution/hash-based::multiplicative-hash-loop
      - id: objectives/evasion/anti-av/platform/defender::amsi-memory-patch-hex-bytes
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/framework/
      - id: metadata/binary/installer/

  # A signed PE whose VERSIONINFO basename is contradicted by the file name,
  # while the image also carries an opaque writable section and resolves APIs
  # by hash, is a masqueraded signed carrier even when alias-count extraction
  # is unavailable.
  - id: signed-renamed-writable-api-carrier
    desc: Signed renamed PE with opaque writable API-resolved payload
    conf: 0.98
    attack: T1027.007,T1036.005,T1553.002
    all:
      - id: metadata/signed/certificate/identity::pe-signature-verified-kv
      - id: metadata/binary/provenance/version-info::pe-non-architecture-filename-mismatch
      - id: metadata/binary/section/entropy::large-high-entropy-writable-data-section
      - id: micro-behaviors/os/api-resolution/hash-based::multiplicative-hash-loop
      - id: metadata/binary/symbols/count::many-exports
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/framework/
      - id: metadata/binary/installer/

  - id: signed-renamed-peb-wx-loader
    desc: Signed renamed PE with concealed W^X loader
    conf: 0.98
    attack: T1036.005,T1027.007,T1055,T1620
    all:
      - id: metadata/binary/provenance/version-info::pe-basename-differs-from-original-filename
      - id: metadata/signed/certificate/identity::pe-cert-leaf-self-issued
      - id: objectives/evasion/process/injection/shellcode::peb-hash-wx-current-process-loader-x64
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/framework/
      - id: metadata/binary/installer/
