defaults:
  platforms: [windows]
  for: [pe]

composite_rules:
  - id: dotnet-template-future-process-launcher
    desc: Future-dated template-named .NET process launcher
    crit: hostile
    conf: 0.97
    attack: T1036.005,T1106
    mbc: F0004
    all:
      - id: metadata/binary/framework::dotnet-assembly
      - id: metadata/build/manifest::pe-manifest-myapplication-template
      - id: metadata/binary/anomaly/provenance::pe-far-future-timestamp
      - id: micro-behaviors/process/create/launch::create-process-api-name
    unless:
      - id: metadata/signed/platform/
      - id: well-known/tool/development/dotrush::dotrush-debug-host

  - id: dotnet-reflected-api-masquerade
    desc: Masqueraded .NET API resolver with template identity
    crit: hostile
    conf: 0.98
    attack: T1036.005,T1027.007
    mbc: B0032
    all:
      - id: objectives/anti-static/obfuscation/imports::dotnet-reflected-api-resolver
      - id: metadata/build/manifest::pe-manifest-myapplication-template
      - id: metadata/binary/anomaly/provenance::pe-basename-differs-from-original-filename
      - id: metadata/package/versioning::pe-version-resource
    unless:
      - id: metadata/signed/platform/

  - id: dotnet-template-encoded-network-loader
    desc: .NET template identity with encoded network loader
    crit: hostile
    conf: 0.97
    attack: "T1036.005,T1105,T1140"
    all:
      - id: metadata/binary/framework::dotnet-metadata
      - id: metadata/build/manifest::pe-manifest-myapplication-template
      - id: micro-behaviors/communications/http/client/managed::downloadstring
      - id: micro-behaviors/data/decode/base64::dotnet-frombase64string-text
    any:
      - id: micro-behaviors/data/compress/library::gzipstream-dotnet
      - id: micro-behaviors/os/syscall/raw::nt-protect-ssn
    needs: 1
    unless:
      - id: metadata/signed/platform/

  - id: dotnet-template-reflection-masquerade
    desc: Renamed .NET template with explicit resource payload loading
    crit: hostile
    conf: 0.96
    attack: "T1036.005,T1027.009,T1620"
    all:
      - id: metadata/build/manifest::pe-manifest-myapplication-template
      - id: metadata/package/versioning::pe-version-resource
      - id: metadata/binary/anomaly/provenance::pe-basename-differs-from-original-filename
      - id: metadata/binary/framework::dotnet-assembly
      - id: metadata/binary/resource::clr-resource-large
      - id: micro-behaviors/process/interpreter/reflection/runtime::methodbase-class
      - id: micro-behaviors/data/embedded/payload/resource::dotnet-managed-resource-access
    any:
      - id: objectives/anti-static/obfuscation/reflection/invoke::dotnet-assembly-load-invoke
      - id: micro-behaviors/data/decode/base64::dotnet-frombase64string-text
      - id: micro-behaviors/crypto/symmetric/decrypt::dotnet-create-decryptor
      - id: micro-behaviors/process/create/launch::create-process-api-name
      - id: micro-behaviors/communications/http/client/managed::downloadstring
    needs: 1
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/installer/family/
      - id: well-known/app/system/black-lightning::black-lightning-identity-context

  - id: dotnet-template-extension-reflection-masquerade
    desc: Unsigned .NET resource loader disguised with a non-PE extension
    crit: hostile
    conf: 0.99
    attack: T1036.005,T1027.009,T1620
    mbc: F0004
    all:
      - id: metadata/binary/framework::dotnet-assembly
      - id: metadata/build/manifest::pe-manifest-myapplication-template
      - id: metadata/package/versioning::pe-version-resource
      - id: metadata/binary/anomaly/provenance::pe-non-architecture-filename-mismatch
      - id: objectives/evasion/masquerade/extension-mismatch::binary-content-as-document-extension
      - id: metadata/binary/layout::pe-no-signature-record
      - id: metadata/binary/resource::clr-resource-large
      - id: micro-behaviors/data/embedded/payload/resource::dotnet-managed-resource-access
      - id: micro-behaviors/process/interpreter/reflection/runtime::activator
      - id: micro-behaviors/process/interpreter/reflection/runtime::invoke-member-token
      - id: objectives/anti-static/obfuscation/reflection/invoke::get-exported-types-token
    unless:
      - id: metadata/binary/installer/family/

  # Bitmap-backed .NET crypters often retain the Visual Studio manifest while
  # changing the on-disk name. This is the LockBits form: the pixel-readback
  # and reflected-instantiation legs identify staged code, while the template
  # manifest and renamed PE identify the delivery masquerade.
  - id: dotnet-template-bitmap-reflective-loader
    desc: Renamed .NET template reflectively stages a bitmap payload
    crit: hostile
    conf: 0.99
    attack: "T1036.005,T1027.003,T1620"
    mbc: "B0032.001,E1059"
    all:
      - id: metadata/binary/framework::dotnet-assembly
      - id: metadata/build/manifest::pe-manifest-myapplication-template
      - id: metadata/binary/anomaly/provenance::pe-non-architecture-filename-mismatch
      - id: metadata/binary/layout::pe-no-signature-record
      - id: metadata/binary/resource::clr-resource-large
      - id: metadata/package/versioning::pe-version-resource
      - id: micro-behaviors/data/embedded/payload/image::dotnet-resource-bitmap-pixel-readback
      - id: micro-behaviors/process/interpreter/reflection/runtime::activator
      - id: micro-behaviors/process/interpreter/reflection/runtime::create-instance-token
      - id: objectives/anti-static/obfuscation/reflection/invoke::get-exported-types-token
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/installer/family/

  - id: iso-payment-dotnet-resource-masquerade
    desc: ISO payment lure carries a templated .NET resource loader
    crit: hostile
    conf: 0.98
    attack: T1036.005,T1027.009,T1140,T1204.002
    all:
      - id: metadata/file/format/structured::primary-volume-descriptor
      - id: objectives/execution/lure/document::iso-payment-executable-member
      - id: metadata/file/format/managed-runtime::embedded-dotnet-template-manifest
      - id: metadata/file/format/managed-runtime::embedded-dotnet-resource-loader
