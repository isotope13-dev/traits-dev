defaults:
  platforms: [windows]
  for: [pe]

composite_rules:
  - id: dotnet-template-resource-application-context
    desc: Recognized .NET template resource application
    crit: exception
    conf: 0.99
    any:
      - id: well-known/app/productivity/thebrain::thebrain-known-app-context
      - id: well-known/game/pkhex::pkhex-save-editor

  # The premise of every rule below is that the binary kept the *stock* Visual
  # Basic application manifest instead of presenting an identity of its own, so
  # the question each one really asks is whether this assembly has an identity.
  # A VERSIONINFO block naming a product and its version is that identity: the
  # template manifest is then a build artifact, not a masquerade.
  #
  # Every leg of those composites is a token in the .NET #Strings metadata heap
  # -- `WriteAllBytes`, `MethodBase`, `CreateDecryptor`, `GetManifestResourceStream`
  # are present because the assembly *references* the API, not because it calls
  # it on a payload -- so a large WinForms application satisfies all of them for
  # free and only the identity question separates it from a crypter stub.
  # Observed: mRemoteNG, Bug Shooting, TerminalWorks CLScan, EZBlocker,
  # IphoneCarrierChecker and a tarot-card hobby app all convicted this way.
  #
  # Requiring the *complete* vendor block (company plus a Visual Studio PDB) was
  # too strict to do that job: small published software routinely ships neither
  # -- Bug Shooting and IphoneCarrierChecker carry no CompanyName at all, and
  # EZBlocker's is a bare URL. A crypter stub, by contrast, either carries no
  # VERSIONINFO or forges a Microsoft one, which
  # metadata/binary/vendor::microsoft-prefixed-company already covers.
  - id: dotnet-template-product-identity-context
    desc: Template manifest on identified product build
    crit: exception
    conf: 0.95
    all:
      - id: metadata/package/versioning::pe-version-product-name-value
      - id: metadata/package/versioning::pe-version-file-version-value

  - id: dotnet-template-embedded-resource-write-launcher
    desc: Template-named .NET embedded-resource process stager
    crit: hostile
    conf: 0.98
    attack: T1027.009,T1106,T1059
    mbc: B0009
    all:
      - id: metadata/binary/framework::dotnet-assembly
      - id: metadata/build/manifest::pe-manifest-myapplication-template
      - id: micro-behaviors/data/embedded/payload/resource::dotnet-managed-resource-access
      - id: micro-behaviors/process/create/spawn::process-token-dotnet
      - id: micro-behaviors/fs/write/file/direct::dotnet-writeallbytes-token
    any:
      - id: micro-behaviors/process/create/spawn::use-shell-execute-property
      - id: micro-behaviors/process/create/shellexec::shell-execute-call
    unless:
      - id: metadata/signed/platform/
      - id: dotnet-template-resource-application-context
      - id: dotnet-template-product-identity-context

  - id: dotnet-template-scheduled-task-stager
    desc: Template-named .NET loader creates an unlimited scheduled task
    crit: hostile
    conf: 0.98
    attack: T1036.005,T1053.005,T1106
    mbc: F0012
    all:
      - id: metadata/build/manifest::pe-manifest-myapplication-template
      - id: micro-behaviors/process/create/spawn::process-token-dotnet
      - id: micro-behaviors/os/autorun/scheduled::schtasks-create-cmd
      - id: micro-behaviors/os/autorun/scheduled-task-xml::scheduled-task-unlimited-runtime-xml
    any:
      - id: micro-behaviors/data/embedded/payload/resource::dotnet-managed-resource-access
      - id: micro-behaviors/fs/write/file/direct::dotnet-writeallbytes-token
      - id: micro-behaviors/process/create/spawn::use-shell-execute-property
    unless:
      - id: metadata/signed/platform/
      - id: dotnet-template-product-identity-context

  # Default VS MyApplication identity plus a far-future COFF stamp and
  # Reactor, with AES/native-delegate/Reflection.Emit staging legs, is a
  # packed .NET crypter shell rather than a finished product identity.
  - id: dotnet-template-reactor-future-crypter
    desc: Future-dated template .NET Reactor crypter
    crit: hostile
    conf: 0.98
    attack: T1036.005,T1027.009,T1027.007
    mbc: F0004,B0009
    all:
      - id: metadata/binary/framework::dotnet-assembly
      - id: metadata/build/manifest::pe-manifest-myapplication-template
      - id: metadata/binary/anomaly/provenance::pe-far-future-timestamp
      - id: objectives/anti-static/obfuscation/obfuscator/managed::dotnet-reactor-obfuscator
      - id: metadata/binary/layout::pe-no-signature-record
    any:
      - id: micro-behaviors/os/api-resolution/dynamic::managed-function-pointer-delegate
      - id: metadata/lang/compiler/managed::reflection-emit
      - id: micro-behaviors/crypto/symmetric/decrypt::dotnet-create-decryptor
      - id: micro-behaviors/data/decode/base64::dotnet-frombase64string-text
    needs: 2
    unless:
      - id: metadata/signed/platform/
      - id: well-known/tool/development/dotrush::dotrush-debug-host

  - id: dotnet-reflected-api-masquerade
    desc: Masqueraded .NET API resolver with template identity
    crit: hostile
    conf: 0.98
    attack: T1036.005,T1027.007
    mbc: B0032
    all:
      - id: objectives/anti-static/obfuscation/imports::dotnet-reflected-api-resolver
      - id: metadata/build/manifest::pe-manifest-myapplication-template
      - id: metadata/binary/anomaly/provenance::pe-basename-differs-from-original-filename
      - id: metadata/package/versioning::pe-version-resource
    unless:
      - id: metadata/signed/platform/

  - id: dotnet-template-encoded-network-loader
    desc: Template-named .NET encoded download-to-file stager
    crit: hostile
    conf: 0.97
    attack: "T1036.005,T1105,T1140"
    all:
      - id: metadata/binary/framework::dotnet-metadata
      - id: metadata/build/manifest::pe-manifest-myapplication-template
      # This component requires download, Base64 decode, GZip, and file-write
      # tokens to cluster in one small stager. Requiring the complete chain
      # avoids combining unrelated helpers from large merged .NET binaries.
      - id: objectives/command-and-control/dropper/delivery/download-execute::dotnet-encoded-stage-write-cluster
    unless:
      - id: metadata/signed/platform/

  - id: dotnet-template-reflection-masquerade
    desc: Renamed .NET template with explicit resource payload loading
    crit: hostile
    conf: 0.96
    attack: "T1036.005,T1027.009,T1620"
    all:
      - id: metadata/build/manifest::pe-manifest-myapplication-template
      - id: metadata/package/versioning::pe-version-resource
      - id: metadata/binary/anomaly/provenance::pe-basename-differs-from-original-filename
      - id: metadata/binary/framework::dotnet-assembly
      - id: metadata/binary/resource::clr-resource-large
      - id: micro-behaviors/process/interpreter/reflection/runtime::methodbase-class
      - id: micro-behaviors/data/embedded/payload/resource::dotnet-managed-resource-access
    any:
      - id: objectives/anti-static/obfuscation/reflection/invoke::dotnet-assembly-load-invoke
      - id: micro-behaviors/data/decode/base64::dotnet-frombase64string-text
      - id: micro-behaviors/crypto/symmetric/decrypt::dotnet-create-decryptor
      - id: micro-behaviors/process/create/launch::create-process-api-name
      - id: micro-behaviors/communications/http/client/managed::downloadstring
    needs: 1
    unless:
      # Every leg above is a .NET #Strings metadata token, which a large
      # managed application satisfies by referencing the API at all. An
      # assembly naming a product and version has the identity these
      # composites assume is absent.
      - id: objectives/evasion/masquerade/binary::dotnet-template-product-identity-context
      - id: metadata/signed/platform/
      - id: metadata/binary/installer/family/
      - id: well-known/app/system/black-lightning::black-lightning-identity-context

  - id: dotnet-template-extension-reflection-masquerade
    desc: Unsigned .NET resource loader disguised with a non-PE extension
    crit: hostile
    conf: 0.99
    attack: T1036.005,T1027.009,T1620
    mbc: F0004
    all:
      - id: metadata/binary/framework::dotnet-assembly
      - id: metadata/build/manifest::pe-manifest-myapplication-template
      - id: metadata/package/versioning::pe-version-resource
      - id: metadata/binary/anomaly/provenance::pe-non-architecture-filename-mismatch
      - id: objectives/evasion/masquerade/extension-mismatch::binary-content-as-document-extension
      - id: metadata/binary/layout::pe-no-signature-record
      - id: metadata/binary/resource::clr-resource-large
      - id: micro-behaviors/data/embedded/payload/resource::dotnet-managed-resource-access
      - id: micro-behaviors/process/interpreter/reflection/runtime::activator
      - id: micro-behaviors/process/interpreter/reflection/runtime::invoke-member-token
      - id: objectives/anti-static/obfuscation/reflection/invoke::get-exported-types-token
    unless:
      - id: metadata/binary/installer/family/

  # Bitmap-backed .NET crypters often retain the Visual Studio manifest while
  # changing the on-disk name. This is the LockBits form: the pixel-readback
  # and reflected-instantiation legs identify staged code, while the template
  # manifest and renamed PE identify the delivery masquerade.
  - id: dotnet-template-bitmap-reflective-loader
    desc: Renamed .NET template reflectively stages a bitmap payload
    crit: hostile
    conf: 0.99
    attack: "T1036.005,T1027.003,T1620"
    mbc: "B0032.001,E1059"
    all:
      - id: metadata/binary/framework::dotnet-assembly
      - id: metadata/build/manifest::pe-manifest-myapplication-template
      - id: metadata/binary/anomaly/provenance::pe-non-architecture-filename-mismatch
      - id: metadata/binary/layout::pe-no-signature-record
      - id: metadata/binary/resource::clr-resource-large
      - id: metadata/package/versioning::pe-version-resource
      - id: micro-behaviors/data/embedded/payload/image::dotnet-resource-bitmap-pixel-readback
      - id: micro-behaviors/process/interpreter/reflection/runtime::activator
      - id: micro-behaviors/process/interpreter/reflection/runtime::create-instance-token
      - id: objectives/anti-static/obfuscation/reflection/invoke::get-exported-types-token
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/installer/family/

  - id: iso-payment-dotnet-resource-masquerade
    desc: ISO payment lure carries a templated .NET resource loader
    crit: hostile
    conf: 0.98
    attack: T1036.005,T1027.009,T1140,T1204.002
    all:
      - id: metadata/file/format/structured::primary-volume-descriptor
      - id: objectives/execution/lure/document::iso-payment-executable-member
      - id: metadata/file/format/managed-runtime::embedded-dotnet-template-manifest
      - id: metadata/file/format/managed-runtime::embedded-dotnet-resource-loader
