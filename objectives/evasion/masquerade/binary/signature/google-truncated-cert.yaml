# A version resource claiming a specific vendor while the image's
# certificate table is truncated cannot be a genuine vendor build: real
# vendor signatures live inside an intact security directory. This is the
# rebuilt-and-stripped impersonation shape (fake Google Update droppers and
# friends), distinct from the Microsoft-claim sibling composites keyed on
# version-field identity alone.
defaults:
  platforms: [windows]
  for: [pe]
  attack: T1036.001,T1553.002

composite_rules:
  - id: google-masquerade-truncated-cert
    desc: Google-claim PE with truncated certificate table
    crit: hostile
    conf: 0.95
    all:
      - id: metadata/binary/vendor::google-corp-versioninfo
      - id: metadata/binary/layout/checksum::cert-table-truncated
    unless:
      - id: metadata/binary/section/label::cape-sandbox-dump-section
