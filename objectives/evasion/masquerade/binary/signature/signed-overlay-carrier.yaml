defaults:
  platforms: [windows]
  for: [pe]
  attack: T1553.002
  mbc: F0001

traits:
  - id: objectives/evasion/masquerade/binary/signature::manifest-desc-orbd
    desc: Manifest borrows Oracle ORB daemon description
    crit: suspicious
    conf: 0.99
    if:
      type: value
      path: pe.manifest.description
      substr: Java(TM) SE orbd
    unless:
      - id: metadata/signed/leaf::oracle-corporation
      - id: metadata/signed/leaf::oracle-america-inc.

  - id: objectives/evasion/masquerade/binary/signature::fltldr-internal-name
    desc: Office Filter Loader InternalName
    crit: notable
    conf: 0.99
    if:
      type: value
      path: pe.version.internal_name
      exact: fltldr

  - id: objectives/evasion/masquerade/binary/signature::fltldr-original-filename
    desc: Office Filter Loader OriginalFilename
    crit: notable
    conf: 0.99
    if:
      type: value
      path: pe.version.original_filename
      regex: '(?i)^fltldr\.exe$'

  - id: objectives/evasion/masquerade/binary/signature::chocolatey-shimgen-strings
    desc: Chocolatey shimgen switch strings
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: 'shimgen-(log|noop|gui|waitforexit)'

  - id: objectives/evasion/masquerade/binary/signature::chocolatey-shimgen-banner
    desc: Chocolatey shimgen setup banner
    crit: notable
    conf: 0.97
    if:
      type: text
      substr: "Set up Shim to run with the following parameters"

composite_rules:
  - id: objectives/evasion/masquerade/binary/signature::fltldr-oversized-carrier
    desc: Oversized Office Filter Loader carrier
    crit: suspicious
    conf: 0.98
    size_min: 358400
    all:
      - id: objectives/evasion/masquerade/binary/signature::fltldr-internal-name
      - id: objectives/evasion/masquerade/binary/signature::fltldr-original-filename
    # Genuine x64 Office fltldr.exe builds exceed 350 KB; an intact
    # Authenticode digest means the size is the vendor's, not a carrier's.
    unless:
      - id: metadata/signed/certificate/signature::pe-authenticode-digest-matches

  - id: objectives/evasion/masquerade/binary/signature::signed-microsoft-tampered-overlay-pe
    desc: Tampered signed Microsoft PE with embedded payload
    crit: hostile
    conf: 0.99
    all:
      - id: metadata/signed/leaf::microsoft-corporation
      - id: metadata/signed/certificate/signature::pe-signature-digest-mismatch
      - id: metadata/binary/layout/embedded::pe-embedded
    unless:
      - id: metadata/signed/certificate/signature::pe-signature-verified-kv

  - id: objectives/evasion/masquerade/binary/signature::fltldr-overlay-payload-carrier
    desc: Office Filter Loader carrier with embedded PE
    crit: hostile
    conf: 0.99
    all:
      - id: objectives/evasion/masquerade/binary/signature::fltldr-internal-name
      - id: metadata/binary/layout/embedded::pe-embedded
    any:
      - id: metadata/signed/certificate/signature::pe-signature-digest-mismatch
      - id: objectives/evasion/masquerade/binary/signature::manifest-desc-orbd

  - id: objectives/evasion/masquerade/binary/signature::shimgen-overlay-payload-carrier
    desc: Chocolatey shimgen launcher with overlay PE payload
    crit: hostile
    conf: 0.99
    all:
      - id: metadata/signed/certificate/signature::pe-signature-digest-mismatch
      - id: metadata/binary/layout/embedded::pe-embedded
    any:
      - id: objectives/evasion/masquerade/binary/signature::chocolatey-shimgen-strings
      - id: objectives/evasion/masquerade/binary/signature::chocolatey-shimgen-banner

  - id: objectives/evasion/masquerade/binary/signature::signed-tampered-overlay-pe-generic
    desc: Tampered signed PE with embedded PE payload
    crit: hostile
    conf: 0.97
    all:
      - id: metadata/signed/certificate/signature::pe-signature-verified
      - id: metadata/signed/certificate/signature::pe-signature-digest-mismatch
      - id: metadata/binary/layout/ratio::multiple-pe-embedded
    unless:
      - id: metadata/binary/installer/family/
      - id: metadata/binary/installer/sfx/
      - id: metadata/binary/installer/script/

  - id: objectives/evasion/masquerade/binary/signature::signed-microsoft-rwx-overlay-loader
    desc: Tampered Microsoft-signed overlay loader
    crit: hostile
    conf: 0.98
    all:
      - id: metadata/signed/leaf::microsoft-corporation
      - id: metadata/signed/certificate/signature::pe-signature-digest-mismatch
      - id: metadata/binary/layout/overlay::overlay-dominates-third
      - id: metadata/binary/section/header::writable-entry-with-wx-section
    any:
      - id: micro-behaviors/communications/ip/endpoint::external-ipv4-port-rsrc-pair
      - id: micro-behaviors/process/create/shellexec::shell-execute-a
      - id: micro-behaviors/dylib/lookup::module-export-resolution-imports
    unless:
      - id: metadata/binary/installer/family/
      - id: metadata/binary/installer/script/


  - id: objectives/evasion/masquerade/binary/signature::tampered-signed-overlay-pe-loader
    desc: Tampered signed PE carries high-entropy overlay with in-memory PE parser
    crit: hostile
    conf: 0.98
    attack: T1553.002,T1027.002,T1620
    all:
      - id: metadata/signed/certificate/signature::pe-signature-digest-mismatch
      - id: metadata/binary/layout/overlay::signed-pe-large-noncertificate-overlay
      - id: metadata/binary/layout/overlay::overlay-80kb-high-entropy
    any:
      - id: micro-behaviors/data/parse/portable-executable::pe-header-walk-x64
      # Garbled Go overlay loaders often cmp against MZ without the full
      # e_lfanew/PE walk byte sequence matched by pe-header-walk-x64.
      - id: micro-behaviors/data/parse/portable-executable::pe-mz-compare-x64
      - id: micro-behaviors/data/control-flow/return::stack-ret-fallthrough-trampoline-x64
    unless:
      - id: metadata/binary/installer/family/
      - id: metadata/binary/installer/sfx/
      - id: metadata/binary/installer/script/
      - id: metadata/signed/platform/
