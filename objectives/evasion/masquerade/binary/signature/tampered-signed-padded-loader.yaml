defaults:
  platforms: [windows]
  for: [pe]
  attack: "T1036.001,T1553.002,T1027.001"

composite_rules:
  # A vendor binary's version resource and Authenticode block survive while its
  # image is rewritten: the signed digest no longer matches, and the padded
  # layout carries a small RWX stub that copies and jumps into a payload. The
  # borrowed identity (here Intel WiDi's IntelWiDiUMS.exe) exists to make that
  # loader look like a signed vendor service.
  - id: tampered-signed-binary-padded-stub-loader
    desc: Tampered signed PE hosting padded stub loader
    crit: hostile
    conf: 0.95
    all:
      - id: metadata/signed/certificate/signature::pe-signature-digest-mismatch
      - id: objectives/anti-static/obfuscation/binary-metrics/shape::padded-pe-disguised-stub-loader
    unless:
      - id: metadata/signed/platform/
