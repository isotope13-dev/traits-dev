defaults:
  platforms: [windows]
  for: [pe]
  attack: "T1036.001,T1553.002,T1027.001"

composite_rules:
  # A valid certificate can remain attached after an image is modified. When
  # its digest no longer matches and the modified PE copies code into RWX
  # memory and transfers control to it, the signed identity is being used to
  # carry an in-memory payload.
  - id: tampered-signed-image-rwx-copy-jump-loader
    desc: Tampered signed PE executes a copied RWX payload
    crit: hostile
    conf: 0.98
    attack: T1553.002,T1620
    all:
      - id: metadata/signed/certificate/signature::pe-signature-verified-kv
      - id: metadata/signed/certificate/signature::pe-signature-digest-mismatch
      - id: objectives/execution/payload/module-load::pe-bitset-rwx-byte-copy-and-run

  # A vendor binary's version resource and Authenticode block survive while its
  # image is rewritten: the signed digest no longer matches, and the padded
  # layout carries a small RWX stub that copies and jumps into a payload. The
  # borrowed identity (here Intel WiDi's IntelWiDiUMS.exe) exists to make that
  # loader look like a signed vendor service.
  - id: tampered-signed-binary-padded-stub-loader
    desc: Tampered signed PE hosting padded stub loader
    crit: hostile
    conf: 0.95
    all:
      - id: metadata/signed/certificate/signature::pe-signature-digest-mismatch
      - id: objectives/anti-static/obfuscation/binary-metrics/shape::padded-pe-disguised-stub-loader
    unless:
      - id: metadata/signed/platform/
