defaults:
  platforms: [windows]
  for: [pe, dll]
  attack: "T1036.007,T1553.002"

composite_rules:
  - id: renamed-invalid-signed-large-overlay
    desc: Renamed signed PE with invalid checksum and large overlay
    crit: hostile
    conf: 0.99
    all:
      - id: metadata/binary/layout::signed-pe-checksum-mismatch
      - id: metadata/binary/layout::large-overlay-1mb
      - id: metadata/binary/anomaly/provenance::pe-basename-differs-from-original-filename
    unless:
      - id: metadata/binary/installer/family/
      - id: metadata/binary/installer/sfx/
      - id: well-known/app/system/stresstimulus::mschart-setup
      - id: well-known/tool/sysadmin/virtualization::microsoft-appv-mavinject
