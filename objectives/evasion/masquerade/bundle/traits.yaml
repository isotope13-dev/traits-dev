defaults:
  crit: suspicious
  attack: T1036
  platforms:
    - unix
    - windows
  for:
    - ipa
traits:
  - id: short-random-bundle-id
    desc: Short random bundle ID
    conf: 0.8
    if:
      type: text
      regex: com\.[a-z]{2,3}\.[a-z0-9]{4,8}$
  - id: single-letter-bundle-component
    desc: Single letter component
    conf: 0.75
    if:
      type: text
      regex: com\.[a-z]\.[a-z0-9]+$
  - id: placeholder-bundle-id-1
    desc: 'Bundle ID with placeholder components'
    conf: 0.8
    if:
      type: text
      regex: \.(sdfdf|xxxx|aaaa|test123)$
  - id: placeholder-bundle-id-2
    desc: "Bundle ID with stub components (dummy/fake)"
    conf: 0.8
    if:
      type: text
      regex: \.(dummy|fake)$
  - id: zero-width-space-display-name
    desc: Zero-width Unicode in bundle display name
    conf: 0.9
    for: [plist]
    if:
      type: value
      path: CFBundleDisplayName
      regex: '[\u200B\u200C\u200D\u2060\uFEFF]'
composite_rules:
  - id: obfuscated-bundle-identity
    desc: Obfuscated bundle ID
    conf: 0.85
    any:
      - id: short-random-bundle-id
      - id: single-letter-bundle-component
      - id: placeholder-bundle-id-1
      - id: placeholder-bundle-id-2
  - id: suspicious-bundle-masquerading
    desc: Suspicious masquerading
    conf: 0.8
    any:
      - id: obfuscated-bundle-identity
      - id: zero-width-space-display-name
