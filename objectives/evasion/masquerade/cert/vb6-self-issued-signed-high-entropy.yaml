# A VB6 program is interpreted p-code or thin native code; its code section
# is not high-entropy and does not carry long null runs. One that does, and
# that also carries an Authenticode signature whose leaf certificate issued
# itself, is a packed VB6 stub dressed with a made-up publisher.
defaults:
  platforms: [windows]
  for: [pe]
  attack: T1553.002,T1027.002
composite_rules:
  - id: vb6-high-entropy-code-with-self-issued-signature
    desc: High-entropy VB6 code with self-issued signature
    crit: suspicious
    conf: 0.75
    all:
      - id: metadata/binary/framework::vb6-application-framework
      - id: metadata/binary/code/entropy::high-code-entropy
      - id: metadata/binary/code/density::null-runs-in-code-section
      - id: metadata/signed/certificate/chain::pe-cert-leaf-self-issued
    unless:
      - id: metadata/signed/platform/
