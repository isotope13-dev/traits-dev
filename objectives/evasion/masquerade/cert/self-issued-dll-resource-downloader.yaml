# A DLL planted beside a vendor's genuine executable for sideloading, signed
# with a certificate the signer issued to itself under the vendor's name so the
# Authenticode panel shows a publisher. The digest matches because the signer
# computed it. The DLL also carries a whole PE in its resources and a WinHTTP
# client to fetch more, which a real vendor library has no reason to hold.
defaults:
  platforms: [windows]
  for: [pe, dll]
  attack: T1036.001,T1553.002,T1574.002

composite_rules:
  - id: self-issued-signed-dll-resource-pe-downloader
    desc: Self-signed DLL with embedded PE and WinHTTP
    crit: hostile
    conf: 0.9
    all:
      - id: metadata/signed/certificate/chain::pe-cert-leaf-self-issued
      - id: metadata/signed/certificate/signature::pe-authenticode-digest-matches
      - id: metadata/binary/resource/identity::dos-header-prefix-in-resource
      - id: micro-behaviors/communications/http/client/winhttp::winhttp-request-response-flow
    unless:
      - id: metadata/signed/platform/
