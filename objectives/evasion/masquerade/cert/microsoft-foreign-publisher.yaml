# Microsoft Authenticode combined with process-injection behavior from a PE
# whose version-resource CompanyName is not Microsoft. The neutral publisher
# mismatch is defined under metadata/signature/certificate/identity.
defaults:
  platforms: [windows]
  for: [pe, dll]
  attack: T1036.001

composite_rules:
  - id: microsoft-signed-foreign-injector
    desc: Microsoft-signed foreign publisher with process injection
    crit: hostile
    conf: 0.96
    attack: T1036.001,T1055
    all:
      - id: metadata/signature/certificate/identity::microsoft-signed-foreign-company
    any:
      - id: objectives/execution/payload/process-inject/thread-pool::poolparty-module-names
      - id: micro-behaviors/mem/write/arbitrary::write-process-memory-dup
      - id: micro-behaviors/process/inject/runtime/call::nt-write-virtual-memory-name
      - id: micro-behaviors/mem/alloc/virtual::virtual-alloc-ex
    needs: 2
