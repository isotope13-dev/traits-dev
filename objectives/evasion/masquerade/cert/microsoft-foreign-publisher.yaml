# Microsoft Authenticode on a PE whose version-resource CompanyName is not
# Microsoft. This is a triage signal for an unexpected publisher claim, not
# proof of abuse: Microsoft also signs legitimate third-party runtimes.
defaults:
  platforms: [windows]
  for: [pe, dll]
  attack: T1036.001

composite_rules:
  - id: microsoft-foreign-publisher-benign-context
    desc: Recognized benign Microsoft-signed foreign publisher context
    crit: exception
    conf: 0.99
    any:
      - id: metadata/binary/vendor::microsoft-prefixed-company
      - id: metadata/signed/certificate/identity::pe-whql-hardware-compat-attestation
      - id: metadata/signed/certificate/identity::pe-whql-hardware-compat-nested
      - id: well-known/lib/platform/wintun/
      - id: well-known/app/system/mtrinistudio::mtrini-llama-runtime-context
      - id: well-known/app/system/mtrinistudio::mtrini-openmp-runtime-context
      - id: well-known/tool/development/git-for-windows/
      - id: well-known/lib/format/newtonsoft-json::newtonsoft-json-library
      - id: well-known/lib/development/llvm::llvm-openmp-runtime-library
      - id: well-known/tool/sysadmin/sysinternals::sysinternals-psexec
      - id: well-known/tool/sysadmin/sysinternals::sysinternals-microsoft-signed-component

  - id: microsoft-signed-foreign-company
    desc: Microsoft-signed PE has non-Microsoft CompanyName metadata
    crit: suspicious
    conf: 0.94
    all:
      - id: metadata/signed/platform::microsoft
      - id: metadata/package/versioning::pe-company-name-populated
    unless:
      - id: metadata/binary/vendor::microsoft-corp-versioninfo
      - id: microsoft-foreign-publisher-benign-context

  - id: microsoft-signed-foreign-injector
    desc: Microsoft-signed foreign publisher with process injection
    crit: hostile
    conf: 0.96
    attack: T1036.001,T1055
    all:
      - id: microsoft-signed-foreign-company
    any:
      - id: objectives/evasion/process/injection/toolkit::poolparty-toolkit
      - id: micro-behaviors/process/inject/runtime/call::write-process-memory-dup
      - id: micro-behaviors/os/syscall/raw::nt-write-ssn
      - id: micro-behaviors/mem/alloc/remote::virtual-alloc-ex
    needs: 2
    unless:
      - id: well-known/tool/sysadmin/sysinternals/
