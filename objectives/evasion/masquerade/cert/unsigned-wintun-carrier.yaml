defaults:
  for: [pe, dll]
  platforms: [windows]
composite_rules:
  # The outer carrier is unsigned and exposes none of the Wintun API, yet it
  # claims WireGuard's company identity and ships WireGuard-signed driver
  # binaries as embedded PEs: a re-wrapped, signature-stripped carrier for
  # trusted driver components. A genuine build is signed (excluded below);
  # a legitimate source rebuild keeps the Wintun exports (also excluded).
  - id: unsigned-wintun-signed-driver-carrier
    desc: Unsigned Wintun-claimed PE carries signed embedded drivers
    crit: hostile
    conf: 0.97
    attack: T1036.005
    all:
      - id: well-known/lib/platform/wintun::wintun-wireguard-company
      - id: metadata/binary/layout/embedded::embedded-pe-three-plus
      - id: metadata/binary/layout/embedded::embedded-dos-header-tail
    unless:
      - id: metadata/signed/platform/
      - id: well-known/lib/platform/wintun::wintun-open-adapter-export
