defaults:
  platforms: [windows]
  for: [pe]
  attack: T1036.005

composite_rules:
  - id: go-cshared-export-rich-fake-signed-loader
    desc: Go DLL with fake signing and export cluster
    crit: hostile
    conf: 0.99
    all:
      - id: metadata/binary/symbols/exports::sideload-export-cluster-size-10-25
      - id: metadata/lang/go-build::go-cshared-dll
      - id: metadata/signed/certificate/identity::pe-cert-leaf-self-issued
      - id: metadata/signed/certificate/identity::pe-cert-leaf-no-code-signing-eku
    any:
      - id: objectives/evasion/process/injection/dll::go-cshared-thread-hijack
      - id: micro-behaviors/mem/protect/modify::virtual-memory-allocation-protection-api-pair
    unless:
      - id: metadata/signed/platform/
