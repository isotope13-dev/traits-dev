defaults:
  platforms: [windows]
  for: [pe]
  attack: T1036.005

composite_rules:
  - id: go-cshared-export-rich-fake-signed-loader
    desc: Go DLL with fake signing and export cluster
    crit: hostile
    conf: 0.99
    all:
      - id: metadata/binary/symbols/count::exports-10-to-25
      - id: metadata/lang/go-build::go-cshared-dll
      - id: metadata/signature/certificate/chain::pe-cert-leaf-self-issued
      - id: metadata/signature/certificate/security::pe-cert-leaf-no-code-signing-eku
    any:
      - id: micro-behaviors/process/inject/thread-context::go-cshared-remote-thread-context-apis
      - id: micro-behaviors/mem/combined::virtual-memory-allocation-protection-api-pair
    unless:
      - id: metadata/signature/verified/platform/
