# A self-issued signature whose subject imitates a software company (here a
# CN of "Launcher" under a company O=) on an image whose entry point sits in
# a packer section. The certificate exists to make the Authenticode panel
# show a publisher name; the digest matches because the signer signed it.
defaults:
  platforms: [windows]
  for: [pe]
  attack: T1036.001,T1553.002,T1027.002
composite_rules:
  - id: self-issued-publisher-signature-on-packed-entry-image
    desc: Self-issued publisher signature on a packed-entry image
    crit: hostile
    conf: 0.85
    all:
      - id: metadata/signed/certificate/chain::pe-cert-leaf-self-issued
      - id: metadata/signed/certificate/signature::pe-authenticode-digest-matches
      - id: metadata/binary/provenance/version-info::pe-companyname-field
      - id: metadata/binary/section/header::pe-entry-in-short-dotted-section
      - id: metadata/binary/section/size::small-code-in-large-pe
    unless:
      - id: metadata/signed/platform/
