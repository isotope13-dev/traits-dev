# Obfuscated batch that ends in a block armored as an X509 CRL: the batch
# hands its own path to certutil -decode/-decodehex, which accepts any PEM
# label, and the "revocation list" decodes to the next-stage executable.
defaults:
  platforms: [windows]
  for: [batch]
  crit: hostile
  attack: T1036,T1140

composite_rules:
  - id: obfuscated-batch-crl-armored-payload
    desc: Obfuscated batch hides its payload as an X509 CRL
    conf: 0.93
    all:
      - id: metadata/file/encoding/shape::batch-x509-crl-armored-block
    any:
      - id: metadata/file/encoding/shape::batch-nonascii-alphabet-char-slices
      - id: metadata/file/encoding/shape::batch-nonascii-empty-junk-variables
