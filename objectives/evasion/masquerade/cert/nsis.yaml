defaults:
  platforms: [windows]
  for: [pe]

composite_rules:
- id: nsis-self-issued-security-product-claim
  desc: Self-issued NSIS claims security product
  crit: hostile
  conf: 0.97
  attack: T1027.009,T1036.004
  all:
  - id: well-known/tool/packaging/nsis::nsis
  - id: metadata/binary/layout/size::large-overlay-64k
  - id: metadata/binary/layout/entropy::high-entropy-overlay
  - id: metadata/signature/certificate/chain::pe-cert-leaf-self-issued
  - id: metadata/signature/certificate/integrity::pe-signature-verified-kv
  - id: micro-behaviors/os/security/product::microsoft-security-product-name-reference
  unless:
  - id: metadata/signature/verified/platform/
  - id: metadata/installer/product/
