defaults:
  platforms: [windows]
  for: [pe]

composite_rules:
- id: nsis-self-issued-security-product-claim
  desc: Self-issued NSIS claims security product
  crit: hostile
  conf: 0.97
  attack: T1027.009,T1036.004
  all:
  - id: metadata/binary/installer/script::nsis
  - id: metadata/binary/layout/overlay::large-overlay-64k
  - id: metadata/binary/layout/overlay::high-entropy-overlay
  - id: metadata/signed/certificate/chain::pe-cert-leaf-self-issued
  - id: metadata/signed/certificate/signature::pe-signature-verified-kv
  - id: objectives/evasion/masquerade/identity/product::windows-security-product-claim
  unless:
  - id: metadata/signed/platform/
  - id: metadata/binary/installer/family/
