defaults:
  platforms:
  - windows
  for:
  - pe
  attack: T1553.002
  mbc: F0001
  crit: hostile
composite_rules:
- id: truncated-cert-opaque-powershell-payload
  desc: Opaque PE payload with truncated certificate data and hidden AppX removal
  conf: 0.99
  attack: T1027,T1059.001,T1564.003
  all:
  - id: metadata/binary/layout/checksum::cert-table-truncated
  - id: metadata/binary/section/entropy::high-entropy-exec-section
  - id: micro-behaviors/process/argument/interpreter::powershell-windowstyle-hidden-option
  - id: micro-behaviors/os/package-manager/management::appx-package-removal-command
  unless:
  - id: metadata/signature/verified/platform/
- id: security-dir-pe-payload-hijack
  desc: Certificate table hijack to embedded PE payload
  conf: 0.99
  all:
  - id: metadata/binary/layout/checksum::cert-table-truncated
  - id: metadata/binary/layout/embedded::pe-embedded
  - id: metadata/binary/layout/ratio::multiple-pe-embedded
  - id: metadata/binary/section/ratio::few-sections
  - id: metadata/binary/layout/embedded::embedded-dos-header-tail
  any:
  - id: micro-behaviors/fs/file/pe-inspect::rip-relative-mz-header-comparison
  - id: metadata/build/manifest::pe-manifest-myapplication-template
- id: cert-transplant-garbled-go-rwx-loader
  desc: Transplanted-cert garbled Go PE with RWX allocation
  conf: 0.97
  attack: T1553.002,T1027,T1620
  all:
  - id: metadata/binary/layout/checksum::invalid-cert-directory-checksum
  - id: objectives/anti-static/obfuscation/name-mangling/type-names::obfuscated-go-identifiers
  - id: metadata/binary/instruction/call::x64-ecx-3000-edi-40-call-alternative
  unless:
  - id: metadata/signature/verified/platform/
- id: overlay-cert-garbled-go-rwx-loader
  desc: Overlay-cert garbled Go PE with RWX allocation
  conf: 0.97
  attack: T1553.002,T1027,T1620
  all:
  - id: metadata/signature/certificate/integrity::overlay-pkcs7-signeddata-oid
  - id: objectives/anti-static/obfuscation/name-mangling/type-names::obfuscated-go-identifiers
  - id: metadata/binary/instruction/call::x64-ecx-3000-edi-40-call-alternative
  any:
  - id: metadata/binary/layout/checksum::certificate-directory-checksum-mismatch
  - id: metadata/signature/certificate/integrity::pe-signature-digest-mismatch
  unless:
  - id: cert-transplant-garbled-go-rwx-loader
  - id: metadata/signature/verified/platform/
