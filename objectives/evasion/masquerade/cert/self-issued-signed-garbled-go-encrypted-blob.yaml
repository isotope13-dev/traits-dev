# A self-issued Authenticode leaf names a publisher no authority vouches
# for. Garbled main symbols and a high-entropy region are not enough to
# call that region a payload: the hostile claim also requires the program
# to reserve committed RWX memory, the allocation used to run unpacked code.
defaults:
  platforms: [windows]
  for: [pe]
  attack: T1553.002,T1027.002,T1036
composite_rules:
  - id: self-issued-signature-on-garbled-go-with-cipher-blob
    desc: Self-issued signature on garbled Go with cipher blob
    crit: hostile
    conf: 0.85
    all:
      - id: metadata/signed/certificate/chain::pe-cert-leaf-self-issued
      - id: objectives/anti-static/obfuscation/name-mangling/type-names::go-garbled-main-symbols
      - id: metadata/file/data-blob::peak-region-cipher-entropy
      - id: metadata/file/data-blob::binary-peak-region-mass-over-8k
      - id: micro-behaviors/mem/alloc/executable::go-abi-rwx-reserve-commit-call-x64-any
    unless:
      - id: metadata/signed/platform/
      - id: well-known/app/
      - id: well-known/lib/
