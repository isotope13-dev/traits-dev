# A self-issued Authenticode signature names a publisher no authority
# vouches for. On a Go binary whose main-package symbols are garbled and
# that carries a cipher-entropy region of more than 8 KB, the signature is
# decoration: it makes the file look signed while the encrypted blob is
# the payload the program decrypts and runs.
defaults:
  platforms: [windows]
  for: [pe]
  attack: T1553.002,T1027.002,T1036
composite_rules:
  - id: self-issued-signature-on-garbled-go-with-cipher-blob
    desc: Self-issued signature on garbled Go with cipher blob
    crit: hostile
    conf: 0.85
    all:
      - id: metadata/signed/certificate/chain::pe-cert-leaf-self-issued
      - id: objectives/anti-static/obfuscation/name-mangling/type-names::go-garbled-main-symbols
      - id: metadata/file/data-blob::peak-region-cipher-entropy
      - id: metadata/file/data-blob::binary-peak-region-mass-over-8k
    unless:
      - id: metadata/signed/platform/
      - id: well-known/app/
      - id: well-known/lib/
