defaults:
  for:
    - pe
  platforms:
    - windows
  attack: T1036.005
composite_rules:
  - id: qihu-signed-windows-updater-masquerade
    desc: Qihu-signed Windows updater masquerade
    crit: suspicious
    conf: 0.97
    all:
      - id: objectives/evasion/masquerade/identity/mimicry::windows-update-assistant-rundll32
    any:
      - id: metadata/signature/verified/signer::beijing-qihu-technology-co.
      - id: metadata/signature/unverified/signer::beijing-qihu-technology-co.
      - id: metadata/signature/self-signed/signer::beijing-qihu-technology-co.
      - id: metadata/signature/invalid/tampered/signer::beijing-qihu-technology-co.
      - id: metadata/signature/invalid/bad-signature/signer::beijing-qihu-technology-co.
      - id: metadata/signature/verified/subject::beijing-qihu-technology-co.
      - id: metadata/signature/unverified/subject::beijing-qihu-technology-co.
      - id: metadata/signature/self-signed/subject::beijing-qihu-technology-co.
      - id: metadata/signature/invalid/tampered/subject::beijing-qihu-technology-co.
      - id: metadata/signature/invalid/bad-signature/subject::beijing-qihu-technology-co.
