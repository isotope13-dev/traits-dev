# A certificate installed into a Windows trust store carries a display name
# chosen by whoever installs it, not by the issuer. Setting that display name
# to a commercial CA brand is how a private, self-signed root is made to look
# like an ordinary vendor entry when an administrator browses certmgr — the
# store column shows the brand, and the entry survives a cleanup pass.
# A certificate genuinely chained to that CA does not need the alias: the
# issuer field already says so.
defaults:
  platforms: [windows]
  for: [csharp, powershell]
  attack: T1553.004
  mbc: F0016

traits:
  - id: certificate-friendly-name-public-ca-brand
    desc: Certificate display name uses public CA brand
    crit: suspicious
    conf: 0.9
    if:
      type: text
      # A concatenated vendor name such as `Developer + " DigiCert"` does not
      # masquerade as DigiCert.  Require the assigned display name itself to
      # begin with the public CA brand.
      regex: '(?i)FriendlyName\s*=\s*["'']\s*(DigiCert|VeriSign|GlobalSign|Sectigo)\b'

composite_rules:
  - id: dotnet-root-ca-install-under-public-ca-brand
    desc: Machine root store install labeled with a public CA brand
    crit: hostile
    conf: 0.93
    for: [csharp]
    all:
      - id: certificate-friendly-name-public-ca-brand
      - id: micro-behaviors/crypto/certificate/install::dotnet-machine-root-store-add
