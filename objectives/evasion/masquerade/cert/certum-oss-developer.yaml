defaults:
  platforms: [windows]
  for: [pe]
  attack: T1553.002

traits:
  - id: signed-installer-manifest-description
    desc: Generic Installer manifest description
    crit: notable
    conf: 0.85
    if:
      type: value
      path: pe.manifest.description
      exact: 'Installer'

composite_rules:
  - id: certum-oss-installer-template
    desc: Certum OSS-dev signed anonymous installer
    crit: hostile
    conf: 0.95
    all:
      - id: metadata/signature/certificate/identity::certum-oss-developer-cert
      - id: signed-installer-manifest-description
      - id: metadata/binary/resource/table::pe-no-version-info-resource
      - id: metadata/build/manifest::require-administrator

  - id: anonymous-signed-installer
    desc: Signed installer without VS_VERSION_INFO
    crit: suspicious
    conf: 0.9
    all:
      - id: metadata/binary/resource/table::pe-no-version-info-resource
      - id: signed-installer-manifest-description
      - id: metadata/signature/certificate/integrity::pe-signature-verified
    unless:
      - id: metadata/signature/verified/platform/

  - id: signed-pe-expired-leaf-installer
    desc: Signed installer with shallow expired-era chain
    crit: suspicious
    conf: 0.88
    exempt:
      unverified-signature-suppressor: Chain-length structure logic (no fourth certificate), not trust in a signer.
    all:
      # Depth two: exactly three chain fingerprints.
      - id: metadata/signature/certificate/chain::pe-cert-chain-depth-two-plus
      - id: signed-installer-manifest-description
      - id: metadata/binary/resource/table::pe-no-version-info-resource
    unless:
      - id: metadata/signature/verified/platform/
      - id: metadata/signature/certificate/issuer/chain::pe-cert-chain-fourth-entry
