defaults:
  platforms: [windows]
  for: [pe, dll]
composite_rules:
  # Normal signed installers hash their payload. This requires a compiled
  # executable-script container specifically after DER SignedData, inside
  # the certificate table excluded from Authenticode's content digest.
  # It does not claim that the managed DLL entry point executes the script.
  - id: ca-signed-autoit-certificate-padding
    desc: Intact signed PE conceals unsigned AutoIt container
    crit: hostile
    conf: 0.99
    attack: T1553.002,T1027.009
    all:
      - id: metadata/signed/certificate/signature::autoit-container-after-signeddata
      - id: metadata/signed/certificate/chain::ca-issued-intact-signature
      - id: metadata/signed/certificate/signature::pe-authenticode-unsigned-trailing-data
