defaults:
  for:
  - pe
  platforms:
  - windows
composite_rules:
- id: signed-pe-with-c2-endpoints
  desc: Signed PE binary with embedded C2 endpoints
  crit: suspicious
  conf: 0.92
  all:
  - id: micro-behaviors/data/embedded/certificate::pkcs7-signeddata-oid
  - id: micro-behaviors/communications/ip/endpoint::small-pe-external-ipv4-endpoint
  any:
  - id: micro-behaviors/communications/http/post
  - id: micro-behaviors/communications/http/client/wininet::wininet-session-request-api-set
  - id: micro-behaviors/ui/window/hook::set-windows-hook
