# A trial Advanced Installer bootstrapper whose payload sits in a high-entropy
# overlay, signed under an individual-validation certificate. The wrapper hides
# what it installs (the member archive is encrypted, so installer extraction
# yields only the stub) and the signature supplies a trust badge without a
# company identity behind it. Each part is ordinary alone: individuals sign
# real tools, the trial edition is free, and installers carry large overlays.
defaults:
  platforms: [windows]
  for: [pe]
  attack: T1553.002,T1027.002

composite_rules:
  - id: personal-signed-evaluation-installer-encrypted-payload
    desc: Personal-name signed trial installer with encrypted overlay
    crit: suspicious
    conf: 0.85
    all:
      - id: metadata/signed/certificate/subject::pe-signer-personal-name-subject
      - id: metadata/binary/installer/builder::bootstrapper-flag
      - id: metadata/binary/installer/builder::evaluation-installer-version-comment
      - id: metadata/binary/layout/overlay::overlay-entropy-over-7
      - id: metadata/binary/layout/overlay::large-overlay-1mb
    unless:
      - id: metadata/signed/platform/
