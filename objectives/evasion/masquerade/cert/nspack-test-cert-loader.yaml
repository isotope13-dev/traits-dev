# NSPack bootstrap loader whose Authenticode blob is a public test
# certificate and does not cover the image. Unpacking this shape recovers a
# payload that installs and starts a service, adjusts a process token, and
# rewrites registry key security, with its import names hidden in the LZMA
# payload. The version-resource publisher is attacker-chosen and is not a leg.
defaults:
  platforms: [windows]
  for: [pe]
  conf: 0.96
  attack: T1553.002,T1027.002

composite_rules:
  - id: nspack-broken-test-cert-loader
    desc: NSPack loader with broken test certificate
    crit: hostile
    all:
      - id: well-known/dual-use/packaging/nspack::nspack-i386-entry-stub
      - id: well-known/dual-use/packaging/nspack::empty-rwx-nsp0
      - id: metadata/binary/symbols/count::imported-functions-under-10
      - id: metadata/signed/certificate/identity::authenticode-test-certificate-subject
      - id: metadata/signed/certificate/signature::pe-signature-digest-mismatch
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/installer/family/
