# Renamed script interpreter detection
# Standalone script interpreters (LuaJIT, AutoIt, AutoHotkey, etc.) are
# commonly renamed and bundled with malicious payloads to bypass filename
# and process-name based detection.
defaults:
  platforms: [windows]
  for: [pe]
  attack: T1036.005
  mbc: F0004
traits:
  # === AutoIt ===
- id: renamed-autoit
  desc: Renamed AutoIt interpreter
  crit: suspicious
  conf: 0.9
  if:
    type: text
    exact: "AutoIt v3"

  unless:
  - type: basename
    case_insensitive: true
    regex: ^autoit
  - type: basename
    case_insensitive: true
    regex: ^au3
  - id: metadata/lang/compiled::autoit-compiled-script

  # === AutoHotkey ===
- id: renamed-autohotkey
  desc: Renamed AutoHotkey interpreter
  crit: suspicious
  conf: 0.9
  if:
    type: text
    regex: (?i)\bAutoHotkey\s+v[0-9]

  unless:
  - type: basename
    case_insensitive: true

    regex: ^autohotkey
  - type: basename
    case_insensitive: true

    regex: ^ahk
composite_rules:
- id: renamed-luajit
  desc: Renamed LuaJIT interpreter (not named luajit.exe)
  crit: suspicious
  conf: 0.9
  # Stock MSVC luajit.exe names itself in exports; renamed campaign launchers
  # (`compiler.exe`, `cli.exe`) often keep only the banner and LUA_INIT hook.
  needs: 2
  any:
  - id: well-known/lib/runtime/scripted/luajit::interpreter-module-name
  - id: well-known/lib/runtime/scripted/luajit::version-banner
  - id: well-known/lib/runtime/scripted/luajit::lua-init-env
  - id: well-known/lib/runtime/scripted/luajit::bytecode-preload-format
  unless:
  - id: well-known/lib/runtime/scripted/luajit::interpreter-filename

- id: renamed-luajit-packed-text-archive
  desc: Renamed LuaJIT launches a packed text payload from an archive
  crit: hostile
  conf: 0.99
  attack: T1036.005,T1059.004,T1027
  scope: archive
  for: [zip, batch, text, pe]
  all:
  - id: renamed-luajit
  - id: metadata/file/naming::archive-bat-member
  - id: objectives/supply-chain/hidden-payload/exec/archive::batch-starts-executable-text-payload
  - id: objectives/anti-static/obfuscation/code-metrics/structure::packed-lua-loader-obfuscation
  unless:
  - id: metadata/package/testing/presence/harness/

- id: renamed-luajit-escaped-text-archive
  desc: Renamed LuaJIT runs escaped-string Lua payload
  crit: hostile
  conf: 0.99
  attack: T1036.005,T1059.004,T1027
  scope: archive
  for: [zip, batch, text, pe, lua]
  all:
  - id: renamed-luajit
  - id: metadata/file/naming::archive-bat-member
  - id: objectives/supply-chain/hidden-payload/exec/archive::batch-starts-executable-text-payload
  - id: objectives/anti-static/obfuscation/code-metrics/structure::lua-escaped-string-dispatch
  unless:
  - id: metadata/package/testing/presence/harness/

- id: embedded-luajit-runtime
  desc: LuaJIT runtime embedded as scripting engine in non-luajit binary
  crit: suspicious
  conf: 0.9
  all:
  - id: well-known/lib/runtime/scripted/luajit::version-banner
  - id: well-known/lib/runtime/scripted/luajit::bytecode-preload-format
  any:
  - id: well-known/lib/runtime/scripted/luajit::embedded-script-chunkname
  - id: well-known/lib/runtime/scripted/luajit::lua-init-env
  unless:
  - id: well-known/lib/runtime/scripted/luajit::interpreter-filename
  - id: well-known/lib/runtime/scripted/luajit::interpreter-module-name

- id: luajit-malware-loader
  desc: Embedded LuaJIT runtime used as malware loader
  crit: hostile
  conf: 0.95
  all:
  - id: embedded-luajit-runtime
  any:
  - id: micro-behaviors/os/registry/keys::currentversion-run-key-path
  - id: micro-behaviors/fs/path/application/executable::defender-exe-name-reference
  - id: objectives/evasion/decoy/social::fake-error-dll-missing
  - id: micro-behaviors/os/random/generator::rtlgenrandom-name-pair-with-resolver
  needs: 2
  unless:
  - id: metadata/signed/platform/
