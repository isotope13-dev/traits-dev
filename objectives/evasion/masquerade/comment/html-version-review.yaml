defaults:
  platforms: [windows, unix]
  for: [html]
  attack: T1036
composite_rules:
  - id: html-comment-disguises-version-change
    desc: HTML comments mention avoiding suspicion and a similar version string
    crit: suspicious
    conf: 0.92
    all:
      - id: metadata/document/html/markup::comment-avoid-suspicion
      - id: metadata/document/html/markup::comment-version-looks-identical
