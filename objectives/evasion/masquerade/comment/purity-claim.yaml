# A header comment that tells a reviewer the module is harmless, in a file whose
# code says otherwise. "PURE and browser-safe: uses only Intl (no node:fs, no
# other node:* built-ins)" sat at the top of the module that chmods a dropped
# file to 0755 and spawns it detached.
#
# The comment is not incidental staleness: it is aimed at the one control a
# supply-chain payload has to get past, which is a human skimming a diff. Code
# search, dependency review and an SBOM all read the code; only the reviewer
# reads the prose, and only the reviewer can be told the file is pure. A future
# variant will move the claim into the README, the JSDoc or the package
# description, so the claim side stays broad and the contradiction comes from
# behaviour atoms.
#
# The claim atoms themselves ("browser-safe", "side-effect free", "no node:*")
# moved to metadata/package/documentation/: as text they are a documentation
# fact that ordinary tree-shaking and JSDoc prose produce constantly, and at
# `notable` in this directory every one of them surfaced as its own masquerade
# finding. What is left here is the part that actually infers deception -- the
# claim standing in the same file as the capability it denies.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  attack: T1036
  mbc: E1036
  crit: notable
  conf: 0.85

composite_rules:
  # The claim next to the capability it denies. Scoped to one file: a README
  # promising purity for the package while some other module spawns a process is
  # ordinary documentation drift, not a lie about the code in front of you.
  - id: purity-claim-contradicted-by-capability
    desc: Purity claim sits above filesystem or exec code
    crit: suspicious
    conf: 0.9
    scope: file
    all:
      - id: metadata/package/documentation::module-purity-claim
    any:
      - id: micro-behaviors/os/module/load::node-lazy-builtin-capability-import
      - id: micro-behaviors/fs/chmod/executable/mode::node-chmod-make-executable
      - id: micro-behaviors/process/create/spawn-variable::spawn-variable-program
      - id: micro-behaviors/process/create/spawn::detached-true
      - id: micro-behaviors/fs/file/write/direct::node-write-file-sync
    needs: 2
    unless:
      - id: metadata/package/testing/harness/runtime/
      - id: metadata/package/testing/presence/fixture::test-filename-pattern
      - id: metadata/lang/scripted::dts-declaration-file
