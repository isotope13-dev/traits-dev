defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, markdown, text]
  attack: T1036

composite_rules:
  - id: js-deceptive-utility-webhook-stealer-comments
    desc: Code comments state utility function is disguised to hide exfiltration
    crit: hostile
    conf: 0.99
    for: [javascript, typescript]
    all:
      - id: micro-behaviors/crypto/key/representation/encoded::js-deceptive-utility-function-comment
      - id: micro-behaviors/communications/http/services/discord::js-axios-post-discord-webhook

  - id: bundled-stealth-discord-webhook-publish-guide
    desc: Package bundles guide on hiding Discord webhook URL in compiled dist JS
    crit: hostile
    conf: 0.99
    for: [markdown, text]
    all:
      - id: micro-behaviors/crypto/key/representation/encoded::markdown-stealth-webhook-publish-guide
      - id: micro-behaviors/crypto/key/representation/encoded::markdown-users-dont-inspect-node-modules

  - id: js-security-agent-telemetry-masquerade
    desc: Code disguises corporate reconnaissance as security telemetry
    crit: hostile
    conf: 0.98
    for: [javascript, typescript]
    all:
      - id: metadata/package/documentation/claims::security-agent-selftest-claim
    any:
      - id: objectives/discovery/system/profile::js-enterprise-environment-recon
      - id: objectives/discovery/network/enumeration::hosts-file-internal-host-discovery
      - id: objectives/exfiltration/http/query::node-corporate-recon-http-query-exfil

