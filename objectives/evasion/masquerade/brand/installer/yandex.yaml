defaults:
  platforms: [windows]
  for: [pe]
  attack: T1036

composite_rules:
- id: yandex-installer-dummy-cert
  desc: Yandex installer dummy certificate masquerade
  crit: suspicious
  conf: 0.95
  all:
  - id: metadata/binary/resource/identity::yandex-installer-resource-label
  - id: metadata/binary/resource/identity::yandex-product-version-resource-label
  - id: metadata/signed/unknown::yandex-llc
  - id: metadata/signed/unknown::dummy-certificate
  any:
  - id: metadata/binary/layout/checksum::pe-checksum-mismatch
  - id: metadata/binary/resource/size::large-rsrc-section
- id: yandex-masquerade-injection-loader
  desc: Yandex installer masquerade injection loader
  crit: suspicious
  conf: 0.96
  all:
  - id: metadata/binary/resource/identity::yandex-installer-resource-label
  - id: metadata/signed/unknown::yandex-llc
  - id: metadata/signed/unknown::dummy-certificate
  - id: micro-behaviors/process/inject/remote-thread::remote-memory-thread-api-profile
  - id: micro-behaviors/process/info/name::taskhostw-executable-reference
  - id: micro-behaviors/process/inject/runtime/call::ntdll-write-memory-api-references
  any:
  - id: metadata/binary/layout/checksum::pe-checksum-mismatch
  - id: metadata/binary/resource/size::large-rsrc-section
