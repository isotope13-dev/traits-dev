# Vendor-branded Electron NSIS installers that decrypt a sidecar into
# Module._compile are a recurring Kingston-/storage-branded stealer shape.
defaults:
  platforms: [windows]
  for: [pe, javascript, package.json, asar, zip]
  attack: T1036.005,T1027.013,T1059.007

composite_rules:
  - id: kingston-electron-aes-sidecar-stealer
    desc: Kingston-branded Electron AES sidecar stealer
    crit: hostile
    conf: 0.98
    scope: outer
    all:
      - id: metadata/vendor/identity::kingston-versioninfo
      - id: objectives/execution/payload/module-load/transformed::electron-aes-sidecar-module-compile
      - id: well-known/tool/packaging/nsis::nsis
