# Vendor-branded Electron NSIS installers that decrypt a sidecar into
# Module._compile are a recurring Kingston-/storage-branded stealer shape.
defaults:
  platforms: [windows]
  for: [pe, javascript, package.json, archives]
  attack: T1036.005,T1027.013,T1059.007

composite_rules:
  - id: kingston-electron-aes-sidecar-stealer
    desc: Kingston-branded Electron AES sidecar stealer
    crit: hostile
    conf: 0.98
    scope: outer
    all:
      - id: metadata/binary/vendor::kingston-versioninfo
      - id: objectives/command-and-control/dropper/staging/encrypted::electron-aes-sidecar-module-compile
      - id: metadata/binary/installer/script::nsis
