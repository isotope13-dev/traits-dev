defaults:
  platforms: [windows]
  for: [pe]
  attack: T1036.005

traits:
  - id: bandizip-enterprise-marker
    desc: Bandizip Enterprise product marker
    crit: component
    conf: 0.99
    if:
      type: text
      substr: Bandizip Enterprise

  - id: bandizip-installer-description-claim
    desc: PE claims a Bandizip portable installer
    crit: component
    conf: 0.99
    if:
      type: encoded
      encoding: wide
      section: rsrc
      regex: '(?i)Bandizip Enterprise \d+ \d+ Pro\s+Portable \d{4} Latest\.exe Setup'

  - id: bandizip-installer-product-claim
    desc: PE claims a Bandizip Enterprise product
    crit: component
    conf: 0.99
    if:
      type: encoded
      encoding: wide
      section: rsrc
      regex: '(?i)Bandizip Enterprise \d+ \d+ Pro\s+Portable \d{4} Latest\.exe\s+$'

composite_rules:
  - id: bandizip-installer-identity
    desc: Fabricated Bandizip installer identity
    crit: component
    conf: 0.99
    any:
      - id: bandizip-enterprise-marker
      - id: bandizip-installer-description-claim
      - id: bandizip-installer-product-claim

  - id: unsigned-bandizip-installer-masquerade
    desc: No-signature Inno PE masquerades as Bandizip
    crit: hostile
    conf: 0.995
    attack: T1036.005,T1195.002
    all:
      - id: bandizip-installer-identity
      - id: metadata/binary/layout::pe-no-signature-record
      - id: metadata/binary/installer/family::inno-delphi-installer-foundation

  - id: unverified-bandizip-installer-lure
    desc: Unverified Bandizip PE lure
    crit: hostile
    conf: 0.995
    attack: T1036.005,T1027.009
    all:
      - id: bandizip-installer-identity
      - id: metadata/binary/layout::pe-no-signature-record
