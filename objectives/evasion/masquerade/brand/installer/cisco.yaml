defaults:
  platforms: [windows]
  for: [pe, archives]
  attack: T1036.005

composite_rules:
  - id: unsigned-cisco-encrypted-electron-installer
    desc: Unsigned Cisco-branded NSIS loads AES-encrypted Electron code
    crit: hostile
    conf: 0.995
    attack: T1036.005,T1027.013,T1140
    scope: outer
    all:
      - id: metadata/binary/vendor::cisco-versioninfo
      - id: metadata/binary/layout::pe-no-signature-record
      - id: metadata/binary/installer/script::nsis
      - id: objectives/command-and-control/dropper/staging/encrypted::electron-aes-sidecar-module-compile
    unless:
      - id: metadata/package/testing/
