defaults:
  platforms: [windows]
  for: [pe, asar, zip]
  attack: T1036.005

composite_rules:
  - id: unsigned-cisco-encrypted-electron-installer
    desc: Unsigned Cisco-branded NSIS loads AES-encrypted Electron code
    crit: hostile
    conf: 0.995
    attack: T1036.005,T1027.013,T1140
    scope: outer
    all:
      - id: metadata/vendor/identity::cisco-versioninfo
      - id: metadata/signature/absent::unsigned-missing-signature-record
      - id: well-known/tool/packaging/nsis::nsis
      - id: objectives/execution/payload/module-load/transformed::electron-aes-sidecar-module-compile
    unless:
      - id: metadata/path/directory::test-directory-component
