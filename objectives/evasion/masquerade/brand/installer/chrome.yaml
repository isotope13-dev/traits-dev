defaults:
  platforms: [windows]
  for: [pe]
  attack: T1036.005

traits:
  - id: chrome-installer-product-identity
    desc: PE claims Chrome Installer identity
    crit: suspicious
    conf: 0.98
    if:
      type: value
      path: pe.version.product_name
      regex: '(?i)^Chrome Installer \((x86|x64)\)$'

composite_rules:
  - id: chrome-lure-dotnet-resource-wrapper
    desc: Chrome-lure .NET resource child wrapper
    crit: hostile
    conf: 0.99
    attack: T1036.005,T1027.009,T1620,T1059.003
    all:
      - id: chrome-installer-product-identity
      - id: metadata/binary/framework::dotnet-metadata
      - id: micro-behaviors/data/embedded/payload/resource::dotnet-managed-resource-access
      - id: micro-behaviors/fs/write/file/direct::dotnet-writeallbytes-token
      - id: micro-behaviors/process/create/spawn::process-token-dotnet
      - id: micro-behaviors/process/create/spawn::use-shell-execute-property
    unless:
      - id: metadata/signed/platform/
      - id: well-known/app/protected-benign-pe/
