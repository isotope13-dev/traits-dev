defaults:
  platforms: [windows]
  for: [pe]
  attack: T1036.005

traits:
  - id: chrome-installer-product-identity
    desc: PE claims Chrome Installer identity
    crit: suspicious
    conf: 0.98
    if:
      type: value
      path: pe.version.product_name
      regex: '(?i)^Chrome Installer \((x86|x64)\)$'

composite_rules:
  - id: chrome-lure-dotnet-resource-wrapper
    desc: Chrome-lure .NET resource child wrapper
    crit: hostile
    conf: 0.99
    attack: T1036.005,T1027.009,T1620,T1059.003
    all:
      - id: chrome-installer-product-identity
      - id: metadata/lang/compiler/managed::dotnet-metadata
      - id: micro-behaviors/data/embedded/resource::dotnet-managed-resource-access
      - id: micro-behaviors/fs/write/file/full/bytes::dotnet-writeallbytes-token
      - id: metadata/binary/symbols/name/process::dotnet-processstartinfo-name
      - id: micro-behaviors/process/config/launch::use-shell-execute-property
    unless:
      - id: metadata/signature/verified/platform/
