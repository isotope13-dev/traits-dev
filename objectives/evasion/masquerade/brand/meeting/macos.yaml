defaults:
  platforms: [macos]
  for: [applescript, macho, swift, objc]
  attack: T1036.005

traits:
  - id: meeting-sdk-token
    desc: Meeting lure SDK token
    crit: component
    conf: 0.8
    if:
      type: text
      word: SDK
  - id: meeting-sdk-action-token
    desc: Meeting lure update action
    crit: notable
    conf: 0.82
    if:
      type: text
      regex: '(?i)(download (the )?update|install.{0,12}latest version|update required)'
  - id: meeting-docs-teams
    desc: Teams developer docs lure
    crit: notable
    conf: 0.88
    if:
      type: text
      substr: learn.microsoft.com/en-us/microsoftteams
  - id: meeting-docs-zoom
    desc: Zoom developer docs lure
    crit: notable
    conf: 0.88
    if:
      type: text
      regex: '(developers|marketplace)\.zoom\.us'
  - id: meeting-docs-webex
    desc: Webex developer docs lure
    crit: notable
    conf: 0.88
    if:
      type: text
      substr: developer.webex.com
  - id: meeting-docs-google-meet
    desc: Google Meet developer docs lure
    crit: notable
    conf: 0.88
    if:
      type: text
      substr: developers.google.com/meet
  - id: meeting-action-latest-version
    desc: Meeting latest-version lure
    crit: notable
    conf: 0.84
    if:
      type: text
      substr: update to the latest version
      case_insensitive: true
  - id: meeting-action-start-button
    desc: Meeting start-button lure
    crit: notable
    conf: 0.82
    if:
      type: text
      regex: '(?i)pressing the.{0,40}start button'
  - id: meeting-action-video-features
    desc: Meeting video-features lure
    crit: notable
    conf: 0.82
    if:
      type: text
      substr: video conferencing features
      case_insensitive: true
  - id: meeting-live-domain-teams-zoom-webex
    desc: Teams Zoom Webex live domain
    crit: suspicious
    conf: 0.9
    if:
      type: text
      regex: 'https://(teams|zoom|webex)-live\.[A-Za-z0-9.-]{2,80}/'
  - id: meeting-live-domain-meet-skype-slack
    desc: Meet Skype Slack live domain
    crit: suspicious
    conf: 0.9
    if:
      type: text
      regex: 'https://(meet|skype|slack)-live\.[A-Za-z0-9.-]{2,80}/'
  - id: meeting-updater-path-teams-zoom-webex
    desc: Teams Zoom Webex updater path
    crit: notable
    conf: 0.88
    if:
      type: text
      regex: '(?i)(MSTeams|Teams|Zoom|Webex).{0,20}Updater.{0,20}\.scpt'
  - id: meeting-updater-path-meet-skype-slack
    desc: Meet Skype Slack updater path
    crit: notable
    conf: 0.88
    if:
      type: text
      regex: '(?i)(Meet|Skype|Slack).{0,20}Updater.{0,20}\.scpt'
  - id: applescript-softwareupdate-url-product
    desc: AppleScript softwareupdate URL product
    crit: suspicious
    conf: 0.94
    for: [applescript]
    if:
      type: text
      regex: 'softwareupdate\s+--evaluate-products\s+--products\s+["& ]+https?://'
  - id: applescript-softwareupdate-var-product
    desc: AppleScript softwareupdate variable product
    crit: suspicious
    conf: 0.94
    for: [applescript]
    if:
      type: text
      regex: 'softwareupdate\s+--evaluate-products\s+--products\s+"\s*&\s*[A-Za-z][A-Za-z0-9_]*'

composite_rules:
  - id: meeting-brand-lure
    desc: Meeting platform brand lure
    crit: component
    conf: 0.9
    # Product names live in metadata/file/catalog/service; this composite is
    # the masquerade reading of them next to the SDK/update lure text.
    any:
      - id: metadata/file/catalog/service::service-name-microsoft-teams
      - id: metadata/file/catalog/service::service-name-zoom
      - id: metadata/file/catalog/service::service-name-webex
      - id: metadata/file/catalog/service::service-name-google-meet
      - id: metadata/file/catalog/service::service-name-skype
      - id: metadata/file/catalog/service::service-name-slack
  - id: meeting-sdk-update-lure-text
    desc: Meeting SDK update lure text
    crit: suspicious
    conf: 0.92
    all:
      - id: meeting-sdk-token
      - id: meeting-sdk-action-token
      - id: meeting-brand-lure
    near_bytes: 1024
  - id: meeting-platform-docs-lure
    desc: Meeting platform docs lure URL
    crit: notable
    conf: 0.88
    any:
      - id: meeting-docs-teams
      - id: meeting-docs-zoom
      - id: meeting-docs-webex
      - id: meeting-docs-google-meet
  - id: meeting-brand-latest-prompt
    desc: Meeting brand with latest-version prompt
    crit: notable
    conf: 0.9
    all:
      - id: meeting-brand-lure
      - id: meeting-action-latest-version
    near_bytes: 1024
  - id: meeting-brand-start-prompt
    desc: Meeting brand with start-button prompt
    crit: notable
    conf: 0.9
    all:
      - id: meeting-brand-lure
      - id: meeting-action-start-button
    near_bytes: 1024
  - id: meeting-brand-video-prompt
    desc: Meeting brand with video-features prompt
    crit: notable
    conf: 0.9
    all:
      - id: meeting-brand-lure
      - id: meeting-action-video-features
    near_bytes: 1024
  - id: meeting-update-action-text
    desc: Meeting update action prompt text
    crit: notable
    conf: 0.84
    any:
      - id: meeting-brand-latest-prompt
      - id: meeting-brand-start-prompt
      - id: meeting-brand-video-prompt
  - id: meeting-live-lookalike-domain
    desc: Meeting lookalike payload domain
    crit: suspicious
    conf: 0.92
    any:
      - id: meeting-live-domain-teams-zoom-webex
      - id: meeting-live-domain-meet-skype-slack
  - id: meeting-updater-scpt-path
    desc: Meeting updater AppleScript stage path
    crit: notable
    conf: 0.9
    any:
      - id: meeting-updater-path-teams-zoom-webex
      - id: meeting-updater-path-meet-skype-slack
  - id: meeting-lookalike-stage-lure
    desc: Meeting lookalike staged payload lure
    crit: suspicious
    conf: 0.97
    all:
      - id: meeting-brand-lure
      - id: meeting-update-action-text
    any:
      - id: meeting-live-lookalike-domain
      - id: meeting-updater-scpt-path
  - id: meeting-softwareupdate-url-lure
    desc: Meeting softwareupdate URL lure
    crit: suspicious
    conf: 0.97
    for: [applescript]
    all:
      - id: meeting-platform-docs-lure
    any:
      - id: applescript-softwareupdate-url-product
      - id: applescript-softwareupdate-var-product

  # The brand and the payload retrieval in one script. Impersonating Teams,
  # Zoom or Webex is deniable on its own -- plenty of legitimate automation
  # names the app it drives -- and fetching a script into a variable is
  # deniable on its own too. Together, with a pretext that explains why an
  # update is needed, they are the macOS fake-meeting-update chain end to end:
  # the brand supplies the trust, the pretext supplies the urgency, and the
  # in-memory stage means nothing is ever written to disk for a scanner to
  # find.
  #
  # Deliberately keyed on the lure *class* rather than on Teams or Zoom by
  # name: the pretext leg accepts any of the platform-docs, softwareupdate and
  # background-docs variants, so a campaign that swaps Teams for Webex or
  # rewords the prompt still lands here.
  - id: meeting-brand-remote-stage-execution
    desc: Meeting-brand lure runs a fetched stage
    crit: hostile
    conf: 0.96
    attack: T1036.005,T1204.002,T1105
    for: [applescript]
    all:
      - id: meeting-brand-lure
      - id: objectives/command-and-control/dropper/staging/memory::applescript-in-memory-execution
    any:
      - id: meeting-platform-docs-lure
      - id: meeting-softwareupdate-url-lure
      - id: applescript-softwareupdate-var-product
      - id: teams-docs-background-lure

  - id: meeting-softwareupdate-in-memory-stage
    desc: Softwareupdate lure runs an in-memory stage
    crit: hostile
    conf: 0.96
    attack: T1036.005,T1105
    for: [applescript]
    all:
      - id: meeting-softwareupdate-url-lure
      - id: objectives/command-and-control/dropper/staging/memory::applescript-in-memory-downloader

  - id: applescript-docs-bg-compile-load
    desc: Docs lure covers a compiled stage load
    crit: hostile
    conf: 0.96
    attack: T1036.005,T1105
    for: [applescript]
    all:
      - id: objectives/command-and-control/dropper/staging/memory::applescript-download-compile-load
      - id: micro-behaviors/process/create/script/osascript::open-g-bg
    any:
      - id: objectives/evasion/masquerade/brand/meeting::teams-docs-background-lure
      - id: meeting-platform-docs-lure

