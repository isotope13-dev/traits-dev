# AdwCleaner brand masquerade
defaults:
  platforms: [windows]
  for: [pe]
  attack: T1036.005

traits:
  - id: adwcleaner-brand-str
    desc: AdwCleaner brand string
    crit: notable
    conf: 0.9
    if:
      type: text
      word: AdwCleaner

  - id: adwcleaner-trial-scare-text
    desc: AdwCleaner trial threat scare text
    crit: suspicious
    conf: 0.95
    if:
      type: text
      regex: '(?i)trial\s+version\s+of\s+AdwCleaner'

composite_rules:
  - id: adwcleaner-brand-masquerade
    desc: AdwCleaner brand masquerade
    crit: suspicious
    conf: 0.92
    all:
      - id: adwcleaner-brand-str
    any:
      - id: metadata/binary/provenance/version-info::pe-original-filename-mismatch
      - id: adwcleaner-trial-scare-text
    unless:
      - id: metadata/signature/verified/platform/

  - id: fake-adwcleaner-persisting-scareware
    desc: Fake AdwCleaner scareware masquerade
    crit: hostile
    conf: 0.98
    attack: T1036.005,T1547.001
    all:
      - id: adwcleaner-brand-masquerade
      - id: "micro-behaviors/os/registry/autostart/reference::windows-run-key-path"
    any:
      - id: adwcleaner-trial-scare-text
      - id: objectives/impact/ransom/scareware::fakeav-verdict-text
      - id: micro-behaviors/communications/url/resource-path/file::url-php-endpoint-binary
    unless:
      - id: metadata/signature/verified/platform/
