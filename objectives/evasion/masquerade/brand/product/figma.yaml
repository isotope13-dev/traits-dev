# A loader that conceals an encrypted payload while its ad-hoc code signature
# claims the Figma brand is posing as Figma software. Legitimate Figma desktop
# components ship real Developer-ID signatures and do not hide AES-GCM staging
# behind an ad-hoc identity.
defaults:
  platforms: [macos]
  for: [macho]
  attack: T1036

composite_rules:
  - id: figma-brand-concealed-payload-loader
    desc: Figma-branded concealed-payload Mach-O loader
    crit: hostile
    conf: 0.95
    all:
      - id: metadata/binary/signing::figma-identifier-prefix
      - id: objectives/anti-static/obfuscation/payload/loader::macho-adhoc-concealed-payload-loader
