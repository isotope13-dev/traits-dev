# A loader that conceals an encrypted payload while its ad-hoc code signature
# claims the MySQL brand is posing as MySQL software. Oracle ships MySQL
# desktop components under its own Developer-ID signature; an ad-hoc
# MySQL-branded identity with AES-GCM staging is loader tooling.
defaults:
  platforms: [macos]
  for: [macho]
  attack: T1036

composite_rules:
  - id: mysql-brand-concealed-payload-loader
    desc: MySQL-branded concealed-payload Mach-O loader
    crit: hostile
    conf: 0.95
    all:
      - id: metadata/binary/signing::mysql-identifier-prefix
      - id: objectives/anti-static/obfuscation/payload/loader::macho-adhoc-concealed-payload-loader
