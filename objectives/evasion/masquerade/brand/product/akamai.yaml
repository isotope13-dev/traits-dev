# A loader that conceals an encrypted payload while its ad-hoc code signature
# claims the Akamai brand is posing as Akamai software. Akamai signs its Mac
# agents under its own Developer-ID; an ad-hoc `com.akamai.*` identity on a
# concealed-payload loader is loader tooling dressing (Foxveil-family builds).
defaults:
  platforms: [macos]
  for: [macho]
  attack: T1036

composite_rules:
  - id: akamai-brand-concealed-payload-loader
    desc: Akamai-branded concealed-payload Mach-O loader
    crit: hostile
    conf: 0.95
    all:
      - id: metadata/signature/claim/id::akamai-identifier-prefix
    any:
      - id: objectives/anti-static/obfuscation/payload/loader::macho-adhoc-concealed-payload-loader
      - id: objectives/anti-static/obfuscation/payload/loader::macho-adhoc-icache-flush-concealed-loader
      - id: objectives/anti-static/obfuscation/payload/loader::macho-adhoc-aes-gcm-concealed-loader
