# Claude product-identity abuse: a setup tool operating on Claude Desktop
# configuration while pinning the client's inference to a lookalike
# non-vendor origin and dressing it with spoofed product identity
# (managed display name and a relabeled model catalog). A legitimate
# Claude-adjacent tool may touch the Desktop config and may even point
# at an endpoint, but it never pairs that config access with a lookalike
# origin plus spoofed display identity in one file. Deliberately omit
# package names and the exact gateway domain: the lookalike-origin
# pattern and the managed-config schema keys carry the conviction, so a
# rebrand or new domain still matches.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  attack: T1036

composite_rules:
  - id: claude-branded-lookalike-gateway-setup
    desc: Claude-branded setup pins lookalike inference gateway
    crit: hostile
    conf: 0.97
    scope: file
    all:
      - id: micro-behaviors/communications/http/llm::anthropic-branded-off-vendor-origin-literal
      - id: micro-behaviors/data/config/write::inference-gateway-base-url-assignment
      - id: micro-behaviors/data/config/write::gateway-display-subtitle-assignment
      - id: micro-behaviors/data/config/write::gateway-model-catalog-label-override
    # Either spelling of the Desktop config access satisfies the
    # config-access role: direct verb window or directory join segment.
    any:
      - id: micro-behaviors/fs/path/agent-config/file::claude-desktop-config-path
      - id: micro-behaviors/fs/path/agent-config/file::claude-desktop-config-join-segment
