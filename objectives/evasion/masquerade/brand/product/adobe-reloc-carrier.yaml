# Adobe branding paired with an unsigned executable relocation payload.
defaults:
  platforms: [windows]
  for: [pe]

composite_rules:
  - id: unsigned-adobe-branded-reloc-payload
    desc: Unsigned Adobe-branded PE conceals executable relocation payload
    crit: hostile
    conf: 0.98
    attack: T1036.005,T1027.002
    all:
      - id: metadata/binary/resource/identity::adobe-reader-resource-text
      - id: metadata/binary/section/entropy::large-high-entropy-rwx-reloc
      - id: metadata/signed/trust-level::unsigned-missing-signature-record
    any:
      - id: objectives/anti-static/obfuscation/payload/section/layout::encrypted-reloc-payload-carrier
      - id: metadata/binary/section/layout::reloc-payload-geometry
      - id: metadata/binary/provenance/version-info::adobe-acrobat-updater-text
      - id: micro-behaviors/fs/path/basename::adobe-arm-executable-name
    unless:
      - id: metadata/signed/platform/
