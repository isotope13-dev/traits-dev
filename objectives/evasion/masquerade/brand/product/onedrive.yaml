# Pages that steal OneDrive branding/chrome while delivering an embedded or
# smuggled payload. A legitimate OneDrive sharing page does not embed a Base64
# archive and decode it client-side into a forced browser download.
defaults:
  platforms: [windows, unix]
  for: [html]
  attack: T1036,T1566.002
  crit: notable
  conf: 0.95

traits:
  - id: onedrive-page-title
    desc: Page title claims OneDrive
    crit: notable
    if:
      type: text
      regex: '(?i)<title>\s*OneDrive\s*</title>'

  - id: onedrive-api-preconnect
    desc: Preconnect link to OneDrive API
    crit: notable
    if:
      type: text
      regex: '(?i)https?://api\.onedrive\.com'

  - id: onedrive-item-title-assignment
    desc: JavaScript sets dynamic OneDrive item title
    crit: notable
    if:
      type: text
      regex: '(?i)\.innerText\s*=\s*[^;\n]{0,80}\bOneDrive\b'

composite_rules:
  - id: onedrive-chrome-smuggled-archive
    desc: OneDrive brand chrome smuggles a Base64 archive
    crit: hostile
    conf: 0.98
    attack: T1036,T1027.006,T1204.002
    all:
      - id: metadata/file/encoding/compression::base64-zip-string-assignment
      - id: micro-behaviors/data/decode/base64::base64-decode-call-text
    any:
      - id: onedrive-page-title
      - id: onedrive-api-preconnect
      - id: onedrive-item-title-assignment
  # The scriptless twin of the archive smuggler above: OneDrive file-share
  # chrome around a data: application/octet-stream anchor that names a WSF
  # file, so the "shared document" downloads straight from the page with no
  # script, fetch, or decode step for a scanner to see.
  - id: onedrive-chrome-smuggled-script
    desc: OneDrive brand chrome smuggles a script download
    crit: hostile
    conf: 0.97
    attack: T1036,T1027.006,T1204.002
    all:
      - id: objectives/command-and-control/dropper/delivery/html::html-downloads-wsf
      - id: micro-behaviors/communications/url/encoded::inline-application-or-font-data-uri
    any:
      - id: onedrive-page-title
      - id: onedrive-api-preconnect
      - id: onedrive-item-title-assignment
