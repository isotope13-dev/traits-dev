defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]

composite_rules:
  # Suspicious substitution: VPN-named installation records feed a desktop
  # Internet Shortcut writer. This does not claim credential theft, malicious
  # dependencies, or that the URL destinations are all identical.
  - id: vpn-catalog-desktop-web-shortcuts
    desc: VPN catalog creates branded desktop web links
    crit: suspicious
    conf: 0.94
    attack: T1036
    all:
      - id: metadata/file/profile/catalog::vpn-shortcut-install-catalog
      - id: micro-behaviors/fs/file/create::desktop-internet-shortcut-write
