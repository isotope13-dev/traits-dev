defaults:
  platforms: [windows]
  for: [pe]
  attack: T1036.005
  mbc: B0013

traits:
  - id: unity-player-import
    desc: Imports UnityPlayer.dll
    crit: notable
    conf: 1.0
    if:
      type: text
      word: UnityPlayer.dll
  - id: unity-player-pdb-path
    desc: Unity Player PDB path string
    crit: component
    conf: 0.95
    if:
      type: text
      word: WindowsPlayer_player_Master_il2cpp_x64.pdb

composite_rules:
  - id: graphics-dll-ref
    desc: Reference to graphics DLLs
    crit: notable
    conf: 1.0
    any:
      - id: micro-behaviors/os/module/load::d3d11-dll-reference
      - id: micro-behaviors/os/module/load::opengl32-dll-reference
  # Both legs are now required. The GPU-preference export alone said nothing
  # about Unity -- NvOptimusEnablement / AmdPowerXpressRequestHighPerformance
  # are the vendor-documented hybrid-graphics opt-in that every discrete-GPU
  # application declares, so OBS Studio's `obs-amf-test.exe` AMF encoder probe
  # (a console helper with a handful of imports and no user32) was reported as
  # a Unity masquerade. The Unity claim has to come from Unity evidence: the
  # IL2CPP master player PDB path, in a binary that then fails to import the
  # Unity runtime or any UI surface.
  - id: unity-masquerade-hollow-gui
    desc: Unity player PDB without Unity runtime or UI imports
    crit: suspicious
    conf: 0.96
    all:
      - id: unity-player-pdb-path
      - id: micro-behaviors/hardware/gpu::discrete-gpu-preference-export
    unless:
      # Wine builtin DLLs reimplement the Windows API surface and carry the originals metadata by design.
      - id: metadata/binary/vendor::windows-system-implementer-dll
      - id: unity-player-import
      - id: micro-behaviors/os/module/load::user32-dll-reference
      - id: metadata/binary/metrics/structural::many-imports
      - id: metadata/binary/framework/
