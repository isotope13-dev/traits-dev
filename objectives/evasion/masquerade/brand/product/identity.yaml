# Brand-confusion masquerade: a PE version resource advertises a vendor or
# product identity that contradicts the actual vendor/product pairing.
#
# The neutral vendor/product markers these compose over live in
# vendor metadata and well-known product directories. They are
# facts about what a version resource says, not accusations, and a genuine
# signed product matches them -- so they must not sit in this objective. Only
# the contradiction is an evasion signal, and that is what stays here.
defaults:
  platforms: [windows]
  for: [pe]
  crit: notable
  conf: 0.9

traits:
  - id: kixdhfzron-single-instance-mutex
    desc: Hardcoded kixdhfzron mutex
    if:
      type: text
      exact: \BaseNamedObjects\kixdhfzron9fbmr4
      section: .rdata

composite_rules:
  - id: brand-confusion-cpuid-hwinfo
    desc: Brand confusion (CPUID Company vs HWiNFO Product)
    crit: suspicious
    conf: 0.95
    all:
      - id: metadata/vendor/identity::cpuid-company-version-value
      - id: well-known/app/utility/hwinfo::hwinfo-product-version-value
    # HWiNFO is made by REALiX, not CPUID.

  - id: realtek-rtkaudio-loader-masquerade
    desc: Realtek rtkaudio loader masquerade
    crit: hostile
    conf: 0.99
    all:
      - id: well-known/app/system/drivers/realtek::realtek-rtkaudio-resource-context
      - id: metadata/binary/symbols/exports::export-dll-register-server
      - id: kixdhfzron-single-instance-mutex
    unless:
      - id: metadata/signature/verified/platform/
  - id: dropper-masquerading-as-hardware-tool
    desc: Dropper masquerading as hardware monitor (CPUID/HWiNFO mix)
    crit: hostile
    conf: 0.99
    all:
      - id: brand-confusion-cpuid-hwinfo
      - id: metadata/binary/layout/ratio::overlay-over-35pct
    any:
      - id: metadata/binary/layout/checksum::pe-checksum-zeroed
      - id: metadata/signature/absent::unsigned
    unless:
      - id: metadata/binary/layout/ratio::pe-signature-present
    # Legit HWiNFO or CPUID are always signed and don't mix brands or have zeroed checksums.

  - id: hardware-tool-native-stage-loader
    desc: Hardware-tool masquerade carries a native memory stage loader
    crit: hostile
    conf: 0.99
    attack: T1574.002
    all:
      - id: brand-confusion-cpuid-hwinfo
      - id: metadata/binary/layout/overlay::large-high-entropy-overlay
      - id: micro-behaviors/mem/combined::virtual-memory-allocation-protection-api-pair
      - id: micro-behaviors/process/create/exec::child-process-creation-evidence
    unless:
      - id: metadata/signature/verified/platform/

  - id: hardware-tool-delphi-inno-tamper
    desc: Unsigned CPUID/HWiNFO masquerade uses a tampered Inno/Delphi package
    crit: hostile
    conf: 0.99
    attack: T1036.004
    all:
      - id: brand-confusion-cpuid-hwinfo
      - id: well-known/tool/packaging/inno-setup-runtime::inno-delphi-installer-foundation
      - id: metadata/binary/layout/checksum::pe-checksum-zeroed
      - id: metadata/signature/absent::unsigned
    unless:
      - id: metadata/signature/verified/platform/

  - id: microsoft-masquerade-malware-description
    desc: Microsoft masquerade with malware self-description
    crit: hostile
    conf: 0.99
    attack: T1036.004
    all:
      - id: metadata/vendor/string::microsoft-corp-marker-rsrc
      - id: metadata/lang/natural/vocabulary/security::description-malware-related-term
    # Microsoft never calls its own binaries malware in the description.
    # This contradiction is diagnostic of a masquerading dropper.
    unless:
  # Microsoft Defender update stubs legitimately identify their product as
  # "Microsoft Malware Protection". The verified Microsoft platform signer
  # is the distinguishing benign context.
      - id: metadata/signature/verified/platform::microsoft
      - id: well-known/lib/platform/microsoft-amsiproxy::microsoft-amsiproxy-system-context
      - id: well-known/lib/platform/microsoft-amsi::microsoft-amsi-system-context
