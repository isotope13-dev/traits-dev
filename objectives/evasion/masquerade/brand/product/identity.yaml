# Brand-confusion masquerade: a binary advertising one vendor's identity while
# other evidence contradicts it.
#
# The neutral vendor/product markers these compose over live in
# metadata/binary/vendor/ (cpuid.yaml, realix.yaml, realtek.yaml). They are
# facts about what a version resource says, not accusations, and a genuine
# signed product matches them -- so they must not sit in this objective. Only
# the contradiction is an evasion signal, and that is what stays here.
defaults:
  platforms: [windows]
  for: [pe]
  crit: notable
  conf: 0.9

traits:
- id: file-description-malware--rx-1
  desc: FileDescription malware or trojan keyword
  crit: component
  if:
    type: value
    path: pe.version.description
    regex: "(?i)\\b(malware|trojan)\\b"
  unless:
    - id: well-known/lib/platform/microsoft-amsiproxy::microsoft-amsiproxy-system-context
    - id: well-known/lib/platform/microsoft-amsi::microsoft-amsi-system-context

  count_max: 1027960
- id: file-description-malware--rx-2
  desc: FileDescription backdoor or injector keyword
  crit: component
  if:
    type: value
    path: pe.version.description
    regex: "(?i)\\b(backdoor|injector)\\b"

  count_max: 1027961
- id: file-description-malware--rx-3
  desc: FileDescription keylogger or stealer keyword
  crit: component
  if:
    type: value
    path: pe.version.description
    regex: "(?i)\\b(keylog|stealer)\\b"

  count_max: 1027962

# A hardcoded random-looking mutex from one rtkaudio loader family. Kept here
# rather than in vendor metadata: it is an attack-specific artifact with no
# meaning outside this masquerade context.
- id: kixdhfzron-single-instance-mutex
  desc: Hardcoded kixdhfzron mutex
  if:
    type: text
    exact: \BaseNamedObjects\kixdhfzron9fbmr4
    section: .rdata

composite_rules:
- id: brand-confusion-cpuid-hwinfo
  desc: Brand confusion (CPUID Company vs HWiNFO Product)
  crit: suspicious
  conf: 0.95
  all:
  - id: metadata/binary/vendor::cpuid-company-marker-rsrc
  - id: metadata/binary/vendor::hwinfo-product-marker-rsrc
    # HWiNFO is made by REALiX, not CPUID.

- id: brand-confusion-cpuid-mismatch
  desc: CPUID product name mismatch
  crit: notable
  conf: 0.8
  all:
  - id: metadata/binary/vendor::cpuid-company-marker-rsrc
  - id: metadata/package/versioning::pe-productname-field
  unless:
  - id: metadata/binary/vendor::hwmonitor-product-marker-rsrc
  - id: metadata/binary/vendor::cpu-z-product-marker-rsrc
    # CPUID usually makes HWMonitor or CPU-Z.

- id: brand-confusion-realtek-mismatch
  desc: Realtek product name mismatch
  crit: suspicious
  conf: 0.8
  all:
  - id: metadata/binary/vendor::realtek-company-marker-rsrc
  - id: metadata/file/string/identity::tool-identity-intel
    # Often malware mixes Realtek/Intel strings in version info.

- id: brand-confusion-realtek-rtkaudio
  desc: Realtek rtkaudio service identity
  crit: suspicious
  conf: 0.97
  all:
  - id: metadata/binary/vendor::realtek-company-marker-rsrc
  - id: metadata/binary/vendor::realtek-audio-service-label
  any:
  - id: metadata/binary/vendor::realtek-rtkaudio-filename
  - id: metadata/binary/vendor::realtek-rtkaudio-manifest
- id: realtek-rtkaudio-loader-masquerade
  desc: Realtek rtkaudio loader masquerade
  crit: hostile
  conf: 0.99
  all:
  - id: brand-confusion-realtek-rtkaudio
  - id: metadata/binary/symbols/exports::export-dll-register-server
  - id: kixdhfzron-single-instance-mutex
  unless:
  - id: metadata/signed/platform/
- id: realtek-com-registration-suspicious
  desc: Realtek identity exposes COM registration export
  crit: suspicious
  conf: 0.96
  attack: T1036.004
  all:
  - id: brand-confusion-realtek-rtkaudio
  - id: metadata/binary/symbols/exports::export-dll-register-server
  unless:
  - id: metadata/signed/platform/
- id: realtek-com-registration-masquerade
  desc: Unsigned Realtek COM registration masquerade
  crit: hostile
  conf: 0.98
  attack: T1036.004
  all:
  - id: realtek-com-registration-suspicious
  - id: metadata/signed/trust-level::unsigned
  unless:
  - id: metadata/signed/platform/

- id: dropper-masquerading-as-hardware-tool
  desc: Dropper masquerading as hardware monitor (CPUID/HWiNFO mix)
  crit: hostile
  conf: 0.99
  all:
  - id: brand-confusion-cpuid-hwinfo
  - id: metadata/binary/layout::overlay-over-35pct
  any:
  - id: metadata/binary/layout::pe-checksum-zeroed
  - id: metadata/signed/adhoc::unsigned
  unless:
  - id: metadata/binary/layout::pe-signature-present
    # Legit HWiNFO or CPUID are always signed and don't mix brands or have zeroed checksums.

- id: microsoft-masquerade-malware-description
  desc: Microsoft masquerade with malware self-description
  crit: hostile
  conf: 0.99
  attack: T1036.004
  all:
  - id: metadata/binary/vendor::microsoft-corp-marker-rsrc
  - id: file-description-malware
    # Microsoft never calls its own binaries malware in the description.
    # This contradiction is diagnostic of a masquerading dropper.
  unless:
  # Microsoft Defender update stubs legitimately identify their product as
  # "Microsoft Malware Protection". The verified Microsoft platform signer
  # is the distinguishing benign context.
  - id: metadata/signed/platform::microsoft
  - id: well-known/lib/platform/microsoft-amsiproxy::microsoft-amsiproxy-system-context
  - id: well-known/lib/platform/microsoft-amsi::microsoft-amsi-system-context
- id: file-description-malware
  desc: FileDescription contains malware indicator
  crit: notable
  conf: 1.0
  any:
  - id: file-description-malware--rx-1
  - id: file-description-malware--rx-2
  - id: file-description-malware--rx-3
  unless:
  - id: well-known/lib/platform/microsoft-amsi::microsoft-amsi-system-context
