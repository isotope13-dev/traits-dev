# Pages that steal SharePoint branding/chrome while harvesting credentials.
# A legitimate SharePoint sign-in posts to its own tenant; relaying the
# username and password to a hardcoded third-party URL via script is the
# kit's collection path, not a sign-in's.
defaults:
  platforms: [windows, unix]
  for: [html]
  attack: T1036,T1566.002
  crit: notable
  conf: 0.95
traits:
  - id: sharepoint-page-title
    desc: Page title claims SharePoint
    crit: notable
    if:
      type: text
      regex: '(?i)<title>[^<]{0,60}SharePoint[^<]{0,20}</title>'
composite_rules:
  - id: sharepoint-branded-credential-relay
    desc: SharePoint-branded login relays credentials
    crit: hostile
    conf: 0.96
    attack: T1036,T1056.002,T1041,T1566.002
    all:
      - id: sharepoint-page-title
      - id: objectives/credential-access/phishing/external-provider::ajax-credential-harvest-relay
