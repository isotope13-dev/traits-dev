# A loader that conceals an encrypted payload while its ad-hoc code signature
# claims a Microsoft identity is posing as Microsoft software. Microsoft signs
# its Mac apps under its own Developer-ID; an ad-hoc `com.microsoft.*`
# identifier, TeamID-dressed or bare, with concealed staging is loader tooling.
defaults:
  platforms: [macos]
  for: [macho]
  attack: T1036

composite_rules:
  - id: microsoft-brand-concealed-payload-loader
    desc: Microsoft-branded concealed-payload Mach-O loader
    crit: hostile
    conf: 0.95
    all:
      - id: metadata/signature/claim/id::microsoft-identifier-prefix
    any:
      - id: objectives/anti-static/obfuscation/payload/loader::macho-adhoc-concealed-payload-loader
      - id: objectives/anti-static/obfuscation/payload/loader::macho-adhoc-icache-flush-concealed-loader
      - id: objectives/anti-static/obfuscation/payload/loader::macho-adhoc-aes-gcm-concealed-loader
