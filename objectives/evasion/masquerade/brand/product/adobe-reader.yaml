# Pages that steal Adobe Reader branding/chrome while gating a concealed
# payload behind a displayed document password. A legitimate Adobe Reader
# download page links to Adobe-hosted installers; a Reader-titled page that
# shows an extraction password next to a hidden bulk blob is the kit's
# lure, not a download.
defaults:
  platforms: [windows, unix]
  for: [html]
  attack: T1036,T1566.002
  crit: notable
  conf: 0.95

traits:
  - id: adobe-reader-page-title
    desc: Page title claims Adobe Reader
    crit: notable
    if:
      type: text
      regex: '(?i)<title>\s*Adobe Reader\s*</title>'

composite_rules:
  - id: adobe-reader-password-blob-lure
    desc: Adobe Reader lure gates a hidden password blob
    crit: hostile
    conf: 0.97
    attack: T1036,T1027.006,T1204.002,T1566.002
    all:
      - id: adobe-reader-page-title
      - id: micro-behaviors/ui/window/display::password-label-text
      - id: micro-behaviors/data/format/html::concealed-bulk-encoded-blob
