# Pages that steal Adobe Reader branding/chrome while gating a concealed
# payload behind a displayed document password. A legitimate Adobe Reader
# download page links to Adobe-hosted installers; a Reader-titled page that
# shows an extraction password next to a hidden bulk blob is the kit's
# lure, not a download.
defaults:
  platforms: [windows, unix]
  for: [html]
  attack: T1036,T1566.002
  crit: notable
  conf: 0.95

traits:
  - id: adobe-reader-page-title
    desc: Page title claims Adobe Reader
    crit: notable
    if:
      type: text
      regex: '(?i)<title>\s*Adobe Reader\s*</title>'

  - id: adobe-reader-download-url-spoof
    desc: Spoofs Adobe Reader download URL
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: '(?i)https?://get\.adobe\.com/reader/download\b'

composite_rules:
  - id: adobe-reader-password-blob-lure
    desc: Adobe Reader lure gates a hidden password blob
    crit: hostile
    conf: 0.97
    attack: T1036,T1027.006,T1204.002,T1566.002
    all:
      - id: adobe-reader-page-title
      - id: micro-behaviors/ui/window/display::password-label-text
      - id: micro-behaviors/data/format/html::concealed-bulk-encoded-blob

  - id: browser-in-browser-adobe-reader-delivery
    desc: Fake browser delivers Adobe-lured installer
    crit: hostile
    conf: 0.98
    attack: T1036.005,T1189,T1566.002
    all:
      - id: micro-behaviors/ui/window/markup::synthetic-browser-window-chrome
      - id: adobe-reader-download-url-spoof
      - id: objectives/credential-access/phishing/captive-portal::installer-download-link
    unless:
      - id: well-known/tool/detection/
      - id: metadata/package/testing/presence/fixture/
