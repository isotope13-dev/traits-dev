# Pages that steal Office 365 / Microsoft 365 branding while delivering an
# embedded or smuggled payload behind a document-access or preview lure.
# A legitimate Office 365 sharing page does not embed an encrypted archive
# or disk image in hidden inputs and trigger a client-side download while
# displaying an extraction password.
defaults:
  platforms: [windows, unix]
  for: [html]
  attack: T1036,T1566.002
  crit: notable
  conf: 0.95

composite_rules:
  - id: office-365-password-blob-lure
    desc: Office 365 lure gates a hidden password payload
    crit: hostile
    conf: 0.98
    attack: T1036,T1027.006,T1204.002,T1566.002
    all:
      - id: metadata/document/html::office-365-page-title
      - id: micro-behaviors/ui/window/display::password-label-text
    any:
      - id: micro-behaviors/ui/window/markup::large-hidden-base64-input-values
      - id: micro-behaviors/data/format/html::concealed-bulk-encoded-blob
      - id: metadata/file/encoding::base64-zip-encrypted-entry

  - id: office-365-smuggled-archive-lure
    desc: Office 365 lure smuggles an encrypted archive
    crit: hostile
    conf: 0.98
    attack: T1036,T1027.006,T1204.002,T1566.002
    all:
      - id: metadata/document/html::office-365-page-title
      - id: metadata/file/encoding::base64-zip-encrypted-entry
      - id: micro-behaviors/data/buffer/alloc::blob-construction
