# Pages that steal Dropbox branding/chrome while delivering a smuggled
# payload. A legitimate Dropbox sharing page links back to Dropbox-hosted
# content; a page wearing the Dropbox title that hands the visitor a script
# file straight from a data: URL is the kit's delivery path, not a share.
defaults:
  platforms: [windows, unix]
  for: [html]
  attack: T1036,T1566.002
  crit: notable
  conf: 0.95

traits:
  - id: dropbox-page-title
    desc: Page title claims Dropbox
    crit: notable
    if:
      type: text
      regex: '(?i)<title>\s*DropBox\s*</title>'

composite_rules:
  # The scriptless twin of the OneDrive archive smuggler: Dropbox file-share
  # chrome around a data: application/octet-stream anchor that names a .js
  # file, so the "shared document" downloads straight from the page with no
  # script, fetch, or decode step for a scanner to see.
  - id: dropbox-chrome-smuggled-script
    desc: Dropbox brand chrome smuggles a script download
    crit: hostile
    conf: 0.97
    attack: T1036,T1027.006,T1204.002
    all:
      - id: dropbox-page-title
      - id: objectives/command-and-control/dropper/delivery/html::html-downloads-js
      - id: micro-behaviors/communications/url/encoded::inline-application-or-font-data-uri
