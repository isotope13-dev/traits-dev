# Pages that steal Google Drive branding/chrome while delivering an embedded or
# smuggled payload. A legitimate Google Drive page does not mount an SVG embed
# data URI carrier or decode client-side download payloads.
defaults:
  platforms: [windows, unix]
  for: [html]
  attack: T1036,T1566.002
  crit: notable
  conf: 0.95

traits:
  - id: google-drive-page-title
    desc: Page title claims Google Drive
    crit: notable
    if:
      type: text
      regex: '(?i)<title>\s*(Google\s+)?Drive\s*</title>'

  - id: google-drive-header-title
    desc: Page heading claims My Drive
    crit: notable
    if:
      type: text
      regex: '(?i)<h[1-6][^>]{0,50}>\s*(My\s+)?Drive\s*</h[1-6]>'

composite_rules:
  - id: google-drive-chrome-smuggled-carrier
    desc: Google Drive chrome mounts smuggled carrier
    crit: hostile
    conf: 0.98
    attack: T1036,T1027.006,T1204.002
    all:
      - id: micro-behaviors/data/collection/dom::dom-create-embed-element
      - id: micro-behaviors/data/collection/dom::set-attribute-src-data-uri
    any:
      - id: google-drive-page-title
      - id: google-drive-header-title
