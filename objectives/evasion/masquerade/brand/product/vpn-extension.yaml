# A browser add-on presented as an established VPN but wired to Prado VPN's
# unrelated service is direct product-identity substitution. The neutral app
# identities remain under well-known/app; this objective supplies the deception.
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript, chrome-manifest]
  attack: T1036,T1656

composite_rules:
  # These are two contradictory provider identities, not arbitrary relay
  # domains: a manifest claiming the established Amnezia team ships a working
  # SOCKS5 relay whose own UI names the unrelated Myxa VPN service. Domains,
  # extension IDs, chosen filenames and the relay's port are not required.
  - id: amnezia-author-myxa-provider-substitution
    for: [chrome-manifest, html, javascript, crx, xpi, zip]
    desc: Claimed Amnezia author supplies Myxa VPN relay
    crit: hostile
    conf: 0.99
    scope: archive
    all:
      - id: metadata/package/author/identity::amnezia-vpn-manifest-author
      - id: metadata/lang/natural/vocabulary/content-word::myxa-vpn-markup-label
      - id: micro-behaviors/os/network/webextension::extension-fixed-socks5-browser-relay

  - id: prado-service-established-vpn-brand-substitution
    for: [javascript, typescript, chrome-manifest, crx, xpi, zip]
    desc: Prado replaces an established VPN brand
    crit: hostile
    conf: 0.99
    scope: archive
    all:
      - id: well-known/app/browser-extension/prado-vpn::extension-infrastructure
      - id: metadata/permission/extension-api::permission-proxy
    any:
      - id: well-known/app/browser-extension/vpnly::display-name
      - id: well-known/app/browser-extension/urban-vpn::display-name
      - id: well-known/app/browser-extension/uvpn::display-name
