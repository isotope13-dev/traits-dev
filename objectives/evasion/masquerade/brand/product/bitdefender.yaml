# An unsigned, packed stub whose version resource names BitDefender as the
# company while the product calls itself Argon (Kr.exe / Kry.exe) borrows a
# security vendor's trust the way rogue-antivirus droppers do: the claim,
# the unsigned image, and the sparse-import packed stub travel together.
# Genuine BitDefender binaries are signed by BitDefender, so the unsigned
# leg below excludes them.
defaults:
  platforms: [windows]
  for: [pe]
composite_rules:
  - id: unsigned-packed-bitdefender-masquerade
    desc: Unsigned packed BitDefender masquerade
    crit: hostile
    conf: 0.97
    attack: T1036.005
    all:
      - id: micro-behaviors/os/security/product::bitdefender-name-reference
      - id: metadata/signed/trust-level::unsigned-missing-signature-record
      # Keep the packed-image evidence here: packing and version resources
      # alone do not establish a borrowed identity.
      - id: metadata/binary/section/label::upx-section-pair
      - id: metadata/binary/section/label::long-lowercase-section-name
      - id: metadata/binary/code/entropy::sparse-import-high-code-entropy
      - id: metadata/binary/provenance/version-info::pe-companyname-field
      - id: metadata/binary/provenance/version-info::pe-productname-field
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/installer/family/
      - id: well-known/lib/vendor-sdk/alibaba-securityguard::securityguard-signed-windows-library
