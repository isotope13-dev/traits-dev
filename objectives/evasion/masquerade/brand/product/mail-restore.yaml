# An offsite restore-mail action paired with Microsoft branding indicates
# impersonation. Suspicious: third-party administrators can use this markup.
# No credential collection or payload execution is inferred.
defaults:
  platforms: [windows, unix]
  for: [html]
composite_rules:
  - id: microsoft-offsite-mail-restore
    desc: Microsoft branding links offsite mail restore
    crit: suspicious
    conf: 0.95
    attack: T1036,T1566.002
    near_bytes: 2048
    all:
      - id: well-known/app/system/microsoft-brand::ms-logo-brand-colours
      - id: micro-behaviors/ui/window/navigation/anchor::offsite-mail-restoration-anchor
