defaults:
  platforms: [windows]
  for: [pe, dll]
  attack: T1036

composite_rules:
  - id: unsigned-dotnet-telegram-product-impersonator
    desc: Unsigned .NET Telegram impersonator with network and crypto
    crit: hostile
    conf: 0.99
    attack: T1036,T1027.009,T1071.001
    all:
      - id: well-known/app/telegram::telegram-desktop-official-client
      - id: metadata/binary/framework::dotnet-assembly
      - id: metadata/signed/trust-level::unsigned
      - id: micro-behaviors/data/embedded/payload/resource::dotnet-managed-resource-access
      - id: micro-behaviors/communications/http/client/managed::httpclient
      - id: micro-behaviors/crypto/symmetric/aes/library::dotnet-rijndael-any
    unless:
      - id: metadata/signed/platform/
      - id: metadata/signed/developer/
