defaults:
  platforms: [windows]
  for: [pe, dll]
  attack: T1036

composite_rules:
  - id: unsigned-dotnet-telegram-product-impersonator
    desc: Unsigned .NET Telegram impersonator with network and crypto
    crit: hostile
    conf: 0.99
    attack: T1036,T1027.009,T1071.001
    all:
      - id: well-known/app/communication/telegram::telegram-desktop-official-client
      - id: metadata/lang/compiler/managed::dotnet-assembly
      - id: metadata/signature/absent::unsigned
      - id: micro-behaviors/data/embedded/resource::dotnet-managed-resource-access
      - id: micro-behaviors/communications/http/client/managed::httpclient
      - id: micro-behaviors/crypto/symmetric/aes/reference::dotnet-rijndael-any
    unless:
      - id: metadata/signature/verified/platform/
      - id: metadata/signature/verified/developer/
