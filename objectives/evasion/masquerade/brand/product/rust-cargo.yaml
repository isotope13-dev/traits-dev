defaults:
  platforms: [windows]
  for: [cargo.toml]
  attack: T1036

composite_rules:
  - id: stripped-reddit-rust-implant
    desc: Stripped Rust implant masquerades as Reddit
    crit: hostile
    conf: 0.98
    all:
      - id: metadata/package/manifest/name::cargo-package-name-reddit
      - id: metadata/package/manifest/cargo-windows::cargo-winapi-process-snapshot-feature--tlhelp32
      - id: metadata/package/manifest/cargo-windows::cargo-winapi-registry-feature--winreg
      - id: metadata/package/manifest/cargo-windows::cargo-winapi-memory-feature
      - id: metadata/package/manifest/cargo-windows::cargo-winapi-thread-feature
      - id: metadata/package/manifest/cargo-windows::cargo-windows-debug-feature
      - id: metadata/build/ecosystem::cargo-release-strip-true
      - id: metadata/build/ecosystem::cargo-release-lto-true
