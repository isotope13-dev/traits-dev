# A loader that conceals an encrypted payload while its ad-hoc code signature
# claims the Cisco brand is posing as Cisco software. Cisco signs its
# management and VPN components under its own Developer-ID; an ad-hoc
# `fr.cisco.*` identity with concealed AES-GCM staging is loader tooling.
defaults:
  platforms: [macos]
  for: [macho]
  attack: T1036

composite_rules:
  - id: cisco-brand-concealed-payload-loader
    desc: Cisco-branded concealed-payload Mach-O loader
    crit: hostile
    conf: 0.95
    all:
      - id: metadata/binary/signing::cisco-identifier-prefix
      - id: objectives/anti-static/obfuscation/payload/loader::macho-adhoc-concealed-payload-loader
