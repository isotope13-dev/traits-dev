# A genuine product identity is neutral. Treat it as masquerading only when
# the PE is also unsigned and has the established packed-loader structure.
defaults:
  platforms: [windows]
  for: [pe]

composite_rules:
  - id: unsigned-packed-amd-crash-defender-masquerade
    desc: Unsigned packed AMD Crash Defender masquerade
    crit: hostile
    conf: 0.99
    attack: T1036.005
    all:
      - id: metadata/binary/layout::pe-no-signature-record
      - id: objectives/anti-static/obfuscation/payload/section::empty-code-dominant-packed-loader
    any:
      - id: well-known/app/system/drivers/amd-crash-defender::product-name
      - id: well-known/app/system/drivers/amd-crash-defender::tool-description
      - id: well-known/app/system/drivers/amd-crash-defender::internal-name
    needs: 2
