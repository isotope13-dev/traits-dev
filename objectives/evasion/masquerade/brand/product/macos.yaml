defaults:
  platforms: [macos]
  for: [plist, macho]
  crit: component
  conf: 0.9

# Brand-confusion detection: plist names itself as a real app (VLC, Notepad++)
# but uses a bundle identifier that doesn't match the real developer's domain.
# The match-the-expected-id traits are positive signals so the composite can
# `unless` them — standalone "mismatch" traits firing on every non-VLC plist
# were an arbitrary claim about every other macOS bundle in the world.
traits:
- id: macos-brand-confusion-vlc
  desc: VLC name with mismatched bundle ID
  if:
    type: value
    path: CFBundleName
    regex: (?i)^VLC\b
  crit: suspicious
  conf: 0.95
  unless:
  - type: value
    path: CFBundleIdentifier
    regex: ^org\.videolan\.vlc\b
- id: macos-brand-confusion-notepadpp
  desc: Notepad++ name mismatched bundle ID
  if:
    type: value
    path: CFBundleName
    exact: Notepad++
  crit: suspicious
  conf: 0.95
  unless:
  - type: value
    path: CFBundleIdentifier
    regex: ^com\.notepad-plus-plus\b
- id: macos-brand-confusion-apple-product
  desc: Apple product name, non-Apple bundle ID
  crit: suspicious
  conf: 0.93
  attack: T1036.005
  if:
    # `iTunesUpdater`, `iCloudHelper`, `SafariUpdate` -- the name a user reads
    # in the Dock and in Activity Monitor.
    type: value
    path: CFBundleName
    regex: (?i)^(iTunes|iCloud|Safari|AppleID)
  unless:
  # Apple's own bundles, which are the only ones entitled to the name.
  - type: value
    path: CFBundleIdentifier
    regex: ^com\.apple\.
- id: macos-brand-confusion-chrome
  desc: Chrome executable with mismatched bundle ID
  crit: suspicious
  conf: 0.93
  attack: T1036.005
  if:
    # Keyed on the executable rather than the name: a hand-assembled bundle
    # often carries nothing but `CFBundleExecutable`, and that is the file
    # that actually runs.
    type: value
    path: CFBundleExecutable
    regex: (?i)^Chrome$
  unless:
  - type: value
    path: CFBundleIdentifier
    regex: ^com\.google\.Chrome
- id: installer-named-bundle-executable
  desc: Bundle executable named as an installer
  crit: notable
  conf: 0.85
  if:
    type: value
    path: CFBundleExecutable
    regex: (?i)(installer|updater|setup)$
composite_rules:
# Xcode writes CFBundleIdentifier into every bundle it produces, so an .app
# without one was assembled by hand -- a binary dropped into a Contents/MacOS
# directory with a stub plist. That alone is only unusual. Paired with an
# executable named to look like an installer or updater, it is a bundle built
# to be double-clicked and trusted, which is what the shape is for.
- id: unidentified-installer-bundle
  desc: Installer-named bundle declares no identity
  crit: suspicious
  conf: 0.9
  attack: T1036.005
  all:
  - id: metadata/binary/bundle::info-plist-missing-bundle-id
  - id: installer-named-bundle-executable
