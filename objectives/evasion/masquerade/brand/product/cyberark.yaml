# CyberArk Masquerading
# Matches a brand claim in the PE version resource only. CyberArk product names
# appear as plain strings in many unrelated PAM and remote-access clients
# (vault connectors, SSO prompts), so a substring match over the whole binary
# convicts those vendors. A masquerader has to claim the brand in its identity.
defaults:
  platforms: [windows]
  for: [pe]

traits:
  - id: cyberark-company-name
    desc: CyberArk company name claim
    crit: notable
    conf: 0.95
    if:
      type: value
      path: pe.version.company
      regex: "(?i)cyberark"

  - id: cyberark-product-name
    desc: CyberArk product name claim
    crit: notable
    conf: 0.95
    if:
      type: value
      path: pe.version.product_name
      regex: "(?i)cyberark"

  - id: cyberark-file-description
    desc: CyberArk file description claim
    crit: notable
    conf: 0.93
    if:
      type: value
      path: pe.version.description
      regex: "(?i)cyberark"

  - id: cyberark-original-filename
    desc: CyberArk original filename claim
    crit: notable
    conf: 0.93
    if:
      type: value
      path: pe.version.original_filename
      regex: "(?i)cyberark"

composite_rules:
  - id: cyberark-masquerade
    desc: Binary masquerading as CyberArk software
    crit: suspicious
    conf: 0.9
    all:
      - id: metadata/signature/absent::unsigned
    any:
      - id: cyberark-company-name
      - id: cyberark-product-name
      - id: cyberark-file-description
      - id: cyberark-original-filename
    needs: 1
    unless:
      - id: metadata/signature/verified/platform/
