# Pages that steal GitHub's chrome (header, octocat, Inc. copyright) while
# the actual navigation is a third-party fetch. A real GitHub download page
# does not pull a JSON config from an unrelated host and atob it into a URL.
defaults:
  platforms: [windows, unix]
  for: [html]
  attack: T1036,T1566.002

traits:
  - id: github-inc-copyright
    desc: GitHub Inc copyright string
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)©\s*20[0-9]{2}\s*GitHub,\s*Inc'

  - id: github-zip-download-lure
    desc: GitHub-themed zip download heading
    crit: notable
    conf: 0.88
    if:
      type: text
      regex: '(?i)(download zip|preparing your download)'

composite_rules:
  - id: github-chrome-fetch-redirect
    desc: GitHub chrome wraps a fetched redirect
    crit: hostile
    conf: 0.97
    all:
      - id: github-inc-copyright
      - id: objectives/command-and-control/dropper/delivery/fetch-eval::fetch-json-field-atob
      - id: micro-behaviors/ui/window/navigation::browser-location-href-assign
    near_bytes: 8000

  - id: github-zip-lure-atob-redirect
    desc: Zip-download lure decodes a redirect
    crit: hostile
    conf: 0.96
    all:
      - id: github-zip-download-lure
      - id: objectives/command-and-control/dropper/delivery/fetch-eval::fetch-json-field-atob
      - id: micro-behaviors/ui/window/navigation::browser-location-href-assign
    near_bytes: 4000
