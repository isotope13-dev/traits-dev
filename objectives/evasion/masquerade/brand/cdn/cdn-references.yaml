defaults:
  platforms: [unix, windows]
  for: [html, javascript, typescript, php, python]
  crit: notable
  conf: 0.82

traits:
- id: cdnjs-path-lookalike-host
  desc: cdnjs-style path on a lookalike CDN host
  crit: suspicious
  conf: 0.9
  if:
    type: text
    regex: 'src=[''"]https?://[a-z0-9.-]{0,60}cloudflare[a-z0-9.-]{0,40}/ajax/libs/'
  not:
  - regex: '(?i)cdnjs\.cloudflare\.com/ajax/libs/'
- id: google-lookalike-script-host
  desc: Script loads from a Google-brand lookalike host
  crit: suspicious
  conf: 0.9
  if:
    type: text
    regex: '<script\b[^>]{0,160}\bsrc\s*=\s*["'']https?://[\w.-]*google[\w.-]*/'
    case_insensitive: true
    exclude_html_comments: true
  not:
  - regex: '(?i)src\s*=\s*["'']https?://([a-z0-9-]+\.)*google\.com/'
  - regex: '(?i)src\s*=\s*["'']https?://[a-z0-9.-]*\.googleapis\.com/'
  - regex: '(?i)src\s*=\s*["'']https?://apis\.google\.com/'
  - regex: '(?i)src\s*=\s*["'']https?://[a-z0-9.-]*\.googlesyndication\.com/'
  - regex: '(?i)src\s*=\s*["'']https?://[a-z0-9.-]*\.google-analytics\.com/'
  - regex: '(?i)src\s*=\s*["'']https?://[a-z0-9.-]*\.gstatic\.com/'
  - regex: '(?i)src\s*=\s*["'']https?://([a-z0-9.-]+\.)?googlecode\.com/'
  # Legacy Drive web hosting is a Google service, not a brand lookalike.
  - regex: '(?i)src\s*=\s*["'']https?://([a-z0-9.-]+\.)?googledrive\.com/'
  - regex: '(?i)src\s*=\s*["'']https?://([a-z0-9.-]+\.)?googleusercontent\.com/'
  - regex: '(?i)src\s*=\s*["'']https?://([a-z0-9.-]+\.)?googletagmanager\.com/'
  # Google Ads / Ad Manager script-serving domains: partner.googleadservices.com
  # fronts google_service.js on ordinary publisher pages (w3schools HTML copies).
  - regex: '(?i)src\s*=\s*["'']https?://[a-z0-9.-]*\.googleadservices\.com/'
  - regex: '(?i)src\s*=\s*["'']https?://[a-z0-9.-]*\.googletagservices\.com/'
  - regex: '(?i)src\s*=\s*["'']https?://([a-z0-9.-]+\.)?doubleclick\.net/'
