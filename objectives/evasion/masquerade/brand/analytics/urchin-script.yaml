# urchin.js is the historical Google Analytics library name. A script src
# that still uses that filename is masquerading as telemetry. Google's own
# copies live on google-analytics.com; the same name on a reversed
# analytics host is the injected loader, not a leftover include.
defaults:
  platforms: [windows, unix]
  for: [html]
  attack: T1036
  crit: suspicious
  conf: 0.93

traits:
  - id: urchin-js-script-src
    desc: Script src names the urchin.js library
    if:
      type: text
      regex: '(?i)<script[^>]{0,40}\bsrc=["'']https?://[^"'']{1,60}urchin\.js'
      exclude_html_comments: true
    not:
      - regex: '(?i)google-analytics\.com|googletagmanager\.com'

composite_rules:
  - id: urchin-js-reversed-analytics-host
    desc: urchin.js served by reversed analytics host
    crit: hostile
    conf: 0.96
    attack: T1189,T1036
    near_bytes: 160
    all:
      - id: urchin-js-script-src
      - id: objectives/command-and-control/beacon/network/typosquat::reversed-google-analytics-host
