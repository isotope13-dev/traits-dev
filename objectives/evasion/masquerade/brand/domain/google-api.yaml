# Google API-themed updater component naming.
defaults:
  crit: suspicious
  platforms: [windows, unix]
  for: [scripts, source, html]
  attack: T1036.003

traits:
  - id: gapi-updater-component-name
    desc: GapiUpdate or gapidriver component name
    conf: 0.92
    if:
      type: text
      regex: '(?i)\bgapi[-_]?(update|driver)'
