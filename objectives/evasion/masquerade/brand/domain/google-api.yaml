# Fake Google API component identity in domain and component names.
#
# Google's real API endpoints live under googleapis.com and google.com.
# Campaigns that want a Google-flavored update path register look-alike hosts
# — apple-googleapi.com, googleapi.click — and name their droppers
# GapiUpdate / GAPIUpdate / gapidriver, presenting ClickOnce manifests and
# DMG packages as "Google API Connector" updates. The `googleapi` stem without
# the trailing s of the genuine host, and the gapi-update/driver component
# naming, are the tells; no legitimate Google component or domain uses them.
defaults:
  platforms: [windows, unix]
  for: [scripts, source, html]
  attack: T1036.003

traits:
  - id: googleapi-domain-variant
    desc: googleapi look-alike domain
    crit: suspicious
    conf: 0.93
    if:
      type: text
      # `googleapi` immediately followed by a dot (googleapi.com) or by a
      # dash/digit host part (googleapi2.com) and a registrable TLD — but
      # never `googleapis`, whose next character is `s`. The engine's regex
      # is lookaround-free, so the negative lookahead is expressed by
      # admitting only `.`/`-`/digits after the stem.
      regex: '(?i)googleapi(\.|[-0-9][a-z0-9-]{0,9}\.)(com|net|org|pro|lat|top|xyz)\b'
  - id: gapi-updater-component-name
    desc: GapiUpdate or gapidriver component name
    crit: suspicious
    conf: 0.92
    if:
      type: text
      regex: '(?i)\bgapi[-_]?(update|driver)'
