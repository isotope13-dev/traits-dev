# Chase Online look-alike hosts. The bank's own hosts are chase.com.
# chasonline and chaseonline glue the product name onto another registrable
# domain. The bank's image CDN (images.chase.com) does not match.
defaults:
  platforms: [windows, unix]
  for: [html, text]
  attack: T1036.005

traits:
  - id: chase-online-lookalike-host
    desc: Chase Online lookalike host
    crit: suspicious
    conf: 0.93
    if:
      type: text
      regex: '(?i)https?://[a-z0-9.-]{0,40}chas[e]?online[a-z0-9.-]{0,20}\.[a-z]{2,}'
      exclude_html_comments: true
    not:
      - regex: '(?i)^https?://([a-z0-9.-]+\.)?chase\.com\b'

  # A link to a non-Chase host whose path carries the Chase name
  # (`http://unrelated.example/update.chase/index.html`): the brand moved from
  # the hostname into the path or query so a skimming reader still sees "Chase".
  - id: offsite-host-chase-named-path-link
    desc: Non-Chase host link with Chase-named path
    crit: suspicious
    conf: 0.9
    if:
      type: text
      regex: '(?i)href=.?https?://[a-z0-9.-]{1,80}/[^"''\s>]{0,160}(\bchase\b|chaseonline)'
      exclude_html_comments: true
    not:
      - regex: '(?i)^href=.?https?://[^/]*chase\.com\b'

composite_rules:
  - id: chase-brand-lookalike-host
    desc: Chase brand uses a lookalike host
    crit: hostile
    conf: 0.96
    attack: T1566.002,T1036
    near_bytes: 2500
    all:
      - id: micro-behaviors/ui/window/markup::chase-brand-reference
      - id: chase-online-lookalike-host

  # Chase-branded account-suspension mail whose call to action leaves Chase
  # for an unrelated host that only wears the brand in its path.
  - id: chase-branded-suspension-offsite-path-link
    desc: Chase suspension mail links off-site Chase-named path
    crit: hostile
    conf: 0.95
    attack: T1566.002,T1036
    all:
      - id: micro-behaviors/ui/window/markup::chase-brand-reference
      - id: offsite-host-chase-named-path-link
    any:
      - id: micro-behaviors/ui/window/markup::account-suspension-pretext
      - id: micro-behaviors/ui/window/markup::suspend-access-account-pretext
