# eBay brand lookalike hostnames and masquerading used in phishing.
defaults:
  platforms: [windows, unix]
  for: [scripts, source, html]
  attack: T1036.003

traits:
  - id: ebay-lookalike-domain
    desc: eBay look-alike hostname
    crit: suspicious
    conf: 0.93
    if:
      type: text
      regex: '(?i)https?://([a-z0-9.-]+\.)?([a-z0-9-]{1,20}ebay|ebay[a-z0-9-]{1,20})\.[a-z]{2,}'
      exclude_html_comments: true

composite_rules:
  - id: ebay-lookalike-isapi-masquerade
    desc: eBay lookalike domain mimics eBay ISAPI CGI path
    crit: hostile
    conf: 0.98
    all:
      - id: ebay-lookalike-domain
      - id: micro-behaviors/communications/url/path::ebay-isapi-cgi-path
