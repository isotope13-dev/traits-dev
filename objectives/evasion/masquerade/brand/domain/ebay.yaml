# eBay brand lookalike hostnames and masquerading used in phishing.
defaults:
  platforms: [windows, unix]
  for: [scripts, source, html]
  attack: T1036.003

traits:
  - id: ebay-lookalike-domain
    desc: eBay look-alike hostname
    crit: suspicious
    conf: 0.93
    unless:
      # Test directories and fixtures cite URLs to exercise filter engines and security checks.
      - id: "metadata/file/naming::test-directory-component"
    if:
      type: text
      # `ebay` must start the label, follow a hyphen or digit, or follow a
      # `my`/`secure` prefix. A bare letter run before it is just a word that
      # ends in "e" followed by "bay" (piratebay, archivebay, apibay).
      regex: 'https?://([a-z0-9.-]+\.)?([a-z0-9-]*([-0-9]|my|secure)ebay|ebay[a-z0-9-]{1,20})\.[a-z]{2,}'
      case_insensitive: true
      exclude_html_comments: true
    not:
      - regex: '(?i)(^|https?://|\.)ebay(img|static|rtm|objects|inc|classifieds(group)?)\.com\b'

  # A link to a non-eBay host whose path carries the eBay name as a
  # directory or dotted pseudo-host (`http://unrelated.example/update.eBay/index.html`):
  # the brand moved from the hostname into the path so a skimming reader
  # still sees "eBay". A hyphenated content slug (`/eBay-tutorials/`) is a
  # course or article title, not that path.
  - id: offsite-host-ebay-named-path-link
    desc: Non-eBay host link with eBay-named path
    crit: suspicious
    conf: 0.9
    if:
      type: text
      regex: 'href=.?https?://[a-z0-9.-]{1,60}/[^"''\s>]{0,40}\bebay([/.]|DLLupdate\b)'
      case_insensitive: true
      exclude_html_comments: true
    not:
      - regex: '(?i)^href=.?https?://[^/]*ebay'
      # The eBay organization’s own GitHub project is a legitimate off-site
      # reference, not an eBay-branded lure.
      - regex: '(?i)https?://github\.com/ebay/'

composite_rules:
  - id: ebay-lookalike-isapi-masquerade
    desc: eBay lookalike domain mimics eBay ISAPI CGI path
    crit: hostile
    conf: 0.98
    all:
      - id: ebay-lookalike-domain
      - id: micro-behaviors/communications/url/path::ebay-isapi-cgi-path
  # eBay-branded account-suspension mail whose call to action leaves eBay
  # for an unrelated host that only wears the brand in its path.
  - id: ebay-branded-suspension-offsite-brand-path-link
    desc: eBay suspension mail links off-site eBay-named path
    crit: hostile
    conf: 0.95
    attack: T1566.002,T1036
    all:
      - id: micro-behaviors/ui/window/markup::ebay-brand-reference
      - id: offsite-host-ebay-named-path-link
    any:
      - id: micro-behaviors/ui/window/markup::account-suspension-claim
      - id: micro-behaviors/ui/window/markup::suspended-account-pretext
      - id: micro-behaviors/ui/window/markup::suspend-access-account-pretext
  - id: ebay-billing-termination-offsite-path-link
    desc: eBay billing threat links an off-site path
    crit: hostile
    conf: 0.95
    attack: T1566.002,T1036
    all:
      - id: micro-behaviors/ui/window/markup::ebay-brand-reference
      - id: offsite-host-ebay-named-path-link
    any:
      - id: micro-behaviors/ui/window/markup::account-termination-threat-pretext
      - id: micro-behaviors/ui/window/markup::billing-records-update-pretext
  - id: ebay-branded-redirect-account-lure
    desc: eBay account scare links through query redirect
    crit: hostile
    conf: 0.95
    for: [html]
    attack: T1566.002,T1036
    all:
      - id: micro-behaviors/ui/window/markup::ebay-brand-reference
      - id: micro-behaviors/communications/url/path::ebay-isapi-cgi-path
      - id: micro-behaviors/communications/http/url/query::query-encoded-remote-url-value
    any:
      - id: micro-behaviors/ui/window/markup::account-limitation-pretext
      - id: micro-behaviors/ui/window/markup::account-suspension-claim
      - id: micro-behaviors/ui/window/markup::suspended-account-pretext
      - id: micro-behaviors/ui/window/markup::suspend-access-account-pretext
      - id: micro-behaviors/ui/window/markup::account-termination-threat-pretext
