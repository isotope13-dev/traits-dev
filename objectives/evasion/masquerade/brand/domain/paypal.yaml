# PayPal brand lookalike hostnames and masquerading used in phishing.
defaults:
  platforms: [windows, unix]
  for: [html, text, makefile]
  attack: T1036.005

composite_rules:
  - id: paypal-brand-lookalike-host
    desc: PayPal brand uses a lookalike host
    crit: hostile
    conf: 0.96
    attack: T1566.002,T1036
    near_bytes: 2500
    all:
      - id: micro-behaviors/ui/window/markup::paypal-brand-reference
      - id: objectives/credential-access/phishing/html-brand::paypal-lookalike-domain
  - id: paypal-brand-userinfo-host-spoof
    desc: PayPal link masks external host with userinfo
    crit: hostile
    conf: 0.97
    for: [html]
    attack: T1566.002,T1036.005
    near_bytes: 500
    all:
      - id: micro-behaviors/ui/window/markup::paypal-brand-reference
      - id: micro-behaviors/communications/url/host/name::html-href-hostlike-userinfo
      - id: micro-behaviors/ui/window/html::url-text-anchor
      - id: objectives/evasion/masquerade/traffic::userinfo-href-bare-host-link-text
