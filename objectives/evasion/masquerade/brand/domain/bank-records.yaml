defaults:
  platforms: [windows, unix]
  for: [html]
  crit: hostile
  conf: 0.98

composite_rules:
  - id: bank-branded-ip-confirmation-page
    desc: Bank imagery masks IP-hosted confirmation lure
    all:
      - id: micro-behaviors/communications/http/download/browser::bank-domain-image-source
      - id: micro-behaviors/communications/http/url/navigation::external-ip-bank-navigation-link
      - id: micro-behaviors/ui/dialog/prompt::bank-account-record-confirmation

  - id: bank-impersonal-lure-spoofed-url
    desc: Bank lure with spoofed URL anchor
    all:
      - id: micro-behaviors/ui/window/markup::impersonal-brand-user-salutation
      - id: micro-behaviors/ui/window/html::url-text-anchor
    any:
      - id: micro-behaviors/ui/window/markup::unauthorized-account-access-pretext
      - id: micro-behaviors/ui/window/markup::account-suspension-claim
      - id: micro-behaviors/ui/window/markup::account-limitation-pretext
    unless:
      - id: micro-behaviors/ui/window/html::bulk-mail-furniture-reference

  - id: bank-impersonal-lure-formatted-spoofed-url
    desc: Bank lure with formatted spoofed URL anchor
    all:
      - id: micro-behaviors/ui/window/markup::impersonal-brand-user-salutation
      - id: micro-behaviors/ui/window/html::url-text-anchor-inline-formatted
    any:
      - id: micro-behaviors/ui/window/markup::unauthorized-account-access-pretext
      - id: micro-behaviors/ui/window/markup::account-suspension-claim
      - id: micro-behaviors/ui/window/markup::account-limitation-pretext
    unless:
      - id: micro-behaviors/ui/window/html::bulk-mail-furniture-reference

  - id: bank-lure-subdomain-spoofed-url
    desc: Bank lure with subdomain-spoofed brand link
    all:
      - id: micro-behaviors/communications/http/url/navigation::subdomain-spoofed-bank-navigation-link
    any:
      - id: micro-behaviors/ui/window/markup::unauthorized-account-access-pretext
      - id: micro-behaviors/ui/window/markup::account-suspension-claim
      - id: micro-behaviors/ui/window/markup::account-limitation-pretext
      - id: micro-behaviors/ui/window/markup::certificate-wording-reference
      - id: micro-behaviors/ui/window/markup::bank-security-warning-pretext
      - id: micro-behaviors/ui/window/html::cid-embedded-image
    unless:
      - id: micro-behaviors/ui/window/html::bulk-mail-furniture-reference


