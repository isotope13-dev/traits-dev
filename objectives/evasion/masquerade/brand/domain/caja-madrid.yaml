# Caja Madrid look-alike hosts used in banking phishing.
defaults:
  platforms: [windows, unix]
  for: [html, text]
  attack: T1036.005

traits:
  # A hyphenated suffix after the bank name (cajamadrid-spain.com) is not the
  # bank's own cajamadrid.es or cajamadrid.com label.
  - id: caja-madrid-hyphen-lookalike-domain
    desc: Caja Madrid hyphenated look-alike host
    crit: suspicious
    conf: 0.93
    if:
      type: text
      regex: '(?i)https?://[a-z0-9.-]{0,40}cajamadrid-[a-z0-9.-]{1,30}\.[a-z]{2,}'
      exclude_html_comments: true

composite_rules:
  - id: caja-madrid-lookalike-suspension-lure
    desc: Caja Madrid lookalike threatens suspension
    crit: hostile
    conf: 0.96
    attack: T1566.002,T1036
    near_bytes: 2500
    all:
      - id: micro-behaviors/ui/window/markup::caja-madrid-brand-reference
      - id: caja-madrid-hyphen-lookalike-domain
      - id: micro-behaviors/ui/window/markup::spanish-account-will-be-suspended
