# Remote-control gateway hostnames dressed as Microsoft Edge WebView.
#
# Microsoft's WebView2 runtime binaries are msedgewebview2.exe and its domains
# sit under microsoft.com / msedge.net. RAT operators register
# msedgewebview1.pro-style hosts so that their C2 gateway reads as ordinary
# browser telemetry in a process list or firewall log — observed for the
# NetSupport deployment of the post-DEF CON Google Doc / DocSend campaign,
# where both gateway names resolved to one host and spoke cleartext HTTP on
# 443. The masquerade is the hostname plus a TLD Microsoft does not use.
defaults:
  platforms: [windows, unix]
  for: [scripts, source, html]
  attack: T1036.003

traits:
  - id: edgewebview-lookalike-domain
    desc: Edge WebView look-alike hostname
    crit: suspicious
    conf: 0.93
    if:
      type: text
      # msedgewebview[0-9]? on a TLD outside Microsoft's own registrations.
      regex: '(?i)msedgewebview\d{0,2}[a-z0-9-]{0,8}\.(pro|lat|top|xyz|icu|click|cfd|rest)'
