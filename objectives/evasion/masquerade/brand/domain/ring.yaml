# Ring brand lookalike hostnames and masquerading used in phishing.
defaults:
  platforms: [windows, unix]
  for: [html, text]
  attack: T1036.005

traits:
  - id: ring-lookalike-domain
    desc: Ring brand lookalike domain
    crit: suspicious
    conf: 0.93
    unless:
      - id: well-known/tool/detection/malware-signature-table::antivirus-signature-database
      - id: metadata/file/format/structured::threat-indicator-data
    if:
      type: text
      case_insensitive: true
      regex: 'https?://[a-z0-9.-]{0,30}ring-?(doorbell|protect|account)[a-z0-9.-]{0,20}\.[a-z]{2,}'
      exclude_html_comments: true
    not:
      - regex: '(?i)^https?://([a-z0-9.-]+\.)?ring\.com\b'

  # A link to a non-Ring host whose path carries the Ring name
  # (`https://unrelated.example/ring/redirecta.php`): the brand moved from
  # the hostname into the path so a skimming reader still sees "ring".
  - id: offsite-host-ring-named-path-link
    desc: Non-Ring host link with Ring-named path
    crit: suspicious
    conf: 0.9
    unless:
      - id: well-known/tool/detection/malware-signature-table::antivirus-signature-database
      - id: metadata/file/format/structured::threat-indicator-data
    if:
      type: text
      regex: '(?i)href=.?https?://[a-z0-9.-]{1,80}/[^"''\s>]{0,40}\bring([/.]|doorbell)'
      exclude_html_comments: true
    not:
      - regex: '(?i)^href=.?https?://[^/]*ring\.com\b'

composite_rules:
  - id: ring-branded-suspension-offsite-path-link
    desc: Ring suspension mail links off-site path
    crit: hostile
    conf: 0.95
    attack: T1566.002,T1036
    all:
      - id: micro-behaviors/ui/window/markup::ring-doorbell-brand-reference
      - id: offsite-host-ring-named-path-link
    any:
      - id: micro-behaviors/ui/window/markup::account-suspension-claim
      - id: micro-behaviors/ui/window/markup::suspended-account-pretext
      - id: micro-behaviors/ui/window/markup::suspend-access-account-pretext
      - id: micro-behaviors/ui/window/markup::action-required-pretext
