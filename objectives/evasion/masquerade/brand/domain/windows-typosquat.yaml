# Windows brand lookalike domains with digit substitution (typosquatting)
defaults:
  platforms: [windows, unix]
  for: [batch, powershell, text]
  attack: T1036.003

composite_rules:
  - id: brand-masquerade-windows-typosquat
    desc: Typosquatted domain masquerades as Windows
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/communications/url/reference::windows-brand-typosquat-domain
    any:
      - id: micro-behaviors/communications/http/download/cli::iwr-outfile-download
      - id: micro-behaviors/fs/path/cache::windows-inetcache-path-text
      - id: micro-behaviors/fs/path/application/executable::appdata-exe-path
