# Rebranded-freeware wrappers around an office suite.
#
# Apache OpenOffice is Apache-2.0 licensed, so redistributing it under another
# name is permitted; download portals do exactly that and monetise the
# installer. The give-away is not the launch, it is the relabelling: a small
# helper starts the suite, finds its top-level SALFRAME windows and rewrites
# their titles so the upstream product name never reaches the user. That leaves
# the user unable to tell which software they are actually running, which is
# what puts it here rather than in well-known/app/.
#
# The launcher leg already requires the suite's own program name and window
# class, so this does not fire on the suite's binaries, which have no reason to
# retitle windows they created themselves.
defaults:
  platforms: [windows]
  for: [pe]
  attack: T1036.005

composite_rules:
  - id: openoffice-window-title-relabel
    desc: OpenOffice launcher rewrites suite window titles
    # Legitimate RuExcel-style redistributions use this same skinning step;
    # the behavior is worth surfacing, but it is not hostile on its own.
    crit: suspicious
    conf: 0.9
    size_max: 8388608
    unless:
      - id: well-known/app/productivity/ruexcel::ruexcel-openoffice-wrapper
    all:
      - id: well-known/app/productivity/openoffice::openoffice-external-launcher
      - id: well-known/app/productivity/openoffice::apache-openoffice-product-name
      - id: micro-behaviors/ui/window/manage/control::set-window-text
