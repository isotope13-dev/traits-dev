defaults:
  platforms: [windows]
  for: [pe]

composite_rules:
- id: inno-driver-claim-padded-overlay
  desc: Unsigned Inno driver claim with padded overlay
  crit: suspicious
  conf: 0.99
  attack: T1036.005
  all:
  - id: objectives/evasion/masquerade/identity/installer::gpu-vendor-driver-description-claim
  - id: metadata/binary/installer/family::inno-delphi-installer-foundation
  - id: metadata/binary/layout/overlay::overlay-dominates-third
  - id: metadata/binary/layout/overlay::low-entropy-large-overlay
  - id: metadata/signed/trust-level::unsigned-missing-signature-record
  - id: objectives/anti-static/obfuscation/payload/self-read::self-read-file-chain
  - id: micro-behaviors/process/create/spawn::create-process-w
  - id: micro-behaviors/crypto/kdf/algorithm::pbkdf2
  unless:
  - id: metadata/signed/platform/
  - id: well-known/app/system/drivers/nvidia/
- id: inno-wdm-driver-low-entropy-overlay-dropper
  desc: Unsigned Inno WDM driver lure with dominant low-entropy overlay
  crit: hostile
  conf: 0.98
  attack: T1036.005,T1027.009,T1106
  all:
  - id: objectives/evasion/masquerade/identity/installer::wdm-video-capture-driver-description-claim
  - id: metadata/binary/layout/overlay::inno-delphi-dominant-overlay-profile
  - id: metadata/binary/layout/overlay::low-entropy-large-overlay
  - id: metadata/signed/trust-level::unsigned-missing-signature-record
  unless:
  - id: metadata/signed/platform/
