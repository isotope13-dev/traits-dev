defaults:
  platforms:
  - windows
  for:
  - pe
  - dll
  attack: T1036.001
  mbc: E1036
composite_rules:
- id: xor-obfuscated-mingw-microsoft-masquerade
  desc: XOR-obfuscated MinGW PE claims Microsoft authorship
  crit: hostile
  conf: 0.99
  all:
  - id: metadata/vendor/identity::microsoft-prefixed-company
  - id: metadata/signature/absent::unsigned-missing-signature-record
  - id: metadata/lang/compiler/native::mingw-built-pe
  - id: micro-behaviors/data/encode/xor::x64-key-index-dual-xor-copy-loop
  - id: micro-behaviors/communications/socket/connect/attempt::winsock-client-lifecycle
  - id: micro-behaviors/os/registry/value/write::registry-set-value-api
  unless:
  - id: metadata/signature/verified/platform/
- id: unsigned-microsoft-embedded-pe
  desc: Microsoft-branded PE with embedded RunPE loader
  crit: hostile
  conf: 0.97
  all:
  - id: metadata/signature/absent::unsigned-pe-microsoft-version-fields
  - id: metadata/binary/layout/embedded::pe-embedded
  - id: objectives/execution/payload/process-inject/hollowing/process::token-embedded-image-hollowing
  unless:
  - id: metadata/lang/compiler/managed::dotnet-assembly
