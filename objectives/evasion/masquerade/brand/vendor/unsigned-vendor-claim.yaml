# Vendor masquerade needs independent deception or loader evidence.
# An unsigned Microsoft company field with a Debug/Release PDB path or a
# default manifest also occurs in honest local builds and empty test DLLs.
# That observation lives in metadata/signed/trust-level::
# unsigned-pe-microsoft-version-fields; the attack-specific rules remain here.
defaults:
  platforms: [windows]
  for: [pe, dll]
  attack: T1036.001
  mbc: E1036

composite_rules:
  - id: xor-obfuscated-mingw-microsoft-masquerade
    desc: XOR-obfuscated MinGW PE claims Microsoft authorship
    crit: hostile
    conf: 0.99
    all:
      - id: metadata/binary/vendor::microsoft-prefixed-company
      - id: metadata/signed/trust-level::unsigned-missing-signature-record
      - id: metadata/lang/compiler/native::mingw-built-pe
      - id: micro-behaviors/data/encode/xor::x64-key-index-dual-xor-copy-loop
      - id: micro-behaviors/communications/socket/connect::winsock-client-lifecycle
      - id: micro-behaviors/os/registry/manipulate::registry-write-api-chain
    unless:
      - id: metadata/signed/platform/

  - id: unsigned-microsoft-embedded-pe-benign-context
    desc: Recognized benign embedded PE context
    crit: exception
    conf: 0.99
    any:
      - id: metadata/signed/platform/
      - id: metadata/signed/certificate/identity/
      - id: metadata/binary/installer/family/
      - id: metadata/binary/installer/sfx/
      - id: well-known/lib/platform/
      - id: well-known/app/storage/peazip/
      - id: well-known/tool/sysadmin/oscdimg::oscdimg-utility
      - id: well-known/app/system/stresstimulus/
      - id: well-known/tool/sysadmin/virtualization::microsoft-appv-mavinject
      - id: well-known/app/system/windows-migration::mighost-binary-identity
      - id: well-known/lib/platform/microsoft-system::media-foundation-protected-pipeline
  - id: unsigned-microsoft-embedded-pe
    desc: Microsoft-branded PE with embedded RunPE loader
    crit: hostile
    conf: 0.97
    all:
      - id: metadata/signed/trust-level::unsigned-pe-microsoft-version-fields
      - id: metadata/binary/layout/embedded::pe-embedded
      - id: objectives/evasion/process/injection/hollowing/process::token-embedded-image-hollowing
    unless:
      - id: unsigned-microsoft-embedded-pe-benign-context
      - id: metadata/binary/framework::dotnet-assembly
