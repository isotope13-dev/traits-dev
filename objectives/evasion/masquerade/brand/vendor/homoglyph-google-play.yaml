defaults:
  platforms: [android, unix, windows]
  attack: T1036.005

traits:
  - id: utf8-homoglyph-google-play
    desc: Google Play label with homoglyph characters
    crit: suspicious
    conf: 0.98
    for: [java, kotlin, dex, xml, text]
    if:
      type: text
      regex: '[Gg][Oo]?[оОοΟ]+[Oo]?gle\s+[Pp]lay'

  - id: escaped-homoglyph-google-play
    desc: Unicode-escaped Google Play homoglyph label
    crit: suspicious
    conf: 0.98
    for: [java, kotlin, xml, text]
    if:
      type: text
      regex: '(?i)Go?(\\u04[13]e|\\u03[9b]f)+o?gle\s+Play'

composite_rules:
  - id: cyrillic-homoglyph-google-play-label
    desc: Impersonates Google Play using Cyrillic or Greek homoglyphs
    crit: suspicious
    conf: 0.98
    for: [java, kotlin, dex, xml, text]
    any:
      - id: utf8-homoglyph-google-play
      - id: escaped-homoglyph-google-play

  - id: homoglyph-google-play-accessibility-masquerade
    desc: Android accessibility component impersonates Google Play with homoglyphs
    crit: hostile
    conf: 0.99
    platforms: [android]
    for: [java, kotlin]
    attack: T1036.005,T1628.001
    all:
      - id: cyrillic-homoglyph-google-play-label
      - id: micro-behaviors/hardware/input/accessibility::android-accessibility-service-source
      - id: micro-behaviors/os/package-manager/config::android-component-disable
