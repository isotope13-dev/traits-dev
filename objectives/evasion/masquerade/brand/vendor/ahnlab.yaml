# A service-name string alone cannot distinguish impersonation from AhnLab.
defaults:
  platforms: [windows]
  for: [pe]
traits:
  - id: ahnlab-v3-lite-product-claim
    desc: PE version resource claims AhnLab V3 Lite
    crit: notable
    conf: 0.99
    if:
      type: value
      path: pe.version.product_name
      exact: AhnLab V3 Lite
  - id: ahnlab-company-claim
    desc: PE version resource claims AhnLab, Inc.
    crit: notable
    conf: 0.99
    if:
      type: value
      path: pe.version.company
      exact: AhnLab, Inc.

composite_rules:
  - id: unsigned-ahnlab-v3-lite-network-loader
    desc: Unsigned .NET loader masquerades as AhnLab V3 Lite
    crit: hostile
    conf: 0.99
    attack: "T1036.005,T1105,T1140,T1620"
    all:
      - id: ahnlab-v3-lite-product-claim
      - id: ahnlab-company-claim
      - id: metadata/binary/framework::dotnet-assembly
      - id: metadata/binary/provenance/version-info::pe-original-filename-mismatch
      - id: metadata/signed/trust-level::unsigned-missing-signature-record
      - id: micro-behaviors/communications/http/get::getbytearrayasync
      - id: micro-behaviors/crypto/symmetric/3des::triple-des-provider
      - id: micro-behaviors/data/decode/base64::dotnet-frombase64string-text
      - id: micro-behaviors/metaprogramming/reflection::dotnet-create-delegate-reference
    unless:
      - id: metadata/signed/platform/
