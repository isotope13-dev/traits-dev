# Cron drop-ins that impersonate VMware VCSA service names blend into routine
# appliance maintenance listings. Match the cron.d basename shape, not a
# single observed suffix.
defaults:
  platforms: [unix]
  for: [shell, python, javascript, go, ruby, perl]
  attack: T1036.004
  mbc: F0008

traits:
  - id: fake-vmware-cron-d-name
    desc: Cron.d drop-in masquerading as a VMware service
    crit: suspicious
    conf: 0.93
    if:
      type: text
      regex: '/etc/cron\.d/vmware-(perf-collect|perf-sync|vpxd-stats)-[A-Za-z0-9_-]{1,32}\b'

composite_rules:
  - id: fake-vmware-cron-persistence
    desc: Fake VMware cron.d name with scheduled execution
    crit: hostile
    conf: 0.97
    all:
      - id: fake-vmware-cron-d-name
    any:
      - id: micro-behaviors/os/autorun/scheduled::source-cron-schedule-entry
      - id: micro-behaviors/os/autorun/scheduled::crontab-wildcard-entry
      - id: micro-behaviors/os/autorun/scheduled::shell-cron-schedule-entry
    near_lines: 20

  - id: fake-vmware-cron-reverse-ssh
    desc: Fake VMware cron.d launches reverse SSH access
    crit: hostile
    conf: 0.99
    attack: T1036.004,T1053.003,T1572
    all:
      - id: fake-vmware-cron-persistence
      - id: objectives/command-and-control/channel/tunnel/scheduled::cron-reverse-ssh-persistence
    near_lines: 30
