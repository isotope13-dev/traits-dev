defaults:
  platforms:
    - unix
    - android
    - ios
  crit: notable
  conf: 0.6
  for: [scripts, binaries]
traits:
  - id: backdoor-keywords
    desc: Backdoor-related naming patterns
    crit: notable
    if:
      type: text
      # BKDRHash is a conventional string-hashing algorithm name, not a
      # backdoor.  Exclude that identifier while retaining the established
      # short-token family for genuinely suspicious names.
      regex: \b(bkdr|bd_handler)(?!hash)\w*\b
      case_insensitive: true
    unless:
      - id: well-known/dual-use/tunnel/mihomo::mihomo-comment-bundle
  - id: secret-b
    desc: Secret naming pattern family B
    if:
      type: text
      regex: \b(hidden_cmd|covert_)\w*\b
      case_insensitive: true
composite_rules:
  - id: backdoor-comp
    desc: Backdoor naming pattern (suggests malicious intent)
    crit: notable
    conf: 0.6
    any:
      - id: backdoor-keywords
      - id: objectives/evasion/kernel-hide/keywords::rootkit-word
