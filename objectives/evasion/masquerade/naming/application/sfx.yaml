# A self-extracting archive whose auto-run stages are named after software the
# victim already trusts -- firefox.exe, iexplore.exe, chrome.exe, msnmsgr.exe.
# The name buys two things: a user who notices the process in Task Manager
# reads it as their browser, and an analyst skimming the extracted tree sees
# filenames that look like a bundled runtime rather than a payload.
#
# The name alone proves nothing: a genuine Mozilla or Skype installer really
# does ship and launch a binary with that name, which is why the composite
# needs the config to also be silent AND to chain several of these stages.
# One vendor's installer runs one vendor's executable; nothing legitimate
# extracts to the user profile and fires a browser, a second browser and a
# messenger in sequence with the progress display switched off.
defaults:
  platforms: [windows]
  for: [pe]
  attack: T1036.005
  mbc: F0008

traits:
  - id: sfx-runprogram-mainstream-app-name
    desc: SFX runs a mainstream application name
    crit: suspicious
    conf: 0.9
    if:
      # Raw bytes: the extracted-string corpus drops SFX RunProgram lines whose
      # value uses the escaped-quote spelling, which is exactly the form these
      # configs use. See the note on
      # objectives/command-and-control/dropper/delivery/sfx::sfx-runprogram-escaped-quote-value.
      type: raw
      regex: '(?i)RunProgram\s*=\s*"[^\r\n]{0,80}(firefox|iexplore|chrome|msnmsgr)'

composite_rules:
  - id: sfx-silent-app-name-masquerade
    desc: Silent SFX runs app-named payload stages
    crit: hostile
    conf: 0.97
    all:
      - id: sfx-runprogram-mainstream-app-name
      - id: objectives/command-and-control/dropper/delivery/sfx::sfx-runprogram-escaped-quote-value
      - id: objectives/command-and-control/dropper/execution/installer::sfx-progress-disabled
      - id: metadata/binary/layout::pe-no-signature-record
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/installer/family/
