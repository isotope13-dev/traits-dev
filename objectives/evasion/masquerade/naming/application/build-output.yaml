# A build script whose output file is named after software already present on
# the victim's machine. The name is chosen for the moment after delivery: a
# user scanning Task Manager or a directory listing reads `notepad` or
# `svchost` as something Windows put there, and skips it.
#
# The name is read off the linker's `-o` flag, so this catches the intent at
# the point it is written down -- in the build script that ships with the
# implant source -- rather than only on the compiled artifact, which may never
# be collected.
defaults:
  platforms: [windows, unix]
  for: [shell, batch, powershell, python, github-actions]
  attack: T1036.005
  mbc: F0008

traits:
  - id: build-output-system-process-name
    desc: Build output named after a system process
    crit: suspicious
    conf: 0.95
    if:
      # svchost/lsass/csrss/winlogon are Windows-internal processes. Nothing
      # is reimplemented under these names, so an output binary wearing one is
      # dressing up, not colliding.
      type: text
      regex: '(?i)-o\s+\S{0,40}\b(svchost|lsass|csrss|winlogon)\b'

  - id: build-output-bundled-app-name
    desc: Build output named after a Windows app
    crit: suspicious
    conf: 0.85
    if:
      # Lower confidence than the sibling: these are ordinary applications, so
      # a Go rewrite of one could legitimately claim the name. The composites
      # that use this pair it with console-hiding link flags, which a genuine
      # editor or calculator does not need to hide behind.
      type: text
      regex: '(?i)-o\s+\S{0,40}\b(notepad|explorer|mspaint|calc)\b'
