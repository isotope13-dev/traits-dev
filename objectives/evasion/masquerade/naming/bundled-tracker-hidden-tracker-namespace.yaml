# A third-party tracker bundled under a meaningless name and keyed to a
# fixed extension identity.
#
# The Great Suspender's post-sale releases shipped Open Web Analytics'
# tracker. Diffing it against OWA 1.5.7, 1.6.0 and 1.7.0 shows the library
# itself is unmodified except for exactly two things, and both are here:
#
#   OWA.event = function(){ ... this.siteId = "bacakpdjpomjaelpkpkabmedhkoongbi" ... }
#   (function(){ ... })(typeof sdkjfakjdbqjw23 == "undefined" ? sdkjfakjdbqjw23 = {} : sdkjfakjdbqjw23)
#
# The site identifier is a Chrome extension ID -- 32 characters drawn from
# a-p, the alphabet Chrome uses -- so every install's browsing is reported to
# the operator's analytics under that extension's identity. And the whole
# library is wrapped in a self-initialising IIFE bound to a keyboard-mash
# global, so it never appears as `OWA` to anyone inspecting the page or
# extension scope for known trackers.
#
# This matters because the collection rules that already fire on this file
# land on OWA's own `readAllCookies` and `bindKeypressEvents` methods -- stock
# library behaviour that would convict every site legitimately running OWA.
# These two facts do not: they exist only in the shipped copy, and they are
# what makes it a payload rather than a dependency.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  attack: T1036.005,T1176
  mbc: F0001

traits:
  - id: chrome-extension-id-as-site-identifier
    desc: Site identifier is an extension ID
    crit: notable
    conf: 0.93
    # Chrome extension IDs are exactly 32 characters from a-p. One assigned as
    # an analytics site or tracker identifier ties the telemetry to a specific
    # extension install base.
    if:
      type: text
      regex: '(?i)(site|tracker|app)_?id["'']?\s*[:=]\s*["''][a-p]{32}["'']'

composite_rules:
  - id: tracker-hidden-under-mash-namespace
    desc: Tracker hidden under a mash namespace
    crit: hostile
    conf: 0.94
    all:
      - id: chrome-extension-id-as-site-identifier
      - id: micro-behaviors/data/control-flow/branch::long-identifier-undefined-ternary
