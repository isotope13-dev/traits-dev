defaults:
  platforms: [windows]
  for: [pe, dll]
traits:
  - id: zero-width-spliced-executable-name
    desc: Executable filename contains a zero-width splice
    crit: suspicious
    conf: 0.97
    if:
      type: text
      # CLR #US extraction retains the actual Unicode codepoint.
      # The filename itself is arbitrary; the invisible splice is the evidence.
      regex: '[A-Za-z0-9][\u200B-\u200F][A-Za-z0-9._-]{1,40}\.exe'
