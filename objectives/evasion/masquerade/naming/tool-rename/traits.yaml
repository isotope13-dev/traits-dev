# Renamed offensive tool (signature-evasion rename).
#
# Actors rename open-source offensive tools — secretsdump.py becomes
# secdump6.py — so filename and hash signatures miss while the code keeps
# working. The rename is the malice marker: the same dump classes under
# the tool's own name are the dual-use original the dump-system rules
# already convict, while the identical capability under any other name is
# someone dodging exactly those rules. This matches the code shape, not
# the campaign's filename, so any renamed secretsdump copy fires and the
# original stays suppressed by the basename carve-out.
defaults:
  platforms: [unix, windows]
  for: [python]
  attack: T1036,T1003.003
  mbc: B0005

traits:
  - id: secretsdump-tool-filename
    desc: File keeps the secretsdump tool name
    crit: notable
    conf: 0.95
    if:
      type: basename
      regex: '(?i)secretsdump'

composite_rules:
  - id: renamed-secretsdump-domain-dump
    desc: Renamed secretsdump extracts domain creds
    crit: hostile
    conf: 0.95
    all:
      - id: objectives/credential-access/dump/system::impacket-secretsdump-code-shape
      - id: objectives/credential-access/dump/system::ntds-database-file-target
    any:
      - id: objectives/credential-access/dump/system::secretsdump-domain-controller-mode
      - id: objectives/credential-access/dump/system::drsuapi-dump-reference
    unless:
      # The genuine upstream secretsdump.py never contains its own filename
      # as a string (argparse derives "usage:" from argv[0], not a literal),
      # so gating the carve-out on that text -- the previous approach --
      # never actually matched the original tool it was meant to exempt.
      # The basename alone is the right signal: this rule exists to catch
      # the *rename*, so a file that still carries the tool's own name was
      # never renamed and belongs to the dual-use original the dump-system
      # rules already convict under objectives/credential-access/dump/system.
      - id: secretsdump-tool-filename
