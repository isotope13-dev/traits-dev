# Random-looking names alone are metadata. This rule requires packed content.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, python, ruby, shell, powershell]
  attack: T1036,T1027
composite_rules:
  - id: random-named-packed-payload
    desc: Random-named script carries a packed payload
    crit: suspicious
    conf: 0.95
    all:
      # Use the two underlying facts so a packed payload remains suspicious
      # even if an attacker places it under dist/ to inherit the benign naming
      # context used by the standalone finding above.
      - id: metadata/file/extension/token-shape::bare-alphanumeric-script-basename
      - id: metadata/file/naming::script-stem-random-like
    any:
      - id: metadata/file/line::js-single-line-over-1mb
      - id: metadata/file/arithmetic::js-extreme-digit-ratio-large-source
      - id: objectives/supply-chain/hidden-payload/eval::packed-single-line-eval-dropper
