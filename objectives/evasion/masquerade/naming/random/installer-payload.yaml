# Generated-looking names are weak evidence by themselves, but installers that
# place a packed payload under a short opaque directory make stable IOCs and
# human inspection harder. The path atom stays a component; independent packed
# loader structure promotes it to an actionable finding.
defaults:
  platforms: [windows]
  for: [pe, dll, png]
  attack: T1036
  mbc: F0008
traits:
  - id: mixedcase-installer-child-directory
    desc: Installer child directory is mixed-case token
    crit: component
    conf: 0.85
    if:
      type: path
      dirname: true
      regex: '([A-Z][A-Za-z0-9]{2,8}[a-z]|[a-z][A-Za-z0-9]{2,8}[A-Z])$'

  - id: uppercase-digit-installer-child-name
    desc: Installer child name is uppercase token
    crit: component
    conf: 0.8
    if:
      type: path
      basename: true
      regex: '^[A-Z]{2,8}[0-9]{1,3}\.[a-z]{2,4}$'

  - id: mixed-digit-installer-child-name
    desc: Installer child name is mixed-case token
    crit: component
    conf: 0.85
    if:
      type: path
      basename: true
      regex: '^[A-Z][A-Za-z]{4,10}[0-9][A-Z]{1,3}\.[a-z]{2,4}$'

composite_rules:
  - id: generated-installer-child-name
    desc: Installer child name has generated shape
    crit: component
    conf: 0.9
    any:
      - id: uppercase-digit-installer-child-name
      - id: mixed-digit-installer-child-name

  - id: randomized-packed-installer-child
    for: [pe]
    desc: Packed installer child uses opaque path
    crit: suspicious
    conf: 0.96
    all:
      - id: mixedcase-installer-child-directory
      - id: generated-installer-child-name
      - id: metadata/binary/code/entropy::high-code-entropy
    any:
      - id: objectives/anti-static/obfuscation/name-mangling/import-name::opaque-alpha-import-cluster
      - id: objectives/anti-static/obfuscation/name-mangling/export-name::opaque-alpha-export-cluster
