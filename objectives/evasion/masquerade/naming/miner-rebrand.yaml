# XMRig build with every product name replaced (binary name, docs URL,
# donate host, config filename) while its internal path placeholders and
# donation banner remain. Forks and pool-branded builds keep the XMRig name
# in --version and help text; scrubbing all of it serves only to dodge
# name and string signatures, as cryptojacking droppers do.
defaults:
  platforms: [linux, windows, macos]
  for: [elf, pe, macho]
  attack: T1036,T1496
composite_rules:
  - id: xmrig-product-name-scrubbed
    desc: XMRig miner with its product name scrubbed
    crit: hostile
    conf: 0.93
    all:
      - id: well-known/app/finance/xmrig::xmrig-path-placeholder-vars
      - id: well-known/app/finance/xmrig::xmrig-dev-donate-banner
      - id: micro-behaviors/communications/socket/tcp::stratum-submit-method
    unless:
      - id: micro-behaviors/process/info/name::xmrig-product
