defaults:
  for: [text]
  platforms: [windows]

composite_rules:
  - id: mirc-config-click-system-name-variant
    desc: mIRC config names utility lookalike
    crit: suspicious
    conf: 0.95
    scope: file
    all:
      - id: metadata/file/format/structured::mirc-client-config-section
      - id: micro-behaviors/process/config/launch::config-run-executable-text
      - id: micro-behaviors/process/config/launch::config-run-system-name-variant-text
