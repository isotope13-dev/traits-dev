defaults:
  for: [pe, dll]
  platforms: [windows]
  attack: T1036.005
  mbc: F0001

composite_rules:
  - id: unsigned-microsoft-company-claim
    desc: Unsigned PE claiming Microsoft CompanyName
    crit: notable
    conf: 0.85
    all:
      - id: metadata/binary/provenance/version-info::microsoft-company-name-claim
    unless:
      - id: metadata/signature/verified/platform::microsoft

  - id: unsigned-microsoft-surveillance-impersonation
    desc: Unsigned Microsoft-impersonating PE with keylogging and clipboard access
    crit: notable
    conf: 0.96
    attack: T1036.005,T1056.001,T1115
    mbc: F0001,B0047
    all:
      - id: unsigned-microsoft-company-claim
      - id: micro-behaviors/hardware/input/keyboard/poll::get-async-key-state
      - id: micro-behaviors/os/clipboard/
