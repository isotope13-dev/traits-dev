defaults:
  for: [pe, dll]
  platforms: [windows]
  attack: T1036.005
  mbc: F0001

composite_rules:
  - id: unsigned-microsoft-company-claim
    desc: Unsigned PE claiming Microsoft CompanyName
    crit: notable
    conf: 0.85
    all:
      - id: metadata/binary/provenance/version-info::microsoft-company-name-claim
    unless:
      - id: metadata/signature/verified/platform::microsoft

  # Microsoft's own binaries are signed. An unsigned assembly that claims
  # Microsoft while decrypting its strings and saving downloaded bytes is a
  # disguised stager.
  - id: unsigned-microsoft-concealed-downloader
    desc: Unsigned PE posing as Microsoft decrypts strings and saves downloaded bytes
    crit: hostile
    conf: 0.9
    attack: T1036.005,T1027,T1105
    all:
      - id: unsigned-microsoft-company-claim
      - id: objectives/execution/staging/http::managed-decoder-http-byte-write-clues

  - id: unsigned-microsoft-surveillance-impersonation
    desc: Unsigned Microsoft-impersonating PE with keylogging and clipboard access
    crit: notable
    conf: 0.96
    attack: T1036.005,T1056.001,T1115
    mbc: F0001,B0047
    all:
      - id: unsigned-microsoft-company-claim
      - id: micro-behaviors/hardware/input/keyboard/poll::get-async-key-state
      - id: micro-behaviors/os/clipboard/
