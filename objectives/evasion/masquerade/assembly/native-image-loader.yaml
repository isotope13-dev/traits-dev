defaults:
  for: [pe]
  platforms: [windows]
composite_rules:
  - id: native-image-name-reflective-loader
    desc: Native-image name without native metadata loads and invokes assemblies
    crit: suspicious
    conf: 0.97
    attack: T1036,T1620
    ref: https://web-assets.esetstatic.com/wls/en/papers/white-papers/turla-cereal-tricks.pdf
    # Neither an unsigned Ngen cache entry nor C++/CLI alone is incriminating.
    # Require a contradictory internal module name plus actual loader calls.
    scope: file
    all:
      - id: metadata/lang/compiler/managed::native-image-name-without-native-header
      - id: metadata/binary/header/characteristics::pe-dotnet-native-entry
      - id: metadata/signature/absent::unsigned-missing-signature-record
      - id: micro-behaviors/fs/read/file/content/whole::cil-file-readallbytes-call
      - id: micro-behaviors/process/interpreter/runtime/clr::cil-assembly-load-call
      - id: micro-behaviors/metaprogramming/reflection/inspect/class/invocation::method-invoke
