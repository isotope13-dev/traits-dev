# C# assembly metadata masquerading as Microsoft products
defaults:
  for: [csharp]
  platforms: [windows]
  attack: "T1036.005"
  mbc: "F0004"
traits:
  - id: nt-kernel-title
    desc: Assembly titled as NT Kernel & System
    crit: suspicious
    conf: 0.97
    if:
      type: tree-sitter
      query: |
        ((global_attribute
          (attribute name: (_) @attribute
            (attribute_argument_list . (attribute_argument (string_literal) @title) .))) @declaration
          (#match? @attribute "(^|[.])AssemblyTitle(Attribute)?$")
          (#eq? @title "\"NT Kernel & System\"")
          (#match? @declaration "^\\[[ \\t\\r\\n]*assembly[ \\t]*:"))
composite_rules:
  - id: microsoft-masquerade
    desc: Assembly masquerades as Microsoft product
    crit: suspicious
    conf: 0.96
    all:
      - id: metadata/vendor/identity::assembly-company-microsoft
      - id: nt-kernel-title
