defaults:
  platforms:
  - windows
  for:
  - pe
composite_rules:
- id: nsis-self-signed-business-lure-overlay
  desc: Self-signed NSIS business-document lure with overlay
  crit: hostile
  conf: 0.97
  attack: T1036.007,T1027.009,T1204.002
  all:
  - id: well-known/tool/packaging/nsis::nsis
  - id: metadata/filename/document-theme::business-document-themed-basename
  - id: metadata/signature/certificate/chain::pe-cert-leaf-self-issued
  - id: metadata/binary/layout/overlay::signed-pe-large-noncertificate-overlay
  any:
  - id: micro-behaviors/os/event/shutdown::shutdown-privilege-reboot-api
  - id: micro-behaviors/os/clipboard/reference::open-clipboard
  - id: micro-behaviors/os/handler/open::shell-execute-ex
  - id: micro-behaviors/os/privilege/token/use::adjust-token-privileges
  - id: micro-behaviors/os/registry/value/write::registry-set-value-api
  needs: 2
- id: nsis-document-name-overlay-api-profile
  desc: NSIS document-named executable with overlay and API clues
  crit: hostile
  conf: 0.98
  all:
  - id: metadata/filename/document-theme::document-themed-executable-name
  - id: well-known/tool/packaging/nsis::nsis-manifest-exehead
  - id: metadata/binary/layout/ratio::overlay-dominates-third
  needs: 2
  any:
  - id: metadata/binary/layout/entropy::high-entropy-overlay
  - id: micro-behaviors/fs/temp/file::temp-path-file-api-primitives
  - id: metadata/binary/symbols/name/process::create-process-a
  - id: micro-behaviors/os/handler/open::shell-execute-a
  - id: metadata/binary/resource/identity::julaceous-version-comment
  - id: metadata/binary/resource/identity::thegnhood-version-copyright
  - id: objectives/execution/staging/runtime::module-file-io-process-api-profile
  - id: micro-behaviors/fs/config/system::ini-copy-process-api-set
  - id: micro-behaviors/dylib/lookup::module-export-resolution-imports
  - id: micro-behaviors/fs/read/file/handle::pe-module-path-file-io-overlay
  unless:
  - id: metadata/signature/verified/platform/
