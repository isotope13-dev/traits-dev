defaults:
  platforms: [windows]
  for: [all]
  attack: T1036.005,T1547.001

composite_rules:
  # A vendor-branded filename is not enough by itself. Requiring both
  # non-vendor summary identities and an OLE installer container catches
  # future branded MSI lures while leaving real vendor-built installers alone.
  - id: branded-msi-fabricated-identity
    desc: Branded MSI filename with fabricated installer identity
    crit: hostile
    conf: 0.98
    attack: T1036.005,T1195.002
    all:
      - id: metadata/package/files/msi::msi-branded-basename-lure
      - id: metadata/package/files/msi::ole2-installer-kind
      - id: metadata/package/files/msi::msi-nonstandard-subject-identity
      - id: metadata/package/files/msi::msi-nonstandard-creator-identity

  # WiX MSIs that ship under a generic drop name with a throwaway ultrashort
  # product code and non-vendor publisher — the fingerprint of disposable
  # malware installers (RAT/stealer droppers) that skip brand impersonation.
  - id: msi-generic-ultrashort-identity
    desc: Generic MSI name with ultrashort product identity
    crit: hostile
    conf: 0.97
    attack: T1036.005,T1195.002
    all:
      - id: metadata/package/files/msi::ole2-installer-kind
      - id: metadata/package/files/msi::msi-wix-toolset-branding
      - id: metadata/package/files/msi::msi-generic-installer-basename
      - id: metadata/package/files/msi::msi-ultrashort-product-subject
      - id: metadata/package/files/msi::msi-nonstandard-creator-identity
      - id: metadata/package/files/msi::msi-opaque-stream-cluster
