defaults:
  crit: hostile
  platforms: [windows]
  for: [oledoc]
  attack: T1036.005,T1547.001

composite_rules:
  # A vendor-branded filename is not enough by itself. Requiring both
  # non-vendor summary identities and an OLE installer container catches
  # future branded MSI lures while leaving real vendor-built installers alone.
  - id: branded-msi-fabricated-identity
    desc: Branded MSI filename with fabricated installer identity
    conf: 0.98
    attack: T1036.005,T1195.002
    all:
      - id: metadata/package/files/msi::msi-adobe-acrobat-branded-basename
      - id: metadata/package/files/msi::msi-nonstandard-subject-identity
      - id: metadata/package/files/msi::msi-nonstandard-creator-identity

  # WiX MSIs that ship under a generic drop name with a throwaway ultrashort
  # product code and non-vendor publisher — the fingerprint of disposable
  # malware installers (RAT/stealer droppers) that skip brand impersonation.
  - id: msi-generic-ultrashort-identity
    desc: Generic MSI name with ultrashort product identity
    conf: 0.97
    attack: T1036.005,T1195.002
    all:
      - id: metadata/package/files/msi::msi-wix-toolset-branding
      - id: metadata/package/files/msi::msi-generic-installer-basename
      - id: metadata/package/files/msi::msi-ultrashort-product-subject
      - id: metadata/package/files/msi::msi-nonstandard-creator-identity
      - id: metadata/package/files/msi::msi-opaque-stream-cluster

  # Same disposable-publisher pattern when the product token is longer
  # (6–16 letters) and the container is multi-megabyte — covers WiX sideload
  # kits that pick pronounceable throwaway names instead of 2–5 letter codes.
  - id: msi-personal-publisher-token-lure
    desc: MSI nonstandard publisher with token product lure
    conf: 0.96
    attack: T1036.005,T1195.002
    size_min: 5000000
    all:
      - id: metadata/package/files/msi::msi-wix-toolset-branding
      - id: metadata/package/files/msi::msi-nonstandard-creator-identity
      - id: metadata/package/files/msi::msi-single-token-subject
      - id: metadata/package/files/msi::msi-wix-boilerplate-token-description
      - id: metadata/package/files/msi::msi-opaque-stream-cluster
    unless:
      - id: metadata/package/files/msi::personal-product-wix-msi-context

  # Signed WiX lure that impersonates DocuSign Reader while installing a
  # BlackCrypt remote-management agent as a LocalSystem Windows service.
  - id: docusign-reader-lure-blackcrypt-rmm-msi
    desc: DocuSign-branded MSI delivers BlackCrypt RMM agent
    conf: 0.99
    attack: T1036.005,T1219,T1543.003
    for: [msi, oledoc]
    all:
      - id: metadata/package/files/msi::msi-docusign-reader-product-summary
      - id: metadata/package/files/msi::msi-blackcrypt-rmm-service-summary
      - id: metadata/package/files/msi::msi-wix-toolset-application-metadata
