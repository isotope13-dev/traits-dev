# A browser vendor's updater setup name inside a PE that carries none of the
# vendor's trust. The real BraveUpdateSetup.exe is signed by the vendor and is
# a plain Omaha meta-installer; one that is unsigned and built with
# writable-and-executable sections, three or more embedded PEs and a packed
# resource section is a different program wearing the name.
defaults:
  platforms: [windows]
  for: [pe]
  attack: "T1036.005,T1027.002"
  mbc: E1036

composite_rules:
  - id: unsigned-packed-pe-named-brave-updater
    desc: Unsigned packed PE named as Brave updater
    crit: hostile
    conf: 0.88
    all:
      - id: well-known/app/browser/brave::brave-update-setup-name
      - id: metadata/signed/trust-level::unsigned-missing-signature-record
      - id: metadata/binary/section/permission::wx-section
      - id: metadata/binary/layout/embedded::embedded-pe-three-plus
      - id: metadata/binary/resource/entropy::high-entropy-rsrc
