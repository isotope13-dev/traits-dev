defaults:
  platforms: [windows]
  for: [msi, pe, dll]

composite_rules:
  - id: msi-microsoft-claim-unsigned-shell-http
    desc: Microsoft-claiming MSI contains unsigned shell and HTTP indicators
    crit: suspicious
    conf: 0.94
    attack: T1036.005
    scope: outer
    all:
      - id: metadata/document/office/properties::msi-creator-claims-microsoft
      - id: metadata/signature/absent::unsigned
      - id: micro-behaviors/process/create/shell/command-mode::windows-command-shell-invocation
      - id: micro-behaviors/communications/http/form::multipart-form
    unless:
      - id: metadata/signature/verified/platform/
