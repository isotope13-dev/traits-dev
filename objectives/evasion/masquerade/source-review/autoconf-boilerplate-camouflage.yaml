# A reverse shell threaded with autoconf's stock test-program comments reads
# as generated configure noise to anyone skimming the script. The comments
# are real autoconf boilerplate -- legitimately they sit above a `char f();`
# probe, never inside a main() that forks, connects and execs a shell -- so
# their presence around shell code is the camouflage itself.
#
# fragroute 1.2 (2002, monkey.org compromise) wrote such a program to
# conftest.c, compiled it with gcc and ran it, connecting 216.80.99.202:6667
# to /bin/sh; its lines alternated with the "gcc2 internal prototype",
# "HP/UX 9 sscanf" and "GNU C library ... ENOSYS" comments.
defaults:
  platforms: [unix]
  for: [shell, c]
  attack: T1036,T1195.002

traits:
  - id: autoconf-gcc2-prototype-comment
    desc: Autoconf gcc2 prototype boilerplate comment
    crit: component
    conf: 0.9
    if:
      type: text
      substr: Override any gcc2 internal prototype to avoid an error
  - id: autoconf-hpux-sscanf-comment
    desc: Autoconf HP/UX sscanf boilerplate comment
    crit: component
    conf: 0.9
    if:
      type: text
      substr: 'HP/UX 9 (%@#!) writes to sscanf strings'
  - id: autoconf-enosys-stub-comment
    desc: Autoconf glibc ENOSYS stub boilerplate comment
    crit: component
    conf: 0.9
    if:
      type: text
      substr: The GNU C library defines this for functions which it implements

composite_rules:
  - id: reverse-shell-camouflaged-as-autoconf-boilerplate
    desc: Reverse shell interleaved with autoconf boilerplate comments to pass review
    crit: hostile
    conf: 0.95
    near_bytes: 1500
    all:
      - id: objectives/command-and-control/backdoor/shell/reverse::embedded-c-reverse-shell-source
    any:
      - id: autoconf-gcc2-prototype-comment
      - id: autoconf-hpux-sscanf-comment
      - id: autoconf-enosys-stub-comment
    needs: 2
