# A DLL whose version resource names Microsoft as the company, with no
# signature, that hides its memory and process APIs in an XOR table. Microsoft
# ships these libraries signed; a copy that is unsigned and also conceals the
# APIs it resolves is a sideload payload dressed as a Microsoft component.
defaults:
  platforms: [windows]
  for: [pe, dll]
  attack: T1036.001,T1574.002,T1027.007

composite_rules:
  - id: unsigned-microsoft-dll-xor-api-loader
    desc: Unsigned Microsoft-named DLL with XOR API table
    crit: hostile
    conf: 0.93
    all:
      - id: metadata/binary/vendor::microsoft-prefixed-company
      - id: metadata/signed/trust-level::unsigned
      - id: objectives/anti-static/obfuscation/decoders::xor-encoded-api-table
    unless:
      - id: metadata/signed/platform/
