defaults:
  for: [macho]
  platforms: [macos]
  crit: hostile
  conf: 0.98
  attack: T1036,T1027

composite_rules:
  - id: adhoc-signed-encoded-command-runner
    desc: Ad-hoc signed encoded command runner
    all:
      - id: metadata/signed/trust-level::adhoc
      - id: metadata/file/encoded::large-base64-like-string
      - id: micro-behaviors/process/create/shell/spawn::system-fn
      - id: metadata/binary/section/ratio::macho-minimal-cstring-section
      - id: metadata/binary/layout/overlay::overlay-at-least-half

  # Universal Mach-O slices are correctly excluded from overlay traits. Use
  # the independently detected packed entry layout for those command runners.
  - id: adhoc-signed-packed-command-runner
    desc: Ad-hoc signed packed command runner
    all:
      - id: metadata/signed/trust-level::adhoc
      - id: metadata/file/encoded::large-base64-like-string
      - id: micro-behaviors/process/create/shell/spawn::system-fn
      - id: metadata/binary/section/ratio::macho-minimal-cstring-section
      - id: metadata/binary/section/entropy::small-high-entropy-executable-section-without-text

  # An ad-hoc signature is self-signed: the signer can stamp any
  # identifier, so `com.apple.*` under ad-hoc is a forgery claim, not
  # provenance (Apple never ships ad-hoc builds). The forged prefix is
  # what silences platform-gated findings, which is why this stands apart
  # from the command-runner composites above.
  - id: adhoc-forged-apple-platform-identity
    desc: Ad-hoc binary forges Apple platform identity
    all:
      - id: metadata/signed/trust-level::adhoc
      - id: metadata/binary/signing::apple-identifier-prefix
    unless:
      - id: metadata/package/testing/presence/corpus::binary-test-fixture-member
      - id: "metadata/file/naming::test-directory-component"

  # The same forgery logic over the Developer-ID identifier shape: a
  # TeamID-UUID identifier asserts membership of a signing team, and an
  # ad-hoc signature by construction certifies no team. Real team members
  # ship Developer-ID-signed images; the pairing is the loader ecosystem's
  # borrowed-provenance costume.
  - id: adhoc-forged-developer-id-identity
    desc: Ad-hoc binary claims a Developer-ID team identity
    all:
      - id: metadata/signed/trust-level::adhoc
      - id: metadata/binary/signing::developer-id-format-identifier
    unless:
      - id: metadata/package/testing/presence/corpus::binary-test-fixture-member
      - id: "metadata/file/naming::test-directory-component"
