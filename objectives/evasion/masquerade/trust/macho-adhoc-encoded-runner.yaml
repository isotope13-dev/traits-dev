defaults:
  for: [macho]
  platforms: [macos]
  crit: hostile
  conf: 0.98
  attack: T1036,T1027

composite_rules:
  - id: adhoc-forged-adobe-identity
    desc: Ad-hoc binary forges Adobe identity
    all:
      - id: metadata/signed/trust-level::adhoc
      - id: metadata/binary/signing::adobe-identifier-prefix
    unless:
      - id: metadata/package/testing/presence/corpus::binary-test-fixture-member
      - id: "metadata/file/naming::test-directory-component"
