# Code-signing trust abuse: a binary that carries an embedded code-signing
# certificate (so it presents as a signed, trustworthy product) while hiding a
# malicious payload. Trojanized-signed-host loaders (e.g. ACRStealer / Shelma)
# graft an encrypted second stage onto a real signed component; the file still
# ships the original certificate table even though the body no longer matches.
defaults:
  platforms: [windows]
  for: [pe, dll]
  attack: T1553.002
  mbc: B0032
composite_rules:
  - id: signed-nsis-zero-width-overlay-carrier
    desc: Microsoft-signed NSIS carrier hides a zero-width-marked high-entropy overlay
    crit: hostile
    conf: 0.99
    attack: T1027,T1036.005,T1553.002
    all:
      - id: metadata/binary/layout::cert-table-present
      - id: metadata/signed/leaf::microsoft-corporation
      - id: metadata/binary/installer/script::nsis
      - id: metadata/binary/layout::signed-pe-checksum-mismatch
      - id: metadata/binary/layout::high-entropy-overlay
      - id: metadata/binary/layout::overlay-over-90pct
      - id: objectives/anti-static/obfuscation/anti-decompile::zero-width-managed-pe-marker-206d
      - id: objectives/anti-static/obfuscation/anti-decompile::zero-width-managed-pe-marker-206f

  - id: signed-inno-opaque-marker-carrier
    desc: Signed Inno carrier hides a zero-width opaque payload
    crit: hostile
    conf: 0.99
    attack: T1027,T1036.005,T1553.002
    all:
      - id: metadata/binary/layout::cert-data-zeroed-checksum
      - id: metadata/binary/layout::high-entropy-overlay
      - id: metadata/binary/layout::overlay-over-90pct
      - id: metadata/binary/installer/family::inno-delphi-installer-foundation
      - id: objectives/anti-static/obfuscation/anti-decompile::zero-width-managed-pe-marker-206d
      - id: objectives/anti-static/obfuscation/anti-decompile::zero-width-managed-pe-marker-206f

  # Executables grafted onto a signed host *after* it was signed.
  #
  # Authenticode's digest stops at the end of the security directory, so bytes
  # written past it are carried by the file without being covered by the
  # certificate: the host still verifies and still presents the vendor's name,
  # while the appended span travels under that reputation. Anti-virus naming
  # for this is literally "Patched"/"APPE" (appended).
  #
  # The discriminator against a legitimate trailing blob is what the span
  # holds. A self-extracting installer appends its payload and *then* signs, so
  # its payload sits inside the signed region; a vendor that tags a build after
  # signing writes a few hundred bytes of channel data. Neither produces
  # complete PE images beyond the signature. Requiring the embedded executables
  # keeps ordinary signed installers and tagged builds out.
  - id: signed-host-post-signature-executable-append
    desc: Signed host carries executables past its signature
    crit: hostile
    conf: 0.96
    attack: T1553.002,T1027.009
    all:
      - id: metadata/binary/layout::cert-table-present
      - id: metadata/binary/anomaly/signing::pe-data-beyond-signature-blob
      - id: metadata/binary/layout::multiple-pe-embedded
    unless:
      - id: metadata/binary/installer/family/
      - id: metadata/signed/platform/
      - id: well-known/app/system/iobit::iobit-signed-component-context
      - id: well-known/app/development/inspect::inspect-devtools-nsis-uninstaller-context

  # The same graft when the appended span is not a PE image: shellcode, an
  # encrypted stage, or an archive the host unpacks. The rule above needs
  # embedded executables to reach hostile, so on its own this rung is what
  # catches a signed host carrying a non-PE payload past its certificate.
  #
  # Suspicious rather than hostile because the span's content is unknown here:
  # some products really do stamp a build after signing. The 64 KiB floor
  # already excludes the tag-sized case, which is the only benign form seen in
  # practice.
  - id: signed-host-post-signature-append
    desc: Signed host carries data past its signature
    crit: suspicious
    conf: 0.9
    all:
      - id: metadata/binary/layout::cert-table-present
      - id: metadata/binary/anomaly/signing::pe-data-beyond-signature-blob
    unless:
      - id: metadata/binary/installer/family/
      - id: metadata/signed/platform/
      - id: well-known/app/system/iobit::iobit-signed-component-context
      - id: well-known/app/development/inspect::inspect-devtools-nsis-uninstaller-context

  # Carries a code-signing certificate AND conceals an encrypted payload in an
  # oversized .reloc. A genuinely signed product never hides an encrypted stage
  # in its relocation section, so the pairing is the trust-abuse signature of a
  # trojanized signed host. References the concealed-payload composite so the
  # structural gate (entropy + overhang) is inherited.
  - id: signed-host-concealed-payload
    desc: Signed host conceals encrypted payload
    crit: hostile
    conf: 0.95
    all:
      - id: metadata/binary/layout::cert-table-present
      - id: objectives/anti-static/pack/section-anomaly::reloc-concealed-encrypted-payload

  # Epic Games does not publish Huorong/Inno Setup installers.  The signer is
  # an abuse anchor here; the hostile verdict also requires a verified legacy
  # certificate, dominant opaque Inno data, and a zeroed PE checksum.
  - id: abused-epic-signed-inno-carrier
    desc: Abused Epic-signed Inno carrier with dominant opaque payload
    crit: hostile
    conf: 0.99
    attack: T1027.002,T1036.005,T1553.002
    all:
      - id: metadata/signed/leaf::epic-games-inc.
      - id: metadata/signed/certificate/identity::pe-signature-verified-kv
      - id: metadata/signed/certificate/identity::pe-cert-leaf-sha1-signature
      - id: metadata/binary/installer/family::inno-delphi-installer-foundation
      - id: metadata/binary/layout::large-high-entropy-overlay
      - id: metadata/binary/layout::overlay-over-90pct
      - id: metadata/binary/layout::cert-data-zeroed-checksum
  # A malformed PE with a Microsoft leaf certificate and a huge low-entropy
  # relocation section is a distinct signed-loader pattern even when the
  # relocation bytes are not high-entropy enough for the encrypted-payload
  # composite above.
  - id: signed-malformed-reloc-loader
    desc: Microsoft-signed malformed PE hides data in oversized relocations
    crit: hostile
    conf: 0.97
    attack: T1027,T1553.002
    all:
      - id: metadata/signed/leaf::microsoft-corporation
      - id: metadata/binary/metrics/structural::malformed-pe-structure
      - id: objectives/anti-static/pack/section-anomaly::oversized-reloc-masking
