# Code-signing trust abuse: a binary that carries an embedded code-signing
# certificate (so it presents as a signed, trustworthy product) while hiding a
# malicious payload. Trojanized-signed-host loaders (e.g. ACRStealer / Shelma)
# graft an encrypted second stage onto a real signed component; the file still
# ships the original certificate table even though the body no longer matches.
defaults:
  platforms: [windows]
  for: [pe, dll]
  attack: T1553.002
  mbc: B0032
composite_rules:
  # A genuine vendor certificate remains in the file, but the signed image
  # digest no longer matches. Requiring a pixel-extracted in-memory .NET stage
  # separates payload-bearing trust abuse from benign post-signing metadata
  # edits and reconstructed files.
  - id: microsoft-signed-bitmap-assembly-loader
    desc: Tampered Microsoft-signed PE launches a bitmap-hidden .NET assembly
    crit: hostile
    conf: 0.99
    attack: T1553.002,T1027.003,T1620
    all:
      - id: metadata/signed/leaf::microsoft-corporation
      - id: metadata/signed/certificate/signature::pe-signature-digest-mismatch
      - id: objectives/execution/payload/module-load::dotnet-bitmap-resource-entrypoint-loader
    unless:
      - id: metadata/binary/installer/family/
      - id: metadata/binary/section/label::cape-sandbox-dump-section

  # Post-signing grafts that add executable sections with nonstandard names
  # (packer stubs, parasite code) break the Authentihash while keeping the
  # vendor PKCS#7 blob intact — the same trust-abuse pairing as above, with
  # layout evidence that the image is not merely re-stamped configuration.
  - id: vendor-signed-image-nonstandard-section-graft
    desc: Vendor-signed PE grafted with nonstandard executable sections
    crit: hostile
    conf: 0.96
    attack: T1553.002,T1027.002
    all:
      - id: metadata/signed/certificate/signature::pe-signature-digest-mismatch
      - id: metadata/binary/section/label::multiple-nonstandard-section-names
    any:
      - id: metadata/signed/leaf::microsoft-corporation
      - id: metadata/signed/leaf::mozilla-corporation
      - id: metadata/signed/platform/
    unless:
      - id: metadata/binary/installer/family/
      - id: metadata/binary/section/label::cape-sandbox-dump-section
      - id: well-known/tool/sysadmin/sysinternals::process-explorer-build-identity

  # Certificate table points outside the image while the body walks the
  # filesystem to touch other executables — transplanted signing on an infector.
  # CAPE-reconstructed images lose the overlay certificate (certs are not
  # mapped) and gain a synthetic section, so a dangling cert directory there
  # is a sandbox artifact, not a transplant.
  - id: cert-transplant-file-walker-infector
    desc: Transplanted-cert PE enumerates files and timestomps
    crit: hostile
    conf: 0.97
    attack: T1553.002,T1554,T1070.006
    all:
      - id: metadata/binary/layout/checksum::invalid-cert-directory-checksum
      - id: micro-behaviors/fs/directory/readdir::find-file-walker
    any:
      - id: micro-behaviors/fs/file/timestamp::set-file-time
      - id: micro-behaviors/fs/delete/file/library::deletefile-a
      - id: metadata/binary/section/header::pe-entry-in-writable-section
    needs: 1
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/installer/family/
      - id: metadata/binary/section/label::cape-sandbox-dump-section
      # 7-Zip SFX extraction walks directories and restores timestamps.
      # That is the installer, not a file infector.
      - id: metadata/binary/installer/sfx::7zip-sfx-resource-profile

  # A CAPE-reconstructed memory image keeps UPX section names with unpacked
  # content while the overlay certificate is gone, so the same dangling-cert
  # plus UPX-layout pairing is a sandbox artifact there, not a transplant.
  - id: cert-transplant-fake-upx-carrier
    desc: Transplanted certificate on stripped UPX-layout PE
    crit: hostile
    conf: 0.96
    attack: T1553.002,T1027.002
    all:
      - id: metadata/binary/layout/checksum::invalid-cert-directory-checksum
      - id: metadata/binary/section/label::upx-section-pair
    unless:
      - id: metadata/binary/layout/stub::upx-early-magic
      - id: metadata/signed/platform/
      - id: metadata/binary/installer/family/
      - id: metadata/binary/section/label::cape-sandbox-dump-section
      # Stock and rebuilt 7-Zip SFX modules keep UPX section names after the
      # packer magic is gone, and a rebuilt stub often leaves a stale
      # certificate directory. That is the SFX module, not a transplanted cert.
      - id: metadata/binary/installer/sfx::7zip-sfx-resource-profile

  - id: signed-nsis-zero-width-overlay-carrier
    desc: Microsoft-signed NSIS carrier hides a zero-width-marked high-entropy overlay
    crit: hostile
    conf: 0.99
    attack: T1027,T1036.005,T1553.002
    all:
      - id: metadata/signed/leaf::microsoft-corporation
      - id: metadata/binary/installer/script::nsis
      - id: metadata/binary/layout/checksum::certificate-directory-checksum-mismatch
      - id: metadata/binary/layout/overlay::high-entropy-overlay
      - id: metadata/binary/layout/ratio::overlay-over-90pct
      - id: objectives/anti-static/obfuscation/anti-decompile::zero-width-managed-pe-marker-206d
      - id: objectives/anti-static/obfuscation/anti-decompile::zero-width-managed-pe-marker-206f

  - id: signed-inno-opaque-marker-carrier
    desc: Signed Inno carrier hides a zero-width opaque payload
    crit: hostile
    conf: 0.99
    attack: T1027,T1036.005,T1553.002
    all:
      - id: metadata/binary/layout/checksum::cert-data-zeroed-checksum
      - id: metadata/binary/layout/overlay::high-entropy-overlay
      - id: metadata/binary/layout/ratio::overlay-over-90pct
      - id: metadata/binary/installer/family::inno-delphi-installer-foundation
      - id: objectives/anti-static/obfuscation/anti-decompile::zero-width-managed-pe-marker-206d
      - id: objectives/anti-static/obfuscation/anti-decompile::zero-width-managed-pe-marker-206f

  # Keep identity-based product/runtime exceptions in one context. Each leg is
  # a notable identity; the composite is used only as a benign suppressor.
  - id: recognized-signed-component-overlay-known-benign-context
    desc: Recognized signed component overlay context
    crit: exception
    conf: 0.99
    for: [pe]
    any:
      - id: well-known/app/system/iobit::iobit-signed-component
      - id: well-known/app/utility/sony-ps-remote-play::sony-ps-remote-play-installer-identity
      - id: well-known/lib/data/sqlite::sqlite-version-resource-identity
      - id: well-known/lib/runtime/scripted/node-runtime::signed-node-v8-runtime
      - id: well-known/tool/development/observability/inspect::inspect-devtools-nsis-uninstaller-context
      - id: well-known/lib/vendor-sdk/nsoftware-ipworks::ipworks-library-benign-context
      - id: well-known/app/utility/core-temp::core-temp-identity
      - id: well-known/app/system/dell-update::dell-update-package-binary
      - id: well-known/app/browser/mozilla-firefox::firefox-cache2-entry-context

  # A certificate table over a zeroed checksum means the file was signed and
  # then modified; paired with an executable resource section dominated by
  # encrypted bytes, the pairing is the tamper signature of an infected
  # signed host (file infectors preserve the cert while rewriting the body).
  - id: tampered-cert-encrypted-resource-body
    desc: Tampered cert over dominant resource body
    crit: hostile
    conf: 0.94
    all:
      - id: metadata/binary/layout/checksum::cert-data-zeroed-checksum
      - id: metadata/binary/section/permission::executable-rsrc-section
      - id: metadata/binary/section/ratio::largest-section-at-least-90-percent
    unless:
      - id: well-known/dual-use/packaging/enigma-protector::v1-loader-stub

  # Epic Games does not publish Huorong/Inno Setup installers.  The signer is
  # an abuse anchor here; the hostile verdict also requires a verified legacy
  # certificate, dominant opaque Inno data, and a zeroed PE checksum.
  - id: abused-epic-signed-inno-carrier
    desc: Abused Epic-signed Inno carrier with dominant opaque payload
    crit: hostile
    conf: 0.99
    attack: T1027.002,T1036.005,T1553.002
    all:
      - id: metadata/signed/leaf::epic-games-inc.
      - id: metadata/signed/certificate/signature::pe-signature-verified-kv
      - id: metadata/signed/certificate/signature::pe-cert-leaf-sha1-signature
      - id: metadata/binary/installer/family::inno-delphi-installer-foundation
      - id: metadata/binary/layout/overlay::overlay-80kb-high-entropy
      - id: metadata/binary/layout/ratio::overlay-over-90pct
      - id: metadata/binary/layout/checksum::cert-data-zeroed-checksum

  # A malformed PE with a Microsoft leaf certificate and a huge low-entropy
  # relocation section is a distinct signed-loader pattern even when the
  # relocation bytes are not high-entropy enough for the encrypted-payload
  # composite above.
  - id: signed-malformed-reloc-loader
    desc: Microsoft-signed malformed PE hides data in oversized relocations
    crit: hostile
    conf: 0.97
    attack: T1027,T1553.002
    all:
      - id: metadata/signed/leaf::microsoft-corporation
      - id: metadata/binary/header/malformed::malformed-pe-structure
      - id: metadata/binary/section/ratio::oversized-low-entropy-reloc-declaration

  # Require an invalid signed-image digest and the full remote allocation,
  # memory-write, and thread-creation API set. Thread-context inspection and
  # VirtualProtect alone also occur in legitimate crash-reporting DLLs.
  - id: signed-renamed-overlay-remote-thread-injection
    desc: Signed PE with mismatched digest, large overlay and remote-thread injection APIs
    crit: hostile
    conf: 0.97
    attack: T1553.002,T1036.005,T1055.003
    all:
      - id: metadata/binary/provenance/version-info::pe-basename-differs-from-original-filename
      - id: metadata/binary/layout/overlay::signed-pe-large-noncertificate-overlay
      - id: metadata/signed/certificate/signature::pe-signature-digest-mismatch
      - id: micro-behaviors/process/inject/remote-thread::remote-alloc-write-thread-api-set
    unless:
      - id: metadata/binary/installer/family/
      - id: metadata/signed/platform/
      - id: well-known/tool/sysadmin/sysinternals/

  # Signed binary with a massive high-entropy non-certificate overlay and
  # native loader API surface (e.g. trojanized signed loaders / ACRStealer).
  - id: signed-host-encrypted-overlay-loader
    desc: Signed host high-entropy overlay loader
    crit: hostile
    conf: 0.98
    attack: T1553.002,T1027.002,T1620
    all:
      - id: metadata/binary/layout/overlay::signed-pe-large-noncertificate-overlay
      - id: metadata/binary/layout/overlay::overlay-80kb-high-entropy
      - id: objectives/command-and-control/backdoor/loader/native-reflect::loader-api-surface
    unless:
      - id: metadata/binary/installer/
      - id: metadata/signed/platform/
      - id: recognized-signed-component-overlay-known-benign-context

  # Signed binary with a high-entropy non-certificate overlay and process memory injection
  # (e.g. trojanized signed binary injecting decrypted payload into memory).
  - id: signed-host-encrypted-overlay-process-injection
    desc: Signed host with encrypted overlay and process memory injection
    crit: hostile
    conf: 0.98
    attack: T1553.002,T1027.002,T1055
    all:
      - id: metadata/binary/layout/overlay::signed-pe-large-noncertificate-overlay
      - id: metadata/file/entropy::overall-entropy-78
      - id: micro-behaviors/mem/write/arbitrary::write-process-memory-binary
    any:
      - id: micro-behaviors/mem/sync/cache::flush-instruction-cache
      - id: micro-behaviors/process/create/thread::create-thread
    unless:
      - id: metadata/binary/installer/
      - id: metadata/signed/platform/
      - id: recognized-signed-component-overlay-known-benign-context
