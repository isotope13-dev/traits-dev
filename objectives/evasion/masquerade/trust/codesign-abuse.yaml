# Code-signing trust abuse: a binary that carries an embedded code-signing
# certificate (so it presents as a signed, trustworthy product) while hiding a
# malicious payload. Trojanized-signed-host loaders (e.g. ACRStealer / Shelma)
# graft an encrypted second stage onto a real signed component; the file still
# ships the original certificate table even though the body no longer matches.
defaults:
  platforms: [windows]
  for: [pe, dll]
  attack: T1553.002
  mbc: B0032
composite_rules:
  # A vendor's signature over bytes that are no longer the vendor's.
  #
  # The composites below reach for proxies -- checksum mismatch, high-entropy
  # overlay, overlay-over-90pct -- because until filefacts recomputed the
  # Authentihash there was no way to ask the question directly. This asks it
  # directly: the image digest the signature commits to does not match the
  # image, and the certificate wearing that signature belongs to a platform
  # vendor. Patching a stolen signed binary leaves exactly this pair, and
  # `verified` stays true throughout because the PKCS#7 blob is untouched.
  #
  # The vendor leg is what separates this from an installer that stamps its own
  # configuration in after signing: that binary breaks its own signature, not
  # somebody else's.
  - id: vendor-signature-over-modified-image
    desc: Vendor-signed PE modified after signing
    crit: hostile
    conf: 0.97
    attack: T1036.001,T1553.002
    all:
      - id: metadata/binary/provenance/signature::pe-signature-digest-mismatch
    any:
      - id: metadata/signed/leaf::microsoft-corporation
      - id: metadata/signed/leaf::mozilla-corporation
      - id: metadata/signed/platform/
    unless:
      - id: well-known/tool/sysadmin/sysinternals::process-explorer-build-identity
      # StormAttack-style service DLL hijack already reports the hostile
      # persistence chain; keep digest mismatch from stacking a third verdict.
      - id: objectives/persistence/system/service/install::lanmanserver-resource-injection-hijack

  # Certificate table points outside the image while the body walks the
  # filesystem to touch other executables — transplanted signing on an infector.
  - id: cert-transplant-file-walker-infector
    desc: Transplanted-cert PE enumerates files and timestomps
    crit: hostile
    conf: 0.97
    attack: T1553.002,T1554,T1070.006
    all:
      - id: metadata/binary/layout/checksum::cert-transplant-indicators
      - id: micro-behaviors/fs/directory/readdir::find-file-walker
    any:
      - id: micro-behaviors/fs/file/timestamp::set-file-time
      - id: micro-behaviors/fs/delete/file/library::deletefile-a
      - id: metadata/binary/section/header::pe-entry-in-writable-section
    needs: 1
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/installer/family/

  - id: cert-transplant-fake-upx-carrier
    desc: Transplanted certificate on stripped UPX-layout PE
    crit: hostile
    conf: 0.96
    attack: T1553.002,T1027.002
    all:
      - id: metadata/binary/layout/checksum::cert-transplant-indicators
      - id: metadata/binary/section/label::upx-section-pair
    unless:
      - id: objectives/anti-static/pack/upx::upx-magic-bytes
      - id: metadata/signed/platform/
      - id: metadata/binary/installer/family/

  - id: signed-nsis-zero-width-overlay-carrier
    desc: Microsoft-signed NSIS carrier hides a zero-width-marked high-entropy overlay
    crit: hostile
    conf: 0.99
    attack: T1027,T1036.005,T1553.002
    all:
      - id: metadata/signed/leaf::microsoft-corporation
      - id: metadata/binary/installer/script::nsis
      - id: metadata/binary/layout/checksum::certificate-directory-checksum-mismatch
      - id: metadata/binary/layout/overlay::high-entropy-overlay
      - id: metadata/binary/layout/ratio::overlay-over-90pct
      - id: objectives/anti-static/obfuscation/anti-decompile::zero-width-managed-pe-marker-206d
      - id: objectives/anti-static/obfuscation/anti-decompile::zero-width-managed-pe-marker-206f

  - id: signed-inno-opaque-marker-carrier
    desc: Signed Inno carrier hides a zero-width opaque payload
    crit: hostile
    conf: 0.99
    attack: T1027,T1036.005,T1553.002
    all:
      - id: metadata/binary/layout/checksum::cert-data-zeroed-checksum
      - id: metadata/binary/layout/overlay::high-entropy-overlay
      - id: metadata/binary/layout/ratio::overlay-over-90pct
      - id: metadata/binary/installer/family::inno-delphi-installer-foundation
      - id: objectives/anti-static/obfuscation/anti-decompile::zero-width-managed-pe-marker-206d
      - id: objectives/anti-static/obfuscation/anti-decompile::zero-width-managed-pe-marker-206f

  # Keep identity-based product/runtime exceptions in one context. Each leg is
  # a notable identity; the composite is used only as a benign suppressor.
  - id: recognized-signed-component-overlay-known-benign-context
    desc: Recognized signed component overlay context
    crit: exception
    conf: 0.99
    for: [pe]
    any:
      - id: well-known/app/system/iobit::iobit-signed-component
      - id: well-known/app/utility/sony-ps-remote-play::sony-ps-remote-play-installer-identity
      - id: well-known/lib/data/sqlite::sqlite-version-resource-identity
      - id: well-known/lib/runtime/scripted/node-runtime::signed-node-v8-runtime
      - id: well-known/tool/development/observability/inspect::inspect-devtools-nsis-uninstaller-context
      - id: well-known/lib/vendor-sdk/nsoftware-ipworks::ipworks-library-benign-context
      - id: well-known/app/utility/core-temp::core-temp-identity
      - id: well-known/app/system/dell-update::dell-update-package-binary

  # The same carrier without an embedded PE. The span's content and position
  # relative to the certificate are unknown, so this stays suspicious without
  # claiming a pre- or post-signature append.
  - id: signed-host-large-noncertificate-overlay
    desc: Signed host has large non-certificate overlay
    crit: suspicious
    conf: 0.9
    all:
      - id: metadata/binary/layout/checksum::cert-table-present
      - id: metadata/binary/signing::signed-pe-large-noncertificate-overlay
    unless:
      # The executable-overlay rule is the more specific interpretation of
      # this same structural anomaly; do not report both for one carrier.
      - id: metadata/binary/layout/overlay::cert-overlay-embedded-pe-profile
      # An extracted child can inherit following sibling bytes in its analysis
      # slice even though its own PE extent has no overlay.
      - id: metadata/binary/layout/embedded::embedded-pe-child
      # Same bundle-host packaging as the executable-overlay sibling
      # above: a .NET single-file publish appends the program to the
      # signed native runtime host as overlay, so the host meets both
      # legs by construction. Same host-stub gate as above.
      - id: metadata/binary/framework::dotnet-runtime-host-stub
      # Installer payloads are normally placed between the PE sections and
      # the certificate table before the final signing step.
      - id: metadata/binary/installer/
      - id: metadata/signed/platform/
      - id: well-known/tool/development/observability/inspect::inspect-devtools-nsis-uninstaller-context
      - id: recognized-signed-component-overlay-known-benign-context
      # JetBrains' verified native launcher carries its managed bootstrapper
      # and application payload as part of the signed distribution image.
      - id: well-known/tool/development/editor/jetbrains::signed-jetbrains-native-launcher
      # Unstripped PE builds leave the COFF symbol table between the last
      # mapped section and the Authenticode blob; that padding is debug
      # residue, not a grafted pre-certificate carrier.
      - id: metadata/binary/symbols/count::pe-coff-symbol-table-overlay-context

  # Carries a code-signing certificate AND conceals an encrypted payload in an
  # oversized .reloc. A genuinely signed product never hides an encrypted stage
  # in its relocation section, so the pairing is the trust-abuse signature of a
  # trojanized signed host. References the concealed-payload composite so the
  # structural gate (entropy + overhang) is inherited.
  - id: signed-host-concealed-payload
    desc: Signed host conceals encrypted payload
    crit: hostile
    conf: 0.95
    all:
      - id: metadata/binary/layout/checksum::cert-table-present
      - id: objectives/anti-static/pack/loader-noise::reloc-concealed-encrypted-payload

  # Epic Games does not publish Huorong/Inno Setup installers.  The signer is
  # an abuse anchor here; the hostile verdict also requires a verified legacy
  # certificate, dominant opaque Inno data, and a zeroed PE checksum.
  - id: abused-epic-signed-inno-carrier
    desc: Abused Epic-signed Inno carrier with dominant opaque payload
    crit: hostile
    conf: 0.99
    attack: T1027.002,T1036.005,T1553.002
    all:
      - id: metadata/signed/leaf::epic-games-inc.
      - id: metadata/signed/certificate/signature::pe-signature-verified-kv
      - id: metadata/signed/certificate/signature::pe-cert-leaf-sha1-signature
      - id: metadata/binary/installer/family::inno-delphi-installer-foundation
      - id: metadata/binary/layout/overlay::overlay-80kb-high-entropy
      - id: metadata/binary/layout/ratio::overlay-over-90pct
      - id: metadata/binary/layout/checksum::cert-data-zeroed-checksum

  # A malformed PE with a Microsoft leaf certificate and a huge low-entropy
  # relocation section is a distinct signed-loader pattern even when the
  # relocation bytes are not high-entropy enough for the encrypted-payload
  # composite above.
  - id: signed-malformed-reloc-loader
    desc: Microsoft-signed malformed PE hides data in oversized relocations
    crit: hostile
    conf: 0.97
    attack: T1027,T1553.002
    all:
      - id: metadata/signed/leaf::microsoft-corporation
      - id: metadata/binary/header/malformed::malformed-pe-structure
      - id: metadata/binary/section/ratio::oversized-low-entropy-reloc-declaration

  # Signed hosts abused as injection carriers often keep Authenticode metadata
  # from the donor product while grafting thread-context control and memory
  # protection changes under a mismatched filename.
  - id: signed-renamed-overlay-thread-injection
    desc: Signed renamed PE with large overlay and thread injection
    crit: hostile
    conf: 0.97
    attack: T1553.002,T1036.005,T1055.003
    all:
      - id: metadata/binary/provenance/version-info::pe-basename-differs-from-original-filename
      - id: metadata/binary/signing::signed-pe-large-noncertificate-overlay
      - id: micro-behaviors/process/info/thread::get-thread-context-import
      - id: micro-behaviors/mem/protect/modify::virtual-protect
    any:
      - id: micro-behaviors/process/info/thread::thread-context-api-pair
      - id: micro-behaviors/process/enumerate/snapshot::create-toolhelp32-snapshot
    unless:
      - id: metadata/binary/installer/family/
      - id: metadata/signed/platform/

  # Signed binary with a massive high-entropy non-certificate overlay and
  # native loader API surface (e.g. trojanized signed loaders / ACRStealer).
  - id: signed-host-encrypted-overlay-loader
    desc: Signed host high-entropy overlay loader
    crit: hostile
    conf: 0.98
    attack: T1553.002,T1027.002,T1620
    all:
      - id: metadata/binary/signing::signed-pe-large-noncertificate-overlay
      - id: metadata/binary/layout/overlay::overlay-80kb-high-entropy
      - id: objectives/command-and-control/backdoor/loader/native-reflect::loader-api-surface
    unless:
      - id: metadata/binary/installer/
      - id: metadata/signed/platform/
      - id: recognized-signed-component-overlay-known-benign-context

  # Signed binary with a high-entropy non-certificate overlay and process memory injection
  # (e.g. trojanized signed binary injecting decrypted payload into memory).
  - id: signed-host-encrypted-overlay-process-injection
    desc: Signed host with encrypted overlay and process memory injection
    crit: hostile
    conf: 0.98
    attack: T1553.002,T1027.002,T1055
    all:
      - id: metadata/binary/signing::signed-pe-large-noncertificate-overlay
      - id: metadata/file/entropy::overall-entropy-78
      - id: micro-behaviors/process/inject/runtime/call::write-process-memory-binary
    any:
      - id: micro-behaviors/mem/sync/cache::flush-instruction-cache
      - id: micro-behaviors/process/create/thread::create-thread
    unless:
      - id: metadata/binary/installer/
      - id: metadata/signed/platform/
      - id: recognized-signed-component-overlay-known-benign-context

  # Signed binary with a high-entropy non-certificate overlay and obfuscated
  # memory allocation or protection API (e.g. parasitic infectors like Floxif
  # or trojanized signed hosts unpacking payload into memory).
  - id: signed-host-encrypted-overlay-obfuscated-memory-protect
    desc: Signed host with encrypted overlay and obfuscated memory protection
    crit: hostile
    conf: 0.98
    attack: T1553.002,T1027.002,T1620
    all:
      - id: metadata/binary/signing::signed-pe-large-noncertificate-overlay
      - id: metadata/binary/layout/overlay::overlay-80kb-high-entropy
    any:
      - id: micro-behaviors/mem/protect/modify::xor-decoded-virtual-protect-api
      - id: objectives/anti-static/obfuscation/decoders::xor-decoded-process-write-api
      - id: objectives/anti-static/obfuscation/decoders::xor-decoded-virtual-alloc-api
    unless:
      - id: metadata/binary/installer/
      - id: metadata/signed/platform/
      - id: recognized-signed-component-overlay-known-benign-context

