# Suspicious Unsigned Binary Detection
defaults:
  platforms: [windows]
  for: [pe, dll]
  crit: notable
  conf: 0.8
composite_rules:
  - id: microsoft-attributed-rolling-xor-memory-loader
    desc: Microsoft-attributed rolling-XOR memory loader
    crit: hostile
    conf: 0.995
    attack: T1036.005,T1027,T1140,T1620
    for: [pe]
    all:
      - id: metadata/binary/vendor::microsoft-corp-versioninfo
      - id: metadata/binary/layout::pe-checksum-content-invalid
      - id: objectives/anti-static/obfuscation/payload/encrypted::x64-rwx-rolling-xor-memory-loader
    unless:
      - id: metadata/signed/platform/
      - id: metadata/signed/certificate/identity/
      - id: metadata/binary/installer/

  - id: unsigned-pe-microsoft-version-claim
    desc: PE has Microsoft version metadata but no verifiable embedded signature
    crit: notable
    conf: 0.94
    attack: T1036.005
    all:
      - id: metadata/binary/layout::pe-no-signature-record
      - id: metadata/binary/vendor::microsoft-corp-versioninfo
    unless:
      - id: well-known/app/utility/windows-update::wusa-system-context
      - id: metadata/binary/vendor::windows-system-implementer-dll
      - id: well-known/lib/platform/wine/
      - id: metadata/binary/resource::resource-only-dll-context
      - id: objectives/evasion/masquerade/pe-tampering::microsoft-office-csi-ship-binary
      - id: well-known/lib/platform/microsoft-system/
      - id: well-known/lib/platform/microsoft-wininet/
      - id: well-known/app/system/windows-core-utilities/
  # Microsoft does not ship UPX-packed binaries, and every genuine Microsoft OS
  # component carries an Authenticode signature. The UPX0/UPX1 names here are
  # demonstrably a disguise: UPX1 has no compressed payload and sandbox-memory
  # reconstruction/tooling contexts are excluded by the referenced rule.
  #
  # This rung exists because the forged version resource is the *evasion*, not
  # a mitigation. Most of the fake-UPX loader family carries
  # `unless: metadata/package/versioning::pe-version-resource`, so stamping four
  # strings into RT_VERSION stands those rules down -- and a crypter that
  # bothers to impersonate Microsoft has always stamped them. Requiring the
  # forged resource as a leg turns that escape hatch into evidence.
  #
  - id: unsigned-microsoft-fake-upx-layout
    desc: Unsigned Microsoft-claim PE uses an uncompressed fake-UPX layout
    crit: hostile
    conf: 0.97
    attack: T1036.005,T1027.002
    for: [pe]
    all:
      - id: unsigned-pe-microsoft-version-claim
      - id: objectives/anti-static/pack/section-names::upx-named-sections-uncompressed
    unless:
      - id: metadata/signed/platform/
      - id: metadata/signed/certificate/identity/

  - id: unsigned-microsoft-high-entropy-memory-loader
    desc: Unsigned Microsoft-claim PE protects high-entropy data
    crit: hostile
    conf: 0.97
    attack: "T1036.005,T1027.002"
    all:
      - id: unsigned-pe-microsoft-version-claim
      - id: metadata/binary/section/metrics::high-entropy-rdata-section
      - id: micro-behaviors/mem/protect/modify::virtual-protect
    unless:
      - id: metadata/signed/platform/
      - id: metadata/signed/certificate/identity/
      - id: metadata/binary/installer/family/
      - id: well-known/app/storage/peazip/
  - id: suspicious-unsigned-binary
    desc: "Detects an unsigned binary with suspicious characteristics"
    unless:
      - id: metadata/signed/platform/
      - id: metadata/signed/certificate/identity/
    any:
      - id: metadata/binary/metrics/structural::pe-code-entropy-78
      - id: micro-behaviors/os/env/access::peb-access-x64
  - id: unsigned-microsoft-command-loader
    desc: Unsigned Microsoft-claim PE executes cmd shell
    crit: hostile
    conf: 0.95
    attack: "T1036.005,T1059.003"
    all:
      - id: unsigned-pe-microsoft-version-claim
      - id: micro-behaviors/process/create/exec::cmd-shell-via-createprocess
    any:
      - id: metadata/binary/section/metrics::writable-text-section
      - id: metadata/binary/anomaly/signing::small-high-entropy-data-section
      - id: metadata/binary/metrics/structural::high-code-entropy
    unless:
      - id: metadata/signed/platform/
      - id: well-known/app/storage/peazip/
  - id: unsigned-microsoft-writable-cmd-loader
    desc: Unsigned Microsoft writable cmd loader
    crit: hostile
    conf: 0.96
    attack: "T1036.005,T1059.003"
    all:
      - id: unsigned-microsoft-command-loader
      - id: metadata/binary/section/metrics::writable-text-section
  - id: unsigned-microsoft-embedded-pe-benign-context
    desc: Recognized benign embedded PE context
    crit: exception
    conf: 0.99
    any:
      - id: metadata/signed/platform/
      - id: metadata/signed/certificate/identity/
      - id: metadata/binary/installer/family/
      - id: metadata/binary/installer/sfx/
      - id: metadata/library/mfc/
      - id: well-known/app/storage/peazip/
      - id: well-known/tool/sysadmin/oscdimg::oscdimg-utility
      - id: well-known/app/system/stresstimulus/
      - id: well-known/tool/sysadmin/virtualization::microsoft-appv-mavinject
      - id: well-known/app/system/windows-migration::mighost-binary-identity
      - id: well-known/lib/platform/microsoft-system::media-foundation-protected-pipeline
  - id: unsigned-microsoft-embedded-pe
    desc: Unsigned Microsoft-claim PE with embedded payload
    crit: hostile
    conf: 0.97
    attack: "T1036.005,T1027.009"
    all:
      - id: unsigned-pe-microsoft-version-claim
      - id: metadata/binary/layout::pe-embedded
    unless:
      - id: unsigned-microsoft-embedded-pe-benign-context
      - id: metadata/binary/framework::dotnet-assembly

  # Genuine Microsoft system binaries are signed and do not enter through a
  # writable, non-executable packed-loader section. This combines the forged
  # provenance with the independently detected runtime unpacking structure.
  - id: unsigned-microsoft-concealed-packed-entry-loader
    desc: Unsigned Microsoft-claim PE uses a concealed packed entry loader
    crit: hostile
    conf: 0.98
    attack: "T1036.005,T1027.002"
    all:
      - id: unsigned-pe-microsoft-version-claim
      - id: objectives/anti-static/pack/section-anomaly::writable-nonexec-entry-dynamic-loader
    unless:
      - id: metadata/signed/platform/
      - id: metadata/signed/certificate/identity/
      - id: metadata/binary/installer/family/
  - id: unsigned-microsoft-scrubbed-build-profile
    desc: Unsigned Microsoft-claim PE with zeroed build timestamp and PEB access
    crit: hostile
    conf: 0.96
    for: [pe]
    arch: [x86]
    size_max: 1048576
    attack: T1036.005,T1070.006
    all:
      - id: unsigned-pe-microsoft-version-claim
      - id: metadata/binary/anomaly/provenance::pe-zero-timestamp
      - id: objectives/anti-static/obfuscation/imports::teb-peb-access
    unless:
      - id: metadata/signed/platform/
      - id: metadata/signed/certificate/identity/

  - id: unsigned-microsoft-heavens-gate-loader
    desc: Unsigned Microsoft-claim PE uses an importless Heaven's Gate loader
    crit: hostile
    conf: 0.99
    for: [pe]
    arch: [x86]
    attack: T1036.005,T1027.007,T1620
    all:
      - id: unsigned-pe-microsoft-version-claim
      - id: metadata/binary/metrics/structural::no-imports
      - id: metadata/binary/anomaly/provenance::pe-zero-timestamp
      - id: micro-behaviors/os/compat/wow64::x86-heavens-gate-transition
    unless:
      - id: metadata/signed/platform/
      - id: metadata/signed/certificate/identity/

  - id: unsigned-microsoft-encrypted-manual-loader
    desc: Unsigned Microsoft-claim PE with an encrypted manually resolved loader
    crit: hostile
    conf: 0.99
    attack: T1036.005,T1027.013,T1620
    all:
      - id: unsigned-pe-microsoft-version-claim
      - id: micro-behaviors/os/api-resolution/manual::x64-pe-export-directory-walk
      - id: micro-behaviors/crypto/symmetric/xxtea::x64-xxtea-decrypt-round
      - id: micro-behaviors/mem/protect/modify::virtual-alloc
      - id: micro-behaviors/process/thread/create::create-thread
    unless:
      - id: metadata/signed/platform/
      - id: metadata/signed/certificate/identity/
  - id: unsigned-microsoft-rwx-reloc-carrier
    desc: Unsigned Microsoft PE carries RWX reloc payload
    crit: hostile
    conf: 0.99
    attack: T1036.005,T1027.009
    for: [pe]
    all:
      - id: unsigned-pe-microsoft-version-claim
      - id: objectives/anti-static/pack/section-anomaly::reloc-rwx-payload-section
      - id: metadata/binary/layout::pe-checksum-valid

  - id: unsigned-microsoft-cloned-text-loader
    desc: Unsigned Microsoft-claim PE conceals code in cloned text sections
    crit: hostile
    conf: 0.99
    attack: T1036.005,T1027.002
    for: [pe]
    all:
      - id: unsigned-pe-microsoft-version-claim
      - id: objectives/anti-static/pack/runtime::inflated-reloc-cloned-text-loader
    unless:
      - id: metadata/signed/platform/
      - id: metadata/signed/certificate/identity/

  - id: unsigned-microsoft-ror13-api-loader
    desc: Unsigned Microsoft-claim PE hides API resolution with ROR13
    crit: hostile
    conf: 0.98
    for: [pe]
    attack: T1036.005,T1027.007
    all:
      - id: unsigned-pe-microsoft-version-claim
      - id: objectives/anti-static/obfuscation/imports::api-hash-resolution
      - id: metadata/binary/anomaly/provenance::pe-zero-timestamp
    unless:
      - id: metadata/signed/platform/
      - id: metadata/signed/certificate/identity/

  - id: unsigned-microsoft-shellcode-thread-implant
    desc: Unsigned Microsoft-claim PE carries an encoded RWX thread implant
    crit: hostile
    conf: 0.995
    for: [pe]
    attack: T1036.005,T1027.002,T1620
    all:
      - id: unsigned-pe-microsoft-version-claim
      - id: objectives/evasion/process/injection/shellcode::ror13-rwx-thread-shellcode-loader-x86
    unless:
      - id: metadata/signed/platform/
      - id: metadata/signed/certificate/identity/
  - id: unsigned-microsoft-importless-tampered-loader
    desc: Unsigned Microsoft importless tampered loader
    crit: hostile
    conf: 0.98
    for: [pe]
    attack: T1036.005,T1027.007,T1070.006
    all:
      - id: unsigned-pe-microsoft-version-claim
      - id: metadata/binary/metrics/structural::no-imports
      - id: metadata/binary/anomaly/provenance::pe-zero-timestamp
      - id: metadata/binary/layout::pe-checksum-mismatch
    unless:
      - id: metadata/signed/platform/
      - id: metadata/signed/certificate/identity/

  # Planted VERSION.DLL sideload: Microsoft identity, VERSION export set, and a
  # certificate table that does not actually verify.
  - id: microsoft-version-dll-truncated-cert-proxy
    desc: VERSION.DLL claims Microsoft with a truncated certificate table
    crit: hostile
    conf: 0.98
    attack: T1574.002,T1036.005,T1553.002
    all:
      - id: metadata/binary/symbols/version-proxy::basename-version-dll
      - id: metadata/binary/symbols/version-proxy::version-proxy-api-export-set
      - id: metadata/binary/vendor::microsoft-corp-versioninfo
      - id: metadata/binary/layout::cert-table-truncated
