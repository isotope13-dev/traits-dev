# Suspicious Unsigned Binary Detection
defaults:
  platforms: [windows]
  for: [pe, dll]
  crit: notable
  conf: 0.8
composite_rules:
  - id: microsoft-attributed-rolling-xor-memory-loader
    desc: Microsoft-attributed rolling-XOR memory loader
    crit: hostile
    conf: 0.995
    attack: T1036.005,T1027,T1140,T1620
    for: [pe]
    all:
      - id: metadata/binary/vendor::microsoft-corp-versioninfo
      - id: metadata/binary/layout/checksum::pe-checksum-content-invalid
      - id: objectives/anti-static/obfuscation/payload/encrypted::x64-rwx-rolling-xor-memory-loader
    unless:
      - id: metadata/signed/platform/
      - id: metadata/signed/certificate/identity/
      - id: metadata/binary/installer/

  - id: unsigned-microsoft-vmprotect-packed
    desc: Unsigned Microsoft-claim PE is packed with VMProtect
    crit: hostile
    conf: 0.98
    attack: T1036.005,T1027.002
    for: [pe]
    all:
      - id: metadata/signed/trust-level::unsigned-pe-microsoft-version-fields
      - id: metadata/build/protector::vmprotect-section-reference
    unless:
      - id: metadata/signed/platform/
      - id: metadata/signed/certificate/identity/

  - id: unsigned-microsoft-fake-upx-layout
    desc: Unsigned Microsoft-claim PE uses an uncompressed fake-UPX layout
    crit: hostile
    conf: 0.97
    attack: T1036.005,T1027.002
    for: [pe]
    all:
      - id: metadata/signed/trust-level::unsigned-pe-microsoft-version-fields
      - id: metadata/binary/section/layout::upx-named-sections-without-high-entropy-code
    unless:
      - id: metadata/signed/platform/
      - id: metadata/signed/certificate/identity/

  - id: unsigned-microsoft-high-entropy-memory-loader
    desc: Unsigned Microsoft-claim PE protects high-entropy data
    crit: hostile
    conf: 0.97
    attack: "T1036.005,T1027.002"
    all:
      - id: metadata/signed/trust-level::unsigned-pe-microsoft-version-fields
      - id: metadata/binary/section/entropy::high-entropy-rdata-section
      - id: micro-behaviors/mem/protect/modify::virtual-protect
    unless:
      - id: metadata/signed/platform/
      - id: metadata/signed/certificate/identity/
      - id: metadata/binary/installer/family/
      - id: well-known/app/storage/peazip/

  - id: unsigned-microsoft-packed-loader
    desc: Unsigned Microsoft-claim PE has high-entropy code and dynamic memory protection
    crit: hostile
    conf: 0.97
    attack: "T1036.005,T1027.002"
    for: [pe]
    all:
      - id: metadata/signed/trust-level::unsigned-pe-microsoft-version-fields
      - id: metadata/binary/section/entropy::high-entropy-exec-section
      - id: micro-behaviors/mem/protect/modify::virtual-protect-text-pe
    unless:
      - id: metadata/signed/platform/
      - id: metadata/signed/certificate/identity/
      - id: metadata/binary/installer/family/
      - id: well-known/app/storage/peazip/

  - id: unsigned-putty-claim-rwx-entry-loader
    desc: Unsigned PuTTY-claim PE with writable entry point and thread injection
    crit: hostile
    conf: 0.99
    attack: T1036.005,T1554,T1055
    for: [pe]
    all:
      - id: well-known/dual-use/remote-admin/putty::putty-product-name
      - id: metadata/binary/layout/checksum::writable-ep-checksum-mismatch
      - id: micro-behaviors/process/thread/create::thread-start-api-x64
    unless:
      - id: metadata/signed/platform/
  # These are co-occurring claims, command text and layout properties.
  # They establish neither a loader nor a hostile command execution path.
  - id: unsigned-microsoft-cmd-code-layout
    desc: Unsigned Microsoft claim with cmd/code layout
    crit: suspicious
    conf: 0.95
    attack: T1036.005
    all:
      - id: metadata/signed/trust-level::unsigned-pe-microsoft-version-fields
      - id: micro-behaviors/process/create/shell/command-mode::cmd-command-and-createprocess-references
    any:
      - id: metadata/binary/section/permission::writable-text-section
      - id: metadata/binary/section/entropy::small-high-entropy-data-section
      - id: metadata/binary/code/entropy::high-code-entropy
    unless:
      - id: metadata/signed/platform/
      - id: well-known/app/storage/peazip/
      - id: objectives/evasion/self-delete/file/script::wininet-office-self-delete-rat
  - id: unsigned-microsoft-writable-nonexec-entry
    desc: Unsigned Microsoft claim with nonexec entry
    crit: suspicious
    conf: 0.98
    attack: "T1036.005"
    all:
      - id: metadata/signed/trust-level::unsigned-pe-microsoft-version-fields
      - id: metadata/binary/section/header::pe-entry-in-writable-section
      - id: metadata/binary/section/ratio::pe-no-executable-sections
      - id: metadata/file/entropy::high-overall-entropy-70
      - id: micro-behaviors/dylib/lookup::pe-dynamic-linking-api-references
    unless:
      - id: metadata/signed/platform/
      - id: metadata/signed/certificate/identity/
      - id: metadata/binary/installer/family/
      - id: metadata/binary/framework::dotnet-assembly
  - id: unsigned-microsoft-scrubbed-build-profile
    desc: Unsigned Microsoft-claim PE with zeroed build timestamp and PEB access
    crit: hostile
    conf: 0.96
    for: [pe]
    arch: [x86]
    size_max: 1048576
    attack: T1036.005,T1070.006
    all:
      - id: metadata/signed/trust-level::unsigned-pe-microsoft-version-fields
      - id: metadata/binary/provenance/build::pe-zero-timestamp
      - id: micro-behaviors/os/sysinfo/process::teb-self-pointer-x86
    unless:
      - id: metadata/signed/platform/
      - id: metadata/signed/certificate/identity/

  - id: unsigned-microsoft-heavens-gate-loader
    desc: Unsigned Microsoft-claim PE uses an importless Heaven's Gate loader
    crit: hostile
    conf: 0.99
    for: [pe]
    arch: [x86]
    attack: T1036.005,T1027.007,T1620
    all:
      - id: metadata/signed/trust-level::unsigned-pe-microsoft-version-fields
      - id: metadata/binary/symbols/count::no-imports
      - id: metadata/binary/provenance/build::pe-zero-timestamp
      - id: micro-behaviors/os/compat/wow64::x86-heavens-gate-transition
    unless:
      - id: metadata/signed/platform/
      - id: metadata/signed/certificate/identity/

  - id: unsigned-microsoft-encrypted-manual-loader
    desc: Unsigned Microsoft-claim PE with an encrypted manually resolved loader
    crit: hostile
    conf: 0.99
    attack: T1036.005,T1027.013,T1620
    all:
      - id: metadata/signed/trust-level::unsigned-pe-microsoft-version-fields
      - id: micro-behaviors/os/api-resolution/manual::x64-pe-export-directory-walk
      - id: micro-behaviors/crypto/symmetric/xxtea::x64-xxtea-decrypt-round
      - id: micro-behaviors/mem/alloc/virtual::virtual-alloc
      - id: micro-behaviors/process/thread/create::create-thread
    unless:
      - id: metadata/signed/platform/
      - id: metadata/signed/certificate/identity/
  - id: unsigned-microsoft-rwx-reloc-carrier
    desc: Unsigned Microsoft PE carries RWX reloc payload
    crit: hostile
    conf: 0.99
    attack: T1036.005,T1027.009
    for: [pe]
    all:
      - id: metadata/signed/trust-level::unsigned-pe-microsoft-version-fields
      - id: objectives/anti-static/pack/loader-noise::reloc-rwx-payload-section
      - id: metadata/binary/layout/checksum::pe-checksum-valid

  - id: unsigned-microsoft-cloned-text-loader
    desc: Unsigned Microsoft-claim PE conceals code in cloned text sections
    crit: hostile
    conf: 0.99
    attack: T1036.005,T1027.002
    for: [pe]
    all:
      - id: metadata/signed/trust-level::unsigned-pe-microsoft-version-fields
      - id: objectives/anti-static/pack/runtime::inflated-reloc-cloned-text-loader
    unless:
      - id: metadata/signed/platform/
      - id: metadata/signed/certificate/identity/

  - id: unsigned-microsoft-ror13-api-loader
    desc: Unsigned Microsoft-claim PE hides API resolution with ROR13
    crit: hostile
    conf: 0.98
    for: [pe]
    attack: T1036.005,T1027.007
    all:
      - id: metadata/signed/trust-level::unsigned-pe-microsoft-version-fields
      - id: objectives/anti-static/obfuscation/imports/api-hashing::api-hash-resolution
      - id: metadata/binary/provenance/build::pe-zero-timestamp
    unless:
      - id: metadata/signed/platform/
      - id: metadata/signed/certificate/identity/

  - id: unsigned-microsoft-shellcode-thread-implant
    desc: Unsigned Microsoft-claim PE carries an encoded RWX thread implant
    crit: hostile
    conf: 0.995
    for: [pe]
    attack: T1036.005,T1027.002,T1620
    all:
      - id: metadata/signed/trust-level::unsigned-pe-microsoft-version-fields
      - id: objectives/evasion/process/injection/shellcode::ror13-rwx-thread-shellcode-loader-x86
    unless:
      - id: metadata/signed/platform/
      - id: metadata/signed/certificate/identity/
  - id: unsigned-microsoft-importless-tampered-loader
    desc: Unsigned Microsoft importless tampered loader
    crit: hostile
    conf: 0.98
    for: [pe]
    attack: T1036.005,T1027.007,T1070.006
    all:
      - id: metadata/signed/trust-level::unsigned-pe-microsoft-version-fields
      - id: metadata/binary/symbols/count::no-imports
      - id: metadata/binary/provenance/build::pe-zero-timestamp
      - id: metadata/binary/layout/checksum::pe-checksum-mismatch
    unless:
      - id: metadata/signed/platform/
      - id: metadata/signed/certificate/identity/

  # Planted VERSION.DLL sideload: Microsoft identity, VERSION export set, and a
  # certificate table that does not actually verify.
  - id: microsoft-version-dll-truncated-cert-proxy
    desc: VERSION.DLL claims Microsoft with a truncated certificate table
    crit: hostile
    conf: 0.98
    attack: T1574.002,T1036.005,T1553.002
    all:
      - id: metadata/binary/symbols/version-proxy::basename-version-dll
      - id: metadata/binary/symbols/version-proxy::version-proxy-api-export-set
      - id: metadata/binary/vendor::microsoft-corp-versioninfo
      - id: metadata/binary/layout/checksum::cert-table-truncated
