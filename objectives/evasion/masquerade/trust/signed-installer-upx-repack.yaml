# A vendor installer keeps its publisher signature only while its bytes are
# unchanged. UPX-packing a signed installer rewrites the image, so the
# Authenticode digest no longer matches while the signer certificate is still
# attached. Vendors do not ship that; a wrapper that reuses a real vendor's
# signature block to borrow its identity does.
defaults:
  platforms: [windows]
  for: [pe]
  attack: T1036.001,T1027.002,T1553.002
composite_rules:
  - id: vendor-signed-image-upx-repacked-digest-mismatch
    desc: Signed vendor image UPX-repacked, digest mismatch
    crit: hostile
    conf: 0.85
    all:
      - id: metadata/signed/certificate/signature::pe-signature-digest-mismatch
      - id: metadata/signed/trust-level::signer-evidence-present
      - id: metadata/binary/section/label::upx-section
    unless:
      - id: metadata/signed/platform/
