defaults:
  platforms: [windows]
  for: [pe, dll]

composite_rules:
  - id: confuserex-unsigned-microsoft-claim
    desc: ConfuserEx PE claims Microsoft without signing
    crit: hostile
    conf: 0.94
    attack: T1027.002,T1036.005
    all:
      - id: objectives/anti-static/obfuscation/obfuscator/managed::confuserex-version-banner
      - id: objectives/evasion/masquerade/trust::unsigned-pe-microsoft-version-claim
    any:
      - id: metadata/binary/section/entropy::random-exec-payload-section
      - id: metadata/binary/code/entropy::high-code-entropy
    unless:
      - id: metadata/signed/platform/
