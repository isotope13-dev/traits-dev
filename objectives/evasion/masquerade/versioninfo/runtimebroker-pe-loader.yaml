defaults:
  for: [pe]
  platforms: [windows]
  attack: T1036.005,T1620

traits:
  - id: runtimebroker-original-filename
    desc: PE claims RuntimeBroker.exe original filename
    crit: notable
    conf: 0.95
    if:
      type: text
      exact: RuntimeBroker.exe

composite_rules:
  - id: runtimebroker-masquerade-pe-loader
    desc: PE masquerades as RuntimeBroker.exe with reflective PE loader
    crit: hostile
    conf: 0.95
    mbc: B0011
    scope: file
    all:
      - id: runtimebroker-original-filename
      - id: micro-behaviors/os/api-resolution
      - id: metadata/binary/instruction
      - id: micro-behaviors/data/format
