# Static version-identity and resource profile; no activation or encryption
# is required by these legs. Keep the original matcher and criticality.
defaults:
  platforms:
  - windows
  for:
  - pe
  arch:
  - x86
composite_rules:
- id: unsigned-microsoft-claim-with-reginst-image
  desc: Unsigned Microsoft/WinINet claim with REGINST/IMAGE labels
  crit: hostile
  conf: 0.98
  attack: T1027,T1036
  all:
  - id: metadata/binary/resource/label::reginst-resource-label
  - id: metadata/binary/resource/label::image-resource-label
  - id: micro-behaviors/ui/dialog/error::loader-error-caption
  - id: metadata/binary/section/label/packing::vr-writable-section
  - id: metadata/binary/section/label/packing::mmym-small-executable-section
  - id: micro-behaviors/mem/combined::virtual-memory-api-name-triad
  - id: metadata/signature/absent::unsigned-missing-signature-record
  any:
  - id: well-known/lib/platform/microsoft-wininet::wininet-internal-name
  - id: well-known/lib/platform/microsoft-wininet::wininet-original-filename
  - id: metadata/vendor/identity::microsoft-corp-versioninfo
  needs: 1
