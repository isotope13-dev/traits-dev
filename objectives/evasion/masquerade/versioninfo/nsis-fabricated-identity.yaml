# Self-signed NSIS installers with generated multi-field word-salad VERSIONINFO
# bundling System.dll native memory allocation and an opaque high-entropy blob.
defaults:
  platforms: [windows]
  for: [pe, data]
  attack: T1036.001,T1036.005

composite_rules:
  - id: self-signed-word-salad-nsis-memory-stager
    desc: Self-signed word-salad NSIS memory stager
    crit: hostile
    conf: 0.98
    scope: outer
    all:
      - id: well-known/tool/packaging/nsis::nsis
      - id: metadata/signature/certificate/chain::pe-cert-leaf-self-issued
      - id: objectives/evasion/masquerade/versioninfo::word-salad-version-copyright
      - id: objectives/evasion/masquerade/versioninfo::short-word-salad-versioninfo
      - id: metadata/binary/symbols/name/export::system-dll-plugin-export-profile
      - id: micro-behaviors/mem/combined::virtual-memory-allocation-protection-api-pair
      - id: metadata/file/entropy::very-high-entropy-data-file
    unless:
      - id: metadata/signature/verified/platform/
