# Microsoft does not ship its own components wrapped in the Enigma Protector,
# and a genuine Microsoft image carries an Authenticode or catalog signature
# record. An unsigned image that is Enigma-protected yet names Microsoft in its
# resource section borrows the vendor identity for the wrapped payload.
defaults:
  platforms: [windows]
  for: [pe]
  attack: T1036.005,T1027.002
composite_rules:
  - id: unsigned-enigma-protected-microsoft-resources
    desc: Unsigned Enigma-protected image naming Microsoft
    crit: suspicious
    conf: 0.85
    all:
      - id: well-known/lib/runtime/compiled/protection/enigma::pic-loader-stub
      - id: metadata/vendor/string::microsoft-corp-marker-rsrc
      - id: metadata/signature/absent::unsigned-missing-signature-record
    unless:
      - id: metadata/signature/verified/platform/
