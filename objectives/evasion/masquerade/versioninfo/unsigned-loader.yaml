defaults:
  for:
    - pe
  platforms:
    - windows
composite_rules:
  - id: unsigned-updater-claim-on-tls-obfuscated-pe
    desc: Unsigned updater claim on TLS-obfuscated PE
    crit: suspicious
    conf: 0.9
    all:
      - id: metadata/signed/trust-level::unsigned-missing-signature-record
      - id: metadata/binary/provenance/version-info::pe-version-description-updater-claim
      - id: objectives/anti-static/obfuscation/control-flow/dispatch::tls-state-relative-table-flattening

  - id: unsigned-fake-version-loader
    desc: Unsigned fake-version C2 loader
    crit: hostile
    conf: 0.98
    all:
      - id: objectives/evasion/masquerade/versioninfo::networked-fake-version-resource
      - id: objectives/command-and-control/infrastructure/ip-port::mixed-ipv4-endpoint-cluster
      - id: micro-behaviors/mem/protect/modify::getprocaddr-memory-loader-primitives
    any:
      - id: objectives/anti-analysis/debugger-detect/check::is-debugger-present-symbol
      - id: micro-behaviors/os/exception/error-handling::set-unhandled-exception-filter-import
      - id: micro-behaviors/process/debug/event::output-debug-string
  # Single-export DLLs with fabricated version metadata and a runtime-import
  # loader stub: the only export is the entry surface (rundll-style), the
  # version claims a product the loader behavior contradicts, and every
  # further API is resolved at runtime through LoadLibraryA/GetProcAddress
  # behind a writable entry section. Legitimate single-export DLLs resolve
  # their imports statically and keep a read-only entry.
  - id: unsigned-fake-version-single-export-loader
    desc: Fake-version single-export DLL resolves APIs at runtime
    crit: hostile
    conf: 0.97
    attack: T1036.005
    all:
      - id: objectives/evasion/masquerade/versioninfo::networked-fake-version-resource
      - id: metadata/binary/symbols/exports::single-export
      - id: micro-behaviors/dylib/load/runtime::load-library-a
      - id: micro-behaviors/dylib/lookup::get-proc-address-import
      - id: metadata/binary/section/header::pe-entry-in-writable-section
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/framework/
      - id: well-known/app/
  - id: unsigned-fake-version-loader-anti-analysis
    desc: Fake-version loader with anti-analysis
    crit: suspicious
    conf: 0.95
    size_max: 1048576
    all:
      - id: objectives/evasion/masquerade/versioninfo::networked-fake-version-resource
      - id: objectives/anti-analysis/debugger-detect/check::is-debugger-present-symbol
      - id: micro-behaviors/os/exception/error-handling::set-unhandled-exception-filter-import
    any:
      - id: micro-behaviors/time/sleep/interval::sleep-dup
      - id: micro-behaviors/process/debug/event::output-debug-string
      - id: micro-behaviors/time/query::get-tick-count
    unless:
      - id: metadata/binary/resource/size::resource-heavy-rsrc
      - id: metadata/binary/symbols/count::many-imports
