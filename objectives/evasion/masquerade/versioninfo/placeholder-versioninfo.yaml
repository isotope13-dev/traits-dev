defaults:
  conf: 0.95
  platforms: [windows]
  for: [pe, dll]
  attack: T1036

traits:
  - id: pe-company-name-single-char
    desc: PE CompanyName is single-character placeholder
    crit: component
    if:
      type: value
      path: pe.version.company
      regex: '^.$'

  - id: pe-file-description-single-char
    desc: "PE FileDescription is single-character stub"
    crit: component
    if:
      type: value
      path: pe.version.description
      regex: '^.$'

composite_rules:
  - id: pe-versioninfo-single-char-placeholders
    desc: PE VERSIONINFO single-character placeholders
    crit: suspicious
    size_min: 32768
    all:
      - id: pe-company-name-single-char
      - id: pe-file-description-single-char
    unless:
      # Test-fixture assemblies ship placeholder VERSIONINFO because nothing
      # ever reads it -- NUnitForms, nmock and nunit.core all do.
      - id: metadata/package/testing/
      - id: metadata/signed/platform/
      - id: metadata/lang/compiler/managed::runtime-interop