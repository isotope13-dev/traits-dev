defaults:
  platforms: [windows]
  for: [pe]
  attack: T1036.005,T1497.003

composite_rules:
  - id: everything-identity-on-stalled-payload
    desc: Unsigned anti-sandbox payload masquerades as Everything Search
    crit: hostile
    conf: 0.995
    all:
      - id: metadata/binary/resource::everything-product-name-claim
      - id: metadata/binary/resource::everything-original-filename-claim
      - id: metadata/binary/resource::everything-author-claim
      - id: objectives/anti-analysis/timing/evasion::randomized-arithmetic-sandbox-stall
      - id: metadata/binary/layout::pe-no-signature-record
