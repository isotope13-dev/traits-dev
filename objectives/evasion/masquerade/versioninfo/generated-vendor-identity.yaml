# A PE that claims a vendor identity no vendor ever registered.
#
# Filling CompanyName, ProductName and FileDescription is what makes a binary
# look like shipped software in Explorer, in a signature dialog and in an EDR
# console. Builder kits automate it from a word list, and the giveaway is
# grammatical rather than lexical: a lowercase word wedged before "Corporation",
# a registered mark sitting on a lowercase token. Two independent fields
# generated the same way is not a typo -- it is a generator.
#
# Kept separate from the loader composites so it also reports on families that
# share only the builder, not the payload.
defaults:
  platforms: [windows]
  for: [pe, dll]
  attack: T1036.001
  mbc: B0030

composite_rules:
  - id: generated-vendor-identity-fields
    desc: Version resource identity looks generated
    crit: suspicious
    conf: 0.92
    any:
      - id: metadata/package/versioning::pe-company-name-lowercase-interior-word
      - id: metadata/package/versioning::pe-product-name-mark-on-lowercase-word
      # InternalName unrelated to OriginalFilename: the same generator filling
      # a field the linker normally derives from the module it is building.
      - id: metadata/package/versioning::pe-internal-name-unrelated-phrase
    needs: 2

  # A generated vendor identity on a binary that is also unsigned and carries a
  # generated build path: every field a reviewer would use to attribute the
  # file was produced by the same kit.
  - id: fabricated-unsigned-module-identity
    desc: Fabricated identity on an unsigned module
    crit: hostile
    conf: 0.95
    all:
      - id: generated-vendor-identity-fields
      - id: metadata/binary/debug::pdb-unstructured-word-path
      - id: metadata/signed/trust-level::unsigned
