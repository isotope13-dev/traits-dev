# A PE's version resource and side-by-side manifest name the toolchain that
# produced it. When those fields name one builder while the image itself was
# clearly produced by a different, incompatible toolchain, the resource was
# copied from an unrelated product to make the file look like a known
# installer. This is deception aimed at the user running the file, not at an
# analysis tool, so it belongs under masquerade rather than anti-static.
defaults:
  attack: T1036.005
  mbc: E1036.005
  for: [pe]
  platforms: [windows]
composite_rules:
  # Inno Setup emits a Delphi SetupLdr stub; it has no Go back end and cannot
  # produce a Go image. A Go binary carrying the JR.Inno.Setup assembly
  # identity and the "built with Inno Setup" version comment therefore has
  # those resources grafted on from a real installer.
  - id: go-binary-forged-inno-setup-identity
    desc: Go executable carries forged Inno Setup installer resources
    crit: hostile
    conf: 0.97
    all:
      - id: well-known/tool/development/inno-setup::inno-setup-loader-manifest-identity
      - id: well-known/tool/development/inno-setup::inno-setup-build-comment
      - id: metadata/lang/compiler/systems::go-pe-symtab
