# An unsigned installer whose only product identifier is an opaque token and
# whose description is blank obscures its identity. This packaging observation
# does not establish the behavior of the compressed application inside it.
defaults:
  platforms: [windows]
  for: [pe]

composite_rules:
  - id: nsis-unsigned-opaque-product-empty-description
    desc: Unsigned NSIS with opaque version identity
    crit: suspicious
    conf: 0.9
    all:
      - id: well-known/tool/packaging/nsis::nsis
      - id: metadata/binary/provenance/version-info::digit-rich-alnum-product-name
      - id: metadata/binary/provenance/version-info::pe-version-empty-file-description
      - id: metadata/signature/absent::unsigned-missing-signature-record
