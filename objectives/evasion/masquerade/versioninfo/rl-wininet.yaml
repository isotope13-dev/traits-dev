defaults:
  platforms:
  - windows
  for:
  - pe
composite_rules:
- id: packed-executable-claims-wininet-dll
  desc: Packed native dropper executable claims WinINet DLL identity
  crit: hostile
  conf: 0.99
  attack: T1036
  all:
  - id: objectives/execution/payload/file-exec::rl-packed-encrypted-resource-dropper
  - id: metadata/binary/provenance/version-info::pe-version-declares-dll
  unless:
  - id: metadata/binary/header/characteristics::pe-dll-characteristics
