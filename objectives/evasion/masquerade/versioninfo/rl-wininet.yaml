defaults:
  platforms:
  - windows
  for:
  - pe
composite_rules:
- id: packed-executable-claims-wininet-dll
  desc: Unsigned resource-bearing executable claims DLL identity
  crit: hostile
  conf: 0.99
  attack: T1036
  all:
  - id: objectives/evasion/masquerade/versioninfo::unsigned-microsoft-claim-with-reginst-image
  - id: metadata/binary/provenance/version-info::pe-version-declares-dll
  unless:
  - id: metadata/binary/header/characteristics::pe-dll-characteristics
