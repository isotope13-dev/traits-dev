defaults:
  attack: T1036.005
  for:
    - pe
  platforms:
    - windows
traits:
  - id: word-salad-version-copyright
    desc: Word-salad LegalCopyright metadata
    crit: suspicious
    conf: 0.84
    if:
      type: value
      path: pe.version.copyright
      regex: ^[a-z]{4,20}( [a-z]{4,20}){2,4}$
      not:
        - regex: (?i)copyright
        - regex: (?i)rights?
        - regex: (?i)reserved
        - regex: (?i)inc\.?
        - regex: (?i)corp\.?
        - regex: (?i)company
        - regex: (?i)ltd\.?
        - regex: (?i)llc
  - id: random-alnum-company-token
    desc: Opaque alphanumeric CompanyName token
    crit: component
    conf: 0.9
    if:
      type: value
      path: pe.version.company
      regex: ^[A-Za-z0-9]{12,24}$
  - id: dotnet-bcl-type-version-product
    desc: .NET BCL type used as product name
    crit: notable
    conf: 0.86
    if:
      type: value
      path: pe.version.product_name
      exact: BitConverter
  - id: dotnet-bcl-type-original-filename
    desc: .NET BCL type used as original filename
    crit: notable
    conf: 0.86
    if:
      type: value
      path: pe.version.original_filename
      regex: ^CallConv\w+\.exe$
  - id: opaque-original-filename-token
    desc: Opaque tokenized original filename identity
    crit: notable
    conf: 0.9
    if:
      type: value
      path: pe.version.original_filename
      regex: ^[A-Z0-9]{4,}(_[A-Z0-9]{4,}){1,}\.exe$
    unless:
      - id: well-known/app/utility/sdio::sdio-official-context
  - id: short-lowercase-product-token
    desc: Wide ProductName short lowercase token
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: P\x00r\x00o\x00d\x00u\x00c\x00t\x00N\x00a\x00m\x00e\x00(\x00\x00)+([a-z]\x00){4,8}
  - id: short-lowercase-wide-exe-name
    desc: Short lowercase wide .exe version name
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: ([a-z]\x00){5,8}\.\x00e\x00x\x00e\x00
  - id: opaque-alnum-internal-name
    desc: InternalName is opaque alphanumeric token
    crit: notable
    conf: 0.88
    unless:
      - id: metadata/signature/verified/signer::adobe-systems-incorporated
    if:
      type: value
      path: pe.version.internal_name
      regex: ^[A-Za-z][A-Za-z0-9]{2,5}[0-9][A-Za-z0-9]{0,5}[0-9][A-Za-z0-9]{2,5}$
      not:
        - regex: 
            (?i)^(Microsoft|Windows|Setup|Install|Update|Helper|Service|Application|Program|Client|Server|Manager|Driver|Runtime|Framework|Atlas|Steam|Adobe|Google|Oracle|Python|Node)
  - id: atlas-archive-version-comment
    desc: Comments field references Atlas Archive
    crit: suspicious
    conf: 0.95
    if:
      type: value
      path: pe.version.comments
      regex: (?i)\bAtlas\s+Archive\b
  - id: word-salad-version-comments-pair
    desc: Two-word nonsense Comments metadata
    crit: component
    conf: 0.85
    if:
      type: value
      path: pe.version.comments
      regex: ^[a-z]{4,24} [a-z]{4,24}$
      not:
        - regex: (?i)(copyright|rights|reserved|license|version|build|debug|release|http|www)
  - id: word-salad-version-trademarks
    desc: Multi-word lowercase LegalTrademarks metadata
    crit: component
    conf: 0.85
    if:
      type: value
      path: pe.version.trademarks
      regex: ^[a-z]{4,24}( [a-z]{4,24}){1,4}$
      not:
        - regex: (?i)(trademark|registered|reserved|rights)
        - regex: (?i)\b(inc|corp|ltd|llc)\b
  - id: word-salad-version-description-pair
    desc: Two-word nonsense FileDescription
    crit: component
    conf: 0.85
    if:
      type: value
      path: pe.version.description
      regex: ^[a-z]{5,20} [a-z]{5,20}$
      not:
        - regex: 
            (?i)(copyright|rights|reserved|install|setup|update|helper|service|application|program|client|server|manager|driver|runtime|framework|microsoft|windows)
  - id: opaque-single-token-copyright
    desc: Single opaque lowercase LegalCopyright token
    crit: component
    conf: 0.8
    if:
      type: value
      path: pe.version.copyright
      regex: ^[a-z]{7,20}$
      not:
        - regex: (?i)(copyright|rights|reserved|inc|corp|ltd|llc|company)
  - id: opaque-lowercase-original-filename
    desc: OriginalFilename is a bare lowercase word
    crit: component
    conf: 0.85
    if:
      type: value
      path: pe.version.original_filename
      regex: ^[a-z]{4,20}$
      not:
        - regex: (?i)^(setup|install|installer|update|updater)$
        - regex: (?i)^(launcher|uninstall|helper|service)$
  - id: opaque-lowercase-internal-name
    desc: InternalName is a bare lowercase word
    crit: component
    conf: 0.85
    if:
      type: value
      path: pe.version.internal_name
      regex: ^[a-z]{4,20}$
      not:
        - regex: (?i)^(setup|install|installer|update|updater)$
        - regex: (?i)^(launcher|uninstall|helper|service)$
  - id: opaque-lowercase-product-name
    desc: ProductName is a bare lowercase word
    crit: component
    conf: 0.85
    if:
      type: value
      path: pe.version.product_name
      regex: ^[a-z]{4,20}$
      not:
        - regex: (?i)^(setup|install|installer|update|updater)$
        - regex: (?i)^(launcher|uninstall|helper|service|python|node)$
  - id: opaque-lowercase-trademarks
    desc: LegalTrademarks is a bare lowercase word
    crit: component
    conf: 0.85
    if:
      type: value
      path: pe.version.trademarks
      regex: ^[a-z]{5,20}$
      not:
        - regex: (?i)(trademark|registered|reserved|rights)
  - id: opaque-lowercase-comments
    desc: Comments field is a bare lowercase word
    crit: component
    conf: 0.85
    if:
      type: value
      path: pe.version.comments
      regex: ^[a-z]{5,20}$
      not:
        - regex: (?i)^(release|debug|internal|beta|alpha|stable)$
        - regex: (?i)^(freeware|shareware|opensource|none|unknown)$
composite_rules:
  - id: random-alnum-versioninfo-token-cluster
    desc: Generated tokens fill VERSIONINFO identity fields
    crit: component
    conf: 0.97
    needs: 2
    any:
      - id: random-alnum-company-token
      - id: metadata/binary/provenance/version-info::internal-name-single-alnum-word
      - id: metadata/binary/provenance/version-info::original-filename-alnum-no-extension
    unless:
      - id: metadata/signature/verified/platform/
  - id: short-word-salad-versioninfo
    desc: Multi-field short word-salad VERSIONINFO
    crit: suspicious
    conf: 0.9
    needs: 2
    any:
      - id: word-salad-version-comments-pair
      - id: word-salad-version-description-pair
      - id: word-salad-version-trademarks
      - id: opaque-lowercase-product-name
      - id: opaque-single-token-copyright
      - id: word-salad-version-copyright
    unless:
      - id: metadata/signature/verified/platform/
      # Intel's oneAPI runtime DLLs (qkmalloc) carry terse lowercase names.
      - id: metadata/signature/verified/signer::intel-corporation
  - id: opaque-themida-version-masquerade
    desc: Themida loader with opaque fabricated identity
    crit: hostile
    conf: 0.97
    attack: T1036.005,T1027.002,T1070.006
    all:
      - id: opaque-original-filename-token
      - id: objectives/anti-static/pack/detect::themida-boot-loader-layout
      - id: metadata/binary/provenance/build::pe-far-future-timestamp
    unless:
      - id: metadata/signature/verified/platform/
      - id: metadata/installer/product/
  - id: fabricated-dotnet-type-versioninfo
    desc: Fabricated .NET type VERSIONINFO identity
    crit: suspicious
    conf: 0.9
    all:
      - id: metadata/build/manifest::pe-manifest-myapplication-template
      - id: dotnet-bcl-type-version-product
      - id: dotnet-bcl-type-original-filename
  - id: opaque-alnum-anti-debug-loader
    desc: Opaque VERSIONINFO on anti-debug PE loader
    crit: hostile
    conf: 0.97
    attack: T1036.005,T1622
    all:
      - id: metadata/binary/provenance/version-info::digit-rich-alnum-product-name
      - id: opaque-alnum-internal-name
      - id: objectives/anti-static/obfuscation/imports/api-hashing::renamed-anti-debug-pe-loader
    unless:
      - id: metadata/installer/product/
  - id: atlas-archive-anti-debug-loader
    desc: Atlas Archive comment on anti-debug PE loader
    crit: hostile
    conf: 0.98
    attack: T1036.005,T1622
    all:
      - id: atlas-archive-version-comment
      - id: objectives/anti-static/obfuscation/imports/api-hashing::renamed-anti-debug-pe-loader
    unless:
      - id: metadata/installer/product/
  - id: unsigned-update-claim-manual-loader
    desc: Unsigned updater claim on an anti-debugging manual PE loader
    crit: hostile
    conf: 0.98
    attack: T1036.005,T1027.009,T1620,T1622
    all:
      - id: metadata/signature/absent::unsigned-missing-signature-record
      - id: micro-behaviors/process/debug/detect::is-debugger-present-import
      - id: micro-behaviors/data/embedded/payload/header::x64-inline-e-lfanew-pe-walk
      - id: metadata/binary/resource/size::oversized-low-entropy-rsrc
      - id: metadata/binary/resource/label::updater-role-label-text
  - id: short-lowercase-version-identity
    desc: Short lowercase ProductName and OriginalFilename
    crit: suspicious
    conf: 0.93
    all:
      - id: short-lowercase-product-token
      - id: short-lowercase-wide-exe-name
      - id: metadata/binary/provenance/version-fields::pe-internalname-field
    unless:
      - id: metadata/signature/verified/platform/
  - id: anonymous-token-versioninfo-identity
    desc: VERSIONINFO identity is anonymous tokens
    crit: suspicious
    conf: 0.93
    attack: T1036.005,T1027
    needs: 4
    any:
      - id: opaque-single-token-copyright
      - id: opaque-lowercase-original-filename
      - id: opaque-lowercase-internal-name
      - id: opaque-lowercase-product-name
      - id: opaque-lowercase-trademarks
      - id: opaque-lowercase-comments
    unless:
      - id: metadata/signature/verified/platform/
      - id: metadata/signature/verified/developer/
    downgrade:
      scope: archive
      any:
        - id: metadata/package/testing/presence/corpus::binary-test-fixture-member
  - id: anonymous-identity-packed-admin-image
    desc: Packed admin-demanding PE with no real identity
    crit: hostile
    conf: 0.96
    attack: T1036.005,T1027.002,T1548
    all:
      - id: anonymous-token-versioninfo-identity
      - id: metadata/binary/section/entropy::upx1-high-entropy-section
      - id: metadata/build/manifest::pe-requires-admin
      - id: metadata/signature/absent::unsigned-missing-signature-record
    unless:
      - id: metadata/signature/verified/platform/
      - id: metadata/installer/product/
  - id: blank-identity-opaque-payload-carrier
    desc: Blank-identity PE is almost entirely payload
    crit: hostile
    conf: 0.96
    attack: T1036.005,T1027.009
    all:
      - id: metadata/binary/provenance/version-info::multiple-blank-version-fields
      - id: metadata/binary/layout/size::multi-megabyte-pe-negligible-code
      - id: metadata/binary/layout/ratio::overlay-over-90pct
      - id: metadata/signature/absent::unsigned-missing-signature-record
    unless:
      - id: metadata/signature/verified/platform/
