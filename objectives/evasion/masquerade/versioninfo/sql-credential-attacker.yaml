defaults:
  platforms: [windows]
  for: [pe]
composite_rules:
  - id: unsigned-microsoft-sql-credential-launcher
    desc: Unsigned SQL credential-list launcher claims Microsoft identity
    crit: suspicious
    conf: 0.98
    attack: T1036.005
    all:
      - id: objectives/lateral-movement/brute-force/database::managed-sql-credential-list-launch
      - id: metadata/vendor/identity::microsoft-corp-versioninfo
      - id: metadata/signature/absent::unsigned-missing-signature-record
