# Droppers that stage a payload as Scripts/SoftwareUpdates: a Scripts folder
# holds data scripts, not an extensionless executable, and SoftwareUpdates is
# a vendor-update name borrowed so the staged payload looks like an update
# component. (In bigmathix the pair is built under the Chrome profile dir.)
# Combined below with staging and hidden launch, the disguise is the point.
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
  attack: T1036.005
traits:
  - id: scripts-softwareupdates-path-pair
    desc: Scripts SoftwareUpdates staging path pair
    crit: suspicious
    conf: 0.93
    if:
      type: text
      regex: '"Scripts"[\s\S]{0,120}"SoftwareUpdates"'
composite_rules:
  - id: softwareupdates-masqueraded-hidden-launch
    desc: SoftwareUpdates-masqueraded payload launched hidden
    crit: hostile
    conf: 0.98
    near_bytes: 8192
    all:
      - id: scripts-softwareupdates-path-pair
      - id: micro-behaviors/fs/write/file/full::node-write-file-sync
      - id: micro-behaviors/process/create/hidden::detached-silent-hidden-spawn
    any:
      - id: micro-behaviors/fs/chmod/executable/mode::node-chmod-exec-mode-string-755
      - id: micro-behaviors/fs/chmod/modify::node-chmod-call
