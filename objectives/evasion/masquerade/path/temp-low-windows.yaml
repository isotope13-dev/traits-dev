# Executables staged under a Low-integrity Temp directory. %TEMP%\Low is the
# low-IL drop zone; ordinary installers stage in %TEMP% itself or a vendor
# subdirectory, while droppers favor Low because payloads launched from
# there inherit a context users and tools inspect less often. The name riding
# with the path is supplied by companion legs.
defaults:
  platforms: [windows]
  for: [pe, dll]
  attack: T1036.005

traits:
  - id: temp-low-windows-executable
    desc: Executable staged under Temp Low directory
    crit: suspicious
    conf: 0.9
    if:
      type: text
      regex: '(?i)\\Low\\[^\\\r\n"'']{1,80}\.exe'
    unless:
      - id: metadata/signed/platform/
      # A path string in a file with no executable code is inert text, not
      # staging: nothing in the file can write or launch that path.
      - id: metadata/binary/code/entropy::code-entropy-near-zero
