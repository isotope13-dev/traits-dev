# Droppers that stage under a fake Microsoft\WindowsHelper tree and
# launch helper.exe — looks like a Windows component path (T1036.005).
defaults:
  platforms: [windows]
  for: [pe]
  attack: T1036.005

traits:
  - id: microsoft-windowshelper-dir
    desc: Microsoft\WindowsHelper drop directory
    crit: suspicious
    conf: 0.95
    if:
      type: text
      substr: 'Microsoft\WindowsHelper'
      section: ".rdata"
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/installer/family/

  - id: helper-exe-format-path
    desc: Formatted helper.exe drop path
    crit: component
    conf: 0.9
    if:
      type: text
      substr: '%s\helper.exe'
      section: ".rdata"

composite_rules:
  - id: windowshelper-helper-exe-masquerade
    desc: Fake Microsoft\WindowsHelper helper.exe drop
    crit: hostile
    conf: 0.96
    all:
      - id: microsoft-windowshelper-dir
      - id: helper-exe-format-path
      - id: micro-behaviors/fs/shell-ops::shell-get-folder-path-a
      - id: micro-behaviors/process/create/exec::shell-execute
      - id: micro-behaviors/fs/file/write/direct::write-file
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/installer/family/
