defaults:
  platforms: [windows]
  for: [pe, dll]
  attack: T1036.005

traits:
  # Two or more random-looking lowercase file names in third-party install
  # folders. Real software ships descriptive names such as settings.cfg, so a
  # single hit stays a weak fragment; the composite requires the dispatch
  # obfuscation leg as well.
  #
  # Each root and extension is its own atom so that count_min counts repeats
  # of one form. Regex alternation cannot carry that count, so two files with
  # different extensions in one folder do not add up here.

  - id: random-named-programfiles-dat
    desc: Random-named .dat file in Program Files
    crit: notable
    conf: 0.85
    if:
      type: text
      regex: '(?i)\\Program Files( \\(x86\\))?\\[^\\\r\n"'']{2,60}\\[a-z]{8,16}\.dat'
    count_min: 2
  - id: random-named-programfiles-cfg
    desc: Random-named .cfg file in Program Files
    crit: notable
    conf: 0.85
    if:
      type: text
      regex: '(?i)\\Program Files( \\(x86\\))?\\[^\\\r\n"'']{2,60}\\[a-z]{8,16}\.cfg'
    count_min: 2
  - id: random-named-programfiles-pdf
    desc: Random-named .pdf file in Program Files
    crit: notable
    conf: 0.85
    if:
      type: text
      regex: '(?i)\\Program Files( \\(x86\\))?\\[^\\\r\n"'']{2,60}\\[a-z]{8,16}\.pdf'
    count_min: 2
  - id: random-named-programdata-dat
    desc: Random-named .dat file in ProgramData
    crit: notable
    conf: 0.85
    if:
      type: text
      regex: '(?i)\\ProgramData\\[^\\\r\n"'']{2,60}\\[a-z]{8,16}\.dat'
    count_min: 2
  - id: random-named-programdata-cfg
    desc: Random-named .cfg file in ProgramData
    crit: notable
    conf: 0.85
    if:
      type: text
      regex: '(?i)\\ProgramData\\[^\\\r\n"'']{2,60}\\[a-z]{8,16}\.cfg'
    count_min: 2
  - id: random-named-programdata-pdf
    desc: Random-named .pdf file in ProgramData
    crit: notable
    conf: 0.85
    if:
      type: text
      regex: '(?i)\\ProgramData\\[^\\\r\n"'']{2,60}\\[a-z]{8,16}\.pdf'
    count_min: 2

composite_rules:
  - id: random-named-app-data-drop
    desc: Random-named data files in an app install root
    crit: notable
    conf: 0.85
    any:
      - id: random-named-programfiles-dat
      - id: random-named-programfiles-cfg
      - id: random-named-programfiles-pdf
      - id: random-named-programdata-dat
      - id: random-named-programdata-cfg
      - id: random-named-programdata-pdf

  - id: app-directory-random-payload-drop
    desc: Random-named data files dropped into app folders with dispatch obfuscation
    crit: hostile
    conf: 0.9
    attack: T1036.005,T1027
    all:
      - id: random-named-app-data-drop
      - id: objectives/anti-static/obfuscation/control-flow/dispatch::repeated-cmov-relative-branch-tables-x64
