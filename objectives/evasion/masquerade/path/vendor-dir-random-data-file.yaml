# Files with random lowercase names (gynuinsaegy.txt, mqeondaully.dat) under
# short-named subdirectories of Program Files or ProgramData that look like
# vendors or Windows features, such as Program Files\AMD or ProgramData\WSL. Programs name their own data after
# their own product; a random name under someone else's directory is staging
# that hopes to be mistaken for that vendor's files.
defaults:
  platforms: [windows]
  for: [pe]
  attack: T1036.005
traits:
  - id: random-name-data-file-under-program-dir
    desc: Random-named .txt/.dat under Program dir
    crit: suspicious
    conf: 0.8
    if:
      type: text
      regex: '\\Program(Data| Files)\\[A-Za-z]{2,8}\\[a-z]{8,16}\.(txt|dat)'
