defaults:
  platforms:
  - windows
  for:
  - batch
  attack: T1036.005
traits:
- id: user-profile-system-name-launch
  desc: Starts system-named exe from a user profile
  crit: suspicious
  conf: 0.88
  if:
    type: tree-sitter
    language: batch
    query: "(cmd (command_name) @tool (argument_list) @args\n  (#match? @tool \"(?i)^start$\")\n  (#match? @args \"(?i)^\\\\s*\\\"\\\"\\\\s+\\\"[a-z]:\\\\\\\\Users\\\\\\\\[^\\\"\\\\r\\\\n]{1,70}\\\\\\\\(services|system|wmiprvse)\\\\.exe\\\"($|\\\\s)\"))"
- id: tasks-system-name-launch
  desc: Starts system-named exe from Windows Tasks
  crit: suspicious
  conf: 0.88
  if:
    type: tree-sitter
    language: batch
    query: "(cmd (command_name) @tool (argument_list) @args\n  (#match? @tool \"(?i)^start$\")\n  (#match? @args \"(?i)^\\\\s*\\\"\\\"\\\\s+\\\"([a-z]:\\\\\\\\Windows|%SystemRoot%|%windir%)\\\\\\\\Tasks\\\\\\\\(services|system|wmiprvse)\\\\.exe\\\"($|\\\\s)\"))"
- id: batch-copy-to-windows-system-path
  desc: Batch copies executable into Windows directory
  crit: suspicious
  conf: 0.92
  if:
    type: text
    regex: '(?i)\b(copy|xcopy)\b[^\r\n]{0,50}\s+([a-z]:\\windows|%windir%)\\[^\s;&|]{1,30}\.exe\b'
- id: batch-masquerade-msie-executable
  desc: Targets or creates MSIE masqueraded executable
  crit: suspicious
  conf: 0.92
  if:
    type: text
    # msiexec.exe is the Windows Installer, not an Internet Explorer mask.
    regex: '(?i)\bmsie([a-wyz0-9]|x[a-df-z0-9])\w{0,9}\.exe\b'

composite_rules:
- id: batch-stages-masqueraded-system-binary
  desc: Batch copies executable into Windows folder with masqueraded name
  crit: hostile
  conf: 0.96
  all:
  - id: micro-behaviors/fs/file/copy/source-destination::windows-copy-command
  - id: batch-copy-to-windows-system-path
  any:
  - id: batch-masquerade-msie-executable
