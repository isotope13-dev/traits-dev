defaults:
  platforms:
  - windows
  for:
  - batch
  attack: T1036.005
traits:
- id: user-profile-system-name-launch
  desc: Starts system-named exe from a user profile
  crit: suspicious
  conf: 0.88
  if:
    type: tree-sitter
    language: batch
    query: "(cmd (command_name) @tool (argument_list) @args\n  (#match? @tool \"(?i)^start$\")\n  (#match? @args \"(?i)^\\\\s*\\\"\\\"\\\\s+\\\"[a-z]:\\\\\\\\Users\\\\\\\\[^\\\"\\\\r\\\\n]{1,70}\\\\\\\\(services|system|wmiprvse)\\\\.exe\\\"($|\\\\s)\"))"
- id: tasks-system-name-launch
  desc: Starts system-named exe from Windows Tasks
  crit: suspicious
  conf: 0.88
  if:
    type: tree-sitter
    language: batch
    query: "(cmd (command_name) @tool (argument_list) @args\n  (#match? @tool \"(?i)^start$\")\n  (#match? @args \"(?i)^\\\\s*\\\"\\\"\\\\s+\\\"([a-z]:\\\\\\\\Windows|%SystemRoot%|%windir%)\\\\\\\\Tasks\\\\\\\\(services|system|wmiprvse)\\\\.exe\\\"($|\\\\s)\"))"
