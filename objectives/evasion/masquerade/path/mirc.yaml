# Droppers that copy the svchost misspell into a system directory and run it
# (directly, as a .pif, or on a timer) plant a binary that blends into the
# service-host name: script twin of the binary-scoped svchost masquerades.
defaults:
  platforms: [windows]
  for: [mirc]
  attack: T1036
traits:
  # The svchost misspell inside a script, twin of the binary-scoped
  # svchost-misspell-svhost: dropper scripts carry the same typo.
  - id: mirc-svhost-typo-name
    desc: mIRC names the svhost typo
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)\\svhost\.exe\b'
composite_rules:
  - id: mirc-fake-system-svhost-drop
    desc: mIRC drops typo svhost into system
    crit: hostile
    conf: 0.96
    all:
      - id: mirc-svhost-typo-name
      - id: objectives/command-and-control/backdoor/install::mirc-copy-system32-drop
    any:
      - id: objectives/command-and-control/backdoor/install::mirc-timer-delayed-run
      - id: objectives/command-and-control/backdoor/install::mirc-run-pif-file
      - id: objectives/command-and-control/channel/irc/client::mirc-launches-exe
