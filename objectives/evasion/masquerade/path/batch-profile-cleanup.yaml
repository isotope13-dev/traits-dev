defaults:
  platforms:
    - "windows"
  for:
    - "batch"
composite_rules:
  - 
    id: "profile-system-name-delayed-cleanup"
    desc: "Delayed profile system-name launch deletes its helper"
    crit: "hostile"
    conf: 0.96
    all:
      - 
        id: "objectives/evasion/masquerade/path::user-profile-system-name-launch"
      - 
        id: "micro-behaviors/time/query::w32tm-local-stripchart-command"
      - 
        id: "micro-behaviors/fs/delete/file/command::batch-deletes-temp-bat"
