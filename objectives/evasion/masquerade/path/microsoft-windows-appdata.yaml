# Executables staged under %APPDATA%\Microsoft\Windows\ (or LocalAppData).
# Windows keeps user shell settings and shortcuts there, not standalone
# third-party binaries; dropping executables directly into Microsoft\Windows
# masquerades as an operating system component (T1036.005).
defaults:
  platforms: [windows]
  for: [python]
  attack: T1036.005
  mbc: F0012

composite_rules:
  - id: microsoft-windows-appdata-masquerade-launch
    desc: Launches executable staged under Microsoft Windows AppData
    crit: suspicious
    conf: 0.97
    attack: T1036.005,T1059
    near_lines: 30
    all:
      - id: micro-behaviors/fs/path/construct::python-pathlib-microsoft-windows-path
      - id: micro-behaviors/fs/path/construct::python-pathlib-environ-appdata
      - id: micro-behaviors/fs/write/file/full::python-pathlib-write-bytes
      - id: micro-behaviors/process/create/subprocess::popen-ast
