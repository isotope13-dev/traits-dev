defaults:
  platforms:
  - windows
  for:
  - javascript
  - typescript
  attack: T1036.005
composite_rules:
- id: windows-system-directory-fetch-write-exec
  desc: Windows System path with fetch/write/process context
  crit: suspicious
  conf: 0.99
  attack: T1105,T1059.007
  near_bytes: 1024
  all:
  - id: micro-behaviors/process/create/subprocess::fetch-write-exec
  - id: micro-behaviors/fs/path/system::javascript-windows-system32
  - id: micro-behaviors/communications/http/download/url::executable-url-reference-a
