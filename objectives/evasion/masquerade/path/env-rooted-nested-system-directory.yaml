defaults:
  platforms: [windows]
  for: [pe, dll]
  attack: T1036.005
traits:
  # A system root variable followed by another system directory name is not
  # a real Windows layout. Staged drop targets use this nesting to look like
  # system files. Each literal pair is its own atom so that count_min counts
  # repeats of one nested form. Regex alternation cannot carry that count.
  - id: nest-programfiles-program-files
    desc: '%ProgramFiles% nests Program Files directory'
    crit: suspicious
    count_min: 2
    if:
      type: text
      substr: '%ProgramFiles%\Program Files\'
  - id: nest-programfiles-programdata
    desc: '%ProgramFiles% nests ProgramData directory'
    crit: suspicious
    count_min: 2
    if:
      type: text
      substr: '%ProgramFiles%\ProgramData\'
  - id: nest-programfiles-users
    desc: '%ProgramFiles% nests Users directory'
    crit: suspicious
    count_min: 2
    if:
      type: text
      substr: '%ProgramFiles%\Users\'
  - id: nest-programfiles-windows
    desc: '%ProgramFiles% nests Windows directory'
    crit: suspicious
    count_min: 2
    if:
      type: text
      substr: '%ProgramFiles%\Windows\'
  - id: nest-programfiles-system32
    desc: '%ProgramFiles% nests System32 directory'
    crit: suspicious
    count_min: 2
    if:
      type: text
      substr: '%ProgramFiles%\System32\'
  - id: nest-systemroot-program-files
    desc: '%SystemRoot% nests Program Files directory'
    crit: suspicious
    count_min: 2
    if:
      type: text
      substr: '%SystemRoot%\Program Files\'
  - id: nest-systemroot-programdata
    desc: '%SystemRoot% nests ProgramData directory'
    crit: suspicious
    count_min: 2
    if:
      type: text
      substr: '%SystemRoot%\ProgramData\'
  - id: nest-systemroot-users
    desc: '%SystemRoot% nests Users directory'
    crit: suspicious
    count_min: 2
    if:
      type: text
      substr: '%SystemRoot%\Users\'
  - id: nest-systemroot-windows
    desc: '%SystemRoot% nests Windows directory'
    crit: suspicious
    count_min: 2
    if:
      type: text
      substr: '%SystemRoot%\Windows\'
  # %SystemRoot% already expands to the Windows directory, so
  # %SystemRoot%\System32\ is the normal layout and is not a nesting.
  - id: nest-temp-program-files
    desc: '%TEMP% nests Program Files directory'
    crit: suspicious
    count_min: 2
    if:
      type: text
      substr: '%TEMP%\Program Files\'
  - id: nest-temp-programdata
    desc: '%TEMP% nests ProgramData directory'
    crit: suspicious
    count_min: 2
    if:
      type: text
      substr: '%TEMP%\ProgramData\'
  - id: nest-temp-users
    desc: '%TEMP% nests Users directory'
    crit: suspicious
    count_min: 2
    if:
      type: text
      substr: '%TEMP%\Users\'
  - id: nest-temp-windows
    desc: '%TEMP% nests Windows directory'
    crit: suspicious
    count_min: 2
    if:
      type: text
      substr: '%TEMP%\Windows\'
  - id: nest-temp-system32
    desc: '%TEMP% nests System32 directory'
    crit: suspicious
    count_min: 2
    if:
      type: text
      substr: '%TEMP%\System32\'

composite_rules:
  - id: env-rooted-nested-system-directory
    desc: Env root nests a Windows system directory
    crit: suspicious
    conf: 0.9
    any:
      - id: nest-programfiles-program-files
      - id: nest-programfiles-programdata
      - id: nest-programfiles-users
      - id: nest-programfiles-windows
      - id: nest-programfiles-system32
      - id: nest-systemroot-program-files
      - id: nest-systemroot-programdata
      - id: nest-systemroot-users
      - id: nest-systemroot-windows
      - id: nest-temp-program-files
      - id: nest-temp-programdata
      - id: nest-temp-users
      - id: nest-temp-windows
      - id: nest-temp-system32
