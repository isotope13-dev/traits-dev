defaults:
  platforms: [windows]
  for: [pe, dll]
  attack: T1036.005

traits:
  - id: microsoft-windows-programdata-executable
    desc: Windows-component executable under ProgramData
    crit: suspicious
    conf: 0.94
    if:
      type: text
      regex: '(?i)\\ProgramData\\Microsoft\\Windows\\[^\\\r\n"'']{2,64}\\[^\\\r\n"'']{2,80}\.exe'
    unless:
      - id: metadata/signed/platform/
      - type: text
        regex: '(?i)\\ProgramData\\Microsoft\\Windows\\WinSAT\\[^\\\r\n"'']{2,80}\.exe'

  # A hardcoded ProgramData subfolder named for an audio/graphics vendor.
  # Genuine vendor tools use such folders too, so this stays notable; the
  # composite below needs unsigned download-and-rundll32 task evidence.
  - id: hardware-vendor-programdata-subdir
    desc: Hardware-vendor subfolder under ProgramData
    crit: notable
    conf: 0.85
    if:
      type: text
      regex: '(?i)\\ProgramData\\(Realtek|Dolby|Conexant|Synaptics|NVIDIA|Intel|AMD)\\\w+'

composite_rules:
  - id: vendor-programdata-rundll32-scheduled-task
    desc: Task runs rundll32 from fake vendor folder
    crit: hostile
    conf: 0.95
    attack: T1036.005,T1053.005,T1218.011
    all:
      - id: hardware-vendor-programdata-subdir
      - id: micro-behaviors/os/autorun/scheduled::task-scheduler-com-class-guid
      - id: micro-behaviors/process/create/launch::rundll32-exe-literal
      - id: micro-behaviors/communications/http/client/urlmon::url-download-to-file-import
    unless:
      - id: metadata/signed/platform/
  - id: programdata-masquerade-watchdog
    desc: Masqueraded ProgramData watchdog launcher
    crit: hostile
    conf: 0.98
    all:
      - id: microsoft-windows-programdata-executable
      - id: micro-behaviors/process/enumerate/snapshot::toolhelp-process-enumeration
      - id: micro-behaviors/process/create/spawn::create-process-w
  - id: recurring-programdata-process-launcher
    desc: Recurring process-name scan that relaunches a masqueraded ProgramData executable
    crit: hostile
    conf: 0.99
    attack: T1057,T1036.005,T1106
    all:
      - id: microsoft-windows-programdata-executable
      - id: micro-behaviors/process/enumerate/snapshot::create-toolhelp32-snapshot
      - id: micro-behaviors/process/enumerate/snapshot::process32-first
      - id: micro-behaviors/process/enumerate/snapshot::process32-next
      - id: micro-behaviors/process/create/spawn::create-process-w
      - id: micro-behaviors/time/sleep/interval::sleep-dup
