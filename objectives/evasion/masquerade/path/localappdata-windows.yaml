defaults:
  platforms: [windows]
  for: [pe, dll]
  attack: T1036.005
composite_rules:
  - id: concealed-windows-localappdata-process-launch
    desc: Concealed Microsoft Windows AppData executable launch
    crit: hostile
    conf: 0.98
    attack: T1036.005,T1106
    all:
      - id: micro-behaviors/os/env/read::xor16-localappdata-name
      - id: micro-behaviors/fs/path/os/identity::xor16-microsoft-windows-relative-path
      - id: micro-behaviors/fs/path/application/interpreter::xor16-python-executable-name
      - id: micro-behaviors/process/create/spawn::create-process-w
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/installer/family/
