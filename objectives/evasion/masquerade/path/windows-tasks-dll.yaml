# DLL implants dropped into C:\Windows\Tasks (SystemBC-style Play C2 staging).
defaults:
  platforms: [windows]
  for: [batch, powershell, python, c, text]
  attack: T1090.001,T1036.005
traits:
  - id: windows-tasks-dir
    desc: Windows Tasks directory path
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)Windows[\\/]+Tasks[\\/]'
  - id: tasks-svhost-dll
    desc: svhost.dll Tasks implant name
    crit: notable
    conf: 0.93
    if:
      type: text
      regex: '(?i)svhost(_V1)?\.dll\b'
  - id: tasks-4-dll
    desc: 4.dll Tasks implant name
    crit: notable
    conf: 0.92
    if:
      type: text
      regex: '(?i)Windows[\\/]+Tasks[\\/]+4\.dll\b'

composite_rules:
  - id: windows-tasks-systembc-dll
    desc: SystemBC-style DLL in Windows Tasks
    crit: hostile
    conf: 0.97
    all:
      - id: windows-tasks-dir
    any:
      - id: tasks-svhost-dll
      - id: tasks-4-dll
