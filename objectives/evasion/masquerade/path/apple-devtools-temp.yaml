# Developer-tools-style hidden path; it does not itself prove a payload.
defaults:
  platforms:
  - macos
  for:
  - scripts
  - source
  - macho
traits:
- id: tmp-apple-devtools-style-path
  desc: Apple developer-tools-style path in /tmp
  crit: suspicious
  conf: 0.96
  for:
  - shell
  - scripts
  - source
  if:
    type: text
    regex: (?i)/tmp/\.com\.apple\.dt\.[0-9]{3,12}\b
