# Node handed a file that lives in a hidden (dot-prefixed) directory. Dot
# directories are omitted from default listings, so a payload staged there
# hides from reviewers browsing the tree. Like the asset-directory sibling,
# script suffixes are excluded -- helper scripts do live in dot trees -- and
# matching is per-invocation at command position. The folder-open composite
# below needs no concealment leg beyond this one: an autorun task pointing an
# interpreter at a disguised file in a hidden directory has no legitimate
# task use.
defaults:
  platforms: [windows, linux, macos]
  attack: T1036.005

traits:
  - id: node-runs-hidden-directory-file
    desc: Node runs file from hidden directory
    crit: suspicious
    conf: 0.92
    for: [json, package.json, shell]
    if:
      type: text
      regex: '[\s\";&|(]node\S{0,4}\s+\S{0,60}/\.[\w-]{1,30}/\S{1,80}[^\w./]'
    not:
      - regex: '(?i)\.(m?js|cjs|[mc]?ts|[jt]sx|json|node)\W?$'
      - regex: '(?i)\.(woff2?|[ot]tf|eot)\W?$'
      # Claude Code hook commands reference $CLAUDE_PROJECT_DIR/.claude/hooks.
      - regex: '(?i)\$CLAUDE_PROJECT_DIR[\\/]\.claude[\\/]hooks'
      - regex: '(?i)\.claude[\\/]hooks[\\/]'

composite_rules:
  - id: folder-open-runs-hidden-disguised-node
    desc: Folder-open task runs hidden disguised Node payload
    crit: hostile
    conf: 0.97
    attack: "T1204.002,T1036.005"
    all:
      - id: metadata/permission/activation::vscode-task-folder-open-activation
      - id: node-runs-hidden-directory-file
