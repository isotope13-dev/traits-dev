# Node executes a file with a data suffix from a dot-prefixed directory.
# Extensionless paths can resolve to ordinary .js files or directory modules
# (for example, .scripts/publish); a hidden path alone proves no disguise.
defaults:
  platforms: [windows, linux, macos]
  attack: T1036.005

traits:
  - id: node-runs-hidden-data-file
    desc: Node runs hidden data-suffixed file
    crit: suspicious
    conf: 0.92
    for: [json, package.json, shell]
    if:
      type: text
      regex: '\bnode\s+\S{0,60}/\.[\w-]{1,30}/\S{1,80}\.(png|jpg|dat|bin|db|txt|css)([\s";|)]|$)'
    not:
      # Claude Code hook commands reference $CLAUDE_PROJECT_DIR/.claude/hooks.
      - regex: '(?i)\$CLAUDE_PROJECT_DIR[\\/]\.claude[\\/]hooks'
      - regex: '(?i)\.claude[\\/]hooks[\\/]'
      # npm/yarn/pnpm executables linked into node_modules/.bin
      - regex: '(?i)node_modules[\\/]\.bin[\\/]'

composite_rules:
  - id: folder-open-runs-hidden-disguised-node
    desc: Folder-open task runs hidden disguised Node payload
    crit: hostile
    conf: 0.97
    attack: "T1204.002,T1036.005"
    all:
      - id: metadata/permission/activation::vscode-task-folder-open-activation
      - id: node-runs-hidden-data-file
