defaults:
  platforms: [windows]
  for: [batch]
  attack: T1036.005

composite_rules:
  - id: batch-loop-runs-root-svchost-copy
    desc: Batch loops launching svchost.exe outside System32
    crit: hostile
    conf: 0.9
    size_max: 4096
    near_lines: 12
    all:
      - id: micro-behaviors/fs/path/application/executable::svchost-windows-root-path
      - id: micro-behaviors/data/control-flow/loop::batch-goto-loop
