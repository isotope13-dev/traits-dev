defaults:
  platforms: [windows]
  for: [text, xml, powershell, pe]
  crit: hostile
  conf: 0.99
  attack: T1036.005,T1105,T1059.001

composite_rules:
  - id: encoded-whitespace-system-fetch-launch
    desc: Encoded spoofed system path with download and launch
    near_bytes: 4096
    all:
      - id: micro-behaviors/fs/path/system/runtime::base64-whitespace-system-path
      - id: micro-behaviors/communications/http/download/encoded::decoded-powershell-download-command
      - id: micro-behaviors/process/create/cmdlet::base64-start-process-command
