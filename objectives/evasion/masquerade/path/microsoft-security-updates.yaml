# Droppers that stage under AppData\Roaming\Microsoft\SecurityUpdates.
# Windows does not keep updates or Java security tools in that roaming folder;
# the name is borrowed so Task Manager and Explorer look like an OS component.
defaults:
  platforms: [windows]
  for: [vbs, batch, powershell, java, csharp]
  attack: T1036.005
  mbc: F0012

traits:
  - id: microsoft-securityupdates-roaming-path
    desc: Microsoft\SecurityUpdates roaming staging path
    crit: suspicious
    conf: 0.94
    if:
      type: text
      regex: '(?i)Microsoft\\SecurityUpdates\\'

composite_rules:
  - id: logon-task-securityupdates-payload
    desc: Logon scheduled task launches SecurityUpdates payload
    crit: hostile
    conf: 0.97
    attack: T1053.005,T1036.005
    all:
      - id: microsoft-securityupdates-roaming-path
      - id: objectives/persistence/login/scheduled-task/cli::schtasks-onlogon-trigger
    any:
      - id: micro-behaviors/os/autorun/scheduled::schtasks-create-cmd
      - id: objectives/persistence/login/scheduled-task/cli::windows-schtasks-create
    scope: file
  - id: hidden-javaw-securityupdates-launch
    desc: Hidden javaw classpath launch from SecurityUpdates
    crit: hostile
    conf: 0.97
    attack: T1059.005,T1036.005,T1564.003
    all:
      - id: microsoft-securityupdates-roaming-path
      - id: micro-behaviors/process/create/launch::javaw-classpath-command-line
      - id: micro-behaviors/process/create/shell/wsh::wscript-shell-hidden-run
    scope: file
