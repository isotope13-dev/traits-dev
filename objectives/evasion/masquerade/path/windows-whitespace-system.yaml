# A trailing space before a Windows system-directory separator creates a
# different directory while remaining visually confusable with the real path.
# Pairing that path with a download-and-execute chain captures payload staging
# that borrows the appearance of System32 or SysWOW64 without depending on the
# downloader language, payload name, or network service.
defaults:
  platforms: [windows]
  for: [binaries, scripts, source]
  attack: T1036.005,T1105,T1059

composite_rules:
  - id: whitespace-system-path-fetch-and-launch
    desc: Spoofed system path with fetch and launch
    crit: hostile
    conf: 0.99
    near_bytes: 4096
    all:
    - id: micro-behaviors/fs/path/system::whitespace-spoofed-windows-system-path
    - id: micro-behaviors/communications/http/client/response-body::http-response-acquisition
    - id: micro-behaviors/process/create/exec::child-process-execution
