defaults:
  platforms: [windows]
  for: [pe, dll]
  attack: T1036.005
  mbc: F0012

composite_rules:
  - id: self-copy-and-launch-from-system-directory
    desc: Self-reads and launches in a Windows System directory
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/process/info/current::get-module-filename
      - id: micro-behaviors/fs/file/open::open
      - id: micro-behaviors/fs/read/file/handle::c-fread
      - id: micro-behaviors/fs/file/binary::file-position-api
      - id: micro-behaviors/fs/file/binary::binary-read-write-ops
      - id: micro-behaviors/fs/path/system::windows-system-directory
      - id: micro-behaviors/process/create/spawn::create-process-w
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/installer/family/
      - id: metadata/binary/framework/

