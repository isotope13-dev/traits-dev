# WpcMon is a Windows system component, normally installed in System32.
# Match the displaced component's path, not the campaign's chosen directory,
# registry value name, camera application, remote address, or launcher name.
defaults:
  platforms: [windows]
  for: [scripts, source]

traits:
  - id: appdata-parental-monitor-path
    desc: Parental monitor path under AppData
    crit: suspicious
    conf: 0.95
    attack: T1036.005
    if:
      type: literal
      regex: '(?i)appdata%?[\\/][^\r\n]{0,160}[\\/]wpcmon\.exe$'
      exclude_docstrings: true
