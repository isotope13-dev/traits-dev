# Python that moves a downloaded file into %LOCALAPPDATA%\Microsoft<Word>
# ("MicrosoftEngine") and launches it hidden. The fused folder name borrows
# Microsoft's brand for a directory Windows never creates.
defaults:
  platforms: [windows]
  for: [python]
  crit: hostile
  attack: T1036.005,T1105

composite_rules:
  - id: python-hidden-launch-from-fake-microsoft-appdata-folder
    desc: Downloaded file runs hidden from a fake Microsoft folder
    conf: 0.93
    near_lines: 40
    all:
      - id: micro-behaviors/fs/path/construct::python-pathlib-microsoft-fused-folder
      - id: micro-behaviors/os/env/path::localappdata
      - id: micro-behaviors/process/deploy/file-exec/spawn::python-response-move-win32-launch
      - id: micro-behaviors/process/create/hidden::python-win32-hidden-startup-launch
