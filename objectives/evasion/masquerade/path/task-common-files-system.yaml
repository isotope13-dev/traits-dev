# Common Files\System is a Windows-owned tree of shared data-access DLLs
# (ADO, MSADC, OLE DB). Persistence droppers plant their executable in a
# subfolder there so the scheduled path reads as a system component.
defaults:
  platforms: [windows]
  for: [xml]
  attack: T1036.005,T1053.005

composite_rules:
  - id: task-xml-common-files-system-exe
    desc: Scheduled exe planted in Common Files System
    crit: hostile
    conf: 0.9
    all:
      - id: micro-behaviors/os/autorun/task-xml-scheduled::scheduled-task-xml-root
      - id: micro-behaviors/os/autorun/task-xml-scheduled::scheduled-task-common-files-system-exe-xml
