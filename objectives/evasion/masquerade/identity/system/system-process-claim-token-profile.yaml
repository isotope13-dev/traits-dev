# A PE that names itself a Windows system process while carrying no signature
# and a token-manipulation API profile. The name claim alone is neutral; the
# unsigned binary and the LSASS token-impersonation profile supply the attack
# context that makes it masquerade evidence.
defaults:
  platforms: [windows]
  for: [pe]
  attack: T1036.005,T1134.001

composite_rules:
  - id: unsigned-system-process-claim-token-profile
    desc: Unsigned PE claims a system process and impersonates LSASS tokens
    crit: hostile
    conf: 0.93
    size_min: 1048576
    all:
      - id: metadata/binary/provenance/version-info::pe-version-original-filename-system-process
      - id: metadata/signature/absent::unsigned-pe-executable
      - id: objectives/privilege-escalation/token-manipulation::lsass-token-impersonation-api-profile
