# A library that reuses the name of a built-in Windows library or known
# folder ("Documents", "My Documents", "Downloads") while its only content
# is a WebDAV share on another server: the window the victim opens looks like
# their own Documents folder but lists the attacker's files.
defaults:
  platforms: [windows]
  for: [xml]
  attack: T1036,T1204.002

composite_rules:
  - id: library-known-folder-remote-webdav
    desc: Library posing as Documents opens remote share
    crit: hostile
    conf: 0.93
    all:
      - id: metadata/file/format/windows-shell::library-description-root
      - id: metadata/file/format/windows-shell::library-known-folder-name
      - id: micro-behaviors/communications/http/webdav::shell-location-webdav-unc-url
