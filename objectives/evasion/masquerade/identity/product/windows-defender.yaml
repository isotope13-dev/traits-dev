defaults:
  platforms:
  - windows
  for:
  - pe
  attack: T1036.005
  mbc: F0004
composite_rules:
- id: defender-name-copy-system-profile
  desc: Defender name with copy and system clues
  crit: notable
  conf: 0.95
  all:
  - id: micro-behaviors/fs/path/application/executable::defender-exe-name-reference
  - id: micro-behaviors/fs/file/copy::copyfile-w
  - id: micro-behaviors/fs/path/check::get-module-filename
  any:
  - id: micro-behaviors/os/sysinfo/directories::get-system-directory
  - id: micro-behaviors/os/security/product::windows-defender-product-name
  - id: micro-behaviors/os/registry/keys::currentversion-run-key-path
  unless:
  - id: metadata/signed/platform/
  - id: well-known/app/security/defender/
- id: defender-name-http-write-launch-profile
  desc: Defender name with HTTP/write/launch clues
  crit: notable
  conf: 0.97
  for:
  - javascript
  - typescript
  near_bytes: 8192
  all:
  - id: micro-behaviors/fs/path/application/executable::defender-like-exe-name
  - id: micro-behaviors/communications/http/download/handler::node-http-stream-to-file
  any:
  - id: micro-behaviors/process/create/spawn::detached-ignored-unref-spawn
  unless:
  - id: metadata/package/testing/harness/runtime/
  - id: metadata/package/testing/presence/fixture::test-filename-pattern

