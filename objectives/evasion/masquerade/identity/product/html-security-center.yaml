defaults:
  platforms: [windows]
  for: [html]
traits:
  - id: windows-security-center-page-title
    desc: HTML title claims Windows Security Center
    crit: suspicious
    conf: 0.95
    if:
      type: text
      regex: '(?is)<title>\s*Windows Security Center\s*</title>'
      exclude_html_comments: true
  - id: windows-security-center-no-antivirus-claim
    desc: Claims Windows found no antivirus software
    crit: suspicious
    conf: 0.95
    if:
      type: text
      regex: '(?i)Windows did not find antivirus software on this computer'
      exclude_html_comments: true
