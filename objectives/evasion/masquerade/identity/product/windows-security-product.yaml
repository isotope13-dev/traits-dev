defaults:
  platforms:
    - windows
  for:
    - pe
    - dll
  attack: T1036.005
  crit: hostile
composite_rules:
  - id: security-identity-opaque-anti-analysis-loader
    desc: Security-product identity masks opaque anti-analysis loader
    conf: 0.99
    attack: T1036.005,T1027,T1622
    all:
      - id: metadata/binary/resource/identity::pe-security-product-name
      - id: metadata/binary/section/entropy::high-entropy-rdata-section
      - id: micro-behaviors/mem/protect/modify/unspecified::virtual-protect-import
      - id: micro-behaviors/process/debug/detect::is-debugger-present-import
      - id: metadata/binary/layout/tls::pe-multiple-tls-callbacks
    unless:
      - id: metadata/signature/verified/platform/
      - id: metadata/installer/product/
  - id: firewall-identity-autorun-worm
    desc: Self-copy worm uses Microsoft Firewall label
    conf: 0.98
    attack: T1036.005,T1547.001
    all:
      - id: metadata/vendor/string::microsoft-firewall-label
      - id: objectives/lateral-movement/usb-worm/autorun::vb6-autorun-runkey-worm
      - id: metadata/signature/absent::unsigned-missing-signature-record
    unless:
      - id: metadata/signature/verified/platform/
      - id: metadata/installer/product/
  - id: unsigned-security-product-resource-masquerade
    desc: Unsigned security identity with packed resource and network/registry behavior
    conf: 0.98
    attack: T1036.005,T1027,T1071
    all:
      - id: metadata/binary/resource/identity::pe-security-product-name
      - id: metadata/signature/absent::unsigned-missing-signature-record
      - id: metadata/binary/resource/entropy::high-entropy-resource-small-pe
      - id: metadata/binary/section/layout::multiple-nonstandard-section-names
    any:
      - id: micro-behaviors/communications/socket/connect/attempt::winsock-client-symbol-lifecycle
      - id: micro-behaviors/os/registry/hive/restore::reg-restore-key
    needs: 1
    unless:
      - id: metadata/signature/verified/platform/
      - id: metadata/installer/product/
