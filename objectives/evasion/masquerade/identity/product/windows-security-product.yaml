defaults:
  platforms:
  - windows
  for:
  - pe
  - dll
  attack: T1036.005
  crit: hostile
composite_rules:
- id: security-identity-opaque-anti-analysis-loader
  desc: Security-product identity masks opaque anti-analysis loader
  conf: 0.99
  attack: T1036.005,T1027,T1622
  all:
  - id: metadata/binary/resource/identity::pe-security-product-name
  - id: metadata/binary/section/entropy::high-entropy-rdata-section
  - id: micro-behaviors/mem/protect/modify::virtual-protect
  - id: micro-behaviors/process/debug/detect::is-debugger-present-import
  - id: metadata/binary/layout/tls::pe-multiple-tls-callbacks
  unless:
  - id: metadata/signed/platform/
  - id: metadata/binary/installer/family/
  - id: well-known/app
- id: contradictory-security-product-packed-bundle
  desc: Contradictory security-product branding on packed PE bundle
  conf: 0.98
  all:
  - id: metadata/binary/layout/ratio::overlay-over-90pct
  # A security-product name and packing alone do not establish fabrication.
  # Require the independently detected contradictory publisher/product claims.
  - id: objectives/evasion/masquerade/version-resource/contradiction::packed-firewall-company-contradiction
  unless:
  - id: metadata/signed/platform/
  - id: metadata/binary/installer/family/
- id: unsigned-packed-firewall-run-masquerade
  desc: Unsigned packed Firewall identity with Run persistence
  conf: 0.98
  attack: T1036.005,T1027,T1547.001
  all:
  - id: metadata/vendor/string::microsoft-firewall-label
  - id: metadata/build/protector::aspack-name-reference
  - id: metadata/signed/trust-level::unsigned-missing-signature-record
  - id: micro-behaviors/os/registry/keys/autostart::currentversion-run
  unless:
  - id: metadata/signed/platform/
  - id: metadata/binary/installer/family/
- id: unsigned-security-product-resource-masquerade
  desc: Unsigned security identity with packed resource and network/registry behavior
  conf: 0.98
  attack: T1036.005,T1027,T1071
  all:
  - id: metadata/binary/resource/identity::pe-security-product-name
  - id: metadata/signed/trust-level::unsigned-missing-signature-record
  - id: metadata/binary/resource/entropy::high-entropy-resource-small-pe
  - id: metadata/binary/section/label::multiple-nonstandard-section-names
  any:
  - id: micro-behaviors/communications/socket/connect::winsock-client-symbol-lifecycle
  - id: micro-behaviors/os/registry/manipulate::reg-restore-key
  needs: 1
  unless:
  - id: metadata/signed/platform/
  - id: metadata/binary/installer/family/
  - id: well-known/app
  - id: well-known/tool
