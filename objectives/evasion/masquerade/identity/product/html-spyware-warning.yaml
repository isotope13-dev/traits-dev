defaults:
  platforms: [windows]
  for: [html]
traits:
  - id: static-spyware-system-error-verdict
    desc: Static spyware system-error verdict
    crit: suspicious
    conf: 0.95
    if:
      type: text
      regex: '(?i)Detected SPYware! System(&nbsp;|\s)+error(&nbsp;|\s)+#\d+'
      exclude_html_comments: true
composite_rules:
  - id: browser-error-install-consent
    desc: Browser error page requests install consent
    crit: hostile
    conf: 0.96
    attack: T1036
    all:
      - id: metadata/document/html::browser-error-title
      - id: objectives/execution/lure/dialog::install-update-yes-prompt
  - id: static-spyware-remediation-hoax
    desc: Static spyware verdict with remediation link
    crit: suspicious
    conf: 0.98
    all:
      - id: static-spyware-system-error-verdict
      - id: micro-behaviors/ui/dialog/prompt::spyware-protection-link
