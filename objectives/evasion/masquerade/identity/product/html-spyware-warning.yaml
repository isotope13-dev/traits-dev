defaults:
  platforms: [windows]
  for: [html]
traits:
  - id: static-spyware-system-error-verdict
    desc: Static spyware system-error verdict
    crit: suspicious
    conf: 0.95
    if:
      type: text
      regex: '(?i)Detected SPYware! System(&nbsp;|\s)+error(&nbsp;|\s)+#\d+'
      exclude_html_comments: true
  # A page that declares a spyware infection and a page that blames fatal
  # errors on spyware are the static scare copy. Security vendors use the
  # words too, so each atom stays suspicious until a scan link joins it.
  - id: spyware-threat-detected-verdict
    desc: Static spyware threat verdict
    crit: suspicious
    conf: 0.93
    if:
      type: text
      regex: '(?i)spyware threat has been detected'
      exclude_html_comments: true
  - id: spyware-fatal-error-claim
    desc: Fatal errors blamed on spyware
    crit: suspicious
    conf: 0.93
    if:
      type: text
      regex: '(?i)fatal errors due to spyware'
      exclude_html_comments: true
  - id: scan-your-pc-http-anchor
    desc: HTTP anchor offers a PC scan
    crit: suspicious
    conf: 0.94
    if:
      type: text
      regex: '<a\b[^>]{0,80}href=["'']https?://[^"'']{1,80}["''][^>]{0,8}>[^<]{0,40}scan your pc'
      case_insensitive: true
      exclude_html_comments: true
composite_rules:
  - id: browser-error-install-consent
    desc: Browser error page requests install consent
    crit: hostile
    conf: 0.96
    attack: T1036
    all:
      - id: metadata/document/html::browser-error-title
      - id: objectives/execution/lure/dialog::install-update-yes-prompt
  - id: static-spyware-remediation-hoax
    desc: Spyware lure with screen takeover and exit hook
    crit: hostile
    conf: 0.98
    all:
      - id: static-spyware-system-error-verdict
      - id: micro-behaviors/ui/dialog/prompt::spyware-protection-link
      - id: micro-behaviors/ui/window/control::resize-to-available-screen
      - id: micro-behaviors/ui/window/event::html-body-unload-handler
  - id: static-spyware-scan-link-hoax
    desc: Spyware scare links to a PC scan
    crit: hostile
    conf: 0.96
    attack: T1036
    near_bytes: 2000
    all:
      - id: spyware-threat-detected-verdict
      - id: scan-your-pc-http-anchor
  # Same verdict without a screen takeover or unload hook: the numbered
  # system-error line and the "protect from the Spyware" link are enough.
  - id: static-spyware-protection-link-hoax
    desc: Spyware error page links to protection
    crit: hostile
    conf: 0.96
    attack: T1036
    near_bytes: 2500
    all:
      - id: static-spyware-system-error-verdict
      - id: micro-behaviors/ui/dialog/prompt::spyware-protection-link
