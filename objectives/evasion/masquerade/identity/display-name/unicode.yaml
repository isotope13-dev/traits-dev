defaults:
  attack: T1036
traits:
  - id: chrome-extension-name-ascii-zero-width
    desc: "ASCII identity contains hidden zero-width"
    crit: suspicious
    conf: 0.92
    platforms: [unix, windows]
    for: [chrome-manifest]
    if:
      type: value
      path: name
      regex: '[A-Za-z0-9][\u200B\u200C\u200D\u2060\uFEFF][A-Za-z0-9]'
  - id: chrome-extension-action-title-ascii-zero-width
    desc: 'ASCII action title hides zero-width'
    crit: suspicious
    conf: 0.88
    platforms: [unix, windows]
    for: [chrome-manifest]
    if:
      type: value
      path: action.default_title
      regex: '[A-Za-z0-9][\u200B\u200C\u200D\u2060\uFEFF][A-Za-z0-9]'
  # A marketplace display name is what the gallery renders and what a user
  # reads; an invisible codepoint in it makes the listing visually identical to
  # the extension it is impersonating while remaining a distinct string, which
  # is what defeats exact-match blocklists and dedup.
  #
  # Unanchored, unlike the siblings above: the interesting placements are the
  # ends. A trailing zero-width on "solidity" is the whole trick, and requiring
  # alphanumerics on both sides would miss it. U+200C/U+200D are deliberately
  # excluded — a ZWJ is load-bearing in emoji sequences and in several scripts,
  # and display names legitimately contain both.
  - id: vscode-display-name-zero-width
    desc: Display name carries a zero-width character
    crit: suspicious
    conf: 0.92
    platforms: [unix, windows]
    for: [package.json]
    if:
      type: value
      path: displayName
      regex: '[\u200B\u2060\uFEFF]'
  - id: package-name-ascii-zero-width
    desc: Package identity contains hidden zero-width
    crit: suspicious
    conf: 0.9
    platforms: [unix, windows]
    for: [package.json, composer.json, pkginfo]
    if:
      type: value
      path: name
      regex: '[A-Za-z0-9][\u200B\u200C\u200D\u2060\uFEFF][A-Za-z0-9]'
  - id: pyproject-package-name-ascii-zero-width
    desc: "Pyproject identity hides zero-width Unicode"
    crit: suspicious
    conf: 0.9
    platforms: [unix, windows]
    for: [pyproject.toml]
    if:
      type: value
      path: project.name
      regex: '[A-Za-z0-9][\u200B\u200C\u200D\u2060\uFEFF][A-Za-z0-9]'
  - id: cargo-package-name-ascii-zero-width
    desc: Cargo identity hides zero-width Unicode
    crit: suspicious
    conf: 0.9
    platforms: [unix, windows]
    for: [cargo.toml]
    if:
      type: value
      path: package.name
      regex: '[A-Za-z0-9][\u200B\u200C\u200D\u2060\uFEFF][A-Za-z0-9]'
  - id: desktop-entry-name-ascii-zero-width
    desc: Desktop ASCII name hides zero-width Unicode
    crit: suspicious
    conf: 0.88
    for: [desktop-entry]
    platforms: [linux]
    if:
      type: value
      path: desktop_entry.name
      regex: '[A-Za-z0-9][\u200B\u200C\u200D\u2060\uFEFF][A-Za-z0-9]'
  # Cyrillic only, deliberately: Greek letters are used decoratively in real
  # product names (µTorrent, π-hole, λ-calculus tooling), while a Cyrillic
  # letter welded mid-word into Latin text has no legitimate use.
  # Confusable-script spoofing, the visible twin of the zero-width traits
  # above: a lookalike letter welded into a Latin word ("Соmрliеr",
  # "Prеttiеr", "СhatGPT") so a marketplace listing renders as a known brand
  # while occupying a different identifier. Adjacency is the test — a
  # genuinely localized name keeps its scripts in separate words, so
  # "Русский Language Pack" does not match.
  - id: extension-name-latin-cyrillic-mix
    desc: Extension name mixes Latin and Cyrillic
    crit: suspicious
    conf: 0.9
    platforms: [unix, windows]
    for: [chrome-manifest]
    if:
      type: value
      path: name
      regex: '[a-zA-Z][\x{400}-\x{4ff}]|[\x{400}-\x{4ff}][a-zA-Z]'
  - id: vsix-display-name-latin-cyrillic-mix
    desc: VSIX display name mixes Latin and Cyrillic
    crit: suspicious
    conf: 0.92
    platforms: [unix, windows]
    for: [vsix-archive]
    if:
      type: value
      path: vsix.display_name
      regex: '[a-zA-Z][\x{400}-\x{4ff}]|[\x{400}-\x{4ff}][a-zA-Z]'
  # `for:` is the .vsix archive, not the .vsixmanifest entry: the `vsix.*`
  # value tree is synthesized on the archive unit (the manifest entry itself
  # types as plain xml), so the manifest spelling could never match.
  - id: vsix-display-name-ascii-zero-width
    desc: VSIX ASCII display name hides zero-width Unicode
    crit: suspicious
    conf: 0.9
    platforms: [unix, windows]
    for: [vsix-archive]
    if:
      type: value
      path: vsix.display_name
      regex: '[A-Za-z0-9][\u200B\u200C\u200D\u2060\uFEFF][A-Za-z0-9]'
