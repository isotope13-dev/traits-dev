# Office Help text with the original vendor and signer exclusions.
defaults:
  platforms:
  - windows
  for:
  - pe
composite_rules:
- id: office-help-user-agent-untrusted
  desc: Office Help user-agent outside vendor contexts
  crit: suspicious
  conf: 0.92
  all:
  - id: well-known/app/productivity/microsoft-office::office-help-user-agent-text
  unless:
  - id: metadata/signature/verified/platform::microsoft
  - id: metadata/signature/verified/signer::microsoft-corporation
  - id: metadata/vendor/identity::microsoft-corp-versioninfo
