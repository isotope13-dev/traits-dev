defaults:
  platforms:
    - unix
    - windows
  crit: suspicious
  attack: T1036.005
  mbc: F0004
  for:
    - python
    - shell
traits:
  - id: appdata-path-manipulation
    desc: AppData path reference
    crit: suspicious
    conf: 0.8
    if:
      type: string_literal
      regex: AppData.{0,50}Roaming.{0,50}Microsoft.{0,50}Windows.{0,50}CurrentVersion
  - id: startup-folder-access
    desc: Startup folder path access
    crit: suspicious
    conf: 0.85
    if:
      type: string_literal
      regex: Start Menu.{0,50}Programs.{0,50}Startup.{0,50}boot
  - id: directory-masquerade-a
    desc: Office name with grabber
    crit: notable
    conf: 0.8
    if:
      type: string_literal
      regex: (Powerpoint|Excel|Word|Outlook).{0,50}grabber
  - id: directory-masquerade-b
    desc: Office name with stealer naming
    crit: notable
    conf: 0.8
    if:
      type: string_literal
      regex: \b(Power[Pp]oint|Excel|Word|Outlook)[\\/_ .-]{0,8}steal(er)?\b
  - id: directory-masquerade-c
    desc: Office name with bot naming
    crit: notable
    conf: 0.8
    if:
      type: string_literal
      regex: \b(Power[Pp]oint|Excel|Word|Outlook)[\\/_ .-]{0,8}bot(net)?\b
composite_rules:
  - id: file-masquerade-move
    desc: Startup path and file-movement references
    crit: suspicious
    conf: 0.9
    all:
      - id: micro-behaviors/fs/path/config/autorun::startup-appdata-movement-reference
      - id: file-move-call
  - id: file-move-call
    desc: File movement helper call
    crit: component
    conf: 0.7
    any:
      - id: micro-behaviors/fs/file/rename::rename
      - id: micro-behaviors/fs/file/rename::shutil-move
  - id: directory-masquerade
    desc: Office and tool-name terms in a string
    crit: notable
    conf: 0.8
    any:
      - id: directory-masquerade-a
      - id: directory-masquerade-b
      - id: directory-masquerade-c
  - id: file-masquerade-execution
    desc: File movement with startup or name markers
    crit: suspicious
    conf: 0.9
    attack: T1036.005 - python
    needs: 2
    any:
      - id: file-masquerade-move
      - id: directory-masquerade
      - id: startup-folder-access
    all:
      - id: file-move-call
  - id: advanced-masquerade
    desc: Multiple startup and tool-name path markers
    crit: suspicious
    conf: 0.95
    platforms:
      - windows
    for:
      - python
    needs: 3
    any:
      - id: directory-masquerade
      - id: micro-behaviors/fs/path/reference::tool-name-temp-path-literal
      - id: micro-behaviors/fs/path/reference::windows-system-tool-temp-path
      - id: appdata-path-manipulation
      - id: startup-folder-access
