defaults:
  platforms:
    - unix
    - android
  for:
    - elf
traits:
  - id: fake-smartd
    desc: Fake smartd process masquerade
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: /usr/sbin/smartd\s+-[nqp]
  - id: fake-syslogd
    desc: Fake syslogd process masquerade
    crit: suspicious
    conf: 0.9
    if:
      type: text
      regex: /usr/sbin/syslogd\s+-[nms]
  - id: hald-pidfile
    desc: HAL daemon PID file path
    crit: suspicious
    conf: 0.85
    if:
      type: text
      substr: /var/run/hald-
  - id: auditd-path
    desc: auditd daemon path reference
    crit: suspicious
    conf: 0.8
    if:
      type: text
      substr: /usr/sbin/auditd
  - id: acpid-path
    desc: acpid daemon path reference
    crit: suspicious
    conf: 0.8
    if:
      type: text
      substr: /usr/sbin/acpid
  # A bare daemon word also sits in the IANA /etc/services table that network
  # tools embed; only the needs-3 name-set composite reads it as masquerade.
  - id: auditd-name-marker
    desc: auditd daemon name token
    crit: component
    conf: 0.8
    if:
      type: text
      word: auditd
    unless:
      - id: well-known/tool/detection/malcontent::malcontent-defensive-scanner-context
composite_rules:
  - id: system-daemon-name-marker-set
    desc: Three distinct system-daemon name strings
    crit: suspicious
    conf: 0.93
    needs: 3
    any:
      - id: auditd-name-marker
      - id: micro-behaviors/process/info/name::inetd-name-reference
      - id: micro-behaviors/os/service/remote::sshd-ref
      - id: micro-behaviors/process/info/name::webserv-name-reference
  - id: daemon-masquerade
    desc: Process masquerading as system daemon
    crit: hostile
    conf: 0.92
    all:
      - id: micro-behaviors/process/control/prctl::prctl-symbol
      - id: micro-behaviors/process/daemonize/background::daemon
    any:
      - id: fake-smartd
      - id: fake-syslogd
      - id: micro-behaviors/process/argument/option::cron-daemon-commandline
      - id: micro-behaviors/fs/path/application/executable::sshd-daemon-commandline
      - id: hald-pidfile
    unless:
      - id: well-known/lib/cloud/sailresearch-sdk::official-native-addon
  - id: daemonized-system-service-kill-masquerade
    desc: Daemonized system-service masquerade with peer termination
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/process/control/prctl::prctl-symbol
      - id: micro-behaviors/process/daemonize/detach::fork-new-session
      - id: micro-behaviors/process/terminate/signal::kill
      - id: system-daemon-name-marker-set
  - id: masquerade-backdoor
    desc: Backdoor with daemon masquerading
    crit: hostile
    conf: 0.95
    all:
      - id: micro-behaviors/communications/socket/create/
      - id: micro-behaviors/process/create/shell/
    any:
      - id: fake-smartd
      - id: fake-syslogd
      - id: micro-behaviors/process/argument/option::cron-daemon-commandline
      - id: micro-behaviors/fs/path/application/executable::sshd-daemon-commandline
      - id: hald-pidfile
    unless:
      - id: well-known/lib/cloud/sailresearch-sdk::official-native-addon
