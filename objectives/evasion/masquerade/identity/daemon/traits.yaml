defaults:
  platforms:
    - unix
    - android
  for:
    - elf
traits:
  - id: fake-smartd
    desc: Fake smartd process masquerade
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: /usr/sbin/smartd\s+-[nqp]
  - id: fake-syslogd
    desc: Fake syslogd process masquerade
    crit: suspicious
    conf: 0.9
    if:
      type: text
      regex: /usr/sbin/syslogd\s+-[nms]
  - id: hald-pidfile
    desc: HAL daemon PID file path
    crit: suspicious
    conf: 0.85
    if:
      type: text
      substr: /var/run/hald-
  - id: auditd-path
    desc: auditd daemon path reference
    crit: suspicious
    conf: 0.8
    if:
      type: text
      substr: /usr/sbin/auditd
  - id: acpid-path
    desc: acpid daemon path reference
    crit: suspicious
    conf: 0.8
    if:
      type: text
      substr: /usr/sbin/acpid
  # macOS stealers ship ad-hoc signed with a code-signing identifier that
  # borrows an Apple system daemon's name plus a numeric suffix. Apple signs
  # system daemons with its own identity and does not suffix daemon names with
  # build digits, so the suffixed daemon name is an impostor signal; the
  # ad-hoc-signature composite below completes the masquerade claim.
  - id: apple-daemon-numeric-suffix-identifier
    desc: Identifier mimics an Apple daemon with digits
    crit: notable
    conf: 0.9
    platforms: [macos]
    for: [macho]
    if:
      type: value
      path: macho.code_signature.identifier
      regex: '^(diagnosticd|softwareupdated|securityd)[0-9]{2,8}$'
      case_insensitive: true
composite_rules:
  - id: adhoc-apple-daemon-identifier
    desc: Ad-hoc binary identifier mimics an Apple system daemon
    crit: suspicious
    conf: 0.95
    platforms: [macos]
    for: [macho]
    all:
      - id: apple-daemon-numeric-suffix-identifier
      - id: metadata/signed/trust-level::adhoc
  - id: daemon-masquerade
    desc: Process masquerading as system daemon
    crit: hostile
    conf: 0.92
    all:
      - id: micro-behaviors/process/control/prctl::prctl-symbol
      - id: micro-behaviors/process/daemonize/background::daemon
    any:
      - id: fake-smartd
      - id: fake-syslogd
      - id: micro-behaviors/process/argument/option::cron-daemon-commandline
      - id: micro-behaviors/fs/path/application/executable::sshd-daemon-commandline
      - id: hald-pidfile
    unless:
      - id: well-known/lib/cloud/sailresearch-sdk::official-native-addon
  - id: daemonized-system-service-kill-masquerade
    desc: Daemonized system-service masquerade with peer termination
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/process/control/prctl::prctl-symbol
      - id: micro-behaviors/process/daemonize/detach::fork-new-session
      - id: micro-behaviors/process/control/signal::posix-kill-symbol
      - id: micro-behaviors/os/service/daemon::system-daemon-name-marker-set
  - id: masquerade-backdoor
    desc: Backdoor with daemon masquerading
    crit: hostile
    conf: 0.95
    all:
      - id: micro-behaviors/communications/socket/create/
      - id: micro-behaviors/process/create/shell/
    any:
      - id: fake-smartd
      - id: fake-syslogd
      - id: micro-behaviors/process/argument/option::cron-daemon-commandline
      - id: micro-behaviors/fs/path/application/executable::sshd-daemon-commandline
      - id: hald-pidfile
    unless:
      - id: well-known/lib/cloud/sailresearch-sdk::official-native-addon
