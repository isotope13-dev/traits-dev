defaults:
  for: [dex]
  platforms: [android]

composite_rules:
  - id: google-system-proxy-module
    desc: Google system class references alongside a residential proxy SDK
    crit: suspicious
    conf: 0.95
    near_bytes: 1024
    all:
      - id: metadata/lang/source/naming/class::google-system-class-descriptor
      - id: micro-behaviors/communications/proxy/library::packet-sdk-reference
