defaults:
  platforms: [android]
  for: [dex]
  attack: T1036.005
  crit: component
  conf: 0.98

traits:
  - id: package-signature-hook-class
    crit: notable
    desc: Android package signature hook class
    if:
      type: text
      substr: SignatureHookApp

  - id: fake-package-signature-field
    crit: notable
    desc: Fake package signature capture field
    if:
      type: text
      exact: 'val$fakeSignature'

  - id: package-manager-modification-error
    crit: notable
    desc: Package manager modification failure string
    if:
      type: text
      exact: Failed to modify package manager

composite_rules:
  - id: android-package-signature-spoof
    desc: Android package manager signature spoofing
    crit: suspicious
    conf: 0.99
    all:
      - id: package-signature-hook-class
      - id: fake-package-signature-field
      - id: package-manager-modification-error

  # Generic re-signing kits (MT Manager / ApkSignatureKillerEx and similar)
  # replace PackageInfo.CREATOR with a wrapper that injects the original
  # developer certificate into every PackageInfo, then reflectively clear
  # Parcel's creator caches so the forged creator is used. A repackaged app
  # then passes its own signature and licence checks under a foreign key.
  - id: packageinfo-creator-signature-swap
    desc: Swaps Parcel creators to forge app signatures
    crit: suspicious
    conf: 0.95
    all:
      - id: micro-behaviors/metaprogramming/reflection/resolve::parcel-creator-cache-field-name
      - id: micro-behaviors/os/package-manager/verify::dex-android-signature-type
      - id: micro-behaviors/metaprogramming/reflection/inspect/member::dex-reflective-field-write-call

