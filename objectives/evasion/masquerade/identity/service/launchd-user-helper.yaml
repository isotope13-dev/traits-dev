defaults:
  platforms: [macos]
  for: [plist]
  attack: T1036.005

traits:
  - id: launchd-user-library-apple-service-path
    desc: Launchd uses user-writable Apple service path
    crit: suspicious
    conf: 0.97
    if:
      type: value
      path: ProgramArguments[0]
      regex: '^/Users/[^/]{1,80}/Library/com\.apple\.[a-z0-9.-]{2,60}/[^/]{1,120}$'
