defaults:
  platforms: [macos]
  for: [scripts, binaries]
  attack: T1036.005
  mbc: F0004

traits:
  # A bare Apple-style identifier is incomplete masquerade evidence: third-party
  # software may mention a real Apple service without claiming that identity.
  # Persistence composites add the service-registration context.
  - id: apple-helper-namespace
    desc: Apple helper namespace identifier
    crit: component
    conf: 0.85
    if:
      type: text
      regex: '[^/]com\.apple\.[a-z0-9.-]{2,30}\.(helper|service|agent|daemon)\b'
    not:
      - regex: com\.apple\.private\.
      - regex: com\.apple\.(kext|driver)\.
      - regex: com\.apple\.(trustd|coresimulator)\.
    unless:
      - id: metadata/signed/platform::apple
      - id: metadata/binary/vendor/
      - id: well-known/tool/development/anthropic-claude-agent::claude-agent-sdk-js-marker
      - id: objectives/supply-chain/trojanized/app/debug-probe/
      - id: metadata/library/electron::macos-framework
      - id: well-known/tool/development/darling/
      - id: well-known/lib/runtime/php-runtime::runtime-shared-library
      # Seatbelt profiles legitimately name Apple's preference services; these
      # are IPC allowlists, not service-identity claims.
      - type: text
        regex: 'global-name\s+"com\.apple\.cfprefsd\.(daemon|agent)"'
