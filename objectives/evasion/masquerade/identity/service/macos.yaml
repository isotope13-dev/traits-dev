defaults:
  platforms: [macos]
  for: [scripts, binaries]
  attack: T1036.005
  mbc: F0004

traits:
  # A bare Apple-style identifier is incomplete masquerade evidence: third-party
  # software may mention a real Apple service without claiming that identity.
  # Persistence composites add the service-registration context.
  - id: apple-helper-namespace
    desc: Apple helper namespace identifier
    crit: notable
    conf: 0.85
    if:
      type: text
      regex: '[^/]com\.apple\.[a-z0-9.-]{2,30}\.(helper|service|agent|daemon)\b'
    not:
      - regex: com\.apple\.private\.
      - regex: com\.apple\.(kext|driver)\.
      - regex: com\.apple\.(trustd|coresimulator)\.
    unless:
      - id: metadata/signed/platform::apple
      - id: metadata/binary/vendor/
      - id: metadata/import/package::claude-agent-sdk-module-reference
      - id: objectives/supply-chain/trojanized/app/debug-probe/
      - id: well-known/lib/runtime/scripted/electron::macos-framework
      - id: well-known/tool/development/toolchain/darling/
      - id: well-known/lib/runtime/scripted/php-runtime::runtime-shared-library
      # Seatbelt profiles legitimately name Apple's preference services; these
      # are IPC allowlists, not service-identity claims.
      - type: text
        regex: 'global-name\s+"com\.apple\.cfprefsd\.(daemon|agent)"'
  # A non-Apple vendor daemon identity (Canonical, Microsoft, Google, ...) on
  # a binary none of those vendors signed. Third-party software may reference
  # a vendor daemon it talks to, so this alone is notable; the ad-hoc-packed
  # runner composite below supplies the concealment and execution context.
  - id: vendor-daemon-os-claim
    desc: OS vendor daemon identity string
    crit: notable
    conf: 0.85
    if:
      type: text
      regex: '(?i)\b(net|com|org)\.(canonical|ubuntu|microsoft)\.([a-z0-9._-]{1,30}\.)?daemon\b'
    unless:
      - id: metadata/signed/platform::apple
  - id: vendor-daemon-app-claim
    desc: App vendor daemon identity string
    crit: notable
    conf: 0.85
    if:
      type: text
      regex: '(?i)\b(net|com|org)\.(google|mozilla|adobe|oracle)\.([a-z0-9._-]{1,30}\.)?daemon\b'
    unless:
      - id: metadata/signed/platform::apple
  # A launchd job Label in Apple's reverse-DNS namespace. Apple's own plists
  # use it too, so alone this only records the identity claim; the composite
  # below adds the user-writable install and load.
  - id: launchd-label-apple-namespace
    desc: launchd job Label claims com.apple namespace
    crit: notable
    conf: 0.9
    for: [scripts]
    if:
      type: text
      regex: '<key>Label</key>\s*<string>com\.apple\.[\w.-]{2,60}</string>'
    unless:
      - id: metadata/signed/platform::apple

composite_rules:
  - id: vendor-daemon-identity
    desc: Vendor daemon identity claim
    crit: notable
    conf: 0.85
    any:
      - id: vendor-daemon-os-claim
      - id: vendor-daemon-app-claim
  - id: adhoc-vendor-daemon-payload-runner
    desc: Ad-hoc runner claims vendor daemon identity with concealed payload
    crit: hostile
    conf: 0.95
    all:
      - id: metadata/signed/trust-level::adhoc
      - id: vendor-daemon-identity
      - id: metadata/file/encoded::large-base64-like-string
      - id: micro-behaviors/process/create/shell/spawn::system-fn


  # Apple does not ship jobs by scripting a plist into ~/Library/LaunchAgents
  # and loading it with launchctl; doing so under a com.apple Label disguises
  # third-party persistence as an Apple service.
  - id: user-launchagent-apple-label-masquerade
    desc: Loads a user LaunchAgent labeled as an Apple job
    crit: hostile
    conf: 0.95
    attack: T1036.004,T1543.001
    for: [scripts]
    all:
      - id: launchd-label-apple-namespace
      - id: micro-behaviors/os/service/launchagent::launchagent-path-reference
    any:
      - id: micro-behaviors/os/service/start::launchctl-load-command
      - id: micro-behaviors/os/service/start::launchctl-bootstrap-subcommand
      - id: micro-behaviors/os/service/control::python-launchctl-argv
    unless:
      - id: metadata/signed/platform::apple
      - id: metadata/binary/vendor/
