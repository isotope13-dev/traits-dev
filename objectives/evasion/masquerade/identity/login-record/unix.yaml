# Beyond wiping wtmp/utmp, some log cleaners insert fabricated sessions with an
# operator-chosen user, tty, host and login/logout times, so the record shows
# a plausible but false identity for the intrusion window.
defaults:
  platforms: [unix]
  for: [elf]
  attack: T1070.006

composite_rules:
  - id: forged-login-session-insertion
    desc: Inserts and rewrites login records to forge user sessions
    crit: hostile
    conf: 0.95
    all:
      - id: micro-behaviors/fs/path/log/accounting::login-accounting-files-binary
      - id: micro-behaviors/fs/path/log/accounting::inserted-login-entry-report
      - id: micro-behaviors/fs/path/log/accounting::replaced-login-entry-report
