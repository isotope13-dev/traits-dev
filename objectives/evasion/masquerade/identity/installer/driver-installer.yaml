defaults:
  platforms: [windows]
  for: [pe]
  attack: T1036.005
traits:
- id: generic-install-driver-filename
  desc: Generic InstallDriver original filename
  crit: notable
  conf: 0.9
  if:
    type: value
    path: pe.version.original_filename
    regex: (?i)^InstallDriver\.EXE$
- id: generic-install-driver-product
  desc: Generic InstallDriver product metadata
  crit: notable
  conf: 0.88
  if:
    type: value
    path: pe.version.product_name
    regex: (?i)^InstallDriver (Application|MFC Application)$
- id: gpu-vendor-driver-description-claim
  desc: Graphics-vendor driver description claim
  crit: notable
  conf: 0.97
  if:
    type: value
    path: pe.version.description
    regex: '(?i)^(nvidia|amd|intel)\b.*(driver|vgpu|gpu|dll),\s*version'
- id: wdm-video-capture-driver-description-claim
  desc: WDM video-capture driver description claim
  crit: notable
  conf: 0.96
  if:
    type: value
    path: pe.version.description
    regex: '(?i)user mode driver.*wdm.*video capture|\bwdm\b.*video capture dev'
composite_rules:
- id: generic-install-driver-identity
  desc: Generic unvendored InstallDriver identity
  crit: component
  conf: 0.9
  all:
  - id: generic-install-driver-filename
  - id: generic-install-driver-product
  - id: metadata/binary/provenance/version-info::version-info-company-name-absent
- id: unvendored-dotnet-driver-resource-loader
  desc: Unvendored InstallDriver .NET resource loader
  crit: suspicious
  conf: 0.96
  all:
  - id: generic-install-driver-identity
  - id: metadata/lang/compiler/managed::dotnet-metadata
  - id: micro-behaviors/data/embedded/resource::dotnet-resource-data-access
  unless:
  - id: metadata/signature/verified/
  - id: metadata/binary/provenance/version-fields::pe-companyname-field
- id: unvendored-dotnet-self-resource-stager
  desc: Unvendored .NET self-resource stager
  crit: hostile
  conf: 0.94
  all:
  - id: unvendored-dotnet-driver-resource-loader
  - id: micro-behaviors/process/info/current::dotnet-getexecutingassembly-token
  any:
  - id: metadata/import/framework::dotnet-linq-namespace
  needs: 1
  unless:
  - id: metadata/signature/verified/
  - id: metadata/binary/provenance/version-fields::pe-companyname-field
- id: install-driver-resource-reflective-loader
  desc: InstallDriver resource reflective loader
  crit: hostile
  conf: 0.95
  attack: T1620
  mbc: E1059
  all:
  - id: unvendored-dotnet-driver-resource-loader
  - id: micro-behaviors/process/info/current::dotnet-getexecutingassembly-token
  - id: micro-behaviors/metaprogramming/reflection/inspect/class/inspection::load-member-token
  - id: micro-behaviors/metaprogramming/reflection/inspect/class/inspection::methodbase-class
  - id: micro-behaviors/metaprogramming/reflection/inspect/class/inspection::get-entrypoint-token
  unless:
  - id: metadata/signature/verified/
  - id: metadata/binary/provenance/version-fields::pe-companyname-field
- id: unsigned-inno-wdm-video-driver-masquerade
  desc: Unsigned Inno installer claims WDM video-capture driver identity
  crit: hostile
  conf: 0.98
  attack: T1036.005,T1027.009
  all:
  - id: wdm-video-capture-driver-description-claim
  - id: well-known/tool/packaging/inno-setup-runtime::inno-delphi-installer-foundation
  - id: metadata/binary/layout/ratio::overlay-over-90pct
  - id: metadata/signature/absent::unsigned-missing-signature-record
  unless:
  - id: metadata/signature/verified/platform/

