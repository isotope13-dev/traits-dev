defaults:
  platforms: [windows, unix]
  for: [html, javascript, markdown]
  attack: T1036.005

traits:
  - id: web-brand-malwarebytes
    desc: Malwarebytes name in installer-facing copy
    crit: component
    conf: 0.9
    if:
      type: text
      word: Malwarebytes
      case_insensitive: true

  - id: web-brand-consumer-av
    desc: Consumer antivirus name in installer-facing copy
    crit: component
    conf: 0.9
    if:
      type: text
      regex: '(?i)\b(bitdefender|kaspersky|norton)\b'

  - id: web-brand-security-suite
    desc: Security-suite name in installer-facing copy
    crit: component
    conf: 0.9
    if:
      type: text
      regex: '(?i)\b(mcafee|avast|avg|eset)\b'

  - id: web-brand-sophos
    desc: Sophos name in installer-facing copy
    crit: component
    conf: 0.9
    if:
      type: text
      word: Sophos
      case_insensitive: true

  - id: web-verifying-security-lure
    desc: Web page claims security verification
    crit: component
    conf: 0.9
    if:
      type: text
      regex: '(?i)\b(verifying security|security verification)\b'

  - id: web-verified-trusted-lure
    desc: Web page claims verified trusted completion
    crit: component
    conf: 0.9
    if:
      type: text
      regex: '(?i)\bverified\s*(&|and)\s*trusted\b'

  - id: web-installation-ready-lure
    desc: Web page claims installation is ready
    crit: component
    conf: 0.9
    if:
      type: text
      regex: '(?i)\binstallation ready\b'

  - id: web-macos-installer-title
    desc: Web page title claims macOS Installer
    crit: component
    conf: 0.9
    for: [html, javascript, markdown, text, svg]
    if:
      type: text
      regex: '(?i)macOS\s+Installer'

composite_rules:
  - id: web-security-product-name
    desc: Security-product name in installer-facing copy
    crit: component
    conf: 0.9
    any:
      - id: web-brand-malwarebytes
      - id: web-brand-consumer-av
      - id: web-brand-security-suite
      - id: web-brand-sophos

  - id: web-installer-verification-lure
    desc: Web page simulates installer verification and completion
    crit: component
    conf: 0.9
    needs: 2
    any:
      - id: web-verifying-security-lure
      - id: web-verified-trusted-lure
      - id: web-installation-ready-lure

  - id: branded-web-installer-redirect
    desc: Branded security-product web installer redirects to a decoded URL
    crit: hostile
    conf: 0.99
    scope: archive
    all:
      - id: web-security-product-name
      - id: web-installer-verification-lure
      - id: micro-behaviors/data/decode/base64::atob-decode
      - id: micro-behaviors/ui/window/manage/dom::browser-location-href-assign

  - id: fake-macos-web-installer-redirect
    desc: Fake macOS web installer redirects to a decoded URL
    crit: hostile
    conf: 0.98
    scope: archive
    all:
      - id: web-macos-installer-title
      - id: web-installer-verification-lure
      - id: micro-behaviors/data/decode/base64::atob-decode
      - id: micro-behaviors/ui/window/manage/dom::browser-location-href-assign
