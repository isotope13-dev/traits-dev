defaults:
  platforms:
  - windows
  - unix
  for:
  - html
  - javascript
  - markdown
  attack: T1036.005
traits:
- id: web-verified-trusted-lure
  desc: Web page claims verified trusted completion
  crit: component
  conf: 0.9
  if:
    type: text
    regex: (?i)\bverified\s*(&|and)\s*trusted\b
- id: web-installation-ready-lure
  desc: Web page claims installation is ready
  crit: notable
  conf: 0.9
  if:
    type: text
    regex: (?i)\binstallation ready\b
- id: web-macos-installer-title
  desc: Web page title claims macOS Installer
  crit: notable
  conf: 0.9
  for:
  - html
  - javascript
  - markdown
  - text
  - svg
  if:
    type: text
    regex: (?i)macOS\s+Installer
composite_rules:
- id: web-installer-verification-lure
  desc: Web page simulates installer verification and completion
  crit: component
  conf: 0.9
  needs: 2
  any:
  - id: micro-behaviors/ui/dialog/prompt::security-verification-copy
  - id: web-verified-trusted-lure
  - id: web-installation-ready-lure
- id: branded-web-installer-redirect
  desc: Branded security-product web installer redirects to a decoded URL
  crit: hostile
  conf: 0.99
  for:
  - html
  - javascript
  - markdown
  - zip
  scope: archive
  all:
  - id: micro-behaviors/os/security/product::web-security-product-reference
  - id: web-installer-verification-lure
  - id: micro-behaviors/data/decode/base64::atob-decode
  - id: micro-behaviors/ui/window/navigation::browser-location-href-assign
- id: fake-macos-web-installer-redirect
  desc: Fake macOS web installer redirects to a decoded URL
  crit: hostile
  conf: 0.98
  for:
  - html
  - javascript
  - markdown
  - zip
  scope: archive
  all:
  - id: web-macos-installer-title
  - id: web-installer-verification-lure
  - id: micro-behaviors/data/decode/base64::atob-decode
  - id: micro-behaviors/ui/window/navigation::browser-location-href-assign
