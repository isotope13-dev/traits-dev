# Programmatic installer masquerades install attribution by forging the
# installer package name to the official Google Play Store (com.android.vending).
# Sideloaded droppers use forged installer identity to deceive provenance tracking
# and user review into treating the payload as an official store installation.
defaults:
  platforms: [android]
  for: [java, kotlin]
  crit: hostile
  conf: 0.98
  attack: T1036.005,T1631

composite_rules:
  - id: android-play-store-installer-masquerade
    desc: Disables Play Store while claiming its installer identity
    all:
      - id: micro-behaviors/os/package-manager/management::android-play-store-disable-command
      - id: micro-behaviors/os/package-manager/sideload::android-store-disable-before-apk-write
      - id: micro-behaviors/os/package-manager/sideload::android-apk-session-commit
      - id: micro-behaviors/os/package-manager/sideload::android-programmatic-apk-install
    any:
      - id: micro-behaviors/os/package-manager/management::android-play-installer-attribution-call
      - id: micro-behaviors/os/package-manager/management::kotlin-play-installer-attribution-call
