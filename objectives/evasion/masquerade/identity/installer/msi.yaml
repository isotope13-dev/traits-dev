defaults:
  platforms: [windows]
  for: [all]
  attack: T1036.005
  mbc: F0004

composite_rules:
  - id: msi-windows-host-alias-payload
    desc: MSI installs a payload under a Windows host name
    crit: hostile
    conf: 0.98
    attack: T1036.005,T1027.009
    all:
      - id: metadata/package/files/msi::ole2-installer-kind
      - id: micro-behaviors/fs/path/installer::windows-run-key-executable-reference
    any:
      - id: micro-behaviors/fs/path/host-process
    unless:
      - id: metadata/binary/installer/family/
