defaults:
  platforms: [windows]
  for: [oledoc]
  attack: T1036.005
  mbc: F0004

composite_rules:
  - id: msi-windows-host-alias-payload
    desc: MSI installs a payload under a Windows host name
    crit: hostile
    conf: 0.98
    attack: T1036.005,T1027.009
    all:
      - id: metadata/package/files/msi::ole2-installer-kind
      - id: micro-behaviors/os/registry/keys::currentversion-run
    any:
      - id: micro-behaviors/fs/path/host-process
    unless:
      - id: metadata/binary/installer/family/
      - id: well-known/tool/offensive/metasploit::framework-source-release-context
