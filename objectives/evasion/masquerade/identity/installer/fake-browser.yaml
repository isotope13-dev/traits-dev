defaults:
  platforms: [windows]
  for: [pe]
  attack: T1036.005
  mbc: F0004

composite_rules:
  - id: self-issued-chrome-inno-masquerade
    desc: Self-issued Inno installer masquerades as Chrome
    crit: hostile
    conf: 0.99
    all:
      - id: well-known/app/browser/google-chrome::pe-product-name-chrome
      - id: well-known/app/browser/google-chrome::pe-file-description-chrome-setup
      - id: well-known/tool/packaging/inno-setup-runtime::inno-delphi-installer-foundation
      - id: metadata/signature/certificate/chain::pe-cert-leaf-self-issued
