# Downloader JScripts that register persistence tasks routinely forge the
# task's RegistrationInfo to present as first-party maintenance software
# (Author "Microsoft Corporation", a maintenance-utility description). A
# task-creating script claiming the vendor's authorship is the masquerade;
# the registration legs bind the claim to task creation rather than prose.
defaults:
  platforms: [windows]
  for: [javascript]
traits:
  - id: task-author-property-assignment
    desc: Assigns scheduled task author property
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '\.RegistrationInfo\.Author\s*='
  - id: microsoft-corporation-author-literal
    desc: Microsoft Corporation author literal
    crit: notable
    conf: 0.9
    if:
      type: text
      substr: Microsoft Corporation
composite_rules:
  - id: microsoft-author-task-masquerade
    desc: Forges Microsoft authorship on scheduled task
    crit: hostile
    conf: 0.9
    attack: T1036,T1053.005
    scope: file
    all:
      - id: objectives/persistence/login/scheduled-task/com::register-task-fragment
      - id: task-author-property-assignment
      - id: microsoft-corporation-author-literal
    near_bytes: 4000
