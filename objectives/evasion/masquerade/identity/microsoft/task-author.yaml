# Downloader JScripts that register persistence tasks routinely forge the
# task's RegistrationInfo to present as first-party maintenance software
# (Author "Microsoft Corporation", a maintenance-utility description). A
# task-creating script claiming the vendor's authorship is the masquerade;
# the registration legs bind the claim to task creation rather than prose.
defaults:
  platforms: [windows]
  for: [javascript]
composite_rules:
  - id: microsoft-author-task-masquerade
    desc: Remote PowerShell stager assigns Microsoft task authorship
    crit: hostile
    conf: 0.9
    attack: T1036,T1053.005
    scope: file
    all:
      - id: micro-behaviors/os/autorun/task-registration::wsh-task-registration-method-reference
      - id: micro-behaviors/os/autorun/task-config::task-microsoft-author-assignment
      - id: objectives/execution/payload/file-exec/command/script-host-download::wsh-remote-powershell-stage-and-launch
    near_bytes: 4000
