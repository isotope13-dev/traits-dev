# A task definition that signs itself "Microsoft" yet hides from the Task
# Scheduler UI and launches an executable outside every Windows and Microsoft
# product location. Microsoft's own tasks run binaries from the Windows
# directory or Microsoft-named program trees; borrowing the author field for
# a hidden foreign executable is the masquerade.
defaults:
  platforms: [windows]
  for: [xml]
  attack: T1036.004,T1053.005

composite_rules:
  - id: task-xml-microsoft-author-foreign-exe
    desc: Hidden task claims Microsoft but runs foreign exe
    crit: hostile
    conf: 0.93
    all:
      - id: micro-behaviors/os/autorun/task-xml-scheduled::scheduled-task-xml-root
      - id: micro-behaviors/os/autorun/task-xml-scheduled::scheduled-task-microsoft-author-xml
      - id: micro-behaviors/os/autorun/task-xml-scheduled::scheduled-task-hidden-xml
      - id: micro-behaviors/os/autorun/task-xml-scheduled::scheduled-task-absolute-exe-command-xml
    unless:
      - id: micro-behaviors/os/autorun/task-xml-scheduled::scheduled-task-microsoft-location-command-xml
