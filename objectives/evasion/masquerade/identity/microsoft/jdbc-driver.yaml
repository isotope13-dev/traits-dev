# A JDBC driver class placed in the Microsoft SQL Server driver package
# (com.microsoft.sqlserver.jdbc) under a name the real driver never uses.
# mssql-jdbc implements java.sql.Driver only in SQLServerDriver, so any other
# class there that implements the interface is borrowing Microsoft's package
# to look like part of the vendor driver.
#
# Registering that class in META-INF/services/java.sql.Driver makes
# DriverManager load and instantiate it the first time any JDBC code runs,
# which turns the masquerade into an execution trigger. The Hunt.io November
# 2026 open-directory kit used com.microsoft.sqlserver.jdbc.TlsChannelFix this
# way to launch a Mythic Apollo payload and a Java HTTPS beacon.
defaults:
  platforms: [windows, unix]
  attack: T1036.005
  mbc: B0025

traits:
  - id: class-in-mssql-jdbc-package-not-driver
    desc: Class in mssql-jdbc package, not SQLServerDriver
    crit: component
    conf: 0.95
    for: [class, java_class]
    if:
      type: value
      path: class.this_class
      regex: '^com/microsoft/sqlserver/jdbc/[A-Za-z0-9_$]{1,80}$'
      not:
        - exact: com/microsoft/sqlserver/jdbc/SQLServerDriver

  - id: class-implements-jdbc-driver
    desc: Class implements java.sql.Driver
    crit: component
    conf: 0.98
    for: [class, java_class]
    if:
      type: value
      path: class.interfaces[*]
      exact: java/sql/Driver

  - id: jar-registers-jdbc-driver-provider
    desc: JAR registers a java.sql.Driver service provider
    crit: notable
    conf: 0.98
    attack: none
    mbc: none
    for: [jar]
    if:
      type: value
      path: archive.members[*].path
      exact: META-INF/services/java.sql.Driver

composite_rules:
  - id: jdbc-driver-masquerading-as-mssql
    desc: JDBC driver class masquerades inside Microsoft's mssql-jdbc package
    crit: suspicious
    conf: 0.93
    for: [class, java_class]
    all:
      - id: class-in-mssql-jdbc-package-not-driver
      - id: class-implements-jdbc-driver

  # Any JDBC use in the host JVM now instantiates the impostor class. No
  # legitimate driver needs Microsoft's package name to be found.
  - id: autoloaded-jdbc-driver-masquerading-as-mssql
    desc: JAR auto-registers a JDBC driver masquerading in Microsoft's package
    crit: hostile
    conf: 0.95
    for: [jar, class, java_class]
    scope: archive
    all:
      - id: jar-registers-jdbc-driver-provider
      - id: jdbc-driver-masquerading-as-mssql
