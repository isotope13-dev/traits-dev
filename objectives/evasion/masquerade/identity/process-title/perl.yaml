defaults:
  crit: suspicious
  for:
    - perl
  platforms:
    - unix
    - windows
  attack: T1036.005
  mbc: F0004
traits:
  - id: process-title-assign
    desc: Perl process title assignment
    conf: 0.92
    if:
      type: text
      regex: \$0\s*=\s*"\$?[A-Za-z_][A-Za-z0-9_]*"\s*\.\s*"\\0"
  - id: fake-daemon-name
    desc: Fake daemon process path
    conf: 0.9
    if:
      type: string_literal
      regex: /usr/sbin/(sshd|cron[d]?|syslogd|smartd)
  - id: ignore-int
    crit: notable
    desc: Ignore SIGINT handler
    conf: 0.8
    if:
      type: text
      regex: \$SIG\{'INT'\}\s*=\s*'IGNORE'
    unless:
      - id: well-known/lib/crypto/mit-krb5::source-tree-context
  - id: ignore-hup
    crit: notable
    desc: Ignore SIGHUP handler
    conf: 0.8
    if:
      type: text
      regex: \$SIG\{'HUP'\}\s*=\s*'IGNORE'
  - id: ignore-term
    crit: notable
    desc: Ignore SIGTERM handler
    conf: 0.8
    if:
      type: text
      regex: \$SIG\{'TERM'\}\s*=\s*'IGNORE'
  - id: ignore-chld
    crit: notable
    desc: Ignore SIGCHLD handler
    conf: 0.8
    if:
      type: text
      regex: \$SIG\{'CHLD'\}\s*=\s*'IGNORE'
  - id: perl-mail-mta-name-list
    desc: Lists common mail daemon names
    crit: suspicious
    conf: 0.92
    if:
      type: text
      regex: '"postfix".{0,60}"exim".{0,60}"sendmail"'
  - id: perl-posix-setsid
    desc: Detaches with POSIX setsid
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '\bPOSIX::setsid\s*\('
composite_rules:
  # Notable, not suspicious: `$SIG{'HUP'} = 'IGNORE'` is how the Perl daemon
  # cookbook tells you to write a daemon, and a daemon ignores several signals
  # -- INetSim, the network-service simulator shipped for malware analysis,
  # ignores HUP, INT and TERM in its own supervisor. `stealth-daemon` below is
  # the one that pairs the burst with a fork and keeps the evasion claim.
  - id: signal-ignore-burst
    desc: Multiple ignored signal handlers
    crit: notable
    conf: 0.88
    needs: 3
    any:
      - id: ignore-int
      - id: ignore-hup
      - id: ignore-term
      - id: ignore-chld
  - id: process-masquerade
    desc: Perl daemon process masquerade
    conf: 0.94
    all:
      - id: process-title-assign
      - id: fake-daemon-name
  - id: stealth-daemon
    desc: Perl stealth daemon behavior
    conf: 0.9
    all:
      - id: signal-ignore-burst
      - id: micro-behaviors/process/fork/clone::fork-call
  - id: perl-mail-daemon-masquerade
    desc: Masquerades as a mail daemon
    crit: hostile
    conf: 0.96
    near_lines: 30
    all:
      - id: perl-mail-mta-name-list
      - id: perl-posix-setsid
