# macOS Info.plist Identity Masquerade
# Detects trojanized app bundles with fake or placeholder identities
# ATT&CK: T1036.005 (Masquerading: Match Legitimate Name)
defaults:
  for: [plist]
  platforms: [macos]
  attack: "T1036.005"
traits:
  - id: appl-package-type
    desc: Application package type declaration
    crit: component
    conf: 0.9
    if:
      type: value
      path: "CFBundlePackageType"
      exact: "APPL"
  # Generic "utils" bundle ID used by macOS stealers
  - id: generic-utils-bundle-id
    desc: Suspicious generic com.utils.* identifier
    crit: suspicious
    conf: 0.9
    if:
      type: value
      path: "CFBundleIdentifier"
      regex: "^com\\.utils\\.(application|voicemod|wormgpt|installer)$"

  # Legitimate apps use human-readable icon names, not content hashes.
  # A 64-char hex icon filename indicates automated/toolchain-driven packaging
  # and is a strong signal of malware-kit-generated bundles.
  - id: hash-named-icon-file
    desc: CFBundleIconFile named as SHA256 hash
    crit: suspicious
    conf: 0.9
    attack: "T1036"
    if:
      type: value
      path: "CFBundleIconFile"
      regex: "^[0-9a-f]{64}$"
composite_rules:
  # A stub Info.plist: it names an executable and an icon and declares nothing
  # else -- no identifier, no version, no package type. That is the minimum
  # macOS needs to launch a bundle and strictly less than Xcode has ever
  # emitted, so the bundle was assembled by hand or by a packer, around a
  # binary that was built somewhere else.
  #
  # Four samples in one corpus shared the shape exactly (Chrome.app, File.app,
  # Lunari.app, NexBeeInstaller.app -- same two keys, same `icon.icns`), which
  # is the tell that it is a toolkit rather than a quirk. Keyed on the missing
  # keys rather than on any app name, so renaming the output does not evade it.
  - id: stub-app-bundle-plist
    desc: Bundle declares an executable and nothing else
    crit: suspicious
    conf: 0.9
    all:
      - id: metadata/binary/bundle::info-plist-declares-executable
      - id: metadata/binary/bundle::info-plist-missing-bundle-id
      - id: metadata/binary/bundle::info-plist-missing-package-type
      - id: metadata/binary/bundle::info-plist-missing-version

  # Application with placeholder bundle ID = trojanized/repackaged app
  # Precision: 3.8 (meets suspicious >= 2.0 threshold)
  - id: fake-app-identity
    desc: Application with placeholder/suspicious bundle identifier
    crit: suspicious
    conf: 0.95
    any:
      - id: metadata/binary/bundle::example-bundle-id
      - id: generic-utils-bundle-id
    all:
      - id: appl-package-type
    unless:
      - id: metadata/file/profile/identity::sdk-example-demo-plist-path
      - id: well-known/app/system/maestro::ios-test-fixture-path
      - id: well-known/app/system/maestro::ios-test-fixture-context
