defaults:
  for:
  - plist
  platforms:
  - macos
  attack: T1036.005
  crit: suspicious
traits:
- id: generic-utils-bundle-id
  desc: Suspicious generic com.utils.* identifier
  conf: 0.9
  if:
    type: value
    path: CFBundleIdentifier
    regex: ^com\.utils\.(application|voicemod|wormgpt|installer)$
- id: hash-named-icon-file
  desc: CFBundleIconFile named as SHA256 hash
  conf: 0.9
  attack: T1036
  if:
    type: value
    path: CFBundleIconFile
    regex: ^[0-9a-f]{64}$
composite_rules:
- id: fake-app-identity
  desc: Application declares generic or placeholder bundle identifier
  conf: 0.95
  any:
  - id: metadata/binary/bundle::example-bundle-id
  - id: generic-utils-bundle-id
  all:
  - id: metadata/binary/bundle::info-plist-app-package-type
  unless:
  - id: metadata/binary/bundle::xamarin-project-icon-asset-key
  - id: metadata/path::example-demo-plist-path
  - id: metadata/path::swift-example-plist-path
  - id: metadata/path::manual-test-plist-path
  - id: well-known/app/system/maestro::ios-test-fixture-path
  - id: well-known/app/system/maestro::ios-test-fixture-context
