defaults:
  platforms: [windows]
  for: [batch, powershell]
  attack: T1036.005
  mbc: F0004

# A trusted-vendor name in a user-profile script path is only a masquerade
# indicator when it is actually used as a launcher target.  Keep the path and
# name as separate atoms so each remains small and reusable.
traits:
- id: user-profile-powershell-script-path
  desc: User-profile PowerShell script path
  crit: suspicious
  conf: 0.95
  if:
    type: text
    regex: (?i)C:\\Users\\([^\\\r\n]{1,64}\\)?[^\\\r\n]{1,64}\.ps1\b
- id: microsoft-named-powershell-script
  desc: Microsoft-named PowerShell script
  crit: suspicious
  conf: 0.95
  if:
    type: text
    regex: (?i)\bmicrosoft[a-z0-9_.-]{0,32}\.ps1\b
    not:
      # Canonical, documented default $PROFILE filenames PowerShell itself
      # creates and every host (console, ISE, VS Code) references verbatim --
      # not an attacker-chosen masquerade name.
      - regex: '(?i)^Microsoft\.(PowerShell|PowerShellISE|VSCode)_profile\.ps1$'

composite_rules:
- id: microsoft-like-user-profile-script
  desc: Microsoft-like user-profile script
  crit: suspicious
  conf: 0.97
  all:
  - id: user-profile-powershell-script-path
  - id: microsoft-named-powershell-script
- id: microsoft-like-policy-bypassed-script
  desc: Vendor-named user-profile script launched with policy bypass
  crit: hostile
  conf: 0.98
  attack: T1036.005,T1059.001,T1562.001
  near_bytes: 256
  all:
  - id: microsoft-like-user-profile-script
  - id: micro-behaviors/process/create/flags::powershell-policy-bypass-flag
  - id: micro-behaviors/process/create/script/file::powershell-script-execution
