# Generated-looking identities alone are common in legitimate IRC clients.
# Require the independent script-extension mismatch before raising suspicion.
# A Windows product title or svchost DDE name is the disguise by itself.
defaults:
  for: [text]
  platforms: [windows]
  attack: T1036
traits:
  - id: mirc-windows-app-title
    desc: mIRC window title claims Windows
    crit: suspicious
    conf: 0.98
    if:
      type: text
      regex: '(?im)^aptitle=Microsoft Windows[ \t]*\r?$'
  - id: mirc-svchost-dde-name
    desc: mIRC DDE name is svchost
    crit: suspicious
    conf: 0.98
    if:
      type: text
      regex: '(?im)^\[dde\][^\[]{0,160}\nServiceName=svchost\r?$'
  - id: mirc-security-product-script-dll
    desc: mIRC script list names security DLL
    crit: suspicious
    conf: 0.94
    if:
      type: text
      # Remote-script entries are loaded as mIRC source. Naming one after a
      # security product hides that script among AV filenames.
      regex: '(?im)^\[rfiles\][^\[]{0,90}^n[0-9]+=\S{0,24}(trend|norton|mcafee|avast)\.dll'
composite_rules:
  - id: mirc-generated-identities-dll-script-config
    desc: DLL scripts with generated-looking IRC names
    crit: suspicious
    conf: 0.85
    all:
      - id: objectives/evasion/masquerade/extension-mismatch::mirc-dll-suffixed-script-config
    any:
      - id: micro-behaviors/data/config/schema::mirc-random-identity-expression
      - id: micro-behaviors/data/config/schema::mirc-alphanumeric-identity-fields
  - id: mirc-windows-title-service-disguise
    desc: mIRC claims Windows title and svchost DDE name
    crit: suspicious
    conf: 0.95
    all:
      - id: metadata/file/format/structured::mirc-client-config-section
      - id: mirc-windows-app-title
      - id: mirc-svchost-dde-name

  - id: mirc-windows-update-title-disguise
    desc: mIRC client title impersonates Windows Update
    crit: suspicious
    conf: 0.98
    all:
      - id: metadata/file/format/structured::mirc-client-config-section
      - id: micro-behaviors/data/config/schema::mirc-windows-update-app-title
