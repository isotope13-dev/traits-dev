# Generated-looking identities alone are common in legitimate IRC clients.
# Require the independent script-extension mismatch before raising suspicion.
defaults:
  for: [text]
  platforms: [windows]
composite_rules:
  - id: mirc-generated-identities-dll-script-config
    desc: DLL scripts with generated-looking IRC names
    crit: suspicious
    conf: 0.85
    all:
      - id: objectives/evasion/masquerade/extension-mismatch::mirc-dll-suffixed-script-config
    any:
      - id: metadata/file/format/structured::mirc-random-identity-expression
      - id: metadata/file/format/structured::mirc-alphanumeric-identity-fields
