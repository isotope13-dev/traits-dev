# A commit workflow that strips AI authorship metadata and explicitly presents
# the resulting commits as user-authored is an authorship masquerade.
defaults:
  platforms: [windows, unix]
  for: [markdown, text]
  crit: suspicious
  conf: 0.97

traits:
  - id: removes-ai-commit-attribution
    desc: Removes AI attribution from commit metadata
    crit: suspicious
    if:
      type: text
      regex: '(?i)\b(removes|strips)\b.{0,40}\b(Claude|AI)\s+attribution\b'
  - id: claims-commits-are-user-authored
    desc: Presents commits as user-authored
    crit: suspicious
    if:
      type: text
      regex: '(?i)\b(commits?)\s+(appear|look)\s+(user-authored|authored by the user)\b'

composite_rules:
  - id: ai-commit-authorship-masquerade
    desc: Removes AI credit to disguise commit authorship
    crit: hostile
    conf: 0.99
    all:
      - id: removes-ai-commit-attribution
      - id: claims-commits-are-user-authored
