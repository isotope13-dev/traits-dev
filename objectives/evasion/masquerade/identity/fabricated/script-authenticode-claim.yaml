# Fabricated code-signing metadata inside formats that cannot carry it.
#
# Authenticode signatures exist only for PE/cabinet/catalog artifacts. A
# script carrier (JS/VBS/batch/text lure) that presents a parsed-signature
# block -- algorithm, thumbprint, issuer DN -- is decorating itself with
# provenance it cannot have; dropper builders (Lausiv/MulDrop campaigns)
# stamp these blocks so analysts and sandboxes read the sample as a signed
# vendor binary. Documentation ABOUT Authenticode lives in prose formats,
# which this leaf does not admit.
defaults:
  platforms: [windows]
  for: [javascript, vbs, batch, text]
  attack: T1036.008

traits:
  - id: signature-algorithm-claim
    desc: Claims sha256WithRSA signature algorithm
    crit: suspicious
    conf: 0.95
    if:
      type: text
      regex: '(?i)SignatureAlgorithm\s*:\s*sha256?\w*WithRSA\w*'
  - id: issuer-and-validity-claim
    desc: Claims certificate issuer DN and validity window
    crit: suspicious
    conf: 0.95
    if:
      type: text
      regex: '(?is)Issuer\s*:\s*CN\s*=.{0,220}?NotBefore\s*:'
  - id: thumbprint-and-serial-claim
    desc: Claims certificate thumbprint and serial number
    crit: suspicious
    conf: 0.95
    if:
      type: text
      regex: '(?is)Thumbprint\s*:\s*[0-9A-F:]{24,}.{0,220}?SerialNumber\s*:\s*[0-9A-F][0-9A-F:]{7,}'

composite_rules:
  - id: authenticode-metadata-claim-block
    desc: Script embeds parsed-signature metadata block
    crit: hostile
    conf: 0.97
    near_lines: 14
    all:
      - id: signature-algorithm-claim
      - id: issuer-and-validity-claim
      - id: thumbprint-and-serial-claim

  - id: fabricated-signature-decorated-dropper
    desc: Signature-decorated script with dropper machinery
    crit: hostile
    conf: 0.98
    attack: T1036.008,T1027
    for: [javascript]
    all:
      - id: authenticode-metadata-claim-block
      - id: objectives/anti-static/obfuscation/string/reconstruct::js-xor-numeric-array-string-reconstruction
    any:
      - id: micro-behaviors/data/encode/payload::large-base64-string-literals
      - id: micro-behaviors/fs/write/file/stream::js-savetofile-dynamic-path-mode-2
      - id: micro-behaviors/os/com/automation::wscript-shell-literal
