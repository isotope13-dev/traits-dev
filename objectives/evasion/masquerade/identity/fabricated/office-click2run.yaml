defaults:
  platforms: [windows]
  for: [pe]
composite_rules:
  - id: integrated-office-masquerade
    desc: Unsigned PE claims Microsoft Office IntegratedOffice identity
    crit: suspicious
    conf: 0.95
    all:
      - id: well-known/app/enterprise/microsoft-office-c2r::integrated-office-sxs-description
    unless:
      - id: metadata/signed/platform::microsoft
