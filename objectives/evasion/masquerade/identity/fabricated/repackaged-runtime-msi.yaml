defaults:
  platforms: [windows]
  for: [oledoc]

composite_rules:
  - id: adobe-msi-repackages-dotnet-runtime
    desc: Adobe-branded MSI repackages Microsoft runtime files
    crit: hostile
    conf: 0.98
    all:
      - id: metadata/package/files/msi/strings::msi-runtime-file-table-pair
      - id: metadata/document/office/properties::msi-adobe-acrobat-creator
      - id: metadata/package/files/msi/identity::msi-wix-toolset-branding
