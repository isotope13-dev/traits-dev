defaults:
  platforms: [windows]
  for: [oledoc]
  attack: T1036.005

traits:
- id: flashplayer-product-subject
  desc: MSI claims Flash Player product identity
  crit: notable
  conf: 0.96
  if:
    type: value
    path: office.subject
    regex: '(?i)^flashplayer'
composite_rules:
- id: flashplayer-msi-anti-analysis-masquerade
  # is-debugger-present-import (for: [pe, dll, c, cpp]) and pe-wmi-av-
  # enumeration (for: [pe]) are facts about an embedded PE inside the MSI, not
  # the OLE container itself, so the inherited `for: [oledoc]` default made
  # this composite ft-impossible. Widen for: and add scope: archive to roll
  # up the nested PE's facts, matching the established
  # msi-run-key-process-hunter pattern (dropper/execution/script/msi-custom-action.yaml).
  desc: Flash-branded MSI combines masquerading, anti-analysis, and security discovery
  crit: hostile
  conf: 0.99
  attack: T1036.005,T1622,T1518.001
  for: [oledoc, msi, pe]
  scope: archive
  all:
  - id: flashplayer-product-subject
  - id: metadata/package/files/msi::msi-installation-database-title
  - id: metadata/document/ole::ole-high-entropy
  - id: micro-behaviors/process/debug/detect::is-debugger-present-import
  - id: objectives/discovery/host/security::pe-wmi-av-enumeration
