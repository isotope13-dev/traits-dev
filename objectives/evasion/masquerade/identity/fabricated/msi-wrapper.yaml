defaults:
  platforms: [windows]
  attack: T1036.005

composite_rules:
  - id: msi-embedded-autoit-internet-explorer-masquerade
    desc: MSI impersonates Microsoft Internet Explorer
    crit: hostile
    conf: 0.99
    all:
      - id: metadata/lang/source/syntax/command/launch::autoit-a3x-command
      - id: metadata/document/office/properties::internet-explorer-wrapper-title
      - id: metadata/document/office/properties::msi-wrapper-microsoft-author
      - id: metadata/document/office/properties::msi-wrapper-application
