# Fabricated Windows security-product identity combined with a staged payload.
defaults:
  platforms: [windows]
  for: [pe, dll]
  attack: T1036.005
  mbc: B0039

traits:
  - id: microsoft-defender-product-name
    desc: Microsoft Defender product name
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '\bMicrosoft(\(R\))?[ ]+Defender\b'
      case_insensitive: true
    unless:
      - id: well-known/app/communication/telegram::telegram-desktop-signed-client-context
  - id: microsoft-security-essentials-name
    desc: Microsoft Security Essentials product name
    crit: notable
    conf: 0.9
    if:
      type: text
      word: Microsoft Security Essentials
      case_insensitive: true
    unless:
      - id: well-known/app/utility/siw::siw-family-identity
  - id: microsoft-windows-firewall-name
    desc: Microsoft Windows Firewall product name
    crit: notable
    conf: 0.9
    if:
      type: text
      word: Microsoft Windows Firewall
      case_insensitive: true

  - id: microsoft-firewall-label
    desc: Microsoft Firewall product label
    crit: component
    conf: 0.93
    if:
      type: text
      word: Microsoft Firewall
      case_insensitive: true

composite_rules:
  # Complete product names avoid registry-path matches such as
  # `Microsoft\Windows\CurrentVersion\Run|SecurityHealth`.
  - id: windows-security-product-claim
    desc: Microsoft security product name
    crit: notable
    conf: 0.9
    any:
      - id: microsoft-defender-product-name
      - id: microsoft-security-essentials-name
      - id: microsoft-windows-firewall-name
  - id: security-identity-opaque-anti-analysis-loader
    desc: Security-product identity masks opaque anti-analysis loader
    crit: hostile
    conf: 0.99
    attack: T1036.005,T1027,T1622
    all:
      - id: metadata/binary/resource::pe-security-product-name
      - id: metadata/binary/section/metrics::high-entropy-rdata-section
      - id: micro-behaviors/mem/protect/modify::virtual-protect
      - id: micro-behaviors/process/debug/detect::is-debugger-present-import
      - id: metadata/binary/layout::pe-multiple-tls-callbacks
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/installer/family/
      - id: well-known/app/
  - id: fabricated-security-product-overlay-stager
    desc: Fabricated Windows security-product identity on a packed multi-PE stager
    crit: hostile
    conf: 0.98
    all:
      - id: windows-security-product-claim
      - id: metadata/binary/metrics/structural::embedded-pe-three-plus
      - id: metadata/binary/layout::overlay-over-90pct
      - id: objectives/anti-static/pack/detect::aspack-marker
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/installer/family/
  - id: unsigned-packed-firewall-run-masquerade
    desc: Unsigned packed Firewall identity with Run persistence
    crit: hostile
    conf: 0.98
    attack: T1036.005,T1027,T1547.001
    all:
      - id: microsoft-firewall-label
      - id: objectives/anti-static/pack/detect::aspack-marker
      - id: metadata/binary/layout::pe-no-signature-record
      - id: micro-behaviors/os/registry/keys::currentversion-run
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/installer/family/
  - id: unsigned-security-product-resource-masquerade
    desc: Unsigned security identity with packed resource and network/registry behavior
    crit: hostile
    conf: 0.98
    attack: "T1036.005,T1027,T1071"
    all:
      - id: metadata/binary/resource::pe-security-product-name
      - id: metadata/binary/layout::pe-no-signature-record
      - id: metadata/binary/section/metrics::high-entropy-resource-small-pe
      - id: metadata/binary/section/metrics::multiple-nonstandard-section-names
    any:
      - id: micro-behaviors/communications/socket/init::winsock-client-symbol-lifecycle
      - id: micro-behaviors/os/registry/manipulate::reg-restore-key
    needs: 1
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/installer/family/
      - id: well-known/app/
      - id: well-known/tool/
