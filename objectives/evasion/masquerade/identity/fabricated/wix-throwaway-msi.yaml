defaults:
  platforms: [windows]
  for: [oledoc]
  attack: T1036.005,T1195.002

composite_rules:
  # Heavy WiX MSI with a disposable single-token product name and non-vendor
  # publisher. Complements msi-generic-ultrashort-identity (2–5 letter codes +
  # generic basename) for throwaway sideload kits that use longer opaque
  # product tokens such as Fervency.
  - id: wix-heavy-single-token-throwaway-msi
    desc: Heavy WiX MSI with throwaway single-token identity
    crit: hostile
    conf: 0.95
    size_min: 5000000
    all:
      - id: metadata/package/files/msi::ole2-installer-kind
      - id: metadata/package/files/msi::msi-wix-toolset-branding
      - id: metadata/package/files/msi::msi-single-token-subject
      - id: metadata/package/files/msi::msi-nonstandard-creator-identity
      - id: metadata/package/files/msi::msi-opaque-stream-cluster
      - id: metadata/package/files/msi::ole-security-flag
    unless:
      - id: metadata/package/files/msi::personal-product-wix-msi-context
