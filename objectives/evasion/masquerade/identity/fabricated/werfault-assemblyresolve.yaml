# A claimed Windows Error Reporting identity with a loader hook and a
# process-creation API name. The matcher does not establish that a staged
# assembly is loaded or that the named API launches a staged file.
defaults:
  platforms: [windows]
  for: [pe, dll]
  attack: T1036.005

composite_rules:
  - id: werfault-identity-assemblyresolve-hook
    desc: Werfault claim with AssemblyResolve hook
    crit: hostile
    conf: 0.99
    all:
      - id: objectives/evasion/masquerade/identity/fabricated::werfaultstub-original-filename-claim
      - id: objectives/evasion/masquerade/identity/fabricated::com-surrogate-description-claim
      - id: metadata/lang/compiler/managed::dotnet-assembly
      - id: micro-behaviors/process/interpreter/runtime/clr::assembly-resolve-event-api
      - id: micro-behaviors/process/create/exec::create-process-api-name
      - id: metadata/signature/certificate/chain::pe-cert-leaf-self-issued
