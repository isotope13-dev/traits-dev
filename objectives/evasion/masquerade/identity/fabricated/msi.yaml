defaults:
  platforms: [windows]
  for: [oledoc]
  attack: T1036.005
  conf: 0.93

traits:

- id: visual-cpp-redistributable-product
  desc: MSI claims Visual C++ Redistributable
  crit: notable
  if:
    type: text
    substr: Visual C++ RedistributableProductName

- id: kingston-technology-manufacturer
  desc: MSI claims Kingston manufacturer
  crit: notable
  if:
    type: text
    substr: Kingston TechnologyManufacturer

- id: nvidia-usb-controller-product
  desc: MSI claims NVIDIA USB controller
  crit: notable
  if:
    type: text
    substr: USB Controller PackageProductName

- id: nvidia-corporation-manufacturer
  desc: MSI claims NVIDIA manufacturer
  crit: notable
  if:
    type: text
    substr: NVIDIA CorporationManufacturer

- id: googleapi-installer-title
  desc: MSI claims GoogleAPI installer identity
  crit: notable
  conf: 0.92
  if:
    type: text
    substr: GoogleAPI Windows Installer

- id: googleapi-company-author
  desc: MSI claims GoogleAPI company author
  crit: notable
  conf: 0.9
  if:
    type: text
    substr: GoogleAPI Company

- id: googleapi-launcher-payload
  desc: Embedded GoogleAPI launcher identity
  crit: notable
  conf: 0.92
  if:
    type: text
    substr: GoogleAPI Launcher

- id: input-method-editor-product
  desc: MSI claims Input Method Editor
  crit: notable
  conf: 0.9
  if:
      type: text
      substr: Input Method Editor
- id: google-msi-product-claim
  desc: MSI claims Google identity
  crit: notable
  conf: 0.96
  if:
    type: value
    path: office.application
    regex: '(?i)^google( llc)?$'

# Nested PE only — fires when ToastUI.exe is analyzed on its own (cab
# members are not expanded from MSI containers).
- id: msi-toastui-payload
  desc: PE OriginalFilename is ToastUI.exe
  crit: notable
  conf: 0.99
  for: [pe]
  if:
    type: value
    path: pe.version.original_filename
    exact: ToastUI.exe
composite_rules:
- id: microsoft-identity-logitech-sideload-installer
  desc: Microsoft identity covers a concealed Logitech HID sideload bundle
  crit: hostile
  conf: 0.99
  attack: T1036.005,T1574.002
  all:
  - id: metadata/document/office/properties::msi-wrapper-microsoft-author
  - id: objectives/evasion/hijack-execution-flow/dll-hijacking/container::msi-logitech-hid-userland-sideload

- id: msi-securityhealth-netsupport-launcher
  desc: NetSupport client poses as SecurityHealth
  crit: hostile
  conf: 0.995
  attack: T1036.005,T1219
  all:
  - id: metadata/package/files/msi-content::msi-securityhealth-shortcut-name
  - id: well-known/dual-use/remote-admin/netsupport::msi-client32-config-stage
  - id: micro-behaviors/data/archive/extract/password::msi-dual-sevenzip-passworded-overwrite-extraction
  - id: objectives/persistence/login/startup/folder::msi-wsh-specialfolders-startup
  - id: micro-behaviors/process/create/hidden::msi-wscript-shell-run

- id: vcredist-hidden-archive-stage-masquerade
  desc: Visual C++ MSI hides an archived batch payload
  crit: hostile
  conf: 0.99
  attack: "T1036.005,T1195.002"
  all:
  - id: metadata/package/files/msi/identity::microsoft-vcredist-subject
  - id: micro-behaviors/process/create/exec::msi-wscript-shell-run-call
  - id: micro-behaviors/process/argument/file::msi-hidden-programdata-batch-arguments
  - id: metadata/package/files/msi-content::msi-rar-unrar-file-pair
- id: microsoft-vcredist-fabricated-ole-identity
  desc: Visual C++ MSI carries fabricated OLE metadata
  crit: hostile
  conf: 0.98
  attack: T1036.005,T1027
  all:
  - id: metadata/package/files/msi/identity::microsoft-vcredist-subject
  - id: well-known/tool/packaging/wix::wix-toolset-application
  - id: metadata/package/files/msi/configuration::ole-security-flag
  - id: metadata/package/files/msi/strings::msi-opaque-stream-cluster

- id: adobe-wix-install-description-lure
  desc: Adobe install-description lure on a WiX opaque container
  crit: hostile
  conf: 0.99
  attack: T1036.005,T1027,T1195.002
  size_min: 10000000
  all:
  - id: metadata/document/office/properties::msi-adobe-acrobat-subject
  - id: metadata/package/files/msi/identity::msi-adobe-install-description
  - id: metadata/package/files/msi/identity::msi-wix-toolset-branding
  - id: metadata/package/files/msi/strings::msi-opaque-stream-cluster

- id: msi-memu-fabricated-identity-launch
  desc: MSI launches MEmu runtime under a fabricated identity
  crit: hostile
  conf: 0.99
  all:
  - id: objectives/supply-chain/trojanized/app/replace::msi-memu-runtime-under-unrelated-identity
  - id: micro-behaviors/process/config/installer::msi-customaction-launchfile-reference

- id: msi-memu-fabricated-identity-runtime-launch
  desc: Unrelated MSI identity launches a bundled MEmu runtime
  crit: hostile
  conf: 0.99
  attack: T1036.005,T1195.002,T1204.002
  all:
  - id: objectives/supply-chain/trojanized/app/replace::msi-memu-runtime-under-unrelated-identity
  - id: micro-behaviors/process/config/installer::msi-runtime-launch-action

- id: msi-microsoft-runtime-target-masquerade
  desc: MSI masquerades as Microsoft runtime
  crit: hostile
  conf: 0.98
  attack: T1036.005,T1195.002
  all:
  - id: metadata/package/files/msi/identity::ole2-installer-kind
  - id: metadata/package/files/msi-content::msi-microsoft-runtime-file-target-pair
  - id: metadata/package/files/msi/identity::msi-wix-toolset-branding

- id: internet-explorer-iexpress-autoit-masquerade
  desc: IExpress AutoIt payload masquerades as Internet Explorer
  crit: hostile
  conf: 0.99
  for: [pe]
  all:
  - id: metadata/binary/provenance/version-info::pe-version-product-internet-explorer
  - id: objectives/execution/payload/file-exec/spawn/sfx::iexpress-autoit-packed-dropper
- id: visual-cpp-kingston-msi-masquerade
  desc: Visual C++ MSI claims Kingston identity
  crit: suspicious
  conf: 0.98
  all:
  - id: visual-cpp-redistributable-product
  - id: kingston-technology-manufacturer
  any:
  - id: well-known/lib/runtime/scripted/cpython::python-msi-library
  - id: micro-behaviors/os/package-manager/maintenance::msi-modify-repair-property-profile
- id: nvidia-usb-python-msi-masquerade
  desc: Python MSI claims NVIDIA USB identity
  crit: suspicious
  conf: 0.98
  all:
  - id: nvidia-usb-controller-product
  - id: nvidia-corporation-manufacturer
  - id: well-known/lib/runtime/scripted/cpython::python-msi-library
  - id: objectives/execution/payload/file-exec/installer/package::msi-generated-ca-dll

- id: googleapi-xiamen-msi-masquerade
  desc: MSI claims GoogleAPI but uses Xiamen signer
  crit: suspicious
  conf: 0.98
  all:
  - id: googleapi-installer-title
  - id: googleapi-company-author
  - id: googleapi-launcher-payload
  - id: objectives/evasion/masquerade/cert::xiamen-yamanganese-network

- id: microsoft-ime-python-msi-masquerade
  desc: Python MSI claims Microsoft IME identity
  crit: suspicious
  conf: 0.98
  all:
  - id: input-method-editor-product
  - id: metadata/vendor/string::microsoft-corporation-name-reference
  - id: well-known/lib/runtime/scripted/cpython::python-msi-library
  - id: objectives/execution/payload/file-exec/installer/package::msi-generated-ca-dll
- id: google-branded-caphyon-embedded-msi
  desc: Google-branded MSI signed by Caphyon bundles an anti-analysis native loader
  crit: hostile
  conf: 0.99
  attack: T1036.005,T1622,T1055
  scope: outer
  all:
  - id: metadata/signature/claim/signer::caphyon-srl
  - id: objectives/anti-analysis/debugger-detect/check::msi-embedded-anti-analysis-loader
  any:
  - id: metadata/package/files/msi/identity::google-msi-author
  - id: google-msi-product-claim

# Fabricated Altova "SMTC UI Broker" WiX MSI. Cab payloads are invisible under
# MSI routing, so this composite is summary-stream only: lure subject,
# fake creator, install-description claim, and WiX branding.
- id: msi-security-ui-broker-masquerade
  desc: Fabricated Altova SMTC UI Broker WiX MSI
  crit: hostile
  conf: 0.995
  attack: T1036.005,T1195.002
  all:
  - id: metadata/package/files/msi/identity::msi-smtc-ui-broker-subject
  - id: metadata/package/files/msi/identity::msi-altova-creator
  - id: metadata/package/files/msi/identity::msi-smtc-ui-broker-install-description
  - id: well-known/tool/packaging/wix::msi-wix-toolset-application-metadata
- id: python-msi-verification-lure-dropper
  desc: Python MSI poses as verification to stage per-user payload
  crit: hostile
  conf: 0.97
  attack: T1036.005,T1195.002
  for: [oledoc, msi]
  all:
  - id: well-known/lib/runtime/scripted/cpython::python-msi-library
  - id: metadata/package/files/msi/identity::msi-verification-lure-subject
  - id: micro-behaviors/fs/path/app-data/platform::msi-localappdata-install-root
  - id: metadata/package/files/msi/identity::msi-installation-database-title
