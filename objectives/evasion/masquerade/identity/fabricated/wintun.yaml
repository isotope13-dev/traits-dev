defaults:
  platforms: [windows]
  for: [pe, dll]
  attack: T1036.005

composite_rules:
  # Helper-export legs live with the capabilities they detect (neutral
  # media/service export names, also exported by legitimate DLLs); the
  # Wintun attribution comes from the company-name leg in the hostile
  # composites below, not from these names alone.
  - id: wintun-unrelated-ui-helper-export
    desc: Media helper exports seen in fabricated carriers
    crit: notable
    conf: 0.97
    any:
      - id: micro-behaviors/os/service/export::service-security-export
      - id: micro-behaviors/ui/graphics/draw::render-helper-export
      - id: micro-behaviors/ui/graphics/draw::render-progress-text-export
      - id: micro-behaviors/hardware/input/audio::media-helper-export

  - id: fabricated-wintun-ui-helper
    desc: PE fabricates Wintun identity around UI/audio loader code
    crit: hostile
    conf: 0.99
    attack: T1036.005,T1027.009,T1620
    all:
      - id: well-known/lib/platform/wintun::wintun-wireguard-company
      - id: wintun-unrelated-ui-helper-export
      - id: metadata/binary/layout/embedded::embedded-pe-three-plus
      - id: micro-behaviors/mem/protect/modify::virtual-memory-allocation-protection-api-pair
    unless:
      - id: metadata/signed/platform/

  # OSD/audio-helper variant: no VirtualAlloc-style loader pair, but the same
  # fabricated WireGuard identity plus media-helper exports around several
  # embedded driver binaries, on an unsigned carrier.
  - id: fabricated-wintun-osd-wrapper
    desc: PE fabricates Wintun identity around OSD helper code
    crit: hostile
    conf: 0.98
    attack: T1036.005,T1027.009
    all:
      - id: well-known/lib/platform/wintun::wintun-wireguard-company
      - id: micro-behaviors/ui/graphics/draw::render-progress-text-export
      - id: metadata/binary/layout/embedded::embedded-pe-three-plus
    unless:
      - id: metadata/signed/platform/
