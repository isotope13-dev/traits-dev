defaults:
  for: [msi, pe]
  platforms: [windows]
composite_rules:
  - id: aliased-luajit-self-uninstalling-launcher
    desc: Aliased LuaJIT MSI launches member and self-uninstalls
    crit: suspicious
    conf: 0.96
    scope: outer
    all:
      - id: metadata/package/files/name::msi-alphabetic-exe-long-name
      - id: micro-behaviors/process/create/exec::msi-installed-exe-with-member-argument
      - id: well-known/lib/runtime/scripted/luajit::version-banner
      - id: micro-behaviors/os/package-manager/install::silent-current-product-uninstall
  - id: luajit-msi-run-and-self-uninstall-dropper
    desc: LuaJIT MSI runs payload then self-uninstalls
    crit: hostile
    conf: 0.96
    scope: outer
    all:
      - id: micro-behaviors/process/create/exec::msi-installed-exe-with-member-argument
      - id: micro-behaviors/os/package-manager/install::silent-current-product-uninstall
      - id: well-known/lib/runtime/scripted/luajit::version-banner
