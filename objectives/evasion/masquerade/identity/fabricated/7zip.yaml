# A genuine 7-Zip version resource does not make an arbitrary renamed PE a
# 7-Zip release.  This composite detects a forged 7-Zip identity only when it
# is paired with an unsigned, high-entropy overlay and native decoding logic.
defaults:
  platforms: [windows]
  for: [pe]
  attack: T1036.005,T1027.002,T1027.009

composite_rules:
  - id: unsigned-7zip-branded-overlay-masquerade
    desc: Unsigned renamed 7-Zip PE with decoded opaque overlay
    crit: hostile
    conf: 0.99
    all:
      - id: metadata/file/string/identity::pe-product-name-7zip
      - id: metadata/binary/anomaly/provenance::pe-non-architecture-filename-mismatch
      - id: metadata/binary/layout::pe-no-signature-record
      - id: metadata/binary/layout::high-entropy-overlay
    any:
      - id: micro-behaviors/data/decode/xor::x64-byte-xor-decode-loop
      - id: micro-behaviors/crypto/symmetric/xor/loop::x64-rolling-byte-xor-decode-loop
      - id: micro-behaviors/crypto/symmetric/xor/loop::x64-rolling-byte-xor-decode-loop-accumulator
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/installer/family/
      # Preserve the distinction between a forged 7-Zip identity and a real
      # 7-Zip executable whose host code was parasitically infected.
      - id: objectives/impact/infect/binary/rewrite::parasitic-text-loader-overlay-host
