defaults:
  platforms: [windows]
  for: [pe, dll]
  attack: T1036.005

composite_rules:
  - id: signed-system-masquerade-injection-loader
    desc: Microsoft-signed system masquerade with injection markers
    crit: hostile
    conf: 0.96
    all:
      - id: micro-behaviors/os/service/name::systemupdate-label-reference
      - id: micro-behaviors/communications/ipc/file-mapping::mapping-event-api-set
      - id: metadata/binary/instruction/sequence/unspecified::allocation-like-argument-patterns
    any:
      - id: metadata/signature/verified/signer::microsoft-corporation
      - id: metadata/signature/unverified/signer::microsoft-corporation
      - id: metadata/signature/self-signed/signer::microsoft-corporation
      - id: metadata/signature/invalid/tampered/signer::microsoft-corporation
      - id: metadata/signature/invalid/bad-signature/signer::microsoft-corporation
