defaults:
  platforms: [windows]
  for: [pe]
  attack: T1036.005,T1027.009

composite_rules:
  - id: microsoft-signed-nsis-opaque-overlay
    desc: Tampered Microsoft-signed NSIS overlay wrapper
    crit: hostile
    conf: 0.98
    all:
      - id: metadata/signature/certificate/integrity::pe-signature-digest-mismatch
      - id: well-known/tool/packaging/nsis::nsis
      - id: metadata/binary/layout/entropy::high-entropy-overlay
      - id: micro-behaviors/data/archive/extension::archive-extension-reference
    any:
      - id: metadata/signature/verified/signer::microsoft-corporation
      - id: metadata/signature/unverified/signer::microsoft-corporation
      - id: metadata/signature/self-signed/signer::microsoft-corporation
      - id: metadata/signature/invalid/tampered/signer::microsoft-corporation
      - id: metadata/signature/invalid/bad-signature/signer::microsoft-corporation
    unless:
      - id: metadata/installer/product::known-installer-context
