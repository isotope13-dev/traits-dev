# An installer that names no product or vendor -- its summary Title and Author
# are random hex tokens -- and whose payload includes the stock AutoHotkey
# interpreter. A packaged AutoHotkey application carries its own identity;
# a randomized wrapper around a bare interpreter is staging a script for the
# interpreter to run, with the installer chosen to make it look like setup.
# The dropped script itself is judged by the AutoHotkey loader rules.
defaults:
  platforms: [windows]
  for: [msi, cab, pe]
  attack: T1036.005,T1218.007

composite_rules:
  - id: hex-identity-msi-ships-autohotkey-runtime
    desc: Anonymous hex-named MSI ships AutoHotkey runtime
    crit: suspicious
    conf: 0.92
    scope: outer
    all:
      - id: metadata/document/office/properties::msi-summary-hex-token-identity
      - id: well-known/tool/sysadmin/autohotkey::autohotkey-runtime-version
