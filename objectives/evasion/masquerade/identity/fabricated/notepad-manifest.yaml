defaults:
  platforms: [windows]
  for: [pe]
  attack: T1036

traits:
  - id: microsoft-notepad-shell-manifest-name
    desc: Microsoft notepad shell manifest claim
    crit: component
    conf: 0.99
    if:
      type: value
      path: pe.manifest.assembly_identity.name
      exact: Microsoft.Windows.Shell.notepad
composite_rules:
  - id: opaque-notepad-shell-masquerade
    desc: Opaque PE fabricates Microsoft notepad identity
    crit: hostile
    conf: 0.99
    attack: T1036,T1027.002
    all:
      - id: microsoft-notepad-shell-manifest-name
      - id: objectives/evasion/masquerade/versioninfo::random-alnum-versioninfo-token-cluster
      - id: metadata/binary/metrics/structural::pe-code-entropy-78
      - id: metadata/binary/layout::pe-no-signature-record
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/vendor::microsoft-corp-versioninfo
      - id: metadata/binary/installer/family/
