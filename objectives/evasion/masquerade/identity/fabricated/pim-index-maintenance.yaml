defaults:
  platforms: [windows]
  for: [pe, dll]
  attack: T1036.005

traits:
  - id: pim-index-maintenance-description-claim
    desc: Windows contacts-indexing service description
    crit: notable
    conf: 0.98
    if:
      type: value
      path: pe.version.description
      regex: '(?i)^Service responsible for contacts indexing and other telephon'

  - id: upx-version-product-claim
    desc: VERSIONINFO claims a UPX product name
    crit: notable
    conf: 0.9
    if:
      type: value
      path: pe.version.product_name
      regex: '(?i)^\s*upx v[0-9]+\.[0-9]+\s*$'

composite_rules:
  - id: unsigned-pim-index-maintenance-inno-masquerade
    desc: Unsigned Inno overlay claims the Windows contact service identity
    crit: hostile
    conf: 0.995
    ref: sha256:f7a110efa09467da041b7abbd4a0cbbe67e804e78630af22fa8564038576a856
    attack: T1036.005,T1027.009
    all:
      - id: pim-index-maintenance-description-claim
      - id: upx-version-product-claim
      - id: metadata/binary/installer/family::inno-delphi-installer-foundation
      - id: metadata/binary/layout::overlay-over-90pct
      - id: metadata/binary/layout::pe-no-signature-record
    unless:
      - id: metadata/signed/platform/
