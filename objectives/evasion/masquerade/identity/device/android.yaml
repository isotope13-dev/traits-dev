defaults:
  platforms: [android, unix]
  for: [elf, apk, python, javascript, java, kotlin, c, cpp]
  attack: T1036

composite_rules:
  - id: android-phone-profile-spoofing
    desc: Android TV box spoofs phone build identity
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/os/sysinfo/platform/mobile::android-chipset-property-clearing
    any:
      - id: micro-behaviors/os/sysinfo/platform/mobile::android-phone-profile-property-cluster
