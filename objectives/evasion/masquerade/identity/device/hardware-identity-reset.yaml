# A hardware-ID reset rewrites the machine GUID and randomizes adapter MAC
# addresses so the host presents a new identity. Each phrase alone can appear in
# ordinary settings or support text; the rule needs the GUID rewrite and the
# address randomization in one program.
# ATT&CK: T1036 (Masquerading)
defaults:
  platforms: [windows]
  for: [pe, powershell]
  attack: T1036

traits:
  - id: machineguid-rewrite-text
    desc: Text reports a MachineGuid rewrite
    crit: notable
    conf: 0.92
    if:
      type: text
      regex: '(?i)machineguid[^\r\n]{0,30}rewrit'

  - id: mac-randomization-text
    desc: Text names MAC address randomization
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)mac randomi[sz]ation'

  - id: mac-spoofer-exe-reference
    desc: References mac.exe MAC spoofer tool
    crit: notable
    conf: 0.9
    for: [pe, batch, powershell]
    if:
      type: text
      regex: '(?i)(^|[\\/.\s"])mac\.exe\b'

composite_rules:
  - id: hardware-identity-reset
    desc: Rewrites MachineGuid and randomizes adapter MAC addresses
    crit: hostile
    conf: 0.88
    scope: file
    all:
      - id: machineguid-rewrite-text
      - id: mac-randomization-text

  - id: multi-tool-tpm-mac-spoofer
    desc: Orchestrates MAC and TPM spoofing tools
    crit: hostile
    conf: 0.95
    for: [pe]
    scope: file
    all:
      - id: mac-spoofer-exe-reference
      - id: objectives/evasion/security-bypass/host-controls::tpm-spoof-executable-reference
      - id: micro-behaviors/process/create/subprocess/reference::binary-process-execution
