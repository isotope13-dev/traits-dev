# Hardware-ID spoofing claims are meaningful evidence of an identity-evasion
# utility, while the underlying purpose can still be legitimate testing.
defaults:
  for: [pe]
  platforms: [windows]
  arch: [x86-64]

traits:
  - id: claims-volume-serial-spoofing
    desc: Claims to spoof volume serials
    crit: notable
    conf: 0.95
    if:
      type: text
      substr: 'Spoofing volume serials'

  - id: claims-mac-address-spoofing
    desc: Claims to spoof MAC addresses
    crit: notable
    conf: 0.95
    if:
      type: text
      substr: 'Spoofing MAC addresses'

composite_rules:
  - id: volume-and-mac-id-spoofer
    desc: Advertises volume and MAC spoofing
    crit: suspicious
    conf: 0.94
    all:
      - id: claims-volume-serial-spoofing
      - id: claims-mac-address-spoofing

  - id: archive-contains-hwid-spoofer
    desc: Archive contains hardware identity spoofer
    crit: suspicious
    conf: 0.94
    scope: archive
    for: [zip, pe]
    all:
      - id: claims-volume-serial-spoofing
      - id: claims-mac-address-spoofing
