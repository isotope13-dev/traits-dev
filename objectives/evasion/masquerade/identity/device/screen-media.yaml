# Device-identity deception supplies abuse context; screen and endpoint APIs
# alone remain a neutral co-occurrence in communications/websocket/media.
defaults:
  platforms: [android]
  for: [java, kotlin, android_apk, zip]
  attack: T1036

composite_rules:
- id: android-phone-spoofing-with-screen-media-apis
  desc: Phone spoofing with screen-media APIs
  crit: hostile
  conf: 0.98
  all:
  - id: objectives/evasion/masquerade/identity/device::android-phone-profile-spoofing
  - id: micro-behaviors/communications/websocket/endpoints::android-webrtc-screen-websocket-api-profile
