defaults:
  platforms: [windows]
  for: [oledoc]

composite_rules:
  - id: realtek-audio-msbuild-loader-masquerade
    desc: Realtek-themed MSI conceals a renamed MSBuild project loader
    crit: hostile
    conf: 0.99
    attack: T1036,T1127.001
    scope: file
    all:
      - id: metadata/package/files/msi::realtek-hd-audio-manager-subject
      - id: objectives/command-and-control/dropper/execution/installer::msi-renamed-msbuild-project-loader
      - id: metadata/binary/installer/custom-action::msi-nancy-145-library
