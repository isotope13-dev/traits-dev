# A Google crash-handler build never carries a WinRAR SFX manifest. Both
# identities in one unsigned, elevation-demanding PE mean resources were
# transplanted onto a trojanized build (2016 Petya dropper).
defaults:
  platforms: [windows]
  for: [pe]
  attack: T1036.005

composite_rules:
  - id: google-pdb-winrar-sfx-manifest-elevation
    desc: Unsigned Google crash-handler PDB with WinRAR SFX manifest
    crit: hostile
    conf: 0.95
    all:
      - id: metadata/binary/debug::google-crash-handler-pdb-stem
      - id: metadata/build/manifest::winrar-sfx-manifest-identity
      - id: metadata/build/manifest::pe-requires-admin
      - id: metadata/signature/absent::unsigned-missing-signature-record
    unless:
      - id: metadata/signature/verified/platform/
