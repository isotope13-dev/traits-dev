defaults:
  platforms:
  - macos
  for:
  - macho
  attack: T1036.005
composite_rules:
- id: adobe-brand-adhoc-macho
  desc: Ad-hoc signed Mach-O claims Adobe product identity
  crit: hostile
  conf: 0.98
  unless:
  - id: metadata/signature/verified/platform::apple
  - id: metadata/signature/verified/developer/
  all:
  - id: metadata/signature/code-directory::adobe-identifier-prefix
  - id: metadata/signature/ad-hoc::adhoc
