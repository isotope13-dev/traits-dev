# Adobe-branded binaries without Adobe's signature. Genuine Adobe
# components on macOS ship Developer-ID signed with a registered Team ID;
# an ad-hoc signed Mach-O claiming Adobe product identity is a masquerading
# malware installer.
defaults:
  platforms: [macos]
  for: [macho]
  attack: T1036.005

composite_rules:
  - id: adobe-brand-adhoc-macho
    desc: Ad-hoc signed Mach-O claims Adobe product identity
    crit: hostile
    conf: 0.98
    unless:
      - id: metadata/signed/platform::apple
      - id: metadata/signed/trust-level::developer-team-identifier
      - id: well-known/app/
      - id: well-known/lib/
    all:
      - id: metadata/binary/signing::adobe-identifier-prefix
      - id: metadata/signed/trust-level::adhoc
