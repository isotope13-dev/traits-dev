defaults:
  platforms: [windows]
  for: [pe]
  attack: T1105
  mbc: B0023
composite_rules:
  - id: mpress-360-cert-stuffed-dropper
    desc: MPRESS PE mimics 360 tool with cert-stuffed overlay
    crit: hostile
    conf: 0.96
    attack: T1027.002,T1036.005
    size_min: 1048576
    all:
      - id: metadata/binary/section/layout::mpress-two-section-layout
      - id: well-known/app/utility/360-file-guard::360-company-field
      - id: metadata/binary/layout/ratio::overlay-over-90pct
      - id: metadata/binary/layout/checksum::cert-data-zeroed-checksum
      - id: metadata/binary/layout/size::large-overlay-1mb
    unless:
      - id: metadata/signature/verified/
      - id: well-known/app/utility/360-file-guard::360-file-guard-identity

