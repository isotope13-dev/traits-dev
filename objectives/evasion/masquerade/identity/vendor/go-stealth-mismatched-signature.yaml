defaults:
  platforms: [windows]
  for: [pe]
composite_rules:
  - id: vendor-mismatch-go-stealth-payload-indicators
    desc: Mismatched vendor signature with Go stealth and payload indicators
    crit: hostile
    conf: 0.96
    all:
      - id: metadata/signature/certificate/integrity::vendor-signature-digest-mismatch
      - id: metadata/binary/symbols/name/analysis::stealth-check-runner
      - id: objectives/privilege-escalation/elevation-control/prompt-escalation::go-default-uac-relaunch-function
      - id: micro-behaviors/data/string/container::payload-container-name-text
