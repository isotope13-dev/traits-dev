# An unsigned binary claiming NVIDIA identity warrants review, but the
# claim alone does not establish sideloading or malicious modification.
defaults:
  platforms: [windows]
  for: [pe, dll]
  attack: T1036

composite_rules:
  - id: nvidia-brand-unsigned-binary
    desc: Unsigned PE claims NVIDIA product identity
    crit: suspicious
    conf: 0.97
    unless:
      - id: well-known/lib/platform/wine::wine-builtin-dll-marker
      # CUDA's assembler ships unsigned in NVIDIA's own pip wheels.
      - id: well-known/lib/ai/cuda::cuda-ptx-assembler
    all:
      - id: metadata/vendor/identity::nvidia-corp-version-claim
      - id: metadata/signature/absent::unsigned-missing-signature-record
