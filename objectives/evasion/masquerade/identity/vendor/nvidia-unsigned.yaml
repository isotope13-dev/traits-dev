# NVIDIA-branded binaries without NVIDIA's signature. Genuine NVIDIA
# driver and UI components ship Authenticode-signed; an unsigned binary
# carrying NVIDIA's version-resource identity is a sideloading clone or a
# patched copy of a signed component (signature stripped after
# modification), named so a victim process loads it from its own
# directory.
defaults:
  platforms: [windows]
  for: [pe, dll]
  attack: T1036

composite_rules:
  - id: nvidia-brand-unsigned-binary
    desc: Unsigned PE claims NVIDIA product identity
    crit: hostile
    conf: 0.97
    unless:
      - id: metadata/package/testing/
      - id: well-known/lib/platform/wine::wine-builtin-dll-marker
      - id: "metadata/file/naming::test-directory-component"
    all:
      - id: metadata/binary/vendor::nvidia-corp-version-claim
      - id: metadata/signed/trust-level::unsigned-missing-signature-record
