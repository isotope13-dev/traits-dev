defaults:
  platforms: [windows]
  for: [pe]

composite_rules:
  - id: importless-office-component-cert-marker
    desc: Importless Office component with Microsoft certificate metadata
    crit: notable
    conf: 0.94
    all:
      - id: metadata/binary/metrics/structural::no-imports
      - id: objectives/evasion/masquerade/brand/wrapper::office-2016-component-claim
      - id: metadata/binary/vendor::microsoft-corp-marker-cert
  - id: importless-microsoft-recognized-marker
    desc: Recognized Microsoft importless PE marker
    crit: notable
    conf: 0.9
    all:
      - id: metadata/binary/metrics/structural::no-imports
    any:
      - id: metadata/signed/trust-level::signer-evidence-present
      - id: metadata/signed/platform::microsoft
      - id: metadata/signed/leaf::microsoft-corporation
      - id: metadata/file/extension/identity::dotnet-native-image
      - id: metadata/file/extension/identity::msstyles
      - id: metadata/binary/resource::resource-only-dll
      - id: well-known/app/utility/installer::startallback-installer
      - id: metadata/binary/linking/api-set::api-set-forwarder-dll
      - id: metadata/binary/framework::dotnet-metadata
      - id: well-known/lib/platform/wine::wine-runtime-component
      - id: importless-office-component-cert-marker
      - id: well-known/app/enterprise/microsoft-office-c2r::microsoft-office-c2r-common
  # `importless-microsoft-recognized-marker` above enumerates the importless
  # Microsoft PEs that are simply what they say they are -- signed images,
  # resource-only DLLs, API-set forwarders and managed assemblies -- but nothing
  # referenced it, so the carve-out never applied. A .NET assembly has no import
  # table by construction: TheBrain's Electron bundle ships 220 of them
  # (`Microsoft.AspNetCore.*.dll`), each carrying Microsoft's own VERSIONINFO
  # because Microsoft published them.
  - id: importless-microsoft-masquerade
    desc: Importless PE claiming to be Microsoft Corporation
    crit: suspicious
    conf: 0.95
    all:
      - id: metadata/binary/vendor::microsoft-corp-marker
      - id: metadata/binary/metrics/structural::no-imports
    unless:
      # Naming the reason directly rather than the whole aggregator above,
      # which expands past the suppression budget: a managed assembly has no
      # import table because the CLR resolves its references, so "importless"
      # says nothing about it.
      - id: metadata/binary/framework::dotnet-metadata
