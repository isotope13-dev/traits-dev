defaults:
  platforms: [windows]
  for: [pe]

composite_rules:
  - id: importless-microsoft-masquerade
    desc: Importless PE claiming to be Microsoft Corporation
    crit: suspicious
    conf: 0.95
    all:
      - id: metadata/binary/vendor::microsoft-corp-marker
      - id: metadata/binary/symbols/count::no-imports
    unless:
      # An API-set forwarder stub has no imports because it only forwards, and it
      # carries Microsoft's name because it reimplements a Microsoft contract;
      # Wine's builtin DLLs (msstyles, type libraries, lz32) are the same case.
      # Both are already listed in `importless-microsoft-recognized-marker`,
      # which expands past the suppression budget.
      - id: well-known/lib/platform/wine::wine-builtin-dll-marker
      - id: metadata/binary/linking/api-set::api-set-forwarder-dll
      # The basename form above only matches on-disk api-ms-win-*.dll names, so
      # carved/embedded stubs (named `embedded:pe:apisetstub@...`, e.g. the 17
      # ApiSet forwarders inside GitVersion's GitVersion.exe) need the content
      # identity: Microsoft's own stub description.
      - id: metadata/binary/vendor::apiset-stub
      # Naming the reason directly rather than the whole aggregator above,
      # which expands past the suppression budget: a managed assembly has no
      # import table because the CLR resolves its references, so "importless"
      # says nothing about it. The parsed CLR header, not the raw `BSJB`
      # scan: that search is capped short of a large .text, so WPF's 4 MB
      # PresentationCore.dll never showed its metadata root.
      - id: metadata/binary/framework::clr-runtime-header
      # MSTest 2010's own Microsoft.VisualStudio.QualityTools.LoadTestExcelCommon.tlb
      # carries genuine Microsoft VERSIONINFO on a COM type library, which
      # has no import table by construction.
      - id: metadata/file/extension/typelib::tlb
      # Resource-only PEs have neither executable code nor imports. Their
      # Microsoft VERSIONINFO identifies packaged system data, not a binary
      # impersonating Microsoft.
      - id: metadata/binary/section/ratio::pe-no-executable-sections
      # EFI applications run under UEFI firmware without an OS loader and have
      # no PE import table by specification. When signed by Microsoft's UEFI CA
      # (as with shim.efi), the Microsoft identity is authentic.
      - id: metadata/binary/header/characteristics::efi-pe-subsystem
      - id: metadata/package/testing/
      - id: "metadata/file/naming::test-directory-component"
