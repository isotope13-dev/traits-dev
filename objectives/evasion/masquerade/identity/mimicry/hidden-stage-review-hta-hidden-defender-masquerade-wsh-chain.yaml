defaults:
  platforms: [windows]
  for: [html, text, data]

composite_rules:
- id: hta-hidden-defender-masquerade-wsh-chain
  desc: HTA hides UI while chaining Shell.Run launches
  crit: hostile
  conf: 0.96
  attack: T1059.005,T1036.005,T1204.002
  for:
    - html
  all:
    - id: metadata/file/format/markup::hta-application-element
    - id: metadata/file/format/markup::hta-applicationname-defender-masquerade
    - id: micro-behaviors/os/com/automation::wscript-shell-literal
    - id: micro-behaviors/data/control-flow/dispatch/run::wscript-shell-run-statement
    - id: micro-behaviors/ui/window/visibility::display-none-style
