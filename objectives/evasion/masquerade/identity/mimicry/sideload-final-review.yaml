defaults:
  platforms:
    - windows
  for: [scripts, binaries]

composite_rules:
  - id: broadcom-hoststorage-resource-carrier
    desc: Broadcom Host Storage unsigned resource carrier
    crit: hostile
    conf: 0.99
    for: [pe]
    all:
      - id: well-known/app/security/broadcom-credential-vault::host-storage-original-filename
      - id: metadata/vendor/identity::broadcom-company-version-claim
      - id: well-known/app/security/broadcom-credential-vault::credential-vault-interface-dll-reference
      - id: metadata/signature/absent::unsigned
      - id: metadata/binary/section/permission::executable-rsrc-section
      - id: metadata/binary/resource/size::oversized-rsrc
    any:
      - id: well-known/app/security/broadcom-credential-vault::host-storage-pdb-path
      - id: well-known/app/security/broadcom-credential-vault::credential-vault-service-name
