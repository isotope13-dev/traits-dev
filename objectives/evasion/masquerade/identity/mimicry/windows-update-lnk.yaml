# LNK lure text that pretends to be Windows automatic updates (French UI copy)
# while the shortcut target is an unrelated payload.
defaults:
  platforms: [windows]
  for: [lnk]
  attack: T1036.005,T1204.002

traits:
  - id: french-auto-update-lure
    desc: French automatic-updates lure text
    crit: notable
    conf: 0.96
    if:
      type: hex
      pattern: "4D 00 69 00 73 00 65 00 73 00 20 00 E0 00 20 00 6A 00 6F 00 75 00 72"

  - id: french-windows-config-lure
    desc: French Windows Update config lure
    crit: notable
    conf: 0.96
    if:
      type: hex
      pattern: "43 00 6F 00 6E 00 66 00 69 00 67 00 75 00 72 00 65 00 72 00 20 00 57 00 69 00 6E 00 64 00 6F 00 77 00 73"

composite_rules:
  - id: windows-update-lure-root-dll-lnk
    desc: Update-lure LNK targets root DLL
    crit: hostile
    conf: 0.98
    all:
      - id: french-auto-update-lure
      - id: french-windows-config-lure
      - id: micro-behaviors/fs/traversal/parent::utf16-drive-root-dll
