# Reviewed native staging evidence; descriptions name the observed mechanism.
defaults:
  platforms:
  - windows
  for:
  - pe
  - dll
composite_rules:
- id: windowsupdate-embedded-resolver-clues
  desc: WindowsUpdate path, embedded PE and resolver
  crit: hostile
  conf: 0.97
  all:
  - id: metadata/binary/layout/embedded::pe-embedded
  - id: micro-behaviors/os/random/generator::rtlgenrandom-name-pair-with-resolver
  - id: objectives/evasion/masquerade/identity/mimicry::non-microsoft-windowsupdate-path
  any:
  - id: metadata/build/manifest::require-administrator
  - id: metadata/binary/resource/entropy::high-entropy-rsrc
  - id: metadata/binary/layout/tls::pe-multiple-tls-callbacks
  attack: T1036.005
