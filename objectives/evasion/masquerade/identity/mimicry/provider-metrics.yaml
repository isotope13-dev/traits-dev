defaults:
  for: [elf, macho, pe]
  platforms: [linux, macos, windows]
composite_rules:
  - id: provider-telemetry-covers-shell-payload
    desc: Provider telemetry URL masks shell payload staging in a plugin
    crit: hostile
    conf: 0.99
    attack: T1036
    all:
      - id: micro-behaviors/communications/grpc::terraform-provider-server
      - id: micro-behaviors/communications/http/url/path::provider-grpc-metrics-download-url
      - id: micro-behaviors/process/create/local-exec::go-stage-chmod-start-diagnostics
      - id: micro-behaviors/process/create/local-exec::go-shell-command-packed-arguments
