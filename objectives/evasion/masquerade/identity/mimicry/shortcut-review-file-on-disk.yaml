defaults:
  platforms: [windows]
  for: [lnk]
  attack: T1204.002

composite_rules:
  - id: lnk-downloads-desktop-ini-exe
    desc: LNK executes desktop.ini.exe from Downloads
    crit: hostile
    conf: 0.97
    all:
      - id: metadata/file/profile/path-reference::lnk-target-desktop-ini-exe
      - id: metadata/file/profile/path-reference::lnk-target-downloads-exe
  - id: lnk-traversal-programdata-system-name
    desc: LNK traversal and ProgramData system name
    crit: hostile
    conf: 0.97
    all:
      - id: micro-behaviors/fs/path/traversal::lnk-relative-deep-parent-chain
      - id: metadata/file/profile/path-reference::lnk-text-programdata-system-name
