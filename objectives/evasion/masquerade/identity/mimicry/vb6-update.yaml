# A Winsock-capable program carries a Microsoft update installation claim.
defaults:
  platforms:
  - windows
  for:
  - pe
composite_rules:
- id: vb6-winsock-update-lure
  desc: Winsock name with Microsoft update claim
  for:
  - pe
  - static-lib
  - dll
  all:
  - id: micro-behaviors/communications/socket/mfc::vb6-mswinsck-near-ocx
  - id: micro-behaviors/data/string/message::vb6-microsoft-update-lure
  crit: suspicious
  attack: T1036.005
