defaults:
  for: [pe]
  platforms: [windows]
  attack: T1036.005
  mbc: F0004
traits:
- id: mashup-runtime-product
  desc: Microsoft Mashup Runtime product
  crit: notable
  conf: 0.97
  if:
    type: text
    exact: Microsoft® Mashup Runtime
    section: .rsrc
- id: mashup-container-filename
  desc: Mashup container filename claim
  crit: notable
  conf: 0.96
  if:
    type: text
    exact: Microsoft.Mashup.Container.NetFX45.exe
- id: mashup-container-exe-filename
  desc: Mashup container executable claim
  crit: notable
  conf: 0.96
  if:
    type: text
    exact: Microsoft.Mashup.Container.exe
- id: onenotem-filename
  desc: OneNoteM filename claim
  crit: notable
  conf: 0.96
  if:
    type: text
    exact: OneNoteM.exe
- id: systemsettings-filename
  desc: SystemSettings.exe filename claim
  crit: notable
  conf: 0.96
  if:
    type: text
    exact: SystemSettings.exe
    section: .rsrc
- id: alibaba-company-name
  desc: Alibaba company name claim
  crit: notable
  conf: 0.98
  if:
    type: text
    exact: Alibaba software (Shanghai) Corporation.
    section: .rsrc
- id: aliwangwang-description
  desc: AliWangWang product description
  crit: notable
  conf: 0.98
  if:
    type: text
    exact: AliWangWang
    section: .rsrc
- id: aliim-original-filename
  desc: AliIM original filename claim
  crit: notable
  conf: 0.98
  if:
    type: text
    exact: AliIM.exe
    section: .rsrc
- id: ali-taskbar-notifier-class
  desc: Ali taskbar notifier UI class
  crit: notable
  conf: 0.94
  if:
    type: text
    exact: uCTaskbarNotifier
composite_rules:
- id: unsigned-mashup-runtime-masquerade
  desc: Unsigned Microsoft Mashup runtime masquerade
  crit: suspicious
  conf: 0.96
  all:
  - id: metadata/binary/vendor::microsoft-corp-versioninfo
  any:
  - id: mashup-runtime-product
  - id: mashup-container-filename
  - id: mashup-container-exe-filename
  unless:
  - id: metadata/signed/platform/
- id: onenote-screenclip-masquerade
  desc: OneNote screen capture tool masquerade
  crit: suspicious
  conf: 0.95
  all:
  - id: onenotem-filename
  any:
  - id: metadata/binary/debug::onenotem-pdb
  - id: micro-behaviors/hardware/display/screen::gdi-bitmap-transfer-primitives
  unless:
  - id: metadata/signed/platform/
- id: firefox-helper-masquerade
  desc: Adobe WOW helper filename paired with Firefox application markers
  crit: suspicious
  conf: 0.95
  all:
  - id: well-known/app/productivity/adobe-reader::wow-helper-filename-reference
  - id: micro-behaviors/fs/path/application/executable::browser-apps-firefox
  unless:
  - id: metadata/signed/unknown::mozilla-corporation
  - id: metadata/signed/platform::adobe
- id: unsigned-aliwangwang-masquerade
  desc: Unsigned Alibaba IM masquerade
  crit: suspicious
  conf: 0.99
  all:
  - id: metadata/binary/resource/identity::pe-version-resource
  any:
  - id: alibaba-company-name
  - id: aliwangwang-description
  - id: aliim-original-filename
  - id: ali-taskbar-notifier-class
  needs: 3
  unless:
  - id: metadata/signed/platform
  - id: metadata/signed/developer
  - id: metadata/signed/certificate
- id: aliwangwang-admin-manifest
  desc: Alibaba IM masquerade with admin manifest
  crit: suspicious
  conf: 0.98
  all:
  - id: unsigned-aliwangwang-masquerade
  - id: metadata/build/manifest::require-administrator
- id: aliwangwang-admin-display-control
  desc: Alibaba IM masquerade with display control
  crit: suspicious
  conf: 0.97
  all:
  - id: aliwangwang-admin-manifest
  any:
  - id: micro-behaviors/ui/window/region::window-region-shaping
  - id: micro-behaviors/ui/window/region::get-window-dc
  - id: micro-behaviors/ui/controls/widget::system-parameters-info
  - id: micro-behaviors/hardware/display/screen::gdi-bitblt
  needs: 2
- id: aliwangwang-admin-screen-capture
  desc: Alibaba IM masquerade with admin screen capture
  crit: hostile
  conf: 0.99
  all:
  - id: aliwangwang-admin-manifest
  - id: micro-behaviors/hardware/display/screen::gdi-getdibits
  any:
  - id: micro-behaviors/hardware/display/screen::gdi-bitblt
  - id: micro-behaviors/ui/window/region::get-window-dc
- id: aliwangwang-taskbar-admin-overlay-decoy
  desc: Alibaba taskbar admin overlay capture decoy
  crit: hostile
  conf: 0.997
  all:
  - id: aliwangwang-admin-display-control
  - id: aliwangwang-admin-screen-capture
  - id: ali-taskbar-notifier-class
- id: aliwangwang-branded-taskbar-admin-decoy
  desc: Branded Alibaba taskbar admin capture decoy
  crit: hostile
  conf: 0.998
  all:
  - id: unsigned-aliwangwang-masquerade
  - id: alibaba-company-name
  - id: aliwangwang-description
  - id: aliim-original-filename
  - id: ali-taskbar-notifier-class
  - id: aliwangwang-admin-display-control
  - id: aliwangwang-admin-screen-capture
- id: aliwangwang-taskbar-admin-capture-cluster
  desc: Alibaba taskbar IM admin capture cluster
  crit: hostile
  conf: 0.995
  all:
  - id: unsigned-aliwangwang-masquerade
  - id: ali-taskbar-notifier-class
  - id: metadata/build/manifest::require-administrator
  - id: micro-behaviors/hardware/display/screen::gdi-getdibits
  - id: micro-behaviors/ui/window/region::get-window-dc
  any:
  - id: micro-behaviors/ui/window/region::window-region-shaping
  - id: micro-behaviors/ui/controls/widget::system-parameters-info
- id: aliwangwang-taskbar-overlay-screen-capture
  desc: Alibaba taskbar overlay admin capture decoy
  crit: hostile
  conf: 0.998
  all:
  - id: metadata/binary/resource/identity::pe-version-resource
  - id: alibaba-company-name
  - id: aliwangwang-description
  - id: aliim-original-filename
  - id: ali-taskbar-notifier-class
  - id: metadata/build/manifest::require-administrator
  - id: micro-behaviors/hardware/display/screen::gdi-getdibits
  - id: micro-behaviors/ui/window/region::get-window-dc
  - id: micro-behaviors/ui/window/region::window-region-shaping
  - id: micro-behaviors/ui/controls/widget::system-parameters-info
  unless:
  - id: metadata/signed/platform
  - id: metadata/signed/developer
  - id: metadata/signed/certificate
- id: aliwangwang-branded-windowdc-overlay-capture
  desc: Branded Alibaba window DC overlay capture decoy
  crit: hostile
  conf: 0.999
  all:
  - id: unsigned-aliwangwang-masquerade
  - id: alibaba-company-name
  - id: aliwangwang-description
  - id: aliim-original-filename
  - id: ali-taskbar-notifier-class
  - id: metadata/build/manifest::require-administrator
  - id: micro-behaviors/hardware/display/screen::gdi-getdibits
  - id: micro-behaviors/ui/window/region::get-window-dc
  - id: micro-behaviors/ui/window/region::window-region-shaping
- id: unsigned-systemsettings-masquerade
  desc: Unsigned binary claiming SystemSettings.exe identity
  crit: suspicious
  conf: 0.96
  all:
  - id: systemsettings-filename
  - id: metadata/binary/vendor::microsoft-corp-versioninfo
  - id: metadata/signed/trust-level::unsigned
  unless:
  - id: metadata/signed/platform/
- id: unsigned-panasonic-notification-masquerade
  desc: Unsigned Panasonic PC Notification masquerade
  crit: suspicious
  conf: 0.9
  needs: 2
  any:
  - id: metadata/binary/provenance/version-info::panasonic-pc-notification-product
  - id: metadata/binary/provenance/version-info::panasonic-connect-company-claim
  - id: metadata/binary/provenance/version-info::ppcnotif-provider-original-filename
  unless:
  - id: metadata/signed/platform/
  - id: metadata/signed/developer/
  - id: metadata/signed/certificate/
# Mutable OEM claims and file geometry alone do not prove a hostile loader.
# Require a code-derived staging leg; memory-only variants also require
# concealed payload storage or an entry-code decoder. No family is inferred.
- id: panasonic-notification-padded-loader
  desc: Padded loader impersonating Panasonic utility
  crit: hostile
  conf: 0.95
  all:
  - id: unsigned-panasonic-notification-masquerade
  - id: metadata/binary/section/layout::dominant-low-entropy-writable-data-layout
  - id: micro-behaviors/process/inject/runtime/call::copy-loop-indirect-jump-x64
- id: panasonic-notification-decoy-stuffed-loader
  desc: Decoy-stuffed Panasonic notification masquerade
  crit: hostile
  conf: 0.95
  all:
  - id: unsigned-panasonic-notification-masquerade
  - id: metadata/binary/section/prose::extreme-string-count
  - id: micro-behaviors/process/inject/runtime/call::copy-loop-indirect-jump-x64
- for:
  - pe
  - dll
  attack: T1036.005,T1620
  id: panasonic-masquerade-rwx-stager
  desc: Panasonic masquerade with x64 RWX allocation
  crit: hostile
  conf: 0.95
  arch:
  - x86-64
  all:
  - id: objectives/evasion/masquerade/identity/mimicry::unsigned-panasonic-notification-masquerade
  - id: micro-behaviors/mem/alloc/executable::virtualalloc-rwx-commit-x64
  - id: micro-behaviors/process/inject/runtime/call::copy-loop-indirect-jump-x64
  any:
  - id: metadata/binary/section/layout::dominant-low-entropy-writable-data-layout
  - id: objectives/anti-static/pack/runtime::return-address-rotate-xor-stage-decoder
- attack: T1036.005,T1620
  id: panasonic-masquerade-shellcode-loader
  desc: Panasonic masquerade with manual code loader
  crit: hostile
  conf: 0.95
  for:
  - pe
  - dll
  all:
  - id: objectives/evasion/masquerade/identity/mimicry::unsigned-panasonic-notification-masquerade
  - id: micro-behaviors/mem/copy::lodsd-stosd-loop-x64
  - id: micro-behaviors/process/inject/runtime/call::copy-loop-indirect-jump-x64
  any:
  - id: metadata/binary/section/layout::dominant-low-entropy-writable-data-layout
  - id: objectives/anti-static/pack/runtime::return-address-rotate-xor-stage-decoder
