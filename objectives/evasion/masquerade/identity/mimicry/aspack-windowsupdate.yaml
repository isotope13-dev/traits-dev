# An unsigned ASPack-packed binary posing as Microsoft's updater while
# demanding elevation. Sibling of upx-windowsupdate.yaml for the ASPack
# packer: the lure lives in the version resource (OriginalFilename
# WindowsUpdate.EXE) and the manifest demands requireAdministrator, but
# ASPack relocates both into its own section, so the .rsrc-scoped
# vendor/version atoms go blind here. These matchers are deliberately
# unscoped; the composite carries the packer, elevation, loader-shape and
# unsigned legs, so the verdict never rests on a renameable string alone.
defaults:
  platforms:
  - windows
  for:
  - pe
  attack: T1036.005,T1548.002

traits:
  - id: windowsupdate-exe-version-filename
    desc: WindowsUpdate.EXE filename string
    crit: notable
    conf: 0.95
    if:
      type: text
      exact: WindowsUpdate.EXE

composite_rules:
  - id: aspack-windowsupdate-elevated-masquerade
    desc: ASPack-packed fake WindowsUpdate demands admin
    crit: hostile
    conf: 0.97
    all:
      - id: metadata/build/protector::aspack-name-reference
      - id: metadata/signed/trust-level::unsigned-missing-signature-record
      - id: metadata/build/manifest::require-administrator-level-attribute
      - id: micro-behaviors/dylib/lookup::sparse-pe-dynamic-linking
      - id: metadata/file/entropy::high-overall-entropy-70
    any:
      - id: windowsupdate-exe-version-filename
      - id: objectives/evasion/masquerade/identity/mimicry::appdata-windowsupdate-executable-reference
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/installer/family/
      - id: well-known/app/
