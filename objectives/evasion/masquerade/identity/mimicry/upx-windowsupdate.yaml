defaults:
  for:
  - pe
  platforms:
  - windows
composite_rules:
- id: upx-windowsupdate-path-profile
  desc: WindowsUpdate path with UPX packing clues
  crit: suspicious
  conf: 0.97
  attack: T1036
  all:
  - id: metadata/binary/section/entropy::compact-rwx-upx1-section
  - id: objectives/anti-static/obfuscation/payload/import::minimal-pe-dynamic-load
  - id: objectives/evasion/masquerade/identity/mimicry::non-microsoft-windowsupdate-path
  any:
  - id: objectives/anti-static/obfuscation/encoding/content::encoded-mozilla-ua
  - id: micro-behaviors/dylib/load/runtime::load-library-a-string-no-import
  - id: metadata/binary/section/ratio::dominant-section
  needs: 2
  unless:
  - id: metadata/package/versioning/scheme::pe-version-resource
  - id: metadata/signed/platform/
