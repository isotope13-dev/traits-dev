defaults:
  for:
  - pe
  - batch
  platforms:
  - windows
  attack: T1036.005
traits:
- id: batch-update-assistant-title
  desc: Batch title claims Update Assistant
  crit: notable
  conf: 0.93
  for: [batch]
  if:
    type: text
    regex: '(?im)^\s*title\s+windows\s+update\s+assistant\b'
- id: windows-update-assistant-desc
  desc: Windows Update Assistant description
  crit: notable
  conf: 0.96
  if:
    type: text
    exact: Windows Update Assistant
    section: .rsrc
- id: rundll32-original-filename
  desc: rundll32.exe filename claim
  crit: notable
  conf: 0.96
  if:
    type: text
    exact: rundll32.exe
    section: .rsrc
- id: windowsupdate-identifier-reference
  desc: WindowsUpdate identifier reference
  crit: notable
  conf: 0.84
  if:
    type: text
    exact: WindowsUpdate
    section: .text
# NOTE: the generic ProgramData/Roaming path fragments used to live here as
# `windowsupdate-appdata-path--rx-3/--rx-4`. A bare "ProgramData" substring is
# a neutral filesystem capability, not a masquerade signal: it fired this
# objective's path finding on every binary that stages under ProgramData and
# duplicated the canonical `micro-behaviors/fs/path/system::programdata-
# directory-path` matcher under a second ML feature. The composite below now
# references the canonical micro-behavior traits instead.
- id: non-microsoft-windowsupdate-filename
  desc: Non-Microsoft WindowsUpdate filename
  crit: suspicious
  conf: 0.91
  if:
    type: path
    basename: true
    regex: '(?i)^WindowsUpdate(\.exe)?$'
  unless:
  - id: metadata/signed/platform/
  - id: well-known/app/system/iobit::iobit-signed-component-context
composite_rules:
- id: batch-update-lure-remote-powershell
  desc: Windows Update lure fronts a remote PowerShell script stage
  crit: hostile
  conf: 0.99
  attack: T1036.005,T1105,T1059.001
  for: [batch]
  all:
  - id: batch-update-assistant-title
  - id: objectives/command-and-control/dropper/delivery/execute-download::batch-powershell-remote-script-stage
- id: windows-update-assistant-rundll32
  for: [pe]
  desc: Windows updater masquerade identity
  crit: suspicious
  conf: 0.97
  all:
  - id: windows-update-assistant-desc
  - id: rundll32-original-filename
  - id: metadata/binary/vendor::microsoft-corp-versioninfo
  unless:
  - id: metadata/signed/platform/
- id: non-microsoft-windowsupdate-path
  desc: WindowsUpdate-named path in user-writable staging area
  crit: suspicious
  conf: 0.93
  all:
  - id: windowsupdate-appdata-path
  unless:
  - id: metadata/signed/platform/
  - id: metadata/binary/vendor::microsoft-corp-versioninfo
  - id: metadata/build/recognized-contexts::benign-build-tooling-context
  - id: metadata/file/string/application-name::pe-product-name-7zip
  - id: metadata/build/generated::winmd-metadata
  - id: well-known/app/system/iobit::iobit-signed-component-context
- id: windowsupdate-appdata-path
  desc: User-writable Windows staging reference
  crit: component
  conf: 0.95
  all:
  - id: windowsupdate-identifier-reference
  any:
  - id: micro-behaviors/fs/path/app-data::localappdata-env-var-reference
  - id: micro-behaviors/fs/path/system::programdata-directory-path
  - id: micro-behaviors/fs/path/app-data::windows-user-profile-data-path
