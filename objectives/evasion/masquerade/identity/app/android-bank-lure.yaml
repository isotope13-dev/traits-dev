# Banking-brand APKs whose only real capability is an SMS control
# surface. Package identity is in the UTF-16 binary manifest.
defaults:
  platforms: [android]
  for: [xml]
  crit: notable
  conf: 0.95
  attack: T1036.005,T1636.004

traits:
  - id: hdfc-card-utf16-package
    desc: HDFC card-lure UTF-16 package name
    if:
      type: hex
      pattern: 68 00 64 00 66 00 63 00 62 00 61 00 6E 00 6B 00 63 00 61 00 72 00 64 00

composite_rules:
  - id: hdfc-sms-read-send
    desc: HDFC lure reads and sends SMS
    crit: hostile
    conf: 0.96
    all:
      - id: hdfc-card-utf16-package
      - id: micro-behaviors/os/privilege/manifest::read-sms-binary-manifest
      - id: micro-behaviors/os/privilege/manifest::send-sms-binary-manifest

  - id: hdfc-sms-send-receive
    desc: HDFC lure sends and receives SMS
    crit: hostile
    conf: 0.96
    all:
      - id: hdfc-card-utf16-package
      - id: micro-behaviors/os/privilege/manifest::send-sms-binary-manifest
      - id: micro-behaviors/os/privilege/manifest::receive-sms-binary-manifest

  - id: hdfc-sms-read-receive
    desc: HDFC lure reads and receives SMS
    crit: hostile
    conf: 0.96
    all:
      - id: hdfc-card-utf16-package
      - id: micro-behaviors/os/privilege/manifest::read-sms-binary-manifest
      - id: micro-behaviors/os/privilege/manifest::receive-sms-binary-manifest
