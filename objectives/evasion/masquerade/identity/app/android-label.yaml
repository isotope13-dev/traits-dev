# A display string repeatedly split by invisible separators renders as the
# plain name ("Saisonポイント" or "e-Tax") on the launcher and install prompt, while any
# brand, keyword or allowlist check over the string sees no such word. An app
# that also writes PackageInstaller sessions is hiding the name it shows the
# victim from exactly the review that would catch a brand-lure installer.
defaults:
  platforms: [android]
  attack: T1036.005,T1631

composite_rules:
  - id: zero-width-label-packageinstaller-dropper
    desc: Zero-width-split label fronts an APK installer
    crit: hostile
    conf: 0.95
    scope: archive
    for: [android_apk, zip, xml, dex]
    all:
      - id: micro-behaviors/data/string/unicode::zero-width-interleaved-word
      - id: micro-behaviors/os/package-manager/sideload::android-packageinstaller-create-session
      - id: micro-behaviors/os/package-manager/sideload::android-packageinstaller-open-write
    any:
      - id: metadata/permission/management::android-install-packages-request-source
      - id: metadata/permission/management::android-request-install-packages-request
      - id: micro-behaviors/os/package-manager/sideload::android-can-request-package-installs
