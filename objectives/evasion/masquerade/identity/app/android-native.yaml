defaults:
  platforms: [android]
  for: [c, cpp, elf, apk, zip, xml]
  attack: T1036.005

traits:
  - id: android-google-play-label
    desc: Android Google Play label string
    crit: notable
    conf: 0.92
    for: [c, cpp, elf, apk, zip]
    if:
      type: text
      substr: "Google Play Store"
    unless:
      - id: well-known/lib/runtime/electron::electron-chromium-runtime-strong

  - id: android-forged-play-signing
    desc: Android forged Play signing data
    crit: suspicious
    conf: 0.93
    for: [c, cpp, elf, apk, zip]
    if:
      type: text
      regex: 'forged_play_signing_key|Fake Google Play signing'

  # Activity android:label="Play Store" (not the longer "Google Play Store"
  # product string) is a common banker/dropper lure on launcher aliases that
  # stay hidden via excludeFromRecents.
  - id: android-play-store-activity-label
    desc: Android activity labeled Play Store
    crit: notable
    conf: 0.94
    for: [apk, zip, xml]
    if:
      type: text
      substr: 'android:label="Play Store"'

composite_rules:
  - id: android-google-play-identity-forgery
    desc: Android Google Play identity forgery
    crit: hostile
    conf: 0.98
    for: [c, cpp, elf, apk, zip]
    all:
      - id: micro-behaviors/os/network/interface::android-play-store-package-literal
      - id: android-google-play-label
    any:
      - id: android-forged-play-signing

  - id: android-hidden-play-store-activity-lure
    desc: Hidden Play Store-labeled Android activity lure
    crit: hostile
    conf: 0.96
    attack: T1036.005,T1411
    for: [apk, zip, xml]
    all:
      - id: android-play-store-activity-label
      - id: micro-behaviors/ui/window/manage/visibility::android-exclude-from-recents
      - id: micro-behaviors/os/package-manager/install::android-request-install-packages-permission
