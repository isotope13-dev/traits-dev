# A game mod that carries Windows process-injection or hidden-desktop code.
#
# Minecraft mod loaders (Fabric, Forge) run a mod's entrypoint inside the
# game with the player's full privileges, which makes "a mod" a convenient
# costume: 2026-09 "Aeon Descent" (fabric.mod.json, a preLaunch entrypoint)
# was a JNA HVNC client that hollowed a process with an XOR-encrypted PE.
# Mods render through the game's own OpenGL context; none needs to bind
# CreateProcess/NtUnmapViewOfSection/VirtualAllocEx or create a Win32 desktop.
defaults:
  for: [jar, zip, class]
  platforms: [windows]
  attack: T1036,T1055.012
  mbc: B0025
composite_rules:
  - id: fabric-mod-native-injection
    desc: Fabric mod binds Windows injection or HVNC
    crit: hostile
    conf: 0.95
    scope: archive
    all:
      - id: metadata/package/config::fabric-mod-metadata
      - id: well-known/lib/platform/jna::core-types-import
    any:
      - id: micro-behaviors/fs/memory/mmap::nt-unmap-view-of-section-import
      - id: micro-behaviors/process/inject/runtime/call::write-process-memory-dup
      - id: micro-behaviors/ui/window/station::jvm-create-desktop-name
  - id: forge-mod-native-injection
    desc: Forge mod binds Windows injection or HVNC
    crit: hostile
    conf: 0.95
    scope: archive
    all:
      - id: metadata/package/config::forge-mcmod-info
      - id: well-known/lib/platform/jna::core-types-import
    any:
      - id: micro-behaviors/fs/memory/mmap::nt-unmap-view-of-section-import
      - id: micro-behaviors/process/inject/runtime/call::write-process-memory-dup
      - id: micro-behaviors/ui/window/station::jvm-create-desktop-name
