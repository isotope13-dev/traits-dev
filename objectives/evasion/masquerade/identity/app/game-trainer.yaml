# Game trainer masquerade detection.
# Legitimate game trainers are simple memory-patching utilities.
# An unsigned PE claiming to be a game trainer but exhibiting
# C2, crypto, and loader behavior is a fabricated identity.
# ATT&CK: T1036.005 (Masquerading: Match Legitimate Name or Location)
defaults:
  platforms: [windows]
  for: [pe]
  attack: T1036.005
traits:
  - id: capcom-company-name
    desc: CAPCOM company name in version info
    crit: notable
    conf: 0.9
    if:
      type: value
      path: pe.version.company
      substr: "CAPCOM"
  - id: trainer-product-name
    desc: Game trainer product name in version info
    crit: notable
    conf: 0.9
    if:
      type: value
      path: pe.version.product_name
      regex: "(?i)trainer"
  - id: resident-evil-product
    desc: "Resident Evil product ref in version info"
    crit: notable
    conf: 0.9
    if:
      type: value
      path: pe.version.product_name
      regex: "(?i)resident.evil"
  - id: trainer-file-description
    desc: Game trainer file description in version info
    crit: component
    conf: 0.85
    if:
      type: value
      path: pe.version.description
      regex: "(?i)trainer"
  - id: trainer-message-box
    desc: Game trainer message box text
    crit: notable
    conf: 0.85
    if:
      type: text
      regex: "(?i)trainer.{0,40}(already running|admin required)"
  - id: fling-trainer-brand-string
    desc: FLiNG trainer branding string
    crit: notable
    conf: 0.96
    if:
      type: text
      regex: "(?i)flingtrainer|flingtrainer\\.com"
  - id: cheathappens-brand-string
    desc: CheatHappens trainer branding string
    crit: notable
    conf: 0.96
    if:
      type: text
      regex: '(?i)cheathappens|cheathappens\.com'
composite_rules:
  # Cheat trainers ship unsigned speed or memory patches without C2.
  - id: unsigned-trainer-cheat-controls-only
    desc: Unsigned trainer with game-cheat controls only
    crit: exception
    conf: 0.96
    all:
      - id: trainer-product-name
      - id: metadata/signed/trust-level::unsigned-missing-signature-record
    any:
      - id: fling-trainer-brand-string
      - id: cheathappens-brand-string
      - id: well-known/game/cheat::aim-assist-control
      - id: well-known/game/cheat::visual-cheat-control
      - id: well-known/game/cheat::combat-modification-control
  - id: game-trainer-fabricated-identity
    desc: Unsigned PE masquerading as game trainer with loader behavior
    crit: suspicious
    conf: 0.95
    all:
      - id: metadata/signed/trust-level::unsigned
    any:
      - id: capcom-company-name
      - id: trainer-product-name
      - id: resident-evil-product
      - id: trainer-file-description
      - id: trainer-message-box
    needs: 1
    unless:
      - id: metadata/signed/platform/
      - id: unsigned-trainer-cheat-controls-only
      - id: fling-trainer-brand-string
      - id: cheathappens-brand-string
  - id: game-trainer-malicious-loader
    desc: Game trainer masquerade with in-memory loader and C2
    crit: hostile
    conf: 0.97
    all:
      - id: game-trainer-fabricated-identity
      - id: metadata/signed/trust-level::unsigned
    any:
      - id: micro-behaviors/mem/combined::cbc-pe-header-protection-api-profile
      - id: micro-behaviors/communications/http/client/winhttp::winhttp-request-flow
      - id: micro-behaviors/crypto/cipher::bcrypt-cbc-mode-references
    needs: 2
    unless:
      - id: metadata/signed/platform/

