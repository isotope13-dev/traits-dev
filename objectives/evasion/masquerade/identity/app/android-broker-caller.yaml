defaults:
  platforms: [android]
  for: [java]

traits:
  # Bind the installed package UID to the caller extra on the same Intent.
  # A normal broker client using Process.myUid() cannot satisfy this query.
  - id: installed-package-uid-as-broker-caller
    desc: Installed package UID supplied as broker caller
    crit: suspicious
    conf: 0.98
    if:
      type: tree-sitter
      query: |
        (method_declaration body: (block
          (local_variable_declaration declarator: (variable_declarator
            name: (identifier) @uid
            value: (field_access object: (method_invocation
              name: (identifier) @lookup
              arguments: (argument_list (string_literal) @package))
              field: (identifier) @field)))
          (expression_statement (method_invocation
            object: (identifier) @request1 name: (identifier) @put
            arguments: (argument_list (string_literal) @appkey
              (string_literal) @claimed)))
          (expression_statement (method_invocation
            object: (identifier) @targetintent name: (identifier) @target
            arguments: (argument_list (string_literal) @broker
              (string_literal) @activity)))
          (expression_statement (method_invocation
            object: (identifier) @intent1 name: (identifier) @extra1
            arguments: (argument_list (string_literal) @key (identifier) @value)))
          (expression_statement (method_invocation
            object: (identifier) @intent2 name: (identifier) @extra2
            arguments: (argument_list (string_literal) @request
              (method_invocation object: (identifier) @request2
                name: (identifier) @serialize arguments: (argument_list)))))
          (expression_statement (method_invocation name: (identifier) @start
            arguments: (argument_list (identifier) @intent3 (_))))
          )
          (#eq? @lookup "getApplicationInfo")
          (#eq? @field "uid")
          (#eq? @put "put")
          (#eq? @appkey "\"client_app_name\"")
          (#eq? @package @claimed)
          (#eq? @target "setClassName")
          (#eq? @broker "\"com.azure.authenticator\"")
          (#eq? @activity "\"com.microsoft.identity.client.AccountChooserActivity\"")
          (#eq? @targetintent @intent1)
          (#eq? @request1 @request2)
          (#eq? @serialize "toString")
          (#eq? @extra1 "putExtra")
          (#eq? @extra2 "putExtra")
          (#eq? @key "\"caller.info.uid\"")
          (#eq? @request "\"broker_request_v2\"")
          (#eq? @start "startActivityForResult")
          (#eq? @uid @value)
          (#eq? @intent1 @intent2)
          (#eq? @intent1 @intent3)) @spoof
