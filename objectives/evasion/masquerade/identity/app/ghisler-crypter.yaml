# An unsigned executable whose version resource claims Ghisler Software
# (Total Commander) but which is a crypter stub: the brand is borrowed so the
# file passes a glance at its properties. Ghisler signs its releases. The
# 2018 Dofoil/Smoke Loader build from the MediaGet update hijack posed as
# tcmdx64.exe, "Total Commander 32bit->64bit helper tool".
defaults:
  platforms: [windows]
  for: [pe]
  attack: T1036.005

traits:
  - id: ghisler-version-company
    desc: Version resource names Ghisler Software
    crit: notable
    conf: 0.9
    if:
      type: value
      path: pe.version.company
      regex: '(?i)^Ghisler Software'

composite_rules:
  - id: unsigned-ghisler-branded-crypter
    desc: Unsigned crypter stub borrows the Ghisler (Total Commander) brand
    crit: hostile
    conf: 0.94
    all:
      - id: ghisler-version-company
      - id: metadata/signature/absent::unsigned-missing-signature-record
    any:
      - id: objectives/anti-static/obfuscation/decoy-imports::gdi-driver-ddi-decoy-imports
      - id: objectives/anti-static/obfuscation/string/broken-api::mangled-kernel32-module-name
