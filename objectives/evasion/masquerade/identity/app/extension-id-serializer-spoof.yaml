# Code replaces JSON.stringify with a wrapper that swaps its own extension
# identifier in a serialized array for a different extension's identifier,
# and requests an editor auth session: the editor's auth broker then sees
# the request as coming from the impersonated extension.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
composite_rules:
  - id: serializer-hook-extension-id-impersonation
    desc: Serializer hook impersonates another extension to the auth broker
    crit: hostile
    conf: 0.96
    attack: T1036,T1550
    near_bytes: 8192
    all:
      - id: micro-behaviors/process/hook/instrumentation::stringify-function-reassigned
      - id: micro-behaviors/data/property/assign::conditional-indexed-extension-identity-rewrite
      - id: micro-behaviors/os/security/auth/session::editor-silent-existing-auth-session-request
