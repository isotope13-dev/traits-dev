defaults:
  platforms: [android]
  for: [java]
  crit: hostile
  conf: 0.98
  attack: T1655

composite_rules:
  # The report describes SessionParams.setInstallerPackageName, not a
  # PackageManager attribution rewrite after install. Attribution alone is
  # neutral: require scanner suppression and a written/committed APK session.
  # This detects the deceptive install context, without claiming that static
  # source can verify absence of Google's frosting signature in the APK.
  - id: android-store-disable-play-attributed-install
    desc: Installs APK as Google Play while disabling its scanner
    all:
      - id: micro-behaviors/os/package-manager/management::android-play-store-disable-command
      - id: micro-behaviors/os/package-manager/management::android-play-installer-attribution-call
      - id: micro-behaviors/os/package-manager/sideload::android-apk-session-commit
      - id: micro-behaviors/os/package-manager/sideload::android-store-disable-before-apk-write
    near_bytes: 1400
