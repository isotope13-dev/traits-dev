# Fake Adobe Acrobat/Reader updater wrappers: unsigned binaries that carry
# the updater's component names, window titles and manifest URL while their
# carried payload is an embedded executable. Genuine AdobeARM builds are
# digitally signed with full version resources; these have neither.
defaults:
  platforms: [windows]
  for: [pe]
  attack: T1036.005

traits:
  - id: adobe-arm-component-names
    desc: AdobeARM updater component file names
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: '(?i)AdobeARM(Helper)?\.'

  - id: adobe-updater-window-title
    desc: Adobe updater window title string
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: 'Adobe (Acrobat|Reader) Updater'

composite_rules:
  - id: unsigned-adobe-updater-camouflage
    desc: Unsigned PE carries Adobe updater identity strings
    crit: hostile
    conf: 0.95
    all:
      - id: adobe-arm-component-names
      - id: adobe-updater-window-title
      - id: metadata/binary/debug::adobe-product-pdb-reference
      - id: metadata/signed/trust-level::unsigned-missing-signature-record
    unless:
      - id: metadata/signed/platform/
