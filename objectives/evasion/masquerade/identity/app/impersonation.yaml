defaults:
  platforms:
    - unix
    - windows
  crit: suspicious
  attack: T1036.005
  mbc: F0004
  for: [scripts, binaries]
traits:
  - id: apple-account-app
    desc: AppleAccount.app impersonation
    crit: suspicious
    conf: 0.95
    if:
      type: string_literal
      regex: AppleAccount\.app|NccyrNppbhag
  - id: apple-account-assistant-clear
    desc: AppleAccountAssistant impersonation
    crit: suspicious
    conf: 0.95
    if:
      type: string_literal
      exact: AppleAccountAssistant
  - id: apple-account-assistant-rot13
    desc: "AppleAccountAssistant impersonation"
    crit: suspicious
    conf: 0.95
    if:
      type: string_literal
      exact: NccyrNppbhagNffvfgnag
  - id: xprotect-path-identity-marker
    desc: XProtect application path identity
    crit: suspicious
    conf: 0.95
    if:
      type: literal
      regex: '(^|[/\\])XProtect(\.app|Remediator[^/\\]*)([/\\]|$)'
  - id: users-shared-path-rot13
    # ROT13 of /Users/Shared — obfuscation of a shared drop path is the
    # masquerade signal; cleartext /Users/Shared lives in micro-behaviors.
    desc: ROT13-obfuscated /Users/Shared path
    crit: suspicious
    conf: 0.85
    if:
      type: string_literal
      exact: Hfref/Funerq
  - id: temp-user-path-rot13
    # Cleartext TempUser occurs legitimately in software (e.g. MediaWiki temporary
    # accounts), but the ROT13 transform is a distinctive Lazarus masquerade signal.
    desc: ROT13-obfuscated TempUser path
    crit: suspicious
    conf: 0.75
    if:
      type: string_literal
      exact: GrzcHfre
  - id: system-service-prefix-name
    desc: System-like prefixed service name
    for: [elf, macho, pe]
    crit: notable
    conf: 0.6
    if:
      type: string_literal
      regex: ^(system|daemon)[_-][a-zA-Z0-9_-]*(service|daemon|agent)$
  - id: system-maintenance-prefix-name
    desc: System-like prefixed maintenance service name
    crit: notable
    conf: 0.6
    if:
      type: string_literal
      regex: ^(system|daemon)[_-][a-zA-Z0-9_-]*(helper|update|updater)$
  - id: obfuscated-app-name
    desc: Obfuscated application name
    crit: suspicious
    conf: 0.8
    not:
      - substr: wechatwebdevtools.app
      - substr: maintenancetool.app
    if:
      type: string_literal
      regex: /([a-z]{15,}|[A-Z]{15,})\.app/Contents(/|$)
    unless:
      - id: well-known/tool/development/vscode-extension/tencent-codebuddy::codebuddy-marker
      - id: metadata/package/testing/presence/fixture::test-filename-pattern
      - id: well-known/app/communication/wechat-web-devtools::wechat-cli-path
  - id: random-app-name
    desc: Randomized application name
    crit: suspicious
    conf: 0.75
    if:
      type: string_literal
      regex: /[a-z0-9]{4,9}[0-9][a-z0-9]{4,10}\.app/Contents(/|$)
    unless:
      - id: well-known/tool/development/vscode-extension/tencent-codebuddy::codebuddy-marker
      - id: metadata/package/testing/presence/fixture::test-filename-pattern
composite_rules:
  - id: apple-service-impersonation
    desc: Apple service impersonation
    crit: suspicious
    conf: 0.98
    platforms:
      - macos
    any:
      - id: apple-account-app
      - id: apple-account-assistant
      - id: xprotect-path-identity-marker
  - id: system-app-masquerade
    desc: Encoded paths and system-like service name
    crit: notable
    conf: 0.95
    needs: 2
    any:
      - id: users-shared-path-rot13
      - id: temp-user-path-rot13
      - id: system-service-name
  - id: apple-runtime-masquerade
    desc: Non-Apple binary claims Apple runtime identity
    crit: suspicious
    conf: 0.95
    platforms:
      - macos
    for:
      - macho
    all:
      - id: metadata/binary/bundle::dt-runtime
      - id: metadata/signature/certificate/identity::developer-id
  - id: fake-system-binary
    for: [binaries, '!dex', '!elf', '!pe', applescript, javascript, lua, perl, php, python, ruby, shell]
    desc: Fake system binary
    crit: hostile
    conf: 0.95
    platforms:
      - macos
      - linux
    all:
      - id: apple-service-impersonation
      - id: system-app-masquerade
  - id: apple-account-assistant
    desc: AppleAccountAssistant impersonation
    crit: suspicious
    conf: 0.95
    any:
      - id: apple-account-assistant-clear
      - id: apple-account-assistant-rot13
  - id: system-service-name
    desc: System service name usage
    crit: component
    conf: 0.6
    any:
      - id: system-service-prefix-name
      - id: system-maintenance-prefix-name
      - id: metadata/lang/source/literal/string/shape::service-daemon-suffixed-literal
