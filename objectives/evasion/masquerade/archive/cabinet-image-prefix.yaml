defaults:
  platforms: [windows]
  for: [cab]
  attack: T1036.008

traits:
  - id: cab-command-named-member
    desc: Cabinet names a Windows script file
    crit: notable
    conf: 0.96
    if:
      type: value
      path: archive.members[*].path
      regex: '(?i)\.(bat|cmd|ps1|vbs)$'
  - id: cab-blank-named-member
    desc: Cabinet member has a whitespace-only name
    crit: notable
    conf: 0.98
    if:
      type: value
      path: archive.members[*].path
      regex: '^\s+$'

composite_rules:
  - id: image-prefixed-cabinet-conceals-command-file
    desc: PNG-disguised cabinet carries a script and blank-named member
    crit: hostile
    conf: 0.98
    all:
      - id: metadata/file/format/structured::cab-png-lookalike-prefix
      - id: cab-command-named-member
      - id: cab-blank-named-member
