defaults:
  platforms:
  - android
  - unix
  - windows
  for:
  - zip
  attack: T1036.008,T1027
  mbc: F0004

composite_rules:
  - id: bundle-resource-is-encrypted-executable-archive
    desc: App resource names an encrypted executable archive
    crit: suspicious
    conf: 0.96
    all:
      - id: metadata/file/extension/asset::ui-resource-extension-basename
      - id: metadata/archive/layout::archive-contains-executable-member
      - id: metadata/archive/encryption::archive-encrypted-member
      - id: metadata/archive/member/path::macos-app-bundle-member
