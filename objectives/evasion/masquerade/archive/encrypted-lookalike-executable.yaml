# A password-protected archive whose executable member name is a lookalike:
# a Cyrillic letter swapped into a Latin word, or invisible characters after
# the extension so it sits beside the real program under the same visible
# name. Encryption keeps scanners out; the name deceives the user. Neither
# is needed to ship software, and together they are deliberate deception.
defaults:
  platforms: [windows]
  for: [rar, zip, 7z]
  attack: T1036.007,T1027.013

composite_rules:
- id: encrypted-archive-lookalike-executable
  desc: Encrypted archive hides lookalike executable
  crit: hostile
  conf: 0.92
  scope: archive
  all:
    - id: metadata/archive/encryption::archive-encrypted-member
  any:
    - id: metadata/archive/member/filename/shape::executable-mixed-script-name
    - id: metadata/archive/member/filename/shape::executable-trailing-invisible-name
