defaults:
  platforms:
  - linux
  - macos
  - windows
  for:
  - zip
  - tar
  attack: T1036.008

composite_rules:
  - id: archive-disguised-as-native-library
    platforms: [linux, macos, windows, android]
    for: [zip, tar, android_apk]
    scope: file
    desc: Archive disguised as a compiled native library
    crit: suspicious
    conf: 0.93
    unless:
      - id: well-known/app/media/simpmusic::simpmusic-apk
    all:
      - id: metadata/file/extension/mismatch::archive-content-binary-extension-mismatch
      - id: metadata/file/extension/mismatch::native-library-extension-name

  - id: disguised-native-library-packageinstaller-dropper
    desc: Library-disguised archive installs an APK from an opaque asset
    crit: hostile
    conf: 0.99
    attack: T1036.008,T1105,T1631
    platforms: [android]
    for: [android_apk, zip]
    scope: outer
    all:
      - id: objectives/evasion/masquerade/archive::archive-disguised-as-native-library
      - id: micro-behaviors/os/package-manager/sideload::android-packageinstaller-with-opaque-asset
