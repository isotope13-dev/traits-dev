defaults:
  platforms: [unix, windows]
  for: [shell]
  crit: hostile
  conf: 0.97
  attack: T1036

composite_rules:
  - id: encrypted-font-renderer-launch
    desc: Concealed font payload staging accompanies a renderer-style launch
    # The execution rule supplies acquisition and activation; an ordinary
    # Chromium renderer or a string containing its flag cannot supply them.
    all:
      - id: objectives/execution/payload/file-exec/detached::encrypted-font-tail-execution
      - id: micro-behaviors/process/argument/option::shell-renderer-process-option
