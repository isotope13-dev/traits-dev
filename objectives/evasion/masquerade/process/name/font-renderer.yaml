defaults:
  platforms: [unix, windows]
  for: [shell]
  crit: hostile
  conf: 0.97
  attack: T1036

composite_rules:
  - id: encrypted-font-renderer-launch
    desc: Concealed font payload staging accompanies a renderer-style launch
    # The execution rule supplies acquisition and activation; an ordinary
    # Chromium renderer or a string containing its flag cannot supply them.
    all:
      - id: objectives/execution/payload/file-exec/detached::encrypted-font-tail-execution
      - id: micro-behaviors/process/argument/option::shell-renderer-process-option
  # Python spelling: the decrypted font-tail payload is written, made
  # executable, and launched detached, and the launch argument list carries
  # the renderer child option. The payload masquerades as part of a browser's
  # process tree while it runs.
  - id: python-encrypted-font-renderer-launch
    desc: Font-carried encrypted payload launched as a renderer-style child
    for: [python]
    all:
      - id: objectives/execution/payload/file-exec/spawn/decrypted::python-encrypted-font-tail-execution
      - id: micro-behaviors/process/argument/option::python-renderer-process-option
