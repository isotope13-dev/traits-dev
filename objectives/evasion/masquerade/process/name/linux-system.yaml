  crit: hostile
  conf: 0.98
  attack: T1036.004,T1105
  for: [shell]
  near_lines: 20
  all:
  - id: shell-exec-argv0-daemon-name
  - id: objectives/command-and-control/dropper/delivery/download-execute::stealth-fetch-hidden-stage
