---
defaults:
  for:
  - elf
  - c
  - cpp
  platforms:
  - linux
  - openwrt
traits:
- id: fake-abrtd-path
  desc: Contains abrtd daemon path
  crit: suspicious
  conf: 0.85
  mbc: F0004
  if:
    type: text
    substr: "/usr/sbin/abrtd"
- id: fake-abrtd-name
  desc: Contains abrtd daemon name
  crit: suspicious
  conf: 0.7
  if:
    type: text
    substr: abrtd
- id: fake-sshd-bracket
  desc: Standalone bracketed sshd process name
  crit: suspicious
  conf: 0.85
  mbc: F0004
  if:
    type: text
    # Match a complete extracted binary string or a quoted source literal.
    # Autoconf uses `[sshd]` as an m4 list argument to AC_PATH_PROGS; there it
    # is neither a process name nor masquerading behavior.
    regex: '(^|["''])\[sshd\]($|["''])'
- id: fake-kworker
  desc: Fake kernel worker thread name
  crit: suspicious
  conf: 0.85
  mbc: F0004
  if:
    type: text
    substr: "[kworker/"
  unless:
  - id: well-known/tool/detection/malcontent::malcontent-defensive-scanner-context
- id: fake-kworker-cpu-name
  desc: Spoofed per-CPU kworker kernel-thread name
  crit: suspicious
  conf: 0.9
  mbc: F0004
  attack: T1036.004
  # kworker/<cpu>[:<id>] is a kernel thread name, so a userspace program
  # carrying one is claiming to be one. It is also what `ps` prints, which is
  # how it reaches C/C++ sources: bcc's examples/cpp/TaskIterator.cc pastes
  # sample task-iterator output ("6  kworker/0:0H") into its header comment.
  # Capture the line prefix so a comment leader can be filtered out; a program
  # that really adopts the name writes it as a string, not as prose.
  if:
    type: text
    regex: '(?m)^[^\n]{0,200}\bkworker/[0-9]+(:[0-9]+)?\b'
  not:
  - regex: '^\s*(/\*|//|\*|#)'
  unless:
  - id: well-known/tool/detection/malcontent::malcontent-defensive-scanner-context
- id: fake-migration
  desc: Fake migration thread name
  crit: suspicious
  conf: 0.85
  mbc: F0004
  if:
    type: text
    substr: "[migration/"
- id: fake-ksoftirqd
  desc: Fake ksoftirqd thread name
  crit: suspicious
  conf: 0.85
  mbc: F0004
  if:
    type: text
    substr: "[ksoftirqd/"
- id: fake-ksoftirqd-cpu-name
  desc: ksoftirqd CPU process name
  crit: suspicious
  conf: 0.92
  mbc: F0004
  attack: T1036.004
  if:
    type: text
    regex: "^ksoftirqd/[0-9]+$"
- id: fake-kthreadd
  desc: Fake kthreadd thread name
  crit: suspicious
  conf: 0.85
  mbc: F0004
  if:
    type: text
    # A masquerading process carries this as a string constant it installs as
    # its own name — quoted in C/C++ source, a standalone run in an ELF. A bare
    # substring also matched prose: anything that parses /proc/<pid>/stat and
    # documents the bracketed kernel-thread convention (procps/ps/htop,
    # container runtimes, monitoring agents, and OpenJDK's own
    # ProcessHandleImpl_linux.c comment) mentions `[kthreadd]` without ever
    # pretending to be it. Anchored like the fake-ksoftirqd sibling.
    regex: '"\[kthreadd\]"|^\[kthreadd\]$'
- id: fake-systemd-path
  desc: Contains systemd path (potential masquerade)
  crit: notable
  conf: 0.6
  if:
    type: text
    substr: "/lib/systemd/systemd"
- id: fake-udevd-path
  desc: Contains udevd path (potential masquerade)
  crit: suspicious
  conf: 0.6
  if:
    type: text
    substr: "/sbin/udevd"
- id: fake-syslogd-path
  desc: Contains syslogd path
  crit: notable
  conf: 0.75
  if:
    type: text
    exact: "/usr/sbin/syslogd"
- id: fake-dbus-daemon-path
  desc: Contains dbus-daemon path
  crit: notable
  conf: 0.75
  if:
    type: text
    exact: "/usr/bin/dbus-daemon"
- id: shell-exec-argv0-daemon-name
  desc: Shell sets a custom process argv[0]
  crit: suspicious
  conf: 0.92
  for: [shell]
  if:
    type: text
    # Require the shell builtin at a command boundary; e.g. `convox exec -a`
    # is a normal CLI subcommand and does not alter argv[0].
    #
    # And require a daemon-like replacement name, using the same predicate as
    # the native sibling below: `exec -a mkinitrd /sbin/mkinitrd` preserves the
    # program's own name, which is the opposite of masquerading. SUSE's
    # refresh_initrd does exactly that and was flagged for it. Matching any
    # trailing "d" is not enough of a filter -- mkinitrd ends in one.
    regex: '(?im)^[ \t]*exec[ \t]+-a[ \t]+.?\[?(kworker|[a-z0-9_.-]{3,}daemon)'
- id: shell-exec-argv0-kernel-thread
  desc: Shell adopts bracketed kernel-worker argv zero
  crit: suspicious
  conf: 0.99
  for: [shell]
  attack: T1036.004
  mbc: F0004
  if:
    type: text
    # Kernel threads have no userspace argv. A shell explicitly supplying a
    # bracketed kworker argv[0] is therefore an unambiguous masquerade action.
    regex: '(?im)^[ \t]*exec[ \t]+-a[ \t]+["'']?\[kworker/[A-Za-z0-9_:.-]{1,24}\]'
- id: native-exec-argv0-daemon-name
  desc: Native exec uses daemon-like argv[0]
  crit: suspicious
  conf: 0.92
  for: [c, cpp, objc, elf]
  if:
    type: text
    # A normal `execl("/bin/uname", "uname", ...)` preserves the program
    # name and is not masquerading.  Match only daemon-like replacements.
    regex: '(?i)execlp?\([^,]{0,40},.{0,8}"(kworker|[a-z0-9_.-]{3,}daemon)"'
- id: fake-cron-path
  desc: Contains cron daemon path
  crit: notable
  conf: 0.7
  if:
    type: text
    exact: "/usr/sbin/cron"
- id: fake-crond-path
  desc: Contains crond path (potential masquerade)
  crit: notable
  conf: 0.6
  if:
    type: text
    substr: "/usr/sbin/crond"
  unless:
  - type: basename
    exact: apko
- id: fake-cron-foreground-path
  desc: Contains cron -f foreground command line
  crit: suspicious
  conf: 0.7
  if:
    type: text
    substr: "/usr/sbin/cron -f"
- id: fake-postfix-master-path
  desc: Contains postfix master daemon path
  crit: suspicious
  conf: 0.7
  mbc: F0004
  if:
    type: text
    substr: "/usr/libexec/postfix/master"
- id: fake-upowerd-path
  desc: Contains upowerd daemon path
  crit: suspicious
  conf: 0.7
  mbc: F0004
  if:
    type: text
    substr: "/usr/libexec/upowerd"
- id: fake-gdm-auth-session
  desc: Contains GDM auth session name
  crit: suspicious
  conf: 0.7
  mbc: F0004
  if:
    type: text
    substr: gdm/auth-session
- id: fake-hald-runner
  desc: Contains HAL daemon runner name
  crit: suspicious
  conf: 0.7
  mbc: F0004
  if:
    type: text
    substr: hald-runner
- id: fake-hald-addon-input
  desc: Contains HAL input daemon name
  crit: suspicious
  conf: 0.72
  mbc: F0004
  if:
    type: text
    substr: 'hald-addon-input: Listening on /dev/input/event'
- id: fake-dbus-socket
  desc: Contains dbus socket masquerade
  crit: suspicious
  conf: 0.72
  mbc: F0004
  if:
    type: text
    substr: dbus/dbus_socket
- id: fake-chronyd-path
  desc: Contains chronyd daemon path
  crit: suspicious
  conf: 0.62
  mbc: F0004
  if:
    type: text
    substr: "/usr/sbin/chronyd"
- id: fake-polkitd-path
  desc: Contains polkitd daemon path
  crit: suspicious
  conf: 0.62
  mbc: F0004
  if:
    type: text
    substr: "/usr/lib/polkit-1/polkitd"
- id: fake-tuned-path
  desc: Contains tuned daemon path
  crit: suspicious
  conf: 0.62
  mbc: F0004
  if:
    type: text
    substr: "/usr/sbin/tuned"
- id: fake-watchdogd-bracket
  desc: Fake watchdog kernel thread
  crit: suspicious
  conf: 0.72
  mbc: F0004
  if:
    type: text
    substr: "[watchdogd]"
- id: fake-kaluad-charger-bracket
  desc: Fake kernel thread pair
  crit: suspicious
  conf: 0.72
  mbc: F0004
  if:
    type: text
    substr: "[kaluad_sync][charger_manager]"
- id: fake-atd-path
  desc: Contains atd path (potential masquerade)
  crit: suspicious
  conf: 0.6
  if:
    type: text
    substr: "/usr/sbin/atd"
- id: shell-kernel-thread-process-lookup
  desc: Shell looks up a kernel-thread name
  crit: suspicious
  conf: 0.9
  mbc: F0004
  attack: T1036.004
  for: [scripts]
  platforms: [unix]
  # `ps` renders kernel threads with their name in square brackets, so a
  # userspace payload that installs a bracketed name is claiming to be one --
  # and the installer that planted it then has to look the name back up to
  # confirm the payload started (`pidof [pdflush-0]`). That lookup is the
  # part that survives into the dropper script even when the payload itself
  # is a fetched blob nobody scans.
  #
  # Bracket contents are required to be at least three characters so the
  # single-character `pgrep "[n]ginx"` self-match-avoidance idiom -- which
  # brackets exactly one letter -- is not read as a kernel-thread name.
  if:
    type: text
    # The bracketed name must be the command argument (after ordinary flags),
    # not a later shell string such as a `[sudo] password` prompt.
    regex: '(?im)\b(pidof|pgrep|pkill)(\s+-[a-z]+){0,3}\s+["'']?\[[a-z][a-z0-9/._-]{2,20}\]'
composite_rules:
- id: hidden-cron-kworker-masquerade
  desc: Hidden cron implant adopts kernel-worker identity
  crit: hostile
  conf: 0.99
  attack: T1036.004,T1053.003,T1564.001
  for: [shell]
  all:
  - id: shell-exec-argv0-kernel-thread
  - id: objectives/persistence/system/cron/schedule::direct-user-cron-spool-write
  - id: micro-behaviors/fs/path/location::xdg-data-hidden-subdir-path
- id: downloaded-kthread-argv0-masquerade
