# A drive-root CSRSS-like name is not the OS's System32 CSRSS service.
# Match the CSRS stem plus one alphabetic suffix; an absolute System32
# path and unrelated program names are near misses. No worm-family claim.
defaults:
  for: [text]
  platforms: [windows]
  size_max: 4096
composite_rules:
  - id: autorun-csrss-like-root-target
    desc: AutoRun launches a CSRSS-like drive-root executable
    crit: suspicious
    conf: 0.9
    attack: T1036.005
    all:
      - id: micro-behaviors/os/autorun/media::autorun-inf-launch-program
      - id: micro-behaviors/os/autorun/media::autorun-csrss-like-root-directive
    unless:
      - id: metadata/file/format/structured::ini-section-header-after-first-line
    near_bytes: 1024
