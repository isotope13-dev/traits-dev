defaults:
  platforms: [android]
  for: [elf]
  attack: T1036.004
  mbc: F0004

traits:
  - id: android-tv-sysboot-process-name
    desc: Android TV sysboot process name
    crit: component
    conf: 0.95
    if:
      type: text
      exact: android-tv-sysboot
  - id: android-tv-preboot-process-name
    desc: Android TV preboot process name
    crit: component
    conf: 0.95
    if:
      type: text
      exact: android-tv-preboot
  - id: android-tv-post-process-name
    desc: Android TV post-stage process name
    crit: component
    conf: 0.92
    if:
      type: text
      regex: '^android-tv-post[bsj]$'
  - id: android-tv-bread-process-name
    desc: Android TV bread process name
    crit: component
    conf: 0.98
    if:
      type: text
      exact: android-tv-bread

composite_rules:
  - id: android-tv-process-masquerade-set
    desc: prctl binary carries an Android TV process-name set
    crit: suspicious
    conf: 0.99
    all:
      - id: micro-behaviors/process/control/prctl::prctl-symbol
    needs: 3
    any:
      - id: android-tv-sysboot-process-name
      - id: android-tv-preboot-process-name
      - id: android-tv-post-process-name
      - id: android-tv-bread-process-name
