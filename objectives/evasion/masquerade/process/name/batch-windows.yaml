defaults:
  platforms: [windows]
  for: [batch]
  attack: T1036.004

traits:
  - id: batch-fake-svchost-drop
    desc: Batch fake svchost drop
    crit: suspicious
    conf: 0.94
    if:
      type: text
      regex: 'set\s+FAKE_BIN=.{0,80}\\svchost\.exe'
      case_insensitive: true

  # An .exe taking QEMU -drive file= args. Suppressed when the file also names
  # qemu-system-*, so legitimate emulator invocations do not count as masquerade.
  - id: non-qemu-exe-drive-image
    desc: Non-QEMU exe takes disk image drive arg
    crit: suspicious
    conf: 0.92
    if:
      type: text
      regex: '(?i)\b[a-z0-9_-]{3,40}\.exe\b[^\n]{0,60}-drive\s+file='
    unless:
      - id: micro-behaviors/os/virtualization/hypervisor::qemu-system-binary

composite_rules:
  - id: batch-svchost-task-masquerade
    desc: Batch svchost task masquerade
    crit: hostile
    conf: 0.98
    all:
      - id: batch-fake-svchost-drop
      - id: micro-behaviors/os/service/host::svchost-system32-service-image
      - id: micro-behaviors/os/autorun/scheduled::schtasks-runlevel-highest

  # Headless disk-image launch via a renamed/non-QEMU binary (e.g. fontdiag.exe
  # -drive file=... -nographic). Legitimate tooling names the emulator.
  - id: masqueraded-qemu-headless-launcher
    desc: Headless disk image via non-QEMU binary name
    crit: hostile
    conf: 0.94
    all:
      - id: non-qemu-exe-drive-image
      - id: micro-behaviors/os/virtualization/hypervisor::qemu-nographic-flag
      - id: objectives/command-and-control/dropper/execution/batch::start-exe
