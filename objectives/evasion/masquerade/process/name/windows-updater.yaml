# Trusted-vendor auto-updater executable names, as referenced from a script.
#
# The sibling windows-system.yaml carries the System32 process names
# (svchost, lsass, winlogon). Updater names are the other half of the same
# trick and are the more common choice today: MicrosoftEdgeUpdate.exe,
# GoogleUpdate.exe and OneDriveStandaloneUpdater.exe already run unattended,
# already talk to the internet on a schedule, and already appear in every
# baseline — so an analyst skimming a process list or an autoruns dump reads
# past them. Renaming a dropped tunnel connector or agent to one of these
# names buys the operator that skip.
#
# Each pattern allows a short trailing suffix so the vendor's own variants
# (MicrosoftEdgeUpdateCore.exe) and the invented ones (MicrosoftEdgeUpdate64.exe,
# seen carrying a renamed Cloudflare tunnel connector) both match.
#
# The name alone is a neutral identity fact — deployment and patching scripts
# reference these binaries legitimately. The composite below adds the location
# that makes it deception, and objectives/command-and-control/channel/tunnel/
# relay/cloudflared-service.yaml pairs it with what the renamed image
# actually does.
#
# ATT&CK: T1036.005 (Match Legitimate Name or Location)
defaults:
  platforms: [windows]
  for: [scripts]
  crit: notable
  conf: 0.88
  attack: T1036.005
  mbc: F0004

traits:
  - id: microsoft-updater-exe-name
    desc: Microsoft auto-updater executable name
    if:
      type: text
      regex: '(?i)\b(MicrosoftEdgeUpdate|OneDriveStandaloneUpdater)[A-Za-z0-9_]{0,10}\.exe\b'

  - id: google-updater-exe-name
    desc: Google auto-updater executable name
    if:
      type: text
      regex: '(?i)\bGoogleUpdate[A-Za-z0-9_]{0,10}\.exe\b'

  - id: third-party-updater-exe-name
    desc: Adobe or Java auto-updater executable name
    if:
      type: text
      regex: '(?i)\b(AdobeARM|AdobeGCClient|jusched)[A-Za-z0-9_]{0,10}\.exe\b'

composite_rules:
  - id: vendor-updater-exe-name
    desc: Trusted-vendor auto-updater executable name
    crit: notable
    conf: 0.88
    any:
      - id: microsoft-updater-exe-name
      - id: google-updater-exe-name
      - id: third-party-updater-exe-name

  - id: vendor-updater-name-in-writable-path
    desc: Updater name staged in a user-writable path
    # An updater installed by its vendor lives under %ProgramFiles% or
    # %ProgramData%. The same name resolving into Documents, Downloads,
    # AppData, Temp or Users\Public is a dropped file wearing it.
    crit: suspicious
    conf: 0.93
    all:
      - id: vendor-updater-exe-name
      - id: objectives/evasion/masquerade/process/path::writable-path-any
    near_bytes: 100
    unless:
      - id: metadata/package/testing/presence/harness/
