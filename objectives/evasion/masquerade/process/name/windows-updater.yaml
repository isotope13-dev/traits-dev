# A vendor updater name near a writable location warrants investigation.
# The basename itself remains a neutral observation.
defaults:
  platforms: [windows]
  for: [scripts]
  attack: T1036.005
  mbc: F0004

composite_rules:
  - id: vendor-updater-name-in-writable-path
    desc: Updater name staged in a user-writable path
    # An updater installed by its vendor lives under %ProgramFiles% or
    # %ProgramData%. The same name resolving into Documents, Downloads,
    # AppData, Temp or Users\Public is a dropped file wearing it.
    crit: suspicious
    conf: 0.93
    all:
      - id: micro-behaviors/fs/path/basename::vendor-updater-exe-name
      - id: micro-behaviors/fs/path/location::writable-path-any
    near_bytes: 100
    unless:
      - id: metadata/package/testing/presence/harness/
      - id: "metadata/file/naming::test-directory-component"
