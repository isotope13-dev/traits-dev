# Masquerades as Windows system executable in user directory or remote payload
defaults:
  platforms: [windows]
  for: [batch, powershell, scripts]
  attack: T1036.005
  mbc: F0004

composite_rules:
  - id: appdata-taskmgr-masquerade
    desc: AppData executable masquerades as Taskmgr
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/fs/path/binary::appdata-taskmgr-path
      - id: micro-behaviors/process/create/shellexec::powershell-invoke-item

  - id: appdata-msedge-masquerade
    desc: AppData executable masquerades as Edge
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/fs/path/binary::appdata-msedge-path
      - id: micro-behaviors/process/create/shellexec::powershell-invoke-item

  - id: lolbas-systemsettings-masquerade
    desc: LOLBAS payload masquerades as SystemSettings
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/communications/url/path::systemsettings-url-payload
      - id: micro-behaviors/fs/path/cache::windows-inetcache-path-text
