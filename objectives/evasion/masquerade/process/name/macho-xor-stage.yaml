defaults:
  platforms: [macos]
  for: [macho]
  attack: T1036.005
composite_rules:
  - id: macho-kworker-http-stage-disguise
    desc: HTTP stage loader carries a kernel-worker process name
    crit: hostile
    conf: 0.97
    all:
      - id: objectives/execution/payload/file-exec/replace::macho-http-xor-stage-replacement
      - id: micro-behaviors/process/info/name::bracketed-kworker-name-reference
  - id: macho-kworker-xor-stage-disguise
    desc: Covert XOR stage loader carries a kernel-worker process name
    crit: hostile
    conf: 0.97
    all:
      - id: objectives/execution/payload/file-exec/replace::macho-tcp-xor-stage-replacement
      - id: micro-behaviors/process/info/name::bracketed-kworker-name-reference
