defaults:
  platforms: [unix]
  for: [rust]
  attack: T1036.004,T1105

composite_rules:
  - id: rust-downloaded-system-process-masquerade
    desc: Rust archive loader launches payload named as a system process
    crit: hostile
    conf: 0.995
    near_bytes: 30000
    all:
      - id: metadata/file/catalog/service::platform-service-name-reference
      - id: objectives/execution/staging/transfer::archive-name-download-platform-clues
      - id: micro-behaviors/fs/chmod/executable/mode::set-permissions-call
      - id: micro-behaviors/process/create/subprocess/launch::rust-command-spawn-call
