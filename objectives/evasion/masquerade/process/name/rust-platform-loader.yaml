defaults:
  platforms: [unix]
  for: [rust]
  attack: T1036.004,T1105

composite_rules:
  - id: rust-downloaded-system-process-masquerade
    desc: Rust archive loader launches payload named as a system process
    crit: hostile
    conf: 0.995
    near_bytes: 30000
    all:
      - id: objectives/command-and-control/dropper/staging/archive::platform-payload-names
      - id: objectives/command-and-control/dropper/staging/archive::staged-archive-platform-loader
      - id: micro-behaviors/fs/chmod/executable/mode::set-permissions-call
      - id: micro-behaviors/process/create/direct::rust-command-spawn-call
