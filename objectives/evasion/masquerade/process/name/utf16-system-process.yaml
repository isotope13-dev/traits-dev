# Windows system process names held as UTF-16 path suffixes, the form VB6 and
# other wide-string runtimes use for a copy target or a launch path. A program
# that builds `<dir>\smss.exe` or `<dir>\csrss.exe` is naming a file after a
# protected system process; the real binaries live only in System32.
defaults:
  platforms: [windows]
  for: [pe]
  crit: notable
  attack: T1036.005
  mbc: F0004

traits:
  - id: utf16-smss-exe-path-suffix
    desc: UTF-16 backslash smss.exe path suffix
    conf: 0.85
    if:
      type: hex
      pattern: '5C 00 73 00 6D 00 73 00 73 00 2E 00 65 00 78 00 65 00'
      section: .text
