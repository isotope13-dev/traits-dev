defaults:
  platforms: [windows]
  for: [pe, dll]
  attack: "T1036,T1564.001"

traits:
  - id: shadow-deployer-type
    desc: Managed shadow-deployer type name
    crit: notable
    conf: 0.98
    if:
      type: text
      word: ShadowDeployer

  - id: process-alias-field-set
    desc: Five process-alias configuration fields
    crit: notable
    conf: 0.99
    count_min: 5
    if:
      type: text
      regex: '\bProcessAlias[0-4]\b'

  - id: system-copy-method
    desc: Managed system-copy method
    crit: notable
    conf: 0.98
    if:
      type: text
      word: SystemCopy

  - id: select-process-alias-method
    desc: Process-alias selector method
    crit: notable
    conf: 0.98
    if:
      type: text
      word: SelectProcessAlias

  - id: shadow-copy-method
    desc: Managed shadow-copy method
    crit: notable
    conf: 0.98
    if:
      type: text
      word: ShadowCopy

composite_rules:
  - id: alias-self-copy-method-set
    desc: Alias selection and self-copy methods
    crit: component
    conf: 0.98
    needs: 2
    any:
      - id: system-copy-method
      - id: select-process-alias-method
      - id: shadow-copy-method

  - id: dotnet-process-alias-shadow-copy
    desc: Managed loader self-copies under a selected process alias
    crit: hostile
    conf: 0.99
    all:
      - id: metadata/binary/framework::dotnet-assembly
      - id: shadow-deployer-type
      - id: process-alias-field-set
      - id: alias-self-copy-method-set
      - id: micro-behaviors/fs/file/attributes::managed-set-attributes-method
      - id: objectives/persistence/login/multi-technique::heartbeat-loop-method
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/installer/family/
