# Self-deleting native stage loader passes a bracketed Linux kernel-thread
# argv[0] name ([kworker/...], [kthreadd], [rcu_...]) when spawning its stage.
defaults:
  platforms: [linux, macos]
  for: [elf, macho]
  attack: T1036.005

composite_rules:
  - id: native-forked-stage-kthread-disguise
    desc: Stager spawns payload with kthread name
    crit: hostile
    conf: 0.97
    all:
      - id: micro-behaviors/fs/delete/path::native-fork-exec-delete-same-path
      - id: objectives/evasion/indicator-removal/self::native-stage-file-write-capability
      - id: objectives/evasion/indicator-removal/self::native-stage-chmod-capability
    any:
      - id: micro-behaviors/process/info/name::bracketed-kworker-name-reference
      - id: micro-behaviors/process/info/name::bracketed-kthreadd-name-reference
      - id: micro-behaviors/process/info/name::bracketed-rcu-thread-name-reference
    unless:
      - id: objectives/evasion/masquerade/process/name::macho-kworker-http-stage-disguise
      - id: objectives/evasion/masquerade/process/name::macho-kworker-xor-stage-disguise
