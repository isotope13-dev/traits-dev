defaults:
  for:
    - pe
    - rust
  platforms:
    - windows
  attack: T1036.005
  mbc: F0004
traits:
  - id: audiodg-name
    desc: audiodg.exe process name
    crit: component
    conf: 0.8
    if:
      type: text
      word: audiodg.exe
  - id: wininit-name
    desc: wininit.exe process name
    crit: component
    conf: 0.8
    if:
      type: text
      word: wininit.exe
  - id: taskhost-name
    desc: taskhost.exe process name
    crit: component
    conf: 0.8
    if:
      type: text
      word: taskhost.exe
  - id: svchost-name
    desc: svchost.exe process name
    crit: component
    conf: 0.8
    if:
      type: text
      word: svchost.exe
  - id: numeric-svchost-executable-name
    desc: Numeric-suffixed svchost executable name
    crit: notable
    conf: 0.9
    # Malware commonly adds digits to a trusted Windows process name while
    # retaining the .exe identity. Keep this language-neutral so source and
    # binary artifacts in different implementation languages are covered.
    for: [scripts, go, rust, c, cpp, csharp, python, powershell, batch, pe, dll]
    if:
      type: text
      regex: '(?i)\bsvchost[0-9]+\.exe\b'
  - id: lsass-name
    desc: lsass.exe process name
    crit: component
    conf: 0.82
    if:
      type: text
      word: lsass.exe
  - id: winlogon-name
    desc: winlogon.exe process name
    crit: component
    conf: 0.82
    if:
      type: text
      word: winlogon.exe
  - id: explorer-name
    desc: explorer.exe process name
    crit: component
    conf: 0.8
    if:
      type: text
      word: explorer.exe
  - id: internet-explorer-name
    desc: Internet Explorer executable name
    crit: component
    conf: 0.82
    if:
      type: text
      word: iexplore.exe
      case_insensitive: true
  - id: internat-name
    desc: Windows internat.exe process name
    crit: component
    conf: 0.86
    if:
      type: text
      word: internat.exe
      case_insensitive: true
  - id: fontdrvhost-name
    desc: fontdrvhost.exe process name
    crit: component
    conf: 0.84
    if:
      type: text
      word: fontdrvhost.exe
  - id: chrpssdecr-name
    desc: ChrPssDecr executable name
    crit: suspicious
    conf: 0.9
    if:
      type: text
      word: ChrPssDecr.exe
  # Edge WebView2 host name is a common LOLBIN-style drop masquerade in unsigned
  # .NET NuGet stagers (stage as %TEMP%\msedgewebview2.exe, probe by name, then
  # Process.Start). Notable alone so analysts see the identity in diffs.
  - id: msedgewebview2-exe-name
    desc: msedgewebview2.exe process name
    crit: notable
    conf: 0.88
    if:
      type: text
      word: msedgewebview2.exe
      case_insensitive: true
  - id: csrss-file-basename
    desc: File uses the protected csrss.exe process name
    crit: component
    conf: 0.98
    for: [pe]
    if:
      type: basename
      exact: csrss.exe
      case_insensitive: true
composite_rules:
  - id: runservices-browser-input-process-masquerade
    desc: RunServices persistence uses browser and input process names
    crit: hostile
    conf: 0.98
    attack: T1036.005,T1547.001
    for: [pe]
    all:
      - id: internet-explorer-name
      - id: internat-name
      - id: objectives/persistence/login/registry/autostart::run-service-key
      - id: micro-behaviors/os/registry/access::registry-write-api-chain
      - id: micro-behaviors/fs/path/check::get-module-filename
    any:
      - id: micro-behaviors/os/sysinfo/directories::get-system-directory
      - id: micro-behaviors/os/sysinfo/directories::get-windows-directory
    needs: 1
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/installer/family/
  - id: unsigned-system-process-name-set
    desc: Unsigned binary embeds many system process names
    crit: suspicious
    conf: 0.93
    any:
      - id: audiodg-name
      - id: wininit-name
      - id: taskhost-name
      - id: svchost-name
      - id: lsass-name
      - id: winlogon-name
      - id: explorer-name
      - id: fontdrvhost-name
    needs: 6
    unless:
      - id: metadata/signed/
    downgrade:
      any:
        - id: metadata/binary/vendor::microsoft-corp-versioninfo
        - id: metadata/signed/platform/
        - id: metadata/binary/metrics/structural::many-imports
  - id: numeric-svchost-service-persistence
    desc: Service persistence with numeric svchost masquerade
    crit: hostile
    conf: 0.98
    for: [scripts, go, rust, c, cpp, csharp, python, powershell, batch, pe, dll]
    all:
      - id: numeric-svchost-executable-name
    any:
      - id: objectives/persistence/system/service/install::go-service-autostart-install
      - id: objectives/persistence/system/service/install::user-writable-service-image-autostart
      - id: objectives/persistence/system/service/install::service-install-and-start
  # Download+write+exec already covered under dropper/; this rule is the
  # identity leg: staging under %TEMP% as Edge WebView2. Catches future
  # NuGet/typosquat loaders that rename the stage without sharing the same
  # GitHub URL shape.
  - id: temp-msedgewebview2-http-drop
    desc: HTTP drop stages Temp msedgewebview2.exe
    crit: hostile
    conf: 0.97
    attack: T1036.005,T1105
    for: [pe]
    near_bytes: 16384
    all:
      - id: msedgewebview2-exe-name
      - id: micro-behaviors/fs/path/temp::windows-temp-executable-path
      - id: micro-behaviors/communications/http/client/managed::httpclient-bytearray-download
      - id: micro-behaviors/process/create/spawn::process-start-member-token
    unless:
      - id: metadata/signed/platform/
  - id: unsigned-renamed-csrss-binary
    desc: Unsigned PE renamed to the protected csrss.exe process name
    crit: hostile
    conf: 0.98
    for: [pe]
    all:
      - id: csrss-file-basename
      - id: metadata/binary/anomaly/provenance::pe-basename-differs-from-original-filename
      - id: metadata/binary/layout::pe-no-signature-record
      - id: metadata/package/versioning::pe-company-name-populated
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/vendor::microsoft-prefixed-company
      - id: well-known/lib/platform/microsoft-system::microsoft-known-system-context
