defaults:
  for:
    - pe
    - rust
  platforms:
    - windows
  attack: T1036.005
  mbc: F0004
traits:
  - id: chrpssdecr-name
    desc: ChrPssDecr executable name
    crit: suspicious
    conf: 0.9
    if:
      type: text
      word: ChrPssDecr.exe
  # Identity legs: the PE actually *is* named explorer, either on disk or in
  # its version resource. Merely embedding the string "explorer.exe" is a
  # normal shell-out (Process.Start("explorer.exe")) in benign desktop apps.
  - id: explorer-original-filename-claim
    desc: OriginalFilename claims explorer.exe identity
    crit: notable
    conf: 0.9
    for: [pe, dll]
    if:
      type: value
      path: pe.version.original_filename
      regex: '^explorer\.exe$'
      case_insensitive: true
  - id: explorer-internal-name-claim
    desc: InternalName claims explorer.exe identity
    crit: notable
    conf: 0.9
    for: [pe, dll]
    if:
      type: value
      path: pe.version.internal_name
      regex: '^explorer\.exe$'
      case_insensitive: true
  - id: explorer-file-basename
    desc: File uses the explorer.exe process name
    crit: notable
    conf: 0.9
    for: [pe, dll]
    if:
      type: basename
      exact: explorer.exe
      case_insensitive: true
  - id: csrss-file-basename
    desc: File uses the protected csrss.exe process name
    crit: notable
    conf: 0.98
    for: [pe]
    if:
      type: basename
      exact: csrss.exe
      case_insensitive: true
composite_rules:
  - id: numeric-svchost-service-persistence
    desc: Service persistence with numeric svchost masquerade
    crit: hostile
    conf: 0.98
    for: [scripts, go, rust, c, cpp, csharp, python, powershell, batch, pe, dll]
    all:
      - id: micro-behaviors/process/info/name::numeric-svchost-executable-name
    any:
      - id: objectives/persistence/system/service/install::go-service-autostart-install
      - id: objectives/persistence/system/service/install::user-writable-service-image-autostart
      - id: micro-behaviors/os/service/configure::service-create-configure-start-api-set
  # Download+write+exec already covered under dropper/; this rule is the
  # identity leg: staging under %TEMP% as Edge WebView2. Catches future
  # NuGet/typosquat loaders that rename the stage without sharing the same
  # GitHub URL shape.
  - id: temp-msedgewebview2-http-drop
    desc: HTTP drop stages Temp msedgewebview2.exe
    crit: hostile
    conf: 0.97
    attack: T1036.005,T1105
    for: [pe]
    near_bytes: 16384
    all:
      - id: well-known/app/browser/microsoft-edge::msedgewebview2-exe-name
      - id: micro-behaviors/fs/path/temp::windows-temp-executable-path
      - id: micro-behaviors/communications/http/get::getbytearrayasync
      - id: metadata/binary/symbols/name/token::process-start-member-token
    unless:
      - id: metadata/signed/platform/
  - id: unsigned-renamed-csrss-binary
    desc: Unsigned PE renamed to the protected csrss.exe process name
    crit: hostile
    conf: 0.98
    for: [pe]
    all:
      - id: csrss-file-basename
      - id: metadata/binary/provenance/version-info::pe-basename-differs-from-original-filename
      - id: metadata/signed/trust-level::unsigned-missing-signature-record
      - id: metadata/package/versioning/scheme::pe-company-name-populated
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/vendor::microsoft-prefixed-company
      - id: well-known/lib/platform/microsoft-system::microsoft-known-system-context
  - id: unsigned-explorer-writable-packed-stub
    desc: Unsigned packed stub masquerades as explorer.exe
    crit: hostile
    conf: 0.98
    attack: T1036.005,T1027.002
    for: [pe]
    all:
      - id: explorer-original-filename-claim
      - id: objectives/evasion/masquerade/trust::unsigned-microsoft-writable-nonexec-entry
    unless:
      - id: metadata/signed/platform/
      - id: well-known/lib/platform/microsoft-system::microsoft-known-system-context
