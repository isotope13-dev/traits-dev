defaults:
  platforms: [unix, windows, macos]
# Silent Daemon Persistence with Masquerading
# Detects background process creation combined with generic/misleading identity
composite_rules:
  - id: silent-daemon-masquerade
    desc: Silent background daemon with masqueraded identity
    crit: hostile
    conf: 0.95
    attack: T1543.001
    platforms: [macos]
    for: [macho]
    all:
      - id: micro-behaviors/process/daemonize/detach::fork-new-session
    any:
      - id: metadata/binary/bundle::generic-bundle-id-pattern
      - id: metadata/filename/identity::generic-executable-name-1
      - id: metadata/filename/identity::generic-executable-name-2
    unless:
      - id: well-known/lib/runtime/scripted/jruby/

  - id: shell-masquerade-daemon-launch
    desc: Shell moves dropped binary to daemon name and executes in background
    crit: hostile
    conf: 0.98
    attack: T1036.004,T1036.005
    platforms: [unix]
    for: [shell]
    all:
      - id: micro-behaviors/fs/file/move::mv-before-local-exec
      - id: micro-behaviors/os/service/identity::unix-authentication-daemon-name
      - id: micro-behaviors/process/daemonize/detach::background-ampersand-hidden
