defaults:
  crit: suspicious
  conf: 0.95
  platforms: [unix]
  for: [php]
  attack: T1036.004
  mbc: F0004

traits:
  - id: php-kernel-worker-title
    desc: PHP process title imitates a kernel worker
    if:
      type: tree-sitter
      node: function_call_expression
      regex: '^\\?(cli_set_process_title|setproctitle)\s*\(\s*["'']\[kworker/'

composite_rules:
  - id: php-networked-kernel-worker-disguise
    desc: Detached PHP network client mimics kernel worker
    platforms: [unix, windows]
    all:
      - id: php-kernel-worker-title
      - id: micro-behaviors/process/daemonize/detach::posix-setsid
      - id: micro-behaviors/communications/socket/connect::php-stream-socket-client
