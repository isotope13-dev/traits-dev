defaults:
  platforms: [unix]
  for: [python]
  attack: T1036.004

traits:
  - id: worker-claims-vllm-process-title
    desc: Worker claims a vLLM process title
    crit: suspicious
    conf: 0.98
    if:
      type: text
      regex: '(?i)worker.{0,24}rewrites its own process title.{0,32}vllm serve'

  # A do-nothing script whose only stated purpose is that a native/compiled
  # worker carries its path in argv so the process listing looks legitimate.
  # Matches the source's own admission; the technique is argv/process-name
  # masquerade of a native process behind a benign-looking interpreter path.
  - id: decoy-entrypoint-feigns-process-listing
    desc: Decoy entrypoint feigns a process listing
    crit: suspicious
    conf: 0.9
    if:
      type: text
      regex: '(?i)\bargv\b[^\n]{0,40}process listing'

composite_rules:
  - id: filehost-worker-masquerades-as-vllm
    desc: File-hosted worker masquerades as vLLM
    crit: hostile
    conf: 0.995
    all:
      - id: worker-claims-vllm-process-title
      - id: objectives/command-and-control/dropper/delivery/download-execute::python-unverified-filehost-watchdog-dropper
