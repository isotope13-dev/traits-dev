# The report embeds dbus argv strings while re-executing an anonymous image.
# Static co-occurrence establishes a profile, not argument/data flow.
defaults:
  platforms: [linux]
  for: [elf]
composite_rules:
  - id: memfd-dbus-execution-profile
    desc: Memfd execution APIs with dbus daemon identity
    crit: suspicious
    conf: 0.95
    attack: T1036.005,T1620
    all:
      - id: micro-behaviors/mem/anonymous/create::memfd-create
      - id: micro-behaviors/process/replace::fexecve-import
      - id: micro-behaviors/os/application/target/service::dbus-daemon-path
      - id: micro-behaviors/os/application/target/service::dbus-systemd-address-argument
