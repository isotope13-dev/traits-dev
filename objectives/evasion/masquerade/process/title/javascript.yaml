# Process Title Masquerading - JavaScript/Node.js
# Detects process.title manipulation to disguise Node.js processes
# ATT&CK: T1036 (Masquerading)
# MBC: F0004 (Process Name Spoofing)
defaults:
  platforms: [windows, unix]
  attack: T1036
  mbc: F0004
  for: [javascript, typescript]
traits:
  - id: process-title-npm-masquerade
    desc: Process title set to npm-like name
    crit: suspicious
    conf: 0.9
    if:
      type: text
      regex: "process\\.title\\s*=\\s*['\"]npm-"
  - id: process-title-daemon-masquerade
    desc: Process title set to daemon-like name
    crit: suspicious
    conf: 0.9
    if:
      type: text
      regex: "process\\.title\\s*=\\s*['\"][a-z]+-daemon['\"]"
  - id: process-title-service-masquerade
    desc: Process title set to service-like name
    crit: suspicious
    conf: 0.9
    if:
      type: text
      regex: "process\\.title\\s*=\\s*['\"][a-z]+-compiler"
  - id: process-title-windows-system-component
    desc: Windows system process title
    crit: suspicious
    conf: 0.95
    if:
      type: text
      regex: "process\\.title\\s*=\\s*['\"]Windows\\s+[A-Z][A-Za-z]+(\\s+[A-Z][A-Za-z]+){2,}['\"]"
composite_rules:
  - id: disguised-hidden-resurrector
    desc: Node child is detached, hidden, and disguised as a Windows system component
    crit: hostile
    conf: 0.98
    attack: T1036,T1059.007
    scope: file
    all:
      - id: process-title-windows-system-component
      - id: micro-behaviors/process/create/spawn::detached-true
      - id: micro-behaviors/process/create/spawn::windowshide-option
      - id: micro-behaviors/process/create/spawn::stdio-ignore
    near_lines: 100
