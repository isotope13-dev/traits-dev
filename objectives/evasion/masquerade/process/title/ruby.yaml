defaults:
  crit: suspicious
  conf: 0.93
  platforms: [unix]
  for: [ruby]
  attack: T1036.004
  mbc: F0004

traits:
  # $0 assignment that makes the Ruby process list as a system binary path
  # (/usr/sbin/cron, /sbin/init) or a bracketed kernel thread ([kworker/0:1]).
  - id: ruby-title-system-binary-or-kthread
    desc: Ruby process title imitates system process
    if:
      type: text
      regex: '\$(0|PROGRAM_NAME)\s*=\s*["''](/usr)?/s?bin/[a-z][\w.-]{1,24}["'']|\$0\s*=\s*["'']\[k[a-z]'

composite_rules:
  - id: ruby-detached-system-process-disguise
    desc: Detached Ruby process poses as system process
    crit: hostile
    conf: 0.95
    all:
      - id: ruby-title-system-binary-or-kthread
      - id: micro-behaviors/process/control/title::ruby-process-title-assignment
    any:
      - id: micro-behaviors/process/daemonize/detach::ruby-process-setsid-call
      - id: micro-behaviors/process/daemonize/detach::ruby-fork-exit-detach
      - id: micro-behaviors/process/lifecycle/daemon::ruby-daemon
