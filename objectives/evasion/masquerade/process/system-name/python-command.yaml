defaults:
  for: [python]
  platforms: [linux]
traits:
  - id: python-kernel-thread-shell-command
    desc: Shell command adopts a kernel-thread name
    crit: suspicious
    conf: 0.98
    attack: T1036.004
    if:
      type: literal
      exclude_docstrings: true
      regex: '^exec -a ["'']?\[(kworker|ksoftirqd)/[^\]]{1,24}\]["'']? (ba)?sh\b'

composite_rules:
  - id: shell-kernel-name-hidden-payload-launch
    desc: Shell disguises a hidden temporary payload as a kernel thread
    crit: hostile
    conf: 0.98
    attack: T1036.004,T1620
    for: [shell]
    all:
      - id: objectives/evasion/masquerade/process/system-name::kthread-name-pool
      - id: micro-behaviors/process/argument/rewrite::shell-exec-argv0-variable
      - id: micro-behaviors/fs/path/temp::hidden-tmp-path
      - id: micro-behaviors/process/create/shell/spawn::shell-exec
