- id: fake-kaluad-charger-bracket
  desc: Fake kernel thread pair
  crit: suspicious
  conf: 0.72
  mbc: F0004
  if:
    type: text
    substr: "[kaluad_sync][charger_manager]"
- id: fake-atd-path
  desc: Contains atd path (potential masquerade)
  crit: suspicious
  conf: 0.6
  if:
    type: text
    substr: "/usr/sbin/atd"
  unless:
  # The crash dump analyser names the kernel threads it reports.
  - id: well-known/tool/reverse-engineering/crash-utility::crash-utility-source
- id: shell-kernel-thread-process-lookup
  desc: Shell looks up a kernel-thread name
  crit: suspicious
  conf: 0.9
  mbc: F0004
  attack: T1036.004
  for: [scripts]
  platforms: [unix]
  # `ps` renders kernel threads with their name in square brackets, so a
  # userspace payload that installs a bracketed name is claiming to be one --
  # and the installer that planted it then has to look the name back up to
  # confirm the payload started (`pidof [pdflush-0]`). That lookup is the
  # part that survives into the dropper script even when the payload itself
  # is a fetched blob nobody scans.
  #
  # Bracket contents are required to be at least three characters so the
  # single-character `pgrep "[n]ginx"` self-match-avoidance idiom -- which
  # brackets exactly one letter -- is not read as a kernel-thread name.
  unless:
  - id: metadata/package/testing/presence/harness::python-test-file-content
  if:
    type: text
    # The bracketed name must be the command argument (after ordinary flags),
    # not a later shell string such as a `[sudo] password` prompt.
    regex: '(?im)\b(pidof|pgrep|pkill)(\s+-[a-z]+){0,3}\s+["'']?\[[a-z][a-z0-9/._-]{2,20}\]'
- id: kthread-name-pool
  desc: Shell array pools kernel-thread names
  crit: suspicious
  conf: 0.88
  mbc: F0004
  attack: T1036.004
  for: [shell]
  if:
    type: text
    # `arr=("[kstrp]" "[watchdogd]" "[kswapd0]" ...)`: a pool of bracketed
    # kernel-thread names to draw argv[0] from. Legitimate scripts never
    # keep such a list; the names vary per family, the array shape does not.
    regex: '=\(\s*"?\[[a-z0-9][\w/.-]{2,12}\]?"?(\s+"?\[[a-z0-9][\w/.-]{2,12}\]?"?){2,}'
# Mirai-lineage bots XOR their fake-process-name pool with a one-byte key
# (tadashi.mips: key 0x5A), so the plaintext kernel-thread atoms above stay
# dark. YARA's xor modifier tries all keys per string; key 0 is excluded so
# a plaintext name list -- kernel tooling names these threads openly -- is
# not counted. Three names must share a 4KB window: the pool is one table.
- id: xor-encoded-kernel-thread-name-set
  desc: XOR-hidden kernel-thread process name set
  crit: suspicious
  conf: 0.93
  attack: T1036.004,T1027
  mbc: F0004
  for: [elf]
  size_max: 33554432
  if:
    type: yara
    source: |
      rule xor_encoded_kernel_thread_name_set {
        strings:
          $n01 = "migration" xor(1-255)
          $n02 = "watchdog" xor(1-255)
          $n03 = "kblockd" xor(1-255)
          $n04 = "hugepaged" xor(1-255)
          $n05 = "auditd" xor(1-255)
          $n06 = "kswapd" xor(1-255)
        condition:
          for any of ($n*) : (
            for any m in (1..#) : (
              3 of ($n*) in (@[m] .. @[m] + 4096)
            )
          )
      }
