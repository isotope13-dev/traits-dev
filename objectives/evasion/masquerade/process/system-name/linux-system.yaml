---
defaults:
  for:
  - elf
  - c
  - cpp
  platforms:
  - linux
  - openwrt
traits:
- id: fake-abrtd-path
  desc: Contains abrtd daemon path
  crit: suspicious
  conf: 0.85
  mbc: F0004
  if:
    type: text
    substr: "/usr/sbin/abrtd"
- id: fake-xlogin-path
  desc: Names a fake /sbin/xlogin helper
  crit: notable
  conf: 0.9
  mbc: F0004
  if:
    type: text
    exact: /sbin/xlogin
- id: fake-abrtd-name
  desc: Contains abrtd daemon name
  crit: suspicious
  conf: 0.7
  if:
    type: text
    substr: abrtd
  unless:
    # libreport is abrt's own dump library, not a process named abrtd.
    - id: metadata/package/tooling::libreport-library
- id: fake-sshd-bracket
  desc: Standalone bracketed sshd process name
  crit: suspicious
  conf: 0.85
  mbc: F0004
  if:
    type: text
    # Match a complete extracted binary string or a quoted source literal.
    # Autoconf uses `[sshd]` as an m4 list argument to AC_PATH_PROGS; there it
    # is neither a process name nor masquerading behavior.
    regex: '(^|["''])\[sshd\]($|["''])'
- id: fake-migration
  desc: Fake migration thread name
  crit: suspicious
  conf: 0.85
  mbc: F0004
  if:
    type: text
    substr: "[migration/"
  unless:
  # The crash dump analyser names the kernel threads it reports.
  - id: well-known/tool/reverse-engineering/crash-utility::crash-utility-source
- id: fake-ksoftirqd
  desc: Fake ksoftirqd thread name
  crit: suspicious
  conf: 0.85
  mbc: F0004
  if:
    type: text
    substr: "[ksoftirqd/"
- id: fake-udevd-path
  desc: Contains udevd path (potential masquerade)
  crit: suspicious
  conf: 0.6
  if:
    type: text
    substr: "/sbin/udevd"
- id: shell-exec-argv0-daemon-name
  desc: Shell sets a custom process argv[0]
  crit: suspicious
  conf: 0.92
  for: [shell]
  if:
    type: text
    # Require the shell builtin at a command boundary; e.g. `convox exec -a`
    # is a normal CLI subcommand and does not alter argv[0].
    #
    # And require a daemon-like replacement name, using the same predicate as
    # the native sibling below: `exec -a mkinitrd /sbin/mkinitrd` preserves the
    # program's own name, which is the opposite of masquerading. SUSE's
    # refresh_initrd does exactly that and was flagged for it. Matching any
    # trailing "d" is not enough of a filter -- mkinitrd ends in one.
    regex: '(?im)^[ \t]*exec[ \t]+-a[ \t]+.?\[?(kworker|[a-z0-9_.-]{3,}daemon)'
- id: shell-exec-argv0-kernel-thread
  desc: Shell adopts bracketed kernel-worker argv zero
  crit: suspicious
  conf: 0.99
  for: [shell]
  attack: T1036.004
  mbc: F0004
  if:
    type: text
    # Kernel threads have no userspace argv. A shell explicitly supplying a
    # bracketed kworker argv[0] is therefore an unambiguous masquerade action.
    # An opening parenthesis is allowed: masquerading commands are commonly
    # wrapped in a subshell, e.g. `(exec -a "[kworker/u:0]" import ...)`.
    regex: '(?im)^[ \t]*\(?[ \t]*exec[ \t]+-a[ \t]+["'']?\[kworker/[A-Za-z0-9_:.-]{1,24}\]'
- id: native-exec-argv0-daemon-name
  desc: Native exec uses daemon-like argv[0]
  crit: suspicious
  conf: 0.92
  for: [c, cpp, objc, elf]
  if:
    type: text
    # A normal `execl("/bin/uname", "uname", ...)` preserves the program
    # name and is not masquerading.  Match only daemon-like replacements.
    regex: '(?i)execlp?\([^,]{0,40},.{0,8}"(kworker|[a-z0-9_.-]{3,}daemon)"'
