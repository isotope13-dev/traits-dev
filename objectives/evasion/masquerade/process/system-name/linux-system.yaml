# Grouped alternative consumed by the gsocket hidden-shell composite: a
# kernel-thread name pool is reported on its own (suspicious), and a computed
# `exec -a $name` is only a neutral process-naming capability, so the union
# states no behaviour of its own.
- id: hidden-argv0-dispatch
  desc: Hidden process identity primitives
  crit: component
  conf: 0.88
  mbc: F0004
  attack: T1036.004
  for: [shell]
  any:
  - id: kthread-name-pool
  - id: micro-behaviors/process/argument/rewrite::shell-exec-argv0-variable
- id: kthread-pool-exec-mask
  desc: Random kernel name masks process identity
  crit: hostile
  conf: 0.94
  mbc: F0004
  attack: T1036.004
  for: [shell]
  # A kernel-name pool whose entry becomes argv[0] through a variable is the
  # full masquerade kit: random pick at runtime, kernel-thread disguise on
  # the process table. Either leg alone is only suggestive.
  all:
  - id: kthread-name-pool
  - id: micro-behaviors/process/argument/rewrite::shell-exec-argv0-variable
# The encoded twin of the pool above, inside a binary that already carries
# the hidden IoT credential dialer: the name pool is the disguise the bot
# wears on the process table while it sprays credentials. The dialer leg
# supplies the hostile behavior; the pool alone stays suspicious.
- id: xor-kernel-name-credential-bot
  desc: Kernel-thread name pool hides IoT credential bot
  crit: hostile
  conf: 0.97
  mbc: F0004
  attack: T1036.004,T1110.001,T1027
  for: [elf]
  all:
  - id: xor-encoded-kernel-thread-name-set
  - id: objectives/lateral-movement/brute-force/iot-creds::xor-credential-table-direct-network-bot

