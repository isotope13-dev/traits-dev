defaults:
  for: [python]
  platforms: [linux]
composite_rules:
  - id: python-kernel-name-encoded-shell-generator
    desc: Kernel names with encoded shell disguise
    crit: suspicious
    conf: 0.96
    attack: T1036.004
    all:
      - id: micro-behaviors/process/argument/rewrite::python-exec-argv0-template
      - id: micro-behaviors/process/info/name::bracketed-kworker-name-reference
      - id: micro-behaviors/data/encode/base64/primitive::b64encode-call
      - id: micro-behaviors/data/decode/command::base64-local-pipeline-input
