# Renaming alone is ordinary. This combination describes the co-occurrence
# with an independently established credential scanner and daemon aliases;
# it does not claim that static co-occurrence binds a particular name value.
defaults:
  platforms: [linux]
  for: [elf]
  arch: [x86-64]
composite_rules:
  - id: native-credential-scanner-daemon-aliases
    desc: Credential scanner renames process beside daemon aliases
    crit: suspicious
    conf: 0.97
    attack: T1036.004
    all:
      - id: micro-behaviors/process/info/current::x64-pr-set-name-call
      - id: micro-behaviors/fs/path/application/executable::multiple-daemon-executable-path-groups
      - id: objectives/lateral-movement/brute-force/iot-creds::x64-hidden-telnet-credential-scanner
