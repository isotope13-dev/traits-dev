# The script resolves its own folder, joins a core Windows process name
# (svchost.exe, lsass.exe...) onto it and launches that file with a hidden
# window: a bundled payload is run under a system process name so it blends
# into the process list.
defaults:
  platforms: [windows]
  for: [vbs]
  attack: T1036.005

composite_rules:
  - id: wsh-hidden-launch-local-system-named-exe
    desc: Hidden launch of local system-named exe
    crit: hostile
    conf: 0.95
    all:
      - id: micro-behaviors/process/info/name::wsh-buildpath-core-process-name
      - id: micro-behaviors/process/info/selfpath::wscript-scriptfullname
      - id: micro-behaviors/process/argument/visibility::shellexecute-hidden-showcmd
