# A program that itself starts System32 dllhost.exe with a `/Processid:`
# argument forges the command line DcomLaunch gives a genuine COM surrogate,
# so the child looks like an ordinary COM host in process listings. Hollowing
# loaders use it to dress the replaced image; the forged identity alone does
# not establish what runs inside.
defaults:
  platforms: [windows]
  for: [pe, dll]
  attack: T1036.005
composite_rules:
  - id: forged-com-surrogate-launch
    desc: Launches dllhost with a forged COM surrogate argument
    crit: suspicious
    conf: 0.9
    all:
      - id: objectives/execution/payload/process-inject/hollowing/process::dllhost-target
      - id: micro-behaviors/os/com/runtime::com-surrogate-processid-argument
      - id: micro-behaviors/process/create/exec::create-process-api-name
    unless:
      - id: metadata/signature/verified/platform::microsoft
