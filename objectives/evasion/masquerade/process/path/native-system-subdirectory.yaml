defaults:
  platforms: [windows]
  for: [pe]
  attack: T1036.005

traits:
  - id: system-process-subdirectory-autorun-command
    desc: Disguised system-subdirectory autorun command
    crit: suspicious
    conf: 0.97
    if:
      type: text
      regex: '(?i)\\(inf|fonts|tasks)\\(svchost|lsass|services)\.exe\s+/autorun\b'
