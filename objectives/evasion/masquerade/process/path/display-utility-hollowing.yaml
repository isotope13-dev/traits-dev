# Executable targets display utility (NVIDIA Display Tray) for process injection or hollowing.
defaults:
  platforms: [windows]
  for: [pe]
  attack: T1036.005,T1055.012

composite_rules:
  - id: unsigned-display-utility-hollowing-impersonation
    desc: Unsigned hollowing into display utility path
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/fs/path/application/executable::nvidia-display-tray-path
      - id: micro-behaviors/process/info/thread::thread-context-pair-get-set
      - id: micro-behaviors/mem/write/arbitrary::write-process-memory-binary
      - id: metadata/signature/absent::unsigned-missing-signature-record
    any:
      - id: micro-behaviors/process/info/thread::resume-thread-import
      - id: micro-behaviors/process/info/thread::thread-context-triple-no-suspend
      - id: micro-behaviors/process/create/exec::child-process-execution
