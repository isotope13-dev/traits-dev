defaults:
  platforms: [windows]
  for: [scripts, source]
  attack: T1036.005
  mbc: F0004
composite_rules:
  - id: windows-system-process-path-masquerade
    desc: System-process name near writable path
    crit: suspicious
    conf: 0.9
    all:
      - id: micro-behaviors/process/info/name::sysproc-name-any
      - id: micro-behaviors/fs/path/location::writable-path-any
    near_bytes: 256
    unless:
      - id: metadata/file/extension/identity::markdown-file-basename

  - id: downloaded-system-process-temp-launch
    desc: Downloads and launches a disguised system process
    crit: hostile
    conf: 0.97
    for: [batch]
    all:
      - id: windows-system-process-path-masquerade
      - id: objectives/command-and-control/dropper/file-exec/command/batch::batch-curl-temp-exe-dropper
