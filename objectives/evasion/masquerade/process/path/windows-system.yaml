defaults:
  platforms: [windows]
  for: [scripts, source]
  attack: T1036.005
  mbc: F0004
composite_rules:
  - id: downloaded-system-process-temp-launch
    desc: Downloads and launches a disguised system process
    crit: hostile
    conf: 0.97
    for: [batch]
    all:
      - id: windows-system-process-path-masquerade
      - id: objectives/command-and-control/dropper/file-exec/command/batch::batch-curl-temp-exe-dropper

traits:
  - id: windows-system-process-path-masquerade
    desc: System-process name within a temporary path
    crit: suspicious
    conf: 0.94
    if:
      type: literal
      regex: '(?i)[\\/]te?mp[\\/][^"''\r\n]{0,64}\b(svchost|lsass|services)\.exe'
