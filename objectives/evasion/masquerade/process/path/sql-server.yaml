# SQL Server's SQLPS administration binary is a trusted, platform-provided
# carrier for injected code in the article's execution chain.
defaults:
  platforms: [windows]
  for: [c, cpp, pe, dll]
  attack: T1036.005
  mbc: F0004

traits:
  - id: sqlps-administration-path
    desc: SQLPS administration binary path
    crit: suspicious
    conf: 0.95
    if:
      type: literal
      kind: string
      regex: '(?i)Microsoft SQL Server[\\/]+[0-9]+[\\/]+Tools[\\/]+Binn[\\/]+SQLPS\.exe'

composite_rules:
  - id: sqlps-injected-execution-carrier
    desc: SQLPS administration binary used as an injected execution carrier
    crit: hostile
    conf: 0.98
    attack: T1055.001,T1036.005
    all:
      - id: sqlps-administration-path
      - id: micro-behaviors/process/inject/runtime/call::create-remote-thread-dup
    any:
      - id: micro-behaviors/fs/file/encrypt::native-file-encryption-routine
      - id: objectives/evasion/process/injection/memory::rwx-allocation
      - id: micro-behaviors/communications/http/get::wininet-staged-request-source
