defaults:
  platforms:
  - unix
  for:
  - scripts
  - shell
  - binaries
  - elf
  crit: suspicious
  conf: 0.95
traits:
- id: system-service-masquerade
  desc: Invokes system-named daemon from temporary path
  crit: suspicious
  conf: 0.95
  unless:
  - id: well-known/app/infrastructure/systemd::systemd-source-tree-path
  - id: metadata/path::test-directory-component
  - id: well-known/app/infrastructure/systemd::legitimate-systemd-helper-basename
  - id: well-known/lib/native/systemd::systemd-native-library-context
  - id: well-known/lib/web/server/passenger::passenger-package-context
  - id: well-known/lib/ai/inspect-evals::eval-corpus-context
  if:
    type: symbol
    kind: call
    regex: ^/(tmp|var/tmp|dev/shm)/(systemd|sshd|dbus-daemon)$
  for:
  - shell
  platforms:
  - linux
