defaults:
  platforms:
  - unix
  for:
  - scripts
  - shell
  - binaries
  - elf
  crit: suspicious
  conf: 0.95
traits:
- id: system-service-masquerade
  desc: Invokes system-named daemon from temporary path
  crit: suspicious
  conf: 0.95
  if:
    type: symbol
    kind: call
    regex: ^/(tmp|var/tmp|dev/shm)/(systemd|sshd|dbus-daemon)$
  for:
  - shell
  platforms:
  - linux
