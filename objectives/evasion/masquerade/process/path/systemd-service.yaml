defaults:
  platforms:
  - unix
  for:
  - scripts
  - shell
  - binaries
  - elf
  crit: suspicious
  conf: 0.95
traits:
- id: system-service-masquerade
  desc: Invokes system-named daemon from temporary path
  crit: suspicious
  conf: 0.95
  if:
    type: symbol
    kind: call
    regex: ^/(tmp|var/tmp|dev/shm)/(systemd|sshd|dbus-daemon)$
  for:
  - shell
  platforms:
  - linux

composite_rules:
# Runs binaries named after system daemons from temporary paths and locks
# root's authorized_keys against change: a foothold being protected.
- id: masqueraded-daemon-with-locked-ssh-keys
  desc: Masqueraded daemon with locked SSH keys
  crit: hostile
  conf: 0.95
  for: [shell, scripts]
  attack: T1036.005,T1098.004
  all:
  - id: system-service-masquerade
  - id: micro-behaviors/fs/attributes/chattr::authorized-keys-set-immutable
