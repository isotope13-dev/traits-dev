defaults:
  platforms: [linux]
  for: [shell]
  size_max: 5000000
composite_rules:
  # The snapshot path is context only; it is not tied to the masquerading
  # command and does not by itself establish an autonomous attack.
  - id: system-service-masquerade-and-codex-snapshot
    desc: System-service masquerade and Codex snapshot path
    crit: suspicious
    conf: 0.95
    all:
      - id: micro-behaviors/fs/path/agent-config/file::codex-shell-snapshot-path-reference
      - id: objectives/evasion/masquerade/process/path::system-service-masquerade
