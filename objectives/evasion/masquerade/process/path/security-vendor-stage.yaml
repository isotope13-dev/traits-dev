defaults:
  platforms: [windows]
  for: [pe, go]
  attack: T1036.005,T1105

composite_rules:
  - id: go-security-vendor-directory-stage-exec
    desc: Stages and runs archive payload in security vendor path
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/fs/path/application/prefix::security-vendor-install-directory
      - id: micro-behaviors/fs/directory/create::go-mkdirall-any
      - id: micro-behaviors/data/archive/zip::go-zip-reader-any
      - id: micro-behaviors/communications/http/get::go-http-get-any
      - id: micro-behaviors/process/create/subprocess/configure::go-exec-command-any
    unless:
      - id: metadata/signature/verified/
