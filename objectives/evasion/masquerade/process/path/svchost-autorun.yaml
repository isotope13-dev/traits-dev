defaults:
  platforms: [windows]
  for: [pe, dll]
  attack: T1036.005,T1547.001
composite_rules:
  - id: svchost-lookalike-autorun-copy
    desc: Svchost lookalike path with copy and Run APIs
    crit: hostile
    conf: 0.96
    all:
      - id: micro-behaviors/os/registry/keys/autostart::currentversion-run
      - id: micro-behaviors/fs/file/copy/call::copyfile-module-path-api-pair
      - id: micro-behaviors/os/registry/write::reg-set-value-ex-a
    any:
      - id: micro-behaviors/fs/path/application/executable::scvhost-executable-name-reference
      - id: objectives/evasion/masquerade/service::svchost-misspell-schost
      - id: objectives/evasion/masquerade/service::svchost-misspell-svhost
  # The removable-media form: the program an autorun.inf launches on insert is
  # itself named to look like the Windows service host. The launch directive
  # alone is the neutral installer hook; the lookalike target name is what
  # makes the launch deceptive.
  - id: autorun-inf-launches-svchost-lookalike
    desc: Removable-media autorun launches svchost lookalike
    crit: hostile
    conf: 0.97
    for: [text]
    all:
      - id: micro-behaviors/os/autorun/media::autorun-inf-launch-program
      - id: micro-behaviors/fs/path/application/executable::scvhost-executable-name-reference
