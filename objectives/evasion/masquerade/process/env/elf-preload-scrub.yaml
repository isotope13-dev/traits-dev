# A forking LD_PRELOAD payload that unsets LD_PRELOAD hides its own loader
# variable so child processes do not reload the implant. Referencing the
# variable, importing unsetenv, forking, and running commands through the C
# system API together is the cover-its-tracks shape: legitimate preload shims
# interpose library calls but never fork off a scrubbed shell. Requiring the
# system API keeps plain interposers (which unset nothing and run nothing)
# out; PT_INTERP keeps standalone executables out.
defaults:
  platforms: [linux]
  for: [elf]
  crit: hostile
  conf: 0.95
  attack: "T1036.004"

composite_rules:
  - id: ld-preload-fork-payload-env-scrub
    desc: Forking preload payload clears LD_PRELOAD
    all:
      - id: micro-behaviors/os/linker/env::ld-preload
      - id: micro-behaviors/os/env/modify::unsetenv
      - id: micro-behaviors/process/create/fork::fork
      - id: micro-behaviors/process/create/shell/spawn::system-fn
    unless:
      # Preload exploit payloads are shared objects (.so); standalone executables have PT_INTERP.
      - id: metadata/binary/linking/runtime::interpreter
      - id: well-known/app/ai/coding-agent/
      # Node native addons (.node) are shared libraries loaded via dlopen, not preload exploit shims.
      - id: metadata/binary/symbols/exports::node-api-addon-export
      - id: metadata/binary/framework::node-module-register-export
      - id: well-known/lib/ui/cef::cef-browser-engine
