# Literal brackets are supplied by the userspace program; genuine kernel
# threads have no userspace argv. Require the renaming call, not a name list.
defaults:
  platforms: [linux, openwrt, android]
  crit: suspicious
  conf: 0.99
  attack: T1036.004
  mbc: F0004

traits:
  - id: prctl-bracketed-kworker-name
    desc: PR_SET_NAME adopts bracketed kernel-worker title
    for: [c, cpp, rust]
    if:
      # Rust's byte-string .as_ptr() argument loses its literal shape in the
      # call projection. A call node also keeps comments and strings out.
      type: tree-sitter
      node: call_expression
      regex: '(^|::)prctl\s*\(\s*(\w{1,20}::)?(PR_SET_NAME|15)\s*,\s*b?"\[kworker/[^"\]\s]{1,24}\]'

  - id: setproctitle-bracketed-kernel-thread-name
    desc: Process-title call adopts kernel-thread title
    for: [python, ruby, php, perl, c, cpp]
    if:
      type: symbol
      kind: call
      regex: '(^|[.:])(setproctitle|cli_set_process_title|set_proc_title)$'
      arg:
        index: 0
        kind: string
        regex: '^\[(kworker/[^\]\s]{1,32}|(ksoftirqd|migration|watchdog)/[0-9]{1,5}|kswapd[0-9]{1,5}|rcu_\w{1,24}|kthreadd)\]$'
