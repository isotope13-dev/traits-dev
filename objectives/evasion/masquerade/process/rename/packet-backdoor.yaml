defaults:
  platforms: [linux]
  for: [c, cpp]

composite_rules:
  - id: packet-backdoor-process-renaming
    desc: Packet-triggered shell changes process name
    crit: hostile
    conf: 0.97
    attack: T1036.004,T1205
    # Require the packet-triggered shell, not just a packet-capture tool
    # changing its thread name. The replacement label is deliberately free.
    all:
      - id: objectives/command-and-control/backdoor/signal::raw-bpf-triggered-shell
      - id: micro-behaviors/process/info/current::set-process-name-prctl
