# Cryptominer arguments carried by a Windows system-image name. Windows shell
# processes such as explorer.exe, winlogon.exe, taskhostw.exe and lsass.exe take
# no dash/double-dash command-line flags in normal operation, so a mining
# argument on one of them means the miner was injected into (or masqueraded as)
# a trusted process -- Huntress observed SilentXMRMiner running RandomX under
# explorer.exe. Match the system-image-with-flag shape, then pair it with an
# XMRig argument.
defaults:
  platforms: [windows]
  for: [scripts, batch, powershell, pe]
  attack: T1036.004,T1055
traits:
  - id: windows-system-binary-flagged
    desc: Windows system image launched with a flag
    crit: component
    conf: 0.9
    if:
      type: text
      regex: '(?i)\b(explorer|winlogon|taskhostw|lsass|dwm)\.exe\s+--?[a-z]'
composite_rules:
  # A trusted Windows image name carrying XMRig arguments: injected/masqueraded
  # cryptominer. Legitimate Windows Explorer never takes mining flags.
  - id: miner-args-under-system-binary
    desc: Cryptominer arguments under a system image
    crit: hostile
    conf: 0.97
    attack: T1036.004,T1055,T1496
    scope: file
    near_bytes: 260
    all:
      - id: windows-system-binary-flagged
    any:
      - id: objectives/impact/cryptojacking/miner/runtime::xmrig-algo-randomx-arg
      - id: objectives/impact/cryptojacking/miner/runtime::xmrig-pool-url-arg
      - id: objectives/impact/cryptojacking/miner/runtime::xmrig-randomx-mode-arg
      - id: objectives/impact/cryptojacking/miner/runtime::xmrig-cpu-threads-hint-arg
      - id: objectives/impact/cryptojacking/miner/runtime::silentxmrminer-cinit-arg
