# A logging daemon does not consume a Stratum mining pool. Match the pool
# argument on the daemon-named invocation itself, not another command or a
# quoted example in the same script. The source reports syslog-ng camouflage;
# the other real logging daemon names cover the same impersonation technique.
defaults:
  platforms: [linux]
  for: [shell]
traits:
  - id: logging-daemon-stratum-command
    desc: Logging daemon command takes mining endpoint
    crit: suspicious
    conf: 0.98
    attack: T1036.004
    ref: https://securityaffairs.com/203504/hacking/u-s-cisa-adds-apache-axis-vanderbilt-redcapberriai-litellm-and-synology-dsm-flaws-to-its-known-exploited-vulnerabilities-catalog.html
    if:
      type: symbol
      kind: call
      regex: '(^["\x27]?|/)(syslog-ng|rsyslogd|systemd-journald)["\x27]?$'
      arg:
        kind: identifier
        name_regex: '^(--url=)?stratum\+(tcp|ssl)://'
  - id: emitted-logging-daemon-mining-command
    desc: Emits daemon-named mining command text
    crit: component
    if:
      type: symbol
      kind: call
      exact: echo
      arg:
        kind: string
        regex: '(syslog-ng|rsyslogd|systemd-journald)["\x27]?\s.{0,160}stratum\+(tcp|ssl)://'
