defaults:
  platforms: [linux]
  for: [shell]
composite_rules:
  - id: configured-miner-application-cache-concealment
    desc: Detached miner launch beside Plex-cache copying
    crit: hostile
    conf: 0.97
    attack: T1036
    all:
      - id: micro-behaviors/fs/path/cache::plex-media-server-cache-path
      - id: micro-behaviors/fs/file/copy/command::cp-command
      - id: micro-behaviors/process/daemonize/detach::detached-variable-config-command
      - id: metadata/file/profile/command-options::cpu-max-threads-hint-option-text
      - id: well-known/app/finance/xmrig::xmrig-product
