defaults:
  platforms: [unix]
  for: [elf, shell, text]
  attack: T1036.004
traits:
- id: top-basename
  desc: top process basename
  crit: component
  conf: 0.9
  if:
    type: path
    basename: true
    exact: top
- id: shell-renames-xmrig-top
  desc: Shell renames XMRig as top
  crit: suspicious
  conf: 0.95
  for: [shell, text]
  if:
    type: text
    regex: '\b(mv|cp)\b[^\n]{0,120}\bxmrig\b[^\n]{0,120}\btop\b'
- id: shm-top-execution
  desc: Executes top from shared memory
  crit: suspicious
  conf: 0.92
  if:
    type: text
    regex: '/dev/shm/[A-Za-z0-9._/-]{0,80}/top\b'
# A pool of system-component daemon names assigned in one shell run: installed
# monitor/cache/poll daemons are enumerated by operators by exact product name,
# never as a shuffled word list of naming-pattern lookalikes.
- id: shell-daemon-lookalike-name-pool
  desc: Pool of system-daemon lookalike names
  crit: component
  conf: 0.9
  for: [shell, text]
  if:
    type: text
    regex: '([a-z0-9]{2,12}-(mon|cache|polld|syncd|statsd)\s+){3}'
composite_rules:
- id: xmrig-masquerades-as-top
  desc: XMRig masquerades as top
  crit: suspicious
  conf: 0.98
  all:
  - id: top-basename
  any:
  - id: micro-behaviors/process/info/name::xmrig-product
- id: shell-stages-xmrig-as-top
  desc: Shell stages XMRig as top
  crit: hostile
  conf: 0.97
  for: [shell, text]
  all:
  - id: shell-renames-xmrig-top
  any:
  - id: shm-top-execution
  - id: micro-behaviors/process/create/shell/spawn::shell-execution-shm
  - id: objectives/impact/cryptojacking/miner/tunnel::ssh-local-mining-tunnel
# The other Linux miner masquerade shaping: instead of renaming an xmrig
# binary, the installer keeps the real binary but draws the process identity
# from a shuffled pool of system-daemon lookalikes, and writes the mining pool
# and wallet configuration in the same script. Randomizing the identity rules
# out operational daemon management; the pool plus the pick plus the mining
# configuration in one file is the masquerade-armed miner.
- id: random-daemon-lookalike-miner-masquerade
  desc: Miner config beside a shuffled fake daemon name pool
  crit: hostile
  conf: 0.97
  for: [shell, text]
  scope: file
  all:
  - id: shell-daemon-lookalike-name-pool
  - id: micro-behaviors/os/random/generator::shell-shuf-single-pick
  any:
  - id: micro-behaviors/data/config/syntax::json-donate-level-field
  - id: micro-behaviors/data/config/syntax::json-pools-array-field
  - id: micro-behaviors/data/format/crypto-address::hardcoded-monero-address
  needs: 1
  near_bytes: 4000
