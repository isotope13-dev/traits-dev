defaults:
  crit: suspicious
  platforms: [unix, windows]
  for: [jpeg]
  attack: T1027
composite_rules:
  - id: embedded-php-loader
    desc: JPEG masquerading as PHP loader
    conf: 0.98
    all:
      - id: micro-behaviors/data/embedded/payload/media::php-open-tag-in-media
      - id: micro-behaviors/crypto/decrypt/transform/unspecified::openssl-decrypt-call
  - id: corrupted-image-php-request-polyglot
    desc: Structurally altered image hides PHP request backdoor
    crit: hostile
    conf: 0.99
    for: [media, bmp]
    attack: T1027.009,T1505.003
    all:
      - id: micro-behaviors/data/embedded/payload/media::php-open-tag-in-media
      - id: metadata/file/format/media::media-structure-problem-reported
    any:
      - id: micro-behaviors/data/embedded/payload/media::php-request-command-call
      - id: micro-behaviors/data/embedded/payload/media::php-request-pipe-command-call
      - id: micro-behaviors/data/embedded/payload/media::php-request-eval-call
      - id: micro-behaviors/data/embedded/payload/media::php-request-assert-call
