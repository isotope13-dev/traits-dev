defaults:
  platforms: [unix, windows]
  for: [binaries]
  crit: notable
  conf: 0.1
traits:
  - id: pe-masquerading-as-image
    crit: notable
    for: [text]
    desc: compatibility placeholder
    if:
      type: text
      exact: __cleave_missing_5d9e836d78fb__

composite_rules:
  - id: pe-image-carrier-masquerade
    desc: PE masquerades as image carrier
    crit: hostile
    conf: 0.96
    attack: T1036
    ref: sha256:b38ed78c2328a41c8a08e3b6d508edff3ca75b8101cb517b0891be47a14a48e3
    for: [pe, dll]
    all:
      - id: micro-behaviors/data/embedded/media::photoshop-xmp-conversion-corpus
      - id: metadata/binary/anomaly/format::pe-dos-stub-modified
      - id: metadata/binary/metrics/structural::pe-section-overflow-present
    any:
      - id: metadata/binary/anomaly/format::pe-misaligned-section
      - id: metadata/binary/layout::pe-checksum-mismatch

  - id: pe-photoshop-exif-shell-masquerade
    desc: Malformed VB6 shell program carrying Photoshop image metadata
    crit: hostile
    conf: 0.98
    attack: T1036,T1059
    for: [pe, dll]
    all:
      - id: micro-behaviors/data/embedded/media::photoshop-cc-2018-metadata
      - id: metadata/binary/anomaly/format::pe-dos-stub-modified
      - id: metadata/binary/metrics/structural::pe-section-overflow-present
      - id: micro-behaviors/process/create/shell/lang::vb6-shell-execution
    any:
      - id: metadata/binary/anomaly/format::pe-misaligned-section
      - id: metadata/binary/layout::pe-checksum-mismatch
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/installer/
