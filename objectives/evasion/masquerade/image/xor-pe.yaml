defaults:
  for: [gif]
  platforms: [windows]
composite_rules:
  - id: gif-conceals-xor-pe
    desc: Invalid GIF conceals encrypted Windows executable
    crit: hostile
    conf: 0.99
    attack: T1027,T1036
    all:
      - id: metadata/file/magic/identity::gif-magic-header
      - id: metadata/file/format/media::media-structure-problem-reported
      - id: metadata/file/encoding/xor::validated-repeating-xor-pe
