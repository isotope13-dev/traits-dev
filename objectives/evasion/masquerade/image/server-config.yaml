# Server configuration wearing image magic: the GIF signature opens a file
# whose body is PHP server configuration, so an upload filter that sniffs
# magic bytes passes a webshell persistence drop. The inverse of the
# image-embedded-payload rules -- here the config is the payload and the
# image is only a prefix.
defaults:
  platforms: [unix, windows]
  for: [php, text]
  attack: T1027
composite_rules:
  - id: image-magic-fronted-php-config
    desc: Image magic fronts PHP server config
    crit: hostile
    conf: 0.95
    all:
      - id: metadata/file/magic/identity::gif-magic-header
      - id: objectives/command-and-control/backdoor/webshell/config::userini-auto-prepend-directive
    any:
      - id: objectives/command-and-control/backdoor/webshell/config::userini-auto-append-directive
      - id: objectives/command-and-control/backdoor/webshell/config::prepend-image-file-target
