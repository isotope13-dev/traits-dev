defaults:
  platforms: [unix, windows]
  for: [ruby]
  conf: 0.99
traits:
  - id: ruby-shell-content-jpeg-upload
    desc: Wraps shell content in JPEG upload
    crit: suspicious
    if:
      type: tree-sitter
      language: ruby
      query: |
        (class body: (body_statement
          (method name: (identifier) @upload
            parameters: (method_parameters . (identifier) . (identifier) @data .)
            body: (body_statement
              (binary left: (identifier) @body operator: "<<" right: (string) @image_header)
              (binary left: (identifier) @body1 operator: "<<"
                right: (string (interpolation (identifier) @data1)))))
          (method body: (body_statement
            (if alternative: (else
              (call method: (identifier) @upload_call
                arguments: (argument_list . (_) . (parenthesized_statements (string) @shell_content) .)))))))
          (#eq? @upload @upload_call) (#eq? @data @data1) (#eq? @body @body1)
          (#match? @image_header "Content-Type: image/jpeg")
          (#match? @shell_content "^\"#!/bin/bash")) @disguised_upload

composite_rules:
  - id: ruby-exploit-shell-upload-as-jpeg
    desc: Exploit module wraps shell content as a JPEG upload
    crit: hostile
    all:
      - id: ruby-shell-content-jpeg-upload
      - id: well-known/tool/offensive/metasploit::remote-exploit-class-declaration
