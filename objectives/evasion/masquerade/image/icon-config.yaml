# Sogou's decrypted brand dictionary configuration uses icon= as a download
# destination, followed by a checksum and source URL. Require that record shape:
# autorun.inf can legitimately use an EXE as its displayed icon resource.
# Names, servers, hashes and version numbers are deliberately unrestricted.
defaults:
  platforms: [windows]
  for: [text]
traits:
  - id: icon-config-executable-destination
    desc: Icon download targets an executable file
    crit: suspicious
    conf: 0.96
    if:
      type: text
      case_insensitive: true
      regex: '(?m)^icon=[^\r\n]{1,512}\.(exe|dll)\r?\nmd5=[\da-f]{32}\r?\nurl=https?://'
