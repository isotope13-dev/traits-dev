# An image URL fetched into a file named for a native executable: the server
# path claims an image while the client stores a program. FishPig's Magento
# backdoor fetched `lic.png` as `lic.bin`, chmodded and ran it. Either order of
# the URL and curl/wget output option is accepted; names are unrestricted.
defaults:
  platforms: [unix]
  for: [scripts, source]
  attack: T1036.008,T1105
traits:
  - id: image-url-saved-as-binary
    desc: Image URL saved as .bin or .elf
    crit: suspicious
    conf: 0.93
    if:
      type: text
      regex: '(?i)\.(png|jpe?g|gif)[''"]?\s+-[oO]\s*[''"]?[\w./-]{1,60}\.(bin|elf)\b'
  - id: binary-output-from-image-url
    desc: Binary-named output fetched from image URL
    crit: suspicious
    conf: 0.93
    if:
      type: text
      regex: '(?i)\s-[oO]\s*[''"]?[\w./-]{1,60}\.(bin|elf)[''"]?\s+\S{1,200}\.(png|jpe?g|gif)\b'
composite_rules:
  # One composite per argument order, so the masquerade is always required;
  # either executable-chmod spelling (relative or absolute target) completes it.
  - id: image-download-made-executable
    desc: Image URL saved as a binary, then made executable
    crit: hostile
    conf: 0.96
    near_bytes: 200
    all:
      - id: image-url-saved-as-binary
    any:
      - id: micro-behaviors/fs/chmod/executable/mode::chmod-exec-literal-target
      - id: micro-behaviors/fs/chmod/executable/mode::chmod-exec-absolute-path
  - id: binary-output-image-download-made-executable
    desc: Binary output fetched from an image URL is made executable
    crit: hostile
    conf: 0.96
    near_bytes: 200
    all:
      - id: binary-output-from-image-url
    any:
      - id: micro-behaviors/fs/chmod/executable/mode::chmod-exec-literal-target
      - id: micro-behaviors/fs/chmod/executable/mode::chmod-exec-absolute-path
