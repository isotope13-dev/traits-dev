# A "self-hosted" or "your own server" proxy claim is a promise that the
# destination is user-controlled. A hardcoded, non-configurable endpoint
# constant contradicts that promise on its face — a genuinely self-hosted
# tool needs a settings field for the user's own host, not a literal URL.
defaults:
  platforms: [windows, unix]
  attack: T1036

traits:
  - id: self-hosted-proxy-claim
    desc: Manifest claims a self-hosted proxy
    crit: notable
    conf: 0.85
    for: [chrome-manifest]
    if:
      type: value
      path: description
      regex: '(?i)self[- ]hosted'

composite_rules:
  - id: self-hosted-proxy-claim-mismatch
    desc: Claims self-hosted proxy but hardcodes endpoint
    crit: suspicious
    conf: 0.9
    for: [javascript, typescript, chrome-manifest]
    scope: archive
    all:
      - id: self-hosted-proxy-claim
      - id: micro-behaviors/communications/proxy/config::proxy-endpoint-url-setting

  - id: deceptive-self-hosted-proxy-hijack
    desc: Deceptive self-hosted claim hijacks all traffic
    crit: hostile
    conf: 0.95
    attack: T1036,T1090
    for: [javascript, typescript, chrome-manifest]
    scope: archive
    all:
      - id: self-hosted-proxy-claim-mismatch
      - id: objectives/collection/network/proxy::extension-all-nav-remote-proxy-redirect
