defaults:
  for: [python]
  platforms: [unix, windows]

composite_rules:
  - id: python-png-post-as-jpeg
    desc: POST sends PNG bytes under a JPEG Content-Type
    crit: suspicious
    conf: 0.97
    attack: T1001.003
    # All three legs report the call's start, so an adjacent JPEG request
    # cannot supply the content type for a correctly typed PNG upload.
    near_bytes: 1
    all:
      - id: micro-behaviors/communications/http/request/body/media::urllib-png-body
      - id: micro-behaviors/communications/http/header/content-type::python-call-jpeg-header
      - id: micro-behaviors/communications/http/request/verb::urllib-request-post
