# HTTP Content-Type / Body Masquerade
# Detects C2 agents that claim application/x-www-form-urlencoded Content-Type
# but actually send a base64-encoded (and often JSON-serialized) body.
# This confuses network inspection tools expecting key=value form data.
# ATT&CK: T1001.003 (Protocol Impersonation), T1071.001 (Web Protocols)
defaults:
  platforms: [windows, unix]
  attack: T1001.003
  for: [python, javascript, go, php, powershell]
traits:
- id: base64-encoded-post-body--rx-1
  desc: Regex component marker
  crit: component
  conf: 0.8
  if:
    type: text
    regex: '(?i)(b64encode|ToBase64String)\b.{0,300}(post|upload)'
  count_max: 1027738
- id: base64-encoded-post-body--rx-2
  desc: Regex component marker
  crit: component
  conf: 0.8
  if:
    type: text
    regex: '(?i)(b64encode|ToBase64String)\b.{0,300}(send|UploadData)'
  count_max: 1027739
- id: base64-encoded-post-body--rx-3
  desc: Regex component marker
  crit: component
  conf: 0.8
  if:
    type: text
    regex: '(?i)(b64encode|ToBase64String)\b.{0,300}(request)'
  count_max: 1027740
- id: base64-encoded-post-body--rx-4
  desc: Regex component marker
  crit: component
  conf: 0.8
  if:
    type: text
    regex: '(?i)(base64\.StdEncoding\.EncodeToString|btoa)\b.{0,300}(post|upload)'
  count_max: 1027741
- id: base64-encoded-post-body--rx-5
  desc: Regex component marker
  crit: component
  conf: 0.8
  if:
    type: text
    regex: '(?i)(base64\.StdEncoding\.EncodeToString|btoa)\b.{0,300}(send|UploadData)'
  count_max: 1027742
- id: base64-encoded-post-body--rx-6
  desc: Regex component marker
  crit: component
  conf: 0.8
  if:
    type: text
    regex: '(?i)(base64\.StdEncoding\.EncodeToString|btoa)\b.{0,300}(request)'
  count_max: 1027743
- id: base64-encoded-post-body--rx-7
  desc: Regex component marker
  crit: component
  conf: 0.8
  if:
    type: text
    # Require a non-identifier boundary before post/upload so `$_POST` /
    # `$post_data` cannot satisfy the token (HTTP Basic auth FP).
    regex: '(?i)(base64_encode)\b.{0,300}([^A-Za-z0-9_$]|^)(post|upload)\b'
  count_max: 1027744
- id: base64-encoded-post-body--rx-8
  desc: Regex component marker
  crit: component
  conf: 0.8
  if:
    type: text
    regex: '(?i)(base64_encode)\b.{0,300}(send|UploadData)'
  count_max: 1027745
- id: base64-encoded-post-body--rx-9
  desc: Regex component marker
  crit: component
  conf: 0.8
  if:
    type: text
    regex: '(?i)(base64_encode)\b.{0,300}([^A-Za-z0-9_$]|^)(request)\b'
  count_max: 1027746
- id: json-before-base64-encode--rx-10
  desc: Regex component marker
  crit: component
  conf: 0.9
  if:
    type: text
    regex: '(json\.dumps|ConvertTo-Json).{0,400}(b64encode|ToBase64String)'
  count_max: 1027747
- id: json-before-base64-encode--rx-11
  desc: Regex component marker
  crit: component
  conf: 0.9
  if:
    type: text
    regex: '(json\.dumps|ConvertTo-Json).{0,400}(base64\.StdEncoding|btoa)'
  count_max: 1027748
- id: json-before-base64-encode--rx-12
  desc: Regex component marker
  crit: component
  conf: 0.9
  if:
    type: text
    regex: '(json\.Marshal|JSON\.stringify).{0,400}(b64encode|ToBase64String)'
  count_max: 1027749
- id: json-before-base64-encode--rx-13
  desc: Regex component marker
  crit: component
  conf: 0.9
  if:
    type: text
    regex: '(json\.Marshal|JSON\.stringify).{0,400}(base64\.StdEncoding|btoa)'
  count_max: 1027750
- id: json-before-base64-encode--rx-14
  desc: Regex component marker
  crit: component
  conf: 0.9
  if:
    type: text
    regex: '(json\.encode).{0,400}(b64encode|ToBase64String|base64\.StdEncoding|btoa)'
  count_max: 1027751
- id: json-before-base64-encode--rx-15
  desc: Base64 encoding of JSON output marker
  crit: component
  conf: 0.9
  if:
    type: text
    regex: '(b64encode|ToBase64String).{0,400}(json\.dumps|ConvertTo-Json)'
  count_max: 1027752
- id: json-before-base64-encode--rx-16
  desc: Regex component marker
