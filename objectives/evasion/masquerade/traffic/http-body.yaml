  count_max: 1027754
- id: json-before-base64-encode--rx-18
  desc: JSON stringify before Base64 encoding
  crit: component
  conf: 0.9
  if:
    type: text
    regex: '(base64\.StdEncoding|btoa).{0,400}(json\.Marshal|JSON\.stringify)'
  count_max: 1027755
composite_rules:
- id: http-content-type-masquerade
  desc: HTTP POST claims form encoding but sends base64 body
  crit: suspicious
  conf: 0.92
  near_bytes: 2000
  all:
  - id: micro-behaviors/communications/http/post::url-encoded-content-type
  - id: base64-encoded-post-body
  unless:
  - id: mailgun-urlencoded-basic-auth
  - id: well-known/lib/ui/swagger-ui/
  - id: metadata/library/structure/
  - id: metadata/package/quality/benign-context::benign-trojanized-fp-context
  - id: metadata/package/files/dependency::node-modules-path
  - id: objectives/anti-static/obfuscation/payload/container::source-map-extension
  - id: metadata/library/vue/
  - id: metadata/lang/encoded/unicode-escape::unicode-escape-js-basename
- id: http-json-as-form-data
  desc: HTTP POST sends JSON as base64 claiming form encoding
  crit: suspicious
  conf: 0.9
  near_bytes: 2000
  all:
  - id: micro-behaviors/communications/http/post::url-encoded-content-type
  - id: json-before-base64-encode
  - id: base64-encoded-post-body
  unless:
  - id: mailgun-urlencoded-basic-auth
  - id: well-known/lib/ui/swagger-ui/
  - id: metadata/build/bundler/
  - id: metadata/library/structure/
  - id: metadata/package/files/dependency::node-modules-path
  - id: objectives/anti-static/obfuscation/payload/container::source-map-extension
- id: base64-encoded-post-body
  desc: Base64 encoding near HTTP POST
  crit: notable
  conf: 0.8
  any:
  - id: base64-encoded-post-body--rx-1
  - id: base64-encoded-post-body--rx-2
  - id: base64-encoded-post-body--rx-3
  - id: base64-encoded-post-body--rx-4
  - id: base64-encoded-post-body--rx-5
  - id: base64-encoded-post-body--rx-6
  - id: base64-encoded-post-body--rx-7
  - id: base64-encoded-post-body--rx-8
  - id: base64-encoded-post-body--rx-9
  not:
  - regex: 'Authorization\s*:\s*`Basic\s+\$\{[^}]+\}`'
  - substr: api.mailgun.net
  # PHP Basic auth builds `Authorization => Basic ` + base64_encode($_POST...)
  # — credential encoding, not a masqueraded form body. Also drop the common
  # false hit where `(post|upload)` matches inside `$_POST`.
  - regex: '(?i)base64_encode\s*\(\s*\$_POST'
  - regex: "(?i)Authorization['\"]?\\s*=>\\s*.{0,80}Basic.{0,120}base64_encode"
  unless:
  - id: mailgun-urlencoded-basic-auth
  - id: micro-behaviors/communications/http/url/query::js-urlsearchparams-construction
  - id: micro-behaviors/communications/http/request/beacon::browser-send-beacon-call
- id: json-before-base64-encode
  desc: JSON-serialize then base64-encode for HTTP body
  crit: component
  conf: 0.9
  any:
  - id: json-before-base64-encode--rx-10
  - id: json-before-base64-encode--rx-11
  - id: json-before-base64-encode--rx-12
  - id: json-before-base64-encode--rx-13
  - id: json-before-base64-encode--rx-14
  - id: json-before-base64-encode--rx-15
  - id: json-before-base64-encode--rx-16
  - id: json-before-base64-encode--rx-17
  - id: json-before-base64-encode--rx-18
  unless:
  - id: objectives/anti-static/obfuscation/payload/container::source-map-extension
  - id: micro-behaviors/communications/http/url/query::js-urlsearchparams-construction
  - id: micro-behaviors/communications/http/request/beacon::browser-send-beacon-call
  - id: metadata/file/format/structured::sourcemap-sources-content
  # Inline `//# sourceMappingURL=data:application/json;...;base64,` — a bundler
  # source map, not a masqueraded HTTP body. Previously a local duplicate of this
  # matcher lived here at `crit: notable` with the desc "Regex component marker",
  # which surfaced in triage as a meaningless evasion/masquerade finding on any
  # bundled JS. Use the canonical metadata marker instead.
  - id: metadata/file/format/structured::sourcemap-inline-base64
  not:
  - substr: 'from"./chunk-'
  - substr: 'btoa(unescape(encodeURIComponent'
  - substr: 'http://example.com/ffmpeg-core.js#{btoa(JSON.stringify({'
  - substr: 'createResponse(t,o,n){let a={from:'
  - substr: 'payload:JSON.stringify({method:n,path:a,body:p,headers:i})'
- id: mailgun-urlencoded-basic-auth
  desc: Mailgun urlencoded Basic auth post
  crit: notable
  conf: 0.9
  near_bytes: 2400
  all:
  - type: trait
    id: micro-behaviors/communications/http/services/mailgun::mailgun-api-domain
  - type: trait
    id: micro-behaviors/communications/http/post::url-encoded-content-type
