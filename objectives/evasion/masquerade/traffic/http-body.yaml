# Detects a contradictory HTTP body: code claims URL-encoded form data while
# sending Base64, optionally after JSON serialization.
defaults:
  crit: suspicious
  platforms: [windows, unix]
  attack: T1001.003
  for: [python, javascript, go, php, powershell]

composite_rules:
- id: http-content-type-masquerade
  for: [python, javascript, php, powershell]
  desc: HTTP POST claims form encoding but sends base64 body
  crit: suspicious
  conf: 0.92
  near_bytes: 2000
  all:
  - id: micro-behaviors/communications/http/header/content-type::url-encoded-content-type
  - id: micro-behaviors/communications/http/request/body::base64-encoded-post-body
  unless:
  # AWS SigV4 signing proxies an STS form-encoded request inside a JSON
  # body wrapped in base64 (machine-identity auth); recognized signer
  # context, not traffic masquerade.
  - id: well-known/lib/cloud/botocore::sigv4-auth-import
  - id: micro-behaviors/communications/http/request/body::mailgun-urlencoded-basic-auth
  - id: metadata/lang/source/naming/interface::swagger-ui-api-reference
  # metadata/build/ (below) already covers recognized-contexts descendants;
  # the benign-trojanized-fp-context leaf was redundant and exceeded the
  # suppression budget once the SigV4 context was added.
  - id: metadata/build/
  - id: metadata/package/files/dependency::node-modules-path
  - id: metadata/file/format/source-map::sourcemap
  - id: well-known/lib/web/
  - id: well-known/lib/ui/ckeditor/distribution/
  - id: metadata/lang/encoded/unicode-escape::unicode-escape-js-basename

- id: http-json-as-form-data
  for: [python, javascript, php, powershell]
  desc: HTTP POST sends JSON as base64 claiming form encoding
  crit: suspicious
  conf: 0.9
  near_bytes: 2000
  all:
  - id: micro-behaviors/communications/http/header/content-type::url-encoded-content-type
  - id: micro-behaviors/data/encode/base64::json-base64-text-proximity
  - id: micro-behaviors/communications/http/request/body::base64-encoded-post-body
  unless:
  # AWS SigV4 signing proxies an STS form-encoded request inside a JSON
  # body wrapped in base64 (machine-identity auth); recognized signer
  # context, not traffic masquerade.
  - id: well-known/lib/cloud/botocore::sigv4-auth-import
  - id: micro-behaviors/communications/http/request/body::mailgun-urlencoded-basic-auth
  - id: metadata/lang/source/naming/interface::swagger-ui-api-reference
  - id: metadata/build/
  - id: metadata/package/files/dependency::node-modules-path
  - id: metadata/file/format/source-map::sourcemap
