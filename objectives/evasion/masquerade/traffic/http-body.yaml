# Detects a contradictory HTTP body: code claims URL-encoded form data while
# sending Base64, optionally after JSON serialization.
defaults:
  crit: suspicious
  platforms: [windows, unix]
  attack: T1001.003
  for: [python, javascript, go, php, powershell]

composite_rules:
- id: http-content-type-masquerade
  for: [python, javascript, php, powershell]
  desc: HTTP POST claims form encoding but sends base64 body
  crit: suspicious
  conf: 0.92
  near_bytes: 2000
  all:
  - id: micro-behaviors/communications/http/post::url-encoded-content-type
  - id: micro-behaviors/communications/http/request/body::base64-encoded-post-body
  unless:
  - id: micro-behaviors/communications/http/request/body::mailgun-urlencoded-basic-auth
  - id: well-known/lib/ui/swagger-ui/
  - id: metadata/build/
  - id: metadata/build/recognized-contexts::benign-trojanized-fp-context
  - id: metadata/package/files/dependency::node-modules-path
  - id: metadata/file/format/structured::sourcemap
  - id: well-known/lib/web/
  - id: metadata/lang/encoded/unicode-escape::unicode-escape-js-basename

- id: http-json-as-form-data
  for: [python, javascript, php, powershell]
  desc: HTTP POST sends JSON as base64 claiming form encoding
  crit: suspicious
  conf: 0.9
  near_bytes: 2000
  all:
  - id: micro-behaviors/communications/http/post::url-encoded-content-type
  - id: micro-behaviors/communications/http/request/body::json-before-base64-encode
  - id: micro-behaviors/communications/http/request/body::base64-encoded-post-body
  unless:
  - id: micro-behaviors/communications/http/request/body::mailgun-urlencoded-basic-auth
  - id: well-known/lib/ui/swagger-ui/
  - id: metadata/build/
  - id: metadata/package/files/dependency::node-modules-path
  - id: metadata/file/format/structured::sourcemap
