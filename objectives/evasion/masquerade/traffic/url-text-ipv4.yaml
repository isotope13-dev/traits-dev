defaults:
  platforms: [windows, unix]
  for: [html]
traits:
  - id: url-text-numeric-href
    desc: URL text masks a numeric href
    crit: suspicious
    conf: 0.96
    if:
      type: text
      case_insensitive: true
      exclude_html_comments: true
      regex: '<a\b[^>]{0,60}href\s*=(3D)?\s*["'']?https?://[\d.]+[^>]{0,999}>\s*https?://[a-z]'
    not:
      - regex: '//\.'
      - regex: '//(10\.|127\.|192\.168\.)'
      - regex: '//172\.(1[6-9]|2\d|3[01])\.'
      - regex: '//0\.0\.0\.0'
    unless:
      - id: micro-behaviors/ui/window/html::bulk-mail-furniture-reference
