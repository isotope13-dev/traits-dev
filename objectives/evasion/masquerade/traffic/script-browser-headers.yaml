# A server-side script dressing its HTTP client up as an interactive browser.
#
# Node and Python clients send their own default User-Agent; replacing it with
# a browser UA *and* copying a browser's HTML `Accept` header is a deliberate
# attempt to make the request indistinguishable from someone browsing, so that
# egress filtering, WAFs, and the operator of the fetched resource all see
# ordinary web traffic. The 2018 eslint-scope loader carried a verbatim
# Firefox 52 UA and Accept pair on a `https.get` for its second stage.
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript, python, php, ruby, shell]
  attack: T1071.001
  mbc: B0030

traits:
  - id: browser-html-accept-header
    desc: Browser HTML Accept header literal
    crit: component
    conf: 0.8
    if:
      type: text
      regex: 'text/html,\s*application/xhtml\+xml'

composite_rules:
  # Fetching a page with a browser UA *and* a browser HTML `Accept` header is
  # what a stage-two loader does to blend into web traffic, but it is equally
  # what every scraper and page-summarising agent tool does to be served the
  # HTML a browser would get (LangChain's `WebBrowser` tool ships this exact
  # header pair). The pair alone therefore records how the client presents
  # itself, not an intent to evade -- it is evidence for an evasion composite,
  # not a finding that stands on its own.
  - id: script-client-browser-header-pair
    desc: HTTP client sends browser User-Agent and Accept headers
    crit: notable
    conf: 0.9
    scope: file
    all:
      - id: browser-html-accept-header
      - id: micro-behaviors/communications/http/user-agent::browser-mozilla-5-0
      - id: micro-behaviors/communications/http/request/client/
    unless:
      - id: metadata/package/testing/
      - id: metadata/package/testing/presence/manifest::test-fixtures
