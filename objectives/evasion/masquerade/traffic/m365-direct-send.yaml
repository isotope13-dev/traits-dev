# Microsoft 365 Direct Send is legitimate for printers and legacy devices, so
# anonymous Exchange transport is not malicious by itself. Requiring the
# Exchange Online route plus independent authentication failures identifies
# the abuse pattern without matching lure prose, sender names, or one campaign.
defaults:
  platforms: [windows, unix]
  for: [text, html, data]
  attack: T1036

composite_rules:
  - id: m365-direct-send-spf-failure
    desc: M365 Direct Send message fails SPF
    crit: suspicious
    conf: 0.97
    all:
      - id: micro-behaviors/communications/email/auth::exchange-online-received
      - id: micro-behaviors/communications/email/auth::exchange-frontend-transport
      - id: micro-behaviors/communications/email/auth::exchange-authas-anonymous
      - id: micro-behaviors/communications/email/auth::authentication-results-spf-fail
    near_lines: 12

  - id: anonymous-exchange-multi-auth-failure
    desc: Anonymous Exchange mail fails layered authentication
    crit: suspicious
    conf: 0.98
    all:
      - id: micro-behaviors/communications/email/auth::exchange-authas-anonymous
      - id: micro-behaviors/communications/email/auth::authentication-results-spf-fail
      - id: micro-behaviors/communications/email/auth::authentication-results-dkim-none
      - id: micro-behaviors/communications/email/auth::authentication-results-dmarc-unenforced
      - id: micro-behaviors/communications/email/auth::exchange-composite-auth-fail
