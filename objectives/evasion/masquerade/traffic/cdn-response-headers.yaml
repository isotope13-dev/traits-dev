# A client POST carrying CloudFront's response-only headers dresses its
# traffic as CDN chatter, so a proxy log or reviewer skims past it. Edge
# functions set these on responses, not on outbound fetches. Seen in
# @solana/web3.js 1.95.7 (2024), whose key-stealing request used them.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  attack: T1036,T1001.003

composite_rules:
  - id: client-post-forges-cloudfront-headers
    desc: Client POST forges CloudFront response headers
    crit: suspicious
    conf: 0.9
    near_bytes: 400
    all:
      - id: micro-behaviors/communications/http/header/custom::js-cloudfront-header-map-entry
    any:
      - id: micro-behaviors/communications/http/post::fetch-post-call
      - id: micro-behaviors/communications/http/request/client::fetch-post-pattern
      - id: micro-behaviors/communications/http/post::request-options-post-method
