# Userinfo resembling a host can disguise the actual destination after @.
# An encoded dot that still leaves a readable host label compounds that
# deception. A percent byte with no following label is not this presentation.
# This identifies suspicious URL presentation, not a specific exploit.
defaults:
  for: [html]
  platforms: [windows, unix]
traits:
  - id: iframe-userinfo-escaped-destination
    desc: Iframe masks host with userinfo and escapes
    crit: suspicious
    conf: 0.97
    if:
      type: text
      regex: '<iframe[^>]{0,80}src=[''"]https?://[^/@''"]{1,80}@[^/?#''"]{0,80}%2e[a-z0-9]'
      case_insensitive: true
      exclude_html_comments: true
  - id: interval-blanks-browser-status
    desc: Timer repeatedly blanks browser link status
    crit: suspicious
    conf: 0.95
    if:
      type: text
      regex: 'setInterval\(["''](self|window)\.status\s*=\s*[''"]\s*[''"]'
      exclude_html_comments: true
  # Anchors use the same userinfo disguise as the iframe atom above, but
  # aimed at a raw numeric host: no readable label is left at all, only
  # the decoy before @. Private-range auth URLs (router logins) are the
  # legitimate idiom and are excluded.
  - id: anchor-userinfo-numeric-destination
    desc: Link masks numeric host with userinfo
    crit: suspicious
    conf: 0.96
    if:
      type: text
      regex: '(?i)<a\b[^>]{0,200}\bhref\s*=\s*["'']?https?://[^"''<>/?#]{1,80}@\d{1,3}\.\d{1,3}'
      exclude_html_comments: true
    not:
      # The match span ends after the second octet, so these carry no
      # trailing dot. All three ranges are entirely RFC 1918 private.
      - regex: '192\.168'
      - regex: '10\.\d{1,3}'
      - regex: '172\.(1[6-9]|2\d|3[01])'
  # Userinfo ends at the first `/`, `?` or `#`; an `@` after that is path or
  # query text (a Mastodon profile URL `host/@user@instance`), not a decoy.
  - id: anchor-userinfo-domain-destination
    desc: Link masks domain host with userinfo
    crit: suspicious
    conf: 0.96
    if:
      type: text
      regex: '(?i)<a\b[^>]{0,80}\bhref[^a-z0-9>]{1,5}h?ttps?://[^@<>\s/?#]{2,50}@[a-z0-9.-]+\.[a-z]{2,}'
      exclude_html_comments: true
composite_rules:
  - id: encoded-ip-imagemap-destination
    desc: Image map hides IP destination with encoding
    crit: hostile
    conf: 0.96
    near_bytes: 600
    all:
      - id: micro-behaviors/communications/ip/literal::percent-encoded-ip-destination
      - id: micro-behaviors/ui/window/html::html-area-href-attribute
      - id: micro-behaviors/ui/window/html::html-image-usemap
  - id: mouseover-status-formatted-url-spoof
    desc: Mouseover status spoofs a formatted URL link
    crit: hostile
    conf: 0.96
    near_bytes: 400
    all:
      - id: micro-behaviors/ui/window/state::mouseover-status-url-assignment
      - id: micro-behaviors/ui/window/html::url-text-anchor-inline-formatted
  - id: userinfo-numeric-link-status-spoof
    desc: Masked numeric link spoofs status preview
    crit: hostile
    conf: 0.95
    near_bytes: 1000
    all:
      - id: anchor-userinfo-numeric-destination
      - id: micro-behaviors/ui/window/state::status-bar-url-assignment
  - id: userinfo-domain-link-url-deception
    desc: Masked domain link pairs with URL link text
    crit: hostile
    conf: 0.96
    attack: T1566.002
    all:
      - id: anchor-userinfo-domain-destination
      - id: micro-behaviors/ui/window/html::url-text-anchor
  # The page threatens suspension and shows a login.html URL whose href
  # is a different address.
  - id: suspension-login-url-off-href
    desc: Suspension lure shows another login URL
    crit: hostile
    conf: 0.95
    attack: T1566.002
    near_bytes: 2000
    all:
      - id: micro-behaviors/ui/window/html::login-html-text-off-href
      - id: micro-behaviors/ui/window/markup::account-suspension-threat-pretext
    unless:
      - id: micro-behaviors/ui/window/html::bulk-mail-furniture-reference
