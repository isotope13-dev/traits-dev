# Userinfo resembling a host can disguise the actual destination after @.
# An encoded dot that still leaves a readable host label compounds that
# deception. A percent byte with no following label is not this presentation.
# This identifies suspicious URL presentation, not a specific exploit.
defaults:
  for: [html]
  platforms: [windows, unix]
traits:
  - id: iframe-userinfo-escaped-destination
    desc: Iframe masks host with userinfo and escapes
    crit: suspicious
    conf: 0.97
    if:
      type: text
      regex: '<iframe[^>]{0,80}src=[''"]https?://[^/@''"]{1,80}@[^/?#''"]{0,80}%2e[a-z0-9%]'
      case_insensitive: true
      exclude_html_comments: true
  - id: interval-blanks-browser-status
    desc: Timer repeatedly blanks browser link status
    crit: suspicious
    conf: 0.95
    if:
      type: text
      regex: 'setInterval\(["''](self|window)\.status\s*=\s*[''"]\s*[''"]'
      exclude_html_comments: true
