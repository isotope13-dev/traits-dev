# RustyAttr (Lazarus Group) Trojan Detection
# Reference: /home/t.linux/data/known-bad/datasets/malcontent-samples/macOS/2024.RustyAttr/localfile~.arm64
# ATT&CK: T1106, T1140, T1027.002
defaults:
  platforms: [macos]
composite_rules:
  - id: macos-rustyattr-binary
    desc: Signed app references extended attributes
    crit: suspicious
    conf: 0.9
    all:
      - {id: metadata/build/framework}
      - {id: 'micro-behaviors/fs/attributes/xattr::xattr-get-getxattr'}
