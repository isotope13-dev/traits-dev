# Feed twin of wordpress-root-library.yaml. WordPress serves enqueued
# scripts from wp-includes/ or wp-content/ with a `?ver=x.y.z` cache key,
# and never places them inside a post body. A WordPress feed whose post
# markup loads a single root-path script from a remote host carrying that
# same `?ver=` key shows a loader dressed as an enqueued asset so a page
# owner skimming the source mistakes it for theme or plugin output.
# Counterexample: shortcode output that keeps its wp-content plugin path,
# or a versioned asset in a non-WordPress feed.
defaults:
  platforms: [windows, unix]
  for: [xml]
  attack: T1036.005

composite_rules:
  - id: wordpress-feed-post-versioned-root-script
    desc: WordPress feed post loads fake versioned asset
    crit: suspicious
    conf: 0.93
    all:
      - id: micro-behaviors/data/format/xml::syndication-feed-root
      - id: micro-behaviors/data/format/xml::wordpress-feed-generator
      - id: micro-behaviors/data/format/xml::feed-markup-root-path-versioned-script
