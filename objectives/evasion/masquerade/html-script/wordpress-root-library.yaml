# WordPress enqueues every script from wp-includes/ or wp-content/. A
# library-named script loaded straight from the site root on a WordPress
# page did not come from core or a theme -- it is the usual shape of an
# injected loader dressed as vue.min.js or jquery.js.
defaults:
  for: [html]
  platforms: [windows, unix]
  attack: T1036.005

composite_rules:
  - id: wordpress-page-root-library-script
    desc: WordPress page loads library-named root script
    crit: suspicious
    conf: 0.85
    all:
      - id: micro-behaviors/process/deploy::root-library-named-script-src
      - id: micro-behaviors/communications/http/request/wordpress::rest-endpoint-url
