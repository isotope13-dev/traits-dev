defaults:
  platforms: [windows, unix]
  for: [html, javascript]
  attack: T1036
composite_rules:
  - id: image-script-hides-errors
    desc: Image script load swallows page errors
    crit: hostile
    conf: 0.96
    near_bytes: 400
    all:
      - id: micro-behaviors/communications/http/client/resource::image-extension-script-source
      - id: micro-behaviors/data/control-flow/error-handling::onerror-after-return-true
