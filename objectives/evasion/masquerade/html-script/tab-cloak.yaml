# Tab cloaking: a page that borrows a school or productivity site's favicon
# (fetched from Google's favicon service) so the browser tab looks like
# Google Classroom, Docs, Desmos or Clever, then fetches other HTML and swaps
# it into the document with document.write. "Unblocked games" launchers use
# this to keep teachers and content filters from seeing what is open. The
# fetched page decides what actually runs; the disguise is the observation.
defaults:
  platforms: [windows, unix]
  for: [html]
  attack: T1036

traits:
  - id: school-site-favicon-disguise
    desc: Uses a school site's favicon via Google
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)google\.com/s2/favicons\?domain=(classroom\.google|docs\.google|desmos|clever)\.com'

composite_rules:
  - id: favicon-disguised-fetched-page-swap
    desc: Disguised tab swaps in fetched page HTML
    crit: suspicious
    conf: 0.9
    all:
      - id: school-site-favicon-disguise
      - id: micro-behaviors/communications/http/request/html::html-fetch-call
      - id: micro-behaviors/ui/window/insert-html::browser-document-write

  # The launcher names about:blank and blob as the two ways to open the
  # fetched page, then document.write replaces this document with it.
  - id: blank-blob-fetched-page-swap
    desc: Blank and blob swap fetched HTML
    crit: suspicious
    conf: 0.9
    all:
      - id: micro-behaviors/communications/url/scheme::blank-and-blob-scheme-pair
      - id: micro-behaviors/communications/http/request/html::html-fetch-call
      - id: micro-behaviors/ui/window/insert-html::browser-document-write

  # Same fetch is retried with the host rewritten so a blocked CDN still
  # supplies the HTML that document.write installs.
  - id: host-rotated-fetched-page-swap
    desc: Host rotation writes fetched HTML
    crit: suspicious
    conf: 0.9
    all:
      - id: micro-behaviors/communications/url/parse::url-host-prefix-replace
      - id: micro-behaviors/communications/http/request/html::html-fetch-call
      - id: micro-behaviors/ui/window/insert-html::browser-document-write

  # Favicon disguise, blank/blob modes, and host rotation together are the
  # school-tab cloak. Any one of those carriers can appear in ordinary pages.
  - id: school-tab-cloak-rotated-page-swap
    desc: School-tab cloak writes rotated fetch
    crit: hostile
    conf: 0.95
    all:
      - id: school-site-favicon-disguise
      - id: micro-behaviors/communications/url/scheme::blank-and-blob-scheme-pair
      - id: micro-behaviors/communications/url/parse::url-host-prefix-replace
      - id: micro-behaviors/communications/http/request/html::html-fetch-call
      - id: micro-behaviors/ui/window/insert-html::browser-document-write
