defaults:
  platforms: [unix, windows]
  for: [npm, package.json, javascript, typescript]

composite_rules:
  - id: advertised-erc20-service-fabricates-transfers
    desc: ERC-20 claim backed by random keys and SQL ledger
    crit: hostile
    conf: 0.91
    scope: archive
    all:
      - id: metadata/package/description/function::npm-description-claims-erc20-web3-ethers
      - id: metadata/package/dependencies/presence::npm-manifest-omits-web3-ethers
      - id: micro-behaviors/crypto/key/generate::javascript-private-key-generated-with-math-random
      - id: micro-behaviors/data/db/write/row::sql-balance-debit-with-transaction-record
      - id: objectives/credential-access/wallet/keywords::wallet-private-key-sql-storage
