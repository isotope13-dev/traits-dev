defaults:
  platforms: [unix, windows]
  for: [whl, zip, archives, pkginfo, pkg_info, python]
  attack: T1036,T1041,T1552

composite_rules:
  - id: package-false-credential-privacy-claim
    desc: Credential upload contradicts package claim
    crit: hostile
    conf: 0.995
    scope: outer
    all:
      - id: metadata/package/documentation::pkginfo-denies-credential-upload
      - id: objectives/exfiltration/stealer/credential/http::python-intercepted-auth-credential-forwarding
