defaults:
  platforms: [windows]
  for: [pe, dll]
  attack: T1574.002,T1036.005
traits:
  # Export names of the SQL Server setup bootstrapper, one atom per name. They
  # are fragments; the composite counts how many distinct names a file carries.
  - id: sqlsetup-bootstrapper-export-enforce-prereqs
    desc: EnforceSetupPreReqs bootstrapper export name
    crit: component
    conf: 0.9
    if:
      type: text
      word: EnforceSetupPreReqs
  - id: sqlsetup-bootstrapper-export-launch-local
    desc: LaunchLocalSetup bootstrapper export name
    crit: component
    conf: 0.9
    if:
      type: text
      word: LaunchLocalSetup
  - id: sqlsetup-bootstrapper-export-launch-managed
    desc: LaunchManagedSetup bootstrapper export name
    crit: component
    conf: 0.9
    if:
      type: text
      word: LaunchManagedSetup
  - id: sqlsetup-bootstrapper-export-cleanup
    desc: ExecuteNativeSetupCleanUp export name
    crit: component
    conf: 0.9
    if:
      type: text
      word: ExecuteNativeSetupCleanUp
composite_rules:
  # A DLL that repeats several bootstrapper export names is implementing that
  # component's interface, not calling it. Three distinct names is the bar.
  - id: sqlsetup-bootstrapper-export-set
    desc: Repeats SQL setup bootstrapper export names
    crit: notable
    conf: 0.9
    needs: 3
    any:
      - id: sqlsetup-bootstrapper-export-enforce-prereqs
      - id: sqlsetup-bootstrapper-export-launch-local
      - id: sqlsetup-bootstrapper-export-launch-managed
      - id: sqlsetup-bootstrapper-export-cleanup
  # An unsigned DLL that implements the Microsoft SQL bootstrapper interface,
  # and toggles page protection, can be sideloaded by the signed setup host in
  # place of the real component. The rule claims the impersonation; it does not
  # prove the replacement's launch target.
  - id: unsigned-sqlsetup-bootstrapper-proxy
    desc: Unsigned DLL implements SQL setup bootstrapper exports with page protection
    crit: hostile
    conf: 0.9
    all:
      - id: objectives/evasion/masquerade/dll/proxy::sqlsetup-bootstrapper-export-set
      - id: metadata/signature/absent::unsigned-missing-signature-record
      - id: micro-behaviors/mem/protect/modify/api-reference::virtual-protect-import
