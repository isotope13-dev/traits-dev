defaults:
  platforms: [windows]
  for: [pe, iso, lnk]
  attack: T1574.002,T1204.002

traits:
  - id: calculator-executable-basename
    desc: Calculator executable basename
    crit: notable
    conf: 0.8
    for: [pe]
    if:
      type: path
      basename: true
      exact: calc.exe

composite_rules:
  - id: iso-edge-shortcut-codec-sideload
    desc: Disc image combines Edge lure and codec side-load
    crit: hostile
    conf: 0.97
    all:
      - id: calculator-executable-basename
      - id: objectives/evasion/masquerade/dll/proxy::windows-codecs-basename
      - id: micro-behaviors/process/config/target::lnk-cmd-with-args
      - id: micro-behaviors/ui/graphics/icon::lnk-edge-icon-location
      - id: micro-behaviors/ui/window/state::minimized-interpreter-window
      - id: metadata/binary/symbols/exports::export-dll-register-server
      - id: metadata/binary/symbols/name/process::create-process-w
