# A DLL that adopts CPython's runtime DLL basename (python3X.dll) with
# minimal/single exports and high-entropy payload sections is a Python proxy
# sideload loader. Genuine Python runtime DLLs export hundreds of APIs,
# include Py_Initialize, and are digitally signed.
defaults:
  platforms: [windows]
  for: [pe, dll]
  attack: T1036.005,T1574.002

composite_rules:
  - id: unsigned-cpython-proxy-sideload-loader
    desc: Unsigned CPython runtime DLL proxy hides concealed payload
    crit: hostile
    conf: 0.98
    attack: T1036.005,T1574.002,T1027
    all:
      - id: well-known/lib/runtime/scripted/cpython::cpython-runtime-dll
      - id: metadata/signed/trust-level::unsigned-missing-signature-record
      - id: metadata/binary/section/entropy::high-entropy-rdata-section
    any:
      - id: metadata/binary/symbols/exports::single-export
      - id: metadata/binary/symbols/count::minimal-exports
    unless:
      - id: metadata/signed/platform/
      - id: well-known/lib/runtime/scripted/cpython::cpython-py-initialize-export
