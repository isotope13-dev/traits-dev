# A WindowsCodecs proxy preserves the WIC export surface while loading the
# genuine system DLL.  This is a sideload/masquerade profile; the loader's
# payload intent is scored separately by the memory-stage and AMSI objectives.
defaults:
  platforms: [windows]
  for: [pe, dll]
  attack: T1574.002,T1036.005

traits:
  - id: windows-codecs-basename
    desc: WindowsCodecs system DLL basename
    crit: component
    conf: 0.98
    if:
      type: path
      basename: true
      exact: WindowsCodecs.dll
      case_insensitive: true

composite_rules:
  - id: windows-codecs-system-dll-proxy
    desc: WindowsCodecs proxy DLL loads system codec
    crit: suspicious
    conf: 0.98
    all:
      - id: windows-codecs-basename
      - id: metadata/binary/symbols/wic::wic-proxy-export-cluster
      - id: micro-behaviors/os/sysinfo/directories::get-system-directory
      - id: micro-behaviors/dylib/load/runtime::load-library-a
      - id: micro-behaviors/os/module/load::get-proc-address-import
      - id: micro-behaviors/process/thread/create::create-thread
      - id: metadata/binary/layout::pe-no-signature-record
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/installer/family/
