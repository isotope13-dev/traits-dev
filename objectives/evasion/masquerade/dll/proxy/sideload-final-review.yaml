defaults:
  platforms:
    - windows
  for: [scripts, binaries]

composite_rules:
  - id: evernote-crash-reporter-facade
    desc: Unsigned Evernote facade with concealment clues
    crit: hostile
    conf: 0.96
    attack: T1574.002
    for:
      - pe
      - dll
    all:
      - id: well-known/app/productivity/evernote::crash-reporter-export-family
      - id: metadata/signature/absent::unsigned
    any:
      - id: objectives/anti-static/obfuscation/string/encrypt::rc4-hex-string-concealment
      - id: metadata/binary/section/permission::anonymous-pe-section-high-entropy
      - id: micro-behaviors/mem/write/arbitrary::write-process-memory-binary
  - id: defender-mp-exports-self-issued
    desc: Defender MP exports and self-issued signer
    crit: hostile
    conf: 0.97
    attack: T1574.002
    for: [pe]
    all:
      - id: well-known/app/security/defender::mpconfig-initialize-symbol
      - id: well-known/app/security/defender::mpclient-util-export-symbol
      - id: metadata/signature/certificate/chain::pe-cert-leaf-self-issued
    unless:
      - id: metadata/signature/verified/platform/
# colorui.dll exports LaunchColorCpl for the Color control panel host; a
# Mingw-built proxy that keeps that export contract while presenting a
# self-issued Microsoft Authenticode leaf is a sideload facade, not a
# shipped Windows component (real colorui is platform-signed).
  - id: colorui-self-issued-microsoft-facade
    desc: Self-issued Microsoft colorui facade
    crit: hostile
    conf: 0.97
    attack: T1036.005,T1553.002,T1574.002
    for:
      - pe
      - dll
    size_max: 65536
    all:
      - id: well-known/app/system/microsoft/color-management::launch-color-cpl-symbol
      - id: well-known/app/system/microsoft/color-management::colorui5-dll-name-component
      - id: metadata/signature/certificate/chain::pe-cert-leaf-self-issued
      - id: metadata/signature/certificate/integrity::pe-authenticode-digest-matches
    any:
      - id: metadata/signature/verified/signer::microsoft-corporation
      - id: metadata/signature/unverified/signer::microsoft-corporation
      - id: metadata/signature/self-signed/signer::microsoft-corporation
      - id: metadata/signature/invalid/tampered/signer::microsoft-corporation
      - id: metadata/signature/invalid/bad-signature/signer::microsoft-corporation
    unless:
      - id: metadata/signature/verified/platform/
  - id: fake-export-apihash-resource-loader
    desc: Fake exports, API hashing and resource clues
    crit: suspicious
    conf: 0.99
    attack: T1574.002
    for: [pe]
    all:
      - id: metadata/binary/symbols/fake-windows::sideload-export-masquerade-cluster-lite
      - id: metadata/binary/resource/identity::dos-header-prefix-in-large-resource
      - id: micro-behaviors/os/api-resolution/digest-export/resolution::pe-api-hashing-indicator-single
      - id: micro-behaviors/process/thread/create::create-thread
    any:
      - id: micro-behaviors/process/thread/config::disable-thread-library-calls
      - id: metadata/binary/section/label/conventional::duplicated-runtime-section-suffixes
      - id: metadata/binary/section/entropy::reloc-entropy-at-least-6p8
  - id: version-proxy-sideload-launcher
    desc: Version DLL proxy and loader clues
    crit: hostile
    conf: 0.99
    attack: T1574.002
    for: [pe]
    size_min: 524288
    all:
      - id: micro-behaviors/fs/path/system/library::dll-reference-version
      - id: micro-behaviors/fs/path/library::version-dll-path-format
      - id: metadata/binary/section/ratio::export-fog-exec-section-mesh
      - id: metadata/binary/section/ratio::long-random-section-name-burst
      - id: micro-behaviors/os/sysinfo/directories::get-system-directory
    any:
      - id: metadata/binary/symbols/name/process::create-process-w
      - id: micro-behaviors/dylib/lookup::get-proc-address
      - id: micro-behaviors/dylib/load/runtime::load-library-a
    unless:
      - id: metadata/signature/verified/platform/
      - id: metadata/installer/product/
