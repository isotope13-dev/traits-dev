# Forwarding retains the original library surface while the mixed-mode DLL
# runs additional managed code. Legitimate interoperability remains possible.
defaults:
  for: [pe, dll]
  platforms: [windows]
composite_rules:
  - id: unsigned-native-clr-reflective-proxy
    desc: Unsigned DLL proxy loads managed assemblies
    crit: suspicious
    conf: 0.96
    attack: T1574.002
    # The proxy exports and managed loader must belong to the same member.
    scope: file
    all:
      - id: metadata/binary/linking/export-name::forwarded-export-reference
      - id: metadata/binary/header/characteristics::pe-dotnet-native-entry
      - id: metadata/signature/absent::unsigned-missing-signature-record
      - id: micro-behaviors/process/interpreter/runtime/clr::cil-assembly-load-call
      - id: micro-behaviors/metaprogramming/reflection/inspect/class/invocation::method-invoke
