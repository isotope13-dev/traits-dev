# A source or header that documents a "carrier proxy" whose entry point runs a
# decoy and the payload together is the contract of a sideloading implant.
# Each phrase alone is prose (telecom docs say "carrier proxy"; games talk of
# decoys), so both must appear in the same file.
defaults:
  platforms: [windows]
  for: [c, cpp, text]
  attack: T1574.001,T1036.005
traits:
  - id: decoy-plus-payload-comment
    desc: Comment states decoy plus payload
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)\bdecoy\s*\+\s*payload\b'

composite_rules:
  - id: carrier-proxy-decoy-payload-contract
    desc: Source documents a carrier proxy that runs decoy and payload
    crit: hostile
    conf: 0.93
    all:
      - id: objectives/evasion/masquerade/version-resource/rc-clone::rc-proxy-impersonation-comment
      - id: decoy-plus-payload-comment
