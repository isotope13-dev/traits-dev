defaults:
  platforms: [windows]
  for: [dll]
  crit: suspicious
  attack: T1574.002
composite_rules:
- id: libintl-masquerade
  desc: libintl exports with a Go/Rust runtime
  conf: 0.9
  all:
  - id: well-known/lib/runtime/compiled/gnu-libintl::gettext-api-exports
  any:
  - id: metadata/lang/compiler/systems::go-binary
  - id: metadata/lang/compiler/systems::rust-binary
