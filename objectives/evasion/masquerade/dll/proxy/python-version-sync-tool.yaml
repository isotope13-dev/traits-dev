# Helper scripts that keep a proxy DLL's version resource identical to the
# real module it replaces. The giveaway is the pairing: pefile reads the
# StringFileInfo/fixed version of two binaries, the prose names a proxy that
# impersonates the other, and a comment says detection rules key on those
# fields. A plain pefile dump or version-diff utility has none of the other two.
defaults:
  platforms: [windows]
  for: [python]
  attack: T1036.005,T1574.001
traits:
  - id: pefile-version-strings-read
    desc: Reads PE StringFileInfo version strings
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: 'StringFileInfo[\s\S]{0,400}StringTable|VS_FIXEDFILEINFO'
  - id: proxy-impersonates-module-comment
    desc: Text says a proxy impersonates a module
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)proxy[^\n]{0,60}impersonat|impersonat[^\n]{0,60}proxy'

composite_rules:
  - id: python-proxy-version-resource-sync-tool
    desc: Script syncs proxy DLL version fields with the module it impersonates
    crit: hostile
    conf: 0.93
    all:
      - id: pefile-version-strings-read
      - id: proxy-impersonates-module-comment
      - id: objectives/evasion/masquerade/version-resource/rc-clone::rc-detection-evasion-comment
