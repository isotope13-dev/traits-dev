# A DLL that adopts the Visual C++ runtime basename (vcruntime140.dll) but
# exports the Lua C API is a sideload decoy: a script host such as AutoIt
# loads it from its own directory and drives the embedded Lua VM. Genuine
# Microsoft runtimes are signed and never carry a Lua engine.
defaults:
  platforms: [windows]
  for: [pe, dll]
  attack: T1036.005,T1574.002

composite_rules:
  - id: unsigned-lua-runtime-as-msvc-runtime-dll
    desc: Unsigned Lua runtime DLL named as Microsoft C++ runtime
    crit: hostile
    conf: 0.97
    all:
      - id: well-known/lib/runtime/compiled/msvc-runtime::runtime-basename
      - id: well-known/lib/runtime/scripted/lua-runtime::lua-embedded-runtime
      - id: metadata/signature/absent::unsigned-missing-signature-record
    unless:
      - id: metadata/signature/verified/platform/
