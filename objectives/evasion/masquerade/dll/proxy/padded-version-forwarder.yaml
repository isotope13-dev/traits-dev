defaults:
  for: [pe, dll]
  platforms: [windows]
  attack: T1574.002,T1027

traits:
  - id: version-proxy-system32-forwarder
    desc: Version exports forward to System32
    crit: notable
    conf: 0.96
    if:
      type: text
      substr: 'C:\Windows\System32\version.'
      case_insensitive: true

composite_rules:
  - id: padded-unsigned-version-proxy
    desc: Padded unsigned version DLL proxy
    crit: hostile
    conf: 0.97
    scope: outer
    all:
      - id: metadata/binary/symbols/version-proxy::version-export-getfileversioninfoa
      - id: metadata/binary/symbols/version-proxy::version-export-verfindfilew
      - id: metadata/binary/symbols/version-proxy::version-export-verqueryvaluew
      - id: version-proxy-system32-forwarder
      - id: metadata/binary/section/entropy::large-writable-data-entropy-78
      - id: metadata/file/text-distribution::mixed-case-word-pattern-cluster
      - id: metadata/signature/absent::unsigned-missing-signature-record
