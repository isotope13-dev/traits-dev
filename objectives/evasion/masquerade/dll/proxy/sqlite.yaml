defaults:
  platforms: [windows]
  for: [pe, dll]
  attack: "T1036.005, T1574.002"

composite_rules:
  - id: sqlite-private-export-proxy-loader
    desc: SQLite proxy DLL hides loader surface
    crit: hostile
    conf: 0.97
    ref: sha256:a97d6fabe19316c920aed2004cb8d5ea3a699ce3a1a02c54ba60e0b6cabe9b64
    all:
      - id: metadata/binary/symbols/exports::sqlite-api-with-private-wrapper-exports
      - id: metadata/binary/layout/overlay::overlay-dominates-80pct
      - id: micro-behaviors/crypto/symmetric/aes/cng::bcrypt-aes-cbc
      - id: metadata/binary/layout/tls::pe-multiple-tls-callbacks
    unless:
      - id: well-known/lib/data/sqlite/
      - id: metadata/signed/platform/

  # This profile is the encrypted-overlay variant of the same SQLite proxy
  # masquerade.  It stays with the DLL-proxy family; the overlay and AES
  # evidence describe the payload shape rather than a separate execution
  # category.
  - id: sqlite-proxy-encrypted-overlay-loader
    desc: SQLite proxy DLL encrypted overlay loader
    crit: hostile
    conf: 0.97
    ref: sha256:a97d6fabe19316c920aed2004cb8d5ea3a699ce3a1a02c54ba60e0b6cabe9b64
    all:
      - id: metadata/binary/symbols/exports::sqlite-api-with-private-wrapper-exports
      - id: metadata/binary/layout/overlay::overlay-dominates-80pct
      - id: micro-behaviors/crypto/symmetric/aes/cng::bcrypt-aes-cbc
      - id: micro-behaviors/crypto/symmetric/aes/cng::bcrypt-decrypt-api
    any:
      - id: metadata/binary/layout/tls::pe-multiple-tls-callbacks
      - id: micro-behaviors/os/sysinfo/hardware::gpu-vendor-enumeration
    unless:
      - id: well-known/lib/data/sqlite/
      - id: metadata/signed/platform/
