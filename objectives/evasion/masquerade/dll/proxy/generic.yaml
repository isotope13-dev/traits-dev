defaults:
  platforms: [windows]
  for: [pe, dll]
  attack: T1574.002,T1036.005

composite_rules:
  - id: unsigned-proxy-dll-embedded-pe
    desc: Unsigned proxy DLL embeds an executable image
    crit: hostile
    conf: 0.98
    attack: T1574.002,T1036.005,T1027.009
    all:
      - id: objectives/evasion/hijack-execution-flow/dll-hijacking/runtime::java-launcher-proxy-dll
      - id: metadata/binary/resource/identity::dos-header-prefix-in-large-resource
      - id: metadata/signature/absent::unsigned-missing-signature-record
  - id: unsigned-com-proxy-network-worker
    desc: Unsigned COM proxy DLL starts an asynchronous network worker
    crit: hostile
    conf: 0.99
    attack: T1574.002,T1036.005,T1071.001
    all:
      - id: micro-behaviors/os/com/class-factory::com-export-pair
      - id: micro-behaviors/os/sysinfo/directories::get-system-directory
      - id: micro-behaviors/dylib/load/runtime::load-library-a
      - id: micro-behaviors/process/work/queue::queue-user-work-item
      - id: micro-behaviors/communications/socket/init::wsa-socket
      - id: micro-behaviors/communications/http/upload/multipart::multipart-form-data-upload
      - id: micro-behaviors/os/sysinfo/network::get-network-params
      - id: well-known/lib/network/native/cpp-httplib::cpp-httplib-multipart-marker
      - id: metadata/signature/absent::unsigned-missing-signature-record
    unless:
      - id: metadata/signature/verified/platform/
