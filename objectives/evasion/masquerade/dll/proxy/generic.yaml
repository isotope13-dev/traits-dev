defaults:
  platforms: [windows]
  for: [pe, dll]
  attack: T1574.002,T1036.005

composite_rules:
  - id: unsigned-com-proxy-network-worker
    desc: Unsigned COM proxy DLL starts an asynchronous network worker
    crit: hostile
    conf: 0.99
    attack: T1574.002,T1036.005,T1071.001
    all:
      - id: metadata/binary/symbols/exports::com-export-pair
      - id: micro-behaviors/os/sysinfo/directories::get-system-directory
      - id: micro-behaviors/dylib/load/runtime::load-library-a
      - id: micro-behaviors/process/threading/queue::queue-user-work-item
      - id: micro-behaviors/communications/socket/init::wsa-socket
      - id: micro-behaviors/communications/http/upload::multipart-form-data-upload
      - id: micro-behaviors/os/sysinfo/network::get-network-params
      - id: well-known/lib/network/cpp-httplib::cpp-httplib-multipart-marker
      - id: metadata/binary/layout::pe-no-signature-record
    unless:
      - id: metadata/signed/platform/
