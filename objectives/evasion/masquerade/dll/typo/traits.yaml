defaults:
  for:
    - pe
    - dll
  platforms:
    - windows
  attack: T1036.005
traits:
  - id: miacrome-dll-typosquat
    desc: Miacrome.dll Chrome typosquat
    crit: suspicious
    conf: 0.95
    if:
      type: text
      substr: Miacrome

composite_rules:
  # Chrome.dll typosquat paired with classic sideload-host probes and memory
  # protection changes — used by unsigned stubs that plant or search for a
  # fake chrome-adjacent DLL next to Chakra/jscript9/XpsServices hosts.
  - id: miacrome-sideload-memprotect-probe
    desc: Miacrome typosquat with sideload probes and VirtualProtect
    crit: hostile
    conf: 0.98
    attack: "T1036.005,T1574.002,T1055"
    all:
      - id: miacrome-dll-typosquat
      - id: objectives/command-and-control/dropper/sideload::sideload-target-search
      - id: micro-behaviors/mem/protect/modify::virtual-protect
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/installer/family/
