# The source-side construction of a DLL-sideloading first stage.
#
# The existing rules in this directory identify a finished proxy DLL from its
# export table (pe.forward_ratio in metadata/binary/symbols/exports). This one
# recognises the same design in the code that builds it, which is what shows up
# in a leaked toolkit, a repository, or a build tree rather than in a sample:
# every genuine export forwarded to the real library so the victim application
# keeps running, and the stage's own work started from DllMain.
defaults:
  platforms: [windows]
  for: [c, cpp]
  attack: T1574.002

composite_rules:
  - id: source-proxy-dll-payload-stage
    desc: Proxy DLL decrypts and runs a payload
    crit: hostile
    conf: 0.96
    attack: T1574.002,T1027,T1620
    all:
      - id: micro-behaviors/dylib/lookup::source-forwarded-export-directive
      - id: objectives/command-and-control/dropper/staging/encrypted::source-decrypt-to-executable-memory
