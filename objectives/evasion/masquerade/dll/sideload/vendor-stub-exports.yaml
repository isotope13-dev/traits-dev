# A DLL that claims a large vendor's identity in its version resource but
# whose export table is a handful of stubs with every name aliased onto them.
# Genuine vendor DLLs implement the exports a host imports; a sideload
# implant only needs the names to resolve so the signed host loads it, and
# runs its own code from DllMain instead.
defaults:
  platforms: [windows]
  for: [pe, dll]
  attack: T1574.002,T1036.005
composite_rules:
  - id: vendor-claim-stub-export-sideload
    desc: Vendor-branded DLL with stub-only exports
    crit: hostile
    conf: 0.9
    all:
      - id: metadata/binary/symbols/exports::mostly-aliased-small-export-table
      - id: metadata/signed/certificate/subject::pe-signer-personal-name-subject
    any:
      - id: metadata/vendor/identity::tencent-version-company
      - id: metadata/binary/vendor::microsoft-corp-versioninfo
    unless:
      - id: metadata/signed/platform/
