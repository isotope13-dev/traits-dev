# Drop a payload named wtsapi32.dll under the user's OneDrive directory and
# launch a legitimate OneDrive host so the DLL is sideloaded (T1574.002).
defaults:
  platforms: [windows]
  for: [python, rust, go, c, cpp, scripts]
  attack: T1574.002
  mbc: F0015

traits:
  - id: onedrive-localappdata-path
    desc: LocalAppData Microsoft OneDrive path
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)%LocalAppData%\\Microsoft\\OneDrive|LocalAppData[/\\]Microsoft[/\\]OneDrive'

  - id: wtsapi32-dll-drop-name
    desc: wtsapi32.dll filename reference
    # Bare system-DLL name is also present in legitimate Windows API bindings
    # (e.g. golang.org/x/sys NewLazySystemDLL). Sideload intent comes from
    # pairing with a OneDrive drop path in the hostile composite below.
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: '(?i)\bwtsapi32\.dll\b'
    unless:
      - id: well-known/tool/development/go-toolchain::go-toolchain-source-path
      - id: well-known/tool/development/go-toolchain::go-toolchain-distribution
      - id: well-known/tool/development/go-toolchain::go-module-source-path

composite_rules:
  - id: onedrive-wtsapi32-sideload-drop
    desc: Drops wtsapi32.dll into OneDrive for sideload
    crit: hostile
    conf: 0.98
    all:
      - id: onedrive-localappdata-path
      - id: wtsapi32-dll-drop-name
    near_bytes: 2048

  - id: onedrive-wtsapi32-sideload-launch
    desc: OneDrive host launch after wtsapi32.dll drop
    crit: hostile
    conf: 0.99
    all:
      - id: onedrive-wtsapi32-sideload-drop
      - id: objectives/evasion/masquerade/dll/sideload::onedrive-sideload-host
    near_bytes: 4096
