# Drop a payload named wtsapi32.dll under the user's OneDrive directory and
# launch a legitimate OneDrive host so the DLL is sideloaded (T1574.002).
defaults:
  platforms: [windows]
  for: [python, rust, go, c, cpp, scripts]
  attack: T1574.002
  mbc: F0015

composite_rules:
  - id: onedrive-wtsapi32-sideload-drop
    desc: Drops wtsapi32.dll into OneDrive for sideload
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/fs/path/app-data/application::onedrive-localappdata-path
      - id: micro-behaviors/dylib/load/wtsapi::wtsapi32-dll-reference
    near_bytes: 2048

  - id: onedrive-wtsapi32-sideload-launch
    desc: OneDrive host launch after wtsapi32.dll drop
    crit: hostile
    conf: 0.99
    all:
      - id: onedrive-wtsapi32-sideload-drop
      - id: objectives/evasion/masquerade/dll/sideload::onedrive-sideload-host
    near_bytes: 4096
