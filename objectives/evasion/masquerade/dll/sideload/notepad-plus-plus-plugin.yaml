defaults:
  platforms: [windows]
  for: [pe, dll]
  attack: T1574.002
composite_rules:
  # A working Notepad++ plugin drives the editor by sending NPPM_* and SCI_*
  # window messages to the handles it receives in setInfo, so a native plugin
  # imports SendMessage. A DLL that exports the plugin ABI but cannot message
  # the editor is a shell that only borrows Notepad++ as a loader: the host
  # calls an export, and the export runs something else. Managed plugins
  # P/Invoke SendMessage through metadata rather than the import table.
  - id: notepad-plus-plus-plugin-without-editor-messaging
    desc: Notepad++ plugin exports, no SendMessage import
    crit: suspicious
    conf: 0.9
    all:
      - id: well-known/app/productivity/notepad-plus-plus::notepad-plus-plus-plugin-abi-exports
    unless:
      - id: micro-behaviors/ui/window/message::send-message
      - id: micro-behaviors/ui/window/message::send-message-a
      - id: metadata/lang/compiler/managed::dotnet-metadata

  # The same plugin shell carrying a hand-rolled loader: modules found by
  # walking the PEB loader lists, exports parsed by hand, or syscall gadgets
  # hunted inside ntdll. That is a payload staged for Notepad++ to load from
  # its plugins directory, not an editor extension.
  - id: notepad-plus-plus-plugin-shell-native-loader
    desc: Fake Notepad++ plugin hides a native API loader
    crit: hostile
    conf: 0.96
    all:
      - id: notepad-plus-plus-plugin-without-editor-messaging
    any:
      - id: micro-behaviors/os/api-resolution/manual::teb-self-peb-ldr-access-x64
      - id: micro-behaviors/os/api-resolution/manual::gs-peb-ldr-access-x64
      - id: micro-behaviors/os/api-resolution/digest-export/walk::peb-ldr-list-access-x86
      - id: micro-behaviors/os/api-resolution/manual::x64-peb-access-immediate
      - id: micro-behaviors/os/syscall/raw::syscall-ret-needle-stack-immediates
