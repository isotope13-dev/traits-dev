defaults:
  platforms: [windows]
  for: [pe, dll]
  attack: T1574.001,T1027

composite_rules:
  - id: chromium-elf-exports-flattened-blob
    desc: Chromium exports, flattened code and blob clues
    crit: hostile
    conf: 0.9
    all:
      - id: well-known/lib/platform/chromium-elf::export-install-details-payload
      - id: well-known/lib/platform/chromium-elf::export-is-browser-process
      - id: well-known/lib/platform/chromium-elf::export-signal-chrome-elf
      - id: micro-behaviors/data/format/pe-parser::inline-mz-magic-check
      - id: metadata/binary/layout/strings::native-string-over-256-kib
      - id: objectives/anti-static/obfuscation/control-flow/dispatch::tls-state-relative-table-flattening

  # chrome_elf's export surface on a DLL padded with a megabyte-plus of
  # low-entropy overlay. Chromium vendors' chrome_elf carries only its
  # Authenticode blob after the image; padding inflates a replacement proxy
  # past scanner size limits.
  - id: chromium-elf-exports-padded-overlay
    desc: chrome_elf export surface on a padded-overlay DLL
    crit: hostile
    conf: 0.92
    all:
      - id: well-known/lib/platform/chromium-elf::export-signal-chrome-elf
      - id: well-known/lib/platform/chromium-elf::export-is-browser-process
      - id: metadata/binary/layout/overlay::large-low-entropy-overlay-pe-profile
