    desc: Chromium exports, flattened code and blob clues
    crit: hostile
    conf: 0.9
    all:
      - id: well-known/lib/platform/chromium-elf::export-install-details-payload
      - id: well-known/lib/platform/chromium-elf::export-is-browser-process
      - id: well-known/lib/platform/chromium-elf::export-signal-chrome-elf
