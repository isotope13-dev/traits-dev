# Source-side construction of a wtsapi32.dll proxy payload. wtsapi32.dll is a
# system DLL: no legitimate application ships its own copy or forwards the
# Terminal Services exports. Source that forwards those exports is building
# the search-order-hijack first stage documented for Tortoiseshell's tunnel
# utility and backdoor — the finished binary's tell is the forwarded export
# table (metadata pure-proxy-dll); this catches it in the code that builds it.
defaults:
  platforms: [windows]
  for: [c, cpp]
  attack: T1574.002

composite_rules:
  - id: wtsapi32-proxy-dll-source
    desc: Source builds wtsapi32 proxy DLL
    crit: hostile
    conf: 0.95
    all:
      - id: wtsapi32-dll-drop-name
      - id: micro-behaviors/dylib/lookup::source-forwarded-export-directive
