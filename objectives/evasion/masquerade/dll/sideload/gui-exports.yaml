defaults:
  platforms: [windows]
  for: [pe]
composite_rules:
  - id: gui-apis-with-masquerading-exports
    desc: GUI APIs with Windows export masquerade
    crit: suspicious
    conf: 0.94
    any:
      - id: metadata/binary/symbols/fake-windows::sideload-export-masquerade-cluster
      - id: metadata/binary/symbols/fake-windows::sideload-export-masquerade-cluster-lite
    all:
      - id: micro-behaviors/ui/graphics/draw::begin-paint-symbol
      - id: micro-behaviors/ui/window/probe::get-active-window
