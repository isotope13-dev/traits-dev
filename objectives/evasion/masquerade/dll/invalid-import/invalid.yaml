defaults:
  platforms: [windows]
  for: [pe]
traits:
  - id: invalid-console-api-import
    desc: Invalid console API import name
    crit: suspicious
    conf: 0.96
    unless:
      - id: metadata/build/generated::winmd-managed-metadata
      # A system DLL exports this name as part of its documented surface;
      # the text appears in .text as export data, not as an invalid import.
      - id: metadata/binary/symbols/count::many-exports
    if:
      type: import
      exact: SetConsoleCursorMode
