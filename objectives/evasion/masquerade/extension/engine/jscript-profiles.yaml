defaults:
  platforms: [unix, windows, macos]
composite_rules:
- id: pe-jscript-engine-write-spawn-profile
  desc: PE JScript override with write/spawn clues
  crit: suspicious
  conf: 0.96
  platforms: [windows]
  for: [pe]
  all:
  - id: objectives/evasion/masquerade/extension/engine::wscript-engine-jscript-override
  - id: micro-behaviors/fs/file/open::file-create-win
  - id: micro-behaviors/fs/write/file/handle::write-file
  - id: micro-behaviors/process/create/spawn::create-process-a
  any:
  - id: metadata/binary/section/ratio::dominant-section
  - id: metadata/binary/code/complexity::few-functions
  - id: metadata/binary/symbols/count::very-many-imports
  - id: micro-behaviors/os/api-resolution/hash-based::multiplicative-hash-loop
  needs: 2
  unless:
  - id: metadata/signed/platform/
  - id: metadata/binary/installer/family/
