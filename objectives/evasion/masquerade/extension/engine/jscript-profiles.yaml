defaults:
  platforms: [unix, windows, macos]
composite_rules:
- id: pe-jscript-engine-write-spawn-profile
  desc: PE JScript override with write/spawn clues
  crit: suspicious
  conf: 0.96
  platforms: [windows]
  for: [pe]
  all:
  - id: metadata/lang/runtime::wscript-engine-jscript-override
  - id: micro-behaviors/fs/file/open/unspecified::file-create-win
  - id: micro-behaviors/fs/write/file/handle/unspecified::write-file
  - id: metadata/binary/symbols/name/process::create-process-a
  any:
  - id: metadata/binary/section/ratio::dominant-section
  - id: metadata/binary/code/complexity::few-functions
  - id: metadata/binary/symbols/count::very-many-imports
  - id: micro-behaviors/os/api-resolution/digest-export/resolution::multiply-shift-xor-export-walk
  needs: 2
  unless:
  - id: metadata/signature/verified/platform/
  - id: metadata/installer/product/
