defaults:
  platforms: [windows]
  for: [lnk]
composite_rules:
  - id: padded-document-shortcut-scriptlet-lure
    desc: Padded document shortcut runs remote scriptlet
    crit: hostile
    conf: 0.99
    attack: T1036.007,T1204.002
    all:
      - id: metadata/file/extension/executable::lnk-document-space-padded-extension
      - id: objectives/execution/interpreter/script/mshta::lnk-inline-mshta-remote-scriptlet-execution
