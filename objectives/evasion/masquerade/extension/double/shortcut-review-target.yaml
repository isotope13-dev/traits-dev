defaults:
  platforms: [windows]
  attack: T1204.002
  for: [lnk]

composite_rules:
  - id: media-named-rundll32-ordinal-launch
    desc: Media-named LNK launches a DLL export ordinal
    crit: hostile
    conf: 0.99
    attack: T1036.007,T1059.003,T1218.011,T1204.002
    all:
      - id: micro-behaviors/fs/path/media::lnk-args-media-extension
      - id: micro-behaviors/process/argument/executable::rundll32-ordinal-argument
      - id: objectives/evasion/masquerade/extension/double::lnk-name-jpg-png-double
      - id: "micro-behaviors/ui/window/state::lnk-minimized-inactive-window"
