# LNK files masquerading as documents via double extension.
# Filenames like Spisok.xlsx.lnk, Invoice.pdf.lnk, Report.docx.lnk
# rely on Windows Explorer hiding the .lnk extension by default —
# the user sees a "Spisok.xlsx" icon and clicks expecting Excel.
# Native Windows shortcuts to Office documents are .lnk files in
# Recent/Pinned that point at .xlsx by absolute path; what makes
# document.<office>.lnk distinctive as malware is the BASENAME
# embedding the source extension, not the link's target.
defaults:
  platforms: [windows]
  for: [lnk]
  attack: T1036.007
  mbc: F0008
traits:
  - id: lnk-name-xlsx-double
    desc: LNK named *.xlsx.lnk
    crit: suspicious
    conf: 0.95
    if:
      type: path
      basename: true
      regex: '(?i)\.xlsx?\.lnk$'
  - id: lnk-name-docx-double
    desc: LNK named *.docx.lnk
    crit: suspicious
    conf: 0.95
    if:
      type: path
      basename: true
      regex: '(?i)\.docx?\.lnk$'
    unless:
      - id: well-known/tool/detection/security-scanner/
  - id: lnk-name-pdf-double
    desc: LNK named *.pdf.lnk
    crit: suspicious
    conf: 0.97
    if:
      type: path
      basename: true
      regex: '(?i)\.pdf\.lnk$'
  - id: lnk-name-txt-double
    desc: LNK named *.txt.lnk
    crit: suspicious
    conf: 0.94
    if:
      type: path
      basename: true
      # Invoice/notice lures hide behind Explorer's suppressed .lnk suffix so the
      # user sees a plain text document. Keep this basename-only — a real
      # Recent-folder shortcut to a .txt file does not embed .txt in the LNK name.
      regex: '(?i)\.txt\.lnk$'
  - id: lnk-name-pptx-double
    desc: LNK named *.pptx.lnk
    crit: suspicious
    conf: 0.95
    if:
      type: path
      basename: true
      regex: '(?i)\.pptx?\.lnk$'
  - id: lnk-name-zip-rar-double
    desc: LNK named *.zip/rar.lnk
    crit: suspicious
    conf: 0.95
    if:
      type: path
      basename: true
      regex: '(?i)\.(zip|rar|7z)\.lnk$'
    unless:
      - id: well-known/app/storage/peazip::peazip-shortcut-target
  - id: lnk-name-tar-gz-double
    desc: LNK named *.tar/tgz/gz.lnk
    crit: suspicious
    conf: 0.95
    if:
      type: path
      basename: true
      regex: '(?i)\.(tar|tgz|gz)\.lnk$'
  - id: lnk-name-jpg-png-double
    desc: LNK named *.jpg/png.lnk
    crit: suspicious
    conf: 0.93
    if:
      type: path
      basename: true
      regex: '(?i)\.(jpg|jpeg|png)\.lnk$'
  - id: lnk-name-gif-bmp-double
    desc: LNK named *.gif/bmp.lnk
    crit: suspicious
    conf: 0.93
    if:
      type: path
      basename: true
      regex: '(?i)\.(gif|bmp)\.lnk$'
  - id: powershell-launches-document-named-lnk
    desc: PowerShell launches a document-named shortcut
    crit: suspicious
    conf: 0.96
    for: [powershell]
    if:
      type: text
      regex: '(?i)\bStart-Process\b.{0,240}\.(rtf|docx?|xlsx?|pdf|pptx?|txt)\.lnk\b'
  - id: batch-launches-document-named-lnk
    desc: Batch launches a document-named shortcut
    crit: suspicious
    conf: 0.96
    for: [batch]
    if:
      type: text
      regex: '(?i)\bstart\s+["'']{0,2}.{0,180}\.(rtf|docx?|xlsx?|pdf|pptx?|txt)\.lnk\b'
  - id: document-named-lnk-path-reference
    desc: Code references a document-named shortcut
    crit: suspicious
    conf: 0.94
    for: [source, binaries]
    if:
      type: text
      regex: '(?i)\.(rtf|docx?|xlsx?|pdf|pptx?|txt)\.lnk\b'
composite_rules:
  - id: script-launches-document-named-lnk
    desc: Script launches a document-named shortcut
    crit: suspicious
    conf: 0.96
    for: [powershell, batch]
    any:
      - id: powershell-launches-document-named-lnk
      - id: batch-launches-document-named-lnk
  - id: native-launches-document-named-lnk
    desc: Native code launches a document-named shortcut
    crit: suspicious
    conf: 0.97
    for: [source, binaries]
    all:
      - id: document-named-lnk-path-reference
    any:
      - id: micro-behaviors/process/create/spawn::create-process-a
      - id: micro-behaviors/process/create/spawn::create-process-w
      - id: micro-behaviors/process/create/exec::shell-execute
      - id: micro-behaviors/process/create/exec::shell-execute-a
      - id: micro-behaviors/process/create/spawn::start
    near_bytes: 4096
  - id: document-named-lnk-execution
    desc: Code launches a document-named shortcut
    crit: suspicious
    conf: 0.97
    for: [scripts, source, binaries]
    any:
      - id: script-launches-document-named-lnk
      - id: native-launches-document-named-lnk
  - id: document-lnk-script-host-lure
    desc: Document-named LNK targets Windows Script Host
    crit: hostile
    conf: 0.98
    attack: T1036,T1059.005
    all:
      - id: micro-behaviors/process/create/shortcut::lnk-script-host-target
    any:
      - id: lnk-name-docx-double
      - id: lnk-name-xlsx-double
      - id: lnk-name-pdf-double
      - id: lnk-name-pptx-double
      - id: lnk-name-txt-double
  - id: txt-lnk-powershell-policy-bypass-lure
    desc: Text-named LNK runs minimized PowerShell with policy bypass
    crit: hostile
    conf: 0.98
    attack: T1036.007,T1059.001,T1204.002
    all:
      - id: lnk-name-txt-double
      - id: objectives/command-and-control/dropper/lnk/target::minimized-powershell-policy-bypass-script
  # PDF-named LNK that launches MSBuild against a remote UNC project while
  # using a browser icon as the visual lure. Common ISO-delivered invoice
  # (DANFE) phishing pattern.
  - id: pdf-lnk-msbuild-unc-browser-lure
    desc: PDF-named LNK runs remote MSBuild with browser icon
    crit: hostile
    conf: 0.99
    attack: T1036.007,T1218,T1105,T1204.002
    all:
      - id: lnk-name-pdf-double
      - id: objectives/execution/lnk/proxy::msbuild-target
      - id: objectives/execution/lnk/proxy::msbuild-unc-project-argument
      - id: objectives/command-and-control/dropper/lnk/target::msedge-target
  - id: pdf-lnk-webdav-script-lure
    desc: Document LNK launches script host from WebDAV
    crit: hostile
    conf: 0.99
    attack: T1036.007,T1059.005,T1105
    all:
      - id: lnk-name-pdf-double
      - id: micro-behaviors/process/create/shortcut::lnk-script-host-target
      - id: micro-behaviors/communications/http/webdav::webdav-ssl-unc-lnk-argument
