defaults:
  platforms: [windows]
  for: [lnk]
  attack: T1204.002

composite_rules:
  - id: lnk-relative-double-extension-exe
    desc: LNK targets double-extension EXE
    crit: suspicious
    conf: 0.94
    any:
      - id: objectives/evasion/masquerade/extension/double::lnk-relative-data-extension-exe
      - id: objectives/evasion/masquerade/extension/double::lnk-relative-config-extension-exe
      - id: objectives/evasion/masquerade/extension/double::lnk-relative-log-extension-exe
      - id: micro-behaviors/fs/path/executable::lnk-relative-installer-extension-exe
