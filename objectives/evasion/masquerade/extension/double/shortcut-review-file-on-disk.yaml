defaults:
  platforms: [windows]
  for: [lnk]
  attack: T1204.002

composite_rules:
  - id: lnk-downloads-traversal-double-extension
    desc: Shortcut traverses to a double-extension executable in Downloads
    crit: hostile
    conf: 0.97
    attack: T1036.007,T1204.002
    all:
      - id: lnk-relative-double-extension-exe
      - id: micro-behaviors/fs/path/executable::lnk-relative-downloads-exe
      - id: micro-behaviors/fs/path/traversal::lnk-relative-deep-parent-chain
      - id: micro-behaviors/fs/path/user-directory::lnk-workingdir-user-downloads

  - id: lnk-relative-double-extension-exe
    desc: LNK targets double-extension EXE
    crit: suspicious
    conf: 0.94
    any:
      - id: objectives/evasion/masquerade/extension/double::lnk-relative-data-extension-exe
      - id: objectives/evasion/masquerade/extension/double::lnk-relative-config-extension-exe
      - id: objectives/evasion/masquerade/extension/double::lnk-relative-log-extension-exe
      - id: micro-behaviors/fs/path/executable::lnk-relative-installer-extension-exe
