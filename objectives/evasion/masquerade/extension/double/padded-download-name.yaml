# A file name literal that ends in a document or image extension, then a run
# of blank characters, then the real archive/executable/script extension:
# "Invoice.pdf<many spaces>.zip". Explorer and browser download bars truncate
# the name before the real extension, so the victim sees only the decoy.
# This is the name a script gives the file it saves, not the scanned file's
# own name.
defaults:
  for: [svg, html, javascript]
  platforms: [windows, unix]
  attack: T1036.007

traits:
  - id: blank-padded-double-extension-literal
    desc: Name pads a decoy extension with blanks
    crit: suspicious
    conf: 0.95
    if:
      type: text
      # `\s` covers the Unicode blanks (U+00A0, U+2000-U+200A, U+3000) used
      # as padding; U+2800 (Braille blank) is not whitespace and is listed.
      regex: '(?i)\.(pdf|docx?|xlsx?|jpe?g|png)[\s\x{2800}]{4,99}\.(zip|rar|7z|iso|exe|js|hta|lnk)\b'

composite_rules:
  - id: script-download-blank-padded-double-extension
    desc: Script saves file under padded double extension
    crit: hostile
    conf: 0.95
    all:
      - id: blank-padded-double-extension-literal
    any:
      - id: micro-behaviors/ui/window/dom/tree::object-url-click-or-download-attribute
      - id: micro-behaviors/communications/http/download/browser::js-anchor-download-attribute
      - id: micro-behaviors/communications/http/download/browser::svg-script-download-click
