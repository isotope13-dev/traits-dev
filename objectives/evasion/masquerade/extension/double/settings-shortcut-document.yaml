# A Windows Settings shortcut named like a document or image
# (789545656.pdf.SettingContent-ms). Explorer hides the real extension, so the
# recipient sees a PDF and double-clicks a command launcher. Windows keeps its
# own settings entries in an index, not in loose files named for documents.
defaults:
  platforms: [windows]
  for: [xml]
  attack: T1036.007

traits:
  - id: settings-shortcut-document-name
    desc: Settings shortcut named as a document
    crit: suspicious
    conf: 0.95
    if:
      type: basename
      regex: '(?i)\.(pdf|docx?|xlsx?|rtf)\.settingcontent-ms$'

  - id: settings-shortcut-media-name
    desc: Settings shortcut named as media or text
    crit: suspicious
    conf: 0.95
    if:
      type: basename
      regex: '(?i)\.(jpe?g|png|txt|pptx?)\.settingcontent-ms$'

composite_rules:
  - id: settings-shortcut-document-lure
    desc: Document-named Windows Settings shortcut
    crit: hostile
    conf: 0.96
    attack: T1036.007,T1204.002
    all:
      - id: metadata/file/format/windows-shell::settings-shortcut-root
    any:
      - id: settings-shortcut-document-name
      - id: settings-shortcut-media-name
