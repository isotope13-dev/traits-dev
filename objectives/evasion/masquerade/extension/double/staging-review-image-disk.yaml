defaults:
  platforms:
  - windows
  crit: hostile
  conf: 0.99
composite_rules:
- for: &id001
  - scripts
  - source
  - binaries
  attack: T1204.002
  id: virtual-disk-document-lnk-execution
  desc: Virtual disk mount and document-named shortcut launch
  all:
  - id: micro-behaviors/fs/volume/mount::virtual-disk-attach
  - id: objectives/evasion/masquerade/extension/double::document-named-lnk-execution
- for:
  - pe
  - batch
  - csharp
  - powershell
  attack: T1105,T1204.002
  id: downloaded-virtual-disk-document-lnk-execution
  desc: Virtual disk download, mount and document shortcut launch
  all:
  - id: micro-behaviors/communications/http/download/cli/web-cmdlet::iwr-outfile-download
  - id: micro-behaviors/fs/volume/mount::virtual-disk-attach
  - id: objectives/evasion/masquerade/extension/double::document-named-lnk-execution
- for: *id001
  attack: T1204.002
  id: virtual-disk-document-lnk-cleanup
  desc: Virtual disk mount, shortcut launch and cleanup clues
  all:
  - id: micro-behaviors/fs/volume/mount::virtual-disk-attach
  - id: micro-behaviors/fs/volume/mount::virtual-disk-detach
  - id: objectives/evasion/masquerade/extension/double::document-named-lnk-execution
  any:
  - id: micro-behaviors/fs/delete/file/command::powershell-remove-item-force
  - id: micro-behaviors/fs/delete/file/command::cmd-del-force-quiet
