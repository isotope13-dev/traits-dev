# The API and score labels are ordinary sports-client observations. The
# suspicious result is their mismatch with an explicit IP-hiding promise.
# Do not infer credential theft, a remote loader, or campaign membership.
# Proxy/native authority exclusions cover VPN extensions with sports features,
# including authority requested later through optional permissions.
defaults:
  platforms: [windows, unix]
  for: [xpi, crx, zip, chrome-manifest, javascript, typescript]

composite_rules:
  - id: ip-hiding-claim-sports-score-shell
    desc: IP-hiding claim bundles a sports-score client
    crit: suspicious
    conf: 0.98
    attack: T1036
    scope: archive
    all:
      - id: metadata/file/format/browser-extension::web-extension-root-manifest
      - id: metadata/package/description/function::extension-ip-hiding-claim
      - id: micro-behaviors/communications/http/services/sports::api-sports-service-url
      - id: micro-behaviors/communications/http/services/sports::live-sports-fixture-path
      - id: micro-behaviors/ui/keywords::live-sports-score-label
      - id: micro-behaviors/communications/http/request/client::js-fetch-call
    unless:
      - id: metadata/permission/extension-api::permission-proxy
      - id: metadata/permission/extension-api::permission-native-messaging
      - id: metadata/permission/extension-api::optional-proxy-permission
      - id: metadata/permission/extension-api::optional-native-messaging-permission
      - id: metadata/permission/extension-api::permission-vpn-provider
      - id: metadata/permission/extension-api::optional-vpn-provider-permission
