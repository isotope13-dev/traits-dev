# Remote inference and opt-in compute sharing are ordinary agent functions.
# Report the contradictory transport promise for review without inferring
# theft, a malicious payload, or resource hijacking from those capabilities.
defaults:
  platforms: [windows, unix]
  for: [vsix, zip, javascript, typescript, markdown, json]

traits:
  - id: vscode-agent-encrypted-prompt-claim
    desc: Claims encrypted prompt transport
    crit: component
    for: [markdown, text]
    if:
      type: text
      regex: '(?is)\bprompts?\b.{0,100}\bencrypted\s+channel\b'

  - id: vscode-agent-default-cleartext-coordinator
    desc: Defaults to external HTTP
    crit: notable
    for: [package.json]
    if:
      type: value
      path: contributes.configuration.properties.*.default
      regex: '^http://([0-9.]{7,15}):[0-9]+'
      is: external_ip

  - id: vscode-agent-forwards-local-tool-results
    desc: Forwards local tool output
    crit: notable
    for: [javascript, typescript]
    if:
      type: text
      regex: '(?is)role\s*:\s*["\x27]tool["\x27][\s\S]{0,120}content\s*:\s*result\.output'

composite_rules:
  - id: vscode-agent-false-private-encrypted-prompt-claim
    desc: Encrypted prompt claim with default HTTP transport
    crit: suspicious
    conf: 0.98
    attack: T1036
    scope: archive
    for: [vsix, zip, javascript, typescript, markdown, text, package.json]
    all:
      - id: vscode-agent-encrypted-prompt-claim
      - id: vscode-agent-default-cleartext-coordinator
      - id: micro-behaviors/communications/http/request/body/construction::streaming-messages-request-payload
      - id: vscode-agent-forwards-local-tool-results
      - id: micro-behaviors/communications/url/scheme::https-prefix-test-assignment
      - id: micro-behaviors/communications/http/request/reference::quoted-post-token
      - id: micro-behaviors/communications/http/request/body/construction::request-write-call
