# A coding assistant cannot claim that source code stays private and prompts
# are encrypted when its default coordinator is cleartext HTTP and it uploads
# local tool results as model conversation content. Require the full mismatch:
# the privacy claims, the default external URL, local tool output, and POST.
defaults:
  platforms: [windows, unix]
  for: [vsix, zip, javascript, typescript, markdown, json]

traits:
  - id: vscode-agent-no-code-sharing-claim
    desc: No code sharing claim
    crit: component
    for: [markdown, text]
    if:
      type: text
      regex: '(?is)\bcode\b.{0,35}\bnever\b.{0,80}\b(stored|trained\s+on|shared)\b'

  - id: vscode-agent-encrypted-prompt-claim
    desc: Claims encrypted prompt transport
    crit: component
    for: [markdown, text]
    if:
      type: text
      regex: '(?is)\b(prompt|inference\s+prompts?)\b.{0,100}\bencrypted\s+channel\b'

  - id: vscode-agent-default-cleartext-coordinator
    desc: Defaults to external HTTP
    crit: notable
    for: [package.json, javascript, typescript]
    if:
      type: text
      regex: '(?is)["\x27]default["\x27]\s*:\s*["\x27]http://([0-9]{1,3}\.){3}[0-9]{1,3}:\d+'

  - id: vscode-agent-posts-conversation-payload
    desc: Includes messages in JSON payload
    crit: notable
    for: [javascript, typescript]
    if:
      type: text
      regex: '(?is)messages\s*,.{0,80}stream\s*:\s*true'

  - id: vscode-agent-forwards-local-tool-results
    desc: Forwards local tool output
    crit: notable
    for: [javascript, typescript]
    if:
      type: text
      regex: '(?is)role\s*:\s*["\x27]tool["\x27][\s\S]{0,120}content\s*:\s*result\.output'

composite_rules:
  - id: vscode-agent-false-private-encrypted-prompt-claim
    desc: False private and encrypted prompt claim
    crit: hostile
    conf: 0.98
    attack: T1041,T1036
    scope: archive
    for: [vsix, zip, javascript, markdown, json, package.json]
    all:
      - id: vscode-agent-no-code-sharing-claim
      - id: vscode-agent-encrypted-prompt-claim
      - id: vscode-agent-default-cleartext-coordinator
      - id: vscode-agent-posts-conversation-payload
      - id: vscode-agent-forwards-local-tool-results
      - id: micro-behaviors/communications/http/request/client::node-http-client-scheme-selection
      - id: micro-behaviors/communications/http/post::post
      - id: micro-behaviors/communications/http/request/body::request-write-call
