# The engine an extension installs is named in the manifest so the user can
# find it in Settings and in Chrome's "keep / change back" prompt. Taking the
# default engine while declaring an empty name strips the one label that
# would tell the user which service now receives every address-bar query.
defaults:
  platforms: [windows, unix]
  for: [crx, xpi, zip, json, chrome-manifest]
  attack: T1176,T1036

composite_rules:
  - id: nameless-default-search-takeover
    desc: Default search takeover with blank engine name
    crit: hostile
    conf: 0.95
    scope: archive
    all:
      - id: metadata/permission/manifest::extension-default-search-provider
      - id: metadata/permission/manifest::extension-custom-search-endpoint
      - id: metadata/permission/manifest::search-provider-blank-name
