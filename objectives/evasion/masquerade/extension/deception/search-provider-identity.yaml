# The engine an extension installs is named in the manifest so the user can
# find it in Settings and in Chrome's "keep / change back" prompt. Taking the
# default engine while declaring an empty name strips the one label that
# would tell the user which service now receives every address-bar query.
defaults:
  platforms: [windows, unix]
  for: [crx, xpi, zip, json, chrome-manifest]
  attack: T1176,T1036

composite_rules:
  - id: nameless-default-search-takeover
    desc: Default search takeover with blank engine name
    crit: hostile
    conf: 0.95
    scope: archive
    all:
      - id: metadata/permission/manifest::extension-default-search-provider
      - id: metadata/permission/manifest::extension-custom-search-endpoint
      - id: metadata/permission/manifest::search-provider-blank-name

  # A default-search takeover whose background code reports "consent accepted"
  # to the vendor without any click or submit handler in that file records an
  # agreement the user was never asked for, laundering the takeover as opt-in.
  - id: search-takeover-unprompted-consent-report
    desc: Default search takeover reports consent from code with no UI handler
    crit: hostile
    conf: 0.85
    scope: archive
    for: [crx, xpi, zip, json, chrome-manifest, javascript]
    all:
      - id: metadata/permission/manifest::extension-default-search-provider
      - id: metadata/permission/manifest::extension-custom-search-endpoint
      - id: micro-behaviors/communications/http/request/privacy::consent-accept-event-without-ui-handler
