defaults:
  platforms: [windows, unix]
  for: [crx, xpi, zip, javascript, typescript, html, json]
  attack: T1036,T1041

composite_rules:
  # This is a claim contradicted by the shipped identity exporter. A product
  # tag, policy link, or an unrelated opt-out toggle cannot establish that the
  # raw account identity is anonymized before transmission.
  - id: anonymous-feedback-default-identity-upload
    desc: Default-enabled account identity export contradicts anonymous-feedback wording
    # Misleading data monetization behind a visible opt-in banner: the user
    # is shown the feature, only its anonymity claim is false. Suspicious.
    crit: suspicious
    conf: 0.97
    scope: archive
    all:
      - id: micro-behaviors/ui/keywords::anonymous-viewing-feedback-claim
      - id: micro-behaviors/data/config/browser-preference::extension-enables-unset-sharing-preference
      - id: micro-behaviors/data/serialize/schema-object::passes-email-and-install-identity-payload
      - id: micro-behaviors/communications/http/request/body/construction::base64-post-carries-service-tagged-record
      - id: objectives/exfiltration/stealer/account-identity::extension-account-email-offsite-upload
