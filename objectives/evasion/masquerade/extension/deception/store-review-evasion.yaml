# Browser extension comments admitting API substitutions or dummy permissions
# were added specifically to pass Chrome Web Store / Google review.
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
  attack: T1036

traits:
  - id: store-review-bypass-comment-en
    desc: Comment notes bypassing store review
    crit: notable
    conf: 0.92
    if:
      type: text
      regex: '(?i)//[^\n/]{0,80}(bypass|evade).{0,24}(store|google|chrome).{0,16}review'

  - id: store-review-bypass-comment-ar
    desc: Arabic comment notes store review bypass
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: '//[^\n/]{0,80}(لتجاوز الفحص|أمام فحص جوجل)'

  - id: store-review-pretext-comment-ar
    desc: Arabic comment notes review pretext
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: '//[^\n/]{0,80}تبريرها.{0,16}فحص'

composite_rules:
  - id: extension-store-review-evasion-comment
    desc: Extension comments admit store review or permission pretext
    crit: suspicious
    conf: 0.94
    all:
      - id: micro-behaviors/browser-extension/lifecycle::chrome-namespace-core
    any:
      - id: store-review-bypass-comment-en
      - id: store-review-bypass-comment-ar
      - id: store-review-pretext-comment-ar
    unless:
      - id: metadata/path/directory::test-directory-component
