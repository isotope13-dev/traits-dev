# A browser extension that declares it collects no user data while its
# archive contains broad browser access, cookie enumeration, and transmission
# of the collected material is deceiving the installer. The manifest claim
# alone is neutral; the hostile rule requires the collection and transport
# pipeline too.
defaults:
  crit: hostile
  platforms: [windows, unix]
  for: [xpi, crx, zip]

composite_rules:
  - id: extension-false-no-data-collection-claim
    desc: False no-data claim with cookie transmission
    conf: 0.99
    attack: T1539,T1041,T1036
    scope: archive
    for: [xpi, crx, zip, json, chrome-manifest, javascript]
    all:
      - id: metadata/permission/manifest::host-permission-all-urls
      - id: metadata/permission/cookie::permission-cookies
      - id: micro-behaviors/communications/http/cookies::chrome-cookies-get-all
      - id: micro-behaviors/process/hook/webextension::chrome-webrequest-pre-request
      - id: micro-behaviors/communications/http/request/client::javascript-http-request-channel
      - id: micro-behaviors/communications/http/cookies::cookie-object-field
      - id: metadata/permission/telemetry::gecko-no-data-collection-claim
    unless:
      - id: well-known/app/browser-extension/scriptcat::scriptcat-extension-context

  # The wallet kit's variant of the same deception: the manifest claims no
  # data collection while the archive solicits seed words, selects those
  # fields, and POSTs through a runtime-assembled endpoint. The concealed
  # sink is required — a literal-URL recovery page with the same claim does
  # not match.
  - id: false-no-data-claim-seed-phrase-upload
    desc: No-data claim with covert seed-phrase upload
    conf: 0.97
    attack: T1036,T1041
    scope: archive
    for: [xpi, crx, zip, json, chrome-manifest, javascript, html]
    all:
      - id: metadata/permission/telemetry::gecko-no-data-collection-claim
      - id: micro-behaviors/ui/controls/wallet::wallet-phrase-entry-surface
      - id: micro-behaviors/ui/controls/wallet::wallet-seed-word-field-code
      - id: objectives/anti-static/obfuscation/string/charcode-url::js-runtime-assembled-http-endpoint
      - id: micro-behaviors/communications/http/url/build::fetch-local-charcode-url-builder
