# TypeScript-looking `.d.js` paths that actually ship executable JavaScript —
# often a full wallet SDK — while the package advertises an unrelated library.
# matrixflow-js ships src/statMatrix.min.d.js as an ethers.js bundle under a
# declaration-flavored name.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  attack: T1036.008,T1195.002
  mbc: B0030

composite_rules:
  - id: declaration-path-ethers-wallet-bundle
    desc: Declaration-flavored JS path embeds an ethers wallet SDK
    crit: hostile
    conf: 0.97
    all:
      - id: metadata/file/extension/declaration::declaration-flavored-js-basename
      - id: micro-behaviors/crypto/library/blockchain/transaction::ethers-library-reference
    any:
      - id: micro-behaviors/crypto/library/blockchain/wallet::wallet-factory-entrypoint
      - id: micro-behaviors/crypto/library/blockchain/wallet::mnemonic-word-count-check
      - id: micro-behaviors/communications/ipc/rpc::wallet-provider-eth-send-transaction
    unless:
      - id: metadata/package/testing/
      # Do not directory-reference well-known/tool/detection/: ethers bundles
      # can trip unrelated detection-tool markers and suppress real droppers.
