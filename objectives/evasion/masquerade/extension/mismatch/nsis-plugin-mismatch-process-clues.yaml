---
defaults:
  platforms:
  - windows
  for:
  - pe
composite_rules:
- id: nsis-plugin-extension-mismatch-process-api
  desc: NSIS plugin, extension mismatch and process API references
  crit: suspicious
  conf: 0.96
  scope: outer
  all:
  - id: well-known/tool/packaging/nsis::nsis
  - id: metadata/filename/library::nsis-plugin-name-group-c
  - id: well-known/tool/packaging/nsis::nsis-manifest-exehead
  - id: metadata/file/extension/identity::pe-content-extension-mismatch
  - id: metadata/binary/symbols/name/export::system-dll-plugin-export-profile
  any:
  - id: metadata/binary/symbols/name/process::create-process-a
  - id: micro-behaviors/os/handler/open::shell-execute-a
  - id: micro-behaviors/os/handler/open::shell-execute-api-text
  needs: 1
  unless:
  - id: metadata/signature/verified/platform/
