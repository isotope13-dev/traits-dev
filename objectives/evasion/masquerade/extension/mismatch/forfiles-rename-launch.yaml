# A decoded archive's batch payload is written under a non-script extension
# and renamed back only inside the forfiles launch command, so the script
# never rests on disk with an executable extension.
defaults:
  platforms: [windows]
  for: [python]
  attack: T1036.008,T1059.003

composite_rules:
  - id: decoded-archive-renamed-at-launch
    desc: Decoded payload renamed to script at launch
    crit: hostile
    conf: 0.97
    all:
      - id: objectives/execution/payload/file-exec::obfuscated-zip-forfiles-launcher
      - id: micro-behaviors/process/create/shell/command-string::forfiles-rename-then-call
