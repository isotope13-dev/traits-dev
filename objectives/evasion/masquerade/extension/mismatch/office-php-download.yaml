# HTML download lures that display a macro-capable Office document filename
# while routing the download link to an external tracked PHP endpoint.
defaults:
  platforms: [windows, unix]
  for: [html]
  attack: T1036.008,T1204.001
  mbc: B0030

composite_rules:
  - id: macro-office-label-php-download-mismatch
    desc: Macro Office filename label directs download to tracked PHP endpoint
    crit: hostile
    conf: 0.95
    near_bytes: 2000
    all:
      - id: micro-behaviors/ui/keywords::macro-office-filename-markup-label
      - id: objectives/impact/ui/manipulation/traffic/navigation::google-click-tracked-php-download
    any:
      - id: micro-behaviors/ui/window/display::html-document-download-instruction
      - id: objectives/impact/ui/manipulation/traffic/navigation::download-link-label
