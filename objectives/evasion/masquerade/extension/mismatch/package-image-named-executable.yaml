# A package that ships a real executable under an image name and whose own
# install-time code renames an image path to an executable suffix: the
# payload is disguised in the published file list and only becomes a program
# on the victim. Either half alone is common (icon assets, odd vendored
# binaries); both in one package is the dropper pattern.
defaults:
  platforms: [windows, unix]
  for: [gem, tar, ruby, pe, elf, macho, pkg_info]
  attack: T1036.008

composite_rules:
  - id: package-renames-image-named-executable
    desc: Package ships an executable named as an image and renames it to run
    crit: hostile
    conf: 0.95
    scope: outer
    all:
      - id: objectives/evasion/masquerade/binary/filename::binary-content-as-image-extension
      - id: micro-behaviors/fs/file/rename::ruby-rename-image-to-executable
