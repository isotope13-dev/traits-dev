# A package that ships a real executable under an image name and whose own
# install-time code renames an image path to an executable suffix: the
# payload is disguised in the published file list and only becomes a program
# on the victim. Either half alone is common (icon assets, odd vendored
# binaries); both in one package is the dropper pattern.
defaults:
  platforms: [windows, unix]
  for: [gem, tar, ruby, pe, elf, macho, pkg_info]
  attack: T1036.008

composite_rules:
  # A Python wheel can carry the executable as an image resource, copy it to
  # an executable path, then request UAC elevation. Join the executable bytes
  # to the source operations at package scope so the finding stays visible on
  # the published artifact.
  - id: python-wheel-elevates-image-resource
    desc: Wheel bundles image executable and runas launcher
    crit: hostile
    conf: 0.97
    attack: T1036.008,T1548.002
    for: [whl, pe, python]
    platforms: [windows]
    scope: package
    all:
      - id: objectives/evasion/masquerade/binary/filename::binary-disguised-as-image-extension
      - id: micro-behaviors/fs/file/rename::move-image-resource
      - id: micro-behaviors/os/privilege/elevation::python-ctypes-shell-execute-runas

  - id: package-renames-image-named-executable
    desc: Package ships an executable named as an image and renames it to run
    crit: hostile
    conf: 0.95
    scope: outer
    all:
      - id: objectives/evasion/masquerade/binary/filename::binary-content-as-image-extension
      - id: micro-behaviors/fs/file/rename::ruby-rename-image-to-executable
