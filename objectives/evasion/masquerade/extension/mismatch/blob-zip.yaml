defaults:
  for: [html]
  platforms: [windows, unix]
  crit: hostile
  conf: 0.98
  attack: T1036,T1027.006
composite_rules:
  - id: embedded-zip-extension-removal
    desc: Embedded ZIP download strips its archive extension
    all:
      - id: metadata/file/encoding::base64-zip-string-assignment
      - id: micro-behaviors/data/buffer/alloc::browser-blob-construction
      - id: micro-behaviors/data/string/replace::javascript-remove-zip-text
      - id: micro-behaviors/data/decode/base64::base64-decode-call-text
    near_lines: 45
