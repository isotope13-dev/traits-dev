defaults:
  platforms: [windows]
  for: [ooxml]
  attack: T1036.008
  mbc: F0008

composite_rules:
  - id: ooxml-vba-masquerades-as-c-source
    desc: VBA project disguised as C source
    crit: hostile
    conf: 0.98
    size_min: 2048
    size_max: 65536
    all:
      - id: metadata/document/office/macro::ooxml-vba-c-extension-part
      - id: metadata/document/office/macro::ppt-vba-declared-macro
      - id: metadata/document/office/markup::ooxml-zero-byte-member
      - id: metadata/document/office/markup::ooxml-compact-package
