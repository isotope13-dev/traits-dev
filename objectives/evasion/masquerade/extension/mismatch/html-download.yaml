# Attribute-level document/executable mismatch, without lure prose.
defaults:
  for: [html]
  platforms: [windows, macos, linux]
  attack: T1036.008
  crit: suspicious
  conf: 0.96

traits:
  - id: executable-document-download-url-first
    desc: Executable link uses document download name
    if:
      type: text
      exclude_html_comments: true
      regex: '(?i)\shref=["''][^"''<>]{1,120}\.exe["'']\s+download=["''][^"''<>]{1,120}\.pdf["'']'
  - id: executable-document-download-name-first
    desc: Executable link uses document download name
    if:
      type: text
      exclude_html_comments: true
      regex: '(?i)\sdownload=["''][^"''<>]{1,120}\.pdf["''][^<>]{0,40}\shref=["''][^"''<>]{1,120}\.exe["'']'
