# A file whose extension claims one source/script language but whose actual
# content is a different interpreter's program (e.g. a `.php` that is really
# `python3 -c "<code>"`). Disguising the loader's true language defeats extension-
# and parser-based triage — the SiteGuarding droppers ship Python/data logic under
# PHP and data filenames. These composites infer the masquerade intent; the
# neutral signals they reference live in metadata/ (structural metrics) and
# micro-behaviors/ (decompression, file-read).
defaults:
  platforms: [linux, macos, windows]
  conf: 0.95
  attack: T1036.008

composite_rules:
  # === SUSPICIOUS: mislabeled single-line source file ========================
  # A non-trivial source file that is one dense line, does not parse as its
  # declared language, AND has an explicit content/extension mismatch. The
  # mismatch gate keeps valid source files with an isolated long line out of
  # this masquerade signal.
  - id: mislabeled-single-line-source
    desc: One-line source extension mismatch
    crit: notable
    conf: 0.85
    attack: T1036.008,T1027
    # The extension/content consistency metric is defined for these script
    # families; keep the batch variant because the CJK batch loader composes
    # this structural signal. Python foreign-interpreter droppers have their
    # dedicated hostile rule below and valid Python source must not reach this
    # heuristic through embedded JavaScript text.
    for: [shell, javascript, html, batch]
    scope: leaf
    # Large multi-line source modules can expose embedded examples to the
    # extension metric; this one-line masquerade heuristic is for compact
    # stagers, not full application grammar/resource modules.
    size_max: 32768
    all:
      - id: metadata/file/metrics::source-degenerate-ast
      - id: metadata/file/metrics::file-one-liner
      - id: metadata/file/extension/identity::script-content-extension-mismatch
    unless:
      # The composite's language set intentionally excludes Python; retain an
      # explicit extension guard because archive-leaf metrics can be typed as
      # generic scripts while the source remains a valid Python module.
      - id: metadata/file/extension/identity::python-source-extension
      - id: metadata/file/extension/identity::template-source-basename
      - id: well-known/app/ai/coding-agent/tabby::tabby-eval-dataset-member
      - id: well-known/app/publishing/civicrm/
      - id: well-known/app/enterprise/egroupware/
      - id: metadata/library/structure/
      - id: metadata/package/files/dependency::node-modules-path
      - id: metadata/lang/source::automatically-generated-source-marker
      - id: metadata/file/profile/identity::notepad-plus-plus-language-model

  # === HOSTILE: interpreter dropper disguised under a foreign source extension =
  # Decompression + external file read surfacing on a non-python, non-shell source
  # host means a foreign interpreter program is concealed inside it (a `.py` or a
  # shell launching python is not a masquerade and is excluded by the gate).
  - id: interpreter-program-disguised-as-source
    desc: Interpreter dropper disguised as foreign source
    crit: hostile
    conf: 0.95
    attack: T1036.008,T1027
    for: [php, javascript, ruby, perl, lua, powershell]
    all:
      - id: micro-behaviors/data/compress/library::script-decompress-call
      - id: micro-behaviors/fs/file/open::file-read-call
    any:
      - id: micro-behaviors/fs/file/extension::data-blob-extension
      - id: micro-behaviors/data/compress/library::decompress-decoded-to-text
