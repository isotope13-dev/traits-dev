defaults:
  platforms:
  - linux
  - macos
  - windows
  conf: 0.95
  attack: T1036.008,T1027
composite_rules:
- id: mislabeled-single-line-source
  desc: One-line source extension mismatch
  crit: notable
  conf: 0.85
  for:
  - shell
  - javascript
  scope: leaf
  size_max: 32768
  all:
  - id: metadata/lang/source/shape::source-small-ast
  - id: metadata/file/line::file-one-liner
  - id: metadata/file/extension/mismatch::script-content-extension-mismatch
  unless:
  - id: metadata/file/extension/identity::python-source-extension
- id: interpreter-program-disguised-as-source
  desc: Interpreter dropper disguised as foreign source
  crit: hostile
  conf: 0.95
  for:
  - php
  - javascript
  - ruby
  - perl
  - lua
  - powershell
  all:
  - id: metadata/lang/source/shape::source-small-ast
  - id: micro-behaviors/data/compression::script-decompression-operation-evidence
  - id: micro-behaviors/fs/file/open/read::file-read-call
  any:
  - id: micro-behaviors/fs/file/extension::data-blob-extension
  - id: micro-behaviors/data/compression::decompression-output-text-decode
