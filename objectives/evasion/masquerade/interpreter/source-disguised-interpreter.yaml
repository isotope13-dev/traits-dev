defaults:
  platforms:
  - linux
  - macos
  - windows
  conf: 0.95
  attack: T1036.008,T1027
composite_rules:
- id: mislabeled-single-line-source
  desc: One-line source extension mismatch
  crit: notable
  conf: 0.85
  for:
  - shell
  - javascript
  scope: leaf
  size_max: 32768
  all:
  - id: metadata/file/function::source-degenerate-ast
  - id: metadata/file/line::file-one-liner
  - id: metadata/file/extension/identity::script-content-extension-mismatch
  unless:
  - id: metadata/file/extension/identity::python-source-extension
  - id: metadata/file/extension/identity::template-source-basename
  - id: well-known/app/ai/coding-agent/tabby::tabby-eval-dataset
  - id: well-known/app/publishing/civicrm/
  - id: well-known/app/enterprise/egroupware/
  - id: metadata/build
  - id: metadata/package/files/dependency::node-modules-path
  - id: metadata/lang/natural/phrasing::generated-by-wording
  - id: well-known/app/productivity/notepad-plus-plus::notepad-plus-plus-language-model
- id: interpreter-program-disguised-as-source
  desc: Interpreter dropper disguised as foreign source
  crit: hostile
  conf: 0.95
  for:
  - php
  - javascript
  - ruby
  - perl
  - lua
  - powershell
  all:
  - id: metadata/file/function::source-degenerate-ast
  - id: micro-behaviors/data/compression::script-decompression-operation-evidence
  - id: micro-behaviors/fs/file/open::file-read-call
  any:
  - id: micro-behaviors/fs/file/extension::data-blob-extension
  - id: micro-behaviors/data/compression::decompression-output-text-decode
