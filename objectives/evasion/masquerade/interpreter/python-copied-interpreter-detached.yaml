defaults:
  platforms: [windows]
  for: [python]
  attack: T1036.005,T1564.003

composite_rules:
  # Copying pythonw to a temp path and starting the copy detached hides the
  # interpreter's origin from process listings and console output.
  - id: python-copied-pythonw-started-detached
    desc: Python copies pythonw to temp and starts it detached
    crit: suspicious
    conf: 0.9
    scope: file
    all:
      - id: micro-behaviors/fs/file/copy/source-destination::shutil-copy
      - id: micro-behaviors/os/application/target/development::pythonw-executable-reference
      - id: micro-behaviors/process/daemonize/detach::python-detached-session-or-flag
