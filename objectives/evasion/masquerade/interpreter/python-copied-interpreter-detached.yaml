defaults:
  platforms: [windows]
  for: [python]
  attack: T1036.003,T1036.005,T1564.003

traits:
  - id: pythonw-copied-to-exe
    desc: Copies pythonw binary to executable path
    crit: notable
    conf: 0.96
    if:
      type: symbol
      kind: call
      regex: '^shutil\.(copy|copy2|copyfile)$'
      args:
        - index: 0
          from:
            value: '(?i)(^|[\\/])pythonw(\.exe)?$'
            through:
              - call: '^os\.path\.join$'
                arguments: [0, 1]
              - call: '^Path\.with_name$'
                arguments: [0]
        - index: 1
          from:
            value: '(?i)\.exe$'
            through:
              - call: '^os\.path\.join$'
                arguments: [0, 1]
              - call: '^Path\.with_name$'
                arguments: [0]

composite_rules:
  - id: python-copied-pythonw-temp-spawn
    desc: Python copies pythonw to temp and spawns it
    crit: suspicious
    conf: 0.92
    attack: T1036.003,T1036.005
    scope: file
    all:
      - id: pythonw-copied-to-exe
      - id: micro-behaviors/process/deploy/file-exec/spawn::python-copy-and-spawn-same-path
      - id: micro-behaviors/fs/temp/directory

  # Copying pythonw to a temp path and starting the copy detached hides the
  # interpreter's origin from process listings and console output.
  - id: python-copied-pythonw-started-detached
    desc: Python copies pythonw to temp and starts it detached
    crit: hostile
    conf: 0.96
    mbc: F0004
    scope: file
    all:
      - id: pythonw-copied-to-exe
      - id: micro-behaviors/process/deploy/file-exec/spawn::python-copy-and-spawn-same-path
      - id: micro-behaviors/fs/temp/directory
    any:
      - id: micro-behaviors/process/daemonize/detach::python-detached-daemon-process
      - id: micro-behaviors/process/daemonize/spawn::python-popen-detached-process
      - id: micro-behaviors/process/config/launch::python-detached-process-use
      - id: micro-behaviors/process/config/launch::python-detached-hidden-hex
      - id: micro-behaviors/process/config/launch::python-create-no-window-hex
      - id: micro-behaviors/process/config/launch::creationflags
      - id: micro-behaviors/process/config/launch::create-no-window
      - id: micro-behaviors/process/config/launch::detached-process
