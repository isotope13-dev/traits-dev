# Abyss Web Server interpreters run every request for their extensions. A
# system shell bound to .log/.txt/image extensions executes files that look
# like inert data, so a script dropped or written under such a name runs as
# a shell command on request.
defaults:
  for: [xml, text]
  platforms: [unix, windows]
  conf: 0.95
  attack: T1036.008
composite_rules:
  - id: abyss-shell-interpreter-for-data-extension
    desc: Abyss runs .log/.txt/image files via a shell
    crit: hostile
    near_bytes: 400
    all:
      - id: micro-behaviors/communications/http/server/route::abyss-interpreter-data-extension
    any:
      - id: micro-behaviors/communications/http/server/route::abyss-interpreter-unix-shell
      - id: micro-behaviors/communications/http/server/route::abyss-interpreter-windows-shell
