# These APIs and unsigned version claims also occur in catalog-signed Windows
# components, so their presence does not establish identity spoofing.
defaults:
  platforms: [windows]
  for: [pe]
  attack: T1036.005,T1543.003,T1569.002
composite_rules:
  - id: unsigned-microsoft-labelled-service-device-controller
    desc: Unsigned Microsoft-labelled service with device control APIs
    crit: notable
    attack: none
    conf: 0.85
    all:
      - id: metadata/binary/provenance/version-info::company-microsoft-corporation
      - id: metadata/signature/absent::unsigned-missing-signature-record
      - id: micro-behaviors/os/service/control::control-service
      - id: micro-behaviors/os/service/dispatch::register-service-handler
      - id: micro-behaviors/os/sysinfo/device-enum::cm-locate-devnode-w
    unless:
      - id: metadata/signature/verified/platform/
