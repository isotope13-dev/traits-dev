# The same masquerade seen from the service side: an unsigned binary with
# Microsoft company metadata that registers a service control handler, calls
# ControlService on other services and locates device nodes with
# Configuration Manager. A system component does one of these; a wrapper
# that borrows a Microsoft identity does them all to manage the host.
defaults:
  platforms: [windows]
  for: [pe]
  attack: T1036.005,T1543.003,T1569.002
composite_rules:
  - id: unsigned-microsoft-labelled-service-device-controller
    desc: Unsigned Microsoft-labelled service and device controller
    crit: hostile
    conf: 0.85
    all:
      - id: metadata/binary/provenance/version-info::company-microsoft-corporation
      - id: metadata/signed/trust-level::unsigned-missing-signature-record
      - id: micro-behaviors/os/service/control::control-service
      - id: micro-behaviors/os/service/dispatch::register-service-handler
      - id: micro-behaviors/os/sysinfo/device-enum::cm-locate-devnode-w
    unless:
      - id: metadata/signed/platform/
