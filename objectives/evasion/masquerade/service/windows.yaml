# Windows service name typosquat masquerading
# Detects binaries that embed misspelled Windows service names to blend in
defaults:
  platforms: [windows]
  for: [pe, dll]
  attack: T1036.004
  mbc: F0004
traits:
- id: svchost-misspell-schost
  desc: Typosquatted svchost name (schost)
  crit: suspicious
  conf: 0.92
  if:
    type: text
    substr: \schost.exe
- id: svchost-misspell-svhost
  desc: Typosquatted svchost name (svhost)
  crit: suspicious
  conf: 0.92
  if:
    type: text
    substr: \svhost.exe
- id: svhost-lookalike-executable-name
  desc: References the svchost lookalike svhost.exe
  crit: notable
  conf: 0.9
  if:
    type: text
    # No boundaries on either side: RAT config blobs pack field values
    # directly against their separator tokens (svhost.exeH83Z...), the same
    # convention the dllhost-target atom follows.
    regex: '(?i)svhost\.exe'
- id: service-host-process-label
  desc: Fake Service Host Process description
  crit: notable
  conf: 0.85
  if:
    type: text
    exact: Service Host Process
# Fake Windows telemetry/diagnostics services used as persistence cover for
# installers that also plant Defender exclusions and remote-download stages.
- id: windows-telemetry-service-name
  desc: Fake Windows telemetry service name
  crit: suspicious
  conf: 0.9
  if:
    type: text
    regex: '(?i)\bWinTelemetry(Svc|Service)\b|Windows Telemetry Service'
- id: windows-telemetry-service-desc
  desc: Fake Windows telemetry service description
  crit: notable
  conf: 0.88
  if:
    type: text
    substr: Provides system telemetry and diagnostics
composite_rules:
# A compiled AutoIt executable whose embedded stage carries both the dllhost
# relocation path and the svhost lookalike is a script-dropper implant naming
# its payload after the service host -- the AutoIt-packed RAT installer shape.
# The AutoIt identity alone is ordinary automation software, and each string
# alone is a path; the combination in one compiled stage is the finding.
- id: autoit-lookalike-system-install
  desc: Compiled AutoIt stage carries dllhost path and svhost lookalike
  crit: suspicious
  conf: 0.9
  all:
  - id: metadata/lang/compiled::autoit-compiled-script
  - id: svhost-lookalike-executable-name
  - id: objectives/evasion/process/injection/hollowing/process::dllhost-target

- id: svchost-masquerade-network
  desc: Svchost masquerade with network activity
  crit: hostile
  conf: 0.95
  all:
  - id: micro-behaviors/communications/socket/init::wsa-startup
  any:
  - id: micro-behaviors/fs/path/application/executable::scvhost-executable-name-reference
  - id: svchost-misspell-schost
  - id: svchost-misspell-svhost

- id: svhost-masquerade-ip-c2
  desc: Fake svhost talks over a raw-IP URL
  crit: hostile
  conf: 0.95
  attack: T1036.004,T1071.001
  all:
  - id: svchost-misspell-svhost
  - id: micro-behaviors/communications/ip/literal::http-ip-url-text
  unless:
  - id: metadata/signed/platform/
  - id: metadata/binary/installer/family/

- id: svhost-masquerade-external-ip
  desc: Fake svhost embeds an external-IP URL
  crit: hostile
  conf: 0.95
  attack: T1036.004,T1071.001
  all:
  - id: svchost-misspell-svhost
  - id: micro-behaviors/communications/ip/literal::external-ipv4-http-url
  unless:
  - id: metadata/signed/platform/
  - id: metadata/binary/installer/family/

- id: svhost-masquerade-ip-endpoint
  desc: Fake svhost embeds an IPv4 HTTP endpoint
  crit: hostile
  conf: 0.94
  attack: T1036.004,T1071.001
  all:
  - id: svchost-misspell-svhost
  - id: micro-behaviors/communications/http/url/external-ip::url-external-ip-binary
  unless:
  - id: metadata/signed/platform/
  - id: metadata/binary/installer/family/

- id: svhost-masquerade-urlmon
  desc: Fake svhost downloads a file via URLMon
  crit: hostile
  conf: 0.95
  attack: T1036.004,T1105
  all:
  - id: svchost-misspell-svhost
  - id: micro-behaviors/communications/http/client/urlmon::url-download-to-file-str
  unless:
  - id: metadata/signed/platform/
  - id: metadata/binary/installer/family/

- id: windows-telemetry-service-masquerade
  desc: Fake telemetry service with security blinding
  crit: hostile
  conf: 0.95
  attack: T1036.004,T1562.001
  all:
  - id: windows-telemetry-service-name
  - id: micro-behaviors/os/service/dispatch::service-dispatch-triad
  any:
  - id: micro-behaviors/os/security/defender::defender-exclusion-command
  - id: objectives/impact/degrade/windows-policy::ci-verified-reputable-policy-disable
  - id: windows-telemetry-service-desc
