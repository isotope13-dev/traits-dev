# Reverse-access installers on Linux appliances sometimes persist as a
# systemd unit named network-manager.service (hyphenated), which is not the
# distro NetworkManager.service unit. Pairing that unit path with a unit
# drop under /etc/systemd/system is the masquerade signal.
defaults:
  platforms: [unix]
  for: [shell, python, go, elf]
  attack: T1036.004,T1543.002
  mbc: F0008

traits:
  - id: network-manager-hyphen-unit-path
    desc: Hyphenated network-manager.service unit path
    crit: suspicious
    conf: 0.9
    if:
      type: text
      regex: '(?i)/etc/systemd/system/network-manager\.service\b'

  - id: network-manager-hyphen-unit-enable
    desc: systemctl enables network-manager.service
    crit: suspicious
    conf: 0.92
    if:
      type: text
      regex: '(?i)\bsystemctl\s+(enable|start)\b[^\n]{0,40}\bnetwork-manager\.service\b'

composite_rules:
  - id: network-manager-systemd-masquerade
    desc: Persists as hyphenated network-manager.service
    crit: hostile
    conf: 0.97
    all:
      - id: network-manager-hyphen-unit-path
      - id: network-manager-hyphen-unit-enable
    any:
      - id: micro-behaviors/os/service/restart-policy::restart-always-text
      - id: micro-behaviors/os/service/config::exec-start-text
    near_lines: 30
