# Mining options distinguish a disguised miner service from an Edge updater
# test or an installer merely mentioning browser names. Optional chosen names
# corroborate the content-derived registration, location and mining evidence.
defaults:
  platforms: [windows]
  for: [batch, powershell]
  attack: T1036.004
  mbc: F0008
composite_rules:
  - id: edge-update-service-masquerade
    desc: Edge-labelled Temp service beside mining options
    crit: hostile
    conf: 0.97
    all:
      - id: micro-behaviors/os/service/create::sc-create-command
      - id: micro-behaviors/os/service/configure::service-image-temp-path
      - id: micro-behaviors/process/argument/option::miner-pool-endpoint-option
    any:
      - id: micro-behaviors/os/service/name::edge-update-service-name
      - id: micro-behaviors/fs/path/application/browser::edge-named-temp-executable-path
    near_bytes: 4096
