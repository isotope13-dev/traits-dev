# A Windows service whose name impersonates the Microsoft Edge updater, run
# from a user-writable staging directory. The genuine Edge update service is
# registered as `edgeupdate` / `edgeupdatem` (and the elevation service as
# `MicrosoftEdgeElevationService`); nothing legitimate registers a service
# named `MicrosoftEdgeUpdateSvc`/`MicrosoftEdgeUpdateService`, so that name
# is an impersonation handle a casual `services.msc` listing reads as Edge.
#
# Worked example: the AhsayCBS XMRig intrusion (Huntress, Oct 2026) registered
# `MicrosoftEdgeUpdateSvc` pointing at a renamed NSSM wrapper (`msedge.exe`)
# and the miner (`edge.exe`) staged under %LOCALAPPDATA%\Temp.
defaults:
  platforms: [windows]
  for: [scripts, binaries, csharp]
  attack: T1036.004
  mbc: F0008
traits:
  - id: edge-update-service-name-mimic
    desc: Service name mimics Edge updater
    crit: suspicious
    conf: 0.9
    if:
      type: text
      # Real service keys are `edgeupdate`/`edgeupdatem`; these CamelCase
      # forms are the impersonation spelling, not a Windows service name.
      regex: '(?i)\bMicrosoftEdgeUpdate(Svc|Service)\b'
  - id: edge-named-temp-payload-path
    desc: Edge-named exe staged in temp path
    crit: suspicious
    conf: 0.9
    if:
      type: text
      regex: '(?i)\bTemp[%\\][^\r\n"'']{0,80}(ms)?edge\.exe'
composite_rules:
  - id: edge-update-service-masquerade
    desc: Service masquerades as Edge updater
    crit: hostile
    conf: 0.97
    all:
      - id: edge-update-service-name-mimic
    any:
      - id: edge-named-temp-payload-path
      - id: micro-behaviors/os/service/create::sc-create-command
      - id: micro-behaviors/os/service/configure::service-executable-image-path
