# Kernel worker threads are not started by user-space systemd ExecStart.
# Match the disguise and an execution directive in the same unit template;
# mentioning a worker name or a service filename alone is insufficient.
defaults:
  platforms: [linux]
  for: [elf]
traits:
  - id: kernel-worker-unit-exec-template
    desc: User service impersonates kernel worker
    crit: suspicious
    conf: 0.97
    attack: T1036.004
    if:
      type: raw
      section: .rodata
      regex: 'Description=kworker\n{1,2}\[Service\]\nExecStart=%s\nRestart=always'
