defaults:
  for: [javascript]
  platforms: [linux]
traits:
  - id: node-replace-hermes-gateway-brand
    desc: Replaces Hermes gateway service branding
    crit: notable
    if:
      type: text
      substr: '.replace(/Hermes Agent Gateway'
composite_rules:
  - id: node-rebrand-hermes-unit
    desc: Rebrands Hermes gateway and removes original unit
    crit: suspicious
    conf: 0.97
    near_lines: 20
    all:
      - id: node-replace-hermes-gateway-brand
      - id: micro-behaviors/fs/write/file/reference::node-write-file-sync-call
      - id: micro-behaviors/fs/delete/file/library::fs-unlinkSync
