# Systemd unit descriptions mentioning a common web daemon.
defaults:
  platforms: [unix]
  for: [c, cpp, go, rust, elf, shell, python]
  attack: T1036.004,T1543.002
  mbc: F0008

traits:
  - id: apache-httpd-unit-description
    desc: Systemd Description claims Apache/httpd role
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: 'Description=[^\n]{0,80}\b(Apache|httpd)\b'
    unless:
      # Non-httpd Apache Software Foundation products (e.g. Flink, Tomcat,
      # ActiveMQ, Kafka, Cassandra, Hadoop, Spark, Solr, ZooKeeper) are not
      # the Apache HTTP (httpd) web daemon.
      - type: text
        regex: 'Description=[^\n]{0,40}\bTomcat\b'
      - type: text
        regex: 'Description=[^\n]{0,40}\b(Flink|ActiveMQ)\b'
      - type: text
        regex: 'Description=[^\n]{0,40}\b(Kafka|Cassandra|Spark)\b'
      - type: text
        regex: 'Description=[^\n]{0,40}\b(Hadoop|Solr|ZooKeeper)\b'

  - id: nginx-unit-description
    desc: Systemd Description claims nginx role
    crit: notable
    conf: 0.88
    if:
      type: text
      regex: 'Description=[^\n]{0,80}\bnginx\b'

composite_rules:
  - id: web-daemon-systemd-masquerade
    desc: Restarting systemd unit with web daemon description
    crit: notable
    conf: 0.96
    attack: none
    mbc: none
    all:
      - id: micro-behaviors/os/service/config::systemd-etc-unit-path
      - id: micro-behaviors/os/service/restart/policy::restart-always-text
    any:
      - id: apache-httpd-unit-description
      - id: nginx-unit-description
    unless:
      - id: metadata/path/software::proxmoxve-community-scripts
