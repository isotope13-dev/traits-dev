# Systemd unit Description= lines that claim to be a common web/server helper
# (Apache/httpd/nginx cache or manager). Legitimate distro units for those
# products rarely embed the Description string inside a C/Go/shell installer
# that also writes /etc/systemd/system; that pairing is the masquerade.
defaults:
  platforms: [unix]
  for: [c, cpp, go, rust, elf, shell, python]
  attack: T1036.004,T1543.002
  mbc: F0008

traits:
  - id: apache-httpd-unit-description
    desc: Systemd Description claims Apache/httpd role
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: 'Description=[^\n]{0,80}\b(Apache|httpd)\b'

  - id: nginx-unit-description
    desc: Systemd Description claims nginx role
    crit: notable
    conf: 0.88
    if:
      type: text
      regex: 'Description=[^\n]{0,80}\bnginx\b'

composite_rules:
  - id: web-daemon-systemd-masquerade
    desc: Writes a restarting unit masquerading as a web daemon
    crit: hostile
    conf: 0.96
    all:
      - id: micro-behaviors/os/service/config::systemd-etc-unit-path
      - id: micro-behaviors/os/service/restart-policy::restart-always-text
    any:
      - id: apache-httpd-unit-description
      - id: nginx-unit-description
