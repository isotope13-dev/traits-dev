# The genuine Defender service is WinDefend. A binary that names its own
# service "WinDefender" and writes service registry keys is borrowing the
# security product's identity to survive casual review.
defaults:
  platforms: [windows]
  for: [pe, dll]
  attack: T1036.004
traits:
  - id: windefender-lookalike-name
    desc: WinDefender name, not the real WinDefend service
    crit: suspicious
    conf: 0.9
    if:
      type: text
      # Camel-case WinDefender is the fake service name. Cygwin's
      # cygcheck blocklist stores the same letters in all caps beside
      # SYMANTEC and ZONEALARM; that table is not a service identity.
      regex: '\bWinDefender(\.exe)?\b'
    unless:
      - id: metadata/signed/platform/
composite_rules:
  - id: windefender-lookalike-service-registration
    desc: Registers a service key under a fake Defender name
    crit: hostile
    conf: 0.9
    attack: T1036.004,T1543.003
    all:
      - id: windefender-lookalike-name
      - id: micro-behaviors/os/registry/keys/service::service-key-format-string
      - id: micro-behaviors/os/registry/write::reg-set-value-ex-a
