# Bound source and destination arguments expose text-to-script renaming.
# DownloadFile covers multiple .NET languages and helper implementations;
# urlretrieve covers the same technique in Python without an ecosystem gate.
defaults:
  for: [scripts, source]
  platforms: [windows, unix]
  crit: suspicious
  conf: 0.95
  attack: T1036
traits:
  - id: downloadfile-text-source-to-script
    desc: DownloadFile renames text source to script
    if:
      type: text
      regex: '(?i)\bDownloadFile\s*\(["''][^"'']{1,99}\.txt["'']\s*,\s*["''][^"'']{1,99}\.(vbe|jse|py|sh)["'']'
  - id: urlretrieve-text-source-to-script
    desc: urlretrieve renames text source to script
    for: [python]
    if:
      type: text
      regex: '(?i)\burlretrieve\s*\(["''][^"'']{1,99}\.txt["'']\s*,\s*["''][^"'']{1,99}\.(vbe|jse|py|sh)["'']'
