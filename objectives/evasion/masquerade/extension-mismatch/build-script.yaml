# A build pipeline that edits a PE's visible version resources and then copies
# an explicitly dropper-named release executable to a data-file extension is
# preparing an executable to be mistaken for inert configuration or data.
defaults:
  platforms: [unix]
  for: [shell]
  attack: T1036.008

composite_rules:
  - id: rebranded-dropper-data-extension
    desc: Rebrands dropper executable under data extension
    crit: hostile
    conf: 0.99
    all:
      - id: objectives/command-and-control/dropper/builder::release-dropper-executable-path
      - id: micro-behaviors/fs/attributes/version::shell-rcedit-resource-editor
      - id: micro-behaviors/fs/file/copy::release-executable-copy-to-named-output
      - id: metadata/build/artifact::data-extension-output-variable
