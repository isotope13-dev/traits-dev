# rfiles/afiles are interpreted as mIRC source, not native libraries.
# This is suspicious configuration evidence; the script bytes may be absent.
defaults:
  for: [text]
  platforms: [windows]
composite_rules:
  - id: mirc-scr-suffixed-script-config
    desc: mIRC script list uses screensaver suffixes
    crit: suspicious
    conf: 0.9
    all:
      - id: metadata/file/format/structured::mirc-client-config-section
      - id: micro-behaviors/data/config/schema::mirc-scr-extension-script-entry
  - id: mirc-dll-suffixed-script-config
    desc: mIRC script list uses DLL suffixes
    crit: suspicious
    conf: 0.95
    all:
      - id: micro-behaviors/data/config/schema::mirc-dll-extension-script-entry
    any:
      - id: metadata/file/format/structured::mirc-client-config-section
      - id: metadata/file/format/structured::mirc-remote-script-list

  - id: mirc-image-suffixed-script-config
    desc: mIRC script list uses image suffixes
    crit: suspicious
    conf: 0.95
    all:
      - id: metadata/file/format/structured::mirc-client-config-section
      - id: micro-behaviors/data/config/schema::mirc-image-extension-script-entry

  - id: mirc-sys-suffixed-script-config
    desc: mIRC remote-script list uses driver suffixes
    crit: suspicious
    conf: 0.95
    all:
      - id: metadata/file/format/structured::mirc-remote-script-list
      - id: micro-behaviors/data/config/schema::mirc-sys-extension-script-entry

  - id: mirc-ocx-suffixed-script-config
    desc: mIRC remote-script list uses OCX suffixes
    crit: suspicious
    conf: 0.95
    all:
      - id: metadata/file/format/structured::mirc-client-config-section
      - id: micro-behaviors/data/config/schema::mirc-ocx-extension-script-entry

  - id: mirc-exe-suffixed-script-config
    desc: mIRC remote-script list uses EXE suffixes
    crit: suspicious
    conf: 0.95
    all:
      - id: metadata/file/format/structured::mirc-client-config-section
      - id: micro-behaviors/data/config/schema::mirc-exe-extension-script-entry

  # Disguised script configuration, not proof of remote backdoor access.
  - id: mirc-disguised-scripts-custom-dde
    desc: DLL/OCX mIRC scripts with custom DDE server
    crit: suspicious
    conf: 0.85
    all:
      - id: micro-behaviors/data/config/schema::mirc-dde-server-enabled
      - id: micro-behaviors/data/config/schema::mirc-dde-custom-service-name
    any:
      - id: objectives/evasion/masquerade/extension-mismatch::mirc-dll-suffixed-script-config
      - id: objectives/evasion/masquerade/extension-mismatch::mirc-ocx-suffixed-script-config

  - id: mirc-drv-suffixed-script-config
    desc: mIRC remote-script list uses driver suffixes
    crit: suspicious
    conf: 0.95
    all:
      - id: metadata/file/format/structured::mirc-remote-script-list
      - id: micro-behaviors/data/config/schema::mirc-drv-extension-script-entry
