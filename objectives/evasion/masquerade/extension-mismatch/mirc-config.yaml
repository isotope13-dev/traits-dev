# rfiles/afiles are interpreted as mIRC source, not native libraries.
# This is suspicious configuration evidence; the script bytes may be absent.
defaults:
  for: [text]
  platforms: [windows]
composite_rules:
  - id: mirc-scr-suffixed-script-config
    desc: mIRC script list uses screensaver suffixes
    crit: suspicious
    conf: 0.9
    all:
      - id: metadata/file/format/structured::mirc-client-config-section
      - id: micro-behaviors/data/config/schema::mirc-scr-extension-script-entry
  - id: mirc-dll-suffixed-script-config
    desc: mIRC script list uses DLL suffixes
    crit: suspicious
    conf: 0.95
    all:
      - id: metadata/file/format/structured::mirc-client-config-section
      - id: micro-behaviors/data/config/schema::mirc-dll-extension-script-entry

  - id: mirc-image-suffixed-script-config
    desc: mIRC script list uses image suffixes
    crit: suspicious
    conf: 0.95
    all:
      - id: metadata/file/format/structured::mirc-client-config-section
      - id: micro-behaviors/data/config/schema::mirc-image-extension-script-entry
