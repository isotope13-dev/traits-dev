defaults:
  platforms: [windows]
  for: [pe, dll]
  attack: T1036.007,T1027
composite_rules:
  - id: packed-random-export-dll-disguised-as-data
    desc: Packed randomized-export DLL uses data extension
    crit: hostile
    conf: 0.98
    for: [dll]
    unless:
      - id: well-known/app/
      - id: well-known/lib/
      - id: well-known/tool/
    all:
      - id: metadata/file/extension/identity::pe-content-extension-mismatch
      - id: metadata/signed/trust-level::unsigned-missing-signature-record
    any:
      - id: metadata/binary/provenance/version-info::pe-non-architecture-filename-mismatch
      - id: metadata/binary/symbols/export-name-pattern::fifty-letters-only-export-names
      - id: metadata/binary/header/characteristics::many-aliased-exports
      - id: metadata/binary/symbols/count::exports-at-least-256
      - id: metadata/binary/symbols/count::pe-sparse-import-table
      - id: metadata/file/entropy::very-high-overall-entropy-75
      - id: metadata/binary/layout/size::multi-megabyte-pe-negligible-code
      - id: metadata/binary/section/ratio::large-pe-largest-section-over-98-percent
      - id: metadata/binary/header/malformed::pe-dos-stub-zeroed
    needs: 3
  # Signed sibling of the DLL rule above for the self-signed Go EXE shape:
  # the binary is a GUI executable wearing a data-suffix disguise (.bin),
  # its module path is a single opaque token, and the only identity it
  # offers is a certificate it issued to itself. No legitimate vendor
  # ships a GUI tool this way.
  - id: self-signed-go-exe-disguised-as-data
    desc: Self-signed obfuscated Go EXE uses data extension
    crit: hostile
    conf: 0.96
    all:
      - id: metadata/file/extension/mismatch::pe-content-data-extension-mismatch
      - id: metadata/signed/certificate/chain::pe-cert-leaf-self-issued
      - id: metadata/lang/compiler/systems::go-opaque-module-path
      - id: metadata/binary/header/characteristics::pe-windows-gui-subsystem
