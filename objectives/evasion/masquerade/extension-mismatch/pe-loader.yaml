defaults:
  platforms: [windows]
  for: [pe, dll]
  attack: T1036.007,T1027
composite_rules:
  - id: packed-random-export-dll-disguised-as-data
    desc: Packed randomized-export DLL uses data extension
    crit: hostile
    conf: 0.98
    all:
      - id: metadata/file/extension/identity::pe-content-extension-mismatch
      - id: metadata/binary/provenance/version-info::pe-non-architecture-filename-mismatch
      - id: objectives/anti-static/obfuscation/name-mangling/export-name::opaque-alpha-export-cluster
      - id: metadata/binary/symbols/count::pe-sparse-import-table
      - id: metadata/binary/layout/entropy::very-high-overall-entropy-75
      - id: metadata/signed/trust-level::unsigned-missing-signature-record
