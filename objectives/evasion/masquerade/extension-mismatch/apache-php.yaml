# Handler directives are portable across Apache installations and installers.
defaults:
  for: [text, scripts, source]
  platforms: [unix, windows]
  conf: 0.98
  attack: T1036.008
traits:
  - id: apache-package-php-handler
    desc: Apache maps package suffix to PHP
    crit: suspicious
    if:
      type: text
      regex: '(?i)Add(Handler|Type)\s+application/x-httpd-php\s+\.(deb|sig|rpm)\b'
composite_rules:
  - id: header-webshell-package-handler
    desc: Header webshell with disguised PHP handler
    crit: hostile
    for: [php]
    all:
      - id: apache-package-php-handler
      - id: objectives/command-and-control/backdoor/webshell/request/command::php-encoded-header-command-webshell
