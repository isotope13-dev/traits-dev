defaults:
  platforms: [windows, unix]
  for: [php]
  attack: T1036.008
composite_rules:
  - id: gif-prefixed-php-as-image
    desc: GIF-prefixed PHP under an image extension
    crit: suspicious
    conf: 0.95
    all:
      - id: micro-behaviors/data/embedded/payload/image::gif-header-in-script
      - id: metadata/file/extension/mismatch::script-content-as-image-extension
    unless:
      - id: metadata/path::test-directory-component
