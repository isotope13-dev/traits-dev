defaults:
  platforms: [windows, unix]
  for: [php]
  attack: T1036.008
composite_rules:
  - id: gif-prefixed-image-named-php
    desc: PHP under an image extension starts with GIF magic
    crit: suspicious
    conf: 0.95
    all:
      - id: micro-behaviors/data/embedded/payload/image::gif-header-in-script
      - id: metadata/file/extension/mismatch::script-content-as-image-extension
    unless:
      - id: "metadata/file/naming::test-directory-component"
