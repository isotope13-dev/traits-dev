defaults:
  platforms: [windows]
  for: [python]

traits:
  - id: python-randomized-dll-extension
    desc: DLL filename receives a random extension
    crit: suspicious
    conf: 0.96
    attack: T1036.008
    # Bind the DLL suffix test to splitext's source name, and the random
    # extension assignment to the rebuilt filename. No chosen filenames.
    if:
      type: tree-sitter
      language: python
      query: |
        ((if_statement condition: [
          (call function: (attribute object: (identifier) @source
            attribute: (identifier) @endswith)
            arguments: (argument_list (string) @suffix))
          (boolean_operator right: (call function: (attribute
            object: (call function: (attribute object: (identifier) @source
              attribute: (identifier) @lower))
            attribute: (identifier) @endswith)
            arguments: (argument_list (string) @suffix)))]
          consequence: (block
            (expression_statement (assignment left: (identifier) @extension
              right: (binary_operator left: (string) @dot
                right: (call function: (attribute attribute: (identifier) @join)
                  arguments: (argument_list (call function: (attribute
                    object: (identifier) @random attribute: (identifier) @choices)))))))
            (expression_statement (assignment right: (binary_operator
              left: (subscript value: (call function: (attribute
                object: (attribute object: (identifier) @os
                  attribute: (identifier) @path)
                attribute: (identifier) @splitext)
                arguments: (argument_list (identifier) @original))
                subscript: (integer) @zero)
              right: (identifier) @used_extension)))))
          (#eq? @endswith "endswith")
          (#match? @suffix "^['\"]\\.dll['\"]$")
          (#match? @dot "^['\"]\\.['\"]$")
          (#eq? @join "join")
          (#eq? @random "random")
          (#eq? @choices "choices")
          (#eq? @os "os")
          (#eq? @path "path")
          (#eq? @splitext "splitext")
          (#eq? @zero "0")
          (#eq? @source @original)
          (#eq? @extension @used_extension))
