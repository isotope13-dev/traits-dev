# A PHP archive saved under an image name is the upload half of phar
# deserialization: the image name gets the file past an upload filter, and the
# application is later made to open phar://uploads/<name>.jpg. Unlike an
# ordinary archive renamed to an image, a phar is still loaded by PHP under
# any name -- the extension is chosen only to be accepted.
#
# The content leg is the parsed phar; the extension leg is filefacts'
# content/extension transition, so a phar named .phar never matches.
defaults:
  platforms: [windows, unix]
  for: [phar]
  attack: T1036.008,T1190

composite_rules:
  - id: phar-disguised-as-image-extension
    desc: PHP archive disguised as an image
    crit: suspicious
    conf: 0.95
    all:
      - id: metadata/file/archive::phar-archive
      - id: objectives/evasion/masquerade/extension-mismatch::archive-content-as-image-extension
