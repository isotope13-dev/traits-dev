defaults:
  for: [text]
  platforms: [windows, linux, macos]
composite_rules:
  - id: xdcc-dll-suffixed-state-files
    desc: XDCC data filenames masquerade as DLLs
    crit: suspicious
    conf: 0.95
    all:
      - id: micro-behaviors/data/config/schema::xdcc-pack-list-file
      - id: micro-behaviors/data/config/schema::xdcc-pack-slot-limit
      - id: micro-behaviors/data/config/schema::irc-state-files-dll-suffix
