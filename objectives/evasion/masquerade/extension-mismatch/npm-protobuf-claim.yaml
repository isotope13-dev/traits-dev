# An obfuscated script is exposed under a protobuf media-type claim.
# The package need not execute the returned asset; concealment is suspicious,
# but this evidence does not establish a supply-chain execution payload.
defaults:
  platforms: [unix, windows]
  for: [npm, package.json, javascript, typescript, text]
  attack: T1195.002,T1036.008

composite_rules:
  - id: npm-obfuscated-script-protobuf-media-claim
    desc: npm claims protobuf for obfuscated script
    crit: suspicious
    conf: 0.97
    scope: archive
    all:
      - id: metadata/package/files/included::npm-publish-root-manifest
      - id: objectives/evasion/masquerade/extension-mismatch::obfuscated-script-named-as-pbf
      - id: metadata/package/files/asset::protobuf-media-type-claim
