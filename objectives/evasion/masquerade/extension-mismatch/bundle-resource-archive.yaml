# A macOS app-bundle resource that is really an encrypted archive of
# executables.
#
# `Contents/Resources/*.nib` is an interface file; every sibling in a normal
# build parses as a plist or a compiled nib. OSX/Proton shipped its whole
# second bundle -- a Mach-O, a LaunchAgent plist, an encrypted string blob --
# as a 1.5MB password-protected ZIP named `HBPlayerHUDMainController.nib`, so
# a reviewer scanning the app saw one oversized interface file and no payload.
#
# The rule keys on the mismatch, not on the name: a resource extension whose
# bytes are an archive, with entries the archive itself will not let a scanner
# read, and executables inside. A variant that hides in `.icns`, `.strings` or
# an asset catalog trips the same three legs.
defaults:
  platforms: [macos]
  for: [zip, tar, dmg, pkg]
  attack: T1036.008,T1027
  mbc: F0004

traits:
  - id: ui-resource-extension-basename
    desc: Filename uses a UI-resource extension
    crit: component
    conf: 0.95
    if:
      type: value
      path: file.basename
      regex: '(?i)\.(nib|icns|strings|storyboardc|car|tiff|rtfd)$'

composite_rules:
  - id: bundle-resource-is-encrypted-executable-archive
    desc: App resource hides an encrypted executable archive
    crit: hostile
    conf: 0.96
    all:
      - id: ui-resource-extension-basename
      - id: metadata/file/metrics::archive-contains-executable-member
      - id: micro-behaviors/data/archive/member::archive-encrypted-member
      - id: metadata/package/files/archive-member::macos-app-bundle-member
