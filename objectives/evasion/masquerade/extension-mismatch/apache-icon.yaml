# Icon URLs diverted to signature files conceal the resource type from clients.
defaults:
  for: [text, scripts, source]
  platforms: [unix, windows]
  conf: 0.98
  attack: T1036.008
traits:
  - id: apache-icon-signature-alias
    desc: Apache aliases icon URLs to signature files
    crit: suspicious
    if:
      type: text
      regex: '(?im)^[ \t]*AliasMatch\s+[^\r\n]{1,160}\.ico[^\r\n]{1,160}\$[0-9]+\.sig\b'
