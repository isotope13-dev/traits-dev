# Source files are text. Large unrecognized binary blobs under source
# extensions are a content/extension conflict, even without executable magic.
# Regression fixtures can deliberately contain malformed source, hence the
# suspicious level and the explicit test-directory exclusion.
defaults:
  platforms: [windows, linux, macos]
  for: [data]

composite_rules:
  - id: source-extension-near-random-opaque-data
    desc: Source suffix on near-random binary data
    crit: suspicious
    conf: 0.94
    size_min: 65536
    all:
      - id: metadata/file/extension/identity::source-code-text-extension-name
      - id: metadata/file/entropy::data-file-near-maximum-entropy
    unless:
      - id: metadata/file/naming::test-directory-component
