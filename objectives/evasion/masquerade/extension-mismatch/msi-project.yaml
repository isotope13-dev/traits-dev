defaults:
  platforms: [windows]
  for: [msi]
composite_rules:
  - id: msi-data-suffix-build-project
    desc: MSI treats a staged dat file as an MSBuild project
    crit: suspicious
    conf: 0.97
    attack: T1036.008
    all:
      - id: well-known/tool/development/build/msbuild::msi-localappdata-data-project
      - id: metadata/package/files/msi/strings::numbered-dat-file-identifiers
