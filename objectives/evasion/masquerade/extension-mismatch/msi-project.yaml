defaults:
  platforms: [windows]
  for: [msi]
composite_rules:
  - id: msi-data-suffix-build-project
    desc: MSI treats a staged dat file as an MSBuild project
    crit: suspicious
    conf: 0.97
    attack: T1036.008
    all:
      - id: micro-behaviors/process/create/compile::msi-localappdata-data-project
      - id: metadata/binary/installer/database::numbered-dat-file-identifiers
