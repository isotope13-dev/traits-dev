defaults:
  for: [text, scripts, source]
  platforms: [unix, windows]
  conf: 0.98
  attack: T1036.008
traits:
  - id: apache-css-location-php-handler
    desc: Apache CSS URL location enables PHP execution
    crit: suspicious
    if:
      type: text
      regex: '(?i)<Location\s+[^>\r\n]{1,100}\.css>\s*SetHandler\s+application/x-httpd-php'
