# A JAR that stores class bytecode under data filenames. Nothing on the
# classpath references those entries by their real type, so the code inside is
# invisible to tools that enumerate `*.class` and runs only when a custom
# ClassLoader reads the "resource" and defines it -- which the same archive
# does. 2026-09 JNA HVNC jar kept 131 classes as `assets/p_*.db` beside 200
# random `f_*.db` filler blobs.
defaults:
  platforms: [windows, unix]
  attack: T1036.008,T1027
composite_rules:
  - id: jar-class-bytecode-under-data-name
    desc: JAR hides class bytecode under data filenames
    crit: suspicious
    conf: 0.9
    for: [jar, zip, class, java_class]
    scope: archive
    all:
      - id: metadata/file/extension/mismatch::class-content-extension-mismatch
    any:
      - id: micro-behaviors/data/source/dynamic/reflect::java-defineclass
      - id: micro-behaviors/data/source/dynamic/reflect::jvm-classloader-class-ref
      - id: micro-behaviors/data/source/dynamic/reflect::java-loadclass
      # The loader's own names are often hidden too: in the HVNC jar every
      # string, ClassLoader names included, resolved through a custom
      # string-argument invokedynamic bootstrap, so no loader reference was
      # visible at all.
      - id: micro-behaviors/data/source/dynamic/reflect::jvm-custom-string-indy-bootstrap
