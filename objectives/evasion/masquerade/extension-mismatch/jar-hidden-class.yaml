# A JAR with class bytecode named as passive data and class-loader references
# in the same archive. Correlation does not prove which resource is loaded.
# Require a data suffix, not just an unregistered bytecode suffix: Lombok's
# documented `.SCL.lombok` format isolates compiler implementation classes
# from IDE completion and is not a database/text disguise. Keep the generic
# extension-mismatch observation notable. 2026-09 JNA HVNC jar kept 131
# classes as `assets/p_*.db` beside 200 random `f_*.db` filler blobs.
defaults:
  platforms: [windows, unix]
  attack: T1036.008,T1027
composite_rules:
  - id: jar-class-bytecode-under-data-name
    desc: Data-named bytecode with class-loader references
    crit: suspicious
    conf: 0.9
    for: [jar, zip, class, java_class]
    scope: archive
    all:
      - id: metadata/file/extension/mismatch::class-content-data-extension-mismatch
    any:
      - id: micro-behaviors/process/interpreter/runtime/jvm::java-defineclass-name-constant
      - id: metadata/import/jvm::jvm-classloader-class-reference
      - id: micro-behaviors/process/interpreter/runtime/jvm::java-loadclass
      # The loader's own names are often hidden too: in the HVNC jar every
      # string, ClassLoader names included, resolved through a custom
      # string-argument invokedynamic bootstrap, so no loader reference was
      # visible at all.
      - id: metadata/binary/symbols/descriptor::jvm-custom-string-indy-bootstrap
