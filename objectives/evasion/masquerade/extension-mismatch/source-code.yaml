# A native executable published under a source-code extension.
#
# The sibling rule in image.yaml already states the observation -- a PE, ELF
# or Mach-O whose filename ends in `.py`, `.js`, `.rb` and so on -- and keeps
# it `suspicious`, which is right on its own: a build tree can end up with a
# confusingly named artifact, and the extension alone proves only sloppiness.
#
# What settles it is what the binary turns out to contain. num2words 0.5.15
# and 0.5.16 shipped `num2words/_build.py`, a 1.2 MB Windows PE that probes
# the PEB debugger byte and walks the certificate store. A misnamed build
# artifact does not check whether it is being debugged.
#
# The pairing is deliberately generic: the disguise plus any behaviour a
# reviewer would not accept in a file they were told was source. Each half is
# explainable; together they are a payload that was named to be scrolled past.
# This is the artifact's own story, and stays separate from the package wiring
# that loads it, which the supply-chain rule describes from the other side.
defaults:
  platforms: [windows, unix, macos]
  for: [elf, macho, pe]
  attack: T1036.008
  mbc: F0001

composite_rules:
  - id: source-named-binary-with-evasive-behaviour
    desc: Source-named binary evades analysis
    crit: hostile
    conf: 0.95
    scope: leaf
    all:
      - id: objectives/evasion/masquerade/extension-mismatch::binary-masquerades-as-source-extension
    any:
      # Anti-analysis of any kind: a mislabelled build artifact has no reason
      # to care whether a debugger is attached.
      - id: micro-behaviors/os/api-resolution/hash-based::peb-being-debugged-byte
      - id: objectives/anti-analysis/debugger-detect/
      - id: objectives/anti-analysis/sandbox-detect/
      # Or reaching for secrets, which a build helper equally has no reason to
      # do.
      - id: objectives/credential-access/credential-manager/store-api::cert-store-full-enumeration-chain
    unless:
      - id: metadata/package/testing/
