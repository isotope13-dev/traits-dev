# An archive (zip/tar/etc.) saved under a compiled-library or executable
# extension (.so/.dll/.dylib/.exe). Unlike .jar/.whl/.apk, which are
# zip-format archives with their own first-class file type and legitimate
# reason to exist, nothing legitimately ships a raw zip renamed to a native
# library extension — loaders reject it outright, so the only reason to do
# this is to slip a payload past reviewers or tooling that skims by
# extension. Seen in gocommunity.io/orderedbtree@v1.3.0 (Aikido-flagged):
# orderedbtree.so is actually a zip archive later unpacked, decrypted, and
# executed by code elsewhere in the package.
#
# The extension is confirmed by name rather than left to the engine's
# archive/binary mismatch metric alone: that metric also counts container
# extensions no loader would accept, notably macOS `.bundle`, which apps
# legitimately ship as a plain zip of resources.
defaults:
  platforms: [linux, macos, windows]
  for: [zip, tar]
  attack: T1036.008

composite_rules:
  - id: archive-disguised-as-native-library
    platforms: [linux, macos, windows, android]
    for: [zip, tar, android_apk]
    desc: Archive disguised as a compiled native library
    crit: suspicious
    conf: 0.93
    unless:
      - id: well-known/app/media/simpmusic::simpmusic-apk
    all:
      - id: metadata/file/extension/mismatch::archive-content-binary-extension-mismatch
      - id: metadata/file/extension/mismatch::native-library-extension-name

  # The data-file variant of the same disguise: a zip named as a SQL dump or
  # SQLite database, which reviewers skim past as a fixture and which ignore
  # files routinely exclude. Seen as btreex.sql in gogets.dev/btreex and as
  # examples/.../import-resource.sqlite3 in the gocommunity-io dockerd
  # Terraform provider; both hold AES-GCM-encrypted `.tmp` source members
  # that a loader elsewhere in the package decrypts and `go run`s.
  - id: archive-disguised-as-database-file
    desc: Archive disguised as a database or SQL dump
    crit: suspicious
    conf: 0.92
    all:
      - id: metadata/file/extension/mismatch::database-file-extension-name
    any:
      - id: metadata/file/extension/mismatch::archive-content-text-extension-mismatch
      - id: metadata/file/extension/identity::archive-content-extension-mismatch

