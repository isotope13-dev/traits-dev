# Interpreter handed a file whose suffix it does not read as source.
# Extension-agnostic siblings of the font rules in this directory, which keep
# the font suffixes: these rules exclude them so one file is reported once.
# The suffix must start with a letter and end the token, so version strings
# (`node 18.17`), `.bin/` directories and `*.test.mjs` globs are not
# suffixes. Compound names Node resolves to a script (`retry.integ.spec` ->
# `.spec.js`) are excluded by trailing-word `not:` lists on each rule.
#
# Each interpreter invocation is matched on its own, at command position
# (start of a JSON string or after a shell operator), so `node x.llf && node
# lint.js` cannot hide the payload behind a benign call in either order.
# Text `not:` filters that one invocation's span, which ends at the suffix.
# A value matcher cannot do this: its `not:` is judged against the whole
# script string, so any benign `.js` call anywhere would excuse the payload.
defaults:
  platforms: [windows, linux, macos]
  attack: T1036.008

traits:
  # Any JSON command string: VS Code tasks, per-OS command blocks, and the
  # tasks block some campaigns embed in workspace settings.
  - id: node-task-executes-non-script-suffix
    desc: Node command runs a non-script-suffix file
    crit: suspicious
    conf: 0.93
    for: [json]
    if:
      type: text
      regex: '[";&|(]\s*node(\.exe)?(\s+-\S{0,40}){0,3}\s+[^"\s-][^"\s]{0,99}\.[a-z]\w{0,4}[^\w./]'
    not:
      - regex: '(?i)\.(m?js|cjs|[mc]?ts|[jt]sx|json|node)\W?$'
      - regex: '(?i)\.(woff2?|[ot]tf|eot)\W?$'
      # `-e/--eval/-p` run the next argument as code, not as a file path.
      - regex: '\s(-e|--eval|-p|--print)(\s|=)'
      # Node resolves an extensionless compound name (`retry.integ.spec`) to
      # `.spec.js`; these trailing words are conventions, not real suffixes.
      - regex: '(?i)\.(spec|test|e2e|bench|cy|min|dev|prod)\W?$'
      - regex: '(?i)\.(conf|config|setup|mock|fixtures?|stories|story|worker)\W?$'
      # Prose cites source files after `node` ("(node route_registry.rs)");
      # node cannot execute another language's source, so a source suffix
      # here is a documentation reference, not a masqueraded payload.
      # Unanchored like the matcher itself: citations sit mid-sentence.
      - regex: '(?i)\.(rs|go|py|rb|java|c|cpp|h|hpp|cs|php|swift|kt|scala|lua)[^\w./]'

  # Bun and Deno run the same payloads Node does; `deno run` takes the
  # subcommand before its flags.
  - id: bun-deno-task-executes-non-script-suffix
    desc: Bun or Deno runs a non-script file
    crit: suspicious
    conf: 0.92
    for: [json]
    if:
      type: text
      regex: '[";&|( ](bun|deno)(\s+run)?(\s+-\S{0,40}){0,3}\s+[^"\s-][^"\s]{0,99}\.[a-z]\w{0,4}[^\w./]'
    not:
      - regex: '(?i)\.(m?js|cjs|[mc]?ts|[jt]sx|json)\W?$'
      - regex: '(?i)\.(woff2?|[ot]tf|eot)\W?$'
      - regex: '\s(-e|--eval|-p|--print)(\s|=)'
      - regex: '(?i)\.(spec|test|e2e|bench|cy|min|dev|prod)\W?$'
      - regex: '(?i)\.(conf|config|setup|mock|fixtures?|stories|story|worker)\W?$'

  # Process-style task: `"command": "node"` with the file as the first
  # non-flag element of `args`. The command-string rules above never see
  # the file name here, so this shape needs its own adjacency matcher.
  - id: node-task-args-non-script-suffix
    desc: Node task args name a non-script file
    crit: suspicious
    conf: 0.92
    for: [json]
    if:
      type: text
      regex: '"node"\s*,\s*"args"\s*:\s*\[("-[^"]{0,40}",\s*){0,3}"[^"\s-][^"]{0,99}\.[a-z]\w{0,4}"'
      case_insensitive: true
    not:
      - regex: '(?i)\.(m?js|cjs|[mc]?ts|[jt]sx|json|node)"$'
      - regex: '(?i)\.(woff2?|[ot]tf|eot)"$'

  # The same match over package.json text, where scripts are the only
  # strings that open with a command. Kept as text, not a `scripts.*` value
  # path: see the header.
  - id: npm-script-node-non-script-suffix
    desc: npm script runs Node on non-script file
    crit: suspicious
    conf: 0.92
    for: [package.json]
    if:
      type: text
      regex: '[";&|(]\s*node(\.exe)?(\s+-\S{0,40}){0,3}\s+[^"\s-][^"\s]{0,99}\.[a-z]\w{0,4}[^\w./]'
    not:
      - regex: '(?i)\.(m?js|cjs|[mc]?ts|[jt]sx|json|node)\W?$'
      - regex: '(?i)\.(woff2?|[ot]tf|eot)\W?$'
      - regex: '\s(-e|--eval|-p|--print)(\s|=)'
      - regex: '(?i)\.(spec|test|e2e|bench|cy|min|dev|prod)\W?$'
      - regex: '(?i)\.(conf|config|setup|mock|fixtures?|stories|story|worker)\W?$'

  # Short content atoms keep matching precise while staying under the regex
  # limit. Composites below require the loader, directory and suffix to be
  # close together; ordinary image and font suffixes cannot satisfy them.
  - id: module-loader-call
    desc: Require or import call
    crit: component
    conf: 0.9
    for: [javascript, typescript]
    if:
      type: text
      regex: '\b(require|import)\s*\(\s*[''"`]'

  - id: create-require-call
    desc: createRequire path call
    crit: component
    conf: 0.9
    for: [javascript, typescript]
    if:
      type: text
      regex: 'createRequire\s*\([^\n)]{0,40}\)\s*\(\s*[''"`]'

  - id: asset-directory-path-segment
    desc: Asset directory path
    crit: component
    conf: 0.9
    for: [javascript, typescript]
    if:
      type: text
      regex: '[/\\](fonts?|im(g|ages?)|icons?)[/\\]'
      case_insensitive: true

  - id: disguised-module-script-suffix
    desc: Module path has code or executable suffix
    crit: component
    conf: 0.9
    for: [javascript, typescript]
    if:
      type: text
      regex: '\.(m?js|cjs|[mc]?ts|[jt]sx|wasm|node|dat|bin|llf|dll|exe|so|dylib|pem|key|der)[''"`]'
      case_insensitive: true

  - id: disguised-module-data-suffix
    desc: Data or binary module suffix
    crit: component
    conf: 0.9
    for: [javascript, typescript]
    if:
      type: text
      regex: '\.(dat|bin|llf|dll|exe|so|dylib|pdf|zip|tar|gz|7z|pem|key|der)[''"`]'
      case_insensitive: true

  - id: module-load-of-non-script-suffix
    desc: Explicit non-script module argument
    crit: notable
    conf: 0.94
    for: [javascript, typescript]
    if:
      type: tree-sitter
      language: javascript
      # Bind the loader and suspicious suffix to this same argument.
      query: |
        (call_expression
          function: (identifier) @loader
          arguments: (arguments (string) @target)
          (#match? @loader "^(require|import)$")
          (#match? @target "^['\"](\\.{1,2}[/\\\\]|[/\\\\]|[a-zA-Z]:[/\\\\])[^'\"]{0,120}\\.(dat|bin|llf|dll|exe|so|dylib|pdf|zip|tar|gz|7z|pem|key|der)['\"]$"))

  - id: createrequire-of-non-script-suffix
    desc: createRequire non-script argument
    crit: notable
    conf: 0.94
    for: [javascript, typescript]
    if:
      type: tree-sitter
      language: javascript
      query: |
        (call_expression
          function: (call_expression
            function: (identifier) @loader
            arguments: (arguments (_)))
          arguments: (arguments (string) @target)
          (#eq? @loader "createRequire")
          (#match? @target "^['\"](\\.{1,2}[/\\\\]|[/\\\\]|[a-zA-Z]:[/\\\\])[^'\"]{0,120}\\.(dat|bin|llf|dll|exe|so|dylib|pdf|zip|tar|gz|7z|pem|key|der)['\"]$"))

  - id: module-load-of-asset-directory-path
    desc: Executable in asset directory loaded as module
    crit: notable
    conf: 0.94
    for: [javascript, typescript]
    if:
      type: tree-sitter
      language: javascript
      query: |
        (call_expression
          function: (identifier) @loader
          arguments: (arguments (string) @target)
          (#match? @loader "^(require|import)$")
          (#match? @target "(?i)^['\"](?:\\.{1,2}[/\\\\])?(?:assets?|public|static|resources?)[/\\\\][^'\"]*(fonts?|images?|img|icons?)[/\\\\][^'\"]*\\.(m?js|cjs|[mc]?ts|[jt]sx|wasm|node|dat|bin|llf|dll|exe|so|dylib|pem|key|der)['\"]$"))
    unless:
      - type: path
        regex: '(?i)\.md$'

  - id: node-command-substitution-argument
    desc: Node argument built by command substitution
    crit: notable
    conf: 0.9
    for: [json]
    if:
      type: text
      regex: '[";&|( ]node(\.exe)?(\s+-\S{0,40}){0,3}\s+["'']?(\$\(|`)'

composite_rules:
  # One id for a module loader call paired closely with a data/binary suffix,
  # whichever loader form. The loader-form legs each bind the loader to the
  # same argument and stay notable; this roll-up carries the suspicious
  # verdict (a single-`any:` roll-up at its legs' own level would be dropped
  # from output as a low-value restatement).
  - id: config-module-loads-disguised-path
    desc: Module loader targets a data or binary-looking suffix
    crit: suspicious
    conf: 0.95
    any:
      - id: module-load-of-asset-directory-path
      - id: module-load-of-non-script-suffix
      - id: createrequire-of-non-script-suffix

  # Indirect paths alone are ordinary task configuration. Require separate
  # concealment evidence before inferring deceptive folder-open execution.
  - id: vscode-folder-open-runs-indirect-payload
    desc: Folder-open task runs an indirect payload
    crit: hostile
    conf: 0.96
    attack: "T1204.002,T1059"
    for: [json]
    all:
      - id: metadata/permission/activation::vscode-task-folder-open-activation
      - id: objectives/execution/trigger/ide::vscode-task-concealment
    any:
      - id: node-command-substitution-argument
      - id: metadata/package/config::node-env-variable-script-target
      - id: objectives/evasion/masquerade/path::node-runs-asset-directory-as-module
