defaults:
  platforms: [windows, linux, macos]
  crit: suspicious
  conf: 0.9
  attack: T1036.008
# Executable content wearing a benign *document/image/text* extension
# (PE-named-.png, ELF-named-.pdf, shell-named-.jpg, …) is the masquerade
# (T1036.008). filefacts reports the content→extension group transition via
# `consistency.extension_content_mismatch.<content>_as_<ext>`. We gate on the
# specific dangerous transitions only — image / document / text — and NOT on the
# benign-but-mismatched cases (a Mach-O named `ls.macOS` is `binary_as_unknown`;
# a versioned `.so.1.2` is `binary_as_data`; a `.zip`/`.json` container is
# `binary_as_archive`/`binary_as_config`). A real executable named as an *image*
# is the most egregious transition (hostile composite); document/text disguises
# are suspicious.
traits:
  - id: script-content-as-audio-extension
    desc: Script content under an audio extension
    crit: notable
    conf: 0.96
    for: [scripts]
    if:
      type: metrics
      field: consistency.extension_content_mismatch.script_as_audio
      min: 1
  - id: script-content-as-video-extension
    desc: Script content under a video extension
    crit: notable
    conf: 0.96
    for: [scripts]
    if:
      type: metrics
      field: consistency.extension_content_mismatch.script_as_video
      min: 1
  - id: script-content-as-document-extension
    desc: Script content under document extension
    crit: notable
    conf: 0.9
    for: [scripts]
    if:
      type: metrics
      field: consistency.extension_content_mismatch.script_as_document
      min: 1
composite_rules:
  - id: script-masquerades-as-media-extension
    desc: Script disguised as an image, audio or document
    crit: notable
    conf: 0.9
    any:
      - id: metadata/file/extension/mismatch::script-content-as-image-extension
      - id: script-content-as-document-extension
      - id: script-content-as-audio-extension
      - id: script-content-as-video-extension
  # An executable wearing an audio or video name. Held to the same standard as
  # the image case above: the bytes are a real PE/ELF/Mach-O and the name says
  # media. No toolchain emits one, and whatever drops it can run it directly.
  # One id for "an executable is wearing a playable-media name", same tier as
  # its legs, so the rule below has a single leg to require.
  - id: media-named-scriptlet-shell
    desc: Media name hides a COM scriptlet shell
    crit: hostile
    conf: 0.98
    attack: "T1036.008,T1218.010,T1059.007"
    for: [media]
    all:
      - id: metadata/file/extension/mismatch::media-filename-encoded-text-classification
      - id: micro-behaviors/os/com/automation::windows-com-scriptlet-element
      - id: micro-behaviors/os/com/instantiation::wscript-shell-activex-constructor

  - id: media-named-file-is-opaque-blob
    desc: Opaque blob under a media name
    crit: suspicious
    conf: 0.94
    attack: "T1036.008,T1027"
    for: [media]
    all:
      - id: metadata/file/format/media::media-content-is-opaque-blob
    unless:
      - id: metadata/file/format/media::media-container-recognized
      # Structured data the walker cannot containerize: a damaged PNG, MP3
      # bytes under a .wav name (sloppy asset management, players sniff the
      # content), or a FlatBuffers model under a .jpg name. Not an opaque
      # payload.
      - id: metadata/file/format/media::media-name-structured-content-recognized
      # Test suites deliberately ship malformed assets to exercise the
      # mismatch path: Django's tests/mail/attachments/file_txt.png is a text
      # file with a .png name (that IS the fixture), and Chocolatey's
      # chocolatey.tests.integration/context/ trees carry stub icons.
      - id: metadata/package/testing/presence/harness::media-asset-test-path
      - id: metadata/package/testing/presence/harness::perlmagick-test-image
      # Encryption interop vectors are ciphertext under the plaintext's
      # media name by design; the basename declares them.
      - id: metadata/package/testing/presence/harness::encrypted-test-vector-basename
      - id: well-known/app/media/photoprism/
      - id: well-known/app/media/plantuml::opaque-image-resource
    # A parser test corpus nests assets inside archives (a RAR fixture whose
    # audio member decodes to headerless PCM). The member's own path no longer
    # shows the test tree, but the containing archive does; step down rather
    # than suppress so the finding stays visible.
    downgrade:
      scope: archive
      any:
        - id: metadata/package/testing/presence/path::archive-test-directory-member-path
