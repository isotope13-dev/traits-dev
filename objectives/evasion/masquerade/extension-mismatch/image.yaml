defaults:
  platforms: [windows, linux, macos]
  crit: suspicious
  conf: 0.9
  attack: T1036.008
# Executable content wearing a benign *document/image/text* extension
# (PE-named-.png, ELF-named-.pdf, shell-named-.jpg, …) is the masquerade
# (T1036.008). filefacts reports the content→extension group transition via
# `consistency.extension_content_mismatch.<content>_as_<ext>`. We gate on the
# specific dangerous transitions only — image / document / text — and NOT on the
# benign-but-mismatched cases (a Mach-O named `ls.macOS` is `binary_as_unknown`;
# a versioned `.so.1.2` is `binary_as_data`; a `.zip`/`.json` container is
# `binary_as_archive`/`binary_as_config`). A real executable named as an *image*
# is the most egregious transition (hostile composite); document/text disguises
# are suspicious.
traits:
  - id: binary-content-as-image-extension
    desc: Binary content under image extension
    crit: notable
    conf: 0.97
    for: [elf, macho, pe]
    if:
      type: metrics
      field: consistency.extension_content_mismatch.binary_as_image
      min: 1
  - id: binary-content-as-document-extension
    desc: Binary content under document extension
    crit: component
    conf: 0.95
    for: [elf, macho, pe]
    if:
      type: metrics
      field: consistency.extension_content_mismatch.binary_as_document
      min: 1
  - id: binary-content-as-text-extension
    desc: Binary content under text extension
    crit: component
    conf: 0.9
    for: [elf, macho, pe]
    if:
      type: metrics
      field: consistency.extension_content_mismatch.binary_as_text
      min: 1
  - id: script-content-as-image-extension
    desc: Script content under image extension
    crit: component
    conf: 0.9
    for: [scripts]
    if:
      type: metrics
      field: consistency.extension_content_mismatch.script_as_image
      min: 1
  - id: binary-content-as-audio-extension
    desc: Executable content under an audio extension
    crit: notable
    conf: 0.98
    for: [elf, macho, pe]
    if:
      type: metrics
      field: consistency.extension_content_mismatch.binary_as_audio
      min: 1
  - id: binary-content-as-video-extension
    desc: Executable content under a video extension
    crit: notable
    conf: 0.98
    for: [elf, macho, pe]
    if:
      type: metrics
      field: consistency.extension_content_mismatch.binary_as_video
      min: 1
  - id: script-content-as-audio-extension
    desc: Script content under an audio extension
    crit: notable
    conf: 0.96
    for: [scripts]
    if:
      type: metrics
      field: consistency.extension_content_mismatch.script_as_audio
      min: 1
  - id: script-content-as-video-extension
    desc: Script content under a video extension
    crit: notable
    conf: 0.96
    for: [scripts]
    if:
      type: metrics
      field: consistency.extension_content_mismatch.script_as_video
      min: 1
  - id: archive-content-as-image-extension
    desc: Archive content under an image extension
    crit: notable
    conf: 0.95
    for: [zip, tar, gz, bz2, xz, zst, jar]
    if:
      type: metrics
      field: consistency.extension_content_mismatch.archive_as_image
      min: 1
  - id: archive-content-as-audio-extension
    desc: Archive content under an audio extension
    crit: notable
    conf: 0.95
    for: [zip, tar, gz, bz2, xz, zst, jar]
    if:
      type: metrics
      field: consistency.extension_content_mismatch.archive_as_audio
      min: 1
  - id: script-content-as-document-extension
    desc: Script content under document extension
    crit: component
    conf: 0.9
    for: [scripts]
    if:
      type: metrics
      field: consistency.extension_content_mismatch.script_as_document
      min: 1
  - id: binary-masquerades-as-source-extension
    desc: Executable disguised as source code
    crit: suspicious
    conf: 0.97
    for: [elf, macho, pe]
    if:
      type: path
      basename: true
      regex: '(?i)\.(c|cc|cpp|cs|go|java|js|jsx|kt|m|mm|py|rb|rs|ts|tsx)$'
    unless:
      # GNU Guile compiled objects conventionally use .go and an ELF-like
      # container whose VM instruction stream is stored in .rtl-text.
      - type: section
        exact: .rtl-text
      # Windows also uses .rs for Rating System resources. These are
      # resource-only PE containers, not executable Rust-source disguises.
      - id: metadata/binary/metrics/structural::pe-no-executable-sections
composite_rules:
  - id: binary-disguised-as-image-extension
    desc: Executable disguised as an image file
    crit: hostile
    conf: 0.97
    all:
      - id: binary-content-as-image-extension
    any:
      - id: metadata/file/magic/identity::elf-header
      - id: metadata/file/magic/identity::macho-32
      - id: metadata/file/magic/identity::macho-64
      - id: metadata/file/magic/identity::cafebabe-magic
      - id: metadata/file/magic/identity::pe-dos-stub
  - id: binary-masquerades-as-document-extension
    desc: Executable disguised as document or text
    crit: suspicious
    conf: 0.95
    any:
      - id: binary-content-as-document-extension
      - id: binary-content-as-text-extension
  # Renamed from `script-masquerades-as-document-extension`: it already
  # matched the image transition as well as the document one, so the id
  # claimed a narrower surface than the rule covered — and it now takes the
  # audio and video transitions too. A `.wav` or `.ico` holding a shell or
  # PowerShell payload is the same masquerade as a `.png` holding one.
  - id: script-masquerades-as-media-extension
    desc: Script disguised as an image, audio or document
    crit: suspicious
    conf: 0.9
    any:
      - id: script-content-as-image-extension
      - id: script-content-as-document-extension
      - id: script-content-as-audio-extension
      - id: script-content-as-video-extension
  # An executable wearing an audio or video name. Held to the same standard as
  # the image case above: the bytes are a real PE/ELF/Mach-O and the name says
  # media. No toolchain emits one, and whatever drops it can run it directly.
  # One id for "an executable is wearing a playable-media name", same tier as
  # its legs, so the rule below has a single leg to require.
  - id: binary-content-as-playable-extension
    desc: Executable content under playable extension
    crit: notable
    conf: 0.97
    any:
      - id: binary-content-as-audio-extension
      - id: binary-content-as-video-extension
  # Mirrors `binary-disguised-as-image-extension`: the group transition says
  # the extension lies, and the magic-identity leg confirms the bytes really
  # are an executable image rather than something the type guess got wrong.
  - id: binary-disguised-as-playable-extension
    desc: Executable disguised as audio or video
    crit: hostile
    conf: 0.97
    attack: "T1036.008,T1027"
    all:
      - id: binary-content-as-playable-extension
    any:
      - id: metadata/file/magic/identity::elf-header
      - id: metadata/file/magic/identity::macho-32
      - id: metadata/file/magic/identity::macho-64
      - id: metadata/file/magic/identity::cafebabe-magic
      - id: metadata/file/magic/identity::pe-dos-stub
    unless:
      # A carved child is named for its extraction coordinate, so the
      # "extension" is cleave's, not the author's.
      - id: metadata/binary/layout::embedded-pe-child
  # An archive wearing a media name: a second stage packed for delivery, past
  # any reviewer who sees an asset and any scanner that skips media.
  # Same tier as its legs: this exists to give one id to "an archive is
  # wearing a media name", not to escalate. The package-scope rules supply the
  # intent, as they do for the font case.
  - id: archive-disguised-as-media-extension
    desc: Archive disguised as a media asset
    crit: notable
    conf: 0.95
    any:
      - id: archive-content-as-image-extension
      - id: archive-content-as-audio-extension

  # The residue cases: content sniffing never identified the payload, so no
  # group transition was recorded and every rule above is blind. This happens
  # when the real magic is pushed out of reach — hundreds of leading spaces
  # ahead of a PE, or a base64 wrapper — leaving the extension to decide the
  # type. The container walker then finds no container signature and reports
  # what the bytes actually are in `media.content_kind`, which is the only
  # place this is visible.
  - id: media-named-file-is-executable
    desc: Padded executable under a media name
    crit: hostile
    conf: 0.97
    attack: "T1036.008,T1027,T1027.001"
    for: [media]
    all:
      - id: metadata/file/format/media::media-content-is-executable
    unless:
      - id: metadata/file/format/media::media-container-recognized

  - id: media-named-file-is-archive
    desc: Padded archive under a media name
    crit: suspicious
    conf: 0.95
    attack: "T1036.008,T1027,T1027.001"
    for: [media]
    all:
      - id: metadata/file/format/media::media-content-is-archive
    unless:
      - id: metadata/file/format/media::media-container-recognized

  # An asset whose bytes are text or an encoded blob. A `.ico`, `.wav` or
  # `.png` holding base64 is not a damaged asset — decoders reject it outright,
  # so it was never meant to be decoded, only fetched and decoded by something
  # else.
  - id: media-named-file-is-encoded-text
    desc: Encoded text under a media name
    crit: hostile
    conf: 0.96
    attack: "T1036.008,T1027"
    for: [media]
    all:
      - id: metadata/file/format/media::media-content-is-text
    unless:
      - id: metadata/file/format/media::media-container-recognized

  - id: media-named-file-is-opaque-blob
    desc: Opaque blob under a media name
    crit: suspicious
    conf: 0.94
    attack: "T1036.008,T1027"
    for: [media]
    all:
      - id: metadata/file/format/media::media-content-is-opaque-blob
    unless:
      - id: metadata/file/format/media::media-container-recognized
