# Obfuscated script wearing a font's name. Each half is suspicious alone:
# script content under a font suffix is a disguise, and string-array
# or permutation obfuscation conceals what the code does. Together they
# describe a payload built to survive both a reviewer who sees "a font" and
# one who opens it: no toolchain ships obfuscated source under an asset name.
# Covers the PolinRider fa-solid-900.woff2 build, whose custom shuffle cipher
# keeps every C2 string encoded, so no behavioral leg is visible statically.
defaults:
  platforms: [windows, linux, macos]
  attack: T1036.008,T1027

composite_rules:
  - id: obfuscated-script-named-as-font
    desc: Obfuscated script disguised as a font
    crit: hostile
    conf: 0.97
    for: [javascript, typescript]
    all:
      - id: script-named-as-font
    any:
      - id: objectives/anti-static/obfuscation/obfuscator/js-obfuscator::javascript-obfuscator-string-array-runtime
      - id: objectives/anti-static/obfuscation/obfuscator/js-obfuscator::global-punctuation-property
      - id: objectives/anti-static/obfuscation/eval/loader::char-permutation-reassembler
