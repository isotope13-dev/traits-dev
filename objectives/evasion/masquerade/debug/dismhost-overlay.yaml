defaults:
  for: [pe]
  platforms: [windows]

composite_rules:
- id: unsigned-dismhost-labeled-multi-pe-overlay
  desc: Unsigned DismHost-labeled executable with a multi-PE overlay
  crit: suspicious
  conf: 0.94
  attack: T1036
  all:
  - id: metadata/binary/debug::dismhost-pdb-reference
  - id: metadata/binary/provenance/source::launcher-cpp-source-name
  - id: metadata/binary/layout/embedded::repeated-standard-pe-images
  unless:
  - id: metadata/signed/platform/
  - id: metadata/binary/installer/family/
