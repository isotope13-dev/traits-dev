defaults:
  for: [pe, dll, c, cpp]
  platforms: [windows]
composite_rules:
- id: pdb-name-mismatch-rwx-thread-apis
  for:
  - pe
  desc: PDB name mismatch with RWX and remote-thread API clues
  crit: suspicious
  conf: 0.95
  all:
  - id: micro-behaviors/process/inject/runtime/call::rwx-remote-thread-api-set
  - id: metadata/binary/debug::pe-stem-differs-from-pdb-stem
  - id: metadata/file/text-distribution::repeated-consonant-vowel-token-binary
  any:
  - id: objectives/anti-analysis/debugger-detect/check::debugger-api
  - id: micro-behaviors/ui/window/probe::ansi-gui-probe
  - id: micro-behaviors/process/terminate/kill::terminate-process
  needs: 2
