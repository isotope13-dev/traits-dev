defaults:
  platforms: [windows]
  for: [text, batch, cmd]
  attack: T1036,T1204.002

composite_rules:
  - id: ftp-script-decoy-payload-launch
    desc: FTP local-command script opens a decoy while launching a rebuilt payload
    crit: hostile
    conf: 0.99
    all:
      - id: micro-behaviors/process/create/launch::ftp-script-starts-document
      - id: micro-behaviors/fs/file/copy::cmd-binary-file-concatenation
      - id: micro-behaviors/process/create/launch::ftp-script-starts-executable
