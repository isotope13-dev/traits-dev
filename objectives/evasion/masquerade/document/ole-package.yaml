defaults:
  platforms: [windows]
  for: [oledoc]
  attack: T1036.005,T1204.002
  conf: 0.98

traits:
  - id: ole-package-document-label
    desc: OLE Package has document display label
    crit: notable
    if:
      type: raw
      regex: '(?is)\x02\x00[^\x00]{1,64}\.(doc|pdf|txt|xls|rtf)\x00'

  - id: ole-package-executable-target-path
    desc: OLE Package has executable target path
    crit: suspicious
    if:
      type: raw
      # OLE Package strings are separated by several NUL-terminated fields:
      # the display label, icon path, and target executable path. Match across
      # those serialized fields while keeping the relationship bounded.
      regex: '(?is)\x02\x00[^\x00]{1,64}\x00[\s\S]{0,260}\.(exe|scr|bat|com|pif)\x00'

composite_rules:
  - id: ole-package-document-extension-masquerade
    desc: OLE Package masquerades executable as document
    crit: hostile
    all:
      - id: ole-package-document-label
      - id: ole-package-executable-target-path
      - id: micro-behaviors/ui/help::document-double-click-instruction
    near_bytes: 512
