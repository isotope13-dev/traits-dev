# Office document extension/CompObj mismatch — masquerade detection.
#
# Microsoft Office stores a CompObj stream (`\x01CompObj` per
# MS-OLEDS §2.3.6.1) declaring the document's true clipboard / app
# ProgID. cleave's office analyzer surfaces the parsed values on
# `ole.compobj.{user_type,clipboard_format,app_version}` in the
# kv tree.
#
# A `.doc` file whose CompObj `app_version` says `Excel.Sheet.8` is
# a known masquerade — used by CVE-2017-0199 droppers and
# misnamed-extension phishing payloads. The basename check pins
# the *claimed* format (extension); the kv query pins the *actual*
# format (CompObj). Mismatch ⇒ deliberate deception.
#
# We split into per-claim composites so the signal is directional
# (".doc claiming Excel" is different evidence from ".xls claiming
# Word"). A mismatched extension is a useful masquerade signal, but it
# is not by itself an attack: old document feeds and hand-renamed Office
# files contain this shape. Keep these at notable so analysts still see
# the mismatch; hostile document rules must add active-content or exploit
# evidence (for example, OLE HTML, external templates, or a dangerous
# embedded object).
defaults:
  for: [oledoc]
  platforms: [windows]
  conf: 0.95
  attack: T1036.005

composite_rules:
  # `.doc` file whose body says Excel — classic CVE-2017-0199 vector shape.
- id: doc-extension-excel-content
  desc: .doc file with Excel CompObj
  crit: notable
  conf: 0.97
  all:
  - id: metadata/document/office/container::basename-doc-extension
  - id: metadata/document/office/container::compobj-claims-excel

  # `.xls` file whose body says Word.
- id: xls-extension-word-content
  desc: .xls file with Word CompObj
  crit: notable
  conf: 0.97
  all:
  - id: metadata/document/office/container::basename-xls-extension
  - id: metadata/document/office/container::compobj-claims-word

  # `.ppt` file whose body says Word or Excel.
- id: ppt-extension-non-ppt-content
  desc: .ppt file with non-PowerPoint CompObj
  crit: notable
  conf: 0.96
  all:
  - id: metadata/document/office/container::basename-ppt-extension
  any:
  - id: metadata/document/office/container::compobj-claims-word
  - id: metadata/document/office/container::compobj-claims-excel
