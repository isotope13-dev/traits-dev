# Document icon/name evidence determines this home. The desktop delivery and
# decode/command clues do not alone bind all payload steps.
defaults:
  platforms: [linux]
  for: [desktop-entry]
  attack: T1036.008

composite_rules:
  - id: desktop-download-document-guise-profile
    desc: Desktop delivery with document-guise clues
    crit: suspicious
    conf: 0.95
    all:
      - id: objectives/command-and-control/dropper/delivery/desktop::desktop-entry-native-download-execute
    any:
      - id: objectives/evasion/masquerade/document::document-icon-shell-exec
      - id: objectives/evasion/masquerade/document::document-lure-dropper
  - id: desktop-decoded-document-guise-profile
    desc: Desktop decode and command text with document-guise clues
    crit: suspicious
    conf: 0.96
    all:
      - id: objectives/anti-static/obfuscation/eval/desktop::desktop-exec-base64-decode
      - id: objectives/anti-static/obfuscation/eval/desktop::desktop-exec-pipe-to-shell
      - id: micro-behaviors/communications/http/download/cli::desktop-wget-temp-output-command
      - id: micro-behaviors/process/create/launch::desktop-chmod-pipe-relative-launch-text
    any:
      - id: objectives/evasion/masquerade/document::document-icon-shell-exec
      - id: objectives/evasion/masquerade/document::document-lure-dropper
