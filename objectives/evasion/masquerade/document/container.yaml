# A file that carries an Office extension and is not an Office document.
#
# An OOXML package is a ZIP with a part-name map at `[Content_Types].xml` and
# relationships under `_rels/`. Strip those and what is left is a plain
# archive -- which is what several delivery chains send: one entry, stored
# rather than compressed, holding the document the reader will actually open.
# The extension gets it past a filter that reads extensions, and the mail
# client shows a Word icon.
#
# The test is not the absence of a single part but the absence of a parsed
# package: every real Office document yields a `kind`, and nothing else does.
defaults:
  platforms: [windows, unix]
  for: [ooxml]
  attack: T1036.008
  mbc: F0005

traits:
  - id: office-extension-without-package
    desc: Office extension holds no Office package
    crit: suspicious
    conf: 0.9
    if:
      # No `office.kind` means the container never parsed as OOXML at all --
      # either it is a plain archive wearing the extension, or the ZIP
      # structure is damaged in a way Word tolerates and readers do not.
      type: value
      path: office.kind
      exists: false
