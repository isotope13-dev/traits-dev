defaults:
  platforms:
  - windows
  - unix
  for:
  - ooxml
  attack: T1036.008
  mbc: F0005
  conf: 0.9
traits:
- id: ooxml-without-parsed-package
  desc: OOXML-typed file yields no Office package
  crit: component
  if:
    type: value
    path: office.kind
    exists: false
composite_rules:
- id: office-extension-without-package
  desc: Office extension holds no Office package
  crit: suspicious
  all:
  - id: ooxml-without-parsed-package
  - id: metadata/document/office/container::basename-ooxml-extension
  unless:
  - id: metadata/file/format/appx::windows-appx-archive-context
  - id: metadata/path::test-directory-component
  - id: metadata/document/office/markup::ooxml-parse-error
