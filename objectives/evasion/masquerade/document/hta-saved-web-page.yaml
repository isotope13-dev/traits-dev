# Lure built from a scraped live page: the attacker saves a real site's
# rendered HTML (its per-request CloudFront headers still inline), adds a
# remote script, and ships it as .hta so it opens in mshta with full trust
# while looking like the brand's page.
defaults:
  for: [html]
  platforms: [windows]
  attack: T1036,T1218.005

composite_rules:
  - id: hta-disguised-as-saved-web-page
    desc: HTA is a saved web page loading remote script
    crit: hostile
    conf: 0.93
    all:
      - id: metadata/file/extension/identity::hta-html-application-extension
      - id: metadata/document/html::embedded-cloudfront-viewer-headers
      - id: micro-behaviors/communications/http/client/resource::remote-script-element-source
