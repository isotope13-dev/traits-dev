# An ActiveX control whose `\objclass` is a bare word rather than the
# control's ProgID. Word always records the real ProgID; replacing it hides
# which control (and so which behaviour) the compound data instantiates from
# anyone reading the declaration, while the CLSID inside the storage still
# selects the control.
defaults:
  platforms: [windows]
  for: [rtf]
  attack: T1036,T1203

composite_rules:
  - id: rtf-activex-control-class-disguised
    desc: ActiveX control hides behind bare class name
    crit: hostile
    conf: 0.93
    all:
      - id: metadata/document/rtf/ole::activex-objocx-feature
      - id: metadata/document/rtf/ole::object-class-bare-lowercase-word
      - id: metadata/document/rtf/ole::compound-native-object
