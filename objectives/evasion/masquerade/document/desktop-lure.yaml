# Desktop Entry masquerade signals — file-manager presentation cues that a
# .desktop launcher uses to impersonate a benign document or media file.
defaults:
  platforms: [linux]
  for: [desktop-entry]
  attack: T1036

traits:
  - id: icon-pdf
    desc: Icon names a PDF document
    crit: notable
    conf: 0.85
    if:
      type: text
      regex: '(?m)^Icon=(application-pdf|gnome-mime-application-pdf)'

  - id: icon-office-doc
    desc: Icon names an office document
    crit: notable
    conf: 0.8
    if:
      type: value
      path: desktop_entry.icon
      regex: '^(x-office-|libreoffice-|openoffice-)'

  - id: icon-text-doc
    desc: Icon names a text document
    crit: notable
    conf: 0.7
    if:
      type: value
      path: desktop_entry.icon
      regex: '^(text-html|text-x-)'

  - id: icon-image-mime
    desc: Icon names an image mimetype
    crit: notable
    conf: 0.75
    if:
      type: value
      path: desktop_entry.icon
      regex: '^image-x-'

  - id: icon-audio-video-mime
    desc: Icon names audio or video
    crit: notable
    conf: 0.75
    if:
      type: value
      path: desktop_entry.icon
      regex: '^(audio-x-|video-x-)'

  - id: name-pdf-ext
    desc: Name embeds pdf extension
    crit: suspicious
    conf: 0.8
    if:
      type: text
      regex: '(?im)^Name=[^\r\n]{0,512}\.pdf(\b|_)'

  - id: name-doc-ext
    desc: Name embeds doc extension
    crit: suspicious
    conf: 0.8
    if:
      type: value
      path: desktop_entry.name
      regex: '(?i)\.(docx?|odt)(\b|_)'

  - id: name-xls-ext
    desc: Name embeds xls extension
    crit: suspicious
    conf: 0.8
    if:
      type: value
      path: desktop_entry.name
      regex: '(?i)\.xlsx?(\b|_)'

  - id: name-ppt-ext
    desc: Name embeds ppt extension
    crit: suspicious
    conf: 0.8
    if:
      type: value
      path: desktop_entry.name
      regex: '(?i)\.pptx?(\b|_)'

  - id: name-rtf-ext
    desc: Name embeds rtf extension
    crit: suspicious
    conf: 0.8
    if:
      type: value
      path: desktop_entry.name
      regex: '(?i)\.rtf(\b|_)'

  - id: name-archive-ext
    desc: Name embeds archive extension
    crit: suspicious
    conf: 0.8
    if:
      type: value
      path: desktop_entry.name
      regex: '(?i)\.(zip|rar|7z)(\b|_)'

  - id: name-image-ext
    desc: Name embeds image extension
    crit: suspicious
    conf: 0.75
    if:
      type: value
      path: desktop_entry.name
      regex: '(?i)\.(jpe?g|png|gif)(\b|_)'

  - id: name-media-ext
    desc: Name embeds audio or video
    crit: suspicious
    conf: 0.75
    if:
      type: value
      path: desktop_entry.name
      regex: '(?i)\.(mp[34]|avi|mov)(\b|_)'

composite_rules:
  - id: icon-document
    desc: Icon advertises a document
    crit: component
    conf: 0.85
    any:
      - id: icon-pdf
      - id: icon-office-doc
      - id: icon-text-doc

  - id: icon-media
    desc: Icon advertises media
    crit: component
    conf: 0.75
    any:
      - id: icon-image-mime
      - id: icon-audio-video-mime

  - id: name-document-lure
    desc: Name embeds document extension
    crit: suspicious
    conf: 0.8
    any:
      - id: name-pdf-ext
      - id: name-doc-ext
      - id: name-xls-ext
      - id: name-ppt-ext
      - id: name-rtf-ext
      - id: name-archive-ext
      - id: name-image-ext
      - id: name-media-ext

  - id: document-icon-shell-exec
    desc: Document icon covers shell Exec
    crit: suspicious
    conf: 0.9
    all:
      - id: icon-document
      - id: micro-behaviors/process/create/shell/command-mode::desktop-exec-shell-command-mode

  - id: media-icon-shell-exec
    desc: Media icon covers shell Exec
    crit: suspicious
    conf: 0.9
    all:
      - id: icon-media
      - id: micro-behaviors/process/create/shell/command-mode::desktop-exec-shell-command-mode

  - id: document-lure-dropper
    desc: Document-named entry runs a dropper
    crit: suspicious
    conf: 0.9
    all:
      - id: name-document-lure
      - id: objectives/command-and-control/dropper/delivery/desktop::desktop-entry-native-download-execute

  # Both halves of the disguise, plus the payload. The Name= claims a document
  # and the Icon= paints one, while Exec= hands the line to a shell -- so the
  # entry lies about what it is in the two places a file manager shows the user,
  # and the thing it actually does is the thing neither of them mentions.
  #
  # Either half alone stays suspicious: a launcher may legitimately carry a
  # document icon (a viewer), and a Name= ending in `.pdf` is careless rather
  # than damning. Together with a shell Exec= there is no remaining reading
  # where the user is being told what will run.
  - id: document-lure-icon-and-name
    desc: Document-masquerading entry runs a shell
    crit: hostile
    conf: 0.95
    attack: T1036.008,T1204.002
    all:
      - id: name-document-lure
      - id: document-icon-shell-exec

  - id: padded-document-lure-dropper
    desc: Comment-padded document lure downloads a payload
    crit: hostile
    conf: 0.95
    attack: T1027.001,T1036.008,T1105
    all:
      - id: objectives/evasion/anti-av/code-padding::megabyte-comment-fill
      - id: document-lure-dropper

  - id: padded-document-lure-shell
    desc: Comment-padded document lure runs a shell
    crit: hostile
    conf: 0.95
    attack: T1027.001,T1036.008,T1204.002
    all:
      - id: objectives/evasion/anti-av/code-padding::megabyte-comment-fill
      - id: document-icon-shell-exec
      - id: name-pdf-ext

