defaults:
  platforms: [windows, unix]
  for: [rtf]
  attack: T1036

composite_rules:
  - id: rtf-header-over-opaque-body
    desc: Bogus RTF header over a non-document body
    crit: suspicious
    conf: 0.95
    all:
      - id: objectives/anti-static/obfuscation/document/rtf::rtf-nonstandard-version
      - id: objectives/anti-static/obfuscation/document/rtf::rtf-has-no-document-structure

  - id: rtf-concealed-password-harvest
    desc: Fake RTF conceals a password-harvesting page
    crit: hostile
    conf: 0.99
    all:
      - id: rtf-header-over-opaque-body
      - id: objectives/credential-access/phishing/html-brand::microsoft-password-form-collector
