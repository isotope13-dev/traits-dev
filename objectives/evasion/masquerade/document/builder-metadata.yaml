# Document provenance fabricated by a builder rather than inherited from a
# person: an Author field carrying a generated token, with the last-modified
# account left at the build VM's default.
#
# The pair is the fingerprint. A generated-looking author alone could be an
# unusual handle; `Administrator` alone is unremarkable. Together they
# describe a file produced by a tool and never edited by anyone -- the
# opposite of what its metadata claims, which is the only reason document
# provenance is worth reading.
#
# Observed across an abuse.ch .xls wave: 37 of 40 samples carried a random
# Author, all but three with `Administrator` as the modifier.
defaults:
  platforms: [windows, unix]
  for: [oledoc, ooxml]
  attack: T1036
  mbc: F0008

traits:
  - id: randomly-named-worksheet
    desc: Worksheet name looks machine-generated
    for: [oledoc]
    crit: notable
    conf: 0.85
    if:
      # A sheet a person named says what it holds -- `Invoice`, `June rates`,
      # or the `Sheet1` Excel supplies. A builder emitting one workbook per
      # victim names it from its generator instead, which is also what keeps
      # sheet-name signatures from carrying between samples.
      type: value
      path: office.sheet_names[*]
      is: random_like

composite_rules:
  - id: generated-document-author-identity
    desc: Document author fabricated by a builder
    crit: suspicious
    conf: 0.9
    all:
      - id: metadata/document/office/properties::office-creator-generated
      - id: metadata/document/office/properties::office-modified-by-administrator

  # A workbook that runs on open, with its code sheet named from a generator.
  # Macro workbooks people maintain keep the sheet names they were written
  # with; a name with no word in it means this copy was built for one victim.
  - id: generated-sheet-auto-running-workbook
    for: [oledoc]
    desc: Auto-running workbook with a generated sheet
    crit: suspicious
    conf: 0.9
    attack: T1204.002
    all:
      - id: randomly-named-worksheet
      - id: micro-behaviors/process/create/macro/autoexec::raw-auto-open-entrypoint

  # A workbook that runs on open whose name table came out of a generator.
  # Deliberately says nothing about which interpreter the names point at: the
  # XLM wave that made this shape common is one delivery, and the same builder
  # pattern -- one file per victim, every internal name regenerated so no two
  # copies share a signature -- reads the same behind a VBA project or behind
  # whatever comes next. What is being claimed is that nobody wrote this file;
  # a tool emitted it, and it starts itself.
  - id: builder-named-auto-running-workbook
    for: [oledoc]
    desc: Auto-running workbook with a built name table
    crit: hostile
    conf: 0.95
    attack: T1204.002,T1027
    all:
      - id: objectives/execution/interpreter/document::workbook-auto-open-name
      - id: objectives/anti-static/obfuscation/document/renaming::large-defined-name-table
    # Either shape of generated name counts. One wave fills the table with
    # random letters, another with runs of NUL that no Name Manager will
    # display; both are a generator writing entries no person chose.
    needs: 1
    any:
      - id: objectives/anti-static/obfuscation/document/renaming::generated-defined-name
      - id: objectives/anti-static/obfuscation/document/renaming::unprintable-defined-name
