defaults:
  platforms: [windows]
  for: [all]
  attack: T1036.007,T1059.001,T1204.002

composite_rules:
  - id: iso-lnk-password-browser-lure
    desc: ISO LNK couples PowerShell with password lure
    crit: hostile
    conf: 0.99
    all:
      - id: metadata/file/format/structured::primary-volume-descriptor
      - id: metadata/file/format/iso::iso-lnk-powershell-launch
      - id: metadata/file/format/iso::iso-lnk-browser-decoy
      - id: metadata/file/format/iso::iso-password-disclosure-lure
