# A .NET assembly whose bulk is a high-entropy managed resource that it
# reads back as bitmap pixels and then runs by reflection (AppDomain, type
# and method invoke) keeps its payload inside an image. When the file also
# runs under a name its version resource does not claim, the lure name is
# hiding that loader.
defaults:
  platforms: [windows]
  for: [pe]
  attack: T1027.003,T1036.008,T1620
composite_rules:
  - id: dotnet-bitmap-pixel-loader-with-mismatched-names
    desc: .NET bitmap pixel loader under a mismatched name
    crit: hostile
    conf: 0.85
    all:
      - id: micro-behaviors/ui/graphics/image::dotnet-bitmap-resource-pixel-api-references
      - id: micro-behaviors/metaprogramming/reflection::appdomain-type-method-invoke-references
      - id: metadata/binary/resource/size::dotnet-large-high-entropy-managed-resource
      - id: metadata/binary/provenance/version-info::pe-non-architecture-filename-mismatch
    unless:
      - id: metadata/signed/platform/

  # The carrier variant: the resource bitmap's column-order RGB bytes already
  # contain a validated DOS+PE header, and the same assembly reads those
  # pixels back through the Bitmap API. The next stage is not downloaded or
  # appended - it is painted into the image.
  - id: dotnet-bitmap-column-pe-carrier
    desc: .NET assembly reads a PE painted into bitmap pixels
    crit: hostile
    conf: 0.97
    attack: T1027.003,T1027.009,T1620
    all:
      - id: micro-behaviors/data/embedded/payload/image::bmp-rgb-column-pe-header
      - id: micro-behaviors/data/embedded/payload/image::dotnet-resource-bitmap-pixel-readback
      - id: metadata/binary/framework::dotnet-assembly
    unless:
      - id: metadata/signed/platform/
