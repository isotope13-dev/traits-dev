defaults:
  crit: suspicious
  conf: 0.9
  platforms: [windows]
  for: [batch, vbs]
  attack: T1036.005

traits:
  - id: bank-swift-script-lure
    desc: Bank SWIFT script lure
    if:
      type: path
      basename: true
      regex: '(?i)\b(MT103|bankasi|ziraat|swift)\b.*\.(cmd|bat|vbe|vbs)$'

  - id: transfer-script-lure
    desc: Transfer document script lure
    if:
      type: path
      basename: true
      regex: '(?i)\btransfer(encia)?\b.*\.(cmd|bat|vbe|vbs)$'

  - id: traffic-citation-script-lure
    desc: Traffic-citation script lure name
    crit: suspicious
    conf: 0.9
    for: [zip, vbs, javascript, bz2]
    if:
      type: path
      basename: true
      regex: '(?i)(comparendo|foto.?multa).*\.(vbs|js)(\.bz2)?$'

  - id: payment-script-lure
    desc: Payment document script lure
    crit: suspicious
    conf: 0.92
    for: [batch, vbs, javascript]
    if:
      type: basename
      regex: '(?i)\bproof\s+of\s+payment\b.*\.(cmd|bat|vbs|js)$'

composite_rules:
  - id: business-document-script-lure
    desc: Business document script lure
    any:
      - id: bank-swift-script-lure
      - id: transfer-script-lure
      - id: payment-script-lure

  - id: payment-lure-script-eval-runner
    desc: Payment-lure script evaluates or indexes WScript
    crit: hostile
    conf: 0.96
    attack: T1036.005,T1027,T1059.007
    for: [javascript]
    all:
      - id: payment-script-lure
    any:
      - id: micro-behaviors/data/property/access::wscript-bracket-member-access
      - id: micro-behaviors/process/interpreter/eval/direct::js-eval-raw

  - id: citation-lure-reversed-pe-stager
    desc: Citation-lure script hides a reversed PE
    crit: hostile
    conf: 0.96
    attack: T1036.005,T1027.003
    for: [zip, vbs, javascript, bz2]
    all:
      - id: traffic-citation-script-lure
      - id: objectives/command-and-control/dropper/delivery/stego::reversed-base64-pe-header

  - id: citation-lure-encoded-ps-stager
    desc: Citation-lure script launches encoded PowerShell
    crit: hostile
    conf: 0.96
    attack: T1036.005,T1059.001
    for: [zip, vbs, javascript, bz2]
    all:
      - id: traffic-citation-script-lure
      - id: micro-behaviors/process/create/hidden::encodedcommand-invocation-raw

  - id: citation-lure-wscript-stager
    desc: Citation-lure script uses WScript bracket access
    crit: hostile
    conf: 0.95
    attack: T1036.005,T1027
    for: [zip, vbs, javascript, bz2]
    all:
      - id: traffic-citation-script-lure
      - id: micro-behaviors/data/property/access::wscript-bracket-member-access

  - id: bank-lure-script-relaunch-dropper
    desc: Bank-lure script executes or relaunches payload
    crit: hostile
    conf: 0.97
    attack: T1036.005,T1027,T1059.005
    for: [vbs]
    all:
      - id: bank-swift-script-lure
      - id: micro-behaviors/data/control-flow/dispatch::script-run-method-call
    any:
      - id: objectives/anti-static/obfuscation/eval/powershell-loader::ps-format-string-readalllines
      - id: objectives/anti-static/obfuscation/eval/powershell-loader::ps-format-string-new-scriptblock
      - id: micro-behaviors/process/create/shell/command-mode::cmd-delayed-expansion-c
