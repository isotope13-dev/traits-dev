defaults:
  platforms: [windows]
  for: [iso]
  attack: T1036.007,T1204.002

composite_rules:
  - id: iso-dotnet-payment-executable-lure
    desc: ISO delivers a resource-packed .NET payment executable lure
    crit: hostile
    conf: 0.99
    attack: T1036.007,T1204.002,T1027.009
    all:
      - id: metadata/file/format/structured::primary-volume-descriptor
      - id: metadata/file/format/iso::iso-document-exe-lure
      - id: metadata/file/format/managed-runtime::embedded-dotnet-assembly-company-attribute
      - id: metadata/file/format/managed-runtime::embedded-dotnet-assembly-title-attribute
      - id: metadata/file/format/managed-runtime::embedded-dotnet-reflection-marker
      - id: metadata/file/format/managed-runtime::embedded-dotnet-resource-loader

  - id: iso-dotnet-com-document-lure
    desc: ISO delivers a .COM-named .NET business-document lure
    crit: hostile
    conf: 0.99
    attack: T1036.007,T1204.002,T1620
    all:
      - id: metadata/file/format/structured::primary-volume-descriptor
      - id: metadata/file/format/iso::iso-document-com-lure
      - id: metadata/file/format/managed-runtime::embedded-dotnet-assembly-company-attribute
      - id: metadata/file/format/managed-runtime::embedded-dotnet-activator-reference
      - id: metadata/file/format/managed-runtime::embedded-dotnet-reflection-marker
      - id: metadata/file/format/managed-runtime::embedded-dotnet-resource-loader
