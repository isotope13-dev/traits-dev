defaults:
  platforms: [windows]
  for: [all]
  attack: T1036.007,T1204.002,T1056.001

composite_rules:
  - id: medical-examination-input-tool
    desc: Medical-exam identity masks .NET input automation
    crit: hostile
    conf: 0.99
    all:
      - id: metadata/package/versioning::pe-medical-examination-identity
      - id: micro-behaviors/hardware/input/automation::dotnet-macro-recorder-control-cluster
      - id: micro-behaviors/hardware/input/keyboard/hook::windows-hook-lifecycle

  # Shipping-carrier basename (UPS/DHL/…) paired with clinical examination
  # VERSIONINFO is a delivery lure contradicting the claimed product identity.
  - id: shipping-lure-medical-exam-masquerade
    desc: Shipping-lure EXE claims medical exam identity
    crit: hostile
    conf: 0.98
    attack: T1036.005,T1036.007
    all:
      - id: objectives/evasion/masquerade/file/lure::shipping-awb-exe-lure
      - id: metadata/package/versioning::pe-medical-examination-identity
      - id: metadata/binary/layout::pe-no-signature-record
      - id: metadata/binary/anomaly/provenance::pe-basename-differs-from-original-filename
    unless:
      - id: metadata/signed/platform/
