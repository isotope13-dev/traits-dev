defaults:
  platforms: [windows]
  for: [msi]
  attack: T1036.007,T1219

composite_rules:
  - id: viewer-named-rmm-agent-installer
    desc: Viewer-named installer is a remote-admin agent
    crit: hostile
    conf: 0.99
    all:
      - id: metadata/package/files/msi::msi-token-host-bootstrap-name
      - id: metadata/package/files/msi::msi-viewer-themed-name
      - id: objectives/command-and-control/backdoor/control/rmm::remote-management-agent-msi-package
