defaults:
  platforms: [windows]
  for: [pe]
  attack: T1036.005

traits:
- id: payment-receipt-exe-lure
  desc: Payment receipt executable lure
  crit: suspicious
  conf: 0.94
  if:
    type: path
    basename: true
    regex: (?i)\b(justificante|comprobante)\s+de\s+pago\.exe$
- id: payment-details-exe-lure
  desc: Payment details executable lure
  crit: suspicious
  conf: 0.9
  if:
    type: path
    basename: true
    regex: '(?i)\bpayment[-_ ]+details(\b|[-_]).*\.exe$'
- id: payment-invoice-exe-lure
  desc: Payment invoice executable lure
  crit: suspicious
  conf: 0.9
  if:
    type: path
    basename: true
    regex: '(?i)\bpayment[-_ ]*invoice\b.*\.exe$'
- id: romance-payment-exe-lure
  desc: Romance-language payment executable lure
  crit: suspicious
  conf: 0.9
  if:
    type: path
    basename: true
    # Covers compact names such as CopiaDelPagamento14042026.exe as well as
    # separated forms. The suffix limit keeps the basename match bounded.
    regex: '(?i)(del|de|di)?(pagamento|pago)[-_\w().]{0,20}\.exe$'
- id: russian-payment-document-exe-lure
  desc: Russian payment-document executable lure
  crit: suspicious
  conf: 0.9
  if:
    type: path
    basename: true
    regex: '(?i)\b(оплачен\w*|сч[её]т)\b.*\.(exe|com|pif)$'
- id: proof-of-payment-exe-lure
  desc: Proof of payment executable lure
  crit: suspicious
  conf: 0.92
  if:
    type: path
    basename: true
    regex: '(?i)\bproof\s+of\s+payment\b.*\.exe$'
# ISO-9660 8.3 truncation of "Proof of Payment.exe" (and similar
# proof-of-* payment lures) yields PROOF_OF.EXE — keep as its own atom so
# long-name and short-name delivery paths both feed payment composites.
- id: proof-of-shortname-exe-lure
  desc: Proof-of payment 8.3 executable lure
  crit: suspicious
  conf: 0.9
  if:
    type: path
    basename: true
    exact: PROOF_OF.EXE
    case_insensitive: true
- id: purchase-order-exe-lure
  desc: Purchase order executable lure
  crit: suspicious
  conf: 0.9
  if:
    type: path
    basename: true
    regex: '(?i)\b(purchase[-_ ]+order|orden\s+de\s+compra)\b.*\.exe$'
- id: order-exe-lure
  desc: Order executable lure
  crit: suspicious
  conf: 0.88
  if:
    type: path
    basename: true
    regex: '(?i)\b(new[-_ ]+)?(order|ordine)\b.*\.(exe|com|pif)$'
- id: quote-exe-lure
  desc: Quote executable lure
  crit: suspicious
  conf: 0.88
  if:
    type: path
    basename: true
    regex: '(?i)\bquote\b.*\.(exe|com|scr|pif)$'
- id: rfq-exe-lure
  desc: RFQ executable lure
  crit: suspicious
  conf: 0.88
  if:
    type: path
    basename: true
    regex: '(?i)\brfq\b.*\.(exe|pif)$'
- id: payment-advice-exe-lure
  desc: Payment advice executable lure
  crit: suspicious
  conf: 0.9
  if:
    type: path
    basename: true
    regex: '(?i)\b(payment[-_ ]+advice|scan[-_0-9 ]+payment)\b.*\.exe$'
- id: payment-advice-com-lure
  desc: Payment advice COM/SCR lure
  crit: suspicious
  conf: 0.9
  if:
    type: basename
    regex: '(?i)payment.?advice.*\.(com|scr|pif)$'
- id: price-inquiry-exe-lure
  desc: Price inquiry executable lure
  crit: suspicious
  conf: 0.9
  if:
    type: path
    basename: true
    regex: '(?i)\bprice[-_ ]+inquiry\b.*\.exe$'
- id: q88-exe-lure
  desc: Q88 vessel document executable lure
  crit: suspicious
  conf: 0.86
  if:
    type: path
    basename: true
    regex: '(?i)\bq88\b.*\.exe$'
- id: purchase-order-number-exe-lure
  desc: Purchase order number executable lure
  crit: suspicious
  conf: 0.9
  if:
    type: path
    basename: true
    regex: '(?i)\b(e-)?po[-_ #]{0,3}[0-9][\w #().-]{2,60}\.exe$'
  unless:
  - id: well-known/app/system/black-lightning::black-lightning-identity-context
- id: abbreviated-po-exe-lure
  desc: Abbreviated purchase-order executable lure
  crit: suspicious
  conf: 0.88
  if:
    type: path
    basename: true
    regex: '(?i)^pob?[-_ ]+[A-Z0-9][A-Z0-9_ -]{0,40}\.exe$'
  unless:
  - id: well-known/lib/platform/wine/
  - id: well-known/app/system/black-lightning::black-lightning-identity-context
- id: remittance-exe-lure
  desc: Remittance executable lure
  crit: suspicious
  conf: 0.9
  if:
    type: path
    basename: true
    regex: '(?i)\b(remittance|swift)\b.*\.(exe|com|scr|pif)$'
- id: bank-swift-exe-lure
  desc: Bank SWIFT executable lure
  crit: suspicious
  conf: 0.9
  if:
    type: path
    basename: true
    regex: '(?i)\b(MT103|bankasi|ziraat|swift)\b.*\.(exe|com|scr|pif)$'
- id: account-statement-exe-lure
  desc: Account statement executable lure
  crit: suspicious
  conf: 0.9
  if:
    type: path
    basename: true
    regex: '(?i)\b(statement|account)[-_ ]+(of[-_ ]+)?account\b.*\.exe$'
- id: shipping-awb-exe-lure
  desc: Shipping-carrier executable lure
  crit: suspicious
  conf: 0.88
  if:
    type: path
    basename: true
    regex: '(?i)\b(DHL|AWB|UPS|FedEx|USPS|TNT)\b.*\.exe$'
- id: inquiry-pdf-exe-lure
  desc: Inquiry PDF executable lure
  crit: suspicious
  conf: 0.88
  if:
    type: path
    basename: true
    regex: '(?i)\binquiry[-_ ]*pdf\b.*\.exe$'
- id: transfer-document-exe-lure
  desc: Transfer document executable lure
  crit: suspicious
  conf: 0.9
  if:
    type: path
    basename: true
    regex: '(?i)\btransfer(encia)?\b.*\.exe$'
- id: payment-balance-exe-lure
  desc: Payment-balance executable lure
  crit: suspicious
  conf: 0.9
  if:
    type: path
    basename: true
    regex: '(?i)\b(pago|payment)\b.{0,32}\b(saldo|balance)\b.*\.exe$'
- id: misspelled-payment-number-exe-lure
  desc: Misspelled payment executable name
  crit: suspicious
  conf: 0.9
  if:
    type: basename
    regex: '(?i)^payme[a-z]{1,5}[0-9]{8,}\.exe$'
- id: fatura-exe-lure
  desc: Invoice fatura executable lure
  crit: suspicious
  conf: 0.9
  if:
    type: path
    basename: true
    regex: '(?i)\bfatura\b.*\.(exe|com|scr|pif)$'
- id: signature-plan-exe-lure
  desc: Signature-plan executable lure
  crit: suspicious
  conf: 0.9
  if:
    type: path
    basename: true
    regex: '(?i)signature[_-]*(plan|request).{0,24}\.(exe|com|scr|pif)$'
- id: appendix-form-exe-lure
  desc: Appendix-form executable lure
  crit: suspicious
  conf: 0.88
  if:
    type: path
    basename: true
    regex: '(?i)\bappendix[_ -]*form\b.*\.(exe|com|scr|pif)$'

composite_rules:
- id: payment-document-exe-lure
  desc: Payment document executable lure
  crit: suspicious
  conf: 0.92
  any:
    - id: payment-receipt-exe-lure
    - id: proof-of-payment-exe-lure
    - id: proof-of-shortname-exe-lure
    - id: payment-advice-exe-lure
    - id: payment-advice-com-lure
    - id: payment-details-exe-lure
    - id: payment-invoice-exe-lure
    - id: misspelled-payment-number-exe-lure
    - id: romance-payment-exe-lure
    - id: russian-payment-document-exe-lure
    - id: purchase-order-exe-lure
    - id: order-exe-lure
    - id: quote-exe-lure
    - id: purchase-order-number-exe-lure
    - id: abbreviated-po-exe-lure
    - id: remittance-exe-lure
    - id: bank-swift-exe-lure
    - id: account-statement-exe-lure
    - id: shipping-awb-exe-lure
    - id: inquiry-pdf-exe-lure
    - id: transfer-document-exe-lure
    - id: payment-balance-exe-lure
    - id: fatura-exe-lure
    - id: signature-plan-exe-lure
    - id: appendix-form-exe-lure
  unless:
    - id: well-known/app/system/black-lightning::black-lightning-identity-context

# A business-document lure filename (PO / invoice / remittance / SWIFT …) on an
# executable whose payload is BOTH packed (high-entropy installer overlay) AND
# not from a real vendor (self-issued/ad-hoc cert or unsigned) is the malspam
# loader pattern — legitimate business software is never named this way AND
# shipped as a self-issued packed blob. Generalizes across lure themes and
# packers; the specific PO number / signer bytes are not hardcoded.
# Nested composite legs often do not fire. Pair the overlay atom with the
# lure atoms directly so a tar.bz2 / .com-named stager still matches.
- id: business-lure-packed-untrusted-payload
  desc: Business-lure name hides a packed untrusted payload
  crit: hostile
  conf: 0.97
  attack: T1036.005,T1027
  all:
    - id: metadata/binary/layout/overlay::high-entropy-overlay
  any:
    - id: payment-receipt-exe-lure
    - id: proof-of-payment-exe-lure
    - id: proof-of-shortname-exe-lure
    - id: payment-advice-exe-lure
    - id: payment-advice-com-lure
    - id: payment-details-exe-lure
    - id: payment-invoice-exe-lure
    - id: misspelled-payment-number-exe-lure
    - id: romance-payment-exe-lure
    - id: russian-payment-document-exe-lure
    - id: purchase-order-exe-lure
    - id: order-exe-lure
    - id: quote-exe-lure
    - id: purchase-order-number-exe-lure
    - id: abbreviated-po-exe-lure
    - id: remittance-exe-lure
    - id: bank-swift-exe-lure
    - id: account-statement-exe-lure
    - id: shipping-awb-exe-lure
    - id: inquiry-pdf-exe-lure
    - id: transfer-document-exe-lure
    - id: payment-balance-exe-lure
    - id: fatura-exe-lure
    - id: signature-plan-exe-lure
    - id: appendix-form-exe-lure
    - id: objectives/evasion/masquerade/file/lure::quotation-exe-name
# The lure atoms carry their own `unless:` for recognized-application identity,
# but an atom-level suppressor does not reach a composite that references the
# atom by id, so every composite that convicts on a lure name has to repeat it.
- id: business-lure-unsigned-payload
  desc: Business-lure unsigned executable payload
  crit: hostile
  conf: 0.96
  all:
    - id: metadata/signed/trust-level::unsigned-missing-signature-record
  any:
    - id: payment-advice-exe-lure
    - id: payment-advice-com-lure
    - id: remittance-exe-lure
    - id: bank-swift-exe-lure
    - id: purchase-order-number-exe-lure
    - id: proof-of-payment-exe-lure
    - id: fatura-exe-lure
    - id: signature-plan-exe-lure
    - id: appendix-form-exe-lure
    - id: transfer-document-exe-lure
    - id: objectives/evasion/masquerade/file/lure::quotation-exe-name
  unless:
    - id: well-known/app/system/black-lightning::black-lightning-identity-context

- id: business-lure-self-issued-payload
  desc: Business-lure self-issued signed payload
  crit: hostile
  conf: 0.96
  all:
    - id: metadata/signed/certificate/identity::pe-cert-leaf-self-issued
  any:
    - id: payment-advice-exe-lure
    - id: payment-advice-com-lure
    - id: remittance-exe-lure
    - id: fatura-exe-lure
    - id: signature-plan-exe-lure
    - id: purchase-order-number-exe-lure
    - id: proof-of-payment-exe-lure
    - id: transfer-document-exe-lure
    - id: appendix-form-exe-lure
    - id: objectives/evasion/masquerade/file/lure::quotation-exe-name
- id: business-lure-large-overlay-dropper
  desc: Business-lure large overlay dropper
  crit: hostile
  conf: 0.95
  all:
    - id: metadata/binary/layout/overlay::overlay-at-least-80k
  any:
    - id: payment-advice-exe-lure
    - id: payment-advice-com-lure
    - id: remittance-exe-lure
    - id: fatura-exe-lure
    - id: signature-plan-exe-lure
    - id: appendix-form-exe-lure
    - id: purchase-order-number-exe-lure
    - id: proof-of-payment-exe-lure
    - id: transfer-document-exe-lure
    - id: objectives/evasion/masquerade/file/lure::quotation-exe-name
- id: business-lure-high-entropy-payload
  desc: Business-lure high-entropy executable
  crit: hostile
  conf: 0.95
  all:
    - id: metadata/binary/layout/entropy::overall-entropy-78
  any:
    - id: payment-advice-exe-lure
    - id: payment-advice-com-lure
    - id: remittance-exe-lure
    - id: fatura-exe-lure
    - id: signature-plan-exe-lure
    - id: appendix-form-exe-lure
    - id: purchase-order-number-exe-lure
    - id: proof-of-payment-exe-lure
    - id: transfer-document-exe-lure
    - id: objectives/evasion/masquerade/file/lure::quotation-exe-name
- id: business-lure-version-mismatch
  desc: Business-lure version-info name mismatch
  crit: hostile
  conf: 0.94
  all:
    - id: metadata/binary/provenance/version-info::pe-non-architecture-filename-mismatch
  any:
    - id: payment-advice-exe-lure
    - id: payment-advice-com-lure
    - id: remittance-exe-lure
    - id: fatura-exe-lure
    - id: signature-plan-exe-lure
    - id: appendix-form-exe-lure
    - id: purchase-order-number-exe-lure
    - id: proof-of-payment-exe-lure
    - id: transfer-document-exe-lure
    - id: objectives/evasion/masquerade/file/lure::quotation-exe-name
  unless:
    - id: well-known/app/system/black-lightning::black-lightning-identity-context

- id: business-lure-nsis-overlay-dropper
  desc: Business-lure NSIS overlay dropper
  crit: hostile
  conf: 0.96
  attack: T1036.005,T1027
  all:
    - id: metadata/binary/installer/script::nsis
    - id: metadata/binary/layout/overlay::overlay-over-30pct
  any:
    - id: payment-advice-exe-lure
    - id: payment-advice-com-lure
    - id: remittance-exe-lure
    - id: fatura-exe-lure
    - id: signature-plan-exe-lure
    - id: appendix-form-exe-lure
    - id: purchase-order-number-exe-lure
    - id: proof-of-payment-exe-lure
    - id: transfer-document-exe-lure
    - id: objectives/evasion/masquerade/file/lure::quotation-exe-name

- id: payment-advice-remote-http-injector
  desc: Payment-advice lure with remote inject and WinInet
  crit: hostile
  conf: 0.96
  attack: T1036.005,T1055,T1071.001
  for: [pe, zip]
  scope: archive
  all:
    - id: payment-advice-exe-lure
    - id: payment-advice-com-lure
    - id: objectives/evasion/process/injection/memory::remote-alloc-write-process-injector
    - id: micro-behaviors/communications/http/client/wininet::internet-open

- id: payment-advice-runas-injector
  desc: Payment-advice lure injects with runas
  crit: hostile
  conf: 0.96
  attack: T1036.005,T1055,T1548.002
  for: [pe, zip]
  scope: archive
  all:
    - id: payment-advice-exe-lure
    - id: payment-advice-com-lure
    - id: objectives/evasion/process/injection/memory::remote-alloc-write-process-injector
    - id: micro-behaviors/os/privilege/elevation::shell-execute-runas

- id: payment-advice-sendinput-http
  desc: Payment-advice lure synthesizes input over HTTP
  crit: hostile
  conf: 0.95
  attack: T1036.005,T1056.001,T1071.001
  for: [pe, zip]
  scope: archive
  all:
    - id: payment-advice-exe-lure
    - id: payment-advice-com-lure
    - id: micro-behaviors/communications/http/client/wininet::internet-open
    - id: micro-behaviors/hardware/input/synthesize::sendinput-api-name

# Payment-themed basename on an unsigned MyApplication-template .NET assembly
# that loads managed resources after Base64 decode — ISO/email "Proof of
# Payment" droppers. Uses payment-specific lure atoms only (not the broader
# payment-document umbrella, which also folds in shipping AWB names). Includes
# the ISO-9660 8.3 shortname atom so container-extracted children still match.
- id: payment-lure-dotnet-template-loader
  desc: Payment-lure unsigned .NET template loader
  crit: hostile
  conf: 0.98
  attack: T1036.005,T1036.007,T1027.009,T1620
  all:
    - id: metadata/build/manifest::pe-manifest-myapplication-template
    - id: metadata/binary/framework::dotnet-assembly
    - id: metadata/signed/trust-level::unsigned-missing-signature-record
    - id: metadata/binary/provenance/version-info::pe-basename-differs-from-original-filename
    - id: micro-behaviors/data/embedded/payload/resource::dotnet-managed-resource-access
    - id: micro-behaviors/data/decode/base64::dotnet-frombase64string-text
  any:
    - id: proof-of-payment-exe-lure
    - id: proof-of-shortname-exe-lure
    - id: payment-receipt-exe-lure
    - id: payment-advice-exe-lure
    - id: payment-advice-com-lure
    - id: payment-details-exe-lure
    - id: payment-invoice-exe-lure
    - id: payment-balance-exe-lure
    - id: remittance-exe-lure
  needs: 1
  unless:
    - id: metadata/signed/platform/

# A business-document filename paired with the bitmap-backed reflective loader
# is a stronger signal than either the lure or loader alone. Keep this broad
# across PO, invoice, remittance, and related executable lures while requiring
# the packed unsigned .NET payload shape.
- id: business-lure-dotnet-bitmap-loader
  desc: Business-lure unsigned .NET bitmap loader
  crit: hostile
  conf: 0.99
  attack: T1036.005,T1027.003,T1620,T1204.002
  all:
    - id: payment-document-exe-lure
    - id: metadata/build/manifest::pe-manifest-myapplication-template
    - id: metadata/binary/framework::dotnet-assembly
    - id: metadata/signed/trust-level::unsigned-missing-signature-record
    - id: metadata/binary/provenance/version-info::pe-basename-differs-from-original-filename
    - id: metadata/binary/resource/size::dotnet-large-high-entropy-managed-resource
    - id: micro-behaviors/data/embedded/payload/image::dotnet-resource-bitmap-pixel-readback
    - id: micro-behaviors/process/interpreter/reflection/runtime::activator
    - id: micro-behaviors/process/interpreter/reflection/runtime::create-instance-token
    - id: objectives/anti-static/obfuscation/reflection/invoke::get-exported-types-token
  unless:
    - id: metadata/signed/platform/
