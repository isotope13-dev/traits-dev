defaults:
  platforms: [windows]
  for: [pe, data, text]
composite_rules:
  - id: nsis-disguised-xorhex-callback-loader
    desc: Disguised NSIS hides native callback commands
    crit: hostile
    conf: 0.98
    attack: T1036,T1027.009
    scope: outer
    all:
      - id: objectives/anti-static/obfuscation/payload/encrypted::nsis-xorhex-native-callback-commands
    any:
      - id: metadata/file/extension/executable::document-double-exe-suffix
      - id: objectives/evasion/masquerade/versioninfo::word-salad-version-copyright
      - id: objectives/evasion/masquerade/versioninfo::short-word-salad-versioninfo
