defaults:
  platforms: [unix, windows]
  for: [iso]
  attack: T1027.002,T1204.002,T1036

composite_rules:
  - id: iso-smart-screen-packed-installer-lure
    for: [iso, data]
    desc: ISO uses SmartScreen bypass guidance for a packed installer
    crit: hostile
    conf: 0.99
    all:
      - id: metadata/file/format/iso/structure::primary-volume-descriptor
      - id: metadata/file/format/iso/structure::embedded-themida-section
      - id: metadata/file/format/iso/payload::iso-run-anyway-guidance
      - id: metadata/file/format/iso/structure::embedded-admin-manifest-marker
      - id: metadata/file/format/iso/structure::embedded-executable-member
