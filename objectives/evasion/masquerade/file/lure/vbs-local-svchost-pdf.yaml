defaults:
  platforms: [windows]
  for: [vbs]
  attack: T1036,T1204

traits:
  - id: vbs-local-svchost-hidden-pdf-decoy
    desc: VBS starts local svchost hidden beside PDF
    crit: hostile
    conf: 0.97
    if:
      type: yara
      source: |
        rule vbs_local_svchost_hidden_pdf_decoy {
          strings:
            $self = "WScript.ScriptFullName" nocase
            $exe = /BuildPath\s*\([^\r\n]{1,100}["']svchost\.exe["']/ nocase
            $pdf = /BuildPath\s*\([^\r\n]{1,100}["'][^"'\r\n]{1,100}\.pdf["']/ nocase
            $hidden = /ShellExecute\s+[^\r\n]{1,150}["']open["']\s*,\s*0/ nocase
            $visible = /ShellExecute\s+[^\r\n]{1,150}["']open["']\s*,\s*1/ nocase
          condition:
            all of them
        }
