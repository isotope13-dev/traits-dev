# A document-looking executable carrying a keyboard-capture logger is a
# delivery masquerade, not a generic PDF filename observation.
defaults:
  platforms: [windows]
  for: [all]
  attack: T1036.008,T1056.001

composite_rules:
  - id: iso-pdf-lure-input-capture
    desc: ISO PDF lure carries input-capture logger
    crit: hostile
    conf: 0.99
    all:
      - id: metadata/file/format/structured::primary-volume-descriptor
      - id: metadata/file/format/iso::iso-pdf-exe-member
      - id: objectives/collection/keylog/capture::iso-windows-hook-file-logger
