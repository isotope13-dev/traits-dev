# Paperwork names on installer containers.
#
# The .exe lures in this directory carry their deception in the filename and
# are convicted by what the binary turns out to be. An MSI works the same way,
# with one difference: the package is often the vendor's genuine, correctly
# signed installer, so nothing inside it is forgeable evidence. What is left is
# the contradiction between how the file presents itself — an invoice, a quote,
# a purchase order — and what installing it actually does.
#
# A remote-management agent is the payload that makes that contradiction
# convicting. Anyone with a reason to deploy one downloaded it from their own
# management console; the copy that reaches a mailbox as an invoice enrolls
# whoever runs it into somebody else's console instead.
#
# The basename atom lives in metadata/package/files/msi/ with the other MSI
# container reads (`for: [oledoc]`).
defaults:
  platforms: [windows]
  for: [oledoc]
  attack: T1036.007,T1219
  size_min: 512
  size_max: 500000000

composite_rules:
  - id: document-lure-msi-remote-management-agent
    desc: Document-named MSI installs a remote-admin agent
    crit: hostile
    conf: 0.97
    all:
      - id: metadata/package/files/msi::msi-business-document-name
      - id: objectives/command-and-control/backdoor/control/rmm::remote-management-agent-msi-package
