# A localized screensaver filename in an archive-metadata directory is a
# user-execution lure. The rule requires both context signals to avoid
# escalating ordinary localized shortcuts.
defaults:
  platforms: [windows]
  for: [lnk]
  attack: T1036,T1204.002

traits:
- id: localized-scr-target
  desc: LNK uses localized screensaver filename
  crit: suspicious
  conf: 0.96
  if:
    type: value
    path: lnk.relative_path
    regex: '(?i)(^|[\\/])[^\\/]*\p{Han}{2,}[^\\/]*\.scr$'

composite_rules:
- id: localized-macos-scr-lure
  desc: Localized LNK screensaver execution lure
  crit: hostile
  conf: 0.99
  all:
  - id: micro-behaviors/process/create/shortcut::lnk-relative-executable-target
  - id: objectives/execution/lnk/target::lnk-macos-metadata-scr-target
  - id: localized-scr-target
