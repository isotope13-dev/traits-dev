defaults:
  platforms: [windows]
  for: [lnk]
  attack: T1036,T1204.002

composite_rules:
  - id: lnk-browser-icon-remote-command-lure
    desc: Browser-icon LNK disguises remote command stage
    crit: hostile
    conf: 0.99
    all:
      - id: micro-behaviors/ui/graphics/icon::lnk-edge-icon-location
      - id: micro-behaviors/process/config/target::lnk-interpreter-target-with-arguments
    any:
      - id: objectives/execution/payload/remote-script::minimized-obfuscated-remote-command
      - id: objectives/execution/interpreter/script/mshta::lnk-minimized-split-mshta-remote-stage
    needs: 1

  # A browser icon paired with an interpreter and local batch commands can
  # conceal the launch purpose. Local archive operations establish no remote
  # source and can also occur in legitimate wrappers.
  - id: lnk-browser-icon-local-batch-commands
    desc: Browser-icon LNK with local batch commands
    crit: suspicious
    conf: 0.95
    attack: T1036
    all:
      - id: micro-behaviors/ui/graphics/icon::lnk-edge-icon-location
      - id: micro-behaviors/process/config/target::lnk-interpreter-target-with-arguments
      - id: objectives/execution/payload/file-exec/command/batch::lnk-headless-extract-copy-batch-commands

  - id: lnk-browser-icon-pdf-double-ext-remote-exe
    desc: Edge-icon PDF double-ext LNK launches remote exe
    crit: hostile
    conf: 0.99
    all:
      - id: micro-behaviors/ui/graphics/icon::lnk-edge-icon-location
      - id: metadata/file/extension/executable::lnk-pdf-double-extension
      - id: micro-behaviors/fs/path/network::lnk-remote-unc-environment-exe-target
