defaults:
  platforms: [windows]
  for: [lnk]
  attack: T1036.007,T1204.002

composite_rules:
  - id: lnk-browser-icon-remote-command-lure
    desc: Browser-icon LNK disguises remote command stage
    crit: hostile
    conf: 0.99
    all:
      - id: well-known/app/browser/microsoft-edge::lnk-icon-location
      - id: micro-behaviors/process/create/shortcut::lnk-cmd-target
      - id: objectives/command-and-control/dropper/lnk/target::minimized-obfuscated-remote-command
