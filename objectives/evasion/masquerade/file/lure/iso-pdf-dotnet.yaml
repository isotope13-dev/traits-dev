defaults:
  platforms: [windows]
  for: [all]
  attack: T1036.005,T1204.002

composite_rules:
  - id: iso-pdf-named-dotnet-reflective-loader
    desc: ISO PDF-named .NET reflective executable lure
    crit: hostile
    conf: 0.98
    attack: T1036.005,T1027,T1620
    all:
      - id: metadata/file/format/structured::primary-volume-descriptor
      - id: metadata/file/format/iso::iso-pdf-exe-member
      - id: metadata/file/format/managed-runtime::embedded-dotnet-assembly-company-attribute
      - id: metadata/file/format/managed-runtime::embedded-dotnet-reflection-marker
