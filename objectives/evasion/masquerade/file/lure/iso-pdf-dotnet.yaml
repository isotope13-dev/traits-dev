defaults:
  platforms: [windows]
  for: [iso, data, archive]
  attack: T1036.005,T1204.002

composite_rules:
  - id: iso-pdf-named-dotnet-reflective-loader
    desc: ISO PDF-named .NET reflective executable lure
    crit: hostile
    conf: 0.98
    attack: T1036.005,T1027,T1620
    all:
      - id: metadata/file/format/structured::primary-volume-descriptor
      - id: metadata/file/format/iso::iso-pdf-exe-member
      - id: metadata/file/format/managed-runtime::embedded-dotnet-assembly-company-attribute
      - id: metadata/file/format/managed-runtime::embedded-dotnet-reflection-marker

  - id: iso-pdf-named-dotnet-template-lure
    desc: ISO PDF-named .NET template executable lure
    crit: hostile
    conf: 0.98
    attack: T1036.007,T1204.002
    all:
      - id: metadata/file/format/structured::primary-volume-descriptor
      - id: metadata/file/format/iso::iso-pdf-exe-member
      - id: metadata/file/format/managed-runtime::embedded-dotnet-metadata-signature
      - id: metadata/file/format/managed-runtime::embedded-dotnet-template-manifest

  # ResourceReader is ordinary WinForms plumbing; keep this as a component so
  # MotW PDF.EXE lures still surface the stronger template/wrapper hostiles.
  - id: iso-pdf-dotnet-resource-lure
    desc: PDF-named .NET resource-backed executable lure
    crit: suspicious
    conf: 0.9
    attack: T1036.007,T1204.002,T1027.009
    all:
      - id: metadata/file/format/structured::primary-volume-descriptor
      - id: metadata/file/format/iso::iso-pdf-exe-member
      - id: metadata/file/format/managed-runtime::embedded-dotnet-metadata-signature
      - id: micro-behaviors/data/embedded/payload/resource::dotnet-resource-reader-access
