defaults:
  platforms: [windows]
  for: [pe]
  attack: T1036
composite_rules:
- id: nsis-document-or-version-lure
  desc: NSIS document name or word-salad version
  crit: suspicious
  conf: 0.96
  all:
  - id: metadata/binary/installer/script::nsis
  any:
  - id: objectives/evasion/masquerade/file/payment::payment-document-exe-lure
  - id: metadata/file/naming::business-document-exe-name
  - id: metadata/file/naming::pdf-document-exe-name
  - id: metadata/file/extension/executable::document-double-exe-suffix
  - id: objectives/evasion/masquerade/version-resource/claim::oracle-java-runtime-unsigned-version-lure
  - id: objectives/evasion/masquerade/versioninfo::word-salad-version-copyright
  - id: objectives/evasion/masquerade/versioninfo::short-word-salad-versioninfo

