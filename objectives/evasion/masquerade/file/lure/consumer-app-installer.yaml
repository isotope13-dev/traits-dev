# Executables named after a consumer application's "get the app" download.
#
# Lookalike download sites hand the visitor a file called
# `<Brand>_App.setup<...>.exe` — the brand word, the token "app", and an
# install verb, in that order.  The name carries the whole deception; nothing
# inside the file has to agree with it.
#
# The shape is only notable on its own, because ordinary vendors ship
# installers named this way too (WhatsAppSetup.exe reads identically).  What
# convicts is the contradiction between this name and the product identity
# compiled into the binary, which the composites in
# objectives/evasion/masquerade/version-resource/contradiction/ and
# objectives/command-and-control/backdoor/control/rmm/ assemble.  Matching the
# brand itself is deliberately not attempted: the set of impersonated brands is
# open-ended and a brand word alone says nothing about the file.
defaults:
  platforms: [windows]
  for: [pe, dll]
  attack: T1036.005

traits:
  - id: branded-app-installer-exe-name
    desc: Consumer-app-themed installer filename
    crit: notable
    conf: 0.85
    if:
      type: path
      basename: true
      regex: '(?i)^\w{2,20}[ _-]?app[ ._-]?(setup|install)[^/]{0,44}\.exe$'

  # The same name seen from the delivery side, in a page or script that hands
  # the file out.  Here the account identifier is required as well as the app
  # wording, which is what separates a lure page from a management portal
  # serving its own tenant an installer: the portal's copy still carries the
  # vendor's product name, not somebody else's app.
  - id: branded-app-account-bound-installer-reference
    desc: App-lure installer name with GUID-shaped ID
    crit: suspicious
    conf: 0.93
    platforms: [windows, unix]
    for: [html, javascript, typescript, scripts, batch, powershell]
    attack: T1036.005,T1219
    if:
      type: text
      regex: '(?i)\w{2,20}[ _-]?app[ ._-]?setup[-._]?[a-f\d]{6,8}(-[a-f\d]{4,12}){4}\.exe'
