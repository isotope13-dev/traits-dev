# Payment-themed ISO lures that silently run a legacy SFX payload.
defaults:
  platforms: [windows]
  for: [iso]
  attack: T1036.008,T1204.002

composite_rules:
  - id: iso-payment-sfx-dropper
    desc: ISO payment lure silently runs SFX payload
    crit: hostile
    conf: 0.99
    all:
      - id: metadata/file/format/structured::primary-volume-descriptor
      - id: metadata/file/format/iso::iso-winrar-sfx-module
      - id: metadata/file/format/iso::iso-sfx-setup-silent-pif
      - id: metadata/file/format/iso::iso-proof-of-exe-member
