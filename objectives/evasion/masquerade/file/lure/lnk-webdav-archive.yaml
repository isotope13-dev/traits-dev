defaults:
  platforms: [windows]
  for: [lnk]
composite_rules:
  - id: browser-icon-webdav-archive-batch-lure
    desc: Browser-icon LNK disguises WebDAV archive and batch commands
    crit: hostile
    conf: 0.98
    attack: T1036.008,T1204.002
    all:
      - id: micro-behaviors/ui/graphics/icon::lnk-edge-icon-location
      - id: micro-behaviors/process/create/shortcut::lnk-cmd-target
      - id: micro-behaviors/communications/http/webdav::webdav-ssl-unc-lnk-argument
      - id: micro-behaviors/fs/file/copy::lnk-unc-tar-copy-to-userprofile
      - id: micro-behaviors/data/archive/extract/tar::lnk-tar-userprofile-extraction
      - id: micro-behaviors/process/create/shell/command-flag::lnk-userprofile-batch-command-tail
