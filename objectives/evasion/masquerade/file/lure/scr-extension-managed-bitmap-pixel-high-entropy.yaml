# A .NET program saved with the .scr screensaver extension that reads pixels
# from a resource bitmap and is almost entirely high-entropy data is a payload
# carrier dressed as a document-style attachment, not a screensaver.
defaults:
  platforms: [windows]
  for: [pe]
  attack: T1036.008,T1027.003
composite_rules:
  - id: scr-named-dotnet-bitmap-pixel-reader-with-high-entropy
    desc: .scr .NET bitmap pixel reader with high entropy
    crit: suspicious
    conf: 0.75
    all:
      - id: micro-behaviors/fs/path/extension::scr-extension
      - id: micro-behaviors/data/embedded/payload/image::dotnet-resource-bitmap-pixel-readback
      - id: metadata/file/entropy::overall-entropy-78
