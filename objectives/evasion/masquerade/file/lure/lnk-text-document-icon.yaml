defaults:
  platforms: [windows]
  for: [lnk]

composite_rules:
  - id: lnk-text-document-remote-powershell-lure
    desc: Text-document shortcut disguises remote PowerShell execution
    crit: hostile
    conf: 0.98
    attack: T1036,T1059.001,T1105,T1204.002
    all:
      - type: trait
        id: objectives/evasion/masquerade/file/lure::description-claims-text-document
      - type: trait
        id: micro-behaviors/ui/graphics/icon::lnk-notepad-icon-location
      - type: trait
        id: objectives/execution/payload/script-eval/network/response-body::lnk-com-response-invocation-downloader
      - type: trait
        id: micro-behaviors/ui/window/state::lnk-powershell-stealth-window
