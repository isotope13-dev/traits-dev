defaults:
  platforms: [windows]
  for: [lnk]
  attack: T1036,T1204.002

traits:
  - id: billing-document-lnk-basename
    desc: Shortcut filename presents as a billing document
    crit: notable
    conf: 0.92
    if:
      type: basename
      regex: '(?i)^(invoice|receipt)[-_ .A-Za-z0-9]{0,32}\.lnk$'

composite_rules:
  - id: billing-pdf-lure-hidden-script
    desc: Billing PDF shortcut runs hidden data-file script
    crit: hostile
    conf: 0.98
    all:
      - id: billing-document-lnk-basename
      - id: metadata/file/extension/executable::lnk-pdf-double-extension
      - id: micro-behaviors/process/create/shortcut::lnk-hidden-window-flag
      - id: objectives/command-and-control/dropper/lnk/script-chain::lnk-arg-cmd-c-txt
  - id: billing-lure-remote-script-launch
    desc: Billing-themed shortcut launches a remote Windows script
    crit: hostile
    conf: 0.995
    attack: T1036,T1021.002,T1059.005,T1204.002
    all:
      - id: billing-document-lnk-basename
      - id: micro-behaviors/process/argument/option::lnk-slash-c-switch
      - id: micro-behaviors/process/create/shortcut::lnk-cmd-target
      - id: "micro-behaviors/ui/window/state::lnk-minimized-inactive-window"
      - id: objectives/command-and-control/dropper/lnk/network-share::unc-ipv4-share-argument
      - id: objectives/command-and-control/dropper/lnk/network-share::unc-script-host-argument
