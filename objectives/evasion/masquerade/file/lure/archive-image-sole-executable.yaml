# Double-wrapped delivery: an archive carrying a disc image whose only file
# is an unsigned executable. The archive gets the image past mail filters
# that block raw .iso/.img attachments; mounting the image
# then drops the Mark-of-the-Web, so the executable launches without the
# zone warning. Software is not distributed this way: an installer disc has
# data and metadata beside its setup program, and a vendor build is signed.
# The archive leg reads the member's disc-image extension, which Explorer
# requires before it will mount the image on double-click; the remaining
# legs prove from the walked ISO structure and the PE itself that the member
# really is a one-file image holding an unsigned executable.
defaults:
  platforms: [windows]
  # Member types must be listed so their findings pass the origin filter.
  for: [rar, zip, 7z, cab, tar, iso, pe]
  attack: T1553.005,T1027.006,T1204.002

composite_rules:
  - id: archived-image-sole-unsigned-executable
    desc: Archived disc image wraps one unsigned EXE
    crit: hostile
    conf: 0.92
    scope: outer
    all:
      - id: metadata/archive/layout::archive-disk-image-member
      - id: metadata/file/format/iso/structure::primary-volume
      - id: metadata/file/format/iso/structure::single-file-tree
      - id: metadata/file/format/iso/structure::contains-executable-member
      - id: metadata/signature/absent::unsigned-missing-signature-record
