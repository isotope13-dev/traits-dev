defaults:
  platforms: [windows]
  for: [iso]
  attack: T1036.007,T1204.002

composite_rules:
  - id: iso-vb6-document-executable-lure
    desc: ISO delivers a VB6 executable as a document-themed lure
    crit: hostile
    conf: 0.99
    all:
      - id: metadata/file/format/structured::primary-volume-descriptor
      - id: metadata/file/format/iso::iso-document-exe-lure
      - id: metadata/file/format/iso::iso-vb6-runtime-identity
