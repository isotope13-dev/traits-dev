defaults:
  platforms: [windows]
  for: [lnk]
  attack: T1036.007,T1204.002

composite_rules:
  - id: lnk-pdf-icon-concealed-interpreter
    desc: PDF-icon shortcut hides command interpreter execution
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/ui/graphics/icon::lnk-pdf-icon-location
    any:
      - id: micro-behaviors/process/config/target::lnk-interpreter-target-with-arguments
      - id: micro-behaviors/process/config/launch::lnk-conhost-headless-cmd
      - id: micro-behaviors/process/config/target::lnk-conhost-headless-powershell
    needs: 1
