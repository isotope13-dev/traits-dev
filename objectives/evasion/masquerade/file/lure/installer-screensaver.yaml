# A payload delivered as a screensaver named after a developer tool.
#
# `.scr` is a real Windows executable format, so nothing about it is a type
# mismatch -- which is exactly why it has been an execution lure for thirty
# years. Windows launches it on double-click like any other program, mail
# gateways and upload filters that block `.exe` routinely allow it, and a user
# who has been told to watch for `.exe` attachments has no reason to react.
#
# The exotel and spam incidents both shipped `python-install.scr`: a signed
# PE, presented as a Python installer, carrying a .NET stealer that queries
# the Chromium `logins` table. Nobody distributes a language runtime as a
# screensaver.
#
# The pairing is a name that promises software installation or an update, and
# an extension that promises a desktop toy. Neither half is remarkable; the
# combination has no honest form. Named tools are listed only as the shape
# attackers reach for -- the rule does not depend on which one.
defaults:
  platforms: [windows]
  for: [pe]
  attack: T1036.007,T1204.002
  mbc: F0001

traits:
  - id: installer-named-screensaver-file
    desc: Screensaver named like an installer
    crit: suspicious
    conf: 0.94
    if:
      type: path
      basename: true
      regex: '(?i)(install|setup|update|patch|driver)[\w.-]{0,24}\.scr$'

  - id: runtime-named-screensaver-file
    desc: Screensaver named after a runtime
    crit: suspicious
    conf: 0.94
    if:
      type: path
      basename: true
      regex: '(?i)(python|java|node|adobe|chrome|office)[\w.-]{0,24}\.scr$'

composite_rules:
  - id: screensaver-lure-filename
    desc: Screensaver name promises software
    crit: notable
    conf: 0.94
    any:
      - id: installer-named-screensaver-file
      - id: runtime-named-screensaver-file

  - id: executable-lure-screensaver-extension
    desc: Screensaver lure carries executables
    crit: hostile
    conf: 0.95
    # The second leg is what separates the lure from a screensaver that merely
    # has an unfortunate name: this file carries other executables inside it.
    # A real screensaver draws pixels; it does not embed a payload chain.
    all:
      - id: screensaver-lure-filename
    any:
      - id: metadata/binary/layout::multiple-pe-embedded
      - id: objectives/evasion/masquerade/trust::signed-host-large-executable-overlay
    unless:
      - id: metadata/package/testing/
