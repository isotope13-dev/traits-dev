# PDF lure decoy: malware harvests a user's existing PDF and opens it via the
# default handler so the victim sees a familiar document while the script runs
# in the background (typically followed by self-delete).
defaults:
  attack: T1036
traits:
- id: pdf-search-userprofile--rx-4
  desc: Regex component marker
  crit: component
  conf: 0.92
  for: [batch, powershell, vbs]
  platforms: [windows]
  if:
    type: text
    substr: '*.pdf'
    case_insensitive: true
# The home-Documents path leg is the neutral canonical atom
# micro-behaviors/fs/path/location::documents-folder-target; a local copy here
# (anything within 50 bytes of a home prefix, then "documents") was reported
# as a masquerade lure on MariaDB's README.
composite_rules:
- id: pdf-lure-decoy-execution
  desc: Harvests a user PDF and launches it as decoy
  crit: hostile
  conf: 0.95
  attack: T1036.005
  mbc: B0007
  platforms: [windows]
  for: [batch, powershell, vbs]
  all:
  - id: pdf-search-userprofile
  - id: micro-behaviors/process/create/launch::windows-start-variable-target
- id: pdf-lure-decoy-execution-posix
  desc: PDF lure decoy (find then `open`)
  crit: hostile
  conf: 0.94
  attack: T1036.005
  mbc: B0007
  platforms: [macos]
  for: [shell]
  all:
  - id: micro-behaviors/fs/search::posix-pdf-search
  - id: micro-behaviors/process/create/shellexec::open-file-command
  unless:
  - id: metadata/file/format/structured::sourcemap
  - id: metadata/file/format/structured::sourcemap-sources-content
  near_lines: 50
- id: pdf-decoy-with-hidden-relaunch
  desc: PDF decoy paired with hidden self-relaunch
  crit: hostile
  conf: 0.97
  attack: T1036.005
  mbc: B0007
  platforms: [windows]
  for: [batch]
  all:
  - id: pdf-lure-decoy-execution
  - id: objectives/evasion/process/hidden/execution::batch-powershell-hidden-self-relaunch
- id: pdf-search-userprofile
  desc: Recursive PDF search in user Downloads/Documents
  crit: suspicious
  conf: 0.92
  mbc: B0007
  for: [batch, powershell, vbs]
  platforms: [windows]
  all:
  - id: micro-behaviors/os/env/user-paths::userprofile-var
  - id: pdf-search-userprofile--rx-4
  any:
  - id: micro-behaviors/fs/path/location::documents-folder-target
  - id: micro-behaviors/fs/path/personal::downloads-directory-reference
  unless:
  - id: metadata/file/string/corpus::hashed-text-record
- id: lnk-pdf-viewer-install-decoy
  desc: LNK opens PDF beside quiet MSI install
  crit: hostile
  conf: 0.99
  attack: T1036.005,T1218.007
  platforms: [windows]
  for: [lnk]
  all:
  - id: micro-behaviors/communications/http/url/path::lnk-remote-pdf-url
  - id: micro-behaviors/process/create/installer::lnk-msiexec-quiet-install
