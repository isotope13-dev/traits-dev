defaults:
  platforms: [windows]
  for: [pe, dll]
  attack: T1036.007

traits:
  - id: business-document-exe-name
    desc: Business-document themed executable filename
    crit: notable
    conf: 0.9
    if:
      type: path
      basename: true
      regex: '(?i)(invoice|inquiry|rfq|quote|order|siparis).{0,20}\.exe$'
  - id: spare-part-exe-name
    desc: Spare-part themed executable filename
    crit: notable
    conf: 0.9
    if:
      type: path
      basename: true
      regex: '(?i)spare[_ -]?part.{0,24}\.exe$'
  - id: quotation-exe-name
    desc: Quotation-themed executable filename
    crit: notable
    conf: 0.9
    if:
      type: path
      basename: true
      regex: '(?i)quotation.{0,24}\.exe$'
  - id: pdf-document-exe-name
    desc: PDF-themed executable filename
    crit: notable
    conf: 0.94
    if:
      type: path
      basename: true
      regex: '(?i)(^|[ _.,-])pdf\.exe$'
  # Document/scan family and the `DOC-`/`DOCUMENT` prefix a mail client shows
  # before the `.exe` the user never sees. Two atoms because a path regex is
  # capped at 64 chars; each is anchored so the theme word must open the name
  # or follow a separator, keeping `mydoc.exe` from a real build out.
  - id: document-scan-exe-name
    desc: Document or scan themed exe filename
    crit: notable
    conf: 0.9
    if:
      type: path
      basename: true
      regex: '(?i)(^|[ _.-])(doc(ument)?|scan|report)[\w ,.+-]{0,30}\.exe$'
  - id: shipping-exe-name
    desc: Shipping or contract themed exe filename
    crit: notable
    conf: 0.9
    if:
      type: path
      basename: true
      regex: '(?i)\b(statement|contract|shipment|receipt)[\w ,.+-]{0,24}\.exe$'

composite_rules:
  - id: unsigned-rmm-business-lure
    desc: Unsigned remote-support binary in business-document lure
    crit: hostile
    conf: 0.99
    attack: "T1036.007,T1219,T1055"
    all:
      - id: business-document-exe-name
      - id: metadata/binary/layout::pe-no-signature-record
      - id: well-known/dual-use/remote-admin/screenconnect::screenconnect-family
      - id: micro-behaviors/os/privilege/token::adjust-token-privileges
    any:
      - id: micro-behaviors/process/inject/runtime/call::get-thread-context-dup
      - id: micro-behaviors/process/inject/runtime/call::set-thread-context-dup
    needs: 1
  - id: pdf-named-keylogger
    desc: PDF-named executable with global keyboard capture
    crit: hostile
    conf: 0.99
    attack: T1036.007,T1056.001
    all:
      - id: pdf-document-exe-name
      - id: objectives/collection/keylog/capture::windows-hook-keyboard-state-window-surveillance
  # A document-named executable delivered inside an archive, that reflectively
  # runs a payload hidden in a bitmap resource. The name is the lure the victim
  # clicks; the stego-loader is what a scanner has to catch after the click.
  # Either alone is weaker — a document-themed name can be a careless build
  # output, and bitmap-stego reflection has narrow legitimate uses — but the
  # pairing is the whole phishing-to-execution chain in one artifact, so the
  # technique keeps matching even when the payload obfuscation is swapped out.
  - id: document-lure-exe-stego-loader
    desc: Document-named exe runs a bitmap-stego payload
    crit: hostile
    conf: 0.97
    attack: T1036.007,T1027.003
    all:
      - id: objectives/anti-static/obfuscation/reflection/invoke::dotnet-bitmap-reflective-payload-execution
    any:
      - id: document-scan-exe-name
      - id: shipping-exe-name

