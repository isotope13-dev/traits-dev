defaults:
  platforms: [windows]
  for: [pe, dll]
  attack: T1036.007

composite_rules:
  - id: unsigned-rmm-business-lure
    desc: Unsigned remote-support binary in business-document lure
    crit: hostile
    conf: 0.99
    attack: "T1036.007,T1219,T1055"
    all:
      - id: metadata/file/naming::business-document-exe-name
      - id: metadata/signed/trust-level::unsigned-missing-signature-record
      - id: well-known/dual-use/remote-admin/screenconnect::screenconnect-family
      - id: micro-behaviors/os/privilege/token::adjust-token-privileges
    any:
      - id: micro-behaviors/process/info/thread::get-thread-context-import
      - id: micro-behaviors/process/info/thread::set-thread-context-import
    needs: 1
  - id: pdf-named-keylogger
    desc: PDF-named executable with global keyboard capture
    crit: hostile
    conf: 0.99
    attack: T1036.007,T1056.001
    all:
      - id: metadata/file/naming::pdf-document-exe-name
      - id: objectives/collection/keylog/hook::windows-hook-keyboard-state-window-surveillance
  # A document-named executable delivered inside an archive, that reflectively
  # runs a payload hidden in a bitmap resource. The name is the lure the victim
  # clicks; the stego-loader is what a scanner has to catch after the click.
  # Either alone is weaker — a document-themed name can be a careless build
  # output, and bitmap-stego reflection has narrow legitimate uses — but the
  # pairing is the whole phishing-to-execution chain in one artifact, so the
  # technique keeps matching even when the payload obfuscation is swapped out.
  - id: document-lure-exe-stego-loader
    desc: Document-named exe runs a bitmap-stego payload
    crit: hostile
    conf: 0.97
    attack: T1036.007,T1027.003
    all:
      - id: metadata/file/naming::document-themed-executable-name
    any:
      - id: objectives/anti-static/obfuscation/reflection/invoke::dotnet-bitmap-reflective-payload-execution
      - id: objectives/command-and-control/dropper/staging/managed::dotnet-bitmap-invokemember-packed-loader
      - id: objectives/command-and-control/dropper/staging/managed::dotnet-bitmap-reflective-activator-loader
      - id: objectives/command-and-control/dropper/staging/managed::dotnet-bitmap-packed-inmemory-stager
      - id: objectives/command-and-control/dropper/staging/managed::dotnet-bitmap-reflective-memory-stage
      - id: objectives/command-and-control/dropper/staging/managed::dotnet-bitmap-pixel-appdomain-stage
      - id: objectives/command-and-control/dropper/staging/managed::stego-bitmap-memory-loader
  # An orders-and-specifications named executable that is a Visual Basic 6
  # program carrying a self-issued publisher signature. Real purchasing
  # paperwork is not an .exe and is not signed by an invented company; the
  # fake signature only exists to make the lure look vetted.
  - id: order-lure-vb6-self-signed-exe
    desc: Order-themed VB6 exe with a self-issued signature
    crit: hostile
    conf: 0.95
    attack: T1036.007,T1553.002
    for: [pe]
    all:
      - id: metadata/file/naming::purchase-order-specification-exe-name
      - id: metadata/binary/framework::vb6-application-framework
      - id: metadata/signed/certificate/chain::pe-cert-leaf-self-issued
  # A .scr is an executable that Windows runs on double-click. Named like a
  # camera photo (IMG_<digits>.scr) it relies on hidden extensions; this one
  # also fetches over WinHTTP, decrypts with BCrypt, and keeps a resource PE.
  - id: image-named-scr-resource-pe-winhttp-aes-loader
    desc: Photo-named .scr with resource PE, WinHTTP and AES
    crit: hostile
    conf: 0.93
    attack: T1036.007,T1204.002,T1105
    for: [pe]
    all:
      - id: metadata/file/naming::image-named-screensaver-exe-name
      - id: micro-behaviors/data/embedded/payload/resource::pe-resource-full-extraction
      - id: micro-behaviors/communications/http/client/winhttp::winhttp-request-flow
      - id: micro-behaviors/crypto/library/cryptoapi::bcrypt-decrypt-api

