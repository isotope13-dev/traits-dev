defaults:
  platforms:
  - windows
  for:
  - pe
  - dll
  attack: T1036.007
  crit: hostile
composite_rules:
- id: unsigned-rmm-business-lure
  desc: Unsigned remote-support binary in business-document lure
  conf: 0.99
  attack: T1036.007,T1219,T1055
  all:
  - id: metadata/filename/name-form::business-document-themed-basename
  - id: metadata/signed/trust-level::unsigned-missing-signature-record
  - id: well-known/dual-use/remote-admin/screenconnect::screenconnect-family
  - id: micro-behaviors/os/privilege/token::adjust-token-privileges
  any:
  - id: micro-behaviors/process/info/thread::get-thread-context-import
  - id: micro-behaviors/process/info/thread::set-thread-context-import
  needs: 1
- id: pdf-named-keylogger
  desc: PDF-named executable with global keyboard capture
  conf: 0.99
  attack: T1036.007,T1056.001
  all:
  - id: metadata/filename/name-form::pdf-document-exe-name
  - id: objectives/collection/keylog/hook::windows-hook-keyboard-state-window-surveillance
- id: order-lure-vb6-self-signed-exe
  desc: Order-themed VB6 exe with a self-issued signature
  conf: 0.95
  attack: T1036.007,T1553.002
  for:
  - pe
  all:
  - id: metadata/filename/name-form::purchase-order-specification-exe-name
  - id: metadata/binary/framework::vb6-application-framework
  - id: metadata/signed/certificate/chain::pe-cert-leaf-self-issued
- id: image-named-scr-resource-pe-winhttp-aes-loader
  desc: Photo-named .scr with resource PE, WinHTTP and AES
  conf: 0.93
  attack: T1036.007,T1204.002,T1105
  for:
  - pe
  all:
  - id: metadata/filename/name-form::image-named-screensaver-exe-name
  - id: micro-behaviors/data/embedded/payload/resource::pe-resource-full-extraction
  - id: micro-behaviors/communications/http/client/winhttp::winhttp-request-flow
  - id: micro-behaviors/crypto/provider/cryptoapi::bcrypt-decrypt-api
