defaults:
  platforms: [windows]
  for: [pe, dll]
  attack: T1036.007

traits:
  - id: business-document-exe-name
    desc: Business-document themed executable filename
    crit: notable
    conf: 0.9
    if:
      type: path
      basename: true
      regex: '(?i)(invoice|inquiry|spare[_ -]?part|rfq).{0,32}\.exe$'

composite_rules:
  - id: unsigned-rmm-business-lure
    desc: Unsigned remote-support binary in business-document lure
    crit: hostile
    conf: 0.99
    attack: "T1036.007,T1219,T1055"
    all:
      - id: business-document-exe-name
      - id: metadata/binary/layout::pe-no-signature-record
      - id: well-known/tool/dual-use/screenconnect::screenconnect-family
      - id: micro-behaviors/os/privilege/token::adjust-token-privileges
    any:
      - id: micro-behaviors/process/inject/runtime/call::get-thread-context-dup
      - id: micro-behaviors/process/inject/runtime/call::set-thread-context-dup
    needs: 1
