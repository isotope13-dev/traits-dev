# An ISO image used as a wrapper around a payload rather than as media.
#
# Mounting an image is how a Windows payload sheds its Mark-of-the-Web: the
# zone identifier lives in an NTFS alternate data stream, and files read out
# of a mounted volume never carry one. That made the ISO the cheapest
# SmartScreen bypass available, and it is why images arriving by mail hold
# one executable and nothing else.
#
# These rules describe the *container*, not the payload — what the payload
# does is settled by its own analysis, which cleave now performs on every
# extracted member.
defaults:
  platforms: [windows]
  for: [iso]
  attack: T1553.005

composite_rules:
  # No mastering tool, at most two members, one of them executable, and that
  # member filling the image. Each part is individually unremarkable; an
  # image that is all four was not built to distribute software.
  - id: iso-single-executable-wrapper
    desc: ISO wraps a single executable and names no mastering tool
    crit: suspicious
    conf: 0.9
    all:
      - id: metadata/file/format/structured::primary-volume-descriptor
      - id: metadata/file/format/iso::no-mastering-tool-identity
      - id: metadata/file/format/iso::sparse-file-tree
      - id: metadata/file/format/iso::single-payload-image
      - id: metadata/file/format/structured::embedded-executable-member

  # An executable reachable through one directory namespace only. ISO 9660
  # and Joliet index the same sectors independently, so a reader that follows
  # the tree the payload is missing from reports a clean image while the
  # mounting OS shows the file.
  - id: iso-namespace-hidden-executable
    desc: ISO hides an executable in a single namespace
    crit: hostile
    conf: 0.95
    attack: T1036,T1553.005
    all:
      - id: metadata/file/format/structured::primary-volume-descriptor
      - id: metadata/file/format/iso::namespace-only-member
      - id: metadata/file/format/structured::embedded-executable-member

  # A shortcut plus space outside the file tree. The LNK-in-ISO chain is the
  # dominant post-macro delivery shape, and the stage it launches is often
  # parked where a directory listing does not reach.
  - id: iso-shortcut-with-unlisted-payload
    desc: ISO pairs a shortcut with content outside its file tree
    crit: hostile
    conf: 0.95
    attack: T1204.002,T1553.005
    all:
      - id: metadata/file/format/structured::primary-volume-descriptor
      - id: metadata/file/format/structured::embedded-lnk-member
      - id: metadata/file/format/iso::payload-outside-file-tree
