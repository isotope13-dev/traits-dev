defaults:
  platforms: [unix, windows]

composite_rules:
  - id: rar-ads-traversal-pdf-lure
    desc: RAR ADS traversal hides behind a PDF
    scope: file
    crit: hostile
    conf: 0.95
    attack: T1036.003
    for: [rar]
    all:
      - id: micro-behaviors/data/archive/rar::rar-ntfs-stream-member
      - id: micro-behaviors/data/archive/rar::pdf-member-extension
