defaults:
  platforms: [unix, windows]
  for: [7z, zip, tar, rar, cab]
  crit: hostile
  conf: 0.95
  attack: T1036.008,T1553.005,T1204.002
  mbc: B0007

composite_rules:
  - id: archive-pdf-disk-image-lure
    desc: Archive delivers a PDF-named disk image lure
    scope: outer
    all:
      - id: metadata/archive/member/filename::archive-pdf-disk-image-member
    any:
      - id: metadata/archive/member/size::member-at-least-10mb
      - id: metadata/archive/layout::archive-sole-member
    unless:
      - id: metadata/package/manager::go-module-source-archive
      - id: metadata/package/testing/
      - id: metadata/archive/layout::recognized-package-executable-context
      - id: well-known/app/productivity/winmerge::winmerge-full-source-archive-path
      - id: metadata/path::test-directory-component
