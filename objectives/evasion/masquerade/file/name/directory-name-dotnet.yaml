defaults:
  platforms: [windows]
composite_rules:
  - id: dotnet-directory-name-exe-launch
    desc: .NET launcher with directory-like .exe name
    crit: suspicious
    conf: 0.93
    attack: T1036.005
    for: [pe, dll]
    all:
      - id: micro-behaviors/fs/path/system/library::mscoree-dll-name
      - id: micro-behaviors/process/config/launch::dotnet-process-start-and-config-references
      - id: micro-behaviors/process/info/selfpath::dotnet-application-startup-path
      - id: micro-behaviors/fs/path/basename::path-directory-name-exe
