defaults:
  platforms: [windows]
  mbc: T1036
  attack: T1036
composite_rules:
  # Require a real CLR header — MSVC CRT stubs emit mscoree.dll /
  # CorExitProcess in ordinary native PE launchers (including stock java.exe),
  # which is not .NET and must not count as Java masquerade.
  - id: dotnet-java-spoof
    desc: ".NET executable masquerading as Java binary"
    crit: hostile
    conf: 0.95
    for: [pe]
    all:
      - id: metadata/binary/framework::clr-runtime-header
    any:
      - id: metadata/vendor/string::java-platform-string
      - id: metadata/vendor/string::oracle-america-string
  - id: dotnet-source-java-spoof
    desc: ".NET source masquerading as Java binary"
    crit: suspicious
    conf: 0.90
    for: [csharp]
    any:
      - id: metadata/vendor/string::java-platform-string
      - id: metadata/vendor/string::oracle-america-string
