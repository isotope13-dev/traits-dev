# Drop names that impersonate the Windows Search host. The legitimate
# binary is SearchHost.exe; SearchSystemHost.exe and SearchUserHost.exe do
# not exist on stock Windows. The System/User infix borrows authority while
# dodging an exact-match allowlist for the real name, so the matcher names
# the impersonating variants only and never the legitimate binary.
defaults:
  platforms: [windows]
  for: [binaries]
  crit: notable
  conf: 0.92

traits:
  - id: search-host-impersonating-name
    desc: Executable name impersonates SearchHost
    if:
      type: text
      regex: '(?i)Search(System|User|Admin)Host\.exe'
