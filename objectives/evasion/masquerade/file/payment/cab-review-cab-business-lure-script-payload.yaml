defaults:
  platforms: [windows]
  for: [cab, msi, oledoc]

composite_rules:
- id: cab-business-lure-script-payload
  desc: Cabinet delivers business-lure script
  crit: hostile
  conf: 0.96
  platforms: [windows, macos, android]
  for: [cab, binaries, zip, xpi, apk, data, msi, oledoc]
  all:
    - id: metadata/file/format/structured::cab-container-format
    - id: metadata/archive/layout::archive-sole-member
  any:
    - id: metadata/archive/member/filename/lure::cab-lure-script-member-a
    - id: metadata/archive/member/filename/lure::cab-lure-script-member-b
    - id: metadata/archive/member/filename/lure::cab-lure-script-member-c
  unless:
    - id: metadata/signature/verified/platform/
    - id: well-known/dual-use/remote-admin/screenconnect/installer::msi-screenconnect-installer
    - id: metadata/archive/layout::archive-uncompressed-size-zero

