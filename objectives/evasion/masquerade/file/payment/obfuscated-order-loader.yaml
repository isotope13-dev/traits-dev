defaults:
  for: [pe]
  platforms: [windows]

composite_rules:
  - id: order-lure-obfuscated-resource-loader
    desc: Order-lure executable with obfuscated loader
    crit: hostile
    conf: 0.97
    attack: T1036.005,T1027
    all:
      - id: metadata/filename/document-theme::purchase-order-number-executable-name
      - id: objectives/anti-static/obfuscation/anti-decompile::zero-width-reflective-resource-loader
      - id: micro-behaviors/process/debug/detect::dotnet-debugger-attachment-references
