    - id: remittance-exe-lure
    - id: fatura-exe-lure
    - id: signature-plan-exe-lure
    - id: appendix-form-exe-lure
    - id: metadata/filename/name-form::purchase-order-number-executable-name
    - id: proof-of-payment-exe-lure
    - id: transfer-document-exe-lure
    - id: metadata/filename/name-form::quotation-exe-name
- id: business-lure-nsis-payload
  desc: Business-lure NSIS executable payload
