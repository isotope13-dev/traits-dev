# A SWIFT payment-advice document name on an unsigned .NET payload that
# declares a different OriginalFilename and ships packed throughout is the
# malspam loader shape: banks distribute payment advice as documents, never
# as unsigned executables that disown their own filename. Ordinary renames
# keep the declared identity; ordinary packed .NET tools are not named after
# bank documents. The packing bar is the family-wide overall-entropy-78
# threshold: a file dominated by
# compressed payload. A readable managed application that merely embeds
# compressed data (rich string table, entropy in the 7.5-7.8 band) is a
# renamed program, not a packed loader. The platform-signature exclusion
# keeps signed vendor tooling out.
- id: swift-advice-unsigned-renamed-packed-payload
  desc: SWIFT-advice lure hides an unsigned renamed packed payload
  crit: hostile
  conf: 0.96
  attack: T1036.005,T1027
  all:
    - id: swift-advice-exe-lure
    - id: metadata/binary/provenance/version-info::pe-original-filename-mismatch
    - id: metadata/signed/trust-level::unsigned-missing-signature-record
    - id: metadata/file/entropy::overall-entropy-78
  unless:
    - id: metadata/signed/platform/

# Payment-themed basename on an unsigned MyApplication-template .NET assembly
# that loads managed resources after Base64 decode — ISO/email "Proof of
# Payment" droppers. Uses payment-specific lure atoms only (not the broader
# payment-document umbrella, which also folds in shipping AWB names). Includes
# the ISO-9660 8.3 shortname atom so container-extracted children still match.
- id: payment-lure-dotnet-template-loader
  desc: Payment-lure unsigned .NET template loader
  crit: hostile
  conf: 0.98
  attack: T1036.005,T1036.007,T1027.009,T1620
  all:
    - id: metadata/build/manifest::pe-manifest-myapplication-template
    - id: metadata/binary/framework::dotnet-assembly
    - id: metadata/signed/trust-level::unsigned-missing-signature-record
    - id: metadata/binary/provenance/version-info::pe-basename-differs-from-original-filename
    - id: micro-behaviors/data/embedded/payload/resource::dotnet-managed-resource-access
    - id: micro-behaviors/data/decode/base64::dotnet-frombase64string-text
  any:
    - id: proof-of-payment-exe-lure
    - id: proof-of-shortname-exe-lure
    - id: payment-receipt-exe-lure
    - id: payment-advice-exe-lure
    - id: payment-advice-com-lure
    - id: payment-details-exe-lure
    - id: payment-invoice-exe-lure
    - id: payment-balance-exe-lure
    - id: remittance-exe-lure
  needs: 1
  unless:
    - id: metadata/signed/platform/

# A business-document filename paired with the bitmap-backed reflective loader
# is a stronger signal than either the lure or loader alone. Keep this broad
# across PO, invoice, remittance, and related executable lures while requiring
# the packed unsigned .NET payload shape.
- id: business-lure-dotnet-bitmap-loader
  desc: Business-lure unsigned .NET bitmap loader
  crit: hostile
  conf: 0.99
  attack: T1036.005,T1027.003,T1620,T1204.002
  all:
    - id: metadata/path::document-themed-executable-name
    - id: metadata/binary/framework::dotnet-assembly
    - id: metadata/signed/trust-level::unsigned-missing-signature-record
    - id: metadata/binary/provenance/version-info::pe-basename-differs-from-original-filename
    - id: metadata/binary/resource/entropy::clr-resource-size-and-entropy
    - id: micro-behaviors/ui/graphics/image::dotnet-bitmap-resource-pixel-api-references
    - id: micro-behaviors/metaprogramming/reflection::activator
    - id: micro-behaviors/metaprogramming/reflection::invoke-member-token
    - id: micro-behaviors/process/create/compile::codedom-compiler
  unless:
    - id: metadata/signed/platform/
