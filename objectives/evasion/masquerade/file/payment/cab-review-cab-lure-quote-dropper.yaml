defaults:
  platforms: [windows]
  for: [cab, pe, msi, oledoc]
  conf: 0.94
  attack: T1027.013,T1204.002

composite_rules:
- id: cab-lure-quote-dropper
  crit: hostile
  desc: Cabinet wraps a quote-lure executable
  scope: outer
  all:
    - id: metadata/file/format/structured::cab-container-format
    - id: metadata/archive/layout::archive-misplaced-executable-member
    - id: objectives/evasion/masquerade/file/payment::quote-exe-lure
  unless:
    - id: metadata/signature/verified/platform/
    - id: well-known/dual-use/remote-admin/screenconnect/installer::msi-screenconnect-installer

