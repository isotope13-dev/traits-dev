defaults:
  platforms: [windows]
  for: [cab, pe, msi, oledoc]
  conf: 0.94
  attack: T1027.013,T1204.002

composite_rules:
- id: cab-lure-name-exe
  crit: hostile
  desc: Cabinet wraps a lure-named executable
  scope: outer
  all:
    - id: metadata/archive/layout::archive-misplaced-executable-member
    - id: metadata/archive/profile/executable::cab-business-themed-member-name
  unless:
    - id: metadata/signature/verified/platform/
    - id: well-known/dual-use/remote-admin/screenconnect/installer::msi-screenconnect-installer

