defaults:
  platforms: [windows, macos, android]

composite_rules:
- id: cab-empty-business-lure-exe
  crit: suspicious
  desc: Empty cabinet with business-themed EXE name
  conf: 0.93
  attack: T1036,T1204.002
  all:
  - id: metadata/file/format/structured::cab-container-format
  - id: metadata/archive/layout::archive-sole-member
  - id: metadata/archive/member/extension::archive-windows-executable-entry
  - id: metadata/archive/layout::archive-uncompressed-size-zero
  any:
  - id: metadata/archive/profile/executable::cab-business-lure-exe-member
  unless:
  - id: metadata/signature/verified/platform/
  - id: well-known/dual-use/remote-admin/screenconnect/installer::msi-screenconnect-installer
