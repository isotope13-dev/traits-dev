defaults:
  platforms: [windows]
  for: [cab, pe]
  conf: 0.94

composite_rules:
  - id: archive-doc-pif-png-clues
    desc: Document-named PIF member and PNG clues
    scope: archive
    all:
      - id: metadata/archive/member/filename/shape::archive-docx-pif-member
      - id: metadata/file/magic/numbers::png-magic-in-text-section
    unless:
      - id: metadata/signature/verified/platform/

    crit: suspicious
  - id: archive-pif-double-extension-clues
    desc: PIF archive member and double-extension name
    scope: archive
    all:
      - id: metadata/archive/member/extension::archive-pif-member
      - id: objectives/evasion/masquerade/file/double-ext::basename-is-doc-double-pif
    unless:
      - id: metadata/signature/verified/platform/

    crit: suspicious
