defaults:
  platforms: [windows]
  for: [batch, powershell, javascript, vbs, html]
traits:
  - id: office-double-extension-wsh-script
    desc: Office document double-extension WSH script
    crit: suspicious
    conf: 0.97
    attack: T1036.007
    for: [vbs, html]
    if:
      type: basename
      regex: '(?i)\.(doc|xls|ppt)x?\.(vbs|wsf)$'

  - id: pdf-double-extension-script
    desc: PDF double extension script name
    crit: suspicious
    conf: 0.92
    for: [batch, powershell]
    if:
      type: path
      basename: true
      regex: '(?i)\.pdf\.(bat|cmd|ps1)$'
composite_rules: []
