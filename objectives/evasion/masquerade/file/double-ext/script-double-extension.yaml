defaults:
  crit: suspicious
  platforms: [windows]
  for: [batch, powershell, javascript, vbs, html]
traits:
  - id: office-double-extension-wsh-script
    desc: Office document double-extension WSH script
    conf: 0.97
    attack: T1036.007
    for: [vbs, html]
    if:
      type: basename
      regex: '(?i)\.(doc|xls|ppt)x?[\s\u00a0]*\.(vbs|wsf)$'

  - id: pdf-double-extension-script
    desc: PDF double extension script name
    conf: 0.92
    if:
      type: path
      basename: true
      regex: '(?i)\.pdf[\s\u00a0]*\.(bat|cmd|ps1|hta|vbs|wsf|js)$'
composite_rules:
  - id: office-double-ext-wsh-run
    desc: Office double-extension script executes a command
    crit: hostile
    conf: 0.99
    attack: T1036.007,T1204.002,T1059.005
    for: [vbs]
    all:
      - id: office-double-extension-wsh-script
      - id: micro-behaviors/process/create/shell/script-host::wscript-shell-run

  - id: pdf-double-ext-hidden-hta
    desc: PDF double-extension HTA conceals window
    crit: hostile
    conf: 0.98
    attack: T1036.007,T1218.005,T1564.003
    for: [html]
    all:
      - id: pdf-double-extension-script
      - id: micro-behaviors/ui/window/control::hta-hidden-or-minimized-window-request

  - id: pdf-double-ext-obfuscated-script
    desc: PDF double-extension obfuscated script dropper
    crit: hostile
    conf: 0.99
    attack: T1036.007,T1027.002,T1059.007
    mbc: B0032
    for: [javascript, vbs]
    all:
      - id: pdf-double-extension-script
    any:
      - id: objectives/anti-static/obfuscation/obfuscator/js-obfuscator::plain-javascript-obfuscator-string-array-runtime
      - id: objectives/anti-static/obfuscation/obfuscator/js-obfuscator::javascript-obfuscator-string-array-runtime
      - id: objectives/anti-static/obfuscation/obfuscator/js-obfuscator::any-name-mangling
      - id: objectives/anti-static/obfuscation/name-mangling/variables::js-random-named-functions
