defaults:
  crit: suspicious
  platforms: [windows]
  for: [batch, powershell, javascript, vbs, html]
traits:
  - id: office-double-extension-wsh-script
    desc: Office document double-extension WSH script
    conf: 0.97
    attack: T1036.007
    for: [vbs, html]
    if:
      type: basename
      regex: '(?i)\.(doc|xls|ppt)x?[\s\u00a0]*\.(vbs|wsf)$'

composite_rules:
  - id: office-double-ext-wsh-run
    desc: Office double-extension script executes a command
    crit: hostile
    conf: 0.99
    attack: T1036.007,T1204.002,T1059.005
    for: [vbs]
    all:
      - id: office-double-extension-wsh-script
      - id: micro-behaviors/process/create/shell/interpreter::wsh-progid-near-run

  - id: pdf-double-ext-hidden-hta
    desc: PDF double-extension HTA conceals window
    crit: hostile
    conf: 0.98
    attack: T1036.007,T1218.005,T1564.003
    for: [html]
    all:
      - id: metadata/file/extension/executable::pdf-double-extension-script
      - id: micro-behaviors/ui/window/control::hta-hidden-or-minimized-window-request

  # The name passes for a PDF while the content is a script host page that
  # starts PowerShell hidden with an encoded command. Static co-occurrence of
  # the name and the launch; the decoded command is checked by its own traits.
  - id: pdf-double-ext-hidden-encoded-powershell
    desc: PDF-named script launches hidden encoded PowerShell
    crit: hostile
    conf: 0.97
    attack: T1036.007,T1059.001,T1564.003
    for: [html]
    all:
      - id: metadata/file/extension/executable::pdf-double-extension-script
      - id: objectives/execution/interpreter/vbscript/loader::html-vbscript-hidden-encoded-powershell-launch
