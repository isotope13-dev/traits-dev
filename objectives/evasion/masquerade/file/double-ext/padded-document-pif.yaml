defaults:
  platforms: [windows]
  for: [pe]
  attack: T1036.007

traits:
  - id: padded-document-pif-executable
    desc: PE disguises PIF as document with padding
    crit: hostile
    conf: 0.98
    if:
      type: path
      basename: true
      regex: '(?i)\.(txt|pdf|docx?|xlsx?|rtf)[[:space:]]{8,}\.pif$'
