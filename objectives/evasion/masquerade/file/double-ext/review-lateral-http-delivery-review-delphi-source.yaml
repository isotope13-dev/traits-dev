defaults:
  for: [c]
  platforms: [windows]


composite_rules:
  - id: delphi-http-selfcopy-double-extension
    desc: Delphi HTTP self-copy with jpg.exe name
    crit: hostile
    conf: 0.97
    all:
      - id: micro-behaviors/fs/file/copy/call::delphi-self-copy-paramstr0
      - id: objectives/evasion/masquerade/extension/double::delphi-jpg-exe-name-construction
      - id: micro-behaviors/communications/http/header/content-type::delphi-executable-content-type
    any:
      - id: micro-behaviors/ui/window/navigation/refresh::delphi-meta-refresh-filename
      - id: micro-behaviors/process/thread/create::delphi-readsock-thread-creation
