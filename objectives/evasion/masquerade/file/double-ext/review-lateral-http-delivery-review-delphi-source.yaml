defaults:
  for: [c]
  platforms: [windows]


composite_rules:
  - id: delphi-http-selfcopy-double-extension
    desc: Delphi HTTP self-copy with jpg.exe name
    crit: hostile
    conf: 0.97
    all:
      - id: metadata/file/profile/network-context/activity::delphi-self-copy-paramstr0
      - id: metadata/file/profile/network-context/activity::delphi-jpg-exe-name-construction
      - id: metadata/file/profile/network-context/activity::delphi-executable-content-type
    any:
      - id: metadata/file/profile/network-context/activity::delphi-meta-refresh-filename
      - id: metadata/file/profile/network-context/activity::delphi-readsock-thread-creation
