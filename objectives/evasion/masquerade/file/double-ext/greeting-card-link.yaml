defaults:
  platforms: [windows, unix]
  for: [html]
  crit: suspicious
  conf: 0.98

traits:
  - id: image-suffixed-executable-hyperlink
    desc: Hyperlink uses image-plus-EXE suffix
    if:
      type: text
      regex: '(?i)href=["'']https?://[^"''\s]{1,160}\.(gif|jpe?g|png)\.exe["'']'
      exclude_html_comments: true

composite_rules:
  - id: greeting-card-image-executable-disguise
    desc: Greeting-card lure masks EXE with image suffix
    crit: hostile
    all:
      - id: image-suffixed-executable-hyperlink
      - id: micro-behaviors/ui/dialog/prompt::greeting-card-pickup-notice
