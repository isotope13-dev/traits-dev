defaults:
  platforms: [windows]
  for: [text]

composite_rules:
- id: document-url-shortcut-nul-run
  desc: Document-named shortcut with NUL run
  crit: suspicious
  conf: 0.95
  attack: T1036.008,T1027.001
  all:
    - id: metadata/file/format/structured::windows-internet-shortcut-header
    - id: objectives/evasion/masquerade/file/double-ext::document-extension-url-shortcut-name
    - id: metadata/file/text-distribution::large-file-sixteen-nul-bytes

