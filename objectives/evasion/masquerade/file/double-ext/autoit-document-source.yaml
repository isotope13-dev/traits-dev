# Apply to recovered AutoIt source, not the interpreter's built-in API table.
# No selected output name, source identifier or campaign token is required.
# HideFileExt is the platform-defined Explorer policy value.
defaults:
  platforms: [windows]
  for: [data, text, vbs]
  attack: T1036.007
traits:
  - id: autoit-document-executable-replacement-source
    desc: Document executable copies hide original files
    crit: suspicious
    conf: 0.98
    if:
      type: yara
      source: |
        rule autoit_document_executable_replacement_source {
          strings:
            $doc = /If[^\r\n]{1,80}=[ \t]*"\.doc"/ nocase
            $copy = /FileCopy[ \t]*\([^\r\n]{1,180}"\.exe"[^\r\n]{1,180}"\.exe"/ nocase
            $move = /FileMove[ \t]*\([^\r\n]{1,180}StringLeft[^\r\n]{1,100}"\.[a-z]{3}"/ nocase
            $hide = /FileSetAttrib[ \t]*\([^\r\n]{1,180}StringLeft[^\r\n]{1,100}"\+RASH"/ nocase
            $extensions = /RegWrite[^\r\n]{1,220}"HideFileExt"[^\r\n]{1,40}"1"/ nocase
          condition:
            all of them and
            for any d in (1..#doc) : (
              for any c in (1..#copy) : (
                @copy[c] > @doc[d] and @copy[c]-@doc[d] < 512 and
                for any m in (1..#move) : (
                  @move[m] > @copy[c] and @move[m]-@copy[c] < 1024 and
                  for any h in (1..#hide) : (
                    @hide[h] > @move[m] and @hide[h]-@move[m] < 512
                  )
                )
              )
            )
        }
composite_rules:
  - id: autoit-document-self-copy-lures
    desc: Self-copies disguise executables as documents
    crit: hostile
    conf: 0.99
    all:
      - id: autoit-document-executable-replacement-source
      - id: micro-behaviors/fs/file/copy::autoit-running-image-copy-source
