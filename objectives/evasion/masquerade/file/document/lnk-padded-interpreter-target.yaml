defaults:
  platforms: [windows]
  for: [lnk]

traits:
  - id: lnk-shell-image-with-trailing-padding
    desc: Shortcut pads shell executable basename
    crit: notable
    conf: 0.96
    if:
      type: value
      path: lnk.target_path
      regex: '(?i)(^|[\\/])(powershell|pwsh|cmd)\.exe[. ]+$'

  - id: lnk-inline-command-option
    desc: Shortcut supplies an inline command option
    crit: component
    conf: 0.96
    if:
      type: value
      path: lnk.arguments
      regex: '(?i)^\s*[-/](c|command)\s+\S'

composite_rules:
  - id: lnk-browser-disguised-padded-command
    desc: Browser-icon shortcut uses a padded shell target to run inline commands
    crit: hostile
    conf: 0.97
    attack: T1036.007,T1059,T1204.002
    all:
      - id: lnk-shell-image-with-trailing-padding
      - id: lnk-inline-command-option
      - id: micro-behaviors/ui/graphics/icon::lnk-browser-icon
