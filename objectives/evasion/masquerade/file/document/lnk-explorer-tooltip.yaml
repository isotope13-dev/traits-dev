# Windows shortcuts spoofing Windows Explorer's multi-line document infotip
# ("Type: Hangul Document / Size: 2.84 KB / Date modified: ...") inside the
# LNK NameString (description) field while launching a command/script interpreter.
defaults:
  platforms: [windows]
  for: [lnk]
  attack: T1036.005
  mbc: F0008

traits:
  - id: lnk-desc-type-document-line
    desc: LNK description has Explorer Type field
    crit: notable
    conf: 0.9
    if:
      type: value
      path: lnk.description
      regex: '(?i)Type:\s*[^\r\n]{2,50}\b(Document|Worksheet|Spreadsheet|PDF|File)\b'

  - id: lnk-desc-size-modified-line
    desc: LNK description has Size and Date fields
    crit: notable
    conf: 0.92
    if:
      type: value
      path: lnk.description
      regex: '(?is)Size:\s*\d+(\.\d+)?\s*[KMGT]?B\b[\r\n]+Date\s+modified:'

  - id: lnk-raw-type-document-line
    desc: Shortcut bytes contain Explorer Type line
    crit: notable
    conf: 0.9
    if:
      type: raw
      regex: '(?i)Type:\s*[^\r\n]{2,50}\b(Document|Worksheet|Spreadsheet|PDF|File)\b'

  - id: lnk-raw-size-modified-line
    desc: Shortcut bytes contain Size and Date lines
    crit: notable
    conf: 0.92
    if:
      type: raw
      regex: '(?is)Size:\s*\d+(\.\d+)?\s*[KMGT]?B\b[\r\n]+Date\s+modified:\s*\d'

composite_rules:
  - id: lnk-description-document-infotip
    desc: LNK description mimics Explorer tooltip
    crit: suspicious
    conf: 0.95
    all:
      - id: lnk-desc-type-document-line
      - id: lnk-desc-size-modified-line

  - id: lnk-transcoded-document-infotip
    desc: Transcoded LNK spoofs Explorer tooltip
    crit: suspicious
    conf: 0.95
    near_bytes: 160
    all:
      - id: lnk-raw-type-document-line
      - id: lnk-raw-size-modified-line

  - id: lnk-spoofed-explorer-document-tooltip
    desc: Shortcut spoofs an Explorer document tooltip
    crit: suspicious
    conf: 0.95
    any:
      - id: lnk-description-document-infotip
      - id: lnk-transcoded-document-infotip

  - id: lnk-document-tooltip-interpreter-masquerade
    desc: Shortcut spoofs document tooltip for interpreter
    crit: hostile
    conf: 0.98
    attack: T1036.005,T1204.002
    all:
      - id: lnk-spoofed-explorer-document-tooltip
    any:
      - id: micro-behaviors/process/config/target::lnk-interpreter-target-with-arguments
      - id: micro-behaviors/process/config/target::lnk-lolbin-target
      - id: micro-behaviors/process/argument/interpreter::lnk-powershell-executable-reference
      - id: micro-behaviors/fs/path/executable::lnk-wscript-path-text
