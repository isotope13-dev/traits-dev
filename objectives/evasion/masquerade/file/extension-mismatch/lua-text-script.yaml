# A launcher hands a Lua interpreter a script file named like plain text
# (`luajit.exe uix.txt`). Lua runs any file it is given; the .txt/.log/.cfg
# name exists so the script reads as an inert text file to a user browsing
# the folder or a scanner keyed on extensions. Seen in the FakeGit GitHub
# campaign, where a .cmd starts a bundled LuaJIT on an obfuscated "txt".
defaults:
  platforms: [windows]
  for: [batch, powershell]
  attack: T1036.008

traits:
  - id: lua-interpreter-runs-text-named-script
    desc: Lua interpreter runs a text-named script
    crit: suspicious
    conf: 0.92
    if:
      type: text
      regex: '(?i)\blua(jit|5[0-9])?(\.exe)?"?\s+"?[^\s"&|]{1,80}\.(txt|log|cfg|ini)\b'
