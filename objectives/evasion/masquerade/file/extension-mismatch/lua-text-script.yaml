# A launcher hands a Lua interpreter a script file named like plain text
# (`luajit.exe uix.txt`). Lua runs any file it is given; the .txt/.log/.cfg
# name exists so the script reads as an inert text file to a user browsing
# the folder or a scanner keyed on extensions. Seen in the FakeGit GitHub
# campaign, where a .cmd starts a bundled LuaJIT on an obfuscated "txt".
defaults:
  platforms: [windows]
  for: [batch, powershell]
  attack: T1036.008

traits:
  - id: lua-interpreter-runs-text-named-script
    desc: Lua interpreter runs a text-named script
    crit: suspicious
    conf: 0.92
    if:
      type: text
      # A dot before lua is a script extension (`tool.lua data.txt`), not the
      # interpreter. The command word itself still has to be lua/luajit.
      regex: '(?i)(^|[\s&|"''])lua(jit|5[0-9])?(\.exe)?"?\s+"?[^\s"&|]{1,80}\.(txt|log|cfg|ini)\b'

composite_rules:
  # The FakeGit entry point: a batch file whose only job is to START a
  # bundled Lua interpreter on a text-named script. START adds the detached
  # launch role to the masquerade atom above; neither leg alone claims the
  # launcher pattern. Legitimate use (a harness running Lua fixtures named
  # .txt) remains plausible, so this stays suspicious, not hostile: the
  # payload file itself carries the hostile behavior, not this launch line.
  - id: batch-starts-text-named-lua-script
    desc: Batch START launches text-named Lua script
    crit: suspicious
    conf: 0.95
    attack: T1059.003,T1036.008
    for: [batch]
    all:
      - id: lua-interpreter-runs-text-named-script
      - id: micro-behaviors/process/create/shell/command-mode::batch-starts-lua-script
