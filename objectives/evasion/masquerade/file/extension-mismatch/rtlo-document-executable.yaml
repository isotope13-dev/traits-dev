defaults:
  platforms: [windows]
  for: [pe]

traits:
  - id: rtlo-document-disguised-executable
    desc: RTLO disguises executable as document
    crit: hostile
    conf: 0.98
    attack: T1036.002
    if:
      type: path
      basename: true
      regex: '(?i)\x{202e}(fdp|xcod|cod|slx|xslx|txt)\.{1,2}(exe|scr|pif|com)$'
