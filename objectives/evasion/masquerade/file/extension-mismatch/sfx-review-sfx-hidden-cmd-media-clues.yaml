defaults:
  platforms: [windows]
  for: [pe]

composite_rules:
- id: sfx-hidden-cmd-media-clues
  desc: SFX hidden command and media-name clues
  crit: hostile
  conf: 0.99
  attack: "T1204.002, T1059.003, T1036.008"
  mbc: "B0023, E1059"
  all:
    - id: micro-behaviors/process/config/installer::sfx-runprogram-directive
    - id: micro-behaviors/process/config/window::sfx-hidcon-prefix
    - id: micro-behaviors/process/create/shell/reference::cmd-command-and-createprocess-references
    - id: micro-behaviors/process/config/launch::sfx-hidden-cmd-stdin
    - id: micro-behaviors/fs/path/media::sfx-video-extension-stdin
    - id: micro-behaviors/fs/path/media::sfx-media-named-entry
