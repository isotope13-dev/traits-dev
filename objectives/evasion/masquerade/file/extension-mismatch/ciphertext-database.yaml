defaults:
  platforms: [unix, windows]
  for: [data, text]

composite_rules:
  - id: openssl-ciphertext-named-database
    desc: Database-named file contains OpenSSL ciphertext
    crit: suspicious
    conf: 0.96
    attack: T1036
    all:
      - id: metadata/file/encoding/base64::openssl-salted-base64-ciphertext-file
      - id: metadata/file/extension/mismatch::database-filename-on-data
