defaults:
  platforms: [windows, unix]
  for: [javascript, html]
  attack: T1036.005
  mbc: F0004

composite_rules:
  - id: mismatched-extension-self-decoding-loader
    for: [javascript]
    desc: Mismatched extension self-decoding loader
    crit: hostile
    conf: 0.97
    ref: sha256:2e95c6a1842b99a4045e973126f1b16261cb8f0b89ee9e7c618a6e4d0746d7fd
    all:
      - id: metadata/file/extension/identity::script-content-extension-mismatch
      - id: objectives/anti-static/obfuscation/syntax::browser-base64-xor-document-rewrite-loader

  - id: batch-mismatched-extension-self-read-dropper
    for: [batch]
    desc: Batch disguised as other extension reconstructs self-payload
    crit: hostile
    conf: 0.98
    attack: T1036.005,T1027,T1059.003
    mbc: F0004,B0032
    all:
      - id: metadata/file/extension/mismatch::batch-content-extension-mismatch
      - id: objectives/anti-static/obfuscation/eval/powershell-loader::ps-format-string-readalllines
      - id: micro-behaviors/data/format/script::embedded-batch-delayed-expansion
