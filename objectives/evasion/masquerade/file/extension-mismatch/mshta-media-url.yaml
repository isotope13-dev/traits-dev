# MSHTA is pointed at a URL whose path ends in an audio extension. MSHTA
# executes the returned document as an HTA whatever the extension says; the
# .mp3/.ogg name exists to make the request look like media to proxies and
# reviewers.
defaults:
  platforms: [windows]
  for: [vbs, batch, powershell, javascript]
  attack: T1036.008,T1218.005

composite_rules:
  - id: mshta-fetches-audio-named-url
    desc: MSHTA runs an audio-named URL
    crit: hostile
    conf: 0.95
    near_bytes: 200
    all:
      - id: metadata/lang/source/syntax/command/launch::mshta-remote-url-command
      - id: micro-behaviors/communications/url/resource-path/media::compressed-audio-file-url
