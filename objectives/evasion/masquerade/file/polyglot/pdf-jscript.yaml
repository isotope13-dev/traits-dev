# JScript carriers that lead with a PDF magic block comment so viewers and
# mail filters treat the attachment as a document while cscript/wscript still
# execute the trailing script body.
defaults:
  platforms: [windows]
  for: [javascript]
  attack: T1036.005,T1027.006

traits:
  - id: pdf-comment-magic-jscript-prefix
    desc: PDF magic in block comment on JScript
    crit: notable
    conf: 0.96
    if:
      type: text
      regex: '^\s*/\*%PDF-'

composite_rules:
  - id: pdf-comment-jscript-wmi-powershell-dropper
    desc: PDF-comment JScript WMI PowerShell dropper
    crit: hostile
    conf: 0.98
    attack: T1036.005,T1047,T1059.001,T1564.003
    all:
      - id: pdf-comment-magic-jscript-prefix
      - id: objectives/execution/wmi::wmi-headless-conhost-powershell-spawn
