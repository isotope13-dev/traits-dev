# JPEG/PNG + phar polyglot: valid image headers in front of a PHP stub that
# ends the way PHP's phar reader requires. The file survives image validation
# (magic bytes, getimagesize()) on upload and is then opened through phar://,
# which unserializes its metadata. Both legs are content: PHP code in the
# media and the phar stub terminator after it.
defaults:
  platforms: [windows, unix]
  for: [jpeg, png]
  attack: T1036.008,T1027.009,T1190

composite_rules:
  - id: image-phar-polyglot
    desc: Image doubles as a PHP archive
    crit: suspicious
    conf: 0.97
    all:
      - id: micro-behaviors/data/embedded/payload/media::php-open-tag-in-media
      - id: micro-behaviors/data/embedded/payload/media::phar-stub-terminator-in-media
