defaults:
  platforms: [windows]
  for: [html]
traits:
  - id: html-batch-polyglot-header
    desc: Leading HTML tag on batch script
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: '(?i)^\s*<html\b[^>]{0,100}>\s*@?(if|for|echo|rem|goto|set|find)\b'

composite_rules:
  - id: html-batch-polyglot-script-infector
    desc: HTML tag prefix conceals a self-replicating batch infector
    crit: hostile
    conf: 0.98
    attack: T1036.008,T1080
    all:
      - id: html-batch-polyglot-header
      - id: micro-behaviors/fs/read/self::batch-own-script-data-input
