# A small RTF prefix can replace a GZIP stream's signature and timestamp while
# leaving its XFL/OS fields, DEFLATE body, CRC32 and ISIZE trailer in place.
# Document tools see a complete empty RTF; restoring the GZIP header recovers
# the concealed stream.
defaults:
  platforms: [windows]
  for: [rtf]

composite_rules:
  - id: closed-rtf-masks-gzip-stream
    desc: Closed RTF prefix masks a GZIP stream
    crit: hostile
    conf: 0.99
    attack: T1036.008
    all:
      - id: metadata/document/rtf/structure::root-closes-immediately-after-header
      - id: metadata/document/rtf/structure::gzip-header-tail-before-deflate
      - id: objectives/anti-static/obfuscation/document/rtf::rtf-body-is-not-a-document
