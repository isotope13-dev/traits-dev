defaults:
  platforms: [unix, windows]
  for: [gif, text]
  crit: suspicious
composite_rules:
  - id: image-marked-user-ini-preload
    desc: PHP preload configuration has GIF header
    conf: 0.99
    all:
      - id: metadata/file/magic/identity::gif-magic-header
      - id: metadata/filename/identity::userini-config-basename
      - id: micro-behaviors/communications/http/server/config::image-marked-php-prepend-directive
