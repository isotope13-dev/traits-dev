defaults:
  platforms:
  - windows
  - unix
  for:
  - dos_com
  - data
  size_max: 65536
  conf: 0.98
traits:
- id: dos-entry-extension-to-dta-companion
  desc: Copies entry COM extension into DTA name
  crit: notable
  if:
    type: hex
    pattern: 43 4F 4D [0-24] BF 9E 00 8B D7 B8 2E 5B AE 75 FD A5 A4 CD 21
    offset: 0
composite_rules:
- id: dos-com-shadows-executable-name
  desc: Same-name COM shadows executable resolution
  crit: hostile
  attack: T1036.005
  all:
  - id: dos-entry-extension-to-dta-companion
  - id: micro-behaviors/fs/search::dos-int21-find-first-call
  - id: micro-behaviors/fs/search::dos-executable-compatible-wildcard
  - id: micro-behaviors/fs/file/create::dos-dta-extension-create-buffer-write
  - id: micro-behaviors/fs/write/file/handle::dos-int21-handle-write-setup
