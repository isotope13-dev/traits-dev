defaults:
  platforms: [windows, unix]
  for: [dos_com, data]
  size_min: 16
  size_max: 65536

composite_rules:
  # Creating same-basename COM files for an executable wildcard redirects
  # DOS command lookup to the twins, independently of their eventual content.
  - id: dos-star-e-com-name-shadowing
    desc: COM twins shadow matching DOS executables
    crit: hostile
    conf: 0.97
    attack: T1036.005
    all:
      - id: micro-behaviors/fs/search::dos-star-e-mask-find-first
      - id: micro-behaviors/fs/file/create::dos-dta-lodsb-dot-com-create
