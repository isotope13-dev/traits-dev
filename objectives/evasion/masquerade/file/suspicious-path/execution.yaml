# Suspicious Execution Paths
# Detects binaries executed from atypical user directories (evasion).
# ATT&CK: T1564 (Hide Artifacts)
defaults:
  platforms: [windows]
  for: [pe, scripts, c, cpp, go]
traits:
- id: exe-in-media-folder--rx-1
  desc: Executable path in Saved Games
  crit: component
  conf: 0.9
  if:
    type: text
    regex: '(?i)[\\/]Saved Games[\\/].{1,120}\.exe\b'
    case_insensitive: true
  count_max: 1028390
- id: exe-in-media-folder--rx-3
  desc: Executable path in Contacts
  crit: component
  conf: 0.9
  if:
    type: text
    regex: '(?i)[\\/]Contacts[\\/].{1,120}\.exe\b'
    case_insensitive: true
  count_max: 1028392
- id: exe-in-media-folder--rx-4
  desc: Executable path in Pictures
  crit: component
  conf: 0.9
  if:
    type: text
    regex: '(?i)[\\/]Pictures[\\/].{1,120}\.exe\b'
    case_insensitive: true
  count_max: 1028393
- id: exe-in-media-folder--rx-5
  desc: Executable path in Videos
  crit: component
  conf: 0.9
  if:
    type: text
    regex: '(?i)[\\/]Videos[\\/].{1,120}\.exe\b'
    case_insensitive: true
  count_max: 1028394
- id: exe-in-media-folder--rx-6
  desc: Executable path under the user's Links directory
  crit: component
  conf: 0.9
  if:
    type: text
    # A system package-manager path such as %ProgramFiles%\\Microsoft\\WinGet\\Links
    # is a legitimate executable lookup location, not user-directory evasion.
    regex: '(?i)([\\/]Users[\\/].{1,64}|%USERPROFILE%)[\\/]Links[\\/].{1,120}\.exe\b'
    case_insensitive: true
  count_max: 1028395
  unless:
  - type: text
    regex: '(?i)[\\/]AppData[\\/]Local[\\/]Microsoft[\\/]WinGet[\\/]Links[\\/]'
- id: exe-in-media-folder--rx-7
  desc: Executable path under the user's Music directory
  crit: component
  conf: 0.9
  if:
    type: text
    regex: '(?i)[\\/]Music[\\/].{1,120}\.exe\b'
    case_insensitive: true
  count_max: 1028396
- id: batch-disguised-programdata-exe
  desc: ProgramData subdirectory executable reference
  crit: component
  conf: 0.94
  for: [batch]
  if:
    type: text
    regex: '(?i)ProgramData\\[^\\\r\n]{1,80}\\[^\\\r\n]{1,80}\.exe'

- id: batch-vendor-dll-copy
  desc: Batch copies DLL into vendor tree path
  crit: component
  conf: 0.95
  for: [batch]
  if:
    type: text
    regex: '(?i)copy\s+[^\r\n]{1,120}ProgramData\\Symantec\\[^\r\n]{1,80}\.dll'

- id: deep-download-exec
  desc: Binary in deep/atypical Downloads subdirectory
  crit: suspicious
  conf: 0.8
  if:
    type: text
      # Matches subfolders like C:\Users\user\Downloads\ab\file.exe
    regex: '(?i)(Downloads\\[A-Za-z0-9]{1,2}\\.{1,120}\.exe)'

composite_rules:
- id: user-path-evasion-execution
  desc: Binary execution from atypical user directory (potential evasion)
  crit: suspicious
  conf: 0.95
  all:
  - id: micro-behaviors/process/create
  any:
  - id: exe-in-media-folder
  - id: deep-download-exec
  - id: micro-behaviors/fs/path/location::users-public-executable-path
- id: exe-in-media-folder
  desc: Executable path under a media-related user directory
  crit: suspicious
  conf: 0.9
  any:
  - id: exe-in-media-folder--rx-1
  - id: exe-in-media-folder--rx-3
  - id: exe-in-media-folder--rx-4
  - id: exe-in-media-folder--rx-5
  - id: exe-in-media-folder--rx-6
  - id: exe-in-media-folder--rx-7

- id: batch-vendor-path-payload-staging
  desc: Batch stages executables in public or vendor paths
  crit: hostile
  conf: 0.97
  attack: T1036,T1074.001
  for: [batch]
  all:
  - id: micro-behaviors/fs/path/location::users-public-executable-path
  any:
  - id: batch-vendor-dll-copy
  - id: batch-disguised-programdata-exe
