defaults:
  platforms: [windows]
  # `text` and `static-lib` cover WSH worms whose INF-style header or `.a`
  # name keeps them from being typed vbs (see staging/encoded/vbscript.yaml).
  for: [vbs, javascript, text, static-lib]
  attack: T1565.001
  mbc: F0004

# A WSH script that opens the Windows hosts file through FileSystemObject and
# writes loopback entries for Windows Update or an AV vendor is sinkholing
# security services. Either observation alone is common (hosts editors,
# documentation); the pair within one routine is not.
traits:
  - id: wsh-hosts-file-create
    desc: FileSystemObject opens hosts file for writing
    crit: notable
    conf: 0.93
    if:
      type: text
      regex: '(?i)(CreateTextFile|OpenTextFile)\s*\([^)\r\n]{0,80}drivers\\etc\\hosts\b'
  - id: wsh-loopback-security-domain
    desc: Loopback entry for security update domain
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)127\.0\.0\.1\s*(www\.)?(windowsupdate\.microsoft|ma?c?afee|norton|symantec)\.'

composite_rules:
  - id: wsh-hosts-security-sinkhole
    desc: Script rewrites hosts to block security sites
    crit: hostile
    conf: 0.96
    near_lines: 40
    all:
      - id: wsh-hosts-file-create
      - id: wsh-loopback-security-domain
