defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, shell, python]
  attack: T1562.001
traits:
  - id: stepsecurity-loopback-hosts-entry
    desc: Maps StepSecurity domains to loopback
    crit: suspicious
    conf: 0.98
    if:
      type: literal
      regex: '(127\.0\.0\.1|::1)\s+[\w.-]*stepsecurity\.io\b'
composite_rules:
  - id: stepsecurity-domain-list-hosts-rewrite
    for: [javascript, typescript]
    desc: StepSecurity names near hosts loopback rewrite
    crit: suspicious
    conf: 0.96
    near_bytes: 10000
    all:
      - id: micro-behaviors/communications/http/url/security::stepsecurity-domain-reference
      - id: micro-behaviors/data/format/string::javascript-loopback-host-list
      - id: micro-behaviors/fs/write/file/target::javascript-hosts-append-command
  - id: stepsecurity-hosts-block-write
    for: [javascript, typescript]
    desc: StepSecurity loopback entry with hosts append
    crit: hostile
    conf: 0.98
    all:
      - id: stepsecurity-loopback-hosts-entry
      - id: micro-behaviors/fs/write/file/target::javascript-hosts-append-command
