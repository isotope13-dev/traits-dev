defaults:
  platforms: [windows]
  for: [pe, dll]

composite_rules:
  # A bare domain or loopback reference is not blocking. Require an admitted
  # recorder, hosts append evidence and the resolved loopback-line code.
  # File scope does not prove the domain array is the virtual call's input.
  - id: managed-keylogger-security-hosts-sinkhole-profile
    desc: Keylogger security-hosts sinkhole code profile
    crit: hostile
    conf: 0.96
    attack: T1562.001
    all:
      - id: objectives/collection/keylog/hook::dotnet-hook-keylog-recording
      - id: micro-behaviors/fs/write/file/target::managed-hosts-path-append-api-references
      - id: micro-behaviors/communications/url/host/name::security-update-telemetry-service-references
      - id: micro-behaviors/data/format/string::managed-loopback-line-call-layout
