      - id: metadata/lang/source/literal/fragment/single::fromc-string-fragment
      - id: metadata/lang/source/literal/fragment/single::vet-string-fragment
      - id: metadata/lang/source/literal/fragment/single::counte-path-fragment
      - id: metadata/lang/source/literal/fragment/single::r-id-path-fragment
      - id: metadata/lang/source/literal/fragment/single::g-fromc-fragment
      - id: metadata/lang/source/literal/fragment/single::temp-quoted-fragment
      - id: metadata/lang/source/literal/fragment/single::exe-quoted-fragment
      - id: metadata/lang/source/literal/fragment/single::msxml-name-fragments
      - id: metadata/lang/source/literal/fragment/single::xo-res-fragment
