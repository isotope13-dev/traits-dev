defaults:
  platforms:
    - unix
    - windows
  for:
    - scripts
    - binaries
  attack: T1565.001
  mbc: F0004
traits:
  - id: windows-hosts-filestream-create
    desc: Creates FileStream for hosts file overwrite
    crit: suspicious
    conf: 0.93
    platforms:
      - windows
    for:
      - csharp
    if:
      type: text
      regex: new\s+FileStream\s*\(\s*this\.dirho\s*,\s*FileMode\.Create\s*\)
  - id: windows-hosts-webrequest-create
    desc: Builds WebRequest for hosts payload
    crit: suspicious
    conf: 0.9
    platforms:
      - windows
    for:
      - csharp
    if:
      type: text
      regex: WebRequest\.Create\s*\(\s*this\.verurl\(\)\s*\)
  - id: hidden-hosts-refresh-counter
    desc: Timer counter triggers hosts refresh interval
    crit: notable
    conf: 0.9
    platforms:
      - windows
    for:
      - csharp
    if:
      type: text
      regex: this\.@int\s*==\s*3600
  - id: hidden-hosts-refresh-call
    desc: Timer tick calls hosts refresh function
    crit: notable
    conf: 0.88
    platforms:
      - windows
    for:
      - csharp
    if:
      type: text
      regex: Timer1_Tick[\s\S]{0,220}this\.downhost\s*\(
  - id: localhost-security-redirect-a
    desc: Localhost redirects Norton or McAfee domain
    crit: suspicious
    conf: 0.97
    platforms:
      - windows
    for:
      - pe
      - dll
    if:
      type: text
      regex: (?i)127\.0\.0\.1\s+(www\.)?(norton|symantec|mcafee)\.(com|net|org)\b
  - id: localhost-security-redirect-b
    desc: Localhost redirects common AV vendor domain
    crit: suspicious
    conf: 0.97
    platforms:
      - windows
    for:
      - pe
      - dll
    if:
      type: text
      regex: (?i)127\.0\.0\.1\s+[a-z0-9.-]{0,32}(kaspersky|avast|avg|eset)\.(com|net|org)\b
  - id: localhost-threat-intel-redirect
    desc: Localhost redirects threat intel domain
    crit: suspicious
    conf: 0.97
    platforms:
      - windows
    for:
      - pe
      - dll
    if:
      type: text
      regex: (?i)127\.0\.0\.1\s+[a-z0-9.-]{0,32}(virustotal|any\.run|hybrid-analysis)\.com\b
  - id: hosts-adblock-token
    desc: Hosts adblock marker token
    crit: component
    conf: 0.9
    if:
      type: text
      regex: (?i)(ADBLOCK|ADAWAY|ADWARE)\b
    unless:
      - id: well-known/app/data/xore-honeypot::benign-context
  - id: hosts-block-token
    desc: Hosts blocklist marker token
    crit: component
    conf: 0.9
    if:
      type: text
      regex: (?i)(HOSTS[- ]?BLOCK|HOSTSBLOCK|BLOCKLIST)\b
  - id: hosts-security-block-token
    desc: Hosts security block token
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: (?i)#[^\n#]{0,12}\b((AV|SECURITY)[- ]?BLOCK|MALWARES?[- ]?(BLOCKS?|LIST|DOMAINS?))
  - id: hosts-stevenblack-token
    desc: Hosts StevenBlack marker token
    crit: notable
    conf: 0.9
    if:
      type: text
      word: STEVENBLACK
      case_insensitive: true
  - id: hosts-null-route-comment
    desc: Explicit 0.0.0.0 null-route comment
    crit: notable
    conf: 0.85
    if:
      type: text
      regex: (?i)^#[^\n]{0,120}null[- ]route
  - id: hosts-null-route-target-comment
    desc: 'Redirect target: 0.0.0.0 comment'
    crit: suspicious
    conf: 0.85
    if:
      type: text
      regex: (?i)^#[^\n]{0,120}redirect\s+target\s*:\s*0\.0\.0\.0
  - id: malwarebytes-kaspersky-null-route
    desc: Malwarebytes or Kaspersky hosts null-route
    crit: suspicious
    conf: 0.93
    if:
      type: text
      regex: 0\.0\.0\.0\s+\S+\.(malwarebytes|kaspersky)\.
      case_insensitive: true
  - id: eset-mcafee-symantec-null-route
    desc: ESET/McAfee/Symantec hosts null-route
    crit: suspicious
    conf: 0.93
    if:
      type: text
      regex: 0\.0\.0\.0\s+\S+\.(eset|mcafee|symantec|norton)\.
      case_insensitive: true
  - id: avast-avg-bitdefender-sophos-null-route
    desc: Avast/AVG/Bitdefender/Sophos hosts null-route
    crit: suspicious
    conf: 0.93
    if:
      type: text
      regex: 0\.0\.0\.0\s+\S+\.(bitdefender|sophos|avg|avast)\.
      case_insensitive: true
  - id: kaspersky-trendmicro-fsecure-null-route
    desc: Kaspersky/Trend Micro/F-Secure hosts null-route
    crit: suspicious
    conf: 0.93
    if:
      type: text
      regex: 0\.0\.0\.0\s+\S+\.(kaspersky-labs|trendmicro|f-secure)\.
      case_insensitive: true
  - id: hosts-escan-null-route
    desc: 0.0.0.0 null-route targeting eScan updates
    crit: suspicious
    conf: 0.94
    if:
      type: text
      regex: 0\.0\.0\.0\s+\S*\b(escanav|mwti)\.com\b
      case_insensitive: true
  - id: av-hosts-block-manage-token
    desc: AV-hosts-block management token
    crit: suspicious
    conf: 0.9
    if:
      type: text
      regex: (?i)-AvHostsBlock(Apply|Revert)\b
  - id: juniper-security-domain
    desc: Juniper security domain string
    crit: notable
    conf: 0.9
    platforms:
      - junos
      - appliance
      - unix
    for:
      - c
      - elf
    if:
      type: text
      regex: (security|updates|support|telemetry)\.juniper\.net
  - id: juniper-security-domain-set
    desc: Juniper security domain set
    crit: suspicious
    conf: 0.94
    platforms:
      - junos
      - appliance
      - unix
    for:
      - c
      - elf
    if:
      type: text
      regex: security\.juniper\.net[\s\S]{0,80}updates\.juniper\.net
  - id: juniper-security-host
    desc: Juniper security host
    crit: notable
    conf: 0.9
    platforms:
      - junos
      - appliance
      - unix
    for:
      - c
      - elf
    if:
      type: text
      substr: security.juniper.net
  - id: juniper-updates-host
    desc: Juniper updates host
    crit: notable
    conf: 0.9
    platforms:
      - junos
      - appliance
      - unix
    for:
      - c
      - elf
    if:
      type: text
      substr: updates.juniper.net
  - id: juniper-telemetry-host
    desc: Juniper telemetry host
    crit: notable
    conf: 0.9
    platforms:
      - junos
      - appliance
      - unix
    for:
      - c
      - elf
    if:
      type: text
      substr: telemetry.juniper.net
  - id: juniper-hosts-redirects
    desc: Juniper domains redirected in hosts
    crit: suspicious
    conf: 0.95
    platforms:
      - junos
      - appliance
      - unix
    for:
      - c
      - elf
    count_min: 3
    if:
      type: text
      regex: 127\.0\.0\.1[\t ]+[A-Za-z0-9.-]+\.juniper\.net
  - id: native-hosts-replace-flow
    desc: Native hosts temp replace flow
    crit: suspicious
    conf: 0.9
    for:
      - c
      - elf
    if:
      type: text
      regex: /etc/hosts[\s\S]{0,700}\.tmp[\s\S]{0,700}rename
  - id: native-hosts-backup-replace
    desc: Backup and hosts file references
    crit: notable
    conf: 0.9
    for:
      - c
      - elf
    if:
      type: text
      regex: \.bak[\s\S]{0,900}/etc/hosts
  - id: source-hosts-rename-call
    desc: Source hosts rename call
    crit: suspicious
    conf: 0.92
    for:
      - c
    if:
      type: text
      substr: rename(tmp_path, HOSTS_FILE)
  - id: zig-packed-hosts-path
    desc: Zig packed hosts path
    crit: notable
    conf: 0.9
    platforms:
      - unix
    for:
      - zig
    if:
      type: symbol
      kind: identifier
      exact: PACKED_HOSTS_PATH
  - id: zig-hosts-create-write-flow
    desc: Zig hosts create write flow
    crit: suspicious
    conf: 0.92
    platforms:
      - unix
    for:
      - zig
    if:
      type: text
      regex: createFile\(hosts_path[\s\S]{0,260}writeAll\(new_content\.items\)
  - id: loopback-security-sinkholes
    desc: Loopback security sinkholes
    crit: suspicious
    conf: 0.92
    platforms:
      - unix
    for:
      - source
    if:
      type: literal
      regex: ^127\.0\.0\.1\s+[A-Za-z0-9.-]*(antimalware|security|telemetry|abuse)
  - id: localhost-mining-pool-redirect
    desc: Localhost redirect of a mining pool
    crit: notable
    conf: 0.93
    for:
      - lua
      - shell
      - python
      - perl
      - ruby
      - php
    if:
      type: text
      regex: 127\.0\.0\.1\s+\S{0,48}(minexmr|supportxmr|minergate|nanopool|hashvault|slushpool)\.
  - id: localhost-chinese-security-redirect
    desc: Loopback entries target Chinese security vendors
    crit: suspicious
    conf: 0.98
    platforms:
      - windows
    for:
      - pe
      - dll
    if:
      type: text
      regex: 127\.0\.0\.1[ \t]+(www\.|bbs\.)?(360\.cn|duba\.net|ikaka\.com)\b
  - id: localhost-virscan-redirect
    desc: Loopback entry targets VirSCAN scanning service
    crit: suspicious
    conf: 0.98
    platforms:
      - windows
    for:
      - pe
      - dll
    if:
      type: text
      regex: 127\.0\.0\.1[ \t]+(www\.)?virscan\.org\b
composite_rules:
  - id: hosts-security-block-with-av-termination
    desc: Redirects security sites and matches a Chinese AV process termination loop
    crit: hostile
    conf: 0.97
    platforms:
      - windows
    for:
      - pe
      - dll
    attack: T1562.001,T1565.001
    all:
      - id: localhost-security-vendor-redirect
      - id: objectives/evasion/anti-av/kill::chinese-av-reference-termination-api-profile
  - id: localhost-security-vendor-redirect
    desc: Localhost redirects an antivirus domain
    crit: suspicious
    conf: 0.97
    platforms:
      - windows
    for:
      - pe
      - dll
    any:
      - id: localhost-security-redirect-a
      - id: localhost-security-redirect-b
      - id: localhost-threat-intel-redirect
      - id: localhost-chinese-security-redirect
      - id: localhost-virscan-redirect
  - id: junos-security-domain-targets
    desc: Junos security domain targets
    crit: suspicious
    conf: 0.96
    platforms:
      - junos
      - appliance
      - unix
    for:
      - c
      - elf
    any:
      - id: juniper-hosts-redirects
      - id: juniper-security-domain-set
      - id: juniper-security-domain-cluster
  - id: juniper-security-domain-cluster
    desc: Juniper security domain cluster
    crit: suspicious
    conf: 0.95
    platforms:
      - junos
      - appliance
      - unix
    for:
      - c
      - elf
    all:
      - id: juniper-security-host
      - id: juniper-updates-host
      - id: juniper-telemetry-host
  - id: native-hosts-replacement
    desc: Native hosts replacement flow
    crit: suspicious
    conf: 0.94
    for:
      - c
      - elf
    any:
      - id: native-hosts-replace-flow
      - id: source-hosts-rename-call
      - id: native-hosts-backup-replace
  - id: zig-hosts-security-sinkhole
    desc: Zig hosts security sinkhole
    crit: hostile
    conf: 0.98
    platforms:
      - unix
    for:
      - zig
    all:
      - id: zig-packed-hosts-path
      - id: zig-hosts-create-write-flow
      - id: loopback-security-sinkholes
  - id: hosts-managed-block-marker
    desc: Managed hosts block sentinel
    crit: notable
    conf: 0.9
    near_bytes: 4096
    all:
      - id: metadata/lang/source/comment::managed-block-sentinel
      - id: micro-behaviors/fs/path/config/network::hosts-file-path
    any:
      - id: hosts-adblock-token
      - id: hosts-block-token
      - id: hosts-security-block-token
      - id: hosts-stevenblack-token
    not:
      - regex: (?i)^#\s+(BEGIN|END)\s+(MARKER|AUTO-GENERATED\b)
  - id: junos-security-hosts-block
    desc: Junos security hosts blocking
    crit: hostile
    conf: 0.98
    platforms:
      - junos
      - appliance
      - unix
    for:
      - c
      - elf
    all:
      - id: junos-security-domain-targets
      - id: native-hosts-replacement
    any:
      - id: juniper-security-domain
      - id: micro-behaviors/fs/path/config/network::config-hosts
  - id: hosts-hijacker-messenger-masquerade
    desc: Hosts hijacker mimics Windows Live Messenger
    crit: hostile
    conf: 0.97
    platforms:
      - windows
    for:
      - csharp
    all:
      - id: windows-hosts-overwrite-download
      - id: objectives/evasion/masquerade/identity/mimicry::windows-live-messenger-masquerade
    any:
      - id: objectives/evasion/security-bypass/policy/uac::disable-uac-policy-set
      - id: objectives/impact/degrade/system/recovery::disable-system-restore
      - id: objectives/persistence/login/self-install/copy::system32-messenger-self-install
    needs: 2
  - id: windows-hosts-download-loop
    desc: HTTP response writes hosts payload
    crit: suspicious
    conf: 0.92
    platforms:
      - windows
    for:
      - csharp
    all:
      - id: windows-hosts-webrequest-create
      - id: windows-hosts-filestream-create
    any:
      - id: micro-behaviors/data/control-flow/loop/unconditional::infinite-loop-header
      - id: micro-behaviors/os/registry/value/write::registry-managed-set-value-source
  - id: hosts-av-blocking
    desc: Hosts-write clues with security and update-service references
    crit: suspicious
    conf: 0.95
    all:
      - id: micro-behaviors/fs/path/config/network::hosts-file-path
      - id: micro-behaviors/communications/url/host/name::security-update-telemetry-service-references
    any:
      - id: micro-behaviors/network/dns::multiple-sinkhole-hosts-entries
      - id: micro-behaviors/fs/config/system::hosts-file-modification-api-set
      - id: micro-behaviors/fs/write/file/hosts::managed-hosts-path-append-api-references
  - id: hosts-security-domain-replacement
    desc: Hosts replacement blocks security domains
    crit: hostile
    conf: 0.97
    all:
      - id: micro-behaviors/fs/path/config/network::hosts-file-path
      - id: micro-behaviors/communications/url/host/name::security-update-telemetry-service-references
      - id: native-hosts-replacement
  - id: windows-hosts-security-sinkhole
    desc: Windows executable writes antivirus-domain hosts sinkholes
    crit: hostile
    conf: 0.98
    platforms:
      - windows
    for:
      - pe
      - dll
    all:
      - id: micro-behaviors/fs/path/config/network::hosts-file-path
      - id: localhost-security-vendor-redirect
    any:
      - id: micro-behaviors/fs/write/file/handle/unspecified::write--fwrite
      - id: micro-behaviors/fs/write/file/handle/unspecified::write-file
    unless:
      - id: metadata/installer/product/
  - id: hosts-sinkhole-remote-exe
    desc: Hosts sinkhole downloads a remote executable
    crit: hostile
    conf: 0.97
    attack: T1562.001,T1105
    platforms:
      - windows
    for:
      - pe
      - dll
    all:
      - id: windows-hosts-security-sinkhole
      - id: micro-behaviors/communications/http/client/urlmon::url-download-to-file
      - id: micro-behaviors/communications/http/download/url::cleartext-executable-url-reference-pe
    any:
      - id: micro-behaviors/os/handler/open::shell-execute-a
      - id: metadata/binary/symbols/name/process::shell-execute-ex-a
    needs: 1
    unless:
      - id: metadata/installer/product/
  - id: windows-embedded-security-hosts-sinkhole
    desc: Unsigned executable embeds localhost security domain sinkholes
    crit: hostile
    conf: 0.98
    attack: T1565.001,T1562.001
    platforms:
      - windows
    for:
      - pe
      - dll
    all:
      - id: micro-behaviors/fs/path/config/network::hosts-file-path
      - id: localhost-security-vendor-redirect
      - id: metadata/signature/absent::unsigned-missing-signature-record
    any:
      - id: objectives/execution/payload/script-eval/transformed/direct::lnk-powershell-obfuscated-stage
      - id: objectives/execution/payload/file-exec/command/interpreter-stage::lnk-certutil-hidden-powershell
      - id: micro-behaviors/process/argument/short-option::lnk-short-s-option
      - id: micro-behaviors/process/argument/short-option::lnk-short-s-media-path
      - id: micro-behaviors/process/argument/interpreter::lnk-interpreter-or-hidden-launch-clues
      - id: micro-behaviors/process/argument/interpreter::lnk-execution-related-flags
      - id: micro-behaviors/process/argument/interpreter::lnk-encoding-decode-flag
      - id: micro-behaviors/process/argument/interpreter::kv-encoding-flag
      - id: micro-behaviors/data/control-flow/error-handling/suppress::kv-silentlycontinue-reference
      - id: objectives/execution/staging/http::lnk-curl-https-hta-reference
      - id: micro-behaviors/communications/http/download/cli/curl-wget::lnk-hidden-cmd-curl-download
      - id: objectives/execution/staging/transfer::lnk-curl-output-userdir-executable
      - id: micro-behaviors/communications/http/download/cli/curl-wget::lnk-conhost-curl-download
      - id: objectives/execution/payload/script-eval/network/stream::powershell-download-execute
      - id: objectives/execution/payload/script-eval/network/constructed::lnk-powershell-remote-stager
      - id: objectives/execution/payload/script-eval/network/constructed::lnk-hidden-powershell-remote-stager
      - id: micro-behaviors/fs/path/network::lnk-webdav-or-smb-reference
      - id: objectives/anti-static/obfuscation/string/fragmentation::lnk-fragmented-command-url-option
      - id: micro-behaviors/os/autorun/scheduled::lnk-url-and-schtasks-reference
      - id: micro-behaviors/fs/path/network::lnk-webdav-ip-port-js-reference
      - id: objectives/execution/interpreter/script/embedded::lnk-htmlfile-execscript
      - id: objectives/execution/payload/file-exec/installer/invocation::lnk-msiexec-quiet-install-chain
      - id: objectives/execution/payload/file-exec/command/hidden-window::powershell-lnk-download-execute
      - id: micro-behaviors/data/decode/to-file::lnk-certutil-decode
      - id: metadata/lang/source/syntax/command/control::lnk-cmd-set
      - id: micro-behaviors/communications/url/scheme::lnk-ftp-reference
      - id: micro-behaviors/fs/path/network::lnk-smb-share
      - id: micro-behaviors/communications/http/webdav::lnk-webdav-path
      - id: micro-behaviors/communications/http/webdav::lnk-webdav-unc-ip-port
      - id: micro-behaviors/communications/http/webdav::lnk-webclient-service
      - id: objectives/anti-static/obfuscation/string/fragmentation::lnk-empty-string-obfuscation
      - id: objectives/anti-static/obfuscation/string/fragmentation::lnk-powershell-backtick-obfuscation
      - id: micro-behaviors/process/argument/file::kv-outfile-option
      - id: micro-behaviors/communications/http/lib/invoke-webrequest::kv-powershell-download-command
      - id: micro-behaviors/process/interpreter/eval/constructed::kv-powershell-pipeline-evaluator
      - id: micro-behaviors/os/com/instantiation::lnk-htmlfile-activex
      - id: micro-behaviors/os/com/instantiation::lnk-createobject-htmlfile
      - id: objectives/evasion/masquerade/identity/mimicry::lnk-downloads-desktop-ini-exe
      - id: objectives/execution/payload/file-exec/command/script-host-interpreter::lnk-script-host-nonscript-input
      - id: micro-behaviors/fs/path/data-file::lnk-script-host-relative-data-path
      - id: objectives/evasion/masquerade/extension/double::lnk-relative-double-extension-exe
      - id: objectives/execution/lnk/target::lnk-traversal-userdir-unusual-path
      - id: micro-behaviors/fs/path/executable::lnk-userdir-exe-shortcut
      - id: micro-behaviors/fs/path/executable::lnk-desktop-generated-looking-relative-path
      - id: micro-behaviors/fs/path/executable::lnk-downloads-long-exe-path
      - id: micro-behaviors/fs/path/traversal::lnk-traversal-roaming-exe-target
      - id: objectives/execution/staging/http::lnk-powershell-and-hta-url
      - id: objectives/execution/payload/file-exec/command/batch::lnk-downloads-and-runs-remote-batch
      - id: micro-behaviors/fs/path/executable::lnk-drive-root-executable-shortcut
      - id: micro-behaviors/fs/path/traversal::lnk-traversal-roaming-exe-reference
      - id: objectives/evasion/masquerade/identity/mimicry::lnk-traversal-programdata-system-name
      - id: objectives/execution/lnk/target::lnk-concatenated-climbing-exe-shortcut
      - id: micro-behaviors/fs/path/executable::lnk-desktop-generic-exe-references
      - id: micro-behaviors/fs/path/traversal::lnk-traversal-syswow64-reference
      - id: objectives/execution/lnk/target::lnk-hidden-system-syswow64-reference
      - id: objectives/evasion/masquerade/extension/double::lnk-target-desktop-ini-exe
      - id: micro-behaviors/fs/path/executable::lnk-target-downloads-exe
      - id: micro-behaviors/fs/path/user-directory::lnk-relative-user-staging-dir
      - id: micro-behaviors/fs/path/executable::lnk-target-user-staging-exe
      - id: micro-behaviors/fs/path/executable::lnk-relative-sibling-executable
      - id: micro-behaviors/fs/path/executable::lnk-screensaver-target
      - id: micro-behaviors/fs/path/executable::lnk-drive-root-executable-target
      - id: micro-behaviors/fs/path/file::lnk-relative-random-like-path
      - id: micro-behaviors/fs/path/executable::lnk-relative-random-sibling-exe
      - id: micro-behaviors/fs/path/drive-root::lnk-workingdir-drive-root
      - id: micro-behaviors/fs/path/user-directory::lnk-workingdir-user-desktop
      - id: micro-behaviors/fs/path/user-directory::lnk-workingdir-user-downloads
      - id: micro-behaviors/fs/path/executable::lnk-relative-downloads-exe
      - id: micro-behaviors/fs/path/executable::lnk-relative-random-named-exe
      - id: micro-behaviors/fs/path/executable::lnk-target-roaming-exe-path
      - id: micro-behaviors/fs/path/executable::lnk-text-roaming-exe
      - id: objectives/evasion/masquerade/file/name::lnk-text-programdata-system-name
      - id: micro-behaviors/fs/path/executable::lnk-text-desktop-generic-name
      - id: micro-behaviors/fs/path/executable::lnk-text-desktop-exe-target
      - id: micro-behaviors/fs/path/executable::lnk-text-syswow64-exe
      - id: micro-behaviors/communications/url/resource-path/file::lnk-text-hta-url-reference
      - id: micro-behaviors/fs/path/script::lnk-args-http-batch-reference
