defaults:
  platforms:
  - unix
  - windows
  for: [scripts, binaries]
  attack: T1565.001
  mbc: F0004
traits:
- id: windows-hosts-filestream-create
  desc: Creates FileStream for hosts file overwrite
  crit: suspicious
  conf: 0.93
  platforms:
  - windows
  for:
  - csharp
  if:
    type: text
    regex: 'new\s+FileStream\s*\(\s*this\.dirho\s*,\s*FileMode\.Create\s*\)'
- id: windows-hosts-webrequest-create
  desc: Builds WebRequest for hosts payload
  crit: suspicious
  conf: 0.9
  platforms:
  - windows
  for:
  - csharp
  if:
    type: text
    regex: 'WebRequest\.Create\s*\(\s*this\.verurl\(\)\s*\)'
- id: hidden-hosts-refresh-counter
  desc: Timer counter triggers hosts refresh interval
  crit: notable
  conf: 0.9
  platforms:
  - windows
  for:
  - csharp
  if:
    type: text
    regex: 'this\.@int\s*==\s*3600'
- id: hidden-hosts-refresh-call
  desc: Timer tick calls hosts refresh function
  crit: notable
  conf: 0.88
  platforms:
  - windows
  for:
  - csharp
  if:
    type: text
    regex: 'Timer1_Tick[\s\S]{0,220}this\.downhost\s*\('
- id: localhost-security-redirect-a
  desc: Localhost redirects Norton or McAfee domain
  crit: suspicious
  conf: 0.97
  platforms: [windows]
  for: [pe, dll]
  if:
    type: text
    regex: '(?i)127\.0\.0\.1\s+(www\.)?(norton|symantec|mcafee)\.(com|net|org)\b'
- id: localhost-security-redirect-b
  desc: Localhost redirects common AV vendor domain
  crit: suspicious
  conf: 0.97
  platforms: [windows]
  for: [pe, dll]
  if:
    type: text
    regex: '(?i)127\.0\.0\.1\s+[a-z0-9.-]{0,32}(kaspersky|avast|avg|eset)\.(com|net|org)\b'
- id: localhost-threat-intel-redirect
  desc: Localhost redirects threat intel domain
  crit: suspicious
  conf: 0.97
  platforms: [windows]
  for: [pe, dll]
  if:
    type: text
    regex: '(?i)127\.0\.0\.1\s+[a-z0-9.-]{0,32}(virustotal|any\.run|hybrid-analysis)\.com\b'
- id: hosts-adblock-token
  desc: Hosts adblock marker token
  crit: component
  conf: 0.9
  if:
    type: text
    regex: (?i)(ADBLOCK|ADAWAY|ADWARE)\b
  unless:
  - id: well-known/app/data/xore-honeypot::benign-context
- id: hosts-block-token
  desc: Hosts blocklist marker token
  crit: component
  conf: 0.9
  if:
    type: text
    regex: (?i)(HOSTS[- ]?BLOCK|HOSTSBLOCK|BLOCKLIST)\b
- id: hosts-security-block-token
  desc: Hosts security block token
  crit: notable
  conf: 0.9
  if:
    type: text
    # Bare `MALWARE` matched any binary carrying the word (IoT bot
    # anti-analysis tables contain the sandbox marker "malware.analysis"),
    # so the malware alternative requires blocklist phrasing around it.
    # The token must sit in a `#` comment, as hosts-file section markers do:
    # unanchored, `AVBlock` matched MSVC RTTI names (`.?AVBlock@spv@@`) and
    # "Security block:" matched a .NET IEHost error message.
    regex: '(?i)#[^\n#]{0,12}\b((AV|SECURITY)[- ]?BLOCK|MALWARES?[- ]?(BLOCKS?|LIST|DOMAINS?))'
- id: hosts-stevenblack-token
  desc: Hosts StevenBlack marker token
  crit: notable
  conf: 0.9
  if:
    type: text
    word: STEVENBLACK
    case_insensitive: true
- id: hosts-null-route-comment
  desc: Explicit 0.0.0.0 null-route comment
  crit: suspicious
  conf: 0.85
  if:
    type: text
    regex: (?i)^#[^\n]{0,120}null[- ]route
  unless:
  - id: well-known/tool/detection/wazuh/
  - id: "metadata/file/naming::test-directory-component"
- id: hosts-null-route-target-comment
  desc: 'Redirect target: 0.0.0.0 comment'
  crit: suspicious
  conf: 0.85
  if:
    type: text
    regex: (?i)^#[^\n]{0,120}redirect\s+target\s*:\s*0\.0\.0\.0
- id: malwarebytes-kaspersky-null-route
  desc: Malwarebytes or Kaspersky hosts null-route
  crit: suspicious
  conf: 0.93
  if:
    type: text
    regex: 0\.0\.0\.0\s+\S+\.(malwarebytes|kaspersky)\.
    case_insensitive: true
- id: eset-mcafee-symantec-null-route
  desc: "ESET/McAfee/Symantec hosts null-route"
  crit: suspicious
  conf: 0.93
  if:
    type: text
    regex: 0\.0\.0\.0\s+\S+\.(eset|mcafee|symantec|norton)\.
    case_insensitive: true
- id: avast-avg-bitdefender-sophos-null-route
  desc: Avast/AVG/Bitdefender/Sophos hosts null-route
  crit: suspicious
  conf: 0.93
  if:
    type: text
    regex: 0\.0\.0\.0\s+\S+\.(bitdefender|sophos|avg|avast)\.
    case_insensitive: true
- id: kaspersky-trendmicro-fsecure-null-route
  desc: Kaspersky/Trend Micro/F-Secure hosts null-route
  crit: suspicious
  conf: 0.93
  if:
    type: text
    regex: 0\.0\.0\.0\s+\S+\.(kaspersky-labs|trendmicro|f-secure)\.
    case_insensitive: true
- id: hosts-escan-null-route
  desc: 0.0.0.0 null-route targeting eScan updates
  crit: suspicious
  conf: 0.94
  if:
    type: text
    regex: 0\.0\.0\.0\s+\S*\b(escanav|mwti)\.com\b
    case_insensitive: true
- id: av-hosts-block-manage-token
  desc: AV-hosts-block management token
  crit: suspicious
  conf: 0.9
  if:
    type: text
    regex: (?i)-AvHostsBlock(Apply|Revert)\b
- id: juniper-security-domain
  desc: Juniper security domain string
  crit: notable
  conf: 0.9
  platforms: [junos, appliance, unix]
  for: [c, elf]
  if:
    type: text
    regex: '(security|updates|support|telemetry)\.juniper\.net'
- id: juniper-security-domain-set
  desc: Juniper security domain set
  crit: suspicious
  conf: 0.94
  platforms: [junos, appliance, unix]
  for: [c, elf]
  if:
    type: text
    regex: 'security\.juniper\.net[\s\S]{0,80}updates\.juniper\.net'
- id: juniper-security-host
  desc: Juniper security host
  crit: notable
  conf: 0.9
  platforms: [junos, appliance, unix]
  for: [c, elf]
  if:
    type: text
    substr: security.juniper.net
- id: juniper-updates-host
  desc: Juniper updates host
  crit: notable
  conf: 0.9
  platforms: [junos, appliance, unix]
  for: [c, elf]
  if:
    type: text
    substr: updates.juniper.net
- id: juniper-telemetry-host
  desc: Juniper telemetry host
  crit: notable
  conf: 0.9
  platforms: [junos, appliance, unix]
  for: [c, elf]
  if:
    type: text
    substr: telemetry.juniper.net
- id: juniper-hosts-redirects
  desc: Juniper domains redirected in hosts
  crit: suspicious
  conf: 0.95
  platforms: [junos, appliance, unix]
  for: [c, elf]
  count_min: 3
  if:
    type: text
    regex: '127\.0\.0\.1[\t ]+[A-Za-z0-9.-]+\.juniper\.net'
- id: source-hosts-file-macro
  desc: Source hosts file macro
  crit: suspicious
  conf: 0.9
  for: [c]
  if:
    type: text
    regex: 'HOSTS_FILE\s+"/etc/hosts"'
- id: native-hosts-replace-flow
  desc: Native hosts temp replace flow
  crit: suspicious
  conf: 0.9
  for: [c, elf]
  if:
    type: text
    regex: '/etc/hosts[\s\S]{0,700}\.tmp[\s\S]{0,700}rename'
- id: native-hosts-backup-replace
  desc: Native hosts backup replace flow
  crit: suspicious
  conf: 0.9
  for: [c, elf]
  if:
    type: text
    regex: '\.bak[\s\S]{0,900}/etc/hosts'
  unless:
  - id: "metadata/file/naming::test-directory-component"
  - id: metadata/package/testing/presence/harness::c-source-test-directory
  - id: metadata/package/testing/presence/harness::c-source-test-file
- id: source-hosts-rename-call
  desc: Source hosts rename call
  crit: suspicious
  conf: 0.92
  for: [c]
  if:
    type: text
    substr: rename(tmp_path, HOSTS_FILE)
- id: zig-packed-hosts-path
  desc: Zig packed hosts path
  crit: notable
  conf: 0.9
  platforms: [unix]
  for: [zig]
  if:
    type: symbol
    kind: identifier
    exact: PACKED_HOSTS_PATH
- id: zig-hosts-create-write-flow
  desc: Zig hosts create write flow
  crit: suspicious
  conf: 0.92
  platforms: [unix]
  for: [zig]
  if:
    type: text
    regex: 'createFile\(hosts_path[\s\S]{0,260}writeAll\(new_content\.items\)'
- id: loopback-security-sinkholes
  desc: Loopback security sinkholes
  crit: suspicious
  conf: 0.92
  platforms: [unix]
  for: [source]
  if:
    type: literal
    regex: '^127\.0\.0\.1\s+[A-Za-z0-9.-]*(antimalware|security|telemetry|abuse)'
- id: localhost-mining-pool-redirect
  desc: Localhost redirect of a mining pool
  crit: notable
  conf: 0.93
  for: [lua, shell, python, perl, ruby, php]
  if:
    type: text
    regex: '127\.0\.0\.1\s+\S{0,48}(minexmr|supportxmr|minergate|nanopool|hashvault|slushpool)\.'
# These are security-product/scanning sites, rather than arbitrary blocklist names.
- id: localhost-chinese-security-redirect
  desc: Loopback entries target Chinese security vendors
  crit: suspicious
  conf: 0.98
  platforms: [windows]
  for: [pe, dll]
  if:
    type: text
    regex: '127\.0\.0\.1[ \t]+(www\.|bbs\.)?(360\.cn|duba\.net|ikaka\.com)\b'
- id: localhost-virscan-redirect
  desc: Loopback entry targets VirSCAN scanning service
  crit: suspicious
  conf: 0.98
  platforms: [windows]
  for: [pe, dll]
  if:
    type: text
    regex: '127\.0\.0\.1[ \t]+(www\.)?virscan\.org\b'
composite_rules:
- id: localhost-security-vendor-redirect
  desc: Localhost redirects an antivirus domain
  crit: suspicious
  conf: 0.97
  platforms: [windows]
  for: [pe, dll]
  any:
  - id: localhost-security-redirect-a
  - id: localhost-security-redirect-b
  - id: localhost-threat-intel-redirect
  - id: localhost-chinese-security-redirect
  - id: localhost-virscan-redirect
- id: junos-security-domain-targets
  desc: Junos security domain targets
  crit: suspicious
  conf: 0.96
  platforms: [junos, appliance, unix]
  for: [c, elf]
  any:
  - id: juniper-hosts-redirects
  - id: juniper-security-domain-set
  - id: juniper-security-domain-cluster
- id: juniper-security-domain-cluster
  desc: Juniper security domain cluster
  crit: suspicious
  conf: 0.95
  platforms: [junos, appliance, unix]
  for: [c, elf]
  all:
  - id: juniper-security-host
  - id: juniper-updates-host
  - id: juniper-telemetry-host
- id: native-hosts-replacement
  desc: Native hosts replacement flow
  crit: suspicious
  conf: 0.94
  for: [c, elf]
  # Requires at least one hosts-specific rewrite flow (each sub-trait already
  # co-locates /etc/hosts with a temp/backup/rename/macro). The bare `rename`
  # symbol and a lone `/etc/hosts` reference can no longer satisfy this rule on
  # their own, which avoids firing on glibc/Go binaries that merely call
  # rename(2) and mention /etc/hosts (dirmngr, micro, git-lfs, zig).
  any:
  - id: native-hosts-replace-flow
  - id: source-hosts-rename-call
  - id: source-hosts-file-macro
  - id: native-hosts-backup-replace
- id: zig-hosts-security-sinkhole
  desc: Zig hosts security sinkhole
  crit: hostile
  conf: 0.98
  platforms: [unix]
  for: [zig]
  all:
  - id: zig-packed-hosts-path
  - id: zig-hosts-create-write-flow
  - id: loopback-security-sinkholes
- id: hosts-managed-block-marker
  desc: Managed hosts block sentinel
  crit: suspicious
  conf: 0.9
  # Require an actual hosts-file reference. Without it, generic "# BEGIN/END"
  # comment blocks plus the word BLOCK fire on unrelated binaries (git, named,
  # glilypond) that carry sentinel-style comments and the word "block".
  # Keep all evidence close so unrelated strings in large native applications
  # cannot manufacture a managed-block result.
  near_bytes: 4096
  all:
  - id: metadata/file/comment::managed-block-sentinel
  - id: micro-behaviors/fs/path/config/system::hosts-file-path
  any:
  - id: hosts-adblock-token
  - id: hosts-block-token
  - id: hosts-security-block-token
  - id: hosts-stevenblack-token
  not:
  - regex: (?i)^#\s+(BEGIN|END)\s+(MARKER|AUTO-GENERATED\b)
  unless:
  - id: metadata/package/testing/presence/harness/
  - id: well-known/app/media/maester/
  - id: "metadata/file/naming::test-directory-component"
- id: junos-security-hosts-block
  desc: Junos security hosts blocking
  crit: hostile
  conf: 0.98
  platforms: [junos, appliance, unix]
  for: [c, elf]
  all:
  - id: junos-security-domain-targets
  - id: native-hosts-replacement
  any:
  - id: juniper-security-domain
  - id: micro-behaviors/fs/path/config/system::config-hosts
- id: hosts-hijacker-messenger-masquerade
  desc: Hosts hijacker mimics Windows Live Messenger
  crit: hostile
  conf: 0.97
  platforms: [windows]
  for: [csharp]
  all:
  - id: windows-hosts-overwrite-download
  - id: objectives/evasion/masquerade/identity/mimicry::windows-live-messenger-masquerade
  any:
  - id: objectives/evasion/security-bypass/policy/uac::disable-uac-policy-set
  - id: objectives/impact/degrade/system/recovery::disable-system-restore
  - id: objectives/persistence/login/self-install/copy::system32-messenger-self-install
  needs: 2
- id: windows-hosts-download-loop
  desc: HTTP response writes hosts payload
  crit: suspicious
  conf: 0.92
  platforms:
  - windows
  for:
  - csharp
  all:
  - id: windows-hosts-webrequest-create
  - id: windows-hosts-filestream-create
  any:
  - id: micro-behaviors/data/control-flow/loop::infinite-loop-header
  - id: micro-behaviors/os/registry/write::registry-managed-set-value-source
- id: hosts-av-blocking
  desc: Hosts-write clues with security and update-service references
  crit: suspicious
  conf: 0.95
  all:
  - id: micro-behaviors/fs/path/config/system::hosts-file-path
  - id: micro-behaviors/communications/url/host/name::security-update-telemetry-service-references
  any:
  - id: micro-behaviors/network/dns::multiple-sinkhole-hosts-entries
  - id: micro-behaviors/fs/path/config/system::hosts-file-modification-api-set
  - id: micro-behaviors/fs/write/file/target::managed-hosts-path-append-api-references
- id: hosts-security-domain-replacement
  desc: Hosts replacement blocks security domains
  crit: hostile
  conf: 0.97
  all:
  - id: micro-behaviors/fs/path/config/system::hosts-file-path
  - id: micro-behaviors/communications/url/host/name::security-update-telemetry-service-references
  - id: native-hosts-replacement
- id: windows-hosts-security-sinkhole
  desc: Windows executable writes antivirus-domain hosts sinkholes
  crit: hostile
  conf: 0.98
  platforms: [windows]
  for: [pe, dll]
  all:
  - id: micro-behaviors/fs/path/config/system::hosts-file-path
  - id: localhost-security-vendor-redirect
  any:
  - id: micro-behaviors/fs/write/file/handle::write--fwrite
  - id: micro-behaviors/fs/write/file/handle::write-file
  unless:
  - id: metadata/signed/platform/
  - id: metadata/binary/installer/family/
- id: hosts-sinkhole-remote-exe
  desc: Hosts sinkhole downloads a remote executable
  crit: hostile
  conf: 0.97
  attack: T1562.001,T1105
  platforms: [windows]
  for: [pe, dll]
  all:
  - id: windows-hosts-security-sinkhole
  - id: micro-behaviors/communications/http/client/urlmon::url-download-to-file
  - id: micro-behaviors/communications/http/download/url::cleartext-executable-url-reference-pe
  any:
  - id: micro-behaviors/process/create/shellexec::shell-execute-a
  - id: micro-behaviors/process/create/shellexec::shell-execute-ex-a
  needs: 1
  unless:
  - id: metadata/signed/platform/
  - id: metadata/binary/installer/family/
- id: windows-embedded-security-hosts-sinkhole
  desc: Unsigned executable embeds localhost security domain sinkholes
  crit: hostile
  conf: 0.98
  attack: T1565.001,T1562.001
  platforms: [windows]
  for: [pe, dll]
  all:
  - id: micro-behaviors/fs/path/config/system::hosts-file-path
  - id: localhost-security-vendor-redirect
  - id: metadata/signed/trust-level::unsigned-missing-signature-record
  any:
  - id: objectives/command-and-control/dropper/
  - id: micro-behaviors/communications/http/client/wininet::unsigned-wininet-embedded-header-api-profile
  - id: micro-behaviors/data/format/mime::wildcard-application-mime
  - id: objectives/persistence/system/scheduled-task::python-appdata-self-deleting-archive-task-loader
  - id: objectives/execution/payload/script-eval::python-base64-gzip-exec-with-error-cover
  - id: micro-behaviors/process/terminate/kill/
  - id: micro-behaviors/process/create/hidden/
  - id: micro-behaviors/process/argument/option::hidden-console-execution
  - id: micro-behaviors/os/registry/manipulate/
  - id: micro-behaviors/os/registry/delete::managed-registry-delete-value-references
  - id: micro-behaviors/os/registry/delete::sh-delete-key-w
  unless:
  - id: windows-hosts-security-sinkhole
  - id: metadata/signed/platform/
  - id: metadata/binary/installer/family/
- id: openwrt-hosts-update-blocking
  desc: OpenWrt hosts blocks update domains
  crit: hostile
  conf: 0.96
  platforms: [openwrt]
  for: [class]
  all:
    - id: micro-behaviors/fs/path/config/system::config-hosts-bytecode
    - id: micro-behaviors/fs/path/config/system::hidden-hosts-backup-bytecode
    - id: metadata/file/policy/config/services::openwrt-update-domain-bytecode
- id: hosts-av-null-route
  desc: 0.0.0.0 null-route targeting AV vendor
  crit: suspicious
  conf: 0.93
  any:
  - id: malwarebytes-kaspersky-null-route
  - id: eset-mcafee-symantec-null-route
  - id: avast-avg-bitdefender-sophos-null-route
  - id: kaspersky-trendmicro-fsecure-null-route
  - id: hosts-escan-null-route
- id: hosts-managed-av-block
  desc: Scripted managed block for AV domains in hosts
  crit: hostile
  conf: 0.97
  all:
  - id: micro-behaviors/fs/path/config/system::hosts-file-path
  - id: hosts-av-null-route
  any:
  - id: hosts-managed-block-marker
  - id: hosts-null-route-comment
  - id: hosts-null-route-target-comment
  - id: av-hosts-block-manage-token
- id: hosts-security-null-route-write
  desc: Writes hosts null-route for security updates
  crit: hostile
  conf: 0.97
  all:
  - id: micro-behaviors/fs/path/config/system::hosts-file-path
  - id: hosts-av-null-route
  any:
  - id: micro-behaviors/fs/write/file/redirect::batch-append-redirect
  - id: micro-behaviors/fs/path/config/system::hosts-file-modification-api-set
# `count_min` so the rule means what its name says. Both legs are *notable*
# single-line matchers -- `127\.0\.0\.1\s+\S+\.(com|net|org)` matches one
# hosts entry -- and a bare `any:` over them was reported as "bulk" blocking at
# suspicious. Apache APISIX's ci/common.sh appends three test hostnames
# (test.com, admin.apisix.dev) so its CI can resolve them; that is one line at
# a time, not a block list. The consuming composites still pair this with
# `security-domain`, which is where the sinkhole claim lives.
- id: script-hosts-mining-pool-sinkhole
  desc: Script sinkholes mining pools via hosts
  crit: hostile
  conf: 0.97
  for: [lua, shell, python, perl, ruby, php, scripts]
  near_lines: 20
  all:
    - id: micro-behaviors/fs/path/config/system::config-hosts
    - id: localhost-mining-pool-redirect
  any:
    - id: micro-behaviors/fs/write/file/append::lua-open-append-mode
    - id: micro-behaviors/fs/write/file/target::hosts-file-append
- id: windows-hosts-overwrite-download
  # hosts-file-path (micro-behaviors/fs/path/config/system) is scoped to
  # [scripts, binaries] and structurally cannot fire on CSharp source, so it
  # was a dead required leg that made this composite unreachable (ft-impossible).
  # windows-hosts-webrequest-create + windows-hosts-filestream-create already
  # pin this to the exact this.dirho/this.verurl() download-and-write flow.
  desc: Remote download overwrites hosts
  crit: hostile
  conf: 0.98
  platforms:
  - windows
  for:
  - csharp
  all:
  - id: windows-hosts-webrequest-create
  - id: windows-hosts-filestream-create
- id: windows-hosts-timer-refresh
  # windows-hosts-file (micro-behaviors/fs/path/config/system) is scoped to
  # [scripts, binaries] and structurally cannot fire on CSharp source, so it
  # was a dead required leg (ft-impossible). Dropping it also drops the
  # generic hidden-hosts-refresh-counter alternative from `any:`, since a bare
  # winforms timer counter is not hosts-specific on its own; hidden-hosts-
  # refresh-call already names the "downhost" method, keeping this precise.
  desc: Timer refreshes downloaded hosts
  crit: suspicious
  conf: 0.95
  platforms:
  - windows
  for:
  - csharp
  all:
  - id: metadata/lang/compiler/source::winforms-timer-source
  - id: hidden-hosts-refresh-call
