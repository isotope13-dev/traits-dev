      - id: metadata/file/profile/process/launch::temp-unpacked-python-runtime-launch
      - id: metadata/file/profile/process/launch::winpython-pythonw-run-key-clues
      - id: objectives/execution/payload/file-exec/spawn/fetch::obfuscated-wsh-counter-exe-dropper-v2
      - id: objectives/execution/payload/file-exec/spawn/fetch::obfuscated-wsh-http-exe-dropper
      - id: objectives/execution/payload/file-exec/spawn/fetch::obfuscated-wsh-http-exe-download-launch
