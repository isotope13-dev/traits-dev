defaults:
  platforms: [windows]
  for: [batch]
  attack: T1565.001
  mbc: F0004

composite_rules:
  - id: batch-nslookup-hosts-overwrite
    desc: Batch DNS lookup overwrites hosts file
    crit: hostile
    conf: 0.97
    all:
      - id: micro-behaviors/communications/dns/cli::nslookup
      - id: micro-behaviors/fs/path/config/system::windows-hosts-file
      - id: micro-behaviors/fs/write/file/redirect::batch-append-redirect
