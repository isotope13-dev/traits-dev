# Hosts mappings and nearby vendor names can suggest redirection, but neither
# a public address nor proximity establishes ownership of the destination.
# The IP and the name share one line: the separator is a space or tab.
# `\s` also matches newlines, so a blocklist of bare addresses (one IP per
# line) was read as `IP<newline>next-token` hosts entries. URLHaus's online
# list is that shape and also names the AV domains it blocks.
# The neutral mapping observation lives in micro-behaviors/network/dns. It
# requires a dotted hostname and a validated external IPv4 on the same line.
defaults:
  platforms: [windows, unix]
  for: [text, batch]
traits:
  # Search-infrastructure pharming: a hosts line maps a search-engine
  # lookalike search domain to an address. This may be a redirector table,
  # but can also be research or a local override.
  - id: search-lookalike-hosts-target
    desc: Hosts entry targets a search-lookalike domain
    crit: suspicious
    conf: 0.93
    if:
      type: text
      # The dotted quad is written loosely here; the composites pair
      # this atom with the public-IP hosts mapping, which enforces real octets and
      # excludes loopback, so a researcher's 127.0.0.1 sinkhole stays at this
      # atom's suspicious level.
      regex: '(?im)^[ \t]*\d+\.\d+\.\d+\.\d+[ \t]+\S*(x-?google|gogle|gooogle)\S*\.[a-z]'
  - id: search-lookalike-hosts-target-multi
    desc: Multiple search-lookalike hosts mappings
    crit: notable
    conf: 0.92
    count_min: 2
    if:
      id: search-lookalike-hosts-target
composite_rules:
  - id: security-domain-attacker-ip-redirect
    desc: Public hosts mapping near security vendor name
    crit: suspicious
    conf: 0.95
    attack: T1565.001
    # The IP and the name share one hosts line; without proximity a large
    # text corpus (OID dotted quads far from an unrelated 360.cn address)
    # assembles a redirect that was never written.
    near_bytes: 256
    all:
      - id: micro-behaviors/network/dns::public-ip-hosts-mapping
      - id: metadata/lang/natural/vocabulary/security::antivirus-name-or-domain-text
  - id: search-lookalike-pharming-redirect
    desc: Search-lookalike hosts entry near public IP mapping
    crit: notable
    conf: 0.97
    attack: T1565.001
    # Batch-classified files only ever carry hosts lines echo-wrapped
    # (`echo ip name >> hosts`), which the lookalike atom's line anchor
    # cannot see, so text is the whole realizable scope.
    for: [text]
    near_bytes: 256
    all:
      - id: micro-behaviors/network/dns::public-ip-hosts-mapping
      - id: search-lookalike-hosts-target
  - id: search-pharming-redirect-table
    desc: Multiple lookalike hosts entries near public IP mapping
    crit: notable
    conf: 0.96
    attack: T1565.001
    for: [text]
    near_bytes: 256
    all:
      - id: micro-behaviors/network/dns::public-ip-hosts-mapping
      - id: search-lookalike-hosts-target-multi
