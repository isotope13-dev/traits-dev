# Pharming redirects: hosts lines sending security domains to a
# third-party IP instead of loopback. Blocking maps a name to nowhere;
# pointing an AV update domain at 219.235.3.16-style attacker infrastructure
# positions the attacker to serve the updates themselves (Qhost-style).
# The IP and the name share one line: the separator is a space or tab.
# `\s` also matches newlines, so a blocklist of bare addresses (one IP per
# line) was read as `IP<newline>next-token` hosts entries. URLHaus's online
# list is that shape and also names the AV domains it blocks.
# First octet is 1-229 except 107, 117, and 127. 0.x and loopback stay out;
# 224-229 remain so the alternation stays within three pipes.
defaults:
  platforms: [windows, unix]
  for: [text, batch]
traits:
  - id: public-ip-hosts-entry
    desc: Public IP hosts entry line
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?m)^\s*([1-9]\d?|1[0-2][0-689]|1[3-9]\d|2[0-2]\d)\.\d+\.\d+\.\d+[ \t]+\S'
composite_rules:
  - id: security-domain-attacker-ip-redirect
    desc: Security domain points at attacker IP
    crit: hostile
    conf: 0.95
    attack: T1565.001
    all:
      - id: public-ip-hosts-entry
      - id: cn-av-domain-target
