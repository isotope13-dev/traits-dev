# Pharming redirects: hosts lines sending security domains to a
# third-party IP instead of loopback. Blocking maps a name to nowhere;
# pointing an AV update domain at 219.235.3.16-style attacker infrastructure
# positions the attacker to serve the updates themselves (Qhost-style).
# The IP and the name share one line: the separator is a space or tab.
# `\s` also matches newlines, so a blocklist of bare addresses (one IP per
# line) was read as `IP<newline>next-token` hosts entries. URLHaus's online
# list is that shape and also names the AV domains it blocks.
# First octet is 1-229 except 107, 117, and 127. 0.x and loopback stay out;
# 224-229 remain so the alternation stays within three pipes.
defaults:
  platforms: [windows, unix]
  for: [text, batch]
traits:
  - id: public-ip-hosts-entry
    desc: Public IP hosts entry line
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?m)^\s*([1-9]\d?|1[0-2][0-689]|1[3-9]\d|2[0-2]\d)\.\d+\.\d+\.\d+[ \t]+\S'
  # Search-infrastructure pharming: a hosts line maps a search-engine
  # lookalike or substitute search domain to a resolved address. Legitimate
  # hosts overrides pin corporate or staging names, not branded search
  # lookalikes; this is the redirector-table shape the Qhost family ships.
  # Loopback matches stay here at suspicious (a researcher sinkholing a
  # lookalike through /etc/hosts); the hostile composites below additionally
  # require the non-loopback public-IP mapping.
  - id: search-lookalike-hosts-target
    desc: Hosts entry targets a search-lookalike domain
    crit: suspicious
    conf: 0.93
    if:
      type: text
      # The dotted quad is written loosely here; the hostile composites pair
      # this atom with public-ip-hosts-entry, which enforces real octets and
      # excludes loopback, so a researcher's 127.0.0.1 sinkhole stays at this
      # atom's suspicious level.
      regex: '(?im)^\s*\d+\.\d+\.\d+\.\d+[ \t]+\S*(x-?google|new-search|gogle|gooogle)\S*\.[a-z]'
  - id: search-lookalike-hosts-target-multi
    desc: Multiple search-lookalike hosts mappings
    crit: notable
    conf: 0.92
    count_min: 2
    if:
      id: search-lookalike-hosts-target
composite_rules:
  - id: security-domain-attacker-ip-redirect
    desc: Security domain points at attacker IP
    crit: hostile
    conf: 0.95
    attack: T1565.001
    # The IP and the name share one hosts line; without proximity a large
    # text corpus (OID dotted quads far from an unrelated 360.cn address)
    # assembles a redirect that was never written.
    near_bytes: 256
    all:
      - id: public-ip-hosts-entry
      - id: cn-av-domain-target
  - id: search-lookalike-pharming-redirect
    desc: Search-lookalike domain points at hard-coded IP
    crit: hostile
    conf: 0.97
    attack: T1565.001
    # Batch-classified files only ever carry hosts lines echo-wrapped
    # (`echo ip name >> hosts`), which the lookalike atom's line anchor
    # cannot see, so text is the whole realizable scope.
    for: [text]
    near_bytes: 256
    all:
      - id: public-ip-hosts-entry
      - id: search-lookalike-hosts-target
  - id: search-pharming-redirect-table
    desc: Multiple search domains pinned in hosts
    crit: hostile
    conf: 0.96
    attack: T1565.001
    for: [text]
    near_bytes: 256
    all:
      - id: public-ip-hosts-entry
      - id: search-lookalike-hosts-target-multi
