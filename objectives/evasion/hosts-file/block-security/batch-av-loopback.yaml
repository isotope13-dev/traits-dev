defaults:
  platforms: [windows]
  for: [batch]

composite_rules:
  - id: batch-write-antivirus-loopback-hosts
    desc: Writes antivirus loopback mappings to hosts
    crit: hostile
    conf: 0.98
    near_lines: 0
    all:
      - id: micro-behaviors/fs/config/system::batch-antivirus-loopback-entry
      - id: micro-behaviors/fs/write/file/target::hosts-file-append
