# Bulk loopback blocklists: hosts payloads null-routing hundreds of domains.
#
# Ad-block hosts files also map names to loopback, so volume alone never
# convicts: this fires only when the same payload redirects security-vendor
# update domains (AV, 360safe) into the blocklist, which is defense evasion
# (Qhost-style), not ad blocking.
defaults:
  platforms: [windows, unix]
  for: [text, batch]
traits:
  - id: loopback-hosts-entry
    desc: Loopback hosts redirect entry
    crit: notable
    conf: 0.88
    count_min: 100
    if:
      type: text
      regex: '(?m)^\s*127\.\d{1,3}\.\d{1,3}\.\d{1,3}\s+\S'
  - id: cn-av-domain-target
    desc: Chinese AV domain redirect target
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)(360safe\.com|360\.cn|kav2008)'
composite_rules:
  - id: bulk-loopback-security-block
    desc: Bulk hosts block of security domains
    crit: hostile
    conf: 0.96
    attack: T1562.001
    all:
      - id: loopback-hosts-entry
    any:
      - id: objectives/evasion/hosts-file/block-security::av-update-domain-a
      - id: objectives/evasion/hosts-file/block-security::av-update-domain-b
      - id: objectives/evasion/hosts-file/block-security::av-update-domain-c
      - id: cn-av-domain-target
