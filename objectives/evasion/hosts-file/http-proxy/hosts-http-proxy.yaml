defaults:
  for: [pe]
  platforms: [windows]

composite_rules:
  - id: hosts-hijack-local-http-proxy
    desc: Modifies Windows hosts file while binding HTTP port 80
    crit: hostile
    conf: 0.85
    attack: T1565.001
    all:
      - id: micro-behaviors/fs/path/config/network::windows-hosts-relative-path
      - id: micro-behaviors/communications/http/server/listener::bind-port-80
