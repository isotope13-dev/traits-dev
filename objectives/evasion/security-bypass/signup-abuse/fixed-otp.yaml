# Fixed one-time codes entered into verification boxes. A script that pads a
# constant code to six digits and splits it across single-digit inputs can
# clear an SMS challenge without the applicant's phone. QA tooling can do the
# same, so this stays suspicious; the lender-specific composite is hostile.

defaults:
  for: [javascript]
  platforms: [windows, unix]

traits:
  - id: fixed-otp-literal
    desc: Six-digit fixed verification code literal
    crit: notable
    if:
      type: literal
      kind: string
      exact: "123456"

  - id: otp-pad-split-fill
    desc: Pads code to six digits, then splits
    crit: notable
    if:
      type: text
      substr: 'padEnd(6, "0").slice(0, 6).split'

composite_rules:
  - id: fixed-otp-entry
    desc: Enters a constant code into split verification boxes
    crit: suspicious
    all:
      - id: fixed-otp-literal
      - id: otp-pad-split-fill
