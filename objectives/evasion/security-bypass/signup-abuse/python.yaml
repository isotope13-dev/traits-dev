# Automated disposable-email signup with OTP handling is account farming,
# not ordinary API integration. Require both sides of the workflow and the
# target account-creation flow so a Mail.tm client or an OpenAI SDK alone does
# not match.
defaults:
  platforms: [unix, windows]
  for: [python]

composite_rules:
  - id: disposable-email-openai-account-farming
    desc: OpenAI signup via disposable email and OTP
    crit: hostile
    conf: 0.99
    all:
      - id: micro-behaviors/communications/http/services/mail-tm::api-host
      - id: micro-behaviors/communications/http/services/mail-tm::account-create-route
      - id: micro-behaviors/communications/http/services/mail-tm::message-list-route
      - id: micro-behaviors/communications/http/services/mail-tm::message-read-route
      - id: micro-behaviors/communications/http/services/openai::passwordless-otp-endpoint
      - id: micro-behaviors/communications/http/services/openai::email-otp-validation-endpoint
      - id: micro-behaviors/communications/http/services/openai::account-creation-endpoint
