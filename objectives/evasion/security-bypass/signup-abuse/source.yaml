# Account farming is established by joining the disposable mailbox lifecycle
# to a target signup lifecycle. Route fragments are deliberately weak atoms;
# the Mail.tm host and OpenAI endpoints provide the service context.
defaults:
  conf: 0.99
  platforms: [unix, windows]
  for: [scripts, source]

traits:
  - id: firebase-validation-account-marker
    desc: Generated Gmail signup-validation address
    crit: notable
    if:
      type: text
      substr: 'validate-{int(ts*1000)}@gmail.com'

  - id: firebase-validation-password-marker
    desc: Fixed signup-validation password
    crit: notable
    if:
      type: text
      substr: ValidateTest1!@

composite_rules:
  - id: disposable-email-openai-account-farming
    desc: Automates OpenAI signup through disposable email verification
    crit: hostile
    all:
      - id: micro-behaviors/communications/http/services/mail-tm::disposable-mail-account-inbox-lifecycle
      - id: micro-behaviors/communications/http/services/openai::account-password-registration-endpoint
      - id: micro-behaviors/communications/http/services/openai::email-otp-send-endpoint
      - id: micro-behaviors/communications/http/services/openai::email-otp-validation-endpoint
      - id: micro-behaviors/communications/http/services/openai::account-creation-endpoint

  - id: sentinel-assisted-openai-account-farming
    desc: Uses OpenAI Sentinel tokens to automate disposable-email signup
    crit: hostile
    all:
      - id: disposable-email-openai-account-farming
      - id: micro-behaviors/communications/http/services/openai::sentinel-request-endpoint
      - id: micro-behaviors/communications/http/services/openai::sentinel-token-header
      - id: micro-behaviors/communications/http/services/openai::sentinel-account-token-header
      - id: micro-behaviors/communications/http/services/openai::account-authorize-continue-endpoint

  - id: disposable-email-openai-oauth-provisioning
    desc: Provisions disposable-email OpenAI identities and extracts OAuth token pairs
    crit: hostile
    all:
      - id: micro-behaviors/communications/http/services/mail-tm::api-host
      - id: micro-behaviors/communications/http/services/mail-tm::message-read-route
      - id: micro-behaviors/communications/http/services/openai::account-password-registration-endpoint
      - id: micro-behaviors/communications/http/services/openai::account-creation-endpoint
      - id: micro-behaviors/communications/http/services/openai::oauth-token-endpoint
      - id: micro-behaviors/communications/http/token-auth::access-refresh-token-pair

  - id: public-proxy-firebase-signup-validation
    desc: Validates public proxies by submitting generated Firebase signup requests
    crit: hostile
    scope: file
    all:
      - id: micro-behaviors/communications/http/request/proxy::public-proxy-list-url
      - id: firebase-validation-account-marker
      - id: firebase-validation-password-marker
      - id: micro-behaviors/communications/http/services/firebase::firebase-auth-signup-endpoint

  # A third-party client that registers brand-new WhatsApp accounts over the
  # mobile API. Only the official apps are meant to reach these endpoints;
  # outside them the exchange is how bulk-messaging and scam operations farm
  # numbers without handsets. Suspicious, not hostile: the host running it is
  # the operator, not a victim.
  - id: whatsapp-headless-account-registration
    desc: Registers WhatsApp accounts without the official app
    crit: suspicious
    conf: 0.9
    attack: T1585
    for: [javascript, typescript, python, go, java, kotlin]
    all:
      - id: micro-behaviors/communications/messaging/register::mobile-registration-host
      - id: micro-behaviors/communications/messaging/register::registration-endpoint-request
