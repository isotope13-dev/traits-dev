# Phone and mailbox verification bought from third-party services so that a
# registration flow can pass "one real person, one account" checks. A rental
# client orders a number and polls it for the SMS code. A disposable inbox
# supplies the email OTP. The rental-and-poll pair is suspicious by itself, since
# QA tools and carrier test suites use the same calls. Bulk registration that
# also reads a disposable inbox is the account-farm shape.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  attack: T1656

traits:
  - id: sms-number-rental-order
    desc: Rents a one-time phone number for SMS
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '/user/buy/activation/|getNumberV2|getNumber\?service='

  - id: sms-code-rental-poll
    desc: Polls rental service for SMS code
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '/user/check/[^\s"''`]{1,40}|getStatusV2|getStatus\?id='

  - id: disposable-inbox-otp-read
    desc: Reads signup codes from a disposable inbox
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '/api/inbox/\S|/api/addresses\b'

composite_rules:
  - id: javascript-sms-rental-code-poll
    desc: Orders a rental number and polls it for a verification code
    crit: suspicious
    conf: 0.9
    all:
      - id: sms-number-rental-order
      - id: sms-code-rental-poll

  - id: javascript-signup-farm-phone-and-inbox
    desc: Rental phone verification and disposable inbox OTP in one archive
    crit: hostile
    conf: 0.93
    scope: archive
    for: [npm, tar, package.json, javascript, typescript]
    all:
      - id: sms-number-rental-order
      - id: disposable-inbox-otp-read
      - id: sms-code-rental-poll
