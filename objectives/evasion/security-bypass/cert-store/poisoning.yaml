# These API combinations expose certificate manipulation capabilities, but
# also occur in general-purpose interop libraries and certificate utilities.
defaults:
  platforms: [windows]
  for: [pe, dll]
  crit: suspicious
  conf: 0.95
traits:
  - id: cert-unregister-physical-store
    desc: Unregister physical cert store via API
    crit: notable
    conf: 0.9
    if:
      type: symbol
      exact: CertUnregisterPhysicalStore
    unless:
      - id: metadata/lang/upstream::windows-system-implementer-dll
composite_rules:
  - id: cert-store-poisoning
    desc: Certificate creation and store API surface
    crit: notable
    conf: 0.95
    all:
      - id: micro-behaviors/crypto/certificate/usage::cert-create-self-sign
      - id: micro-behaviors/crypto/certificate/store::cert-add-to-store
    any:
      - id: micro-behaviors/data/codec::crypt-string-to-binary-w
      - id: micro-behaviors/crypto/certificate/store::crypt-msg-open-to-decode
      - id: cert-unregister-physical-store
    needs: 2
    unless:
      - id: metadata/signature/verified/
      # Wine and ReactOS builtins implement these APIs and carry the same
      # create-self-sign, add-to-store, and string-codec imports; they provide
      # the API rather than abuse it (wine-11.18 crypt32.dll).
      - id: metadata/lang/upstream::windows-system-implementer-dll
  - id: cert-store-manipulation-surface
    desc: Certificate store manipulation API surface
    crit: notable
    conf: 0.92
    all:
      - id: micro-behaviors/crypto/certificate/usage::cert-create-self-sign
      - id: micro-behaviors/crypto/certificate/store::cert-add-to-store
      - id: cert-unregister-physical-store
    any:
      - id: micro-behaviors/data/codec::crypt-string-to-binary-w
      - id: micro-behaviors/crypto/certificate/store::crypt-msg-open-to-decode
    needs: 2
    unless:
      - id: metadata/signature/verified/
