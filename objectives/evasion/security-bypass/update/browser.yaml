# Browser auto-update sabotage
# Detects code that weaponises legitimate Chromium / Edge / Firefox CLI flags
# to permanently disable or simulate an absent update channel.
# ATT&CK: T1562.001 (Impair Defenses: Disable or Modify Tools)
defaults:
  platforms: [windows, unix]
  for: [scripts, binaries]
  attack: T1562.001
  mbc: F0004
traits:
  - id: future-outdated-sentinel
    desc: Suspiciously distant outdated-sentinel date
    crit: component
    conf: 0.85
    if:
      type: text
      regex: \b(01|1)\s+Jan\s+21\d{2}\b
composite_rules:
  - id: chrome-auto-update-disabled
    desc: Chrome auto-update suppression flags
    crit: notable
    conf: 0.96
    all:
      - id: micro-behaviors/os/application/config::chrome-simulate-outdated-no-au-flag
    any:
      - id: future-outdated-sentinel
      - id: micro-behaviors/os/application/config::chrome-disable-component-update-flag
      - id: micro-behaviors/os/application/config::chrome-disable-background-networking-flag
  # `browser-update-channel-tamper` removed. It was a bare `any:` over the
  # single notable atom `chrome-disable-component-update-flag`, adding no
  # filtering, so it fired wherever that flag appeared and merely relabelled it
  # "tampering". Every headless-browser launcher passes the flag -- chromium-bidi
  # BrowserInstance.js, playwright-core's electron loader, Next.js server chunks.
  # The flag is still reported there at `notable`, and `browser-update-tamper`
  # above still convicts the real pattern, which needs --simulate-outdated-no-au
  # alongside a second update-suppressing flag. Nothing referenced it.

  - id: edge-update-channel-tamper
    desc: Edge auto-update disabled via CLI
    crit: suspicious
    conf: 0.9
    all:
      - id: micro-behaviors/os/application/config::edge-disable-auto-update-flag
      - id: micro-behaviors/os/application/target/browser::msedge-executable-name
    # The flag spelling also appears in unrelated build tooling (e.g. npm
    # build --disable-auto-update) and msedge in browser-launch tables, so
    # the pair only means one Edge invocation when adjacent in one command.
    near_bytes: 512
    downgrade:
      any:
        - id: well-known/app/system/nezha/
        - id: micro-behaviors/communications/url/host/domain-http::ssss-nyc-mn
        - type: text
          substr: "NEZHA_SERVER"
