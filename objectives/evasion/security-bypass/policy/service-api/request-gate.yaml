# Detects request rewriting that supplies an API-required field after a
# documented rejection, bypassing a service-side request gate.
defaults:
  for: [javascript, typescript]
  platforms: [unix, windows]
traits:
  - id: free-tier-term
    desc: Free-tier wording in source
    crit: component
    conf: 0.82
    if:
      type: text
      regex: '(?i)\bfree[- ]tier\b'
  - id: tools-api-field-term
    desc: Tools API field wording in source
    crit: component
    conf: 0.82
    if:
      type: text
      regex: '(?i)\b(tools|tool_choice)\b'
  - id: http-denial-term
    desc: HTTP forbidden status or wording in source
    crit: component
    conf: 0.82
    if:
      type: text
      regex: '(?i)\b(403|forbidden)\b'
  - id: insert-required-tools-on-empty-request
    desc: Inserts missing request tools
    crit: notable
    conf: 0.88
    if:
      type: text
      regex: '(?is)Array\.isArray.{0,40}\.tools.{0,100}\.tools\s*='
composite_rules:
  - id: free-tier-request-rejection
    desc: Free-tier tools gate rejection
    crit: suspicious
    conf: 0.9
    all:
      - id: free-tier-term
      - id: tools-api-field-term
      - id: http-denial-term
    near_bytes: 1024
  - id: bypass-free-tier-tools-gate
    desc: Rewrites requests to bypass an API free-tier tools gate
    crit: hostile
    conf: 0.96
    all:
      - id: free-tier-request-rejection
      - id: insert-required-tools-on-empty-request
