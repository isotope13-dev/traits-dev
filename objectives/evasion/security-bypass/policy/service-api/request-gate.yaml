# Detects request rewriting that supplies an API-required field after a
# documented rejection, bypassing a service-side request gate.
defaults:
  for: [javascript, typescript]
  platforms: [unix, windows]
traits:
  - id: free-tier-request-rejection
    desc: Free-tier tools gate rejection
    crit: suspicious
    conf: 0.9
    if:
      type: text
      # Require complete error and API-field words. This avoids matching
      # identifiers such as MathJax's ForbiddenMathtoolsSet exception name.
      regex: '(?i)(\b403\b|\bforbidden\b|\bfree[- ]tier\b).{0,100}\b(tools|tool_choice)\b'
  - id: insert-required-tools-on-empty-request
    desc: Inserts missing request tools
    crit: notable
    conf: 0.88
    if:
      type: text
      regex: '(?is)Array\.isArray.{0,40}\.tools.{0,100}\.tools\s*='
composite_rules:
  - id: bypass-free-tier-tools-gate
    desc: Rewrites requests to bypass an API free-tier tools gate
    crit: hostile
    conf: 0.96
    all:
      - id: free-tier-request-rejection
      - id: insert-required-tools-on-empty-request
