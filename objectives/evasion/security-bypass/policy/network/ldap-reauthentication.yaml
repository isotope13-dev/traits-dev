defaults:
  platforms: [unix, windows]
  for: [scripts, source]
  crit: hostile
  conf: 0.98

composite_rules:
  # The structural leg requires the same concatenated bind/modify record to
  # be protected and sent. Ordinary signed clients sending separate records,
  # or merely importing the ASN.1 classes, do not meet this condition.
  - id: ntlm-ldap-signed-record-reauthentication
    desc: NTLM LDAP rebind stacks a protected modification
    attack: T1557.001
    all:
      - id: micro-behaviors/os/security/directory-service::protected-bind-modify-send
      - id: micro-behaviors/os/security/directory-service::ldap-bind-request-constructor
      - id: micro-behaviors/os/security/directory-service::ldap-modify-request-constructor
      - id: micro-behaviors/os/security/directory-service::sasl-gss-spnego-mechanism
      - id: micro-behaviors/os/security/auth/ntlm::ntlm-authenticate-message-constructor
