# A JavaScript Frida agent that hooks a registry read and reports ProxyEnable as
# zero to the caller. The injected process then ignores the system proxy the
# user configured, so its traffic skips that proxy. The composite needs the
# native Interceptor hook as well as both names, so a plain mention of the
# value in documentation or a configuration tool does not match.
defaults:
  for: [javascript]
  platforms: [windows]
  attack: T1090
  crit: suspicious
  conf: 0.85

composite_rules:
  - id: frida-agent-proxy-enable-override
    desc: Frida agent forces ProxyEnable reads to zero
    crit: suspicious
    conf: 0.85
    scope: file
    all:
      - id: micro-behaviors/process/hook/instrumentation::frida-native-interceptor-hook
      - id: micro-behaviors/communications/proxy/system::js-proxy-enable-value-name
      - id: micro-behaviors/os/registry/read::js-reg-query-value-w-name
