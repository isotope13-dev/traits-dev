defaults:
  platforms: [unix]
  for: [shell, scripts, source]
  attack: T1562.001

traits:
  - id: curl-bypass-all-proxies
    desc: curl bypasses every configured proxy
    crit: suspicious
    conf: 0.96
    if:
      type: text
      regex: '\bcurl\b[^\n]{0,160}--noproxy(\s+|=)([''\"]\*[''\"]|\\\*)'
