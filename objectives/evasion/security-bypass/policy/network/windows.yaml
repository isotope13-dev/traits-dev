defaults:
  platforms: [windows]
  for: [batch, powershell, scripts]
  attack: "T1562"
traits:
  - id: enable-smb1-protocol
    desc: Enables SMB1 protocol
    crit: suspicious
    conf: 0.9
    if:
      type: text
      regex: Enable-WindowsOptionalFeature.{0,120}SMB1Protocol
      case_insensitive: true
  - id: lsa-anonymous-loosen
    desc: Loosens LSA anonymous access
    crit: suspicious
    conf: 0.9
    if:
      type: text
      regex: EveryoneIncludesAnonymous.{0,80}/d\s+1|RestrictAnonymous.{0,80}/d\s+0
      case_insensitive: true
  - id: everyone-includes-anonymous-value
    desc: EveryoneIncludesAnonymous LSA registry value
    crit: notable
    conf: 0.9
    for: [c, cpp, pe, dll]
    if:
      type: text
      word: EveryoneIncludesAnonymous
  - id: null-session-pipes-value
    desc: NullSessionPipes SMB registry value
    crit: notable
    conf: 0.9
    for: [c, cpp, pe, dll]
    if:
      type: text
      word: NullSessionPipes
  - id: create-named-pipe-source
    desc: CreateNamedPipeW source call
    crit: notable
    conf: 0.88
    for: [c, cpp]
    if:
      type: symbol
      exact: CreateNamedPipeW
composite_rules:
  - id: smb-anonymous-weaken
    desc: SMB anonymous access weakened
    crit: suspicious
    conf: 0.94
    all:
      - id: enable-smb1-protocol
      - id: lsa-anonymous-loosen
  - id: anonymous-named-pipe-smb-open
    desc: Anonymous SMB named-pipe reachability opened
    crit: hostile
    conf: 0.96
    for: [c, cpp]
    attack: T1562.004,T1570
    all:
      - id: everyone-includes-anonymous-value
      - id: null-session-pipes-value
      - id: create-named-pipe-source
      - id: micro-behaviors/os/security/descriptor::world-sid-authority
