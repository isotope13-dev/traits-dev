defaults:
  platforms: [unix, windows]
  for: [php]
  attack: T1027,T1562.001
traits:
  - id: php-hex-redirect-template
    desc: Hex-encoded PHP contains browser redirect
    crit: suspicious
    conf: 0.97
    if:
      type: text
      substr: '646f63756d656e742e6c6f636174696f6e2e687265663d'
  - id: php-hex-unlink-call
    desc: Hex-encoded PHP contains file removal
    crit: notable
    conf: 0.95
    if:
      type: text
      substr: '40756e6c696e6b2824613129'
  - id: php-hex-split-htaccess-name
    desc: Hex-encoded PHP builds htaccess filename
    crit: notable
    conf: 0.97
    if:
      type: text
      substr: '2268222e22746163222e2263222e226573222e227322'
  - id: php-write-template-file
    desc: PHP writes decoded template to file
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: '@?fwrite\(\$h\s*,\s*\$t\)'
composite_rules:
  - id: php-encoded-redirect-access-control-removal
    desc: Encoded PHP redirect removes access controls
    crit: hostile
    conf: 0.97
    all:
      - id: php-hex-redirect-template
      - id: php-hex-unlink-call
      - id: php-hex-split-htaccess-name
      - id: micro-behaviors/data/decode/hex::php-pack-hex-decode
      - id: php-write-template-file
