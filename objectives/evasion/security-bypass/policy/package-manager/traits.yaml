# Package-manager freshness-policy tampering.
#
# npm's `min-release-age` keeps newly published dependency versions out of
# resolution for a configured number of days. Removing that key, or deleting
# the .npmrc that contains it, opens the protected install path. The neutral
# npmrc path/key observations remain in micro-behaviors; this file adds intent
# only when code performs the removal or rewrites the policy-bearing file.
defaults:
  platforms: [unix, windows]
  attack: T1195.002

traits:
  - id: npm-cooldown-delete-command
    desc: Removes npm release-age setting
    crit: suspicious
    conf: 0.97
    for: [javascript, typescript, python, ruby, powershell, batch]
    if:
      type: text
      regex: '(?i)\bnpm(\.cmd)?\s+config\s+delete\s+min-release-age\b'

  - id: npm-cooldown-delete-command-shell
    desc: Shell removes npm release-age setting
    crit: suspicious
    conf: 0.97
    for: [shell]
    platforms: [unix]
    if:
      type: text
      regex: '(?i)\bnpm(\.cmd)?\s+config\s+delete\s+min-release-age\b'

  - id: npm-script-cooldown-delete
    desc: npm script removes release-age setting
    crit: suspicious
    conf: 0.98
    for: [package.json]
    if:
      type: value
      path: 'scripts[*]'
      regex: '(?i)\bnpm(\.cmd)?\s+config\s+delete\s+min-release-age\b'

  - id: npm-script-npmrc-delete
    desc: npm script deletes its npmrc file
    crit: suspicious
    conf: 0.96
    for: [package.json]
    if:
      type: value
      path: 'scripts[*]'
      regex: '(?i)\brm\s+-f\s+[^;&|\n]{0,160}\.npmrc\b'

  - id: node-npm-cooldown-delete-call
    desc: Node launches npm to remove release age
    crit: suspicious
    conf: 0.97
    for: [javascript, typescript]
    if:
      type: tree-sitter
      kind: call
      regex: '(?is)\b(exec|spawn)[A-Za-z]*\s*\([\s\S]{0,220}min-release-age\b'

  - id: python-npm-cooldown-delete-call
    desc: Python launches npm to remove release age
    crit: suspicious
    conf: 0.97
    for: [python]
    if:
      type: tree-sitter
      kind: call
      regex: '(?is)\b(subprocess\.(run|call|check_call)|os\.system)\s*\([\s\S]{0,220}min-release-age\b'

  - id: ruby-npm-cooldown-delete-call
    desc: Ruby launches npm to remove release age
    crit: suspicious
    conf: 0.97
    for: [ruby]
    if:
      type: tree-sitter
      kind: call
      regex: '(?is)\bsystem\s*\([\s\S]{0,180}min-release-age\b'

  - id: node-npmrc-cooldown-filter-write
    desc: Node rewrites npmrc filtering release age
    crit: suspicious
    conf: 0.96
    for: [javascript, typescript]
    if:
      type: tree-sitter
      kind: call
      regex: '(?is)writeFileSync\s*\([\s\S]{0,240}filter\s*\([\s\S]{0,80}min-release-age\b'

  - id: python-npmrc-cooldown-filter-write
    desc: Python rewrites npmrc filtering release age
    crit: suspicious
    conf: 0.95
    for: [python]
    if:
      type: tree-sitter
      kind: call
      regex: '(?is)\b(write_text|open)\s*\([\s\S]{0,220}min-release-age\b'

  - id: ruby-npmrc-cooldown-filter-write
    desc: Ruby rewrites npmrc filtering release age
    crit: suspicious
    conf: 0.95
    for: [ruby]
    if:
      type: tree-sitter
      kind: call
      regex: '(?is)\bFile\.write\s*\([\s\S]{0,220}min-release-age\b'

composite_rules:
  - id: npm-install-hook-removes-cooldown
    desc: Install hook removes npm release-age safeguard
    crit: hostile
    conf: 0.99
    all:
      - id: objectives/supply-chain/install-hook/scripts/lifecycle::has-preinstall
      - id: npm-script-cooldown-delete

  - id: npm-install-hook-deletes-npmrc
    desc: Install hook deletes npm policy file
    crit: hostile
    conf: 0.99
    all:
      - id: objectives/supply-chain/install-hook/scripts/lifecycle::has-preinstall
      - id: npm-script-npmrc-delete

  - id: npmrc-cooldown-policy-removal
    desc: Rewrites npmrc to remove release-age safeguard
    crit: suspicious
    conf: 0.97
    all:
      - id: node-npmrc-cooldown-filter-write
      - id: micro-behaviors/os/package-manager/config::npmrc-user-config-path

  - id: npmrc-cooldown-global-policy-sweep
    desc: Rewrites global npmrc release-age policy
    crit: suspicious
    conf: 0.98
    all:
      - id: node-npmrc-cooldown-filter-write
    any:
      - id: micro-behaviors/os/package-manager/config::npmrc-unix-global-config-path
      - id: micro-behaviors/os/package-manager/config::npmrc-windows-global-config-path
