defaults:
  platforms: [windows]
  for: [powershell]
composite_rules:
  - id: powershell-download-start-policy-bypass
    desc: File download near process start with policy bypass
    crit: suspicious
    conf: 0.95
    all:
    - id: micro-behaviors/communications/http/lib/invoke-webrequest::download
    - id: micro-behaviors/process/create/start-process::start-process-call
    - id: micro-behaviors/communications/http/download/cli::iwr-outfile-download
    - id: micro-behaviors/process/create/flags::powershell-policy-bypass-text
    unless:
    - id: well-known/tool/sysadmin/kubernetes/bootstrap::kubernetes-bootstrap-context
    - id: well-known/tool/sysadmin/kubernetes/bootstrap::kubernetes-windows-gce-ssh-installer-exception
    - id: micro-behaviors/crypto/hash/file::hash-pinned-download-context
    - id: metadata/build/ci/agent::ci-build-dependency-install-context
    near_bytes: 1024
