# OUACtrl dialog automation that bypasses Office security settings. OUACtrl.OCX
# is a signed Office 2000 control for "Show Me" tutorials; script that
# instantiates it, activates the Office window, opens a numeric dialog and
# picks a tab reproduces the documented macro-security downgrade (open the
# security dialog, select the low level, confirm). Tutorials do not drive
# security radio buttons, so the full combination has no legitimate use.
defaults:
  platforms: [windows]
  for: [html]
  attack: T1562.001

composite_rules:
  - id: ouactrl-macro-dialog-bypass
    desc: OUACtrl automation bypasses Office security dialog
    crit: hostile
    conf: 0.97
    all:
      - id: micro-behaviors/os/com/automation::activex-constructor-call
      - id: micro-behaviors/ui/window/automation::showdialog-dialog-id-call
      - id: micro-behaviors/ui/window/automation::selecttabsdm-tab-id-call
      - id: micro-behaviors/ui/window/activation::wsh-appactivate
    near_bytes: 2000
