defaults:
  platforms: [windows]
  for: [go]
  attack: T1059.001
  mbc: E1027
composite_rules:
  - id: go-hidden-powershell-policy-bypass
    desc: Go source hides PowerShell execution-policy bypass
    crit: hostile
    conf: 0.97
    all:
      # Hidden policy bypass alone also occurs in administration tools.
      # Require source padding that conceals the launcher from review.
      - id: objectives/anti-static/obfuscation/instruction/insertion-junk::go-whitespace-padded-powershell-launch
      - id: micro-behaviors/process/create/subprocess::go-exec-command-call
      - id: micro-behaviors/process/create/subprocess::go-powershell-launch-call
      - id: micro-behaviors/process/create/subprocess::go-powershell-command
      - id: micro-behaviors/process/argument/option::powershell-policy-bypass-flag
      - id: micro-behaviors/process/create/start-process::go-powershell-start-process
      - id: micro-behaviors/process/create/hidden::argv-array-windowstyle-hidden
    unless:
      - id: metadata/package/testing/harness/runtime/
