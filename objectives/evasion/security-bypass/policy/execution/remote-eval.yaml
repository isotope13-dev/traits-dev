defaults:
  platforms: [windows]
  for: [powershell]

composite_rules:
  - id: powershell-process-bypass-with-remote-eval
    desc: Process policy bypass with REST response eval
    crit: suspicious
    conf: 0.96
    all:
      - id: micro-behaviors/os/security/policy::powershell-process-policy-bypass-command
    any:
      - id: micro-behaviors/process/deploy/script-eval::powershell-nested-rest-response-eval
      - id: micro-behaviors/process/deploy/script-eval::powershell-rest-response-evaluator-call
    near_lines: 40
    unless:
      - id: well-known/tool/sysadmin/chocolatey::official-profile-provisioner
