defaults:
  platforms: [windows, unix]
  for: [powershell, batch, shell, pe, dll]
  attack: T1059.001
  mbc: E1027
traits:
  - id: executionpolicy-set-scope-process
    desc: Set-ExecutionPolicy process-scope marker
    crit: notable
    conf: 0.8
    if:
      type: text
      substr: Set-ExecutionPolicy Bypass -Scope Process -Force
  - id: executionpolicy-dp0-file
    desc: Batch-local PowerShell file marker
    crit: notable
    conf: 0.8
    if:
      type: text
      substr: '-File "%~dp0'
      case_insensitive: true
  - id: executionpolicy-jbang-wrapper
    desc: JBang PowerShell wrapper marker
    crit: notable
    conf: 0.8
    if:
      type: text
      regex: 'jbang\.ps1\s+(version|jdk\s+install)'
  - id: executionpolicy-build-wrapper
    desc: Build wrapper execution-policy marker
    crit: notable
    conf: 0.82
    for: [batch]
    if:
      type: text
      regex: '(?i)(%~dp0(eng[\\/])?|-File\s+(\.[\\/])?)build\.ps1\b'
  - id: executionpolicy-rustup-wrapper
    desc: Rust target setup wrapper marker
    crit: notable
    conf: 0.82
    for: [batch]
    if:
      type: text
      substr: rustup target add
  - id: executionpolicy-sysadmin-template
    desc: SysAdmin template execution-policy marker
    crit: notable
    conf: 0.82
    for: [batch]
    if:
      type: text
      substr: ':PSDownload <URL> <FileLocation>'
  - id: executionpolicy-hardware-tweak-marker
    desc: Hardware tweak execution-policy marker
    crit: notable
    conf: 0.82
    for: [batch]
    if:
      type: text
      regex: '(?i)MSPower_DeviceEnable|Media\.SoundPlayer|EdgeRemover'
  - id: executionpolicy-msys2-shell-wrapper
    desc: MSYS2 installer shell wrapper marker
    crit: notable
    conf: 0.86
    for: [powershell, batch]
    if:
      type: text
      regex: '(?i)msys2_shell\.cmd.{0,200}(-ExecutionPolicy\s+Bypass|pacman\s+-Syuu)'
  - id: executionpolicy-gocross-wrapper
    desc: Go cross tool wrapper marker
    crit: notable
    conf: 0.84
    for: [batch, shell]
    if:
      type: text
      substr: gocross
  - id: executionpolicy-local-script-wrapper
    desc: Local PowerShell script wrapper marker
    crit: notable
    conf: 0.82
    for: [powershell, batch, shell]
    if:
      type: text
      regex: '(?i)-ExecutionPolicy\s+Bypass\s+-File\s+(\.\\|\./)?scripts[/\\]'
  - id: local-script-dir-install-wrapper
    desc: Batch wrapper launches sibling install.ps1
    crit: notable
    conf: 0.9
    for: [batch, powershell]
    if:
      type: text
      regex: '(?i)(%SCRIPT_DIR%|%~dp0)[^"\r\n]{1,48}\.ps1\b'
  - id: documented-executionpolicy-bypass-help
    desc: Documents ExecutionPolicy Bypass in help text
    crit: notable
    conf: 0.88
    for: [powershell, batch]
    if:
      type: text
      regex: '(?im)^[ \t]*(#|Write-Host\b|echo\b).{0,80}-ExecutionPolicy\s+Bypass'
composite_rules:
  - id: benign-executionpolicy-wrapper-context
    desc: Documented local script execution wrapper
    crit: exception
    any:
      - id: executionpolicy-build-wrapper
      - id: executionpolicy-rustup-wrapper
      - id: local-script-dir-install-wrapper
      - id: executionpolicy-local-script-wrapper
      - id: documented-executionpolicy-bypass-help

  - id: powershell-policy-bypass-script
    desc: PowerShell policy bypass launches a script file
    crit: suspicious
    conf: 0.96
    attack: T1059.001,T1562.001
    for: [batch, powershell]
    near_bytes: 256
    all:
      - id: micro-behaviors/process/create/flags::powershell-policy-bypass-flag
      - id: micro-behaviors/process/create/script/file::powershell-script-execution
    unless:
      - id: metadata/build/cmake::cmake-process-file-operations-context
      - id: well-known/dual-use/tunnel/nostr-vpn::benign-e2e-context
      - id: well-known/tool/development/clang-format::windows-wrapper-script
      - id: well-known/tool/sysadmin/kubernetes/bootstrap::kubernetes-windows-gce-ssh-installer-exception
      - id: well-known/app/system/sysmanage::agent-package-context
      - id: well-known/app/system/sysmanage::windows-installer-script-path
      - id: benign-executionpolicy-wrapper-context
      - id: metadata/build/recognized-contexts::cloud-instance-user-data-context

  - id: vendor-named-policy-bypass-script
    desc: Policy bypass launches a vendor-named user-profile script
    crit: hostile
    conf: 0.98
    attack: T1036.005,T1059.001,T1562.001
    for: [batch, powershell]
    near_bytes: 256
    all:
      - id: powershell-policy-bypass-script
      - id: objectives/evasion/masquerade/identity/name::microsoft-like-user-profile-script

  - id: compressed-policy-bypass-stage
    desc: Compressed PowerShell stage uses policy bypass
    crit: hostile
    conf: 0.99
    attack: T1027,T1140,T1059.001
    mbc: B0032,E1059
    all:
      - id: micro-behaviors/data/encode/payload::large-base64-string-literals
      - id: micro-behaviors/data/compress/library::gzip-decompress-to-text
      - id: micro-behaviors/fs/write/file/direct::write-all-text
      - id: micro-behaviors/process/create/start-process::start-process-call
      - id: micro-behaviors/process/create/flags::powershell-policy-bypass-value
    any:
      - id: micro-behaviors/process/create/hidden::start-process-windowstyle-hidden
      - id: micro-behaviors/process/create/shell/interpreter::powershell-executable-token

  - id: bypass-execution-policy
    desc: PowerShell policy bypass with concealed execution
    crit: suspicious
    conf: 0.94
    # Keep the concealment tied to the bypassing invocation. Large deployment
    # assemblies commonly contain both features in unrelated methods.
    near_bytes: 1024
    all:
      - id: objectives/execution/interpreter/script/wsh::execution-policy-bypass
    any:
      - id: micro-behaviors/process/create/hidden/
    unless:
      - id: well-known/tool/sysadmin/win-unattended::signer
      - id: well-known/app/enterprise/microsoft-office-support::microsoft-office-support-bundle-context
      - id: metadata/signed/leaf::microsoft-corporation
      - id: well-known/app/utility/rufus::rufus-official-context
  - id: policy-bypassing-runtime-replacement
    desc: Admin .NET installer bypasses policy and replaces runtime DLL
    crit: hostile
    conf: 0.96
    for: [pe]
    all:
      - id: micro-behaviors/os/privilege/manifest::require-administrator
      - id: objectives/evasion/hijack-execution-flow/dll-hijacking::runtime-dll-backup-name
      - id: micro-behaviors/process/create/spawn::process-token-dotnet
    # `bypass-execution-policy` needs the interpreter name and its switches in
    # one contiguous run of text.  A managed launcher assigns
    # ProcessStartInfo.FileName and .Arguments as two separate metadata
    # strings, so that never holds for exactly the .NET installers this rule
    # names -- accept the bare policy-bypass argument as the alternative.  The
    # precision here comes from the other three legs: an elevated .NET process
    # launcher that also carries a `vcruntime*_backup*.dll` name is displacing
    # the C++ runtime next to somebody else's application.
    needs: 1
    any:
      - id: bypass-execution-policy
      - id: objectives/execution/interpreter/script/wsh::execution-policy-bypass-flag
      - id: objectives/execution/interpreter/script/wsh::execution-policy-bypass-concat
  - id: executionpolicy-known-installer-marker
    desc: Known installer execution-policy marker
    crit: notable
    conf: 0.85
    any:
      - id: executionpolicy-set-scope-process
      - id: executionpolicy-dp0-file
      - id: executionpolicy-jbang-wrapper
      - id: executionpolicy-build-wrapper
      - id: executionpolicy-sysadmin-template
      - id: executionpolicy-hardware-tweak-marker
      - id: executionpolicy-msys2-shell-wrapper
      - id: executionpolicy-gocross-wrapper
      - id: executionpolicy-local-script-wrapper
      - id: micro-behaviors/fs/path/config/app::vm-config-iso-configuration-context
