defaults:
  for: [powershell]
  platforms: [windows]
composite_rules:
  - id: policy-bypass-with-eventlog-clearing
    desc: Execution policy bypass beside .NET event log clearing
    crit: suspicious
    conf: 0.95
    near_bytes: 320
    all:
      - id: micro-behaviors/os/event/log::dotnet-eventlog-clear
    any:
      - id: micro-behaviors/os/security/execution-policy::execution-policy-bypass-short-flag
      - id: micro-behaviors/os/security/execution-policy::execution-policy-bypass-abbrev-flag
      - id: micro-behaviors/os/security/policy::powershell-policy-bypass-text
