# The runtime, boot and encryption-policy controls all constrain unsigned
# execution. Disabling one is suspicious administration, not ransomware proof.
# Match the setting and disabled value in the same command; an unrelated -i 0
# elsewhere must not supply the value for an enable or query operation.
defaults:
  platforms: [unix, windows]
  for: [scripts, source, elf, macho, pe]
  attack: T1562.001

traits:
  - id: esxi-runtime-exec-installed-only-disable
    desc: Sets ESXi runtime execInstalledOnly to zero
    crit: suspicious
    conf: 0.98
    if:
      type: text
      regex: '(?i)advanced[ \t]+set[ \t]+-o[= \t]*/User/execInstalledOnly[ \t]+-i[= \t]*0\b'

  - id: esxi-runtime-exec-installed-only-disable-value-first
    desc: Sets ESXi runtime execution control to zero
    crit: suspicious
    conf: 0.98
    if:
      type: text
      regex: '(?i)advanced[ \t]+set[ \t]+-i[= \t]*0[ \t]+-o[= \t]*/User/execInstalledOnly\b'

  - id: esxi-runtime-exec-installed-only-disable-long
    desc: Disables ESXi execInstalledOnly via long flags
    crit: suspicious
    conf: 0.98
    if:
      type: text
      regex: '(?i)--option[= \t]+/User/execInstalledOnly[ \t]+--int-value[= \t]*0\b'

  - id: esxcli-advanced-set-line-wrap
    desc: Line-wrapped esxcli advanced set prefix
    crit: component
    conf: 0.9
    for: [shell, python, perl, ruby, c, cpp, go]
    if:
      type: text
      regex: '(?i)advanced[ \t]+set([ \t]+(-o|--option))?[ \t]*\\$'

  - id: exec-installed-only-zero-continuation
    desc: Continuation setting execInstalledOnly to zero
    crit: component
    conf: 0.95
    for: [shell, python, perl, ruby, c, cpp, go]
    if:
      type: text
      regex: '(?i)(^|[ \t])/User/execInstalledOnly[ \t]+(-i|--int-value)[= \t]*0\b'

  - id: esxi-boot-exec-installed-only-disable
    desc: Disables ESXi boot execInstalledOnly control
    crit: suspicious
    conf: 0.98
    if:
      type: text
      regex: '(?i)kernel[ \t]+set[ \t]+-s[ \t]+execInstalledOnly[ \t]+-v[ \t]+false\b'

  - id: esxi-encryption-exec-installed-only-disable
    desc: Disables ESXi enforced execution requirement
    crit: suspicious
    conf: 0.98
    if:
      type: text
      regex: '(?i)encryption[ \t]+set[ \t]+--require-exec-installed-only[= ]+false\b'

  # Full command bytes survive even when a long embedded script is omitted
  # from the extracted-string view. Source/script matchers above remain intact.
  - id: native-esxi-runtime-execution-bypass-command
    desc: Embedded ESXi execution-control bypass command
    crit: suspicious
    conf: 0.98
    for: [pe, elf, macho]
    if:
      type: raw
      regex: '(?i)esxcli system settings advanced set -o /User/execInstalledOnly -i ?0\b'
    unless:
      - id: esxi-runtime-exec-installed-only-disable

composite_rules:
  - id: esxi-runtime-exec-installed-only-disable-wrapped
    desc: Sets ESXi runtime execInstalledOnly to zero across wrapped lines
    crit: suspicious
    conf: 0.98
    for: [shell, python, perl, ruby, c, cpp, go]
    near_bytes: 96
    all:
      - id: esxcli-advanced-set-line-wrap
      - id: exec-installed-only-zero-continuation

  - id: esxi-exec-installed-only-disabled
    desc: Disables ESXi unsigned-binary execution enforcement (execInstalledOnly)
    crit: suspicious
    conf: 0.98
    any:
      - id: esxi-runtime-exec-installed-only-disable
      - id: esxi-runtime-exec-installed-only-disable-value-first
      - id: esxi-runtime-exec-installed-only-disable-long
      - id: esxi-runtime-exec-installed-only-disable-wrapped
      - id: esxi-boot-exec-installed-only-disable
      - id: esxi-encryption-exec-installed-only-disable
      - id: native-esxi-runtime-execution-bypass-command
