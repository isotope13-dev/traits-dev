defaults:
  platforms: [windows]
  for: [javascript]
composite_rules:
- id: obfuscated-node-execution-policy-override
  desc: Obfuscated Node script relaxes PowerShell policy
  crit: hostile
  conf: 0.93
  attack: T1059.001,T1027
  all:
  - id: objectives/anti-static/obfuscation/obfuscator/js-obfuscator::javascript-obfuscator-string-array-runtime
  - id: micro-behaviors/os/security/execution-policy::execution-policy-override-flag
  - id: micro-behaviors/data/control-flow/dispatch/named::javascript-exec-call
  - id: micro-behaviors/process/argument/executable::js-powershell-name-literal
