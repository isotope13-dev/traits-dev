# JavaScript that launches PowerShell with -nop -ep bypass -File after
# ActiveX staging. The short-flag bypass alone is notable; combining it with
# ActiveXObject + obfuscation + a remote script URL is hostile.
defaults:
  platforms: [windows]
  for: [javascript]
  attack: T1059.001,T1562.001
  crit: notable
  conf: 0.95

composite_rules:
  - id: obfuscated-js-activex-ep-bypass-file
    desc: Obfuscated ActiveX JS uses PS ep bypass
    crit: hostile
    conf: 0.97
    attack: T1027,T1059.001,T1059.007,T1562.001
    all:
      - id: micro-behaviors/process/interpreter/jscript::activex-object
      - id: micro-behaviors/process/create/flags::powershell-nop-ep-bypass-file-command
      - id: objectives/execution/interpreter/script/wsh::execution-policy-bypass
      - id: objectives/anti-static/obfuscation/obfuscator/js-obfuscator::any-name-mangling
    any:
      - id: micro-behaviors/communications/http/download/url::executable-url-reference-b
      - id: micro-behaviors/communications/http/client/xmlhttp::js-xmlhttp-progid
      - id: micro-behaviors/communications/ip/literal::javascript-external-http-ip-url
    needs: 1
