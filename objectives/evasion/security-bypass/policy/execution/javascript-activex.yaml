# Policy override in a concealed remote-script launch profile. Ordinary
# obfuscated COM automation and file writes do not establish unwanted execution.
defaults:
  platforms: [windows]
  for: [javascript]
  attack: T1027,T1059.001

composite_rules:
  - id: obfuscated-js-activex-policy-bypass
    desc: Obfuscated WSH remote-script launch clues with policy bypass
    crit: hostile
    conf: 0.97
    all:
      - id: micro-behaviors/os/com/automation::activex-constructor-call
      - id: metadata/lang/javascript-features::generated-name-or-state-syntax
      - id: micro-behaviors/fs/write/content::fso-text-file-write-api
      - id: micro-behaviors/communications/http/url/path::executable-url-reference-b
      - id: micro-behaviors/data/control-flow/dispatch::run-zero-number-argument
    any:
      - id: micro-behaviors/process/create/flags::powershell-nop-ep-bypass-file-command
      - id: micro-behaviors/os/security/policy::execution-policy-bypass
