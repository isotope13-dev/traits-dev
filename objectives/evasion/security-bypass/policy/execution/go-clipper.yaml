defaults:
  platforms: [windows]
  for: [pe]
  attack: T1059.001,T1562.001

composite_rules:
  - id: go-clipper-powershell-policy-bypass
    desc: Go clipper launches PowerShell policy bypass
    crit: hostile
    conf: 0.98
    all:
      - id: objectives/impact/crypto-manipulation/clipboard::go-ethereum-clipboard-swap
      - id: micro-behaviors/process/argument/option::go-executionpolicy-bypass-argument-pair
      - id: micro-behaviors/process/create/spawn::go-pe-os-exec-command-call
      - id: micro-behaviors/process/create/spawn::go-pe-child-process-start-call
