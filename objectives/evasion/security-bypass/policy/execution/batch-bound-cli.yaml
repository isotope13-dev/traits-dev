defaults:
  platforms:
  - windows
  for:
  - batch
  attack: T1059.001
traits:
- id: batch-concealed-policy-override-call
  desc: Hidden PowerShell overrides execution policy
  crit: suspicious
  conf: 0.97
  if:
    type: tree-sitter
    language: batch
    query: "(cmd [(command_name) (string)] @tool (argument_list) @args\n  (#match?\
      \ @tool \"(?i)^\\\"?([a-z]:\\\\\\\\[^\\\"\\\\r\\\\n]+\\\\\\\\)?(powershell|pwsh)(\\\
      \\.exe)?\\\"?$\")\n  (#match? @args \"(?i)(^|\\\\s)-(executionpolicy|ep)\\\\\
      s+(bypass|unrestricted|remotesigned)($|\\\\s)\")\n  (#match? @args \"(?i)(^|\\\
      \\s)-(windowstyle|w)\\\\s+hidden($|\\\\s)\"))"
  unless:
  - id: objectives/evasion/security-bypass/policy/execution::benign-executionpolicy-wrapper-context
