defaults:
  platforms: [windows]
  for: [python]

composite_rules:
  - id: local-zone-record-with-forfiles-launch
    desc: Zone overwrite clues with forfiles launch
    crit: suspicious
    conf: 0.98
    attack: T1553.005
    # The file contains these operations; this does not bind their file handles.
    all:
      - id: micro-behaviors/fs/file/open::python-zone-stream-open-write
      - id: micro-behaviors/fs/write/content::python-write-local-zone-record
      - id: micro-behaviors/process/create/shell/command-string::forfiles-payload-command-array
