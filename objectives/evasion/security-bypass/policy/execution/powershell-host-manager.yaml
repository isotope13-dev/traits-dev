# The base AuthorizationManager permits commands without the stock PowerShell
# authorization checks. Custom hosts may choose this deliberately; it is a
# boundary bypass, not evidence of a remote shell or credential theft.
defaults:
  platforms: [windows]
  for: [csharp, xml]

traits:
  - id: powershell-permissive-authorization-manager
    desc: Assigns permissive PowerShell authorization
    crit: suspicious
    conf: 0.96
    if:
      type: text
      substr: AuthorizationManager = new System.Management.Automation.AuthorizationManager(
