defaults:
  platforms: [netscaler, appliance, unix]
  for: [java, class, jar]
  attack: T1562

traits:
  - id: java-certpath-disable-weaken
    desc: Java certpath disable weaken
    crit: suspicious
    conf: 0.92
    for: [java]
    if:
      type: text
      substr: jdk.certpath.disabledAlgorithms=

composite_rules:
  - id: java-security-policy-bypass
    desc: Java security policy bypass
    crit: hostile
    conf: 0.98
    for: [java]
    all:
      - id: micro-behaviors/os/security/policy::java-security-manager-null-call
      - id: micro-behaviors/os/security/policy::java-allpermission-policy-text
    any:
      - id: java-certpath-disable-weaken

  # `for: [jar]` made this an archive rule, so a JRE scored hostile by
  # pooling: System.class calls setSecurityManager, another class names
  # AllPermission, and a third names jdk.certpath.disabledAlgorithms.
  # The bypass is one class that does all three.
  - id: jvm-security-policy-bypass
    desc: JVM security policy bypass
    crit: hostile
    conf: 0.97
    for: [class]
    all:
      - id: micro-behaviors/os/security/policy::jvm-system-security-manager-reference
      - id: micro-behaviors/os/security/policy::jvm-allpermission-reference
    any:
      - id: micro-behaviors/os/security/policy::jvm-certpath-disabled-algorithms-reference
