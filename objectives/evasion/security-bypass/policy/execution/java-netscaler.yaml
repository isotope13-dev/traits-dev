defaults:
  platforms: [netscaler, appliance, unix]
  for: [java, class, jar]
  attack: T1562

traits:
  - id: java-allpermission-policy-grant
    desc: Java policy grants AllPermission
    crit: suspicious
    conf: 0.94
    for: [java]
    if:
      type: text
      regex: '(?i)\bpermission\s+java\.security\.AllPermission\s*;'

  - id: java-certpath-disable-weaken
    desc: Java certpath disable weaken
    crit: suspicious
    conf: 0.92
    for: [java]
    if:
      type: text
      substr: jdk.certpath.disabledAlgorithms=

  - id: jvm-security-manager-bytecode
    desc: JVM SecurityManager override call
    crit: notable
    conf: 0.94
    for: [class]
    # Match the override call, not the property key: general-purpose
    # libraries (e.g. Apache commons-lang SystemProperties) carry the
    # 'java.security.manager' key as a plain constants-table entry, while
    # real policy manipulation calls setSecurityManager to install or
    # remove the manager. Defensive getSecurityManager checks stay out.
    #
    # Notable, not suspicious. A bare substring cannot tell installing a
    # sandbox from removing one -- `setSecurityManager` is the documented API
    # for both -- and the name is not even unique to the JVM's: Apache Shiro's
    # own SecurityManager accessors match it throughout shiro-core and
    # shiro-web. Ant's Permissions, Felix, Quartz's QuartzServer, the Groovy
    # shell and OpenJDK's own java/lang/System all install a manager on
    # purpose. The hostile composite below still needs AllPermission and a
    # certpath weakening alongside it, so nothing real is lost here.
    if:
      type: text
      substr: 'setSecurityManager'

  - id: jvm-allpermission-bytecode
    desc: JVM AllPermission bytecode
    crit: suspicious
    conf: 0.94
    for: [class]
    if:
      type: text
      substr: 'java.security.AllPermission'

  - id: jvm-certpath-bytecode
    desc: JVM certpath bytecode
    crit: suspicious
    conf: 0.92
    for: [class]
    if:
      type: text
      substr: 'jdk.certpath.disabledAlgorithms'
    unless:
      # A vendored runtime or library: Selenium ships a whole JRuby at
      # third_party/jruby/jruby-complete.jar, plus BouncyCastle jars.
      - id: metadata/package/files/dependency::third-party-directory-path

composite_rules:
  - id: java-security-policy-bypass
    desc: Java security policy bypass
    crit: hostile
    conf: 0.98
    for: [java]
    all:
      - id: micro-behaviors/os/security/policy::java-security-manager-null-call
      - id: java-allpermission-policy-grant
    any:
      - id: java-certpath-disable-weaken

  # `for: [jar]` made this an archive rule, so a JRE scored hostile by
  # pooling: System.class calls setSecurityManager, another class names
  # AllPermission, and a third names jdk.certpath.disabledAlgorithms.
  # The bypass is one class that does all three.
  - id: jvm-security-policy-bypass
    desc: JVM security policy bypass
    crit: hostile
    conf: 0.97
    for: [class]
    all:
      - id: jvm-security-manager-bytecode
      - id: jvm-allpermission-bytecode
    any:
      - id: jvm-certpath-bytecode
