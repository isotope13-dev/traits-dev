# Python scripts that invoke PowerShell with policy bypass flags to execute
# commands without security restrictions.
defaults:
  platforms: [windows]
  for: [python]
  attack: T1059.001,T1562.001
  mbc: E1027

composite_rules:
  - id: python-powershell-execution-policy-bypass
    desc: Python spawns PowerShell with policy bypass
    # ExecutionPolicy Bypass is risky but is also used by deployment and OS
    # automation tools; the argv alone does not prove malicious intent.
    crit: suspicious
    conf: 0.97
    all:
      - id: micro-behaviors/process/create/flags::python-powershell-policy-bypass-argv-pair
      - id: micro-behaviors/process/create/flags::python-powershell-no-profile-call
      - id: micro-behaviors/process/create/subprocess::process-execution
    any:
      - id: micro-behaviors/process/create/flags::powershell-policy-bypass-value
      - id: micro-behaviors/process/create/shell/runner::python-run-command-call
    needs: 1
    unless:
      - id: metadata/package/testing/
