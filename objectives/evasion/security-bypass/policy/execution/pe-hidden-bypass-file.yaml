defaults:
  platforms: [windows]
  for: [pe]
  attack: T1059.001,T1562.001,T1564.003

composite_rules:
  - id: pe-hidden-policy-bypassed-powershell-launch
    desc: PE launches hidden PowerShell with policy bypass
    crit: hostile
    conf: 0.97
    all:
      - id: micro-behaviors/process/argument/visibility::powershell-windowstyle-1-option
      - id: micro-behaviors/os/security/execution-policy::execution-policy-bypass-abbrev-flag
      - id: metadata/lang/source/syntax/command/launch::pe-powershell-script-file-launch
