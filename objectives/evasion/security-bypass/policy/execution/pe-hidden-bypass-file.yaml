defaults:
  platforms: [windows]
  for: [pe]
  attack: T1059.001,T1562.001,T1564.003

composite_rules:
  - id: pe-hidden-policy-bypassed-powershell-launch
    desc: PE launches hidden PowerShell with policy bypass
    crit: hostile
    conf: 0.97
    all:
      - id: micro-behaviors/process/create/hidden::powershell-windowstyle-1-option
      - id: micro-behaviors/process/create/flags::execution-policy-bypass-abbrev-flag
      - id: micro-behaviors/process/create/shell/script-file::pe-powershell-script-file-launch
