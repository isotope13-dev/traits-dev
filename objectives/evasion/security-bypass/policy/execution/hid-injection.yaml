defaults:
  platforms: [windows]
  for: [c, cpp, python, text, powershell]

composite_rules:
  - id: hid-hidden-policy-bypass-eval
    desc: Hidden policy-bypassing HID download-eval
    crit: suspicious
    conf: 0.99
    attack: T1059.001,T1564.003
    # The HID rule retains the typed payload's call/STRING start. Require the
    # concealment options at that operation, not in a nearby unrelated string.
    near_bytes: 1
    all:
      - id: micro-behaviors/hardware/input/keyboard/simulate::hid-run-download-eval-command
      - id: micro-behaviors/os/security/policy::output-call-hidden-policy-bypass
