defaults:
  platforms: [unix, windows]
  for: [scripts, source]
  attack: T1190
composite_rules:
  - id: double-colon-traversal-request
    desc: HTTP client with double-colon traversal payload
    crit: hostile
    conf: 0.97
    all:
      - id: micro-behaviors/fs/path/traversal::double-colon-parent-segments
    any:
      - id: micro-behaviors/communications/http/get/
      - id: micro-behaviors/communications/http/curl/
      - id: micro-behaviors/communications/http/download/curl::curl-cmd
      - id: micro-behaviors/communications/http/lib/requests/
      - id: micro-behaviors/communications/http/request/client::js-fetch-call
    needs: 1
    near_bytes: 1024
