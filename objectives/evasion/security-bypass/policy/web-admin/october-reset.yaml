# CVE-2021-32648: JSON preserves a boolean reset code, which PHP's loose
# comparison accepts against a nonempty stored token. A string "true" does
# not implement this bypass. Keep destinations and account IDs unrestricted.
defaults:
  for: [python]
  platforms: [unix, windows]
  conf: 0.99

traits:
  - id: october-password-reset-route
    desc: References October backend password reset
    crit: notable
    if:
      type: text
      substr: /backend/backend/auth/reset/
      exclude_comments: true

  - id: json-boolean-code-field
    desc: JSON body contains boolean code
    crit: notable
    if:
      type: tree-sitter
      # A boolean node distinguishes the bypass from strings and quoted code
      # in documentation; text alone cannot preserve that distinction.
      query: |
        ((keyword_argument name: (identifier) @keyword
          value: (dictionary (pair
            key: (string (string_content) @field)
            value: (true))))
          (#eq? @keyword "json")
          (#eq? @field "code"))

composite_rules:
  - id: october-boolean-reset-payload
    desc: October password reset carries a boolean token
    crit: suspicious
    near_bytes: 512
    all:
      - id: october-password-reset-route
      - id: json-boolean-code-field

  - id: october-json-reset-bypass
    desc: Posts a boolean reset token to bypass October authentication
    crit: hostile
    ref: https://huntback.io/blog/ai-agent-ukraine-police-network-municipal-platform-breach
    attack: T1190,T1098
    near_bytes: 512
    all:
      - id: october-boolean-reset-payload
      - id: micro-behaviors/communications/http/request/json::python-post-json-method
