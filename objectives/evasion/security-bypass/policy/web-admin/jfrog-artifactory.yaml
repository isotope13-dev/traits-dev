# JFrog Artifactory access-control bypass primitives. These are security-policy
# bypasses, not lateral movement: no propagation or movement to another host is
# implied by either request shape.
defaults:
  platforms: [unix, windows]
  for: [scripts, source]
  attack: T1190
  mbc: E1190

traits:
  - id: aws-token-trailing-slash-bypass
    desc: AWS token endpoint trailing-slash bypass
    crit: suspicious
    conf: 0.95
    if:
      type: text
      substr: /access/api/v1/aws/token/

  - id: artifactory-router-semicolon-bypass
    desc: Artifactory ..;/ router-normalization bypass
    crit: suspicious
    conf: 0.96
    if:
      type: text
      regex: '/artifactory/\.\.;[\\/]'

composite_rules:
  - id: artifactory-reader-credential-object-write
    desc: Reader-labeled credentials write an Artifactory object
    crit: suspicious
    conf: 0.98
    for: [python]
    near_bytes: 4096
    all:
      - id: micro-behaviors/os/env/secret-name::python-reader-username-env-suffix
      - id: micro-behaviors/os/env/secret-name::python-reader-password-env-suffix
      - id: micro-behaviors/communications/http/services/artifactory::service-route
      - id: micro-behaviors/communications/http/lib/requests::requests-put

  - id: artifactory-client-uri-header-cache-poison
    desc: Artifactory package metadata cache poisoning
    crit: hostile
    conf: 0.97
    attack: "T1190,T1195.002"
    all:
      - id: micro-behaviors/communications/http/services/artifactory::client-uri-override-header
      - id: micro-behaviors/communications/http/services/artifactory::package-api-route
    any:
      - id: micro-behaviors/communications/http/request/client/
      - id: micro-behaviors/communications/http/request/url::requests-get-url-literal
      - id: micro-behaviors/communications/http/request/url-computed::requests-post-metadata-url
      - id: micro-behaviors/communications/http/request/url::urllib-url-literal
      - id: micro-behaviors/communications/http/request/agent-control::python-urlopen-agent-endpoint
      - id: micro-behaviors/communications/http/request/url::python-column0-requests-get
      - id: micro-behaviors/communications/http/request/url-computed::python-fstring-url-get
      - id: micro-behaviors/communications/http/request/url::python-client-url-literal
      - id: micro-behaviors/communications/http/request/verb::python-http-post-any
      - id: micro-behaviors/communications/http/request/verb::httpx-client-post-request
      - id: micro-behaviors/communications/http/request/package::npm-registry-metadata-request
      - id: micro-behaviors/communications/http/request/url::fetch-invalid-domain-literal
      - id: micro-behaviors/communications/http/request/oob::webhook-site-source-call
      - id: micro-behaviors/communications/http/request/executable-resource/
      - id: micro-behaviors/communications/http/client/response-body::response-stream-python
      - id: micro-behaviors/communications/http/get/
      - id: micro-behaviors/communications/http/request/get::arm-static-direct-syscall-get-context
      - id: micro-behaviors/communications/http/request/get::tiny-elf-bins-get-context
      - id: micro-behaviors/communications/http/request/get::static-elf-bins-get-context
      - id: micro-behaviors/communications/http/request/get::tiny-static-elf-bins-get-context
      - id: micro-behaviors/communications/http/download/webclient::powershell-image-url-get
      - id: micro-behaviors/communications/http/download/webclient::python-webclient-cloud-api-get
      - id: micro-behaviors/communications/http/download/webclient::python-webclient-http-get
      - id: micro-behaviors/communications/http/request/package::npm-postinstall-node-http-get
      - id: micro-behaviors/communications/http/request/package::npm-postinstall-hostname-oast-get-url
      - id: micro-behaviors/communications/http/request/account::dahua-account-config-request
      - id: micro-behaviors/communications/http/request/verb::python-request-get-method
      - id: micro-behaviors/communications/http/request/verb::python-request-get-keyword
      - id: micro-behaviors/communications/http/request/verb::python-primp-client-get
      - id: micro-behaviors/communications/http/curl/
    needs: 1
    near_bytes: 1200

  - id: artifactory-copy-move-to-jfrog-metadata
    desc: Artifactory metadata write via COPY or MOVE
    crit: hostile
    conf: 0.98
    attack: "T1190,T1195.002"
    all:
      - id: micro-behaviors/communications/http/webdav::copy-move-method
      - id: micro-behaviors/communications/http/webdav::destination-header
      - id: micro-behaviors/communications/http/services/artifactory::internal-metadata-route
    near_bytes: 1200

  - id: artifactory-mkcol-jfrog-metadata
    desc: Artifactory metadata creation via MKCOL
    crit: hostile
    conf: 0.98
    attack: "T1190,T1195.002"
    all:
      - id: micro-behaviors/communications/http/webdav::mkcol-method
      - id: micro-behaviors/communications/http/services/artifactory::internal-metadata-route
    near_bytes: 700
