# Path-normalization-bypass traversal against a web proxy or router. A crafted
# matrix-parameter segment is interpreted differently by the front-end proxy
# and backend servlet, exposing a route the proxy believed it had protected.
defaults:
  platforms: [unix, windows]
  for: [scripts, source]
  attack: T1190
  mbc: E1190

traits:
  - id: semicolon-segment-traversal
    desc: Dot-dot-semicolon path-normalization bypass
    crit: suspicious
    conf: 0.95
    unless:
      - id: well-known/app/system/anthropic-cybersecurity-skills::defensive-cybersecurity-skills-repository
      - id: well-known/tool/offensive/keris::package-tree-member
      # OpenShell's matches are regression-test inputs inside a Rust source
      # file whose implementation canonicalizes and rejects these paths.
      - id: metadata/package/testing/harness/unit::rust-test
      - id: well-known/tool/offensive/bingo/
    if:
      type: text
      regex: '/\.\.;[\\/]'

  - id: encoded-semicolon-segment-traversal
    desc: URL-encoded dot-dot-semicolon path bypass
    crit: suspicious
    conf: 0.95
    if:
      type: text
      regex: '(?i)(%2e%2e|\.\.)%3b(%2f|%5c|[\\/])'
    unless:
      - id: metadata/package/testing/harness/unit::rust-test

  - id: encoded-parent-dir-traversal
    desc: URL-encoded parent-directory traversal
    crit: suspicious
    conf: 0.9
    if:
      type: text
      regex: '(?i)((%2e%2e|\.\.)(%2f|%5c)){2,12}'
    unless:
      - id: well-known/tool/detection/kagesec::defensive-scanner-context
      - id: well-known/tool/offensive/hhunter::hhunter-source-context
      - id: well-known/tool/offensive/xalgorix::repository-member-path
      - id: metadata/package/testing/
      - id: metadata/package/testing/presence/harness::test-fixture-directory-path
      # Sigma rules quote payloads as detection values. The field/modifier
      # syntax distinguishes a rule exemplar from code that sends the path.
      - type: text
        regex: '(?i)\bcs-uri-stem\|contains\s*:'
      # Design documentation may explicitly state that the implementation
      # does not use an encoded multi-level traversal payload.
      - type: text
        regex: '(?i)\b(no|not|never)\b[^\n]{0,80}(\.\.%2f){2}'
      # Security-review copy quoting encoded `../` as the hazard, not a payload.
      - type: text
        substr: 'after URL-decoding'

      - id: well-known/tool/offensive/bingo/
  - id: java-webroot-parent-traversal
    desc: Parent traversal targets Java webroot
    crit: suspicious
    conf: 0.96
    if:
      type: text
      regex: '(?i)(\.\.[\\/]){1,12}[^\s"'']{0,160}[\\/]webapps[\\/]ROOT[\\/]'

composite_rules:
  - id: semicolon-normalization-bypass-payload
    desc: Dot-dot-semicolon normalization-bypass payload
    crit: suspicious
    conf: 0.95
    any:
      - id: semicolon-segment-traversal
      - id: encoded-semicolon-segment-traversal
    unless:
      - id: well-known/app/system/anthropic-cybersecurity-skills::defensive-cybersecurity-skills-repository
      - id: well-known/tool/offensive/keris::package-tree-member
      - id: metadata/package/testing/harness/unit::rust-test

  - id: proxy-normalization-bypass-request
    desc: HTTP request uses ..;/ normalization bypass
    crit: hostile
    conf: 0.96
    all:
      - id: semicolon-normalization-bypass-payload
    any:
      - id: micro-behaviors/communications/http/get/
      - id: micro-behaviors/communications/http/post/
      - id: micro-behaviors/communications/http/curl/
      - id: micro-behaviors/communications/http/lib/requests/
    needs: 1
    near_bytes: 1200
    unless:
      - id: well-known/app/system/anthropic-cybersecurity-skills::defensive-cybersecurity-skills-repository
      - id: well-known/tool/offensive/keris::package-tree-member
      - id: metadata/package/testing/harness/unit::rust-test
