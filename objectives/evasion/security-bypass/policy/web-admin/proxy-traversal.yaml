defaults:
  platforms:
  - unix
  - windows
  for:
  - scripts
  - source
  attack: T1190
  mbc: E1190
traits:
- id: semicolon-segment-traversal
  desc: Dot-dot-semicolon path-normalization bypass
  crit: suspicious
  conf: 0.95
  unless:
  - id: metadata/lang/source/shape::javascript-literal-tables-pure-helpers
  - id: well-known/tool/offensive/
  - id: metadata/package/documentation/security-testing::pentest-skill-methodology
  - id: well-known/app/system/anthropic-cybersecurity-skills::defensive-cybersecurity-skills-repository
  - id: metadata/package/documentation/agent-safety::security-example-documentation
  - id: metadata/package/documentation/docstring::path-decoding-security-doc
  - id: micro-behaviors/metaprogramming/generation::configured-assessment-plugin
  - id: metadata/package/testing/
  - id: metadata/package/documentation/security-testing::security-follow-up-suggestion
  if:
    type: text
    regex: /\.\.;(/|\\[^\s])
- id: encoded-semicolon-segment-traversal
  desc: URL-encoded dot-dot-semicolon path bypass
  crit: suspicious
  conf: 0.95
  if:
    type: text
    regex: (?i)(%2e%2e|\.\.)%3b(%2f|%5c|[\\/])
  unless:
  - id: metadata/package/documentation/docstring::path-decoding-security-doc
  - id: metadata/package/testing/
composite_rules:
- id: semicolon-normalization-bypass-payload
  desc: Dot-dot-semicolon normalization-bypass payload
  crit: suspicious
  conf: 0.95
  any:
  - id: semicolon-segment-traversal
  - id: encoded-semicolon-segment-traversal
  unless:
  - id: well-known/tool/offensive/
  - id: metadata/package/documentation/security-testing::pentest-skill-methodology
  - id: well-known/app/system/anthropic-cybersecurity-skills::defensive-cybersecurity-skills-repository
  - id: metadata/package/documentation/agent-safety::security-example-documentation
  - id: micro-behaviors/metaprogramming/generation::configured-assessment-plugin
  - id: metadata/package/testing/
- id: proxy-normalization-bypass-request
  desc: HTTP request uses ..;/ normalization bypass
  crit: hostile
  conf: 0.96
  all:
  - id: semicolon-normalization-bypass-payload
  any:
  - id: micro-behaviors/communications/http/get/
  - id: micro-behaviors/communications/http/post
  - id: micro-behaviors/communications/http/curl/
  - id: micro-behaviors/communications/http/lib/requests
  - id: micro-behaviors/communications/http/response::raise-for-status
  needs: 1
  near_bytes: 1200
  unless:
  - id: well-known/app/ai/coding-agent/yana-ai::yana-ai-security-audit-product-context
  - id: well-known/tool/offensive/
  - id: metadata/package/documentation/security-testing::pentest-skill-methodology
  - id: well-known/app/system/anthropic-cybersecurity-skills::defensive-cybersecurity-skills-repository
  - id: metadata/package/testing/harness/unit::rust-test
  - id: metadata/package/documentation/agent-safety::security-example-documentation
