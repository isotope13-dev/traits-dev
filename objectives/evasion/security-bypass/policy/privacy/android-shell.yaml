# Morpheus commands.txt suppresses Android's recording indicators through ADB.
# Match an actual command and its arguments, not a quoted command or a key
# mention. Also accept the standalone device_config frontend.
defaults:
  for: [shell]
  platforms: [android, unix]
  crit: suspicious
  conf: 0.99

traits:
  - id: android-cmd-hide-recording-indicators
    desc: Hides Android camera and microphone indicators
    ref: https://osservatorionessuno.org/blog/2026/04/morpheus-a-new-spyware-linked-to-ips-intelligence/
    if:
      type: symbol
      kind: call
      exact: cmd
      args:
        - {index: 0, kind: identifier, name: device_config}
        - {index: 1, kind: identifier, name: put}
        - {index: 2, kind: identifier, name: privacy}
        - {index: 3, kind: identifier, name: camera_mic_icons_enabled}
        - {index: 4, kind: identifier, name: 'false'}

  - id: android-hide-recording-indicators
    desc: Hides Android camera and microphone indicators
    if:
      type: symbol
      kind: call
      exact: device_config
      args:
        - {index: 0, kind: identifier, name: put}
        - {index: 1, kind: identifier, name: privacy}
        - {index: 2, kind: identifier, name: camera_mic_icons_enabled}
        - {index: 3, kind: identifier, name: 'false'}
