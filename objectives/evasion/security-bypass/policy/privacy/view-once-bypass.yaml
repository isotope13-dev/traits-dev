# Some WhatsApp Web add-ons disguise their web session as an Android companion
# so the server permits view-once media to be retained or revisited. Require
# both the registration mutation and the message-state bypass, plus the sweep
# over messages loaded before activation, to avoid flagging generic API use.
defaults:
  platforms: [windows, unix]
  attack: T1213,T1557

composite_rules:
  - id: whatsapp-extension-rewrites-view-once-protection
    desc: WhatsApp extension spoofs Android and exposes view-once media
    crit: suspicious
    conf: 0.95
    scope: archive
    for: [crx, zip, javascript]
    all:
      - id: micro-behaviors/communications/messaging/whatsapp::whatsapp-registration-payload-android-spoof
      - id: micro-behaviors/communications/messaging/whatsapp::whatsapp-view-once-flag-cleared
      - id: micro-behaviors/communications/messaging/whatsapp::whatsapp-view-once-historical-media-sweep
