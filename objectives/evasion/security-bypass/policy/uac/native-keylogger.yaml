defaults:
  platforms: [windows]
  for: [pe, dll]
composite_rules:
  - id: native-network-keylogger-uac-disable-command
    desc: Networked keylogger includes UAC disable command
    crit: hostile
    conf: 0.97
    attack: T1112,T1548.002
    all:
      - id: objectives/collection/keylog/hook::keyboard-hook-winsock-client
      - id: micro-behaviors/os/security/policy::enablelua-zero-disable
      - id: micro-behaviors/process/create/exec::create-process-a
