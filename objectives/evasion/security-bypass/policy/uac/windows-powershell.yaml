# Setting multiple UAC policy values to zero weakens consent settings.
# Administrative configuration tools can legitimately offer these options.
defaults:
  platforms: [windows]
  for: [powershell, batch]
  attack: T1548.002,T1112
  mbc: E1548

traits:
  - id: consent-prompt-admin-set-zero
    desc: ConsentPromptBehaviorAdmin set to zero
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: '(?i)ConsentPromptBehaviorAdmin["''\s]{0,4}[\s\S]{0,40}-Value\s+0\b'
    unless:
      # Unattended GitHub Actions runner images intentionally remove elevation
      # prompts for their freshly-created ephemeral administrator account.
      - type: text
        regex: '(?i)config\.cmd\s+--unattended\b'
  - id: prompt-secure-desktop-set-zero
    desc: PromptOnSecureDesktop set to zero
    crit: notable
    conf: 0.93
    if:
      type: text
      regex: '(?i)PromptOnSecureDesktop["''\s]{0,4}[\s\S]{0,40}-Value\s+0\b'
  - id: installer-detection-set-zero
    desc: EnableInstallerDetection set to zero
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)EnableInstallerDetection["''\s]{0,4}[\s\S]{0,40}-Value\s+0\b'

composite_rules:
  - id: powershell-uac-consent-teardown
    desc: PowerShell weakens UAC consent settings
    crit: suspicious
    conf: 0.97
    near_bytes: 2048
    any:
      - id: consent-prompt-admin-set-zero
      - id: prompt-secure-desktop-set-zero
      - id: installer-detection-set-zero
    needs: 2
