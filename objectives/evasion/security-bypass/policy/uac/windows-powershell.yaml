# PowerShell that rewrites the UAC consent policy so elevation stops prompting.
# The C#/native rules elsewhere in this tree never fire on a `.ps1`, yet the
# registry writes are the same: setting ConsentPromptBehaviorAdmin to 0 makes
# an admin token elevate silently, PromptOnSecureDesktop 0 removes the secure
# desktop, and EnableInstallerDetection 0 stops installer heuristics. Any one
# could be an odd admin choice; two together are a deliberate teardown so a
# dropped payload can self-elevate with no user interaction. Each atom binds
# the value NAME to a `-Value 0` write so a script that merely reads the policy
# does not match.
defaults:
  platforms: [windows]
  for: [powershell, batch]
  attack: T1548.002,T1112
  mbc: E1548

traits:
  - id: consent-prompt-admin-set-zero
    desc: ConsentPromptBehaviorAdmin set to zero
    crit: suspicious
    conf: 0.94
    if:
      type: text
      regex: '(?i)ConsentPromptBehaviorAdmin["''\s]{0,4}[\s\S]{0,40}-Value\s+0\b'
  - id: prompt-secure-desktop-set-zero
    desc: PromptOnSecureDesktop set to zero
    crit: suspicious
    conf: 0.93
    if:
      type: text
      regex: '(?i)PromptOnSecureDesktop["''\s]{0,4}[\s\S]{0,40}-Value\s+0\b'
  - id: installer-detection-set-zero
    desc: EnableInstallerDetection set to zero
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)EnableInstallerDetection["''\s]{0,4}[\s\S]{0,40}-Value\s+0\b'

composite_rules:
  - id: powershell-uac-consent-teardown
    desc: PowerShell disables UAC elevation prompts
    crit: hostile
    conf: 0.97
    near_bytes: 2048
    any:
      - id: consent-prompt-admin-set-zero
      - id: prompt-secure-desktop-set-zero
      - id: installer-detection-set-zero
    needs: 2
