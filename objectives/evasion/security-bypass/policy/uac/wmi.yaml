# A SetDWORDValue call binds the policy name, path and disabled value at one
# call site. This weakens UAC but does not prove an elevation exploit; the
# caller may already be elevated or may be performing authorized policy work.
defaults:
  platforms: [windows]
  for: [javascript, vbs, powershell]
  crit: suspicious
  conf: 0.98
  attack: T1112

traits:
  - id: wmi-disable-enablelua
    desc: WMI writes zero to EnableLUA policy
    if:
      type: symbol
      kind: call
      regex: '(?i)\.SetDwordValue$'
      args:
        - index: 0
          kind: number
          value: 2147483650
        - index: 1
          kind: string
          exact: 'SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System'
        - index: 2
          kind: string
          exact: EnableLUA
        - index: 3
          kind: number
          value: 0

  - id: wmi-disable-admin-consent
    desc: WMI disables administrator UAC consent prompts
    if:
      type: symbol
      kind: call
      regex: '(?i)\.SetDwordValue$'
      args:
        - index: 0
          kind: number
          value: 2147483650
        - index: 1
          kind: string
          exact: 'SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System'
        - index: 2
          kind: string
          exact: ConsentPromptBehaviorAdmin
        - index: 3
          kind: number
          value: 0
