defaults:
  for: [csharp, python]
  platforms: [windows]
  attack: "T1112"
traits:
- id: enablelua-set-zero-python
  desc: Python disables UAC EnableLUA
  crit: suspicious
  conf: 0.96
  for: [python]
  if:
    type: text
    regex: 'SetValueEx.{0,80}"EnableLUA".{0,80}REG_DWORD,\s*0\)'
- id: consentprompt-set-zero-python
  desc: Python disables UAC prompts
  crit: suspicious
  conf: 0.96
  for: [python]
  if:
    type: text
    regex: 'SetValueEx.{0,80}"ConsentPromptBehaviorAdmin".{0,80}REG_DWORD,\s*0\)'
composite_rules:
- id: disable-uac-policy-set
  desc: Disables UAC-related registry protections
  crit: hostile
  conf: 0.98
  all:
  - id: micro-behaviors/os/registry/keys::uac-policy-registry-path
  - id: micro-behaviors/os/registry/manipulate::set-value
  any:
  - id: micro-behaviors/os/registry/keys::uac-enablelua-value
  - id: micro-behaviors/os/registry/keys::uac-consent-prompt-value
  - id: micro-behaviors/os/registry/keys::uac-installer-detection-value
  needs: 2
- id: python-disable-uac-policy-set
  desc: Python disables UAC registry protections
  crit: hostile
  conf: 0.98
  all:
  - id: micro-behaviors/os/registry/keys::uac-policy-registry-path-python
  - id: micro-behaviors/os/registry/manipulate::winreg-setvalue
  any:
  - id: enablelua-set-zero-python
  - id: consentprompt-set-zero-python
