defaults:
  for: [pe, dll]
  platforms: [windows]
  attack: T1548.002,T1112
composite_rules:
  - id: uac-policy-with-security-monitor-blinding
    desc: UAC policy mutation with security blinding
    crit: hostile
    conf: 0.95
    # This is an attack-context cluster, not argument/value-flow proof.
    # Ordinary UAC readers or administrative policy editors do not qualify.
    all:
      - id: micro-behaviors/os/registry/keys::uac-enablelua-token
      - id: micro-behaviors/os/registry/access::registry-write-api-chain
      - id: objectives/evasion/anti-av/blinding::security-center-notify-disabled
      - id: objectives/evasion/anti-av/blinding::defender-disable-with-monitor-blinding
