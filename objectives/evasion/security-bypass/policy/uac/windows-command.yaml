defaults:
  platforms: [windows]
  for: [pe, dll, batch, powershell]
  attack: T1548.002,T1112
  mbc: E1548

composite_rules:
  - id: command-disable-uac-enablelua
    desc: Command disables Windows UAC EnableLUA policy
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/os/security/policy::enablelua-zero-disable
      - id: micro-behaviors/os/registry/keys/policy::uac-policies-system-key
      - id: micro-behaviors/os/registry/manipulate::machine-registry-add-command
