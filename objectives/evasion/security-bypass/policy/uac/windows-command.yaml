defaults:
  platforms: [windows]
  for: [pe, dll, batch, powershell]
  attack: T1548.002,T1112
  mbc: E1548

composite_rules:
  # Admin toolboxes ship reg.exe commands that clear EnableLUA as a documented
  # setting, so the command alone is a security-control change, not an attack.
  # Hostile verdicts come from compositions that pair it with other bypass legs.
  - id: command-disable-uac-enablelua
    desc: Command disables Windows UAC EnableLUA policy
    crit: suspicious
    conf: 0.98
    all:
      - id: micro-behaviors/os/security/policy::enablelua-zero-disable
      - id: micro-behaviors/os/registry/policy/reference::uac-policies-system-key
      - id: micro-behaviors/os/registry/value/write::machine-registry-add-command
