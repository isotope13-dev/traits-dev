defaults:
  platforms: [windows, linux, macos]
  for: [javascript]
  attack: T1562.001

traits:
  - id: ide-auto-approval-workbench-patch
    # Rewriting IDE integrity checksums hides the approval patch from its
    # corruption notice, so this is user-facing concealment.
    crit: hostile
    desc: Patches IDE approvals; hides tamper notice
    conf: 0.98
    if:
      type: yara
      source: |
        rule ide_auto_approval_workbench_patch {
          strings:
            $workbench = "workbench.html" ascii
            $patterns = /clickPatterns[^\r\n]{0,100}['"]Allow['"][^\r\n]{0,60}['"]Always Allow['"]/
            $checksum = /productJson\.checksums\[relativePath\]\s*=\s*hash/
            $inject = /writeFileElevated\(destPath,\s*scriptContent\)/
            $patch = /writeFileElevated\(wbPath,\s*html\)/
          condition:
            all of them
        }
