# Reconstructed control-plane actions from Wiz CIRT's LLMjacking report.
# Removing this guardrail can be authorized; the action alone is suspicious.
defaults:
  platforms: [unix, windows]
  for: [scripts, source]
  crit: suspicious
  conf: 0.96
  attack: T1562.001

traits:
  - id: gcp-member-domain-policy-delete-cli
    desc: gcloud deletes GCP member-domain restriction
    for: [shell, powershell, batch]
    if:
      type: symbol
      kind: call
      exact: gcloud
      args:
        - name: org-policies
        - name: delete
        - name: iam.allowedPolicyMemberDomains

  - id: gcp-member-domain-policy-delete-http
    for: [python, javascript, typescript, ruby, php]
    desc: HTTP deletes GCP member-domain restriction
    if:
      type: symbol
      kind: call
      regex: '(?i)(^|\.)delete$'
      arg:
        index: 0
        regex: '^https://orgpolicy\.googleapis\.com/.+/iam\.allowedPolicyMemberDomains$'

  - id: gcp-member-domain-policy-delete-fetch
    desc: Fetch deletes GCP member-domain restriction
    for: [javascript, typescript]
    if:
      type: symbol
      kind: call
      regex: '(^|\.)fetch$'
      args:
        - index: 0
          regex: '^https://orgpolicy\.googleapis\.com/.+/iam\.allowedPolicyMemberDomains$'
        - index: 1
          from:
            field: method
            whole_value: '^DELETE$'
