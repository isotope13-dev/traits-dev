# A view-mode authentication combined with a direct sendForm RPC is the
# restricted-viewer export primitive. It does not alone prove a callback
# was replaced or that the exported file contains hidden document data.
defaults:
  for: [python, javascript]
  platforms: [unix, windows]
composite_rules:
  - id: viewer-sendform-export
    for: [python, javascript, zip]
    desc: View-mode session with forced form export
    scope: file
    crit: suspicious
    conf: 0.95
    all:
      - id: micro-behaviors/communications/rpc::sendform-rpc-message
      - id: micro-behaviors/communications/rpc::view-mode-auth-field
      - id: micro-behaviors/communications/rpc::callback-url-auth-field
