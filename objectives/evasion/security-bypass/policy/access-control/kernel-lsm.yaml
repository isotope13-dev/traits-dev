defaults:
  platforms: [linux]
  for: [c, cpp]
  crit: suspicious
  conf: 0.96
  attack: T1562.001

traits:
  - id: kernel-lsm-operations-reset-pointer-write
    desc: Resets LSM operations to default callbacks
    if:
      type: tree-sitter
      kind: assignment
      regex: '^\*\s*security_ops\s*=\s*default_security_ops$'
