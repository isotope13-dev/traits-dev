defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]

traits:
  - id: empty-consent-branch-before-upload
    desc: Empty consent branch precedes an upload call
    crit: suspicious
    conf: 0.97
    if:
      type: tree-sitter
      query: |
        ((function_declaration body: (statement_block
         (if_statement !alternative
          condition: (parenthesized_expression (binary_expression
           left: (identifier) @consent
           operator: "==="
           right: (string (string_fragment) @truth)))
          consequence: (statement_block . (comment)* .))
         . (comment)* . (lexical_declaration (variable_declarator value: (await_expression
          (call_expression function: (identifier) @upload))))))
         (#match? @consent "[Cc]onsent")
         (#eq? @truth "true")
         (#match? @upload "[Ss]end|[Uu]pload|[Ss]hare"))
