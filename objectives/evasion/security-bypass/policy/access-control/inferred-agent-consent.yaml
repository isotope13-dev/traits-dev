# These are suspicious policy assertions, not successful technical bypasses or
# proof of malware. A disclosed autonomous mode alone is not a conviction.
# Ordinary safety guidance elsewhere in the document must not hide them.
# The control at issue is action authorization, not prior-prompt precedence or
# model-response formatting; keep these claims with access-control policies.
defaults:
  platforms: [unix, windows]
  for: [markdown, text]

composite_rules:
  - id: agent-outcome-as-irreversible-action-consent
    desc: Agent policy infers irreversible-action consent from outcome
    crit: suspicious
    conf: 0.93
    scope: file
    all:
      - id: metadata/package/documentation/claims::irreversible-action-outcome-authorization-wording
    any:
      - id: metadata/package/agent-skill::agent-skill-frontmatter
      - id: metadata/package/agent-skill::agent-instructions-md-basename
    unless:
      - id: metadata/package/documentation/agent-safety::injection-review-inert-examples

  - id: agent-repository-consent-refusal-appeal
    desc: Agent policy appeals harness refusal using claimed consent
    crit: suspicious
    conf: 0.94
    scope: file
    all:
      - id: metadata/package/documentation/claims::repository-standing-consent-claim
      - id: metadata/package/documentation/claims::refusal-policy-citation-wording
    any:
      - id: metadata/package/agent-skill::agent-skill-frontmatter
      - id: metadata/package/agent-skill::agent-instructions-md-basename
    unless:
      - id: metadata/package/documentation/agent-safety::injection-review-inert-examples
