defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]

composite_rules:
  - id: forced-collection-consent-storage-override
    desc: Storage getter override forces consent and disables collection protection
    crit: hostile
    conf: 0.99
    all:
      - id: metadata/lang/source/syntax/object::collection-agreed-active-unprotected-object
      - id: micro-behaviors/data/db/web-storage::storage-get-function-replacement
      - id: micro-behaviors/data/property/assign::entry-pair-indexed-value-overlay
      - id: micro-behaviors/data/db/web-storage::chrome-storage-local-set
