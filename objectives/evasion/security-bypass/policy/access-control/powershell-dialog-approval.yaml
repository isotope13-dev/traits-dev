defaults:
  platforms: [windows]
  for: [powershell]
composite_rules:
  - id: powershell-security-dialog-auto-approval
    desc: Security check co-occurs with Allow auto-click
    crit: suspicious
    conf: 0.95
    # The control and click are bound; the security-text check and window
    # enumeration are co-occurring context, not interprocedural flow proof.
    all:
      - id: micro-behaviors/ui/window/automation::powershell-selected-allow-control-click
      - id: micro-behaviors/ui/window/probe::powershell-security-text-comparison
      - id: micro-behaviors/ui/window/enumerate::powershell-window-enumeration-call
    downgrade:
      scope: archive
      any:
        - id: metadata/package/agent-skill/
