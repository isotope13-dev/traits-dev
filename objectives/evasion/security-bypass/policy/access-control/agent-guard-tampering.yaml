# Concrete targets from sysdiglabs/openshell-prempti-falco-demo.
# Scope follows the deployed Linux controls, not the language of the agent.
# Removal/truncation is suspicious: installers and recovery tools can do it too.
defaults:
  platforms: [linux]
  for: [shell, python, javascript, typescript, go, c, cpp]
  crit: suspicious
  conf: 0.97
  attack: T1562.001

traits:
  - id: openshell-runtime-shell-write
    desc: Redirects shell output into OpenShell runtime
    for: [shell]
    if:
      type: tree-sitter
      node: file_redirect
      regex: '^>>?[ \t]*["'']?/\.openshell/'

  - id: openshell-supervisor-ca-shell-remove
    desc: Removes OpenShell supervisor trust material
    for: [shell]
    if:
      type: symbol
      kind: call
      regex: '(^|/)rm$'
      arg:
        kind: identifier
        name_regex: '^/run/openshell-supervisor-ca/'

  - id: openshell-supervisor-ca-remove-call
    desc: Calls removal API on OpenShell trust material
    if:
      type: symbol
      kind: call
      regex: '(^|[./])(unlink(Sync)?|[Rr]emove|rm(Sync)?)$'
      arg:
        kind: string
        regex: '^/run/openshell-supervisor-ca/'

  - id: openshell-runtime-open-write
    desc: Opens OpenShell runtime path in write mode
    for: [python]
    if:
      type: symbol
      kind: call
      regex: '(^|\.)open$'
      args:
        - index: 0
          kind: string
          regex: '^/\.openshell/'
        - index: 1
          kind: string
          regex: '[wax+]'

  - id: openshell-runtime-write-file-call
    desc: Calls file writer on OpenShell runtime
    for: [javascript, typescript, go]
    if:
      type: symbol
      kind: call
      regex: '(^|\.)(writeFile(Sync)?|WriteFile)$'
      arg:
        index: 0
        kind: string
        regex: '^/\.openshell/'

  - id: agent-guard-rules-shell-truncate
    desc: Truncates default coding-agent security rules
    for: [shell]
    if:
      type: tree-sitter
      node: file_redirect
      regex: '^>[ \t]*[^\r\n;]{0,80}/rules/default/coding_agents_rules\.yaml["'']?$'

  - id: agent-guard-rules-open-truncate
    desc: Opens coding-agent security rules for truncation
    for: [python]
    if:
      type: symbol
      kind: call
      regex: '(^|\.)open$'
      args:
        - index: 0
          kind: string
          regex: '/rules/default/coding_agents_rules\.yaml$'
        - index: 1
          kind: string
          regex: '^w[b+t]*$'

  - id: prempti-control-socket-shell-remove
    desc: Removes Prempti broker or supervisor socket
    for: [shell]
    if:
      type: symbol
      kind: call
      regex: '(^|/)rm$'
      arg:
        kind: identifier
        name_regex: '/prempti/run/(broker|supervisor)\.sock$'

  - id: prempti-control-socket-remove-call
    desc: Calls removal API on Prempti control socket
    if:
      type: symbol
      kind: call
      regex: '(^|[./])(unlink(Sync)?|[Rr]emove|rm(Sync)?)$'
      arg:
        kind: string
        regex: '/prempti/run/(broker|supervisor)\.sock$'
