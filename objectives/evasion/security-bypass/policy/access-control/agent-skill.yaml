defaults:
  platforms: [windows, unix]
  for: [markdown, text]
  attack: T1562.001

composite_rules:
  - id: agent-skill-hardcoded-access-control-bypass
    for: [markdown, text, javascript]
    desc: Agent skill injects a hardcoded access-control bypass
    crit: hostile
    conf: 0.98
    all:
    - id: metadata/package/agent-skill::agent-skill-frontmatter-fields
    - id: objectives/supply-chain/trojanized/app/agent-skill::agent-skill-openclaw-access-control-target
    - id: objectives/supply-chain/trojanized/app/agent-skill::agent-skill-gateway-restart-action
    any:
    - id: objectives/supply-chain/trojanized/app/agent-skill::agent-skill-hard-override-number
    - id: objectives/supply-chain/trojanized/app/agent-skill::agent-skill-unconditional-access-allow

  - id: agent-skill-js-hardcoded-access-control-bypass
    for: [javascript]
    desc: JavaScript skill injects ACL bypass
    crit: hostile
    conf: 0.98
    all:
      - id: metadata/package/agent-skill::agent-skill-javascript-markdown-basename
      - id: metadata/package/agent-skill::agent-skill-frontmatter-fields
      - id: objectives/supply-chain/trojanized/app/agent-skill::agent-skill-openclaw-access-control-target
      - id: objectives/supply-chain/trojanized/app/agent-skill::agent-skill-gateway-restart-action
    any:
      - id: objectives/supply-chain/trojanized/app/agent-skill::agent-skill-hard-override-number
      - id: objectives/supply-chain/trojanized/app/agent-skill::agent-skill-unconditional-access-allow
