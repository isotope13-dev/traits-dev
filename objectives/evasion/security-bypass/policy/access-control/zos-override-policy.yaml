defaults:
  platforms: [zos]
  for: [c, cpp, elf]
  attack: T1562

composite_rules:
  - id: zos-tcc-access-bypass
    desc: z/OS access and audit override markers
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/fs/path/config/security::zos-tcc-override-file
    needs: 2
    any:
      - id: micro-behaviors/os/security/policy::zos-access-check-bypass
      - id: micro-behaviors/os/security/policy::zos-racroute-override
      - id: micro-behaviors/os/security/policy::zos-audit-suppress
