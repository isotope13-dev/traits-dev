defaults:
  platforms: [unix]
  for: [shell]

composite_rules:
  # File-scoped co-occurrence, not a proof of shared path or successful flags.
  # Legitimate administration remains plausible, so this is suspicious.
  - id: htaccess-open-policy-with-flag-clearing
    desc: Flag clearing beside open htaccess overwrite
    crit: suspicious
    conf: 0.94
    all:
      - id: micro-behaviors/fs/attributes/chflags::chflags-clear-flags
      - id: micro-behaviors/communications/http/server/authz::htaccess-universal-grant-write
    near_lines: 8
