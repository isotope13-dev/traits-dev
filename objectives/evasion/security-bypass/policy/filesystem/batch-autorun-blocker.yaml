defaults:
  platforms:
  - windows
  for:
  - batch
composite_rules:
- id: self-installed-agent-removes-autorun-blocker
  desc: Self-installed agent defeats Autorun blocking dirs
  crit: hostile
  conf: 0.99
  all:
  - id: micro-behaviors/fs/chmod/modify::autorun-directory-acl-delete-launch-write
  - id: micro-behaviors/os/autorun/login-items::systemroot-self-copy-wrapper-run-entry
