defaults:
  for: [c, objective_c]
  platforms: [unix]
  attack: T1222.002

traits:
  - id: native-sensitive-world-write-with-network-trigger
    desc: Network client and sensitive-path permissions
    crit: hostile
    conf: 0.97
    if:
      type: yara
      source: |
        rule native_sensitive_world_write_with_network_trigger {
          strings:
            $chmod = /chmod[ \t]*\(/
            $world_write = "S_IWOTH"
            $shadow = "/etc/shadow"
            $sudoers = "/etc/sudoers"
            $ssh = "/root/.ssh"
            $curl = /curl_easy_perform[ \t]*\(/
            $process = "/proc/%d/cmdline"
          condition:
            all of them
        }
