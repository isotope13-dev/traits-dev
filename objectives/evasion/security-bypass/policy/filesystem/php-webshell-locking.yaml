defaults:
  platforms: [linux]
  for: [php]

composite_rules:
  # The request-command surface supplies the attack context. Both permission
  # atoms require executed commands, rather than documentation or literals.
  # This is file-scoped co-occurrence: it does not prove a shared target,
  # successful chattr privileges, or that chmod alone prevents unlinking.
  - id: php-command-webshell-file-locking
    desc: Command webshell executes immutability and write-removal commands
    crit: hostile
    conf: 0.97
    all:
      - id: objectives/command-and-control/backdoor/webshell/request/command::php-indirect-request-command-webshell
      - id: micro-behaviors/fs/attributes/chattr::php-execute-set-immutable
      - id: micro-behaviors/fs/chmod/modify::php-system-remove-write-mode
