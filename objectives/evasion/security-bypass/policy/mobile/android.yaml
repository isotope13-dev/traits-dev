defaults:
  platforms: [android]
  for: [java, kotlin, npm, zip, tar]

composite_rules:
  # A normal device-policy controller may provision profiles, but exposing a
  # cross-app component that accepts a package name, inventories applications,
  # installs an existing package into the profile, and launches it is the
  # third-party-operated cloning surface described by the Vwork technique.
  - id: android-exported-intent-profile-cloning-controller
    desc: Exported Android component controls managed-profile package cloning and launch
    crit: suspicious
    conf: 0.98
    for: [apk, zip]
    scope: outer
    all:
      - id: micro-behaviors/os/privilege/profile::android-managed-profile-existing-package-install
      - id: micro-behaviors/os/message/intent::android-intent-package-name-input
      - id: objectives/discovery/host/software::android-installed-package-enumeration
      - id: micro-behaviors/os/message/intent::android-package-launch-intent-source
      - id: micro-behaviors/os/privilege/manifest::exported-application-component
      - id: micro-behaviors/os/privilege/manifest::query-all-packages

  # Accessibility input injection plus an overlay and the exported profile
  # cloning controller is the fraud shape: remote control of another app is
  # moved into a managed profile that separates it from personal-profile
  # malware signals. The profile APIs alone remain neutral/notable above.
  - id: android-accessibility-work-profile-cloning-fraud
    desc: Android Accessibility controller clones and operates apps in a managed profile
    crit: hostile
    conf: 0.995
    for: [apk, zip]
    scope: outer
    attack: T1417.001,T1629
    all:
      - id: android-exported-intent-profile-cloning-controller
      - id: micro-behaviors/hardware/input/accessibility::android-accessibility-service-source
      - id: micro-behaviors/hardware/input/accessibility::android-accessibility-ui-action-source
      - id: micro-behaviors/os/privilege/manifest::system-alert-window
      - id: micro-behaviors/os/privilege/manifest::internet-access

  - id: android-battery-optimization-exemption-prompt
    desc: Android battery optimization exemption prompt
    crit: suspicious
    conf: 0.94
    ref: sha256:f6a1d7acbd59c261bfad7ee5b42e584ab1f381c1da7647fe7194aa8db0542872
    all:
      - id: micro-behaviors/os/privilege/check::android-battery-optimization-status
      - id: micro-behaviors/os/privilege/check::android-request-ignore-battery-action
      - id: micro-behaviors/os/message/intent::android-start-activity
    unless:
      - id: well-known/app/media/kopuz::kopuz-android-media-activity
      - id: well-known/app/media/kopuz::kopuz-android-activity-leaf
      - id: well-known/lib/ui/react-native-noti-sdk::source-notification-context
      - id: well-known/lib/ui/react-native-noti-sdk::archive-notification-context
      - id: well-known/lib/ui/react-native-noti-sdk/
      - id: well-known/app/development/termux/
      - id: well-known/app/communication/sms-forwarder::smsforwarder-source-battery-context
      - id: well-known/app/media/spotiflyer::spotiflyer-source-battery-context
      - id: well-known/app/media/spotiflyer::spotiflyer-source-package

  - id: android-rich-notification-battery-bypass
    desc: Android rich notification battery bypass
    crit: suspicious
    conf: 0.95
    ref: sha256:f6a1d7acbd59c261bfad7ee5b42e584ab1f381c1da7647fe7194aa8db0542872
    scope: archive
    for: [npm, zip, tar]
    all:
      - id: micro-behaviors/ui/window/notify/message::android-rich-notification-actions
      - id: android-battery-optimization-exemption-prompt
    unless:
      - id: well-known/lib/ui/react-native-noti-sdk::archive-notification-context
      - id: well-known/lib/ui/react-native-noti-sdk/
      - id: well-known/app/communication/sms-forwarder::smsforwarder-source-battery-context
      - id: well-known/app/media/spotiflyer::spotiflyer-source-archive-battery-context
      - id: well-known/app/media/spotiflyer::spotiflyer-source-package
