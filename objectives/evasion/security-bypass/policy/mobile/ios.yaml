defaults:
  platforms: [unix, windows]
  for: [scripts, source, binaries, plist, html, xml]

composite_rules:
  - id: ios-trusted-root-ota-extraction-agent
    desc: Trusted-root OTA deploys iOS extraction agent
    crit: suspicious
    conf: 0.97
    all:
      - id: micro-behaviors/crypto/certificate/install::apple-root-certificate-profile-payload
      - id: micro-behaviors/communications/http/message::itms-services-manifest
    any:
      - id: objectives/credential-access/keychain/extract::network-agent-keychain-extract-command
      - id: objectives/collection/archive/create::network-agent-filesystem-archive-command
