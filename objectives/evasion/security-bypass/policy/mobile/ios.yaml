defaults:
  platforms: [unix, windows]
  for: [scripts, source, binaries, plist, html, xml]

composite_rules:
  - id: ios-trusted-root-ota-extraction-agent
    for: [scripts, '!jcl']
    desc: Trusted-root OTA deploys iOS extraction agent
    crit: suspicious
    conf: 0.97
    all:
      - id: micro-behaviors/crypto/certificate/install::apple-root-certificate-profile-payload
      - id: micro-behaviors/communications/http/message::itms-services-manifest
    any:
      - id: objectives/credential-access/keychain/extract::network-agent-keychain-extract-command
      - id: objectives/collection/archive/create::network-agent-filesystem-archive-command

  # CVE-2026-13795: a browser (Chrome for iOS) confirms sensitive tel:/facetime:
  # navigations, but grants shortcuts:// / workflow:// unconditional trust as an
  # Apple-native handoff. Routing the dial scheme through the Shortcuts
  # x-callback-url leg means the Shortcuts app performs the openURL, so the
  # browser prompt is bypassed and a single tap places the call. Detecting the
  # smuggling structure (trusted app scheme + callback carrying a dial scheme)
  # catches the same trick with future callback params, schemes and hosts.
  - id: ios-shortcuts-callback-call-prompt-bypass
    for: [scripts, html, '!jcl']
    desc: Shortcuts callback smuggles a dial scheme past browser prompt
    crit: hostile
    conf: 0.97
    all:
      - id: micro-behaviors/communications/url/scheme::apple-shortcuts-run-url
      - id: micro-behaviors/communications/url/scheme::shortcuts-callback-to-dial-scheme
