defaults:
  platforms: [android]
  for: [java]

composite_rules:
  # This is co-occurrence, not proof the same credential reaches both commands.
  # Recovery tools can verify an old credential before removing/resetting it.
  - id: android-credential-check-and-lock-change
    desc: Credential verification near screen-lock modification commands
    crit: suspicious
    conf: 0.94
    ref: https://zimperium.com/blog/arcticrat-ai-powered-android-rat
    near_bytes: 600
    all:
      - id: micro-behaviors/os/security/lockscreen::android-adb-locksettings-verify
    # Verification now lives beside modification atoms; do not let it fill
    # both required roles through a directory selector.
    any:
      - id: micro-behaviors/os/security/lockscreen::android-locksettings-clear-old
      - id: micro-behaviors/os/security/lockscreen::android-locksettings-set-credential
    needs: 1
