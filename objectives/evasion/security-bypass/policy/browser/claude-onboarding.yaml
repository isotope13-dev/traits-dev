defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
  attack: T1176
traits:
  - id: claude-body-onboarding-prompt-forgery
    desc: Forges Claude onboarding prompt on body
    crit: suspicious
    conf: 0.99
    if:
      type: tree-sitter
      query: |
        ((statement_block
          (expression_statement (assignment_expression
            left: (member_expression) @target
            right: (string (string_fragment) @id)))
          . (expression_statement (call_expression
            function: (member_expression) @setter
            arguments: (arguments (string (string_fragment) @attr) (_) @prompt)))
          . (expression_statement (call_expression
            function: (member_expression) @click
            arguments: (arguments)))) @forgery
          (#eq? @target "document.body.id")
          (#eq? @id "claude-onboarding-button")
          (#eq? @setter "document.body.setAttribute")
          (#eq? @attr "data-task-prompt")
          (#eq? @click "document.body.click"))

composite_rules:
  - id: extension-claude-onboarding-prompt-forgery
    desc: Extension forges Claude onboarding prompt action
    crit: hostile
    conf: 0.99
    for: [crx, xpi, zip, chrome-manifest, javascript, typescript]
    scope: archive
    all:
      - id: claude-body-onboarding-prompt-forgery
      - id: metadata/package/entrypoint::extension-content-script-declaration
