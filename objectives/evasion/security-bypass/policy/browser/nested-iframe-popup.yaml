# Nested-iframe popup sandbox escape: when a sandboxed frame monkey-patches
# `window.open` at runtime while granting `allow-scripts` and
# `allow-popups-to-escape-sandbox`, creating and attaching a child `<iframe>`
# exposes a fresh Window realm whose native `contentWindow.open(...)` spawns an
# unsandboxed popup free of the parent's runtime guard and inherited CSP.
defaults:
  platforms: [windows, unix]
  for: [html, javascript, typescript]
  attack: T1562.001

composite_rules:
  - id: nested-iframe-popup-escape
    desc: Appends nested iframe and opens popup via contentWindow
    crit: suspicious
    conf: 0.96
    scope: file
    near_bytes: 1200
    all:
      - id: micro-behaviors/ui/window/dom/create::script-create-iframe-node
      - id: micro-behaviors/data/collection/dom::dom-node-insertion-call
      - id: micro-behaviors/ui/window/navigation/open::child-frame-contentwindow-open

  - id: nested-iframe-popup-document-injection
    desc: Nested iframe popup escape injects HTML into popup document
    crit: suspicious
    conf: 0.97
    scope: file
    near_bytes: 2048
    all:
      - id: nested-iframe-popup-escape
      - id: micro-behaviors/ui/window/dom/render::popup-window-markup-injection

  - id: escaped-popup-script-execution
    desc: Nested iframe popup escape executes script in unsandboxed window
    crit: hostile
    conf: 0.98
    scope: file
    near_bytes: 3072
    all:
      - id: micro-behaviors/ui/window/dom/create::script-create-iframe-node
      - id: micro-behaviors/data/collection/dom::dom-node-insertion-call
      - id: micro-behaviors/ui/window/navigation/open::child-frame-contentwindow-open
      - id: micro-behaviors/ui/window/dom/render::popup-window-markup-injection
      - id: micro-behaviors/ui/window/dom/render::popup-script-execution-sink
