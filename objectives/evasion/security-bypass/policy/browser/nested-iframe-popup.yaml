# Creating a frame and opening a popup from its window can participate in a
# sandbox escape, but these operations alone do not establish that context.
defaults:
  platforms: [windows, unix]
  for: [html, javascript, typescript]
  attack: T1562.001

composite_rules:
  - id: nested-iframe-popup-escape
    desc: Appends iframe and opens popup via contentWindow
    crit: notable
    conf: 0.96
    scope: file
    near_bytes: 1200
    all:
      - id: micro-behaviors/ui/window/dom/create::script-create-iframe-node
      - id: micro-behaviors/data/collection/dom::dom-node-insertion-call
      - id: micro-behaviors/ui/window/navigation/open::child-frame-contentwindow-open
    unless:
      - id: metadata/file/format/threat-intelligence::sqlite-article-corpus

  - id: nested-iframe-popup-document-injection
    desc: Popup opened from iframe receives HTML
    crit: suspicious
    conf: 0.97
    scope: file
    near_bytes: 2048
    all:
      - id: nested-iframe-popup-escape
      - id: micro-behaviors/ui/window/dom/render::popup-window-markup-injection

  - id: escaped-popup-script-execution
    desc: Nested iframe popup escape executes script in unsandboxed window
    crit: hostile
    conf: 0.98
    scope: file
    near_bytes: 3072
    all:
      - id: micro-behaviors/ui/window/dom/create::script-create-iframe-node
      - id: micro-behaviors/data/collection/dom::dom-node-insertion-call
      - id: micro-behaviors/ui/window/navigation/open::child-frame-contentwindow-open
      - id: micro-behaviors/ui/window/dom/render::popup-window-markup-injection
      - id: micro-behaviors/ui/window/dom/render::popup-script-execution-sink
