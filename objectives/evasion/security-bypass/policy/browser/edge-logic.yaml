defaults:
  platforms: [windows, linux, macos]
  for: [scripts, source, html]

traits:
  - id: edge-popup-blocker-bypass-url
    desc: Opens Edge popup-blocker bypass URL
    crit: suspicious
    conf: 0.98
    if:
      # This exact fragment is built into Edge's whitelist. Do not generalize
      # it to ordinary about:blank windows or arbitrary authentication popups.
      type: text
      regex: '\bopen\s*\(\s*\\?["'']about:blank#quickAuthPopup\\?["'']'

composite_rules:
  - id: edge-autolaunch-wildcard-origin-policy
    desc: Edge protocol policy beside wildcard allow
    crit: suspicious
    conf: 0.96
    for: [scripts, source, html, json]
    near_bytes: 512
    all:
      - id: micro-behaviors/fs/path/application/browser::edge-autolaunch-protocol-policy-path
      - id: metadata/permission/host::wildcard-origin-allow-rule
