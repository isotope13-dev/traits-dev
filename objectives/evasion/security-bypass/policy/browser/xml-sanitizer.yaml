# XML/HTML interpretation conflicts, not ordinary SVG script elements.
# No namespace-prefix, probe body, hostname, sanitizer or CDN identity gate.
defaults:
  platforms: [windows, unix]
  for: [scripts, source, html, svg, xml, text]
  crit: suspicious
  conf: 0.99

traits:
  - id: namespace-uri-encoded-script-injection
    desc: XML namespace URI embeds encoded script markup
    if:
      type: text
      regex: '\bxmlns(:[\w.-]+)?\s*=\s*["''][^"'']{0,240}&(lt|#60|#x3c);[\w:.-]*script\b'

  - id: xml-processing-instruction-script-injection
    desc: XML processing instruction hides HTML script
    if:
      type: text
      case_insensitive: true
      regex: '(?s)<\?\w+\s[^?]{0,80}>\s*<script\b[^?]{0,240}</script\s*>[^?]{0,80}\?>'

  - id: xml-stylesheet-data-uri-transform
    desc: XML stylesheet loads data URI transform
    if:
      type: text
      regex: '(?i)<\?xml-stylesheet\b[^?<>]{0,90}\bhref=["'']data:(text/xsl|application/xml)'

  - id: xslt-document-data-uri-copy
    desc: XSLT copy-of loads inline data URI
    if:
      type: text
      regex: '(?i)<(\w+:)?copy-of\b[^<>]{0,80}\bselect\s*=\s*["'']document\(["'']data:'

  - id: svg-use-raster-image-fragment-import
    desc: SVG use element imports raster image fragment
    if:
      type: text
      regex: '(?i)<use\b[^<>]{0,80}\bhref\s*=\s*["''][^"''#<>]{1,80}\.(gif|png|jpe?g|webp)#\w+'

composite_rules:
  - id: http-link-header-xslt-data-uri
    desc: HTTP Link header attaches data URI XSLT
    all:
      - id: micro-behaviors/data/format/html::http-link-header-xml-data-uri
      - id: micro-behaviors/data/format/html::http-link-header-xsl-stylesheet-type
  - id: svg-xhtml-namespace-frame-script
    desc: XHTML frame carries active inline content
    near_bytes: 240
    all:
      - id: micro-behaviors/data/format/html::xhtml-namespace-frame-element
      - id: micro-behaviors/data/format/html::frame-javascript-or-srcdoc-payload
    # srcdoc="A test" is ordinary text. Execution-bearing content is a
    # separate role from merely declaring a frame's inline document.
    any:
      - id: micro-behaviors/data/format/html::frame-javascript-source-uri
      - id: micro-behaviors/data/format/html::frame-srcdoc-script-element
      - id: micro-behaviors/data/format/html::frame-srcdoc-event-handler

  - id: svg-animate-href-javascript-injection
    desc: SVG animation mutates href to javascript URI
    all:
      - id: micro-behaviors/data/format/html::svg-animate-href-attribute
      - id: micro-behaviors/data/format/html::svg-animate-javascript-uri-value

  - id: svg-lowercase-foreignobject-event-bypass
    desc: Lowercase foreignobject embeds event handler
    all:
      - id: micro-behaviors/data/format/html::svg-lowercase-foreignobject-tag
      - id: micro-behaviors/data/format/html::svg-inline-error-or-load-handler
