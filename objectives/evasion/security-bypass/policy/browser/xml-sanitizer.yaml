# XML/HTML interpretation conflicts, not ordinary SVG script elements.
# No namespace-prefix, probe body, hostname, sanitizer or CDN identity gate.
defaults:
  platforms: [windows, unix]
  for: [scripts, source, html, svg, xml, text]
  crit: suspicious
  conf: 0.99

traits:
  - id: namespace-uri-encoded-script-injection
    desc: XML namespace URI embeds encoded script markup
    if:
      type: text
      regex: '\bxmlns(:[\w.-]+)?\s*=\s*["''][^"'']{0,240}&(lt|#60|#x3c);[\w:.-]*script\b'

  - id: xml-processing-instruction-script-injection
    desc: XML processing instruction hides HTML script
    if:
      type: text
      case_insensitive: true
      regex: '(?s)<\?\w+\s[^?]{0,80}>\s*<script\b[^?]{0,240}</script\s*>[^?]{0,80}\?>'
