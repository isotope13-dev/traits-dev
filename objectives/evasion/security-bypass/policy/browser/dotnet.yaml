# .NET tooling can bypass Chromium's Secure Preferences integrity check by
# recovering signing material from resources.pak, recomputing the document
# MAC, and replacing the protected profile file. The persistence rule proves
# the complete forgery chain; requiring File.WriteAllBytes here distinguishes
# code that actually installs the forged document from research that only
# derives or verifies the MAC.
defaults:
  platforms: [windows]
  for: [source, scripts, binaries, data]
  attack: T1562.001
  mbc: E1562

composite_rules:
  - id: dotnet-chromium-forged-preferences-overwrite
    desc: Writes forged Chromium Secure Preferences
    crit: hostile
    conf: 0.99
    all:
      - id: objectives/persistence/login/browser-extension::chromium-resources-pak-secure-prefs-forgery
      - id: micro-behaviors/fs/write/file/direct::writeallbytes-call
