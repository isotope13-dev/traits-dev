defaults:
  platforms:
  - windows
  for:
  - source
  - scripts
  - binaries
  - data
  attack: T1562.001
  mbc: E1562
  crit: suspicious
composite_rules:
- id: dotnet-chromium-integrity-and-binary-write
  for:
  - csharp
  desc: Chromium integrity edits with binary write API
  conf: 0.99
  all:
  - id: chromium-resource-prefs-integrity-editing
  - id: micro-behaviors/fs/write/file/full::writeallbytes-call
- id: chromium-resource-prefs-integrity-editing
  desc: Resource pack and protected prefs MAC editing
  conf: 0.9
  attack: T1176,T1562.001
  for:
  - data
  - source
  - '!objectivec'
  - batch
  - javascript
  - lua
  - pe
  - perl
  - php
  - powershell
  - python
  - ruby
  - vbs
  all:
  - id: micro-behaviors/fs/path/application/browser::chromium-resources-pak-file
  - id: micro-behaviors/fs/path/app-data::chromium-secure-preferences-file
  - id: micro-behaviors/data/config/browser-preference::chromium-secure-prefs-mac-fields
  - id: micro-behaviors/fs/read/file/
  - id: micro-behaviors/fs/write/file
  any:
  - id: micro-behaviors/crypto/hash/hmac::hmac-api-reference
  - id: micro-behaviors/crypto/hash/hmac::hmac-named-algorithm-api
  needs: 1
  unless:
  - id: well-known/app/browser/
