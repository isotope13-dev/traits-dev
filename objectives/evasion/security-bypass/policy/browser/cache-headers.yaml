# Qualified no-cache removes named headers from Chromium's stored response.
# Match the directive's field list, independent of CDN, server language or URL.
# Source: Searchlight, Cache Me If You Can (2026-10-28).
defaults:
  platforms: [windows, unix]
  for: [scripts, source, html, svg, xml, text]
  crit: suspicious
  conf: 0.98

traits:
  - id: cache-excludes-content-security-policy
    desc: Cache directive excludes Content Security Policy
    if:
      type: text
      case_insensitive: true
      regex: '\bno-cache=\\?"([^"\r\n]{1,96},\s*)?Content-Security-Policy\s*[,\\"]'

  - id: cache-excludes-content-type
    desc: Cache directive excludes response MIME type
    if:
      type: text
      case_insensitive: true
      regex: '\bno-cache=\\?"([^"\r\n]{1,96},\s*)?Content-Type\s*[,\\"]'

  # Signed storage URLs percent-encode directive punctuation. The engine
  # does not decode every query value, so retain this wire representation.
  - id: url-cache-excludes-content-security-policy
    desc: URL encoded cache directive excludes CSP
    if:
      type: text
      case_insensitive: true
      regex: '\bno-cache%3d%22([^&]{1,80}%2c(%20|\+)*)?Content-Security-Policy(%22|%2c)'

composite_rules:
  - id: cache-csp-html-response-override
    desc: CSP cache exclusion with HTML response override
    all:
      - id: micro-behaviors/communications/http/header/content-type::object-response-html-type-override
    any:
      - id: cache-excludes-content-security-policy
      - id: url-cache-excludes-content-security-policy

  - id: cache-csp-popup-history-navigation
    desc: CSP cache exclusion with popup history navigation
    all:
      - id: micro-behaviors/ui/window/navigation::browser-window-open-text-call
      - id: micro-behaviors/ui/window/navigation::history-back-call
    any:
      - id: cache-excludes-content-security-policy
      - id: url-cache-excludes-content-security-policy
