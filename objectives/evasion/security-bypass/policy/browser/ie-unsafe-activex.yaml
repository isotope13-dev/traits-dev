defaults:
  platforms: [windows]
  for: [html, javascript]
composite_rules:
  - id: about-zone-unsafe-activex-enable
    desc: Spoofed about URL enables unsafe ActiveX
    crit: hostile
    conf: 0.99
    attack: T1562.001
    all:
      - id: objectives/execution/exploit/parser-confusion::control-delimited-file-url
      - id: micro-behaviors/os/registry/write::percent-quoted-regwrite-1201-zero
      - id: micro-behaviors/ui/window/navigation::about-script-window-open
    near_bytes: 4000
