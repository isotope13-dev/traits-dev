defaults:
  platforms: [windows, unix]
  for: [scripts, javascript, typescript, chrome-manifest, binaries]
  attack: "T1562"
traits:
  - id: js-extension-probe-fetch-hang
    desc: Hangs fetch probes for extension URLs
    crit: suspicious
    conf: 0.98
    for: [javascript, typescript]
    if:
      type: text
      regex: 'window\.fetch\s*=\s*function[\s\S]{0,220}new Promise\s*\(\s*\(\)\s*=>\s*\{\s*\}'

  - id: js-extension-probe-xhr-suppress
    desc: Suppresses XHR probes for extension URLs
    crit: suspicious
    conf: 0.98
    for: [javascript, typescript]
    if:
      type: text
      regex: 'XMLHttpRequest\.prototype\.open\s*=[\s\S]{0,240}isExtUrl[\s\S]{0,60}return\s*;'

  - id: llm-exam-coach-prompt
    desc: LLM exam coach system prompt
    crit: suspicious
    conf: 0.94
    ref: sha256:c55a00c3436fb99b6e5542ceda74ce6154d6535818ee039ba3fa901db17f7d94
    for: [javascript, typescript]
    if:
      type: text
      substr: exam coach

  - id: llm-correct-choices-field
    desc: LLM correct choices field
    crit: suspicious
    conf: 0.94
    ref: sha256:c55a00c3436fb99b6e5542ceda74ce6154d6535818ee039ba3fa901db17f7d94
    for: [javascript, typescript]
    if:
      type: text
      substr: correct_choices

  - id: llm-exam-multiselect-answer-prompt
    desc: LLM prompt requests multiselect answers
    crit: suspicious
    conf: 0.96
    ref: sha256:c55a00c3436fb99b6e5542ceda74ce6154d6535818ee039ba3fa901db17f7d94
    for: [javascript, typescript]
    if:
      type: text
      substr: MULTI-SELECT; return ALL correct options

  - id: llm-eliminate-rules-field
    desc: LLM eliminate rules field
    crit: suspicious
    conf: 0.94
    ref: sha256:c55a00c3436fb99b6e5542ceda74ce6154d6535818ee039ba3fa901db17f7d94
    for: [javascript, typescript]
    if:
      type: text
      substr: eliminate_rules

  - id: llm-bad-phrases-field
    desc: LLM bad phrases field
    crit: suspicious
    conf: 0.94
    ref: sha256:c55a00c3436fb99b6e5542ceda74ce6154d6535818ee039ba3fa901db17f7d94
    for: [javascript, typescript]
    if:
      type: text
      substr: bad_phrases

  - id: llm-correct-reason-field
    desc: LLM correct reason field
    crit: suspicious
    conf: 0.94
    ref: sha256:c55a00c3436fb99b6e5542ceda74ce6154d6535818ee039ba3fa901db17f7d94
    for: [javascript, typescript]
    if:
      type: text
      substr: correct_reason

  - id: close-webstore-tab
    desc: Closes Chrome Web Store detail tab
    crit: suspicious
    conf: 0.98
    for: [javascript, typescript]
    if:
      type: text
      regex: 'chromewebstore\.google\.com/detail[^\r\n]{0,60}chrome\.runtime\.id'

composite_rules:
  - id: dnr-security-header-strip-http-script-redirect
    desc: DNR strips response security and redirects scripts remotely
    crit: suspicious
    conf: 0.98
    for: [json]
    attack: T1059.007,T1562.001
    all:
      - id: micro-behaviors/process/hook/webextension::dnr-security-header-remove
      - id: micro-behaviors/communications/http/dynamic::dnr-json-http-script-redirect

  # DiNneR Serving: remove CSP, relax the two cross-origin policies needed by
  # SharedArrayBuffer pages, then substitute an HTTP-hosted script. The rules
  # match the attack structure, not any victim or payload hostname.
  - id: dnr-security-policy-strip-script-substitution
    desc: DNR weakens browser security policies and replaces a script remotely
    crit: hostile
    conf: 0.99
    for: [json]
    attack: T1059.007,T1562.001
    all:
      - id: dnr-security-header-strip-http-script-redirect
      - id: micro-behaviors/communications/http/header/security::dnr-cross-origin-resource-policy-relaxed
      - id: micro-behaviors/communications/http/header/security::dnr-document-isolation-credentialless

  - id: broad-host-dnr-security-script-redirect
    desc: Broad-host extension strips web security before remote script replacement
    crit: suspicious
    conf: 0.99
    # Declares the members it mixes as well as the container it reports on:
    # the manifest legs come from a chrome-manifest member, the DNR ruleset
    # legs from json, and the injected-script legs from javascript.
    for: [crx, xpi, zip, chrome-manifest, json, javascript, typescript]
    scope: archive
    attack: T1059.007,T1176,T1562.001
    all:
      - id: metadata/permission/manifest::is-chrome-manifest
      - id: metadata/permission/host::broad-host-access
      - id: metadata/permission/network::permission-declarative-net-request
      - id: micro-behaviors/process/hook/webextension::dnr-static-ruleset-declared
      - id: dnr-security-header-strip-http-script-redirect

  - id: broad-host-dnr-browser-agent-hijack
    desc: Broad-host extension injects remote code to drive a privileged browser agent
    crit: hostile
    conf: 0.995
    # Declares the members it mixes as well as the container it reports on:
    # the manifest legs come from a chrome-manifest member, the DNR ruleset
    # legs from json, and the injected-script legs from javascript.
    for: [crx, xpi, zip, chrome-manifest, json, javascript, typescript]
    scope: archive
    attack: T1059.007,T1176,T1562.001
    all:
      - id: metadata/permission/manifest::is-chrome-manifest
      - id: metadata/permission/host::broad-host-access
      - id: metadata/permission/network::permission-declarative-net-request
      - id: micro-behaviors/process/hook/webextension::dnr-static-ruleset-declared
      - id: dnr-security-policy-strip-script-substitution
      - id: micro-behaviors/browser-extension/tabs::glic-privileged-tab-context-sequence

  - id: extension-presence-probe-evasion
    desc: Hides extension from page presence probes
    crit: hostile
    conf: 0.99
    for: [javascript, typescript]
    near_lines: 30
    all:
      - id: micro-behaviors/communications/url/scheme::chrome-extension-url-prefix-check
    any:
      - id: js-extension-probe-fetch-hang
      - id: js-extension-probe-xhr-suppress

  - id: encrypted-main-world-extension-injection
    desc: Browser extension injects encrypted code into page main world
    crit: hostile
    conf: 0.96
    for: [javascript, typescript]
    attack: T1059.007
    all:
      - id: micro-behaviors/process/inject/webextension::webextension-scripting-execute
      - id: micro-behaviors/process/inject/webextension::chrome-scripting-main-world
      - id: objectives/command-and-control/dropper/execution/browser::encoded-stage-url-construction
      - id: objectives/command-and-control/dropper/execution/browser::dom-script-content-sink
      - id: micro-behaviors/data/encode/xor::js-xor-decoder-ast
    unless:
      - id: metadata/build/bundler/

  - id: chrome-extension-cors-header-bypass
    desc: Chrome extension rewrites CORS and request-origin headers (security bypass)
    crit: hostile
    conf: 0.95
    all:
      - id: micro-behaviors/process/hook/webextension::dnr-cors-origin-rewrite
      - id: micro-behaviors/process/hook/webextension::dnr-request-context-header-set
    any:
      - id: micro-behaviors/process/hook/webextension::dnr-additional-security-header-modification
    unless:
      - id: well-known/app/browser-extension/translator::translator-security-context

  - id: broad-host-page-network-proxy
    desc: Broad-host extension proxies and rewrites page network traffic
    crit: hostile
    conf: 0.98
    for: [crx, xpi, zip, chrome-manifest, javascript]
    scope: archive
    all:
      - id: metadata/permission/manifest::is-chrome-manifest
      - id: metadata/permission/host::broad-host-access
      - id: micro-behaviors/process/inject/webextension::extension-page-script-injection
      - id: micro-behaviors/process/hook/xhr::globalthis-fetch-wrapper
      - id: micro-behaviors/process/hook/xhr::globalthis-xhr-wrapper
      - id: micro-behaviors/process/hook/webextension::dnr-cors-permissive-response

  - id: broad-host-csp-clearing-page-injection
    desc: Broad-host extension clears CSP and injects a page script
    crit: suspicious
    conf: 0.98
    for: [crx, xpi, zip, chrome-manifest, javascript]
    scope: archive
    all:
      - id: metadata/permission/manifest::is-chrome-manifest
      - id: metadata/permission/host::broad-host-access
      - id: micro-behaviors/communications/http/header/security::dnr-csp-empty-set
      - id: micro-behaviors/process/inject/webextension::extension-page-script-injection

  - id: broad-host-csp-stripping-dom-execution
    desc: Broad-host extension strips CSP before hidden DOM code execution
    crit: hostile
    conf: 0.995
    attack: T1059.007,T1176,T1562.001
    for: [crx, xpi, zip, chrome-manifest, javascript]
    scope: archive
    all:
      - id: metadata/permission/manifest::is-chrome-manifest
      - id: metadata/permission/host::broad-host-access
      - id: metadata/permission/network::permission-declarative-net-request
      - id: micro-behaviors/process/hook/webextension::declarative-net-request-update
      - id: micro-behaviors/process/hook/webextension::dnr-security-header-remove
      - id: micro-behaviors/process/interpreter/runtime/eval::js-dom-event-handler-variable-code
      - id: micro-behaviors/ui/window/automation::dom-dispatch-non-pointer-event

  - id: llm-exam-answer-json-prompt
    desc: LLM prompt requests exam answers
    crit: suspicious
    conf: 0.97
    ref: sha256:c55a00c3436fb99b6e5542ceda74ce6154d6535818ee039ba3fa901db17f7d94
    for: [javascript, typescript]
    all:
      - id: llm-exam-coach-prompt
      - id: llm-correct-choices-field
      - id: micro-behaviors/data/serialize/schema-object::json-only-response-instruction

  - id: llm-exam-choice-rationale-prompt
    desc: LLM prompt requests choice rationales
    crit: suspicious
    conf: 0.96
    ref: sha256:c55a00c3436fb99b6e5542ceda74ce6154d6535818ee039ba3fa901db17f7d94
    for: [javascript, typescript]
    any:
      - id: llm-eliminate-rules-field
      - id: llm-bad-phrases-field
      - id: llm-correct-reason-field
    needs: 2

  - id: ai-exam-answer-generation
    desc: AI generates online exam answers
    crit: hostile
    conf: 0.98
    ref: sha256:c55a00c3436fb99b6e5542ceda74ce6154d6535818ee039ba3fa901db17f7d94
    for: [javascript, typescript]
    all:
      - id: micro-behaviors/communications/http/url/endpoint::endpoint
      - id: llm-exam-answer-json-prompt
    any:
      - id: llm-exam-multiselect-answer-prompt
      - id: llm-exam-choice-rationale-prompt
    needs: 1

  - id: browser-extension-ai-quiz-policy-bypass
    desc: Browser extension assists online quiz answers
    crit: hostile
    conf: 0.97
    ref: sha256:c55a00c3436fb99b6e5542ceda74ce6154d6535818ee039ba3fa901db17f7d94
    for: [javascript, typescript]
    all:
      - id: micro-behaviors/ui/window/dom-access::quiz-answer-assistance-state
    any:
      - id: llm-exam-choice-rationale-prompt
      - id: llm-exam-answer-json-prompt
      - id: micro-behaviors/ui/window/dom-access::quiz-check-answer-hook
    needs: 1

  - id: extension-install-close-webstore-tab
    desc: Extension closes Chrome Web Store detail tab on install
    crit: hostile
    conf: 0.98
    attack: T1562.001,T1176
    for: [crx, xpi, zip, javascript, typescript]
    scope: archive
    all:
      - id: micro-behaviors/browser-extension/lifecycle::chrome-runtime-on-installed
      - id: close-webstore-tab
      - id: micro-behaviors/browser-extension/tabs::chrome-tabs-api
