# EMBRACE's published payload places a file:// fetch in Blob worker source.
# Ordered source co-occurrence: does not prove the host is vulnerable or that
# the Blob passed to Worker is the same Blob whose source contains the read.
defaults:
  for: [javascript, typescript, html]
  platforms: [linux, macos, windows]

traits:
  - id: blob-worker-absolute-file-fetch
    desc: Blob worker surrounds absolute-file fetch
    crit: suspicious
    conf: 0.94
    if:
      type: yara
      source: |
        rule blob_worker_absolute_file_fetch {
          strings:
            $blob = /new\s+Blob\s*\(\s*\[/
            $read = /\bfetch\s*\(\s*["'`]file:\/\/\//
            $worker = /new\s+Worker\s*\(\s*URL\.createObjectURL\s*\(/
          condition:
            all of them and
            for any b in (1..#blob) : (
              for any r in (1..#read) : (
                @read[r] > @blob[b] and @read[r] - @blob[b] < 8192 and
                for any w in (1..#worker) : (
                  @worker[w] > @read[r] and @worker[w] - @blob[b] < 16384
                )
              )
            )
        }
