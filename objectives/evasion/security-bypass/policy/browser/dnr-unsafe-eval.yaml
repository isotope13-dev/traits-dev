defaults:
  platforms: [unix, windows]
  for: [crx, xpi, zip, chrome-manifest, json]
  attack: T1562

composite_rules:
  - id: extension-enabled-ruleset-weakens-page-csp
    desc: Extension enables response rules allowing unsafe-eval on web pages
    crit: suspicious
    conf: 0.95
    scope: archive
    all:
      - id: metadata/permission/network::permission-declarative-net-request
      - id: metadata/permission/network::dnr-enabled-ruleset
      - id: micro-behaviors/communications/http/header/security::dnr-csp-unsafe-eval
      - id: micro-behaviors/communications/http/header/security::dnr-response-header-set-operation
