# CERT-UA UAC-0277 describes deleting CSP meta tags as well as filtering
# response headers. Match the selected node's removal, not a CSP string
# beside an unrelated DOM mutation. No family, lure text or hostname gate.
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
  attack: T1562.001

traits:
  - id: csp-meta-selected-node-removal
    desc: Removes selected CSP meta tags
    crit: suspicious
    conf: 0.97
    if:
      type: tree-sitter
      query: |
        ((call_expression
          function: (member_expression
            object: (call_expression
              function: (member_expression
                property: (property_identifier) @select)
              arguments: (arguments (string) @selector))
            property: (property_identifier) @each)
          arguments: (arguments
            (arrow_function
              parameter: (identifier) @node
              body: (call_expression
                function: (member_expression
                  object: (identifier) @removed
                  property: (property_identifier) @remove)
                arguments: (arguments) @args))))
          (#eq? @select "querySelectorAll")
          (#eq? @each "forEach")
          (#eq? @node @removed)
          (#eq? @remove "remove")
          (#eq? @args "()")
          (#match? @selector "(?i)^['\"]meta\\[http-equiv=['\"]content-security-policy['\"]\\]['\"]$"))

composite_rules:
  - id: extension-header-and-meta-csp-strip
    desc: Extension strips header and meta CSP
    crit: suspicious
    conf: 0.98
    all:
      - id: csp-meta-selected-node-removal
      - id: micro-behaviors/communications/http/header/security::response-headers-filter-csp
      - id: micro-behaviors/process/hook/webextension::webrequest-on-headers-received
