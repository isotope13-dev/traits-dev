# Removing Content-Security-Policy and X-Frame-Options from every frame and
# then writing extension-controlled markup into those pages: the header
# removal exists to let the injected content load and run unhindered.
defaults:
  platforms: [unix, windows]
  for: [crx, xpi, zip, chrome-manifest, javascript, json]
  attack: T1562,T1185

composite_rules:
  - id: security-header-strip-with-page-html-injection
    desc: Strips CSP and frame headers and injects templated HTML into pages
    crit: hostile
    conf: 0.86
    scope: archive
    all:
      - id: objectives/evasion/security-bypass/policy/browser::broad-host-extension-security-header-removal
      - id: micro-behaviors/communications/http/header/security::dnr-frame-options-header-field
      - id: micro-behaviors/communications/http/header/security::dnr-csp-response-header
      - id: micro-behaviors/ui/window/insert-html::innerhtml-style-template-interpolation
