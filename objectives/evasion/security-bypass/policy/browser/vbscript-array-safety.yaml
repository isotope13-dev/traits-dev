defaults:
  platforms: [windows]
  for: [html, vbs]
  conf: 0.98
  attack: T1203
traits:
  # These doubles encode forged VARIANT metadata in the OLE SAFEARRAY
  # corruption primitive. A number alone is insufficient to convict.
  - id: vbs-forged-byref-variant-tag
    desc: Assigns forged by-reference VARIANT tag double
    crit: suspicious
    if:
      type: text
      regex: '(?i)\w+\(0\)\s*=\s*1\.69759663316747E-313'
  - id: vbs-array-safety-slot-write
    desc: Nested array write to script safety offset
    crit: suspicious
    if:
      type: text
      regex: '(?i)\w+\([^()\n]{1,24}\)\([^()\n]{0,16}&h11c[^()\n]{0,16}\)\s*='
composite_rules:
  - id: vbscript-array-safety-memory-overwrite
    desc: Forged VARIANT arrays overwrite safety memory
    crit: hostile
    all:
      - id: vbs-forged-byref-variant-tag
      - id: vbs-array-safety-slot-write
      - id: micro-behaviors/data/collection/array::vbs-redim-preserve-reference
    near_bytes: 4500


  - id: vbscript-array-safety-bypass-shell
    desc: Corrupted safety memory with shell launch
    crit: hostile
    all:
      - id: vbscript-array-safety-memory-overwrite
      - id: micro-behaviors/process/create/shellexec::vbscript-shell-application-launch
