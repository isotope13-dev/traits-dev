defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
composite_rules:
  - id: webrequest-csp-strip-remote-code-agent
    desc: CSP filtering with remote code evaluation
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/communications/http/header/security::response-headers-filter-csp
      - id: micro-behaviors/process/hook/webextension::webrequest-on-headers-received
      - id: objectives/command-and-control/backdoor/dispatch/websocket::browser-websocket-json-code-execution
