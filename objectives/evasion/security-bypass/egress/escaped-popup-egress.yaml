# Network egress bypass via escaped sandbox popups: sandboxed preview frames
# enforce strict `connect-src` / network lockdown policies, but a popup opened
# via a nested iframe's `contentWindow.open(...)` inherits no CSP when
# `allow-popups-to-escape-sandbox` is present and can freely transmit data out.
defaults:
  platforms: [windows, unix]
  for: [html, javascript, typescript]
  attack: T1562.001,T1041
  mbc: B0030

composite_rules:
  - id: escaped-popup-outbound-request
    desc: Escaped sandbox popup dispatches outbound HTTP request
    crit: hostile
    conf: 0.99
    scope: file
    near_bytes: 4096
    all:
      - id: objectives/evasion/security-bypass/policy/browser::escaped-popup-script-execution
      - id: micro-behaviors/communications/http/request/target::browser-outbound-http-client-call

  - id: escaped-popup-ephemeral-post-and-close
    desc: Escaped popup transmits outbound data and closes itself
    crit: hostile
    conf: 0.99
    scope: file
    near_bytes: 4096
    all:
      - id: objectives/evasion/security-bypass/policy/browser::escaped-popup-script-execution
      - id: micro-behaviors/communications/http/request/target::browser-outbound-http-client-call
      - id: metadata/lang/source/syntax/call/invocation::window-or-unqualified-close-call-text
    any:
      - id: micro-behaviors/communications/http/post::request-options-post-method
      - id: micro-behaviors/communications/http/request/reference::literal-post-method
      - id: micro-behaviors/communications/http/request/beacon::sendbeacon-http-target
