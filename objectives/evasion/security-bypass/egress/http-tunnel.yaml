# HTTP proxy tunnel egress bypass
defaults:
  platforms: [linux, windows, macos]
  for: [elf, pe, macho, go]
  attack: T1572,T1090
  mbc: B0030

traits:
  - id: egress-proxy-puncher-marker
    desc: Egress HTTP proxy puncher tool marker
    crit: suspicious
    conf: 0.95
    if:
      type: text
      substr: "@lfasmpao"

composite_rules:
  - id: egress-firewall-http-puncher-bypass
    desc: Bypasses egress firewall by punching tunnels through HTTP proxies
    crit: hostile
    conf: 0.98
    # net.Dial is read out of a built Go binary's string table, so the chain
    # only ever completes on the compiled artifact, never on Go source.
    for: [elf, pe, macho]
    all:
      - id: objectives/evasion/security-bypass/egress::egress-proxy-puncher-marker
      - id: micro-behaviors/communications/socket/dial::net-dial-text
