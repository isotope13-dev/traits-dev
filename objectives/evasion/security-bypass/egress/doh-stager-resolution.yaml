# A stager that resolves its download host through DNS-over-HTTPS bypasses
# DNS-based egress controls (resolver blocklists, DNS logging) for that one
# fetch. Pinning DoH on the handle that pulls code to execute serves no
# reliability purpose; it hides the lookup.
defaults:
  platforms: [unix, windows]
  for: [php]
composite_rules:
  - id: doh-resolved-remote-code-fetch
    desc: Resolves code-download host via DoH
    crit: hostile
    conf: 0.92
    attack: T1071.004,T1562
    all:
      - id: micro-behaviors/communications/dns/doh::curl-doh-url-option
      - id: micro-behaviors/communications/http/curl::exec
      - id: micro-behaviors/process/interpreter/eval/source::php-variable-file-load
    near_bytes: 800

  - id: jvm-doh-resolved-tls-transport
    desc: JVM transport resolves endpoints via DoH and opens raw TLS socket
    crit: hostile
    conf: 0.96
    attack: T1071.004,T1562.001
    for: [class, java_class, jar, zip]
    all:
      - id: micro-behaviors/communications/dns/doh::doh-query-path
      - id: micro-behaviors/communications/socket/ssl::jvm-sslsocket-handshake-call
      - id: micro-behaviors/communications/socket/ssl::jvm-sslparameters-set-server-names
      - id: micro-behaviors/communications/http/message::jvm-handwritten-request-line
