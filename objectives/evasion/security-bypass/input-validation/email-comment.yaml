# RFC 5322 comments survive address validation but reach the body renderer.
# Match the directive in address syntax, independently of recipient and path.
defaults:
  platforms: [unix, windows]
  for: [scripts, source, text, json, html]

traits:
  - id: email-comment-embed-directive
    desc: Email comment smuggles renderer embed directive
    crit: suspicious
    conf: 0.97
    if:
      type: text
      regex: '[\w.+-]+@[\w.-]+\([^\)\r\n]{0,64}\bembed=\\{0,3}["'']'
