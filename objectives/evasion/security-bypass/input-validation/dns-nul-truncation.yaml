# CVE-2026-105482 pattern: the suffix after the NUL is what a hostname
# validator (for example a domain allowlist) sees, while the resolver
# queries only the prefix before the NUL.
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]

composite_rules:
  - id: dns-nul-hostname-truncation-bypass
    desc: Resolver queries truncated prefix of hostname
    crit: suspicious
    conf: 0.92
    near_bytes: 1024
    all:
    - id: micro-behaviors/communications/dns/hostname::nul-suffixed-hostname-literal
    any:
    - id: micro-behaviors/communications/dns/lookup::dns-lookup-resolve-api-reference
    - id: micro-behaviors/communications/dns/lookup::node-resolver-reverse
    - id: micro-behaviors/communications/dns/resolver::dns-resolve4
