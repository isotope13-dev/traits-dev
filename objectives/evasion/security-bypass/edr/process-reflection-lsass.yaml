# Dynamic resolution of undocumented ntdll process-reflection exports against
# LSASS to avoid static imports and direct LSASS memory-read handles.
defaults:
  platforms: [windows]
  for: [binaries, scripts, source]
  attack: T1003.001,T1562.001

composite_rules:
  - id: dynamic-ntdll-lsass-reflection
    desc: Dynamically resolves RtlCreateProcessReflection targeting LSASS
    crit: hostile
    conf: 0.98
    all:
      - id: micro-behaviors/process/create/fork::rtl-create-process-reflection
      - id: micro-behaviors/os/privilege/reference::debug-privilege-identifier
      - id: micro-behaviors/process/debug/dump::lsass-process-or-query-target
    any:
      - id: micro-behaviors/dylib/lookup::get-proc-address-source-call
      - id: micro-behaviors/dylib/lookup::get-proc-address
      - id: micro-behaviors/dylib/lookup::get-proc-address-source
      - id: micro-behaviors/dylib/lookup::ldr-get-procedure-address-name
    unless:
      - id: well-known/app/system/microsoft/platform::microsoft-signed-system-component-context
