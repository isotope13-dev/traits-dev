defaults:
  platforms: [windows]
  for: [batch]

traits:
  - id: ohook-custom-sppc-extract
    desc: Extracts custom Office licensing DLL
    crit: suspicious
    conf: 0.98
    if:
      type: text
      substr: 'call :oh_extractdll "%_hookPath%\sppc.dll"'

  - id: ohook-sppc-symlink
    desc: Replaces Office licensing DLL by symlink
    crit: suspicious
    conf: 0.98
    if:
      type: text
      regex: '(?i)mklink\s+"%_hookPath%\\sppcs\.dll"\s+"%_sppcPath%"'

composite_rules:
  - id: forged-genuine-ticket-activation
    desc: Forges Windows digital-license activation ticket
    crit: hostile
    conf: 0.995
    all:
      - id: metadata/file/string/identity::microsoft-activation-script-identity
      - id: micro-behaviors/os/privilege/licensing::clipup-apply-genuine-ticket
      - id: micro-behaviors/os/privilege/licensing::clipsvc-genuine-ticket-path

  - id: office-licensing-dll-hook
    desc: Hooks Office licensing to bypass activation
    crit: hostile
    conf: 0.995
    all:
      - id: metadata/file/string/identity::microsoft-activation-script-identity
      - id: ohook-custom-sppc-extract
      - id: ohook-sppc-symlink
