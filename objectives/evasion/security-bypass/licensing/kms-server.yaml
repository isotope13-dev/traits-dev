# Console KMS protocol server that answers versioned activation requests
# after locating (and displacing) whatever already owns TCP 1688.
# Microsoft's KMS is a Windows Server role, not a redistributable emulator.
defaults:
  platforms: [windows]
  for: [pe]

composite_rules:
  - id: pirate-kms-server-port-hijack
    desc: Pirate KMS server seizes activation port
    crit: hostile
    conf: 0.97
    all:
      - id: well-known/dual-use/access-control/kms-emulator::kms-rpc-emulator
      - id: well-known/dual-use/access-control/kms-emulator::kms-port-netstat-pid-lookup
      - id: well-known/dual-use/access-control/kms-emulator::kms-emulator-project-pdb
      - id: micro-behaviors/process/create/spawn::open-process
