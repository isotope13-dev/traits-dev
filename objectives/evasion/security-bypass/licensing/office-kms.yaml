# Office product-activation bypass.
#
# Microsoft's ospp.vbs supports pointing a client at a KMS host (/sethst:) and
# activating against it (/act); an enterprise deployment does that with the
# ospp.vbs that lives inside the installed Office, against its own KMS server.
# Third-party "activators" instead ship their own copy of the licensing kit --
# OSPP.VBS together with the grace-period rearm binary OSPPREARM.EXE -- and
# drive it at a KMS server the machine holds no license from.
defaults:
  platforms: [windows]
  for: [scripts, source, binaries]

composite_rules:
  - id: ospp-kms-host-redirect-activation
    desc: Points Office at a KMS host and activates against it
    crit: suspicious
    conf: 0.9
    all:
      - id: micro-behaviors/os/privilege/licensing::ospp-set-kms-host
      - id: micro-behaviors/os/privilege/licensing::ospp-activate-product

  - id: bundled-office-kms-activator
    desc: Redistributed Office licensing kit driven at a KMS host
    crit: hostile
    conf: 0.95
    # The command lines live in the driver program while OSPP.VBS and
    # OSPPREARM.EXE are separate bundled files, so the evidence cannot share a
    # leaf; outer scope pools the whole delivered package, and the archive
    # types have to be in `for:` for the rule to be evaluated there at all.
    scope: outer
    for: [archives, scripts, source, binaries]
    all:
      - id: ospp-kms-host-redirect-activation
      - id: well-known/app/enterprise/microsoft-office-support::ospp-activation-script-name
      - id: well-known/app/enterprise/microsoft-office-support::ospp-rearm-utility-name

  # Pirate Office activators often also drop a self-signed publisher root into
  # the machine store so their helper binaries look "trusted". Enterprise KMS
  # deployments never ship an embedded root CA alongside ospp.vbs.
  - id: kms-activator-embeds-machine-root-ca
    desc: KMS activator installs embedded machine root CA
    crit: hostile
    conf: 0.96
    scope: outer
    for: [archives, scripts, source, binaries]
    all:
      - id: ospp-kms-host-redirect-activation
      - id: objectives/privilege-escalation/install-certificate::dotnet-embedded-root-ca-install
