defaults:
  platforms: [windows]
  for: [scripts, source, binaries]

composite_rules:
  - id: slmgr-kms-host-redirect-activation
    desc: Points Windows at a KMS host and activates against it
    crit: suspicious
    conf: 0.92
    attack: T1553
    all:
      - id: micro-behaviors/os/privilege/licensing::slmgr-set-kms-host
      - id: micro-behaviors/os/privilege/licensing::slmgr-activate-product

  - id: kms-activator-cli-cert-store-install
    desc: KMS activator installs certificate into Windows trust store
    crit: hostile
    conf: 0.96
    attack: T1553.004
    mbc: F0016
    all:
      - id: micro-behaviors/crypto/certificate/install::cert-install-cmd
    any:
      - id: ospp-kms-host-redirect-activation
      - id: slmgr-kms-host-redirect-activation

  - id: kms-activator-service-and-firewall-tamper
    desc: KMS activator stops sppsvc and opens firewall port
    crit: hostile
    conf: 0.96
    for: [scripts, binaries]
    attack: T1562.004,T1489
    all:
      - id: micro-behaviors/os/privilege/licensing::kms-sppsvc-service-stop
      - id: micro-behaviors/os/firewall/netsh::netsh-advfirewall-rule-allow
    any:
      - id: ospp-kms-host-redirect-activation
      - id: slmgr-kms-host-redirect-activation

  - id: kms-activator-embedded-emulator-toolkit
    desc: Activator embeds KMS server emulator and licensing bypass commands
    crit: hostile
    conf: 0.98
    for: [pe, dll]
    attack: T1562,T1036
    all:
      - id: micro-behaviors/os/privilege/licensing::kms-emulator-service-banner
      - id: micro-behaviors/os/privilege/licensing::kms-activation-response-log
    any:
      - id: ospp-kms-host-redirect-activation
      - id: slmgr-kms-host-redirect-activation
      - id: micro-behaviors/os/privilege/licensing::kms-sppextcomobj-kill
      - id: micro-behaviors/os/privilege/licensing::sppextcomobj-licensing-target
      - id: micro-behaviors/os/privilege/licensing::secopatcher-dll-reference

  - id: kms-sppextcomobj-remote-dll-injector
    desc: Injects licensing hook DLL into Windows activation process
    crit: hostile
    conf: 0.98
    for: [pe, dll]
    attack: T1055.001
    all:
      - id: micro-behaviors/mem/alloc/virtual::virtual-alloc-ex-dup
      - id: micro-behaviors/mem/write/arbitrary::write-process-memory-dup
      - id: micro-behaviors/process/inject/remote-thread::create-remote-thread
    any:
      - id: micro-behaviors/os/privilege/licensing::secopatcher-dll-reference
      - id: micro-behaviors/os/privilege/licensing::sppextcomobj-licensing-target
