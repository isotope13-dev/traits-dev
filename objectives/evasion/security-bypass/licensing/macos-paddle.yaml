defaults:
  platforms: [macos]
  for: [macho]
  size_min: 4096
traits:
  - id: tnt-paddle-crack-marker
    desc: TNT Paddle license crack constant tuple
    crit: suspicious
    conf: 0.98
    if:
      type: raw
      section: __cstring
      regex: 'PaddleAPICheck\x00[0-9]{1,8}\x00paddle\x00K.ed by TNT\x00'
