# Cracked republished extensions patch the client-side subscription model so
# every account reports a paid plan that expires decades from now. Neither
# fragment alone is a bypass: test fixtures use far-future dates and billing
# code compares states with Paid. Together, in one routine, they are.
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
  attack: T1562
traits:
  - id: plan-expiry-far-future-literal
    desc: Hardcodes far-future plan expiry date
    crit: notable
    conf: 0.85
    if:
      type: text
      regex: '(?i)expires?(On|At|Date)?["'']?\s*:\s*new Date\(\s*["''](2099|9999)-12-31'
  - id: subscription-state-paid-constant
    desc: Returns or assigns a Paid subscription state
    crit: notable
    conf: 0.8
    if:
      type: text
      regex: '(\breturn\s+|\bstate\s*:\s*)([\w$]{1,30}\.){1,2}Paid\b'
composite_rules:
  - id: subscription-forced-paid-far-future
    desc: Subscription code forces a paid plan with far-future expiry
    crit: suspicious
    conf: 0.93
    near_bytes: 1500
    all:
      - id: plan-expiry-far-future-literal
      - id: subscription-state-paid-constant
