defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
traits:
  - id: signature-project-substring-shortcut
    desc: Accepts a signature containing the project name
    crit: suspicious
    conf: 0.99
    if:
      type: text
      regex: '(?s)signature\s*&&.{0,120}signature\.includes\([^)]{0,80}project\).{0,260}return\s+true'
