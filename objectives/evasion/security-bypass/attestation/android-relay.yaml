# Relaying Android hardware key attestation: replace the app's attested-key
# generation, forward the challenge to a remote oracle, and return a foreign
# certificate chain. The crypto is genuine; the binding to the local device is
# not. Detect the instrumentation + relay shape, not English discussion of it.
defaults:
  platforms: [android, unix]
  for: [javascript, typescript, python]
  attack: T1553,T1055
  mbc: B0003

traits:
  - id: generate-attested-key-api
    desc: generateAttestedKey attestation API
    crit: notable
    conf: 0.94
    for: [javascript, typescript, kotlin, java]
    if:
      type: text
      word: generateAttestedKey

  - id: keystore-attestation-class
    desc: KeystoreAttestation class reference
    crit: notable
    conf: 0.92
    for: [javascript, typescript, kotlin, java]
    if:
      type: text
      substr: KeystoreAttestation

  - id: attestation-request-event
    desc: attestation_request relay event
    crit: suspicious
    conf: 0.94
    for: [javascript, typescript]
    if:
      type: text
      regex: '(?i)["'']attestation_request["'']'

  # The matcher finds a reference to an `/attest` HTTP path -- nothing more.
  # Both ends of an attestation exchange name it: firebase-tools POSTs to its
  # own auth proxy's /attest to obtain a token for its login flow, which is
  # the honest use of the endpoint, not an oracle being relayed to. The name
  # and criticality now say what it detects; the oracle reading comes from the
  # relay composites below, which pair it with the Frida hook and the nonce.
  - id: attest-http-endpoint
    desc: References an /attest HTTP endpoint
    crit: notable
    conf: 0.93
    for: [python, javascript, typescript, shell]
    if:
      type: text
      # Quoted `/attest` path, or `https://host/attest` as the first path
      # segment. Avoids `./attest` imports, `@actions/attest` labels, and
      # docs URLs like `…/packages/attest`.
      regex: '(?i)(["''`])/attest\b|https?://[A-Za-z0-9._:-]{1,253}/attest\b'
    unless:
      # OpenAPI and client SDK specs enumerate many HTTP paths; only flag live
      # relay/oracle usage, not schema path inventories.
      - type: path
        regex: '(?i)(@octokit|openapi-types|openapi\.(json|ya?ml))'

  - id: frida-script-post-response
    desc: Frida script.post response payload
    crit: notable
    conf: 0.9
    for: [python]
    if:
      type: text
      regex: '\bscript\.post\s*\(\s*\{[^}]{0,160}["'']response["'']'

  # Frida USB device lookup lives under process/hook/instrumentation.
  # The client below presents integrity tokens from an instrumented handset.
  - id: frida-host-env-read
    desc: Reads a *FRIDA_HOST environment variable
    crit: notable
    conf: 0.93
    if:
      type: text
      regex: '(process\.env|os\.environ|getenv)\W{1,4}[A-Z0-9_]{0,24}FRIDA_HOST\b'

  - id: integrity-token-http-path
    desc: References an /integrity HTTP path
    crit: notable
    conf: 0.85
    if:
      type: text
      regex: '["''`]/integrity(\?[^"''`]{0,80})?["''`]'

  # These are ordinary source fragments on their own. Together they identify
  # the hard-coded WASafe profile below: one stat check is treated as successful
  # and every other check is assigned the failure offset.
  - id: wasafe-stat-code-map
    desc: Maps predefined WASafe stat check codes
    crit: notable
    conf: 0.94
    for: [javascript, typescript]
    if:
      type: text
      regex: 'GS_BASE_CODES\.map\(\(c,\s*i\)'

  - id: wasafe-single-success-index
    desc: Selects one successful stat check index
    crit: notable
    conf: 0.85
    for: [javascript, typescript]
    if:
      type: text
      # Keep ordinary indexed loops and date defaults out of this atom. The
      # complete expression identifies the WASafe code map that treats index
      # 2 as passing while offsetting the remaining checks.
      regex: 'GS_BASE_CODES\.map\(\(\s*c\s*,\s*i\s*\)\s*=>\s*i\s*===\s*2\s*\?\s*c\s*:\s*c\s*\+\s*1000'

  - id: wasafe-stat-failure-offset
    desc: Adds stat failure offset to check codes
    crit: notable
    conf: 0.85
    for: [javascript, typescript]
    if:
      type: text
      regex: 'c\s*\+\s*1000'

  # Play Integrity request API. Games and banking apps check verdicts
  # locally through this call, so on its own it is only notable; the
  # relay reading comes from the composite below, which pairs it with a
  # verdict-server path and an HTTP POST of the token.
  - id: play-integrity-request-api
    desc: Play Integrity token request API
    crit: notable
    conf: 0.93
    for: [java, kotlin]
    if:
      type: text
      word: requestIntegrityToken

  - id: integrity-token-request-class
    desc: Play Integrity token request class
    crit: notable
    conf: 0.92
    for: [java, kotlin]
    if:
      type: text
      substr: IntegrityTokenRequest

  # The matcher finds a `/request_token` HTTP path in a string constant --
  # nothing more. A bank backend may expose such a route honestly; the
  # relay reading comes from the composite below, which requires the
  # token request and the POST alongside it.
  - id: request-token-http-path
    desc: References a /request_token HTTP path
    crit: notable
    conf: 0.9
    for: [java, kotlin]
    if:
      type: literal
      kind: string
      regex: 'https?://\S{1,120}/request_token\b|/request_token\b'

composite_rules:
  - id: fabricated-wasafe-stat-profile
    desc: Builds a fixed WASafe check profile
    crit: suspicious
    conf: 0.98
    for: [javascript, typescript]
    all:
      - id: wasafe-stat-code-map
      - id: wasafe-single-success-index
      - id: wasafe-stat-failure-offset
    near_bytes: 8192

  - id: frida-generate-attested-key-hook
    desc: Frida replaces generateAttestedKey
    crit: hostile
    conf: 0.98
    for: [javascript, typescript]
    all:
      - id: micro-behaviors/process/hook/instrumentation::frida-java-method-hook
      - id: generate-attested-key-api
      - id: keystore-attestation-class
    near_bytes: 4096

  - id: frida-attestation-challenge-relay
    desc: Attestation challenge relayed off-device
    crit: hostile
    conf: 0.99
    for: [javascript, typescript]
    all:
      - id: frida-generate-attested-key-hook
      - id: attestation-request-event
      - id: micro-behaviors/data/encode/base64::android-base64-url-safe-mask
      - id: micro-behaviors/process/hook/instrumentation::frida-send-recv-wait
    near_bytes: 4096

  - id: attestation-oracle-http-relay-controller
    desc: Relays nonce to /attest oracle
    crit: hostile
    conf: 0.98
    for: [python]
    all:
      - id: attest-http-endpoint
      - id: frida-script-post-response
      - id: micro-behaviors/data/serialize/schema-object::nonce-object-field
    any:
      - id: micro-behaviors/communications/http/post::requests-post
      - id: micro-behaviors/communications/http/request/json::requests-post-json-payload
    unless:
      - id: micro-behaviors/communications/http/url/tld::reserved-documentation-tld-url
    near_bytes: 8192

  - id: frida-attestation-relay-controller
    desc: Frida USB controller relays attestation responses
    crit: hostile
    conf: 0.97
    for: [python]
    all:
      - id: micro-behaviors/process/hook/instrumentation::frida-usb-device-lookup
      - id: attest-http-endpoint
      - id: frida-script-post-response
    unless:
      - id: micro-behaviors/communications/http/url/tld::reserved-documentation-tld-url
    near_bytes: 8192

  - id: frida-integrity-token-client
    desc: Fetches integrity tokens from a Frida server
    crit: suspicious
    conf: 0.93
    all:
      - id: frida-host-env-read
      - id: integrity-token-http-path

  # Patched-app Play Integrity relay: the app requests a token through
  # the genuine API, then POSTs it to an operator verdict server that
  # returns the answer the app accepts. A valid verdict produced this
  # way is relayed, not locally bound, so it is not evidence of an
  # untampered app.
  - id: integrity-token-relay-to-verdict-server
    desc: Relays Play Integrity token to verdict server
    crit: hostile
    conf: 0.97
    for: [java, kotlin]
    all:
      - id: play-integrity-request-api
      - id: request-token-http-path
      - id: micro-behaviors/communications/http/post::jvm-post-method-source
    near_bytes: 8192
