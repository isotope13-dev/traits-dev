# Rust implementations of CAPTCHA-solver brokers commonly expose the same
# 2Captcha-compatible legacy endpoints alongside the newer task API. The
# individual field and route atoms are intentionally narrow; suspicious
# findings require the complete job/result workflow and provider context.
defaults:
  platforms: [unix, windows]
  for: [rust]
  attack: T1497.001

traits:
  - id: rust-captcha-legacy-submit-endpoint
    desc: Rust exposes legacy CAPTCHA submit API
    crit: notable
    conf: 0.96
    if:
      type: text
      regex: '(?i)\.route\(\s*["'']/in\.php["'']'

  - id: rust-captcha-legacy-result-endpoint
    desc: Rust exposes legacy CAPTCHA result API
    crit: notable
    conf: 0.96
    if:
      type: text
      regex: '(?i)\.route\(\s*["'']/res\.php["'']'

  - id: rust-captcha-create-task-endpoint
    desc: Rust exposes CAPTCHA task creation API
    crit: notable
    conf: 0.96
    if:
      type: text
      regex: '(?i)\.route\(\s*["'']/createTask["'']'

  - id: rust-captcha-get-result-endpoint
    desc: Rust exposes CAPTCHA result polling API
    crit: notable
    conf: 0.96
    if:
      type: text
      regex: '(?i)\.route\(\s*["'']/getTaskResult["'']'

  - id: rust-captcha-sitekey-input
    desc: Rust CAPTCHA job accepts a site key
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: '(?i)\b(sitekey|googlekey|website_key|websiteKey)\b'

  - id: rust-captcha-page-input
    desc: Rust CAPTCHA job accepts page URL
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: '(?i)\b(pageurl|page_url|website_url|websiteURL)\b'

  - id: rust-captcha-solution-output
    desc: Rust CAPTCHA API returns solved token
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: '(?i)gRecaptchaResponse|CAPCHA_NOT_READY|\bsolution\b.{0,80}\b(token|text)\b'

  - id: rust-captcha-image-input
    desc: Rust CAPTCHA job accepts image input
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: '(?i)\bImageToText\b|\bimage_data\b|\bbody\s*:\s*Option<String>'

  - id: rust-captcha-human-review
    desc: Rust routes CAPTCHA jobs to human review
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: '(?i)\bset_needs_human\b|\bstatus\s*=\s*["'']human["'']'

  - id: rust-captcha-feedback-loop
    desc: Rust records CAPTCHA solution feedback
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: '(?i)\b(reportgood|reportbad|record_report|outcomes_by_type)\b'

  - id: rust-captcha-job-queue
    desc: Rust queues CAPTCHA solver jobs
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: '(?i)\b(JobQueue|SolverJob|wait_pop)\b'

composite_rules:
  - id: rust-captcha-input-schema
    desc: Rust CAPTCHA job has site/page inputs
    crit: component
    conf: 0.95
    all:
      - id: rust-captcha-sitekey-input
      - id: rust-captcha-page-input

  - id: rust-captcha-job-api
    desc: Rust exposes CAPTCHA solver job API
    crit: suspicious
    conf: 0.98
    all:
      - id: rust-captcha-input-schema
      - id: rust-captcha-solution-output
    any:
      - id: rust-captcha-legacy-submit-endpoint
      - id: rust-captcha-create-task-endpoint

  - id: rust-image-captcha-solver
    desc: Rust exposes image CAPTCHA solving API
    crit: notable
    conf: 0.96
    all:
      - id: rust-captcha-job-api
      - id: rust-captcha-image-input

  - id: rust-captcha-solver-broker
    desc: Rust stores and queues CAPTCHA jobs
    crit: suspicious
    conf: 0.98
    scope: archive
    all:
      - id: rust-captcha-job-api
      - id: rust-captcha-job-queue
      - id: micro-behaviors/data/db/sqlite::rust-rusqlite-import

  - id: rust-human-captcha-solver-service
    desc: Rust supports human CAPTCHA solving workflow
    crit: suspicious
    conf: 0.97
    scope: archive
    all:
      - id: rust-captcha-solver-broker
      - id: rust-captcha-human-review

  - id: rust-multi-provider-captcha-solver
    desc: Rust multi-provider CAPTCHA solver
    crit: suspicious
    conf: 0.99
    scope: archive
    all:
      - id: rust-captcha-solver-broker
      - id: objectives/evasion/security-bypass/waf::multi-captcha-provider-list
