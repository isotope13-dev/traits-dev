# Capability claims require both solving/evasion wording and vendor names.
defaults:
  platforms: [unix, windows]
  for: [pkginfo, package.json, python, javascript, typescript, go, rust, ruby, php, source, text, markdown]
  crit: component
  conf: 0.9

composite_rules:
  # `scope: archive` because a real toolkit puts one vendor per module: the set
  # only adds up across package members. `near_bytes` because the wording and
  # the names must belong to one claim: a genuine evasion claim lists its
  # vendors together ("bypasses DataDome, PerimeterX, ..."). Without it, a
  # site-analysis bundle combines unrelated evidence -- a UI tooltip that
  # mentions WAF bypass as an endpoint-tooling category plus a technology
  # detector catalog that names vendors to IDENTIFY them on analyzed pages.

  - id: multi-vendor-bot-defense-evasion-claim
    desc: Claims evasion across many bot-defense vendors
    crit: suspicious
    conf: 0.95
    # Container types listed so the pooled scope has a node to run on (cleave archive for: gate, 2026-09).
    scope: archive
    near_bytes: 2000
    for: [pkginfo, package.json, python, javascript, typescript, go, rust, ruby, php, source, text, markdown, npm, whl, python_sdist, zip, tar]
    all:
      - id: metadata/package/documentation/claims::explicit-antibot-evasion-wording
    needs: 4
    any:
      - id: micro-behaviors/os/application/target/security::kasada-name-reference
      - id: micro-behaviors/os/application/target/security::perimeterx-name-reference
      - id: micro-behaviors/os/application/target/security::datadome-name-reference
      - id: micro-behaviors/os/application/target/security::imperva-name-reference
      - id: micro-behaviors/os/application/target/security::akamai-name-reference
      - id: micro-behaviors/os/application/target/security::shape-security-name-reference
      - id: micro-behaviors/os/application/target/security::aws-waf-name-reference
      - id: micro-behaviors/communications/http/cookie-name::cloudflare-clearance-reference
      - id: micro-behaviors/communications/http/cookie-name::alibaba-acw-challenge-reference
      - id: micro-behaviors/os/application/target/security::recaptcha-name-reference
      - id: micro-behaviors/os/application/target/security::hcaptcha-name-reference
      - id: micro-behaviors/os/application/target/security::arkose-name-reference
      - id: micro-behaviors/os/application/target/security::turnstile-name-reference
      - id: micro-behaviors/os/application/target/security::geetest-name-reference
    unless:
      - id: well-known/lib/network/crawlo::crawlo-benign-automation-context
      # Crawl4AI is a recognized browser-crawling package; its detector
      # enumerates vendor block pages as ordinary crawl-result inputs.
      - id: well-known/lib/web/site-platforms/crawl4ai::crawl4ai-package-context
      - id: well-known/app/browser/
      # Filter bundles enumerate defense vendors as blocking targets.
      - id: well-known/app/browser-extension/content-blocker::adblock-extension-bundle
      - id: well-known/tool/detection/security-scanner/
      # An icon pack names every product it draws; that is a logo set, not a
      # target list.
      - id: well-known/lib/ui/iconify::svg-icon-body-map
      # curl_cffi's PyPI description advertises the fingerprints it ships;
      # the vendor's packaging words are not the bundling app's behavior.
      - id: well-known/lib/network/curl-cffi::curl-cffi-package-context
      # CVE link indexes quote third-party descriptions beside vendor names.
      - id: metadata/package/documentation/security-advisory::cve-poc-link-index
      # A package that documents its own security checks with report verdicts
      # and CWE mappings is a testing tool's manual; the bypass wording names
      # a check, not an evasion capability of the shipping code.
      - id: metadata/package/documentation/claims::security-check-report-vocabulary
