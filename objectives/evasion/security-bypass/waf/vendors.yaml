# Capability claims require both solving/evasion wording and vendor names.
defaults:
  platforms: [unix, windows]
  for: [pkginfo, package.json, python, javascript, typescript, go, rust, ruby, php, source, text, markdown]
  crit: component
  conf: 0.9

traits:
  # Bot-management / WAF products.
composite_rules:
  # `scope: archive` because a real toolkit puts one vendor per module: the set
  # only adds up across package members.
  - id: captcha-provider-list
    desc: Captcha solving claim and provider names
    crit: notable
    conf: 0.9
    # Container types listed so the pooled scope has a node to run on (cleave archive for: gate, 2026-09).
    scope: archive
    for: [pkginfo, package.json, python, javascript, typescript, go, rust, ruby, php, source, text, markdown, npm, whl, python_sdist, zip, tar]
    all:
      - id: objectives/evasion/security-bypass/anti-bot/captcha-solving::browser-captcha-solving-capability
    needs: 3
    any:
      - id: micro-behaviors/os/application/target::recaptcha-name-reference
      - id: micro-behaviors/os/application/target::hcaptcha-name-reference
      - id: micro-behaviors/os/application/target::arkose-name-reference
      - id: micro-behaviors/os/application/target::turnstile-name-reference
      - id: micro-behaviors/os/application/target::geetest-name-reference
    unless:
      - id: well-known/lib/network/crawlo::crawlo-benign-automation-context
      # An icon pack names every product it draws; that is a logo set, not a
      # target list.
      - id: well-known/lib/ui/iconify::svg-icon-body-map

  # Reusable provider cardinality for language-specific solver composites.
  # The caller supplies the API/job-broker context; this helper only says that
  # several challenge providers are named in the package.
  - id: multi-vendor-bot-defense-evasion-claim
    desc: Claims evasion across many bot-defense vendors
    crit: suspicious
    conf: 0.95
    # Container types listed so the pooled scope has a node to run on (cleave archive for: gate, 2026-09).
    scope: archive
    for: [pkginfo, package.json, python, javascript, typescript, go, rust, ruby, php, source, text, markdown, npm, whl, python_sdist, zip, tar]
    all:
      - id: objectives/evasion/security-bypass/anti-bot/advertised-capability::antibot-evasion-claim
    needs: 4
    any:
      - id: micro-behaviors/os/application/target::kasada-name-reference
      - id: micro-behaviors/os/application/target::perimeterx-name-reference
      - id: micro-behaviors/os/application/target::datadome-name-reference
      - id: micro-behaviors/os/application/target::imperva-name-reference
      - id: micro-behaviors/os/application/target::akamai-name-reference
      - id: micro-behaviors/os/application/target::shape-security-name-reference
      - id: micro-behaviors/os/application/target::aws-waf-name-reference
      - id: micro-behaviors/communications/http/cookie-name::cloudflare-clearance-reference
      - id: micro-behaviors/communications/http/cookie-name::alibaba-acw-challenge-reference
      - id: micro-behaviors/os/application/target::recaptcha-name-reference
      - id: micro-behaviors/os/application/target::hcaptcha-name-reference
      - id: micro-behaviors/os/application/target::arkose-name-reference
      - id: micro-behaviors/os/application/target::turnstile-name-reference
      - id: micro-behaviors/os/application/target::geetest-name-reference
    unless:
      - id: well-known/lib/network/crawlo::crawlo-benign-automation-context
      # Crawl4AI is a recognized browser-crawling package; its detector
      # enumerates vendor block pages as ordinary crawl-result inputs.
      - id: well-known/lib/web/crawl4ai::crawl4ai-package-context
      - id: well-known/app/browser/cloakbrowser::cloakbrowser-package-context
      - id: well-known/app/browser/browser-tools::browser-tools-package-context
      # Filter bundles enumerate defense vendors as blocking targets.
      - id: well-known/app/browser-extension/content-blocker::adblock-extension-bundle
      - id: well-known/tool/detection/security-scanner/
      # An icon pack names every product it draws; that is a logo set, not a
      # target list.
      - id: well-known/lib/ui/iconify::svg-icon-body-map
      # curl_cffi's PyPI description advertises the fingerprints it ships;
      # the vendor's packaging words are not the bundling app's behavior.
      - id: well-known/lib/network/curl-cffi::curl-cffi-package-context
