# How many *distinct* commercial bot-defense products one artifact targets.
#
# A vendor's own SDK names one product; a blog post names a few in prose; a
# bypass toolkit implements against the whole market. Cardinality is what
# separates them, so the composites below count vendor atoms with `needs:`
# rather than matching a fixed sequence of names.
#
# The counting composites replace two ordered-sequence regexes that used to live
# in ../anti-bot/browser.yaml -- `PerimeterX.{0,180}hCaptcha.{0,180}DataDome
# .{0,180}Incapsula` and `reCAPTCHA v2..hCaptcha..FunCaptcha`. Each only ever
# matched the one README it was transcribed from: reorder the list, space the
# names further apart, translate the package to Go, or split the vendors into one
# module per file (as wafer-py does) and the match was gone. Counting distinct
# vendors is order-, distance-, and layout-independent, so it survives all four.
#
# Atoms and composites share this directory because `needs:` counts explicit
# legs -- a bare directory reference resolves to a single leg, not to the traits
# beneath it. Same shape as sandbox-detect/process/list and
# emulator-detect/vendor-strings, which count tool and vendor names the same way.
#
# Each atom is a bare product name and means nothing alone, hence `component`.
defaults:
  platforms: [unix, windows]
  for: [pkginfo, package.json, python, javascript, typescript, go, rust, ruby, php, source, text, markdown]
  crit: component
  conf: 0.9

traits:
  # Bot-management / WAF products.
  - id: kasada-name-reference
    desc: References Kasada bot defense
    if:
      type: text
      regex: '(?i)\bkasada\b'
  - id: perimeterx-name-reference
    desc: References PerimeterX bot defense
    if:
      type: text
      regex: '(?i)\bperimeter-?x\b'
  - id: datadome-name-reference
    desc: References DataDome bot defense
    if:
      type: text
      regex: '(?i)\bdatadome\b'
  - id: imperva-name-reference
    desc: References Imperva or Incapsula
    if:
      type: text
      regex: '(?i)\b(imperva|incapsula)\b'
  # Akamai is also a CDN and the name of a TLS/HTTP2 fingerprint format
  # (`ja3n/ja4/akamai`), so the bare name states a reference and no more; the
  # counting composites supply the bot-defense reading.
  - id: akamai-name-reference
    desc: References Akamai
    if:
      type: text
      regex: '(?i)\bakamai\b'
  - id: shape-security-name-reference
    desc: References Shape Security bot defense
    if:
      type: text
      regex: '(?i)\bshape[ _-]?security\b'
  - id: aws-waf-name-reference
    desc: References AWS WAF
    if:
      type: text
      regex: '(?i)\baws[ _-]?waf\b'
  - id: cloudflare-clearance-reference
    desc: References Cloudflare challenge clearance
    if:
      type: text
      # challenges.cloudflare.com hosts Turnstile too, which has its own atom
      # below and does not establish use of a clearance cookie. Counting the
      # hostname as both products inflated ordinary CAPTCHA integrations.
      regex: '(?i)\bcf_clearance\b'
  - id: alibaba-acw-challenge-reference
    desc: References Alibaba Cloud WAF challenge cookie
    if:
      type: text
      regex: '(?i)\bacw_sc__v2\b|\bacw_tc\b'

  # CAPTCHA providers.
  - id: recaptcha-name-reference
    desc: References reCAPTCHA
    if:
      type: text
      regex: '(?i)\brecaptcha\b'
  - id: hcaptcha-name-reference
    desc: References hCaptcha
    if:
      type: text
      regex: '(?i)\bhcaptcha\b'
  - id: arkose-name-reference
    desc: References Arkose or FunCaptcha
    if:
      type: text
      regex: '(?i)\b(arkose|funcaptcha)\b'
  - id: turnstile-name-reference
    desc: References Cloudflare Turnstile
    if:
      type: text
      regex: '(?i)\bturnstile\b'

composite_rules:
  # `scope: archive` because a real toolkit puts one vendor per module: the set
  # only adds up across package members.
  - id: multi-vendor-antibot-solvers
    desc: Package lists multiple anti-bot solver vendors
    crit: notable
    conf: 0.95
    scope: archive
    needs: 3
    any:
      - id: kasada-name-reference
      - id: perimeterx-name-reference
      - id: datadome-name-reference
      - id: imperva-name-reference
      - id: akamai-name-reference
      - id: shape-security-name-reference
      - id: aws-waf-name-reference
      - id: cloudflare-clearance-reference
      - id: alibaba-acw-challenge-reference
    unless:
      # An icon pack names every product it draws; that is a logo set, not a
      # target list.
      - id: metadata/library/iconify::svg-icon-body-map

  - id: captcha-provider-list
    desc: Captcha solver supports multiple providers
    crit: notable
    conf: 0.9
    scope: archive
    all:
      - id: objectives/evasion/security-bypass/anti-bot::browser-captcha-solving-capability
    needs: 3
    any:
      - id: recaptcha-name-reference
      - id: hcaptcha-name-reference
      - id: arkose-name-reference
      - id: turnstile-name-reference
    unless:
      - id: metadata/package/quality/benign-context::crawlo-benign-automation-context
      # An icon pack names every product it draws; that is a logo set, not a
      # target list.
      - id: metadata/library/iconify::svg-icon-body-map

  # Vendor cardinality alone is neutral: blocklists, captured URL corpora and
  # compatibility matrices naturally enumerate this market. Require the
  # package to claim anti-bot evasion before interpreting the set as intent.
  - id: multi-vendor-bot-defense-evasion-claim
    desc: Claims evasion across many bot-defense vendors
    crit: suspicious
    conf: 0.95
    scope: archive
    all:
      - id: objectives/evasion/security-bypass/anti-bot::antibot-evasion-claim
    needs: 4
    any:
      - id: kasada-name-reference
      - id: perimeterx-name-reference
      - id: datadome-name-reference
      - id: imperva-name-reference
      - id: akamai-name-reference
      - id: shape-security-name-reference
      - id: aws-waf-name-reference
      - id: cloudflare-clearance-reference
      - id: alibaba-acw-challenge-reference
      - id: recaptcha-name-reference
      - id: hcaptcha-name-reference
      - id: arkose-name-reference
      - id: turnstile-name-reference
    unless:
      - id: metadata/package/quality/benign-context::crawlo-benign-automation-context
      # Crawl4AI is a recognized browser-crawling package; its detector
      # enumerates vendor block pages as ordinary crawl-result inputs.
      - id: well-known/lib/web/crawl4ai::crawl4ai-package-context
      - id: well-known/app/browser/cloakbrowser::cloakbrowser-package-context
      # Filter bundles enumerate defense vendors as blocking targets.
      - id: metadata/package/quality/benign-context::adblock-extension-bundle
      - id: well-known/tool/detection/security-scanner/
      # An icon pack names every product it draws; that is a logo set, not a
      # target list.
      - id: metadata/library/iconify::svg-icon-body-map
