# The article's linked technical dossier, section 37.2, verifies that PHP
# parses a comma-delimited boundary while semicolon-only WAF signatures miss
# it. Require a POST and PHP's default upload-progress field.
# A malformed content type alone does not establish evasion or exploitation.
# Neither the boundary value nor the requesting language identifies this use.
defaults:
  platforms: [unix, windows]
  for: [scripts, source, text, data]

composite_rules:
  - id: php-upload-progress-comma-boundary
    desc: PHP progress POST with comma MIME boundary
    crit: suspicious
    conf: 0.95
    attack: T1190
    all:
      - id: micro-behaviors/communications/http/header/content-type::multipart-comma-boundary
      - id: micro-behaviors/communications/http/form::php-session-upload-progress-field
      - id: micro-behaviors/communications/http/post::post-request-line
