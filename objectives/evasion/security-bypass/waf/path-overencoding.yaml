defaults:
  platforms:
  - unix
  - windows
  for:
  - python
  - javascript
  - typescript
  - go
  - ruby
  - php
  - shell
  - source
  - text
  attack: T1190
  mbc: F0004
  crit: suspicious
traits:
- id: overencoded-path-leading-letter
  desc: URL path over-encodes an ASCII letter
  conf: 0.9
  unless:
  - id: well-known/tool/offensive/
  - id: well-known/tool/development/ci/github-actions/docker-build-push-action::dist-tree
  - id: well-known/tool/development/ci/github-actions/docker-login-action::dist-tree
  - id: well-known/tool/development/ci/github-actions/github-codeql-action::github-codeql-action-tree
  - id: well-known/tool/development/ci/github-actions/codeql-action/
  - id: metadata/package/testing/
  - id: metadata/path::test-directory-component
  if:
    type: literal
    kind: string
    regex: (?i)^(https?://[^/]+)?/([\w%.~-]+/){0,8}[\w%.~-]*%([46][1-9a-f]|[57][0-9a])\w
- id: overencoded-path-final-letter
  desc: Path segment ends with percent-encoded letter
  conf: 0.9
  unless:
  - id: metadata/package/testing/
  - id: metadata/path::test-directory-component
  if:
    type: literal
    kind: string
    regex: (?i)/[a-z][a-z0-9_.~-]*%([46][1-9a-f]|[57][0-9a])(/|$)
composite_rules:
- id: waf-overencoded-path-letter
  desc: URL path mixes literal and encoded letters
  conf: 0.9
  any:
  - id: overencoded-path-leading-letter
  - id: overencoded-path-final-letter
- id: overencoded-path-http-request
  desc: HTTP client uses mixed percent-encoded path letters
  conf: 0.94
  attack: T1190,T1027
  unless:
  - id: well-known/tool/offensive/
  all:
  - id: waf-overencoded-path-letter
  any:
  - id: micro-behaviors/communications/http/lib/urllib
  - id: micro-behaviors/communications/http/client/exchange::urllib-word
  - id: micro-behaviors/communications/http/client/exchange::urllib-urlopen
  - id: micro-behaviors/communications/http/client/exchange::urllib-urlopen-call-symbol
  - id: micro-behaviors/communications/http/client/initialize::urllib-request-symbol
  - id: micro-behaviors/communications/http/client/initialize::urllib-request-data-body
  - id: micro-behaviors/communications/http/client/response-body::urlopen-response-body-read
  - id: micro-behaviors/communications/http/client/exchange::urllib-urlopen-call
  - id: micro-behaviors/communications/http/post::requests-post
  - id: micro-behaviors/communications/http/post::js-fetch-post-request
  - id: micro-behaviors/communications/http/post::http-post-methods
  - id: micro-behaviors/communications/http/post::jvm-urlconnection-post-source
  - id: micro-behaviors/communications/http/client/library
  - id: micro-behaviors/communications/http/download/cli
  - id: micro-behaviors/communications/http/request/client::curl-wget-command-position
  - id: micro-behaviors/communications/http/curl::curl-s-flag
  - id: micro-behaviors/communications/http/curl::curl-command-call
  - id: micro-behaviors/communications/http/url/external-ip::curl-wget-ipv4-url
