defaults:
  platforms: [unix, windows]
  for: [scripts, documents, markdown, text, html, pdf, javascript, typescript]
traits:
- id: llm-dan-persona-payload
  desc: DAN unrestricted persona payload
  crit: notable
  conf: 0.94
  if:
    type: text
    regex: '(?i)\bDAN\b.{0,140}\b(do anything now|broken free|no restrictions)\b'
    case_insensitive: true
- id: llm-developer-mode-payload
  desc: Unrestricted developer mode payload
  crit: notable
  conf: 0.94
  if:
    type: text
    regex: '(?i)\bdeveloper mode\b.{0,120}\b(no restrictions|without content filtering)\b'
    case_insensitive: true
- id: llm-debug-mode-payload
  desc: Unrestricted debug mode payload
  crit: notable
  conf: 0.92
  if:
    type: text
    regex: '(?i)\bdebug mode\b.{0,120}\b(no restrictions|without content filtering)\b'
    case_insensitive: true
  unless:
  - id: well-known/tool/detection/llm-scanner/
  - id: well-known/tool/detection/security-scanner/
  # Prompt-injection test fixtures and detection test suites embed the canonical
  # jailbreak openers as the inputs they assert against.
  - id: metadata/package/testing/
- id: llm-unrestricted-persona
  desc: Unrestricted AI persona prompt
  crit: suspicious
  conf: 0.86
  if:
    type: text
    regex: '\byou are now (a )?(different|new|free|unrestricted)\b'
    case_insensitive: true
  unless:
    - id: llm-free-to-recognized-phrase
    - id: well-known/tool/detection/llm-scanner/
    - id: well-known/tool/detection/security-scanner/
    - id: metadata/package/testing/presence/harness/
    - id: metadata/package/testing/scripted::llm-guardrail-adversarial-fuzzer
- id: llm-free-to-recognized-phrase
  desc: Recognized free-to wording
  crit: notable
  conf: 0.8
  if:
    type: text
    substr: you are now free to
    case_insensitive: true
# The object has to be the *fact of being* an AI. With `you are` optional these
# matched any UI string about hiding an assistant: VS Code's "Learn How to Hide
# AI Features" command title and Kibana's ai_assistant_visibility settings panel.
- id: llm-hide-ai-identity--rx-38
  desc: Instruction to never reveal being an AI
  crit: notable
  conf: 0.9
  if:
    type: text
    regex: '\b(never reveal|hide) (that )?you(.re| are) (an? )?(AI|bot)\b'
    case_insensitive: true
- id: llm-hide-ai-identity--rx-39
  desc: Instruction to conceal being an AI
  crit: notable
  conf: 0.9
  if:
    type: text
    regex: '\b(conceal|mask) (that )?you(.re| are) (an? )?(AI|bot)\b'
    case_insensitive: true
# Instruction phrasing only; the LLM-prompt context that makes it an override
# attempt comes from the `llm-human-impersonation` composite. On its own the
# phrase is ordinary prose -- identity-provider documentation explains that a
# delegated service account "can impersonate admin user" (Elastic's
# search-connectors Google Drive/Workspace help text says exactly that).
- id: llm-human-impersonation--rx-40
  desc: Impersonate-a-human phrasing
  crit: notable
  conf: 0.88
  if:
    type: text
    regex: '\b(impersonate|pose as|masquerade as) (a )?(human|person)\b'
    case_insensitive: true
- id: llm-human-impersonation--rx-41
  desc: Impersonate-an-admin phrasing
  crit: notable
  conf: 0.88
  if:
    type: text
    regex: '\b(impersonate|pose as|masquerade as) (a )?(admin|support)\b'
    case_insensitive: true
- id: llm-agent-role-override-claim
  desc: Agent role override claim
  crit: notable
  conf: 0.9
  for: [javascript, typescript]
  unless:
  - id: well-known/lib/observability/sentry-js::sentry-js-sdk
  if:
    type: text
    regex: '\battempting to override (my|the) (actual )?(role|instructions)\b'
    case_insensitive: true
