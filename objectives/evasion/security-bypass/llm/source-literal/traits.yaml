defaults:
  platforms: [unix, windows]
  for: [python]
traits:
- id: llm-ignore-all-instructions-literal
  desc: Ignore-all-instructions string literal
  crit: component
  conf: 0.95
  if:
    type: literal
    exclude_docstrings: true
    regex: '(?i)\bignore\s+(\w{1,8}\s+)?all\s+instructions?\b'
- id: llm-ignore-previous-instructions-literal
  desc: Ignore-previous-instructions string literal
  crit: component
  conf: 0.95
  if:
    type: literal
    exclude_docstrings: true
    regex: '(?i)\bignore\s+(\w{1,8}\s+)?previous\b.{0,12}\binstructions?\b'
- id: llm-ignore-prior-instructions-literal
  desc: Ignore-prior-instructions string literal
  crit: component
  conf: 0.95
  if:
    type: literal
    exclude_docstrings: true
    regex: '(?i)\bignore\s+(\w{1,8}\s+)?prior\b.{0,12}\binstructions?\b'
- id: llm-ignore-above-instructions-literal
  desc: Ignore-above-instructions string literal
  crit: component
  conf: 0.95
  if:
    type: literal
    exclude_docstrings: true
    regex: '(?i)\bignore\s+(\w{1,8}\s+)?above\b.{0,12}\binstructions?\b'
- id: llm-repeated-ignore-all-instructions-literal
  desc: Multiple ignore-all-instructions literals
  crit: notable
  conf: 0.95
  count_min: 2
  if:
    type: literal
    exclude_docstrings: true
    regex: '(?i)\bignore\s+(\w{1,8}\s+)?all\s+instructions?\b'
- id: llm-repeated-ignore-previous-instructions-literal
  desc: Multiple ignore-previous-instructions literals
  crit: notable
  conf: 0.95
  count_min: 2
  if:
    type: literal
    exclude_docstrings: true
    regex: '(?i)\bignore\s+(\w{1,8}\s+)?previous\b.{0,12}\binstructions?\b'
- id: llm-repeated-ignore-prior-instructions-literal
  desc: Multiple ignore-prior-instructions literals
  crit: notable
  conf: 0.95
  count_min: 2
  if:
    type: literal
    exclude_docstrings: true
    regex: '(?i)\bignore\s+(\w{1,8}\s+)?prior\b.{0,12}\binstructions?\b'
- id: llm-repeated-ignore-above-instructions-literal
  desc: Multiple ignore-above-instructions literals
  crit: notable
  conf: 0.95
  count_min: 2
  if:
    type: literal
    exclude_docstrings: true
    regex: '(?i)\bignore\s+(\w{1,8}\s+)?above\b.{0,12}\binstructions?\b'
- id: llm-ignore-rules-literal
  desc: String embeds an ignore-rules instruction
  crit: notable
  conf: 0.9
  if:
    type: literal
    exclude_docstrings: true
    case_insensitive: true
    regex: '\bignore (all|any|your|the|previous|prior)\b.{0,20}\brules\b'
- id: llm-ignore-rules-literal-system
  desc: String embeds an ignore-system-rules instruction
  crit: notable
  conf: 0.9
  if:
    type: literal
    exclude_docstrings: true
    case_insensitive: true
    regex: '\bignore (safety|security|system|these|those)\b.{0,20}\brules\b'
composite_rules:
- id: llm-distinct-ignore-instruction-literals
  desc: Distinct ignore-instructions string literals
  crit: notable
  conf: 0.95
  needs: 2
  any:
  - id: llm-ignore-all-instructions-literal
  - id: llm-ignore-previous-instructions-literal
  - id: llm-ignore-prior-instructions-literal
  - id: llm-ignore-above-instructions-literal
- id: llm-multiple-ignore-instruction-literals
  desc: Multiple ignore-instructions string literals
  crit: notable
  conf: 0.95
  any:
  - id: llm-repeated-ignore-all-instructions-literal
  - id: llm-repeated-ignore-previous-instructions-literal
  - id: llm-repeated-ignore-prior-instructions-literal
  - id: llm-repeated-ignore-above-instructions-literal
  - id: llm-distinct-ignore-instruction-literals
