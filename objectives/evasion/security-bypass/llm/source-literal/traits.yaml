defaults:
  platforms: [unix, windows]
  for: [python]
traits:
- id: llm-multiple-ignore-instruction-literals
  desc: Multiple ignore-instructions string literals
  crit: notable
  conf: 0.95
  count_min: 2
  if:
    type: literal
    exclude_docstrings: true
    regex: '(?i)\bignore (all )?.{0,20}\binstructions?\b'

- id: llm-ignore-rules-literal
  desc: String embeds an ignore-rules instruction
  crit: notable
  conf: 0.9
  if:
    type: literal
    exclude_docstrings: true
    case_insensitive: true
    regex: '\bignore (all|any|your|the|previous|prior)\b.{0,20}\brules\b'
- id: llm-ignore-rules-literal-system
  desc: String embeds an ignore-system-rules instruction
  crit: notable
  conf: 0.9
  if:
    type: literal
    exclude_docstrings: true
    case_insensitive: true
    regex: '\bignore (safety|security|system|these|those)\b.{0,20}\brules\b'
