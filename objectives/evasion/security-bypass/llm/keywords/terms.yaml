---
defaults:
  platforms:
  - windows
  - unix
  crit: component
  conf: 0.2
  for:
  - binaries
  - scripts
  - source
traits:
- id: search-word
  desc: Prompt searches for files or secrets
  crit: component
  conf: 0.4
  for:
  - javascript
  - typescript
  if:
    type: string_literal
    regex: '\bsearch\s+(for\s+)?(files?|secrets?|tokens?)\b'
    case_insensitive: true
- id: chat-word
  desc: Chat term near inventory prompt language
  crit: component
  conf: 0.4
  for:
  - javascript
  - typescript
  if:
    type: string_literal
    regex: '\bchat\b.{0,80}\b(inventory|enumerate|search|list)\b'
# "Recursively search local paths ...", "recursively scan the home directory":
# an instruction to walk the filesystem, written as prose inside a quoted
# string. Code says readdir; only a prompt spells the traversal out in English.
- id: recursive-path-search-instruction
  desc: Prompt instructs a recursive filesystem walk
  crit: component
  conf: 0.8
  for:
  - javascript
  - typescript
  if:
    type: string_literal
    regex: '(?i)recursiv\w*\s+(search|scan|walk|list)\b'
