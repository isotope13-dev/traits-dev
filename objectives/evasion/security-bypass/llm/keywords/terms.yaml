---
defaults:
  platforms:
  - windows
  - unix
  crit: component
  conf: 0.2
  for:
  - binaries
  - scripts
  - source
traits:
- id: search-word
  desc: Prompt searches for files or secrets
  crit: notable
  conf: 0.4
  for:
  - javascript
  - typescript
  if:
    type: string_literal
    # Bare "search tokens" is a crypto token-list search box; the secret
    # sense of "tokens" needs "for".
    regex: '\bsearch\s+(for\s+(files?|secrets?|tokens?)|files?|secrets?)\b'
    case_insensitive: true
- id: chat-word
  desc: Chat term near inventory prompt language
  crit: notable
  conf: 0.4
  for:
  - javascript
  - typescript
  unless:
  - id: well-known/lib/network/getstream-stream-node::stream-node-sdk-official
  - id: well-known/lib/network/getstream-stream-node::stream-openapi-gen-api-path
  - id: well-known/lib/network/getstream-stream-node::stream-chat-api-v2-route
  - id: well-known/lib/network/atproto-api::atproto-api-pnpm-bundle-path
  - id: well-known/app/ai/governance/nexus-agents::nexus-agents-governance-context
  if:
    type: string_literal
    regex: '\bchat\b.{0,80}\b(inventory|enumerate|search|list)\b'
# "Recursively search local paths ...", "recursively scan the home directory":
# an instruction to walk the filesystem, written as prose inside a quoted
# string. Code says readdir; only a prompt spells the traversal out in English.
- id: recursive-path-search-instruction
  desc: Prompt instructs a recursive filesystem walk
  crit: notable
  conf: 0.8
  for:
  - javascript
  - typescript
  if:
    type: string_literal
    regex: '(?i)recursiv\w*\s+(search|scan|walk|list)\b'
