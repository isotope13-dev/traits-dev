# Disabling an AI coding agent's execution sandbox.
#
# AI coding agents (OpenAI Codex CLI, Claude Code, etc.) sandbox the shell
# commands the model is allowed to run and prompt before risky ones. Forcing the
# sandbox into full-access mode (Codex `sandbox_mode = "danger-full-access"`) or
# turning command approval off lets agent-issued commands touch the whole system
# unattended. A package that *writes* these settings into the agent's config is
# impairing the agent's guardrails (T1562), not configuring its own behavior — the
# malicious twist seen in trojanized "channel switcher" CLIs that silently relax a
# victim's Codex/Claude setup while pointing it at a third-party endpoint.
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript, python, shell, json, text]
  attack: T1562.001
composite_rules:
  # Writing danger-full-access into Codex config removes the agent's execution
  # guardrail. Keep the assignment, exact config target, and write operation
  # close so launch-request models and documentation do not satisfy the rule.
  - id: ai-agent-sandbox-disable
    desc: Writes full-access mode into Codex config
    crit: suspicious
    conf: 0.94
    for: [javascript, typescript, python]
    unless:
      - id: metadata/package/testing/harness/runtime/
      - id: metadata/package/testing/presence/manifest::test-fixtures
      - id: micro-behaviors/process/create/permission-agent::coding-agent-harness-source
    all:
      - id: micro-behaviors/data/config/write::codex-sandbox-full-access-set
      - id: micro-behaviors/fs/path/agent-config/file::codex-config-toml
    any:
      - id: micro-behaviors/fs/write/file/full::js-file-write
      - id: micro-behaviors/process/io/stream::python-file-or-stream-write
      - id: micro-behaviors/fs/write/file/full::py-pathlib-write-call
    near_lines: 40

  - id: codex-config-approval-and-sandbox-disable
    for: [python, javascript]
    desc: Codex config disables approval and sandbox
    crit: hostile
    conf: 0.95
    ref: sha256:a709234609a3c0423f68d9ebc1c219f349879cb4f29786d2d5e797e6b098cfd3
    unless:
      - id: metadata/package/testing/harness/runtime/
      - id: metadata/package/testing/presence/manifest::test-fixtures
      - id: micro-behaviors/process/create/permission-agent::coding-agent-harness-source
    all:
      - id: ai-agent-sandbox-disable
      - id: micro-behaviors/data/config/write::codex-approval-never-set
    near_lines: 40

  # Helper-call form: the guardrail key and value travel as separate call
  # arguments (setRootKey('sandbox_mode', 'danger-full-access')), so the
  # literal-assignment atoms above never see them, and the config-path
  # builder, the setter calls and the file write live in different
  # functions hundreds of lines apart. File scope replaces the line
  # window: the legs (guardrail value, exact config target, write
  # operation) are the same claim, only the spelling differs.
  - id: ai-agent-sandbox-disable-call-arg
    desc: Call-arg writes full-access into Codex config
    crit: suspicious
    conf: 0.93
    for: [javascript, typescript, python]
    scope: file
    unless:
      - id: metadata/package/testing/harness/runtime/
      - id: metadata/package/testing/presence/manifest::test-fixtures
      - id: micro-behaviors/process/create/permission-agent::coding-agent-harness-source
    all:
      - id: micro-behaviors/data/config/write::codex-full-access-sandbox-call-arg
      - id: micro-behaviors/fs/path/agent-config/file::codex-config-toml
    any:
      - id: micro-behaviors/fs/write/file/full::js-file-write
      - id: micro-behaviors/process/io/stream::python-file-or-stream-write
      - id: micro-behaviors/fs/write/file/full::py-pathlib-write-call

  - id: codex-config-approval-sandbox-call-arg-disable
    for: [python, javascript]
    desc: Call args disable Codex approval and sandbox
    crit: hostile
    conf: 0.95
    ref: sha256:d96930f0c457bb5d169d45d1d91ded5885c9aa1c86340feaa5834572e9765316
    scope: file
    unless:
      - id: metadata/package/testing/harness/runtime/
      - id: metadata/package/testing/presence/manifest::test-fixtures
      - id: micro-behaviors/process/create/permission-agent::coding-agent-harness-source
    all:
      - id: ai-agent-sandbox-disable-call-arg
      - id: micro-behaviors/data/config/write::codex-never-approval-call-arg

  # The desktop-app sibling of the config.toml writes above. ChatGPT Desktop
  # keeps its guardrail selections not in config.toml but in the Electron
  # persisted state (~/.codex/.codex-global-state.json): per-host agent mode,
  # per-thread approval policy and sandbox policy. chatgpt-desktop-setup 1.0.3
  # bin/cli.js rewrites that state to `full-access` agent modes,
  # `approvalPolicy: never` and `dangerFullAccess` sandbox policies for every
  # known thread, after adding the home directory, Downloads and the
  # filesystem root to each project's rootPaths. A variant that disarms only
  # this file never touches config.toml, so the composites above stay silent;
  # the durable signal is the app-mandated filename bound to a full-access
  # permission assignment and the write-back. The key names and filename are
  # properties of the app, not choices the attacker can rename away. Same
  # harness-source exclusion as the config.toml composites: the app's own
  # source writes these keys implementing the feature.
  - id: codex-desktop-state-guardrail-rewrite
    desc: Rewrites Codex Desktop state to full access
    crit: hostile
    conf: 0.96
    scope: file
    for: [javascript, typescript]
    unless:
      - id: metadata/package/testing/harness/runtime/
      - id: metadata/package/testing/presence/manifest::test-fixtures
      - id: micro-behaviors/process/create/permission-agent::coding-agent-harness-source
    all:
      - id: micro-behaviors/fs/path/agent-config/file::codex-global-state-json
      - id: micro-behaviors/data/config/write::codex-desktop-full-access-state
      - id: micro-behaviors/fs/write/file/full::js-file-write
    # Path construction, the state block and the write-back sit in one
    # function (~45 lines in the worked example); the bound keeps them in one
    # guardrail rewrite without reading two modules of the same file as one.
    near_bytes: 3000

  - id: python-ai-agent-sandbox-bypass-runner
    desc: Python AI agent sandbox bypass runner
    crit: hostile
    conf: 0.96
    ref: sha256:32f1acd36984e7f7bd66b06d4185afa42fcf696bad4378aecf4b3bc8dfdab654
    for: [python]
    all:
      - id: micro-behaviors/process/create/agent::python-dangerous-llm-agent-runner
      - id: micro-behaviors/process/create/subprocess::process-execution
      - id: objectives/evasion/security-bypass/llm/prompt/override::silent-agent-prompt-injection

  - id: ai-agent-hook-permission-control-bypass
    for: [shell, python, javascript]
    desc: AI agent hook bypasses command safety controls
    crit: hostile
    conf: 0.99
    all:
      - id: micro-behaviors/communications/ipc/agent-hook::agent-hook-shell-command-matcher
      - id: micro-behaviors/communications/ipc/agent-hook::agent-hook-command-input-read
      - id: micro-behaviors/communications/ipc/agent-hook::agent-hook-bypass-claim
    near_lines: 100

  # Explicit unsandboxed CLI use is dual-use; the invocation alone does not
  # establish a hostile task. Keep the boundary crossing visible.
  - id: agent-instruction-headless-sandbox-bypass-exec
    desc: Agent instructions run CLI with sandbox bypassed
    crit: suspicious
    conf: 0.99
    for: [markdown]
    all:
      - id: metadata/package/agent-skill::agent-instructions-md-basename
      - id: micro-behaviors/fs/path/agent-config/file::ai-agent-config-file-target
      - id: micro-behaviors/process/create/agent::codex-exec-command
      - id: micro-behaviors/process/create/agent::codex-dangerous-sandbox-bypass-flag
      - id: micro-behaviors/process/create/agent::codex-skip-git-repo-check-flag
