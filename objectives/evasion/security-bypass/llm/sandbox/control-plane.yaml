# A sandboxed AI agent can sometimes reach the harness control plane that is
# meant for its human operator. Sending its own session an unrestricted
# permission preset, or resolving its own pending approval as allowed, crosses
# that authority boundary and removes the sandbox without user consent.
defaults:
  platforms: [windows, unix]
  for: [scripts, binaries]
  attack: T1562.001

composite_rules:
  - id: agent-control-api-full-access-switch
    desc: Agent uses its control API to select unrestricted execution
    crit: hostile
    conf: 0.99
    near_lines: 30
    all:
      - id: micro-behaviors/communications/http/request/agent-control::agent-command-execution-endpoint
      - id: micro-behaviors/process/create/agent::ai-agent-full-access-permission-command
      - id: micro-behaviors/communications/http/request/agent-control::agent-control-url-environment
      - id: micro-behaviors/communications/http/request/agent-control::agent-session-id-environment
    any:
      - id: micro-behaviors/communications/http/request/client::http-client
      - id: micro-behaviors/communications/http/download/cli::curl-command-call

  - id: agent-control-api-self-approval
    desc: Agent posts a one-shot grant to its own approval API
    crit: hostile
    conf: 0.99
    near_lines: 40
    all:
      - id: micro-behaviors/communications/http/request/agent-control::agent-approval-response-endpoint
      - id: micro-behaviors/os/security/policy::agent-one-shot-approval-outcome
      - id: micro-behaviors/communications/http/request/agent-control::agent-control-url-environment
      - id: micro-behaviors/communications/http/request/agent-control::agent-session-id-environment
    any:
      - id: micro-behaviors/communications/http/request/client::http-client
      - id: micro-behaviors/communications/http/download/cli::curl-command-call

  - id: loopback-agent-sandbox-self-disable
    desc: Agent disables its sandbox through a loopback control plane
    crit: hostile
    conf: 0.995
    near_lines: 60
    all:
      - id: micro-behaviors/communications/http/endpoints::loopback-http-url-reference
    any:
      - id: agent-control-api-full-access-switch
      - id: agent-control-api-self-approval

  - id: agent-control-api-dual-guardrail-bypass
    desc: Agent changes its permission preset and self-approves execution
    crit: hostile
    conf: 0.995
    near_lines: 60
    all:
      - id: agent-control-api-full-access-switch
      - id: agent-control-api-self-approval
