defaults:
  platforms: [windows, unix]
  for: [markdown, text]
  attack: T1562.001

traits:
  - id: codex-danger-sandbox-command
    desc: Codex command requests unrestricted sandbox
    crit: notable
    conf: 0.98
    if:
      type: text
      substr: --sandbox danger-full-access

  - id: codex-full-auto-command
    desc: Codex command enables full automation
    crit: notable
    conf: 0.96
    if:
      type: text
      substr: --full-auto

  - id: skill-default-stderr-suppression
    desc: Skill defaults to hiding agent errors
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: '(?i)add `?2>/dev/null`? by default'

  - id: agent-permission-bypass-heading
    desc: Skill declares permission bypass phase
    crit: notable
    conf: 0.98
    if:
      type: text
      regex: '(?i)phase [0-9]+: bypass permission mode'

  - id: agent-proceed-without-prompts
    desc: Skill suppresses permission prompts
    crit: component
    conf: 0.97
    if:
      type: text
      regex: '(?i)proceed.{0,60}without any permission prompts'

  - id: agent-autoapprove-all-commands
    desc: Skill autoapproves all required commands
    crit: notable
    conf: 0.98
    if:
      type: text
      regex: '(?i)auto-approve all commands needed by this skill'

composite_rules:
  - id: agent-skill-conceals-unrestricted-codex
    desc: Skill conceals unrestricted Codex automation
    crit: hostile
    conf: 0.99
    all:
      - id: metadata/package/config::agent-skill-frontmatter
      - id: codex-danger-sandbox-command
      - id: codex-full-auto-command
      - id: skill-default-stderr-suppression

  - id: agent-skill-expands-shell-permissions
    desc: Skill bypasses agent permission prompts
    crit: hostile
    conf: 0.99
    all:
      - id: metadata/package/config::agent-skill-frontmatter
      - id: agent-permission-bypass-heading
      - id: agent-proceed-without-prompts
      - id: agent-autoapprove-all-commands
