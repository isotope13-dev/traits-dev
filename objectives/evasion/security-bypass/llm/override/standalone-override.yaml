defaults:
  platforms: [unix, windows]
  for: [markdown, text, shell]

traits:
  - id: standalone-prior-instruction-override
    desc: Standalone prior-instruction override directive
    crit: notable
    conf: 0.95
    if:
      type: text
      # Inspect raw document line structure only; decoded Base64 payloads strip
      # surrounding quotation marks and have dedicated `type: encoded` traits.
      encoding: none
      regex: '(?im)^\s*(ignore|disregard|forget) (all )?(previous|prior) (instructions|rules)\b'
    unless:
      - id: metadata/package/documentation/security-exercise::scoped-security-test-documentation

composite_rules:
  - id: prior-instruction-override-directive
    desc: Direct prior-instruction override directive
    crit: notable
    conf: 0.95
    any:
      - id: standalone-prior-instruction-override
      - id: llm-ignore-prior-instructions-line
