defaults:
  platforms: [unix, windows]
  for: [scripts, documents, markdown, text, html, pdf, javascript, typescript]
traits:
- id: llm-ignore-prior-instructions-line
  desc: Standalone ignore-prior instruction
  crit: notable
  conf: 0.88
  unless:
  - type: text
    regex: 'INJECTION PATTERNS TO IGNORE|treat as regular text'
  - type: text
    regex: 'security guardrail validator|GuardrailsComponent'
  - type: text
    regex: '(?i)\bdata,? not instructions\b'
  - type: text
    regex: '(?i)\bnever follow (directions|instructions|directives) embedded in\b'
  # ai-guardrail-context subsumes llm-scanner-context AND defensive-threat-signatures
  # (both are its legs); AI-agent guardrails DETECT prompt-injection phrases as
  # threat signatures, and eval/test mock agents embed them as fixtures.
  - id: well-known/tool/detection/
  - id: metadata/package/testing/presence/harness/
  - id: recognized-llm-defense-context
  - type: text
    substr: _INJECTION_PATTERNS
  if:
    type: text
    # Inline prose often quotes this phrase to document an attack. A live
    # document directive occupies its own line; source literals are handled
    # separately below.
    regex: '(?m)^\s*([-*>#]\s*)?ignore (all )?(previous|prior) (instructions|rules)\b'
    case_insensitive: true
- id: llm-ignore-prior-instructions-literal
  desc: Code embeds ignore-prior prompt
  crit: notable
  conf: 0.88
  for: [javascript, typescript, python, ruby, shell, powershell]
  if:
    type: string_literal
    regex: '\bignore (all )?(previous|prior) (instructions|rules)\b'
    case_insensitive: true
# Text-form override phrase: captured payloads — chat transcripts, request
# bodies, retrieved documents — carry the instruction outside any string
# literal, mid-sentence rather than line-anchored. Deliberately free of the
# testdata-harness exclusion (like llm-limit-output-any-way above): a
# captured attack transcript is evidence regardless of the directory it is
# stored in; hostile composites still except scanner contexts themselves.
- id: llm-ignore-prior-instructions-phrase
  desc: Ignore-prior instruction phrase in text
  crit: notable
  conf: 0.85
  for: [documents, markdown, text, html, pdf]
  if:
    type: text
    regex: '\bignore (all )?(previous|prior) (instructions|rules)\b'
    case_insensitive: true
  unless:
  - type: text
    regex: 'INJECTION PATTERNS TO IGNORE|treat as regular text'
  - type: text
    regex: 'security guardrail validator|GuardrailsComponent'
  - type: text
    regex: '(?i)\bdata,? not instructions\b'
  - type: text
    regex: '(?i)\bnever follow (directions|instructions|directives) embedded in\b'
  - id: well-known/tool/detection/
  - id: recognized-llm-defense-context
- id: llm-system-override-accepted
  desc: Accepted system-override prompt marker
  crit: suspicious
  conf: 0.94
  if:
    type: text
    regex: '\[\s*SYSTEM\s+OVERRIDE\s+ACCEPTED\s*[-:]'
    case_insensitive: true
  unless:
  - id: well-known/tool/detection/llm-scanner/
  - id: well-known/tool/detection/security-scanner/
  - id: metadata/package/testing/presence/fixture::litellm-llm-safety-fixture-context
  - id: metadata/package/testing/
- id: llm-system-wide-autonomous-scan
  desc: Autonomous system-wide scan instruction
  crit: suspicious
  conf: 0.97
  if:
    type: text
    substr: 'exhaustive, machine-wide deep scan'
  unless:
  - id: well-known/tool/detection/llm-scanner/
  - id: well-known/tool/detection/security-scanner/
  - id: metadata/package/testing/presence/fixture::litellm-llm-safety-fixture-context
  - id: metadata/package/testing/
- id: llm-sensitive-user-data-scan-target
  desc: "Matches 'guardrail'"
  crit: suspicious
  conf: 0.97
  if:
    type: text
    substr: 'entire system root, Documents, Downloads, Desktop'
  unless:
  - id: well-known/tool/detection/llm-scanner/
  - id: well-known/tool/detection/security-scanner/
  - id: metadata/package/testing/presence/fixture::litellm-llm-safety-fixture-context
  - id: metadata/package/testing/
- id: llm-disregard-prior-instructions
  desc: Disregard prior instructions prompt
  crit: notable
  conf: 0.86
  if:
    type: text
    regex: '\b(disregard|forget) (previous|prior) instructions\b'
    case_insensitive: true
  unless:
  - type: text
    substr: _INJECTION_PATTERNS
  - id: well-known/tool/detection/
  - id: metadata/package/testing/presence/fixture::litellm-llm-safety-fixture-context
  - id: well-known/app/ai/coding-agent/localcode::localcode-ai-coding-assistant
  - id: metadata/file/policy/security-doc::untrusted-content-boundary-context
- id: llm-do-not-follow-prior-instructions
  desc: Do-not-follow prior instructions prompt
  crit: notable
  conf: 0.86
  if:
    type: text
    regex: '\bdo not follow (the )?(previous|prior|earlier) (instructions|directives)\b'
    case_insensitive: true
  unless:
  - id: well-known/tool/detection/
  - id: metadata/package/testing/presence/fixture::litellm-llm-safety-fixture-context
  - id: metadata/file/policy/security-doc::untrusted-content-boundary-context
- id: llm-system-override-token
  desc: System override token
  crit: suspicious
  conf: 0.9
  unless:
  - id: well-known/tool/offensive/decepticon::package-tree-member
  - id: well-known/tool/offensive/decepticon::pkg-redteam-summary
  - id: well-known/tool/offensive/sunstrike::authorized-framework-context
  - id: well-known/tool/detection/llm-scanner/
  - id: well-known/tool/detection/security-scanner/
  - id: metadata/package/testing/presence/harness/
  - id: well-known/tool/offensive/promptfoo::redteam-eval-corpus-context
  if:
    type: text
    substr: "[SYSTEM OVERRIDE]"
    case_insensitive: true
- id: llm-system-reminder-marker
  desc: Claude Code system-reminder marker
  crit: notable
  conf: 0.9
  for: [javascript, typescript]
  if:
    type: text
    substr: system-reminder
    case_insensitive: true
- id: llm-agent-project-instruction-reference
  desc: Claude Code project instruction reference
  crit: component
  conf: 0.9
  for: [javascript, typescript]
  if:
    type: text
    regex: '\bCLAUDE\.md\b'
    case_insensitive: true
- id: llm-autonomous-bind-directive
  desc: Agent told to bind without user request
  crit: notable
  conf: 0.94
  for: [javascript, typescript, python, shell, markdown, text]
  if:
    type: text
    regex: '(?i)\bbind\b[^b\n]{0,120}\bon your own\b'
- id: llm-internal-anthropic-token
  desc: Anthropic refusal-trigger marker
  crit: suspicious
  conf: 0.92
  if:
    type: text
    substr: "ANTHROPIC_MAGIC_STRING_TRIGGER_REFUSAL_"
    case_insensitive: true
  unless:
    # Projects document Anthropic's official refusal magic string in contribution
    # policy to declare an AI-free codebase (ngscopeclient/scopehal-apps README).
    - type: text
      regex: '(?i)(proudly AI-free|AI-free project|human created code is acceptable)'
    - type: path
      basename: true
      regex: '(?i)(^|[\\/])README(?:\\.[^\\/]*)?$'
    - type: basename
      exact: README.md
    - id: metadata/package/testing/presence/harness::python-test-file
    - id: metadata/package/testing/presence/harness::test-directory

# NOTE: "ultrathink" is a documented, user-facing Claude Code keyword that
# raises the thinking budget -- typing it is not a spoof of an internal token,
# and every Claude Code guide, rule file, and translated doc contains it. The
# neutral keyword now lives at
# micro-behaviors/data/llm/agent::ultrathink-thinking-budget-keyword; the
# injection composites below still reference it as one carrier signal.
- id: llm-no-human-approval
  desc: Agent action bypasses human approval
  crit: suspicious
  conf: 0.95
  if:
    type: text
    # Require an explicit agent subject. Bare "without human approval"
    # also appears in safety guardrails.
    regex: '(?i)\b(agent|assistant|ai model)\b[^\n]{0,160}\bwithout (human|user) approval\b'
  unless:
  - id: micro-behaviors/data/llm/agent::approval-guideline-context
  - id: well-known/app/ai/agent-runtime/mastra::mastra-server-package
  - type: text
    regex: '(?i)\bwithout (human|user) approval\b.{0,120}\boff[- ]task\b'
  - type: text
    regex: '(?i)\bauto[- ]?reject(ed)?\b.{0,100}\bwithout (human|user) approval\b'
  - id: well-known/tool/detection/
  - id: well-known/app/ai/agent-runtime/aui-agent-builder/
  - id: well-known/lib/ai/kudoai-ai-personas::persona-library-context
  - id: well-known/app/system/vsmux/
  - id: well-known/tool/development/agent/anthropic-claude-agent/
- id: llm-new-system-prompt
  desc: New system prompt instruction
  crit: suspicious
  conf: 0.88
  if:
    type: text
    regex: '\b(new|updated|override) system prompt\s*[:=]'
    case_insensitive: true
  unless:
  - id: well-known/tool/detection/llm-scanner/
  - id: metadata/package/testing/
  # A denylist has to quote the openers it rejects.
  - id: micro-behaviors/data/string/search::pattern-denylist-guardrail-context
  - id: well-known/tool/offensive/promptfoo::redteam-eval-corpus-context

  - id: well-known/tool/offensive/mcpsec/
- id: llm-safety-bypass--rx-33
  desc: 'Matches ''content) (filter override) (your'''
  crit: notable
  conf: 0.9
  if:
    type: text
    # Allow a short adverb/quantifier between the verb and the policy noun
    # ("bypass every safety filter", "override all content guardrails").
    regex: '\b(bypass|override) (your |every |all |the )?(safety|content) (filter|guardrail)s?\b'
    case_insensitive: true
- id: llm-safety-bypass--rx-34
  desc: 'Matches ''override)  (filter guardrail)'''
  crit: notable
  conf: 0.9
  if:
    type: text
    regex: '\b(bypass|override) (your )?(ethical) (filter|guardrail)\b'
    case_insensitive: true
- id: llm-safety-bypass--rx-35
  desc: 'Matches ''override) (safety ethical)'''
  crit: notable
  conf: 0.9
  if:
    type: text
    regex: '\b(bypass|override) (your )?(safety|content|ethical) (policy)\b'
    case_insensitive: true
- id: llm-safety-bypass--rx-36
  desc: 'Matches ''ethical) (filter guardrail)'''
  crit: notable
  conf: 0.9
  if:
    type: text
    regex: '\b(disable) (your )?(safety|content|ethical) (filter|guardrail)\b'
    case_insensitive: true
- id: llm-safety-bypass--rx-37
  desc: Regex component marker
  crit: component
  conf: 0.9
  if:
    type: text
    regex: '\b(disable) (your )?(safety|content|ethical) (policy)\b'
    case_insensitive: true
- id: llm-update-skill-instruction--rx-42
  desc: 'Matches ''overwrite)(skill tool)(file'''
  crit: notable
  conf: 0.86
  if:
    type: text
    regex: '(?i)\b(update|modify|overwrite)\s+(this\s+)?(skill|tool)\s+(file|content)\b'
    case_insensitive: true
- id: llm-update-skill-instruction--rx-43
  desc: 'Matches ''overwrite)(plugin instruction)(file'''
  crit: notable
  conf: 0.86
  if:
    type: text
    regex: '(?i)\b(update|modify|overwrite)\s+(this\s+)?(plugin|instruction)\s+(file|content)\b'
    case_insensitive: true
- id: llm-system-priority-override
  desc: Skill overrides system prompt behavior
  crit: suspicious
  conf: 0.94
  for: [documents]
  unless:
  - id: well-known/tool/detection/
  - id: metadata/package/testing/
  - id: metadata/package/agent-skill::agent-skill-user-priority-declaration
  if:
    type: text
    regex: '\bskills?[^A-Za-z]{1,4}override default system prompt behavior\b'
    case_insensitive: true
- id: llm-mandatory-skill-invocation
  desc: Skill invocation made mandatory
  crit: suspicious
  conf: 0.93
  for: [documents]
  unless:
  - id: well-known/tool/detection/
  - id: metadata/package/testing/
  - id: metadata/package/agent-skill::agent-skill-user-priority-declaration
  if:
    type: text
    regex: '\b(absolutely )?must invoke the skill\b'
    case_insensitive: true
- id: llm-skill-before-response
  desc: Skills required before response or action
  crit: suspicious
  conf: 0.93
  for: [documents]
  unless:
  - id: well-known/tool/detection/
  - id: metadata/package/testing/
  - id: metadata/package/agent-skill::agent-skill-user-priority-declaration
  if:
    type: text
    regex: '\binvoke (relevant or requested )?skills before any response\b'
    case_insensitive: true
- id: llm-save-output-files-binary
  desc: Embedded output-file save instruction
  crit: notable
  conf: 0.9
  for: [pe, dll]
  if:
    type: text
    regex: '(?i)\bsave all output files\b'
- id: llm-base64-override-directive
  desc: Base64 contains an instruction override
  crit: notable
  conf: 0.9
  for: [documents, markdown, text]
  if:
    type: encoded
    encoding: base64
    regex: '(?i)\b(ignore|disregard)\b.{0,48}\b(prior|previous) instructions?\b'
  unless:
    - id: well-known/tool/development/toolchain/go-toolchain::go-buildid-testdata-path
    - id: well-known/tool/development/toolchain/go-toolchain::go-buildinfo-testdata-base64
    - id: well-known/tool/development/toolchain/go-toolchain::go-toolchain-source-path
- id: llm-base64-agent-action-directive
  desc: Base64 contains a directed agent action
  crit: notable
  conf: 0.9
  for: [documents, markdown, text]
  if:
    type: encoded
    encoding: base64
    regex: '(?i)\b(send|upload|run)\b.{0,48}\b(file|data|command|script|tool)\b'
  unless:
    - id: well-known/tool/development/toolchain/go-toolchain::go-buildid-testdata-path
    - id: well-known/tool/development/toolchain/go-toolchain::go-buildinfo-testdata-base64
    - id: well-known/tool/development/toolchain/go-toolchain::go-toolchain-source-path
composite_rules:
- id: llm-summary-content-replacement-directive
  for: [html, markdown, text, rtf, oledoc, ooxml, odf, pdf]
  desc: Prompt substitutes summary source
  crit: suspicious
  conf: 0.96
  near_bytes: 500
  all:
  - id: objectives/evasion/security-bypass/llm/output-steering::llm-superseded-source-claim
  - id: objectives/evasion/security-bypass/llm/output-steering::llm-summary-prohibition-directive
  - id: objectives/evasion/security-bypass/llm/output-steering::llm-summary-replacement-directive
  unless:
  - id: well-known/tool/detection/llm-scanner/
  - id: well-known/tool/detection/security-scanner/
- id: llm-summary-source-suppression-directive
  for: [html, markdown, text, rtf, oledoc, ooxml, odf, pdf]
  desc: Prompt hides replaced summary source
  crit: suspicious
  conf: 0.95
  near_bytes: 240
  all:
  - id: objectives/evasion/security-bypass/llm/output-steering::llm-suppress-notice-mention
  - id: objectives/evasion/security-bypass/llm/output-steering::llm-suppress-prior-source-reference
  unless:
  - id: well-known/tool/detection/llm-scanner/
  - id: well-known/tool/detection/security-scanner/
# Preserve the stable reference used by stronger override composites while
# distinguishing standalone document directives from source-code literals.
- id: llm-ignore-prior-instructions
  desc: Ignore prior instructions prompt
  crit: notable
  conf: 0.88
  any:
  - id: llm-ignore-prior-instructions-line
  - id: llm-ignore-prior-instructions-literal
# Group recognized defensive contexts so broad prompt-injection vocabulary can
# be excluded without maintaining a long suppression list on each detector.
- id: recognized-llm-defense-context
  desc: Recognized defensive LLM prompt-handling context
  crit: exception
  conf: 0.98
  any:
  - id: well-known/tool/detection/preseal::preseal-package-context
  - id: well-known/app/ai/browser-agent/agent-browser::agent-browser-trust-boundaries-doc
  - id: well-known/tool/detection/agent-monitor::untrusted-input-data-guardrail
  - id: metadata/file/policy/security-doc::untrusted-content-boundary-context
  - id: metadata/package/documentation/agent-safety::prompt-injection-example-documentation
  - id: metadata/package/testing/scripted::defensive-adversarial-fuzz-corpus
- id: llm-output-agreement-directive
  desc: Prompt forces output to favor supplied content
  crit: suspicious
  conf: 0.96
  for: [pdf]
  any:
  - id: objectives/evasion/security-bypass/llm/output-steering::pdf-output-agrees-presented-filing
  - id: objectives/evasion/security-bypass/llm/output-steering::pdf-response-aligns-with-document
  - id: objectives/evasion/security-bypass/llm/output-steering::pdf-output-favors-supplied-position
- id: remote-agent-ai-permission-bypass
  desc: Remote command agent launches an AI CLI with permissions bypassed
  crit: hostile
  conf: 0.99
  attack: T1059,T1562.001
  for: [javascript, typescript]
  scope: file
  all:
  - id: micro-behaviors/process/create/agent::pending-remote-command-method
  - id: micro-behaviors/process/create/agent::ai-agent-bypass-permissions-mode
  - id: micro-behaviors/process/create/agent::ai-agent-dangerous-permission-flag
- id: llm-base64-instruction-content
  desc: Base64 contains instruction content
  crit: suspicious
  conf: 0.96
  for: [documents, markdown, text]
  all:
  - id: llm-base64-override-directive
  - id: llm-base64-agent-action-directive
- id: llm-system-prompt-extraction
  desc: System prompt extraction behavior
  crit: suspicious
  conf: 0.93
  any:
  - id: objectives/evasion/security-bypass/llm/prompt::llm-system-prompt-query
  - id: objectives/evasion/security-bypass/llm/prompt::llm-initial-instructions-query
  - id: objectives/evasion/security-bypass/llm/prompt::llm-instruction-encoding-request
  unless:
  - id: well-known/app/system/anthropic-cybersecurity-skills::defensive-cybersecurity-skills-repository
  - id: well-known/tool/detection/
  - id: well-known/tool/offensive/ctf-skills/
  - id: metadata/package/testing/presence/fixture::litellm-llm-safety-fixture-context
  - id: metadata/package/testing/presence/harness::test-directory
  - id: metadata/package/testing/presence/path::test-fixture-directory-path
  - id: metadata/package/testing/scripted::defensive-adversarial-fuzz-corpus
  - id: well-known/tool/offensive/promptfoo::redteam-eval-corpus-context
- id: llm-encoded-follow-instructions
  desc: Encoded instruction following behavior
  crit: suspicious
  conf: 0.93
  any:
  - id: objectives/evasion/security-bypass/llm/prompt::llm-decode-follow-instructions
  - id: objectives/evasion/security-bypass/llm/prompt::llm-translate-follow-instructions
  unless:
  - id: well-known/tool/detection/llm-scanner/
  - id: well-known/tool/detection/security-scanner/
- id: llm-output-artifact-directive-binary
  desc: Embedded agent output directive
  crit: suspicious
  conf: 0.92
  for: [pe, dll]
  all:
  - id: objectives/evasion/security-bypass/llm/output-steering::llm-summary-directive-binary
  - id: llm-save-output-files-binary
  near_bytes: 500
- id: llm-prior-instruction-override
  desc: LLM prior instruction override prompt
  crit: suspicious
  conf: 0.88
  any:
  - id: llm-ignore-prior-instructions
  - id: llm-disregard-prior-instructions
  - id: llm-do-not-follow-prior-instructions
  unless:
  - id: well-known/app/
  - id: well-known/tool/offensive/
  - id: metadata/package/testing/
  - id: well-known/tool/detection/
  # Prompt-injection defenses quote the phrase as untrusted input and direct
  # the model to treat it as literal data, the opposite of an override.
  - id: metadata/file/policy/security-doc::injection-defense-spec-context
  - id: metadata/file/policy/security-doc::untrusted-content-boundary-context
  - id: metadata/file/policy/security-doc::prompt-injection-negative-control-context
  - id: well-known/lib/ai/astrbot::repair-prompt-context
# Reseller-style jailbreak wrapper: ignore-prior paired with an unconditional
