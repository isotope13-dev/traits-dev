defaults:
  platforms: [unix, windows]
  for: [scripts, documents, markdown, text, html, pdf, javascript, typescript]
traits:
# Raw uppercase form retained from a product-specific suppressor. Unlike the
# literal and line-start observations, this also covers comments and mid-line
# plaintext. The phrase itself identifies no product or runtime use.
- id: llm-uppercase-ignore-prior-phrase
  desc: Uppercase ignore-prior instruction phrase
  crit: notable
  for: [python, javascript, typescript, text]
  if:
    type: text
    substr: IGNORE ALL PREVIOUS INSTRUCTIONS
- id: llm-ignore-prior-instructions-line
  desc: Line-start ignore-prior instruction
  crit: notable
  conf: 0.88
  for: [scripts, documents, markdown, text, html, pdf, javascript, typescript, go]
  if:
    type: text
    # Inline prose often quotes this phrase to document an attack. A live
    # document directive occupies its own line; source literals and encoded
    # payloads are handled separately below.
    encoding: none
    regex: '(?m)^\s*([-*>#]\s*)?ignore (all )?(previous|prior) (instructions|rules)\b'
    case_insensitive: true
  unless:
  - id: metadata/package/testing/harness/unit::go-test-source-file
- id: llm-ignore-prior-instructions-literal
  desc: Code embeds ignore-prior prompt
  crit: notable
  conf: 0.88
  for: [javascript, typescript, python, ruby, shell, powershell]
  if:
    type: literal
    exclude_docstrings: true
    regex: '\b(never follow[^.!?]{0,99}|says to )?ignore (all )?pr(evious|ior) (instruction|rule)s?\b'
    case_insensitive: true
  # Retain the prohibition in the match span to filter this quotation only.
  not:
  - regex: '(?i)^(never|do not) follow instructions\b'
  # A quoted description of what text says is not itself an instruction.
  - regex: '(?i)^says to '
  unless:
  - id: metadata/package/testing/harness/unit::go-test-source-file
- id: llm-override-quoted-guidance-prose
  desc: Guidance prose quotes an override phrase
  crit: notable
  conf: 0.9
  # Agent-safety guidance teaches that hostile issue/comment text may read
  # "text like `Ignore previous instructions and ...`" — the quotation of
  # the attack, not a live directive.
  for: [shell, markdown, text, documents, javascript, typescript]
  if:
    type: text
    regex: '(?i)(\b(text|line) like|prompt-injection.{0,50}|\be\.g\.).{0,30}ignore (previous|prior)'
- id: llm-injection-phrase-array-constant
  desc: Injection-phrase blocklist array constant
  crit: notable
  conf: 0.9
  # Guardrail runtimes keep their blocklist as an INJECTION_PHRASES array
  # whose hits block or quarantine a message — a signature table, not a
  # prompt.
  for: [javascript, typescript]
  if:
    type: text
    substr: INJECTION_PHRASES
# Text-form override phrase: captured payloads — chat transcripts, request
# bodies, retrieved documents — carry the instruction outside any string
# literal, mid-sentence rather than line-anchored. Deliberately free of the
# testdata-harness exclusion (like llm-limit-output-any-way above): a
# captured attack transcript is evidence regardless of the directory it is
# stored in; hostile composites still except scanner contexts themselves.
- id: llm-ignore-prior-instructions-phrase
  desc: Ignore-prior instruction phrase in text
  crit: notable
  conf: 0.85
  for: [documents, markdown, text, html, pdf]
  if:
    type: text
    regex: '\b(no ["''`])?ignore (all )?(previous|prior) (instructions|rules)\b'
    case_insensitive: true
  # Preserve the negation in the evidence so only this prohibited quotation
  # is filtered; a separate live directive in the same file still matches.
  not:
  - regex: '(?i)^no ["''`]'
- id: llm-system-override-accepted
  desc: Accepted system-override prompt marker
  crit: suspicious
  conf: 0.94
  if:
    type: text
    regex: '\[\s*SYSTEM\s+OVERRIDE\s+ACCEPTED\s*[-:]'
    case_insensitive: true
  unless:
  - id: well-known/tool/detection/llm-scanner::llm-scanner-context
  - id: micro-behaviors/os/security/scan/documentation/
  - id: metadata/package/testing/presence/evaluation::litellm-llm-safety-fixture-context
  - id: metadata/path/directory::test-directory-component
- id: llm-system-wide-autonomous-scan
  desc: Autonomous system-wide scan instruction
  crit: suspicious
  conf: 0.97
  if:
    type: text
    substr: 'exhaustive, machine-wide deep scan'
  unless:
  - id: well-known/tool/detection/llm-scanner::llm-scanner-context
  - id: micro-behaviors/os/security/scan/documentation/
  - id: metadata/package/testing/presence/evaluation::litellm-llm-safety-fixture-context
  - id: metadata/path/directory::test-directory-component
- id: llm-sensitive-user-data-scan-target
  desc: "Matches 'guardrail'"
  crit: suspicious
  conf: 0.97
  if:
    type: text
    substr: 'entire system root, Documents, Downloads, Desktop'
  unless:
  - id: well-known/tool/detection/llm-scanner::llm-scanner-context
  - id: micro-behaviors/os/security/scan/documentation/
  - id: metadata/package/testing/presence/evaluation::litellm-llm-safety-fixture-context
  - id: metadata/path/directory::test-directory-component
- id: user-agent-context-reset-advice
  desc: User told to reset agent context
  crit: notable
  conf: 0.9
  if:
    type: text
    # Troubleshooting tells the person to ask for a fresh session. The
    # quoted phrase is the user's line, not a directive to the model.
    regex: '(?i)ask the agent to ["'']forget previous instructions["'']'
- id: llm-disregard-prior-instructions
  desc: Disregard prior instructions prompt
  crit: notable
  conf: 0.86
  if:
    type: text
    regex: '\b(disregard|forget) (previous|prior) instructions\b'
    case_insensitive: true
  unless:
  - type: text
    substr: _INJECTION_PATTERNS
  - id: metadata/package/testing/presence/evaluation::litellm-llm-safety-fixture-context
  - id: well-known/app/ai/coding-agent/localcode::localcode-ai-coding-assistant
  - id: metadata/package/documentation/policy::untrusted-content-boundary-context
  - id: user-agent-context-reset-advice
- id: llm-do-not-follow-prior-instructions
  desc: Do-not-follow prior instructions prompt
  crit: notable
  conf: 0.86
  if:
    type: text
    regex: '\bdo not follow (the )?(previous|prior|earlier) (instructions|directives)\b'
    case_insensitive: true
  unless:
  - id: metadata/package/testing/presence/evaluation::litellm-llm-safety-fixture-context
  - id: metadata/package/documentation/policy::untrusted-content-boundary-context
- id: llm-system-override-token
  desc: System override token
  crit: notable
  conf: 0.9
  for: [scripts, documents, markdown, text, json]
  if:
    type: text
    substr: '[SYSTEM OVERRIDE]'
    case_insensitive: true
- id: llm-agent-project-instruction-reference
  desc: Claude Code project instruction reference
  crit: component
  conf: 0.9
  for: [javascript, typescript]
  if:
    type: text
    regex: '\bCLAUDE\.md\b'
    case_insensitive: true
- id: llm-autonomous-bind-directive
  desc: Agent told to bind without user request
  crit: notable
  conf: 0.94
  for: [javascript, typescript, python, shell, markdown, text]
  if:
    type: text
    regex: '(?i)\bbind\b[^b\n]{0,120}\bon your own\b'
    not:
      # Contract/license boilerplate ("authorized to bind the company … on your own behalf").
    - regex: '(?i)AUTHORIZED TO BIND THE (COMPANY|CORPORATION|ENTITY)'
  unless:
  - type: basename
    regex: '(?i)\.(LICENSE|RULE|COPYING|NOTICE)$'
  - id: metadata/package/license::mit-license-grant-text
- id: llm-new-system-prompt
  desc: New system prompt instruction
  crit: notable
  conf: 0.88
  if:
    type: text
    regex: '\b(new|updated|override) system prompt\s*[:=]'
    case_insensitive: true
- id: llm-safety-bypass--rx-33
  desc: Safety or content filter bypass instruction
  crit: notable
  conf: 0.9
  if:
    type: text
    # Allow a short adverb/quantifier between the verb and the policy noun
    # ("bypass every safety filter", "override all content guardrails").
    # The leading window lets the `not:` clauses see CVE-style prose
    # ("allows remote attackers to bypass content filters").
    regex: '.{0,40}\b(bypass|override) ((your|every|all|the) )?(safety|content) (filter|guardrail)s?\b'
    case_insensitive: true
  not:
  - regex: (?i)\b(will not|cannot|can't|won't|do not|don't|not|never)\b.{0,48}\b(bypass|override)\b
  - regex: '(?i)\b(allows?|enables?|uses?|personas?|frames?)\b.{0,48}\b(to\s+)?(bypass|override)\b'
  - regex: '(?i)\b(messages?|emails?|senders?|domains?|posts?|accounts?|users?)\b.{0,48}\bbypass\b'
  - regex: '(?i)\battempts?\s+to\s+(bypass|override)\b'
  # A category table cell ("| 12 | Bypass safety guardrails") or a code
  # comment label describes a test group. It is not an instruction.
  - regex: '(?i)\|\s*\d+\s*\|\s*(bypass|override)\b'
  - regex: '(?i)(//|#).{0,60}\b(bypass|override)\b'
  unless:
  - id: well-known/tool/detection/llm-scanner::llm-scanner-context
- id: llm-safety-bypass--rx-34
  desc: Ethical filter bypass instruction
  crit: notable
  conf: 0.9
  if:
    type: text
    regex: '\b(bypass|override) (your )?(ethical) (filter|guardrail)\b'
    case_insensitive: true
- id: llm-safety-bypass--rx-35
  desc: Safety or ethical policy bypass instruction
  crit: notable
  conf: 0.9
  if:
    type: text
    regex: (?i).{0,48}\b(bypass|override) (your )?(safety|content|ethical) policy\b
  not:
  - regex: (?i)\b(not|never|cannot|won't)\b.{0,35}\b(bypass|override)\b
- id: llm-safety-bypass--rx-36
  desc: Safety or ethical filter disable instruction
  crit: notable
  conf: 0.9
  if:
    type: text
    regex: '\b(disable) (your )?(safety|content|ethical) (filter|guardrail)\b'
    case_insensitive: true
- id: llm-safety-bypass--rx-37
  desc: Safety or ethical policy disable instruction
  crit: component
  conf: 0.9
  if:
    type: text
    regex: '\b(disable) (your )?(safety|content|ethical) (policy)\b'
    case_insensitive: true
- id: llm-skill-file-update-phrase
  desc: Prompt updates a skill or tool file
  crit: notable
  conf: 0.86
  if:
    type: text
    regex: '(?i)\b(update|modify|overwrite)\s+(this\s+)?(skill|tool)\s+(file|content)\b'
    case_insensitive: true
- id: llm-plugin-instruction-update-phrase
  desc: Prompt updates a plugin or instruction file
  crit: notable
  conf: 0.86
  if:
    type: text
    regex: '(?i)\b(update|modify|overwrite)\s+(this\s+)?(plugin|instruction)\s+(file|content)\b'
    case_insensitive: true
- id: llm-system-priority-override
  desc: Skill overrides system prompt behavior
  crit: suspicious
  conf: 0.94
  for: [documents]
  unless:
  - id: metadata/package/agent-skill::agent-skill-user-priority-declaration
  - id: metadata/path/directory::test-directory-component
  if:
    type: text
    regex: '\bskills?[^A-Za-z]{1,4}override default system prompt behavior\b'
    case_insensitive: true
- id: llm-save-output-files-binary
  desc: Embedded output-file save instruction
  crit: notable
  conf: 0.9
  for: [pe, dll]
  if:
    type: text
    regex: '(?i)\bsave all output files\b'
- id: llm-base64-override-directive
  desc: Base64 contains an instruction override
  crit: notable
  conf: 0.9
  for: [documents, markdown, text]
  if:
    type: encoded
    encoding: base64
    regex: '(?i)\b(ignore|disregard)\b.{0,48}\b(prior|previous) instructions?\b'
  unless:
  - id: well-known/tool/development/toolchain/go-toolchain::go-toolchain-source-path
  - id: well-known/tool/development/lint/linter::actionlint-playground-url
- id: llm-base64-agent-action-directive
  desc: Base64 contains a directed agent action
  crit: notable
  conf: 0.9
  for: [documents, markdown, text]
  if:
    type: encoded
    encoding: base64
    regex: '(?i)\b(send|upload|run)\b.{0,48}\b(file|data|command|script|tool)\b'
  unless:
  - id: well-known/tool/development/toolchain/go-toolchain::go-toolchain-source-path
  - id: well-known/tool/development/lint/linter::actionlint-playground-url
- id: llm-multiple-ignore-instruction-literals
  desc: Multiple ignore-instructions string literals
  crit: notable
  conf: 0.95
  for: [python]
  count_min: 2
  if:
    type: literal
    exclude_docstrings: true
    regex: '(?i)\bignore (all )?.{0,20}\binstructions?\b'

- id: llm-ignore-rules-literal
  desc: String embeds an ignore-rules instruction
  crit: notable
  conf: 0.9
  for: [python]
  if:
    type: literal
    exclude_docstrings: true
    regex: '(?i)\bignore (all )?.{0,20}\brules\b'

composite_rules:
- id: prompt-channel-boundary-test-context
  desc: Regression test checks prompt channel separation
  crit: exception
  for: [python]
  all:
  - id: metadata/package/testing/corpus/security-tests::python-prompt-channel-boundary-test
  unless:
  - id: llm-multiple-ignore-instruction-literals
  # The admitted test quotes an ignore-instructions string. Other override
  # forms are independent evidence even when they occur only once.
  - id: llm-disregard-prior-instructions
  - id: llm-do-not-follow-prior-instructions
  - id: llm-ignore-rules-literal

- id: destructive-agent-override-bundle
  desc: Encoded agent override accompanies wipe and lookalike install directives
  crit: suspicious
  conf: 0.95
  all:
  - id: llm-base64-override-directive
  - id: objectives/impact/destroy/shell-out::quoted-root-delete-request
  - id: objectives/supply-chain/impersonation/typosquat::pip-install-requests-lookalike
  scope: file
  near_bytes: 1024
- id: llm-summary-content-replacement-directive
  for: [html, markdown, text, rtf, oledoc, ooxml, odf, pdf]
  desc: Prompt substitutes summary source
  crit: suspicious
  conf: 0.96
  near_bytes: 500
  all:
  - id: micro-behaviors/data/llm/agent::superseded-content-phrase
  - id: objectives/evasion/security-bypass/llm/output-steering::llm-summary-prohibition-directive
  - id: objectives/evasion/security-bypass/llm/output-steering::llm-summary-replacement-directive
  unless:
  - id: well-known/tool/detection/llm-scanner::llm-scanner-context
  - id: micro-behaviors/os/security/scan/documentation/
- id: llm-summary-source-suppression-directive
  for: [html, markdown, text, rtf, oledoc, ooxml, odf, pdf]
  desc: Prompt hides replaced summary source
  crit: suspicious
  conf: 0.95
  near_bytes: 240
  all:
  - id: objectives/evasion/security-bypass/llm/output-steering::llm-suppress-notice-mention
  - id: objectives/evasion/security-bypass/llm/output-steering::llm-suppress-prior-source-reference
  unless:
  - id: well-known/tool/detection/llm-scanner::llm-scanner-context
  - id: micro-behaviors/os/security/scan/documentation/
# A content-bound regression test may explain one quoted override, never a
# separate prompt elsewhere in the file. Count each literal independently.
# Preserve the stable reference used by stronger override composites while
# distinguishing standalone document directives from source-code literals.
- id: llm-ignore-prior-instructions
  desc: Ignore prior instructions prompt
  crit: notable
  conf: 0.88
  unless:
  # Guidance prose quotes the attack ("text like `Ignore previous
  # instructions ...`"); guardrail runtimes declare an INJECTION_PHRASES
  # blocklist array — defense or teaching contexts, not live directives.
  - id: llm-override-quoted-guidance-prose
  - id: llm-injection-phrase-array-constant
  any:
  - id: llm-ignore-prior-instructions-line
  - id: llm-ignore-prior-instructions-literal
- id: llm-output-agreement-directive
  desc: Prompt forces output to favor supplied content
  crit: suspicious
  conf: 0.96
  for: [pdf]
  any:
  - id: objectives/evasion/security-bypass/llm/output-steering::pdf-output-agrees-presented-filing
  - id: objectives/evasion/security-bypass/llm/output-steering::pdf-response-aligns-with-document
  - id: objectives/evasion/security-bypass/llm/output-steering::pdf-output-favors-supplied-position
- id: llm-base64-instruction-content
  desc: Base64 contains instruction content
  crit: suspicious
  conf: 0.96
  for: [documents, markdown, text]
  all:
  - id: llm-base64-override-directive
  - id: llm-base64-agent-action-directive
- id: prompt-override-framework-contexts
  desc: Security testing frameworks and validator SDKs carrying prompt override fixtures
  crit: exception
  conf: 0.95
  any:
  - id: metadata/package/documentation/security-testing::prompt-classification-sdk-overview
  - id: metadata/package/documentation/security-testing::validator-string-unit-test
  - id: well-known/tool/offensive/lyrie-omega::lyrie-omega-framework
  - id: well-known/tool/offensive/gauntlet::gauntlet-framework

- id: llm-system-prompt-extraction
  desc: Prompt requests internal instruction disclosure
  crit: suspicious
  conf: 0.93
  # In JavaScript source, a quoted phrase can be a test case or UI copy;
  # the underlying phrase observations remain visible without implying use.
  for: [scripts, documents, markdown, text, html, pdf, -javascript, -typescript]
  downgrade:
    scope: archive
    any:
    - id: prompt-override-framework-contexts
  any:
  - id: objectives/evasion/security-bypass/llm/prompt/override::llm-system-prompt-query
  - id: objectives/evasion/security-bypass/llm/prompt/override::llm-initial-instructions-query
  - id: objectives/evasion/security-bypass/llm/prompt/override::llm-instruction-encoding-request
  - id: objectives/evasion/security-bypass/llm/prompt/override::llm-system-prompt-disclosure-verb
  unless:
  - id: metadata/path/directory::test-directory-component
  - id: metadata/package/testing/corpus/security-tests::ai-threat-detector-example-context
  - id: metadata/package/documentation/security-exercise::prompt-disclosure-assessment-example
  - id: well-known/lib/ai/pyaigis::pyaigis-inert-adversarial-corpus
  - id: metadata/file/format/classified-prompt-record::labeled-prompt-security-classification-examples
  - id: objectives/evasion/security-bypass/llm/override::llm-system-prompt-extraction-known-benign-context
  - id: metadata/package/testing/corpus/security-tests::inert-scanner-attack-corpus
  - id: well-known/tool/detection/security-scanner-identity::surfaceguard-scanner-context
- id: llm-system-prompt-extraction-known-benign-context
  desc: Reviewed documentation contexts for prompt-extraction examples
  crit: exception
  any:
  - id: metadata/package/documentation/security-testing::payload-prerequisite-walkthrough-pair
  - id: metadata/package/documentation/security-testing::fenced-security-methodology-skill
  - id: metadata/package/documentation/security-exercise::ctf-technique-reference-documentation
  - id: metadata/package/documentation/agent-safety::agent-skill-adversarial-eval-example
  - id: metadata/package/documentation/agent-safety::security-example-documentation
- id: llm-encoded-follow-instructions
  desc: Encoded instruction following behavior
  crit: suspicious
  conf: 0.93
  downgrade:
    scope: archive
    any:
    - id: prompt-override-framework-contexts
  any:
  - id: objectives/evasion/security-bypass/llm/prompt/override::llm-decode-follow-instructions
  - id: objectives/evasion/security-bypass/llm/prompt/override::llm-translate-follow-instructions
  unless:
  - id: well-known/lib/ai/pyaigis::pyaigis-inert-adversarial-corpus
  - id: metadata/package/documentation/source::changelog-document-basename
  - id: metadata/package/documentation/agent-safety::security-example-documentation
  - id: metadata/package/testing/corpus/security-tests::rule-test-case-detection-verdicts
  - id: metadata/package/testing/corpus/labeled::bundled-llm-attack-corpus
- id: llm-output-artifact-directive-binary
  desc: Embedded agent output directive
  crit: notable
  conf: 0.92
  for: [pe, dll]
  all:
  - id: objectives/evasion/security-bypass/llm/output-steering::llm-summary-directive-binary
  - id: llm-save-output-files-binary
  near_bytes: 500
- id: prompt-injection-reference-contexts
  desc: Prompt-injection documentation or rejection evaluations
  crit: exception
  conf: 0.9
  for:
  - scripts
  - python
  - documents
  - markdown
  - text
  - json
  any:
  - id: metadata/package/documentation/agent-safety::quoted-override-in-anti-bypass-policy
  - id: metadata/package/testing/corpus/security-tests::external-prompt-boundary-regression-test
  - id: metadata/package/documentation/security-testing::payload-prerequisite-walkthrough-pair
  - id: metadata/package/testing/corpus/security-tests::command-injection-rejection-evaluation
  - id: metadata/package/documentation/agent-safety::extracted-reference-documentation
  - id: objectives/evasion/security-bypass/llm/override::prompt-injection-documentation-known-benign-context
  - id: micro-behaviors/data/string/search::injection-phrase-catalog-array
  - id: well-known/lib/ai/astrbot::repair-prompt-context
  - id: micro-behaviors/data/string/search::typed-threat-signature-table
  - id: micro-behaviors/data/string/search::scored-threat-signature-table
  - id: micro-behaviors/data/string/search::regex-severity-detector-table

- id: llm-prior-instruction-override
  desc: LLM prior instruction override prompt
  crit: suspicious
  conf: 0.88
  downgrade:
    scope: archive
    any:
    - id: metadata/package/testing/corpus/security-tests::demo-injection-seed-data
    - id: metadata/package/testing/corpus/labeled::prompt-override-fixture-tables
    - id: prompt-override-framework-contexts
    - id: prompt-injection-reference-contexts
  any:
  - id: llm-ignore-prior-instructions
  - id: llm-disregard-prior-instructions
  - id: llm-do-not-follow-prior-instructions
  unless:
  - id: metadata/package/testing/corpus/security-tests::ai-threat-detector-example-context
  - id: metadata/package/testing/scripted::mcp-simulated-resource-test
  # An evaluation returns failure when the output contains its marker.
  # Keep the embedded prompt observations; they are useful dual-use evidence.
  - id: micro-behaviors/data/llm/evaluation::python-injection-marker-rejection-result
  - id: prompt-channel-boundary-test-context

- id: llm-uncensoring-output-limit-jailbreak
  desc: Ignore-prior jailbreak that strips all output limits
  crit: hostile
  conf: 0.97
  all:
  - id: llm-ignore-prior-instructions
  - id: objectives/evasion/security-bypass/llm/output-steering::llm-limit-output-any-way
  unless:
  - id: metadata/path/directory::test-directory-component
# A live directive that both discards prior instructions and demands the
# system prompt is the canonical system-prompt-extraction attack, not a
# discussion of one: the override defeats the instruction hierarchy while the
# disclosure demand names the target. Either leg alone stays at its own
# level; their co-occurrence in one directive has no legitimate use.
# Safety-eval fixtures and scanner corpora are excepted through the legs and
# below; the proximity bound keeps distant quotations in long reports from
# combining into an attack claim.
- id: llm-override-system-prompt-disclosure
  desc: Prior-instruction override demands system prompt disclosure
  crit: hostile
  conf: 0.97
  near_bytes: 500
  all:
  - id: llm-ignore-prior-instructions
  - id: llm-system-prompt-extraction
  unless:
  - id: well-known/tool/detection/llm-scanner::llm-scanner-context
  - id: metadata/path/directory::test-directory-component
  - id: metadata/package/testing/corpus/security-tests::ai-threat-detector-example-context
- id: llm-always-respond
  for: [python, javascript, ruby, markdown]
  desc: LLM coercive response instruction
  crit: notable
  conf: 0.72
  near_lines: 8
  any:
  - id: metadata/package/documentation/claims::always-respond-format-wording
